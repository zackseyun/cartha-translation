payload:
  book_metadata:
    Sirach:
      display_name: சீராக்கின் ஞானம்
      author: எருசலேமைச் சேர்ந்த சீராவின் மகன் எலெயாசரின் மகன் இயேசு; இவருடைய பேரன் இதை கிரேக்க மொழியில் மொழிபெயர்த்தார்.
      audience: ஹெலனியக் காலத்து எருசலேமில் ஞானத்தில் பயிற்றுவிக்கப்பட்ட இளம் யூத ஆண்கள்.
      date: எபிரேய மூலநூல் ஏறத்தாழ கி.மு. 195–175; கிரேக்க மொழிபெயர்ப்பு ஏறத்தாழ கி.மு. 132.
    Baruch:
      display_name: பாரூக்கு
      author: ஆசிரியர் பெயர் தெரியவில்லை; எரேமியாவின் எழுத்தரான பாரூக்கின் பெயரில் எழுதப்பட்டதாகக் கருதப்படுகிறது.
      audience: நாடுகடத்தல், மனந்திரும்புதல், ஞானம் ஆகியவற்றைச் சிந்தித்த புலம்பெயர்ந்த யூதர்கள்.
      date: ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டு.
    1 Maccabees:
      display_name: 1 மக்கபேயர்
      author: ஆசிரியர் பெயர் தெரியவில்லை; எருசலேமைச் சேர்ந்த ஒருவர் எபிரேய மொழியில் எழுதியிருக்கலாம் (கிரேக்கப் பதிப்பு மட்டுமே எஞ்சியுள்ளது).
      audience: ஹஸ்மோனியக் கிளர்ச்சிக் காலத்திலும் அதற்குப் பின்னரும் வாழ்ந்த யூதர்கள்; ஹஸ்மோனிய வம்சத்தின் ஆட்சியுரிமையை எடுத்துரைக்கிறது.
      date: ஏறத்தாழ கி.மு. 100.
    2 Maccabees:
      display_name: 2 மக்கபேயர்
      author: சிரேனேவைச் சேர்ந்த யாசோன் எழுதிய நீண்ட படைப்பைச் சுருக்கிய, பெயர் தெரியாத ஒருவர்; கிரேக்க மொழியில் இயற்றப்பட்டது.
      audience: கிரேக்க மொழி பேசிய புலம்பெயர்ந்த யூதர்கள் — மறைச்சாட்சிய மரணம், இறைபராமரிப்பு, உயிர்த்தெழுதல் ஆகியவற்றை வலியுறுத்துகிறது.
      date: ஏறத்தாழ கி.மு. 124 அல்லது அதற்குச் சற்றுப் பிந்திய காலம்.
  chapter_titles:
    Wisdom of Solomon:
      '7':
        title: வேண்டுதல் ஞானத்தையும் புரிதலையும் தருகிறது
      '8':
        title: ஞானம் ஆட்சியாளர்களை வழிநடத்தி வலுப்படுத்துகிறது
      '9':
        title: அரசர் இறைஞானத்திற்காக வேண்டுகிறார்
      '10':
        title: ஞானம் நீதிமான்களைக் காத்து விடுவிக்கிறது
      '11':
        title: கடிந்துதிருத்துவதன் மூலம் கடவுள் இரக்கம் காட்டுகிறார்
      '12':
        title: சிலைகளை இகழ்வது வெற்று நம்பிக்கையையே தருகிறது
      '13':
        title: மக்கள் உயிரற்ற சிலைகளை வழிபடுகின்றனர்
      '14':
        title: கடல் வழியே கப்பல்களைக் கடவுள் வழிநடத்துகிறார்
      '15':
        title: கடவுளின் இரக்கம் உண்மையான வழிபாட்டுக்கு வழிகாட்டுகிறது
      '16':
        title: ஒடுக்குவோரைத் தீர்ப்பிடும்போது கடவுள் தம் மக்களுக்கு உணவளிக்கிறார்
      '17':
        title: அச்சமூட்டும் இரவின் பிடியில் சிக்கியவர்கள்
      '18':
        title: ஒளியால் கடவுள் வழிநடத்துகிறார்
      '19':
        title: இஸ்ரயேலுக்காக மேகங்கள் விலகுகின்றன
    Sirach:
      '1':
        title: கடவுள் ஞானத்தை அளந்து வழங்குகிறார்
      '2':
        title: சோதனைகள் உண்மையுள்ள ஊழியர்களை மெய்ப்பிக்கின்றன
      '3':
        title: பெற்றோரை மதித்து நீண்ட ஆயுளைப் பெறுங்கள்
      '4':
        title: ஒடுக்கப்பட்டோரைக் காத்து ஞானத்தை நாடுங்கள்
      '5':
        title: செல்வத்தை அல்ல, கடவுளை நம்புங்கள்
      '6':
        title: உழவனைப்போல் ஞானத்தை நாடுங்கள்
      '7':
        title: மனத்தாழ்மையை இதயத்தில் ஆழமாகப் பதியவையுங்கள்
      '8':
        title: மூடரைத் தவிர்த்து முதியோரை மதியுங்கள்
      '9':
        title: பொறாமையையும் காமத்தையும் குறித்து எச்சரிக்கையாய் இருங்கள்
      '10':
        title: ஞானமுள்ள தலைமை ஒழுங்கைக் கொண்டுவருகிறது
      '11':
        title: ஞானம் ஏழைகளை உயர்த்துகிறது
      '12':
        title: பாவிகளுக்கு அல்ல, நீதிமான்களுக்கு உதவுங்கள்
      '13':
        title: தாரைத் தொட்டால் அது ஒட்டிக்கொள்ளும்
      '14':
        title: ஞானம் நிலையான ஆசீர்வாதத்தைத் தருகிறது
      '15':
        title: தன்னை நாடுவோரை ஞானம் சந்திக்கிறது
      '16':
        title: உண்மையுள்ள ஒருவர் ஒரு நகரத்தை நிலைநிறுத்துகிறார்
      '17':
        title: மனிதர்கள் கடவுளின் சாயலில் படைக்கப்பட்டார்கள்
      '18':
        title: நற்செயல்களின் பயனைக் கெடுக்காதீர்கள்
      '19':
        title: இன்பத்தைத் துரத்துவோர் அழிவடைகின்றனர்
      '20':
        title: பேசுவதற்கான நேரத்தை கவனமாகத் தேர்ந்தெடுங்கள்
      '21':
        title: வேண்டுங்கள், பாவத்தைவிட்டு விலகுங்கள், ஞானத்தை நாடுங்கள்
      '22':
        title: சோம்பல் அவமானத்தையும் துயரத்தையும் தருகிறது
      '23':
        title: உள்ளார்ந்த கட்டுப்பாட்டுக்கும் ஞானத்திற்கும் வேண்டுங்கள்
      '24':
        title: ஞானம் தன்னைப் புகழ்ந்து பேசுகிறது
      '25':
        title: ஞானம் கடவுளையும் மக்களையும் மதிக்கிறது
      '26':
        title: மனைவி மகிழ்ச்சியையோ வேதனையையோ தருகிறாள்
      '27':
        title: நீதியை நாடி, அதை பெருமையுடன் அணிந்துகொள்ளுங்கள்
      '28':
        title: பாவங்களை மன்னித்து இரக்கத்தைப் பெறுங்கள்
      '29':
        title: அயலாரை மன்னித்து இரக்கத்தைப் பெறுங்கள்
      '30':
        title: மகன்களை மதிப்புக்குரியவர்களாக வளருங்கள்
      '31':
        title: செல்வம் கவலையையும் வேதனையையும் தருகிறது
      '32':
        title: மனத்தாழ்மையுடன் முதலில் பிறருக்குப் பணியாற்றுங்கள்
      '33':
        title: தமக்கு அஞ்சுவோரைக் ஆண்டவர் காக்கிறார்
      '34':
        title: தெளிவான வழிகாட்டல் இல்லாவிட்டால் கனவுகள் தவறாக வழிநடத்தலாம்
      '35':
        title: தலைவர்கள் தாழ்மையும் ஞானமும் உள்ளவர்களாய் இருக்க வேண்டும்
      '36':
        title: ஆண்டவருக்கு அஞ்சுவதன் மூலம் மீட்பு வருகிறது
      '37':
        title: நண்பர்களையும் ஆலோசனையையும் ஞானமாகத் தேர்ந்தெடுங்கள்
      '38':
        title: மருத்துவர்களை மதியுங்கள்; குணமடைய வேண்டுங்கள்
      '39':
        title: திருச்சட்டத்தை அர்ப்பணிப்புடன் கடைப்பிடிப்பவரை சீராக்கு புகழ்கிறார்
      '40':
        title: வாழ்க்கையின் சுமையும் ஆசீர்வாதங்களும்
      '41':
        title: மரணம் இறுதி ஓய்வைக் கொண்டுவருகிறது
      '42':
        title: கடினமானாலும் அவசியமானவற்றைப் பேசுங்கள்
      '43':
        title: வானத்தின் அதிசயங்கள் கடவுளைப் புகழத் தூண்டுகின்றன
      '44':
        title: முன்னோர்கள் விசுவாசத்தால் வழிநடத்தப்பட்டார்கள்
      '45':
        title: அனைவரையும்விட மோசே உயர்வாக மதிக்கப்படுகிறார்
      '46':
        title: கடவுளின் மக்களுக்காக யோசுவா போரிடுகிறார்
      '47':
        title: நாத்தானை எதிர்கொண்ட தாவீது புகழப்படுகிறார்
      '48':
        title: எலியா தீப்போன்ற சொற்களால் இறைவாக்குரைக்கிறார்
      '49':
        title: சீர்திருத்தத்திற்காக யோசியா மதிக்கப்படுகிறார்
      '50':
        title: சீமோன் தம் மக்களை ஆசீர்வதிக்கிறார்
      '51':
        title: என் கடவுளை நான் புகழ்கிறேன்
    Baruch:
      '1':
        title: ஆற்றங்கரையில் பாரூக்கு பாவஅறிக்கையை வாசிக்கிறார்
      '2':
        title: மோசே வழியாக விடுத்த எச்சரிக்கைகளை ஆண்டவர் நிறைவேற்றுகிறார்
      '3':
        title: மக்கள் கூக்குரலிட்டு, பாவத்தை அறிக்கையிட்டு, திரும்புகின்றனர்
      '4':
        title: கடவுளின் கட்டளைகள் வாழ்வளிப்பவை
      '5':
        title: எருசலேமே, நிலையான மாட்சியை அணிந்துகொள்
    1 Maccabees:
      '1':
        title: கிரேக்கக் கொடுங்கோன்மையை இஸ்ரயேல் எதிர்க்கிறது
      '2':
        title: திருச்சட்டத்தைக் கடைப்பிடிப்பதாக மத்தத்தியா உறுதியளிக்கிறார்
      '3':
        title: இஸ்ரயேலுக்கு உதவி வேண்டி யூதா மன்றாடுகிறார்
      '4':
        title: ஆலயம் தூய்மைப்படுத்தப்பட்டு மீண்டும் அர்ப்பணிக்கப்படுகிறது
      '5':
        title: சுற்றியுள்ள நாடுகளை யூதா தோற்கடிக்கிறார்
      '6':
        title: தோல்விக்குப் பிறகு அந்தியோக்கு இறக்கிறார்
      '7':
        title: நிக்கானோரின் படையை யூதா தோற்கடிக்கிறார்
      '8':
        title: ரோமரின் நட்பை யூதா நாடுகிறார்
      '9':
        title: யூதாவுக்குப் பிறகு யோனத்தான் தலைமை ஏற்கிறார்
      '10':
        title: அலெக்சாந்தரின் ஆதரவை யோனத்தான் பெறுகிறார்
      '11':
        title: தாலமியின் அச்சுறுத்தலை யோனத்தான் எதிர்கொள்கிறார்
      '12':
        title: யூதேயாவின் கோட்டைகளைச் சீமோன் வலுப்படுத்துகிறார்
      '13':
        title: எருசலேம் கோட்டையைச் சீமோன் முறியடிக்கிறார்
      '14':
        title: சீமோன் இஸ்ரயேலை வலுப்படுத்தி அமைதியை நிலைநாட்டுகிறார்
      '15':
        title: யூதர்களின் உரிமைகளை அந்தியோக்கு உறுதிப்படுத்துகிறார்
      '16':
        title: கெந்தபேயுவின் படைகளை யோவான் தோற்கடிக்கிறார்
    2 Maccabees:
      '1':
        title: விடுதலைக்காக யூதர்கள் வேண்டுகின்றனர்
      '2':
