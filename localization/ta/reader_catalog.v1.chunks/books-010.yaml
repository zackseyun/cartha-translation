payload:
  book_metadata:
    Joel:
      display_name: யோவேல்
      author: பெத்துவேலின் மகன் யோவேல்.
      audience: வெட்டுக்கிளிப் பேரிடரை ஆண்டவரின் நாளின் அறிகுறியாகக் கருதி அதற்குப் பதிலளித்த நாடுகடத்தலுக்குப் பிந்தைய யூதா மக்களுக்கு.
      date: அநேகமாக கி.மு. 5–4ஆம் நூற்றாண்டு.
    Amos:
      display_name: ஆமோஸ்
      author: தெக்கோவாவைச் சேர்ந்த ஆமோஸ்; வடக்கில் பிரசங்கித்த யூத மேய்ப்பர்.
      audience: இரண்டாம் யெரொபெயாமின் ஆட்சியில் செழிப்பும் அநீதியும் நிலவிய காலத்து வடக்கு இஸ்ரவேலுக்கு.
      date: சுமார் கி.மு. 760–750.
    Obadiah:
      display_name: ஒபதியா
      author: ஒபதியா.
      audience: எருசலேமுக்கு ஏதோம் துரோகம் செய்த பிறகான யூதாவுக்கு—ஏதோமின் வீழ்ச்சியைப் பற்றிய தீர்க்கதரிசனம்.
      date: கி.மு. 586க்குச் சற்றுப் பிறகு.
    Jonah:
      display_name: யோனா
      author: ஆசிரியர் பெயர் தெரியவில்லை; கதையின் முதன்மைப் பாத்திரம் அமித்தாயின் மகன் யோனா.
      audience: நாடுகடத்தலுக்குப் பிந்தைய இஸ்ரவேலுக்கு—இனரீதியான குறுகிய மனப்பான்மையை நையாண்டியாகக் கண்டித்து, வெளிநாட்டவர்களுக்கும் கடவுளின் இரக்கம் உண்டு என்பதை உறுதிப்படுத்தும் நூல்.
      date: அநேகமாக கி.மு. 5–4ஆம் நூற்றாண்டு.
    Micah:
      display_name: மீகா
      author: மோரேசேத்தைச் சேர்ந்த மீகா.
      audience: கி.மு. 8ஆம் நூற்றாண்டின் பிற்பகுதியில் வாழ்ந்த யூதாவுக்கு; குறிப்பாக நகர்ப்புற உயர்குடியினருக்கு எதிரான கிராமப்புற ஏழைகளுக்கு.
      date: சுமார் கி.மு. 740–700.
    Nahum:
      display_name: நாகூம்
      author: எல்கோசைச் சேர்ந்த நாகூம்.
      audience: நினிவேயின் நெருங்கிவரும் வீழ்ச்சியைக் கொண்டாடிய யூதாவுக்கு.
      date: கி.மு. 612க்குச் சற்றுமுன்.
    Habakkuk:
      display_name: ஆபகூக்
      author: ஆபகூக்.
      audience: பாபிலோனின் எழுச்சியை எதிர்கொண்ட யூதாவுக்கு—நீதியைப் பற்றி ஒரு தீர்க்கதரிசி கடவுளுடன் நடத்தும் உரையாடல்.
      date: சுமார் கி.மு. 7ஆம் நூற்றாண்டின் பிற்பகுதி.
    Zephaniah:
      display_name: செப்பனியா
      author: கூசியின் மகன் செப்பனியா.
      audience: யோசியாவின் ஆட்சியின்கீழ், அவரது சீர்திருத்தங்களுக்கு முந்தைய காலத்து யூதாவுக்கு.
      date: சுமார் கி.மு. 640–609.
    Haggai:
      display_name: ஆகாய்
      author: ஆகாய்.
      audience: தரியுவின் ஆட்சியில் ஆலயத்தை மீண்டும் கட்டிக்கொண்டிருந்த நாடு திரும்பிய மக்களுக்கு.
      date: கி.மு. 520.
    Zechariah:
      display_name: சகரியா
      author: பெரெகியாவின் மகன் சகரியா; 9–14ஆம் அதிகாரங்கள் அநேகமாகப் பிற்கால ஆசிரியர் ஒருவரால் எழுதப்பட்டவை.
      audience: ஆலயத்தை மீண்டும் கட்டிக்கொண்டிருந்த நாடு திரும்பிய மக்களுக்கும், பிற்கால நாடுகடத்தலுக்குப் பிந்தைய சமூகங்களுக்கும்.
      date: 1–8ஆம் அதிகாரங்கள் சுமார் கி.மு. 520–518; 9–14ஆம் அதிகாரங்கள் ஒருவேளை ஒரு நூற்றாண்டுக்குப் பிந்தையவை.
    Malachi:
      display_name: மல்கியா
      author: ஆசிரியர் பெயர் தெரியவில்லை; “மல்கியா” என்பதற்கு “என் தூதர்” என்று பொருள்.
      audience: பாரசீக ஆட்சியின்கீழ் வழிபாட்டிலும் உண்மைத்தன்மையிலும் அக்கறையற்றவர்களாகிவந்த நாடுகடத்தலுக்குப் பிந்தைய யூதாவுக்கு.
      date: சுமார் கி.மு. 5ஆம் நூற்றாண்டின் நடுப்பகுதி.
    Matthew:
      display_name: மத்தேயு
      author: ஆசிரியர் பெயர் தெரியவில்லை; மரபு இதைத் திருத்தூதர் மத்தேயுவுடன் தொடர்புபடுத்துகிறது. நவீன ஆய்வாளர்கள், மாற்கு நூலையும் ‘Q’ போன்ற ஒரு மூலத்தையும் பயன்படுத்திய கிரேக்க மொழி பேசிய யூதக் கிறிஸ்தவ ஆசிரியர் இதை எழுதியதாகக் கருதுகின்றனர்.
      audience: தொழுகைக்கூட யூத மதத்துடனான தொடர்ச்சியையும் வேறுபாட்டையும் புரிந்துகொள்ளப் போராடிய ஒரு யூதக் கிறிஸ்தவச் சமூகத்திற்கு.
      date: சுமார் கி.பி. 80–90.
    Mark:
      display_name: மாற்கு
      author: ஆசிரியர் பெயர் தெரியவில்லை; மரபு இதை பேதுருவின் பயணத் தோழரான யோவான் மாற்குவுடன் தொடர்புபடுத்துகிறது.
      audience: அநேகமாக ரோமில், துன்புறுத்தலின் கீழ் அல்லது அதன் அச்சுறுத்தலுக்கு அருகில் இருந்த கிரேக்க மொழி பேசிய கிறிஸ்தவச் சமூகத்திற்கு.
      date: யூதப் போர் மற்றும் ஆலய அழிவை ஒட்டிய காலமான சுமார் கி.பி. 65–75.
  chapter_titles:
    Hosea:
      '12':
        title: பொய்களுக்கும் வன்முறைக்கும் தீர்ப்பால் பதிலளிக்கப்படுகிறது
      '13':
        title: ஒருகாலத்தில் வலிமைபெற்ற எப்பிராயீம் இப்போது ஓடுகிறது
      '14':
        title: இஸ்ரவேல் மனந்திரும்பி இரக்கத்தை நாடுகிறது
    Joel:
      '1':
        title: உபவாசம் இருக்க யோவேல் அழைக்கிறார்
      '2':
        title: முழு இதயத்துடன் திரும்புங்கள்
      '3':
        title: அனைவர்மீதும் ஆவி பொழியப்படுகிறது
      '4':
        title: தீர்ப்புக்காக நாடுகள் கூடுகின்றன
    Amos:
      '1':
        title: நாடுகளின் கொடுமையைக் கடவுள் நியாயந்தீர்க்கிறார்
      '2':
        title: இஸ்ரவேல் நிச்சயமான தீர்ப்பை எதிர்கொள்கிறது
      '3':
        title: இஸ்ரவேலின் பாவங்கள் பேரழிவைக் கொண்டுவருகின்றன
      '4':
        title: செல்வந்தப் பெண்கள் தீர்ப்பை எதிர்கொள்கின்றனர்
      '5':
        title: மனந்திரும்பாவிட்டால் நாடு வீழும்
      '6':
        title: சுகவாழ்வு வாழும் உயர்குடியினர் அழிவைப் பொருட்படுத்தவில்லை
      '7':
        title: அழிவைப் பற்றிய தரிசனங்களை ஆமோஸ் காண்கிறார்
      '8':
        title: கோடைக்காலப் பழங்கள் இஸ்ரவேலின் முடிவைக் குறிக்கின்றன
      '9':
        title: தவிர்க்க முடியாத தீர்ப்பும் மீட்டமைப்பும்
    Obadiah:
      '1':
        title: துரோகத்திற்காக ஏதோம் நியாயந்தீர்க்கப்படுகிறது
    Jonah:
      '1':
        title: நினிவேப் பணியிலிருந்து யோனா தப்பியோடுகிறார்
      '2':
        title: மீனின் வயிற்றில் யோனா மன்றாடுகிறார்
      '3':
        title: யோனாவின் அழைப்பைக் கேட்டு நினிவே மனந்திரும்புகிறது
      '4':
        title: கடவுளின் இரக்கத்தால் யோனா விரக்தியடைகிறார்
    Micah:
      '1':
        title: சமாரியாவையும் யூதாவையும் கடவுள் நியாயந்தீர்க்கிறார்
      '2':
        title: பேராசையுடன் சதித்திட்டம் தீட்டுவோரை மீகா கண்டிக்கிறார்
      '3':
        title: தலைவர்கள் மக்களைக் கொடூரமாகச் சுரண்டுகின்றனர்
      '4':
        title: எல்லா நாடுகளுக்கும் மேலாக ஆண்டவர் ஆட்சி செய்கிறார்
      '5':
        title: பெத்லகேமிலிருந்து தாவீதின் அரசர் வருவார்
      '6':
        title: இஸ்ரவேலுக்கு எதிராக ஆண்டவர் வழக்குத் தொடுக்கிறார்
      '7':
        title: துயரத்தின் நடுவில் மீகா மன்றாடுகிறார்
    Nahum:
      '1':
        title: நினிவேயின் குற்றத்திற்காகக் கடவுள் தண்டிக்கிறார்
      '2':
        title: யூதாவுக்குச் சமாதானச் செய்தியைத் தூதர் கொண்டுவருகிறார்
      '3':
        title: நினிவே முழுமையான அவமானத்தை எதிர்கொள்கிறது
    Habakkuk:
      '1':
        title: தீயவர்களின் ஆட்சியைக் குறித்து ஆபகூக் புலம்புகிறார்
      '2':
        title: இறுமாப்புள்ள ஒடுக்குபவர்களைக் கடவுள் எச்சரிக்கிறார்
      '3':
        title: புனிதமான அச்சத்துடன் ஆபகூக் மன்றாடுகிறார்
    Zephaniah:
      '1':
        title: பாவத்திற்காக யூதாவைக் கடவுள் நியாயந்தீர்க்கிறார்
      '2':
        title: நாடுகள் தண்டிக்கப்பட்டாலும் நம்பிக்கை நீடிக்கிறது
      '3':
        title: தூய்மையாக்கப்பட்ட மக்களைக் குறித்து சீயோன் மகிழ்கிறது
    Haggai:
      '1':
        title: தமது இல்லத்தை மீண்டும் கட்ட ஆண்டவர் வலியுறுத்துகிறார்
      '2':
        title: ஆலயத்தைக் கட்டுபவர்களைக் கடவுள் ஊக்குவிக்கிறார்
    Zechariah:
      '1':
        title: இரக்கத்துடன் கடவுள் திரும்பிவருகிறார்
      '2':
        title: எருசலேம் மகிழ்ச்சியால் நிரம்பி வழிகிறது
      '3':
        title: யோசுவாவைக் கடவுள் தூய்மைப்படுத்துகிறார்
      '4':
        title: ஆவியின் வல்லமையால் செருபாபேல் கட்டுகிறார்
      '5':
        title: நாட்டிலிருந்து தீமை அகற்றப்படுகிறது
      '6':
        title: ஆசாரியர் யோசுவாவுக்குக் கிரீடங்கள்
      '7':
        title: நீதியின்றி உபவாசம் பயனற்றது
      '8':
        title: சமாதானத்தில் சீயோன் மீண்டும் கட்டப்படுகிறது
      '9':
        title: இஸ்ரவேலின் அரசர் தாழ்மையுடன் வருகிறார்
      '10':
        title: சிலைகளை அல்ல, மழையை நாடுங்கள்
      '11':
        title: மேய்ப்பர் ஆடுகளைக் கைவிடுகிறார்
      '12':
        title: நாடுகளுக்கு அச்சமூட்டும் எருசலேம்
      '13':
        title: பாவத்திலிருந்து நாடு தூய்மைப்படுத்தப்படுகிறது
      '14':
        title: எருசலேமுக்காக ஆண்டவர் போரிடுகிறார்
