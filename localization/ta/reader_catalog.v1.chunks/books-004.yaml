payload:
  book_metadata:
    1 Kings:
      display_name: 1 இராஜாக்கள்
      author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
      audience: அரசு ஏன் வீழ்ந்தது என்று கேட்டுக்கொண்டிருந்த, நாடுகடத்தப்பட்ட காலத்தையும் அதற்குப் பிந்தைய காலத்தையும் சேர்ந்த இஸ்ரவேல் மக்கள்.
      date: பாபிலோனிய நாடுகடத்தலின்போது, சுமார் கி.மு. 6ஆம் நூற்றாண்டில், இறுதி வடிவம் பெற்றது.
    2 Kings:
      display_name: 2 இராஜாக்கள்
      author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
      audience: நாடுகடத்தப்பட்ட இஸ்ரவேல் மக்கள்—பிரிந்த இரு அரசுகளையும் இறையியல் நோக்கில் ஆராய்ந்து, அவை பாபிலோனியரால் கைப்பற்றப்பட்டதில் முடியும் ஒரு பதிவு.
      date: கி.மு. 586க்குப் பிறகு, சுமார் கி.மு. 6ஆம் நூற்றாண்டில் இறுதி வடிவம் பெற்றது.
    1 Chronicles:
      display_name: 1 நாளாகமம்
      author: ஆசிரியர் பெயர் தெரியவில்லை; மரபில் அவர் “நாளாகம ஆசிரியர்” என்று அழைக்கப்படுகிறார்.
      audience: பாரசீக ஆட்சிக்கால யெகூதில் வாழ்ந்த, நாடுகடத்தலுக்குப் பிந்தைய யூதேய சமூகம்; தாவீது, ஆலயம், வழிபாடு ஆகியவற்றை மையமாகக் கொண்டு தங்கள் அடையாளத்தை மீண்டும் நிலைநிறுத்திக்கொண்டிருந்தவர்கள்.
      date: சுமார் கி.மு. 4ஆம் நூற்றாண்டு.
    2 Chronicles:
      display_name: 2 நாளாகமம்
      author: ஆசிரியர் பெயர் தெரியவில்லை; “நாளாகம ஆசிரியர்” என்று அழைக்கப்படுகிறார்.
      audience: நாடுகடத்தலுக்குப் பிந்தைய யூதேய சமூகம்.
      date: சுமார் கி.மு. 4ஆம் நூற்றாண்டு.
  chapter_titles:
    2 Samuel:
      '24':
        title: தாவீது கொள்ளைநோயை நிறுத்துகிறார்
    1 Kings:
      '1':
        title: சாலொமோன் அரசராக அபிஷேகம் செய்யப்படுகிறார்
      '2':
        title: தாவீது சாலொமோனுக்கு உண்மையுடன் அறிவுரை வழங்குகிறார்
      '3':
        title: சாலொமோன் இறைவனுக்கேற்ற ஞானத்தைக் கேட்கிறார்
      '4':
        title: சாலொமோன் ஒழுங்கும் வலிமையும் கொண்டு ஆட்சி செய்கிறார்
      '5':
        title: சாலொமோன் ஆலயத்தைக் கட்டிப் புகழ் பெறுகிறார்
      '6':
        title: ஆலயக் கட்டுமானம் கவனமாகத் தொடங்குகிறது
      '7':
        title: சாலொமோன் ஆலயப் பொருட்களைச் செய்து முடிக்கிறார்
      '8':
        title: சாலொமோன் ஆலயத்தில் ஜெபிக்கிறார்
      '9':
        title: கர்த்தர் சாலொமோனுடன் செய்த உடன்படிக்கையை மீண்டும் உறுதிப்படுத்துகிறார்
      '10':
        title: அரசி சாலொமோனின் ஞானத்தைப் போற்றுகிறார்
      '11':
        title: சாலொமோன் தடுமாறி வழிவிலகுகிறார்
      '12':
        title: ரெகொபெயாம் மக்களின் வேண்டுகோளை மறுக்கிறார்
      '13':
        title: தீர்க்கதரிசி அரசனை எதிர்த்து, பின்னர் இறக்கிறார்
      '14':
        title: யெரொபெயாம் இறைத் தீர்ப்பை எதிர்கொள்கிறார்
      '15':
        title: ஆசா உண்மையுடன் விக்கிரகங்களை அகற்றுகிறார்
      '16':
        title: கர்த்தர் இஸ்ரவேலின் அரசர்களை நியாயந்தீர்க்கிறார்
      '17':
        title: எலியா விதவைக்கு அற்புதமாக உணவளிக்கிறார்
      '18':
        title: எலியா ஆகாபை எதிர்கொண்டு நியாயந்தீர்க்கிறார்
      '19':
        title: எலியா ஓரேபில் புதிய பணியைப் பெறுகிறார்
      '20':
        title: ஆகாப் பெனாதாதை உயிரோடு விடுகிறார்
      '21':
        title: யேசபேல் நாபோத்தின் கொலையைத் திட்டமிடுகிறாள்
      '22':
        title: மிகாயா முன்னறிவித்தபடி ஆகாப் இறக்கிறார்
    2 Kings:
      '1':
        title: அகசியா எலியாவின் தீர்ப்பை எதிர்கொள்கிறார்
      '2':
        title: எலியா சுழற்காற்றில் எடுத்துக்கொள்ளப்படுகிறார்
      '3':
        title: யோராம் எலிசாவுடன் மோவாபுக்கு எதிராகப் போரிடுகிறார்
      '4':
        title: எலிசா தேவையிலுள்ளவர்களுக்கு உதவுகிறார்
      '5':
        title: நாகமான் தொழுநோயிலிருந்து சுத்தமாக்கப்படுகிறார்
      '6':
        title: எலிசா ஆராமின் திட்டங்களை வெளிப்படுத்துகிறார்
      '7':
        title: சமாரியாவின் பஞ்சம் திடீரென முடிகிறது
      '8':
        title: எலிசா அரசர்களை எச்சரித்து நியாயந்தீர்க்கிறார்
      '9':
        title: யெகூ ஆகாபின் குடும்பத்தாரைக் கொன்றழிக்கிறார்
      '10':
        title: யெகூ பாகால் வழிபாட்டை அழிக்கிறார்
      '11':
        title: ஆலயத்தில் நடந்த ஆட்சிக் கவிழ்ப்பில் யோவாஸ் முடிசூட்டப்படுகிறார்
      '12':
        title: யோவாஸ் ஆலயத்தைப் பழுதுபார்க்கிறார்
      '13':
        title: இஸ்ரவேலுக்குக் கிடைத்த இரக்கத்தின் சுழற்சி முடிகிறது
      '14':
        title: அமத்சியா ஏதோமை வென்றும் தோல்வியடைகிறார்
      '15':
        title: யூதா நிலைத்திருக்க, இஸ்ரவேல் வீழ்ச்சியடைகிறது
      '16':
        title: ஆகாஸ் அசீரியாவின் உதவியை நாடுகிறார்
      '17':
        title: தொடர்ச்சியான பாவத்தால் இஸ்ரவேல் நாடுகடத்தப்படுகிறது
      '18':
        title: எசேக்கியா கர்த்தரை மட்டுமே நம்புகிறார்
      '19':
        title: கர்த்தர் எருசலேமை அசீரியாவிடமிருந்து விடுவிக்கிறார்
      '20':
        title: எசேக்கியா ஜெபித்து குணமடைகிறார்
      '21':
        title: மனாசே யூதாவைத் தீமைக்குள் வழிநடத்துகிறார்
      '22':
        title: யோசியா திருச்சட்டத்தைக் கண்டுபிடித்து மனந்திரும்புகிறார்
      '23':
        title: யோசியா விக்கிரக வழிபாட்டை அகற்றி பஸ்காவை மீண்டும் நிலைநாட்டுகிறார்
      '24':
        title: பாபிலோன் யெகோயாக்கீனைச் சிறைப்பிடிக்கிறது
      '25':
        title: யெகோயாக்கீன் பாபிலோனில் கௌரவிக்கப்படுகிறார்
    1 Chronicles:
      '1':
        title: இறைவன் இஸ்ரவேலின் வம்சவரிசையை அமைக்கிறார்
      '2':
        title: தலைமுறைகள்தோறும் தொடரும் யூதாவின் வம்சம்
      '3':
        title: தாவீதின் குடும்பம் தொடர்ந்து நிலைக்கிறது
      '4':
        title: யாப்பேத்தின் சந்ததியினர் பெயரிடப்படுகின்றனர்
      '5':
        title: கிழக்குக் கோத்திரத்தார் வடக்கே நாடுகடத்தப்படுகின்றனர்
      '6':
        title: லேவியின் ஆசாரிய வம்சம் கௌரவிக்கப்படுகிறது
      '7':
        title: இசக்காரின் வலிமைமிக்க வீரர்கள்
      '8':
        title: பென்யமீனின் தலைவர்களும் குலங்களும்
      '9':
        title: எருசலேமுக்குத் திரும்பி மீண்டும் கட்டுதல்
      '10':
        title: சவுல் கில்போவா மலையில் இறக்கிறார்
      '11':
        title: தாவீது அனைவருக்கும் அரசராக அபிஷேகம் செய்யப்படுகிறார்
      '12':
        title: வீரர்கள் தாவீதின் அரசில் இணைகின்றனர்
      '13':
        title: தாவீது உடன்படிக்கைப் பெட்டியைத் திரும்பக் கொண்டுவருகிறார்
      '14':
        title: தாவீது மீண்டும் பெலிஸ்தியரைத் தோற்கடிக்கிறார்
      '15':
        title: உடன்படிக்கைப் பெட்டி எருசலேமுக்குக் கொண்டுவரப்படுகிறது
      '16':
        title: தாவீது ஆலய வழிபாட்டுக்கானவர்களை நியமிக்கிறார்
      '17':
        title: இறைவன் தாவீதின் அரச வம்சத்தைப் பற்றி வாக்களிக்கிறார்
      '18':
        title: தாவீது பிற நாடுகள்மீது வெற்றி பெறுகிறார்
      '19':
        title: யோவாப் அம்மோனையும் ஆராமையும் தோற்கடிக்கிறார்
      '20':
        title: யோவாப் ரப்பா நகரைக் கைப்பற்றுகிறார்
      '21':
        title: தாவீதின் மக்கள் தொகைக் கணக்கெடுப்பு கொள்ளைநோயைக் கொண்டுவருகிறது
      '22':
        title: இறைவனின் ஆலயத்தைக் கட்ட சாலொமோன் தேர்ந்தெடுக்கப்படுகிறார்
      '23':
        title: லேவியர்கள் பணிக்காக ஒழுங்கமைக்கப்படுகின்றனர்
      '24':
        title: ஆசாரியர்கள் சீட்டுப்போட்டு பிரிவுகளாகப் பிரிக்கப்படுகின்றனர்
      '25':
        title: வழிபாட்டுக்காக இசைக் கலைஞர்கள் ஒழுங்கமைக்கப்படுகின்றனர்
      '26':
        title: ஆலயக் காவலர்கள் கவனமாக நியமிக்கப்படுகின்றனர்
      '27':
        title: தாவீதின் கீழ் இஸ்ரவேல் ஒழுங்கமைக்கப்படுகிறது
      '28':
        title: ஆலயத்திற்கான தாவீதின் திட்டங்கள் வழங்கப்படுகின்றன
      '29':
        title: நாடுகள் இறைவனின் ஆலயத்திற்குக் கொடுக்கின்றன
    2 Chronicles:
      '1':
        title: சாலொமோன் ஞானத்தைக் கேட்கிறார்
      '2':
        title: ஆலயத் திட்டங்களும் தாழ்மையும்
      '3':
        title: ஆலயக் கட்டுமானம் தொடங்குகிறது
      '4':
        title: ஆலயப் பொருட்கள் செய்யப்படுகின்றன
      '5':
        title: உடன்படிக்கைப் பெட்டி ஆலயத்திற்குக் கொண்டுவரப்படுகிறது
      '6':
        title: சாலொமோன் ஆலயத்திற்காக ஜெபிக்கிறார்
      '7':
        title: நெருப்பு பலிகளை எரித்துவிடுகிறது
      '8':
        title: சாலொமோன் அரசை வலுப்படுத்துகிறார்
      '9':
        title: சாலொமோனின் ஞானம் போற்றப்படுகிறது
      '10':
        title: ரெகொபெயாம் அறிவுரையை நிராகரிக்கிறார்
      '11':
