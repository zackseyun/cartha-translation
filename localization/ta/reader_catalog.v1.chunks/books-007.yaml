payload:
  book_metadata:
    Proverbs:
      display_name: நீதிமொழிகள்
      author: ஒரு தொகுப்பு; தலைப்புரைகள் சாலொமோன், ஆகூர், லெமுவேல் மற்றும் "ஞானிகள்" ஆகியோரைக் குறிப்பிடுகின்றன.
      audience: அன்றாட வாழ்க்கைக்கான ஞானத்தில் உருவாக்கப்பட்டு வந்த இளம் இஸ்ரவேலர்கள்.
      date: இதன் பல்வேறு பகுதிகள் கி.மு. சுமார் 10ஆம் நூற்றாண்டு முதல் 4ஆம் நூற்றாண்டு வரை இயற்றப்பட்டன.
    Ecclesiastes:
      display_name: பிரசங்கி
      author: ஆசிரியர் பெயர் தெரியவில்லை; உரையாற்றுபவர் "கோஹெலெத்"; மரபுப்படி இவர் சாலொமோனாக அடையாளப்படுத்தப்படுகிறார்.
      audience: சூரியனுக்குக் கீழே ஞானம், செல்வம், முயற்சி ஆகியவற்றின் வரம்புகளை எதிர்கொள்ளும் இஸ்ரவேலர்கள்.
      date: அரமேய மொழியின் தாக்கமுள்ள எபிரெய மொழிநடையை அடிப்படையாகக் கொண்டு, இது கி.மு. சுமார் 5ஆம் நூற்றாண்டு முதல் 3ஆம் நூற்றாண்டு வரையிலானதாக இருக்கலாம்.
    Song of Solomon:
      display_name: சாலொமோனின் உன்னதப்பாட்டு
      author: ஆசிரியர் பெயர் தெரியவில்லை; தலைப்புரை சாலொமோனைக் குறிப்பிடுகிறது.
      audience: காமமயமான காதலை உடன்படிக்கை நெருக்கத்தின் கண்ணோட்டமாக வாசிக்கும் இஸ்ரவேல்—பிற்காலத்தில் இதை உருவகமாக வாசித்த யூத மற்றும் கிறிஸ்தவ வாசகர்களும்.
      date: நாடுகடத்தலுக்குப் பிந்தைய காலத்தைச் சேர்ந்ததாக இருக்கலாம்; கி.மு. சுமார் 5ஆம் நூற்றாண்டு முதல் 3ஆம் நூற்றாண்டு வரை.
  chapter_titles:
    Psalms:
      '104':
        title: கர்த்தர் படைத்து, பராமரித்து, புதுப்பிக்கிறார்
      '105':
        title: தேவனுக்கு நன்றி செலுத்தி, உடன்படிக்கையை நினைவுகூருங்கள்
      '106':
        title: மறந்துபோன அன்பு என்றென்றும் மீட்டெடுக்கப்படுகிறது
      '107':
        title: மீட்கப்பட்டோர் கர்த்தருக்கு நன்றி செலுத்த அழைக்கப்படுகிறார்கள்
      '108':
        title: விடுதலைக்காக தாவீது மன்றாடுகிறார்
      '109':
        title: தீய ஒடுக்குபவனுக்கு எதிரான அவசரக் கூக்குரல்
      '110':
        title: பரிசுத்த மகிமையுடன் தாவீது ஆட்சி செய்கிறார்
      '111':
        title: முழு இருதயத்தோடு கர்த்தரைத் துதியுங்கள்
      '112':
        title: தேவபக்தியுள்ளவர் பாக்கியவான்
      '113':
        title: தாழ்ந்தோரை உயர்த்தும் கர்த்தரைத் துதியுங்கள்
      '114':
        title: இஸ்ரவேலரின் வெளியேற்றமும் இயற்கையின் எதிர்வினையும்
      '115':
        title: கர்த்தருக்கு மட்டுமே மகிமை
      '116':
        title: சங்கீதக்காரர் தம்மைக் காக்கும் கர்த்தரை நேசிக்கிறார்
      '117':
        title: நிலையான அன்புக்காக கர்த்தரைத் துதியுங்கள்
      '118':
        title: நன்றி செலுத்த சங்கீதம் 118 அழைக்கிறது
      '120':
        title: சங்கீதக்காரர் கூக்குரலிட, கர்த்தர் பதிலளிக்கிறார்
      '121':
        title: உதவி கர்த்தரிடமிருந்து வருகிறது
      '122':
        title: எருசலேமின் சமாதானத்துக்காக தாவீது மன்றாடுகிறார்
      '123':
        title: கர்த்தரை நம்பி சங்கீதக்காரர் மேல்நோக்கிப் பார்க்கிறார்
      '124':
        title: ஆபத்திலிருந்து இஸ்ரவேலரைக் கர்த்தர் காக்கிறார்
      '125':
        title: நம்பிக்கை அசையாத பாதுகாப்பைத் தருகிறது
      '126':
        title: சீயோனின் மீட்பு அளவற்ற மகிழ்ச்சியைத் தருகிறது
      '127':
        title: கர்த்தர் கட்டி, பாதுகாக்கிறார்
      '128':
        title: தேவனுக்குப் பயப்படுகிறவர்கள் பாக்கியவான்கள்
      '129':
        title: இஸ்ரவேலின் எதிரிகளால் நம்மைத் தோற்கடிக்க முடியாது
      '130':
        title: இரக்கத்துக்காக சங்கீதக்காரர் கூக்குரலிடுகிறார்
      '131':
        title: தேவனுக்கு முன்பாக தாவீது அமைதியாக இளைப்பாறுகிறார்
      '132':
        title: கர்த்தருக்குரிய இடத்தை தாவீது நாடுகிறார்
      '133':
        title: தேவபக்தியுள்ள ஒற்றுமையை தாவீது போற்றுகிறார்
      '134':
        title: இரவு காவலர்கள் கர்த்தரைத் துதிக்கிறார்கள்
      '135':
        title: விக்கிரகங்களை வெல்லும் கர்த்தரைத் துதியுங்கள்
      '136':
        title: முடிவில்லா அன்புக்காக கர்த்தருக்கு நன்றி செலுத்துதல்
      '137':
        title: எருசலேமை நினைத்து நாடுகடத்தப்பட்டோர் அழுகிறார்கள்
      '138':
        title: தாவீது வெளிப்படையாகக் கர்த்தருக்கு நன்றி செலுத்துகிறார்
      '139':
        title: தேவனின் நிறைவான அறிவும் எங்குமுள்ள பிரசன்னமும்
      '140':
        title: வன்முறையிலிருந்து தாவீதை தேவன் காக்கிறார்
      '141':
        title: தன் சொற்கள் காக்கப்பட தாவீது மன்றாடுகிறார்
      '142':
        title: தாவீது கர்த்தரை நோக்கிக் கூக்குரலிடுகிறார்
      '143':
        title: இரக்கத்துக்காக தாவீது மன்றாடுகிறார்
      '144':
        title: பாதுகாப்புக்காக தாவீது மன்றாடுகிறார்
      '145':
        title: தேவனின் மகிமையை தாவீது துதிக்கிறார்
      '146':
        title: ஆத்துமா தேவனை என்றென்றும் துதிக்கிறது
      '147':
        title: மீண்டும் கட்டி, குணமாக்கும் கர்த்தரைத் துதியுங்கள்
      '148':
        title: படைப்பு அனைத்தும் கர்த்தரைத் துதிக்கிறது
      '149':
        title: அனைவரும் யாவைப் துதிக்கட்டும்
      '150':
        title: எல்லா இசைக்கருவிகளுடனும் யாவைப் துதியுங்கள்
    Proverbs:
      '1':
        title: கர்த்தருக்குப் பயப்பட சாலொமோன் போதிக்கிறார்
      '2':
        title: தேவனை நாடுவதால் ஞானம் கிடைக்கிறது
      '3':
        title: தேவனை நம்பி ஞானத்தைப் பெறுங்கள்
      '4':
        title: எல்லாவற்றுக்கும் மேலாக ஞானத்தை நாடும்படி தந்தை வலியுறுத்துகிறார்
      '5':
        title: விபசாரத்துக்கு எதிராகத் தந்தை எச்சரிக்கிறார்
      '6':
        title: பாவத்துக்கும் சோம்பலுக்கும் எதிரான எச்சரிக்கைகள்
      '7':
        title: விபசார மயக்கத்திலிருந்து வெகுதூரம் விலகியிருங்கள்
      '8':
        title: ஞானத்தை நாடுவோரை அது அழைக்கிறது
      '9':
        title: ஞானம் அழைக்கிறது; மூடத்தனம் வசீகரிக்கிறது
      '10':
        title: நீதிக்கும் துன்மார்க்கத்துக்கும் இடையிலான வேறுபாடுகள்
      '11':
        title: நேர்மை ஆசீர்வாதத்துக்கு வழிநடத்துகிறது
      '12':
        title: நீதிமான்கள் ஞானமாகவும் நலமாகவும் வாழ்கிறார்கள்
      '13':
        title: கற்றுக்கொள்ளும் மனப்பான்மை வாழ்வுக்கு வழிநடத்துகிறது
      '14':
        title: ஞானம் வீட்டைக் கட்டுகிறது; கர்த்தருக்கு அஞ்சுகிறது
      '15':
        title: கனிவான பேச்சு வாழ்வைத் தருகிறது
      '16':
        title: திட்டங்களை மனிதர் வகுக்கிறார்; விளைவுகளை தேவன் வழிநடத்துகிறார்
      '17':
        title: தேவனுக்குப் பயப்படுதல் ஞானத்தைத் தருகிறது
      '18':
        title: ஞானம் செவிகொடுக்கிறது; மூடத்தனம் திருத்தத்தை மறுக்கிறது
      '19':
        title: செல்வத்தைவிட நேர்மையே எப்போதும் சிறந்தது
      '20':
        title: குடிவெறியைத் தவிர்த்து, நேர்மையை மதியுங்கள்
      '21':
        title: தேவன் இருதயங்களை நியாயந்தீர்த்து, நீதியை மதிக்கிறார்
      '22':
        title: தாழ்மை தேவனை அதிகமாகக் கனப்படுத்துகிறது
      '23':
        title: அளவில்லா ஆசைக்கும் பேராசைக்கும் எதிரான எச்சரிக்கை
      '24':
        title: துன்மார்க்கர்மீது பொறாமைப்படாதீர்கள்
      '25':
        title: ஞானம் தாழ்மைக்கு அழைக்கிறது
      '26':
        title: மூடர்கள் தங்களுக்கும் பிறருக்கும் தீங்கு செய்கிறார்கள்
      '27':
        title: தாழ்மையையும் எதார்த்தப் பார்வையையும் கற்பிக்கிறது
      '28':
        title: கர்த்தரை நாடுவதால் நீதிமான்கள் வெற்றி பெறுகிறார்கள்
      '29':
        title: பிடிவாதம் அழிவுக்கு வழிநடத்துகிறது
      '30':
        title: ஆகூர் ஆழ்ந்த தாழ்மையுடன் பேசுகிறார்
      '31':
        title: நீதியை நிலைநாட்டும்படி அரசனைத் தாய் எச்சரிக்கிறார்
    Ecclesiastes:
      '1':
        title: சூரியனுக்குக் கீழே எல்லாம் வீண்
      '2':
        title: இன்பம் நிலையான பலனைத் தருவதில்லை
      '3':
        title: ஒவ்வொரு நோக்கத்துக்கும் உரிய காலம் வருகிறது
      '4':
        title: கொடுமையான ஒடுக்குதலால் நிறைந்த வாழ்க்கை
      '5':
        title: தேவனுக்கு அஞ்சி, நேர்த்திக்கடன்களை நிறைவேற்றுங்கள்
      '6':
        title: அனுபவிக்க முடியாத செல்வம் கசப்பானது
      '7':
        title: பெருமையைவிட ஞானம் சிறந்தது
      '8':
        title: தாழ்மையாக வாழ ஞானம் கற்பிக்கிறது
      '9':
        title: நீதிமான்களும் துன்மார்க்கரும் ஒரே முடிவை எதிர்கொள்கிறார்கள்
      '10':
        title: மூடத்தனம் ஞானத்தை விரைவில் பாழாக்குகிறது
      '11':
        title: முடியும் காலத்திலேயே துணிந்து செயல்படுங்கள்
      '12':
        title: இளமையில் படைத்தவரை நினைவுகூருங்கள்
    Song of Solomon:
      '1':
        title: பெண் தன் அன்புக்குரிய காதலனைத் தேடுகிறாள்
      '2':
        title: காதலர்கள் ஆழ்ந்த பாராட்டைப் பரிமாறிக்கொள்கிறார்கள்
      '3':
