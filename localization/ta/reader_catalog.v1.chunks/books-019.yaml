payload:
  book_metadata:
    Gospel of Truth:
      display_name: சத்தியத்தின் நற்செய்தி
      author: ஆசிரியர் பெயர் தெரியவில்லை; வாலெந்தினுஸ் அல்லது அவரது பள்ளியைச் சேர்ந்தவர்களால் எழுதப்பட்டதாகப் பரவலாகக் கருதப்படுகிறது.
      audience: வாலெந்தினிய ஞானவாத இயக்கத்தைச் சேர்ந்த கிறிஸ்தவ வாசகர்கள்.
      date: கி.பி. 2ஆம் நூற்றாண்டின் நடுப்பகுதி எனக் கருதப்படுகிறது; நாக் ஹம்மாடியில் பாதுகாக்கப்பட்டது.
    Jubilees:
      display_name: யூபிலிகள்
      author: ஆசிரியர் பெயர் தெரியவில்லை; மோசேக்கு சீனாய் மலையில் அளிக்கப்பட்ட வெளிப்பாடாக முன்வைக்கப்படுகிறது.
      audience: 364 நாட்களைக் கொண்ட சூரிய நாட்காட்டியையும் கடுமையான ஹலாகா விதிகளையும் கடைப்பிடித்த யூதச் சமூகங்கள் (கும்ரான் சமூகத்தின் அதே சூழலைச் சேர்ந்தவர்களாக இருக்கக்கூடும்).
      date: கி.மு. 2ஆம் நூற்றாண்டின் நடுப்பகுதி எனக் கருதப்படுகிறது; கீஸ் (எத்தியோப்பிய) மொழியில் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது.
  chapter_titles:
    Gospel of Thomas:
      '49':
        title: தனித்துத் தேர்ந்தெடுக்கப்பட்டவர்கள் அரசைக் கண்டடைவார்கள்
      '50':
        title: ஒளியைப் பற்றி இயேசு பேசுகிறார்
      '51':
        title: இறந்தோரின் இளைப்பாறுதல் அறியப்படாமல் வருகிறது
      '52':
        title: பேசும் இறந்தோரிடையே வாழ்தல்
      '53':
        title: விருத்தசேதனத்தைப் பற்றிச் சீடர்கள் கேட்கிறார்கள்
      '54':
        title: ஏழைகளை இயேசு வாழ்த்துகிறார்
      '55':
        title: வெறுத்துவிடு அல்லது கிறிஸ்துவைப் பின்பற்று
      '56':
        title: சடலமான உலகைக் கண்டவருக்கு உலகம் தகுதியற்றது
      '57':
        title: உழைக்கும் மனிதர் பேறுபெற்றவர்
      '58':
        title: கடின உழைப்பை இயேசு வாழ்த்துகிறார்
      '59':
        title: உயிரோடிருக்கும்போதே உயிருள்ளவரைத் தேடுங்கள்
      '60':
        title: சமாரியர் ஓர் ஆட்டுக்குட்டியை யூதேயாவுக்குச் சுமந்து செல்கிறார்
      '61':
        title: ஒளியைப் பற்றி சலோமேக்கு இயேசு கற்பிக்கிறார்
      '62':
        title: மறைபொருள்கள் இரகசியமாக வெளிப்படுத்தப்படுகின்றன
      '63':
        title: ஆயத்தமில்லாமல் செல்வந்தன் இறக்கிறான்
      '64':
        title: எஜமான் எதிர்பாராத விருந்தினர்களை அழைக்கிறார்
      '65':
        title: நல்ல மனிதரின் திராட்சைத்தோட்டம் அழிக்கப்படுகிறது
      '66':
        title: புறக்கணிக்கப்பட்ட கல்லை எனக்குக் காட்டுங்கள்
      '67':
        title: அனைத்தையும் அறிந்தும் தன்னையே அறியாதிருத்தல்
      '68':
        title: துன்புறுத்தப்படுகிறவர்கள் பேறுபெற்றவர்கள்
      '69':
        title: பசியுள்ள ஆன்மாக்கள் பேறுபெற்றவை
      '70':
        title: உள்ளார்ந்த வறுமையைப் பற்றி இயேசு பேசுகிறார்
      '71':
        title: வீடு இடிந்துவிழும் என இயேசு முன்னறிவிக்கிறார்
      '72':
        title: சொத்தைப் பிரிக்க இயேசு மறுக்கிறார்
      '73':
        title: மேலும் பல வேலையாட்கள் தேவை என இயேசு வலியுறுத்துகிறார்
      '74':
        title: தாகமுள்ளோர் திரண்டிருந்தும் கிணறு காலியாக உள்ளது
      '75':
        title: தனித்திருப்பவர்கள் மணவறைக்குள் நுழைகிறார்கள்
      '76':
        title: என்றும் நிலைக்கும் புதையலைத் தேடுங்கள்
      '77':
        title: தெய்வீக ஒளியாக இயேசு பேசுகிறார்
      '78':
        title: மென்மையான ஆடைகளைப் பற்றி இயேசு கேட்கிறார்
      '79':
        title: உண்மையைத் தாங்கிய பெண் பேறுபெற்றவள்
      '80':
        title: உடலைக் கண்டவர் உலகத்திற்குத் தகுதியற்றவர்
      '81':
        title: செல்வமும் அதிகாரமும் பற்றிய முரண்பாடு
      '82':
        title: அருகிலிருப்பவர்களுக்கு நெருப்பும் அருகில்
      '83':
        title: உருவங்கள் வெளிப்படுகின்றன; ஒளியோ மறைந்துள்ளது
      '84':
        title: உங்கள் சாயலைக் காண்பது மகிழ்ச்சி தருகிறது
      '85':
        title: ஆதாம் மாபெரும் வல்லமையிலிருந்து வந்தார்
      '86':
        title: வீடற்ற நிலையைப் பற்றி இயேசு பேசுகிறார்
      '87':
        title: உடலும் ஆன்மாவும் சார்ந்திருப்பது அவலமானது
      '88':
        title: வானதூதர்களும் இறைவாக்கினர்களும் வருவார்கள்
      '89':
        title: தூய்மைப்படுத்துதலைப் பற்றி இயேசு கேட்கிறார்
      '90':
        title: தேடுகிறவர்களுக்கு இயேசு இளைப்பாறுதல் அளிக்கிறார்
      '91':
        title: உண்மையான அறிவை இயேசு வெளிப்படுத்துகிறார்
      '92':
        title: தேடுங்கள், கண்டடைவீர்கள்
      '93':
        title: தூயவற்றை விவேகத்துடன் கொடுங்கள்
      '94':
        title: தேடுதல் கண்டுபிடிப்புக்கு வழிவகுக்கிறது
      '95':
        title: திரும்பக் கிடைக்கும் என எதிர்பாராமல் கடன் கொடுங்கள்
      '96':
        title: அரசு மறைந்திருக்கும் புளிப்புமாவைப் போன்றது
      '97':
        title: பெண் அறியாமலே மாவை இழக்கிறாள்
      '98':
        title: ஒருவன் முதலில் தன் வலிமையைச் சோதிக்கிறான்
      '99':
        title: உண்மையான சகோதரர்கள் தந்தைக்குக் கீழ்ப்படிகிறார்கள்
      '100':
        title: வரி குறித்த கேள்விக்கு இயேசு பதிலளிக்கிறார்
      '101':
        title: உண்மையான சீடருக்குத் தேவையான வெறுப்பு
      '102':
        title: தன்னலமுள்ள பரிசேயர்களை இயேசு சபிக்கிறார்
      '103':
        title: ஆயத்தமாக உள்ள மனிதர் பேறுபெற்றவர்
      '104':
        title: மணமகன் சென்றபின் மன்றாடுங்கள்
      '105':
        title: உட்பார்வை பொதுமக்கள் முன் அவமானத்தைத் தருகிறது
      '106':
        title: ஒற்றுமை மலைகளை நகர்த்துகிறது
      '107':
        title: அரசு காணாமற்போன ஆட்டைத் தேடுகிறது
      '108':
        title: மறைந்துள்ளவற்றை இயேசு வெளிப்படுத்துகிறார்
      '109':
        title: மறைந்திருந்த புதையல் தன்னை வெளிப்படுத்துகிறது
      '110':
        title: கண்டடைந்த உலகச் செல்வத்தைத் துறந்துவிடுங்கள்
      '111':
        title: அவர் முன்னிலையில் வானங்கள் சுருட்டப்படுகின்றன
      '112':
        title: உடலைச் சார்ந்திருப்பதைக் குறித்து இயேசு எச்சரிக்கிறார்
      '113':
        title: அரசாட்சி பூமியெங்கும் பரவியுள்ளது
      '114':
        title: மரியாளின் சமத்துவத்தைப் பற்றி இயேசு கற்பிக்கிறார்
    Gospel of Truth:
      '1':
        title: அருள் தந்தையின் சத்தியத்தை வெளிப்படுத்துகிறது
      '2':
        title: மறதியில் பிழை வலுப்பெறுகிறது
      '3':
        title: தந்தை பிள்ளைகளுக்கு அறிவை வெளிப்படுத்துகிறார்
      '4':
        title: பெயரால் அழைக்கப்பட்டவர்கள் இளைப்பாறுதல் பெறுகிறார்கள்
      '5':
        title: இயேசு அனைத்தையும் நிறைவுக்குக் கொண்டுவருகிறார்
      '6':
        title: வார்த்தை பிழையை ஊடுருவி வெட்டுகிறது
      '7':
        title: தந்தையின் பெயர் வெளிக்கொணர்கிறது
      '8':
        title: பயங்கரம் ஒன்றுமில்லை என்பதை ஒளி வெளிப்படுத்துகிறது
      '9':
        title: அவர் அவர்களுக்கு ஒளியையும் வாழ்வையும் கற்பித்தார்
      '10':
        title: மேய்ப்பர் அந்த ஓர் ஆட்டைத் தேடுகிறார்
      '11':
        title: புரிதல் பார்வையற்றோரை விழிப்படையச் செய்கிறது
      '12':
        title: ஒளி பாவங்களிலிருந்து மீட்பைக் கொண்டுவருகிறது
      '13':
        title: அவர் தமது சித்தத்தை ஒளியில் உரைக்கிறார்
      '14':
        title: தந்தை அன்பு மகனுக்குப் பெயரிடுகிறார்
      '15':
        title: தந்தைக்குள் சத்தியம் இளைப்பாறுகிறது
      '16':
        title: நான் என்னைத் தந்தைக்கு அர்ப்பணிக்கிறேன்
    Jubilees:
      '1':
        title: இரக்கத்திற்காக மோசே மன்றாடுகிறார்
      '2':
        title: இஸ்ரவேலுக்கான ஓய்வுநாளின் புனிதம்
      '3':
        title: ஏதேனில் ஆதாம் ஏவாளுக்குப் பெயரிடுகிறார்
      '4':
        title: தீர்ப்பைப் பற்றி ஏனோக்கு எச்சரிக்கிறார்
      '5':
        title: பாவத்தின் காரணமாகப் பெருவெள்ளம் தீர்மானிக்கப்படுகிறது
      '6':
        title: வானவில் வழியாக நோவாவுடன் உடன்படிக்கை செய்யப்படுகிறது
      '7':
        title: நீதியுடன் வாழுமாறு நோவா சந்ததியினரை எச்சரிக்கிறார்
      '8':
        title: நோவா பூமியைப் பிரிக்கிறார்
      '9':
        title: ஆவிகளை ஆள மஸ்தேமா நாடுகிறான்
      '10':
        title: பாபேல் கோபுரத்திலிருந்து மக்கள் சிதறடிக்கப்படுகிறார்கள்
      '11':
        title: சீர்கேட்டின் நடுவே செரூகு மகனுக்குப் பெயரிடுகிறார்
      '12':
        title: விண்ணக மொழி மீட்டளிக்கப்படுகிறது
      '13':
        title: ஆபிராம் லோத்துவை மீட்டு தசமபாகம் கொடுக்கிறார்
      '14':
        title: ஆபிராமுக்கு மிகுந்த வெகுமதியை இறைவன் வாக்களிக்கிறார்
      '15':
        title: விருத்தசேதனம் உடன்படிக்கையின் அடையாளமாகிறது
      '16':
        title: ஈசாக்கு பிறக்கிறார்; சோதோம் அழிக்கப்படுகிறது
review:
  verdict: revise
  review_summary: Complete Tamil localization reviewed and corrected for source fidelity. Corrections address several altered agent/object relationships and unsupported additions.
  issues:
  - Corrected Thomas 56 so that the world is unworthy of the one who finds it a corpse.
