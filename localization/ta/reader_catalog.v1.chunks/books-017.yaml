payload:
  book_metadata:
    2 Baruch:
      display_name: 2 பாரூக்கு
      author: ஆசிரியர் அறியப்படாதவர்; எரேமியாவின் எழுத்தராகிய பாரூக்கின் பெயரில் எழுதப்பட்டதாகக் கருதப்படுகிறது.
      audience: கி.பி. 70-இல் ஆலயம் அழிக்கப்பட்ட பின்னர், நாடுகடத்தலை இறையியல் நோக்கில் புரிந்துகொள்ள முயன்ற யூதர்கள்.
      date: ஏறத்தாழ கி.பி. 1ஆம் நூற்றாண்டின் பிற்பகுதி முதல் 2ஆம் நூற்றாண்டின் முற்பகுதி வரை; முதன்மையாக சிரியாக் மொழியில் பாதுகாக்கப்பட்டுள்ளது.
  chapter_titles:
    1 Enoch:
      '81':
        title: ஏனோக்கு விண்ணுலகப் பலகைகளை வாசிக்கிறார்
      '82':
        title: பாதுகாத்து வைக்குமாறு மெத்தூசலாவுக்கு ஏனோக்கு கட்டளையிடுகிறார்
      '83':
        title: பூமி அழிக்கப்படுவதை ஏனோக்கு காண்கிறார்
      '84':
        title: பரிசுத்தமான இறைவனை ஏனோக்கு வாழ்த்துகிறார்
      '85':
        title: தம் குடும்பத்தின் கதியை ஏனோக்கு கனவில் காண்கிறார்
      '86':
        title: விண்மீன்கள் விழுந்து கால்நடைகளிடையே மேய்கின்றன
      '87':
        title: விண்ணுலக உயிர்கள் ஏழு பேர் கோபுரத்தைக் காட்டுகின்றனர்
      '88':
        title: விழுந்த விண்மீனை வானதூதர் பிடிக்கிறார்
      '89':
        title: விலங்குகளால் குறிக்கப்படும் அடையாளங்களை ஏனோக்கு காண்கிறார்
      '90':
        title: மேய்ப்பர்கள் மந்தையைத் தவறாக ஆளுகின்றனர்; செம்மறியாட்டு மந்தை மீண்டும் கட்டியெழுப்பப்படுகிறது
      '91':
        title: வரவிருக்கும் தண்டனைகளை ஏனோக்கு வெளிப்படுத்துகிறார்
      '92':
        title: நீதியுள்ள தலைமுறைகளுக்காக ஏனோக்கு எழுதுகிறார்
      '93':
        title: வாரங்கள் வரலாற்றையும் நியாயத்தீர்ப்பையும் சுருக்கமாகக் காட்டுகின்றன
      '94':
        title: தீய வழிகளை விடுத்து நீதியைத் தேர்ந்தெடுங்கள்
      '95':
        title: வரவிருக்கும் கண்டனத்தை நினைத்து ஏனோக்கு அழுகிறார்
      '96':
        title: பாவிகளுக்கு மேலாக நீதிமான்கள் உயரப் பறப்பார்கள்
      '97':
        title: நீதிமான்கள் மகிழ்கிறார்கள்; பாவிகள் வீழ்கிறார்கள்
      '98':
        title: ஆடம்பரம் அவமானத்தையும் அழிவையும் கொண்டுவருகிறது
      '99':
        title: தீமை செய்பவர்களுக்கு ஐயோ என்று அறிவிக்கப்படுகிறது
      '100':
        title: வானதூதர்கள் பொல்லாதவர்களைத் தீர்ப்பிட்டு நீதிமான்களைக் காக்கின்றனர்
      '101':
        title: இறைவனுக்கு அஞ்சி, தீமை செய்வதை நிறுத்துங்கள்
      '102':
        title: நியாயத்தீர்ப்பு நாளில் நீதிமான்கள் மகிழ்கிறார்கள்
      '103':
        title: நித்திய நிரபராதித்தன்மை நிலைநாட்டப்படுவதை ஏனோக்கு அறிவிக்கிறார்
      '104':
        title: பாவத்தைக் குறித்து ஏனோக்கு எச்சரிக்கிறார்
      '105':
        title: பெயர்கள் மகிமைக்கு முன் வைக்கப்படுகின்றன
      '106':
        title: எதிர்கால நம்பிக்கையின் அடையாளமாக நோவாவுக்குப் பெயரிடப்படுகிறது
      '107':
        title: இறுதித் தலைமுறை மீட்பைக் கொண்டுவருகிறது
      '108':
        title: ஏனோக்கு இறுதி எச்சரிக்கையை எழுதுகிறார்
    2 Baruch:
      '1':
        title: யூதாவைக் குறித்து பாரூக்குக்கு இறைவன் எச்சரிக்கிறார்
      '2':
        title: புறப்பட்டுச் செல்லுமாறு பாரூக்குக்கு ஆண்டவர் கட்டளையிடுகிறார்
      '3':
        title: எருசலேமின் கதியைக் குறித்து பாரூக்கு மன்றாடுகிறார்
      '4':
        title: மறைந்திருக்கும் நகரத்தின் உண்மை நிலையை ஆண்டவர் வெளிப்படுத்துகிறார்
      '5':
        title: எரேமியாவின் குழுவினரோடு பாரூக்கு அழுகிறார்
      '6':
        title: சீயோனைக் காக்கும் வானதூதர்களைப் பாரூக்கு காண்கிறார்
      '7':
        title: சீயோனை வீழ்த்துமாறு வானதூதர்களுக்கு ஆணையிடப்படுகிறது
      '8':
        title: விண்ணுலக உருவம் புனிதப் பொருட்களை அகற்றுகிறது
      '9':
        title: எரேமியாவும் பாரூக்கும் ஒன்றாகத் துயரப்படுகின்றனர்
      '10':
        title: சீயோனின் பாழ்நிலைக்காக பாரூக்கு ஆழ்ந்து புலம்புகிறார்
      '11':
        title: பாபிலோனின் செழிப்பைக் குறித்து பாரூக்கு புலம்புகிறார்
      '12':
        title: வரவிருக்கும் கோபத்தைக் குறித்து பாரூக்கு எச்சரிக்கிறார்
      '13':
        title: எதிர்காலத்தில் சாட்சியமளிப்பதைப் பாரூக்குக்கு இறைவன் காட்டுகிறார்
      '14':
        title: நீதிமானாக இருப்பதன் பயன் என்னவென்று பாரூக்கு கேட்கிறார்
      '15':
        title: பாவிகளின் பொறுப்புணர்வை ஆண்டவர் விளக்குகிறார்
      '16':
        title: வருங்கால மகிமையால் பாரூக்கு ஊக்கமடைகிறார்
      '17':
        title: வாழ்நாளின் பொருளைப் பாரூக்கு அறிகிறார்
      '18':
        title: இறை ஒளியைப் பாரூக்கு விளக்குகிறார்
      '19':
        title: ஒவ்வொருவரையும் இறைவன் தீர்ப்பிடுகிறார்
      '20':
        title: விரைவில் வரவிருக்கும் நியாயத்தீர்ப்பை இறைவன் வாக்களிக்கிறார்
      '21':
        title: கீதரோன் அருகே பாரூக்கு மன்றாடுகிறார்
      '22':
        title: மேலிருந்து வரும் குரலுக்குப் பாரூக்கு செவிகொடுக்கிறார்
      '23':
        title: காத்திருக்கும் எல்லாத் தலைமுறைகளையும் இறைவன் நினைவுகூர்கிறார்
      '24':
        title: வருங்கால நியாயத்தீர்ப்பைப் பாரூக்கு காண்கிறார்
      '25':
        title: முடிவுவரை பாரூக்கு காக்கப்படுகிறார்
      '26':
        title: உபத்திரவத்தின் கால அளவைப் பாரூக்கு கேட்கிறார்
      '27':
        title: வரவிருக்கும் காலத்தின் நிகழ்வுகளைப் பாரூக்கு விவரிக்கிறார்
      '28':
        title: அழிவில்லாத நிலையைப் பற்றிப் பாரூக்கு கேட்கிறார்
      '29':
        title: பூமி நிறைவான வளத்தால் நிரம்பி வழிகிறது
      '30':
        title: மேசியாவுடன் ஆத்துமாக்கள் எழுகின்றன
      '31':
        title: மூப்பர்களைச் சீயோனுக்கு பாரூக்கு கூட்டுகிறார்
      '32':
        title: இறைவனின் திருச்சட்டத்தைக் கடைப்பிடித்து பாதுகாப்பாக இருங்கள்
      '33':
        title: தங்கியிருக்குமாறு மக்கள் பாரூக்கிடம் வேண்டுகின்றனர்
      '34':
        title: பாரூக்கு அழுதபடியே மக்களுக்கு உறுதியளிக்கிறார்
      '35':
        title: சீயோனின் துயரத்திற்காக பாரூக்கு அழுகிறார்
      '36':
        title: கேதுரு மரத்தைத் திராட்சைக்கொடி குற்றஞ்சாட்டுகிறது
      '37':
        title: வீழ்ந்த கேதுரு மரத்தைத் திராட்சைக்கொடி குற்றஞ்சாட்டுகிறது
      '38':
        title: தரிசனத்தின் விளக்கத்திற்காக பாரூக்கு மன்றாடுகிறார்
      '39':
        title: அரசுகளைப் குறித்து பாரூக்கு முன்னறிவிக்கிறார்
      '40':
        title: எஞ்சிய மக்களை மேசியா பாதுகாப்பார்
      '41':
        title: எதிர்கால நிகழ்வுகளைப் பற்றி பாரூக்கு கேட்கிறார்
      '42':
        title: கடந்த காலத்தைவிட நம்பிக்கையே முக்கியமானது
      '43':
        title: நித்திய ஆறுதலுக்குப் பாரூக்கு செவிகொடுக்கிறார்
      '44':
        title: தம் மகன் ஞானத்தைப் பாரூக்கு அழைக்கிறார்
      '45':
        title: நிலைநின்று, அஞ்சி, சீயோனைத் தேடுங்கள்
      '46':
        title: மூப்பர்களுக்கு நம்பிக்கையூட்டிப் பாரூக்கு உறுதியளிக்கிறார்
      '47':
        title: பாரூக்கு ஏழு நாட்கள் நோன்பிருக்கிறார்
      '48':
        title: எஞ்சியோருக்காக பாரூக்கு மன்றாடுகிறார்
      '49':
        title: வருங்கால வாழ்வைப் பற்றி பாரூக்கு கேட்கிறார்
      '50':
        title: இறந்தவர்கள் அடையாளம் காணத்தக்கவர்களாக உயிர்த்தெழுவார்கள்
      '51':
        title: பொல்லாதவர்கள் வாடுகின்றனர்; நீதிமான்கள் மகிமைப்படுத்தப்படுகின்றனர்
      '52':
        title: இறந்தவர்கள் திரும்பி வரும்போது உயிரோடிருப்பவர்கள் அவர்களை அடையாளம் காண்கின்றனர்
      '53':
        title: மேகத்தைப் பற்றிய தரிசனத்தைப் பாரூக்கு கனவில் காண்கிறார்
      '54':
        title: தரிசனத்தின் விளக்கத்திற்காக பாரூக்கு மன்றாடுகிறார்
      '55':
        title: எதிர்கால மறைபொருள்களைப் பாரூக்குக்கு இறைவன் காட்டுகிறார்
      '56':
        title: மேகம் உலகின் தொடக்கத்தைக் குறிக்கிறது
      '57':
        title: கருநீர் ஆதாமின் மீறுதலைக் குறிக்கிறது
      '58':
        title: பாவம் பூமியை மூடுவதை ஆதாம் காண்கிறார்
      '59':
        title: பாவம் நிறைந்த உலகத்தின் மேல் மேகம் எழுகிறது
      '60':
        title: எமோரியரின் பொல்லாங்கு இஸ்ரவேலைக் கறைப்படுத்துகிறது
      '61':
        title: தாவீது, சாலொமோன் காலம் செழிக்கிறது
      '62':
        title: யெரொபெயாமின் பாவம் அழிவைக் கொண்டுவருகிறது
      '63':
        title: எசேக்கியாவின் நீதி வெற்றி பெறுகிறது
      '64':
        title: மனாசேயின் பொல்லாங்கு தீட்டுப்படுத்துகிறது
      '65':
        title: ஆமோனின் தீமை இருளோடு ஆட்சி செய்கிறது
      '66':
        title: யோசியாவின் தூய்மை சீயோனை மீட்டெடுக்கிறது
      '67':
