payload:
  book_metadata:
    Isaiah:
      display_name: ஏசாயா
      author: பல நூற்றாண்டுகளில் பல ஆசிரியர்கள்; 1–39 அதிகாரங்கள் கி.மு. 8ஆம் நூற்றாண்டில் வாழ்ந்த எருசலேமைச் சேர்ந்த ஏசாயாவை அடிப்படையாகக் கொண்டவை; 40–55 ("இரண்டாம் ஏசாயா") மற்றும் 56–66 ("மூன்றாம் ஏசாயா") சிறையிருப்பையும் திரும்பிவருதலையும் பின்னணியாகக் கொண்டவை.
      audience: அசீரிய அச்சுறுத்தலின் கீழிருந்த யூதா, பாபிலோனியச் சிறையிருப்பில் இருந்தவர்கள், சிறையிருப்புக்குப் பிந்தைய மறுசீரமைப்புக் காலத்தினர் — அடுத்தடுத்த காலங்களில்.
      date: ஏறத்தாழ கி.மு. 8ஆம் நூற்றாண்டின் பிற்பகுதி முதல் 5ஆம் நூற்றாண்டுவரை இயற்றப்பட்டது.
    Jeremiah:
      display_name: எரேமியா
      author: ஆனதோத்தைச் சேர்ந்த எரேமியா; அவருடைய எழுத்தர் பாரூக்கும் பிற்காலத்தவர்களும் கணிசமான அளவில் தொகுத்திருக்கலாம்.
      audience: பாபிலோனியப் படையெடுப்புக்கு முன்னரும், அதன் போதும், அதற்குப் பின்னரும் வாழ்ந்த யூதா மக்கள்.
      date: கி.மு. 7ஆம் நூற்றாண்டின் பிற்பகுதி முதல் 6ஆம் நூற்றாண்டின் முற்பகுதிவரை.
  chapter_titles:
    Isaiah:
      '1':
        title: கலகம் செய்த யூதாவைக் கடவுள் நிராகரிக்கிறார்
      '2':
        title: ஆண்டவரின் இல்லம் அனைத்திற்கும் மேலாக உயர்த்தப்படுகிறது
      '3':
        title: தீர்ப்பு தேசத்தின் வீழ்ச்சியைக் கொண்டுவருகிறது
      '4':
        title: அழிவுக்குப் பிறகு மறுசீரமைப்பு வாக்களிக்கப்படுகிறது
      '5':
        title: ஆண்டவரின் திராட்சைத்தோட்டம் வன்முறையை விளைவிக்கிறது
      '6':
        title: கடவுளின் திகைப்பூட்டும் மகிமையை ஏசாயா காண்கிறார்
      '7':
        title: அசீரியா வருமுன் இம்மானுவேல் பிறக்கிறார்
      '8':
        title: மகேர்-சாலால்-அஷ்-பாஸ் என்ற பெயர் தீர்ப்பை அறிவிக்கிறது
      '9':
        title: ஒளி நம்பிக்கையைக் கொண்டுவருகிறது — ஏசாயா
      '10':
        title: பெருமைகொண்ட அசீரியாவைக் கடவுள் நியாயந்தீர்க்கிறார்
      '11':
        title: புதிய அரசர் பூமியில் சமாதானத்தைக் கொண்டுவருகிறார்
      '12':
        title: கடவுளின் மக்கள் தங்கள் மீட்புக்காக அவரைப் போற்றுகிறார்கள்
      '13':
        title: பாபிலோன் முழுமையான அழிவை எதிர்கொள்கிறது
      '14':
        title: வீழ்ந்த பாபிலோன் அரசனை இஸ்ரவேல் ஏளனம் செய்கிறது
      '15':
        title: மோவாப் திடீரெனக் கொடிய பேரழிவைச் சந்திக்கிறது
      '16':
        title: மோவாபின் பெருமை கடுமையான தீர்ப்பைக் கொண்டுவருகிறது
      '17':
        title: தமஸ்குவும் எப்பிராயீமும் முற்றிலும் சூறையாடப்படுகின்றன
      '18':
        title: தொலைதூர நாடு தூதர்களை நெடுந்தொலைவுக்கு அனுப்புகிறது
      '19':
        title: எகிப்து தாழ்த்தப்பட்டு பின்னர் குணமடைகிறது
      '20':
        title: ஏசாயா அடையாளமாக ஆடையின்றி நடக்கிறார்
      '21':
        title: பாபிலோன் திடீரென வீழ்கிறது; விருந்து முடிகிறது
      '22':
        title: எருசலேமின் ஆரவாரம் தீர்ப்பைக் கொண்டுவருகிறது
      '23':
        title: தீருவின் செல்வமும் அதிகாரமும் வீழ்கின்றன
      '24':
        title: பூமி எங்கும் பரவும் முழுமையான தீர்ப்பை எதிர்கொள்கிறது
      '25':
        title: ஆண்டவர் விருந்து அளித்து மரணத்தை நீக்குகிறார்
      '26':
        title: கடவுள் தம் மக்களைப் பாதுகாக்கிறார்
      '27':
        title: லிவியாதான் தோற்கடிக்கப்படுகிறது; இஸ்ரவேல் காக்கப்படுகிறது
      '28':
        title: பெருமைகொண்ட தலைவர்கள் கடவுளின் வார்த்தையை ஏளனம் செய்கிறார்கள்
      '29':
        title: முற்றுகையின்போது எருசலேம் தாழ்த்தப்படுகிறது
      '30':
        title: எகிப்தை நம்பும் யூதா அழிவை எதிர்கொள்கிறது
      '31':
        title: சீயோனுக்காகக் கடவுள் ஒருவரே போரிடுகிறார்
      '32':
        title: நீதியுள்ள அரசர் நியாயத்தைக் கொண்டுவருகிறார்
      '33':
        title: வன்முறை தீயவர்கள்மீதே திரும்புகிறது
      '34':
        title: ஆண்டவர் ஏதோமைக் கடுமையாக நியாயந்தீர்க்கிறார்
      '35':
        title: வனாந்தரம் மகிமையுடன் மலர்கிறது
      '36':
        title: யூதாவின் நம்பிக்கையை ரப்சாக்கே ஏளனம் செய்கிறான்
      '37':
        title: எசேக்கியா ஜெபிக்கிறார்; கடவுள் பதிலளிக்கிறார்
      '38':
        title: எசேக்கியாவின் நோயும் குணமடைதலும்
      '39':
        title: எசேக்கியாவின் செல்வங்களைப் பாபிலோன் காண்கிறது
      '40':
        title: கடவுளின் மக்களுக்கு ஆறுதல் வருகிறது
      '41':
        title: ஆண்டவர் ஒருவரே வரலாற்றை ஆளுகிறார்
      '42':
        title: பணியாளர் மென்மையாக நீதியைக் கொண்டுவருகிறார்
      '43':
        title: இஸ்ரவேலுடன் எப்போதும் இருப்பதாகக் கடவுள் வாக்களிக்கிறார்
      '44':
        title: ஆண்டவர் ஒருவரே உண்மையான கடவுள்
      '45':
        title: இஸ்ரவேலை விடுவிக்க கோரேசு தேர்ந்தெடுக்கப்படுகிறார்
      '46':
        title: வாழ்நாள் முழுவதும் இஸ்ரவேலை ஆண்டவர் சுமக்கிறார்
      '47':
        title: பழிவாங்குதலின்கீழ் பாபிலோன் வீழ்கிறது
      '48':
        title: இஸ்ரவேலின் பிடிவாதம் கண்டிக்கப்படுகிறது
      '49':
        title: பணியாளரின் பணி மிகப் பெரியது
      '50':
        title: துன்பத்தின் நடுவிலும் பணியாளர் நம்புகிறார்
      '51':
        title: ஆபிரகாமின் உண்மைத்தன்மையை நினைவுகூருங்கள்
      '52':
        title: சிறையிருப்பிலிருந்து எருசலேம் விழித்தெழுகிறது
      '53':
        title: துன்புறும் பணியாளர் பாவத்தைச் சுமக்கிறார்
      '54':
        title: கைவிடப்பட்ட தம் மணமகளைக் கடவுள் மீட்டெடுக்கிறார்
      '55':
        title: வாருங்கள், வாழ்வை இலவசமாகப் பெற்றுக்கொள்ளுங்கள்
      '56':
        title: உண்மையுடன் வழிபடும் அந்நியர்களைக் கடவுள் வரவேற்கிறார்
      '57':
        title: நீதியாக வாழுங்கள்; மீட்பு அருகில் உள்ளது
      '58':
        title: கடவுளின் மக்கள் மீட்டெடுக்கப்படுவார்கள்
      '59':
        title: நீதியையும் இரக்கத்தையும் உண்மையுடன் நாடுங்கள்
      '60':
        title: சீயோனுக்கு உதவ மீட்பர் வருகிறார்
      '61':
        title: குணமாக்குவதற்காகப் பணியாளரைக் கடவுள் அருள்பொழிவு செய்கிறார்
      '62':
        title: சீயோனைக் கனப்படுத்துவதாக ஆண்டவர் ஆணையிட்டு உறுதிசெய்கிறார்
      '63':
        title: போர்வீரரான கடவுள் கடுங்கோபத்துடன் திரும்புகிறார்
      '64':
        title: பரிசுத்த கடவுள் திரும்பிவர வேண்டிய ஜெபம்
      '65':
        title: உண்மையுள்ள மீதியானோருக்குப் புதிய வானங்கள்
      '66':
        title: ஆண்டவர் சீயோனை நியாயந்தீர்த்து மீட்டெடுக்கிறார்
    Jeremiah:
      '1':
        title: எரேமியாவைக் கடவுள் தீர்க்கதரிசியாக நியமிக்கிறார்
      '2':
        title: ஜீவத்தண்ணீரை எருசலேம் கைவிடுகிறது
      '3':
        title: உண்மையுள்ள கடவுளிடம் இஸ்ரவேல் திரும்புகிறது
      '4':
        title: வரவிருக்கும் தீர்ப்பை யூதா எதிர்கொள்கிறது
      '5':
        title: எருசலேம் சீர்கேட்டால் நிறைந்துள்ளது
      '6':
        title: வடக்கிலிருந்து படை வரும்
      '7':
        title: ஆலயத்தில் எரேமியா எச்சரிக்கிறார்
      '8':
        title: யூதாவின் தீர்ப்பு முழுமையடைந்தது
      '9':
        title: மக்கள் துரோகத்தால் நிறைந்திருக்கிறார்கள்
      '10':
        title: சிலைகள் மனிதர் செய்தவை; வெறுமையானவை
      '11':
        title: யூதா உடன்படிக்கையை மீறிவிட்டது
      '12':
        title: தீயவர்கள் ஏன் செழிக்கிறார்கள்?
      '13':
        title: பெருமையால் யூதா பயனற்றதாகிறது
      '14':
        title: வறட்சி யூதாவைக் கடும் தவிப்புக்கு உள்ளாக்குகிறது
      '15':
        title: தீர்ப்பு இப்போது தவிர்க்க முடியாதது
      '16':
        title: யூதாமீது கொடிய தீர்ப்பு வருகிறது
      '17':
        title: யூதா கடவுளின் தீர்ப்பை எதிர்கொள்கிறது
      '18':
        title: பிடிவாதமுள்ள யூதாவை எரேமியா எச்சரிக்கிறார்
      '19':
        title: நகரத்தின்மீது கொடிய தீர்ப்பு வருகிறது
      '20':
        title: எரேமியா தீர்ப்பை அறிவிக்கிறார்
      '21':
        title: செதேக்கியா அரசன் உதவி கேட்கிறான்
      '22':
        title: நீதியுடனும் இரக்கத்துடனும் ஆட்சி செய்யுங்கள்
      '23':
        title: பொய்யான மேய்ப்பர்களைக் கடவுள் நியாயந்தீர்க்கிறார்
      '24':
        title: நல்ல அத்திப்பழங்கள் நாடுகடத்தப்பட்ட மக்களைக் குறிக்கின்றன
      '25':
        title: நேபுகாத்நேச்சார் யூதாவுக்கு எதிராக வருவான்
      '26':
        title: ஆலயத்தில் எரேமியா எச்சரிக்கிறார்
      '27':
        title: பாபிலோனின் ஆட்சிக்கு அடிபணியுங்கள்
      '28':
        title: பொய்த் தீர்க்கதரிசனம் சொன்னதால் அனனியா இறக்கிறான்
      '29':
