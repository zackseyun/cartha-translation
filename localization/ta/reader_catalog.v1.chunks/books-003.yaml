payload:
  book_metadata:
    Judges:
      display_name: நியாயாதிபதிகள்
      author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
      audience: தங்கள் முடியாட்சிக்கு முந்தைய கடந்தகாலத்தை, இறைவனை விட்டு விலகுவதும் விடுதலை பெறுவதும் மாறிமாறி நிகழ்ந்த ஓர் எச்சரிக்கைச் சுழற்சியாக வாசித்த பிற்கால இஸ்ரவேலர்.
      date: ஏறத்தாழ கி.மு. 7–6ஆம் நூற்றாண்டுகளில் தொகுக்கப்பட்டது.
    Ruth:
      display_name: ரூத்
      author: ஆசிரியர் பெயர் தெரியவில்லை.
      audience: நாடுகடத்தலுக்குப் பிந்தைய இஸ்ரவேலர்—எஸ்றா–நெகேமியாவின் விலக்கிவைக்கும் கொள்கைகளுக்கு மாறாக, அந்நியர்களையும் ஏற்றுக்கொள்வதை ஆதரிப்பதற்காக எழுதப்பட்டிருக்கலாம்.
      date: பெரும்பாலும் நாடுகடத்தலுக்குப் பிந்தைய காலத்தைச் சேர்ந்தது; ஏறத்தாழ கி.மு. 6–4ஆம் நூற்றாண்டுகள்.
    1 Samuel:
      display_name: 1 சாமுவேல்
      author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
      audience: சாமுவேல், சவுல், தாவீது ஆகியோரின் காலத்தில் முடியாட்சி உருவானதைப் பற்றிச் சிந்தித்த இஸ்ரவேலர்.
      date: பழைய ஆதாரங்களிலிருந்து ஏறத்தாழ கி.மு. 7–6ஆம் நூற்றாண்டுகளில் தொகுக்கப்பட்டது.
    2 Samuel:
      display_name: 2 சாமுவேல்
      author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
      audience: தாவீதின் ஆட்சியையும்—அதன் வெற்றிகளையும் துயரங்களையும்—மன்னராட்சியின் தொடக்க முன்மாதிரியாக வாசித்த இஸ்ரவேலர்.
      date: ஏறத்தாழ கி.மு. 7–6ஆம் நூற்றாண்டுகளில் தொகுக்கப்பட்டது.
  chapter_titles:
    Joshua:
      '8':
        title: ஆய் நகரம் கைப்பற்றப்பட்டு, திருச்சட்டம் புதுப்பிக்கப்படுகிறது
      '9':
        title: கிபியோனியர் சமாதானத்திற்காக ஏமாற்றுகின்றனர்
      '10':
        title: போரில் சூரியன் அசையாமல் நிற்கிறது
      '11':
        title: இஸ்ரவேல் வடக்கே முன்னேறி வெற்றி பெறுகிறது
      '12':
        title: முப்பத்தொரு அரசர்கள் தோற்கடிக்கப்படுகின்றனர்
      '13':
        title: கைப்பற்ற இன்னும் பெருமளவு நிலம் உள்ளது
      '14':
        title: காலேப் தனது மலைநாட்டைக் கோருகிறார்
      '15':
        title: யூதாவின் நகரங்களும் நீரூற்றுகளும் உறுதிசெய்யப்படுகின்றன
      '16':
        title: யோர்தானுக்கு மேற்கே எபிராயீமின் நிலம்
      '17':
        title: மனாசேயின் உரிமைநிலமும் கடமையும்
      '18':
        title: பென்யமீனின் எல்லைகளும் நகரங்களும்
      '19':
        title: லேவியர் தங்கள் நகரங்களைப் பெறுகின்றனர்
      '20':
        title: அறியாமல் கொன்றவர்களுக்கான அடைக்கல நகரங்கள்
      '21':
        title: லேவியர் குருத்துவப் பணிக்காகப் பிரித்துவைக்கப்படுகின்றனர்
      '22':
        title: கிழக்குக் கோத்திரத்தார் சாட்சி பீடத்தைக் கட்டுகின்றனர்
      '23':
        title: உண்மையுடன் கீழ்ப்படியுமாறு யோசுவா வலியுறுத்துகிறார்
      '24':
        title: தேர்ந்தெடுக்குமாறு இஸ்ரவேலரை யோசுவா அழைக்கிறார்
    Judges:
      '1':
        title: கானானியருக்கு எதிராக யூதா தலைமையேற்கிறது
      '2':
        title: உடன்படிக்கையை மீறிய இஸ்ரவேலரைத் தூதர் கண்டிக்கிறார்
      '3':
        title: ஒத்னியேல் ஆராமைத் தோற்கடிக்கிறார்
      '4':
        title: தெபோரா நீதி வழங்கி சிசெராவைத் தோற்கடிக்கிறார்
      '5':
        title: வெற்றிக்காகக் கடவுளைத் தெபோரா புகழ்கிறார்
      '6':
        title: கிதியோன் விசுவாசத்திற்கும் ஐயத்திற்கும் இடையே போராடுகிறார்
      '7':
        title: கிதியோன் மீதியானைத் தோற்கடிக்கிறார்
      '8':
        title: உதவ மறுத்த நகரங்களைக் கிதியோன் தண்டிக்கிறார்
      '9':
        title: யோதாம் சீகேமை எச்சரிக்கிறார்
      '10':
        title: சிலைவழிபாட்டுக்குப் பின் அம்மோனியர் இஸ்ரவேலை ஒடுக்குகின்றனர்
      '11':
        title: இப்தா தன் மகளைப் பலியிடுவதாக நேர்ந்துகொள்கிறார்
      '12':
        title: ‘ஷிபோலேத்’ சோதனையால் எபிராயீமியர் கொல்லப்படுகின்றனர்
      '13':
        title: சிம்சோனின் பிறப்பைத் தூதர் முன்னறிவிக்கிறார்
      '14':
        title: சிம்சோன் தாடை எலும்பால் பெலிஸ்தியரைத் தோற்கடிக்கிறார்
      '15':
        title: சிம்சோன் பழிவாங்கி பெலிஸ்தியரைக் கொல்கிறார்
      '16':
        title: சிம்சோன் பெலிஸ்தியரின் கோவிலை இடித்துத் தள்ளுகிறார்
      '17':
        title: மீகா அலைந்து திரிந்த குருவை வேலைக்கு அமர்த்துகிறார்
      '18':
        title: சிலைக்காகக் குருவைத் தாண் கோத்திரத்தார் கவர்ந்து செல்கின்றனர்
      '19':
        title: பென்யமீனியர் லேவியனின் மறுமனைவியைக் கொல்கின்றனர்
      '20':
        title: கிபியாவில் பென்யமீனை இஸ்ரவேல் தோற்கடிக்கிறது
      '21':
        title: நெருக்கடியிலிருந்து பென்யமீன் தப்பிப் பிழைக்கிறது
    Ruth:
      '1':
        title: அனைத்தையும் இழந்த நகோமி வெறுமையுடன் திரும்புகிறார்
      '2':
        title: போவாசின் வயலில் ரூத் கதிர் பொறுக்குகிறார்
      '3':
        title: இரவில் ரூத் பாதுகாப்பை நாடுகிறார்
      '4':
        title: போவாஸ் ரூத்தையும் குடும்பத்தையும் மீட்கிறார்
    1 Samuel:
      '1':
        title: ஒரு மகனுக்காக அன்னாள் மன்றாடுகிறார்
      '2':
        title: கடவுளின் பேராட்சியை அன்னாள் புகழ்கிறார்
      '3':
        title: கடவுளின் அழைப்பைச் சாமுவேல் கேட்கிறார்
      '4':
        title: உடன்படிக்கைப் பெட்டியைப் பெலிஸ்தியரிடம் இஸ்ரவேல் இழக்கிறது
      '5':
        title: உடன்படிக்கைப் பெட்டியால் பெலிஸ்தியர் துன்புறுகின்றனர்
      '6':
        title: உடன்படிக்கைப் பெட்டி திரும்புகிறது; பெத்-ஷெமேஷ் மகிழ்கிறது
      '7':
        title: இஸ்ரவேல் மனந்திரும்பி பெலிஸ்தியரைத் தோற்கடிக்கிறது
      '8':
        title: இஸ்ரவேல் ஓர் அரசனைக் கேட்கிறது
      '9':
        title: இறைவாக்கினரான சாமுவேலைச் சவுல் சந்திக்கிறார்
      '10':
        title: சவுலை அரசராகச் சாமுவேல் திருப்பொழிவு செய்கிறார்
      '11':
        title: அம்மோனுக்கு எதிராக இஸ்ரவேலைச் சவுல் ஒன்றிணைக்கிறார்
      '12':
        title: இஸ்ரவேலின் பாவத்தைச் சாமுவேல் கண்டிக்கிறார்
      '13':
        title: கடவுளின் கட்டளைக்குச் சவுல் கீழ்ப்படியவில்லை
      '14':
        title: தாவீது விசுவாசத்துடன் பெலிஸ்தியரைத் தோற்கடிக்கிறார்
      '15':
        title: சவுலின் பொறாமை தாவீதுக்கு அச்சுறுத்தலாகிறது
      '16':
        title: சவுலுக்குப் பதிலாகத் தாவீதைக் கடவுள் தேர்ந்தெடுக்கிறார்
      '17':
        title: மாவீரன் கோலியாத்தைத் தாவீது தோற்கடிக்கிறார்
      '18':
        title: யோனத்தான் தாவீதுடன் நெருங்கிய நட்புறவு கொள்கிறார்
      '19':
        title: சவுலிடமிருந்து தாவீது தப்பிச் செல்கிறார்
      '20':
        title: ஆபத்தைப் பற்றித் தாவீதை யோனத்தான் எச்சரிக்கிறார்
      '21':
        title: குருவான அகிமெலேக்கிடம் தாவீது தப்பிச் செல்கிறார்
      '22':
        title: அதுல்லாமில் தாவீது தலைவராகிறார்
      '23':
        title: சவுல் அரசனின் உயிரைத் தாவீது காப்பாற்றுகிறார்
      '24':
        title: குகையில் சவுலின் உயிரைத் தாவீது காப்பாற்றுகிறார்
      '25':
        title: அபிகாயில் மன்றாடுகிறார்; நாபால் இறக்கிறார்
      '26':
        title: சவுலின் உயிரைத் தாவீது காப்பாற்றுகிறார்
      '27':
        title: ஆகீசுக்காகத் தாக்குதல் நடத்தியதாகத் தாவீது பாசாங்கு செய்கிறார்
      '28':
        title: விரக்தியில் சாமுவேலைச் சவுல் நாடுகிறார்
      '29':
        title: போரில் பங்கேற்கத் தாவீது அனுமதிக்கப்படவில்லை
      '30':
        title: சிக்லாகில் சிறைபிடிக்கப்பட்டவர்களைத் தாவீது மீட்கிறார்
      '31':
        title: சவுல் வீழ்கிறார்; பெலிஸ்தியர் வெற்றி பெறுகின்றனர்
    2 Samuel:
      '1':
        title: சவுலின் மரணத்திற்காகத் தாவீது புலம்புகிறார்
      '2':
        title: யூதா தாவீதை அரசராகத் திருப்பொழிவு செய்கிறது
      '3':
        title: சவுலின் குடும்பத்திற்கு அப்னேர் துரோகம் செய்கிறார்
      '4':
        title: இஸ்போசேத்துக்குத் தாவீது மரியாதை செலுத்துகிறார்
      '5':
        title: தாவீதின் கீழ் இஸ்ரவேல் ஒன்றிணைகிறது
      '6':
        title: உடன்படிக்கைப் பெட்டியைத் தாவீது எருசலேமுக்குக் கொண்டுவருகிறார்
      '7':
        title: கடவுளின் வாக்குறுதியை நாத்தான் அறிவிக்கிறார்
      '8':
        title: பெலிஸ்தியரின் கூட்டாளிகளைத் தாவீது தோற்கடிக்கிறார்
      '9':
        title: மெபிபோசேத்துக்குத் தாவீது இரக்கம் காட்டுகிறார்
      '10':
        title: அம்மோனியப் படைகளை யோவாப் தோற்கடிக்கிறார்
      '11':
