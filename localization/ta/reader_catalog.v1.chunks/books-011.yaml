payload:
  book_metadata:
    Luke:
      display_name: லூக்கா
      author: ஆசிரியர் பெயர் தெரியவில்லை; பவுலின் பயணத் தோழரான லூக்கா இதை எழுதியதாக மரபு கூறுகிறது.
      audience: “தெயோப்பிலு” என்பவரை முன்னிலைப்படுத்தி எழுதப்பட்ட, கல்வியறிவுள்ள கிரேக்க-ரோமக் கிறிஸ்தவ வாசகர்கள்.
      date: சுமார் கி.பி. 80–90.
    John:
      display_name: யோவான்
      author: ஆசிரியர் பெயர் தெரியவில்லை; அப்போஸ்தலனாகிய யோவான் அல்லது “அன்புக்குரிய சீடர்” இதை எழுதியதாக மரபு கூறுகிறது.
      audience: அன்புக்குரிய சீடரின் சாட்சியத்தைச் சுற்றி உருவானதும், யூத தொழுகைக்கூட மரபுடன் பதற்றத்தில் இருந்ததுமான ஒரு கிறிஸ்தவச் சமூகம்.
      date: சுமார் கி.பி. 90–110.
      summary: யோவான், தந்தையை வெளிப்படுத்துகிறவரும், தம்மில் நம்பிக்கை வைப்போருக்கு வாழ்வை அளிக்கிறவருமான நித்திய வார்த்தையாக இயேசுவை எடுத்துரைக்கிறார்; அவர் தமது அடையாளச் செயல்கள், மரணம், உயிர்த்தெழுதல் ஆகியவற்றின் வழியாக மகிமைப்படுத்தப்படுகிறார்.
    Acts:
      display_name: அப்போஸ்தலர் பணிகள்
      author: ஆசிரியர் பெயர் தெரியவில்லை; லூக்கா நூலை எழுதிய அதே ஆசிரியர்.
      audience: தெயோப்பிலுவுக்கு உரையாற்றப்பட்ட படைப்பின் இரண்டாம் பாகமான இதை வாசிக்கும் கிரேக்க-ரோமக் கிறிஸ்தவ வாசகர்கள்.
      date: சுமார் கி.பி. 80–90.
    Romans:
      display_name: ரோமர்
      author: எழுத்தராகிய தெர்த்தியுவுடன் பவுல்.
      audience: தோரா சட்டம் மற்றும் அடையாளம் குறித்த பதற்றத்தில் இருந்த யூத மற்றும் பிறஇன நம்பிக்கையாளர்களைக் கொண்ட ரோமிலுள்ள கிறிஸ்தவர்கள்.
      date: சுமார் கி.பி. 56–58; கொரிந்துவிலிருந்து எழுதப்பட்டது.
  chapter_titles:
    Mark:
      '4':
        title: இயேசு கடலோரத்தில் உவமைகளைக் கற்பிக்கிறார்
      '5':
        title: இயேசு பிற இனத்தைச் சேர்ந்த ஒருவரைக் குணமாக்குகிறார்
      '6':
        title: இயேசு ஐயாயிரம் பேருக்கு உணவளிக்கிறார்
      '7':
        title: இயேசு மனித மரபுகளை எதிர்கொள்கிறார்
      '8':
        title: இயேசு நான்காயிரம் பேருக்கு உணவளிக்கிறார்
      '9':
        title: இயேசு தமது மகிமையை வெளிப்படுத்துகிறார்
      '10':
        title: இயேசு சிறுவர்களை இறையாட்சிக்குள் வரவேற்கிறார்
      '11':
        title: போற்றுதலுடன் இயேசு எருசலேமுக்குள் நுழைகிறார்
      '12':
        title: இயேசு சூழ்ச்சிக் கேள்விகளுக்குப் பதிலளித்துக் கற்பிக்கிறார்
      '13':
        title: இயேசு பெருந்துன்பத்தைப் பற்றிக் கற்பிக்கிறார்
      '14':
        title: இரவில் யூதாஸ் இயேசுவைக் காட்டிக்கொடுக்கிறான்
      '15':
        title: இயேசு சிலுவையில் அறையப்பட்டு உண்மையுடன் அடக்கம் செய்யப்படுகிறார்
      '16':
        title: இயேசு உயிர்த்தெழுகிறார்; பெண்கள் செய்தியை அறிவிக்கிறார்கள்
    Luke:
      '1':
        title: இரண்டு அற்புதப் பிறப்புகளைக் கடவுள் அறிவிக்கிறார்
      '2':
        title: இயேசுவின் பிறப்பு மகிழ்ச்சியைக் கொண்டுவருகிறது
      '3':
        title: யோவான் இயேசுவுக்கு வழியை ஆயத்தப்படுத்துகிறார்
      '4':
        title: இயேசு சோதனையை எதிர்த்து ஊழியத்தைத் தொடங்குகிறார்
      '5':
        title: மனிதரைப் பிடிக்கும் மீனவர்களை இயேசு அழைக்கிறார்
      '6':
        title: இயேசு பன்னிரண்டு அப்போஸ்தலர்களைத் தேர்ந்தெடுக்கிறார்
      '7':
        title: இயேசு நூற்றுவர் தலைவனின் பணியாளரைக் குணமாக்குகிறார்
      '8':
        title: இயேசு இறையாட்சியைப் பற்றிய உவமைகளைக் கற்பிக்கிறார்
      '9':
        title: இயேசு முழுமையான அர்ப்பணிப்பைக் கோருகிறார்
      '10':
        title: இயேசு சீடர்களை அனுப்புகிறார்
      '11':
        title: இயேசு விடாமுயற்சியுடன் மன்றாடக் கற்பிக்கிறார்
      '12':
        title: இயேசு வெளிவேடத்தைக் குறித்து எச்சரிக்கிறார்
      '13':
        title: இயேசு எச்சரித்துக் குணமாக்குகிறார்
      '14':
        title: இயேசு தாழ்மையையும் தாராள மனதையும் கற்பிக்கிறார்
      '15':
        title: தொலைந்துபோன பாவிகளை இயேசு வரவேற்கிறார்
      '16':
        title: செல்வத்தை வழிபடுவதை இயேசு கண்டிக்கிறார்
      '17':
        title: இயேசு சீடர்களை எச்சரித்துப் பணிவிடை செய்யச் சொல்கிறார்
      '18':
        title: இயேசு விடாமுயற்சியுடன் மன்றாடக் கற்பிக்கிறார்
      '19':
        title: எரிகோவில் இயேசு சகேயுவை மீட்கிறார்
      '20':
        title: இயேசு ஆலயத் தலைவர்களைச் சவாலிடுகிறார்
      '21':
        title: கைம்பெண்ணின் காணிக்கையும் வரவிருக்கும் பெருந்துன்பமும்
      '22':
        title: ஒலிவ மலையில் இயேசு மன்றாடுகிறார்
      '23':
        title: இயேசு புதிய கல்லறையில் அடக்கம் செய்யப்படுகிறார்
      '24':
        title: இயேசு உயிர்த்தெழுந்து மன்னிப்பை அறிவிக்கிறார்
    John:
      '1':
        title: வார்த்தை மனிதராகிறார்
      '2':
        title: இயேசு தண்ணீரைத் திராட்சை இரசமாக மாற்றுகிறார்
      '3':
        title: கடவுள் தமது அன்பு மகனை அளிக்கிறார்
      '4':
        title: இயேசு சமாரியப் பெண்ணைச் சந்திக்கிறார்
      '5':
        title: ஓய்வுநாளில் இயேசு ஒருவரைக் குணமாக்குகிறார்
      '6':
        title: இயேசு ஐயாயிரம் பேருக்கு உணவளிக்கிறார்
      '7':
        title: விழாவில் இயேசு கற்பிக்கிறார்
      '8':
        title: உலகின் ஒளியான இயேசு புறக்கணிக்கப்படுகிறார்
      '9':
        title: இயேசு பார்வையற்ற ஒருவரைக் குணமாக்குகிறார்
      '10':
        title: இயேசு தமது ஆடுகளைப் பற்றிப் பேசுகிறார்
      '11':
        title: இயேசு லாசருவை மரணத்திலிருந்து உயிருடன் எழுப்புகிறார்
      '12':
        title: இயேசுவின் அடக்கத்திற்காக மரியா அவருக்குத் தைலம் பூசுகிறார்
      '13':
        title: இயேசு சீடர்களின் கால்களைக் கழுவுகிறார்
      '14':
        title: இயேசு தூய ஆவியானவரை வாக்களிக்கிறார்
      '15':
        title: உண்மையான திராட்சைக்கொடியான இயேசு கிளைகளைக் கவாத்துச் செய்கிறார்
      '16':
        title: துன்பம் வரும்; ஆனாலும் மகிழ்ச்சி நிலைத்திருக்கும்
      '17':
        title: இயேசு தமது சீடர்களுக்காக மன்றாடுகிறார்
      '18':
        title: இயேசு கைது செய்யப்படுகிறார்; பேதுரு மறுதலிக்கிறார்
      '19':
        title: இயேசு சாட்டையால் அடிக்கப்பட்டு, கேலி செய்யப்பட்டு, சிலுவையில் அறையப்படுகிறார்
      '20':
        title: இயேசு மரியாவுக்குத் தம்மை வெளிப்படுத்துகிறார்
      '21':
        title: கடலோரத்தில் இயேசு பேதுருவை மீண்டும் நிலைநிறுத்துகிறார்
    Acts:
      '1':
        title: சாட்சிகள் தூய ஆவியானவருக்காகக் காத்திருக்கிறார்கள்
      '2':
        title: பெந்தெகொஸ்தே நாளில் தூய ஆவியானவர் பற்றியெரியச் செய்கிறார்
      '3':
        title: பேதுரு கால் ஊனமுற்ற பிச்சைக்காரரைக் குணமாக்குகிறார்
      '4':
        title: அப்போஸ்தலர்கள் பரிசுத்த துணிவுடன் பேசுகிறார்கள்
      '5':
        title: தீர்ப்பும் அற்புதங்களும் திருச்சபையைச் சோதிக்கின்றன
      '6':
        title: ஏழு பணியாளர்கள் திருச்சபைக்குத் துணைநிற்கிறார்கள்
      '7':
        title: வானம் திறந்திருப்பதை ஸ்தேவான் காண்கிறார்
      '8':
        title: நற்செய்தி சமாரியாவை எட்டுகிறது
      '9':
        title: உயிர்த்தெழுந்த இயேசுவை சவுல் சந்திக்கிறார்
      '10':
        title: பிற இனத்தார் தூய ஆவியானவரைப் பெறுகிறார்கள்
      '11':
        title: பிற இனத்தார் சேர்க்கப்பட்டதைப் பேதுரு ஆதரித்துப் பேசுகிறார்
      '12':
        title: வானதூதர் பேதுருவை விடுவிக்கிறார்
      '13':
        title: பிற இனத்தாரிடையே பவுல் தமது பணியைத் தொடங்குகிறார்
      '14':
        title: துன்புறுத்தலின் நடுவிலும் பவுல் விடாமுயற்சியுடன் தொடர்கிறார்
      '15':
        title: எருசலேம் சங்கம் பிற இனத்தாரை வரவேற்கிறது
      '16':
        title: வழிபாடு சிறைச்சாலையைத் திறக்கிறது
      '17':
        title: அறியப்படாத கடவுளைப் பவுல் அறிவிக்கிறார்
      '18':
        title: நற்செய்தி கொரிந்துவை எட்டுகிறது
      '19':
        title: அர்த்தமியை முன்னிட்டு எபேசுவில் கலகம் வெடிக்கிறது
      '20':
        title: பவுல் மூப்பர்களிடம் கண்ணீருடன் விடைபெறுகிறார்
      '21':
        title: பவுல் எருசலேமுக்குத் திரும்புகிறார்
      '22':
        title: பவுல் தமது அழைப்பைப் பற்றி விளக்கமளிக்கிறார்
      '23':
        title: பவுல் சங்கத்தின் முன் நிற்கிறார்
      '24':
        title: பெலிக்சின் முன் பவுல் சாட்சியளிக்கிறார்
      '25':
        title: பவுல் சீசரிடம் மேல்முறையீடு செய்கிறார்
      '26':
        title: அகிரிப்பாவின் முன் பவுல் சாட்சியளிக்கிறார்
      '27':
