payload:
  book_metadata:
    Genesis:
      display_name: ஆதியாகமம்
      author: ஆசிரியர் பெயர் அறியப்படவில்லை; பாரம்பரியமாக மோசே எழுதியதாகக் கருதப்படுகிறது. பிற்காலத்தில் ஒன்றாகத் தொகுக்கப்பட்ட பல மூலங்களைக் கொண்ட நீண்ட கால உருவாக்க வரலாறு இதற்கு இருப்பதாக நவீன ஆய்வாளர்கள் கருதுகின்றனர்.
      audience: உடன்படிக்கையால் தங்களுக்குரிய அடையாளத்தைப் பெற்ற இஸ்ரவேல் மக்கள்; கடவுளின் படைப்பு, தேர்ந்தெடுத்தல், வாக்குறுதி ஆகியவற்றில் அவர்களது தோற்ற வரலாற்றை வேரூன்றச் செய்வதற்காக எழுதப்பட்டது.
      date: பல நூற்றாண்டுகளாக உருவாக்கப்பட்டது; பாபிலோனியச் சிறையிருப்பின்போது அல்லது அதற்குப் பிறகு, ஏறத்தாழ கி.மு. 6–5ஆம் நூற்றாண்டுகளில், இன்று ஏற்றுக்கொள்ளப்பட்ட வடிவத்தை அடைந்தது.
      summary: படைப்பு, மனிதகுலத்தின் கலகமும் சிதறலும், ஆபிரகாம், ஈசாக்கு, யாக்கோபு, யோசேப்பு ஆகியோரின் குடும்ப வரலாறு ஆகியவற்றை ஆதியாகமம் கூறுகிறது; இவர்கள் வழியாகவே இஸ்ரவேலுக்கான கடவுளின் உடன்படிக்கை வாக்குறுதிகள் தொடங்குகின்றன.
    Exodus:
      display_name: யாத்திராகமம்
      author: ஆசிரியர் பெயர் அறியப்படவில்லை; பாரம்பரியமாக மோசே எழுதியதாகக் கருதப்படுகிறது. பிற்காலத்தில் ஒன்றாகத் தொகுக்கப்பட்ட பல மூலங்களைக் கொண்ட நீண்ட கால உருவாக்க வரலாறு இதற்கு இருப்பதாக நவீன ஆய்வாளர்கள் கருதுகின்றனர்.
      audience: விடுவிக்கப்பட்டு உடன்படிக்கைக்குள் கொண்டுவரப்பட்ட இஸ்ரவேல் மக்கள்; ஆண்டவரின் சட்டத்தின்கீழ் அவருக்குரிய தேசமாக வாழ்வதன் பொருளைக் கற்றுக்கொள்வதற்காக எழுதப்பட்டது.
      date: பல நூற்றாண்டுகளாக உருவாக்கப்பட்டது; ஏறத்தாழ கி.மு. 6–5ஆம் நூற்றாண்டுகளில் இன்று ஏற்றுக்கொள்ளப்பட்ட வடிவத்தை அடைந்தது.
    Leviticus:
      display_name: லேவியராகமம்
      author: ஆசிரியர் பெயர் அறியப்படவில்லை; பாரம்பரியமாக மோசே எழுதியதாகக் கருதப்படுகிறது. நவீன ஆய்வாளர்கள் இதைக் குருத்துவ மரபு சார்ந்த மூலத்தில் இடம்பெறுவதாகக் கருதுகின்றனர்.
      audience: இஸ்ரவேலின் ஆசாரியர்களும் வழிபடும் சமூகமும்; பலி, பரிசுத்தம், கடவுளின் பிரசன்னத்தை மையமாகக் கொண்டு வாழ்க்கையை ஒழுங்குபடுத்துதல் ஆகியவற்றுக்கான அறிவுறுத்தல்கள்.
      date: முடியாட்சியின் பிற்பகுதியிலிருந்து சிறையிருப்புக்குப் பிந்தைய காலம்வரை சேர்ந்த பல உருவாக்க அடுக்குகளைக் கொண்டது (ஏறத்தாழ கி.மு. 7–5ஆம் நூற்றாண்டுகள்).
  chapter_titles:
    Genesis:
      '1':
        title: கடவுள் வானத்தையும் பூமியையும் படைக்கிறார்
      '2':
        title: கடவுள் ஆணையும் பெண்ணையும் உருவாக்குகிறார்
      '3':
        title: மனிதகுலம் ஏதேனிலிருந்து வீழ்கிறது
      '4':
        title: காயீன் தன் சகோதரன் ஆபேலைக் கொல்கிறான்
      '5':
        title: ஆதாமிலிருந்து நோவாவரையிலான வம்சவரிசை
      '6':
        title: கடவுள் வெள்ளத்தால் பாவத்தைத் தீர்ப்பிடுகிறார்
      '7':
        title: வெள்ளநீர் பூமியை மூடுகிறது
      '8':
        title: நோவா பேழையிலிருந்து வெளியேறி கடவுளை வழிபடுகிறார்
      '9':
        title: வெள்ளத்திற்குப் பிறகு நோவாவின் குடும்பம்
      '10':
        title: நோவாவின் வழிவந்தோர் எங்கும் பரவுகின்றனர்
      '11':
        title: கோபுரத்தில் மொழிக்குழப்பம் மக்களைச் சிதறடிக்கிறது
      '12':
        title: ஆபிராம் கீழ்ப்படிந்து கானானுக்குப் புறப்படுகிறார்
      '13':
        title: செல்வந்தராகத் திரும்பும் ஆபிராம் கடவுளைத் தொழுகிறார்
      '14':
        title: படையெடுத்தவர்களிடமிருந்து லோத்தை ஆபிராம் மீட்கிறார்
      '15':
        title: ஆபிராமுக்கு வழித்தோன்றல்களைக் கடவுள் வாக்களிக்கிறார்
      '16':
        title: ஆகார் பாலைவன ஊற்றருகே தப்பிச் செல்கிறாள்
      '17':
        title: ஆபிரகாம் விருத்தசேதனம் பெற, கடவுள் உடன்படிக்கையைப் புதுப்பிக்கிறார்
      '18':
        title: ஆபிரகாமுக்கு ஒரு மகனைக் கடவுள் வாக்களிக்கிறார்
      '19':
        title: தீக்கிரையாகும் நகரங்களிலிருந்து லோத்து தப்புகிறார்
      '20':
        title: எச்சரிக்கப்பட்ட அபிமெலேக்கு சாராளைத் திருப்பி அனுப்புகிறார்
      '21':
        title: ஆபிரகாமுக்கு ஈசாக்கைச் சாராள் பெற்றெடுக்கிறாள்
      '22':
        title: மோரியாவில் ஈசாக்கைப் பலியிட ஆபிரகாம் முனைகிறார்
      '23':
        title: சாராள் இறக்க, ஆபிரகாம் அடக்க நிலம் வாங்குகிறார்
      '24':
        title: ஈசாக்குக்காக ரெபெக்காளை வேலைக்காரன் கண்டுபிடிக்கிறான்
      '25':
        title: ஆபிரகாமின் வழித்தோன்றல்களும் மரணமும் பதிவு செய்யப்படுகின்றன
      '26':
        title: கேராரில் தங்கி பாதுகாக்கப்படும் ஈசாக்கு
      '27':
        title: யாக்கோபு ஈசாக்கை ஏமாற்றி ஆசீர்வாதம் பெறுகிறான்
      '28':
        title: தேவதூதர்கள் ஏறும் படிக்கட்டை யாக்கோபு கனவில் காண்கிறான்
      '29':
        title: ராகேலை நேசிக்கும் யாக்கோபு லேயாளையும் மணக்கிறார்
      '30':
        title: இரக்கத்தால் யாக்கோபு செழிக்கிறார்
      '31':
        title: லாபானின் கோபத்துக்கு யாக்கோபு அஞ்சுகிறார்
      '32':
        title: கடவுளின் தூதருடன் யாக்கோபு போராடுகிறார்
      '33':
        title: யாக்கோபு ஏசாவைச் சமாதானமாகச் சந்திக்கிறார்
      '34':
        title: சீகேம் தீனாளைக் கொடூரமாக அவமதிக்கிறான்
      '35':
        title: யாக்கோபு பெத்தேலின் பலிபீடத்திற்குத் திரும்புகிறார்
      '36':
        title: சேயீர் நாட்டில் ஏசாவின் வழித்தோன்றல்கள்
      '37':
        title: யோசேப்பை அவன் சகோதரர்கள் குறைந்த விலைக்கு விற்கிறார்கள்
      '38':
        title: தாமார் யூதாவின் மகன்களை மறைவாகப் பெற்றெடுக்கிறாள்
      '39':
        title: போத்திபாரின் வீட்டில் யோசேப்பு செழிக்கிறார்
      '40':
        title: பார்வோனின் அதிகாரிகள் கனவு கண்டு அஞ்சுகின்றனர்
      '41':
        title: பார்வோனின் கனவுகளுக்கு யோசேப்பு விளக்கம் அளிக்கிறார்
      '42':
        title: தானியம் வாங்க யாக்கோபு தன் மகன்களை அனுப்புகிறார்
      '43':
        title: சகோதரர்களுடன் பென்யமீன் எகிப்துக்குச் செல்கிறான்
      '44':
        title: பென்யமீனின் உயிரைக் காக்க யூதா மன்றாடுகிறார்
      '45':
        title: யோசேப்பு தன் சகோதரர்களுடன் மீண்டும் இணைகிறார்
      '46':
        title: இஸ்ரவேல் பாதுகாப்பாகக் கோசேனுக்குப் பயணம் செய்கிறார்
      '47':
        title: யோசேப்பு தன் குடும்பத்திற்கு உணவளிக்கிறார்
      '48':
        title: யாக்கோபு ஞானமாக யோசேப்பின் மகன்களை ஆசீர்வதிக்கிறார்
      '49':
        title: தன் மகன்களின் எதிர்காலத்தைக் குறித்து யாக்கோபு உரைக்கிறார்
      '50':
        title: யாக்கோபின் இறுதி விருப்பத்தை யோசேப்பு நிறைவேற்றுகிறார்
    Exodus:
      '1':
        title: இஸ்ரவேலின் பெருக்கத்திற்குக் கடவுள் அருள்புரிகிறார்
      '2':
        title: பார்வோனின் சூழலிலிருந்து மோசே காப்பாற்றப்படுகிறார்
      '3':
        title: கடவுளின் அழைப்பை மோசே கேட்கிறார்
      '4':
        title: கடவுளின் வல்லமையை மோசே எதிர்கொள்கிறார்
      '5':
        title: பார்வோன் தன் இதயத்தைக் கடினப்படுத்துகிறான்
      '6':
        title: விடுவிப்பதாக ஆண்டவர் வாக்களிக்கிறார்
      '7':
        title: ஆரோனும் மோசேயும் பார்வோனை எதிர்கொள்கிறார்கள்
      '8':
        title: கொள்ளைநோய்கள் எகிப்தைக் கடுமையாகத் தாக்குகின்றன
      '9':
        title: கடவுள் எகிப்தை ஆலங்கட்டியால் தாக்குகிறார்
      '10':
        title: பார்வோன் மீண்டும் மறுக்கிறான்
      '11':
        title: இறுதிக் கொள்ளைநோய் நெருங்குகிறது
      '12':
        title: இஸ்ரவேல் மரணத்தைக் கடந்து செல்கிறது
      '13':
        title: இஸ்ரவேலின் பாதையை ஆண்டவர் வழிநடத்துகிறார்
      '14':
        title: கடவுள் செங்கடலைப் பிளக்கிறார்
      '15':
        title: மோசேயும் இஸ்ரவேலும் புகழ்ந்து பாடுகின்றனர்
      '16':
        title: ஆண்டவர் தினமும் மன்னாவை வழங்குகிறார்
      '17':
        title: அமலேக்கியர் இஸ்ரவேலின் முகாமைத் தாக்குகின்றனர்
      '18':
        title: எத்திரோ மோசேக்கு ஞானமான ஆலோசனை வழங்குகிறார்
      '19':
        title: சீனாயில் இஸ்ரவேல் தன்னைப் பரிசுத்தப்படுத்துகிறது
      '20':
        title: கடவுள் பத்துக் கட்டளைகளை அளிக்கிறார்
      '21':
        title: இஸ்ரவேலின் சுதந்திரத்திற்கான வழக்குச் சட்டங்கள்
      '22':
        title: இழப்பீடும் நீதியும் நிலைநாட்டப்படுகின்றன
      '23':
