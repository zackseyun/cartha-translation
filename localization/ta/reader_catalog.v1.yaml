    introQuote: கீழேயுள்ள நூல்கள், செயற்கை நுண்ணறிவுப் பார்வை மாதிரிகளால் ஸ்கேன் செய்யப்பட்ட மூல எபிரெய, கிரேக்க, இலத்தீன் மற்றும் கீயெஸ் கையெழுத்துப் பிரதிகளிலிருந்து உருவாக்கப்பட்டன. முன்னணி செயற்கை நுண்ணறிவின் பல சுற்றுச் செயலாக்கங்கள், உரையை இயன்றவரை மூலங்களுக்குச் சமீபமாக அளிக்கின்றன. அனைத்து பணிகளும், தரவுகளும், மொழிபெயர்ப்புத் தீர்மானங்களும் வெளிப்படையானவை; அவை இயன்ற மிக உயர்ந்த அளவில் இலவசமாகவும் திறந்த வகையிலும் வெளியிடப்படுகின்றன.
