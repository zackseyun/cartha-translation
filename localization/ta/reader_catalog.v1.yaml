books:
  Genesis:
    display_name: ஆதியாகமம்
    author: ஆசிரியர் பெயர் அறியப்படவில்லை; பாரம்பரியமாக மோசே எழுதியதாகக் கருதப்படுகிறது. பிற்காலத்தில் ஒன்றாகத் தொகுக்கப்பட்ட பல மூலங்களைக் கொண்ட நீண்ட கால உருவாக்க வரலாறு இதற்கு இருப்பதாக நவீன ஆய்வாளர்கள் கருதுகின்றனர்.
    audience: உடன்படிக்கையால் தங்களுக்குரிய அடையாளத்தைப் பெற்ற இஸ்ரவேல் மக்கள்; கடவுளின் படைப்பு, தேர்ந்தெடுத்தல், வாக்குறுதி ஆகியவற்றில் அவர்களது தோற்ற வரலாற்றை வேரூன்றச் செய்வதற்காக எழுதப்பட்டது.
    date: பல நூற்றாண்டுகளாக உருவாக்கப்பட்டது; பாபிலோனியச் சிறையிருப்பின்போது அல்லது அதற்குப் பிறகு, ஏறத்தாழ கி.மு. 6–5ஆம் நூற்றாண்டுகளில், இன்று ஏற்றுக்கொள்ளப்பட்ட வடிவத்தை அடைந்தது.
    summary: படைப்பு, மனிதகுலத்தின் கலகமும் சிதறலும், ஆபிரகாம், ஈசாக்கு, யாக்கோபு, யோசேப்பு ஆகியோரின் குடும்ப வரலாறு ஆகியவற்றை ஆதியாகமம் கூறுகிறது; இவர்கள் வழியாகவே இஸ்ரவேலுக்கான கடவுளின் உடன்படிக்கை வாக்குறுதிகள் தொடங்குகின்றன.
    chapters:
      '1':
        title: கடவுள் வானத்தையும் பூமியையும் படைக்கிறார்
      '2':
        title: கடவுள் ஆணையும் பெண்ணையும் உருவாக்குகிறார்
      '3':
        title: மனிதகுலம் ஏதேனிலிருந்து வீழ்கிறது
      '4':
        title: காயீன் தன் சகோதரன் ஆபேலைக் கொல்கிறான்
      '5':
        title: ஆதாமிலிருந்து நோவாவரையிலான வம்சவரிசை
      '6':
        title: கடவுள் வெள்ளத்தால் பாவத்தைத் தீர்ப்பிடுகிறார்
      '7':
        title: வெள்ளநீர் பூமியை மூடுகிறது
      '8':
        title: நோவா பேழையிலிருந்து வெளியேறி கடவுளை வழிபடுகிறார்
      '9':
        title: வெள்ளத்திற்குப் பிறகு நோவாவின் குடும்பம்
      '10':
        title: நோவாவின் வழிவந்தோர் எங்கும் பரவுகின்றனர்
      '11':
        title: கோபுரத்தில் மொழிக்குழப்பம் மக்களைச் சிதறடிக்கிறது
      '12':
        title: ஆபிராம் கீழ்ப்படிந்து கானானுக்குப் புறப்படுகிறார்
      '13':
        title: செல்வந்தராகத் திரும்பும் ஆபிராம் கடவுளைத் தொழுகிறார்
      '14':
        title: படையெடுத்தவர்களிடமிருந்து லோத்தை ஆபிராம் மீட்கிறார்
      '15':
        title: ஆபிராமுக்கு வழித்தோன்றல்களைக் கடவுள் வாக்களிக்கிறார்
      '16':
        title: ஆகார் பாலைவன ஊற்றருகே தப்பிச் செல்கிறாள்
      '17':
        title: ஆபிரகாம் விருத்தசேதனம் பெற, கடவுள் உடன்படிக்கையைப் புதுப்பிக்கிறார்
      '18':
        title: ஆபிரகாமுக்கு ஒரு மகனைக் கடவுள் வாக்களிக்கிறார்
      '19':
        title: தீக்கிரையாகும் நகரங்களிலிருந்து லோத்து தப்புகிறார்
      '20':
        title: எச்சரிக்கப்பட்ட அபிமெலேக்கு சாராளைத் திருப்பி அனுப்புகிறார்
      '21':
        title: ஆபிரகாமுக்கு ஈசாக்கைச் சாராள் பெற்றெடுக்கிறாள்
      '22':
        title: மோரியாவில் ஈசாக்கைப் பலியிட ஆபிரகாம் முனைகிறார்
      '23':
        title: சாராள் இறக்க, ஆபிரகாம் அடக்க நிலம் வாங்குகிறார்
      '24':
        title: ஈசாக்குக்காக ரெபெக்காளை வேலைக்காரன் கண்டுபிடிக்கிறான்
      '25':
        title: ஆபிரகாமின் வழித்தோன்றல்களும் மரணமும் பதிவு செய்யப்படுகின்றன
      '26':
        title: கேராரில் தங்கி பாதுகாக்கப்படும் ஈசாக்கு
      '27':
        title: யாக்கோபு ஈசாக்கை ஏமாற்றி ஆசீர்வாதம் பெறுகிறான்
      '28':
        title: தேவதூதர்கள் ஏறும் படிக்கட்டை யாக்கோபு கனவில் காண்கிறான்
      '29':
        title: ராகேலை நேசிக்கும் யாக்கோபு லேயாளையும் மணக்கிறார்
      '30':
        title: இரக்கத்தால் யாக்கோபு செழிக்கிறார்
      '31':
        title: லாபானின் கோபத்துக்கு யாக்கோபு அஞ்சுகிறார்
      '32':
        title: கடவுளின் தூதருடன் யாக்கோபு போராடுகிறார்
      '33':
        title: யாக்கோபு ஏசாவைச் சமாதானமாகச் சந்திக்கிறார்
      '34':
        title: சீகேம் தீனாளைக் கொடூரமாக அவமதிக்கிறான்
      '35':
        title: யாக்கோபு பெத்தேலின் பலிபீடத்திற்குத் திரும்புகிறார்
      '36':
        title: சேயீர் நாட்டில் ஏசாவின் வழித்தோன்றல்கள்
      '37':
        title: யோசேப்பை அவன் சகோதரர்கள் குறைந்த விலைக்கு விற்கிறார்கள்
      '38':
        title: தாமார் யூதாவின் மகன்களை மறைவாகப் பெற்றெடுக்கிறாள்
      '39':
        title: போத்திபாரின் வீட்டில் யோசேப்பு செழிக்கிறார்
      '40':
        title: பார்வோனின் அதிகாரிகள் கனவு கண்டு அஞ்சுகின்றனர்
      '41':
        title: பார்வோனின் கனவுகளுக்கு யோசேப்பு விளக்கம் அளிக்கிறார்
      '42':
        title: தானியம் வாங்க யாக்கோபு தன் மகன்களை அனுப்புகிறார்
      '43':
        title: சகோதரர்களுடன் பென்யமீன் எகிப்துக்குச் செல்கிறான்
      '44':
        title: பென்யமீனின் உயிரைக் காக்க யூதா மன்றாடுகிறார்
      '45':
        title: யோசேப்பு தன் சகோதரர்களுடன் மீண்டும் இணைகிறார்
      '46':
        title: இஸ்ரவேல் பாதுகாப்பாகக் கோசேனுக்குப் பயணம் செய்கிறார்
      '47':
        title: யோசேப்பு தன் குடும்பத்திற்கு உணவளிக்கிறார்
      '48':
        title: யாக்கோபு ஞானமாக யோசேப்பின் மகன்களை ஆசீர்வதிக்கிறார்
      '49':
        title: தன் மகன்களின் எதிர்காலத்தைக் குறித்து யாக்கோபு உரைக்கிறார்
      '50':
        title: யாக்கோபின் இறுதி விருப்பத்தை யோசேப்பு நிறைவேற்றுகிறார்
  Exodus:
    display_name: யாத்திராகமம்
    author: ஆசிரியர் பெயர் அறியப்படவில்லை; பாரம்பரியமாக மோசே எழுதியதாகக் கருதப்படுகிறது. பிற்காலத்தில் ஒன்றாகத் தொகுக்கப்பட்ட பல மூலங்களைக் கொண்ட நீண்ட கால உருவாக்க வரலாறு இதற்கு இருப்பதாக நவீன ஆய்வாளர்கள் கருதுகின்றனர்.
    audience: விடுவிக்கப்பட்டு உடன்படிக்கைக்குள் கொண்டுவரப்பட்ட இஸ்ரவேல் மக்கள்; ஆண்டவரின் சட்டத்தின்கீழ் அவருக்குரிய தேசமாக வாழ்வதன் பொருளைக் கற்றுக்கொள்வதற்காக எழுதப்பட்டது.
    date: பல நூற்றாண்டுகளாக உருவாக்கப்பட்டது; ஏறத்தாழ கி.மு. 6–5ஆம் நூற்றாண்டுகளில் இன்று ஏற்றுக்கொள்ளப்பட்ட வடிவத்தை அடைந்தது.
    chapters:
      '1':
        title: இஸ்ரவேலின் பெருக்கத்திற்குக் கடவுள் அருள்புரிகிறார்
      '2':
        title: பார்வோனின் சூழலிலிருந்து மோசே காப்பாற்றப்படுகிறார்
      '3':
        title: கடவுளின் அழைப்பை மோசே கேட்கிறார்
      '4':
        title: கடவுளின் வல்லமையை மோசே எதிர்கொள்கிறார்
      '5':
        title: பார்வோன் தன் இதயத்தைக் கடினப்படுத்துகிறான்
      '6':
        title: விடுவிப்பதாக ஆண்டவர் வாக்களிக்கிறார்
      '7':
        title: ஆரோனும் மோசேயும் பார்வோனை எதிர்கொள்கிறார்கள்
      '8':
        title: கொள்ளைநோய்கள் எகிப்தைக் கடுமையாகத் தாக்குகின்றன
      '9':
        title: கடவுள் எகிப்தை ஆலங்கட்டியால் தாக்குகிறார்
      '10':
        title: பார்வோன் மீண்டும் மறுக்கிறான்
      '11':
        title: இறுதிக் கொள்ளைநோய் நெருங்குகிறது
      '12':
        title: இஸ்ரவேல் மரணத்தைக் கடந்து செல்கிறது
      '13':
        title: இஸ்ரவேலின் பாதையை ஆண்டவர் வழிநடத்துகிறார்
      '14':
        title: கடவுள் செங்கடலைப் பிளக்கிறார்
      '15':
        title: மோசேயும் இஸ்ரவேலும் புகழ்ந்து பாடுகின்றனர்
      '16':
        title: ஆண்டவர் தினமும் மன்னாவை வழங்குகிறார்
      '17':
        title: அமலேக்கியர் இஸ்ரவேலின் முகாமைத் தாக்குகின்றனர்
      '18':
        title: எத்திரோ மோசேக்கு ஞானமான ஆலோசனை வழங்குகிறார்
      '19':
        title: சீனாயில் இஸ்ரவேல் தன்னைப் பரிசுத்தப்படுத்துகிறது
      '20':
        title: கடவுள் பத்துக் கட்டளைகளை அளிக்கிறார்
      '21':
        title: இஸ்ரவேலின் சுதந்திரத்திற்கான வழக்குச் சட்டங்கள்
      '22':
        title: இழப்பீடும் நீதியும் நிலைநாட்டப்படுகின்றன
      '23':
        title: உண்மையும் நேர்மையும் இரக்கமும் கட்டாயம்
      '24':
        title: பலியால் உடன்படிக்கை உறுதிசெய்யப்படுகிறது
      '25':
        title: பரிசுத்த உறைவிடத்திற்கான அறிவுறுத்தல்கள்
      '26':
        title: திருக்கூடாரத்தின் வடிவமைப்பு வெளிப்படுத்தப்படுகிறது
      '27':
        title: வெண்கலப் பலிபீடமும் முற்றமும்
      '28':
        title: ஆரோன் ஆசாரியராகப் பிரித்தெடுக்கப்படுகிறார்
      '29':
        title: பணிக்காக ஆசாரியர்கள் அர்ப்பணிக்கப்படுகின்றனர்
      '30':
        title: பரிசுத்த அபிஷேக எண்ணெயும் தூபமும்
      '31':
        title: திருக்கூடாரப் பணிக்குக் கைவினைஞர்களைக் கடவுள் தேர்ந்தெடுக்கிறார்
      '32':
        title: கோபத்தில் மோசே கற்பலகைகளை உடைக்கிறார்
      '33':
        title: கடவுளின் மகிமையைக் காண மோசே நாடுகிறார்
      '34':
        title: மோசே புதிய கற்பலகைகளைப் பெறுகிறார்
      '35':
        title: மோசே இஸ்ரவேலைக் கூட்டி கட்டளையை அறிவிக்கிறார்
      '36':
        title: கட்டளையிட்டபடி கைவினைஞர்கள் பரிசுத்த இடத்தைக் கட்டுகின்றனர்
      '37':
        title: பெசலெயேல் பரிசுத்தப் பொருட்களைத் துல்லியமாகச் செய்கிறார்
      '38':
        title: வெண்கலப் பலிபீடமும் கழுவும் தொட்டியும் செய்யப்படுகின்றன
      '39':
        title: பரிசுத்தப் பணிக்கான ஆரோனின் ஆடைகள்
      '40':
        title: மோசே திருக்கூடாரத்தை அமைக்கிறார்
  Leviticus:
    display_name: லேவியராகமம்
    author: ஆசிரியர் பெயர் அறியப்படவில்லை; பாரம்பரியமாக மோசே எழுதியதாகக் கருதப்படுகிறது. நவீன ஆய்வாளர்கள் இதைக் குருத்துவ மரபு சார்ந்த மூலத்தில் இடம்பெறுவதாகக் கருதுகின்றனர்.
    audience: இஸ்ரவேலின் ஆசாரியர்களும் வழிபடும் சமூகமும்; பலி, பரிசுத்தம், கடவுளின் பிரசன்னத்தை மையமாகக் கொண்டு வாழ்க்கையை ஒழுங்குபடுத்துதல் ஆகியவற்றுக்கான அறிவுறுத்தல்கள்.
    date: முடியாட்சியின் பிற்பகுதியிலிருந்து சிறையிருப்புக்குப் பிந்தைய காலம்வரை சேர்ந்த பல உருவாக்க அடுக்குகளைக் கொண்டது (ஏறத்தாழ கி.மு. 7–5ஆம் நூற்றாண்டுகள்).
    chapters:
      '1':
        title: ஆண்டவருக்கு உகந்த தகனபலிகள்
      '2':
        title: அவர் முன்னிலையில் எரிக்கப்படும் தானியப் பலிகள்
      '3':
        title: பலிபீடத்தில் வைக்கப்படும் சமாதானப் பலி
      '4':
        title: ஆசாரியர்களின் மற்றும் மக்களின் பாவங்கள்
      '5':
        title: பாவங்களை அறிக்கையிட்டு பலி செலுத்துதல்
      '6':
        title: ஆசாரியர்கள் பலிகளைக் கவனமாகக் கையாளுதல்
      '7':
        title: குற்றநிவாரணப் பலியும் சமாதானப் பலியும் விளக்கப்படுகின்றன
      '8':
        title: ஆரோன் ஆசாரியராக அர்ப்பணிக்கப்படுகிறார்
      '9':
        title: அக்கினி பலியை எரித்து ஏற்றுக்கொள்ளுதலைக் காட்டுகிறது
      '10':
        title: நாதாபும் அபியூவும் தண்டிக்கப்படுகின்றனர்
      '11':
        title: சுத்தமான, அசுத்தமான உணவுகள் பற்றிய சட்டங்கள்
      '12':
        title: பிரசவத்திற்குப் பின் பெண் தூய்மைப்படுத்தப்படுகிறாள்
      '13':
        title: ஆசாரியர்கள் தோல் நோய்களைப் பரிசோதிக்கின்றனர்
      '14':
        title: பலிகளின் மூலம் மீண்டும் சுத்தமாக்கப்படுதல்
      '15':
        title: உடல் சுரப்புகளால் ஏற்படும் அசுத்தம்
      '16':
        title: எல்லாப் பாவங்களுக்கும் பாவநிவிர்த்தி செய்யப்படுகிறது
      '17':
        title: பலிகள் சந்திப்புக் கூடாரத்தின் வாசலுக்குக் கொண்டுவரப்பட வேண்டும்
      '18':
        title: ஆண்டவர் ஒழுக்கத் தூய்மையைக் கட்டளையிடுகிறார்
      '19':
        title: இஸ்ரவேலர் பரிசுத்த வாழ்வுக்கு அழைக்கப்படுகின்றனர்
      '20':
        title: கடுமையான பாவங்களுக்குக் கடுமையான தண்டனைகள்
      '21':
        title: ஆசாரியர்கள் சிறப்பான பரிசுத்தத்தைக் காக்க வேண்டும்
      '22':
        title: பரிசுத்த காணிக்கைகளைக் கவனமாகக் கையாள வேண்டும்
      '23':
        title: வழிபாட்டுக்கான குறிக்கப்பட்ட காலங்கள் கற்பிக்கப்படுகின்றன
      '24':
        title: விளக்குகள் எரிகின்றன; அப்பம் படைக்கப்படுகிறது
      '25':
        title: ஏழாம் ஆண்டுதோறும் நிலம் ஓய்வுபெறுகிறது
      '26':
        title: இஸ்ரவேலர் உடன்படிக்கையின் வழியைத் தேர்ந்தெடுக்கின்றனர்
      '27':
        title: நேர்த்திக்கடன்களையும் அர்ப்பணிப்புகளையும் உண்மையுடன் நிறைவேற்ற வேண்டும்
  Numbers:
    display_name: எண்ணாகமம்
    author: ஆசிரியர் பெயர் அறியப்படவில்லை; மரபுப்படி மோசே எழுதியதாகக் கருதப்படுகிறது.
    audience: எகிப்துக்கும் வாக்குத்தத்த நாட்டுக்கும் இடையே பயணம் செய்த இஸ்ரவேலர்—அதாவது வனாந்தரத் தலைமுறையினர்—மற்றும் அவர்களுடைய தோல்விகளிலிருந்து கற்றுக்கொண்ட பிற்கால வாசகர்கள்.
    date: அரசாட்சிக் காலத்தின் பிற்பகுதியிலிருந்து நாடுகடத்தலுக்குப் பிந்தைய காலம்வரை உருவான பல அடுக்குகள் (கி.மு. சுமார் 7–5ஆம் நூற்றாண்டுகள்).
    chapters:
      '1':
        title: மோசே இஸ்ரவேல் ஆண்களை எண்ணுகிறார்
      '2':
        title: கோத்திரங்கள் திருவாசஸ்தலத்தைச் சுற்றி முகாமிடுகின்றன
      '3':
        title: லேவியர்கள் தேவனுடைய பரிசுத்த வாசஸ்தலத்தில் பணிபுரிகின்றனர்
      '4':
        title: கோகாத்தியர் பரிசுத்த பொருட்களைப் பராமரிக்கின்றனர்
      '5':
        title: மறைவான பாவத்தை தேவன் நியாயந்தீர்க்கிறார்
      '6':
        title: நசரேய விரதமும் ஆசீர்வாதமும்
      '7':
        title: தலைவர்கள் பரிசுத்த இடத்திற்குக் காணிக்கைகள் செலுத்துகின்றனர்
      '8':
        title: தேவனுக்குப் பணிபுரிய லேவியர்கள் தூய்மைப்படுத்தப்படுகின்றனர்
      '9':
        title: பஸ்காவைக் கடைப்பிடிக்க ஆண்டவர் கட்டளையிடுகிறார்
      '10':
        title: வெள்ளி எக்காளங்கள் தேவனுடைய கட்டளைகளுக்கு அறிகுறி கொடுக்கின்றன
      '11':
        title: பேராசை கொள்ளைநோயை வரவழைக்கிறது
      '12':
        title: மிரியாம் மோசேயின் அதிகாரத்திற்கு எதிராகப் பேசுகிறாள்
      '13':
        title: பன்னிரண்டு பேர் வாக்குத்தத்த நாட்டை ஆராய்கின்றனர்
      '14':
        title: சந்தேகப்பட்டதற்காக இஸ்ரவேலர் தண்டிக்கப்படுகின்றனர்
      '15':
        title: காணிக்கைகளையும் ஆடைத் தொங்கல்களையும் பற்றிய அறிவுறுத்தல்கள்
      '16':
        title: கோராகு கலகம் செய்கிறான்; பூமி விழுங்குகிறது
      '17':
        title: ஆரோனின் கோல் ஆசாரிய வம்சத்தை உறுதிப்படுத்துகிறது
      '18':
        title: லேவியர்கள் ஆசாரியர்களின் மேற்பார்வையில் பணிபுரிகின்றனர்
      '19':
        title: சிவப்புப் பசுவைப் பற்றிய தூய்மைப்படுத்தும் சட்டம்
      '20':
        title: காதேசில் மோசே தடுமாறுகிறார்
      '21':
        title: இஸ்ரவேலர் கானானிய அரசனைத் தோற்கடிக்கின்றனர்
      '22':
        title: இஸ்ரவேலைச் சபிக்க பிலேயாம் மறுக்கிறான்
      '23':
        title: பிலேயாம் இஸ்ரவேலை மீண்டும் மீண்டும் ஆசீர்வதிக்கிறான்
      '24':
        title: இஸ்ரவேலின் எதிர்கால மகிமையை பிலேயாம் அறிவிக்கிறான்
      '25':
        title: பினெகாஸ் சிம்ரியைக் கொல்கிறான்
      '26':
        title: புதிய போர்வீரர்களை மோசே எண்ணுகிறார்
      '27':
        title: தந்தையின் சொத்துரிமையை மகள்கள் கோருகின்றனர்
      '28':
        title: இஸ்ரவேலர் வழக்கமான பலிகளைச் செலுத்துகின்றனர்
      '29':
        title: மாதத்தில் இஸ்ரவேலர் பலிகளைச் செலுத்துகின்றனர்
      '30':
        title: நேர்த்திக்கடன்களைப் பற்றி மோசே பேசுகிறார்
      '31':
        title: மீதியானுக்கு எதிராகப் பழிவாங்க மோசே கட்டளையிடுகிறார்
      '32':
        title: ரூபனும் காத்தும் கிழக்குப் பகுதி நிலத்தைக் கோருகின்றனர்
      '33':
        title: எகிப்திலிருந்து இஸ்ரவேலர் மேற்கொண்ட பயணம் பட்டியலிடப்படுகிறது
      '34':
        title: கானானின் எல்லைகளை ஆண்டவர் வரையறுக்கிறார்
      '35':
        title: புகலிடப் பட்டணங்கள் பாதுகாப்பு அளிக்கின்றன
      '36':
        title: செலொப்பெகாத்தின் மகள்கள் தங்கள் குலத்திற்குள் மணமுடிக்கின்றனர்
  Deuteronomy:
    display_name: உபாகமம்
    author: ஆசிரியர் பெயர் அறியப்படவில்லை; மோசேயின் பிரியாவிடை உரைகளாக வழங்கப்படுகிறது. நவீன ஆய்வாளர்கள் இதன் மையப்பகுதியை யோசியாவின் ஆட்சியில் கி.மு. 7ஆம் நூற்றாண்டின் பிற்பகுதியில் நடந்த சீர்திருத்தத்துடன் தொடர்புபடுத்துகின்றனர்.
    audience: நாட்டிற்குள் நுழைய ஆயத்தமான இஸ்ரவேலர்—மேலும், ஆலயமோ அரசனோ இல்லாமல் எவ்வாறு உண்மையுடன் வாழ்வது என்று கேட்ட நாடுகடத்தப்பட்ட பிற்கால மக்களும்.
    date: மையப்பகுதி கி.மு. 7ஆம் நூற்றாண்டின் பிற்பகுதியைச் சேர்ந்ததாக இருக்கலாம்; நாடுகடத்தல் காலத்தில் இறுதி வடிவம் பெற்றது.
    chapters:
      '1':
        title: தேவனுடைய உண்மைத்தன்மையை மோசே எடுத்துரைக்கிறார்
      '2':
        title: இஸ்ரவேலர் ஏதோமையும் மோவாபையும் தவிர்த்துச் செல்கின்றனர்
      '3':
        title: இஸ்ரவேலர் ஓகு அரசனைத் தோற்கடிக்கின்றனர்
      '4':
        title: ஞானத்துடன் கீழ்ப்படியுமாறு மோசே வலியுறுத்துகிறார்
      '5':
        title: பத்துக் கட்டளைகளை மோசே மீண்டும் கூறுகிறார்
      '6':
        title: தேவனை நேசிக்குமாறு இஸ்ரவேலருக்கு மோசே கட்டளையிடுகிறார்
      '7':
        title: இஸ்ரவேலர் சிலைகளை அழிக்க வேண்டும்
      '8':
        title: துன்பத்தில் தேவன் பராமரித்ததை நினைவுகூருங்கள்
      '9':
        title: இஸ்ரவேலருக்காக மோசே மன்றாடுகிறார்
      '10':
        title: தேவனுடைய எதிர்பார்ப்புகளை மோசே எடுத்துரைக்கிறார்
      '11':
        title: அன்புகூருமாறு இஸ்ரவேலருக்கு மோசே கட்டளையிடுகிறார்
      '12':
        title: தேர்ந்தெடுக்கப்பட்ட இடத்தில் மட்டுமே வழிபட வேண்டும்
      '13':
        title: பொய்த் தீர்க்கதரிசிகளையும் சிலைகளையும் நிராகரிக்க வேண்டும்
      '14':
        title: தேவனுடைய மக்களாக வேறுபட்டு வாழுங்கள்
      '15':
        title: ஏழாம் ஆண்டுதோறும் கடன்களைத் தள்ளுபடி செய்ய வேண்டும்
      '16':
        title: தாராள மனத்துடன் பண்டிகைகளைக் கொண்டாடுங்கள்
      '17':
        title: சிலைவழிபாட்டை நியாயந்தீர்த்து சட்டத்தைப் பின்பற்ற வேண்டும்
      '18':
        title: ஆசாரியர்களையும் லேவியர்களையும் உண்மையுடன் ஆதரிக்க வேண்டும்
      '19':
        title: தற்செயலாகக் கொன்றவர்களுக்கு பட்டணங்கள் புகலிடம் அளிக்கின்றன
      '20':
        title: போரில் ஆண்டவரை நம்புங்கள்
      '21':
        title: கொலை செய்யப்பட்டவர்களின் வழக்குகளில் நீதியுடன் நடக்க வேண்டும்
      '22':
        title: பரிசுத்தத்தையும் கண்ணியத்தையும் பாதுகாக்க வேண்டும்
      '23':
        title: உபாகமத்தில் பரிசுத்த வாழ்வுக்கான கட்டளைகள்
      '24':
        title: நீதியையும் மனித கண்ணியத்தையும் பாதுகாக்க வேண்டும்
      '25':
        title: குற்றவாளியை அவமானப்படுத்தாமல் தண்டிக்க வேண்டும்
      '26':
        title: முதற்பலன்களைக் கொண்டுவந்து ஆண்டவருக்கு அறிக்கையிட வேண்டும்
      '27':
        title: கல் பலிபீடம் அமைக்க மோசே கட்டளையிடுகிறார்
      '28':
        title: கீழ்ப்படிதல் ஆசீர்வாதத்தைக் கொண்டுவருகிறது
      '29':
        title: வருங்காலத் தலைமுறைகளுடன் உடன்படிக்கைக்குள் நுழைதல்
      '30':
        title: வாழ்வைத் தேர்ந்தெடுக்குமாறு இஸ்ரவேலரை மோசே வலியுறுத்துகிறார்
      '31':
        title: மோசே எழுதி யோசுவாவை விட்டுச் செல்கிறார்
      '32':
        title: இஸ்ரவேலருக்கு எதிரான சாட்சியாக மோசே பாடுகிறார்
      '33':
        title: ஒவ்வொரு கோத்திரத்தையும் மோசே ஆசீர்வதிக்கிறார்
      '34':
        title: மோசே நாட்டைப் பார்த்துவிட்டு மரிக்கிறார்
  Joshua:
    display_name: யோசுவா
    author: ஆசிரியர் பெயர் அறியப்படவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
    audience: அரசாட்சிக் காலத்திலும் நாடுகடத்தலிலும் இருந்த இஸ்ரவேலர்; வெற்றி கொள்ளுதல், உடன்படிக்கை, நாட்டின் பொருள் ஆகியவற்றைப் பற்றிச் சிந்தித்தவர்கள்.
    date: பழைய மரபுகளிலிருந்து கி.மு. சுமார் 7–6ஆம் நூற்றாண்டுகளில் தொகுக்கப்பட்டது.
    chapters:
      '1':
        title: தலைமை தாங்குமாறு யோசுவாவுக்கு தேவன் கட்டளையிடுகிறார்
      '2':
        title: இஸ்ரவேலின் வேவுகாரர்களை ராகாப் மறைத்துவைக்கிறாள்
      '3':
        title: இஸ்ரவேலர் யோர்தானை உலர்ந்த தரையில் கடக்கின்றனர்
      '4':
        title: பன்னிரண்டு கற்கள் கடந்து வந்ததை நினைவுகூர்கின்றன
      '5':
        title: ஆண்டவருடைய படையை யோசுவா சந்திக்கிறார்
      '6':
        title: உண்மையுடன் அணிவகுத்ததால் எரிகோ வீழ்கிறது
      '7':
        title: ஆகானின் பாவம் இஸ்ரவேலுக்குத் தோல்வியைக் கொண்டுவருகிறது
      '8':
        title: ஆய் நகரம் கைப்பற்றப்பட்டு, திருச்சட்டம் புதுப்பிக்கப்படுகிறது
      '9':
        title: கிபியோனியர் சமாதானத்திற்காக ஏமாற்றுகின்றனர்
      '10':
        title: போரில் சூரியன் அசையாமல் நிற்கிறது
      '11':
        title: இஸ்ரவேல் வடக்கே முன்னேறி வெற்றி பெறுகிறது
      '12':
        title: முப்பத்தொரு அரசர்கள் தோற்கடிக்கப்படுகின்றனர்
      '13':
        title: கைப்பற்ற இன்னும் பெருமளவு நிலம் உள்ளது
      '14':
        title: காலேப் தனது மலைநாட்டைக் கோருகிறார்
      '15':
        title: யூதாவின் நகரங்களும் நீரூற்றுகளும் உறுதிசெய்யப்படுகின்றன
      '16':
        title: யோர்தானுக்கு மேற்கே எபிராயீமின் நிலம்
      '17':
        title: மனாசேயின் உரிமைநிலமும் கடமையும்
      '18':
        title: பென்யமீனின் எல்லைகளும் நகரங்களும்
      '19':
        title: லேவியர் தங்கள் நகரங்களைப் பெறுகின்றனர்
      '20':
        title: அறியாமல் கொன்றவர்களுக்கான அடைக்கல நகரங்கள்
      '21':
        title: லேவியர் குருத்துவப் பணிக்காகப் பிரித்துவைக்கப்படுகின்றனர்
      '22':
        title: கிழக்குக் கோத்திரத்தார் சாட்சி பீடத்தைக் கட்டுகின்றனர்
      '23':
        title: உண்மையுடன் கீழ்ப்படியுமாறு யோசுவா வலியுறுத்துகிறார்
      '24':
        title: தேர்ந்தெடுக்குமாறு இஸ்ரவேலரை யோசுவா அழைக்கிறார்
  Judges:
    display_name: நியாயாதிபதிகள்
    author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
    audience: தங்கள் முடியாட்சிக்கு முந்தைய கடந்தகாலத்தை, இறைவனை விட்டு விலகுவதும் விடுதலை பெறுவதும் மாறிமாறி நிகழ்ந்த ஓர் எச்சரிக்கைச் சுழற்சியாக வாசித்த பிற்கால இஸ்ரவேலர்.
    date: ஏறத்தாழ கி.மு. 7–6ஆம் நூற்றாண்டுகளில் தொகுக்கப்பட்டது.
    chapters:
      '1':
        title: கானானியருக்கு எதிராக யூதா தலைமையேற்கிறது
      '2':
        title: உடன்படிக்கையை மீறிய இஸ்ரவேலரைத் தூதர் கண்டிக்கிறார்
      '3':
        title: ஒத்னியேல் ஆராமைத் தோற்கடிக்கிறார்
      '4':
        title: தெபோரா நீதி வழங்கி சிசெராவைத் தோற்கடிக்கிறார்
      '5':
        title: வெற்றிக்காகக் கடவுளைத் தெபோரா புகழ்கிறார்
      '6':
        title: கிதியோன் விசுவாசத்திற்கும் ஐயத்திற்கும் இடையே போராடுகிறார்
      '7':
        title: கிதியோன் மீதியானைத் தோற்கடிக்கிறார்
      '8':
        title: உதவ மறுத்த நகரங்களைக் கிதியோன் தண்டிக்கிறார்
      '9':
        title: யோதாம் சீகேமை எச்சரிக்கிறார்
      '10':
        title: சிலைவழிபாட்டுக்குப் பின் அம்மோனியர் இஸ்ரவேலை ஒடுக்குகின்றனர்
      '11':
        title: இப்தா தன் மகளைப் பலியிடுவதாக நேர்ந்துகொள்கிறார்
      '12':
        title: ‘ஷிபோலேத்’ சோதனையால் எபிராயீமியர் கொல்லப்படுகின்றனர்
      '13':
        title: சிம்சோனின் பிறப்பைத் தூதர் முன்னறிவிக்கிறார்
      '14':
        title: சிம்சோன் தாடை எலும்பால் பெலிஸ்தியரைத் தோற்கடிக்கிறார்
      '15':
        title: சிம்சோன் பழிவாங்கி பெலிஸ்தியரைக் கொல்கிறார்
      '16':
        title: சிம்சோன் பெலிஸ்தியரின் கோவிலை இடித்துத் தள்ளுகிறார்
      '17':
        title: மீகா அலைந்து திரிந்த குருவை வேலைக்கு அமர்த்துகிறார்
      '18':
        title: சிலைக்காகக் குருவைத் தாண் கோத்திரத்தார் கவர்ந்து செல்கின்றனர்
      '19':
        title: பென்யமீனியர் லேவியனின் மறுமனைவியைக் கொல்கின்றனர்
      '20':
        title: கிபியாவில் பென்யமீனை இஸ்ரவேல் தோற்கடிக்கிறது
      '21':
        title: நெருக்கடியிலிருந்து பென்யமீன் தப்பிப் பிழைக்கிறது
  Ruth:
    display_name: ரூத்
    author: ஆசிரியர் பெயர் தெரியவில்லை.
    audience: நாடுகடத்தலுக்குப் பிந்தைய இஸ்ரவேலர்—எஸ்றா–நெகேமியாவின் விலக்கிவைக்கும் கொள்கைகளுக்கு மாறாக, அந்நியர்களையும் ஏற்றுக்கொள்வதை ஆதரிப்பதற்காக எழுதப்பட்டிருக்கலாம்.
    date: பெரும்பாலும் நாடுகடத்தலுக்குப் பிந்தைய காலத்தைச் சேர்ந்தது; ஏறத்தாழ கி.மு. 6–4ஆம் நூற்றாண்டுகள்.
    chapters:
      '1':
        title: அனைத்தையும் இழந்த நகோமி வெறுமையுடன் திரும்புகிறார்
      '2':
        title: போவாசின் வயலில் ரூத் கதிர் பொறுக்குகிறார்
      '3':
        title: இரவில் ரூத் பாதுகாப்பை நாடுகிறார்
      '4':
        title: போவாஸ் ரூத்தையும் குடும்பத்தையும் மீட்கிறார்
  1 Samuel:
    display_name: 1 சாமுவேல்
    author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
    audience: சாமுவேல், சவுல், தாவீது ஆகியோரின் காலத்தில் முடியாட்சி உருவானதைப் பற்றிச் சிந்தித்த இஸ்ரவேலர்.
    date: பழைய ஆதாரங்களிலிருந்து ஏறத்தாழ கி.மு. 7–6ஆம் நூற்றாண்டுகளில் தொகுக்கப்பட்டது.
    chapters:
      '1':
        title: ஒரு மகனுக்காக அன்னாள் மன்றாடுகிறார்
      '2':
        title: கடவுளின் பேராட்சியை அன்னாள் புகழ்கிறார்
      '3':
        title: கடவுளின் அழைப்பைச் சாமுவேல் கேட்கிறார்
      '4':
        title: உடன்படிக்கைப் பெட்டியைப் பெலிஸ்தியரிடம் இஸ்ரவேல் இழக்கிறது
      '5':
        title: உடன்படிக்கைப் பெட்டியால் பெலிஸ்தியர் துன்புறுகின்றனர்
      '6':
        title: உடன்படிக்கைப் பெட்டி திரும்புகிறது; பெத்-ஷெமேஷ் மகிழ்கிறது
      '7':
        title: இஸ்ரவேல் மனந்திரும்பி பெலிஸ்தியரைத் தோற்கடிக்கிறது
      '8':
        title: இஸ்ரவேல் ஓர் அரசனைக் கேட்கிறது
      '9':
        title: இறைவாக்கினரான சாமுவேலைச் சவுல் சந்திக்கிறார்
      '10':
        title: சவுலை அரசராகச் சாமுவேல் திருப்பொழிவு செய்கிறார்
      '11':
        title: அம்மோனுக்கு எதிராக இஸ்ரவேலைச் சவுல் ஒன்றிணைக்கிறார்
      '12':
        title: இஸ்ரவேலின் பாவத்தைச் சாமுவேல் கண்டிக்கிறார்
      '13':
        title: கடவுளின் கட்டளைக்குச் சவுல் கீழ்ப்படியவில்லை
      '14':
        title: தாவீது விசுவாசத்துடன் பெலிஸ்தியரைத் தோற்கடிக்கிறார்
      '15':
        title: சவுலின் பொறாமை தாவீதுக்கு அச்சுறுத்தலாகிறது
      '16':
        title: சவுலுக்குப் பதிலாகத் தாவீதைக் கடவுள் தேர்ந்தெடுக்கிறார்
      '17':
        title: மாவீரன் கோலியாத்தைத் தாவீது தோற்கடிக்கிறார்
      '18':
        title: யோனத்தான் தாவீதுடன் நெருங்கிய நட்புறவு கொள்கிறார்
      '19':
        title: சவுலிடமிருந்து தாவீது தப்பிச் செல்கிறார்
      '20':
        title: ஆபத்தைப் பற்றித் தாவீதை யோனத்தான் எச்சரிக்கிறார்
      '21':
        title: குருவான அகிமெலேக்கிடம் தாவீது தப்பிச் செல்கிறார்
      '22':
        title: அதுல்லாமில் தாவீது தலைவராகிறார்
      '23':
        title: சவுல் அரசனின் உயிரைத் தாவீது காப்பாற்றுகிறார்
      '24':
        title: குகையில் சவுலின் உயிரைத் தாவீது காப்பாற்றுகிறார்
      '25':
        title: அபிகாயில் மன்றாடுகிறார்; நாபால் இறக்கிறார்
      '26':
        title: சவுலின் உயிரைத் தாவீது காப்பாற்றுகிறார்
      '27':
        title: ஆகீசுக்காகத் தாக்குதல் நடத்தியதாகத் தாவீது பாசாங்கு செய்கிறார்
      '28':
        title: விரக்தியில் சாமுவேலைச் சவுல் நாடுகிறார்
      '29':
        title: போரில் பங்கேற்கத் தாவீது அனுமதிக்கப்படவில்லை
      '30':
        title: சிக்லாகில் சிறைபிடிக்கப்பட்டவர்களைத் தாவீது மீட்கிறார்
      '31':
        title: சவுல் வீழ்கிறார்; பெலிஸ்தியர் வெற்றி பெறுகின்றனர்
  2 Samuel:
    display_name: 2 சாமுவேல்
    author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
    audience: தாவீதின் ஆட்சியையும்—அதன் வெற்றிகளையும் துயரங்களையும்—மன்னராட்சியின் தொடக்க முன்மாதிரியாக வாசித்த இஸ்ரவேலர்.
    date: ஏறத்தாழ கி.மு. 7–6ஆம் நூற்றாண்டுகளில் தொகுக்கப்பட்டது.
    chapters:
      '1':
        title: சவுலின் மரணத்திற்காகத் தாவீது புலம்புகிறார்
      '2':
        title: யூதா தாவீதை அரசராகத் திருப்பொழிவு செய்கிறது
      '3':
        title: சவுலின் குடும்பத்திற்கு அப்னேர் துரோகம் செய்கிறார்
      '4':
        title: இஸ்போசேத்துக்குத் தாவீது மரியாதை செலுத்துகிறார்
      '5':
        title: தாவீதின் கீழ் இஸ்ரவேல் ஒன்றிணைகிறது
      '6':
        title: உடன்படிக்கைப் பெட்டியைத் தாவீது எருசலேமுக்குக் கொண்டுவருகிறார்
      '7':
        title: கடவுளின் வாக்குறுதியை நாத்தான் அறிவிக்கிறார்
      '8':
        title: பெலிஸ்தியரின் கூட்டாளிகளைத் தாவீது தோற்கடிக்கிறார்
      '9':
        title: மெபிபோசேத்துக்குத் தாவீது இரக்கம் காட்டுகிறார்
      '10':
        title: அம்மோனியப் படைகளை யோவாப் தோற்கடிக்கிறார்
      '11':
        title: பத்சேபாளுடன் தாவீது பாவம் செய்கிறார்
      '12':
        title: தாவீதின் பாவத்தை நாத்தான் நேருக்கு நேர் சுட்டிக்காட்டுகிறார்
      '13':
        title: அம்னோனை அப்சலோம் கொலை செய்கிறார்
      '14':
        title: அப்சலோமுடன் தாவீது ஒப்புரவாகிறார்
      '15':
        title: அப்சலோமிடமிருந்து தாவீது தப்பிச் செல்கிறார்
      '16':
        title: மெபிபோசேத்துக்கு சீபா துரோகம் செய்கிறார்
      '17':
        title: அகித்தோப்பேலின் திட்டத்தை ஊசாய் முறியடிக்கிறார்
      '18':
        title: போரில் அப்சலோமை யோவாப் கொல்கிறார்
      '19':
        title: அப்சலோமுக்காகத் தாவீது துயரப்படுகிறார்
      '20':
        title: இஸ்ரவேலரின் கிளர்ச்சிக்குச் சேபா தலைமை தாங்குகிறார்
      '21':
        title: சவுலின் பாவத்திற்காகத் தாவீது பரிகாரம் செய்கிறார்
      '22':
        title: கடவுள் அளித்த விடுதலைக்காகத் தாவீது அவரைப் புகழ்கிறார்
      '23':
        title: வலிமைமிக்க வீரர்களைத் தாவீது கௌரவிக்கிறார்
      '24':
        title: தாவீது கொள்ளைநோயை நிறுத்துகிறார்
  1 Kings:
    display_name: 1 இராஜாக்கள்
    author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
    audience: அரசு ஏன் வீழ்ந்தது என்று கேட்டுக்கொண்டிருந்த, நாடுகடத்தப்பட்ட காலத்தையும் அதற்குப் பிந்தைய காலத்தையும் சேர்ந்த இஸ்ரவேல் மக்கள்.
    date: பாபிலோனிய நாடுகடத்தலின்போது, சுமார் கி.மு. 6ஆம் நூற்றாண்டில், இறுதி வடிவம் பெற்றது.
    chapters:
      '1':
        title: சாலொமோன் அரசராக அபிஷேகம் செய்யப்படுகிறார்
      '2':
        title: தாவீது சாலொமோனுக்கு உண்மையுடன் அறிவுரை வழங்குகிறார்
      '3':
        title: சாலொமோன் இறைவனுக்கேற்ற ஞானத்தைக் கேட்கிறார்
      '4':
        title: சாலொமோன் ஒழுங்கும் வலிமையும் கொண்டு ஆட்சி செய்கிறார்
      '5':
        title: சாலொமோன் ஆலயத்தைக் கட்டிப் புகழ் பெறுகிறார்
      '6':
        title: ஆலயக் கட்டுமானம் கவனமாகத் தொடங்குகிறது
      '7':
        title: சாலொமோன் ஆலயப் பொருட்களைச் செய்து முடிக்கிறார்
      '8':
        title: சாலொமோன் ஆலயத்தில் ஜெபிக்கிறார்
      '9':
        title: கர்த்தர் சாலொமோனுடன் செய்த உடன்படிக்கையை மீண்டும் உறுதிப்படுத்துகிறார்
      '10':
        title: அரசி சாலொமோனின் ஞானத்தைப் போற்றுகிறார்
      '11':
        title: சாலொமோன் தடுமாறி வழிவிலகுகிறார்
      '12':
        title: ரெகொபெயாம் மக்களின் வேண்டுகோளை மறுக்கிறார்
      '13':
        title: தீர்க்கதரிசி அரசனை எதிர்த்து, பின்னர் இறக்கிறார்
      '14':
        title: யெரொபெயாம் இறைத் தீர்ப்பை எதிர்கொள்கிறார்
      '15':
        title: ஆசா உண்மையுடன் விக்கிரகங்களை அகற்றுகிறார்
      '16':
        title: கர்த்தர் இஸ்ரவேலின் அரசர்களை நியாயந்தீர்க்கிறார்
      '17':
        title: எலியா விதவைக்கு அற்புதமாக உணவளிக்கிறார்
      '18':
        title: எலியா ஆகாபை எதிர்கொண்டு நியாயந்தீர்க்கிறார்
      '19':
        title: எலியா ஓரேபில் புதிய பணியைப் பெறுகிறார்
      '20':
        title: ஆகாப் பெனாதாதை உயிரோடு விடுகிறார்
      '21':
        title: யேசபேல் நாபோத்தின் கொலையைத் திட்டமிடுகிறாள்
      '22':
        title: மிகாயா முன்னறிவித்தபடி ஆகாப் இறக்கிறார்
  2 Kings:
    display_name: 2 இராஜாக்கள்
    author: ஆசிரியர் பெயர் தெரியவில்லை; உபாகம வரலாற்றுத் தொகுப்பின் ஒரு பகுதி.
    audience: நாடுகடத்தப்பட்ட இஸ்ரவேல் மக்கள்—பிரிந்த இரு அரசுகளையும் இறையியல் நோக்கில் ஆராய்ந்து, அவை பாபிலோனியரால் கைப்பற்றப்பட்டதில் முடியும் ஒரு பதிவு.
    date: கி.மு. 586க்குப் பிறகு, சுமார் கி.மு. 6ஆம் நூற்றாண்டில் இறுதி வடிவம் பெற்றது.
    chapters:
      '1':
        title: அகசியா எலியாவின் தீர்ப்பை எதிர்கொள்கிறார்
      '2':
        title: எலியா சுழற்காற்றில் எடுத்துக்கொள்ளப்படுகிறார்
      '3':
        title: யோராம் எலிசாவுடன் மோவாபுக்கு எதிராகப் போரிடுகிறார்
      '4':
        title: எலிசா தேவையிலுள்ளவர்களுக்கு உதவுகிறார்
      '5':
        title: நாகமான் தொழுநோயிலிருந்து சுத்தமாக்கப்படுகிறார்
      '6':
        title: எலிசா ஆராமின் திட்டங்களை வெளிப்படுத்துகிறார்
      '7':
        title: சமாரியாவின் பஞ்சம் திடீரென முடிகிறது
      '8':
        title: எலிசா அரசர்களை எச்சரித்து நியாயந்தீர்க்கிறார்
      '9':
        title: யெகூ ஆகாபின் குடும்பத்தாரைக் கொன்றழிக்கிறார்
      '10':
        title: யெகூ பாகால் வழிபாட்டை அழிக்கிறார்
      '11':
        title: ஆலயத்தில் நடந்த ஆட்சிக் கவிழ்ப்பில் யோவாஸ் முடிசூட்டப்படுகிறார்
      '12':
        title: யோவாஸ் ஆலயத்தைப் பழுதுபார்க்கிறார்
      '13':
        title: இஸ்ரவேலுக்குக் கிடைத்த இரக்கத்தின் சுழற்சி முடிகிறது
      '14':
        title: அமத்சியா ஏதோமை வென்றும் தோல்வியடைகிறார்
      '15':
        title: யூதா நிலைத்திருக்க, இஸ்ரவேல் வீழ்ச்சியடைகிறது
      '16':
        title: ஆகாஸ் அசீரியாவின் உதவியை நாடுகிறார்
      '17':
        title: தொடர்ச்சியான பாவத்தால் இஸ்ரவேல் நாடுகடத்தப்படுகிறது
      '18':
        title: எசேக்கியா கர்த்தரை மட்டுமே நம்புகிறார்
      '19':
        title: கர்த்தர் எருசலேமை அசீரியாவிடமிருந்து விடுவிக்கிறார்
      '20':
        title: எசேக்கியா ஜெபித்து குணமடைகிறார்
      '21':
        title: மனாசே யூதாவைத் தீமைக்குள் வழிநடத்துகிறார்
      '22':
        title: யோசியா திருச்சட்டத்தைக் கண்டுபிடித்து மனந்திரும்புகிறார்
      '23':
        title: யோசியா விக்கிரக வழிபாட்டை அகற்றி பஸ்காவை மீண்டும் நிலைநாட்டுகிறார்
      '24':
        title: பாபிலோன் யெகோயாக்கீனைச் சிறைப்பிடிக்கிறது
      '25':
        title: யெகோயாக்கீன் பாபிலோனில் கௌரவிக்கப்படுகிறார்
  1 Chronicles:
    display_name: 1 நாளாகமம்
    author: ஆசிரியர் பெயர் தெரியவில்லை; மரபில் அவர் “நாளாகம ஆசிரியர்” என்று அழைக்கப்படுகிறார்.
    audience: பாரசீக ஆட்சிக்கால யெகூதில் வாழ்ந்த, நாடுகடத்தலுக்குப் பிந்தைய யூதேய சமூகம்; தாவீது, ஆலயம், வழிபாடு ஆகியவற்றை மையமாகக் கொண்டு தங்கள் அடையாளத்தை மீண்டும் நிலைநிறுத்திக்கொண்டிருந்தவர்கள்.
    date: சுமார் கி.மு. 4ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: இறைவன் இஸ்ரவேலின் வம்சவரிசையை அமைக்கிறார்
      '2':
        title: தலைமுறைகள்தோறும் தொடரும் யூதாவின் வம்சம்
      '3':
        title: தாவீதின் குடும்பம் தொடர்ந்து நிலைக்கிறது
      '4':
        title: யாப்பேத்தின் சந்ததியினர் பெயரிடப்படுகின்றனர்
      '5':
        title: கிழக்குக் கோத்திரத்தார் வடக்கே நாடுகடத்தப்படுகின்றனர்
      '6':
        title: லேவியின் ஆசாரிய வம்சம் கௌரவிக்கப்படுகிறது
      '7':
        title: இசக்காரின் வலிமைமிக்க வீரர்கள்
      '8':
        title: பென்யமீனின் தலைவர்களும் குலங்களும்
      '9':
        title: எருசலேமுக்குத் திரும்பி மீண்டும் கட்டுதல்
      '10':
        title: சவுல் கில்போவா மலையில் இறக்கிறார்
      '11':
        title: தாவீது அனைவருக்கும் அரசராக அபிஷேகம் செய்யப்படுகிறார்
      '12':
        title: வீரர்கள் தாவீதின் அரசில் இணைகின்றனர்
      '13':
        title: தாவீது உடன்படிக்கைப் பெட்டியைத் திரும்பக் கொண்டுவருகிறார்
      '14':
        title: தாவீது மீண்டும் பெலிஸ்தியரைத் தோற்கடிக்கிறார்
      '15':
        title: உடன்படிக்கைப் பெட்டி எருசலேமுக்குக் கொண்டுவரப்படுகிறது
      '16':
        title: தாவீது ஆலய வழிபாட்டுக்கானவர்களை நியமிக்கிறார்
      '17':
        title: இறைவன் தாவீதின் அரச வம்சத்தைப் பற்றி வாக்களிக்கிறார்
      '18':
        title: தாவீது பிற நாடுகள்மீது வெற்றி பெறுகிறார்
      '19':
        title: யோவாப் அம்மோனையும் ஆராமையும் தோற்கடிக்கிறார்
      '20':
        title: யோவாப் ரப்பா நகரைக் கைப்பற்றுகிறார்
      '21':
        title: தாவீதின் மக்கள் தொகைக் கணக்கெடுப்பு கொள்ளைநோயைக் கொண்டுவருகிறது
      '22':
        title: இறைவனின் ஆலயத்தைக் கட்ட சாலொமோன் தேர்ந்தெடுக்கப்படுகிறார்
      '23':
        title: லேவியர்கள் பணிக்காக ஒழுங்கமைக்கப்படுகின்றனர்
      '24':
        title: ஆசாரியர்கள் சீட்டுப்போட்டு பிரிவுகளாகப் பிரிக்கப்படுகின்றனர்
      '25':
        title: வழிபாட்டுக்காக இசைக் கலைஞர்கள் ஒழுங்கமைக்கப்படுகின்றனர்
      '26':
        title: ஆலயக் காவலர்கள் கவனமாக நியமிக்கப்படுகின்றனர்
      '27':
        title: தாவீதின் கீழ் இஸ்ரவேல் ஒழுங்கமைக்கப்படுகிறது
      '28':
        title: ஆலயத்திற்கான தாவீதின் திட்டங்கள் வழங்கப்படுகின்றன
      '29':
        title: நாடுகள் இறைவனின் ஆலயத்திற்குக் கொடுக்கின்றன
  2 Chronicles:
    display_name: 2 நாளாகமம்
    author: ஆசிரியர் பெயர் தெரியவில்லை; “நாளாகம ஆசிரியர்” என்று அழைக்கப்படுகிறார்.
    audience: நாடுகடத்தலுக்குப் பிந்தைய யூதேய சமூகம்.
    date: சுமார் கி.மு. 4ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: சாலொமோன் ஞானத்தைக் கேட்கிறார்
      '2':
        title: ஆலயத் திட்டங்களும் தாழ்மையும்
      '3':
        title: ஆலயக் கட்டுமானம் தொடங்குகிறது
      '4':
        title: ஆலயப் பொருட்கள் செய்யப்படுகின்றன
      '5':
        title: உடன்படிக்கைப் பெட்டி ஆலயத்திற்குக் கொண்டுவரப்படுகிறது
      '6':
        title: சாலொமோன் ஆலயத்திற்காக ஜெபிக்கிறார்
      '7':
        title: நெருப்பு பலிகளை எரித்துவிடுகிறது
      '8':
        title: சாலொமோன் அரசை வலுப்படுத்துகிறார்
      '9':
        title: சாலொமோனின் ஞானம் போற்றப்படுகிறது
      '10':
        title: ரெகொபெயாம் அறிவுரையை நிராகரிக்கிறார்
      '11':
        title: ரெகொபெயாம் நகரங்களை அரணாக்குகிறார்
      '12':
        title: யூதா கர்த்தரைக் கைவிடுகிறது
      '13':
        title: அபியா யெரொபெயாமைத் தோற்கடிக்கிறார்
      '14':
        title: ஆசா கூஷியரைத் தோற்கடிக்கிறார்
      '15':
        title: ஆசா விக்கிரகங்களை அகற்றுகிறார்
      '16':
        title: ஆசா ஆராமை நம்பியிருக்கிறார்
      '17':
        title: யோசபாத் இறைவனைப் பின்பற்றுகிறார்
      '18':
        title: மிகாயா ஆகாபை எச்சரிக்கிறார்
      '19':
        title: யோசபாத் நியாயாதிபதிகளை நியமிக்கிறார்
      '20':
        title: எதிரிகளை வென்ற யூதா
      '21':
        title: யோராம் தன் சகோதரர்களைக் கொல்கிறான்
      '22':
        title: அகசியா தீய வழிகளைப் பின்பற்றுகிறான்
      '23':
        title: யோவாஸ் மீண்டும் அரசனாக்கப்படுகிறான்
      '24':
        title: ஆலயப் புதுப்பிப்பும் பின்னடைவும்
      '25':
        title: அமத்சியா ஏதோமைத் தோற்கடிக்கிறான்
      '26':
        title: உசியாவின் செழிப்பு முடிவடைகிறது
      '27':
        title: யோதாம் யூதாவை வலுப்படுத்துகிறான்
      '28':
        title: ஆகாசின் கடும் உண்மையின்மை
      '29':
        title: எசேக்கியா ஆலயத்தை மீண்டும் திறக்கிறான்
      '30':
        title: இஸ்ரவேலர் அனைவரும் பஸ்காவைக் கொண்டாடுகின்றனர்
      '31':
        title: எசேக்கியா ஆலயக் களஞ்சியங்களை நிரப்புகிறான்
      '32':
        title: தூதரின் வல்லமையால் எருசலேம் விடுவிக்கப்படுகிறது
      '33':
        title: மனாசே மனந்திரும்பி பலிபீடத்தைச் சீரமைக்கிறான்
      '34':
        title: யோசியா திருச்சட்டத்தைக் கண்டெடுத்து வாசிக்கிறான்
      '35':
        title: யோசியா மாபெரும் பஸ்கா விழாவை நடத்துகிறான்
      '36':
        title: பாபிலோனிய வல்லரசிடம் யூதா வீழ்கிறது
  Ezra:
    display_name: எஸ்றா
    author: ஆசிரியர் பெயர் தெரியவில்லை; நாளாகமங்களின் ஆசிரியரே இதையும் எழுதியிருக்கலாம்.
    audience: பெர்சிய ஆட்சியின் கீழ் எருசலேமை மீண்டும் கட்டியெழுப்பிய தாயகம் திரும்பியவர்கள்.
    date: ஏறத்தாழ கி.மு. 5ஆம் நூற்றாண்டின் நடுப்பகுதி முதல் 4ஆம் நூற்றாண்டு வரை.
    chapters:
      '1':
        title: ஆலயத்தை மீண்டும் கட்ட கோரேசு அனுமதிக்கிறான்
      '2':
        title: நாடுகடத்தப்பட்டவர்களுடன் எஸ்றா திரும்பி வருகிறார்
      '3':
        title: அச்சத்தின் நடுவே எருசலேமில் பலிபீடம் மீண்டும் கட்டப்படுகிறது
      '4':
        title: எதிரிகள் ஆலய மறுகட்டுமானப் பணிகளை நிறுத்துகின்றனர்
      '5':
        title: ஆலய மறுகட்டுமானத்தை கடவுள் வழிநடத்துகிறார்
      '6':
        title: ஆலயக் கட்டுமானத்தை மீண்டும் தொடங்க தாரியு கட்டளையிடுகிறான்
      '7':
        title: எஸ்றா கடவுளின் திருச்சட்டத்தைப் போதிக்கிறார்
      '8':
        title: எஸ்றா ஜெபித்து பாதுகாப்பாகத் திரும்பி வருகிறார்
      '9':
        title: இஸ்ரவேலரின் பாவமிக்க திருமணங்களுக்காக எஸ்றா துயரப்படுகிறார்
      '10':
        title: பாவமிக்க திருமணங்களை எஸ்றா எதிர்கொள்கிறார்
  Nehemiah:
    display_name: நெகேமியா
    author: ஆசிரியர் பெயர் தெரியவில்லை; நெகேமியா எழுதியதாகக் கருதப்படும் தன்வரலாற்றுக் குறிப்புகளும் இதில் இடம்பெற்றுள்ளன.
    audience: பெர்சிய ஆட்சியின் கீழ் எருசலேமின் மதில்களை மீண்டும் கட்டியெழுப்பி, உடன்படிக்கையைப் புதுப்பித்த தாயகம் திரும்பியவர்கள்.
    date: ஏறத்தாழ கி.மு. 5ஆம் நூற்றாண்டின் நடுப்பகுதி முதல் 4ஆம் நூற்றாண்டு வரை.
    chapters:
      '1':
        title: எருசலேமுக்காக நெகேமியா ஜெபிக்கிறார்
      '2':
        title: மீண்டும் கட்டியெழுப்ப அரசன் நெகேமியாவை அனுப்புகிறான்
      '3':
        title: ஒன்றிணைந்து எழுப்பப்படும் எருசலேமின் மதில்கள்
      '4':
        title: நெகேமியா எருசலேமைப் பாதுகாக்கிறார்
      '5':
        title: சமூக அநீதியை நெகேமியா எதிர்த்துப் போராடுகிறார்
      '6':
        title: கடவுளின் பணியைத் தடுக்க எதிரிகள் தோற்கின்றனர்
      '7':
        title: நகரக் காவலர்களும் மக்களும் பட்டியலிடப்படுகின்றனர்
      '8':
        title: எஸ்றா திருச்சட்டத்தை வாசிக்க, மக்கள் அழுகின்றனர்
      '9':
        title: இஸ்ரவேலர் கடவுளிடம் தங்கள் பாவங்களை அறிக்கையிடுகின்றனர்
      '10':
        title: மக்கள் கடவுளோடு உடன்படிக்கை செய்கின்றனர்
      '11':
        title: தலைவர்கள் பரிசுத்த நகரத்தில் மக்களைக் குடியமர்த்துகின்றனர்
      '12':
        title: மதில் அர்ப்பணிப்பு வழிபாட்டுடன் கொண்டாடப்படுகிறது
      '13':
        title: நெகேமியா ஆலயத்தை மீண்டும் தூய்மைப்படுத்துகிறார்
  Esther:
    display_name: எஸ்தர்
    author: ஆசிரியர் பெயர் தெரியவில்லை.
    audience: அந்நிய ஆட்சியின் கீழ், குறிப்பாகப் பெர்சியாவில், புலம்பெயர்ந்து வாழ்ந்த யூதர்கள்.
    date: ஏறத்தாழ பெர்சியக் காலத்தின் இறுதிப்பகுதி அல்லது கிரேக்கக் காலத்தின் தொடக்கப்பகுதி (கி.மு. 4–3ஆம் நூற்றாண்டு).
    chapters:
      '1':
        title: அரசி வஸ்தியை அரசன் விலக்குகிறார்
      '2':
        title: எஸ்தர் புதிய அரசியாகிறார்
      '3':
        title: யூதர்களை அழிக்க ஆமான் திட்டமிடுகிறான்
      '4':
        title: செயல்படுமாறு எஸ்தரை மொர்தெகாய் வலியுறுத்துகிறான்
      '5':
        title: அரசனையும் ஆமானையும் எஸ்தர் அழைக்கிறார்
      '6':
        title: மொர்தெகாயை அரசன் பொதுமக்கள் முன் கௌரவிக்கிறான்
      '7':
        title: ஆமானின் சதித்திட்டத்தை எஸ்தர் அம்பலப்படுத்துகிறார்
      '8':
        title: ஆமானின் அதிகாரத்தை மொர்தெகாய் பெறுகிறார்
      '9':
        title: யூதர்கள் வெற்றிகரமாகத் தங்களைத் தற்காத்துக்கொள்கின்றனர்
      '10':
        title: மொர்தெகாய் நன்றாகவும் ஞானமாகவும் ஆட்சி செய்கிறார்
  Job:
    display_name: யோபு
    author: ஆசிரியர் பெயர் தெரியவில்லை.
    audience: குற்றமற்றவர்களின் துன்பத்தையும் இறைநீதியையும் புரிந்துகொள்ளப் போராடிய இஸ்ரவேலர்.
    date: பழைய நாட்டுப்புற மரபுகளை அடிப்படையாகக் கொண்ட இந்நூல், ஏறத்தாழ கி.மு. 6–4ஆம் நூற்றாண்டைச் சேர்ந்தது என்பது ஞான இலக்கிய ஆய்வாளர்களிடையே பொதுவான கருத்து.
    chapters:
      '1':
        title: எல்லாவற்றையும் இழந்தும் யோபு வழிபடுகிறார்
      '2':
        title: யோபு உண்மையோடு துன்பத்தைத் தாங்குகிறார்
      '3':
        title: யோபு தான் பிறந்த நாளைச் சபிக்கிறார்
      '4':
        title: யோபு விதைத்ததைக் குறித்து எலிப்பாஸ் கண்டிக்கிறார்
      '5':
        title: கடவுளை நாடுமாறு யோபுக்கு எலிப்பாஸ் அறிவுறுத்துகிறார்
      '6':
        title: தன் கனத்த சுமையை யோபு விவரிக்கிறார்
      '7':
        title: தன் துன்பத்தைக் குறித்து யோபு முறையிடுகிறார்
      '8':
        title: யோபின் துன்பத்தைக் குறித்து பில்தாத் கண்டிக்கிறார்
      '9':
        title: கடவுளின் வல்லமையை எண்ணி யோபு புலம்புகிறார்
      '10':
        title: என்னோடு ஏன் போராடுகிறீர் என யோபு கேட்கிறார்
      '11':
        title: ஞானம் கூறி யோபை சோப்பார் கண்டிக்கிறார்
      '12':
        title: நண்பர்களின் வெற்று வார்த்தைகளை யோபு ஏளனம் செய்கிறார்
      '13':
        title: கடவுளுக்கு முன்பாக யோபு உண்மையைப் பேசுகிறார்
      '14':
        title: வாழ்க்கையின் நிலையாமைக்காக யோபு புலம்புகிறார்
      '15':
        title: யோபு பாவம் செய்ததாக எலிப்பாஸ் குற்றஞ்சாட்டுகிறார்
      '16':
        title: யோபு கடவுளை நோக்கிக் கதறுகிறார்
      '17':
        title: நண்பர்களால் ஏளனம் செய்யப்பட்ட யோபு நம்பிக்கையிழக்கிறார்
      '18':
        title: தீயவர்களின் முடிவை பில்தாத் விவரிக்கிறார்
      '19':
        title: தன் மீட்பருக்காக யோபு ஏங்குகிறார்
      '20':
        title: தீமையின் அழிவை சோப்பார் அறிவிக்கிறார்
      '21':
        title: தீயவர்கள் செழிப்பதை யோபு சுட்டிக்காட்டுகிறார்
      '22':
        title: யோபு பாவங்கள் செய்ததாக எலிப்பாஸ் குற்றஞ்சாட்டுகிறார்
      '23':
        title: கடவுளைக் கண்டடைய யோபு ஏங்குகிறார்
      '24':
        title: தீயவர்களால் ஏற்படும் துன்பத்தை யோபு விவரிக்கிறார்
      '25':
        title: கடவுளின் அளவற்ற வல்லமையை பில்தாத் போற்றுகிறார்
      '26':
        title: நண்பர்களின் வெற்று ஞானத்தை யோபு ஏளனம் செய்கிறார்
      '27':
        title: யோபு தன் நேர்மையை உறுதியாகப் பற்றிக்கொள்கிறார்
      '28':
        title: உலகச் செல்வங்களைப் பற்றி யோபு சிந்திக்கிறார்
      '29':
        title: மதிப்புடன் வாழ்ந்த நாட்களை யோபு நினைவுகூர்கிறார்
      '30':
        title: ஏளனத்துக்கும் கடும் வேதனைக்கும் உள்ளாகும் யோபு
      '31':
        title: தான் முற்றிலும் குற்றமற்றவர் என்று யோபு ஆணையிடுகிறார்
      '32':
        title: யோபுக்கு எதிராக எலிகூ பேசுகிறார்
      '33':
        title: தாழ்மையோடு மனந்திரும்புமாறு எலிகூ வலியுறுத்துகிறார்
      '34':
        title: கடவுளின் நீதியை எலிகூ ஆதரித்துப் பேசுகிறார்
      '35':
        title: வெற்று வார்த்தைகளைக் குறித்து எலிகூ எச்சரிக்கிறார்
      '36':
        title: கடவுளின் வல்லமையை எலிகூ அறிவிக்கிறார்
      '37':
        title: கடவுளின் மாட்சிமையை எலிகூ எடுத்துக்காட்டுகிறார்
      '38':
        title: யோபின் அறிவுக்குக் கடவுள் சவால் விடுக்கிறார்
      '39':
        title: யோபின் ஞானத்தைக் கடவுள் கேள்விக்குட்படுத்துகிறார்
      '40':
        title: தன் சிறுமையை யோபு ஒப்புக்கொள்கிறார்
      '41':
        title: மனித வலிமைக்கு அடங்காத லிவியாதான்
      '42':
        title: யோபு மனந்திரும்பி மீண்டும் நல்வாழ்வு பெறுகிறார்
  Psalms:
    display_name: சங்கீதங்கள்
    author: பல நூற்றாண்டுகளில் வாழ்ந்த பல ஆசிரியர்கள்; முன்னுரைக் குறிப்புகள் தாவீது, ஆசாப், கோராகு, சாலொமோன், மோசே மற்றும் பிறரின் பெயர்களைக் குறிப்பிடுகின்றன.
    audience: வழிபாட்டில் ஈடுபட்ட இஸ்ரவேலரும் ஆலயச் சபையாரும்—அதோடு, பிற்காலத்தில் ஜெபமும் புலம்பலும் ஏறெடுத்த ஒவ்வொரு சமூகமும்.
    date: ஏறத்தாழ கி.மு. 10–3ஆம் நூற்றாண்டுகளில் இயற்றப்பட்டது; நாடுகடத்தலுக்குப் பிந்தைய காலத்தில் இறுதியாகத் தொகுக்கப்பட்டது.
    chapters:
      '1':
        title: நீதியான வாழ்வு பேறுபெற்றது
      '2':
        title: கலகம் செய்யும் அரசர்களைக் கண்டு கடவுள் நகைக்கிறார்
      '3':
        title: கடவுளே தன் கேடயம் என்று தாவீது நம்புகிறார்
      '4':
        title: தாவீது கடவுளின் ஒளியை நாடுகிறார்
      '5':
        title: தாவீது கடவுளின் திருமுகத்தை நாடி மன்றாடுகிறார்
      '6':
        title: தாவீது கடவுளின் இரக்கத்திற்காகக் கதறுகிறார்
      '7':
        title: நீதியுள்ள நியாயாதிபதியிடம் தாவீது மன்றாடுகிறார்
      '8':
        title: தாவீது கடவுளின் மகிமையைப் போற்றுகிறார்
      '9':
        title: தாவீது கடவுளின் ஆட்சியைக் கொண்டாடுகிறார்
      '10':
        title: கடவுள் தீமையைக் கண்டு தீர்ப்பளிக்கிறார்
      '11':
        title: தீயோருக்கு அஞ்ச தாவீது மறுக்கிறார்
      '12':
        title: உண்மையான பேச்சுக்காகத் தாவீது மன்றாடுகிறார்
      '13':
        title: தாவீது கடவுளின் அன்பில் நம்பிக்கை வைக்கிறார்
      '14':
        title: கடவுளை மறுப்பது அழிவுக்கு வழிநடத்துகிறது
      '15':
        title: தகுதிக்கான அளவுகோல்களைத் தாவீது கேட்கிறார்
      '16':
        title: கடவுளை நம்பித் தாவீது மன்றாடுகிறார்
      '17':
        title: நீதியான விடுதலைக்காகத் தாவீது மன்றாடுகிறார்
      '18':
        title: மீட்புக்கான நன்றித் திருப்பாடல்
      '19':
        title: கடவுளின் திருச்சட்டமும் மகிமையும் ஒளிர்கின்றன
      '20':
        title: அபிஷேகம் பெற்ற அரசரை ஆண்டவர் காக்கிறார்
      '21':
        title: கடவுளின் வல்லமையில் அரசர் மகிழ்கிறார்
      '22':
        title: ஆழ்ந்த கைவிடப்பட்ட உணர்வு புகழ்ச்சியாக மாறுகிறது
      '23':
        title: மேய்ப்பர் என் அருகிலேயே இருக்கிறார்
      '24':
        title: தூய இதயங்களை ஆண்டவர் நாடுகிறார்
      '25':
        title: நம்பிக்கையும் மீட்பும் பற்றிய திருப்பாடல்
      '26':
        title: மீட்புக்காகத் தாவீது மன்றாடுகிறார்
      '27':
        title: ஆண்டவரின் பிரசன்னத்திற்கான ஏக்கம்
      '28':
        title: கடவுள் செவிசாய்க்க வேண்டுமெனத் தாவீது மன்றாடுகிறார்
      '29':
        title: பரிசுத்த மாட்சியுடன் ஆண்டவர் ஆட்சி செய்கிறார்
      '30':
        title: மரணத்திலிருந்து மீட்டதற்கான புகழ்ச்சி
      '31':
        title: கடவுளின் மீட்பில் தாவீது நம்பிக்கை வைக்கிறார்
      '32':
        title: மன்னிக்கப்பட்ட பாவிகள் பேறுபெற்றோர்
      '33':
        title: உண்மையுள்ள படைப்பாளரைப் போற்றுங்கள்
      '34':
        title: கடவுள் நல்லவர் என்பதைச் சுவைத்துப் பாருங்கள்
      '35':
        title: விடுதலைக்காகத் தாவீது மன்றாடுகிறார்
      '36':
        title: கடவுளின் அன்பு தீமையையும் மீறிப் பெருகுகிறது
      '37':
