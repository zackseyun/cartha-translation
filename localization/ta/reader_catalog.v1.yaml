  Gospel of Truth:
    display_name: சத்தியத்தின் நற்செய்தி
    author: ஆசிரியர் பெயர் தெரியவில்லை; வாலெந்தினுஸ் அல்லது அவரது பள்ளியைச் சேர்ந்தவர்களால் எழுதப்பட்டதாகப் பரவலாகக் கருதப்படுகிறது.
    audience: வாலெந்தினிய ஞானவாத இயக்கத்தைச் சேர்ந்த கிறிஸ்தவ வாசகர்கள்.
    date: கி.பி. 2ஆம் நூற்றாண்டின் நடுப்பகுதி எனக் கருதப்படுகிறது; நாக் ஹம்மாடியில் பாதுகாக்கப்பட்டது.
    chapters:
      '1':
        title: அருள் தந்தையின் சத்தியத்தை வெளிப்படுத்துகிறது
      '2':
        title: மறதியில் பிழை வலுப்பெறுகிறது
      '3':
        title: தந்தை பிள்ளைகளுக்கு அறிவை வெளிப்படுத்துகிறார்
      '4':
        title: பெயரால் அழைக்கப்பட்டவர்கள் இளைப்பாறுதல் பெறுகிறார்கள்
      '5':
        title: இயேசு அனைத்தையும் நிறைவுக்குக் கொண்டுவருகிறார்
      '6':
        title: வார்த்தை பிழையை ஊடுருவி வெட்டுகிறது
      '7':
        title: தந்தையின் பெயர் வெளிக்கொணர்கிறது
      '8':
        title: பயங்கரம் ஒன்றுமில்லை என்பதை ஒளி வெளிப்படுத்துகிறது
      '9':
        title: அவர் அவர்களுக்கு ஒளியையும் வாழ்வையும் கற்பித்தார்
      '10':
        title: மேய்ப்பர் அந்த ஓர் ஆட்டைத் தேடுகிறார்
      '11':
        title: புரிதல் பார்வையற்றோரை விழிப்படையச் செய்கிறது
      '12':
        title: ஒளி பாவங்களிலிருந்து மீட்பைக் கொண்டுவருகிறது
      '13':
        title: அவர் தமது சித்தத்தை ஒளியில் உரைக்கிறார்
      '14':
        title: தந்தை அன்பு மகனுக்குப் பெயரிடுகிறார்
      '15':
        title: தந்தைக்குள் சத்தியம் இளைப்பாறுகிறது
      '16':
        title: நான் என்னைத் தந்தைக்கு அர்ப்பணிக்கிறேன்
  Jubilees:
    display_name: யூபிலிகள்
    author: ஆசிரியர் பெயர் தெரியவில்லை; மோசேக்கு சீனாய் மலையில் அளிக்கப்பட்ட வெளிப்பாடாக முன்வைக்கப்படுகிறது.
    audience: 364 நாட்களைக் கொண்ட சூரிய நாட்காட்டியையும் கடுமையான ஹலாகா விதிகளையும் கடைப்பிடித்த யூதச் சமூகங்கள் (கும்ரான் சமூகத்தின் அதே சூழலைச் சேர்ந்தவர்களாக இருக்கக்கூடும்).
    date: கி.மு. 2ஆம் நூற்றாண்டின் நடுப்பகுதி எனக் கருதப்படுகிறது; கீஸ் (எத்தியோப்பிய) மொழியில் முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: இரக்கத்திற்காக மோசே மன்றாடுகிறார்
      '2':
        title: இஸ்ரவேலுக்கான ஓய்வுநாளின் புனிதம்
      '3':
        title: ஏதேனில் ஆதாம் ஏவாளுக்குப் பெயரிடுகிறார்
      '4':
        title: தீர்ப்பைப் பற்றி ஏனோக்கு எச்சரிக்கிறார்
      '5':
        title: பாவத்தின் காரணமாகப் பெருவெள்ளம் தீர்மானிக்கப்படுகிறது
      '6':
        title: வானவில் வழியாக நோவாவுடன் உடன்படிக்கை செய்யப்படுகிறது
      '7':
        title: நீதியுடன் வாழுமாறு நோவா சந்ததியினரை எச்சரிக்கிறார்
      '8':
        title: நோவா பூமியைப் பிரிக்கிறார்
      '9':
        title: ஆவிகளை ஆள மஸ்தேமா நாடுகிறான்
      '10':
        title: பாபேல் கோபுரத்திலிருந்து மக்கள் சிதறடிக்கப்படுகிறார்கள்
      '11':
        title: சீர்கேட்டின் நடுவே செரூகு மகனுக்குப் பெயரிடுகிறார்
      '12':
        title: விண்ணக மொழி மீட்டளிக்கப்படுகிறது
      '13':
        title: ஆபிராம் லோத்துவை மீட்டு தசமபாகம் கொடுக்கிறார்
      '14':
        title: ஆபிராமுக்கு மிகுந்த வெகுமதியை இறைவன் வாக்களிக்கிறார்
      '15':
        title: விருத்தசேதனம் உடன்படிக்கையின் அடையாளமாகிறது
      '16':
        title: ஈசாக்கு பிறக்கிறார்; சோதோம் அழிக்கப்படுகிறது
      '17':
        title: ஆபிரகாமின் விசுவாசம் நிரூபிக்கப்படுகிறது
      '18':
        title: சீயோனில் ஆபிரகாமின் கீழ்ப்படிதல் சோதிக்கப்படுகிறது
      '19':
        title: ஆபிரகாம் இறக்கிறார்; யாக்கோபு ஆசீர்வதிக்கப்படுகிறார்
      '20':
        title: தூய்மையைக் கடைப்பிடிக்க ஆபிரகாம் கட்டளையிடுகிறார்
      '21':
        title: நீதியுடன் வாழ யாக்கோபை ஆபிரகாம் ஆசீர்வதிக்கிறார்
      '22':
        title: வாரங்களின் பண்டிகை ஏற்படுத்தப்படுகிறது
      '23':
        title: ஏசாவின் கோபத்திலிருந்து யாக்கோபு தப்பியோடுகிறார்
      '24':
        title: லாபானுக்காக யாக்கோபு வஞ்சகமாகப் பணியாற்றுகிறார்
      '25':
        title: யாக்கோபு கானானுக்குத் திரும்புகிறார்
      '26':
        title: யாக்கோபும் ஏசாவும் சமரசமாகிறார்கள்
      '27':
        title: ஏசாவிடமிருந்து தப்பியோடுகையில் யாக்கோபு கனவு காண்கிறார்
      '28':
        title: லாபான் யாக்கோபை ஏமாற்றித் திருமணம் செய்விக்கிறார்
      '29':
        title: யாக்கோபு லாபானுக்குத் தெரியாமல் புறப்படுகிறார்
      '30':
        title: தீனாளுக்காக சிமியோனும் லேவியும் பழிவாங்குகிறார்கள்
      '31':
        title: ஈசாக்கு லேவியையும் யூதாவையும் ஆசீர்வதிக்கிறார்
      '32':
        title: யாக்கோபு தசமபாகம் செலுத்தி மன்றாடுகிறார்
      '33':
        title: ரூபன் யாக்கோபுக்கு மிகுந்த மனவேதனை உண்டாக்குகிறார்
      '34':
        title: யோசேப்பு எகிப்துக்கு விற்கப்படும் துயரம்
      '35':
        title: மக்பேலா அருகே ரெபெக்காள் இறக்கிறார்
      '36':
        title: இறப்பதற்குமுன் ஈசாக்கு ஆசீர்வதிக்கிறார்
      '37':
        title: ஏசா தன் ஆணையைத் துறக்கிறார்
      '38':
        title: போரில் ஏசாவை யாக்கோபு கொல்கிறார்
      '39':
        title: போத்திபாரின் மனைவிக்கு யோசேப்பு இணங்க மறுக்கிறார்
      '40':
        title: யோசேப்பு உயர்ந்து எகிப்தை ஆளுகிறார்
      '41':
        title: சந்ததி பெற யூதாவைத் தாமார் ஏமாற்றுகிறார்
      '42':
        title: யோசேப்பு தன் சகோதரர்களைச் சோதிக்கிறார்
      '43':
        title: பென்யமீனுக்காக யூதா மன்றாடுகிறார்
      '44':
        title: யாக்கோபின் எகிப்துப் பயணம்
      '45':
        title: இஸ்ரவேல் கோசேனில் குடியேறுகிறார்
      '46':
        title: யோசேப்பின் ஆட்சியில் இஸ்ரவேல் செழிக்கிறார்
      '47':
        title: நாணல்களுக்கிடையே மோசே மறைக்கப்படுகிறார்
      '48':
        title: மஸ்தேமா மோசேயைத் தாக்கித் தோல்வியடைகிறான்
      '49':
        title: பஸ்கா ஆட்டுக்குட்டி முழுதாகச் சுடப்படுகிறது
      '50':
        title: ஓய்வுநாளின் இளைப்பாறுதலும் தடைசெய்யப்பட்ட உழைப்பும்
  Psalms of Solomon:
    display_name: சாலொமோனின் சங்கீதங்கள்
    author: ஆசிரியர் பெயர் அறியப்படவில்லை; சாலொமோன் எழுதியதாகப் புனைபெயரில் கூறப்படுகிறது.
    audience: கி.மு. 63-இல் பொம்பேயு எருசலேமைக் கைப்பற்றியதற்குப் பதில்வினையாற்றிய பக்தியுள்ள யூதர்கள்.
    date: ஏறத்தாழ கி.மு. முதலாம் நூற்றாண்டின் நடுப்பகுதி.
    chapters:
      '1':
        title: துன்பத்தில் நான் எழுப்பும் கூக்குரலை ஆண்டவர் கேட்கிறார்
      '2':
        title: பெருமைகொண்ட பாவிகளை கடவுள் விரைவில் நியாயந்தீர்க்கிறார்
      '3':
        title: நீதிமான்கள் ஆண்டவரை இடைவிடாமல் துதிக்கிறார்கள்
      '4':
        title: வெட்கக்கேடான முடிவே வெளிவேடக்காரரின் கதி
      '5':
        title: கடவுள் அனைவருக்கும் நிறைவாக வழங்குகிறார்
      '6':
        title: ஆயத்தமான இதயம் ஆண்டவரை அழைக்கிறது
      '7':
        title: பகைவர்களின் பிடியிலிருந்து ஆண்டவர் காக்கிறார்
      '8':
        title: ஆண்டவர் என்றென்றும் நீதியுடன் நியாயந்தீர்க்கிறார்
      '9':
        title: கடவுளின் இரக்கத்தில் இஸ்ரவேலின் நம்பிக்கை
      '10':
        title: கண்டித்துத் திருத்தப்படுவதை ஏற்றல் தூய்மையைத் தருகிறது
      '11':
        title: தொலைதூர நாடுகளிலிருந்து இஸ்ரவேலைக் கூட்டிச்சேருங்கள்
      '12':
        title: இரகசியமாகப் பரப்பப்படும் பொய்களிலிருந்து என்னை மீட்டருளும்
      '13':
        title: நீதிமான்கள் அழிவிலிருந்து விடுபட்டு வாழ்கிறார்கள்
      '14':
        title: உண்மையுள்ளவர்கள் என்றென்றும் வாழ்வின் மரங்களாய் இருக்கிறார்கள்
      '15':
        title: துன்பத்தில் ஆண்டவரை அழைத்தேன்
      '16':
        title: கடவுளின் இரக்கம் என்னை விழித்தெழச் செய்தது
      '17':
        title: ஆண்டவரே உண்மையான நித்திய அரசர்
      '18':
        title: இரக்கத்தின் நாளுக்காக இஸ்ரவேலைத் தூய்மைப்படுத்தும்
  Shepherd of Hermas:
    display_name: ஹெர்மாசின் மேய்ப்பர்
    author: ரோமில் வாழ்ந்த கிறிஸ்தவரான ஹெர்மாஸ்.
    audience: ரோமிலிருந்த கிறிஸ்தவச் சபை — மனந்திரும்புதலைப் பற்றிய அறநெறி மற்றும் திருவெளிப்பாட்டுத் தீர்க்கதரிசனம்.
    date: ஏறத்தாழ கி.பி. இரண்டாம் நூற்றாண்டின் தொடக்கம் முதல் நடுப்பகுதி வரை.
    chapters:
      '1':
        title: தீய ஆசையை ஹெர்மாஸ் எதிர்கொள்கிறார்
      '2':
        title: ஒரு நூலுடன் பெண்மணி தோன்றுகிறார்
      '3':
        title: குடும்பத்தினர் மனந்திரும்பும்படி தூதர் வலியுறுத்துகிறார்
      '4':
        title: வாசித்தபின் பெண்மணி புறப்படுகிறார்
      '5':
        title: ஆவி மீண்டும் ஹெர்மாசை உயர்த்துகிறது
      '6':
        title: மனந்திரும்பும்படி பிள்ளைகள் எச்சரிக்கப்படுகிறார்கள்
      '7':
        title: ஹெர்மாஸ் மன்னிக்கப்படுகிறார்; பிள்ளைகள் தூய்மையாக்கப்படுகிறார்கள்
      '8':
        title: திருச்சபை முதிய பெண்ணாக வெளிப்படுத்தப்படுகிறது
      '9':
        title: வயலில் பெண்மணியை ஹெர்மாஸ் சந்திக்கிறார்
      '10':
        title: நீரின்மேல் கட்டப்படும் கோபுரம் காட்டப்படுகிறது
      '11':
        title: பெண்மணி தரிசனத்தை விளக்குகிறார்
      '12':
        title: வானதூதர்கள் கோபுரத்தைக் கட்டுகிறார்கள்
      '13':
        title: கற்கள் கோபுரத்தில் மிகச் சரியாகப் பொருந்துகின்றன
      '14':
        title: பாவிகள் கோபுரத்திலிருந்து விலக்கப்படுகிறார்கள்
      '15':
        title: விலக்கப்பட்ட கற்கள் மனந்திரும்பலாம்
      '16':
        title: ஏழு பெண்கள் கோபுரத்தைத் தாங்குகிறார்கள்
      '17':
        title: தரிசனம் 3, பகுதி IX
      '18':
        title: தூய்மையடையும்படி தலைவர்கள் எச்சரிக்கப்படுகிறார்கள்
      '19':
        title: முதலில் மூன்று வடிவங்கள் விளக்கப்படுகின்றன
      '20':
        title: 'இரண்டாம் தரிசனம்: புதுப்பிக்கப்பட்ட ஆவிகள்'
      '21':
        title: மூன்றாம் தரிசனம் புதுப்பித்தலைக் காட்டுகிறது
      '22':
        title: மிருகம் பெரும் உபத்திரவத்தைக் குறிக்கிறது
      '23':
        title: தூய இதயத்துடன் பணியாற்றும்படி கன்னிப்பெண் வலியுறுத்துகிறாள்
      '24':
        title: மிருகத்தின் தலையிலுள்ள நான்கு நிறங்கள்
      '25':
        title: மேய்ப்பர் முதன்மையான காரியங்களை வெளிப்படுத்துகிறார்
      '26':
        title: ஒரே உண்மையான கடவுளை நம்புங்கள்
      '27':
        title: கண்ணியத்தை ஆடையாக அணிந்துகொள்ளுங்கள்
      '28':
        title: உண்மையாக வாழும்படி தூதர் வலியுறுத்துகிறார்
      '29':
        title: கற்புநெறியைக் கண்டிப்பாகக் கடைப்பிடிக்கக் கட்டளை
      '30':
        title: மனந்திரும்புதல் உண்மையான புரிதலைத் தருகிறது
      '31':
        title: மனந்திரும்புதலால் மன்னிப்பு கிடைக்கிறது
      '32':
        title: பொறுமையில் பரிசுத்த ஆவி தடையின்றித் தங்குகிறது
      '33':
        title: நீதியின் பாதையையும் தீமையையும் பகுத்தறியுங்கள்
      '34':
        title: ஆண்டவருக்குப் பயந்து நீதியுடன் வாழுங்கள்
      '35':
        title: நன்மை தீமை குறித்து தூதர் பேசுகிறார்
      '36':
        title: ஐயத்தைப் புறக்கணித்து உண்மையுள்ள கடவுளுக்குப் பணியாற்றுங்கள்
      '37':
        title: துயரம் அழிக்கவும் செய்கிறது, காக்கவும் செய்கிறது
      '38':
        title: துயரம் ஆவியைச் சோர்வடையச் செய்கிறது
      '39':
        title: மகிழ்ச்சியையும் களிப்பையும் ஆடையாக அணிந்துகொள்ளுங்கள்
      '40':
        title: உண்மையுள்ளவர்கள் பொய்த் தீர்க்கதரிசிகளையும் ஆவிகளையும் தவிர்க்கிறார்கள்
      '41':
        title: நல்ல ஆசையின் ஆடை காக்கிறது
      '42':
        title: தீய ஆசையை எதிர்த்து நீதிக்கு ஊழியம் செய்யுங்கள்
      '43':
        title: நீதியான ஊழியத்தை ஹெர்மாஸ் நாடுகிறார்
      '44':
        title: கட்டளைகளைக் கடைப்பிடிக்கத் தீர்மானியுங்கள்; பின்னர் அது எளிதாகும்
      '45':
        title: உண்மையுள்ள ஊழியர்களுக்கு பிசாசு அஞ்சுகிறான்
      '46':
        title: மனந்திரும்பும்படி ஹெர்மாசை வானதூதர் ஊக்குவிக்கிறார்
      '47':
        title: ஹெர்மாஸ் உண்மையான நகரைத் தேர்ந்தெடுக்கிறார்
      '48':
        title: செல்வம் சேவை செய்யும் கடமையைக் கொண்டுவருகிறது
      '49':
        title: பகிரப்படும் செல்வம் நிறைவைக் கொண்டுவருகிறது
      '50':
        title: ஹெர்மாஸ் நோன்பைத் தவறாகப் புரிந்துகொள்கிறார்
      '51':
        title: ஹெர்மாஸ் புரிதலை நாடுகிறார்
      '52':
        title: உவமையின் பொருள் ஹெர்மாஸுக்குக் கற்பிக்கப்படுகிறது
      '53':
        title: ஹெர்மாஸ் உடலையும் ஆவியையும் தூய்மைப்படுத்துகிறார்
      '54':
        title: செழுமையாக வாழும் ஆடுகளை மேய்க்கும் மேய்ப்பர்கள்
      '55':
        title: கண்டிப்பான மேய்ப்பர் சுகபோக ஆடுகளை ஒழுங்குபடுத்துகிறார்
      '56':
        title: அலைந்து திரியும் ஆடுகளை மேய்ப்பர் தண்டிக்கிறார்
      '57':
        title: சுகபோகம் கடும் தண்டனையை வரவழைக்கிறது
      '58':
        title: தண்டனைக் காலத்தைப் பற்றி ஹெர்மாஸ் கேட்கிறார்
      '59':
        title: விடுதலைக்காக ஹெர்மாஸ் மன்றாடுகிறார்
      '60':
        title: மனந்திரும்புதலுக்கு தாழ்மையான ஒழுக்கமும் சகிப்பும் தேவை
      '61':
        title: கனிகொடுப்போருக்குத் தூதன் முடிசூட்டுகிறார்
      '62':
        title: மரம் கடவுளின் சட்டத்தைக் குறிக்கிறது
      '63':
        title: மீண்டும் நடப்பட்ட கோல்களை மேய்ப்பர் பிரிக்கிறார்
  Thunder, Perfect Mind:
    display_name: இடி, நிறைவான மனம்
    author: பெயர் அறியப்படாதவர்.
    audience: கிரேக்க-எகிப்திய ஞான மரபைச் சேர்ந்த அல்லது ஞானவாத வாசகர்கள்; தெய்வீகப் பெண் உருவின் குரலில் அமைந்த, பாலின அடையாளம் கொண்ட சுயவெளிப்பாட்டுக் கவிதை.
    date: கி.பி. 1–2ஆம் நூற்றாண்டைச் சேர்ந்ததாக இருக்கலாம்; நாக் ஹம்மாதியில் (NHC VI,2) பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: தேடுவோரிடம் இடி பேசுகிறது
      '2':
        title: நானே முதலும் கடைசியும் கன்னியும்
      '3':
        title: அறிவும் அறியாமையும் ஒன்றிணைகின்றன
      '4':
        title: அச்சமும் வலிமையும் என்னில் உள்ளன
      '5':
        title: அவள் வெறுக்கப்பட்டாள், நேசிக்கப்பட்டாள், மரணம் என அழைக்கப்பட்டாள்
      '6':
        title: மனமும் இளைப்பாறுதலும் என்னுள் உள்ளன
      '7':
        title: என் வழியாக அமைதி போரை உண்டாக்குகிறது
      '8':
        title: மௌனத்திற்குள் ஒரு குரல் கேட்கிறது
      '9':
        title: நானே நீதியும் ஆதரவாளரும்
      '10':
        title: படைப்பாளரின் பெயரை நான் உரக்கக் கூவுகிறேன்
      '11':
        title: பொறுமையும் மன்னிப்பும் வருகின்றன
  Testament of Reuben:
    display_name: ரூபனின் ஏற்புரை
    author: பெயர் அறியப்படாதவர்; யாக்கோபின் மகன்கள் மரணப்படுக்கையில் கூறிய உரைகளாக வழங்கப்படும் பன்னிரு முற்பிதாக்களின் ஏற்புரைகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: முற்பிதாக்களின் பாவ அறிக்கைகளிலிருந்து நன்னெறியைக் கற்றுக்கொள்ளும் யூத வாசகர்கள் (பிற்காலத்தில் கிறிஸ்தவ வாசகர்களும்).
    date: கிறிஸ்தவத்துக்கு முற்பட்ட யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் தொகுப்பாசிரியர் சேர்க்கைகள் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளைச் சேர்ந்தவை.
    chapters:
      '1':
        title: பாவத்தின் பிடியைக் குறித்து ரூபன் எச்சரிக்கிறார்
      '2':
        title: ஏழு ஆவிகள் மனிதகுலத்தை ஆளுகின்றன
      '3':
        title: ஏழு தவறுகள் இளைஞர்களைக் கட்டிப்போடுகின்றன
      '4':
        title: இச்சையையும் சிலைவழிபாட்டையும் இப்போதே தவிருங்கள்
      '5':
        title: பெண்கள் மயக்கி வலையில் சிக்கவைக்கின்றனர்
      '6':
        title: பெலியாரின் கண்ணிகளிலிருந்து மனங்களைக் காத்துக்கொள்ளுங்கள்
      '7':
        title: ரூபனின் எலும்புகள் தாயகம் திரும்புகின்றன
  Testament of Simeon:
    display_name: சிமியோனின் ஏற்புரை
    author: பெயர் அறியப்படாதவர்; பன்னிரு முற்பிதாக்களின் ஏற்புரைகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள் (பிற்காலத்தில் கிறிஸ்தவ வாசகர்களும்).
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் தொகுப்பாக்கம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளைச் சேர்ந்தது.
    chapters:
      '1':
        title: சாட்சியுரைக்கச் சிமியோன் தன் மகன்களைக் கூட்டுகிறார்
      '2':
        title: பொறாமைச் சதிகளுக்காகச் சிமியோன் மனந்திரும்புகிறார்
      '3':
        title: பொறாமையின் ஆவியோடு சிமியோன் போராடுகிறார்
      '4':
        title: யோசேப்பு இரக்கம் காட்டுகிறார்; சிமியோன் எச்சரிக்கிறார்
      '5':
        title: தூய்மை அழகாக்குகிறது; பாவத்தை விலக்குங்கள்
      '6':
        title: தீமையை விலக்கி பரிசுத்தத்தில் செழியுங்கள்
      '7':
        title: வருங்கால அரசரைப் பற்றிச் சிமியோன் முன்னறிவிக்கிறார்
      '8':
        title: சிமியோன் இறக்கிறார்; எலும்புகள் எப்ரோனுக்குக் கொண்டுவரப்படுகின்றன
      '9':
        title: சிமியோனுக்காகத் துக்கித்து, வெளியேற்றத்திற்காகக் காத்திருங்கள்
  Testament of Levi:
    display_name: லேவியின் ஏற்புரை
    author: பெயர் அறியப்படாதவர்; பன்னிரு முற்பிதாக்களின் ஏற்புரைகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள் (பிற்காலத்தில் கிறிஸ்தவ வாசகர்களும்); குறிப்பாக ஆசாரியப் பணியில் ஆர்வமுள்ள சமூகங்கள்.
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் தொகுப்பாக்கம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளைச் சேர்ந்தது.
    chapters:
      '1':
        title: தன் மரணத்தை லேவி முன்னறிவிக்கிறார்
      '2':
        title: விண்ணுலகின் சீரழிவை லேவி காண்கிறார்
      '3':
        title: கடவுளின் கோபத்தால் விண்ணுலகங்கள் நடுங்குகின்றன
      '4':
        title: பரிசுத்தப் பணிக்காக லேவி தேர்ந்தெடுக்கப்படுகிறார்
      '5':
        title: பழிவாங்குவதற்காகத் தூதன் லேவிக்கு ஆயுதம் அளிக்கிறார்
      '6':
        title: படுகொலையின் கோபத்திற்காக லேவி பரிகாரம் செய்கிறார்
      '7':
        title: லேவியின் வாளால் சீகேம் சாபத்திற்குள்ளாகிறது
      '8':
        title: ஆசாரியப் பணிக்குத் தூதர்கள் லேவியை நியமிக்கின்றனர்
      '9':
        title: சட்டங்களில் லேவிக்கு ஈசாக்கு பயிற்சியளிக்கிறார்
      '10':
        title: வருங்காலத் தீமையைக் குறித்து லேவி எச்சரிக்கிறார்
      '11':
        title: தீர்க்கவாக்குடன் தன் மகன்களுக்கு லேவி பெயரிடுகிறார்
      '12':
        title: தன் வம்சவரலாறுகளை லேவி பதிவுசெய்கிறார்
      '13':
        title: கடவுளின் சட்டத்திற்கு அஞ்சுமாறு லேவி கட்டளையிடுகிறார்
      '14':
        title: ஆசாரியர்கள் தங்கள் அழைப்புக்குத் துரோகம் செய்வார்கள்
      '15':
        title: நியாயத்தீர்ப்பால் ஆலயம் பாழாகிறது
      '16':
        title: கலகத்தின் எழுபது வாரங்கள்
      '17':
        title: தீட்டின் ஏழு யூபிலிகள்
      '18':
        title: நித்திய ஆசாரியர் உலகிற்கு ஒளியூட்டுகிறார்
      '19':
        title: கடவுளின் சட்டத்தைக் கடைப்பிடிக்க மகன்கள் உறுதியளிக்கின்றனர்
  Testament of Judah:
    display_name: யூதாவின் ஏற்புரை
    author: பெயர் அறியப்படாதவர்; பன்னிரு முற்பிதாக்களின் ஏற்புரைகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள் (பிற்காலத்தில் கிறிஸ்தவ வாசகர்களும்).
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் தொகுப்பாக்கம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளைச் சேர்ந்தது.
    chapters:
      '1':
        title: யூதா மகன்களிடம் இறுதி வார்த்தைகளைப் பகிர்கிறார்
      '2':
        title: கடவுள் அளித்த போர்வீர வலிமையை யூதா காட்டுகிறார்
      '3':
        title: கானானிய அரசர்களை யூதா தனியே தோற்கடிக்கிறார்
      '4':
        title: யூதாவைக் காக்கும் தூதனை யாக்கோபு காண்கிறார்
      '5':
        title: அரேத்தாவையும் தப்பூவேயையும் யூதா வெல்கிறார்
      '6':
        title: கடுமையான போரில் யூதா வெல்கிறார்
      '7':
        title: தாக்குதலுக்கு நடுவே யூதா பாய்கிறார்
      '8':
        title: சூவாவை மணந்து யூதா மகன்களைப் பெறுகிறார்
      '9':
        title: ஏசாவின் மாபெரும் படையை யூதா தோற்கடிக்கிறார்
      '10':
        title: தீய மகன்களால் தாமார் துன்புறுகிறார்
      '11':
        title: யூதா தன் மனைவியைச் சபிக்கிறார்; பாவம் செய்கிறார்
      '12':
        title: கோலைக் கொண்டு யூதாவைத் தாமார் ஏமாற்றுகிறார்
      '13':
        title: பாவங்களைக் குறித்து யூதா தன் பிள்ளைகளை எச்சரிக்கிறார்
      '14':
        title: குடிவெறி மற்றும் பாவங்களுக்கு எதிராக யூதா எச்சரிக்கிறார்
      '15':
        title: இச்சையின் பிடியைக் குறித்து யூதா எச்சரிக்கிறார்
      '16':
        title: திராட்சரசத்திற்கு எதிராக யூதா எச்சரிக்கிறார்
      '17':
        title: பேராசையையும் இச்சையையும் குறித்து மகன்களை யூதா எச்சரிக்கிறார்
      '18':
        title: பாலியல் ஒழுக்கக்கேட்டிலிருந்தும் பேராசையிலிருந்தும் காத்துக்கொள்ளுங்கள்
      '19':
        title: பேராசைக்கு எதிராக யூதா எச்சரிக்கிறார்
      '20':
        title: மனித மனச்சாட்சி இரு ஆவிகளுக்கு இடையே சிக்குகிறது
      '21':
        title: வருங்கால அரசர்களைக் குறித்து யூதா எச்சரிக்கிறார்
      '22':
        title: தெய்வீகத் தீர்ப்பு உள்ளார்ந்த மோதலைக் கொண்டுவருகிறது
      '23':
        title: வருங்காலத் தீமையைக் குறித்து யூதா புலம்புகிறார்
      '24':
        title: ஆவியைப் பொழியும் தெய்வீக ஆட்சியாளர்
      '25':
        title: நித்திய வாழ்வுக்காக முற்பிதாக்கள் உயிர்த்தெழுகின்றனர்
      '26':
        title: உண்மையுடன் வாழுமாறு யூதா கட்டளையிடுகிறார்
  Testament of Issachar:
    display_name: இசக்காரின் ஏற்புரை
    author: பெயர் அறியப்படாதவர்; பன்னிரு முற்பிதாக்களின் ஏற்புரைகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள் (பிற்காலத்தில் கிறிஸ்தவ வாசகர்களும்).
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் தொகுப்பாக்கம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளைச் சேர்ந்தது.
    chapters:
      '1':
        title: இசக்கார் தன் பிள்ளைகளுக்கு அறிவுரை கூறுகிறார்
      '2':
        title: மனைவியரின் ஆசிகளைத் தூதன் விளக்குகிறார்
      '3':
        title: தூய அர்ப்பணிப்புடன் இசக்கார் வாழ்கிறார்
      '4':
        title: நேர்மை தீமையிலிருந்து காக்கிறது
      '5':
        title: சட்டத்திற்குக் கீழ்ப்படிந்து எளிய வாழ்வு வாழுங்கள்
      '6':
        title: சந்ததியினர் நாடுகடத்தலை எதிர்கொள்வார்கள்
      '7':
        title: நீதியைப் பற்றி இசக்கார் சிந்திக்கிறார்
  Testament of Zebulun:
    display_name: செபுலோனின் வசீயத்து
    author: ஆசிரியர் பெயர் தெரியவில்லை; பன்னிரு குலத்தந்தையரின் வசீயத்துகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள்; பின்னர் கிறிஸ்தவ வாசகர்கள்.
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் திருத்தம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளில் செய்யப்பட்டது.
    chapters:
      '1':
        title: தீமையைக் குறித்து மகன்களைக் குலத்தந்தை எச்சரிக்கிறார்
      '2':
        title: மௌனமான குற்றத்திற்காகச் செபுலோன் அழுகிறார்
      '3':
        title: செபுலோன் வேண்டுகிறார்; காவலர்கள் குழியைக் காக்கிறார்கள்
      '4':
        title: இரக்கமுள்ள செபுலோன் குழியைக் காக்கிறார்
      '5':
        title: இரக்கம் செபுலோனின் குடும்பத்தைப் பாதுகாக்கிறது
      '6':
        title: படகைக் கண்டுபிடித்தவர் மிகுதியான பிடிப்பைப் பகிர்கிறார்
      '7':
        title: கபடமற்ற தாராள மனதைச் செபுலோன் வலியுறுத்துகிறார்
      '8':
        title: இரக்கத்தைச் செபுலோன் கற்பிக்கிறார்
      '9':
        title: சந்ததியினரைச் செபுலோன் எச்சரிக்கிறார்
      '10':
        title: வருங்கால மீட்பைச் செபுலோன் முன்னறிவிக்கிறார்
  Testament of Dan:
    display_name: தாணின் வசீயத்து
    author: ஆசிரியர் பெயர் தெரியவில்லை; பன்னிரு குலத்தந்தையரின் வசீயத்துகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள்; பின்னர் கிறிஸ்தவ வாசகர்கள்.
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் திருத்தம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளில் செய்யப்பட்டது.
    chapters:
      '1':
        title: கடந்தகாலப் பொறாமையைத் தாண் ஒப்புக்கொள்கிறார்
      '2':
        title: கோபத்தின் பிடியைக் குறித்துத் தாண் எச்சரிக்கிறார்
      '3':
        title: கண்ணை மறைக்கும் கோபத்தை உண்மை வெல்கிறது
      '4':
        title: கோபம் ஆன்மாவையும் மனதையும் திரிக்கிறது
      '5':
        title: மனந்திரும்புதல் நித்திய அமைதியைத் தருகிறது
      '6':
        title: கடவுளுக்கு அஞ்சுங்கள்; சாத்தானின் பொய்களை மறுத்துவிடுங்கள்
      '7':
        title: தாணின் எலும்புகள் முன்னோர்களுடன் இளைப்பாறுகின்றன
  Testament of Naphtali:
    display_name: நப்தலியின் வசீயத்து
    author: ஆசிரியர் பெயர் தெரியவில்லை; பன்னிரு குலத்தந்தையரின் வசீயத்துகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள்; பின்னர் கிறிஸ்தவ வாசகர்கள்.
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் திருத்தம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளில் செய்யப்பட்டது.
    chapters:
      '1':
        title: நப்தலி தம் மகன்களை ஆசீர்வதிக்கிறார்
      '2':
        title: கடவுள் ஒவ்வோர் ஆன்மாவையும் நிறைவாக வடிவமைக்கிறார்
      '3':
        title: தீய ஆவிகளிடமிருந்து இதயங்களைக் காத்துக்கொள்ளுங்கள்
      '4':
        title: கடவுளின் மீட்பால் நாடுகடத்தல் முடிவடைகிறது
      '5':
        title: லேவி, யூதா, யோசேப்பு உயர்ந்த நிலையை அடைகிறார்கள்
      '6':
        title: புயல் யாக்கோபின் குடும்பத்தைச் சிதறடிக்கிறது
      '7':
        title: இருண்ட உண்மைகளை நப்தலி மறைக்கிறார்
      '8':
        title: கடவுளைக் கனப்படுத்த ஞானத்தை நாடுங்கள்
      '9':
        title: நப்தலியின் எலும்புகள் தாயகம் திரும்புகின்றன
  Testament of Gad:
    display_name: காத்தின் வசீயத்து
    author: ஆசிரியர் பெயர் தெரியவில்லை; பன்னிரு குலத்தந்தையரின் வசீயத்துகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள்; பின்னர் கிறிஸ்தவ வாசகர்கள்.
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் திருத்தம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளில் செய்யப்பட்டது.
    chapters:
      '1':
        title: வெறுப்பின் நஞ்சைக் குறித்துக் காத் எச்சரிக்கிறார்
      '2':
        title: யோசேப்புக்குச் செய்த துரோகத்தைக் காத் ஒப்புக்கொள்கிறார்
      '3':
        title: ஆன்மாவை விழுங்கும் வெறுப்பைத் தவிருங்கள்
      '4':
        title: வெறுப்பு வாழ்வை அல்ல, மரணத்தையே கொண்டுவருகிறது
      '5':
        title: மனந்திரும்புதல் தெய்வீக ஒளியைத் தருகிறது
      '6':
        title: இதயத்திலிருந்து மன்னியுங்கள்; அமைதி பெறுங்கள்
      '7':
        title: செழிப்பான பகைவர்களுக்காக வேண்டுங்கள்
      '8':
        title: போதனைகளை வருங்கால மகன்களிடம் ஒப்படையுங்கள்
  Testament of Asher:
    display_name: ஆசேரின் வசீயத்து
    author: ஆசிரியர் பெயர் தெரியவில்லை; பன்னிரு குலத்தந்தையரின் வசீயத்துகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள்; பின்னர் கிறிஸ்தவ வாசகர்கள்.
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் திருத்தம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளில் செய்யப்பட்டது.
    chapters:
      '1':
        title: பிள்ளைகள் நீதியாக வாழ ஆசேர் அறிவுறுத்துகிறார்
      '2':
        title: வேடமிட்ட தீமை முற்றிலும் கண்டிக்கப்படுகிறது
      '3':
        title: இருமன வாழ்க்கையைத் தவிர்க்க ஆசேர் கட்டளையிடுகிறார்
      '4':
        title: இறைப்பற்றுள்ளோர் தீமையை எதிர்த்து நிற்கிறார்கள்
      '5':
        title: இருவகை எதார்த்தத்தை ஆசேர் கற்பிக்கிறார்
      '6':
        title: ஒரே நோக்கத்துடன் கட்டளைகளைப் பின்பற்றுங்கள்
      '7':
        title: தீர்ப்பின் மத்தியிலும் நம்பிக்கையைத் தீர்க்கதரிசனம் வாக்களிக்கிறது
      '8':
        title: ஆசேர் எபிரோனில் அமைதியாக அடக்கம் செய்யப்படுகிறார்
  Testament of Joseph:
    display_name: யோசேப்பின் வசீயத்து
    author: ஆசிரியர் பெயர் தெரியவில்லை; பன்னிரு குலத்தந்தையரின் வசீயத்துகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள்; பின்னர் கிறிஸ்தவ வாசகர்கள்.
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் திருத்தம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளில் செய்யப்பட்டது.
    chapters:
      '1':
        title: யோசேப்பு தமது இறுதி வசீயத்துகளைப் பகிர்கிறார்
      '2':
        title: யோசேப்பு நாள்தோறும் சோதனையை எதிர்க்கிறார்
      '3':
        title: ஏழு ஆண்டுகள் யோசேப்பு வேண்டுதல் செய்கிறார்
      '4':
        title: பொய் வழிபாட்டுக்கான பேரங்களை யோசேப்பு மறுக்கிறார்
      '5':
        title: கொலைநோக்கமுள்ள மயக்குதலுக்கு யோசேப்பு இணங்க மறுக்கிறார்
      '6':
        title: நஞ்சூட்டப்பட்ட உணவின் சலுகையை யோசேப்பு மறுக்கிறார்
      '7':
        title: கடவுளின் தூதரை நம்பி யோசேப்பு உண்கிறார்
      '8':
        title: பெண்ணிடமிருந்து ஆடையின்றி யோசேப்பு தப்புகிறார்
      '9':
        title: சங்கிலிகளில் நன்றியுடன் யோசேப்பு பாடுகிறார்
      '10':
        title: சகிப்பையும் தூய்மையையும் யோசேப்பு வலியுறுத்துகிறார்
      '11':
        title: நாடுகடத்தப்பட்டபோதும் சகோதரர்களை யோசேப்பு கனப்படுத்துகிறார்
      '12':
        title: எகிப்தில் யோசேப்பு தயவு பெறுகிறார்
      '13':
        title: பொய் சொன்னதாக யோசேப்பு குற்றச்சாட்டுகளை எதிர்கொள்கிறார்
      '14':
        title: தமது சாட்சியத்தை மாற்ற யோசேப்பு மறுக்கிறார்
      '15':
        title: சகோதரர்களை அவமானத்திலிருந்து யோசேப்பு காக்கிறார்
      '16':
        title: வஞ்சகத்தைப் பற்றி யோசேப்பு மௌனமாக இருக்கிறார்
      '17':
        title: யோசேப்பு அன்புகூர்ந்து குற்றங்களை மறைக்கிறார்
      '18':
        title: மனத்தாழ்மையையும் ஆசீர்வாதத்தையும் யோசேப்பு கற்பிக்கிறார்
      '19':
        title: வருங்கால அரசைக் குறித்த தரிசனத்தை யோசேப்பு வெளிப்படுத்துகிறார்
      '20':
        title: தமது எலும்புகளை எடுத்துச் செல்ல யோசேப்பு கட்டளையிடுகிறார்
  Testament of Benjamin:
    display_name: பென்யமீனின் வசீயத்து
    author: ஆசிரியர் பெயர் தெரியவில்லை; பன்னிரு குலத்தந்தையரின் வசீயத்துகள் என்னும் தொகுப்பின் ஒரு பகுதி.
    audience: யூத வாசகர்கள்; பின்னர் கிறிஸ்தவ வாசகர்கள்.
    date: யூத மூலப்பகுதி ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டைச் சேர்ந்தது; கிறிஸ்தவத் திருத்தம் ஏறத்தாழ கி.பி. 1–2ஆம் நூற்றாண்டுகளில் செய்யப்பட்டது.
    chapters:
      '1':
        title: இரண்டு மகன்களுக்காகப் பென்யமீன் வேண்டுகிறார்
      '2':
        title: தமக்குச் செய்த துரோகத்தைச் சகோதரனிடமிருந்து யோசேப்பு மறைக்கிறார்
      '3':
        title: யோசேப்பின் இரக்கத்தைப் பின்பற்றுமாறு பென்யமீன் வலியுறுத்துகிறார்
      '4':
        title: நீதிமான்கள் நன்மையால் தீமையை வெல்கிறார்கள்
      '5':
        title: நன்மை செய்வது இருளை அகற்றுகிறது
      '6':
        title: வழிநடத்தும் தூதரால் அமைதி வெற்றி கொள்கிறது
      '7':
        title: பெலியாரின் வஞ்சகச் செயல்களைத் தவிருங்கள்
      '8':
        title: மீட்பரின் மகிமையைப் பென்யமீன் முன்னறிவிக்கிறார்
      '9':
        title: ஆலயம் புதுப்பிக்கப்படுவதைத் தீர்க்கதரிசி முன்னறிவிக்கிறார்
      '10':
        title: இறுதி உயிர்த்தெழுதலுக்காக உண்மையைக் கடைப்பிடியுங்கள்
      '11':
        title: உண்மையுள்ள ஊழியரின் எழுச்சியை ஓநாய் முன்னறிவிக்கிறது
      '12':
        title: பென்யமீன் இறந்து, எபிரோனில் அடக்கம் செய்யக் கட்டளையிடுகிறார்
  Gospel of Philip:
    display_name: பிலிப்பின் நற்செய்தி
    author: ஆசிரியர் பெயர் தெரியவில்லை. கையெழுத்துப் பிரதியின் இறுதிக் குறிப்பில் இந்தத் தலைப்பு காணப்படுகிறது; ஆனால் பிலிப்பை இதன் ஆசிரியராக இந்நூல் குறிப்பிடவில்லை. எஞ்சியிருக்கும் ஒரே பிரதி நாக் ஹம்மாடி சுவடித்தொகுதி II,3-இன் காப்டிக் மொழி உரையாகும்.
    audience: வாலென்டீனிய பாணியிலான திருவருட்சாதனப் போதனைகளை—குறிப்பாகத் திருமுழுக்கு, திருத்தைலப் பூசுதல், நற்கருணை, மீட்பு, உயிர்த்தெழுதல் மற்றும் மணவறை உருவகங்களை—அறிந்திருந்த ஓர் ஆரம்பகாலக் கிறிஸ்தவச் சமூகம்.
    date: பொதுவாகக் கி.பி. 2ஆம் நூற்றாண்டின் பிற்பகுதி அல்லது 3ஆம் நூற்றாண்டின் முற்பகுதியைச் சேர்ந்ததாகக் காலம் கணிக்கப்படுகிறது; முந்தைய கிரேக்க வடிவிலிருந்து மொழிபெயர்க்கப்பட்ட, 4ஆம் நூற்றாண்டைச் சேர்ந்த காப்டிக் கையெழுத்துப் பிரதியில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: கிறிஸ்து முழுமையான தெய்வீகக் குடும்பத்தைக் கொண்டுவருகிறார்
      '2':
        title: நம்பிக்கை குளிர்காலத்தின் வாக்குறுதியை விதைக்கிறது
      '3':
        title: சொற்கள் உண்மையான ஆன்மீக எதார்த்தத்தை வெளிப்படுத்துகின்றன
      '4':
        title: ஆன்மீகச் சிறையிருப்பிலிருந்து கிறிஸ்து மீட்கிறார்
      '5':
        title: இயேசு பூமிக்குரிய தந்தையை வேறுபடுத்திக் காட்டுகிறார்
      '6':
        title: மறைந்திருக்கும் தெய்வீக எதார்த்தத்தை இயேசு வெளிப்படுத்துகிறார்
      '7':
        title: உயிர்த்தெழுதல் உடல்சார்ந்த வாழ்வை மாற்றியமைக்கிறது
      '8':
        title: இயேசு தம்மைப் படிப்படியாக வெளிப்படுத்துகிறார்
      '9':
        title: ஆன்மீகப் பிள்ளைகள் நிலையான வாழ்வைப் பெருக்குகிறார்கள்
      '10':
        title: ஆன்மீக நிறைவுடையோர் அனைவருக்கும் சேவை செய்கிறார்கள்
      '11':
        title: திருமுழுக்கு அழியாத வாழ்வுக்கு மாற்றுகிறது
      '12':
        title: திருமண மறைபொருள் புனித ஒற்றுமையை மீட்டமைக்கிறது
      '13':
        title: தெய்வீக உண்மை ஆன்மீக மறுபிறப்பைக் கொண்டுவருகிறது
      '14':
        title: கிறிஸ்து ஒற்றுமையையும் வாழ்வையும் மீட்டமைக்கிறார்
      '15':
        title: உயிர்த்தெழுதல் இப்போதே உண்மையான வாழ்வை விழிப்புறச் செய்கிறது
      '16':
        title: தெய்வீக அருளால் நம்பிக்கை முதிர்ச்சியடைகிறது
      '17':
        title: இயேசு தீமையை வெளிப்படுத்தி அகற்றுகிறார்
      '18':
        title: புனித ஒன்றிணைவு நித்திய ஒளியைக் கொண்டுவருகிறது
  Gospel of Mary:
    display_name: மரியாவின் நற்செய்தி
    author: ஆசிரியர் பெயர் தெரியவில்லை. இந்தப் படைப்பு, இயேசுவின் வெளிப்பாட்டைப் பெற்றவராகவும் அதற்கு விளக்கம் அளிப்பவராகவும் மரியாவைச் சித்தரிக்கிறது; ஆனால் எஞ்சியுள்ள இந்த நற்செய்தியை மரியா எழுதினார் என்று இது கூறவில்லை.
    audience: வெளிப்பாடு, ஆன்மிக உயர்வு, திருத்தூதர்களின் அதிகாரம், இயேசுவின் சீடர்களிடையே மரியாவின் போதனைக்குள்ள நியாயத்தன்மை ஆகியவற்றைக் குறித்து ஆராய்ந்த தொடக்ககாலக் கிறிஸ்தவ வாசகர்கள்.
    date: பொதுவாக கி.பி. 2ஆம் நூற்றாண்டைச் சேர்ந்ததாகக் காலம் குறிக்கப்படுகிறது; கி.பி. 3ஆம் நூற்றாண்டைச் சேர்ந்த கிரேக்கத் துண்டுகள் எஞ்சியுள்ளன; முதன்மையான காப்டிக் சான்று, 5ஆம் நூற்றாண்டைச் சேர்ந்த பெர்லின் கோடெக்ஸ் 8502-இல் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: மீட்பர் பாவத்திற்கு எதிராகப் போதிக்கிறார்
      '2':
        title: இயேசு சீடர்களை சமாதானத்துடன் அனுப்புகிறார்
      '3':
        title: மரியா போதனைகளால் ஆறுதலளிக்கிறார்
      '4':
        title: ஆன்மா மறதியை வெல்கிறது
      '5':
        title: நற்செய்தியை அறிவிக்க லேவி வலியுறுத்துகிறார்
  Treatise on the Resurrection:
    display_name: உயிர்த்தெழுதல் பற்றிய ஆய்வுரை
    author: ஆசிரியர் பெயர் தெரியவில்லை. ரெகினோஸ் என்ற மாணவருக்கு ஆசிரியர் ஒருவர் எழுதிய கடிதமாக இப்பணி வடிவமைக்கப்பட்டுள்ளது; அந்த ஆசிரியரையோ ரெகினோஸையோ உறுதியாக அடையாளம் காண முடியவில்லை.
    audience: உயிர்த்தெழுதலைப் பற்றிய போதனையை நாடிய கிறிஸ்தவர்கள்; குறிப்பாக உடல்சார்ந்த, ஆன்மிகமான, நிகழ்காலத்திலேயே உயிர்த்தெழுதல் வாழ்வில் பங்கேற்கும் புரிதல்களை ஆராய்ந்த வாசகர்கள்.
    date: பொதுவாக கி.பி. 2ஆம் நூற்றாண்டின் பிற்பகுதியைச் சேர்ந்ததாகக் கருதப்படுகிறது (பெரும்பாலும் ஏறத்தாழ கி.பி. 170–200); இதற்கு முந்தைய கிரேக்கப் படைப்பின் 4ஆம் நூற்றாண்டுக் காப்டிக் பிரதியில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: கிறிஸ்து உண்மையான நிறைவைத் தருகிறார்
      '2':
        title: கிறிஸ்து மரணத்தின் பிடியை வெல்கிறார்
      '3':
        title: உயிர்த்தெழுதல் மெய்நிலையை மாற்றுகிறது
      '4':
        title: நம்பிக்கையாளர்கள் கிறிஸ்துவின் உயிர்த்தெழுதலில் பங்குபெறுகின்றனர்
      '5':
        title: கிறிஸ்துவின் உயிர்த்தெழுதலில் நம்பிக்கை
      '6':
        title: மீட்பின் ஞானம் என்றென்றும் நிலைக்கிறது
      '7':
        title: அருள் நித்திய வாழ்வைக் காக்கிறது
      '8':
        title: உயிர்த்தெழுதல் உண்மையான வாழ்வை வெளிப்படுத்துகிறது
      '9':
        title: உயிர்த்தெழுதல் சிதைவை வெல்கிறது
      '10':
        title: உயிர்த்தெழுதலுக்காகப் பிளவிலிருந்து விடுபடுங்கள்
      '11':
        title: பிறரின் நன்மைக்காகப் போதனையைப் பகிருங்கள்
  Dialogue of the Savior:
    display_name: மீட்பரின் உரையாடல்
    author: ஆசிரியர் பெயர் தெரியவில்லை. யூதா, மத்தேயு, மரியா ஆகியோருடன் நடைபெறும் உரையாடலில் வெளிப்பாட்டு போதனைகளை இயேசு கூறுவதாக இப்பணி அமைக்கிறது; ஆனால் இதைத் தொகுத்தவர் யார் என்று குறிப்பிடவில்லை.
    audience: தனிப்பட்ட வெளிப்பாடு, சீடத்துவம், தன்னறிவு, செபம், மீட்புக்கான துறவறத் தயாரிப்பு ஆகியவற்றில் ஆர்வம் கொண்ட தொடக்ககாலக் கிறிஸ்தவக் குழு.
    date: பொதுவாக கி.பி. 2ஆம் நூற்றாண்டைச் சேர்ந்ததாகக் கருதப்படுகிறது; எனினும் இதன் படைப்பாக்க அடுக்குகளும் துல்லியமான காலமும் தொடர்ந்து விவாதிக்கப்படுகின்றன. இது 4ஆம் நூற்றாண்டுக் காப்டிக் கையெழுத்துப் பிரதியில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: இயேசு உண்மையான இளைப்பாறுதலைப் போதிக்கிறார்
      '2':
        title: கடவுள் நித்திய வாழ்வுக்கு வழிநடத்துகிறார்
      '3':
        title: மகிழ்ச்சியுடன் ஆபத்தைக் கடந்து செல்லுங்கள்
      '4':
        title: உள்ளிருக்கும் ஆன்மாவை ஒழுங்குபடுத்துங்கள்
      '5':
        title: துயரத்திற்கு அப்பால் உண்மையைத் தேடுங்கள்
      '6':
        title: உள்ளார்ந்த இதயத்தைத் தூய்மைப்படுத்துங்கள்
      '7':
        title: விண்ணக நன்மையைப் பிரதிபலியுங்கள்
      '8':
        title: இறை வல்லமை அனைத்தையும் தாங்குகிறது
      '9':
        title: முதலில் இறை ஆதாரத்தை அறியுங்கள்
      '10':
        title: நித்திய கடவுளை என்றென்றும் காணுங்கள்
      '11':
        title: இறை ஒளியை அணிந்துகொள்ளுங்கள்
      '12':
        title: கிறிஸ்துவின் ஆன்மிகச் செல்வங்களை வெளிப்படுத்துங்கள்
      '13':
        title: அன்பால் மோதலை வெல்லுங்கள்
      '14':
        title: உண்மையான செபம் அப்பால் எழுகிறது
      '15':
        title: அக வாழ்வைக் கவனமாகக் காத்திடுங்கள்
  Exegesis on the Soul:
    display_name: ஆன்மா பற்றிய விளக்கவுரை
    author: ஆசிரியர் பெயர் தெரியவில்லை. ஆன்மாவின் வீழ்ச்சி, மனந்திரும்புதல், மீட்சி ஆகியவற்றின் உருவகமாக விவிலிய மற்றும் கிரேக்க இலக்கியப் படிமங்களை மறுவாசிப்பு செய்யும் கிறிஸ்தவ மறையுரையாளர் ஒருவர் இதன் ஆசிரியர்.
    audience: திருமறையையும் அறநெறி அறிவுரைகளையும் நன்கு அறிந்த, ஒழுங்கற்ற ஆசைகளிலிருந்து மனந்திரும்பி இறைமையுடன் மீண்டும் ஒன்றிணைய அழைக்கப்பட்ட கிறிஸ்தவர்கள்.
    date: பொதுவாக கி.பி. 2ஆம் நூற்றாண்டின் பிற்பகுதி அல்லது 3ஆம் நூற்றாண்டின் முற்பகுதியைச் சேர்ந்ததாகக் காலம் குறிக்கப்படுகிறது; கிரேக்க மொழியிலிருந்து மொழிபெயர்க்கப்பட்ட 4ஆம் நூற்றாண்டுக் காப்டிக் பிரதியில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: ஆன்மா இரக்கத்தை நாடி மனந்திரும்புகிறது
      '2':
        title: ஆன்மா ஆசைகளால் கடவுளுக்குத் துரோகம் செய்கிறது
      '3':
        title: கடவுள் திருமுழுக்கின் மூலம் ஆன்மாவைத் தூய்மைப்படுத்துகிறார்
      '4':
        title: ஆன்மா இறை ஆதாரத்துடன் மீண்டும் ஒன்றிணைகிறது
      '5':
        title: மறைந்திருக்கும் கடவுளிடம் உண்மையுடன் செபியுங்கள்
      '6':
        title: ஆன்மா ஆசையிலிருந்து தன் இல்லத்திற்குத் திரும்புகிறது
      '7':
        title: கடவுள் உண்மையான புலம்பலைக் கேட்கிறார்
  Book of Thomas the Contender:
    display_name: போராடும் தோமாவின் நூல்
    author: ஆசிரியர் பெயர் தெரியவில்லை. இதன் இறுதித் தலைப்பு இப்பணியை யூதா தோமாவுடன் தொடர்புபடுத்தி, மத்தையாஸைப் பதிவாளராகக் குறிப்பிடுகிறது; ஆனால் இவை உறுதிசெய்யக்கூடிய ஆசிரியர் உரிமைக் கூற்றுகள் அல்ல, இலக்கிய மரபுச் சாற்றுதல்கள் மட்டுமே.
    audience: தன்னறிவை நாடவும், உடல்சார்ந்த இச்சைகளை எதிர்க்கவும், தோமாவுக்கு இயேசு தனிப்பட்ட முறையில் அளித்த போதனையைப் புரிந்துகொள்ளவும் வலியுறுத்தப்பட்ட, துறவற நாட்டமுள்ள கிறிஸ்தவர்கள்.
    date: பெரும்பாலும் கி.பி. 2ஆம் நூற்றாண்டின் பிற்பகுதி அல்லது 3ஆம் நூற்றாண்டின் முற்பகுதியைச் சேர்ந்ததாகக் கருதப்படுகிறது; சிரியக் கிறிஸ்தவச் சூழலில் தோன்றியிருக்கலாம். இது 4ஆம் நூற்றாண்டுக் காப்டிக் கையெழுத்துப் பிரதியில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: மத்தையாஸ் தோமாவின் போதனைகளைப் பதிவுசெய்கிறார்
      '2':
        title: கிறிஸ்து தன்னை ஆராயுமாறு வலியுறுத்துகிறார்
      '3':
        title: இயேசு கண்ணுக்குப் புலப்படாத உண்மையைப் போதிக்கிறார்
      '4':
        title: ஆசையின் பிடியைக் குறித்து மீட்பர் எச்சரிக்கிறார்
      '5':
        title: பாவிகளைப் பற்றித் தோமா கேட்கிறார்
      '6':
        title: ஆன்மிக இருளைக் குறித்து மீட்பர் எச்சரிக்கிறார்
      '7':
        title: விழிப்புடன் இருக்கும் புனிதர்கள் பேறுபெற்றோர்
  Tripartite Tractate:
    display_name: முப்பகுதி ஆய்வுரை
    author: ஆசிரியர் பெயர் தெரியவில்லை. ஆசிரியர் உயர்கல்வி பெற்ற வாலென்டினியக் கிறிஸ்தவ இறையியலாளர்; பெயர் அறியப்பட்ட எந்தப் போதகருடனும் அவரை உறுதியாக அடையாளப்படுத்த முடியாது.
    audience: கடவுள், ஏயோன்கள், படைப்பு, கிறிஸ்து, திருச்சபை, மீட்பு, இறுதி மீட்சி ஆகியவற்றைப் பற்றிய விரிவான போதனையைப் பெற்ற வாலென்டினியக் கிறிஸ்தவச் சமூகம்.
    date: பொதுவாக கி.பி. 3ஆம் நூற்றாண்டைச் சேர்ந்ததாகக் காலம் குறிக்கப்படுகிறது; சிலர் அதன் பிற்பகுதியை ஆதரிக்கின்றனர். இது 4ஆம் நூற்றாண்டைச் சேர்ந்த யுங் கோடெக்ஸில் காப்டிக் மொழியில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: கடவுள் எந்த முயற்சியுமின்றி அனைத்தையும் படைக்கிறார்
      '2':
        title: மகன் கடவுளின் புரிந்துகொள்ள முடியாத மகிமையை வெளிப்படுத்துகிறார்
      '3':
        title: சமூகம் இறைவனின் நித்திய வாழ்வில் பங்குபெறுகிறது
      '4':
        title: கடவுள் உயிர்களுக்கு ஒளியூட்டி விழிப்பூட்டுகிறார்
      '5':
        title: கடவுள் நிறைவான மகன் வழியாக வெளிப்படுத்துகிறார்
      '6':
        title: நித்திய உயிர்கள் கடவுளின் இயல்பைப் பிரதிபலிக்கின்றன
      '7':
        title: மகன் மறைந்திருக்கும் கடவுளை வெளிப்படுத்துகிறார்
      '8':
        title: கடவுள் நித்திய உயிர்களுக்கு ஆற்றலளிக்கிறார்
      '9':
        title: கண்ணுக்குப் புலப்படாத நறுமணத்தால் கடவுள் ஈர்க்கிறார்
      '10':
        title: கடவுள் எல்லா உயிர்களினூடும் பாய்கிறார்
      '11':
        title: வீழ்ந்த உயிர் நிறைவைத் தேடித் தோல்வியடைகிறது
      '12':
        title: வார்த்தை மனந்திரும்பி ஒற்றுமையைக் கொண்டுவருகிறது
      '13':
        title: பெருமை ஆவிகளிடையே மோதலை உருவாக்குகிறது
      '14':
        title: மீட்பர் விடுதலையின் மூலம் அனைத்தையும் மீட்டமைக்கிறார்
      '15':
        title: அறிவின் செய்தி உயிரை வலுப்படுத்துகிறது
      '16':
        title: வார்த்தை படைப்புக்காகச் செபிக்கிறது
      '17':
        title: வார்த்தை மீட்பின் உலகை நிறுவுகிறது
      '18':
        title: வார்த்தை தீர்ப்புக்கும் மீட்புக்கும் ஆயத்தம் செய்கிறது
      '19':
        title: எதிரெதிர் குழுக்கள் ஒழுங்கமைந்த நிலைகளைப் பெறுகின்றன
      '20':
        title: உயரிய ஆட்சியாளர் கீழ் உலகங்களை ஒழுங்கமைக்கிறார்
      '21':
        title: மரணநிலையாலும் துன்பத்தாலும் மனிதகுலம் கற்றுக்கொள்கிறது
      '22':
        title: ஆன்மிக வல்லமைகள் ஒழுங்கையும் ஒழுங்கின்மையையும் கலக்கின்றன
      '23':
        title: மீட்பரைப் பற்றிய இறைவாக்கினர்களின் காட்சிகள்
      '24':
        title: மீட்பர் நித்திய விடுதலையைக் கொண்டுவருகிறார்
      '25':
        title: மீட்பர் மனிதகுலத்தைப் பிரிக்கிறார்
      '26':
        title: கிறிஸ்து படைப்பு அனைத்தையும் ஒன்றிணைக்கிறார்
      '27':
        title: கடவுளைப் பற்றிய அறிவு படைப்பை என்றென்றும் மீட்டமைக்கிறது
      '28':
        title: உள்ளார்ந்த நம்பிக்கையின் மூலம் விடுதலை
      '29':
        title: கிறிஸ்துவால் வழிநடத்தப்படும் ஊழியர்கள்
      '30':
        title: கிறிஸ்துவின் ஒளி நித்திய மீட்சியை வெளிப்படுத்துகிறது
  Apocryphon of John:
    display_name: யோவானின் மறைநூல்
    author: ஆசிரியர் பெயர் தெரியவில்லை. உயிர்த்தெழுந்த இயேசு செபெதேயுவின் மகன் யோவானுக்கு அளித்த வெளிப்பாடாக இப்பணி புனைபெயரில் வழங்கப்படுகிறது; இது ஒன்றுக்கு மேற்பட்ட பண்டைய பதிப்புவடிவங்களில் எஞ்சியுள்ளது.
    audience: இறை உலகம், படைப்பு, மனித அடையாளம், பகைமை கொண்ட ஆட்சியாளர்களிடமிருந்து விடுதலை ஆகியவற்றைப் பற்றிய விளக்கத்தை நாடிய சேத்திய மரபைச் சேர்ந்த அல்லது அதனுடன் நெருங்கிய தொடர்புடைய வெளிப்பாட்டு மரபிலிருந்த கிறிஸ்தவர்கள்.
    date: இதன் தொடக்ககால வடிவம் கி.பி. 2ஆம் நூற்றாண்டில் புழக்கத்தில் இருந்திருக்கலாம்; குறுகிய மற்றும் நீண்ட பதிப்புவடிவங்களைப் பாதுகாக்கும் எஞ்சியுள்ள காப்டிக் சான்றுகள் கி.பி. 4ஆம் மற்றும் 5ஆம் நூற்றாண்டுகளைச் சேர்ந்தவை.
    chapters:
      '1':
        title: யோவான் இயேசுவின் ஞானத்தை நாடுகிறார்
      '2':
        title: விண்ணகம் இறை வடிவங்களை வெளிப்படுத்துகிறது
      '3':
        title: மறைந்திருக்கும் கடவுளே உயரிய மெய்நிலை
      '4':
        title: இறை முன்னறிவு ஒளிமயமாகப் பிரகாசிக்கிறது
      '5':
        title: பார்பெலோ வல்லமைகளைக் கேட்கிறார்
      '6':
        title: கிறிஸ்து இறைப் பராமரிப்பிலிருந்து வருகிறார்
      '7':
        title: நித்திய வாழ்வு ஆவியைப் போற்றுகிறது
      '8':
        title: ஆதாம் மறைந்திருக்கும் கடவுளைப் போற்றினார்
      '9':
        title: சோபியா முழுமையற்ற உயிரைப் படைக்கிறார்
      '10':
        title: பெருமைகொண்ட ஆட்சியாளர் உலகங்களை உருவாக்குகிறார்
      '11':
        title: அறியாமையுள்ள ஆட்சியாளர் ஒழுங்கைப் பிரதியெடுக்கிறார்
      '12':
        title: ஞானம் இருளில் மனந்திரும்புகிறது
      '13':
        title: அதிகாரங்கள் மனித உடலை உருவாக்குகின்றன
      '14':
        title: கடவுள் ஆதாமுக்குள் ஒளியை மறைக்கிறார்
      '15':
        title: ஆதாம் மறக்கும்படி ஆட்சியாளர்கள் சோதிக்கின்றனர்
      '16':
        title: இறை ஒளி மனிதகுலத்தை விழிப்பூட்டுகிறது
      '17':
        title: இறை பராமரிப்பு மனங்களை விழிப்பூட்டுகிறது
      '18':
        title: ஆன்மாக்கள் தீய போராட்டங்களிலிருந்து விலகுகின்றன
      '19':
        title: இரக்கமுள்ள ஆவி மக்களை விழிப்பூட்டுகிறது
      '20':
        title: ஆன்மாக்களை மீட்க ஒளி இறங்குகிறது
      '21':
        title: மீட்பர் மறைவான ஞானத்தை ஒப்படைக்கிறார்
  Hypostasis of the Archons:
    display_name: ஆர்கோன்களின் இயல்பு
    author: ஆசிரியர் பெயர் தெரியவில்லை. ஆர்கோன்களைப் பற்றிய ஒரு வெளிப்பாட்டு புராணக்கதையின் வழியாக ஆதியாகமத்தை ஆசிரியர் விளக்குகிறார்; இந்நூலைப் பெயர் அறியப்பட்ட குறிப்பிட்ட போதகர் ஒருவருடையது என்று உறுதியாகக் கூற முடியாது.
    audience: அறியாமையிலுள்ள அண்ட ஆட்சியாளர்கள், தெய்வீக ஞானம், மனிதகுலத்தின் ஆவிக்குரிய தோற்றம் ஆகியவற்றுக்கு இடையிலான மோதலாக ஆதியாகமத்தை வாசித்த சேத்திய அல்லது அதனுடன் தொடர்புடைய சூழலைச் சேர்ந்த கிறிஸ்தவர்கள்.
    date: பொதுவாகக் கி.பி. 3ஆம் நூற்றாண்டைச் சேர்ந்ததாகக் கருதப்படுகிறது; நாக் ஹம்மாடி கோடெக்ஸ் II-இல் உள்ள கி.பி. 4ஆம் நூற்றாண்டைச் சேர்ந்த காப்டிக் பிரதியில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: ஆவி அண்ட வல்லமைகளை வெளிப்படுத்துகிறது
      '2':
        title: குரல் குருடான ஆட்சியாளனை அம்பலப்படுத்துகிறது
      '3':
        title: தெய்வீக ஒளி ஆதாமை உயிர்பெறச் செய்கிறது
      '4':
        title: பெண் ஆட்சியாளர்களின் வன்முறையிலிருந்து தப்புகிறாள்
      '5':
        title: பாம்பு ஆவிக்குரிய உண்மையைப் போதிக்கிறது
      '6':
        title: காயீன் ஆபேலைக் கொல்கிறான்; சேத் அவனிடத்தைப் பெறுகிறான்
      '7':
        title: நோவா பேழையைக் கட்டி இருமுறை காப்பாற்றப்படுகிறார்
      '8':
        title: நோரியா இருள் வல்லமைகளைத் துணிவுடன் எதிர்க்கிறாள்
      '9':
        title: எலெலேத் உண்மையான தோற்றத்தை உறுதிப்படுத்துகிறார்
      '10':
        title: ஞானத்தின் மகள் ஆட்சியாளனுக்கு எல்லையிடுகிறாள்
      '11':
        title: சபாவோத் மனந்திரும்பி ஞானத்தைப் புகழ்கிறார்
      '12':
        title: வெளிப்படுத்துபவர் நித்திய வாழ்வைக் கொண்டுவருகிறார்
  On the Origin of the World:
    display_name: உலகத்தின் தோற்றம்
    author: ஆசிரியர் பெயர் தெரியவில்லை. தொகுத்தவரின் பெயரைக் குறிப்பிடாமல், பல யூத, கிறிஸ்தவ, பிளேட்டோவிய, புராண மரபுகளை இந்நூல் ஒருங்கிணைத்து மாற்றியமைக்கிறது.
    audience: படைப்பு, அண்ட ஆட்சியாளர்கள், சோபியா, ஆதாம் மற்றும் ஏவாள், உலகின் இறுதி நிலை ஆகியவற்றைப் பற்றிய மாற்று வரலாற்றைத் தேடிய, ஞானவாதச் சாயலுள்ள கிறிஸ்தவச் சூழலைச் சேர்ந்த வாசகர்கள்.
    date: வழக்கமாகக் கி.பி. 3ஆம் நூற்றாண்டைச் சேர்ந்ததாகக் கணிக்கப்படுகிறது; எனினும், இதற்கு முந்தைய மூலப்பொருள்கள் இதன் அடிப்படையில் இருந்திருக்கலாம். முக்கியமாகக் கி.பி. 4ஆம் நூற்றாண்டைச் சேர்ந்த காப்டிக் சான்றுப் பிரதிகளில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: இருளிலிருந்து குழப்பநிலை தோன்றுகிறது
      '2':
        title: ஞானம் விண்ணுலகின் எல்லையை உருவாக்குகிறது
      '3':
        title: ஆட்சியாளன் தான் மட்டுமே ஆள்வதாகத் தவறாக எண்ணுகிறான்
      '4':
        title: ஏழு உயிர்கள் விண்ணுலகங்களை ஆளுகின்றன
      '5':
        title: குருடான கடவுள் தான் மட்டுமே இருப்பதாகக் கூறுகிறான்
      '6':
        title: சபாவோத் தன் பெற்றோரின் இருளை மறுக்கிறார்
      '7':
        title: விண்ணுலக ஆட்சியாளர் நகல்களைப் படைக்கிறார்
      '8':
        title: உயிரின் வல்லமைகள் மரணத்தை வெல்கின்றன
      '9':
        title: முதல் ஆட்சியாளன் தெய்வீக விசுவாசத்தைக் காண்கிறான்
      '10':
        title: ஒளிவீசும் ஆதாம் ஒளியில் தோன்றுகிறார்
      '11':
        title: ஈரோஸ் ஆசையையும் மரணத்தையும் எழுப்புகிறான்
      '12':
        title: புனித மரங்களுடன் பரதீசு படைக்கப்படுகிறது
      '13':
        title: தெய்வீக இரத்தத்திலிருந்து மலர்கள் தோன்றுகின்றன
      '14':
        title: ஞானம் விண்பொருள்களை ஒழுங்கமைக்கிறது
      '15':
        title: போதகர் அண்டத்தின் அறியாமையை அம்பலப்படுத்துகிறார்
      '16':
        title: ஏவாள் கணவனின்றிப் பிள்ளை பெறுகிறாள்
      '17':
        title: அண்ட ஆட்சியாளர்கள் ஆதாமை உருவாக்குகின்றனர்
      '18':
        title: ஏவாள் ஆதாமை உயிர்பெற விழிப்பூட்டுகிறாள்
      '19':
        title: ஏவாளின் ஒளிமிகு வல்லமையைக் கண்டு ஆட்சியாளர்கள் அஞ்சுகின்றனர்
      '20':
        title: அண்ட ஆட்சியாளர்கள் வழியாக ஏவாள் கருவுறுகிறாள்
      '21':
        title: ஏவாள் கனியை உண்டு ஞானம் பெறுகிறாள்
      '22':
        title: ஆதாம் ஆளும் வல்லமைகளை எதிர்க்கிறார்
      '23':
        title: ஞானம் ஆட்சியாளர்களை விண்ணுலகிலிருந்து தள்ளுகிறது
      '24':
        title: தீய ஆவிகளின் ஊழியர்கள் மனிதகுலத்தைத் தீக்குள் நடத்துகின்றனர்
      '25':
        title: மறைந்திருக்கும் கடவுள் ஆசிபெற்ற ஆவிகளை அனுப்புகிறார்
      '26':
        title: உன்னத வார்த்தை மறைவான உண்மைகளை வெளிப்படுத்துகிறது
      '27':
        title: கோபம் குழப்பநிலையை விழுங்கி முடிவுக்குக் கொண்டுவருகிறது
  Sophia of Jesus Christ:
    display_name: இயேசு கிறிஸ்துவின் ஞானம்
    author: ஆசிரியர் பெயர் தெரியவில்லை. யூக்னோஸ்டோஸ் என்னும் நூலிலும் காணப்படும் உள்ளடக்கத்தை, உயிர்த்தெழுதலுக்குப் பின் இயேசுவுக்கும் அவருடைய சீடர்களுக்கும் இடையே நிகழும் உரையாடலாக ஆசிரியர் மாற்றியமைத்துள்ளார்.
    audience: எல்லாவற்றையும் கடந்த கடவுள், விண்ணுலகின் ஒழுங்கமைப்பு, ஆன்மாவின் தோற்றம் மற்றும் மீட்பு ஆகியவற்றைப் பற்றிய வெளிப்படுத்தப்பட்ட ஞானத்தில் ஆர்வமுள்ள கிறிஸ்தவர்கள்.
    date: பெரும்பாலும் கி.பி. 2ஆம் நூற்றாண்டின் பிற்பகுதி அல்லது 3ஆம் நூற்றாண்டைச் சேர்ந்ததாகக் கணிக்கப்படுகிறது; நாக் ஹம்மாடியிலும் பெர்லின் கோடெக்ஸிலும் உள்ள காப்டிக் பிரதிகளில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: இயேசு சீடர்களுக்கு உண்மையை வெளிப்படுத்துகிறார்
      '2':
        title: கடவுளின் நித்திய மறைபொருள் விளக்கப்படுகிறது
      '3':
        title: மறைந்திருக்கும் கடவுளின் நன்மையிலிருந்து படைப்பு தோன்றுகிறது
      '4':
        title: காணக்கூடிய உலகம் விசுவாசத்திற்கு வழிகாட்டுகிறது
      '5':
        title: ஒளிவீசும் மனிதர் கடவுளால் வெளிப்படுத்தப்படுகிறார்
      '6':
        title: கிறிஸ்து அதிகாரத்தால் வானதூதர்களைப் படைக்கிறார்
      '7':
        title: மீட்பர் உள்ளிருக்கும் தெய்வீக ஒளியை விழிப்பூட்டுகிறார்
      '8':
        title: விண்ணுலகங்கள் இசைவான ஒருமைப்பாட்டில் உள்ளன
      '9':
        title: தெய்வீக ஞானமும் உண்மையான அறிவும்
      '10':
        title: நித்திய கடவுளின் நிறைவான சித்தத்தை வெளிப்படுத்துங்கள்
  Gospel of the Egyptians:
    display_name: எகிப்தியரின் நற்செய்தி
    author: ஆசிரியர் பெயர் தெரியவில்லை. ‘மாபெரும் கண்ணுக்குப் புலப்படாத ஆவியின் பரிசுத்த நூல்’ என்றும் அழைக்கப்படும் இந்த நாக் ஹம்மாடி நூல், மேற்கோள்கள் மூலமாக மட்டுமே அறியப்படும் இதற்கு முந்தைய கிரேக்க ‘எகிப்தியரின் நற்செய்தி’ நூலிலிருந்து வேறுபட்டது.
    audience: செறிவான புராணக்கதை, புனிதப் பெயர்கள், திருமுழுக்குக் காட்சிப்படிமங்கள், துதிப்பாடல் பாணியிலான புகழ்ச்சி ஆகியவற்றின் வழியாக ஆவிக்குரிய அடையாளத்தையும் விடுதலையையும் எடுத்துரைத்த சேத்திய கிறிஸ்தவச் சமூகம்.
    date: வழக்கமாகக் கி.பி. 2ஆம் அல்லது 3ஆம் நூற்றாண்டைச் சேர்ந்ததாகக் கருதப்படுகிறது; கி.பி. 4ஆம் நூற்றாண்டைச் சேர்ந்த நாக் ஹம்மாடி கோடெக்ஸ்களில் இரண்டு காப்டிக் பிரதிகள் எஞ்சியுள்ளன.
    chapters:
      '1':
        title: கடவுள் நித்திய தெய்வீக ஒளியை வெளிப்படுத்துகிறார்
      '2':
        title: மௌனத்திலிருந்து மூன்று வல்லமைகள் விரிகின்றன
      '3':
        title: புனித மௌனத்திலிருந்து தந்தை வெளிப்படுகிறார்
      '4':
        title: விண்ணுலக உயிர்கள் ஆவியைப் புகழ்கின்றன
      '5':
        title: அதாமாஸ் எல்லாப் படைப்பையும் தோற்றுவிக்கிறார்
      '6':
        title: கிறிஸ்து அழிவில்லாத மக்களை நிலைநாட்டுகிறார்
      '7':
        title: தெய்வீக வல்லமைகள் ஒருமைப்பாட்டில் மகிழ்கின்றன
      '8':
        title: கிறிஸ்து மாட்சிமையின் முழு மகிமையை வெளிப்படுத்துகிறார்
      '9':
        title: சேத் ஆவிக்குரிய வழித்தோன்றல்களுக்காக மன்றாடுகிறார்
      '10':
        title: தெய்வீக ஞானத்திலிருந்து சோபியா தோன்றுகிறாள்
      '11':
        title: விண்ணுலகத் தூதர்கள் வழிமரபைப் பாதுகாக்கின்றனர்
      '12':
        title: சேத் கிறிஸ்துவின் வழியாக மீட்பை ஆயத்தப்படுத்துகிறார்
      '13':
        title: பேசுபவர் நித்தியமான கண்ணுக்குப் புலப்படாத கடவுளை அழைக்கிறார்
      '14':
        title: சேத் மறைநூலை எழுதினார்
  Letter of Peter to Philip:
    display_name: பிலிப்புவுக்குப் பேதுரு எழுதிய கடிதம்
    author: ஆசிரியர் பெயர் தெரியவில்லை. தொடக்கத்திலுள்ள சுருக்கமான கடிதமும் அதைத் தொடர்ந்து வரும் வெளிப்பாடும், இரு திருத்தூதர்களில் ஒருவரால் உறுதியாக எழுதப்பட்டவை என்பதற்குப் பதிலாகப் பேதுரு மற்றும் பிலிப்புவின் பெயரில் புனைப்பெயருடன் வழங்கப்பட்டுள்ளன.
    audience: மீட்பர், பகைமை கொண்ட வல்லமைகள், துன்பம், பணி, சீடர்களின் மீட்சி ஆகியவற்றைப் பற்றிய போதனைக்குத் திருத்தூதர்களின் அங்கீகாரத்தை நாடிய கிறிஸ்தவர்கள்.
    date: பொதுவாகக் கி.பி. 2ஆம் நூற்றாண்டின் பிற்பகுதி அல்லது 3ஆம் நூற்றாண்டின் முற்பகுதியைச் சேர்ந்ததாகக் கணிக்கப்படுகிறது; கி.பி. 4ஆம் நூற்றாண்டைச் சேர்ந்த நாக் ஹம்மாடி பிரதியிலும், அதற்குப் பிந்தைய ஒரு காப்டிக் சான்றுப் பிரதியிலும் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: திரும்பிவரும்படி பிலிப்புவைப் பேதுரு வலியுறுத்துகிறார்
      '2':
        title: ஒலிவ மலையில் திருத்தூதர்கள் மன்றாடுகின்றனர்
      '3':
        title: தெய்வீக நிறைவை இயேசு விளக்குகிறார்
      '4':
        title: உண்மைக் கடவுளின் திட்டத்தை ஆட்சியாளன் எதிர்க்கிறான்
      '5':
        title: விசுவாசத்தின் வழியாகத் தொலைந்தவர்களைக் கிறிஸ்து மீட்கிறார்
      '6':
        title: இயேசு நித்திய வலிமையை வாக்களிக்கிறார்
      '7':
        title: துன்புறுத்தலிலும் திருத்தூதர்கள் அறிவிக்கின்றனர்
      '8':
        title: பேதுரு புனித உரிமைப்பேற்றை அறிவிக்கிறார்
  Gospel of Judas:
    display_name: யூதாசின் நற்செய்தி
    author: ஆசிரியர் பெயர் தெரியவில்லை. தலைப்பு இக்கதையை யூதாசுடன் தொடர்புபடுத்துகிறது; ஆனால் யூதாஸ் இஸ்காரியோத்து இதன் வரலாற்று ஆசிரியர் என்பதை இந்நூல் நிலைநாட்டவில்லை.
    audience: எதிர்த்தரப்பினரின் பலிசெலுத்தும் மற்றும் திருச்சபை சார்ந்த நடைமுறைகளை விமர்சித்த ஒரு கிறிஸ்தவக் குழு; வெளிப்பாட்டு உரையாடலையும் சேத்திய வகை அண்டவியலையும் பயன்படுத்தி யூதாசையும் இயேசுவின் மரணத்தையும் அவர்கள் மறுவிளக்கம் செய்தனர்.
    date: வழக்கமாகக் கி.பி. 2ஆம் நூற்றாண்டின் நடுப்பகுதி அல்லது பிற்பகுதியைச் சேர்ந்ததாகக் கணிக்கப்படுகிறது; ஏறத்தாழக் கி.பி. 180இல் இரேனேயு ‘யூதாசின் நற்செய்தி’ ஒன்றை அறிந்திருந்தார். எஞ்சியுள்ள காப்டிக் பிரதி கி.பி. 3ஆம் அல்லது 4ஆம் நூற்றாண்டைச் சேர்ந்ததாக இருக்கலாம்.
    chapters:
      '1':
        title: இயேசு யூதாசுக்கு மறைபொருள்களை வெளிப்படுத்துகிறார்
      '2':
        title: யூதாஸ் மட்டும் இயேசுவை அணுகுகிறான்
      '3':
        title: இயேசு புனித சமூகத்தை விவரிக்கிறார்
      '4':
        title: சீடர்களின் தரிசனம் சீர்கேட்டை அம்பலப்படுத்துகிறது
      '5':
        title: யூதாஸ் சபிக்கப்பட்டாலும் தனித்துவமானவன்
      '6':
        title: இயேசு தெய்வீக உலகங்களை வெளிப்படுத்துகிறார்
      '7':
        title: யூதாஸ் இயேசுவின் உடலைக் காட்டிக்கொடுக்கிறான்
  Protoevangelium of James:
    display_name: யாக்கோபின் ஆதிநற்செய்தி
    author: ஆசிரியர் பெயர் தெரியவில்லை. கதைசொல்லி தன்னை யாக்கோபு என்று கூறுகிறார்; ஆனால் இந்நூல் புனைப்பெயரில் எழுதப்பட்டது, இயேசுவின் சகோதரரான யாக்கோபு இதை எழுதவில்லை.
    audience: மரியாளின் பிறப்பும் வளர்ப்பும், அவருடைய நிலையான தூய்மை, இயேசுவின் பிறப்பு, மத்தேயுவும் லூக்காவும் விடையளிக்காமல் விட்ட கேள்விகளுக்கான கதைவடிவப் பதில்கள் ஆகியவற்றில் ஆர்வமுள்ள கிறிஸ்தவர்கள்.
    date: பொதுவாகக் கி.பி. 2ஆம் நூற்றாண்டின் பிற்பகுதியைச் சேர்ந்ததாகக் கணிக்கப்படுகிறது; பிற்காலத்தைச் சேர்ந்த ஏராளமான கிரேக்கக் கையெழுத்துப் பிரதிகளிலும் பழங்கால மொழிபெயர்ப்புகளிலும் இது எஞ்சியுள்ளது.
    chapters:
      '1':
        title: வனாந்தரத்தில் யோவாக்கிம் மன்றாடுகிறார்
      '2':
        title: லாரல் மரத்தடியில் அன்னாள் மன்றாடுகிறாள்
      '3':
        title: தன் பிள்ளையின்மைக்காக அன்னாள் புலம்புகிறாள்
      '4':
        title: அன்னாள் மன்றாட, வானதூதர் பதிலளிக்கிறார்
      '5':
        title: தன்னிடம் பாவமில்லை என யோவாக்கிம் காண்கிறார்
      '6':
        title: யோவாக்கிம் மரியாளை வலிமையுடன் வீட்டிற்கு வரவேற்கிறார்
      '7':
        title: மகள் நடனமாடுகிறாள்; இஸ்ரவேல் அவளை நேசிக்கிறது
      '8':
        title: மரியாள் ஆலயத்தில் தங்கியிருக்கிறாள்
      '9':
        title: கன்னிக்காக யோசேப்பு தேர்ந்தெடுக்கப்படுகிறார்
      '10':
        title: மரியாள் கருஞ்சிவப்பு நூலை நூற்கிறாள்
      '11':
        title: மரியாவின் புனிதப் பணியை வானதூதர் அறிவிக்கிறார்
      '12':
        title: மரியா எலிசபெத்தைச் சந்தித்துத் திரும்புகிறார்
      '13':
        title: கருவுற்ற மரியாவுக்காக யோசேப்பு துயரப்படுகிறார்
      '14':
        title: கனவில் யோசேப்பிடம் வானதூதர் பேசுகிறார்
      '15':
        title: யோசேப்பு தவறு செய்ததாகக் குரு குற்றஞ்சாட்டுகிறார்
      '16':
        title: சோதனைக்குப் பின் மரியாவை யோசேப்பு விடுவிக்கிறார்
      '17':
        title: மரியா பெத்லகேமுக்குப் பயணம் செய்கிறார்
      '18':
        title: உறைந்துபோன உலகை யோசேப்பு காண்கிறார்
      '19':
        title: கன்னிப் பிறப்பை மருத்துவச்சி காண்கிறார்
      '20':
        title: மரியாவைப் பரிசோதித்த சலோமே எரிவுணர்வு அடைகிறார்
      '21':
        title: புதிதாய்ப் பிறந்த அரசரை ஞானிகள் தேடுகின்றனர்
      '22':
        title: குழந்தைகளைக் கொல்ல ஏரோது ஆணையிடுகிறார்
      '23':
        title: ஏரோதின் அச்சுறுத்தலைச் சந்திக்கும் சகரியா
      '24':
        title: பரிசுத்த இடத்தில் சகரியா கொல்லப்படுகிறார்
      '25':
        title: கலவரத்தின்போது யாக்கோபு நிகழ்வுகளை எழுதுகிறார்
      '26':
        title: போட்மர் பாப்பிரசில் சுருக்கமான பதிப்பு உள்ளது
      '27':
        title: பெத்லகேமில் மருத்துவச்சியை யோசேப்பு தேடுகிறார்
      '28':
        title: மரியாவின் அற்புதத்தை யோசேப்பு விளக்குகிறார்
      '29':
        title: குழந்தையைத் தொட்டுச் சலோமே குணமடைகிறார்
      '30':
        title: யூதர்களின் அரசரை ஞானிகள் தேடுகின்றனர்
  Infancy Gospel of Thomas:
    display_name: தோமாவின் குழந்தைப் பருவ நற்செய்தி
    author: ஆசிரியர் பெயர் தெரியவில்லை. மீட்டுருவாக்கம் செய்ய முடிகிற இதன் மிகப் பழைய வடிவத்தில் ஆசிரியரின் பெயர் குறிப்பிடப்படவில்லை; தோமாவுக்கு உரியது என்ற கூறல் பிற்காலக் கையெழுத்துப் பிரதிகளின் தலைப்புகளிலும் நூல் பரவிய மரபிலும் காணப்படுகிறது.
    audience: இயேசுவின் குழந்தைப் பருவத்தைப் பற்றியும், அதிகாரப்பூர்வ நற்செய்தி நூல்களின் நிகழ்வுகள் தொடங்குவதற்கு முன்பு அவரது தெய்வீக வல்லமை, ஒழுக்கப் பயிற்சி, கற்றல் மற்றும் முதிர்ச்சி எவ்வாறு விவரிக்கப்படலாம் என்பதையும் அறிய ஆர்வமுள்ள கிறிஸ்தவர்கள்.
    date: பொதுவாக கி.பி. 2ஆம் நூற்றாண்டைச் சேர்ந்ததாகக் கருதப்படுகிறது; ஆனால் ஒன்றுக்கொன்று கணிசமாக வேறுபடும் பல கிரேக்கப் பதிப்புகளிலும் தொடக்ககால மொழிபெயர்ப்புகளிலும் இந்நூல் எஞ்சியுள்ளது.
    chapters:
      '1':
        title: இயேசுவைப் பற்றித் தோமா பேசுகிறார்
      '2':
        title: இயேசு நீரைத் தெளிவாக்கிப் பறவைகளை உருவாக்குகிறார்
      '3':
        title: அன்னாவின் மகனை இயேசு சபிக்கிறார்
      '4':
        title: இயேசு சபித்த குழந்தை இறக்கிறது
      '5':
        title: யோசேப்புக்கு இயேசு ஞானத்தைக் கற்பிக்கிறார்
      '6':
        title: இயேசுவின் ஞானத்தை எதிர்கொள்ள முடியாமல் ஆசிரியர் திணறுகிறார்
      '7':
        title: இயேசுவின் மேம்பட்ட அறிவை ஆசிரியர் ஒப்புக்கொள்கிறார்
      '8':
        title: இயேசு சிரித்து, குணமாக்கி, அறிவிக்கிறார்
      '9':
        title: விழுந்து இறந்த சேனோவை இயேசு உயிர்ப்பிக்கிறார்
      '10':
        title: மரம் வெட்டுபவரின் பாதத்தை இயேசு குணமாக்குகிறார்
      '11':
        title: உடைந்த குடத்தை இயேசு அற்புதமாக நிரப்புகிறார்
      '12':
        title: இயேசு விதைத்ததை யோசேப்பு அறுவடை செய்கிறார்
      '13':
        title: இயேசுவுடன் சேர்ந்து யோசேப்பு படுக்கையை முடிக்கிறார்
      '14':
        title: இயேசுவை எதிர்த்த ஆசிரியர் இறக்கிறார்
      '15':
        title: இயேசுவின் பேச்சு ஆசிரியரை மகிழ்விக்கிறது
      '16':
        title: பாம்பு கடித்த யாக்கோபை இயேசு குணமாக்குகிறார்
      '17':
        title: குழந்தை யோசேப்பை இயேசு குணமாக்குகிறார்
      '18':
        title: அந்த இடத்தில் ஓர் ஆணை இயேசு உயிர்ப்பிக்கிறார்
      '19':
        title: பன்னிரண்டு வயது இயேசு ஆலயத்தில் கற்பிக்கிறார்
  Acts of Paul and Thecla:
    display_name: பவுல் மற்றும் தெக்லாவின் செயல்கள்
    author: ஆசிரியர் பெயர் தெரியவில்லை. இது விரிவான பவுலின் செயல்கள் நூலிலுள்ள ஓர் அத்தியாயம்; ஒரு திருச்சபை மூப்பர் அந்தச் செயல்கள் நூலை இயற்றினார் என்று ஒரு பழங்காலக் குறிப்பு கூறினாலும், அதைக் கொண்டு ஆசிரியரை உறுதியாக அடையாளம் காண முடியாது.
    audience: அப்போஸ்தலப் பிரசங்கம், மணத்துறவு, திருமுழுக்கு, மறைச்சாட்சியை ஒத்த மனவுறுதி, ஒரு பெண்ணுக்குக் கற்பிக்கவும் சாட்சி பகரவும் உள்ள அதிகாரம் ஆகியவற்றைப் பற்றிய கதைகளால் ஈர்க்கப்பட்ட கிறிஸ்தவர்கள்.
    date: கி.பி. 2ஆம் நூற்றாண்டில், அநேகமாக அதன் பிற்பாதியில் இயற்றப்பட்டது; பவுலின் செயல்கள் நூலின் ஒரு பகுதியாகவும் தனி நூலாகவும் பரவியது.
    chapters:
      '1':
        title: ஒனேசிப்போருவின் வீட்டில் பவுல் பிரசங்கிக்கிறார்
      '2':
        title: தெக்லா கேட்டு, பவுலைக் காண ஏங்குகிறார்
      '3':
        title: ஆளுநரிடம் பவுல்மீது தமிரிஸ் குற்றஞ்சாட்டுகிறார்
      '4':
        title: சிறையில் பவுலைச் சந்தித்துத் தெக்லா அவரை ஊக்குவிக்கிறார்
      '5':
        title: கழுமரத் தீயிலிருந்து தெக்லா தப்புகிறார்
      '6':
        title: தெக்லாவுடன் பவுல் நோன்பிருந்து மன்றாடுகிறார்
      '7':
        title: அந்தியோகியாவுக்குத் தெக்லாவை பவுல் அனுப்புகிறார்
      '8':
        title: விலங்குகளிடமிருந்து தெக்லாவை திரிபீனா காக்கிறார்
      '9':
        title: குளத்தில் தெக்லா தனக்குத்தானே திருமுழுக்குப் பெறுகிறார்
      '10':
        title: செலூக்கியாவில் பெண்களுக்குத் தெக்லா கற்பிக்கிறார்
      '11':
        title: விண்ணகக் குரல் தெக்லாவின் முகத்திரையைக் காப்பாற்றுகிறது
  Gospel of Peter:
    display_name: பேதுருவின் நற்செய்தி
    author: ஆசிரியர் பெயர் தெரியவில்லை. எஞ்சியுள்ள கதை பேதுருவின் குரலில் பேசுவதோடு அவரது பெயரில் பரவியிருந்தாலும், வரலாற்று அப்போஸ்தலரான பேதுருவின் படைப்பாக இது கருதப்படுவதில்லை.
    audience: பேதுருவின் அதிகாரத்திற்குச் சிறப்பு முக்கியத்துவம் அளித்த சமூகங்களில் இருந்திருக்கக்கூடிய, இயேசுவின் பாடுகளையும் உயிர்த்தெழுதலையும் விரிவாக விவரிக்கும் கதையில் ஆர்வமுள்ள தொடக்ககாலக் கிறிஸ்தவர்கள்.
    date: பொதுவாக கி.பி. 2ஆம் நூற்றாண்டைச் சேர்ந்ததாகக் கணிக்கப்படுகிறது; எஞ்சியுள்ள முதன்மையான கிரேக்கத் துணுக்கு, அக்மீமில் கண்டுபிடிக்கப்பட்ட மிகவும் பிற்காலக் கையெழுத்துப் பிரதியிலிருந்து கிடைத்தது.
    chapters:
      '1':
        title: ஆண்டவரை விசாரிக்க ஏரோது ஆணையிடுகிறார்
      '2':
        title: ஆண்டவரின் உடலை யோசேப்பு அடக்கம் செய்கிறார்
      '3':
        title: கடவுளின் மகனைக் கூட்டத்தினர் ஏளனம் செய்கின்றனர்
      '4':
        title: குற்றவாளி இயேசுவின் மாண்பைக் காக்கிறான்
      '5':
        title: நண்பகலில் யூதேயாவை இருள் சூழ்கிறது
      '6':
        title: யோசேப்பின் கல்லறையில் இயேசு வைக்கப்படுகிறார்
      '7':
        title: செய்யப்பட்ட அநீதிக்காக மக்கள் புலம்புகின்றனர்
      '8':
        title: இயேசுவின் கல்லறையை மூப்பர்கள் காவல் காக்கின்றனர்
      '9':
        title: விடியற்காலையில் விண்ணகக் குரல் ஒலிக்கிறது
      '10':
        title: கல்லறையிலிருந்து மூவர் வெளியே வருகின்றனர்
      '11':
        title: பிலாத்துவிடம் படைவீரர்கள் செய்தி தெரிவிக்கின்றனர்
      '12':
        title: மகதலா மரியா கல்லறையைத் தேடுகிறார்
      '13':
        title: வானதூதரின் செய்தியைக் கேட்ட பெண்கள் ஓடுகின்றனர்
      '14':
        title: விழாவுக்குப் பின் சீடர்கள் அழுகின்றனர்
  2 Clement:
    display_name: 2 கிளெமெந்து
    author: ஆசிரியர் பெயர் தெரியவில்லை. இதன் மரபுவழித் தலைப்பு இவ்வாறு இருந்தாலும், இது ரோமின் கிளெமெந்து எழுதிய இரண்டாம் கடிதமல்ல; மாறாக, தொடக்ககாலக் கிறிஸ்தவ மறையுரை.
    audience: மனந்திரும்புதல், ஒழுக்கத்தில் நிலைத்தன்மை, நலிவுற்றோருக்கான பராமரிப்பு, உயிர்த்தெழுதல் மற்றும் தீர்ப்பின் நம்பிக்கையில் விசுவாசத்துடன் நிலைத்திருத்தல் ஆகியவற்றுக்கு அறிவுறுத்தப்படும் ஒரு கிறிஸ்தவச் சபைக் கூட்டம்.
    date: பொதுவாக கி.பி. 2ஆம் நூற்றாண்டின் முற்பாதி அல்லது நடுப்பகுதியைச் சேர்ந்ததாகக் கணிக்கப்படுகிறது (ஏறத்தாழ கி.பி. 100–160); இது இயற்றப்பட்ட இடம் உறுதியாகத் தெரியவில்லை.
    chapters:
      '1':
        title: நம் நீதிபதியான இயேசு கிறிஸ்து
      '2':
        title: திருச்சபை விசுவாசத்தால் நிறைகிறது
      '3':
        title: கிறிஸ்து நமக்கு இரக்கம் காட்டுகிறார்
      '4':
        title: செயல்களில் வெளிப்படும் உண்மையான அறிக்கை
      '5':
        title: கடவுளுக்காக அச்சமின்றி வாழுங்கள்
      '6':
        title: செல்வத்தைவிடக் கடவுளைத் தேர்ந்தெடுங்கள்
      '7':
        title: முழு மனதுடன் பந்தயத்தில் பங்கேற்குங்கள்
      '8':
        title: உயிரோடிருக்கும்போதே மனந்திரும்புங்கள்
      '9':
        title: உடலை ஆலயமாகக் காத்துக்கொள்ளுங்கள்
      '10':
        title: நற்பண்பையும் சமாதானத்தையும் நாடுங்கள்
      '11':
        title: தூய உள்ளத்துடன் கடவுளுக்குப் பணியாற்றுங்கள்
      '12':
        title: அன்பும் நீதியும் காத்திருக்கின்றன
      '13':
        title: மனந்திரும்பி நன்மையை நாடுங்கள்
      '14':
        title: உயிருள்ள திருச்சபைக்கு உரியவர்களாக இருங்கள்
      '15':
        title: ஊக்கத்துடன் சுயக்கட்டுப்பாட்டைக் கடைப்பிடியுங்கள்
      '16':
        title: காலம் இருக்கும்போதே மனந்திரும்புங்கள்
      '17':
        title: பலவீனரை நன்மையை நோக்கி வழிநடத்துங்கள்
      '18':
        title: நீதிக்காகப் பாடுபடுங்கள்
      '19':
        title: இப்போதே முழு மனதுடன் மனந்திரும்புங்கள்
      '20':
        title: துன்பத்தில் கடவுளின் பயிற்சியை நம்புங்கள்
  Epistle of Barnabas:
    display_name: பர்னபாவின் திருமுகம்
    author: ஆசிரியர் பெயர் தெரியவில்லை. இந்நூல் மரபுவழியாகப் பவுலின் தோழரான பர்னபாவுடன் தொடர்புபடுத்தப்பட்டது; ஆனால் இன்றைய ஆய்வாளர்கள் அந்த ஆசிரியர் கூறலை ஏற்றுக்கொள்வதில்லை.
    audience: இஸ்ரவேலின் வேதவாக்குகளை கிறிஸ்துவை மையப்படுத்தியும் உருவகமாகவும் விளக்கித் தங்களுக்குரியதாக ஏற்கவும், தங்களின் உடன்படிக்கை அடையாளத்தை யூத நடைமுறையிலிருந்து வேறுபடுத்தவும் கற்பிக்கப்பட்ட யூதரல்லாத கிறிஸ்தவர்கள்.
    date: பொதுவாக கி.பி. 70இல் எருசலேம் ஆலயம் அழிக்கப்பட்டதற்கும் கி.பி. 2ஆம் நூற்றாண்டின் தொடக்கத்திற்கும் இடைப்பட்ட காலத்தைச் சேர்ந்ததாகவும், பெரும்பாலும் ஏறத்தாழ கி.பி. 80–130 காலத்தைச் சேர்ந்ததாகவும் கணிக்கப்படுகிறது.
    chapters:
      '1':
        title: அன்புக்குரிய சமூகத்தைக் கடவுளின் அருள் நிரப்புகிறது
      '2':
        title: விசுவாசிகள் கடவுளின் உண்மையான கட்டளையை நாடுகின்றனர்
      '3':
        title: நோன்பு என்பது இரக்கமும் நீதியுமாகும்
      '4':
        title: விழிப்புள்ள கிறிஸ்தவர்கள் சோதனைகளை எதிர்நோக்குகின்றனர்
      '5':
        title: பாவிகளுக்காக இயேசு துன்புற்றார்
      '6':
        title: வாக்களிக்கப்பட்ட அரசை இயேசு நிறைவேற்றுகிறார்
      '7':
        title: இயேசுவின் காயங்களுக்காகக் கடவுளுக்கு நன்றி செலுத்துங்கள்
      '8':
        title: இளம் பசுவின் பலி இயேசுவை முன்னறிவிக்கிறது
      '9':
        title: உள்ளத்தின் விருத்தசேதனம் விசுவாசத்தைக் குறிக்கிறது
      '10':
        title: உணவுச் சட்டங்கள் ஆன்மிகப் பாடங்களைக் கற்பிக்கின்றன
      '11':
        title: திருமுழுக்கும் சிலுவையும் மன்னிப்பைக் கொண்டுவருகின்றன
      '12':
        title: மோசேயின் கரங்கள் இயேசுவைச் சுட்டிக்காட்டுகின்றன
      '13':
        title: யாக்கோபின் ஆசீர்வாதம் தலைகீழ் மாற்றத்தை முன்னறிவிக்கிறது
      '14':
        title: இயேசு இதயங்களைத் தேவனுக்காக மீட்கிறார்
      '15':
        title: நீதிக்குப் பின்பு ஓய்வுநாள் இளைப்பாறுதல் வருகிறது
      '16':
        title: உண்மையான ஆலயம் விசுவாசிகளுக்குள் உள்ளது
      '17':
        title: இப்போது இரட்சிப்பு தெளிவாக விளக்கப்படுகிறது
      '18':
        title: ஒளியின் தூதர்களும் இருளின் ஆட்சியாளனும்
      '19':
        title: ஒளியின் வழி அர்ப்பணிப்பைக் கட்டளையிடுகிறது
      '20':
        title: இருளின் பாதை நித்திய அழிவுக்கு வழிநடத்துகிறது
      '21':
        title: மகிமைக்காக ஆண்டவரின் கட்டளைகளுக்குக் கீழ்ப்படியுங்கள்
  Letters of Ignatius:
    display_name: இக்னாத்தியுவின் கடிதங்கள்
    author: பொதுவாக ஏற்றுக்கொள்ளப்படும் இடைநிலைப் பதிப்பின் ஏழு கடிதங்களைப் பொறுத்தவரை, அந்தியோகியாவின் ஆயரான இக்னாத்தியு; பிற்காலத்தில் விரிவாக்கப்பட்ட கடிதங்களும் இக்னாத்தியுவின் பெயரில் எழுதப்பட்ட கடிதங்களும் இந்தத் தொகுப்பில் இடம்பெறவில்லை.
    audience: இக்னாத்தியு மறைசாட்சியாக மரிப்பதற்காக அழைத்துச் செல்லப்பட்ட பயணத்தின்போது, எபேசு, மக்னேசியா, திரல்லே, ரோம், பிலதெல்பியா, சிமிர்னா ஆகிய இடங்களிலிருந்த கிறிஸ்தவச் சபைகளுக்கும், பொலிகார்ப்புக்கும் எழுதப்பட்டவை.
    date: பொதுவாக கி.பி. 2ஆம் நூற்றாண்டின் தொடக்கத்துக்குரியவை என்றும், சுமார் கி.பி. 105–117 காலத்தைச் சேர்ந்தவை என்றும் தேதியிடப்படுகின்றன; எனினும் இக்னாத்தியுவின் பயணத்தின் துல்லியமான காலவரிசை இன்னும் விவாதத்திற்குரியது.
    chapters:
      '1':
        title: இக்னாத்தியு எபேசு சபையை வாழ்த்துகிறார்
      '2':
        title: சிறையிலுள்ள இக்னாத்தியுவுக்கு விசுவாசிகள் ஆதரவளிக்கிறார்கள்
      '3':
        title: ஒற்றுமையுடனும் ஜெபத்துடனும் ஆயரை மதியுங்கள்
      '4':
        title: இக்னாத்தியு தாழ்மையுடன் பேசுகிறார்
      '5':
        title: இயேசுவின் அன்பினால் வரும் ஒற்றுமை
      '6':
        title: ஆயர் விசுவாசிகளை ஜெபத்தில் ஒன்றிணைக்கிறார்
      '7':
        title: அமைதியாகச் சிறப்பாக வழிநடத்தும் ஆயரை மதியுங்கள்
      '8':
        title: பொய்ப் போதகர்களின் செல்வாக்கைக் குறித்து எச்சரிக்கையாக இருங்கள்
      '9':
        title: எபேசியர்களின் அர்ப்பணிப்பும் இக்னாத்தியுவும்
      '10':
        title: தீய போதனையை நிராகரித்து உறுதியாக நில்லுங்கள்
      '11':
        title: எல்லா மக்களுக்காகவும் இடைவிடாமல் ஜெபியுங்கள்
      '12':
        title: சங்கிலிகளைவிட மேலான கிறிஸ்து
      '13':
        title: தண்டனைத் தீர்ப்புப் பெற்றவராக இக்னாத்தியு எழுதுகிறார்
      '14':
        title: சமாதானம் சாத்தானின் சூழ்ச்சிகளின் வல்லமையை முறியடிக்கிறது
      '15':
        title: விசுவாசம் நற்குணத்திற்கும் அன்பிற்கும் வழிநடத்துகிறது
      '16':
        title: மௌனத்தின் வழியாக உண்மையை வாழ்தல்
      '17':
        title: குடும்பங்களை அழிப்பவர்கள் உரிமைபெற மாட்டார்கள்
      '18':
        title: தேவனைப் பற்றிய அறிவை ஞானத்துடன் ஏற்றுக்கொள்ளுங்கள்
      '19':
        title: சிலுவைக்காகத் தன்னை ஒன்றுமில்லாதவராக எண்ணுதல்
      '20':
        title: மரியா, நட்சத்திரம், கிறிஸ்துவின் கவிழ்த்தல்
      '21':
        title: மீண்டும் எழுத இக்னாத்தியு நம்புகிறார்
      '22':
        title: வாசகர்களுக்காக இக்னாத்தியு ஜெபிக்கிறார்
      '23':
        title: மக்னேசியா சபை கிருபையால் ஆசீர்வதிக்கப்படுகிறது
      '24':
        title: ஒற்றுமைக்காக இக்னாத்தியு ஜெபிக்கிறார்
      '25':
        title: ஆயருக்காக இக்னாத்தியு தேவனுக்கு நன்றி செலுத்துகிறார்
      '26':
        title: உங்கள் இளம் ஆயரை மதியுங்கள்
      '27':
        title: உண்மையாகவே கிறிஸ்தவர்களாக வாழுங்கள்
      '28':
        title: விசுவாசம் நித்திய முத்திரையைத் தேர்ந்தெடுக்கிறது
      '29':
        title: சபையின் ஒற்றுமையை இக்னாத்தியு தழுவுகிறார்
      '30':
        title: விசுவாசிகள் ஆயரின் தலைமையில் கூடுகிறார்கள்
      '31':
        title: இயேசு கிருபையின் வழியாக வெளிப்படுத்தப்பட்டார்
      '32':
        title: உயிர்த்தெழுந்த கிறிஸ்துவில் நம்பிக்கை நிலைத்திருக்கிறது
      '33':
        title: பழைய புளிப்புமாவை அகற்றுங்கள்
      '34':
        title: கிறிஸ்துவின் அடித்தளத்தில் உறுதியாக நில்லுங்கள்
      '35':
        title: தாழ்மை விசுவாசத்தில் மகிழ்ச்சியைக் கொண்டுவருகிறது
      '36':
        title: விசுவாசத்தில் ஆயருடன் ஒன்றுபடுங்கள்
      '37':
        title: ஜெபங்கள் சபைக்குப் புத்துணர்ச்சி அளிக்கின்றன
      '38':
        title: தேவனுக்குரிய நல்லிணக்கத்துடன் சபைகளை வாழ்த்துங்கள்
      '39':
        title: இயேசுவின் பாடுகளின் வழியாக வரும் சமாதானம்
      '40':
        title: சிந்தனையிலும் பொறுமையிலும் குற்றமற்றவர்களாக இருங்கள்
      '41':
        title: விசுவாசிகள் ஆயருக்கும் கிறிஸ்துவுக்கும் கீழ்ப்படிகிறார்கள்
      '42':
        title: தலைவர்களை இயேசு கிறிஸ்துவைப்போல் மதியுங்கள்
      '43':
        title: பெருமையைவிட சாந்தத்தையே நாடுங்கள்
      '44':
        title: பரலோக அறிவைக் குறித்து இக்னாத்தியு அஞ்சினார்
      '45':
        title: விசுவாசத்தை வளருங்கள்; தவறான போதனைகளை அல்ல
      '46':
        title: சபைத் தலைமைக்கு உண்மையுடன் இருங்கள்
      '47':
        title: சாந்தத்தை ஆயுதமாக அணிந்துகொள்ளுங்கள்
      '48':
        title: கிறிஸ்து மட்டுமே உண்மையான வாழ்வைக் கொண்டுவருகிறார்
      '49':
        title: உண்மையான பாடுகள் கிறிஸ்துவின் மெய்ம்மையை உறுதிப்படுத்துகின்றன
      '50':
        title: பொய்ப் போதகர்களின் கொடிய கனியைத் தவிருங்கள்
      '51':
        title: ஜெபத்திலும் அர்ப்பணிப்பிலும் ஒன்றுபடுங்கள்
      '52':
        title: அன்புடன் ஆயருக்குக் கீழ்ப்படியுங்கள்
      '53':
        title: ரோமின் விசுவாசமுள்ள சபைக்கு வாழ்த்துகள்
      '54':
        title: என் பயணத்தின் முடிவுக்காக ஜெபியுங்கள்
      '55':
        title: மனிதரின் அங்கீகாரத்தை அல்ல, தேவனுடைய அங்கீகாரத்தை நாடுங்கள்
      '56':
        title: உள்ளார்ந்த வலிமைக்காக ஜெபியுங்கள்
      '57':
        title: தேவனுக்காக மனமுவந்து மரணத்தை எதிர்கொள்ளுங்கள்
      '58':
        title: இக்னாத்தியு பாடுகளை வரவேற்கிறார்
      '59':
        title: கிறிஸ்துவுக்காக உலக ஆசைகளைச் சிலுவையில் அறையுங்கள்
      '60':
        title: இக்னாத்தியு உலக ஆசைகளை நிராகரிக்கிறார்
      '61':
        title: விசுவாசத்துடன் பாடுகளை ஏற்க இக்னாத்தியு விரும்புகிறார்
      '62':
        title: சிரியா சபை மேய்க்கப்படுவதற்காக ஜெபியுங்கள்
      '63':
        title: சிமிர்னாவிலிருந்து சிரியாவுக்கு வாழ்த்துகள்
      '64':
        title: பிலதெல்பியா அதன் ஒற்றுமைக்காகப் பாராட்டப்படுகிறது
      '65':
        title: ஆயர் நற்பண்புடன் தேவனுக்குச் சேவை செய்கிறார்
      '66':
        title: உங்கள் மேய்ப்பரை உண்மையுடன் பின்பற்றுங்கள்
      '67':
        title: தீங்கு விளைவிக்கும் போதனைகளை நிராகரியுங்கள்
      '68':
        title: ஒரே நற்கருணையில் ஒன்றாகப் பங்குகொள்ளுங்கள்
      '69':
        title: இயேசு கிறிஸ்துவின் சங்கிலிகளில் மகிழுங்கள்
      '70':
        title: யூதமதப் பழக்கத்தை நிராகரித்து கிறிஸ்துவை ஏற்றுக்கொள்ளுங்கள்
      '71':
        title: ஆவியானவர் மறைந்திருக்கும் உண்மைகளை வெளிப்படுத்துகிறார்
      '72':
        title: ஒற்றுமை பிரிவினைவாதத்தை நிராகரிக்கிறது
      '73':
        title: கிறிஸ்து அனைவரையும் தேவனில் ஒன்றிணைக்கிறார்
      '74':
        title: அந்தியோகியா சபைக்குச் சமாதானம் வருகிறது
      '75':
        title: பிலோவும் ராயுஸும் உண்மையுடன் மதிக்கப்படுகிறார்கள்
      '76':
        title: சிமிர்னா சபை நிறைவாக ஆசீர்வதிக்கப்படுகிறது
      '77':
        title: இயேசு கிறிஸ்துவின் உண்மையான மனித வருகை
      '78':
        title: கிறிஸ்துவின் பாடுகள் உண்மையாகவே நிகழ்ந்தவை
      '79':
        title: உயிர்த்தெழுந்த இயேசு உடலுடையவராகவே இருந்தார்
      '80':
        title: காட்டு மிருகங்கள் மனந்திரும்புமாறு எச்சரிக்கப்படுகின்றன
      '81':
        title: கிறிஸ்துவை மறுப்பது உயிர்த்தெழுதலை மறுப்பதாகும்
      '82':
        title: நற்கருணை கிறிஸ்துவின் மாம்சம்
      '83':
        title: பொய்ப் போதகர்களின் போதனைகளைத் தவிருங்கள்
      '84':
        title: கிறிஸ்துவைப் பின்பற்றுவதுபோல் ஆயரைப் பின்பற்றுங்கள்
      '85':
        title: விழித்தெழுந்து மனந்திரும்புங்கள்
      '86':
        title: கிறிஸ்துவின் ஊழியர்களை வரவேற்றுக்கொள்ளுங்கள்
      '87':
        title: அந்தியோகியாவுக்குச் சமாதானத் தூதரை அனுப்புங்கள்
      '88':
        title: சிறையிலுள்ள இக்னாத்தியுவை புர்ருஸ் ஊக்கப்படுத்துகிறார்
      '89':
        title: இக்னாத்தியு விசுவாசிகளைப் பெயர் சொல்லி வாழ்த்துகிறார்
      '90':
        title: இக்னாத்தியு ஆயர் பாலிகார்ப்புக்கு எழுதுகிறார்
      '91':
        title: நிலைத்த திருப்பணிக்கு இக்னாத்தியு ஊக்குவிக்கிறார்
      '92':
        title: ஞானத்தால் தீங்கைச் சீராக்குங்கள்
      '93':
        title: பட்டறைக் கல் போல உறுதியாக நில்லுங்கள்
      '94':
        title: கடவுளின் இசைவுடன் கைம்பெண்களைக் காத்திடுங்கள்
      '95':
        title: தீய பழக்கங்களைத் தவிர்த்து ஞானமாகத் திருமணம் செய்யுங்கள்
      '96':
        title: கீழ்ப்படிந்து பணியாற்றி ஒன்றாக உயருங்கள்
      '97':
        title: பாலிகார்ப்பு சிரியாவுக்குத் தூதரை அனுப்புகிறார்
      '98':
        title: மதிப்புக்குரிய செயல்களுக்காகத் தூதர்களை ஏற்பாடு செய்யுங்கள்
  Polycarp to the Philippians:
    display_name: பிலிப்பியருக்கு பாலிகார்ப்பின் கடிதம்
    author: சிமிர்னாவின் ஆயரான பாலிகார்ப்பு. கிடைத்துள்ள உரை, ஒன்றுக்கு மேற்பட்ட வேளைகளில் அனுப்பப்பட்ட பகுதிகளை இணைத்ததாக சில அறிஞர்கள் கருதுகின்றனர்.
    audience: இக்னாத்தியுவின் கடிதங்களைக் கேட்டுப் பெற்றதோடு, விசுவாசம், நடத்தை, தலைமைத்துவம், பணம், விடாமுயற்சி ஆகியவற்றைக் குறித்த அறிவுரையையும் பெற்ற பிலிப்பியிலிருந்த கிறிஸ்தவச் சபை.
    date: கி.பி. 2ஆம் நூற்றாண்டின் முற்பகுதி முதல் நடுப்பகுதி வரை; இதன் குறைந்தது ஒரு பகுதி இக்னாத்தியுவின் பயணத்துடன் நெருக்கமாகத் தொடர்புடையது. இது பல பகுதிகளை இணைத்த கடிதம் என்ற கருத்தை ஏற்றால், ஒரு பகுதி சற்றுப் பிந்தைய காலத்தைச் சேர்ந்ததாக இருக்கலாம்.
    chapters:
      '1':
        title: பிலிப்பியருக்கு பாலிகார்ப்பின் வாழ்த்து
      '2':
        title: பாவிகளுக்காகக் கிறிஸ்து துன்புற்றார்
      '3':
        title: பயபக்தியுடனும் உண்மையுடனும் கடவுளுக்குப் பணியாற்றுங்கள்
      '4':
        title: நீதியைக் குறித்து பாலிகார்ப்பு எழுதுகிறார்
      '5':
        title: கைம்பெண்கள் உண்மையுடன் இடைவிடாது மன்றாட வேண்டும்
      '6':
        title: திருத்தொண்டர்கள் இப்போதே குற்றமற்றவர்களாய்க் கிறிஸ்துவுக்குப் பணியாற்றட்டும்
      '7':
        title: மூப்பர்கள் அனைவரிடமும் இரக்கம் காட்டட்டும்
      '8':
        title: அந்திக்கிறிஸ்துவையும் பொய்ப் போதனைகளையும் மறுத்திடுங்கள்
      '9':
        title: நம்பிக்கையைப் பற்றிக்கொண்டு கிறிஸ்துவைப் பின்பற்றுங்கள்
      '10':
        title: விசுவாசமுள்ள புனிதர்களின் முன்மாதிரிகளைப் பின்பற்றுங்கள்
      '11':
        title: உறுதியாக நிலைத்து அன்பைப் பின்பற்றுங்கள்
      '12':
        title: பேராசையையும் சிலைவழிபாட்டையும் இப்போதே விலக்குங்கள்
      '13':
        title: பிலிப்பியரின் விசுவாசத்திற்காக பாலிகார்ப்பு மன்றாடுகிறார்
      '14':
        title: சிரியாவுக்கு அனுப்பப்பட்ட கடிதங்கள் எதிர்பார்க்கப்படுகின்றன
      '15':
        title: கிரெசென்ஸ் கடிதத்தைக் குற்றமின்றிக் கொண்டுசெல்கிறார்
  Martyrdom of Polycarp:
    display_name: பாலிகார்ப்பின் மறைச்சாட்சி மரணம்
    author: சிமிர்னா திருச்சபையைச் சேர்ந்த பெயர் அறியப்படாத உறுப்பினர்கள், தங்கள் சமூகத்தின் பெயரில் எழுதினர்; இறுதியில் உள்ள உரைப் பரம்பரைக் குறிப்புகள், பிற்கால நகலெடுப்பையும் பரவலையும் பிரதிபலிக்கின்றன.
    audience: பாலிகார்ப்பின் கைது, விசாரணை, மரணம், முன்மாதிரியான மனவுறுதி ஆகியவற்றின் விவரத்தைப் பெறும் பிலோமேலியம் திருச்சபையும் பரந்த கிறிஸ்தவ ஒன்றியமும்.
    date: பாலிகார்ப்பின் மரணத்துக்குப் பிறகு எழுதப்பட்டது; பொதுவாகக் கி.பி. 2ஆம் நூற்றாண்டின் நடுப்பகுதி அல்லது பிற்பகுதியைச் சேர்ந்ததாகக் கருதப்படுகிறது. மறைச்சாட்சி மரணம் நிகழ்ந்த துல்லியமான ஆண்டும், ஆவணத்தின் இறுதி வடிவமும் விவாதத்துக்குரியவை.
    chapters:
      '1':
        title: திருச்சபை அனைவருக்கும் இரக்கத்தை அனுப்புகிறது
      '2':
        title: பாலிகார்ப்பின் மறைச்சாட்சி மரணம் உறுதிப்படுத்தப்படுகிறது
      '3':
        title: கிறிஸ்துவுக்காக மறைச்சாட்சிகள் தாங்கி நிற்கின்றனர்
      '4':
        title: ஜெர்மானிக்குஸ் கொடிய விலங்குகளை எதிர்கொள்கிறார்
      '5':
        title: குவின்துஸ் துணிவிழக்கிறார்
      '6':
        title: பாலிகார்ப்பு அனைவருக்காகவும் மன்றாடுகிறார்
      '7':
        title: தம் வீட்டாராலேயே காட்டிக்கொடுக்கப்படுகிறார்
      '8':
        title: தமக்கு நேரவிருப்பதை பாலிகார்ப்பு ஏற்கிறார்
      '9':
        title: மறுதலிக்குமாறு ஏரோது பாலிகார்ப்பை வற்புறுத்துகிறார்
      '10':
        title: விண்ணகக் குரல் பாலிகார்ப்பை வலுப்படுத்துகிறது
      '11':
        title: கிறிஸ்துவைப் பழிக்க பாலிகார்ப்பு மறுக்கிறார்
      '12':
        title: மரண அச்சுறுத்தல்களை பாலிகார்ப்பு கேலி செய்கிறார்
      '13':
        title: பாலிகார்ப்பை எரிக்கக் கூட்டம் கோருகிறது
      '14':
        title: கம்பத்தில் கட்டப்பட்ட பாலிகார்ப்பு மன்றாடுகிறார்
      '15':
        title: கம்பத்தருகே பாலிகார்ப்பு மன்றாடுகிறார்
      '16':
        title: தீச்சுவாலைகள் பாலிகார்ப்பைச் சூழ்கின்றன
      '17':
        title: பாலிகார்ப்பின் இரத்தம் நெருப்பை அணைக்கிறது
      '18':
        title: மறுத்துவிடுமாறு நீதிபதியை நிக்கேத்தஸ் வற்புறுத்துகிறார்
      '19':
        title: கிறிஸ்தவர்கள் பாலிகார்ப்பின் எலும்புகளைச் சேகரிக்கின்றனர்
      '20':
        title: ஆட்சியாளரை வென்று பாலிகார்ப்பு மகுடம் பெறுகிறார்
      '21':
        title: விசுவாசிகளுக்கு மார்சியானுஸ் சுருக்கத்தை அனுப்புகிறார்
      '22':
        title: ஓய்வுநாளில் பாலிகார்ப்பு மறைச்சாட்சியாக மரிக்கிறார்
      '23':
        title: பாலிகார்ப்பைப் பின்பற்றி அரசில் நுழையுங்கள்
  Epistle to Diognetus:
    display_name: தியோக்நேத்துவுக்கு எழுதிய கடிதம்
    author: ஆசிரியர் பெயர் அறியப்படவில்லை. எழுதியவர் தம்மை ஒரு சீடர் அல்லது கற்றுக்கொள்பவர் எனக் கூறுகிறார்; ஆனால் அவரையோ, கடிதம் பெறும் தியோக்நேத்துவையோ உறுதியாக அடையாளம் காண முடியவில்லை.
    audience: கிறிஸ்தவ வழிபாடு, அறநெறி, சமூக அடையாளம், அன்பு, இந்த விசுவாசம் புதிதாகத் தோன்றுவதற்கான காரணம் ஆகியவற்றைப் பற்றி வினவிய கல்வியறிவுள்ள கிறிஸ்தவர் அல்லாத ஒருவரும், அவரைப் போன்ற வாசகர்களும்.
    date: இது பெரும்பாலும் கி.பி. 2ஆம் நூற்றாண்டின் பிற்பகுதி அல்லது 3ஆம் நூற்றாண்டின் முற்பகுதியைச் சேர்ந்ததாகக் கணிக்கப்படுகிறது; எனினும் முன்மொழியப்படும் காலங்கள் பெரிதும் வேறுபடுகின்றன. இறுதி இரண்டு அதிகாரங்களும் வேறொரு படைப்பிலிருந்து வந்திருக்கலாம்.
    chapters:
      '1':
        title: விசுவாசத்தைப் புரிந்துகொள்ள தியோக்நேத்து நாடுகிறார்
      '2':
        title: மனிதக் கைகளால் வடிவமைக்கப்பட்ட சிலைகள்
      '3':
        title: கிறிஸ்தவர்கள் பொய்யான வழிபாட்டை மறுக்கின்றனர்
      '4':
        title: கடவுளின் நல்ல கொடைகளைப் புறக்கணித்தல்
      '5':
        title: அந்நியர்களாக இருந்தும் முழுமையாகச் சேர்ந்தவர்கள்
      '6':
        title: ஆன்மா உலகுக்குள் உள்ளது
      '7':
        title: காணமுடியாத படைப்பாளரிடமிருந்து வரும் உண்மை
      '8':
        title: மறைந்த உண்மையை விசுவாசம் வெளிப்படுத்துகிறது
      '9':
        title: வியப்பூட்டும் அருளால் கிடைக்கும் மீட்பு
      '10':
        title: உண்மையான மகிழ்ச்சி அன்பிலிருந்து வருகிறது
      '11':
        title: அருள் திருச்சபையைத் தொடர்ந்து வளப்படுத்துகிறது
      '12':
        title: அறிவால் நிறைந்த இதயம் கனி தருகிறது
  Fragments of Papias:
    display_name: பாப்பியாசின் உரைத்துணுக்குகள்
    author: இழந்துபோன ஐந்து நூல்கள் கொண்ட ‘ஆண்டவரின் வாக்குகளின் விளக்கங்கள்’ என்ற படைப்பின் ஆசிரியரான எராப்போலியின் ஆயர் பாப்பியாசு. எஞ்சியுள்ள தொகுப்பு, பிற்கால ஆசிரியர்கள் பாதுகாத்த மேற்கோள்களையும் அறிக்கைகளையும் கொண்டுள்ளது.
    audience: பெயர் குறிப்பிடப்பட்ட வாய்மொழிச் சாட்சிப் பரம்பரைகள் மற்றும் விளக்கங்கள் வழியாகத் திரட்டப்பட்ட, இயேசுவையும் திருத்தூதர்களையும் பற்றிய நினைவில் நிலைத்த போதனைகளைத் தேடிய தொடக்ககாலக் கிறிஸ்தவர்கள்.
    date: பாப்பியாசின் படைப்பு பொதுவாகக் கி.பி. 2ஆம் நூற்றாண்டின் முற்பகுதியைச் சேர்ந்ததாகவும், பெரும்பாலும் ஏறத்தாழ கி.பி. 110–130 காலத்தைச் சேர்ந்ததாகவும் கணிக்கப்படுகிறது; எஞ்சியுள்ள உரைத்துணுக்குகள் கி.பி. 2ஆம் நூற்றாண்டிலிருந்தும் அதற்குப் பிந்தைய காலத்திலிருந்தும் எழுதிய ஆசிரியர்களின் படைப்புகளில் காணப்படுகின்றன.
    chapters:
      '1':
        title: யோவானின் ஆட்சிக்குப் பிறகு தலைவர்கள் எழுகின்றனர்
      '2':
        title: ஆண்டவரின் போதனைகளைப் பாப்பியாசு எழுதுகிறார்
      '3':
        title: விபசாரப் பெண்ணை இயேசு காப்பாற்றுகிறார்
      '4':
        title: மூப்பர் யோவானின் மரபுகளைப் பாப்பியாசு போதிக்கிறார்
      '5':
        title: பாப்பியாசின் படைப்பை எரோனிமுஸ் விவரிக்கிறார்
      '6':
        title: பாப்பியாசிடமிருந்து இரனேயு கற்றுக்கொள்கிறார்
      '7':
        title: பாப்பியாசின் சாட்சியத்தை அந்திரேயாஸ் மேற்கோள் காட்டுகிறார்
      '8':
        title: சாத்தானின் தோல்வியுடன் வானதூதர்கள் வீழ்கின்றனர்
      '9':
        title: நாட்களைக் கிறிஸ்துவோடு விளக்கவுரையாளர்கள் தொடர்புபடுத்துகின்றனர்
      '10':
        title: பரதீசு திருச்சபையாக விளக்கப்படுகிறது
      '11':
        title: வரவிருக்கும் அரசைப் பாப்பியாசு விவரிக்கிறார்
      '12':
        title: குழந்தை போன்ற விசுவாசத்தைப் பாப்பியாசு வரையறுக்கிறார்
      '13':
        title: பாப்பியாசின் போதனையை மாக்சிமுஸ் மேற்கோள் காட்டுகிறார்
      '14':
        title: பாப்பியாசின் கருத்தை போத்தியுஸ் மறுக்கிறார்
      '15':
        title: யூதாசின் முடிவை அப்பொலினாரியுஸ் விவரிக்கிறார்
      '16':
        title: பாப்பியாசுக்கு யோவான் நற்செய்தியைச் சொல்லி எழுதுவிக்கிறார்
