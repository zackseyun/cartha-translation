      '148':
        title: படைப்பு அனைத்தும் கர்த்தரைத் துதிக்கிறது
      '149':
        title: அனைவரும் யாவைப் துதிக்கட்டும்
      '150':
        title: எல்லா இசைக்கருவிகளுடனும் யாவைப் துதியுங்கள்
  Proverbs:
    display_name: நீதிமொழிகள்
    author: ஒரு தொகுப்பு; தலைப்புரைகள் சாலொமோன், ஆகூர், லெமுவேல் மற்றும் "ஞானிகள்" ஆகியோரைக் குறிப்பிடுகின்றன.
    audience: அன்றாட வாழ்க்கைக்கான ஞானத்தில் உருவாக்கப்பட்டு வந்த இளம் இஸ்ரவேலர்கள்.
    date: இதன் பல்வேறு பகுதிகள் கி.மு. சுமார் 10ஆம் நூற்றாண்டு முதல் 4ஆம் நூற்றாண்டு வரை இயற்றப்பட்டன.
    chapters:
      '1':
        title: கர்த்தருக்குப் பயப்பட சாலொமோன் போதிக்கிறார்
      '2':
        title: தேவனை நாடுவதால் ஞானம் கிடைக்கிறது
      '3':
        title: தேவனை நம்பி ஞானத்தைப் பெறுங்கள்
      '4':
        title: எல்லாவற்றுக்கும் மேலாக ஞானத்தை நாடும்படி தந்தை வலியுறுத்துகிறார்
      '5':
        title: விபசாரத்துக்கு எதிராகத் தந்தை எச்சரிக்கிறார்
      '6':
        title: பாவத்துக்கும் சோம்பலுக்கும் எதிரான எச்சரிக்கைகள்
      '7':
        title: விபசார மயக்கத்திலிருந்து வெகுதூரம் விலகியிருங்கள்
      '8':
        title: ஞானத்தை நாடுவோரை அது அழைக்கிறது
      '9':
        title: ஞானம் அழைக்கிறது; மூடத்தனம் வசீகரிக்கிறது
      '10':
        title: நீதிக்கும் துன்மார்க்கத்துக்கும் இடையிலான வேறுபாடுகள்
      '11':
        title: நேர்மை ஆசீர்வாதத்துக்கு வழிநடத்துகிறது
      '12':
        title: நீதிமான்கள் ஞானமாகவும் நலமாகவும் வாழ்கிறார்கள்
      '13':
        title: கற்றுக்கொள்ளும் மனப்பான்மை வாழ்வுக்கு வழிநடத்துகிறது
      '14':
        title: ஞானம் வீட்டைக் கட்டுகிறது; கர்த்தருக்கு அஞ்சுகிறது
      '15':
        title: கனிவான பேச்சு வாழ்வைத் தருகிறது
      '16':
        title: திட்டங்களை மனிதர் வகுக்கிறார்; விளைவுகளை தேவன் வழிநடத்துகிறார்
      '17':
        title: தேவனுக்குப் பயப்படுதல் ஞானத்தைத் தருகிறது
      '18':
        title: ஞானம் செவிகொடுக்கிறது; மூடத்தனம் திருத்தத்தை மறுக்கிறது
      '19':
        title: செல்வத்தைவிட நேர்மையே எப்போதும் சிறந்தது
      '20':
        title: குடிவெறியைத் தவிர்த்து, நேர்மையை மதியுங்கள்
      '21':
        title: தேவன் இருதயங்களை நியாயந்தீர்த்து, நீதியை மதிக்கிறார்
      '22':
        title: தாழ்மை தேவனை அதிகமாகக் கனப்படுத்துகிறது
      '23':
        title: அளவில்லா ஆசைக்கும் பேராசைக்கும் எதிரான எச்சரிக்கை
      '24':
        title: துன்மார்க்கர்மீது பொறாமைப்படாதீர்கள்
      '25':
        title: ஞானம் தாழ்மைக்கு அழைக்கிறது
      '26':
        title: மூடர்கள் தங்களுக்கும் பிறருக்கும் தீங்கு செய்கிறார்கள்
      '27':
        title: தாழ்மையையும் எதார்த்தப் பார்வையையும் கற்பிக்கிறது
      '28':
        title: கர்த்தரை நாடுவதால் நீதிமான்கள் வெற்றி பெறுகிறார்கள்
      '29':
        title: பிடிவாதம் அழிவுக்கு வழிநடத்துகிறது
      '30':
        title: ஆகூர் ஆழ்ந்த தாழ்மையுடன் பேசுகிறார்
      '31':
        title: நீதியை நிலைநாட்டும்படி அரசனைத் தாய் எச்சரிக்கிறார்
  Ecclesiastes:
    display_name: பிரசங்கி
    author: ஆசிரியர் பெயர் தெரியவில்லை; உரையாற்றுபவர் "கோஹெலெத்"; மரபுப்படி இவர் சாலொமோனாக அடையாளப்படுத்தப்படுகிறார்.
    audience: சூரியனுக்குக் கீழே ஞானம், செல்வம், முயற்சி ஆகியவற்றின் வரம்புகளை எதிர்கொள்ளும் இஸ்ரவேலர்கள்.
    date: அரமேய மொழியின் தாக்கமுள்ள எபிரெய மொழிநடையை அடிப்படையாகக் கொண்டு, இது கி.மு. சுமார் 5ஆம் நூற்றாண்டு முதல் 3ஆம் நூற்றாண்டு வரையிலானதாக இருக்கலாம்.
    chapters:
      '1':
        title: சூரியனுக்குக் கீழே எல்லாம் வீண்
      '2':
        title: இன்பம் நிலையான பலனைத் தருவதில்லை
      '3':
        title: ஒவ்வொரு நோக்கத்துக்கும் உரிய காலம் வருகிறது
      '4':
        title: கொடுமையான ஒடுக்குதலால் நிறைந்த வாழ்க்கை
      '5':
        title: தேவனுக்கு அஞ்சி, நேர்த்திக்கடன்களை நிறைவேற்றுங்கள்
      '6':
        title: அனுபவிக்க முடியாத செல்வம் கசப்பானது
      '7':
        title: பெருமையைவிட ஞானம் சிறந்தது
      '8':
        title: தாழ்மையாக வாழ ஞானம் கற்பிக்கிறது
      '9':
        title: நீதிமான்களும் துன்மார்க்கரும் ஒரே முடிவை எதிர்கொள்கிறார்கள்
      '10':
        title: மூடத்தனம் ஞானத்தை விரைவில் பாழாக்குகிறது
      '11':
        title: முடியும் காலத்திலேயே துணிந்து செயல்படுங்கள்
      '12':
        title: இளமையில் படைத்தவரை நினைவுகூருங்கள்
  Song of Solomon:
    display_name: சாலொமோனின் உன்னதப்பாட்டு
    author: ஆசிரியர் பெயர் தெரியவில்லை; தலைப்புரை சாலொமோனைக் குறிப்பிடுகிறது.
    audience: காமமயமான காதலை உடன்படிக்கை நெருக்கத்தின் கண்ணோட்டமாக வாசிக்கும் இஸ்ரவேல்—பிற்காலத்தில் இதை உருவகமாக வாசித்த யூத மற்றும் கிறிஸ்தவ வாசகர்களும்.
    date: நாடுகடத்தலுக்குப் பிந்தைய காலத்தைச் சேர்ந்ததாக இருக்கலாம்; கி.மு. சுமார் 5ஆம் நூற்றாண்டு முதல் 3ஆம் நூற்றாண்டு வரை.
    chapters:
      '1':
        title: பெண் தன் அன்புக்குரிய காதலனைத் தேடுகிறாள்
      '2':
        title: காதலர்கள் ஆழ்ந்த பாராட்டைப் பரிமாறிக்கொள்கிறார்கள்
      '3':
        title: நகரத்தில் பெண் தன் அன்புக்குரியவரைக் கண்டுபிடிக்கிறாள்
      '4':
        title: மணமகளின் உடலழகை ஆண் போற்றுகிறான்
      '5':
        title: காணாமற்போன காதலனைப் பெண் தேடுகிறாள்
      '6':
        title: தனித்துவமான அர்ப்பணிப்புள்ள அன்பை ஆண் கொண்டாடுகிறான்
      '7':
        title: அன்புக்குரிய ஆண் பெண்ணின் அழகைப் போற்றுகிறான்
      '8':
        title: தன் அன்பை வெளிப்படையாகக் காட்டப் பெண் ஏங்குகிறாள்
  Isaiah:
    display_name: ஏசாயா
    author: பல நூற்றாண்டுகளில் பல ஆசிரியர்கள்; 1–39 அதிகாரங்கள் கி.மு. 8ஆம் நூற்றாண்டில் வாழ்ந்த எருசலேமைச் சேர்ந்த ஏசாயாவை அடிப்படையாகக் கொண்டவை; 40–55 ("இரண்டாம் ஏசாயா") மற்றும் 56–66 ("மூன்றாம் ஏசாயா") சிறையிருப்பையும் திரும்பிவருதலையும் பின்னணியாகக் கொண்டவை.
    audience: அசீரிய அச்சுறுத்தலின் கீழிருந்த யூதா, பாபிலோனியச் சிறையிருப்பில் இருந்தவர்கள், சிறையிருப்புக்குப் பிந்தைய மறுசீரமைப்புக் காலத்தினர் — அடுத்தடுத்த காலங்களில்.
    date: ஏறத்தாழ கி.மு. 8ஆம் நூற்றாண்டின் பிற்பகுதி முதல் 5ஆம் நூற்றாண்டுவரை இயற்றப்பட்டது.
    chapters:
      '1':
        title: கலகம் செய்த யூதாவைக் கடவுள் நிராகரிக்கிறார்
      '2':
        title: ஆண்டவரின் இல்லம் அனைத்திற்கும் மேலாக உயர்த்தப்படுகிறது
      '3':
        title: தீர்ப்பு தேசத்தின் வீழ்ச்சியைக் கொண்டுவருகிறது
      '4':
        title: அழிவுக்குப் பிறகு மறுசீரமைப்பு வாக்களிக்கப்படுகிறது
      '5':
        title: ஆண்டவரின் திராட்சைத்தோட்டம் வன்முறையை விளைவிக்கிறது
      '6':
        title: கடவுளின் திகைப்பூட்டும் மகிமையை ஏசாயா காண்கிறார்
      '7':
        title: அசீரியா வருமுன் இம்மானுவேல் பிறக்கிறார்
      '8':
        title: மகேர்-சாலால்-அஷ்-பாஸ் என்ற பெயர் தீர்ப்பை அறிவிக்கிறது
      '9':
        title: ஒளி நம்பிக்கையைக் கொண்டுவருகிறது — ஏசாயா
      '10':
        title: பெருமைகொண்ட அசீரியாவைக் கடவுள் நியாயந்தீர்க்கிறார்
      '11':
        title: புதிய அரசர் பூமியில் சமாதானத்தைக் கொண்டுவருகிறார்
      '12':
        title: கடவுளின் மக்கள் தங்கள் மீட்புக்காக அவரைப் போற்றுகிறார்கள்
      '13':
        title: பாபிலோன் முழுமையான அழிவை எதிர்கொள்கிறது
      '14':
        title: வீழ்ந்த பாபிலோன் அரசனை இஸ்ரவேல் ஏளனம் செய்கிறது
      '15':
        title: மோவாப் திடீரெனக் கொடிய பேரழிவைச் சந்திக்கிறது
      '16':
        title: மோவாபின் பெருமை கடுமையான தீர்ப்பைக் கொண்டுவருகிறது
      '17':
        title: தமஸ்குவும் எப்பிராயீமும் முற்றிலும் சூறையாடப்படுகின்றன
      '18':
        title: தொலைதூர நாடு தூதர்களை நெடுந்தொலைவுக்கு அனுப்புகிறது
      '19':
        title: எகிப்து தாழ்த்தப்பட்டு பின்னர் குணமடைகிறது
      '20':
        title: ஏசாயா அடையாளமாக ஆடையின்றி நடக்கிறார்
      '21':
        title: பாபிலோன் திடீரென வீழ்கிறது; விருந்து முடிகிறது
      '22':
        title: எருசலேமின் ஆரவாரம் தீர்ப்பைக் கொண்டுவருகிறது
      '23':
        title: தீருவின் செல்வமும் அதிகாரமும் வீழ்கின்றன
      '24':
        title: பூமி எங்கும் பரவும் முழுமையான தீர்ப்பை எதிர்கொள்கிறது
      '25':
        title: ஆண்டவர் விருந்து அளித்து மரணத்தை நீக்குகிறார்
      '26':
        title: கடவுள் தம் மக்களைப் பாதுகாக்கிறார்
      '27':
        title: லிவியாதான் தோற்கடிக்கப்படுகிறது; இஸ்ரவேல் காக்கப்படுகிறது
      '28':
        title: பெருமைகொண்ட தலைவர்கள் கடவுளின் வார்த்தையை ஏளனம் செய்கிறார்கள்
      '29':
        title: முற்றுகையின்போது எருசலேம் தாழ்த்தப்படுகிறது
      '30':
        title: எகிப்தை நம்பும் யூதா அழிவை எதிர்கொள்கிறது
      '31':
        title: சீயோனுக்காகக் கடவுள் ஒருவரே போரிடுகிறார்
      '32':
        title: நீதியுள்ள அரசர் நியாயத்தைக் கொண்டுவருகிறார்
      '33':
        title: வன்முறை தீயவர்கள்மீதே திரும்புகிறது
      '34':
        title: ஆண்டவர் ஏதோமைக் கடுமையாக நியாயந்தீர்க்கிறார்
      '35':
        title: வனாந்தரம் மகிமையுடன் மலர்கிறது
      '36':
        title: யூதாவின் நம்பிக்கையை ரப்சாக்கே ஏளனம் செய்கிறான்
      '37':
        title: எசேக்கியா ஜெபிக்கிறார்; கடவுள் பதிலளிக்கிறார்
      '38':
        title: எசேக்கியாவின் நோயும் குணமடைதலும்
      '39':
        title: எசேக்கியாவின் செல்வங்களைப் பாபிலோன் காண்கிறது
      '40':
        title: கடவுளின் மக்களுக்கு ஆறுதல் வருகிறது
      '41':
        title: ஆண்டவர் ஒருவரே வரலாற்றை ஆளுகிறார்
      '42':
        title: பணியாளர் மென்மையாக நீதியைக் கொண்டுவருகிறார்
      '43':
        title: இஸ்ரவேலுடன் எப்போதும் இருப்பதாகக் கடவுள் வாக்களிக்கிறார்
      '44':
        title: ஆண்டவர் ஒருவரே உண்மையான கடவுள்
      '45':
        title: இஸ்ரவேலை விடுவிக்க கோரேசு தேர்ந்தெடுக்கப்படுகிறார்
      '46':
        title: வாழ்நாள் முழுவதும் இஸ்ரவேலை ஆண்டவர் சுமக்கிறார்
      '47':
        title: பழிவாங்குதலின்கீழ் பாபிலோன் வீழ்கிறது
      '48':
        title: இஸ்ரவேலின் பிடிவாதம் கண்டிக்கப்படுகிறது
      '49':
        title: பணியாளரின் பணி மிகப் பெரியது
      '50':
        title: துன்பத்தின் நடுவிலும் பணியாளர் நம்புகிறார்
      '51':
        title: ஆபிரகாமின் உண்மைத்தன்மையை நினைவுகூருங்கள்
      '52':
        title: சிறையிருப்பிலிருந்து எருசலேம் விழித்தெழுகிறது
      '53':
        title: துன்புறும் பணியாளர் பாவத்தைச் சுமக்கிறார்
      '54':
        title: கைவிடப்பட்ட தம் மணமகளைக் கடவுள் மீட்டெடுக்கிறார்
      '55':
        title: வாருங்கள், வாழ்வை இலவசமாகப் பெற்றுக்கொள்ளுங்கள்
      '56':
        title: உண்மையுடன் வழிபடும் அந்நியர்களைக் கடவுள் வரவேற்கிறார்
      '57':
        title: நீதியாக வாழுங்கள்; மீட்பு அருகில் உள்ளது
      '58':
        title: கடவுளின் மக்கள் மீட்டெடுக்கப்படுவார்கள்
      '59':
        title: நீதியையும் இரக்கத்தையும் உண்மையுடன் நாடுங்கள்
      '60':
        title: சீயோனுக்கு உதவ மீட்பர் வருகிறார்
      '61':
        title: குணமாக்குவதற்காகப் பணியாளரைக் கடவுள் அருள்பொழிவு செய்கிறார்
      '62':
        title: சீயோனைக் கனப்படுத்துவதாக ஆண்டவர் ஆணையிட்டு உறுதிசெய்கிறார்
      '63':
        title: போர்வீரரான கடவுள் கடுங்கோபத்துடன் திரும்புகிறார்
      '64':
        title: பரிசுத்த கடவுள் திரும்பிவர வேண்டிய ஜெபம்
      '65':
        title: உண்மையுள்ள மீதியானோருக்குப் புதிய வானங்கள்
      '66':
        title: ஆண்டவர் சீயோனை நியாயந்தீர்த்து மீட்டெடுக்கிறார்
  Jeremiah:
    display_name: எரேமியா
    author: ஆனதோத்தைச் சேர்ந்த எரேமியா; அவருடைய எழுத்தர் பாரூக்கும் பிற்காலத்தவர்களும் கணிசமான அளவில் தொகுத்திருக்கலாம்.
    audience: பாபிலோனியப் படையெடுப்புக்கு முன்னரும், அதன் போதும், அதற்குப் பின்னரும் வாழ்ந்த யூதா மக்கள்.
    date: கி.மு. 7ஆம் நூற்றாண்டின் பிற்பகுதி முதல் 6ஆம் நூற்றாண்டின் முற்பகுதிவரை.
    chapters:
      '1':
        title: எரேமியாவைக் கடவுள் தீர்க்கதரிசியாக நியமிக்கிறார்
      '2':
        title: ஜீவத்தண்ணீரை எருசலேம் கைவிடுகிறது
      '3':
        title: உண்மையுள்ள கடவுளிடம் இஸ்ரவேல் திரும்புகிறது
      '4':
        title: வரவிருக்கும் தீர்ப்பை யூதா எதிர்கொள்கிறது
      '5':
        title: எருசலேம் சீர்கேட்டால் நிறைந்துள்ளது
      '6':
        title: வடக்கிலிருந்து படை வரும்
      '7':
        title: ஆலயத்தில் எரேமியா எச்சரிக்கிறார்
      '8':
        title: யூதாவின் தீர்ப்பு முழுமையடைந்தது
      '9':
        title: மக்கள் துரோகத்தால் நிறைந்திருக்கிறார்கள்
      '10':
        title: சிலைகள் மனிதர் செய்தவை; வெறுமையானவை
      '11':
        title: யூதா உடன்படிக்கையை மீறிவிட்டது
      '12':
        title: தீயவர்கள் ஏன் செழிக்கிறார்கள்?
      '13':
        title: பெருமையால் யூதா பயனற்றதாகிறது
      '14':
        title: வறட்சி யூதாவைக் கடும் தவிப்புக்கு உள்ளாக்குகிறது
      '15':
        title: தீர்ப்பு இப்போது தவிர்க்க முடியாதது
      '16':
        title: யூதாமீது கொடிய தீர்ப்பு வருகிறது
      '17':
        title: யூதா கடவுளின் தீர்ப்பை எதிர்கொள்கிறது
      '18':
        title: பிடிவாதமுள்ள யூதாவை எரேமியா எச்சரிக்கிறார்
      '19':
        title: நகரத்தின்மீது கொடிய தீர்ப்பு வருகிறது
      '20':
        title: எரேமியா தீர்ப்பை அறிவிக்கிறார்
      '21':
        title: செதேக்கியா அரசன் உதவி கேட்கிறான்
      '22':
        title: நீதியுடனும் இரக்கத்துடனும் ஆட்சி செய்யுங்கள்
      '23':
        title: பொய்யான மேய்ப்பர்களைக் கடவுள் நியாயந்தீர்க்கிறார்
      '24':
        title: நல்ல அத்திப்பழங்கள் நாடுகடத்தப்பட்ட மக்களைக் குறிக்கின்றன
      '25':
        title: நேபுகாத்நேச்சார் யூதாவுக்கு எதிராக வருவான்
      '26':
        title: ஆலயத்தில் எரேமியா எச்சரிக்கிறார்
      '27':
        title: பாபிலோனின் ஆட்சிக்கு அடிபணியுங்கள்
      '28':
        title: பொய்த் தீர்க்கதரிசனம் சொன்னதால் அனனியா இறக்கிறான்
      '29':
        title: பாபிலோனிலுள்ள நாடுகடத்தப்பட்டவர்களை எரேமியா எச்சரிக்கிறார்
      '30':
        title: எதிர்கால மீட்பைக் கடவுள் வாக்களிக்கிறார்
      '31':
        title: இஸ்ரவேலின் மறுசீரமைப்பைக் கடவுள் வாக்களிக்கிறார்
      '32':
        title: நம்பிக்கையுடன் எரேமியா நிலம் வாங்குகிறார்
      '33':
        title: பாழான நகரத்துக்குக் குணமளிப்பதாக வாக்குறுதி
      '34':
        title: சிதேக்கியாவுக்குத் தீர்ப்பும் எச்சரிக்கையும்
      '35':
        title: ரேகாபியர்கள் உண்மையுடன் கீழ்ப்படிதல்
      '36':
        title: எச்சரிப்புச் சுருளை எழுதும் பாரூக்கு
      '37':
        title: சிதேக்கியா அரசனை எச்சரிக்கும் எரேமியா
      '38':
        title: நீர்த்தொட்டிக்குள் எறியப்படும் எரேமியா
      '39':
        title: எரேமியாவைக் காப்பாற்றும் எபெத்மெலேக்கு
      '40':
        title: எருசலேம் வீழ்ந்தபின் விடுவிக்கப்படும் எரேமியா
      '41':
        title: கெதலியாவை வஞ்சகமாகக் கொல்லும் இஸ்மவேல்
      '42':
        title: எகிப்துக்குத் தப்பியோட வேண்டாமென எரேமியா எச்சரித்தல்
      '43':
        title: எரேமியாவை எகிப்துக்கு இழுத்துச் செல்லும் கலகக்காரர்கள்
      '44':
        title: கடவுளின் கட்டளைக்குக் கீழ்ப்படிய மறுத்தல்
      '45':
        title: துயரத்தால் சோர்ந்துபோன பாரூக்கு
      '46':
        title: பெருமைமிக்க எகிப்தியப் பேரரசைக் கடவுள் தீர்ப்பிடுதல்
      '47':
        title: தடுக்க முடியாத வெள்ளத்தை எதிர்கொள்ளும் பெலிஸ்தியர்கள்
      '48':
        title: மோவாபின் அழிவும் எதிர்கால நம்பிக்கையும்
      '49':
        title: யூதாவைச் சூழ்ந்த நாடுகள்மீது தீர்ப்பு
      '50':
        title: பாபிலோன் வீழ்கிறது; கடவுள் வெல்கிறார்
      '51':
        title: இறைத் தீர்ப்பால் பாபிலோன் வீழ்தல்
      '52':
        title: எருசலேம் வீழ்ந்து ஆலயம் எரிக்கப்படுதல்
  Lamentations:
    display_name: புலம்பல்
    author: ஆசிரியர் பெயர் தெரியவில்லை; எரேமியா எழுதியதாக மரபு கூறுகிறது.
    audience: கி.மு. 586-ல் எருசலேம் அழிக்கப்பட்டதற்காகத் துயருற்ற யூதேய மக்கள்.
    date: கி.மு. 586-க்குச் சற்றுப் பிந்தைய காலம்.
    chapters:
      '1':
        title: கைவிடப்பட்ட எருசலேம் தனிமையில் அழுகிறது
      '2':
        title: சீயோன்மீது ஆண்டவர் தமது சினத்தைக் கொட்டுதல்
      '3':
        title: காலையின் இரக்கங்களிலிருந்து பிறக்கும் நம்பிக்கை
      '4':
        title: அருமையான சீயோன் பாழாகிப் பட்டினியால் வாடுதல்
      '5':
        title: ஆண்டவரே, கேளும் என மக்கள் கதறுதல்
  Ezekiel:
    display_name: எசேக்கியேல்
    author: பாபிலோனுக்குச் சிறைப்பட்டுச் சென்ற ஆசாரியரான எசேக்கியேல்; பின்னர் பதிப்பாசிரியர் பணியால் நூல் மேலும் வளர்ச்சியடைந்தது.
    audience: ஆலயம் இல்லாத நிலையிலும் கடவுளின் பிரசன்னத்தைப் புதிதாகப் புரிந்துகொள்ள முயன்ற, பாபிலோனில் சிறைப்பட்டிருந்த யூதேயர்கள்.
    date: தீர்க்கதரிசியின் பணிக்காலம் ஏறத்தாழ கி.மு. 593–571; நூலின் இறுதி வடிவம் இதற்குச் சற்றுப் பிந்தையது.
    chapters:
      '1':
        title: விண்ணுலகக் காட்சியைக் காணும் எசேக்கியேல்
      '2':
        title: கடவுளிடமிருந்து பணிப்பொறுப்பைப் பெறும் எசேக்கியேல்
      '3':
        title: புலம்பல்கள் எழுதப்பட்ட சுருளை உண்ணும் எசேக்கியேல்
      '4':
        title: எருசலேமின் முற்றுகையை நடித்துக் காட்டும் எசேக்கியேல்
      '5':
        title: அடையாளமாகத் தலைமுடியை மழிக்கும் எசேக்கியேல்
      '6':
        title: இஸ்ரவேலுக்கு எதிராக இறைவாக்குரைக்கும் எசேக்கியேல்
      '7':
        title: வரவிருக்கும் தீர்ப்பைக் கடவுள் அறிவித்தல்
      '8':
        title: ஆலயத்தின் அருவருப்புகளைக் காணும் எசேக்கியேல்
      '9':
        title: எருசலேமின் பாவத்திற்குத் தண்டனை வழங்குவோர்
      '10':
        title: மகிமை தீர்ப்பின் நெருப்புத் தணல்களைச் சிதறடித்தல்
      '11':
        title: நகரத்தின் அழிவை முன்னறிவிக்கும் எசேக்கியேல்
      '12':
        title: சிறையிருப்பை நடித்துக் காட்டும் எசேக்கியேல்
      '13':
        title: பொய்த் தீர்க்கதரிசிகளைக் கண்டிக்கும் எசேக்கியேல்
      '14':
        title: இஸ்ரவேலின் உண்மையின்மையைக் கடவுள் தீர்ப்பிடுதல்
      '15':
        title: பயனற்ற திராட்சைக்கொடிக்கு ஒப்பிடப்படும் எருசலேம்
      '16':
        title: எருசலேமின் உண்மையின்மைக்காகக் கடவுள் புலம்புதல்
      '17':
        title: கழுகுகளைப் பற்றிய எசேக்கியேலின் விடுகதை
      '18':
        title: ஒவ்வொருவரையும் கடவுள் தீர்ப்பிடுதல்
      '19':
        title: இஸ்ரவேலின் இளவரசர்களின் தோல்வியும் வீழ்ச்சியும்
      '20':
        title: இஸ்ரவேலின் கலகமிக்க கடந்தகாலத்தை எடுத்துரைக்கும் கடவுள்
      '21':
        title: நாடுகளுக்கு எதிராக வரும் தீர்ப்பின் வாள்
      '22':
        title: இரத்தக்கறை படிந்த நகரமாக வெளிப்படும் எருசலேம்
      '23':
        title: சிலைகளை மோகித்த இரு சகோதரிகள்
      '24':
        title: அடையாளமாக எசேக்கியேலின் மனைவி எடுத்துக்கொள்ளப்படுதல்
      '25':
        title: யூதாவைச் சூழ்ந்த நாடுகள் தீர்ப்பை எதிர்கொள்ளுதல்
      '26':
        title: மகிழ்ச்சி கொண்டாடிய தீருவைக் கடவுள் தீர்ப்பிடுதல்
      '27':
        title: மகத்துவமிக்க தீருவுக்கான இரங்கற்பாடல்
      '28':
        title: தீருவின் ஆட்சியாளரை எதிர்கொள்ளும் எசேக்கியேல்
      '29':
        title: பார்வோனின் பெருமையால் எகிப்து வீழ்தல்
      '30':
        title: பார்வோனிடமிருந்து அதிகாரம் பறிக்கப்படுதல்
      '31':
        title: அசீரியா வீழ்கிறது; பார்வோன் எச்சரிக்கப்படுகிறார்
      '32':
        title: பாபிலோனிடம் பார்வோன் வீழ்தல்
      '33':
        title: காவலிருந்து தீயவர்களை எச்சரிக்கும் எசேக்கியேல்
      '34':
        title: மேய்ப்பர்கள் தவறுகின்றனர்; கடவுளே மேய்ப்பார்
      '35':
        title: ஏதோமின் பகை; விரைவில் வரும் பாழாக்கம்
      '36':
        title: இஸ்ரவேல் மீட்கப்படுகிறது; மலைகள் கனிதருகின்றன
      '37':
        title: உலர்ந்த எலும்புகள் உயிர்பெறுகின்றன; நாடு ஒன்றிணைகிறது
      '38':
        title: கோகு இஸ்ரவேலைத் தாக்குகிறான்; பரிசுத்த கடவுள் காக்கிறார்
      '39':
        title: கோகு அழிக்கப்படுகிறான்; நாடுகள் ஆண்டவரை அறிகின்றன
      '40':
        title: உயர்ந்த மலையில் தொடங்கும் அளவீட்டுக் காட்சி
      '41':
        title: பரிசுத்த மகிமை நிறைந்த ஆலயத்தின் உட்புறம் அளக்கப்படுதல்
      '42':
        title: ஆசாரியர்களின் அறைகள் அளக்கப்பட்டுத் தனியாக ஒதுக்கப்படுதல்
      '43':
        title: மகிமை திரும்புகிறது; ஆலயம் பரிசுத்தத்தால் நிறைகிறது
      '44':
        title: மூடிய வாசலைக் காணும் எசேக்கியேல்
      '45':
        title: கடவுளுக்கும் மக்களுக்கும் உரிய நிலம்
      '46':
        title: வழிபாட்டு ஒழுங்கு; தலைவரும் வழிபடுகிறார்
      '47':
        title: உயிரளிக்கும் தண்ணீர் பாய்ந்து வாழ்வைக் கொண்டுவருதல்
      '48':
        title: பரிசுத்தப் பகுதியை மையமாகக் கொண்டு நிலம் பகிர்ந்தளிக்கப்படுதல்
  Daniel:
    display_name: தானியேல்
    author: ஆசிரியர் பெயர் தெரியவில்லை; சிறையிருப்புக் காலத்தைச் சேர்ந்த தானியேல் கூறுவதாக இந்நூல் தன்னை முன்வைக்கிறது.
    audience: கிரேக்கப் பண்பாட்டுச் செல்வாக்குள்ள ஆட்சியின்கீழ் துன்புறுத்தப்பட்ட யூதர்கள்—குறிப்பாக நான்காம் அந்தியோக்கஸ் எப்பிபானெஸ் ஆட்சியில் (கி.மு. 167–164).
    date: ஏறத்தாழ கி.மு. 165-ல் இன்று கிடைத்துள்ள வடிவத்தை அடைந்தது; 1–6 அதிகாரங்களில் இதைவிடப் பழமையான அரண்மனைக் கதைகள் இடம்பெற்றுள்ளன.
    chapters:
      '1':
        title: அரசனின் உணவை மறுக்கும் தானியேல்
      '2':
        title: மறைக்கப்பட்ட கனவை வெளிப்படுத்தும் தானியேல்
      '3':
        title: நண்பர்களை எறியும் நேபுகாத்நேச்சார்
      '4':
        title: தாழ்மையைக் கற்றுக்கொள்ளும் நேபுகாத்நேச்சார்
      '5':
        title: வீழ்ந்து இறக்கும் பெல்ஷாத்சார்
      '6':
        title: சிங்கக் குகையிலிருந்து தப்பும் தானியேல்
      '7':
        title: கடலிலிருந்து எழும் நான்கு மிருகங்கள்
      '8':
        title: செம்மறியாட்டுக்கடாவும் வெள்ளாட்டுக்கடாவும் பற்றிய காட்சி
      '9':
        title: எருசலேமுக்காக மன்றாடும் தானியேல்
      '10':
        title: தானியேலை வலுப்படுத்தும் தூதர்
      '11':
        title: எதிர்காலப் பேரரசுகளின் மோதல்
      '12':
        title: கடவுளின் மக்களைக் காக்கும் மிகாவேல்
  Hosea:
    display_name: ஓசியா
    author: பெயேரியின் மகன் ஓசியா.
    audience: அசீரியர்கள் கைப்பற்றுவதற்கு முந்தைய இறுதிப் பத்தாண்டுகளில் இருந்த இஸ்ரவேலின் வடக்கு அரசு.
    date: ஏறத்தாழ கி.மு. 750–722.
    chapters:
      '1':
        title: உண்மையற்ற கோமேரை மணக்கும் ஓசியா
      '2':
        title: காதலர்களைப் பின்தொடர்ந்து கடவுளை மறக்கும் இஸ்ரவேல்
      '3':
        title: உண்மையற்ற பெண்ணை மீண்டும் மீட்கும் ஓசியா
      '4':
        title: இஸ்ரவேலில் உண்மையும் பற்றுறுதியும் மறைதல்
      '5':
        title: ஆசாரியர்களும் மக்களும் பாவத்திற்கு வழிநடத்துதல்
      '6':
        title: திரும்பி வந்து உண்மையான அன்பைத் தேடுங்கள்
      '7':
        title: இஸ்ரவேலின் பாவம் வெளிப்பட்டு தண்டிக்கப்படுதல்
      '8':
        title: உடைக்கப்பட்ட உடன்படிக்கைக்காக வரும் தீர்ப்பு
      '9':
        title: இஸ்ரவேல் தண்டிக்கப்பட்டு நாடுகடத்தப்படுதல்
      '10':
        title: செழிப்படைந்த இஸ்ரவேல் சிலைகளை நாடுதல்
      '11':
        title: கைவிட மறுக்கும் கடவுள்
      '12':
        title: பொய்களுக்கும் வன்முறைக்கும் தீர்ப்பால் பதிலளிக்கப்படுகிறது
      '13':
        title: ஒருகாலத்தில் வலிமைபெற்ற எப்பிராயீம் இப்போது ஓடுகிறது
      '14':
        title: இஸ்ரவேல் மனந்திரும்பி இரக்கத்தை நாடுகிறது
  Joel:
    display_name: யோவேல்
    author: பெத்துவேலின் மகன் யோவேல்.
    audience: வெட்டுக்கிளிப் பேரிடரை ஆண்டவரின் நாளின் அறிகுறியாகக் கருதி அதற்குப் பதிலளித்த நாடுகடத்தலுக்குப் பிந்தைய யூதா மக்களுக்கு.
    date: அநேகமாக கி.மு. 5–4ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: உபவாசம் இருக்க யோவேல் அழைக்கிறார்
      '2':
        title: முழு இதயத்துடன் திரும்புங்கள்
      '3':
        title: அனைவர்மீதும் ஆவி பொழியப்படுகிறது
      '4':
        title: தீர்ப்புக்காக நாடுகள் கூடுகின்றன
  Amos:
    display_name: ஆமோஸ்
    author: தெக்கோவாவைச் சேர்ந்த ஆமோஸ்; வடக்கில் பிரசங்கித்த யூத மேய்ப்பர்.
    audience: இரண்டாம் யெரொபெயாமின் ஆட்சியில் செழிப்பும் அநீதியும் நிலவிய காலத்து வடக்கு இஸ்ரவேலுக்கு.
    date: சுமார் கி.மு. 760–750.
    chapters:
      '1':
        title: நாடுகளின் கொடுமையைக் கடவுள் நியாயந்தீர்க்கிறார்
      '2':
        title: இஸ்ரவேல் நிச்சயமான தீர்ப்பை எதிர்கொள்கிறது
      '3':
        title: இஸ்ரவேலின் பாவங்கள் பேரழிவைக் கொண்டுவருகின்றன
      '4':
        title: செல்வந்தப் பெண்கள் தீர்ப்பை எதிர்கொள்கின்றனர்
      '5':
        title: மனந்திரும்பாவிட்டால் நாடு வீழும்
      '6':
        title: சுகவாழ்வு வாழும் உயர்குடியினர் அழிவைப் பொருட்படுத்தவில்லை
      '7':
        title: அழிவைப் பற்றிய தரிசனங்களை ஆமோஸ் காண்கிறார்
      '8':
        title: கோடைக்காலப் பழங்கள் இஸ்ரவேலின் முடிவைக் குறிக்கின்றன
      '9':
        title: தவிர்க்க முடியாத தீர்ப்பும் மீட்டமைப்பும்
  Obadiah:
    display_name: ஒபதியா
    author: ஒபதியா.
    audience: எருசலேமுக்கு ஏதோம் துரோகம் செய்த பிறகான யூதாவுக்கு—ஏதோமின் வீழ்ச்சியைப் பற்றிய தீர்க்கதரிசனம்.
    date: கி.மு. 586க்குச் சற்றுப் பிறகு.
    chapters:
      '1':
        title: துரோகத்திற்காக ஏதோம் நியாயந்தீர்க்கப்படுகிறது
  Jonah:
    display_name: யோனா
    author: ஆசிரியர் பெயர் தெரியவில்லை; கதையின் முதன்மைப் பாத்திரம் அமித்தாயின் மகன் யோனா.
    audience: நாடுகடத்தலுக்குப் பிந்தைய இஸ்ரவேலுக்கு—இனரீதியான குறுகிய மனப்பான்மையை நையாண்டியாகக் கண்டித்து, வெளிநாட்டவர்களுக்கும் கடவுளின் இரக்கம் உண்டு என்பதை உறுதிப்படுத்தும் நூல்.
    date: அநேகமாக கி.மு. 5–4ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: நினிவேப் பணியிலிருந்து யோனா தப்பியோடுகிறார்
      '2':
        title: மீனின் வயிற்றில் யோனா மன்றாடுகிறார்
      '3':
        title: யோனாவின் அழைப்பைக் கேட்டு நினிவே மனந்திரும்புகிறது
      '4':
        title: கடவுளின் இரக்கத்தால் யோனா விரக்தியடைகிறார்
  Micah:
    display_name: மீகா
    author: மோரேசேத்தைச் சேர்ந்த மீகா.
    audience: கி.மு. 8ஆம் நூற்றாண்டின் பிற்பகுதியில் வாழ்ந்த யூதாவுக்கு; குறிப்பாக நகர்ப்புற உயர்குடியினருக்கு எதிரான கிராமப்புற ஏழைகளுக்கு.
    date: சுமார் கி.மு. 740–700.
    chapters:
      '1':
        title: சமாரியாவையும் யூதாவையும் கடவுள் நியாயந்தீர்க்கிறார்
      '2':
        title: பேராசையுடன் சதித்திட்டம் தீட்டுவோரை மீகா கண்டிக்கிறார்
      '3':
        title: தலைவர்கள் மக்களைக் கொடூரமாகச் சுரண்டுகின்றனர்
      '4':
        title: எல்லா நாடுகளுக்கும் மேலாக ஆண்டவர் ஆட்சி செய்கிறார்
      '5':
        title: பெத்லகேமிலிருந்து தாவீதின் அரசர் வருவார்
      '6':
        title: இஸ்ரவேலுக்கு எதிராக ஆண்டவர் வழக்குத் தொடுக்கிறார்
      '7':
        title: துயரத்தின் நடுவில் மீகா மன்றாடுகிறார்
  Nahum:
    display_name: நாகூம்
    author: எல்கோசைச் சேர்ந்த நாகூம்.
    audience: நினிவேயின் நெருங்கிவரும் வீழ்ச்சியைக் கொண்டாடிய யூதாவுக்கு.
    date: கி.மு. 612க்குச் சற்றுமுன்.
    chapters:
      '1':
        title: நினிவேயின் குற்றத்திற்காகக் கடவுள் தண்டிக்கிறார்
      '2':
        title: யூதாவுக்குச் சமாதானச் செய்தியைத் தூதர் கொண்டுவருகிறார்
      '3':
        title: நினிவே முழுமையான அவமானத்தை எதிர்கொள்கிறது
  Habakkuk:
    display_name: ஆபகூக்
    author: ஆபகூக்.
    audience: பாபிலோனின் எழுச்சியை எதிர்கொண்ட யூதாவுக்கு—நீதியைப் பற்றி ஒரு தீர்க்கதரிசி கடவுளுடன் நடத்தும் உரையாடல்.
    date: சுமார் கி.மு. 7ஆம் நூற்றாண்டின் பிற்பகுதி.
    chapters:
      '1':
        title: தீயவர்களின் ஆட்சியைக் குறித்து ஆபகூக் புலம்புகிறார்
      '2':
        title: இறுமாப்புள்ள ஒடுக்குபவர்களைக் கடவுள் எச்சரிக்கிறார்
      '3':
        title: புனிதமான அச்சத்துடன் ஆபகூக் மன்றாடுகிறார்
  Zephaniah:
    display_name: செப்பனியா
    author: கூசியின் மகன் செப்பனியா.
    audience: யோசியாவின் ஆட்சியின்கீழ், அவரது சீர்திருத்தங்களுக்கு முந்தைய காலத்து யூதாவுக்கு.
    date: சுமார் கி.மு. 640–609.
    chapters:
      '1':
        title: பாவத்திற்காக யூதாவைக் கடவுள் நியாயந்தீர்க்கிறார்
      '2':
        title: நாடுகள் தண்டிக்கப்பட்டாலும் நம்பிக்கை நீடிக்கிறது
      '3':
        title: தூய்மையாக்கப்பட்ட மக்களைக் குறித்து சீயோன் மகிழ்கிறது
  Haggai:
    display_name: ஆகாய்
    author: ஆகாய்.
    audience: தரியுவின் ஆட்சியில் ஆலயத்தை மீண்டும் கட்டிக்கொண்டிருந்த நாடு திரும்பிய மக்களுக்கு.
    date: கி.மு. 520.
    chapters:
      '1':
        title: தமது இல்லத்தை மீண்டும் கட்ட ஆண்டவர் வலியுறுத்துகிறார்
      '2':
        title: ஆலயத்தைக் கட்டுபவர்களைக் கடவுள் ஊக்குவிக்கிறார்
  Zechariah:
    display_name: சகரியா
    author: பெரெகியாவின் மகன் சகரியா; 9–14ஆம் அதிகாரங்கள் அநேகமாகப் பிற்கால ஆசிரியர் ஒருவரால் எழுதப்பட்டவை.
    audience: ஆலயத்தை மீண்டும் கட்டிக்கொண்டிருந்த நாடு திரும்பிய மக்களுக்கும், பிற்கால நாடுகடத்தலுக்குப் பிந்தைய சமூகங்களுக்கும்.
    date: 1–8ஆம் அதிகாரங்கள் சுமார் கி.மு. 520–518; 9–14ஆம் அதிகாரங்கள் ஒருவேளை ஒரு நூற்றாண்டுக்குப் பிந்தையவை.
    chapters:
      '1':
        title: இரக்கத்துடன் கடவுள் திரும்பிவருகிறார்
      '2':
        title: எருசலேம் மகிழ்ச்சியால் நிரம்பி வழிகிறது
      '3':
        title: யோசுவாவைக் கடவுள் தூய்மைப்படுத்துகிறார்
      '4':
        title: ஆவியின் வல்லமையால் செருபாபேல் கட்டுகிறார்
      '5':
        title: நாட்டிலிருந்து தீமை அகற்றப்படுகிறது
      '6':
        title: ஆசாரியர் யோசுவாவுக்குக் கிரீடங்கள்
      '7':
        title: நீதியின்றி உபவாசம் பயனற்றது
      '8':
        title: சமாதானத்தில் சீயோன் மீண்டும் கட்டப்படுகிறது
      '9':
        title: இஸ்ரவேலின் அரசர் தாழ்மையுடன் வருகிறார்
      '10':
        title: சிலைகளை அல்ல, மழையை நாடுங்கள்
      '11':
        title: மேய்ப்பர் ஆடுகளைக் கைவிடுகிறார்
      '12':
        title: நாடுகளுக்கு அச்சமூட்டும் எருசலேம்
      '13':
        title: பாவத்திலிருந்து நாடு தூய்மைப்படுத்தப்படுகிறது
      '14':
        title: எருசலேமுக்காக ஆண்டவர் போரிடுகிறார்
  Malachi:
    display_name: மல்கியா
    author: ஆசிரியர் பெயர் தெரியவில்லை; “மல்கியா” என்பதற்கு “என் தூதர்” என்று பொருள்.
    audience: பாரசீக ஆட்சியின்கீழ் வழிபாட்டிலும் உண்மைத்தன்மையிலும் அக்கறையற்றவர்களாகிவந்த நாடுகடத்தலுக்குப் பிந்தைய யூதாவுக்கு.
    date: சுமார் கி.மு. 5ஆம் நூற்றாண்டின் நடுப்பகுதி.
    chapters:
      '1':
        title: நேர்மையற்ற ஆசாரியர்களைக் கடவுள் கண்டிக்கிறார்
      '2':
        title: யூதா உடன்படிக்கைக்குத் துரோகம் செய்கிறது
      '3':
        title: தூய்மைப்படுத்தலுக்கு வழியைத் தூதர் ஆயத்தமாக்குகிறார்
  Matthew:
    display_name: மத்தேயு
    author: ஆசிரியர் பெயர் தெரியவில்லை; மரபு இதைத் திருத்தூதர் மத்தேயுவுடன் தொடர்புபடுத்துகிறது. நவீன ஆய்வாளர்கள், மாற்கு நூலையும் ‘Q’ போன்ற ஒரு மூலத்தையும் பயன்படுத்திய கிரேக்க மொழி பேசிய யூதக் கிறிஸ்தவ ஆசிரியர் இதை எழுதியதாகக் கருதுகின்றனர்.
    audience: தொழுகைக்கூட யூத மதத்துடனான தொடர்ச்சியையும் வேறுபாட்டையும் புரிந்துகொள்ளப் போராடிய ஒரு யூதக் கிறிஸ்தவச் சமூகத்திற்கு.
    date: சுமார் கி.பி. 80–90.
    chapters:
      '1':
        title: மேசியாவின் வம்சத்தில் இயேசு பிறக்கிறார்
      '2':
        title: ஞானிகள் புதிதாய்ப் பிறந்த அரசரை வழிபடுகின்றனர்
      '3':
        title: யோவான் இயேசுவுக்குத் திருமுழுக்கு அளிக்கிறார்; இயேசு அருள்பொழிவு பெறுகிறார்
      '4':
        title: அரசு நெருங்கிவிட்டதென இயேசு போதிக்கிறார்
      '5':
        title: இறையரசின் வழியை இயேசு போதிக்கிறார்
      '6':
        title: முதலில் தந்தையின் அரசை நாடுங்கள்
      '7':
        title: கிறிஸ்துவின்மேல் உங்கள் வாழ்வைக் கட்டியெழுப்புங்கள்
      '8':
        title: இயேசு குணமாக்கி தமது அதிகாரத்தைக் காட்டுகிறார்
      '9':
        title: முடக்குவாதமுற்ற மனிதரை இயேசு குணமாக்குகிறார்
      '10':
        title: பன்னிரு திருத்தூதர்களை இயேசு அனுப்புகிறார்
      '11':
        title: நம்பிக்கையின்மைக்காக நகரங்களை இயேசு கண்டிக்கிறார்
      '12':
        title: உண்மையான குடும்பம் எது என்று இயேசு விளக்குகிறார்
      '13':
        title: இறையரசைப் பற்றிய உவமைகளை இயேசு போதிக்கிறார்
      '14':
        title: இயேசு அற்புதமாக மக்கள் கூட்டங்களுக்கு உணவளிக்கிறார்
      '15':
        title: சமயப் பாசாங்கை இயேசு எதிர்கொள்கிறார்
      '16':
        title: திருச்சபையையும் துன்பத்தையும் குறித்து இயேசு வெளிப்படுத்துகிறார்
      '17':
        title: இயேசு உருமாறி எலியாவைக் குறித்து அறிவிக்கிறார்
      '18':
        title: தாழ்மையையும் மன்னிப்பையும் இயேசு போதிக்கிறார்
      '19':
        title: திருமணத்தையும் இறையரசையும் குறித்து இயேசு போதிக்கிறார்
      '20':
        title: பணிவிடையின் வழியே மேன்மை என்று இயேசு போதிக்கிறார்
      '21':
        title: அரசராக இயேசு எருசலேமுக்குள் நுழைகிறார்
      '22':
        title: தலைவர்களின் கண்ணிக் கேள்விகளுக்கு இயேசு ஞானமாகப் பதிலளிக்கிறார்
      '23':
        title: பாசாங்கைக் குறித்து இயேசு எச்சரிக்கிறார்
      '24':
        title: ஆலயத்தின் அழிவை இயேசு முன்னறிவிக்கிறார்
      '25':
        title: இயேசு நாடுகளைப் பிரித்து நியாயந்தீர்க்கிறார்
      '26':
        title: இயேசு கைது செய்யப்பட்டு, கேலி செய்யப்பட்டு, சிலுவையில் அறையப்படுகிறார்
      '27':
        title: இயேசு அடக்கம் செய்யப்படுகிறார்; காவலர்கள் கல்லறையைப் பாதுகாக்கின்றனர்
      '28':
        title: இயேசு உயிர்த்தெழுந்து சீடர்களை அனுப்புகிறார்
  Mark:
    display_name: மாற்கு
    author: ஆசிரியர் பெயர் தெரியவில்லை; மரபு இதை பேதுருவின் பயணத் தோழரான யோவான் மாற்குவுடன் தொடர்புபடுத்துகிறது.
    audience: அநேகமாக ரோமில், துன்புறுத்தலின் கீழ் அல்லது அதன் அச்சுறுத்தலுக்கு அருகில் இருந்த கிரேக்க மொழி பேசிய கிறிஸ்தவச் சமூகத்திற்கு.
    date: யூதப் போர் மற்றும் ஆலய அழிவை ஒட்டிய காலமான சுமார் கி.பி. 65–75.
    chapters:
      '1':
        title: கடவுளின் அரசைப் பற்றி இயேசு அறிவிக்கிறார்
      '2':
        title: இயேசு குணமாக்கி பாவங்களை மன்னிக்கிறார்
      '3':
        title: பன்னிரு சீடர்களை இயேசு தேர்ந்தெடுக்கிறார்
      '4':
        title: இயேசு கடலோரத்தில் உவமைகளைக் கற்பிக்கிறார்
      '5':
        title: இயேசு பிற இனத்தைச் சேர்ந்த ஒருவரைக் குணமாக்குகிறார்
      '6':
        title: இயேசு ஐயாயிரம் பேருக்கு உணவளிக்கிறார்
      '7':
        title: இயேசு மனித மரபுகளை எதிர்கொள்கிறார்
      '8':
        title: இயேசு நான்காயிரம் பேருக்கு உணவளிக்கிறார்
      '9':
        title: இயேசு தமது மகிமையை வெளிப்படுத்துகிறார்
      '10':
        title: இயேசு சிறுவர்களை இறையாட்சிக்குள் வரவேற்கிறார்
      '11':
        title: போற்றுதலுடன் இயேசு எருசலேமுக்குள் நுழைகிறார்
      '12':
        title: இயேசு சூழ்ச்சிக் கேள்விகளுக்குப் பதிலளித்துக் கற்பிக்கிறார்
      '13':
        title: இயேசு பெருந்துன்பத்தைப் பற்றிக் கற்பிக்கிறார்
      '14':
        title: இரவில் யூதாஸ் இயேசுவைக் காட்டிக்கொடுக்கிறான்
      '15':
        title: இயேசு சிலுவையில் அறையப்பட்டு உண்மையுடன் அடக்கம் செய்யப்படுகிறார்
      '16':
        title: இயேசு உயிர்த்தெழுகிறார்; பெண்கள் செய்தியை அறிவிக்கிறார்கள்
  Luke:
    display_name: லூக்கா
    author: ஆசிரியர் பெயர் தெரியவில்லை; பவுலின் பயணத் தோழரான லூக்கா இதை எழுதியதாக மரபு கூறுகிறது.
    audience: “தெயோப்பிலு” என்பவரை முன்னிலைப்படுத்தி எழுதப்பட்ட, கல்வியறிவுள்ள கிரேக்க-ரோமக் கிறிஸ்தவ வாசகர்கள்.
    date: சுமார் கி.பி. 80–90.
    chapters:
      '1':
        title: இரண்டு அற்புதப் பிறப்புகளைக் கடவுள் அறிவிக்கிறார்
      '2':
        title: இயேசுவின் பிறப்பு மகிழ்ச்சியைக் கொண்டுவருகிறது
      '3':
        title: யோவான் இயேசுவுக்கு வழியை ஆயத்தப்படுத்துகிறார்
      '4':
        title: இயேசு சோதனையை எதிர்த்து ஊழியத்தைத் தொடங்குகிறார்
      '5':
        title: மனிதரைப் பிடிக்கும் மீனவர்களை இயேசு அழைக்கிறார்
      '6':
        title: இயேசு பன்னிரண்டு அப்போஸ்தலர்களைத் தேர்ந்தெடுக்கிறார்
      '7':
        title: இயேசு நூற்றுவர் தலைவனின் பணியாளரைக் குணமாக்குகிறார்
      '8':
        title: இயேசு இறையாட்சியைப் பற்றிய உவமைகளைக் கற்பிக்கிறார்
      '9':
        title: இயேசு முழுமையான அர்ப்பணிப்பைக் கோருகிறார்
      '10':
        title: இயேசு சீடர்களை அனுப்புகிறார்
      '11':
        title: இயேசு விடாமுயற்சியுடன் மன்றாடக் கற்பிக்கிறார்
      '12':
        title: இயேசு வெளிவேடத்தைக் குறித்து எச்சரிக்கிறார்
      '13':
        title: இயேசு எச்சரித்துக் குணமாக்குகிறார்
      '14':
        title: இயேசு தாழ்மையையும் தாராள மனதையும் கற்பிக்கிறார்
      '15':
        title: தொலைந்துபோன பாவிகளை இயேசு வரவேற்கிறார்
      '16':
        title: செல்வத்தை வழிபடுவதை இயேசு கண்டிக்கிறார்
      '17':
        title: இயேசு சீடர்களை எச்சரித்துப் பணிவிடை செய்யச் சொல்கிறார்
      '18':
        title: இயேசு விடாமுயற்சியுடன் மன்றாடக் கற்பிக்கிறார்
      '19':
        title: எரிகோவில் இயேசு சகேயுவை மீட்கிறார்
      '20':
        title: இயேசு ஆலயத் தலைவர்களைச் சவாலிடுகிறார்
      '21':
        title: கைம்பெண்ணின் காணிக்கையும் வரவிருக்கும் பெருந்துன்பமும்
      '22':
        title: ஒலிவ மலையில் இயேசு மன்றாடுகிறார்
      '23':
        title: இயேசு புதிய கல்லறையில் அடக்கம் செய்யப்படுகிறார்
      '24':
        title: இயேசு உயிர்த்தெழுந்து மன்னிப்பை அறிவிக்கிறார்
  John:
    display_name: யோவான்
    author: ஆசிரியர் பெயர் தெரியவில்லை; அப்போஸ்தலனாகிய யோவான் அல்லது “அன்புக்குரிய சீடர்” இதை எழுதியதாக மரபு கூறுகிறது.
    audience: அன்புக்குரிய சீடரின் சாட்சியத்தைச் சுற்றி உருவானதும், யூத தொழுகைக்கூட மரபுடன் பதற்றத்தில் இருந்ததுமான ஒரு கிறிஸ்தவச் சமூகம்.
    date: சுமார் கி.பி. 90–110.
    summary: யோவான், தந்தையை வெளிப்படுத்துகிறவரும், தம்மில் நம்பிக்கை வைப்போருக்கு வாழ்வை அளிக்கிறவருமான நித்திய வார்த்தையாக இயேசுவை எடுத்துரைக்கிறார்; அவர் தமது அடையாளச் செயல்கள், மரணம், உயிர்த்தெழுதல் ஆகியவற்றின் வழியாக மகிமைப்படுத்தப்படுகிறார்.
    chapters:
      '1':
        title: வார்த்தை மனிதராகிறார்
      '2':
        title: இயேசு தண்ணீரைத் திராட்சை இரசமாக மாற்றுகிறார்
      '3':
        title: கடவுள் தமது அன்பு மகனை அளிக்கிறார்
      '4':
        title: இயேசு சமாரியப் பெண்ணைச் சந்திக்கிறார்
      '5':
        title: ஓய்வுநாளில் இயேசு ஒருவரைக் குணமாக்குகிறார்
      '6':
        title: இயேசு ஐயாயிரம் பேருக்கு உணவளிக்கிறார்
      '7':
        title: விழாவில் இயேசு கற்பிக்கிறார்
      '8':
        title: உலகின் ஒளியான இயேசு புறக்கணிக்கப்படுகிறார்
      '9':
        title: இயேசு பார்வையற்ற ஒருவரைக் குணமாக்குகிறார்
      '10':
        title: இயேசு தமது ஆடுகளைப் பற்றிப் பேசுகிறார்
      '11':
        title: இயேசு லாசருவை மரணத்திலிருந்து உயிருடன் எழுப்புகிறார்
      '12':
        title: இயேசுவின் அடக்கத்திற்காக மரியா அவருக்குத் தைலம் பூசுகிறார்
      '13':
        title: இயேசு சீடர்களின் கால்களைக் கழுவுகிறார்
      '14':
        title: இயேசு தூய ஆவியானவரை வாக்களிக்கிறார்
      '15':
        title: உண்மையான திராட்சைக்கொடியான இயேசு கிளைகளைக் கவாத்துச் செய்கிறார்
      '16':
        title: துன்பம் வரும்; ஆனாலும் மகிழ்ச்சி நிலைத்திருக்கும்
      '17':
        title: இயேசு தமது சீடர்களுக்காக மன்றாடுகிறார்
      '18':
        title: இயேசு கைது செய்யப்படுகிறார்; பேதுரு மறுதலிக்கிறார்
      '19':
        title: இயேசு சாட்டையால் அடிக்கப்பட்டு, கேலி செய்யப்பட்டு, சிலுவையில் அறையப்படுகிறார்
      '20':
        title: இயேசு மரியாவுக்குத் தம்மை வெளிப்படுத்துகிறார்
      '21':
        title: கடலோரத்தில் இயேசு பேதுருவை மீண்டும் நிலைநிறுத்துகிறார்
  Acts:
    display_name: அப்போஸ்தலர் பணிகள்
    author: ஆசிரியர் பெயர் தெரியவில்லை; லூக்கா நூலை எழுதிய அதே ஆசிரியர்.
    audience: தெயோப்பிலுவுக்கு உரையாற்றப்பட்ட படைப்பின் இரண்டாம் பாகமான இதை வாசிக்கும் கிரேக்க-ரோமக் கிறிஸ்தவ வாசகர்கள்.
    date: சுமார் கி.பி. 80–90.
    chapters:
      '1':
        title: சாட்சிகள் தூய ஆவியானவருக்காகக் காத்திருக்கிறார்கள்
      '2':
        title: பெந்தெகொஸ்தே நாளில் தூய ஆவியானவர் பற்றியெரியச் செய்கிறார்
      '3':
        title: பேதுரு கால் ஊனமுற்ற பிச்சைக்காரரைக் குணமாக்குகிறார்
      '4':
        title: அப்போஸ்தலர்கள் பரிசுத்த துணிவுடன் பேசுகிறார்கள்
      '5':
        title: தீர்ப்பும் அற்புதங்களும் திருச்சபையைச் சோதிக்கின்றன
      '6':
        title: ஏழு பணியாளர்கள் திருச்சபைக்குத் துணைநிற்கிறார்கள்
      '7':
        title: வானம் திறந்திருப்பதை ஸ்தேவான் காண்கிறார்
      '8':
        title: நற்செய்தி சமாரியாவை எட்டுகிறது
      '9':
        title: உயிர்த்தெழுந்த இயேசுவை சவுல் சந்திக்கிறார்
      '10':
        title: பிற இனத்தார் தூய ஆவியானவரைப் பெறுகிறார்கள்
      '11':
        title: பிற இனத்தார் சேர்க்கப்பட்டதைப் பேதுரு ஆதரித்துப் பேசுகிறார்
      '12':
        title: வானதூதர் பேதுருவை விடுவிக்கிறார்
      '13':
        title: பிற இனத்தாரிடையே பவுல் தமது பணியைத் தொடங்குகிறார்
      '14':
        title: துன்புறுத்தலின் நடுவிலும் பவுல் விடாமுயற்சியுடன் தொடர்கிறார்
      '15':
        title: எருசலேம் சங்கம் பிற இனத்தாரை வரவேற்கிறது
      '16':
        title: வழிபாடு சிறைச்சாலையைத் திறக்கிறது
      '17':
        title: அறியப்படாத கடவுளைப் பவுல் அறிவிக்கிறார்
      '18':
        title: நற்செய்தி கொரிந்துவை எட்டுகிறது
      '19':
        title: அர்த்தமியை முன்னிட்டு எபேசுவில் கலகம் வெடிக்கிறது
      '20':
        title: பவுல் மூப்பர்களிடம் கண்ணீருடன் விடைபெறுகிறார்
      '21':
        title: பவுல் எருசலேமுக்குத் திரும்புகிறார்
      '22':
        title: பவுல் தமது அழைப்பைப் பற்றி விளக்கமளிக்கிறார்
      '23':
        title: பவுல் சங்கத்தின் முன் நிற்கிறார்
      '24':
        title: பெலிக்சின் முன் பவுல் சாட்சியளிக்கிறார்
      '25':
        title: பவுல் சீசரிடம் மேல்முறையீடு செய்கிறார்
      '26':
        title: அகிரிப்பாவின் முன் பவுல் சாட்சியளிக்கிறார்
      '27':
        title: கப்பல் சிதைவிலும் கடவுள் பவுலைப் பாதுகாக்கிறார்
      '28':
        title: நற்செய்தி ரோமை வந்தடைகிறது
  Romans:
    display_name: ரோமர்
    author: எழுத்தராகிய தெர்த்தியுவுடன் பவுல்.
    audience: தோரா சட்டம் மற்றும் அடையாளம் குறித்த பதற்றத்தில் இருந்த யூத மற்றும் பிறஇன நம்பிக்கையாளர்களைக் கொண்ட ரோமிலுள்ள கிறிஸ்தவர்கள்.
    date: சுமார் கி.பி. 56–58; கொரிந்துவிலிருந்து எழுதப்பட்டது.
    chapters:
      '1':
        title: இயேசுவின் நீதியைப் பவுல் அறிவிக்கிறார்
      '2':
        title: பாரபட்சமின்றித் தீர்ப்பு வருகிறது
      '3':
        title: அனைவரும் பாவத்தின் குற்றத்தின்கீழ் உள்ளனர்
      '4':
        title: ஆபிரகாம் விசுவாசத்தினால் மட்டுமே நீதிமானாகக் கருதப்படுகிறார்
      '5':
        title: கிறிஸ்துவின் மரணத்தின் வழியாக நீதி
      '6':
        title: பாவத்திற்காக அல்ல, கடவுளுக்காக வாழுங்கள்
      '7':
        title: நம்பிக்கையாளர்கள் பாவத்துடன் போராடுகிறார்கள்
      '8':
        title: கிறிஸ்துவிடமிருந்து எதுவும் நம்மைப் பிரிக்க முடியாது
      '9':
        title: இஸ்ரயேலுக்கான இரக்கமும் சினமும்
      '10':
        title: மீட்பு அனைவருக்கும் அருகில் உள்ளது
      '11':
        title: கிருபையால் அழைக்கப்பட்ட பிற இனத்தார்
      '12':
        title: உங்கள் வாழ்வை உயிருள்ள பலியாக ஒப்புக்கொடுங்கள்
      '13':
        title: அதிகாரிகளுக்குக் கீழ்ப்படிந்து அன்புகூருங்கள்
      '14':
        title: நம்பிக்கையில் பலவீனமானவர்களை ஏற்றுக்கொள்ளுங்கள்
      '15':
        title: யூதர்களையும் பிற இனத்தாரையும் ஒன்றிணைத்தல்
      '16':
        title: வாழ்த்துகளும் எச்சரிக்கைகளும்
  1 Corinthians:
    display_name: 1 கொரிந்தியர்
    author: பவுல், சொஸ்தெனேயுடன்.
    audience: பிளவுகளால் பாதிக்கப்பட்ட கொரிந்துவிலுள்ள கிறிஸ்தவச் சபை.
    date: சுமார் கி.பி. 53–55; எபேசுவிலிருந்து எழுதப்பட்டது.
    chapters:
      '1':
        title: அனைவருக்கும் கடவுள் நம்பிக்கையுடன் வழங்கும் செல்வங்கள்
      '2':
        title: கடவுளின் ஆவியானவர் வெளிப்படுத்தும் ஞானம்
      '3':
        title: கொரிந்தியர் கடவுளின் ஆலயம் என்று பவுல் எச்சரிக்கிறார்
      '4':
        title: பெருமையைவிட உண்மைத்தன்மையே முக்கியம்
      '5':
        title: சபை ஒழுங்கு நடவடிக்கையைப் பவுல் கட்டளையிடுகிறார்
      '6':
        title: சபைக்குள்ளேயே சச்சரவுகளைத் தீர்த்துக்கொள்ளுங்கள்
      '7':
        title: திருமணத்தை மதிக்கப் பவுல் கற்பிக்கிறார்
      '8':
        title: தனிப்பட்ட சுதந்திரத்தைவிட அன்பே மேலானது
      '9':
        title: பவுல் தனது அப்போஸ்தலப் பணியைச் சுதந்திரமாக ஆதரிக்கிறார்
      '10':
        title: கடவுளின் மக்களுக்கு இஸ்ரவேலின் எச்சரிக்கை
      '11':
        title: வழிபாட்டில் ஒற்றுமை கிறிஸ்துவை மகிமைப்படுத்துகிறது
      '12':
        title: ஆவியின் வரங்கள் சபையின் ஒற்றுமையை வளர்க்கின்றன
      '13':
        title: அன்பு ஒருபோதும் கைவிடாது
      '14':
        title: வெளித்தோற்றத்தைக் கவர்வதைவிட அன்பையே நாடுங்கள்
      '15':
        title: கிறிஸ்து உயிர்த்தெழுகிறார்; மரணம் வீழ்கிறது
      '16':
        title: காணிக்கைகளும் பயணத் திட்டங்களும்
  2 Corinthians:
    display_name: 2 கொரிந்தியர்
    author: பவுல், தீமோத்தேயுவுடன்.
    audience: வேதனைமிக்க ஒரு மோதலுக்குப் பிறகு இருந்த கொரிந்துச் சபை.
    date: சுமார் கி.பி. 55–56.
    chapters:
      '1':
        title: துன்பத்தில் கடவுளின் ஆறுதல்
      '2':
        title: அன்பும் மன்னிப்பும் வலியுறுத்தப்படுகின்றன
      '3':
        title: மாறிய வாழ்வுகளால் உறுதிப்படுத்தப்படும் ஊழியம்
      '4':
        title: கிறிஸ்துவின் மகிமையை அறிவித்தல்
      '5':
        title: கிறிஸ்துவின் அன்பு ஊழியத்தை இயக்குகிறது
      '6':
        title: கடவுளுக்காகத் துன்பத்தைத் தாங்குங்கள்
      '7':
        title: பயபக்தியுடன் பரிசுத்தத்தை நாடுங்கள்
      '8':
        title: மக்கெதோனியரின் கிருபை கொடுப்பதற்கு ஊக்கமளிக்கிறது
      '9':
        title: இறைமக்களுக்காக மகிழ்ச்சியுடன் கொடுங்கள்
      '10':
        title: கிறிஸ்துவின் சாந்தத்தைப் பின்பற்றுவதாக உறுதி
      '11':
        title: உண்மையான வாழ்வுக்கான ஆழ்ந்த அக்கறை
      '12':
        title: பலவீனத்திலும் கிருபையிலும் பெருமைகொள்ளுங்கள்
      '13':
        title: பாவம் உள்ளதா என நம்மையே சோதிப்போம்
  Galatians:
    display_name: கலாத்தியர்
    author: பவுல்.
    audience: விருத்தசேதனத்தையும் தோரா சட்டத்தைக் கடைப்பிடிப்பதையும் ஏற்குமாறு அழுத்தம் கொடுக்கப்பட்ட கலாத்தியாவிலுள்ள (மத்திய அனத்தோலியா) கிறிஸ்தவச் சபைகள்.
    date: சுமார் கி.பி. 48–55 (விவாதத்திற்குரியது).
    chapters:
      '1':
        title: பவுல் தனது நற்செய்தியை ஆதரிக்கிறார்
      '2':
        title: பேதுருவின் தவறைப் பவுல் எதிர்கொள்கிறார்
      '3':
        title: ஆபிரகாமின் நம்பிக்கை நீதிமானாக்குகிறது
      '4':
        title: சட்டத்திலிருந்து கிறிஸ்து நம்மை விடுவிக்கிறார்
      '5':
        title: சட்டத்தால் அல்ல, நம்பிக்கையால் வாழுங்கள்
      '6':
        title: ஒருவருடைய சுமையை மற்றவர் சுமந்துகொள்ளுங்கள்
  Ephesians:
    display_name: எபேசியர்
    author: பவுல், அல்லது பவுலின் பெயரில் எழுதிய அவருடைய நெருங்கிய சீடர் (விவாதத்திற்குரியது).
    audience: ஆசியப் பகுதியைச் சேர்ந்த கிறிஸ்தவ வாசகர்களுக்குப் பொதுவாக எழுதப்பட்டது; மிகப் பழமையான கையெழுத்துப் பிரதிகளில் “எபேசு” என்ற இடப்பெயர் இல்லை.
    date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60கள்; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 80கள்–90கள்.
    chapters:
      '1':
        title: நம்பிக்கையாளர்களில் முத்திரையிடப்பட்ட கடவுளின் கிருபை
      '2':
        title: கிறிஸ்து அனைவருக்கும் சமாதானத்தைக் கொண்டுவருகிறார்
      '3':
        title: நற்செய்தியின் மூலம் வெளிப்படுத்தப்பட்ட மறைபொருள்
      '4':
        title: கிறிஸ்துவின் உடலில் ஒற்றுமைக்கான வேண்டுதல்
      '5':
        title: கடவுளைப் பின்பற்றி ஞானமாக வாழுங்கள்
      '6':
        title: பிள்ளைகளே, பெற்றோருக்குக் கீழ்ப்படிந்து மதியுங்கள்
  Philippians:
    display_name: பிலிப்பியர்
    author: பவுல், தீமோத்தேயுவுடன்.
    audience: மக்கெதோனியாவிலிருந்த ரோமக் குடியேற்ற நகரமான பிலிப்பியிலுள்ள கிறிஸ்தவச் சபை.
    date: சுமார் கி.பி. 60–62; சிறையிலிருந்து எழுதப்பட்டது.
    chapters:
      '1':
        title: பிலிப்பியருக்காகப் பவுல் வேண்டுகிறார்
      '2':
        title: தாழ்மைப்படுத்தப்பட்டு உயர்த்தப்பட்ட இயேசு
      '3':
        title: கிறிஸ்துவை அறிவதில் மகிழுங்கள்
      '4':
        title: மகிழ்ச்சியுடன் உறுதியாக நில்லுங்கள்
  Colossians:
    display_name: கொலோசெயர்
    author: பவுல், தீமோத்தேயுவுடன் — அல்லது பவுலின் பெயரில் எழுதிய நெருங்கிய சீடர் (விவாதத்திற்குரியது).
    audience: பல சமயக் கூறுகளைக் கலந்த ஒரு போதனையை எதிர்கொண்ட, லைக்குஸ் பள்ளத்தாக்கிலுள்ள கொலோசெ நகரக் கிறிஸ்தவர்கள்.
    date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60–62; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் அதற்குப் பிந்தைய காலம்.
    chapters:
      '1':
        title: கொலோசெயரின் நம்பிக்கைக்காகப் பவுல் வேண்டுகிறார்
      '2':
        title: கிறிஸ்துவில் நிலைத்திருக்க நம்பிக்கையாளர்களைப் பவுல் ஊக்குவிக்கிறார்
      '3':
        title: பாவத்திற்கு மேலெழுந்து அன்புடன் வாழுங்கள்
      '4':
        title: சங்கிலிகளில் இருக்கும் பவுல் வேண்டி ஊக்குவிக்கிறார்
  1 Thessalonians:
    display_name: 1 தெசலோனிக்கேயர்
    author: பவுல், சில்வானுவும் தீமோத்தேயுவும் உடன்.
    audience: துன்புறுத்தலை எதிர்கொண்ட தெசலோனிக்கேயாவிலுள்ள இளம் கிறிஸ்தவச் சபை.
    date: சுமார் கி.பி. 50–51 — இன்று கிடைக்கும் பவுலின் கடிதங்களில் இதுவே மிகப் பழமையானதாக இருக்கலாம்.
    chapters:
      '1':
        title: கிருபை, சமாதானம், நம்பிக்கை, அன்பு, எதிர்நோக்கு
      '2':
        title: தூய நோக்கங்களுடன் துணிவாகப் பிரசங்கித்தல்
      '3':
        title: துன்பத்தில் தீமோத்தேயு ஊக்கமளிக்கிறார்
      '4':
        title: பரிசுத்தமாக வாழப் பவுல் ஊக்குவிக்கிறார்
      '5':
        title: விழிப்புடன் இருந்து மீட்பை எதிர்பாருங்கள்
  2 Thessalonians:
    display_name: 2 தெசலோனிக்கேயர்
    author: பவுல் (விவாதத்திற்குரியது; சில அறிஞர்கள் இது பவுலின் பெயரில் எழுதப்பட்டது எனக் கருதுகின்றனர்).
    audience: இறுதிக்காலத்தைப் பற்றிய குழப்பத்தை எதிர்கொண்ட தெசலோனிக்கேயச் சபை.
    date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 51.
    chapters:
      '1':
        title: துன்புறுத்தலிலும் உண்மையாக இருப்பவர்களுக்குக் கடவுள் பலனளிக்கிறார்
      '2':
        title: கிறிஸ்துவின் வருகைக்கு முன் கலகம் வரும்
      '3':
        title: சபையின் வளர்ச்சிக்காகப் பவுல் வேண்டுகிறார்
  1 Timothy:
    display_name: 1 தீமோத்தேயு
    author: பவுல், அல்லது பவுலின் பெயரில் எழுதிய ஒரு சீடர் (மேய்ப்புப் பணிக் கடிதங்கள் பவுலின் பெயரில் எழுதப்பட்டவை என்ற கருத்து அறிஞர்களிடையே பரவலாக உள்ளது).
    audience: எபேசுவில் பவுலின் பிரதிநிதியாக இருந்த தீமோத்தேயுவுக்கு; பிற்காலத் திருச்சபை ஒழுங்கிற்கான வழிகாட்டிக் கையேடாகவும் உள்ளது.
    date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60களின் நடுப்பகுதி; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 90–110.
    chapters:
      '1':
        title: தீமோத்தேயு அங்கேயே இருக்குமாறு பவுல் வலியுறுத்துகிறார்
      '2':
        title: ஆட்சியாளர்களுக்காக வேண்டி அமைதியாக வாழுங்கள்
      '3':
        title: சபைத் தலைவர்களுக்கான தகுதிகள் வலியுறுத்தப்படுகின்றன
      '4':
        title: பொய்ப் போதகர்களையும் கட்டுக்கதைகளையும் நிராகரியுங்கள்
      '5':
        title: விதவைகளையும் மூப்பர்களையும் உரிய முறையில் மதியுங்கள்
      '6':
        title: செல்வத்தைப் பற்றி தீமோத்தேயுவுக்குப் பவுல் அறிவுரை கூறுகிறார்
  2 Timothy:
    display_name: 2 தீமோத்தேயு
    author: பவுல், அல்லது பவுலின் பெயரில் எழுதிய ஒரு சீடர்.
    audience: தீமோத்தேயுவுக்கு — சிறையிலிருந்து பவுல் கூறும் பிரியாவிடையாக வடிவமைக்கப்பட்டுள்ளது.
    date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60களின் நடுப்பகுதி; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 90–110.
    chapters:
      '1':
        title: தீமோத்தேயுவே, கிருபையில் உறுதியாக நிலைத்திரு
      '2':
        title: கிறிஸ்துவுக்காகத் துன்பத்தைத் தாங்குங்கள்
      '3':
        title: பொய்ப் போதகர்களைத் தவிர்க்குமாறு எச்சரிக்கை
      '4':
        title: அனைவருக்கும் உண்மையுடன் பிரசங்கியுங்கள்
  Titus:
    display_name: தீத்து
    author: பவுல், அல்லது பவுலின் பெயரில் எழுதிய ஒரு சீடர்.
    audience: கிரேத்தாவில் பவுலின் பிரதிநிதியாக இருந்த தீத்துவுக்கு.
    date: பவுல் எழுதியிருந்தால் சுமார் கி.பி. 60களின் நடுப்பகுதி; பவுலின் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 90–110.
    chapters:
      '1':
        title: கிரேத்தாவில் தீத்துவுக்குப் பவுல் அறிவுறுத்துகிறார்
      '2':
        title: எல்லா வயதினரும் கிருபையுடன் வாழக் கற்பியுங்கள்
      '3':
        title: கிறிஸ்துவை எதிர்பார்த்து தாழ்மையுடன் வாழுங்கள்
  Philemon:
    display_name: பிலேமோன்
    author: பவுல், தீமோத்தேயுவுடன்.
    audience: கிறிஸ்தவரும் அடிமையின் உரிமையாளருமான பிலேமோனுக்கு, தப்பியோடிய அவரது அடிமை ஒநேசிமுவைக் குறித்து.
    date: சுமார் கி.பி. 60–62.
    chapters:
      '1':
        title: ஒநேசிமுவின் விடுதலைக்காகப் பவுல் மன்றாடுகிறார்
  Hebrews:
    display_name: எபிரெயர்
    author: ஆசிரியர் பெயர் தெரியவில்லை. மரபில் பவுல், அப்பொல்லோ, பர்னபா, பிரிஸ்கில்லா மற்றும் பிறரின் பெயர்கள் முன்வைக்கப்பட்டுள்ளன; எந்தக் கருத்திலும் பொதுவான ஒருமித்த முடிவு இல்லை.
    audience: தாங்கள் அறிக்கையிட்ட கிறிஸ்தவ நம்பிக்கையிலிருந்து பின்வாங்கத் தூண்டப்பட்ட கிரேக்க மொழி பேசும் யூதக் கிறிஸ்தவர்கள்.
    date: சுமார் கி.பி. 60–95.
    chapters:
      '1':
        title: கடவுள் தமது மகன் மூலம் பேசுகிறார்
      '2':
        title: துன்பத்தின் வழியாக இயேசு மீட்கிறார்
      '3':
        title: உண்மையுள்ள இயேசுவை நோக்கியிருங்கள்
      '4':
        title: கடவுள் வாக்களித்த ஓய்வில் நுழையுங்கள்
      '5':
        title: கிறிஸ்து நிறைவான பலியைச் செலுத்தினார்
      '6':
        title: ஆவிக்குரிய முதிர்ச்சியை நோக்கி முன்னேறுங்கள்
      '7':
        title: மெல்கிசேதேக்கின் முறையின்படி இயேசு என்றென்றும் ஆசாரியர்
      '8':
        title: இயேசுவின் இரத்தத்தின் மூலம் புதிய உடன்படிக்கை
      '9':
        title: உண்மையான பரலோகப் பரிசுத்த இடத்திற்குள் இயேசு நுழைகிறார்
      '10':
        title: கிறிஸ்துவின் இரத்தத்தின் மூலம் அருகில் வாருங்கள்
      '11':
        title: முன்னோர்களின் விசுவாசம் நிலைத்திருக்கிறது
      '12':
        title: இயேசுவுடன் துன்பத்தைத் தாங்குங்கள்
      '13':
        title: அன்புடனும் நம்பிக்கையுடனும் வாழுங்கள்
  James:
    display_name: யாக்கோபு
    author: மரபுப்படி இயேசுவின் சகோதரரான யாக்கோபு; இது அவரால் எழுதப்பட்டதா அல்லது அவர் பெயரில் எழுதப்பட்டதா என்பதில் நவீன ஆய்வாளர்களிடையே கருத்து வேறுபாடு உள்ளது.
    audience: புலம்பெயர்ந்து வாழ்ந்த யூதக் கிறிஸ்தவச் சபைகள்.
    date: அவரே எழுதியிருந்தால் சுமார் கி.பி. 50–60கள்; அவர் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. முதலாம் நூற்றாண்டின் பிற்பகுதி.
    chapters:
      '1':
        title: சோதனைகளால் பரிசோதிக்கப்பட்ட விசுவாசம் நிலைத்திருக்கிறது
      '2':
        title: செயல்களில்லாத விசுவாசம் செத்தது
      '3':
        title: நாவை அடக்கி ஞானமாகப் பேசுங்கள்
      '4':
        title: தன்னலத்திலிருந்து சண்டைகள் எழுகின்றன
      '5':
        title: ஒடுக்குகிற செல்வர்களுக்குத் தீர்ப்பு நெருங்குகிறது
  1 Peter:
    display_name: 1 பேதுரு
    author: மரபுப்படி திருத்தூதர் பேதுரு எழுதியதாகவும், சில்வானு எழுத்தராகச் செயல்பட்டதாகவும் கருதப்படுகிறது; சில ஆய்வாளர்கள் இது பேதுருவின் பெயரில் எழுதப்பட்டதாகக் கருதுகின்றனர்.
    audience: சமூகப் பகைமையை எதிர்கொண்ட ரோம ஆசியா மைனரிலிருந்த கிறிஸ்தவர்கள்.
    date: பேதுரு எழுதியிருந்தால் சுமார் கி.பி. 60கள்; அவர் பெயரில் எழுதப்பட்டிருந்தால் சுமார் கி.பி. 70–90கள்.
    chapters:
      '1':
        title: விண்ணக உரிமைப்பேற்றில் நம்பிக்கை
      '2':
        title: உயிருள்ள கல்லின்மேல் கட்டப்படும் விசுவாசிகள்
      '3':
        title: மனைவியர் தங்கள் வாழ்வால் கிறிஸ்துவை மதிக்கிறார்கள்
      '4':
        title: நன்மை செய்வதற்காகத் துன்புறுங்கள்
      '5':
        title: மூப்பர்கள் முன்மாதிரியாக இருந்து பராமரிக்கிறார்கள்
  2 Peter:
    display_name: 2 பேதுரு
    author: மரபுப்படி பேதுரு; இது அவரது பெயரில் எழுதப்பட்டது என்பது நவீன ஆய்வாளர்களிடையே பரவலாக ஏற்கப்படும் கருத்து.
    audience: கிறிஸ்துவின் மறுவருகையை மறுத்து ஏளனம் செய்தவர்களை எதிர்கொண்ட கிறிஸ்தவர்கள்.
    date: சுமார் கி.பி. இரண்டாம் நூற்றாண்டின் தொடக்கம்.
    chapters:
      '1':
        title: ஆன்மிக வளர்ச்சியைப் பேதுரு கற்பிக்கிறார்
      '2':
        title: பொய்ப் போதகர்கள் விரைவான தீர்ப்பை வரவழைக்கிறார்கள்
      '3':
        title: இறுதித் தீர்ப்பைக் குறித்து பேதுரு எச்சரிக்கிறார்
  1 John:
    display_name: 1 யோவான்
    author: ஆசிரியர் பெயர் தெரியவில்லை; மரபுப்படி திருத்தூதர் யோவான் அல்லது யோவானிய மூப்பர்.
    audience: ஒரு பிளவுக்குப் பிறகு, யார் தங்களைச் சேர்ந்தவர்கள் என்பதை வரையறுத்துக்கொண்டிருந்த யோவானியச் சமூகம்.
    date: சுமார் கி.பி. 90–110.
    chapters:
      '1':
        title: ஒளி உண்மையான ஒன்றிப்பை வெளிப்படுத்துகிறது
      '2':
        title: அன்பு கடவுளின் கட்டளைகளைக் கடைப்பிடிக்கிறது
      '3':
        title: கடவுளிடமிருந்து பிறந்தவர்கள் பாவத்தை வெல்கிறார்கள்
      '4':
        title: உண்மையான அன்பு கடவுளிடமிருந்து வருகிறது
      '5':
        title: இயேசுவை நம்புகிறவருக்கு நிலைவாழ்வு உண்டு
  2 John:
    display_name: 2 யோவான்
    author: “மூப்பர்.”
    audience: பொய்ப் போதகர்களைக் குறித்து எச்சரிக்கப்பட்ட ஒரு குறிப்பிட்ட கிறிஸ்தவச் சபை (“தேர்ந்தெடுக்கப்பட்ட அம்மையார்”).
    date: சுமார் கி.பி. 90–110.
    chapters:
      '1':
        title: பொய்ப் போதகர்களைக் குறித்து மூப்பர் எச்சரிக்கிறார்
  3 John:
    display_name: 3 யோவான்
    author: “மூப்பர்.”
    audience: பயணம் செய்த மறைப்பணியாளர்களைத் தங்கவைத்த தனிநபர் தலைவரான காயு.
    date: சுமார் கி.பி. 90–110.
    chapters:
      '1':
        title: காயு நலம்பெற மூப்பர் மன்றாடுகிறார்
  Jude:
    display_name: யூதா
    author: மரபுப்படி யாக்கோபுக்கும் இயேசுவுக்கும் சகோதரரான யூதா.
    audience: ஒழுக்கக்கேட்டை ஆதரித்த போதகர்கள் ஊடுருவிக்கொண்டிருந்த கிறிஸ்தவச் சமூகங்கள்.
    date: சுமார் கி.பி. 60–90கள்.
    chapters:
      '1':
        title: இறைபக்தியற்ற ஊடுருவலாளர்களைக் குறித்து யூதா எச்சரிக்கிறார்
  Revelation:
    display_name: திருவெளிப்பாடு
    author: பத்மோசைச் சேர்ந்த யோவான் (அவரது எழுத்துநடை நான்காம் நற்செய்தியிலிருந்து வேறுபட்டது).
    audience: பேரரசின் அழுத்தத்திற்கு உட்பட்ட ரோம ஆசியா மைனரிலிருந்த ஏழு கிறிஸ்தவச் சபைகள்.
    date: சுமார் கி.பி. 90கள்; மரபுப்படி தொமித்தியனின் ஆட்சிக்காலத்தில்.
    chapters:
      '1':
        title: கடவுள் யோவானுக்குத் தரிசனங்களைக் காட்டுகிறார்
      '2':
        title: இயேசு ஏழு சபைகளிடம் பேசுகிறார்
      '3':
        title: மனம் மாறும்படி லவோதிக்கேயாவை இயேசு எச்சரிக்கிறார்
      '4':
        title: விண்ணக அரியணை மகிமையில் ஒளிர்கிறது
      '5':
        title: ஆட்டுக்குட்டி சுருளை வாங்கி மீட்பளிக்கிறது
      '6':
        title: நான்கு குதிரைவீரர்கள் பெரும் கேடுகளைக் கொண்டுவருகிறார்கள்
      '7':
        title: முத்திரையிடப்பட்ட பணியாளர்கள் நித்தியப் புகழைப் பாடுகிறார்கள்
      '8':
        title: ஏழு எக்காளங்கள் கொடிய தீர்ப்புகளை முழங்குகின்றன
      '9':
        title: வெட்டுக்கிளிகள் பூமியின் பாவிகளை வதைக்கின்றன
      '10':
        title: வல்லமையுள்ள தூதர் இறுதி காலத்தைப் பற்றி ஆணையிடுகிறார்
      '11':
        title: இரு சாட்சிகள் இறைவாக்குரைத்து பின்னர் உயிர்த்தெழுகிறார்கள்
      '12':
        title: ஆட்சி செய்ய விதிக்கப்பட்ட மகனைப் பெண் பெற்றெடுக்கிறாள்
      '13':
        title: கடலிலிருந்து மிருகம் எழுகிறது
      '14':
        title: ஆட்டுக்குட்டி உண்மையுள்ளவர்களைத் தன்னிடம் சேர்க்கிறது
      '15':
        title: விண்ணகத்தின் சினத்தை யோவான் காண்கிறார்
      '16':
        title: தூதர்கள் சினக் கிண்ணங்களை ஊற்றுகிறார்கள்
      '17':
        title: பாபிலோனின் தீர்ப்பும் கடவுளின் வெற்றியும்
      '18':
        title: பாபிலோனின் வீழ்ச்சியைக் கண்டு விண்ணகம் மகிழ்கிறது
      '19':
        title: ஆட்டுக்குட்டியின் திருமணத்தை விண்ணகம் கொண்டாடுகிறது
      '20':
        title: இறுதித் தீர்ப்பை யோவான் காண்கிறார்
      '21':
        title: அனைத்தும் புதிதாக்கப்படுகின்றன
      '22':
        title: இயேசு விரைவில் வருகிறார்
  Tobit:
    display_name: தோபித்து
    author: ஆசிரியர் பெயர் தெரியவில்லை.
    audience: அந்நிய ஆட்சியின்கீழ் பக்தி, திருமணம், இறைபராமரிப்பு ஆகியவற்றை எதிர்கொண்டு வாழ்ந்த புலம்பெயர் யூதர்கள்.
    date: சுமார் கி.மு. 225–175; அரமேய மொழியில் இயற்றப்பட்டது; எபிரேயப் பதிப்பும் கும்ரானில் கிடைத்த சான்றுகளில் காணப்படுகிறது.
    chapters:
      '1':
        title: தோபித்து கடவுளை உண்மையுடன் நினைவுகூருகிறார்
      '2':
        title: இகழப்பட்ட அயலாரைத் தோபித்து அடக்கம் செய்கிறார்
      '3':
        title: தோபித்து அழுது, மரணத்திற்காக மன்றாடுகிறார்
      '4':
        title: நீதியாக வாழும்படி தோபித்து தன் மகனுக்கு அறிவுறுத்துகிறார்
      '5':
        title: வழிகாட்டுதலுடன் தோபியா புறப்படுகிறார்
      '6':
        title: குணமாக்கும் மீனைத் தோபியா பிடிக்கிறார்
      '7':
        title: எக்பத்தானாவில் சாராவைத் தோபியா மணக்கிறார்
      '8':
        title: தோபியா சாராவை மணந்து மன்றாடுகிறார்
      '9':
        title: கபாயேல் பணத்தைத் தோபித்திடம் திருப்பிக் கொடுக்கிறார்
      '10':
        title: தோபியா பாதுகாப்பாக வீடு திரும்புகிறார்
      '11':
        title: மகனால் தோபித்தின் பார்வை மீட்கப்படுகிறது
      '12':
        title: ரபேல் தமது உண்மையான அடையாளத்தை வெளிப்படுத்துகிறார்
      '13':
        title: எருசலேமுக்காகத் தோபித்து மன்றாடுகிறார்
      '14':
        title: இஸ்ரவேலின் எதிர்காலத்தைத் தோபித்து முன்னறிகிறார்
  Judith:
    display_name: யூதித்து
    author: ஆசிரியர் பெயர் தெரியவில்லை.
    audience: அந்நிய அச்சுறுத்தலுக்கு உள்ளான யூதர்கள் — பக்தியுடன் துணிந்து எதிர்த்த கதையாக இது அமைந்துள்ளது.
    date: சுமார் கி.மு. 150–100.
    chapters:
      '1':
        title: அர்பக்சாதை நெபுகத்னேசர் தாக்குகிறார்
      '2':
        title: ஒலோபெர்னே மேற்குநோக்கிப் படையெடுக்கிறார்
      '3':
        title: கடலோர மக்கள் தங்கள் செல்வத்தை ஒப்படைக்கிறார்கள்
      '4':
        title: இஸ்ரவேலர் நோன்பிருந்து உதவிக்காக மன்றாடுகிறார்கள்
      '5':
        title: இஸ்ரவேலின் வரலாற்றை ஆக்கியோர் விளக்குகிறார்
      '6':
        title: ஒலோபெர்னேக்கு ஆக்கியோர் எச்சரிக்கை விடுக்கிறார்
      '7':
        title: பெத்தூலியாவில் தண்ணீர் தீர்ந்துவிடுகிறது
      '8':
        title: கடவுள் மீட்பார் என்று யூதித்து உறுதியளிக்கிறார்
      '9':
        title: கடவுளின் வல்லமைக்காக யூதித்து மன்றாடுகிறார்
      '10':
        title: யூதித்து அசீரியப் பாளையத்திற்குள் நுழைகிறார்
      '11':
        title: யூதித்தை உள்ளே வரும்படி ஒலோபெர்னே அழைக்கிறார்
      '12':
        title: கடவுளின் வழிகாட்டுதலை யூதித்து நாடுகிறார்
      '13':
        title: ஒலோபெர்னேயின் தலையை யூதித்து வெட்டுகிறார்
      '14':
        title: யூதித்தின் வெற்றியை இஸ்ரவேலர் கொண்டாடுகிறார்கள்
      '15':
        title: அசீரியரின் கொள்ளைப்பொருளை இஸ்ரவேலர் கைப்பற்றுகிறார்கள்
      '16':
        title: புகழ்ச்சிப் பாடலை யூதித்து வழிநடத்துகிறார்
  Greek Additions to Esther:
    display_name: எஸ்தரின் கிரேக்கச் சேர்க்கைகள்
    author: ஆசிரியர் பெயர் தெரியவில்லை; எஸ்தர் நூலின் கிரேக்க மொழிபெயர்ப்பில் சேர்க்கப்பட்ட துணைப் பகுதிகள்.
    audience: வெளிப்படையான மன்றாட்டுகளும் கடவுளைப் பற்றிய குறிப்புகளும் இடம்பெறும் எஸ்தர் கதையை விரும்பிய கிரேக்க மொழி பேசிய யூதர்கள்.
    date: சுமார் கி.மு. இரண்டாம்–முதலாம் நூற்றாண்டு.
    chapters:
      '1':
        title: மொர்தெக்காய் கனவு கண்டு அரசனை எச்சரிக்கிறார்
      '2':
        title: அழிவுக்கான ஆணைகளை அரசன் எழுதுகிறார்
      '3':
        title: மொர்தெக்காயும் எஸ்தரும் உதவிக்காக மன்றாடுகிறார்கள்
      '4':
        title: எஸ்தர் அரசன் முன்னிலையில் நுழைகிறார்
      '5':
        title: அரசன் ஆமானைத் தண்டித்து யூதர்களைக் காப்பாற்றுகிறார்
      '6':
        title: மொர்தெக்காய் கனவை நினைவுகூர்ந்து இறைவாக்குரைக்கிறார்
  Wisdom of Solomon:
    display_name: சாலொமோனின் ஞானம்
    author: ஆசிரியர் பெயர் தெரியவில்லை; சாலொமோனின் பெயரில் எழுதப்பட்டதாகக் கருதப்படுகிறது. கிரேக்க மொழியில், அநேகமாக அலெக்சாந்திரியாவில், ஹெலனிய யூத ஆசிரியர் ஒருவரால் இயற்றப்பட்டது.
    audience: கிரேக்கத் தத்துவத்துடன் உரையாடி, புறமத மற்றும் விசுவாசத்தைக் கைவிட்ட மாற்றுக் கருத்துகளுக்கு எதிராக இஸ்ரவேலின் ஞானத்தை ஆதரித்த ஹெலனிய யூதர்கள்.
    date: சுமார் கி.மு. 50 – கி.பி. 50.
    chapters:
      '1':
        title: தேடுகிறவர்களுக்குக் கடவுள் ஞானத்தை வெளிப்படுத்துகிறார்
      '2':
        title: தீயோர் வாழ்வின் உண்மையான மகிழ்ச்சியைப் புறக்கணிக்கிறார்கள்
      '3':
        title: நீதிமான்களின் ஆன்மாக்கள் அமைதியில் இளைப்பாறுகின்றன
      '4':
        title: நற்பண்பு மதிக்கப்படுகிறது; இறைபக்தியற்றோர் வெட்கமடைகிறார்கள்
      '5':
        title: நீதிமான்கள் தீயோரின் அக்கிரமத்தைத் துணிவுடன் வெளிப்படுத்துகிறார்கள்
      '6':
        title: உண்மையான அரசாட்சிக்கு ஞானம் வழிநடத்துகிறது
      '7':
        title: வேண்டுதல் ஞானத்தையும் புரிதலையும் தருகிறது
      '8':
        title: ஞானம் ஆட்சியாளர்களை வழிநடத்தி வலுப்படுத்துகிறது
      '9':
        title: அரசர் இறைஞானத்திற்காக வேண்டுகிறார்
      '10':
        title: ஞானம் நீதிமான்களைக் காத்து விடுவிக்கிறது
      '11':
        title: கடிந்துதிருத்துவதன் மூலம் கடவுள் இரக்கம் காட்டுகிறார்
      '12':
        title: சிலைகளை இகழ்வது வெற்று நம்பிக்கையையே தருகிறது
      '13':
        title: மக்கள் உயிரற்ற சிலைகளை வழிபடுகின்றனர்
      '14':
        title: கடல் வழியே கப்பல்களைக் கடவுள் வழிநடத்துகிறார்
      '15':
        title: கடவுளின் இரக்கம் உண்மையான வழிபாட்டுக்கு வழிகாட்டுகிறது
      '16':
        title: ஒடுக்குவோரைத் தீர்ப்பிடும்போது கடவுள் தம் மக்களுக்கு உணவளிக்கிறார்
      '17':
        title: அச்சமூட்டும் இரவின் பிடியில் சிக்கியவர்கள்
      '18':
        title: ஒளியால் கடவுள் வழிநடத்துகிறார்
      '19':
        title: இஸ்ரயேலுக்காக மேகங்கள் விலகுகின்றன
  Sirach:
    display_name: சீராக்கின் ஞானம்
    author: எருசலேமைச் சேர்ந்த சீராவின் மகன் எலெயாசரின் மகன் இயேசு; இவருடைய பேரன் இதை கிரேக்க மொழியில் மொழிபெயர்த்தார்.
    audience: ஹெலனியக் காலத்து எருசலேமில் ஞானத்தில் பயிற்றுவிக்கப்பட்ட இளம் யூத ஆண்கள்.
    date: எபிரேய மூலநூல் ஏறத்தாழ கி.மு. 195–175; கிரேக்க மொழிபெயர்ப்பு ஏறத்தாழ கி.மு. 132.
    chapters:
      '1':
        title: கடவுள் ஞானத்தை அளந்து வழங்குகிறார்
      '2':
        title: சோதனைகள் உண்மையுள்ள ஊழியர்களை மெய்ப்பிக்கின்றன
      '3':
        title: பெற்றோரை மதித்து நீண்ட ஆயுளைப் பெறுங்கள்
      '4':
        title: ஒடுக்கப்பட்டோரைக் காத்து ஞானத்தை நாடுங்கள்
      '5':
        title: செல்வத்தை அல்ல, கடவுளை நம்புங்கள்
      '6':
        title: உழவனைப்போல் ஞானத்தை நாடுங்கள்
      '7':
        title: மனத்தாழ்மையை இதயத்தில் ஆழமாகப் பதியவையுங்கள்
      '8':
        title: மூடரைத் தவிர்த்து முதியோரை மதியுங்கள்
      '9':
        title: பொறாமையையும் காமத்தையும் குறித்து எச்சரிக்கையாய் இருங்கள்
      '10':
        title: ஞானமுள்ள தலைமை ஒழுங்கைக் கொண்டுவருகிறது
      '11':
        title: ஞானம் ஏழைகளை உயர்த்துகிறது
      '12':
        title: பாவிகளுக்கு அல்ல, நீதிமான்களுக்கு உதவுங்கள்
      '13':
        title: தாரைத் தொட்டால் அது ஒட்டிக்கொள்ளும்
      '14':
        title: ஞானம் நிலையான ஆசீர்வாதத்தைத் தருகிறது
      '15':
        title: தன்னை நாடுவோரை ஞானம் சந்திக்கிறது
      '16':
        title: உண்மையுள்ள ஒருவர் ஒரு நகரத்தை நிலைநிறுத்துகிறார்
      '17':
        title: மனிதர்கள் கடவுளின் சாயலில் படைக்கப்பட்டார்கள்
      '18':
        title: நற்செயல்களின் பயனைக் கெடுக்காதீர்கள்
      '19':
        title: இன்பத்தைத் துரத்துவோர் அழிவடைகின்றனர்
      '20':
        title: பேசுவதற்கான நேரத்தை கவனமாகத் தேர்ந்தெடுங்கள்
      '21':
        title: வேண்டுங்கள், பாவத்தைவிட்டு விலகுங்கள், ஞானத்தை நாடுங்கள்
      '22':
        title: சோம்பல் அவமானத்தையும் துயரத்தையும் தருகிறது
      '23':
        title: உள்ளார்ந்த கட்டுப்பாட்டுக்கும் ஞானத்திற்கும் வேண்டுங்கள்
      '24':
        title: ஞானம் தன்னைப் புகழ்ந்து பேசுகிறது
      '25':
        title: ஞானம் கடவுளையும் மக்களையும் மதிக்கிறது
      '26':
        title: மனைவி மகிழ்ச்சியையோ வேதனையையோ தருகிறாள்
      '27':
        title: நீதியை நாடி, அதை பெருமையுடன் அணிந்துகொள்ளுங்கள்
      '28':
        title: பாவங்களை மன்னித்து இரக்கத்தைப் பெறுங்கள்
      '29':
        title: அயலாரை மன்னித்து இரக்கத்தைப் பெறுங்கள்
      '30':
        title: மகன்களை மதிப்புக்குரியவர்களாக வளருங்கள்
      '31':
        title: செல்வம் கவலையையும் வேதனையையும் தருகிறது
      '32':
        title: மனத்தாழ்மையுடன் முதலில் பிறருக்குப் பணியாற்றுங்கள்
      '33':
        title: தமக்கு அஞ்சுவோரைக் ஆண்டவர் காக்கிறார்
      '34':
        title: தெளிவான வழிகாட்டல் இல்லாவிட்டால் கனவுகள் தவறாக வழிநடத்தலாம்
      '35':
        title: தலைவர்கள் தாழ்மையும் ஞானமும் உள்ளவர்களாய் இருக்க வேண்டும்
      '36':
        title: ஆண்டவருக்கு அஞ்சுவதன் மூலம் மீட்பு வருகிறது
      '37':
        title: நண்பர்களையும் ஆலோசனையையும் ஞானமாகத் தேர்ந்தெடுங்கள்
      '38':
        title: மருத்துவர்களை மதியுங்கள்; குணமடைய வேண்டுங்கள்
      '39':
        title: திருச்சட்டத்தை அர்ப்பணிப்புடன் கடைப்பிடிப்பவரை சீராக்கு புகழ்கிறார்
      '40':
        title: வாழ்க்கையின் சுமையும் ஆசீர்வாதங்களும்
      '41':
        title: மரணம் இறுதி ஓய்வைக் கொண்டுவருகிறது
      '42':
        title: கடினமானாலும் அவசியமானவற்றைப் பேசுங்கள்
      '43':
        title: வானத்தின் அதிசயங்கள் கடவுளைப் புகழத் தூண்டுகின்றன
      '44':
        title: முன்னோர்கள் விசுவாசத்தால் வழிநடத்தப்பட்டார்கள்
      '45':
        title: அனைவரையும்விட மோசே உயர்வாக மதிக்கப்படுகிறார்
      '46':
        title: கடவுளின் மக்களுக்காக யோசுவா போரிடுகிறார்
      '47':
        title: நாத்தானை எதிர்கொண்ட தாவீது புகழப்படுகிறார்
      '48':
        title: எலியா தீப்போன்ற சொற்களால் இறைவாக்குரைக்கிறார்
      '49':
        title: சீர்திருத்தத்திற்காக யோசியா மதிக்கப்படுகிறார்
      '50':
        title: சீமோன் தம் மக்களை ஆசீர்வதிக்கிறார்
      '51':
        title: என் கடவுளை நான் புகழ்கிறேன்
  Baruch:
    display_name: பாரூக்கு
    author: ஆசிரியர் பெயர் தெரியவில்லை; எரேமியாவின் எழுத்தரான பாரூக்கின் பெயரில் எழுதப்பட்டதாகக் கருதப்படுகிறது.
    audience: நாடுகடத்தல், மனந்திரும்புதல், ஞானம் ஆகியவற்றைச் சிந்தித்த புலம்பெயர்ந்த யூதர்கள்.
    date: ஏறத்தாழ கி.மு. 2ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: ஆற்றங்கரையில் பாரூக்கு பாவஅறிக்கையை வாசிக்கிறார்
      '2':
        title: மோசே வழியாக விடுத்த எச்சரிக்கைகளை ஆண்டவர் நிறைவேற்றுகிறார்
      '3':
        title: மக்கள் கூக்குரலிட்டு, பாவத்தை அறிக்கையிட்டு, திரும்புகின்றனர்
      '4':
        title: கடவுளின் கட்டளைகள் வாழ்வளிப்பவை
      '5':
        title: எருசலேமே, நிலையான மாட்சியை அணிந்துகொள்
  1 Maccabees:
    display_name: 1 மக்கபேயர்
    author: ஆசிரியர் பெயர் தெரியவில்லை; எருசலேமைச் சேர்ந்த ஒருவர் எபிரேய மொழியில் எழுதியிருக்கலாம் (கிரேக்கப் பதிப்பு மட்டுமே எஞ்சியுள்ளது).
    audience: ஹஸ்மோனியக் கிளர்ச்சிக் காலத்திலும் அதற்குப் பின்னரும் வாழ்ந்த யூதர்கள்; ஹஸ்மோனிய வம்சத்தின் ஆட்சியுரிமையை எடுத்துரைக்கிறது.
    date: ஏறத்தாழ கி.மு. 100.
    chapters:
      '1':
        title: கிரேக்கக் கொடுங்கோன்மையை இஸ்ரயேல் எதிர்க்கிறது
      '2':
        title: திருச்சட்டத்தைக் கடைப்பிடிப்பதாக மத்தத்தியா உறுதியளிக்கிறார்
      '3':
        title: இஸ்ரயேலுக்கு உதவி வேண்டி யூதா மன்றாடுகிறார்
      '4':
        title: ஆலயம் தூய்மைப்படுத்தப்பட்டு மீண்டும் அர்ப்பணிக்கப்படுகிறது
      '5':
        title: சுற்றியுள்ள நாடுகளை யூதா தோற்கடிக்கிறார்
      '6':
        title: தோல்விக்குப் பிறகு அந்தியோக்கு இறக்கிறார்
      '7':
        title: நிக்கானோரின் படையை யூதா தோற்கடிக்கிறார்
      '8':
        title: ரோமரின் நட்பை யூதா நாடுகிறார்
      '9':
        title: யூதாவுக்குப் பிறகு யோனத்தான் தலைமை ஏற்கிறார்
      '10':
        title: அலெக்சாந்தரின் ஆதரவை யோனத்தான் பெறுகிறார்
      '11':
        title: தாலமியின் அச்சுறுத்தலை யோனத்தான் எதிர்கொள்கிறார்
      '12':
        title: யூதேயாவின் கோட்டைகளைச் சீமோன் வலுப்படுத்துகிறார்
      '13':
        title: எருசலேம் கோட்டையைச் சீமோன் முறியடிக்கிறார்
      '14':
        title: சீமோன் இஸ்ரயேலை வலுப்படுத்தி அமைதியை நிலைநாட்டுகிறார்
      '15':
        title: யூதர்களின் உரிமைகளை அந்தியோக்கு உறுதிப்படுத்துகிறார்
      '16':
        title: கெந்தபேயுவின் படைகளை யோவான் தோற்கடிக்கிறார்
  2 Maccabees:
    display_name: 2 மக்கபேயர்
    author: சிரேனேவைச் சேர்ந்த யாசோன் எழுதிய நீண்ட படைப்பைச் சுருக்கிய, பெயர் தெரியாத ஒருவர்; கிரேக்க மொழியில் இயற்றப்பட்டது.
    audience: கிரேக்க மொழி பேசிய புலம்பெயர்ந்த யூதர்கள் — மறைச்சாட்சிய மரணம், இறைபராமரிப்பு, உயிர்த்தெழுதல் ஆகியவற்றை வலியுறுத்துகிறது.
    date: ஏறத்தாழ கி.மு. 124 அல்லது அதற்குச் சற்றுப் பிந்திய காலம்.
    chapters:
      '1':
        title: விடுதலைக்காக யூதர்கள் வேண்டுகின்றனர்
      '2':
        title: தூய்மைப்படுத்தலில் பங்கேற்கத் தலைவர்கள் அழைக்கின்றனர்
      '3':
        title: எலியோதோர் ஆலயத்தை அச்சுறுத்துகிறார்
      '4':
        title: ஒனியாவுக்கு எதிராக யாசோன் சூழ்ச்சி செய்கிறார்
      '5':
        title: அந்தியோக்கு ஆலயத்தைத் தீட்டுப்படுத்துகிறார்
      '6':
        title: பிறமதச் சட்டங்களை யூதர்கள் மறுக்கின்றனர்
      '7':
        title: ஏழு சகோதரர்கள் உண்மையுடன் இறக்கின்றனர்
      '8':
        title: நிக்கானோரை யூதா மக்கபேயு தோற்கடிக்கிறார்
      '9':
        title: அந்தியோக்கு வேதனையில் இறக்கிறார்
      '10':
        title: யூதர்களுடன் அமைதியை லீசியா நாடுகிறார்
      '11':
        title: யூதர்களின் உரிமைகளை லீசியா வழங்குகிறார்
      '12':
        title: வீழ்ந்தவர்களுக்காக யூதாஸ் மன்றாடுகிறார்
      '13':
        title: வெற்றிக்காக யூதாஸ் மன்றாடுகிறார்
      '14':
        title: நிக்கானோர் சமாதான உடன்பாட்டைத் துரோகம் செய்கிறான்
      '15':
        title: நிக்கானோரின் தோல்வியை யூதர்கள் கொண்டாடுகின்றனர்
  1 Esdras:
    display_name: 1 எஸ்திராஸ்
    author: ஆசிரியர் அறியப்படாதவர்; 2 நாளாகமம் 35–36, எஸ்றா, நெகேமியா 7–8 ஆகியவற்றை வேறு வரிசையில் அமைத்த கிரேக்க மறுதொகுப்பு.
    audience: திரும்பிவருதலையும் மீட்டமைப்பையும் பற்றிய தெளிவான கதையை விரும்பிய ஹெலெனியக் கால யூதர்கள்.
    date: சுமார் பொ.ஆ.மு. 2–1ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: யோசியா பஸ்காவைக் கொண்டாடி இறக்கிறார்
      '2':
        title: எரேமியாவின் வார்த்தையைச் சைரஸ் நிறைவேற்றுகிறார்
      '3':
        title: சத்தியமே வெல்லும் என செருபாபேல் அறிவிக்கிறார்
      '4':
        title: ஆலயத்தை மீண்டும் கட்ட தரியு அனுமதிக்கிறார்
      '5':
        title: நாடுகடத்தப்பட்டோர் திரும்பி பலிபீடத்தைக் கட்டுகின்றனர்
      '6':
        title: ஆலயப் பணியைத் தீர்க்கதரிசிகள் ஊக்குவிக்கின்றனர்
      '7':
        title: ஆலயம் மிகுந்த மகிழ்ச்சியுடன் கட்டிமுடிக்கப்படுகிறது
      '8':
        title: எஸ்றா மக்களைப் பாதுகாப்பாகத் திரும்ப அழைத்துவருகிறார்
      '9':
        title: உண்மையற்ற திருமணங்களை எஸ்றா எதிர்கொள்கிறார்
  Prayer of Manasseh:
    display_name: மனாசேயின் மன்றாட்டு
    author: ஆசிரியர் அறியப்படாதவர்; மனாசே மன்னரின் பெயரில் புனைவாகச் சார்த்தப்பட்டது.
    audience: மனாசேயின் மனந்திரும்புதலுடன் தங்களை அடையாளப்படுத்திக்கொண்ட மனந்திரும்புவோர் — சில மரபுகளில் வழிபாட்டில் பயன்படுத்தப்பட்டது.
    date: சுமார் பொ.ஆ.மு. 2–1ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: இறை இரக்கத்திற்காக மனாசே மன்றாடுகிறார்
  Psalm 151:
    display_name: சங்கீதம் 151
    author: ஆசிரியர் அறியப்படாதவர்; தாவீதின் பெயரில் புனைவாகச் சார்த்தப்பட்டது. இதன் ஓர் எபிரெய வடிவம் 11QPsa-வில் சான்றுபெற்றுள்ளது.
    audience: தாவீதின் சங்கீதத் தொகுப்பில் ஈடுபாடு கொண்ட புலம்பெயர் மற்றும் கும்ரான் சமூகங்கள்.
    date: சுமார் பொ.ஆ.மு. 2ஆம் நூற்றாண்டு அல்லது அதற்கு முன்பு.
    chapters:
      '1':
        title: இளைய மேய்ப்பர் மன்னராக அபிஷேகம் பெறுகிறார்
  3 Maccabees:
    display_name: 3 மக்கபேயர்
    author: ஆசிரியர் அறியப்படாதவர்; கிரேக்க மொழியில் இயற்றப்பட்டது.
    audience: எகிப்தில் வாழ்ந்த கிரேக்க மொழி பேசிய புலம்பெயர் யூதர்கள் — நான்காம் தாலமியின் ஆட்சிக்காலத்தில் அமைந்த ஒரு விடுதலைக் கதை.
    date: சுமார் பொ.ஆ.மு. 1ஆம் நூற்றாண்டு முதல் பொ.ஆ. 1ஆம் நூற்றாண்டு வரை.
    chapters:
      '1':
        title: ஆலயத்திற்குள் நுழைய மன்னன் வற்புறுத்துகிறான்
      '2':
        title: விடுதலைக்காக இஸ்ரவேல் மன்றாடுகிறது
      '3':
        title: யூதர்களை அழிக்க மன்னன் திட்டமிடுகிறான்
      '4':
        title: பொதுமக்கள் முன் கொண்டுவரப்பட்ட யூதர்கள் புலம்புகின்றனர்
      '5':
        title: தண்டனையை நிறைவேற்றுவதற்காக யானைகள் கட்டிவைக்கப்படுகின்றன
      '6':
        title: விண்ணகத் தூதர்கள் யூதர்களைக் காப்பாற்றுகின்றனர்
      '7':
        title: மன்னன் யூதர்களைப் பாதுகாப்பாக விடுவிக்கிறான்
  4 Maccabees:
    display_name: 4 மக்கபேயர்
    author: ஆசிரியர் அறியப்படாதவர்; ஸ்தோயிக் தத்துவத்தின் தாக்கம் பெற்ற, கிரேக்க மொழி பேசிய ஒரு யூத ஆசிரியர்.
    audience: ஹெலெனிய யூதர்கள் — உண்மைப்பற்றின் வழியாக உணர்ச்சிகளைப் பகுத்தறிவு கட்டுப்படுத்துவதைப் பற்றிய ஒரு தத்துவப் பேருரை.
    date: சுமார் பொ.ஆ. 1ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: உணர்ச்சிகள்மீது பகுத்தறிவு ஆட்சி செய்கிறது
      '2':
        title: பகுத்தறிவின் கட்டுப்பாட்டைத் திருச்சட்டம் வழிநடத்துகிறது
      '3':
        title: எதிரியின் தண்ணீரைத் தாவீது மறுக்கிறார்
      '4':
        title: விண்ணகப் படைகள் யூதர்களைக் காக்கின்றன
      '5':
        title: பன்றியிறைச்சியை எலெயாசர் மறுக்கிறார்
      '6':
        title: எலெயாசர் உறுதியாக நிலைத்து இறக்கிறார்
      '7':
        title: பகுத்தறிவின் வல்லமையை எலெயாசர் நிரூபிக்கிறார்
      '8':
        title: கொடுங்கோலனை ஏழு சகோதரர்கள் எதிர்கொள்கின்றனர்
      '9':
        title: முதல் சகோதரர் மறைச்சாட்சியாக இறக்கிறார்
      '10':
        title: நாவை அளிக்க நான்காம் சகோதரர் மறுக்கிறார்
      '11':
        title: ஆறாம் சகோதரர் சித்திரவதையைத் தாங்குகிறார்
      '12':
        title: இளைய சகோதரர் தன்னையே எறிகிறார்
      '13':
        title: சகோதரர்கள் ஒருவரையொருவர் ஊக்குவிக்கின்றனர்
      '14':
        title: இறக்கும்படி தாய் தன் மகன்களை ஊக்குவிக்கிறார்
      '15':
        title: மகன்களைவிடக் கடவுளைத் தாய் தேர்ந்தெடுக்கிறார்
      '16':
        title: இறக்கும்படி தாய் தன் மகன்களை இணங்கச் செய்கிறார்
      '17':
        title: ஏழு மறைச்சாட்சிகளும் கடவுளை மகிமைப்படுத்துகின்றனர்
      '18':
        title: பிள்ளைகள் திருச்சட்டத்தைக் கடைப்பிடித்து வாழ்கின்றனர்
  Bel and the Dragon:
    display_name: பேலும் வலுசர்ப்பமும்
    author: ஆசிரியர் அறியப்படாதவர்; தானியேல் நூலின் கிரேக்கக் கூடுதல் பகுதிகளில் ஒன்று.
    audience: கிரேக்க மொழி பேசிய யூதர்கள் — சிலைவழிபாட்டுக்கு எதிரான ஏளனக் கண்டனப் படைப்பு.
    date: சுமார் பொ.ஆ.மு. 2–1ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: பேலையும் வலுசர்ப்பத்தையும் தானியேல் தோற்கடிக்கிறார்
  Letter of Jeremiah:
    display_name: எரேமியாவின் கடிதம்
    author: ஆசிரியர் அறியப்படாதவர்; எரேமியாவின் பெயரில் புனைவாகச் சார்த்தப்பட்டது.
    audience: சுற்றியிருந்த சிலைவழிபாட்டால் ஈர்க்கப்படும் ஆபத்தில் இருந்த புலம்பெயர் யூதர்கள்.
    date: சுமார் பொ.ஆ.மு. 4–2ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: பாபிலோனில் சிலைகள் வீணாக அஞ்சப்படுகின்றன
  Prayer of Azariah and Song of the Three:
    display_name: அசரியாவின் மன்றாட்டும் மூவரின் பாடலும்
    author: ஆசிரியர் அறியப்படாதவர்; தானியேல் நூலின் கிரேக்கக் கூடுதல் பகுதிகளில் ஒன்று.
    audience: கிரேக்க மொழி பேசிய யூதர்கள் — தானியேல் 3-க்கான வழிபாட்டு உள்ளடக்கம்.
    date: சுமார் பொ.ஆ.மு. 2ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: கொழுந்துவிட்டு எரியும் நெருப்பில் அசரியா மன்றாடுகிறார்
  Susanna:
    display_name: சூசன்னா
    author: ஆசிரியர் அறியப்படாதவர்; தானியேல் நூலின் கிரேக்கக் கூடுதல் பகுதிகளில் ஒன்று.
    audience: கிரேக்க மொழி பேசிய யூதர்கள் — நீதிமையையும் கண்டிக்கப்படும் பொய்ச் சாட்சியத்தையும் பற்றிய ஒரு கதை.
    date: சுமார் பொ.ஆ.மு. 2–1ஆம் நூற்றாண்டு.
    chapters:
      '1':
        title: நீதிபதிகளின் சதியைத் தானியேல் அம்பலப்படுத்துகிறார்
  1 Clement:
    display_name: 1 கிளெமெந்து
    author: ஆசிரியர் அறியப்படாதவர்; ரோமின் கிளெமெந்துவுக்கு சார்த்தப்படுகிறது.
    audience: தலைமைத்துவப் பூசலில் சிக்கியிருந்த கொரிந்துவின் கிறிஸ்தவச் சபை.
    date: சுமார் பொ.ஆ. 96.
    chapters:
      '1':
        title: பரிசுத்தமற்ற கிளர்ச்சியால் சகோதரர்கள் துன்பப்படுகின்றனர்
      '2':
        title: தாழ்மை அமைதியான ஆர்வத்தைத் தருகிறது
      '3':
        title: பொறாமை போரும் சிறையிருப்பும் கொண்டுவருகிறது
      '4':
        title: பண்டைய கொலைகளுக்குப் பொறாமை வழிவகுத்தது
      '5':
        title: பேதுருவும் பவுலும் உறுதியுடன் துன்பத்தைத் தாங்கினர்
      '6':
        title: பொறாமை கடவுள் தேர்ந்தெடுத்த பெண்களைத் துன்புறுத்தியது
      '7':
        title: மீட்பிற்கான இரத்தம் விலைமதிப்புடையது
      '8':
        title: பாவியின் மனந்திரும்புதலை ஆண்டவர் விரும்புகிறார்
      '9':
        title: நீதிமானான ஏனோக்கு எடுத்துக்கொள்ளப்பட்டார்
      '10':
        title: கீழ்ப்படிதலால் ஆபிரகாம் உண்மையுள்ளவர் என நிரூபித்தார்
      '11':
        title: விருந்தோம்பலினால் லோத்து மீட்கப்பட்டார்
      '12':
        title: ராகாப் உண்மையுடன் உளவாளிகளை மறைக்கிறார்
      '13':
        title: நம்மைத் தாழ்த்தி ஆண்டவரை நாடுவோம்
      '14':
        title: ஒருவரையொருவர் மென்மையாக நடத்துங்கள்
      '15':
        title: இறைப்பற்றுடன் இணைந்த சமாதானத்தை நாடுங்கள்
      '16':
        title: மேசியா எளிமையிலும் தாழ்மையிலும் வந்தார்
      '17':
        title: கடுந்துறவு வாழ்ந்த தீர்க்கதரிசிகளைப் பின்பற்றுங்கள்
      '18':
        title: தாவீது தாழ்மையுடன் தன் பாவங்களை அறிக்கையிடுகிறார்
      '19':
        title: அமைதியான வாழ்வுக்குத் தாழ்மை வழிகாட்டுகிறது
      '20':
        title: படைப்பு ஒழுங்கான அமைதியில் இயங்குகிறது
      '21':
        title: கடவுள்முன் தகுதியுடன் வாழுங்கள்
      '22':
        title: ஆண்டவருக்கு அஞ்சும்படி கிறிஸ்து அழைக்கிறார்
      '23':
        title: உண்மையான உள்ளத்திற்குத் தந்தை அக்கறை காட்டுகிறார்
      '24':
        title: வருங்கால உயிர்த்தெழுதலைக் கடவுள் உறுதிப்படுத்துகிறார்
      '25':
        title: பீனிக்ஸ் பறவை இறந்து மீண்டும் எழுகிறது
      '26':
        title: உண்மையுள்ள ஊழியர்களைக் கடவுள் எழுப்புவார்
      '27':
        title: உண்மையுள்ள கடவுளோடு உள்ளங்களை உறுதியாக இணைப்போம்
      '28':
        title: கடவுளுக்கு அஞ்சுங்கள்; எங்கும் ஒளிய முடியாது
      '29':
        title: தூய கைகளுடன் அணுகிவாருங்கள்
      '30':
        title: பாவங்களை விட்டு விலகி தாழ்மையை ஏற்றுக்கொள்ளுங்கள்
      '31':
        title: ஆபிரகாம், ஈசாக்கு, யாக்கோபு விசுவாசத்தைப் பின்பற்றினர்
      '32':
        title: கடவுளின் சித்தம் நம்மை நீதிமான்களாக்குகிறது
      '33':
        title: நற்செயல்களைச் செய்ய விரையுங்கள்
      '34':
        title: ஆர்வமுள்ள உழைப்பாளர்கள் தங்கள் உணவை ஈட்டுகின்றனர்
      '35':
        title: விண்ணக வெகுமதிகளுக்காக நிலைத்திருங்கள்
      '36':
        title: நம் தலைமைக் குருவான இயேசு மீட்கிறார்
      '37':
        title: படைவீரர்கள் கட்டளைகளுக்கு உண்மையுடன் கீழ்ப்படிகின்றனர்
      '38':
        title: மேசியா இயேசுவில் சமூகம்
      '39':
        title: ஏளனம் செய்வோர் தங்களைத் தூய்மையாக்க முடியாது
      '40':
        title: எஜமானின் விதிமுறைகளை நிறைவேற்றுங்கள்
      '41':
        title: ஒதுக்கப்பட்ட ஊழியத்தில் பணியாற்றுங்கள்
      '42':
        title: அப்போஸ்தலர்கள் தலைவர்களை முறையாக நியமித்தனர்
      '43':
        title: கடவுளின் வழிகாட்டுதலால் மோசே குருக்களைத் தேர்ந்தெடுத்தார்
      '44':
        title: அங்கீகரிக்கப்பட்ட மூப்பர்களை நீக்காதீர்கள்
      '45':
        title: கடவுளைக் கனப்படுத்தியதால் நீதிமான்கள் துன்பப்பட்டனர்
      '46':
        title: பரிசுத்த முன்மாதிரிகளை ஒன்றாகப் பற்றிக்கொள்ளுங்கள்
      '47':
        title: உங்களுக்கு எழுதப்பட்ட பவுலின் கடிதத்தை நினைவுகூருங்கள்
      '48':
        title: தூய்மையுடன் நீதியின் வாயிலில் நுழையுங்கள்
      '49':
        title: அன்பு நம்மை தேவனோடு இணைக்கிறது
      '50':
        title: அன்பு தேவனால் தேர்ந்தெடுக்கப்பட்டவர்களை நிறைவாக்குகிறது
      '51':
        title: நம் பாவங்களையும் தவறுகளையும் அறிக்கையிடுவோம்
      '52':
        title: தேவனுக்குத் துதியின் பலியைச் செலுத்துங்கள்
      '53':
        title: மோசே இஸ்ரவேலுக்காகத் துணிவுடன் பரிந்துபேசினார்
      '54':
        title: சமாதானத்தை நாடும் தலைவர்கள் மந்தையை மதிக்கிறார்கள்
      '55':
        title: பெண்கள் துணிச்சலான செயல்களைச் செய்தார்கள்
      '56':
        title: வழிதவறியவர்கள் கீழ்ப்படியும்படி வேண்டுங்கள்
      '57':
        title: தாழ்மையே ஞானம் என்று ஞானம் அறிவிக்கிறது
      '58':
        title: தேவனை நம்பி என்றென்றும் பாதுகாப்பாயிருங்கள்
      '59':
        title: தேர்ந்தெடுக்கப்பட்டவர்களை தேவன் காக்கும்படி வேண்டுங்கள்
      '60':
        title: பாவங்களை மன்னித்து, அடிகளை வழிநடத்தும்
      '61':
        title: தேவன் ஆட்சியாளர்களை ஞானத்தால் வழிநடத்துகிறார்
      '62':
        title: நற்பண்புடன் வாழ விசுவாசம் கற்பிக்கிறது
      '63':
        title: தாழ்மை சமாதானத்தையும் மகிழ்ச்சியையும் தருகிறது
      '64':
        title: அனைவருக்கும் விசுவாசத்தையும் விடாமுயற்சியையும் அருளும்
      '65':
        title: பிரதிநிதிகள் நற்செய்தியுடன் திரும்பட்டும்
  1 Enoch:
    display_name: 1 ஏனோக்கு
    author: ஆசிரியர் பெயர் அறியப்படவில்லை; பெருவெள்ளத்திற்கு முந்தைய முற்பிதாவான ஏனோக்கின் பெயரில் புனைபெயருடன் எழுதப்பட்டதாகக் கருதப்படுகிறது. பல தனித்தனி பகுதிகளை ஒன்றுசேர்த்து உருவாக்கப்பட்ட தொகுப்பு நூல்.
    audience: அண்டமெங்கும் பரவியுள்ள தீமை, நியாயத்தீர்ப்பு, நாட்காட்டி ஆகியவற்றைப் பற்றிச் சிந்தித்த யூத வெளிப்பாட்டு இலக்கியச் சமூகங்களைப் பிரதிபலிக்கிறது; பின்னர் தொடக்ககாலக் கிறிஸ்தவ வட்டாரங்களிலும் வாசிக்கப்பட்டது.
    date: இதன் பகுதிகள் ஏறத்தாழ கி.மு. 3ஆம் நூற்றாண்டிலிருந்து கி.பி. 1ஆம் நூற்றாண்டுவரை தொகுக்கப்பட்டன; முழு நூலும் கீயெஸ் (எத்தியோப்பிய) மொழியில் மட்டுமே பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: தேவன் நீதிமான்களுக்கும் தீயவர்களுக்கும் தீர்ப்பளிக்கிறார்
      '2':
        title: வானமும் பூமியும் சாட்சி கூறுகின்றன
      '3':
        title: பதினான்கு மரங்கள் குளிர்காலத்திலும் நிலைத்திருக்கின்றன
      '4':
        title: கோடைக்காலச் சூரியன் ஒழுங்கமைந்த வல்லமையைக் காட்டுகிறது
      '5':
        title: படைப்பு தேவனுடைய ஆட்சிக்கு உண்மையாயிருக்கிறது
      '6':
        title: மனிதப் பெண்களுக்காகக் காவலர்கள் இறங்கி வருகிறார்கள்
      '7':
        title: மாபெரும் சந்ததியினர் பூமியைப் பாழாக்குகிறார்கள்
      '8':
        title: காவலர்கள் தடைசெய்யப்பட்ட அறிவைக் கற்பிக்கிறார்கள்
      '9':
        title: பூமியின் சட்டமீறலைத் தூதர்கள் தெரிவிக்கிறார்கள்
      '10':
        title: வீழ்ந்த காவலர்களுக்கு நியாயத்தீர்ப்பு வருகிறது
      '11':
        title: தேவன் நிறைவான ஆசீர்வாதங்களை வாக்களிக்கிறார்
      '12':
        title: வீழ்ந்த காவலர்களை ஏனோக்கு எதிர்கொள்கிறார்
      '13':
        title: காவலர்களுக்கு இரக்கம் கிடையாது என்று ஏனோக்கு கூறுகிறார்
      '14':
        title: வெளிப்படுத்தப்பட்ட பரலோக மகிமையை ஏனோக்கு காண்கிறார்
      '15':
        title: காவலர்களுக்கான தீர்ப்பை தேவன் விளக்குகிறார்
      '16':
        title: உடலற்ற ஆவிகள் பூமியில் அலைகின்றன
      '17':
        title: திகிலூட்டும் மறுவுலகப் பகுதிகளில் ஏனோக்கு பயணிக்கிறார்
      '18':
        title: படைப்பின் ஆற்றல்கள் சேமிக்கப்பட்டுள்ள இடங்கள் காட்டப்படுகின்றன
      '19':
        title: தூதர்கள் இறுதி நியாயத்தீர்ப்பை எதிர்கொள்வார்கள்
      '20':
        title: பரிசுத்த காவல் தூதர்களும் அவர்களுடைய ஆளுகைப் பகுதிகளும்
      '21':
        title: ஏழு நட்சத்திரங்கள் பாதாளத்தில் சங்கிலிகளால் கட்டப்பட்டுள்ளன
      '22':
        title: ஆத்துமாக்களின் குகைகளை ஏனோக்கு காண்கிறார்
      '23':
        title: தணியாத நெருப்பை ஏனோக்கு காண்கிறார்
      '24':
        title: ஒளிவீசும் ஏழு மகத்தான மலைகள்
      '25':
        title: நியாயத்தீர்ப்புவரை தடைசெய்யப்பட்ட நறுமண மரம்
      '26':
        title: புனித மையத்தை ஏனோக்கு காண்கிறார்
      '27':
        title: தேவதூஷணம் செய்பவர்களுக்கான சபிக்கப்பட்ட பள்ளத்தாக்கு வெளிப்படுத்தப்படுகிறது
      '28':
        title: பொங்கிவரும் நீரூற்றுகளைக் கொண்ட கிழக்கு மலைகள்
      '29':
        title: நியாயத்தீர்ப்பின் மரங்களை ஏனோக்கு காண்கிறார்
      '30':
        title: வற்றாத நீரால் நிறைந்த பள்ளத்தாக்கு
      '31':
        title: மலைகளில் புனித நறுமணங்கள் மலர்கின்றன
      '32':
        title: நீதியின் தோட்டம் வெளிப்படுத்தப்படுகிறது
      '33':
        title: வானத்தின் வாயில்களில் நட்சத்திரங்களுக்குப் பெயரிடப்படுகிறது
      '34':
        title: வானத்தின் வானிலை இயக்கம் வெளிப்படுத்தப்படுகிறது
      '35':
        title: மேற்கு வாயில்கள் கிழக்கு வாயில்களுக்கு ஒத்திருக்கின்றன
      '36':
        title: வானத்தின் வாயில்களை ஏனோக்கு காண்கிறார்
      '37':
        title: ஞானத்தின் வெளிப்பாட்டை ஏனோக்கு அறிவிக்கிறார்
      '38':
        title: நீதிமான்கள் கூடுகிறார்கள்; பாவிகள் தீர்ப்பிடப்படுகிறார்கள்
      '39':
        title: தேர்ந்தெடுக்கப்பட்ட பிள்ளைகள் வானத்திலிருந்து இறங்கி வருகிறார்கள்
      '40':
        title: பரலோகப் படையை ஏனோக்கு காண்கிறார்
      '41':
        title: வானத்தின் கருவூலங்களும் மறைந்த சட்டங்களும்
      '42':
        title: ஞானம் வீணாகத் தனக்கொரு இல்லத்தைத் தேடுகிறது
      '43':
        title: வானத்திற்குரிய உவமையை ஏனோக்கு காண்கிறார்
      '44':
        title: மின்னல் போன்ற நட்சத்திரங்கள் வல்லமையால் கட்டுப்படுத்தப்படுகின்றன
      '45':
        title: மறுப்பவர்களின் தீர்ப்பைப் பற்றிய இரண்டாம் உவமை
      '46':
        title: மனிதகுமாரனை ஏனோக்கு காண்கிறார்
      '47':
        title: நீதிமான்களின் இரத்தத்திற்கு வானத்தில் பதில் கிடைக்கிறது
      '48':
        title: நீதியின் ஊற்று சூழ்ந்திருக்கிறது
      '49':
        title: தேர்ந்தெடுக்கப்பட்டவர் மறைந்திருப்பவற்றைத் தீர்ப்பிடுகிறார்
      '50':
        title: பரிசுத்தர்கள் வெல்வார்கள்; பாவிகள் விரைவில் அழிவார்கள்
      '51':
        title: தேர்ந்தெடுக்கப்பட்டவர் மறைந்த ஞானத்தை வெளிப்படுத்துகிறார்
      '52':
        title: உலோக மலைகளை ஏனோக்கு காண்கிறார்
      '53':
        title: பாவிகளின் காணிக்கைகளால் நிறைந்த பள்ளத்தாக்கு
      '54':
        title: அரசர்கள் எரியும் பள்ளத்தாக்கில் எறியப்படுகிறார்கள்
      '55':
        title: பழமையானவர் இனி ஒருபோதும் அப்படிச் செய்வதில்லை என்று ஆணையிடுகிறார்
      '56':
        title: தண்டனை வழங்கும் தூதர்கள் அசாசேலின் படையைக் கட்டுகிறார்கள்
      '57':
        title: அண்டத்தின் கொந்தளிப்பும் பரிசுத்த வழிபாடும்
      '58':
        title: நீதிமான்களை ஏனோக்கு வாழ்த்துகிறார்
      '59':
        title: இடியின் இரகசியங்களை ஏனோக்கு காண்கிறார்
      '60':
        title: மிக உயர்ந்த வானம் அதிர்கிறது; இரக்கம் நிலைத்திருக்கிறது
      '61':
        title: நீதிமான்களுக்காகத் தூதர்கள் அளவிடுகிறார்கள்
      '62':
        title: அரியணையில் அமர்ந்த மனிதகுமாரன் தீர்ப்பளிக்கிறார்
      '63':
        title: அரசர்கள் ஆண்டவரிடம் மன்னிப்புக் கோருகிறார்கள்
      '64':
        title: மறைந்திருக்கும் பாவிகளை ஏனோக்கு காண்கிறார்
      '65':
        title: பூமிக்காக நோவா அழுகிறார்
      '66':
        title: கட்டளையின்படி தூதர்கள் பெருவெள்ள நீரைத் தடுத்து நிறுத்துகிறார்கள்
      '67':
        title: தேவனுடைய வாக்குறுதியை நோவா கேட்கிறார்
      '68':
        title: மறைந்திருந்தவை ஏனோக்குக்கு வெளிப்படுத்தப்படுகின்றன
      '69':
        title: வீழ்ந்த தூதர்களின் பெயர்கள் கூறப்பட்டு, அவர்களுக்குத் தீர்ப்பளிக்கப்படுகிறது
      '70':
        title: ஏனோக்கு பரலோக அரசவைக்கு எடுத்துக்கொள்ளப்படுகிறார்
      '71':
        title: பரலோக இரகசியங்களை ஏனோக்கு காண்கிறார்
      '72':
        title: சூரியனின் ஒழுங்கமைந்த பாதையை ஊரியேல் வெளிப்படுத்துகிறார்
      '73':
        title: சந்திரனின் பிறைகள் கட்டளையால் ஆளப்படுகின்றன
      '74':
        title: சூரியன் மற்றும் சந்திரனின் துல்லியமான சுழற்சிகள்
      '75':
        title: அண்டத்தின் தலைவர்கள் தங்கள் நிலையான பணியை நிறைவேற்றுகிறார்கள்
      '76':
        title: பூமிக்குரிய காற்றுகளை ஏனோக்கு காண்கிறார்
      '77':
        title: நான்கு காற்றுகளை ஏனோக்கு காண்கிறார்
      '78':
        title: பெரும் ஒளிச்சுடர்களின் பெயர்கள் வெளிப்படுத்தப்படுகின்றன
      '79':
        title: வானத்தின் எல்லா நியமங்களையும் ஏனோக்கு வெளிப்படுத்துகிறார்
      '80':
        title: அண்டக் குழப்பம் குறித்து ஊரியேல் எச்சரிக்கிறார்
      '81':
        title: ஏனோக்கு விண்ணுலகப் பலகைகளை வாசிக்கிறார்
      '82':
        title: பாதுகாத்து வைக்குமாறு மெத்தூசலாவுக்கு ஏனோக்கு கட்டளையிடுகிறார்
      '83':
        title: பூமி அழிக்கப்படுவதை ஏனோக்கு காண்கிறார்
      '84':
        title: பரிசுத்தமான இறைவனை ஏனோக்கு வாழ்த்துகிறார்
      '85':
        title: தம் குடும்பத்தின் கதியை ஏனோக்கு கனவில் காண்கிறார்
      '86':
        title: விண்மீன்கள் விழுந்து கால்நடைகளிடையே மேய்கின்றன
      '87':
        title: விண்ணுலக உயிர்கள் ஏழு பேர் கோபுரத்தைக் காட்டுகின்றனர்
      '88':
        title: விழுந்த விண்மீனை வானதூதர் பிடிக்கிறார்
      '89':
        title: விலங்குகளால் குறிக்கப்படும் அடையாளங்களை ஏனோக்கு காண்கிறார்
      '90':
        title: மேய்ப்பர்கள் மந்தையைத் தவறாக ஆளுகின்றனர்; செம்மறியாட்டு மந்தை மீண்டும் கட்டியெழுப்பப்படுகிறது
      '91':
        title: வரவிருக்கும் தண்டனைகளை ஏனோக்கு வெளிப்படுத்துகிறார்
      '92':
        title: நீதியுள்ள தலைமுறைகளுக்காக ஏனோக்கு எழுதுகிறார்
      '93':
        title: வாரங்கள் வரலாற்றையும் நியாயத்தீர்ப்பையும் சுருக்கமாகக் காட்டுகின்றன
      '94':
        title: தீய வழிகளை விடுத்து நீதியைத் தேர்ந்தெடுங்கள்
      '95':
        title: வரவிருக்கும் கண்டனத்தை நினைத்து ஏனோக்கு அழுகிறார்
      '96':
        title: பாவிகளுக்கு மேலாக நீதிமான்கள் உயரப் பறப்பார்கள்
      '97':
        title: நீதிமான்கள் மகிழ்கிறார்கள்; பாவிகள் வீழ்கிறார்கள்
      '98':
        title: ஆடம்பரம் அவமானத்தையும் அழிவையும் கொண்டுவருகிறது
      '99':
        title: தீமை செய்பவர்களுக்கு ஐயோ என்று அறிவிக்கப்படுகிறது
      '100':
        title: வானதூதர்கள் பொல்லாதவர்களைத் தீர்ப்பிட்டு நீதிமான்களைக் காக்கின்றனர்
      '101':
        title: இறைவனுக்கு அஞ்சி, தீமை செய்வதை நிறுத்துங்கள்
      '102':
        title: நியாயத்தீர்ப்பு நாளில் நீதிமான்கள் மகிழ்கிறார்கள்
      '103':
        title: நித்திய நிரபராதித்தன்மை நிலைநாட்டப்படுவதை ஏனோக்கு அறிவிக்கிறார்
      '104':
        title: பாவத்தைக் குறித்து ஏனோக்கு எச்சரிக்கிறார்
      '105':
        title: பெயர்கள் மகிமைக்கு முன் வைக்கப்படுகின்றன
      '106':
        title: எதிர்கால நம்பிக்கையின் அடையாளமாக நோவாவுக்குப் பெயரிடப்படுகிறது
      '107':
        title: இறுதித் தலைமுறை மீட்பைக் கொண்டுவருகிறது
      '108':
        title: ஏனோக்கு இறுதி எச்சரிக்கையை எழுதுகிறார்
  2 Baruch:
    display_name: 2 பாரூக்கு
    author: ஆசிரியர் அறியப்படாதவர்; எரேமியாவின் எழுத்தராகிய பாரூக்கின் பெயரில் எழுதப்பட்டதாகக் கருதப்படுகிறது.
    audience: கி.பி. 70-இல் ஆலயம் அழிக்கப்பட்ட பின்னர், நாடுகடத்தலை இறையியல் நோக்கில் புரிந்துகொள்ள முயன்ற யூதர்கள்.
    date: ஏறத்தாழ கி.பி. 1ஆம் நூற்றாண்டின் பிற்பகுதி முதல் 2ஆம் நூற்றாண்டின் முற்பகுதி வரை; முதன்மையாக சிரியாக் மொழியில் பாதுகாக்கப்பட்டுள்ளது.
    chapters:
      '1':
        title: யூதாவைக் குறித்து பாரூக்குக்கு இறைவன் எச்சரிக்கிறார்
      '2':
        title: புறப்பட்டுச் செல்லுமாறு பாரூக்குக்கு ஆண்டவர் கட்டளையிடுகிறார்
      '3':
        title: எருசலேமின் கதியைக் குறித்து பாரூக்கு மன்றாடுகிறார்
      '4':
        title: மறைந்திருக்கும் நகரத்தின் உண்மை நிலையை ஆண்டவர் வெளிப்படுத்துகிறார்
      '5':
        title: எரேமியாவின் குழுவினரோடு பாரூக்கு அழுகிறார்
      '6':
        title: சீயோனைக் காக்கும் வானதூதர்களைப் பாரூக்கு காண்கிறார்
      '7':
        title: சீயோனை வீழ்த்துமாறு வானதூதர்களுக்கு ஆணையிடப்படுகிறது
      '8':
        title: விண்ணுலக உருவம் புனிதப் பொருட்களை அகற்றுகிறது
      '9':
        title: எரேமியாவும் பாரூக்கும் ஒன்றாகத் துயரப்படுகின்றனர்
      '10':
        title: சீயோனின் பாழ்நிலைக்காக பாரூக்கு ஆழ்ந்து புலம்புகிறார்
      '11':
        title: பாபிலோனின் செழிப்பைக் குறித்து பாரூக்கு புலம்புகிறார்
      '12':
        title: வரவிருக்கும் கோபத்தைக் குறித்து பாரூக்கு எச்சரிக்கிறார்
      '13':
        title: எதிர்காலத்தில் சாட்சியமளிப்பதைப் பாரூக்குக்கு இறைவன் காட்டுகிறார்
      '14':
        title: நீதிமானாக இருப்பதன் பயன் என்னவென்று பாரூக்கு கேட்கிறார்
      '15':
        title: பாவிகளின் பொறுப்புணர்வை ஆண்டவர் விளக்குகிறார்
      '16':
        title: வருங்கால மகிமையால் பாரூக்கு ஊக்கமடைகிறார்
      '17':
        title: வாழ்நாளின் பொருளைப் பாரூக்கு அறிகிறார்
      '18':
        title: இறை ஒளியைப் பாரூக்கு விளக்குகிறார்
      '19':
        title: ஒவ்வொருவரையும் இறைவன் தீர்ப்பிடுகிறார்
      '20':
        title: விரைவில் வரவிருக்கும் நியாயத்தீர்ப்பை இறைவன் வாக்களிக்கிறார்
      '21':
        title: கீதரோன் அருகே பாரூக்கு மன்றாடுகிறார்
      '22':
        title: மேலிருந்து வரும் குரலுக்குப் பாரூக்கு செவிகொடுக்கிறார்
      '23':
        title: காத்திருக்கும் எல்லாத் தலைமுறைகளையும் இறைவன் நினைவுகூர்கிறார்
      '24':
        title: வருங்கால நியாயத்தீர்ப்பைப் பாரூக்கு காண்கிறார்
      '25':
        title: முடிவுவரை பாரூக்கு காக்கப்படுகிறார்
      '26':
        title: உபத்திரவத்தின் கால அளவைப் பாரூக்கு கேட்கிறார்
      '27':
        title: வரவிருக்கும் காலத்தின் நிகழ்வுகளைப் பாரூக்கு விவரிக்கிறார்
      '28':
        title: அழிவில்லாத நிலையைப் பற்றிப் பாரூக்கு கேட்கிறார்
      '29':
        title: பூமி நிறைவான வளத்தால் நிரம்பி வழிகிறது
      '30':
        title: மேசியாவுடன் ஆத்துமாக்கள் எழுகின்றன
      '31':
        title: மூப்பர்களைச் சீயோனுக்கு பாரூக்கு கூட்டுகிறார்
      '32':
        title: இறைவனின் திருச்சட்டத்தைக் கடைப்பிடித்து பாதுகாப்பாக இருங்கள்
      '33':
        title: தங்கியிருக்குமாறு மக்கள் பாரூக்கிடம் வேண்டுகின்றனர்
      '34':
        title: பாரூக்கு அழுதபடியே மக்களுக்கு உறுதியளிக்கிறார்
      '35':
        title: சீயோனின் துயரத்திற்காக பாரூக்கு அழுகிறார்
      '36':
        title: கேதுரு மரத்தைத் திராட்சைக்கொடி குற்றஞ்சாட்டுகிறது
      '37':
        title: வீழ்ந்த கேதுரு மரத்தைத் திராட்சைக்கொடி குற்றஞ்சாட்டுகிறது
      '38':
        title: தரிசனத்தின் விளக்கத்திற்காக பாரூக்கு மன்றாடுகிறார்
      '39':
        title: அரசுகளைப் குறித்து பாரூக்கு முன்னறிவிக்கிறார்
      '40':
        title: எஞ்சிய மக்களை மேசியா பாதுகாப்பார்
      '41':
        title: எதிர்கால நிகழ்வுகளைப் பற்றி பாரூக்கு கேட்கிறார்
      '42':
        title: கடந்த காலத்தைவிட நம்பிக்கையே முக்கியமானது
      '43':
        title: நித்திய ஆறுதலுக்குப் பாரூக்கு செவிகொடுக்கிறார்
      '44':
        title: தம் மகன் ஞானத்தைப் பாரூக்கு அழைக்கிறார்
      '45':
        title: நிலைநின்று, அஞ்சி, சீயோனைத் தேடுங்கள்
      '46':
        title: மூப்பர்களுக்கு நம்பிக்கையூட்டிப் பாரூக்கு உறுதியளிக்கிறார்
      '47':
        title: பாரூக்கு ஏழு நாட்கள் நோன்பிருக்கிறார்
      '48':
        title: எஞ்சியோருக்காக பாரூக்கு மன்றாடுகிறார்
      '49':
        title: வருங்கால வாழ்வைப் பற்றி பாரூக்கு கேட்கிறார்
      '50':
        title: இறந்தவர்கள் அடையாளம் காணத்தக்கவர்களாக உயிர்த்தெழுவார்கள்
      '51':
        title: பொல்லாதவர்கள் வாடுகின்றனர்; நீதிமான்கள் மகிமைப்படுத்தப்படுகின்றனர்
      '52':
        title: இறந்தவர்கள் திரும்பி வரும்போது உயிரோடிருப்பவர்கள் அவர்களை அடையாளம் காண்கின்றனர்
      '53':
        title: மேகத்தைப் பற்றிய தரிசனத்தைப் பாரூக்கு கனவில் காண்கிறார்
      '54':
        title: தரிசனத்தின் விளக்கத்திற்காக பாரூக்கு மன்றாடுகிறார்
      '55':
        title: எதிர்கால மறைபொருள்களைப் பாரூக்குக்கு இறைவன் காட்டுகிறார்
      '56':
        title: மேகம் உலகின் தொடக்கத்தைக் குறிக்கிறது
      '57':
        title: கருநீர் ஆதாமின் மீறுதலைக் குறிக்கிறது
      '58':
        title: பாவம் பூமியை மூடுவதை ஆதாம் காண்கிறார்
      '59':
        title: பாவம் நிறைந்த உலகத்தின் மேல் மேகம் எழுகிறது
      '60':
        title: எமோரியரின் பொல்லாங்கு இஸ்ரவேலைக் கறைப்படுத்துகிறது
      '61':
        title: தாவீது, சாலொமோன் காலம் செழிக்கிறது
      '62':
        title: யெரொபெயாமின் பாவம் அழிவைக் கொண்டுவருகிறது
      '63':
        title: எசேக்கியாவின் நீதி வெற்றி பெறுகிறது
      '64':
        title: மனாசேயின் பொல்லாங்கு தீட்டுப்படுத்துகிறது
      '65':
        title: ஆமோனின் தீமை இருளோடு ஆட்சி செய்கிறது
      '66':
        title: யோசியாவின் தூய்மை சீயோனை மீட்டெடுக்கிறது
      '67':
        title: தற்போதைய பேரழிவு வானதூதர்களைத் துயரப்படுத்துகிறது
      '68':
        title: வருங்கால இரட்சிப்பு மகிழ்ச்சியைக் கொண்டுவருகிறது
      '69':
        title: இறுதி நீர் உலகத்தைப் பற்றியது
      '70':
        title: உலகத்தின் காலம் நியாயத்தீர்ப்புக்கு முதிர்கிறது
      '71':
        title: பரிசுத்த மக்களுக்கு இரக்கம் காட்டப்படுகிறது
      '72':
        title: ஒளிமிகு நீர்கள் மெசியாவின் காலத்தைக் குறிக்கின்றன
      '73':
        title: அமைதியான யுகம் எல்லாப் பூசல்களையும் முடிவுக்குக் கொண்டுவருகிறது
      '74':
        title: கட்டுகிறவர்கள் அமைதியில் அறுவடை செய்கிறார்கள்
      '75':
        title: பாரூக்கு கடவுளின் இரக்கத்தைப் போற்றுகிறார்
      '76':
        title: மக்கள் பாரூக்கின் அறிவுரையை நாடுகிறார்கள்
      '77':
        title: பாரூக்கு மக்களுக்குத் திருச்சட்டத்தை நினைவூட்டுகிறார்
      '78':
        title: நாடுகடத்தப்பட்டோருக்கு பாரூக்கு நம்பிக்கைச் செய்தி எழுதுகிறார்
      '79':
        title: படைப்பாளரின் அன்பு மாறாமல் நிலைக்கிறது
      '80':
        title: நெபுகத்நேச்சரின் தாக்குதல் நியமிக்கப்பட்டது
      '81':
        title: துன்புறுவோருக்குக் கடவுளின் இரக்கம் அருகில் உள்ளது
      '82':
        title: தீய நாடுகள் தீர்ப்பை எதிர்கொள்கின்றன
      '83':
        title: மோசேயும் எரேமியாவும் தீர்ப்புகளைக் குறித்து எச்சரித்தனர்
      '84':
        title: திருச்சட்டத்தை நினைவுகூருமாறு பாரூக்கு வலியுறுத்துகிறார்
      '85':
        title: முடிவு அருகில் உள்ளது; கட்டளைகளை ஏற்றுக்கொள்ளுங்கள்
      '86':
        title: கூடுகைகளில் கடிதத்தை உரக்க வாசியுங்கள்
      '87':
        title: கற்பிக்கப்பட்ட கட்டளைகளை உறுதியாகப் பற்றிக்கொள்ளுங்கள்
  2 Esdras:
    display_name: 2 எஸ்திரா
    author: ஆசிரியர் பெயர் தெரியவில்லை; முதலில் யூத நூலாக இருந்த மையப் பகுதியைச் (4 எஸ்றா, அதிகாரங்கள் 3–14) சுற்றி கிறிஸ்தவர்களால் தொகுக்கப்பட்ட சட்டகம் உள்ளது.
    audience: கி.பி. 70-க்குப் பிறகு, தீமை ஏன் உள்ளது என்ற இறைநீதிக் கேள்வியோடு போராடிய யூதர்களுக்காக; பின்னர் கிறிஸ்தவ வாசகர்களுக்காக விரிவாக்கப்பட்டது.
    date: யூத மையப் பகுதி ஏறத்தாழ கி.பி. 100; கிறிஸ்தவச் சேர்க்கைகள் ஏறத்தாழ கி.பி. 2–3ஆம் நூற்றாண்டுகள்.
    chapters:
      '1':
        title: இஸ்ரவேல் தம்மைப் புறக்கணித்ததற்காகக் கடவுள் வருந்துகிறார்
      '2':
        title: எஸ்றா வருங்கால மகிமையைக் காண்கிறார்
      '3':
        title: இஸ்ரவேலின் வரலாற்றை எடுத்துரைத்து எஸ்றா மன்றாடுகிறார்
      '4':
        title: எஸ்றாவின் வரம்புகளை ஊரியேல் கற்பிக்கிறார்
      '5':
        title: வரவிருக்கும் பேரச்சத்தின் நடுவே எஸ்றா மன்றாடுகிறார்
      '6':
        title: படைப்பின் நாட்களை எடுத்துரைத்து எஸ்றா மன்றாடுகிறார்
      '7':
        title: எஸ்றா இறுதித் தீர்ப்பைக் காண்கிறார்
      '8':
        title: புரிந்துகொள்ள எஸ்றா மன்றாடுகிறார்
      '9':
        title: சீயோனின் வருங்கால மகிமையை எஸ்றா காண்கிறார்
      '10':
        title: சீயோனின் மகிமையை எஸ்றா காண்கிறார்
      '11':
        title: கழுகைப் பற்றிய கனவுகள் முடிவை முன்னறிவிக்கின்றன
      '12':
        title: சிங்கத்தையும் கழுகுகளையும் எஸ்றா கனவில் காண்கிறார்
      '13':
        title: கடலிலிருந்து வரும் மனிதர் படைப்பை விடுவிக்கிறார்
      '14':
        title: நம்பிக்கைக்குரிய வார்த்தைகளைப் பேச ஆண்டவர் கட்டளையிடுகிறார்
      '15':
        title: வரவிருக்கும் தீர்ப்பைக் குறித்து இறைவாக்கினர் எச்சரிக்கிறார்
      '16':
        title: கடவுளின் தீர்ப்புகள் நிலத்தையும் கடலையும் அதிரச்செய்கின்றன
  Didache:
    display_name: திதாக்கே
    author: ஆசிரியர் பெயர் தெரியவில்லை (இத்தலைப்பு, "பன்னிரு அப்போஸ்தலர்களின் போதனை" என்று பொருள்படும்).
    audience: ஆரம்பகால கிறிஸ்தவச் சபைக் கூடுகைகளுக்காக—அறநெறி, திருமுழுக்கு, நற்கருணை விருந்து, பயணம் செய்யும் போதகர்கள் ஆகியவை பற்றிய சுருக்கமான கையேடு.
    date: ஏறத்தாழ கி.பி. 1ஆம் நூற்றாண்டின் பிற்பகுதி முதல் 2ஆம் நூற்றாண்டின் முற்பகுதி வரை.
    chapters:
      '1':
        title: கடவுளை நேசித்து வாழ்வின் வழியைத் தேர்ந்தெடுங்கள்
      '2':
        title: தீமையைத் தவிர்த்து கட்டளைகளைப் பின்பற்றுங்கள்
      '3':
        title: எல்லா வகையான தீமையிலிருந்தும் விலகி ஓடுங்கள்
      '4':
        title: கடவுளின் வார்த்தையை எப்போதும் மதியுங்கள்
      '5':
        title: மரணத்தின் வழி பாவத்துக்கு இட்டுச் செல்கிறது
      '6':
        title: எதையும் சேர்க்காமல் போதனையைப் பின்பற்றுங்கள்
      '7':
        title: ஓடும் நீரில் உண்மையுடன் திருமுழுக்குக் கொடுங்கள்
      '8':
        title: நீதியுள்ள தந்தையிடம் மன்றாடுங்கள்
      '9':
        title: கிண்ணத்திற்காகவும் அப்பத்திற்காகவும் நன்றி செலுத்துங்கள்
      '10':
        title: தூய தந்தைக்கு நன்றி செலுத்தப்படுகிறது
      '11':
        title: உண்மையான போதகர்களையும் இறைவாக்கினர்களையும் வரவேற்றிடுங்கள்
      '12':
        title: பயணிகளுக்கு உதவுங்கள்; ஆனால் அவர்களைச் சோதித்தறியுங்கள்
      '13':
        title: உண்மையான இறைவாக்கினர்களையும் போதகர்களையும் ஆதரியுங்கள்
      '14':
        title: அப்பத்தைப் பகிர்வதற்கு முன் பாவங்களை அறிக்கையிடுங்கள்
      '15':
        title: தகுதியான கண்காணிகளையும் திருத்தொண்டர்களையும் நியமியுங்கள்
      '16':
        title: விழிப்புடன் இருங்கள்; விசுவாசம் சோதனைகளில் நிலைத்திருக்கட்டும்
  Gospel of Thomas:
    display_name: தோமாவின் நற்செய்தி
    author: ஆசிரியர் பெயர் தெரியவில்லை; தொடக்கவுரை இந்த மொழிகளின் தொகுப்பை "திதிமோஸ் யூதா தோமா" என்பவருக்குரியதாகக் குறிப்பிடுகிறது. நாக் ஹம்மாதியில் கிடைத்த 4ஆம் நூற்றாண்டைச் சேர்ந்த காப்டிக் மொழிபெயர்ப்பில் (NHC II,2) மட்டுமே முழுமையாகப் பாதுகாக்கப்பட்டுள்ளது; ஆக்ஸிரின்கஸிலிருந்து மூன்று கிரேக்கத் துண்டுகளும் கிடைத்துள்ளன.
    audience: சிரிய ஞான மரபாலும் தொடக்ககால ஞானவாதச் சிந்தனையாலும் வடிவமைக்கப்பட்டு, இயேசுவின் மொழிகளில் மறைபொருளான சுயஅறிவை நோக்கிய கிறிஸ்தவ வாசகர்களுக்காக.
    date: கிரேக்க மூலநூல் ஏறத்தாழ கி.பி. 50–140; காப்டிக் கையெழுத்துப் பிரதி ஏறத்தாழ கி.பி. 340.
    summary: தோமாவின் நற்செய்தி, இயேசுவுக்குரியதாகக் கூறப்படும் மொழிகளின் தொகுப்பு. இதில் தொடர்ச்சியான கதை இல்லை; அந்த மொழிகளின் பொருளைக் கண்டறியுமாறு வாசகர்களை மீண்டும் மீண்டும் அழைக்கிறது.
    chapters:
      '0':
        title: இயேசுவின் மறைவான மொழிகளைத் தோமா எழுதுகிறார்
      '1':
        title: இயேசு மறைவான ஞானத்தைக் கற்பிக்கிறார்
      '2':
