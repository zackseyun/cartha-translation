      '38':
        title: ஆழ்ந்த துன்பத்தில் மௌனமான மன்றாட்டு
      '39':
        title: நம்பிக்கையுடன் தாவீது கதறுகிறார்
      '40':
        title: அழிவிலிருந்து தாவீதைக் கடவுள் தூக்கிவிடுகிறார்
      '41':
