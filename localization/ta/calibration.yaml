book_localizations:
- source_title: Genesis
  title: ஆதியாகமம்
  author: ஆசிரியர் பெயர் தெரியவில்லை; மரபுப்படி இது மோசே எழுதியதாகக் கருதப்படுகிறது. நவீன ஆய்வாளர்கள், பல்வேறு ஆதாரங்கள் பின்னர் ஒன்றாகத் தொகுக்கப்பட்ட நீண்ட உருவாக்க வரலாறு இதற்கு இருப்பதாகக் கருதுகின்றனர்.
  audience: உடன்படிக்கை அடையாளம் கொண்ட இஸ்ரவேலருக்காக; கடவுளின் படைப்பு, தெரிந்தெடுத்தல், வாக்குறுதி ஆகியவற்றில் மக்களின் தோற்றக் கதையை வேரூன்றச் செய்வதற்காக.
  date: பல நூற்றாண்டுகளாக உருவாக்கப்பட்டது; பாபிலோனியச் சிறையிருப்பின்போது அல்லது அதற்குப் பிறகு, ஏறத்தாழ கி.மு. 6–5ஆம் நூற்றாண்டுகளில் இன்று அறியப்படும் வடிவத்தை அடைந்தது.
  summary: படைப்பு, மனிதகுலத்தின் கலகமும் சிதறலும், இஸ்ரவேலுக்கான கடவுளின் உடன்படிக்கை வாக்குறுதிகள் தொடங்கும் வழியாகிய ஆபிரகாம், ஈசாக்கு, யாக்கோபு, யோசேப்பு ஆகியோரின் குடும்பம் ஆகியவற்றை ஆதியாகமம் விவரிக்கிறது.
- source_title: John
  title: யோவான் நற்செய்தி
  author: ஆசிரியர் பெயர் தெரியவில்லை; மரபு இதை அப்போஸ்தலர் யோவானுக்கோ, “அன்புச் சீடருக்கோ” உரியதாகக் கருதுகிறது.
  audience: அன்புச் சீடரின் சாட்சியை மையமாகக் கொண்டு உருவானதும், யூத ஜெபக்கூட யூதத்துடனான பதற்றத்தில் இருந்ததுமான ஒரு கிறிஸ்தவச் சமூகம்.
  date: ஏறத்தாழ கி.பி. 90–110.
  summary: தந்தையை வெளிப்படுத்துகிறவரும், தம்மீது நம்பிக்கை வைப்போருக்கு வாழ்வு அளிக்கிறவரும், தமது அடையாளச் செயல்கள், மரணம், உயிர்த்தெழுதல் ஆகியவற்றின் வழியாக மகிமைப்படுத்தப்படுகிறவருமான நித்திய வார்த்தையாக இயேசுவை யோவான் நற்செய்தி முன்வைக்கிறது.
- source_title: Gospel of Thomas
  title: தோமா நற்செய்தி
  author: ஆசிரியர் பெயர் தெரியவில்லை; தொடக்கக் குறிப்பு, இந்தப் பொன்மொழித் தொகுப்பை “திதிமுஸ் யூதா தோமா” என்பவருக்கு உரியதாகக் கூறுகிறது. நாக் ஹம்மாதியில் கண்டெடுக்கப்பட்ட நான்காம் நூற்றாண்டைச் சேர்ந்த காப்டிக் மொழிபெயர்ப்பில் மட்டுமே இது முழுமையாகக் கிடைக்கிறது (NHC II,2); ஆக்சிரிங்கஸிலிருந்து மூன்று கிரேக்கத் துண்டுகளும் கிடைத்துள்ளன.
  audience: சிரிய ஞான மரபாலும் தொடக்ககால ஞானவாதச் சிந்தனையாலும் வடிவமைக்கப்பட்ட, இயேசுவின் பொன்மொழிகளில் உள்ள மறைபொருள் தன்னறிவை நோக்கிய கிறிஸ்தவ வாசகர்கள்.
  date: கிரேக்க மூலப்பிரதி ஏறத்தாழ கி.பி. 50–140 காலத்தைச் சேர்ந்ததாக இருக்கலாம்; காப்டிக் கையெழுத்துப் பிரதி ஏறத்தாழ கி.பி. 340ஐச் சேர்ந்தது.
  summary: தோமா நற்செய்தி, இயேசுவுக்குரியதாகக் கூறப்படும் பொன்மொழிகளின் தொகுப்பு. இதில் தொடர்ச்சியான கதை இல்லை; அந்தப் பொன்மொழிகளின் பொருளைக் கண்டறியுமாறு இது வாசகர்களைத் திரும்பத் திரும்ப அழைக்கிறது.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: ஆதியாகமம் 1:1
  text: வானத்தையும் பூமியையும் கடவுள் படைக்கத் தொடங்கியபோது[a]—
  translator_note: '[a] மரபுவழி மொழிபெயர்ப்பு இதை ஒரு முழுமையான வாக்கியமாகக் கொடுக்கிறது: “தொடக்கத்தில் கடவுள் வானத்தையும் பூமியையும் படைத்தார்.” ஆனால், எபிரெய மொழியமைப்பு இதற்குப் பின்வருவதை அறிமுகப்படுத்துவதாக எடுத்துக்கொள்வதே இயல்பானது; முதன்மைச் செயல் 3ஆம் வசனத்தில் வரும் “கடவுள் சொன்னார்” என்பதாகும்.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: பிரசங்கி 1:2
  text: “நீராவிகளின் நீராவி[a],” என்கிறார் கோஹெலேத்[b]. “எல்லாமே நீராவி—விரைவில் மறைவது, பிடித்து வைத்துக்கொள்ள முடியாதது, பெரும்பாலும் நாம் எதிர்பார்ப்பதுபோல் அமையாதது.”
  translator_note: '[a] எபிரெயச் சொல்லான ‘ஹெவெல்’ என்பதன் நேரடிப் பொருள் மூச்சு அல்லது நீராவி. பிரசங்கி நூல் முழுவதிலும், விரைவில் கடந்துபோவதையும், பிடித்து வைத்துக்கொள்ளவோ முழுமையாகப் புரிந்துகொள்ளவோ முடியாததையும், மக்கள் எதிர்பார்ப்பதற்கு மாறாக அடிக்கடி அமைவதையும் அது குறிக்கிறது. “நீராவி” என்ற சொல், எதற்குமே பொருள் இல்லை என்று கூறாமல் அந்த உருவகத்தைத் தக்கவைக்கிறது. [b] ‘கோஹெலேத்’ என்பது ஆசிரியரின் எபிரெயப் பெயர் அல்லது பட்டம். இது பெரும்பாலும் “போதகர்” அல்லது “பிரசங்கிப்பவர்” என்று மொழிபெயர்க்கப்படுகிறது; ஆனால் ஒரு விளக்கத்துக்கு மட்டும் முன்னுரிமை அளிக்காமல் சாத்தியமான எல்லாப் பொருள்களுக்கும் இடமளிக்க இங்கே ‘கோஹெலேத்’ என்றே வைக்கப்பட்டுள்ளது.'
- source_path: nt/john/001/001.yaml
  reference: யோவான் 1:1
  text: தொடக்கத்தில்[b], வார்த்தை ஏற்கெனவே இருந்தது. வார்த்தை கடவுளோடு இருந்தது; வார்த்தை கடவுளாக இருந்தது.[a]
  translator_note: '[a] “வார்த்தை தெய்வீகமானது” என்றும், “கடவுள் எப்படிப்பட்டவரோ, வார்த்தையும் அப்படிப்பட்டதே” என்றும் மொழிபெயர்க்கலாம். கிரேக்கச் சொற்றொடர், முந்தைய கூற்றில் வார்த்தையைக் கடவுளிடமிருந்து வேறுபடுத்தும் அதேவேளையில், வார்த்தை முழுமையாகக் கடவுள் என்பதையும் உறுதிப்படுத்துகிறது. [b] இந்தத் தொடக்கம் ஆதியாகமம் 1:1ஐ எதிரொலித்து, வார்த்தையைப் படைப்பின் தொடக்கத்தோடு இணைக்கிறது.'
- source_path: nt/romans/003/025.yaml
  reference: ரோமர் 3:25
  text: அவருடைய இரத்தத்தின் மூலம் நம்பிக்கையினால் பெறப்படும் பாவநிவாரணப் பலியாக[a] கடவுள் அவரை முன்வைத்தார். கடந்த காலத்தில் செய்யப்பட்ட பாவங்களைக் கடந்து விட்டிருந்ததால், தமது நீதியை[c] வெளிப்படுத்தவே இப்படிச் செய்தார்.
  translator_note: '[a] “கோபத்தைத் தணித்தல்” என்றும் மொழிபெயர்க்கலாம்; அல்லது பழைய ஏற்பாட்டில் பாவநிவாரண இரத்தம் தெளிக்கப்பட்ட உடன்படிக்கைப் பெட்டியின் தங்க மூடியான “கிருபாசனம்” என்றும் பொருள்கொள்ளலாம். [b] “நம்பிக்கையின் வழியாக, அவருடைய இரத்தத்தினால்” என்றும் மொழிபெயர்க்கலாம். [c] “நியாயம்” என்றும் மொழிபெயர்க்கலாம்.'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 பேதுரு 1:13
  text: ஆகையால், செயல்படுவதற்கு உங்கள் மனங்களை ஆயத்தப்படுத்துங்கள்.[a] முற்றிலும் தெளிந்த சிந்தையுடன் இருந்து, இயேசு மெசியா வெளிப்படும்போது உங்களிடம் கொண்டுவரப்படும் அருள்மீது உங்கள் நம்பிக்கையை முழுமையாக வையுங்கள்.[b]
  translator_note: '[a] கிரேக்கத்தில், “உங்கள் மனத்தின் இடுப்பைக் கட்டுங்கள்” என்று சொல்லர்த்தமாக உள்ளது. செயல்பட ஆயத்தமாக இருப்பதற்காக நீண்ட ஆடையை இடுப்பைச் சுற்றித் தூக்கிக் கட்டும் காட்சியை இது சித்தரிக்கிறது. [b] “முற்றிலும்,” “முழுமையாக” என்று மொழிபெயர்க்கப்பட்டுள்ள கிரேக்கச் சொல், தெளிந்த சிந்தையுடன் இருப்பதையோ, நம்பிக்கையை வைப்பதையோ, அல்லது இரண்டையுமோ குறிக்கக்கூடும்.'
reader_ui:
  translations: மொழிபெயர்ப்புகள்
  choose_language: மொழியைத் தேர்ந்தெடுக்கவும்
  search_languages: மொழிகளைத் தேடவும்
  available_now: இப்போது கிடைக்கிறது
  translation_in_progress: மொழிபெயர்ப்பு நடைபெறுகிறது
  select: தேர்ந்தெடுக்கவும்
review:
  verdict: revise
  summary: கருத்துக்கும் மூலத்திற்கும் ஒத்தவாறு திருத்தம் செய்யப்பட்டது. குறிப்பாக ரோமர் 3:25-இல் சொற்றொடர் அமைப்பு, யோவான் 1:1-இல் ‘வார்த்தை’ குறித்த மொழிநடை, பிரசங்கி 1:2-இன் உருவகம், மற்றும் மூலத்தில் இல்லாத/மாறுபட்ட விளக்கங்கள் சீரமைக்கப்பட்டன.
  issues:
  - ரோமர் 3:25-இல் ‘அவருடைய இரத்தத்தின்மீது வைக்கும் நம்பிக்கை’ என்பது மூலத்தின் ‘through faith in his blood’ என்பதின் இயல்பான பொருளைத் தெளிவுபடுத்தவில்லை; ‘passed over’ என்பதை ‘தண்டிக்காமல் விட்டார்’ என்று உறுதியாக்கியது கூடுதல் விளக்கமாக இருந்தது.
  - யோவான் 1:1-இல் ‘வார்த்தையானவர்’ மற்றும் ‘அவர் கடவுளாய் இருந்தார்’ என்பது மூலத்தின் மீளுரைப்பை மாற்றியது; மாற்று வாசிப்பில் ‘உயிருடன் இருந்தார்’ மூலத்தில் தரப்படவில்லை.
