  Sophia of Jesus Christ:
    display_name: Ukuhlakanipha KukaJesu Kristu
    author: Umbhali akaziwa. Umbhali uguqula ukwaziswa okutholakala naku-Eugnostos kube yingxoxo eyenzeka ngemva kokuvuka kukaJesu phakathi kwakhe nabafundi bakhe.
    audience: AmaKristu ayenesithakazelo ekuhlakanipheni okwembuliwe ngoNkulunkulu ophakeme ngaphezu kwakho konke, ukuhleleka komhlaba wasezulwini, nemvelaphi nokusindiswa komphefumulo.
    date: Kuvame ukuthiwa walotshwa ngasekupheleni kwekhulu lesi-2 noma ngekhulu lesi-3 AD; ulondolozwe emakhophini esiCoptic aseNag Hammadi naseBerlin Codex.
