    author: Umbhali akaziwa. Umbhali uchaza uGenesise esebenzisa inganekwane yesambulo ephathelene nababusi; lo mbhalo awunakuthiwa ngokuqiniseka walotshwa umfundisi othile ogagulwe ngegama.
