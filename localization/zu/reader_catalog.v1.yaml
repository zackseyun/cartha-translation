  Letter of Peter to Philip:
    display_name: Incwadi KaPetru Eya KuFiliphu
    author: Umbhali akaziwa. Incwadi emfushane eyisethulo nesambulo esiyilandelayo kuthiwa zalotshwa uPetru noFiliphu kusetshenziswa amagama abo, kunokuba kube nesiqinisekiso sokuthi omunye walaba baphostoli wazibhala.
    audience: AmaKristu ayefuna igunya labaphostoli lemfundiso ephathelene noMsindisi, imibuso enobutha, ukuhlupheka, umsebenzi wokushumayela, nokubuyiselwa kwabafundi.
    date: Ngokuvamile kuthiwa yalotshwa ngasekupheleni kwekhulu lesi-2 noma ekuqaleni kwekhulu lesi-3 AD; ilondolozwe ekhophini yaseNag Hammadi yekhulu lesi-4 nakomunye umbhalo wesiCoptic wakamuva.
