  Gospel of Judas:
    display_name: IVangeli LikaJuda
    author: Umbhali akaziwa. Isihloko sithi le ndaba ekaJuda, kodwa lo mbhalo awufakazeli ukuthi uJuda Iskariyothe wayengumbhali wawo wangempela emlandweni.
    audience: Iqembu lamaKristu elaligxeka imikhuba yezimbangi yokunikela imihlatshelo neyokuphatha ibandla, lisebenzisa ingxoxo yesambulo nemfundiso ngomkhathi yohlobo lwabalandeli bakaSeti ukuze lichaze kabusha uJuda nokufa kukaJesu.
    date: Ngokuvamile kuthiwa walotshwa maphakathi noma ngasekupheleni kwekhulu lesi-2 AD; u-Irenaeus wayelazi iVangeli LikaJuda cishe ngo-180, kanti ikhophini yesiCoptic esekhona cishe ingeyekhulu lesi-3 noma lesi-4.
