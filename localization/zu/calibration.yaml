review:
  verdict: revise
  summary: Kubuyekezwe amagama, ukwakheka kwemisho, nokunemba kokudlulisa izincazelo ezisemthonjeni. Izinguquko eziyinhloko ziqondisa isiZulu esingokwemvelo, zigwema ukwengeza incazelo ku-1 Petru 1:13, futhi zilungisa ukuhumusha okungacacile kokuthi uNkulunkulu “wadlulisa” izono kwabaseRoma 3:25.
  issues:
  - Incazelo yombhali nezethameli zikaGenesise noJohane ibidinga ukwakhiwa kwemisho okungokwemvelo nokunemba okwengeziwe.
  - Isifinyezo sikaJohane besidinga ukuvumelanisa kahle iZwi nezabizwana zalo.
  - UJohane 1:1 ubenephutha likasonhlamvukazi elithi “IZwi” futhi umusho othi “lase livele likhona” ubuphindaphinda ngokungadingekile.
  - KwabaseRoma 3:25, “wayezidlulisile izono” bekungacaci ngesiZulu; kulungiswe ukuze kudlulise umqondo wokuzivumela zedlule.
  - Ku-1 Petru 1:13, “ukwenza okudingekayo” kwengeze umqondo ongekho emthonjeni; kushintshwe kwaba ukulungela ukuthatha isinyathelo. Inothi ligcine isifaniso sesiGreki ngendlela enembile.
