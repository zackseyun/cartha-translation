book_localizations:
- source_title: Genesis
  title: UGenesise
  author: Umbhali akaziwa; ngokwesiko kuthiwa yabhalwa nguMose. Izazi zanamuhla zibona inomlando omude wokwakhiwa, lapho imithombo yayo yahlanganiswa futhi yahlelwa kamuva.
  audience: U-Israyeli ekuziqondeni kwawo njengabantu besivumelwano, kuqiniswe indaba yemvelaphi yesizwe ekudaleni kukaNkulunkulu, ekukhetheni kwakhe nasezithembisweni zakhe.
  date: Yabhalwa phakathi namakhulu eminyaka; yafinyelela esimweni esamukelwayo cishe ngekhulu lesi-6 kuya kwelesi-5 ngaphambi kukaKristu, ngesikhathi sokudingiselwa eBhabhiloni noma ngemva kwaso.
  summary: UGenesise uxoxa ngokudalwa, ukuhlubuka nokuhlakazeka kwesintu, nangomndeni ka-Abrahama, u-Isaka, uJakobe noJosefa, okwaqala ngawo izithembiso zesivumelwano sikaNkulunkulu ku-Israyeli.
- source_title: John
  title: UJohane
  author: Umbhali akaziwa; ngokwesiko kuthiwa yabhalwa umphostoli uJohane noma “uMfundi Owayethandwa.”
  audience: Umphakathi wamaKristu owawunokungezwani nobuJuda besinagoge, futhi owawakhelwe ebufakazini boMfundi Owayethandwa.
  date: Cishe ngo-90–110 ngemva kukaKristu.
  summary: UJohane wethula uJesu njengeZwi laphakade elembula uYise, elinika ukuphila ngokukholwa kulo, futhi elikhazinyuliswa ngezibonakaliso zalo, ngokufa nangokuvuka kwalo.
- source_title: Gospel of Thomas
  title: IVangeli likaTomase
  author: Umbhali akaziwa; amazwi okuvula athi leli qoqo lamazwi lingelika-“Didymos Judas Thomas.” Umbhalo ophelele osekhona utholakala kuphela enguqulweni yesiCoptic yekhulu lesi-4 evela eNag Hammadi (NHC II,2), kanti kukhona nezingcezu ezintathu zesiGreki ezivela e-Oxyrhynchus.
  audience: Abafundi abangamaKristu ababethonywe ukuhlakanipha kwaseSiriya nemibono yokuqala yeGnostic, begxile olwazini oluyimfihlo lomuntu ngaye ngokwakhe olusemazwini kaJesu.
  date: Umbhalo wokuqala wesiGreki cishe wango-50–140 ngemva kukaKristu; umbhalo wesandla wesiCoptic cishe wango-340 ngemva kukaKristu.
  summary: IVangeli likaTomase liyiqoqo lamazwi okuthiwa ashiwo nguJesu. Alinandaba elandisayo eqhubekayo, futhi liphindaphinda ukubizela abafundi ekutholeni incazelo yalawo mazwi.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: UGenesise 1:1
  text: Lapho uNkulunkulu eqala ukudala amazulu nomhlaba[a]—
  translator_note: '[a] Inguqulo evamile ibheka lokhu njengomusho ophelele: “Ekuqaleni uNkulunkulu wadala amazulu nomhlaba.” Kodwa indlela isiHebheru esibekwe ngayo ngokwemvelo yethula okulandelayo, isenzo esiyinhloko esithi “uNkulunkulu wathi” sisevesini 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: UmShumayeli 1:2
  text: “Umhwamuko wemihwamuko[a],” kusho uQoheleth[b]. “Konke kungumhwamuko—kudlula ngokushesha, akunakubanjwa, futhi ngokuvamile akubi yilokho esikulindele.”
  translator_note: '[a] Igama lesiHebheru elithi hevel ngokwezwi nezwi lisho umoya ophefumulwayo noma umhwamuko. Kuyo yonke incwadi yomShumayeli lichaza lokho okudlula ngokushesha, okungenakubanjwa noma ukuqondwa ngokugcwele, futhi okuvame ukuba ngesinye isimo kunalokho abantu abakulindele. Elithi “umhwamuko” ligcina lowo mfanekiso ngaphandle kokugomela ngokuthi akukho lutho olunencazelo. Okunye okungahunyushwa ngakho: “umoya ophefumulwayo,” “umoya nje,” noma “okudlulayo.” [b] UQoheleth yigama noma yisiqu sombhali ngesiHebheru. Livame ukuhunyushwa ngokuthi “uMfundisi” noma “uMshumayeli,” kodwa lapha kugcinwa elithi “Qoheleth” ukuze kuvunyelwe zonke izincazelo ezingaba khona, kungakhethwa incazelo eyodwa.'
- source_path: nt/john/001/001.yaml
  reference: UJohane 1:1
  text: Ekuqaleni[b], iZwi lalivele likhona. IZwi lalinoNkulunkulu, futhi iZwi lalinguNkulunkulu.[a]
  translator_note: '[a] Kungahunyushwa nangokuthi “iZwi lalinobunkulunkulu” noma “lokho uNkulunkulu ayeyikho, iZwi laliyikho.” Indlela amagama esiGreki abekwe ngayo iqinisekisa ukuthi iZwi linguNkulunkulu ngokugcwele, kuyilapho ilihlukanisa noNkulunkulu emshweni owandulelayo. [b] La mazwi okuvula ananela uGenesise 1:1 futhi axhumanisa iZwi nokuqala kokudalwa. Elithi “lalivele likhona” libonisa ukuthi iZwi lalikhona lapho kufika isiqalo, kunokuba libe khona okokuqala ngaleso sikhathi; kungahunyushwa futhi ngokuthi “lalikhona.”'
- source_path: nt/romans/003/025.yaml
  reference: KwabaseRoma 3:25
  text: UNkulunkulu wammisa ukuba abe ngumhlatshelo wokuhlawulela[a] ngokukholwa egazini lakhe[b]. Lokhu wakwenza ukuze abonise ukulunga kwakhe[c], ngoba wayezivumele zedlule izono ezazenziwe kudala.
  translator_note: '[a] Kungahunyushwa nangokuthi “umhlatshelo osusa ulaka”; noma “isihlalo somusa,” okuyisivalo segolide soMphongolo Wesivumelwano lapho kwakufafazwa khona igazi lokuhlawulela eTestamenteni Elidala. [b] Kungahunyushwa nangokuthi “ngokukholwa, ngegazi lakhe.” [c] Kungahunyushwa nangokuthi “ubulungisa.”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Petru 1:13
  text: Ngakho-ke lungisani izingqondo zenu ukuze nithathe isinyathelo.[a] Hlalani niqaphile engqondweni, futhi nibeke ithemba lenu ngokuphelele emseni eniwulethwayo lapho uJesu uMesiya embulwa.[b]
  translator_note: '[a] IsiGreki ngokwezwi nezwi sithi, “Bophelani izinkalo zezingqondo zenu.” Lokhu kuveza umfanekiso wokuqoqa izingubo ezinde zizungeze ukhalo ukuze umuntu alungele ukuthatha isinyathelo. [b] Igama lesiGreki elihunyushwe ngokuthi “ngokuphelele” lingase libhekisele ekuqapheni engqondweni, ekubekeni ithemba, noma mhlawumbe kukho kokubili.'
