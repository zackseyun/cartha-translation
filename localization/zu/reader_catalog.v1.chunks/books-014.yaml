    Sirach:
      display_name: USirakhi
      author: UJeshuwa indodana ka-Eleyazare, indodana kaSira waseJerusalema; umzukulu wakhe wayihumushela esiGrekini.
      audience: Izinsizwa ezingamaJuda ezaziqeqeshelwa ukuhlakanipha eJerusalema ngenkathi yamaGreki.
      date: Umbhalo wokuqala wesiHebheru cishe ngo-195–175 BC; ukuhunyushelwa esiGrekini cishe ngo-132 BC.
    Baruch:
      display_name: UBaruki
      author: Umbhali akaziwa; le ncwadi yaqanjwa ngoBaruki, umbhali kaJeremiya, nakuba kungeyena owabhala yona.
      audience: AmaJuda ayehlala emazweni angaphandle, ecabanga ngokudingiswa, ukuphenduka nokuhlakanipha.
      date: Cishe ngekhulu lesi-2 BC.
    1 Maccabees:
      display_name: 1 Makabhe
      author: Umbhali akaziwa, kungenzeka ukuthi wayengowaseJerusalema futhi wabhala ngesiHebheru (sekusele umbhalo wesiGreki kuphela).
      audience: AmaJuda ngesikhathi sokuvukela kwamaHasimoni nangemva kwako; le ncwadi ilandisa ngokufaneleka kobukhosi bamaHasimoni.
      date: Cishe ngo-100 BC.
    2 Maccabees:
      display_name: 2 Makabhe
      author: Umbhali ongaziwa owafingqa incwadi ende kaJasoni waseKhurene; yabhalwa ngesiGreki.
      audience: AmaJuda ayehlala emazweni angaphandle futhi ekhuluma isiGreki—kugcizelelwa ukufela ukholo, ukunakekela kukaNkulunkulu nokuvuka kwabafileyo.
      date: Cishe ngo-124 BC noma ngokushesha ngemva kwalokho.
