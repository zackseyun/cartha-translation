      author: Ababhali abaningana phakathi namakhulu eminyaka; izahluko 1–39 zinezimpande ku-Isaya waseJerusalema wekhulu lesi-8, kuyilapho ezika-40–55 (“u-Isaya Wesibili”) nezika-56–66 (“u-Isaya Wesithathu”) zikhuluma ngokudingiswa nangokubuya.
      audience: Abantu bakwaJuda ngaphansi kosongo lwase-Asiriya, ekudingisweni eBhabhiloni, nasekubuyiselweni ngemva kokudingiswa — ngokulandelana.
