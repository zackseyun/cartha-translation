  book_metadata:
    Letters of Ignatius:
      display_name: Izincwadi Zika-Ignatius
      author: U-Ignatius, umbhishobhi wase-Antiyokiya, ngokuqondene nezincwadi eziyisikhombisa zohlelo oluphakathi olwamukelwa ngokuvamile; izincwadi zika-Ignatius ezanwetshwa kamuva nalezo ezabhalwa kusetshenziswa igama lakhe azikho kuleli qoqo.
      audience: Imibuthano yamaKristu e-Efesu, eMagnesiya, eTralesi, eRoma, eFiladelfiya naseSmirna, kanye noPolycarp, eyayibhalelwa ngesikhathi u-Ignatius esohambweni oluya ekufeleni ukholo.
      date: Ngokuvamile kuthiwa zabhalwa ekuqaleni kwekhulu lesibili AD, cishe ngo-105–117, nakuba ukuhleleka kwezikhathi eziqondile zohambo luka-Ignatius kusaphikiswana ngakho.
