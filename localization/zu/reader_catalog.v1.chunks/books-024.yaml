payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Isimo Sababusi
      author: Umbhali akaziwa. Umbhali uchaza uGenesise esebenzisa inganekwane yesambulo ephathelene nababusi; lo mbhalo awunakuthiwa ngokuqiniseka walotshwa umfundisi othile ogagulwe ngegama.
      audience: AmaKristu ayesendaweni yabalandeli bakaSeti noma ehlobene nabo, ayefunda uGenesise njengokungqubuzana phakathi kwababusi bomkhathi abangenalwazi, ukuhlakanipha kwaphezulu, nemvelaphi yomoya womuntu.
      date: Ngokuvamile kuthiwa walotshwa ngekhulu lesi-3 AD; ulondolozwe ekhophini yesiCoptic yekhulu lesi-4 kuyiNag Hammadi Codex II.
    On the Origin of the World:
      display_name: Ngemvelaphi Yomhlaba
      author: Umbhali akaziwa. Lo mbhalo uhlanganisa futhi ubukeza amasiko amaningana obuJuda, obuKristu, kaPlato nawezinganekwane, kodwa awumgaguli ngegama umhlanganisi wawo.
      audience: Abafundi abasendaweni yobuKristu ethonywe imibono yobuGnostiki, ababefuna umlando ohlukile wendalo, wababusi bomkhathi, kaSophia, ka-Adamu no-Eva, nowesiphetho somhlaba.
      date: Ngokuvamile kuthiwa walotshwa ngekhulu lesi-3 AD, nakuba kungenzeka ukuthi usekelwe ezintweni ezalotshwa ngaphambili; ulondolozwe ngokuyinhloko emibhalweni yesiCoptic yekhulu lesi-4.
    Sophia of Jesus Christ:
      display_name: Ukuhlakanipha KukaJesu Kristu
      author: Umbhali akaziwa. Umbhali uguqula ukwaziswa okutholakala naku-Eugnostos kube yingxoxo eyenzeka ngemva kokuvuka kukaJesu phakathi kwakhe nabafundi bakhe.
      audience: AmaKristu ayenesithakazelo ekuhlakanipheni okwembuliwe ngoNkulunkulu ophakeme ngaphezu kwakho konke, ukuhleleka komhlaba wasezulwini, nemvelaphi nokusindiswa komphefumulo.
      date: Kuvame ukuthiwa walotshwa ngasekupheleni kwekhulu lesi-2 noma ngekhulu lesi-3 AD; ulondolozwe emakhophini esiCoptic aseNag Hammadi naseBerlin Codex.
    Gospel of the Egyptians:
      display_name: IVangeli LabaseGibhithe
      author: Umbhali akaziwa. Lo mbhalo waseNag Hammadi, obizwa nangokuthi INcwadi Engcwele Yomoya Omkhulu Ongabonakali, uhlukile eVangelini LabaseGibhithe lesiGreki langaphambili elaziwa kuphela ngezingcaphuno.
      audience: Umphakathi wamaKristu wabalandeli bakaSeti owawusebenzisa inganekwane eningilizayo, amagama angcwele, imifanekiso yobhapathizo, nokudumisa okunjengehubo ukuze uchaze ubunjalo bawo obungokomoya nokukhululwa.
      date: Ngokuvamile kuthiwa walotshwa ngekhulu lesi-2 noma lesi-3 AD; amakhophi amabili esiCoptic asekhona kuma-codex aseNag Hammadi ekhulu lesi-4.
    Letter of Peter to Philip:
      display_name: Incwadi KaPetru Eya KuFiliphu
      author: Umbhali akaziwa. Incwadi emfushane eyisethulo nesambulo esiyilandelayo kuthiwa zalotshwa uPetru noFiliphu kusetshenziswa amagama abo, kunokuba kube nesiqinisekiso sokuthi omunye walaba baphostoli wazibhala.
      audience: AmaKristu ayefuna igunya labaphostoli lemfundiso ephathelene noMsindisi, imibuso enobutha, ukuhlupheka, umsebenzi wokushumayela, nokubuyiselwa kwabafundi.
      date: Ngokuvamile kuthiwa yalotshwa ngasekupheleni kwekhulu lesi-2 noma ekuqaleni kwekhulu lesi-3 AD; ilondolozwe ekhophini yaseNag Hammadi yekhulu lesi-4 nakomunye umbhalo wesiCoptic wakamuva.
    Gospel of Judas:
      display_name: IVangeli LikaJuda
      author: Umbhali akaziwa. Isihloko sithi le ndaba ekaJuda, kodwa lo mbhalo awufakazeli ukuthi uJuda Iskariyothe wayengumbhali wawo wangempela emlandweni.
      audience: Iqembu lamaKristu elaligxeka imikhuba yezimbangi yokunikela imihlatshelo neyokuphatha ibandla, lisebenzisa ingxoxo yesambulo nemfundiso ngomkhathi yohlobo lwabalandeli bakaSeti ukuze lichaze kabusha uJuda nokufa kukaJesu.
      date: Ngokuvamile kuthiwa walotshwa maphakathi noma ngasekupheleni kwekhulu lesi-2 AD; u-Irenaeus wayelazi iVangeli LikaJuda cishe ngo-180, kanti ikhophini yesiCoptic esekhona cishe ingeyekhulu lesi-3 noma lesi-4.
    Protoevangelium of James:
      display_name: IVangeli Lokuqala LikaJakobe
      author: Umbhali akaziwa. Umlandisi uthi unguJakobe, kodwa lo mbhalo walotshwa kusetshenziswa igama lakhe futhi awulotshwanga uJakobe umfowabo kaJesu.
      audience: AmaKristu ayenesithakazelo ekuzalweni nasekukhuleni kukaMariya, ekuhlaleni kwakhe emsulwa njalo, ekuzalweni kukaJesu, nasezimpendulweni ezilandisayo zemibuzo eyashiywa ingaphendulwanga nguMathewu noLuka.
      date: Ngokuvamile kuthiwa walotshwa engxenyeni yokugcina yekhulu lesi-2 AD; usekhona emibhalweni eminingi yesiGreki yakamuva nasezinguqulweni zasendulo.
