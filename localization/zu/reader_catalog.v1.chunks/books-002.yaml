  book_metadata:
    Numbers:
      display_name: Izinombolo
      author: Umbhali akaziwa; ngokwesiko kuthiwa nguMose.
      audience: U-Israyeli ohambweni olusuka eGibhithe luya ezweni lesithembiso — isizukulwane sasehlane, kanye nabafundi bakamuva abafunda emaphutheni aso.
      date: Izingxenye zokubhalwa zisukela ngasekupheleni kwenkathi yobukhosi kuze kube senkathini yangemva kokudingiselwa (cishe ngekhulu lesi-7 kuya kwelesi-5 BC).
    Deuteronomy:
      display_name: UDuteronomi
      author: Umbhali akaziwa; le ncwadi yethulwa njengezinkulumo zikaMose zokuvalelisa. Izifundiswa zanamuhla zibeka ingxenye yayo eyinhloko enguqukweni yangasekupheleni kwekhulu lesi-7 BC ngaphansi kukaJosiya.
      audience: U-Israyeli olungiselela ukungena ezweni — kanye nabadingisiwe bakamuva ababezibuza ukuthi bangaphila kanjani ngokwethembeka ngaphandle kwethempeli noma kwenkosi.
      date: Ingxenye eyinhloko cishe ingeyasekupheleni kwekhulu lesi-7 BC; incwadi yafinyelela esimweni sayo sokugcina ngesikhathi sokudingiselwa.
    Joshua:
      display_name: UJoshuwa
      author: Umbhali akaziwa; iyingxenye yoMlando kaDuteronomi.
      audience: U-Israyeli ngesikhathi sobukhosi nasekudingisweni, ecabanga ngokunqotshwa kwezwe, ngesivumelwano nangencazelo yezwe.
      date: Yahlanganiswa cishe ngekhulu lesi-7 kuya kwelesi-6 BC kusetshenziswa amasiko amadala.
