payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: UPolycarp KwabaseFilipi
      author: UPolycarp, umbhishobhi waseSmirna. Ezinye izazi ziqonda umbhalo esawuthola njengohlanganisa izinto ezathunyelwa ngezikhathi ezingaphezu kwesisodwa.
      audience: Ibandla lamaKristu laseFilipi, elacela izincwadi zika-Ignatius labe selithola izeluleko ngokholo, ukuziphatha, ubuholi, imali nokukhuthazela.
      date: Ekuqaleni kuya maphakathi nekhulu lesi-2 AD; okungenani ingxenye yawo ihlobene eduze nohambo luka-Ignatius, kanti imibono yokuthi le ncwadi yakhiwe ngezingxenye ivumela ukuthi ingxenye ethile yabhalwa kamuva kancane.
    Martyrdom of Polycarp:
      display_name: Ukufela Ukholo KukaPolycarp
      author: Amalungu angaziwa ebandla laseSmirna, ebhala egameni lomphakathi; amanothi okuphetha aphathelene nokudluliselwa kombhalo abonisa ukukopishwa nokusakazwa kwawo kamuva.
      audience: Ibandla laseFilomeliyu kanye nokuhlanganyela kwamaKristu okubanzi, linikwa ukulandisa ngokuboshwa kukaPolycarp, ukuqulwa kwecala lakhe, ukufa kwakhe nokukhuthazela kwakhe okuyisibonelo.
      date: Yabhalwa ngemva kokufa kukaPolycarp, futhi ngokuvamile kuthiwa ingeyaphakathi noma ngasekupheleni kwekhulu lesi-2 AD; kokubili unyaka oqondile wokufela kwakhe ukholo kanye nesimo sokugcina sombhalo kusaphikiswana ngakho.
    Epistle to Diognetus:
      display_name: Incwadi Eya KuDiognetus
      author: Umbhali akaziwa. Uzibiza ngomfundi noma umuntu osafundayo, kodwa yena noDiognetus abhalela kuye abakwazi ukuhlonzwa ngokuqinisekile.
      audience: Umuntu ofundile owayengeyena umKristu owayefuna ukwazi—kanye nabafundi abafana naye—ebuza ngokukhonza kwamaKristu, ukuziphatha, indawo yawo emphakathini, uthando nokubonakala sengathi ukholo lusha.
      date: Ivame ukubekwa ngasekupheleni kwekhulu lesi-2 noma ekuqaleni kwekhulu lesi-3 AD, nakuba imibono ihlukahluka kakhulu; izahluko ezimbili zokugcina kungenzeka zivela komunye umbhalo.
    Fragments of Papias:
      display_name: Izingcezu Zemibhalo KaPapias
      author: UPapias, umbhishobhi waseHierapholi, nguye owabhala umsebenzi olahlekile wezincwadi ezinhlanu othi Izincazelo Zamazwi ENkosi; iqoqo elisekhona linezingcaphuno nemibiko eyalondolozwa ababhali bakamuva.
      audience: AmaKristu okuqala ayefuna izimfundiso ezazikhunjulwa ngoJesu nangabaphostoli, eziqoqwe ngochungechunge olunamagama lwabantu ababedlulisa ubufakazi bomlomo nezincazelo.
      date: Umsebenzi kaPapias uvame ukubekwa ekuqaleni kwekhulu lesi-2 AD, ngokuvamile cishe ngo-110–130; izingcezu ezisekhona zitholakala emibhalweni yababhali ababhala kusukela ngekhulu lesi-2 kuqhubeke.
