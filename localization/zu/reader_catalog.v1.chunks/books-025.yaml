payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: IVangeli Yobuntwana KaTomase
      author: Umbhali akaziwa. Uhlobo lwayo lokuqala olungatholakala alulisho igama lombhali; ukuhlotshaniswa kwayo noTomase kuvela ezihlokweni zemibhalo yesandla zakamuva nasendleleni eyadluliselwa ngayo.
      audience: AmaKristu anelukuluku ngobuntwana bukaJesu nangendlela amandla aphezulu, isiyalo, ukufunda nokukhula kwakhe okungalandiswa ngayo ngaphambi kokuba kuqale ukulandisa kwamaVangeli asemthethweni.
      date: Ngokuvamile umsuka wayo ulandelelwa ekhulwini lesi-2 emva kukaKristu, kodwa lo mbhalo usasekhona ngezinhlelo eziningana zesiGreki ezihluke kakhulu nangezinguqulo zakudala.
    Acts of Paul and Thecla:
      display_name: Izenzo ZikaPawulu NoThekla
      author: Umbhali akaziwa. Lesi yisiqephu esivela encwadini enkulu ethi Izenzo ZikaPawulu; umbiko wasendulo othi umphristi othile waqamba le ncwadi awukwazi ukumkhomba ngokuqinisekile umbhali.
      audience: AmaKristu akhangwa izindaba zokushumayela kwabaphostoli, ukungashadi, ukubhapathizwa, ukukhuthazela okufana nokwabafelukholo, kanye negunya lowesifazane lokufundisa nokufakaza.
      date: Yaqanjwa ekhulwini lesi-2 emva kukaKristu, cishe engxenyeni yalo yesibili; yasakazwa kokubili njengengxenye ye-Izenzo ZikaPawulu nanjengencwadi ezimele.
    Gospel of Peter:
      display_name: IVangeli LikaPetru
      author: Umbhali akaziwa. Ukulandisa okusekhona kukhuluma ngezwi likaPetru futhi kwadluliselwa ngaphansi kwegama lakhe, kodwa akubhekwa njengencwadi yomphostoli uPetru ongokomlando.
      audience: AmaKristu okuqala ayenesithakazelo ekulandiseni okunwetshiwe kokuhlupheka nokuvuka kukaJesu, cishe emiphakathini lapho igunya likaPetru lalibaluleke ngokukhethekile.
      date: Ngokuvamile kubekwa ekhulwini lesi-2 emva kukaKristu; isiqephu esiyinhloko sesiGreki esisekhona sivela embhalweni wesandla wakamuva kakhulu owatholakala e-Akhmim.
    2 Clement:
      display_name: 2 Klementi
      author: Umbhali akaziwa. Naphezu kwesihloko sayo esingokwesiko, lena yintshumayelo yamaKristu okuqala, hhayi incwadi yesibili eyabhalwa uKlementi waseRoma.
      audience: Ibandla lamaKristu elinxuswa ukuba liphenduke, lihambisane ezenzweni zalo nezinkolelo zalo, linakekele abasengozini futhi likhuthazele ngokwethembeka ethembeni lokuvuka nokwahlulelwa.
      date: Ngokuvamile ibekwa engxenyeni yokuqala noma maphakathi nekhulu lesi-2 emva kukaKristu (cishe ngo-100–160); indawo eyaqanjwa kuyo ayiqinisekile.
    Epistle of Barnabas:
      display_name: Incwadi KaBarnaba
      author: Umbhali akaziwa. Ngokwesiko le ncwadi yayihlotshaniswa noBarnaba, umngane kaPawulu, kodwa izazi zanamuhla azikwamukeli lokho kuhlotshaniswa.
      audience: AmaKristu angabeZizwe ayefundiswa ukuba athathe imiBhalo ka-Israyeli njengeyawo ngokuyihumusha ngokuphathelene noKristu nangokomfanekiso, kuyilapho ehlukanisa ubunjalo bawo besivumelwano nemikhuba yobuJuda.
      date: Ngokuvamile ibekwa phakathi kokubhujiswa kwethempeli laseJerusalema ngo-70 emva kukaKristu nasekuqaleni kwekhulu lesi-2, ngokuvamile cishe ngo-80–130.
