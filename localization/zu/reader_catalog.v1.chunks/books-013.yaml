payload:
  book_metadata:
    James:
      display_name: Jakobe
      author: Ngokwesiko nguJakobe umfowabo kaJesu; izazi zanamuhla zihlukene phakathi kokuthi nguye ngempela yini owabhala noma incwadi yabhalwa ngomunye esebenzisa igama lakhe.
      audience: Imibuthano yamaKristu angamaJuda ayehlakazekele kwezinye izindawo.
      date: Cishe ngeminyaka yawo-50–60 AD uma kunguye ngempela owabhala; cishe ngasekupheleni kwekhulu lokuqala AD uma yabhalwa ngomunye esebenzisa igama lakhe.
    1 Peter:
      display_name: 1 Petru
      author: Ngokwesiko ngumphostoli uPetru, uSilvanusi engumbhali wakhe; ezinye izazi zithi yabhalwa ngomunye esebenzisa igama likaPetru.
      audience: AmaKristu ase-Asia Minor yoMbuso WamaRoma ayebhekene nenzondo emphakathini.
      date: Cishe ngeminyaka yawo-60 AD uma yabhalwa nguPetru; cishe ngeminyaka yawo-70–90 AD uma yabhalwa ngomunye esebenzisa igama lakhe.
    2 Peter:
      display_name: 2 Petru
      author: Ngokwesiko nguPetru; izazi eziningi zanamuhla zithi yabhalwa ngomunye esebenzisa igama lakhe.
      audience: AmaKristu ayebhekene nabahleki bosulu ababephika ukubuya kukaKristu.
      date: Cishe ekuqaleni kwekhulu lesibili AD.
    1 John:
      display_name: 1 Johane
      author: Umbhali akaziwa; ngokwesiko ngumphostoli uJohane noma umdala womphakathi kaJohane.
      audience: Umphakathi kaJohane ngemva kokwehlukana phakathi kwawo, uchaza ukuthi obani abangamalungu awo.
      date: Cishe ngo-90–110 AD.
    2 John:
      display_name: 2 Johane
      author: “Umdala.”
      audience: Umbuthano othile wamaKristu (“inkosikazi ekhethiweyo”) oxwayiswa ngabafundisi bamanga.
      date: Cishe ngo-90–110 AD.
    3 John:
      display_name: 3 Johane
      author: “Umdala.”
      audience: UGayu, umholi othile owayemukela izithunywa zevangeli ezihambahambayo.
      date: Cishe ngo-90–110 AD.
    Jude:
      display_name: Juda
      author: Ngokwesiko nguJuda, umfowabo kaJakobe noJesu.
      audience: Imiphakathi yamaKristu eyayingenelwa abafundisi abakhuthaza ukuziphatha okuxekethile.
      date: Cishe ngeminyaka yawo-60–90 AD.
    Revelation:
      display_name: IsAmbulo
      author: UJohane wasePhatmose (indlela yakhe yokubhala ihlukile kweyeVangeli Lesine).
      audience: Imibuthano eyisikhombisa yamaKristu e-Asia Minor yoMbuso WamaRoma eyayingaphansi kwengcindezi yombuso.
      date: Cishe ngeminyaka yawo-90 AD, ngokwesiko ngesikhathi sokubusa kukaDomitiyanu.
    Tobit:
      display_name: UTobiti
      author: Umbhali akaziwa.
      audience: AmaJuda ayehlala ngaphandle kwezwe lawo, efuna ukuphila ngokuzinikela, ukuphatha umshado nokwethemba ukuqondisa kukaNkulunkulu ngaphansi kombuso wezizwe.
      date: Cishe ngo-225–175 BC; yaqanjwa ngesi-Aramu, futhi uhlobo lwesiHebheru nalo luyafakazelwa emibhalweni yaseQumran.
    Judith:
      display_name: UJudithi
      author: Umbhali akaziwa.
      audience: AmaJuda ayesongelwa izizwe—indaba enesibindi yokumelana nokucindezelwa ngokuzinikela kuNkulunkulu.
      date: Cishe ngo-150–100 BC.
    Greek Additions to Esther:
      display_name: Izengezo ZesiGreki Ku-Esteri
      author: Umbhali akaziwa; ukwaziswa okwengeziwe okwafakwa enguqulweni yesiGreki ka-Esteri.
      audience: AmaJuda akhuluma isiGreki ayefuna indaba ka-Esteri enomthandazo ocacile nokukhuluma ngoNkulunkulu ngokuqondile.
      date: Cishe ngekhulu lesibili kuya kwelokuqala BC.
    Wisdom of Solomon:
      display_name: Ukuhlakanipha KukaSolomoni
      author: Umbhali akaziwa; kwathiwa nguSolomoni nakuba kwabhalwa ngomunye esebenzisa igama lakhe. Kwaqanjwa ngesiGreki ngumbhali ongumJuda owayephila endaweni yamasiko esiGreki, cishe e-Aleksandriya.
      audience: AmaJuda ayephila endaweni yamasiko esiGreki, exoxa nefilosofi yamaGreki futhi evikela ukuhlakanipha kuka-Israyeli ezindleleni zabahedeni nezalabo abahlubuka okholweni.
      date: Cishe ngo-50 BC–50 AD.
