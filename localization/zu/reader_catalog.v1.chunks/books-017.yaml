  verdict: revise
  review_summary: Ukubuyekezwa kuqedile. Kulungiswe ukuhumusha okungahambisani nomthombo, ikakhulukazi izahluko 1 Enoch 93 no-103 kanye no-2 Baruch 36, 44, 52, no-57; kuphinde kwathuthukiswa imininingwane yencwadi.
  issues:
  - '1 Enoch 93: “Weeks” kwakungafanele kuhunyushwe ngokuthi “Amasonto” (congregations).'
  - '1 Enoch 103: “vindication” kwakungafanele kube “ukuthethelelwa.”'
  - '2 Baruch 36: Ubudlelwane bokusola phakathi komsedari nomvini babuphendukile.'
  - '2 Baruch 44: Isihloko sicaciswe ukuze sisho indodana kaBaruki, uWisdom.'
  - '2 Baruch 52: Ukubonwa kwabafileyo ngabaphilayo kuhumushwe ngokucacile.'
  - '2 Baruch 57: “Adam’s transgression” kulungiswe kusuke “esono” kuya “ekweqeni umthetho.”'
