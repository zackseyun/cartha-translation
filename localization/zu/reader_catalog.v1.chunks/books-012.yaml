      display_name: 2 KwabaseKorinte
      author: UPawulu, kanye noThimothewu.
      audience: Ibandla laseKorinte, ngemva kwengxabano ebuhlungu.
      date: Cishe ngo-55–56 AD.
    Galatians:
      display_name: KwabaseGalathiya
      author: UPawulu.
      audience: Amabandla amaKristu aseGalathiya (enkabeni ye-Anatholiya) ayecindezelwa ukuba amukele ukusoka nokugcina iTorah.
      date: Cishe ngo-48–55 AD (kuyaphikiswana ngakho).
    Ephesians:
      display_name: Kwabase-Efesu
      author: UPawulu, noma umfundi wakhe osondelene naye owabhala egameni likaPawulu (kuyaphikiswana ngakho).
      audience: Abafundi abangamaKristu base-Asiya bebonke; igama lendawo elithi "Efesu" alikho emibhalweni yesandla yakudala kakhulu.
      date: Cishe ngeminyaka yawo-60 AD uma kungokukaPawulu; cishe ngeminyaka yawo-80–90 AD uma kwabhalwa omunye egameni lakhe.
    Philippians:
      display_name: KwabaseFilipi
      author: UPawulu, kanye noThimothewu.
      audience: Ibandla lamaKristu laseFilipi, ikoloni lamaRoma eMakedoniya.
      date: Cishe ngo-60–62 AD, yabhalelwa ejele.
    Colossians:
      display_name: KwabaseKolose
      author: UPawulu, kanye noThimothewu — noma umfundi wakhe osondelene naye owabhala egameni likaPawulu (kuyaphikiswana ngakho).
      audience: AmaKristu aseKolose esigodini saseLikusi, ayebhekene nemfundiso exuba izinkolelo ezihlukahlukene.
      date: Cishe ngo-60–62 AD uma kungokukaPawulu; kamuva uma kwabhalwa omunye egameni lakhe.
    1 Thessalonians:
      display_name: 1 KwabaseThesalonika
      author: UPawulu, kanye noSilvanusi noThimothewu.
      audience: Ibandla lamaKristu elalisanda kumiswa eThesalonika, elalibhekene nokushushiswa.
      date: Cishe ngo-50–51 AD — kungenzeka ukuthi iyincwadi kaPawulu endala kunazo zonke ezisekhona.
    2 Thessalonians:
      display_name: 2 KwabaseThesalonika
      author: UPawulu (kuyaphikiswana ngakho; ezinye izazi zithi yabhalwa omunye egameni lakhe).
      audience: Ibandla laseThesalonika, kubhekwana nokudideka ngezinto zezikhathi zokugcina.
      date: Cishe ngo-51 AD uma kungokukaPawulu.
    1 Timothy:
      display_name: 1 KuThimothewu
      author: UPawulu, noma umfundi owabhala egameni likaPawulu (abaningi babheka izincwadi zobufundisi njengezabhalwa abanye egameni lakhe).
      audience: UThimothewu njengommeleli kaPawulu e-Efesu; incwadi yeziqondiso zokuhleleka kwebandla esikhathini esalandela.
      date: Cishe maphakathi neminyaka yawo-60 AD uma kungokukaPawulu; cishe ngo-90–110 AD uma kwabhalwa omunye egameni lakhe.
    2 Timothy:
      display_name: 2 KuThimothewu
      author: UPawulu, noma umfundi owabhala egameni likaPawulu.
      audience: UThimothewu — yethulwa njengamazwi kaPawulu okuvalelisa esejele.
      date: Cishe maphakathi neminyaka yawo-60 AD uma kungokukaPawulu; cishe ngo-90–110 AD uma kwabhalwa omunye egameni lakhe.
    Titus:
      display_name: KuThithu
      author: UPawulu, noma umfundi owabhala egameni likaPawulu.
      audience: UThithu njengommeleli kaPawulu eKrethe.
      date: Cishe maphakathi neminyaka yawo-60 AD uma kungokukaPawulu; cishe ngo-90–110 AD uma kwabhalwa omunye egameni lakhe.
    Philemon:
      display_name: KuFilemoni
      author: UPawulu, kanye noThimothewu.
      audience: UFilemoni, umKristu owayenesigqila, ngokuphathelene no-Onesimu, isigqila sakhe esasibalekile.
      date: Cishe ngo-60–62 AD.
    Hebrews:
      display_name: KumaHebheru
      author: Umbhali akaziwa. Ngokwesiko kuye kwaphakanyiswa uPawulu, u-Apholo, uBarnaba, uPrisila nabanye; akukho siphakamiso esivunywa yibo bonke.
      audience: AmaKristu angamaJuda ayekhuluma isiGreki, ayelingeka ukuba ahlehle ekuvumeni kwawo ukholo lobuKristu.
      date: Cishe ngo-60–95 AD.
