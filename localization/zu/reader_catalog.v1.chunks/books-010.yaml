    Malachi:
      display_name: Malaki
      author: Umbhali akaziwa; elithi “Malaki” lisho ukuthi “isithunywa sami.”
      audience: AbakwaJuda bangemva kokudingiswa abase beyekelela ekukhonzeni nasekuthembekeni ngaphansi kokubusa kwamaPheresiya.
      date: Cishe maphakathi nekhulu lesi-5 ngaphambi kukaKristu.
    Matthew:
      display_name: Mathewu
      author: Umbhali akaziwa; isiko lithi yabhalwa umphostoli uMathewu. Izazi zanamuhla zibona umbhali ongumJuda ongumKristu owayekhuluma isiGreki, owasebenzisa uMarku nomthombo ofana no-Q.
      audience: Umphakathi wamaJuda angamaKristu owawubhekene nombuzo wokuqhubeka nokungaqhubeki kwawo nobuJuda basesinagogeni.
      date: Cishe ngo-80–90 ngemva kukaKristu.
    Mark:
      display_name: Marku
      author: Umbhali akaziwa; isiko liyihlobanisa noJohane Marku, owayehamba noPetru.
      audience: Umphakathi wamaKristu okhuluma isiGreki, okungenzeka wawuseRoma, owawushushiswa noma usengozini yokushushiswa.
      date: Cishe ngo-65–75 ngemva kukaKristu, ngesikhathi esiseduze neMpi yamaJuda nokubhujiswa kwethempeli.
