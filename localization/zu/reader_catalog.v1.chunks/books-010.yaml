    Zechariah:
      display_name: Zakariya
      author: UZakariya indodana kaBerekiya; izahluko 9–14 cishe zavela komunye umbhali wakamuva.
      audience: Ababuya ekudingisweni ababeyakha kabusha ithempeli, kanye nemiphakathi yakamuva yangemva kokudingiswa.
