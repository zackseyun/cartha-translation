      display_name: Zefaniya
      author: UZefaniya indodana kaKushi.
      audience: AbakwaJuda ngaphansi kukaJosiya, ngaphambi nje kwezinguquko zakhe.
      date: Cishe ngo-640–609 ngaphambi kukaKristu.
    Haggai:
      display_name: Hagayi
