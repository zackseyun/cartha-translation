payload:
  book_metadata:
    Gospel of Mary:
      display_name: IVangeli likaMariya
      author: Umbhali akaziwa. Le ncwadi iveza uMariya njengowamukela futhi ohumusha isambulo sikaJesu, kodwa ayisho ukuthi uMariya nguye owabhala ivangeli elisekhona.
      audience: Abafundi abangamaKristu okuqala ababebhekene nemibuzo ephathelene nesambulo, ukukhuphukela ezindaweni zomoya, igunya labaphostoli, nokwamukeleka kwemfundiso kaMariya phakathi kwabafundi bakaJesu.
      date: Ngokuvamile kuthiwa yabhalwa ngekhulu lesibili ngemva kukaKristu; kusekhona izingcezu zesiGreki zangekhulu lesithathu, kanti ikhophi eyinhloko yesiCoptic igcinwe kuyi-Berlin Codex 8502 yangekhulu lesihlanu.
    Treatise on the Resurrection:
      display_name: Incwadi Echaza Ngokuvuka Kwabafileyo
      author: Umbhali akaziwa. Le ncwadi ihlelwe njengencwadi kathisha eya kumfundi okuthiwa uRheginos; akekho phakathi kukathisha noRheginos ongakhonjwa ngokuqinisekile.
      audience: AmaKristu afuna ukufundiswa ngokuvuka kwabafileyo, ikakhulukazi abafundi abacabangisisa ngokuvuka komzimba, ukuvuka komoya, nokuhlanganyela ekuphileni kokuvuka kwabafileyo kwamanje.
      date: Ngokuvamile kuthiwa yabhalwa ngasekupheleni kwekhulu lesibili ngemva kukaKristu (kaningi cishe ngo-170–200); igcinwe ekhophini yesiCoptic yangekhulu lesine yomsebenzi wesiGreki wangaphambili.
    Dialogue of the Savior:
      display_name: Ingxoxo YoMsindisi
      author: Umbhali akaziwa. Kule ngxoxo, izimfundiso ezembuliwe zethulwa njengamazwi kaJesu lapho exoxa noJuda, uMathewu noMariya, kodwa ayisho ukuthi ubani owayihlanganisa.
      audience: Iqembu lamaKristu okuqala elalithanda izindaba zesambulo sangasese, ukuba ngumfundi, ukuzazi, umthandazo, nokuzithiba njengokulungiselela insindiso.
      date: Ngokuvamile kuthiwa yabhalwa ngekhulu lesibili ngemva kukaKristu, nakuba izingqimba zokubhalwa kwayo kanye nosuku oluqondile kusaphikiswana ngakho; igcinwe embhalweni wesandla wesiCoptic wangekhulu lesine.
    Exegesis on the Soul:
      display_name: Incazelo Ngomphefumulo
      author: Umbhali akaziwa. Umbhali ungumshumayeli ongumKristu ochaza kabusha imifanekiso yeBhayibheli neyezincwadi zesiGreki njengomfanekiso ongokomfanekiso wokuwa komphefumulo, ukuphenduka kwawo nokubuyiselwa kwawo.
      audience: AmaKristu ayejwayelene nemiBhalo nezikhuthazo zokuziphatha kahle, ayebizelwa ukuba ashiye izifiso ezingalawuleki, aphenduke futhi aphinde ahlangane noNkulunkulu.
      date: Ngokuvamile kuthiwa yabhalwa ngasekupheleni kwekhulu lesibili noma ekuqaleni kwekhulu lesithathu ngemva kukaKristu; igcinwe enguqulweni yesiCoptic yangekhulu lesine eyahunyushwa isuselwa esiGrekini.
    Book of Thomas the Contender:
      display_name: Incwadi kaTomase Umbangi
      author: Umbhali akaziwa. Isihloko esisekugcineni kwayo sihlobanisa le ncwadi noJuda Tomase futhi sithi uMathaias nguyena owayiloba, kodwa lokhu kuwukuqanjwa kwababhali njengendlela yokubhala, hhayi izimangalo zobuqambi ezingaqinisekiswa.
      audience: AmaKristu ayethambekele ekuzithibeni, ayekhuthazwa ukuba afune ukuzazi, amelane nezinkanuko zomzimba futhi aqonde iziyalezo zangasese zikaJesu kuTomase.
      date: Kaningi kuthiwa yabhalwa ngasekupheleni kwekhulu lesibili noma ekuqaleni kwekhulu lesithathu ngemva kukaKristu, mhlawumbe phakathi kwamaKristu aseSiriya; igcinwe embhalweni wesandla wesiCoptic wangekhulu lesine.
    Tripartite Tractate:
      display_name: Incwadi Ehlukaniswe Izingxenye Ezintathu
      author: Umbhali akaziwa. Umbhali wayeyisazi semfundiso yenkolo esingumKristu waseValentinus esifunde kakhulu; akunakwenzeka ukumhlobanisa ngokuqinisekile nomfundisi othile owaziwayo ngegama.
      audience: Umphakathi wamaKristu aseValentinus owawuthola imfundiso eningiliziwe ngoNkulunkulu, ama-eon, indalo, uKristu, ibandla, insindiso nokubuyiselwa kokugcina.
      date: Ngokuvamile kuthiwa yabhalwa ngekhulu lesithathu ngemva kukaKristu, kanti abanye baphikisa ngokuthi yabhalwa engxenyeni yokugcina yalelo khulu; igcinwe ngesiCoptic kuyi-Jung Codex yangekhulu lesine.
    Apocryphon of John:
      display_name: Incwadi Eyimfihlo kaJohane
      author: Umbhali akaziwa. Le ncwadi, isebenzisa igama lomunye njengombhali, yethula isambulo sikaJesu ovusiwe esiya kuJohane indodana kaZebedewu futhi isekhona ngezinhlelo zombhalo zasendulo ezingaphezu kweyodwa.
      audience: AmaKristu ayesenkambisweni yezambulo yamaSethi noma ehlobene kakhulu nayo, ayefuna ukulandisa ngendawo yaphezulu, indalo, ukuthi umuntu ungubani, nokukhululwa kubabusi abanobutha.
      date: Kungenzeka ukuthi uhlobo lwayo lokuqala lwasakazwa ngekhulu lesibili ngemva kukaKristu; imibhalo yesiCoptic esekhona, egcina izinhlelo ezimfushane nezinde, ingeyekhulu lesine nelesihlanu.
