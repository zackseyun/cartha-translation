  book_metadata:
    Genesis:
      display_name: UGenesise
      author: Umbhali akaziwa; ngokwesiko kuthiwa nguMose. Izazi zanamuhla zibheka le ncwadi njengeyabhalwa phakathi nesikhathi eside, kusetshenziswa imithombo eyahlelwa ndawonye kamuva.
      audience: U-Israyeli njengabantu abazi ukuthi bangobani esivumelwaneni, indaba yemvelaphi yabo isekelwe ekudaleni kukaNkulunkulu, ekukhetheni kwakhe nasezithembisweni zakhe.
      date: Yabhalwa phakathi namakhulu eminyaka; yafinyelela esimweni eyamukelwa ngaso cishe ngekhulu lesi-6 kuya kwelesi-5 ngaphambi kukaKristu, ngesikhathi sokudingiselwa eBhabhiloni noma ngemva kwaso.
      summary: UGenesise ukhuluma ngokudalwa, ukuhlubuka nokuhlakazeka kwesintu, nangomndeni ka-Abrahama, u-Isaka, uJakobe noJosefa, okwaqala ngawo izithembiso zikaNkulunkulu zesivumelwano no-Israyeli.
    Exodus:
      display_name: UEksodusi
      author: Umbhali akaziwa; ngokwesiko kuthiwa nguMose. Izazi zanamuhla zibheka le ncwadi njengeyabhalwa phakathi nesikhathi eside, kusetshenziswa imithombo eyahlelwa ndawonye kamuva.
      audience: U-Israyeli njengabantu abakhululiwe nabasesivumelwaneni, abafunda ukuthi kusho ukuthini ukuba yisizwe seNKOSI ngaphansi komthetho wayo.
      date: Yabhalwa phakathi namakhulu eminyaka; yafinyelela esimweni eyamukelwa ngaso cishe ngekhulu lesi-6 kuya kwelesi-5 ngaphambi kukaKristu.
    Leviticus:
      display_name: ULevitikusi
      author: Umbhali akaziwa; ngokwesiko kuthiwa nguMose. Izazi zanamuhla ziyihlanganisa nomthombo wobupristi.
      audience: Abapristi bakwa-Israyeli nomphakathi okhonzayo — iziqondiso zemihlatshelo, ubungcwele nokuhlelwa kokuphila ngokugxila ebukhoneni bukaNkulunkulu.
      date: Izingxenye zayo zabhalwa kusukela ngasekupheleni kombuso wamakhosi kuze kube senkathini yangemva kokudingiswa (cishe ngekhulu lesi-7 kuya kwelesi-5 ngaphambi kukaKristu).
