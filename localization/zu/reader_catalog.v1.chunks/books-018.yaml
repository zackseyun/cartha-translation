  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Umbhali akaziwa, kunohlaka olwahlelwa amaKristu oluzungeze ingxenye eyinhloko eyayingeyamaJuda ekuqaleni (4 Ezra, izahluko 3–14).
      audience: AmaJuda ngemva kuka-70 AD ayebhekene nombuzo wokulunga kukaNkulunkulu lapho kunobubi nokuhlupheka; kamuva yandiswa yabhekiselwa kubafundi abangamaKristu.
      date: Ingxenye eyinhloko yamaJuda cishe ngo-100 AD; izengezo zamaKristu cishe ngekhulu lesi-2 kuya kwelesi-3 AD.
    Didache:
      display_name: IDidache
      author: Umbhali akaziwa (isihloko sisho ukuthi “Imfundiso Yabaphostoli Abayishumi Nambili”).
      audience: Imibuthano yamaKristu okuqala — incwadi emfushane yeziqondiso ngokuziphatha, ukubhapathiza, i-Ekaristi, nabafundisi abahambahambayo.
      date: Cishe ngasekupheleni kwekhulu loku-1 kuya ekuqaleni kwekhulu lesi-2 AD.
    Gospel of Thomas:
      display_name: IVangeli likaTomase
      author: Umbhali akaziwa; amazwi okuvula athi leli qoqo lamazwi lavela ku-“Didymos Judas Thomas.” Umbhalo ophelele osekhona utholakala kuphela enguqulweni yesiCoptic yekhulu lesi-4 evela eNag Hammadi (NHC II,2), kanti kunezingcezu ezintathu zesiGreki ezivela e-Oxyrhynchus.
      audience: Abafundi abangamaKristu ababethonywe ukuhlakanipha kwaseSiriya nomcabango we-proto-Gnostic, begxile ekuzazini okuyimfihlakalo emazwini kaJesu.
      date: Umbhalo wokuqala wesiGreki cishe wango-50–140 AD; umbhalo wesandla wesiCoptic cishe wango-340 AD.
      summary: IVangeli likaTomase liyiqoqo lamazwi okuthiwa ashiwo nguJesu. Alinandaba exoxwa ngokuqhubekayo, futhi liphindaphinda ukubizela abafundi ukuba bathole incazelo yala mazwi.
