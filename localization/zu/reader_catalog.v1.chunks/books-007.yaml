      author: Iqoqo lemibhalo; izihloko zalo zibiza uSolomoni, u-Aguri, uLemuweli kanye “nabahlakaniphileyo.”
      audience: Ama-Israyeli asemasha afundiswa ukuhlakanipha ukuze aphile ukuphila kwansuku zonke.
      date: Izingxenye zalo cishe zabhalwa kusukela ekhulwini le-10 kuya kwelesi-4 BC.
    Ecclesiastes:
      display_name: UmShumayeli
      author: Umbhali akaziwa; isikhulumi sibizwa ngokuthi “uQohelet,” futhi ngokwesiko sihlotshaniswa noSolomoni.
      audience: Ama-Israyeli abhekene nemingcele yokuhlakanipha, ingcebo nomzamo ngaphansi kwelanga.
      date: Cishe langekhulu lesi-5 kuya kwelesi-3 BC, ngokusekelwe olimini lwesiHebheru oluthonywe isi-Aramu.
