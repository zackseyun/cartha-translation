    Gospel of Philip:
      display_name: IVangeli likaFiliphu
      author: Umbhali akaziwa. Isihloko sivela embhalweni wokugcina wombhalo wesandla, kodwa lo msebenzi awusho ukuthi uFiliphu ungumbhali wawo. Okuwukuphela kwekhophi esekhona umbhalo wesiCoptic weNag Hammadi Codex II,3.
      audience: Umphakathi wamaKristu okuqala owawujwayelene nemfundiso yamasakramente enesimo esifana nesikaValentinus, ikakhulukazi ukubhapathizwa, ukugcotshwa, iSidlo seNkosi, ukuhlengwa, ukuvuka kwabafileyo, nemifanekiso yegumbi lomshado.
      date: Ngokuvamile kuthiwa wabhalwa ngasekupheleni kwekhulu lesi-2 noma ekuqaleni kwekhulu lesi-3 AD; walondolozwa embhalweni wesandla wesiCoptic wangekhulu lesi-4, owahunyushwa ususelwa ohlotsheni lwesiGreki lwangaphambili.
