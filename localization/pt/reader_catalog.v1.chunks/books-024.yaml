payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Hipóstase dos Arcontes
      author: Anônimo. O autor interpreta Gênesis por meio de um mito revelatório sobre os arcontes; a obra não pode ser atribuída com segurança a um mestre conhecido pelo nome.
      audience: Cristãos de um meio setiano ou relacionado, que liam Gênesis como um conflito entre governantes cósmicos ignorantes, a sabedoria divina e a origem espiritual da humanidade.
      date: Geralmente situada no século III d.C.; preservada em uma cópia copta do século IV no Códice II de Nag Hammadi.
    On the Origin of the World:
      display_name: Sobre a Origem do Mundo
      author: Anônimo. A obra combina e reelabora diversas tradições judaicas, cristãs, platônicas e mitológicas, sem identificar quem a compilou.
      audience: Leitores de um ambiente cristão de tendência gnóstica que buscavam uma história alternativa da criação, dos governantes cósmicos, de Sofia, de Adão e Eva e do destino final do mundo.
      date: Geralmente datada do século III d.C., embora possa se basear em materiais anteriores; preservada principalmente em testemunhos coptas do século IV.
    Sophia of Jesus Christ:
      display_name: Sabedoria de Jesus Cristo
      author: Anônimo. O autor adapta um material também conhecido por meio de Eugnostos, transformando-o em um diálogo entre Jesus e seus discípulos após a ressurreição.
      audience: Cristãos interessados na sabedoria revelada acerca do Deus transcendente, da organização do mundo celestial e da origem e salvação da alma.
      date: Frequentemente datada do final do século II ou do século III d.C.; preservada em cópias coptas de Nag Hammadi e do Códice de Berlim.
    Gospel of the Egyptians:
      display_name: Evangelho dos Egípcios
      author: Anônimo. Esta obra de Nag Hammadi, também chamada Livro Sagrado do Grande Espírito Invisível, é distinta do Evangelho dos Egípcios grego mais antigo, conhecido apenas por meio de citações.
      audience: Uma comunidade cristã setiana que recorria a mitos densos, nomes sagrados, imagens batismais e louvor em forma de hino para expressar sua identidade espiritual e libertação.
      date: Geralmente atribuído ao século II ou III d.C.; duas cópias coptas sobreviveram em códices de Nag Hammadi do século IV.
    Letter of Peter to Philip:
      display_name: Carta de Pedro a Filipe
      author: Anônimo. A breve carta inicial e a revelação que vem em seguida são atribuídas de forma pseudônima a Pedro e Filipe, e não podem ser consideradas com segurança obra de nenhum dos dois apóstolos.
      audience: Cristãos que buscavam respaldo apostólico para ensinamentos sobre o Salvador, os poderes hostis, o sofrimento, a missão e a restauração dos discípulos.
      date: Geralmente datada do final do século II ou do início do século III d.C.; preservada em uma cópia de Nag Hammadi do século IV e em um testemunho copta posterior.
    Gospel of Judas:
      display_name: Evangelho de Judas
      author: Anônimo. O título atribui a narrativa a Judas, mas a obra não confirma Judas Iscariotes como seu autor histórico.
      audience: Um grupo cristão crítico de práticas sacrificiais e eclesiais de outros grupos, que recorria ao diálogo revelatório e a uma cosmologia de tipo setiano para reinterpretar Judas e a morte de Jesus.
      date: Geralmente datado de meados ou do final do século II d.C.; Irineu conhecia um Evangelho de Judas por volta de 180, e a cópia copta sobrevivente provavelmente é do século III ou IV.
    Protoevangelium of James:
      display_name: Protoevangelho de Tiago
      author: Anônimo. O narrador afirma ser Tiago, mas a obra é pseudônima e não foi escrita por Tiago, irmão de Jesus.
      audience: Cristãos interessados no nascimento e na educação de Maria, em sua pureza perpétua, no nascimento de Jesus e em respostas narrativas para questões deixadas em aberto por Mateus e Lucas.
      date: Geralmente datado da segunda metade do século II d.C.; sobrevive em numerosos manuscritos gregos posteriores e em traduções antigas.
