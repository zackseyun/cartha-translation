payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Hipóstase dos Arcontes
      author: Anônimo. O autor interpreta Gênesis por meio de um mito revelatório sobre os arcontes; a obra não pode ser atribuída com segurança a um mestre específico.
      audience: Cristãos de um meio setiano ou relacionado, que liam Gênesis como um conflito entre governantes cósmicos ignorantes, a sabedoria divina e a origem espiritual da humanidade.
      date: Comumente situada no século III d.C.; preservada em uma cópia copta do século IV no Códice II de Nag Hammadi.
    On the Origin of the World:
      display_name: Sobre a Origem do Mundo
      author: Anônimo. A obra combina e reelabora diversas tradições judaicas, cristãs, platônicas e mitológicas, sem identificar seu compilador.
      audience: Leitores de um ambiente cristão de tendências gnósticas que buscavam uma história alternativa da criação, dos governantes cósmicos, de Sofia, de Adão e Eva e do destino final do mundo.
      date: Geralmente datada do século III d.C., embora possa se basear em materiais anteriores; preservada principalmente em testemunhos coptas do século IV.
    Sophia of Jesus Christ:
      display_name: Sabedoria de Jesus Cristo
      author: Anônimo. O autor adapta material também conhecido de Eugnosto, transformando-o em um diálogo após a ressurreição entre Jesus e seus discípulos.
      audience: Cristãos interessados na sabedoria revelada sobre o Deus transcendente, a organização do mundo celestial e a origem e salvação da alma.
      date: Frequentemente datada do fim do século II ou do século III d.C.; preservada em cópias coptas de Nag Hammadi e do Códice de Berlim.
    Gospel of the Egyptians:
      display_name: Evangelho dos Egípcios
      author: Anônimo. Esta obra de Nag Hammadi, também chamada Livro Sagrado do Grande Espírito Invisível, é distinta do Evangelho dos Egípcios grego mais antigo, conhecido apenas por citações.
      audience: Uma comunidade cristã setiana que empregava mitos complexos, nomes sagrados, imagens batismais e louvor em forma de hino para expressar sua identidade espiritual e libertação.
      date: Geralmente atribuído ao século II ou III d.C.; duas cópias coptas sobreviveram em códices de Nag Hammadi do século IV.
    Letter of Peter to Philip:
      display_name: Carta de Pedro a Filipe
      author: Anônimo. A breve carta inicial e a revelação que se segue são atribuídas de forma pseudônima a Pedro e Filipe, não tendo sido escritas com segurança por nenhum dos dois apóstolos.
      audience: Cristãos que buscavam autorização apostólica para ensinamentos sobre o Salvador, os poderes hostis, o sofrimento, a missão e a restauração dos discípulos.
      date: Comumente datada do fim do século II ou do início do século III d.C.; preservada em uma cópia de Nag Hammadi do século IV e em um testemunho copta posterior.
    Gospel of Judas:
      display_name: Evangelho de Judas
      author: Anônimo. O título atribui a narrativa a Judas, mas a obra não estabelece Judas Iscariotes como seu autor histórico.
      audience: Um grupo cristão crítico de práticas sacrificiais e eclesiais rivais, que usava o diálogo revelatório e uma cosmologia de tipo setiano para reinterpretar Judas e a morte de Jesus.
      date: Geralmente datado de meados ou do fim do século II d.C.; Irineu conhecia um Evangelho de Judas por volta de 180, e a cópia copta sobrevivente é provavelmente do século III ou IV.
    Protoevangelium of James:
      display_name: Protoevangelho de Tiago
      author: Anônimo. O narrador afirma ser Tiago, mas a obra é pseudônima e não foi escrita por Tiago, irmão de Jesus.
      audience: Cristãos interessados no nascimento e na criação de Maria, em sua pureza perpétua, na natividade de Jesus e em respostas narrativas a questões deixadas em aberto por Mateus e Lucas.
      date: Geralmente datado da segunda metade do século II d.C.; sobrevive em numerosos manuscritos gregos posteriores e em traduções antigas.
