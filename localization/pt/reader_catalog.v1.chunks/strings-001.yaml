review:
  verdict: revise
  review_summary: Revisão concluída com correções de fidelidade e fluência, incluindo a ordem do nome da marca, rótulos de correspondência de busca, o singular de “Best”, notas de rodapé em linha e a descrição dos manuscritos.
  issues:
  - A composição localizada do nome da marca tinha ordem gramatical inadequada entre brandAccent e brandTail.
  - searchMatchSingular/searchMatchPlural traduziam “match” como “resultado”, e spotlightBest usava plural para um rótulo singular.
  - inlineFootnotesTitle não preservava o sentido de “inline”.
  - introQuote qualificava os manuscritos como “originais”, uma afirmação histórica não presente de forma inequívoca no texto canônico.
