review:
  verdict: revise
  review_summary: Revisão concluída. O catálogo está completo e fiel no geral; foram feitos pequenos ajustes de precisão e fluência em títulos de 1 Pedro, Apocalipse e Tobias.
  issues:
  - '1 Peter 3: plurais ajustados para refletir melhor “Wives ... with Lives”.'
  - '1 Peter 5: formulação ajustada para preservar a ideia de cuidado pelo exemplo e fé.'
  - 'Revelation 10: título ajustado para refletir “Final Time” sem introduzir a formulação interpretativa “não haverá mais demora”.'
  - 'Tobit 9: formulação ajustada para indicar o retorno do dinheiro a Tobit.'
