payload:
  book_metadata:
    James:
      display_name: Tiago
      author: Tradicionalmente, Tiago, irmão de Jesus; os estudiosos modernos se dividem entre a atribuição autêntica e a pseudônima.
      audience: Comunidades judaico-cristãs da diáspora.
      date: c. décadas de 50–60 d.C., se a autoria for autêntica; c. fim do século I d.C., se for pseudônima.
    1 Peter:
      display_name: 1 Pedro
      author: Tradicionalmente, o apóstolo Pedro, tendo Silvano como escriba; alguns estudiosos consideram a obra pseudônima.
      audience: Cristãos na Ásia Menor romana que enfrentavam hostilidade social.
      date: c. década de 60 d.C., se a autoria for de Pedro; c. décadas de 70–90 d.C., se for pseudônima.
    2 Peter:
      display_name: 2 Pedro
      author: Tradicionalmente, Pedro; muitos estudiosos modernos consideram a obra pseudônima.
      audience: Cristãos que enfrentavam zombadores que negavam a parúsia.
      date: c. início do século II d.C.
    1 John:
      display_name: 1 João
      author: Anônimo; tradicionalmente, o apóstolo João ou o ancião joanino.
      audience: Comunidade joanina após uma divisão, procurando definir quem pertence a ela.
      date: c. 90–110 d.C.
    2 John:
      display_name: 2 João
      author: “O ancião”.
      audience: Uma comunidade cristã específica (“a senhora eleita”), advertida contra falsos mestres.
      date: c. 90–110 d.C.
    3 John:
      display_name: 3 João
      author: “O ancião”.
      audience: Gaio, um líder que hospedava missionários itinerantes.
      date: c. 90–110 d.C.
    Jude:
      display_name: Judas
      author: Tradicionalmente, Judas, irmão de Tiago e de Jesus.
      audience: Comunidades cristãs nas quais se infiltravam mestres libertinos.
      date: c. décadas de 60–90 d.C.
    Revelation:
      display_name: Apocalipse
      author: João de Patmos (com estilo distinto do Quarto Evangelho).
      audience: Sete comunidades cristãs na Ásia Menor romana sob pressão imperial.
      date: c. década de 90 d.C., tradicionalmente durante o reinado de Domiciano.
    Tobit:
      display_name: Tobit
      author: Anônimo.
      audience: Judeus da diáspora que procuravam viver com piedade e compreender o casamento e a providência sob domínio estrangeiro.
      date: c. 225–175 a.C.; composto em aramaico, com uma versão hebraica também atestada em Qumran.
    Judith:
      display_name: Judite
      author: Anônimo.
      audience: Judeus sob ameaça estrangeira — uma história desafiadora de resistência piedosa.
      date: c. 150–100 a.C.
    Greek Additions to Esther:
      display_name: Acréscimos gregos a Ester
      author: Anônimo; material suplementar acrescentado na tradução grega de Ester.
      audience: Judeus de língua grega que desejavam uma narrativa de Ester com orações e referências explícitas a Deus.
      date: c. séculos II–I a.C.
    Wisdom of Solomon:
      display_name: Sabedoria de Salomão
      author: Anônimo; atribuído pseudonimamente a Salomão. Composto em grego por um autor judeu helenístico, provavelmente em Alexandria.
      audience: Judeus helenísticos em diálogo com a filosofia grega, defendendo a sabedoria de Israel diante de alternativas pagãs e apóstatas.
      date: c. 50 a.C.–50 d.C.
