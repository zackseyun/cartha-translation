      display_name: Lamentações
      author: Anônimo; a tradição o atribui a Jeremias.
      audience: Judeanos que lamentavam a destruição de Jerusalém em 586 a.C.
      date: Pouco depois de 586 a.C.
    Ezekiel:
      display_name: Ezequiel
      author: Ezequiel, sacerdote exilado na Babilônia; com desenvolvimento editorial.
      audience: Exilados judeanos na Babilônia, repensando a presença de Deus longe do templo.
      date: c. 593–571 a.C. para o ministério do profeta; a forma final é um pouco posterior.
    Daniel:
      display_name: Daniel
      author: Anônimo; apresenta-se como obra de Daniel, do período do exílio.
      audience: Judeus sob perseguição helenística — especialmente durante o governo de Antíoco IV Epifânio (167–164 a.C.).
      date: Alcançou a forma recebida c. 165 a.C.; os capítulos 1–6 incorporam relatos de corte mais antigos.
    Hosea:
      display_name: Oseias
      author: Oseias, filho de Beeri.
      audience: O reino do norte, Israel, em suas últimas décadas antes da conquista assíria.
      date: c. 750–722 a.C.
