review:
  verdict: revise
  review_summary: Tradução revista e completa; foram corrigidas pequenas imprecisões de sentido em alguns títulos.
  issues:
  - 'Sirach 9: «cobiça» foi ajustado para «luxúria», correspondente a “lust”.'
  - 'Sirach 13: «fica sujo» foi ajustado para preservar a ideia de ficar pegajoso.'
  - 'Sirach 39: o sujeito foi ajustado para «Sirac», em vez do nome do livro.'
  - 'Baruch 5: o título foi ajustado da forma imperativa para a declaração do original.'
  - '1 Maccabees 13: «conquista» foi ajustado para refletir “crushes”.'
