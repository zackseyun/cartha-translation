review:
  verdict: revise
  review_summary: 'Revisão concluída com correções pontuais de fidelidade: «epitomizer» foi traduzido como «epitomista», Baruc 5 preserva a formulação declarativa da fonte, e alguns títulos foram ajustados para refletir com maior precisão o original. Todos os campos e chaves foram mantidos.'
  issues:
  - '2 Macabeus — autor: «compilador» foi corrigido para «epitomista», pois a fonte descreve quem fez um epítome/resumo de uma obra maior.'
  - 'Baruc 5: o imperativo introduzido no rascunho foi corrigido para uma descrição fiel ao título-fonte.'
  - 'Eclesiástico 47: a relação de confronto com Natã foi ajustada para preservar o sentido da fonte.'
