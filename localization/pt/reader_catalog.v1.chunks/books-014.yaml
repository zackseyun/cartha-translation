    Sirach:
      display_name: Eclesiástico
      author: Yeshua ben Eleazar ben Sira, de Jerusalém; tradução grega feita por seu neto.
      audience: Jovens judeus que recebiam formação em sabedoria na Jerusalém do período helenístico.
      date: Original hebraico, c. 195–175 a.C.; tradução grega, c. 132 a.C.
    Baruch:
      display_name: Baruc
      author: Anônimo; atribuído de modo pseudônimo a Baruc, escriba de Jeremias.
      audience: Judeus da diáspora refletindo sobre o exílio, o arrependimento e a sabedoria.
      date: c. século II a.C.
    1 Maccabees:
      display_name: 1 Macabeus
      author: Anônimo, provavelmente um autor de Jerusalém que escreveu em hebraico (somente o texto grego sobreviveu).
      audience: Judeus durante e depois da revolta dos Hasmoneus, apresentando a legitimidade da dinastia hasmoneia.
      date: c. 100 a.C.
    2 Maccabees:
      display_name: 2 Macabeus
      author: Um autor anônimo que resumiu uma obra mais extensa de Jasão de Cirene; composto em grego.
      audience: Judeus da diáspora de língua grega — com ênfase no martírio, na providência e na ressurreição.
      date: c. 124 a.C. ou pouco depois.
