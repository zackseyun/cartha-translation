    Sirach:
      display_name: Eclesiástico
      author: Yeshua ben Eleazar ben Sira, de Jerusalém; tradução grega feita por seu neto.
      audience: Jovens judeus que recebiam formação em sabedoria na Jerusalém do período helenístico.
      date: Original hebraico de c. 195–175 a.C.; tradução grega de c. 132 a.C.
    Baruch:
      display_name: Baruc
      author: Autor anônimo; obra atribuída sob pseudônimo a Baruc, escriba de Jeremias.
      audience: Judeus da diáspora que refletiam sobre o exílio, o arrependimento e a sabedoria.
      date: c. século II a.C.
    1 Maccabees:
      display_name: 1 Macabeus
      author: Autor anônimo, provavelmente de Jerusalém, que escreveu em hebraico (somente o texto grego sobreviveu).
      audience: Judeus durante e após a revolta dos Macabeus; a obra narra a legitimidade da dinastia dos Hasmoneus.
      date: c. 100 a.C.
    2 Maccabees:
      display_name: 2 Macabeus
      author: Um epitomista anônimo de uma obra mais extensa de Jasão de Cirene; composta em grego.
      audience: Judeus da diáspora de língua grega — com ênfase no martírio, na providência e na ressurreição.
      date: c. 124 a.C. ou pouco depois.
