review:
  verdict: revise
  review_summary: Correção completa aplicada. Ajustei a concordância no resumo de João e alguns títulos para preservar com maior precisão o sentido do original, sem acréscimos interpretativos.
  issues:
  - 'Resumo de João: a forma verbal precisava concordar com Jesus, sujeito da frase.'
  - 'João 11: o título omitia a referência à morte.'
  - 'Atos 16: o rascunho acrescentava «as portas»; o original diz apenas que a adoração abre a prisão.'
  - 'Marcos 15: reformulado para evitar uma construção portuguesa pouco natural, mantendo a ideia de que Jesus é crucificado e sepultado.'
