review:
  verdict: revise
  review_summary: Revisão concluída. O conteúdo está completo e, em geral, fiel; corrigi títulos que alteravam o sentido de “laboring” e “forbearing”.
  issues:
  - 'Gospel of Thomas 57: “trabalha arduamente” deslocava o foco de pessoa que labuta para intensidade do trabalho.'
  - 'Gospel of Thomas 79: “gerar a verdade” não traduz “forbearing truth”; corrigido para suportar a verdade.'
