      audience: Israel em trânsito entre o Egito e a terra prometida — a geração do deserto e leitores posteriores que aprenderiam com seus fracassos.
      date: Camadas de composição que vão do fim do período monárquico ao período pós-exílico (c. séculos VII–V a.C.).
    Deuteronomy:
      display_name: Deuteronômio
      author: Anônimo; apresentado como os discursos de despedida de Moisés. A pesquisa moderna situa um núcleo na reforma do fim do século VII a.C., durante o reinado de Josias.
      audience: Israel se preparando para entrar na terra — e, mais tarde, exilados que se perguntavam como viver fielmente sem templo nem rei.
      date: Núcleo de cerca do fim do século VII a.C.; chegou à forma final no período exílico.
