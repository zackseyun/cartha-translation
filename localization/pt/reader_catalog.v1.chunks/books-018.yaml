  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Anônimo, com uma moldura editada por cristãos em torno de um núcleo originalmente judaico (4 Esdras, capítulos 3–14).
      audience: Judeus após 70 d.C., lutando com o problema da justiça de Deus diante do mal; mais tarde ampliado para leitores cristãos.
      date: Núcleo judaico c. 100 d.C.; acréscimos cristãos c. séculos II–III d.C.
    Didache:
      display_name: Didaquê
      author: Anônimo (o título significa "Ensino dos Doze Apóstolos").
      audience: Comunidades cristãs primitivas — um breve manual sobre ética, batismo, eucaristia e mestres itinerantes.
      date: C. final do século I – início do século II d.C.
    Gospel of Thomas:
      display_name: Evangelho de Tomé
      author: Anônimo; o início atribui a coletânea de ditos a "Dídimo Judas Tomé". O texto completo sobrevive apenas numa tradução copta do século IV de Nag Hammadi (NHC II,2), com três fragmentos gregos de Oxirrinco.
      audience: Leitores cristãos moldados pela sabedoria síria e pelo pensamento protognóstico, voltados ao autoconhecimento esotérico nos ditos de Jesus.
      date: Original grego provavelmente c. 50–140 d.C.; manuscrito copta c. 340 d.C.
      summary: O Evangelho de Tomé é uma coletânea de ditos atribuídos a Jesus. Não apresenta uma narrativa contínua e chama repetidamente os leitores a descobrir o significado dos ditos.
