review:
  verdict: revise
  review_summary: Revisão concluída. O rascunho está completo e majoritariamente fiel; foram ajustadas formulações para reproduzir com maior precisão os títulos-fonte, sem acrescentar conteúdo interpretativo.
  issues:
  - '2 Esdras 14: o rascunho acrescentava a ideia de que as palavras deveriam ser «proclamadas»; o original diz apenas que o Senhor ordena que palavras fiéis sejam ditas.'
  - 'Gospel of Thomas 8: «o maior» perdia a referência implícita ao peixe e alterava «large»; foi explicitado de forma natural em português.'
  - 'Gospel of Thomas 11: a formulação foi ajustada para refletir «passing» como «passagem».'
  - 'Gospel of Thomas 13: foi removida a construção assertiva «é pecado», que excedia a forma elíptica do título-fonte.'
