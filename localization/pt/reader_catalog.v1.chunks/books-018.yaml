  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Anônimo, com uma moldura editada por cristãos em torno de um núcleo originalmente judaico (4 Esdras, capítulos 3–14).
      audience: Judeus após 70 d.C. às voltas com a questão da justiça de Deus diante do mal; posteriormente ampliado para leitores cristãos.
      date: Núcleo judaico de c. 100 d.C.; acréscimos cristãos de c. dos séculos II–III d.C.
    Didache:
      display_name: Didaquê
      author: Anônimo (o título significa "Ensinamento dos Doze Apóstolos").
      audience: Comunidades cristãs primitivas — um breve manual sobre ética, batismo, eucaristia e mestres itinerantes.
      date: C. do fim do século I ao início do século II d.C.
    Gospel of Thomas:
      display_name: Evangelho de Tomé
      author: Anônimo; o início atribui a coletânea de ditos a "Dídimo Judas Tomé". O texto completo sobrevive apenas em uma tradução copta do século IV encontrada em Nag Hammadi (NHC II,2), além de três fragmentos gregos de Oxirrinco.
      audience: Leitores cristãos influenciados pela sabedoria síria e pelo pensamento protognóstico, orientados para o autoconhecimento esotérico presente nos ditos de Jesus.
      date: Original grego provavelmente de c. 50–140 d.C.; manuscrito copta de c. 340 d.C.
      summary: O Evangelho de Tomé é uma coletânea de ditos atribuídos a Jesus. Não apresenta uma narrativa contínua e chama repetidamente os leitores a descobrir o significado desses ditos.
