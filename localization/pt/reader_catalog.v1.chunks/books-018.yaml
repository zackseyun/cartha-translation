  verdict: revise
  review_summary: Tradução revista e completada; foram corrigidas pequenas mudanças de sentido e uma afirmação histórica não presente no original.
  issues:
  - 'Gospel of Thomas/author: removida a alegação de que a tradução foi ''encontrada'' em Nag Hammadi; o original apenas a situa em Nag Hammadi.'
