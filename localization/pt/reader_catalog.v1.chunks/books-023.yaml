  book_metadata:
    Gospel of Mary:
      display_name: Evangelho de Maria
      author: Anônimo. A obra apresenta Maria como destinatária e intérprete da revelação de Jesus, mas não afirma que Maria tenha escrito o evangelho que chegou até nós.
      audience: Leitores cristãos dos primeiros tempos que lidavam com questões de revelação, ascensão espiritual, autoridade apostólica e legitimidade do ensino de Maria entre os discípulos de Jesus.
      date: Geralmente datado do século II d.C.; fragmentos gregos do século III chegaram até nós, e o principal testemunho copta está preservado no Códice de Berlim 8502, do século V.
    Treatise on the Resurrection:
      display_name: Tratado sobre a Ressurreição
      author: Anônimo. A obra é apresentada como a carta de um mestre a um discípulo chamado Regino; nem o mestre nem Regino podem ser identificados com segurança.
      audience: Cristãos que buscavam instrução sobre a ressurreição, especialmente leitores que ponderavam seus aspectos corporais e espirituais e a participação presente na vida da ressurreição.
      date: Geralmente situado no fim do século II d.C. (muitas vezes por volta de 170–200); preservado em uma cópia copta do século IV de uma obra grega anterior.
    Dialogue of the Savior:
      display_name: Diálogo do Salvador
      author: Anônimo. O diálogo apresenta ensinamentos revelatórios de Jesus em conversas com Judas, Mateus e Maria, mas não identifica quem o compilou.
      audience: Um círculo cristão dos primeiros tempos interessado em revelação particular, discipulado, autoconhecimento, oração e preparação ascética para a salvação.
      date: Comumente atribuído ao século II d.C., embora suas camadas de composição e sua data exata continuem em debate; preservado em um manuscrito copta do século IV.
    Exegesis on the Soul:
      display_name: Exegese sobre a Alma
      author: Anônimo. O autor é um pregador cristão que relê imagens bíblicas e da literatura grega como uma alegoria da queda, do arrependimento e da restauração da alma.
      audience: Cristãos familiarizados com as Escrituras e a exortação moral, chamados a abandonar os desejos desordenados, arrepender-se e reunir-se ao divino.
      date: Geralmente datada do fim do século II ou do início do século III d.C.; preservada em uma tradução copta do século IV feita a partir do grego.
    Book of Thomas the Contender:
      display_name: Livro de Tomé, o Contendor
      author: Anônimo. O título ao final associa a obra a Judas Tomé e menciona Matias como escriba, mas essas são atribuições literárias, e não afirmações verificáveis de autoria.
      audience: Cristãos de inclinação ascética, exortados a buscar o autoconhecimento, resistir às paixões corporais e compreender a instrução particular de Jesus a Tomé.
      date: Frequentemente datado do fim do século II ou do início do século III d.C., possivelmente em um contexto cristão sírio; preservado em um manuscrito copta do século IV.
    Tripartite Tractate:
      display_name: Tratado Tripartido
      author: Anônimo. O autor era um teólogo cristão valentiniano de elevada formação; não é possível identificá-lo com segurança com nenhum mestre conhecido pelo nome.
      audience: Uma comunidade cristã valentiniana que recebia instrução extensa sobre Deus, os éons, a criação, Cristo, a igreja, a salvação e a restauração final.
      date: Geralmente datado do século III d.C., embora alguns argumentos favoreçam a segunda metade desse século; preservado em copta no Códice Jung, do século IV.
    Apocryphon of John:
      display_name: Apócrifo de João
      author: Anônimo. A obra apresenta, sob atribuição pseudônima, uma revelação de Jesus ressuscitado a João, filho de Zebedeu, e chegou até nós em mais de uma recensão antiga.
      audience: Cristãos de uma tradição revelatória setiana, ou estreitamente relacionada a ela, que buscavam um relato do âmbito divino, da criação, da identidade humana e da libertação de governantes hostis.
      date: Uma forma antiga provavelmente circulava no século II d.C.; os testemunhos coptas que chegaram até nós, preservando recensões mais breves e mais extensas, datam dos séculos IV e V.
