  book_metadata:
    Polycarp to the Philippians:
      display_name: Policarpo aos Filipenses
      author: Policarpo, bispo de Esmirna. Alguns estudiosos entendem que o texto recebido reúne material enviado em mais de uma ocasião.
      audience: A comunidade cristã de Filipos, que solicitou as cartas de Inácio e recebeu orientações sobre fé, conduta, liderança, dinheiro e perseverança.
      date: Do início a meados do século II d.C.; pelo menos uma parte está estreitamente ligada à viagem de Inácio, enquanto as propostas de uma carta composta admitem que uma seção seja um pouco posterior.
    Martyrdom of Polycarp:
      display_name: Martírio de Policarpo
      author: Membros anônimos da igreja de Esmirna, escrevendo em nome da comunidade; as notas finais sobre a transmissão refletem cópias e circulação posteriores.
      audience: A igreja de Filomélio e a comunidade cristã mais ampla, às quais se oferece um relato da prisão, do julgamento, da morte e da perseverança exemplar de Policarpo.
      date: Escrito após a morte de Policarpo, geralmente situado em meados ou no fim do século II d.C.; tanto o ano exato do martírio quanto a forma final do documento são objeto de debate.
    Epistle to Diognetus:
      display_name: Epístola a Diogneto
      author: Anônimo. O autor se apresenta como discípulo ou aprendiz, mas nem ele nem o Diogneto a quem se dirige podem ser identificados com segurança.
      audience: Um não cristão instruído e interessado — e leitores como ele — que pergunta sobre o culto, a ética, a identidade social e o amor dos cristãos, bem como sobre a aparente novidade da fé.
      date: Frequentemente datada do fim do século II ou do início do século III d.C., embora as propostas variem muito; os dois últimos capítulos talvez provenham de outra obra.
    Fragments of Papias:
      display_name: Fragmentos de Pápias
      author: Pápias, bispo de Hierápolis, é o autor das perdidas Exposições dos Ditos do Senhor, em cinco livros; a coleção que sobrevive consiste em citações e relatos preservados por autores posteriores.
      audience: Cristãos dos primeiros tempos que buscavam ensinamentos recordados a respeito de Jesus e dos apóstolos, reunidos por meio de cadeias identificadas de testemunho oral e interpretação.
      date: A obra de Pápias costuma ser datada do início do século II d.C., muitas vezes por volta de 110–130; os fragmentos preservados aparecem em autores que escreveram a partir do século II.
