  book_metadata:
    Polycarp to the Philippians:
      display_name: Policarpo aos Filipenses
      author: Policarpo, bispo de Esmirna. Alguns estudiosos entendem que o texto recebido combina materiais enviados em mais de um momento.
      audience: A comunidade cristã de Filipos, que solicitou as cartas de Inácio e recebeu orientações sobre fé, conduta, liderança, dinheiro e perseverança.
      date: Do início a meados do século II d.C.; pelo menos uma parte está estreitamente ligada à viagem de Inácio, enquanto as propostas de uma carta composta admitem uma seção um pouco posterior.
    Martyrdom of Polycarp:
      display_name: Martírio de Policarpo
      author: Membros anônimos da igreja de Esmirna, escrevendo em nome da comunidade; as notas finais sobre a transmissão refletem cópias e circulação posteriores.
      audience: A igreja de Filomélio e a comunidade cristã mais ampla, às quais se oferece um relato da prisão, do julgamento e da morte de Policarpo, bem como de sua perseverança exemplar.
      date: Escrito após a morte de Policarpo, geralmente situado em meados ou no fim do século II d.C.; tanto o ano exato do martírio quanto a forma final do documento são objeto de debate.
    Epistle to Diognetus:
      display_name: Epístola a Diogneto
      author: Anônimo. O autor chama a si mesmo de discípulo ou aprendiz, mas nem ele nem o destinatário Diogneto podem ser identificados com segurança.
      audience: Um investigador não cristão instruído — e leitores semelhantes a ele — que pergunta sobre o culto, a ética, a identidade social e o amor dos cristãos, bem como sobre a aparente novidade da fé.
      date: Muitas vezes datada do fim do século II ou do início do século III d.C., embora as propostas variem muito; os dois capítulos finais podem provir de outra obra.
    Fragments of Papias:
      display_name: Fragmentos de Pápias
      author: Pápias, bispo de Hierápolis, autor da obra perdida em cinco livros, Exposições dos Ditos do Senhor; a coleção preservada consiste em citações e relatos conservados por autores posteriores.
      audience: Cristãos dos primeiros tempos que buscavam ensinamentos recordados sobre Jesus e os apóstolos, reunidos por meio de cadeias identificadas de testemunho oral e interpretação.
      date: A obra de Pápias costuma ser datada do início do século II d.C., frequentemente por volta de 110–130; os fragmentos preservados aparecem em autores que escreveram a partir do século II.
