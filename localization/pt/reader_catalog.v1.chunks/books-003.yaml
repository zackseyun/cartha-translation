      author: Anônimo; parte da História Deuteronomista.
      audience: Israel de uma época posterior, que contempla seu passado anterior à monarquia como um ciclo de apostasia e libertação que serve de advertência.
      date: Compilado por volta dos séculos VII–VI a.C.
    Ruth:
      display_name: Rute
