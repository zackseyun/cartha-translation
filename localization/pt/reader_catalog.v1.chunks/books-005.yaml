review:
  verdict: revise
  review_summary: Chunk complete and largely faithful. Corrected a few added or weakened nuances, including Esther's date, Esther 10, Psalm 1 and Psalm 3, and Job 4.
  issues:
  - Esther metadata date added an unwarranted "Provavelmente"; rendered the source's approximate dating neutrally.
  - Esther 10 added "justiça" beyond "wisely and well".
  - Psalm 1 weakened the explicit reference to a righteous life; Psalm 3 weakened "shield" to generic protection.
  - Job 4 added "o mal," which is not specified in the source title.
