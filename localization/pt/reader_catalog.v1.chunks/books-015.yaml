payload:
  book_metadata:
    1 Esdras:
      display_name: 1 Esdras
      author: Anônimo; uma recomposição grega que reorganiza 2 Crônicas 35–36, Esdras e Neemias 7–8.
      audience: Judeus do período helenístico que desejavam uma narrativa clara do retorno e da restauração.
      date: c. séculos II–I a.C.
    Prayer of Manasseh:
      display_name: Oração de Manassés
      author: Anônimo; atribuído de forma pseudônima ao rei Manassés.
      audience: Pessoas arrependidas que se identificavam com o arrependimento de Manassés — usada liturgicamente em algumas tradições.
      date: c. séculos II–I a.C.
    Psalm 151:
      display_name: Salmo 151
      author: Anônimo; atribuído de forma pseudônima a Davi. Uma forma hebraica é atestada em 11QPsa.
      audience: Comunidades da diáspora e de Qumran devotadas ao saltério de Davi.
      date: c. século II a.C. ou antes.
    3 Maccabees:
      display_name: 3 Macabeus
      author: Anônimo; composto em grego.
      audience: Judeus da diáspora egípcia que falavam grego — uma narrativa de libertação ambientada no reinado de Ptolomeu IV.
      date: c. século I a.C. ao século I d.C.
    4 Maccabees:
      display_name: 4 Macabeus
      author: Anônimo; um autor judeu de língua grega influenciado pela filosofia estoica.
      audience: Judeus helenísticos — um sermão filosófico sobre a razão dominar as paixões por meio da fidelidade.
      date: c. século I d.C.
    Bel and the Dragon:
      display_name: Bel e o Dragão
      author: Anônimo; um dos acréscimos gregos a Daniel.
      audience: Judeus de língua grega — uma polêmica satírica contra a idolatria.
      date: c. séculos II–I a.C.
    Letter of Jeremiah:
      display_name: Carta de Jeremias
      author: Anônimo; atribuída de forma pseudônima a Jeremias.
      audience: Judeus da diáspora tentados pela idolatria ao seu redor.
      date: c. séculos IV–II a.C.
    Prayer of Azariah and Song of the Three:
      display_name: Oração de Azarias e Cântico dos Três
      author: Anônimo; um dos acréscimos gregos a Daniel.
      audience: Judeus de língua grega — material litúrgico para Daniel 3.
      date: c. século II a.C.
    Susanna:
      display_name: Susana
      author: Anônimo; um dos acréscimos gregos a Daniel.
      audience: Judeus de língua grega — uma história em que a justiça prevalece e o falso testemunho é repreendido.
      date: c. séculos II–I a.C.
    1 Clement:
      display_name: 1 Clemente
      author: Anônimo, atribuído a Clemente de Roma.
      audience: A comunidade cristã de Corinto, envolvida em uma disputa de liderança.
      date: c. 96 d.C.
