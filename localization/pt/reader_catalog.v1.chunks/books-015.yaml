  verdict: revise
  review_summary: Revisão concluída com correções pontuais de fidelidade e precisão, sobretudo em alguns títulos que acrescentavam ou alteravam nuances do original.
  issues:
  - Corrigidos títulos que omitiam detalhes (3 Macabeus 5), acrescentavam desfecho não expresso (4 Macabeus 12) ou modificavam o sentido de termos como “endurance”, “eager” e “Master” (1 Clemente 5, 34 e 40).
  - Corrigida a concordância de “usada liturgicamente” na descrição da Oração de Manassés.
