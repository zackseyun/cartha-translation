      author: Múltiplos autores ao longo de séculos; os capítulos 1–39 têm suas raízes no Isaías de Jerusalém do século VIII a.C., enquanto 40–55 (o «Segundo Isaías») e 56–66 (o «Terceiro Isaías») respondem ao exílio e ao retorno.
