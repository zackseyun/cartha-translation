    Isaiah:
      display_name: Isaías
      author: Vários autores ao longo de séculos; os capítulos 1–39 têm suas raízes no Isaías de Jerusalém do século VIII, enquanto 40–55 (“Segundo Isaías”) e 56–66 (“Terceiro Isaías”) respondem ao exílio e ao retorno.
      audience: Judá sob a ameaça assíria, no exílio babilônico e na restauração pós-exílica — sucessivamente.
      date: Composto entre aproximadamente o fim do século VIII e o século V a.C.
    Jeremiah:
      display_name: Jeremias
      author: Jeremias de Anatote; com edição substancial de seu escriba Baruque e de mãos posteriores.
      audience: Judá às vésperas, durante e depois da conquista babilônica.
      date: Do fim do século VII ao início do século VI a.C.
