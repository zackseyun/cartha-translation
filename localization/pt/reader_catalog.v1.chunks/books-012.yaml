review:
  verdict: revise
  review_summary: Correção completa efetuada. O rascunho era amplamente fiel; foram ajustadas algumas formulações de títulos para preservar melhor o sentido do inglês, sem acrescentar informação.
  issues:
  - '1 Corinthians 3: reformulada a construção truncada para explicitar a relação com o templo.'
  - '2 Corinthians 10: corrigido o sentido de “pledged”, que não é meramente um apelo.'
  - 'Colossians 4: removida a referência acrescentada à igreja e preservados os elementos do título-fonte.'
