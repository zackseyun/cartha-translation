payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 Coríntios
      author: Paulo, com Sóstenes.
      audience: A comunidade cristã de Corinto, marcada por divisões.
      date: c. 53–55 d.C., escrita em Éfeso.
    2 Corinthians:
      display_name: 2 Coríntios
      author: Paulo, com Timóteo.
      audience: A comunidade de Corinto, após um conflito doloroso.
      date: c. 55–56 d.C.
    Galatians:
      display_name: Gálatas
      author: Paulo.
      audience: Comunidades cristãs da Galácia (Anatólia central) pressionadas a adotar a circuncisão e a observância da Torá.
      date: c. 48–55 d.C. (data debatida).
    Ephesians:
      display_name: Efésios
      author: Paulo, ou um discípulo próximo que escreveu em nome de Paulo (questão debatida).
      audience: Leitores cristãos da Ásia em geral; o nome do lugar, «Éfeso», não aparece nos manuscritos mais antigos.
      date: c. década de 60 d.C., se escrita por Paulo; c. décadas de 80–90 d.C., se pseudônima.
    Philippians:
      display_name: Filipenses
      author: Paulo, com Timóteo.
      audience: A comunidade cristã de Filipos, uma colônia romana na Macedônia.
      date: c. 60–62 d.C., escrita na prisão.
    Colossians:
      display_name: Colossenses
      author: Paulo, com Timóteo — ou um discípulo próximo que escreveu em nome de Paulo (questão debatida).
      audience: Os cristãos de Colossos, no vale do Lico, confrontados com um ensinamento sincrético.
      date: c. 60–62 d.C., se escrita por Paulo; mais tarde, se pseudônima.
    1 Thessalonians:
      display_name: 1 Tessalonicenses
      author: Paulo, com Silvano e Timóteo.
      audience: A jovem comunidade cristã de Tessalônica, que enfrentava perseguição.
      date: c. 50–51 d.C. — provavelmente a mais antiga carta paulina preservada.
    2 Thessalonians:
      display_name: 2 Tessalonicenses
      author: Paulo (autoria debatida; alguns estudiosos a consideram pseudônima).
      audience: A comunidade de Tessalônica, para tratar de confusões sobre os acontecimentos do fim.
      date: c. 51 d.C., se escrita por Paulo.
    1 Timothy:
      display_name: 1 Timóteo
      author: Paulo, ou um discípulo que escreveu em nome de Paulo (as Epístolas Pastorais são amplamente consideradas pseudônimas).
      audience: Timóteo, como representante de Paulo em Éfeso; um manual de orientação para a organização posterior da igreja.
      date: c. meados da década de 60 d.C., se escrita por Paulo; c. 90–110 d.C., se pseudônima.
    2 Timothy:
      display_name: 2 Timóteo
      author: Paulo, ou um discípulo que escreveu em nome de Paulo.
      audience: Timóteo — apresentada como a despedida de Paulo na prisão.
      date: c. meados da década de 60 d.C., se escrita por Paulo; c. 90–110 d.C., se pseudônima.
    Titus:
      display_name: Tito
      author: Paulo, ou um discípulo que escreveu em nome de Paulo.
      audience: Tito, como representante de Paulo em Creta.
      date: c. meados da década de 60 d.C., se escrita por Paulo; c. 90–110 d.C., se pseudônima.
    Philemon:
      display_name: Filemom
      author: Paulo, com Timóteo.
      audience: Filemom, um cristão proprietário de escravos, a respeito de Onésimo, seu escravo fugitivo.
      date: c. 60–62 d.C.
    Hebrews:
      display_name: Hebreus
      author: Anônimo. A tradição sugeriu Paulo, Apolo, Barnabé, Priscila e outros; nenhuma proposta reúne consenso.
      audience: Cristãos judeus de língua grega tentados a se afastar de sua confissão cristã e voltar atrás.
      date: c. 60–95 d.C.
