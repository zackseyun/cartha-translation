review:
  verdict: revise
  review_summary: Revisão concluída com correções de fidelidade em títulos que acrescentavam ou alteravam relações no texto-fonte.
  issues:
  - 'Testament of Reuben 7: «home» foi traduzido como «sua terra»; corrigido para «casa».'
  - 'Testament of Levi 6: a formulação foi ajustada para refletir diretamente «Slaughter''s Wrath».'
  - 'Testament of Judah 8: o rascunho acrescentava que Shua era pai da esposa; o original diz apenas que Judá se casa com Shua.'
  - 'Testament of Judah 11: o rascunho introduzia que Judá peca; o original se refere aos pecados da esposa.'
