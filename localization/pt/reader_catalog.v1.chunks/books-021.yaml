      author: Anônimo.
      audience: Leitores greco-egípcios interessados em sabedoria ou no gnosticismo; poema de autorrevelação marcado pelo gênero, na voz de uma figura divina feminina.
      date: Provavelmente entre os séculos I e II d.C.; preservado em Nag Hammadi (NHC VI,2).
