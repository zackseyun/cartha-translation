      display_name: Testamento de Rúben
      author: Anônimo; parte dos Testamentos dos Doze Patriarcas, apresentados como discursos de despedida dos filhos de Jacó em seu leito de morte.
      audience: Leitores judeus (e, mais tarde, cristãos) que aprendiam princípios éticos com as confissões dos patriarcas.
      date: Núcleo judaico pré-cristão, provavelmente do século II a.C.; camada editorial cristã, provavelmente dos séculos I–II d.C.
