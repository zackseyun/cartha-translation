review:
  verdict: revise
  review_summary: Correção completa efetuada. Foram ajustados alguns títulos para refletirem com maior precisão o sentido do inglês, sem acrescentar informação interpretativa.
  issues:
  - 'Protoevangelium of James 16: o rascunho alterava o sentido de "Joseph Releases Mary After Testing"; corrigido para indicar que José libera Maria após a prova.'
  - 'Acts of Paul and Thecla 11: o rascunho sugeria que a voz salva Tecla e o véu; corrigido para "o véu de Tecla", conforme o título-fonte.'
  - 'Gospel of Peter 9: removida a informação adicional de que a voz "se ouve"; o título-fonte apenas a situa ao amanhecer.'
  - 'Epistle of Barnabas metadata audience: ajustado o tempo verbal para preservar o enunciado descritivo da fonte.'
