  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Evangelho da Infância de Tomé
      author: Anônimo. Sua forma mais antiga que pode ser reconstituída não menciona autor; a atribuição a Tomé pertence aos títulos de manuscritos posteriores e à transmissão do texto.
      audience: Cristãos interessados na infância de Jesus e em como o poder divino, a disciplina, o aprendizado e o amadurecimento poderiam ser narrados antes do início dos relatos dos Evangelhos canônicos.
      date: Em geral, é situado no século II d.C., mas o texto sobrevive em várias recensões gregas consideravelmente diferentes e em traduções antigas.
    Acts of Paul and Thecla:
      display_name: Atos de Paulo e Tecla
      author: Anônimo. É um episódio da obra mais ampla Atos de Paulo; um relato antigo segundo o qual um presbítero compôs os Atos não permite identificar o autor com segurança.
      audience: Cristãos atraídos por histórias de pregação apostólica, celibato, batismo, perseverança semelhante à dos mártires e autoridade de uma mulher para ensinar e dar testemunho.
      date: Composto no século II d.C., provavelmente na segunda metade; circulou tanto como parte dos Atos de Paulo quanto como obra independente.
    Gospel of Peter:
      display_name: Evangelho de Pedro
      author: Anônimo. A narrativa preservada fala na voz de Pedro e foi transmitida sob seu nome, mas não é considerada obra do apóstolo histórico.
      audience: Cristãos dos primeiros tempos interessados em uma narrativa ampliada da paixão e da ressurreição, provavelmente em comunidades nas quais a autoridade de Pedro tinha especial importância.
      date: Geralmente datado do século II d.C.; o principal fragmento grego preservado provém de um manuscrito muito posterior encontrado em Akhmim.
    2 Clement:
      display_name: 2 Clemente
      author: Anônimo. Apesar do título tradicional, trata-se de uma antiga homilia cristã, e não de uma segunda carta de Clemente de Roma.
      audience: Uma assembleia cristã exortada ao arrependimento, à coerência moral, ao cuidado com os vulneráveis e à perseverança fiel na esperança da ressurreição e do juízo.
      date: Geralmente datado da primeira metade ou de meados do século II d.C. (aproximadamente 100–160); o lugar de composição é incerto.
    Epistle of Barnabas:
      display_name: Epístola de Barnabé
      author: Anônimo. A obra foi tradicionalmente associada a Barnabé, companheiro de Paulo, mas os estudiosos modernos não aceitam essa atribuição.
      audience: Cristãos gentios ensinados a reivindicar para si as Escrituras de Israel por meio de uma interpretação cristológica e alegórica, ao mesmo tempo que distinguem sua identidade de aliança das práticas judaicas.
      date: Comumente datada entre a destruição do templo de Jerusalém, em 70 d.C., e o início do século II, muitas vezes por volta de 80–130.
