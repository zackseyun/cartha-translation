review:
  verdict: revise
  review_summary: Revisão concluída. O conteúdo está completo e em geral fiel; corrigi títulos que introduziam informações não presentes na fonte ou que alteravam o sentido.
  issues:
  - 'Protoevangelium of James 16: a redação dizia que José e Maria foram absolvidos, em vez de indicar que José libera Maria após a prova.'
  - 'Acts of Paul and Thecla 11: a redação acrescentava que Tecla toma o véu; a fonte apenas menciona a voz celestial, Tecla e o véu.'
  - 'Infancy Gospel of Thomas 2: ''clears water'' foi traduzido de modo mais direto como ''limpa a água''.'
