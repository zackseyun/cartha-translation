    Letters of Ignatius:
      display_name: Cartas de Inácio
      author: Inácio, bispo de Antioquia, no caso das sete cartas da recensão média comumente aceita; as cartas inacianas posteriores, ampliadas e pseudônimas, não fazem parte desta coleção.
      audience: Comunidades cristãs de Éfeso, Magnésia, Trales, Roma, Filadélfia e Esmirna, além de Policarpo, às quais Inácio se dirigiu durante sua viagem rumo ao martírio.
      date: Geralmente datadas do início do século II d.C., comumente de cerca de 105–117, embora a cronologia exata da viagem de Inácio continue sendo debatida.
