review:
  verdict: revise
  review_summary: Revisão concluída com correções de fidelidade em títulos que alteravam ou imprecisavam o sentido do original, inclusive o nome próprio Burrhus.
  issues:
  - 'Título 14: removida a sugestão de que as tramas em si eram poderosas; o original se refere às tramas do poder de Satanás.'
  - 'Título 17: households traduzido como lares, em vez de famílias.'
  - 'Título 20: substituído o resumo interpretativo «triunfo» por formulação que preserva a ideia de derrubada por Cristo.'
  - 'Título 54: preservado o sentido de fim da jornada.'
  - 'Título 79: embodied traduzido como corporificado.'
  - 'Título 80: explicitado «feras selvagens».'
  - 'Título 88: corrigido o nome próprio Burrhus, que fora traduzido indevidamente como «Burro».'
