payload:
  book_metadata:
    Joel:
      display_name: Joel
      author: Joel, filho de Petuel.
      audience: Judá no período pós-exílico, reagindo a uma praga de gafanhotos como sinal do Dia do SENHOR.
      date: Provavelmente entre os séculos V e IV a.C.
    Amos:
      display_name: Amós
      author: Amós, de Tecoa, um pastor de Judá que pregou no norte.
      audience: O reino de Israel, ao norte, durante um período de prosperidade e injustiça sob Jeroboão II.
      date: Por volta de 760–750 a.C.
    Obadiah:
      display_name: Obadias
      author: Obadias.
      audience: Judá, depois de Edom ter traído Jerusalém — uma profecia sobre a queda de Edom.
      date: Pouco depois de 586 a.C.
    Jonah:
      display_name: Jonas
      author: Anônimo; o protagonista é Jonas, filho de Amitai.
      audience: Israel no período pós-exílico — uma crítica satírica ao isolamento étnico e uma afirmação da misericórdia de Deus para com os de fora.
      date: Provavelmente entre os séculos V e IV a.C.
    Micah:
      display_name: Miqueias
      author: Miqueias, de Moresete.
      audience: Judá no final do século VIII a.C., especialmente os pobres das áreas rurais, em oposição às elites urbanas.
      date: Por volta de 740–700 a.C.
    Nahum:
      display_name: Naum
      author: Naum, de Elcós.
      audience: Judá, celebrando a queda iminente de Nínive.
      date: Pouco antes de 612 a.C.
    Habakkuk:
      display_name: Habacuque
      author: Habacuque.
      audience: Judá diante da ascensão da Babilônia — um diálogo do profeta com Deus sobre a justiça.
      date: Por volta do final do século VII a.C.
    Zephaniah:
      display_name: Sofonias
      author: Sofonias, filho de Cusi.
      audience: Judá sob o governo de Josias, às vésperas de suas reformas.
      date: Por volta de 640–609 a.C.
    Haggai:
      display_name: Ageu
      author: Ageu.
      audience: Os que voltaram do exílio e reconstruíam o templo sob o governo de Dario.
      date: 520 a.C.
    Zechariah:
      display_name: Zacarias
      author: Zacarias, filho de Berequias; os capítulos 9–14 provavelmente são de um autor posterior.
      audience: Os que voltaram do exílio e reconstruíam o templo, bem como comunidades pós-exílicas posteriores.
      date: Capítulos 1–8, por volta de 520–518 a.C.; 9–14, talvez cerca de um século depois.
    Malachi:
      display_name: Malaquias
      author: Anônimo; “Malaquias” significa “meu mensageiro”.
      audience: Judá no período pós-exílico, tornando-se negligente no culto e na fidelidade sob o domínio persa.
      date: Por volta de meados do século V a.C.
    Matthew:
      display_name: Mateus
      author: Anônimo; a tradição atribui a obra ao apóstolo Mateus. A pesquisa moderna considera que o autor era um judeu cristão de língua grega que utilizou Marcos e uma fonte semelhante a Q.
      audience: Uma comunidade judaico-cristã que procurava compreender a continuidade e a descontinuidade em relação ao judaísmo das sinagogas.
      date: Por volta de 80–90 d.C.
    Mark:
      display_name: Marcos
      author: Anônimo; a tradição o associa a João Marcos, companheiro de viagem de Pedro.
      audience: Uma comunidade cristã de língua grega, possivelmente em Roma, sob ameaça de perseguição ou perto de enfrentá-la.
      date: Por volta de 65–75 d.C., na época da Guerra Judaica e da destruição do templo.
