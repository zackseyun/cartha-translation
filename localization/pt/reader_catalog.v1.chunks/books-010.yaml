payload:
  book_metadata:
    Joel:
      display_name: Joel
      author: Joel, filho de Petuel.
      audience: Judá no período pós-exílio, reagindo a uma praga de gafanhotos como sinal do Dia do SENHOR.
      date: Provavelmente entre os séculos V e IV a.C.
    Amos:
      display_name: Amós
      author: Amós, de Tecoa, um pastor de Judá que pregou no norte.
      audience: O reino do norte, Israel, durante um período de prosperidade e injustiça sob Jeroboão II.
      date: Cerca de 760–750 a.C.
    Obadiah:
      display_name: Obadias
      author: Obadias.
      audience: Judá, depois que Edom traiu Jerusalém — uma profecia sobre a queda de Edom.
      date: Pouco depois de 586 a.C.
    Jonah:
      display_name: Jonas
      author: Anônimo; o protagonista é Jonas, filho de Amitai.
      audience: Israel no período pós-exílio — uma repreensão satírica ao isolamento étnico e uma afirmação da misericórdia de Deus para com os estrangeiros.
      date: Provavelmente entre os séculos V e IV a.C.
    Micah:
      display_name: Miqueias
      author: Miqueias, de Moresete.
      audience: Judá no fim do século VIII a.C., especialmente os pobres das áreas rurais, em oposição às elites urbanas.
      date: Cerca de 740–700 a.C.
    Nahum:
      display_name: Naum
      author: Naum, de Elcós.
      audience: Judá, celebrando a queda iminente de Nínive.
      date: Pouco antes de 612 a.C.
    Habakkuk:
      display_name: Habacuque
      author: Habacuque.
      audience: Judá diante da ascensão da Babilônia — um diálogo do profeta com Deus sobre a justiça.
      date: Por volta do fim do século VII a.C.
    Zephaniah:
      display_name: Sofonias
      author: Sofonias, filho de Cuchi.
      audience: Judá sob o reinado de Josias, às vésperas de suas reformas.
      date: Cerca de 640–609 a.C.
    Haggai:
      display_name: Ageu
      author: Ageu.
      audience: Os que retornaram do exílio e reconstruíam o templo sob o governo de Dario.
      date: 520 a.C.
    Zechariah:
      display_name: Zacarias
      author: Zacarias, filho de Berequias; os capítulos 9–14 provavelmente foram escritos por outra pessoa, em época posterior.
      audience: Os que retornaram do exílio e reconstruíam o templo, bem como comunidades pós-exílicas posteriores.
      date: Capítulos 1–8, cerca de 520–518 a.C.; 9–14, talvez um século depois.
    Malachi:
      display_name: Malaquias
      author: Anônimo; “Malaquias” significa “meu mensageiro”.
      audience: Judá no período pós-exílio, tornando-se negligente no culto e na fidelidade sob o domínio persa.
      date: Por volta de meados do século V a.C.
    Matthew:
      display_name: Mateus
      author: Anônimo; a tradição o atribui ao apóstolo Mateus. A pesquisa moderna considera que o autor era um judeu cristão de língua grega que recorreu a Marcos e a uma fonte semelhante a Q.
      audience: Uma comunidade judaico-cristã que procurava entender a continuidade e a descontinuidade em relação ao judaísmo das sinagogas.
      date: Cerca de 80–90 d.C.
    Mark:
      display_name: Marcos
      author: Anônimo; a tradição o associa a João Marcos, companheiro de viagem de Pedro.
      audience: Uma comunidade cristã de língua grega, possivelmente em Roma, sob perseguição ou diante de sua ameaça.
      date: Cerca de 65–75 d.C., no período da Guerra Judaica e da destruição do templo.
