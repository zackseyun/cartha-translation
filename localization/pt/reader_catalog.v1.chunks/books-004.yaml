review:
  verdict: revise
  review_summary: Tradução completa revista e corrigida para maior fidelidade ao texto-fonte, sobretudo em títulos que atenuavam, substituíam ou omitiam elementos do original.
  issues:
  - '1 Reis 5: o rascunho dizia que Salomão prepara o templo; a fonte afirma que ele constrói o templo e alcança fama.'
  - '1 Reis 18: a fonte diz que Elias confronta Acabe e julga; o rascunho introduzia profetas.'
  - '2 Reis 24–25: Jehoiachin foi distinguido de Jehoiakim por meio da forma Jeoaquim.'
  - '1 Crônicas 16: foi preservada a referência à adoração no templo.'
  - '1 Crônicas 22: o título-fonte é elíptico; foi vertido de modo idiomático como Salomão escolhido para construir para Deus, sem inventar um objeto ausente.'
  - '1 Crônicas 29: a fonte atribui a dádiva às nações, não a uma formulação genérica.'
  - '2 Crônicas 16: Aram foi mantido em vez de substituí-lo por Síria.'
