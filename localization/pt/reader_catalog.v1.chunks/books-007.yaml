      author: Anônimo; o sobrescrito evoca Salomão.
      audience: Israel lendo o amor erótico como uma perspectiva sobre a intimidade da aliança — e, mais tarde, leitores judeus e cristãos interpretando-o alegoricamente.
      date: Provavelmente pós-exílico, entre os séculos V e III a.C.
