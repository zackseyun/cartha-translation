      author: Uma antologia; as inscrições introdutórias mencionam Salomão, Agur, Lemuel e «os sábios».
      audience: Jovens israelitas sendo formados na sabedoria para a vida cotidiana.
      date: Camadas de composição, c. séculos X–IV a.C.
    Ecclesiastes:
      display_name: Eclesiastes
      author: Anônimo; o orador é «Qohelet», tradicionalmente identificado com Salomão.
      audience: Israelitas confrontados com os limites da sabedoria, da riqueza e do esforço debaixo do sol.
      date: Provavelmente c. séculos V–III a.C., com base no hebraico influenciado pelo aramaico.
