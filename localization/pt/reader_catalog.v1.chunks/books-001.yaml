  review_summary: Revisão concluída com correções pontuais de fidelidade semântica e remoção de acréscimos não presentes no inglês.
  issues:
  - Gênesis 3 foi corrigido de «é expulsa do Éden» para «cai no Éden», que corresponde a «Falls from Eden».
  - Gênesis 13 foi ajustado para explicitar a oração, em vez de acrescentar o objeto «a Deus».
  - Gênesis 30 removeu a referência acrescentada a Deus, ausente do título-fonte.
  - Êxodo 7 deixou de acrescentar «o faraó», que não consta do título-fonte.
  - Êxodo 12 foi corrigido de «escapa da morte» para «passa pela morte», conforme o original.
