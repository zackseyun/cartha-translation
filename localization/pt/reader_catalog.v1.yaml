    author: Anônimo. O diálogo apresenta ensinamentos revelatórios nos lábios de Jesus em conversas com Judas, Mateus e Maria, mas não identifica seu compilador.
    audience: Um círculo cristão dos primeiros tempos interessado em revelação particular, discipulado, autoconhecimento, oração e preparação ascética para a salvação.
    date: Comumente atribuído ao século II d.C., embora suas camadas de composição e sua data exata continuem em debate; preservado em um manuscrito copta do século IV.
