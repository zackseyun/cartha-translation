  Treatise on the Resurrection:
    display_name: Tratado sobre a Ressurreição
    author: Anônimo. A obra é apresentada como a carta de um mestre a um discípulo chamado Regino; nem o mestre nem Regino podem ser identificados com segurança.
    audience: Cristãos que buscavam instrução sobre a ressurreição, especialmente leitores que ponderavam seus aspectos corporais e espirituais e a participação presente na vida da ressurreição.
    date: Geralmente situado no fim do século II d.C. (muitas vezes por volta de 170–200); preservado em uma cópia copta do século IV de uma obra grega anterior.
