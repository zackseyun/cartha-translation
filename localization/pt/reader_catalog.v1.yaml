  Polycarp to the Philippians:
    display_name: Policarpo aos Filipenses
    author: Policarpo, bispo de Esmirna. Alguns estudiosos entendem que o texto recebido combina materiais enviados em mais de um momento.
    audience: A comunidade cristã de Filipos, que solicitou as cartas de Inácio e recebeu orientações sobre fé, conduta, liderança, dinheiro e perseverança.
    date: Do início a meados do século II d.C.; pelo menos uma parte está estreitamente ligada à viagem de Inácio, enquanto as propostas de uma carta composta admitem uma seção um pouco posterior.
    chapters:
      '1':
