  Epistle to Diognetus:
    display_name: Epístola a Diogneto
    author: Anônimo. O autor se apresenta como discípulo ou aprendiz, mas nem ele nem o Diogneto a quem se dirige podem ser identificados com segurança.
    audience: Um não cristão instruído e interessado — e leitores como ele — que pergunta sobre o culto, a ética, a identidade social e o amor dos cristãos, bem como sobre a aparente novidade da fé.
    date: Frequentemente datada do fim do século II ou do início do século III d.C., embora as propostas variem muito; os dois últimos capítulos talvez provenham de outra obra.
    chapters:
      '1':
        title: Diogneto busca compreender a fé
      '2':
        title: Ídolos moldados por mãos humanas
      '3':
