      '5':
        title: O amor de Cristo impulsiona o ministério
      '6':
        title: Suportem o sofrimento por Deus
      '7':
        title: Busquem a santidade com reverência
      '8':
        title: A graça dos macedônios inspira generosidade
      '9':
        title: Contribuam com alegria para os santos
      '10':
        title: A mansidão de Cristo é afirmada
      '11':
        title: Zelo por uma vida fiel
      '12':
        title: Gloriem-se na fraqueza e na graça
      '13':
        title: Examinemos a nós mesmos quanto ao pecado
  Galatians:
    display_name: Gálatas
    author: Paulo.
    audience: Comunidades cristãs da Galácia (Anatólia central), pressionadas a adotar a circuncisão e a observância da Torá.
