  Sophia of Jesus Christ:
    display_name: Sabedoria de Jesus Cristo
    author: Anônimo. O autor adapta um material também conhecido por meio de Eugnostos, transformando-o em um diálogo entre Jesus e seus discípulos após a ressurreição.
    audience: Cristãos interessados na sabedoria revelada acerca do Deus transcendente, da organização do mundo celestial e da origem e salvação da alma.
