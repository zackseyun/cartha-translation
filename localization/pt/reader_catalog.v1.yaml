  Fragments of Papias:
    display_name: Fragmentos de Pápias
    author: Pápias, bispo de Hierápolis, é o autor das perdidas Exposições dos Ditos do Senhor, em cinco livros; a coleção que sobrevive consiste em citações e relatos preservados por autores posteriores.
    audience: Cristãos dos primeiros tempos que buscavam ensinamentos recordados a respeito de Jesus e dos apóstolos, reunidos por meio de cadeias identificadas de testemunho oral e interpretação.
    date: A obra de Pápias costuma ser datada do início do século II d.C., muitas vezes por volta de 110–130; os fragmentos preservados aparecem em autores que escreveram a partir do século II.
    chapters:
