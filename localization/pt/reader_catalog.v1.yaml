  Genesis:
    display_name: Gênesis
    author: Anônimo; tradicionalmente atribuído a Moisés. A pesquisa moderna considera que teve uma longa história de composição, com fontes posteriormente reunidas por edição.
    audience: Israel em sua identidade de povo da aliança, fundamentando a história de suas origens na criação, na eleição e na promessa de Deus.
    date: Composto ao longo de séculos; alcançou sua forma recebida por volta dos séculos VI–V a.C., durante ou depois do exílio babilônico.
    summary: Gênesis narra a criação, a rebelião e a dispersão da humanidade, e a história da família de Abraão, Isaque, Jacó e José, por meio da qual começam as promessas da aliança de Deus com Israel.
