    chapters:
      '1':
        title: Paulo pede que Timóteo permaneça
      '2':
        title: Orem pelos governantes e vivam em paz
      '3':
        title: As qualidades exigidas dos líderes da igreja
      '4':
        title: Rejeite falsos mestres e mitos
      '5':
        title: Honre fielmente as viúvas e os presbíteros
      '6':
        title: Paulo aconselha Timóteo sobre a riqueza
  2 Timothy:
    display_name: 2 Timóteo
    author: Paulo, ou um discípulo que escreveu em nome de Paulo.
    audience: Timóteo — apresentada como a despedida de Paulo na prisão.
    date: c. meados da década de 60 d.C., se escrita por Paulo; c. 90–110 d.C., se pseudônima.
    chapters:
      '1':
        title: Timóteo, permaneça firme na graça
      '2':
        title: Suporte o sofrimento por Cristo
      '3':
        title: Evite os falsos mestres e advirta outros
      '4':
        title: Pregue fielmente a todos
  Titus:
    display_name: Tito
    author: Paulo, ou um discípulo que escreveu em nome de Paulo.
    audience: Tito, como representante de Paulo em Creta.
    date: c. meados da década de 60 d.C., se escrita por Paulo; c. 90–110 d.C., se pseudônima.
