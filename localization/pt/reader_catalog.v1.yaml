  Genesis:
    display_name: Gênesis
    author: Anônimo; tradicionalmente atribuído a Moisés. A pesquisa acadêmica moderna considera que a obra teve uma longa história de composição, com fontes posteriormente reunidas e editadas.
    audience: Israel em sua identidade de povo da aliança, fundamentando a história das origens do povo na criação, na eleição e na promessa de Deus.
    date: Composto ao longo de séculos; alcançou a forma em que foi recebido por volta dos séculos VI–V a.C., durante ou depois do exílio babilônico.
    summary: Gênesis narra a criação, a rebelião e a dispersão da humanidade, bem como a história da família de Abraão, Isaque, Jacó e José, por meio da qual começam as promessas da aliança de Deus com Israel.
