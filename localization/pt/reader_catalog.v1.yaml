      '5':
        title: O amor de Cristo impulsiona o ministério
      '6':
        title: Suportem o sofrimento por Deus
      '7':
        title: Busquem a santidade com reverência
      '8':
        title: A graça dos macedônios inspira generosidade
      '9':
        title: Contribuam com alegria para os santos
      '10':
        title: A mansidão de Cristo afirmada
      '11':
        title: Zelo por uma vida fiel
      '12':
        title: Gloriar-se na fraqueza e na graça
      '13':
        title: Examinemos a nós mesmos quanto ao pecado
  Galatians:
    display_name: Gálatas
    author: Paulo.
    audience: Comunidades cristãs da Galácia (Anatólia central) pressionadas a adotar a circuncisão e a observância da Torá.
    date: c. 48–55 d.C. (data debatida).
    chapters:
      '1':
        title: Paulo defende seu evangelho
      '2':
        title: Paulo confronta o erro de Pedro
      '3':
        title: A fé de Abraão justifica
      '4':
        title: Cristo nos liberta da Lei
      '5':
        title: Vivam pela fé, não pela Lei
      '6':
        title: Levem as cargas uns dos outros
  Ephesians:
    display_name: Efésios
    author: Paulo, ou um discípulo próximo que escreveu em nome de Paulo (questão debatida).
    audience: Leitores cristãos da Ásia em geral; o nome do lugar, «Éfeso», não aparece nos manuscritos mais antigos.
    date: c. década de 60 d.C., se escrita por Paulo; c. décadas de 80–90 d.C., se pseudônima.
    chapters:
      '1':
        title: A graça de Deus sela os que creem
      '2':
        title: Cristo traz paz a todos
      '3':
        title: O mistério revelado por meio do evangelho
      '4':
        title: Oração pela unidade no corpo de Cristo
      '5':
        title: Imitem a Deus e vivam com sabedoria
      '6':
        title: Filhos, obedeçam e honrem seus pais
  Philippians:
    display_name: Filipenses
    author: Paulo, com Timóteo.
    audience: A comunidade cristã de Filipos, uma colônia romana na Macedônia.
    date: c. 60–62 d.C., escrita na prisão.
    chapters:
      '1':
        title: Paulo ora pelos filipenses
      '2':
        title: Jesus, humilde e exaltado
      '3':
        title: Alegrem-se por conhecer Cristo
      '4':
        title: Permaneçam firmes com alegria
  Colossians:
    display_name: Colossenses
    author: Paulo, com Timóteo — ou um discípulo próximo que escreveu em nome de Paulo (questão debatida).
    audience: Os cristãos de Colossos, no vale do Lico, confrontados com um ensinamento sincrético.
    date: c. 60–62 d.C., se escrita por Paulo; mais tarde, se pseudônima.
    chapters:
      '1':
        title: Paulo ora pela fé dos colossenses
      '2':
        title: Paulo encoraja os que creem em Cristo
      '3':
        title: Abandonem o pecado e vivam em amor
      '4':
        title: Paulo pede oração em suas prisões e encoraja a igreja
  1 Thessalonians:
    display_name: 1 Tessalonicenses
    author: Paulo, com Silvano e Timóteo.
    audience: A jovem comunidade cristã de Tessalônica, que enfrentava perseguição.
    date: c. 50–51 d.C. — provavelmente a mais antiga carta paulina preservada.
    chapters:
      '1':
        title: Graça, paz, fé, amor e esperança
      '2':
        title: Pregando com coragem e motivos puros
      '3':
        title: Timóteo os encoraja no sofrimento
      '4':
        title: Paulo incentiva uma vida santa
      '5':
        title: Permaneçam atentos enquanto aguardam a salvação
  2 Thessalonians:
    display_name: 2 Tessalonicenses
    author: Paulo (autoria debatida; alguns estudiosos a consideram pseudônima).
    audience: A comunidade de Tessalônica, para tratar de confusões sobre os acontecimentos do fim.
    date: c. 51 d.C., se escrita por Paulo.
