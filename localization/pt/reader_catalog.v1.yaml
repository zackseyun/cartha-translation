  Fragments of Papias:
    display_name: Fragmentos de Pápias
    author: Pápias, bispo de Hierápolis, autor da obra perdida em cinco livros, Exposições dos Ditos do Senhor; a coleção preservada consiste em citações e relatos conservados por autores posteriores.
    audience: Cristãos dos primeiros tempos que buscavam ensinamentos recordados sobre Jesus e os apóstolos, reunidos por meio de cadeias identificadas de testemunho oral e interpretação.
    date: A obra de Pápias costuma ser datada do início do século II d.C., frequentemente por volta de 110–130; os fragmentos preservados aparecem em autores que escreveram a partir do século II.
    chapters:
