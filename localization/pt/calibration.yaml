review:
  verdict: revise
  summary: A localização é, em geral, fiel e idiomática. Foram feitos pequenos ajustes de fluência no metadado de Gênesis, de precisão em Romanos 3:25 e de concordância/idiomaticidade em 1 Pedro 1:13. As notas preservam as alternativas e as explicações presentes no contexto-fonte, sem acrescentar doutrina interpretativa.
  issues:
  - 'Gênesis — campo de autoria: “fontes posteriormente reunidas por edição” é pouco idiomático; “fontes posteriormente reunidas e editadas” comunica melhor a história composicional indicada pela fonte.'
  - Romanos 3:25 — a alternativa da nota [c] deve manter explicitamente “justiça”, que é a alternativa fornecida no contexto-fonte; para evitar repetição, a tradução principal foi vertida como “retidão”.
  - 1 Pedro 1:13 — “preparem a mente” soa incompleto em português e não explicita o plural do original; “preparem a mente de vocês” é mais natural e fiel.
