book_localizations:
- source_title: Genesis
  title: Gênesis
  author: Anônimo; tradicionalmente atribuído a Moisés. A pesquisa moderna entende que o livro teve uma longa história de composição, com fontes posteriormente reunidas e editadas.
  audience: Israel em sua identidade de povo da aliança, fundamentando a história de suas origens na criação, na eleição e na promessa de Deus.
  date: Composto ao longo de séculos; chegou à sua forma final por volta dos séculos VI–V a.C., durante ou depois do exílio babilônico.
  summary: Gênesis relata a criação, a rebelião e a dispersão da humanidade, e a história da família de Abraão, Isaque, Jacó e José, por meio da qual começam as promessas da aliança de Deus com Israel.
- source_title: John
  title: João
  author: Anônimo; a tradição o atribui ao apóstolo João ou ao “Discípulo Amado”.
  audience: Uma comunidade cristã em tensão com o judaísmo das sinagogas, formada em torno do testemunho do Discípulo Amado.
  date: Por volta de 90–110 d.C.
  summary: João apresenta Jesus como a Palavra eterna que revela o Pai, dá vida por meio da confiança nele e é glorificada por seus sinais, sua morte e sua ressurreição.
- source_title: Gospel of Thomas
  title: Evangelho de Tomé
  author: Anônimo; o início atribui a coletânea de ditos a “Dídimo Judas Tomé”. O texto completo sobrevive apenas em uma tradução copta do século IV, encontrada em Nag Hammadi (NHC II,2), além de três fragmentos gregos de Oxirrinco.
  audience: Leitores cristãos influenciados pela tradição sapiencial síria e pelo pensamento protognóstico, voltados para o autoconhecimento esotérico nos ditos de Jesus.
  date: O original grego provavelmente data de cerca de 50–140 d.C.; o manuscrito copta, de cerca de 340 d.C.
  summary: O Evangelho de Tomé é uma coletânea de ditos atribuídos a Jesus. Não apresenta uma narrativa contínua e chama repetidamente os leitores a descobrir o significado desses ditos.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Gênesis 1:1
  text: Quando Deus começou a criar os céus e a terra[a]—
  translator_note: '[a] A tradução tradicional trata estas palavras como uma frase completa: “No princípio, Deus criou os céus e a terra.” O hebraico introduz mais naturalmente o que vem a seguir, tendo como ação principal “Deus disse”, no versículo 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Eclesiastes 1:2
  text: “Vapor dos vapores[a]”, diz Qohelet[b]. “Tudo é vapor—passageiro, impossível de reter e muitas vezes diferente do que esperamos.”
  translator_note: '[a] A palavra hebraica hevel significa literalmente “sopro” ou “vapor”. Em todo o livro de Eclesiastes, descreve aquilo que passa depressa, não pode ser retido nem plenamente compreendido e muitas vezes acaba sendo diferente do que as pessoas esperam. “Vapor” preserva essa imagem sem afirmar que nada tem sentido. Também são possíveis traduções como “sopro”, “mero sopro” e “fugaz”. [b] Qohelet é o nome ou título hebraico do autor. Muitas vezes é traduzido como “Mestre” ou “Pregador”, mas mantemos “Qohelet” para preservar todos os sentidos possíveis, sem favorecer uma interpretação.'
- source_path: nt/john/001/001.yaml
  reference: João 1:1
  text: No princípio[b], a Palavra já existia. A Palavra estava com Deus, e a Palavra era Deus.[a]
  translator_note: '[a] Ou: “a Palavra era divina”; ou: “o que Deus era, a Palavra era”. A formulação grega afirma que a Palavra é plenamente Deus, ao mesmo tempo que a distingue de Deus na oração anterior. [b] Esta abertura remete a Gênesis 1:1 e relaciona a Palavra ao princípio da criação. “Já existia” expressa o sentido do imperfeito grego: a Palavra existia quando o princípio chegou, em vez de passar a existir naquele momento. Também se pode traduzir simplesmente por “era” ou “existia”.'
- source_path: nt/romans/003/025.yaml
  reference: Romanos 3:25
  text: Deus o apresentou como sacrifício de expiação[a], por meio da fé em seu sangue[b]. Fez isso para demonstrar sua retidão[c], pois havia deixado impunes os pecados cometidos anteriormente.
  translator_note: '[a] Ou: “propiciação”; ou: “propiciatório”, a tampa de ouro da Arca da Aliança sobre a qual, no Antigo Testamento, era aspergido o sangue para expiação. [b] Ou: “por meio da fé, mediante o seu sangue”. [c] Ou: “justiça”.'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Pedro 1:13
  text: Portanto, preparem a mente de vocês para agir.[a] Mantenham plena lucidez e depositem toda a esperança na graça que lhes está sendo trazida quando Jesus, o Messias, for revelado.[b]
  translator_note: '[a] O grego diz literalmente: “cingindo os lombos da mente”. A imagem é a de prender à cintura uma roupa comprida, a fim de estar pronto para agir. [b] A palavra grega traduzida por “plena” e “toda” pode estar ligada à lucidez, ao ato de depositar a esperança ou, possivelmente, a ambos.'
