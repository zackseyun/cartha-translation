review:
  verdict: revise
  review_summary: पूर्ण नेपाली रूपान्तरण उपलब्ध छ। स्रोतसँग अझ नजिक बनाउन केही मेटाडाटा र शीर्षकको शब्दचयन सच्याइएको छ।
  issues:
