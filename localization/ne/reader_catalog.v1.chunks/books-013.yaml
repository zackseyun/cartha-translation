payload:
  book_metadata:
    James:
      display_name: याकूब
      author: परम्परागत रूपमा येशूका भाइ याकूब; आधुनिक विद्वानहरू यो साँच्चिकै उनकै रचना हो कि उनको नाममा लेखिएको हो भन्ने विषयमा विभाजित छन्।
      audience: प्रवासमा रहेका यहूदी-ख्रीष्टियन मण्डलीहरू।
      date: यदि साँच्चिकै उनकै रचना हो भने करिब ईस्वी ५०–६० को दशक; यदि उनको नाममा लेखिएको हो भने करिब ईस्वी पहिलो शताब्दीको उत्तरार्ध।
    1 Peter:
      display_name: १ पत्रुस
      author: परम्परागत रूपमा प्रेरित पत्रुस, सिलवानुस लेखनिकका रूपमा; केही विद्वानहरू यसलाई पत्रुसको नाममा लेखिएको मान्छन्।
      audience: सामाजिक वैमनस्य भोगिरहेका रोमी एसिया माइनरका ख्रीष्टियनहरू।
      date: यदि पत्रुसकै रचना हो भने करिब ईस्वी ६० को दशक; यदि उनको नाममा लेखिएको हो भने करिब ईस्वी ७०–९० को दशक।
    2 Peter:
      display_name: २ पत्रुस
      author: परम्परागत रूपमा पत्रुस; आधुनिक विद्वानहरूमाझ यसलाई पत्रुसको नाममा लेखिएको मान्यता व्यापक छ।
      audience: ख्रीष्टको पुनरागमनलाई अस्वीकार गर्ने गिल्ला गर्नेहरूको सामना गरिरहेका ख्रीष्टियनहरू।
      date: करिब ईस्वी दोस्रो शताब्दीको आरम्भ।
    1 John:
      display_name: १ यूहन्ना
      author: अज्ञात; परम्परागत रूपमा प्रेरित यूहन्ना वा यूहन्नेली एल्डर।
      audience: फुटपछि को समुदायमा पर्छ भन्ने कुरा परिभाषित गरिरहेको यूहन्नाको परम्परासँग सम्बन्धित समुदाय।
      date: करिब ईस्वी ९०–११०।
    2 John:
      display_name: २ यूहन्ना
      author: “एल्डर।”
      audience: झूटा शिक्षकहरूबाट सावधान गराइएको एउटा विशेष ख्रीष्टियन मण्डली (“चुनिएकी महिला”)।
      date: करिब ईस्वी ९०–११०।
    3 John:
      display_name: ३ यूहन्ना
      author: “एल्डर।”
      audience: यात्रा गर्ने प्रचारकहरूलाई आतिथ्य दिने एक अगुवा गायस।
      date: करिब ईस्वी ९०–११०।
    Jude:
      display_name: यहूदा
      author: परम्परागत रूपमा याकूब र येशूका भाइ यहूदा।
      audience: स्वेच्छाचारी जीवन सिकाउने शिक्षकहरू घुसिरहेका ख्रीष्टियन समुदायहरू।
      date: करिब ईस्वी ६०–९० को दशक।
    Revelation:
      display_name: प्रकाश
      author: पत्मोसका यूहन्ना (शैलीका दृष्टिले चौथो सुसमाचारभन्दा भिन्न)।
      audience: साम्राज्यको दबाबमा रहेका रोमी एसिया माइनरका सात ख्रीष्टियन मण्डलीहरू।
      date: करिब ईस्वी ९० को दशक; परम्परागत रूपमा डोमिशियनको शासनकालमा।
    Tobit:
      display_name: टोबित
      author: अज्ञात।
      audience: विदेशी शासनमा धर्मपरायणता, विवाह र ईश्वरीय प्रबन्धअनुसार जिउन खोजिरहेका प्रवासी यहूदीहरू।
      date: करिब ईसापूर्व २२५–१७५; अरामी भाषामा रचना गरिएको, र यसको हिब्रू संस्करण पनि कुमरानमा भेटिएको प्रमाण छ।
    Judith:
      display_name: यूदिथ
      author: अज्ञात।
      audience: विदेशी खतरामा परेका यहूदीहरू—धर्मपरायण प्रतिरोधको साहसी कथा।
      date: करिब ईसापूर्व १५०–१००।
    Greek Additions to Esther:
      display_name: एस्तरका ग्रीक थप अंशहरू
      author: अज्ञात; एस्तरको ग्रीक अनुवादमा थपिएको पूरक सामग्री।
      audience: स्पष्ट प्रार्थना र परमेश्वरको प्रत्यक्ष उल्लेख भएको एस्तरको कथा चाहने ग्रीकभाषी यहूदीहरू।
      date: करिब ईसापूर्व दोस्रो–पहिलो शताब्दी।
    Wisdom of Solomon:
      display_name: सोलोमनको बुद्धि
      author: अज्ञात; सोलोमनको नाममा छद्मनामपूर्वक आरोपित। सम्भवतः अलेक्जान्ड्रियामा एक हेलेनवादी यहूदी लेखकले ग्रीक भाषामा रचना गरेका हुन्।
      audience: ग्रीक दर्शनसँग संवाद गर्दै र गैरयहूदी तथा धर्मत्यागी विकल्पहरूको विरुद्ध इस्राएलको बुद्धिको प्रतिरक्षा गरिरहेका हेलेनवादी यहूदीहरू।
      date: करिब ईसापूर्व ५० देखि ईस्वी ५०।
