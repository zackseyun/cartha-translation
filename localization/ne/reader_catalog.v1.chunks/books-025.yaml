  book_metadata:
    Infancy Gospel of Thomas:
      display_name: थोमाको बाल्यकालीन सुसमाचार
      author: लेखक अज्ञात छन्। यसको पुनर्निर्माण गर्न सकिने सबैभन्दा पुरानो स्वरूपमा लेखकको नाम दिइएको छैन; थोमालाई लेखक मान्ने परम्परा पछिल्ला पाण्डुलिपिका शीर्षक र प्रसारणबाट आएको हो।
      audience: येशूको बाल्यकालबारे र प्रमाणित सुसमाचारका वृत्तान्तहरू सुरु हुनुअघि ईश्वरीय शक्ति, अनुशासन, सिकाइ र परिपक्वतालाई कसरी वर्णन गर्न सकिन्थ्यो भन्नेबारे जिज्ञासु ख्रीष्टियनहरू।
      date: सामान्यतया ईस्वी दोस्रो शताब्दीको मानिन्छ, तर यो पाठ एकअर्काबाट निकै फरक पर्ने धेरैवटा युनानी पाठरूप र प्रारम्भिक अनुवादहरूमा सुरक्षित छ।
    Acts of Paul and Thecla:
      display_name: पावल र थेक्लाका कार्यहरू
      author: लेखक अज्ञात छन्। यो पावलका कार्यहरू नामक बृहत् कृतिको एउटा प्रसङ्ग हो; कुनै प्रिस्बिटरले ती कार्यहरू रचेको भनी दिइएको प्राचीन विवरणबाट लेखकको निश्चित पहिचान गर्न सकिँदैन।
      audience: प्रेरितीय प्रचार, ब्रह्मचर्य, बप्तिस्मा, शहीदको जस्तो सहनशीलता, र सिकाउने तथा साक्षी दिने एक महिलाको अधिकारसम्बन्धी कथाहरूमा आकर्षित ख्रीष्टियनहरू।
      date: ईस्वी दोस्रो शताब्दीमा, सम्भवतः त्यसको उत्तरार्धमा रचना गरिएको; यो पावलका कार्यहरूभित्र र स्वतन्त्र कृतिका रूपमा दुवै किसिमले प्रचलित थियो।
    Gospel of Peter:
      display_name: पत्रुसको सुसमाचार
      author: लेखक अज्ञात छन्। सुरक्षित रहेको वृत्तान्त पत्रुसको स्वरमा बोल्छ र उनकै नाममा प्रसारित भएको थियो, तर यसलाई ऐतिहासिक प्रेरित पत्रुसको कृति मानिँदैन।
      audience: येशूको दुःखभोग र पुनरुत्थानको विस्तृत वृत्तान्तमा रुचि राख्ने प्रारम्भिक ख्रीष्टियनहरू, सम्भवतः पत्रुसको अधिकारलाई विशेष महत्त्व दिने समुदायहरूभित्र।
      date: सामान्यतया ईस्वी दोस्रो शताब्दीको मानिन्छ; सुरक्षित रहेको प्रमुख युनानी खण्ड धेरै पछिको पाण्डुलिपिबाट आएको हो, जुन अख्मिममा फेला परेको थियो।
    2 Clement:
      display_name: २ क्लेमेन्ट
      author: लेखक अज्ञात छन्। यसको परम्परागत शीर्षक जेसुकै भए पनि, यो रोमका क्लेमेन्टले लेखेको दोस्रो पत्र नभई एउटा प्रारम्भिक ख्रीष्टियन प्रवचन हो।
      audience: पश्चात्ताप, नैतिक एकरूपता, कमजोरहरूको हेरचाह, र पुनरुत्थान तथा न्यायको आशामा विश्वासयोग्य भई सहिरहन आह्वान गरिएको ख्रीष्टियन सभा।
      date: सामान्यतया ईस्वी दोस्रो शताब्दीको पूर्वार्ध वा मध्यतिरको (लगभग ई. १००–१६०) मानिन्छ; यसको रचनास्थल अनिश्चित छ।
    Epistle of Barnabas:
      display_name: बारनाबासको पत्र
      author: लेखक अज्ञात छन्। यस कृतिलाई परम्परागत रूपमा पावलका सहकर्मी बारनाबाससँग जोडिँदै आएको छ, तर आधुनिक विद्वत्ताले त्यो लेखकत्व स्वीकार गर्दैन।
      audience: ख्रीष्टसम्बन्धी र रूपकात्मक व्याख्याद्वारा इस्राएलका धर्मशास्त्रलाई आफ्ना रूपमा ग्रहण गर्न सिकाइँदै गरेका र आफ्नो करारगत पहिचानलाई यहूदी अभ्यासबाट अलग छुट्याइरहेका गैरयहूदी ख्रीष्टियनहरू।
      date: सामान्यतया ईस्वी ७० मा यरूशलेमको मन्दिर विनाश भएको समयदेखि दोस्रो शताब्दीको आरम्भसम्मको, प्रायः लगभग ई. ८०–१३० को मानिन्छ।
