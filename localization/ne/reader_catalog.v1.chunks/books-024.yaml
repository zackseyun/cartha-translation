payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: शासकहरूको वास्तविकता
      author: अज्ञात। लेखकले शासकहरूबारेको प्रकाशनात्मक मिथकमार्फत उत्पत्तिको व्याख्या गर्छन्; यस कृतिलाई निश्चित रूपमा कुनै नामित शिक्षकसँग जोड्न सकिँदैन।
      audience: अज्ञानी ब्रह्माण्डीय शासकहरू, ईश्वरीय प्रज्ञा र मानवताको आत्मिक उत्पत्तिबीचको द्वन्द्वका रूपमा उत्पत्ति पुस्तक पढ्ने सेथीय वा त्यससँग सम्बन्धित परिवेशका ख्रीष्टियनहरू।
      date: सामान्यतः ईस्वी तेस्रो शताब्दीको मानिन्छ; नाग हम्मादी संहिता २ मा रहेको चौथो शताब्दीको कप्टिक प्रतिलिपिमा संरक्षित छ।
    On the Origin of the World:
      display_name: संसारको उत्पत्तिबारे
      author: अज्ञात। यस कृतिले सङ्कलकको नाम नदिई विभिन्न यहूदी, ख्रीष्टियन, प्लेटोवादी र पौराणिक परम्पराहरूलाई संयोजन र परिमार्जन गर्छ।
      audience: सृष्टि, ब्रह्माण्डीय शासकहरू, सोफिया, आदम र हव्वा तथा संसारको अन्तिम नियतिबारे वैकल्पिक इतिहास खोज्ने ज्ञानवादी झुकाव भएको ख्रीष्टियन परिवेशका पाठकहरू।
      date: सामान्यतः ईस्वी तेस्रो शताब्दीको मानिन्छ, यद्यपि यसका आधारभूत सामग्री अझ पुराना हुन सक्छन्; मुख्यतः चौथो शताब्दीका कप्टिक साक्ष्यहरूमा संरक्षित छ।
    Sophia of Jesus Christ:
      display_name: येशू ख्रीष्टको प्रज्ञा
      author: अज्ञात। लेखकले युग्नोस्तोसमा पनि पाइने सामग्रीलाई पुनरुत्थानपछि येशू र उहाँका चेलाहरूबीच भएको संवादका रूपमा रूपान्तरण गरेका छन्।
      audience: परात्पर परमेश्वर, स्वर्गीय जगत्‌को व्यवस्था तथा आत्माको उत्पत्ति र मुक्तिबारे प्रकट गरिएको प्रज्ञामा रुचि राख्ने ख्रीष्टियनहरू।
      date: प्रायः ईस्वी दोस्रो शताब्दीको उत्तरार्ध वा तेस्रो शताब्दीको मानिन्छ; नाग हम्मादी र बर्लिन संहिताका कप्टिक प्रतिलिपिहरूमा संरक्षित छ।
    Gospel of the Egyptians:
      display_name: मिश्रीहरूको सुसमाचार
      author: अज्ञात। ‘महान् अदृश्य आत्माको पवित्र पुस्तक’ पनि भनिने नाग हम्मादीको यो कृति उद्धरणहरूबाट मात्र ज्ञात यसभन्दा पुरानो युनानी ‘मिश्रीहरूको सुसमाचार’ भन्दा भिन्न छ।
      audience: आत्मिक पहिचान र उद्धार व्यक्त गर्न गहन मिथक, पवित्र नाम, बप्तिस्मासम्बन्धी बिम्ब र स्तुतिमय प्रशंसा प्रयोग गर्ने सेथीय ख्रीष्टियन समुदाय।
      date: सामान्यतः ईस्वी दोस्रो वा तेस्रो शताब्दीको मानिन्छ; चौथो शताब्दीका नाग हम्मादी संहिताहरूमा यसका दुई कप्टिक प्रतिलिपि सुरक्षित छन्।
    Letter of Peter to Philip:
      display_name: पत्रुसले फिलिपलाई लेखेको पत्र
      author: अज्ञात। सुरुको छोटो पत्र र त्यसपछि आउने प्रकाशनलाई वास्तविक रूपमा यी दुई प्रेरितमध्ये कसैले लेखेको निश्चित नभई छद्मनामबाट पत्रुस र फिलिपसँग जोडिएको छ।
      audience: मुक्तिदाता, शत्रुतापूर्ण शक्तिहरू, दुःख, मिसन र चेलाहरूको पुनर्स्थापनासम्बन्धी शिक्षाका लागि प्रेरितीय मान्यता खोज्ने ख्रीष्टियनहरू।
      date: सामान्यतः ईस्वी दोस्रो शताब्दीको उत्तरार्ध वा तेस्रो शताब्दीको प्रारम्भको मानिन्छ; चौथो शताब्दीको नाग हम्मादी प्रतिलिपि र त्यसपछिको एउटा कप्टिक साक्ष्यमा संरक्षित छ।
    Gospel of Judas:
      display_name: यहूदाको सुसमाचार
      author: अज्ञात। शीर्षकले यो वृत्तान्त यहूदासँग जोड्छ, तर यस कृतिले यहूदा इस्करियोतीलाई यसको ऐतिहासिक लेखकका रूपमा स्थापित गर्दैन।
      audience: प्रतिद्वन्द्वी बलिदानी र मण्डलीगत अभ्यासहरूको आलोचना गर्ने तथा यहूदा र येशूको मृत्युलाई पुनर्व्याख्या गर्न प्रकाशनात्मक संवाद र सेथीय प्रकारको ब्रह्माण्डविज्ञान प्रयोग गर्ने ख्रीष्टियन समूह।
      date: सामान्यतः ईस्वी दोस्रो शताब्दीको मध्य वा उत्तरार्धको मानिन्छ; करिब ईस्वी १८० तिर इरेनियसलाई ‘यहूदाको सुसमाचार’ थाहा थियो, र सुरक्षित कप्टिक प्रतिलिपि सम्भवतः तेस्रो वा चौथो शताब्दीको हो।
    Protoevangelium of James:
      display_name: याकूबको आदिसुसमाचार
      author: अज्ञात। कथावाचकले आफू याकूब भएको दाबी गर्छन्, तर यो कृति छद्मनामिक हो र येशूका भाइ याकूबले लेखेका होइनन्।
      audience: मरियमको जन्म र पालनपोषण, उनको चिरस्थायी शुद्धता, येशूको जन्म तथा मत्ती र लूकाले खुला छाडेका प्रश्नहरूको कथात्मक उत्तरमा रुचि राख्ने ख्रीष्टियनहरू।
      date: सामान्यतः ईस्वी दोस्रो शताब्दीको उत्तरार्धको मानिन्छ; यो पछिल्ला समयका धेरै युनानी पाण्डुलिपि र प्राचीन अनुवादहरूमा सुरक्षित छ।
