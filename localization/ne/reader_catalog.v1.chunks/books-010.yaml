    Joel:
      display_name: योएल
      author: पथुएलका छोरा योएल।
      audience: सलहको प्रकोपलाई परमप्रभुको दिनको चिन्हका रूपमा लिएर त्यसको सामना गरिरहेको निर्वासनोत्तर यहूदा।
      date: सम्भवतः ईसापूर्व पाँचौँ–चौथो शताब्दीतिर।
    Amos:
      display_name: आमोस
      author: तकोआका आमोस, उत्तरमा प्रचार गर्ने यहूदाका एक गोठाला।
      audience: यारोबाम द्वितीयको शासनकालमा समृद्धि र अन्याय व्याप्त भएको उत्तरी इस्राएल।
      date: ईसापूर्व करिब ७६०–७५०।
    Obadiah:
      display_name: ओबदिया
      author: ओबदिया।
      audience: एदोमले यरूशलेमलाई धोका दिएपछिको यहूदा—एदोमको पतनबारे गरिएको भविष्यवाणी।
      date: ईसापूर्व ५८६ को केही समयपछि।
    Jonah:
      display_name: योना
      author: लेखक अज्ञात; मुख्य पात्र अमित्तैका छोरा योना हुन्।
      audience: निर्वासनोत्तर इस्राएल—जातीय संकीर्णताप्रति व्यङ्ग्यात्मक भर्त्सना र बाहिरकाहरूप्रति परमेश्वरको कृपाको पुष्टि।
      date: सम्भवतः ईसापूर्व पाँचौँ–चौथो शताब्दीतिर।
    Micah:
      display_name: मीका
      author: मोरेशेतका मीका।
      audience: ईसापूर्व आठौँ शताब्दीको उत्तरार्धको यहूदा, विशेष गरी सहरका अभिजात वर्गबाट पीडित ग्रामीण गरिबहरू।
      date: ईसापूर्व करिब ७४०–७००।
    Nahum:
      display_name: नहूम
      author: एल्कोशका नहूम।
      audience: निनवेको आसन्न पतनमा हर्ष मनाइरहेको यहूदा।
      date: ईसापूर्व ६१२ को केही समयअघि।
    Habakkuk:
      display_name: हबकूक
      author: हबकूक।
      audience: बेबिलोनको उदयको सामना गरिरहेको यहूदा—न्यायबारे परमेश्वरसँग एक अगमवक्ताको संवाद।
      date: ईसापूर्व सातौँ शताब्दीको उत्तरार्धतिर।
    Zephaniah:
      display_name: सपन्याह
      author: कूशीका छोरा सपन्याह।
      audience: योशियाहको शासनकालमा, उनका सुधारहरू सुरु हुनै लाग्दाको यहूदा।
      date: ईसापूर्व करिब ६४०–६०९।
    Haggai:
      display_name: हाग्गै
      author: हाग्गै।
      audience: दाराको शासनकालमा मन्दिर पुनर्निर्माण गरिरहेका स्वदेश फर्केकाहरू।
      date: ईसापूर्व ५२०।
    Zechariah:
      display_name: जकरिया
      author: बेरेक्याहका छोरा जकरिया; अध्याय ९–१४ सम्भवतः पछिका कुनै लेखकका हुन्।
      audience: मन्दिर पुनर्निर्माण गरिरहेका स्वदेश फर्केकाहरू र निर्वासनपछिका पछिल्ला समुदायहरू।
      date: अध्याय १–८ ईसापूर्व करिब ५२०–५१८; ९–१४ सम्भवतः त्यसको एक शताब्दीपछि।
    Malachi:
      display_name: मलाकी
      author: लेखक अज्ञात; “मलाकी” को अर्थ “मेरो सन्देशवाहक” हो।
      audience: फारसी शासनअन्तर्गत आराधना र विश्वासयोग्यतामा शिथिल हुँदै गएको निर्वासनोत्तर यहूदा।
      date: ईसापूर्व पाँचौँ शताब्दीको मध्यतिर।
    Matthew:
      display_name: मत्ती
      author: लेखक अज्ञात; परम्पराले यसको लेखन प्रेरित मत्तीलाई श्रेय दिन्छ। आधुनिक विद्वत् अध्ययनअनुसार लेखक युनानीभाषी यहूदी-ख्रीष्टियन थिए, जसले मर्कूस र ‘क्यू’ जस्तो स्रोतबाट सामग्री लिएका थिए।
      audience: सभाघरमा केन्द्रित यहूदी धर्मसँगको निरन्तरता र विच्छेदबारे सङ्घर्ष गरिरहेको यहूदी-ख्रीष्टियन समुदाय।
