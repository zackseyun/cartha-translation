payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: फिलिप्पीहरूलाई पोलिकार्पको पत्र
      author: स्मिर्नाका बिशप पोलिकार्प। केही विद्वान्‌हरूका अनुसार हामीसम्म आइपुगेको पाठमा एकभन्दा बढी समयमा पठाइएका सामग्रीहरू समेटिएका छन्।
      audience: फिलिप्पीको ख्रीष्टियन समुदाय, जसले इग्नाटियसका पत्रहरू मागेको थियो र विश्वास, आचरण, नेतृत्व, धन र दृढताबारे सल्लाह पाएको थियो।
      date: ईस्वी संवत् दोस्रो शताब्दीको प्रारम्भदेखि मध्यसम्म; कम्तीमा यसको केही भाग इग्नाटियसको यात्रासँग निकट रूपमा सम्बन्धित छ, तर यसलाई विभिन्न समयमा लेखिएका अंश मिलाएर बनेको पत्र मान्ने प्रस्तावले कुनै खण्ड केही पछिको हुन सक्ने सम्भावना राख्छ।
    Martyrdom of Polycarp:
      display_name: पोलिकार्पको सहादत
      author: स्मिर्नाको मण्डलीका अज्ञात सदस्यहरू, जसले समुदायको नाममा लेखे; अन्त्यमा रहेका पाठ हस्तान्तरणसम्बन्धी टिप्पणीहरूले पछिल्ला प्रतिलिपि र प्रसारलाई झल्काउँछन्।
      audience: फिलोमेलियमको मण्डली र अझ व्यापक ख्रीष्टियन समुदाय, जसलाई पोलिकार्पको गिरफ्तारी, मुद्दा, मृत्यु र अनुकरणीय धैर्यको वृत्तान्त प्रस्तुत गरिएको छ।
      date: पोलिकार्पको मृत्युपछि लेखिएको, र सामान्यतः ईस्वी संवत् दोस्रो शताब्दीको मध्य वा उत्तरार्धको मानिन्छ; सहादतको ठीक वर्ष र दस्तावेजको अन्तिम स्वरूप दुवै विवादित छन्।
    Epistle to Diognetus:
      display_name: डायोग्नेटसलाई पत्र
      author: अज्ञात। लेखकले आफूलाई चेला वा सिकारु भन्छन्, तर न त उनको न सम्बोधित डायोग्नेटसको पहिचान निश्चित रूपमा गर्न सकिन्छ।
      audience: ख्रीष्टियन उपासना, नैतिकता, सामाजिक पहिचान, प्रेम र विश्वास नयाँ देखिनुको कारणबारे प्रश्न गर्ने एक शिक्षित गैरख्रीष्टियन जिज्ञासु—र उनीजस्तै पाठकहरू।
      date: प्रायः ईस्वी संवत् दोस्रो शताब्दीको उत्तरार्ध वा तेस्रो शताब्दीको प्रारम्भको मानिन्छ, यद्यपि प्रस्तावित मितिहरूमा ठूलो भिन्नता छ; अन्तिम दुई अध्याय अर्को कृतिबाट आएका हुन सक्छन्।
    Fragments of Papias:
      display_name: पापियासका खण्डहरू
      author: हराएको पाँच खण्डको ‘प्रभुका वचनहरूको व्याख्या’का लेखक हियरापोलिसका बिशप पापियास; बाँकी रहेको सङ्ग्रहमा पछिल्ला लेखकहरूले सुरक्षित राखेका उद्धरण र विवरणहरू छन्।
      audience: येशू र प्रेरितहरूबारे सम्झनामा रहेका शिक्षाहरू खोज्ने प्रारम्भिक ख्रीष्टियनहरू, जुन मौखिक साक्ष्य र व्याख्याका नाम उल्लेख गरिएका शृङ्खलामार्फत सङ्कलन गरिएका थिए।
      date: पापियासको कृति सामान्यतः ईस्वी संवत् दोस्रो शताब्दीको प्रारम्भतिर, प्रायः करिब ११०–१३० को मानिन्छ; बाँकी रहेका खण्डहरू दोस्रो शताब्दी र त्यसपछिका लेखकहरूका कृतिमा पाइन्छन्।
