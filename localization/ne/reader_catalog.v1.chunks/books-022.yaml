      date: सामान्यतः ईस्वी दोस्रो शताब्दीको उत्तरार्ध वा तेस्रो शताब्दीको आरम्भतिरको मानिन्छ; पहिलेको ग्रिक रूपबाट अनुवाद गरिएको चौथो शताब्दीको कप्टिक पाण्डुलिपिमा सुरक्षित छ।
