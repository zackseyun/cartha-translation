  book_metadata:
    Gospel of Mary:
      display_name: मरियमको सुसमाचार
      author: लेखक अज्ञात छन्। यस कृतिले मरियमलाई येशूको प्रकाश पाउने र त्यसको व्याख्या गर्ने व्यक्तिका रूपमा प्रस्तुत गर्छ, तर सुरक्षित रहेको सुसमाचार मरियमले नै लेखेकी हुन् भन्ने दाबी गर्दैन।
      audience: प्रकाश, आत्मिक आरोहण, प्रेरितहरूको अधिकार र येशूका चेलाहरूमाझ मरियमको शिक्षाको वैधताका विषयसँग जुधिरहेका प्रारम्भिक ख्रीष्टियन पाठकहरू।
      date: सामान्यतया ईस्वी संवत् दोस्रो शताब्दीको मानिन्छ; ईस्वी संवत् तेस्रो शताब्दीका युनानी अंशहरू सुरक्षित छन्, र प्रमुख कप्टिक प्रति ईस्वी संवत् पाँचौँ शताब्दीको बर्लिन कोडेक्स ८५०२ मा संरक्षित छ।
    Treatise on the Resurrection:
      display_name: पुनरुत्थानसम्बन्धी ग्रन्थ
      author: लेखक अज्ञात छन्। यो कृति एक शिक्षकले रेगिनोस नामका शिष्यलाई लेखेको पत्रका रूपमा प्रस्तुत गरिएको छ; न शिक्षकको न त रेगिनोसकै पहिचान निश्चित रूपमा गर्न सकिन्छ।
      audience: पुनरुत्थानबारे शिक्षा खोजिरहेका ख्रीष्टियनहरू, विशेष गरी शारीरिक र आत्मिक पुनरुत्थान तथा वर्तमान जीवनमै पुनरुत्थानको जीवनमा सहभागी हुने विषयमाथि विचार गरिरहेका पाठकहरू।
      date: सामान्यतया ईस्वी संवत् दोस्रो शताब्दीको उत्तरार्धमा (प्रायः करिब ईस्वी १७०–२००) रचना भएको मानिन्छ; पहिलेको युनानी कृतिबाट गरिएको ईस्वी संवत् चौथो शताब्दीको कप्टिक प्रतिमा यो सुरक्षित छ।
    Dialogue of the Savior:
      display_name: मुक्तिदाताको संवाद
      author: लेखक अज्ञात छन्। यस संवादमा येशूले यहूदा, मत्ती र मरियमसँग कुराकानी गर्दै प्रकाशसम्बन्धी शिक्षा दिनुभएको देखाइएको छ, तर यसको सङ्कलनकर्ता को हुन् भन्ने खुलाइएको छैन।
      audience: निजी प्रकाश, चेलापन, आत्मज्ञान, प्रार्थना र मुक्तिका लागि संयमपूर्ण तयारीमा रुचि राख्ने प्रारम्भिक ख्रीष्टियन समुदाय।
      date: सामान्यतया ईस्वी संवत् दोस्रो शताब्दीको मानिन्छ, यद्यपि यसको रचनाका तहहरू र ठ्याक्कै मितिबारे विवाद कायमै छ; यो ईस्वी संवत् चौथो शताब्दीको कप्टिक पाण्डुलिपिमा सुरक्षित छ।
    Exegesis on the Soul:
      display_name: आत्माको व्याख्या
      author: लेखक अज्ञात छन्। लेखक एक ख्रीष्टियन उपदेशक हुन्, जसले बाइबलीय र युनानी साहित्यिक बिम्बहरूलाई आत्माको पतन, पश्चात्ताप र पुनर्स्थापनाको रूपकका रूपमा पुनर्व्याख्या गर्छन्।
      audience: धर्मशास्त्र र नैतिक उपदेशसँग परिचित तथा अव्यवस्थित अभिलाषा त्यागेर पश्चात्ताप गर्न र परमेश्वरसँग पुनर्मिलन गर्न बोलाइएका ख्रीष्टियनहरू।
      date: सामान्यतया ईस्वी संवत् दोस्रो शताब्दीको उत्तरार्ध वा तेस्रो शताब्दीको प्रारम्भमा रचना भएको मानिन्छ; युनानीबाट अनुवाद गरिएको ईस्वी संवत् चौथो शताब्दीको कप्टिक प्रतिमा यो सुरक्षित छ।
    Book of Thomas the Contender:
      display_name: संघर्षशील थोमाको पुस्तक
      author: लेखक अज्ञात छन्। यसको अन्तिम शीर्षकले यो कृतिलाई यहूदा थोमासँग सम्बन्धित बताउँछ र मथायासलाई अभिलेखकर्ता भन्छ, तर यी पुष्टि गर्न सकिने लेखकत्वका दाबी नभई साहित्यिक श्रेय हुन्।
      audience: आत्मज्ञान खोज्न, शारीरिक वासनाहरूको प्रतिरोध गर्न र थोमालाई येशूले दिनुभएको निजी शिक्षा बुझ्न आग्रह गरिएका संयममुखी ख्रीष्टियनहरू।
      date: प्रायः ईस्वी संवत् दोस्रो शताब्दीको उत्तरार्ध वा तेस्रो शताब्दीको प्रारम्भको मानिन्छ, र सम्भवतः सिरियाली ख्रीष्टियन परिवेशमा रचना भएको हुन सक्छ; यो ईस्वी संवत् चौथो शताब्दीको कप्टिक पाण्डुलिपिमा सुरक्षित छ।
    Tripartite Tractate:
      display_name: त्रिखण्डीय ग्रन्थ
      author: लेखक अज्ञात छन्। लेखक उच्च शिक्षा पाएका भ्यालेन्टिनीय ख्रीष्टियन धर्मशास्त्री थिए; कुनै नामित शिक्षकसँग उनको निश्चित पहिचान गर्न सम्भव छैन।
      audience: परमेश्वर, युगसत्ताहरू, सृष्टि, ख्रीष्ट, मण्डली, मुक्ति र अन्तिम पुनर्स्थापनाबारे विस्तृत शिक्षा पाइरहेको भ्यालेन्टिनीय ख्रीष्टियन समुदाय।
      date: सामान्यतया ईस्वी संवत् तेस्रो शताब्दीको मानिन्छ, यद्यपि केही तर्कले त्यस शताब्दीको उत्तरार्धलाई समर्थन गर्छन्; यो ईस्वी संवत् चौथो शताब्दीको कप्टिक भाषाको युङ कोडेक्समा सुरक्षित छ।
    Apocryphon of John:
      display_name: यूहन्नाको गुप्तग्रन्थ
      author: लेखक अज्ञात छन्। यस कृतिले छद्मनाममा पुनरुत्थित येशूले जब्दीका छोरा यूहन्नालाई दिनुभएको प्रकाश प्रस्तुत गर्छ, र यो एकभन्दा बढी प्राचीन पाठरूपमा सुरक्षित छ।
      audience: ईश्वरीय लोक, सृष्टि, मानव पहिचान र शत्रुतापूर्ण शासकहरूबाट मुक्तिबारे विवरण खोज्ने सेथीय वा त्यससँग निकट सम्बन्धित प्रकाशवादी परम्पराका ख्रीष्टियनहरू।
      date: यसको प्रारम्भिक रूप सम्भवतः ईस्वी संवत् दोस्रो शताब्दीमा प्रचलित थियो; छोटा र लामा पाठरूप सुरक्षित राख्ने कप्टिक प्रतिहरू ईस्वी संवत् चौथो र पाँचौँ शताब्दीका हुन्।
