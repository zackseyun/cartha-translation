      display_name: प्रस्थान
      author: लेखक अज्ञात; परम्परागत रूपमा मोशालाई श्रेय दिइन्छ। आधुनिक अनुसन्धानले यसलाई लामो रचनाक्रमको परिणाम मान्छ, जसमा विभिन्न स्रोतहरूलाई पछि एकसाथ सम्पादन गरिएको थियो।
      audience: मुक्त गरिएको र करारमा बाँधिएको प्रजाका रूपमा इस्राएल—परमप्रभुको व्यवस्थाअन्तर्गत उहाँको राष्ट्र हुनुको अर्थ सिक्न।
      date: शताब्दीयौँको अवधिमा रचना गरिएको; करिब ईसापूर्व छैटौँ–पाँचौँ शताब्दीमा हाल प्राप्त स्वरूपमा पुगेको।
    Leviticus:
      display_name: लेवी
      author: लेखक अज्ञात; परम्परागत रूपमा मोशालाई श्रेय दिइन्छ। आधुनिक अनुसन्धानले यसलाई पूजाहारी स्रोतभित्र राख्छ।
      audience: इस्राएली पूजाहारीहरू र आराधना गर्ने समुदाय—बलिदान, पवित्रता र परमेश्वरको उपस्थितिलाई केन्द्रमा राखेर जीवन व्यवस्थित गर्ने निर्देशनहरू।
      date: राजतन्त्रको उत्तरार्धदेखि निर्वासनपछिको अवधिसम्मका रचनात्मक तहहरू (करिब ईसापूर्व सातौँ–पाँचौँ शताब्दी)।
