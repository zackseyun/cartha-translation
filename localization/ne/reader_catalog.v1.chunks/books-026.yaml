    Letters of Ignatius:
      display_name: इग्नाटियसका पत्रहरू
      author: सामान्यतया स्वीकृत मध्यम पाठरूपका सात पत्रका लेखक एन्टिओखियाका बिशप इग्नाटियस हुन्; पछि विस्तार गरिएका र इग्नाटियसको नाममा छद्म रूपमा लेखिएका पत्रहरू यस सङ्ग्रहमा समावेश छैनन्।
      audience: इग्नाटियस सहादततर्फको यात्रामा हुँदा एफिसस, म्याग्नेसिया, ट्राल्लेस, रोम, फिलाडेल्फिया र स्मुर्नाका ख्रीष्टियन मण्डलीहरूका साथै पोलिकार्पलाई सम्बोधन गरिएका पत्रहरू।
      date: सामान्यतया ईस्वी संवत् दोस्रो शताब्दीको आरम्भतिर, प्रायः करिब १०५–११७ मा रचिएको मानिन्छ; यद्यपि इग्नाटियसको यात्राको ठ्याक्कै कालक्रमबारे अझै मतभेद छ।
