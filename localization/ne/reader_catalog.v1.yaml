  Apocryphon of John:
    display_name: यूहन्नाको गुप्तग्रन्थ
    author: लेखक अज्ञात छन्। यस कृतिले छद्मनाममा पुनरुत्थित येशूले जब्दीका छोरा यूहन्नालाई दिनुभएको प्रकाश प्रस्तुत गर्छ, र यो एकभन्दा बढी प्राचीन पाठरूपमा सुरक्षित छ।
    audience: ईश्वरीय लोक, सृष्टि, मानव पहिचान र शत्रुतापूर्ण शासकहरूबाट मुक्तिबारे विवरण खोज्ने सेथीय वा त्यससँग निकट सम्बन्धित प्रकाशवादी परम्पराका ख्रीष्टियनहरू।
    date: यसको प्रारम्भिक रूप सम्भवतः ईस्वी संवत् दोस्रो शताब्दीमा प्रचलित थियो; छोटा र लामा पाठरूप सुरक्षित राख्ने कप्टिक प्रतिहरू ईस्वी संवत् चौथो र पाँचौँ शताब्दीका हुन्।
