  Martyrdom of Polycarp:
    display_name: पोलिकार्पको सहादत
    author: स्मिर्नाको मण्डलीका अज्ञात सदस्यहरू, जसले समुदायको नाममा लेखे; अन्त्यमा रहेका पाठ हस्तान्तरणसम्बन्धी टिप्पणीहरूले पछिल्ला प्रतिलिपि र प्रसारलाई झल्काउँछन्।
    audience: फिलोमेलियमको मण्डली र अझ व्यापक ख्रीष्टियन समुदाय, जसलाई पोलिकार्पको गिरफ्तारी, मुद्दा, मृत्यु र अनुकरणीय धैर्यको वृत्तान्त प्रस्तुत गरिएको छ।
    date: पोलिकार्पको मृत्युपछि लेखिएको, र सामान्यतः ईस्वी संवत् दोस्रो शताब्दीको मध्य वा उत्तरार्धको मानिन्छ; सहादतको ठीक वर्ष र दस्तावेजको अन्तिम स्वरूप दुवै विवादित छन्।
    chapters:
      '1':
        title: मण्डलीले सबैलाई कृपाको शुभकामना पठाउँछ
      '2':
        title: पोलिकार्पको सहादत प्रमाणित हुन्छ
      '3':
        title: सहिदहरू ख्रीष्टका निम्ति सहन्छन्
      '4':
        title: जर्मानिकस जङ्गली जनावरहरूको सामना गर्छन्
