  Gospel of Thomas:
    display_name: थोमाको सुसमाचार
    author: अज्ञात; आरम्भिक पङ्क्तिले उक्तिहरूको सङ्ग्रह “डिडिमोस यहूदा थोमा”लाई श्रेय दिन्छ। यसको पूर्ण पाठ नाग हम्मादी (NHC II,2) बाट प्राप्त चौथो शताब्दीको कप्टिक अनुवादमा मात्र सुरक्षित छ; अक्सिरिन्खसबाट तीनवटा युनानी खण्ड पनि प्राप्त छन्।
    audience: सिरियाली ज्ञान-परम्परा र प्रारम्भिक ज्ञानवादी विचारबाट प्रभावित, येशूका उक्तिहरूमा निहित गूढ आत्मज्ञानतर्फ उन्मुख मसीही पाठकवर्ग।
    date: युनानी मूल सम्भवतः ईस्वी सन् ५०–१४० तिर; कप्टिक पाण्डुलिपि सम्भवतः ईस्वी सन् ३४० तिर।
    summary: थोमाको सुसमाचार येशूसँग सम्बन्धित मानिएका उक्तिहरूको सङ्ग्रह हो। यसमा निरन्तर कथा छैन, र यसले पाठकहरूलाई बारम्बार ती उक्तिहरूको अर्थ पत्ता लगाउन आह्वान गर्छ।
