  Gospel of Mary:
    display_name: मरियमको सुसमाचार
    author: लेखक अज्ञात छन्। यस कृतिले मरियमलाई येशूको प्रकाश पाउने र त्यसको व्याख्या गर्ने व्यक्तिका रूपमा प्रस्तुत गर्छ, तर सुरक्षित रहेको सुसमाचार मरियमले नै लेखेकी हुन् भन्ने दाबी गर्दैन।
    audience: प्रकाश, आत्मिक आरोहण, प्रेरितहरूको अधिकार र येशूका चेलाहरूमाझ मरियमको शिक्षाको वैधताका विषयसँग जुधिरहेका प्रारम्भिक ख्रीष्टियन पाठकहरू।
    date: सामान्यतया ईस्वी संवत् दोस्रो शताब्दीको मानिन्छ; ईस्वी संवत् तेस्रो शताब्दीका युनानी अंशहरू सुरक्षित छन्, र प्रमुख कप्टिक प्रति ईस्वी संवत् पाँचौँ शताब्दीको बर्लिन कोडेक्स ८५०२ मा संरक्षित छ।
