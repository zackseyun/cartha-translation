  Genesis:
    display_name: उत्पत्ति
    author: लेखक अज्ञात; परम्परागत रूपमा मोशालाई श्रेय दिइन्छ। आधुनिक अनुसन्धानले यसलाई लामो रचनाक्रमको परिणाम मान्छ, जसमा विभिन्न स्रोतहरूलाई पछि एकसाथ सम्पादन गरिएको थियो।
    audience: करारमा आधारित पहिचान भएको इस्राएल—परमेश्वरको सृष्टि, चुनाइ र प्रतिज्ञामा आफ्ना मानिसहरूको उत्पत्तिको कथा स्थापित गर्न।
    date: शताब्दीयौँको अवधिमा रचना गरिएको; बेबिलोनी निर्वासनको समय वा त्यसपछि, करिब ईसापूर्व छैटौँ–पाँचौँ शताब्दीमा, हाल प्राप्त स्वरूपमा पुगेको।
    summary: उत्पत्तिको पुस्तकले सृष्टि, मानवजातिको विद्रोह र तितरबितर भएको अवस्था, अनि अब्राहाम, इसहाक, याकूब र योसेफको परिवारबारे बताउँछ, जसबाट इस्राएलका लागि परमेश्वरका करारका प्रतिज्ञाहरू सुरु हुन्छन्।
