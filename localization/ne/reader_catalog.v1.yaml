    audience: भ्यालेन्टिनियन शैलीको संस्कारसम्बन्धी शिक्षासँग परिचित एउटा प्रारम्भिक ख्रीष्टियन समुदाय, विशेष गरी बप्तिस्मा, अभिषेक, प्रभुभोज, छुटकारा, पुनरुत्थान र विवाह-कक्षका प्रतीकहरूसँग।
