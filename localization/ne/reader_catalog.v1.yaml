  Infancy Gospel of Thomas:
    display_name: थोमाको बाल्यकालीन सुसमाचार
    author: लेखक अज्ञात छन्। यसको पुनर्निर्माण गर्न सकिने सबैभन्दा पुरानो स्वरूपमा लेखकको नाम दिइएको छैन; थोमालाई लेखक मान्ने परम्परा पछिल्ला पाण्डुलिपिका शीर्षक र प्रसारणबाट आएको हो।
