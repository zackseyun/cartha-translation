  Treatise on the Resurrection:
    display_name: पुनरुत्थानसम्बन्धी ग्रन्थ
    author: लेखक अज्ञात छन्। यो कृति एक शिक्षकले रेगिनोस नामका शिष्यलाई लेखेको पत्रका रूपमा प्रस्तुत गरिएको छ; न शिक्षकको न त रेगिनोसकै पहिचान निश्चित रूपमा गर्न सकिन्छ।
    audience: पुनरुत्थानबारे शिक्षा खोजिरहेका ख्रीष्टियनहरू, विशेष गरी शारीरिक र आत्मिक पुनरुत्थान तथा वर्तमान जीवनमै पुनरुत्थानको जीवनमा सहभागी हुने विषयमाथि विचार गरिरहेका पाठकहरू।
