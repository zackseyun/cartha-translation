book_localizations:
- source_title: Genesis
  title: उत्पत्ति
  author: लेखक अज्ञात छन्; परम्परागत रूपमा यसको लेखन मोशालाई मानिन्छ। आधुनिक विद्वत् अध्ययनअनुसार यो लामो समयसम्म विभिन्न स्रोतहरूबाट रचना भई पछि सम्पादन गरेर एकसाथ मिलाइएको ग्रन्थ हो।
  audience: करारमा बाँधिएको आफ्नो पहिचानमा रहेको इस्राएल; यसले परमेश्वरको सृष्टि, चुनाइ र प्रतिज्ञामा इस्राएली जनताको उत्पत्तिको कथा स्थापित गर्छ।
  date: धेरै शताब्दीको अवधिमा रचना गरिएको; बेबिलोनी निर्वासनको समयमा वा त्यसपछि, लगभग ईसापूर्व छैटौँ–पाँचौँ शताब्दीमा यसले अहिले प्राप्त स्वरूप पायो।
  summary: उत्पत्तिले सृष्टि, मानवजातिको विद्रोह र तितरबितर पारिनु, अनि अब्राहाम, इसहाक, याकूब र योसेफको परिवारबारे बताउँछ, जसद्वारा इस्राएलका लागि परमेश्वरका करारका प्रतिज्ञाहरू सुरु हुन्छन्।
- source_title: John
  title: यूहन्ना
  author: लेखक अज्ञात छन्; परम्पराले यसको लेखन प्रेरित यूहन्ना वा “प्रिय चेला” लाई मान्छ।
  audience: सभाघर-केन्द्रित यहूदी धर्मसँग तनावमा रहेको र प्रिय चेलाको साक्षी वरिपरि बनेको ख्रीष्टियन समुदाय।
  date: लगभग ईस्वी ९०–११०।
  summary: यूहन्नाले येशूलाई अनन्त वचनका रूपमा प्रस्तुत गर्छ, जसले पितालाई प्रकट गर्नुहुन्छ, उहाँमाथि भरोसा गर्नेहरूलाई जीवन दिनुहुन्छ, र आफ्ना चिन्हहरू, मृत्यु तथा पुनरुत्थानद्वारा महिमित हुनुहुन्छ।
- source_title: Gospel of Thomas
  title: थोमाको सुसमाचार
  author: लेखक अज्ञात छन्; आरम्भिक पङ्क्तिले यस भनाइ-सङ्ग्रहलाई “दिदिमोस यहूदा थोमा” को भनी बताउँछ। यसको पूर्ण पाठ नाग हम्मादी (NHC II,2) बाट प्राप्त चौथो शताब्दीको कप्टिक अनुवादमा मात्र बाँचेको छ; अक्सिरिङ्खसबाट यसका तीनवटा ग्रीक खण्ड पनि प्राप्त भएका छन्।
  audience: सिरियाली ज्ञान-परम्परा र प्रारम्भिक ज्ञानवादी विचारबाट प्रभावित, येशूका भनाइहरूमा रहेको गूढ आत्मज्ञानतर्फ उन्मुख ख्रीष्टियन पाठकवर्ग।
  date: ग्रीक मूल सम्भवतः लगभग ईस्वी ५०–१४०; कप्टिक पाण्डुलिपि लगभग ईस्वी ३४०।
  summary: थोमाको सुसमाचार येशूका भनाइहरू भनेर प्रस्तुत गरिएको सङ्ग्रह हो। यसमा निरन्तर चल्ने कथा छैन, र यसले पाठकहरूलाई ती भनाइहरूको अर्थ पत्ता लगाउन बारम्बार आह्वान गर्छ।
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: उत्पत्ति १:१
  text: जब परमेश्वरले आकाश र पृथ्वी सृष्टि गर्न थाल्नुभयो[क]—
  translator_note: '[क] परम्परागत अनुवादले यसलाई पूर्ण वाक्य मान्छ: “आदिमा परमेश्वरले आकाश र पृथ्वी सृष्टि गर्नुभयो।” तर हिब्रू पाठले अझ स्वाभाविक रूपमा यसपछि आउने कुराको भूमिका बाँध्छ, र मुख्य कार्य “परमेश्वरले भन्नुभयो” पद ३ मा आउँछ।'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: उपदेशक १:२
  text: “वाष्पकै वाष्प[क],” कोहेलेत[ख] भन्छन्। “सबैथोक वाष्प हो—क्षणभङ्गुर, समातेर राख्न नसकिने, र प्रायः हामीले अपेक्षा गरेजस्तो नहुने।”
  translator_note: '[क] हिब्रू शब्द ‘हेवेल’ को शाब्दिक अर्थ सास वा वाष्प हो। उपदेशकभरि यसले चाँडै बितिजाने, समात्न नसकिने वा पूर्ण रूपमा बुझ्न नसकिने, र मानिसले अपेक्षा गरेभन्दा प्रायः फरक निस्कने कुरालाई जनाउँछ। “वाष्प” ले कुनै पनि कुराको अर्थ छैन भन्ने दाबी नगरी त्यो चित्रलाई कायम राख्छ। यसलाई “सास,” “सास मात्र” वा “क्षणभङ्गुर” पनि बुझ्न सकिन्छ। [ख] ‘कोहेलेत’ लेखकको हिब्रू नाम वा उपाधि हो। यसलाई प्रायः “शिक्षक” वा “प्रचारक” भनेर अनुवाद गरिन्छ, तर कुनै एउटा अर्थलाई प्राथमिकता नदिई सबै सम्भावित अर्थ खुला राख्न यहाँ ‘कोहेलेत’ नै राखिएको छ।'
- source_path: nt/john/001/001.yaml
  reference: यूहन्ना १:१
  text: आदिमा[ख] वचन पहिल्यै अस्तित्वमा हुनुहुन्थ्यो। वचन परमेश्वरसँग हुनुहुन्थ्यो, र वचन परमेश्वर हुनुहुन्थ्यो।[क]
  translator_note: '[क] यसलाई “वचन ईश्वरीय हुनुहुन्थ्यो” वा “परमेश्वर जे हुनुहुन्थ्यो, वचन त्यही हुनुहुन्थ्यो” भनेर पनि अनुवाद गर्न सकिन्छ। अघिल्लो वाक्यांशमा वचनलाई परमेश्वरबाट भिन्न देखाउँदै पनि ग्रीक अभिव्यक्तिले वचन पूर्ण रूपमा परमेश्वर हुनुहुन्छ भन्ने पुष्टि गर्छ। [ख] यो आरम्भले उत्पत्ति १:१ को प्रतिध्वनि गर्छ र वचनलाई सृष्टिको आरम्भसँग जोड्छ। “पहिल्यै अस्तित्वमा हुनुहुन्थ्यो” भन्ने अनुवादले आरम्भ आउँदा वचनको अस्तित्व निरन्तर थियो, उहाँ त्यस बेला अस्तित्वमा आउनुभएको होइन भन्ने ग्रीक अपूर्ण भूतकालको भाव स्पष्ट पार्छ। यसलाई “हुनुहुन्थ्यो” वा “अस्तित्वमा हुनुहुन्थ्यो” पनि भन्न सकिन्छ।'
- source_path: nt/romans/003/025.yaml
  reference: रोमी ३:२५
  text: परमेश्वरले उहाँलाई उहाँको रगतमा विश्वासद्वारा[ख] प्रायश्चित्तको बलिदान[क] का रूपमा प्रस्तुत गर्नुभयो। विगतमा गरिएका पापहरूलाई उहाँले छोडिदिनुभएको हुनाले आफ्नो धार्मिकता[ग] देखाउन उहाँले यसो गर्नुभयो।
  translator_note: '[क] यसलाई “परमेश्वरको क्रोध शान्त पार्ने बलिदान” वा “कृपासन” पनि भन्न सकिन्छ। कृपासन करारको सन्दूकको सुनको ढकनी थियो, जसमाथि पुरानो करारमा प्रायश्चित्तको रगत छर्किन्थ्यो। [ख] यसलाई “विश्वासद्वारा, उहाँको रगतको माध्यमले” भनेर पनि बुझ्न सकिन्छ। [ग] “धार्मिकता” को सट्टा “न्याय” पनि हुन सक्छ।'
- source_path: nt/1_peter/001/013.yaml
  reference: १ पत्रुस १:१३
  text: त्यसकारण, काम गर्नका लागि आफ्ना मन तयार पार्नुहोस्।[क] पूर्ण रूपमा सचेत रहनुहोस्, र येशू मसीह प्रकट हुनुहुँदा तपाईँहरूकहाँ ल्याइने अनुग्रहमा आफ्नो आशा पूर्ण रूपले राख्नुहोस्।[ख]
  translator_note: '[क] ग्रीकमा शाब्दिक रूपमा “आफ्नो मनको कम्मर कस” भनिएको छ। यसले काम गर्न तयार हुन लामो लुगा कम्मरवरिपरि समेटेर कस्ने चित्र प्रस्तुत गर्छ; यहाँ त्यो चित्रले मानसिक तयारी र काम गर्न तत्पर हुने अर्थ दिन्छ। [ख] “पूर्ण रूपमा” र “पूर्ण रूपले” अनुवाद गरिएको ग्रीक शब्द सचेत रहने कुरासँग, आशा राख्ने कुरासँग, वा सम्भवतः दुवैसँग सम्बन्धित हुन सक्छ।'
