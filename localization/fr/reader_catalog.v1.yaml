    author: Anonyme. Le titre figure dans la souscription finale du manuscrit, mais l’œuvre ne désigne pas Philippe comme son auteur. Le seul exemplaire conservé est le texte copte du codex II,3 de Nag Hammadi.
    audience: Une communauté chrétienne ancienne connaissant un enseignement sacramentel de type valentinien, notamment sur le baptême, l’onction, l’eucharistie, la rédemption, la résurrection et l’image de la chambre nuptiale.
