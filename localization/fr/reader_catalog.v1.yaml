    display_name: Épître à Diognète
    author: Auteur anonyme. Il se présente comme un disciple ou un élève, mais ni son identité ni celle de Diognète, le destinataire, ne peuvent être établies avec certitude.
    audience: Un non-chrétien instruit qui s’interroge — ainsi que les lecteurs qui lui ressemblent — sur le culte chrétien, l’éthique, l’identité sociale, l’amour et l’apparente nouveauté de la foi.
    date: Souvent datée de la fin du IIe ou du début du IIIe siècle apr. J.-C., bien que les propositions varient considérablement ; les deux derniers chapitres pourraient provenir d’une autre œuvre.
