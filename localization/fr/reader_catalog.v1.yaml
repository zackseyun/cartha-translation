        title: Tous sont coupables sous l’emprise du péché
      '4':
        title: Abraham est déclaré juste par la foi seule
      '5':
        title: La justice par la mort du Christ
      '6':
        title: Vivez pour Dieu, non pour le péché
      '7':
        title: Les croyants luttent contre le péché
      '8':
        title: Rien ne nous sépare du Christ
      '9':
        title: La miséricorde et la colère envers Israël
      '10':
        title: Le salut est proche de tous
      '11':
        title: Les non-Juifs appelés par grâce
      '12':
        title: Offrez vos vies en sacrifice vivant
      '13':
        title: Soumettez-vous aux autorités et aimez
      '14':
        title: Accueillez ceux dont la foi est faible
      '15':
        title: Unissez Juifs et non-Juifs
      '16':
        title: Salutations et avertissements
  1 Corinthians:
    display_name: 1 Corinthiens
    author: Paul, avec Sosthène.
    audience: La communauté chrétienne de Corinthe, divisée par des querelles.
    date: Vers 53–55 apr. J.-C., depuis Éphèse.
    chapters:
      '1':
        title: Les richesses que Dieu accorde fidèlement à tous
      '2':
        title: La sagesse révélée par l’Esprit de Dieu
      '3':
        title: Paul avertit les Corinthiens au sujet du temple
      '4':
        title: La fidélité compte plus que l’orgueil
      '5':
        title: Paul ordonne à l’Église d’exercer la discipline
      '6':
        title: Réglez les différends au sein de l’Église
      '7':
        title: Paul enseigne à honorer le mariage
      '8':
        title: L’amour prime sur la liberté personnelle
      '9':
        title: Paul défend librement son apostolat
      '10':
        title: L’exemple d’Israël avertit le peuple de Dieu
      '11':
        title: L’unité dans le culte honore le Christ
      '12':
        title: Les dons de l’Esprit édifient l’unité de l’Église
      '13':
        title: L’amour ne renonce jamais
      '14':
        title: Paul invite à préférer l’amour au désir d’impressionner
      '15':
        title: Le Christ ressuscite et la mort tombe
      '16':
        title: Offrandes et projets de voyage
  2 Corinthians:
    display_name: 2 Corinthiens
    author: Paul, avec Timothée.
    audience: La communauté de Corinthe, après un conflit douloureux.
    date: Vers 55–56 apr. J.-C.
    chapters:
      '1':
        title: Le réconfort de Dieu dans la souffrance
      '2':
        title: Un appel à l’amour et au pardon
      '3':
        title: Un ministère attesté par des vies transformées
      '4':
        title: Proclamer la gloire du Christ
      '5':
        title: L’amour du Christ anime le ministère
      '6':
        title: Endurez la souffrance pour Dieu
      '7':
        title: Recherchez la sainteté dans la révérence
      '8':
        title: La grâce accordée aux Macédoniens inspire la générosité
      '9':
        title: Donnez avec joie pour les croyants
      '10':
        title: La douceur du Christ affirmée
      '11':
        title: Une jalousie pour une vie fidèle
      '12':
        title: Se glorifier de la faiblesse et de la grâce
      '13':
        title: Examinons-nous pour le péché
  Galatians:
    display_name: Galates
    author: Paul.
    audience: Les communautés chrétiennes de Galatie (au centre de l’Anatolie), poussées à adopter la circoncision et l’observance de la Torah.
    date: Vers 48–55 apr. J.-C. (datation débattue).
    chapters:
      '1':
        title: Paul défend son Évangile
      '2':
        title: Paul reprend l’erreur de Pierre
      '3':
        title: La foi d’Abraham rend juste
      '4':
        title: Le Christ nous libère de la Loi
      '5':
        title: Vivez par la foi, non par la Loi
      '6':
        title: Portez les fardeaux les uns des autres
  Ephesians:
    display_name: Éphésiens
    author: Paul, ou un proche disciple écrivant en son nom (question débattue).
    audience: Un lectorat chrétien général d’Asie ; le nom de lieu « Éphèse » est absent des manuscrits les plus anciens.
    date: Vers les années 60 apr. J.-C. si la lettre est de Paul ; vers les années 80–90 si elle est pseudonyme.
    chapters:
      '1':
        title: La grâce de Dieu scellée dans les croyants
      '2':
        title: Le Christ apporte la paix à tous
      '3':
        title: Le mystère révélé par l’Évangile
      '4':
        title: Prière pour l’unité du corps du Christ
      '5':
        title: Imitez Dieu et vivez avec sagesse
      '6':
        title: Enfants, obéissez à vos parents et honorez-les
  Philippians:
    display_name: Philippiens
    author: Paul, avec Timothée.
    audience: La communauté chrétienne de Philippes, colonie romaine de Macédoine.
    date: Vers 60–62 apr. J.-C., depuis la prison.
    chapters:
      '1':
        title: Paul prie pour les Philippiens
      '2':
        title: Jésus, humble et élevé dans la gloire
      '3':
        title: Réjouissez-vous de connaître le Christ
      '4':
        title: Tenez ferme dans la joie
  Colossians:
    display_name: Colossiens
    author: Paul, avec Timothée — ou un proche disciple écrivant en son nom (question débattue).
    audience: Les chrétiens de Colosses, dans la vallée du Lycos, confrontés à un enseignement syncrétique.
    date: Vers 60–62 apr. J.-C. si la lettre est de Paul ; plus tard si elle est pseudonyme.
    chapters:
      '1':
        title: Paul prie pour la foi des Colossiens
      '2':
        title: Paul encourage les croyants au sujet du Christ
      '3':
        title: Élevez-vous au-dessus du péché et vivez dans l’amour
      '4':
        title: Paul prie, est enchaîné et encourage
  1 Thessalonians:
    display_name: 1 Thessaloniciens
    author: Paul, avec Silvain et Timothée.
    audience: La jeune communauté chrétienne de Thessalonique, confrontée à la persécution.
    date: Vers 50–51 apr. J.-C. — probablement la plus ancienne lettre de Paul qui nous soit parvenue.
    chapters:
      '1':
        title: Grâce, paix, foi, amour et espérance
      '2':
        title: Prêcher avec assurance et des motivations pures
      '3':
        title: Timothée encourage dans la souffrance
      '4':
        title: Paul encourage à vivre dans la sainteté
      '5':
        title: Restez vigilants dans l’attente du salut
  2 Thessalonians:
    display_name: 2 Thessaloniciens
    author: Paul (attribution débattue ; certains spécialistes considèrent la lettre comme pseudonyme).
    audience: La communauté de Thessalonique, face à une confusion concernant la fin des temps.
    date: Vers 51 apr. J.-C. si la lettre est de Paul.
    chapters:
      '1':
        title: Dieu récompense les fidèles persécutés
      '2':
        title: La rébellion précède la venue du Christ
      '3':
        title: Paul prie pour la croissance de l’Église
  1 Timothy:
    display_name: 1 Timothée
    author: Paul, ou un disciple écrivant en son nom (les épîtres pastorales sont largement considérées comme pseudonymes).
    audience: Timothée, en qualité de délégué de Paul à Éphèse ; un guide pour l’organisation ultérieure de l’Église.
    date: Vers le milieu des années 60 apr. J.-C. si la lettre est de Paul ; vers 90–110 apr. J.-C. si elle est pseudonyme.
    chapters:
      '1':
        title: Paul exhorte Timothée à rester
      '2':
        title: Priez pour les dirigeants et vivez en paix
      '3':
        title: Les qualités requises des responsables de l’Église
      '4':
        title: Rejetez les faux enseignants et les mythes
      '5':
        title: Honorez fidèlement les veuves et les anciens
      '6':
        title: Paul conseille Timothée au sujet de la richesse
  2 Timothy:
    display_name: 2 Timothée
    author: Paul, ou un disciple écrivant en son nom.
    audience: Timothée — la lettre se présente comme les adieux de Paul depuis la prison.
    date: Vers le milieu des années 60 apr. J.-C. si la lettre est de Paul ; vers 90–110 apr. J.-C. si elle est pseudonyme.
    chapters:
      '1':
        title: Timothée, tiens ferme dans la grâce
      '2':
        title: Endure la souffrance pour le Christ
      '3':
        title: 'Évitez les faux enseignants : avertissement'
      '4':
        title: Prêche fidèlement à tous
  Titus:
    display_name: Tite
    author: Paul, ou un disciple écrivant en son nom.
    audience: Tite, en qualité de délégué de Paul en Crète.
    date: Vers le milieu des années 60 apr. J.-C. si la lettre est de Paul ; vers 90–110 apr. J.-C. si elle est pseudonyme.
    chapters:
      '1':
        title: Paul donne ses instructions à Tite en Crète
      '2':
        title: Enseigne à tous les âges à vivre selon la grâce
      '3':
        title: Vivez humblement dans l’attente du Christ
  Philemon:
    display_name: Philémon
    author: Paul, avec Timothée.
    audience: Philémon, chrétien propriétaire d’esclaves, au sujet d’Onésime, son esclave en fuite.
    date: Vers 60–62 apr. J.-C.
    chapters:
      '1':
        title: Paul plaide pour la liberté d’Onésime
  Hebrews:
    display_name: Hébreux
    author: Auteur anonyme. La tradition a proposé Paul, Apollos, Barnabé, Priscille et d’autres ; aucune proposition ne fait consensus.
    audience: Des chrétiens juifs de langue grecque tentés de s’éloigner de leur confession chrétienne pour revenir en arrière.
    date: Vers 60–95 apr. J.-C.
    chapters:
      '1':
        title: Dieu parle par son Fils
      '2':
        title: Jésus sauve par la souffrance
      '3':
        title: Fixez les yeux sur Jésus, qui est fidèle
      '4':
        title: Entrez dans le repos promis par Dieu
      '5':
        title: Le Christ a offert un sacrifice parfait
      '6':
        title: Avancez vers la maturité spirituelle
      '7':
        title: Jésus, prêtre pour toujours selon l’ordre de Melchisédek
      '8':
        title: La nouvelle alliance par le sang de Jésus
      '9':
        title: Jésus entre dans le véritable sanctuaire céleste
      '10':
        title: Approchez-vous grâce au sang du Christ
      '11':
        title: La foi des ancêtres demeure ferme
      '12':
        title: Endurer la souffrance avec Jésus
      '13':
        title: Vivre dans l’amour et la confiance
  James:
    display_name: Jacques
    author: Traditionnellement, Jacques, le frère de Jésus ; les chercheurs modernes sont partagés entre une attribution authentique et une attribution pseudonyme.
    audience: Assemblées judéo-chrétiennes de la diaspora.
    date: Vers les années 50–60 apr. J.-C. si l’attribution est authentique ; vers la fin du Ier siècle apr. J.-C. si elle est pseudonyme.
    chapters:
      '1':
        title: La foi éprouvée résiste aux épreuves
      '2':
        title: La foi sans les œuvres est morte
      '3':
        title: Maîtriser sa langue et parler avec sagesse
      '4':
        title: Les querelles viennent de l’égoïsme
      '5':
        title: Le jugement des riches oppresseurs est proche
  1 Peter:
    display_name: 1 Pierre
    author: Traditionnellement, l’apôtre Pierre, avec Silvanus comme secrétaire ; certains chercheurs considèrent l’œuvre comme pseudonyme.
    audience: Chrétiens d’Asie Mineure romaine confrontés à l’hostilité sociale.
    date: Vers les années 60 apr. J.-C. si l’œuvre est de Pierre ; vers les années 70–90 apr. J.-C. si elle est pseudonyme.
    chapters:
      '1':
        title: L’espérance d’un héritage céleste
      '2':
        title: Les croyants, édifiés sur la pierre vivante
      '3':
        title: Les épouses honorent le Christ par leur conduite
      '4':
        title: Souffrir pour avoir fait le bien
      '5':
        title: Les anciens prennent soin par leur exemple et leur foi
  2 Peter:
    display_name: 2 Pierre
    author: Traditionnellement, Pierre ; une grande partie des chercheurs modernes considère l’œuvre comme pseudonyme.
    audience: Chrétiens confrontés à des moqueurs qui nient la parousie.
    date: Vers le début du IIe siècle apr. J.-C.
    chapters:
      '1':
        title: Pierre enseigne la croissance spirituelle
      '2':
        title: Les faux enseignants attirent sur eux un jugement rapide
      '3':
        title: Pierre avertit du jugement final
  1 John:
    display_name: 1 Jean
    author: Anonyme ; traditionnellement attribuée à l’apôtre Jean ou à l’Ancien johannique.
    audience: Communauté johannique après une scission, cherchant à définir qui lui appartient.
    date: Vers 90–110 apr. J.-C.
    chapters:
      '1':
        title: La lumière révèle la véritable communion
      '2':
        title: L’amour garde les commandements de Dieu
      '3':
        title: Ceux qui sont nés de Dieu triomphent du péché
      '4':
        title: L’amour véritable vient de Dieu
      '5':
        title: Croire en Jésus donne la vie éternelle
  2 John:
    display_name: 2 Jean
    author: « L’Ancien ».
    audience: Une assemblée chrétienne précise (« la dame élue »), mise en garde contre de faux enseignants.
    date: Vers 90–110 apr. J.-C.
    chapters:
      '1':
        title: L’Ancien met en garde contre les faux enseignants
  3 John:
    display_name: 3 Jean
    author: « L’Ancien ».
    audience: Gaïus, un responsable qui accueille des missionnaires itinérants.
    date: Vers 90–110 apr. J.-C.
    chapters:
      '1':
        title: L’Ancien prie pour la prospérité de Gaïus
  Jude:
    display_name: Jude
    author: Traditionnellement, Jude, frère de Jacques et de Jésus.
    audience: Communautés chrétiennes infiltrées par des enseignants aux mœurs dissolues.
    date: Vers les années 60–90 apr. J.-C.
    chapters:
      '1':
        title: Jude met en garde contre des intrus impies
  Revelation:
    display_name: Apocalypse
    author: Jean de Patmos (dont le style se distingue de celui du quatrième Évangile).
    audience: Sept assemblées chrétiennes d’Asie Mineure romaine soumises à la pression impériale.
    date: Vers les années 90 apr. J.-C., traditionnellement sous le règne de Domitien.
    chapters:
      '1':
        title: Dieu montre ses visions à Jean
      '2':
        title: Jésus parle aux sept Églises
      '3':
        title: Jésus appelle Laodicée à se repentir
      '4':
        title: Le trône céleste resplendit de gloire
      '5':
        title: L’Agneau prend le livre et rachète
      '6':
        title: Les quatre cavaliers apportent de grands malheurs
      '7':
        title: Les serviteurs marqués du sceau chantent une louange éternelle
      '8':
        title: Les sept trompettes annoncent de terribles jugements
      '9':
        title: Les sauterelles tourmentent les pécheurs de la terre
      '10':
        title: L’ange puissant jure qu’il n’y aura plus de délai
      '11':
        title: Les deux témoins prophétisent, puis ressuscitent
      '12':
        title: La femme enfante le fils destiné à régner
      '13':
        title: La bête monte de la mer
      '14':
        title: L’Agneau rassemble auprès de lui les fidèles
      '15':
        title: Jean voit la colère du ciel
      '16':
        title: Les anges versent les coupes de la colère
      '17':
        title: Le jugement de Babylone et le triomphe de Dieu
      '18':
        title: Le ciel se réjouit de la chute de Babylone
      '19':
        title: Le ciel célèbre les noces de l’Agneau
      '20':
        title: Jean voit le jugement final
      '21':
        title: Toutes choses sont rendues nouvelles
      '22':
        title: Jésus vient bientôt
  Tobit:
    display_name: Tobie
    author: Anonyme.
    audience: Juifs de la diaspora cherchant à vivre la piété, le mariage et la providence sous une domination étrangère.
    date: Vers 225–175 av. J.-C. ; composé en araméen, avec une version hébraïque également attestée à Qumrân.
    chapters:
      '1':
        title: Tobit se souvient fidèlement de Dieu
      '2':
        title: Tobit enterre un voisin méprisé
      '3':
        title: Tobit pleure et demande la mort dans sa prière
      '4':
        title: Tobit enseigne la justice à son fils
      '5':
        title: Tobias part, guidé
      '6':
        title: Tobias attrape un poisson guérisseur
      '7':
        title: Tobias épouse Sara à Ecbatane
      '8':
        title: Tobias épouse Sara et prie
      '9':
        title: Gabaël rend l’argent à Tobit
      '10':
        title: Tobias rentre chez lui sain et sauf
      '11':
        title: Le fils de Tobit lui rend la vue
      '12':
        title: Raphaël révèle sa véritable identité
      '13':
        title: Tobit prie pour Jérusalem
      '14':
        title: Tobit entrevoit l’avenir d’Israël
  Judith:
    display_name: Judith
    author: Anonyme.
    audience: Juifs confrontés à une menace étrangère — un récit audacieux de résistance fidèle à Dieu.
    date: Vers 150–100 av. J.-C.
    chapters:
      '1':
        title: Nabuchodonosor attaque Arphaxad
      '2':
        title: Holopherne marche vers l’ouest
      '3':
        title: Les peuples du littoral livrent leurs richesses
      '4':
        title: Israël jeûne et prie pour recevoir de l’aide
      '5':
        title: Achior raconte l’histoire d’Israël
      '6':
        title: Holopherne avertit Achior
      '7':
        title: Béthulie manque d’eau
      '8':
        title: Judith promet le salut de Dieu
      '9':
        title: Judith demande la force de Dieu dans sa prière
      '10':
        title: Judith entre dans le camp assyrien
      '11':
        title: Holopherne fait entrer Judith
      '12':
        title: Judith recherche la direction de Dieu
      '13':
        title: Judith décapite Holopherne
      '14':
        title: Israël célèbre la victoire de Judith
      '15':
        title: Israël pille les dépouilles assyriennes
      '16':
        title: Judith entonne un chant de louange
  Greek Additions to Esther:
    display_name: Ajouts grecs à Esther
    author: Anonyme ; textes supplémentaires ajoutés dans la traduction grecque d’Esther.
    audience: Juifs de langue grecque souhaitant un récit d’Esther comportant des prières explicites et des références directes à Dieu.
    date: Vers le IIe–Ier siècle av. J.-C.
    chapters:
      '1':
        title: Mardochée rêve et avertit le roi
      '2':
        title: Le roi ordonne la destruction par écrit
      '3':
        title: Mardochée et Esther prient pour recevoir de l’aide
      '4':
        title: Esther se présente devant le roi
      '5':
        title: Le roi punit Haman et sauve les Juifs
      '6':
        title: Mardochée se souvient du rêve et prophétise
  Wisdom of Solomon:
    display_name: Sagesse de Salomon
    author: Anonyme ; attribuée sous pseudonyme à Salomon. Composée en grec par un auteur juif hellénistique, probablement à Alexandrie.
    audience: Juifs hellénistiques dialoguant avec la philosophie grecque et défendant la sagesse d’Israël face aux voies païennes et apostates.
    date: Vers 50 av. J.-C. – 50 apr. J.-C.
    chapters:
      '1':
        title: Dieu révèle la sagesse à ceux qui la cherchent
      '2':
        title: Les méchants rejettent la véritable joie de vivre
      '3':
        title: Les âmes des justes reposent en paix
      '4':
        title: La vertu est honorée, les impies sont couverts de honte
      '5':
        title: Les justes dévoilent hardiment la méchanceté
      '6':
        title: La sagesse conduit à une véritable royauté
      '7':
        title: La prière apporte sagesse et intelligence
      '8':
        title: La sagesse guide et fortifie les dirigeants
      '9':
        title: Le roi demande la sagesse divine
      '10':
        title: La sagesse protège et délivre les justes
      '11':
        title: Dieu fait miséricorde en corrigeant
      '12':
        title: Se moquer des idoles ne donne qu’un vain espoir
      '13':
        title: Les humains adorent des idoles sans vie
      '14':
        title: Dieu guide les navires sur la mer
      '15':
        title: La miséricorde de Dieu conduit au vrai culte
      '16':
        title: Dieu pourvoit aux besoins tout en jugeant les oppresseurs
      '17':
        title: Prisonniers de l’étreinte d’une nuit terrifiante
      '18':
        title: Dieu guide par la lumière
      '19':
        title: Les nuages s’écartent devant Israël
  Sirach:
    display_name: Siracide
    author: Yeshoua ben Éléazar ben Sira, de Jérusalem ; traduction grecque par son petit-fils.
    audience: Jeunes hommes juifs formés à la sagesse dans la Jérusalem de l’époque hellénistique.
    date: Original hébreu vers 195–175 av. J.-C. ; traduction grecque vers 132 av. J.-C.
    chapters:
      '1':
        title: Dieu mesure la sagesse et la donne
      '2':
        title: Les épreuves révèlent les serviteurs fidèles
      '3':
        title: Honore tes parents et tu vivras longtemps
      '4':
        title: Secours les opprimés et recherche la sagesse
      '5':
        title: Mets ta confiance en Dieu, non dans la richesse
      '6':
        title: Recherche la sagesse comme un cultivateur
      '7':
        title: Garde l’humilité au fond du cœur
      '8':
        title: Évite les insensés et honore les anciens
      '9':
        title: Garde-toi de la jalousie et de la convoitise
      '10':
        title: Une direction sage établit l’ordre
      '11':
        title: La sagesse élève le pauvre
      '12':
        title: Aide les justes, non les pécheurs
      '13':
        title: Qui touche à la poix s’en souille
      '14':
        title: La sagesse apporte une bénédiction éternelle
      '15':
        title: La sagesse vient à la rencontre de ceux qui la cherchent
      '16':
        title: Un seul fidèle peut soutenir une ville
      '17':
        title: Les humains sont créés à l’image de Dieu
      '18':
        title: Ne gâche pas tes bonnes actions
      '19':
        title: Ceux qui courent après le plaisir se perdent
      '20':
        title: Il faut savoir parler au bon moment
      '21':
        title: Prie, fuis le péché et recherche la sagesse
      '22':
        title: La paresse apporte honte et chagrin
      '23':
        title: Demande dans la prière discipline intérieure et sagesse
      '24':
        title: La sagesse fait son propre éloge
      '25':
        title: La sagesse honore Dieu et les humains
      '26':
        title: Une épouse apporte joie ou peine
      '27':
        title: Recherche la justice et porte-la avec fierté
      '28':
        title: Pardonne les fautes et tu obtiendras miséricorde
      '29':
        title: Pardonne à ton prochain et tu obtiendras miséricorde
      '30':
        title: Élève tes fils dans l’honneur
      '31':
        title: La richesse apporte anxiété et souffrance
