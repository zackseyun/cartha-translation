    author: Papias, évêque de Hiérapolis, pour les cinq livres aujourd’hui perdus des Explications des paroles du Seigneur ; le recueil qui subsiste se compose de citations et de témoignages conservés par des auteurs postérieurs.
    audience: Des chrétiens des premiers temps cherchant des enseignements transmis de mémoire sur Jésus et les apôtres, recueillis au moyen de chaînes nommées de témoignage oral et d’interprétation.
    date: L’œuvre de Papias est généralement datée du début du IIe siècle apr. J.-C., souvent vers 110–130 ; les fragments qui subsistent se trouvent chez des auteurs écrivant à partir du IIe siècle.
