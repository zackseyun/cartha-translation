        title: Polycarpe prie pour la foi des Philippiens
      '14':
        title: Les lettres envoyées en Syrie sont attendues
      '15':
        title: Crescens remet fidèlement la lettre
  Martyrdom of Polycarp:
    display_name: Martyre de Polycarpe
    author: Des membres anonymes de l’Église de Smyrne, écrivant au nom de la communauté ; les notes finales sur la transmission témoignent de copies et d’une diffusion ultérieures.
    audience: L’Église de Philomélium et l’ensemble de la communion chrétienne, auxquels est présenté un récit de l’arrestation, du procès, de la mort et de l’endurance exemplaire de Polycarpe.
    date: Écrit après la mort de Polycarpe, généralement situé au milieu ou dans la seconde moitié du IIe siècle apr. J.-C. ; l’année exacte du martyre comme la forme définitive du document restent débattues.
