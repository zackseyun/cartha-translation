    audience: L’Église de Philomélium et l’ensemble de la communion chrétienne, auxquels est proposé un récit de l’arrestation, du procès et de la mort de Polycarpe, ainsi que de son endurance exemplaire.
    date: Écrit après la mort de Polycarpe, ce texte est généralement situé vers le milieu ou la fin du IIe siècle apr. J.-C. ; l’année exacte du martyre comme la forme définitive du document font débat.
