      author: Anonyme ; fait partie de l’histoire deutéronomiste.
      audience: Israël, à une époque ultérieure, relisant son passé d’avant la monarchie comme un cycle d’apostasie et de délivrance qui sert d’avertissement.
      date: Compilation vers les VIIe–VIe siècles av. J.-C.
    Ruth:
      display_name: Ruth
      author: Anonyme.
