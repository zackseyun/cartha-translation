    Numbers:
      display_name: Nombres
      author: Anonyme ; traditionnellement attribué à Moïse.
      audience: Israël en route entre l’Égypte et la terre promise — la génération du désert, ainsi que les lecteurs ultérieurs appelés à tirer les leçons de ses échecs.
      date: Des couches de composition allant de la fin de la période monarchique à la période postexilique (env. VIIe–Ve siècle av. J.-C.).
    Deuteronomy:
      display_name: Deutéronome
      author: Anonyme ; présenté comme les discours d’adieu de Moïse. La recherche moderne situe un noyau du livre dans le cadre de la réforme menée sous Josias à la fin du VIIe siècle av. J.-C.
      audience: Israël se préparant à entrer dans le pays — et, plus tard, les exilés qui se demandaient comment vivre fidèlement sans temple ni roi.
      date: Noyau datant probablement de la fin du VIIe siècle av. J.-C. ; forme finale atteinte durant la période de l’exil.
    Joshua:
      display_name: Josué
      author: Anonyme ; fait partie de l’Histoire deutéronomiste.
      audience: Israël sous la monarchie puis durant l’exil, méditant sur la conquête, l’alliance et la signification du pays.
      date: Compilé vers les VIIe–VIe siècles av. J.-C. à partir de traditions plus anciennes.
