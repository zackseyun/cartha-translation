payload:
  book_metadata:
    1 Esdras:
      display_name: 1 Esdras
      author: Anonyme ; recomposition grecque réorganisant 2 Chroniques 35–36, Esdras et Néhémie 7–8.
      audience: Les Juifs de l’époque hellénistique souhaitant un récit clair du retour et de la restauration.
      date: Env. IIe–Ier siècle av. J.-C.
    Prayer of Manasseh:
      display_name: Prière de Manassé
      author: Anonyme ; attribuée sous pseudonyme au roi Manassé.
      audience: Les personnes pénitentes qui s’identifient au repentir de Manassé — texte employé dans la liturgie de certaines traditions.
      date: Env. IIe–Ier siècle av. J.-C.
    Psalm 151:
      display_name: Psaume 151
      author: Anonyme ; attribué sous pseudonyme à David. Une forme hébraïque est attestée dans 11QPsa.
      audience: Les communautés de la diaspora et de Qumrân attachées au psautier de David.
      date: Env. IIe siècle av. J.-C. ou avant.
    3 Maccabees:
      display_name: 3 Maccabées
      author: Anonyme ; composé en grec.
      audience: Les Juifs d’Égypte appartenant à la diaspora de langue grecque — récit de délivrance situé sous Ptolémée IV.
      date: Env. Ier siècle av. J.-C.–Ier siècle apr. J.-C.
    4 Maccabees:
      display_name: 4 Maccabées
      author: Anonyme ; auteur juif de langue grecque influencé par la philosophie stoïcienne.
      audience: Les Juifs hellénistiques — sermon philosophique sur la raison qui maîtrise les passions grâce à la fidélité.
      date: Env. Ier siècle apr. J.-C.
    Bel and the Dragon:
      display_name: Bel et le Dragon
      author: Anonyme ; l’un des ajouts grecs à Daniel.
      audience: Les Juifs de langue grecque — polémique satirique contre l’idolâtrie.
      date: Env. IIe–Ier siècle av. J.-C.
    Letter of Jeremiah:
      display_name: Lettre de Jérémie
      author: Anonyme ; attribuée sous pseudonyme à Jérémie.
      audience: Les Juifs de la diaspora tentés par l’idolâtrie environnante.
      date: Env. IVe–IIe siècle av. J.-C.
    Prayer of Azariah and Song of the Three:
      display_name: Prière d’Azarias et Cantique des trois jeunes gens
      author: Anonyme ; l’un des ajouts grecs à Daniel.
      audience: Les Juifs de langue grecque — texte liturgique destiné à Daniel 3.
      date: Env. IIe siècle av. J.-C.
    Susanna:
      display_name: Suzanne
      author: Anonyme ; l’un des ajouts grecs à Daniel.
      audience: Les Juifs de langue grecque — récit où la justice triomphe et le faux témoignage est dénoncé.
      date: Env. IIe–Ier siècle av. J.-C.
    1 Clement:
      display_name: 1 Clément
      author: Anonyme, attribué à Clément de Rome.
      audience: L’assemblée chrétienne de Corinthe, aux prises avec un conflit de direction.
      date: Env. 96 apr. J.-C.
