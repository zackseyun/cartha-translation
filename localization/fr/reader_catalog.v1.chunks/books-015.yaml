payload:
  book_metadata:
    1 Esdras:
      display_name: 1 Esdras
      author: Anonyme ; recomposition grecque réorganisant 2 Chroniques 35–36, Esdras et Néhémie 7–8.
      audience: Les Juifs de l’époque hellénistique qui souhaitaient un récit clair du retour et de la restauration.
      date: Vers le IIe–Ier siècle av. J.-C.
    Prayer of Manasseh:
      display_name: Prière de Manassé
      author: Anonyme ; attribuée sous pseudonyme au roi Manassé.
      audience: Les personnes pénitentes qui s’identifiaient au repentir de Manassé — texte employé dans la liturgie de certaines traditions.
      date: Vers le IIe–Ier siècle av. J.-C.
    Psalm 151:
      display_name: Psaume 151
      author: Anonyme ; attribué sous pseudonyme à David. Une forme hébraïque est attestée dans 11QPsa.
      audience: Les communautés de la diaspora et de Qumrân attachées au psautier de David.
      date: Vers le IIe siècle av. J.-C. ou avant.
    3 Maccabees:
      display_name: 3 Maccabées
      author: Anonyme ; composé en grec.
      audience: Les Juifs d’Égypte de langue grecque vivant dans la diaspora — récit de délivrance situé sous le règne de Ptolémée IV.
      date: Vers le Ier siècle av. J.-C.–Ier siècle apr. J.-C.
    4 Maccabees:
      display_name: 4 Maccabées
      author: Anonyme ; auteur juif de langue grecque influencé par la philosophie stoïcienne.
      audience: Les Juifs hellénistiques — discours philosophique sur la raison qui maîtrise les passions grâce à la fidélité.
      date: Vers le Ier siècle apr. J.-C.
    Bel and the Dragon:
      display_name: Bel et le Dragon
      author: Anonyme ; l’un des ajouts grecs au livre de Daniel.
      audience: Les Juifs de langue grecque — polémique satirique contre l’idolâtrie.
      date: Vers le IIe–Ier siècle av. J.-C.
    Letter of Jeremiah:
      display_name: Lettre de Jérémie
      author: Anonyme ; attribuée sous pseudonyme à Jérémie.
      audience: Les Juifs de la diaspora tentés par l’idolâtrie environnante.
      date: Vers le IVe–IIe siècle av. J.-C.
    Prayer of Azariah and Song of the Three:
      display_name: Prière d’Azaria et Cantique des trois jeunes gens
      author: Anonyme ; l’un des ajouts grecs au livre de Daniel.
      audience: Les Juifs de langue grecque — texte liturgique associé à Daniel 3.
      date: Vers le IIe siècle av. J.-C.
    Susanna:
      display_name: Suzanne
      author: Anonyme ; l’un des ajouts grecs au livre de Daniel.
      audience: Les Juifs de langue grecque — récit où la justice triomphe et le faux témoignage est condamné.
      date: Vers le IIe–Ier siècle av. J.-C.
    1 Clement:
      display_name: 1 Clément
      author: Anonyme, attribué à Clément de Rome.
      audience: L’assemblée chrétienne de Corinthe, aux prises avec un conflit de direction.
      date: Vers 96 apr. J.-C.
