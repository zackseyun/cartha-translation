    Proverbs:
      display_name: Proverbes
      author: Une anthologie ; les suscriptions nomment Salomon, Agour, Lemouel et « les sages ».
      audience: De jeunes Israélites formés à la sagesse pour la vie quotidienne.
      date: Couches de composition datant d’environ le Xe au IVe siècle av. J.-C.
    Ecclesiastes:
      display_name: Ecclésiaste
      author: Auteur anonyme ; le locuteur est « Qohélet », traditionnellement identifié à Salomon.
      audience: Des Israélites confrontés aux limites de la sagesse, de la richesse et des efforts sous le soleil.
      date: Probablement entre le Ve et le IIIe siècle av. J.-C., d’après l’hébreu influencé par l’araméen.
    Song of Solomon:
      display_name: Cantique des cantiques
      author: Auteur anonyme ; la suscription évoque Salomon.
      audience: Israël, qui lit l’amour érotique comme une manière d’éclairer l’intimité de l’alliance — puis, plus tard, les lecteurs juifs et chrétiens qui en font une lecture allégorique.
      date: Probablement après l’exil, entre le Ve et le IIIe siècle av. J.-C.
