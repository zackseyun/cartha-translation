payload:
  book_metadata:
    James:
      display_name: Jacques
      author: Traditionnellement attribuée à Jacques, le frère de Jésus ; les chercheurs modernes sont partagés entre une attribution authentique et une attribution pseudonyme.
      audience: Assemblées judéo-chrétiennes de la diaspora.
      date: Vers les années 50–60 apr. J.-C. si l’attribution est authentique ; vers la fin du Ier siècle apr. J.-C. si l’œuvre est pseudonyme.
    1 Peter:
      display_name: 1 Pierre
      author: Traditionnellement attribuée à l’apôtre Pierre, avec Silvain comme secrétaire ; certains chercheurs la considèrent comme pseudonyme.
      audience: Chrétiens d’Asie Mineure romaine confrontés à l’hostilité sociale.
      date: Vers les années 60 apr. J.-C. si l’épître est de Pierre ; vers les années 70–90 apr. J.-C. si elle est pseudonyme.
    2 Peter:
      display_name: 2 Pierre
      author: Traditionnellement attribuée à Pierre ; les chercheurs modernes la considèrent généralement comme pseudonyme.
      audience: Chrétiens confrontés à des moqueurs qui nient la parousie.
      date: Vers le début du IIe siècle apr. J.-C.
    1 John:
      display_name: 1 Jean
      author: Anonyme ; traditionnellement attribuée à l’apôtre Jean ou à l’Ancien johannique.
      audience: Communauté johannique après une scission, cherchant à définir qui lui appartient.
      date: Vers 90–110 apr. J.-C.
    2 John:
      display_name: 2 Jean
      author: « L’Ancien ».
      audience: Une assemblée chrétienne particulière (« la dame élue »), mise en garde contre de faux enseignants.
      date: Vers 90–110 apr. J.-C.
    3 John:
      display_name: 3 Jean
      author: « L’Ancien ».
      audience: Gaïus, un responsable qui accueille des missionnaires itinérants.
      date: Vers 90–110 apr. J.-C.
    Jude:
      display_name: Jude
      author: Traditionnellement attribuée à Jude, frère de Jacques et de Jésus.
      audience: Communautés chrétiennes infiltrées par des enseignants aux mœurs dissolues.
      date: Vers les années 60–90 apr. J.-C.
    Revelation:
      display_name: Apocalypse
      author: Jean de Patmos (dont le style diffère de celui du quatrième Évangile).
      audience: Sept assemblées chrétiennes d’Asie Mineure romaine soumises à la pression impériale.
      date: Vers les années 90 apr. J.-C., traditionnellement sous le règne de Domitien.
    Tobit:
      display_name: Tobie
      author: Anonyme.
      audience: Juifs de la diaspora cherchant à vivre la piété, le mariage et la providence sous une domination étrangère.
      date: Vers 225–175 av. J.-C. ; composé en araméen, avec une version hébraïque également attestée à Qumrân.
    Judith:
      display_name: Judith
      author: Anonyme.
      audience: Juifs menacés par une puissance étrangère — un récit audacieux de résistance pieuse.
      date: Vers 150–100 av. J.-C.
    Greek Additions to Esther:
      display_name: Ajouts grecs à Esther
      author: Anonyme ; textes complémentaires ajoutés dans la traduction grecque d’Esther.
      audience: Juifs de langue grecque souhaitant un récit d’Esther où la prière et les références à Dieu sont explicites.
      date: Vers les IIe–Ier siècles av. J.-C.
    Wisdom of Solomon:
      display_name: Sagesse de Salomon
      author: Anonyme ; attribuée à Salomon sous un pseudonyme. Composée en grec par un auteur juif hellénistique, probablement à Alexandrie.
      audience: Juifs hellénistiques en dialogue avec la philosophie grecque et défendant la sagesse d’Israël face aux autres voies, païennes ou apostates.
      date: Vers 50 av. J.-C. – 50 apr. J.-C.
