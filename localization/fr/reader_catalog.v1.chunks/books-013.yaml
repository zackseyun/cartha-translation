review:
  verdict: revise
  review_summary: Chunk complet révisé. Corrections apportées à quelques titres qui ajoutaient un référent absent de la source, inversaient le sujet, ou modifiaient le sens.
  issues:
  - '1 Pierre 5: suppression de l’ajout « du troupeau » et de la possession non exprimée dans la source.'
  - '1 Jean 5: correction pour conserver l’affirmation que Jésus a la vie éternelle, plutôt qu’une promesse de la recevoir.'
  - 'Apocalypse 5: suppression de l’ajout « son peuple ».'
  - 'Apocalypse 10: correction de « le délai est achevé », qui ne rendait pas « Final Time ».'
  - 'Tobie 9: formulation rétablie afin que Gabaël rende l’argent à Tobit.'
  - 'Judith 6: correction de l’inversion entre Achior et Holopherne.'
