review:
  verdict: revise
  review_summary: Correction complète effectuée. Les erreurs de sens relevées concernaient notamment l’issue de l’épreuve de Joseph et Marie, le lit achevé par Joseph avec Jésus, ainsi qu’une formulation non justifiée au sujet de Thècle et du voile.
  issues:
  - 'Protoevangelium of James 16: la formulation assimilait l’issue à une disculpation conjointe plutôt qu’à la libération de Marie par Joseph après l’épreuve.'
  - 'Infancy Gospel of Thomas 13: le sujet et l’action de Joseph achevant le lit avec Jésus n’étaient pas rendus fidèlement.'
  - 'Acts of Paul and Thecla 11: « derrière un voile » ajoutait un détail absent du titre source.'
