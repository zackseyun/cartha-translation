review:
  verdict: revise
  review_summary: Révision complète effectuée. Les traductions sont globalement fidèles ; quelques titres ont été ajustés afin d’éviter des ajouts interprétatifs, de conserver précisément le sens de l’anglais et de corriger une construction grammaticale.
  issues:
  - Protoevangelium of James 16 ajoutait l’idée que Joseph était disculpé et repartait avec Marie, absente de la source.
  - Acts of Paul and Thecla 2 interprétait « longs Paul » comme le désir de rejoindre Paul ; formulation rendue plus directe.
  - Acts of Paul and Thecla 10 corrige « enseigne les femmes » en « enseigne aux femmes ».
  - Plusieurs titres ont été légèrement resserrés pour correspondre plus directement au libellé canonique anglais.
