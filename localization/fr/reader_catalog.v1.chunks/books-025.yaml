  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Évangile de l’enfance selon Thomas
      author: Anonyme. La forme la plus ancienne que l’on puisse reconstituer ne nomme aucun auteur ; l’attribution à Thomas provient de titres de manuscrits et d’une transmission plus tardifs.
      audience: Des chrétiens curieux de l’enfance de Jésus et de la manière dont la puissance divine, la discipline, l’apprentissage et la maturation pouvaient être racontés avant le début des récits des Évangiles canoniques.
      date: On le fait généralement remonter au IIe siècle apr. J.-C., mais le texte nous est parvenu dans plusieurs recensions grecques sensiblement différentes ainsi que dans des traductions anciennes.
    Acts of Paul and Thecla:
      display_name: Actes de Paul et de Thècle
      author: Anonyme. Il s’agit d’un épisode des Actes de Paul, œuvre plus vaste ; un témoignage ancien selon lequel un presbytre aurait composé les Actes ne permet pas d’identifier l’auteur avec certitude.
      audience: Des chrétiens attirés par les récits de prédication apostolique, de célibat, de baptême, d’endurance comparable à celle des martyrs, ainsi que par l’autorité d’une femme pour enseigner et témoigner.
      date: Composé au IIe siècle apr. J.-C., probablement dans la seconde moitié de ce siècle ; il a circulé à la fois au sein des Actes de Paul et comme œuvre indépendante.
    Gospel of Peter:
      display_name: Évangile de Pierre
      author: Anonyme. Le récit conservé fait parler Pierre à la première personne et a été transmis sous son nom, mais il n’est pas considéré comme une œuvre de l’apôtre historique.
      audience: Des chrétiens des premiers temps intéressés par un récit développé de la Passion et de la résurrection, probablement au sein de communautés où l’autorité de Pierre revêtait une importance particulière.
      date: Généralement daté du IIe siècle apr. J.-C. ; le principal fragment grec conservé provient d’un manuscrit bien plus tardif découvert à Akhmîm.
    2 Clement:
      display_name: 2 Clément
      author: Anonyme. Malgré son titre traditionnel, il s’agit d’une ancienne homélie chrétienne, et non d’une deuxième lettre de Clément de Rome.
      audience: Une assemblée chrétienne exhortée à la repentance, à la cohérence morale, au soin des personnes vulnérables et à une persévérance fidèle dans l’espérance de la résurrection et du jugement.
      date: Généralement daté de la première moitié ou du milieu du IIe siècle apr. J.-C. (environ 100–160) ; son lieu de composition reste incertain.
    Epistle of Barnabas:
      display_name: Épître de Barnabé
      author: Anonyme. L’œuvre a traditionnellement été associée à Barnabé, compagnon de Paul, mais la recherche moderne ne retient pas cette attribution.
      audience: Des chrétiens non juifs auxquels on enseignait à s’approprier les Écritures d’Israël au moyen d’une interprétation christologique et allégorique, tout en distinguant leur identité d’alliance des pratiques juives.
      date: Généralement datée entre la destruction du temple de Jérusalem en 70 apr. J.-C. et le début du IIe siècle, souvent vers 80–130.
