    Lamentations:
      display_name: Lamentations
      author: Anonyme ; la tradition l’attribue à Jérémie.
      audience: Les Judéens qui pleurent la destruction de Jérusalem en 586 av. J.-C.
      date: Peu après 586 av. J.-C.
    Ezekiel:
      display_name: Ézéchiel
      author: Ézéchiel, prêtre exilé à Babylone ; avec un développement rédactionnel ultérieur.
      audience: Les exilés judéens à Babylone, repensant la présence de Dieu loin du temple.
      date: Vers 593–571 av. J.-C. pour le ministère du prophète ; forme finale quelque peu postérieure.
    Daniel:
      display_name: Daniel
      author: Anonyme ; l’ouvrage se présente comme l’œuvre de Daniel, à l’époque de l’exil.
      audience: Les Juifs persécutés à l’époque hellénistique — en particulier sous Antiochos IV Épiphane (167–164 av. J.-C.).
      date: A atteint sa forme reçue vers 165 av. J.-C. ; les chapitres 1–6 intègrent des récits de cour plus anciens.
    Hosea:
      display_name: Osée
      author: Osée, fils de Bééri.
      audience: Le royaume du Nord, Israël, durant ses dernières décennies avant la conquête assyrienne.
      date: Vers 750–722 av. J.-C.
