  book_metadata:
    Genesis:
      display_name: Genèse
      author: Anonyme ; traditionnellement attribué à Moïse. La recherche moderne y voit le résultat d’une longue histoire de composition, au cours de laquelle des sources ont été réunies et remaniées ultérieurement.
      audience: Israël, dans son identité de peuple de l’alliance, dont le récit des origines est ancré dans la création, l’élection et la promesse de Dieu.
      date: Composé au fil des siècles ; a atteint sa forme reçue vers les VIe–Ve siècles av. J.-C., pendant ou après l’exil à Babylone.
      summary: La Genèse raconte la création, la rébellion et la dispersion de l’humanité, ainsi que l’histoire de la famille d’Abraham, d’Isaac, de Jacob et de Joseph, par laquelle commencent les promesses de l’alliance de Dieu avec Israël.
    Exodus:
      display_name: Exode
      author: Anonyme ; traditionnellement attribué à Moïse. La recherche moderne y voit le résultat d’une longue histoire de composition, au cours de laquelle des sources ont été réunies et remaniées ultérieurement.
      audience: Israël, peuple libéré et lié à Dieu par une alliance, qui apprend ce que signifie être la nation du SEIGNEUR sous sa loi.
      date: Composé au fil des siècles ; a atteint sa forme reçue vers les VIe–Ve siècles av. J.-C.
    Leviticus:
      display_name: Lévitique
      author: Anonyme ; traditionnellement attribué à Moïse. La recherche moderne le rattache à la source sacerdotale.
      audience: Les prêtres israélites et la communauté qui rend un culte à Dieu — des instructions sur les sacrifices, la sainteté et l’organisation de la vie autour de la présence de Dieu.
      date: Couches de composition allant de la fin de la monarchie à la période postexilique (vers les VIIe–Ve siècles av. J.-C.).
