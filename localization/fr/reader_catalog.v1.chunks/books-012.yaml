payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 Corinthiens
      author: Paul, avec Sosthène.
      audience: L’assemblée chrétienne de Corinthe, déchirée par des dissensions.
      date: Vers 53–55 apr. J.-C., écrite depuis Éphèse.
    2 Corinthians:
      display_name: 2 Corinthiens
      author: Paul, avec Timothée.
      audience: L’assemblée de Corinthe, après un conflit douloureux.
      date: Vers 55–56 apr. J.-C.
    Galatians:
      display_name: Galates
      author: Paul.
      audience: Les assemblées chrétiennes de Galatie (au centre de l’Anatolie), poussées à adopter la circoncision et l’observance de la Torah.
      date: Vers 48–55 apr. J.-C. (datation débattue).
    Ephesians:
      display_name: Éphésiens
      author: Paul, ou un proche disciple écrivant en son nom (question débattue).
      audience: Un lectorat chrétien assez large en Asie ; le nom de lieu « Éphèse » est absent des manuscrits les plus anciens.
      date: Vers les années 60 apr. J.-C. si la lettre est de Paul ; vers les années 80–90 si elle est pseudonyme.
    Philippians:
      display_name: Philippiens
      author: Paul, avec Timothée.
      audience: L’assemblée chrétienne de Philippes, colonie romaine de Macédoine.
      date: Vers 60–62 apr. J.-C., écrite depuis la prison.
    Colossians:
      display_name: Colossiens
      author: Paul, avec Timothée — ou un proche disciple écrivant au nom de Paul (question débattue).
      audience: Les chrétiens de Colosses, dans la vallée du Lycos, confrontés à un enseignement syncrétique.
      date: Vers 60–62 apr. J.-C. si la lettre est de Paul ; plus tard si elle est pseudonyme.
    1 Thessalonians:
      display_name: 1 Thessaloniciens
      author: Paul, avec Silas et Timothée.
      audience: La jeune assemblée chrétienne de Thessalonique, confrontée à la persécution.
      date: Vers 50–51 apr. J.-C. — probablement la plus ancienne lettre de Paul qui nous soit parvenue.
    2 Thessalonians:
      display_name: 2 Thessaloniciens
      author: Paul (attribution débattue ; certains spécialistes considèrent la lettre comme pseudonyme).
      audience: L’assemblée de Thessalonique, confrontée à une confusion au sujet de la fin des temps.
      date: Vers 51 apr. J.-C. si la lettre est de Paul.
    1 Timothy:
      display_name: 1 Timothée
      author: Paul, ou un disciple écrivant en son nom (les épîtres pastorales sont largement considérées comme pseudonymes).
      audience: Timothée, délégué de Paul à Éphèse ; un manuel d’orientation pour l’organisation ultérieure de l’Église.
      date: Vers le milieu des années 60 apr. J.-C. si la lettre est de Paul ; vers 90–110 apr. J.-C. si elle est pseudonyme.
    2 Timothy:
      display_name: 2 Timothée
      author: Paul, ou un disciple écrivant en son nom.
      audience: Timothée — la lettre se présente comme les adieux de Paul depuis la prison.
      date: Vers le milieu des années 60 apr. J.-C. si la lettre est de Paul ; vers 90–110 apr. J.-C. si elle est pseudonyme.
    Titus:
      display_name: Tite
      author: Paul, ou un disciple écrivant en son nom.
      audience: Tite, délégué de Paul en Crète.
      date: Vers le milieu des années 60 apr. J.-C. si la lettre est de Paul ; vers 90–110 apr. J.-C. si elle est pseudonyme.
    Philemon:
      display_name: Philémon
      author: Paul, avec Timothée.
      audience: Philémon, chrétien propriétaire d’esclaves, au sujet d’Onésime, son esclave en fuite.
      date: Vers 60–62 apr. J.-C.
    Hebrews:
      display_name: Hébreux
      author: Auteur anonyme. La tradition a proposé Paul, Apollos, Barnabé, Priscille et d’autres ; aucune hypothèse ne fait consensus.
      audience: Des chrétiens juifs de langue grecque tentés de s’éloigner de leur confession chrétienne pour revenir en arrière.
      date: Vers 60–95 apr. J.-C.
