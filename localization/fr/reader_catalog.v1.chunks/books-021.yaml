  book_metadata:
    Thunder, Perfect Mind:
      display_name: Le Tonnerre, intellect parfait
      author: Anonyme.
      audience: Un lectorat gréco-égyptien intéressé par la sagesse ou la gnose ; poème d’autorévélation au féminin, prononcé par une figure divine féminine.
      date: Probablement vers le Ier ou le IIe siècle apr. J.-C. ; conservé à Nag Hammadi (NHC VI,2).
    Testament of Reuben:
      display_name: Testament de Ruben
      author: Anonyme ; fait partie des Testaments des douze patriarches, présentés comme les discours d’adieu des fils de Jacob sur leur lit de mort.
      audience: Des lecteurs juifs, puis chrétiens, recevant un enseignement moral à partir des confessions des patriarches.
      date: Noyau juif préchrétien datant approximativement du IIe siècle av. J.-C. ; couche éditoriale chrétienne datant approximativement du Ier ou du IIe siècle apr. J.-C.
    Testament of Simeon:
      display_name: Testament de Siméon
      author: Anonyme ; fait partie des Testaments des douze patriarches.
      audience: Des lecteurs juifs, puis chrétiens.
      date: Noyau juif datant approximativement du IIe siècle av. J.-C. ; remaniement chrétien datant approximativement du Ier ou du IIe siècle apr. J.-C.
    Testament of Levi:
      display_name: Testament de Lévi
      author: Anonyme ; fait partie des Testaments des douze patriarches.
      audience: Des lecteurs juifs, puis chrétiens ; en particulier des communautés s’intéressant au sacerdoce.
      date: Noyau juif datant approximativement du IIe siècle av. J.-C. ; remaniement chrétien datant approximativement du Ier ou du IIe siècle apr. J.-C.
    Testament of Judah:
      display_name: Testament de Juda
