payload:
  book_metadata:
    Joel:
      display_name: Joël
      author: Joël, fils de Petouël.
      audience: Les habitants de Juda après l’exil, confrontés à une invasion de criquets considérée comme un signe du jour du SEIGNEUR.
      date: Probablement vers le Ve ou le IVe siècle av. J.-C.
    Amos:
      display_name: Amos
      author: Amos de Tekoa, un berger judéen qui prêchait dans le royaume du Nord.
      audience: Le royaume du Nord, Israël, pendant une période de prospérité et d’injustice sous Jéroboam II.
      date: Vers 760-750 av. J.-C.
    Obadiah:
      display_name: Abdias
      author: Abdias.
      audience: Les habitants de Juda après la trahison de Jérusalem par Édom — une prophétie annonçant la chute d’Édom.
      date: Peu après 586 av. J.-C.
    Jonah:
      display_name: Jonas
      author: Auteur anonyme ; le personnage principal est Jonas, fils d’Amittaï.
      audience: Israël après l’exil — une critique satirique du repli ethnique et une affirmation de la compassion de Dieu envers les étrangers.
      date: Probablement vers le Ve ou le IVe siècle av. J.-C.
    Micah:
      display_name: Michée
      author: Michée de Morésheth.
      audience: Les habitants de Juda à la fin du VIIIe siècle av. J.-C., en particulier les populations rurales pauvres, face aux élites urbaines.
      date: Vers 740-700 av. J.-C.
    Nahum:
      display_name: Nahoum
      author: Nahoum d’Elqosh.
      audience: Les habitants de Juda se réjouissant de la chute imminente de Ninive.
      date: Peu avant 612 av. J.-C.
    Habakkuk:
      display_name: Habacuc
      author: Habacuc.
      audience: Les habitants de Juda confrontés à la montée en puissance de Babylone — un dialogue du prophète avec Dieu au sujet de la justice.
      date: Vers la fin du VIIe siècle av. J.-C.
    Zephaniah:
      display_name: Sophonie
      author: Sophonie, fils de Koushi.
      audience: Les habitants de Juda sous Josias, à la veille de ses réformes.
      date: Vers 640-609 av. J.-C.
    Haggai:
      display_name: Aggée
      author: Aggée.
      audience: Les exilés revenus au pays qui reconstruisaient le temple sous Darius.
      date: 520 av. J.-C.
    Zechariah:
      display_name: Zacharie
      author: Zacharie, fils de Bérékia ; les chapitres 9 à 14 proviennent probablement d’un auteur plus tardif.
      audience: Les exilés revenus au pays qui reconstruisaient le temple, puis les communautés ultérieures de l’époque postexilique.
      date: Chapitres 1 à 8 vers 520-518 av. J.-C. ; chapitres 9 à 14, peut-être un siècle plus tard.
    Malachi:
      display_name: Malachie
      author: Auteur anonyme ; « Malachie » signifie « mon messager ».
      audience: Les habitants de Juda après l’exil, qui, sous la domination perse, se relâchaient dans leur culte et leur fidélité.
      date: Vers le milieu du Ve siècle av. J.-C.
    Matthew:
      display_name: Matthieu
      author: Auteur anonyme ; la tradition l’attribue à l’apôtre Matthieu. La recherche moderne y voit l’œuvre d’un auteur judéo-chrétien de langue grecque qui s’est appuyé sur Marc et sur une source semblable à Q.
      audience: Une communauté judéo-chrétienne aux prises avec les éléments de continuité et de rupture par rapport au judaïsme des synagogues.
      date: Vers 80-90 apr. J.-C.
    Mark:
      display_name: Marc
      author: Auteur anonyme ; la tradition l’associe à Jean-Marc, compagnon de voyage de Pierre.
      audience: Une communauté chrétienne de langue grecque, peut-être à Rome, exposée à la persécution ou à sa menace imminente.
      date: Vers 65-75 apr. J.-C., à l’époque de la guerre juive et de la destruction du temple.
