payload:
  book_metadata:
    Joel:
      display_name: Joël
      author: Joël, fils de Petouël.
      audience: Les habitants de Juda après l’exil, confrontés à une invasion de criquets perçue comme un signe du jour du SEIGNEUR.
      date: Probablement vers le Ve ou le IVe siècle av. J.-C.
    Amos:
      display_name: Amos
      author: Amos de Teqoa, un berger judéen qui prêchait dans le royaume du Nord.
      audience: Les habitants du royaume du Nord, Israël, pendant une période de prospérité et d’injustice sous Jéroboam II.
      date: Vers 760–750 av. J.-C.
    Obadiah:
      display_name: Abdias
      author: Abdias.
      audience: Les habitants de Juda après la trahison de Jérusalem par Édom — une prophétie annonçant la chute d’Édom.
      date: Peu après 586 av. J.-C.
    Jonah:
      display_name: Jonas
      author: Auteur anonyme ; le personnage principal est Jonas, fils d’Amittaï.
      audience: Les habitants d’Israël après l’exil — une critique satirique du repli ethnique et une affirmation de la miséricorde de Dieu envers les étrangers.
      date: Probablement vers le Ve ou le IVe siècle av. J.-C.
    Micah:
      display_name: Michée
      author: Michée de Morésheth.
      audience: Les habitants de Juda à la fin du VIIIe siècle av. J.-C., en particulier les ruraux pauvres opprimés par les élites urbaines.
      date: Vers 740–700 av. J.-C.
    Nahum:
      display_name: Nahoum
      author: Nahoum d’Elqosh.
      audience: Les habitants de Juda qui se réjouissaient de la chute prochaine de Ninive.
      date: Peu avant 612 av. J.-C.
    Habakkuk:
      display_name: Habacuc
      author: Habacuc.
      audience: Les habitants de Juda confrontés à la montée en puissance de Babylone — un dialogue entre un prophète et Dieu au sujet de la justice.
      date: Vers la fin du VIIe siècle av. J.-C.
    Zephaniah:
      display_name: Sophonie
      author: Sophonie, fils de Koushi.
      audience: Les habitants de Juda sous Josias, à la veille de ses réformes.
      date: Vers 640–609 av. J.-C.
    Haggai:
      display_name: Aggée
      author: Aggée.
      audience: Les exilés revenus au pays qui reconstruisaient le temple sous Darius.
      date: 520 av. J.-C.
    Zechariah:
      display_name: Zacharie
      author: Zacharie, fils de Bérékia ; les chapitres 9–14 proviennent probablement d’un auteur plus tardif.
      audience: Les exilés revenus au pays qui reconstruisaient le temple, ainsi que des communautés postexiliques plus tardives.
      date: Chapitres 1–8 vers 520–518 av. J.-C. ; chapitres 9–14, peut-être un siècle plus tard.
    Malachi:
      display_name: Malachie
      author: Auteur anonyme ; « Malachie » signifie « mon messager ».
      audience: Les habitants de Juda après l’exil, devenus négligents dans le culte et la fidélité sous la domination perse.
      date: Vers le milieu du Ve siècle av. J.-C.
    Matthew:
      display_name: Matthieu
      author: Auteur anonyme ; la tradition l’attribue à l’apôtre Matthieu. Les chercheurs modernes y voient l’œuvre d’un auteur judéo-chrétien de langue grecque, qui s’est appuyé sur Marc et sur une source semblable à Q.
      audience: Une communauté judéo-chrétienne aux prises avec les continuités et les ruptures par rapport au judaïsme des synagogues.
      date: Vers 80–90 apr. J.-C.
    Mark:
      display_name: Marc
      author: Auteur anonyme ; la tradition le rattache à Jean Marc, compagnon de voyage de Pierre.
      audience: Une communauté chrétienne de langue grecque, peut-être à Rome, soumise à la persécution ou vivant sous sa menace imminente.
      date: Vers 65–75 apr. J.-C., à l’époque de la guerre judéo-romaine et de la destruction du temple.
