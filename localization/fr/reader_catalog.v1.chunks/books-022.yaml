      display_name: Évangile de Philippe
      author: Anonyme. Le titre figure dans la souscription finale du manuscrit, mais l’œuvre ne désigne pas Philippe comme son auteur. Le seul exemplaire conservé est le texte copte du codex II,3 de Nag Hammadi.
      audience: Une communauté chrétienne ancienne familière d’un enseignement sacramentel de type valentinien, en particulier sur le baptême, l’onction, l’eucharistie, la rédemption, la résurrection et l’imagerie de la chambre nuptiale.
      date: Généralement daté de la fin du IIe ou du début du IIIe siècle apr. J.-C. ; conservé dans un manuscrit copte du IVe siècle, traduit d’une forme grecque antérieure.
