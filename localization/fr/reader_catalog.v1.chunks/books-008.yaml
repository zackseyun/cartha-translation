    Isaiah:
      display_name: Ésaïe
      author: Plusieurs auteurs au fil des siècles ; les chapitres 1 à 39 ont leurs racines dans l’œuvre d’Ésaïe de Jérusalem, au VIIIe siècle av. J.-C., tandis que les chapitres 40 à 55 (« Deuxième Ésaïe ») et 56 à 66 (« Troisième Ésaïe ») répondent aux situations de l’exil et du retour.
      audience: Successivement, Juda sous la menace assyrienne, les exilés à Babylone et la communauté de la restauration après l’exil.
      date: Composé entre la fin du VIIIe siècle environ et le Ve siècle av. J.-C.
    Jeremiah:
      display_name: Jérémie
      author: Jérémie d’Anatoth ; révision substantielle par son secrétaire Baruch et par des rédacteurs ultérieurs.
      audience: Juda à la veille de la conquête babylonienne, pendant celle-ci et après.
      date: De la fin du VIIe au début du VIe siècle av. J.-C.
