review:
  verdict: revise
  review_summary: Traduction complète et globalement fidèle, avec quelques corrections ciblées pour une correspondance plus directe au canon, notamment dans les titres d’Ésaïe 8–9 et Jérémie 32.
  issues:
  - 'Isaiah 8: formulation resserrée pour rendre directement « Names Judgment » sans ajout interprétatif.'
  - 'Isaiah 9: suppression de l’ajout peu naturel « selon Ésaïe » et restitution du nom présent dans le titre source.'
  - 'Jeremiah 32: « land » rendu par « terrain », plutôt que le plus spécifique « champ ».'
  - Ajustements mineurs de fidélité et de style dans les métadonnées et certains titres.
