    Isaiah:
      display_name: Ésaïe
      author: Plusieurs auteurs au fil des siècles ; les chapitres 1 à 39 trouvent leur origine chez Ésaïe de Jérusalem au VIIIe siècle av. J.-C., tandis que les chapitres 40 à 55 (« Deuxième Ésaïe ») et 56 à 66 (« Troisième Ésaïe ») répondent à l’exil et au retour.
      audience: Successivement, Juda sous la menace assyrienne, pendant l’exil babylonien et lors de la restauration après l’exil.
      date: Composé entre la fin du VIIIe siècle et le Ve siècle av. J.-C. environ.
    Jeremiah:
      display_name: Jérémie
      author: Jérémie d’Anatoth ; révision importante par son scribe Baruch et par des rédacteurs ultérieurs.
      audience: Juda à la veille de la conquête babylonienne, pendant celle-ci et après.
      date: De la fin du VIIe siècle au début du VIe siècle av. J.-C.
