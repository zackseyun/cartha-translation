review:
  verdict: revise
  review_summary: Révision complète effectuée. Les traductions sont fidèles dans l’ensemble ; quelques formulations ont été ajustées afin de restituer plus précisément le sens canonique sans ajout interprétatif.
  issues:
  - 'Ésaïe 24 : « implacable » ne rendait pas explicitement l’ampleur (« sweeping total ») du jugement ; titre corrigé.'
  - 'Ésaïe 39 : « découvre » a été remplacé par « voit » pour correspondre à « sees ».'
  - 'Jérémie 8 : « complet » a été précisé par « achevé » pour rendre « is complete ».'
  - 'Jérémie 32 : « en signe d’espérance » ajoutait un élément absent de la source ; remplacé par « dans l’espérance ».'
