  - 'Gospel of the Egyptians 8 : le possessif « sa » n’était pas exprimé par la source ; formulation rendue neutre.'
  - 'Protoevangelium of James 5–7 : des précisions ou réagencements non présents dans les titres anglais ont été retirés.'
