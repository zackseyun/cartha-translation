payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: L’Hypostase des archontes
      author: Anonyme. L’auteur interprète la Genèse au moyen d’un mythe révélateur sur les archontes ; l’œuvre ne peut être attribuée avec certitude à aucun maître nommé.
      audience: Des chrétiens issus d’un milieu séthien ou apparenté, qui lisaient la Genèse comme un conflit entre des dirigeants cosmiques ignorants, la sagesse divine et l’origine spirituelle de l’humanité.
      date: L’œuvre est généralement située au IIIe siècle apr. J.-C. ; elle est conservée dans une copie copte du IVe siècle, au sein du codex II de Nag Hammadi.
    On the Origin of the World:
      display_name: De l’origine du monde
      author: Anonyme. L’œuvre combine et remanie plusieurs traditions juives, chrétiennes, platoniciennes et mythologiques, sans nommer la personne qui les a compilées.
      audience: Des lecteurs appartenant à un milieu chrétien aux tendances gnostiques, qui cherchaient une autre histoire de la création, des dirigeants cosmiques, de Sophia, d’Adam et Ève, ainsi que de la destinée finale du monde.
      date: L’œuvre est habituellement datée du IIIe siècle apr. J.-C., bien qu’elle puisse reposer sur des matériaux plus anciens ; elle est principalement conservée dans des témoins coptes du IVe siècle.
    Sophia of Jesus Christ:
      display_name: La Sagesse de Jésus-Christ
      author: Anonyme. L’auteur adapte des éléments également connus par Eugnoste pour en faire un dialogue entre Jésus ressuscité et ses disciples.
      audience: Des chrétiens intéressés par une sagesse révélée concernant le Dieu transcendant, l’organisation du monde céleste, ainsi que l’origine et le salut de l’âme.
      date: L’œuvre est souvent datée de la fin du IIe ou du IIIe siècle apr. J.-C. ; elle est conservée dans des copies coptes provenant de Nag Hammadi et du codex de Berlin.
    Gospel of the Egyptians:
      display_name: Évangile des Égyptiens
      author: Anonyme. Cette œuvre de Nag Hammadi, également appelée Livre sacré du Grand Esprit invisible, se distingue de l’Évangile grec des Égyptiens, plus ancien et connu uniquement par des citations.
      audience: Une communauté chrétienne séthienne qui employait des mythes complexes, des noms sacrés, des images baptismales et des louanges de forme hymnique pour exprimer son identité spirituelle et sa délivrance.
      date: L’œuvre est généralement attribuée au IIe ou au IIIe siècle apr. J.-C. ; deux copies coptes subsistent dans des codex de Nag Hammadi du IVe siècle.
    Letter of Peter to Philip:
      display_name: Lettre de Pierre à Philippe
      author: Anonyme. La brève lettre d’ouverture et la révélation qui la suit sont attribuées sous pseudonyme à Pierre et à Philippe, plutôt que rédigées avec certitude par l’un ou l’autre apôtre.
      audience: Des chrétiens cherchant une autorité apostolique pour un enseignement sur le Sauveur, les puissances hostiles, la souffrance, la mission et le rétablissement des disciples.
      date: L’œuvre est généralement datée de la fin du IIe ou du début du IIIe siècle apr. J.-C. ; elle est conservée dans une copie de Nag Hammadi du IVe siècle et dans un témoin copte plus tardif.
    Gospel of Judas:
      display_name: Évangile de Judas
      author: Anonyme. Le titre attribue le récit à Judas, mais l’œuvre ne permet pas d’établir que Judas Iscariote en soit l’auteur historique.
      audience: Un groupe chrétien critique envers les pratiques sacrificielles et ecclésiales de groupes rivaux, qui recourait au dialogue révélateur et à une cosmologie de type séthien pour réinterpréter Judas et la mort de Jésus.
      date: L’œuvre est habituellement datée du milieu ou de la fin du IIe siècle apr. J.-C. ; Irénée connaissait un Évangile de Judas vers 180, et la copie copte conservée date probablement du IIIe ou du IVe siècle.
    Protoevangelium of James:
      display_name: Protoévangile de Jacques
      author: Anonyme. Le narrateur affirme être Jacques, mais l’œuvre est pseudonyme et n’a pas été écrite par Jacques, le frère de Jésus.
      audience: Des chrétiens intéressés par la naissance et l’éducation de Marie, sa pureté perpétuelle, la nativité de Jésus et des réponses narratives aux questions laissées ouvertes par Matthieu et Luc.
      date: L’œuvre est généralement datée de la seconde moitié du IIe siècle apr. J.-C. ; elle subsiste dans de nombreux manuscrits grecs plus tardifs et dans des traductions anciennes.
