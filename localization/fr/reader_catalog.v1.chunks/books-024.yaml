review:
  verdict: revise
  review_summary: Traduction intégralement révisée. Les principaux ajustements corrigent quelques glissements de sens dans les titres, notamment « teacher » rendu par « maître », l’assurance d’Éléleth, et l’infinitif final de Sophia de Jésus-Christ.
  issues:
  - Quelques titres employaient « maître » pour « ruler », ce qui est moins fidèle et ambigu ; « souverain » est retenu.
  - On the Origin of the World 15 confondait l’enseignant avec le souverain et atténuait « exposes ».
  - Hypostasis of the Archons 9 rendait « assures » par « révèle ».
  - Sophia of Jesus Christ 10 rendait l’infinitif anglais comme un impératif français.
  - Quelques formulations de titres du Protévangile ont été resserrées pour suivre le sens source sans ajout.
