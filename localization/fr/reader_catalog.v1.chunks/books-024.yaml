payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: L’Hypostase des archontes
      author: Anonyme. L’auteur interprète la Genèse au moyen d’un mythe révélateur sur les archontes ; l’œuvre ne peut être attribuée avec certitude à aucun maître connu.
      audience: Des chrétiens issus d’un milieu séthien ou apparenté, qui lisaient la Genèse comme un conflit entre des souverains cosmiques ignorants, la sagesse divine et l’origine spirituelle de l’humanité.
      date: Généralement datée du IIIe siècle apr. J.-C. ; conservée dans une copie copte du IVe siècle, dans le codex II de Nag Hammadi.
    On the Origin of the World:
      display_name: De l’origine du monde
      author: Anonyme. L’œuvre combine et remanie plusieurs traditions juives, chrétiennes, platoniciennes et mythologiques sans nommer la personne qui les a compilées.
      audience: Des lecteurs vivant dans un milieu chrétien marqué par la pensée gnostique et recherchant une autre histoire de la création, des souverains cosmiques, de Sophia, d’Adam et Ève, ainsi que de la destinée finale du monde.
      date: Généralement datée du IIIe siècle apr. J.-C., bien qu’elle puisse reposer sur des matériaux plus anciens ; conservée principalement dans des témoins coptes du IVe siècle.
    Sophia of Jesus Christ:
      display_name: La Sagesse de Jésus-Christ
      author: Anonyme. L’auteur adapte des éléments également connus par Eugnoste pour en faire un dialogue entre Jésus ressuscité et ses disciples.
      audience: Des chrétiens s’intéressant à une sagesse révélée sur le Dieu transcendant, l’organisation du monde céleste ainsi que l’origine et le salut de l’âme.
      date: Souvent datée de la fin du IIe ou du IIIe siècle apr. J.-C. ; conservée dans des copies coptes provenant de Nag Hammadi et du Codex de Berlin.
    Gospel of the Egyptians:
      display_name: Évangile des Égyptiens
      author: Anonyme. Cette œuvre de Nag Hammadi, également appelée Livre sacré du Grand Esprit invisible, est distincte de l’Évangile grec des Égyptiens, plus ancien et connu seulement par des citations.
      audience: Une communauté chrétienne séthienne qui recourait à des mythes complexes, à des noms sacrés, à des images baptismales et à des louanges de forme hymnique pour exprimer son identité spirituelle et sa délivrance.
      date: Généralement attribué au IIe ou au IIIe siècle apr. J.-C. ; deux copies coptes subsistent dans des codex de Nag Hammadi du IVe siècle.
    Letter of Peter to Philip:
      display_name: Lettre de Pierre à Philippe
      author: Anonyme. La brève lettre d’ouverture et la révélation qui suit sont attribuées sous pseudonyme à Pierre et à Philippe, mais rien ne permet de les considérer avec certitude comme l’œuvre de l’un ou l’autre apôtre.
      audience: Des chrétiens recherchant une autorité apostolique pour un enseignement sur le Sauveur, les puissances hostiles, la souffrance, la mission et le rétablissement des disciples.
      date: Généralement datée de la fin du IIe ou du début du IIIe siècle apr. J.-C. ; conservée dans une copie de Nag Hammadi du IVe siècle et dans un témoin copte plus tardif.
    Gospel of Judas:
      display_name: Évangile de Judas
      author: Anonyme. Le titre attribue le récit à Judas, mais l’œuvre n’établit pas que Judas Iscariote en soit l’auteur historique.
      audience: Un groupe chrétien critique envers les pratiques sacrificielles et ecclésiales d’autres communautés, qui recourait à un dialogue révélateur et à une cosmologie de type séthien pour réinterpréter Judas et la mort de Jésus.
      date: Généralement daté du milieu ou de la fin du IIe siècle apr. J.-C. ; Irénée connaissait un Évangile de Judas vers 180, et la copie copte conservée date probablement du IIIe ou du IVe siècle.
    Protoevangelium of James:
      display_name: Protévangile de Jacques
      author: Anonyme. Le narrateur prétend être Jacques, mais l’œuvre est pseudonyme et n’a pas été écrite par Jacques, le frère de Jésus.
      audience: Des chrétiens s’intéressant à la naissance et à l’éducation de Marie, à sa pureté perpétuelle, à la nativité de Jésus ainsi qu’aux réponses narratives apportées aux questions laissées ouvertes par Matthieu et Luc.
      date: Généralement daté de la seconde moitié du IIe siècle apr. J.-C. ; conservé dans de nombreux manuscrits grecs plus tardifs et dans des traductions anciennes.
