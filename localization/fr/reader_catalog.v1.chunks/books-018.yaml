payload:
  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Anonyme, avec un cadre remanié par des chrétiens autour d’un noyau d’origine juive (4 Esdras, chapitres 3 à 14).
      audience: Des Juifs qui, après 70 apr. J.-C., s’interrogeaient sur la justice de Dieu face au mal ; l’ouvrage a ensuite été enrichi à l’intention de lecteurs chrétiens.
      date: Noyau juif vers 100 apr. J.-C. ; ajouts chrétiens vers les IIe–IIIe siècles apr. J.-C.
    Didache:
      display_name: Didachè
      author: Anonyme (le titre signifie « Enseignement des douze apôtres »).
      audience: Les premières assemblées chrétiennes — un bref manuel portant sur l’éthique, le baptême, l’eucharistie et les enseignants itinérants.
      date: Vers la fin du Ier siècle ou le début du IIe siècle apr. J.-C.
    Gospel of Thomas:
      display_name: Évangile de Thomas
      author: Anonyme ; l’incipit attribue ce recueil de paroles à « Didyme Jude Thomas ». Le texte complet ne subsiste que dans une traduction copte du IVe siècle provenant de Nag Hammadi (NHC II,2), tandis que trois fragments grecs proviennent d’Oxyrhynque.
      audience: Un lectorat chrétien marqué par la sagesse syrienne et la pensée proto-gnostique, orienté vers une connaissance ésotérique de soi à travers les paroles de Jésus.
      date: Original grec probablement composé entre environ 50 et 140 apr. J.-C. ; manuscrit copte vers 340 apr. J.-C.
      summary: L’Évangile de Thomas est un recueil de paroles attribuées à Jésus. Il ne présente aucun récit suivi et invite à plusieurs reprises les lecteurs à découvrir le sens de ces paroles.
