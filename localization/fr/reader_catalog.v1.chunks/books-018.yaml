payload:
  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Anonyme, avec un cadre remanié par des chrétiens autour d’un noyau juif plus ancien (4 Esdras, chapitres 3 à 14).
      audience: Des Juifs qui, après 70 apr. J.-C., s’interrogeaient sur la justice de Dieu face au mal ; l’ouvrage a ensuite été augmenté à l’intention de lecteurs chrétiens.
      date: Noyau juif vers 100 apr. J.-C. ; ajouts chrétiens vers les IIe–IIIe siècles apr. J.-C.
    Didache:
      display_name: Didachè
      author: Anonyme (le titre signifie « Enseignement des douze apôtres »).
      audience: Les premières assemblées chrétiennes — un bref manuel sur l’éthique, le baptême, l’eucharistie et les enseignants itinérants.
      date: Vers la fin du Ier siècle ou le début du IIe siècle apr. J.-C.
    Gospel of Thomas:
      display_name: Évangile de Thomas
      author: Anonyme ; l’incipit attribue ce recueil de paroles à « Didyme Jude Thomas ». Le texte intégral ne subsiste que dans une traduction copte du IVe siècle de Nag Hammadi (NHC II,2), à laquelle s’ajoutent trois fragments grecs d’Oxyrhynque.
      audience: Un lectorat chrétien marqué par la sagesse syrienne et une pensée proto-gnostique, orienté vers une connaissance ésotérique de soi à travers les paroles de Jésus.
      date: Original grec probablement composé vers 50–140 apr. J.-C. ; manuscrit copte vers 340 apr. J.-C.
      summary: L’Évangile de Thomas est un recueil de paroles attribuées à Jésus. Il ne présente pas de récit suivi et invite à plusieurs reprises les lecteurs à découvrir le sens de ces paroles.
