  book_metadata:
    Gospel of Mary:
      display_name: Évangile de Marie
      author: Anonyme. L’œuvre présente Marie comme destinataire et interprète d’une révélation de Jésus, mais elle n’affirme pas que Marie a écrit l’évangile qui nous est parvenu.
      audience: Des lecteurs chrétiens des premiers siècles aux prises avec les questions de la révélation, de l’ascension spirituelle, de l’autorité apostolique et de la légitimité de l’enseignement de Marie parmi les disciples de Jésus.
      date: Généralement daté du IIe siècle apr. J.-C. ; des fragments grecs du IIIe siècle subsistent, et le principal témoin copte est conservé dans le Codex de Berlin 8502, datant du Ve siècle.
    Treatise on the Resurrection:
      display_name: Traité sur la résurrection
      author: Anonyme. L’œuvre se présente comme la lettre d’un maître à un élève nommé Rhéginos ; ni le maître ni Rhéginos ne peuvent être identifiés avec certitude.
      audience: Des chrétiens en quête d’un enseignement sur la résurrection, en particulier des lecteurs examinant ses dimensions corporelle et spirituelle ainsi que la participation présente à la vie de résurrection.
      date: Généralement situé à la fin du IIe siècle apr. J.-C. (souvent vers 170–200) ; conservé dans une copie copte du IVe siècle traduisant une œuvre grecque antérieure.
    Dialogue of the Savior:
      display_name: Dialogue du Sauveur
      author: Anonyme. Le dialogue met un enseignement révélateur dans la bouche de Jésus au cours d’échanges avec Judas, Matthieu et Marie, mais il ne nomme pas son compilateur.
      audience: Un cercle chrétien des premiers siècles qui s’intéressait à la révélation privée, à la vie de disciple, à la connaissance de soi, à la prière et à la préparation ascétique au salut.
      date: Communément attribué au IIe siècle apr. J.-C., bien que ses différentes strates de composition et sa date exacte restent débattues ; conservé dans un manuscrit copte du IVe siècle.
    Exegesis on the Soul:
      display_name: Exégèse de l’âme
      author: Anonyme. L’auteur est un prédicateur chrétien qui relit des images bibliques et littéraires grecques comme une allégorie de la chute, du repentir et de la restauration de l’âme.
      audience: Des chrétiens connaissant les Écritures et l’exhortation morale, appelés à se détourner des désirs désordonnés pour se repentir et retrouver l’union avec le divin.
      date: Généralement datée de la fin du IIe ou du début du IIIe siècle apr. J.-C. ; conservée dans une traduction copte du IVe siècle réalisée à partir du grec.
    Book of Thomas the Contender:
      display_name: Livre de Thomas l’Athlète
      author: Anonyme. Le titre final associe l’œuvre à Judas Thomas et nomme Mathaias comme rédacteur, mais il s’agit d’attributions littéraires plutôt que d’indications d’auteur vérifiables.
      audience: Des chrétiens de tendance ascétique, exhortés à rechercher la connaissance de soi, à résister aux passions corporelles et à comprendre l’enseignement privé de Jésus à Thomas.
      date: Souvent daté de la fin du IIe ou du début du IIIe siècle apr. J.-C., peut-être dans un milieu chrétien syrien ; conservé dans un manuscrit copte du IVe siècle.
    Tripartite Tractate:
      display_name: Traité tripartite
      author: Anonyme. L’auteur était un théologien chrétien valentinien très instruit ; aucune identification certaine avec un maître connu n’est possible.
      audience: Une communauté chrétienne valentinienne recevant un enseignement approfondi sur Dieu, les éons, la création, le Christ, l’Église, le salut et la restauration finale.
      date: Généralement daté du IIIe siècle apr. J.-C., certains arguments privilégiant sa seconde moitié ; conservé en copte dans le Codex Jung du IVe siècle.
    Apocryphon of John:
      display_name: Livre secret de Jean
      author: Anonyme. L’œuvre se présente sous un nom d’emprunt comme une révélation de Jésus ressuscité à Jean, fils de Zébédée, et subsiste en plusieurs recensions anciennes.
      audience: Des chrétiens appartenant à une tradition révélatrice séthienne ou étroitement apparentée, cherchant une présentation du monde divin, de la création, de l’identité humaine et de la libération face à des dirigeants hostiles.
      date: Une forme ancienne circulait probablement au IIe siècle apr. J.-C. ; les témoins coptes conservés, qui présentent des recensions courtes et longues, datent des IVe et Ve siècles.
