review:
  verdict: revise
  review_summary: Révision complète effectuée. La traduction est globalement fidèle ; quelques titres ont été ajustés pour une formulation française plus précise et neutre, notamment pour éviter une implication non présente dans la source.
  issues:
  - 'Gospel of Thomas 57 : « laboring person » est rendu de façon plus fidèle par « celui qui peine » que par « celui qui travaille ».'
  - 'Gospel of Thomas 73 : la source exhorte à prier pour davantage d’ouvriers, plutôt qu’à « appeler » davantage d’ouvriers.'
  - 'Gospel of Thomas 110 : le titre a été reformulé pour préserver le lien entre la richesse trouvée et le renoncement, sans ajouter de nuance.'
  - 'Jubilees 8 : « divides » est rendu par « divise » plutôt que « partage », afin de conserver le sens de répartition.'
