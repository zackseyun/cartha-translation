review:
  verdict: revise
  review_summary: Révision complète effectuée. Les localisations sont globalement fidèles ; quelques titres ont été resserrés afin d’éviter des ajouts interprétatifs ou de mieux refléter le sens du canon anglais.
  issues:
  - 'Gospel of Thomas 55 : « ses proches » ajoutait un élément absent du titre canonique.'
  - 'Gospel of Thomas 58 : le titre a été aligné sur « hard work » plutôt que sur une personne ayant déjà peiné.'
  - 'Gospel of Thomas 79 : formulation révisée pour traduire « forbearing » sans transformer le sens en une action de porter la vérité.'
  - 'Gospel of Thomas 105 : « insight » est rendu par « perspicacité », non par « connaissance ».'
  - 'Jubilees, audience : correction de la relation au milieu de Qumrân, sans suggérer que les communautés en seraient issues.'
