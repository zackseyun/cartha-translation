      author: Anonyme ; peut-être de la même main que les Chroniques.
      audience: Les rapatriés qui reconstruisaient Jérusalem sous la domination perse.
      date: Vers le milieu du Ve au IVe siècle av. J.-C.
    Nehemiah:
      display_name: Néhémie
      author: Anonyme ; intègre un récit autobiographique attribué à Néhémie.
