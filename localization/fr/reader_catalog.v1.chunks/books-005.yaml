    Ezra:
      display_name: Esdras
      author: Anonyme ; peut-être de la même main que les Chroniques.
      audience: Les exilés revenus à Jérusalem pour la reconstruire sous la domination perse.
      date: Vers le milieu du Ve siècle au IVe siècle av. J.-C.
    Nehemiah:
      display_name: Néhémie
      author: Anonyme ; intègre un récit autobiographique attribué à Néhémie.
      audience: Les exilés revenus à Jérusalem pour reconstruire ses murailles et renouveler l’alliance sous la domination perse.
      date: Vers le milieu du Ve siècle au IVe siècle av. J.-C.
    Esther:
      display_name: Esther
      author: Anonyme.
      audience: Les Juifs de la diaspora vivant sous domination étrangère, particulièrement en Perse.
      date: Vers la fin de l’époque perse ou le début de l’époque hellénistique (IVe–IIIe siècle av. J.-C.).
    Job:
      display_name: Job
      author: Anonyme.
      audience: Les Israélites aux prises avec la souffrance de l’innocent et la justice divine.
      date: Selon le consensus relatif à la tradition sapientielle, le livre daterait environ du VIe au IVe siècle av. J.-C. et s’appuierait sur des récits populaires plus anciens.
    Psalms:
      display_name: Psaumes
      author: Plusieurs auteurs au fil des siècles ; les suscriptions nomment David, Asaph, Coré, Salomon, Moïse et d’autres.
      audience: Israël et l’assemblée du Temple dans leur culte — ainsi que toute communauté ultérieure qui prie et se lamente.
      date: Composés environ du Xe au IIIe siècle av. J.-C. ; compilation finale durant la période postexilique.
