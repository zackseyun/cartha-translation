      date: Vers le milieu du Ve au IVe siècle av. J.-C.
    Esther:
      display_name: Esther
      author: Anonyme.
      audience: Les Juifs de la diaspora sous domination étrangère, en particulier en Perse.
      date: Vers la fin de la période perse ou le début de la période hellénistique (IVe–IIIe siècle av. J.-C.).
    Job:
      display_name: Job
      author: Anonyme.
      audience: Les Israélites aux prises avec la souffrance de l’innocent et la justice divine.
      date: Selon le consensus relatif à la tradition sapientiale, le livre daterait environ du VIe au IVe siècle av. J.-C. et puiserait dans des récits populaires plus anciens.
    Psalms:
      display_name: Psaumes
      author: Plusieurs auteurs au fil des siècles ; les titres mentionnent David, Asaph, Coré, Salomon, Moïse et d’autres.
      audience: Israël et l’assemblée du Temple dans leur culte — ainsi que toute communauté ultérieure de prière et de lamentation.
      date: Composés approximativement du Xe au IIIe siècle av. J.-C. ; compilation définitive durant la période postexilique.
