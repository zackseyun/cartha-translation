review:
  verdict: revise
  review_summary: 'Révision effectuée : correction de quelques formulations pour une fidélité plus stricte au source, notamment en Siracide 45, 47, 48 et 1 Maccabées 13. Toutes les entrées sont présentes et localisées.'
  issues:
  - 'Sirach 45 : « plus que tous » a été remplacé par « au-dessus de tous », plus fidèle à « Above All ».'
  - 'Sirach 47 : la formulation a été ajustée afin de ne pas inventer l’idée que Nathan reprend David.'
  - 'Sirach 48 : « Élie et les prophètes » ne rendait pas le verbe « Elijah Prophets » ; rendu corrigé.'
  - '1 Maccabees 13 : « s’empare » affaiblissait « crushes » ; formulation corrigée.'
