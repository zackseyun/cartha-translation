payload:
  book_metadata:
    Sirach:
      display_name: Siracide
      author: Yeshoua ben Éléazar ben Sira, de Jérusalem ; traduction grecque par son petit-fils.
      audience: Jeunes hommes juifs formés à la sagesse dans la Jérusalem de l’époque hellénistique.
      date: Original hébreu vers 195–175 av. J.-C. ; traduction grecque vers 132 av. J.-C.
    Baruch:
      display_name: Baruch
      author: Auteur anonyme ; œuvre attribuée sous pseudonyme à Baruch, secrétaire de Jérémie.
      audience: Juifs de la diaspora méditant sur l’exil, la repentance et la sagesse.
      date: Vers le IIe siècle av. J.-C.
    1 Maccabees:
      display_name: 1 Maccabées
      author: Auteur anonyme, probablement de Jérusalem, écrivant en hébreu (seul le texte grec nous est parvenu).
      audience: Juifs vivant pendant et après la révolte hasmonéenne ; le récit présente la légitimité de la dynastie hasmonéenne.
      date: Vers 100 av. J.-C.
    2 Maccabees:
      display_name: 2 Maccabées
      author: Abréviateur anonyme d’une œuvre plus longue de Jason de Cyrène ; texte composé en grec.
      audience: Juifs de la diaspora parlant grec — avec un accent sur le martyre, la providence et la résurrection.
      date: Vers 124 av. J.-C. ou peu après.
