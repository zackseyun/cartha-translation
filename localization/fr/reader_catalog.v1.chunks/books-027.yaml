  book_metadata:
    Polycarp to the Philippians:
      display_name: Polycarpe aux Philippiens
      author: Polycarpe, évêque de Smyrne. Certains chercheurs considèrent que le texte qui nous est parvenu réunit des éléments envoyés à plusieurs moments.
      audience: La communauté chrétienne de Philippes, qui avait demandé les lettres d’Ignace et reçut des conseils sur la foi, la conduite, les responsables, l’argent et la persévérance.
      date: Du début au milieu du IIe siècle apr. J.-C. ; une partie au moins est étroitement liée au voyage d’Ignace, tandis que les hypothèses d’une lettre composite permettent de dater une section un peu plus tardivement.
    Martyrdom of Polycarp:
      display_name: Martyre de Polycarpe
      author: Des membres anonymes de l’Église de Smyrne, écrivant au nom de la communauté ; les notes finales sur la transmission témoignent de copies et d’une diffusion ultérieures.
      audience: L’Église de Philomélium et l’ensemble de la communion chrétienne, auxquels est proposé un récit de l’arrestation, du procès et de la mort de Polycarpe, ainsi que de son endurance exemplaire.
      date: Écrit après la mort de Polycarpe, ce texte est généralement situé vers le milieu ou la fin du IIe siècle apr. J.-C. ; l’année exacte du martyre comme la forme définitive du document font débat.
    Epistle to Diognetus:
      display_name: Épître à Diognète
      author: Auteur anonyme. Il se présente comme un disciple ou un élève, mais ni son identité ni celle de Diognète, le destinataire, ne peuvent être établies avec certitude.
      audience: Un non-chrétien instruit qui s’interroge — ainsi que les lecteurs qui lui ressemblent — sur le culte chrétien, l’éthique, l’identité sociale, l’amour et l’apparente nouveauté de la foi.
      date: Souvent datée de la fin du IIe ou du début du IIIe siècle apr. J.-C., bien que les propositions varient considérablement ; les deux derniers chapitres pourraient provenir d’une autre œuvre.
    Fragments of Papias:
      display_name: Fragments de Papias
      author: Papias, évêque de Hiérapolis, auteur des cinq livres aujourd’hui perdus des Explications des paroles du Seigneur ; le recueil conservé se compose de citations et de récits transmis par des auteurs ultérieurs.
      audience: Les premiers chrétiens qui recherchaient les enseignements dont on se souvenait au sujet de Jésus et des apôtres, recueillis au moyen de chaînes nommément identifiées de témoignages oraux et d’interprétations.
      date: L’œuvre de Papias est généralement datée du début du IIe siècle apr. J.-C., souvent vers 110–130 ; les fragments conservés figurent chez des auteurs qui écrivirent à partir du IIe siècle.
