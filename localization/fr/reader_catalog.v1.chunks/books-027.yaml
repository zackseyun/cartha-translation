review:
  verdict: revise
  review_summary: 'Révision appliquée : corrections ponctuelles de fidélité et de formulation, notamment pour l’attribution des Fragments de Papias et quelques titres dont le sens était légèrement déplacé ou trop interprétatif. Toutes les clés et tous les champs requis sont conservés.'
  issues:
  - 'Fragments of Papias.author : « pour les cinq livres » ne rendait pas clairement Papias comme auteur ; reformulé en « auteur des cinq livres ».'
  - 'Quelques titres ont été rapprochés du libellé source : « envoyer » plutôt que « désigner », « abjurer » plutôt que l’ajout « sa foi », « le sabbat » plutôt qu’« un jour de sabbat », et « gouvernant » plutôt que « dirigeant ».'
  - Aucune omission ni clé modifiée.
