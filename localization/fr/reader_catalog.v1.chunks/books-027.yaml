  book_metadata:
    Polycarp to the Philippians:
      display_name: Polycarpe aux Philippiens
      author: Polycarpe, évêque de Smyrne. Certains chercheurs considèrent que le texte qui nous est parvenu réunit des éléments envoyés à plusieurs moments.
      audience: L’assemblée chrétienne de Philippes, qui avait demandé les lettres d’Ignace et reçu des conseils sur la foi, la conduite, les responsables, l’argent et la persévérance.
      date: Du début au milieu du IIe siècle apr. J.-C. ; une partie au moins est étroitement liée au voyage d’Ignace, tandis que l’hypothèse d’une lettre composite permet d’envisager une section quelque peu postérieure.
    Martyrdom of Polycarp:
      display_name: Martyre de Polycarpe
      author: Des membres anonymes de l’Église de Smyrne, écrivant au nom de la communauté ; les notes finales sur la transmission témoignent de copies et d’une diffusion ultérieures.
      audience: L’Église de Philomélium et l’ensemble de la communion chrétienne, auxquels est présenté un récit de l’arrestation, du procès, de la mort et de l’endurance exemplaire de Polycarpe.
      date: Écrit après la mort de Polycarpe, généralement situé au milieu ou dans la seconde moitié du IIe siècle apr. J.-C. ; l’année exacte du martyre comme la forme définitive du document restent débattues.
    Epistle to Diognetus:
      display_name: Épître à Diognète
      author: Anonyme. L’auteur se présente comme un disciple ou un apprenant, mais ni son identité ni celle de Diognète, le destinataire, ne peuvent être établies avec certitude.
      audience: Un non-chrétien instruit qui s’interroge — ainsi que des lecteurs semblables — sur le culte chrétien, l’éthique, l’identité sociale, l’amour et l’apparente nouveauté de la foi.
      date: Souvent datée de la fin du IIe ou du début du IIIe siècle apr. J.-C., bien que les propositions varient considérablement ; les deux derniers chapitres pourraient provenir d’une autre œuvre.
    Fragments of Papias:
      display_name: Fragments de Papias
      author: Papias, évêque de Hiérapolis, pour les cinq livres aujourd’hui perdus des Explications des paroles du Seigneur ; le recueil qui subsiste se compose de citations et de témoignages conservés par des auteurs postérieurs.
      audience: Des chrétiens des premiers temps cherchant des enseignements transmis de mémoire sur Jésus et les apôtres, recueillis au moyen de chaînes nommées de témoignage oral et d’interprétation.
      date: L’œuvre de Papias est généralement datée du début du IIe siècle apr. J.-C., souvent vers 110–130 ; les fragments qui subsistent se trouvent chez des auteurs écrivant à partir du IIe siècle.
