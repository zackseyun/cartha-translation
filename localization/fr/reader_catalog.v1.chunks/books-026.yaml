review:
  verdict: revise
  review_summary: Chunk complete. Revised several titles for closer semantic fidelity, including the reference to Christ’s overthrow, the church in Syria being shepherded, Christ’s descent, and the scope of “all.”
  issues:
  - 'Letters of Ignatius 20: « triomphe » softened/altered “Overthrow”; revised.'
  - 'Letters of Ignatius 62: draft changed “Church Shepherded” into a request that it receive a shepherd; revised.'
  - 'Letters of Ignatius 73: « tous les êtres » added “beings”; revised to retain the source’s scope without addition.'
  - 'Letters of Ignatius 77: « ascendance » is the inverse of “descent”; revised to « descendance ».'
  - 'Letters of Ignatius 80: revised to preserve the warning-to-repentance sense.'
