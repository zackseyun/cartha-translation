    Letters of Ignatius:
      display_name: Lettres d’Ignace
      author: Ignace, évêque d’Antioche, pour les sept lettres de la recension moyenne généralement reconnue ; les lettres ignatiennes pseudonymes et celles qui ont été développées ultérieurement ne font pas partie de ce recueil.
      audience: Les assemblées chrétiennes d’Éphèse, de Magnésie, de Tralles, de Rome, de Philadelphie et de Smyrne, ainsi que Polycarpe, auxquelles Ignace s’est adressé au cours de son voyage vers le martyre.
      date: Généralement datées du début du IIe siècle apr. J.-C., souvent d’environ 105 à 117, bien que la chronologie précise du voyage d’Ignace reste discutée.
