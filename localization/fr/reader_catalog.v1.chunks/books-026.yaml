    Letters of Ignatius:
      display_name: Lettres d’Ignace
      author: Ignace, évêque d’Antioche, pour les sept lettres de la recension moyenne généralement admise ; les lettres ignatiennes pseudonymes et celles qui ont été amplifiées ultérieurement ne font pas partie de ce recueil.
      audience: Les assemblées chrétiennes d’Éphèse, de Magnésie, de Tralles, de Rome, de Philadelphie et de Smyrne, ainsi que Polycarpe, auxquelles Ignace s’adresse pendant son voyage vers le martyre.
      date: Généralement datées du début du IIe siècle apr. J.-C., souvent vers 105–117, bien que la chronologie précise du voyage d’Ignace reste débattue.
