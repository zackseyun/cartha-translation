review:
  verdict: revise
  review_summary: Correction de deux libellés d’interface afin de préserver le singulier de « Best » et le sens de « Saved & notes ». Tous les champs requis sont présents, et les jetons canoniques sont conservés.
  issues:
  - spotlightBest was incorrectly pluralized (« Meilleurs »); corrected to singular « Meilleur ».
  - savedAndNotes used « Enregistrements », which can mean recordings; corrected to « Éléments enregistrés et notes ».
  - ariaHasNote was refined to the more direct « Possède une note ».
  - The remainder of the draft faithfully reflects the canonical English source without omissions or unsupported additions.
