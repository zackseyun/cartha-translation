review:
  verdict: revise
  review_summary: Correction complète apportée. Les principales révisions concernent quelques libellés d’interface, la cohérence de « meilleur résultat » et une restitution plus fidèle de l’énoncé sur les manuscrits, l’IA et le caractère gratuit et ouvert du projet.
  issues:
  - « spotlightBest » était au pluriel alors que la source est au singulier.
  - Quelques formulations de recherche étaient idiomatiquement ou sémantiquement imprécises.
  - « introQuote » omettait la notion de gratuité (« free ») et nécessitait une formulation plus fidèle.
