  book_metadata:
    Luke:
      display_name: Luc
      author: Anonyme ; la tradition l’attribue à Luc, compagnon de voyage de Paul.
      audience: Un lectorat chrétien lettré du monde gréco-romain ; l’ouvrage est adressé à « Théophile ».
      date: Vers 80–90 apr. J.-C.
    John:
      display_name: Jean
      author: Anonyme ; la tradition l’attribue à l’apôtre Jean ou au « disciple bien-aimé ».
      audience: Une communauté chrétienne en tension avec le judaïsme synagogal, constituée autour du témoignage du disciple bien-aimé.
      date: Vers 90–110 apr. J.-C.
      summary: Jean présente Jésus comme la Parole éternelle qui révèle le Père, donne la vie à ceux qui mettent leur confiance en lui et il est glorifié par ses signes, sa mort et sa résurrection.
    Acts:
      display_name: Actes
      author: Anonyme ; le même auteur que celui de Luc.
      audience: Un lectorat chrétien du monde gréco-romain ; il s’agit du second volume de l’œuvre adressée à Théophile.
      date: Vers 80–90 apr. J.-C.
    Romans:
      display_name: Romains
      author: Paul, avec le secrétaire Tertius.
      audience: Les chrétiens de Rome — croyants juifs et non juifs en tension au sujet de la Torah et de leur identité.
      date: Vers 56–58 apr. J.-C., écrit depuis Corinthe.
