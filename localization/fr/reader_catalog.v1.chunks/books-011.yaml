review:
  verdict: revise
  review_summary: 'Correction directe de trois formulations : Jean (accord référentiel dans le résumé), Marc 15 (suppression d’un ajout non présent dans la source) et Actes 4 (formulation plus neutre). Tous les champs requis sont complets.'
  issues:
  - 'John summary: « est glorifiée » renvoyait grammaticalement à « la Parole » plutôt qu’à Jésus; corrigé en « il est glorifié ».'
  - 'Mark 15: « avec dévouement » ajoutait une notion absente de « Faithfully » dans le titre canonique; rendu français neutre sans ajout.'
  - 'Acts 4: « sainte assurance » a été simplifié en « assurance » pour éviter une coloration dévotionnelle inutile.'
