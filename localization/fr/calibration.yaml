review:
  verdict: revise
  summary: Révision effectuée pour corriger quelques glissements de sens, améliorer l’idiomaticité et conserver les alternatives et nuances des notes source sans ajout doctrinal.
  issues:
  - 'Genèse : le résumé ne doit pas dire que les promesses « commencent à se réaliser » ; la source dit qu’elles commencent avec cette famille.'
  - 'Jean : dans le résumé, c’est Jésus (et non « la Parole » comme antécédent grammatical féminin) qui est glorifié par ses signes, sa mort et sa résurrection.'
  - 'Ecclésiaste 1.2 : « bref » ne s’accorde pas avec « vapeur » ; la formulation a été rendue plus naturelle.'
  - 'Romains 3.25 : « avait laissé impunis » est plus fort que « had passed over » ; une formulation moins interprétative est retenue. La note de l’alternative « justice » est également corrigée.'
  - '1 Pierre 1.13 : « Gardez pleinement les idées claires » est peu idiomatique ; « restez parfaitement lucides » restitue mieux l’injonction.'
  - Quelques champs de métadonnées ont été légèrement resserrés pour suivre plus directement le contexte source.
