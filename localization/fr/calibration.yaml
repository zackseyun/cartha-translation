book_localizations:
- source_title: Genesis
  title: Genèse
  author: Anonyme ; traditionnellement attribué à Moïse. La recherche moderne y voit une longue histoire de composition, au cours de laquelle des sources ont été réunies et remaniées ultérieurement.
  audience: Israël dans son identité d’alliance, afin d’ancrer le récit des origines du peuple dans la création, l’élection et la promesse de Dieu.
  date: Composé sur plusieurs siècles ; a atteint sa forme reçue vers les VIe–Ve siècles av. J.-C., pendant ou après l’exil à Babylone.
  summary: La Genèse raconte la création, la rébellion et la dispersion de l’humanité, ainsi que l’histoire de la famille d’Abraham, d’Isaac, de Jacob et de Joseph, par laquelle commencent les promesses de l’alliance de Dieu envers Israël.
- source_title: John
  title: Jean
  author: Anonyme ; la tradition l’attribue à l’apôtre Jean ou au « disciple bien-aimé ».
  audience: Une communauté chrétienne en tension avec le judaïsme synagogal, formée autour du témoignage du disciple bien-aimé.
  date: Vers 90–110 apr. J.-C.
  summary: Jean présente Jésus comme la Parole éternelle qui révèle le Père, donne la vie par la confiance en lui et est glorifié par ses signes, sa mort et sa résurrection.
- source_title: Gospel of Thomas
  title: Évangile de Thomas
  author: Anonyme ; l’incipit attribue ce recueil de paroles à « Didyme Jude Thomas ». Le texte intégral ne subsiste que dans une traduction copte du IVe siècle provenant de Nag Hammadi (NHC II,2), avec trois fragments grecs d’Oxyrhynque.
  audience: Un lectorat chrétien marqué par la sagesse syrienne et une pensée proto-gnostique, orienté vers une connaissance ésotérique de soi dans les paroles de Jésus.
  date: Original grec probablement composé vers 50–140 apr. J.-C. ; manuscrit copte vers 340 apr. J.-C.
  summary: L’Évangile de Thomas est un recueil de paroles attribuées à Jésus. Il ne comporte pas de récit suivi et invite à plusieurs reprises les lecteurs à découvrir le sens de ces paroles.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Genèse 1.1
  text: Lorsque Dieu commença à créer les cieux et la terre[a] —
  translator_note: '[a] La traduction traditionnelle considère ces mots comme une phrase complète : « Au commencement, Dieu créa les cieux et la terre. » L’hébreu introduit plus naturellement ce qui suit, l’action principale — « Dieu dit » — apparaissant au verset 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Ecclésiaste 1.2
  text: « Vapeur des vapeurs[a] », dit Qohéleth[b]. « Tout est vapeur — éphémère, impossible à retenir et souvent différent de ce que nous attendons. »
  translator_note: '[a] Le mot hébreu hevel signifie littéralement « souffle » ou « vapeur ». Dans tout l’Ecclésiaste, il décrit ce qui passe rapidement, ne peut être retenu ni pleinement compris et se révèle souvent différent de ce que les humains attendent. « Vapeur » conserve cette image sans affirmer que rien n’a de sens. Autres traductions possibles : « souffle », « pur souffle », « éphémère ». [b] Qohéleth est le nom ou le titre hébreu de l’auteur. Il est souvent traduit par « l’Enseignant » ou « le Prédicateur », mais nous conservons « Qohéleth » afin de laisser ouvertes toutes les significations possibles sans privilégier une interprétation.'
- source_path: nt/john/001/001.yaml
  reference: Jean 1.1
  text: Au commencement[b], la Parole existait déjà. La Parole était avec Dieu, et la Parole était Dieu[a].
  translator_note: '[a] Autres traductions possibles : « la Parole était divine » ou « ce que Dieu était, la Parole l’était ». La formulation grecque affirme que la Parole est pleinement Dieu tout en la distinguant de Dieu dans la proposition précédente. [b] Cette ouverture fait écho à Genèse 1.1 et associe la Parole au commencement de la création. « Existait déjà » indique que la Parole existait lorsque le commencement est arrivé, au lieu de venir alors à l’existence ; on peut aussi traduire simplement par « était » ou « existait ».'
- source_path: nt/romans/003/025.yaml
  reference: Romains 3.25
  text: Dieu l’a présenté comme un sacrifice d’expiation[a], par la foi en son sang[b]. Il l’a fait pour manifester sa justice[c], parce qu’il avait laissé passer les péchés commis autrefois.
  translator_note: '[a] On peut aussi traduire par « propitiation » ou « propitiatoire », le couvercle d’or de l’arche de l’alliance sur lequel le sang expiatoire était aspergé dans l’Ancien Testament. [b] Autre traduction possible : « par la foi, au moyen de son sang ». [c] Ou : « justice ».'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Pierre 1.13
  text: C’est pourquoi, préparez votre esprit à agir[a]. Restez parfaitement lucides et placez toute votre espérance dans la grâce qui vous est apportée lorsque Jésus le Messie sera révélé[b].
  translator_note: '[a] Le grec dit littéralement : « ceignez les reins de votre esprit ». Cette image évoque le fait de relever et de serrer un vêtement long autour de la taille afin d’être prêt à agir. [b] Le mot grec traduit ici par « parfaitement » et « toute » peut se rapporter au fait de rester lucides, à celui de placer son espérance, ou peut-être aux deux.'
