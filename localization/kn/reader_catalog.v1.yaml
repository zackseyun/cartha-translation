  Epistle to Diognetus:
    display_name: ಡಿಯೊಗ್ನೇಟಸ್‌ಗೆ ಪತ್ರ
    author: ಅನಾಮಧೇಯ. ಲೇಖಕನು ತನ್ನನ್ನು ಶಿಷ್ಯ ಅಥವಾ ಕಲಿಯುವವನು ಎಂದು ಕರೆದುಕೊಳ್ಳುತ್ತಾನೆ; ಆದರೆ ಅವನನ್ನಾಗಲಿ, ಪತ್ರವನ್ನು ಉದ್ದೇಶಿಸಿ ಬರೆಯಲಾದ ಡಿಯೊಗ್ನೇಟಸ್‌ನನ್ನಾಗಲಿ ಖಚಿತವಾಗಿ ಗುರುತಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.
    audience: ಕ್ರೈಸ್ತ ಆರಾಧನೆ, ನೈತಿಕತೆ, ಸಾಮಾಜಿಕ ಗುರುತು, ಪ್ರೀತಿ ಮತ್ತು ಈ ನಂಬಿಕೆ ಹೊಸದಾಗಿ ಕಾಣುವುದರ ಕುರಿತು ಪ್ರಶ್ನಿಸುವ ವಿದ್ಯಾವಂತ ಕ್ರೈಸ್ತೇತರ ಅನ್ವೇಷಕ—ಹಾಗೂ ಅವನಂತಹ ಓದುಗರು.
    date: ಇದನ್ನು ಅನೇಕವೇಳೆ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಕೊನೆ ಅಥವಾ 3ನೇ ಶತಮಾನದ ಆರಂಭಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಆದರೆ ಪ್ರಸ್ತಾಪಿತ ಕಾಲಗಳು ಬಹಳವಾಗಿ ಬದಲಾಗುತ್ತವೆ. ಕೊನೆಯ ಎರಡು ಅಧ್ಯಾಯಗಳು ಬೇರೆ ಕೃತಿಯಿಂದ ಬಂದಿರಬಹುದು.
