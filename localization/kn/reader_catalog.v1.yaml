      '18':
        title: ದಾವೀದನು ದೀನತೆಯಿಂದ ತನ್ನ ಪಾಪಗಳನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾನೆ
      '19':
        title: ದೀನತೆಯು ಶಾಂತಿಯುತ ಜೀವನಕ್ಕೆ ಮಾರ್ಗದರ್ಶನ ನೀಡುತ್ತದೆ
      '20':
        title: ಸೃಷ್ಟಿಯು ಕ್ರಮಬದ್ಧ ಶಾಂತಿಯಲ್ಲಿ ಸಾಗುತ್ತದೆ
