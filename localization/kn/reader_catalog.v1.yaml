        title: ಬಲಿಷ್ಠಳಾದ ಮರಿಯಳನ್ನು ಯೋವಾಕೀಮನು ಮನೆಗೆ ಸ್ವಾಗತಿಸುತ್ತಾನೆ
      '7':
        title: ಪ್ರೀತಿಸಲ್ಪಟ್ಟ ಮಗಳು ಇಸ್ರಾಯೇಲಿನ ಮುಂದೆ ನರ್ತಿಸುತ್ತಾಳೆ
      '8':
        title: ಮರಿಯಳು ದೇವಾಲಯದಲ್ಲೇ ಉಳಿಯುತ್ತಾಳೆ
      '9':
        title: ಕನ್ಯೆಗಾಗಿ ಯೋಸೇಫನು ಆರಿಸಲ್ಪಡುತ್ತಾನೆ
      '10':
        title: ಮರಿಯಳು ಕಡುಗೆಂಪು ದಾರವನ್ನು ನೂಲುತ್ತಾಳೆ
      '11':
        title: ದೂತನು ಮರಿಯಳ ಪವಿತ್ರ ಕಾರ್ಯವನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '12':
        title: ಮರಿಯಳು ಎಲಿಸಬೆತಳನ್ನು ಭೇಟಿಯಾಗಿ ಹಿಂದಿರುಗುತ್ತಾಳೆ
      '13':
        title: ಮರಿಯಳು ಗರ್ಭಿಣಿಯಾಗಿರುವುದನ್ನು ಕಂಡು ಯೋಸೇಫನು ದುಃಖಿಸುತ್ತಾನೆ
      '14':
        title: ಯೋಸೇಫನ ಕನಸಿನಲ್ಲಿ ದೂತನು ಮಾತನಾಡುತ್ತಾನೆ
      '15':
        title: ಯೋಸೇಫನು ತಪ್ಪು ಮಾಡಿದ್ದಾನೆಂದು ಯಾಜಕನು ಆರೋಪಿಸುತ್ತಾನೆ
      '16':
        title: ಪರೀಕ್ಷೆಯ ಬಳಿಕ ಯೋಸೇಫನು ಮರಿಯಳನ್ನು ಬಿಡುಗಡೆ ಮಾಡುತ್ತಾನೆ
      '17':
        title: ಮರಿಯಳು ಬೇತ್ಲೆಹೇಮಿಗೆ ಪ್ರಯಾಣಿಸುತ್ತಾಳೆ
      '18':
        title: ಯೋಸೇಫನು ಸ್ತಬ್ಧಗೊಂಡ ಲೋಕವನ್ನು ನೋಡುತ್ತಾನೆ
      '19':
        title: ಸೂಲಗಿತ್ತಿ ಕನ್ಯೆಯ ಹೆರಿಗೆಯನ್ನು ನೋಡುತ್ತಾಳೆ
      '20':
        title: ಸಲೋಮೆ ಮರಿಯಳನ್ನು ಪರೀಕ್ಷಿಸಿ ಸುಟ್ಟುಕೊಳ್ಳುತ್ತಾಳೆ
      '21':
        title: ಜ್ಞಾನಿಗಳು ನವಜಾತ ಅರಸನನ್ನು ಹುಡುಕುತ್ತಾರೆ
      '22':
        title: ಹೆರೋದನು ಶಿಶುಗಳನ್ನು ಕೊಲ್ಲಲು ಆದೇಶಿಸುತ್ತಾನೆ
      '23':
        title: ಜೆಕರ್ಯನು ಹೆರೋದನ ಬೆದರಿಕೆಯನ್ನು ಎದುರಿಸುತ್ತಾನೆ
      '24':
        title: ಪವಿತ್ರಸ್ಥಳದಲ್ಲಿ ಜೆಕರ್ಯನ ಕೊಲೆ
      '25':
        title: ಗಲಭೆಯ ನಡುವೆ ಯಾಕೋಬನು ವೃತ್ತಾಂತವನ್ನು ಬರೆಯುತ್ತಾನೆ
      '26':
        title: ಬೋಡ್ಮರ್ ಪಪೈರಸ್‌ನಲ್ಲಿ ಸಂಕ್ಷಿಪ್ತ ಪಾಠರೂಪ
      '27':
        title: ಯೋಸೇಫನು ಬೇತ್ಲೆಹೇಮಿನಲ್ಲಿ ಸೂಲಗಿತ್ತಿಯನ್ನು ಹುಡುಕುತ್ತಾನೆ
      '28':
        title: ಮರಿಯಳ ಅದ್ಭುತವನ್ನು ಯೋಸೇಫನು ವಿವರಿಸುತ್ತಾನೆ
      '29':
        title: ಮಗುವನ್ನು ಮುಟ್ಟಿ ಸಲೋಮೆ ಗುಣಮುಖಳಾಗುತ್ತಾಳೆ
      '30':
        title: ಜ್ಞಾನಿಗಳು ಯೆಹೂದ್ಯರ ಅರಸನನ್ನು ಹುಡುಕುತ್ತಾರೆ
  Infancy Gospel of Thomas:
    display_name: ಥೋಮನ ಬಾಲ್ಯ ಸುವಾರ್ತೆ
    author: ಅಜ್ಞಾತ. ಪುನರ್‌ರಚಿಸಬಹುದಾದ ಇದರ ಅತ್ಯಂತ ಪ್ರಾಚೀನ ರೂಪವು ಲೇಖಕರ ಹೆಸರನ್ನು ಹೇಳುವುದಿಲ್ಲ; ಥೋಮನಿಗೆ ಇದನ್ನು ಸಲ್ಲಿಸುವುದು ನಂತರದ ಹಸ್ತಪ್ರತಿಗಳ ಶೀರ್ಷಿಕೆಗಳು ಮತ್ತು ಪಾಠಪರಂಪರೆಯಿಂದ ಬಂದಿದೆ.
    audience: ಯೇಸುವಿನ ಬಾಲ್ಯದ ಬಗ್ಗೆ ಮತ್ತು ಅಂಗೀಕೃತ ಸುವಾರ್ತೆಗಳ ನಿರೂಪಣೆ ಆರಂಭವಾಗುವ ಮುನ್ನ ದೈವಿಕ ಶಕ್ತಿ, ಶಿಸ್ತು, ಕಲಿಕೆ ಮತ್ತು ಪ್ರೌಢತೆಯ ಬೆಳವಣಿಗೆಯನ್ನು ಹೇಗೆ ನಿರೂಪಿಸಬಹುದೆಂದು ತಿಳಿಯಲು ಕುತೂಹಲ ಹೊಂದಿದ್ದ ಕ್ರೈಸ್ತರು.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿದ್ದೆಂದು ಪರಿಗಣಿಸಲಾಗುತ್ತದೆ; ಆದರೆ ಈ ಪಠ್ಯವು ಗಮನಾರ್ಹವಾಗಿ ಭಿನ್ನವಾಗಿರುವ ಹಲವು ಗ್ರೀಕ್ ಪಾಠರೂಪಗಳಲ್ಲಿ ಮತ್ತು ಪ್ರಾಚೀನ ಅನುವಾದಗಳಲ್ಲಿ ಉಳಿದುಬಂದಿದೆ.
    chapters:
      '1':
        title: ಥೋಮನು ಯೇಸುವಿನ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '2':
        title: ಯೇಸು ನೀರನ್ನು ಶುದ್ಧಗೊಳಿಸಿ ಹಕ್ಕಿಗಳನ್ನು ರೂಪಿಸುತ್ತಾನೆ
      '3':
        title: ಯೇಸು ಅನ್ನನ ಮಗನನ್ನು ಶಪಿಸುತ್ತಾನೆ
      '4':
        title: ಯೇಸು ಶಪಿಸಿದಾಗ ಮಗು ಸಾಯುತ್ತದೆ
      '5':
        title: ಯೇಸು ಯೋಸೇಫನಿಗೆ ಜ್ಞಾನವನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '6':
        title: ಯೇಸುವಿನ ಜ್ಞಾನದ ಮುಂದೆ ಶಿಕ್ಷಕನು ತಡವರಿಸುತ್ತಾನೆ
      '7':
        title: ಯೇಸುವಿನ ಶ್ರೇಷ್ಠ ಜ್ಞಾನವನ್ನು ಶಿಕ್ಷಕನು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾನೆ
      '8':
        title: ಯೇಸು ನಗುತ್ತಾನೆ, ಗುಣಪಡಿಸುತ್ತಾನೆ ಮತ್ತು ಘೋಷಿಸುತ್ತಾನೆ
      '9':
        title: ಬಿದ್ದು ಸತ್ತ ಜೀನೋನನ್ನು ಯೇಸು ಬದುಕಿಸುತ್ತಾನೆ
      '10':
        title: ಯೇಸು ಮರಕಡಿಯುವವನ ಪಾದವನ್ನು ಗುಣಪಡಿಸುತ್ತಾನೆ
      '11':
        title: ಯೇಸು ಒಡೆದ ಹೂಜಿಯನ್ನು ಅದ್ಭುತವಾಗಿ ತುಂಬಿಸುತ್ತಾನೆ
      '12':
        title: ಯೇಸು ಬಿತ್ತಿದ ಬೆಳೆಯನ್ನು ಯೋಸೇಫನು ಕೊಯ್ಯುತ್ತಾನೆ
      '13':
        title: ಯೇಸುವಿನ ನೆರವಿನಿಂದ ಯೋಸೇಫನು ಮಂಚವನ್ನು ಪೂರ್ಣಗೊಳಿಸುತ್ತಾನೆ
      '14':
        title: ಯೇಸುವಿಗೆ ಸವಾಲು ಹಾಕಿದ ಶಿಕ್ಷಕನು ಸಾಯುತ್ತಾನೆ
      '15':
        title: ಯೇಸುವಿನ ಮಾತು ಶಿಕ್ಷಕನನ್ನು ಸಂತೋಷಪಡಿಸುತ್ತದೆ
      '16':
        title: ಹಾವು ಕಚ್ಚಿದ ಯಾಕೋಬನನ್ನು ಯೇಸು ಗುಣಪಡಿಸುತ್ತಾನೆ
      '17':
        title: ಯೇಸು ಮಗು ಯೋಸೇಫನನ್ನು ಗುಣಪಡಿಸುತ್ತಾನೆ
      '18':
        title: ಘಟನಾ ಸ್ಥಳದಲ್ಲೇ ಯೇಸು ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಬದುಕಿಸುತ್ತಾನೆ
      '19':
        title: ಹನ್ನೆರಡು ವರ್ಷದ ಯೇಸು ದೇವಾಲಯದಲ್ಲಿ ಬೋಧಿಸುತ್ತಾನೆ
  Acts of Paul and Thecla:
    display_name: ಪೌಲ ಮತ್ತು ಥೆಕ್ಲಾಳ ಕೃತ್ಯಗಳು
    author: ಅಜ್ಞಾತ. ಇದು ಹೆಚ್ಚು ವಿಸ್ತಾರವಾದ ‘ಪೌಲನ ಕೃತ್ಯಗಳು’ ಕೃತಿಯ ಒಂದು ಪ್ರಸಂಗವಾಗಿದೆ; ಒಬ್ಬ ಪ್ರೆಸ್‌ಬಿಟರ್ ಆ ಕೃತಿಯನ್ನು ರಚಿಸಿದನೆಂಬ ಪ್ರಾಚೀನ ವರದಿಯಿಂದ ಲೇಖಕ ಯಾರೆಂದು ಖಚಿತವಾಗಿ ಗುರುತಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.
    audience: ಅಪೊಸ್ತಲರ ಸಾರುವಿಕೆ, ಬ್ರಹ್ಮಚರ್ಯ, ದೀಕ್ಷಾಸ್ನಾನ, ಹುತಾತ್ಮರಂಥ ಸಹನೆ ಹಾಗೂ ಬೋಧಿಸಿ ಸಾಕ್ಷಿ ಹೇಳುವ ಒಬ್ಬ ಮಹಿಳೆಯ ಅಧಿಕಾರ ಕುರಿತ ಕಥೆಗಳಿಗೆ ಆಕರ್ಷಿತರಾದ ಕ್ರೈಸ್ತರು.
    date: ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದಲ್ಲಿ, ಬಹುಶಃ ಅದರ ಉತ್ತರಾರ್ಧದಲ್ಲಿ ರಚಿಸಲಾಯಿತು; ಇದು ‘ಪೌಲನ ಕೃತ್ಯಗಳು’ ಕೃತಿಯೊಳಗೂ ಸ್ವತಂತ್ರ ಕೃತಿಯಾಗಿಯೂ ಪ್ರಸಾರವಾಯಿತು.
    chapters:
      '1':
        title: ಒನೇಸಿಫೊರನ ಮನೆಯಲ್ಲಿ ಪೌಲನು ಸಾರುತ್ತಾನೆ
      '2':
        title: ಥೆಕ್ಲಾ ಕಿವಿಗೊಟ್ಟು ಪೌಲನಿಗಾಗಿ ಹಂಬಲಿಸುತ್ತಾಳೆ
      '3':
        title: ಥಮಿರಿಸ್ ರಾಜ್ಯಪಾಲನ ಮುಂದೆ ಪೌಲನ ಮೇಲೆ ಆರೋಪ ಹೊರಿಸುತ್ತಾನೆ
      '4':
        title: ಥೆಕ್ಲಾ ಸೆರೆಮನೆಗೆ ಹೋಗಿ ಪೌಲನನ್ನು ಉತ್ತೇಜಿಸುತ್ತಾಳೆ
      '5':
        title: ಥೆಕ್ಲಾ ಸಜೀವ ದಹನದಿಂದ ಪಾರಾಗುತ್ತಾಳೆ
      '6':
        title: ಪೌಲನು ಥೆಕ್ಲಾಳೊಂದಿಗೆ ಉಪವಾಸವಿದ್ದು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '7':
        title: ಪೌಲನು ಥೆಕ್ಲಾಳನ್ನು ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಕಳುಹಿಸುತ್ತಾನೆ
      '8':
        title: ತ್ರಿಫೈನಾ ಥೆಕ್ಲಾಳನ್ನು ಕಾಡುಮೃಗಗಳಿಂದ ರಕ್ಷಿಸುತ್ತಾಳೆ
      '9':
        title: ಥೆಕ್ಲಾ ಕೊಳದಲ್ಲಿ ತಾನೇ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಕೊಳ್ಳುತ್ತಾಳೆ
      '10':
        title: ಥೆಕ್ಲಾ ಸೆಲ್ಯೂಕ್ಯದಲ್ಲಿ ಮಹಿಳೆಯರಿಗೆ ಬೋಧಿಸುತ್ತಾಳೆ
      '11':
        title: ದೈವಿಕ ಧ್ವನಿ ಥೆಕ್ಲಾಳ ಮುಸುಕನ್ನು ರಕ್ಷಿಸುತ್ತದೆ
  Gospel of Peter:
    display_name: ಪೇತ್ರನ ಸುವಾರ್ತೆ
    author: ಅಜ್ಞಾತ. ಉಳಿದುಬಂದಿರುವ ನಿರೂಪಣೆ ಪೇತ್ರನ ಧ್ವನಿಯಲ್ಲಿ ಮಾತನಾಡುತ್ತದೆ ಮತ್ತು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಸಾರವಾಗಿದೆ; ಆದರೆ ಇದನ್ನು ಐತಿಹಾಸಿಕ ಅಪೊಸ್ತಲ ಪೇತ್ರನ ಕೃತಿಯೆಂದು ಪರಿಗಣಿಸಲಾಗುವುದಿಲ್ಲ.
    audience: ಯೇಸುವಿನ ಯಾತನೆ ಮತ್ತು ಪುನರುತ್ಥಾನದ ವಿಸ್ತೃತ ನಿರೂಪಣೆಯಲ್ಲಿ ಆಸಕ್ತಿ ಹೊಂದಿದ್ದ ಆದಿಕಾಲದ ಕ್ರೈಸ್ತರು; ಬಹುಶಃ ಪೇತ್ರನ ಅಧಿಕಾರಕ್ಕೆ ವಿಶೇಷ ಮಹತ್ವವಿದ್ದ ಸಮುದಾಯಗಳವರು.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿದ್ದೆಂದು ದಿನಾಂಕ ನಿಗದಿಪಡಿಸಲಾಗುತ್ತದೆ; ಉಳಿದುಬಂದಿರುವ ಮುಖ್ಯ ಗ್ರೀಕ್ ತುಣುಕು ಬಹಳ ನಂತರದ ಕಾಲದ ಹಸ್ತಪ್ರತಿಯಿಂದ ಬಂದಿದ್ದು, ಅದು ಅಖ್ಮೀಮ್‌ನಲ್ಲಿ ಪತ್ತೆಯಾಯಿತು.
    chapters:
      '1':
        title: ಕರ್ತನ ವಿಚಾರಣೆ ನಡೆಸಲು ಹೆರೋದನು ಆದೇಶಿಸುತ್ತಾನೆ
      '2':
        title: ಯೋಸೇಫನು ಕರ್ತನ ದೇಹವನ್ನು ಸಮಾಧಿ ಮಾಡುತ್ತಾನೆ
      '3':
        title: ಜನಸಮೂಹವು ದೇವರ ಮಗನನ್ನು ಹಾಸ್ಯಮಾಡುತ್ತದೆ
      '4':
        title: ಅಪರಾಧಿ ಯೇಸುವಿನ ಗೌರವವನ್ನು ಸಮರ್ಥಿಸುತ್ತಾನೆ
      '5':
        title: ಮಧ್ಯಾಹ್ನವೇ ಯೂದಾಯವನ್ನು ಕತ್ತಲೆ ಆವರಿಸುತ್ತದೆ
      '6':
        title: ಯೇಸುವನ್ನು ಯೋಸೇಫನ ಸಮಾಧಿಯಲ್ಲಿ ಇಡಲಾಗುತ್ತದೆ
      '7':
        title: ಮಾಡಿದ ತಪ್ಪಿಗಾಗಿ ಜನರು ದುಃಖಿಸುತ್ತಾರೆ
      '8':
        title: ಹಿರಿಯರು ಯೇಸುವಿನ ಸಮಾಧಿಗೆ ಕಾವಲು ಹಾಕುತ್ತಾರೆ
      '9':
        title: ಮುಂಜಾನೆ ದೈವಿಕ ಧ್ವನಿ ಕೇಳಿಸುತ್ತದೆ
      '10':
        title: ಮೂರು ಮಂದಿ ಸಮಾಧಿಯಿಂದ ಹೊರಬರುತ್ತಾರೆ
      '11':
        title: ಸೈನಿಕರು ಪಿಲಾತನಿಗೆ ವರದಿ ಮಾಡುತ್ತಾರೆ
      '12':
        title: ಮಗ್ದಲದ ಮರಿಯಳು ಸಮಾಧಿಯನ್ನು ಹುಡುಕುತ್ತಾಳೆ
      '13':
        title: ದೂತನ ಸುದ್ದಿ ಕೇಳಿ ಮಹಿಳೆಯರು ಓಡಿಹೋಗುತ್ತಾರೆ
      '14':
        title: ಹಬ್ಬದ ಬಳಿಕ ಶಿಷ್ಯರು ಅಳುತ್ತಾರೆ
  2 Clement:
    display_name: 2 ಕ್ಲೆಮೆಂಟ್
    author: ಅಜ್ಞಾತ. ಸಾಂಪ್ರದಾಯಿಕ ಶೀರ್ಷಿಕೆ ಹಾಗಿದ್ದರೂ, ಇದು ರೋಮಿನ ಕ್ಲೆಮೆಂಟ್ ಬರೆದ ಎರಡನೇ ಪತ್ರವಲ್ಲ; ಬದಲಾಗಿ ಆದಿಕಾಲದ ಕ್ರೈಸ್ತ ಧರ್ಮೋಪದೇಶವಾಗಿದೆ.
    audience: ಪಶ್ಚಾತ್ತಾಪ, ನೈತಿಕ ಸ್ಥಿರತೆ, ದುರ್ಬಲರ ಆರೈಕೆ ಮತ್ತು ಪುನರುತ್ಥಾನ ಹಾಗೂ ನ್ಯಾಯತೀರ್ಪಿನ ನಿರೀಕ್ಷೆಯಲ್ಲಿ ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ಸಹಿಸುವಂತೆ ಪ್ರೇರೇಪಿಸಲ್ಪಟ್ಟ ಕ್ರೈಸ್ತ ಸಭೆ.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಮೊದಲಾರ್ಧ ಅಥವಾ ಮಧ್ಯಭಾಗಕ್ಕೆ (ಸುಮಾರು ಕ್ರಿ.ಶ. 100–160) ಸೇರಿದ್ದೆಂದು ದಿನಾಂಕ ನಿಗದಿಪಡಿಸಲಾಗುತ್ತದೆ; ಇದನ್ನು ರಚಿಸಿದ ಸ್ಥಳ ಅನಿಶ್ಚಿತವಾಗಿದೆ.
    chapters:
      '1':
        title: ಯೇಸು ಕ್ರಿಸ್ತನು ನಮ್ಮ ನ್ಯಾಯಾಧೀಶ
      '2':
        title: ಸಭೆಯು ನಂಬಿಕೆಯಿಂದ ತುಂಬಿದೆ
      '3':
        title: ಕ್ರಿಸ್ತನು ನಮಗೆ ಕರುಣೆ ತೋರಿಸುತ್ತಾನೆ
      '4':
        title: ನಿಜವಾದ ಅರಿಕೆ ಕ್ರಿಯೆಗಳಲ್ಲಿ ಕಾಣುತ್ತದೆ
      '5':
        title: ದೇವರಿಗಾಗಿ ನಿರ್ಭಯವಾಗಿ ಜೀವಿಸಿ
      '6':
        title: ಐಶ್ವರ್ಯಕ್ಕಿಂತ ದೇವರನ್ನು ಆರಿಸಿಕೊಳ್ಳಿ
      '7':
        title: ಸ್ಪರ್ಧೆಯಲ್ಲಿ ಪೂರ್ಣಮನಸ್ಸಿನಿಂದ ಭಾಗವಹಿಸಿ
      '8':
        title: ಬದುಕಿರುವಾಗಲೇ ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ
      '9':
        title: ದೇಹವನ್ನು ದೇವಾಲಯದಂತೆ ಕಾಪಾಡಿಕೊಳ್ಳಿ
      '10':
        title: ಸದ್ಗುಣ ಮತ್ತು ಶಾಂತಿಯನ್ನು ಅರಸಿರಿ
      '11':
        title: ಶುದ್ಧ ಹೃದಯದಿಂದ ದೇವರ ಸೇವೆಮಾಡಿ
      '12':
        title: ಪ್ರೀತಿ ಮತ್ತು ನೀತಿವಂತಿಕೆ ಕಾದಿವೆ
      '13':
        title: ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟು ಒಳ್ಳೆಯತನವನ್ನು ಅರಸಿರಿ
      '14':
        title: ಜೀವಂತ ಸಭೆಗೆ ಸೇರಿದವರಾಗಿರಿ
      '15':
        title: ಶ್ರದ್ಧೆಯಿಂದ ಆತ್ಮಸಂಯಮವನ್ನು ಅಭ್ಯಾಸಮಾಡಿ
      '16':
        title: ಸಮಯವಿರುವಾಗಲೇ ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ
      '17':
        title: ದುರ್ಬಲರು ಒಳ್ಳೆಯತನದ ಕಡೆ ಸಾಗಲು ನೆರವಾಗಿ
      '18':
        title: ನೀತಿವಂತಿಕೆಗಾಗಿ ಶ್ರಮಿಸಿ
      '19':
        title: ಈಗಲೇ ಪೂರ್ಣಮನಸ್ಸಿನಿಂದ ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ
      '20':
        title: ಸಂಕಟದಲ್ಲಿನ ದೇವರ ತರಬೇತಿಯನ್ನು ನಂಬಿರಿ
  Epistle of Barnabas:
    display_name: ಬಾರ್ನಬನ ಪತ್ರ
    author: ಅಜ್ಞಾತ. ಈ ಕೃತಿಯನ್ನು ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ಪೌಲನ ಸಂಗಾತಿ ಬಾರ್ನಬನೊಂದಿಗೆ ಸಂಬಂಧಿಸಲಾಗಿತ್ತು; ಆದರೆ ಆಧುನಿಕ ವಿದ್ವಾಂಸರು ಆ ಕರ್ತೃತ್ವವನ್ನು ಒಪ್ಪುವುದಿಲ್ಲ.
    audience: ಇಸ್ರಾಯೇಲಿನ ಪವಿತ್ರಗ್ರಂಥಗಳನ್ನು ಕ್ರಿಸ್ತಕೇಂದ್ರಿತ ಮತ್ತು ರೂಪಕಾತ್ಮಕ ವ್ಯಾಖ್ಯಾನದ ಮೂಲಕ ತಮ್ಮದಾಗಿಸಿಕೊಳ್ಳುವಂತೆಯೂ, ತಮ್ಮ ಒಡಂಬಡಿಕೆಯ ಗುರುತನ್ನು ಯೆಹೂದಿ ಆಚರಣೆಗಳಿಂದ ಪ್ರತ್ಯೇಕಿಸಿಕೊಳ್ಳುವಂತೆಯೂ ಬೋಧನೆ ಪಡೆದ ಯೆಹೂದ್ಯೇತರ ಕ್ರೈಸ್ತರು.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 70ರಲ್ಲಿ ಯೆರೂಸಲೇಮ್ ದೇವಾಲಯ ನಾಶವಾದ ಕಾಲದಿಂದ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಆರಂಭದವರೆಗಿನ ಅವಧಿಗೆ, ಅನೇಕವೇಳೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 80–130ಕ್ಕೆ, ಸೇರಿದ್ದೆಂದು ದಿನಾಂಕ ನಿಗದಿಪಡಿಸಲಾಗುತ್ತದೆ.
    chapters:
      '1':
        title: ದೇವರ ಕೃಪೆ ಪ್ರಿಯ ಸಮುದಾಯವನ್ನು ತುಂಬುತ್ತದೆ
      '2':
        title: ವಿಶ್ವಾಸಿಗಳು ದೇವರ ನಿಜವಾದ ಆಜ್ಞೆಯನ್ನು ಹುಡುಕುತ್ತಾರೆ
      '3':
        title: ಉಪವಾಸವೆಂದರೆ ಕರುಣೆ ಮತ್ತು ನ್ಯಾಯ
      '4':
        title: ಎಚ್ಚರವಾಗಿರುವ ಕ್ರೈಸ್ತರು ಪರೀಕ್ಷೆಗಳನ್ನು ಎದುರುನೋಡುತ್ತಾರೆ
      '5':
        title: ಪಾಪಿಗಳಿಗಾಗಿ ಯೇಸು ಸಂಕಟಪಟ್ಟನು
      '6':
        title: ವಾಗ್ದಾನಿತ ರಾಜ್ಯವನ್ನು ಯೇಸು ನೆರವೇರಿಸುತ್ತಾನೆ
      '7':
        title: ಯೇಸುವಿನ ಗಾಯಗಳಿಗಾಗಿ ದೇವರಿಗೆ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸಿ
      '8':
        title: ಎಳೆಹಸುವಿನ ಯಜ್ಞವು ಯೇಸುವನ್ನು ಮುನ್ಸೂಚಿಸುತ್ತದೆ
      '9':
        title: ಹೃದಯದ ಸುನ್ನತಿ ನಂಬಿಕೆಯನ್ನು ಸೂಚಿಸುತ್ತದೆ
      '10':
        title: ಆಹಾರ ನಿಯಮಗಳು ಆಧ್ಯಾತ್ಮಿಕ ಪಾಠಗಳನ್ನು ಕಲಿಸುತ್ತವೆ
      '11':
        title: ದೀಕ್ಷಾಸ್ನಾನ ಮತ್ತು ಶಿಲುಬೆ ಕ್ಷಮೆಯನ್ನು ತರುತ್ತವೆ
      '12':
        title: ಮೋಶೆಯ ಕೈಗಳು ಯೇಸುವನ್ನು ಸೂಚಿಸುತ್ತವೆ
      '13':
        title: ಯಾಕೋಬನ ಆಶೀರ್ವಾದವು ಸ್ಥಾನಪಲ್ಲಟವನ್ನು ಮುನ್ಸೂಚಿಸುತ್ತದೆ
      '14':
        title: ಯೇಸು ಹೃದಯಗಳನ್ನು ದೇವರಿಗಾಗಿ ವಿಮೋಚಿಸುತ್ತಾನೆ
      '15':
        title: ನ್ಯಾಯದ ನಂತರ ಸಬ್ಬತ್ ವಿಶ್ರಾಂತಿ ಬರುತ್ತದೆ
      '16':
        title: ನಿಜವಾದ ದೇವಾಲಯವು ವಿಶ್ವಾಸಿಗಳೊಳಗಿದೆ
      '17':
        title: ರಕ್ಷಣೆಯನ್ನು ಈಗ ಸ್ಪಷ್ಟವಾಗಿ ವಿವರಿಸಲಾಗಿದೆ
      '18':
        title: ಬೆಳಕಿನ ದೂತರು ಮತ್ತು ಕತ್ತಲೆಯ ಅಧಿಪತಿ
      '19':
        title: ಬೆಳಕಿನ ಮಾರ್ಗವು ಭಕ್ತಿಯನ್ನು ಆಜ್ಞಾಪಿಸುತ್ತದೆ
      '20':
        title: ಕತ್ತಲೆಯ ದಾರಿ ನಿತ್ಯನಾಶಕ್ಕೆ ಕರೆದೊಯ್ಯುತ್ತದೆ
      '21':
        title: ಮಹಿಮೆಗಾಗಿ ಕರ್ತನ ಆಜ್ಞೆಗಳನ್ನು ಪಾಲಿಸಿರಿ
  Letters of Ignatius:
    display_name: ಇಗ್ನೇಷಿಯಸ್‌ನ ಪತ್ರಗಳು
    author: ಸಾಮಾನ್ಯವಾಗಿ ಅಂಗೀಕರಿಸಲ್ಪಟ್ಟ ಮಧ್ಯಮ ಪಾಠರೂಪದ ಏಳು ಪತ್ರಗಳ ಕರ್ತೃ ಅಂತಿಯೋಕ್ಯದ ಬಿಷಪ್ ಇಗ್ನೇಷಿಯಸ್; ನಂತರ ವಿಸ್ತರಿಸಲಾದ ಹಾಗೂ ಇಗ್ನೇಷಿಯಸ್ ಹೆಸರಿನಲ್ಲಿ ಬೇರೆಯವರು ಬರೆದ ಪತ್ರಗಳು ಈ ಸಂಗ್ರಹದ ವ್ಯಾಪ್ತಿಗೆ ಸೇರಿಲ್ಲ.
    audience: ಇಗ್ನೇಷಿಯಸ್ ಹುತಾತ್ಮನಾಗುವ ದಾರಿಯಲ್ಲಿ ಪ್ರಯಾಣಿಸುತ್ತಿದ್ದಾಗ ಉದ್ದೇಶಿಸಿ ಬರೆದ ಎಫೆಸಸ್, ಮಗ್ನೇಶಿಯಾ, ತ್ರಲ್ಲೆಸ್, ರೋಮ್, ಫಿಲದೆಲ್ಫಿಯಾ ಮತ್ತು ಸ್ಮಿರ್ನಾದ ಕ್ರೈಸ್ತ ಸಭೆಗಳು, ಹಾಗೆಯೇ ಪಾಲಿಕಾರ್ಪ್.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಆರಂಭಕ್ಕೆ, ಹೆಚ್ಚಾಗಿ ಸು. 105–117ಕ್ಕೆ ದಿನಾಂಕ ನಿಗದಿಪಡಿಸಲಾಗುತ್ತದೆ; ಆದರೂ ಇಗ್ನೇಷಿಯಸ್‌ನ ಪ್ರಯಾಣದ ನಿಖರ ಕಾಲಾನುಕ್ರಮದ ಕುರಿತು ಇನ್ನೂ ಚರ್ಚೆಯಿದೆ.
    chapters:
      '1':
        title: ಇಗ್ನೇಷಿಯಸ್ ಎಫೆಸಸ್ ಸಭೆಯನ್ನು ವಂದಿಸುತ್ತಾನೆ
      '2':
        title: ವಿಶ್ವಾಸಿಗಳು ಬಂಧಿತ ಇಗ್ನೇಷಿಯಸ್‌ಗೆ ಬೆಂಬಲ ನೀಡುತ್ತಾರೆ
      '3':
        title: ಐಕ್ಯತೆ ಮತ್ತು ಪ್ರಾರ್ಥನೆಯ ಮೂಲಕ ಬಿಷಪ್‌ರನ್ನು ಗೌರವಿಸಿರಿ
      '4':
        title: ಇಗ್ನೇಷಿಯಸ್ ವಿನಯದಿಂದ ಮಾತನಾಡುತ್ತಾನೆ
      '5':
        title: ಯೇಸುವಿನ ಪ್ರೀತಿಯಿಂದ ಐಕ್ಯತೆ
      '6':
        title: ಬಿಷಪ್ ವಿಶ್ವಾಸಿಗಳನ್ನು ಪ್ರಾರ್ಥನೆಯಲ್ಲಿ ಒಂದುಗೂಡಿಸುತ್ತಾರೆ
      '7':
        title: ಶಾಂತವಾಗಿ ಉತ್ತಮ ನಾಯಕತ್ವ ನೀಡುವ ಬಿಷಪ್‌ರನ್ನು ಗೌರವಿಸಿರಿ
      '8':
        title: ಸುಳ್ಳು ಬೋಧಕರ ಪ್ರಭಾವದ ಬಗ್ಗೆ ಎಚ್ಚರವಾಗಿರಿ
      '9':
        title: ಎಫೆಸದವರ ಭಕ್ತಿ ಮತ್ತು ಇಗ್ನೇಷಿಯಸ್
      '10':
        title: ಕೆಟ್ಟ ಬೋಧನೆಯನ್ನು ತಿರಸ್ಕರಿಸಿ ಸ್ಥಿರವಾಗಿ ನಿಲ್ಲಿರಿ
      '11':
        title: ಎಲ್ಲ ಜನರಿಗಾಗಿ ನಿರಂತರವಾಗಿ ಪ್ರಾರ್ಥಿಸಿರಿ
      '12':
        title: ಎಲ್ಲ ಬಂಧನಗಳಿಗಿಂತ ಕ್ರಿಸ್ತನೇ ಶ್ರೇಷ್ಠ
      '13':
        title: ದಂಡಿತನಾದವನಂತೆ ಇಗ್ನೇಷಿಯಸ್ ಬರೆಯುತ್ತಾನೆ
      '14':
        title: ಶಾಂತಿಯು ಸೈತಾನನ ಕುತಂತ್ರಗಳ ಶಕ್ತಿಯನ್ನು ಮುರಿಯುತ್ತದೆ
      '15':
        title: ನಂಬಿಕೆಯು ಒಳ್ಳೆಯತನ ಮತ್ತು ಪ್ರೀತಿಗೆ ನಡೆಸುತ್ತದೆ
      '16':
        title: ಮೌನದ ಮೂಲಕ ಸತ್ಯವನ್ನು ಜೀವಿಸುವುದು
      '17':
        title: ಕುಟುಂಬಗಳನ್ನು ಹಾಳುಮಾಡುವವರು ಸ್ವಾಸ್ತ್ಯವನ್ನು ಹೊಂದುವುದಿಲ್ಲ
      '18':
        title: ದೇವರ ಜ್ಞಾನವನ್ನು ವಿವೇಕದಿಂದ ಸ್ವೀಕರಿಸಿರಿ
      '19':
        title: ಶಿಲುಬೆಗಾಗಿ ತನ್ನನ್ನು ಏನೂ ಅಲ್ಲವೆಂದು ಎಣಿಸುವುದು
      '20':
        title: ಮರಿಯಳು, ನಕ್ಷತ್ರ ಮತ್ತು ಕ್ರಿಸ್ತನ ಜಯ
      '21':
        title: ಮತ್ತೆ ಬರೆಯಲು ಇಗ್ನೇಷಿಯಸ್ ಆಶಿಸುತ್ತಾನೆ
      '22':
        title: ಇಗ್ನೇಷಿಯಸ್ ಓದುಗರಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '23':
        title: ಮಗ್ನೇಶಿಯಾದ ಸಭೆ ಕೃಪೆಯಿಂದ ಆಶೀರ್ವದಿತವಾಗಿದೆ
      '24':
        title: ಇಗ್ನೇಷಿಯಸ್ ಐಕ್ಯತೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '25':
        title: ಬಿಷಪ್‌ಗಾಗಿ ಇಗ್ನೇಷಿಯಸ್ ದೇವರಿಗೆ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸುತ್ತಾನೆ
      '26':
        title: ನಿಮ್ಮ ಯುವ ಬಿಷಪ್‌ರನ್ನು ಗೌರವಿಸಿರಿ
      '27':
        title: ನಿಜವಾದ ಕ್ರೈಸ್ತರಾಗಿ ಜೀವಿಸಿರಿ
      '28':
        title: ನಂಬಿಕೆಯು ಶಾಶ್ವತ ಮುದ್ರೆಯನ್ನು ಆರಿಸಿಕೊಳ್ಳುತ್ತದೆ
      '29':
        title: ಇಗ್ನೇಷಿಯಸ್ ಸಭೆಯ ಐಕ್ಯತೆಯನ್ನು ಅಪ್ಪಿಕೊಳ್ಳುತ್ತಾನೆ
      '30':
        title: ವಿಶ್ವಾಸಿಗಳು ಬಿಷಪ್‌ರ ಅಧೀನದಲ್ಲಿ ಸೇರುತ್ತಾರೆ
      '31':
        title: ಯೇಸು ಕೃಪೆಯ ಮೂಲಕ ಪ್ರಕಟನಾದನು
      '32':
        title: ಎದ್ದ ಕ್ರಿಸ್ತನಲ್ಲಿ ನಿರೀಕ್ಷೆ ಸ್ಥಿರವಾಗಿದೆ
      '33':
        title: ಹಳೆಯ ಹುಳಿಯನ್ನು ತೆಗೆದುಹಾಕಿರಿ
      '34':
        title: ಕ್ರಿಸ್ತನ ಅಸ್ತಿವಾರದಲ್ಲಿ ಸ್ಥಿರವಾಗಿ ನಿಲ್ಲಿರಿ
      '35':
        title: ವಿನಯವು ನಂಬಿಕೆಯಲ್ಲಿ ಸಂತೋಷ ತರುತ್ತದೆ
      '36':
        title: ಬಿಷಪ್‌ರೊಂದಿಗೆ ನಂಬಿಕೆಯಲ್ಲಿ ಒಂದಾಗಿರಿ
      '37':
        title: ಪ್ರಾರ್ಥನೆಗಳು ಸಭೆಗೆ ಚೈತನ್ಯ ತರುತ್ತವೆ
      '38':
        title: ದೈವಿಕ ಸಾಮರಸ್ಯದಲ್ಲಿ ಸಭೆಗಳನ್ನು ವಂದಿಸಿರಿ
      '39':
        title: ಯೇಸುವಿನ ಬಾಧೆಯ ಮೂಲಕ ಶಾಂತಿ
      '40':
        title: ಮನಸ್ಸಿನಲ್ಲಿ ನಿರ್ದೋಷಿಗಳಾಗಿಯೂ ತಾಳ್ಮೆಯುಳ್ಳವರಾಗಿಯೂ ಇರಿ
      '41':
        title: ವಿಶ್ವಾಸಿಗಳು ಬಿಷಪ್‌ರಿಗೂ ಕ್ರಿಸ್ತನಿಗೂ ವಿಧೇಯರಾಗುತ್ತಾರೆ
      '42':
        title: ನಾಯಕರನ್ನು ಯೇಸು ಕ್ರಿಸ್ತನಂತೆ ಗೌರವಿಸಿರಿ
      '43':
        title: ಹೆಮ್ಮೆಯ ಬದಲು ಸೌಮ್ಯತೆಯನ್ನು ಹಂಬಲಿಸಿರಿ
      '44':
        title: ಇಗ್ನೇಷಿಯಸ್ ಪರಲೋಕದ ಜ್ಞಾನದ ಕುರಿತು ಭಯಭಕ್ತಿಯುಳ್ಳವನಾಗಿದ್ದನು
      '45':
        title: ನಂಬಿಕೆಯನ್ನು ಪೋಷಿಸಿರಿ, ಪಾಷಂಡ ಬೋಧನೆಗಳನ್ನಲ್ಲ
      '46':
        title: ಸಭೆಯ ನಾಯಕತ್ವಕ್ಕೆ ನಿಷ್ಠರಾಗಿರಿ
      '47':
        title: ಸೌಮ್ಯತೆಯನ್ನು ಆಯುಧವನ್ನಾಗಿ ಧರಿಸಿಕೊಳ್ಳಿರಿ
      '48':
        title: ಕ್ರಿಸ್ತನೊಬ್ಬನೇ ನಿಜವಾದ ಜೀವವನ್ನು ತರುತ್ತಾನೆ
      '49':
        title: ನಿಜವಾದ ಬಾಧೆಯು ಕ್ರಿಸ್ತನ ನೈಜತೆಯನ್ನು ದೃಢಪಡಿಸುತ್ತದೆ
      '50':
        title: ಸುಳ್ಳು ಬೋಧಕರ ಮಾರಕ ಫಲದಿಂದ ದೂರವಿರಿ
      '51':
        title: ಪ್ರಾರ್ಥನೆ ಮತ್ತು ಭಕ್ತಿಯಲ್ಲಿ ಒಂದಾಗಿರಿ
      '52':
        title: ಪ್ರೀತಿಯಿಂದ ಬಿಷಪ್‌ರಿಗೆ ಅಧೀನರಾಗಿರಿ
      '53':
        title: ರೋಮ್‌ನ ನಂಬಿಗಸ್ತ ಸಭೆಗೆ ವಂದನೆಗಳು
      '54':
        title: ನನ್ನ ಪ್ರಯಾಣದ ಅಂತ್ಯಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸಿರಿ
      '55':
        title: ಮನುಷ್ಯರ ಮೆಚ್ಚುಗೆಯನ್ನಲ್ಲ, ದೇವರ ಮೆಚ್ಚುಗೆಯನ್ನು ಹುಡುಕಿರಿ
      '56':
        title: ಆಂತರಿಕ ಬಲಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸಿರಿ
      '57':
        title: ದೇವರಿಗಾಗಿ ಸ್ವಇಚ್ಛೆಯಿಂದ ಮರಣವನ್ನು ಎದುರಿಸಿರಿ
      '58':
        title: ಇಗ್ನೇಷಿಯಸ್ ಬಾಧೆಯನ್ನು ಸ್ವಾಗತಿಸುತ್ತಾನೆ
      '59':
        title: ಕ್ರಿಸ್ತನಿಗಾಗಿ ಲೌಕಿಕ ಆಸೆಗಳನ್ನು ಶಿಲುಬೆಗೇರಿಸಿರಿ
      '60':
        title: ಇಗ್ನೇಷಿಯಸ್ ಲೌಕಿಕ ಆಸೆಗಳನ್ನು ತಿರಸ್ಕರಿಸುತ್ತಾನೆ
      '61':
        title: ಇಗ್ನೇಷಿಯಸ್ ನಂಬಿಗಸ್ತನಾಗಿ ಬಾಧೆ ಅನುಭವಿಸಲು ಬಯಸುತ್ತಾನೆ
      '62':
        title: ಸಿರಿಯಾದ ಸಭೆಯು ಕುರುಬರಿಸಲ್ಪಡಲೆಂದು ಪ್ರಾರ್ಥಿಸಿರಿ
      '63':
        title: ಸ್ಮಿರ್ನಾದಿಂದ ಸಿರಿಯಾಕ್ಕೆ ವಂದನೆಗಳು
      '64':
        title: ಫಿಲದೆಲ್ಫಿಯಾದ ಐಕ್ಯತೆಯನ್ನು ಪ್ರಶಂಸಿಸಲಾಗಿದೆ
      '65':
        title: ಬಿಷಪ್ ಸತ್ಗುಣದಿಂದ ದೇವರ ಸೇವೆ ಮಾಡುತ್ತಾರೆ
      '66':
        title: ನಿಮ್ಮ ಕುರುಬನನ್ನು ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ಹಿಂಬಾಲಿಸಿರಿ
      '67':
        title: ಹಾನಿಕರ ಬೋಧನೆಗಳನ್ನು ತಿರಸ್ಕರಿಸಿರಿ
      '68':
        title: ಒಂದೇ ಯೂಕರಿಸ್ಟ್‌ನಲ್ಲಿ ಒಟ್ಟಾಗಿ ಪಾಲ್ಗೊಳ್ಳಿರಿ
      '69':
        title: ಯೇಸು ಕ್ರಿಸ್ತನ ಬಂಧನಗಳಲ್ಲಿ ಹರ್ಷಿಸಿರಿ
      '70':
        title: ಯೆಹೂದ್ಯ ಮತಾಚರಣೆಯನ್ನು ತಿರಸ್ಕರಿಸಿ ಕ್ರಿಸ್ತನನ್ನು ಅಪ್ಪಿಕೊಳ್ಳಿರಿ
      '71':
        title: ಆತ್ಮನು ಮರೆಯಾದ ಸತ್ಯಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '72':
        title: ಐಕ್ಯತೆಯು ಗುಂಪುಗಾರಿಕೆಯನ್ನು ತಿರಸ್ಕರಿಸುತ್ತದೆ
      '73':
        title: ಕ್ರಿಸ್ತನು ಎಲ್ಲರನ್ನೂ ದೇವರಲ್ಲಿ ಒಂದುಗೂಡಿಸುತ್ತಾನೆ
      '74':
        title: ಅಂತಿಯೋಕ್ಯದ ಸಭೆಗೆ ಶಾಂತಿ ಬರುತ್ತದೆ
      '75':
        title: ಫಿಲೋ ಮತ್ತು ರಾಯಸ್ ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ಗೌರವಿಸಲ್ಪಟ್ಟರು
      '76':
        title: ಸ್ಮಿರ್ನಾದ ಸಭೆ ಸಮೃದ್ಧವಾಗಿ ಆಶೀರ್ವದಿತವಾಗಿದೆ
      '77':
        title: ಯೇಸು ಕ್ರಿಸ್ತನ ನಿಜವಾದ ವಂಶೋದ್ಭವ
      '78':
        title: ಕ್ರಿಸ್ತನ ಬಾಧೆ ನಿಜವಾಗಿಯೂ ವಾಸ್ತವಿಕವಾಗಿತ್ತು
      '79':
        title: ಎದ್ದ ಯೇಸು ದೇಹಧಾರಿಯಾಗಿಯೇ ಉಳಿದನು
      '80':
        title: ಪಶ್ಚಾತ್ತಾಪಪಡಲು ಕಾಡುಮೃಗಗಳಿಗೆ ಎಚ್ಚರಿಕೆ
      '81':
        title: ಕ್ರಿಸ್ತನನ್ನು ನಿರಾಕರಿಸುವುದು ಪುನರುತ್ಥಾನವನ್ನು ನಿರಾಕರಿಸುವುದೇ
      '82':
        title: ಯೂಕರಿಸ್ಟ್ ಕ್ರಿಸ್ತನ ದೇಹವಾಗಿದೆ
      '83':
        title: ಸುಳ್ಳು ಬೋಧಕರ ಬೋಧನೆಗಳಿಂದ ದೂರವಿರಿ
      '84':
        title: ಕ್ರಿಸ್ತನನ್ನು ಹಿಂಬಾಲಿಸುವಂತೆ ಬಿಷಪ್‌ರನ್ನು ಹಿಂಬಾಲಿಸಿರಿ
      '85':
        title: ಎಚ್ಚೆತ್ತು ಪಶ್ಚಾತ್ತಾಪಪಡಿರಿ
      '86':
        title: ಕ್ರಿಸ್ತನ ಸೇವಕರನ್ನು ಸ್ವಾಗತಿಸಿರಿ
      '87':
        title: ಅಂತಿಯೋಕ್ಯಕ್ಕೆ ಶಾಂತಿದೂತನನ್ನು ಕಳುಹಿಸಿರಿ
      '88':
        title: ಬುರ್ರಸ್ ಬಂಧಿತ ಇಗ್ನೇಷಿಯಸ್‌ಗೆ ಉತ್ತೇಜನ ನೀಡುತ್ತಾನೆ
      '89':
        title: ಇಗ್ನೇಷಿಯಸ್ ವಿಶ್ವಾಸಿಗಳನ್ನು ಹೆಸರಿನಿಂದ ವಂದಿಸುತ್ತಾನೆ
      '90':
        title: ಇಗ್ನೇಷಿಯನು ಬಿಷಪ್ ಪಾಲಿಕಾರ್ಪನಿಗೆ ಬರೆಯುತ್ತಾನೆ
      '91':
        title: ಸ್ಥಿರವಾದ ಸೇವೆಗೆ ಇಗ್ನೇಷಿಯನ ಪ್ರೋತ್ಸಾಹ
      '92':
        title: ಜ್ಞಾನದಿಂದ ಹಾನಿಯನ್ನು ಸರಿಪಡಿಸಿ
      '93':
        title: ಬಡಿಗಲ್ಲಿನಂತೆ ದೃಢವಾಗಿ ನಿಲ್ಲಿ
      '94':
        title: ದೇವರ ಸಮ್ಮತಿಯೊಂದಿಗೆ ವಿಧವೆಯರನ್ನು ಕಾಪಾಡಿ
      '95':
        title: ಕೆಟ್ಟ ಆಚರಣೆಗಳನ್ನು ತೊರೆದು ವಿವೇಕದಿಂದ ಮದುವೆಯಾಗಿ
      '96':
        title: ವಿಧೇಯರಾಗಿ, ಸೇವೆಮಾಡಿ, ಒಟ್ಟಾಗಿ ಮೇಲೇಳಿ
      '97':
        title: ಪಾಲಿಕಾರ್ಪನು ಸಿರಿಯಾಕ್ಕೆ ಪ್ರತಿನಿಧಿಯನ್ನು ಕಳುಹಿಸುತ್ತಾನೆ
      '98':
        title: ಗೌರವಯುತ ಕಾರ್ಯಗಳಿಗಾಗಿ ಸಂದೇಶವಾಹಕರನ್ನು ಏರ್ಪಡಿಸಿ
  Polycarp to the Philippians:
    display_name: ಫಿಲಿಪ್ಪಿಯರಿಗೆ ಪಾಲಿಕಾರ್ಪನ ಪತ್ರ
    author: ಸ್ಮುರ್ನದ ಬಿಷಪ್ ಪಾಲಿಕಾರ್ಪ. ನಮಗೆ ದೊರೆತಿರುವ ಪಠ್ಯವು ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ಸಂದರ್ಭಗಳಲ್ಲಿ ಕಳುಹಿಸಲಾದ ವಿಷಯಗಳನ್ನು ಒಟ್ಟುಗೂಡಿಸಿದೆ ಎಂದು ಕೆಲವು ವಿದ್ವಾಂಸರು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುತ್ತಾರೆ.
    audience: ಇಗ್ನೇಷಿಯನ ಪತ್ರಗಳನ್ನು ಕೇಳಿದ್ದ ಮತ್ತು ನಂಬಿಕೆ, ನಡತೆ, ನಾಯಕತ್ವ, ಹಣ ಹಾಗೂ ತಾಳ್ಮೆಯ ಕುರಿತು ಸಲಹೆ ಪಡೆದ ಫಿಲಿಪ್ಪಿಯ ಕ್ರೈಸ್ತ ಸಭೆ.
    date: ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಆರಂಭದಿಂದ ಮಧ್ಯಭಾಗದವರೆಗೆ; ಕನಿಷ್ಠ ಒಂದು ಭಾಗವು ಇಗ್ನೇಷಿಯನ ಪ್ರಯಾಣದೊಂದಿಗೆ ನಿಕಟವಾಗಿ ಸಂಬಂಧಿಸಿದೆ. ಇದು ಸಂಯುಕ್ತ ಪತ್ರವೆಂಬ ಅಭಿಪ್ರಾಯಗಳು, ಇದರ ಒಂದು ಭಾಗವು ಸ್ವಲ್ಪ ನಂತರದ್ದಾಗಿರಬಹುದು ಎಂದು ಸೂಚಿಸುತ್ತವೆ.
    chapters:
      '1':
        title: ಫಿಲಿಪ್ಪಿಯರಿಗೆ ಪಾಲಿಕಾರ್ಪನ ವಂದನೆ
      '2':
        title: ಪಾಪಿಗಳಿಗಾಗಿ ಕ್ರಿಸ್ತನು ಕಷ್ಟ ಅನುಭವಿಸಿದನು
      '3':
        title: ಭಯಭಕ್ತಿಯಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ದೇವರ ಸೇವೆಮಾಡಿ
      '4':
        title: ನೀತಿಯ ಕುರಿತು ಪಾಲಿಕಾರ್ಪನು ಬರೆಯುತ್ತಾನೆ
      '5':
        title: ವಿಧವೆಯರು ಸತ್ಯನಿಷ್ಠೆಯಿಂದ ನಿರಂತರವಾಗಿ ಪ್ರಾರ್ಥಿಸಲಿ
      '6':
        title: ಸಭಾಸೇವಕರು ಈಗ ನಿರ್ದೋಷವಾಗಿ ಕ್ರಿಸ್ತನ ಸೇವೆಮಾಡಲಿ
      '7':
        title: ಹಿರಿಯರು ಎಲ್ಲರಿಗೂ ಕರುಣೆ ತೋರಿಸಲಿ
      '8':
        title: ಕ್ರಿಸ್ತವಿರೋಧಿಯನ್ನೂ ಸುಳ್ಳು ಬೋಧನೆಗಳನ್ನೂ ತಿರಸ್ಕರಿಸಿ
      '9':
        title: ನಿರೀಕ್ಷೆಯನ್ನು ಹಿಡಿದುಕೊಂಡು ಕ್ರಿಸ್ತನನ್ನು ಹಿಂಬಾಲಿಸಿ
      '10':
        title: ನಂಬಿಗಸ್ತ ಪವಿತ್ರರ ಮಾದರಿಗಳನ್ನು ಅನುಸರಿಸಿ
      '11':
