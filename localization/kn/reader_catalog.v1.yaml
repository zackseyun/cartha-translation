      '2':
        title: ದೇವಾಲಯ ಕಟ್ಟುವವರಿಗೆ ದೇವರ ಪ್ರೋತ್ಸಾಹ
  Zechariah:
    display_name: ಜೆಕರ್ಯ
    author: ಬೆರೆಕ್ಯನ ಮಗ ಜೆಕರ್ಯ; 9–14ನೇ ಅಧ್ಯಾಯಗಳು ಬಹುಶಃ ನಂತರದ ಮತ್ತೊಬ್ಬ ಲೇಖಕರಿಂದ ಬಂದವು.
    audience: ದೇವಾಲಯವನ್ನು ಪುನರ್‌ನಿರ್ಮಿಸುತ್ತಿದ್ದ ಹಿಂದಿರುಗಿದವರು ಮತ್ತು ನಂತರದ ದೇಶಭ್ರಷ್ಟೋತ್ತರ ಸಮುದಾಯಗಳು.
    date: 1–8ನೇ ಅಧ್ಯಾಯಗಳು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 520–518; 9–14ನೇ ಅಧ್ಯಾಯಗಳು ಬಹುಶಃ ಸುಮಾರು ಒಂದು ಶತಮಾನದ ನಂತರ.
