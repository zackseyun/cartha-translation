books:
  Genesis:
    display_name: ಆದಿಕಾಂಡ
    author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಸಂಪ್ರದಾಯದ ಪ್ರಕಾರ ಮೋಶೆಗೆ ಸಂಬಂಧಿಸಲಾಗಿದೆ. ಆಧುನಿಕ ವಿದ್ವಾಂಸರ ಪ್ರಕಾರ, ಇದು ದೀರ್ಘಕಾಲದ ರಚನಾ ಇತಿಹಾಸವನ್ನು ಹೊಂದಿದ್ದು, ವಿವಿಧ ಮೂಲಗಳನ್ನು ನಂತರ ಒಟ್ಟಾಗಿ ಸಂಪಾದಿಸಲಾಗಿದೆ.
    audience: ಒಡಂಬಡಿಕೆಯ ಜನರೆಂಬ ಗುರುತಿನಲ್ಲಿದ್ದ ಇಸ್ರಾಯೇಲ್ಯರು; ದೇವರ ಸೃಷ್ಟಿ, ಆಯ್ಕೆ ಮತ್ತು ವಾಗ್ದಾನಗಳಲ್ಲಿ ಜನರ ಮೂಲದ ಕಥೆಯನ್ನು ನೆಲೆಗೊಳಿಸುತ್ತದೆ.
    date: ಹಲವಾರು ಶತಮಾನಗಳ ಅವಧಿಯಲ್ಲಿ ರಚಿಸಲಾಯಿತು; ಬಾಬಿಲೋನಿನ ದೇಶಭ್ರಷ್ಟತೆಯ ಸಮಯದಲ್ಲಿ ಅಥವಾ ನಂತರ, ಸುಮಾರು ಕ್ರಿ.ಪೂ. 6–5ನೇ ಶತಮಾನದಲ್ಲಿ ಈಗ ಸ್ವೀಕರಿಸಲ್ಪಟ್ಟ ರೂಪವನ್ನು ತಲುಪಿತು.
    summary: ಆದಿಕಾಂಡವು ಸೃಷ್ಟಿ, ಮಾನವಕುಲದ ದಂಗೆ ಮತ್ತು ಚದುರುವಿಕೆ, ಹಾಗೂ ಇಸ್ರಾಯೇಲಿಗೆ ದೇವರು ನೀಡಿದ ಒಡಂಬಡಿಕೆಯ ವಾಗ್ದಾನಗಳು ಆರಂಭವಾಗಲು ಕಾರಣವಾದ ಅಬ್ರಹಾಮ, ಇಸಾಕ, ಯಾಕೋಬ ಮತ್ತು ಯೋಸೇಫರ ಕುಟುಂಬದ ಕಥೆಯನ್ನು ಹೇಳುತ್ತದೆ.
    chapters:
      '1':
        title: ದೇವರು ಆಕಾಶವನ್ನೂ ಭೂಮಿಯನ್ನೂ ಸೃಷ್ಟಿಸುತ್ತಾನೆ
      '2':
        title: ದೇವರು ಪುರುಷನನ್ನೂ ಸ್ತ್ರೀಯನ್ನೂ ರೂಪಿಸುತ್ತಾನೆ
      '3':
        title: ಮಾನವಕುಲವು ಏದೆನಿನಿಂದ ಪತನಗೊಳ್ಳುತ್ತದೆ
      '4':
        title: ಕಾಯಿನನು ತನ್ನ ಸಹೋದರ ಹೇಬೆಲನನ್ನು ಕೊಲ್ಲುತ್ತಾನೆ
      '5':
        title: ಆದಾಮನಿಂದ ನೋಹನವರೆಗಿನ ವಂಶಾವಳಿ ದಾಖಲಾಗುತ್ತದೆ
      '6':
        title: ದೇವರು ಜಲಪ್ರಳಯದಿಂದ ಪಾಪಕ್ಕೆ ತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '7':
        title: ಜಲಪ್ರಳಯದ ನೀರು ಭೂಮಿಯನ್ನು ಆವರಿಸುತ್ತದೆ
      '8':
        title: ನೋಹನು ನಾವೆಯಿಂದ ಹೊರಬಂದು ದೇವರನ್ನು ಆರಾಧಿಸುತ್ತಾನೆ
      '9':
        title: ಜಲಪ್ರಳಯದ ನಂತರ ನೋಹನ ಕುಟುಂಬ
      '10':
        title: ನೋಹನ ಸಂತತಿಯವರು ಎಲ್ಲೆಡೆ ಹರಡುತ್ತಾರೆ
      '11':
        title: ಗೋಪುರದ ಬಳಿಯ ಭಾಷಾ ಗೊಂದಲವು ಜನರನ್ನು ಚದುರಿಸುತ್ತದೆ
      '12':
        title: ಅಬ್ರಾಮನು ವಿಧೇಯನಾಗಿ ಕಾನಾನಿಗೆ ಹೊರಡುತ್ತಾನೆ
      '13':
        title: ಅಬ್ರಾಮನು ಐಶ್ವರ್ಯವಂತನಾಗಿ ಹಿಂದಿರುಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '14':
        title: ಅಬ್ರಾಮನು ಆಕ್ರಮಣಕಾರರಿಂದ ಲೋಟನನ್ನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '15':
        title: ದೇವರು ಅಬ್ರಾಮನಿಗೆ ಸಂತತಿಯನ್ನು ವಾಗ್ದಾನ ಮಾಡುತ್ತಾನೆ
      '16':
        title: ಹಾಗರಳು ಓಡಿಹೋಗಿ ಮರುಭೂಮಿಯ ಬುಗ್ಗೆಯನ್ನು ತಲುಪುತ್ತಾಳೆ
      '17':
        title: ಅಬ್ರಹಾಮನಿಗೆ ಸುನ್ನತಿಯಾಗುತ್ತದೆ; ದೇವರು ಒಡಂಬಡಿಕೆಯನ್ನು ನವೀಕರಿಸುತ್ತಾನೆ
      '18':
        title: ದೇವರು ಅಬ್ರಹಾಮನಿಗೆ ಒಬ್ಬ ಮಗನನ್ನು ವಾಗ್ದಾನ ಮಾಡುತ್ತಾನೆ
      '19':
        title: ಲೋಟನು ಬೆಂಕಿಗಾಹುತಿಯಾದ ಪಟ್ಟಣಗಳಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '20':
        title: ಎಚ್ಚರಿಕೆಯ ನಂತರ ಅಬೀಮೆಲೆಕನು ಸಾರಳನ್ನು ಹಿಂದಿರುಗಿಸುತ್ತಾನೆ
      '21':
        title: ಸಾರಳು ಅಬ್ರಹಾಮನಿಗೆ ಇಸಾಕನನ್ನು ಹೆರುತ್ತಾಳೆ
      '22':
        title: ಅಬ್ರಹಾಮನು ಮೊರೀಯದಲ್ಲಿ ಇಸಾಕನನ್ನು ಅರ್ಪಿಸುತ್ತಾನೆ
      '23':
        title: ಸಾರಳು ಸಾಯುತ್ತಾಳೆ; ಅಬ್ರಹಾಮನು ಸಮಾಧಿಯ ಸ್ಥಳವನ್ನು ಕೊಂಡುಕೊಳ್ಳುತ್ತಾನೆ
      '24':
        title: ಸೇವಕನು ಇಸಾಕನಿಗಾಗಿ ರೆಬೆಕ್ಕಳನ್ನು ಕಂಡುಕೊಳ್ಳುತ್ತಾನೆ
      '25':
        title: ಅಬ್ರಹಾಮನ ಸಂತತಿ ಮತ್ತು ಮರಣ ದಾಖಲಾಗುತ್ತದೆ
      '26':
        title: ಇಸಾಕನು ಗೆರಾರಿನಲ್ಲಿ ಸುರಕ್ಷಿತವಾಗಿ ವಾಸಿಸುತ್ತಾನೆ
      '27':
        title: ಯಾಕೋಬನು ಇಸಾಕನನ್ನು ಮೋಸಗೊಳಿಸಿ ಆಶೀರ್ವಾದ ಪಡೆಯುತ್ತಾನೆ
      '28':
        title: ಯಾಕೋಬನು ದೇವದೂತರ ಮೆಟ್ಟಿಲನ್ನು ಕನಸಿನಲ್ಲಿ ಕಾಣುತ್ತಾನೆ
      '29':
        title: ಯಾಕೋಬನು ರಾಹೇಲಳನ್ನು ಪ್ರೀತಿಸಿ ಲೇಯಳನ್ನು ಮದುವೆಯಾಗುತ್ತಾನೆ
      '30':
        title: ಕರುಣೆಯ ಮೂಲಕ ಯಾಕೋಬನು ಸಮೃದ್ಧನಾಗುತ್ತಾನೆ
      '31':
        title: ಯಾಕೋಬನು ಲಾಬಾನನ ಕೋಪಕ್ಕೆ ಹೆದರುತ್ತಾನೆ
      '32':
        title: ಯಾಕೋಬನು ದೇವರ ದೂತನೊಂದಿಗೆ ಹೋರಾಡುತ್ತಾನೆ
      '33':
        title: ಯಾಕೋಬನು ಏಸಾವನನ್ನು ಶಾಂತಿಯುತವಾಗಿ ಭೇಟಿಯಾಗುತ್ತಾನೆ
      '34':
        title: ಶೆಕೆಮನು ದೀನಾಳನ್ನು ಕ್ರೂರವಾಗಿ ಮಾನಭಂಗಪಡಿಸುತ್ತಾನೆ
      '35':
        title: ಯಾಕೋಬನು ಬೇತೇಲಿನ ಯಜ್ಞವೇದಿಯ ಬಳಿಗೆ ಹಿಂದಿರುಗುತ್ತಾನೆ
      '36':
        title: ಸೇಯೀರ್ ದೇಶದಲ್ಲಿದ್ದ ಏಸಾವನ ಸಂತತಿಯವರು
      '37':
        title: ಯೋಸೇಫನ ಸಹೋದರರು ಅವನನ್ನು ಅಲ್ಪ ಬೆಲೆಗೆ ಮಾರುತ್ತಾರೆ
      '38':
        title: ತಾಮಾರಳು ರಹಸ್ಯವಾಗಿ ಯೆಹೂದನ ವಂಶಕ್ಕೆ ಮಕ್ಕಳನ್ನು ಹೆರುತ್ತಾಳೆ
      '39':
        title: ಪೋಟೀಫರನ ಮನೆಯಲ್ಲಿ ಯೋಸೇಫನು ಏಳಿಗೆ ಹೊಂದುತ್ತಾನೆ
      '40':
        title: ಫರೋಹನ ಅಧಿಕಾರಿಗಳು ಕನಸು ಕಂಡು ಭಯಪಡುತ್ತಾರೆ
      '41':
        title: ಯೋಸೇಫನು ಫರೋಹನ ಕನಸುಗಳನ್ನು ಅರ್ಥವಿವರಿಸುತ್ತಾನೆ
      '42':
        title: ಯಾಕೋಬನು ಧಾನ್ಯಕ್ಕಾಗಿ ತನ್ನ ಪುತ್ರರನ್ನು ಕಳುಹಿಸುತ್ತಾನೆ
      '43':
        title: ಬೆನ್ಯಾಮೀನನು ತನ್ನ ಸಹೋದರರೊಂದಿಗೆ ಈಜಿಪ್ಟಿಗೆ ಹೋಗುತ್ತಾನೆ
      '44':
        title: ಯೆಹೂದನು ಬೆನ್ಯಾಮೀನನ ಜೀವಕ್ಕಾಗಿ ಬೇಡಿಕೊಳ್ಳುತ್ತಾನೆ
      '45':
        title: ಯೋಸೇಫನು ತನ್ನ ಸಹೋದರರೊಂದಿಗೆ ಮತ್ತೆ ಒಂದಾಗುತ್ತಾನೆ
      '46':
        title: ಇಸ್ರಾಯೇಲನು ಸುರಕ್ಷಿತವಾಗಿ ಗೋಷೆನಿಗೆ ಪ್ರಯಾಣಿಸುತ್ತಾನೆ
      '47':
        title: ಯೋಸೇಫನು ತನ್ನ ಕುಟುಂಬಕ್ಕೆ ಆಹಾರ ಒದಗಿಸುತ್ತಾನೆ
      '48':
        title: ಯಾಕೋಬನು ವಿವೇಕದಿಂದ ಯೋಸೇಫನ ಪುತ್ರರನ್ನು ಆಶೀರ್ವದಿಸುತ್ತಾನೆ
      '49':
        title: ಯಾಕೋಬನು ತನ್ನ ಪುತ್ರರ ಭವಿಷ್ಯದ ಕುರಿತು ಪ್ರವಾದಿಸುತ್ತಾನೆ
      '50':
        title: ಯೋಸೇಫನು ಯಾಕೋಬನ ಕೊನೆಯ ಬಯಕೆಯನ್ನು ನೆರವೇರಿಸುತ್ತಾನೆ
  Exodus:
    display_name: ವಿಮೋಚನಕಾಂಡ
    author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಸಂಪ್ರದಾಯದ ಪ್ರಕಾರ ಮೋಶೆಗೆ ಸಂಬಂಧಿಸಲಾಗಿದೆ. ಆಧುನಿಕ ವಿದ್ವಾಂಸರ ಪ್ರಕಾರ, ಇದು ದೀರ್ಘಕಾಲದ ರಚನಾ ಇತಿಹಾಸವನ್ನು ಹೊಂದಿದ್ದು, ವಿವಿಧ ಮೂಲಗಳನ್ನು ನಂತರ ಒಟ್ಟಾಗಿ ಸಂಪಾದಿಸಲಾಗಿದೆ.
    audience: ಬಿಡುಗಡೆ ಹೊಂದಿ ಒಡಂಬಡಿಕೆಗೆ ಒಳಪಟ್ಟ ಜನರಾದ ಇಸ್ರಾಯೇಲ್ಯರು; ದೇವರ ನಿಯಮದ ಅಧೀನದಲ್ಲಿ ಯೆಹೋವನ ಜನಾಂಗವಾಗಿರುವುದರ ಅರ್ಥವನ್ನು ಕಲಿಯುವವರು.
    date: ಹಲವಾರು ಶತಮಾನಗಳ ಅವಧಿಯಲ್ಲಿ ರಚಿಸಲಾಯಿತು; ಸುಮಾರು ಕ್ರಿ.ಪೂ. 6–5ನೇ ಶತಮಾನದಲ್ಲಿ ಈಗ ಸ್ವೀಕರಿಸಲ್ಪಟ್ಟ ರೂಪವನ್ನು ತಲುಪಿತು.
    chapters:
      '1':
        title: ಇಸ್ರಾಯೇಲರ ಬೆಳವಣಿಗೆಗೆ ದೇವರು ಅನುಗ್ರಹಿಸುತ್ತಾನೆ
      '2':
        title: ಮೋಶೆಯು ಫರೋಹನಿಂದ ರಕ್ಷಿಸಲ್ಪಡುತ್ತಾನೆ
      '3':
        title: ಮೋಶೆಯು ದೇವರ ಕರೆಯನ್ನು ಕೇಳುತ್ತಾನೆ
      '4':
        title: ಮೋಶೆಯು ದೇವರ ಶಕ್ತಿಯನ್ನು ಎದುರಿಸುತ್ತಾನೆ
      '5':
        title: ಫರೋಹನು ತನ್ನ ಹೃದಯವನ್ನು ಕಠಿಣಪಡಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '6':
        title: ಬಿಡುಗಡೆ ಮಾಡುವುದಾಗಿ ಯೆಹೋವನು ವಾಗ್ದಾನ ಮಾಡುತ್ತಾನೆ
      '7':
        title: ಆರೋನನೂ ಮೋಶೆಯೂ ಎದುರಿಸುತ್ತಾರೆ
      '8':
        title: ವಿಪತ್ತುಗಳು ಈಜಿಪ್ಟನ್ನು ತೀವ್ರವಾಗಿ ಬಾಧಿಸುತ್ತವೆ
      '9':
        title: ದೇವರು ಆಲಿಕಲ್ಲಿನಿಂದ ಈಜಿಪ್ಟನ್ನು ಬಾಧಿಸುತ್ತಾನೆ
      '10':
        title: ಫರೋಹನು ಮತ್ತೆ ನಿರಾಕರಿಸುತ್ತಾನೆ
      '11':
        title: ಕೊನೆಯ ವಿಪತ್ತು ಸಮೀಪಿಸುತ್ತದೆ
      '12':
        title: ಇಸ್ರಾಯೇಲ್ಯರು ಮರಣವನ್ನು ದಾಟಿಹೋಗುತ್ತಾರೆ
      '13':
        title: ಯೆಹೋವನು ಇಸ್ರಾಯೇಲರ ದಾರಿಗೆ ಮಾರ್ಗದರ್ಶನ ನೀಡುತ್ತಾನೆ
      '14':
        title: ದೇವರು ಕೆಂಪು ಸಮುದ್ರವನ್ನು ಇಬ್ಭಾಗ ಮಾಡುತ್ತಾನೆ
      '15':
        title: ಮೋಶೆ ಮತ್ತು ಇಸ್ರಾಯೇಲ್ಯರು ಸ್ತುತಿಗೀತೆ ಹಾಡುತ್ತಾರೆ
      '16':
        title: ಯೆಹೋವನು ಪ್ರತಿದಿನ ಮನ್ನವನ್ನು ಒದಗಿಸುತ್ತಾನೆ
      '17':
        title: ಅಮಾಲೇಕ್ಯರು ಇಸ್ರಾಯೇಲರ ಪಾಳೆಯದ ಮೇಲೆ ದಾಳಿ ಮಾಡುತ್ತಾರೆ
      '18':
        title: ಇತ್ರೋ ಮೋಶೆಗೆ ವಿವೇಕದಿಂದ ಸಲಹೆ ನೀಡುತ್ತಾನೆ
      '19':
        title: ಇಸ್ರಾಯೇಲ್ಯರು ಸೀನಾಯಿಯಲ್ಲಿ ತಮ್ಮನ್ನು ಪ್ರತಿಷ್ಠಿಸಿಕೊಳ್ಳುತ್ತಾರೆ
      '20':
        title: ದೇವರು ಹತ್ತು ಆಜ್ಞೆಗಳನ್ನು ನೀಡುತ್ತಾನೆ
      '21':
        title: ಇಸ್ರಾಯೇಲರ ಸ್ವಾತಂತ್ರ್ಯಕ್ಕಾಗಿ ನಿರ್ದಿಷ್ಟ ನ್ಯಾಯನಿಯಮಗಳು
      '22':
        title: ನಷ್ಟಪರಿಹಾರ ಮತ್ತು ನ್ಯಾಯವನ್ನು ಎತ್ತಿಹಿಡಿಯಲಾಗುತ್ತದೆ
      '23':
        title: ಸತ್ಯ, ನ್ಯಾಯಪರತೆ ಮತ್ತು ಕರುಣೆ ಅಗತ್ಯ
      '24':
        title: ಬಲಿಯ ಮೂಲಕ ಒಡಂಬಡಿಕೆ ದೃಢಪಡುತ್ತದೆ
      '25':
        title: ಪವಿತ್ರ ನಿವಾಸದ ಕುರಿತ ಸೂಚನೆಗಳು
      '26':
        title: ಗುಡಾರದ ವಿನ್ಯಾಸ ಪ್ರಕಟವಾಗುತ್ತದೆ
      '27':
        title: ಕಂಚಿನ ಯಜ್ಞವೇದಿ ಮತ್ತು ಅಂಗಳ
      '28':
        title: ಆರೋನನು ಯಾಜಕನಾಗಿ ಪ್ರತ್ಯೇಕಿಸಲ್ಪಡುತ್ತಾನೆ
      '29':
        title: ಯಾಜಕರು ಸೇವೆಗಾಗಿ ಪ್ರತಿಷ್ಠಿಸಲ್ಪಡುತ್ತಾರೆ
      '30':
        title: ಪವಿತ್ರ ಅಭಿಷೇಕ ತೈಲ ಮತ್ತು ಧೂಪ
      '31':
        title: ಗುಡಾರಕ್ಕಾಗಿ ದೇವರು ಕುಶಲಕರ್ಮಿಗಳನ್ನು ಆಯ್ಕೆಮಾಡುತ್ತಾನೆ
      '32':
        title: ಮೋಶೆಯು ಕೋಪದಲ್ಲಿ ಕಲ್ಲಿನ ಹಲಗೆಗಳನ್ನು ಒಡೆದುಹಾಕುತ್ತಾನೆ
      '33':
        title: ಮೋಶೆಯು ದೇವರ ಮಹಿಮೆಯನ್ನು ಕಾಣಲು ಬೇಡಿಕೊಳ್ಳುತ್ತಾನೆ
      '34':
        title: ಮೋಶೆಯು ಹೊಸ ಕಲ್ಲಿನ ಹಲಗೆಗಳನ್ನು ಪಡೆಯುತ್ತಾನೆ
      '35':
        title: ಮೋಶೆಯು ಇಸ್ರಾಯೇಲರನ್ನು ಒಟ್ಟುಗೂಡಿಸಿ ಆಜ್ಞೆ ತಿಳಿಸುತ್ತಾನೆ
      '36':
        title: ಕುಶಲಕರ್ಮಿಗಳು ಆಜ್ಞೆಯಂತೆ ಪವಿತ್ರಸ್ಥಾನವನ್ನು ನಿರ್ಮಿಸುತ್ತಾರೆ
      '37':
        title: ಬೆಚಲೇಲನು ಪವಿತ್ರ ಸಾಮಗ್ರಿಗಳನ್ನು ನಿಖರವಾಗಿ ತಯಾರಿಸುತ್ತಾನೆ
      '38':
        title: ಕಂಚಿನ ಯಜ್ಞವೇದಿ ಮತ್ತು ತೊಳೆಯುವ ಗಂಗಾಳ ತಯಾರಾಗುತ್ತವೆ
      '39':
        title: ಪವಿತ್ರ ಸೇವೆಗಾಗಿ ಆರೋನನ ಉಡುಪುಗಳು
      '40':
        title: ಮೋಶೆಯು ಗುಡಾರವನ್ನು ಸ್ಥಾಪಿಸುತ್ತಾನೆ
  Leviticus:
    display_name: ಯಾಜಕಕಾಂಡ
    author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಸಂಪ್ರದಾಯದ ಪ್ರಕಾರ ಮೋಶೆಗೆ ಸಂಬಂಧಿಸಲಾಗಿದೆ. ಆಧುನಿಕ ವಿದ್ವಾಂಸರು ಇದನ್ನು ಯಾಜಕ ಮೂಲಕ್ಕೆ ಸೇರಿದೆ ಎಂದು ಪರಿಗಣಿಸುತ್ತಾರೆ.
    audience: ಇಸ್ರಾಯೇಲ್ಯ ಯಾಜಕರು ಮತ್ತು ಆರಾಧನಾ ಸಮುದಾಯ—ಬಲಿಗಳು, ಪರಿಶುದ್ಧತೆ ಮತ್ತು ದೇವರ ಸಾನ್ನಿಧ್ಯವನ್ನು ಕೇಂದ್ರವಾಗಿಟ್ಟುಕೊಂಡ ಜೀವನದ ವ್ಯವಸ್ಥೆಯ ಕುರಿತ ಸೂಚನೆಗಳು.
    date: ರಾಜಪ್ರಭುತ್ವದ ಕೊನೆಯ ಕಾಲದಿಂದ ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಕಾಲದವರೆಗಿನ ರಚನಾ ಪದರಗಳು (ಸುಮಾರು ಕ್ರಿ.ಪೂ. 7–5ನೇ ಶತಮಾನ).
    chapters:
      '1':
        title: ಯೆಹೋವನಿಗೆ ಮೆಚ್ಚಿಗೆಯಾದ ಸರ್ವಾಂಗಹೋಮಗಳು
      '2':
        title: ಆತನ ಸನ್ನಿಧಿಯಲ್ಲಿ ಸುಡುವ ಧಾನ್ಯನೈವೇದ್ಯಗಳು
      '3':
        title: ಯಜ್ಞವೇದಿಯ ಮೇಲೆ ಸಮಾಧಾನ ಬಲಿ ಅರ್ಪಿಸಲಾಗುತ್ತದೆ
      '4':
        title: ಯಾಜಕರ ಮತ್ತು ಜನರ ಪಾಪಗಳು
      '5':
        title: ಪಾಪಗಳನ್ನು ಅರಿಕೆಮಾಡಿ ಬಲಿಯನ್ನು ತನ್ನಿರಿ
      '6':
        title: ಯಾಜಕರು ಬಲಿಗಳನ್ನು ಎಚ್ಚರಿಕೆಯಿಂದ ನಿರ್ವಹಿಸುತ್ತಾರೆ
      '7':
        title: ದೋಷಪರಿಹಾರ ಬಲಿ ಮತ್ತು ಸಮಾಧಾನ ಬಲಿಗಳ ವಿವರಣೆ
      '8':
        title: ಆರೋನನು ಯಾಜಕನಾಗಿ ಪ್ರತಿಷ್ಠಿಸಲ್ಪಟ್ಟದ್ದು
      '9':
        title: ಬೆಂಕಿಯು ಬಲಿಯನ್ನು ದಹಿಸಿದ್ದು
      '10':
        title: ನಾದಾಬ್ ಮತ್ತು ಅಬೀಹು ಶಿಕ್ಷಿಸಲ್ಪಟ್ಟದ್ದು
      '11':
        title: ಶುದ್ಧ ಮತ್ತು ಅಶುದ್ಧ ಆಹಾರಗಳ ನಿಯಮಗಳು
      '12':
        title: ಹೆರಿಗೆಯ ನಂತರ ಸ್ತ್ರೀಯ ಶುದ್ಧೀಕರಣ
      '13':
        title: ಯಾಜಕರು ಚರ್ಮರೋಗಗಳನ್ನು ಪರೀಕ್ಷಿಸುವುದು
      '14':
        title: ಬಲಿಗಳ ಮೂಲಕ ಶುದ್ಧನಾಗಿ ಪುನಃ ಸೇರಿಸಲ್ಪಡುವುದು
      '15':
        title: ದೇಹಸ್ರಾವಗಳಿಂದ ಉಂಟಾಗುವ ಅಶುದ್ಧತೆ
      '16':
        title: ಎಲ್ಲ ಪಾಪಗಳಿಗೆ ಪ್ರಾಯಶ್ಚಿತ್ತ
      '17':
        title: ದೇವದರ್ಶನದ ಗುಡಾರದ ಬಾಗಿಲಿಗೆ ಬಲಿಗಳನ್ನು ತರುವುದು
      '18':
        title: ಕರ್ತನು ನೈತಿಕ ಶುದ್ಧತೆಯನ್ನು ಆಜ್ಞಾಪಿಸುವುದು
      '19':
        title: ಇಸ್ರಾಯೇಲ್ಯರಿಗೆ ಪರಿಶುದ್ಧರಾಗಿರಲು ಕರೆ
      '20':
        title: ಘೋರ ಪಾಪಗಳಿಗೆ ಕಠಿಣ ಶಿಕ್ಷೆಗಳು
      '21':
        title: ಯಾಜಕರು ವಿಶೇಷ ಪರಿಶುದ್ಧತೆಯನ್ನು ಕಾಪಾಡಬೇಕು
      '22':
        title: ಪವಿತ್ರ ಅರ್ಪಣೆಗಳನ್ನು ಎಚ್ಚರಿಕೆಯಿಂದ ನಿರ್ವಹಿಸಬೇಕು
      '23':
        title: ಆರಾಧನೆಗಾಗಿ ನೇಮಿಸಲಾದ ಸಮಯಗಳು
      '24':
        title: ದೀಪಗಳು ಉರಿಯುವುದು ಮತ್ತು ರೊಟ್ಟಿಯ ಅರ್ಪಣೆ
      '25':
        title: ಪ್ರತಿ ಏಳನೇ ವರ್ಷ ಭೂಮಿಗೆ ವಿಶ್ರಾಂತಿ
      '26':
        title: ಇಸ್ರಾಯೇಲ್ಯರ ಮುಂದೆ ಒಡಂಬಡಿಕೆಯ ಮಾರ್ಗ
      '27':
        title: ಹರಕೆಗಳು ಮತ್ತು ಸಮರ್ಪಣೆಗಳನ್ನು ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ನೆರವೇರಿಸುವುದು
  Numbers:
    display_name: ಅರಣ್ಯಕಾಂಡ
    author: ಕರ್ತೃ ಅಜ್ಞಾತ; ಸಂಪ್ರದಾಯದ ಪ್ರಕಾರ ಮೋಶೆಗೆ ಸೇರಿಸಲಾಗಿದೆ.
