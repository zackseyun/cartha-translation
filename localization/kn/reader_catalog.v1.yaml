    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಅಥವಾ 3ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಕ್ರಿ.ಶ. 4ನೇ ಶತಮಾನದ ನಾಗ್ ಹಮ್ಮಾದಿ ಸಂಹಿತೆಗಳಲ್ಲಿ ಎರಡು ಕಾಪ್ಟಿಕ್ ಪ್ರತಿಗಳು ಉಳಿದಿವೆ.
