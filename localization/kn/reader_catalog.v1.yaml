      '24':
        title: ಮುಂದಿನ ಪುನರುತ್ಥಾನದ ಭರವಸೆಯನ್ನು ದೇವರು ನೀಡುತ್ತಾನೆ
      '25':
        title: ಫೀನಿಕ್ಸ್ ಪಕ್ಷಿ ಸತ್ತು ಮತ್ತೆ ಜೀವಂತವಾಗುತ್ತದೆ
      '26':
