        title: ದೈವಿಕ ತೀರ್ಪಿನಿಂದ ಬಾಬಿಲೋನ್ ಪತನ
      '52':
        title: ಯೆರೂಸಲೇಮ್ ಪತನ, ದೇವಾಲಯ ದಹನ
