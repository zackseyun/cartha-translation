      '16':
        title: ವಂಚನೆಯ ಕುರಿತು ಯೋಸೇಫನು ಮೌನವಾಗಿರುತ್ತಾನೆ
      '17':
        title: ಯೋಸೇಫನು ಪ್ರೀತಿಸುತ್ತಾನೆ ಮತ್ತು ತಪ್ಪುಗಳನ್ನು ಮರೆಮಾಡುತ್ತಾನೆ
      '18':
        title: ಯೋಸೇಫನು ದೀನತೆ ಮತ್ತು ಆಶೀರ್ವಾದವನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '19':
        title: ಯೋಸೇಫನು ಭವಿಷ್ಯದ ರಾಜ್ಯದ ದರ್ಶನವನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '20':
        title: ತನ್ನ ಎಲುಬುಗಳನ್ನು ಕೊಂಡೊಯ್ಯಲು ಯೋಸೇಫನು ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
  Testament of Benjamin:
    display_name: ಬೆನ್ಯಾಮೀನನ ಒಡಂಬಡಿಕೆ
    author: ಅಜ್ಞಾತ; ಹನ್ನೆರಡು ಮೂಲಪಿತೃಗಳ ಒಡಂಬಡಿಕೆಗಳ ಭಾಗ.
    audience: ಯೆಹೂದಿ ಓದುಗರು (ಮತ್ತು ನಂತರದ ಕ್ರೈಸ್ತ ಓದುಗರು).
    date: ಯೆಹೂದಿ ಮೂಲಭಾಗವು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನದ್ದು; ಕ್ರೈಸ್ತ ಸಂಪಾದನೆಯು ಸುಮಾರು ಕ್ರಿ.ಶ. 1ನೇ–2ನೇ ಶತಮಾನದ್ದು.
    chapters:
      '1':
        title: ಬೆನ್ಯಾಮೀನನು ಇಬ್ಬರು ಪುತ್ರರಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '2':
        title: ಸಹೋದರನಿಂದ ದ್ರೋಹದ ಸಂಗತಿಯನ್ನು ಯೋಸೇಫನು ಮರೆಮಾಡುತ್ತಾನೆ
      '3':
        title: ಯೋಸೇಫನ ಕರುಣೆಯನ್ನು ಅನುಕರಿಸಲು ಬೆನ್ಯಾಮೀನನು ಪ್ರೇರೇಪಿಸುತ್ತಾನೆ
      '4':
        title: ನೀತಿವಂತರು ಒಳ್ಳೆಯದರಿಂದ ಕೆಟ್ಟದ್ದನ್ನು ಜಯಿಸುತ್ತಾರೆ
      '5':
        title: ಒಳ್ಳೆಯದನ್ನು ಮಾಡುವುದು ಕತ್ತಲೆಯನ್ನು ಓಡಿಸುತ್ತದೆ
      '6':
        title: ಮಾರ್ಗದರ್ಶಕ ದೂತನ ಶಾಂತಿಯು ಜಯಿಸುತ್ತದೆ
      '7':
        title: ಬೆಲಿಯಾರನ ವಂಚಕ ಕೃತ್ಯಗಳನ್ನು ತೊರೆಯಿರಿ
      '8':
        title: ರಕ್ಷಕನ ಮಹಿಮೆಯನ್ನು ಬೆನ್ಯಾಮೀನನು ಪ್ರವಾದಿಸುತ್ತಾನೆ
      '9':
        title: ದೇವಾಲಯದ ಪುನರುಜ್ಜೀವನವನ್ನು ಪ್ರವಾದಿಯು ಮುಂತಿಳಿಸುತ್ತಾನೆ
      '10':
        title: ಅಂತಿಮ ಪುನರುತ್ಥಾನಕ್ಕಾಗಿ ಸತ್ಯವನ್ನು ಆಚರಿಸಿ
      '11':
        title: ನಿಷ್ಠಾವಂತ ಸೇವಕನ ಉದಯವನ್ನು ತೋಳವು ಪ್ರವಾದಿಸುತ್ತದೆ
      '12':
        title: ಬೆನ್ಯಾಮೀನನು ಸಾಯುತ್ತಾನೆ; ಹೆಬ್ರೋನಿನಲ್ಲಿ ಸಮಾಧಿಮಾಡಲು ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
  Gospel of Philip:
    display_name: ಫಿಲಿಪ್ಪನ ಸುವಾರ್ತೆ
    author: ಅಜ್ಞಾತ. ಹಸ್ತಪ್ರತಿಯ ಕೊನೆಯ ಉಪಲೇಖನದಲ್ಲಿ ಈ ಶೀರ್ಷಿಕೆ ಕಾಣುತ್ತದೆ; ಆದರೆ ಕೃತಿಯು ಫಿಲಿಪ್ಪನನ್ನು ತನ್ನ ಲೇಖಕನೆಂದು ಗುರುತಿಸುವುದಿಲ್ಲ. ಉಳಿದುಕೊಂಡಿರುವ ಏಕೈಕ ಪ್ರತಿ ನಾಗ್ ಹಮ್ಮಾದಿ ಕೋಡೆಕ್ಸ್ II,3ರ ಕಾಪ್ಟಿಕ್ ಪಠ್ಯವಾಗಿದೆ.
    audience: ವ್ಯಾಲೆಂಟೀನಿಯನ್ ಶೈಲಿಯ ಸಂಸ್ಕಾರೋಪದೇಶವನ್ನು—ವಿಶೇಷವಾಗಿ ದೀಕ್ಷಾಸ್ನಾನ, ಅಭಿಷೇಕ, ಯೂಕರಿಸ್ಟ್, ವಿಮೋಚನೆ, ಪುನರುತ್ಥಾನ ಮತ್ತು ವಧೂವರರ ಕೋಣೆಯ ರೂಪಕಗಳನ್ನು—ತಿಳಿದಿದ್ದ ಆರಂಭಿಕ ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಕೊನೆಯ ಅಥವಾ 3ನೇ ಶತಮಾನದ ಆರಂಭದ ಕಾಲದ್ದೆಂದು ದಿನಾಂಕ ನಿಗದಿಪಡಿಸಲಾಗಿದೆ; ಹಿಂದಿನ ಗ್ರೀಕ್ ರೂಪದಿಂದ ಅನುವಾದಗೊಂಡ 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಹಸ್ತಪ್ರತಿಯಲ್ಲಿ ಇದು ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    chapters:
      '1':
        title: ಕ್ರಿಸ್ತನು ಸಂಪೂರ್ಣ ದೈವಿಕ ಕುಟುಂಬವನ್ನು ತರುತ್ತಾನೆ
      '2':
        title: ನಂಬಿಕೆಯು ಚಳಿಗಾಲದ ವಾಗ್ದಾನವನ್ನು ಬಿತ್ತುತ್ತದೆ
      '3':
        title: ಪದಗಳು ನಿಜವಾದ ಆಧ್ಯಾತ್ಮಿಕ ವಾಸ್ತವತೆಯನ್ನು ಪ್ರಕಟಿಸುತ್ತವೆ
      '4':
        title: ಕ್ರಿಸ್ತನು ಆಧ್ಯಾತ್ಮಿಕ ಬಂಧನದಿಂದ ವಿಮೋಚಿಸುತ್ತಾನೆ
      '5':
        title: ಯೇಸು ಭೌತಿಕ ತಂದೆಯನ್ನು ಪ್ರತ್ಯೇಕಿಸಿ ತೋರಿಸುತ್ತಾನೆ
      '6':
        title: ಯೇಸು ಮರೆಯಾಗಿರುವ ದೈವಿಕ ವಾಸ್ತವತೆಯನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '7':
        title: ಪುನರುತ್ಥಾನವು ದೇಹಧಾರಿತ ಜೀವನವನ್ನು ರೂಪಾಂತರಿಸುತ್ತದೆ
      '8':
        title: ಯೇಸು ತನ್ನನ್ನು ಹಂತಹಂತವಾಗಿ ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '9':
        title: ಆಧ್ಯಾತ್ಮಿಕ ಮಕ್ಕಳು ಶಾಶ್ವತ ಜೀವನವನ್ನು ವೃದ್ಧಿಸುತ್ತಾರೆ
      '10':
        title: ಆಧ್ಯಾತ್ಮಿಕವಾಗಿ ಪರಿಪೂರ್ಣರಾದವರು ಎಲ್ಲರಿಗೂ ಸೇವೆಮಾಡುತ್ತಾರೆ
      '11':
        title: ದೀಕ್ಷಾಸ್ನಾನವು ಅಮರ ಜೀವನಕ್ಕೆ ರೂಪಾಂತರಿಸುತ್ತದೆ
      '12':
        title: ವಿವಾಹದ ರಹಸ್ಯವು ಪವಿತ್ರ ಏಕತೆಯನ್ನು ಪುನಃಸ್ಥಾಪಿಸುತ್ತದೆ
      '13':
        title: ದೈವಿಕ ಸತ್ಯವು ಆಧ್ಯಾತ್ಮಿಕ ಮರುಹುಟ್ಟನ್ನು ತರುತ್ತದೆ
      '14':
        title: ಕ್ರಿಸ್ತನು ಏಕತೆ ಮತ್ತು ಜೀವನವನ್ನು ಪುನಃಸ್ಥಾಪಿಸುತ್ತಾನೆ
      '15':
        title: ಪುನರುತ್ಥಾನವು ಈಗಲೇ ನಿಜವಾದ ಜೀವನವನ್ನು ಎಚ್ಚರಿಸುತ್ತದೆ
      '16':
        title: ದೈವಿಕ ಕೃಪೆಯಿಂದ ನಂಬಿಕೆ ಪಕ್ವಗೊಳ್ಳುತ್ತದೆ
      '17':
        title: ಯೇಸು ಕೆಡುಕನ್ನು ಬಯಲಿಗೆಳೆದು ತೆಗೆದುಹಾಕುತ್ತಾನೆ
      '18':
        title: ಪವಿತ್ರ ಐಕ್ಯವು ಶಾಶ್ವತ ಬೆಳಕನ್ನು ತರುತ್ತದೆ
  Gospel of Mary:
    display_name: ಮರಿಯಳ ಸುವಾರ್ತೆ
    author: ಅನಾಮಧೇಯ. ಈ ಕೃತಿಯು ಮರಿಯಳನ್ನು ಯೇಸುವಿನ ಪ್ರಕಟಣೆಯನ್ನು ಸ್ವೀಕರಿಸಿ ವ್ಯಾಖ್ಯಾನಿಸಿದವಳಾಗಿ ಚಿತ್ರಿಸುತ್ತದೆ; ಆದರೆ ಉಳಿದುಬಂದಿರುವ ಸುವಾರ್ತೆಯನ್ನು ಮರಿಯಳೇ ಬರೆದಳು ಎಂದು ಅದು ಹೇಳುವುದಿಲ್ಲ.
    audience: ಪ್ರಕಟನೆ, ಆತ್ಮಿಕ ಆರೋಹಣ, ಅಪೊಸ್ತಲರ ಅಧಿಕಾರ ಮತ್ತು ಯೇಸುವಿನ ಶಿಷ್ಯರ ನಡುವೆ ಮರಿಯಳ ಬೋಧನೆಯ ನ್ಯಾಯಸಮ್ಮತತೆ ಕುರಿತು ಚಿಂತಿಸುತ್ತಿದ್ದ ಆರಂಭಿಕ ಕ್ರೈಸ್ತ ಓದುಗರು.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿದ್ದೆಂದು ದಿನಾಂಕ ನಿರ್ಣಯಿಸಲಾಗುತ್ತದೆ; 3ನೇ ಶತಮಾನದ ಗ್ರೀಕ್ ತುಣುಕುಗಳು ಉಳಿದಿವೆ ಮತ್ತು ಪ್ರಮುಖ ಕಾಪ್ಟಿಕ್ ಪಾಠಸಾಕ್ಷ್ಯವು 5ನೇ ಶತಮಾನದ ಬರ್ಲಿನ್ ಕೋಡೆಕ್ಸ್ 8502ರಲ್ಲಿ ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    chapters:
      '1':
        title: ರಕ್ಷಕನು ಪಾಪಕ್ಕೆ ವಿರುದ್ಧವಾಗಿ ಬೋಧಿಸುತ್ತಾನೆ
      '2':
        title: ಯೇಸು ಶಿಷ್ಯರಿಗೆ ಶಾಂತಿಯನ್ನು ನೀಡಿ ಕಳುಹಿಸುತ್ತಾನೆ
      '3':
        title: ಮರಿಯಳು ಬೋಧನೆಗಳಿಂದ ಸಂತೈಸುತ್ತಾಳೆ
      '4':
        title: ಆತ್ಮವು ಮರೆವನ್ನು ಜಯಿಸುತ್ತದೆ
      '5':
        title: ಲೆವಿಯು ಸುವಾರ್ತೆ ಸಾರಲು ಪ್ರೇರೇಪಿಸುತ್ತಾನೆ
  Treatise on the Resurrection:
    display_name: ಪುನರುತ್ಥಾನದ ಕುರಿತ ಪ್ರಬಂಧ
    author: ಅನಾಮಧೇಯ. ಈ ಕೃತಿಯನ್ನು ರೆಗಿನೋಸ್ ಎಂಬ ಶಿಷ್ಯನಿಗೆ ಗುರು ಬರೆದ ಪತ್ರದ ರೂಪದಲ್ಲಿ ರಚಿಸಲಾಗಿದೆ; ಆ ಗುರುವಾಗಲಿ ರೆಗಿನೋಸ್ ಆಗಲಿ ಯಾರೆಂದು ಖಚಿತವಾಗಿ ಗುರುತಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.
    audience: ಪುನರುತ್ಥಾನದ ಕುರಿತು ಬೋಧನೆಯನ್ನು ಅರಸುತ್ತಿದ್ದ ಕ್ರೈಸ್ತರು, ವಿಶೇಷವಾಗಿ ದೈಹಿಕ ಮತ್ತು ಆತ್ಮಿಕ ಪುನರುತ್ಥಾನವನ್ನೂ ಪುನರುತ್ಥಾನದ ಜೀವನದಲ್ಲಿ ಈಗಲೇ ಪಾಲ್ಗೊಳ್ಳುವುದನ್ನೂ ಪರಿಗಣಿಸುತ್ತಿದ್ದ ಓದುಗರು.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಉತ್ತರಾರ್ಧಕ್ಕೆ (ಹೆಚ್ಚಾಗಿ ಸು. 170–200) ಸೇರಿಸಲಾಗುತ್ತದೆ; ಇದಕ್ಕಿಂತ ಹಿಂದಿನ ಗ್ರೀಕ್ ಕೃತಿಯ 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಪ್ರತಿಯಲ್ಲಿ ಇದು ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    chapters:
      '1':
        title: ಕ್ರಿಸ್ತನು ನಿಜವಾದ ಪರಿಪೂರ್ಣತೆಯನ್ನು ತರುತ್ತಾನೆ
      '2':
        title: ಕ್ರಿಸ್ತನು ಮರಣದ ಹಿಡಿತವನ್ನು ಜಯಿಸುತ್ತಾನೆ
      '3':
        title: ಪುನರುತ್ಥಾನವು ವಾಸ್ತವವನ್ನು ರೂಪಾಂತರಿಸುತ್ತದೆ
      '4':
        title: ವಿಶ್ವಾಸಿಗಳು ಕ್ರಿಸ್ತನ ಪುನರುತ್ಥಾನದಲ್ಲಿ ಪಾಲ್ಗೊಳ್ಳುತ್ತಾರೆ
      '5':
        title: ಕ್ರಿಸ್ತನ ಪುನರುತ್ಥಾನದಲ್ಲಿ ನಂಬಿಕೆ
      '6':
        title: ರಕ್ಷಣೆಯ ಜ್ಞಾನವು ಎಂದೆಂದಿಗೂ ಉಳಿಯುತ್ತದೆ
      '7':
        title: ಕೃಪೆಯು ಶಾಶ್ವತ ಜೀವನವನ್ನು ಕಾಪಾಡುತ್ತದೆ
      '8':
        title: ಪುನರುತ್ಥಾನವು ನಿಜವಾದ ಜೀವನವನ್ನು ಪ್ರಕಟಿಸುತ್ತದೆ
      '9':
        title: ಪುನರುತ್ಥಾನವು ಕ್ಷಯವನ್ನು ಜಯಿಸುತ್ತದೆ
      '10':
        title: ಪುನರುತ್ಥಾನಕ್ಕಾಗಿ ವಿಭಜನೆಯನ್ನು ತೊರೆಯಿರಿ
      '11':
        title: ಇತರರ ಹಿತಕ್ಕಾಗಿ ಬೋಧನೆಯನ್ನು ಹಂಚಿಕೊಳ್ಳಿರಿ
  Dialogue of the Savior:
    display_name: ರಕ್ಷಕನ ಸಂವಾದ
    author: ಅನಾಮಧೇಯ. ಈ ಸಂವಾದವು ಯೂದ, ಮತ್ತಾಯ ಮತ್ತು ಮರಿಯಳೊಂದಿಗೆ ನಡೆಸುವ ಮಾತುಕತೆಯಲ್ಲಿ ಪ್ರಕಟಣಾತ್ಮಕ ಬೋಧನೆಯನ್ನು ಯೇಸುವಿನ ಮಾತುಗಳಾಗಿ ನೀಡುತ್ತದೆ; ಆದರೆ ಇದನ್ನು ಸಂಕಲಿಸಿದವರು ಯಾರೆಂದು ತಿಳಿಸುವುದಿಲ್ಲ.
    audience: ಖಾಸಗಿ ಪ್ರಕಟಣೆ, ಶಿಷ್ಯತ್ವ, ಆತ್ಮಜ್ಞಾನ, ಪ್ರಾರ್ಥನೆ ಮತ್ತು ರಕ್ಷಣೆಗಾಗಿ ತಪೋಮಯ ಸಿದ್ಧತೆಯಲ್ಲಿ ಆಸಕ್ತಿಯಿದ್ದ ಆರಂಭಿಕ ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಆದರೆ ಇದರ ರಚನೆಯ ವಿವಿಧ ಪದರಗಳು ಮತ್ತು ನಿಖರ ದಿನಾಂಕದ ಕುರಿತು ಭಿನ್ನಾಭಿಪ್ರಾಯಗಳಿವೆ. ಇದು 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಹಸ್ತಪ್ರತಿಯಲ್ಲಿ ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    chapters:
      '1':
        title: ಯೇಸು ನಿಜವಾದ ವಿಶ್ರಾಂತಿಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '2':
        title: ದೇವರು ಶಾಶ್ವತ ಜೀವನದತ್ತ ನಡೆಸುತ್ತಾನೆ
      '3':
        title: ಅಪಾಯವನ್ನು ಸಂತೋಷದಿಂದ ದಾಟಿರಿ
      '4':
        title: ಅಂತರಂಗದ ಆತ್ಮವನ್ನು ಕ್ರಮಪಡಿಸಿರಿ
      '5':
        title: ದುಃಖವನ್ನು ಮೀರಿದ ಸತ್ಯವನ್ನು ಹುಡುಕಿರಿ
      '6':
        title: ಅಂತರಂಗದ ಹೃದಯವನ್ನು ಶುದ್ಧಗೊಳಿಸಿರಿ
      '7':
        title: ಪರಲೋಕದ ಒಳ್ಳೆಯತನವನ್ನು ಪ್ರತಿಬಿಂಬಿಸಿರಿ
      '8':
        title: ದೈವಿಕ ಶಕ್ತಿಯು ಎಲ್ಲವನ್ನೂ ಪೋಷಿಸುತ್ತದೆ
      '9':
        title: ಮೊದಲು ದೈವಿಕ ಮೂಲವನ್ನು ತಿಳಿಯಿರಿ
      '10':
        title: ಶಾಶ್ವತ ದೇವರನ್ನು ಎಂದೆಂದಿಗೂ ನೋಡಿರಿ
      '11':
        title: ದೈವಿಕ ಬೆಳಕನ್ನು ಧರಿಸಿಕೊಳ್ಳಿರಿ
      '12':
        title: ಕ್ರಿಸ್ತನ ಆತ್ಮಿಕ ಸಂಪತ್ತನ್ನು ಪ್ರಕಟಿಸಿರಿ
      '13':
        title: ಪ್ರೀತಿಯಿಂದ ಸಂಘರ್ಷವನ್ನು ಜಯಿಸಿರಿ
      '14':
        title: ನಿಜವಾದ ಪ್ರಾರ್ಥನೆ ಮೇಲಕ್ಕೆ ಏರುತ್ತದೆ
      '15':
        title: ಅಂತರಂಗದ ಜೀವನವನ್ನು ಎಚ್ಚರಿಕೆಯಿಂದ ಕಾಪಾಡಿರಿ
  Exegesis on the Soul:
    display_name: ಆತ್ಮದ ಕುರಿತ ವ್ಯಾಖ್ಯಾನ
    author: ಅನಾಮಧೇಯ. ಲೇಖಕನು ಕ್ರೈಸ್ತ ಪ್ರವಚನಕಾರನಾಗಿದ್ದು, ಧರ್ಮಗ್ರಂಥದ ಮತ್ತು ಗ್ರೀಕ್ ಸಾಹಿತ್ಯದ ಚಿತ್ರಣಗಳನ್ನು ಆತ್ಮದ ಪತನ, ಪಶ್ಚಾತ್ತಾಪ ಮತ್ತು ಪುನಃಸ್ಥಾಪನೆಯ ರೂಪಕವಾಗಿ ಮರುವ್ಯಾಖ್ಯಾನಿಸುತ್ತಾನೆ.
    audience: ಧರ್ಮಗ್ರಂಥ ಮತ್ತು ನೈತಿಕ ಉಪದೇಶದ ಪರಿಚಯವಿದ್ದು, ಅಸ್ತವ್ಯಸ್ತ ಬಯಕೆಯನ್ನು ತೊರೆದು ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟು ದೈವಿಕತೆಯೊಂದಿಗೆ ಪುನಃ ಒಂದಾಗಲು ಕರೆ ಪಡೆದ ಕ್ರೈಸ್ತರು.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಉತ್ತರಾರ್ಧ ಅಥವಾ 3ನೇ ಶತಮಾನದ ಆರಂಭಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಗ್ರೀಕ್‌ನಿಂದ ಅನುವಾದಿಸಲಾದ 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಪಾಠದಲ್ಲಿ ಇದು ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    chapters:
      '1':
        title: ಆತ್ಮವು ಕರುಣೆಯನ್ನು ಅರಸಿ ಪಶ್ಚಾತ್ತಾಪಪಡುತ್ತದೆ
      '2':
        title: ಆತ್ಮವು ಬಯಕೆಗಳ ಮೂಲಕ ದೇವರಿಗೆ ದ್ರೋಹಮಾಡುತ್ತದೆ
      '3':
        title: ದೇವರು ದೀಕ್ಷಾಸ್ನಾನದ ಮೂಲಕ ಆತ್ಮವನ್ನು ಶುದ್ಧಗೊಳಿಸುತ್ತಾನೆ
      '4':
        title: ಆತ್ಮವು ದೈವಿಕ ಮೂಲದೊಂದಿಗೆ ಪುನಃ ಒಂದಾಗುತ್ತದೆ
      '5':
        title: ಅಗೋಚರ ದೇವರಿಗೆ ಪ್ರಾಮಾಣಿಕವಾಗಿ ಪ್ರಾರ್ಥಿಸಿರಿ
      '6':
        title: ಆತ್ಮವು ಬಯಕೆಯಿಂದ ತನ್ನ ಮನೆಗೆ ಮರಳುತ್ತದೆ
      '7':
        title: ದೇವರು ಪ್ರಾಮಾಣಿಕ ಶೋಕವನ್ನು ಆಲಿಸುತ್ತಾನೆ
  Book of Thomas the Contender:
    display_name: ಸ್ಪರ್ಧಿ ತೋಮನ ಗ್ರಂಥ
    author: ಅನಾಮಧೇಯ. ಇದರ ಕೊನೆಯ ಶೀರ್ಷಿಕೆಯು ಕೃತಿಯನ್ನು ಯೂದ ತೋಮನೊಂದಿಗೆ ಸಂಬಂಧಿಸಿ, ಮತ್ತಾಯನನ್ನು ದಾಖಲಿಸಿದವನೆಂದು ಹೆಸರಿಸುತ್ತದೆ; ಆದರೆ ಇವು ದೃಢಪಡಿಸಬಹುದಾದ ಕರ್ತೃತ್ವದ ಹೇಳಿಕೆಗಳಿಗಿಂತ ಸಾಹಿತ್ಯಿಕ ಆರೋಪಣೆಗಳಾಗಿವೆ.
    audience: ಆತ್ಮಜ್ಞಾನವನ್ನು ಅರಸಲು, ದೈಹಿಕ ಕಾಮನೆಗಳನ್ನು ಎದುರಿಸಲು ಮತ್ತು ತೋಮನಿಗೆ ಯೇಸು ನೀಡಿದ ಖಾಸಗಿ ಬೋಧನೆಯನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಪ್ರೇರೇಪಿಸಲಾದ ತಪೋಪ್ರವೃತ್ತಿಯ ಕ್ರೈಸ್ತರು.
    date: ಹೆಚ್ಚಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಉತ್ತರಾರ್ಧ ಅಥವಾ 3ನೇ ಶತಮಾನದ ಆರಂಭಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಬಹುಶಃ ಸಿರಿಯದ ಕ್ರೈಸ್ತ ಸನ್ನಿವೇಶದಲ್ಲಿ ರಚಿತವಾಗಿರಬಹುದು. ಇದು 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಹಸ್ತಪ್ರತಿಯಲ್ಲಿ ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    chapters:
      '1':
        title: ಮತ್ತಾಯನು ತೋಮನ ಬೋಧನೆಗಳನ್ನು ದಾಖಲಿಸುತ್ತಾನೆ
      '2':
        title: ಕ್ರಿಸ್ತನು ಆತ್ಮಪರಿಶೀಲನೆಗೆ ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '3':
        title: ಯೇಸು ಅಗೋಚರ ಸತ್ಯವನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '4':
        title: ರಕ್ಷಕನು ಬಯಕೆಯ ಹಿಡಿತದ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '5':
        title: ತೋಮನು ಪಾಪಿಗಳ ಕುರಿತು ಕೇಳುತ್ತಾನೆ
      '6':
        title: ರಕ್ಷಕನು ಆತ್ಮಿಕ ಕತ್ತಲೆಯ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '7':
        title: ಜಾಗರೂಕರಾದ ಪವಿತ್ರರು ಧನ್ಯರು
  Tripartite Tractate:
    display_name: ತ್ರಿಭಾಗೀಯ ಪ್ರಬಂಧ
    author: ಅನಾಮಧೇಯ. ಲೇಖಕನು ಉನ್ನತ ಶಿಕ್ಷಣ ಪಡೆದ ವಾಲೆಂಟೀನಿಯನ್ ಕ್ರೈಸ್ತ ದೇವತಾಶಾಸ್ತ್ರಜ್ಞನಾಗಿದ್ದನು; ಹೆಸರಿನಿಂದ ತಿಳಿದಿರುವ ಯಾವುದೇ ಗುರುವಿನೊಂದಿಗೆ ಅವನನ್ನು ಖಚಿತವಾಗಿ ಗುರುತಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.
    audience: ದೇವರು, ಯುಗಾಧಿಪತಿಗಳು, ಸೃಷ್ಟಿ, ಕ್ರಿಸ್ತನು, ಸಭೆ, ರಕ್ಷಣೆ ಮತ್ತು ಅಂತಿಮ ಪುನಃಸ್ಥಾಪನೆಯ ಕುರಿತು ವಿಸ್ತೃತ ಬೋಧನೆಯನ್ನು ಸ್ವೀಕರಿಸುತ್ತಿದ್ದ ವಾಲೆಂಟೀನಿಯನ್ ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
    date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 3ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಕೆಲವರು ಅದರ ಉತ್ತರಾರ್ಧವನ್ನು ಹೆಚ್ಚು ಸಂಭವನೀಯವೆಂದು ವಾದಿಸುತ್ತಾರೆ. ಇದು 4ನೇ ಶತಮಾನದ ಯುಂಗ್ ಕೋಡೆಕ್ಸ್‌ನಲ್ಲಿ ಕಾಪ್ಟಿಕ್ ಭಾಷೆಯಲ್ಲಿ ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    chapters:
      '1':
        title: ದೇವರು ಶ್ರಮವಿಲ್ಲದೆ ಎಲ್ಲವನ್ನೂ ಸೃಷ್ಟಿಸುತ್ತಾನೆ
      '2':
        title: ಮಗನು ದೇವರ ಅಗ್ರಾಹ್ಯ ಮಹಿಮೆಯನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '3':
        title: ಸಮುದಾಯವು ದೈವಿಕ ಶಾಶ್ವತ ಜೀವನದಲ್ಲಿ ಪಾಲ್ಗೊಳ್ಳುತ್ತದೆ
      '4':
        title: ದೇವರು ಜೀವಿಗಳನ್ನು ಬೆಳಕಿನತ್ತ ಜಾಗೃತಗೊಳಿಸುತ್ತಾನೆ
      '5':
        title: ದೇವರು ಪರಿಪೂರ್ಣ ಮಗನ ಮೂಲಕ ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '6':
        title: ಶಾಶ್ವತ ಜೀವಿಗಳು ದೇವರ ಸ್ವಭಾವವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತವೆ
      '7':
        title: ಮಗನು ಅಗೋಚರ ದೇವರನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '8':
        title: ದೇವರು ಶಾಶ್ವತ ಜೀವಿಗಳಿಗೆ ಶಕ್ತಿ ನೀಡುತ್ತಾನೆ
      '9':
        title: ದೇವರು ಅಗೋಚರ ಸುಗಂಧದ ಮೂಲಕ ಸೆಳೆಯುತ್ತಾನೆ
      '10':
        title: ದೇವರು ಎಲ್ಲ ಜೀವಿಗಳ ಮೂಲಕ ಹರಿಯುತ್ತಾನೆ
      '11':
        title: ಪತನಗೊಂಡ ಜೀವಿಯ ಪರಿಪೂರ್ಣತೆಯ ಹುಡುಕಾಟ ವಿಫಲವಾಗುತ್ತದೆ
      '12':
        title: ವಾಕ್ಯವು ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟು ಐಕ್ಯವನ್ನು ತರುತ್ತದೆ
      '13':
        title: ಅಹಂಕಾರವು ಆತ್ಮಶಕ್ತಿಗಳ ನಡುವೆ ಸಂಘರ್ಷ ಉಂಟುಮಾಡುತ್ತದೆ
      '14':
        title: ರಕ್ಷಕನು ವಿಮೋಚನೆಯ ಮೂಲಕ ಎಲ್ಲವನ್ನೂ ಪುನಃಸ್ಥಾಪಿಸುತ್ತಾನೆ
      '15':
        title: ಜ್ಞಾನದ ಸಂದೇಶವು ಜೀವಿಯನ್ನು ಬಲಪಡಿಸುತ್ತದೆ
      '16':
        title: ವಾಕ್ಯವು ಸೃಷ್ಟಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತದೆ
      '17':
        title: ವಾಕ್ಯವು ರಕ್ಷಣೆಯ ಲೋಕವನ್ನು ಸ್ಥಾಪಿಸುತ್ತದೆ
      '18':
        title: ವಾಕ್ಯವು ನ್ಯಾಯತೀರ್ಪು ಮತ್ತು ರಕ್ಷಣೆಯನ್ನು ಸಿದ್ಧಪಡಿಸುತ್ತದೆ
      '19':
        title: ವಿರೋಧಿ ಗುಂಪುಗಳಿಗೆ ಕ್ರಮಬದ್ಧ ಸ್ಥಾನಗಳು ದೊರೆಯುತ್ತವೆ
      '20':
        title: ಪರಮ ಆಳುವವನು ಕೆಳಗಿನ ಲೋಕಗಳನ್ನು ವ್ಯವಸ್ಥೆಗೊಳಿಸುತ್ತಾನೆ
      '21':
        title: ಮನುಷ್ಯರು ಮರಣಶೀಲತೆ ಮತ್ತು ಸಂಕಟದ ಮೂಲಕ ಕಲಿಯುತ್ತಾರೆ
      '22':
        title: ಆತ್ಮಿಕ ಶಕ್ತಿಗಳು ಕ್ರಮ ಮತ್ತು ಅಕ್ರಮವನ್ನು ಬೆರೆಸುತ್ತವೆ
      '23':
        title: ಪ್ರವಾದಿಗಳಿಗೆ ರಕ್ಷಕನ ದರ್ಶನಗಳು
      '24':
        title: ರಕ್ಷಕನು ಶಾಶ್ವತ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ತರುತ್ತಾನೆ
      '25':
        title: ರಕ್ಷಕನು ಮಾನವಕುಲವನ್ನು ವಿಭಾಗಿಸುತ್ತಾನೆ
      '26':
        title: ಕ್ರಿಸ್ತನು ಸಮಸ್ತ ಸೃಷ್ಟಿಯನ್ನು ಒಂದುಗೂಡಿಸುತ್ತಾನೆ
      '27':
