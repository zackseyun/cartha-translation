        title: ನನ್ನೊಂದಿಗೆ ಏಕೆ ಹೋರಾಡುತ್ತೀ ಎಂದು ಯೋಬನು ಕೇಳುತ್ತಾನೆ
      '11':
        title: ಚೋಫರನು ಜ್ಞಾನದ ಮಾತುಗಳಿಂದ ಯೋಬನನ್ನು ಖಂಡಿಸುತ್ತಾನೆ
      '12':
        title: ಸ್ನೇಹಿತರ ಪೊಳ್ಳು ಮಾತುಗಳನ್ನು ಯೋಬನು ಹಾಸ್ಯಮಾಡುತ್ತಾನೆ
      '13':
        title: ಯೋಬನು ದೇವರ ಮುಂದೆ ಸತ್ಯವನ್ನು ನುಡಿಯುತ್ತಾನೆ
      '14':
        title: ಜೀವನದ ನಶ್ವರತೆಯ ಕುರಿತು ಯೋಬನ ಪ್ರಲಾಪ
      '15':
        title: ಎಲೀಫಜನು ಯೋಬನ ಮೇಲೆ ಪಾಪದ ಆರೋಪ ಹೊರಿಸುತ್ತಾನೆ
      '16':
        title: ಯೋಬನು ದೇವರಿಗೆ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '17':
        title: ಸ್ನೇಹಿತರ ಹಾಸ್ಯಕ್ಕೆ ಗುರಿಯಾದ ಯೋಬನು ಹತಾಶನಾಗುತ್ತಾನೆ
      '18':
        title: ದುಷ್ಟತನದ ಅಂತ್ಯವನ್ನು ಬಿಲ್ದದನು ವಿವರಿಸುತ್ತಾನೆ
      '19':
        title: ಯೋಬನು ತನ್ನ ವಿಮೋಚಕನಿಗಾಗಿ ಹಂಬಲಿಸುತ್ತಾನೆ
      '20':
        title: ದುಷ್ಟತನದ ವಿನಾಶವನ್ನು ಚೋಫರನು ಘೋಷಿಸುತ್ತಾನೆ
      '21':
        title: ದುಷ್ಟರು ಏಕೆ ಏಳಿಗೆ ಹೊಂದುತ್ತಾರೆಂದು ಯೋಬನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '22':
        title: ಎಲೀಫಜನು ಯೋಬನ ಮೇಲೆ ಪಾಪಗಳ ಆರೋಪ ಹೊರಿಸುತ್ತಾನೆ
      '23':
        title: ದೇವರನ್ನು ಕಂಡುಕೊಳ್ಳಲು ಯೋಬನು ಹಂಬಲಿಸುತ್ತಾನೆ
      '24':
        title: ದುಷ್ಟರ ಸಂಕಟವನ್ನು ಯೋಬನು ವಿವರಿಸುತ್ತಾನೆ
      '25':
        title: ದೇವರ ಅಗಾಧ ಶಕ್ತಿಯನ್ನು ಬಿಲ್ದದನು ಸ್ತುತಿಸುತ್ತಾನೆ
      '26':
        title: ಸ್ನೇಹಿತರ ಪೊಳ್ಳು ಜ್ಞಾನವನ್ನು ಯೋಬನು ಹಾಸ್ಯಮಾಡುತ್ತಾನೆ
      '27':
        title: ಯೋಬನು ತನ್ನ ನಿರ್ದೋಷಿತ್ವವನ್ನು ಬಿಟ್ಟುಕೊಡುವುದಿಲ್ಲ
      '28':
        title: ಭೂಲೋಕದ ಸಂಪತ್ತುಗಳ ಕುರಿತು ಯೋಬನ ಚಿಂತನೆ
      '29':
        title: ಗೌರವದ ದಿನಗಳನ್ನು ಯೋಬನು ನೆನಪಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '30':
        title: ಹಾಸ್ಯಕ್ಕೀಡಾಗಿ ನೋವಿನಿಂದ ನಲುಗುವ ಯೋಬನು
      '31':
        title: ಯೋಬನು ತನ್ನ ಸಂಪೂರ್ಣ ನಿರ್ದೋಷಿತ್ವದ ಕುರಿತು ಪ್ರಮಾಣ ಮಾಡುತ್ತಾನೆ
      '32':
        title: ಎಲೀಹು ಯೋಬನ ವಿರುದ್ಧ ಮಾತನಾಡುತ್ತಾನೆ
      '33':
        title: ದೀನತೆಯಿಂದ ಪಶ್ಚಾತ್ತಾಪಪಡಲು ಎಲೀಹು ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '34':
        title: ಎಲೀಹು ದೇವರ ನ್ಯಾಯವನ್ನು ಸಮರ್ಥಿಸುತ್ತಾನೆ
      '35':
        title: ಪೊಳ್ಳು ಮಾತುಗಳ ಕುರಿತು ಎಲೀಹು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '36':
        title: ಎಲೀಹು ದೇವರ ಶಕ್ತಿಯನ್ನು ಸಾರುತ್ತಾನೆ
      '37':
        title: ಎಲೀಹು ದೇವರ ಮಹಿಮೆಯನ್ನು ತೋರಿಸುತ್ತಾನೆ
      '38':
        title: ದೇವರು ಯೋಬನ ಜ್ಞಾನವನ್ನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '39':
        title: ದೇವರು ಯೋಬನ ವಿವೇಕವನ್ನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '40':
        title: ಯೋಬನು ತನ್ನ ಅಲ್ಪತೆಯನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾನೆ
      '41':
        title: ಲೆವಿಯಾತಾನನು ಮಾನವ ಬಲಕ್ಕೆ ಮಣಿಯುವುದಿಲ್ಲ
      '42':
        title: ಯೋಬನು ಪಶ್ಚಾತ್ತಾಪಪಡುತ್ತಾನೆ ಮತ್ತು ಪುನಃಸ್ಥಾಪನೆ ಹೊಂದುತ್ತಾನೆ
  Psalms:
    display_name: ಕೀರ್ತನೆಗಳು
    author: ಹಲವಾರು ಶತಮಾನಗಳಲ್ಲಿ ಅನೇಕರು ರಚಿಸಿದ್ದಾರೆ; ಮೇಲ್ಬರಹಗಳು ದಾವೀದ, ಆಸಾಫ, ಕೋರಹ, ಸೊಲೊಮೋನ, ಮೋಶೆ ಮತ್ತು ಇತರರ ಹೆಸರುಗಳನ್ನು ಸೂಚಿಸುತ್ತವೆ.
    audience: ಆರಾಧನೆಯಲ್ಲಿ ಪಾಲ್ಗೊಂಡ ಇಸ್ರಾಯೇಲರೂ ದೇವಾಲಯದ ಸಭೆಯವರೂ—ಹಾಗೆಯೇ ನಂತರದ ಪ್ರತಿಯೊಂದು ಪ್ರಾರ್ಥನಾ ಮತ್ತು ಪ್ರಲಾಪ ಸಮುದಾಯವೂ.
    date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 10–3ನೇ ಶತಮಾನಗಳಲ್ಲಿ ರಚಿಸಲಾಯಿತು; ಅಂತಿಮ ಸಂಕಲನವು ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಅವಧಿಯಲ್ಲಿ ರೂಪುಗೊಂಡಿತು.
    chapters:
      '1':
        title: ನೀತಿವಂತನ ಜೀವನವು ಧನ್ಯವಾಗಿದೆ
      '2':
        title: ದಂಗೆಕೋರ ಅರಸರನ್ನು ನೋಡಿ ದೇವರು ನಗುತ್ತಾನೆ
      '3':
        title: ದೇವರು ತನ್ನ ಗುರಾಣಿ ಎಂದು ದಾವೀದನು ಭರವಸೆಯಿಡುತ್ತಾನೆ
      '4':
        title: ದಾವೀದನು ದೇವರ ಬೆಳಕನ್ನು ಅರಸುತ್ತಾನೆ
      '5':
        title: ದಾವೀದನು ದೇವರ ಮುಖಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '6':
        title: ದಾವೀದನು ದೇವರ ಕರುಣೆಗಾಗಿ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '7':
        title: ದಾವೀದನು ನೀತಿವಂತ ನ್ಯಾಯಾಧಿಪತಿಗೆ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '8':
        title: ದಾವೀದನು ದೇವರ ಮಹಿಮೆಯನ್ನು ಸ್ತುತಿಸುತ್ತಾನೆ
      '9':
        title: ದಾವೀದನು ದೇವರ ಆಳ್ವಿಕೆಯನ್ನು ಸಂಭ್ರಮಿಸುತ್ತಾನೆ
      '10':
        title: ದೇವರು ಕೆಟ್ಟದ್ದನ್ನು ನೋಡಿ ನ್ಯಾಯತೀರಿಸುತ್ತಾನೆ
      '11':
        title: ದಾವೀದನು ದುಷ್ಟರಿಗೆ ಭಯಪಡಲು ನಿರಾಕರಿಸುತ್ತಾನೆ
      '12':
        title: ದಾವೀದನು ನಂಬಿಗಸ್ತ ಮಾತಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '13':
        title: ದಾವೀದನು ದೇವರ ಪ್ರೀತಿಯಲ್ಲಿ ಭರವಸೆಯಿಡುತ್ತಾನೆ
      '14':
        title: ದೇವರನ್ನು ನಿರಾಕರಿಸುವುದು ವಿನಾಶಕ್ಕೆ ನಡೆಸುತ್ತದೆ
      '15':
        title: ದಾವೀದನು ಅರ್ಹತೆಯ ಮಾನದಂಡಗಳನ್ನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '16':
        title: ದಾವೀದನು ದೇವರಲ್ಲಿ ಭರವಸೆಯಿಟ್ಟು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '17':
        title: ದಾವೀದನು ನ್ಯಾಯವಾದ ಬಿಡುಗಡೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '18':
        title: ರಕ್ಷಣೆಗಾಗಿ ಕೃತಜ್ಞತೆಯ ಕೀರ್ತನೆ
      '19':
        title: ದೇವರ ನಿಯಮ ಮತ್ತು ಮಹಿಮೆ ಪ್ರಕಾಶಿಸುತ್ತವೆ
      '20':
        title: ಕರ್ತನು ಅಭಿಷಿಕ್ತ ಅರಸನನ್ನು ಕಾಪಾಡುತ್ತಾನೆ
      '21':
        title: ಅರಸನು ದೇವರ ಬಲದಲ್ಲಿ ಹರ್ಷಿಸುತ್ತಾನೆ
      '22':
        title: ತೀವ್ರ ಪರಿತ್ಯಕ್ತ ಭಾವನೆ ಸ್ತುತಿಯಾಗಿ ಮಾರ್ಪಡುತ್ತದೆ
      '23':
        title: ಕುರುಬನು ನನ್ನ ಪಕ್ಕದಲ್ಲೇ ಇರುತ್ತಾನೆ
      '24':
        title: ಕರ್ತನು ಶುದ್ಧ ಹೃದಯಗಳನ್ನು ಅರಸುತ್ತಾನೆ
      '25':
        title: ಭರವಸೆ ಮತ್ತು ವಿಮೋಚನೆಯ ಕೀರ್ತನೆ
      '26':
        title: ದಾವೀದನು ವಿಮೋಚನೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '27':
        title: ಕರ್ತನ ಸಾನ್ನಿಧ್ಯಕ್ಕಾಗಿ ಹಂಬಲ
      '28':
        title: ದೇವರು ಆಲಿಸಬೇಕೆಂದು ದಾವೀದನು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '29':
        title: ಕರ್ತನು ಪವಿತ್ರ ವೈಭವದಲ್ಲಿ ಆಳುತ್ತಾನೆ
      '30':
        title: ಮರಣದಿಂದ ರಕ್ಷಿಸಿದ್ದಕ್ಕಾಗಿ ಸ್ತುತಿ
      '31':
        title: ದಾವೀದನು ದೇವರ ರಕ್ಷಣೆಯಲ್ಲಿ ಭರವಸೆಯಿಡುತ್ತಾನೆ
      '32':
        title: ಕ್ಷಮಿಸಲ್ಪಟ್ಟ ಪಾಪಿಗಳು ಧನ್ಯರು
      '33':
        title: ನಂಬಿಗಸ್ತ ಸೃಷ್ಟಿಕರ್ತನನ್ನು ಸ್ತುತಿಸಿರಿ
      '34':
        title: ದೇವರು ಒಳ್ಳೆಯವನೆಂದು ಸವಿದು ನೋಡಿರಿ
      '35':
        title: ದಾವೀದನು ಬಿಡುಗಡೆಗಾಗಿ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '36':
