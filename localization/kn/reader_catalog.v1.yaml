      '2':
        title: ಮಾನವರ ಕೈಗಳಿಂದ ರೂಪಿಸಲಾದ ವಿಗ್ರಹಗಳು
      '3':
        title: ಕ್ರೈಸ್ತರು ಸುಳ್ಳು ಆರಾಧನೆಯನ್ನು ತಿರಸ್ಕರಿಸುತ್ತಾರೆ
      '4':
        title: ದೇವರ ಒಳ್ಳೆಯ ಕೊಡುಗೆಗಳನ್ನು ತಿರಸ್ಕರಿಸುವುದು
      '5':
        title: ಪರದೇಶಿಗಳಾದರೂ ಪೂರ್ಣವಾಗಿ ಸೇರಿದವರು
      '6':
        title: ಲೋಕದೊಳಗೆ ಆತ್ಮವು ನೆಲೆಸಿದೆ
      '7':
        title: ಅದೃಶ್ಯ ಸೃಷ್ಟಿಕರ್ತನಿಂದ ಬರುವ ಸತ್ಯ
      '8':
        title: ನಂಬಿಕೆಯು ಮರೆಯಾಗಿದ್ದ ಸತ್ಯವನ್ನು ಪ್ರಕಟಿಸುತ್ತದೆ
      '9':
        title: ವಿಸ್ಮಯಕರ ಕೃಪೆಯ ಮೂಲಕ ರಕ್ಷಣೆ
      '10':
        title: ನಿಜವಾದ ಸಂತೋಷವು ಪ್ರೀತಿಯಿಂದ ಬರುತ್ತದೆ
      '11':
