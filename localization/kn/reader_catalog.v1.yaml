      '34':
        title: ಉತ್ಸಾಹಿ ಕೆಲಸಗಾರರು ತಮ್ಮ ಅನ್ನವನ್ನು ಸಂಪಾದಿಸುತ್ತಾರೆ
      '35':
        title: ಸ್ವರ್ಗೀಯ ಪ್ರತಿಫಲಗಳಿಗಾಗಿ ತಾಳಿಕೊಳ್ಳಿರಿ
