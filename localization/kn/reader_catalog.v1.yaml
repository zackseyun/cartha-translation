      '40':
        title: ದೇವರು ದಾವೀದನನ್ನು ವಿನಾಶದಿಂದ ಮೇಲೆತ್ತುತ್ತಾನೆ
      '41':
        title: ದೇವರು ದುರ್ಬಲರನ್ನು ಪರಾಮರಿಸುತ್ತಾನೆ
      '42':
        title: ಜೀವಂತ ದೇವರಿಗಾಗಿ ಹಂಬಲ
      '43':
        title: ದಬ್ಬಾಳಿಕೆಗಾರರಿಂದ ನನ್ನನ್ನು ರಕ್ಷಿಸು
      '44':
        title: ಹಿಂದಿನ ವಿಜಯಗಳಲ್ಲಿ ದೇವರ ಶಕ್ತಿ
      '45':
        title: ಅರಸನ ಸೌಂದರ್ಯ ಮತ್ತು ಶಾಶ್ವತ ಕೃಪೆ
      '46':
