      '2':
        title: ಮತ್ತಥೀಯನು ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಪಾಲಿಸುವುದಾಗಿ ಪ್ರತಿಜ್ಞೆಮಾಡುತ್ತಾನೆ
      '3':
        title: ಯೂದನು ಇಸ್ರಾಯೇಲಿಗೆ ನೆರವಾಗುವಂತೆ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '4':
        title: ದೇವಾಲಯವನ್ನು ಶುದ್ಧೀಕರಿಸಿ ಪುನಃ ಸಮರ್ಪಿಸಲಾಗುತ್ತದೆ
      '5':
        title: ಯೂದನು ಸುತ್ತಲಿನ ಜನಾಂಗಗಳನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '6':
        title: ಸೋಲಿನ ನಂತರ ಅಂತಿಯೋಕನು ಸಾಯುತ್ತಾನೆ
      '7':
        title: ಯೂದನು ನಿಕಾನೋರನ ಸೈನ್ಯವನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '8':
        title: ಯೂದನು ರೋಮನ್ನರ ಸ್ನೇಹವನ್ನು ಬಯಸುತ್ತಾನೆ
      '9':
        title: ಯೂದನ ನಂತರ ಯೋನಾತಾನನು ನಾಯಕತ್ವ ವಹಿಸುತ್ತಾನೆ
      '10':
        title: ಯೋನಾತಾನನು ಅಲೆಕ್ಸಾಂಡರನ ಅನುಗ್ರಹ ಪಡೆಯುತ್ತಾನೆ
      '11':
        title: ಯೋನಾತಾನನು ಪ್ಟೋಲೆಮಾಯನ ಬೆದರಿಕೆಯನ್ನು ಎದುರಿಸುತ್ತಾನೆ
      '12':
        title: ಸೀಮೋನನು ಯೂದಾಯದ ಭದ್ರಕೋಟೆಗಳನ್ನು ಬಲಪಡಿಸುತ್ತಾನೆ
      '13':
        title: ಸೀಮೋನನು ಯೆರೂಸಲೇಮಿನ ಕೋಟೆಯನ್ನು ಧ್ವಂಸಗೊಳಿಸುತ್ತಾನೆ
      '14':
        title: ಸೀಮೋನನು ಇಸ್ರಾಯೇಲಿನ ಶಾಂತಿಯನ್ನು ಬಲಪಡಿಸುತ್ತಾನೆ
      '15':
        title: ಅಂತಿಯೋಕನು ಯೆಹೂದ್ಯರ ಹಕ್ಕುಗಳನ್ನು ದೃಢಪಡಿಸುತ್ತಾನೆ
      '16':
        title: ಯೋಹಾನನು ಕೆಂದೆಬಾಯನ ಪಡೆಗಳನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
