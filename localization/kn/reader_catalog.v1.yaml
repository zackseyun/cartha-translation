      '2':
        title: ದುರಾಸೆಯ ಸಂಚುಗಾರರನ್ನು ಮೀಕನು ಖಂಡಿಸುತ್ತಾನೆ
      '3':
        title: ನಾಯಕರು ಜನರನ್ನು ಕ್ರೂರವಾಗಿ ಶೋಷಿಸುತ್ತಾರೆ
      '4':
        title: ಎಲ್ಲಾ ಜನಾಂಗಗಳ ಮೇಲೆ ಯೆಹೋವನು ಆಳುತ್ತಾನೆ
      '5':
        title: ಬೆತ್ಲೆಹೇಮಿನಿಂದ ದಾವೀದ ಅರಸನು ಬರುವನು
      '6':
        title: ಯೆಹೋವನು ಇಸ್ರಾಯೇಲಿನ ವಿರುದ್ಧ ಮೊಕದ್ದಮೆ ಹೂಡುತ್ತಾನೆ
      '7':
