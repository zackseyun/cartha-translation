      '37':
        title: ದುಷ್ಟರನ್ನು ಕಂಡು ಅಸೂಯೆಪಡದೆ ದೇವರಲ್ಲಿ ಭರವಸೆಯಿಡಿರಿ
      '38':
        title: ತೀವ್ರ ಸಂಕಟದಲ್ಲಿ ಮೌನ ಪ್ರಾರ್ಥನೆ
      '39':
