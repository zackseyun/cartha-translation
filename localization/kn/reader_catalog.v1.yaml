  Philippians:
    display_name: ಫಿಲಿಪ್ಪಿಯವರಿಗೆ
    author: ಪೌಲನು, ತಿಮೊಥೆಯನೊಂದಿಗೆ.
    audience: ಮಕೆದೋನ್ಯದಲ್ಲಿದ್ದ ರೋಮನ್ ವಸಾಹತು ಫಿಲಿಪ್ಪಿಯ ಕ್ರೈಸ್ತ ಸಭೆ.
    date: ಸುಮಾರು ಕ್ರಿ.ಶ. 60–62; ಸೆರೆಮನೆಯಿಂದ ಬರೆದದ್ದು.
    chapters:
      '1':
        title: ಫಿಲಿಪ್ಪಿಯವರಿಗಾಗಿ ಪೌಲನ ಪ್ರಾರ್ಥನೆ
      '2':
        title: ದೀನನಾದ ಮತ್ತು ಉನ್ನತಿಗೇರಿಸಲಾದ ಯೇಸು
      '3':
        title: ಕ್ರಿಸ್ತನನ್ನು ತಿಳಿಯುವುದರಲ್ಲಿ ಹರ್ಷಿಸಿರಿ
      '4':
        title: ಸಂತೋಷದಿಂದ ದೃಢವಾಗಿ ನಿಲ್ಲಿರಿ
  Colossians:
    display_name: ಕೊಲೊಸ್ಸೆಯವರಿಗೆ
    author: ಪೌಲನು, ತಿಮೊಥೆಯನೊಂದಿಗೆ — ಅಥವಾ ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಅವನ ಆಪ್ತ ಶಿಷ್ಯನೊಬ್ಬ (ವಿವಾದಿತ).
    audience: ಲೈಕಸ್ ಕಣಿವೆಯ ಕೊಲೊಸ್ಸೆಯಲ್ಲಿದ್ದು, ವಿವಿಧ ಧಾರ್ಮಿಕ ಕಲ್ಪನೆಗಳನ್ನು ಬೆರೆಸಿದ ಬೋಧನೆಯನ್ನು ಎದುರಿಸುತ್ತಿದ್ದ ಕ್ರೈಸ್ತರು.
    date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 60–62; ಬೇರೊಬ್ಬರು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದರೆ ಅದಕ್ಕಿಂತ ನಂತರ.
    chapters:
      '1':
        title: ಕೊಲೊಸ್ಸೆಯವರ ನಂಬಿಕೆಗಾಗಿ ಪೌಲನ ಪ್ರಾರ್ಥನೆ
      '2':
        title: ಕ್ರಿಸ್ತನಲ್ಲಿ ವಿಶ್ವಾಸಿಗಳಿಗೆ ಪೌಲನ ಉತ್ತೇಜನ
      '3':
        title: ಪಾಪವನ್ನು ಮೀರಿ, ಪ್ರೀತಿಯಿಂದ ಜೀವಿಸಿರಿ
      '4':
        title: ಸರಪಳಿಗಳಲ್ಲಿರುವ ಪೌಲನ ಪ್ರಾರ್ಥನೆ ಮತ್ತು ಉತ್ತೇಜನ
  1 Thessalonians:
    display_name: 1 ಥೆಸಲೋನಿಕದವರಿಗೆ
    author: ಪೌಲನು, ಸಿಲ್ವಾನ ಮತ್ತು ತಿಮೊಥೆಯನೊಂದಿಗೆ.
    audience: ಹಿಂಸೆಯನ್ನು ಎದುರಿಸುತ್ತಿದ್ದ ಥೆಸಲೋನಿಕದ ಹೊಸ ಕ್ರೈಸ್ತ ಸಭೆ.
    date: ಸುಮಾರು ಕ್ರಿ.ಶ. 50–51 — ಉಳಿದುಕೊಂಡಿರುವ ಪೌಲನ ಪತ್ರಗಳಲ್ಲಿ ಬಹುಶಃ ಅತ್ಯಂತ ಪ್ರಾಚೀನವಾದದ್ದು.
    chapters:
      '1':
        title: ಕೃಪೆ, ಸಮಾಧಾನ, ನಂಬಿಕೆ, ಪ್ರೀತಿ ಮತ್ತು ನಿರೀಕ್ಷೆ
      '2':
        title: ಶುದ್ಧ ಉದ್ದೇಶಗಳಿಂದ ಧೈರ್ಯವಾಗಿ ಸಾರುವುದು
      '3':
        title: ಸಂಕಟದಲ್ಲಿ ತಿಮೊಥೆಯನ ಉತ್ತೇಜನ
      '4':
        title: ಪವಿತ್ರ ಜೀವನಕ್ಕೆ ಪೌಲನ ಉತ್ತೇಜನ
      '5':
        title: ಎಚ್ಚರವಾಗಿದ್ದು ರಕ್ಷಣೆಯನ್ನು ನಿರೀಕ್ಷಿಸಿರಿ
  2 Thessalonians:
    display_name: 2 ಥೆಸಲೋನಿಕದವರಿಗೆ
    author: ಪೌಲನು (ವಿವಾದಿತ; ಕೆಲವು ವಿದ್ವಾಂಸರ ಪ್ರಕಾರ ಬೇರೊಬ್ಬರು ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದದ್ದು).
    audience: ಅಂತ್ಯಕಾಲದ ಕುರಿತ ಗೊಂದಲವನ್ನು ಪರಿಹರಿಸಲು ಉದ್ದೇಶಿಸಿದ ಥೆಸಲೋನಿಕದ ಸಭೆ.
    date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 51.
    chapters:
      '1':
        title: ಹಿಂಸೆಯನ್ನು ತಾಳುವ ನಂಬಿಗಸ್ತರಿಗೆ ದೇವರ ಪ್ರತಿಫಲ
      '2':
        title: ಕ್ರಿಸ್ತನು ಬರುವ ಮೊದಲು ದಂಗೆ ಬರುತ್ತದೆ
      '3':
        title: ಸಭೆಯ ಬೆಳವಣಿಗೆಗಾಗಿ ಪೌಲನ ಪ್ರಾರ್ಥನೆ
  1 Timothy:
    display_name: 1 ತಿಮೊಥೆಯನಿಗೆ
    author: ಪೌಲನು, ಅಥವಾ ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಶಿಷ್ಯನೊಬ್ಬ (ಪಾಸ್ಟರಲ್ ಪತ್ರಗಳನ್ನು ಬೇರೆಯವರು ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದಾರೆ ಎಂಬ ಅಭಿಪ್ರಾಯ ವ್ಯಾಪಕವಾಗಿದೆ).
    audience: ಎಫೆಸದಲ್ಲಿ ಪೌಲನ ಪ್ರತಿನಿಧಿಯಾಗಿದ್ದ ತಿಮೊಥೆಯನು; ನಂತರದ ಸಭಾ ವ್ಯವಸ್ಥೆಗೆ ಮಾರ್ಗದರ್ಶಕ ಕೈಪಿಡಿ.
    date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 60ರ ದಶಕದ ಮಧ್ಯಭಾಗ; ಬೇರೊಬ್ಬರು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 90–110.
    chapters:
      '1':
        title: ತಿಮೊಥೆಯನು ಉಳಿಯಬೇಕೆಂದು ಪೌಲನ ಒತ್ತಾಯ
      '2':
        title: ಆಳುವವರಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸಿ, ಶಾಂತಿಯಿಂದ ಜೀವಿಸಿರಿ
      '3':
        title: ಸಭೆಯ ನಾಯಕರಿಗೆ ಬೇಕಾದ ಗುಣಗಳು
      '4':
        title: ಸುಳ್ಳು ಬೋಧಕರನ್ನೂ ಕಟ್ಟುಕಥೆಗಳನ್ನೂ ತಿರಸ್ಕರಿಸಿರಿ
      '5':
        title: ವಿಧವೆಯರನ್ನೂ ಹಿರಿಯರನ್ನೂ ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ಗೌರವಿಸಿರಿ
      '6':
        title: ಸಂಪತ್ತಿನ ಕುರಿತು ತಿಮೊಥೆಯನಿಗೆ ಪೌಲನ ಸಲಹೆ
  2 Timothy:
    display_name: 2 ತಿಮೊಥೆಯನಿಗೆ
    author: ಪೌಲನು, ಅಥವಾ ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಶಿಷ್ಯನೊಬ್ಬ.
    audience: ತಿಮೊಥೆಯನು — ಸೆರೆಮನೆಯಿಂದ ಪೌಲನು ಹೇಳಿದ ವಿದಾಯದ ಮಾತುಗಳ ರೂಪದಲ್ಲಿ ನಿರೂಪಿಸಲಾಗಿದೆ.
    date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 60ರ ದಶಕದ ಮಧ್ಯಭಾಗ; ಬೇರೊಬ್ಬರು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 90–110.
    chapters:
      '1':
        title: ತಿಮೊಥೆಯನೇ, ಕೃಪೆಯಲ್ಲಿ ದೃಢವಾಗಿರು
      '2':
        title: ಕ್ರಿಸ್ತನಿಗಾಗಿ ಸಂಕಟವನ್ನು ಸಹಿಸು
      '3':
        title: ಸುಳ್ಳು ಬೋಧಕರನ್ನು ತಪ್ಪಿಸಿಕೊಳ್ಳುವ ಎಚ್ಚರಿಕೆ
      '4':
        title: ಎಲ್ಲರಿಗೂ ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ಸಾರಿರಿ
  Titus:
    display_name: ತೀತನಿಗೆ
    author: ಪೌಲನು, ಅಥವಾ ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಶಿಷ್ಯನೊಬ್ಬ.
    audience: ಕ್ರೇತೆಯಲ್ಲಿ ಪೌಲನ ಪ್ರತಿನಿಧಿಯಾಗಿದ್ದ ತೀತನು.
    date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 60ರ ದಶಕದ ಮಧ್ಯಭಾಗ; ಬೇರೊಬ್ಬರು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 90–110.
    chapters:
      '1':
        title: ಕ್ರೇತೆಯಲ್ಲಿ ತೀತನಿಗೆ ಪೌಲನ ಸೂಚನೆಗಳು
      '2':
        title: ಎಲ್ಲ ವಯಸ್ಸಿನವರಿಗೂ ಕೃಪೆಯ ಜೀವನವನ್ನು ಬೋಧಿಸು
      '3':
        title: ಕ್ರಿಸ್ತನ ನಿರೀಕ್ಷೆಯಲ್ಲಿ ದೀನತೆಯಿಂದ ಜೀವಿಸಿರಿ
  Philemon:
    display_name: ಫಿಲೆಮೋನನಿಗೆ
    author: ಪೌಲನು, ತಿಮೊಥೆಯನೊಂದಿಗೆ.
    audience: ತಪ್ಪಿಸಿಕೊಂಡು ಹೋದ ತನ್ನ ದಾಸ ಒನೇಸಿಮನ ವಿಷಯವಾಗಿ, ದಾಸರನ್ನು ಹೊಂದಿದ್ದ ಕ್ರೈಸ್ತನಾದ ಫಿಲೆಮೋನನಿಗೆ.
    date: ಸುಮಾರು ಕ್ರಿ.ಶ. 60–62.
    chapters:
      '1':
        title: ಒನೇಸಿಮನ ಸ್ವಾತಂತ್ರ್ಯಕ್ಕಾಗಿ ಪೌಲನ ಮನವಿ
  Hebrews:
    display_name: ಇಬ್ರಿಯರಿಗೆ
    author: ಅಜ್ಞಾತ. ಸಂಪ್ರದಾಯವು ಪೌಲ, ಅಪೊಲ್ಲೋಸ, ಬಾರ್ನಬ, ಪ್ರಿಸ್ಕಿಲ್ಲ ಮತ್ತು ಇತರರ ಹೆಸರುಗಳನ್ನು ಸೂಚಿಸಿದೆ; ಯಾವುದೇ ಪ್ರಸ್ತಾವನೆಯ ಕುರಿತು ಒಮ್ಮತವಿಲ್ಲ.
    audience: ತಮ್ಮ ಕ್ರೈಸ್ತ ನಂಬಿಕೆಯ ಘೋಷಣೆಯಿಂದ ಹಿಂದೆ ಸರಿಯುವ ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗಿದ್ದ ಗ್ರೀಕ್ ಭಾಷಿಕ ಯೆಹೂದಿ ಕ್ರೈಸ್ತರು.
    date: ಸುಮಾರು ಕ್ರಿ.ಶ. 60–95.
    chapters:
      '1':
        title: ದೇವರು ತನ್ನ ಮಗನ ಮೂಲಕ ಮಾತನಾಡುತ್ತಾನೆ
      '2':
        title: ಯೇಸು ಸಂಕಟದ ಮೂಲಕ ರಕ್ಷಿಸುತ್ತಾನೆ
      '3':
        title: ನಂಬಿಗಸ್ತನಾದ ಯೇಸುವಿನ ಮೇಲೆ ದೃಷ್ಟಿಯಿಡಿರಿ
      '4':
        title: ದೇವರು ವಾಗ್ದಾನ ಮಾಡಿದ ವಿಶ್ರಾಂತಿಯನ್ನು ಪ್ರವೇಶಿಸಿರಿ
      '5':
        title: ಕ್ರಿಸ್ತನು ಪರಿಪೂರ್ಣ ಯಜ್ಞವನ್ನು ಅರ್ಪಿಸಿದನು
      '6':
        title: ಆತ್ಮಿಕ ಪ್ರೌಢತೆಯತ್ತ ಮುನ್ನಡೆಯಿರಿ
      '7':
        title: ಮೆಲ್ಕಿಜೆದೇಕನ ಕ್ರಮದ ಪ್ರಕಾರ ಯೇಸು ಸದಾಕಾಲದ ಯಾಜಕನು
      '8':
        title: ಯೇಸುವಿನ ರಕ್ತದ ಮೂಲಕ ಹೊಸ ಒಡಂಬಡಿಕೆ
      '9':
        title: ಯೇಸು ನಿಜವಾದ ಸ್ವರ್ಗೀಯ ಪವಿತ್ರಸ್ಥಾನವನ್ನು ಪ್ರವೇಶಿಸುತ್ತಾನೆ
      '10':
        title: ಕ್ರಿಸ್ತನ ರಕ್ತದ ಮೂಲಕ ಸಮೀಪಿಸಿರಿ
      '11':
        title: ಪೂರ್ವಜರ ನಂಬಿಕೆ ಸ್ಥಿರವಾಗಿ ಉಳಿಯುತ್ತದೆ
      '12':
        title: ಯೇಸುವಿನೊಂದಿಗೆ ಸಂಕಟವನ್ನು ಸಹಿಸಿಕೊಳ್ಳಿರಿ
      '13':
        title: ಪ್ರೀತಿಯಿಂದ ಮತ್ತು ಭರವಸೆಯಿಂದ ಜೀವಿಸಿರಿ
  James:
    display_name: ಯಾಕೋಬನು
    author: ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ಯೇಸುವಿನ ಸಹೋದರ ಯಾಕೋಬನು ಎಂದು ಪರಿಗಣಿಸಲಾಗಿದೆ; ಆಧುನಿಕ ವಿದ್ವಾಂಸರಲ್ಲಿ ಇದು ಅವನೇ ಬರೆದದ್ದೇ ಅಥವಾ ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದದ್ದೇ ಎಂಬುದರ ಕುರಿತು ಭಿನ್ನಾಭಿಪ್ರಾಯವಿದೆ.
    audience: ಚದುರಿಹೋಗಿದ್ದ ಯೆಹೂದಿ-ಕ್ರೈಸ್ತ ಸಭೆಗಳು.
    date: ಅವನೇ ಬರೆದದ್ದಾದರೆ ಕ್ರಿ.ಶ. ಸುಮಾರು 50–60ರ ದಶಕಗಳು; ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದದ್ದಾದರೆ ಕ್ರಿ.ಶ. 1ನೇ ಶತಮಾನದ ಕೊನೆಯ ಭಾಗದ ಸುಮಾರು ಕಾಲ.
    chapters:
      '1':
        title: ಪರೀಕ್ಷೆಗೊಳಗಾದ ನಂಬಿಕೆ ಸ್ಥಿರವಾಗಿ ಉಳಿಯುತ್ತದೆ
      '2':
        title: ಕ್ರಿಯೆಗಳಿಲ್ಲದ ನಂಬಿಕೆ ಸತ್ತದ್ದೇ
      '3':
        title: ನಾಲಿಗೆಯನ್ನು ಹತೋಟಿಯಲ್ಲಿಟ್ಟು ವಿವೇಕದಿಂದ ಮಾತನಾಡಿರಿ
      '4':
        title: ಸ್ವಾರ್ಥದಿಂದ ಜಗಳಗಳು ಹುಟ್ಟುತ್ತವೆ
      '5':
        title: ಶೋಷಕ ಶ್ರೀಮಂತರಿಗೆ ನ್ಯಾಯತೀರ್ಪು ಸಮೀಪಿಸಿದೆ
  1 Peter:
    display_name: 1 ಪೇತ್ರನು
    author: ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ಅಪೊಸ್ತಲ ಪೇತ್ರನು ಬರೆದನೆಂದೂ, ಸಿಲ್ವಾನನು ಲೇಖಕನಾಗಿ ನೆರವಾದನೆಂದೂ ಪರಿಗಣಿಸಲಾಗಿದೆ; ಕೆಲವು ವಿದ್ವಾಂಸರು ಇದನ್ನು ಪೇತ್ರನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಕೃತಿ ಎಂದು ಭಾವಿಸುತ್ತಾರೆ.
    audience: ರೋಮನ್ ಸಾಮ್ರಾಜ್ಯದ ಏಷ್ಯಾ ಮೈನರ್ ಪ್ರದೇಶದಲ್ಲಿ ಸಾಮಾಜಿಕ ವಿರೋಧವನ್ನು ಎದುರಿಸುತ್ತಿದ್ದ ಕ್ರೈಸ್ತರು.
    date: ಪೇತ್ರನು ಬರೆದದ್ದಾದರೆ ಕ್ರಿ.ಶ. ಸುಮಾರು 60ರ ದಶಕ; ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದದ್ದಾದರೆ ಕ್ರಿ.ಶ. ಸುಮಾರು 70–90ರ ದಶಕಗಳು.
    chapters:
      '1':
        title: ಪರಲೋಕದ ಬಾಧ್ಯತೆಯಲ್ಲಿ ನಿರೀಕ್ಷೆ
      '2':
        title: ಜೀವಂತ ಕಲ್ಲಿನ ಮೇಲೆ ಕಟ್ಟಲ್ಪಟ್ಟ ವಿಶ್ವಾಸಿಗಳು
      '3':
        title: ಹೆಂಡತಿಯರು ತಮ್ಮ ಜೀವನದಿಂದ ಕ್ರಿಸ್ತನನ್ನು ಗೌರವಿಸುತ್ತಾರೆ
      '4':
        title: ಒಳ್ಳೆಯದನ್ನೂ ಸರಿಯಾದದ್ದನ್ನೂ ಮಾಡಿ ಸಂಕಟ ಅನುಭವಿಸಿರಿ
      '5':
        title: ಹಿರಿಯರು ನಂಬಿಕೆಯ ಮಾದರಿಯಾಗಿ ಆರೈಕೆ ಮಾಡಲಿ
  2 Peter:
    display_name: 2 ಪೇತ್ರನು
    author: ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ಪೇತ್ರನು ಬರೆದನೆಂದು ಪರಿಗಣಿಸಲಾಗಿದೆ; ಆಧುನಿಕ ವಿದ್ವಾಂಸರಲ್ಲಿ ಅನೇಕರು ಇದನ್ನು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಕೃತಿ ಎಂದು ಭಾವಿಸುತ್ತಾರೆ.
    audience: ಕ್ರಿಸ್ತನ ಪುನರಾಗಮನವನ್ನು ನಿರಾಕರಿಸುವ ಪರಿಹಾಸಕರನ್ನು ಎದುರಿಸುತ್ತಿದ್ದ ಕ್ರೈಸ್ತರು.
    date: ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಆರಂಭದ ಸುಮಾರು ಕಾಲ.
    chapters:
      '1':
        title: ಪೇತ್ರನು ಆತ್ಮಿಕ ಬೆಳವಣಿಗೆಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '2':
        title: ಸುಳ್ಳು ಬೋಧಕರು ಶೀಘ್ರ ನ್ಯಾಯತೀರ್ಪಿಗೆ ಗುರಿಯಾಗುತ್ತಾರೆ
      '3':
        title: ಪೇತ್ರನು ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪಿನ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
  1 John:
    display_name: 1 ಯೋಹಾನನು
    author: ಲೇಖಕ ಅಜ್ಞಾತ; ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ಅಪೊಸ್ತಲ ಯೋಹಾನನು ಅಥವಾ ಯೋಹಾನನ ಪರಂಪರೆಯ ಹಿರಿಯನು ಎಂದು ಪರಿಗಣಿಸಲಾಗಿದೆ.
    audience: ಒಡಕಿನ ನಂತರ ಯಾರು ಸಮುದಾಯಕ್ಕೆ ಸೇರಿದವರು ಎಂಬುದನ್ನು ನಿರೂಪಿಸುತ್ತಿದ್ದ ಯೋಹಾನನ ಪರಂಪರೆಯ ಸಮುದಾಯ.
    date: ಕ್ರಿ.ಶ. ಸುಮಾರು 90–110.
    chapters:
      '1':
        title: ಬೆಳಕು ನಿಜವಾದ ಅನ್ಯೋನ್ಯತೆಯನ್ನು ಪ್ರಕಟಿಸುತ್ತದೆ
      '2':
        title: ಪ್ರೀತಿ ದೇವರ ಆಜ್ಞೆಗಳನ್ನು ಪಾಲಿಸುತ್ತದೆ
      '3':
        title: ದೇವರಿಂದ ಹುಟ್ಟಿದವರು ಪಾಪವನ್ನು ಜಯಿಸುತ್ತಾರೆ
      '4':
        title: ನಿಜವಾದ ಪ್ರೀತಿ ದೇವರಿಂದ ಬರುತ್ತದೆ
      '5':
        title: ಯೇಸುವಿನಲ್ಲಿ ನಿತ್ಯಜೀವವಿದೆ ಎಂದು ನಂಬಿರಿ
  2 John:
    display_name: 2 ಯೋಹಾನನು
    author: “ಹಿರಿಯನು.”
    audience: ಸುಳ್ಳು ಬೋಧಕರ ಕುರಿತು ಎಚ್ಚರಿಕೆ ಪಡೆದ ನಿರ್ದಿಷ್ಟ ಕ್ರೈಸ್ತ ಸಭೆ (“ಆರಿಸಲ್ಪಟ್ಟ ಮಹಿಳೆ”).
    date: ಕ್ರಿ.ಶ. ಸುಮಾರು 90–110.
    chapters:
      '1':
        title: ಹಿರಿಯನು ಸುಳ್ಳು ಬೋಧಕರ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
  3 John:
    display_name: 3 ಯೋಹಾನನು
    author: “ಹಿರಿಯನು.”
    audience: ಸಂಚಾರಿ ಸುವಾರ್ತಿಕರಿಗೆ ಆತಿಥ್ಯ ನೀಡುತ್ತಿದ್ದ ವೈಯಕ್ತಿಕ ನಾಯಕ ಗಾಯನು.
    date: ಕ್ರಿ.ಶ. ಸುಮಾರು 90–110.
    chapters:
      '1':
        title: ಗಾಯನು ಏಳಿಗೆ ಹೊಂದಲೆಂದು ಹಿರಿಯನು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
  Jude:
    display_name: ಯೂದನು
    author: ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ಯಾಕೋಬನ ಮತ್ತು ಯೇಸುವಿನ ಸಹೋದರ ಯೂದನು ಎಂದು ಪರಿಗಣಿಸಲಾಗಿದೆ.
    audience: ಸ್ವೇಚ್ಛಾಚಾರದ ಬೋಧಕರು ನುಸುಳುತ್ತಿದ್ದ ಕ್ರೈಸ್ತ ಸಮುದಾಯಗಳು.
    date: ಕ್ರಿ.ಶ. ಸುಮಾರು 60–90ರ ದಶಕಗಳು.
    chapters:
      '1':
        title: ಯೂದನು ಭಕ್ತಿಹೀನ ನುಸುಳುಕೋರರ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
  Revelation:
    display_name: ಪ್ರಕಟನೆ
    author: ಪತ್ಮೋಸ್‌ನ ಯೋಹಾನನು (ಇದರ ಬರವಣಿಗೆಯ ಶೈಲಿ ನಾಲ್ಕನೇ ಸುವಾರ್ತೆಗಿಂತ ಭಿನ್ನವಾಗಿದೆ).
    audience: ಸಾಮ್ರಾಜ್ಯಶಾಹಿ ಒತ್ತಡದಲ್ಲಿದ್ದ ರೋಮನ್ ಏಷ್ಯಾ ಮೈನರ್‌ನ ಏಳು ಕ್ರೈಸ್ತ ಸಭೆಗಳು.
    date: ಕ್ರಿ.ಶ. ಸುಮಾರು 90ರ ದಶಕ; ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ದೊಮಿಷಿಯನ್‌ನ ಆಳ್ವಿಕೆಯ ಕಾಲವೆಂದು ಪರಿಗಣಿಸಲಾಗಿದೆ.
    chapters:
      '1':
        title: ದೇವರು ಯೋಹಾನನಿಗೆ ದರ್ಶನಗಳನ್ನು ತೋರಿಸುತ್ತಾನೆ
      '2':
        title: ಯೇಸು ಏಳು ಸಭೆಗಳೊಂದಿಗೆ ಮಾತನಾಡುತ್ತಾನೆ
      '3':
        title: ಪಶ್ಚಾತ್ತಾಪಪಡಲು ಯೇಸು ಲವೊದಿಕೀಯವನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '4':
        title: ಪರಲೋಕದ ಸಿಂಹಾಸನವು ಮಹಿಮೆಯಿಂದ ಪ್ರಕಾಶಿಸುತ್ತದೆ
      '5':
        title: ಕುರಿಮರಿಯು ಸುರುಳಿಯನ್ನು ಪಡೆದು ವಿಮೋಚಿಸುತ್ತದೆ
      '6':
        title: ನಾಲ್ಕು ಕುದುರೆಸವಾರರು ಮಹಾ ವಿಪತ್ತುಗಳನ್ನು ತರುತ್ತಾರೆ
      '7':
        title: ಮುದ್ರೆ ಪಡೆದ ಸೇವಕರು ನಿತ್ಯ ಸ್ತುತಿ ಹಾಡುತ್ತಾರೆ
      '8':
        title: ಏಳು ತುತ್ತೂರಿಗಳು ಭಯಾನಕ ನ್ಯಾಯತೀರ್ಪುಗಳನ್ನು ಮೊಳಗಿಸುತ್ತವೆ
      '9':
        title: ಮಿಡತೆಗಳು ಭೂಮಿಯ ಪಾಪಿಗಳನ್ನು ಪೀಡಿಸುತ್ತವೆ
      '10':
        title: ಬಲಿಷ್ಠ ದೇವದೂತನು ಇನ್ನು ವಿಳಂಬವಿಲ್ಲವೆಂದು ಆಣೆಯಿಡುತ್ತಾನೆ
      '11':
        title: ಇಬ್ಬರು ಸಾಕ್ಷಿಗಳು ಪ್ರವಾದಿಸಿ ನಂತರ ಎದ್ದುಬರುತ್ತಾರೆ
      '12':
        title: ಆಳಲು ನೇಮಿತನಾದ ಮಗನನ್ನು ಮಹಿಳೆ ಹೆರುತ್ತಾಳೆ
      '13':
        title: ಮೃಗವು ಸಮುದ್ರದಿಂದ ಮೇಲೇಳುತ್ತದೆ
      '14':
        title: ಕುರಿಮರಿಯು ನಂಬಿಗಸ್ತರನ್ನು ತನ್ನ ಬಳಿಗೆ ಸೇರಿಸಿಕೊಳ್ಳುತ್ತದೆ
      '15':
        title: ಯೋಹಾನನು ಪರಲೋಕದ ಕ್ರೋಧವನ್ನು ನೋಡುತ್ತಾನೆ
      '16':
        title: ದೇವದೂತರು ಕ್ರೋಧದ ಪಾತ್ರೆಗಳನ್ನು ಸುರಿಯುತ್ತಾರೆ
      '17':
        title: ಬಾಬಿಲೋನಿನ ನ್ಯಾಯತೀರ್ಪು ಮತ್ತು ದೇವರ ಜಯ
      '18':
        title: ಬಾಬಿಲೋನಿನ ಪತನಕ್ಕೆ ಪರಲೋಕವು ಹರ್ಷಿಸುತ್ತದೆ
      '19':
        title: ಕುರಿಮರಿಯ ವಿವಾಹವನ್ನು ಪರಲೋಕವು ಸಂಭ್ರಮಿಸುತ್ತದೆ
      '20':
        title: ಯೋಹಾನನು ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪನ್ನು ನೋಡುತ್ತಾನೆ
      '21':
        title: ಎಲ್ಲವೂ ಹೊಸದಾಗಿ ಮಾಡಲ್ಪಡುತ್ತವೆ
      '22':
        title: ಯೇಸು ಬೇಗನೆ ಬರುತ್ತಾನೆ
  Tobit:
    display_name: ತೋಬಿತ್
    author: ಲೇಖಕ ಅಜ್ಞಾತ.
    audience: ವಿದೇಶಿ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಭಕ್ತಿ, ವಿವಾಹ ಮತ್ತು ದೈವಾನುಗ್ರಹದ ಮಾರ್ಗದರ್ಶನವನ್ನು ಅನುಸರಿಸುತ್ತಿದ್ದ ಚದುರಿಹೋಗಿದ್ದ ಯೆಹೂದ್ಯರು.
    date: ಕ್ರಿ.ಪೂ. ಸುಮಾರು 225–175; ಅರಾಮಾಯಿಕ ಭಾಷೆಯಲ್ಲಿ ರಚಿಸಲಾಯಿತು; ಹೀಬ್ರೂ ಆವೃತ್ತಿಯೂ ಕುಮ್ರಾನ್‌ನಲ್ಲಿ ದೊರೆತಿದೆ.
    chapters:
      '1':
        title: ತೋಬಿತ್ ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ದೇವರನ್ನು ಸ್ಮರಿಸುತ್ತಾನೆ
      '2':
        title: ತೋಬಿತ್ ತಿರಸ್ಕೃತ ನೆರೆಯವನನ್ನು ಹೂಣಿಡುತ್ತಾನೆ
      '3':
        title: ತೋಬಿತ್ ಅಳುತ್ತಾ ಮರಣಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '4':
        title: ತೋಬಿತ್ ತನ್ನ ಮಗನಿಗೆ ನೀತಿಯ ಕುರಿತು ಬೋಧಿಸುತ್ತಾನೆ
      '5':
        title: ತೋಬಿಯನು ಮಾರ್ಗದರ್ಶನದೊಂದಿಗೆ ಹೊರಡುತ್ತಾನೆ
      '6':
        title: ತೋಬಿಯನು ಗುಣಪಡಿಸುವ ಮೀನನ್ನು ಹಿಡಿಯುತ್ತಾನೆ
      '7':
        title: ತೋಬಿಯನು ಎಕ್ಬಟಾನದಲ್ಲಿ ಸಾರಳನ್ನು ಮದುವೆಯಾಗುತ್ತಾನೆ
      '8':
        title: ತೋಬಿಯನು ಸಾರಳನ್ನು ಮದುವೆಯಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '9':
        title: ಗಬಾಯೇಲನು ಹಣವನ್ನು ತೋಬಿತನಿಗೆ ಹಿಂದಿರುಗಿಸುತ್ತಾನೆ
      '10':
        title: ತೋಬಿಯನು ಸುರಕ್ಷಿತವಾಗಿ ಮನೆಗೆ ಮರಳುತ್ತಾನೆ
      '11':
        title: ಮಗನಿಂದ ತೋಬಿತನ ದೃಷ್ಟಿ ಮರಳಿ ಬರುತ್ತದೆ
      '12':
        title: ರಫಾಯೇಲನು ತನ್ನ ನಿಜ ಗುರುತನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '13':
        title: ತೋಬಿತ್ ಯೆರೂಸಲೇಮಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '14':
        title: ತೋಬಿತ್ ಇಸ್ರಾಯೇಲಿನ ಭವಿಷ್ಯವನ್ನು ಮುಂಗಾಣುತ್ತಾನೆ
  Judith:
    display_name: ಯೂದಿತ್
    author: ಲೇಖಕ ಅಜ್ಞಾತ.
    audience: ವಿದೇಶಿ ಬೆದರಿಕೆಯಲ್ಲಿದ್ದ ಯೆಹೂದ್ಯರು—ಭಕ್ತಿಪೂರ್ವಕ ಪ್ರತಿರೋಧದ ಧೈರ್ಯಶಾಲಿ ಕಥೆ.
    date: ಕ್ರಿ.ಪೂ. ಸುಮಾರು 150–100.
    chapters:
      '1':
        title: ನೆಬೂಕದ್ನೆಚ್ಚರನು ಅರ್ಫಕ್ಸದನ ಮೇಲೆ ದಾಳಿ ಮಾಡುತ್ತಾನೆ
      '2':
        title: ಹೋಲೊಫೆರ್ನನು ಪಶ್ಚಿಮದತ್ತ ಸಾಗುತ್ತಾನೆ
      '3':
        title: ಕರಾವಳಿಯ ಜನರು ಸಂಪತ್ತನ್ನು ಒಪ್ಪಿಸಿ ಶರಣಾಗುತ್ತಾರೆ
      '4':
        title: ಇಸ್ರಾಯೇಲರು ಉಪವಾಸವಿದ್ದು ಸಹಾಯಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾರೆ
      '5':
        title: ಅಕಿಯೋರ್ ಇಸ್ರಾಯೇಲಿನ ಇತಿಹಾಸವನ್ನು ವಿವರಿಸುತ್ತಾನೆ
      '6':
        title: ಹೋಲೊಫೆರ್ನನ ಕುರಿತು ಅಕಿಯೋರ್‌ಗೆ ಎಚ್ಚರಿಕೆ
      '7':
        title: ಬೆತೂಲಿಯಾದ ನೀರು ಮುಗಿದುಹೋಗುತ್ತದೆ
      '8':
        title: ಯೂದಿತ್ ದೇವರ ರಕ್ಷಣೆಯ ಭರವಸೆ ನೀಡುತ್ತಾಳೆ
      '9':
        title: ಯೂದಿತ್ ದೇವರ ಬಲಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾಳೆ
      '10':
        title: ಯೂದಿತ್ ಅಶ್ಶೂರ್ಯರ ಶಿಬಿರವನ್ನು ಪ್ರವೇಶಿಸುತ್ತಾಳೆ
      '11':
        title: ಹೋಲೊಫೆರ್ನನು ಯೂದಿತಳನ್ನು ಒಳಗೆ ಆಹ್ವಾನಿಸುತ್ತಾನೆ
      '12':
        title: ಯೂದಿತ್ ದೇವರ ಮಾರ್ಗದರ್ಶನವನ್ನು ಕೋರುತ್ತಾಳೆ
      '13':
        title: ಯೂದಿತ್ ಹೋಲೊಫೆರ್ನನ ಶಿರಚ್ಛೇದ ಮಾಡುತ್ತಾಳೆ
      '14':
        title: ಇಸ್ರಾಯೇಲರು ಯೂದಿತಳ ವಿಜಯವನ್ನು ಆಚರಿಸುತ್ತಾರೆ
      '15':
        title: ಇಸ್ರಾಯೇಲರು ಅಶ್ಶೂರ್ಯರ ಕೊಳ್ಳೆಯನ್ನು ಲೂಟಿ ಮಾಡುತ್ತಾರೆ
      '16':
        title: ಯೂದಿತ್ ಸ್ತುತಿಗೀತೆಯನ್ನು ಮುನ್ನಡೆಸುತ್ತಾಳೆ
  Greek Additions to Esther:
    display_name: ಎಸ್ತೇರಳ ಗ್ರೀಕ್ ಸೇರ್ಪಡೆಗಳು
    author: ಲೇಖಕ ಅಜ್ಞಾತ; ಎಸ್ತೇರಳ ಗ್ರೀಕ್ ಭಾಷಾಂತರಕ್ಕೆ ಸೇರಿಸಲಾದ ಪೂರಕ ವಿಷಯಗಳು.
    audience: ಸ್ಪಷ್ಟವಾದ ಪ್ರಾರ್ಥನೆ ಮತ್ತು ದೇವರ ಉಲ್ಲೇಖವಿರುವ ಎಸ್ತೇರಳ ಕಥೆಯನ್ನು ಬಯಸಿದ ಗ್ರೀಕ್‌ಭಾಷಿ ಯೆಹೂದ್ಯರು.
    date: ಕ್ರಿ.ಪೂ. ಸುಮಾರು 2ನೇ–1ನೇ ಶತಮಾನ.
    chapters:
      '1':
        title: ಮೊರ್ದೆಕೈ ಕನಸು ಕಂಡು ಅರಸನನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '2':
        title: ನಾಶಮಾಡುವಂತೆ ಅರಸನು ಆದೇಶಗಳನ್ನು ಬರೆಯುತ್ತಾನೆ
      '3':
        title: ಮೊರ್ದೆಕೈ ಮತ್ತು ಎಸ್ತೇರಳು ಸಹಾಯಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾರೆ
      '4':
        title: ಎಸ್ತೇರಳು ಅರಸನ ಸಮ್ಮುಖಕ್ಕೆ ಪ್ರವೇಶಿಸುತ್ತಾಳೆ
      '5':
        title: ಅರಸನು ಹಾಮಾನನನ್ನು ಶಿಕ್ಷಿಸಿ ಯೆಹೂದ್ಯರನ್ನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '6':
        title: ಮೊರ್ದೆಕೈ ಕನಸನ್ನು ನೆನಪಿಸಿಕೊಂಡು ಪ್ರವಾದಿಸುತ್ತಾನೆ
  Wisdom of Solomon:
    display_name: ಸೊಲೊಮೋನನ ಜ್ಞಾನ
    author: ಲೇಖಕ ಅಜ್ಞಾತ; ಸೊಲೊಮೋನನ ಹೆಸರಿನಲ್ಲಿ ರಚಿಸಲಾಗಿದೆ. ಬಹುಶಃ ಅಲೆಕ್ಸಾಂಡ್ರಿಯಾದಲ್ಲಿ, ಹೆಲೆನಿಸ್ಟಿಕ್ ಯೆಹೂದಿ ಲೇಖಕನೊಬ್ಬನು ಗ್ರೀಕ್ ಭಾಷೆಯಲ್ಲಿ ರಚಿಸಿದನು.
    audience: ಗ್ರೀಕ್ ತತ್ತ್ವಶಾಸ್ತ್ರದೊಂದಿಗೆ ಸಂವಾದ ನಡೆಸುತ್ತಾ, ಅನ್ಯಧರ್ಮೀಯ ಮತ್ತು ಧರ್ಮತ್ಯಾಗಿ ಪರ್ಯಾಯಗಳ ಎದುರು ಇಸ್ರಾಯೇಲಿನ ಜ್ಞಾನವನ್ನು ಸಮರ್ಥಿಸುತ್ತಿದ್ದ ಹೆಲೆನಿಸ್ಟಿಕ್ ಯೆಹೂದ್ಯರು.
    date: ಕ್ರಿ.ಪೂ. ಸುಮಾರು 50ರಿಂದ ಕ್ರಿ.ಶ. ಸುಮಾರು 50ರವರೆಗೆ.
    chapters:
      '1':
        title: ಹುಡುಕುವವರಿಗೆ ದೇವರು ಜ್ಞಾನವನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '2':
        title: ದುಷ್ಟರು ಜೀವನದ ನಿಜವಾದ ಆನಂದವನ್ನು ತಿರಸ್ಕರಿಸುತ್ತಾರೆ
      '3':
        title: ನೀತಿವಂತರ ಆತ್ಮಗಳು ಶಾಂತಿಯಲ್ಲಿ ವಿಶ್ರಾಂತಿ ಪಡೆಯುತ್ತವೆ
      '4':
        title: ಸದ್ಗುಣಕ್ಕೆ ಗೌರವ, ಭಕ್ತಿಹೀನರಿಗೆ ಅವಮಾನ
      '5':
        title: ನೀತಿವಂತರು ದುಷ್ಟತನವನ್ನು ಧೈರ್ಯದಿಂದ ಬಯಲಿಗೆಳೆಯುತ್ತಾರೆ
      '6':
        title: ಜ್ಞಾನವು ನಿಜವಾದ ಅರಸತ್ವಕ್ಕೆ ನಡೆಸುತ್ತದೆ
      '7':
        title: ಪ್ರಾರ್ಥನೆಯಿಂದ ಜ್ಞಾನ ಮತ್ತು ತಿಳುವಳಿಕೆ ದೊರೆಯುತ್ತವೆ
      '8':
        title: ಜ್ಞಾನವು ಆಳುವವರಿಗೆ ಮಾರ್ಗದರ್ಶನ ಮತ್ತು ಬಲ ನೀಡುತ್ತದೆ
      '9':
        title: ರಾಜನು ದೈವಿಕ ಜ್ಞಾನಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '10':
        title: ಜ್ಞಾನವು ನೀತಿವಂತರನ್ನು ಕಾಪಾಡಿ ಬಿಡಿಸುತ್ತದೆ
      '11':
        title: ದೇವರು ಶಿಸ್ತುಗೊಳಿಸುವ ಮೂಲಕ ಕರುಣೆ ತೋರಿಸುತ್ತಾನೆ
      '12':
        title: ವಿಗ್ರಹಗಳನ್ನು ಹಾಸ್ಯಮಾಡುವುದು ವ್ಯರ್ಥ ನಿರೀಕ್ಷೆಗೆ ಕಾರಣವಾಗುತ್ತದೆ
      '13':
        title: ಜನರು ನಿರ್ಜೀವ ವಿಗ್ರಹಗಳನ್ನು ಆರಾಧಿಸುತ್ತಾರೆ
      '14':
        title: ದೇವರು ಹಡಗುಗಳನ್ನು ಸಮುದ್ರದಲ್ಲಿ ನಡೆಸುತ್ತಾನೆ
      '15':
        title: ದೇವರ ಕರುಣೆ ಸತ್ಯ ಆರಾಧನೆಗೆ ಮಾರ್ಗದರ್ಶನ ನೀಡುತ್ತದೆ
      '16':
        title: ದೇವರು ದಬ್ಬಾಳಿಕೆಗಾರರಿಗೆ ತೀರ್ಪು ನೀಡುತ್ತಾ ತನ್ನ ಜನರಿಗೆ ಒದಗಿಸುತ್ತಾನೆ
      '17':
        title: ಭಯಾನಕ ರಾತ್ರಿಯ ಅಪ್ಪುಗೆಯಲ್ಲಿ ಸಿಕ್ಕಿಬಿದ್ದವರು
      '18':
        title: ದೇವರು ಬೆಳಕಿನಿಂದ ಮಾರ್ಗದರ್ಶನ ನೀಡುತ್ತಾನೆ
      '19':
        title: ಇಸ್ರಾಯೇಲಿಗಾಗಿ ಮೋಡಗಳು ಸರಿಯುತ್ತವೆ
  Sirach:
    display_name: ಸೀರಾಕ್
    author: ಯೆರೂಸಲೇಮಿನ ಯೇಸುವ ಬೆನ್ ಎಲಿಯಾಜರ್ ಬೆನ್ ಸೀರಾ; ಅವರ ಮೊಮ್ಮಗನು ಗ್ರೀಕ್ ಭಾಷೆಗೆ ಅನುವಾದಿಸಿದನು.
    audience: ಹೆಲೆನಿಸ್ಟಿಕ್ ಕಾಲದ ಯೆರೂಸಲೇಮಿನಲ್ಲಿ ಜ್ಞಾನವಿವೇಕದ ಶಿಕ್ಷಣ ಪಡೆಯುತ್ತಿದ್ದ ಯೆಹೂದಿ ಯುವಕರು.
    date: ಹೀಬ್ರೂ ಮೂಲ ಕೃತಿ ಅಂದಾಜು ಕ್ರಿ.ಪೂ. 195–175; ಗ್ರೀಕ್ ಅನುವಾದ ಅಂದಾಜು ಕ್ರಿ.ಪೂ. 132.
    chapters:
      '1':
        title: ದೇವರು ಜ್ಞಾನವನ್ನು ಅಳೆದು ನೀಡುತ್ತಾನೆ
      '2':
        title: ಪರೀಕ್ಷೆಗಳು ನಂಬಿಗಸ್ತ ಸೇವಕರನ್ನು ಸಾಬೀತುಪಡಿಸುತ್ತವೆ
      '3':
        title: ತಂದೆತಾಯಿಯನ್ನು ಗೌರವಿಸಿ ದೀರ್ಘಾಯುಷ್ಯ ಪಡೆಯಿರಿ
      '4':
        title: ತುಳಿತಕ್ಕೊಳಗಾದವರನ್ನು ರಕ್ಷಿಸಿ ಜ್ಞಾನವನ್ನು ಹುಡುಕಿ
      '5':
        title: ಐಶ್ವರ್ಯವನ್ನಲ್ಲ, ದೇವರನ್ನು ನಂಬಿರಿ
      '6':
        title: ರೈತನಂತೆ ಜ್ಞಾನವನ್ನು ಹುಡುಕಿ
      '7':
        title: ಹೃದಯದಾಳದಲ್ಲಿ ದೀನತೆಯನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳಿ
      '8':
        title: ಮೂರ್ಖರಿಂದ ದೂರವಿರಿ, ಹಿರಿಯರನ್ನು ಗೌರವಿಸಿ
      '9':
        title: ಅಸೂಯೆ ಮತ್ತು ಕಾಮದ ವಿರುದ್ಧ ಎಚ್ಚರವಾಗಿರಿ
      '10':
        title: ವಿವೇಕದ ನಾಯಕತ್ವ ಸುವ್ಯವಸ್ಥೆ ತರುತ್ತದೆ
      '11':
        title: ಜ್ಞಾನವು ಬಡವರನ್ನು ಉನ್ನತಿಗೇರಿಸುತ್ತದೆ
      '12':
        title: ಪಾಪಿಗಳಿಗಲ್ಲ, ನೀತಿವಂತರಿಗೆ ಸಹಾಯಮಾಡಿ
      '13':
        title: ಡಾಂಬರನ್ನು ಮುಟ್ಟಿದರೆ ಅದು ಅಂಟಿಕೊಳ್ಳುತ್ತದೆ
      '14':
        title: ಜ್ಞಾನವು ಶಾಶ್ವತ ಆಶೀರ್ವಾದ ತರುತ್ತದೆ
      '15':
        title: ತನ್ನನ್ನು ಹುಡುಕುವವರಿಗೆ ಜ್ಞಾನವು ಎದುರಾಗುತ್ತದೆ
      '16':
        title: ಒಬ್ಬ ನಂಬಿಗಸ್ತನು ನಗರವನ್ನು ಉಳಿಸುತ್ತಾನೆ
      '17':
        title: ಮಾನವರು ದೇವರ ಸ್ವರೂಪದಲ್ಲಿ ಸೃಷ್ಟಿಸಲ್ಪಟ್ಟರು
      '18':
        title: ಒಳ್ಳೆಯ ಕಾರ್ಯಗಳನ್ನು ಹಾಳುಮಾಡಬೇಡಿ
      '19':
        title: ಸುಖವನ್ನು ಬೆನ್ನಟ್ಟುವವರು ಹಾಳಾಗುತ್ತಾರೆ
      '20':
        title: ಮಾತನಾಡಲು ತಕ್ಕ ಸಮಯವನ್ನು ಎಚ್ಚರಿಕೆಯಿಂದ ಆರಿಸಿರಿ
      '21':
        title: ಪ್ರಾರ್ಥಿಸಿ, ಪಾಪದಿಂದ ಓಡಿಹೋಗಿ, ಜ್ಞಾನವನ್ನು ಹುಡುಕಿ
      '22':
        title: ಸೋಮಾರಿತನವು ಅವಮಾನ ಮತ್ತು ದುಃಖ ತರುತ್ತದೆ
      '23':
        title: ಆಂತರಿಕ ಶಿಸ್ತು ಮತ್ತು ಜ್ಞಾನಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸಿ
      '24':
        title: ಜ್ಞಾನವು ತನ್ನನ್ನೇ ಹೊಗಳುತ್ತಾ ಮಾತನಾಡುತ್ತದೆ
      '25':
        title: ಜ್ಞಾನವು ದೇವರನ್ನೂ ಜನರನ್ನೂ ಗೌರವಿಸುತ್ತದೆ
      '26':
        title: ಪತ್ನಿ ಸಂತೋಷವನ್ನೋ ನೋವನ್ನೋ ತರುತ್ತಾಳೆ
      '27':
        title: ನೀತಿಯನ್ನು ಬೆನ್ನಟ್ಟಿ, ಅದನ್ನು ಹೆಮ್ಮೆಯಿಂದ ಧರಿಸಿ
      '28':
        title: ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸಿ, ಕರುಣೆ ಪಡೆಯಿರಿ
      '29':
        title: ನೆರೆಯವನನ್ನು ಕ್ಷಮಿಸಿ, ಕರುಣೆ ಪಡೆಯಿರಿ
      '30':
        title: ಪುತ್ರರನ್ನು ಗೌರವಯುತವಾಗಿ ಬೆಳೆಸಿರಿ
      '31':
        title: ಐಶ್ವರ್ಯವು ಚಿಂತೆ ಮತ್ತು ನೋವು ತರುತ್ತದೆ
      '32':
        title: ದೀನತೆಯಿಂದ ಮೊದಲು ಇತರರ ಸೇವೆಮಾಡಿ
      '33':
        title: ತನ್ನಲ್ಲಿ ಭಯಭಕ್ತಿಯುಳ್ಳವರನ್ನು ಕರ್ತನು ಕಾಪಾಡುತ್ತಾನೆ
      '34':
        title: ಸ್ಪಷ್ಟತೆ ಇಲ್ಲದಿದ್ದರೆ ಕನಸುಗಳು ದಾರಿತಪ್ಪಿಸಬಹುದು
      '35':
        title: ನಾಯಕರು ದೀನರೂ ವಿವೇಕಿಗಳೂ ಆಗಿರಬೇಕು
      '36':
        title: ಕರ್ತನ ಭಯಭಕ್ತಿಯಿಂದ ರಕ್ಷಣೆ ಬರುತ್ತದೆ
      '37':
        title: ಸ್ನೇಹಿತರನ್ನೂ ಸಲಹೆಯನ್ನೂ ವಿವೇಕದಿಂದ ಆರಿಸಿರಿ
      '38':
        title: ವೈದ್ಯರನ್ನು ಗೌರವಿಸಿ, ಗುಣಮುಖರಾಗಲು ಪ್ರಾರ್ಥಿಸಿ
      '39':
        title: ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ನಿಷ್ಠನಾದವನನ್ನು ಸೀರಾಕ್ ಹೊಗಳುತ್ತಾನೆ
      '40':
        title: ಜೀವನದ ಹೊರೆಗಳು ಮತ್ತು ಆಶೀರ್ವಾದಗಳು
      '41':
        title: ಮರಣವು ಅಂತಿಮ ವಿಶ್ರಾಂತಿ ತರುತ್ತದೆ
      '42':
        title: ಕಠಿಣವಾದರೂ ಅಗತ್ಯವಾದ ವಿಷಯಗಳನ್ನು ಚರ್ಚಿಸಿ
      '43':
