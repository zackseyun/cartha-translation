      '5':
        title: ಬಾರ್ಬೆಲೊ ಶಕ್ತಿಗಳನ್ನು ಬೇಡುತ್ತಾಳೆ
      '6':
        title: ಕ್ರಿಸ್ತನು ದೈವಿಕ ಪರಿಪಾಲನೆಯಿಂದ ಬರುತ್ತಾನೆ
      '7':
        title: ಶಾಶ್ವತ ಜೀವನವು ಆತ್ಮವನ್ನು ಸ್ತುತಿಸುತ್ತದೆ
      '8':
        title: ಆದಾಮನು ಅಗೋಚರ ದೇವರನ್ನು ಸ್ತುತಿಸಿದನು
      '9':
        title: ಸೋಫಿಯಾ ಅಪೂರ್ಣ ಜೀವಿಯನ್ನು ಸೃಷ್ಟಿಸುತ್ತಾಳೆ
      '10':
        title: ಅಹಂಕಾರಿ ಆಳುವವನು ಲೋಕಗಳನ್ನು ರೂಪಿಸುತ್ತಾನೆ
      '11':
        title: ಅಜ್ಞಾನಿ ಆಳುವವನು ಕ್ರಮವನ್ನು ನಕಲಿಸುತ್ತಾನೆ
      '12':
