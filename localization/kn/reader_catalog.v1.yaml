      '47':
        title: ಎಲ್ಲ ಜನಾಂಗಗಳೇ, ಚಪ್ಪಾಳೆ ತಟ್ಟಿ, ಜಯಘೋಷ ಮಾಡಿ, ಹಾಡಿರಿ
      '48':
        title: ಚೀಯೋನಿನ ಪರಾಕ್ರಮಿ ದೇವರನ್ನು ಸ್ತುತಿಸಿರಿ
      '49':
        title: ಸಂಪತ್ತು ಮರಣದಿಂದ ರಕ್ಷಿಸಲಾರದು
      '50':
        title: ದೇವರು ಪ್ರಜ್ವಲಿಸುವ ಪವಿತ್ರತೆಯಿಂದ ನ್ಯಾಯತೀರಿಸುತ್ತಾನೆ
      '51':
        title: ಮುರಿದ ಹೃದಯವು ನವೀಕರಣವನ್ನು ಅರಸುತ್ತದೆ
      '52':
        title: ವಂಚನೆಯ ಜಂಬವನ್ನು ಖಂಡಿಸುತ್ತದೆ
      '53':
