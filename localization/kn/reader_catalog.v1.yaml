      '56':
        title: ವೈರಿಗಳು ಬೇಟೆಯಾಡುವಾಗ ದೇವರಲ್ಲಿ ಭರವಸೆಯಿಡು
      '57':
        title: ಮರಿಗಳನ್ನು ತನ್ನ ರೆಕ್ಕೆಗಳಡಿ ಆಶ್ರಯಿಸುವ ಹಕ್ಕಿಯಂಥ ರಕ್ಷಣೆ
      '58':
        title: ಭ್ರಷ್ಟ ಮಾನವ ಆಳುವವರನ್ನು ಖಂಡಿಸುತ್ತದೆ
      '59':
        title: ಹಿಂಸಾತ್ಮಕ ಜನರಿಂದ ನನ್ನನ್ನು ರಕ್ಷಿಸು
      '60':
        title: ನಿನ್ನ ಜನರನ್ನು ಗುಣಪಡಿಸಿ ಪುನಃಸ್ಥಾಪಿಸು
      '61':
        title: ದಾವೀದನು ದೇವರ ರಕ್ಷಣೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '62':
        title: ದಾವೀದನು ದೇವರೊಬ್ಬರಲ್ಲೇ ಭರವಸೆಯಿಡುತ್ತಾನೆ
      '63':
        title: ದಾವೀದನು ಅರಣ್ಯದ ರಾತ್ರಿಯಲ್ಲಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '64':
        title: ದಾವೀದನು ಪ್ರಾರ್ಥಿಸಿ ವೈರಿಗಳನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '65':
        title: ದೇವರು ಪ್ರಾರ್ಥನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ ಶಾಂತಿಯನ್ನು ತರುತ್ತಾನೆ
      '66':
        title: ಭೂಮಿಯೆಲ್ಲ ದೇವರಿಗೆ ಹರ್ಷಧ್ವನಿ ಮಾಡುತ್ತದೆ
      '67':
        title: ದೇವರು ಜನರನ್ನು ಆಶೀರ್ವದಿಸಿ ನ್ಯಾಯ ಸ್ಥಾಪಿಸುತ್ತಾನೆ
      '68':
        title: ದೇವರು ದುಷ್ಟರನ್ನು ಚದುರಿಸಿ ಸಂತೋಷ ತರುತ್ತಾನೆ
      '69':
        title: ಸಂಕಟದಲ್ಲಿ ಮುಳುಗಿದವನ ಹತಾಶ ಮೊರೆ
      '70':
        title: ದಾವೀದನು ತ್ವರಿತ ರಕ್ಷಣೆಗಾಗಿ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '71':
        title: ಕೀರ್ತನೆ ಶಾಶ್ವತವಾದ ನಂಬಿಕೆಯನ್ನು ಅರಸುತ್ತದೆ
      '72':
        title: ಅರಸನು ನ್ಯಾಯವಾದ ಆಳ್ವಿಕೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '73':
        title: ಆಸಾಫನು ದೇವರ ನಂಬಿಗಸ್ತಿಕೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '74':
        title: ದೇವರು ನೆನಪಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಕೀರ್ತನೆ ಮೊರೆಯಿಡುತ್ತದೆ
      '75':
        title: ದೇವರು ಅಹಂಕಾರಿ ದುಷ್ಟರಿಗೆ ನ್ಯಾಯತೀರಿಸುತ್ತಾನೆ
      '76':
        title: ದೇವರು ಆಯುಧಗಳನ್ನು ಚೂರುಮಾಡಿ ತನ್ನ ಮಹತ್ವ ತೋರಿಸುತ್ತಾನೆ
      '77':
        title: ಮನುಷ್ಯನು ಮೊರೆಯಿಟ್ಟು, ತಿರುಗಿ, ನೆನಪಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '78':
        title: ನಂಬಿಗಸ್ತ ನಿರೀಕ್ಷೆಯನ್ನು ತಲೆಮಾರುಗಳಿಗೆ ಹಸ್ತಾಂತರಿಸುವುದು
      '79':
        title: ಯೆರೂಸಲೇಮ್ ಅಪವಿತ್ರಗೊಂಡ ಬಳಿಕದ ಮೊರೆ
      '80':
        title: ದೇವರೇ, ನಮ್ಮನ್ನು ಪುನಃಸ್ಥಾಪಿಸು ಎಂದು ಪ್ರಾರ್ಥಿಸುತ್ತೇವೆ
      '81':
        title: ದೇವರು ಇಸ್ರಾಯೇಲಿಗಾಗಿ ಹಂಬಲಿಸುತ್ತಾನೆ
      '82':
        title: ದೇವರು ಆಳುವವರಿಗೆ ನ್ಯಾಯತೀರಿಸಿ ದುರ್ಬಲರನ್ನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '83':
        title: ದೇವರು ಇಸ್ರಾಯೇಲಿನ ವೈರಿಗಳನ್ನು ಚದುರಿಸುತ್ತಾನೆ
      '84':
        title: ದೇವರ ಸಾನ್ನಿಧ್ಯಕ್ಕಾಗಿ ಹಂಬಲ
      '85':
        title: ಕರ್ತನು ಜನರನ್ನು ಮತ್ತೆ ಪುನಃಸ್ಥಾಪಿಸುತ್ತಾನೆ
      '86':
        title: ದಾವೀದನು ಕರುಣೆ ಮತ್ತು ಸಹಾಯಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '87':
        title: ಚೀಯೋನು ಎಲ್ಲಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ದೇವರನ್ನು ಪ್ರೀತಿಸುತ್ತದೆ
      '88':
        title: ಪರಿತ್ಯಕ್ತ ಆತ್ಮದ ಹತಾಶ ಮೊರೆ
      '89':
        title: ದಾವೀದನೊಂದಿಗಿನ ದೇವರ ಒಡಂಬಡಿಕೆಯನ್ನು ಸಂಭ್ರಮಿಸುತ್ತದೆ
      '90':
        title: ಮೋಶೆಯು ಜ್ಞಾನಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '91':
        title: ದೇವರು ನಂಬಿಗಸ್ತರನ್ನು ಕಾಪಾಡುತ್ತಾನೆ
      '92':
        title: ಕರ್ತನಿಗೆ ಎಂದೆಂದಿಗೂ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸುವುದು
      '93':
        title: ಕರ್ತನು ಎಲ್ಲ ಸಮುದ್ರಗಳ ಮೇಲೆಯೂ ಆಳುತ್ತಾನೆ
      '94':
        title: ದೇವರು ನೋಡಿ ಕೆಟ್ಟದ್ದಕ್ಕೆ ಪ್ರತಿಫಲ ನೀಡುತ್ತಾನೆ
      '95':
        title: ಬನ್ನಿರಿ, ಕೃತಜ್ಞತೆಯಿಂದ ದೇವರನ್ನು ಆರಾಧಿಸೋಣ
      '96':
        title: ಹೊಸ ಹಾಡನ್ನು ಹಾಡಿರಿ; ಕರ್ತನು ಆಳುತ್ತಾನೆ
      '97':
        title: ಕರ್ತನು ಸೃಷ್ಟಿಯೆಲ್ಲದರ ಮೇಲೆ ಆಳುತ್ತಾನೆ
      '98':
        title: ಹೊಸ ಹಾಡನ್ನು ಹಾಡಿ ಸಂಭ್ರಮಿಸಿರಿ
      '99':
        title: ಕರ್ತನು ನ್ಯಾಯ ಮತ್ತು ಕರುಣೆಯಿಂದ ಆಳುತ್ತಾನೆ
      '100':
        title: ಎಲ್ಲರೂ ಸಂತೋಷದಿಂದ ಕರ್ತನನ್ನು ಆರಾಧಿಸಿರಿ
      '101':
        title: ದಾವೀದನು ಯಥಾರ್ಥತೆ ಮತ್ತು ಸೇವೆಗೆ ಪ್ರತಿಜ್ಞೆ ಮಾಡುತ್ತಾನೆ
      '102':
        title: ಜಜ್ಜಿಹೋದ ಆತ್ಮವು ಬದಲಾಗದ ದೇವರಿಗೆ ಪ್ರಾರ್ಥಿಸುತ್ತದೆ
      '103':
        title: ದಾವೀದನು ನ್ಯಾಯವಂತ ಕರ್ತನನ್ನು ಸ್ತುತಿಸುತ್ತಾನೆ
      '104':
        title: ಯೆಹೋವನು ಸೃಷ್ಟಿಸುತ್ತಾನೆ, ಒದಗಿಸುತ್ತಾನೆ ಮತ್ತು ನವೀಕರಿಸುತ್ತಾನೆ
      '105':
        title: ದೇವರಿಗೆ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸಿ, ಒಡಂಬಡಿಕೆಯನ್ನು ನೆನಪಿಸಿಕೊಳ್ಳಿರಿ
      '106':
        title: ಮರೆತ ಪ್ರೀತಿ, ಶಾಶ್ವತ ವಿಮೋಚನೆ
      '107':
        title: ವಿಮೋಚಿತರೇ, ಕರ್ತನಿಗೆ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸಿರಿ
      '108':
        title: ಬಿಡುಗಡೆಗಾಗಿ ದಾವೀದನ ಪ್ರಾರ್ಥನೆ
      '109':
        title: ದುಷ್ಟ ದಬ್ಬಾಳಿಕೆಗಾರನ ವಿರುದ್ಧ ತುರ್ತಾದ ಮೊರೆ
      '110':
        title: ಪವಿತ್ರ ವೈಭವದೊಂದಿಗೆ ಆಳಲ್ಪಡುವ ದಾವೀದ
      '111':
        title: ಪೂರ್ಣ ಹೃದಯದಿಂದ ಯೆಹೋವನನ್ನು ಸ್ತುತಿಸಿರಿ
      '112':
        title: ದೈವಭಕ್ತನು ಧನ್ಯನು
      '113':
        title: ದೀನರನ್ನು ಉನ್ನತಿಗೇರಿಸುವ ಯೆಹೋವನನ್ನು ಸ್ತುತಿಸಿರಿ
      '114':
        title: ಇಸ್ರಾಯೇಲಿನ ನಿರ್ಗಮನ ಮತ್ತು ಪ್ರಕೃತಿಯ ಪ್ರತಿಕ್ರಿಯೆ
      '115':
        title: ಯೆಹೋವನೊಬ್ಬನಿಗೇ ಮಹಿಮೆ
      '116':
        title: ಕೀರ್ತನೆಗಾರನು ತನ್ನನ್ನು ರಕ್ಷಿಸುವ ಯೆಹೋವನನ್ನು ಪ್ರೀತಿಸುತ್ತಾನೆ
      '117':
        title: ಶಾಶ್ವತ ಪ್ರೀತಿಯ ಯೆಹೋವನನ್ನು ಸ್ತುತಿಸಿರಿ
      '118':
        title: ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸಲು ಕೀರ್ತನೆ 118ರ ಕರೆ
      '120':
        title: ಕೀರ್ತನೆಗಾರನು ಮೊರೆಯಿಡುತ್ತಾನೆ, ಕರ್ತನು ಉತ್ತರಿಸುತ್ತಾನೆ
      '121':
        title: ಸಹಾಯವು ಕರ್ತನಿಂದ ಬರುತ್ತದೆ
      '122':
        title: ಯೆರೂಸಲೇಮಿನ ಶಾಂತಿಗಾಗಿ ದಾವೀದನ ಪ್ರಾರ್ಥನೆ
      '123':
        title: ಯೆಹೋವನನ್ನು ನಂಬಿ ಮೇಲಕ್ಕೆ ನೋಡುವ ಕೀರ್ತನೆಗಾರ
      '124':
        title: ಯೆಹೋವನು ಇಸ್ರಾಯೇಲನ್ನು ಅಪಾಯದಿಂದ ರಕ್ಷಿಸುತ್ತಾನೆ
      '125':
        title: ಭರವಸೆಯು ಅಚಲ ಭದ್ರತೆಯನ್ನು ತರುತ್ತದೆ
      '126':
        title: ಚೀಯೋನಿನ ಪುನಃಸ್ಥಾಪನೆಯಿಂದ ಉಕ್ಕಿಹರಿಯುವ ಆನಂದ
      '127':
        title: ಯೆಹೋವನು ಕಟ್ಟುತ್ತಾನೆ ಮತ್ತು ಕಾಪಾಡುತ್ತಾನೆ
      '128':
        title: ದೇವರಿಗೆ ಭಯಪಡುವವರು ಧನ್ಯರು
      '129':
        title: ಇಸ್ರಾಯೇಲಿನ ಶತ್ರುಗಳು ನಮ್ಮನ್ನು ಸೋಲಿಸಲಾರರು
      '130':
        title: ಕರುಣೆಗಾಗಿ ಕೀರ್ತನೆಗಾರನ ಮೊರೆ
      '131':
        title: ದೇವರ ಸನ್ನಿಧಿಯಲ್ಲಿ ದಾವೀದನ ಶಾಂತ ವಿಶ್ರಾಂತಿ
      '132':
        title: ಯೆಹೋವನ ವಾಸಸ್ಥಳವನ್ನು ಹುಡುಕುವ ದಾವೀದ
      '133':
        title: ದೈವಿಕ ಐಕ್ಯವನ್ನು ಹೊಗಳುವ ದಾವೀದ
      '134':
        title: ರಾತ್ರಿಯ ಕಾವಲುಗಾರರು ಯೆಹೋವನನ್ನು ಸ್ತುತಿಸುತ್ತಾರೆ
      '135':
        title: ವಿಗ್ರಹಗಳನ್ನು ಸೋಲಿಸುವ ಯೆಹೋವನನ್ನು ಸ್ತುತಿಸಿರಿ
      '136':
        title: ಅಂತ್ಯವಿಲ್ಲದ ಪ್ರೀತಿಗಾಗಿ ಯೆಹೋವನಿಗೆ ಕೃತಜ್ಞತೆ
      '137':
        title: ಯೆರೂಸಲೇಮನ್ನು ನೆನೆದು ಅಳುವ ದೇಶಭ್ರಷ್ಟರು
      '138':
        title: ಸಾರ್ವಜನಿಕವಾಗಿ ಯೆಹೋವನಿಗೆ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸುವ ದಾವೀದ
      '139':
        title: ದೇವರ ಪರಿಪೂರ್ಣ ಜ್ಞಾನ ಮತ್ತು ಸಾನ್ನಿಧ್ಯ
      '140':
        title: ಹಿಂಸೆಯಿಂದ ದಾವೀದನನ್ನು ಕಾಪಾಡುವ ದೇವರು
      '141':
        title: ತನ್ನ ಮಾತುಗಳಿಗೆ ಕಾವಲು ಕೋರಿ ದಾವೀದನ ಪ್ರಾರ್ಥನೆ
      '142':
        title: ಕರ್ತನಿಗೆ ಮೊರೆಯಿಡುವ ದಾವೀದ
      '143':
        title: ಕರುಣೆಗಾಗಿ ದಾವೀದನ ಪ್ರಾರ್ಥನೆ
      '144':
        title: ರಕ್ಷಣೆಗಾಗಿ ದಾವೀದನ ಪ್ರಾರ್ಥನೆ
      '145':
        title: ದೇವರ ಮಹಿಮೆಯನ್ನು ಸ್ತುತಿಸುವ ದಾವೀದ
      '146':
        title: ನನ್ನ ಆತ್ಮವೇ, ದೇವರನ್ನು ಎಂದೆಂದಿಗೂ ಸ್ತುತಿಸು
      '147':
        title: ಮತ್ತೆ ಕಟ್ಟುವ ಮತ್ತು ಗುಣಪಡಿಸುವ ಯೆಹೋವನನ್ನು ಸ್ತುತಿಸಿರಿ
      '148':
        title: ಸೃಷ್ಟಿಯೆಲ್ಲವೂ ಕರ್ತನನ್ನು ಸ್ತುತಿಸುತ್ತದೆ
      '149':
        title: ಎಲ್ಲರೂ ಯಾಹ್‌ನನ್ನು ಸ್ತುತಿಸಲಿ
      '150':
        title: ಎಲ್ಲ ವಾದ್ಯಗಳಿಂದ ಯಾಹ್‌ನನ್ನು ಸ್ತುತಿಸಿರಿ
  Proverbs:
    display_name: ಜ್ಞಾನೋಕ್ತಿಗಳು
    author: ಇದು ಒಂದು ಸಂಕಲನ; ಮೇಲ್ಬರಹಗಳು ಸೊಲೊಮೋನ, ಆಗೂರ, ಲೆಮೂವೇಲ ಮತ್ತು “ಜ್ಞಾನಿಗಳು” ಎಂದು ಹೆಸರಿಸುತ್ತವೆ.
    audience: ದೈನಂದಿನ ಬದುಕಿಗೆ ಬೇಕಾದ ಜ್ಞಾನದಲ್ಲಿ ರೂಪುಗೊಳ್ಳುತ್ತಿದ್ದ ಯುವ ಇಸ್ರಾಯೇಲ್ಯರು.
    date: ರಚನೆಯ ವಿವಿಧ ಪದರಗಳು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 10ನೆಯ–4ನೆಯ ಶತಮಾನಗಳಿಗೆ ಸೇರಿರಬಹುದು.
    chapters:
      '1':
        title: ಕರ್ತನ ಭಯವನ್ನು ಬೋಧಿಸುವ ಸೊಲೊಮೋನ
      '2':
        title: ದೇವರನ್ನು ಹುಡುಕುವುದರಿಂದ ಜ್ಞಾನ ದೊರೆಯುತ್ತದೆ
      '3':
        title: ದೇವರನ್ನು ನಂಬಿ ಜ್ಞಾನವನ್ನು ಪಡೆಯಿರಿ
      '4':
        title: ಎಲ್ಲಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ಜ್ಞಾನವನ್ನು ಅರಸಲು ತಂದೆಯ ಒತ್ತಾಯ
      '5':
        title: ವ್ಯಭಿಚಾರದ ವಿರುದ್ಧ ತಂದೆಯ ಎಚ್ಚರಿಕೆ
      '6':
        title: ಪಾಪ ಮತ್ತು ಸೋಮಾರಿತನದ ವಿರುದ್ಧ ಎಚ್ಚರಿಕೆಗಳು
      '7':
        title: ಪ್ರಲೋಭಿಸುವ ವ್ಯಭಿಚಾರದಿಂದ ದೂರವಿರಿ
      '8':
        title: ಹುಡುಕುವವರನ್ನು ಕರೆಯುವ ಜ್ಞಾನ
      '9':
        title: ಜ್ಞಾನವು ಆಹ್ವಾನಿಸುತ್ತದೆ, ಮೂರ್ಖತನವು ಪ್ರಲೋಭಿಸುತ್ತದೆ
      '10':
        title: ನೀತಿವಂತಿಕೆ ಮತ್ತು ದುಷ್ಟತನದ ವ್ಯತ್ಯಾಸಗಳು
      '11':
        title: ಯಥಾರ್ಥತೆಯು ಆಶೀರ್ವಾದಕ್ಕೆ ನಡೆಸುತ್ತದೆ
      '12':
        title: ನೀತಿವಂತರು ಜ್ಞಾನದಿಂದ ಉತ್ತಮವಾಗಿ ಬದುಕುತ್ತಾರೆ
      '13':
        title: ಕಲಿಯುವ ಮನಸ್ಸು ಜೀವಕ್ಕೆ ನಡೆಸುತ್ತದೆ
      '14':
        title: ಜ್ಞಾನವು ಮನೆಯನ್ನು ಕಟ್ಟುತ್ತದೆ ಮತ್ತು ಕರ್ತನನ್ನು ಗೌರವಿಸುತ್ತದೆ
      '15':
        title: ಸೌಮ್ಯವಾದ ಮಾತು ಜೀವವನ್ನು ತರುತ್ತದೆ
      '16':
        title: ಮನುಷ್ಯನು ಯೋಜಿಸುತ್ತಾನೆ, ದೇವರು ಫಲಿತಾಂಶಗಳನ್ನು ನಿರ್ದೇಶಿಸುತ್ತಾನೆ
      '17':
        title: ದೇವರ ಭಯವು ಜ್ಞಾನವನ್ನು ತರುತ್ತದೆ
      '18':
        title: ಜ್ಞಾನವು ಕೇಳುತ್ತದೆ, ಮೂರ್ಖತನವು ತಿದ್ದುವಿಕೆಯನ್ನು ತಿರಸ್ಕರಿಸುತ್ತದೆ
      '19':
        title: ಯಾವಾಗಲೂ ಸಂಪತ್ತಿಗಿಂತ ಪ್ರಾಮಾಣಿಕತೆಯೇ ಮೇಲು
      '20':
        title: ಕುಡಿತವನ್ನು ತಪ್ಪಿಸಿ, ಪ್ರಾಮಾಣಿಕತೆಯನ್ನು ಅಮೂಲ್ಯವೆಂದು ಪರಿಗಣಿಸಿರಿ
      '21':
        title: ದೇವರು ಹೃದಯಗಳನ್ನು ತೀರ್ಪುಮಾಡಿ ನ್ಯಾಯವನ್ನು ಮೆಚ್ಚುತ್ತಾನೆ
      '22':
        title: ದೀನತೆಯು ದೇವರಿಗೆ ಹೆಚ್ಚಿನ ಗೌರವ ನೀಡುತ್ತದೆ
      '23':
        title: ಅತಿಯಾದ ಆಸೆ ಮತ್ತು ದುರಾಶೆಯ ವಿರುದ್ಧ ಎಚ್ಚರಿಕೆ
      '24':
        title: ದುಷ್ಟರಿಗೆ ಅಸೂಯೆಪಡಬೇಡಿರಿ
      '25':
        title: ದೀನತೆಗೆ ಜ್ಞಾನದ ಕರೆ
      '26':
        title: ಮೂರ್ಖರು ತಮಗೂ ಇತರರಿಗೂ ಹಾನಿಮಾಡುತ್ತಾರೆ
      '27':
        title: ದೀನತೆ ಮತ್ತು ವಾಸ್ತವಪ್ರಜ್ಞೆಯ ಬೋಧನೆ
      '28':
        title: ಯೆಹೋವನನ್ನು ಹುಡುಕುವುದರಿಂದ ನೀತಿವಂತರು ಜಯಿಸುತ್ತಾರೆ
      '29':
        title: ಹಠವು ವಿನಾಶಕ್ಕೆ ನಡೆಸುತ್ತದೆ
      '30':
        title: ಆಳವಾದ ದೀನತೆಯಿಂದ ಮಾತನಾಡುವ ಆಗೂರ
      '31':
        title: ನ್ಯಾಯವನ್ನು ಎತ್ತಿಹಿಡಿಯಲು ಅರಸನಿಗೆ ತಾಯಿಯ ಎಚ್ಚರಿಕೆ
  Ecclesiastes:
    display_name: ಪ್ರಸಂಗಿ
    author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಮಾತನಾಡುವವರು “ಕೊಹೆಲೆತ್,” ಇವರನ್ನು ಸಾಂಪ್ರದಾಯಿಕವಾಗಿ ಸೊಲೊಮೋನನೆಂದು ಗುರುತಿಸಲಾಗಿದೆ.
    audience: ಸೂರ್ಯನ ಕೆಳಗೆ ಜ್ಞಾನ, ಸಂಪತ್ತು ಮತ್ತು ಪರಿಶ್ರಮಕ್ಕಿರುವ ಮಿತಿಗಳನ್ನು ಎದುರಿಸುತ್ತಿದ್ದ ಇಸ್ರಾಯೇಲ್ಯರು.
    date: ಅರಾಮಾಯಿಕ್ ಪ್ರಭಾವವಿರುವ ಹೀಬ್ರೂ ಭಾಷೆಯ ಆಧಾರದ ಮೇಲೆ, ಬಹುಶಃ ಸುಮಾರು ಕ್ರಿ.ಪೂ. 5ನೆಯ–3ನೆಯ ಶತಮಾನಗಳು.
    chapters:
      '1':
        title: ಸೂರ್ಯನ ಕೆಳಗಿನ ಎಲ್ಲವೂ ವ್ಯರ್ಥ
      '2':
        title: ಸುಖಭೋಗವು ಶಾಶ್ವತ ಲಾಭವನ್ನು ತರುವುದಿಲ್ಲ
      '3':
        title: ಪ್ರತಿಯೊಂದು ಉದ್ದೇಶಕ್ಕೂ ಸಮಯ ಬರುತ್ತದೆ
      '4':
        title: ಕ್ರೂರ ದಬ್ಬಾಳಿಕೆಯಿಂದ ತುಂಬಿದ ಜೀವನ
      '5':
        title: ದೇವರನ್ನು ಗೌರವಿಸಿ, ಹರಕೆಗಳನ್ನು ನೆರವೇರಿಸಿರಿ
      '6':
        title: ಅನುಭವಿಸಲಾಗದ ಸಂಪತ್ತು ಕಹಿಯಾಗಿದೆ
      '7':
        title: ಅಹಂಕಾರಕ್ಕಿಂತ ಜ್ಞಾನವೇ ಮೇಲು
      '8':
        title: ದೀನತೆಯಿಂದ ಬದುಕಲು ಜ್ಞಾನವು ಕಲಿಸುತ್ತದೆ
      '9':
        title: ನೀತಿವಂತರಿಗೂ ದುಷ್ಟರಿಗೂ ಒಂದೇ ಗತಿ
      '10':
        title: ಮೂರ್ಖತನವು ಜ್ಞಾನವನ್ನು ಬೇಗ ಹಾಳುಮಾಡುತ್ತದೆ
      '11':
        title: ಸಾಧ್ಯವಿರುವಾಗ ಸಾಹಸಕ್ಕೆ ಕೈಹಾಕಿರಿ
      '12':
        title: ಯೌವನದಲ್ಲಿ ಸೃಷ್ಟಿಕರ್ತನನ್ನು ಸ್ಮರಿಸಿರಿ
  Song of Solomon:
    display_name: ಸೊಲೊಮೋನನ ಪರಮಗೀತೆ
    author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಮೇಲ್ಬರಹವು ಸೊಲೊಮೋನನ ಹೆಸರನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತದೆ.
    audience: ಒಡಂಬಡಿಕೆಯ ಆಪ್ತತೆಯನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವ ದೃಷ್ಟಿಕೋನವಾಗಿ ಕಾಮಪ್ರೇಮವನ್ನು ಓದುತ್ತಿದ್ದ ಇಸ್ರಾಯೇಲ್ಯರು—ಮತ್ತು ನಂತರ ಅದನ್ನು ರೂಪಕವಾಗಿ ಓದಿದ ಯೆಹೂದಿ ಹಾಗೂ ಕ್ರೈಸ್ತ ಓದುಗರು.
    date: ಬಹುಶಃ ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಕಾಲದ್ದು, ಸುಮಾರು ಕ್ರಿ.ಪೂ. 5ನೆಯ–3ನೆಯ ಶತಮಾನಗಳು.
    chapters:
      '1':
        title: ತನ್ನ ಪ್ರಿಯತಮನನ್ನು ಹುಡುಕುವ ಮಹಿಳೆ
      '2':
        title: ಗಾಢ ಮೆಚ್ಚುಗೆಯನ್ನು ಹಂಚಿಕೊಳ್ಳುವ ಪ್ರೇಮಿಗಳು
      '3':
        title: ನಗರದಲ್ಲಿ ತನ್ನ ಪ್ರಿಯತಮನನ್ನು ಕಂಡುಕೊಳ್ಳುವ ಮಹಿಳೆ
      '4':
        title: ವಧುವಿನ ದೈಹಿಕ ಸೌಂದರ್ಯವನ್ನು ಹೊಗಳುವ ಪುರುಷ
      '5':
        title: ಕಾಣೆಯಾದ ಪ್ರಿಯತಮನನ್ನು ಹುಡುಕುವ ಮಹಿಳೆ
      '6':
        title: ಅನನ್ಯ ನಿಷ್ಠೆ ಮತ್ತು ಪ್ರೀತಿಯನ್ನು ಸಂಭ್ರಮಿಸುವ ಪುರುಷ
      '7':
        title: ಮಹಿಳೆಯ ಸೌಂದರ್ಯವನ್ನು ಹೊಗಳುವ ಪ್ರಿಯತಮ
      '8':
        title: ಬಹಿರಂಗವಾಗಿ ಪ್ರೀತಿ ತೋರಿಸಬೇಕೆಂದು ಹಂಬಲಿಸುವ ಮಹಿಳೆ
  Isaiah:
    display_name: ಯೆಶಾಯ
    author: ಅನೇಕ ಶತಮಾನಗಳ ಅವಧಿಯಲ್ಲಿ ಹಲವು ಲೇಖಕರು; 1–39ನೇ ಅಧ್ಯಾಯಗಳು ಕ್ರಿ.ಪೂ. 8ನೇ ಶತಮಾನದ ಯೆರೂಸಲೇಮಿನ ಯೆಶಾಯನಲ್ಲಿ ಬೇರೂರಿವೆ; 40–55ನೇ ಅಧ್ಯಾಯಗಳು ("ಎರಡನೆಯ ಯೆಶಾಯ") ಮತ್ತು 56–66ನೇ ಅಧ್ಯಾಯಗಳು ("ಮೂರನೆಯ ಯೆಶಾಯ") ದೇಶಭ್ರಷ್ಟತೆ ಮತ್ತು ಹಿಂದಿರುಗುವಿಕೆಗೆ ಪ್ರತಿಕ್ರಿಯಿಸುತ್ತವೆ.
    audience: ಅಸ್ಸೀರ್ಯದ ಬೆದರಿಕೆಯಲ್ಲಿದ್ದ ಯೆಹೂದ, ಬಾಬಿಲೋನಿನ ದೇಶಭ್ರಷ್ಟತೆಯಲ್ಲಿದ್ದವರು, ಮತ್ತು ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಪುನಃಸ್ಥಾಪನೆಯ ಕಾಲದವರು — ಅನುಕ್ರಮವಾಗಿ.
    date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 8ನೇ ಶತಮಾನದ ಕೊನೆಯಿಂದ 5ನೇ ಶತಮಾನದವರೆಗೆ ರಚಿಸಲಾಯಿತು.
    chapters:
      '1':
        title: ದೇವರು ಬಂಡಾಯವೆದ್ದ ಯೆಹೂದವನ್ನು ತಿರಸ್ಕರಿಸುತ್ತಾನೆ
      '2':
        title: ಕರ್ತನ ಆಲಯವು ಎಲ್ಲಕ್ಕಿಂತ ಎತ್ತರಕ್ಕೇರಿಸಲ್ಪಡುತ್ತದೆ
      '3':
        title: ತೀರ್ಪು ರಾಷ್ಟ್ರದ ಪತನಕ್ಕೆ ಕಾರಣವಾಗುತ್ತದೆ
      '4':
        title: ನಾಶದ ನಂತರ ಪುನಃಸ್ಥಾಪನೆಯ ವಾಗ್ದಾನ
      '5':
        title: ಕರ್ತನ ದ್ರಾಕ್ಷಿತೋಟವು ಹಿಂಸೆಯನ್ನು ಫಲಿಸುತ್ತದೆ
      '6':
        title: ಯೆಶಾಯನು ದೇವರ ಅಗಾಧ ಮಹಿಮೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '7':
        title: ಅಸ್ಸೀರ್ಯ ಬರುವ ಮುನ್ನ ಇಮ್ಮಾನುವೇಲನು ಹುಟ್ಟುತ್ತಾನೆ
      '8':
        title: ಮಹೇರ್-ಶಾಲಾಲ್-ಹಾಷ್-ಬಜ್ ಎಂಬ ಹೆಸರು ತೀರ್ಪನ್ನು ಸೂಚಿಸುತ್ತದೆ
      '9':
        title: ಯೆಶಾಯನಲ್ಲಿ ಬೆಳಕು ನಿರೀಕ್ಷೆಯನ್ನು ತರುತ್ತದೆ
      '10':
        title: ದೇವರು ಗರ್ವಿಷ್ಠ ಅಸ್ಸೀರ್ಯಕ್ಕೆ ತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '11':
        title: ಹೊಸ ಅರಸನು ಭೂಮಿಗೆ ಶಾಂತಿ ತರುತ್ತಾನೆ
      '12':
        title: ದೇವರ ಜನರು ತಮ್ಮ ರಕ್ಷಣೆಗಾಗಿ ಸ್ತುತಿಸುತ್ತಾರೆ
      '13':
        title: ಬಾಬಿಲೋನಿಗೆ ಸಂಪೂರ್ಣ ನಾಶ ಎದುರಾಗುತ್ತದೆ
      '14':
        title: ಇಸ್ರಾಯೇಲ್ ಪತನಗೊಂಡ ಬಾಬಿಲೋನಿನ ಅರಸನನ್ನು ಹಾಸ್ಯಮಾಡುತ್ತದೆ
      '15':
        title: ಮೋವಾಬಿಗೆ ಹಠಾತ್ ಗಂಭೀರ ವಿಪತ್ತು
      '16':
        title: ಮೋವಾಬಿನ ಗರ್ವವು ಕಠಿಣ ತೀರ್ಪಿಗೆ ಕಾರಣವಾಗುತ್ತದೆ
      '17':
        title: ದಮಸ್ಕ ಮತ್ತು ಎಫ್ರಾಯೀಮ್ ಬರಿದಾಗುತ್ತವೆ
      '18':
        title: ದೂರದ ದೇಶವು ದೂರಕ್ಕೆ ದೂತರನ್ನು ಕಳುಹಿಸುತ್ತದೆ
      '19':
        title: ಈಜಿಪ್ಟ್ ಅವಮಾನಗೊಂಡು ನಂತರ ಗುಣಮುಖವಾಗುತ್ತದೆ
      '20':
        title: ಯೆಶಾಯನು ಗುರುತಾಗಿ ಬಟ್ಟೆಯಿಲ್ಲದೆ ನಡೆಯುತ್ತಾನೆ
      '21':
        title: ಬಾಬಿಲೋನ್ ಹಠಾತ್ತನೆ ಬೀಳುತ್ತದೆ; ಔತಣ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ
      '22':
        title: ಯೆರೂಸಲೇಮಿನ ಗದ್ದಲವು ತೀರ್ಪಿಗೆ ಕಾರಣವಾಗುತ್ತದೆ
      '23':
        title: ತೂರಿನ ಸಂಪತ್ತು ಮತ್ತು ಅಧಿಕಾರ ಕುಸಿಯುತ್ತವೆ
      '24':
        title: ಭೂಮಿಗೆ ವ್ಯಾಪಕವಾದ ಸಂಪೂರ್ಣ ತೀರ್ಪು ಎದುರಾಗುತ್ತದೆ
      '25':
        title: ಕರ್ತನು ಔತಣ ಏರ್ಪಡಿಸಿ ಮರಣವನ್ನು ತೆಗೆದುಹಾಕುತ್ತಾನೆ
      '26':
        title: ದೇವರು ತನ್ನ ಜನರನ್ನು ಸುರಕ್ಷಿತವಾಗಿರಿಸುತ್ತಾನೆ
      '27':
        title: ಲಿವ್ಯಾತಾನ್ ಸೋಲುತ್ತದೆ; ಇಸ್ರಾಯೇಲ್ ಕಾಪಾಡಲ್ಪಡುತ್ತದೆ
      '28':
        title: ಗರ್ವಿಷ್ಠ ನಾಯಕರು ದೇವರ ವಾಕ್ಯವನ್ನು ಹಾಸ್ಯಮಾಡುತ್ತಾರೆ
      '29':
        title: ಮುತ್ತಿಗೆಯಡಿ ಯೆರೂಸಲೇಮ್ ತಗ್ಗಿಸಲ್ಪಡುತ್ತದೆ
      '30':
        title: ಈಜಿಪ್ಟನ್ನು ನಂಬಿದ ಯೆಹೂದಕ್ಕೆ ನಾಶ ಎದುರಾಗುತ್ತದೆ
      '31':
        title: ದೇವರೊಬ್ಬನೇ ಚೀಯೋನಿಗಾಗಿ ಹೋರಾಡುತ್ತಾನೆ
      '32':
        title: ನೀತಿವಂತ ಅರಸನು ನ್ಯಾಯವನ್ನು ತರುತ್ತಾನೆ
      '33':
        title: ಹಿಂಸೆಯು ದುಷ್ಟರ ಮೇಲೆಯೇ ಹಿಂದಿರುಗುತ್ತದೆ
      '34':
        title: ಕರ್ತನು ಎದೋಮಿಗೆ ಕಠಿಣ ತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '35':
        title: ಅರಣ್ಯವು ಮಹಿಮೆಯಿಂದ ಅರಳುತ್ತದೆ
      '36':
        title: ರಬ್ಷಾಕೆಯು ಯೆಹೂದದ ಭರವಸೆಯನ್ನು ಹಾಸ್ಯಮಾಡುತ್ತಾನೆ
      '37':
        title: ಹಿಜ್ಕೀಯನು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ; ದೇವರು ಉತ್ತರಿಸುತ್ತಾನೆ
      '38':
        title: ಹಿಜ್ಕೀಯನ ಅನಾರೋಗ್ಯ ಮತ್ತು ಗುಣಮುಖತೆ
      '39':
        title: ಬಾಬಿಲೋನ್ ಹಿಜ್ಕೀಯನ ಖಜಾನೆಗಳನ್ನು ನೋಡುತ್ತದೆ
      '40':
        title: ದೇವರ ಜನರಿಗೆ ಸಾಂತ್ವನ ಬರುತ್ತದೆ
      '41':
        title: ಕರ್ತನೊಬ್ಬನೇ ಇತಿಹಾಸವನ್ನು ಆಳುತ್ತಾನೆ
      '42':
        title: ಸೇವಕನು ಸೌಮ್ಯವಾಗಿ ನ್ಯಾಯವನ್ನು ತರುತ್ತಾನೆ
      '43':
        title: ಇಸ್ರಾಯೇಲಿನೊಂದಿಗೆ ಸದಾ ಇರುವುದಾಗಿ ದೇವರು ವಾಗ್ದಾನ ಮಾಡುತ್ತಾನೆ
      '44':
        title: ಕರ್ತನೊಬ್ಬನೇ ಸತ್ಯ ದೇವರು
      '45':
        title: ಇಸ್ರಾಯೇಲನ್ನು ಬಿಡುಗಡೆಮಾಡಲು ಕೋರೆಷನು ಆರಿಸಲ್ಪಡುತ್ತಾನೆ
      '46':
        title: ಕರ್ತನು ಇಸ್ರಾಯೇಲನ್ನು ಜೀವನದುದ್ದಕ್ಕೂ ಹೊರುತ್ತಾನೆ
      '47':
        title: ಪ್ರತೀಕಾರದಿಂದ ಬಾಬಿಲೋನ್ ಕುಸಿಯುತ್ತದೆ
      '48':
        title: ಇಸ್ರಾಯೇಲಿನ ಹಠಮಾರಿತನವನ್ನು ಎದುರಿಸಲಾಗುತ್ತದೆ
      '49':
        title: ಸೇವಕನ ಕಾರ್ಯವು ಇನ್ನೂ ಬಹು ವಿಶಾಲವಾಗಿದೆ
      '50':
        title: ಸೇವಕನು ಸಂಕಟದಲ್ಲಿಯೂ ಭರವಸೆಯಿಡುತ್ತಾನೆ
      '51':
        title: ಅಬ್ರಹಾಮನ ನಂಬಿಗಸ್ತಿಕೆಯನ್ನು ನೆನಪಿಸಿಕೊಳ್ಳಿರಿ
      '52':
        title: ಯೆರೂಸಲೇಮ್ ಸೆರೆಯಿಂದ ಎಚ್ಚರಗೊಳ್ಳುತ್ತದೆ
      '53':
        title: ಸಂಕಟಪಡುವ ಸೇವಕನು ಪಾಪವನ್ನು ಹೊರುತ್ತಾನೆ
      '54':
        title: ದೇವರು ತಾನು ತ್ಯಜಿಸಿದ ವಧುವನ್ನು ಪುನಃಸ್ಥಾಪಿಸುತ್ತಾನೆ
      '55':
        title: ಬನ್ನಿರಿ, ಜೀವವನ್ನು ಉಚಿತವಾಗಿ ಪಡೆಯಿರಿ
      '56':
        title: ನಂಬಿಗಸ್ತ ವಿದೇಶಿ ಆರಾಧಕರನ್ನು ದೇವರು ಸ್ವಾಗತಿಸುತ್ತಾನೆ
      '57':
        title: ನೀತಿಯಿಂದ ಜೀವಿಸಿರಿ; ರಕ್ಷಣೆ ಸಮೀಪಿಸಿದೆ
      '58':
        title: ದೇವರ ಜನರು ಪುನಃಸ್ಥಾಪಿಸಲ್ಪಡುವರು
      '59':
        title: ನ್ಯಾಯ ಮತ್ತು ಕರುಣೆಯನ್ನು ನಿಜವಾಗಿ ಅರಸಿರಿ
      '60':
        title: ವಿಮೋಚಕನು ಚೀಯೋನಿನ ನೆರವಿಗೆ ಬರುತ್ತಾನೆ
      '61':
        title: ಗುಣಪಡಿಸಲು ದೇವರು ಸೇವಕನನ್ನು ಅಭಿಷೇಕಿಸುತ್ತಾನೆ
      '62':
        title: ಚೀಯೋನನ್ನು ಗೌರವಿಸುವುದಾಗಿ ಕರ್ತನು ಆಣೆಯಿಡುತ್ತಾನೆ
      '63':
        title: ಯೋಧನಾದ ದೇವರು ಕೋಪದಿಂದ ಹಿಂದಿರುಗುತ್ತಾನೆ
      '64':
        title: ಪರಿಶುದ್ಧ ದೇವರು ಹಿಂದಿರುಗಬೇಕೆಂಬ ಪ್ರಾರ್ಥನೆ
      '65':
        title: ನಂಬಿಗಸ್ತ ಉಳಿದ ಜನರಿಗಾಗಿ ಹೊಸ ಆಕಾಶಗಳು
      '66':
        title: ಕರ್ತನು ಚೀಯೋನಿಗೆ ತೀರ್ಪು ನೀಡಿ ಪುನಃಸ್ಥಾಪಿಸುತ್ತಾನೆ
  Jeremiah:
    display_name: ಯೆರೆಮೀಯ
    author: ಅನಾತೋತಿನ ಯೆರೆಮೀಯ; ಅವನ ಲಿಪಿಕಾರನಾದ ಬಾರೂಕನು ಮತ್ತು ನಂತರದ ಸಂಪಾದಕರು ಗಣನೀಯವಾಗಿ ಸಂಪಾದಿಸಿದ್ದಾರೆ.
    audience: ಬಾಬಿಲೋನಿನ ಆಕ್ರಮಣಕ್ಕೆ ಮುನ್ನ, ಅದರ ಸಮಯದಲ್ಲಿ ಮತ್ತು ಅದರ ನಂತರದ ಯೆಹೂದದ ಜನರು.
    date: ಕ್ರಿ.ಪೂ. 7ನೇ ಶತಮಾನದ ಕೊನೆಯಿಂದ 6ನೇ ಶತಮಾನದ ಆರಂಭದವರೆಗೆ.
    chapters:
      '1':
        title: ದೇವರು ಯೆರೆಮೀಯನನ್ನು ಪ್ರವಾದಿಯಾಗಿ ನೇಮಿಸುತ್ತಾನೆ
      '2':
        title: ಯೆರೂಸಲೇಮ್ ಜೀವಜಲವನ್ನು ತೊರೆಯುತ್ತದೆ
      '3':
        title: ಇಸ್ರಾಯೇಲ್ ನಂಬಿಗಸ್ತ ದೇವರ ಬಳಿಗೆ ಹಿಂದಿರುಗುತ್ತದೆ
      '4':
        title: ಯೆಹೂದಕ್ಕೆ ಬರಲಿರುವ ತೀರ್ಪು ಎದುರಾಗುತ್ತದೆ
      '5':
        title: ಯೆರೂಸಲೇಮ್ ಭ್ರಷ್ಟತೆಯಿಂದ ತುಂಬಿದೆ
      '6':
        title: ಉತ್ತರದಿಂದ ಸೇನೆಯು ಬರಲಿದೆ
      '7':
        title: ಯೆರೆಮೀಯನು ದೇವಾಲಯದಲ್ಲಿ ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '8':
        title: ಯೆಹೂದದ ತೀರ್ಪು ಪೂರ್ಣಗೊಂಡಿದೆ
      '9':
        title: ಜನರು ದ್ರೋಹದಿಂದ ತುಂಬಿದ್ದಾರೆ
      '10':
        title: ವಿಗ್ರಹಗಳು ಮಾನವ ನಿರ್ಮಿತ ಮತ್ತು ನಿರರ್ಥಕ
      '11':
        title: ಯೆಹೂದವು ಒಡಂಬಡಿಕೆಯನ್ನು ಮುರಿದಿದೆ
      '12':
        title: ದುಷ್ಟರು ಏಕೆ ಏಳಿಗೆ ಹೊಂದುತ್ತಾರೆ?
      '13':
        title: ಗರ್ವದಿಂದ ಯೆಹೂದವು ನಿಷ್ಪ್ರಯೋಜಕವಾಗುತ್ತದೆ
      '14':
        title: ಬರವು ಯೆಹೂದವನ್ನು ಹತಾಶೆಗೆ ತಳ್ಳುತ್ತದೆ
      '15':
        title: ತೀರ್ಪನ್ನು ಈಗ ತಪ್ಪಿಸಲಾಗದು
      '16':
        title: ಯೆಹೂದದ ಮೇಲೆ ಭೀಕರ ತೀರ್ಪು ಬರುತ್ತದೆ
      '17':
        title: ಯೆಹೂದಕ್ಕೆ ದೇವರ ತೀರ್ಪು ಎದುರಾಗುತ್ತದೆ
      '18':
        title: ಯೆರೆಮೀಯನು ಹಠಮಾರಿ ಯೆಹೂದವನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '19':
        title: ನಗರದ ಮೇಲೆ ಭೀಕರ ತೀರ್ಪು ಬರುತ್ತದೆ
      '20':
        title: ಯೆರೆಮೀಯನು ತೀರ್ಪನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '21':
        title: ಅರಸ ಚಿದ್ಕೀಯನು ಸಹಾಯ ಕೇಳುತ್ತಾನೆ
      '22':
        title: ನ್ಯಾಯ ಮತ್ತು ಕರುಣೆಯಿಂದ ಆಳಿರಿ
      '23':
        title: ದೇವರು ಸುಳ್ಳು ಕುರುಬರಿಗೆ ತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '24':
