      '46':
        title: ಗರ್ವಿಷ್ಠ ಈಜಿಪ್ಟ್ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ದೇವರ ತೀರ್ಪು
      '47':
        title: ತಡೆಯಲಾಗದ ಪ್ರವಾಹವನ್ನು ಎದುರಿಸುವ ಫಿಲಿಷ್ಟಿಯರು
      '48':
        title: ಮೋವಾಬಿನ ನಾಶ ಮತ್ತು ಭವಿಷ್ಯದ ನಿರೀಕ್ಷೆ
      '49':
        title: ಯೆಹೂದದ ಸುತ್ತಲಿನ ಜನಾಂಗಗಳಿಗೆ ತೀರ್ಪು
      '50':
