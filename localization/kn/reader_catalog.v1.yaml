      '31':
        title: ಅಬ್ರಹಾಮ, ಇಸಾಕ ಮತ್ತು ಯಾಕೋಬರು ನಂಬಿಕೆಯನ್ನು ಅನುಸರಿಸಿದರು
      '32':
