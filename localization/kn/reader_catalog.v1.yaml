    chapters:
      '1':
        title: ಅನ್ವೇಷಕರೊಂದಿಗೆ ಗುಡುಗು ಮಾತನಾಡುತ್ತದೆ
      '2':
        title: ನಾನೇ ಮೊದಲನೆಯವಳು, ಕೊನೆಯವಳು, ಕನ್ಯೆ
      '3':
        title: ಜ್ಞಾನ ಮತ್ತು ಅಜ್ಞಾನ ಒಂದಾಗುತ್ತವೆ
