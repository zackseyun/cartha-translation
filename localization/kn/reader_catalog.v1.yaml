    author: ಅನಾಮಧೇಯ. ‘ಮಹಾ ಅದೃಶ್ಯ ಆತ್ಮನ ಪವಿತ್ರ ಗ್ರಂಥ’ ಎಂದೂ ಕರೆಯಲಾಗುವ ಈ ನಾಗ್ ಹಮ್ಮಾದಿ ಕೃತಿಯು, ಉಲ್ಲೇಖಗಳ ಮೂಲಕ ಮಾತ್ರ ತಿಳಿದಿರುವ ಹಿಂದಿನ ಗ್ರೀಕ್ ‘ಈಜಿಪ್ಟಿನವರ ಸುವಾರ್ತೆ’ಯಿಂದ ಭಿನ್ನವಾಗಿದೆ.
