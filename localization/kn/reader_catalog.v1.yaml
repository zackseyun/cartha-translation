      '2':
        title: ವಿಮೋಚನೆಗಾಗಿ ಇಸ್ರಾಯೇಲರು ಪ್ರಾರ್ಥಿಸುತ್ತಾರೆ
      '3':
        title: ಯೆಹೂದ್ಯರನ್ನು ನಾಶಮಾಡಲು ಅರಸನು ಯೋಜಿಸುತ್ತಾನೆ
      '4':
        title: ಸಾರ್ವಜನಿಕವಾಗಿ ಪ್ರದರ್ಶಿಸಲ್ಪಟ್ಟ ಯೆಹೂದ್ಯರು ಶೋಕಿಸುತ್ತಾರೆ
      '5':
        title: ಮರಣದಂಡನೆಗೆ ಆನೆಗಳನ್ನು ಕರೆತರಲಾಗುತ್ತದೆ
      '6':
        title: ಸ್ವರ್ಗದ ದೂತರು ಯೆಹೂದ್ಯರನ್ನು ರಕ್ಷಿಸುತ್ತಾರೆ
      '7':
        title: ಅರಸನು ಯೆಹೂದ್ಯರನ್ನು ಸುರಕ್ಷಿತವಾಗಿ ಬಿಡುಗಡೆ ಮಾಡುತ್ತಾನೆ
  4 Maccabees:
    display_name: 4 ಮಕ್ಕಬೀಯರು
    author: ಅಜ್ಞಾತ; ಸ್ಟೋಯಿಕ್ ತತ್ತ್ವಶಾಸ್ತ್ರದ ಪ್ರಭಾವ ಹೊಂದಿದ್ದ ಗ್ರೀಕ್‌ಭಾಷಿ ಯೆಹೂದ್ಯ ಲೇಖಕ.
