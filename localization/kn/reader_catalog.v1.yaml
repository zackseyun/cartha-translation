      '2':
        title: ಯೆರೂಸಲೇಮ್ ಸಂತೋಷದಿಂದ ತುಂಬಿ ತುಳುಕುತ್ತದೆ
      '3':
        title: ದೇವರು ಯೆಹೋಶುವನನ್ನು ಶುದ್ಧೀಕರಿಸುತ್ತಾನೆ
      '4':
        title: ಆತ್ಮನ ಬಲದಿಂದ ಜೆರುಬ್ಬಾಬೆಲನು ಕಟ್ಟುತ್ತಾನೆ
      '5':
        title: ದೇಶದಿಂದ ದುಷ್ಟತನದ ನಿವಾರಣೆ
      '6':
        title: ಯಾಜಕ ಯೆಹೋಶುವನಿಗಾಗಿ ಕಿರೀಟಗಳು
      '7':
        title: ನ್ಯಾಯವಿಲ್ಲದ ಉಪವಾಸ ವ್ಯರ್ಥ
      '8':
        title: ಶಾಂತಿಯಲ್ಲಿ ಚೀಯೋನಿನ ಪುನರ್‌ನಿರ್ಮಾಣ
      '9':
        title: ಇಸ್ರಾಯೇಲಿನ ಅರಸನು ದೀನನಾಗಿ ಬರುತ್ತಾನೆ
      '10':
        title: ವಿಗ್ರಹಗಳನ್ನಲ್ಲ, ಮಳೆಯನ್ನು ಬೇಡಿರಿ
      '11':
        title: ಕುರುಬನು ಕುರಿಗಳನ್ನು ತೊರೆಯುತ್ತಾನೆ
      '12':
        title: ಜನಾಂಗಗಳಿಗೆ ಭೀತಿಯಾಗುವ ಯೆರೂಸಲೇಮ್
      '13':
        title: ದೇಶವು ಪಾಪದಿಂದ ಶುದ್ಧವಾಗುತ್ತದೆ
      '14':
