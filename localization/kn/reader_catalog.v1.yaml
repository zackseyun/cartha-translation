      '39':
        title: ಅಣಕಿಸುವವರು ತಮ್ಮನ್ನು ಶುದ್ಧಪಡಿಸಿಕೊಳ್ಳಲಾರರು
      '40':
        title: ಒಡೆಯನ ನಿಯಮಗಳನ್ನು ನೆರವೇರಿಸಿರಿ
      '41':
        title: ನಿಯೋಜಿಸಲಾದ ಸೇವೆಯಲ್ಲಿ ಸೇವೆ ಸಲ್ಲಿಸಿರಿ
      '42':
        title: ಅಪೊಸ್ತಲರು ನಾಯಕರನ್ನು ಕ್ರಮಬದ್ಧವಾಗಿ ನೇಮಿಸಿದರು
      '43':
        title: ಮೋಶೆಯು ದೇವರ ನಿರ್ದೇಶನದಂತೆ ಯಾಜಕರನ್ನು ಆರಿಸಿದನು
      '44':
        title: ಅಂಗೀಕೃತ ಹಿರಿಯರನ್ನು ತೆಗೆದುಹಾಕಬೇಡಿ
      '45':
        title: ದೇವರನ್ನು ಗೌರವಿಸಿದ್ದಕ್ಕಾಗಿ ನೀತಿವಂತರು ಸಂಕಟಪಟ್ಟರು
      '46':
        title: ಪವಿತ್ರ ಮಾದರಿಗಳನ್ನು ಒಟ್ಟಾಗಿ ಬಿಗಿಯಾಗಿ ಹಿಡಿಯಿರಿ
      '47':
        title: ಪೌಲನು ನಿಮಗೆ ಬರೆದ ಪತ್ರವನ್ನು ನೆನಪಿಸಿಕೊಳ್ಳಿರಿ
      '48':
        title: ಶುದ್ಧರಾಗಿ ನೀತಿಯ ದ್ವಾರವನ್ನು ಪ್ರವೇಶಿಸಿರಿ
      '49':
        title: ಪ್ರೀತಿ ನಮ್ಮನ್ನು ದೇವರೊಂದಿಗೆ ಒಂದುಗೂಡಿಸುತ್ತದೆ
      '50':
        title: ಪ್ರೀತಿ ದೇವರು ಆರಿಸಿಕೊಂಡವರನ್ನು ಪರಿಪೂರ್ಣಗೊಳಿಸುತ್ತದೆ
      '51':
        title: ನಮ್ಮ ಪಾಪಗಳನ್ನೂ ತಪ್ಪುಗಳನ್ನೂ ಒಪ್ಪಿಕೊಳ್ಳೋಣ
      '52':
        title: ದೇವರಿಗೆ ಸ್ತುತಿಯ ಯಜ್ಞವನ್ನು ಅರ್ಪಿಸಿರಿ
      '53':
        title: ಮೋಶೆ ಇಸ್ರಾಯೇಲಿಗಾಗಿ ಧೈರ್ಯದಿಂದ ಮಧ್ಯಸ್ಥಿಕೆ ವಹಿಸಿದನು
      '54':
        title: ಶಾಂತಿಪ್ರಿಯ ನಾಯಕರು ಹಿಂಡನ್ನು ಗೌರವಿಸುತ್ತಾರೆ
      '55':
        title: ಸ್ತ್ರೀಯರು ಧೈರ್ಯದ ಕಾರ್ಯಗಳನ್ನು ಮಾಡಿದರು
      '56':
        title: ದಾರಿತಪ್ಪಿದವರು ವಿಧೇಯರಾಗುವಂತೆ ಪ್ರಾರ್ಥಿಸಿರಿ
      '57':
        title: ದೀನತೆಯೇ ಜ್ಞಾನವೆಂದು ಜ್ಞಾನವು ಸಾರುತ್ತದೆ
      '58':
        title: ದೇವರನ್ನು ನಂಬಿ ಎಂದೆಂದಿಗೂ ಸುರಕ್ಷಿತರಾಗಿರಿ
      '59':
        title: ದೇವರು ಆರಿಸಿಕೊಂಡವರನ್ನು ಕಾಪಾಡಲೆಂದು ಪ್ರಾರ್ಥಿಸಿರಿ
      '60':
        title: ಪಾಪಗಳನ್ನು ಕ್ಷಮಿಸಿ, ಹೆಜ್ಜೆಗಳನ್ನು ನಡೆಸು
      '61':
        title: ದೇವರು ಆಳುವವರನ್ನು ಜ್ಞಾನದಿಂದ ನಡೆಸುತ್ತಾನೆ
      '62':
        title: ಸದ್ಗುಣದ ಜೀವನವನ್ನು ನಂಬಿಕೆ ಕಲಿಸುತ್ತದೆ
      '63':
        title: ದೀನತೆ ಶಾಂತಿಯನ್ನೂ ಆನಂದವನ್ನೂ ತರುತ್ತದೆ
      '64':
        title: ಎಲ್ಲರಿಗೂ ನಂಬಿಕೆಯನ್ನೂ ಸಹನೆಯನ್ನೂ ದಯಪಾಲಿಸು
      '65':
        title: ಪ್ರತಿನಿಧಿಗಳನ್ನು ಶುಭಸುದ್ದಿಯೊಂದಿಗೆ ಹಿಂದಿರುಗಿಸಿರಿ
  1 Enoch:
    display_name: 1 ಎನೋಕ್
    author: ಅನಾಮಧೇಯ; ಜಲಪ್ರಳಯಕ್ಕೆ ಮುಂಚಿನ ಮೂಲಪಿತೃ ಎನೋಕ್‌ಗೆ ಛದ್ಮನಾಮದ ಮೂಲಕ ಆರೋಪಿತವಾಗಿದೆ. ಇದು ಹಲವು ಪ್ರತ್ಯೇಕ ವಿಭಾಗಗಳಿಂದ ಒಟ್ಟುಗೂಡಿಸಲಾದ ಸಂಯುಕ್ತ ಕೃತಿ.
    audience: ವಿಶ್ವವ್ಯಾಪಿ ದುಷ್ಟತನ, ನ್ಯಾಯತೀರ್ಪು ಮತ್ತು ಪಂಚಾಂಗದ ಕುರಿತು ಚಿಂತಿಸುತ್ತಿದ್ದ ಯೆಹೂದಿ ಪ್ರಳಯದರ್ಶನ ಸಮುದಾಯಗಳು; ನಂತರ ಆರಂಭಿಕ ಕ್ರೈಸ್ತ ವಲಯಗಳಲ್ಲಿಯೂ ಓದಲಾಯಿತು.
    date: ವಿಭಾಗಗಳು ಅಂದಾಜು ಕ್ರಿ.ಪೂ. 3ನೇ ಶತಮಾನದಿಂದ ಕ್ರಿ.ಶ. 1ನೇ ಶತಮಾನದವರೆಗೆ ಸಂಕಲಿಸಲ್ಪಟ್ಟವು; ಸಂಪೂರ್ಣ ಪಾಠವು ಗೀಝ್ (ಇಥಿಯೋಪಿಕ್) ಭಾಷೆಯಲ್ಲಿ ಮಾತ್ರ ಉಳಿದಿದೆ.
    chapters:
      '1':
        title: ದೇವರು ನೀತಿವಂತರಿಗೂ ದುಷ್ಟರಿಗೂ ತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '2':
        title: ಆಕಾಶವೂ ಭೂಮಿಯೂ ಸಾಕ್ಷಿ ಹೇಳುತ್ತವೆ
      '3':
        title: ಹದಿನಾಲ್ಕು ಮರಗಳು ಚಳಿಗಾಲವನ್ನು ತಾಳಿಕೊಳ್ಳುತ್ತವೆ
      '4':
        title: ಬೇಸಿಗೆಯ ಸೂರ್ಯ ಕ್ರಮಬದ್ಧ ಶಕ್ತಿಯನ್ನು ತೋರಿಸುತ್ತದೆ
      '5':
        title: ಸೃಷ್ಟಿ ದೇವರ ಆಳ್ವಿಕೆಗೆ ನಿಷ್ಠವಾಗಿದೆ
      '6':
        title: ಕಾವಲುಗಾರರು ಮಾನವ ಸ್ತ್ರೀಯರಿಗಾಗಿ ಇಳಿದುಬರುತ್ತಾರೆ
      '7':
        title: ದೈತ್ಯ ಸಂತಾನವು ಭೂಮಿಯನ್ನು ಧ್ವಂಸಮಾಡುತ್ತದೆ
      '8':
        title: ಕಾವಲುಗಾರರು ನಿಷಿದ್ಧ ಜ್ಞಾನವನ್ನು ಕಲಿಸುತ್ತಾರೆ
      '9':
        title: ದೂತರು ಭೂಮಿಯ ಅನ್ಯಾಯವನ್ನು ವರದಿ ಮಾಡುತ್ತಾರೆ
      '10':
        title: ಪತಿತರಾದ ಕಾವಲುಗಾರರಿಗೆ ನ್ಯಾಯತೀರ್ಪು ಬರುತ್ತದೆ
      '11':
        title: ದೇವರು ಸಮೃದ್ಧ ಆಶೀರ್ವಾದಗಳನ್ನು ವಾಗ್ದಾನ ಮಾಡುತ್ತಾನೆ
      '12':
        title: ಎನೋಕ್ ಪತಿತರಾದ ಕಾವಲುಗಾರರನ್ನು ಎದುರಿಸುತ್ತಾನೆ
      '13':
        title: ಎನೋಕ್ ಕಾವಲುಗಾರರಿಗೆ ಕರುಣೆ ದೊರೆಯುವುದಿಲ್ಲವೆಂದು ಹೇಳುತ್ತಾನೆ
      '14':
        title: ಎನೋಕ್ ಪ್ರಕಟವಾದ ಸ್ವರ್ಗೀಯ ಮಹಿಮೆಯನ್ನು ನೋಡುತ್ತಾನೆ
      '15':
        title: ದೇವರು ಕಾವಲುಗಾರರ ನ್ಯಾಯತೀರ್ಪನ್ನು ವಿವರಿಸುತ್ತಾನೆ
      '16':
        title: ದೇಹವಿಲ್ಲದ ಆತ್ಮಗಳು ಭೂಮಿಯಲ್ಲಿ ಅಲೆದಾಡುತ್ತವೆ
      '17':
        title: ಎನೋಕ್ ಭಯಾನಕ ಪರಲೋಕ ಪ್ರದೇಶಗಳನ್ನು ಸುತ್ತಿ ನೋಡುತ್ತಾನೆ
      '18':
        title: ಸೃಷ್ಟಿಯ ಶಕ್ತಿಗಳ ಉಗ್ರಾಣಗಳು ತೋರಿಸಲ್ಪಡುತ್ತವೆ
      '19':
        title: ದೂತರು ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪನ್ನು ಎದುರಿಸುವರು
      '20':
        title: ಪವಿತ್ರ ಕಾವಲುಗಾರ ದೂತರೂ ಅವರ ಕ್ಷೇತ್ರಗಳೂ
      '21':
        title: ಏಳು ನಕ್ಷತ್ರಗಳು ಅಗಾಧದಲ್ಲಿ ಸಂಕೋಲೆಗಳಿಂದ ಬಂಧಿತವಾಗಿವೆ
      '22':
        title: ಎನೋಕ್ ಆತ್ಮಗಳ ಗುಹೆಗಳನ್ನು ನೋಡುತ್ತಾನೆ
      '23':
        title: ಎನೋಕ್ ನಂದದ ಅಗ್ನಿಯನ್ನು ನೋಡುತ್ತಾನೆ
      '24':
        title: ಭವ್ಯವಾದ ಏಳು ಪರ್ವತಗಳು ಮಿನುಗುತ್ತವೆ
      '25':
        title: ನ್ಯಾಯತೀರ್ಪಿನವರೆಗೆ ಸುಗಂಧವೃಕ್ಷವು ನಿಷಿದ್ಧವಾಗಿದೆ
      '26':
        title: ಎನೋಕ್ ಪವಿತ್ರ ಹೃದಯಭಾಗವನ್ನು ನೋಡುತ್ತಾನೆ
      '27':
        title: ದೇವದೂಷಕರಿಗಾಗಿ ಶಾಪಗ್ರಸ್ತ ಕಣಿವೆ ಪ್ರಕಟವಾಗುತ್ತದೆ
      '28':
        title: ಚಿಮ್ಮುವ ನೀರುಳ್ಳ ಪೂರ್ವದ ಪರ್ವತಗಳು
      '29':
        title: ಎನೋಕ್ ನ್ಯಾಯತೀರ್ಪಿನ ಮರಗಳನ್ನು ನೋಡುತ್ತಾನೆ
      '30':
        title: ಬತ್ತದ ನೀರುಗಳಿಂದ ತುಂಬಿದ ಕಣಿವೆ
      '31':
        title: ಪರ್ವತಗಳಲ್ಲಿ ಪವಿತ್ರ ಸುಗಂಧಗಳು ಅರಳುತ್ತವೆ
      '32':
        title: ನೀತಿಯ ತೋಟ ಪ್ರಕಟವಾಗುತ್ತದೆ
      '33':
        title: ಸ್ವರ್ಗೀಯ ದ್ವಾರಗಳಲ್ಲಿ ನಕ್ಷತ್ರಗಳಿಗೆ ಹೆಸರು ನೀಡಲಾಗಿದೆ
      '34':
        title: ಆಕಾಶದ ಹವಾಮಾನ ಯಂತ್ರವ್ಯವಸ್ಥೆ ಅನಾವರಣಗೊಳ್ಳುತ್ತದೆ
      '35':
        title: ಪಶ್ಚಿಮದ ದ್ವಾರಗಳು ಪೂರ್ವದ ದ್ವಾರಗಳಿಗೆ ಸರಿಹೊಂದುತ್ತವೆ
      '36':
        title: ಎನೋಕ್ ಸ್ವರ್ಗೀಯ ದ್ವಾರಗಳನ್ನು ನೋಡುತ್ತಾನೆ
      '37':
        title: ಎನೋಕ್ ಜ್ಞಾನದ ಪ್ರಕಟಣೆಯನ್ನು ಸಾರುತ್ತಾನೆ
      '38':
        title: ನೀತಿವಂತರು ಸೇರುತ್ತಾರೆ, ಪಾಪಿಗಳಿಗೆ ತೀರ್ಪಾಗುತ್ತದೆ
      '39':
        title: ಆರಿಸಲ್ಪಟ್ಟ ಮಕ್ಕಳು ಆಕಾಶದಿಂದ ಇಳಿದುಬರುತ್ತಾರೆ
      '40':
        title: ಎನೋಕ್ ಸ್ವರ್ಗೀಯ ಸೈನ್ಯವನ್ನು ನೋಡುತ್ತಾನೆ
      '41':
        title: ಆಕಾಶದ ಭಂಡಾರಗಳೂ ಗುಪ್ತ ನಿಯಮಗಳೂ
      '42':
        title: ಜ್ಞಾನವು ನೆಲೆಯನ್ನು ವ್ಯರ್ಥವಾಗಿ ಹುಡುಕುತ್ತದೆ
      '43':
        title: ಎನೋಕ್ ಸ್ವರ್ಗೀಯ ದೃಷ್ಟಾಂತವನ್ನು ನೋಡುತ್ತಾನೆ
      '44':
        title: ಮಿಂಚಿನ ನಕ್ಷತ್ರಗಳು ಶಕ್ತಿಯಿಂದ ಬಂಧಿತವಾಗಿವೆ
      '45':
        title: ನಿರಾಕರಿಸುವವರ ನ್ಯಾಯತೀರ್ಪಿನ ಕುರಿತ ಎರಡನೇ ದೃಷ್ಟಾಂತ
      '46':
        title: ಎನೋಕ್ ಮನುಷ್ಯಕುಮಾರನನ್ನು ನೋಡುತ್ತಾನೆ
      '47':
        title: ನೀತಿವಂತರ ರಕ್ತಕ್ಕೆ ಸ್ವರ್ಗದಲ್ಲಿ ಉತ್ತರ ದೊರೆಯುತ್ತದೆ
      '48':
        title: ನೀತಿಯ ಬುಗ್ಗೆ ಸುತ್ತುವರಿಯುತ್ತದೆ
      '49':
        title: ಆರಿಸಲ್ಪಟ್ಟವನು ಗುಪ್ತವಾದವುಗಳಿಗೆ ತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '50':
        title: ಪವಿತ್ರರು ಜಯಿಸುತ್ತಾರೆ, ಪಾಪಿಗಳು ಶೀಘ್ರವೇ ನಾಶವಾಗುತ್ತಾರೆ
      '51':
        title: ಆರಿಸಲ್ಪಟ್ಟವನು ಗುಪ್ತ ಜ್ಞಾನವನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '52':
        title: ಎನೋಕ್ ಲೋಹದ ಪರ್ವತಗಳನ್ನು ನೋಡುತ್ತಾನೆ
      '53':
        title: ಪಾಪಿಗಳ ಕಾಣಿಕೆಗಳಿಂದ ತುಂಬಿದ ಕಣಿವೆ
      '54':
        title: ರಾಜರನ್ನು ಉರಿಯುವ ಕಣಿವೆಗೆ ಎಸೆಯಲಾಗುತ್ತದೆ
      '55':
        title: ಪುರಾತನನು ‘ಇನ್ನು ಎಂದಿಗೂ ಇಲ್ಲ’ ಎಂದು ಪ್ರಮಾಣ ಮಾಡುತ್ತಾನೆ
      '56':
        title: ದಂಡಿಸುವ ದೂತರು ಅಜಾಜೇಲನ ಸೈನ್ಯವನ್ನು ಬಂಧಿಸುತ್ತಾರೆ
      '57':
        title: ವಿಶ್ವವ್ಯಾಪಿ ಕೋಲಾಹಲ ಮತ್ತು ಪವಿತ್ರ ಆರಾಧನೆ
      '58':
        title: ಎನೋಕ್ ನೀತಿವಂತರನ್ನು ಆಶೀರ್ವದಿಸುತ್ತಾನೆ
      '59':
        title: ಎನೋಕ್ ಗುಡುಗಿನ ರಹಸ್ಯಗಳನ್ನು ನೋಡುತ್ತಾನೆ
      '60':
        title: ಅತ್ಯುನ್ನತ ಆಕಾಶ ಕಂಪಿಸುತ್ತದೆ, ಕರುಣೆ ಉಳಿಯುತ್ತದೆ
      '61':
        title: ದೂತರು ನೀತಿವಂತರಿಗಾಗಿ ಅಳೆಯುತ್ತಾರೆ
      '62':
        title: ಸಿಂಹಾಸನಾರೂಢ ಮನುಷ್ಯಕುಮಾರನು ತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '63':
        title: ರಾಜರು ಕರ್ತನ ಕ್ಷಮೆಯನ್ನು ಬೇಡುತ್ತಾರೆ
      '64':
        title: ಎನೋಕ್ ಮರೆಯಾಗಿರುವ ಪಾಪಿಗಳನ್ನು ನೋಡುತ್ತಾನೆ
      '65':
        title: ನೋಹನು ಭೂಮಿಗಾಗಿ ಅಳುತ್ತಾನೆ
      '66':
        title: ದೂತರು ಆಜ್ಞೆಯಂತೆ ಪ್ರಳಯದ ನೀರನ್ನು ತಡೆಹಿಡಿಯುತ್ತಾರೆ
      '67':
        title: ನೋಹನು ದೇವರ ವಾಗ್ದಾನವನ್ನು ಕೇಳುತ್ತಾನೆ
      '68':
        title: ಎನೋಕ್‌ಗೆ ಗುಪ್ತ ಸಂಗತಿಗಳು ಪ್ರಕಟವಾಗುತ್ತವೆ
      '69':
        title: ಪತಿತರಾದ ದೂತರ ಹೆಸರುಗಳು ಹೇಳಲ್ಪಟ್ಟು ಅವರಿಗೆ ತೀರ್ಪಾಗುತ್ತದೆ
      '70':
        title: ಎನೋಕ್ ಸ್ವರ್ಗೀಯ ನ್ಯಾಯಸಭೆಗೆ ವರ್ಗಾಯಿಸಲ್ಪಡುತ್ತಾನೆ
      '71':
        title: ಎನೋಕ್ ಸ್ವರ್ಗೀಯ ರಹಸ್ಯಗಳನ್ನು ನೋಡುತ್ತಾನೆ
      '72':
        title: ಸೂರ್ಯನ ಕ್ರಮಬದ್ಧ ಪಥವನ್ನು ಊರಿಯೇಲನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '73':
        title: ಚಂದ್ರನ ಕಲೆಗಳು ಆಜ್ಞೆಯಂತೆ ನಿಯಂತ್ರಿಸಲ್ಪಡುತ್ತವೆ
      '74':
        title: ಸೂರ್ಯಚಂದ್ರರ ನಿಖರ ಲಯಗಳು
      '75':
        title: ಸ್ವರ್ಗೀಯ ನಾಯಕರು ನಿಗದಿತ ಸೇವೆಯನ್ನು ಪಾಲಿಸುತ್ತಾರೆ
      '76':
        title: ಎನೋಕ್ ಭೂಮಿಯ ಗಾಳಿಗಳನ್ನು ನೋಡುತ್ತಾನೆ
      '77':
        title: ಎನೋಕ್ ನಾಲ್ಕು ಗಾಳಿಗಳನ್ನು ನೋಡುತ್ತಾನೆ
      '78':
        title: ಮಹಾ ಜ್ಯೋತಿಗಳ ಹೆಸರುಗಳು ಪ್ರಕಟವಾಗುತ್ತವೆ
      '79':
        title: ಎನೋಕ್ ಎಲ್ಲ ಸ್ವರ್ಗೀಯ ನಿಯಮಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '80':
        title: ವಿಶ್ವವ್ಯಾಪಿ ಅಸ್ತವ್ಯಸ್ತತೆಯ ಕುರಿತು ಊರಿಯೇಲನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '81':
        title: ಹನೋಕ್ ಸ್ವರ್ಗೀಯ ಫಲಕಗಳನ್ನು ಓದುತ್ತಾನೆ
      '82':
        title: ದಾಖಲೆಗಳನ್ನು ಸಂರಕ್ಷಿಸುವಂತೆ ಹನೋಕ್ ಮೆತೂಷೆಲನಿಗೆ ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
      '83':
        title: ಭೂಮಿ ನಾಶವಾಗುವುದನ್ನು ಹನೋಕ್ ಕಾಣುತ್ತಾನೆ
      '84':
        title: ಹನೋಕ್ ಪರಿಶುದ್ಧ ದೇವರನ್ನು ಸ್ತುತಿಸುತ್ತಾನೆ
      '85':
        title: ಹನೋಕ್ ತನ್ನ ಕುಟುಂಬದ ಗತಿಯನ್ನು ಕನಸಿನಲ್ಲಿ ಕಾಣುತ್ತಾನೆ
      '86':
        title: ನಕ್ಷತ್ರಗಳು ಬಿದ್ದು ಪಶುಗಳ ನಡುವೆ ಮೇಯುತ್ತವೆ
      '87':
        title: ಏಳು ಸ್ವರ್ಗೀಯ ಜೀವಿಗಳು ಗೋಪುರವನ್ನು ತೋರಿಸುತ್ತವೆ
      '88':
        title: ದೇವದೂತನು ಬಿದ್ದ ನಕ್ಷತ್ರವನ್ನು ಹಿಡಿಯುತ್ತಾನೆ
      '89':
        title: ಹನೋಕ್ ಪ್ರಾಣಿಗಳ ಸಂಕೇತಗಳನ್ನು ಕಾಣುತ್ತಾನೆ
      '90':
        title: ಕುರುಬರು ಹಿಂಡನ್ನು ದುರುಳತನದಿಂದ ಆಳುತ್ತಾರೆ; ಕುರಿಗಳ ಹಿಂಡು ಪುನಃ ಸ್ಥಾಪಿತವಾಗುತ್ತದೆ
      '91':
        title: ಹನೋಕ್ ಭವಿಷ್ಯದ ಶಿಕ್ಷೆಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '92':
        title: ಹನೋಕ್ ನೀತಿವಂತ ತಲೆಮಾರುಗಳಿಗಾಗಿ ಬರೆಯುತ್ತಾನೆ
      '93':
        title: ವಾರಗಳು ಇತಿಹಾಸ ಮತ್ತು ನ್ಯಾಯತೀರ್ಪಿನ ರೂಪರೇಖೆಯನ್ನು ನೀಡುತ್ತವೆ
      '94':
        title: ದುಷ್ಟ ಮಾರ್ಗಗಳ ಬದಲು ನೀತಿಯನ್ನು ಆರಿಸಿಕೊಳ್ಳಿರಿ
      '95':
        title: ಮುಂಬರುವ ದಂಡನೆಯ ಕುರಿತು ಹನೋಕ್ ಅಳುತ್ತಾನೆ
      '96':
        title: ನೀತಿವಂತರು ಪಾಪಿಗಳಿಗಿಂತ ಮೇಲಕ್ಕೆ ಏರುವರು
      '97':
        title: ನೀತಿವಂತರು ಹರ್ಷಿಸುತ್ತಾರೆ; ಪಾಪಿಗಳು ಬೀಳುತ್ತಾರೆ
      '98':
        title: ಐಷಾರಾಮವು ಅವಮಾನ ಮತ್ತು ವಿನಾಶವನ್ನು ತರುತ್ತದೆ
      '99':
        title: ದುಷ್ಕರ್ಮಿಗಳ ಮೇಲೆ ವಿಪತ್ತುಗಳು ಘೋಷಿಸಲ್ಪಡುತ್ತವೆ
      '100':
        title: ದೇವದೂತರು ದುಷ್ಟರಿಗೆ ನ್ಯಾಯತೀರಿಸಿ ನೀತಿವಂತರನ್ನು ಕಾಪಾಡುತ್ತಾರೆ
      '101':
        title: ದೇವರಿಗೆ ಭಯಪಡಿರಿ; ಕೆಟ್ಟದ್ದನ್ನು ಮಾಡುವುದನ್ನು ನಿಲ್ಲಿಸಿರಿ
      '102':
        title: ನ್ಯಾಯತೀರ್ಪಿನ ದಿನದಲ್ಲಿ ನೀತಿವಂತರು ಹರ್ಷಿಸುತ್ತಾರೆ
      '103':
        title: ಹನೋಕ್ ಶಾಶ್ವತ ಸಮರ್ಥನೆಯನ್ನು ಘೋಷಿಸುತ್ತಾನೆ
      '104':
        title: ಪಾಪದ ವಿರುದ್ಧ ಹನೋಕ್ ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '105':
        title: ಮಹಿಮೆಯ ಮುಂದೆ ಹೆಸರುಗಳು ಇರಿಸಲ್ಪಡುತ್ತವೆ
      '106':
        title: ಭವಿಷ್ಯದ ನಿರೀಕ್ಷೆಯ ಸಂಕೇತವಾಗಿ ನೋಹನಿಗೆ ಹೆಸರಿಡಲಾಗುತ್ತದೆ
      '107':
        title: ಕೊನೆಯ ತಲೆಮಾರು ಪುನಃಸ್ಥಾಪನೆಯನ್ನು ತರುತ್ತದೆ
      '108':
        title: ಹನೋಕ್ ಅಂತಿಮ ಎಚ್ಚರಿಕೆಯನ್ನು ಬರೆಯುತ್ತಾನೆ
  2 Baruch:
    display_name: 2 ಬಾರೂಕ್
    author: ಅಜ್ಞಾತ; ಯೆರೆಮೀಯನ ಲಿಪಿಕಾರನಾದ ಬಾರೂಕನಿಗೆ ಹುಸಿಹೆಸರಿನಲ್ಲಿ ಆರೋಪಿತವಾಗಿದೆ.
    audience: ಕ್ರಿ.ಶ. 70ರಲ್ಲಿ ದೇವಾಲಯ ನಾಶವಾದ ನಂತರ, ದೇಶಭ್ರಷ್ಟತೆಯ ಅರ್ಥವನ್ನು ಧಾರ್ಮಿಕವಾಗಿ ಗ್ರಹಿಸಲು ಪ್ರಯತ್ನಿಸುತ್ತಿದ್ದ ಯೆಹೂದ್ಯರು.
    date: ಸುಮಾರು ಕ್ರಿ.ಶ. 1ನೇ ಶತಮಾನದ ಅಂತ್ಯದಿಂದ 2ನೇ ಶತಮಾನದ ಆರಂಭದವರೆಗೆ; ಮುಖ್ಯವಾಗಿ ಸಿರಿಯಾಕ್ ಭಾಷೆಯಲ್ಲಿ ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    chapters:
      '1':
        title: ದೇವರು ಬಾರೂಕನಿಗೆ ಯೆಹೂದದ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '2':
        title: ಹೊರಟುಹೋಗುವಂತೆ ಕರ್ತನು ಬಾರೂಕನಿಗೆ ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
      '3':
        title: ಯೆರೂಸಲೇಮಿನ ಗತಿಯ ಕುರಿತು ಬಾರೂಕ್ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '4':
        title: ಮರೆಯಾಗಿರುವ ನಗರದ ವಾಸ್ತವವನ್ನು ಕರ್ತನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '5':
        title: ಯೆರೆಮೀಯನ ಸಂಗಡಿಗರೊಂದಿಗೆ ಬಾರೂಕ್ ಅಳುತ್ತಾನೆ
      '6':
        title: ದೇವದೂತರು ಚೀಯೋನನ್ನು ಕಾಯುವುದನ್ನು ಬಾರೂಕ್ ಕಾಣುತ್ತಾನೆ
      '7':
        title: ಚೀಯೋನನ್ನು ಕೆಡವಲು ದೇವದೂತರಿಗೆ ಆಜ್ಞೆಯಾಗುತ್ತದೆ
      '8':
        title: ಸ್ವರ್ಗೀಯ ವ್ಯಕ್ತಿಯು ಪವಿತ್ರ ವಸ್ತುಗಳನ್ನು ತೆಗೆದುಹಾಕುತ್ತಾನೆ
      '9':
        title: ಯೆರೆಮೀಯ ಮತ್ತು ಬಾರೂಕ್ ಒಟ್ಟಾಗಿ ಶೋಕಿಸುತ್ತಾರೆ
      '10':
        title: ಚೀಯೋನಿನ ಹಾಳುಸ್ಥಿತಿಗಾಗಿ ಬಾರೂಕ್ ಗಾಢವಾಗಿ ಗೋಳಾಡುತ್ತಾನೆ
      '11':
        title: ಬಾಬೆಲಿನ ಸಮೃದ್ಧಿಗಾಗಿ ಬಾರೂಕ್ ಗೋಳಾಡುತ್ತಾನೆ
      '12':
        title: ಮುಂಬರುವ ಕೋಪದ ಕುರಿತು ಬಾರೂಕ್ ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '13':
        title: ಭವಿಷ್ಯದಲ್ಲಿ ಸಾಕ್ಷಿಯಾಗುವ ಸಂಗತಿಯನ್ನು ದೇವರು ಬಾರೂಕನಿಗೆ ತೋರಿಸುತ್ತಾನೆ
      '14':
        title: ನೀತಿವಂತರಾಗಿರುವುದರಿಂದ ಏನು ಪ್ರಯೋಜನವೆಂದು ಬಾರೂಕ್ ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '15':
        title: ಪಾಪಿಗಳ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ಕರ್ತನು ವಿವರಿಸುತ್ತಾನೆ
      '16':
        title: ಭವಿಷ್ಯದ ಮಹಿಮೆಯಿಂದ ಬಾರೂಕ್ ಉತ್ತೇಜನ ಪಡೆಯುತ್ತಾನೆ
      '17':
        title: ಆಯುಷ್ಯದ ಅರ್ಥವನ್ನು ಬಾರೂಕ್ ತಿಳಿದುಕೊಳ್ಳುತ್ತಾನೆ
      '18':
        title: ದೈವಿಕ ಬೆಳಕನ್ನು ಬಾರೂಕ್ ವಿವರಿಸುತ್ತಾನೆ
      '19':
        title: ದೇವರು ಪ್ರತಿಯೊಬ್ಬ ವ್ಯಕ್ತಿಗೆ ನ್ಯಾಯತೀರಿಸುತ್ತಾನೆ
      '20':
        title: ಶೀಘ್ರವಾಗಿ ಬರುವ ನ್ಯಾಯತೀರ್ಪನ್ನು ದೇವರು ವಾಗ್ದಾನ ಮಾಡುತ್ತಾನೆ
      '21':
        title: ಕಿದ್ರೋನ್ ಬಳಿಯಲ್ಲಿ ಬಾರೂಕ್ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '22':
        title: ಮೇಲಿನಿಂದ ಕೇಳಿಬಂದ ಧ್ವನಿಗೆ ಬಾರೂಕ್ ಕಿವಿಗೊಡುತ್ತಾನೆ
      '23':
        title: ಕಾಯುತ್ತಿರುವ ಎಲ್ಲ ತಲೆಮಾರುಗಳನ್ನು ದೇವರು ನೆನಪಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '24':
        title: ಭವಿಷ್ಯದ ನ್ಯಾಯತೀರ್ಪನ್ನು ಬಾರೂಕ್ ಕಾಣುತ್ತಾನೆ
      '25':
        title: ಅಂತ್ಯದವರೆಗೆ ಬಾರೂಕ್ ಉಳಿಸಲ್ಪಡುತ್ತಾನೆ
      '26':
        title: ಸಂಕಟದ ಅವಧಿ ಎಷ್ಟೆಂದು ಬಾರೂಕ್ ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '27':
        title: ಮುಂಬರುವ ಕಾಲದ ಘಟನೆಗಳನ್ನು ಬಾರೂಕ್ ವಿವರಿಸುತ್ತಾನೆ
      '28':
        title: ಅವಿನಾಶಿಯಾದುದರ ಕುರಿತು ಬಾರೂಕ್ ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '29':
        title: ಭೂಮಿಯು ಸಮೃದ್ಧಿಯಿಂದ ತುಂಬಿ ಹರಿಯುತ್ತದೆ
      '30':
        title: ಆತ್ಮಗಳು ಮೆಸ್ಸೀಯನೊಂದಿಗೆ ಏಳುತ್ತವೆ
      '31':
        title: ಬಾರೂಕ್ ಹಿರಿಯರನ್ನು ಚೀಯೋನಿಗೆ ಒಟ್ಟುಗೂಡಿಸುತ್ತಾನೆ
      '32':
        title: ದೇವರ ನಿಯಮವನ್ನು ಅನುಸರಿಸಿ ಸುರಕ್ಷಿತರಾಗಿರಿ
      '33':
        title: ತಮ್ಮೊಡನೆ ಉಳಿಯುವಂತೆ ಜನರು ಬಾರೂಕನನ್ನು ಬೇಡಿಕೊಳ್ಳುತ್ತಾರೆ
      '34':
        title: ಬಾರೂಕ್ ಅಳುತ್ತಾ ಜನರಿಗೆ ಭರವಸೆ ನೀಡುತ್ತಾನೆ
      '35':
        title: ಚೀಯೋನಿನ ದುಃಖಕ್ಕಾಗಿ ಬಾರೂಕ್ ಅಳುತ್ತಾನೆ
      '36':
        title: ದ್ರಾಕ್ಷಾಲತೆಯು ದೇವದಾರು ಮರವನ್ನು ದೂಷಿಸುತ್ತದೆ
      '37':
        title: ದ್ರಾಕ್ಷಾಲತೆಯು ಬಿದ್ದ ದೇವದಾರು ಮರವನ್ನು ದೂಷಿಸುತ್ತದೆ
      '38':
        title: ದರ್ಶನದ ಅರ್ಥವಿವರಣೆಗಾಗಿ ಬಾರೂಕ್ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '39':
        title: ಬಾರೂಕ್ ರಾಜ್ಯಗಳ ಕುರಿತು ಮುಂತಿಳಿಸುತ್ತಾನೆ
      '40':
        title: ಮೆಸ್ಸೀಯನು ಉಳಿದ ಜನರನ್ನು ರಕ್ಷಿಸುವನು
      '41':
        title: ಭವಿಷ್ಯದ ಘಟನೆಗಳ ಕುರಿತು ಬಾರೂಕ್ ಕೇಳುತ್ತಾನೆ
      '42':
        title: ಹಿಂದಿನ ಜೀವನಕ್ಕಿಂತ ನಂಬಿಕೆಯೇ ಮುಖ್ಯ
      '43':
        title: ಶಾಶ್ವತ ಸಾಂತ್ವನಕ್ಕೆ ಬಾರೂಕ್ ಕಿವಿಗೊಡುತ್ತಾನೆ
      '44':
        title: ಬಾರೂಕ್ ತನ್ನ ಮಗ ಜ್ಞಾನನನ್ನು ಕರೆಯುತ್ತಾನೆ
      '45':
        title: ತಾಳಿಕೊಳ್ಳಿರಿ, ದೇವರಿಗೆ ಭಯಪಡಿರಿ, ಚೀಯೋನನ್ನು ಹುಡುಕಿರಿ
      '46':
        title: ಬಾರೂಕ್ ಹಿರಿಯರಿಗೆ ನಿರೀಕ್ಷೆಯ ಭರವಸೆ ನೀಡುತ್ತಾನೆ
      '47':
        title: ಬಾರೂಕ್ ಏಳು ದಿನ ಉಪವಾಸ ಮಾಡುತ್ತಾನೆ
      '48':
        title: ಉಳಿದವರಿಗಾಗಿ ಬಾರೂಕ್ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '49':
        title: ಭವಿಷ್ಯದ ಜೀವನದ ಕುರಿತು ಬಾರೂಕ್ ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '50':
        title: ಸತ್ತವರು ಗುರುತಿಸಬಹುದಾದವರಾಗಿ ಎದ್ದುಬರುವರು
      '51':
        title: ದುಷ್ಟರು ಬಾಡಿಹೋಗುತ್ತಾರೆ; ನೀತಿವಂತರು ಮಹಿಮೆ ಹೊಂದುತ್ತಾರೆ
      '52':
        title: ಸತ್ತವರು ಹಿಂದಿರುಗುತ್ತಾರೆ; ಜೀವಂತರು ಅವರನ್ನು ಗುರುತಿಸುತ್ತಾರೆ
      '53':
        title: ಬಾರೂಕ್ ಮೋಡದ ದರ್ಶನವನ್ನು ಕನಸಿನಲ್ಲಿ ಕಾಣುತ್ತಾನೆ
      '54':
        title: ದರ್ಶನದ ವಿವರಣೆಗಾಗಿ ಬಾರೂಕ್ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '55':
        title: ದೇವರು ಬಾರೂಕನಿಗೆ ಭವಿಷ್ಯದ ರಹಸ್ಯಗಳನ್ನು ತೋರಿಸುತ್ತಾನೆ
      '56':
        title: ಮೋಡವು ಲೋಕದ ಆರಂಭವನ್ನು ಸೂಚಿಸುತ್ತದೆ
      '57':
        title: ಕಪ್ಪು ನೀರು ಆದಾಮನ ಅಪರಾಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ
      '58':
        title: ಪಾಪವು ಭೂಮಿಯನ್ನು ಆವರಿಸುವುದನ್ನು ಆದಾಮನು ಕಾಣುತ್ತಾನೆ
      '59':
        title: ಪಾಪಮಯ ಲೋಕದ ಮೇಲೆ ಮೋಡವು ಏಳುತ್ತದೆ
      '60':
        title: ಅಮೋರಿಯರ ದುಷ್ಟತನವು ಇಸ್ರಾಯೇಲನ್ನು ಕಳಂಕಗೊಳಿಸುತ್ತದೆ
      '61':
        title: ದಾವೀದ ಮತ್ತು ಸೊಲೊಮೋನರ ಕಾಲವು ಸಮೃದ್ಧಿಯಾಗುತ್ತದೆ
      '62':
        title: ಯಾರೊಬ್ಬಾಮನ ಪಾಪವು ವಿನಾಶವನ್ನು ತರುತ್ತದೆ
      '63':
        title: ಹಿಜ್ಕೀಯನ ನೀತಿಯು ಜಯಿಸುತ್ತದೆ
      '64':
        title: ಮನಸ್ಸೆಯ ದುಷ್ಟತನವು ಅಪವಿತ್ರಗೊಳಿಸುತ್ತದೆ
      '65':
        title: ಆಮೋನನ ದುಷ್ಟ ಆಳ್ವಿಕೆ ಕತ್ತಲನ್ನು ತರುತ್ತದೆ
      '66':
        title: ಯೋಷೀಯನ ಶುದ್ಧತೆ ಚೀಯೋನನ್ನು ಪುನಃಸ್ಥಾಪಿಸುತ್ತದೆ
      '67':
        title: ಈಗಿನ ವಿಪತ್ತು ದೇವದೂತರನ್ನು ದುಃಖಗೊಳಿಸುತ್ತದೆ
      '68':
        title: ಭವಿಷ್ಯದ ರಕ್ಷಣೆ ಸಂತೋಷವನ್ನು ತರುತ್ತದೆ
      '69':
        title: ಕೊನೆಯ ನೀರು ಲೋಕಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ
      '70':
        title: ಲೋಕದ ಕಾಲವು ನ್ಯಾಯತೀರ್ಪಿಗೆ ಪಕ್ವವಾಗುತ್ತದೆ
      '71':
        title: ಪವಿತ್ರ ಜನರಿಗೆ ಕರುಣೆ ತೋರಲಾಗುತ್ತದೆ
      '72':
        title: ಪ್ರಕಾಶಮಾನವಾದ ನೀರು ಮೆಸ್ಸೀಯನ ಕಾಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ
      '73':
        title: ಶಾಂತಿಯ ಯುಗವು ಎಲ್ಲ ಕಲಹವನ್ನು ಕೊನೆಗೊಳಿಸುತ್ತದೆ
      '74':
        title: ನಿರ್ಮಿಸುವವರು ಶಾಂತಿಯಿಂದ ಕೊಯ್ಲು ಮಾಡುತ್ತಾರೆ
      '75':
        title: ಬಾರೂಕನು ದೇವರ ಕರುಣೆಯನ್ನು ಸ್ತುತಿಸುತ್ತಾನೆ
      '76':
        title: ಜನರು ಬಾರೂಕನ ಬೋಧನೆಯನ್ನು ಕೋರುತ್ತಾರೆ
      '77':
        title: ಬಾರೂಕನು ಜನರಿಗೆ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ನೆನಪಿಸುತ್ತಾನೆ
      '78':
        title: ಬಾರೂಕನು ದೇಶಭ್ರಷ್ಟರಿಗೆ ನಿರೀಕ್ಷೆಯ ಸಂದೇಶ ಬರೆಯುತ್ತಾನೆ
      '79':
        title: ಸೃಷ್ಟಿಕರ್ತನ ಪ್ರೀತಿ ಬದಲಾಗದೆ ಉಳಿಯುತ್ತದೆ
      '80':
        title: ನೆಬೂಕದ್ನೆಚ್ಚರನ ದಾಳಿ ಪೂರ್ವನಿರ್ಧರಿತವಾಗಿದೆ
      '81':
        title: ಸಂಕಟದಲ್ಲಿರುವವರಿಗೆ ದೇವರ ಕರುಣೆ ಹತ್ತಿರವಾಗಿದೆ
      '82':
        title: ದುಷ್ಟ ಜನಾಂಗಗಳು ನ್ಯಾಯತೀರ್ಪನ್ನು ಎದುರಿಸುತ್ತವೆ
      '83':
        title: ಮೋಶೆ ಮತ್ತು ಯೆರೆಮೀಯರು ನ್ಯಾಯತೀರ್ಪುಗಳ ಬಗ್ಗೆ ಎಚ್ಚರಿಸಿದರು
      '84':
        title: ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ನೆನಪಿಡುವಂತೆ ಬಾರೂಕನು ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '85':
        title: ಅಂತ್ಯವು ಹತ್ತಿರವಾಗಿದೆ; ಆಜ್ಞೆಗಳನ್ನು ಸ್ವೀಕರಿಸಿ
      '86':
        title: ಸಭೆಗಳಲ್ಲಿ ಪತ್ರವನ್ನು ಗಟ್ಟಿಯಾಗಿ ಓದಿರಿ
      '87':
        title: ಬೋಧಿಸಲಾದ ಆಜ್ಞೆಗಳನ್ನು ದೃಢವಾಗಿ ಹಿಡಿದುಕೊಳ್ಳಿರಿ
  2 Esdras:
    display_name: 2 ಎಸ್ದ್ರಾಸ್
    author: ಲೇಖಕರು ತಿಳಿದಿಲ್ಲ; ಮೂಲತಃ ಯೆಹೂದ್ಯರ ಕೃತಿಯಾಗಿದ್ದ ಕೇಂದ್ರಭಾಗದ (4 ಎಜ್ರಾ, ಅಧ್ಯಾಯಗಳು 3–14) ಸುತ್ತ ಕ್ರೈಸ್ತ ಸಂಪಾದನೆಯ ಚೌಕಟ್ಟು ಇದೆ.
    audience: ಕ್ರಿ.ಶ. 70ರ ನಂತರ ದೇವರ ನ್ಯಾಯದ ಪ್ರಶ್ನೆಯೊಂದಿಗೆ ಹೋರಾಡುತ್ತಿದ್ದ ಯೆಹೂದ್ಯರು; ಬಳಿಕ ಕ್ರೈಸ್ತ ಓದುಗರಿಗಾಗಿ ವಿಸ್ತರಿಸಲಾಯಿತು.
    date: ಯೆಹೂದ್ಯ ಕೇಂದ್ರಭಾಗವು ಬಹುಶಃ ಕ್ರಿ.ಶ. 100ರ ಸುಮಾರಿನದು; ಕ್ರೈಸ್ತ ಸೇರ್ಪಡೆಗಳು ಬಹುಶಃ ಕ್ರಿ.ಶ. 2–3ನೇ ಶತಮಾನಗಳವು.
    chapters:
      '1':
        title: ಇಸ್ರಾಯೇಲಿನ ತಿರಸ್ಕಾರಕ್ಕಾಗಿ ದೇವರು ದುಃಖಿಸುತ್ತಾನೆ
      '2':
        title: ಎಜ್ರನು ಮುಂದಿನ ಮಹಿಮೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '3':
        title: ಎಜ್ರನು ಇಸ್ರಾಯೇಲಿನ ಚರಿತ್ರೆಯನ್ನು ನೆನೆದು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '4':
        title: ಊರಿಯೇಲನು ಎಜ್ರನಿಗೆ ಅವನ ಮಿತಿಗಳನ್ನು ತಿಳಿಸುತ್ತಾನೆ
      '5':
        title: ಬರಲಿರುವ ಭೀತಿಯ ನಡುವೆ ಎಜ್ರನು ಮೊರೆಯಿಡುತ್ತಾನೆ
      '6':
        title: ಎಜ್ರನು ಸೃಷ್ಟಿಯ ದಿನಗಳನ್ನು ನೆನೆದು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '7':
        title: ಎಜ್ರನು ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪನ್ನು ಕಾಣುತ್ತಾನೆ
      '8':
        title: ಎಜ್ರನು ತಿಳಿವಳಿಕೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '9':
        title: ಎಜ್ರನು ಚೀಯೋನಿನ ಮುಂದಿನ ಮಹಿಮೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '10':
        title: ಎಜ್ರನು ಚೀಯೋನಿನ ಮಹಿಮೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '11':
        title: ಹದ್ದಿನ ಕನಸುಗಳು ಅಂತ್ಯವನ್ನು ಮುನ್ಸೂಚಿಸುತ್ತವೆ
      '12':
        title: ಎಜ್ರನು ಸಿಂಹ ಮತ್ತು ಹದ್ದುಗಳ ಕುರಿತು ಕನಸು ಕಾಣುತ್ತಾನೆ
      '13':
        title: ಸಮುದ್ರದಿಂದ ಬಂದ ಮನುಷ್ಯನು ಸೃಷ್ಟಿಯನ್ನು ಬಿಡಿಸುತ್ತಾನೆ
      '14':
        title: ನಂಬಿಗಸ್ತ ವಚನಗಳನ್ನು ಹೇಳುವಂತೆ ಕರ್ತನು ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
      '15':
        title: ಬರಲಿರುವ ನ್ಯಾಯತೀರ್ಪಿನ ಕುರಿತು ಪ್ರವಾದಿ ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '16':
        title: ದೇವರ ನ್ಯಾಯತೀರ್ಪುಗಳು ಭೂಮಿಯನ್ನೂ ಸಮುದ್ರವನ್ನೂ ನಡುಗಿಸುತ್ತವೆ
  Didache:
    display_name: ದಿದಾಖೆ
    author: ಲೇಖಕರು ತಿಳಿದಿಲ್ಲ (ಶೀರ್ಷಿಕೆಯ ಅರ್ಥ, “ಹನ್ನೆರಡು ಅಪೊಸ್ತಲರ ಬೋಧನೆ”).
    audience: ಆರಂಭಿಕ ಕ್ರೈಸ್ತ ಸಭೆಗಳು—ನೈತಿಕತೆ, ದೀಕ್ಷಾಸ್ನಾನ, ಪ್ರಭುಭೋಜನ ಮತ್ತು ಸಂಚಾರಿ ಬೋಧಕರ ಕುರಿತ ಸಂಕ್ಷಿಪ್ತ ಕೈಪಿಡಿ.
    date: ಬಹುಶಃ ಕ್ರಿ.ಶ. 1ನೇ ಶತಮಾನದ ಕೊನೆಯ ಭಾಗದಿಂದ 2ನೇ ಶತಮಾನದ ಆರಂಭದವರೆಗೆ.
    chapters:
      '1':
        title: ದೇವರನ್ನು ಪ್ರೀತಿಸಿ ಜೀವದ ಮಾರ್ಗವನ್ನು ಆರಿಸಿಕೊಳ್ಳಿರಿ
      '2':
        title: ಕೆಟ್ಟದ್ದನ್ನು ಬಿಟ್ಟು ಆಜ್ಞೆಗಳನ್ನು ಅನುಸರಿಸಿರಿ
      '3':
        title: ಎಲ್ಲ ವಿಧದ ಕೆಟ್ಟತನದಿಂದ ದೂರ ಓಡಿರಿ
      '4':
        title: ದೇವರ ವಾಕ್ಯವನ್ನು ಯಾವಾಗಲೂ ಗೌರವಿಸಿರಿ
      '5':
        title: ಮರಣದ ಮಾರ್ಗವು ಪಾಪಕ್ಕೆ ನಡೆಸುತ್ತದೆ
      '6':
        title: ಏನನ್ನೂ ಸೇರಿಸದೆ ಬೋಧನೆಯನ್ನು ಅನುಸರಿಸಿರಿ
      '7':
        title: ಜೀವಜಲದಲ್ಲಿ ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿರಿ
      '8':
        title: ನೀತಿವಂತ ತಂದೆಗೆ ಪ್ರಾರ್ಥಿಸಿರಿ
      '9':
        title: ಪಾತ್ರೆ ಮತ್ತು ರೊಟ್ಟಿಗಾಗಿ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸಿರಿ
      '10':
        title: ಪವಿತ್ರ ತಂದೆಗೆ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸಲಾಗುತ್ತದೆ
      '11':
        title: ನಿಜವಾದ ಬೋಧಕರನ್ನೂ ಪ್ರವಾದಿಗಳನ್ನೂ ಸ್ವಾಗತಿಸಿರಿ
      '12':
        title: ಪ್ರಯಾಣಿಕರಿಗೆ ನೆರವಾಗಿ, ಆದರೆ ಅವರನ್ನು ಪರೀಕ್ಷಿಸಿರಿ
      '13':
        title: ನಿಜವಾದ ಪ್ರವಾದಿಗಳನ್ನೂ ಬೋಧಕರನ್ನೂ ಬೆಂಬಲಿಸಿರಿ
      '14':
        title: ರೊಟ್ಟಿಯನ್ನು ಮುರಿಯುವ ಮೊದಲು ಪಾಪಗಳನ್ನು ಒಪ್ಪಿಕೊಳ್ಳಿರಿ
      '15':
        title: ಯೋಗ್ಯ ಮೇಲ್ವಿಚಾರಕರನ್ನೂ ಸಭಾಸೇವಕರನ್ನೂ ನೇಮಿಸಿರಿ
      '16':
        title: ಎಚ್ಚರವಾಗಿರಿ; ನಂಬಿಕೆಯು ಸಂಕಟಗಳಲ್ಲಿ ತಾಳಿಕೊಳ್ಳಲಿ
  Gospel of Thomas:
    display_name: ತೋಮನ ಸುವಾರ್ತೆ
    author: ಲೇಖಕರು ತಿಳಿದಿಲ್ಲ; ಆರಂಭಿಕ ವಾಕ್ಯವು ಈ ವಚನಸಂಗ್ರಹವನ್ನು “ದಿದಿಮೋಸ್ ಯೂದಾಸ್ ತೋಮ”ನಿಗೆ ಸೇರಿಸುತ್ತದೆ. ಇದರ ಸಂಪೂರ್ಣ ಪಾಠವು ನಾಗ್ ಹಮ್ಮಾದಿಯಿಂದ ದೊರೆತ 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಭಾಷಾಂತರದಲ್ಲಿ (NHC II,2) ಮಾತ್ರ ಉಳಿದಿದೆ; ಆಕ್ಸಿರಿಂಕಸ್‌ನಿಂದ ಮೂರು ಗ್ರೀಕ್ ತುಣುಕುಗಳೂ ದೊರೆತಿವೆ.
    audience: ಸಿರಿಯದ ಜ್ಞಾನಪರಂಪರೆ ಮತ್ತು ಆದಿ-ಜ್ಞಾನವಾದಿ ಚಿಂತನೆಯಿಂದ ರೂಪುಗೊಂಡ, ಯೇಸುವಿನ ವಚನಗಳಲ್ಲಿ ಅಂತರಂಗದ ನಿಗೂಢ ಸ್ವಜ್ಞಾನವನ್ನು ಹುಡುಕುವ ಕ್ರೈಸ್ತ ಓದುಗರು.
    date: ಗ್ರೀಕ್ ಮೂಲವು ಬಹುಶಃ ಕ್ರಿ.ಶ. 50–140ರ ಕಾಲದ್ದು; ಕಾಪ್ಟಿಕ್ ಹಸ್ತಪ್ರತಿಯು ಬಹುಶಃ ಕ್ರಿ.ಶ. 340ರ ಕಾಲದ್ದು.
    summary: ತೋಮನ ಸುವಾರ್ತೆಯು ಯೇಸುವಿಗೆ ಸೇರಿಸಲಾದ ವಚನಗಳ ಸಂಗ್ರಹವಾಗಿದೆ. ಇದರಲ್ಲಿ ನಿರಂತರ ಕಥನ ಇಲ್ಲ; ವಚನಗಳ ಅರ್ಥವನ್ನು ಕಂಡುಕೊಳ್ಳುವಂತೆ ಇದು ಓದುಗರನ್ನು ಮತ್ತೆ ಮತ್ತೆ ಕರೆಯುತ್ತದೆ.
    chapters:
      '0':
        title: ತೋಮನು ಯೇಸುವಿನ ರಹಸ್ಯ ವಚನಗಳನ್ನು ಬರೆಯುತ್ತಾನೆ
      '1':
        title: ಯೇಸು ಗುಪ್ತ ಜ್ಞಾನವನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '2':
        title: ರಾಜ್ಯವು ನಿಮ್ಮ ಒಳಗೂ ಹೊರಗೂ ಇದೆ
      '3':
        title: ರಾಜ್ಯವು ಒಳಗೂ ಹೊರಗೂ ಇದೆ
      '4':
        title: ಯೇಸು ದೀನತೆ ಮತ್ತು ಜ್ಞಾನವನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '5':
        title: ಯೇಸು ರಹಸ್ಯಗಳ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '6':
        title: ಮನುಷ್ಯನು ತಿಂದ ಸಿಂಹವು ಧನ್ಯ
      '7':
        title: ಜ್ಞಾನಿಯಾದ ಮೀನುಗಾರನು ದೊಡ್ಡ ಮೀನನ್ನು ಆರಿಸುತ್ತಾನೆ
      '8':
        title: ಜ್ಞಾನಿಯಾದ ಮೀನುಗಾರನು ದೊಡ್ಡದನ್ನು ಆರಿಸುತ್ತಾನೆ
      '9':
        title: ಬಿತ್ತುವವನು ಬೀಜವನ್ನು ಎಲ್ಲೆಡೆ ಚೆಲ್ಲುತ್ತಾನೆ
      '10':
        title: ಯೇಸು ಉರಿಯುತ್ತಿರುವ ಬೆಂಕಿಯನ್ನು ಕಾಯುತ್ತಾನೆ
      '11':
        title: ಯೇಸು ಕಳೆದುಹೋಗುವಿಕೆಯ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '12':
        title: ಯಾಕೋಬನು ಶಿಷ್ಯರನ್ನು ಮುನ್ನಡೆಸುವನು
      '13':
        title: ಉಪವಾಸ, ಪ್ರಾರ್ಥನೆ ಮತ್ತು ದಾನ ಪಾಪ
      '14':
        title: ಯೇಸು ನಿಜವಾದ ಭಕ್ತಿಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '15':
        title: ನಿಮ್ಮ ತಂದೆಯಾಗಿರುವ ಆತನನ್ನು ಆರಾಧಿಸಿರಿ
      '16':
        title: ಯೇಸು ವಿಭಜನೆಯ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '17':
        title: ಆರಂಭವನ್ನು ಕಂಡುಕೊಳ್ಳುವವನು ಧನ್ಯನು
      '18':
        title: ಯೇಸು ಆರಂಭ ಮತ್ತು ಅಂತ್ಯವನ್ನು ವಿವರಿಸುತ್ತಾನೆ
      '19':
        title: ರಾಜ್ಯವು ಬೆಳೆಯುವ ಸಾಸಿವೆಕಾಳಿನಂತಿದೆ
      '20':
        title: ಮರಿಯಳು ಶಿಷ್ಯರ ಅಂತ್ಯದ ಕುರಿತು ಕೇಳುತ್ತಾಳೆ
      '21':
        title: ಮರಿಯಳು ಯೇಸುವಿನ ಶಿಷ್ಯರ ಕುರಿತು ಪ್ರಶ್ನಿಸುತ್ತಾಳೆ
      '22':
        title: ಯೇಸು ರಾಜ್ಯವನ್ನು ಪ್ರವೇಶಿಸುವುದನ್ನು ವಿವರಿಸುತ್ತಾನೆ
      '23':
        title: ಯೇಸು ದೃಢವಾಗಿ ನಿಲ್ಲುವ ಕೆಲವರನ್ನು ಆರಿಸುತ್ತಾನೆ
      '24':
        title: ಮನುಷ್ಯನೊಳಗಿನ ಬೆಳಕು ಪ್ರಕಾಶಿಸುತ್ತದೆ
      '25':
        title: ಸಹೋದರನನ್ನು ನಿಮ್ಮ ಪ್ರಾಣದಂತೆ ಪ್ರೀತಿಸಿರಿ
      '26':
        title: ಯೇಸು ಕಪಟತನದ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '27':
        title: ಉಪವಾಸವು ಆಧ್ಯಾತ್ಮಿಕ ರಾಜ್ಯವನ್ನು ಕಂಡುಕೊಳ್ಳುತ್ತದೆ
      '28':
        title: ಯೇಸು ಅಮಲೇರಿದವರ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '29':
        title: ಯೇಸು ಆತ್ಮವನ್ನು ಕಂಡು ಆಶ್ಚರ್ಯಪಡುತ್ತಾನೆ
      '30':
        title: ಯೇಸು ದೈವಿಕ ಸಾನ್ನಿಧ್ಯದ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '31':
        title: ಪ್ರವಾದಿಗೆ ತನ್ನ ಊರಿನಲ್ಲಿ ಮನ್ನಣೆ ಇಲ್ಲ
      '32':
        title: ಎತ್ತರದ ಬೆಟ್ಟದ ಮೇಲೆ ಕಟ್ಟಿದ ನಗರ
      '33':
        title: ಮೇಲ್ಛಾವಣಿಗಳಿಂದ ಬೆಳಕನ್ನು ಪ್ರಕಟಿಸಿರಿ
      '34':
        title: ಕುರುಡನು ಕುರುಡನನ್ನು ನಡೆಸಿದರೆ ಇಬ್ಬರೂ ಬೀಳುತ್ತಾರೆ
      '35':
        title: ಕೈಗಳನ್ನು ಕಟ್ಟುವುದು ಮನೆಯನ್ನು ಉರುಳಿಸುವುದು
      '36':
        title: ದಿನನಿತ್ಯದ ಅಗತ್ಯಗಳ ಕುರಿತು ಚಿಂತಿಸುವುದನ್ನು ಬಿಡಿರಿ
      '37':
        title: ಲಜ್ಜೆಯ ಹೊದಿಕೆಯನ್ನು ಕಳಚಿ ಸತ್ಯವನ್ನು ಕಾಣಿರಿ
      '38':
        title: ಯೇಸು ಜನರು ಬಯಸಿದ ಮಾತುಗಳನ್ನು ಆಡುತ್ತಾನೆ
      '39':
        title: ಫರಿಸಾಯರು ಜ್ಞಾನದ ಕೀಲಿಗಳನ್ನು ಮರೆಮಾಡುತ್ತಾರೆ
      '40':
        title: ತಂದೆಯ ಹೊರಗೆ ನೆಡಲಾದ ದ್ರಾಕ್ಷಿಬಳ್ಳಿ ನಾಶವಾಗುತ್ತದೆ
      '41':
        title: ಯೇಸು ಕೊಡುವುದರ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '42':
        title: ಲೋಕದಲ್ಲಿ ದಾರಿಹೋಕರಾಗಿರಿ
      '43':
        title: ಯೇಸು ಶಿಷ್ಯರ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರಿಸುತ್ತಾನೆ
      '44':
        title: ತಂದೆ ಮತ್ತು ಮಗನನ್ನು ದೂಷಿಸಿದ್ದಕ್ಕೆ ಕ್ಷಮೆ
      '45':
        title: ಯೇಸು ಹೃದಯದ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '46':
        title: ಯೇಸು ಯೋಹಾನನ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '47':
        title: ಯೇಸು ಅಸಾಧ್ಯವಾದ ಸೇವೆಯ ಕುರಿತು ಬೋಧಿಸುತ್ತಾನೆ
      '48':
        title: ಯೇಸು ಶಾಂತಿಯ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '49':
        title: ಏಕಾಂಗಿಯಾಗಿ ಆಯ್ಕೆಯಾದವರು ರಾಜ್ಯವನ್ನು ಕಂಡುಕೊಳ್ಳುವರು
      '50':
        title: ಯೇಸು ಬೆಳಕಿನ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '51':
        title: ಸತ್ತವರ ವಿಶ್ರಾಂತಿ ಗಮನಕ್ಕೆ ಬಾರದೆ ಬರುತ್ತದೆ
      '52':
        title: ಮಾತನಾಡುವ ಸತ್ತವರ ನಡುವೆ ಜೀವಿಸುವುದು
      '53':
        title: ಶಿಷ್ಯರು ಸುನ್ನತಿಯ ಕುರಿತು ಪ್ರಶ್ನಿಸುತ್ತಾರೆ
      '54':
        title: ಯೇಸು ಬಡವರನ್ನು ಧನ್ಯರೆನ್ನುತ್ತಾನೆ
      '55':
        title: ದ್ವೇಷಿಸಿರಿ ಅಥವಾ ಕ್ರಿಸ್ತನನ್ನು ಹಿಂಬಾಲಿಸಿರಿ
      '56':
        title: ಶವದಂತಿರುವ ಲೋಕವನ್ನು ಕಂಡವನು; ಲೋಕವು ಅವನಿಗೆ ಯೋಗ್ಯವಲ್ಲ
      '57':
        title: ದುಡಿಯುವ ವ್ಯಕ್ತಿ ಧನ್ಯನು
      '58':
        title: ಯೇಸು ಕಠಿಣ ಪರಿಶ್ರಮವನ್ನು ಧನ್ಯವೆನ್ನುತ್ತಾನೆ
      '59':
        title: ಬದುಕಿರುವಾಗಲೇ ಜೀವಂತನಾದವನನ್ನು ಹುಡುಕಿರಿ
      '60':
        title: ಸಮಾರ್ಯದವನು ಕುರಿಮರಿಯನ್ನು ಯೂದಾಯಕ್ಕೆ ಒಯ್ಯುತ್ತಾನೆ
      '61':
        title: ಯೇಸು ಸಲೋಮೆಗೆ ಬೆಳಕಿನ ಕುರಿತು ಬೋಧಿಸುತ್ತಾನೆ
      '62':
        title: ರಹಸ್ಯಗಳು ಗುಪ್ತವಾಗಿ ಪ್ರಕಟವಾಗುತ್ತವೆ
      '63':
        title: ಸಿದ್ಧನಾಗಿರದ ಶ್ರೀಮಂತನು ಸಾಯುತ್ತಾನೆ
      '64':
        title: ಯಜಮಾನನು ಅನಿರೀಕ್ಷಿತ ಅತಿಥಿಗಳನ್ನು ಆಹ್ವಾನಿಸುತ್ತಾನೆ
      '65':
        title: ಒಳ್ಳೆಯ ಮನುಷ್ಯನ ದ್ರಾಕ್ಷಿತೋಟ ನಾಶವಾಗುತ್ತದೆ
      '66':
        title: ತಿರಸ್ಕರಿಸಲ್ಪಟ್ಟ ಕಲ್ಲನ್ನು ನನಗೆ ತೋರಿಸಿರಿ
      '67':
        title: ಎಲ್ಲವನ್ನೂ ತಿಳಿದರೂ ತನ್ನನ್ನೇ ಅರಿಯದಿರುವುದು
      '68':
        title: ಹಿಂಸೆಗೆ ಒಳಗಾದವರು ಧನ್ಯರು
      '69':
        title: ಹಸಿದ ಆತ್ಮಗಳು ಧನ್ಯವು
      '70':
        title: ಯೇಸು ಅಂತರಂಗದ ಬಡತನದ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '71':
        title: ಯೇಸು ಮನೆಯ ಕುಸಿತವನ್ನು ಮುನ್ಸೂಚಿಸುತ್ತಾನೆ
      '72':
        title: ಯೇಸು ಆಸ್ತಿಯನ್ನು ಹಂಚಲು ನಿರಾಕರಿಸುತ್ತಾನೆ
      '73':
        title: ಯೇಸು ಇನ್ನಷ್ಟು ಕೆಲಸಗಾರರನ್ನು ಕಳುಹಿಸುವಂತೆ ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '74':
        title: ಬಾಯಾರಿದ ಜನಸಮೂಹವಿದ್ದರೂ ಬಾವಿ ಖಾಲಿ
      '75':
        title: ಏಕಾಂಗಿಗಳು ವಧೂವರರ ಕೋಣೆಯನ್ನು ಪ್ರವೇಶಿಸುತ್ತಾರೆ
      '76':
        title: ಎಂದೆಂದಿಗೂ ಉಳಿಯುವ ನಿಧಿಯನ್ನು ಹುಡುಕಿರಿ
      '77':
        title: ಯೇಸು ದೈವಿಕ ಬೆಳಕಾಗಿ ಮಾತನಾಡುತ್ತಾನೆ
      '78':
        title: ಯೇಸು ನಯವಾದ ಉಡುಪಿನ ಕುರಿತು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '79':
        title: ಸಹನೆಯಿಂದ ಸತ್ಯವನ್ನು ಹೊರುವ ಮಹಿಳೆ ಧನ್ಯಳು
      '80':
        title: ದೇಹವನ್ನು ಕಂಡವನಿಗೆ ಲೋಕವು ಯೋಗ್ಯವಲ್ಲ
      '81':
        title: ಐಶ್ವರ್ಯ ಮತ್ತು ಅಧಿಕಾರದ ವಿರೋಧಾಭಾಸದ ಕುರಿತು ಯೇಸು
      '82':
        title: ಹತ್ತಿರವಿರುವವರಿಗೆ ಬೆಂಕಿಯೂ ಹತ್ತಿರ
      '83':
        title: ರೂಪಗಳು ಗೋಚರಿಸುತ್ತವೆ, ಆದರೆ ಬೆಳಕು ಮರೆಯಾಗಿದೆ
      '84':
        title: ನಿಮ್ಮ ಹೋಲಿಕೆಯನ್ನು ಕಾಣುವುದು ಸಂತೋಷ ತರುತ್ತದೆ
      '85':
        title: ಆದಾಮನು ಮಹಾ ಶಕ್ತಿಯಿಂದ ಬಂದನು
      '86':
        title: ಯೇಸು ನೆಲೆಯಿಲ್ಲದಿರುವುದರ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '87':
        title: ದೇಹ ಮತ್ತು ಆತ್ಮದ ಅವಲಂಬನೆ ದುರವಸ್ಥೆ
      '88':
        title: ದೇವದೂತರೂ ಪ್ರವಾದಿಗಳೂ ಬರುವರು
      '89':
        title: ಯೇಸು ಶುದ್ಧೀಕರಣದ ಕುರಿತು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '90':
        title: ಯೇಸು ಹುಡುಕುವವರಿಗೆ ವಿಶ್ರಾಂತಿ ನೀಡುತ್ತಾನೆ
      '91':
        title: ಯೇಸು ನಿಜವಾದ ಜ್ಞಾನವನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '92':
        title: ಹುಡುಕಿರಿ, ನಿಮಗೆ ಸಿಗುವುದು
      '93':
        title: ಪವಿತ್ರವಾದವುಗಳನ್ನು ವಿವೇಕದಿಂದ ಕೊಡಿರಿ
      '94':
        title: ಹುಡುಕುವುದರಿಂದ ಕಂಡುಕೊಳ್ಳುವಿರಿ
      '95':
        title: ಹಿಂತಿರುಗಿಸುವ ನಿರೀಕ್ಷೆಯಿಲ್ಲದೆ ಸಾಲ ಕೊಡಿರಿ
      '96':
        title: ರಾಜ್ಯವು ಅಡಗಿರುವ ಹುಳಿಯಂತಿದೆ
      '97':
        title: ಮಹಿಳೆ ಅರಿವಿಲ್ಲದೆ ಹಿಟ್ಟನ್ನು ಕಳೆದುಕೊಳ್ಳುತ್ತಾಳೆ
      '98':
        title: ಮನುಷ್ಯನು ಮೊದಲು ತನ್ನ ಬಲವನ್ನು ಪರೀಕ್ಷಿಸುತ್ತಾನೆ
      '99':
        title: ನಿಜವಾದ ಸಹೋದರರು ತಂದೆಗೆ ವಿಧೇಯರಾಗುತ್ತಾರೆ
      '100':
        title: ತೆರಿಗೆಯ ಕುರಿತು ಯೇಸು ಉತ್ತರಿಸುತ್ತಾನೆ
      '101':
        title: ನಿಜವಾದ ಶಿಷ್ಯನಾಗಲು ದ್ವೇಷಿಸಬೇಕು
      '102':
        title: ಯೇಸು ಸ್ವಾರ್ಥಿ ಫರಿಸಾಯರನ್ನು ಶಪಿಸುತ್ತಾನೆ
      '103':
        title: ಸಿದ್ಧನಾಗಿರುವ ಮನುಷ್ಯನು ಧನ್ಯನು
      '104':
        title: ವರನು ಹೋದ ಬಳಿಕ ಪ್ರಾರ್ಥಿಸಿರಿ
      '105':
        title: ಒಳನೋಟವು ಬಹಿರಂಗ ಅವಮಾನ ತರುತ್ತದೆ
      '106':
        title: ಏಕತೆಯು ಬೆಟ್ಟಗಳನ್ನು ಚಲಿಸುವಂತೆ ಮಾಡುತ್ತದೆ
      '107':
        title: ರಾಜ್ಯವು ಕಳೆದುಹೋದ ಕುರಿಯನ್ನು ಹುಡುಕುತ್ತದೆ
      '108':
        title: ಯೇಸು ಮರೆಯಾಗಿರುವ ಸಂಗತಿಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '109':
        title: ಅಡಗಿದ್ದ ನಿಧಿ ತನ್ನನ್ನೇ ಪ್ರಕಟಿಸುತ್ತದೆ
      '110':
        title: ಕಂಡುಕೊಂಡ ಲೌಕಿಕ ಐಶ್ವರ್ಯವನ್ನು ತ್ಯಜಿಸಿರಿ
      '111':
        title: ಅವನ ಮುಂದೆ ಆಕಾಶಗಳು ಸುರುಳಿಯಾಗಿ ಮಡಚಿಕೊಳ್ಳುತ್ತವೆ
      '112':
        title: ಯೇಸು ಶರೀರದ ಅವಲಂಬನೆಯ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '113':
        title: ರಾಜತ್ವವು ಭೂಮಿಯ ಮೇಲೆ ಹರಡಿದೆ
      '114':
        title: ಯೇಸು ಮರಿಯಳ ಸಮಾನತೆಯ ಕುರಿತು ಬೋಧಿಸುತ್ತಾನೆ
  Gospel of Truth:
    display_name: ಸತ್ಯದ ಸುವಾರ್ತೆ
    author: ಅಜ್ಞಾತ; ವ್ಯಾಲೆಂಟಿನಸ್ ಅಥವಾ ಅವನ ಪಂಥಕ್ಕೆ ಸೇರಿದ್ದೆಂದು ವ್ಯಾಪಕವಾಗಿ ಹೇಳಲಾಗುತ್ತದೆ.
    audience: ವ್ಯಾಲೆಂಟಿನಿಯನ್ ನಾಸ್ಟಿಕ ಚಳವಳಿಯೊಳಗಿನ ಕ್ರೈಸ್ತ ಓದುಗರು.
    date: ಸುಮಾರು ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗ; ನಾಗ್ ಹಮ್ಮಾಡಿಯಲ್ಲಿ ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
    chapters:
      '1':
        title: ಕೃಪೆಯು ತಂದೆಯ ಸತ್ಯವನ್ನು ಪ್ರಕಟಿಸುತ್ತದೆ
      '2':
        title: ಮರೆವು ತಪ್ಪನ್ನು ಬಲಪಡಿಸುತ್ತದೆ
      '3':
        title: ತಂದೆಯು ಮಕ್ಕಳಿಗೆ ಜ್ಞಾನವನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '4':
        title: ಹೆಸರಿನಿಂದ ಕರೆಯಲ್ಪಟ್ಟವರು ವಿಶ್ರಾಂತಿ ಪಡೆಯುತ್ತಾರೆ
      '5':
        title: ಯೇಸು ಎಲ್ಲವನ್ನೂ ಪೂರ್ಣತೆಗೆ ತರುತ್ತಾನೆ
      '6':
        title: ವಾಕ್ಯವು ತಪ್ಪನ್ನು ಸೀಳಿ ಹಾದುಹೋಗುತ್ತದೆ
      '7':
        title: ತಂದೆಯು ಹೆಸರಿಸಿ ಅಸ್ತಿತ್ವಕ್ಕೆ ತರುತ್ತಾನೆ
      '8':
        title: ಬೆಳಕು ಭಯವು ಏನೂ ಅಲ್ಲವೆಂದು ತೋರಿಸುತ್ತದೆ
      '9':
        title: ಅವನು ಅವರಿಗೆ ಬೆಳಕು ಮತ್ತು ಜೀವವನ್ನು ಬೋಧಿಸಿದನು
      '10':
        title: ಕುರುಬನು ಆ ಒಂದು ಕುರಿಯನ್ನು ಹುಡುಕುತ್ತಾನೆ
      '11':
        title: ತಿಳಿವಳಿಕೆಯು ಕುರುಡರನ್ನು ಎಚ್ಚರಿಸುತ್ತದೆ
      '12':
        title: ಬೆಳಕು ಪಾಪಗಳಿಂದ ವಿಮೋಚನೆ ತರುತ್ತದೆ
      '13':
        title: ಅವನು ಚಿತ್ತವನ್ನು ಬೆಳಕಿನಲ್ಲಿ ತಿಳಿಸುತ್ತಾನೆ
      '14':
        title: ತಂದೆಯು ಪ್ರಿಯ ಮಗನಿಗೆ ಹೆಸರಿಡುತ್ತಾನೆ
      '15':
        title: ತಂದೆಯೊಳಗೆ ಸತ್ಯವು ವಿಶ್ರಮಿಸುತ್ತದೆ
      '16':
        title: ನಾನು ತಂದೆಗೆ ನನ್ನನ್ನು ಸಮರ್ಪಿಸಿಕೊಳ್ಳುತ್ತೇನೆ
  Jubilees:
    display_name: ಜೂಬಿಲೀಸ್
    author: ಅಜ್ಞಾತ; ಮೋಶೆಗೆ ಸೀನಾಯಿಯಲ್ಲಿ ದೊರೆತ ಪ್ರಕಟಣೆಯಾಗಿ ನಿರೂಪಿಸಲಾಗಿದೆ.
    audience: 364 ದಿನಗಳ ಸೌರಮಾನ ಪಂಚಾಂಗ ಮತ್ತು ಕಟ್ಟುನಿಟ್ಟಾದ ಹಲಾಖಾಗೆ ಬದ್ಧವಾಗಿದ್ದ ಯೆಹೂದ್ಯ ಸಮುದಾಯಗಳು (ಬಹುಶಃ ಕುಮ್ರಾನ್‌ನ ಅದೇ ಪರಿಸರಕ್ಕೆ ಸೇರಿದವರು).
    date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗ; ಗೀಝ್ (ಇಥಿಯೋಪಿಕ್) ಭಾಷೆಯಲ್ಲಿ ಪೂರ್ಣವಾಗಿ ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
    chapters:
      '1':
        title: ಮೋಶೆ ಕರುಣೆಗಾಗಿ ಬೇಡಿಕೊಳ್ಳುತ್ತಾನೆ
      '2':
        title: ಇಸ್ರಾಯೇಲಿಗೆ ಸಬ್ಬತ್ತಿನ ಪವಿತ್ರತೆ
      '3':
        title: ಏದೆನಿನಲ್ಲಿ ಆದಾಮನು ಹವ್ವಳಿಗೆ ಹೆಸರಿಡುತ್ತಾನೆ
      '4':
        title: ಹನೋಕನು ನ್ಯಾಯತೀರ್ಪಿನ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '5':
        title: ಪಾಪದ ಕಾರಣ ಜಲಪ್ರಳಯ ವಿಧಿಸಲ್ಪಡುತ್ತದೆ
      '6':
        title: ಮಳೆಬಿಲ್ಲು ನೋಹನೊಂದಿಗಿನ ಒಡಂಬಡಿಕೆಗಳನ್ನು ದೃಢಪಡಿಸುತ್ತದೆ
      '7':
        title: ನೋಹನು ಸಂತತಿಗೆ ನೀತಿಯ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '8':
        title: ನೋಹನು ಭೂಮಿಯನ್ನು ಹಂಚುತ್ತಾನೆ
      '9':
        title: ಮಸ್ತೇಮನು ಆತ್ಮಗಳ ಮೇಲೆ ಆಳ್ವಿಕೆ ಬೇಡುತ್ತಾನೆ
      '10':
        title: ಬಾಬೆಲ್ ಗೋಪುರದ ಜನರು ಚದರಿಹೋಗುತ್ತಾರೆ
      '11':
        title: ಭ್ರಷ್ಟತೆಯ ನಡುವೆ ಸೆರೂಗನು ಮಗನಿಗೆ ಹೆಸರಿಡುತ್ತಾನೆ
      '12':
        title: ಪರಲೋಕದ ಭಾಷೆ ಮರುಸ್ಥಾಪನೆಯಾಗುತ್ತದೆ
      '13':
        title: ಅಬ್ರಾಮನು ಲೋಟನನ್ನು ರಕ್ಷಿಸಿ ದಶಮಾಂಶ ಕೊಡುತ್ತಾನೆ
      '14':
        title: ದೇವರು ಅಬ್ರಾಮನಿಗೆ ಮಹಾ ಪ್ರತಿಫಲದ ವಾಗ್ದಾನ ಮಾಡುತ್ತಾನೆ
      '15':
        title: ಸುನ್ನತಿಯು ಒಡಂಬಡಿಕೆಯ ಗುರುತಾಗುತ್ತದೆ
      '16':
        title: ಇಸಾಕನು ಹುಟ್ಟುತ್ತಾನೆ, ಸೊದೋಮ್ ನಾಶವಾಗುತ್ತದೆ
      '17':
        title: ಅಬ್ರಹಾಮನ ನಂಬಿಕೆ ಸಾಬೀತಾಯಿತು
      '18':
        title: ಚೀಯೋನಿನಲ್ಲಿ ಅಬ್ರಹಾಮನ ವಿಧೇಯತೆ ಪರೀಕ್ಷಿಸಲಾಯಿತು
      '19':
        title: ಅಬ್ರಹಾಮನ ಮರಣ ಮತ್ತು ಯಾಕೋಬನಿಗೆ ಆಶೀರ್ವಾದ
      '20':
        title: ಶುದ್ಧತೆಯನ್ನು ಪಾಲಿಸಲು ಅಬ್ರಹಾಮನ ಆಜ್ಞೆ
      '21':
        title: ನೀತಿವಂತನಾಗಿರಲು ಯಾಕೋಬನನ್ನು ಅಬ್ರಹಾಮನು ಆಶೀರ್ವದಿಸುತ್ತಾನೆ
      '22':
        title: ವಾರಗಳ ಹಬ್ಬದ ಸ್ಥಾಪನೆ
      '23':
        title: ಏಸಾವನ ಕೋಪದಿಂದ ಯಾಕೋಬನ ಪಲಾಯನ
      '24':
        title: ಲಾಬಾನನ ಬಳಿಯಲ್ಲಿ ಯಾಕೋಬನ ಸೇವೆ ಮತ್ತು ವಂಚನೆ
      '25':
        title: ಯಾಕೋಬನು ಕಾನಾನಿಗೆ ಹಿಂದಿರುಗುತ್ತಾನೆ
      '26':
        title: ಯಾಕೋಬ ಮತ್ತು ಏಸಾವರ ಸಂಧಾನ
      '27':
        title: ಏಸಾವನಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳುವಾಗ ಯಾಕೋಬನ ಕನಸು
      '28':
        title: ಲಾಬಾನನು ಯಾಕೋಬನನ್ನು ವಂಚಿಸಿ ಮದುವೆ ಮಾಡಿಸುತ್ತಾನೆ
      '29':
        title: ಯಾಕೋಬನು ಲಾಬಾನನಿಗೆ ತಿಳಿಯದಂತೆ ಹೊರಡುತ್ತಾನೆ
      '30':
        title: ದೀನಳಿಗಾಗಿ ಸಿಮೆಯೋನ ಮತ್ತು ಲೇವಿಯ ಪ್ರತೀಕಾರ
      '31':
        title: ಲೇವಿ ಮತ್ತು ಯೆಹೂದರನ್ನು ಇಸಾಕನು ಆಶೀರ್ವದಿಸುತ್ತಾನೆ
      '32':
        title: ಯಾಕೋಬನು ದಶಮಾಂಶ ಕೊಟ್ಟು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '33':
        title: ರೂಬೇನನು ಯಾಕೋಬನಿಗೆ ತೀವ್ರ ಅವಮಾನ ಮಾಡುತ್ತಾನೆ
      '34':
        title: ಯೋಸೇಫನು ಈಜಿಪ್ಟಿಗೆ ಮಾರಲ್ಪಟ್ಟ ದುರಂತ
      '35':
        title: ಮಕಪೇಲದ ಸಮೀಪ ರೆಬೆಕ್ಕಳ ಮರಣ
      '36':
        title: ಸಾಯುವ ಮೊದಲು ಇಸಾಕನ ಆಶೀರ್ವಾದ
      '37':
        title: ಏಸಾವನು ತನ್ನ ಪ್ರಮಾಣವನ್ನು ತ್ಯಜಿಸುತ್ತಾನೆ
      '38':
        title: ಯುದ್ಧದಲ್ಲಿ ಏಸಾವನನ್ನು ಯಾಕೋಬನು ಕೊಲ್ಲುತ್ತಾನೆ
      '39':
        title: ಪೋಟೀಫರನ ಹೆಂಡತಿಯನ್ನು ಯೋಸೇಫನು ಪ್ರತಿರೋಧಿಸುತ್ತಾನೆ
      '40':
        title: ಯೋಸೇಫನು ಈಜಿಪ್ಟಿನ ಆಡಳಿತಗಾರನಾಗುತ್ತಾನೆ
      '41':
        title: ಸಂತಾನಕ್ಕಾಗಿ ತಾಮಾರಳು ಯೆಹೂದನನ್ನು ವಂಚಿಸುತ್ತಾಳೆ
      '42':
        title: ಯೋಸೇಫನು ತನ್ನ ಸಹೋದರರನ್ನು ಪರೀಕ್ಷಿಸುತ್ತಾನೆ
      '43':
        title: ಬೆನ್ಯಾಮೀನನಿಗಾಗಿ ಯೆಹೂದನ ಮನವಿ
      '44':
        title: ಯಾಕೋಬನ ಈಜಿಪ್ಟ್ ಪ್ರಯಾಣ
      '45':
        title: ಇಸ್ರಾಯೇಲರು ಗೋಷೆನಿನಲ್ಲಿ ನೆಲೆಸುತ್ತಾರೆ
      '46':
        title: ಯೋಸೇಫನ ಅಧೀನದಲ್ಲಿ ಇಸ್ರಾಯೇಲರು ವೃದ್ಧಿಯಾಗುತ್ತಾರೆ
      '47':
        title: ಜೊಂಡುಗಳ ನಡುವೆ ಮೋಶೆಯನ್ನು ಅಡಗಿಸಲಾಗುತ್ತದೆ
      '48':
        title: ಮಸ್ತೇಮನು ಮೋಶೆಯ ಮೇಲೆ ದಾಳಿ ಮಾಡಿ ವಿಫಲನಾಗುತ್ತಾನೆ
      '49':
        title: ಪಸ್ಕದ ಕುರಿಮರಿಯನ್ನು ಇಡಿಯಾಗಿ ಸುಡಲಾಗುತ್ತದೆ
      '50':
        title: ಸಬ್ಬತ್ ವಿಶ್ರಾಂತಿ ಮತ್ತು ನಿಷಿದ್ಧ ಕೆಲಸಗಳು
  Psalms of Solomon:
    display_name: ಸೊಲೊಮೋನನ ಕೀರ್ತನೆಗಳು
    author: ಕರ್ತೃ ಅಜ್ಞಾತ; ಸೊಲೊಮೋನನ ಹೆಸರಿನಲ್ಲಿ ಕಾವ್ಯನಾಮದಿಂದ ರಚಿಸಲಾಗಿದೆ.
    audience: ಕ್ರಿ.ಪೂ. 63ರಲ್ಲಿ ಪೊಂಪೇಯನು ಯೆರೂಸಲೇಮನ್ನು ವಶಪಡಿಸಿಕೊಳ್ಳುವುದಕ್ಕೆ ಪ್ರತಿಕ್ರಿಯಿಸುತ್ತಿದ್ದ ಧರ್ಮನಿಷ್ಠ ಯೆಹೂದ್ಯರು.
    date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 1ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗ.
    chapters:
      '1':
        title: ನನ್ನ ಸಂಕಟದ ಮೊರೆಯನ್ನು ಕರ್ತನು ಕೇಳುತ್ತಾನೆ
      '2':
        title: ದೇವರು ಅಹಂಕಾರಿ ಪಾಪಿಗಳಿಗೆ ಶೀಘ್ರವಾಗಿ ನ್ಯಾಯತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '3':
        title: ನೀತಿವಂತರು ಕರ್ತನನ್ನು ನಿರಂತರವಾಗಿ ಸ್ತುತಿಸುತ್ತಾರೆ
      '4':
        title: ಕಪಟಿಯ ಗತಿ ನಾಚಿಕೆಗೇಡಿನ ಅಂತ್ಯ
      '5':
        title: ದೇವರು ಎಲ್ಲರಿಗೂ ಸಮೃದ್ಧವಾಗಿ ಒದಗಿಸುತ್ತಾನೆ
      '6':
        title: ಸಿದ್ಧವಾದ ಹೃದಯವು ಕರ್ತನನ್ನು ಕರೆಯುತ್ತದೆ
      '7':
        title: ಶತ್ರುಗಳ ಹಿಡಿತದಿಂದ ಕರ್ತನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '8':
        title: ಕರ್ತನು ಎಂದೆಂದಿಗೂ ನೀತಿಯಿಂದ ನ್ಯಾಯತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '9':
        title: ದೇವರ ಕರುಣೆಯಲ್ಲಿ ಇಸ್ರಾಯೇಲಿನ ನಿರೀಕ್ಷೆ
      '10':
        title: ಶಿಕ್ಷೆಯನ್ನು ಸ್ವೀಕರಿಸುವುದು ಶುದ್ಧೀಕರಣ ತರುತ್ತದೆ
      '11':
        title: ದೂರದ ನಾಡುಗಳಿಂದ ಇಸ್ರಾಯೇಲನ್ನು ಒಟ್ಟುಗೂಡಿಸು
      '12':
        title: ಗುಸುಗುಸು ಸುಳ್ಳುಗಳಿಂದ ನನ್ನನ್ನು ರಕ್ಷಿಸು
      '13':
        title: ನೀತಿವಂತರು ವಿನಾಶದಿಂದ ಮುಕ್ತರಾಗಿ ಜೀವಿಸುತ್ತಾರೆ
      '14':
        title: ನಂಬಿಗಸ್ತರು ಎಂದೆಂದಿಗೂ ಜೀವವೃಕ್ಷಗಳಂತೆ ಇರುವರು
      '15':
        title: ಸಂಕಟದಲ್ಲಿ ಕರ್ತನನ್ನು ಕರೆದಿದ್ದೇನೆ
      '16':
        title: ದೇವರ ಕರುಣೆ ನನ್ನನ್ನು ಎಚ್ಚರಗೊಳಿಸಿತು
      '17':
        title: ಕರ್ತನು ಸತ್ಯವಂತನಾದ ಶಾಶ್ವತ ಅರಸನು
      '18':
        title: ಕರುಣೆಯ ದಿನಕ್ಕಾಗಿ ಇಸ್ರಾಯೇಲನ್ನು ಶುದ್ಧಪಡಿಸು
  Shepherd of Hermas:
