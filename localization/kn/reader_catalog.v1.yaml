      '61':
        title: ಫಲವುಳ್ಳವರಿಗೆ ದೇವದೂತನು ಕಿರೀಟ ತೊಡಿಸುತ್ತಾನೆ
      '62':
        title: ಮರವು ದೇವರ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಪ್ರತಿನಿಧಿಸುತ್ತದೆ
      '63':
        title: ಮರುನೆಟ್ಟ ಕೋಲುಗಳನ್ನು ಕುರುಬನು ಬೇರ್ಪಡಿಸುತ್ತಾನೆ
  Thunder, Perfect Mind:
