book_localizations:
- source_title: Genesis
  title: ಆದಿಕಾಂಡ
  author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಸಂಪ್ರದಾಯದ ಪ್ರಕಾರ ಇದನ್ನು ಮೋಶೆಗೆ ಸೇರಿಸಿದ ಕೃತಿ ಎಂದು ಹೇಳಲಾಗುತ್ತದೆ. ಆಧುನಿಕ ವಿದ್ವಾಂಸರು ಇದಕ್ಕೆ ದೀರ್ಘ ರಚನಾ ಇತಿಹಾಸವಿದ್ದು, ವಿವಿಧ ಮೂಲಗಳನ್ನು ನಂತರ ಒಟ್ಟಾಗಿ ಸಂಪಾದಿಸಲಾಗಿದೆ ಎಂದು ಪರಿಗಣಿಸುತ್ತಾರೆ.
  audience: ಒಡಂಬಡಿಕೆಯ ಗುರುತಿನಲ್ಲಿ ರೂಪುಗೊಂಡ ಇಸ್ರಾಯೇಲು; ದೇವರ ಸೃಷ್ಟಿ, ಆಯ್ಕೆ ಮತ್ತು ವಾಗ್ದಾನಗಳಲ್ಲಿ ಜನರ ಮೂಲಗಾಥೆಯನ್ನು ನೆಲೆಗೊಳಿಸುವ ಕೃತಿ.
  date: ಹಲವಾರು ಶತಮಾನಗಳ ಅವಧಿಯಲ್ಲಿ ರಚಿಸಲಾಯಿತು; ಬಾಬೆಲಿನ ದೇಶಭ್ರಷ್ಟತೆಯ ಕಾಲದಲ್ಲಿ ಅಥವಾ ಅದರ ನಂತರ, ಸುಮಾರು ಕ್ರಿ.ಪೂ. 6–5ನೇ ಶತಮಾನದಲ್ಲಿ ಈಗ ದೊರಕಿರುವ ರೂಪವನ್ನು ತಲುಪಿತು.
  summary: ಆದಿಕಾಂಡವು ಸೃಷ್ಟಿ, ಮಾನವರ ಬಂಡಾಯ ಮತ್ತು ಚದುರುವಿಕೆ, ಹಾಗೂ ಇಸ್ರಾಯೇಲಿಗೆ ದೇವರು ನೀಡಿದ ಒಡಂಬಡಿಕೆಯ ವಾಗ್ದಾನಗಳು ಆರಂಭವಾಗುವ ಅಬ್ರಹಾಮ, ಇಸಾಕ, ಯಾಕೋಬ ಮತ್ತು ಯೋಸೇಫರ ಕುಟುಂಬದ ಕಥೆಯನ್ನು ಹೇಳುತ್ತದೆ.
- source_title: John
  title: ಯೋಹಾನನ ಸುವಾರ್ತೆ
  author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಸಂಪ್ರದಾಯವು ಇದನ್ನು ಅಪೊಸ್ತಲನಾದ ಯೋಹಾನನಿಗೆ ಅಥವಾ “ಪ್ರಿಯ ಶಿಷ್ಯನಿಗೆ” ಸೇರಿಸುತ್ತದೆ.
  audience: ಸಭಾಮಂದಿರಕೇಂದ್ರಿತ ಯೆಹೂದ್ಯ ಧರ್ಮದೊಂದಿಗೆ ಉದ್ವಿಗ್ನ ಸಂಬಂಧದಲ್ಲಿದ್ದ ಮತ್ತು ಪ್ರಿಯ ಶಿಷ್ಯನ ಸಾಕ್ಷಿಯ ಸುತ್ತ ರೂಪುಗೊಂಡ ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
  date: ಸುಮಾರು ಕ್ರಿ.ಶ. 90–110.
  summary: ಯೋಹಾನನ ಸುವಾರ್ತೆಯು ಯೇಸುವನ್ನು ತಂದೆಯನ್ನು ಪ್ರಕಟಿಸುವ, ತನ್ನಲ್ಲಿ ಭರವಸೆಯಿಡುವವರಿಗೆ ಜೀವ ನೀಡುವ ಮತ್ತು ತನ್ನ ಸೂಚಕಕಾರ್ಯಗಳು, ಮರಣ ಹಾಗೂ ಪುನರುತ್ಥಾನದ ಮೂಲಕ ಮಹಿಮೆಗೊಳ್ಳುವ ನಿತ್ಯ ವಾಕ್ಯನಾಗಿ ಚಿತ್ರಿಸುತ್ತದೆ.
- source_title: Gospel of Thomas
  title: ತೋಮನ ಸುವಾರ್ತೆ
  author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಆರಂಭಿಕ ವಾಕ್ಯವು ಈ ವಚನಸಂಗ್ರಹವನ್ನು “ದಿದಿಮೋಸ್ ಯೂದ ತೋಮ”ನಿಗೆ ಸೇರಿಸುತ್ತದೆ. ನಾಗ್ ಹಮ್ಮಾದಿಯಲ್ಲಿ ದೊರೆತ 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಅನುವಾದದಲ್ಲಿ ಮಾತ್ರ ಇದು ಸಂಪೂರ್ಣವಾಗಿ ಉಳಿದಿದೆ (NHC II,2); ಆಕ್ಸಿರಿಂಕಸ್‌ನಿಂದ ಗ್ರೀಕ್ ಭಾಷೆಯ ಮೂರು ತುಣುಕುಗಳೂ ದೊರೆತಿವೆ.
  audience: ಸಿರಿಯದ ಜ್ಞಾನಸಾಹಿತ್ಯ ಮತ್ತು ಪ್ರಾರಂಭಿಕ ಜ್ಞಾನವಾದಿ ಚಿಂತನೆಯಿಂದ ರೂಪುಗೊಂಡ, ಯೇಸುವಿನ ವಚನಗಳಲ್ಲಿನ ಗೂಢ ಆತ್ಮಜ್ಞಾನದ ಕಡೆಗೆ ಒಲವು ಹೊಂದಿದ್ದ ಕ್ರೈಸ್ತ ಓದುಗರು.
  date: ಮೂಲ ಗ್ರೀಕ್ ಕೃತಿ ಬಹುಶಃ ಸುಮಾರು ಕ್ರಿ.ಶ. 50–140; ಕಾಪ್ಟಿಕ್ ಹಸ್ತಪ್ರತಿ ಸುಮಾರು ಕ್ರಿ.ಶ. 340.
  summary: ತೋಮನ ಸುವಾರ್ತೆಯು ಯೇಸುವಿಗೆ ಸೇರಿಸಿದ ವಚನಗಳ ಸಂಗ್ರಹವಾಗಿದೆ. ಇದರಲ್ಲಿ ನಿರಂತರವಾದ ಕಥೆಯಿಲ್ಲ; ಈ ವಚನಗಳ ಅರ್ಥವನ್ನು ಕಂಡುಕೊಳ್ಳುವಂತೆ ಅದು ಓದುಗರನ್ನು ಪದೇಪದೇ ಕರೆಯುತ್ತದೆ.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: ಆದಿಕಾಂಡ 1:1
  text: ದೇವರು ಆಕಾಶವನ್ನೂ ಭೂಮಿಯನ್ನೂ ಸೃಷ್ಟಿಸಲು ಆರಂಭಿಸಿದಾಗ[a]—
  translator_note: '[a] ಸಾಂಪ್ರದಾಯಿಕ ಅನುವಾದವು ಇದನ್ನು ಪೂರ್ಣ ವಾಕ್ಯವಾಗಿ ಪರಿಗಣಿಸುತ್ತದೆ: “ಆದಿಯಲ್ಲಿ ದೇವರು ಆಕಾಶವನ್ನೂ ಭೂಮಿಯನ್ನೂ ಸೃಷ್ಟಿಸಿದನು.” ಆದರೆ ಹೀಬ್ರೂ ಭಾಷೆಯ ರಚನೆಯು ಮುಂದಿನ ವಿಷಯವನ್ನು ಪರಿಚಯಿಸುವಂತೆ ಹೆಚ್ಚು ಸಹಜವಾಗಿದೆ; ಮುಖ್ಯ ಕ್ರಿಯೆ 3ನೇ ವಚನದಲ್ಲಿರುವ “ದೇವರು ಹೇಳಿದನು” ಎಂಬುದಾಗಿದೆ.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: ಪ್ರಸಂಗಿ 1:2
  text: “ಆವಿಯೇ ಆವಿ[a],” ಎಂದು ಕೊಹೆಲೆತ್[b] ಹೇಳುತ್ತಾನೆ. “ಎಲ್ಲವೂ ಆವಿ—ಕ್ಷಣಿಕವಾದದ್ದು, ಹಿಡಿದಿಟ್ಟುಕೊಳ್ಳಲಾಗದ್ದು ಮತ್ತು ಅನೇಕ ಬಾರಿ ನಾವು ನಿರೀಕ್ಷಿಸಿದಂತಿರದದ್ದು.”
  translator_note: '[a] ಹೀಬ್ರೂ ಭಾಷೆಯ ‘ಹೆವೆಲ್’ ಎಂಬ ಪದಕ್ಕೆ ಅಕ್ಷರಶಃ ‘ಉಸಿರು’ ಅಥವಾ ‘ಆವಿ’ ಎಂದು ಅರ್ಥ. ಪ್ರಸಂಗಿ ಪುಸ್ತಕದಾದ್ಯಂತ ಅದು ಬೇಗನೆ ಕಳೆದುಹೋಗುವುದನ್ನು, ಹಿಡಿದಿಟ್ಟುಕೊಳ್ಳಲು ಅಥವಾ ಪೂರ್ಣವಾಗಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಆಗದಿರುವುದನ್ನು ಮತ್ತು ಜನರು ನಿರೀಕ್ಷಿಸಿದ್ದಕ್ಕಿಂತ ಭಿನ್ನವಾಗಿ ಪರಿಣಮಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ. “ಯಾವುದಕ್ಕೂ ಅರ್ಥವಿಲ್ಲ” ಎಂದು ಹೇಳದೆ ಈ ಚಿತ್ರಣವನ್ನು ಉಳಿಸಲು ಇಲ್ಲಿ “ಆವಿ” ಎಂದು ಅನುವಾದಿಸಲಾಗಿದೆ. “ಉಸಿರು,” “ಕೇವಲ ಉಸಿರು” ಮತ್ತು “ಕ್ಷಣಿಕವಾದದ್ದು” ಎಂಬ ಅನುವಾದಗಳೂ ಸಾಧ್ಯ. [b] ‘ಕೊಹೆಲೆತ್’ ಎಂಬುದು ಲೇಖಕರ ಹೀಬ್ರೂ ಹೆಸರು ಅಥವಾ ಬಿರುದು. ಇದನ್ನು ಅನೇಕ ಬಾರಿ “ಬೋಧಕ” ಅಥವಾ “ಪ್ರಸಂಗಿ” ಎಂದು ಅನುವಾದಿಸಲಾಗುತ್ತದೆ. ಆದರೆ ಒಂದೇ ಅರ್ಥವಿವರಣೆಗೆ ಆದ್ಯತೆ ನೀಡದೆ ಸಾಧ್ಯವಿರುವ ಎಲ್ಲ ಅರ್ಥಗಳಿಗೆ ಅವಕಾಶ ಕೊಡಲು ಇಲ್ಲಿ ‘ಕೊಹೆಲೆತ್’ ಎಂಬ ಹೆಸರನ್ನೇ ಉಳಿಸಲಾಗಿದೆ.'
- source_path: nt/john/001/001.yaml
  reference: ಯೋಹಾನ 1:1
  text: ಆದಿಯಲ್ಲಿ[b], ವಾಕ್ಯನು ಆಗಲೇ ಅಸ್ತಿತ್ವದಲ್ಲಿದ್ದನು. ವಾಕ್ಯನು ದೇವರೊಂದಿಗಿದ್ದನು, ಮತ್ತು ವಾಕ್ಯನು ದೇವರಾಗಿದ್ದನು.[a]
  translator_note: '[a] “ವಾಕ್ಯನು ದೈವಿಕನಾಗಿದ್ದನು” ಅಥವಾ “ದೇವರು ಹೇಗಿದ್ದನೋ ವಾಕ್ಯನೂ ಹಾಗೆಯೇ ಇದ್ದನು” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. ಗ್ರೀಕ್ ಭಾಷೆಯ ಪದರಚನೆಯು ವಾಕ್ಯನು ಸಂಪೂರ್ಣವಾಗಿ ದೇವರು ಎಂಬುದನ್ನು ದೃಢಪಡಿಸುವುದರ ಜೊತೆಗೆ, ಹಿಂದಿನ ವಾಕ್ಯಭಾಗದಲ್ಲಿರುವ ದೇವರಿಂದ ವಾಕ್ಯನನ್ನು ಪ್ರತ್ಯೇಕಿಸುತ್ತದೆ. [b] ಈ ಆರಂಭವು ಆದಿಕಾಂಡ 1:1ನ್ನು ಪ್ರತಿಧ್ವನಿಸಿ, ವಾಕ್ಯನನ್ನು ಸೃಷ್ಟಿಯ ಆರಂಭದೊಂದಿಗೆ ಜೋಡಿಸುತ್ತದೆ. “ಆಗಲೇ ಅಸ್ತಿತ್ವದಲ್ಲಿದ್ದನು” ಎಂಬುದು, ಆರಂಭವು ಬಂದಾಗ ವಾಕ್ಯನು ಅಸ್ತಿತ್ವದಲ್ಲಿದ್ದನೇ ಹೊರತು ಆಗ ಅಸ್ತಿತ್ವಕ್ಕೆ ಬಂದವನಲ್ಲ ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ; “ಇದ್ದನು” ಅಥವಾ “ಅಸ್ತಿತ್ವದಲ್ಲಿದ್ದನು” ಎಂಬ ಅನುವಾದಗಳೂ ಸಾಧ್ಯ.'
- source_path: nt/romans/003/025.yaml
  reference: ರೋಮಾಪುರದವರಿಗೆ 3:25
  text: ದೇವರು ಅವನನ್ನು, ಅವನ ರಕ್ತದ ಮೇಲಿನ ನಂಬಿಕೆಯ ಮೂಲಕ, ಪ್ರಾಯಶ್ಚಿತ್ತದ ಬಲಿಯಾಗಿ[a] ಮುಂದಿಟ್ಟನು.[b] ಹಿಂದೆ ಮಾಡಿದ ಪಾಪಗಳನ್ನು ದೇವರು ದಂಡಿಸದೆ ಬಿಟ್ಟಿದ್ದರಿಂದ, ತನ್ನ ನೀತಿಯನ್ನು[c] ತೋರಿಸುವುದಕ್ಕಾಗಿ ಹೀಗೆ ಮಾಡಿದನು.
  translator_note: '[a] “ದೇವರ ಕೋಪವನ್ನು ಶಮನಗೊಳಿಸುವ ಬಲಿ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು; ಅಥವಾ ಹಳೆಯ ಒಡಂಬಡಿಕೆಯಲ್ಲಿ ಪ್ರಾಯಶ್ಚಿತ್ತದ ರಕ್ತವನ್ನು ಚಿಮುಕಿಸಲಾಗುತ್ತಿದ್ದ ಒಡಂಬಡಿಕೆಯ ಮಂಜೂಷದ ಚಿನ್ನದ ಮುಚ್ಚಳವಾದ “ಕೃಪಾಸನ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. [b] “ನಂಬಿಕೆಯ ಮೂಲಕ, ಅವನ ರಕ್ತದಿಂದ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು. [c] “ನ್ಯಾಯ” ಎಂದೂ ಅನುವಾದಿಸಬಹುದು.'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 ಪೇತ್ರ 1:13
  text: ಆದ್ದರಿಂದ, ಕ್ರಿಯೆಗೆ ಸಿದ್ಧರಾಗುವಂತೆ ನಿಮ್ಮ ಮನಸ್ಸುಗಳನ್ನು ಸಜ್ಜುಗೊಳಿಸಿರಿ.[a] ಸಂಪೂರ್ಣವಾಗಿ ಸ್ಪಷ್ಟಬುದ್ಧಿಯುಳ್ಳವರಾಗಿರಿ; ಯೇಸು ಮೆಸ್ಸೀಯನು ಪ್ರಕಟವಾಗುವಾಗ ನಿಮಗೆ ತರಲಾಗುವ ಕೃಪೆಯ ಮೇಲೆ ನಿಮ್ಮ ನಿರೀಕ್ಷೆಯನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಇಡಿರಿ.[b]
  translator_note: '[a] ಗ್ರೀಕ್ ಭಾಷೆಯಲ್ಲಿ ಅಕ್ಷರಶಃ, “ನಿಮ್ಮ ಮನಸ್ಸಿನ ಸೊಂಟವನ್ನು ಬಿಗಿಯಾಗಿ ಕಟ್ಟಿಕೊಳ್ಳಿರಿ” ಎಂದಿದೆ. ಕ್ರಿಯೆಗೆ ಸಿದ್ಧರಾಗಲು ಉದ್ದವಾದ ಉಡುಪನ್ನು ಸೊಂಟದ ಸುತ್ತ ಎತ್ತಿಕಟ್ಟಿಕೊಳ್ಳುವ ಚಿತ್ರಣ ಇದರಲ್ಲಿದೆ. [b] “ಸಂಪೂರ್ಣವಾಗಿ” ಎಂದು ಅನುವಾದಿಸಿದ ಗ್ರೀಕ್ ಪದವು ಸ್ಪಷ್ಟಬುದ್ಧಿಯುಳ್ಳವರಾಗಿರುವುದಕ್ಕೆ, ನಿರೀಕ್ಷೆಯನ್ನು ಇಡುವುದಕ್ಕೆ ಅಥವಾ ಬಹುಶಃ ಎರಡಕ್ಕೂ ಅನ್ವಯಿಸಬಹುದು.'
