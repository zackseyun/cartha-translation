  summary: ಮೆಟಾಡೇಟಾ ಮತ್ತು UI ಬಹುಪಾಲು ಸಹಜವಾಗಿವೆ. ರೋಮಾಪುರದವರಿಗೆ 3:25ರಲ್ಲಿ ಮುಖ್ಯಪಾಠವು ‘faith in his blood’ ಅನ್ನು ಅಸ್ಪಷ್ಟ/ತಪ್ಪು ರೀತಿಯಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಿತ್ತು; ಅದನ್ನು ಸರಿಪಡಿಸಲಾಗಿದೆ. ಕೆಲವು ವಾಕ್ಯರಚನೆ, ಉಲ್ಲೇಖಚಿಹ್ನೆ, ಮತ್ತು ಟಿಪ್ಪಣಿಗಳಲ್ಲಿನ ಕನ್ನಡವನ್ನು ಮೂಲದ ಅರ್ಥ ಹಾಗೂ ಆಧುನಿಕ ಬಳಕೆಗೆ ಹೊಂದುವಂತೆ ಪರಿಷ್ಕರಿಸಲಾಗಿದೆ.
  issues:
  - ರೋಮಾಪುರದವರಿಗೆ 3:25ರ ‘ಅವನ ರಕ್ತದಲ್ಲಿಡುವ ನಂಬಿಕೆ’ ಎಂಬುದು ಅಸಹಜವಾಗಿದ್ದು, ನಂಬಿಕೆಯ ವಸ್ತು/ಮಾಧ್ಯಮದ ಸಂಬಂಧವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಲಿಲ್ಲ.
  - ಪ್ರಸಂಗಿ 1:2ರಲ್ಲಿ ‘ನಿರೀಕ್ಷಿಸಿದಂತಿರದ್ದು’ ಎಂಬ ರೂಪವನ್ನು ವ್ಯಾಕರಣಸಮ್ಮತ ‘ನಿರೀಕ್ಷಿಸಿದಂತಿರದದ್ದು’ ಎಂದು ಸರಿಪಡಿಸಲಾಗಿದೆ.
  - 1 ಪೇತ್ರ 1:13ರ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ಅಕ್ಷರಶಃ ರೂಪಕದ ಕನ್ನಡವನ್ನು ‘ಮನಸ್ಸಿನ ಸೊಂಟವನ್ನು ಬಿಗಿಯಾಗಿ ಕಟ್ಟಿಕೊಳ್ಳಿರಿ’ ಎಂದು ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.
  - ಆದಿಕಾಂಡದ ಗುರಿಓದುಗರ ವಿವರಣೆಯನ್ನು ಮೂಲದ ‘Israel in covenant identity’ ಮತ್ತು ಜನರ ಮೂಲಗಾಥೆಯ ಆಶಯವನ್ನು ಹೆಚ್ಚು ನೇರವಾಗಿ ಪ್ರತಿಬಿಂಬಿಸುವಂತೆ ಪರಿಷ್ಕರಿಸಲಾಗಿದೆ.
