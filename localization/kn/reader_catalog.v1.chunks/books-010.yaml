status: reviewed
payload:
  book_metadata:
    Joel:
      display_name: ಯೋವೇಲ
      author: ಪೆತೂವೇಲನ ಮಗ ಯೋವೇಲ.
      audience: ಮಿಡತೆಗಳ ಹಾವಳಿಯನ್ನು ಯೆಹೋವನ ದಿನದ ಸೂಚನೆಯಾಗಿ ಕಂಡು ಅದಕ್ಕೆ ಸ್ಪಂದಿಸುತ್ತಿದ್ದ, ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಯೆಹೂದದ ಜನರು.
      date: ಬಹುಶಃ ಕ್ರಿ.ಪೂ. 5–4ನೇ ಶತಮಾನ.
    Amos:
      display_name: ಆಮೋಸ
      author: ತೆಕೋವದ ಆಮೋಸ; ಉತ್ತರ ರಾಜ್ಯದಲ್ಲಿ ಸಾರಿದ ಯೆಹೂದದ ಕುರುಬ.
      audience: ಯಾರೊಬ್ಬಾಮ IIನ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಸಮೃದ್ಧಿಯ ಜೊತೆಗೆ ಅನ್ಯಾಯವೂ ನೆಲೆಸಿದ್ದ ಕಾಲದ ಉತ್ತರ ಇಸ್ರಾಯೇಲ್.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 760–750.
    Obadiah:
      display_name: ಓಬದ್ಯ
      author: ಓಬದ್ಯ.
      audience: ಎದೋಮ್ ಯೆರೂಸಲೇಮಿಗೆ ದ್ರೋಹ ಮಾಡಿದ ನಂತರದ ಯೆಹೂದ; ಎದೋಮಿನ ಪತನದ ಕುರಿತ ಪ್ರವಾದನೆ.
      date: ಕ್ರಿ.ಪೂ. 586ರ ಸ್ವಲ್ಪ ಸಮಯದ ನಂತರ.
    Jonah:
      display_name: ಯೋನ
      author: ಲೇಖಕ ಅಜ್ಞಾತ; ಕಥೆಯ ಮುಖ್ಯ ಪಾತ್ರ ಅಮಿತ್ತೈಯ ಮಗ ಯೋನ.
      audience: ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಇಸ್ರಾಯೇಲ್; ಜನಾಂಗೀಯ ಸಂಕುಚಿತ ಮನೋಭಾವವನ್ನು ವ್ಯಂಗ್ಯವಾಗಿ ಖಂಡಿಸಿ, ಹೊರಗಿನವರ ಮೇಲೆಯೂ ದೇವರ ಕರುಣೆ ಇದೆ ಎಂದು ದೃಢಪಡಿಸುವ ಕೃತಿ.
      date: ಬಹುಶಃ ಕ್ರಿ.ಪೂ. 5–4ನೇ ಶತಮಾನ.
    Micah:
      display_name: ಮೀಕ
      author: ಮೋರೆಷೆತಿನ ಮೀಕ.
      audience: ಕ್ರಿ.ಪೂ. 8ನೇ ಶತಮಾನದ ಕೊನೆಯ ಭಾಗದ ಯೆಹೂದ; ವಿಶೇಷವಾಗಿ ನಗರಗಳ ಪ್ರಭಾವಿ ವರ್ಗದಿಂದ ಶೋಷಣೆಗೆ ಒಳಗಾದ ಗ್ರಾಮೀಣ ಬಡವರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 740–700.
    Nahum:
      display_name: ನಹೂಮ
      author: ಎಲ್ಕೋಷಿನ ನಹೂಮ.
      audience: ನಿನೆವೆಯ ಸನ್ನಿಹಿತ ಪತನವನ್ನು ಸಂಭ್ರಮಿಸುತ್ತಿದ್ದ ಯೆಹೂದ.
      date: ಕ್ರಿ.ಪೂ. 612ಕ್ಕೆ ಸ್ವಲ್ಪ ಮೊದಲು.
    Habakkuk:
      display_name: ಹಬಕ್ಕೂಕ
      author: ಹಬಕ್ಕೂಕ.
      audience: ಬಾಬೆಲಿನ ಉದಯವನ್ನು ಎದುರಿಸುತ್ತಿದ್ದ ಯೆಹೂದ; ನ್ಯಾಯದ ಕುರಿತು ಪ್ರವಾದಿಯು ದೇವರೊಂದಿಗೆ ನಡೆಸುವ ಸಂವಾದ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 7ನೇ ಶತಮಾನದ ಕೊನೆಯ ಭಾಗ.
    Zephaniah:
      display_name: ಚೆಫನ್ಯ
      author: ಕೂಷಿಯ ಮಗ ಚೆಫನ್ಯ.
      audience: ಯೋಷೀಯನ ಸುಧಾರಣೆಗಳ ಮುನ್ನಾದಿನಗಳಲ್ಲಿ, ಅವನ ಆಳ್ವಿಕೆಗೆ ಒಳಪಟ್ಟಿದ್ದ ಯೆಹೂದ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 640–609.
    Haggai:
      display_name: ಹಗ್ಗಾಯ
      author: ಹಗ್ಗಾಯ.
      audience: ದಾರ್ಯಾವೆಷನ ಆಳ್ವಿಕೆಯಲ್ಲಿ ದೇವಾಲಯವನ್ನು ಪುನರ್‌ನಿರ್ಮಿಸುತ್ತಿದ್ದ ಹಿಂದಿರುಗಿದವರು.
      date: ಕ್ರಿ.ಪೂ. 520.
    Zechariah:
      display_name: ಜೆಕರ್ಯ
      author: ಬೆರೆಕ್ಯನ ಮಗ ಜೆಕರ್ಯ; 9–14ನೇ ಅಧ್ಯಾಯಗಳು ಬಹುಶಃ ನಂತರದ ಮತ್ತೊಬ್ಬ ಲೇಖಕರಿಂದ ಬಂದವು.
      audience: ದೇವಾಲಯವನ್ನು ಪುನರ್‌ನಿರ್ಮಿಸುತ್ತಿದ್ದ ಹಿಂದಿರುಗಿದವರು ಮತ್ತು ನಂತರದ ದೇಶಭ್ರಷ್ಟೋತ್ತರ ಸಮುದಾಯಗಳು.
      date: 1–8ನೇ ಅಧ್ಯಾಯಗಳು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 520–518; 9–14ನೇ ಅಧ್ಯಾಯಗಳು ಬಹುಶಃ ಸುಮಾರು ಒಂದು ಶತಮಾನದ ನಂತರ.
    Malachi:
      display_name: ಮಲಾಕಿ
      author: ಲೇಖಕ ಅಜ್ಞಾತ; “ಮಲಾಕಿ” ಎಂದರೆ “ನನ್ನ ದೂತ.”
      audience: ಪರ್ಷಿಯರ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಆರಾಧನೆ ಮತ್ತು ನಿಷ್ಠೆಯಲ್ಲಿ ಅಲಕ್ಷ್ಯ ತೋರತೊಡಗಿದ್ದ ದೇಶಭ್ರಷ್ಟೋತ್ತರ ಯೆಹೂದ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 5ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗ.
    Matthew:
      display_name: ಮತ್ತಾಯ
      author: ಲೇಖಕ ಅಜ್ಞಾತ; ಸಂಪ್ರದಾಯವು ಇದನ್ನು ಅಪೊಸ್ತಲನಾದ ಮತ್ತಾಯನಿಗೆ ಸೇರಿಸುತ್ತದೆ. ಆಧುನಿಕ ವಿದ್ವಾಂಸರ ಪ್ರಕಾರ, ಮಾರ್ಕನ ಬರಹ ಮತ್ತು Q-ಗೆ ಹೋಲುವ ಮೂಲವನ್ನು ಬಳಸಿದ ಗ್ರೀಕ್ ಭಾಷಿಕ ಯೆಹೂದಿ-ಕ್ರೈಸ್ತ ಲೇಖಕನು ಇದನ್ನು ಬರೆದಿರಬಹುದು.
      audience: ಸಭಾಮಂದಿರಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಯೆಹೂದಿ ಧರ್ಮದೊಂದಿಗೆ ತಮಗಿರುವ ನಿರಂತರತೆ ಮತ್ತು ಭಿನ್ನತೆಯ ಪ್ರಶ್ನೆಗಳನ್ನು ಎದುರಿಸುತ್ತಿದ್ದ ಯೆಹೂದಿ-ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 80–90.
    Mark:
      display_name: ಮಾರ್ಕ
      author: ಲೇಖಕ ಅಜ್ಞಾತ; ಸಂಪ್ರದಾಯವು ಇದನ್ನು ಪೇತ್ರನ ಪ್ರಯಾಣ ಸಂಗಾತಿಯಾದ ಯೋಹಾನ ಮಾರ್ಕನೊಂದಿಗೆ ಸಂಬಂಧಿಸುತ್ತದೆ.
      audience: ಬಹುಶಃ ರೋಮಿನಲ್ಲಿ, ಹಿಂಸೆಯ ಬೆದರಿಕೆಯ ನಡುವೆ ಅಥವಾ ಅದರ ಸಮೀಪದ ಕಾಲದಲ್ಲಿ ಇದ್ದ ಗ್ರೀಕ್ ಭಾಷಿಕ ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 65–75; ಯೆಹೂದ್ಯರ ಯುದ್ಧ ಮತ್ತು ದೇವಾಲಯದ ನಾಶದ ಕಾಲದ ಆಸುಪಾಸಿನಲ್ಲಿ.
  chapter_titles:
    Hosea:
      '12':
        title: ಸುಳ್ಳು ಮತ್ತು ಹಿಂಸೆಗೆ ನ್ಯಾಯತೀರ್ಪಿನ ಪ್ರತಿಫಲ
      '13':
        title: ಒಮ್ಮೆ ಬಲಿಷ್ಠನಾಗಿದ್ದ ಎಫ್ರಾಯೀಮ್ ಈಗ ಓಡಿಹೋಗುತ್ತಾನೆ
      '14':
        title: ಇಸ್ರಾಯೇಲ್ ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟು ಕರುಣೆಯನ್ನು ಕೋರುತ್ತದೆ
    Joel:
      '1':
        title: ಯೋವೇಲನು ಉಪವಾಸಕ್ಕೆ ಕರೆಕೊಡುತ್ತಾನೆ
      '2':
        title: ಪೂರ್ಣ ಹೃದಯದಿಂದ ಹಿಂದಿರುಗಿರಿ
      '3':
        title: ಎಲ್ಲರ ಮೇಲೂ ಆತ್ಮದ ಸುರಿಸುವಿಕೆ
      '4':
        title: ನ್ಯಾಯತೀರ್ಪಿಗಾಗಿ ಜನಾಂಗಗಳು ಸೇರುತ್ತವೆ
    Amos:
      '1':
        title: ಜನಾಂಗಗಳ ಕ್ರೌರ್ಯಕ್ಕೆ ದೇವರ ನ್ಯಾಯತೀರ್ಪು
      '2':
        title: ಇಸ್ರಾಯೇಲಿಗೆ ತಪ್ಪಿಸಲಾಗದ ನ್ಯಾಯತೀರ್ಪು
      '3':
        title: ಇಸ್ರಾಯೇಲಿನ ಪಾಪಗಳು ವಿಪತ್ತನ್ನು ತರುತ್ತವೆ
      '4':
        title: ಶ್ರೀಮಂತ ಸ್ತ್ರೀಯರು ನ್ಯಾಯತೀರ್ಪನ್ನು ಎದುರಿಸುತ್ತಾರೆ
      '5':
        title: ಪಶ್ಚಾತ್ತಾಪಪಡದಿದ್ದರೆ ದೇಶದ ಪತನ
      '6':
        title: ಸುಖಲೋಲುಪ ಪ್ರಭಾವಿಗಳು ವಿನಾಶವನ್ನು ಕಡೆಗಣಿಸುತ್ತಾರೆ
      '7':
        title: ಆಮೋಸನು ವಿನಾಶದ ದರ್ಶನಗಳನ್ನು ಕಾಣುತ್ತಾನೆ
      '8':
        title: ಬೇಸಿಗೆಯ ಹಣ್ಣು ಇಸ್ರಾಯೇಲಿನ ಅಂತ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ
      '9':
        title: ತಪ್ಪಿಸಲಾಗದ ನ್ಯಾಯತೀರ್ಪು ಮತ್ತು ಪುನಃಸ್ಥಾಪನೆ
    Obadiah:
      '1':
        title: ದ್ರೋಹಕ್ಕಾಗಿ ಎದೋಮಿಗೆ ನ್ಯಾಯತೀರ್ಪು
    Jonah:
      '1':
        title: ನಿನೆವೆಯ ಕಾರ್ಯದಿಂದ ಯೋನನು ಓಡಿಹೋಗುತ್ತಾನೆ
      '2':
        title: ಮೀನಿನ ಹೊಟ್ಟೆಯಲ್ಲಿ ಯೋನನ ಪ್ರಾರ್ಥನೆ
      '3':
        title: ಯೋನನ ಕರೆಯನ್ನು ಕೇಳಿ ನಿನೆವೆ ಪಶ್ಚಾತ್ತಾಪಪಡುತ್ತದೆ
      '4':
        title: ದೇವರ ಕರುಣೆಯಿಂದ ಯೋನನಿಗೆ ಅಸಮಾಧಾನ
    Micah:
      '1':
        title: ಸಮಾರ್ಯ ಮತ್ತು ಯೆಹೂದಕ್ಕೆ ದೇವರ ನ್ಯಾಯತೀರ್ಪು
      '2':
        title: ದುರಾಸೆಯ ಸಂಚುಗಾರರನ್ನು ಮೀಕನು ಖಂಡಿಸುತ್ತಾನೆ
      '3':
        title: ನಾಯಕರು ಜನರನ್ನು ಕ್ರೂರವಾಗಿ ಶೋಷಿಸುತ್ತಾರೆ
      '4':
        title: ಎಲ್ಲಾ ಜನಾಂಗಗಳ ಮೇಲೆ ಯೆಹೋವನು ಆಳುತ್ತಾನೆ
      '5':
        title: ಬೆತ್ಲೆಹೇಮಿನಿಂದ ದಾವೀದ ಅರಸನು ಬರುವನು
      '6':
        title: ಯೆಹೋವನು ಇಸ್ರಾಯೇಲಿನ ವಿರುದ್ಧ ಮೊಕದ್ದಮೆ ಹೂಡುತ್ತಾನೆ
      '7':
        title: ದುಃಖದ ನಡುವೆ ಮೀಕನ ಪ್ರಾರ್ಥನೆ
    Nahum:
      '1':
        title: ನಿನೆವೆಯ ಅಪರಾಧಕ್ಕೆ ದೇವರ ದಂಡನೆ
      '2':
        title: ದೂತನು ಯೆಹೂದಕ್ಕೆ ಶಾಂತಿಯ ಸುದ್ದಿ ತರುತ್ತಾನೆ
      '3':
        title: ನಿನೆವೆ ಸಂಪೂರ್ಣ ಅವಮಾನವನ್ನು ಎದುರಿಸುತ್ತದೆ
    Habakkuk:
      '1':
        title: ದುಷ್ಟರ ಆಳ್ವಿಕೆಯ ಕುರಿತು ಹಬಕ್ಕೂಕನ ಗೋಳಾಟ
      '2':
        title: ಗರ್ವಿಷ್ಠ ದಬ್ಬಾಳಿಕೆಗಾರರಿಗೆ ದೇವರ ಎಚ್ಚರಿಕೆ
      '3':
        title: ಪವಿತ್ರ ಭಯದಿಂದ ಹಬಕ್ಕೂಕನ ಪ್ರಾರ್ಥನೆ
    Zephaniah:
      '1':
        title: ಪಾಪಕ್ಕಾಗಿ ಯೆಹೂದಕ್ಕೆ ದೇವರ ನ್ಯಾಯತೀರ್ಪು
      '2':
        title: ಜನಾಂಗಗಳಿಗೆ ದಂಡನೆ, ಆದರೂ ನಿರೀಕ್ಷೆ ಉಳಿಯುತ್ತದೆ
      '3':
        title: ಶುದ್ಧೀಕರಿಸಿದ ಜನರಿಗಾಗಿ ಚೀಯೋನ್ ಹರ್ಷಿಸುತ್ತದೆ
    Haggai:
      '1':
        title: ತನ್ನ ಆಲಯವನ್ನು ಪುನರ್‌ನಿರ್ಮಿಸಲು ಯೆಹೋವನ ಒತ್ತಾಯ
      '2':
        title: ದೇವಾಲಯ ಕಟ್ಟುವವರಿಗೆ ದೇವರ ಪ್ರೋತ್ಸಾಹ
    Zechariah:
      '1':
        title: ದೇವರು ಕರುಣೆಯೊಂದಿಗೆ ಹಿಂದಿರುಗುತ್ತಾನೆ
      '2':
        title: ಯೆರೂಸಲೇಮ್ ಸಂತೋಷದಿಂದ ತುಂಬಿ ತುಳುಕುತ್ತದೆ
      '3':
        title: ದೇವರು ಯೆಹೋಶುವನನ್ನು ಶುದ್ಧೀಕರಿಸುತ್ತಾನೆ
      '4':
        title: ಆತ್ಮನ ಬಲದಿಂದ ಜೆರುಬ್ಬಾಬೆಲನು ಕಟ್ಟುತ್ತಾನೆ
      '5':
        title: ದೇಶದಿಂದ ದುಷ್ಟತನದ ನಿವಾರಣೆ
      '6':
        title: ಯಾಜಕ ಯೆಹೋಶುವನಿಗಾಗಿ ಕಿರೀಟಗಳು
      '7':
        title: ನ್ಯಾಯವಿಲ್ಲದ ಉಪವಾಸ ವ್ಯರ್ಥ
      '8':
        title: ಶಾಂತಿಯಲ್ಲಿ ಚೀಯೋನಿನ ಪುನರ್‌ನಿರ್ಮಾಣ
      '9':
        title: ಇಸ್ರಾಯೇಲಿನ ಅರಸನು ದೀನನಾಗಿ ಬರುತ್ತಾನೆ
      '10':
        title: ವಿಗ್ರಹಗಳನ್ನಲ್ಲ, ಮಳೆಯನ್ನು ಬೇಡಿರಿ
      '11':
