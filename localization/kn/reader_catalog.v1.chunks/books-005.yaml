locale: kn
source_catalog_sha256: ec74c36516f84fea14e3d62329a38731b464f113276935cab09aa146bdd1e82b
source_chunk_sha256: 5b60d3a15558b9f68c8e1dea8e7b364ae5906d8176acf3f2c721faf6d504696c
chunk_id: books-005
status: reviewed
payload:
  book_metadata:
    Ezra:
      display_name: ಎಜ್ರನು
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಕಾಲವೃತ್ತಾಂತದ ಗ್ರಂಥವನ್ನು ಬರೆದವರೇ ಇದನ್ನೂ ಬರೆದಿರಬಹುದು.
      audience: ಪರ್ಷಿಯರ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಯೆರೂಸಲೇಮನ್ನು ಪುನರ್‌ನಿರ್ಮಿಸುತ್ತಿದ್ದ ಹಿಂದಿರುಗಿದ ದೇಶಭ್ರಷ್ಟರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 5ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗದಿಂದ 4ನೇ ಶತಮಾನದವರೆಗೆ.
    Nehemiah:
      display_name: ನೆಹೆಮೀಯನು
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ನೆಹೆಮೀಯನಿಗೆ ಸೇರಿದ್ದೆಂದು ಹೇಳಲಾಗುವ ಪ್ರಥಮಪುರುಷ ಸ್ಮರಣಕಥನವನ್ನು ಈ ಗ್ರಂಥ ಒಳಗೊಂಡಿದೆ.
      audience: ಪರ್ಷಿಯರ ಆಳ್ವಿಕೆಯಲ್ಲಿ ಯೆರೂಸಲೇಮಿನ ಗೋಡೆಗಳನ್ನು ಪುನರ್‌ನಿರ್ಮಿಸಿ ಒಡಂಬಡಿಕೆಯನ್ನು ನವೀಕರಿಸುತ್ತಿದ್ದ ಹಿಂದಿರುಗಿದ ದೇಶಭ್ರಷ್ಟರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 5ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗದಿಂದ 4ನೇ ಶತಮಾನದವರೆಗೆ.
    Esther:
      display_name: ಎಸ್ತೇರ್
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು.
      audience: ವಿದೇಶಿ ಆಳ್ವಿಕೆಯಲ್ಲಿದ್ದ ಯೆಹೂದಿ ವಲಸೆ ಸಮುದಾಯಗಳು, ವಿಶೇಷವಾಗಿ ಪರ್ಷಿಯಾದಲ್ಲಿದ್ದವರು.
      date: ಸುಮಾರು ಪರ್ಷಿಯನ್ ಅವಧಿಯ ಕೊನೆಯ ಭಾಗ ಅಥವಾ ಹೆಲೆನಿಸ್ಟಿಕ್ ಅವಧಿಯ ಆರಂಭ (ಕ್ರಿ.ಪೂ. 4–3ನೇ ಶತಮಾನ).
    Job:
      display_name: ಯೋಬನು
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು.
      audience: ನಿರಪರಾಧಿಗಳ ಸಂಕಟ ಮತ್ತು ದೇವರ ನ್ಯಾಯದ ಕುರಿತು ಗಂಭೀರವಾಗಿ ಚಿಂತಿಸುತ್ತಿದ್ದ ಇಸ್ರಾಯೇಲ್ಯರು.
      date: ಜ್ಞಾನಸಾಹಿತ್ಯದ ಪರಂಪರೆಯ ಕುರಿತ ವಿದ್ವಾಂಸರ ಸಾಮಾನ್ಯ ಅಭಿಪ್ರಾಯದಂತೆ, ಹಳೆಯ ಜನಪದ ವಸ್ತುವನ್ನು ಬಳಸಿಕೊಂಡ ಈ ಗ್ರಂಥವು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 6–4ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿದೆ.
    Psalms:
      display_name: ಕೀರ್ತನೆಗಳು
      author: ಹಲವಾರು ಶತಮಾನಗಳಲ್ಲಿ ಅನೇಕರು ರಚಿಸಿದ್ದಾರೆ; ಮೇಲ್ಬರಹಗಳು ದಾವೀದ, ಆಸಾಫ, ಕೋರಹ, ಸೊಲೊಮೋನ, ಮೋಶೆ ಮತ್ತು ಇತರರ ಹೆಸರುಗಳನ್ನು ಸೂಚಿಸುತ್ತವೆ.
      audience: ಆರಾಧನೆಯಲ್ಲಿ ಪಾಲ್ಗೊಂಡ ಇಸ್ರಾಯೇಲರೂ ದೇವಾಲಯದ ಸಭೆಯವರೂ—ಹಾಗೆಯೇ ನಂತರದ ಪ್ರತಿಯೊಂದು ಪ್ರಾರ್ಥನಾ ಮತ್ತು ಪ್ರಲಾಪ ಸಮುದಾಯವೂ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 10–3ನೇ ಶತಮಾನಗಳಲ್ಲಿ ರಚಿಸಲಾಯಿತು; ಅಂತಿಮ ಸಂಕಲನವು ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಅವಧಿಯಲ್ಲಿ ರೂಪುಗೊಂಡಿತು.
  chapter_titles:
    2 Chronicles:
      '20':
        title: ಶತ್ರುಗಳ ಮೇಲೆ ಯೆಹೂದದ ಜಯ
      '21':
        title: ಯೆಹೋರಾಮನು ತನ್ನ ಸಹೋದರರನ್ನು ಕೊಲ್ಲುತ್ತಾನೆ
      '22':
        title: ಅಹಜ್ಯನು ದುಷ್ಟ ಮಾರ್ಗಗಳನ್ನು ಅನುಸರಿಸುತ್ತಾನೆ
      '23':
        title: ಯೋವಾಷನು ಮತ್ತೆ ಅರಸನಾಗುತ್ತಾನೆ
      '24':
        title: ದೇವಾಲಯದ ನವೀಕರಣ ಮತ್ತು ಅವನತಿ
      '25':
        title: ಅಮಚ್ಯನು ಎದೋಮನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '26':
        title: ಉಜ್ಜೀಯನ ಏಳಿಗೆ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ
      '27':
        title: ಯೋತಾಮನು ಯೆಹೂದವನ್ನು ಬಲಪಡಿಸುತ್ತಾನೆ
      '28':
        title: ಆಹಾಜನ ಘೋರ ಅಪನಂಬಿಗಸ್ತಿಕೆ
      '29':
        title: ಹಿಜ್ಕೀಯನು ದೇವಾಲಯವನ್ನು ಮತ್ತೆ ತೆರೆಯುತ್ತಾನೆ
      '30':
        title: ಇಸ್ರಾಯೇಲರೆಲ್ಲರೂ ಪಸ್ಕವನ್ನು ಆಚರಿಸುತ್ತಾರೆ
      '31':
        title: ಹಿಜ್ಕೀಯನು ದೇವಾಲಯದ ಉಗ್ರಾಣಗಳನ್ನು ತುಂಬಿಸುತ್ತಾನೆ
      '32':
        title: ದೂತನ ಬಲದಿಂದ ಯೆರೂಸಲೇಮಿಗೆ ಬಿಡುಗಡೆ
      '33':
        title: ಮನಸ್ಸೆಯ ಪಶ್ಚಾತ್ತಾಪ ಮತ್ತು ಯಜ್ಞವೇದಿಯ ಪುನಃಸ್ಥಾಪನೆ
      '34':
        title: ಯೋಷೀಯನು ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಕಂಡು ಓದುತ್ತಾನೆ
      '35':
        title: ಯೋಷೀಯನು ಮಹಾ ಪಸ್ಕ ಹಬ್ಬವನ್ನು ನಡೆಸುತ್ತಾನೆ
      '36':
        title: ಯೆಹೂದವು ಬಾಬೆಲಿನ ಅಧಿಕಾರಕ್ಕೆ ಬೀಳುತ್ತದೆ
    Ezra:
      '1':
        title: ದೇವಾಲಯವನ್ನು ಪುನರ್‌ನಿರ್ಮಿಸಲು ಕೋರೆಷನು ಅನುಮತಿಸುತ್ತಾನೆ
      '2':
        title: ಎಜ್ರನು ದೇಶಭ್ರಷ್ಟರೊಂದಿಗೆ ಹಿಂದಿರುಗುತ್ತಾನೆ
      '3':
        title: ಭಯದ ನಡುವೆಯೇ ಯೆರೂಸಲೇಮಿನಲ್ಲಿ ಯಜ್ಞವೇದಿಯ ಪುನರ್‌ನಿರ್ಮಾಣ
      '4':
        title: ಶತ್ರುಗಳು ದೇವಾಲಯದ ಪುನರ್‌ನಿರ್ಮಾಣದ ಪ್ರಯತ್ನಗಳನ್ನು ತಡೆಯುತ್ತಾರೆ
      '5':
        title: ದೇವಾಲಯದ ಪುನರ್‌ನಿರ್ಮಾಣಕ್ಕೆ ದೇವರ ಮಾರ್ಗದರ್ಶನ
      '6':
        title: ದೇವಾಲಯದ ನಿರ್ಮಾಣ ಮುಂದುವರಿಯಬೇಕೆಂದು ದಾರ್ಯಾವೆಷನು ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
      '7':
        title: ಎಜ್ರನು ದೇವರ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '8':
        title: ಎಜ್ರನು ಪ್ರಾರ್ಥಿಸಿ ಸುರಕ್ಷಿತವಾಗಿ ಹಿಂದಿರುಗುತ್ತಾನೆ
      '9':
        title: ಇಸ್ರಾಯೇಲ್ಯರ ಪಾಪಮಯ ವಿವಾಹಗಳಿಗಾಗಿ ಎಜ್ರನು ದುಃಖಿಸುತ್ತಾನೆ
      '10':
        title: ಎಜ್ರನು ಪಾಪಮಯ ವಿವಾಹಗಳನ್ನು ಎದುರಿಸುತ್ತಾನೆ
    Nehemiah:
      '1':
        title: ನೆಹೆಮೀಯನು ಯೆರೂಸಲೇಮಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '2':
        title: ಪುನರ್‌ನಿರ್ಮಾಣಕ್ಕಾಗಿ ಅರಸನು ನೆಹೆಮೀಯನನ್ನು ಕಳುಹಿಸುತ್ತಾನೆ
      '3':
        title: ಎಲ್ಲರೂ ಸೇರಿ ಯೆರೂಸಲೇಮಿನ ಗೋಡೆಗಳನ್ನು ಕಟ್ಟುತ್ತಾರೆ
      '4':
        title: ನೆಹೆಮೀಯನು ಯೆರೂಸಲೇಮನ್ನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '5':
        title: ನೆಹೆಮೀಯನು ಸಾಮಾಜಿಕ ಅನ್ಯಾಯದ ವಿರುದ್ಧ ಹೋರಾಡುತ್ತಾನೆ
      '6':
        title: ದೇವರ ಕಾರ್ಯವನ್ನು ತಡೆಯಲು ಶತ್ರುಗಳು ವಿಫಲರಾಗುತ್ತಾರೆ
      '7':
        title: ನಗರದ ಕಾವಲುಗಾರರು ಮತ್ತು ಜನರ ಪಟ್ಟಿ
      '8':
        title: ಎಜ್ರನು ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಓದುತ್ತಾನೆ; ಜನರು ಅಳುತ್ತಾರೆ
      '9':
        title: ಇಸ್ರಾಯೇಲ್ಯರು ದೇವರ ಮುಂದೆ ತಮ್ಮ ಪಾಪಗಳನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾರೆ
      '10':
        title: ಜನರು ದೇವರೊಂದಿಗೆ ಒಡಂಬಡಿಕೆ ಮಾಡಿಕೊಳ್ಳುತ್ತಾರೆ
      '11':
        title: ನಾಯಕರು ಪರಿಶುದ್ಧ ನಗರದಲ್ಲಿ ಜನರನ್ನು ನೆಲೆಗೊಳಿಸುತ್ತಾರೆ
      '12':
        title: ಗೋಡೆಯ ಪ್ರತಿಷ್ಠಾಪನೆಯನ್ನು ಆರಾಧನೆಯಿಂದ ಆಚರಿಸುತ್ತಾರೆ
      '13':
        title: ನೆಹೆಮೀಯನು ದೇವಾಲಯವನ್ನು ಮತ್ತೆ ಶುದ್ಧೀಕರಿಸುತ್ತಾನೆ
    Esther:
      '1':
        title: ಅರಸನು ರಾಣಿ ವಷ್ಟಿಯನ್ನು ಹೊರಹಾಕುತ್ತಾನೆ
      '2':
        title: ಎಸ್ತೇರ್ ಹೊಸ ರಾಣಿಯಾಗುತ್ತಾಳೆ
      '3':
        title: ಯೆಹೂದ್ಯರನ್ನು ನಾಶಮಾಡಲು ಹಾಮಾನನು ಸಂಚು ರೂಪಿಸುತ್ತಾನೆ
      '4':
        title: ಕಾರ್ಯಪ್ರವೃತ್ತಳಾಗುವಂತೆ ಮೊರ್ದೆಕೈ ಎಸ್ತೇರಳನ್ನು ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '5':
        title: ಎಸ್ತೇರ್ ಅರಸನನ್ನೂ ಹಾಮಾನನನ್ನೂ ಆಹ್ವಾನಿಸುತ್ತಾಳೆ
      '6':
        title: ಅರಸನು ಮೊರ್ದೆಕೈಯನ್ನು ಬಹಿರಂಗವಾಗಿ ಗೌರವಿಸುತ್ತಾನೆ
      '7':
        title: ಎಸ್ತೇರ್ ಹಾಮಾನನ ಸಂಚನ್ನು ಬಯಲಿಗೆಳೆಯುತ್ತಾಳೆ
      '8':
        title: ಹಾಮಾನನ ಅಧಿಕಾರ ಮೊರ್ದೆಕೈಗೆ ದೊರೆಯುತ್ತದೆ
      '9':
        title: ಯೆಹೂದ್ಯರು ತಮ್ಮನ್ನು ಯಶಸ್ವಿಯಾಗಿ ರಕ್ಷಿಸಿಕೊಳ್ಳುತ್ತಾರೆ
      '10':
        title: ಮೊರ್ದೆಕೈ ಜ್ಞಾನದಿಂದ ಉತ್ತಮವಾಗಿ ಆಳುತ್ತಾನೆ
    Job:
      '1':
        title: ಯೋಬನು ಎಲ್ಲವನ್ನೂ ಕಳೆದುಕೊಂಡರೂ ಆರಾಧಿಸುತ್ತಾನೆ
      '2':
        title: ಯೋಬನು ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ಸಂಕಟವನ್ನು ಸಹಿಸುತ್ತಾನೆ
      '3':
        title: ಯೋಬನು ತಾನು ಹುಟ್ಟಿದ ದಿನವನ್ನು ಶಪಿಸುತ್ತಾನೆ
      '4':
        title: ಬಿತ್ತನೆಯ ವಿಷಯದಲ್ಲಿ ಎಲೀಫಜನು ಯೋಬನನ್ನು ಖಂಡಿಸುತ್ತಾನೆ
      '5':
        title: ದೇವರನ್ನು ಆಶ್ರಯಿಸು ಎಂದು ಎಲೀಫಜನು ಯೋಬನಿಗೆ ಸಲಹೆ ನೀಡುತ್ತಾನೆ
      '6':
        title: ಯೋಬನು ತನ್ನ ಭಾರವಾದ ಹೊರೆಯನ್ನು ವಿವರಿಸುತ್ತಾನೆ
      '7':
        title: ಯೋಬನು ತನ್ನ ಸಂಕಟದ ಕುರಿತು ಅಳಲು ತೋಡಿಕೊಳ್ಳುತ್ತಾನೆ
      '8':
        title: ಬಿಲ್ದದನು ಸಂಕಟಪಡುತ್ತಿರುವ ಯೋಬನನ್ನು ಖಂಡಿಸುತ್ತಾನೆ
      '9':
        title: ದೇವರ ಶಕ್ತಿಯ ಕುರಿತು ಯೋಬನ ಪ್ರಲಾಪ
      '10':
        title: ನನ್ನೊಂದಿಗೆ ಏಕೆ ಹೋರಾಡುತ್ತೀ ಎಂದು ಯೋಬನು ಕೇಳುತ್ತಾನೆ
      '11':
        title: ಚೋಫರನು ಜ್ಞಾನದ ಮಾತುಗಳಿಂದ ಯೋಬನನ್ನು ಖಂಡಿಸುತ್ತಾನೆ
      '12':
        title: ಸ್ನೇಹಿತರ ಪೊಳ್ಳು ಮಾತುಗಳನ್ನು ಯೋಬನು ಹಾಸ್ಯಮಾಡುತ್ತಾನೆ
      '13':
        title: ಯೋಬನು ದೇವರ ಮುಂದೆ ಸತ್ಯವನ್ನು ನುಡಿಯುತ್ತಾನೆ
      '14':
        title: ಜೀವನದ ನಶ್ವರತೆಯ ಕುರಿತು ಯೋಬನ ಪ್ರಲಾಪ
      '15':
        title: ಎಲೀಫಜನು ಯೋಬನ ಮೇಲೆ ಪಾಪದ ಆರೋಪ ಹೊರಿಸುತ್ತಾನೆ
      '16':
