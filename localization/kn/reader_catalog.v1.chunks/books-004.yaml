payload:
  book_metadata:
    1 Kings:
      display_name: 1 ಅರಸುಗಳು
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಧರ್ಮೋಪದೇಶಕಾಂಡೀಯ ಇತಿಹಾಸದ ಒಂದು ಭಾಗ.
      audience: ರಾಜ್ಯವು ಏಕೆ ಪತನವಾಯಿತು ಎಂದು ಪ್ರಶ್ನಿಸುತ್ತಿದ್ದ ದೇಶಭ್ರಷ್ಟ ಮತ್ತು ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಇಸ್ರಾಯೇಲ್ಯರು.
      date: ಬಾಬಿಲೋನಿನ ದೇಶಭ್ರಷ್ಟತೆಯ ಕಾಲದಲ್ಲಿ, ಅಂದರೆ ಸುಮಾರು ಕ್ರಿ.ಪೂ. 6ನೇ ಶತಮಾನದಲ್ಲಿ, ಅಂತಿಮ ರೂಪವನ್ನು ಪಡೆದಿರಬಹುದು.
    2 Kings:
      display_name: 2 ಅರಸುಗಳು
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಧರ್ಮೋಪದೇಶಕಾಂಡೀಯ ಇತಿಹಾಸದ ಒಂದು ಭಾಗ.
      audience: ಬಾಬಿಲೋನಿನ ವಶಪಡಿಸಿಕೊಳ್ಳುವಿಕೆಯಲ್ಲಿ ಅಂತ್ಯಗೊಂಡ ವಿಭಜಿತ ರಾಜ್ಯಗಳ ಪತನವನ್ನು ದೇವತಾತ್ತ್ವಿಕವಾಗಿ ಪರಿಶೀಲಿಸುವ ಕೃತಿ; ದೇಶಭ್ರಷ್ಟ ಇಸ್ರಾಯೇಲ್ಯರಿಗಾಗಿ.
      date: ಕ್ರಿ.ಪೂ. 586ರ ನಂತರ, ಸುಮಾರು ಕ್ರಿ.ಪೂ. 6ನೇ ಶತಮಾನದಲ್ಲಿ ಅಂತಿಮ ರೂಪವನ್ನು ಪಡೆದಿರಬಹುದು.
    1 Chronicles:
      display_name: 1 ಪೂರ್ವಕಾಲವೃತ್ತಾಂತ
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಸಂಪ್ರದಾಯವು ಅವರನ್ನು "ವೃತ್ತಾಂತಕಾರ" ಎಂದು ಕರೆಯುತ್ತದೆ.
      audience: ಪರ್ಷಿಯನ್ ಆಳ್ವಿಕೆಯ ಯೆಹೂದ್‌ನಲ್ಲಿದ್ದ ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಯೆಹೂದ್ಯ ಸಮುದಾಯ; ದಾವೀದ, ದೇವಾಲಯ ಮತ್ತು ಆರಾಧನೆಯ ಸುತ್ತ ತಮ್ಮ ಗುರುತನ್ನು ಪುನಃ ನೆಲೆಗೊಳಿಸಿಕೊಳ್ಳುತ್ತಿದ್ದವರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 4ನೇ ಶತಮಾನ.
    2 Chronicles:
      display_name: 2 ಪೂರ್ವಕಾಲವೃತ್ತಾಂತ
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ವೃತ್ತಾಂತಕಾರ.
      audience: ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಯೆಹೂದ್ಯ ಸಮುದಾಯ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 4ನೇ ಶತಮಾನ.
  chapter_titles:
    2 Samuel:
      '24':
        title: ದಾವೀದನು ವ್ಯಾಧಿಯನ್ನು ನಿಲ್ಲಿಸುತ್ತಾನೆ
    1 Kings:
      '1':
        title: ಸೊಲೊಮೋನನು ಅರಸನಾಗಿ ಅಭಿಷೇಕಿಸಲ್ಪಡುತ್ತಾನೆ
      '2':
        title: ದಾವೀದನು ಸೊಲೊಮೋನನಿಗೆ ನಂಬಿಗಸ್ತನಾಗಿರಲು ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
      '3':
        title: ಸೊಲೊಮೋನನು ದೈವಿಕ ಜ್ಞಾನವನ್ನು ಬೇಡುತ್ತಾನೆ
      '4':
        title: ಸೊಲೊಮೋನನು ಸುವ್ಯವಸ್ಥಿತ ಬಲದಿಂದ ಆಳುತ್ತಾನೆ
      '5':
        title: ಸೊಲೊಮೋನನು ದೇವಾಲಯವನ್ನು ಕಟ್ಟಿಸಿ ಕೀರ್ತಿ ಪಡೆಯುತ್ತಾನೆ
      '6':
        title: ದೇವಾಲಯದ ನಿರ್ಮಾಣವು ಎಚ್ಚರಿಕೆಯಿಂದ ಆರಂಭವಾಗುತ್ತದೆ
      '7':
        title: ಸೊಲೊಮೋನನು ದೇವಾಲಯದ ಉಪಕರಣಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸುತ್ತಾನೆ
      '8':
        title: ಸೊಲೊಮೋನನು ದೇವಾಲಯದಲ್ಲಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '9':
        title: ಕರ್ತನು ಸೊಲೊಮೋನನೊಂದಿಗಿನ ಒಡಂಬಡಿಕೆಯನ್ನು ಪುನಃ ದೃಢಪಡಿಸುತ್ತಾನೆ
      '10':
        title: ರಾಣಿಯು ಸೊಲೊಮೋನನ ಜ್ಞಾನವನ್ನು ಮೆಚ್ಚುತ್ತಾಳೆ
      '11':
        title: ಸೊಲೊಮೋನನು ಎಡವಿ ದೇವರಿಂದ ದೂರವಾಗುತ್ತಾನೆ
      '12':
        title: ರೆಹಬ್ಬಾಮನು ಜನರ ಮನವಿಯನ್ನು ತಿರಸ್ಕರಿಸುತ್ತಾನೆ
      '13':
        title: ಪ್ರವಾದಿಯು ಅರಸನನ್ನು ಧಿಕ್ಕರಿಸಿ ಸಾಯುತ್ತಾನೆ
      '14':
        title: ಯೆರೊಬಾಮನು ದೈವಿಕ ನ್ಯಾಯತೀರ್ಪನ್ನು ಎದುರಿಸುತ್ತಾನೆ
      '15':
        title: ಆಸನು ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ವಿಗ್ರಹಗಳನ್ನು ತೆಗೆದುಹಾಕುತ್ತಾನೆ
      '16':
        title: ಕರ್ತನು ಇಸ್ರಾಯೇಲಿನ ಅರಸರನ್ನು ನ್ಯಾಯತೀರಿಸುತ್ತಾನೆ
      '17':
        title: ಎಲೀಯನು ಅದ್ಭುತವಾಗಿ ವಿಧವೆಗೆ ಆಹಾರ ಒದಗಿಸುತ್ತಾನೆ
      '18':
        title: ಎಲೀಯನು ಅಹಾಬನನ್ನು ಎದುರಿಸಿ ನ್ಯಾಯತೀರ್ಪನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '19':
        title: ಎಲೀಯನು ಹೋರೇಬಿನಲ್ಲಿ ತನ್ನ ಕಾರ್ಯದ ಆದೇಶವನ್ನು ಪಡೆಯುತ್ತಾನೆ
      '20':
        title: ಅಹಾಬನು ಬೆನ್ಹದದನನ್ನು ಉಳಿಸುತ್ತಾನೆ
      '21':
        title: ಈಜೆಬೆಲಳು ನಾಬೋತನ ಕೊಲೆಗೆ ಸಂಚು ರೂಪಿಸುತ್ತಾಳೆ
      '22':
        title: ಮೀಕಾಯನು ಮುಂತಿಳಿಸಿದಂತೆ ಅಹಾಬನು ಸಾಯುತ್ತಾನೆ
    2 Kings:
      '1':
        title: ಅಹಜ್ಯನು ಎಲೀಯನ ನ್ಯಾಯತೀರ್ಪನ್ನು ಎದುರಿಸುತ್ತಾನೆ
      '2':
        title: ಎಲೀಯನು ಸುಂಟರಗಾಳಿಯಲ್ಲಿ ಮೇಲಕ್ಕೆ ಒಯ್ಯಲ್ಪಡುತ್ತಾನೆ
      '3':
        title: ಯೆಹೋರಾಮನು ಎಲೀಷನೊಂದಿಗೆ ಮೋವಾಬಿನ ವಿರುದ್ಧ ಹೋರಾಡುತ್ತಾನೆ
      '4':
        title: ಎಲೀಷನು ಅಗತ್ಯದಲ್ಲಿರುವವರಿಗೆ ನೆರವಾಗುತ್ತಾನೆ
      '5':
        title: ನಾಮಾನನು ಕುಷ್ಠರೋಗದಿಂದ ಶುದ್ಧನಾಗುತ್ತಾನೆ
      '6':
        title: ಎಲೀಷನು ಅರಾಮ್ಯರ ಯೋಜನೆಗಳನ್ನು ಬಹಿರಂಗಪಡಿಸುತ್ತಾನೆ
      '7':
        title: ಸಮಾರ್ಯದ ಕ್ಷಾಮವು ಹಠಾತ್ತನೆ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ
      '8':
        title: ಎಲೀಷನು ಅರಸರನ್ನು ಎಚ್ಚರಿಸಿ ನ್ಯಾಯತೀರ್ಪನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '9':
        title: ಯೇಹುವು ಅಹಾಬನ ಮನೆತನವನ್ನು ಸಂಹರಿಸುತ್ತಾನೆ
      '10':
        title: ಯೇಹುವು ಬಾಳನ ಆರಾಧನೆಯನ್ನು ನಾಶಮಾಡುತ್ತಾನೆ
      '11':
        title: ದೇವಾಲಯದ ಕ್ಷಿಪ್ರಕ್ರಾಂತಿಯಲ್ಲಿ ಯೋವಾಷನು ಪಟ್ಟಾಭಿಷಿಕ್ತನಾಗುತ್ತಾನೆ
      '12':
        title: ಯೆಹೋವಾಷನು ದೇವಾಲಯವನ್ನು ದುರಸ್ತಿಮಾಡುತ್ತಾನೆ
      '13':
        title: ಇಸ್ರಾಯೇಲಿಗೆ ದೊರೆತ ಕರುಣೆಯ ಚಕ್ರವು ಕೊನೆಗೊಳ್ಳುತ್ತದೆ
      '14':
        title: ಅಮಚ್ಯನು ಎದೋಮನ್ನು ಸೋಲಿಸಿದರೂ ವಿಫಲನಾಗುತ್ತಾನೆ
      '15':
        title: ಯೆಹೂದವು ಸ್ಥಿರವಾಗಿದ್ದರೆ ಇಸ್ರಾಯೇಲು ಅವನತಿಗೊಳ್ಳುತ್ತದೆ
      '16':
        title: ಆಹಾಜನು ಅಶ್ಶೂರದ ನೆರವು ಕೋರುತ್ತಾನೆ
      '17':
        title: ನಿರಂತರ ಪಾಪದಿಂದ ಇಸ್ರಾಯೇಲು ದೇಶಭ್ರಷ್ಟವಾಗುತ್ತದೆ
      '18':
        title: ಹಿಜ್ಕೀಯನು ಕರ್ತನಲ್ಲಿ ಮಾತ್ರ ಭರವಸೆಯಿಡುತ್ತಾನೆ
      '19':
        title: ಕರ್ತನು ಯೆರೂಸಲೇಮನ್ನು ಅಶ್ಶೂರದಿಂದ ಬಿಡಿಸುತ್ತಾನೆ
      '20':
        title: ಹಿಜ್ಕೀಯನು ಪ್ರಾರ್ಥಿಸಿ ಗುಣಮುಖನಾಗುತ್ತಾನೆ
      '21':
        title: ಮನಸ್ಸೆಯು ಯೆಹೂದವನ್ನು ಕೆಟ್ಟತನಕ್ಕೆ ನಡೆಸುತ್ತಾನೆ
      '22':
        title: ಯೋಷೀಯನು ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಕಂಡು ಪಶ್ಚಾತ್ತಾಪಪಡುತ್ತಾನೆ
      '23':
        title: ಯೋಷೀಯನು ವಿಗ್ರಹಾರಾಧನೆಯನ್ನು ತೊಲಗಿಸಿ ಪಸ್ಕವನ್ನು ಪುನಃಸ್ಥಾಪಿಸುತ್ತಾನೆ
      '24':
        title: ಬಾಬಿಲೋನು ಯೆಹೋಯಾಕೀನನನ್ನು ಸೆರೆಹಿಡಿಯುತ್ತದೆ
      '25':
        title: ಯೆಹೋಯಾಕೀನನು ಬಾಬಿಲೋನಿನಲ್ಲಿ ಗೌರವಿಸಲ್ಪಡುತ್ತಾನೆ
    1 Chronicles:
      '1':
        title: ದೇವರು ಇಸ್ರಾಯೇಲಿನ ವಂಶಾವಳಿಯನ್ನು ಸ್ಥಾಪಿಸುತ್ತಾನೆ
      '2':
        title: ತಲೆಮಾರುಗಳ ಮೂಲಕ ಯೆಹೂದನ ವಂಶಾವಳಿ
      '3':
        title: ದಾವೀದನ ಮನೆತನವು ಮುಂದುವರಿಯುತ್ತದೆ
      '4':
        title: ಯೆಫೆತನ ಸಂತತಿಯವರ ಹೆಸರುಗಳು
      '5':
        title: ಪೂರ್ವದ ಕುಲಗಳು ಉತ್ತರಕ್ಕೆ ದೇಶಭ್ರಷ್ಟವಾಗುತ್ತವೆ
      '6':
        title: ಲೇವಿಯ ಯಾಜಕ ವಂಶಕ್ಕೆ ಗೌರವ
      '7':
        title: ಇಸ್ಸಾಕಾರನ ಪರಾಕ್ರಮಿ ಯೋಧರು
      '8':
        title: ಬೆನ್ಯಾಮೀನನ ನಾಯಕರು ಮತ್ತು ಗೋತ್ರಗಳು
      '9':
        title: ಯೆರೂಸಲೇಮಿಗೆ ಮರಳುವಿಕೆ ಮತ್ತು ಪುನರ್ನಿರ್ಮಾಣ
      '10':
        title: ಸೌಲನು ಗಿಲ್ಬೋವ ಬೆಟ್ಟದಲ್ಲಿ ಸಾಯುತ್ತಾನೆ
      '11':
        title: ದಾವೀದನು ಎಲ್ಲರ ಅರಸನಾಗಿ ಅಭಿಷೇಕಿಸಲ್ಪಡುತ್ತಾನೆ
      '12':
        title: ಯೋಧರು ದಾವೀದನ ರಾಜ್ಯವನ್ನು ಸೇರುತ್ತಾರೆ
      '13':
        title: ದಾವೀದನು ಒಡಂಬಡಿಕೆಯ ಮಂಜೂಷವನ್ನು ಮರಳಿ ತರುತ್ತಾನೆ
      '14':
        title: ದಾವೀದನು ಮತ್ತೆ ಫಿಲಿಷ್ಟಿಯರನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '15':
        title: ಒಡಂಬಡಿಕೆಯ ಮಂಜೂಷವನ್ನು ಯೆರೂಸಲೇಮಿಗೆ ತರಲಾಗುತ್ತದೆ
      '16':
        title: ದಾವೀದನು ದೇವಾಲಯದ ಆರಾಧನೆಗಾಗಿ ಸೇವಕರನ್ನು ನೇಮಿಸುತ್ತಾನೆ
      '17':
        title: ದೇವರು ದಾವೀದನ ರಾಜವಂಶದ ಕುರಿತು ವಾಗ್ದಾನ ಮಾಡುತ್ತಾನೆ
      '18':
        title: ದಾವೀದನು ಜನಾಂಗಗಳ ಮೇಲೆ ಜಯ ಗಳಿಸುತ್ತಾನೆ
      '19':
        title: ಯೋವಾಬನು ಅಮ್ಮೋನನ್ನೂ ಅರಾಮನ್ನೂ ಸೋಲಿಸುತ್ತಾನೆ
      '20':
        title: ಯೋವಾಬನು ರಬ್ಬಾ ಪಟ್ಟಣವನ್ನು ವಶಪಡಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '21':
        title: ದಾವೀದನ ಜನಗಣತಿಯಿಂದ ವ್ಯಾಧಿ ಉಂಟಾಗುತ್ತದೆ
      '22':
        title: ದೇವರ ಆಲಯವನ್ನು ಕಟ್ಟಲು ಸೊಲೊಮೋನನು ಆರಿಸಲ್ಪಡುತ್ತಾನೆ
      '23':
        title: ಲೇವಿಯರು ಸೇವೆಗಾಗಿ ವ್ಯವಸ್ಥೆಗೊಳಿಸಲ್ಪಡುತ್ತಾರೆ
      '24':
        title: ಯಾಜಕರು ಚೀಟಿನಿಂದ ವಿಭಾಗಿಸಲ್ಪಡುತ್ತಾರೆ
      '25':
