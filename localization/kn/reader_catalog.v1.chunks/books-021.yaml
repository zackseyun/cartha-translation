payload:
  book_metadata:
    Thunder, Perfect Mind:
      display_name: ಗುಡುಗು, ಪರಿಪೂರ್ಣ ಮನಸ್ಸು
      author: ಅನಾಮಧೇಯ.
      audience: ಗ್ರೀಕ್-ಈಜಿಪ್ಟಿನ ಜ್ಞಾನಸಾಹಿತ್ಯ ಅಥವಾ ಜ್ಞಾನವಾದಿ ಓದುಗರು; ದೈವಿಕ ಸ್ತ್ರೀರೂಪದ ಧ್ವನಿಯಲ್ಲಿ ಲಿಂಗಸೂಚಿತ ಸ್ವಯಂ-ಪ್ರಕಟನೆಯ ಕವಿತೆ.
      date: ಬಹುಶಃ ಕ್ರಿ.ಶ. 1–2ನೇ ಶತಮಾನ; ನಾಗ್ ಹಮ್ಮಾದಿಯಲ್ಲಿ (NHC VI,2) ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
    Testament of Reuben:
      display_name: ರೂಬೇನನ ಒಡಂಬಡಿಕೆ
      author: ಅನಾಮಧೇಯ; ಯಾಕೋಬನ ಪುತ್ರರು ಮರಣಶಯ್ಯೆಯಲ್ಲಿ ಮಾಡಿದ ಭಾಷಣಗಳಾಗಿ ಪ್ರಸ್ತುತಪಡಿಸಲಾದ ಹನ್ನೆರಡು ಮೂಲಪಿತೃಗಳ ಒಡಂಬಡಿಕೆಗಳ ಒಂದು ಭಾಗ.
      audience: ಮೂಲಪಿತೃಗಳ ಪಾಪಸ್ವೀಕಾರಗಳಿಂದ ನೀತಿನಡತೆಯನ್ನು ಕಲಿಯುವ ಯೆಹೂದಿ (ಮತ್ತು ನಂತರದ ಕ್ರೈಸ್ತ) ಓದುಗರು.
      date: ಕ್ರೈಸ್ತಪೂರ್ವ ಯೆಹೂದಿ ಮೂಲಭಾಗವು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನದ್ದು; ಕ್ರೈಸ್ತ ಸಂಪಾದಕೀಯ ಪದರವು ಸುಮಾರು ಕ್ರಿ.ಶ. 1–2ನೇ ಶತಮಾನದ್ದು.
    Testament of Simeon:
      display_name: ಸಿಮೆಯೋನನ ಒಡಂಬಡಿಕೆ
      author: ಅನಾಮಧೇಯ; ಹನ್ನೆರಡು ಮೂಲಪಿತೃಗಳ ಒಡಂಬಡಿಕೆಗಳ ಒಂದು ಭಾಗ.
      audience: ಯೆಹೂದಿ (ಮತ್ತು ನಂತರದ ಕ್ರೈಸ್ತ) ಓದುಗರು.
      date: ಯೆಹೂದಿ ಮೂಲಭಾಗವು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನದ್ದು; ಕ್ರೈಸ್ತ ಸಂಪಾದನೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 1–2ನೇ ಶತಮಾನದ್ದು.
    Testament of Levi:
      display_name: ಲೇವಿಯ ಒಡಂಬಡಿಕೆ
      author: ಅನಾಮಧೇಯ; ಹನ್ನೆರಡು ಮೂಲಪಿತೃಗಳ ಒಡಂಬಡಿಕೆಗಳ ಒಂದು ಭಾಗ.
      audience: ಯೆಹೂದಿ (ಮತ್ತು ನಂತರದ ಕ್ರೈಸ್ತ) ಓದುಗರು; ವಿಶೇಷವಾಗಿ ಯಾಜಕತ್ವದಲ್ಲಿ ಆಸಕ್ತಿಯಿದ್ದ ಸಮುದಾಯಗಳು.
      date: ಯೆಹೂದಿ ಮೂಲಭಾಗವು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನದ್ದು; ಕ್ರೈಸ್ತ ಸಂಪಾದನೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 1–2ನೇ ಶತಮಾನದ್ದು.
    Testament of Judah:
      display_name: ಯೆಹೂದನ ಒಡಂಬಡಿಕೆ
      author: ಅನಾಮಧೇಯ; ಹನ್ನೆರಡು ಮೂಲಪಿತೃಗಳ ಒಡಂಬಡಿಕೆಗಳ ಒಂದು ಭಾಗ.
      audience: ಯೆಹೂದಿ (ಮತ್ತು ನಂತರದ ಕ್ರೈಸ್ತ) ಓದುಗರು.
      date: ಯೆಹೂದಿ ಮೂಲಭಾಗವು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನದ್ದು; ಕ್ರೈಸ್ತ ಸಂಪಾದನೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 1–2ನೇ ಶತಮಾನದ್ದು.
    Testament of Issachar:
      display_name: ಇಸ್ಸಾಕಾರನ ಒಡಂಬಡಿಕೆ
      author: ಅನಾಮಧೇಯ; ಹನ್ನೆರಡು ಮೂಲಪಿತೃಗಳ ಒಡಂಬಡಿಕೆಗಳ ಒಂದು ಭಾಗ.
      audience: ಯೆಹೂದಿ (ಮತ್ತು ನಂತರದ ಕ್ರೈಸ್ತ) ಓದುಗರು.
      date: ಯೆಹೂದಿ ಮೂಲಭಾಗವು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನದ್ದು; ಕ್ರೈಸ್ತ ಸಂಪಾದನೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 1–2ನೇ ಶತಮಾನದ್ದು.
  chapter_titles:
    Shepherd of Hermas:
      '47':
        title: ಹೆರ್ಮಾಸ್ ನಿಜವಾದ ನಗರವನ್ನು ಆರಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '48':
        title: ಸಂಪತ್ತು ಸೇವೆಯ ಕರ್ತವ್ಯವನ್ನು ತರುತ್ತದೆ
      '49':
        title: ಹಂಚಿಕೊಂಡ ಐಶ್ವರ್ಯ ಪರಿಪೂರ್ಣತೆಯನ್ನು ತರುತ್ತದೆ
      '50':
        title: ಹೆರ್ಮಾಸ್ ಉಪವಾಸವನ್ನು ತಪ್ಪಾಗಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುತ್ತಾನೆ
      '51':
        title: ಹೆರ್ಮಾಸ್ ತಿಳಿವಳಿಕೆಯನ್ನು ಹುಡುಕುತ್ತಾನೆ
      '52':
        title: ದೃಷ್ಟಾಂತದ ಅರ್ಥವನ್ನು ಹೆರ್ಮಾಸ್‌ಗೆ ಬೋಧಿಸಲಾಗುತ್ತದೆ
      '53':
        title: ಹೆರ್ಮಾಸ್ ದೇಹ ಮತ್ತು ಆತ್ಮವನ್ನು ಶುದ್ಧೀಕರಿಸುತ್ತಾನೆ
      '54':
        title: ಸುಖಭೋಗಿ ಕುರಿಗಳನ್ನು ಮೇಯಿಸುವ ಕುರುಬರನ್ನು ನೋಡು
      '55':
        title: ಕಠಿಣ ಕುರುಬನು ಸ್ವೇಚ್ಛಾಭೋಗಿ ಕುರಿಗಳನ್ನು ಶಿಸ್ತುಗೊಳಿಸುತ್ತಾನೆ
      '56':
        title: ಅಲೆದಾಡುವ ಕುರಿಗಳನ್ನು ಕುರುಬನು ದಂಡಿಸುತ್ತಾನೆ
      '57':
        title: ಸ್ವೇಚ್ಛಾಭೋಗವು ಭಾರೀ ದಂಡನೆಯನ್ನು ತರುತ್ತದೆ
      '58':
        title: ದಂಡನೆಯ ಅವಧಿಯ ಬಗ್ಗೆ ಹೆರ್ಮಾಸ್ ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '59':
        title: ಉಪಶಮನಕ್ಕಾಗಿ ಹೆರ್ಮಾಸ್ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '60':
        title: ಪಶ್ಚಾತ್ತಾಪಕ್ಕೆ ವಿನಯದ ಶಿಸ್ತು ಮತ್ತು ಸಹನೆ ಅಗತ್ಯ
      '61':
        title: ಫಲವುಳ್ಳವರಿಗೆ ದೇವದೂತನು ಕಿರೀಟ ತೊಡಿಸುತ್ತಾನೆ
      '62':
        title: ಮರವು ದೇವರ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಪ್ರತಿನಿಧಿಸುತ್ತದೆ
      '63':
        title: ಮರುನೆಟ್ಟ ಕೋಲುಗಳನ್ನು ಕುರುಬನು ಬೇರ್ಪಡಿಸುತ್ತಾನೆ
    Thunder, Perfect Mind:
      '1':
        title: ಅನ್ವೇಷಕರೊಂದಿಗೆ ಗುಡುಗು ಮಾತನಾಡುತ್ತದೆ
      '2':
        title: ನಾನೇ ಮೊದಲನೆಯವಳು, ಕೊನೆಯವಳು, ಕನ್ಯೆ
      '3':
        title: ಜ್ಞಾನ ಮತ್ತು ಅಜ್ಞಾನ ಒಂದಾಗುತ್ತವೆ
      '4':
        title: ಭಯವೂ ಬಲವೂ ನನ್ನಲ್ಲಿವೆ
      '5':
        title: ಅವಳು ದ್ವೇಷಿಸಲ್ಪಟ್ಟಳು, ಪ್ರೀತಿಸಲ್ಪಟ್ಟಳು, ಮರಣವೆಂದು ಕರೆಯಲ್ಪಟ್ಟಳು
      '6':
        title: ಮನಸ್ಸು ಮತ್ತು ವಿಶ್ರಾಂತಿ ನನ್ನೊಳಗಿವೆ
      '7':
        title: ನನ್ನ ಮೂಲಕ ಶಾಂತಿ ಯುದ್ಧವನ್ನು ತರುತ್ತದೆ
      '8':
        title: ಮೌನದೊಳಗೆ ಒಂದು ಧ್ವನಿ ಕೇಳಿಸುತ್ತದೆ
      '9':
        title: ನಾನೇ ನ್ಯಾಯ ಮತ್ತು ಸಮರ್ಥಕಿ
      '10':
        title: ನಾನು ಸೃಷ್ಟಿಕರ್ತನ ಹೆಸರನ್ನು ಕೂಗಿ ಕರೆಯುತ್ತೇನೆ
      '11':
        title: ತಾಳ್ಮೆ ಮತ್ತು ಕ್ಷಮೆ ಬರುತ್ತವೆ
    Testament of Reuben:
      '1':
        title: ಪಾಪದ ಹಿಡಿತದ ಬಗ್ಗೆ ರೂಬೇನನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '2':
        title: ಏಳು ಆತ್ಮಗಳು ಮಾನವಕುಲವನ್ನು ಆಳುತ್ತವೆ
      '3':
        title: ಏಳು ತಪ್ಪುಗಳು ಯುವಕರನ್ನು ಬಂಧಿಸಿ ಕುಗ್ಗಿಸುತ್ತವೆ
      '4':
        title: ಈಗಲೇ ಕಾಮ ಮತ್ತು ವಿಗ್ರಹಾರಾಧನೆಯನ್ನು ತೊರೆಯಿರಿ
      '5':
        title: ಮೋಹಗೊಳಿಸಿ ಬಲೆಗೆ ಬೀಳಿಸಲು ಸ್ತ್ರೀಯರು ಪ್ರಯತ್ನಿಸುತ್ತಾರೆ
      '6':
        title: ಬೆಲಿಯಾರನ ಬಲೆಗಳಿಂದ ಮನಸ್ಸನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳಿರಿ
      '7':
        title: ರೂಬೇನನ ಎಲುಬುಗಳು ತಾಯ್ನಾಡಿಗೆ ಮರಳುತ್ತವೆ
    Testament of Simeon:
      '1':
        title: ಸಾಕ್ಷಿ ಹೇಳಲು ಸಿಮೆಯೋನನು ಪುತ್ರರನ್ನು ಒಟ್ಟುಗೂಡಿಸುತ್ತಾನೆ
      '2':
        title: ಅಸೂಯೆಯಿಂದ ರೂಪಿಸಿದ ಸಂಚುಗಳಿಗಾಗಿ ಸಿಮೆಯೋನನು ಪಶ್ಚಾತ್ತಾಪಪಡುತ್ತಾನೆ
      '3':
        title: ಸಿಮೆಯೋನನು ಅಸೂಯೆಯ ಆತ್ಮದ ವಿರುದ್ಧ ಹೋರಾಡುತ್ತಾನೆ
      '4':
        title: ಯೋಸೇಫನು ಕರುಣೆ ತೋರಿಸುತ್ತಾನೆ; ಸಿಮೆಯೋನನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '5':
        title: ಪರಿಶುದ್ಧತೆಯು ಸೌಂದರ್ಯ ತರುತ್ತದೆ; ಪಾಪವನ್ನು ತಿರಸ್ಕರಿಸಿರಿ
      '6':
        title: ಕೆಟ್ಟದ್ದನ್ನು ತಿರಸ್ಕರಿಸಿ ಪರಿಶುದ್ಧತೆಯಲ್ಲಿ ವೃದ್ಧಿಯಾಗಿರಿ
      '7':
        title: ಭವಿಷ್ಯದ ಅರಸನ ಕುರಿತು ಸಿಮೆಯೋನನು ಪ್ರವಾದಿಸುತ್ತಾನೆ
      '8':
        title: ಸಿಮೆಯೋನನು ಸಾಯುತ್ತಾನೆ; ಎಲುಬುಗಳನ್ನು ಹೆಬ್ರೋನಿಗೆ ತರಲಾಗುತ್ತದೆ
      '9':
        title: ಸಿಮೆಯೋನನಿಗಾಗಿ ದುಃಖಿಸಿ ನಿರ್ಗಮನಕ್ಕಾಗಿ ಕಾಯಿರಿ
    Testament of Levi:
      '1':
        title: ಲೇವಿಯು ತನ್ನ ಮರಣದ ಕುರಿತು ಪ್ರವಾದಿಸುತ್ತಾನೆ
      '2':
        title: ಲೇವಿಯು ಪರಲೋಕದ ಭ್ರಷ್ಟತೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '3':
        title: ದೇವರ ಕೋಪಕ್ಕೆ ಆಕಾಶಗಳು ನಡುಗುತ್ತವೆ
      '4':
        title: ಪವಿತ್ರ ಸೇವೆಗೆ ಲೇವಿಯು ಆರಿಸಲ್ಪಡುತ್ತಾನೆ
      '5':
        title: ಪ್ರತೀಕಾರಕ್ಕಾಗಿ ದೇವದೂತನು ಲೇವಿಯನ್ನು ಶಸ್ತ್ರಸಜ್ಜಿತಗೊಳಿಸುತ್ತಾನೆ
      '6':
        title: ಹತ್ಯಾಕಾಂಡದ ಕೋಪಕ್ಕಾಗಿ ಲೇವಿಯು ಪ್ರಾಯಶ್ಚಿತ್ತ ಮಾಡುತ್ತಾನೆ
      '7':
        title: ಲೇವಿಯ ಕತ್ತಿಯಿಂದ ಶೆಕೆಮ್ ಶಾಪಕ್ಕೊಳಗಾಗುತ್ತದೆ
      '8':
        title: ದೇವದೂತರು ಲೇವಿಯನ್ನು ಯಾಜಕತ್ವಕ್ಕೆ ನೇಮಿಸುತ್ತಾರೆ
      '9':
        title: ಇಸಾಕನು ಲೇವಿಗೆ ಧರ್ಮಶಾಸ್ತ್ರಗಳನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '10':
        title: ಭವಿಷ್ಯದ ದುಷ್ಟತನದ ಬಗ್ಗೆ ಲೇವಿಯು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '11':
        title: ಲೇವಿಯು ಪ್ರವಾದನೆಯೊಂದಿಗೆ ಪುತ್ರರಿಗೆ ಹೆಸರಿಡುತ್ತಾನೆ
      '12':
        title: ಲೇವಿಯು ತನ್ನ ವಂಶಾವಳಿಗಳನ್ನು ದಾಖಲಿಸುತ್ತಾನೆ
      '13':
        title: ದೇವರ ಧರ್ಮಶಾಸ್ತ್ರಕ್ಕೆ ಭಯಭಕ್ತಿಯಿಂದ ನಡೆದುಕೊಳ್ಳಲು ಲೇವಿಯು ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
      '14':
        title: ಯಾಜಕರು ತಮ್ಮ ಕರೆಯನ್ನು ದ್ರೋಹಿಸುವರು
      '15':
        title: ತೀರ್ಪಿನಡಿ ದೇವಾಲಯವು ಹಾಳಾಗುತ್ತದೆ
      '16':
        title: ಎಪ್ಪತ್ತು ವಾರಗಳ ಬಂಡಾಯ
      '17':
        title: ಅಪವಿತ್ರತೆಯ ಏಳು ಮಹೋತ್ಸವಕಾಲಗಳು
      '18':
        title: ನಿತ್ಯ ಯಾಜಕನು ಲೋಕವನ್ನು ಪ್ರಕಾಶಗೊಳಿಸುತ್ತಾನೆ
      '19':
        title: ಪುತ್ರರು ದೇವರ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಪಾಲಿಸಲು ಬದ್ಧರಾಗುತ್ತಾರೆ
    Testament of Judah:
