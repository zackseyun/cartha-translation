payload:
  book_metadata:
    1 Esdras:
      display_name: 1 ಎಸ್ದ್ರಾಸ್
      author: ಅಜ್ಞಾತ; 2 ಪೂರ್ವಕಾಲವೃತ್ತಾಂತ 35–36, ಎಜ್ರ ಮತ್ತು ನೆಹೆಮೀಯ 7–8ರ ವಿಷಯವನ್ನು ಮರುಕ್ರಮಗೊಳಿಸಿ ಗ್ರೀಕ್ ಭಾಷೆಯಲ್ಲಿ ಮರುರಚಿಸಿದ ಕೃತಿ.
      audience: ಹಿಂತಿರುಗುವಿಕೆ ಮತ್ತು ಪುನಃಸ್ಥಾಪನೆಯ ಸುಸ್ಪಷ್ಟ ನಿರೂಪಣೆಯನ್ನು ಬಯಸಿದ ಹೆಲೆನಿಸ್ಟಿಕ್ ಕಾಲದ ಯೆಹೂದ್ಯರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2–1ನೇ ಶತಮಾನ.
    Prayer of Manasseh:
      display_name: ಮನಸ್ಸೆಯ ಪ್ರಾರ್ಥನೆ
      author: ಅಜ್ಞಾತ; ಅರಸ ಮನಸ್ಸೆಯ ಹೆಸರಿನಲ್ಲಿ ಬರೆದದ್ದೆಂದು ಪರಿಗಣಿಸಲಾಗಿದೆ.
      audience: ಮನಸ್ಸೆಯ ಪಶ್ಚಾತ್ತಾಪದೊಂದಿಗೆ ತಮ್ಮನ್ನು ಗುರುತಿಸಿಕೊಂಡ ಪಶ್ಚಾತ್ತಾಪಿಗಳು — ಕೆಲವು ಸಂಪ್ರದಾಯಗಳಲ್ಲಿ ಆರಾಧನೆಯಲ್ಲಿ ಬಳಸಲಾಗಿದೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2–1ನೇ ಶತಮಾನ.
    Psalm 151:
      display_name: ಕೀರ್ತನೆ 151
      author: ಅಜ್ಞಾತ; ದಾವೀದನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದದ್ದೆಂದು ಪರಿಗಣಿಸಲಾಗಿದೆ. ಇದರ ಹೀಬ್ರೂ ರೂಪಕ್ಕೆ 11QPsaದಲ್ಲಿ ಪುರಾವೆಯಿದೆ.
      audience: ದಾವೀದನ ಕೀರ್ತನೆಗಳ ಸಂಕಲನಕ್ಕೆ ನಿಷ್ಠರಾಗಿದ್ದ ಚದುರಿಹೋದ ಯೆಹೂದ್ಯ ಸಮುದಾಯಗಳು ಮತ್ತು ಕುಮ್ರಾನ್ ಸಮುದಾಯಗಳು.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನ ಅಥವಾ ಅದಕ್ಕೂ ಮೊದಲು.
    3 Maccabees:
      display_name: 3 ಮಕ್ಕಬೀಯರು
      author: ಅಜ್ಞಾತ; ಗ್ರೀಕ್ ಭಾಷೆಯಲ್ಲಿ ರಚಿಸಲಾಗಿದೆ.
      audience: ಈಜಿಪ್ಟಿನ ಗ್ರೀಕ್‌ಭಾಷಿ ಚದುರಿಹೋದ ಯೆಹೂದ್ಯರು — ಟಾಲೆಮಿ IVರ ಕಾಲದ ಹಿನ್ನೆಲೆಯಲ್ಲಿ ಇರಿಸಲಾದ ವಿಮೋಚನೆಯ ನಿರೂಪಣೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 1ನೇ ಶತಮಾನದಿಂದ ಕ್ರಿ.ಶ. 1ನೇ ಶತಮಾನದವರೆಗೆ.
    4 Maccabees:
      display_name: 4 ಮಕ್ಕಬೀಯರು
      author: ಅಜ್ಞಾತ; ಸ್ಟೋಯಿಕ್ ತತ್ತ್ವಶಾಸ್ತ್ರದ ಪ್ರಭಾವ ಹೊಂದಿದ್ದ ಗ್ರೀಕ್‌ಭಾಷಿ ಯೆಹೂದ್ಯ ಲೇಖಕ.
      audience: ಹೆಲೆನಿಸ್ಟಿಕ್ ಯೆಹೂದ್ಯರು — ನಿಷ್ಠೆಯ ಮೂಲಕ ವಿವೇಕವು ಭಾವೋದ್ರೇಕಗಳನ್ನು ಹತೋಟಿಯಲ್ಲಿಡುವುದರ ಕುರಿತ ತಾತ್ತ್ವಿಕ ಉಪದೇಶ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 1ನೇ ಶತಮಾನ.
    Bel and the Dragon:
      display_name: ಬೇಲ್ ಮತ್ತು ಘಟಸರ್ಪ
      author: ಅಜ್ಞಾತ; ದಾನಿಯೇಲನ ಗ್ರಂಥಕ್ಕೆ ಸೇರಿಸಲಾದ ಗ್ರೀಕ್ ಭಾಗಗಳಲ್ಲಿ ಒಂದು.
      audience: ಗ್ರೀಕ್‌ಭಾಷಿ ಯೆಹೂದ್ಯರು — ವಿಗ್ರಹಾರಾಧನೆಯನ್ನು ಅಣಕಿಸುವ ಖಂಡನೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2–1ನೇ ಶತಮಾನ.
    Letter of Jeremiah:
      display_name: ಯೆರೆಮೀಯನ ಪತ್ರ
      author: ಅಜ್ಞಾತ; ಯೆರೆಮೀಯನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದದ್ದೆಂದು ಪರಿಗಣಿಸಲಾಗಿದೆ.
      audience: ತಮ್ಮ ಸುತ್ತಲಿನ ವಿಗ್ರಹಾರಾಧನೆಯ ಆಕರ್ಷಣೆಗೆ ಒಳಗಾಗುವ ಸಾಧ್ಯತೆಯಿದ್ದ ಚದುರಿಹೋದ ಯೆಹೂದ್ಯರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 4–2ನೇ ಶತಮಾನ.
    Prayer of Azariah and Song of the Three:
      display_name: ಅಜರ್ಯನ ಪ್ರಾರ್ಥನೆ ಮತ್ತು ಮೂವರ ಗೀತೆ
      author: ಅಜ್ಞಾತ; ದಾನಿಯೇಲನ ಗ್ರಂಥಕ್ಕೆ ಸೇರಿಸಲಾದ ಗ್ರೀಕ್ ಭಾಗಗಳಲ್ಲಿ ಒಂದು.
      audience: ಗ್ರೀಕ್‌ಭಾಷಿ ಯೆಹೂದ್ಯರು — ದಾನಿಯೇಲ 3ಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಆರಾಧನಾ ಪಠ್ಯ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನ.
    Susanna:
      display_name: ಸುಸನ್ನಳು
      author: ಅಜ್ಞಾತ; ದಾನಿಯೇಲನ ಗ್ರಂಥಕ್ಕೆ ಸೇರಿಸಲಾದ ಗ್ರೀಕ್ ಭಾಗಗಳಲ್ಲಿ ಒಂದು.
      audience: ಗ್ರೀಕ್‌ಭಾಷಿ ಯೆಹೂದ್ಯರು — ನೀತಿವಂತಿಕೆ ಮತ್ತು ಸುಳ್ಳುಸಾಕ್ಷಿಯ ಖಂಡನೆಯ ಕಥೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2–1ನೇ ಶತಮಾನ.
    1 Clement:
      display_name: 1 ಕ್ಲೆಮೆಂಟ್
      author: ಅಜ್ಞಾತ; ರೋಮ್‌ನ ಕ್ಲೆಮೆಂಟ್ ಬರೆದದ್ದೆಂದು ಪರಿಗಣಿಸಲಾಗಿದೆ.
      audience: ನಾಯಕತ್ವದ ವಿವಾದದಲ್ಲಿ ಸಿಲುಕಿದ್ದ ಕೊರಿಂಥದ ಕ್ರೈಸ್ತ ಸಭೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 96.
  chapter_titles:
    2 Maccabees:
      '12':
        title: ಬಿದ್ದವರಿಗಾಗಿ ಯೂದನು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '13':
        title: ಜಯಕ್ಕಾಗಿ ಯೂದನು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '14':
        title: ನಿಕಾನೋರನು ತನ್ನ ಶಾಂತಿ ಒಪ್ಪಂದಕ್ಕೆ ದ್ರೋಹ ಮಾಡುತ್ತಾನೆ
      '15':
        title: ನಿಕಾನೋರನ ಸೋಲನ್ನು ಯೆಹೂದ್ಯರು ಆಚರಿಸುತ್ತಾರೆ
    1 Esdras:
      '1':
        title: ಯೋಷೀಯನು ಪಸ್ಕವನ್ನು ಆಚರಿಸಿ ಮರಣ ಹೊಂದುತ್ತಾನೆ
      '2':
        title: ಕೋರೆಷನು ಯೆರೆಮೀಯನ ಮಾತನ್ನು ನೆರವೇರಿಸುತ್ತಾನೆ
      '3':
        title: ಸತ್ಯವೇ ಗೆಲ್ಲುತ್ತದೆಂದು ಜೆರುಬ್ಬಾಬೆಲನು ಘೋಷಿಸುತ್ತಾನೆ
      '4':
        title: ದಾರ್ಯಾವೆಷನು ದೇವಾಲಯವನ್ನು ಪುನಃ ಕಟ್ಟಲು ಅನುಮತಿಸುತ್ತಾನೆ
      '5':
        title: ದೇಶಭ್ರಷ್ಟರು ಹಿಂದಿರುಗಿ ಯಜ್ಞವೇದಿಯನ್ನು ಪುನಃ ಕಟ್ಟುತ್ತಾರೆ
      '6':
        title: ಪ್ರವಾದಿಗಳು ದೇವಾಲಯದ ಕೆಲಸಕ್ಕೆ ಉತ್ತೇಜನ ನೀಡುತ್ತಾರೆ
      '7':
        title: ದೇವಾಲಯವು ಮಹಾ ಸಂತೋಷದೊಂದಿಗೆ ಪೂರ್ಣಗೊಳ್ಳುತ್ತದೆ
      '8':
        title: ಎಜ್ರನು ಜನರನ್ನು ಸುರಕ್ಷಿತವಾಗಿ ಹಿಂದಕ್ಕೆ ಮುನ್ನಡೆಸುತ್ತಾನೆ
      '9':
        title: ಎಜ್ರನು ಅವಿಶ್ವಾಸನಿಷ್ಠ ವಿವಾಹಗಳನ್ನು ಎದುರಿಸುತ್ತಾನೆ
    Prayer of Manasseh:
      '1':
        title: ಮನಸ್ಸೆಯು ದೇವರ ಕರುಣೆಗಾಗಿ ಮೊರೆಯಿಡುತ್ತಾನೆ
    Psalm 151:
      '1':
        title: ಕಿರಿಯ ಕುರುಬನು ಅರಸನಾಗಿ ಅಭಿಷೇಕಿಸಲ್ಪಡುತ್ತಾನೆ
    3 Maccabees:
      '1':
        title: ಅರಸನು ದೇವಾಲಯವನ್ನು ಪ್ರವೇಶಿಸಲೇಬೇಕೆಂದು ಹಟಮಾಡುತ್ತಾನೆ
      '2':
        title: ವಿಮೋಚನೆಗಾಗಿ ಇಸ್ರಾಯೇಲರು ಪ್ರಾರ್ಥಿಸುತ್ತಾರೆ
      '3':
        title: ಯೆಹೂದ್ಯರನ್ನು ನಾಶಮಾಡಲು ಅರಸನು ಯೋಜಿಸುತ್ತಾನೆ
      '4':
        title: ಸಾರ್ವಜನಿಕವಾಗಿ ಪ್ರದರ್ಶಿಸಲ್ಪಟ್ಟ ಯೆಹೂದ್ಯರು ಶೋಕಿಸುತ್ತಾರೆ
      '5':
        title: ಮರಣದಂಡನೆಗೆ ಆನೆಗಳನ್ನು ಕರೆತರಲಾಗುತ್ತದೆ
      '6':
        title: ಸ್ವರ್ಗದ ದೂತರು ಯೆಹೂದ್ಯರನ್ನು ರಕ್ಷಿಸುತ್ತಾರೆ
      '7':
        title: ಅರಸನು ಯೆಹೂದ್ಯರನ್ನು ಸುರಕ್ಷಿತವಾಗಿ ಬಿಡುಗಡೆ ಮಾಡುತ್ತಾನೆ
    4 Maccabees:
      '1':
        title: ವಿವೇಕವು ಭಾವೋದ್ರೇಕಗಳ ಮೇಲೆ ಆಳುತ್ತದೆ
      '2':
        title: ಧರ್ಮಶಾಸ್ತ್ರವು ವಿವೇಕದ ಹತೋಟಿಗೆ ಮಾರ್ಗದರ್ಶನ ನೀಡುತ್ತದೆ
      '3':
        title: ದಾವೀದನು ಶತ್ರುಗಳ ನೀರನ್ನು ಕುಡಿಯಲು ನಿರಾಕರಿಸುತ್ತಾನೆ
      '4':
        title: ಸ್ವರ್ಗೀಯ ಸೇನೆಗಳು ಯೆಹೂದ್ಯರನ್ನು ರಕ್ಷಿಸುತ್ತವೆ
      '5':
        title: ಎಲಿಯಾಜರನು ಹಂದಿಮಾಂಸ ತಿನ್ನಲು ನಿರಾಕರಿಸುತ್ತಾನೆ
      '6':
        title: ಎಲಿಯಾಜರನು ದೃಢನಿಷ್ಠೆಯಿಂದ ಮರಣ ಹೊಂದುತ್ತಾನೆ
      '7':
        title: ಎಲಿಯಾಜರನು ವಿವೇಕದ ಶಕ್ತಿಯನ್ನು ಸಾಬೀತುಪಡಿಸುತ್ತಾನೆ
      '8':
        title: ಏಳು ಸಹೋದರರು ಕ್ರೂರ ಅರಸನನ್ನು ಎದುರಿಸುತ್ತಾರೆ
      '9':
        title: ಮೊದಲ ಸಹೋದರನು ಹುತಾತ್ಮನಾಗಿ ಮರಣ ಹೊಂದುತ್ತಾನೆ
      '10':
        title: ನಾಲ್ಕನೇ ಸಹೋದರನು ತನ್ನ ನಾಲಿಗೆಯನ್ನು ಒಡ್ಡಲು ನಿರಾಕರಿಸುತ್ತಾನೆ
      '11':
        title: ಆರನೇ ಸಹೋದರನು ಚಿತ್ರಹಿಂಸೆಯನ್ನು ತಾಳಿಕೊಳ್ಳುತ್ತಾನೆ
      '12':
        title: ಕಿರಿಯ ಸಹೋದರನು ತನ್ನನ್ನು ತಾನೇ ಎಸೆಯುತ್ತಾನೆ
      '13':
        title: ಸಹೋದರರು ಒಬ್ಬರನ್ನೊಬ್ಬರು ಉತ್ತೇಜಿಸುತ್ತಾರೆ
      '14':
        title: ತಾಯಿಯು ತನ್ನ ಪುತ್ರರಿಗೆ ಮರಣವನ್ನು ಎದುರಿಸಲು ಪ್ರೇರೇಪಿಸುತ್ತಾಳೆ
      '15':
        title: ತಾಯಿಯು ಪುತ್ರರಿಗಿಂತ ದೇವರನ್ನು ಆರಿಸಿಕೊಳ್ಳುತ್ತಾಳೆ
      '16':
        title: ತಾಯಿಯು ಪುತ್ರರನ್ನು ಮರಣಿಸಲು ಮನವೊಲಿಸುತ್ತಾಳೆ
      '17':
        title: ಏಳು ಹುತಾತ್ಮರು ದೇವರನ್ನು ಗೌರವಿಸುತ್ತಾರೆ
      '18':
        title: ಮಕ್ಕಳು ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ಪಾಲಿಸಿ ಜೀವಿಸುತ್ತಾರೆ
    Bel and the Dragon:
      '1':
        title: ದಾನಿಯೇಲನು ಬೇಲ್ ಮತ್ತು ಘಟಸರ್ಪವನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
    Letter of Jeremiah:
      '1':
        title: ಬಾಬಿಲೋನಿನಲ್ಲಿ ವಿಗ್ರಹಗಳಿಗೆ ತಪ್ಪಾಗಿ ಭಯಪಡುತ್ತಾರೆ
    Prayer of Azariah and Song of the Three:
      '1':
        title: ಧಗಧಗಿಸುವ ಬೆಂಕಿಯಲ್ಲಿ ಅಜರ್ಯನು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
    Susanna:
      '1':
        title: ನ್ಯಾಯಾಧೀಶರ ಸಂಚನ್ನು ದಾನಿಯೇಲನು ಬಯಲಿಗೆಳೆಯುತ್ತಾನೆ
    1 Clement:
      '1':
        title: ಅಪವಿತ್ರ ದಂಗೆಯಿಂದ ಸಹೋದರರು ಸಂಕಟಪಡುತ್ತಾರೆ
      '2':
        title: ದೀನತೆಯು ಶಾಂತಿಯುತ ಉತ್ಸಾಹವನ್ನು ತರುತ್ತದೆ
      '3':
        title: ಅಸೂಯೆಯು ಯುದ್ಧ ಮತ್ತು ಸೆರೆಯನ್ನು ತರುತ್ತದೆ
      '4':
        title: ಹೊಟ್ಟೆಕಿಚ್ಚು ಪ್ರಾಚೀನ ಕೊಲೆಗಳಿಗೆ ಕಾರಣವಾಯಿತು
      '5':
