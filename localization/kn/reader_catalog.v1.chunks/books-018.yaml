payload:
  book_metadata:
    2 Esdras:
      display_name: 2 ಎಸ್ದ್ರಾಸ್
      author: ಲೇಖಕರು ತಿಳಿದಿಲ್ಲ; ಮೂಲತಃ ಯೆಹೂದ್ಯರ ಕೃತಿಯಾಗಿದ್ದ ಕೇಂದ್ರಭಾಗದ (4 ಎಜ್ರಾ, ಅಧ್ಯಾಯಗಳು 3–14) ಸುತ್ತ ಕ್ರೈಸ್ತ ಸಂಪಾದನೆಯ ಚೌಕಟ್ಟು ಇದೆ.
      audience: ಕ್ರಿ.ಶ. 70ರ ನಂತರ ದೇವರ ನ್ಯಾಯದ ಪ್ರಶ್ನೆಯೊಂದಿಗೆ ಹೋರಾಡುತ್ತಿದ್ದ ಯೆಹೂದ್ಯರು; ಬಳಿಕ ಕ್ರೈಸ್ತ ಓದುಗರಿಗಾಗಿ ವಿಸ್ತರಿಸಲಾಯಿತು.
      date: ಯೆಹೂದ್ಯ ಕೇಂದ್ರಭಾಗವು ಬಹುಶಃ ಕ್ರಿ.ಶ. 100ರ ಸುಮಾರಿನದು; ಕ್ರೈಸ್ತ ಸೇರ್ಪಡೆಗಳು ಬಹುಶಃ ಕ್ರಿ.ಶ. 2–3ನೇ ಶತಮಾನಗಳವು.
    Didache:
      display_name: ದಿದಾಖೆ
      author: ಲೇಖಕರು ತಿಳಿದಿಲ್ಲ (ಶೀರ್ಷಿಕೆಯ ಅರ್ಥ, “ಹನ್ನೆರಡು ಅಪೊಸ್ತಲರ ಬೋಧನೆ”).
      audience: ಆರಂಭಿಕ ಕ್ರೈಸ್ತ ಸಭೆಗಳು—ನೈತಿಕತೆ, ದೀಕ್ಷಾಸ್ನಾನ, ಪ್ರಭುಭೋಜನ ಮತ್ತು ಸಂಚಾರಿ ಬೋಧಕರ ಕುರಿತ ಸಂಕ್ಷಿಪ್ತ ಕೈಪಿಡಿ.
      date: ಬಹುಶಃ ಕ್ರಿ.ಶ. 1ನೇ ಶತಮಾನದ ಕೊನೆಯ ಭಾಗದಿಂದ 2ನೇ ಶತಮಾನದ ಆರಂಭದವರೆಗೆ.
    Gospel of Thomas:
      display_name: ತೋಮನ ಸುವಾರ್ತೆ
      author: ಲೇಖಕರು ತಿಳಿದಿಲ್ಲ; ಆರಂಭಿಕ ವಾಕ್ಯವು ಈ ವಚನಸಂಗ್ರಹವನ್ನು “ದಿದಿಮೋಸ್ ಯೂದಾಸ್ ತೋಮ”ನಿಗೆ ಸೇರಿಸುತ್ತದೆ. ಇದರ ಸಂಪೂರ್ಣ ಪಾಠವು ನಾಗ್ ಹಮ್ಮಾದಿಯಿಂದ ದೊರೆತ 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಭಾಷಾಂತರದಲ್ಲಿ (NHC II,2) ಮಾತ್ರ ಉಳಿದಿದೆ; ಆಕ್ಸಿರಿಂಕಸ್‌ನಿಂದ ಮೂರು ಗ್ರೀಕ್ ತುಣುಕುಗಳೂ ದೊರೆತಿವೆ.
      audience: ಸಿರಿಯದ ಜ್ಞಾನಪರಂಪರೆ ಮತ್ತು ಆದಿ-ಜ್ಞಾನವಾದಿ ಚಿಂತನೆಯಿಂದ ರೂಪುಗೊಂಡ, ಯೇಸುವಿನ ವಚನಗಳಲ್ಲಿ ಅಂತರಂಗದ ನಿಗೂಢ ಸ್ವಜ್ಞಾನವನ್ನು ಹುಡುಕುವ ಕ್ರೈಸ್ತ ಓದುಗರು.
      date: ಗ್ರೀಕ್ ಮೂಲವು ಬಹುಶಃ ಕ್ರಿ.ಶ. 50–140ರ ಕಾಲದ್ದು; ಕಾಪ್ಟಿಕ್ ಹಸ್ತಪ್ರತಿಯು ಬಹುಶಃ ಕ್ರಿ.ಶ. 340ರ ಕಾಲದ್ದು.
      summary: ತೋಮನ ಸುವಾರ್ತೆಯು ಯೇಸುವಿಗೆ ಸೇರಿಸಲಾದ ವಚನಗಳ ಸಂಗ್ರಹವಾಗಿದೆ. ಇದರಲ್ಲಿ ನಿರಂತರ ಕಥನ ಇಲ್ಲ; ವಚನಗಳ ಅರ್ಥವನ್ನು ಕಂಡುಕೊಳ್ಳುವಂತೆ ಇದು ಓದುಗರನ್ನು ಮತ್ತೆ ಮತ್ತೆ ಕರೆಯುತ್ತದೆ.
  chapter_titles:
    2 Baruch:
      '72':
        title: ಪ್ರಕಾಶಮಾನವಾದ ನೀರು ಮೆಸ್ಸೀಯನ ಕಾಲವನ್ನು ಸೂಚಿಸುತ್ತದೆ
      '73':
        title: ಶಾಂತಿಯ ಯುಗವು ಎಲ್ಲ ಕಲಹವನ್ನು ಕೊನೆಗೊಳಿಸುತ್ತದೆ
      '74':
        title: ನಿರ್ಮಿಸುವವರು ಶಾಂತಿಯಿಂದ ಕೊಯ್ಲು ಮಾಡುತ್ತಾರೆ
      '75':
        title: ಬಾರೂಕನು ದೇವರ ಕರುಣೆಯನ್ನು ಸ್ತುತಿಸುತ್ತಾನೆ
      '76':
        title: ಜನರು ಬಾರೂಕನ ಬೋಧನೆಯನ್ನು ಕೋರುತ್ತಾರೆ
      '77':
        title: ಬಾರೂಕನು ಜನರಿಗೆ ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ನೆನಪಿಸುತ್ತಾನೆ
      '78':
        title: ಬಾರೂಕನು ದೇಶಭ್ರಷ್ಟರಿಗೆ ನಿರೀಕ್ಷೆಯ ಸಂದೇಶ ಬರೆಯುತ್ತಾನೆ
      '79':
        title: ಸೃಷ್ಟಿಕರ್ತನ ಪ್ರೀತಿ ಬದಲಾಗದೆ ಉಳಿಯುತ್ತದೆ
      '80':
        title: ನೆಬೂಕದ್ನೆಚ್ಚರನ ದಾಳಿ ಪೂರ್ವನಿರ್ಧರಿತವಾಗಿದೆ
      '81':
        title: ಸಂಕಟದಲ್ಲಿರುವವರಿಗೆ ದೇವರ ಕರುಣೆ ಹತ್ತಿರವಾಗಿದೆ
      '82':
        title: ದುಷ್ಟ ಜನಾಂಗಗಳು ನ್ಯಾಯತೀರ್ಪನ್ನು ಎದುರಿಸುತ್ತವೆ
      '83':
        title: ಮೋಶೆ ಮತ್ತು ಯೆರೆಮೀಯರು ನ್ಯಾಯತೀರ್ಪುಗಳ ಬಗ್ಗೆ ಎಚ್ಚರಿಸಿದರು
      '84':
        title: ಧರ್ಮಶಾಸ್ತ್ರವನ್ನು ನೆನಪಿಡುವಂತೆ ಬಾರೂಕನು ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '85':
        title: ಅಂತ್ಯವು ಹತ್ತಿರವಾಗಿದೆ; ಆಜ್ಞೆಗಳನ್ನು ಸ್ವೀಕರಿಸಿ
      '86':
        title: ಸಭೆಗಳಲ್ಲಿ ಪತ್ರವನ್ನು ಗಟ್ಟಿಯಾಗಿ ಓದಿರಿ
      '87':
        title: ಬೋಧಿಸಲಾದ ಆಜ್ಞೆಗಳನ್ನು ದೃಢವಾಗಿ ಹಿಡಿದುಕೊಳ್ಳಿರಿ
    2 Esdras:
      '1':
        title: ಇಸ್ರಾಯೇಲಿನ ತಿರಸ್ಕಾರಕ್ಕಾಗಿ ದೇವರು ದುಃಖಿಸುತ್ತಾನೆ
      '2':
        title: ಎಜ್ರನು ಮುಂದಿನ ಮಹಿಮೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '3':
        title: ಎಜ್ರನು ಇಸ್ರಾಯೇಲಿನ ಚರಿತ್ರೆಯನ್ನು ನೆನೆದು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '4':
        title: ಊರಿಯೇಲನು ಎಜ್ರನಿಗೆ ಅವನ ಮಿತಿಗಳನ್ನು ತಿಳಿಸುತ್ತಾನೆ
      '5':
        title: ಬರಲಿರುವ ಭೀತಿಯ ನಡುವೆ ಎಜ್ರನು ಮೊರೆಯಿಡುತ್ತಾನೆ
      '6':
        title: ಎಜ್ರನು ಸೃಷ್ಟಿಯ ದಿನಗಳನ್ನು ನೆನೆದು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '7':
        title: ಎಜ್ರನು ಅಂತಿಮ ನ್ಯಾಯತೀರ್ಪನ್ನು ಕಾಣುತ್ತಾನೆ
      '8':
        title: ಎಜ್ರನು ತಿಳಿವಳಿಕೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '9':
        title: ಎಜ್ರನು ಚೀಯೋನಿನ ಮುಂದಿನ ಮಹಿಮೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '10':
        title: ಎಜ್ರನು ಚೀಯೋನಿನ ಮಹಿಮೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '11':
        title: ಹದ್ದಿನ ಕನಸುಗಳು ಅಂತ್ಯವನ್ನು ಮುನ್ಸೂಚಿಸುತ್ತವೆ
      '12':
        title: ಎಜ್ರನು ಸಿಂಹ ಮತ್ತು ಹದ್ದುಗಳ ಕುರಿತು ಕನಸು ಕಾಣುತ್ತಾನೆ
      '13':
        title: ಸಮುದ್ರದಿಂದ ಬಂದ ಮನುಷ್ಯನು ಸೃಷ್ಟಿಯನ್ನು ಬಿಡಿಸುತ್ತಾನೆ
      '14':
        title: ನಂಬಿಗಸ್ತ ವಚನಗಳನ್ನು ಹೇಳುವಂತೆ ಕರ್ತನು ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
      '15':
        title: ಬರಲಿರುವ ನ್ಯಾಯತೀರ್ಪಿನ ಕುರಿತು ಪ್ರವಾದಿ ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '16':
        title: ದೇವರ ನ್ಯಾಯತೀರ್ಪುಗಳು ಭೂಮಿಯನ್ನೂ ಸಮುದ್ರವನ್ನೂ ನಡುಗಿಸುತ್ತವೆ
    Didache:
      '1':
        title: ದೇವರನ್ನು ಪ್ರೀತಿಸಿ ಜೀವದ ಮಾರ್ಗವನ್ನು ಆರಿಸಿಕೊಳ್ಳಿರಿ
      '2':
        title: ಕೆಟ್ಟದ್ದನ್ನು ಬಿಟ್ಟು ಆಜ್ಞೆಗಳನ್ನು ಅನುಸರಿಸಿರಿ
      '3':
        title: ಎಲ್ಲ ವಿಧದ ಕೆಟ್ಟತನದಿಂದ ದೂರ ಓಡಿರಿ
      '4':
        title: ದೇವರ ವಾಕ್ಯವನ್ನು ಯಾವಾಗಲೂ ಗೌರವಿಸಿರಿ
      '5':
        title: ಮರಣದ ಮಾರ್ಗವು ಪಾಪಕ್ಕೆ ನಡೆಸುತ್ತದೆ
      '6':
        title: ಏನನ್ನೂ ಸೇರಿಸದೆ ಬೋಧನೆಯನ್ನು ಅನುಸರಿಸಿರಿ
      '7':
        title: ಜೀವಜಲದಲ್ಲಿ ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ದೀಕ್ಷಾಸ್ನಾನ ಮಾಡಿಸಿರಿ
      '8':
        title: ನೀತಿವಂತ ತಂದೆಗೆ ಪ್ರಾರ್ಥಿಸಿರಿ
      '9':
        title: ಪಾತ್ರೆ ಮತ್ತು ರೊಟ್ಟಿಗಾಗಿ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸಿರಿ
      '10':
        title: ಪವಿತ್ರ ತಂದೆಗೆ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸಲಾಗುತ್ತದೆ
      '11':
        title: ನಿಜವಾದ ಬೋಧಕರನ್ನೂ ಪ್ರವಾದಿಗಳನ್ನೂ ಸ್ವಾಗತಿಸಿರಿ
      '12':
        title: ಪ್ರಯಾಣಿಕರಿಗೆ ನೆರವಾಗಿ, ಆದರೆ ಅವರನ್ನು ಪರೀಕ್ಷಿಸಿರಿ
      '13':
        title: ನಿಜವಾದ ಪ್ರವಾದಿಗಳನ್ನೂ ಬೋಧಕರನ್ನೂ ಬೆಂಬಲಿಸಿರಿ
      '14':
        title: ರೊಟ್ಟಿಯನ್ನು ಮುರಿಯುವ ಮೊದಲು ಪಾಪಗಳನ್ನು ಒಪ್ಪಿಕೊಳ್ಳಿರಿ
      '15':
        title: ಯೋಗ್ಯ ಮೇಲ್ವಿಚಾರಕರನ್ನೂ ಸಭಾಸೇವಕರನ್ನೂ ನೇಮಿಸಿರಿ
      '16':
        title: ಎಚ್ಚರವಾಗಿರಿ; ನಂಬಿಕೆಯು ಸಂಕಟಗಳಲ್ಲಿ ತಾಳಿಕೊಳ್ಳಲಿ
    Gospel of Thomas:
      '0':
        title: ತೋಮನು ಯೇಸುವಿನ ರಹಸ್ಯ ವಚನಗಳನ್ನು ಬರೆಯುತ್ತಾನೆ
      '1':
        title: ಯೇಸು ಗುಪ್ತ ಜ್ಞಾನವನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '2':
        title: ರಾಜ್ಯವು ನಿಮ್ಮ ಒಳಗೂ ಹೊರಗೂ ಇದೆ
      '3':
        title: ರಾಜ್ಯವು ಒಳಗೂ ಹೊರಗೂ ಇದೆ
      '4':
        title: ಯೇಸು ದೀನತೆ ಮತ್ತು ಜ್ಞಾನವನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '5':
        title: ಯೇಸು ರಹಸ್ಯಗಳ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '6':
        title: ಮನುಷ್ಯನು ತಿಂದ ಸಿಂಹವು ಧನ್ಯ
      '7':
        title: ಜ್ಞಾನಿಯಾದ ಮೀನುಗಾರನು ದೊಡ್ಡ ಮೀನನ್ನು ಆರಿಸುತ್ತಾನೆ
      '8':
        title: ಜ್ಞಾನಿಯಾದ ಮೀನುಗಾರನು ದೊಡ್ಡದನ್ನು ಆರಿಸುತ್ತಾನೆ
      '9':
        title: ಬಿತ್ತುವವನು ಬೀಜವನ್ನು ಎಲ್ಲೆಡೆ ಚೆಲ್ಲುತ್ತಾನೆ
      '10':
        title: ಯೇಸು ಉರಿಯುತ್ತಿರುವ ಬೆಂಕಿಯನ್ನು ಕಾಯುತ್ತಾನೆ
      '11':
        title: ಯೇಸು ಕಳೆದುಹೋಗುವಿಕೆಯ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '12':
        title: ಯಾಕೋಬನು ಶಿಷ್ಯರನ್ನು ಮುನ್ನಡೆಸುವನು
      '13':
        title: ಉಪವಾಸ, ಪ್ರಾರ್ಥನೆ ಮತ್ತು ದಾನ ಪಾಪ
      '14':
        title: ಯೇಸು ನಿಜವಾದ ಭಕ್ತಿಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '15':
        title: ನಿಮ್ಮ ತಂದೆಯಾಗಿರುವ ಆತನನ್ನು ಆರಾಧಿಸಿರಿ
      '16':
        title: ಯೇಸು ವಿಭಜನೆಯ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '17':
        title: ಆರಂಭವನ್ನು ಕಂಡುಕೊಳ್ಳುವವನು ಧನ್ಯನು
      '18':
        title: ಯೇಸು ಆರಂಭ ಮತ್ತು ಅಂತ್ಯವನ್ನು ವಿವರಿಸುತ್ತಾನೆ
      '19':
        title: ರಾಜ್ಯವು ಬೆಳೆಯುವ ಸಾಸಿವೆಕಾಳಿನಂತಿದೆ
      '20':
        title: ಮರಿಯಳು ಶಿಷ್ಯರ ಅಂತ್ಯದ ಕುರಿತು ಕೇಳುತ್ತಾಳೆ
      '21':
        title: ಮರಿಯಳು ಯೇಸುವಿನ ಶಿಷ್ಯರ ಕುರಿತು ಪ್ರಶ್ನಿಸುತ್ತಾಳೆ
      '22':
