payload:
  book_metadata:
    Lamentations:
      display_name: ಪ್ರಲಾಪಗಳು
      author: ಕರ್ತೃ ಅಜ್ಞಾತ; ಸಂಪ್ರದಾಯವು ಇದನ್ನು ಯೆರೆಮೀಯನಿಗೆ ಸಂಬಂಧಿಸುತ್ತದೆ.
      audience: ಕ್ರಿ.ಪೂ. 586ರಲ್ಲಿ ಯೆರೂಸಲೇಮ್ ನಾಶವಾದದ್ದಕ್ಕಾಗಿ ಶೋಕಿಸುತ್ತಿದ್ದ ಯೆಹೂದದ ಜನರು.
      date: ಕ್ರಿ.ಪೂ. 586ರ ಸ್ವಲ್ಪ ಸಮಯದ ನಂತರ.
    Ezekiel:
      display_name: ಯೆಹೆಜ್ಕೇಲ
      author: ಬಾಬಿಲೋನಿಗೆ ಗಡಿಪಾರಾಗಿದ್ದ ಯಾಜಕ ಯೆಹೆಜ್ಕೇಲ; ನಂತರದ ಸಂಪಾದಕೀಯ ಬೆಳವಣಿಗೆಯೂ ಇದೆ.
      audience: ದೇವಾಲಯದಿಂದ ದೂರವಿದ್ದರೂ ದೇವರ ಸಾನ್ನಿಧ್ಯವನ್ನು ಹೊಸದಾಗಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುತ್ತಿದ್ದ ಬಾಬಿಲೋನಿನ ಯೆಹೂದದ ಗಡಿಪಾರು ಜನರು.
      date: ಪ್ರವಾದಿಯ ಸೇವಾಕಾಲ ಸುಮಾರು ಕ್ರಿ.ಪೂ. 593–571; ಅಂತಿಮ ರೂಪವು ಸ್ವಲ್ಪ ನಂತರದ್ದು.
    Daniel:
      display_name: ದಾನಿಯೇಲ
      author: ಕರ್ತೃ ಅಜ್ಞಾತ; ಗಡಿಪಾರಿನ ದಾನಿಯೇಲನ ಬರಹವೆಂದು ಕೃತಿ ತನ್ನನ್ನು ಪರಿಚಯಿಸುತ್ತದೆ.
      audience: ಹೆಲೆನಿಸ್ಟಿಕ್ ಹಿಂಸೆಗೆ ಒಳಗಾಗಿದ್ದ ಯೆಹೂದ್ಯರು—ವಿಶೇಷವಾಗಿ ನಾಲ್ಕನೇ ಅಂತಿಯೋಕಸ್ ಎಪಿಫಾನೀಸ್‌ನ ಆಳ್ವಿಕೆಯಲ್ಲಿ (ಕ್ರಿ.ಪೂ. 167–164).
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 165ರಲ್ಲಿ ಈಗ ಸ್ವೀಕೃತವಾಗಿರುವ ರೂಪವನ್ನು ತಲುಪಿತು; 1–6ನೇ ಅಧ್ಯಾಯಗಳು ಇನ್ನೂ ಹಳೆಯ ಅರಮನೆಯ ಕಥೆಗಳನ್ನು ಒಳಗೊಂಡಿವೆ.
    Hosea:
      display_name: ಹೋಶೇಯ
      author: ಬೇರಿಯ ಮಗ ಹೋಶೇಯ.
      audience: ಅಶ್ಶೂರದ ವಶವಾಗುವುದಕ್ಕೆ ಮುಂಚಿನ ಕೊನೆಯ ದಶಕಗಳಲ್ಲಿದ್ದ ಉತ್ತರದ ಇಸ್ರಾಯೇಲ್ ರಾಜ್ಯ.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 750–722.
  chapter_titles:
    Jeremiah:
      '33':
        title: ಹಾಳಾದ ನಗರಕ್ಕೆ ಗುಣಪಡಿಸುವ ವಾಗ್ದಾನ
      '34':
        title: ಚಿದ್ಕೀಯನಿಗೆ ತೀರ್ಪು ಮತ್ತು ಎಚ್ಚರಿಕೆ
      '35':
        title: ರೇಕಾಬ್ಯರು ನಿಷ್ಠೆಯಿಂದ ವಿಧೇಯರಾಗುತ್ತಾರೆ
      '36':
        title: ಬಾರೂಕನು ಎಚ್ಚರಿಕೆಯ ಸುರುಳಿಯನ್ನು ಬರೆಯುತ್ತಾನೆ
      '37':
        title: ಯೆರೆಮೀಯನು ಅರಸ ಚಿದ್ಕೀಯನನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '38':
        title: ಯೆರೆಮೀಯನನ್ನು ನೀರಿಲ್ಲದ ತೊಟ್ಟಿಗೆ ಎಸೆಯುತ್ತಾರೆ
      '39':
        title: ಎಬೆದ್‌ಮೆಲೆಕನು ಯೆರೆಮೀಯನನ್ನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '40':
        title: ಯೆರೂಸಲೇಮ್ ಪತನದ ಬಳಿಕ ಯೆರೆಮೀಯನ ಬಿಡುಗಡೆ
      '41':
        title: ಇಷ್ಮಾಯೇಲನು ಮೋಸದಿಂದ ಗೆದಲ್ಯನನ್ನು ಕೊಲ್ಲುತ್ತಾನೆ
      '42':
        title: ಈಜಿಪ್ಟಿಗೆ ಓಡಿಹೋಗಬೇಡಿ ಎಂದು ಯೆರೆಮೀಯನ ಎಚ್ಚರಿಕೆ
      '43':
        title: ದಂಗೆಕೋರರು ಯೆರೆಮೀಯನನ್ನು ಈಜಿಪ್ಟಿಗೆ ಎಳೆದೊಯ್ಯುತ್ತಾರೆ
      '44':
        title: ದೇವರ ಆಜ್ಞೆಗೆ ವಿಧೇಯರಾಗಲು ನಿರಾಕರಣೆ
      '45':
        title: ದುಃಖದ ಭಾರದಿಂದ ಬಳಲಿದ ಬಾರೂಕನು
      '46':
        title: ಗರ್ವಿಷ್ಠ ಈಜಿಪ್ಟ್ ಸಾಮ್ರಾಜ್ಯಕ್ಕೆ ದೇವರ ತೀರ್ಪು
      '47':
        title: ತಡೆಯಲಾಗದ ಪ್ರವಾಹವನ್ನು ಎದುರಿಸುವ ಫಿಲಿಷ್ಟಿಯರು
      '48':
        title: ಮೋವಾಬಿನ ನಾಶ ಮತ್ತು ಭವಿಷ್ಯದ ನಿರೀಕ್ಷೆ
      '49':
        title: ಯೆಹೂದದ ಸುತ್ತಲಿನ ಜನಾಂಗಗಳಿಗೆ ತೀರ್ಪು
      '50':
        title: ಬಾಬಿಲೋನ್ ಬೀಳುತ್ತದೆ, ದೇವರು ಜಯಿಸುತ್ತಾನೆ
      '51':
        title: ದೈವಿಕ ತೀರ್ಪಿನಿಂದ ಬಾಬಿಲೋನ್ ಪತನ
      '52':
        title: ಯೆರೂಸಲೇಮ್ ಪತನ, ದೇವಾಲಯ ದಹನ
    Lamentations:
      '1':
        title: ಕೈಬಿಡಲ್ಪಟ್ಟ ಯೆರೂಸಲೇಮ್ ಏಕಾಂಗಿಯಾಗಿ ಅಳುತ್ತದೆ
      '2':
        title: ಕರ್ತನು ಚೀಯೋನಿನ ಮೇಲೆ ಕೋಪ ಸುರಿಸುತ್ತಾನೆ
      '3':
        title: ಪ್ರತಿ ಮುಂಜಾನೆಯ ಕರುಣೆಯಿಂದ ಚಿಗುರುವ ನಿರೀಕ್ಷೆ
      '4':
        title: ಅಮೂಲ್ಯ ಚೀಯೋನ್ ಹಾಳಾಗಿ ಹಸಿವಿನಿಂದ ನರಳುತ್ತದೆ
      '5':
        title: 'ಜನರ ಮೊರೆ: ಕರ್ತನೇ, ಆಲಿಸು'
    Ezekiel:
      '1':
        title: ಯೆಹೆಜ್ಕೇಲನಿಗೆ ಪರಲೋಕದ ದರ್ಶನ
      '2':
        title: ಯೆಹೆಜ್ಕೇಲನಿಗೆ ದೇವರ ನೇಮಕ
      '3':
        title: ಯೆಹೆಜ್ಕೇಲನು ಪ್ರಲಾಪಗಳ ಸುರುಳಿಯನ್ನು ತಿನ್ನುತ್ತಾನೆ
      '4':
        title: ಯೆರೂಸಲೇಮಿನ ಮುತ್ತಿಗೆಯನ್ನು ಅಭಿನಯಿಸುವ ಯೆಹೆಜ್ಕೇಲನು
      '5':
        title: ಸಾಂಕೇತಿಕವಾಗಿ ಕೂದಲು ಬೋಳಿಸುವ ಯೆಹೆಜ್ಕೇಲನು
      '6':
        title: ಇಸ್ರಾಯೇಲಿಗೆ ವಿರುದ್ಧವಾಗಿ ಯೆಹೆಜ್ಕೇಲನ ಪ್ರವಾದನೆ
      '7':
        title: ಬರಲಿರುವ ತೀರ್ಪನ್ನು ಪ್ರಕಟಿಸುವ ದೇವರು
      '8':
        title: ದೇವಾಲಯದ ಅಸಹ್ಯ ಕೃತ್ಯಗಳನ್ನು ನೋಡುವ ಯೆಹೆಜ್ಕೇಲನು
      '9':
        title: ವಧಕರು ಯೆರೂಸಲೇಮಿನ ಪಾಪಕ್ಕೆ ತೀರ್ಪು ನೀಡುತ್ತಾರೆ
      '10':
        title: ಮಹಿಮೆ ತೀರ್ಪಿನ ಕೆಂಡಗಳನ್ನು ಚದರಿಸುತ್ತದೆ
      '11':
        title: ನಗರದ ನಾಶದ ಕುರಿತು ಯೆಹೆಜ್ಕೇಲನ ಪ್ರವಾದನೆ
      '12':
        title: ಗಡಿಪಾರನ್ನು ಅಭಿನಯಿಸುವ ಯೆಹೆಜ್ಕೇಲನು
      '13':
        title: ಸುಳ್ಳು ಪ್ರವಾದಿಗಳನ್ನು ಖಂಡಿಸುವ ಯೆಹೆಜ್ಕೇಲನು
      '14':
        title: ಇಸ್ರಾಯೇಲಿನ ಅಪನಂಬಿಗಸ್ತಿಕೆಗೆ ದೇವರ ತೀರ್ಪು
      '15':
        title: ಯೆರೂಸಲೇಮ್ ನಿರುಪಯುಕ್ತ ದ್ರಾಕ್ಷಿಬಳ್ಳಿಗೆ ಹೋಲಿಕೆ
      '16':
        title: ಯೆರೂಸಲೇಮಿನ ಅಪನಂಬಿಗಸ್ತಿಕೆಗಾಗಿ ದೇವರ ಪ್ರಲಾಪ
      '17':
        title: ಹದ್ದುಗಳ ಕುರಿತು ಯೆಹೆಜ್ಕೇಲನ ಒಗಟು
      '18':
        title: ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ದೇವರ ತೀರ್ಪು
      '19':
        title: ಇಸ್ರಾಯೇಲಿನ ರಾಜಕುಮಾರರ ವೈಫಲ್ಯ ಮತ್ತು ಪತನ
      '20':
        title: ಇಸ್ರಾಯೇಲಿನ ದಂಗೆಕೋರ ಗತಕಾಲವನ್ನು ವಿವರಿಸುವ ದೇವರು
      '21':
        title: ಜನಾಂಗಗಳ ವಿರುದ್ಧ ಬರುವ ತೀರ್ಪಿನ ಕತ್ತಿ
      '22':
        title: ರಕ್ತಸಿಕ್ತ ನಗರವೆಂದು ಬಯಲಾದ ಯೆರೂಸಲೇಮ್
      '23':
        title: ವಿಗ್ರಹಗಳಿಗಾಗಿ ಹಂಬಲಿಸಿದ ಇಬ್ಬರು ಸಹೋದರಿಯರು
      '24':
        title: ಗುರುತಾಗಿ ಯೆಹೆಜ್ಕೇಲನ ಪತ್ನಿಯ ಮರಣ
      '25':
        title: ಯೆಹೂದದ ಸುತ್ತಲಿನ ಜನಾಂಗಗಳಿಗೆ ತೀರ್ಪು
      '26':
        title: ಹಿಗ್ಗಿದ ತೂರಿಗೆ ದೇವರ ತೀರ್ಪು
      '27':
        title: ವೈಭವಶಾಲಿ ತೂರಿಗಾಗಿ ಶೋಕಗೀತೆ
      '28':
        title: ತೂರಿನ ಆಡಳಿತಗಾರನನ್ನು ಎದುರಿಸುವ ಯೆಹೆಜ್ಕೇಲನು
      '29':
        title: ಫರೋಹನ ಗರ್ವದಿಂದ ಈಜಿಪ್ಟಿನ ಪತನ
      '30':
        title: ಫರೋಹನ ಅಧಿಕಾರ ಕಸಿದುಕೊಳ್ಳಲ್ಪಡುತ್ತದೆ
      '31':
        title: ಅಶ್ಶೂರದ ಪತನದಿಂದ ಫರೋಹನಿಗೆ ಎಚ್ಚರಿಕೆ
      '32':
        title: ಬಾಬಿಲೋನಿನ ಕೈಯಲ್ಲಿ ಫರೋಹನ ಪತನ
      '33':
        title: ಕಾವಲುಗಾರ ಯೆಹೆಜ್ಕೇಲನು ದುಷ್ಟರನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '34':
        title: ಕುರುಬರ ವೈಫಲ್ಯ; ದೇವರೇ ಕುರುಬನಾಗುವನು
      '35':
        title: ಎದೋಮಿನ ದ್ವೇಷಕ್ಕೆ ಶೀಘ್ರದಲ್ಲೇ ವಿನಾಶ
      '36':
        title: ಇಸ್ರಾಯೇಲಿನ ಪುನಃಸ್ಥಾಪನೆ; ಫಲಭರಿತ ಪರ್ವತಗಳು
      '37':
        title: ಒಣ ಮೂಳೆಗಳಿಗೆ ಜೀವ; ಜನಾಂಗದ ಪುನರೇಕೀಕರಣ
      '38':
        title: ಗೋಗನು ದಾಳಿ ಮಾಡುತ್ತಾನೆ; ಪರಿಶುದ್ಧ ದೇವರು ಇಸ್ರಾಯೇಲನ್ನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '39':
        title: ಗೋಗನ ನಾಶ; ಜನಾಂಗಗಳು ಕರ್ತನನ್ನು ತಿಳಿಯುತ್ತವೆ
      '40':
        title: ಎತ್ತರದ ಪರ್ವತದಲ್ಲಿ ಅಳತೆಯ ದರ್ಶನ ಆರಂಭ
      '41':
        title: ಪರಿಶುದ್ಧ ಮಹಿಮೆಯ ದೇವಾಲಯದ ಒಳಭಾಗದ ಅಳತೆ
      '42':
        title: ಪ್ರತ್ಯೇಕಿಸಲಾದ ಯಾಜಕರ ಕೋಣೆಗಳ ಅಳತೆ
      '43':
        title: ಮಹಿಮೆ ಮರಳುತ್ತದೆ; ದೇವಾಲಯವು ಪರಿಶುದ್ಧತೆಯಿಂದ ತುಂಬುತ್ತದೆ
      '44':
        title: ಮುಚ್ಚಿದ ಬಾಗಿಲನ್ನು ನೋಡುವ ಯೆಹೆಜ್ಕೇಲನು
      '45':
        title: ದೇವರಿಗೂ ಜನರಿಗೂ ಭೂಮಿ
      '46':
        title: ಕ್ರಮಬದ್ಧ ಆರಾಧನೆ; ರಾಜಕುಮಾರನೂ ಆರಾಧಿಸುತ್ತಾನೆ
      '47':
        title: ಜೀವ ನೀಡುತ್ತಾ ಹರಿಯುವ ಜೀವಜಲ
      '48':
        title: ಮಧ್ಯದಲ್ಲಿ ಪರಿಶುದ್ಧ ಪ್ರದೇಶ; ಭೂಮಿಯ ಹಂಚಿಕೆ
    Daniel:
      '1':
        title: ಅರಸನ ಆಹಾರವನ್ನು ನಿರಾಕರಿಸುವ ದಾನಿಯೇಲನು
      '2':
        title: ಮರೆಮಾಡಿದ ಕನಸನ್ನು ಪ್ರಕಟಿಸುವ ದಾನಿಯೇಲನು
      '3':
        title: ನೆಬೂಕದ್ನೆಚ್ಚರನು ದಾನಿಯೇಲನ ಸ್ನೇಹಿತರನ್ನು ಬೆಂಕಿಗೆ ಎಸೆಯುತ್ತಾನೆ
      '4':
        title: ನೆಬೂಕದ್ನೆಚ್ಚರನು ದೀನತೆಯನ್ನು ಕಲಿಯುತ್ತಾನೆ
      '5':
        title: ಬೆಲ್ಶಚ್ಚರನ ಪತನ ಮತ್ತು ಮರಣ
      '6':
        title: ಸಿಂಹಗಳ ಗುಹೆಯಿಂದ ಪಾರಾಗುವ ದಾನಿಯೇಲನು
      '7':
        title: ಸಮುದ್ರದಿಂದ ಏಳುವ ನಾಲ್ಕು ಮೃಗಗಳು
      '8':
        title: ಟಗರು ಮತ್ತು ಹೋತದ ದರ್ಶನ
      '9':
        title: ಯೆರೂಸಲೇಮಿಗಾಗಿ ದಾನಿಯೇಲನ ಪ್ರಾರ್ಥನೆ
      '10':
        title: ದಾನಿಯೇಲನನ್ನು ಬಲಪಡಿಸುವ ದೂತನು
      '11':
        title: ಭವಿಷ್ಯದ ಸಾಮ್ರಾಜ್ಯಗಳ ಸಂಘರ್ಷ
      '12':
        title: ದೇವರ ಜನರನ್ನು ಕಾಪಾಡುವ ಮೀಕಾಯೇಲನು
    Hosea:
      '1':
