payload:
  book_metadata:
    Gospel of Truth:
      display_name: ಸತ್ಯದ ಸುವಾರ್ತೆ
      author: ಅಜ್ಞಾತ; ವ್ಯಾಲೆಂಟಿನಸ್ ಅಥವಾ ಅವನ ಪಂಥಕ್ಕೆ ಸೇರಿದ್ದೆಂದು ವ್ಯಾಪಕವಾಗಿ ಹೇಳಲಾಗುತ್ತದೆ.
      audience: ವ್ಯಾಲೆಂಟಿನಿಯನ್ ನಾಸ್ಟಿಕ ಚಳವಳಿಯೊಳಗಿನ ಕ್ರೈಸ್ತ ಓದುಗರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗ; ನಾಗ್ ಹಮ್ಮಾಡಿಯಲ್ಲಿ ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
    Jubilees:
      display_name: ಜೂಬಿಲೀಸ್
      author: ಅಜ್ಞಾತ; ಮೋಶೆಗೆ ಸೀನಾಯಿಯಲ್ಲಿ ದೊರೆತ ಪ್ರಕಟಣೆಯಾಗಿ ನಿರೂಪಿಸಲಾಗಿದೆ.
      audience: 364 ದಿನಗಳ ಸೌರಮಾನ ಪಂಚಾಂಗ ಮತ್ತು ಕಟ್ಟುನಿಟ್ಟಾದ ಹಲಾಖಾಗೆ ಬದ್ಧವಾಗಿದ್ದ ಯೆಹೂದ್ಯ ಸಮುದಾಯಗಳು (ಬಹುಶಃ ಕುಮ್ರಾನ್‌ನ ಅದೇ ಪರಿಸರಕ್ಕೆ ಸೇರಿದವರು).
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 2ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗ; ಗೀಝ್ (ಇಥಿಯೋಪಿಕ್) ಭಾಷೆಯಲ್ಲಿ ಪೂರ್ಣವಾಗಿ ಸಂರಕ್ಷಿಸಲಾಗಿದೆ.
  chapter_titles:
    Gospel of Thomas:
      '49':
        title: ಏಕಾಂಗಿಯಾಗಿ ಆಯ್ಕೆಯಾದವರು ರಾಜ್ಯವನ್ನು ಕಂಡುಕೊಳ್ಳುವರು
      '50':
        title: ಯೇಸು ಬೆಳಕಿನ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '51':
        title: ಸತ್ತವರ ವಿಶ್ರಾಂತಿ ಗಮನಕ್ಕೆ ಬಾರದೆ ಬರುತ್ತದೆ
      '52':
        title: ಮಾತನಾಡುವ ಸತ್ತವರ ನಡುವೆ ಜೀವಿಸುವುದು
      '53':
        title: ಶಿಷ್ಯರು ಸುನ್ನತಿಯ ಕುರಿತು ಪ್ರಶ್ನಿಸುತ್ತಾರೆ
      '54':
        title: ಯೇಸು ಬಡವರನ್ನು ಧನ್ಯರೆನ್ನುತ್ತಾನೆ
      '55':
        title: ದ್ವೇಷಿಸಿರಿ ಅಥವಾ ಕ್ರಿಸ್ತನನ್ನು ಹಿಂಬಾಲಿಸಿರಿ
      '56':
        title: ಶವದಂತಿರುವ ಲೋಕವನ್ನು ಕಂಡವನು; ಲೋಕವು ಅವನಿಗೆ ಯೋಗ್ಯವಲ್ಲ
      '57':
        title: ದುಡಿಯುವ ವ್ಯಕ್ತಿ ಧನ್ಯನು
      '58':
        title: ಯೇಸು ಕಠಿಣ ಪರಿಶ್ರಮವನ್ನು ಧನ್ಯವೆನ್ನುತ್ತಾನೆ
      '59':
        title: ಬದುಕಿರುವಾಗಲೇ ಜೀವಂತನಾದವನನ್ನು ಹುಡುಕಿರಿ
      '60':
        title: ಸಮಾರ್ಯದವನು ಕುರಿಮರಿಯನ್ನು ಯೂದಾಯಕ್ಕೆ ಒಯ್ಯುತ್ತಾನೆ
      '61':
        title: ಯೇಸು ಸಲೋಮೆಗೆ ಬೆಳಕಿನ ಕುರಿತು ಬೋಧಿಸುತ್ತಾನೆ
      '62':
        title: ರಹಸ್ಯಗಳು ಗುಪ್ತವಾಗಿ ಪ್ರಕಟವಾಗುತ್ತವೆ
      '63':
        title: ಸಿದ್ಧನಾಗಿರದ ಶ್ರೀಮಂತನು ಸಾಯುತ್ತಾನೆ
      '64':
        title: ಯಜಮಾನನು ಅನಿರೀಕ್ಷಿತ ಅತಿಥಿಗಳನ್ನು ಆಹ್ವಾನಿಸುತ್ತಾನೆ
      '65':
        title: ಒಳ್ಳೆಯ ಮನುಷ್ಯನ ದ್ರಾಕ್ಷಿತೋಟ ನಾಶವಾಗುತ್ತದೆ
      '66':
        title: ತಿರಸ್ಕರಿಸಲ್ಪಟ್ಟ ಕಲ್ಲನ್ನು ನನಗೆ ತೋರಿಸಿರಿ
      '67':
        title: ಎಲ್ಲವನ್ನೂ ತಿಳಿದರೂ ತನ್ನನ್ನೇ ಅರಿಯದಿರುವುದು
      '68':
        title: ಹಿಂಸೆಗೆ ಒಳಗಾದವರು ಧನ್ಯರು
      '69':
        title: ಹಸಿದ ಆತ್ಮಗಳು ಧನ್ಯವು
      '70':
        title: ಯೇಸು ಅಂತರಂಗದ ಬಡತನದ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '71':
        title: ಯೇಸು ಮನೆಯ ಕುಸಿತವನ್ನು ಮುನ್ಸೂಚಿಸುತ್ತಾನೆ
      '72':
        title: ಯೇಸು ಆಸ್ತಿಯನ್ನು ಹಂಚಲು ನಿರಾಕರಿಸುತ್ತಾನೆ
      '73':
        title: ಯೇಸು ಇನ್ನಷ್ಟು ಕೆಲಸಗಾರರನ್ನು ಕಳುಹಿಸುವಂತೆ ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '74':
        title: ಬಾಯಾರಿದ ಜನಸಮೂಹವಿದ್ದರೂ ಬಾವಿ ಖಾಲಿ
      '75':
        title: ಏಕಾಂಗಿಗಳು ವಧೂವರರ ಕೋಣೆಯನ್ನು ಪ್ರವೇಶಿಸುತ್ತಾರೆ
      '76':
        title: ಎಂದೆಂದಿಗೂ ಉಳಿಯುವ ನಿಧಿಯನ್ನು ಹುಡುಕಿರಿ
      '77':
        title: ಯೇಸು ದೈವಿಕ ಬೆಳಕಾಗಿ ಮಾತನಾಡುತ್ತಾನೆ
      '78':
        title: ಯೇಸು ನಯವಾದ ಉಡುಪಿನ ಕುರಿತು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '79':
        title: ಸಹನೆಯಿಂದ ಸತ್ಯವನ್ನು ಹೊರುವ ಮಹಿಳೆ ಧನ್ಯಳು
      '80':
        title: ದೇಹವನ್ನು ಕಂಡವನಿಗೆ ಲೋಕವು ಯೋಗ್ಯವಲ್ಲ
      '81':
        title: ಐಶ್ವರ್ಯ ಮತ್ತು ಅಧಿಕಾರದ ವಿರೋಧಾಭಾಸದ ಕುರಿತು ಯೇಸು
      '82':
        title: ಹತ್ತಿರವಿರುವವರಿಗೆ ಬೆಂಕಿಯೂ ಹತ್ತಿರ
      '83':
        title: ರೂಪಗಳು ಗೋಚರಿಸುತ್ತವೆ, ಆದರೆ ಬೆಳಕು ಮರೆಯಾಗಿದೆ
      '84':
        title: ನಿಮ್ಮ ಹೋಲಿಕೆಯನ್ನು ಕಾಣುವುದು ಸಂತೋಷ ತರುತ್ತದೆ
      '85':
        title: ಆದಾಮನು ಮಹಾ ಶಕ್ತಿಯಿಂದ ಬಂದನು
      '86':
        title: ಯೇಸು ನೆಲೆಯಿಲ್ಲದಿರುವುದರ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '87':
        title: ದೇಹ ಮತ್ತು ಆತ್ಮದ ಅವಲಂಬನೆ ದುರವಸ್ಥೆ
      '88':
        title: ದೇವದೂತರೂ ಪ್ರವಾದಿಗಳೂ ಬರುವರು
      '89':
        title: ಯೇಸು ಶುದ್ಧೀಕರಣದ ಕುರಿತು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '90':
        title: ಯೇಸು ಹುಡುಕುವವರಿಗೆ ವಿಶ್ರಾಂತಿ ನೀಡುತ್ತಾನೆ
      '91':
        title: ಯೇಸು ನಿಜವಾದ ಜ್ಞಾನವನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '92':
        title: ಹುಡುಕಿರಿ, ನಿಮಗೆ ಸಿಗುವುದು
      '93':
        title: ಪವಿತ್ರವಾದವುಗಳನ್ನು ವಿವೇಕದಿಂದ ಕೊಡಿರಿ
      '94':
        title: ಹುಡುಕುವುದರಿಂದ ಕಂಡುಕೊಳ್ಳುವಿರಿ
      '95':
        title: ಹಿಂತಿರುಗಿಸುವ ನಿರೀಕ್ಷೆಯಿಲ್ಲದೆ ಸಾಲ ಕೊಡಿರಿ
      '96':
        title: ರಾಜ್ಯವು ಅಡಗಿರುವ ಹುಳಿಯಂತಿದೆ
      '97':
        title: ಮಹಿಳೆ ಅರಿವಿಲ್ಲದೆ ಹಿಟ್ಟನ್ನು ಕಳೆದುಕೊಳ್ಳುತ್ತಾಳೆ
      '98':
        title: ಮನುಷ್ಯನು ಮೊದಲು ತನ್ನ ಬಲವನ್ನು ಪರೀಕ್ಷಿಸುತ್ತಾನೆ
      '99':
        title: ನಿಜವಾದ ಸಹೋದರರು ತಂದೆಗೆ ವಿಧೇಯರಾಗುತ್ತಾರೆ
      '100':
        title: ತೆರಿಗೆಯ ಕುರಿತು ಯೇಸು ಉತ್ತರಿಸುತ್ತಾನೆ
      '101':
        title: ನಿಜವಾದ ಶಿಷ್ಯನಾಗಲು ದ್ವೇಷಿಸಬೇಕು
      '102':
        title: ಯೇಸು ಸ್ವಾರ್ಥಿ ಫರಿಸಾಯರನ್ನು ಶಪಿಸುತ್ತಾನೆ
      '103':
        title: ಸಿದ್ಧನಾಗಿರುವ ಮನುಷ್ಯನು ಧನ್ಯನು
      '104':
        title: ವರನು ಹೋದ ಬಳಿಕ ಪ್ರಾರ್ಥಿಸಿರಿ
      '105':
        title: ಒಳನೋಟವು ಬಹಿರಂಗ ಅವಮಾನ ತರುತ್ತದೆ
      '106':
        title: ಏಕತೆಯು ಬೆಟ್ಟಗಳನ್ನು ಚಲಿಸುವಂತೆ ಮಾಡುತ್ತದೆ
      '107':
        title: ರಾಜ್ಯವು ಕಳೆದುಹೋದ ಕುರಿಯನ್ನು ಹುಡುಕುತ್ತದೆ
      '108':
        title: ಯೇಸು ಮರೆಯಾಗಿರುವ ಸಂಗತಿಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '109':
        title: ಅಡಗಿದ್ದ ನಿಧಿ ತನ್ನನ್ನೇ ಪ್ರಕಟಿಸುತ್ತದೆ
      '110':
        title: ಕಂಡುಕೊಂಡ ಲೌಕಿಕ ಐಶ್ವರ್ಯವನ್ನು ತ್ಯಜಿಸಿರಿ
      '111':
        title: ಅವನ ಮುಂದೆ ಆಕಾಶಗಳು ಸುರುಳಿಯಾಗಿ ಮಡಚಿಕೊಳ್ಳುತ್ತವೆ
      '112':
        title: ಯೇಸು ಶರೀರದ ಅವಲಂಬನೆಯ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '113':
        title: ರಾಜತ್ವವು ಭೂಮಿಯ ಮೇಲೆ ಹರಡಿದೆ
      '114':
        title: ಯೇಸು ಮರಿಯಳ ಸಮಾನತೆಯ ಕುರಿತು ಬೋಧಿಸುತ್ತಾನೆ
    Gospel of Truth:
      '1':
        title: ಕೃಪೆಯು ತಂದೆಯ ಸತ್ಯವನ್ನು ಪ್ರಕಟಿಸುತ್ತದೆ
      '2':
        title: ಮರೆವು ತಪ್ಪನ್ನು ಬಲಪಡಿಸುತ್ತದೆ
      '3':
        title: ತಂದೆಯು ಮಕ್ಕಳಿಗೆ ಜ್ಞಾನವನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '4':
        title: ಹೆಸರಿನಿಂದ ಕರೆಯಲ್ಪಟ್ಟವರು ವಿಶ್ರಾಂತಿ ಪಡೆಯುತ್ತಾರೆ
      '5':
        title: ಯೇಸು ಎಲ್ಲವನ್ನೂ ಪೂರ್ಣತೆಗೆ ತರುತ್ತಾನೆ
      '6':
        title: ವಾಕ್ಯವು ತಪ್ಪನ್ನು ಸೀಳಿ ಹಾದುಹೋಗುತ್ತದೆ
      '7':
        title: ತಂದೆಯು ಹೆಸರಿಸಿ ಅಸ್ತಿತ್ವಕ್ಕೆ ತರುತ್ತಾನೆ
      '8':
        title: ಬೆಳಕು ಭಯವು ಏನೂ ಅಲ್ಲವೆಂದು ತೋರಿಸುತ್ತದೆ
      '9':
        title: ಅವನು ಅವರಿಗೆ ಬೆಳಕು ಮತ್ತು ಜೀವವನ್ನು ಬೋಧಿಸಿದನು
      '10':
        title: ಕುರುಬನು ಆ ಒಂದು ಕುರಿಯನ್ನು ಹುಡುಕುತ್ತಾನೆ
      '11':
        title: ತಿಳಿವಳಿಕೆಯು ಕುರುಡರನ್ನು ಎಚ್ಚರಿಸುತ್ತದೆ
      '12':
        title: ಬೆಳಕು ಪಾಪಗಳಿಂದ ವಿಮೋಚನೆ ತರುತ್ತದೆ
      '13':
        title: ಅವನು ಚಿತ್ತವನ್ನು ಬೆಳಕಿನಲ್ಲಿ ತಿಳಿಸುತ್ತಾನೆ
      '14':
        title: ತಂದೆಯು ಪ್ರಿಯ ಮಗನಿಗೆ ಹೆಸರಿಡುತ್ತಾನೆ
      '15':
        title: ತಂದೆಯೊಳಗೆ ಸತ್ಯವು ವಿಶ್ರಮಿಸುತ್ತದೆ
      '16':
        title: ನಾನು ತಂದೆಗೆ ನನ್ನನ್ನು ಸಮರ್ಪಿಸಿಕೊಳ್ಳುತ್ತೇನೆ
    Jubilees:
      '1':
        title: ಮೋಶೆ ಕರುಣೆಗಾಗಿ ಬೇಡಿಕೊಳ್ಳುತ್ತಾನೆ
      '2':
        title: ಇಸ್ರಾಯೇಲಿಗೆ ಸಬ್ಬತ್ತಿನ ಪವಿತ್ರತೆ
      '3':
        title: ಏದೆನಿನಲ್ಲಿ ಆದಾಮನು ಹವ್ವಳಿಗೆ ಹೆಸರಿಡುತ್ತಾನೆ
      '4':
        title: ಹನೋಕನು ನ್ಯಾಯತೀರ್ಪಿನ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '5':
        title: ಪಾಪದ ಕಾರಣ ಜಲಪ್ರಳಯ ವಿಧಿಸಲ್ಪಡುತ್ತದೆ
      '6':
        title: ಮಳೆಬಿಲ್ಲು ನೋಹನೊಂದಿಗಿನ ಒಡಂಬಡಿಕೆಗಳನ್ನು ದೃಢಪಡಿಸುತ್ತದೆ
      '7':
        title: ನೋಹನು ಸಂತತಿಗೆ ನೀತಿಯ ಕುರಿತು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '8':
        title: ನೋಹನು ಭೂಮಿಯನ್ನು ಹಂಚುತ್ತಾನೆ
      '9':
        title: ಮಸ್ತೇಮನು ಆತ್ಮಗಳ ಮೇಲೆ ಆಳ್ವಿಕೆ ಬೇಡುತ್ತಾನೆ
      '10':
        title: ಬಾಬೆಲ್ ಗೋಪುರದ ಜನರು ಚದರಿಹೋಗುತ್ತಾರೆ
      '11':
