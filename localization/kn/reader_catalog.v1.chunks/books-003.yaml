payload:
  book_metadata:
    Judges:
      display_name: ನ್ಯಾಯಾಧಿಪತಿಗಳು
      author: ಅಜ್ಞಾತ; ಧರ್ಮೋಪದೇಶಕಾಂಡೀಯ ಇತಿಹಾಸದ ಒಂದು ಭಾಗ.
      audience: ಧರ್ಮಭ್ರಷ್ಟತೆ ಮತ್ತು ವಿಮೋಚನೆಯ ಎಚ್ಚರಿಕೆಯ ಚಕ್ರವಾಗಿ ರಾಜಪ್ರಭುತ್ವಪೂರ್ವ ಕಾಲದ ತನ್ನ ಭೂತಕಾಲವನ್ನು ಓದುತ್ತಿದ್ದ ನಂತರದ ಕಾಲದ ಇಸ್ರಾಯೇಲ್.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 7ನೇ–6ನೇ ಶತಮಾನಗಳಲ್ಲಿ ಸಂಕಲಿಸಲಾಗಿದೆ.
    Ruth:
      display_name: ರೂತ್
      author: ಅಜ್ಞಾತ.
      audience: ಸೆರೆವಾಸದ ನಂತರದ ಇಸ್ರಾಯೇಲ್ — ಬಹುಶಃ ಎಜ್ರ–ನೆಹೆಮೀಯರ ಹೊರಗಿಡುವ ನೀತಿಗಳಿಗೆ ವಿರುದ್ಧವಾಗಿ ವಿದೇಶಿಯರ ಸೇರ್ಪಡೆಯ ಪರವಾಗಿ ವಾದಿಸುತ್ತಿರಬಹುದು.
      date: ಹೆಚ್ಚಾಗಿ ಸೆರೆವಾಸದ ನಂತರದ ಕಾಲದ್ದು; ಸುಮಾರು ಕ್ರಿ.ಪೂ. 6ನೇ–4ನೇ ಶತಮಾನಗಳು.
    1 Samuel:
      display_name: 1 ಸಮುವೇಲ
      author: ಅಜ್ಞಾತ; ಧರ್ಮೋಪದೇಶಕಾಂಡೀಯ ಇತಿಹಾಸದ ಒಂದು ಭಾಗ.
      audience: ಸಮುವೇಲ, ಸೌಲ ಮತ್ತು ದಾವೀದರ ಕಾಲದಲ್ಲಿ ರಾಜಪ್ರಭುತ್ವದ ಉದಯವನ್ನು ಕುರಿತು ಚಿಂತಿಸುತ್ತಿದ್ದ ಇಸ್ರಾಯೇಲ್.
      date: ಹಳೆಯ ಮೂಲಗಳಿಂದ ಸುಮಾರು ಕ್ರಿ.ಪೂ. 7ನೇ–6ನೇ ಶತಮಾನಗಳಲ್ಲಿ ಸಂಕಲಿಸಲಾಗಿದೆ.
    2 Samuel:
      display_name: 2 ಸಮುವೇಲ
      author: ಅಜ್ಞಾತ; ಧರ್ಮೋಪದೇಶಕಾಂಡೀಯ ಇತಿಹಾಸದ ಒಂದು ಭಾಗ.
      audience: ದಾವೀದನ ಆಳ್ವಿಕೆಯ ವಿಜಯಗಳು ಮತ್ತು ದುರಂತಗಳನ್ನು ರಾಜತ್ವದ ಸ್ಥಾಪಕ ಮಾದರಿಯಾಗಿ ಓದುತ್ತಿದ್ದ ಇಸ್ರಾಯೇಲ್.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 7ನೇ–6ನೇ ಶತಮಾನಗಳಲ್ಲಿ ಸಂಕಲಿಸಲಾಗಿದೆ.
  chapter_titles:
    Joshua:
      '8':
        title: ಆಯಿ ಪಟ್ಟಣದ ವಶ ಮತ್ತು ಧರ್ಮಶಾಸ್ತ್ರದ ನವೀಕರಣ
      '9':
        title: ಗಿಬ್ಯೋನ್ಯರು ಶಾಂತಿಗಾಗಿ ವಂಚಿಸುತ್ತಾರೆ
      '10':
        title: ಯುದ್ಧದಲ್ಲಿ ಸೂರ್ಯನು ನಿಂತುಕೊಳ್ಳುತ್ತಾನೆ
      '11':
        title: ಇಸ್ರಾಯೇಲ್ ಉತ್ತರದತ್ತ ಮುನ್ನುಗ್ಗಿ ಜಯಿಸುತ್ತದೆ
      '12':
        title: ಇಲ್ಲಿ ಮೂವತ್ತೊಂದು ರಾಜರ ಸೋಲು
      '13':
        title: ಸ್ವಾಧೀನಪಡಿಸಿಕೊಳ್ಳಲು ಇನ್ನೂ ಬಹಳ ದೇಶವಿದೆ
      '14':
        title: ಕಾಲೇಬನು ತನ್ನ ಪರ್ವತ ಪ್ರದೇಶವನ್ನು ಕೇಳುತ್ತಾನೆ
      '15':
        title: ಯೆಹೂದದ ಪಟ್ಟಣಗಳು ಮತ್ತು ಬುಗ್ಗೆಗಳು ಸುಭದ್ರವಾಗುತ್ತವೆ
      '16':
        title: ಯೊರ್ದನಿನ ಪಶ್ಚಿಮದಲ್ಲಿರುವ ಎಫ್ರಾಯೀಮನ ನಾಡು
      '17':
        title: ಮನಸ್ಸೆಯ ಸ್ವಾಸ್ತ್ಯ ಮತ್ತು ಕರ್ತವ್ಯ
      '18':
        title: ಬೆನ್ಯಾಮೀನನ ಗಡಿಗಳು ಮತ್ತು ಪಟ್ಟಣಗಳು
      '19':
        title: ಲೇವಿಯರು ತಮ್ಮ ಪಟ್ಟಣಗಳನ್ನು ಪಡೆಯುತ್ತಾರೆ
      '20':
        title: ನರಹತ್ಯೆ ಮಾಡಿದವರಿಗಾಗಿ ಆಶ್ರಯಪಟ್ಟಣಗಳು
      '21':
        title: ಯಾಜಕ ಸೇವೆಗಾಗಿ ಲೇವಿಯರ ಪ್ರತ್ಯೇಕತೆ
      '22':
        title: ಪೂರ್ವದ ಕುಲಗಳು ಸಾಕ್ಷಿಯ ಯಜ್ಞವೇದಿಯನ್ನು ಕಟ್ಟುತ್ತವೆ
      '23':
        title: ನಂಬಿಗಸ್ತ ವಿಧೇಯತೆಗೆ ಯೆಹೋಶುವನ ಒತ್ತಾಯ
      '24':
        title: ಆಯ್ಕೆಮಾಡುವಂತೆ ಇಸ್ರಾಯೇಲಿಗೆ ಯೆಹೋಶುವನ ಕರೆ
    Judges:
      '1':
        title: ಕಾನಾನ್ಯರ ವಿರುದ್ಧ ಯೆಹೂದ ಕುಲದ ಮುನ್ನಡೆ
      '2':
        title: ಒಡಂಬಡಿಕೆಯನ್ನು ಮುರಿದ ಇಸ್ರಾಯೇಲನ್ನು ದೂತನು ಖಂಡಿಸುತ್ತಾನೆ
      '3':
        title: ಒತ್ನೀಯೇಲನು ಅರಾಮನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '4':
        title: ನ್ಯಾಯಾಧಿಪತಿಯಾದ ದೆಬೋರಳು ಸೀಸೆರನನ್ನು ಸೋಲಿಸುತ್ತಾಳೆ
      '5':
        title: ಜಯಕ್ಕಾಗಿ ದೆಬೋರಳು ದೇವರನ್ನು ಸ್ತುತಿಸುತ್ತಾಳೆ
      '6':
        title: ನಂಬಿಕೆಯ ವಿಷಯದಲ್ಲಿ ಗಿದಿಯೋನನ ಆಂತರಿಕ ಹೋರಾಟ
      '7':
        title: ಗಿದಿಯೋನನು ಏಕಾಂಗಿಯಾಗಿ ಮಿದ್ಯಾನನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '8':
        title: ಸಹಾಯ ನಿರಾಕರಿಸಿದ ಪಟ್ಟಣಗಳಿಗೆ ಗಿದಿಯೋನನ ದಂಡನೆ
      '9':
        title: ಶೆಕೆಮಿಗೆ ಯೋತಾಮನ ಎಚ್ಚರಿಕೆ
      '10':
        title: ವಿಗ್ರಹಾರಾಧನೆಯ ಬಳಿಕ ಅಮ್ಮೋನಿಯರು ಇಸ್ರಾಯೇಲನ್ನು ಪೀಡಿಸುತ್ತಾರೆ
      '11':
        title: ಯೆಫ್ತಾಹನು ತನ್ನ ಮಗಳನ್ನು ಬಲಿಯಾಗಿ ಅರ್ಪಿಸುವುದಾಗಿ ಹರಕೆಮಾಡುತ್ತಾನೆ
      '12':
        title: ‘ಶಿಬ್ಬೋಲೆತ್’ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಎಫ್ರಾಯೀಮ್ಯರ ಸಾವು
      '13':
        title: ಸಂಸೋನನ ಜನನವನ್ನು ದೂತನು ಮುಂತಿಳಿಸುತ್ತಾನೆ
      '14':
        title: ಸಂಸೋನನು ದವಡೆಮೂಳೆಯಿಂದ ಫಿಲಿಷ್ಟಿಯರನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '15':
        title: ಸಂಸೋನನು ಸೇಡು ತೀರಿಸಿಕೊಳ್ಳುತ್ತಾ ಫಿಲಿಷ್ಟಿಯರನ್ನು ಕೊಲ್ಲುತ್ತಾನೆ
      '16':
        title: ಸಂಸೋನನು ಫಿಲಿಷ್ಟಿಯರ ದೇವಾಲಯವನ್ನು ಕೆಡವುತ್ತಾನೆ
      '17':
        title: ಮೀಕನು ಅಲೆದಾಡುತ್ತಿದ್ದ ಯಾಜಕನನ್ನು ನೇಮಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '18':
        title: ದಾನ್ ಕುಲದವರು ವಿಗ್ರಹಕ್ಕಾಗಿ ಯಾಜಕನನ್ನು ಕದ್ದೊಯ್ಯುತ್ತಾರೆ
      '19':
        title: ಬೆನ್ಯಾಮೀನ್ಯರು ಲೇವಿಯನ ಉಪಪತ್ನಿಯನ್ನು ಕೊಲ್ಲುತ್ತಾರೆ
      '20':
        title: ಗಿಬೆಯದಲ್ಲಿ ಇಸ್ರಾಯೇಲ್ ಬೆನ್ಯಾಮೀನನ್ನು ಸೋಲಿಸುತ್ತದೆ
      '21':
        title: ಬಿಕ್ಕಟ್ಟಿನಿಂದ ಬೆನ್ಯಾಮೀನ್ ಉಳಿಯುತ್ತದೆ
    Ruth:
      '1':
        title: ಎಲ್ಲವನ್ನೂ ಕಳೆದುಕೊಂಡ ನೊವೊಮಿ ಬರಿಗೈಯಲ್ಲಿ ಮರಳುತ್ತಾಳೆ
      '2':
        title: ಬೋವಜನ ಹೊಲದಲ್ಲಿ ರೂತ್ ಹಕ್ಕಲಾಯುತ್ತಾಳೆ
      '3':
        title: ರೂತ್ ರಾತ್ರಿಯಲ್ಲಿ ಆಶ್ರಯವನ್ನು ಕೋರುತ್ತಾಳೆ
      '4':
        title: ಬೋವಜನು ರೂತಳನ್ನೂ ಕುಟುಂಬವನ್ನೂ ವಿಮೋಚಿಸುತ್ತಾನೆ
    1 Samuel:
      '1':
        title: ಮಗನಿಗಾಗಿ ಹನ್ನಳ ಪ್ರಾರ್ಥನೆ
      '2':
        title: ದೇವರ ಪರಮಾಧಿಕಾರಕ್ಕಾಗಿ ಹನ್ನಳ ಸ್ತುತಿ
      '3':
        title: ಸಮುವೇಲನು ದೇವರ ಕರೆಯನ್ನು ಕೇಳುತ್ತಾನೆ
      '4':
        title: ಇಸ್ರಾಯೇಲ್ ಮಂಜೂಷವನ್ನು ಫಿಲಿಷ್ಟಿಯರಿಗೆ ಕಳೆದುಕೊಳ್ಳುತ್ತದೆ
      '5':
        title: ಮಂಜೂಷದಿಂದ ಫಿಲಿಷ್ಟಿಯರಿಗೆ ಸಂಕಟ
      '6':
        title: ಮಂಜೂಷ ಮರಳುತ್ತದೆ; ಬೇತ್‌ಷೆಮೆಷಿನ ಜನರು ಹರ್ಷಿಸುತ್ತಾರೆ
      '7':
        title: ಇಸ್ರಾಯೇಲ್ ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟು ಫಿಲಿಷ್ಟಿಯರನ್ನು ಸೋಲಿಸುತ್ತದೆ
      '8':
        title: ಇಸ್ರಾಯೇಲ್ ಒಬ್ಬ ರಾಜನನ್ನು ಕೇಳುತ್ತದೆ
      '9':
        title: ಸೌಲನು ಪ್ರವಾದಿ ಸಮುವೇಲನನ್ನು ಭೇಟಿಯಾಗುತ್ತಾನೆ
      '10':
        title: ಸಮುವೇಲನು ಸೌಲನನ್ನು ರಾಜನಾಗಿ ಅಭಿಷೇಕಿಸುತ್ತಾನೆ
      '11':
        title: ಅಮ್ಮೋನಿನ ವಿರುದ್ಧ ಸೌಲನು ಇಸ್ರಾಯೇಲನ್ನು ಒಗ್ಗೂಡಿಸುತ್ತಾನೆ
      '12':
        title: ಇಸ್ರಾಯೇಲಿನ ಪಾಪವನ್ನು ಸಮುವೇಲನು ಖಂಡಿಸುತ್ತಾನೆ
      '13':
        title: ಸೌಲನು ದೇವರ ಆಜ್ಞೆಗೆ ಅವಿಧೇಯನಾಗುತ್ತಾನೆ
      '14':
        title: ದಾವೀದನು ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ಫಿಲಿಷ್ಟಿಯರನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '15':
        title: ಸೌಲನ ಅಸೂಯೆಯಿಂದ ದಾವೀದನಿಗೆ ಬೆದರಿಕೆ
      '16':
        title: ದೇವರು ಸೌಲನ ಬದಲು ದಾವೀದನನ್ನು ಆರಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '17':
        title: ದಾವೀದನು ದೈತ್ಯನಾದ ಗೊಲ್ಯಾತನನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '18':
        title: ಯೋನಾತಾನನು ದಾವೀದನೊಂದಿಗೆ ಆಪ್ತ ಬಾಂಧವ್ಯ ಬೆಳೆಸುತ್ತಾನೆ
      '19':
        title: ದಾವೀದನು ಸೌಲನಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '20':
        title: ಅಪಾಯದ ಕುರಿತು ಯೋನಾತಾನನು ದಾವೀದನನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '21':
        title: ದಾವೀದನು ಯಾಜಕ ಅಹೀಮೆಲೆಕನ ಬಳಿಗೆ ಓಡಿಹೋಗುತ್ತಾನೆ
      '22':
        title: ಅದುಲ್ಲಾಮಿನಲ್ಲಿ ದಾವೀದನು ನಾಯಕನಾಗುತ್ತಾನೆ
      '23':
        title: ದಾವೀದನು ಅರಸನಾದ ಸೌಲನ ಜೀವವನ್ನು ಉಳಿಸುತ್ತಾನೆ
      '24':
        title: ಗುಹೆಯಲ್ಲಿ ದಾವೀದನು ಸೌಲನ ಜೀವವನ್ನು ಉಳಿಸುತ್ತಾನೆ
      '25':
        title: ಅಬೀಗೈಲಳ ಮನವಿ; ನಾಬಾಲನ ಸಾವು
      '26':
        title: ದಾವೀದನು ಸೌಲನ ಜೀವವನ್ನು ಉಳಿಸುತ್ತಾನೆ
      '27':
        title: ಆಕೀಷನಿಗಾಗಿ ದಾವೀದನು ನಕಲಿ ದಾಳಿಗಳನ್ನು ನಡೆಸುತ್ತಾನೆ
      '28':
        title: ಹತಾಶೆಯಲ್ಲಿ ಸೌಲನು ಸಮುವೇಲನನ್ನು ಹುಡುಕುತ್ತಾನೆ
      '29':
        title: ದಾವೀದನನ್ನು ಯುದ್ಧದಿಂದ ಹೊರಗಿಡಲಾಗುತ್ತದೆ
      '30':
        title: ಚಿಕ್ಲಗಿನಿಂದ ಸೆರೆಹಿಡಿದವರನ್ನು ದಾವೀದನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '31':
        title: ಸೌಲನ ಪತನ; ಫಿಲಿಷ್ಟಿಯರ ಜಯ
    2 Samuel:
      '1':
        title: ಸೌಲನ ಸಾವಿಗಾಗಿ ದಾವೀದನು ಶೋಕಿಸುತ್ತಾನೆ
      '2':
        title: ಯೆಹೂದ ಕುಲದವರು ದಾವೀದನನ್ನು ರಾಜನಾಗಿ ಅಭಿಷೇಕಿಸುತ್ತಾರೆ
      '3':
        title: ಅಬ್ನೇರನು ಸೌಲನ ಮನೆತನಕ್ಕೆ ದ್ರೋಹಮಾಡುತ್ತಾನೆ
      '4':
