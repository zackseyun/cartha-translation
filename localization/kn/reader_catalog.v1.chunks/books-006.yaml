payload:
  chapter_titles:
    Psalms:
      '4':
        title: ದಾವೀದನು ದೇವರ ಬೆಳಕನ್ನು ಅರಸುತ್ತಾನೆ
      '5':
        title: ದಾವೀದನು ದೇವರ ಮುಖಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '6':
        title: ದಾವೀದನು ದೇವರ ಕರುಣೆಗಾಗಿ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '7':
        title: ದಾವೀದನು ನೀತಿವಂತ ನ್ಯಾಯಾಧಿಪತಿಗೆ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '8':
        title: ದಾವೀದನು ದೇವರ ಮಹಿಮೆಯನ್ನು ಸ್ತುತಿಸುತ್ತಾನೆ
      '9':
        title: ದಾವೀದನು ದೇವರ ಆಳ್ವಿಕೆಯನ್ನು ಸಂಭ್ರಮಿಸುತ್ತಾನೆ
      '10':
        title: ದೇವರು ಕೆಟ್ಟದ್ದನ್ನು ನೋಡಿ ನ್ಯಾಯತೀರಿಸುತ್ತಾನೆ
      '11':
        title: ದಾವೀದನು ದುಷ್ಟರಿಗೆ ಭಯಪಡಲು ನಿರಾಕರಿಸುತ್ತಾನೆ
      '12':
        title: ದಾವೀದನು ನಂಬಿಗಸ್ತ ಮಾತಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '13':
        title: ದಾವೀದನು ದೇವರ ಪ್ರೀತಿಯಲ್ಲಿ ಭರವಸೆಯಿಡುತ್ತಾನೆ
      '14':
        title: ದೇವರನ್ನು ನಿರಾಕರಿಸುವುದು ವಿನಾಶಕ್ಕೆ ನಡೆಸುತ್ತದೆ
      '15':
        title: ದಾವೀದನು ಅರ್ಹತೆಯ ಮಾನದಂಡಗಳನ್ನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '16':
        title: ದಾವೀದನು ದೇವರಲ್ಲಿ ಭರವಸೆಯಿಟ್ಟು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '17':
        title: ದಾವೀದನು ನ್ಯಾಯವಾದ ಬಿಡುಗಡೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '18':
        title: ರಕ್ಷಣೆಗಾಗಿ ಕೃತಜ್ಞತೆಯ ಕೀರ್ತನೆ
      '19':
        title: ದೇವರ ನಿಯಮ ಮತ್ತು ಮಹಿಮೆ ಪ್ರಕಾಶಿಸುತ್ತವೆ
      '20':
        title: ಕರ್ತನು ಅಭಿಷಿಕ್ತ ಅರಸನನ್ನು ಕಾಪಾಡುತ್ತಾನೆ
      '21':
        title: ಅರಸನು ದೇವರ ಬಲದಲ್ಲಿ ಹರ್ಷಿಸುತ್ತಾನೆ
      '22':
        title: ತೀವ್ರ ಪರಿತ್ಯಕ್ತ ಭಾವನೆ ಸ್ತುತಿಯಾಗಿ ಮಾರ್ಪಡುತ್ತದೆ
      '23':
        title: ಕುರುಬನು ನನ್ನ ಪಕ್ಕದಲ್ಲೇ ಇರುತ್ತಾನೆ
      '24':
        title: ಕರ್ತನು ಶುದ್ಧ ಹೃದಯಗಳನ್ನು ಅರಸುತ್ತಾನೆ
      '25':
        title: ಭರವಸೆ ಮತ್ತು ವಿಮೋಚನೆಯ ಕೀರ್ತನೆ
      '26':
        title: ದಾವೀದನು ವಿಮೋಚನೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '27':
        title: ಕರ್ತನ ಸಾನ್ನಿಧ್ಯಕ್ಕಾಗಿ ಹಂಬಲ
      '28':
        title: ದೇವರು ಆಲಿಸಬೇಕೆಂದು ದಾವೀದನು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '29':
        title: ಕರ್ತನು ಪವಿತ್ರ ವೈಭವದಲ್ಲಿ ಆಳುತ್ತಾನೆ
      '30':
        title: ಮರಣದಿಂದ ರಕ್ಷಿಸಿದ್ದಕ್ಕಾಗಿ ಸ್ತುತಿ
      '31':
        title: ದಾವೀದನು ದೇವರ ರಕ್ಷಣೆಯಲ್ಲಿ ಭರವಸೆಯಿಡುತ್ತಾನೆ
      '32':
        title: ಕ್ಷಮಿಸಲ್ಪಟ್ಟ ಪಾಪಿಗಳು ಧನ್ಯರು
      '33':
        title: ನಂಬಿಗಸ್ತ ಸೃಷ್ಟಿಕರ್ತನನ್ನು ಸ್ತುತಿಸಿರಿ
      '34':
        title: ದೇವರು ಒಳ್ಳೆಯವನೆಂದು ಸವಿದು ನೋಡಿರಿ
      '35':
        title: ದಾವೀದನು ಬಿಡುಗಡೆಗಾಗಿ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '36':
        title: ದೇವರ ಪ್ರೀತಿ ದುಷ್ಟತನವನ್ನು ಆವರಿಸುತ್ತದೆ
      '37':
        title: ದುಷ್ಟರನ್ನು ಕಂಡು ಅಸೂಯೆಪಡದೆ ದೇವರಲ್ಲಿ ಭರವಸೆಯಿಡಿರಿ
      '38':
        title: ತೀವ್ರ ಸಂಕಟದಲ್ಲಿ ಮೌನ ಪ್ರಾರ್ಥನೆ
      '39':
        title: ದಾವೀದನು ಭರವಸೆಯಿಂದ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '40':
        title: ದೇವರು ದಾವೀದನನ್ನು ವಿನಾಶದಿಂದ ಮೇಲೆತ್ತುತ್ತಾನೆ
      '41':
        title: ದೇವರು ದುರ್ಬಲರನ್ನು ಪರಾಮರಿಸುತ್ತಾನೆ
      '42':
        title: ಜೀವಂತ ದೇವರಿಗಾಗಿ ಹಂಬಲ
      '43':
        title: ದಬ್ಬಾಳಿಕೆಗಾರರಿಂದ ನನ್ನನ್ನು ರಕ್ಷಿಸು
      '44':
        title: ಹಿಂದಿನ ವಿಜಯಗಳಲ್ಲಿ ದೇವರ ಶಕ್ತಿ
      '45':
        title: ಅರಸನ ಸೌಂದರ್ಯ ಮತ್ತು ಶಾಶ್ವತ ಕೃಪೆ
      '46':
        title: ದೇವರು ನಮ್ಮನ್ನು ಸದಾ ಸುರಕ್ಷಿತವಾಗಿಡುತ್ತಾನೆ
      '47':
        title: ಎಲ್ಲ ಜನಾಂಗಗಳೇ, ಚಪ್ಪಾಳೆ ತಟ್ಟಿ, ಜಯಘೋಷ ಮಾಡಿ, ಹಾಡಿರಿ
      '48':
        title: ಚೀಯೋನಿನ ಪರಾಕ್ರಮಿ ದೇವರನ್ನು ಸ್ತುತಿಸಿರಿ
      '49':
        title: ಸಂಪತ್ತು ಮರಣದಿಂದ ರಕ್ಷಿಸಲಾರದು
      '50':
        title: ದೇವರು ಪ್ರಜ್ವಲಿಸುವ ಪವಿತ್ರತೆಯಿಂದ ನ್ಯಾಯತೀರಿಸುತ್ತಾನೆ
      '51':
        title: ಮುರಿದ ಹೃದಯವು ನವೀಕರಣವನ್ನು ಅರಸುತ್ತದೆ
      '52':
        title: ವಂಚನೆಯ ಜಂಬವನ್ನು ಖಂಡಿಸುತ್ತದೆ
      '53':
        title: ಮೂರ್ಖನು ದೇವರಿಲ್ಲದೆ ಭ್ರಷ್ಟನಾಗಿ ಜೀವಿಸುತ್ತಾನೆ
      '54':
        title: ನಿರ್ದಯ ವೈರಿಗಳಿಂದ ನನ್ನನ್ನು ರಕ್ಷಿಸು
      '55':
        title: ದಾವೀದನು ದ್ರೋಹದ ದುಃಖದಿಂದ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '56':
        title: ವೈರಿಗಳು ಬೇಟೆಯಾಡುವಾಗ ದೇವರಲ್ಲಿ ಭರವಸೆಯಿಡು
      '57':
        title: ಮರಿಗಳನ್ನು ತನ್ನ ರೆಕ್ಕೆಗಳಡಿ ಆಶ್ರಯಿಸುವ ಹಕ್ಕಿಯಂಥ ರಕ್ಷಣೆ
      '58':
        title: ಭ್ರಷ್ಟ ಮಾನವ ಆಳುವವರನ್ನು ಖಂಡಿಸುತ್ತದೆ
      '59':
        title: ಹಿಂಸಾತ್ಮಕ ಜನರಿಂದ ನನ್ನನ್ನು ರಕ್ಷಿಸು
      '60':
        title: ನಿನ್ನ ಜನರನ್ನು ಗುಣಪಡಿಸಿ ಪುನಃಸ್ಥಾಪಿಸು
      '61':
        title: ದಾವೀದನು ದೇವರ ರಕ್ಷಣೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '62':
        title: ದಾವೀದನು ದೇವರೊಬ್ಬರಲ್ಲೇ ಭರವಸೆಯಿಡುತ್ತಾನೆ
      '63':
        title: ದಾವೀದನು ಅರಣ್ಯದ ರಾತ್ರಿಯಲ್ಲಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '64':
        title: ದಾವೀದನು ಪ್ರಾರ್ಥಿಸಿ ವೈರಿಗಳನ್ನು ಸೋಲಿಸುತ್ತಾನೆ
      '65':
        title: ದೇವರು ಪ್ರಾರ್ಥನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ ಶಾಂತಿಯನ್ನು ತರುತ್ತಾನೆ
      '66':
        title: ಭೂಮಿಯೆಲ್ಲ ದೇವರಿಗೆ ಹರ್ಷಧ್ವನಿ ಮಾಡುತ್ತದೆ
      '67':
        title: ದೇವರು ಜನರನ್ನು ಆಶೀರ್ವದಿಸಿ ನ್ಯಾಯ ಸ್ಥಾಪಿಸುತ್ತಾನೆ
      '68':
        title: ದೇವರು ದುಷ್ಟರನ್ನು ಚದುರಿಸಿ ಸಂತೋಷ ತರುತ್ತಾನೆ
      '69':
        title: ಸಂಕಟದಲ್ಲಿ ಮುಳುಗಿದವನ ಹತಾಶ ಮೊರೆ
      '70':
        title: ದಾವೀದನು ತ್ವರಿತ ರಕ್ಷಣೆಗಾಗಿ ಮೊರೆಯಿಡುತ್ತಾನೆ
      '71':
        title: ಕೀರ್ತನೆ ಶಾಶ್ವತವಾದ ನಂಬಿಕೆಯನ್ನು ಅರಸುತ್ತದೆ
      '72':
        title: ಅರಸನು ನ್ಯಾಯವಾದ ಆಳ್ವಿಕೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '73':
        title: ಆಸಾಫನು ದೇವರ ನಂಬಿಗಸ್ತಿಕೆಯನ್ನು ಕಾಣುತ್ತಾನೆ
      '74':
        title: ದೇವರು ನೆನಪಿಸಿಕೊಳ್ಳಬೇಕೆಂದು ಕೀರ್ತನೆ ಮೊರೆಯಿಡುತ್ತದೆ
      '75':
        title: ದೇವರು ಅಹಂಕಾರಿ ದುಷ್ಟರಿಗೆ ನ್ಯಾಯತೀರಿಸುತ್ತಾನೆ
      '76':
        title: ದೇವರು ಆಯುಧಗಳನ್ನು ಚೂರುಮಾಡಿ ತನ್ನ ಮಹತ್ವ ತೋರಿಸುತ್ತಾನೆ
      '77':
        title: ಮನುಷ್ಯನು ಮೊರೆಯಿಟ್ಟು, ತಿರುಗಿ, ನೆನಪಿಸಿಕೊಳ್ಳುತ್ತಾನೆ
      '78':
        title: ನಂಬಿಗಸ್ತ ನಿರೀಕ್ಷೆಯನ್ನು ತಲೆಮಾರುಗಳಿಗೆ ಹಸ್ತಾಂತರಿಸುವುದು
      '79':
        title: ಯೆರೂಸಲೇಮ್ ಅಪವಿತ್ರಗೊಂಡ ಬಳಿಕದ ಮೊರೆ
      '80':
        title: ದೇವರೇ, ನಮ್ಮನ್ನು ಪುನಃಸ್ಥಾಪಿಸು ಎಂದು ಪ್ರಾರ್ಥಿಸುತ್ತೇವೆ
      '81':
        title: ದೇವರು ಇಸ್ರಾಯೇಲಿಗಾಗಿ ಹಂಬಲಿಸುತ್ತಾನೆ
      '82':
        title: ದೇವರು ಆಳುವವರಿಗೆ ನ್ಯಾಯತೀರಿಸಿ ದುರ್ಬಲರನ್ನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '83':
        title: ದೇವರು ಇಸ್ರಾಯೇಲಿನ ವೈರಿಗಳನ್ನು ಚದುರಿಸುತ್ತಾನೆ
      '84':
        title: ದೇವರ ಸಾನ್ನಿಧ್ಯಕ್ಕಾಗಿ ಹಂಬಲ
      '85':
        title: ಕರ್ತನು ಜನರನ್ನು ಮತ್ತೆ ಪುನಃಸ್ಥಾಪಿಸುತ್ತಾನೆ
      '86':
        title: ದಾವೀದನು ಕರುಣೆ ಮತ್ತು ಸಹಾಯಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '87':
        title: ಚೀಯೋನು ಎಲ್ಲಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ದೇವರನ್ನು ಪ್ರೀತಿಸುತ್ತದೆ
      '88':
        title: ಪರಿತ್ಯಕ್ತ ಆತ್ಮದ ಹತಾಶ ಮೊರೆ
      '89':
        title: ದಾವೀದನೊಂದಿಗಿನ ದೇವರ ಒಡಂಬಡಿಕೆಯನ್ನು ಸಂಭ್ರಮಿಸುತ್ತದೆ
      '90':
        title: ಮೋಶೆಯು ಜ್ಞಾನಕ್ಕಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '91':
        title: ದೇವರು ನಂಬಿಗಸ್ತರನ್ನು ಕಾಪಾಡುತ್ತಾನೆ
      '92':
        title: ಕರ್ತನಿಗೆ ಎಂದೆಂದಿಗೂ ಕೃತಜ್ಞತೆ ಸಲ್ಲಿಸುವುದು
      '93':
        title: ಕರ್ತನು ಎಲ್ಲ ಸಮುದ್ರಗಳ ಮೇಲೆಯೂ ಆಳುತ್ತಾನೆ
      '94':
        title: ದೇವರು ನೋಡಿ ಕೆಟ್ಟದ್ದಕ್ಕೆ ಪ್ರತಿಫಲ ನೀಡುತ್ತಾನೆ
      '95':
        title: ಬನ್ನಿರಿ, ಕೃತಜ್ಞತೆಯಿಂದ ದೇವರನ್ನು ಆರಾಧಿಸೋಣ
      '96':
        title: ಹೊಸ ಹಾಡನ್ನು ಹಾಡಿರಿ; ಕರ್ತನು ಆಳುತ್ತಾನೆ
      '97':
        title: ಕರ್ತನು ಸೃಷ್ಟಿಯೆಲ್ಲದರ ಮೇಲೆ ಆಳುತ್ತಾನೆ
      '98':
        title: ಹೊಸ ಹಾಡನ್ನು ಹಾಡಿ ಸಂಭ್ರಮಿಸಿರಿ
      '99':
        title: ಕರ್ತನು ನ್ಯಾಯ ಮತ್ತು ಕರುಣೆಯಿಂದ ಆಳುತ್ತಾನೆ
      '100':
        title: ಎಲ್ಲರೂ ಸಂತೋಷದಿಂದ ಕರ್ತನನ್ನು ಆರಾಧಿಸಿರಿ
      '101':
        title: ದಾವೀದನು ಯಥಾರ್ಥತೆ ಮತ್ತು ಸೇವೆಗೆ ಪ್ರತಿಜ್ಞೆ ಮಾಡುತ್ತಾನೆ
      '102':
