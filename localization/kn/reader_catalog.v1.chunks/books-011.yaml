status: reviewed
payload:
  book_metadata:
    Luke:
      display_name: ಲೂಕ
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಸಂಪ್ರದಾಯವು ಇದನ್ನು ಪೌಲನ ಪ್ರಯಾಣ ಸಂಗಾತಿಯಾದ ಲೂಕನಿಗೆ ಸೇರಿಸುತ್ತದೆ.
      audience: “ಥೆಯೊಫಿಲನಿಗೆ” ಸಂಬೋಧಿಸಲಾದ, ಅಕ್ಷರಜ್ಞಾನವುಳ್ಳ ಗ್ರೀಕ್-ರೋಮನ್ ಕ್ರೈಸ್ತ ಓದುಗರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 80–90.
    John:
      display_name: ಯೋಹಾನ
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಸಂಪ್ರದಾಯವು ಇದನ್ನು ಅಪೊಸ್ತಲ ಯೋಹಾನನಿಗೆ ಅಥವಾ “ಪ್ರಿಯ ಶಿಷ್ಯನಿಗೆ” ಸೇರಿಸುತ್ತದೆ.
      audience: ಪ್ರಿಯ ಶಿಷ್ಯನ ಸಾಕ್ಷಿಯ ಸುತ್ತ ರೂಪುಗೊಂಡ, ಸಭಾಮಂದಿರದ ಯೆಹೂದ್ಯ ಧರ್ಮದೊಂದಿಗೆ ಉದ್ವಿಗ್ನ ಸಂಬಂಧದಲ್ಲಿದ್ದ ಒಂದು ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 90–110.
      summary: ಯೋಹಾನನು ಯೇಸುವನ್ನು ತಂದೆಯನ್ನು ಪ್ರಕಟಿಸುವ ನಿತ್ಯ ವಾಕ್ಯವೆಂದು ಚಿತ್ರಿಸುತ್ತಾನೆ; ಯೇಸು ತನ್ನಲ್ಲಿ ನಂಬಿಕೆ ಇಡುವವರಿಗೆ ಜೀವವನ್ನು ನೀಡುತ್ತಾನೆ ಮತ್ತು ತನ್ನ ಸೂಚಕಕಾರ್ಯಗಳು, ಮರಣ ಹಾಗೂ ಪುನರುತ್ಥಾನದ ಮೂಲಕ ಮಹಿಮೆ ಹೊಂದುತ್ತಾನೆ.
    Acts:
      display_name: ಅಪೊಸ್ತಲರ ಕೃತ್ಯಗಳು
      author: ಲೇಖಕರು ಅಜ್ಞಾತರು; ಲೂಕನ ಸುವಾರ್ತೆಯ ಲೇಖಕರೇ ಇದನ್ನೂ ಬರೆದಿದ್ದಾರೆ.
      audience: ಗ್ರೀಕ್-ರೋಮನ್ ಕ್ರೈಸ್ತ ಓದುಗರು; ಥೆಯೊಫಿಲನಿಗೆ ಸಂಬೋಧಿಸಲಾದ ಕೃತಿಯ ಎರಡನೆಯ ಸಂಪುಟ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 80–90.
    Romans:
      display_name: ರೋಮಾಪುರದವರಿಗೆ
      author: ಪೌಲನು, ಲಿಪಿಕಾರನಾದ ತೆರ್ತಿಯನ ಸಹಾಯದಿಂದ.
      audience: ರೋಮ್‌ನಲ್ಲಿದ್ದ ಕ್ರೈಸ್ತರು—ಧರ್ಮಶಾಸ್ತ್ರ ಮತ್ತು ಗುರುತಿನ ವಿಷಯದಲ್ಲಿ ಉದ್ವಿಗ್ನತೆ ಹೊಂದಿದ್ದ ಯೆಹೂದ್ಯ ಹಾಗೂ ಅನ್ಯಜನ ವಿಶ್ವಾಸಿಗಳು.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 56–58; ಕೊರಿಂಥದಿಂದ ಬರೆಯಲಾಗಿದೆ.
  chapter_titles:
    Mark:
      '4':
        title: ಯೇಸು ಸಮುದ್ರದ ಬಳಿ ಸಾಮ್ಯಗಳನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '5':
        title: ಯೇಸು ಅನ್ಯಜನಾಂಗದ ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಗುಣಪಡಿಸುತ್ತಾನೆ
      '6':
        title: ಯೇಸು ಐದು ಸಾವಿರ ಜನರಿಗೆ ಊಟ ಕೊಡುತ್ತಾನೆ
      '7':
        title: ಯೇಸು ಮಾನವ ಸಂಪ್ರದಾಯಗಳನ್ನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '8':
        title: ಯೇಸು ನಾಲ್ಕು ಸಾವಿರ ಜನರಿಗೆ ಊಟ ಕೊಡುತ್ತಾನೆ
      '9':
        title: ಯೇಸು ತನ್ನ ಮಹಿಮೆಯನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '10':
        title: ಯೇಸು ಮಕ್ಕಳನ್ನು ರಾಜ್ಯಕ್ಕೆ ಸ್ವಾಗತಿಸುತ್ತಾನೆ
      '11':
        title: ಯೇಸು ಸ್ತುತಿಸಲ್ಪಡುತ್ತಾ ಯೆರೂಸಲೇಮನ್ನು ಪ್ರವೇಶಿಸುತ್ತಾನೆ
      '12':
        title: ಯೇಸು ಕುತಂತ್ರದ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ ಬೋಧಿಸುತ್ತಾನೆ
      '13':
        title: ಯೇಸು ಸಂಕಟಕಾಲದ ಕುರಿತು ಬೋಧಿಸುತ್ತಾನೆ
      '14':
        title: ಯೂದನು ರಾತ್ರಿಯಲ್ಲಿ ಯೇಸುವನ್ನು ದ್ರೋಹದಿಂದ ಒಪ್ಪಿಸುತ್ತಾನೆ
      '15':
        title: ಯೇಸುವನ್ನು ಶಿಲುಬೆಗೇರಿಸಿ ಸಮಾಧಿ ಮಾಡಲಾಗುತ್ತದೆ
      '16':
        title: ಯೇಸು ಎದ್ದುಬರುತ್ತಾನೆ; ಸ್ತ್ರೀಯರು ಸುದ್ದಿಯನ್ನು ತಿಳಿಸುತ್ತಾರೆ
    Luke:
      '1':
        title: ದೇವರು ಎರಡು ಅದ್ಭುತ ಜನನಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '2':
        title: ಯೇಸು ಹುಟ್ಟಿ ಸಂತೋಷವನ್ನು ತರುತ್ತಾನೆ
      '3':
        title: ಯೋಹಾನನು ಯೇಸುವಿಗೆ ದಾರಿಯನ್ನು ಸಿದ್ಧಪಡಿಸುತ್ತಾನೆ
      '4':
        title: ಯೇಸು ಶೋಧನೆಯನ್ನು ಎದುರಿಸಿ ಸೇವೆಯನ್ನು ಆರಂಭಿಸುತ್ತಾನೆ
      '5':
        title: ಯೇಸು ಮೀನುಗಾರರನ್ನು ಜನರನ್ನು ಸೆಳೆಯಲು ಕರೆಯುತ್ತಾನೆ
      '6':
        title: ಯೇಸು ಹನ್ನೆರಡು ಅಪೊಸ್ತಲರನ್ನು ಆರಿಸುತ್ತಾನೆ
      '7':
        title: ಯೇಸು ಶತಾಧಿಪತಿಯ ಸೇವಕನನ್ನು ಗುಣಪಡಿಸುತ್ತಾನೆ
      '8':
        title: ಯೇಸು ದೇವರ ರಾಜ್ಯದ ಸಾಮ್ಯಗಳನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '9':
        title: ಯೇಸು ಸಂಪೂರ್ಣ ಸಮರ್ಪಣೆಯನ್ನು ಕೇಳುತ್ತಾನೆ
      '10':
        title: ಯೇಸು ಶಿಷ್ಯರನ್ನು ಕಳುಹಿಸುತ್ತಾನೆ
      '11':
        title: ಯೇಸು ಪಟ್ಟುಬಿಡದ ಪ್ರಾರ್ಥನೆಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '12':
        title: ಯೇಸು ಕಪಟತನದ ವಿರುದ್ಧ ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '13':
        title: ಯೇಸು ಎಚ್ಚರಿಸಿ ಗುಣಪಡಿಸುತ್ತಾನೆ
      '14':
        title: ಯೇಸು ದೀನತೆ ಮತ್ತು ಉದಾರತೆಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '15':
        title: ಯೇಸು ಕಳೆದುಹೋದ ಪಾಪಿಗಳನ್ನು ಸ್ವಾಗತಿಸುತ್ತಾನೆ
      '16':
        title: ಯೇಸು ಸಂಪತ್ತಿನ ಆರಾಧನೆಯನ್ನು ಖಂಡಿಸುತ್ತಾನೆ
      '17':
        title: ಯೇಸು ಶಿಷ್ಯರನ್ನು ಎಚ್ಚರಿಸಿ ಸೇವೆಮಾಡಲು ಬೋಧಿಸುತ್ತಾನೆ
      '18':
        title: ಯೇಸು ಪಟ್ಟುಬಿಡದ ಪ್ರಾರ್ಥನೆಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '19':
        title: ಯೇಸು ಯೆರಿಕೋದಲ್ಲಿ ಜಕ್ಕಾಯನನ್ನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '20':
        title: ಯೇಸು ದೇವಾಲಯದ ನಾಯಕರನ್ನು ಪ್ರಶ್ನಿಸುತ್ತಾನೆ
      '21':
        title: ವಿಧವೆಯ ಕಾಣಿಕೆ ಮತ್ತು ಬರಲಿರುವ ಸಂಕಟಕಾಲ
      '22':
        title: ಯೇಸು ಆಲಿವ್ ಬೆಟ್ಟದ ಮೇಲೆ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '23':
        title: ಯೇಸುವನ್ನು ಹೊಸ ಸಮಾಧಿಯಲ್ಲಿ ಇಡಲಾಗುತ್ತದೆ
      '24':
        title: ಯೇಸು ಎದ್ದುಬಂದು ಕ್ಷಮೆಯನ್ನು ಸಾರುತ್ತಾನೆ
    John:
      '1':
        title: ವಾಕ್ಯವು ಮಾಂಸಧಾರಿಯಾಗುತ್ತದೆ
      '2':
        title: ಯೇಸು ನೀರನ್ನು ದ್ರಾಕ್ಷಾರಸವನ್ನಾಗಿ ಮಾಡುತ್ತಾನೆ
      '3':
        title: ದೇವರು ತನ್ನ ಪ್ರಿಯ ಮಗನನ್ನು ಕೊಡುತ್ತಾನೆ
      '4':
        title: ಯೇಸು ಸಮಾರ್ಯದ ಸ್ತ್ರೀಯನ್ನು ಭೇಟಿಯಾಗುತ್ತಾನೆ
      '5':
        title: ಯೇಸು ಸಬ್ಬತ್ ದಿನದಲ್ಲಿ ಒಬ್ಬ ಮನುಷ್ಯನನ್ನು ಗುಣಪಡಿಸುತ್ತಾನೆ
      '6':
        title: ಯೇಸು ಐದು ಸಾವಿರ ಜನರಿಗೆ ಊಟ ಕೊಡುತ್ತಾನೆ
      '7':
        title: ಯೇಸು ಹಬ್ಬದಲ್ಲಿ ಬೋಧಿಸುತ್ತಾನೆ
      '8':
        title: ಲೋಕದ ಬೆಳಕಾದ ಯೇಸುವನ್ನು ತಿರಸ್ಕರಿಸಲಾಗುತ್ತದೆ
      '9':
        title: ಯೇಸು ಕುರುಡನನ್ನು ಗುಣಪಡಿಸುತ್ತಾನೆ
      '10':
        title: ಯೇಸು ತನ್ನ ಕುರಿಗಳ ಕುರಿತು ಮಾತನಾಡುತ್ತಾನೆ
      '11':
        title: ಯೇಸು ಲಾಜರನನ್ನು ಸತ್ತವರೊಳಗಿಂದ ಎಬ್ಬಿಸುತ್ತಾನೆ
      '12':
        title: ಮರಿಯಳು ಯೇಸುವಿನ ಸಮಾಧಿಗಾಗಿ ಸುಗಂಧತೈಲ ಹಚ್ಚುತ್ತಾಳೆ
      '13':
        title: ಯೇಸು ಶಿಷ್ಯರ ಪಾದಗಳನ್ನು ತೊಳೆಯುತ್ತಾನೆ
      '14':
        title: ಯೇಸು ಪವಿತ್ರಾತ್ಮನನ್ನು ವಾಗ್ದಾನ ಮಾಡುತ್ತಾನೆ
      '15':
        title: ನಿಜವಾದ ದ್ರಾಕ್ಷಿಬಳ್ಳಿಯಾದ ಯೇಸು ಕೊಂಬೆಗಳನ್ನು ಕತ್ತರಿಸಿ ಶುದ್ಧಗೊಳಿಸುತ್ತಾನೆ
      '16':
        title: ಸಂಕಟ ಬರುತ್ತದೆ, ಆದರೆ ಸಂತೋಷ ಉಳಿಯುತ್ತದೆ
      '17':
        title: ಯೇಸು ತನ್ನ ಶಿಷ್ಯರಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '18':
        title: ಯೇಸುವನ್ನು ಬಂಧಿಸಲಾಗುತ್ತದೆ; ಪೇತ್ರನು ಆತನನ್ನು ನಿರಾಕರಿಸುತ್ತಾನೆ
      '19':
        title: ಯೇಸುವನ್ನು ಕೊರಡೆಗಳಿಂದ ಹೊಡೆದು, ಅಪಹಾಸ್ಯ ಮಾಡಿ, ಶಿಲುಬೆಗೇರಿಸಲಾಗುತ್ತದೆ
      '20':
        title: ಯೇಸು ಮರಿಯಳಿಗೆ ತನ್ನನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '21':
        title: ಯೇಸು ಸಮುದ್ರದ ಬಳಿ ಪೇತ್ರನನ್ನು ಪುನಃಸ್ಥಾಪಿಸುತ್ತಾನೆ
    Acts:
      '1':
        title: ಸಾಕ್ಷಿಗಳು ಪವಿತ್ರಾತ್ಮನಿಗಾಗಿ ಕಾಯುತ್ತಾರೆ
      '2':
        title: ಪವಿತ್ರಾತ್ಮನು ಪಂಚಾಶತ್ತಮ ದಿನವನ್ನು ಪ್ರಜ್ವಲಿಸುತ್ತಾನೆ
      '3':
        title: ಪೇತ್ರನು ಕುಂಟ ಭಿಕ್ಷುಕನನ್ನು ಗುಣಪಡಿಸುತ್ತಾನೆ
      '4':
        title: ಅಪೊಸ್ತಲರು ಪವಿತ್ರ ಧೈರ್ಯದಿಂದ ಮಾತನಾಡುತ್ತಾರೆ
      '5':
        title: ತೀರ್ಪು ಮತ್ತು ಅದ್ಭುತಗಳು ಸಭೆಯನ್ನು ಪರೀಕ್ಷಿಸುತ್ತವೆ
      '6':
        title: ಏಳು ಸೇವಕರು ಸಭೆಗೆ ನೆರವಾಗುತ್ತಾರೆ
      '7':
        title: ಸ್ತೆಫನನು ತೆರೆದಿರುವ ಪರಲೋಕವನ್ನು ನೋಡುತ್ತಾನೆ
      '8':
        title: ಸುವಾರ್ತೆ ಸಮಾರ್ಯವನ್ನು ತಲುಪುತ್ತದೆ
      '9':
        title: ಸೌಲನು ಪುನರುತ್ಥಾನಗೊಂಡ ಯೇಸುವನ್ನು ಎದುರಾಗುತ್ತಾನೆ
      '10':
        title: ಅನ್ಯಜನರು ಪವಿತ್ರಾತ್ಮನನ್ನು ಪಡೆಯುತ್ತಾರೆ
      '11':
        title: ಅನ್ಯಜನರ ಸ್ವೀಕಾರವನ್ನು ಪೇತ್ರನು ಸಮರ್ಥಿಸುತ್ತಾನೆ
      '12':
        title: ದೇವದೂತನು ಪೇತ್ರನನ್ನು ಬಿಡುಗಡೆ ಮಾಡುತ್ತಾನೆ
      '13':
        title: ಪೌಲನು ಅನ್ಯಜನರ ನಡುವಿನ ಸೇವೆಯನ್ನು ಆರಂಭಿಸುತ್ತಾನೆ
      '14':
        title: ಪೌಲನು ಹಿಂಸೆಯ ನಡುವೆಯೂ ದೃಢವಾಗಿ ಮುಂದುವರಿಯುತ್ತಾನೆ
      '15':
        title: ಯೆರೂಸಲೇಮಿನ ಸಭೆ ಅನ್ಯಜನರನ್ನು ಸ್ವಾಗತಿಸುತ್ತದೆ
      '16':
