      '10':
        title: ಪುನರುತ್ಥಾನಕ್ಕಾಗಿ ವಿಭಜನೆಯನ್ನು ತೊರೆಯಿರಿ
      '11':
        title: ಇತರರ ಹಿತಕ್ಕಾಗಿ ಬೋಧನೆಯನ್ನು ಹಂಚಿಕೊಳ್ಳಿರಿ
    Dialogue of the Savior:
      '1':
        title: ಯೇಸು ನಿಜವಾದ ವಿಶ್ರಾಂತಿಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '2':
        title: ದೇವರು ಶಾಶ್ವತ ಜೀವನದತ್ತ ನಡೆಸುತ್ತಾನೆ
      '3':
