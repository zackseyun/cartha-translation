    Treatise on the Resurrection:
      '1':
        title: ಕ್ರಿಸ್ತನು ನಿಜವಾದ ಪರಿಪೂರ್ಣತೆಯನ್ನು ತರುತ್ತಾನೆ
      '2':
        title: ಕ್ರಿಸ್ತನು ಮರಣದ ಹಿಡಿತವನ್ನು ಜಯಿಸುತ್ತಾನೆ
      '3':
        title: ಪುನರುತ್ಥಾನವು ವಾಸ್ತವವನ್ನು ರೂಪಾಂತರಿಸುತ್ತದೆ
      '4':
        title: ವಿಶ್ವಾಸಿಗಳು ಕ್ರಿಸ್ತನ ಪುನರುತ್ಥಾನದಲ್ಲಿ ಪಾಲ್ಗೊಳ್ಳುತ್ತಾರೆ
      '5':
        title: ಕ್ರಿಸ್ತನ ಪುನರುತ್ಥಾನದಲ್ಲಿ ನಂಬಿಕೆ
      '6':
        title: ರಕ್ಷಣೆಯ ಜ್ಞಾನವು ಎಂದೆಂದಿಗೂ ಉಳಿಯುತ್ತದೆ
      '7':
        title: ಕೃಪೆಯು ಶಾಶ್ವತ ಜೀವನವನ್ನು ಕಾಪಾಡುತ್ತದೆ
      '8':
        title: ಪುನರುತ್ಥಾನವು ನಿಜವಾದ ಜೀವನವನ್ನು ಪ್ರಕಟಿಸುತ್ತದೆ
      '9':
