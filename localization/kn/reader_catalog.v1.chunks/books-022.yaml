    Gospel of Philip:
      display_name: ಫಿಲಿಪ್ಪನ ಸುವಾರ್ತೆ
      author: ಅಜ್ಞಾತ. ಹಸ್ತಪ್ರತಿಯ ಕೊನೆಯ ಉಪಲೇಖನದಲ್ಲಿ ಈ ಶೀರ್ಷಿಕೆ ಕಾಣುತ್ತದೆ; ಆದರೆ ಕೃತಿಯು ಫಿಲಿಪ್ಪನನ್ನು ತನ್ನ ಲೇಖಕನೆಂದು ಗುರುತಿಸುವುದಿಲ್ಲ. ಉಳಿದುಕೊಂಡಿರುವ ಏಕೈಕ ಪ್ರತಿ ನಾಗ್ ಹಮ್ಮಾದಿ ಕೋಡೆಕ್ಸ್ II,3ರ ಕಾಪ್ಟಿಕ್ ಪಠ್ಯವಾಗಿದೆ.
      audience: ವ್ಯಾಲೆಂಟೀನಿಯನ್ ಶೈಲಿಯ ಸಂಸ್ಕಾರೋಪದೇಶವನ್ನು—ವಿಶೇಷವಾಗಿ ದೀಕ್ಷಾಸ್ನಾನ, ಅಭಿಷೇಕ, ಯೂಕರಿಸ್ಟ್, ವಿಮೋಚನೆ, ಪುನರುತ್ಥಾನ ಮತ್ತು ವಧೂವರರ ಕೋಣೆಯ ರೂಪಕಗಳನ್ನು—ತಿಳಿದಿದ್ದ ಆರಂಭಿಕ ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
      date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಕೊನೆಯ ಅಥವಾ 3ನೇ ಶತಮಾನದ ಆರಂಭದ ಕಾಲದ್ದೆಂದು ದಿನಾಂಕ ನಿಗದಿಪಡಿಸಲಾಗಿದೆ; ಹಿಂದಿನ ಗ್ರೀಕ್ ರೂಪದಿಂದ ಅನುವಾದಗೊಂಡ 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಹಸ್ತಪ್ರತಿಯಲ್ಲಿ ಇದು ಸಂರಕ್ಷಿತವಾಗಿದೆ.
  chapter_titles:
    Testament of Issachar:
      '6':
        title: ವಂಶಜರು ದೇಶಭ್ರಷ್ಟತೆಯನ್ನು ಎದುರಿಸುವರು
      '7':
        title: ಇಸ್ಸಾಕಾರನು ನೀತಿಯ ಕುರಿತು ಚಿಂತಿಸುತ್ತಾನೆ
    Testament of Zebulun:
      '1':
        title: ಮೂಲಪಿತೃವು ದುಷ್ಟತನದ ಕುರಿತು ಪುತ್ರರನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '2':
        title: ಮೌನವಾಗಿ ಉಳಿದ ಅಪರಾಧಭಾವಕ್ಕಾಗಿ ಜೆಬುಲೂನನು ಅಳುತ್ತಾನೆ
      '3':
        title: ಜೆಬುಲೂನನು ಪ್ರಾರ್ಥಿಸಿ ಗುಂಡಿಯನ್ನು ಕಾಯುತ್ತಾನೆ
      '4':
        title: ಕರುಣಾಮಯ ಜೆಬುಲೂನನು ಗುಂಡಿಯನ್ನು ಕಾಯುತ್ತಾನೆ
      '5':
        title: ಕರುಣೆಯು ಜೆಬುಲೂನನ ಕುಟುಂಬವನ್ನು ಸುರಕ್ಷಿತವಾಗಿಡುತ್ತದೆ
      '6':
        title: ದೋಣಿಯ ಆವಿಷ್ಕಾರಕನು ಹೇರಳವಾದ ಮೀನುಗಾರಿಕೆಯ ಫಲವನ್ನು ಹಂಚುತ್ತಾನೆ
      '7':
        title: ನಿಷ್ಕಪಟ ಹೃದಯದ ಉದಾರತೆಗೆ ಜೆಬುಲೂನನು ಪ್ರೇರೇಪಿಸುತ್ತಾನೆ
      '8':
        title: ಜೆಬುಲೂನನು ಕರುಣೆಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '9':
        title: ಜೆಬುಲೂನನು ವಂಶಜರನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '10':
        title: ಜೆಬುಲೂನನು ಭವಿಷ್ಯದ ವಿಮೋಚನೆಯನ್ನು ಪ್ರವಾದಿಸುತ್ತಾನೆ
    Testament of Dan:
      '1':
        title: ದಾನನು ಹಿಂದಿನ ಅಸೂಯೆಯನ್ನು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾನೆ
      '2':
        title: ಕೋಪದ ಹಿಡಿತದ ಕುರಿತು ದಾನನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '3':
        title: ಸತ್ಯವು ಕುರುಡಾಗಿಸುವ ಕೋಪವನ್ನು ಸೋಲಿಸುತ್ತದೆ
      '4':
        title: ಕೋಪವು ಆತ್ಮವನ್ನೂ ಮನಸ್ಸನ್ನೂ ವಿಕೃತಗೊಳಿಸುತ್ತದೆ
      '5':
        title: ಪಶ್ಚಾತ್ತಾಪವು ಶಾಶ್ವತ ಶಾಂತಿಯನ್ನು ತರುತ್ತದೆ
      '6':
        title: ದೇವರಿಗೆ ಭಯಪಡಿ, ಸೈತಾನನ ಸುಳ್ಳುಗಳನ್ನು ತಿರಸ್ಕರಿಸಿ
      '7':
        title: ದಾನನ ಎಲುಬುಗಳು ಪೂರ್ವಜರೊಂದಿಗೆ ವಿಶ್ರಾಂತಿ ಪಡೆಯುತ್ತವೆ
    Testament of Naphtali:
      '1':
        title: ನಫ್ತಾಲಿಯು ತನ್ನ ಪುತ್ರರನ್ನು ಆಶೀರ್ವದಿಸುತ್ತಾನೆ
      '2':
        title: ದೇವರು ಪ್ರತಿಯೊಂದು ಆತ್ಮವನ್ನೂ ಪರಿಪೂರ್ಣವಾಗಿ ರೂಪಿಸುತ್ತಾನೆ
      '3':
        title: ದುಷ್ಟಾತ್ಮಗಳಿಂದ ಹೃದಯಗಳನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳಿ
      '4':
        title: ದೇವರ ರಕ್ಷಣೆಯೊಂದಿಗೆ ದೇಶಭ್ರಷ್ಟತೆ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ
      '5':
        title: ಲೇವಿ, ಯೆಹೂದ ಮತ್ತು ಯೋಸೇಫರು ಉನ್ನತಿಗೇರುತ್ತಾರೆ
      '6':
        title: ಬಿರುಗಾಳಿಯು ಯಾಕೋಬನ ಕುಟುಂಬವನ್ನು ಚದುರಿಸುತ್ತದೆ
      '7':
        title: ನಫ್ತಾಲಿಯು ಕರಾಳ ಸತ್ಯಗಳನ್ನು ಮರೆಮಾಡುತ್ತಾನೆ
      '8':
        title: ದೇವರನ್ನು ಗೌರವಿಸಲು ಜ್ಞಾನವನ್ನು ಹುಡುಕಿ
      '9':
        title: ನಫ್ತಾಲಿಯ ಎಲುಬುಗಳು ಸ್ವದೇಶಕ್ಕೆ ಮರಳುತ್ತವೆ
    Testament of Gad:
      '1':
        title: ದ್ವೇಷದ ವಿಷದ ಕುರಿತು ಗಾದನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '2':
        title: ಯೋಸೇಫನಿಗೆ ಮಾಡಿದ ದ್ರೋಹವನ್ನು ಗಾದನು ಒಪ್ಪಿಕೊಳ್ಳುತ್ತಾನೆ
      '3':
        title: ಆತ್ಮವನ್ನೇ ನುಂಗುವ ದ್ವೇಷವನ್ನು ತೊರೆಯಿರಿ
      '4':
        title: ದ್ವೇಷವು ಜೀವವನ್ನಲ್ಲ, ಮರಣವನ್ನು ತರುತ್ತದೆ
      '5':
        title: ಪಶ್ಚಾತ್ತಾಪವು ದೈವಿಕ ಬೆಳಕನ್ನು ತರುತ್ತದೆ
      '6':
        title: ಹೃದಯಪೂರ್ವಕವಾಗಿ ಕ್ಷಮಿಸಿ, ಶಾಂತಿಯನ್ನು ಪಡೆಯಿರಿ
      '7':
        title: ಶತ್ರುಗಳ ಏಳಿಗೆಗಾಗಿ ಪ್ರಾರ್ಥಿಸಿ
      '8':
        title: ಬೋಧನೆಗಳನ್ನು ಮುಂದಿನ ತಲೆಮಾರಿನ ಪುತ್ರರಿಗೆ ದಾಟಿಸಿ
    Testament of Asher:
      '1':
        title: ಆಶೇರನು ಮಕ್ಕಳಿಗೆ ನೀತಿಯ ಮಾರ್ಗವನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '2':
        title: ಮರೆಮಾಚಿದ ದುಷ್ಟತನವು ಸಂಪೂರ್ಣವಾಗಿ ಖಂಡಿತವಾಗುತ್ತದೆ
      '3':
        title: ದ್ವಿಮನಸ್ಸಿನ ಜೀವನವನ್ನು ತೊರೆಯಿರಿ ಎಂದು ಆಶೇರನು ಆಜ್ಞಾಪಿಸುತ್ತಾನೆ
      '4':
        title: ಭಕ್ತರು ದುಷ್ಟತನವನ್ನು ಎದುರಿಸಿ ನಿಲ್ಲುತ್ತಾರೆ
      '5':
        title: ಆಶೇರನು ದ್ವಂದ್ವ ವಾಸ್ತವತೆಯನ್ನು ಬೋಧಿಸುತ್ತಾನೆ
      '6':
        title: ಏಕನಿಷ್ಠ ಉದ್ದೇಶದಿಂದ ಆಜ್ಞೆಗಳನ್ನು ಅನುಸರಿಸಿ
      '7':
        title: ತೀರ್ಪಿನ ನಡುವೆಯೂ ಪ್ರವಾದನೆಯು ನಿರೀಕ್ಷೆಯನ್ನು ವಾಗ್ದಾನ ಮಾಡುತ್ತದೆ
      '8':
        title: ಆಶೇರನನ್ನು ಹೆಬ್ರೋನಿನಲ್ಲಿ ಶಾಂತಿಯಿಂದ ಸಮಾಧಿಮಾಡಲಾಗುತ್ತದೆ
    Testament of Joseph:
      '1':
        title: ಯೋಸೇಫನು ತನ್ನ ಅಂತಿಮ ಒಡಂಬಡಿಕೆಯ ಮಾತುಗಳನ್ನು ಹಂಚಿಕೊಳ್ಳುತ್ತಾನೆ
      '2':
        title: ಯೋಸೇಫನು ಪ್ರತಿದಿನವೂ ಪ್ರಲೋಭನೆಯನ್ನು ಎದುರಿಸುತ್ತಾನೆ
      '3':
        title: ಯೋಸೇಫನು ಏಳು ವರ್ಷಗಳ ಕಾಲ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '4':
        title: ಸುಳ್ಳು ಆರಾಧನೆಯ ಒಪ್ಪಂದಗಳನ್ನು ಯೋಸೇಫನು ತಿರಸ್ಕರಿಸುತ್ತಾನೆ
      '5':
