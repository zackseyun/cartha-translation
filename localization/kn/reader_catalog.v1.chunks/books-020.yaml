payload:
  book_metadata:
    Psalms of Solomon:
      display_name: ಸೊಲೊಮೋನನ ಕೀರ್ತನೆಗಳು
      author: ಕರ್ತೃ ಅಜ್ಞಾತ; ಸೊಲೊಮೋನನ ಹೆಸರಿನಲ್ಲಿ ಕಾವ್ಯನಾಮದಿಂದ ರಚಿಸಲಾಗಿದೆ.
      audience: ಕ್ರಿ.ಪೂ. 63ರಲ್ಲಿ ಪೊಂಪೇಯನು ಯೆರೂಸಲೇಮನ್ನು ವಶಪಡಿಸಿಕೊಳ್ಳುವುದಕ್ಕೆ ಪ್ರತಿಕ್ರಿಯಿಸುತ್ತಿದ್ದ ಧರ್ಮನಿಷ್ಠ ಯೆಹೂದ್ಯರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಪೂ. 1ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗ.
    Shepherd of Hermas:
      display_name: ಹೆರ್ಮಾಸನ ಕುರುಬ
      author: ರೋಮ್‌ನಲ್ಲಿ ವಾಸಿಸುತ್ತಿದ್ದ ಕ್ರೈಸ್ತನಾದ ಹೆರ್ಮಾಸ್.
      audience: ರೋಮ್‌ನ ಕ್ರೈಸ್ತ ಸಭೆ — ಪಶ್ಚಾತ್ತಾಪದ ಕುರಿತ ನೈತಿಕ ಮತ್ತು ಪ್ರಳಯದರ್ಶಕ ಪ್ರವಾದನೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಆರಂಭದಿಂದ ಮಧ್ಯಭಾಗ.
  chapter_titles:
    Jubilees:
      '17':
        title: ಅಬ್ರಹಾಮನ ನಂಬಿಕೆ ಸಾಬೀತಾಯಿತು
      '18':
        title: ಚೀಯೋನಿನಲ್ಲಿ ಅಬ್ರಹಾಮನ ವಿಧೇಯತೆ ಪರೀಕ್ಷಿಸಲಾಯಿತು
      '19':
        title: ಅಬ್ರಹಾಮನ ಮರಣ ಮತ್ತು ಯಾಕೋಬನಿಗೆ ಆಶೀರ್ವಾದ
      '20':
        title: ಶುದ್ಧತೆಯನ್ನು ಪಾಲಿಸಲು ಅಬ್ರಹಾಮನ ಆಜ್ಞೆ
      '21':
        title: ನೀತಿವಂತನಾಗಿರಲು ಯಾಕೋಬನನ್ನು ಅಬ್ರಹಾಮನು ಆಶೀರ್ವದಿಸುತ್ತಾನೆ
      '22':
        title: ವಾರಗಳ ಹಬ್ಬದ ಸ್ಥಾಪನೆ
      '23':
        title: ಏಸಾವನ ಕೋಪದಿಂದ ಯಾಕೋಬನ ಪಲಾಯನ
      '24':
        title: ಲಾಬಾನನ ಬಳಿಯಲ್ಲಿ ಯಾಕೋಬನ ಸೇವೆ ಮತ್ತು ವಂಚನೆ
      '25':
        title: ಯಾಕೋಬನು ಕಾನಾನಿಗೆ ಹಿಂದಿರುಗುತ್ತಾನೆ
      '26':
        title: ಯಾಕೋಬ ಮತ್ತು ಏಸಾವರ ಸಂಧಾನ
      '27':
        title: ಏಸಾವನಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳುವಾಗ ಯಾಕೋಬನ ಕನಸು
      '28':
        title: ಲಾಬಾನನು ಯಾಕೋಬನನ್ನು ವಂಚಿಸಿ ಮದುವೆ ಮಾಡಿಸುತ್ತಾನೆ
      '29':
        title: ಯಾಕೋಬನು ಲಾಬಾನನಿಗೆ ತಿಳಿಯದಂತೆ ಹೊರಡುತ್ತಾನೆ
      '30':
        title: ದೀನಳಿಗಾಗಿ ಸಿಮೆಯೋನ ಮತ್ತು ಲೇವಿಯ ಪ್ರತೀಕಾರ
      '31':
        title: ಲೇವಿ ಮತ್ತು ಯೆಹೂದರನ್ನು ಇಸಾಕನು ಆಶೀರ್ವದಿಸುತ್ತಾನೆ
      '32':
        title: ಯಾಕೋಬನು ದಶಮಾಂಶ ಕೊಟ್ಟು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '33':
        title: ರೂಬೇನನು ಯಾಕೋಬನಿಗೆ ತೀವ್ರ ಅವಮಾನ ಮಾಡುತ್ತಾನೆ
      '34':
        title: ಯೋಸೇಫನು ಈಜಿಪ್ಟಿಗೆ ಮಾರಲ್ಪಟ್ಟ ದುರಂತ
      '35':
        title: ಮಕಪೇಲದ ಸಮೀಪ ರೆಬೆಕ್ಕಳ ಮರಣ
      '36':
        title: ಸಾಯುವ ಮೊದಲು ಇಸಾಕನ ಆಶೀರ್ವಾದ
      '37':
        title: ಏಸಾವನು ತನ್ನ ಪ್ರಮಾಣವನ್ನು ತ್ಯಜಿಸುತ್ತಾನೆ
      '38':
        title: ಯುದ್ಧದಲ್ಲಿ ಏಸಾವನನ್ನು ಯಾಕೋಬನು ಕೊಲ್ಲುತ್ತಾನೆ
      '39':
        title: ಪೋಟೀಫರನ ಹೆಂಡತಿಯನ್ನು ಯೋಸೇಫನು ಪ್ರತಿರೋಧಿಸುತ್ತಾನೆ
      '40':
        title: ಯೋಸೇಫನು ಈಜಿಪ್ಟಿನ ಆಡಳಿತಗಾರನಾಗುತ್ತಾನೆ
      '41':
        title: ಸಂತಾನಕ್ಕಾಗಿ ತಾಮಾರಳು ಯೆಹೂದನನ್ನು ವಂಚಿಸುತ್ತಾಳೆ
      '42':
        title: ಯೋಸೇಫನು ತನ್ನ ಸಹೋದರರನ್ನು ಪರೀಕ್ಷಿಸುತ್ತಾನೆ
      '43':
        title: ಬೆನ್ಯಾಮೀನನಿಗಾಗಿ ಯೆಹೂದನ ಮನವಿ
      '44':
        title: ಯಾಕೋಬನ ಈಜಿಪ್ಟ್ ಪ್ರಯಾಣ
      '45':
        title: ಇಸ್ರಾಯೇಲರು ಗೋಷೆನಿನಲ್ಲಿ ನೆಲೆಸುತ್ತಾರೆ
      '46':
        title: ಯೋಸೇಫನ ಅಧೀನದಲ್ಲಿ ಇಸ್ರಾಯೇಲರು ವೃದ್ಧಿಯಾಗುತ್ತಾರೆ
      '47':
        title: ಜೊಂಡುಗಳ ನಡುವೆ ಮೋಶೆಯನ್ನು ಅಡಗಿಸಲಾಗುತ್ತದೆ
      '48':
        title: ಮಸ್ತೇಮನು ಮೋಶೆಯ ಮೇಲೆ ದಾಳಿ ಮಾಡಿ ವಿಫಲನಾಗುತ್ತಾನೆ
      '49':
        title: ಪಸ್ಕದ ಕುರಿಮರಿಯನ್ನು ಇಡಿಯಾಗಿ ಸುಡಲಾಗುತ್ತದೆ
      '50':
        title: ಸಬ್ಬತ್ ವಿಶ್ರಾಂತಿ ಮತ್ತು ನಿಷಿದ್ಧ ಕೆಲಸಗಳು
    Psalms of Solomon:
      '1':
        title: ನನ್ನ ಸಂಕಟದ ಮೊರೆಯನ್ನು ಕರ್ತನು ಕೇಳುತ್ತಾನೆ
      '2':
        title: ದೇವರು ಅಹಂಕಾರಿ ಪಾಪಿಗಳಿಗೆ ಶೀಘ್ರವಾಗಿ ನ್ಯಾಯತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '3':
        title: ನೀತಿವಂತರು ಕರ್ತನನ್ನು ನಿರಂತರವಾಗಿ ಸ್ತುತಿಸುತ್ತಾರೆ
      '4':
        title: ಕಪಟಿಯ ಗತಿ ನಾಚಿಕೆಗೇಡಿನ ಅಂತ್ಯ
      '5':
        title: ದೇವರು ಎಲ್ಲರಿಗೂ ಸಮೃದ್ಧವಾಗಿ ಒದಗಿಸುತ್ತಾನೆ
      '6':
        title: ಸಿದ್ಧವಾದ ಹೃದಯವು ಕರ್ತನನ್ನು ಕರೆಯುತ್ತದೆ
      '7':
        title: ಶತ್ರುಗಳ ಹಿಡಿತದಿಂದ ಕರ್ತನು ರಕ್ಷಿಸುತ್ತಾನೆ
      '8':
        title: ಕರ್ತನು ಎಂದೆಂದಿಗೂ ನೀತಿಯಿಂದ ನ್ಯಾಯತೀರ್ಪು ನೀಡುತ್ತಾನೆ
      '9':
        title: ದೇವರ ಕರುಣೆಯಲ್ಲಿ ಇಸ್ರಾಯೇಲಿನ ನಿರೀಕ್ಷೆ
      '10':
        title: ಶಿಕ್ಷೆಯನ್ನು ಸ್ವೀಕರಿಸುವುದು ಶುದ್ಧೀಕರಣ ತರುತ್ತದೆ
      '11':
        title: ದೂರದ ನಾಡುಗಳಿಂದ ಇಸ್ರಾಯೇಲನ್ನು ಒಟ್ಟುಗೂಡಿಸು
      '12':
        title: ಗುಸುಗುಸು ಸುಳ್ಳುಗಳಿಂದ ನನ್ನನ್ನು ರಕ್ಷಿಸು
      '13':
        title: ನೀತಿವಂತರು ವಿನಾಶದಿಂದ ಮುಕ್ತರಾಗಿ ಜೀವಿಸುತ್ತಾರೆ
      '14':
        title: ನಂಬಿಗಸ್ತರು ಎಂದೆಂದಿಗೂ ಜೀವವೃಕ್ಷಗಳಂತೆ ಇರುವರು
      '15':
        title: ಸಂಕಟದಲ್ಲಿ ಕರ್ತನನ್ನು ಕರೆದಿದ್ದೇನೆ
      '16':
        title: ದೇವರ ಕರುಣೆ ನನ್ನನ್ನು ಎಚ್ಚರಗೊಳಿಸಿತು
      '17':
        title: ಕರ್ತನು ಸತ್ಯವಂತನಾದ ಶಾಶ್ವತ ಅರಸನು
      '18':
        title: ಕರುಣೆಯ ದಿನಕ್ಕಾಗಿ ಇಸ್ರಾಯೇಲನ್ನು ಶುದ್ಧಪಡಿಸು
    Shepherd of Hermas:
      '1':
        title: ಹೆರ್ಮಾಸ್ ದುಷ್ಟ ಬಯಕೆಯನ್ನು ಎದುರಿಸುತ್ತಾನೆ
      '2':
        title: ಪುಸ್ತಕದೊಂದಿಗೆ ಮಹಿಳೆ ಕಾಣಿಸಿಕೊಳ್ಳುತ್ತಾಳೆ
      '3':
        title: ಕುಟುಂಬವು ಪಶ್ಚಾತ್ತಾಪಪಡಬೇಕೆಂದು ದೂತನು ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '4':
        title: ಓದಿ ಮುಗಿಸಿದ ಬಳಿಕ ಮಹಿಳೆ ಹೊರಡುತ್ತಾಳೆ
      '5':
        title: ಆತ್ಮವು ಹೆರ್ಮಾಸನನ್ನು ಮತ್ತೆ ಮೇಲಕ್ಕೆತ್ತುತ್ತದೆ
      '6':
        title: ಪಶ್ಚಾತ್ತಾಪಪಡಬೇಕೆಂದು ಮಕ್ಕಳಿಗೆ ಎಚ್ಚರಿಕೆ
      '7':
        title: ಹೆರ್ಮಾಸನಿಗೆ ಕ್ಷಮೆ, ಮಕ್ಕಳಿಗೆ ಶುದ್ಧೀಕರಣ
      '8':
        title: ಸಭೆಯು ವೃದ್ಧೆಯಾಗಿ ಪ್ರಕಟವಾಗುತ್ತದೆ
      '9':
        title: ಹೊಲದಲ್ಲಿ ಮಹಿಳೆಯನ್ನು ಹೆರ್ಮಾಸ್ ಭೇಟಿಯಾಗುತ್ತಾನೆ
      '10':
        title: ನೀರಿನ ಮೇಲೆ ಕಟ್ಟಲಾಗುತ್ತಿರುವ ಗೋಪುರದ ದರ್ಶನ
      '11':
        title: ಮಹಿಳೆ ದರ್ಶನವನ್ನು ವಿವರಿಸುತ್ತಾಳೆ
      '12':
        title: ದೇವದೂತರು ಗೋಪುರವನ್ನು ಕಟ್ಟುತ್ತಾರೆ
      '13':
        title: ಕಲ್ಲುಗಳು ಗೋಪುರದಲ್ಲಿ ಸರಿಯಾಗಿ ಹೊಂದಿಕೊಳ್ಳುತ್ತವೆ
      '14':
        title: ಪಾಪಿಗಳನ್ನು ಗೋಪುರದಿಂದ ತಿರಸ್ಕರಿಸಲಾಗುತ್ತದೆ
      '15':
        title: ತಿರಸ್ಕೃತ ಕಲ್ಲುಗಳಿಗೆ ಪಶ್ಚಾತ್ತಾಪದ ಅವಕಾಶ
      '16':
        title: ಏಳು ಮಹಿಳೆಯರು ಗೋಪುರಕ್ಕೆ ಆಧಾರವಾಗಿದ್ದಾರೆ
      '17':
        title: ಮೂರನೇ ದರ್ಶನ, ಒಂಬತ್ತನೇ ವಿಭಾಗ
      '18':
        title: ಶುದ್ಧರಾಗುವಂತೆ ನಾಯಕರಿಗೆ ಎಚ್ಚರಿಕೆ
      '19':
        title: ಮೊದಲ ಮೂರು ರೂಪಗಳ ವಿವರಣೆ
      '20':
        title: 'ಎರಡನೇ ದರ್ಶನ: ನವೀಕೃತ ಆತ್ಮಗಳು'
      '21':
        title: ಮೂರನೇ ದರ್ಶನವು ನವೀಕರಣವನ್ನು ತೋರಿಸುತ್ತದೆ
      '22':
        title: ಮೃಗವು ಮಹಾ ಸಂಕಟವನ್ನು ಸೂಚಿಸುತ್ತದೆ
      '23':
        title: ಶುದ್ಧ ಹೃದಯದಿಂದ ಸೇವಿಸಲು ಕನ್ಯೆಯ ಒತ್ತಾಯ
      '24':
        title: ಮೃಗದ ತಲೆಯ ಮೇಲಿರುವ ನಾಲ್ಕು ಬಣ್ಣಗಳು
      '25':
        title: ಕುರುಬನು ಪ್ರಧಾನ ಸಂಗತಿಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '26':
        title: ಏಕಮಾತ್ರ ಸತ್ಯದೇವರಲ್ಲಿ ನಂಬಿಕೆಯಿಡಿ
      '27':
        title: ಘನತೆಯನ್ನು ಧರಿಸಿಕೊಳ್ಳಿ
      '28':
        title: ಸತ್ಯನಿಷ್ಠವಾಗಿ ಜೀವಿಸಲು ದೂತನ ಒತ್ತಾಯ
      '29':
        title: ಲೈಂಗಿಕ ಶುದ್ಧತೆಯ ಆಜ್ಞೆಯನ್ನು ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಪಾಲಿಸಿ
      '30':
        title: ಪಶ್ಚಾತ್ತಾಪವು ನಿಜವಾದ ತಿಳಿವಳಿಕೆಯನ್ನು ತರುತ್ತದೆ
      '31':
        title: ಪಶ್ಚಾತ್ತಾಪದಿಂದ ಕ್ಷಮೆ ದೊರೆಯುತ್ತದೆ
      '32':
        title: ತಾಳ್ಮೆಯಲ್ಲಿ ಪವಿತ್ರಾತ್ಮನು ಮುಕ್ತವಾಗಿ ನೆಲೆಸುತ್ತಾನೆ
      '33':
        title: ನೀತಿಯ ಮಾರ್ಗವನ್ನು ದುಷ್ಟತನದಿಂದ ವಿವೇಚಿಸಿ
      '34':
        title: ಕರ್ತನಿಗೆ ಭಯಪಟ್ಟು ನೀತಿಯಿಂದ ಜೀವಿಸಿ
      '35':
        title: ಒಳ್ಳೆಯದು ಮತ್ತು ಕೆಟ್ಟದ್ದರ ಕುರಿತು ದೂತನ ಮಾತು
      '36':
        title: ಸಂದೇಹವನ್ನು ತಿರಸ್ಕರಿಸಿ, ನಂಬಿಗಸ್ತ ದೇವರನ್ನು ಸೇವಿಸಿ
      '37':
        title: ದುಃಖವು ಹಾಳುಮಾಡುತ್ತದೆ, ರಕ್ಷಿಸುತ್ತದೆ ಕೂಡ
      '38':
        title: ದುಃಖವು ಆತ್ಮವನ್ನು ಕುಗ್ಗಿಸುತ್ತದೆ
      '39':
        title: ಹರ್ಷ ಮತ್ತು ಸಂತೋಷವನ್ನು ಧರಿಸಿಕೊಳ್ಳಿ
      '40':
        title: ನಂಬಿಗಸ್ತರು ಸುಳ್ಳು ಪ್ರವಾದಿಗಳ ಆತ್ಮಗಳನ್ನು ತಪ್ಪಿಸಿಕೊಳ್ಳುತ್ತಾರೆ
      '41':
