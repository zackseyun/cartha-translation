payload:
  book_metadata:
    Numbers:
      display_name: ಅರಣ್ಯಕಾಂಡ
      author: ಕರ್ತೃ ಅಜ್ಞಾತ; ಸಂಪ್ರದಾಯದ ಪ್ರಕಾರ ಮೋಶೆಗೆ ಸೇರಿಸಲಾಗಿದೆ.
      audience: ಈಜಿಪ್ಟಿನಿಂದ ವಾಗ್ದತ್ತ ದೇಶಕ್ಕೆ ಪ್ರಯಾಣಿಸುತ್ತಿದ್ದ ಇಸ್ರಾಯೇಲ್ಯರು—ಅರಣ್ಯದಲ್ಲಿ ಅಲೆದಾಡಿದ ಪೀಳಿಗೆ ಹಾಗೂ ಅವರ ವೈಫಲ್ಯಗಳಿಂದ ಪಾಠ ಕಲಿಯುವ ನಂತರದ ಓದುಗರು.
      date: ರಾಜಪ್ರಭುತ್ವದ ಕೊನೆಯ ಕಾಲದಿಂದ ದೇಶಭ್ರಷ್ಟತೆಯ ನಂತರದ ಕಾಲದವರೆಗಿನ ರಚನಾ ಪದರಗಳು (ಸುಮಾರು ಕ್ರಿ.ಪೂ. 7–5ನೇ ಶತಮಾನ).
    Deuteronomy:
      display_name: ಧರ್ಮೋಪದೇಶಕಾಂಡ
      author: ಕರ್ತೃ ಅಜ್ಞಾತ; ಮೋಶೆಯ ವಿದಾಯ ಭಾಷಣಗಳಾಗಿ ನಿರೂಪಿಸಲಾಗಿದೆ. ಆಧುನಿಕ ವಿದ್ವಾಂಸರು ಇದರ ಮೂಲಭಾಗವನ್ನು ಕ್ರಿ.ಪೂ. 7ನೇ ಶತಮಾನದ ಕೊನೆಯಲ್ಲಿ ಯೋಷೀಯನ ಕಾಲದಲ್ಲಿ ನಡೆದ ಸುಧಾರಣೆಗೆ ಸಂಬಂಧಿಸಿದ್ದು ಎಂದು ಪರಿಗಣಿಸುತ್ತಾರೆ.
      audience: ದೇಶವನ್ನು ಪ್ರವೇಶಿಸಲು ಸಿದ್ಧವಾಗುತ್ತಿದ್ದ ಇಸ್ರಾಯೇಲ್ಯರು—ಹಾಗೂ ದೇವಾಲಯವಾಗಲಿ ಅರಸನಾಗಲಿ ಇಲ್ಲದೆ ನಂಬಿಗಸ್ತರಾಗಿ ಬದುಕುವುದು ಹೇಗೆಂದು ಪ್ರಶ್ನಿಸುತ್ತಿದ್ದ ನಂತರದ ದೇಶಭ್ರಷ್ಟರು.
      date: ಮೂಲಭಾಗವು ಸುಮಾರು ಕ್ರಿ.ಪೂ. 7ನೇ ಶತಮಾನದ ಕೊನೆಯದು; ದೇಶಭ್ರಷ್ಟತೆಯ ಕಾಲದಲ್ಲಿ ಅಂತಿಮ ರೂಪವನ್ನು ತಲುಪಿತು.
    Joshua:
      display_name: ಯೆಹೋಶುವ
      author: ಕರ್ತೃ ಅಜ್ಞಾತ; ಧರ್ಮೋಪದೇಶಕಾಂಡದ ದೃಷ್ಟಿಕೋನದಲ್ಲಿ ರಚಿತವಾದ ಇತಿಹಾಸದ ಒಂದು ಭಾಗ.
      audience: ರಾಜಪ್ರಭುತ್ವ ಮತ್ತು ದೇಶಭ್ರಷ್ಟತೆಯ ಕಾಲದ ಇಸ್ರಾಯೇಲ್ಯರು; ಅವರು ದೇಶವಶಪಡಿಸಿಕೊಳ್ಳುವಿಕೆ, ಒಡಂಬಡಿಕೆ ಮತ್ತು ದೇಶದ ಅರ್ಥದ ಕುರಿತು ಚಿಂತಿಸುತ್ತಿದ್ದರು.
      date: ಹಳೆಯ ಸಂಪ್ರದಾಯಗಳನ್ನು ಆಧರಿಸಿ ಸುಮಾರು ಕ್ರಿ.ಪೂ. 7–6ನೇ ಶತಮಾನದಲ್ಲಿ ಸಂಕಲಿಸಲಾಯಿತು.
  chapter_titles:
    Leviticus:
      '8':
        title: ಆರೋನನು ಯಾಜಕನಾಗಿ ಪ್ರತಿಷ್ಠಿಸಲ್ಪಟ್ಟದ್ದು
      '9':
        title: ಬೆಂಕಿಯು ಬಲಿಯನ್ನು ದಹಿಸಿದ್ದು
      '10':
        title: ನಾದಾಬ್ ಮತ್ತು ಅಬೀಹು ಶಿಕ್ಷಿಸಲ್ಪಟ್ಟದ್ದು
      '11':
        title: ಶುದ್ಧ ಮತ್ತು ಅಶುದ್ಧ ಆಹಾರಗಳ ನಿಯಮಗಳು
      '12':
        title: ಹೆರಿಗೆಯ ನಂತರ ಸ್ತ್ರೀಯ ಶುದ್ಧೀಕರಣ
      '13':
        title: ಯಾಜಕರು ಚರ್ಮರೋಗಗಳನ್ನು ಪರೀಕ್ಷಿಸುವುದು
      '14':
        title: ಬಲಿಗಳ ಮೂಲಕ ಶುದ್ಧನಾಗಿ ಪುನಃ ಸೇರಿಸಲ್ಪಡುವುದು
      '15':
        title: ದೇಹಸ್ರಾವಗಳಿಂದ ಉಂಟಾಗುವ ಅಶುದ್ಧತೆ
      '16':
        title: ಎಲ್ಲ ಪಾಪಗಳಿಗೆ ಪ್ರಾಯಶ್ಚಿತ್ತ
      '17':
        title: ದೇವದರ್ಶನದ ಗುಡಾರದ ಬಾಗಿಲಿಗೆ ಬಲಿಗಳನ್ನು ತರುವುದು
      '18':
        title: ಕರ್ತನು ನೈತಿಕ ಶುದ್ಧತೆಯನ್ನು ಆಜ್ಞಾಪಿಸುವುದು
      '19':
        title: ಇಸ್ರಾಯೇಲ್ಯರಿಗೆ ಪರಿಶುದ್ಧರಾಗಿರಲು ಕರೆ
      '20':
        title: ಘೋರ ಪಾಪಗಳಿಗೆ ಕಠಿಣ ಶಿಕ್ಷೆಗಳು
      '21':
        title: ಯಾಜಕರು ವಿಶೇಷ ಪರಿಶುದ್ಧತೆಯನ್ನು ಕಾಪಾಡಬೇಕು
      '22':
        title: ಪವಿತ್ರ ಅರ್ಪಣೆಗಳನ್ನು ಎಚ್ಚರಿಕೆಯಿಂದ ನಿರ್ವಹಿಸಬೇಕು
      '23':
        title: ಆರಾಧನೆಗಾಗಿ ನೇಮಿಸಲಾದ ಸಮಯಗಳು
      '24':
        title: ದೀಪಗಳು ಉರಿಯುವುದು ಮತ್ತು ರೊಟ್ಟಿಯ ಅರ್ಪಣೆ
      '25':
        title: ಪ್ರತಿ ಏಳನೇ ವರ್ಷ ಭೂಮಿಗೆ ವಿಶ್ರಾಂತಿ
      '26':
        title: ಇಸ್ರಾಯೇಲ್ಯರ ಮುಂದೆ ಒಡಂಬಡಿಕೆಯ ಮಾರ್ಗ
      '27':
        title: ಹರಕೆಗಳು ಮತ್ತು ಸಮರ್ಪಣೆಗಳನ್ನು ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ನೆರವೇರಿಸುವುದು
    Numbers:
      '1':
        title: ಮೋಶೆಯು ಇಸ್ರಾಯೇಲ್ಯ ಪುರುಷರನ್ನು ಎಣಿಸುವುದು
      '2':
        title: ದೇವದರ್ಶನದ ಗುಡಾರದ ಸುತ್ತಲೂ ಕುಲಗಳು ಪಾಳೆಯ ಹೂಡುವುದು
      '3':
        title: ಲೇವಿಯರು ದೇವರ ಪವಿತ್ರ ನಿವಾಸದಲ್ಲಿ ಸೇವೆಮಾಡುವುದು
      '4':
        title: ಕೊಹಾತ್ಯರು ಪವಿತ್ರ ವಸ್ತುಗಳನ್ನು ನೋಡಿಕೊಳ್ಳುವುದು
      '5':
        title: ದೇವರು ಗುಪ್ತ ಪಾಪಕ್ಕೆ ನ್ಯಾಯತೀರಿಸುವುದು
      '6':
        title: ನಾಜೀರನ ಹರಕೆ ಮತ್ತು ಆಶೀರ್ವಾದ
      '7':
        title: ನಾಯಕರು ಪವಿತ್ರಸ್ಥಾನಕ್ಕಾಗಿ ಕಾಣಿಕೆಗಳನ್ನು ಅರ್ಪಿಸುವುದು
      '8':
        title: ದೇವರ ಸೇವೆಗಾಗಿ ಲೇವಿಯರ ಶುದ್ಧೀಕರಣ
      '9':
        title: ಪಸ್ಕವನ್ನು ಆಚರಿಸುವಂತೆ ಕರ್ತನ ಆಜ್ಞೆ
      '10':
        title: ಬೆಳ್ಳಿಯ ತುತ್ತೂರಿಗಳು ದೇವರ ಆಜ್ಞೆಗಳನ್ನು ಸೂಚಿಸುವುದು
      '11':
        title: ದುರಾಶೆಯ ಪರಿಣಾಮವಾಗಿ ವ್ಯಾಧಿ ಬಡಿಯುವುದು
      '12':
        title: ಮಿರ್ಯಾಮಳು ಮೋಶೆಯ ಅಧಿಕಾರವನ್ನು ವಿರೋಧಿಸುವುದು
      '13':
        title: ಹನ್ನೆರಡು ಮಂದಿ ವಾಗ್ದತ್ತ ದೇಶವನ್ನು ಪರಿಶೀಲಿಸುವುದು
      '14':
        title: ಸಂಶಯದ ಕಾರಣ ಇಸ್ರಾಯೇಲ್ಯರಿಗೆ ಶಿಕ್ಷೆ
      '15':
        title: ಅರ್ಪಣೆಗಳು ಮತ್ತು ಗೊಂಡೆಗಳ ಕುರಿತ ಸೂಚನೆಗಳು
      '16':
        title: ಕೋರಹನ ದಂಗೆ ಮತ್ತು ಭೂಮಿ ಅವರನ್ನು ನುಂಗಿದ್ದು
      '17':
        title: ಆರೋನನ ಕೋಲು ಯಾಜಕ ವಂಶವನ್ನು ದೃಢಪಡಿಸುವುದು
      '18':
        title: ಯಾಜಕರ ಮೇಲ್ವಿಚಾರಣೆಯಲ್ಲಿ ಲೇವಿಯರ ಸೇವೆ
      '19':
        title: ಕೆಂಪು ಹಸುವಿನ ಶುದ್ಧೀಕರಣ ನಿಯಮ
      '20':
        title: ಕಾದೇಶಿನಲ್ಲಿ ಮೋಶೆಯ ಹೋರಾಟ
      '21':
        title: ಇಸ್ರಾಯೇಲ್ಯರು ಕಾನಾನ್ಯರ ಅರಸನನ್ನು ಸೋಲಿಸುವುದು
      '22':
        title: ಇಸ್ರಾಯೇಲ್ಯರನ್ನು ಶಪಿಸಲು ಬಿಳಾಮನು ನಿರಾಕರಿಸುವುದು
      '23':
        title: ಬಿಳಾಮನು ಇಸ್ರಾಯೇಲ್ಯರನ್ನು ಪದೇಪದೇ ಆಶೀರ್ವದಿಸುವುದು
      '24':
        title: ಇಸ್ರಾಯೇಲ್ಯರ ಭವಿಷ್ಯದ ಮಹಿಮೆಯನ್ನು ಬಿಳಾಮನು ಸಾರುವುದು
      '25':
        title: ಪೀನೆಹಾಸನು ಜಿಮ್ರಿಯನ್ನು ಕೊಲ್ಲುವುದು
      '26':
        title: ಮೋಶೆಯು ಹೊಸ ಯೋಧರನ್ನು ಎಣಿಸುವುದು
      '27':
        title: ತಂದೆಯ ಆಸ್ತಿಯಲ್ಲಿ ಪಾಲು ಕೇಳಿದ ಪುತ್ರಿಯರು
      '28':
        title: ಇಸ್ರಾಯೇಲ್ಯರು ನಿಯತ ಬಲಿಗಳನ್ನು ಅರ್ಪಿಸುವುದು
      '29':
        title: ಇಸ್ರಾಯೇಲ್ಯರು ಮಾಸಿಕ ಬಲಿಗಳನ್ನು ಅರ್ಪಿಸುವುದು
      '30':
        title: ಮೋಶೆಯು ಹರಕೆಗಳ ಕುರಿತು ಬೋಧಿಸುವುದು
      '31':
        title: ಮಿದ್ಯಾನ್ಯರ ಮೇಲೆ ಪ್ರತೀಕಾರ ತೀರಿಸಲು ಮೋಶೆಯ ಆದೇಶ
      '32':
        title: ರೂಬೇನ್ ಮತ್ತು ಗಾದ್ ಕುಲಗಳು ಪೂರ್ವದ ದೇಶವನ್ನು ಕೇಳುವುದು
      '33':
        title: ಈಜಿಪ್ಟಿನಿಂದ ಇಸ್ರಾಯೇಲ್ಯರ ಪ್ರಯಾಣದ ಪಟ್ಟಿ
      '34':
        title: ಕರ್ತನು ಕಾನಾನ್ ದೇಶದ ಗಡಿಗಳನ್ನು ನಿರ್ಧರಿಸುವುದು
      '35':
        title: ಆಶ್ರಯ ಪಟ್ಟಣಗಳು ರಕ್ಷಣೆ ನೀಡುವುದು
      '36':
        title: ಚಲ್ಪಹಾದನ ಪುತ್ರಿಯರು ತಮ್ಮ ಕುಲದವರನ್ನೇ ಮದುವೆಯಾಗುವುದು
    Deuteronomy:
      '1':
        title: ಮೋಶೆಯು ದೇವರ ನಂಬಿಗಸ್ತಿಕೆಯನ್ನು ನೆನಪಿಸುವುದು
      '2':
        title: ಇಸ್ರಾಯೇಲ್ಯರು ಎದೋಮ್ ಮತ್ತು ಮೋವಾಬನ್ನು ತಪ್ಪಿಸಿ ಸಾಗುವುದು
      '3':
        title: ಇಸ್ರಾಯೇಲ್ಯರು ಓಗ್ ಅರಸನನ್ನು ಸೋಲಿಸುವುದು
      '4':
        title: ವಿವೇಕದಿಂದ ವಿಧೇಯರಾಗಲು ಮೋಶೆಯ ಒತ್ತಾಯ
      '5':
        title: ಮೋಶೆಯು ಹತ್ತು ಆಜ್ಞೆಗಳನ್ನು ಪುನಃ ತಿಳಿಸುವುದು
      '6':
        title: ದೇವರನ್ನು ಪ್ರೀತಿಸುವಂತೆ ಇಸ್ರಾಯೇಲ್ಯರಿಗೆ ಮೋಶೆಯ ಆಜ್ಞೆ
      '7':
        title: ಇಸ್ರಾಯೇಲ್ಯರು ವಿಗ್ರಹಗಳನ್ನು ನಾಶಮಾಡಬೇಕು
      '8':
        title: ಕಷ್ಟಕಾಲದಲ್ಲಿ ದೇವರು ತೋರಿದ ಕಾಳಜಿಯನ್ನು ನೆನಪಿಸಿಕೊಳ್ಳಿರಿ
      '9':
        title: ಮೋಶೆಯು ಇಸ್ರಾಯೇಲ್ಯರಿಗಾಗಿ ಬೇಡಿಕೊಳ್ಳುವುದು
      '10':
        title: ದೇವರು ಬಯಸುವುದನ್ನು ಮೋಶೆಯು ತಿಳಿಸುವುದು
      '11':
        title: ಪ್ರೀತಿ ಮತ್ತು ವಿಧೇಯತೆಯ ಕುರಿತು ಮೋಶೆಯ ಆಜ್ಞೆ
      '12':
        title: ಆರಿಸಲಾದ ಸ್ಥಳದಲ್ಲೇ ಆರಾಧಿಸಬೇಕು
      '13':
        title: ಸುಳ್ಳು ಪ್ರವಾದಿಗಳನ್ನೂ ವಿಗ್ರಹಗಳನ್ನೂ ತಿರಸ್ಕರಿಸಬೇಕು
      '14':
        title: ದೇವರ ಜನರಾಗಿ ಭಿನ್ನವಾಗಿ ಬದುಕಬೇಕು
      '15':
        title: ಪ್ರತಿ ಏಳನೇ ವರ್ಷ ಸಾಲಗಳನ್ನು ಮನ್ನಾ ಮಾಡಬೇಕು
      '16':
        title: ಉದಾರತೆಯಿಂದ ಹಬ್ಬಗಳನ್ನು ಆಚರಿಸಬೇಕು
      '17':
        title: ವಿಗ್ರಹಾರಾಧನೆಗೆ ನ್ಯಾಯತೀರಿಸಿ ನಿಯಮವನ್ನು ಪಾಲಿಸಬೇಕು
      '18':
        title: ಯಾಜಕರಿಗೂ ಲೇವಿಯರಿಗೂ ನಂಬಿಗಸ್ತಿಕೆಯಿಂದ ನೆರವಾಗಬೇಕು
      '19':
        title: ಆಕಸ್ಮಿಕವಾಗಿ ಕೊಂದವರಿಗೆ ಆಶ್ರಯ ನೀಡುವ ಪಟ್ಟಣಗಳು
      '20':
        title: ಯುದ್ಧದಲ್ಲಿ ಕರ್ತನನ್ನು ನಂಬಬೇಕು
      '21':
        title: ಕೊಲೆಯಾದವರ ವಿಷಯದಲ್ಲಿ ನ್ಯಾಯವಾಗಿ ನಡೆದುಕೊಳ್ಳಬೇಕು
      '22':
