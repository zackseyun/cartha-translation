payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: ಅಧಿಪತಿಗಳ ಸ್ವರೂಪ
      author: ಅನಾಮಧೇಯ. ಲೇಖಕರು ಆದಿಕಾಂಡವನ್ನು ಅಧಿಪತಿಗಳ ಕುರಿತ ಪ್ರಕಟಣಾತ್ಮಕ ಪುರಾಣಕಥೆಯ ಮೂಲಕ ವ್ಯಾಖ್ಯಾನಿಸುತ್ತಾರೆ; ಈ ಕೃತಿಯನ್ನು ನಿರ್ದಿಷ್ಟ ಹೆಸರಿನ ಬೋಧಕರೊಬ್ಬರಿಗೆ ಖಚಿತವಾಗಿ ಸೇರಿಸಲಾಗದು.
      audience: ಅಜ್ಞಾನಿಗಳಾದ ವಿಶ್ವಶಕ್ತಿಗಳು, ದೈವಿಕ ಜ್ಞಾನ ಮತ್ತು ಮಾನವಕುಲದ ಆಧ್ಯಾತ್ಮಿಕ ಮೂಲದ ನಡುವಿನ ಸಂಘರ್ಷವಾಗಿ ಆದಿಕಾಂಡವನ್ನು ಓದಿದ ಸೇಥೀಯ ಅಥವಾ ಅದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಪರಿಸರದ ಕ್ರೈಸ್ತರು.
      date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 3ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ನಾಗ್ ಹಮ್ಮಾದಿ ಸಂಹಿತೆ IIರಲ್ಲಿ ಕ್ರಿ.ಶ. 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಪ್ರತಿಯಾಗಿ ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    On the Origin of the World:
      display_name: ಲೋಕದ ಉಗಮದ ಕುರಿತು
      author: ಅನಾಮಧೇಯ. ಸಂಕಲನಕಾರರ ಹೆಸರನ್ನು ತಿಳಿಸದೆ, ಈ ಕೃತಿಯು ಹಲವಾರು ಯೆಹೂದಿ, ಕ್ರೈಸ್ತ, ಪ್ಲೇಟೋವಾದಿ ಮತ್ತು ಪೌರಾಣಿಕ ಸಂಪ್ರದಾಯಗಳನ್ನು ಸಂಯೋಜಿಸಿ ಪರಿಷ್ಕರಿಸುತ್ತದೆ.
      audience: ಸೃಷ್ಟಿ, ವಿಶ್ವಾಧಿಪತಿಗಳು, ಸೋಫಿಯಾ, ಆದಾಮ ಮತ್ತು ಹವ್ವ, ಹಾಗೂ ಲೋಕದ ಅಂತಿಮ ಗತಿಯ ಪರ್ಯಾಯ ಇತಿಹಾಸವನ್ನು ಅರಸಿದ ಜ್ಞಾನಮಾರ್ಗದ ಪ್ರಭಾವವಿದ್ದ ಕ್ರೈಸ್ತ ಪರಿಸರದ ಓದುಗರು.
      date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 3ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಆದರೆ ಇದಕ್ಕೆ ಹಿಂದಿನ ಕಾಲದ ಸಾಮಗ್ರಿಗಳು ಆಧಾರವಾಗಿರಬಹುದು. ಮುಖ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 4ನೇ ಶತಮಾನದ ಕಾಪ್ಟಿಕ್ ಪ್ರತಿಗಳಲ್ಲಿ ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    Sophia of Jesus Christ:
      display_name: ಯೇಸು ಕ್ರಿಸ್ತನ ಜ್ಞಾನ
      author: ಅನಾಮಧೇಯ. ಯೂಗ್ನೋಸ್ಟೋಸ್ ಕೃತಿಯಲ್ಲಿಯೂ ತಿಳಿದಿರುವ ವಿಷಯವನ್ನು ಲೇಖಕರು ಪುನರುತ್ಥಾನದ ನಂತರ ಯೇಸು ಮತ್ತು ಆತನ ಶಿಷ್ಯರ ನಡುವೆ ನಡೆದ ಸಂವಾದವಾಗಿ ರೂಪಾಂತರಿಸಿದ್ದಾರೆ.
      audience: ಅತೀತನಾದ ದೇವರು, ಸ್ವರ್ಗೀಯ ಲೋಕದ ವ್ಯವಸ್ಥೆ, ಆತ್ಮದ ಮೂಲ ಮತ್ತು ರಕ್ಷಣೆಯ ಕುರಿತ ಪ್ರಕಟಿತ ಜ್ಞಾನದಲ್ಲಿ ಆಸಕ್ತರಾದ ಕ್ರೈಸ್ತರು.
      date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಕೊನೆ ಅಥವಾ 3ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ನಾಗ್ ಹಮ್ಮಾದಿ ಮತ್ತು ಬರ್ಲಿನ್ ಸಂಹಿತೆಗಳ ಕಾಪ್ಟಿಕ್ ಪ್ರತಿಗಳಲ್ಲಿ ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    Gospel of the Egyptians:
      display_name: ಈಜಿಪ್ಟಿನವರ ಸುವಾರ್ತೆ
      author: ಅನಾಮಧೇಯ. ‘ಮಹಾ ಅದೃಶ್ಯ ಆತ್ಮನ ಪವಿತ್ರ ಗ್ರಂಥ’ ಎಂದೂ ಕರೆಯಲಾಗುವ ಈ ನಾಗ್ ಹಮ್ಮಾದಿ ಕೃತಿಯು, ಉಲ್ಲೇಖಗಳ ಮೂಲಕ ಮಾತ್ರ ತಿಳಿದಿರುವ ಹಿಂದಿನ ಗ್ರೀಕ್ ‘ಈಜಿಪ್ಟಿನವರ ಸುವಾರ್ತೆ’ಯಿಂದ ಭಿನ್ನವಾಗಿದೆ.
      audience: ಆಧ್ಯಾತ್ಮಿಕ ಅಸ್ಮಿತೆ ಮತ್ತು ವಿಮೋಚನೆಯನ್ನು ವಿವರಿಸಲು ಗಹನ ಪುರಾಣಕಥೆ, ಪವಿತ್ರ ನಾಮಗಳು, ದೀಕ್ಷಾಸ್ನಾನದ ರೂಪಕಗಳು ಮತ್ತು ಸ್ತುತಿಗೀತಾತ್ಮಕ ಪ್ರಶಂಸೆಯನ್ನು ಬಳಸಿದ ಸೇಥೀಯ ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
      date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಅಥವಾ 3ನೇ ಶತಮಾನಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಕ್ರಿ.ಶ. 4ನೇ ಶತಮಾನದ ನಾಗ್ ಹಮ್ಮಾದಿ ಸಂಹಿತೆಗಳಲ್ಲಿ ಎರಡು ಕಾಪ್ಟಿಕ್ ಪ್ರತಿಗಳು ಉಳಿದಿವೆ.
    Letter of Peter to Philip:
      display_name: ಫಿಲಿಪ್ಪನಿಗೆ ಪೇತ್ರನ ಪತ್ರ
      author: ಅನಾಮಧೇಯ. ಆರಂಭದ ಸಂಕ್ಷಿಪ್ತ ಪತ್ರ ಮತ್ತು ಅದರ ನಂತರದ ಪ್ರಕಟಣೆಯನ್ನು ಪೇತ್ರ ಮತ್ತು ಫಿಲಿಪ್ಪರಿಗೆ ಕೃತಕನಾಮದಿಂದ ಆರೋಪಿಸಲಾಗಿದೆ; ಅವರಿಬ್ಬರಲ್ಲಿ ಯಾರೊಬ್ಬರೂ ಇದನ್ನು ಬರೆದರೆಂದು ಖಚಿತಪಡಿಸಲಾಗದು.
      audience: ರಕ್ಷಕ, ವಿರೋಧಿ ಶಕ್ತಿಗಳು, ಯಾತನೆ, ಸುವಾರ್ತಾ ಕಾರ್ಯ ಮತ್ತು ಶಿಷ್ಯರ ಪುನಃಸ್ಥಾಪನೆಯ ಕುರಿತ ಬೋಧನೆಗೆ ಅಪೊಸ್ತಲರ ಅಧಿಕೃತ ಬೆಂಬಲವನ್ನು ಅರಸಿದ ಕ್ರೈಸ್ತರು.
      date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಕೊನೆ ಅಥವಾ 3ನೇ ಶತಮಾನದ ಆರಂಭಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಕ್ರಿ.ಶ. 4ನೇ ಶತಮಾನದ ನಾಗ್ ಹಮ್ಮಾದಿ ಪ್ರತಿಯಲ್ಲೂ, ನಂತರದ ಕಾಪ್ಟಿಕ್ ಪ್ರತಿಯೊಂದರಲ್ಲೂ ಸಂರಕ್ಷಿತವಾಗಿದೆ.
    Gospel of Judas:
      display_name: ಯೂದನ ಸುವಾರ್ತೆ
      author: ಅನಾಮಧೇಯ. ಶೀರ್ಷಿಕೆಯು ಈ ನಿರೂಪಣೆಯನ್ನು ಯೂದನಿಗೆ ಆರೋಪಿಸುತ್ತದೆ; ಆದರೆ ಇಸ್ಕರಿಯೋತ ಯೂದನೇ ಇದರ ಐತಿಹಾಸಿಕ ಲೇಖಕನೆಂದು ಕೃತಿ ಸ್ಥಾಪಿಸುವುದಿಲ್ಲ.
      audience: ಪ್ರಕಟಣಾತ್ಮಕ ಸಂವಾದ ಮತ್ತು ಸೇಥೀಯ ಸ್ವರೂಪದ ವಿಶ್ವಸೃಷ್ಟಿ ತತ್ತ್ವವನ್ನು ಬಳಸಿ ಯೂದನನ್ನೂ ಯೇಸುವಿನ ಮರಣವನ್ನೂ ಮರುವ್ಯಾಖ್ಯಾನಿಸಿದ, ಪ್ರತಿಸ್ಪರ್ಧಿಗಳ ಬಲಿಯರ್ಪಣೆ ಮತ್ತು ಸಭಾ ಪದ್ಧತಿಗಳನ್ನು ಟೀಕಿಸಿದ ಕ್ರೈಸ್ತ ಗುಂಪು.
      date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಮಧ್ಯ ಅಥವಾ ಕೊನೆಯ ಭಾಗಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಸುಮಾರು ಕ್ರಿ.ಶ. 180ರ ವೇಳೆಗೆ ಐರೇನಿಯಸ್‌ಗೆ ‘ಯೂದನ ಸುವಾರ್ತೆ’ಯೊಂದು ತಿಳಿದಿತ್ತು ಮತ್ತು ಉಳಿದಿರುವ ಕಾಪ್ಟಿಕ್ ಪ್ರತಿ ಬಹುಶಃ 3ನೇ ಅಥವಾ 4ನೇ ಶತಮಾನದ್ದಾಗಿದೆ.
    Protoevangelium of James:
      display_name: ಯಾಕೋಬನ ಪ್ರಥಮ ಸುವಾರ್ತೆ
      author: ಅನಾಮಧೇಯ. ನಿರೂಪಕನು ತಾನು ಯಾಕೋಬನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾನೆ; ಆದರೆ ಈ ಕೃತಿ ಕೃತಕನಾಮದ್ದಾಗಿದ್ದು, ಯೇಸುವಿನ ಸಹೋದರ ಯಾಕೋಬನು ಇದನ್ನು ಬರೆದದ್ದಲ್ಲ.
      audience: ಮರಿಯಳ ಜನನ ಮತ್ತು ಬೆಳವಣಿಗೆ, ಆಕೆಯ ನಿರಂತರ ಪರಿಶುದ್ಧತೆ, ಯೇಸುವಿನ ಜನನ, ಹಾಗೂ ಮತ್ತಾಯ ಮತ್ತು ಲೂಕರು ಉತ್ತರಿಸದೆ ಬಿಟ್ಟ ಪ್ರಶ್ನೆಗಳಿಗೆ ಕಥಾರೂಪದ ಉತ್ತರಗಳಲ್ಲಿ ಆಸಕ್ತರಾದ ಕ್ರೈಸ್ತರು.
      date: ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಉತ್ತರಾರ್ಧಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ನಂತರದ ಕಾಲದ ಅನೇಕ ಗ್ರೀಕ್ ಹಸ್ತಪ್ರತಿಗಳಲ್ಲೂ ಪ್ರಾಚೀನ ಅನುವಾದಗಳಲ್ಲೂ ಇದು ಉಳಿದಿದೆ.
  chapter_titles:
    Apocryphon of John:
      '17':
        title: ದೈವಾನುಗ್ರಹವು ಮನಸ್ಸುಗಳನ್ನು ಎಚ್ಚರಿಸುತ್ತದೆ
      '18':
        title: ಆತ್ಮಗಳು ದುಷ್ಟ ಹೋರಾಟಗಳಿಂದ ವಿಮುಖವಾಗುತ್ತವೆ
      '19':
        title: ಕರುಣಾಮಯ ಆತ್ಮನು ಜನರನ್ನು ಎಚ್ಚರಿಸುತ್ತಾನೆ
      '20':
        title: ಆತ್ಮಗಳನ್ನು ರಕ್ಷಿಸಲು ಬೆಳಕು ಇಳಿದುಬರುತ್ತದೆ
      '21':
        title: ರಕ್ಷಕನು ನಿಗೂಢ ಜ್ಞಾನವನ್ನು ಒಪ್ಪಿಸುತ್ತಾನೆ
    Hypostasis of the Archons:
      '1':
        title: ಆತ್ಮನು ವಿಶ್ವಶಕ್ತಿಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತಾನೆ
      '2':
        title: ಧ್ವನಿಯು ಕುರುಡು ಅಧಿಪತಿಯನ್ನು ಬಯಲಿಗೆಳೆಯುತ್ತದೆ
      '3':
        title: ದೈವಿಕ ಬೆಳಕು ಆದಾಮನಿಗೆ ಜೀವ ನೀಡುತ್ತದೆ
      '4':
        title: ಸ್ತ್ರೀಯು ಅಧಿಪತಿಗಳ ಹಿಂಸೆಯಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳುತ್ತಾಳೆ
      '5':
        title: ಸರ್ಪವು ಆಧ್ಯಾತ್ಮಿಕ ಸತ್ಯವನ್ನು ಬೋಧಿಸುತ್ತದೆ
      '6':
        title: ಕಾಯಿನನು ಹೇಬೆಲನನ್ನು ಕೊಲ್ಲುತ್ತಾನೆ; ಸೇತನು ಅವನ ಸ್ಥಾನ ತುಂಬುತ್ತಾನೆ
      '7':
        title: ನೋಹನು ನಾವೆಯನ್ನು ಕಟ್ಟುತ್ತಾನೆ; ಎರಡು ಬಾರಿ ರಕ್ಷಣೆ ಪಡೆಯುತ್ತಾನೆ
      '8':
        title: ನೋರಿಯಾ ಕತ್ತಲೆಯ ಶಕ್ತಿಗಳನ್ನು ಧೈರ್ಯವಾಗಿ ಎದುರಿಸುತ್ತಾಳೆ
      '9':
        title: ಎಲೆಲೆತ್ ನಿಜವಾದ ಮೂಲದ ಕುರಿತು ಭರವಸೆ ನೀಡುತ್ತಾನೆ
      '10':
        title: ಜ್ಞಾನದ ಮಗಳು ಅಧಿಪತಿಗೆ ಮಿತಿ ವಿಧಿಸುತ್ತಾಳೆ
      '11':
        title: ಸಬಾವೋತ್ ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟು ಜ್ಞಾನವನ್ನು ಸ್ತುತಿಸುತ್ತಾನೆ
      '12':
        title: ಪ್ರಕಟಿಸುವವನು ನಿತ್ಯಜೀವವನ್ನು ತರುತ್ತಾನೆ
    On the Origin of the World:
      '1':
        title: ಕತ್ತಲೆಯಿಂದ ಅಸ್ತವ್ಯಸ್ತತೆ ಉದಯಿಸುತ್ತದೆ
      '2':
        title: ಜ್ಞಾನವು ಸ್ವರ್ಗದ ಗಡಿಯನ್ನು ರೂಪಿಸುತ್ತದೆ
      '3':
        title: ಅಧಿಪತಿ ತಾನೊಬ್ಬನೇ ಆಳುವವನೆಂದು ತಪ್ಪಾಗಿ ಭಾವಿಸುತ್ತಾನೆ
      '4':
        title: ಏಳು ಜೀವಿಗಳು ಸ್ವರ್ಗಗಳನ್ನು ಆಳುತ್ತವೆ
      '5':
        title: ಕುರುಡು ದೇವರು ತಾನೊಬ್ಬನೇ ಅಸ್ತಿತ್ವದಲ್ಲಿದ್ದೇನೆಂದು ಹೇಳಿಕೊಳ್ಳುತ್ತಾನೆ
      '6':
        title: ಸಬಾವೋತ್ ತನ್ನ ಪೋಷಕರ ಕತ್ತಲೆಯನ್ನು ತಿರಸ್ಕರಿಸುತ್ತಾನೆ
      '7':
        title: ಸ್ವರ್ಗೀಯ ಅಧಿಪತಿ ಪ್ರತಿರೂಪಗಳನ್ನು ಸೃಷ್ಟಿಸುತ್ತಾನೆ
      '8':
