payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: ಫಿಲಿಪ್ಪಿಯರಿಗೆ ಪಾಲಿಕಾರ್ಪನ ಪತ್ರ
      author: ಸ್ಮುರ್ನದ ಬಿಷಪ್ ಪಾಲಿಕಾರ್ಪ. ನಮಗೆ ದೊರೆತಿರುವ ಪಠ್ಯವು ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ಸಂದರ್ಭಗಳಲ್ಲಿ ಕಳುಹಿಸಲಾದ ವಿಷಯಗಳನ್ನು ಒಟ್ಟುಗೂಡಿಸಿದೆ ಎಂದು ಕೆಲವು ವಿದ್ವಾಂಸರು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುತ್ತಾರೆ.
      audience: ಇಗ್ನೇಷಿಯನ ಪತ್ರಗಳನ್ನು ಕೇಳಿದ್ದ ಮತ್ತು ನಂಬಿಕೆ, ನಡತೆ, ನಾಯಕತ್ವ, ಹಣ ಹಾಗೂ ತಾಳ್ಮೆಯ ಕುರಿತು ಸಲಹೆ ಪಡೆದ ಫಿಲಿಪ್ಪಿಯ ಕ್ರೈಸ್ತ ಸಭೆ.
      date: ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಆರಂಭದಿಂದ ಮಧ್ಯಭಾಗದವರೆಗೆ; ಕನಿಷ್ಠ ಒಂದು ಭಾಗವು ಇಗ್ನೇಷಿಯನ ಪ್ರಯಾಣದೊಂದಿಗೆ ನಿಕಟವಾಗಿ ಸಂಬಂಧಿಸಿದೆ. ಇದು ಸಂಯುಕ್ತ ಪತ್ರವೆಂಬ ಅಭಿಪ್ರಾಯಗಳು, ಇದರ ಒಂದು ಭಾಗವು ಸ್ವಲ್ಪ ನಂತರದ್ದಾಗಿರಬಹುದು ಎಂದು ಸೂಚಿಸುತ್ತವೆ.
    Martyrdom of Polycarp:
      display_name: ಪಾಲಿಕಾರ್ಪನ ಹುತಾತ್ಮತೆ
      author: ಸ್ಮುರ್ನದ ಸಭೆಯ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಆ ಸಭೆಯ ಅನಾಮಧೇಯ ಸದಸ್ಯರು; ಕೊನೆಯಲ್ಲಿರುವ ಪಠ್ಯ ಪ್ರಸರಣದ ಟಿಪ್ಪಣಿಗಳು ನಂತರದ ನಕಲು ಮತ್ತು ಪ್ರಸಾರವನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತವೆ.
      audience: ಪಾಲಿಕಾರ್ಪನ ಬಂಧನ, ವಿಚಾರಣೆ, ಮರಣ ಮತ್ತು ಮಾದರಿಯಾದ ತಾಳ್ಮೆಯ ವೃತ್ತಾಂತವನ್ನು ಸ್ವೀಕರಿಸಿದ ಫಿಲೊಮೇಲಿಯದ ಸಭೆ ಹಾಗೂ ವಿಶಾಲ ಕ್ರೈಸ್ತ ಸಮುದಾಯ.
      date: ಪಾಲಿಕಾರ್ಪನ ಮರಣದ ನಂತರ ಬರೆಯಲ್ಪಟ್ಟಿದ್ದು, ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಮಧ್ಯಭಾಗ ಅಥವಾ ಉತ್ತರಾರ್ಧಕ್ಕೆ ಸೇರಿದ್ದೆಂದು ಪರಿಗಣಿಸಲಾಗುತ್ತದೆ; ಹುತಾತ್ಮತೆಯ ನಿಖರ ವರ್ಷ ಮತ್ತು ಈ ದಾಖಲೆಯ ಅಂತಿಮ ರೂಪ—ಎರಡೂ ಚರ್ಚಾಸ್ಪದವಾಗಿವೆ.
    Epistle to Diognetus:
      display_name: ಡಿಯೊಗ್ನೇಟಸ್‌ಗೆ ಪತ್ರ
      author: ಅನಾಮಧೇಯ. ಲೇಖಕನು ತನ್ನನ್ನು ಶಿಷ್ಯ ಅಥವಾ ಕಲಿಯುವವನು ಎಂದು ಕರೆದುಕೊಳ್ಳುತ್ತಾನೆ; ಆದರೆ ಅವನನ್ನಾಗಲಿ, ಪತ್ರವನ್ನು ಉದ್ದೇಶಿಸಿ ಬರೆಯಲಾದ ಡಿಯೊಗ್ನೇಟಸ್‌ನನ್ನಾಗಲಿ ಖಚಿತವಾಗಿ ಗುರುತಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ.
      audience: ಕ್ರೈಸ್ತ ಆರಾಧನೆ, ನೈತಿಕತೆ, ಸಾಮಾಜಿಕ ಗುರುತು, ಪ್ರೀತಿ ಮತ್ತು ಈ ನಂಬಿಕೆ ಹೊಸದಾಗಿ ಕಾಣುವುದರ ಕುರಿತು ಪ್ರಶ್ನಿಸುವ ವಿದ್ಯಾವಂತ ಕ್ರೈಸ್ತೇತರ ಅನ್ವೇಷಕ—ಹಾಗೂ ಅವನಂತಹ ಓದುಗರು.
      date: ಇದನ್ನು ಅನೇಕವೇಳೆ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಕೊನೆ ಅಥವಾ 3ನೇ ಶತಮಾನದ ಆರಂಭಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಆದರೆ ಪ್ರಸ್ತಾಪಿತ ಕಾಲಗಳು ಬಹಳವಾಗಿ ಬದಲಾಗುತ್ತವೆ. ಕೊನೆಯ ಎರಡು ಅಧ್ಯಾಯಗಳು ಬೇರೆ ಕೃತಿಯಿಂದ ಬಂದಿರಬಹುದು.
    Fragments of Papias:
      display_name: ಪಾಪಿಯಸ್‌ನ ತುಣುಕುಗಳು
      author: ಕಳೆದುಹೋಗಿರುವ ಐದು ಸಂಪುಟಗಳ ‘ಕರ್ತನ ವಾಕ್ಯಗಳ ವಿವರಣೆಗಳು’ ಕೃತಿಯ ಲೇಖಕ ಹಿಯೆರಾಪೊಲಿಸ್‌ನ ಬಿಷಪ್ ಪಾಪಿಯಸ್; ಉಳಿದುಕೊಂಡಿರುವ ಸಂಗ್ರಹವು ನಂತರದ ಲೇಖಕರು ಸಂರಕ್ಷಿಸಿದ ಉಲ್ಲೇಖಗಳು ಮತ್ತು ವರದಿಗಳನ್ನು ಒಳಗೊಂಡಿದೆ.
      audience: ಹೆಸರು ಸೂಚಿಸಲಾದ ಮೌಖಿಕ ಸಾಕ್ಷ್ಯಗಳ ಮತ್ತು ವ್ಯಾಖ್ಯಾನಗಳ ಸರಪಳಿಗಳ ಮೂಲಕ ಸಂಗ್ರಹಿಸಲಾದ ಯೇಸು ಮತ್ತು ಅಪೊಸ್ತಲರ ಕುರಿತ ನೆನಪಿನ ಬೋಧನೆಗಳನ್ನು ಅರಸಿದ ಆರಂಭಿಕ ಕ್ರೈಸ್ತರು.
      date: ಪಾಪಿಯಸ್‌ನ ಕೃತಿಯನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಕ್ರಿ.ಶ. 2ನೇ ಶತಮಾನದ ಆರಂಭಕ್ಕೆ, ಅನೇಕವೇಳೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 110–130ಕ್ಕೆ ಸೇರಿಸಲಾಗುತ್ತದೆ; ಉಳಿದಿರುವ ತುಣುಕುಗಳು 2ನೇ ಶತಮಾನದಿಂದ ಮುಂದಿನ ಕಾಲದ ಲೇಖಕರ ಕೃತಿಗಳಲ್ಲಿ ಕಂಡುಬರುತ್ತವೆ.
  chapter_titles:
    Letters of Ignatius:
      '90':
        title: ಇಗ್ನೇಷಿಯನು ಬಿಷಪ್ ಪಾಲಿಕಾರ್ಪನಿಗೆ ಬರೆಯುತ್ತಾನೆ
      '91':
        title: ಸ್ಥಿರವಾದ ಸೇವೆಗೆ ಇಗ್ನೇಷಿಯನ ಪ್ರೋತ್ಸಾಹ
      '92':
        title: ಜ್ಞಾನದಿಂದ ಹಾನಿಯನ್ನು ಸರಿಪಡಿಸಿ
      '93':
        title: ಬಡಿಗಲ್ಲಿನಂತೆ ದೃಢವಾಗಿ ನಿಲ್ಲಿ
      '94':
        title: ದೇವರ ಸಮ್ಮತಿಯೊಂದಿಗೆ ವಿಧವೆಯರನ್ನು ಕಾಪಾಡಿ
      '95':
        title: ಕೆಟ್ಟ ಆಚರಣೆಗಳನ್ನು ತೊರೆದು ವಿವೇಕದಿಂದ ಮದುವೆಯಾಗಿ
      '96':
        title: ವಿಧೇಯರಾಗಿ, ಸೇವೆಮಾಡಿ, ಒಟ್ಟಾಗಿ ಮೇಲೇಳಿ
      '97':
        title: ಪಾಲಿಕಾರ್ಪನು ಸಿರಿಯಾಕ್ಕೆ ಪ್ರತಿನಿಧಿಯನ್ನು ಕಳುಹಿಸುತ್ತಾನೆ
      '98':
        title: ಗೌರವಯುತ ಕಾರ್ಯಗಳಿಗಾಗಿ ಸಂದೇಶವಾಹಕರನ್ನು ಏರ್ಪಡಿಸಿ
    Polycarp to the Philippians:
      '1':
        title: ಫಿಲಿಪ್ಪಿಯರಿಗೆ ಪಾಲಿಕಾರ್ಪನ ವಂದನೆ
      '2':
        title: ಪಾಪಿಗಳಿಗಾಗಿ ಕ್ರಿಸ್ತನು ಕಷ್ಟ ಅನುಭವಿಸಿದನು
      '3':
        title: ಭಯಭಕ್ತಿಯಿಂದಲೂ ಸತ್ಯದಿಂದಲೂ ದೇವರ ಸೇವೆಮಾಡಿ
      '4':
        title: ನೀತಿಯ ಕುರಿತು ಪಾಲಿಕಾರ್ಪನು ಬರೆಯುತ್ತಾನೆ
      '5':
        title: ವಿಧವೆಯರು ಸತ್ಯನಿಷ್ಠೆಯಿಂದ ನಿರಂತರವಾಗಿ ಪ್ರಾರ್ಥಿಸಲಿ
      '6':
        title: ಸಭಾಸೇವಕರು ಈಗ ನಿರ್ದೋಷವಾಗಿ ಕ್ರಿಸ್ತನ ಸೇವೆಮಾಡಲಿ
      '7':
        title: ಹಿರಿಯರು ಎಲ್ಲರಿಗೂ ಕರುಣೆ ತೋರಿಸಲಿ
      '8':
        title: ಕ್ರಿಸ್ತವಿರೋಧಿಯನ್ನೂ ಸುಳ್ಳು ಬೋಧನೆಗಳನ್ನೂ ತಿರಸ್ಕರಿಸಿ
      '9':
        title: ನಿರೀಕ್ಷೆಯನ್ನು ಹಿಡಿದುಕೊಂಡು ಕ್ರಿಸ್ತನನ್ನು ಹಿಂಬಾಲಿಸಿ
      '10':
        title: ನಂಬಿಗಸ್ತ ಪವಿತ್ರರ ಮಾದರಿಗಳನ್ನು ಅನುಸರಿಸಿ
      '11':
        title: ದೃಢವಾಗಿ ನಿಂತು ಪ್ರೀತಿಯನ್ನು ಅನುಸರಿಸಿ
      '12':
        title: ದುರಾಶೆಯನ್ನೂ ವಿಗ್ರಹಾರಾಧನೆಯನ್ನೂ ಈಗಲೇ ತಿರಸ್ಕರಿಸಿ
      '13':
        title: ಫಿಲಿಪ್ಪಿಯರ ನಂಬಿಕೆಗಾಗಿ ಪಾಲಿಕಾರ್ಪನ ಪ್ರಾರ್ಥನೆ
      '14':
        title: ಸಿರಿಯಾಕ್ಕೆ ಕಳುಹಿಸಿದ ಪತ್ರಗಳಿಗಾಗಿ ನಿರೀಕ್ಷೆ
      '15':
        title: ಕ್ರೆಸೆನ್ಸ್ ನಿರ್ದೋಷವಾಗಿ ಪತ್ರವನ್ನು ತಲುಪಿಸುತ್ತಾನೆ
    Martyrdom of Polycarp:
      '1':
        title: ಸಭೆಯು ಎಲ್ಲರಿಗೂ ಕರುಣೆಯನ್ನು ಕಳುಹಿಸುತ್ತದೆ
      '2':
        title: ಪಾಲಿಕಾರ್ಪನ ಹುತಾತ್ಮತೆಗೆ ಮುದ್ರೆ ಬೀಳುತ್ತದೆ
      '3':
        title: ಹುತಾತ್ಮರು ಕ್ರಿಸ್ತನಿಗಾಗಿ ತಾಳಿಕೊಳ್ಳುತ್ತಾರೆ
      '4':
        title: ಜೆರ್ಮಾನಿಕಸ್ ಕಾಡುಮೃಗಗಳನ್ನು ಎದುರಿಸುತ್ತಾನೆ
      '5':
        title: ಕ್ವಿಂಟಸ್ ಧೈರ್ಯ ಕಳೆದುಕೊಳ್ಳುತ್ತಾನೆ
      '6':
        title: ಪಾಲಿಕಾರ್ಪನು ಎಲ್ಲರಿಗಾಗಿ ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '7':
        title: ತನ್ನ ಮನೆಯವರಿಂದಲೇ ದ್ರೋಹಕ್ಕೊಳಗಾದನು
      '8':
        title: ಪಾಲಿಕಾರ್ಪನು ತನ್ನ ಗತಿಯನ್ನು ಸ್ವಾಗತಿಸುತ್ತಾನೆ
      '9':
        title: ಕ್ರಿಸ್ತನನ್ನು ನಿರಾಕರಿಸಲು ಹೆರೋದನು ಪಾಲಿಕಾರ್ಪನನ್ನು ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '10':
        title: ಸ್ವರ್ಗೀಯ ಧ್ವನಿ ಪಾಲಿಕಾರ್ಪನನ್ನು ಬಲಪಡಿಸುತ್ತದೆ
      '11':
        title: ಕ್ರಿಸ್ತನನ್ನು ದೂಷಿಸಲು ಪಾಲಿಕಾರ್ಪನು ನಿರಾಕರಿಸುತ್ತಾನೆ
      '12':
        title: ಮರಣದ ಬೆದರಿಕೆಗಳನ್ನು ಪಾಲಿಕಾರ್ಪನು ಲೇವಡಿ ಮಾಡುತ್ತಾನೆ
      '13':
        title: ಪಾಲಿಕಾರ್ಪನನ್ನು ಸುಡಬೇಕೆಂದು ಜನಸಮೂಹ ಒತ್ತಾಯಿಸುತ್ತದೆ
      '14':
        title: ಕಂಬಕ್ಕೆ ಕಟ್ಟಲ್ಪಟ್ಟ ಪಾಲಿಕಾರ್ಪನು ಪ್ರಾರ್ಥಿಸುತ್ತಾನೆ
      '15':
        title: ಕಂಬದ ಬಳಿ ಪಾಲಿಕಾರ್ಪನ ಪ್ರಾರ್ಥನೆ
      '16':
        title: ಜ್ವಾಲೆಗಳು ಪಾಲಿಕಾರ್ಪನನ್ನು ಸುತ್ತುವರಿಯುತ್ತವೆ
      '17':
        title: ಪಾಲಿಕಾರ್ಪನ ರಕ್ತವು ಬೆಂಕಿಯನ್ನು ಆರಿಸುತ್ತದೆ
      '18':
        title: ನಿರಾಕರಿಸುವಂತೆ ನ್ಯಾಯಾಧಿಕಾರಿಯನ್ನು ನಿಕೇಟಸ್ ಒತ್ತಾಯಿಸುತ್ತಾನೆ
      '19':
        title: ಕ್ರೈಸ್ತರು ಪಾಲಿಕಾರ್ಪನ ಎಲುಬುಗಳನ್ನು ಸಂಗ್ರಹಿಸುತ್ತಾರೆ
      '20':
        title: ಆಡಳಿತಗಾರನನ್ನು ಜಯಿಸಿ ಪಾಲಿಕಾರ್ಪನು ಕಿರೀಟ ಪಡೆಯುತ್ತಾನೆ
      '21':
        title: ಮಾರ್ಸಿಯಾನಸ್ ವಿಶ್ವಾಸಿಗಳಿಗೆ ಸಾರಾಂಶ ಕಳುಹಿಸುತ್ತಾನೆ
      '22':
        title: ಸಬ್ಬತ್ ದಿನ ಪಾಲಿಕಾರ್ಪನು ಹುತಾತ್ಮನಾದನು
      '23':
        title: ರಾಜ್ಯದೊಳಗೆ ಪಾಲಿಕಾರ್ಪನನ್ನು ಅನುಸರಿಸಿ
    Epistle to Diognetus:
      '1':
        title: ಡಿಯೊಗ್ನೇಟಸ್ ನಂಬಿಕೆಯನ್ನು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಬಯಸುತ್ತಾನೆ
      '2':
        title: ಮಾನವರ ಕೈಗಳಿಂದ ರೂಪಿಸಲಾದ ವಿಗ್ರಹಗಳು
      '3':
        title: ಕ್ರೈಸ್ತರು ಸುಳ್ಳು ಆರಾಧನೆಯನ್ನು ತಿರಸ್ಕರಿಸುತ್ತಾರೆ
