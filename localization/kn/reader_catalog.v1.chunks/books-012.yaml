payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 ಕೊರಿಂಥದವರಿಗೆ
      author: ಪೌಲನು, ಸೊಸ್ತೆನನೊಂದಿಗೆ.
      audience: ಒಳಜಗಳಗಳಿಂದ ಕಂಗೆಟ್ಟಿದ್ದ ಕೊರಿಂಥದ ಕ್ರೈಸ್ತ ಸಭೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 53–55; ಎಫೆಸದಿಂದ ಬರೆದದ್ದು.
    2 Corinthians:
      display_name: 2 ಕೊರಿಂಥದವರಿಗೆ
      author: ಪೌಲನು, ತಿಮೊಥೆಯನೊಂದಿಗೆ.
      audience: ನೋವುಂಟುಮಾಡಿದ ಸಂಘರ್ಷದ ನಂತರದ ಕೊರಿಂಥದ ಸಭೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 55–56.
    Galatians:
      display_name: ಗಲಾತ್ಯದವರಿಗೆ
      author: ಪೌಲನು.
      audience: ಸುನ್ನತಿ ಮಾಡಿಸಿಕೊಳ್ಳುವಂತೆಯೂ ತೋರಾ ನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವಂತೆಯೂ ಒತ್ತಡಕ್ಕೆ ಒಳಗಾಗಿದ್ದ ಗಲಾತ್ಯದ (ಮಧ್ಯ ಅನಾತೋಲಿಯಾದ) ಕ್ರೈಸ್ತ ಸಭೆಗಳು.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 48–55 (ವಿವಾದಿತ).
    Ephesians:
      display_name: ಎಫೆಸದವರಿಗೆ
      author: ಪೌಲನು, ಅಥವಾ ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಅವನ ಆಪ್ತ ಶಿಷ್ಯನೊಬ್ಬ (ವಿವಾದಿತ).
      audience: ಏಷ್ಯಾ ಪ್ರಾಂತ್ಯದ ಕ್ರೈಸ್ತರನ್ನು ಸಾಮಾನ್ಯವಾಗಿ ಉದ್ದೇಶಿಸಿದ ಓದುಗವರ್ಗ; ಅತ್ಯಂತ ಪ್ರಾಚೀನ ಹಸ್ತಪ್ರತಿಗಳಲ್ಲಿ "ಎಫೆಸ" ಎಂಬ ಸ್ಥಳನಾಮ ಇಲ್ಲ.
      date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 60ರ ದಶಕ; ಬೇರೊಬ್ಬರು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 80–90ರ ದಶಕ.
    Philippians:
      display_name: ಫಿಲಿಪ್ಪಿಯವರಿಗೆ
      author: ಪೌಲನು, ತಿಮೊಥೆಯನೊಂದಿಗೆ.
      audience: ಮಕೆದೋನ್ಯದಲ್ಲಿದ್ದ ರೋಮನ್ ವಸಾಹತು ಫಿಲಿಪ್ಪಿಯ ಕ್ರೈಸ್ತ ಸಭೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 60–62; ಸೆರೆಮನೆಯಿಂದ ಬರೆದದ್ದು.
    Colossians:
      display_name: ಕೊಲೊಸ್ಸೆಯವರಿಗೆ
      author: ಪೌಲನು, ತಿಮೊಥೆಯನೊಂದಿಗೆ — ಅಥವಾ ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಅವನ ಆಪ್ತ ಶಿಷ್ಯನೊಬ್ಬ (ವಿವಾದಿತ).
      audience: ಲೈಕಸ್ ಕಣಿವೆಯ ಕೊಲೊಸ್ಸೆಯಲ್ಲಿದ್ದು, ವಿವಿಧ ಧಾರ್ಮಿಕ ಕಲ್ಪನೆಗಳನ್ನು ಬೆರೆಸಿದ ಬೋಧನೆಯನ್ನು ಎದುರಿಸುತ್ತಿದ್ದ ಕ್ರೈಸ್ತರು.
      date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 60–62; ಬೇರೊಬ್ಬರು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದರೆ ಅದಕ್ಕಿಂತ ನಂತರ.
    1 Thessalonians:
      display_name: 1 ಥೆಸಲೋನಿಕದವರಿಗೆ
      author: ಪೌಲನು, ಸಿಲ್ವಾನ ಮತ್ತು ತಿಮೊಥೆಯನೊಂದಿಗೆ.
      audience: ಹಿಂಸೆಯನ್ನು ಎದುರಿಸುತ್ತಿದ್ದ ಥೆಸಲೋನಿಕದ ಹೊಸ ಕ್ರೈಸ್ತ ಸಭೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 50–51 — ಉಳಿದುಕೊಂಡಿರುವ ಪೌಲನ ಪತ್ರಗಳಲ್ಲಿ ಬಹುಶಃ ಅತ್ಯಂತ ಪ್ರಾಚೀನವಾದದ್ದು.
    2 Thessalonians:
      display_name: 2 ಥೆಸಲೋನಿಕದವರಿಗೆ
      author: ಪೌಲನು (ವಿವಾದಿತ; ಕೆಲವು ವಿದ್ವಾಂಸರ ಪ್ರಕಾರ ಬೇರೊಬ್ಬರು ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದದ್ದು).
      audience: ಅಂತ್ಯಕಾಲದ ಕುರಿತ ಗೊಂದಲವನ್ನು ಪರಿಹರಿಸಲು ಉದ್ದೇಶಿಸಿದ ಥೆಸಲೋನಿಕದ ಸಭೆ.
      date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 51.
    1 Timothy:
      display_name: 1 ತಿಮೊಥೆಯನಿಗೆ
      author: ಪೌಲನು, ಅಥವಾ ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಶಿಷ್ಯನೊಬ್ಬ (ಪಾಸ್ಟರಲ್ ಪತ್ರಗಳನ್ನು ಬೇರೆಯವರು ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದಾರೆ ಎಂಬ ಅಭಿಪ್ರಾಯ ವ್ಯಾಪಕವಾಗಿದೆ).
      audience: ಎಫೆಸದಲ್ಲಿ ಪೌಲನ ಪ್ರತಿನಿಧಿಯಾಗಿದ್ದ ತಿಮೊಥೆಯನು; ನಂತರದ ಸಭಾ ವ್ಯವಸ್ಥೆಗೆ ಮಾರ್ಗದರ್ಶಕ ಕೈಪಿಡಿ.
      date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 60ರ ದಶಕದ ಮಧ್ಯಭಾಗ; ಬೇರೊಬ್ಬರು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 90–110.
    2 Timothy:
      display_name: 2 ತಿಮೊಥೆಯನಿಗೆ
      author: ಪೌಲನು, ಅಥವಾ ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಶಿಷ್ಯನೊಬ್ಬ.
      audience: ತಿಮೊಥೆಯನು — ಸೆರೆಮನೆಯಿಂದ ಪೌಲನು ಹೇಳಿದ ವಿದಾಯದ ಮಾತುಗಳ ರೂಪದಲ್ಲಿ ನಿರೂಪಿಸಲಾಗಿದೆ.
      date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 60ರ ದಶಕದ ಮಧ್ಯಭಾಗ; ಬೇರೊಬ್ಬರು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 90–110.
    Titus:
      display_name: ತೀತನಿಗೆ
      author: ಪೌಲನು, ಅಥವಾ ಪೌಲನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದ ಶಿಷ್ಯನೊಬ್ಬ.
      audience: ಕ್ರೇತೆಯಲ್ಲಿ ಪೌಲನ ಪ್ರತಿನಿಧಿಯಾಗಿದ್ದ ತೀತನು.
      date: ಪೌಲನೇ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 60ರ ದಶಕದ ಮಧ್ಯಭಾಗ; ಬೇರೊಬ್ಬರು ಅವನ ಹೆಸರಿನಲ್ಲಿ ಬರೆದಿದ್ದರೆ ಸುಮಾರು ಕ್ರಿ.ಶ. 90–110.
    Philemon:
      display_name: ಫಿಲೆಮೋನನಿಗೆ
      author: ಪೌಲನು, ತಿಮೊಥೆಯನೊಂದಿಗೆ.
      audience: ತಪ್ಪಿಸಿಕೊಂಡು ಹೋದ ತನ್ನ ದಾಸ ಒನೇಸಿಮನ ವಿಷಯವಾಗಿ, ದಾಸರನ್ನು ಹೊಂದಿದ್ದ ಕ್ರೈಸ್ತನಾದ ಫಿಲೆಮೋನನಿಗೆ.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 60–62.
    Hebrews:
      display_name: ಇಬ್ರಿಯರಿಗೆ
      author: ಅಜ್ಞಾತ. ಸಂಪ್ರದಾಯವು ಪೌಲ, ಅಪೊಲ್ಲೋಸ, ಬಾರ್ನಬ, ಪ್ರಿಸ್ಕಿಲ್ಲ ಮತ್ತು ಇತರರ ಹೆಸರುಗಳನ್ನು ಸೂಚಿಸಿದೆ; ಯಾವುದೇ ಪ್ರಸ್ತಾವನೆಯ ಕುರಿತು ಒಮ್ಮತವಿಲ್ಲ.
      audience: ತಮ್ಮ ಕ್ರೈಸ್ತ ನಂಬಿಕೆಯ ಘೋಷಣೆಯಿಂದ ಹಿಂದೆ ಸರಿಯುವ ಪ್ರಲೋಭನೆಗೆ ಒಳಗಾಗಿದ್ದ ಗ್ರೀಕ್ ಭಾಷಿಕ ಯೆಹೂದಿ ಕ್ರೈಸ್ತರು.
      date: ಸುಮಾರು ಕ್ರಿ.ಶ. 60–95.
  chapter_titles:
    Romans:
      '11':
        title: ಕೃಪೆಯಿಂದ ಅನ್ಯಜನರ ಕರೆಯುವಿಕೆ
      '12':
        title: ಜೀವನಗಳನ್ನೇ ಸಜೀವ ಯಜ್ಞವಾಗಿ ಅರ್ಪಿಸಿರಿ
      '13':
        title: ಅಧಿಕಾರಿಗಳಿಗೆ ಅಧೀನರಾಗಿ, ಪ್ರೀತಿಸಿರಿ
      '14':
        title: ನಂಬಿಕೆಯಲ್ಲಿ ದುರ್ಬಲರನ್ನು ಸ್ವಾಗತಿಸುವುದು
      '15':
        title: ಯೆಹೂದ್ಯರನ್ನೂ ಅನ್ಯಜನರನ್ನೂ ಒಂದಾಗಿಸಿರಿ
      '16':
        title: ವಂದನೆಗಳು ಮತ್ತು ಎಚ್ಚರಿಕೆಗಳು
    1 Corinthians:
      '1':
        title: ಎಲ್ಲರಿಗೂ ದೇವರ ನಂಬಿಗಸ್ತ ಸಮೃದ್ಧಿ
      '2':
        title: ದೇವರ ಆತ್ಮನಿಂದ ಪ್ರಕಟವಾದ ಜ್ಞಾನ
      '3':
        title: ಕೊರಿಂಥದವರು ದೇವರ ದೇವಾಲಯವೆಂಬ ಕುರಿತು ಪೌಲನ ಎಚ್ಚರಿಕೆ
      '4':
        title: ಹೆಮ್ಮೆಯಿಗಿಂತ ನಂಬಿಗಸ್ತಿಕೆಯೇ ಮುಖ್ಯ
      '5':
        title: ಸಭೆಯಲ್ಲಿ ಶಿಸ್ತು ಪಾಲಿಸಲು ಪೌಲನ ಆಜ್ಞೆ
      '6':
        title: ಸಭೆಯೊಳಗೇ ವಿವಾದಗಳನ್ನು ಬಗೆಹರಿಸಿರಿ
      '7':
        title: ವಿವಾಹವನ್ನು ಗೌರವಿಸಲು ಪೌಲನ ಬೋಧನೆ
      '8':
        title: ವೈಯಕ್ತಿಕ ಸ್ವಾತಂತ್ರ್ಯಕ್ಕಿಂತ ಪ್ರೀತಿಯೇ ಮೇಲು
      '9':
        title: ಪೌಲನು ತನ್ನ ಅಪೊಸ್ತಲತ್ವವನ್ನು ಸ್ವತಂತ್ರವಾಗಿ ಸಮರ್ಥಿಸುತ್ತಾನೆ
      '10':
        title: ದೇವಜನರಿಗೆ ಇಸ್ರಾಯೇಲಿನ ಎಚ್ಚರಿಕೆ
      '11':
        title: ಆರಾಧನೆಯಲ್ಲಿನ ಏಕತೆ ಕ್ರಿಸ್ತನನ್ನು ಗೌರವಿಸುತ್ತದೆ
      '12':
        title: ಆತ್ಮನ ವರಗಳು ಸಭೆಯ ಏಕತೆಯನ್ನು ಬೆಳೆಸುತ್ತವೆ
      '13':
        title: ಪ್ರೀತಿ ಎಂದಿಗೂ ಕೈಬಿಡುವುದಿಲ್ಲ
      '14':
        title: ಪ್ರಭಾವ ಬೀರುವುದಕ್ಕಿಂತ ಪ್ರೀತಿಗೆ ಆದ್ಯತೆ ಕೊಡಲು ಪೌಲನ ಒತ್ತಾಯ
      '15':
        title: ಕ್ರಿಸ್ತನು ಎದ್ದಿದ್ದಾನೆ, ಮರಣವು ಸೋತಿದೆ
      '16':
        title: ಕಾಣಿಕೆಗಳು ಮತ್ತು ಪ್ರಯಾಣದ ಯೋಜನೆಗಳು
    2 Corinthians:
      '1':
        title: ಸಂಕಟದಲ್ಲಿ ದೇವರ ಸಾಂತ್ವನ
      '2':
        title: ಪ್ರೀತಿ ಮತ್ತು ಕ್ಷಮೆಗೆ ಕರೆ
      '3':
        title: ಬದಲಾದ ಜೀವನಗಳಿಂದ ದೃಢಪಟ್ಟ ಸೇವೆ
      '4':
        title: ಕ್ರಿಸ್ತನ ಮಹಿಮೆಯ ಘೋಷಣೆ
      '5':
        title: ಕ್ರಿಸ್ತನ ಪ್ರೀತಿ ಸೇವೆಗೆ ಪ್ರೇರೇಪಿಸುತ್ತದೆ
      '6':
        title: ದೇವರಿಗಾಗಿ ಸಂಕಟವನ್ನು ಸಹಿಸಿರಿ
      '7':
        title: ಭಯಭಕ್ತಿಯಿಂದ ಪವಿತ್ರತೆಯನ್ನು ಬೆನ್ನಟ್ಟಿರಿ
      '8':
        title: ಮಕೆದೋನ್ಯರ ಕೃಪೆ ದಾನಕ್ಕೆ ಪ್ರೇರಣೆ
      '9':
        title: ಪವಿತ್ರ ಜನರಿಗಾಗಿ ಸಂತೋಷದಿಂದ ಕೊಡಿರಿ
      '10':
        title: ಕ್ರಿಸ್ತನ ಸೌಮ್ಯತೆಯ ಭರವಸೆ
      '11':
        title: ನಂಬಿಗಸ್ತ ಜೀವನಕ್ಕಾಗಿ ಅಸೂಯೆ
      '12':
        title: ದುರ್ಬಲತೆ ಮತ್ತು ಕೃಪೆಯಲ್ಲಿ ಹೆಮ್ಮೆಪಡಿರಿ
      '13':
        title: ಪಾಪವಿದೆಯೇ ಎಂದು ನಮ್ಮನ್ನೇ ಪರೀಕ್ಷಿಸಿಕೊಳ್ಳೋಣ
    Galatians:
      '1':
        title: ಪೌಲನು ತನ್ನ ಸುವಾರ್ತೆಯನ್ನು ಸಮರ್ಥಿಸುತ್ತಾನೆ
      '2':
        title: ಪೇತ್ರನ ತಪ್ಪನ್ನು ಪೌಲನು ಎದುರಿಸುತ್ತಾನೆ
      '3':
        title: ಅಬ್ರಹಾಮನ ನಂಬಿಕೆ ನೀತಿವಂತನನ್ನಾಗಿಸುತ್ತದೆ
      '4':
        title: ಕ್ರಿಸ್ತನು ನಮ್ಮನ್ನು ಧರ್ಮಶಾಸ್ತ್ರದಿಂದ ಬಿಡುಗಡೆ ಮಾಡುತ್ತಾನೆ
      '5':
        title: ಧರ್ಮಶಾಸ್ತ್ರದಿಂದಲ್ಲ, ನಂಬಿಕೆಯಿಂದ ಜೀವಿಸಿರಿ
      '6':
        title: ಒಬ್ಬರ ಭಾರವನ್ನು ಮತ್ತೊಬ್ಬರು ಹೊರಿರಿ
    Ephesians:
      '1':
        title: ವಿಶ್ವಾಸಿಗಳಲ್ಲಿ ಮುದ್ರೆಯಾದ ದೇವರ ಕೃಪೆ
      '2':
