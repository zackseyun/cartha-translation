book_localizations:
- source_title: Genesis
  title: उत्पत्ति
  author: लेखक अज्ञात है; परंपरागत रूप से इसका लेखन मूसा से जोड़ा जाता है। आधुनिक विद्वानों के अनुसार इसकी रचना का इतिहास लंबा रहा है और विभिन्न स्रोतों को बाद में संपादित करके एक साथ जोड़ा गया।
  audience: इस्राएल अपनी वाचागत पहचान में; यह पुस्तक परमेश्वर की सृष्टि, चुनाव और प्रतिज्ञा में लोगों की उत्पत्ति की कथा को आधार देती है।
  date: कई शताब्दियों के दौरान रची गई; बेबीलोन की बंधुआई के समय या उसके बाद, लगभग छठी–पाँचवीं शताब्दी ईसा पूर्व में, इसे वह रूप मिला जो आज प्राप्त है।
  summary: उत्पत्ति सृष्टि, मानवता के विद्रोह और तितर-बितर होने, तथा अब्राहम, इसहाक, याकूब और यूसुफ के परिवार की कथा बताती है, जिनके द्वारा इस्राएल के लिए परमेश्वर की वाचा की प्रतिज्ञाएँ आरंभ होती हैं।
- source_title: John
  title: यूहन्ना के अनुसार सुसमाचार
  author: लेखक अज्ञात है; परंपरा इसका लेखन प्रेरित यूहन्ना या “प्रिय शिष्य” से जोड़ती है।
  audience: आराधनालय-आधारित यहूदी धर्म के साथ तनाव में एक मसीही समुदाय, जो प्रिय शिष्य की गवाही के इर्द-गिर्द बना था।
  date: लगभग 90–110 ईस्वी।
  summary: यूहन्ना यीशु को अनन्त वचन के रूप में प्रस्तुत करता है, जो पिता को प्रकट करता है, अपने ऊपर भरोसा करने वालों को जीवन देता है, और अपने चिन्हों, मृत्यु तथा पुनरुत्थान के द्वारा महिमा पाता है।
- source_title: Gospel of Thomas
  title: थोमा का सुसमाचार
  author: लेखक अज्ञात है; आरंभिक पंक्ति इस कथन-संग्रह का श्रेय “दिदुमुस यहूदा थोमा” को देती है। इसका पूरा उपलब्ध पाठ केवल नाग हम्मादी (NHC II,2) से प्राप्त चौथी शताब्दी के एक कॉप्टिक अनुवाद में बचा है; इसके अतिरिक्त ऑक्सिरिंखुस से तीन यूनानी अंश मिले हैं।
  audience: सीरियाई ज्ञान-परंपरा और आरंभिक ज्ञानवादी विचार से प्रभावित मसीही पाठक-वर्ग, जिसका रुझान यीशु के कथनों में निहित गूढ़ आत्म-ज्ञान की ओर था।
  date: यूनानी मूल संभवतः लगभग 50–140 ईस्वी; कॉप्टिक पांडुलिपि लगभग 340 ईस्वी।
  summary: थोमा का सुसमाचार यीशु से जोड़े गए कथनों का संग्रह है। इसमें कोई निरंतर कथा नहीं है और यह बार-बार पाठकों को इन कथनों का अर्थ खोजने के लिए बुलाता है।
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: उत्पत्ति 1:1
  text: जब परमेश्वर ने आकाश और पृथ्वी की सृष्टि करना आरंभ किया[a]—
  translator_note: '[a] परंपरागत अनुवाद इसे एक पूरा वाक्य मानता है: “आरंभ में परमेश्वर ने आकाश और पृथ्वी की सृष्टि की।” इब्रानी भाषा में यह अधिक स्वाभाविक रूप से आगे आने वाली बात की भूमिका बाँधता है, जिसमें मुख्य क्रिया पद 3 में है: “परमेश्वर ने कहा।”'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: सभोपदेशक 1:2
  text: “भाप ही भाप[a],” कोहेलेत[b] कहता है। “सब कुछ भाप है—क्षणभंगुर, पकड़ से बाहर, और अक्सर हमारी अपेक्षा से भिन्न।”
  translator_note: '[a] इब्रानी शब्द ‘हेवेल’ का शाब्दिक अर्थ साँस या भाप है। सभोपदेशक में यह ऐसी चीज़ का वर्णन करता है जो शीघ्र बीत जाती है, जिसे पकड़ा या पूरी तरह समझा नहीं जा सकता, और जो प्रायः लोगों की अपेक्षा से अलग निकलती है। “भाप” इस बिंब को बनाए रखता है और यह दावा नहीं करता कि किसी भी चीज़ का कोई अर्थ नहीं है। अन्य संभव रूप हैं: “साँस,” “मात्र साँस,” या “क्षणभंगुर।” [b] ‘कोहेलेत’ लेखक का इब्रानी नाम या उपाधि है। इसका अनुवाद प्रायः “शिक्षक” या “उपदेशक” किया जाता है, पर सभी संभव अर्थों के लिए स्थान बनाए रखने और किसी एक व्याख्या को प्राथमिकता न देने हेतु यहाँ ‘कोहेलेत’ रखा गया है।'
- source_path: nt/john/001/001.yaml
  reference: यूहन्ना 1:1
  text: आरंभ में[b] वचन पहले से विद्यमान था। वचन परमेश्वर के साथ था, और वचन परमेश्वर था।[a]
  translator_note: '[a] अन्य संभव अनुवाद: “वचन ईश्वरीय था” या “परमेश्वर जैसा था, वैसा ही वचन था।” यूनानी वाक्य-रचना इस बात की पुष्टि करती है कि वचन पूर्णतः परमेश्वर है, और साथ ही पिछले वाक्यांश में वचन को परमेश्वर से अलग भी दर्शाती है। [b] यह आरंभ उत्पत्ति 1:1 की प्रतिध्वनि है और वचन को सृष्टि के आरंभ से जोड़ता है। “पहले से विद्यमान था” यह स्पष्ट करता है कि जब आरंभ हुआ तब वचन अस्तित्व में था; वह उस समय अस्तित्व में नहीं आया। “था” या “विद्यमान था” भी संभव अनुवाद हैं।'
- source_path: nt/romans/003/025.yaml
  reference: रोमियों 3:25
  text: परमेश्वर ने उसे प्रायश्चित-बलिदान[a] के रूप में प्रस्तुत किया, उसके लहू में विश्वास के द्वारा[b]। उसने ऐसा अपनी धार्मिकता[c] दिखाने के लिए किया, क्योंकि उसने पहले किए गए पापों को अनदेखा किया था।
  translator_note: '[a] अन्य संभव अनुवाद: “कोप-शमन का साधन”; या “प्रायश्चित का ढक्कन,” अर्थात वाचा के संदूक का सोने का ढक्कन, जिस पर पुराने नियम में प्रायश्चित का लहू छिड़का जाता था। [b] वाक्यांश का एक और संभव संबंध है: “विश्वास के द्वारा, उसके लहू के माध्यम से।” [c] “न्याय” भी संभव अनुवाद है।'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 पतरस 1:13
  text: इसलिए अपने मन को कार्य के लिए तैयार करो।[a] पूरी तरह सचेत रहो, और अपनी आशा उस अनुग्रह पर पूरी तरह लगाए रखो जो यीशु मसीह के प्रकट होने पर तुम्हारे पास लाया जा रहा है।[b]
  translator_note: '[a] यूनानी में शाब्दिक रूप से कहा गया है, “अपने मन की कमर बाँधो।” इसका बिंब कमर के चारों ओर लंबे वस्त्र समेट लेने का है, ताकि व्यक्ति कार्य करने के लिए तैयार हो जाए। [b] जिस यूनानी शब्द का अनुवाद “पूरी तरह” किया गया है, वह सचेत रहने पर, आशा लगाने पर, या संभवतः दोनों पर लागू हो सकता है। इसलिए शाब्दिक बिंब “अपने मन की कमर बाँधो” भी एक वैकल्पिक रूप है।'
