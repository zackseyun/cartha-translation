    audience: वे आरंभिक मसीही पाठक जो यीशु के दुःखभोग और पुनरुत्थान के विस्तृत वृत्तांत में रुचि रखते थे, संभवतः ऐसे समुदायों में जहाँ पतरस के अधिकार का विशेष महत्त्व था।
    date: सामान्यतः इसे ईस्वी दूसरी शताब्दी का माना जाता है; इसका प्रमुख उपलब्ध यूनानी अंश बहुत बाद की एक पांडुलिपि में मिलता है, जो अख़मीम में पाई गई थी।
