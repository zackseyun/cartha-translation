  Exegesis on the Soul:
    display_name: आत्मा की व्याख्या
    author: लेखक अज्ञात है। लेखक एक मसीही उपदेशक है, जो बाइबिल और यूनानी साहित्य की छवियों को आत्मा के पतन, पश्चात्ताप और पुनर्स्थापना के रूपक के रूप में नए ढंग से पढ़ता है।
    audience: पवित्रशास्त्र और नैतिक उपदेश से परिचित ऐसे मसीही, जिन्हें अव्यवस्थित अभिलाषा छोड़कर पश्चात्ताप करने और दैवीय सत्ता से फिर मिल जाने के लिए बुलाया जा रहा था।
    date: इसे सामान्यतः ईस्वी दूसरी शताब्दी के उत्तरार्ध या तीसरी शताब्दी के आरंभ का माना जाता है; यह यूनानी से किए गए चौथी शताब्दी के कॉप्टिक अनुवाद में संरक्षित है।
