  Gospel of Philip:
    display_name: फिलिप्पुस का सुसमाचार
    author: लेखक अज्ञात। शीर्षक पांडुलिपि के अंतिम लेख में मिलता है, लेकिन रचना फिलिप्पुस को अपना लेखक नहीं बताती। इसकी एकमात्र बची हुई प्रति नाग हम्मादी कोडेक्स II,3 का कॉप्टिक पाठ है।
    audience: वैलेन्टिनीय शैली की संस्कार-संबंधी शिक्षा से परिचित एक आरंभिक मसीही समुदाय, विशेषकर बपतिस्मा, अभिषेक, प्रभुभोज, छुटकारा, पुनरुत्थान और विवाह-कक्ष के बिंबों से।
    date: सामान्यतः इसे दूसरी शताब्दी ईस्वी के उत्तरार्ध या तीसरी शताब्दी के आरंभ का माना जाता है; यह चौथी शताब्दी की एक कॉप्टिक पांडुलिपि में सुरक्षित है, जिसका अनुवाद पहले के किसी यूनानी रूप से हुआ था।
    chapters:
      '1':
        title: मसीह पूर्ण ईश्वरीय परिवार लाता है
      '2':
        title: विश्वास शीत ऋतु में प्रतिज्ञा का बीज बोता है
      '3':
        title: शब्द सच्ची आत्मिक वास्तविकता प्रकट करते हैं
      '4':
        title: मसीह आत्मिक बंधन से छुड़ाता है
      '5':
        title: यीशु सांसारिक पिता को अलग पहचानता है
