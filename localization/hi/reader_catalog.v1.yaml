  1 Timothy:
    display_name: 1 तीमुथियुस
    author: पौलुस, या पौलुस के नाम से लिखने वाला एक शिष्य (पासबानी पत्रियाँ व्यापक रूप से छद्मनाम से लिखी हुई मानी जाती हैं)।
    audience: इफिसुस में पौलुस के प्रतिनिधि के रूप में तीमुथियुस; बाद की कलीसियाई व्यवस्था के लिए मार्गदर्शिका।
    date: यदि पौलुस द्वारा लिखा गया, तो लगभग 60 के दशक के मध्य में; यदि छद्मनाम से लिखा गया, तो लगभग 90–110 ईस्वी।
    chapters:
      '1':
        title: पौलुस तीमुथियुस से ठहरने का आग्रह करते हैं
      '2':
        title: शासकों के लिए प्रार्थना करें और शांतिपूर्वक जिएँ
      '3':
        title: कलीसिया के अगुओं के लिए आवश्यक गुण
      '4':
        title: झूठे शिक्षकों और मिथकों को अस्वीकार करें
      '5':
        title: विधवाओं और प्राचीनों का निष्ठापूर्वक आदर करें
      '6':
        title: पौलुस तीमुथियुस को धन के विषय में सलाह देते हैं
  2 Timothy:
    display_name: 2 तीमुथियुस
    author: पौलुस, या पौलुस के नाम से लिखने वाला एक शिष्य।
    audience: तीमुथियुस—पौलुस की बंदीगृह से विदाई के रूप में प्रस्तुत।
    date: यदि पौलुस द्वारा लिखा गया, तो लगभग 60 के दशक के मध्य में; यदि छद्मनाम से लिखा गया, तो लगभग 90–110 ईस्वी।
    chapters:
      '1':
        title: तीमुथियुस, अनुग्रह में दृढ़ रहो
      '2':
        title: मसीह के लिए दुःख सहो
      '3':
        title: झूठे शिक्षकों से बचने की चेतावनी
      '4':
        title: सबको विश्वासयोग्यता से प्रचार करो
  Titus:
    display_name: तीतुस
    author: पौलुस, या पौलुस के नाम से लिखने वाला एक शिष्य।
    audience: क्रेते में पौलुस के प्रतिनिधि के रूप में तीतुस।
    date: यदि पौलुस द्वारा लिखा गया, तो लगभग 60 के दशक के मध्य में; यदि छद्मनाम से लिखा गया, तो लगभग 90–110 ईस्वी।
    chapters:
      '1':
        title: पौलुस क्रेते में तीतुस को निर्देश देते हैं
      '2':
        title: हर आयु के लोगों को अनुग्रहपूर्ण जीवन सिखाएँ
      '3':
        title: मसीह की बाट जोहते हुए नम्रता से जिएँ
  Philemon:
    display_name: फिलेमोन
    author: पौलुस, तीमुथियुस के साथ।
    audience: मसीही दास-स्वामी फिलेमोन, उसके भागे हुए दास उनेसिमुस के संबंध में।
    date: लगभग 60–62 ईस्वी।
    chapters:
      '1':
        title: पौलुस उनेसिमुस के लिए विनती करते हैं
  Hebrews:
    display_name: इब्रानियों
    author: अज्ञात। परंपरा ने पौलुस, अपुल्लोस, बरनबास, प्रिस्किल्ला और अन्य लोगों के नाम दिए हैं; किसी भी प्रस्ताव पर सर्वसम्मति नहीं है।
    audience: यूनानी-भाषी यहूदी मसीही, जो अपने मसीही अंगीकार से पीछे हटने के लिए ललचाए जा रहे थे।
    date: लगभग 60–95 ईस्वी।
    chapters:
      '1':
        title: परमेश्वर अपने पुत्र के द्वारा बोलते हैं
      '2':
        title: यीशु दुःख सहकर उद्धार करते हैं
      '3':
        title: विश्वासयोग्य यीशु पर दृष्टि लगाए रखें
      '4':
        title: परमेश्वर के प्रतिज्ञात विश्राम में प्रवेश करें
      '5':
        title: मसीह ने सिद्ध बलिदान अर्पित किया
      '6':
        title: आत्मिक परिपक्वता की ओर बढ़ते जाएँ
      '7':
        title: यीशु मलिकिसिदक की रीति पर सदा के लिए याजक हैं
      '8':
        title: यीशु के लहू के द्वारा नई वाचा
      '9':
        title: यीशु सच्चे स्वर्गीय पवित्रस्थान में प्रवेश करते हैं
      '10':
        title: मसीह के लहू के द्वारा निकट आएँ
      '11':
        title: पूर्वजों का विश्वास अटल रहता है
      '12':
        title: यीशु के साथ दुःख सहते रहो
      '13':
        title: प्रेम और भरोसे में जियो
  James:
    display_name: याकूब
    author: परंपरागत रूप से यीशु के भाई याकूब को इसका लेखक माना जाता है; आधुनिक विद्वान इस बात पर बँटे हुए हैं कि यह वास्तव में उन्हीं की रचना है या उनके नाम से लिखी गई है।
    audience: प्रवास में रहने वाली यहूदी-मसीही सभाएँ।
    date: यदि यह वास्तव में याकूब की रचना है, तो लगभग 50–60 के दशक ईस्वी; यदि उनके नाम से लिखी गई है, तो लगभग पहली सदी ईस्वी का उत्तरार्ध।
    chapters:
      '1':
        title: परीक्षाओं में परखा विश्वास अटल रहता है
      '2':
        title: कर्मों के बिना विश्वास मरा हुआ है
      '3':
        title: जीभ पर संयम रखो और बुद्धिमानी से बोलो
      '4':
        title: झगड़े स्वार्थ से उत्पन्न होते हैं
      '5':
        title: धनी अत्याचारियों का न्याय निकट है
  1 Peter:
    display_name: 1 पतरस
    author: परंपरागत रूप से प्रेरित पतरस को इसका लेखक और सिलवानुस को लिपिक माना जाता है; कुछ विद्वान मानते हैं कि यह पतरस के नाम से लिखी गई है।
    audience: रोमी एशिया माइनर के मसीही, जो सामाजिक विरोध का सामना कर रहे थे।
    date: यदि यह पतरस की रचना है, तो लगभग 60 के दशक ईस्वी; यदि उनके नाम से लिखी गई है, तो लगभग 70–90 के दशक ईस्वी।
    chapters:
      '1':
        title: स्वर्गीय विरासत की आशा
      '2':
        title: विश्वासी जीवित पत्थर पर बनाए जाते हैं
      '3':
        title: पत्नियाँ अपने जीवन से मसीह का आदर करें
      '4':
        title: भलाई करने के कारण दुःख सहो
      '5':
        title: प्राचीन उदाहरण देकर विश्वासियों की देखभाल करें
  2 Peter:
    display_name: 2 पतरस
    author: परंपरागत रूप से पतरस को इसका लेखक माना जाता है; आधुनिक विद्वानों में व्यापक मान्यता है कि यह उनके नाम से लिखी गई है।
    audience: वे मसीही जो प्रभु के पुनरागमन को नकारने वाले उपहास करने वालों का सामना कर रहे थे।
    date: लगभग दूसरी सदी ईस्वी का आरंभ।
    chapters:
      '1':
        title: पतरस आत्मिक उन्नति की शिक्षा देते हैं
      '2':
        title: झूठे शिक्षक शीघ्र न्याय लाते हैं
      '3':
        title: पतरस अंतिम न्याय की चेतावनी देते हैं
  1 John:
    display_name: 1 यूहन्ना
    author: लेखक अज्ञात है; परंपरागत रूप से प्रेरित यूहन्ना या यूहन्नाई प्राचीन को इसका लेखक माना जाता है।
    audience: विभाजन के बाद यूहन्नाई समुदाय, जहाँ यह स्पष्ट किया जा रहा था कि समुदाय में कौन सम्मिलित है।
    date: लगभग 90–110 ईस्वी।
    chapters:
      '1':
        title: ज्योति सच्ची संगति प्रकट करती है
      '2':
        title: प्रेम परमेश्वर की आज्ञाएँ मानता है
      '3':
        title: परमेश्वर से जन्मे लोग पाप पर विजय पाते हैं
      '4':
        title: सच्चा प्रेम परमेश्वर से आता है
      '5':
        title: यीशु पर विश्वास करने वालों के पास अनंत जीवन है
  2 John:
    display_name: 2 यूहन्ना
    author: “प्राचीन।”
    audience: एक विशेष मसीही सभा (“चुनी हुई महिला”), जिसे झूठे शिक्षकों से सावधान किया गया है।
    date: लगभग 90–110 ईस्वी।
    chapters:
      '1':
        title: प्राचीन झूठे शिक्षकों से सावधान करते हैं
  3 John:
    display_name: 3 यूहन्ना
    author: “प्राचीन।”
    audience: गयुस, एक व्यक्तिगत अगुआ जो यात्रा करने वाले प्रचारकों का आतिथ्य करता था।
    date: लगभग 90–110 ईस्वी।
    chapters:
      '1':
        title: प्राचीन गयुस की समृद्धि के लिए प्रार्थना करते हैं
  Jude:
    display_name: यहूदा
    author: परंपरागत रूप से याकूब और यीशु के भाई यहूदा को इसका लेखक माना जाता है।
    audience: वे मसीही समुदाय जिनमें स्वच्छंद जीवन की शिक्षा देने वाले लोग घुस आए थे।
    date: लगभग 60–90 के दशक ईस्वी।
    chapters:
      '1':
        title: यहूदा अधर्मी घुसपैठियों से सावधान करते हैं
  Revelation:
    display_name: प्रकाशितवाक्य
    author: पत्मुस का यूहन्ना (जिसकी लेखन-शैली चौथे सुसमाचार से भिन्न है)।
    audience: साम्राज्य के दबाव में रोमी एशिया माइनर की सात मसीही सभाएँ।
    date: लगभग 90 के दशक ईस्वी; परंपरागत रूप से दोमितियान के शासनकाल में।
    chapters:
      '1':
        title: परमेश्वर यूहन्ना को दर्शन दिखाते हैं
      '2':
        title: यीशु सात कलीसियाओं से बोलते हैं
      '3':
        title: यीशु लौदीकिया को मन फिराने की चेतावनी देते हैं
      '4':
        title: स्वर्ग का सिंहासन महिमा से दमकता है
      '5':
        title: मेमना पुस्तक लेता और छुटकारा देता है
      '6':
        title: चार घुड़सवार बड़ी विपत्तियाँ लाते हैं
      '7':
        title: मुहरबंद सेवक अनंत स्तुति गाते हैं
      '8':
        title: सात तुरहियाँ भयानक न्याय की घोषणा करती हैं
      '9':
        title: टिड्डियाँ पृथ्वी के पापियों को सताती हैं
      '10':
        title: शक्तिशाली स्वर्गदूत अंतिम समय की शपथ खाता है
      '11':
        title: दो गवाह भविष्यवाणी करते और फिर जी उठते हैं
      '12':
        title: स्त्री शासन के लिए ठहराए पुत्र को जन्म देती है
      '13':
        title: समुद्र से पशु निकलता है
      '14':
        title: मेमना विश्वासयोग्य लोगों को अपने पास एकत्र करता है
      '15':
        title: यूहन्ना स्वर्ग का प्रकोप देखते हैं
      '16':
        title: स्वर्गदूत प्रकोप के कटोरे उँडेलते हैं
      '17':
        title: बाबुल का न्याय और परमेश्वर की विजय
      '18':
        title: बाबुल के पतन पर स्वर्ग आनंद मनाता है
      '19':
        title: स्वर्ग मेमने के विवाह का उत्सव मनाता है
      '20':
        title: यूहन्ना अंतिम न्याय देखते हैं
      '21':
        title: सब कुछ नया किया गया
      '22':
        title: यीशु शीघ्र आ रहे हैं
  Tobit:
    display_name: तोबित
    author: लेखक अज्ञात है।
    audience: विदेशी शासन के अधीन भक्ति, विवाह और ईश्वरीय प्रबंध के साथ जीवन बिताने वाले प्रवासी यहूदी।
    date: लगभग 225–175 ईसा पूर्व; इसकी रचना अरामी भाषा में हुई थी और कुमरान में इसका एक इब्रानी रूप भी प्रमाणित हुआ है।
    chapters:
      '1':
        title: तोबित विश्वासयोग्यता से परमेश्वर को स्मरण करता है
      '2':
        title: तोबित तिरस्कृत पड़ोसी को दफ़नाता है
      '3':
        title: तोबित रोकर मृत्यु के लिए प्रार्थना करता है
      '4':
        title: तोबित पुत्र को धार्मिकता की शिक्षा देता है
      '5':
        title: तोबियाह मार्गदर्शन पाकर यात्रा पर निकलता है
      '6':
        title: तोबियाह चंगाई देने वाली मछली पकड़ता है
      '7':
        title: तोबियाह एकबतना में सारा से विवाह करता है
      '8':
        title: तोबियाह सारा से विवाह कर प्रार्थना करता है
      '9':
        title: गबाएल तोबित का धन लौटाता है
      '10':
        title: तोबियाह सुरक्षित घर लौटता है
      '11':
        title: पुत्र के द्वारा तोबित की दृष्टि लौटती है
      '12':
        title: रफाएल अपनी वास्तविक पहचान प्रकट करता है
      '13':
        title: तोबित यरूशलेम के लिए प्रार्थना करता है
      '14':
        title: तोबित इस्राएल का भविष्य देखता है
  Judith:
    display_name: यूदीत
    author: लेखक अज्ञात है।
    audience: विदेशी खतरे का सामना कर रहे यहूदी—भक्तिपूर्ण प्रतिरोध की एक निर्भीक कथा।
    date: लगभग 150–100 ईसा पूर्व।
    chapters:
      '1':
        title: नबूकदनेस्सर अरफक्षद पर आक्रमण करता है
      '2':
        title: होलोफेरनेस पश्चिम की ओर बढ़ता है
      '3':
        title: समुद्रतटीय लोग धन सहित समर्पण करते हैं
      '4':
        title: इस्राएल उपवास कर सहायता के लिए प्रार्थना करता है
      '5':
        title: अखियोर इस्राएल का इतिहास समझाता है
      '6':
        title: अखियोर होलोफेरनेस को चेतावनी देता है
      '7':
        title: बेतूलिया का पानी समाप्त हो जाता है
      '8':
        title: यूदीत परमेश्वर के उद्धार का भरोसा दिलाती है
      '9':
        title: यूदीत परमेश्वर से सामर्थ्य माँगती है
      '10':
        title: यूदीत अश्शूरी छावनी में प्रवेश करती है
      '11':
