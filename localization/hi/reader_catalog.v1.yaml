    display_name: उत्पत्ति
    author: लेखक अज्ञात है; परंपरागत रूप से इसका लेखन मूसा को माना जाता है। आधुनिक विद्वानों के अनुसार इसकी रचना का इतिहास लंबा रहा है और विभिन्न स्रोतों को बाद में संपादित करके एक साथ जोड़ा गया।
    audience: वाचा-आधारित पहचान में इस्राएल—परमेश्वर की सृष्टि, चुनाव और प्रतिज्ञा में लोगों की उत्पत्ति की कथा को आधार देने के लिए।
    date: इसकी रचना कई सदियों के दौरान हुई; लगभग छठी–पाँचवीं शताब्दी ईसा पूर्व में, बेबीलोन के निर्वासन के दौरान या उसके बाद, इसने अपना वर्तमान स्वीकृत रूप पाया।
    summary: उत्पत्ति में सृष्टि, मानवजाति के विद्रोह और बिखराव, तथा अब्राहम, इसहाक, याकूब और यूसुफ के परिवार की कथा है, जिनके माध्यम से इस्राएल के लिए परमेश्वर की वाचा की प्रतिज्ञाएँ आरंभ होती हैं।
