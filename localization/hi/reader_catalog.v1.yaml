      '11':
        title: बपतिस्मा अमर जीवन के लिए रूपांतरित करता है
      '12':
        title: विवाह का रहस्य पवित्र एकता पुनःस्थापित करता है
      '13':
        title: ईश्वरीय सत्य आत्मिक नया जन्म लाता है
      '14':
        title: मसीह एकता और जीवन पुनःस्थापित करता है
      '15':
