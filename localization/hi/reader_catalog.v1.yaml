      '8':
        title: यीशु, संसार की ज्योति, अस्वीकार किए जाते हैं
      '9':
        title: यीशु जन्मांध व्यक्ति को चंगा करते हैं
      '10':
        title: यीशु अपनी भेड़ों के विषय में बताते हैं
