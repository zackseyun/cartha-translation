payload:
  book_metadata:
    James:
      display_name: याकूब
      author: परंपरागत रूप से यीशु के भाई याकूब को इसका लेखक माना जाता है; आधुनिक विद्वान इस बात पर बँटे हुए हैं कि यह वास्तव में उन्हीं की रचना है या उनके नाम से लिखी गई है।
      audience: प्रवास में रहने वाली यहूदी-मसीही सभाएँ।
      date: यदि यह वास्तव में याकूब की रचना है, तो लगभग 50–60 के दशक ईस्वी; यदि उनके नाम से लिखी गई है, तो लगभग पहली सदी ईस्वी का उत्तरार्ध।
    1 Peter:
      display_name: 1 पतरस
      author: परंपरागत रूप से प्रेरित पतरस को इसका लेखक और सिलवानुस को लिपिक माना जाता है; कुछ विद्वान मानते हैं कि यह पतरस के नाम से लिखी गई है।
      audience: रोमी एशिया माइनर के मसीही, जो सामाजिक विरोध का सामना कर रहे थे।
      date: यदि यह पतरस की रचना है, तो लगभग 60 के दशक ईस्वी; यदि उनके नाम से लिखी गई है, तो लगभग 70–90 के दशक ईस्वी।
    2 Peter:
      display_name: 2 पतरस
      author: परंपरागत रूप से पतरस को इसका लेखक माना जाता है; आधुनिक विद्वानों में व्यापक मान्यता है कि यह उनके नाम से लिखी गई है।
      audience: वे मसीही जो प्रभु के पुनरागमन को नकारने वाले उपहास करने वालों का सामना कर रहे थे।
      date: लगभग दूसरी सदी ईस्वी का आरंभ।
    1 John:
      display_name: 1 यूहन्ना
      author: लेखक अज्ञात है; परंपरागत रूप से प्रेरित यूहन्ना या यूहन्नाई प्राचीन को इसका लेखक माना जाता है।
      audience: विभाजन के बाद यूहन्नाई समुदाय, जहाँ यह स्पष्ट किया जा रहा था कि समुदाय में कौन सम्मिलित है।
      date: लगभग 90–110 ईस्वी।
    2 John:
      display_name: 2 यूहन्ना
      author: “प्राचीन।”
      audience: एक विशेष मसीही सभा (“चुनी हुई महिला”), जिसे झूठे शिक्षकों से सावधान किया गया है।
      date: लगभग 90–110 ईस्वी।
    3 John:
      display_name: 3 यूहन्ना
      author: “प्राचीन।”
      audience: गयुस, एक व्यक्तिगत अगुआ जो यात्रा करने वाले प्रचारकों का आतिथ्य करता था।
      date: लगभग 90–110 ईस्वी।
    Jude:
      display_name: यहूदा
      author: परंपरागत रूप से याकूब और यीशु के भाई यहूदा को इसका लेखक माना जाता है।
      audience: वे मसीही समुदाय जिनमें स्वच्छंद जीवन की शिक्षा देने वाले लोग घुस आए थे।
      date: लगभग 60–90 के दशक ईस्वी।
    Revelation:
      display_name: प्रकाशितवाक्य
      author: पत्मुस का यूहन्ना (जिसकी लेखन-शैली चौथे सुसमाचार से भिन्न है)।
      audience: साम्राज्य के दबाव में रोमी एशिया माइनर की सात मसीही सभाएँ।
      date: लगभग 90 के दशक ईस्वी; परंपरागत रूप से दोमितियान के शासनकाल में।
    Tobit:
      display_name: तोबित
      author: लेखक अज्ञात है।
      audience: विदेशी शासन के अधीन भक्ति, विवाह और ईश्वरीय प्रबंध के साथ जीवन बिताने वाले प्रवासी यहूदी।
      date: लगभग 225–175 ईसा पूर्व; इसकी रचना अरामी भाषा में हुई थी और कुमरान में इसका एक इब्रानी रूप भी प्रमाणित हुआ है।
    Judith:
      display_name: यूदीत
      author: लेखक अज्ञात है।
      audience: विदेशी खतरे का सामना कर रहे यहूदी—भक्तिपूर्ण प्रतिरोध की एक निर्भीक कथा।
      date: लगभग 150–100 ईसा पूर्व।
    Greek Additions to Esther:
      display_name: एस्तेर के यूनानी परिशिष्ट
      author: लेखक अज्ञात है; एस्तेर के यूनानी अनुवाद में जोड़ी गई पूरक सामग्री।
      audience: यूनानी-भाषी यहूदी, जो एस्तेर की ऐसी कथा चाहते थे जिसमें प्रार्थना और परमेश्वर का स्पष्ट उल्लेख हो।
      date: लगभग दूसरी–पहली सदी ईसा पूर्व।
    Wisdom of Solomon:
      display_name: सुलैमान की बुद्धि
      author: लेखक अज्ञात है; इसे सुलैमान के नाम से लिखी गई रचना माना जाता है। इसकी रचना किसी यूनानी संस्कृति से प्रभावित यहूदी लेखक ने यूनानी भाषा में की थी, संभवतः सिकंदरिया में।
      audience: यूनानी दर्शन से संवाद करते हुए यूनानी संस्कृति से प्रभावित यहूदी, जो इस्राएल की बुद्धि का समर्थन गैर-यहूदी और धर्मत्यागी विकल्पों के विरुद्ध करते थे।
      date: लगभग 50 ईसा पूर्व–50 ईस्वी।
