  book_metadata:
    Hypostasis of the Archons:
      display_name: आर्कॉनों का स्वरूप
      author: लेखक अज्ञात है। लेखक उत्पत्ति की व्याख्या आर्कॉनों के विषय में एक प्रकाशनात्मक मिथक के माध्यम से करता है; इस रचना को निश्चित रूप से किसी नामित शिक्षक से नहीं जोड़ा जा सकता।
      audience: सेथीय या उससे संबंधित परिवेश के वे मसीही, जो उत्पत्ति को अज्ञानी ब्रह्मांडीय शासकों, दिव्य प्रज्ञा और मानवता की आत्मिक उत्पत्ति के बीच संघर्ष के रूप में पढ़ते थे।
      date: इसे सामान्यतः तीसरी शताब्दी ईस्वी की रचना माना जाता है; यह नाग हम्मादी कोडेक्स द्वितीय में चौथी शताब्दी की एक कॉप्टिक प्रति के रूप में सुरक्षित है।
    On the Origin of the World:
      display_name: संसार की उत्पत्ति के विषय में
      author: लेखक अज्ञात है। यह रचना कई यहूदी, मसीही, प्लेटोवादी और पौराणिक परंपराओं को संकलित तथा संशोधित करती है, पर अपने संकलनकर्ता का नाम नहीं बताती।
      audience: ज्ञानवादी रुझान वाले मसीही परिवेश के वे पाठक, जो सृष्टि, ब्रह्मांडीय शासकों, सोफिया, आदम और हव्वा तथा संसार की अंतिम नियति का एक वैकल्पिक इतिहास जानना चाहते थे।
      date: इसे प्रायः तीसरी शताब्दी ईस्वी का माना जाता है, यद्यपि संभव है कि इसकी आधार-सामग्री इससे पुरानी हो; यह मुख्यतः चौथी शताब्दी की कॉप्टिक प्रतियों में सुरक्षित है।
    Sophia of Jesus Christ:
      display_name: यीशु मसीह की प्रज्ञा
      author: लेखक अज्ञात है। लेखक उस सामग्री को, जो यूग्नोस्तोस से भी ज्ञात है, यीशु और उनके शिष्यों के बीच पुनरुत्थान के बाद के संवाद के रूप में प्रस्तुत करता है।
      audience: वे मसीही, जो परात्पर परमेश्वर, स्वर्गीय जगत की व्यवस्था तथा आत्मा की उत्पत्ति और उद्धार के विषय में प्रकट की गई प्रज्ञा में रुचि रखते थे।
      date: इसे प्रायः दूसरी शताब्दी के उत्तरार्ध या तीसरी शताब्दी ईस्वी का माना जाता है; यह नाग हम्मादी और बर्लिन कोडेक्स की कॉप्टिक प्रतियों में सुरक्षित है।
    Gospel of the Egyptians:
      display_name: मिस्रियों का सुसमाचार
      author: लेखक अज्ञात है। नाग हम्मादी की यह रचना, जिसे महान अदृश्य आत्मा की पवित्र पुस्तक भी कहा जाता है, मिस्रियों के उस अधिक प्राचीन यूनानी सुसमाचार से भिन्न है जो केवल उद्धरणों के माध्यम से ज्ञात है।
      audience: एक सेथीय मसीही समुदाय, जो अपनी आत्मिक पहचान और मुक्ति को व्यक्त करने के लिए गहन मिथकीय वर्णन, पवित्र नामों, बपतिस्मा-संबंधी बिंबों और स्तुतिगान का उपयोग करता था।
      date: इसे सामान्यतः दूसरी या तीसरी शताब्दी ईस्वी की रचना माना जाता है; इसकी दो कॉप्टिक प्रतियाँ चौथी शताब्दी के नाग हम्मादी कोडेक्सों में सुरक्षित हैं।
    Letter of Peter to Philip:
      display_name: फिलिप्पुस के नाम पतरस का पत्र
      author: लेखक अज्ञात है। आरंभ का संक्षिप्त पत्र और उसके बाद का प्रकाशन छद्मनाम से पतरस और फिलिप्पुस को सौंपे गए हैं; इन्हें निश्चित रूप से दोनों में से किसी प्रेरित की रचना नहीं माना जा सकता।
      audience: वे मसीही, जो उद्धारकर्ता, विरोधी शक्तियों, दुःख, मिशन और शिष्यों की पुनर्स्थापना से संबंधित शिक्षा के लिए प्रेरितों का प्राधिकार चाहते थे।
      date: इसे सामान्यतः दूसरी शताब्दी के उत्तरार्ध या तीसरी शताब्दी ईस्वी के आरंभ की रचना माना जाता है; यह चौथी शताब्दी की नाग हम्मादी प्रति और बाद की एक कॉप्टिक प्रति में सुरक्षित है।
    Gospel of Judas:
      display_name: यहूदा का सुसमाचार
      author: लेखक अज्ञात है। शीर्षक इस वृत्तांत को यहूदा से जोड़ता है, पर यह रचना यह सिद्ध नहीं करती कि यहूदा इस्करियोती इसका ऐतिहासिक लेखक था।
      audience: एक मसीही समूह, जो प्रतिद्वंद्वी समुदायों की बलिदान-संबंधी और कलीसियाई प्रथाओं की आलोचना करता था तथा यहूदा और यीशु की मृत्यु की नई व्याख्या करने के लिए प्रकाशनात्मक संवाद और सेथीय प्रकार के ब्रह्मांड-विज्ञान का उपयोग करता था।
      date: इसे प्रायः दूसरी शताब्दी ईस्वी के मध्य या उत्तरार्ध की रचना माना जाता है; लगभग 180 ईस्वी तक इरेनियस यहूदा के एक सुसमाचार से परिचित था, और सुरक्षित कॉप्टिक प्रति संभवतः तीसरी या चौथी शताब्दी की है।
    Protoevangelium of James:
      display_name: याकूब का आदिसुसमाचार
      author: लेखक अज्ञात है। वर्णनकर्ता स्वयं को याकूब बताता है, पर यह रचना छद्मनाम से लिखी गई है और यीशु के भाई याकूब ने इसे नहीं लिखा था।
      audience: वे मसीही, जो मरियम के जन्म और पालन-पोषण, उनकी चिरस्थायी पवित्रता, यीशु के जन्म तथा मत्ती और लूका द्वारा अनुत्तरित छोड़े गए प्रश्नों के कथात्मक उत्तरों में रुचि रखते थे।
      date: इसे सामान्यतः दूसरी शताब्दी ईस्वी के उत्तरार्ध की रचना माना जाता है; यह बाद की अनेक यूनानी पांडुलिपियों और प्राचीन अनुवादों में सुरक्षित है।
