  review_summary: पूर्ण हिंदी कैटलॉग को संशोधित किया गया है। मुख्य सुधारों में कुछ अध्याय-शीर्षकों से स्रोत में निहित न होने वाले विवरण हटाना, अनुवाद की शाब्दिक/अर्थगत निष्ठा बढ़ाना, और उत्पत्ति की पाठक-वर्ग तथा तिथि संबंधी भाषा को अधिक स्वाभाविक बनाना शामिल है।
