      date: लगभग 55–56 ईस्वी।
    Galatians:
      display_name: गलातियों
      author: पौलुस।
      audience: गलातिया (मध्य अनातोलिया) की मसीही सभाएँ, जिन पर खतना अपनाने और तोराह का पालन करने का दबाव था।
      date: लगभग 48–55 ईस्वी (विवादित)।
    Ephesians:
      display_name: इफिसियों
      author: पौलुस, या पौलुस के नाम से लिखने वाला एक निकट शिष्य (विवादित)।
      audience: एशिया के मसीहियों का एक सामान्य पाठक-वर्ग; सबसे प्राचीन पांडुलिपियों में स्थान-नाम “इफिसुस” अनुपस्थित है।
      date: यदि पौलुस द्वारा लिखा गया, तो लगभग 60 के दशक में; यदि छद्मनाम से लिखा गया, तो लगभग 80–90 के दशकों में।
