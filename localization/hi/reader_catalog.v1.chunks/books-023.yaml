  book_metadata:
    Gospel of Mary:
      display_name: मरियम का सुसमाचार
      author: लेखक अज्ञात है। यह रचना मरियम को यीशु के प्रकाशन को ग्रहण करने और उसकी व्याख्या करने वाली के रूप में प्रस्तुत करती है, पर यह दावा नहीं करती कि उपलब्ध सुसमाचार मरियम ने लिखा था।
      audience: ऐसे आरंभिक मसीही पाठक जो प्रकाशन, आत्मिक आरोहण, प्रेरितों के अधिकार और यीशु के शिष्यों के बीच मरियम की शिक्षा की वैधता से जुड़े प्रश्नों पर विचार कर रहे थे।
      date: इसे सामान्यतः ईस्वी दूसरी शताब्दी का माना जाता है; तीसरी शताब्दी के यूनानी अंश उपलब्ध हैं, और इसका प्रमुख कॉप्टिक साक्ष्य पाँचवीं शताब्दी की बर्लिन कोडेक्स 8502 में संरक्षित है।
    Treatise on the Resurrection:
      display_name: पुनरुत्थान पर ग्रंथ
      author: लेखक अज्ञात है। यह रचना रेगिनोस नामक शिष्य को लिखे गए एक शिक्षक के पत्र के रूप में प्रस्तुत की गई है; न तो शिक्षक की और न ही रेगिनोस की पहचान निश्चित रूप से की जा सकती है।
      audience: पुनरुत्थान के विषय में शिक्षा चाहने वाले मसीही, विशेषकर ऐसे पाठक जो पुनरुत्थान के जीवन में शारीरिक, आत्मिक और वर्तमान सहभागिता पर विचार कर रहे थे।
      date: इसे सामान्यतः ईस्वी दूसरी शताब्दी के उत्तरार्ध (अक्सर लगभग 170–200 ई.) का माना जाता है; यह पहले की एक यूनानी रचना की चौथी शताब्दी की कॉप्टिक प्रति में संरक्षित है।
    Dialogue of the Savior:
      display_name: उद्धारकर्ता का संवाद
      author: लेखक अज्ञात है। इस संवाद में यहूदा, मत्ती और मरियम के साथ वार्तालाप में प्रकाशन संबंधी शिक्षा यीशु के मुख से प्रस्तुत की गई है, पर यह अपने संकलनकर्ता की पहचान नहीं बताता।
      audience: निजी प्रकाशन, शिष्यत्व, आत्मज्ञान, प्रार्थना और उद्धार के लिए तपस्वी तैयारी में रुचि रखने वाला एक आरंभिक मसीही समुदाय।
      date: इसे सामान्यतः ईस्वी दूसरी शताब्दी का माना जाता है, यद्यपि इसकी रचना की विभिन्न परतों और सटीक तिथि को लेकर मतभेद बने हुए हैं; यह चौथी शताब्दी की एक कॉप्टिक पांडुलिपि में संरक्षित है।
    Exegesis on the Soul:
      display_name: आत्मा की व्याख्या
      author: लेखक अज्ञात है। लेखक एक मसीही उपदेशक है, जो बाइबिल और यूनानी साहित्य की छवियों को आत्मा के पतन, पश्चात्ताप और पुनर्स्थापना के रूपक के रूप में नए ढंग से पढ़ता है।
      audience: पवित्रशास्त्र और नैतिक उपदेश से परिचित ऐसे मसीही, जिन्हें अव्यवस्थित अभिलाषा छोड़कर पश्चात्ताप करने और दैवीय सत्ता से फिर मिल जाने के लिए बुलाया जा रहा था।
      date: इसे सामान्यतः ईस्वी दूसरी शताब्दी के उत्तरार्ध या तीसरी शताब्दी के आरंभ का माना जाता है; यह यूनानी से किए गए चौथी शताब्दी के कॉप्टिक अनुवाद में संरक्षित है।
    Book of Thomas the Contender:
      display_name: प्रतियोगी थोमा की पुस्तक
      author: लेखक अज्ञात है। इसका अंतिम शीर्षक इस रचना को यहूदा थोमा से जोड़ता है और मथायास को इसे लिखने वाला बताता है, पर ये सत्यापित लेखकीय दावों के बजाय साहित्यिक आरोपण हैं।
      audience: तपस्वी प्रवृत्ति वाले मसीही, जिन्हें आत्मज्ञान खोजने, शारीरिक वासनाओं का प्रतिरोध करने और थोमा को दी गई यीशु की निजी शिक्षा समझने के लिए प्रोत्साहित किया गया था।
      date: इसे प्रायः ईस्वी दूसरी शताब्दी के उत्तरार्ध या तीसरी शताब्दी के आरंभ का माना जाता है, और संभव है कि इसकी पृष्ठभूमि सीरियाई मसीही रही हो; यह चौथी शताब्दी की एक कॉप्टिक पांडुलिपि में संरक्षित है।
    Tripartite Tractate:
      display_name: त्रिभागीय ग्रंथ
      author: लेखक अज्ञात है। लेखक एक अत्यंत शिक्षित वैलेंटिनीय मसीही धर्मशास्त्री था; किसी नामित शिक्षक के साथ उसकी निश्चित पहचान संभव नहीं है।
      audience: एक वैलेंटिनीय मसीही समुदाय, जिसे परमेश्वर, युग-सत्ताओं, सृष्टि, मसीह, कलीसिया, उद्धार और अंतिम पुनर्स्थापना के विषय में विस्तृत शिक्षा दी जा रही थी।
      date: इसे सामान्यतः ईस्वी तीसरी शताब्दी का माना जाता है, यद्यपि कुछ तर्क इसे उस शताब्दी के उत्तरार्ध का बताते हैं; यह चौथी शताब्दी की युंग कोडेक्स में कॉप्टिक भाषा में संरक्षित है।
    Apocryphon of John:
      display_name: यूहन्ना का गुप्त ग्रंथ
      author: लेखक अज्ञात है। यह रचना छद्मनाम से स्वयं को पुनर्जीवित यीशु द्वारा जब्दी के पुत्र यूहन्ना को दिए गए प्रकाशन के रूप में प्रस्तुत करती है और एक से अधिक प्राचीन पाठ-रूपों में उपलब्ध है।
      audience: सेथीय या उससे निकटता से संबंधित प्रकाशनपरक परंपरा के मसीही, जो दिव्य लोक, सृष्टि, मानवीय पहचान और शत्रुतापूर्ण शासकों से मुक्ति का विवरण चाहते थे।
      date: संभवतः इसका कोई आरंभिक रूप ईस्वी दूसरी शताब्दी में प्रचलित था; छोटे और बड़े पाठ-रूपों को सुरक्षित रखने वाले उपलब्ध कॉप्टिक साक्ष्य चौथी और पाँचवीं शताब्दी के हैं।
