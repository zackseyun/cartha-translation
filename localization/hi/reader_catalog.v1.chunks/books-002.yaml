      author: लेखक अज्ञात है; परंपरागत रूप से इसका लेखन मूसा को माना जाता है।
      audience: मिस्र से प्रतिज्ञात देश की ओर यात्रा कर रहा इस्राएल—अर्थात जंगल की पीढ़ी—और बाद के वे पाठक जो उनकी विफलताओं से सीखते हैं।
      date: रचना की विभिन्न परतें राजतंत्र के अंतिम काल से लेकर निर्वासन के बाद के काल तक की हैं (लगभग 7वीं–5वीं शताब्दी ईसा पूर्व)।
    Deuteronomy:
      display_name: व्यवस्थाविवरण
      author: लेखक अज्ञात है; इसे मूसा के विदाई भाषणों के रूप में प्रस्तुत किया गया है। आधुनिक विद्वान इसके मूल भाग को योशिय्याह के शासन में 7वीं शताब्दी ईसा पूर्व के उत्तरार्ध में हुए सुधार से जोड़ते हैं।
      audience: देश में प्रवेश करने की तैयारी कर रहा इस्राएल—और बाद में, वे निर्वासित लोग जो पूछ रहे थे कि मंदिर या राजा के बिना परमेश्वर के प्रति विश्वासयोग्य होकर कैसे जिएँ।
      date: मूल भाग लगभग 7वीं शताब्दी ईसा पूर्व के उत्तरार्ध का है; निर्वासन के समय इसने अपना अंतिम रूप पाया।
