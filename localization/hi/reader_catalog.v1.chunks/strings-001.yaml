  verdict: revise
  review_summary: पूर्ण हिंदी स्थानीयकरण संशोधित किया गया। मुख्य सुधारों में ब्रांड/यूआई शब्दावली की स्वाभाविकता, ‘Incipit’ का अधिक सटीक अर्थ, और परिचयात्मक कथन में पांडुलिपियों को AI द्वारा स्कैन किए जाने तथा AI द्वारा पाठ प्रस्तुत किए जाने के बीच के अंतर को सुरक्षित रखना शामिल है।
  issues:
  - 'introQuote में मूल का अर्थ बदल गया था: मूल पांडुलिपियों को AI vision models ने स्कैन किया था और AI ने पाठ रेंडर किया था; संशोधित पाठ में यह भेद बहाल किया गया।'
  - कुछ शब्दों को अधिक स्पष्ट और तटस्थ हिंदी में सुधारा गया, जैसे ‘Incipit’, ‘Explore’, और संग्रह-विभागों के लेबल।
