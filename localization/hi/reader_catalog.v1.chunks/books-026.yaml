      date: सामान्यतः ईस्वी दूसरी शताब्दी के आरंभ का, प्रायः लगभग 105–117 ईस्वी का माना जाता है, हालाँकि इग्नातियुस की यात्रा का सटीक कालक्रम अब भी विवादित है।
