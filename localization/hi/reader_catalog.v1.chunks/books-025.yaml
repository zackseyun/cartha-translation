  book_metadata:
    Infancy Gospel of Thomas:
      display_name: थोमा का बाल्यकालीन सुसमाचार
      author: अज्ञात। इसके प्राचीनतम उपलब्ध रूप में किसी लेखक का नाम नहीं है; थोमा से इसका संबंध बाद की पांडुलिपियों के शीर्षकों और पाठ-परंपरा में मिलता है।
      audience: वे मसीही पाठक जो यीशु के बचपन के बारे में जानने और यह समझने को उत्सुक थे कि प्रामाणिक सुसमाचारों के वृत्तांत आरंभ होने से पहले उनकी दिव्य सामर्थ्य, अनुशासन, शिक्षा और परिपक्वता का वर्णन कैसे किया जा सकता है।
      date: सामान्यतः इसकी उत्पत्ति ईस्वी दूसरी शताब्दी में मानी जाती है, पर यह पाठ यूनानी के कई काफ़ी भिन्न पाठ-रूपों और आरंभिक अनुवादों में सुरक्षित है।
    Acts of Paul and Thecla:
      display_name: पौलुस और थेकला के कार्य
      author: अज्ञात। यह ‘पौलुस के कार्य’ नामक बड़े ग्रंथ का एक प्रसंग है; एक प्राचीन विवरण के अनुसार एक पुरोहित ने ‘कार्य’ की रचना की थी, पर उससे लेखक की पहचान निश्चित रूप से नहीं की जा सकती।
      audience: वे मसीही पाठक जिन्हें प्रेरितों के प्रचार, ब्रह्मचर्य, बपतिस्मा, शहीदों जैसे धीरज और एक स्त्री के शिक्षा देने तथा साक्षी होने के अधिकार से जुड़ी कथाएँ आकर्षित करती थीं।
      date: इसकी रचना ईस्वी दूसरी शताब्दी में, संभवतः उसके उत्तरार्ध में हुई; यह ‘पौलुस के कार्य’ के भीतर भी और एक स्वतंत्र रचना के रूप में भी प्रचलित रहा।
    Gospel of Peter:
      display_name: पतरस का सुसमाचार
      author: अज्ञात। उपलब्ध वृत्तांत पतरस की वाणी में बोलता है और उन्हीं के नाम से प्रसारित हुआ, पर इसे ऐतिहासिक प्रेरित पतरस की रचना नहीं माना जाता।
      audience: वे आरंभिक मसीही पाठक जो यीशु के दुःखभोग और पुनरुत्थान के विस्तृत वृत्तांत में रुचि रखते थे, संभवतः ऐसे समुदायों में जहाँ पतरस के अधिकार का विशेष महत्त्व था।
      date: सामान्यतः इसे ईस्वी दूसरी शताब्दी का माना जाता है; इसका प्रमुख उपलब्ध यूनानी अंश बहुत बाद की एक पांडुलिपि में मिलता है, जो अख़मीम में पाई गई थी।
    2 Clement:
      display_name: 2 क्लेमेंट
      author: अज्ञात। अपने पारंपरिक शीर्षक के विपरीत, यह रोम के क्लेमेंट का दूसरा पत्र नहीं, बल्कि आरंभिक मसीही धर्मोपदेश है।
      audience: एक मसीही सभा, जिसे पश्चात्ताप, आचरण में एकरूपता, असहाय लोगों की देखभाल और पुनरुत्थान तथा न्याय की आशा में विश्वासयोग्य धीरज रखने के लिए प्रोत्साहित किया गया है।
      date: सामान्यतः इसे ईस्वी दूसरी शताब्दी के पूर्वार्ध या मध्य का (लगभग 100–160 ई.) माना जाता है; इसकी रचना कहाँ हुई, यह अनिश्चित है।
    Epistle of Barnabas:
      display_name: बरनबास का पत्र
      author: अज्ञात। परंपरागत रूप से इस रचना को पौलुस के साथी बरनबास से जोड़ा गया था, पर आधुनिक विद्वान इस लेखकत्व को स्वीकार नहीं करते।
      audience: गैर-यहूदी मसीही, जिन्हें मसीह-केंद्रित और रूपकात्मक व्याख्या के द्वारा इस्राएल के धर्मग्रंथों को अपना मानना सिखाया जा रहा था, साथ ही अपनी वाचा-संबंधी पहचान को यहूदी रीति-रिवाजों से अलग समझना भी।
      date: सामान्यतः इसे 70 ई. में यरूशलेम के मंदिर के विनाश और दूसरी शताब्दी के आरंभ के बीच, प्रायः लगभग 80–130 ई. का माना जाता है।
