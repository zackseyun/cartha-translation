payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: फिलिप्पियों के नाम पॉलीकार्प का पत्र
      author: स्मिर्ना के बिशप पॉलीकार्प। कुछ विद्वानों के अनुसार, उपलब्ध पाठ में एक से अधिक अवसरों पर भेजी गई सामग्री को जोड़ा गया है।
      audience: फिलिप्पी की मसीही सभा, जिसने इग्नातियुस के पत्रों का अनुरोध किया था और जिसे विश्वास, आचरण, नेतृत्व, धन और धीरज के विषय में परामर्श मिला।
      date: ईस्वी दूसरी शताब्दी के आरंभ से मध्य तक; इसका कम-से-कम कुछ भाग इग्नातियुस की यात्रा से निकटता से जुड़ा है, जबकि इसे संयुक्त पत्र मानने वाले मत इसके किसी खंड को कुछ बाद का मानते हैं।
    Martyrdom of Polycarp:
      display_name: पॉलीकार्प की शहादत
      author: स्मिर्ना की कलीसिया के अज्ञात सदस्य, जिन्होंने समुदाय की ओर से लिखा; अंत में दिए गए संप्रेषण-संबंधी विवरण बाद में हुई नकल और प्रसार को दर्शाते हैं।
      audience: फिलोमेलियम की कलीसिया और व्यापक मसीही संगति, जिन्हें पॉलीकार्प की गिरफ्तारी, मुकदमे, मृत्यु और अनुकरणीय धीरज का वृत्तांत दिया गया।
      date: पॉलीकार्प की मृत्यु के बाद लिखा गया और सामान्यतः ईस्वी दूसरी शताब्दी के मध्य या उत्तरार्ध का माना जाता है; शहादत का ठीक वर्ष और दस्तावेज़ का अंतिम रूप—दोनों विवादित हैं।
    Epistle to Diognetus:
      display_name: डायोग्नेतुस के नाम पत्र
      author: अज्ञात। लेखक अपने को शिष्य या सीखने वाला कहता है, पर न तो उसकी और न ही संबोधित डायोग्नेतुस की पहचान निश्चित रूप से की जा सकती है।
      audience: एक शिक्षित गैर-मसीही जिज्ञासु—और उसके जैसे पाठक—जो मसीही उपासना, नैतिकता, सामाजिक पहचान, प्रेम और विश्वास के प्रकटतः नया होने के विषय में पूछ रहे थे।
      date: प्रायः ईस्वी दूसरी शताब्दी के उत्तरार्ध या तीसरी शताब्दी के आरंभ का माना जाता है, यद्यपि प्रस्तावित तिथियों में बहुत अंतर है; अंतिम दो अध्याय किसी अलग रचना से हो सकते हैं।
    Fragments of Papias:
      display_name: पापियास के अंश
      author: प्रभु के वचनों की व्याख्याएँ नामक अब लुप्त पाँच-खंडीय रचना के लेखक, हियरापोलिस के बिशप पापियास; उपलब्ध संग्रह में बाद के लेखकों द्वारा सुरक्षित किए गए उद्धरण और विवरण हैं।
      audience: वे आरंभिक मसीही जो यीशु और प्रेरितों के विषय में स्मरण रखी गई शिक्षाएँ जानना चाहते थे, जिन्हें मौखिक गवाही और व्याख्या की नामोल्लिखित शृंखलाओं के माध्यम से संकलित किया गया था।
      date: पापियास की रचना सामान्यतः ईस्वी दूसरी शताब्दी के आरंभ की मानी जाती है, प्रायः लगभग 110–130 ईस्वी; उपलब्ध अंश दूसरी शताब्दी और उसके बाद लिखने वाले लेखकों की रचनाओं में मिलते हैं।
