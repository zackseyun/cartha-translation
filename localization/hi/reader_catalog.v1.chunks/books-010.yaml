payload:
  book_metadata:
    Joel:
      display_name: योएल
      author: पथूएल का पुत्र योएल।
      audience: निर्वासन के बाद का यहूदा, जो टिड्डियों के प्रकोप को प्रभु के दिन का संकेत मानकर उसका सामना कर रहा था।
      date: संभवतः लगभग 5वीं–4वीं शताब्दी ईसा-पूर्व।
    Amos:
      display_name: आमोस
      author: तकोआ का आमोस, यहूदा का एक चरवाहा जिसने उत्तर में प्रचार किया।
      audience: यारोबाम द्वितीय के शासनकाल में समृद्धि और अन्याय के दौर का उत्तरी इस्राएल।
      date: लगभग 760–750 ईसा-पूर्व।
    Obadiah:
      display_name: ओबद्याह
      author: ओबद्याह।
      audience: एदोम द्वारा यरूशलेम से विश्वासघात किए जाने के बाद का यहूदा—एदोम के पतन की भविष्यवाणी।
      date: 586 ईसा-पूर्व के कुछ ही समय बाद।
    Jonah:
      display_name: योना
      author: लेखक अज्ञात है; मुख्य पात्र अमित्तै का पुत्र योना है।
      audience: निर्वासन के बाद का इस्राएल—जातीय संकीर्णता पर एक व्यंग्यात्मक फटकार और बाहरी लोगों के प्रति परमेश्वर की दया की पुष्टि।
      date: संभवतः लगभग 5वीं–4वीं शताब्दी ईसा-पूर्व।
    Micah:
      display_name: मीका
      author: मोरेशेत का मीका।
      audience: ईसा-पूर्व 8वीं शताब्दी के उत्तरार्ध का यहूदा, विशेषकर उसके ग्रामीण गरीब, शहरी अभिजात वर्ग के विरुद्ध।
      date: लगभग 740–700 ईसा-पूर्व।
    Nahum:
      display_name: नहूम
      author: एल्कोश का नहूम।
      audience: नीनवे के निकट आते पतन पर प्रसन्न होता यहूदा।
      date: 612 ईसा-पूर्व से कुछ ही समय पहले।
    Habakkuk:
      display_name: हबक्कूक
      author: हबक्कूक।
      audience: बाबेल के उदय का सामना करता यहूदा—न्याय के विषय में एक नबी का परमेश्वर से संवाद।
      date: लगभग 7वीं शताब्दी ईसा-पूर्व का उत्तरार्ध।
    Zephaniah:
      display_name: सपन्याह
      author: कूशी का पुत्र सपन्याह।
      audience: योशिय्याह के शासन में, उसके सुधारों से ठीक पहले का यहूदा।
      date: लगभग 640–609 ईसा-पूर्व।
    Haggai:
      display_name: हाग्गै
      author: हाग्गै।
      audience: दारा के शासन में मंदिर का पुनर्निर्माण करते लौटे हुए निर्वासित।
      date: 520 ईसा-पूर्व।
    Zechariah:
      display_name: जकर्याह
      author: बेरेक्याह का पुत्र जकर्याह; अध्याय 9–14 संभवतः किसी बाद के लेखक की रचना हैं।
      audience: मंदिर का पुनर्निर्माण करते लौटे हुए निर्वासित और बाद के निर्वासनोत्तर समुदाय।
      date: अध्याय 1–8 लगभग 520–518 ईसा-पूर्व; 9–14 शायद लगभग एक शताब्दी बाद।
    Malachi:
      display_name: मलाकी
      author: लेखक अज्ञात है; “मलाकी” का अर्थ “मेरा दूत” है।
      audience: फारसी शासन के अधीन उपासना और निष्ठा में ढीला पड़ता निर्वासन के बाद का यहूदा।
      date: लगभग 5वीं शताब्दी ईसा-पूर्व का मध्य।
    Matthew:
      display_name: मत्ती
      author: लेखक अज्ञात है; परंपरा इसका श्रेय प्रेरित मत्ती को देती है। आधुनिक विद्वानों के अनुसार इसका लेखक यूनानी-भाषी यहूदी मसीही था, जिसने मरकुस और क्यू-जैसे किसी स्रोत का उपयोग किया।
      audience: एक यहूदी मसीही समुदाय, जो आराधनालय-केंद्रित यहूदी धर्म के साथ निरंतरता और उससे भिन्नता के प्रश्नों से जूझ रहा था।
      date: लगभग 80–90 ईस्वी।
    Mark:
      display_name: मरकुस
      author: लेखक अज्ञात है; परंपरा इसे पतरस के यात्रा-सहचर यूहन्ना मरकुस से जोड़ती है।
      audience: यूनानी-भाषी मसीही समुदाय, संभवतः रोम में, जो उत्पीड़न का सामना कर रहा था या उसके खतरे के निकट था।
      date: लगभग 65–75 ईस्वी, यहूदी युद्ध और मंदिर के विनाश के समय के आसपास।
