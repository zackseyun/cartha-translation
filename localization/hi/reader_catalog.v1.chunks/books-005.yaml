    Psalms:
      display_name: भजन संहिता
      author: कई शताब्दियों के दौरान अनेक लेखकों ने इसकी रचना की; शीर्षलेखों में दाऊद, आसाप, कोरह, सुलैमान, मूसा और अन्य लोगों के नाम आते हैं।
