      author: लेखक अज्ञात है; संभवतः इतिहास की पुस्तकों के लेखक की ही लेखनी।
      audience: फ़ारसी शासन के अधीन यरूशलेम का पुनर्निर्माण कर रहे लौटे हुए निर्वासित।
      date: लगभग पाँचवीं शताब्दी ईसा पूर्व के मध्य से चौथी शताब्दी ईसा पूर्व तक।
