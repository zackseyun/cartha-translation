      audience: फ़ारसी शासन के अधीन यरूशलेम की शहरपनाह का पुनर्निर्माण और वाचा का नवीकरण कर रहे लौटे हुए निर्वासित।
      date: लगभग पाँचवीं शताब्दी ईसा पूर्व के मध्य से चौथी शताब्दी ईसा पूर्व तक।
