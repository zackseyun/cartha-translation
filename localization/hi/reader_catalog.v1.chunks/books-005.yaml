      author: लेखक अज्ञात है।
      audience: विदेशी शासन के अधीन प्रवासी यहूदी, विशेषकर फ़ारस में रहने वाले।
      date: लगभग फ़ारसी काल के उत्तरार्ध या यूनानी काल के आरंभ में (चौथी–तीसरी शताब्दी ईसा पूर्व)।
