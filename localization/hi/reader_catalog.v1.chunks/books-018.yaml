      audience: सीरियाई ज्ञान-परंपरा और आरंभिक ज्ञानवादी विचार से प्रभावित ईसाई पाठक-वर्ग, जिसका ध्यान यीशु के वचनों में गूढ़ आत्म-ज्ञान पाने पर था।
      date: यूनानी मूल-पाठ संभवतः लगभग 50–140 ईस्वी; कॉप्टिक पांडुलिपि लगभग 340 ईस्वी।
      summary: थोमा का सुसमाचार यीशु से जोड़े गए वचनों का संग्रह है। इसमें कोई निरंतर कथा नहीं है और यह पाठकों को बार-बार इन वचनों का अर्थ खोजने के लिए बुलाता है।
