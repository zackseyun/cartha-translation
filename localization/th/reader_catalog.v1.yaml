    date: โดยทั่วไปกำหนดอายุไว้ในคริสต์ศตวรรษที่ 2 ส่วนชิ้นส่วนภาษากรีกสำคัญที่หลงเหลืออยู่มาจากสำเนาต้นฉบับยุคหลังมากซึ่งค้นพบที่อัคมิม
