  Martyrdom of Polycarp:
    display_name: มรณสักขีของโพลีคาร์ป
    author: สมาชิกนิรนามของคริสตจักรในสเมอร์นา เขียนในนามของชุมชน ส่วนบันทึกการถ่ายทอดที่อยู่ตอนท้ายสะท้อนถึงการคัดลอกและเผยแพร่ในเวลาต่อมา
    audience: คริสตจักรที่ฟิโลเมเลียมและชุมชนคริสตชนในวงกว้าง โดยนำเสนอเรื่องราวการจับกุม การไต่สวน การเสียชีวิต และความอดทนอันเป็นแบบอย่างของโพลีคาร์ป
    date: เขียนขึ้นหลังการเสียชีวิตของโพลีคาร์ป โดยทั่วไปจัดไว้ในช่วงกลางหรือปลายคริสต์ศตวรรษที่ 2 แต่ทั้งปีที่เกิดมรณสักขีและรูปแบบสุดท้ายของเอกสารยังเป็นที่ถกเถียงกัน
