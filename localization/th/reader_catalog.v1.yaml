  Gospel of Mary:
    display_name: พระวรสารของมารีย์
    author: ไม่ทราบผู้เขียน งานชิ้นนี้นำเสนอว่ามารีย์เป็นผู้รับและตีความการสำแดงของพระเยซู แต่ไม่ได้กล่าวอ้างว่ามารีย์เป็นผู้เขียนพระวรสารฉบับที่หลงเหลืออยู่
    audience: ผู้อ่านคริสเตียนยุคแรกที่กำลังขบคิดเรื่องการสำแดง การขึ้นสู่แดนฝ่ายวิญญาณ สิทธิอำนาจของอัครทูต และความชอบธรรมของคำสอนของมารีย์ในหมู่สาวกของพระเยซู
    date: โดยทั่วไปกำหนดอายุไว้ในคริสต์ศตวรรษที่ 2 เศษต้นฉบับภาษากรีกที่หลงเหลืออยู่มาจากคริสต์ศตวรรษที่ 3 ส่วนพยานต้นฉบับภาษาคอปติกฉบับหลักเก็บรักษาอยู่ในประมวลต้นฉบับเบอร์ลิน 8502 ซึ่งมีอายุจากคริสต์ศตวรรษที่ 5
    chapters:
      '1':
        title: พระผู้ช่วยให้รอดทรงสอนให้ต่อต้านบาป
      '2':
        title: พระเยซูทรงส่งเหล่าสาวกไปด้วยสันติสุข
      '3':
        title: มารีย์ปลอบใจด้วยคำสอน
      '4':
        title: จิตวิญญาณเอาชนะความหลงลืม
      '5':
        title: เลวีหนุนใจให้ประกาศข่าวประเสริฐ
  Treatise on the Resurrection:
    display_name: บทนิพนธ์ว่าด้วยการเป็นขึ้นจากตาย
    author: ไม่ทราบผู้เขียน งานชิ้นนี้เรียบเรียงในรูปจดหมายจากอาจารย์ถึงศิษย์ชื่อเรกีนอส แต่ไม่อาจระบุตัวอาจารย์หรือเรกีนอสได้อย่างแน่ชัด
    audience: คริสเตียนที่แสวงหาคำสอนเรื่องการเป็นขึ้นจากตาย โดยเฉพาะผู้อ่านที่กำลังพิจารณาทั้งมิติทางกาย ทางจิตวิญญาณ และการมีส่วนในชีวิตแห่งการเป็นขึ้นจากตายในปัจจุบัน
    date: โดยทั่วไปกำหนดอายุไว้ช่วงปลายคริสต์ศตวรรษที่ 2 (มักระบุว่าราว ค.ศ. 170–200) โดยเก็บรักษาอยู่ในสำเนาภาษาคอปติกจากคริสต์ศตวรรษที่ 4 ซึ่งแปลมาจากงานภาษากรีกที่เก่ากว่า
    chapters:
      '1':
        title: พระคริสต์ทรงนำความบริบูรณ์แท้จริงมา
      '2':
        title: พระคริสต์ทรงเอาชนะอำนาจแห่งความตาย
      '3':
        title: การเป็นขึ้นจากตายเปลี่ยนแปลงความเป็นจริง
      '4':
        title: ผู้เชื่อมีส่วนในการเป็นขึ้นจากตายของพระคริสต์
      '5':
        title: ความเชื่อในการเป็นขึ้นจากตายของพระคริสต์
      '6':
        title: ปัญญาแห่งความรอดดำรงอยู่เป็นนิตย์
      '7':
        title: พระคุณรักษาชีวิตนิรันดร์ไว้
      '8':
        title: การเป็นขึ้นจากตายเผยชีวิตแท้จริง
      '9':
