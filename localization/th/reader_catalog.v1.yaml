  Acts of Paul and Thecla:
    display_name: กิจการของเปาโลและเธคลา
    author: ไม่ทราบผู้เขียน งานนี้เป็นตอนหนึ่งจากกิจการของเปาโลฉบับที่ยาวกว่า รายงานโบราณที่ว่าผู้อาวุโสในคริสตจักรคนหนึ่งประพันธ์กิจการฉบับนี้ไม่อาจใช้ระบุตัวผู้เขียนได้อย่างแน่นอน
    audience: คริสตชนที่สนใจเรื่องราวการประกาศของอัครทูต การครองโสด บัพติศมา ความทรหดอดทนเยี่ยงผู้พลีชีพ และสิทธิอำนาจของสตรีในการสอนและเป็นพยาน
    date: ประพันธ์ขึ้นในคริสต์ศตวรรษที่ 2 น่าจะเป็นช่วงครึ่งหลังของศตวรรษ งานนี้แพร่หลายทั้งในฐานะส่วนหนึ่งของกิจการของเปาโลและในฐานะงานเขียนอิสระ
