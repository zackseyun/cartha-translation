    display_name: ปฐมกาล
    author: ไม่ทราบผู้เขียน; ตามธรรมเนียมยกให้โมเสสเป็นผู้เขียน นักวิชาการสมัยใหม่มองว่าหนังสือนี้มีประวัติการเรียบเรียงยาวนาน โดยแหล่งข้อมูลต่าง ๆ ถูกนำมาแก้ไขรวมกันในภายหลัง
    audience: อิสราเอลในอัตลักษณ์แห่งพันธสัญญา โดยวางรากฐานเรื่องราวต้นกำเนิดของประชากรไว้ในการทรงสร้าง การทรงเลือก และพระสัญญาของพระเจ้า
    date: เรียบเรียงตลอดหลายศตวรรษ; มีรูปแบบที่ได้รับสืบทอดราวศตวรรษที่ 6–5 ก่อนคริสตกาล ระหว่างหรือหลังการเป็นเชลยในบาบิโลน
