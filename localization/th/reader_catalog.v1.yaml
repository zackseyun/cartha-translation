  Gospel of Philip:
    display_name: ข่าวประเสริฐของฟีลิป
    author: ไม่ทราบนาม ชื่อเรื่องปรากฏในข้อความปิดท้ายของต้นฉบับ แต่งานนี้ไม่ได้ระบุว่าฟีลิปเป็นผู้เขียน สำเนาเพียงฉบับเดียวที่ยังหลงเหลืออยู่คือข้อความภาษาคอปติกในประมวลนากฮัมมาดี II,3
    audience: ชุมชนคริสต์ยุคแรกที่คุ้นเคยกับคำสอนเรื่องพิธีศักดิ์สิทธิ์แบบวาเลนติเนียน โดยเฉพาะบัพติศมา การเจิม ศีลมหาสนิท การไถ่ การเป็นขึ้นจากตาย และภาพเปรียบเรื่องห้องเจ้าสาว
    date: โดยทั่วไปกำหนดอายุไว้ช่วงปลายศตวรรษที่ 2 หรือต้นศตวรรษที่ 3 คริสต์ศักราช; เก็บรักษาไว้ในต้นฉบับภาษาคอปติกสมัยศตวรรษที่ 4 ซึ่งแปลจากรูปแบบภาษากรีกที่เก่ากว่า
    chapters:
      '1':
        title: พระคริสต์ทรงนำครอบครัวของพระเจ้ามาสู่ความครบถ้วน
      '2':
