      '1':
        title: เปโตรสอนเรื่องการเติบโตฝ่ายจิตวิญญาณ
      '2':
        title: ผู้สอนเท็จนำการพิพากษาอันฉับพลันมา
      '3':
        title: เปโตรเตือนถึงการพิพากษาครั้งสุดท้าย
  1 John:
    display_name: 1 ยอห์น
    author: ไม่ทราบชื่อผู้เขียน ตามธรรมเนียมเชื่อว่าเป็นอัครทูตยอห์นหรือผู้อาวุโสในกลุ่มของยอห์น
