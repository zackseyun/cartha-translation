        title: ถวายชีวิตเป็นเครื่องบูชาที่มีชีวิต
      '13':
        title: เชื่อฟังผู้มีอำนาจและรักผู้อื่น
      '14':
        title: ต้อนรับผู้ที่มีความเชื่ออ่อนแอ
      '15':
        title: รวมชาวยิวและคนต่างชาติให้เป็นหนึ่ง
      '16':
        title: คำทักทายและคำเตือน
  1 Corinthians:
    display_name: 1 โครินธ์
    author: เปาโล ร่วมกับโสสเธเนส
    audience: ชุมชนคริสเตียนในเมืองโครินธ์ซึ่งกำลังแตกแยกกัน
    date: ราว ค.ศ. 53–55 เขียนจากเมืองเอเฟซัส
    chapters:
      '1':
        title: ความมั่งคั่งจากพระเจ้าผู้ซื่อสัตย์มีแก่ทุกคน
      '2':
        title: เผยพระปัญญาจากพระวิญญาณของพระเจ้า
      '3':
        title: เปาโลเตือนชาวโครินธ์ว่าพวกเขาเป็นวิหารของพระเจ้า
      '4':
        title: ความซื่อสัตย์สำคัญกว่าความหยิ่ง
      '5':
        title: เปาโลสั่งให้คริสตจักรดำเนินวินัย
      '6':
        title: ยุติข้อพิพาทกันภายในคริสตจักร
      '7':
        title: เปาโลสอนให้ให้เกียรติชีวิตสมรส
      '8':
        title: ความรักอยู่เหนือเสรีภาพส่วนตัว
      '9':
        title: เปาโลปกป้องความเป็นอัครทูตของตนอย่างเสรี
      '10':
        title: อิสราเอลเป็นอุทาหรณ์เตือนประชากรของพระเจ้า
      '11':
        title: ความเป็นหนึ่งในการนมัสการถวายเกียรติแด่พระคริสต์
      '12':
        title: ของประทานจากพระวิญญาณเสริมสร้างความเป็นหนึ่งของคริสตจักร
      '13':
        title: ความรักไม่เคยยอมแพ้
      '14':
        title: เปาโลหนุนใจให้มุ่งความรักยิ่งกว่าการสร้างความประทับใจ
      '15':
        title: พระคริสต์ทรงคืนพระชนม์และความตายพ่ายแพ้
      '16':
        title: เรื่องเงินถวายและแผนการเดินทาง
  2 Corinthians:
    display_name: 2 โครินธ์
    author: เปาโล ร่วมกับทิโมธี
    audience: ชุมชนคริสเตียนในเมืองโครินธ์ หลังจากเกิดความขัดแย้งอันเจ็บปวด
    date: ราว ค.ศ. 55–56
    chapters:
      '1':
        title: การปลอบโยนจากพระเจ้าท่ามกลางความทุกข์
      '2':
        title: คำวิงวอนให้รักและให้อภัย
      '3':
        title: ชีวิตที่เปลี่ยนแปลงรับรองงานรับใช้
      '4':
        title: ประกาศพระสิริของพระคริสต์
      '5':
        title: ความรักของพระคริสต์ผลักดันงานรับใช้
      '6':
        title: อดทนต่อความทุกข์เพื่อพระเจ้า
      '7':
        title: มุ่งสู่ความบริสุทธิ์ด้วยความยำเกรง
      '8':
        title: พระคุณในชาวมาซิโดเนียสร้างแรงบันดาลใจให้แบ่งปัน
      '9':
        title: ให้ด้วยใจยินดีเพื่อบรรดาผู้เชื่อ
      '10':
        title: ยืนยันความอ่อนโยนของพระคริสต์
      '11':
        title: หวงแหนให้ดำเนินชีวิตอย่างซื่อสัตย์
      '12':
        title: อวดความอ่อนแอและพระคุณ
      '13':
        title: สำรวจตนเองว่ามีบาปหรือไม่
  Galatians:
    display_name: กาลาเทีย
    author: เปาโล
    audience: ชุมชนคริสเตียนในแคว้นกาลาเทีย (อานาโตเลียตอนกลาง) ซึ่งถูกกดดันให้เข้าสุหนัตและปฏิบัติตามธรรมบัญญัติ
    date: ราว ค.ศ. 48–55 (ยังเป็นที่ถกเถียง)
    chapters:
      '1':
        title: เปาโลปกป้องข่าวประเสริฐที่ตนประกาศ
      '2':
        title: เปาโลเผชิญหน้ากับความผิดของเปโตร
      '3':
        title: ความเชื่อของอับราฮัมทำให้เป็นคนชอบธรรม
      '4':
        title: พระคริสต์ทรงปลดปล่อยเราจากธรรมบัญญัติ
      '5':
        title: ดำเนินชีวิตด้วยความเชื่อ ไม่ใช่ด้วยธรรมบัญญัติ
      '6':
        title: ช่วยแบกภาระของกันและกัน
  Ephesians:
    display_name: เอเฟซัส
    author: เปาโล หรือศิษย์ใกล้ชิดที่เขียนในนามของเปาโล (ยังเป็นที่ถกเถียง)
    audience: ผู้อ่านคริสเตียนทั่วไปในแคว้นเอเชีย โดยชื่อสถานที่ว่า “เอเฟซัส” ไม่ปรากฏในต้นฉบับเก่าแก่ที่สุด
    date: ราวคริสต์ทศวรรษ 60 หากเปาโลเป็นผู้เขียน หรือราวคริสต์ทศวรรษ 80–90 หากเขียนในนามของเปาโล
    chapters:
      '1':
        title: พระคุณของพระเจ้าประทับตราไว้ในผู้เชื่อ
      '2':
        title: พระคริสต์ทรงนำสันติสุขมาสู่ทุกคน
      '3':
        title: ข้อล้ำลึกได้รับการเปิดเผยผ่านข่าวประเสริฐ
      '4':
        title: คำวิงวอนให้พระกายของพระคริสต์เป็นหนึ่งเดียว
      '5':
        title: เลียนแบบพระเจ้าและดำเนินชีวิตอย่างมีปัญญา
      '6':
        title: ลูกทั้งหลายจงเชื่อฟังและให้เกียรติบิดามารดา
  Philippians:
    display_name: ฟีลิปปี
    author: เปาโล ร่วมกับทิโมธี
    audience: ชุมชนคริสเตียนในเมืองฟีลิปปี ซึ่งเป็นอาณานิคมโรมันในแคว้นมาซิโดเนีย
    date: ราว ค.ศ. 60–62 เขียนจากเรือนจำ
    chapters:
      '1':
        title: เปาโลอธิษฐานเพื่อชาวฟีลิปปี
      '2':
        title: พระเยซูทรงถ่อมพระองค์และได้รับการยกขึ้นสูง
      '3':
        title: ชื่นชมยินดีที่ได้รู้จักพระคริสต์
      '4':
        title: ยืนหยัดมั่นคงด้วยความยินดี
  Colossians:
    display_name: โคโลสี
    author: เปาโล ร่วมกับทิโมธี หรือศิษย์ใกล้ชิดที่เขียนในนามของเปาโล (ยังเป็นที่ถกเถียง)
    audience: คริสเตียนในเมืองโคโลสี แถบลุ่มแม่น้ำไลคัส ซึ่งกำลังเผชิญคำสอนที่ผสมผสานความเชื่อหลายแบบ
    date: ราว ค.ศ. 60–62 หากเปาโลเป็นผู้เขียน หรือหลังจากนั้นหากเขียนในนามของเปาโล
    chapters:
      '1':
        title: เปาโลอธิษฐานเพื่อความเชื่อของชาวโคโลสี
      '2':
        title: เปาโลหนุนใจผู้เชื่อให้มั่นคงในพระคริสต์
      '3':
        title: อยู่เหนือบาปและดำเนินชีวิตด้วยความรัก
      '4':
        title: เปาโลขอคำอธิษฐานขณะถูกจองจำและกล่าวหนุนใจ
  1 Thessalonians:
    display_name: 1 เธสะโลนิกา
    author: เปาโล ร่วมกับสิลวานัสและทิโมธี
    audience: ชุมชนคริสเตียนที่เพิ่งก่อตั้งในเมืองเธสะโลนิกา ซึ่งกำลังเผชิญการข่มเหง
    date: ราว ค.ศ. 50–51 น่าจะเป็นจดหมายของเปาโลฉบับเก่าแก่ที่สุดที่ยังคงอยู่
    chapters:
      '1':
        title: พระคุณ สันติสุข ความเชื่อ ความรัก และความหวัง
      '2':
        title: ประกาศอย่างกล้าหาญด้วยเจตนาบริสุทธิ์
      '3':
        title: ทิโมธีหนุนใจท่ามกลางความทุกข์
      '4':
        title: เปาโลหนุนใจให้ดำเนินชีวิตบริสุทธิ์
      '5':
        title: เฝ้าระวังและรอคอยความรอด
  2 Thessalonians:
    display_name: 2 เธสะโลนิกา
    author: เปาโล (ยังเป็นที่ถกเถียง นักวิชาการบางคนเห็นว่าเขียนในนามของเปาโล)
    audience: ชุมชนคริสเตียนในเมืองเธสะโลนิกา โดยกล่าวถึงความสับสนเรื่องวาระสุดท้าย
    date: ราว ค.ศ. 51 หากเปาโลเป็นผู้เขียน
    chapters:
      '1':
        title: พระเจ้าประทานบำเหน็จแก่ผู้ถูกข่มเหงที่ซื่อสัตย์
      '2':
        title: การกบฏจะเกิดขึ้นก่อนพระคริสต์เสด็จมา
      '3':
        title: เปาโลอธิษฐานให้คริสตจักรเติบโต
  1 Timothy:
    display_name: 1 ทิโมธี
    author: เปาโล หรือศิษย์ที่เขียนในนามของเปาโล (จดหมายอภิบาลเหล่านี้ได้รับการยอมรับอย่างกว้างขวางว่าเขียนในนามของเปาโล)
    audience: ทิโมธีในฐานะผู้แทนของเปาโลที่เมืองเอเฟซัส และเป็นคู่มือแนะแนวการจัดระเบียบคริสตจักรในยุคต่อมา
    date: ราวกลางคริสต์ทศวรรษ 60 หากเปาโลเป็นผู้เขียน หรือราว ค.ศ. 90–110 หากเขียนในนามของเปาโล
    chapters:
      '1':
        title: เปาโลขอให้ทิโมธีอยู่ต่อ
      '2':
        title: อธิษฐานเพื่อผู้ปกครองและดำเนินชีวิตอย่างสงบสุข
      '3':
        title: ยึดมั่นคุณสมบัติของผู้นำคริสตจักร
      '4':
        title: ปฏิเสธผู้สอนเท็จและเรื่องปรัมปรา
      '5':
        title: ให้เกียรติหญิงม่ายและผู้อาวุโสอย่างเหมาะสม
      '6':
        title: เปาโลแนะนำทิโมธีเรื่องทรัพย์สมบัติ
  2 Timothy:
    display_name: 2 ทิโมธี
    author: เปาโล หรือศิษย์ที่เขียนในนามของเปาโล
    audience: ทิโมธี โดยนำเสนอเสมือนคำอำลาของเปาโลจากเรือนจำ
    date: ราวกลางคริสต์ทศวรรษ 60 หากเปาโลเป็นผู้เขียน หรือราว ค.ศ. 90–110 หากเขียนในนามของเปาโล
    chapters:
      '1':
        title: ทิโมธีจงยืนหยัดมั่นคงในพระคุณ
      '2':
        title: อดทนต่อความทุกข์เพื่อพระคริสต์
      '3':
        title: คำเตือนให้หลีกเลี่ยงผู้สอนเท็จ
      '4':
        title: ประกาศอย่างซื่อสัตย์แก่ทุกคน
  Titus:
    display_name: ทิตัส
    author: เปาโล หรือศิษย์ที่เขียนในนามของเปาโล
    audience: ทิตัสในฐานะผู้แทนของเปาโลบนเกาะครีต
    date: ราวกลางคริสต์ทศวรรษ 60 หากเปาโลเป็นผู้เขียน หรือราว ค.ศ. 90–110 หากเขียนในนามของเปาโล
    chapters:
      '1':
        title: เปาโลสั่งสอนทิตัสที่เกาะครีต
      '2':
        title: สอนคนทุกวัยให้ดำเนินชีวิตตามพระคุณ
      '3':
        title: ดำเนินชีวิตอย่างถ่อมตนขณะรอคอยพระคริสต์
  Philemon:
    display_name: ฟีเลโมน
    author: เปาโล ร่วมกับทิโมธี
    audience: ฟีเลโมน คริสเตียนผู้เป็นเจ้าของทาส ว่าด้วยโอเนสิมัส ทาสของเขาที่หลบหนีไป
    date: ราว ค.ศ. 60–62
    chapters:
      '1':
        title: เปาโลวิงวอนขออิสรภาพให้โอเนสิมัส
  Hebrews:
    display_name: ฮีบรู
    author: ไม่ทราบชื่อผู้เขียน ตามธรรมเนียมมีผู้เสนอชื่อเปาโล อปอลโล บารนาบัส ปริสสิลลา และคนอื่น ๆ แต่ยังไม่มีข้อเสนอใดเป็นที่ยอมรับร่วมกัน
    audience: คริสเตียนชาวยิวที่ใช้ภาษากรีก ซึ่งถูกชักจูงให้ละทิ้งความเชื่อที่ตนประกาศในฐานะคริสเตียนและหวนกลับไป
    date: ราว ค.ศ. 60–95
    chapters:
      '1':
        title: พระเจ้าตรัสผ่านพระบุตรของพระองค์
      '2':
        title: พระเยซูทรงช่วยให้รอดผ่านความทุกข์
      '3':
        title: จับจ้องพระเยซูผู้ทรงซื่อสัตย์
      '4':
        title: เข้าสู่การพักสงบที่พระเจ้าทรงสัญญา
      '5':
        title: พระคริสต์ทรงถวายเครื่องบูชาอันสมบูรณ์
      '6':
        title: ก้าวต่อไปสู่ความเป็นผู้ใหญ่ฝ่ายจิตวิญญาณ
      '7':
        title: พระเยซูทรงเป็นปุโรหิตตลอดนิรันดร์ตามแบบเมลคีเซเดค
      '8':
        title: พันธสัญญาใหม่โดยพระโลหิตของพระเยซู
      '9':
        title: พระเยซูเสด็จเข้าสู่สถานนมัสการแท้จริงในสวรรค์
      '10':
        title: เข้ามาใกล้โดยพระโลหิตของพระคริสต์
      '11':
        title: ความเชื่อของบรรพชนยืนยง
      '12':
        title: อดทนต่อความทุกข์กับพระเยซู
      '13':
        title: ดำเนินชีวิตด้วยความรักและความไว้วางใจ
  James:
    display_name: ยากอบ
    author: ตามธรรมเนียมเชื่อว่าเป็นยากอบ น้องชายของพระเยซู ส่วนนักวิชาการสมัยใหม่มีความเห็นแตกต่างกันว่าเป็นผลงานของเขาจริงหรือเขียนโดยใช้นามของเขา
    audience: ชุมนุมคริสตชนชาวยิวที่กระจัดกระจายอยู่ต่างแดน
    date: ราวคริสต์ทศวรรษ 50–60 หากเป็นผลงานของเขาจริง หรือราวปลายคริสต์ศตวรรษที่ 1 หากเขียนโดยใช้นามของเขา
    chapters:
      '1':
        title: ความเชื่อที่ผ่านการทดสอบยืนหยัดได้
      '2':
        title: ความเชื่อที่ไม่มีการกระทำก็ตายแล้ว
      '3':
        title: ควบคุมลิ้นและพูดอย่างมีปัญญา
      '4':
        title: การทะเลาะวิวาทเกิดจากความเห็นแก่ตัว
      '5':
        title: การพิพากษาผู้มั่งคั่งที่กดขี่ใกล้เข้ามา
  1 Peter:
    display_name: 1 เปโตร
    author: ตามธรรมเนียมเชื่อว่าเป็นผลงานของอัครทูตเปโตร โดยมีสิลวานัสเป็นผู้จดบันทึก แต่นักวิชาการบางคนเห็นว่าเขียนโดยใช้นามของเปโตร
    audience: คริสตชนในแคว้นเอเชียไมเนอร์ของจักรวรรดิโรมันซึ่งกำลังเผชิญความเป็นปฏิปักษ์จากสังคม
    date: ราวคริสต์ทศวรรษ 60 หากเป็นผลงานของเปโตร หรือราวคริสต์ทศวรรษ 70–90 หากเขียนโดยใช้นามของเขา
    chapters:
      '1':
        title: ความหวังในมรดกแห่งสวรรค์
      '2':
        title: ผู้เชื่อถูกก่อขึ้นบนศิลาที่มีชีวิต
      '3':
        title: ภรรยาให้เกียรติพระคริสต์ด้วยชีวิต
      '4':
