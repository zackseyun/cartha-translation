  Gospel of Peter:
    display_name: พระกิตติคุณของเปโตร
    author: ไม่ทราบผู้เขียน เรื่องราวที่หลงเหลืออยู่เล่าด้วยน้ำเสียงของเปโตรและได้รับการสืบทอดภายใต้ชื่อของเขา แต่ไม่ถือว่าเป็นผลงานของอัครทูตเปโตรในประวัติศาสตร์
