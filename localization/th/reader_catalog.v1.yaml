  Epistle of Barnabas:
    display_name: จดหมายของบารนาบัส
    author: ไม่ทราบผู้เขียน ตามประเพณีเคยเชื่อมโยงงานชิ้นนี้กับบารนาบัสผู้ร่วมงานของเปาโล แต่วงวิชาการสมัยใหม่ไม่ยอมรับการระบุผู้เขียนเช่นนั้น
    audience: คริสตชนต่างชาติที่ได้รับการสอนให้ถือว่าพระคัมภีร์ของอิสราเอลเป็นของตนผ่านการตีความโดยเชื่อมโยงกับพระคริสต์และในเชิงอุปมานิทัศน์ พร้อมทั้งแยกอัตลักษณ์แห่งพันธสัญญาของตนออกจากแนวปฏิบัติของชาวยิว
    date: โดยทั่วไปกำหนดอายุไว้ระหว่างการทำลายพระวิหารเยรูซาเล็มใน ค.ศ. 70 กับช่วงต้นคริสต์ศตวรรษที่ 2 และมักระบุไว้ราว ค.ศ. 80–130
