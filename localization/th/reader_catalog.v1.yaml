      '3':
        title: ถ้อยคำเผยความจริงแท้ฝ่ายจิตวิญญาณ
      '4':
        title: พระคริสต์ทรงไถ่จากการเป็นเชลยฝ่ายจิตวิญญาณ
      '5':
        title: พระเยซูทรงแยกแยะพระบิดาจากบิดาทางโลก
      '6':
        title: พระเยซูทรงเปิดเผยความจริงของพระเจ้าที่ซ่อนอยู่
      '7':
        title: การเป็นขึ้นจากตายเปลี่ยนแปลงชีวิตในกาย
      '8':
        title: พระเยซูทรงเปิดเผยพระองค์ทีละน้อย
      '9':
        title: บุตรฝ่ายจิตวิญญาณทวีจำนวนขึ้นในชีวิตอันยั่งยืน
      '10':
        title: ผู้สมบูรณ์ฝ่ายจิตวิญญาณรับใช้ทุกคน
      '11':
        title: บัพติศมาเปลี่ยนชีวิตให้เป็นอมตะ
      '12':
        title: ความล้ำลึกแห่งการสมรสฟื้นฟูเอกภาพอันศักดิ์สิทธิ์
      '13':
        title: ความจริงจากพระเจ้านำมาซึ่งการเกิดใหม่ฝ่ายจิตวิญญาณ
      '14':
        title: พระคริสต์ทรงฟื้นฟูเอกภาพและชีวิต
      '15':
        title: การเป็นขึ้นจากตายปลุกชีวิตแท้ให้ตื่นขึ้นในบัดนี้
      '16':
        title: ความเชื่อเติบโตเต็มที่โดยพระคุณของพระเจ้า
      '17':
        title: พระเยซูทรงเปิดโปงและขจัดความชั่ว
      '18':
