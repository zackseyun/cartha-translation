    date: โดยทั่วไปสืบย้อนไปถึงคริสต์ศตวรรษที่ 2 แต่ข้อความที่หลงเหลืออยู่มีฉบับเรียบเรียงภาษากรีกหลายฉบับซึ่งแตกต่างกันอย่างมาก รวมทั้งฉบับแปลยุคแรก ๆ
