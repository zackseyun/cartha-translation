    author: โพลีคาร์ป บิชอปแห่งสเมอร์นา นักวิชาการบางคนเห็นว่าข้อความที่สืบทอดมานี้เป็นการรวมเนื้อหาที่ส่งไปในมากกว่าหนึ่งช่วงเวลา
    audience: ชุมชนคริสตชนที่เมืองฟีลิปปี ซึ่งได้ขอจดหมายของอิกเนเชียส และได้รับคำแนะนำเรื่องความเชื่อ การประพฤติ ผู้นำ เงินทอง และความพากเพียร
    date: ต้นถึงกลางคริสต์ศตวรรษที่ 2 อย่างน้อยบางส่วนเชื่อมโยงอย่างใกล้ชิดกับการเดินทางของอิกเนเชียส ส่วนข้อเสนอที่ว่าจดหมายนี้ประกอบขึ้นจากหลายส่วนเปิดโอกาสให้เนื้อหาบางตอนอาจเขียนขึ้นในเวลาหลังจากนั้นเล็กน้อย
