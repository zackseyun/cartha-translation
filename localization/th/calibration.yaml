  issues:
  - คำบรรยายผู้เขียนปฐมกาลในฉบับร่างมีโครงสร้างประโยคไม่สมบูรณ์ตรงข้อความเรื่องการนำแหล่งข้อมูลมารวมและการบรรณาธิการภายหลัง
  - บทสรุปปฐมกาลควรระบุให้ชัดว่าพระสัญญาแห่งพันธสัญญาเริ่มผ่านครอบครัวของอับราฮัม อิสอัค ยาโคบ และโยเซฟ ไม่ใช่ให้อนุประโยคห้อยท้ายคลุมเครือ
  - คำแปล John 1:1 และเชิงอรรถควรคงความแตกต่างระหว่าง “พระวาทะทรงเป็นพระเจ้า” กับทางเลือกเชิงถ้อยคำ โดยไม่เพิ่มคำอธิบายนอกแหล่งข้อมูล
  - โรม 3:25 ควรแปลกริยา “presented” ว่า “ทรงเสนอ” และใช้ “เครื่องบูชาเพื่อการลบมลทินบาป” เพื่อสะท้อน atoning sacrifice โดยคงทางเลือกในเชิงอรรถ
  - 1 เปโตร 1:13 ควรสะท้อนว่าพระคุณ “กำลังนำมา” และแปล Jesus the Messiah ให้ชัดเจนว่า “พระเยซูผู้เป็นพระเมสสิยาห์”
