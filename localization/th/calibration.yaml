book_localizations:
- source_title: Genesis
  title: ปฐมกาล
  author: ไม่ทราบผู้เขียน ตามธรรมประเพณีเชื่อว่าโมเสสเป็นผู้เขียน แต่นักวิชาการสมัยใหม่เห็นว่าหนังสือนี้มีประวัติการเรียบเรียงยาวนาน โดยแหล่งข้อมูลต่าง ๆ ถูกนำมารวมกันและได้รับการบรรณาธิการในภายหลัง
  audience: ชนชาติอิสราเอลในฐานะประชากรแห่งพันธสัญญา เพื่อวางรากฐานเรื่องราวต้นกำเนิดของประชากรนี้ไว้ในการทรงสร้าง การทรงเลือก และพระสัญญาของพระเจ้า
  date: เรียบเรียงตลอดช่วงเวลาหลายศตวรรษ และได้รูปแบบที่สืบทอดมาราวศตวรรษที่ 6–5 ก่อนคริสต์ศักราช ในช่วงหรือหลังการเป็นเชลยที่บาบิโลน
  summary: ปฐมกาลเล่าถึงการทรงสร้าง การกบฏและการกระจัดกระจายของมนุษยชาติ และเรื่องราวครอบครัวของอับราฮัม อิสอัค ยาโคบ และโยเซฟ ซึ่งเป็นครอบครัวที่พระสัญญาแห่งพันธสัญญาของพระเจ้าต่ออิสราเอลเริ่มต้นขึ้นผ่านพวกเขา
- source_title: John
  title: ยอห์น
  author: ไม่ทราบผู้เขียน ตามธรรมประเพณีเชื่อว่าอัครทูตยอห์นหรือ “สาวกที่พระเยซูทรงรัก” เป็นผู้เขียน
  audience: ชุมชนคริสเตียนที่มีความตึงเครียดกับศาสนายิวในธรรมศาลา และก่อตัวขึ้นรอบคำพยานของสาวกที่พระเยซูทรงรัก
  date: ราว ค.ศ. 90–110
  summary: ยอห์นนำเสนอพระเยซูว่าเป็นพระวาทะนิรันดร์ ผู้ทรงสำแดงพระบิดา ประทานชีวิตผ่านการวางใจในพระองค์ และทรงได้รับพระเกียรติผ่านหมายสำคัญ การสิ้นพระชนม์ และการคืนพระชนม์ของพระองค์
- source_title: Gospel of Thomas
  title: พระวรสารของโธมัส
  author: ไม่ทราบผู้เขียน บทนำระบุว่ารวมพระดำรัสนี้เป็นผลงานของ “ดิดิมอส ยูดาส โธมัส” ตัวบทฉบับเต็มที่หลงเหลืออยู่มีเพียงฉบับแปลภาษาคอปติกจากคริสต์ศตวรรษที่ 4 ซึ่งพบที่นากฮัมมาดี (NHC II,2) และมีชิ้นส่วนภาษากรีกสามชิ้นจากออกซีริงคัส
  audience: ผู้อ่านชาวคริสต์ซึ่งได้รับอิทธิพลจากวรรณกรรมปัญญาแบบซีเรียและแนวคิดก่อนลัทธินอสติก โดยมุ่งสู่การรู้จักตนเองแบบเร้นลับผ่านพระดำรัสของพระเยซู
  date: ต้นฉบับภาษากรีกน่าจะเขียนราว ค.ศ. 50–140 ส่วนต้นฉบับภาษาคอปติกมีอายุราว ค.ศ. 340
  summary: พระวรสารของโธมัสเป็นชุดพระดำรัสที่ถือว่าเป็นคำของพระเยซู หนังสือนี้ไม่มีเรื่องราวต่อเนื่อง และเรียกร้องผู้อ่านซ้ำ ๆ ให้ค้นพบความหมายของพระดำรัสเหล่านั้น
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: ปฐมกาล 1:1
  text: เมื่อพระเจ้าทรงเริ่มสร้างฟ้าสวรรค์และแผ่นดินโลก[a]—
  translator_note: '[a] คำแปลตามธรรมประเพณีถือข้อความนี้เป็นประโยคสมบูรณ์ว่า “ในปฐมกาล พระเจ้าทรงสร้างฟ้าสวรรค์และแผ่นดินโลก” แต่ภาษาฮีบรูเข้าใจได้เป็นธรรมชาติกว่าว่าเป็นข้อความเกริ่นนำสิ่งที่ตามมา โดยการกระทำหลักคือ “พระเจ้าตรัส” ในข้อ 3'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: ปัญญาจารย์ 1:2
  text: “ไอระเหยแห่งไอระเหย[a]” โคเฮเลท[b] กล่าว “ทุกสิ่งล้วนเป็นไอระเหย—ดำรงอยู่เพียงชั่วครู่ จับไว้ไม่ได้ และมักไม่เป็นอย่างที่เราคาด”
  translator_note: '[a] คำฮีบรู hevel มีความหมายตรงตัวว่า “ลมหายใจ” หรือ “ไอระเหย” ตลอดหนังสือปัญญาจารย์ คำนี้บรรยายสิ่งที่ผ่านไปอย่างรวดเร็ว ไม่อาจยึดถือหรือเข้าใจได้ทั้งหมด และมักกลับกลายไปจากที่ผู้คนคาดไว้ คำว่า “ไอระเหย” รักษาภาพพจน์นี้โดยไม่สรุปว่าทุกสิ่งไร้ความหมาย อีกทางหนึ่งอาจแปลว่า “ลมหายใจ” “เป็นเพียงลมหายใจ” หรือ “ไม่จีรัง” [b] โคเฮเลทเป็นชื่อหรือสมญาภาษาฮีบรูของผู้เขียน มักแปลว่า “อาจารย์” หรือ “นักเทศน์” แต่ที่นี่คงคำว่า “โคเฮเลท” ไว้เพื่อเปิดรับความหมายที่เป็นไปได้ทั้งหมด โดยไม่ให้น้ำหนักแก่การตีความใดเป็นพิเศษ'
- source_path: nt/john/001/001.yaml
  reference: ยอห์น 1:1
  text: ในปฐมกาล[b] พระวาทะทรงดำรงอยู่แล้ว พระวาทะทรงอยู่กับพระเจ้า และพระวาทะทรงเป็นพระเจ้า[a]
  translator_note: '[a] หรือ “พระวาทะทรงมีสภาวะเป็นพระเจ้า” หรือ “พระเจ้าทรงเป็นอย่างไร พระวาทะก็ทรงเป็นอย่างนั้น” ถ้อยคำภาษากรีกยืนยันว่าพระวาทะทรงเป็นพระเจ้าอย่างเต็มเปี่ยม ขณะเดียวกันก็แยกพระวาทะออกจากพระเจ้าที่กล่าวถึงในวลีก่อนหน้า [b] คำขึ้นต้นนี้สะท้อนปฐมกาล 1:1 และเชื่อมโยงพระวาทะเข้ากับจุดเริ่มต้นของการทรงสร้าง คำว่า “ทรงดำรงอยู่แล้ว” สื่อว่าพระวาทะทรงดำรงอยู่เมื่อปฐมกาลมาถึง มิได้เพิ่งเกิดขึ้นในเวลานั้น อีกทางหนึ่งอาจแปลว่า “ทรงอยู่” หรือ “ทรงดำรงอยู่”'
- source_path: nt/romans/003/025.yaml
  reference: โรม 3:25
  text: พระเจ้าทรงเสนอพระองค์ไว้เป็นเครื่องบูชาเพื่อการลบมลทินบาป[a] โดยผ่านความเชื่อในพระโลหิตของพระองค์[b] พระองค์ทรงทำเช่นนี้เพื่อสำแดงความชอบธรรม[c] ของพระองค์ เพราะพระองค์ทรงละเว้นบาปที่ผู้คนทำไว้ในอดีต
  translator_note: '[a] หรือ “เครื่องบูชาระงับพระพิโรธ” หรือ “พระที่นั่งกรุณา” ซึ่งเป็นฝาทองคำของหีบพันธสัญญา ที่ซึ่งมีการประพรมเลือดลบมลทินบาปในพันธสัญญาเดิม [b] หรือ “โดยผ่านความเชื่อ ด้วยพระโลหิตของพระองค์” [c] หรือ “ความยุติธรรม”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 เปโตร 1:13
  text: เพราะฉะนั้น จงเตรียมจิตใจของท่านให้พร้อมลงมือทำ[a] จงมีสติแจ่มชัดอย่างเต็มที่ และฝากความหวังทั้งหมดไว้กับพระคุณซึ่งกำลังนำมาให้ท่านเมื่อพระเยซูผู้เป็นพระเมสสิยาห์ทรงปรากฏ[b]
  translator_note: '[a] ภาษากรีกกล่าวตรงตัวว่า “จงคาดเอวแห่งจิตใจของท่าน” เป็นภาพของการรวบชายเสื้อยาวขึ้นมาคาดไว้รอบเอว เพื่อให้พร้อมลงมือทำ [b] คำกรีกที่แปลว่า “อย่างเต็มที่” และ “ทั้งหมด” อาจขยายความการมีสติแจ่มชัด การฝากความหวัง หรืออาจขยายทั้งสองอย่างก็เป็นได้'
