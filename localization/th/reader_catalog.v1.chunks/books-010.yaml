payload:
  book_metadata:
    Joel:
      display_name: โยเอล
      author: โยเอล บุตรเปธูเอล
      audience: ชาวยูดาห์หลังการเนรเทศ ซึ่งกำลังรับมือกับภัยพิบัติตั๊กแตนในฐานะหมายสำคัญแห่งวันของพระยาห์เวห์
      date: น่าจะราวศตวรรษที่ 5–4 ก่อนคริสต์ศักราช
    Amos:
      display_name: อาโมส
      author: อาโมสแห่งเทโคอา คนเลี้ยงแกะชาวยูดาห์ผู้ประกาศในอาณาจักรเหนือ
      audience: ชาวอิสราเอลเหนือในสมัยเยโรโบอัมที่ 2 ซึ่งเป็นช่วงที่รุ่งเรืองแต่เต็มไปด้วยความอยุติธรรม
      date: ราว 760–750 ปีก่อนคริสต์ศักราช
    Obadiah:
      display_name: โอบาดีห์
      author: โอบาดีห์
      audience: ชาวยูดาห์หลังจากเอโดมหักหลังเยรูซาเล็ม เป็นคำพยากรณ์ถึงความพินาศของเอโดม
      date: ไม่นานหลัง 586 ปีก่อนคริสต์ศักราช
    Jonah:
      display_name: โยนาห์
      author: ไม่ทราบผู้เขียน ตัวเอกคือโยนาห์ บุตรอามิททัย
      audience: ชาวอิสราเอลหลังการเนรเทศ เป็นเรื่องเชิงเสียดสีที่ตำหนิการปิดกั้นผู้คนต่างชาติ และยืนยันว่าพระเจ้าทรงเมตตาคนนอกด้วย
      date: น่าจะราวศตวรรษที่ 5–4 ก่อนคริสต์ศักราช
    Micah:
      display_name: มีคาห์
      author: มีคาห์แห่งโมเรเชท
      audience: ชาวยูดาห์ช่วงปลายศตวรรษที่ 8 ก่อนคริสต์ศักราช โดยเฉพาะคนยากจนในชนบทที่ถูกชนชั้นนำในเมืองเอาเปรียบ
      date: ราว 740–700 ปีก่อนคริสต์ศักราช
    Nahum:
      display_name: นาฮูม
      author: นาฮูมแห่งเอลโคช
      audience: ชาวยูดาห์ที่ยินดีกับความพินาศของนีนะเวห์ซึ่งใกล้เข้ามา
      date: ไม่นานก่อน 612 ปีก่อนคริสต์ศักราช
    Habakkuk:
      display_name: ฮาบากุก
      author: ฮาบากุก
      audience: ชาวยูดาห์ที่กำลังเผชิญการผงาดขึ้นของบาบิโลน เป็นบทสนทนาระหว่างผู้เผยพระวจนะกับพระเจ้าเรื่องความยุติธรรม
      date: ราวปลายศตวรรษที่ 7 ก่อนคริสต์ศักราช
    Zephaniah:
      display_name: เศฟันยาห์
      author: เศฟันยาห์ บุตรคูชี
      audience: ชาวยูดาห์ในรัชสมัยโยสิยาห์ ก่อนที่พระองค์จะทรงเริ่มการปฏิรูปไม่นาน
      date: ราว 640–609 ปีก่อนคริสต์ศักราช
    Haggai:
      display_name: ฮักกัย
      author: ฮักกัย
      audience: ผู้กลับจากการเนรเทศซึ่งกำลังสร้างพระวิหารขึ้นใหม่ในรัชสมัยดาริอัส
      date: 520 ปีก่อนคริสต์ศักราช
    Zechariah:
      display_name: เศคาริยาห์
      author: เศคาริยาห์ บุตรเบเรคิยาห์ ส่วนบทที่ 9–14 น่าจะมาจากผู้เขียนในยุคหลัง
      audience: ผู้กลับจากการเนรเทศซึ่งกำลังสร้างพระวิหารขึ้นใหม่ รวมถึงชุมชนหลังการเนรเทศในยุคต่อมา
      date: บทที่ 1–8 ราว 520–518 ปีก่อนคริสต์ศักราช ส่วนบทที่ 9–14 อาจเขียนขึ้นราวหนึ่งศตวรรษต่อมา
    Malachi:
      display_name: มาลาคี
      author: ไม่ทราบผู้เขียน คำว่า “มาลาคี” หมายถึง “ผู้ส่งสารของเรา”
      audience: ชาวยูดาห์หลังการเนรเทศภายใต้การปกครองของเปอร์เซีย ซึ่งเริ่มละเลยการนมัสการและความซื่อสัตย์
      date: ราวกลางศตวรรษที่ 5 ก่อนคริสต์ศักราช
    Matthew:
      display_name: มัทธิว
      author: ไม่ทราบผู้เขียน ตามธรรมประเพณีถือว่าอัครทูตมัทธิวเป็นผู้เขียน นักวิชาการสมัยใหม่เห็นว่าผู้เขียนเป็นคริสตชนชาวยิวที่ใช้ภาษากรีก โดยอาศัยเนื้อหาจากมาระโกและแหล่งข้อมูลที่คล้ายกับเอกสารคิว
      audience: ชุมชนคริสตชนชาวยิวที่กำลังขบคิดว่าความเชื่อของตนสืบเนื่องและแตกต่างจากศาสนายิวในธรรมศาลาอย่างไร
      date: ราว ค.ศ. 80–90
    Mark:
      display_name: มาระโก
      author: ไม่ทราบผู้เขียน ตามธรรมประเพณีเชื่อมโยงหนังสือนี้กับยอห์นมาระโก ผู้ร่วมเดินทางของเปโตร
      audience: ชุมชนคริสตชนที่ใช้ภาษากรีก อาจอยู่ในกรุงโรม และกำลังเผชิญหรือใกล้เผชิญภัยคุกคามจากการข่มเหง
      date: ราว ค.ศ. 65–75 ในช่วงใกล้เคียงกับสงครามยิวและการทำลายพระวิหาร
  chapter_titles:
