      author: ผู้เขียนหลายคนในช่วงเวลาหลายศตวรรษ โดยบทที่ 1–39 มีรากฐานมาจากอิสยาห์แห่งเยรูซาเล็มในศตวรรษที่ 8 ก่อนคริสตกาล ส่วนบทที่ 40–55 (เรียกว่า “อิสยาห์ภาคสอง”) และบทที่ 56–66 (เรียกว่า “อิสยาห์ภาคสาม”) สะท้อนช่วงการเป็นเชลยและการกลับคืนมา
      audience: ชาวยูดาห์ในช่วงที่ถูกอัสซีเรียคุกคาม ช่วงเป็นเชลยในบาบิโลน และช่วงฟื้นฟูหลังการเป็นเชลย ตามลำดับ
      date: เรียบเรียงขึ้นในช่วงประมาณปลายศตวรรษที่ 8 ถึงศตวรรษที่ 5 ก่อนคริสตกาล
    Jeremiah:
      display_name: เยเรมีย์
      author: เยเรมีย์แห่งอานาโธท โดยมีบารุคอาลักษณ์ของเขาและผู้เรียบเรียงในสมัยหลังมีส่วนแก้ไขเพิ่มเติมอย่างมาก
      audience: ชาวยูดาห์ในช่วงก่อน ระหว่าง และหลังการพิชิตของบาบิโลน
      date: ปลายศตวรรษที่ 7 ถึงต้นศตวรรษที่ 6 ก่อนคริสตกาล
