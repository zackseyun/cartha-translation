payload:
  book_metadata:
    James:
      display_name: ยากอบ
      author: ตามธรรมเนียมเชื่อว่าเป็นยากอบ น้องชายของพระเยซู ส่วนนักวิชาการสมัยใหม่มีความเห็นแตกต่างกันว่าเป็นผลงานของเขาจริงหรือเขียนโดยใช้นามของเขา
      audience: ชุมนุมคริสตชนชาวยิวที่กระจัดกระจายอยู่ต่างแดน
      date: ราวคริสต์ทศวรรษ 50–60 หากเป็นผลงานของเขาจริง หรือราวปลายคริสต์ศตวรรษที่ 1 หากเขียนโดยใช้นามของเขา
    1 Peter:
      display_name: 1 เปโตร
      author: ตามธรรมเนียมเชื่อว่าเป็นผลงานของอัครทูตเปโตร โดยมีสิลวานัสเป็นผู้จดบันทึก แต่นักวิชาการบางคนเห็นว่าเขียนโดยใช้นามของเปโตร
      audience: คริสตชนในแคว้นเอเชียไมเนอร์ของจักรวรรดิโรมันซึ่งกำลังเผชิญความเป็นปฏิปักษ์จากสังคม
      date: ราวคริสต์ทศวรรษ 60 หากเป็นผลงานของเปโตร หรือราวคริสต์ทศวรรษ 70–90 หากเขียนโดยใช้นามของเขา
    2 Peter:
      display_name: 2 เปโตร
      author: ตามธรรมเนียมเชื่อว่าเป็นผลงานของเปโตร แต่นักวิชาการสมัยใหม่จำนวนมากเห็นว่าเขียนโดยใช้นามของเปโตร
      audience: คริสตชนที่เผชิญกับผู้เยาะเย้ยซึ่งปฏิเสธการเสด็จกลับมาของพระคริสต์
      date: ราวต้นคริสต์ศตวรรษที่ 2
    1 John:
      display_name: 1 ยอห์น
      author: ไม่ทราบชื่อผู้เขียน ตามธรรมเนียมเชื่อว่าเป็นอัครทูตยอห์นหรือผู้อาวุโสในกลุ่มของยอห์น
      audience: ชุมชนในกลุ่มของยอห์นภายหลังการแตกแยก ซึ่งกำลังนิยามว่าใครเป็นสมาชิกของชุมชน
      date: ราว ค.ศ. 90–110
    2 John:
      display_name: 2 ยอห์น
      author: “ผู้อาวุโส”
      audience: ชุมนุมคริสตชนแห่งหนึ่ง (“สุภาพสตรีผู้ได้รับเลือก”) ซึ่งได้รับคำเตือนเรื่องผู้สอนเท็จ
      date: ราว ค.ศ. 90–110
    3 John:
      display_name: 3 ยอห์น
      author: “ผู้อาวุโส”
      audience: กายอัส ผู้นำคนหนึ่งซึ่งให้ที่พักแก่มิชชันนารีที่เดินทางไปตามที่ต่าง ๆ
      date: ราว ค.ศ. 90–110
    Jude:
      display_name: ยูดา
      author: ตามธรรมเนียมเชื่อว่าเป็นยูดา น้องชายของยากอบและของพระเยซู
      audience: ชุมชนคริสตชนที่กำลังถูกผู้สอนซึ่งส่งเสริมการใช้ชีวิตอย่างไร้ศีลธรรมแทรกซึม
      date: ราวคริสต์ทศวรรษ 60–90
    Revelation:
      display_name: วิวรณ์
      author: ยอห์นแห่งปัทมอส (มีลีลาการเขียนต่างจากพระกิตติคุณเล่มที่สี่)
      audience: ชุมนุมคริสตชนเจ็ดแห่งในแคว้นเอเชียไมเนอร์ของจักรวรรดิโรมัน ซึ่งอยู่ภายใต้แรงกดดันจากจักรวรรดิ
      date: ราวคริสต์ทศวรรษ 90 ตามธรรมเนียมระบุว่าอยู่ในรัชสมัยของโดมิเชียน
    Tobit:
      display_name: โทบิต
      author: ไม่ทราบชื่อผู้เขียน
      audience: ชาวยิวพลัดถิ่นที่แสวงหาแนวทางดำเนินชีวิตด้วยความเลื่อมใส การแต่งงาน และความเชื่อในการทรงจัดเตรียมภายใต้การปกครองของชนต่างชาติ
      date: ราว 225–175 ปีก่อนคริสตกาล แต่งเป็นภาษาอาราเมค และยังพบหลักฐานฉบับภาษาฮีบรูที่คุมรานด้วย
    Judith:
      display_name: ยูดิธ
      author: ไม่ทราบชื่อผู้เขียน
      audience: ชาวยิวที่เผชิญภัยคุกคามจากชนต่างชาติ—เรื่องราวอันเด็ดเดี่ยวของการต่อต้านด้วยความเลื่อมใส
      date: ราว 150–100 ปีก่อนคริสตกาล
    Greek Additions to Esther:
      display_name: ส่วนเพิ่มเติมภาษากรีกของเอสเธอร์
      author: ไม่ทราบชื่อผู้เขียน เป็นเนื้อหาเสริมที่เพิ่มเข้ามาในเอสเธอร์ฉบับแปลภาษากรีก
      audience: ชาวยิวที่พูดภาษากรีกและต้องการเรื่องราวของเอสเธอร์ที่กล่าวถึงการอธิษฐานและพระเจ้าอย่างชัดเจน
      date: ราวศตวรรษที่ 2–1 ก่อนคริสตกาล
    Wisdom of Solomon:
      display_name: ปรีชาญาณของซาโลมอน
      author: ไม่ทราบชื่อผู้เขียน และอ้างว่าเป็นผลงานของซาโลมอนโดยใช้นามของพระองค์ แต่งเป็นภาษากรีกโดยนักเขียนชาวยิวในโลกเฮลเลนิสติก ซึ่งน่าจะอยู่ที่อเล็กซานเดรีย
      audience: ชาวยิวในโลกเฮลเลนิสติกที่กำลังสนทนากับปรัชญากรีก และปกป้องปรีชาญาณของอิสราเอลจากทางเลือกแบบนอกศาสนาและแบบละทิ้งความเชื่อ
      date: ราว 50 ปีก่อนคริสตกาล–ค.ศ. 50
  chapter_titles:
    Hebrews:
      '11':
        title: ความเชื่อของบรรพชนยืนยง
      '12':
        title: อดทนต่อความทุกข์กับพระเยซู
      '13':
        title: ดำเนินชีวิตด้วยความรักและความไว้วางใจ
    James:
      '1':
        title: ความเชื่อที่ผ่านการทดสอบยืนหยัดได้
      '2':
        title: ความเชื่อที่ไม่มีการกระทำก็ตายแล้ว
      '3':
        title: ควบคุมลิ้นและพูดอย่างมีปัญญา
      '4':
        title: การทะเลาะวิวาทเกิดจากความเห็นแก่ตัว
      '5':
        title: การพิพากษาผู้มั่งคั่งที่กดขี่ใกล้เข้ามา
    1 Peter:
      '1':
        title: ความหวังในมรดกแห่งสวรรค์
      '2':
        title: ผู้เชื่อถูกก่อขึ้นบนศิลาที่มีชีวิต
      '3':
        title: ภรรยาให้เกียรติพระคริสต์ด้วยชีวิต
      '4':
        title: ทนทุกข์เพราะทำความดีและสิ่งที่ถูกต้อง
      '5':
        title: ผู้อาวุโสดูแลด้วยแบบอย่างแห่งความเชื่อ
    2 Peter:
      '1':
        title: เปโตรสอนเรื่องการเติบโตฝ่ายจิตวิญญาณ
      '2':
        title: ผู้สอนเท็จนำการพิพากษาอันฉับพลันมา
      '3':
        title: เปโตรเตือนถึงการพิพากษาครั้งสุดท้าย
    1 John:
      '1':
        title: ความสว่างเผยให้เห็นความสัมพันธ์แท้
      '2':
        title: ความรักทำให้เรารักษาพระบัญชาของพระเจ้า
      '3':
        title: ผู้เกิดจากพระเจ้าเอาชนะบาป
      '4':
        title: ความรักแท้มาจากพระเจ้า
      '5':
        title: จงเชื่อว่าพระเยซูทรงมีชีวิตนิรันดร์
    2 John:
      '1':
        title: ผู้อาวุโสเตือนเรื่องผู้สอนเท็จ
    3 John:
      '1':
        title: ผู้อาวุโสอธิษฐานให้กายอัสเจริญรุ่งเรือง
    Jude:
      '1':
        title: ยูดาเตือนเรื่องผู้บุกรุกที่ไม่ยำเกรงพระเจ้า
    Revelation:
      '1':
        title: พระเจ้าทรงสำแดงนิมิตแก่ยอห์น
      '2':
        title: พระเยซูตรัสกับคริสตจักรเจ็ดแห่ง
      '3':
        title: พระเยซูเตือนเลาดีเซียให้กลับใจ
      '4':
        title: พระที่นั่งบนสวรรค์รุ่งโรจน์ด้วยพระสิริ
      '5':
        title: พระเมษโปดกทรงรับม้วนหนังสือและไถ่กู้
      '6':
        title: ผู้ขี่ม้าสี่คนนำวิบัติใหญ่มา
      '7':
        title: ผู้รับตราประทับร้องเพลงสรรเสริญนิรันดร์
      '8':
        title: แตรเจ็ดคันส่งเสียงประกาศการพิพากษาอันน่าสะพรึง
      '9':
        title: ฝูงตั๊กแตนทรมานคนบาปบนแผ่นดินโลก
      '10':
        title: ทูตสวรรค์ผู้ทรงฤทธิ์สาบานเกี่ยวกับวาระสุดท้าย
      '11':
        title: พยานสองคนเผยพระวจนะแล้วฟื้นขึ้น
      '12':
        title: หญิงให้กำเนิดบุตรผู้ถูกกำหนดให้ปกครอง
      '13':
        title: สัตว์ร้ายขึ้นมาจากทะเล
      '14':
        title: พระเมษโปดกทรงรวบรวมผู้ซื่อสัตย์ไว้กับพระองค์
      '15':
        title: ยอห์นเห็นพระพิโรธจากสวรรค์
      '16':
        title: เหล่าทูตสวรรค์เทชามแห่งพระพิโรธ
      '17':
        title: บาบิโลนถูกพิพากษาและพระเจ้าทรงมีชัย
      '18':
        title: สวรรค์ยินดีเมื่อบาบิโลนล่มสลาย
      '19':
        title: สวรรค์เฉลิมฉลองงานสมรสของพระเมษโปดก
      '20':
        title: ยอห์นเห็นการพิพากษาครั้งสุดท้าย
      '21':
        title: ทุกสิ่งถูกสร้างขึ้นใหม่
      '22':
        title: พระเยซูกำลังจะเสด็จมาในไม่ช้า
    Tobit:
      '1':
        title: โทบิตรำลึกถึงพระเจ้าอย่างซื่อสัตย์
      '2':
        title: โทบิตฝังศพเพื่อนบ้านที่ถูกเหยียดหยาม
      '3':
        title: โทบิตร่ำไห้และอธิษฐานขอให้ตาย
      '4':
        title: โทบิตสอนบุตรให้ดำเนินชีวิตอย่างชอบธรรม
      '5':
        title: โทบียาห์ออกเดินทางโดยมีผู้นำทาง
      '6':
        title: โทบียาห์จับปลาที่ใช้รักษาโรค
      '7':
        title: โทบียาห์แต่งงานกับซาราห์ที่เอกบาทานา
      '8':
        title: โทบียาห์แต่งงานกับซาราห์และอธิษฐาน
      '9':
        title: กาบาเอลส่งเงินคืนแก่โทบิต
      '10':
        title: โทบียาห์กลับบ้านอย่างปลอดภัย
      '11':
        title: บุตรชายช่วยให้โทบิตมองเห็นอีกครั้ง
      '12':
        title: ราฟาเอลเปิดเผยตัวตนที่แท้จริง
      '13':
        title: โทบิตอธิษฐานเพื่อเยรูซาเล็ม
      '14':
        title: โทบิตมองเห็นอนาคตของอิสราเอลล่วงหน้า
    Judith:
      '1':
        title: เนบูคัดเนสซาร์โจมตีอารฟัคซาด
      '2':
        title: โฮโลเฟอร์เนสเคลื่อนทัพไปทางตะวันตก
      '3':
        title: ชนตามชายฝั่งยอมจำนนและมอบทรัพย์สิน
      '4':
        title: อิสราเอลอดอาหารและอธิษฐานขอความช่วยเหลือ
      '5':
        title: อาคิโอร์เล่าประวัติศาสตร์ของอิสราเอล
      '6':
        title: อาคิโอร์ถูกเตือนเรื่องโฮโลเฟอร์เนส
      '7':
        title: น้ำในเบธูเลียหมดลง
      '8':
        title: ยูดิธให้คำมั่นว่าพระเจ้าจะทรงช่วยให้รอด
      '9':
        title: ยูดิธอธิษฐานขอกำลังจากพระเจ้า
      '10':
        title: ยูดิธเข้าไปในค่ายอัสซีเรีย
      '11':
        title: โฮโลเฟอร์เนสเชิญยูดิธเข้าพบ
      '12':
        title: ยูดิธแสวงหาการทรงนำของพระเจ้า
      '13':
        title: ยูดิธตัดศีรษะโฮโลเฟอร์เนส
      '14':
        title: อิสราเอลฉลองชัยชนะของยูดิธ
      '15':
        title: อิสราเอลยึดของริบจากอัสซีเรีย
      '16':
        title: ยูดิธนำร้องเพลงสรรเสริญ
    Greek Additions to Esther:
      '1':
        title: โมรเดคัยฝันและเตือนกษัตริย์
      '2':
        title: กษัตริย์ออกคำสั่งให้ทำลายล้าง
      '3':
        title: โมรเดคัยกับเอสเธอร์อธิษฐานขอความช่วยเหลือ
      '4':
        title: เอสเธอร์เข้าเฝ้ากษัตริย์
      '5':
        title: กษัตริย์ลงโทษฮามานและช่วยชาวยิว
      '6':
        title: โมรเดคัยระลึกถึงความฝันและกล่าวพยากรณ์
    Wisdom of Solomon:
      '1':
        title: พระเจ้าทรงเผยปรีชาญาณแก่ผู้แสวงหา
      '2':
        title: คนชั่วปฏิเสธความยินดีแท้ของชีวิต
      '3':
        title: วิญญาณของผู้ชอบธรรมพักอย่างสงบ
      '4':
        title: คุณธรรมได้รับเกียรติ คนอธรรมได้รับความอับอาย
      '5':
        title: ผู้ชอบธรรมเปิดโปงความชั่วอย่างกล้าหาญ
      '6':
        title: ปรีชาญาณนำไปสู่การเป็นกษัตริย์ที่แท้จริง
review:
  verdict: revise
  review_summary: แก้ไขคำแปลบางรายการเพื่อให้สอดคล้องกับข้อความต้นฉบับโดยตรง โดยเฉพาะชื่อบทที่กลับความหมายหรือเพิ่มความหมายเกินต้นฉบับ และคงโครงสร้างกับคีย์ทั้งหมดไว้ครบถ้วน
