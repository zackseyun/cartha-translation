      author: อิกเนเชียส บิชอปแห่งอันทิโอก เป็นผู้เขียนจดหมายเจ็ดฉบับในฉบับกลางที่ยอมรับกันโดยทั่วไป ส่วนจดหมายของอิกเนเชียสที่มีผู้ขยายเพิ่มเติมในภายหลังและจดหมายที่เขียนโดยใช้นามของเขาไม่รวมอยู่ในชุดนี้
      audience: ชุมนุมคริสเตียนในเอเฟซัส แมกนีเซีย ทรัลเลส โรม ฟิลาเดลเฟีย และสเมอร์นา รวมทั้งโพลีคาร์ป ซึ่งอิกเนเชียสเขียนถึงระหว่างการเดินทางไปสู่การเป็นมรณสักขี
      date: โดยทั่วไปกำหนดอายุไว้ในช่วงต้นคริสต์ศตวรรษที่ 2 มักประมาณ ค.ศ. 105–117 แม้ว่าลำดับเวลาที่แน่นอนของการเดินทางของอิกเนเชียสยังเป็นที่ถกเถียงกันอยู่
