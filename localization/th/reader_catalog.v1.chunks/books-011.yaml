      display_name: ลูกา
      author: ไม่ทราบชื่อผู้เขียน; ตามธรรมประเพณีระบุว่าเป็นลูกา ผู้ร่วมเดินทางของเปาโล
      audience: ผู้อ่านคริสเตียนกรีก-โรมันที่มีการศึกษา ซึ่งเขียนถึง “เธโอฟีลัส”
      date: ประมาณ ค.ศ. 80–90
    John:
      display_name: ยอห์น
      author: ไม่ทราบชื่อผู้เขียน; ตามธรรมประเพณีระบุว่าเป็นอัครทูตยอห์นหรือ “ศิษย์ที่พระเยซูทรงรัก”
      audience: ชุมชนคริสเตียนที่มีความตึงเครียดกับศาสนายิวในธรรมศาลา และก่อตัวขึ้นรอบคำพยานของศิษย์ที่พระเยซูทรงรัก
      date: ประมาณ ค.ศ. 90–110
      summary: ยอห์นนำเสนอพระเยซูในฐานะพระวาทะผู้ดำรงอยู่นิรันดร์ ผู้ทรงเปิดเผยพระบิดา ประทานชีวิตแก่ผู้ที่วางใจในพระองค์ และทรงได้รับพระเกียรติผ่านหมายสำคัญ การสิ้นพระชนม์ และการคืนพระชนม์ของพระองค์
    Acts:
      display_name: กิจการ
      author: ไม่ทราบชื่อผู้เขียน; เป็นผู้เขียนคนเดียวกับพระธรรมลูกา
      audience: ผู้อ่านคริสเตียนกรีก-โรมัน; เป็นเล่มที่สองของงานเขียนซึ่งเขียนถึงเธโอฟีลัส
      date: ประมาณ ค.ศ. 80–90
    Romans:
      display_name: โรม
      author: เปาโล โดยมีเทอร์ทิอัสเป็นผู้จดคำเขียน
      audience: คริสเตียนในกรุงโรม—ผู้เชื่อชาวยิวและคนต่างชาติที่มีความตึงเครียดกันเรื่องธรรมบัญญัติและอัตลักษณ์
      date: ประมาณ ค.ศ. 56–58 เขียนจากเมืองโครินธ์
