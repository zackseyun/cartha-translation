payload:
  book_metadata:
    Sirach:
      display_name: สิรัค
      author: เยชูอา เบนเอเลอาซาร์ เบนสิรา แห่งเยรูซาเล็ม; ฉบับภาษากรีกแปลโดยหลานชายของเขา
      audience: ชายหนุ่มชาวยิวที่กำลังรับการอบรมด้านปัญญาในเยรูซาเล็มยุคเฮลเลนิสติก
      date: ต้นฉบับภาษาฮีบรู ราว 195–175 ปีก่อนคริสตกาล; ฉบับแปลภาษากรีก ราว 132 ปีก่อนคริสตกาล
    Baruch:
      display_name: บารุค
      author: ไม่ทราบนาม; อ้างนามบารุค ธรรมาจารย์ของเยเรมีย์ เป็นผู้ประพันธ์โดยนามแฝง
      audience: ชาวยิวพลัดถิ่นที่ใคร่ครวญเรื่องการเนรเทศ การกลับใจ และปัญญา
      date: ราวศตวรรษที่ 2 ก่อนคริสตกาล
    1 Maccabees:
      display_name: 1 มัคคาบี
      author: ไม่ทราบนาม; น่าจะเป็นผู้ประพันธ์ในเยรูซาเล็มซึ่งเขียนเป็นภาษาฮีบรู (เหลือรอดมาเฉพาะฉบับภาษากรีก)
      audience: ชาวยิวในช่วงและหลังการกบฏของราชวงศ์ฮัสโมเนียน โดยเล่าถึงความชอบธรรมในการปกครองของราชวงศ์ฮัสโมเนียน
      date: ราว 100 ปีก่อนคริสตกาล
    2 Maccabees:
      display_name: 2 มัคคาบี
      author: ผู้ย่อความที่ไม่ทราบนาม ซึ่งย่อจากผลงานฉบับยาวกว่าของยาโซนแห่งไซรีน; เรียบเรียงเป็นภาษากรีก
      audience: ชาวยิวพลัดถิ่นที่พูดภาษากรีก โดยเน้นเรื่องการยอมตายเพื่อความเชื่อ การทรงดูแล และการเป็นขึ้นจากตาย
      date: ราว 124 ปีก่อนคริสตกาล หรือไม่นานหลังจากนั้น
