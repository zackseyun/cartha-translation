payload:
  book_metadata:
    Gospel of Mary:
      display_name: พระวรสารของมารีย์
      author: ไม่ทราบผู้เขียน งานชิ้นนี้นำเสนอว่ามารีย์เป็นผู้รับและตีความการสำแดงของพระเยซู แต่ไม่ได้กล่าวอ้างว่ามารีย์เป็นผู้เขียนพระวรสารฉบับที่หลงเหลืออยู่
      audience: ผู้อ่านคริสเตียนยุคแรกที่กำลังขบคิดเรื่องการสำแดง การขึ้นสู่แดนฝ่ายวิญญาณ สิทธิอำนาจของอัครทูต และความชอบธรรมของคำสอนของมารีย์ในหมู่สาวกของพระเยซู
      date: โดยทั่วไปกำหนดอายุไว้ในคริสต์ศตวรรษที่ 2 เศษต้นฉบับภาษากรีกที่หลงเหลืออยู่มาจากคริสต์ศตวรรษที่ 3 ส่วนพยานต้นฉบับภาษาคอปติกฉบับหลักเก็บรักษาอยู่ในประมวลต้นฉบับเบอร์ลิน 8502 ซึ่งมีอายุจากคริสต์ศตวรรษที่ 5
    Treatise on the Resurrection:
      display_name: บทนิพนธ์ว่าด้วยการเป็นขึ้นจากตาย
      author: ไม่ทราบผู้เขียน งานชิ้นนี้เรียบเรียงในรูปจดหมายจากอาจารย์ถึงศิษย์ชื่อเรกีนอส แต่ไม่อาจระบุตัวอาจารย์หรือเรกีนอสได้อย่างแน่ชัด
      audience: คริสเตียนที่แสวงหาคำสอนเรื่องการเป็นขึ้นจากตาย โดยเฉพาะผู้อ่านที่กำลังพิจารณาทั้งมิติทางกาย ทางจิตวิญญาณ และการมีส่วนในชีวิตแห่งการเป็นขึ้นจากตายในปัจจุบัน
      date: โดยทั่วไปกำหนดอายุไว้ช่วงปลายคริสต์ศตวรรษที่ 2 (มักระบุว่าราว ค.ศ. 170–200) โดยเก็บรักษาอยู่ในสำเนาภาษาคอปติกจากคริสต์ศตวรรษที่ 4 ซึ่งแปลมาจากงานภาษากรีกที่เก่ากว่า
    Dialogue of the Savior:
      display_name: บทสนทนาของพระผู้ช่วยให้รอด
      author: ไม่ทราบผู้เขียน บทสนทนานี้นำเสนอคำสอนที่เป็นการสำแดงผ่านถ้อยคำของพระเยซูในการสนทนากับยูดาส มัทธิว และมารีย์ แต่ไม่ได้ระบุว่าใครเป็นผู้รวบรวม
      audience: กลุ่มคริสเตียนยุคแรกที่สนใจการสำแดงเป็นการส่วนตัว การเป็นสาวก การรู้จักตนเอง การอธิษฐาน และการเตรียมตนอย่างเคร่งครัดเพื่อรับความรอด
      date: โดยทั่วไปถือว่าเป็นงานจากคริสต์ศตวรรษที่ 2 แม้ยังมีข้อถกเถียงเรื่องชั้นต่าง ๆ ของการเรียบเรียงและช่วงเวลาที่แน่นอน โดยเก็บรักษาอยู่ในต้นฉบับภาษาคอปติกจากคริสต์ศตวรรษที่ 4
    Exegesis on the Soul:
      display_name: คำอธิบายเรื่องจิตวิญญาณ
      author: ไม่ทราบผู้เขียน ผู้เขียนเป็นนักเทศน์คริสเตียนซึ่งนำภาพเปรียบจากพระคัมภีร์และวรรณกรรมกรีกมาอ่านใหม่ในเชิงอุปมานิทัศน์ว่าด้วยการตกต่ำ การกลับใจ และการฟื้นคืนสู่สภาพเดิมของจิตวิญญาณ
      audience: คริสเตียนที่คุ้นเคยกับพระคัมภีร์และคำตักเตือนด้านศีลธรรม ซึ่งได้รับการเรียกให้ละจากความปรารถนาอันยุ่งเหยิง มาสู่การกลับใจและการกลับเป็นหนึ่งเดียวกับสิ่งศักดิ์สิทธิ์
      date: โดยทั่วไปกำหนดอายุไว้ช่วงปลายคริสต์ศตวรรษที่ 2 หรือต้นคริสต์ศตวรรษที่ 3 โดยเก็บรักษาอยู่ในฉบับแปลภาษาคอปติกจากภาษากรีก ซึ่งมีอายุจากคริสต์ศตวรรษที่ 4
    Book of Thomas the Contender:
      display_name: หนังสือของโธมัสผู้ต่อสู้
      author: ไม่ทราบผู้เขียน ชื่อเรื่องตอนท้ายเชื่อมโยงงานชิ้นนี้กับยูดาส โธมัส และระบุว่ามัทธายอัสเป็นผู้บันทึก แต่ข้อมูลเหล่านี้เป็นการระบุบุคคลในเชิงวรรณกรรม ไม่ใช่คำกล่าวอ้างเรื่องผู้ประพันธ์ที่ตรวจสอบยืนยันได้
      audience: คริสเตียนที่โน้มเอียงไปทางการบำเพ็ญตนอย่างเคร่งครัด ซึ่งได้รับการกระตุ้นให้แสวงหาการรู้จักตนเอง ต่อต้านตัณหาทางกาย และทำความเข้าใจคำสอนส่วนตัวที่พระเยซูประทานแก่โธมัส
      date: มักกำหนดอายุไว้ช่วงปลายคริสต์ศตวรรษที่ 2 หรือต้นคริสต์ศตวรรษที่ 3 และอาจเกิดขึ้นในบริบทคริสเตียนซีเรีย โดยเก็บรักษาอยู่ในต้นฉบับภาษาคอปติกจากคริสต์ศตวรรษที่ 4
    Tripartite Tractate:
      display_name: บทนิพนธ์สามภาค
      author: ไม่ทราบผู้เขียน ผู้เขียนเป็นนักเทววิทยาคริสเตียนสายวาเลนติเนียนที่มีการศึกษาสูง และไม่อาจระบุได้อย่างแน่ชัดว่าเป็นอาจารย์คนใดที่มีชื่อเป็นที่รู้จัก
      audience: ชุมชนคริสเตียนสายวาเลนติเนียนที่ได้รับคำสอนอย่างต่อเนื่องเรื่องพระเจ้า เหล่าอิออน การทรงสร้าง พระคริสต์ คริสตจักร ความรอด และการฟื้นคืนสู่สภาพเดิมในบั้นปลาย
      date: โดยทั่วไปกำหนดอายุไว้ในคริสต์ศตวรรษที่ 3 โดยมีข้อเสนอส่วนหนึ่งว่าน่าจะมาจากช่วงครึ่งหลังของศตวรรษ ต้นฉบับภาษาคอปติกได้รับการเก็บรักษาอยู่ในประมวลต้นฉบับจุงจากคริสต์ศตวรรษที่ 4
    Apocryphon of John:
      display_name: คัมภีร์ลับของยอห์น
      author: ไม่ทราบผู้เขียน งานชิ้นนี้ใช้นามแฝงนำเสนอว่าเป็นการสำแดงของพระเยซูผู้ทรงเป็นขึ้นจากตายแก่ยอห์นบุตรเศเบดี และหลงเหลืออยู่ในฉบับเรียบเรียงโบราณมากกว่าหนึ่งแบบ
      audience: คริสเตียนในขนบการสำแดงสายเซเธียนหรือขนบที่ใกล้เคียงกัน ซึ่งแสวงหาคำอธิบายเรื่องแดนของพระเจ้า การทรงสร้าง อัตลักษณ์ของมนุษย์ และการหลุดพ้นจากเหล่าผู้ปกครองที่เป็นศัตรู
      date: รูปแบบยุคแรกน่าจะแพร่หลายอยู่ในคริสต์ศตวรรษที่ 2 ส่วนพยานต้นฉบับภาษาคอปติกที่หลงเหลืออยู่ ซึ่งรักษาทั้งฉบับเรียบเรียงแบบสั้นและแบบยาว มีอายุจากคริสต์ศตวรรษที่ 4 และ 5
