review:
  verdict: revise
  review_summary: แก้ไขถ้อยคำที่คลาดจากต้นฉบับหรือทำให้ความหมายเฉพาะเจาะจงเกินไป โดยเฉพาะ Genesis 2, 11, 23, 30, 37, 38, 41, 48–49; Exodus 1, 2, 12, 17, 22, 26, 29, 32, 35, 37; และ Leviticus 2, 3, 6 พร้อมปรับสำนวนเมทาดาทาให้เป็นกลางและตรงต้นฉบับมากขึ้น
  issues:
  - Genesis 2 ระบุว่า God 'forms' man and woman ไม่ใช่เพียง 'creates'
  - Genesis 23 ต้นฉบับกล่าวเพียงว่า Abraham buys; ไม่ได้ระบุสถานที่ฝังศพ
  - Genesis 30 'through mercy' ควรแปลให้ตรงว่าโดยพระเมตตา
  - Genesis 37 'sell him low' ไม่ควรตีความเป็นราคาถูก
  - Genesis 38 'secretly' ไม่ควรแปลเพิ่มความหมายว่าเป็นการกระทำโดยลับ
  - Genesis 41 คือการตีความความฝัน ไม่ใช่การทำนายความฝัน
  - Genesis 48 'wisely' และ Genesis 49 'over' ไม่ควรเพิ่มหรือจำกัดความหมายเกินต้นฉบับ
  - Exodus 1 'favors' ไม่เท่ากับ 'blesses'; Exodus 2 ไม่ได้ระบุว่า Moses ได้รับการช่วยจาก Pharaoh โดยตรง
  - Exodus 12 'passes through death' ไม่ควรสรุปเป็นรอดพ้นจากความตาย
  - Exodus 22 เป็นชื่อหัวข้อ ไม่ใช่ข้อความว่าความยุติธรรมได้รับการธำรง
  - Exodus 26 ไม่ควรละประธานและควรคงความหมายว่า design was revealed
  - Exodus 29 consecrated ไม่จำเป็นต้องแปลเป็นชำระให้บริสุทธิ์
  - Exodus 32 ต้นฉบับกล่าวถึงการทุบแผ่นจารึกและความโกรธ ไม่ได้ระบุความสัมพันธ์เชิงเหตุผล
  - Leviticus 2 คำว่า Him อ้างถึง LORD; Leviticus 3 ควรคงว่าเครื่องบูชาถูกวาง; Leviticus 6 'handle' ไม่ใช่เพียงดูแล
