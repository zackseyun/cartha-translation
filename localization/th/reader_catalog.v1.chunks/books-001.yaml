  book_metadata:
    Genesis:
      display_name: ปฐมกาล
      author: ไม่ทราบผู้เขียน; ตามธรรมเนียมยกให้โมเสสเป็นผู้เขียน นักวิชาการสมัยใหม่มองว่าหนังสือนี้มีประวัติการเรียบเรียงยาวนาน โดยแหล่งข้อมูลต่าง ๆ ถูกนำมาแก้ไขรวมกันในภายหลัง
      audience: อิสราเอลในอัตลักษณ์แห่งพันธสัญญา โดยวางรากฐานเรื่องราวต้นกำเนิดของประชากรไว้ในการทรงสร้าง การทรงเลือก และพระสัญญาของพระเจ้า
      date: เรียบเรียงตลอดหลายศตวรรษ; มีรูปแบบที่ได้รับสืบทอดราวศตวรรษที่ 6–5 ก่อนคริสตกาล ระหว่างหรือหลังการเป็นเชลยในบาบิโลน
      summary: ปฐมกาลเล่าเรื่องการทรงสร้าง การกบฏและการกระจัดกระจายของมนุษยชาติ และครอบครัวของอับราฮัม อิสอัค ยาโคบ และโยเซฟ ซึ่งเป็นผู้ที่พระสัญญาแห่งพันธสัญญาของพระเจ้าต่ออิสราเอลเริ่มดำเนินผ่าน
    Exodus:
      display_name: อพยพ
      author: ไม่ทราบผู้เขียน; ตามธรรมเนียมยกให้โมเสสเป็นผู้เขียน นักวิชาการสมัยใหม่มองว่าหนังสือนี้มีประวัติการเรียบเรียงยาวนาน โดยแหล่งข้อมูลต่าง ๆ ถูกนำมาแก้ไขรวมกันในภายหลัง
      audience: อิสราเอลในฐานะประชากรที่ได้รับการปลดปล่อยและผูกพันด้วยพันธสัญญา กำลังเรียนรู้ความหมายของการเป็นชนชาติของพระยาห์เวห์ภายใต้ธรรมบัญญัติของพระองค์
      date: เรียบเรียงตลอดหลายศตวรรษ; มีรูปแบบที่ได้รับสืบทอดราวศตวรรษที่ 6–5 ก่อนคริสตกาล
    Leviticus:
      display_name: เลวีนิติ
      author: ไม่ทราบผู้เขียน; ตามธรรมเนียมยกให้โมเสสเป็นผู้เขียน นักวิชาการสมัยใหม่จัดหนังสือนี้ไว้ในแหล่งเอกสารของฝ่ายปุโรหิต
      audience: ปุโรหิตชาวอิสราเอลและชุมชนผู้นมัสการ — คำสั่งเรื่องเครื่องบูชา ความบริสุทธิ์ และการจัดระเบียบชีวิตโดยมีการประทับอยู่ของพระเจ้าเป็นศูนย์กลาง
      date: มีชั้นการเรียบเรียงตั้งแต่ปลายยุคราชาธิปไตยจนถึงยุคหลังการเป็นเชลย (ราวศตวรรษที่ 7–5 ก่อนคริสตกาล)
