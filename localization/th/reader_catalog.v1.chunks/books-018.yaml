payload:
  book_metadata:
    2 Esdras:
      display_name: 2 เอสดราส
      author: ไม่ทราบผู้เขียน โดยมีกรอบเรื่องที่ได้รับการเรียบเรียงโดยคริสเตียนล้อมรอบแก่นเดิมซึ่งเป็นงานเขียนของชาวยิว (4 เอสรา บทที่ 3–14)
      audience: ชาวยิวหลัง ค.ศ. 70 ที่กำลังขบคิดเรื่องความยุติธรรมของพระเจ้าท่ามกลางความทุกข์ ต่อมามีการขยายเนื้อหาสำหรับผู้อ่านชาวคริสต์
      date: แก่นเรื่องของชาวยิวน่าจะเขียนราว ค.ศ. 100 ส่วนที่คริสเตียนเพิ่มเติมน่าจะมาจากราวคริสต์ศตวรรษที่ 2–3
    Didache:
      display_name: ดิดาเค
      author: ไม่ทราบผู้เขียน (ชื่อเรื่องหมายถึง “คำสอนของอัครทูตสิบสองคน”)
      audience: ชุมนุมคริสเตียนยุคแรก เป็นคู่มือฉบับย่อว่าด้วยจริยธรรม บัพติศมา ศีลมหาสนิท และผู้สอนที่เดินทางไปตามที่ต่าง ๆ
      date: ราวปลายคริสต์ศตวรรษที่ 1 ถึงต้นคริสต์ศตวรรษที่ 2
    Gospel of Thomas:
      display_name: พระกิตติคุณของโธมัส
      author: ไม่ทราบผู้เขียน คำขึ้นต้นระบุว่ารวมถ้อยคำนี้เป็นผลงานของ “ดิดิมอส ยูดาส โธมัส” ฉบับสมบูรณ์ที่หลงเหลืออยู่มีเพียงฉบับแปลภาษาคอปติกจากคริสต์ศตวรรษที่ 4 ซึ่งพบที่นากฮัมมาดี (NHC II,2) พร้อมกับชิ้นส่วนภาษากรีกสามชิ้นจากออกซีรินคัส
      audience: ผู้อ่านชาวคริสต์ที่ได้รับอิทธิพลจากคติปัญญาแบบซีเรียและแนวคิดก่อนลัทธินอสติก โดยมุ่งสู่การรู้จักตนเองในเชิงเร้นลับผ่านถ้อยคำของพระเยซู
      date: ต้นฉบับภาษากรีกน่าจะเขียนราว ค.ศ. 50–140 ส่วนต้นฉบับภาษาคอปติกมีอายุราว ค.ศ. 340
      summary: พระกิตติคุณของโธมัสเป็นชุดถ้อยคำที่เชื่อมโยงกับพระเยซู หนังสือนี้ไม่มีเรื่องเล่าต่อเนื่อง และเรียกร้องให้ผู้อ่านค้นหาความหมายของถ้อยคำเหล่านั้นซ้ำแล้วซ้ำเล่า
