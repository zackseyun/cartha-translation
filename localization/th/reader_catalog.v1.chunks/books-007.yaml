payload:
  book_metadata:
    Proverbs:
      display_name: สุภาษิต
      author: เป็นหนังสือรวบรวมคำสอน โดยคำขึ้นต้นระบุชื่อซาโลมอน อากูร์ เลมูเอล และ “บรรดานักปราชญ์”
      audience: ชาวอิสราเอลรุ่นเยาว์ที่กำลังรับการหล่อหลอมให้มีปัญญาสำหรับชีวิตประจำวัน
      date: มีชั้นการประพันธ์จากหลายยุค ราวศตวรรษที่ 10–4 ก่อนคริสตกาล
    Ecclesiastes:
      display_name: ปัญญาจารย์
      author: ไม่ทราบนามผู้เขียน ผู้พูดคือ “โคเฮเลท” ซึ่งตามธรรมเนียมถือว่าเป็นซาโลมอน
      audience: ชาวอิสราเอลที่เผชิญกับขีดจำกัดของปัญญา ความมั่งคั่ง และความพยายามภายใต้ดวงอาทิตย์
      date: น่าจะอยู่ในช่วงราวศตวรรษที่ 5–3 ก่อนคริสตกาล โดยพิจารณาจากภาษาฮีบรูที่ได้รับอิทธิพลจากภาษาอาราเมค
    Song of Solomon:
      display_name: เพลงซาโลมอน
      author: ไม่ทราบนามผู้เขียน คำขึ้นต้นกล่าวถึงซาโลมอน
      audience: ชาวอิสราเอลที่อ่านเรื่องความรักเชิงชู้สาวในฐานะภาพสะท้อนความใกล้ชิดแห่งพันธสัญญา และต่อมารวมถึงผู้อ่านชาวยิวและคริสเตียนที่อ่านในเชิงอุปมานิทัศน์
      date: น่าจะอยู่ในสมัยหลังการเป็นเชลย ราวศตวรรษที่ 5–3 ก่อนคริสตกาล
