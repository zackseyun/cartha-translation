    Lamentations:
      display_name: เพลงคร่ำครวญ
      author: ไม่ทราบผู้เขียน; ตามธรรมเนียมสืบทอดถือว่าเยเรมีย์เป็นผู้เขียน
      audience: ชาวยูดาห์ที่โศกเศร้าต่อการพินาศของกรุงเยรูซาเล็มในปี 586 ก่อนคริสตกาล
      date: ไม่นานหลังปี 586 ก่อนคริสตกาล
    Ezekiel:
      display_name: เอเสเคียล
      author: เอเสเคียล ปุโรหิตผู้ถูกเนรเทศไปบาบิโลน; มีการเรียบเรียงเพิ่มเติมในภายหลัง
      audience: ชาวยูดาห์ที่ถูกเนรเทศอยู่ในบาบิโลน ซึ่งกำลังทำความเข้าใจใหม่ว่าพระเจ้าทรงสถิตอยู่ได้โดยไม่ขึ้นกับพระวิหาร
      date: ราวปี 593–571 ก่อนคริสตกาลสำหรับช่วงพันธกิจของผู้เผยพระวจนะ; รูปแบบสุดท้ายเกิดขึ้นภายหลังอีกระยะหนึ่ง
    Daniel:
      display_name: ดาเนียล
      author: ไม่ทราบผู้เขียน; เอกสารนำเสนอตนว่าเป็นดาเนียลผู้ถูกเนรเทศ
      audience: ชาวยิวที่ถูกข่มเหงในยุคเฮลเลนิสติก โดยเฉพาะภายใต้แอนทิโอคัสที่ 4 เอพิฟาเนส (167–164 ก่อนคริสตกาล)
      date: มีรูปแบบที่ได้รับสืบทอดมาราวปี 165 ก่อนคริสตกาล; บทที่ 1–6 นำเรื่องเล่าเก่าแก่เกี่ยวกับราชสำนักมาใช้
    Hosea:
      display_name: โฮเชยา
      author: โฮเชยา บุตรของเบเอรี
      audience: อาณาจักรอิสราเอลฝ่ายเหนือในช่วงหลายทศวรรษสุดท้ายก่อนถูกอัสซีเรียพิชิต
      date: ราวปี 750–722 ก่อนคริสตกาล
