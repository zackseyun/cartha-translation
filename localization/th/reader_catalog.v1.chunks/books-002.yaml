payload:
  book_metadata:
    Numbers:
      display_name: กันดารวิถี
      author: ไม่ทราบผู้เขียน ตามธรรมเนียมถือว่าโมเสสเป็นผู้เขียน
      audience: ชาวอิสราเอลระหว่างการเดินทางจากอียิปต์ไปยังดินแดนแห่งพันธสัญญา ทั้งคนรุ่นที่อยู่ในถิ่นทุรกันดารและผู้อ่านในยุคต่อมาที่เรียนรู้จากความล้มเหลวของพวกเขา
      date: มีชั้นการเรียบเรียงตั้งแต่ช่วงปลายยุคราชอาณาจักรจนถึงสมัยหลังการเนรเทศ (ราวศตวรรษที่ 7–5 ก่อนคริสตกาล)
    Deuteronomy:
      display_name: เฉลยธรรมบัญญัติ
      author: ไม่ทราบผู้เขียน เนื้อหานำเสนอในรูปคำกล่าวอำลาของโมเสส นักวิชาการสมัยใหม่มักเห็นว่าแก่นส่วนหนึ่งมีที่มาจากการปฏิรูปในรัชสมัยโยสิยาห์ช่วงปลายศตวรรษที่ 7 ก่อนคริสตกาล
      audience: ชาวอิสราเอลที่กำลังเตรียมเข้าสู่ดินแดน และผู้ถูกเนรเทศในยุคต่อมาซึ่งถามว่าจะดำเนินชีวิตอย่างซื่อสัตย์ได้อย่างไรเมื่อไม่มีพระวิหารหรือกษัตริย์
      date: แก่นของหนังสืออยู่ในช่วงปลายศตวรรษที่ 7 ก่อนคริสตกาล และได้รับรูปแบบสุดท้ายในสมัยเนรเทศ
    Joshua:
      display_name: โยชูวา
      author: ไม่ทราบผู้เขียน เป็นส่วนหนึ่งของชุดงานประวัติศาสตร์เฉลยธรรมบัญญัติ
      audience: ชาวอิสราเอลในสมัยราชอาณาจักรและสมัยเนรเทศ ซึ่งทบทวนเรื่องการพิชิต พันธสัญญา และความหมายของดินแดน
      date: เรียบเรียงขึ้นราวศตวรรษที่ 7–6 ก่อนคริสตกาลจากธรรมประเพณีที่เก่าแก่กว่า
