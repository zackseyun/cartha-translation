payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: ภาวะของเหล่าอาร์คอน
      author: ไม่ทราบชื่อผู้เขียน ผู้เขียนตีความปฐมกาลผ่านตำนานเชิงวิวรณ์เกี่ยวกับเหล่าอาร์คอน จึงไม่อาจระบุได้อย่างแน่นอนว่าเป็นผลงานของอาจารย์ผู้ใดที่มีชื่อปรากฏ
      audience: คริสตชนในแวดวงเซเธียนหรือแวดวงใกล้เคียง ซึ่งอ่านปฐมกาลว่าเป็นความขัดแย้งระหว่างผู้ปกครองจักรวาลผู้โง่เขลา ปัญญาจากพระเจ้า และต้นกำเนิดฝ่ายจิตวิญญาณของมนุษย์
      date: โดยทั่วไปจัดว่าเขียนขึ้นในคริสต์ศตวรรษที่ 3 และได้รับการเก็บรักษาไว้ในสำเนาภาษาคอปติกสมัยคริสต์ศตวรรษที่ 4 ในประมวลคัมภีร์นากฮัมมาดีเล่มที่ 2
    On the Origin of the World:
      display_name: ว่าด้วยกำเนิดของโลก
      author: ไม่ทราบชื่อผู้เขียน งานชิ้นนี้ผสานและปรับเปลี่ยนขนบความคิดหลายสาย ทั้งยิว คริสต์ เพลโต และตำนานปรัมปรา โดยไม่ได้ระบุชื่อผู้รวบรวม
      audience: ผู้อ่านในสภาพแวดล้อมแบบคริสต์ที่โน้มเอียงไปทางไญยนิยม ซึ่งแสวงหาเรื่องราวการสร้างในอีกมุมหนึ่ง อันกล่าวถึงเหล่าผู้ปกครองจักรวาล โซเฟีย อาดัมกับเอวา และจุดหมายสุดท้ายของโลก
      date: โดยทั่วไปกำหนดอายุไว้ในคริสต์ศตวรรษที่ 3 แม้อาจมีเนื้อหาที่เก่าแก่กว่านั้นเป็นพื้นฐาน หลักฐานที่เก็บรักษางานนี้ไว้ส่วนใหญ่เป็นต้นฉบับภาษาคอปติกสมัยคริสต์ศตวรรษที่ 4
    Sophia of Jesus Christ:
      display_name: พระปรีชาญาณของพระเยซูคริสต์
      author: ไม่ทราบชื่อผู้เขียน ผู้เขียนดัดแปลงเนื้อหาที่พบในงานชื่อยูโญสตอส ให้เป็นบทสนทนาระหว่างพระเยซูกับเหล่าสาวกภายหลังการคืนพระชนม์
      audience: คริสตชนที่สนใจปัญญาจากการเปิดเผยเกี่ยวกับพระเจ้าผู้เหนือสรรพสิ่ง การจัดระเบียบโลกสวรรค์ ตลอดจนต้นกำเนิดและความรอดของจิตวิญญาณ
      date: มักกำหนดอายุไว้ในช่วงปลายคริสต์ศตวรรษที่ 2 หรือคริสต์ศตวรรษที่ 3 โดยเก็บรักษาไว้ในสำเนาภาษาคอปติกจากนากฮัมมาดีและประมวลคัมภีร์เบอร์ลิน
    Gospel of the Egyptians:
      display_name: ข่าวประเสริฐของชาวอียิปต์
      author: ไม่ทราบชื่อผู้เขียน งานจากนากฮัมมาดีชิ้นนี้มีอีกชื่อหนึ่งว่า หนังสือศักดิ์สิทธิ์แห่งพระวิญญาณยิ่งใหญ่ผู้ไม่ประจักษ์ และเป็นคนละงานกับข่าวประเสริฐของชาวอียิปต์ฉบับภาษากรีกที่เก่ากว่า ซึ่งเป็นที่รู้จักจากข้อความอ้างอิงเท่านั้น
      audience: ชุมชนคริสตชนเซเธียนที่ใช้ตำนานอันซับซ้อน พระนามศักดิ์สิทธิ์ ภาพพจน์เกี่ยวกับพิธีบัพติศมา และบทสรรเสริญ เพื่ออธิบายอัตลักษณ์ฝ่ายจิตวิญญาณและการช่วยให้พ้น
      date: โดยทั่วไปจัดว่าเขียนขึ้นในคริสต์ศตวรรษที่ 2 หรือ 3 มีสำเนาภาษาคอปติกสองฉบับหลงเหลืออยู่ในประมวลคัมภีร์นากฮัมมาดีสมัยคริสต์ศตวรรษที่ 4
    Letter of Peter to Philip:
      display_name: จดหมายของเปโตรถึงฟีลิป
      author: ไม่ทราบชื่อผู้เขียน จดหมายเปิดเรื่องฉบับสั้นและวิวรณ์ที่ตามมาถูกระบุว่าเป็นผลงานของเปโตรและฟีลิปโดยใช้นามบุคคลทั้งสอง แต่ไม่อาจยืนยันได้ว่าอัครทูตคนใดคนหนึ่งเป็นผู้เขียนจริง
      audience: คริสตชนที่แสวงหาการรับรองจากอัครทูตสำหรับคำสอนเรื่องพระผู้ช่วยให้รอด อำนาจที่เป็นศัตรู ความทุกข์ การประกาศพันธกิจ และการฟื้นฟูเหล่าสาวก
      date: โดยทั่วไปกำหนดอายุไว้ในช่วงปลายคริสต์ศตวรรษที่ 2 หรือต้นคริสต์ศตวรรษที่ 3 โดยเก็บรักษาไว้ในสำเนาจากนากฮัมมาดีสมัยคริสต์ศตวรรษที่ 4 และหลักฐานภาษาคอปติกอีกฉบับหนึ่งที่มีอายุภายหลัง
    Gospel of Judas:
      display_name: ข่าวประเสริฐของยูดาส
      author: ไม่ทราบชื่อผู้เขียน ชื่อเรื่องระบุว่างานเล่าเรื่องนี้เป็นของยูดาส แต่ตัวงานไม่ได้ยืนยันว่ายูดาสอิสคาริโอทเป็นผู้เขียนในประวัติศาสตร์
      audience: กลุ่มคริสตชนที่วิพากษ์แนวปฏิบัติด้านเครื่องบูชาและระเบียบสถาบันคริสตจักรของกลุ่มคู่แข่ง โดยใช้บทสนทนาเชิงวิวรณ์และจักรวาลวิทยาแบบเซเธียนเพื่อตีความยูดาสและการสิ้นพระชนม์ของพระเยซูเสียใหม่
      date: โดยทั่วไปกำหนดอายุไว้ในช่วงกลางหรือปลายคริสต์ศตวรรษที่ 2 อิเรเนอัสรู้จักงานที่เรียกว่า ข่าวประเสริฐของยูดาส ราว ค.ศ. 180 ส่วนสำเนาภาษาคอปติกที่หลงเหลืออยู่น่าจะมาจากคริสต์ศตวรรษที่ 3 หรือ 4
    Protoevangelium of James:
      display_name: ปฐมข่าวประเสริฐของยากอบ
      author: ไม่ทราบชื่อผู้เขียน ผู้เล่าเรื่องอ้างว่าตนคือยากอบ แต่งานชิ้นนี้เขียนโดยใช้นามของผู้อื่น และไม่ได้เขียนโดยยากอบน้องชายของพระเยซู
      audience: คริสตชนที่สนใจการเกิดและการเลี้ยงดูมารีย์ ความบริสุทธิ์ตลอดกาลของเธอ การประสูติของพระเยซู และคำตอบในรูปแบบเรื่องเล่าสำหรับประเด็นที่มัทธิวกับลูกาไม่ได้อธิบายไว้
      date: โดยทั่วไปกำหนดอายุไว้ในช่วงครึ่งหลังของคริสต์ศตวรรษที่ 2 งานนี้หลงเหลืออยู่ในต้นฉบับภาษากรีกยุคหลังจำนวนมากและในคำแปลโบราณหลายฉบับ
  chapter_titles:
    Apocryphon of John:
      '17':
        title: พระญาณเอื้ออาทรปลุกจิตใจให้ตื่น
      '18':
        title: จิตวิญญาณหันจากการต่อสู้กับความชั่ว
      '19':
        title: พระวิญญาณผู้เมตตาปลุกผู้คนให้ตื่น
      '20':
        title: ความสว่างลงมาเพื่อช่วยจิตวิญญาณ
      '21':
        title: พระผู้ช่วยให้รอดมอบปัญญาเร้นลับไว้
    Hypostasis of the Archons:
      '1':
        title: พระวิญญาณเปิดเผยอำนาจแห่งจักรวาล
      '2':
        title: เสียงหนึ่งเปิดโปงผู้ปกครองที่มืดบอด
      '3':
        title: ความสว่างจากพระเจ้าทำให้อาดัมมีชีวิต
      '4':
        title: หญิงผู้นั้นหนีพ้นความรุนแรงของเหล่าผู้ปกครอง
      '5':
        title: งูสอนความจริงฝ่ายจิตวิญญาณ
      '6':
        title: คาอินฆ่าอาแบล และเสทมาแทนที่
      '7':
        title: โนอาห์สร้างเรือและได้รับการช่วยไว้สองครั้ง
      '8':
        title: โนเรอาต่อต้านอำนาจมืดอย่างกล้าหาญ
      '9':
        title: เอเลเลทยืนยันถึงต้นกำเนิดที่แท้จริง
      '10':
        title: ธิดาแห่งปัญญาจำกัดเขตผู้ปกครอง
      '11':
        title: ซาบาโอทกลับใจและสรรเสริญปัญญา
      '12':
        title: ผู้เปิดเผยนำชีวิตนิรันดร์มา
    On the Origin of the World:
      '1':
        title: ความโกลาหลเกิดขึ้นจากความมืด
      '2':
        title: ปัญญาสร้างขอบเขตแห่งสวรรค์
      '3':
        title: ผู้ปกครองหลงผิดว่าตนครองอำนาจแต่ผู้เดียว
      '4':
        title: สิ่งมีชีวิตทั้งเจ็ดปกครองสวรรค์
      '5':
        title: พระเจ้าผู้มืดบอดอ้างว่ามีเพียงตนเท่านั้น
      '6':
        title: ซาบาโอทปฏิเสธความมืดของบิดามารดา
      '7':
        title: ผู้ปกครองสวรรค์สร้างสิ่งจำลอง
      '8':
        title: พลังแห่งชีวิตเอาชนะความตาย
      '9':
        title: ผู้ปกครององค์แรกเห็นศรัทธาจากพระเจ้า
      '10':
        title: อาดัมผู้เจิดจ้าปรากฏในความสว่าง
      '11':
        title: เอรอสปลุกความปรารถนาและความตาย
      '12':
        title: อุทยานถูกสร้างพร้อมต้นไม้ศักดิ์สิทธิ์
      '13':
        title: พระโลหิตจากพระเจ้าก่อกำเนิดดอกไม้
      '14':
        title: ปัญญาจัดระเบียบดวงดาวบนฟ้า
      '15':
        title: อาจารย์เปิดโปงความเขลาของจักรวาล
      '16':
        title: เอวาให้กำเนิดบุตรโดยไม่มีสามี
      '17':
        title: เหล่าผู้ปกครองจักรวาลสร้างอาดัม
      '18':
        title: เอวาปลุกอาดัมให้มีชีวิต
      '19':
        title: เหล่าผู้ปกครองหวาดกลัวพลังเจิดจ้าของเอวา
      '20':
        title: เอวาตั้งครรภ์โดยเหล่าผู้ปกครองจักรวาล
      '21':
        title: เอวากินผลไม้และได้รับปัญญา
      '22':
        title: อาดัมขัดขืนอำนาจผู้ปกครอง
      '23':
        title: ปัญญาขับเหล่าผู้ปกครองออกจากสวรรค์
      '24':
        title: บริวารปีศาจนำมนุษยชาติไปท่ามกลางเปลวเพลิง
      '25':
        title: พระเจ้าผู้เร้นลับส่งวิญญาณผู้เปี่ยมพร
      '26':
        title: พระวาทะสูงสุดเปิดเผยความจริงที่ซ่อนอยู่
      '27':
        title: พระพิโรธเผาผลาญจนความโกลาหลสิ้นสุด
    Sophia of Jesus Christ:
      '1':
        title: พระเยซูเปิดเผยความจริงแก่เหล่าสาวก
      '2':
        title: ความล้ำลึกนิรันดร์ของพระเจ้าได้รับการอธิบาย
      '3':
        title: การสร้างเกิดจากความดีของพระเจ้าผู้เร้นลับ
      '4':
        title: โลกที่มองเห็นได้นำไปสู่ความเชื่อ
      '5':
        title: พระเจ้าเปิดเผยมนุษย์ผู้เจิดจ้า
      '6':
        title: พระคริสต์ทรงสร้างทูตสวรรค์ด้วยสิทธิอำนาจ
      '7':
        title: พระผู้ช่วยให้รอดปลุกความสว่างจากพระเจ้าภายใน
      '8':
        title: แดนสวรรค์ทั้งหลายเป็นหนึ่งเดียวอย่างสอดประสาน
      '9':
        title: ปัญญาจากพระเจ้าและความรู้แท้จริง
      '10':
        title: เปิดเผยพระประสงค์อันสมบูรณ์ของพระเจ้านิรันดร์
    Gospel of the Egyptians:
      '1':
        title: พระเจ้าเปิดเผยความสว่างศักดิ์สิทธิ์นิรันดร์
      '2':
        title: อำนาจทั้งสามเผยออกมาจากความเงียบ
      '3':
        title: พระบิดาปรากฏจากความเงียบศักดิ์สิทธิ์
      '4':
        title: เหล่าสิ่งมีชีวิตในสวรรค์สรรเสริญพระวิญญาณ
      '5':
        title: อาดามัสให้กำเนิดสิ่งทรงสร้างทั้งปวง
      '6':
        title: พระคริสต์สถาปนาชนผู้เป็นอมตะ
      '7':
        title: อำนาจจากพระเจ้าชื่นชมยินดีในความเป็นหนึ่ง
      '8':
        title: พระคริสต์เปิดเผยพระบารมีและพระสิริอย่างเต็มเปี่ยม
      '9':
        title: เสทอธิษฐานเพื่อเชื้อสายฝ่ายจิตวิญญาณ
      '10':
        title: โซเฟียเกิดจากพระปรีชาญาณของพระเจ้า
      '11':
        title: ผู้ส่งสารจากสวรรค์ปกป้องเชื้อสาย
      '12':
        title: เสทเตรียมความรอดผ่านพระคริสต์
      '13':
        title: ผู้กล่าววิงวอนต่อพระเจ้านิรันดร์ผู้ไม่ประจักษ์
      '14':
        title: เสทเขียนหนังสือลับ
    Letter of Peter to Philip:
      '1':
        title: เปโตรเร่งเร้าให้ฟีลิปกลับมา
      '2':
        title: เหล่าอัครทูตอธิษฐานบนภูเขามะกอกเทศ
      '3':
        title: พระเยซูอธิบายความบริบูรณ์จากพระเจ้า
      '4':
        title: ผู้ปกครองต่อต้านแผนการของพระเจ้าเที่ยงแท้
      '5':
        title: พระคริสต์ช่วยผู้หลงหายด้วยความเชื่อ
      '6':
        title: พระเยซูทรงสัญญาถึงกำลังนิรันดร์
      '7':
