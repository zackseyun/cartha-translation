payload:
  book_metadata:
    1 Esdras:
      display_name: 1 เอสดราส
      author: ไม่ทราบนาม เป็นงานเรียบเรียงใหม่ในภาษากรีก โดยจัดลำดับเนื้อหาจาก 2 พงศาวดาร 35–36 เอสรา และเนหะมีย์ 7–8 ใหม่
      audience: ชาวยิวในยุคเฮลเลนิสติกที่ต้องการเรื่องราวชัดเจนเกี่ยวกับการกลับคืนถิ่นและการฟื้นฟู
      date: ราวศตวรรษที่ 2–1 ก่อนคริสตกาล
    Prayer of Manasseh:
      display_name: คำอธิษฐานของมนัสเสห์
      author: ไม่ทราบนาม อ้างพระนามแฝงว่าเป็นผลงานของกษัตริย์มนัสเสห์
      audience: ผู้สำนึกผิดที่เห็นตนเองในแบบอย่างการกลับใจของมนัสเสห์ และมีการใช้ในพิธีกรรมของบางธรรมเนียม
      date: ราวศตวรรษที่ 2–1 ก่อนคริสตกาล
    Psalm 151:
      display_name: สดุดี 151
      author: ไม่ทราบนาม อ้างพระนามแฝงว่าเป็นผลงานของดาวิด มีรูปแบบภาษาฮีบรูปรากฏใน 11QPsa
      audience: ชุมชนชาวยิวพลัดถิ่นและชุมชนคุมรานที่ยึดมั่นในหนังสือสดุดีของดาวิด
      date: ราวศตวรรษที่ 2 ก่อนคริสตกาลหรือก่อนหน้านั้น
    3 Maccabees:
      display_name: 3 มัคคาบี
      author: ไม่ทราบนาม ประพันธ์เป็นภาษากรีก
      audience: ชาวยิวพลัดถิ่นในอียิปต์ที่พูดภาษากรีก เป็นเรื่องราวการช่วยให้รอดซึ่งมีฉากหลังในรัชสมัยปโตเลมีที่ 4
      date: ราวศตวรรษที่ 1 ก่อนคริสตกาลถึงศตวรรษที่ 1 คริสตกาล
    4 Maccabees:
      display_name: 4 มัคคาบี
      author: ไม่ทราบนาม ผู้เขียนเป็นชาวยิวที่พูดภาษากรีกและได้รับอิทธิพลจากปรัชญาสโตอิก
      audience: ชาวยิวในวัฒนธรรมเฮลเลนิสติก เป็นคำเทศนาเชิงปรัชญาว่าด้วยเหตุผลที่ควบคุมความปรารถนาด้วยความซื่อสัตย์
      date: ราวศตวรรษที่ 1 คริสตกาล
    Bel and the Dragon:
      display_name: เบลกับมังกร
      author: ไม่ทราบนาม เป็นหนึ่งในส่วนเพิ่มเติมภาษากรีกของดาเนียล
      audience: ชาวยิวที่พูดภาษากรีก เป็นงานโต้แย้งเชิงเย้ยหยันการบูชารูปเคารพ
      date: ราวศตวรรษที่ 2–1 ก่อนคริสตกาล
    Letter of Jeremiah:
      display_name: จดหมายของเยเรมีย์
      author: ไม่ทราบนาม อ้างนามแฝงว่าเป็นผลงานของเยเรมีย์
      audience: ชาวยิวพลัดถิ่นที่ถูกล่อลวงให้บูชารูปเคารพซึ่งอยู่รอบตัว
      date: ราวศตวรรษที่ 4–2 ก่อนคริสตกาล
    Prayer of Azariah and Song of the Three:
      display_name: คำอธิษฐานของอาซาริยาห์และบทเพลงของชายสามคน
      author: ไม่ทราบนาม เป็นหนึ่งในส่วนเพิ่มเติมภาษากรีกของดาเนียล
      audience: ชาวยิวที่พูดภาษากรีก เป็นเนื้อหาสำหรับพิธีกรรมประกอบดาเนียล 3
      date: ราวศตวรรษที่ 2 ก่อนคริสตกาล
    Susanna:
      display_name: ซูซันนา
      author: ไม่ทราบนาม เป็นหนึ่งในส่วนเพิ่มเติมภาษากรีกของดาเนียล
      audience: ชาวยิวที่พูดภาษากรีก เป็นเรื่องราวของความชอบธรรมและการเปิดโปงพยานเท็จ
      date: ราวศตวรรษที่ 2–1 ก่อนคริสตกาล
    1 Clement:
      display_name: 1 เคลเมนต์
      author: ไม่ทราบนาม เชื่อกันว่าเป็นผลงานของเคลเมนต์แห่งโรม
      audience: ชุมนุมคริสเตียนที่เมืองโครินธ์ ซึ่งกำลังพัวพันกับข้อพิพาทเรื่องผู้นำ
      date: ราว ค.ศ. 96
