review:
  verdict: revise
  review_summary: แก้ไขชื่อบทที่แปลคลาดเคลื่อนหรือทำความหมายต้นฉบับอ่อนลง โดยเฉพาะเรื่องการเป็นมรณสักขี การสาปแช่งพระคริสต์ การเยาะเย้ยคำขู่ และการบอกข้อความพระกิตติคุณ ส่วนรายการอื่นแปลได้ครบถ้วนและสอดคล้องกับต้นฉบับ
  issues:
  - 'Martyrdom of Polycarp 2: “Sealed” ไม่ใช่ “ได้รับการรับรอง”; แก้เป็นความหมายว่าการเป็นมรณสักขีสำเร็จบริบูรณ์'
  - 'Martyrdom of Polycarp 11: “Blame Christ” ในบริบทชื่อเรื่องนี้ต้องคงความหมาย “สาปแช่งพระคริสต์” ไม่ใช่เพียงกล่าวโทษ'
  - 'Martyrdom of Polycarp 12: ฉบับร่างละความหมาย “mocks”; แก้ให้ระบุว่าเยาะเย้ยคำขู่'
  - 'Fragments of Papias 16: “Dictates Gospel to Papias” ไม่ใช่สั่งให้ปาปิอัสเขียนพระกิตติคุณ; แก้เป็นยอห์นบอกข้อความพระกิตติคุณแก่ปาปิอัส'
