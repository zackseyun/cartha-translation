payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: จดหมายของโพลีคาร์ปถึงชาวฟีลิปปี
      author: โพลีคาร์ป บิชอปแห่งสเมอร์นา นักวิชาการบางคนเห็นว่าข้อความที่สืบทอดมานี้เป็นการรวมเนื้อหาที่ส่งไปในมากกว่าหนึ่งช่วงเวลา
      audience: ชุมชนคริสตชนที่เมืองฟีลิปปี ซึ่งได้ขอจดหมายของอิกเนเชียส และได้รับคำแนะนำเรื่องความเชื่อ การประพฤติ ผู้นำ เงินทอง และความพากเพียร
      date: ต้นถึงกลางคริสต์ศตวรรษที่ 2 อย่างน้อยบางส่วนเชื่อมโยงอย่างใกล้ชิดกับการเดินทางของอิกเนเชียส ส่วนข้อเสนอที่ว่าจดหมายนี้ประกอบขึ้นจากหลายส่วนเปิดโอกาสให้เนื้อหาบางตอนอาจเขียนขึ้นในเวลาหลังจากนั้นเล็กน้อย
    Martyrdom of Polycarp:
      display_name: มรณสักขีของโพลีคาร์ป
      author: สมาชิกนิรนามของคริสตจักรในสเมอร์นา เขียนในนามของชุมชน ส่วนบันทึกการถ่ายทอดที่อยู่ตอนท้ายสะท้อนถึงการคัดลอกและเผยแพร่ในเวลาต่อมา
      audience: คริสตจักรที่ฟิโลเมเลียมและชุมชนคริสตชนในวงกว้าง โดยนำเสนอเรื่องราวการจับกุม การไต่สวน การเสียชีวิต และความอดทนอันเป็นแบบอย่างของโพลีคาร์ป
      date: เขียนขึ้นหลังการเสียชีวิตของโพลีคาร์ป โดยทั่วไปจัดไว้ในช่วงกลางหรือปลายคริสต์ศตวรรษที่ 2 แต่ทั้งปีที่เกิดมรณสักขีและรูปแบบสุดท้ายของเอกสารยังเป็นที่ถกเถียงกัน
    Epistle to Diognetus:
      display_name: จดหมายถึงไดโอเกเนตุส
      author: ไม่ทราบชื่อ ผู้เขียนเรียกตนเองว่าเป็นศิษย์หรือผู้เรียนรู้ แต่ไม่อาจระบุตัวเขาหรือไดโอเกเนตุสผู้รับจดหมายได้อย่างแน่ชัด
      audience: ผู้ใฝ่รู้ที่มีการศึกษาและไม่ใช่คริสตชน—รวมถึงผู้อ่านที่คล้ายกัน—ซึ่งถามเกี่ยวกับการนมัสการ จริยธรรม อัตลักษณ์ทางสังคม ความรัก และความเชื่อคริสต์ที่ดูเหมือนเพิ่งเกิดขึ้น
      date: มักกำหนดอายุไว้ช่วงปลายคริสต์ศตวรรษที่ 2 หรือต้นคริสต์ศตวรรษที่ 3 แม้ข้อเสนอจะแตกต่างกันมาก และสองบทสุดท้ายอาจมาจากงานเขียนอีกชิ้นหนึ่ง
    Fragments of Papias:
      display_name: ชิ้นส่วนงานเขียนของปาปิอัส
      author: ปาปิอัส บิชอปแห่งฮีเอราโปลิส เป็นผู้เขียนหนังสือห้าเล่มเรื่องคำอธิบายพระดำรัสขององค์พระผู้เป็นเจ้า ซึ่งสูญหายไปแล้ว ส่วนชุดข้อความที่หลงเหลืออยู่ประกอบด้วยคำอ้างและรายงานที่ผู้เขียนยุคหลังเก็บรักษาไว้
      audience: คริสตชนยุคแรกที่แสวงหาคำสอนซึ่งมีผู้จดจำเกี่ยวกับพระเยซูและเหล่าอัครทูต โดยรวบรวมผ่านสายการถ่ายทอดคำบอกเล่าและการตีความที่ระบุชื่อบุคคล
      date: โดยทั่วไปกำหนดให้งานของปาปิอัสอยู่ในช่วงต้นคริสต์ศตวรรษที่ 2 ซึ่งมักประมาณ ค.ศ. 110–130 ส่วนชิ้นข้อความที่หลงเหลือปรากฏอยู่ในงานของผู้เขียนตั้งแต่คริสต์ศตวรรษที่ 2 เป็นต้นมา
  chapter_titles:
    Letters of Ignatius:
      '90':
