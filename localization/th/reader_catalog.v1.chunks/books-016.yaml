      audience: ชุมชนชาวยิวเชิงวิวรณ์ที่ใคร่ครวญเรื่องความชั่วร้ายระดับจักรวาล การพิพากษา และปฏิทิน; ต่อมาได้รับการอ่านในแวดวงคริสเตียนยุคแรก
      date: ส่วนต่าง ๆ รวบรวมขึ้นราวศตวรรษที่ 3 ก่อนคริสตกาลถึงศตวรรษที่ 1 คริสต์ศักราช; ฉบับสมบูรณ์หลงเหลืออยู่เฉพาะในภาษาเกเอซ (เอธิโอเปีย)
