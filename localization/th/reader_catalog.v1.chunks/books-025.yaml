payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: พระกิตติคุณวัยเยาว์ของโธมัส
      author: ไม่ทราบผู้เขียน รูปแบบเก่าแก่ที่สุดของงานเขียนนี้เท่าที่สืบค้นได้ไม่ได้ระบุชื่อผู้เขียน การยกให้โธมัสเป็นผู้เขียนปรากฏในชื่อเรื่องของสำเนาต้นฉบับและการสืบทอดข้อความในสมัยหลัง
      audience: คริสตชนที่ใคร่รู้เรื่องราววัยเด็กของพระเยซู และสนใจว่าฤทธิ์อำนาจจากพระเจ้า การอบรมสั่งสอน การเรียนรู้ และการเติบโตเป็นผู้ใหญ่ของพระองค์ก่อนเรื่องราวในพระกิตติคุณตามบัญญัติจะเริ่มต้น อาจได้รับการบอกเล่าอย่างไร
      date: โดยทั่วไปสืบย้อนไปถึงคริสต์ศตวรรษที่ 2 แต่ข้อความที่หลงเหลืออยู่มีฉบับเรียบเรียงภาษากรีกหลายฉบับซึ่งแตกต่างกันอย่างมาก รวมทั้งฉบับแปลยุคแรก ๆ
    Acts of Paul and Thecla:
      display_name: กิจการของเปาโลและเธคลา
      author: ไม่ทราบผู้เขียน งานนี้เป็นตอนหนึ่งจากกิจการของเปาโลฉบับที่ยาวกว่า รายงานโบราณที่ว่าผู้อาวุโสในคริสตจักรคนหนึ่งประพันธ์กิจการฉบับนี้ไม่อาจใช้ระบุตัวผู้เขียนได้อย่างแน่นอน
      audience: คริสตชนที่สนใจเรื่องราวการประกาศของอัครทูต การครองโสด บัพติศมา ความทรหดอดทนเยี่ยงผู้พลีชีพ และสิทธิอำนาจของสตรีในการสอนและเป็นพยาน
      date: ประพันธ์ขึ้นในคริสต์ศตวรรษที่ 2 น่าจะเป็นช่วงครึ่งหลังของศตวรรษ งานนี้แพร่หลายทั้งในฐานะส่วนหนึ่งของกิจการของเปาโลและในฐานะงานเขียนอิสระ
    Gospel of Peter:
      display_name: พระกิตติคุณของเปโตร
      author: ไม่ทราบผู้เขียน เรื่องราวที่หลงเหลืออยู่เล่าด้วยน้ำเสียงของเปโตรและได้รับการสืบทอดภายใต้ชื่อของเขา แต่ไม่ถือว่าเป็นผลงานของอัครทูตเปโตรในประวัติศาสตร์
      audience: คริสตชนยุคแรกที่สนใจเรื่องราวพระทรมานและการคืนพระชนม์ฉบับขยาย ซึ่งน่าจะอยู่ในชุมชนที่ให้ความสำคัญเป็นพิเศษกับสิทธิอำนาจของเปโตร
      date: โดยทั่วไปกำหนดอายุไว้ในคริสต์ศตวรรษที่ 2 ส่วนชิ้นส่วนภาษากรีกสำคัญที่หลงเหลืออยู่มาจากสำเนาต้นฉบับยุคหลังมากซึ่งค้นพบที่อัคมิม
    2 Clement:
      display_name: 2 เคลเมนต์
      author: ไม่ทราบผู้เขียน แม้มีชื่อเรียกตามประเพณีเช่นนี้ แต่งานชิ้นนี้เป็นคำเทศนาของคริสตชนยุคแรก ไม่ใช่จดหมายฉบับที่สองของเคลเมนต์แห่งโรม
      audience: ที่ประชุมคริสตชนซึ่งได้รับการหนุนใจให้กลับใจ ประพฤติตนดีอย่างเสมอต้นเสมอปลาย เอาใจใส่ผู้เปราะบาง และยืนหยัดอย่างซื่อสัตย์ด้วยความหวังเรื่องการคืนชีพและการพิพากษา
      date: โดยทั่วไปกำหนดอายุไว้ในช่วงครึ่งแรกหรือกลางคริสต์ศตวรรษที่ 2 (ราว ค.ศ. 100–160) ส่วนสถานที่ประพันธ์ยังไม่แน่นอน
    Epistle of Barnabas:
      display_name: จดหมายของบารนาบัส
      author: ไม่ทราบผู้เขียน ตามประเพณีเคยเชื่อมโยงงานชิ้นนี้กับบารนาบัสผู้ร่วมงานของเปาโล แต่วงวิชาการสมัยใหม่ไม่ยอมรับการระบุผู้เขียนเช่นนั้น
      audience: คริสตชนต่างชาติที่ได้รับการสอนให้ถือว่าพระคัมภีร์ของอิสราเอลเป็นของตนผ่านการตีความโดยเชื่อมโยงกับพระคริสต์และในเชิงอุปมานิทัศน์ พร้อมทั้งแยกอัตลักษณ์แห่งพันธสัญญาของตนออกจากแนวปฏิบัติของชาวยิว
      date: โดยทั่วไปกำหนดอายุไว้ระหว่างการทำลายพระวิหารเยรูซาเล็มใน ค.ศ. 70 กับช่วงต้นคริสต์ศตวรรษที่ 2 และมักระบุไว้ราว ค.ศ. 80–130
