payload:
  book_metadata:
    2 Esdras:
      display_name: 2 Ezdra
      author: Anonim, cu un cadru redactat de creștini în jurul unui nucleu inițial iudaic (4 Ezdra, capitolele 3–14).
      audience: Evreii de după anul 70 d.Hr. care se confruntau cu problema teodiceei; ulterior, lucrarea a fost extinsă pentru cititorii creștini.
      date: Nucleul iudaic, aproximativ anul 100 d.Hr.; adaosurile creștine, aproximativ secolele al II-lea–al III-lea d.Hr.
    Didache:
      display_name: Didahia
      author: Anonim (titlul înseamnă „Învățătura celor doisprezece apostoli”).
      audience: Comunitățile creștine timpurii — un scurt îndrumar despre etică, botez, euharistie și învățătorii itineranți.
      date: Aproximativ de la sfârșitul secolului I până la începutul secolului al II-lea d.Hr.
    Gospel of Thomas:
      display_name: Evanghelia după Toma
      author: Anonim; începutul textului atribuie colecția de rostiri lui „Didymos Iuda Toma”. S-a păstrat integral doar într-o traducere coptă din secolul al IV-lea de la Nag Hammadi (NHC II,2), cu trei fragmente grecești de la Oxyrhynchus.
      audience: Cititori creștini influențați de înțelepciunea siriană și de gândirea proto-gnostică, orientați spre autocunoașterea ezoterică din rostirile lui Isus.
      date: Originalul grecesc datează probabil din perioada aproximativă 50–140 d.Hr.; manuscrisul copt, din jurul anului 340 d.Hr.
      summary: Evanghelia după Toma este o colecție de rostiri atribuite lui Isus. Nu are o narațiune continuă și îi îndeamnă în repetate rânduri pe cititori să descopere înțelesul rostirilor.
