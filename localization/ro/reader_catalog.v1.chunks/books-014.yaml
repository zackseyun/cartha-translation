payload:
  book_metadata:
    Sirach:
      display_name: Sirah
      author: Ișua ben Eleazar ben Sira din Ierusalim; traducerea greacă îi aparține nepotului său.
      audience: Tineri evrei instruiți în înțelepciune în Ierusalimul perioadei elenistice.
      date: Originalul ebraic, cca 195–175 î.Hr.; traducerea greacă, cca 132 î.Hr.
    Baruch:
      display_name: Baruh
      author: Autor anonim; lucrarea este atribuită în mod pseudonim lui Baruh, scribul lui Ieremia.
      audience: Evreii din diaspora care meditau la exil, pocăință și înțelepciune.
      date: Cca secolul al II-lea î.Hr.
    1 Maccabees:
      display_name: 1 Macabei
      author: Autor anonim, probabil din Ierusalim, care a scris în ebraică (s-a păstrat doar versiunea greacă).
      audience: Evreii din timpul și de după revolta hasmoneană; lucrarea relatează legitimitatea dinastiei hasmoneene.
      date: Cca 100 î.Hr.
    2 Maccabees:
      display_name: 2 Macabei
      author: Un autor anonim care a rezumat o lucrare mai amplă a lui Iason din Cirene; compusă în greacă.
      audience: Evreii vorbitori de greacă din diaspora — cu accent pe martiriu, providență și înviere.
      date: Cca 124 î.Hr. sau la scurt timp după aceea.
