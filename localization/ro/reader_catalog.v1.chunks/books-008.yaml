      author: Mai mulți autori de-a lungul secolelor; capitolele 1–39 își au rădăcinile în Isaia din Ierusalim, din secolul al VIII-lea, iar 40–55 („Al doilea Isaia”) și 56–66 („Al treilea Isaia”) răspund exilului și întoarcerii.
      audience: Iuda sub amenințarea asiriană, exilul babilonian și restaurarea de după exil — succesiv.
      date: Compusă aproximativ de la sfârșitul secolului al VIII-lea până în secolul al V-lea î.Hr.
