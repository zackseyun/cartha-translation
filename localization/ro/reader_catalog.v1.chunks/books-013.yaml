payload:
  book_metadata:
    James:
      display_name: Iacov
      author: În mod tradițional, Iacov, fratele lui Isus; cercetătorii moderni sunt împărțiți între atribuirea autentică și cea pseudonimă.
      audience: Adunări iudeo-creștine din diaspora.
      date: cca anii 50–60 d.Hr., dacă atribuirea este autentică; spre sfârșitul secolului I d.Hr., dacă este pseudonimă.
    1 Peter:
      display_name: 1 Petru
      author: În mod tradițional, apostolul Petru, cu Silvan ca scrib; unii cercetători consideră scrierea pseudonimă.
      audience: Creștinii din Asia Mică romană care se confruntau cu ostilitate socială.
      date: cca anii 60 d.Hr., dacă îi aparține lui Petru; cca anii 70–90 d.Hr., dacă este pseudonimă.
    2 Peter:
      display_name: 2 Petru
      author: În mod tradițional, Petru; cercetătorii moderni consideră în mare măsură scrierea pseudonimă.
      audience: Creștinii confruntați cu batjocoritori care neagă parusia.
      date: cca începutul secolului al II-lea d.Hr.
    1 John:
      display_name: 1 Ioan
      author: Anonim; în mod tradițional, apostolul Ioan sau prezbiterul ioanin.
      audience: Comunitatea ioanină după o sciziune, definind cine îi aparține.
      date: cca 90–110 d.Hr.
    2 John:
      display_name: 2 Ioan
      author: „Prezbiterul.”
      audience: O anumită comunitate creștină („doamna aleasă”), avertizată cu privire la învățătorii falși.
      date: cca 90–110 d.Hr.
    3 John:
      display_name: 3 Ioan
      author: „Prezbiterul.”
      audience: Gaius, un conducător individual care îi găzduia pe misionarii itineranți.
      date: cca 90–110 d.Hr.
    Jude:
      display_name: Iuda
      author: În mod tradițional, Iuda, fratele lui Iacov și al lui Isus.
      audience: Comunități creștine în care se infiltrau învățători libertini.
      date: cca anii 60–90 d.Hr.
    Revelation:
      display_name: Apocalipsa
      author: Ioan din Patmos (al cărui stil diferă de cel al Evangheliei a patra).
      audience: Șapte comunități creștine din Asia Mică romană, aflate sub presiunea imperială.
      date: cca anii 90 d.Hr., în mod tradițional în timpul domniei lui Domițian.
    Tobit:
      display_name: Tobit
      author: Anonim.
      audience: Evreii din diaspora care se orientau în privința evlaviei, căsătoriei și providenței sub stăpânire străină.
      date: cca 225–175 î.Hr.; compusă în aramaică, cu o versiune ebraică de asemenea atestată la Qumran.
    Judith:
      display_name: Iudita
      author: Anonim.
      audience: Evreii aflați sub amenințare străină — o istorisire îndrăzneață despre rezistența evlavioasă.
      date: cca 150–100 î.Hr.
    Greek Additions to Esther:
      display_name: Adaosurile grecești la Estera
      author: Anonim; material suplimentar adăugat în traducerea greacă a cărții Estera.
      audience: Evreii vorbitori de greacă ce doreau o istorisire a Esterei cu rugăciuni și referiri explicite la Dumnezeu.
      date: cca secolele al II-lea–I î.Hr.
    Wisdom of Solomon:
      display_name: Înțelepciunea lui Solomon
      author: Anonim; atribuită pseudonim lui Solomon. Compusă în greacă de un autor evreu elenistic, probabil în Alexandria.
      audience: Evreii elenistici aflați în dialog cu filosofia greacă, apărând înțelepciunea lui Israel în fața alternativelor păgâne și apostate.
      date: cca 50 î.Hr.–50 d.Hr.
