payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Evanghelia copilăriei după Toma
      author: Anonim. Cea mai veche formă care poate fi reconstituită nu numește niciun autor; atribuirea lui Toma apare în titlurile manuscriselor ulterioare și în transmiterea textului.
      audience: Creștini curioși în privința copilăriei lui Isus și a felului în care puterea divină, disciplina, învățarea și maturizarea ar putea fi relatate înainte de începutul narațiunilor evangheliilor canonice.
      date: Este datată de obicei în secolul al II-lea d.Hr., dar textul s-a păstrat în mai multe versiuni grecești substanțial diferite și în traduceri timpurii.
    Acts of Paul and Thecla:
      display_name: Faptele lui Pavel și ale Teclei
      author: Anonim. Este un episod din lucrarea mai amplă Faptele lui Pavel; o relatare antică potrivit căreia un prezbiter ar fi compus Faptele nu permite identificarea sigură a autorului.
      audience: Creștini atrași de relatări despre propovăduirea apostolică, celibat, botez, perseverență asemănătoare celei a martirilor și autoritatea unei femei de a învăța și de a depune mărturie.
      date: A fost compusă în secolul al II-lea d.Hr., probabil în a doua jumătate a acestuia; a circulat atât în cadrul Faptelor lui Pavel, cât și ca lucrare independentă.
    Gospel of Peter:
      display_name: Evanghelia după Petru
      author: Anonim. Narațiunea păstrată vorbește cu glasul lui Petru și a fost transmisă sub numele lui, dar nu este considerată o lucrare a apostolului istoric.
      audience: Creștini timpurii interesați de o narațiune extinsă a pătimirii și învierii, probabil din comunități în care autoritatea lui Petru avea o importanță deosebită.
      date: Este datată de obicei în secolul al II-lea d.Hr.; principalul fragment grecesc păstrat provine dintr-un manuscris mult mai târziu, descoperit la Akhmim.
    2 Clement:
      display_name: A doua epistolă a lui Clement
      author: Anonim. În pofida titlului tradițional, aceasta este o omilie creștină timpurie, nu o a doua scrisoare a lui Clement al Romei.
      audience: O adunare creștină îndemnată la pocăință, consecvență morală, grijă față de cei vulnerabili și perseverență credincioasă în nădejdea învierii și a judecății.
      date: Este datată de obicei în prima jumătate sau pe la mijlocul secolului al II-lea d.Hr. (aproximativ 100–160); locul compunerii este incert.
    Epistle of Barnabas:
      display_name: Epistola lui Barnaba
      author: Anonim. Lucrarea a fost asociată în mod tradițional cu Barnaba, însoțitorul lui Pavel, dar cercetarea modernă nu acceptă această atribuire.
      audience: Creștini dintre neamuri, învățați să revendice Scripturile lui Israel printr-o interpretare cristologică și alegorică, făcând totodată deosebire între identitatea lor legată de legământ și practicile iudaice.
      date: Este datată de obicei între distrugerea templului din Ierusalim, în anul 70 d.Hr., și începutul secolului al II-lea, adesea aproximativ între anii 80 și 130.
