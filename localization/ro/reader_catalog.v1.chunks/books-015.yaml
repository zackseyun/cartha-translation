payload:
  book_metadata:
    1 Esdras:
      display_name: 1 Ezdra
      author: Autor anonim; o recompunere în limba greacă, ce reordonează 2 Cronici 35–36, Ezdra și Neemia 7–8.
      audience: Evreii din perioada elenistică ce doreau o relatare clară despre întoarcere și restaurare.
      date: cca sec. al II-lea–I î.Hr.
    Prayer of Manasseh:
      display_name: Rugăciunea lui Manase
      author: Autor anonim; atribuită în mod pseudonim regelui Manase.
      audience: Cei ce se pocăiau și se identificau cu pocăința lui Manase — folosită în cadrul liturgic în unele tradiții.
      date: cca sec. al II-lea–I î.Hr.
    Psalm 151:
      display_name: Psalmul 151
      author: Autor anonim; atribuit în mod pseudonim lui David. O formă ebraică este atestată în 11QPsa.
      audience: Comunitățile din diaspora și de la Qumran, atașate Psaltirii lui David.
      date: cca sec. al II-lea î.Hr. sau mai devreme.
    3 Maccabees:
      display_name: 3 Macabei
      author: Autor anonim; scriere compusă în limba greacă.
      audience: Evreii din diaspora egipteană vorbitori de greacă — o relatare despre izbăvire, plasată în timpul lui Ptolemeu al IV-lea.
      date: cca sec. I î.Hr.–sec. I d.Hr.
    4 Maccabees:
      display_name: 4 Macabei
      author: Autor anonim; un autor evreu vorbitor de greacă, influențat de filosofia stoică.
      audience: Evreii elenistici — o cuvântare filosofică despre rațiunea care stăpânește patimile prin credincioșie.
      date: cca sec. I d.Hr.
    Bel and the Dragon:
      display_name: Bel și Dragonul
      author: Autor anonim; una dintre adăugirile grecești la Daniel.
      audience: Evreii vorbitori de greacă — o polemică satirică împotriva idolatriei.
      date: cca sec. al II-lea–I î.Hr.
    Letter of Jeremiah:
      display_name: Scrisoarea lui Ieremia
      author: Autor anonim; atribuită în mod pseudonim lui Ieremia.
      audience: Evreii din diaspora, ispitiți de idolatria din jur.
      date: cca sec. al IV-lea–al II-lea î.Hr.
    Prayer of Azariah and Song of the Three:
      display_name: Rugăciunea lui Azaria și Cântarea celor trei
      author: Autor anonim; una dintre adăugirile grecești la Daniel.
      audience: Evreii vorbitori de greacă — material liturgic pentru Daniel 3.
      date: cca sec. al II-lea î.Hr.
    Susanna:
      display_name: Susana
      author: Autor anonim; una dintre adăugirile grecești la Daniel.
      audience: Evreii vorbitori de greacă — o istorisire despre dreptate și demascarea mărturiei mincinoase.
      date: cca sec. al II-lea–I î.Hr.
    1 Clement:
      display_name: 1 Clement
      author: Autor anonim, scriere atribuită lui Clement al Romei.
      audience: Adunarea creștină din Corint, prinsă într-o dispută privind conducerea.
      date: cca 96 d.Hr.
