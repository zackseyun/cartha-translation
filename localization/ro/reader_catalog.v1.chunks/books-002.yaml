  book_metadata:
    Numbers:
      display_name: Numeri
      author: Anonim; atribuită în mod tradițional lui Moise.
      audience: Israel în călătorie între Egipt și țara promisă — generația din pustiu și cititorii de mai târziu care învață din eșecurile ei.
      date: Straturi de redactare din perioada târzie a monarhiei până în perioada postexilică (cca secolele VII–V î.Hr.).
    Deuteronomy:
      display_name: Deuteronomul
      author: Anonim; prezentată drept cuvântările de rămas-bun ale lui Moise. Cercetarea modernă situează un nucleu al cărții în contextul reformei lui Iosia de la sfârșitul secolului al VII-lea î.Hr.
      audience: Israel pregătindu-se să intre în țară — și, mai târziu, exilații care se întrebau cum să trăiască în credincioșie fără templu sau rege.
      date: Nucleul datează aproximativ de la sfârșitul secolului al VII-lea î.Hr.; cartea a ajuns la forma finală în perioada exilului.
    Joshua:
      display_name: Iosua
      author: Anonim; parte a Istoriei deuteronomiste.
      audience: Israel în perioada monarhiei și a exilului, reflectând asupra cuceririi, legământului și semnificației țării.
      date: Compilată aproximativ în secolele VII–VI î.Hr. din tradiții mai vechi.
