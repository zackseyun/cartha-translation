      author: Ignatie, episcop al Antiohiei, autorul celor șapte scrisori din recenzia medie acceptată în mod obișnuit; scrisorile ignatiene extinse ulterior și cele pseudonime nu fac parte din această colecție.
      audience: Comunitățile creștine din Efes, Magnezia, Tralles, Roma, Filadelfia și Smirna, precum și Policarp, cărora Ignatie li s-a adresat în timpul călătoriei sale spre martiriu.
      date: Datate de obicei la începutul secolului al II-lea d.Hr., cel mai adesea aproximativ între anii 105 și 117, deși cronologia exactă a călătoriei lui Ignatie rămâne disputată.
