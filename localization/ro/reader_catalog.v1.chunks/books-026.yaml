review:
  verdict: revise
  review_summary: Revizuire completă efectuată. Catalogul este fidel în mare parte; au fost corectate formulări care schimbau sensul sau introduceau nuanțe neexprimate de sursă, inclusiv descrierea autorului, titlurile 20, 62, 75 și 84 din Letters of Ignatius.
  issues:
  - Metadatele despre autor au fost reformulate pentru a reda limpede faptul că Ignatie este autorul celor șapte scrisori ale recenziei medii.
  - 'Au fost eliminate sau corectate nuanțe adăugate în câteva titluri: „biruința” pentru „overthrow”, presupunerea că biserica Siriei „să aibă păstor”, numele propriu Rhaius și comparația suplimentară din titlul 84.'
