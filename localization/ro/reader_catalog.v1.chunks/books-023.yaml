payload:
  book_metadata:
    Gospel of Mary:
      display_name: Evanghelia Mariei
      author: Autor anonim. Lucrarea o prezintă pe Maria drept destinatară și interpretă a revelației lui Isus, dar nu susține că Maria ar fi scris evanghelia păstrată până astăzi.
      audience: Cititori creștini din perioada timpurie preocupați de revelație, înălțarea spirituală, autoritatea apostolică și legitimitatea învățăturii Mariei în rândul ucenicilor lui Isus.
      date: Datată de obicei în secolul al II-lea d.Hr.; s-au păstrat fragmente grecești din secolul al III-lea, iar principalul martor copt este păstrat în Codexul Berlin 8502 din secolul al V-lea.
    Treatise on the Resurrection:
      display_name: Tratat despre înviere
      author: Autor anonim. Lucrarea este alcătuită sub forma scrisorii unui învățător către un discipol numit Rheginos; nici învățătorul, nici Rheginos nu pot fi identificați cu certitudine.
      audience: Creștini care căutau îndrumare despre înviere, îndeosebi cititori care analizau dimensiunile trupească și spirituală ale învierii, precum și participarea la viața învierii încă din prezent.
      date: Plasat de obicei spre sfârșitul secolului al II-lea d.Hr. (adesea aproximativ între 170 și 200); este păstrat într-o copie coptă din secolul al IV-lea a unei lucrări grecești mai vechi.
    Dialogue of the Savior:
      display_name: Dialogul Mântuitorului
      author: Autor anonim. Dialogul pune învățături revelatoare pe buzele lui Isus, într-o conversație cu Iuda, Matei și Maria, dar nu îi identifică alcătuitorul.
      audience: Un cerc de creștini din perioada timpurie interesați de revelația privată, ucenicie, cunoașterea de sine, rugăciune și pregătirea ascetică pentru mântuire.
      date: Atribuit de regulă secolului al II-lea d.Hr., deși straturile sale de compoziție și data exactă rămân disputate; este păstrat într-un manuscris copt din secolul al IV-lea.
    Exegesis on the Soul:
      display_name: Tâlcuire despre suflet
      author: Autor anonim. Autorul este un predicator creștin care recitește imagini biblice și din literatura greacă drept o alegorie a căderii, pocăinței și restaurării sufletului.
      audience: Creștini familiarizați cu Scriptura și cu îndemnul moral, chemați să se întoarcă de la dorința dezordonată la pocăință și la reunirea cu divinul.
      date: Datată în general la sfârșitul secolului al II-lea sau la începutul secolului al III-lea d.Hr.; este păstrată într-o traducere coptă din secolul al IV-lea, realizată după un text grecesc.
    Book of Thomas the Contender:
      display_name: Cartea lui Toma Luptătorul
      author: Autor anonim. Titlul de la sfârșit asociază lucrarea cu Iuda Toma și îl numește pe Mathaias drept cel care a consemnat-o, însă acestea sunt atribuiri literare, nu afirmații verificabile despre autor.
      audience: Creștini cu înclinații ascetice, îndemnați să caute cunoașterea de sine, să se împotrivească patimilor trupești și să înțeleagă învățătura dată de Isus în particular lui Toma.
      date: Datată adesea la sfârșitul secolului al II-lea sau la începutul secolului al III-lea d.Hr., posibil într-un mediu creștin sirian; este păstrată într-un manuscris copt din secolul al IV-lea.
    Tripartite Tractate:
      display_name: Tratatul tripartit
      author: Autor anonim. Autorul a fost un teolog creștin valentinian foarte erudit; nu poate fi identificat cu certitudine cu vreun învățător cunoscut după nume.
      audience: O comunitate creștină valentiniană care primea învățături ample despre Dumnezeu, eoni, creație, Cristos, Biserică, mântuire și restaurarea finală.
      date: Datat de obicei în secolul al III-lea d.Hr., deși unele argumente indică a doua jumătate a acestuia; este păstrat în limba coptă, în Codexul Jung din secolul al IV-lea.
    Apocryphon of John:
      display_name: Apocriful lui Ioan
      author: Autor anonim. Lucrarea prezintă pseudonim o revelație a lui Isus înviat către Ioan, fiul lui Zebedeu, și s-a păstrat în mai multe recensiuni antice.
      audience: Creștini dintr-o tradiție revelatoare setiană sau strâns înrudită, care căutau o relatare despre tărâmul divin, creație, identitatea umană și eliberarea de conducătorii ostili.
      date: Probabil că o formă timpurie a circulat în secolul al II-lea d.Hr.; manuscrisele copte păstrate, care transmit recensiuni mai scurte și mai lungi, datează din secolele al IV-lea și al V-lea.
