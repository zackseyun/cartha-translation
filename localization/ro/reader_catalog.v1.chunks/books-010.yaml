payload:
  book_metadata:
    Joel:
      display_name: Ioel
      author: Ioel, fiul lui Petuel.
      audience: Iuda de după exil, răspunzând la o plagă de lăcuste ca semn al Zilei DOMNULUI.
      date: Probabil în jurul secolelor al V-lea–al IV-lea î.Hr.
    Amos:
      display_name: Amos
      author: Amos din Tecoa, un păstor din Iuda care a predicat în regatul de nord.
      audience: Regatul de nord al lui Israel, într-o perioadă de prosperitate și nedreptate sub Ieroboam al II-lea.
      date: În jurul anilor 760–750 î.Hr.
    Obadiah:
      display_name: Obadia
      author: Obadia.
      audience: Iuda, după ce Edom a trădat Ierusalimul — o profeție despre căderea Edomului.
      date: La scurt timp după anul 586 î.Hr.
    Jonah:
      display_name: Iona
      author: Autor anonim; personajul principal este Iona, fiul lui Amitai.
      audience: Israelul de după exil — o mustrare satirică a izolării etnice și o afirmare a îndurării lui Dumnezeu față de cei din afară.
      date: Probabil în jurul secolelor al V-lea–al IV-lea î.Hr.
    Micah:
      display_name: Mica
      author: Mica din Moreșet.
      audience: Iuda de la sfârșitul secolului al VIII-lea î.Hr., îndeosebi săracii din mediul rural, în contrast cu elitele urbane.
      date: În jurul anilor 740–700 î.Hr.
    Nahum:
      display_name: Naum
      author: Naum din Elcoș.
      audience: Iuda, care întâmpina cu bucurie apropiata cădere a cetății Ninive.
      date: Cu puțin timp înainte de anul 612 î.Hr.
    Habakkuk:
      display_name: Habacuc
      author: Habacuc.
      audience: Iuda, confruntată cu ascensiunea Babilonului — dialogul unui profet cu Dumnezeu despre dreptate.
      date: În jurul sfârșitului secolului al VII-lea î.Hr.
    Zephaniah:
      display_name: Țefania
      author: Țefania, fiul lui Cuși.
      audience: Iuda sub domnia lui Iosia, în ajunul reformelor sale.
      date: În jurul anilor 640–609 î.Hr.
    Haggai:
      display_name: Hagai
      author: Hagai.
      audience: Cei întorși din exil, care reconstruiau templul sub domnia lui Darius.
      date: Anul 520 î.Hr.
    Zechariah:
      display_name: Zaharia
      author: Zaharia, fiul lui Berechia; capitolele 9–14 sunt probabil de la un autor ulterior.
      audience: Cei întorși din exil, care reconstruiau templul, precum și comunitățile de mai târziu din perioada postexilică.
      date: Capitolele 1–8, în jurul anilor 520–518 î.Hr.; capitolele 9–14, poate cu un secol mai târziu.
    Malachi:
      display_name: Maleahi
      author: Autor anonim; „Maleahi” înseamnă „mesagerul meu”.
      audience: Iuda de după exil, devenită nepăsătoare în închinare și fidelitate sub stăpânirea persană.
      date: În jurul mijlocului secolului al V-lea î.Hr.
    Matthew:
      display_name: Matei
      author: Autor anonim; tradiția o atribuie apostolului Matei. Cercetarea modernă consideră că autorul era un iudeo-creștin vorbitor de greacă, care s-a bazat pe Marcu și pe o sursă asemănătoare sursei Q.
      audience: O comunitate iudeo-creștină preocupată de continuitatea și discontinuitatea față de iudaismul sinagogal.
      date: În jurul anilor 80–90 d.Hr.
    Mark:
      display_name: Marcu
      author: Autor anonim; tradiția îl asociază cu Ioan Marcu, tovarăș de călătorie al lui Petru.
      audience: O comunitate creștină vorbitoare de greacă, posibil din Roma, aflată sub amenințarea persecuției sau în apropierea ei.
      date: În jurul anilor 65–75 d.Hr., în jurul Războiului Iudaic și al distrugerii templului.
