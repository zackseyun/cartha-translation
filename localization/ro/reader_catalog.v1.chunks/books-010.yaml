review:
  verdict: revise
  review_summary: 'Corecție completă aplicată. Au fost ajustate formulări care întăreau nejustificat sursa ori restrângeau sensul: plaga de lăcuste din Ioel, datarea lui Marcu și formularea despre autorul ulterior din Zaharia; titlul din Mica 5 a fost redat fără a introduce o afirmație genealogică suplimentară.'
  issues:
  - 'Ioel—audiență: „invazie de lăcuste” a fost corectat la „plagă de lăcuste”, conform sursei.'
  - 'Zaharia—autor: „provin” a fost atenuat la formularea probabilistică din sursă.'
  - 'Marcu—dată: „în perioada” a fost corectat la „în jurul”, conform nuanței sursei.'
  - 'Mica 5: titlul a fost corectat pentru a evita adăugarea expresă a unei genealogii care nu apare în sursă.'
