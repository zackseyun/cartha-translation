      author: Anonim; parte din Istoria deuteronomistă.
      audience: Israelul din timpul exilului și de după exil, care se întreba de ce a căzut regatul.
      date: A ajuns la forma finală în timpul exilului babilonian, aproximativ în secolul al VI-lea î.Hr.
    2 Kings:
      display_name: 2 Regi
      author: Anonim; parte din Istoria deuteronomistă.
