    Genesis:
      display_name: Geneza
      author: Autor anonim; atribuită în mod tradițional lui Moise. Cercetarea modernă consideră că a avut o istorie îndelungată a compunerii, sursele fiind reunite ulterior prin redactare.
      audience: Israel, în identitatea sa de popor al legământului, a cărui istorie despre origini este întemeiată pe creația, alegerea și promisiunea lui Dumnezeu.
      date: Compusă de-a lungul mai multor secole; a ajuns la forma în care a fost transmisă aproximativ în secolele al VI-lea–al V-lea î.Hr., în timpul exilului babilonian sau după acesta.
      summary: Geneza relatează despre creație, răzvrătirea și împrăștierea omenirii și familia lui Avraam, Isaac, Iacov și Iosif, prin care încep promisiunile legământului lui Dumnezeu cu Israel.
    Exodus:
      display_name: Exodul
      author: Autor anonim; atribuită în mod tradițional lui Moise. Cercetarea modernă consideră că a avut o istorie îndelungată a compunerii, sursele fiind reunite ulterior prin redactare.
      audience: Israel, ca popor eliberat și legat prin legământ, care învață ce înseamnă să fie poporul DOMNULUI sub legea sa.
      date: Compusă de-a lungul mai multor secole; a ajuns la forma în care a fost transmisă aproximativ în secolele al VI-lea–al V-lea î.Hr.
    Leviticus:
      display_name: Leviticul
      author: Autor anonim; atribuită în mod tradițional lui Moise. Cercetarea modernă o încadrează în sursa preoțească.
      audience: Preoții israeliți și comunitatea care se închină — îndrumări despre jertfe, sfințenie și organizarea vieții în jurul prezenței lui Dumnezeu.
      date: Straturi de compoziție din perioada târzie a monarhiei până în perioada de după exil (aproximativ secolele al VII-lea–al V-lea î.Hr).
