      author: Autor anonim; suprascrierea îl invocă pe Solomon.
      audience: Israel, citind iubirea erotică drept o perspectivă asupra intimității legământului — iar mai târziu, cititori evrei și creștini care au interpretat-o alegoric.
      date: Probabil din perioada postexilică, aproximativ din secolele al V-lea–al III-lea î.Hr.
