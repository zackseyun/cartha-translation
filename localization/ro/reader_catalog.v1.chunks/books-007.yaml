    Proverbs:
      display_name: Proverbe
      author: O antologie; suprascrierile îi menționează pe Solomon, Agur, Lemuel și pe „înțelepți”.
      audience: Tineri israeliți formați în înțelepciune pentru viața de zi cu zi.
      date: Straturi de compoziție datând aproximativ din secolele al X-lea–al IV-lea î.Hr.
    Ecclesiastes:
      display_name: Eclesiastul
      author: Autor anonim; vorbitorul este „Qohelet”, identificat în mod tradițional cu Solomon.
      audience: Israeliți confruntați cu limitele înțelepciunii, bogăției și strădaniei sub soare.
      date: Probabil din secolele al V-lea–al III-lea î.Hr., pe baza limbii ebraice influențate de aramaică.
    Song of Solomon:
