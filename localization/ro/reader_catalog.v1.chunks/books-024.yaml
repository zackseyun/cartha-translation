  - 'Sophia 10: imperativul nejustificat a fost înlocuit cu un titlu nominal.'
  - 'Gospel of the Egyptians 8: redare mai exactă a expresiei „full majesty glory”.'
  - 'Protoevangelium 5, 6 și 9: ajustări pentru a evita interpretări adăugate și formulări nenaturale.'
