payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Ipostaza arhonților
      author: Anonim. Autorul interpretează Geneza printr-un mit revelator despre arhonți; lucrarea nu poate fi atribuită cu certitudine unui învățător cunoscut pe nume.
      audience: Creștini dintr-un mediu setian sau înrudit, care citeau Geneza ca pe un conflict între conducători cosmici neștiutori, înțelepciunea divină și originea spirituală a omenirii.
      date: Datată în mod obișnuit în secolul al III-lea d.Hr.; păstrată într-o copie coptă din secolul al IV-lea, în Codexul II de la Nag Hammadi.
    On the Origin of the World:
      display_name: Despre originea lumii
      author: Anonim. Lucrarea îmbină și reelaborează mai multe tradiții iudaice, creștine, platonice și mitologice, fără a-și numi compilatorul.
      audience: Cititori dintr-un mediu creștin cu tendințe gnostice, interesați de o istorie alternativă a creației, a conducătorilor cosmici, a Sophiei, a lui Adam și a Evei și a destinului final al lumii.
      date: Datată de obicei în secolul al III-lea d.Hr., deși s-ar putea baza pe materiale mai vechi; păstrată în principal în manuscrise copte din secolul al IV-lea.
    Sophia of Jesus Christ:
      display_name: Înțelepciunea lui Isus Cristos
      author: Anonim. Autorul adaptează un material cunoscut și din Eugnostos, transformându-l într-un dialog de după înviere între Isus și ucenicii săi.
      audience: Creștini interesați de înțelepciunea revelată despre Dumnezeul transcendent, rânduirea lumii cerești și originea și mântuirea sufletului.
      date: Datată adesea la sfârșitul secolului al II-lea sau în secolul al III-lea d.Hr.; păstrată în copii copte de la Nag Hammadi și în Codexul de la Berlin.
    Gospel of the Egyptians:
      display_name: Evanghelia egiptenilor
      author: Anonim. Această lucrare de la Nag Hammadi, numită și Cartea Sfântă a Marelui Spirit Nevăzut, este distinctă de Evanghelia greacă a egiptenilor, mai veche și cunoscută numai din citate.
      audience: O comunitate creștină setiană care folosea mituri complexe, nume sacre, imagini baptismale și laude imnice pentru a-și exprima identitatea spirituală și eliberarea.
      date: Atribuită de obicei secolului al II-lea sau al III-lea d.Hr.; două copii copte s-au păstrat în codexuri de la Nag Hammadi din secolul al IV-lea.
    Letter of Peter to Philip:
      display_name: Scrisoarea lui Petru către Filip
      author: Anonim. Scurta scrisoare introductivă și revelația care urmează sunt atribuite pseudonim lui Petru și Filip, neputând fi considerate cu certitudine scrise de vreunul dintre cei doi apostoli.
      audience: Creștini care căutau o autorizare apostolică pentru învățături despre Mântuitor, puterile ostile, suferință, misiune și restabilirea ucenicilor.
      date: Datată în mod obișnuit la sfârșitul secolului al II-lea sau la începutul secolului al III-lea d.Hr.; păstrată într-o copie de la Nag Hammadi din secolul al IV-lea și într-un manuscris copt mai târziu.
    Gospel of Judas:
      display_name: Evanghelia lui Iuda
      author: Anonim. Titlul îi atribuie lui Iuda relatarea, dar lucrarea nu dovedește că Iuda Iscarioteanul ar fi autorul ei istoric.
      audience: Un grup creștin critic față de practicile sacrificiale și ecleziale rivale, care folosea dialogul revelator și o cosmologie de tip setian pentru a reinterpreta rolul lui Iuda și moartea lui Isus.
      date: Datată de obicei la mijlocul sau spre sfârșitul secolului al II-lea d.Hr.; Irineu cunoștea o Evanghelie a lui Iuda în jurul anului 180, iar copia coptă păstrată datează probabil din secolul al III-lea sau al IV-lea.
    Protoevangelium of James:
      display_name: Protoevanghelia lui Iacov
      author: Anonim. Naratorul pretinde că este Iacov, dar lucrarea este pseudonimă și nu a fost scrisă de Iacov, fratele lui Isus.
      audience: Creștini interesați de nașterea și creșterea Mariei, de puritatea ei perpetuă, de nașterea lui Isus și de răspunsuri narative la întrebări lăsate deschise de Matei și Luca.
      date: Datată în general în a doua jumătate a secolului al II-lea d.Hr.; s-a păstrat în numeroase manuscrise grecești mai târzii și în traduceri vechi.
