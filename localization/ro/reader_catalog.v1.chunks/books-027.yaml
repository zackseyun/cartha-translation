payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Policarp către filipeni
      author: Policarp, episcop al Smirnei. Unii cercetători consideră că textul transmis combină materiale trimise în momente diferite.
      audience: Adunarea creștină din Filipi, care a cerut scrisorile lui Ignatie și a primit îndrumări despre credință, purtare, conducere, bani și perseverență.
      date: Începutul sau mijlocul secolului al II-lea d.Hr.; cel puțin o parte este strâns legată de călătoria lui Ignatie, iar ipotezele unei scrisori compozite permit datarea unei secțiuni ceva mai târziu.
    Martyrdom of Polycarp:
      display_name: Martiriul lui Policarp
      author: Membri anonimi ai bisericii din Smirna, scriind în numele comunității; notele finale despre transmitere reflectă copierea și răspândirea ulterioară.
      audience: Biserica din Filomelium și comunitatea creștină mai largă, cărora li se oferă o relatare despre arestarea, judecarea, moartea și răbdarea exemplară a lui Policarp.
      date: Scris după moartea lui Policarp, de obicei datat la mijlocul sau spre sfârșitul secolului al II-lea d.Hr.; atât anul exact al martiriului, cât și forma finală a documentului sunt disputate.
    Epistle to Diognetus:
      display_name: Epistola către Diognet
      author: Anonim. Autorul se numește pe sine ucenic sau învățăcel, dar nici el, nici Diognet, destinatarul scrierii, nu pot fi identificați cu certitudine.
      audience: Un cercetător necreștin instruit — și cititori asemenea lui — care întreabă despre închinarea, etica și identitatea socială a creștinilor, despre iubire și despre aparenta noutate a credinței.
      date: Adesea datată la sfârșitul secolului al II-lea sau începutul secolului al III-lea d.Hr., deși propunerile variază mult; ultimele două capitole ar putea proveni dintr-o altă lucrare.
    Fragments of Papias:
      display_name: Fragmentele lui Papias
      author: Papias, episcop al Hierapolisului, pentru lucrarea pierdută în cinci cărți Expuneri ale cuvintelor Domnului; colecția păstrată este alcătuită din citate și relatări conservate de autori ulteriori.
      audience: Creștinii timpurii care căutau învățături păstrate în memorie despre Isus și apostoli, adunate prin lanțuri numite de mărturii orale și interpretări.
      date: Lucrarea lui Papias este datată de obicei la începutul secolului al II-lea d.Hr., adesea aproximativ între anii 110 și 130; fragmentele păstrate apar în scrierile unor autori din secolul al II-lea și din secolele următoare.
