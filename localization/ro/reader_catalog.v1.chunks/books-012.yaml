payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 Corinteni
      author: Pavel, împreună cu Sostene.
      audience: Comunitatea creștină dezbinată din Corint.
      date: cca 53–55 d.Hr., scrisă din Efes.
    2 Corinthians:
      display_name: 2 Corinteni
      author: Pavel, împreună cu Timotei.
      audience: Comunitatea din Corint, după un conflict dureros.
      date: cca 55–56 d.Hr.
    Galatians:
      display_name: Galateni
      author: Pavel.
      audience: Comunitățile creștine din Galatia (Anatolia centrală), supuse presiunii de a adopta circumcizia și respectarea Torei.
      date: cca 48–55 d.Hr. (disputat).
    Ephesians:
      display_name: Efeseni
      author: Pavel sau un discipol apropiat care a scris în numele lui Pavel (disputat).
      audience: Un public creștin mai larg din Asia; numele locului „Efes” lipsește din cele mai vechi manuscrise.
      date: cca anii 60 d.Hr., dacă este paulină; cca anii 80–90 d.Hr., dacă este pseudonimă.
    Philippians:
      display_name: Filipeni
      author: Pavel, împreună cu Timotei.
      audience: Comunitatea creștină din Filipi, o colonie romană din Macedonia.
      date: cca 60–62 d.Hr., scrisă din închisoare.
    Colossians:
      display_name: Coloseni
      author: Pavel, împreună cu Timotei — sau un discipol apropiat care a scris în numele lui Pavel (disputat).
      audience: Creștinii din Colose, în valea râului Licos, confruntați cu o învățătură sincretistă.
      date: cca 60–62 d.Hr., dacă este paulină; mai târziu, dacă este pseudonimă.
    1 Thessalonians:
      display_name: 1 Tesaloniceni
      author: Pavel, împreună cu Silvanus și Timotei.
      audience: Tânăra comunitate creștină din Tesalonic, confruntată cu persecuția.
      date: cca 50–51 d.Hr. — probabil cea mai veche scrisoare paulină păstrată.
    2 Thessalonians:
      display_name: 2 Tesaloniceni
      author: Pavel (disputat; unii cercetători o consideră pseudonimă).
      audience: Comunitatea din Tesalonic, abordând confuzii escatologice.
      date: cca 51 d.Hr., dacă este paulină.
    1 Timothy:
      display_name: 1 Timotei
      author: Pavel sau un discipol care a scris în numele lui Pavel (Epistolele pastorale sunt considerate pe scară largă pseudonime).
      audience: Timotei, ca delegat al lui Pavel la Efes; un îndrumar pentru organizarea ulterioară a bisericii.
      date: cca mijlocul anilor 60 d.Hr., dacă este paulină; cca 90–110 d.Hr., dacă este pseudonimă.
    2 Timothy:
      display_name: 2 Timotei
      author: Pavel sau un discipol care a scris în numele lui Pavel.
      audience: Timotei — prezentată drept scrisoarea de rămas-bun a lui Pavel din închisoare.
      date: cca mijlocul anilor 60 d.Hr., dacă este paulină; cca 90–110 d.Hr., dacă este pseudonimă.
    Titus:
      display_name: Tit
      author: Pavel sau un discipol care a scris în numele lui Pavel.
      audience: Tit, ca delegat al lui Pavel în Creta.
      date: cca mijlocul anilor 60 d.Hr., dacă este paulină; cca 90–110 d.Hr., dacă este pseudonimă.
    Philemon:
      display_name: Filimon
      author: Pavel, împreună cu Timotei.
      audience: Filimon, un creștin care deținea sclavi, cu privire la sclavul său fugar, Onisim.
      date: cca 60–62 d.Hr.
    Hebrews:
      display_name: Evrei
      author: Autor anonim. Tradiția i-a menționat pe Pavel, Apolo, Barnaba, Priscila și alții; nicio propunere nu întrunește consensul.
      audience: Creștini evrei vorbitori de greacă, ispitiți să se îndepărteze de mărturisirea lor creștină.
      date: cca 60–95 d.Hr.
