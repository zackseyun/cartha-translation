review:
  verdict: revise
  summary: Revizuit pentru fidelitate față de contextul-sursă și fluență idiomatică. Am corectat titlul Evangheliei după Ioan, am evitat în rezumatul Genezei sugestia că promisiunile deja „se împlinesc” și am făcut mai firească alternativa de traducere din Ioan 1:1.
  issues:
  - Titlul „Ioan” este prea eliptic pentru o carte identificată în mod obișnuit în română ca „Evanghelia după Ioan”.
  - Rezumatul Genezei spunea că promisiunile legământului „încep să se împlinească”, în timp ce sursa afirmă că prin această familie promisiunile către Israel încep; formularea a fost ajustată pentru a nu anticipa împlinirea.
  - 'Alternativa din nota la Ioan 1:1 a fost reformulată idiomatic: „Cuvântul era ceea ce era Dumnezeu.”'
