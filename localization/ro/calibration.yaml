book_localizations:
- source_title: Genesis
  title: Geneza
  author: Autor anonim; atribuită în mod tradițional lui Moise. Cercetarea modernă consideră că lucrarea a avut o istorie îndelungată a redactării, surse diferite fiind reunite ulterior.
  audience: Israel, în identitatea sa de popor al legământului, a cărui istorie a originilor este ancorată în creația, alegerea și promisiunea lui Dumnezeu.
  date: Compusă de-a lungul mai multor secole; a ajuns la forma transmisă în jurul secolelor al VI-lea–al V-lea î.Hr., în timpul exilului babilonian sau după acesta.
  summary: Geneza vorbește despre creație, răzvrătirea și împrăștierea omenirii și despre familia lui Avraam, Isaac, Iacov și Iosif, prin care încep promisiunile legământului lui Dumnezeu față de Israel.
- source_title: John
  title: Evanghelia după Ioan
  author: Autor anonim; tradiția o atribuie apostolului Ioan sau „Ucenicului iubit”.
  audience: O comunitate creștină aflată în tensiune cu iudaismul sinagogal, formată în jurul mărturiei Ucenicului iubit.
  date: Aproximativ 90–110 d.Hr.
  summary: Ioan îl prezintă pe Isus drept Cuvântul veșnic, care îl descoperă pe Tatăl, dă viață prin încrederea în el și este glorificat prin semnele, moartea și învierea sa.
- source_title: Gospel of Thomas
  title: Evanghelia după Toma
  author: Autor anonim; începutul scrierii atribuie colecția de rostiri lui „Didymos Iuda Toma”. Textul integral s-a păstrat numai într-o traducere coptă din secolul al IV-lea, descoperită la Nag Hammadi (NHC II,2), alături de trei fragmente grecești de la Oxyrhynchus.
  audience: Cititori creștini influențați de tradiția sapiențială siriană și de gândirea protognostică, orientați spre autocunoașterea ezoterică din rostirile lui Isus.
  date: Originalul grecesc datează probabil din aproximativ 50–140 d.Hr.; manuscrisul copt, din jurul anului 340 d.Hr.
  summary: Evanghelia după Toma este o colecție de rostiri atribuite lui Isus. Nu are o narațiune continuă și îi cheamă în repetate rânduri pe cititori să descopere sensul rostirilor.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Geneza 1:1
  text: Când Dumnezeu a început să creeze cerurile și pământul[a]—
  translator_note: '[a] Traducerea tradițională consideră aceste cuvinte o propoziție completă: „La început, Dumnezeu a creat cerurile și pământul.” Formularea ebraică introduce însă mai firesc ceea ce urmează, acțiunea principală — „Dumnezeu a zis” — aflându-se în versetul 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Eclesiastul 1:2
  text: „Aburul aburilor[a]”, spune Qohelet[b]. „Totul este abur — trecător, imposibil de ținut în mână și adesea altfel decât ne așteptăm.”
  translator_note: '[a] Cuvântul ebraic hevel înseamnă literalmente „suflare” sau „abur”. În Eclesiastul, el descrie ceea ce trece repede, nu poate fi ținut sau înțeles pe deplin și adesea se dovedește a fi altfel decât se așteaptă oamenii. „Abur” păstrează această imagine fără a susține că nimic nu are sens. Alte redări posibile sunt „suflare”, „doar o suflare” și „trecător”. [b] Qohelet este numele sau titlul ebraic al autorului. Este tradus adesea prin „Învățătorul” sau „Predicatorul”, dar păstrăm forma „Qohelet” pentru a permite toate sensurile posibile, fără a favoriza o anumită interpretare.'
- source_path: nt/john/001/001.yaml
  reference: Ioan 1:1
  text: La început[b], Cuvântul exista deja. Cuvântul era cu Dumnezeu și Cuvântul era Dumnezeu.[a]
  translator_note: '[a] Sau: „Cuvântul era divin” ori „Cuvântul era ceea ce era Dumnezeu”. Formularea grecească afirmă că Cuvântul este pe deplin Dumnezeu, distingându-l totodată de Dumnezeu din propoziția anterioară. [b] Acest început trimite la Geneza 1:1 și leagă Cuvântul de începutul creației. Verbul la imperfect arată o existență continuă: Cuvântul exista când a venit începutul, nu a luat atunci ființă. Sunt posibile și redările „era” și „exista”.'
- source_path: nt/romans/003/025.yaml
  reference: Romani 3:25
  text: Dumnezeu l-a înfățișat ca jertfă de ispășire[a], prin credința în sângele lui[b]. A făcut aceasta pentru a-și arăta dreptatea[c], deoarece trecuse cu vederea păcatele săvârșite în trecut.
  translator_note: '[a] Sau „jertfă de împăcare”; ori „capacul ispășirii”, capacul de aur al Chivotului Legământului, pe care era stropit sângele ispășitor în Vechiul Testament. [b] Sau: „prin credință, prin sângele lui”. [c] Sau „justiția”.'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Petru 1:13
  text: De aceea, pregătiți-vă mintea pentru acțiune.[a] Fiți pe deplin lucizi și puneți-vă întreaga speranță în harul care vă este adus când Isus Mesia va fi descoperit.[b]
  translator_note: '[a] Textul grecesc spune literalmente: „încingeți coapsele minții voastre”. Imaginea este aceea a strângerii hainelor lungi în jurul taliei pentru a fi gata de acțiune; aici, ea exprimă pregătirea minții și disponibilitatea de a acționa. [b] Cuvântul grecesc redat prin „pe deplin” și „întreaga” se poate referi la luciditate, la punerea speranței sau, posibil, la amândouă.'
