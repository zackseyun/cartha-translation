  Dialogue of the Savior:
    display_name: Dialogul Mântuitorului
    author: Autor anonim. Dialogul pune învățături revelatoare pe buzele lui Isus, într-o conversație cu Iuda, Matei și Maria, dar nu îi identifică alcătuitorul.
    audience: Un cerc de creștini din perioada timpurie interesați de revelația privată, ucenicie, cunoașterea de sine, rugăciune și pregătirea ascetică pentru mântuire.
