    audience: Creștinii timpurii care căutau învățături păstrate în memorie despre Isus și apostoli, adunate prin lanțuri numite de mărturii orale și interpretări.
    date: Lucrarea lui Papias este datată de obicei la începutul secolului al II-lea d.Hr., adesea aproximativ între anii 110 și 130; fragmentele păstrate apar în scrierile unor autori din secolul al II-lea și din secolele următoare.
