  Epistle to Diognetus:
    display_name: Epistola către Diognet
    author: Anonim. Autorul se numește pe sine ucenic sau învățăcel, dar nici el, nici Diognet, destinatarul scrierii, nu pot fi identificați cu certitudine.
    audience: Un cercetător necreștin instruit — și cititori asemenea lui — care întreabă despre închinarea, etica și identitatea socială a creștinilor, despre iubire și despre aparenta noutate a credinței.
    date: Adesea datată la sfârșitul secolului al II-lea sau începutul secolului al III-lea d.Hr., deși propunerile variază mult; ultimele două capitole ar putea proveni dintr-o altă lucrare.
