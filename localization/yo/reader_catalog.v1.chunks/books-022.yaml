    Gospel of Philip:
      display_name: Ìhìn Rere Fílípì
      author: Aláìlórúkọ. Àkọlé náà fara hàn nínú àkọsílẹ̀ ìparí ìwé àfọwọ́kọ náà, ṣùgbọ́n iṣẹ́ yìí kò sọ pé Fílípì ni ó kọ ọ́. Ẹ̀dà kan ṣoṣo tó ṣì wà ni ọ̀rọ̀ Kọ́pítì inú Kódẹ́ẹ̀sì Nag Hammadi II,3.
      audience: Àwùjọ Kristẹni ìjímìjí kan tí ó mọ̀ nípa ẹ̀kọ́ lórí àwọn àṣà mímọ́ tó jọ ti àwọn ọmọlẹ́yìn Valentinus, pàápàá nípa ìbatisí, àmì òróró, Oúnjẹ Alẹ́ Olúwa, ìràpadà, àjíǹde, àti àwòrán yàrá ìgbéyàwó.
      date: Ní gbogbogbòò, wọ́n máa ń fi sí òpin ọ̀rúndún kejì tàbí ìbẹ̀rẹ̀ ọ̀rúndún kẹta Lẹ́yìn Sànmánì Kristẹni; a sì pa á mọ́ sínú ìwé àfọwọ́kọ Kọ́pítì ti ọ̀rúndún kẹrin, tí a túmọ̀ láti inú ẹ̀dà Gíríìkì kan tó ṣáájú rẹ̀.
