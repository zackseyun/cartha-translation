payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Pọlikápù sí àwọn ará Fílípì
      author: Pọlikápù, bíṣọ́ọ̀bù Smírínà. Àwọn ọ̀mọ̀wé kan gbà pé ọ̀rọ̀ tí ó dé ọ̀dọ̀ wa parapọ̀ láti inú ohun tí a fi ránṣẹ́ ní àkókò tí ó ju ẹyọ kan lọ.
      audience: Ìjọ àwọn Kristẹni ní Fílípì, tí ó béèrè fún àwọn lẹ́tà Ignátíù, tí ó sì gba ìmọ̀ràn nípa ìgbàgbọ́, ìwà, aṣáájú, owó, àti ìfaradà.
      date: Ní ìbẹ̀rẹ̀ sí àárín ọ̀rúndún kejì L.K.; ó kéré tán, apá kan ní ìbátan tímọ́tímọ́ pẹ̀lú ìrìnàjò Ignátíù, ṣùgbọ́n àwọn àbá pé lẹ́tà náà jẹ́ àkójọpọ̀ fàyè gba pé apá kan lè jẹ́ ti ìgbà díẹ̀ lẹ́yìn náà.
    Martyrdom of Polycarp:
      display_name: Ikú Ajẹ́rìí Pọlikápù
      author: Àwọn ọmọ ìjọ Smírínà tí a kò mọ orúkọ wọn, tí wọ́n kọ ọ́ ní orúkọ àwùjọ náà; àwọn àkọsílẹ̀ ní ìparí nípa bí a ṣe tan ọ̀rọ̀ náà ká fi hàn pé a tún daakọ rẹ̀, a sì pín in ká nígbà tó yá.
      audience: Ìjọ ní Fílómélíọ̀mù àti gbogbo àwùjọ àwọn Kristẹni, tí a fi ìtàn bí a ṣe mú Pọlikápù, bí a ṣe dá a lẹ́jọ́, ikú rẹ̀, àti ìfaradà àwòkọ́ṣe rẹ̀ ránṣẹ́ sí.
      date: A kọ ọ́ lẹ́yìn ikú Pọlikápù, a sì sábà máa ń fi sí àárín tàbí apá ìkẹyìn ọ̀rúndún kejì L.K.; ọdún pàtó tí ikú ajẹ́rìí náà ṣẹlẹ̀ àti ìrísí ìkẹyìn ìwé náà ṣì jẹ́ ohun àríyànjiyàn.
    Epistle to Diognetus:
      display_name: Lẹ́tà sí Diognetus
      author: A kò mọ ẹni tó kọ ọ́. Òǹkọ̀wé náà pe ara rẹ̀ ní ọmọ-ẹ̀yìn tàbí akẹ́kọ̀ọ́, ṣùgbọ́n a kò lè dá ẹni tí òun tàbí Diognetus tí a kọ̀wé sí jẹ́ mọ̀ dájú.
      audience: Ẹni tí kì í ṣe Kristẹni, tí ó kàwé, tí ó sì ń wádìí—àti àwọn òǹkàwé bí tirẹ̀—tí wọ́n ń béèrè nípa ìjọsìn àwọn Kristẹni, ìwà rere, ipò wọn láwùjọ, ìfẹ́, àti bí ìgbàgbọ́ náà ṣe dà bí ohun tuntun.
      date: A sábà máa ń fi ọjọ́ rẹ̀ sí apá ìkẹyìn ọ̀rúndún kejì tàbí ìbẹ̀rẹ̀ ọ̀rúndún kẹta L.K., bí ó tilẹ̀ jẹ́ pé àwọn àbá yàtọ̀ síra gidigidi; ó ṣeé ṣe kí orí méjì tó gbẹ̀yìn wá láti inú iṣẹ́ mìíràn.
    Fragments of Papias:
      display_name: Àwọn Àjẹkù Ìwé Papias
      author: Papias, bíṣọ́ọ̀bù Hierapolis, ni ó kọ Àwọn Àlàyé Ọ̀rọ̀ Olúwa oní ìwé márùn-ún tí ó sọnù; àkójọpọ̀ tó ṣẹ́ kù jẹ́ àwọn ọ̀rọ̀ àyọlò àti ìròyìn tí àwọn òǹkọ̀wé tó wá lẹ́yìn pa mọ́.
      audience: Àwọn Kristẹni ìjímìjí tí wọ́n ń wá àwọn ẹ̀kọ́ tí a rántí nípa Jésù àti àwọn aposteli, tí a kó jọ nípasẹ̀ àwọn ìtẹ̀lé ẹlẹ́rìí àsọyé tí a dárúkọ àti ìtumọ̀ wọn.
      date: A sábà máa ń fi iṣẹ́ Papias sí ìbẹ̀rẹ̀ ọ̀rúndún kejì L.K., ní ọ̀pọ̀ ìgbà ní nǹkan bí ọdún 110–130; àwọn àjẹkù tó ṣẹ́ kù wà nínú iṣẹ́ àwọn òǹkọ̀wé láti ọ̀rúndún kejì lọ.
