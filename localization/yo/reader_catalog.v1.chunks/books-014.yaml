    Sirach:
      display_name: Síràkì
      author: Yéṣúà ọmọ Élíásárì ọmọ Sírà ti Jerúsálẹ́mù; ọmọ ọmọ rẹ̀ ló túmọ̀ ọ́ sí èdè Gíríìkì.
      audience: Àwọn ọ̀dọ́kùnrin Júù tí wọ́n ń kọ́ nípa ọgbọ́n ní Jerúsálẹ́mù ní àkókò ìṣàkóso àti àṣà Gíríìkì.
      date: Àkọ́kọ́ èdè Hébérù, ní nǹkan bí ọdún 195–175 ṣáájú Sànmánì Kristẹni; ìtumọ̀ Gíríìkì, ní nǹkan bí ọdún 132 ṣáájú Sànmánì Kristẹni.
    Baruch:
      display_name: Bárúkù
      author: A kò mọ ẹni tó kọ ọ́; a fi orúkọ Bárúkù, akọ̀wé Jeremáyà, lélẹ̀ bí ẹni pé òun ló kọ ọ́.
      audience: Àwọn Júù tí ń gbé káàkiri lẹ́yìn ilẹ̀ wọn, tí wọ́n ń ronú nípa ìgbèkùn, ìrònúpìwàdà àti ọgbọ́n.
      date: Ní nǹkan bí ọ̀rúndún kejì ṣáájú Sànmánì Kristẹni.
    1 Maccabees:
      display_name: Makabí Kìíní
      author: A kò mọ ẹni tó kọ ọ́; ó ṣeé ṣe kí ó jẹ́ òǹkọ̀wé kan ní Jerúsálẹ́mù tó kọ ọ́ ní èdè Hébérù (ẹ̀dà Gíríìkì nìkan ló ṣì wà).
      audience: Àwọn Júù nígbà ìṣọ̀tẹ̀ àwọn Hasmoníà àti lẹ́yìn rẹ̀; ó ń sọ ìtàn láti fi hàn pé ìjọba ìdílé Hasmoníà lẹ́tọ̀ọ́.
      date: Ní nǹkan bí ọdún 100 ṣáájú Sànmánì Kristẹni.
    2 Maccabees:
      display_name: Makabí Kejì
      author: A kò mọ ẹni tó ṣe àkótán iṣẹ́ gígùn kan tí Jásónì ará Kirénè kọ; èdè Gíríìkì ni a fi kọ ọ́.
      audience: Àwọn Júù tó ń sọ èdè Gíríìkì tí wọ́n ń gbé káàkiri lẹ́yìn ilẹ̀ wọn—pẹ̀lú ìtẹnumọ́ lórí ikú nítorí ìgbàgbọ́, ìtọ́jú Ọlọ́run àti àjíǹde.
      date: Ní nǹkan bí ọdún 124 ṣáájú Sànmánì Kristẹni tàbí ní kété lẹ́yìn náà.
