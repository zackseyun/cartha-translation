  verdict: revise
  review_summary: Àtúnyẹ̀wò parí. A ti ṣàtúnṣe àwọn akọ́lé tí ìtumọ̀ wọn yà kúrò nínú orísun, pàápàá 1 Makabí 6 àti 2 Makabí 8; a tún mú ìpọ̀pọ̀ ọkọ̀ omi ní Ọgbọ́n Solomoni 14 bá orísun mu.
  issues:
  - '1 Maccabees 6: Ìtumọ̀ àkọ́kọ́ sọ pé Áńtíókù kú lẹ́yìn ìṣẹ́gun rẹ̀, dípò lẹ́yìn tí a ṣẹ́gun rẹ̀.'
  - '2 Maccabees 8: Àkọ́lé àkọ́kọ́ fi ẹgbẹ́-ogun Nikánórì sílẹ̀.'
  - 'Wisdom of Solomon 14: A ti ṣàfihàn ''ships'' gẹ́gẹ́ bí ọ̀pọ̀ ọkọ̀ omi.'
