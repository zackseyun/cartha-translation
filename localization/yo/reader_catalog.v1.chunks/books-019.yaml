review:
  verdict: revise
  review_summary: A ṣe àtúnṣe sí àwọn ìtumọ̀ tí kò pé, ní pàtàkì ọjọ́ Ìhìn Rere Òtítọ́, akọlé Jubilees, àti àwọn akọlé díẹ̀ tí ó ṣàfikún ìtumọ̀ tàbí tí ó yí ìbáṣepọ̀ gírámà orísun padà.
  issues:
  - Ọjọ́ Ìhìn Rere Òtítọ́ gbọdọ̀ jẹ́ Lẹ́yìn Kristi, kì í ṣe S.K.
  - Àkọlé ìwé Jubilees ti wà ní ìtumọ̀ àìpẹ́; a tún un ṣe sí Júbílì.
  - A tún àwọn akọlé kan ṣe láti yọ ìtumọ̀ tí a dá síi kúrò, láti tọ́ka sí ‘master’ dípò ‘Lord’, àti láti ṣàfihàn ìṣe orísun ní pípé.
