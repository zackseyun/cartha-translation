  book_metadata:
    1 Enoch:
      display_name: 1 Ẹ́nọ́kù
      author: A kò mọ ẹni tó kọ ọ́; a fi orúkọ Ẹ́nọ́kù, baba ńlá tó gbé ayé ṣáájú Ìkún-omi, pè é bí ẹni pé òun ló kọ ọ́. Iṣẹ́ àkójọpọ̀ ni, tí a sì kó jọ láti inú ọ̀pọ̀ abala ọ̀tọ̀ọ̀tọ̀.
      audience: Àwọn àwùjọ Júù tó nífẹ̀ẹ́ sí ìran nípa òpin ayé, tí wọ́n ń ronú lórí ibi tó wà ní àgbáyé, ìdájọ́ àti kàlẹ́ńdà; lẹ́yìn náà, àwọn àwùjọ Kristẹni ìjímìjí tún kà á.
      date: A kó àwọn abala rẹ̀ jọ ní nǹkan bí ọ̀rúndún kẹta ṣáájú Sànmánì Kristẹni sí ọ̀rúndún kìíní Sànmánì Kristẹni; èdè Gẹ́ẹ̀zì (ti Etiópíà) nìkan ni ó pa gbogbo rẹ̀ mọ́ dé òní.
