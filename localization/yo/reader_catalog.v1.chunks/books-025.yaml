payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Ìhìn Rere Nípa Ìgbà Èwe Tọ́másì
      author: A kò mọ ẹni tó kọ ọ́. Ìrísí rẹ̀ àkọ́kọ́ jù lọ tí a lè tún tọpasẹ̀ kò dárúkọ òǹkọ̀wé kan; ìsọfúnni pé Tọ́másì ni ó kọ ọ́ wá láti inú àwọn àkọlé ìwé àfọwọ́kọ àti bí a ṣe gbé e ká ní àwọn àkókò tó tẹ̀ lé e.
      audience: Àwọn Kristẹni tí wọ́n fẹ́ mọ nípa ìgbà èwe Jésù àti bí a ṣe lè ròyìn agbára Ọlọ́run, ìbáwí, ẹ̀kọ́, àti bí ó ṣe ń dàgbà kí àwọn ìtàn Ìhìn Rere inú Bíbélì tó bẹ̀rẹ̀.
      date: A sábà máa ń tọpasẹ̀ rẹ̀ sí ọ̀rúndún kejì Lẹ́yìn Kristi, ṣùgbọ́n ọ̀pọ̀ àtúnyẹ̀wò èdè Gíríìkì tí ó yàtọ̀ sí ara wọn gan-an àti àwọn ìtumọ̀ ìjímìjí ni ọ̀rọ̀ náà wà nínú wọn títí di òní.
    Acts of Paul and Thecla:
      display_name: Ìṣe Pọ́ọ̀lù àti Tẹ́kílà
      author: A kò mọ ẹni tó kọ ọ́. Ó jẹ́ apá kan nínú Ìṣe Pọ́ọ̀lù tó gùn ju èyí lọ; ìròyìn àtijọ́ kan pé alùfáà àgbà kan ló kọ Ìṣe náà kò lè fi dá ẹni tó kọ ọ́ mọ̀ dájú.
      audience: Àwọn Kristẹni tí àwọn ìtàn nípa ìwàásù àwọn àpọ́sítélì, àìgbéyàwó, ìbatisí, ìfaradà tó dà bí ti ajẹ́rìíkú, àti àṣẹ obìnrin láti kọ́ni àti láti jẹ́rìí fà mọ́ra.
      date: A kọ ọ́ ní ọ̀rúndún kejì Lẹ́yìn Kristi, ó ṣeé ṣe kó jẹ́ ní ìdajì ìkẹyìn ọ̀rúndún náà; ó tàn ká gẹ́gẹ́ bí apá kan nínú Ìṣe Pọ́ọ̀lù àti gẹ́gẹ́ bí iṣẹ́ tó dá dúró fúnra rẹ̀.
    Gospel of Peter:
      display_name: Ìhìn Rere Pétérù
      author: A kò mọ ẹni tó kọ ọ́. Ìtàn tó ṣẹ́ kù ń sọ̀rọ̀ bí ẹni pé Pétérù ló ń sọ ọ́, a sì gbé e ká ní orúkọ rẹ̀, ṣùgbọ́n a kò kà á sí iṣẹ́ Pétérù àpọ́sítélì tó gbé ayé ní ìtàn.
      audience: Àwọn Kristẹni ìjímìjí tí wọ́n nífẹ̀ẹ́ sí ìtàn tó fẹ̀ sí i nípa ìjìyà, ikú àti àjíǹde Jésù, ó ṣeé ṣe kó jẹ́ láàárín àwọn àwùjọ tí wọ́n ka ọlá àṣẹ Pétérù sí pàtàkì gan-an.
      date: A sábà máa ń fi ọjọ́ rẹ̀ sí ọ̀rúndún kejì Lẹ́yìn Kristi; àjákù èdè Gíríìkì pàtàkì tó ṣẹ́ kù wá láti inú ìwé àfọwọ́kọ tí a kọ pẹ́ púpọ̀ lẹ́yìn náà, tí a rí ní Ákímímì.
    2 Clement:
      display_name: Kílẹ́ḿtì Kejì
      author: A kò mọ ẹni tó kọ ọ́. Láìka àkọlé ìbílẹ̀ rẹ̀ sí, ìwàásù Kristẹni ìjímìjí ni èyí, kì í ṣe lẹ́tà kejì tí Kílẹ́ḿtì ará Róòmù kọ.
      audience: Àpéjọ Kristẹni kan tí a ń rọ̀ láti ronúpìwàdà, láti máa hùwà déédéé, láti tọ́jú àwọn aláìlera, àti láti fi òtítọ́ fara da nínú ìrètí àjíǹde àti ìdájọ́.
      date: A sábà máa ń fi ọjọ́ rẹ̀ sí ìdajì àkọ́kọ́ tàbí àárín ọ̀rúndún kejì Lẹ́yìn Kristi (ní nǹkan bí ọdún 100–160); ibi tí a ti kọ ọ́ kò dájú.
    Epistle of Barnabas:
      display_name: Lẹ́tà Bánábà
      author: A kò mọ ẹni tó kọ ọ́. Ní ìbílẹ̀, a so iṣẹ́ náà mọ́ Bánábà, alábàáṣiṣẹ́ Pọ́ọ̀lù, ṣùgbọ́n àwọn ọ̀mọ̀wé òde òní kò gba ìsọfúnni yẹn.
      audience: Àwọn Kristẹni tí kì í ṣe Júù, tí a ń kọ́ láti gba Ìwé Mímọ́ Ísírẹ́lì gẹ́gẹ́ bí tiwọn nípasẹ̀ ìtumọ̀ tó dá lórí Kristi àti ìtumọ̀ àpẹẹrẹ, nígbà tí wọ́n ń fi ìdánimọ̀ májẹ̀mú wọn yàtọ̀ sí àṣà àwọn Júù.
      date: A sábà máa ń fi ọjọ́ rẹ̀ sí àárín ìparun tẹ́ńpìlì Jerúsálẹ́mù ní ọdún 70 Lẹ́yìn Kristi àti ìbẹ̀rẹ̀ ọ̀rúndún kejì, ní ọ̀pọ̀ ìgbà sí nǹkan bí ọdún 80–130.
