review:
  verdict: revise
  review_summary: Àtúnyẹ̀wò ti parí. A ṣàtúnṣe àwọn àkọlé díẹ̀ fún ìtumọ̀ tó péye síi, pàápàá níbi tí ìtumọ̀ ìṣe tàbí ìbátan kò tẹ̀lé Gẹ̀ẹ́sì dáadáa.
  issues:
  - Àkọlé Infancy Gospel of Thomas 2 ní ìtumọ̀ tí kò péye fún “shapes birds”; a tún un ṣe.
  - Acts of Paul and Thecla 2 lo ọ̀rọ̀ tó sún mọ́ “loves” dípò “longs for”; a tún un ṣe.
  - Acts of Paul and Thecla 11 ní ìtumọ̀ tí kò dájú; a ṣe e nípa ṣíṣe ìbátan Tẹ́kílà àti ìbòjú rẹ̀ hàn.
