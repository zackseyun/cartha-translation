    Ruth:
      display_name: Rúùtù
      author: A kò mọ ẹni tó kọ ọ́.
      audience: Àwọn ọmọ Ísírẹ́lì lẹ́yìn ìgbèkùn—ó ṣeé ṣe kí ó máa jiyàn fún fífi àwọn àjèjì sínú àwùjọ, ní ìtakò sí àwọn ìlànà ìyàsọ́tọ̀ ti Ẹ́sírà-Nehémáyà.
      date: Ó ṣeé ṣe jù lọ pé lẹ́yìn ìgbèkùn ni a kọ ọ́, ní nǹkan bí ọ̀rúndún kẹfà sí ìkẹrin ṣáájú Sànmánì Kristẹni.
