      date: A ṣàkójọ rẹ̀ ní nǹkan bí ọ̀rúndún keje sí ìkẹfà ṣáájú Sànmánì Kristẹni láti inú àwọn orísun tó ti pẹ́ jù bẹ́ẹ̀ lọ.
