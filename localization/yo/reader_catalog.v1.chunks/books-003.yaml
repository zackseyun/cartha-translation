      audience: Àwọn ọmọ Ísírẹ́lì ìgbà tó tẹ̀ lé e, tí wọ́n ń ka ìtàn ayé wọn ṣáájú ìṣàkóso ọba gẹ́gẹ́ bí àyíká ìkìlọ̀ nípa yíyípadà kúrò lọ́dọ̀ Ọlọ́run àti ìgbàlà.
