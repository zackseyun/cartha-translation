  book_metadata:
    Gospel of Mary:
      display_name: Ìhìn Rere Màríà
      author: A kò mọ ẹni tó kọ ọ́. Iṣẹ́ yìí fi Màríà hàn gẹ́gẹ́ bí ẹni tó gba ìfihàn Jésù, tó sì túmọ̀ rẹ̀, ṣùgbọ́n kò sọ pé Màríà ló kọ ìhìn rere tó wà di òní.
      audience: Àwọn Kristẹni ìjímìjí tí wọ́n ń ronú jinlẹ̀ nípa ìfihàn, ìgòkè nípa ẹ̀mí, àṣẹ àwọn aposteli, àti bóyá ó yẹ kí àwọn ọmọ-ẹ̀yìn Jésù gba ẹ̀kọ́ Màríà gẹ́gẹ́ bí ohun tó lẹ́tọ̀ọ́.
      date: Ní ọ̀pọ̀ ìgbà, a máa ń sọ pé ó wá láti ọ̀rúndún kejì Sànmánì Tiwa; àwọn àjákù èdè Gíríìkì láti ọ̀rúndún kẹta ṣì wà, ẹ̀rí pàtàkì jù lọ ní èdè Kọ́ọ̀pù sì wà nínú Kódẹ́ẹ̀sì Berlin 8502 ti ọ̀rúndún karùn-ún.
    Treatise on the Resurrection:
      display_name: Àpilẹ̀kọ Nípa Àjíǹde
      author: A kò mọ ẹni tó kọ ọ́. A gbé iṣẹ́ yìí kalẹ̀ bí lẹ́tà olùkọ́ kan sí akẹ́kọ̀ọ́ kan tó ń jẹ́ Reginos; a kò lè dá ẹni tí olùkọ́ náà tàbí Reginos jẹ́ mọ̀ dájú.
      audience: Àwọn Kristẹni tó ń wá ìtọ́nisọ́nà nípa àjíǹde, pàápàá àwọn òǹkàwé tó ń gbé àjíǹde ti ara, ti ẹ̀mí, àti kíkópa nínú ìyè àjíǹde nísinsìnyí yẹ̀ wò.
      date: Ní ọ̀pọ̀ ìgbà, a máa ń fi sí apá ìparí ọ̀rúndún kejì Sànmánì Tiwa (ní ọ̀pọ̀ ìgbà, ní nǹkan bí ọdún 170 sí 200); ó wà nínú ẹ̀dà Kọ́ọ̀pù ti ọ̀rúndún kẹrin tí a tú láti inú iṣẹ́ Gíríìkì àtijọ́ kan.
    Dialogue of the Savior:
      display_name: Ìfọ̀rọ̀wérọ̀ Olùgbàlà
      author: A kò mọ ẹni tó kọ ọ́. Ìfọ̀rọ̀wérọ̀ náà fi ẹ̀kọ́ ìfihàn sí ẹnu Jésù nínú ìjíròrò rẹ̀ pẹ̀lú Júdásì, Mátíù àti Màríà, ṣùgbọ́n kò sọ ẹni tó ṣàkójọ rẹ̀.
      audience: Àwùjọ Kristẹni ìjímìjí kan tó nífẹ̀ẹ́ sí ìfihàn àdáni, jíjẹ́ ọmọ-ẹ̀yìn, mímọ ara ẹni, àdúrà, àti ìmúrasílẹ̀ aláìfẹ́ ìgbádùn fún ìgbàlà.
      date: Gẹ́gẹ́ bí èrò tó wọ́pọ̀, ó wá láti ọ̀rúndún kejì Sànmánì Tiwa, bó tilẹ̀ jẹ́ pé àríyànjiyàn ṣì wà lórí àwọn ipele ìṣàkójọ rẹ̀ àti ọjọ́ pàtó tí a kọ ọ́; ó wà nínú ìwé afọ́wọ́kọ Kọ́ọ̀pù ti ọ̀rúndún kẹrin.
    Exegesis on the Soul:
      display_name: Ìtumọ̀ Nípa Ọkàn
      author: A kò mọ ẹni tó kọ ọ́. Òǹkọ̀wé náà jẹ́ oníwàásù Kristẹni tó tún àwọn àwòrán inú Bíbélì àti lítíréṣọ̀ Gíríìkì kà gẹ́gẹ́ bí àkàwé nípa ìṣubú ọkàn, ìrònúpìwàdà rẹ̀ àti ìmúpadàbọ̀sípò rẹ̀.
      audience: Àwọn Kristẹni tó mọ Ìwé Mímọ́ àti ọ̀rọ̀ ìṣírí sí ìwà rere, tí a ń pè láti fi ìfẹ́kúfẹ̀ẹ́ tí kò bójú mu sílẹ̀, kí wọ́n ronúpìwàdà, kí wọ́n sì tún darapọ̀ mọ́ Ọlọ́run.
      date: Ní gbogbogbòò, a máa ń sọ pé ó wá láti apá ìparí ọ̀rúndún kejì tàbí ìbẹ̀rẹ̀ ọ̀rúndún kẹta Sànmánì Tiwa; ó wà nínú ìtumọ̀ Kọ́ọ̀pù ti ọ̀rúndún kẹrin láti inú èdè Gíríìkì.
    Book of Thomas the Contender:
      display_name: Ìwé Tọ́másì Ajìjàkadì
      author: A kò mọ ẹni tó kọ ọ́. Àkọlé tó wà ní òpin rẹ̀ so iṣẹ́ náà mọ́ Júdásì Tọ́másì, ó sì pe Mathaias ní akọ̀wé rẹ̀, ṣùgbọ́n ìsọfúnni lítíréṣọ̀ ni ìwọ̀nyí, wọn kì í ṣe ẹ̀rí tó lè fìdí ẹni tó kọ ọ́ múlẹ̀.
      audience: Àwọn Kristẹni tó tẹ̀ sí ìgbé ayé aláìfẹ́ ìgbádùn, tí a rọ̀ láti wá ìmọ̀ ara ẹni, láti kọ ìfẹ́kúfẹ̀ẹ́ ara, àti láti lóye ẹ̀kọ́ àdáni Jésù sí Tọ́másì.
      date: Ní ọ̀pọ̀ ìgbà, a máa ń sọ pé ó wá láti apá ìparí ọ̀rúndún kejì tàbí ìbẹ̀rẹ̀ ọ̀rúndún kẹta Sànmánì Tiwa, ó sì ṣeé ṣe kó ti wá láti àyíká àwọn Kristẹni Síríà; ó wà nínú ìwé afọ́wọ́kọ Kọ́ọ̀pù ti ọ̀rúndún kẹrin.
    Tripartite Tractate:
      display_name: Àpilẹ̀kọ Alápá Mẹ́ta
      author: A kò mọ ẹni tó kọ ọ́. Òǹkọ̀wé náà jẹ́ ẹlẹ́kọ̀ọ́ ìmọ̀ nípa Ọlọ́run tó kàwé gan-an láàárín àwọn Kristẹni Valentinia; kò ṣeé ṣe láti dá a mọ̀ dájú gẹ́gẹ́ bí olùkọ́ kan tí a mọ orúkọ rẹ̀.
      audience: Àwùjọ àwọn Kristẹni Valentinia tó ń gba ẹ̀kọ́ jíjinlẹ̀ nípa Ọlọ́run, àwọn ẹ̀dá ayérayé, ìṣẹ̀dá, Kristi, ìjọ, ìgbàlà àti ìmúpadàbọ̀sípò ìkẹyìn.
      date: Ní ọ̀pọ̀ ìgbà, a máa ń sọ pé ó wá láti ọ̀rúndún kẹta Sànmánì Tiwa, bí ó tilẹ̀ jẹ́ pé àwọn kan sọ pé ó ṣeé ṣe kó wá láti apá ìkẹyìn ọ̀rúndún náà; ó wà ní èdè Kọ́ọ̀pù nínú Kódẹ́ẹ̀sì Jung ti ọ̀rúndún kẹrin.
    Apocryphon of John:
      display_name: Ìwé Àṣírí Jòhánù
      author: A kò mọ ẹni tó kọ ọ́. Iṣẹ́ náà lo orúkọ Jòhánù ọmọ Sebedé láìjẹ́ pé òun ló kọ ọ́, ó sì gbé e kalẹ̀ bí ìfihàn tí Jésù tó jíǹde fi fún un; ó wà ní ju àtúnyẹ̀wò ìgbàanì kan lọ.
      audience: Àwọn Kristẹni nínú àṣà ìfihàn ti Seti tàbí àṣà kan tó jọ ọ́ pẹ́kípẹ́kí, tí wọ́n ń wá àlàyé nípa ilẹ̀ Ọlọ́run, ìṣẹ̀dá, irú ẹni tí ènìyàn jẹ́, àti ìdáǹdè kúrò lọ́wọ́ àwọn alákòóso ọ̀tá.
      date: Ó ṣeé ṣe kí ẹ̀dà àkọ́kọ́ kan ti ń tàn ká ní ọ̀rúndún kejì Sànmánì Tiwa; àwọn ẹ̀rí Kọ́ọ̀pù tó ṣì wà, tí wọ́n pa àtúnyẹ̀wò kúkúrú àti gígùn mọ́, wá láti ọ̀rúndún kẹrin àti karùn-ún.
