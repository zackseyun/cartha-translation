review:
  verdict: revise
  review_summary: Àtúnyẹ̀wò parí. A ti ṣàtúnṣe àwọn akọlé tí ìtumọ̀ wọn yà kúrò nínú ìsọ̀rí Gẹ̀ẹ́sì, ní pàtàkì 2 Baruch 29, 44, àti 60, a sì ti mú ìtumọ̀ díẹ̀ mìíràn péye.
  issues:
  - 2 Baruch 29 túmọ̀ “abundance” ní aṣìṣe gẹ́gẹ́ bí “ọ̀rẹ̀”; a ṣàtúnṣe sí ọ̀pọ̀ yanturu.
  - 2 Baruch 44 kò sọ pé Ọmọ náà jẹ́ ti Baruku; a ṣàfikún aṣojú-ìní náà.
  - 2 Baruch 60 rọ́pò “stains” pẹ̀lú ìtumọ̀ tó péye jù lọ.
  - Àwọn ìṣàtúnṣe kékeré tún mú 2 Baruch 10, 15, àti 55 bá ìtumọ̀ orísun mu dáadáa.
