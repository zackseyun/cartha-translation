    Ezra:
      display_name: Ẹ́sírà
      author: A kò mọ ẹni tó kọ ọ́; ó ṣeé ṣe kó jẹ́ ọwọ́ ẹni kan náà tó kọ ìwé Kíróníkà.
      audience: Àwọn tó padà láti ìgbèkùn, tí wọ́n ń tún Jerúsálẹ́mù kọ́ lábẹ́ ìṣàkóso Páṣíà.
      date: Ní nǹkan bí àárín ọ̀rúndún karùn-ún sí ọ̀rúndún kẹrin ṣáájú Sànmánì Kristẹni.
    Nehemiah:
      display_name: Nehemáyà
      author: A kò mọ ẹni tó kọ ọ́; ó ní àkọsílẹ̀ ìrántí kan nínú tí a kọ ní ohùn ẹni àkọ́kọ́, tí a sì sọ pé ti Nehemáyà ni.
      audience: Àwọn tó padà láti ìgbèkùn, tí wọ́n ń tún odi Jerúsálẹ́mù kọ́, tí wọ́n sì ń sọ májẹ̀mú náà dọ̀tun lábẹ́ ìṣàkóso Páṣíà.
      date: Ní nǹkan bí àárín ọ̀rúndún karùn-ún sí ọ̀rúndún kẹrin ṣáájú Sànmánì Kristẹni.
    Esther:
      display_name: Ẹ́sítérì
      author: A kò mọ ẹni tó kọ ọ́.
      audience: Àwọn Júù tó ń gbé káàkiri ní ìlú àjèjì lábẹ́ ìṣàkóso àwọn orílẹ̀-èdè mìíràn, pàápàá jù lọ ní Páṣíà.
      date: Ní nǹkan bí ìparí àkókò Páṣíà tàbí ìbẹ̀rẹ̀ àkókò Gíríìkì (ọ̀rúndún kẹrin sí ìkẹta ṣáájú Sànmánì Kristẹni).
    Job:
      display_name: Jóòbù
      author: A kò mọ ẹni tó kọ ọ́.
      audience: Àwọn ọmọ Ísírẹ́lì tó ń làkàkà láti lóye ìjìyà aláìṣẹ̀ àti ìdájọ́ òdodo Ọlọ́run.
      date: Èrò tí ó wọ́pọ̀ láàárín àwọn olùṣèwádìí àṣà ìwé ọgbọ́n fi ìwé náà sí nǹkan bí ọ̀rúndún kẹfà sí ìkẹrin ṣáájú Sànmánì Kristẹni, ó sì fa ohun èlò láti inú ìtàn àtẹnudẹ́nu tó ti pẹ́ jù bẹ́ẹ̀ lọ.
    Psalms:
      display_name: Sáàmù
      author: Ọ̀pọ̀ òǹkọ̀wé ló kọ ọ́ láàárín ọ̀pọ̀ ọ̀rúndún; àwọn àkọlé tó wà lókè sáàmù dárúkọ Dáfídì, Ásáfù, Kórà, Sólómọ́nì, Mósè àti àwọn mìíràn.
      audience: Ísírẹ́lì àti ìjọ tó ń jọ́sìn ní tẹ́ńpìlì—àti gbogbo àwùjọ tó wá lẹ́yìn náà tí wọ́n ń gbàdúrà, tí wọ́n sì ń ṣọ̀fọ̀.
      date: A kọ àwọn sáàmù náà ní nǹkan bí ọ̀rúndún kẹwàá sí ìkẹta ṣáájú Sànmánì Kristẹni; a ṣàkójọ wọn sí ìrísí ìkẹyìn lẹ́yìn ìgbèkùn.
