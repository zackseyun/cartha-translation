payload:
  book_metadata:
    Genesis:
      display_name: Jẹ́nẹ́sísì
      author: A kò mọ ẹni tó kọ ọ́; àṣà ìgbàanì sọ pé Mósè ni ó kọ ọ́. Àwọn ìwádìí òde òní rí i gẹ́gẹ́ bí ìwé tí a ṣàkójọ rẹ̀ fún àkókò pípẹ́ láti inú orísun ọ̀tọ̀ọ̀tọ̀, tí a sì ṣàtúnṣe wọn pọ̀ lẹ́yìn náà.
      audience: Fún Ísírẹ́lì nínú ìdánimọ̀ májẹ̀mú wọn, nípa fífi ìtàn ìpilẹ̀ṣẹ̀ àwọn ènìyàn náà múlẹ̀ nínú ìṣẹ̀dá, yíyàn, àti ìlérí Ọlọ́run.
      date: A ṣàkójọ rẹ̀ kọjá ọ̀pọ̀ ọ̀rúndún; ó dé ìrísí tí a gbà mọ́ ní nǹkan bí ọ̀rúndún kẹfà sí karùn-ún ṣáájú Sànmánì Kristẹni, ní àkókò tàbí lẹ́yìn ìgbèkùn Bábílónì.
      summary: Jẹ́nẹ́sísì sọ nípa ìṣẹ̀dá, ìṣọ̀tẹ̀ àti ìtànkálẹ̀ aráyé, àti ìdílé Ábúráhámù, Ísáákì, Jékọ́bù, àti Jósẹ́fù, àwọn tí ìlérí májẹ̀mú Ọlọ́run fún Ísírẹ́lì ti bẹ̀rẹ̀ láti ọ̀dọ̀ wọn.
    Exodus:
      display_name: Ẹ́kísódùsì
      author: A kò mọ ẹni tó kọ ọ́; àṣà ìgbàanì sọ pé Mósè ni ó kọ ọ́. Àwọn ìwádìí òde òní rí i gẹ́gẹ́ bí ìwé tí a ṣàkójọ rẹ̀ fún àkókò pípẹ́ láti inú orísun ọ̀tọ̀ọ̀tọ̀, tí a sì ṣàtúnṣe wọn pọ̀ lẹ́yìn náà.
      audience: Fún Ísírẹ́lì gẹ́gẹ́ bí ènìyàn tí a dá sílẹ̀ tí wọ́n sì wà nínú májẹ̀mú, ní kíkọ́ ohun tí jíjẹ́ orílẹ̀-èdè OLÚWA lábẹ́ òfin rẹ̀ túmọ̀ sí.
      date: A ṣàkójọ rẹ̀ kọjá ọ̀pọ̀ ọ̀rúndún; ó dé ìrísí tí a gbà mọ́ ní nǹkan bí ọ̀rúndún kẹfà sí karùn-ún ṣáájú Sànmánì Kristẹni.
    Leviticus:
      display_name: Léfítíkù
      author: A kò mọ ẹni tó kọ ọ́; àṣà ìgbàanì sọ pé Mósè ni ó kọ ọ́. Àwọn ìwádìí òde òní fi í sínú orísun àwọn àlùfáà.
      audience: Fún àwọn àlùfáà Ísírẹ́lì àti àwùjọ tó ń jọ́sìn — àwọn ìtọ́ni nípa ẹbọ, ìwà mímọ́, àti ṣíṣètò ìgbésí ayé ní àyíká wíwàníhìn-ín Ọlọ́run.
      date: Ó ní àwọn ìpele àkójọ láti apá ìkẹyìn àkókò ìjọba títí dé àkókò lẹ́yìn ìgbèkùn (ní nǹkan bí ọ̀rúndún keje sí karùn-ún ṣáájú Sànmánì Kristẹni).
