review:
  verdict: revise
  review_summary: Àtúnyẹ̀wò ṣe àtúnṣe sí àwọn ọ̀rọ̀ akọlé díẹ̀ láti mú ìtumọ̀ wọn bá orísun Gẹ̀ẹ́sì mu dáadáa, pàápàá nípa ilé ẹ̀wọ̀n, ìjàǹbá ọkọ̀, àti jíjí Lásárù dìde.
  issues:
  - 'Acts 16: àkọlé ìfẹ̀yàjẹ̀ sọ pé ìjọsìn ṣí ẹ̀wọ̀n, níbi tí orísun ti sọ pé ó ṣí ilé ẹ̀wọ̀n.'
  - 'Acts 27: a tún un ṣe kí ó túmọ̀ sí pé Ọlọ́run pa Pọ́ọ̀lù mọ́ láàbò nípasẹ̀ ìjàǹbá ọkọ̀, kì í ṣe pé ó dá a sílẹ̀.'
  - 'John 11 àti John 15: a ṣàtúnṣe ìtumọ̀ tí kò péye nípa jíjí Lásárù dìde àti pípọ́n ẹ̀ka àjàrà.'
