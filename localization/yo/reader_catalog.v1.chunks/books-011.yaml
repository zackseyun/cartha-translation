  book_metadata:
    Luke:
      display_name: Lúùkù
      author: A kò mọ ẹni tó kọ ọ́; àṣà ìgbàanì sọ pé Lúùkù, alábàá-rìn Pọ́ọ̀lù, ni.
      audience: Àwọn Kristẹni tó mọ̀ọ́kọ-mọ̀ọ́kà láwùjọ Gíríìkì àti Róòmù; a kọ ọ́ sí ẹni tí a pè ní “Teófílù.”
      date: Ní nǹkan bí ọdún 80 sí 90 Lẹ́yìn Kristi.
    John:
      display_name: Jòhánù
      author: A kò mọ ẹni tó kọ ọ́; àṣà ìgbàanì sọ pé àpọ́sítélì Jòhánù tàbí “Ọmọ-ẹ̀yìn Olùfẹ́” ni.
      audience: Àwùjọ Kristẹni kan tí àárín wọn àti ẹ̀sìn Júù inú sínágọ́gù kò gún régé, tí ẹ̀rí Ọmọ-ẹ̀yìn Olùfẹ́ sì kó ipa pàtàkì nínú dídá sílẹ̀.
      date: Ní nǹkan bí ọdún 90 sí 110 Lẹ́yìn Kristi.
      summary: Jòhánù fi Jésù hàn gẹ́gẹ́ bí Ọ̀rọ̀ ayérayé tó ń fi Baba hàn, tó ń fún àwọn tó gbẹ́kẹ̀ lé e ní ìyè, tí a sì ṣe lógo nípasẹ̀ àwọn iṣẹ́ àmì rẹ̀, ikú rẹ̀ àti àjíǹde rẹ̀.
    Acts:
      display_name: Ìṣe Àwọn Àpọ́sítélì
      author: A kò mọ ẹni tó kọ ọ́; òǹkọ̀wé kan náà ló kọ Lúùkù.
      audience: Àwọn Kristẹni tó mọ̀ọ́kọ-mọ̀ọ́kà láwùjọ Gíríìkì àti Róòmù; ìwé kejì nínú iṣẹ́ tí a kọ sí Teófílù.
      date: Ní nǹkan bí ọdún 80 sí 90 Lẹ́yìn Kristi.
    Romans:
      display_name: Róòmù
      author: Pọ́ọ̀lù, pẹ̀lú Tẹ́tíù akọ̀wé rẹ̀.
      audience: Àwọn Kristẹni ní Róòmù—àwọn onígbàgbọ́ Júù àti aláìṣèJúù tí èdè-àìyedè wà láàárín wọn lórí Òfin Mósè àti ìdánimọ̀ wọn.
      date: Ní nǹkan bí ọdún 56 sí 58 Lẹ́yìn Kristi; a kọ ọ́ láti Kọ́ríńtì.
