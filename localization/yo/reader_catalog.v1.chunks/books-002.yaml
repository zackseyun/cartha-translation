review:
  verdict: revise
  review_summary: Àtúnyẹ̀wò ti parí. A ṣàtúnṣe àwọn ìtumọ̀ tó yí ìtumọ̀ àwọn ọ̀rọ̀ pàtàkì padà, pàápàá ọrọ̀ ìjẹ́wọ́/ìlérí, ẹbọ, gbèsè, àti orin, nígbà tí a sì pa gbogbo àwọn kọ́kọ́rọ́ àti ìdánimọ̀ chunk mọ́.
  issues:
  - Leviticus 27 àti Numbers 6 àti 30 lo “Ẹ̀jẹ́” (blood) níbi tí orísun ti túmọ̀ sí vows; a yí i padà sí “ìlérí.”
  - Numbers 15, 19, 29, àti 34 ní àwọn ọ̀rọ̀ tí kò pé tàbí tí ìtumọ̀ wọn yà; a ṣàtúnṣe wọn.
  - Deuteronomy 15, 27, 31, àti 32 ní ìtumọ̀ tí kò tẹ̀lé ìṣe tàbí ọ̀rọ̀ orísun dáadáa; a ṣàtúnṣe wọn.
  - A tún ṣàtúnṣe díẹ̀ nínú àwọn akọlé láti yà “clean” sí “holy,” “offerings” sí “gifts,” àti láti jẹ́ kí àwọn ìlérí ìtàn hàn ní ìwọ̀n orísun.
