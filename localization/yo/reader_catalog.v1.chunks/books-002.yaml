    Numbers:
      display_name: Nọ́ńbà
      author: A kò mọ ẹni tó kọ ọ́; àṣà ìgbàanì ka Mósè sí ẹni tó kọ ọ́.
      audience: Àwọn ọmọ Ísírẹ́lì nígbà tí wọ́n ń rìn láti Íjíbítì lọ sí ilẹ̀ ìlérí—ìran tó wà ní aginjù, àti àwọn òǹkàwé tó wá lẹ́yìn tí wọ́n ń kẹ́kọ̀ọ́ láti inú ìkùnà wọn.
      date: Àwọn apá rẹ̀ ni a kọ ní onírúurú sáà, láti apá ìkẹyìn ìjọba àwọn ọba títí dé sáà lẹ́yìn ìgbèkùn (ní nǹkan bí ọ̀rúndún 7 sí 5 ṣáájú Sànmánì Tiwa).
    Deuteronomy:
      display_name: Diutarónómì
      author: A kò mọ ẹni tó kọ ọ́; a gbé e kalẹ̀ gẹ́gẹ́ bí àwọn ọ̀rọ̀ ìdágbére Mósè. Àwọn ìwádìí òde òní sọ pé apá pàtàkì rẹ̀ ní ìpìlẹ̀ nínú àtúnṣe ìsìn ní ìparí ọ̀rúndún 7 ṣáájú Sànmánì Tiwa, lábẹ́ Josáyà.
      audience: Àwọn ọmọ Ísírẹ́lì tí wọ́n ń múra láti wọ ilẹ̀ náà—àti, nígbà tó yá, àwọn tó wà ní ìgbèkùn tí wọ́n ń béèrè bí wọ́n ṣe lè máa gbé ní ìṣòtítọ́ láìsí tẹ́ńpìlì tàbí ọba.
      date: Apá pàtàkì rẹ̀ bẹ̀rẹ̀ ní nǹkan bí ìparí ọ̀rúndún 7 ṣáájú Sànmánì Tiwa; ó dé ìrísí ìkẹyìn ní sáà ìgbèkùn.
    Joshua:
      display_name: Jóṣúà
      author: A kò mọ ẹni tó kọ ọ́; ó jẹ́ apá kan nínú Ìtàn Deuteronomistiki.
      audience: Àwọn ọmọ Ísírẹ́lì ní sáà ìjọba àwọn ọba àti ní ìgbèkùn, tí wọ́n ń ronú lórí ìṣẹ́gun ilẹ̀, májẹ̀mú, àti ìtumọ̀ ilẹ̀ náà.
      date: A ṣàkójọ rẹ̀ ní nǹkan bí ọ̀rúndún 7 sí 6 ṣáájú Sànmánì Tiwa láti inú àwọn àṣà ìtàn tó ti pẹ́.
