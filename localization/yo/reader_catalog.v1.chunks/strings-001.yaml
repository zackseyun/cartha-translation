review:
  verdict: revise
  review_summary: Àtúnṣe ni a ṣe sí àwọn gbolohun tí ìtumọ̀ wọn yà kúrò nínú orísun, pàápàá jù lọ ìtọ́kasí ìrìnàjò nínú ohun-kíkà, ìpele ìtàn Bíbélì, ìtúmọ̀ “no preview,” àti ìtumọ̀ gbolohun ìṣàfihàn nípa àwọn ìwé àfọwọ́kọ.
  issues:
  - readerNavigation was translated as search rather than reader navigation.
  - otTitle used “Láéláé” (eternal) rather than the established “Laelae” (old) designation.
  - noPreview referred to a thumbnail/image rather than an unavailable preview.
  - introQuote overstated manuscript status as “original” and described AI scanning inaccurately.
