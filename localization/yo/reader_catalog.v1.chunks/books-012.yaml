  book_metadata:
    1 Corinthians:
      display_name: 1 Kọ́ríńtì
      author: Pọ́ọ̀lù, pẹ̀lú Sósíténè.
      audience: Ìjọ Kristẹni tó ní ìyapa ní Kọ́ríńtì.
      date: Ní nǹkan bí ọdún 53–55 Lẹ́yìn Kristi, tí a kọ láti Éfésù.
    2 Corinthians:
      display_name: 2 Kọ́ríńtì
      author: Pọ́ọ̀lù, pẹ̀lú Tímótì.
      audience: Ìjọ Kọ́ríńtì, lẹ́yìn ìforígbárí kan tó mú ìrora wá.
      date: Ní nǹkan bí ọdún 55–56 Lẹ́yìn Kristi.
    Galatians:
      display_name: Gálátíà
      author: Pọ́ọ̀lù.
      audience: Àwọn ìjọ Kristẹni ní Gálátíà (àárín gbùngbùn Anatólià) tí a ń fi ipá mú láti gba ìkọlà àti pípa òfin Tórà mọ́.
      date: Ní nǹkan bí ọdún 48–55 Lẹ́yìn Kristi (ọ̀rọ̀ náà ṣì ń fa àríyànjiyàn).
    Ephesians:
      display_name: Éfésù
      author: Pọ́ọ̀lù, tàbí ọmọ-ẹ̀yìn rẹ̀ tímọ́tímọ́ kan tó kọ ọ́ ní orúkọ Pọ́ọ̀lù (ọ̀rọ̀ náà ṣì ń fa àríyànjiyàn).
      audience: Àwọn Kristẹni ní Éṣíà lápapọ̀; orúkọ ibìkan náà, “Éfésù,” kò sí nínú àwọn àfọwọ́kọ tó pẹ́ jù lọ.
      date: Ní nǹkan bí àwọn ọdún 60 Lẹ́yìn Kristi bí Pọ́ọ̀lù bá kọ ọ́; ní nǹkan bí àwọn ọdún 80–90 Lẹ́yìn Kristi bí ẹlòmíràn bá kọ ọ́ ní orúkọ rẹ̀.
    Philippians:
      display_name: Fílípì
      author: Pọ́ọ̀lù, pẹ̀lú Tímótì.
      audience: Ìjọ Kristẹni ní Fílípì, ìlú abẹ́ àkóso Róòmù ní Makedóníà.
      date: Ní nǹkan bí ọdún 60–62 Lẹ́yìn Kristi, tí a kọ láti inú ẹ̀wọ̀n.
    Colossians:
      display_name: Kólósè
      author: Pọ́ọ̀lù, pẹ̀lú Tímótì—tàbí ọmọ-ẹ̀yìn rẹ̀ tímọ́tímọ́ kan tó kọ ọ́ ní orúkọ Pọ́ọ̀lù (ọ̀rọ̀ náà ṣì ń fa àríyànjiyàn).
      audience: Àwọn Kristẹni ní Kólósè, ní àfonífojì Líkù, tí wọ́n dojú kọ ẹ̀kọ́ kan tó da onírúurú ẹ̀sìn pọ̀.
      date: Ní nǹkan bí ọdún 60–62 Lẹ́yìn Kristi bí Pọ́ọ̀lù bá kọ ọ́; lẹ́yìn ìgbà yẹn bí ẹlòmíràn bá kọ ọ́ ní orúkọ rẹ̀.
    1 Thessalonians:
      display_name: 1 Tẹsalóníkà
      author: Pọ́ọ̀lù, pẹ̀lú Sílífánù àti Tímótì.
      audience: Ìjọ Kristẹni tuntun ní Tẹsalóníkà, tí wọ́n ń dojú kọ inúnibíni.
      date: Ní nǹkan bí ọdún 50–51 Lẹ́yìn Kristi—ó ṣeé ṣe kó jẹ́ lẹ́tà Pọ́ọ̀lù tó pẹ́ jù lọ lára àwọn tó ṣì wà.
    2 Thessalonians:
      display_name: 2 Tẹsalóníkà
      author: Pọ́ọ̀lù (ọ̀rọ̀ náà ṣì ń fa àríyànjiyàn; àwọn ọ̀mọ̀wé kan gbà pé ẹlòmíràn ló kọ ọ́ ní orúkọ rẹ̀).
      audience: Ìjọ Tẹsalóníkà, láti yanjú ìdàrúdàpọ̀ nípa àwọn ohun ìkẹyìn.
      date: Ní nǹkan bí ọdún 51 Lẹ́yìn Kristi bí Pọ́ọ̀lù bá kọ ọ́.
    1 Timothy:
      display_name: 1 Tímótì
      author: Pọ́ọ̀lù, tàbí ọmọ-ẹ̀yìn kan tó kọ ọ́ ní orúkọ Pọ́ọ̀lù (ọ̀pọ̀ àwọn ọ̀mọ̀wé gbà pé àwọn Lẹ́tà Olùṣọ́-Àgùntàn ni ẹlòmíràn kọ ní orúkọ rẹ̀).
      audience: Tímótì gẹ́gẹ́ bí aṣojú Pọ́ọ̀lù ní Éfésù; ìwé ìtọ́sọ́nà fún ètò ìjọ ní àkókò tó tẹ̀ lé e.
      date: Ní nǹkan bí àárín àwọn ọdún 60 Lẹ́yìn Kristi bí Pọ́ọ̀lù bá kọ ọ́; ní nǹkan bí ọdún 90–110 Lẹ́yìn Kristi bí ẹlòmíràn bá kọ ọ́ ní orúkọ rẹ̀.
    2 Timothy:
      display_name: 2 Tímótì
      author: Pọ́ọ̀lù, tàbí ọmọ-ẹ̀yìn kan tó kọ ọ́ ní orúkọ Pọ́ọ̀lù.
      audience: Tímótì—a gbé e kalẹ̀ gẹ́gẹ́ bí ọ̀rọ̀ ìdágbére Pọ́ọ̀lù láti inú ẹ̀wọ̀n.
      date: Ní nǹkan bí àárín àwọn ọdún 60 Lẹ́yìn Kristi bí Pọ́ọ̀lù bá kọ ọ́; ní nǹkan bí ọdún 90–110 Lẹ́yìn Kristi bí ẹlòmíràn bá kọ ọ́ ní orúkọ rẹ̀.
    Titus:
      display_name: Títù
      author: Pọ́ọ̀lù, tàbí ọmọ-ẹ̀yìn kan tó kọ ọ́ ní orúkọ Pọ́ọ̀lù.
      audience: Títù gẹ́gẹ́ bí aṣojú Pọ́ọ̀lù ní Kírétè.
      date: Ní nǹkan bí àárín àwọn ọdún 60 Lẹ́yìn Kristi bí Pọ́ọ̀lù bá kọ ọ́; ní nǹkan bí ọdún 90–110 Lẹ́yìn Kristi bí ẹlòmíràn bá kọ ọ́ ní orúkọ rẹ̀.
    Philemon:
      display_name: Fílémónì
      author: Pọ́ọ̀lù, pẹ̀lú Tímótì.
      audience: Fílémónì, Kristẹni kan tó ní ẹrú, nípa Ónésímù, ẹrú rẹ̀ tó sá lọ.
