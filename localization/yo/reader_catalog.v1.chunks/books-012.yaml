    Hebrews:
      display_name: Hébérù
      author: A kò mọ ẹni tó kọ ọ́. Àṣà ti dárúkọ Pọ́ọ̀lù, Àpólò, Bánábà, Pírísílà àti àwọn mìíràn; kò sí èrò kankan tí gbogbo ènìyàn fohùn ṣọ̀kan lé lórí.
      audience: Àwọn Kristẹni Júù tó ń sọ èdè Gíríìkì, tí ìdẹwò ń fà láti fà sẹ́yìn kúrò nínú ìjẹ́wọ́ Kristẹni wọn.
      date: Ní nǹkan bí ọdún 60–95 Lẹ́yìn Kristi.
