review:
  verdict: revise
  review_summary: Àtúnṣe ni a ṣe sí àwọn àṣìṣe ìtumọ̀ díẹ̀, pẹ̀lú àlàyé òǹkọ̀wé Gospel of Thomas àti àwọn àkọ́lé tí ìtumọ̀ wọn yà kúrò nínú Gẹ̀ẹ́sì. Gbogbo àwọn pápá àti kọ́kọ́rọ́ wà ní kíkún.
  issues:
  - '2 Esdras 3, 6, àti 8: a tún ‘prays’ ṣe sí ‘gbàdúrà’ dípò ‘gba àdúrà.’'
  - 'Gospel of Thomas metadata: incipit náà ń fi àkójọpọ̀ ọ̀rọ̀ sọ́wọ́ Didymos Judas Thomas; kò yẹ kí ó sọ pé òun ni ó kọ ọ́.'
  - 'Gospel of Thomas 2, 8, 27, àti 40: a ṣàtúnṣe ìtumọ̀ tí kò fara mọ́ ìtumọ̀ Gẹ̀ẹ́sì.'
  - '2 Baruch 74: a ṣàtúnṣe ‘Builders’ sí ‘amọ̀lé,’ kì í ṣe ‘àkọ́lé.’'
