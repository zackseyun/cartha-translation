payload:
  book_metadata:
    2 Esdras:
      display_name: Ẹ́sírà Kejì
      author: Òǹkọ̀wé aláìlórúkọ, pẹ̀lú ìfẹ̀sẹ̀mulẹ̀ tí àwọn Kristẹni ṣàtúnṣe sí, tí ó yí apá pàtàkì kan tí ó jẹ́ ti Júù ní ìpilẹ̀ṣẹ̀ ká (Ẹ́sírà Kẹrin, orí 3–14).
      audience: Àwọn Júù lẹ́yìn ọdún 70 S.K. tí wọ́n ń bá ìbéèrè nípa ìdí tí Ọlọ́run fi ń gba ìwà ibi láyè jìjàkadì; lẹ́yìn náà, a mú un gbòòrò sí i fún àwọn òǹkàwé Kristẹni.
      date: Apá pàtàkì ti Júù, ní nǹkan bí ọdún 100 S.K.; àwọn àfikún Kristẹni, ní nǹkan bí ọ̀rúndún kejì sí ìkẹta S.K.
    Didache:
      display_name: Dídáké
      author: Òǹkọ̀wé aláìlórúkọ (orúkọ náà túmọ̀ sí “Ẹ̀kọ́ Àwọn Àpọ́sítélì Méjìlá”).
      audience: Àwọn ìjọ Kristẹni ìjímìjí—ìwé ìtọ́sọ́nà ṣókí nípa ìwà rere, ìbatisí, Eucharist, àti àwọn olùkọ́ arìnrìn-àjò.
      date: Ní nǹkan bí òpin ọ̀rúndún kìíní sí ìbẹ̀rẹ̀ ọ̀rúndún kejì S.K.
    Gospel of Thomas:
      display_name: Ìhìn Rere Tọ́màsì
      author: Òǹkọ̀wé aláìlórúkọ; àwọn ọ̀rọ̀ ìbẹ̀rẹ̀ fi àkójọpọ̀ àwọn ọ̀rọ̀ náà sọ́wọ́ “Dídímọ́sì Júdásì Tọ́màsì.” Ìtumọ̀ èdè Kọ́pítì ti ọ̀rúndún kẹrin láti Nag Hammadi (NHC II,2) nìkan ni ó ṣì wà ní ẹ̀kúnrẹ́rẹ́, pẹ̀lú àjákù mẹ́ta ní èdè Gíríìkì láti Oxyrhynchus.
      audience: Àwọn òǹkàwé Kristẹni tí ọgbọ́n ilẹ̀ Síríà àti àwọn èrò Gínọ́sítì ìbẹ̀rẹ̀pẹ̀pẹ̀ ní ipa lórí wọn, tí wọ́n sì dojú kọ ìmọ̀ ara ẹni àṣírí nínú àwọn ọ̀rọ̀ Jésù.
      date: Ó ṣeé ṣe kí ìwé Gíríìkì àkọ́kọ́ wá láti nǹkan bí ọdún 50–140 S.K.; ìwé àfọwọ́kọ Kọ́pítì, ní nǹkan bí ọdún 340 S.K.
      summary: Ìhìn Rere Tọ́màsì jẹ́ àkójọpọ̀ àwọn ọ̀rọ̀ tí a sọ pé Jésù ni ó sọ wọ́n. Kò ní ìtàn kan tí ó ń lọ ní ṣísẹ̀-n-tẹ̀lé, ó sì ń pe àwọn òǹkàwé léraléra láti ṣàwárí ìtumọ̀ àwọn ọ̀rọ̀ náà.
