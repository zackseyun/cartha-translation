  verdict: revise
  review_summary: Àtúnṣe ni a ṣe sí àwọn ìtumọ̀ tí wọ́n yí ìtumọ̀ orísun padà, tí wọ́n fi ìtàn tí kò sí kun un, tàbí tí gbolohun wọn kò pé. Gbogbo àwọn iye tó wà nínú chunk wà níbẹ̀.
  issues:
  - Psalm 116 kò sọ Dáfídì di olórin; a yọ àfikún náà kúrò.
  - Psalm 125 ní ìtumọ̀ tí kò tọ́ fún “steadfast”; a tún un ṣe.
  - Ecclesiastes 5 gbọdọ̀ sọ nípa mímú ìlérí ṣẹ, kì í ṣe májẹ̀mú.
  - A tún àwọn àkọlé díẹ̀ ṣe fún ìfaramọ́ pẹ̀lú orísun, pẹ̀lú Psalms 106, 149; Proverbs 31; Ecclesiastes 4; àti Song of Solomon 2.
