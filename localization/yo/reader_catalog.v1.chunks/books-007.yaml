    Proverbs:
      display_name: Òwe
      author: Àkójọpọ̀ iṣẹ́ ni; àwọn àkọlé rẹ̀ dárúkọ Sólómọ́nì, Ágúrì, Lémúẹ́lì àti “àwọn ọlọ́gbọ́n.”
      audience: Àwọn ọ̀dọ́ ọmọ Ísírẹ́lì tí a ń tọ́ dàgbà nínú ọgbọ́n fún ìgbésí ayé ojoojúmọ́.
      date: Àwọn ipele ìkọ̀wé rẹ̀ jẹ́ ní nǹkan bí ọ̀rúndún kẹwàá sí ìkẹrin ṣáájú Sànmánì Kristẹni.
    Ecclesiastes:
      display_name: Oníwàásù
      author: A kò mọ ẹni tó kọ ọ́; “Kóhẹ́lẹ́tì” ni olùsọ̀rọ̀ náà, ẹni tí àṣà ti sọ pé Sólómọ́nì ni.
      audience: Àwọn ọmọ Ísírẹ́lì tí wọ́n ń kojú ààlà ọgbọ́n, ọrọ̀ àti làálàá lábẹ́ oòrùn.
      date: Ó ṣeé ṣe kó jẹ́ ní nǹkan bí ọ̀rúndún karùn-ún sí ìkẹta ṣáájú Sànmánì Kristẹni, gẹ́gẹ́ bí èdè Hébérù rẹ̀ tí èdè Árámáíkì ní ipa lórí ti fi hàn.
    Song of Solomon:
      display_name: Orin Sólómọ́nì
      author: A kò mọ ẹni tó kọ ọ́; àkọlé rẹ̀ tọ́ka sí Sólómọ́nì.
      audience: Àwọn ọmọ Ísírẹ́lì tí wọ́n ka ìfẹ́ onífẹ̀ẹ́ gẹ́gẹ́ bí ojú tí a fi ń wo ìbátan tímọ́tímọ́ inú májẹ̀mú—àti lẹ́yìn náà, àwọn Júù àti Kristẹni tí wọ́n kà á lọ́nà àpẹẹrẹ.
      date: Ó ṣeé ṣe kó jẹ́ lẹ́yìn ìgbèkùn, ní nǹkan bí ọ̀rúndún karùn-ún sí ìkẹta ṣáájú Sànmánì Kristẹni.
