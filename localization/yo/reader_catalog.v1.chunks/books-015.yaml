    1 Esdras:
      display_name: Esdrasi Kìíní
      author: A kò mọ ẹni tí ó kọ ọ́; àtúnṣàkójọ ní èdè Gíríìkì ni, tí ó tún ìtòlẹ́sẹẹsẹ 2 Kronika 35–36, Esra, àti Nehemiah 7–8 ṣe.
      audience: Àwọn Júù ìgbà Hélénístíkì tí wọ́n fẹ́ ìtàn tí ó ṣe kedere nípa ìpadàbọ̀ àti ìmúpadàbọ̀sípò.
      date: Ní nǹkan bí ọ̀rúndún kejì sí ọ̀rúndún kìíní ṣáájú Sànmánì Tiwa.
    Prayer of Manasseh:
      display_name: Àdúrà Manase
      author: A kò mọ ẹni tí ó kọ ọ́; a fi orúkọ Ọba Manase lé e lọ́nà tí kì í ṣe tirẹ̀.
      audience: Àwọn tó ń ronúpìwàdà tí wọ́n fi ara wọn wé ìrònúpìwàdà Manase — a sì ń lò ó nínú ìjọsìn ní àwọn àṣà ìgbàgbọ́ kan.
      date: Ní nǹkan bí ọ̀rúndún kejì sí ọ̀rúndún kìíní ṣáájú Sànmánì Tiwa.
    Psalm 151:
      display_name: Sáàmù 151
      author: A kò mọ ẹni tí ó kọ ọ́; a fi orúkọ Dafidi lé e lọ́nà tí kì í ṣe tirẹ̀. Ẹ̀dà Hébérù kan wà tí 11QPsa jẹ́rìí sí.
      audience: Àwọn Júù tó ń gbé ní ìtànkálẹ̀ àti àwọn àwùjọ Qumran tí wọ́n fi ara wọn fún ìwé Sáàmù Dafidi.
      date: Ní nǹkan bí ọ̀rúndún kejì ṣáájú Sànmánì Tiwa tàbí ṣáájú èyí.
    3 Maccabees:
      display_name: Mákábí Kẹta
      author: A kò mọ ẹni tí ó kọ ọ́; èdè Gíríìkì ni a fi kọ ọ́.
      audience: Àwọn Júù tó ń sọ èdè Gíríìkì tí wọ́n ń gbé ní ìtànkálẹ̀ ní Íjíbítì — ìtàn ìgbàlà kan tí ó ṣẹlẹ̀ lábẹ́ Ptolemy Kẹrin.
      date: Ní nǹkan bí ọ̀rúndún kìíní ṣáájú Sànmánì Tiwa sí ọ̀rúndún kìíní Sànmánì Tiwa.
    4 Maccabees:
