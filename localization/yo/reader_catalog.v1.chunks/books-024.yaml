payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Ìwà Ìpilẹ̀ Àwọn Alákòóso
      author: A kò mọ ẹni tó kọ ọ́. Òǹkọ̀wé náà túmọ̀ Gẹnẹ́sisi nípasẹ̀ ìtàn àròsọ ìṣípayá kan nípa àwọn alákòóso; a kò lè fi ìdánilójú sọ pé olùkọ́ kan tí a mọ orúkọ rẹ̀ ni ó kọ iṣẹ́ náà.
      audience: Àwọn Kristẹni nínú àwùjọ àwọn ọmọlẹ́yìn Sẹti tàbí àwùjọ tó jọ ọ́, tí wọ́n ka Gẹnẹ́sisi sí ìforígbárí láàárín àwọn alákòóso àgbáyé tí kò ní ìmọ̀, ọgbọ́n àtọ̀runwá, àti ìpilẹ̀ṣẹ̀ ẹ̀mí ènìyàn.
      date: Ní gbogbogbòò, a máa ń fi í sí ọ̀rúndún kẹta Sànmánì Tiwa; ó wà ní ìkọ̀wé èdè Kọ́ọ̀pítì ti ọ̀rúndún kẹrin nínú Kódẹ́ẹ̀sì Nag Hammadi Kejì.
    On the Origin of the World:
      display_name: Nípa Ìpilẹ̀ṣẹ̀ Ayé
      author: A kò mọ ẹni tó kọ ọ́. Iṣẹ́ náà parapọ̀ ó sì tún oríṣiríṣi àṣà àtọwọ́dọ́wọ́ àwọn Júù, Kristẹni, ti Plato, àti ti ìtàn àròsọ ṣe, láìdárúkọ ẹni tó kó wọn jọ.
      audience: Àwọn òǹkàwé ní àyíká Kristẹni tó ní ìtẹ̀sí sí ìmọ̀ ìkọ̀kọ̀, tí wọ́n ń wá ìtàn ìṣẹ̀dá láti ojú ìwòye mìíràn nípa àwọn alákòóso àgbáyé, Sofia, Adamu àti Efa, àti ohun tó máa ṣẹlẹ̀ sí ayé ní òpin.
      date: A sábà máa ń fi í sí ọ̀rúndún kẹta Sànmánì Tiwa, bó tilẹ̀ jẹ́ pé ó ṣeé ṣe kí àwọn ohun èlò tó ti pẹ́ ju bẹ́ẹ̀ lọ wà ní ìpìlẹ̀ rẹ̀; ní pàtàkì, ó wà nínú àwọn ẹ̀dà Kọ́ọ̀pítì ti ọ̀rúndún kẹrin.
    Sophia of Jesus Christ:
      display_name: Ọgbọ́n Jésù Kristi
      author: A kò mọ ẹni tó kọ ọ́. Òǹkọ̀wé náà mú ohun èlò tí a tún mọ̀ láti inú Eugnostos lò, ó sì sọ ọ́ di ìjíròrò láàárín Jésù àti àwọn ọmọ-ẹ̀yìn rẹ̀ lẹ́yìn àjíǹde.
      audience: Àwọn Kristẹni tó nífẹ̀ẹ́ sí ọgbọ́n tí a ṣí payá nípa Ọlọ́run tó ga rékọjá ohun gbogbo, ètò ayé ọ̀run, àti ìpilẹ̀ṣẹ̀ ọkàn àti ìgbàlà rẹ̀.
      date: A sábà máa ń fi í sí ìparí ọ̀rúndún kejì tàbí ọ̀rúndún kẹta Sànmánì Tiwa; ó wà nínú àwọn ẹ̀dà Kọ́ọ̀pítì láti Nag Hammadi àti Kódẹ́ẹ̀sì Berlin.
    Gospel of the Egyptians:
      display_name: Ìhìn Rere àwọn ará Íjíbítì
      author: A kò mọ ẹni tó kọ ọ́. Iṣẹ́ Nag Hammadi yìí, tí a tún ń pè ní Ìwé Mímọ́ ti Ẹ̀mí Ńlá Tí A Kò Rí, yàtọ̀ sí Ìhìn Rere àwọn ará Íjíbítì ti èdè Gíríìkì tó ti wà ṣáájú, èyí tí a mọ̀ kìkì nípasẹ̀ àwọn ọ̀rọ̀ tí a fa yọ látinú rẹ̀.
      audience: Àwùjọ Kristẹni àwọn ọmọlẹ́yìn Sẹti tí wọ́n ń lo ìtàn àròsọ tó jinlẹ̀, àwọn orúkọ mímọ́, àwòrán ìrìbọmi, àti ìyìn orin láti ṣàlàyé irú ẹni tí wọ́n jẹ́ nípa ẹ̀mí àti ìdáǹdè wọn.
      date: A sábà máa ń fi í sí ọ̀rúndún kejì tàbí kẹta Sànmánì Tiwa; ẹ̀dà Kọ́ọ̀pítì méjì ló ṣì wà nínú àwọn kódẹ́ẹ̀sì Nag Hammadi ti ọ̀rúndún kẹrin.
    Letter of Peter to Philip:
      display_name: Lẹ́tà Pétérù sí Fílípì
      author: A kò mọ ẹni tó kọ ọ́. Lẹ́tà kúkúrú tó bẹ̀rẹ̀ iṣẹ́ náà àti ìṣípayá tó tẹ̀ lé e ni a fi orúkọ Pétérù àti Fílípì kọ láìjẹ́ pé a lè fi ìdánilójú sọ pé ọ̀kan nínú àwọn àpọ́sítélì náà ló kọ ọ́.
      audience: Àwọn Kristẹni tó ń wá àṣẹ àwọn àpọ́sítélì fún ẹ̀kọ́ nípa Olùgbàlà, àwọn agbára ọ̀tá, ìjìyà, iṣẹ́ ìránṣẹ́, àti ìmúpadàbọ̀sípò àwọn ọmọ-ẹ̀yìn.
      date: Ní gbogbogbòò, a máa ń fi í sí ìparí ọ̀rúndún kejì tàbí ìbẹ̀rẹ̀ ọ̀rúndún kẹta Sànmánì Tiwa; ó wà nínú ẹ̀dà Nag Hammadi ti ọ̀rúndún kẹrin àti nínú ẹ̀dà Kọ́ọ̀pítì kan tó wá lẹ́yìn náà.
    Gospel of Judas:
      display_name: Ìhìn Rere Júdásì
      author: A kò mọ ẹni tó kọ ọ́. Àkọlé náà sọ pé Júdásì ni a fi ìtàn náà mọ́, ṣùgbọ́n iṣẹ́ náà kò fi ìdí rẹ̀ múlẹ̀ pé Júdásì Isikariotu ni òǹkọ̀wé rẹ̀ ní ti ìtàn.
      audience: Ẹgbẹ́ Kristẹni kan tó ń ṣàríwísí àwọn àṣà ìrúbọ àti ti ìṣàkóso ìjọ ti àwọn ẹgbẹ́ mìíràn, tí wọ́n ń lo ìjíròrò ìṣípayá àti àwòrán àgbáyé tó jọ ti àwọn ọmọlẹ́yìn Sẹti láti tún ìtumọ̀ Júdásì àti ikú Jésù ṣe.
      date: A sábà máa ń fi í sí àárín tàbí ìparí ọ̀rúndún kejì Sànmánì Tiwa; Irenaeus mọ Ìhìn Rere Júdásì ní nǹkan bí ọdún 180, ó sì ṣeé ṣe kí ẹ̀dà Kọ́ọ̀pítì tó ṣì wà jẹ́ ti ọ̀rúndún kẹta tàbí kẹrin.
    Protoevangelium of James:
      display_name: Ìhìn Rere Ìṣáájú ti Jákọ́bù
      author: A kò mọ ẹni tó kọ ọ́. Akọ̀tàn náà sọ pé òun ni Jákọ́bù, ṣùgbọ́n iṣẹ́ náà jẹ́ èyí tí a fi orúkọ ẹlòmíràn kọ, Jákọ́bù arákùnrin Jésù kò sì ni ó kọ ọ́.
      audience: Àwọn Kristẹni tó nífẹ̀ẹ́ sí ìbí àti ìtọ́jú Màríà, ìwà mímọ́ rẹ̀ tí ó bá a lọ títí, ìbí Jésù, àti àwọn ìdáhùn inú ìtàn sí àwọn ìbéèrè tí Mátíù àti Lúùkù kò dáhùn.
      date: Ní gbogbogbòò, a máa ń fi í sí ìdajì ìkẹyìn ọ̀rúndún kejì Sànmánì Tiwa; ó wà nínú ọ̀pọ̀lọpọ̀ àfọwọ́kọ Gíríìkì ti ìgbà tó tẹ̀ lé e àti àwọn ìtumọ̀ èdè àtijọ́.
