review:
  verdict: revise
  review_summary: Àtúnyẹ̀wò ti parí. A ṣàtúnṣe àwọn akọ́lé tí ìtumọ̀ wọn kò pé tàbí tí ọ̀rọ̀ Yorùbá wọn kò dára pátápátá, ní pàtàkì Mátíù 3 àti 17. Gbogbo àwọn ìwọ̀n míì jẹ́ ìtumọ̀ pipe, tí ó sì bá ìmọ̀lára orísun Gẹ̀ẹ́sì mu.
  issues:
  - 'Matthew 3: a revised rendering makes ‘anointed’ explicit and grammatical in Yoruba.'
  - 'Matthew 17: a revised rendering retains the source’s ‘declares Elijah’ rather than weakening it to merely speaking about Elijah.'
