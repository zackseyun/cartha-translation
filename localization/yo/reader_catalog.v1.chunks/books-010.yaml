payload:
  book_metadata:
    Joel:
      display_name: Jóẹli
      author: Jóẹli ọmọ Pétúélì.
      audience: Júdà lẹ́yìn ìgbèkùn, tí ó ń fèsì sí àjàkálẹ̀ eṣú gẹ́gẹ́ bí àmì Ọjọ́ OLÚWA.
      date: Ó ṣeé ṣe kí ó jẹ́ ní nǹkan bí ọ̀rúndún karùn-ún sí ìkẹrin ṣáájú Sànmánì Kristẹni.
    Amos:
      display_name: Ámósì
      author: Ámósì ará Tékóà, olùṣọ́-àgùntàn kan láti Júdà tí ó ń wàásù ní ìhà àríwá.
      audience: Ísírẹ́lì ìhà àríwá ní àkókò aásìkí àti àìṣèdájọ́ òdodo lábẹ́ Jerobóámù Kejì.
      date: Ní nǹkan bí ọdún 760–750 ṣáájú Sànmánì Kristẹni.
    Obadiah:
      display_name: Ọbadáyà
      author: Ọbadáyà.
      audience: Júdà lẹ́yìn tí Édómù da Jerúsálẹ́mù—àsọtẹ́lẹ̀ nípa ìṣubú Édómù.
      date: Láìpẹ́ lẹ́yìn ọdún 586 ṣáájú Sànmánì Kristẹni.
    Jonah:
      display_name: Jónà
      author: A kò mọ ẹni tí ó kọ ọ́; Jónà ọmọ Ámítáì ni ẹni pàtàkì nínú ìtàn náà.
      audience: Ísírẹ́lì lẹ́yìn ìgbèkùn—ìbáwí ẹlẹ́yà sí ìwà híhá mọ́ ẹ̀yà ẹni nìkan, àti ìmúdájú àánú Ọlọ́run sí àwọn àjèjì.
      date: Ó ṣeé ṣe kí ó jẹ́ ní nǹkan bí ọ̀rúndún karùn-ún sí ìkẹrin ṣáájú Sànmánì Kristẹni.
    Micah:
      display_name: Míkà
      author: Míkà ará Móréṣétì.
      audience: Júdà ní apá ìparí ọ̀rúndún kẹjọ ṣáájú Sànmánì Kristẹni, pàápàá àwọn tálákà ìgbèríko tí àwọn olówó àti alágbára ìlú ń pọ́n lójú.
      date: Ní nǹkan bí ọdún 740–700 ṣáájú Sànmánì Kristẹni.
    Nahum:
      display_name: Náhúmù
      author: Náhúmù ará Élíkóṣì.
      audience: Júdà tí ń yọ̀ nítorí ìṣubú Nínéfè tí ó ń bọ̀.
      date: Láìpẹ́ ṣáájú ọdún 612 ṣáájú Sànmánì Kristẹni.
    Habakkuk:
      display_name: Hábákúkù
      author: Hábákúkù.
      audience: Júdà bí ó ti ń dojú kọ bí Bábílónì ṣe ń gòkè—ìjíròrò wòlíì kan pẹ̀lú Ọlọ́run nípa ìdájọ́ òdodo.
      date: Ní nǹkan bí apá ìparí ọ̀rúndún keje ṣáájú Sànmánì Kristẹni.
    Zephaniah:
      display_name: Sefanáyà
      author: Sefanáyà ọmọ Kúṣì.
      audience: Júdà lábẹ́ Josáyà, ní kété ṣáájú àwọn àtúnṣe rẹ̀.
      date: Ní nǹkan bí ọdún 640–609 ṣáájú Sànmánì Kristẹni.
    Haggai:
      display_name: Hágáì
      author: Hágáì.
      audience: Àwọn tí ó padà láti ìgbèkùn tí wọ́n ń tún tẹ́ńpìlì kọ́ lábẹ́ Dáríúsì.
      date: Ọdún 520 ṣáájú Sànmánì Kristẹni.
    Zechariah:
      display_name: Sekaráyà
      author: Sekaráyà ọmọ Berekáyà; ó ṣeé ṣe kí ẹni mìíràn nígbà tó késẹ̀ kọ orí 9–14.
      audience: Àwọn tí ó padà láti ìgbèkùn tí wọ́n ń tún tẹ́ńpìlì kọ́, àti àwọn àwùjọ tí ó wà nígbà tó késẹ̀ lẹ́yìn ìgbèkùn.
      date: Orí 1–8 ní nǹkan bí ọdún 520–518 ṣáájú Sànmánì Kristẹni; ó ṣeé ṣe kí 9–14 jẹ́ ní nǹkan bí ọgọ́rùn-ún ọdún lẹ́yìn náà.
    Malachi:
      display_name: Málákì
      author: A kò mọ ẹni tí ó kọ ọ́; “Málákì” túmọ̀ sí “òjíṣẹ́ mi.”
      audience: Júdà lẹ́yìn ìgbèkùn, tí ó ń di aláìnáání nínú ìjọsìn àti ìṣòtítọ́ lábẹ́ ìṣàkóso Páṣíà.
      date: Ní nǹkan bí àárín ọ̀rúndún karùn-ún ṣáájú Sànmánì Kristẹni.
    Matthew:
      display_name: Mátíù
      author: A kò mọ ẹni tí ó kọ ọ́; àṣà sọ pé Mátíù aposteli ni ó kọ ọ́. Àwọn onímọ̀ òde òní rí i gẹ́gẹ́ bí iṣẹ́ Kristẹni Júù kan tí ó ń sọ èdè Gíríìkì, tí ó lo Máàkù àti orísun kan tí ó jọ Q.
      audience: Àwùjọ àwọn Kristẹni Júù kan tí ó ń ronú jinlẹ̀ nípa ohun tí ó tẹ̀ síwájú àti ohun tí ó yàtọ̀ sí ẹ̀sìn Júù ti sínágọ́gù.
      date: Ní nǹkan bí ọdún 80–90 lẹ́yìn Kristi.
    Mark:
      display_name: Máàkù
      author: A kò mọ ẹni tí ó kọ ọ́; àṣà so ọ́ mọ́ Jòhánù Máàkù, alábàákẹ́gbẹ́ Pétérù ní ìrìn-àjò.
      audience: Àwùjọ Kristẹni kan tí ó ń sọ èdè Gíríìkì, bóyá ní Róòmù, tí ó wà lábẹ́ ewu inúnibíni tàbí tí ewu náà sún mọ́.
      date: Ní nǹkan bí ọdún 65–75 lẹ́yìn Kristi, ní àyíká àkókò Ogun àwọn Júù àti ìparun tẹ́ńpìlì.
