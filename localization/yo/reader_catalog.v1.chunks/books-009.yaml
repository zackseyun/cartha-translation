      display_name: Ìṣọ̀fọ̀
      author: A kò mọ ẹni tó kọ ọ́; àṣà ìgbàanì sọ pé Jeremáyà ni.
      audience: Àwọn ará Jùdíà tí wọ́n ń ṣọ̀fọ̀ ìparun Jerusalẹmu ní ọdún 586 ṣáájú Sànmánì Tiwa.
      date: Kò pẹ́ lẹ́yìn ọdún 586 ṣáájú Sànmánì Tiwa.
    Ezekiel:
      display_name: Esekiẹli
      author: Esekiẹli, àlùfáà kan tí a kó ní ìgbèkùn lọ sí Babiloni; a sì tún ṣàtúnṣe àti ṣàgbékalẹ̀ ìwé náà bí àkókò ti ń lọ.
      audience: Àwọn ará Jùdíà tí a kó ní ìgbèkùn lọ sí Babiloni, tí wọ́n ń tún òye wọn nípa wíwà Ọlọ́run pẹ̀lú wọn ṣe láìsí tẹ́ńpìlì.
      date: Ní àárín nǹkan bí ọdún 593 sí 571 ṣáájú Sànmánì Tiwa ni iṣẹ́ wòlíì náà wáyé; ìwé náà dé ìrísí ìkẹyìn rẹ̀ ní àkókò díẹ̀ lẹ́yìn náà.
    Daniel:
      display_name: Dáníẹli
      author: A kò mọ ẹni tó kọ ọ́; ìwé náà fi ara rẹ̀ hàn bí iṣẹ́ Dáníẹli ti àkókò ìgbèkùn.
      audience: Àwọn Júù tí a ń ṣe inúnibíni sí lábẹ́ ìṣàkóso àwọn Gíríìkì—ní pàtàkì lábẹ́ Áńtíókù Kẹrin Epifáníìsì (ọdún 167 sí 164 ṣáájú Sànmánì Tiwa).
      date: Ó ṣeé ṣe kó dé ìrísí tí a gbà sílẹ̀ ní nǹkan bí ọdún 165 ṣáájú Sànmánì Tiwa; orí 1 sí 6 ní àwọn ìtàn ààfin tó ti wà ṣáájú nínú.
    Hosea:
      display_name: Hóséà
      author: Hóséà ọmọ Béérì.
      audience: Ìjọba àríwá Ísírẹ́lì ní àwọn ọdún ìkẹyìn rẹ̀ ṣáájú kí Ásíríà tó ṣẹ́gun rẹ̀.
      date: Ní nǹkan bí ọdún 750 sí 722 ṣáájú Sànmánì Tiwa.
