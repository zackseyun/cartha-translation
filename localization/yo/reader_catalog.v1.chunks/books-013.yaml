payload:
  book_metadata:
    James:
      display_name: Jákọ́bù
      author: Gẹ́gẹ́ bí àṣà, Jákọ́bù arákùnrin Jésù ni; èrò àwọn ọ̀mọ̀wé òde òní pín sí méjì lórí bóyá òun fúnra rẹ̀ ló kọ ọ́ tàbí ẹlòmíràn ló kọ ọ́ ní orúkọ rẹ̀.
      audience: Àwọn ìjọ Kristẹni Júù tí wọ́n fọ́n káàkiri.
      date: Ní nǹkan bí àwọn ọdún 50 sí 60 Lẹ́yìn Kristi, bí òun fúnra rẹ̀ bá kọ ọ́; ní ìparí ọ̀rúndún kìíní Lẹ́yìn Kristi, bí ẹlòmíràn bá kọ ọ́ ní orúkọ rẹ̀.
    1 Peter:
      display_name: 1 Pétérù
      author: Gẹ́gẹ́ bí àṣà, Pétérù aposteli ni, Sílífánù sì ni akọ̀wé rẹ̀; àwọn ọ̀mọ̀wé kan gbà pé ẹlòmíràn ló kọ ọ́ ní orúkọ Pétérù.
      audience: Àwọn Kristẹni ní Éṣíà Kékeré ti Róòmù tí wọ́n ń kojú ìkórìíra láwùjọ.
      date: Ní nǹkan bí àwọn ọdún 60 Lẹ́yìn Kristi, bí Pétérù bá kọ ọ́; ní nǹkan bí àwọn ọdún 70 sí 90 Lẹ́yìn Kristi, bí ẹlòmíràn bá kọ ọ́ ní orúkọ rẹ̀.
    2 Peter:
      display_name: 2 Pétérù
      author: Gẹ́gẹ́ bí àṣà, Pétérù ni; ọ̀pọ̀ àwọn ọ̀mọ̀wé òde òní gbà pé ẹlòmíràn ló kọ ọ́ ní orúkọ rẹ̀.
      audience: Àwọn Kristẹni tí wọ́n ń kojú àwọn ẹlẹ́gàn tí wọ́n sẹ́ pé Kristi yóò tún dé.
      date: Ní nǹkan bí ìbẹ̀rẹ̀ ọ̀rúndún kejì Lẹ́yìn Kristi.
    1 John:
      display_name: 1 Jòhánù
      author: A kò mọ ẹni tó kọ ọ́; gẹ́gẹ́ bí àṣà, Jòhánù aposteli tàbí alàgbà inú ẹgbẹ́ Jòhánù ni.
      audience: Àwùjọ Jòhánù lẹ́yìn ìyapa kan, tí wọ́n ń ṣàlàyé àwọn tó jẹ́ ara wọn.
      date: Ní nǹkan bí ọdún 90 sí 110 Lẹ́yìn Kristi.
    2 John:
      display_name: 2 Jòhánù
      author: “Alàgbà náà.”
      audience: Ìjọ Kristẹni kan pàtó (“obìnrin àyànfẹ́ náà”) tí a kìlọ̀ fún nípa àwọn olùkọ́ èké.
      date: Ní nǹkan bí ọdún 90 sí 110 Lẹ́yìn Kristi.
    3 John:
      display_name: 3 Jòhánù
      author: “Alàgbà náà.”
      audience: Gáyù, aṣáájú kan tó ń gba àwọn ajíhìnrere arìnrìn-àjò sílé.
      date: Ní nǹkan bí ọdún 90 sí 110 Lẹ́yìn Kristi.
    Jude:
      display_name: Júdà
      author: Gẹ́gẹ́ bí àṣà, Júdà, arákùnrin Jákọ́bù àti Jésù ni.
      audience: Àwọn àwùjọ Kristẹni tí àwọn olùkọ́ oníwà tútù sí ẹ̀ṣẹ̀ ń yọ́ wọ inú wọn.
      date: Ní nǹkan bí àwọn ọdún 60 sí 90 Lẹ́yìn Kristi.
    Revelation:
      display_name: Ìfihàn
      author: Jòhánù ti Pátímọ́sì (ọ̀nà ìkọ̀wé rẹ̀ yàtọ̀ sí ti Ìhìn Rere Kẹrin).
      audience: Àwọn ìjọ Kristẹni méje ní Éṣíà Kékeré ti Róòmù tí wọ́n wà lábẹ́ ìkìmọ́lẹ̀ ìjọba.
      date: Ní nǹkan bí àwọn ọdún 90 Lẹ́yìn Kristi; gẹ́gẹ́ bí àṣà, nígbà ìjọba Dómítíánù.
    Tobit:
      display_name: Tóbítì
      author: A kò mọ ẹni tó kọ ọ́.
      audience: Àwọn Júù tó fọ́n káàkiri tí wọ́n ń wá ọ̀nà láti gbé ní ìfọkànsìn, láti ṣègbéyàwó, àti láti gbẹ́kẹ̀ lé ìtọ́jú Ọlọ́run lábẹ́ ìjọba ilẹ̀ òkèèrè.
      date: Ní nǹkan bí ọdún 225 sí 175 Ṣáájú Kristi; a kọ ọ́ ní èdè Árámáíkì, ẹ̀dà Hébérù kan sì tún wà lára ohun tí a rí ní Kúmúránì.
    Judith:
      display_name: Júdítì
      author: A kò mọ ẹni tó kọ ọ́.
      audience: Àwọn Júù tí ewu láti ọwọ́ ilẹ̀ òkèèrè ń halẹ̀ mọ́—ìtàn ìdúróṣinṣin onígboyà tí ó kún fún ìfọkànsìn.
      date: Ní nǹkan bí ọdún 150 sí 100 Ṣáájú Kristi.
    Greek Additions to Esther:
      display_name: Àwọn Àfikún Gíríìkì sí Ẹ́sítérì
      author: A kò mọ ẹni tó kọ ọ́; àwọn àfikún ni wọ́n fi kún ìtumọ̀ Ẹ́sítérì sí èdè Gíríìkì.
      audience: Àwọn Júù tó ń sọ èdè Gíríìkì tí wọ́n fẹ́ kí ìtàn Ẹ́sítérì ní àdúrà àti ìtọ́kasí Ọlọ́run ní kedere.
      date: Ní nǹkan bí ọ̀rúndún kejì sí ọ̀rúndún kìíní Ṣáájú Kristi.
    Wisdom of Solomon:
      display_name: Ọgbọ́n Sólómọ́nì
      author: A kò mọ ẹni tó kọ ọ́; a fi í sọ Sólómọ́nì ní ọ̀nà ìkọ̀wé ní orúkọ ẹlòmíràn. Júù kan tó gbé láàárín àṣà Gíríìkì ló kọ ọ́ ní èdè Gíríìkì, ó ṣeé ṣe kó jẹ́ ní Alẹkisáńdíríà.
      audience: Àwọn Júù tó gbé láàárín àṣà Gíríìkì, tí wọ́n ń bá ìmọ̀ ọgbọ́n orílẹ̀-èdè Gíríìkì lò, tí wọ́n sì ń gbèjà ọgbọ́n Ísírẹ́lì lòdì sí àwọn àṣàyàn abọ̀rìṣà àti ti àwọn tó kọ ìgbàgbọ́ sílẹ̀.
      date: Ní nǹkan bí ọdún 50 Ṣáájú Kristi sí ọdún 50 Lẹ́yìn Kristi.
