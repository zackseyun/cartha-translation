    author: A kò mọ ẹni tó kọ ọ́. Láìka àkọlé ìbílẹ̀ rẹ̀ sí, ìwàásù Kristẹni ìjímìjí ni èyí, kì í ṣe lẹ́tà kejì tí Kílẹ́ḿtì ará Róòmù kọ.
    audience: Àpéjọ Kristẹni kan tí a ń rọ̀ láti ronúpìwàdà, láti máa hùwà déédéé, láti tọ́jú àwọn aláìlera, àti láti fi òtítọ́ fara da nínú ìrètí àjíǹde àti ìdájọ́.
    date: A sábà máa ń fi ọjọ́ rẹ̀ sí ìdajì àkọ́kọ́ tàbí àárín ọ̀rúndún kejì Lẹ́yìn Kristi (ní nǹkan bí ọdún 100–160); ibi tí a ti kọ ọ́ kò dájú.
