  Gospel of Peter:
    display_name: Ìhìn Rere Pétérù
    author: A kò mọ ẹni tó kọ ọ́. Ìtàn tó ṣẹ́ kù ń sọ̀rọ̀ bí ẹni pé Pétérù ló ń sọ ọ́, a sì gbé e ká ní orúkọ rẹ̀, ṣùgbọ́n a kò kà á sí iṣẹ́ Pétérù àpọ́sítélì tó gbé ayé ní ìtàn.
    audience: Àwọn Kristẹni ìjímìjí tí wọ́n nífẹ̀ẹ́ sí ìtàn tó fẹ̀ sí i nípa ìjìyà, ikú àti àjíǹde Jésù, ó ṣeé ṣe kó jẹ́ láàárín àwọn àwùjọ tí wọ́n ka ọlá àṣẹ Pétérù sí pàtàkì gan-an.
    date: A sábà máa ń fi ọjọ́ rẹ̀ sí ọ̀rúndún kejì Lẹ́yìn Kristi; àjákù èdè Gíríìkì pàtàkì tó ṣẹ́ kù wá láti inú ìwé àfọwọ́kọ tí a kọ pẹ́ púpọ̀ lẹ́yìn náà, tí a rí ní Ákímímì.
