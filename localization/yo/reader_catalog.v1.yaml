    display_name: Lẹ́tà Bánábà
    author: A kò mọ ẹni tó kọ ọ́. Ní ìbílẹ̀, a so iṣẹ́ náà mọ́ Bánábà, alábàáṣiṣẹ́ Pọ́ọ̀lù, ṣùgbọ́n àwọn ọ̀mọ̀wé òde òní kò gba ìsọfúnni yẹn.
    audience: Àwọn Kristẹni tí kì í ṣe Júù, tí a ń kọ́ láti gba Ìwé Mímọ́ Ísírẹ́lì gẹ́gẹ́ bí tiwọn nípasẹ̀ ìtumọ̀ tó dá lórí Kristi àti ìtumọ̀ àpẹẹrẹ, nígbà tí wọ́n ń fi ìdánimọ̀ májẹ̀mú wọn yàtọ̀ sí àṣà àwọn Júù.
    date: A sábà máa ń fi ọjọ́ rẹ̀ sí àárín ìparun tẹ́ńpìlì Jerúsálẹ́mù ní ọdún 70 Lẹ́yìn Kristi àti ìbẹ̀rẹ̀ ọ̀rúndún kejì, ní ọ̀pọ̀ ìgbà sí nǹkan bí ọdún 80–130.
