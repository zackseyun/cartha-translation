  Isaiah:
    display_name: Àìsáyà
    author: Àwọn òǹkọ̀wé púpọ̀ láti ọ̀pọ̀ ọ̀rúndún; orí 1–39 ní gbòǹgbò nínú iṣẹ́ Àìsáyà ti Jerúsálẹ́mù ní ọ̀rúndún kẹjọ ṣáájú Sànmánì Tiwa, nígbà tí orí 40–55 ("Àìsáyà Kejì") àti 56–66 ("Àìsáyà Kẹta") ń dáhùn sí ìgbèkùn àti ìpadàbọ̀.
    audience: Àwọn ará Júdà lábẹ́ ewu Ásíríà, àwọn tó wà ní ìgbèkùn Bábílónì, àti àwọn tó ń ṣe àtúnṣe lẹ́yìn ìgbèkùn—ní ọ̀kọ̀ọ̀kan àkókò.
    date: A kọ ọ́ láàárín nǹkan bí òpin ọ̀rúndún kẹjọ sí ọ̀rúndún karùn-ún ṣáájú Sànmánì Tiwa.
