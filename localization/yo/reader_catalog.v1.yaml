  Gospel of Thomas:
    display_name: Ìhìn Rere Tọ́màsì
    author: Òǹkọ̀wé aláìlórúkọ; àwọn ọ̀rọ̀ ìbẹ̀rẹ̀ fi àkójọpọ̀ àwọn ọ̀rọ̀ náà sọ́wọ́ “Dídímọ́sì Júdásì Tọ́màsì.” Ìtumọ̀ èdè Kọ́pítì ti ọ̀rúndún kẹrin láti Nag Hammadi (NHC II,2) nìkan ni ó ṣì wà ní ẹ̀kúnrẹ́rẹ́, pẹ̀lú àjákù mẹ́ta ní èdè Gíríìkì láti Oxyrhynchus.
    audience: Àwọn òǹkàwé Kristẹni tí ọgbọ́n ilẹ̀ Síríà àti àwọn èrò Gínọ́sítì ìbẹ̀rẹ̀pẹ̀pẹ̀ ní ipa lórí wọn, tí wọ́n sì dojú kọ ìmọ̀ ara ẹni àṣírí nínú àwọn ọ̀rọ̀ Jésù.
    date: Ó ṣeé ṣe kí ìwé Gíríìkì àkọ́kọ́ wá láti nǹkan bí ọdún 50–140 S.K.; ìwé àfọwọ́kọ Kọ́pítì, ní nǹkan bí ọdún 340 S.K.
    summary: Ìhìn Rere Tọ́màsì jẹ́ àkójọpọ̀ àwọn ọ̀rọ̀ tí a sọ pé Jésù ni ó sọ wọ́n. Kò ní ìtàn kan tí ó ń lọ ní ṣísẹ̀-n-tẹ̀lé, ó sì ń pe àwọn òǹkàwé léraléra láti ṣàwárí ìtumọ̀ àwọn ọ̀rọ̀ náà.
