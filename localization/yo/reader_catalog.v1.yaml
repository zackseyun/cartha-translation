    author: Ignatius, bíṣọ́ọ̀bù Antioku, ni a kà sí ẹni tó kọ àwọn lẹ́tà méje inú àtúnṣe alárin tí ọ̀pọ̀ ènìyàn tẹ́wọ́ gbà; àwọn lẹ́tà Ignatius tí a fẹ̀ sí i lẹ́yìn náà àti àwọn tí a kọ ní orúkọ rẹ̀ kò sí nínú àkójọpọ̀ yìí.
    audience: Àwọn ìjọ Kristẹni ní Efesu, Magnesia, Tralles, Romu, Filadelfia àti Smirna, pẹ̀lú Polycarp, tí Ignatius kọ sí nígbà ìrìn àjò rẹ̀ lọ sí ibi tí wọ́n yóò ti pa á nítorí ìgbàgbọ́ rẹ̀.
    date: A sábà máa ń fi ọjọ́ rẹ̀ sí ìbẹ̀rẹ̀ ọ̀rúndún kejì Lẹ́yìn Kristi, ní nǹkan bí ọdún 105–117, bí ó tilẹ̀ jẹ́ pé àkókò pàtó tí ìrìn àjò Ignatius wáyé ṣì jẹ́ ohun tí a ń ṣe àríyànjiyàn lé lórí.
