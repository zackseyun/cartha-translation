  Acts of Paul and Thecla:
    display_name: Ìṣe Pọ́ọ̀lù àti Tẹ́kílà
    author: A kò mọ ẹni tó kọ ọ́. Ó jẹ́ apá kan nínú Ìṣe Pọ́ọ̀lù tó gùn ju èyí lọ; ìròyìn àtijọ́ kan pé alùfáà àgbà kan ló kọ Ìṣe náà kò lè fi dá ẹni tó kọ ọ́ mọ̀ dájú.
    audience: Àwọn Kristẹni tí àwọn ìtàn nípa ìwàásù àwọn àpọ́sítélì, àìgbéyàwó, ìbatisí, ìfaradà tó dà bí ti ajẹ́rìíkú, àti àṣẹ obìnrin láti kọ́ni àti láti jẹ́rìí fà mọ́ra.
    date: A kọ ọ́ ní ọ̀rúndún kejì Lẹ́yìn Kristi, ó ṣeé ṣe kó jẹ́ ní ìdajì ìkẹyìn ọ̀rúndún náà; ó tàn ká gẹ́gẹ́ bí apá kan nínú Ìṣe Pọ́ọ̀lù àti gẹ́gẹ́ bí iṣẹ́ tó dá dúró fúnra rẹ̀.
