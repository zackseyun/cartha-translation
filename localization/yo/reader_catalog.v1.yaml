    introQuote: A ṣe àwọn ìwé tó wà nísàlẹ̀ láti inú àwọn ìwé àfọwọ́kọ Hébérù, Gíríìkì, Látìn, àti Ge’ez tí àwọn àwòṣe ìríran AI ṣàwòye wọn. Ọ̀pọ̀ ìgbà tí AI ìpele-gíga ń ṣiṣẹ́ lórí wọn ni ó mú kí ọ̀rọ̀ náà sún mọ́ àwọn ìwé àfọwọ́kọ náà bí ó ti lè ṣeé ṣe tó. Gbogbo iṣẹ́, dátà, àti àwọn ìpinnu ìtumọ̀ hàn gbangba, a sì tẹ̀ wọ́n jáde ní ìpele òmìnira àti ṣíṣí tó ga jù lọ bí ó ti lè ṣeé ṣe tó.
