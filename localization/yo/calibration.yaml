review:
  verdict: revise
  summary: A ti ṣe àtúnṣe sí àwọn gbolohun tí kò rọrùn, pàápàá ìtumọ̀ “vapor” ní Oníwàásù (kì í ṣe “òru”), ìṣàpèjúwe àwọn olùgbọ́ Jòhánù, àti ọ̀rọ̀ ìbẹ̀rẹ̀ Ìhìn Rere Tómásì. A tún mú àwọn àlàyé ẹsẹ̀ tó ṣe pàtàkì bá ìtumọ̀ orísun mu dáadáa.
  issues:
  - Nínú Oníwàásù 1:2, “òru” túmọ̀ sí night ní Yorùbá, kì í ṣe vapor; a rọ́pò rẹ̀ pẹ̀lú “èémí” láti pa àwòrán hevel mọ́.
  - Àlàyé olùgbọ́ ìwé Jòhánù ní ìtumọ̀ àkọ́kọ́ kò sọ ìfẹ̀gbẹ́kún àwùjọ náà pẹ̀lú ẹ̀sìn Júù inú sínágọ́gù ní ọ̀nà tí ó rọrùn; a ṣàtúnṣe rẹ̀.
  - Nínú metadata Ìhìn Rere Tómásì, a ṣàtúnṣe gbolohun tí ó lè dà bí ẹni pé a yàn Dídímọ́sì Júdásì Tómásì gẹ́gẹ́ bí ẹni tí a kọ ìwé náà fún, dípò pé incipit ni ó sọ ìfàtọ́kasí náà.
  - A ṣàtúnṣe díẹ̀ nínú ọ̀rọ̀ Yorùbá kí ó lè jẹ́ adayébá, láìfi ẹ̀kọ́ ìtumọ̀ míràn kún un.
