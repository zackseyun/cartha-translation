book_localizations:
- source_title: Genesis
  title: Jẹ́nẹ́sísì
  author: A kò mọ ẹni tó kọ ọ́; àṣà ìgbàanì ka Mósè sí ẹni tó kọ ọ́. Àwọn onímọ̀ òde òní rí i gẹ́gẹ́ bí ìwé tí a ṣàkójọ rẹ̀ ní ọ̀pọ̀ ọ̀rúndún láti inú orísun mélòó kan, tí a sì ṣàtúnṣe wọn pọ̀ nígbà tó yá.
  audience: Àwọn ọmọ Ísírẹ́lì gẹ́gẹ́ bí ènìyàn májẹ̀mú, láti fi ìtàn ìpilẹ̀ṣẹ̀ wọn múlẹ̀ nínú ìṣẹ̀dá Ọlọ́run, ìfẹ́yàn rẹ̀, àti ìlérí rẹ̀.
  date: A kọ ọ́ nípasẹ̀ ìpele tó gba ọ̀pọ̀ ọ̀rúndún; ó dé ìrísí tí a gbà sílẹ̀ ní nǹkan bí ọ̀rúndún kẹfà sí karùn-ún ṣáájú Sànmánì Tiwa, ní àkókò tàbí lẹ́yìn ìgbèkùn Bábílónì.
  summary: Jẹ́nẹ́sísì sọ nípa ìṣẹ̀dá, ìṣọ̀tẹ̀ àti ìtànká aráyé, àti ìdílé Ábúráhámù, Ísáákì, Jákọ́bù àti Jósẹ́fù, nípasẹ̀ àwọn tí ìlérí májẹ̀mú Ọlọ́run fún Ísírẹ́lì ti bẹ̀rẹ̀.
- source_title: John
  title: Jòhánù
  author: A kò mọ ẹni tó kọ ọ́; àṣà ìgbàanì ka àpọ́sítélì Jòhánù tàbí “Ọmọ-ẹ̀yìn Tí A Fẹ́ràn” sí ẹni tó kọ ọ́.
  audience: Àwùjọ àwọn Kristẹni kan tí ó wà nínú ìfẹ̀gbẹ́kún pẹ̀lú ẹ̀sìn Júù inú sínágọ́gù, tí a dá sílẹ̀ ní àyíká ẹ̀rí Ọmọ-ẹ̀yìn Tí A Fẹ́ràn.
  date: Ní nǹkan bí ọdún 90–110 Sànmánì Tiwa.
  summary: Jòhánù fi Jésù hàn gẹ́gẹ́ bí Ọ̀rọ̀ ayérayé tó ń fi Baba hàn, tó ń fi ìyè fún àwọn tó gbẹ́kẹ̀ lé e, tí a sì gbé e ga nípasẹ̀ àwọn iṣẹ́ àmì rẹ̀, ikú rẹ̀ àti àjíǹde rẹ̀.
- source_title: Gospel of Thomas
  title: Ìhìn Rere Tómásì
  author: A kò mọ ẹni tó kọ ọ́; ọ̀rọ̀ ìbẹ̀rẹ̀ rẹ̀ fi àkójọ àwọn ọ̀rọ̀ náà sọ́tọ̀ sí “Dídímọ́sì Júdásì Tómásì.” Ẹ̀dà rẹ̀ tó pé tí ó ṣì wà lónìí jẹ́ ìtumọ̀ èdè Kọ́pítì ti ọ̀rúndún kẹrin láti Nag Hammadi (NHC II,2); àjákù mẹ́ta ní èdè Gíríìkì láti Oxyrhynchus sì tún wà.
  audience: Àwọn òǹkàwé Kristẹni tí ọgbọ́n ilẹ̀ Síríà àti èrò ìbẹ̀rẹ̀ Gínọ́sítì ní ipa lórí, tí ìfẹ́ wọn sì dojú kọ ìmọ̀ ara ẹni tó farasin nínú àwọn ọ̀rọ̀ Jésù.
  date: Ó ṣeé ṣe kí ojúlówó èdè Gíríìkì jẹ́ ti nǹkan bí ọdún 50–140 Sànmánì Tiwa; ìwé afọwọ́kọ Kọ́pítì jẹ́ ti nǹkan bí ọdún 340 Sànmánì Tiwa.
  summary: Ìhìn Rere Tómásì jẹ́ àkójọ àwọn ọ̀rọ̀ tí a sọ pé Jésù ni ó sọ. Kò ní ìtàn kan tó ń tẹ̀ léra, ó sì ń pe àwọn òǹkàwé léraléra láti ṣàwárí ìtumọ̀ àwọn ọ̀rọ̀ náà.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Jẹ́nẹ́sísì 1:1
  text: Nígbà tí Ọlọ́run bẹ̀rẹ̀ sí í dá ọ̀run àti ayé[a]—
  translator_note: '[a] Ìtumọ̀ ìbílẹ̀ ka èyí sí gbólóhùn tó pé: “Ní ìbẹ̀rẹ̀, Ọlọ́run dá ọ̀run àti ayé.” Ṣùgbọ́n èdè Hébérù túbọ̀ dà bí ọ̀rọ̀ ìṣáájú ohun tó tẹ̀ lé e, níbi tí ìṣe pàtàkì náà, “Ọlọ́run sọ,” ti wà ní ẹsẹ̀ 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Oníwàásù 1:2
  text: “Èémí àwọn èémí[a],” ni Kóhẹ́lẹ́tì[b] wí. “Ohun gbogbo jẹ́ èémí—ó kúrú, kò ṣeé dì mú, ó sì sábà máa ń yàtọ̀ sí ohun tí a retí.”
  translator_note: '[a] Ọ̀rọ̀ Hébérù náà, hevel, túmọ̀ ní tààrà sí èémí tàbí ohun tí ó dà bí ìkùùkuu. Jálẹ̀ ìwé Oníwàásù, ó ń ṣàpèjúwe ohun tó yára kọjá lọ, tí kò ṣeé dì mú tàbí lóye pátápátá, tí ó sì sábà máa ń yàtọ̀ sí ohun tí ènìyàn retí. “Èémí” pa àwòrán yẹn mọ́ láìsọ pé kò sí ohun kankan tó ní ìtumọ̀. Àwọn ọ̀nà mìíràn tí a lè gbà túmọ̀ rẹ̀ ni “kìkì èémí” tàbí “ohun tó ń kọjá lọ.” [b] Kóhẹ́lẹ́tì ni orúkọ tàbí oyè Hébérù ti ẹni tó kọ ìwé náà. A sábà máa ń túmọ̀ rẹ̀ sí “Olùkọ́” tàbí “Oníwàásù,” ṣùgbọ́n a pa “Kóhẹ́lẹ́tì” mọ́ kí gbogbo ìtumọ̀ tó ṣeé ṣe lè dúró, láìṣe ojúsàájú sí ìtumọ̀ kan.'
- source_path: nt/john/001/001.yaml
  reference: Jòhánù 1:1
  text: Ní ìbẹ̀rẹ̀[b], Ọ̀rọ̀ náà ti wà tẹ́lẹ̀. Ọ̀rọ̀ náà wà pẹ̀lú Ọlọ́run, Ọ̀rọ̀ náà sì jẹ́ Ọlọ́run.[a]
  translator_note: '[a] Tàbí, “Ọ̀rọ̀ náà ní ìwà àtọ̀runwá,” tàbí “ohun tí Ọlọ́run jẹ́ ni Ọ̀rọ̀ náà jẹ́.” Bí a ṣe ṣe ọ̀rọ̀ Gíríìkì náà fi ìdí rẹ̀ múlẹ̀ pé Ọ̀rọ̀ náà jẹ́ Ọlọ́run ní kíkún, nígbà tó sì ń fi Ọ̀rọ̀ náà yàtọ̀ sí Ọlọ́run nínú gbólóhùn tó ṣáájú. [b] Ọ̀rọ̀ ìbẹ̀rẹ̀ yìí dún bí Jẹ́nẹ́sísì 1:1, ó sì so Ọ̀rọ̀ náà pọ̀ mọ́ ìbẹ̀rẹ̀ ìṣẹ̀dá. “Ti wà tẹ́lẹ̀” fi hàn pé Ọ̀rọ̀ náà ti ń bẹ nígbà tí ìbẹ̀rẹ̀ dé, kì í ṣe pé ó ṣẹ̀ṣẹ̀ bẹ̀rẹ̀ sí í wà nígbà náà; a tún lè túmọ̀ rẹ̀ sí “wà” tàbí “ń bẹ.”'
- source_path: nt/romans/003/025.yaml
  reference: Róòmù 3:25
  text: Ọlọ́run gbé e kalẹ̀ gẹ́gẹ́ bí ẹbọ ètùtù[a], nípasẹ̀ ìgbàgbọ́ nínú ẹ̀jẹ̀ rẹ̀[b]. Ó ṣe èyí láti fi òdodo rẹ̀ hàn[c], nítorí pé ó ti foju kọ àwọn ẹ̀ṣẹ̀ tí a dá ní àtijọ́.
  translator_note: '[a] Tàbí “ohun tó mú ìbínú rọ̀”; tàbí “ìbòrí àánú,” ìyẹn ìbòrí wúrà tó wà lórí Àpótí Ẹ̀rí Májẹ̀mú, níbi tí a ti ń wọ́n ẹ̀jẹ̀ ètùtù sí ní Májẹ̀mú Láéláé. [b] Tàbí “nípasẹ̀ ìgbàgbọ́, nípasẹ̀ ẹ̀jẹ̀ rẹ̀.” [c] Tàbí “ìdájọ́ òdodo.”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Pétérù 1:13
  text: Nítorí náà, ẹ mú ọkàn yín múra de ìṣe.[a] Ẹ máa ronú kedere pátápátá, kí ẹ sì gbé gbogbo ìrètí yín lé oore-ọ̀fẹ́ tí a ń mú wá fún yín nígbà tí Jésù Mèsáyà bá farahàn.[b]
  translator_note: '[a] Èdè Gíríìkì sọ ní tààrà pé, “Ẹ di àmùrè mọ́ ẹ̀gbẹ́ ọkàn yín.” Ó ń ya àwòrán bí a ṣe ń kó aṣọ gígùn jọ sí ẹ̀gbẹ́ kí ènìyàn lè múra tán láti ṣe ohun kan. [b] Ọ̀rọ̀ Gíríìkì tí a túmọ̀ sí “pátápátá” àti “gbogbo” lè tọ́ka sí ríronú kedere, sí gbígbé ìrètí lé oore-ọ̀fẹ́, tàbí bóyá sí méjèèjì.'
