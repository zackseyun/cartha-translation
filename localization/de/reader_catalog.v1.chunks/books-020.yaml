  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und korrigiert. Mehrere Formulierungen wurden enger an die englische Quelle angepasst; insbesondere wurde in Jubiläen 24 das Subjekt des Betrugs nicht vertauscht. Der kanonische Quelltext für Der Hirte des Hermas 17 ist selbst eine Platzhalteranweisung und wurde daher wörtlich lokalisiert, nicht als erfundene Inhaltsangabe ergänzt.
  issues:
  - 'Jubiläen 24: Der Entwurf machte Laban zum betrügerisch Dienenden; die Quelle beschreibt Jakob als denjenigen, der Laban auf betrügerische Weise dient.'
  - 'Der Hirte des Hermas 17: Die englische Quelle enthält statt eines Kapiteltitels die Platzhalteranweisung „Provide Chapter 17 Summary“. Sie wurde quellentreu übersetzt; für einen endgültigen Reader-Titel sollte die englische Quelle redaktionell ersetzt werden.'
  - Kleinere stilistische und semantische Anpassungen wurden vorgenommen, darunter Metadaten, Jubiläen 34 und 50 sowie Der Hirte des Hermas 7, 31 und 33.
