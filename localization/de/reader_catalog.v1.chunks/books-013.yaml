payload:
  book_metadata:
    James:
      display_name: Jakobus
      author: Traditionell Jakobus, der Bruder Jesu; in der modernen Forschung ist umstritten, ob der Brief tatsächlich von ihm stammt oder unter seinem Namen verfasst wurde.
      audience: Judenchristliche Gemeinden in der Diaspora.
      date: Ca. 50er–60er Jahre n. Chr., falls authentisch; andernfalls etwa Ende des 1. Jahrhunderts n. Chr.
    1 Peter:
      display_name: 1. Petrus
      author: Traditionell der Apostel Petrus, mit Silvanus als Schreiber; einige Forschende halten den Brief für ein unter seinem Namen verfasstes Werk.
      audience: Christinnen und Christen im römischen Kleinasien, die gesellschaftlicher Anfeindung ausgesetzt waren.
      date: Ca. 60er Jahre n. Chr., falls von Petrus verfasst; andernfalls ca. 70er–90er Jahre n. Chr.
    2 Peter:
      display_name: 2. Petrus
      author: Traditionell Petrus; in der modernen Forschung wird der Brief weithin für ein unter seinem Namen verfasstes Werk gehalten.
      audience: Christinnen und Christen, die mit Spöttern konfrontiert waren, welche die Wiederkunft Christi bestritten.
      date: Ca. Anfang des 2. Jahrhunderts n. Chr.
    1 John:
      display_name: 1. Johannes
      author: Anonym; traditionell dem Apostel Johannes oder dem johanneischen Ältesten zugeschrieben.
      audience: Die johanneische Gemeinschaft nach einer Spaltung, in der neu bestimmt wurde, wer zu ihr gehört.
      date: Ca. 90–110 n. Chr.
    2 John:
      display_name: 2. Johannes
      author: „Der Älteste“.
      audience: Eine bestimmte christliche Gemeinde („die auserwählte Herrin“), die vor falschen Lehrern gewarnt wird.
      date: Ca. 90–110 n. Chr.
    3 John:
      display_name: 3. Johannes
      author: „Der Älteste“.
      audience: Gaius, ein Gemeindeleiter, der umherreisende Missionare beherbergte.
      date: Ca. 90–110 n. Chr.
    Jude:
      display_name: Judas
      author: Traditionell Judas, der Bruder des Jakobus und Jesu.
      audience: Christliche Gemeinschaften, in die Lehrer mit zügellosen Anschauungen eingedrungen waren.
      date: Ca. 60er–90er Jahre n. Chr.
    Revelation:
      display_name: Offenbarung
      author: Johannes von Patmos (stilistisch vom vierten Evangelium verschieden).
      audience: Sieben christliche Gemeinden im römischen Kleinasien unter dem Druck der kaiserlichen Herrschaft.
      date: Ca. 90er Jahre n. Chr., traditionell in die Regierungszeit Domitians datiert.
    Tobit:
      display_name: Tobit
      author: Anonym.
      audience: Jüdinnen und Juden in der Diaspora, die unter Fremdherrschaft nach Frömmigkeit, einer guten Ehe und Gottes Vorsehung fragten.
      date: Ca. 225–175 v. Chr.; auf Aramäisch verfasst, wobei in Qumran auch eine hebräische Fassung belegt ist.
    Judith:
      display_name: Judit
      author: Anonym.
      audience: Jüdinnen und Juden unter fremder Bedrohung – eine trotzige Erzählung über frommen Widerstand.
      date: Ca. 150–100 v. Chr.
    Greek Additions to Esther:
      display_name: Griechische Zusätze zu Ester
      author: Anonym; ergänzendes Material, das der griechischen Übersetzung des Esterbuches hinzugefügt wurde.
      audience: Griechischsprachige Jüdinnen und Juden, die eine Estererzählung mit ausdrücklichen Gebeten und direkten Bezügen auf Gott wünschten.
      date: Ca. 2.–1. Jahrhundert v. Chr.
    Wisdom of Solomon:
      display_name: Weisheit Salomos
      author: Anonym; unter Salomos Namen verfasst. In griechischer Sprache von einem hellenistischen jüdischen Autor geschrieben, wahrscheinlich in Alexandria.
      audience: Hellenistische Jüdinnen und Juden, die sich mit griechischer Philosophie auseinandersetzten und Israels Weisheit gegenüber heidnischen und vom Glauben abgefallenen Alternativen verteidigten.
      date: Ca. 50 v. Chr.–50 n. Chr.
