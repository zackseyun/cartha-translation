  review_summary: Vollständige deutsche Lokalisierung geprüft und korrigiert. Drei Kapitelüberschriften wurden näher am kanonischen englischen Sinn ausgerichtet.
  issues:
  - 'Tobit 9: Der Entwurf änderte die im Quelltext genannte Rückgabe des Geldes an Tobit zu einer Übergabe an Tobias.'
  - 'Judith 6: Der Entwurf ersetzte die Warnung an Achior durch eine Zurückweisung seiner Warnung durch Holofernes.'
  - 'Griechische Zusätze zu Ester 6: Der Entwurf ließ das Prophezeien aus.'
