review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und korrigiert. Einige Titel wurden enger an die englische Aussage angepasst, insbesondere 1 Petrus 3, 1 Johannes 5, Offenbarung 8 und 10, Tobit 9 sowie die griechischen Esterzusätze 6.
  issues:
  - '1 Peter 3: „Wives“ wurde präziser als „Ehefrauen“ wiedergegeben.'
  - '1 John 5: Die deutsche Fassung verschob die Aussage von Jesus auf die Glaubenden; korrigiert.'
  - 'Revelation 8 und 10: Aussage der englischen Titel ohne zusätzliche bzw. verschobene Deutung angepasst.'
  - 'Tobit 9: „returns money to Tobit“ korrekt als Rückgabe des Geldes an Tobit übersetzt.'
  - 'Greek Additions to Esther 6: Erinnerung an den Traum und Weissagung getrennt wiedergegeben.'
