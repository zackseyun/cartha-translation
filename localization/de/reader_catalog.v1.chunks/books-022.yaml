review:
  verdict: revise
  review_summary: Vollständige deutsche Fassung eingereicht. Einige Formulierungen wurden zur engeren Wiedergabe der englischen Quelle korrigiert, insbesondere bei Datierungsnuancen, der Handschriftenbeschreibung und einzelnen Kapiteltiteln.
  issues:
  - Die Datierungen der Patriarchentestamente gaben das vorsichtige „c.“ als „vermutlich“ wieder; dies wurde neutral als „um“ übersetzt.
  - Beim Philippusevangelium wurde „sole surviving copy“ präziser als „einzige erhaltene Kopie“ wiedergegeben.
  - Einige Titel waren leicht paraphrasierend oder ließen ein Quellelement aus; sie wurden enger an den Ausgangstext angeglichen.
