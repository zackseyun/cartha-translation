  verdict: revise
  review_summary: Vollständige deutsche Fassung geprüft und direkt korrigiert. Anpassungen betreffen insbesondere die grammatische Themenumschaltung, die Suchplatzhalter und die präzisere Wiedergabe der Projektbeschreibung.
  issues:
  - switchTheme benötigte die deutsche Bindestrichschreibung mit dem Modus-Token.
  - searchPlaceholder veränderte die Suchfunktion teilweise zu einer Aufruffunktion.
  - pickerJesusWordsBody war als Infinitivkonstruktion weniger getreu als die englische Handlungsaufforderung.
  - introQuote wurde für eine nähere, sachlichere Wiedergabe des englischen Ausgangstexts korrigiert.
