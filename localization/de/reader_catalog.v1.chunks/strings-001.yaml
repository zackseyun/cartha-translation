review:
  verdict: revise
  review_summary: Die deutsche Lokalisierung ist vollständig und überwiegend treffend. Einige UI-Statusbezeichnungen sowie die Projektbeschreibung wurden für eine genauere, idiomatische und quellentreue Wiedergabe korrigiert.
  issues:
  - recentStudy was rendered as an activity rather than the noun label “Recent study”.
  - notedSuffix and savedAndNotes needed closer UI-label equivalents.
  - inlineFootnotesBody should refer specifically to note markers.
  - introQuote softened or altered details about manuscript processing and the degree of openness; revised to preserve the source claims without adding historical interpretation.
