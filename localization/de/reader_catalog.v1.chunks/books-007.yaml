    Proverbs:
      display_name: Sprüche
      author: Eine Sammlung; die Überschriften nennen Salomo, Agur, Lemuël und „die Weisen“.
      audience: Junge Israeliten, die für ihr tägliches Leben in Weisheit unterwiesen werden.
      date: Entstehungsschichten etwa vom 10. bis zum 4. Jahrhundert v. Chr.
    Ecclesiastes:
      display_name: Prediger
      author: Anonym; der Sprecher ist „Kohelet“, der traditionell mit Salomo gleichgesetzt wird.
      audience: Israeliten, die sich mit den Grenzen von Weisheit, Reichtum und Mühe unter der Sonne auseinandersetzen.
      date: Aufgrund des aramäisch beeinflussten Hebräisch wahrscheinlich etwa 5. bis 3. Jahrhundert v. Chr.
    Song of Solomon:
      display_name: Hohelied Salomos
      author: Anonym; die Überschrift nimmt auf Salomo Bezug.
      audience: Israel, das erotische Liebe als Bild für die innige Beziehung des Bundes liest – und später jüdische und christliche Leser, die das Buch allegorisch deuten.
      date: Wahrscheinlich nachexilisch, etwa 5. bis 3. Jahrhundert v. Chr.
