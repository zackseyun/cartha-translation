  verdict: revise
  review_summary: Vollständige deutsche Fassung geprüft und korrigiert. Wesentliche Korrekturen betreffen die treuere Wiedergabe einzelner Kapitelüberschriften, insbesondere Hiob 4, sowie kleinere sachliche und stilistische Präzisierungen.
  issues:
  - 'Ezra audience: „die Stadt wieder aufbauten“ war gegenüber dem kanonischen „rebuilding Jerusalem“ zu spezifisch.'
  - 'Hiob 4: Der Bezug auf „sowing“ fehlte und wurde ergänzt.'
  - Einzelne Titel wurden enger am kanonischen Sinn formuliert.
