    Ezra:
      display_name: Esra
      author: Anonym; möglicherweise von derselben Hand wie die Chronikbücher.
      audience: Rückkehrer, die Jerusalem unter persischer Herrschaft wiederaufbauten.
      date: Ca. Mitte des 5. bis 4. Jahrhunderts v. Chr.
    Nehemiah:
      display_name: Nehemia
      author: Anonym; enthält einen Nehemia zugeschriebenen Bericht in der Ich-Form.
      audience: Rückkehrer, die unter persischer Herrschaft Jerusalems Mauern wiederaufbauten und den Bund erneuerten.
      date: Ca. Mitte des 5. bis 4. Jahrhunderts v. Chr.
    Esther:
      display_name: Ester
      author: Anonym.
      audience: Juden in der Diaspora unter fremder Herrschaft, besonders in Persien.
      date: Ca. spätpersische oder frühhellenistische Zeit (4.–3. Jahrhundert v. Chr.).
    Job:
      display_name: Hiob
      author: Anonym.
      audience: Israeliten, die mit unschuldigem Leiden und göttlicher Gerechtigkeit rangen.
      date: Nach dem Konsens der Weisheitstraditionsforschung entstand das Buch etwa im 6.–4. Jahrhundert v. Chr. und griff dabei auf älteres volkstümliches Überlieferungsgut zurück.
    Psalms:
      display_name: Psalmen
      author: Mehrere Verfasser über Jahrhunderte hinweg; die Überschriften nennen David, Asaf, Korach, Salomo, Mose und andere.
      audience: Israel und die Tempelgemeinde im Gottesdienst – sowie jede spätere Gemeinschaft des Gebets und der Klage.
      date: Entstanden etwa im 10.–3. Jahrhundert v. Chr.; die endgültige Zusammenstellung erfolgte in nachexilischer Zeit.
