review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und direkt korrigiert. Einige Kapitelüberschriften wurden enger an den englischen Sinn angepasst; insbesondere wurden eine unbelegte Bezugnahme auf Jesu Lehren und eine ungenaue Formulierung zu Thomas entfernt.
  issues:
  - 'Gospel of Mary 3: „Jesu“ war im englischen Titel nicht enthalten.'
  - 'Book of Thomas the Contender 1: Der Entwurf machte aus den „teachings“ unzutreffend Lehren an Thomas statt Lehren des Thomas.'
  - 'Dialogue of the Savior 14: „über alles“ fügte ein im Ausgangstext nicht vorhandenes Objekt hinzu.'
