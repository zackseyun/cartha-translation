  book_metadata:
    Gospel of Mary:
      display_name: Evangelium der Maria
      author: Anonym. Das Werk stellt Maria als Empfängerin und Auslegerin einer Offenbarung Jesu dar, behauptet jedoch nicht, dass Maria das erhaltene Evangelium verfasst habe.
      audience: Frühe christliche Leserinnen und Leser, die sich mit Offenbarung, geistlichem Aufstieg, apostolischer Autorität und der Legitimität von Marias Lehre im Kreis der Jünger Jesu auseinandersetzten.
      date: Gewöhnlich in das 2. Jahrhundert n. Chr. datiert; griechische Fragmente sind aus dem 3. Jahrhundert erhalten, und der wichtigste koptische Textzeuge ist im Berliner Kodex 8502 aus dem 5. Jahrhundert überliefert.
    Treatise on the Resurrection:
      display_name: Abhandlung über die Auferstehung
      author: Anonym. Das Werk ist als Brief eines Lehrers an einen Schüler namens Rheginos gestaltet; weder der Lehrer noch Rheginos lassen sich sicher identifizieren.
      audience: Christinnen und Christen, die Unterweisung über die Auferstehung suchten, insbesondere Leserinnen und Leser, die leibliche, geistliche und bereits gegenwärtige Teilhabe am Leben der Auferstehung gegeneinander abwogen.
      date: Gewöhnlich in das späte 2. Jahrhundert n. Chr. eingeordnet (oft um 170–200); erhalten in einer koptischen Abschrift aus dem 4. Jahrhundert, die auf ein älteres griechisches Werk zurückgeht.
    Dialogue of the Savior:
      display_name: Dialog des Erlösers
      author: Anonym. Der Dialog legt Jesus offenbarende Lehren in einem Gespräch mit Judas, Matthäus und Maria in den Mund, nennt jedoch nicht die Person, die das Werk zusammengestellt hat.
      audience: Ein frühchristlicher Kreis mit Interesse an privater Offenbarung, Nachfolge, Selbsterkenntnis, Gebet und asketischer Vorbereitung auf die Erlösung.
      date: Gemeinhin dem 2. Jahrhundert n. Chr. zugeordnet, obwohl seine Entstehungsschichten und die genaue Datierung umstritten bleiben; erhalten in einer koptischen Handschrift aus dem 4. Jahrhundert.
    Exegesis on the Soul:
      display_name: Auslegung über die Seele
      author: Anonym. Der Verfasser ist ein christlicher Prediger, der biblische und griechisch-literarische Bilder als Allegorie auf Fall, Umkehr und Wiederherstellung der Seele neu deutet.
      audience: Mit der Schrift und moralischer Ermahnung vertraute Christinnen und Christen, die dazu aufgerufen wurden, sich von ungeordnetem Verlangen abzuwenden, umzukehren und sich wieder mit dem Göttlichen zu vereinen.
      date: Im Allgemeinen in das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert; erhalten in einer koptischen Übersetzung aus dem Griechischen aus dem 4. Jahrhundert.
    Book of Thomas the Contender:
      display_name: Buch des Thomas, des Kämpfers
      author: Anonym. Der Schlusstitel bringt das Werk mit Judas Thomas in Verbindung und nennt Mathaias als Schreiber; dabei handelt es sich jedoch um literarische Zuschreibungen und nicht um überprüfbare Angaben zur Verfasserschaft.
      audience: Asketisch orientierte Christinnen und Christen, die aufgefordert wurden, nach Selbsterkenntnis zu streben, körperlichen Leidenschaften zu widerstehen und Jesu private Unterweisung an Thomas zu verstehen.
      date: Oft in das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert, möglicherweise in einem syrisch-christlichen Umfeld; erhalten in einer koptischen Handschrift aus dem 4. Jahrhundert.
    Tripartite Tractate:
      display_name: Dreiteilige Abhandlung
      author: Anonym. Der Verfasser war ein hochgebildeter valentinianischer christlicher Theologe; eine sichere Gleichsetzung mit einem namentlich bekannten Lehrer ist nicht möglich.
      audience: Eine valentinianische christliche Gemeinschaft, die eine ausführliche Unterweisung über Gott, die Äonen, die Schöpfung, Christus, die Kirche, die Erlösung und die endgültige Wiederherstellung empfing.
      date: Gewöhnlich in das 3. Jahrhundert n. Chr. datiert, wobei einige Argumente für dessen zweite Hälfte sprechen; im Jung-Kodex aus dem 4. Jahrhundert auf Koptisch erhalten.
    Apocryphon of John:
      display_name: Apokryphon des Johannes
      author: Anonym. Das Werk gibt sich pseudonym als Offenbarung des auferstandenen Jesus an Johannes, den Sohn des Zebedäus, aus und ist in mehr als einer antiken Textfassung erhalten.
      audience: Christinnen und Christen in einer sethianischen oder eng verwandten Offenbarungstradition, die eine Darstellung der göttlichen Welt, der Schöpfung, der menschlichen Identität und der Befreiung von feindlichen Herrschern suchten.
      date: Eine frühe Fassung war wahrscheinlich bereits im 2. Jahrhundert n. Chr. im Umlauf; die erhaltenen koptischen Textzeugen, die kürzere und längere Fassungen bewahren, stammen aus dem 4. und 5. Jahrhundert.
