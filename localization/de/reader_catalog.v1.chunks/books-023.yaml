  book_metadata:
    Gospel of Mary:
      display_name: Evangelium der Maria
      author: Anonym. Das Werk stellt Maria als Empfängerin und Auslegerin einer Offenbarung Jesu dar, behauptet jedoch nicht, dass Maria das erhaltene Evangelium verfasst habe.
      audience: Frühe christliche Leserinnen und Leser, die sich mit Offenbarung, geistlichem Aufstieg, apostolischer Autorität und der Berechtigung von Marias Lehre unter den Jüngern Jesu auseinandersetzten.
      date: Gewöhnlich auf das 2. Jahrhundert n. Chr. datiert; griechische Fragmente sind aus dem 3. Jahrhundert erhalten, und der wichtigste koptische Textzeuge ist im Berliner Kodex 8502 aus dem 5. Jahrhundert überliefert.
    Treatise on the Resurrection:
      display_name: Abhandlung über die Auferstehung
      author: Anonym. Das Werk ist als Brief eines Lehrers an einen Schüler namens Rheginos gestaltet; weder der Lehrer noch Rheginos lassen sich sicher identifizieren.
      audience: Christinnen und Christen, die Unterweisung über die Auferstehung suchten, besonders Leserinnen und Leser, die leibliche und geistliche Vorstellungen sowie die gegenwärtige Teilhabe am Auferstehungsleben gegeneinander abwogen.
      date: Gewöhnlich in das späte 2. Jahrhundert n. Chr. eingeordnet (oft etwa 170–200); erhalten in einer koptischen Abschrift aus dem 4. Jahrhundert, die auf ein älteres griechisches Werk zurückgeht.
    Dialogue of the Savior:
      display_name: Dialog des Erlösers
      author: Anonym. Der Dialog legt Jesus in Gesprächen mit Judas, Matthäus und Maria offenbarende Lehren in den Mund, nennt jedoch nicht, wer ihn zusammengestellt hat.
      audience: Ein frühchristlicher Kreis, der sich für private Offenbarung, Jüngerschaft, Selbsterkenntnis, Gebet und asketische Vorbereitung auf die Erlösung interessierte.
      date: Allgemein dem 2. Jahrhundert n. Chr. zugeordnet, obwohl seine Entstehungsschichten und die genaue Datierung umstritten bleiben; erhalten in einer koptischen Handschrift aus dem 4. Jahrhundert.
    Exegesis on the Soul:
      display_name: Auslegung über die Seele
      author: Anonym. Der Verfasser ist ein christlicher Prediger, der Bilder aus der Bibel und der griechischen Literatur als Allegorie für Fall, Umkehr und Wiederherstellung der Seele neu deutet.
      audience: Mit der Heiligen Schrift und moralischer Ermahnung vertraute Christinnen und Christen, die dazu aufgerufen wurden, sich von ungeordnetem Begehren abzuwenden, umzukehren und sich wieder mit dem Göttlichen zu vereinen.
      date: Im Allgemeinen auf das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert; erhalten in einer koptischen Übersetzung aus dem Griechischen aus dem 4. Jahrhundert.
    Book of Thomas the Contender:
      display_name: Buch des Thomas, des Kämpfers
      author: Anonym. Der Schlusstitel bringt das Werk mit Judas Thomas in Verbindung und nennt Mathaias als Schreiber, doch handelt es sich dabei um literarische Zuschreibungen und nicht um überprüfbare Angaben zur Verfasserschaft.
      audience: Asketisch orientierte Christinnen und Christen, die dazu angehalten wurden, Selbsterkenntnis zu suchen, körperlichen Leidenschaften zu widerstehen und Jesu persönliche Unterweisung an Thomas zu verstehen.
      date: Oft auf das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert, möglicherweise in einem syrisch-christlichen Umfeld; erhalten in einer koptischen Handschrift aus dem 4. Jahrhundert.
    Tripartite Tractate:
      display_name: Dreiteilige Abhandlung
      author: Anonym. Der Verfasser war ein hochgebildeter valentinianischer christlicher Theologe; eine sichere Gleichsetzung mit einem namentlich bekannten Lehrer ist nicht möglich.
      audience: Eine valentinianische christliche Gemeinschaft, die ausführliche Unterweisung über Gott, die Äonen, die Schöpfung, Christus, die Kirche, die Erlösung und die endgültige Wiederherstellung erhielt.
      date: Gewöhnlich auf das 3. Jahrhundert n. Chr. datiert, wobei einige Argumente für dessen zweite Hälfte sprechen; im Jung-Kodex aus dem 4. Jahrhundert auf Koptisch erhalten.
    Apocryphon of John:
      display_name: Apokryphon des Johannes
      author: Anonym. Das Werk gibt sich pseudonym als Offenbarung des auferstandenen Jesus an Johannes, den Sohn des Zebedäus, aus und ist in mehr als einer antiken Fassung erhalten.
      audience: Christinnen und Christen in einer sethianischen oder eng verwandten Offenbarungstradition, die nach einer Darstellung der göttlichen Welt, der Schöpfung, der menschlichen Identität und der Befreiung von feindlichen Herrschern suchten.
      date: Eine frühe Form war wahrscheinlich bereits im 2. Jahrhundert n. Chr. im Umlauf; die erhaltenen koptischen Textzeugen, die kürzere und längere Fassungen überliefern, stammen aus dem 4. und 5. Jahrhundert.
