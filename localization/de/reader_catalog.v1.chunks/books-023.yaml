review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und korrigiert. Einige Kapitelüberschriften wurden enger an die kanonische Aussage angepasst; Metadaten sind sachlich und vollständig lokalisiert.
  issues:
  - 'Gospel of Mary 1: ''against sin'' wurde ohne zusätzliche Deutung als ''gegen die Sünde'' wiedergegeben.'
  - 'Gospel of Mary 3: Der unklare Bezug von ''Teachings'' wurde nicht durch ''seinen'' ergänzt.'
  - 'Dialogue of the Savior 3 und 14: Imperativ und Bedeutung der englischen Titel präzisiert.'
  - 'Book of Thomas the Contender 1: Die Lehren sind Thomas zugeschrieben, nicht an Thomas gerichtet.'
  - 'Tripartite Tractate 23: Die Visionen wurden ausdrücklich den Propheten zugeordnet.'
