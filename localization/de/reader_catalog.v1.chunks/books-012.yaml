review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und überarbeitet. Korrigiert wurden einzelne ungenaue, missverständliche oder stilistisch fehlerhafte Titel sowie die zu spezifische Einordnung der Epheserleserschaft.
  issues:
  - '1 Corinthians 9: „frei sein Apostelamt“ war grammatisch fehlerhaft und gab „freely“ nicht zuverlässig wieder.'
  - 'Ephesians metadata audience: „römische Provinz“ war eine nicht im Ausgangstext enthaltene Spezifizierung.'
  - '2 Thessalonians 2: „Aufruhr“ ist für „rebellion“ weniger treffend als „Abfall“; die Formulierung wurde näher am Ausgangstext gehalten.'
  - '1 Timothy 3: Die vorherige Fassung verschob den Fokus von den Eigenschaften der Leitenden auf das Festhalten an Anforderungen.'
  - '2 Timothy 4: „das Wort“ war eine nicht ausdrücklich im Titel genannte Ergänzung.'
