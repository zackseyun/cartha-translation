    Isaiah:
      display_name: Jesaja
      author: Mehrere Verfasser über Jahrhunderte hinweg; die Kapitel 1–39 haben ihre Wurzeln bei Jesaja von Jerusalem im 8. Jahrhundert, während 40–55 („Zweiter Jesaja“) und 56–66 („Dritter Jesaja“) auf Exil und Rückkehr eingehen.
      audience: 'Nacheinander: Juda unter assyrischer Bedrohung, im babylonischen Exil und während der Wiederherstellung nach dem Exil.'
      date: Entstanden etwa vom späten 8. bis zum 5. Jahrhundert v. Chr.
    Jeremiah:
      display_name: Jeremia
      author: Jeremia aus Anatot; in erheblichem Umfang von seinem Schreiber Baruch und späteren Bearbeitern redigiert.
      audience: Juda unmittelbar vor, während und nach der babylonischen Eroberung.
      date: Spätes 7. bis frühes 6. Jahrhundert v. Chr.
