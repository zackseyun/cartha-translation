  verdict: revise
  review_summary: 'Vollständige deutsche Lokalisierung geprüft und korrigiert. Zwei Titel wurden präzisiert: Jesaja 3 wahrt den Bezug auf die Nation, und Jesaja 65 den Plural „Himmel“.'
  issues:
  - 'Jesaja 3: „Nation“ war ungenau als „Land“ wiedergegeben.'
  - 'Jesaja 65: „New Heavens“ verlangt im Deutschen den Plural „Neue Himmel“.'
