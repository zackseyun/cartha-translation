      display_name: Briefe des Ignatius
      author: Ignatius, Bischof von Antiochia, für die sieben Briefe der allgemein anerkannten mittleren Rezension; später erweiterte und pseudonyme Ignatiusbriefe gehören nicht zu dieser Sammlung.
      audience: Christliche Gemeinden in Ephesus, Magnesia, Tralles, Rom, Philadelphia und Smyrna sowie Polykarp, an die Ignatius sich auf seiner Reise zum Martyrium wandte.
      date: Gewöhnlich auf den Anfang des 2. Jahrhunderts n. Chr. datiert, häufig auf etwa 105–117 n. Chr.; die genaue zeitliche Abfolge von Ignatius’ Reise ist jedoch weiterhin umstritten.
