review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und korrigiert. Die Autorenangabe vermeidet eine über das Englische hinausgehende Verfasserbehauptung; Datierung und Titel 62 wurden präzisiert.
  issues:
  - Die Formulierung „gilt als Verfasser“ stellte die Autorschaft stärker dar als die kanonische Metadatenangabe.
  - Titel 62 deutete die gegenwärtige passive Aussage „Church Shepherded“ als zukünftigen Erhalt eines Hirten um.
  - Die Jahresangabe 105–117 wurde zur Klarheit mit „n. Chr.“ ergänzt.
