      author: Ignatius, Bischof von Antiochia, gilt als Verfasser der sieben Briefe der allgemein anerkannten mittleren Rezension; spätere erweiterte und pseudonyme Ignatiusbriefe gehören nicht zu dieser Sammlung.
      audience: Christliche Gemeinden in Ephesus, Magnesia, Tralles, Rom, Philadelphia und Smyrna sowie Polykarp, an die sich Ignatius auf seinem Weg zum Martyrium wandte.
      date: Gewöhnlich auf den Beginn des 2. Jahrhunderts n. Chr. datiert, häufig auf etwa 105–117; die genaue zeitliche Abfolge der Reise des Ignatius ist jedoch weiterhin umstritten.
