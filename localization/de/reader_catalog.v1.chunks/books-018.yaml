  book_metadata:
    2 Esdras:
      display_name: 2. Esdras
      author: Anonym; ein ursprünglich jüdischer Kern (4. Esra, Kapitel 3–14) wurde von christlichen Bearbeitern mit einem Rahmen versehen.
      audience: Jüdinnen und Juden nach 70 n. Chr., die um die Frage der Theodizee rangen; später für christliche Leserinnen und Leser erweitert.
      date: Jüdischer Kern um 100 n. Chr.; christliche Ergänzungen etwa aus dem 2.–3. Jahrhundert n. Chr.
    Didache:
      display_name: Didache
      author: Anonym (der Titel bedeutet „Lehre der zwölf Apostel“).
      audience: Frühe christliche Gemeinden – eine kurze Anleitung zu ethischem Verhalten, Taufe, Eucharistie und Wanderlehrern.
      date: Etwa Ende des 1. bis Anfang des 2. Jahrhunderts n. Chr.
    Gospel of Thomas:
      display_name: Thomasevangelium
      author: Anonym; der Textanfang schreibt die Spruchsammlung „Didymos Judas Thomas“ zu. Vollständig erhalten ist sie nur in einer koptischen Übersetzung aus dem 4. Jahrhundert aus Nag Hammadi (NHC II,2); hinzu kommen drei griechische Fragmente aus Oxyrhynchos.
      audience: Eine christliche Leserschaft, die von syrischer Weisheitstradition und protognostischem Denken geprägt war und in den Worten Jesu nach esoterischer Selbsterkenntnis suchte.
      date: Das griechische Original entstand wahrscheinlich etwa 50–140 n. Chr.; die koptische Handschrift um 340 n. Chr.
      summary: Das Thomasevangelium ist eine Sammlung von Aussprüchen, die Jesus zugeschrieben werden. Es enthält keine fortlaufende Erzählung und fordert die Lesenden wiederholt dazu auf, die Bedeutung der Aussprüche zu entdecken.
