review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und korrigiert. Insbesondere wurden eine zusätzliche Fundbehauptung im Thomasevangelium-Metadatensatz sowie eine nicht durch die Vorlage gedeckte Schreibanweisung in 2. Esdras 14 entfernt.
  issues:
  - 'Gospel of Thomas author: „die in Nag Hammadi gefunden wurde“ ergänzte gegenüber der Quelle eine nicht erforderliche Fundbehauptung.'
  - '2 Esdras 14: „aufzuschreiben“ war eine nicht durch den kanonischen Titel gedeckte Ergänzung.'
