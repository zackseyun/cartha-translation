  book_metadata:
    2 Esdras:
      display_name: 2. Esdras
      author: Anonym; ein christlich bearbeiteter Rahmen umgibt einen ursprünglich jüdischen Kern (4. Esra, Kapitel 3–14).
      audience: Juden nach 70 n. Chr., die mit der Frage nach Gottes Gerechtigkeit angesichts des Leids rangen; später für christliche Leser erweitert.
      date: Jüdischer Kern vermutlich um 100 n. Chr.; christliche Ergänzungen vermutlich im 2.–3. Jahrhundert n. Chr.
    Didache:
      display_name: Didache
      author: Anonym (der Titel bedeutet „Lehre der zwölf Apostel“).
      audience: Frühe christliche Gemeinden – eine kurze Anleitung zu ethischem Verhalten, Taufe, Eucharistie und Wanderlehrern.
      date: Vermutlich spätes 1. bis frühes 2. Jahrhundert n. Chr.
    Gospel of Thomas:
      display_name: Thomasevangelium
      author: Anonym; die einleitenden Worte schreiben die Spruchsammlung „Didymos Judas Thomas“ zu. Vollständig erhalten ist sie nur in einer koptischen Übersetzung aus dem 4. Jahrhundert aus Nag Hammadi (NHC II,2), hinzu kommen drei griechische Fragmente aus Oxyrhynchos.
      audience: Eine christliche Leserschaft, geprägt von syrischer Weisheit und frühgnostischem Gedankengut und ausgerichtet auf esoterische Selbsterkenntnis in den Aussprüchen Jesu.
      date: Griechisches Original vermutlich um 50–140 n. Chr.; koptische Handschrift vermutlich um 340 n. Chr.
      summary: Das Thomasevangelium ist eine Sammlung von Aussprüchen, die Jesus zugeschrieben werden. Es enthält keine fortlaufende Handlung und fordert die Leser wiederholt dazu auf, die Bedeutung der Aussprüche zu entdecken.
