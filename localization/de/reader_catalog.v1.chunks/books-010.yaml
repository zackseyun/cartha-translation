payload:
  book_metadata:
    Joel:
      display_name: Joel
      author: Joel, Sohn Petuëls.
      audience: Das nachexilische Juda, das auf eine Heuschreckenplage als Zeichen des Tages des HERRN reagiert.
      date: Wahrscheinlich etwa 5.–4. Jahrhundert v. Chr.
    Amos:
      display_name: Amos
      author: Amos aus Tekoa, ein judäischer Hirte, der im Nordreich predigte.
      audience: Das Nordreich Israel während einer Zeit des Wohlstands und der Ungerechtigkeit unter Jerobeam II.
      date: Etwa 760–750 v. Chr.
    Obadiah:
      display_name: Obadja
      author: Obadja.
      audience: Juda, nachdem Edom Jerusalem verraten hatte – eine Prophezeiung über Edoms Untergang.
      date: Kurz nach 586 v. Chr.
    Jonah:
      display_name: Jona
      author: Anonym; die Hauptfigur ist Jona, Sohn Amittais.
      audience: Das nachexilische Israel – eine satirische Kritik an ethnischer Abschottung und eine Bekräftigung der Barmherzigkeit Gottes gegenüber Außenstehenden.
      date: Wahrscheinlich etwa 5.–4. Jahrhundert v. Chr.
    Micah:
      display_name: Micha
      author: Micha aus Moreschet.
      audience: Juda im späten 8. Jahrhundert v. Chr., besonders die arme Landbevölkerung im Gegensatz zu den städtischen Eliten.
      date: Etwa 740–700 v. Chr.
    Nahum:
      display_name: Nahum
      author: Nahum aus Elkosch.
      audience: Juda, das den bevorstehenden Fall Ninives feiert.
      date: Kurz vor 612 v. Chr.
    Habakkuk:
      display_name: Habakuk
      author: Habakuk.
      audience: Juda angesichts des Aufstiegs Babylons – der Dialog eines Propheten mit Gott über Gerechtigkeit.
      date: Etwa spätes 7. Jahrhundert v. Chr.
    Zephaniah:
      display_name: Zefanja
      author: Zefanja, Sohn Kuschis.
      audience: Juda unter Joschija, unmittelbar vor seinen Reformen.
      date: Etwa 640–609 v. Chr.
    Haggai:
      display_name: Haggai
      author: Haggai.
      audience: Die Heimgekehrten, die unter Darius den Tempel wiederaufbauten.
      date: 520 v. Chr.
    Zechariah:
      display_name: Sacharja
      author: Sacharja, Sohn Berechjas; die Kapitel 9–14 stammen wahrscheinlich von späterer Hand.
      audience: Die Heimgekehrten, die den Tempel wiederaufbauten, sowie spätere nachexilische Gemeinschaften.
      date: Kapitel 1–8 etwa 520–518 v. Chr.; 9–14 möglicherweise ein Jahrhundert später.
    Malachi:
      display_name: Maleachi
      author: Anonym; „Maleachi“ bedeutet „mein Bote“.
      audience: Das nachexilische Juda, das unter persischer Herrschaft in Gottesdienst und Treue nachlässig wurde.
      date: Etwa Mitte des 5. Jahrhunderts v. Chr.
    Matthew:
      display_name: Matthäus
      author: Anonym; die Tradition schreibt das Werk dem Apostel Matthäus zu. Die moderne Forschung geht von einem griechischsprachigen judenchristlichen Autor aus, der Markus und eine Q-ähnliche Quelle heranzog.
      audience: Eine judenchristliche Gemeinschaft, die um Kontinuität und Diskontinuität gegenüber dem synagogalen Judentum rang.
      date: Etwa 80–90 n. Chr.
    Mark:
      display_name: Markus
      author: Anonym; die Tradition bringt das Werk mit Johannes Markus, einem Reisegefährten des Petrus, in Verbindung.
      audience: Eine griechischsprachige christliche Gemeinschaft, möglicherweise in Rom, unter oder nahe der Bedrohung durch Verfolgung.
      date: Etwa 65–75 n. Chr., zur Zeit des Jüdischen Krieges und der Zerstörung des Tempels.
