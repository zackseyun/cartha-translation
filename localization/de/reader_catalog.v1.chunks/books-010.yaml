review:
  verdict: revise
  review_summary: Vollständige deutsche Fassung geprüft und direkt korrigiert. Korrigiert wurden einzelne sachliche bzw. semantische Abweichungen, insbesondere die nicht belegte Aussage tatsächlicher Verfolgung bei Markus sowie mehrere Kapitelüberschriften.
  issues:
  - 'Markus: Die Zielgruppenangabe wurde von einer Aussage tatsächlicher Verfolgung auf die vorsichtigere Quellenaussage einer möglichen bzw. drohenden Verfolgung zurückgeführt.'
  - 'Sacharja 3 und 6: „Joshua“ wurde als „Josua“ wiedergegeben.'
  - Micha 5, Sacharja 10 sowie Matthäus 1 und 17 wurden enger an den jeweiligen Quellsinn angeglichen.
