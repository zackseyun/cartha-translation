payload:
  book_metadata:
    Joel:
      display_name: Joel
      author: Joel ben Pethuel.
      audience: Das nachexilische Juda, das auf eine Heuschreckenplage als Zeichen des Tages des HERRN reagiert.
      date: Wahrscheinlich ca. 5.–4. Jahrhundert v. Chr.
    Amos:
      display_name: Amos
      author: Amos aus Tekoa, ein judäischer Hirte, der im Nordreich predigte.
      audience: Das Nordreich Israel während einer Zeit des Wohlstands und der Ungerechtigkeit unter Jerobeam II.
      date: Ca. 760–750 v. Chr.
    Obadiah:
      display_name: Obadja
      author: Obadja.
      audience: Juda, nachdem Edom Jerusalem verraten hatte – eine Prophezeiung über Edoms Untergang.
      date: Kurz nach 586 v. Chr.
    Jonah:
      display_name: Jona
      author: Anonym; die Hauptfigur ist Jona ben Amittai.
      audience: Das nachexilische Israel – eine satirische Zurechtweisung ethnischer Abschottung und eine Bekräftigung von Gottes Barmherzigkeit gegenüber Außenstehenden.
      date: Wahrscheinlich ca. 5.–4. Jahrhundert v. Chr.
    Micah:
      display_name: Micha
      author: Micha aus Moreschet.
      audience: Juda im späten 8. Jahrhundert v. Chr., besonders die arme Landbevölkerung im Gegensatz zu den städtischen Eliten.
      date: Ca. 740–700 v. Chr.
    Nahum:
      display_name: Nahum
      author: Nahum aus Elkosch.
      audience: Juda, das den bevorstehenden Fall Ninives feiert.
      date: Kurz vor 612 v. Chr.
    Habakkuk:
      display_name: Habakuk
      author: Habakuk.
      audience: Juda angesichts des Aufstiegs Babylons – der Dialog eines Propheten mit Gott über Gerechtigkeit.
      date: Ca. spätes 7. Jahrhundert v. Chr.
    Zephaniah:
      display_name: Zefanja
      author: Zefanja ben Kuschi.
      audience: Juda unter Josia, unmittelbar vor seinen Reformen.
      date: Ca. 640–609 v. Chr.
    Haggai:
      display_name: Haggai
      author: Haggai.
      audience: Die Heimgekehrten, die unter Darius den Tempel wieder aufbauten.
      date: 520 v. Chr.
    Zechariah:
      display_name: Sacharja
      author: Sacharja ben Berechja; die Kapitel 9–14 stammen wahrscheinlich von einer späteren Hand.
      audience: Die Heimgekehrten, die den Tempel wieder aufbauten, sowie spätere nachexilische Gemeinschaften.
      date: Kapitel 1–8 ca. 520–518 v. Chr.; 9–14 vielleicht ein Jahrhundert später.
    Malachi:
      display_name: Maleachi
      author: Anonym; „Maleachi“ bedeutet „mein Bote“.
      audience: Das nachexilische Juda, das unter persischer Herrschaft in Gottesdienst und Treue nachlässig wurde.
      date: Ca. Mitte des 5. Jahrhunderts v. Chr.
    Matthew:
      display_name: Matthäus
      author: Anonym; die Tradition schreibt das Evangelium dem Apostel Matthäus zu. Die moderne Forschung geht von einem griechischsprachigen judenchristlichen Autor aus, der sich auf Markus und eine Q-ähnliche Quelle stützte.
      audience: Eine judenchristliche Gemeinschaft, die um Kontinuität und Brüche gegenüber dem synagogalen Judentum rang.
      date: Ca. 80–90 n. Chr.
    Mark:
      display_name: Markus
      author: Anonym; die Tradition bringt das Evangelium mit Johannes Markus in Verbindung, einem Reisegefährten des Petrus.
      audience: Eine griechischsprachige christliche Gemeinschaft, möglicherweise in Rom, die verfolgt wurde oder von Verfolgung bedroht war.
      date: Ca. 65–75 n. Chr., zur Zeit des Jüdischen Krieges und der Zerstörung des Tempels.
