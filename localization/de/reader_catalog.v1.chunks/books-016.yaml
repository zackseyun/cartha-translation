  - '1 Hen 48: Das ergänzte Objekt „alle“ wurde durch die allgemeinere, idiomatische Fassung „alles“ ersetzt.'
  - '1 Hen 55 und 62: Unpräzise bzw. schwerfällige Formulierungen wurden korrigiert.'
