  book_metadata:
    Sirach:
      display_name: Jesus Sirach
      author: Jeschua ben Eleasar ben Sira aus Jerusalem; griechische Übersetzung durch seinen Enkel.
      audience: Junge jüdische Männer, die im Jerusalem der hellenistischen Zeit in Weisheit unterwiesen wurden.
      date: Hebräisches Original ca. 195–175 v. Chr.; griechische Übersetzung ca. 132 v. Chr.
    Baruch:
      display_name: Baruch
      author: Anonym; Baruch, dem Schreiber Jeremias, pseudonym zugeschrieben.
      audience: Juden in der Diaspora, die über Exil, Umkehr und Weisheit nachdachten.
      date: Ca. 2. Jahrhundert v. Chr.
    1 Maccabees:
      display_name: 1. Makkabäer
      author: Anonym, wahrscheinlich ein Autor aus Jerusalem, der auf Hebräisch schrieb (überliefert ist nur die griechische Fassung).
      audience: Juden während und nach dem Aufstand der Makkabäer; das Werk schildert die Legitimität der hasmonäischen Dynastie.
      date: Ca. 100 v. Chr.
    2 Maccabees:
      display_name: 2. Makkabäer
      author: Ein anonymer Bearbeiter, der ein längeres Werk von Jason von Kyrene zusammenfasste; auf Griechisch verfasst.
      audience: Griechischsprachige Juden in der Diaspora – mit besonderer Betonung von Martyrium, Vorsehung und Auferstehung.
      date: Ca. 124 v. Chr. oder kurz danach.
