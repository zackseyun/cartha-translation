review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und direkt korrigiert. Wesentliche Korrekturen betreffen die pseudonyme Zuschreibung bei Baruch sowie einige Titel, deren Entwurf die Aussage oder Form der englischen Vorlage verschob.
  issues:
  - 'Baruch, Metadaten Autor: Die pseudonyme Zuschreibung wurde sprachlich eindeutig und ohne inhaltliche Verschiebung formuliert.'
  - 'Sirach 47: Der Entwurf fügte hinzu, Natan habe David zur Rede gestellt; die Vorlage sagt nur, dass David Natan entgegentritt.'
  - 'Sirach 48: Der Entwurf machte aus Elija und seinem Prophezeien zusätzlich mehrere Propheten; dies wurde korrigiert.'
  - 'Baruch 5: Der Aufforderungssatz im Entwurf wurde in eine der Vorlage entsprechende Aussage über Jerusalem zurückgeführt.'
  - '2 Makkabäer 7: Die Formulierung wurde näher an „faithful“ angepasst, ohne eine zusätzliche konfessionelle Deutung einzuführen.'
