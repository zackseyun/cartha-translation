    Sirach:
      display_name: Sirach
      author: Jeschua ben Eleasar ben Sira aus Jerusalem; die griechische Übersetzung stammt von seinem Enkel.
      audience: Junge jüdische Männer, die im Jerusalem der hellenistischen Zeit in Weisheit unterwiesen wurden.
      date: Hebräisches Original ca. 195–175 v. Chr.; griechische Übersetzung ca. 132 v. Chr.
    Baruch:
      display_name: Baruch
      author: Anonym; pseudonym Baruch, dem Schreiber Jeremias, zugeschrieben.
      audience: Juden in der Diaspora, die über Exil, Umkehr und Weisheit nachdachten.
      date: Ca. 2. Jahrhundert v. Chr.
    1 Maccabees:
      display_name: 1. Makkabäer
      author: Anonym, vermutlich von einem Jerusalemer Verfasser auf Hebräisch geschrieben (erhalten ist nur die griechische Fassung).
      audience: Juden während und nach dem Aufstand der Hasmonäer; das Werk schildert die Rechtmäßigkeit der hasmonäischen Dynastie.
      date: Ca. 100 v. Chr.
    2 Maccabees:
      display_name: 2. Makkabäer
      author: Ein anonymer Bearbeiter, der ein längeres Werk Jasons von Kyrene zusammenfasste; auf Griechisch verfasst.
      audience: Griechischsprachige Juden in der Diaspora – mit besonderem Gewicht auf Martyrium, Vorsehung und Auferstehung.
      date: Ca. 124 v. Chr. oder kurz danach.
