      author: Anonym; die Überlieferung schreibt das Buch Jeremia zu.
      audience: Menschen aus Juda, die um die Zerstörung Jerusalems im Jahr 586 v. Chr. trauerten.
      date: Bald nach 586 v. Chr.
    Ezekiel:
      display_name: Ezechiel
      author: Ezechiel, ein nach Babylonien verschleppter Priester; das Buch wurde redaktionell weiterentwickelt.
      audience: Verschleppte aus Juda in Babylonien, die Gottes Gegenwart unabhängig vom Tempel neu zu verstehen suchten.
      date: Ca. 593–571 v. Chr. für das Wirken des Propheten; die Endfassung entstand etwas später.
    Daniel:
      display_name: Daniel
      author: Anonym; das Buch stellt sich als Werk Daniels aus der Zeit des Exils dar.
      audience: Juden unter hellenistischer Verfolgung – besonders unter Antiochos IV. Epiphanes (167–164 v. Chr.).
      date: Erhielt seine überlieferte Fassung ca. 165 v. Chr.; Kapitel 1–6 enthalten ältere Hoferzählungen.
    Hosea:
      display_name: Hosea
      author: Hosea, Sohn Beeris.
      audience: Das Nordreich Israel in seinen letzten Jahrzehnten vor der Eroberung durch Assyrien.
      date: Ca. 750–722 v. Chr.
