review:
  verdict: revise
  review_summary: Die Übersetzung ist überwiegend treffend. Korrigiert wurden einzelne unnötige Zusätze bzw. Auslassungen sowie unpräzise Formulierungen, insbesondere in den Metadaten und den Kapiteltiteln von Hesekiel 10 und 38 sowie Daniel 3 und Hosea 3.
  issues:
  - 'Ezekiel-Metadaten: redaktionelle Entwicklung neutraler formuliert; die Zielgruppenbeschreibung ohne das hinzugefügte „mussten“ wiedergegeben.'
  - 'Ezekiel 10: „scatters“ als „verstreut“ statt „verteilt“ übersetzt.'
  - 'Ezekiel 38: den quelltextlichen Gedanken der Verteidigung des heiligen Landes ohne den nicht ausdrücklich genannten Zusatz „Gott schützt sein heiliges Volk“ wiedergegeben.'
  - 'Daniel 3: Der im englischen Titel nicht genannte Feuerofen wurde entfernt.'
  - 'Hosea 3: „again“ als „erneut“ ergänzt.'
