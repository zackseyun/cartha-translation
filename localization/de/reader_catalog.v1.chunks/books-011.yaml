    Luke:
      display_name: Lukas
      author: Anonym; der Überlieferung nach wird das Werk Lukas zugeschrieben, einem Reisebegleiter des Paulus.
      audience: Eine gebildete griechisch-römische christliche Leserschaft, gerichtet an „Theophilus“.
      date: ca. 80–90 n. Chr.
    John:
      display_name: Johannes
      author: Anonym; der Überlieferung nach wird das Werk dem Apostel Johannes oder dem „geliebten Jünger“ zugeschrieben.
      audience: Eine christliche Gemeinschaft in Spannung mit dem synagogalen Judentum, die sich um das Zeugnis des geliebten Jüngers gebildet hatte.
      date: ca. 90–110 n. Chr.
      summary: Johannes stellt Jesus als das ewige Wort dar, das den Vater offenbart, durch Vertrauen auf ihn Leben schenkt und durch seine Zeichen, seinen Tod und seine Auferstehung verherrlicht wird.
