review:
  verdict: revise
  review_summary: Die Lokalisierung ist vollständig und überwiegend quellentreu. Einzelne Titel wurden für eine präzisere bzw. idiomatischere Wiedergabe korrigiert, insbesondere eine unbegründete Konkretisierung bei „Site“ sowie die Wiedergabe von „Heifer“ und „Baby Joseph“.
  issues:
  - 'Infancy Gospel of Thomas 18: „Unglücksstelle“ konkretisiert das neutrale „Site“ unbegründet.'
  - 'Infancy Gospel of Thomas 17: „Baby Joseph“ wird klarer als „Säugling Josef“ wiedergegeben.'
  - 'Acts of Paul and Thecla 11: Die ursprüngliche Formulierung machte Theklas Schleier zu einem bloßen Attribut; der Titel nennt Thekla und ihren Schleier.'
  - 'Epistle of Barnabas 8: „Heifer“ wird präziser als „Färse“ übersetzt.'
