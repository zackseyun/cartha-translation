review:
  verdict: revise
  review_summary: Vollständige, überwiegend treffende deutsche Lokalisierung. Drei Titel wurden für engere Quellentreue präzisiert.
  issues:
  - 'Infancy Gospel of Thomas 18: „Unglücksort“ fügte einen im englischen Titel nicht genannten Unfall hinzu; neutral übersetzt.'
  - 'Acts of Paul and Thecla 11: Die Rettung betrifft Theklas Schleier, nicht Thekla und ihren Schleier als zwei Objekte.'
  - 'Epistle of Barnabas 8: „Färse“ ist die genauere Übersetzung von „heifer“.'
