  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Kindheitsevangelium des Thomas
      author: Anonym. Die früheste rekonstruierbare Fassung nennt keinen Verfasser; die Zuschreibung an Thomas geht auf spätere Handschriftentitel und die Überlieferung zurück.
      audience: Christen, die mehr über die Kindheit Jesu erfahren wollten und darüber, wie sich göttliche Macht, Erziehung, Lernen und Heranreifen vor dem Beginn der Berichte der kanonischen Evangelien darstellen ließen.
      date: Wird meist auf das 2. Jahrhundert n. Chr. zurückgeführt; der Text ist jedoch in mehreren erheblich voneinander abweichenden griechischen Fassungen und frühen Übersetzungen überliefert.
    Acts of Paul and Thecla:
      display_name: Akten des Paulus und der Thekla
      author: Anonym. Das Werk ist eine Episode aus den umfangreicheren Paulusakten; ein antiker Bericht, wonach ein Presbyter die Akten verfasst habe, erlaubt keine sichere Identifizierung des Verfassers.
      audience: Christen, die sich für Erzählungen über apostolische Verkündigung, Ehelosigkeit, Taufe, märtyrerähnliche Standhaftigkeit und die Vollmacht einer Frau zu lehren und Zeugnis abzulegen interessierten.
      date: Im 2. Jahrhundert n. Chr. verfasst, wahrscheinlich in dessen zweiter Hälfte; das Werk war sowohl als Teil der Paulusakten als auch eigenständig im Umlauf.
    Gospel of Peter:
      display_name: Petrusevangelium
      author: Anonym. Die erhaltene Erzählung spricht aus der Perspektive des Petrus und wurde unter seinem Namen überliefert, gilt aber nicht als Werk des historischen Apostels.
      audience: Frühe Christen, die sich für eine erweiterte Erzählung von Passion und Auferstehung interessierten, wahrscheinlich in Gemeinschaften, in denen die Autorität des Petrus besonderes Gewicht hatte.
      date: Wird meist in das 2. Jahrhundert n. Chr. datiert; das wichtigste erhaltene griechische Fragment stammt aus einer wesentlich späteren Handschrift, die in Achmim gefunden wurde.
    2 Clement:
      display_name: 2. Clemensbrief
      author: Anonym. Trotz des traditionellen Titels handelt es sich um eine frühchristliche Predigt und nicht um einen zweiten Brief des Clemens von Rom.
      audience: Eine christliche Gemeinde, die zu Umkehr, moralischer Beständigkeit, Fürsorge für Schutzbedürftige und treuem Ausharren in der Hoffnung auf Auferstehung und Gericht aufgerufen wird.
      date: Wird meist in die erste Hälfte oder die Mitte des 2. Jahrhunderts n. Chr. datiert (etwa 100–160); der Abfassungsort ist ungewiss.
    Epistle of Barnabas:
      display_name: Barnabasbrief
      author: Anonym. Das Werk wurde traditionell mit Barnabas, dem Gefährten des Paulus, in Verbindung gebracht; die moderne Forschung akzeptiert diese Zuschreibung jedoch nicht.
      audience: Nichtjüdische Christen, die angeleitet wurden, Israels Schriften christologisch und allegorisch auszulegen und zugleich ihre Bundesidentität von der jüdischen Praxis abzugrenzen.
      date: Wird gewöhnlich in die Zeit zwischen der Zerstörung des Jerusalemer Tempels im Jahr 70 n. Chr. und dem frühen 2. Jahrhundert datiert, häufig etwa auf 80–130.
