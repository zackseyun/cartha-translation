  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Kindheitsevangelium nach Thomas
      author: Anonym. Die früheste rekonstruierbare Fassung nennt keinen Verfasser; die Zuschreibung an Thomas geht auf spätere Handschriftentitel und die Überlieferung zurück.
      audience: Christinnen und Christen, die sich für Jesu Kindheit interessierten und dafür, wie sich göttliche Macht, Erziehung, Lernen und Heranreifen vor dem Beginn der Berichte in den kanonischen Evangelien erzählen ließen.
      date: Das Werk wird gewöhnlich auf das 2. Jahrhundert n. Chr. zurückgeführt, ist jedoch in mehreren deutlich voneinander abweichenden griechischen Textfassungen und frühen Übersetzungen überliefert.
    Acts of Paul and Thecla:
      display_name: Akten des Paulus und der Thekla
      author: Anonym. Das Werk ist eine Episode aus den umfangreicheren Paulusakten; eine antike Mitteilung, wonach ein Presbyter die Akten verfasst habe, erlaubt keine sichere Bestimmung des Verfassers.
      audience: Christinnen und Christen, die sich von Erzählungen über apostolische Verkündigung, Ehelosigkeit, Taufe, standhaftes Ertragen nach Art von Märtyrern sowie über die Vollmacht einer Frau zu lehren und Zeugnis abzulegen angesprochen fühlten.
      date: Im 2. Jahrhundert n. Chr. verfasst, wahrscheinlich in dessen zweiter Hälfte; das Werk war sowohl als Teil der Paulusakten als auch als eigenständige Schrift im Umlauf.
    Gospel of Peter:
      display_name: Petrusevangelium
      author: Anonym. Die erhaltene Erzählung spricht mit der Stimme des Petrus und wurde unter seinem Namen überliefert, gilt jedoch nicht als Werk des historischen Apostels.
      audience: Frühe Christinnen und Christen, die sich für eine erweiterte Erzählung von Passion und Auferstehung interessierten, wahrscheinlich in Gemeinschaften, in denen die Autorität des Petrus besonderes Gewicht hatte.
      date: Gewöhnlich in das 2. Jahrhundert n. Chr. datiert; das wichtigste erhaltene griechische Fragment stammt aus einer erheblich späteren Handschrift, die in Achmim gefunden wurde.
    2 Clement:
      display_name: 2. Clemensbrief
      author: Anonym. Entgegen seinem traditionellen Titel handelt es sich um eine frühchristliche Predigt und nicht um einen zweiten Brief des Clemens von Rom.
      audience: Eine christliche Versammlung, die zu Umkehr, einem konsequenten sittlichen Leben, zur Fürsorge für Schutzbedürftige und zu treuem Ausharren in der Hoffnung auf Auferstehung und Gericht aufgerufen wird.
      date: Gewöhnlich in die erste Hälfte oder die Mitte des 2. Jahrhunderts n. Chr. datiert (etwa 100–160); der Abfassungsort ist ungewiss.
    Epistle of Barnabas:
      display_name: Barnabasbrief
      author: Anonym. Das Werk wurde traditionell mit Barnabas, dem Gefährten des Paulus, in Verbindung gebracht, doch die heutige Forschung erkennt diese Zuschreibung nicht an.
      audience: Nichtjüdische Christinnen und Christen, die dazu angeleitet werden, Israels Schriften christologisch und allegorisch auszulegen und für sich in Anspruch zu nehmen, während sie ihre eigene Bundesidentität von jüdischer Praxis abgrenzen.
      date: Gewöhnlich in die Zeit zwischen der Zerstörung des Jerusalemer Tempels im Jahr 70 n. Chr. und dem frühen 2. Jahrhundert datiert, häufig etwa auf 80–130.
