  book_metadata:
    Polycarp to the Philippians:
      display_name: Polykarp an die Philipper
      author: Polykarp, Bischof von Smyrna. Einige Fachleute verstehen den überlieferten Text als Zusammenfügung von Material, das zu mehr als einem Zeitpunkt versandt wurde.
      audience: Die christliche Gemeinde in Philippi, die um die Briefe des Ignatius gebeten hatte und Ratschläge zu Glauben, Lebensführung, Gemeindeleitung, Geld und standhaftem Ausharren erhielt.
      date: Frühes bis mittleres 2. Jahrhundert n. Chr.; zumindest ein Teil steht in engem Zusammenhang mit der Reise des Ignatius, während Annahmen eines zusammengesetzten Briefes einen etwas späteren Abschnitt für möglich halten.
    Martyrdom of Polycarp:
      display_name: Martyrium des Polykarp
      author: Anonyme Mitglieder der Gemeinde in Smyrna, die im Namen der Gemeinschaft schrieben; die abschließenden Überlieferungsvermerke gehen auf spätere Abschriften und Weiterverbreitung zurück.
      audience: Die Gemeinde in Philomelium und die weitere christliche Gemeinschaft, denen ein Bericht über Polykarps Verhaftung, Verhör, Tod und beispielhaftes Ausharren vorgelegt wird.
      date: Nach Polykarps Tod verfasst, gewöhnlich in die Mitte oder die zweite Hälfte des 2. Jahrhunderts n. Chr. datiert; sowohl das genaue Jahr des Martyriums als auch die endgültige Gestalt des Dokuments sind umstritten.
    Epistle to Diognetus:
      display_name: Brief an Diognet
      author: Anonym. Der Verfasser bezeichnet sich als Jünger oder Lernenden, doch weder er noch der angesprochene Diognet lassen sich sicher identifizieren.
      audience: Ein gebildeter nichtchristlicher Fragesteller – und Leser wie er –, der Fragen zum christlichen Gottesdienst, zur Ethik, zur gesellschaftlichen Identität, zur Liebe und zur scheinbaren Neuheit des Glaubens stellt.
      date: Häufig auf das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert, wobei die Vorschläge stark auseinandergehen; die letzten beiden Kapitel könnten aus einem anderen Werk stammen.
    Fragments of Papias:
      display_name: Fragmente des Papias
      author: Papias, Bischof von Hierapolis, als Verfasser der verlorenen fünf Bücher Auslegungen der Worte des Herrn; die erhaltene Sammlung besteht aus Zitaten und Berichten, die von späteren Autoren bewahrt wurden.
      audience: Frühe Christen, die nach überlieferten Lehren über Jesus und die Apostel suchten; diese wurden durch namentlich benannte Ketten mündlicher Zeugnisse und Auslegungen zusammengetragen.
      date: Das Werk des Papias wird gewöhnlich in das frühe 2. Jahrhundert n. Chr. datiert, oft etwa 110–130; die erhaltenen Fragmente finden sich bei Autoren, die vom 2. Jahrhundert an schrieben.
