review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und direkt korrigiert. Mehrere Formulierungen wurden enger an die englischen Quellenüberschriften und Metadaten angepasst, insbesondere bei „sends mercy“, „refuses to blame Christ“, der Quellenangabe zu Papias sowie der Kapitelüberschrift zur Seele in der Welt.
  issues:
  - 'Martyrdom of Polycarp 1: „erbittet Erbarmen“ veränderte „sends mercy“; als „sendet allen Barmherzigkeit“ korrigiert.'
  - 'Martyrdom of Polycarp 11: „Christus zu verleugnen“ ersetzte die spezifische Aussage „to blame Christ“; als „Christus zu beschuldigen“ korrigiert.'
  - 'Martyrdom of Polycarp 18: Die Formulierung wurde enger an die knappe, im Englischen unspezifische Überschrift angeglichen.'
  - 'Epistle to Diognetus 6: „verborgen“ war nicht durch „lies“ gedeckt; neutral als „in der Welt“ wiedergegeben.'
  - 'Fragments of Papias Metadaten: Die Zuschreibung und die Beschreibung der Überlieferungsketten wurden grammatisch und inhaltlich enger am Ausgangstext formuliert.'
