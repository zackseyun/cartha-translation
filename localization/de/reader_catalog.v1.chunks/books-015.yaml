    1 Esdras:
      display_name: 1. Esdras
      author: Anonym; eine griechische Neubearbeitung, die 2. Chronik 35–36, Esra und Nehemia 7–8 neu anordnet.
      audience: Juden der hellenistischen Zeit, die eine klare Erzählung von Rückkehr und Wiederherstellung suchten.
      date: Ca. 2.–1. Jahrhundert v. Chr.
    Prayer of Manasseh:
      display_name: Gebet Manasses
      author: Anonym; pseudonym König Manasse zugeschrieben.
      audience: Menschen, die Buße tun und sich mit Manasses Umkehr identifizieren — in manchen Traditionen liturgisch verwendet.
      date: Ca. 2.–1. Jahrhundert v. Chr.
    Psalm 151:
      display_name: Psalm 151
      author: Anonym; pseudonym David zugeschrieben. Eine hebräische Fassung ist in 11QPsᵃ belegt.
      audience: Diasporagemeinden und Gemeinschaften von Qumran, die dem Psalter Davids verbunden waren.
      date: Ca. 2. Jahrhundert v. Chr. oder früher.
    3 Maccabees:
      display_name: 3. Makkabäer
      author: Anonym; auf Griechisch verfasst.
      audience: Griechischsprachige Juden in der ägyptischen Diaspora — eine Befreiungserzählung aus der Zeit Ptolemaios’ IV.
      date: Ca. 1. Jahrhundert v. Chr. bis 1. Jahrhundert n. Chr.
    4 Maccabees:
      display_name: 4. Makkabäer
      author: Anonym; ein griechischsprachiger jüdischer Autor, der von der stoischen Philosophie beeinflusst war.
      audience: Hellenistische Juden — eine philosophische Predigt darüber, wie die Vernunft durch Treue die Leidenschaften beherrscht.
      date: Ca. 1. Jahrhundert n. Chr.
    Bel and the Dragon:
      display_name: Bel und der Drache
      author: Anonym; einer der griechischen Zusätze zu Daniel.
      audience: Griechischsprachige Juden — eine spöttische Streitschrift gegen den Götzendienst.
      date: Ca. 2.–1. Jahrhundert v. Chr.
    Letter of Jeremiah:
      display_name: Brief Jeremias
      author: Anonym; pseudonym Jeremia zugeschrieben.
      audience: Juden in der Diaspora, die durch den Götzendienst ihrer Umgebung versucht waren.
      date: Ca. 4.–2. Jahrhundert v. Chr.
    Prayer of Azariah and Song of the Three:
      display_name: Gebet Asarjas und Gesang der drei Männer
      author: Anonym; einer der griechischen Zusätze zu Daniel.
      audience: Griechischsprachige Juden — liturgisches Material zu Daniel 3.
      date: Ca. 2. Jahrhundert v. Chr.
    Susanna:
      display_name: Susanna
      author: Anonym; einer der griechischen Zusätze zu Daniel.
      audience: Griechischsprachige Juden — eine Erzählung über Gerechtigkeit und die Entlarvung falscher Zeugenaussagen.
      date: Ca. 2.–1. Jahrhundert v. Chr.
    1 Clement:
      display_name: 1. Clemensbrief
      author: Anonym; Clemens von Rom zugeschrieben.
      audience: Die christliche Gemeinde in Korinth, die in einen Streit um ihre Leitung verwickelt war.
      date: Ca. 96 n. Chr.
