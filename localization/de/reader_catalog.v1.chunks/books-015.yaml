review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und korrigiert. Mehrere Titel wurden präzisiert, um ungrammatische Formulierungen, unnötliche Interpretationen und Bedeutungsverschiebungen zu vermeiden.
  issues:
  - 3 Makkabäer 4 war im Entwurf ungrammatisch und stellte die Ereignisfolge nicht klar dar.
  - 4 Makkabäer 10 und 12 enthielten vermeidbare interpretierende Zusätze bzw. ungenaue Wiedergaben.
  - Einige Titel in 1 Clemens wurden näher an die Aussage der englischen Vorlage angepasst.
  - Die Verfasserangabe zum Gebet Manasses wurde als pseudonyme Zuschreibung präzisiert.
