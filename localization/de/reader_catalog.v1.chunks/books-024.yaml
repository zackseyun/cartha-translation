  book_metadata:
    Hypostasis of the Archons:
      display_name: Die Hypostase der Archonten
      author: Anonym. Der Verfasser deutet die Genesis mithilfe eines Offenbarungsmythos über die Archonten; das Werk lässt sich keinem namentlich bekannten Lehrer sicher zuschreiben.
      audience: Christen in einem sethianischen oder verwandten Umfeld, die die Genesis als Konflikt zwischen unwissenden kosmischen Herrschern, göttlicher Weisheit und dem geistigen Ursprung der Menschheit lasen.
      date: Gewöhnlich in das 3. Jahrhundert n. Chr. datiert; überliefert in einer koptischen Abschrift aus dem 4. Jahrhundert im Nag-Hammadi-Kodex II.
    On the Origin of the World:
      display_name: Über den Ursprung der Welt
      author: Anonym. Das Werk verbindet und überarbeitet mehrere jüdische, christliche, platonische und mythologische Traditionen, ohne seinen Kompilator zu nennen.
      audience: Leser in einem gnostisierenden christlichen Umfeld, die nach einer Gegengeschichte über die Schöpfung, die kosmischen Herrscher, Sophia, Adam und Eva sowie das endgültige Schicksal der Welt suchten.
      date: Gewöhnlich in das 3. Jahrhundert n. Chr. datiert, wobei ihm älteres Material zugrunde liegen könnte; hauptsächlich in koptischen Textzeugen aus dem 4. Jahrhundert überliefert.
    Sophia of Jesus Christ:
      display_name: Die Sophia Jesu Christi
      author: Anonym. Der Verfasser verarbeitet Material, das auch aus Eugnostos bekannt ist, zu einem Dialog zwischen Jesus und seinen Jüngern nach der Auferstehung.
      audience: Christen, die sich für offenbarte Weisheit über den transzendenten Gott, die Ordnung der himmlischen Welt sowie Ursprung und Erlösung der Seele interessierten.
      date: Oft in das späte 2. oder das 3. Jahrhundert n. Chr. datiert; in koptischen Abschriften aus Nag Hammadi und dem Berliner Kodex überliefert.
    Gospel of the Egyptians:
      display_name: Evangelium der Ägypter
      author: Anonym. Dieses Werk aus Nag Hammadi, das auch „Heiliges Buch des großen unsichtbaren Geistes“ genannt wird, ist von dem früheren griechischen Ägypterevangelium zu unterscheiden, das nur durch Zitate bekannt ist.
      audience: Eine sethianische christliche Gemeinschaft, die dichte Mythen, heilige Namen, Taufbilder und hymnischen Lobpreis verwendete, um geistige Identität und Befreiung auszudrücken.
      date: Gewöhnlich dem 2. oder 3. Jahrhundert n. Chr. zugeordnet; zwei koptische Abschriften sind in Nag-Hammadi-Kodizes aus dem 4. Jahrhundert erhalten.
    Letter of Peter to Philip:
      display_name: Brief des Petrus an Philippus
      author: Anonym. Der kurze einleitende Brief und die anschließende Offenbarung werden pseudonym Petrus und Philippus zugeschrieben, stammen aber nicht nachweislich von einem der beiden Apostel.
      audience: Christen, die eine apostolische Bestätigung für Lehren über den Erlöser, feindliche Mächte, Leiden, Mission und die Wiederherstellung der Jünger suchten.
      date: Gewöhnlich in das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert; in einer Nag-Hammadi-Abschrift aus dem 4. Jahrhundert und einem späteren koptischen Textzeugen überliefert.
    Gospel of Judas:
      display_name: Judasevangelium
      author: Anonym. Der Titel schreibt die Erzählung Judas zu, doch das Werk weist Judas Iskariot nicht als seinen historischen Verfasser aus.
      audience: Eine christliche Gruppe, die konkurrierende Opfer- und Kirchenpraktiken kritisierte und Offenbarungsdialoge sowie eine Kosmologie sethianischer Art nutzte, um Judas und den Tod Jesu neu zu deuten.
      date: Gewöhnlich in die Mitte oder das späte 2. Jahrhundert n. Chr. datiert; Irenäus kannte um 180 ein Judasevangelium, und die erhaltene koptische Abschrift stammt wahrscheinlich aus dem 3. oder 4. Jahrhundert.
    Protoevangelium of James:
      display_name: Protoevangelium des Jakobus
      author: Anonym. Der Erzähler gibt vor, Jakobus zu sein, doch das Werk ist pseudonym und wurde nicht von Jakobus, dem Bruder Jesu, verfasst.
      audience: Christen, die sich für Marias Geburt und Erziehung, ihre immerwährende Reinheit, die Geburt Jesu und erzählerische Antworten auf Fragen interessierten, die Matthäus und Lukas offenließen.
      date: Im Allgemeinen in die zweite Hälfte des 2. Jahrhunderts n. Chr. datiert; es ist in zahlreichen späteren griechischen Handschriften und alten Übersetzungen erhalten.
