  book_metadata:
    Hypostasis of the Archons:
      display_name: Die Hypostase der Archonten
      author: Anonym. Der Verfasser deutet die Genesis mithilfe eines Offenbarungsmythos über die Archonten; das Werk lässt sich keiner namentlich bekannten Lehrperson sicher zuordnen.
      audience: Christen in einem sethianischen oder verwandten Umfeld, die die Genesis als Konflikt zwischen unwissenden kosmischen Herrschern, göttlicher Weisheit und dem geistigen Ursprung der Menschheit lesen.
      date: Wird gewöhnlich in das 3. Jahrhundert n. Chr. datiert; erhalten in einer koptischen Abschrift des 4. Jahrhunderts im Nag-Hammadi-Kodex II.
    On the Origin of the World:
      display_name: Über den Ursprung der Welt
      author: Anonym. Das Werk verbindet und überarbeitet verschiedene jüdische, christliche, platonische und mythologische Traditionen, ohne seinen Kompilator zu nennen.
      audience: Leser in einem gnostisierenden christlichen Umfeld, die nach einer alternativen Geschichte der Schöpfung, der kosmischen Herrscher, Sophias, Adams und Evas sowie des endgültigen Schicksals der Welt suchen.
      date: Wird meist in das 3. Jahrhundert n. Chr. datiert, könnte jedoch auf älterem Material beruhen; hauptsächlich in koptischen Textzeugen des 4. Jahrhunderts erhalten.
    Sophia of Jesus Christ:
      display_name: Die Sophia Jesu Christi
      author: Anonym. Der Verfasser verarbeitet Material, das auch aus Eugnostos bekannt ist, zu einem Dialog zwischen Jesus und seinen Jüngern nach der Auferstehung.
      audience: Christen, die an offenbarter Weisheit über den transzendenten Gott, die Ordnung der himmlischen Welt sowie Ursprung und Erlösung der Seele interessiert sind.
      date: Wird häufig in das späte 2. oder das 3. Jahrhundert n. Chr. datiert; erhalten in koptischen Abschriften aus Nag Hammadi und dem Berliner Kodex.
    Gospel of the Egyptians:
      display_name: Evangelium der Ägypter
      author: Anonym. Dieses Werk aus Nag Hammadi, das auch als Heiliges Buch des großen unsichtbaren Geistes bezeichnet wird, ist von dem früheren griechischen Ägypterevangelium zu unterscheiden, das nur aus Zitaten bekannt ist.
      audience: Eine sethianische christliche Gemeinschaft, die dichte Mythen, heilige Namen, Taufbilder und hymnischen Lobpreis verwendet, um ihre geistige Identität und Befreiung auszudrücken.
      date: Wird gewöhnlich dem 2. oder 3. Jahrhundert n. Chr. zugeordnet; zwei koptische Abschriften sind in Nag-Hammadi-Kodizes des 4. Jahrhunderts erhalten.
    Letter of Peter to Philip:
      display_name: Brief des Petrus an Philippus
      author: Anonym. Der kurze einleitende Brief und die anschließende Offenbarung werden pseudonym Petrus und Philippus zugeschrieben, statt nachweislich von einem der beiden Apostel verfasst worden zu sein.
      audience: Christen, die apostolische Autorität für Lehren über den Erlöser, feindliche Mächte, Leiden, Mission und die Wiederherstellung der Jünger suchen.
      date: Wird gewöhnlich in das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert; erhalten in einer Nag-Hammadi-Abschrift des 4. Jahrhunderts und einem späteren koptischen Textzeugen.
    Gospel of Judas:
      display_name: Judasevangelium
      author: Anonym. Der Titel schreibt Judas die Erzählung zu, doch das Werk weist Judas Iskariot nicht als ihren historischen Verfasser aus.
      audience: Eine christliche Gruppe, die Opferpraktiken und kirchliche Bräuche rivalisierender Gruppen kritisiert und Judas sowie den Tod Jesu mithilfe von Offenbarungsdialogen und einer Kosmologie sethianischer Art neu deutet.
      date: Wird meist in die Mitte oder das späte 2. Jahrhundert n. Chr. datiert; Irenäus kannte um 180 ein Judasevangelium, und die erhaltene koptische Abschrift stammt wahrscheinlich aus dem 3. oder 4. Jahrhundert.
    Protoevangelium of James:
      display_name: Protevangelium des Jakobus
      author: Anonym. Der Erzähler gibt sich als Jakobus aus, doch das Werk ist pseudonym und wurde nicht von Jakobus, dem Bruder Jesu, verfasst.
      audience: Christen, die sich für Marias Geburt und Erziehung, ihre immerwährende Reinheit, die Geburt Jesu und erzählerische Antworten auf Fragen interessieren, die Matthäus und Lukas offenlassen.
      date: Wird allgemein in die zweite Hälfte des 2. Jahrhunderts n. Chr. datiert; erhalten in zahlreichen späteren griechischen Handschriften und alten Übersetzungen.
