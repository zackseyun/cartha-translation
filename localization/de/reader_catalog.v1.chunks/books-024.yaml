review:
  verdict: revise
  review_summary: Vollständige deutsche Lokalisierung geprüft und sprachlich bereinigt. Korrigiert wurden insbesondere Zeitbezüge in Zielgruppenbeschreibungen sowie einzelne Kapitelüberschriften, deren Entwurf eine zusätzliche Person oder eine nicht durch die Vorlage gedeckte Nuance einführte.
  issues:
  - Zielgruppenbeschreibungen verwendeten mehrfach Präteritum statt der in der Vorlage gemeinten gegenwärtig-allgemeinen Beschreibung.
  - Hypostasis of the Archons 9 ergänzte Norea, obwohl sie im englischen Titel nicht genannt wird.
  - Sophia of Jesus Christ 10 gab die verbale Form der Vorlage nicht passend wieder.
  - Gospel of the Egyptians 8 fügte die nicht explizite Wertung „erhabene“ hinzu.
  - Protoevangelium of James 6 deutete „strong“ als „wohlbehalten“ um.
