    Genesis:
      display_name: Genesis
      author: Anonym; traditionell Mose zugeschrieben. Die moderne Forschung geht von einer langen Entstehungsgeschichte aus, in deren Verlauf verschiedene Quellen später zusammengefügt wurden.
      audience: Israel als Volk des Bundes; seine Ursprungsgeschichte wird in Gottes Schöpfung, Erwählung und Verheißung verankert.
      date: Über Jahrhunderte hinweg entstanden; erhielt seine überlieferte Form etwa im 6.–5. Jahrhundert v. Chr., während oder nach dem babylonischen Exil.
      summary: Genesis erzählt von der Schöpfung, vom Aufbegehren und der Zerstreuung der Menschheit sowie von der Familie Abrahams, Isaaks, Jakobs und Josefs, mit der Gottes Bundesverheißungen an Israel beginnen.
    Exodus:
      display_name: Exodus
      author: Anonym; traditionell Mose zugeschrieben. Die moderne Forschung geht von einer langen Entstehungsgeschichte aus, in deren Verlauf verschiedene Quellen später zusammengefügt wurden.
      audience: Israel als befreites und in den Bund aufgenommenes Volk, das lernt, was es bedeutet, unter Gottes Gesetz das Volk des HERRN zu sein.
      date: Über Jahrhunderte hinweg entstanden; erhielt seine überlieferte Form etwa im 6.–5. Jahrhundert v. Chr.
    Leviticus:
      display_name: Levitikus
      author: Anonym; traditionell Mose zugeschrieben. Die moderne Forschung ordnet das Buch der Priesterschrift zu.
      audience: Israelitische Priester und die Gottesdienst feiernde Gemeinschaft — Anweisungen zu Opfern, Heiligkeit und einer Lebensordnung, die auf Gottes Gegenwart ausgerichtet ist.
      date: Entstehungsschichten von der späten Königszeit bis in die nachexilische Zeit (etwa 7.–5. Jahrhundert v. Chr).
