        title: Nichtjuden aus Gnade berufen
      '12':
        title: Das Leben als lebendiges Opfer darbringen
      '13':
        title: Sich den Obrigkeiten unterordnen und lieben
      '14':
        title: Die im Glauben Schwachen annehmen
      '15':
        title: Juden und Nichtjuden vereinen
      '16':
        title: Grüße und Warnungen
  1 Corinthians:
    display_name: 1. Korinther
    author: Paulus, zusammen mit Sosthenes.
    audience: Die von Streit geprägte christliche Gemeinde in Korinth.
    date: ca. 53–55 n. Chr., verfasst in Ephesus.
    chapters:
      '1':
        title: Gottes treue Gaben für alle
      '2':
        title: Weisheit aus Gottes Geist offenbart
      '3':
        title: Paulus warnt die Korinther als Gottes Tempel
      '4':
        title: Treue zählt mehr als Stolz
      '5':
        title: Paulus ordnet Gemeindezucht an
      '6':
        title: Streit innerhalb der Gemeinde schlichten
      '7':
        title: Paulus lehrt, die Ehe zu ehren
      '8':
        title: Liebe geht persönlicher Freiheit vor
      '9':
        title: Paulus verteidigt freiwillig sein Apostelamt
      '10':
        title: Israels Warnung an Gottes Volk
      '11':
        title: Einheit im Gottesdienst ehrt Christus
      '12':
        title: Gaben des Geistes stärken die Einheit der Gemeinde
      '13':
        title: Liebe gibt niemals auf
      '14':
        title: Paulus fordert Liebe statt Selbstdarstellung
      '15':
        title: Christus steht auf, und der Tod fällt
      '16':
        title: Sammlung und Reisepläne
  2 Corinthians:
    display_name: 2. Korinther
    author: Paulus, zusammen mit Timotheus.
    audience: Die Gemeinde in Korinth nach einem schmerzlichen Konflikt.
    date: ca. 55–56 n. Chr.
    chapters:
      '1':
        title: Gottes Trost im Leiden
      '2':
        title: Aufruf zu Liebe und Vergebung
      '3':
        title: Ein Dienst, bestätigt durch veränderte Leben
      '4':
        title: Die Herrlichkeit Christi verkünden
      '5':
        title: Die Liebe Christi treibt den Dienst an
      '6':
        title: Für Gott Leiden ertragen
      '7':
        title: In Ehrfurcht nach Heiligkeit streben
      '8':
        title: Die Gnade der Makedonier regt zum Geben an
      '9':
        title: Freudig für die Heiligen geben
      '10':
        title: Die Sanftmut Christi zugesichert
      '11':
        title: Eifer für ein treues Leben
      '12':
        title: Sich der Schwachheit und Gnade rühmen
      '13':
        title: Uns selbst auf Sünde prüfen
  Galatians:
    display_name: Galater
    author: Paulus.
    audience: Christliche Gemeinden in Galatien (Zentralanatolien), die unter Druck standen, die Beschneidung und die Befolgung der Tora anzunehmen.
    date: ca. 48–55 n. Chr. (umstritten).
    chapters:
      '1':
        title: Paulus verteidigt sein Evangelium
      '2':
        title: Paulus tritt dem Irrtum des Petrus entgegen
      '3':
        title: Abrahams Glaube macht gerecht
      '4':
        title: Christus befreit uns vom Gesetz
      '5':
        title: Aus Glauben leben, nicht aus dem Gesetz
      '6':
        title: Einer trage des anderen Last
  Ephesians:
    display_name: Epheser
    author: Paulus oder ein enger Schüler, der unter dem Namen des Paulus schrieb (umstritten).
    audience: Eine allgemeine Leserschaft unter den Christen in der Provinz Asia; der Ortsname „Ephesus“ fehlt in den frühesten Handschriften.
    date: ca. 60er-Jahre n. Chr., falls von Paulus; ca. 80er- bis 90er-Jahre n. Chr., falls pseudonym verfasst.
    chapters:
      '1':
        title: Gottes Gnade in den Glaubenden besiegelt
      '2':
        title: Christus bringt allen Frieden
      '3':
        title: Das Geheimnis wird durch das Evangelium offenbart
      '4':
        title: Gebet um Einheit im Leib Christi
      '5':
        title: Gott nachahmen und weise leben
      '6':
        title: Kinder, gehorcht euren Eltern und ehrt sie
  Philippians:
    display_name: Philipper
    author: Paulus, zusammen mit Timotheus.
    audience: Die christliche Gemeinde in Philippi, einer römischen Kolonie in Makedonien.
    date: ca. 60–62 n. Chr., im Gefängnis verfasst.
    chapters:
      '1':
        title: Paulus betet für die Philipper
      '2':
        title: Jesus, demütig und erhöht
      '3':
        title: Freude darüber, Christus zu kennen
      '4':
        title: Mit Freude standhaft bleiben
  Colossians:
    display_name: Kolosser
    author: Paulus, zusammen mit Timotheus – oder ein enger Schüler, der unter dem Namen des Paulus schrieb (umstritten).
    audience: Christen in Kolossä im Lykostal, die mit einer synkretistischen Lehre konfrontiert waren.
    date: ca. 60–62 n. Chr., falls von Paulus; später, falls pseudonym verfasst.
    chapters:
      '1':
        title: Paulus betet für den Glauben der Kolosser
      '2':
        title: Paulus ermutigt die Glaubenden in Christus
      '3':
        title: Die Sünde überwinden und in Liebe leben
      '4':
        title: Paulus betet; Fesseln ermutigen
  1 Thessalonians:
    display_name: 1. Thessalonicher
    author: Paulus, zusammen mit Silvanus und Timotheus.
    audience: Die junge christliche Gemeinde in Thessalonich, die verfolgt wurde.
    date: ca. 50–51 n. Chr. – wahrscheinlich der früheste erhaltene Paulusbrief.
    chapters:
      '1':
        title: Gnade, Friede, Glaube, Liebe und Hoffnung
      '2':
        title: Freimütig und aus reinen Beweggründen predigen
      '3':
        title: Timotheus ermutigt im Leiden
      '4':
        title: Paulus ermutigt zu einem heiligen Leben
      '5':
        title: Wach bleiben und die Rettung erwarten
  2 Thessalonians:
    display_name: 2. Thessalonicher
    author: Paulus (umstritten; einige Forschende halten den Brief für pseudonym).
    audience: Die Gemeinde in Thessalonich; der Brief befasst sich mit Verwirrung über die Endzeit.
    date: ca. 51 n. Chr., falls von Paulus.
    chapters:
      '1':
        title: Gott belohnt die treuen Verfolgten
      '2':
        title: Der Aufstand kommt vor der Wiederkunft Christi
      '3':
        title: Paulus betet für das Wachstum der Gemeinde
  1 Timothy:
    display_name: 1. Timotheus
    author: Paulus oder ein Schüler, der unter dem Namen des Paulus schrieb (die Pastoralbriefe gelten in der Forschung weithin als pseudonym).
    audience: Timotheus als Beauftragter des Paulus in Ephesus; eine Anleitung für die spätere Ordnung der Kirche.
    date: ca. Mitte der 60er-Jahre n. Chr., falls von Paulus; ca. 90–110 n. Chr., falls pseudonym verfasst.
    chapters:
      '1':
        title: Paulus fordert Timotheus auf zu bleiben
      '2':
        title: Für Herrschende beten und friedlich leben
      '3':
        title: Anforderungen an Gemeindeleitende
      '4':
        title: Falsche Lehrende und Mythen zurückweisen
      '5':
        title: Witwen und Älteste treu ehren
      '6':
        title: Paulus berät Timotheus zum Umgang mit Reichtum
  2 Timothy:
    display_name: 2. Timotheus
    author: Paulus oder ein Schüler, der unter dem Namen des Paulus schrieb.
    audience: Timotheus – gestaltet als Abschiedsworte des Paulus aus dem Gefängnis.
    date: ca. Mitte der 60er-Jahre n. Chr., falls von Paulus; ca. 90–110 n. Chr., falls pseudonym verfasst.
    chapters:
      '1':
        title: Timotheus soll in der Gnade standhaft bleiben
      '2':
        title: Für Christus Leiden ertragen
      '3':
        title: 'Warnung: Falsche Lehrende meiden'
      '4':
        title: Allen treu das Wort verkünden
  Titus:
    display_name: Titus
    author: Paulus oder ein Schüler, der unter dem Namen des Paulus schrieb.
    audience: Titus als Beauftragter des Paulus auf Kreta.
    date: ca. Mitte der 60er-Jahre n. Chr., falls von Paulus; ca. 90–110 n. Chr., falls pseudonym verfasst.
    chapters:
      '1':
        title: Paulus weist Titus auf Kreta an
      '2':
        title: Alle Altersgruppen zu einem von Gnade geprägten Leben anleiten
      '3':
        title: Demütig leben und auf Christus warten
  Philemon:
    display_name: Philemon
    author: Paulus, zusammen mit Timotheus.
    audience: Philemon, ein christlicher Sklavenhalter, hinsichtlich seines entlaufenen Sklaven Onesimus.
    date: ca. 60–62 n. Chr.
    chapters:
      '1':
        title: Paulus bittet um die Freiheit des Onesimus
  Hebrews:
    display_name: Hebräer
    author: Anonym. Die Tradition hat Paulus, Apollos, Barnabas, Priscilla und andere genannt; für keinen Vorschlag besteht ein Konsens.
    audience: Griechischsprachige Judenchristen, die versucht waren, sich von ihrem christlichen Bekenntnis wieder abzuwenden.
    date: ca. 60–95 n. Chr.
    chapters:
      '1':
        title: Gott spricht durch seinen Sohn
      '2':
        title: Jesus rettet durch Leiden
      '3':
        title: Den Blick auf den treuen Jesus richten
      '4':
        title: In Gottes verheißene Ruhe eingehen
      '5':
        title: Christus brachte das vollkommene Opfer dar
      '6':
        title: Zur geistlichen Reife voranschreiten
      '7':
        title: Jesus, für immer Priester nach der Ordnung Melchisedeks
      '8':
        title: Der neue Bund durch das Blut Jesu
      '9':
        title: Jesus betritt das wahre himmlische Heiligtum
      '10':
        title: Durch das Blut Christi vor Gott treten
      '11':
        title: Der Glaube der Vorfahren bleibt bestehen
      '12':
        title: Mit Jesus im Leiden standhalten
      '13':
        title: In Liebe und Vertrauen leben
  James:
    display_name: Jakobus
    author: Traditionell Jakobus, der Bruder Jesu; in der modernen Forschung ist umstritten, ob der Brief tatsächlich von ihm stammt oder pseudonym verfasst wurde.
    audience: Judenchristliche Gemeinden in der Diaspora.
    date: Falls authentisch, ca. 50er–60er Jahre n. Chr.; falls pseudonym, gegen Ende des 1. Jahrhunderts n. Chr.
    chapters:
      '1':
        title: In Prüfungen bewährt sich beständiger Glaube
      '2':
        title: Glaube ohne Taten ist tot
      '3':
        title: Die Zunge zügeln und weise reden
      '4':
        title: Streit entsteht aus Selbstsucht
      '5':
        title: Das Gericht über reiche Unterdrücker ist nahe
  1 Peter:
    display_name: 1. Petrus
    author: Traditionell der Apostel Petrus, mit Silvanus als Schreiber; einige Forschende halten den Brief für pseudonym.
    audience: Christen im römischen Kleinasien, die gesellschaftlicher Anfeindung ausgesetzt waren.
    date: Falls von Petrus, ca. 60er Jahre n. Chr.; falls pseudonym, ca. 70er–90er Jahre n. Chr.
    chapters:
      '1':
        title: Hoffnung auf das himmlische Erbe
      '2':
        title: Gläubige werden auf dem lebendigen Stein aufgebaut
      '3':
        title: Ehefrauen ehren Christus durch ihr Leben
      '4':
        title: Leiden, weil man Gutes und Rechtes tut
      '5':
        title: Älteste sorgen als Vorbilder im Glauben für die Gemeinde
  2 Peter:
    display_name: 2. Petrus
    author: Traditionell Petrus; in der modernen Forschung gilt der Brief weithin als pseudonym.
    audience: Christen, die mit Spöttern konfrontiert waren, welche die Wiederkunft Christi bestritten.
    date: Ca. Anfang des 2. Jahrhunderts n. Chr.
    chapters:
      '1':
        title: Petrus lehrt geistliches Wachstum
      '2':
        title: Falsche Lehrer ziehen rasches Gericht auf sich
      '3':
        title: Petrus warnt vor dem letzten Gericht
  1 John:
    display_name: 1. Johannes
    author: Anonym; traditionell dem Apostel Johannes oder dem johanneischen Ältesten zugeschrieben.
    audience: Eine johanneische Gemeinschaft nach einer Spaltung, die klären musste, wer zu ihr gehört.
    date: Ca. 90–110 n. Chr.
    chapters:
      '1':
        title: Das Licht offenbart wahre Gemeinschaft
      '2':
        title: Liebe hält Gottes Gebote
      '3':
        title: Wer aus Gott geboren ist, überwindet die Sünde
      '4':
        title: Wahre Liebe kommt von Gott
      '5':
        title: 'Glaubt: Jesus hat ewiges Leben'
  2 John:
    display_name: 2. Johannes
    author: „Der Älteste“.
    audience: Eine bestimmte christliche Gemeinde („die auserwählte Herrin“), die vor falschen Lehrern gewarnt wird.
    date: Ca. 90–110 n. Chr.
    chapters:
      '1':
        title: Der Älteste warnt vor falschen Lehrern
  3 John:
    display_name: 3. Johannes
    author: „Der Älteste“.
    audience: Gaius, ein Gemeindeleiter, der reisende Missionare aufnahm.
    date: Ca. 90–110 n. Chr.
    chapters:
      '1':
        title: Der Älteste betet für das Wohlergehen des Gaius
  Jude:
    display_name: Judas
    author: Traditionell Judas, der Bruder des Jakobus und Jesu.
    audience: Christliche Gemeinschaften, in die freizügig lebende Lehrer eindrangen.
    date: Ca. 60er–90er Jahre n. Chr.
    chapters:
      '1':
        title: Judas warnt vor gottlosen Eindringlingen
  Revelation:
    display_name: Offenbarung
    author: Johannes von Patmos (stilistisch vom vierten Evangelium verschieden).
    audience: Sieben christliche Gemeinden im römischen Kleinasien unter dem Druck der kaiserlichen Herrschaft.
    date: Ca. 90er Jahre n. Chr., traditionell in die Regierungszeit Domitians datiert.
    chapters:
      '1':
        title: Gott zeigt Johannes seine Visionen
      '2':
        title: Jesus spricht zu sieben Gemeinden
      '3':
        title: Jesus ruft Laodizea zur Umkehr auf
      '4':
        title: Gottes Thron im Himmel erstrahlt in Herrlichkeit
      '5':
        title: Das Lamm nimmt die Schriftrolle und erlöst
      '6':
        title: Vier Reiter bringen großes Unheil
      '7':
        title: Versiegelte Diener singen ewiges Lob
      '8':
        title: Sieben Posaunen erschallen mit schrecklichen Gerichten
      '9':
        title: Heuschrecken quälen die Sünder der Erde
      '10':
        title: 'Ein mächtiger Engel schwört: Die letzte Zeit ist da'
      '11':
        title: Zwei Zeugen weissagen und stehen wieder auf
      '12':
        title: Eine Frau gebiert den Sohn, der herrschen soll
      '13':
        title: Das Tier steigt aus dem Meer empor
      '14':
        title: Das Lamm sammelt die Treuen um sich
      '15':
        title: Johannes sieht Gottes Zorn im Himmel
      '16':
        title: Engel gießen die Schalen des Zorns aus
      '17':
        title: Babylons Gericht und Gottes Triumph
      '18':
        title: Der Himmel jubelt über Babylons Fall
      '19':
        title: Der Himmel feiert die Hochzeit des Lammes
      '20':
        title: Johannes sieht das letzte Gericht
      '21':
        title: Alles wird neu gemacht
      '22':
        title: Jesus kommt bald
  Tobit:
    display_name: Tobit
    author: Anonym.
    audience: Juden in der Diaspora, die unter fremder Herrschaft nach Frömmigkeit, einer guten Ehe und Gottes Vorsehung fragten.
    date: Ca. 225–175 v. Chr.; auf Aramäisch verfasst, wobei in Qumran auch eine hebräische Fassung belegt ist.
    chapters:
      '1':
        title: Tobit bleibt Gott treu
      '2':
        title: Tobit begräbt einen verachteten Mitmenschen
      '3':
        title: Tobit weint und bittet um den Tod
      '4':
        title: Tobit weist seinen Sohn zu einem gerechten Leben an
      '5':
        title: Tobias bricht unter Führung auf
      '6':
        title: Tobias fängt einen Fisch mit Heilkraft
      '7':
        title: Tobias heiratet Sara in Ekbatana
      '8':
        title: Tobias heiratet Sara und betet
      '9':
        title: Gabaël bringt Tobit das Geld zurück
      '10':
        title: Tobias kehrt sicher nach Hause zurück
      '11':
        title: Tobits Sohn gibt ihm das Augenlicht zurück
      '12':
        title: Rafael offenbart seine wahre Identität
      '13':
        title: Tobit betet für Jerusalem
      '14':
        title: Tobit sieht Israels Zukunft voraus
  Judith:
    display_name: Judit
    author: Anonym.
    audience: Juden unter fremder Bedrohung – eine trotzige Erzählung über frommen Widerstand.
    date: Ca. 150–100 v. Chr.
    chapters:
      '1':
        title: Nebukadnezar greift Arphaxad an
      '2':
        title: Holofernes zieht nach Westen
      '3':
        title: Die Küstenvölker übergeben ihre Schätze
      '4':
        title: Israel fastet und betet um Hilfe
      '5':
        title: Achior erläutert Israels Geschichte
      '6':
        title: Achior wird vor Holofernes gewarnt
      '7':
        title: Betulia geht das Wasser aus
      '8':
        title: Judit verheißt Gottes Rettung
      '9':
        title: Judit betet um Gottes Kraft
      '10':
        title: Judit betritt das assyrische Lager
      '11':
        title: Holofernes lässt Judit zu sich kommen
      '12':
        title: Judit sucht Gottes Führung
      '13':
        title: Judit enthauptet Holofernes
      '14':
        title: Israel feiert Judits Sieg
      '15':
        title: Israel plündert die assyrische Beute
      '16':
        title: Judit stimmt ein Loblied an
  Greek Additions to Esther:
    display_name: Griechische Zusätze zu Ester
    author: Anonym; ergänzendes Material, das der griechischen Übersetzung des Esterbuches hinzugefügt wurde.
    audience: Griechischsprachige Juden, die eine Estererzählung mit ausdrücklichen Gebeten und direkten Bezügen auf Gott wünschten.
    date: Ca. 2.–1. Jahrhundert v. Chr.
    chapters:
      '1':
        title: Mordechai träumt und warnt den König
      '2':
        title: Der König ordnet die Vernichtung an
      '3':
        title: Mordechai und Ester beten um Hilfe
      '4':
        title: Ester tritt vor den König
      '5':
        title: Der König bestraft Haman und rettet die Juden
      '6':
        title: Mordechai erinnert sich an den Traum und weissagt
  Wisdom of Solomon:
    display_name: Weisheit Salomos
    author: Anonym; pseudonym Salomo zugeschrieben. Von einem hellenistisch-jüdischen Verfasser auf Griechisch geschrieben, wahrscheinlich in Alexandria.
    audience: Hellenistische Juden in der Auseinandersetzung mit griechischer Philosophie, die Israels Weisheit gegenüber heidnischen und vom Glauben abgefallenen Alternativen verteidigten.
    date: Ca. 50 v. Chr.–50 n. Chr.
    chapters:
      '1':
        title: Gott offenbart den Suchenden Weisheit
      '2':
        title: Die Frevler verwerfen die wahre Freude des Lebens
      '3':
        title: Die Seelen der Gerechten ruhen in Frieden
      '4':
        title: Tugend wird geehrt, Gottlosigkeit beschämt
      '5':
        title: Die Gerechten entlarven mutig die Bosheit
      '6':
        title: Weisheit führt zu wahrer Königsherrschaft
      '7':
        title: Gebet schenkt Weisheit und Einsicht
      '8':
        title: Weisheit leitet und stärkt Herrscher
      '9':
        title: Der König betet um göttliche Weisheit
      '10':
        title: Weisheit schützt und rettet die Gerechten
      '11':
        title: Gott erweist durch Zurechtweisung Erbarmen
      '12':
        title: Götzenspott führt zu leerer Hoffnung
      '13':
        title: Menschen verehren leblose Götzen
      '14':
        title: Gott führt Schiffe durch das Meer
      '15':
        title: Gottes Erbarmen führt zu wahrer Anbetung
      '16':
        title: Gott versorgt die Seinen und richtet die Unterdrücker
      '17':
        title: Gefangen in den Schrecken der Nacht
      '18':
        title: Gott führt mit Licht
      '19':
        title: Die Wolken weichen vor Israel
  Sirach:
    display_name: Jesus Sirach
    author: Jeschua ben Eleasar ben Sira aus Jerusalem; griechische Übersetzung durch seinen Enkel.
    audience: Junge jüdische Männer, die im Jerusalem der hellenistischen Zeit in Weisheit unterwiesen wurden.
    date: Hebräisches Original ca. 195–175 v. Chr.; griechische Übersetzung ca. 132 v. Chr.
    chapters:
      '1':
        title: Gott bemisst und schenkt Weisheit
      '2':
        title: Prüfungen bewähren treue Diener
      '3':
        title: Ehre die Eltern und erlange langes Leben
      '4':
        title: Rette die Unterdrückten und suche Weisheit
      '5':
        title: Vertraue auf Gott, nicht auf Reichtum
      '6':
        title: Suche Weisheit wie ein Bauer
      '7':
        title: Bewahre tiefe Demut im Herzen
      '8':
        title: Meide Toren und ehre die Älteren
      '9':
        title: Hüte dich vor Eifersucht und Begierde
      '10':
        title: Weise Führung schafft Ordnung
      '11':
        title: Weisheit richtet die Armen auf
      '12':
        title: Hilf den Gerechten, nicht den Sündern
      '13':
        title: Wer Pech berührt, wird davon beschmutzt
      '14':
        title: Weisheit bringt ewigen Segen
      '15':
        title: Weisheit begegnet denen, die sie suchen
      '16':
        title: Ein einziger Treuer erhält eine Stadt
      '17':
        title: Die Menschen sind nach Gottes Bild geschaffen
      '18':
        title: Mache gute Taten nicht zunichte
      '19':
        title: Wer dem Vergnügen nachjagt, geht zugrunde
      '20':
        title: Beim Reden kommt es auf den richtigen Zeitpunkt an
      '21':
        title: Bete, fliehe die Sünde und suche Weisheit
      '22':
        title: Faulheit bringt Schande und Kummer
      '23':
        title: Bitte um innere Zucht und Weisheit
      '24':
        title: Die Weisheit spricht zu ihrem eigenen Lob
      '25':
        title: Weisheit ehrt Gott und die Menschen
      '26':
        title: Eine Frau bringt Freude oder Leid
      '27':
        title: Strebe nach Gerechtigkeit und trage sie mit Stolz
      '28':
        title: Vergib Sünden und empfange Erbarmen
      '29':
        title: Vergib deinem Nächsten und empfange Erbarmen
      '30':
        title: Erziehe Söhne zu einem ehrenhaften Leben
      '31':
        title: Reichtum bringt Sorge und Leid
      '32':
        title: Diene zuerst demütig den anderen
      '33':
        title: Der Herr schützt alle, die ihn fürchten
      '34':
        title: Träume können täuschen, wenn sie nicht eindeutig sind
      '35':
        title: Führende sollen demütig und weise bleiben
      '36':
        title: Rettung kommt durch die Furcht des Herrn
      '37':
        title: Wähle Freunde und Ratgeber mit Bedacht
      '38':
        title: Ehre die Ärzte, bete und werde gesund
      '39':
        title: Sirach preist den treuen Hüter des Gesetzes
      '40':
        title: Die Lasten und Segnungen des Lebens
      '41':
        title: Der Tod bringt die letzte Ruhe
