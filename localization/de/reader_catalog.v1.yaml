  Gospel of Judas:
    display_name: Judasevangelium
    author: Anonym. Der Titel schreibt die Erzählung Judas zu, doch das Werk weist Judas Iskariot nicht als seinen historischen Verfasser aus.
    audience: Eine christliche Gruppe, die konkurrierende Opfer- und Kirchenpraktiken kritisierte und Offenbarungsdialoge sowie eine Kosmologie sethianischer Art nutzte, um Judas und den Tod Jesu neu zu deuten.
    date: Gewöhnlich in die Mitte oder das späte 2. Jahrhundert n. Chr. datiert; Irenäus kannte um 180 ein Judasevangelium, und die erhaltene koptische Abschrift stammt wahrscheinlich aus dem 3. oder 4. Jahrhundert.
