  Epistle to Diognetus:
    display_name: Brief an Diognet
    author: Anonym. Der Verfasser bezeichnet sich als Jünger oder Lernenden, doch weder er noch der angesprochene Diognet lassen sich sicher identifizieren.
    audience: Ein gebildeter nichtchristlicher Fragesteller – und Leser wie er –, der nach christlicher Gottesverehrung, Ethik, gesellschaftlicher Identität, Liebe und der scheinbaren Neuheit des Glaubens fragt.
    date: Oft auf das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert, wobei die Vorschläge stark voneinander abweichen; die letzten beiden Kapitel könnten aus einem anderen Werk stammen.
    chapters:
