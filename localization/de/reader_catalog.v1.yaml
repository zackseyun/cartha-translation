  Exegesis on the Soul:
    display_name: Auslegung über die Seele
    author: Anonym. Der Verfasser ist ein christlicher Prediger, der Bilder aus der Bibel und der griechischen Literatur als Allegorie für Fall, Umkehr und Wiederherstellung der Seele neu deutet.
    audience: Mit der Heiligen Schrift und moralischer Ermahnung vertraute Christinnen und Christen, die dazu aufgerufen wurden, sich von ungeordnetem Begehren abzuwenden, umzukehren und sich wieder mit dem Göttlichen zu vereinen.
    date: Im Allgemeinen auf das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert; erhalten in einer koptischen Übersetzung aus dem Griechischen aus dem 4. Jahrhundert.
    chapters:
      '1':
        title: Die Seele kehrt um und sucht Erbarmen
      '2':
        title: Die Seele verrät Gott durch Begierden
      '3':
        title: Gott reinigt die Seele durch die Taufe
      '4':
        title: Die Seele vereint sich wieder mit dem göttlichen Ursprung
      '5':
        title: Betet aufrichtig zum verborgenen Gott
      '6':
        title: Die Seele kehrt aus der Begierde heim
      '7':
        title: Gott hört aufrichtige Klage
  Book of Thomas the Contender:
    display_name: Buch des Thomas, des Kämpfers
    author: Anonym. Der Schlusstitel bringt das Werk mit Judas Thomas in Verbindung und nennt Mathaias als Schreiber, doch handelt es sich dabei um literarische Zuschreibungen und nicht um überprüfbare Angaben zur Verfasserschaft.
    audience: Asketisch orientierte Christinnen und Christen, die dazu angehalten wurden, Selbsterkenntnis zu suchen, körperlichen Leidenschaften zu widerstehen und Jesu persönliche Unterweisung an Thomas zu verstehen.
    date: Oft auf das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert, möglicherweise in einem syrisch-christlichen Umfeld; erhalten in einer koptischen Handschrift aus dem 4. Jahrhundert.
    chapters:
      '1':
        title: Mathaias zeichnet die Lehren des Thomas auf
      '2':
        title: Christus ruft zur Selbstprüfung auf
      '3':
        title: Jesus lehrt die unsichtbare Wahrheit
      '4':
