  Tripartite Tractate:
    display_name: Dreiteilige Abhandlung
    author: Anonym. Der Verfasser war ein hochgebildeter valentinianischer christlicher Theologe; eine sichere Gleichsetzung mit einem namentlich bekannten Lehrer ist nicht möglich.
    audience: Eine valentinianische christliche Gemeinschaft, die ausführliche Unterweisung über Gott, die Äonen, die Schöpfung, Christus, die Kirche, die Erlösung und die endgültige Wiederherstellung erhielt.
    date: Gewöhnlich auf das 3. Jahrhundert n. Chr. datiert, wobei einige Argumente für dessen zweite Hälfte sprechen; im Jung-Kodex aus dem 4. Jahrhundert auf Koptisch erhalten.
