      '7':
        title: Die Apostel predigen trotz Verfolgung
      '8':
        title: Petrus verkündet das heilige Erbe
  Gospel of Judas:
    display_name: Judasevangelium
    author: Anonym. Der Titel schreibt Judas die Erzählung zu, doch das Werk weist Judas Iskariot nicht als ihren historischen Verfasser aus.
    audience: Eine christliche Gruppe, die Opferpraktiken und kirchliche Bräuche rivalisierender Gruppen kritisiert und Judas sowie den Tod Jesu mithilfe von Offenbarungsdialogen und einer Kosmologie sethianischer Art neu deutet.
    date: Wird meist in die Mitte oder das späte 2. Jahrhundert n. Chr. datiert; Irenäus kannte um 180 ein Judasevangelium, und die erhaltene koptische Abschrift stammt wahrscheinlich aus dem 3. oder 4. Jahrhundert.
    chapters:
      '1':
        title: Jesus offenbart Judas Geheimnisse
      '2':
        title: Judas allein tritt zu Jesus
      '3':
        title: Jesus beschreibt die heilige Gemeinschaft
      '4':
        title: Die Vision der Jünger deckt Verderbnis auf
      '5':
        title: Judas wird verflucht und bleibt doch einzigartig
      '6':
        title: Jesus offenbart die göttlichen Bereiche
      '7':
        title: Judas liefert den Leib Jesu aus
