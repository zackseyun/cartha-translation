      '10':
        title: Der stolze Herrscher bildet Reiche
      '11':
        title: Der unwissende Herrscher ahmt die Ordnung nach
      '12':
        title: Die Weisheit kehrt in der Finsternis um
      '13':
        title: Die Mächte formen den menschlichen Körper
      '14':
        title: Gott verbirgt Licht in Adam
      '15':
        title: Die Herrscher versuchen Adam zum Vergessen zu bringen
      '16':
        title: Göttliches Licht erweckt die Menschheit
      '17':
        title: Die Vorsehung weckt den Verstand
      '18':
        title: Seelen wenden sich von bösen Kämpfen ab
      '19':
        title: Der barmherzige Geist weckt die Menschen
      '20':
        title: Das Licht steigt herab, um Seelen zu retten
      '21':
        title: Der Erlöser vertraut verborgene Weisheit an
  Hypostasis of the Archons:
    display_name: Die Hypostase der Archonten
    author: Anonym. Der Verfasser deutet die Genesis mithilfe eines Offenbarungsmythos über die Archonten; das Werk lässt sich keiner namentlich bekannten Lehrperson sicher zuordnen.
    audience: Christen in einem sethianischen oder verwandten Umfeld, die die Genesis als Konflikt zwischen unwissenden kosmischen Herrschern, göttlicher Weisheit und dem geistigen Ursprung der Menschheit lesen.
    date: Wird gewöhnlich in das 3. Jahrhundert n. Chr. datiert; erhalten in einer koptischen Abschrift des 4. Jahrhunderts im Nag-Hammadi-Kodex II.
    chapters:
      '1':
        title: Der Geist offenbart die kosmischen Mächte
      '2':
        title: Eine Stimme entlarvt den blinden Herrscher
      '3':
        title: Göttliches Licht macht Adam lebendig
      '4':
