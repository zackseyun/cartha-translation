      '30':
        title: Christi Licht offenbart die ewige Wiederherstellung
  Apocryphon of John:
    display_name: Apokryphon des Johannes
    author: Anonym. Das Werk gibt sich pseudonym als Offenbarung des auferstandenen Jesus an Johannes, den Sohn des Zebedäus, aus und ist in mehr als einer antiken Textfassung erhalten.
    audience: Christinnen und Christen in einer sethianischen oder eng verwandten Offenbarungstradition, die eine Darstellung der göttlichen Welt, der Schöpfung, der menschlichen Identität und der Befreiung von feindlichen Herrschern suchten.
    date: Eine frühe Fassung war wahrscheinlich bereits im 2. Jahrhundert n. Chr. im Umlauf; die erhaltenen koptischen Textzeugen, die kürzere und längere Fassungen bewahren, stammen aus dem 4. und 5. Jahrhundert.
    chapters:
      '1':
        title: Johannes sucht Jesu Weisheit
      '2':
        title: Der Himmel offenbart göttliche Gestalten
      '3':
        title: Der verborgene Gott ist die höchste Wirklichkeit
      '4':
