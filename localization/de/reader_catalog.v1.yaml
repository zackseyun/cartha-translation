    audience: Ein gebildeter nichtchristlicher Fragesteller – und Leser wie er –, der Fragen zum christlichen Gottesdienst, zur Ethik, zur gesellschaftlichen Identität, zur Liebe und zur scheinbaren Neuheit des Glaubens stellt.
