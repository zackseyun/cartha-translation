  Deuteronomy:
    display_name: Deuteronomium
    author: Anonym; als Abschiedsreden des Mose dargestellt. Die moderne Forschung verortet einen Kern in der Reform unter Joschija im späten 7. Jahrhundert v. Chr.
    audience: Israel vor dem Einzug in das Land – und später Menschen im Exil, die fragten, wie sie ohne Tempel oder König treu leben konnten.
    date: Kern vermutlich aus dem späten 7. Jahrhundert v. Chr.; die Endgestalt entstand in der Exilszeit.
    chapters:
