  Polycarp to the Philippians:
    display_name: Polykarp an die Philipper
    author: Polykarp, Bischof von Smyrna. Einige Forschende verstehen den überlieferten Text als eine Zusammenfügung von Material, das zu mehr als einem Zeitpunkt versandt wurde.
    audience: Die christliche Gemeinde in Philippi, die um die Briefe des Ignatius gebeten hatte und Ratschläge zu Glauben, Lebensführung, Gemeindeleitung, Geld und Ausdauer erhielt.
    date: Frühes bis mittleres 2. Jahrhundert n. Chr.; zumindest ein Teil steht in engem Zusammenhang mit der Reise des Ignatius, während die Annahme eines zusammengesetzten Briefes einen etwas späteren Abschnitt zulässt.
    chapters:
      '1':
