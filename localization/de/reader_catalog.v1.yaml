  Letter of Peter to Philip:
    display_name: Brief des Petrus an Philippus
    author: Anonym. Der kurze einleitende Brief und die anschließende Offenbarung werden pseudonym Petrus und Philippus zugeschrieben, statt nachweislich von einem der beiden Apostel verfasst worden zu sein.
    audience: Christen, die apostolische Autorität für Lehren über den Erlöser, feindliche Mächte, Leiden, Mission und die Wiederherstellung der Jünger suchen.
    date: Wird gewöhnlich in das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert; erhalten in einer Nag-Hammadi-Abschrift des 4. Jahrhunderts und einem späteren koptischen Textzeugen.
    chapters:
      '1':
        title: Petrus drängt Philippus zur Rückkehr
      '2':
        title: Die Apostel beten auf dem Ölberg
      '3':
        title: Jesus erklärt die göttliche Fülle
      '4':
