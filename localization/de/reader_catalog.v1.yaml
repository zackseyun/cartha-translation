    author: Papias, Bischof von Hierapolis, als Verfasser der verlorenen fünfbändigen Auslegung der Worte des Herrn; die erhaltene Sammlung besteht aus Zitaten und Berichten, die von späteren Autoren bewahrt wurden.
    audience: Frühe Christen, die nach überlieferten Lehren über Jesus und die Apostel suchten; diese wurden durch namentlich genannte Ketten mündlicher Zeugnisse und Auslegungen zusammengetragen.
    date: Das Werk des Papias wird gewöhnlich in das frühe 2. Jahrhundert n. Chr. datiert, oft auf etwa 110–130; die erhaltenen Fragmente finden sich bei Autoren, die vom 2. Jahrhundert an schrieben.
