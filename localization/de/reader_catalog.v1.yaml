books:
  Genesis:
    display_name: Genesis
    author: Anonym; traditionell Mose zugeschrieben. Die heutige Forschung geht von einer langen Entstehungsgeschichte aus, in der verschiedene Quellen später zusammengefügt wurden.
    audience: Israel in seiner Identität als Bundesvolk; die Ursprungsgeschichte des Volkes wird in Gottes Schöpfung, Erwählung und Verheißung verankert.
    date: Über Jahrhunderte hinweg entstanden; erhielt seine überlieferte Gestalt etwa im 6.–5. Jahrhundert v. Chr., während oder nach dem babylonischen Exil.
    summary: Genesis erzählt von der Schöpfung, der Auflehnung und Zerstreuung der Menschheit sowie von der Familie Abrahams, Isaaks, Jakobs und Josefs, mit der Gottes Bundesverheißungen an Israel beginnen.
    chapters:
      '1':
        title: Gott erschafft Himmel und Erde
      '2':
        title: Gott formt Mann und Frau
      '3':
        title: Die Menschheit fällt aus Eden
