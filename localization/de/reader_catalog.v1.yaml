  Gospel of Mary:
    display_name: Evangelium der Maria
    author: Anonym. Das Werk stellt Maria als Empfängerin und Auslegerin einer Offenbarung Jesu dar, behauptet jedoch nicht, dass Maria das erhaltene Evangelium verfasst habe.
    audience: Frühe christliche Leserinnen und Leser, die sich mit Offenbarung, geistlichem Aufstieg, apostolischer Autorität und der Berechtigung von Marias Lehre unter den Jüngern Jesu auseinandersetzten.
    date: Gewöhnlich auf das 2. Jahrhundert n. Chr. datiert; griechische Fragmente sind aus dem 3. Jahrhundert erhalten, und der wichtigste koptische Textzeuge ist im Berliner Kodex 8502 aus dem 5. Jahrhundert überliefert.
    chapters:
