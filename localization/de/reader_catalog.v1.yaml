  Exodus:
    display_name: Exodus
    author: Anonym; traditionell Mose zugeschrieben. Die moderne Forschung geht von einer langen Entstehungsgeschichte aus, in deren Verlauf verschiedene Quellen später zusammengefügt wurden.
    audience: Israel als befreites und in den Bund aufgenommenes Volk, das lernt, was es bedeutet, unter Gottes Gesetz das Volk des HERRN zu sein.
    date: Über Jahrhunderte hinweg entstanden; erhielt seine überlieferte Form etwa im 6.–5. Jahrhundert v. Chr.
