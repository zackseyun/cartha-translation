  Treatise on the Resurrection:
    display_name: Abhandlung über die Auferstehung
    author: Anonym. Das Werk ist als Brief eines Lehrers an einen Schüler namens Rheginos gestaltet; weder der Lehrer noch Rheginos lassen sich sicher identifizieren.
    audience: Christinnen und Christen, die Unterweisung über die Auferstehung suchten, besonders Leserinnen und Leser, die leibliche und geistliche Vorstellungen sowie die gegenwärtige Teilhabe am Auferstehungsleben gegeneinander abwogen.
    date: Gewöhnlich in das späte 2. Jahrhundert n. Chr. eingeordnet (oft etwa 170–200); erhalten in einer koptischen Abschrift aus dem 4. Jahrhundert, die auf ein älteres griechisches Werk zurückgeht.
    chapters:
      '1':
        title: Christus bringt die wahre Vollendung
      '2':
        title: Christus überwindet die Macht des Todes
      '3':
        title: Die Auferstehung verwandelt die Wirklichkeit
      '4':
        title: Die Gläubigen haben Anteil an der Auferstehung Christi
      '5':
        title: Glaube an die Auferstehung Christi
      '6':
        title: Die Weisheit der Erlösung bleibt für immer
      '7':
        title: Die Gnade bewahrt das ewige Leben
      '8':
        title: Die Auferstehung offenbart das wahre Leben
