      '12':
        title: Das Wort kehrt um und bringt Einheit
      '13':
        title: Stolz erzeugt Streit unter den Geistern
      '14':
        title: Der Erlöser stellt durch Erlösung alles wieder her
      '15':
        title: Die Botschaft der Erkenntnis stärkt das Wesen
      '16':
