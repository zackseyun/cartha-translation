  Hypostasis of the Archons:
    display_name: Die Hypostase der Archonten
    author: Anonym. Der Verfasser deutet die Genesis mithilfe eines Offenbarungsmythos über die Archonten; das Werk lässt sich keinem namentlich bekannten Lehrer sicher zuschreiben.
    audience: Christen in einem sethianischen oder verwandten Umfeld, die die Genesis als Konflikt zwischen unwissenden kosmischen Herrschern, göttlicher Weisheit und dem geistigen Ursprung der Menschheit lasen.
    date: Gewöhnlich in das 3. Jahrhundert n. Chr. datiert; überliefert in einer koptischen Abschrift aus dem 4. Jahrhundert im Nag-Hammadi-Kodex II.
    chapters:
