  Gospel of Philip:
    display_name: Philippusevangelium
    author: Anonym. Der Titel steht in der Schlussnotiz der Handschrift, doch das Werk bezeichnet Philippus nicht als seinen Verfasser. Die einzige erhaltene Kopie ist der koptische Text des Nag-Hammadi-Kodex II,3.
    audience: Eine frühchristliche Gemeinschaft, die mit einer valentinianisch geprägten sakramentalen Unterweisung vertraut war, besonders über Taufe, Salbung, Eucharistie, Erlösung, Auferstehung und die Bildwelt des Brautgemachs.
    date: Gewöhnlich auf das späte 2. oder frühe 3. Jahrhundert n. Chr. datiert; überliefert in einer koptischen Handschrift aus dem 4. Jahrhundert, die aus einer älteren griechischen Fassung übersetzt wurde.
