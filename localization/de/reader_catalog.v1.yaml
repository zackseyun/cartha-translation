  Treatise on the Resurrection:
    display_name: Abhandlung über die Auferstehung
    author: Anonym. Das Werk ist als Brief eines Lehrers an einen Schüler namens Rheginos gestaltet; weder der Lehrer noch Rheginos lassen sich sicher identifizieren.
    audience: Christinnen und Christen, die Unterweisung über die Auferstehung suchten, insbesondere Leserinnen und Leser, die leibliche, geistliche und bereits gegenwärtige Teilhabe am Leben der Auferstehung gegeneinander abwogen.
    date: Gewöhnlich in das späte 2. Jahrhundert n. Chr. eingeordnet (oft um 170–200); erhalten in einer koptischen Abschrift aus dem 4. Jahrhundert, die auf ein älteres griechisches Werk zurückgeht.
    chapters:
      '1':
        title: Christus bringt die wahre Vollendung
      '2':
