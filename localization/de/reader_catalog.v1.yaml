  Apocryphon of John:
    display_name: Apokryphon des Johannes
    author: Anonym. Das Werk gibt sich pseudonym als Offenbarung des auferstandenen Jesus an Johannes, den Sohn des Zebedäus, aus und ist in mehr als einer antiken Fassung erhalten.
    audience: Christinnen und Christen in einer sethianischen oder eng verwandten Offenbarungstradition, die nach einer Darstellung der göttlichen Welt, der Schöpfung, der menschlichen Identität und der Befreiung von feindlichen Herrschern suchten.
    date: Eine frühe Form war wahrscheinlich bereits im 2. Jahrhundert n. Chr. im Umlauf; die erhaltenen koptischen Textzeugen, die kürzere und längere Fassungen überliefern, stammen aus dem 4. und 5. Jahrhundert.
