    audience: Die Gemeinde in Philomelium und die weitere christliche Gemeinschaft, denen ein Bericht über Polykarps Verhaftung, Verhör, Tod und beispielhafte Standhaftigkeit vorgelegt wird.
    date: Nach Polykarps Tod verfasst, gewöhnlich in die Mitte oder die zweite Hälfte des 2. Jahrhunderts n. Chr. datiert; sowohl das genaue Jahr des Martyriums als auch die endgültige Form des Dokuments sind umstritten.
