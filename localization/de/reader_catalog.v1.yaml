  Leviticus:
    display_name: Levitikus
    author: Anonym; traditionell Mose zugeschrieben. Die heutige Forschung ordnet das Buch der Priesterschrift zu.
    audience: Israelitische Priester und die Gottesdienst feiernde Gemeinschaft — Anweisungen zu Opfern, Heiligkeit und zur Ausrichtung des Lebens auf Gottes Gegenwart.
    date: Entstehungsschichten von der späten Königszeit bis in die nachexilische Zeit (etwa 7.–5. Jahrhundert v. Chr.).
    chapters:
      '1':
        title: Brandopfer, die dem HERRN wohlgefällig sind
      '2':
