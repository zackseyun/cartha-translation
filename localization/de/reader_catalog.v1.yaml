  Dialogue of the Savior:
    display_name: Dialog des Erlösers
    author: Anonym. Der Dialog legt Jesus in Gesprächen mit Judas, Matthäus und Maria offenbarende Lehren in den Mund, nennt jedoch nicht, wer ihn zusammengestellt hat.
    audience: Ein frühchristlicher Kreis, der sich für private Offenbarung, Jüngerschaft, Selbsterkenntnis, Gebet und asketische Vorbereitung auf die Erlösung interessierte.
    date: Allgemein dem 2. Jahrhundert n. Chr. zugeordnet, obwohl seine Entstehungsschichten und die genaue Datierung umstritten bleiben; erhalten in einer koptischen Handschrift aus dem 4. Jahrhundert.
    chapters:
      '1':
        title: Jesus lehrt die wahre Ruhe
      '2':
        title: Gott führt zum ewigen Leben
      '3':
        title: Begegnet der Gefahr mit Freude
      '4':
        title: Bringt die Seele im Inneren in Ordnung
      '5':
        title: Sucht die Wahrheit jenseits des Leids
      '6':
        title: Reinigt das Herz im Inneren
      '7':
        title: Spiegelt die himmlische Güte wider
      '8':
        title: Göttliche Kraft erhält alles
      '9':
        title: Erkennt zuerst den göttlichen Ursprung
      '10':
        title: Schaut den ewigen Gott für immer
      '11':
        title: Kleidet euch in göttliches Licht
      '12':
        title: Offenbart den geistlichen Reichtum Christi
      '13':
