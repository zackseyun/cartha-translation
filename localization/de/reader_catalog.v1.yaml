  On the Origin of the World:
    display_name: Über den Ursprung der Welt
    author: Anonym. Das Werk verbindet und überarbeitet mehrere jüdische, christliche, platonische und mythologische Traditionen, ohne seinen Kompilator zu nennen.
    audience: Leser in einem gnostisierenden christlichen Umfeld, die nach einer Gegengeschichte über die Schöpfung, die kosmischen Herrscher, Sophia, Adam und Eva sowie das endgültige Schicksal der Welt suchten.
    date: Gewöhnlich in das 3. Jahrhundert n. Chr. datiert, wobei ihm älteres Material zugrunde liegen könnte; hauptsächlich in koptischen Textzeugen aus dem 4. Jahrhundert überliefert.
