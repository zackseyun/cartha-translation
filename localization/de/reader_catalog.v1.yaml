  Polycarp to the Philippians:
    display_name: Polykarp an die Philipper
    author: Polykarp, Bischof von Smyrna. Einige Fachleute verstehen den überlieferten Text als Zusammenfügung von Material, das zu mehr als einem Zeitpunkt versandt wurde.
    audience: Die christliche Gemeinde in Philippi, die um die Briefe des Ignatius gebeten hatte und Ratschläge zu Glauben, Lebensführung, Gemeindeleitung, Geld und standhaftem Ausharren erhielt.
    date: Frühes bis mittleres 2. Jahrhundert n. Chr.; zumindest ein Teil steht in engem Zusammenhang mit der Reise des Ignatius, während Annahmen eines zusammengesetzten Briefes einen etwas späteren Abschnitt für möglich halten.
