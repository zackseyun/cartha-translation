review:
  verdict: revise
  summary: Mehrere Formulierungen wurden idiomatisiert und enger am Ausgangstext ausgerichtet, insbesondere in Römer 3,25 und 1. Petrus 1,13. Die Metadaten und UI-Begriffe sind ansonsten sachgerecht lokalisiert.
  issues:
  - Römer 3,25 fügte mit „wirksam“ eine nicht im Ausgangstext stehende Deutung hinzu; „ungestraft gelassen“ ist stärker als „passed over“ und wurde durch „vorübergehen lassen“ ersetzt.
  - Die Alternativangabe zu δικαιοσύνη als „Rechtsprechung“ traf „justice“ nicht; sie wurde zu „Gerechtigkeit“ bzw. „Recht“ korrigiert.
  - In 1. Petrus 1,13 ist „klar und nüchtern“ doppelt und „bei der Offenbarung“ weniger treffend für die zeitliche Wendung; die Formulierung wurde geglättet.
  - Kohelet 1,2 verwendet nun die dem hebräischen Superlativ entsprechende, idiomatische Wendung „Hauch der Hauche“.
  - Einzelne Metadatenformulierungen wurden näher an die zeitliche bzw. relationale Aussage des englischen Ausgangstexts gebracht.
