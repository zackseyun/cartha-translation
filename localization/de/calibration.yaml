book_localizations:
- source_title: Genesis
  title: Genesis
  author: Anonym; traditionell Mose zugeschrieben. Die heutige Forschung geht von einer langen Entstehungsgeschichte aus, in deren Verlauf verschiedene Quellen später zusammengefügt und redaktionell bearbeitet wurden.
  audience: Israel in seiner Identität als Bundesvolk; das Buch verankert die Ursprungsgeschichte des Volkes in Gottes Schöpfung, Erwählung und Verheißung.
  date: Über Jahrhunderte hinweg entstanden; erhielt seine überlieferte Gestalt etwa im 6.–5. Jahrhundert v. Chr., während oder nach dem babylonischen Exil.
  summary: Genesis erzählt von der Schöpfung, der Auflehnung und Zerstreuung der Menschheit sowie von der Familie Abrahams, Isaaks, Jakobs und Josefs, durch die Gottes Bundesverheißungen an Israel ihren Anfang nehmen.
- source_title: John
  title: Johannes
  author: Anonym; die Tradition schreibt das Buch dem Apostel Johannes oder dem „geliebten Jünger“ zu.
  audience: Eine christliche Gemeinschaft in Spannung mit dem synagogalen Judentum, die sich um das Zeugnis des geliebten Jüngers formierte.
  date: Etwa 90–110 n. Chr.
  summary: Johannes stellt Jesus als das ewige Wort dar, das den Vater offenbart, durch Vertrauen auf ihn Leben gibt und durch seine Zeichen, seinen Tod und seine Auferstehung verherrlicht wird.
- source_title: Gospel of Thomas
  title: Thomasevangelium
  author: Anonym; die Einleitung schreibt die Spruchsammlung „Didymos Judas Thomas“ zu. Vollständig erhalten ist sie nur in einer koptischen Übersetzung aus dem 4. Jahrhundert aus Nag Hammadi (NHC II,2); hinzu kommen drei griechische Fragmente aus Oxyrhynchos.
  audience: Eine christliche Leserschaft, geprägt von syrischer Weisheit und protognostischem Denken und ausgerichtet auf esoterische Selbsterkenntnis in Jesu Worten.
  date: Das griechische Original entstand wahrscheinlich etwa 50–140 n. Chr.; die koptische Handschrift stammt etwa aus dem Jahr 340 n. Chr.
  summary: Das Thomasevangelium ist eine Sammlung von Aussprüchen, die Jesus zugeschrieben werden. Es enthält keine fortlaufende Handlung und fordert die Lesenden wiederholt dazu auf, die Bedeutung der Aussprüche zu entdecken.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Genesis 1,1
  text: Als Gott begann, Himmel und Erde zu erschaffen[a] —
  translator_note: '[a] Die traditionelle Übersetzung versteht dies als vollständigen Satz: „Am Anfang schuf Gott Himmel und Erde.“ Das Hebräische leitet jedoch natürlicher das Folgende ein; die Haupthandlung „Gott sprach“ steht in Vers 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Kohelet 1,2
  text: „Hauch der Hauche[a]“, sagt Kohelet[b]. „Alles ist Hauch – kurzlebig, nicht festzuhalten und oft anders, als wir erwarten.“
  translator_note: '[a] Das hebräische Wort hevel bedeutet wörtlich „Atemhauch“ oder „Dunst“. Im Buch Kohelet bezeichnet es, was rasch vergeht, sich nicht festhalten oder völlig begreifen lässt und oft anders ausfällt, als Menschen erwarten. „Hauch“ bewahrt dieses Bild, ohne zu behaupten, nichts habe einen Sinn. [b] Kohelet ist der hebräische Name oder Titel des Verfassers. Er wird oft mit „der Lehrer“ oder „der Prediger“ übersetzt. Hier bleibt „Kohelet“ stehen, um alle möglichen Bedeutungen offenzuhalten und keine Deutung zu bevorzugen.'
- source_path: nt/john/001/001.yaml
  reference: Johannes 1,1
  text: Am Anfang[b] existierte das Wort bereits. Das Wort war bei Gott, und das Wort war Gott.[a]
  translator_note: '[a] Auch möglich: „Das Wort war göttlich“ oder „Was Gott war, das war das Wort.“ Die griechische Formulierung bekräftigt, dass das Wort ganz Gott ist, und unterscheidet es zugleich von Gott im vorhergehenden Satzteil. [b] Dieser Anfang erinnert an Genesis 1,1 und verbindet das Wort mit dem Beginn der Schöpfung.'
- source_path: nt/romans/003/025.yaml
  reference: Römer 3,25
  text: Gott stellte ihn als Sühnopfer[a] durch den Glauben an sein Blut[b] dar. Er tat dies, um seine Gerechtigkeit[c] zu zeigen, weil er über die früher begangenen Sünden hinweggegangen war.
  translator_note: '[a] Auch möglich: „Sühne“ oder „Gnadenthron“ – die goldene Deckplatte der Bundeslade, auf die im Alten Testament sühnendes Blut gesprengt wurde. [b] Auch möglich: „durch den Glauben, durch sein Blut“. [c] Auch möglich: „Recht“.'
- source_path: nt/1_peter/001/013.yaml
  reference: 1. Petrus 1,13
  text: Darum macht euch innerlich zum Handeln bereit.[a] Seid ganz besonnen und setzt eure Hoffnung vollständig auf die Gnade, die euch bei der Offenbarung Jesu, des Messias, zuteilwird.[b]
  translator_note: '[a] Wörtlich heißt es im Griechischen: „Gürtet die Hüften eures Denkens.“ Das Bild zeigt, wie lange Kleidung um die Hüfte zusammengerafft wird, damit man zum Handeln bereit ist. [b] Das griechische Wort, das hier mit „ganz“ und „vollständig“ wiedergegeben wird, kann sich auf das Besonnensein, auf das Setzen der Hoffnung oder möglicherweise auf beides beziehen.'
