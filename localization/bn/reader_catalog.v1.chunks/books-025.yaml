payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: থমাসের শৈশবকালীন সুসমাচার
      author: লেখক অজ্ঞাত। এর প্রাচীনতম যে রূপটি পুনর্গঠন করা সম্ভব, তাতে কোনো লেখকের নাম নেই; থমাসের নামে আরোপটি পরবর্তী পাণ্ডুলিপির শিরোনাম ও পাঠ-পরম্পরা থেকে এসেছে।
      audience: যিশুর শৈশব সম্পর্কে এবং প্রচলিত সুসমাচারগুলোর বিবরণ শুরু হওয়ার আগে তাঁর ঐশী ক্ষমতা, শাসন, শিক্ষা ও পরিণত হয়ে ওঠাকে কীভাবে বর্ণনা করা যায়—এ বিষয়ে কৌতূহলী খ্রিস্টানরা।
      date: সাধারণত এর উৎস খ্রিস্টীয় দ্বিতীয় শতকে অনুসরণ করা হয়, তবে পাঠটি গ্রিক ভাষায় উল্লেখযোগ্যভাবে ভিন্ন একাধিক পাঠরূপ এবং প্রাচীন অনুবাদে সংরক্ষিত আছে।
    Acts of Paul and Thecla:
      display_name: পৌল ও থেকলার কার্যবিবরণী
      author: লেখক অজ্ঞাত। এটি বৃহত্তর ‘পৌলের কার্যবিবরণী’র একটি পর্ব; একজন প্রেসবিটার এই কার্যবিবরণী রচনা করেছিলেন বলে প্রাচীন একটি প্রতিবেদনে উল্লেখ থাকলেও, তা দিয়ে লেখককে নিশ্চিতভাবে শনাক্ত করা যায় না।
      audience: প্রেরিতদের প্রচার, কৌমার্যব্রত, বাপ্তিস্ম, শহিদের মতো সহনশীলতা এবং শিক্ষা দেওয়া ও সাক্ষ্য বহন করার ক্ষেত্রে একজন নারীর কর্তৃত্বের কাহিনিতে আকৃষ্ট খ্রিস্টানরা।
      date: খ্রিস্টীয় দ্বিতীয় শতকে, সম্ভবত শতকের শেষার্ধে, রচিত; এটি ‘পৌলের কার্যবিবরণী’র অংশ হিসেবে এবং স্বতন্ত্র রচনা হিসেবেও প্রচলিত ছিল।
    Gospel of Peter:
      display_name: পিতরের সুসমাচার
      author: লেখক অজ্ঞাত। সংরক্ষিত বিবরণটি পিতরের কণ্ঠে কথা বলে এবং তাঁর নামেই প্রচারিত হয়েছিল, তবে এটিকে ঐতিহাসিক প্রেরিত পিতরের রচনা বলে গণ্য করা হয় না।
      audience: যিশুর যাতনা ও পুনরুত্থানের বিস্তৃত বিবরণে আগ্রহী প্রাচীন খ্রিস্টানরা—সম্ভবত এমন সব সম্প্রদায়ে, যেখানে পিতরের কর্তৃত্ব বিশেষ গুরুত্ব বহন করত।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতকের রচনা বলে তারিখ নির্ধারণ করা হয়; এর প্রধান সংরক্ষিত গ্রিক খণ্ডটি আখমিমে পাওয়া আরও অনেক পরের একটি পাণ্ডুলিপি থেকে এসেছে।
    2 Clement:
      display_name: ২ ক্লেমেন্ট
      author: লেখক অজ্ঞাত। প্রচলিত শিরোনাম সত্ত্বেও, এটি রোমের ক্লেমেন্টের লেখা দ্বিতীয় পত্র নয়, বরং একটি প্রাচীন খ্রিস্টীয় ধর্মোপদেশ।
      audience: একটি খ্রিস্টীয় সমাবেশ, যাদের অনুতাপ, নৈতিক সামঞ্জস্য, অসহায়দের যত্ন এবং পুনরুত্থান ও বিচারের আশায় বিশ্বস্তভাবে অবিচল থাকার আহ্বান জানানো হয়েছে।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতকের প্রথমার্ধ বা মধ্যভাগের (আনুমানিক ১০০–১৬০ খ্রিস্টাব্দ) রচনা বলে তারিখ নির্ধারণ করা হয়; কোথায় এটি রচিত হয়েছিল, তা অনিশ্চিত।
    Epistle of Barnabas:
      display_name: বার্নাবাসের পত্র
      author: লেখক অজ্ঞাত। রচনাটি প্রচলিতভাবে পৌলের সহচর বার্নাবাসের সঙ্গে যুক্ত করা হয়েছিল, কিন্তু আধুনিক গবেষকেরা এই আরোপ গ্রহণ করেন না।
      audience: অ-ইহুদি খ্রিস্টানরা, যাদের খ্রিস্টকেন্দ্রিক ও রূপক ব্যাখ্যার মাধ্যমে ইস্রায়েলের শাস্ত্রকে নিজেদের বলে গ্রহণ করতে এবং ইহুদি আচার থেকে নিজেদের চুক্তিগত পরিচয়কে স্বতন্ত্র করতে শেখানো হচ্ছিল।
      date: সাধারণত ৭০ খ্রিস্টাব্দে জেরুসালেমের মন্দির ধ্বংস এবং খ্রিস্টীয় দ্বিতীয় শতকের শুরুর মধ্যবর্তী সময়ের, প্রায়ই আনুমানিক ৮০–১৩০ খ্রিস্টাব্দের রচনা বলে তারিখ নির্ধারণ করা হয়।
