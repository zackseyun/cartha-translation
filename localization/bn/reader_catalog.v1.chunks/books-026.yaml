      author: সাধারণভাবে স্বীকৃত মধ্যম পাঠরূপের সাতটি পত্রের রচয়িতা আন্তিয়খিয়ার বিশপ ইগনাতিয়াস; পরে সম্প্রসারিত এবং ইগনাতিয়াসের নামে ছদ্মনামে রচিত পত্রগুলো এই সংকলনের অন্তর্ভুক্ত নয়।
      audience: ইফিষ, ম্যাগনেশিয়া, ত্রাল্লেস, রোম, ফিলাদেলফিয়া ও স্মুর্ণার খ্রিস্টীয় সমাবেশগুলো এবং পলিকার্প—শহীদ হওয়ার পথে ইগনাতিয়াসের যাত্রাকালে এঁদের উদ্দেশে পত্রগুলো লেখা হয়েছিল।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর শুরুর দিকের, প্রায় ১০৫–১১৭ খ্রিস্টাব্দের রচনা বলে তারিখ নির্ধারণ করা হয়; তবে ইগনাতিয়াসের যাত্রার সুনির্দিষ্ট কালক্রম নিয়ে এখনও বিতর্ক রয়েছে।
