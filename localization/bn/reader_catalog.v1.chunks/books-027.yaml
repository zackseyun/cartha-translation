payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: ফিলিপীয়দের প্রতি পলিকার্পের পত্র
      author: স্মির্নার বিশপ পলিকার্প। কোনো কোনো পণ্ডিতের মতে, বর্তমানে প্রাপ্ত পাঠটিতে একাধিক সময়ে পাঠানো উপাদান একত্রিত হয়েছে।
      audience: ফিলিপির খ্রিস্টীয় সমাবেশ; তারা ইগ্নাতিয়ুসের পত্রগুলো চেয়েছিল এবং বিশ্বাস, আচরণ, নেতৃত্ব, অর্থ ও অধ্যবসায় সম্পর্কে পরামর্শ পেয়েছিল।
      date: খ্রিস্টীয় দ্বিতীয় শতাব্দীর প্রথম থেকে মধ্যভাগ; অন্তত একটি অংশ ইগ্নাতিয়ুসের যাত্রার সঙ্গে ঘনিষ্ঠভাবে সম্পর্কিত, আর এটি একাধিক পত্রের সমন্বয়—এমন মত মানলে কোনো একটি অংশ কিছুটা পরবর্তী সময়ের হতে পারে।
    Martyrdom of Polycarp:
      display_name: পলিকার্পের শহীদত্ব
      author: স্মির্নার মণ্ডলীর অজ্ঞাতনামা সদস্যরা, যারা সেই সম্প্রদায়ের নামে লিখেছেন; শেষের পাঠ-হস্তান্তরসংক্রান্ত টীকাগুলো পরবর্তী অনুলিপি ও প্রচারের ইতিহাস প্রতিফলিত করে।
      audience: ফিলোমেলিয়ামের মণ্ডলী এবং বৃহত্তর খ্রিস্টীয় সমাজ; তাদের কাছে পলিকার্পের গ্রেপ্তার, বিচার, মৃত্যু ও দৃষ্টান্তমূলক সহিষ্ণুতার বিবরণ তুলে ধরা হয়েছে।
      date: পলিকার্পের মৃত্যুর পরে রচিত; সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর মধ্যভাগ বা পরবর্তী সময়ে স্থির করা হয়। তবে শহীদত্বের সুনির্দিষ্ট বছর এবং নথিটির চূড়ান্ত রূপ—উভয় বিষয়েই বিতর্ক আছে।
    Epistle to Diognetus:
      display_name: দিয়োগনেতুসের প্রতি পত্র
      author: অজ্ঞাতনামা। লেখক নিজেকে একজন শিষ্য বা শিক্ষার্থী বলেছেন, কিন্তু তাঁকে বা যাঁর উদ্দেশে লেখা সেই দিয়োগনেতুসকে নির্ভরযোগ্যভাবে শনাক্ত করা যায় না।
      audience: একজন শিক্ষিত অখ্রিস্টীয় অনুসন্ধানী—এবং তাঁর মতো পাঠকেরা—যিনি খ্রিস্টীয় উপাসনা, নৈতিকতা, সামাজিক পরিচয়, প্রেম এবং এই বিশ্বাসকে আপাতদৃষ্টিতে নতুন মনে হওয়ার কারণ সম্পর্কে জানতে চেয়েছিলেন।
      date: প্রায়ই খ্রিস্টীয় দ্বিতীয় শতাব্দীর শেষভাগ বা তৃতীয় শতাব্দীর প্রথমভাগের রচনা বলে তারিখ নির্ধারণ করা হয়, যদিও প্রস্তাবিত সময়ের মধ্যে ব্যাপক পার্থক্য আছে; শেষ দুটি অধ্যায় অন্য কোনো রচনা থেকে আসতে পারে।
    Fragments of Papias:
      display_name: পাপিয়াসের খণ্ডাংশ
      author: মূল হারিয়ে যাওয়া পাঁচ খণ্ডের ‘প্রভুর বাণীর ব্যাখ্যা’ গ্রন্থের রচয়িতা হিয়েরাপোলিসের বিশপ পাপিয়াস; বর্তমানে টিকে থাকা সংকলনটি পরবর্তী লেখকদের সংরক্ষিত উদ্ধৃতি ও বিবরণ নিয়ে গঠিত।
      audience: যিশু ও প্রেরিতদের বিষয়ে স্মৃতিতে রক্ষিত শিক্ষা জানতে আগ্রহী প্রাচীন খ্রিস্টানেরা; এসব শিক্ষা মৌখিক সাক্ষ্য ও ব্যাখ্যার নামোল্লিখিত ধারাবাহিক সূত্র থেকে সংগ্রহ করা হয়েছিল।
      date: পাপিয়াসের রচনাটি সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর প্রথমভাগে, প্রায় ১১০–১৩০ খ্রিস্টাব্দে রচিত বলে ধরা হয়; টিকে থাকা খণ্ডাংশগুলো দ্বিতীয় শতাব্দী ও তার পরবর্তী সময়ের লেখকদের রচনায় পাওয়া যায়।
