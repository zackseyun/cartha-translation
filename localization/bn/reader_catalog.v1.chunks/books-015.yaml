  book_metadata:
    1 Esdras:
      display_name: ১ এসদ্রাস
      author: লেখক অজ্ঞাত; ২ বংশাবলি ৩৫–৩৬, এজরা এবং নহিমিয় ৭–৮-এর ঘটনাগুলো নতুন ক্রমে সাজিয়ে গ্রিক ভাষায় পুনর্গঠিত একটি রচনা।
      audience: হেলেনীয় যুগের সেই ইহুদিরা, যারা স্বদেশে প্রত্যাবর্তন ও পুনঃপ্রতিষ্ঠার একটি সুসংবদ্ধ বিবরণ চেয়েছিলেন।
      date: আনুমানিক খ্রিস্টপূর্ব ২য়–১ম শতাব্দী।
    Prayer of Manasseh:
      display_name: মনঃশির প্রার্থনা
      author: লেখক অজ্ঞাত; ছদ্মনামে রাজা মনঃশির রচনা বলে আরোপিত।
      audience: মনঃশির অনুতাপের সঙ্গে নিজেদের মিল খুঁজে পাওয়া অনুতপ্ত মানুষ—কিছু ঐতিহ্যে উপাসনায় ব্যবহৃত।
      date: আনুমানিক খ্রিস্টপূর্ব ২য়–১ম শতাব্দী।
    Psalm 151:
      display_name: গীতসংহিতা ১৫১
      author: লেখক অজ্ঞাত; ছদ্মনামে দায়ূদের রচনা বলে আরোপিত। 11QPsa-তে এর একটি হিব্রু রূপের প্রমাণ পাওয়া যায়।
      audience: দায়ূদের গীতসংহিতার প্রতি অনুরাগী প্রবাসী ও কুমরান সম্প্রদায়গুলো।
      date: আনুমানিক খ্রিস্টপূর্ব ২য় শতাব্দী বা তারও আগে।
    3 Maccabees:
      display_name: ৩ মাকাবীয়
      author: লেখক অজ্ঞাত; গ্রিক ভাষায় রচিত।
      audience: মিশরের গ্রিকভাষী প্রবাসী ইহুদিরা—চতুর্থ টলেমির শাসনামলে স্থাপিত মুক্তিলাভের এক কাহিনি।
      date: আনুমানিক খ্রিস্টপূর্ব ১ম শতাব্দী থেকে খ্রিস্টীয় ১ম শতাব্দী।
    4 Maccabees:
