payload:
  book_metadata:
    James:
      display_name: যাকোব
      author: ঐতিহ্যগতভাবে যিশুর ভাই যাকোব; আধুনিক গবেষকদের মধ্যে কেউ এটিকে তাঁর নিজের রচনা এবং কেউ তাঁর নামে লেখা রচনা বলে মনে করেন।
      audience: প্রবাসে থাকা ইহুদি-খ্রিস্টীয় সমাবেশগুলো।
      date: তাঁর নিজের রচনা হলে আনু. ৫০–৬০-এর দশক খ্রিস্টাব্দ; তাঁর নামে লেখা হলে আনু. ১ম শতাব্দীর শেষভাগ খ্রিস্টাব্দ।
    1 Peter:
      display_name: ১ পিতর
      author: ঐতিহ্যগতভাবে প্রেরিত পিতর, আর সীলবান ছিলেন লিপিকার; কিছু গবেষক এটিকে পিতরের নামে লেখা রচনা বলে মনে করেন।
      audience: রোমান এশিয়া মাইনরে সামাজিক বৈরিতার মুখোমুখি খ্রিস্টানরা।
      date: পিতরের রচনা হলে আনু. ৬০-এর দশক খ্রিস্টাব্দ; তাঁর নামে লেখা হলে আনু. ৭০–৯০-এর দশক খ্রিস্টাব্দ।
    2 Peter:
      display_name: ২ পিতর
      author: ঐতিহ্যগতভাবে পিতর; আধুনিক গবেষণায় ব্যাপকভাবে এটিকে তাঁর নামে লেখা রচনা বলে মনে করা হয়।
      audience: প্রভুর পুনরাগমন অস্বীকারকারী বিদ্রূপকারীদের মুখোমুখি খ্রিস্টানরা।
      date: আনু. ২য় শতাব্দীর প্রথমভাগ খ্রিস্টাব্দ।
    1 John:
      display_name: ১ যোহন
      author: নামহীন; ঐতিহ্যগতভাবে প্রেরিত যোহন অথবা যোহনীয় প্রবীণ।
      audience: একটি বিভেদের পর যোহনীয় সম্প্রদায়, যেখানে কারা এই সম্প্রদায়ের অন্তর্ভুক্ত তা নির্ধারণ করা হচ্ছিল।
      date: আনু. ৯০–১১০ খ্রিস্টাব্দ।
    2 John:
      display_name: ২ যোহন
      author: “প্রবীণ।”
      audience: একটি নির্দিষ্ট খ্রিস্টীয় সমাবেশ (“মনোনীতা ভদ্রমহিলা”), যাকে ভ্রান্ত শিক্ষকদের বিষয়ে সতর্ক করা হয়েছে।
      date: আনু. ৯০–১১০ খ্রিস্টাব্দ।
    3 John:
      display_name: ৩ যোহন
      author: “প্রবীণ।”
      audience: গায়, ভ্রাম্যমাণ মিশনারিদের আতিথ্যদানকারী একজন নেতা।
      date: আনু. ৯০–১১০ খ্রিস্টাব্দ।
    Jude:
      display_name: যিহূদা
      author: ঐতিহ্যগতভাবে যাকোব ও যিশুর ভাই যিহূদা।
      audience: স্বেচ্ছাচারী শিক্ষকদের অনুপ্রবেশের মুখোমুখি খ্রিস্টীয় সম্প্রদায়গুলো।
      date: আনু. ৬০–৯০-এর দশক খ্রিস্টাব্দ।
    Revelation:
      display_name: প্রকাশিত বাক্য
      author: পাতমোসের যোহন (চতুর্থ সুসমাচারের লেখনশৈলী থেকে তাঁর শৈলী স্বতন্ত্র)।
      audience: সাম্রাজ্যিক চাপের অধীন রোমান এশিয়া মাইনরের সাতটি খ্রিস্টীয় সমাবেশ।
      date: আনু. ৯০-এর দশক খ্রিস্টাব্দ; ঐতিহ্যগতভাবে ডোমিশিয়ানের রাজত্বকালে।
    Tobit:
      display_name: তোবিত
      author: নামহীন।
      audience: বিদেশি শাসনের অধীনে ধর্মনিষ্ঠা, বিবাহ ও ঈশ্বরীয় তত্ত্বাবধানের পথে চলা প্রবাসী ইহুদিরা।
      date: আনু. ২২৫–১৭৫ খ্রিস্টপূর্বাব্দ; আরামীয় ভাষায় রচিত, আর কুমরানে এর একটি হিব্রু সংস্করণেরও প্রমাণ পাওয়া গেছে।
    Judith:
      display_name: যিহূদিথ
      author: নামহীন।
      audience: বিদেশি হুমকির অধীন ইহুদিরা—ধর্মনিষ্ঠ প্রতিরোধের এক দৃঢ়চেতা কাহিনি।
      date: আনু. ১৫০–১০০ খ্রিস্টপূর্বাব্দ।
    Greek Additions to Esther:
      display_name: ইষ্টেরের গ্রিক সংযোজন
      author: নামহীন; ইষ্টেরের গ্রিক অনুবাদে যোগ করা সম্পূরক উপাদান।
      audience: গ্রিকভাষী ইহুদিরা, যারা ইষ্টেরের কাহিনিতে স্পষ্ট প্রার্থনা ও ঈশ্বরের উল্লেখ চেয়েছিলেন।
      date: আনু. ২য়–১ম শতাব্দী খ্রিস্টপূর্বাব্দ।
    Wisdom of Solomon:
      display_name: শলোমনের প্রজ্ঞা
      author: নামহীন; ছদ্মনামে শলোমনের প্রতি আরোপিত। সম্ভবত আলেকজান্দ্রিয়ায় কোনো হেলেনীয় ইহুদি লেখক গ্রিক ভাষায় এটি রচনা করেন।
      audience: গ্রিক দর্শনের সঙ্গে সংলাপে যুক্ত হেলেনীয় ইহুদিরা, যারা পৌত্তলিক ও ধর্মত্যাগী বিকল্পের বিপরীতে ইস্রায়েলের প্রজ্ঞার পক্ষে কথা বলছিলেন।
      date: আনু. ৫০ খ্রিস্টপূর্বাব্দ–৫০ খ্রিস্টাব্দ।
