    Numbers:
      display_name: গণনা পুস্তক
      author: লেখক অজ্ঞাত; প্রথাগতভাবে মোশির রচনা বলে মনে করা হয়।
      audience: মিশর থেকে প্রতিশ্রুত দেশের পথে যাত্রারত ইস্রায়েল—মরুপ্রান্তরের প্রজন্ম, এবং পরবর্তী কালের পাঠকেরা, যারা তাদের ব্যর্থতা থেকে শিক্ষা নেয়।
      date: রচনার বিভিন্ন স্তর রাজতন্ত্রের শেষভাগ থেকে নির্বাসন-পরবর্তী সময়ের (আনু. খ্রিস্টপূর্ব ৭ম–৫ম শতাব্দী)।
    Deuteronomy:
      display_name: দ্বিতীয় বিবরণ
      author: লেখক অজ্ঞাত; এটি মোশির বিদায়ী ভাষণ হিসেবে উপস্থাপিত। আধুনিক গবেষণা এর একটি মূল অংশকে খ্রিস্টপূর্ব ৭ম শতাব্দীর শেষভাগে যোশিয়ের অধীনে সংঘটিত সংস্কারের সময়ের বলে মনে করে।
      audience: দেশে প্রবেশের প্রস্তুতি নেওয়া ইস্রায়েল—এবং পরবর্তী কালে নির্বাসিতেরা, যারা মন্দির বা রাজা ছাড়া কীভাবে বিশ্বস্তভাবে জীবনযাপন করা যায় তা জানতে চেয়েছিল।
      date: মূল অংশ আনু. খ্রিস্টপূর্ব ৭ম শতাব্দীর শেষভাগের; নির্বাসনের সময়ে চূড়ান্ত রূপ লাভ করে।
    Joshua:
      display_name: যিহোশূয়
      author: লেখক অজ্ঞাত; এটি দ্বিতীয় বিবরণভিত্তিক ইতিহাসের অংশ।
      audience: রাজতন্ত্র ও নির্বাসনের সময়কার ইস্রায়েল, যারা দেশজয়, চুক্তি এবং দেশের তাৎপর্য নিয়ে চিন্তা করছিল।
      date: পুরোনো ঐতিহ্যগুলোর ভিত্তিতে আনু. খ্রিস্টপূর্ব ৭ম–৬ষ্ঠ শতাব্দীতে সংকলিত।
