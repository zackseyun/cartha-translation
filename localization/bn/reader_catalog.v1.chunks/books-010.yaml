payload:
  book_metadata:
    Joel:
      display_name: যোয়েল
      author: পথূয়েলের পুত্র যোয়েল।
      audience: পঙ্গপালের আক্রমণকে প্রভুর দিনের একটি চিহ্ন হিসেবে দেখে তার প্রতিক্রিয়া জানাচ্ছিল নির্বাসন-পরবর্তী যিহূদা।
      date: সম্ভবত খ্রিস্টপূর্ব পঞ্চম–চতুর্থ শতাব্দীর কাছাকাছি।
    Amos:
      display_name: আমোষ
      author: তকোয়ার আমোষ, যিহূদার একজন মেষপালক যিনি উত্তরের রাজ্যে প্রচার করেছিলেন।
      audience: দ্বিতীয় যারবিয়ামের অধীনে সমৃদ্ধি ও অবিচারের এক সময়ে উত্তর ইস্রায়েল।
      date: আনুমানিক খ্রিস্টপূর্ব ৭৬০–৭৫০ অব্দ।
    Obadiah:
      display_name: ওবদিয়
      author: ওবদিয়।
      audience: ইদোম যিরূশালেমের সঙ্গে বিশ্বাসঘাতকতা করার পরের যিহূদা—ইদোমের পতনবিষয়ক একটি ভবিষ্যদ্বাণী।
      date: খ্রিস্টপূর্ব ৫৮৬ অব্দের অল্পকাল পরে।
    Jonah:
      display_name: যোনা
      author: লেখক অজ্ঞাত; প্রধান চরিত্র অমিত্তয়ের পুত্র যোনা।
      audience: নির্বাসন-পরবর্তী ইস্রায়েল—জাতিগত সংকীর্ণতার প্রতি একটি ব্যঙ্গাত্মক তিরস্কার এবং বহিরাগতদের প্রতিও ঈশ্বরের করুণার স্বীকৃতি।
      date: সম্ভবত খ্রিস্টপূর্ব পঞ্চম–চতুর্থ শতাব্দীর কাছাকাছি।
    Micah:
      display_name: মীখা
      author: মোরেষতের মীখা।
      audience: খ্রিস্টপূর্ব অষ্টম শতাব্দীর শেষভাগের যিহূদা, বিশেষত নগরাঞ্চলের অভিজাতদের বিপরীতে সেখানকার গ্রামীণ দরিদ্রেরা।
      date: আনুমানিক খ্রিস্টপূর্ব ৭৪০–৭০০ অব্দ।
    Nahum:
      display_name: নহূম
      author: ইলকোশের নহূম।
      audience: নীনবীর আসন্ন পতন উদ্‌যাপনরত যিহূদা।
      date: খ্রিস্টপূর্ব ৬১২ অব্দের অল্পকাল আগে।
    Habakkuk:
      display_name: হবক্‌কূক
      author: হবক্‌কূক।
      audience: ব্যাবিলনের উত্থানের মুখোমুখি যিহূদা—ন্যায়বিচার নিয়ে ঈশ্বরের সঙ্গে একজন ভাববাদীর সংলাপ।
      date: আনুমানিক খ্রিস্টপূর্ব সপ্তম শতাব্দীর শেষভাগ।
    Zephaniah:
      display_name: সফনিয়
      author: কূশির পুত্র সফনিয়।
      audience: যোশিয়ের শাসনাধীন যিহূদা, তাঁর সংস্কারগুলোর ঠিক আগের সময়ে।
      date: আনুমানিক খ্রিস্টপূর্ব ৬৪০–৬০৯ অব্দ।
    Haggai:
      display_name: হগয়
      author: হগয়।
      audience: দারিয়াবসের অধীনে মন্দির পুনর্নির্মাণরত স্বদেশে ফেরা লোকেরা।
      date: খ্রিস্টপূর্ব ৫২০ অব্দ।
    Zechariah:
      display_name: সখরিয়
      author: বেরিখিয়ের পুত্র সখরিয়; ৯–১৪ অধ্যায় সম্ভবত পরবর্তী কোনো লেখকের রচনা।
      audience: মন্দির পুনর্নির্মাণরত স্বদেশে ফেরা লোকেরা এবং নির্বাসন-পরবর্তী সময়ের আরও পরের সম্প্রদায়গুলো।
      date: ১–৮ অধ্যায় আনুমানিক খ্রিস্টপূর্ব ৫২০–৫১৮ অব্দ; ৯–১৪ অধ্যায় সম্ভবত প্রায় এক শতাব্দী পরের।
    Malachi:
      display_name: মালাখি
      author: লেখক অজ্ঞাত; “মালাখি” অর্থ “আমার বার্তাবাহক।”
      audience: পারস্যের শাসনাধীন নির্বাসন-পরবর্তী যিহূদা, যেখানে উপাসনা ও বিশ্বস্ততায় শিথিলতা বাড়ছিল।
      date: আনুমানিক খ্রিস্টপূর্ব পঞ্চম শতাব্দীর মধ্যভাগ।
    Matthew:
      display_name: মথি
      author: লেখক অজ্ঞাত; প্রচলিত মত অনুসারে প্রেরিত মথি এর রচয়িতা। আধুনিক গবেষকদের মতে, গ্রিকভাষী একজন ইহুদি খ্রিস্টান লেখক মার্ক এবং ‘কিউ’-সদৃশ একটি উৎস ব্যবহার করে এটি লিখেছিলেন।
      audience: সমাজগৃহকেন্দ্রিক ইহুদি ধর্মের সঙ্গে ধারাবাহিকতা ও বিচ্ছিন্নতা নিয়ে চিন্তাশীল একটি ইহুদি খ্রিস্টান সম্প্রদায়।
      date: আনুমানিক খ্রিস্টাব্দ ৮০–৯০।
    Mark:
      display_name: মার্ক
      author: লেখক অজ্ঞাত; প্রচলিত মত একে পিতরের ভ্রমণসঙ্গী যোহন মার্কের সঙ্গে যুক্ত করে।
      audience: গ্রিকভাষী একটি খ্রিস্টান সম্প্রদায়, সম্ভবত রোমে, যারা নির্যাতনের মুখে বা তার আশঙ্কার মধ্যে ছিল।
      date: আনুমানিক খ্রিস্টাব্দ ৬৫–৭৫, ইহুদি যুদ্ধ ও মন্দির ধ্বংসের সময়ের কাছাকাছি।
