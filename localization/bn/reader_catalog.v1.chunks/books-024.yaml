payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: শাসকদের প্রকৃতি
      author: লেখক অজ্ঞাত। লেখক শাসকদের নিয়ে এক প্রত্যাদেশমূলক পুরাণের আলোকে আদিপুস্তকের ব্যাখ্যা করেছেন; কোনো নামধারী শিক্ষকের রচনা বলে এটি নিশ্চিতভাবে নির্ধারণ করা যায় না।
      audience: সেথীয় বা সংশ্লিষ্ট পরিমণ্ডলের সেই খ্রিস্টানরা, যারা আদিপুস্তককে অজ্ঞ মহাজাগতিক শাসক, ঐশী প্রজ্ঞা ও মানবজাতির আত্মিক উৎসের মধ্যকার সংঘাত হিসেবে পাঠ করতেন।
      date: সাধারণত খ্রিস্টীয় তৃতীয় শতাব্দীর রচনা বলে ধরা হয়; নাগ হাম্মাদি কোডেক্স ২-এ এর চতুর্থ শতাব্দীর একটি কপটিক অনুলিপি সংরক্ষিত আছে।
    On the Origin of the World:
      display_name: জগতের উৎপত্তি সম্পর্কে
      author: লেখক অজ্ঞাত। সংকলকের নাম উল্লেখ না করেই এই রচনায় বিভিন্ন ইহুদি, খ্রিস্টীয়, প্লেটোনীয় ও পৌরাণিক ঐতিহ্য একত্র করে পুনর্বিন্যস্ত করা হয়েছে।
      audience: জ্ঞানবাদী প্রবণতাসম্পন্ন খ্রিস্টীয় পরিমণ্ডলের সেই পাঠকেরা, যারা সৃষ্টি, মহাজাগতিক শাসকেরা, সোফিয়া, আদম ও হবা এবং জগতের চূড়ান্ত পরিণতি সম্পর্কে একটি বিকল্প ইতিহাস জানতে চাইতেন।
      date: সাধারণত খ্রিস্টীয় তৃতীয় শতাব্দীর রচনা বলে নির্ধারণ করা হয়, যদিও এর অন্তর্নিহিত কিছু উপাদান আরও প্রাচীন হতে পারে; প্রধানত চতুর্থ শতাব্দীর কপটিক পাণ্ডুলিপিতে এটি সংরক্ষিত আছে।
    Sophia of Jesus Christ:
      display_name: যিশু খ্রিস্টের প্রজ্ঞা
      author: লেখক অজ্ঞাত। ইউগ্নোস্টোস গ্রন্থেও পরিচিত উপাদানকে লেখক যিশু ও তাঁর শিষ্যদের মধ্যে পুনরুত্থান-পরবর্তী সংলাপের রূপ দিয়েছেন।
      audience: পরমাতীত ঈশ্বর, স্বর্গীয় জগতের বিন্যাস এবং আত্মার উৎস ও পরিত্রাণ সম্পর্কে প্রত্যাদিষ্ট প্রজ্ঞায় আগ্রহী খ্রিস্টানরা।
      date: প্রায়ই খ্রিস্টীয় দ্বিতীয় শতাব্দীর শেষভাগ বা তৃতীয় শতাব্দীর রচনা বলে নির্ধারণ করা হয়; নাগ হাম্মাদি ও বার্লিন কোডেক্সের কপটিক অনুলিপিতে এটি সংরক্ষিত আছে।
    Gospel of the Egyptians:
      display_name: মিশরীয়দের সুসমাচার
      author: লেখক অজ্ঞাত। নাগ হাম্মাদির এই রচনাটি ‘মহান অদৃশ্য আত্মার পবিত্র গ্রন্থ’ নামেও পরিচিত; এটি কেবল উদ্ধৃতির মাধ্যমে পরিচিত আরও আগের গ্রিক ‘মিশরীয়দের সুসমাচার’ থেকে স্বতন্ত্র।
      audience: একটি সেথীয় খ্রিস্টীয় সম্প্রদায়, যারা আত্মিক পরিচয় ও মুক্তি প্রকাশ করতে ঘন পৌরাণিক বর্ণনা, পবিত্র নাম, বাপ্তিস্মের চিত্রকল্প ও স্তোত্রধর্মী প্রশংসা ব্যবহার করত।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় বা তৃতীয় শতাব্দীর রচনা বলে মনে করা হয়; চতুর্থ শতাব্দীর নাগ হাম্মাদি কোডেক্সগুলোতে এর দুটি কপটিক অনুলিপি টিকে আছে।
    Letter of Peter to Philip:
      display_name: ফিলিপের কাছে পিতরের পত্র
      author: লেখক অজ্ঞাত। সংক্ষিপ্ত প্রারম্ভিক পত্রটি ও তার পরের প্রত্যাদেশটি ছদ্মনামে পিতর ও ফিলিপের সঙ্গে যুক্ত; কোনো প্রেরিতই নিশ্চিতভাবে এর লেখক নন।
      audience: সেই খ্রিস্টানরা, যারা ত্রাণকর্তা, বৈরী শক্তি, দুঃখভোগ, প্রচারকার্য ও শিষ্যদের পুনঃপ্রতিষ্ঠা-বিষয়ক শিক্ষার জন্য প্রেরিতদের অনুমোদন খুঁজতেন।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর শেষভাগ বা তৃতীয় শতাব্দীর প্রথমভাগের রচনা বলে নির্ধারণ করা হয়; চতুর্থ শতাব্দীর নাগ হাম্মাদির একটি অনুলিপি ও পরবর্তী কালের একটি কপটিক পাণ্ডুলিপিতে এটি সংরক্ষিত আছে।
    Gospel of Judas:
      display_name: যিহূদার সুসমাচার
      author: লেখক অজ্ঞাত। শিরোনামটি এই বিবরণ যিহূদার নামে আরোপ করে, কিন্তু রচনাটি ঐতিহাসিক লেখক হিসেবে যিহূদা ইষ্করিয়োতীয়ের পরিচয় প্রতিষ্ঠা করে না।
      audience: প্রতিদ্বন্দ্বী গোষ্ঠীর বলিদানমূলক ও মণ্ডলীগত আচারের সমালোচক একটি খ্রিস্টীয় গোষ্ঠী, যারা প্রত্যাদেশমূলক সংলাপ ও সেথীয় ধরনের বিশ্বতত্ত্ব ব্যবহার করে যিহূদা ও যিশুর মৃত্যুর নতুন ব্যাখ্যা দিত।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর মধ্যভাগ বা শেষভাগের রচনা বলে নির্ধারণ করা হয়; আনুমানিক ১৮০ খ্রিস্টাব্দ নাগাদ ইরেনিয়াস ‘যিহূদার সুসমাচার’ নামে একটি রচনার কথা জানতেন, আর টিকে থাকা কপটিক অনুলিপিটি সম্ভবত তৃতীয় বা চতুর্থ শতাব্দীর।
    Protoevangelium of James:
      display_name: যাকোবের আদি সুসমাচার
      author: লেখক অজ্ঞাত। কথক নিজেকে যাকোব বলে দাবি করেন, কিন্তু রচনাটি ছদ্মনামে লেখা এবং যিশুর ভাই যাকোবের রচনা নয়।
      audience: মরিয়মের জন্ম ও লালনপালন, তাঁর চিরস্থায়ী পবিত্রতা, যিশুর জন্ম এবং মথি ও লূকের বিবরণে অনুত্তরিত প্রশ্নগুলোর কাহিনিভিত্তিক উত্তরে আগ্রহী খ্রিস্টানরা।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর শেষার্ধের রচনা বলে নির্ধারণ করা হয়; পরবর্তী কালের বহু গ্রিক পাণ্ডুলিপি ও প্রাচীন অনুবাদে এটি টিকে আছে。
