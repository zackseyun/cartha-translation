  book_metadata:
    Ezra:
      display_name: ইষ্রা
      author: লেখক অজ্ঞাত; সম্ভবত বংশাবলি গ্রন্থের রচয়িতারই লেখা।
      audience: পারস্যের শাসনাধীন অবস্থায় যিরূশালেম পুনর্নির্মাণে নিয়োজিত স্বদেশে ফেরা নির্বাসিতেরা।
      date: আনুমানিক খ্রিস্টপূর্ব পঞ্চম শতাব্দীর মাঝামাঝি থেকে চতুর্থ শতাব্দী।
    Nehemiah:
      display_name: নহিমিয়
      author: লেখক অজ্ঞাত; এতে নহিমিয়ের রচনা বলে বিবেচিত একটি উত্তমপুরুষে লেখা স্মৃতিকথা অন্তর্ভুক্ত রয়েছে।
      audience: পারস্যের শাসনাধীন অবস্থায় যিরূশালেমের প্রাচীর পুনর্নির্মাণ ও চুক্তি নবায়নে নিয়োজিত স্বদেশে ফেরা নির্বাসিতেরা।
      date: আনুমানিক খ্রিস্টপূর্ব পঞ্চম শতাব্দীর মাঝামাঝি থেকে চতুর্থ শতাব্দী।
    Esther:
      display_name: ইষ্টের
      author: লেখক অজ্ঞাত।
      audience: বিদেশি শাসনের অধীনে প্রবাসী ইহুদিরা, বিশেষত পারস্যে বসবাসকারীরা।
      date: আনুমানিক পারস্য যুগের শেষভাগ বা হেলেনীয় যুগের প্রথমভাগ (খ্রিস্টপূর্ব চতুর্থ–তৃতীয় শতাব্দী)।
    Job:
      display_name: ইয়োব
      author: লেখক অজ্ঞাত।
      audience: নির্দোষ মানুষের দুঃখভোগ ও ঈশ্বরের ন্যায়বিচার নিয়ে ভাবনায় সংগ্রামরত ইস্রায়েলীয়েরা।
      date: প্রজ্ঞাসাহিত্য-বিষয়ক সাধারণ মত অনুসারে, আরও পুরোনো লোকজ উপাদানের ভিত্তিতে গ্রন্থটি আনুমানিক খ্রিস্টপূর্ব ষষ্ঠ–চতুর্থ শতাব্দীতে রচিত।
    Psalms:
      display_name: গীতসংহিতা
      author: কয়েক শতাব্দীজুড়ে একাধিক লেখক; শিরোনামগুলোতে দায়ূদ, আসফ, কোরহ, শলোমন, মোশি ও অন্যদের নাম রয়েছে।
      audience: উপাসনারত ইস্রায়েল ও মন্দিরের সমবেত সমাজ—এবং পরবর্তী যুগের প্রার্থনা ও বিলাপকারী প্রতিটি সম্প্রদায়।
      date: আনুমানিক খ্রিস্টপূর্ব দশম–তৃতীয় শতাব্দীতে রচিত; নির্বাসন-পরবর্তী সময়ে চূড়ান্ত সংকলন সম্পন্ন হয়।
