review:
  verdict: revise
  review_summary: সম্পূর্ণ বাংলা ক্যাটালগটি সংশোধন করা হয়েছে। কয়েকটি শিরোনামে উৎসের অর্থ আরও নির্ভুল করা হয়েছে এবং রানী বষ্টীর ক্ষেত্রে ‘নির্বাসিত’ শব্দের অতিরিক্ত ঐতিহাসিক ইঙ্গিত সরানো হয়েছে।
