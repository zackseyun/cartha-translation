      display_name: সিরাখ
      author: জেরুসালেমের যেশুয়া বেন এলিয়াজার বেন সিরা; তাঁর নাতির গ্রিক অনুবাদ।
      audience: হেলেনীয় যুগের জেরুসালেমে প্রজ্ঞার শিক্ষায় প্রশিক্ষণরত তরুণ ইহুদি পুরুষেরা।
      date: হিব্রু মূল রচনা আনুমানিক খ্রিস্টপূর্ব ১৯৫–১৭৫ অব্দে; গ্রিক অনুবাদ আনুমানিক খ্রিস্টপূর্ব ১৩২ অব্দে।
    Baruch:
      display_name: বারূক
      author: অজ্ঞাতনামা; যিরমিয়ের লেখক বারূকের নামে ছদ্মভাবে আরোপিত।
      audience: নির্বাসন, অনুতাপ ও প্রজ্ঞা নিয়ে চিন্তাশীল প্রবাসী ইহুদিরা।
      date: আনুমানিক খ্রিস্টপূর্ব দ্বিতীয় শতাব্দী।
