review:
  verdict: revise
  review_summary: সম্পূর্ণ অংশটি পর্যালোচনা করে খসড়ার অধিকাংশ অনুবাদ বজায় রাখা হয়েছে। কয়েকটি অধ্যায়-শিরোনামে উৎসের অর্থ আরও নির্ভুলভাবে প্রতিফলিত করতে সংশোধন করা হয়েছে।
