    Thunder, Perfect Mind:
      display_name: বজ্রধ্বনি, পরিপূর্ণ মন
      author: অজ্ঞাতনামা।
      audience: গ্রিক-মিশরীয় প্রজ্ঞাসাহিত্য বা জ্ঞানবাদে আগ্রহী পাঠকসমাজ; এক ঐশী নারীমূর্তির কণ্ঠে রচিত লিঙ্গ-পরিচয়ভিত্তিক আত্মপ্রকাশের কবিতা।
      date: সম্ভবত খ্রিষ্টীয় ১ম–২য় শতাব্দী; নাগ হাম্মাদিতে সংরক্ষিত (NHC VI,2)।
    Testament of Reuben:
      display_name: রূবেণের অন্তিম বাণী
