payload:
  book_metadata:
    Gospel of Mary:
      display_name: মরিয়মের সুসমাচার
      author: লেখক অজ্ঞাত। রচনাটিতে মরিয়মকে যিশুর প্রকাশিত সত্যের গ্রহীতা ও ব্যাখ্যাকার হিসেবে উপস্থাপন করা হয়েছে, কিন্তু এতে দাবি করা হয়নি যে টিকে থাকা সুসমাচারটি মরিয়ম লিখেছিলেন।
      audience: প্রকাশিত সত্য, আত্মিক ঊর্ধ্বারোহণ, প্রেরিতদের কর্তৃত্ব এবং যিশুর শিষ্যদের মধ্যে মরিয়মের শিক্ষাদানের বৈধতা নিয়ে ভাবনায় রত প্রাচীন খ্রিস্টীয় পাঠকেরা।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর রচনা বলে মনে করা হয়; তৃতীয় শতাব্দীর গ্রিক খণ্ডাংশ টিকে আছে, আর প্রধান কপটিক সাক্ষ্যটি পঞ্চম শতাব্দীর বার্লিন কোডেক্স ৮৫০২-এ সংরক্ষিত।
    Treatise on the Resurrection:
      display_name: পুনরুত্থান-বিষয়ক আলোচনা
      author: লেখক অজ্ঞাত। রচনাটি রেগিনোস নামের এক শিক্ষার্থীর প্রতি একজন শিক্ষকের চিঠি হিসেবে বিন্যস্ত; শিক্ষক বা রেগিনোস—কাউকেই নিশ্চিতভাবে শনাক্ত করা যায় না।
      audience: পুনরুত্থান সম্বন্ধে শিক্ষা অন্বেষণকারী খ্রিস্টানেরা, বিশেষত সেই পাঠকেরা, যাঁরা পুনরুত্থানের জীবনে দেহগত, আত্মিক এবং বর্তমান অংশগ্রহণের ধারণাগুলি বিবেচনা করছিলেন।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর শেষভাগের রচনা বলে ধরা হয় (প্রায়ই আনুমানিক ১৭০–২০০ খ্রিস্টাব্দ); আগের একটি গ্রিক রচনার চতুর্থ শতাব্দীর কপটিক অনুলিপিতে এটি সংরক্ষিত।
    Dialogue of the Savior:
      display_name: ত্রাণকর্তার সংলাপ
      author: লেখক অজ্ঞাত। সংলাপটিতে যিহূদা, মথি ও মরিয়মের সঙ্গে কথোপকথনের মধ্যে যিশুর মুখে প্রকাশিত সত্যের শিক্ষা দেওয়া হয়েছে, কিন্তু এর সংকলকের পরিচয় দেওয়া হয়নি।
      audience: ব্যক্তিগত প্রকাশিত সত্য, শিষ্যত্ব, আত্মজ্ঞান, প্রার্থনা এবং পরিত্রাণের জন্য তপস্যামূলক প্রস্তুতিতে আগ্রহী একটি প্রাচীন খ্রিস্টীয় গোষ্ঠী।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর রচনা বলে ধরা হয়, যদিও এর রচনাগত স্তরগুলি ও সুনির্দিষ্ট তারিখ নিয়ে মতভেদ রয়েছে; চতুর্থ শতাব্দীর একটি কপটিক পাণ্ডুলিপিতে এটি সংরক্ষিত।
    Exegesis on the Soul:
      display_name: আত্মা-বিষয়ক ব্যাখ্যা
      author: লেখক অজ্ঞাত। লেখক একজন খ্রিস্টীয় ধর্মোপদেশক, যিনি বাইবেলীয় ও গ্রিক সাহিত্যের চিত্রকল্পকে আত্মার পতন, অনুতাপ ও পুনঃপ্রতিষ্ঠার রূপক হিসেবে নতুনভাবে পাঠ করেছেন।
      audience: শাস্ত্র ও নৈতিক উপদেশের সঙ্গে পরিচিত সেই খ্রিস্টানেরা, যাঁদের বিশৃঙ্খল কামনা থেকে ফিরে অনুতাপ করতে এবং ঐশী সত্তার সঙ্গে পুনর্মিলিত হতে আহ্বান জানানো হচ্ছিল।
      date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর শেষভাগ বা তৃতীয় শতাব্দীর প্রথমভাগের রচনা বলে মনে করা হয়; গ্রিক থেকে করা চতুর্থ শতাব্দীর একটি কপটিক অনুবাদে এটি সংরক্ষিত।
    Book of Thomas the Contender:
      display_name: প্রতিদ্বন্দ্বী থোমার পুস্তক
      author: লেখক অজ্ঞাত। শেষের শিরোনামটি রচনাটিকে যিহূদা থোমার সঙ্গে যুক্ত করে এবং মাত্থাইয়াসকে লিপিবদ্ধকারী হিসেবে উল্লেখ করে, তবে এগুলি যাচাইযোগ্য লেখকত্বের দাবি নয়, বরং সাহিত্যিক আরোপ।
      audience: তপস্যাপ্রবণ সেই খ্রিস্টানেরা, যাঁদের আত্মজ্ঞান অন্বেষণ করতে, দেহগত কামনা প্রতিরোধ করতে এবং থোমাকে দেওয়া যিশুর ব্যক্তিগত শিক্ষা বুঝতে আহ্বান জানানো হয়েছিল।
      date: প্রায়ই খ্রিস্টীয় দ্বিতীয় শতাব্দীর শেষভাগ বা তৃতীয় শতাব্দীর প্রথমভাগের রচনা বলে মনে করা হয়, সম্ভবত সিরীয় খ্রিস্টীয় পরিমণ্ডলে; চতুর্থ শতাব্দীর একটি কপটিক পাণ্ডুলিপিতে এটি সংরক্ষিত।
    Tripartite Tractate:
      display_name: ত্রিভাগী আলোচনা
      author: লেখক অজ্ঞাত। লেখক ছিলেন অত্যন্ত শিক্ষিত একজন ভ্যালেন্টিনীয় খ্রিস্টীয় ধর্মতত্ত্ববিদ; কোনো নামধারী শিক্ষকের সঙ্গে তাঁকে নিশ্চিতভাবে শনাক্ত করা সম্ভব নয়।
      audience: ঈশ্বর, এয়নসমূহ, সৃষ্টি, খ্রিস্ট, মণ্ডলী, পরিত্রাণ এবং চূড়ান্ত পুনঃপ্রতিষ্ঠা সম্পর্কে ধারাবাহিক শিক্ষা গ্রহণকারী একটি ভ্যালেন্টিনীয় খ্রিস্টীয় সম্প্রদায়।
      date: সাধারণত খ্রিস্টীয় তৃতীয় শতাব্দীর রচনা বলে মনে করা হয়; কিছু যুক্তি শতাব্দীটির শেষার্ধের পক্ষে। চতুর্থ শতাব্দীর ইয়ুং কোডেক্সে কপটিক ভাষায় এটি সংরক্ষিত।
    Apocryphon of John:
      display_name: যোহনের গোপন গ্রন্থ
      author: লেখক অজ্ঞাত। রচনাটি ছদ্মনামে জেবদিয়ের পুত্র যোহনের কাছে পুনরুত্থিত যিশুর দেওয়া এক প্রকাশিত সত্য হিসেবে নিজেকে উপস্থাপন করে এবং এটি একাধিক প্রাচীন পাঠরূপে টিকে আছে।
      audience: সেথীয় বা ঘনিষ্ঠভাবে সম্পর্কিত কোনো প্রকাশিত-সত্যের ধারার সেই খ্রিস্টানেরা, যাঁরা ঐশী জগৎ, সৃষ্টি, মানব-পরিচয় এবং বৈরী শাসকদের কবল থেকে মুক্তির বিবরণ খুঁজছিলেন।
      date: এর একটি প্রাথমিক রূপ সম্ভবত খ্রিস্টীয় দ্বিতীয় শতাব্দীতে প্রচলিত ছিল; সংক্ষিপ্ত ও দীর্ঘ—উভয় পাঠরূপ সংরক্ষণকারী টিকে থাকা কপটিক সাক্ষ্যগুলি চতুর্থ ও পঞ্চম শতাব্দীর।
