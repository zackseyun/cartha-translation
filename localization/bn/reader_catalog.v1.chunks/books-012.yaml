payload:
  book_metadata:
    1 Corinthians:
      display_name: ১ করিন্থীয়
      author: পৌল, সঙ্গে সোস্থিনিস।
      audience: করিন্থের দ্বন্দ্ব-বিভক্ত খ্রিস্টীয় সমাবেশ।
      date: আনুমানিক ৫৩–৫৫ খ্রিস্টাব্দ; ইফিষ থেকে লেখা।
    2 Corinthians:
      display_name: ২ করিন্থীয়
      author: পৌল, সঙ্গে তীমথিয়।
      audience: এক বেদনাদায়ক সংঘাতের পর করিন্থের সমাবেশ।
      date: আনুমানিক ৫৫–৫৬ খ্রিস্টাব্দ।
    Galatians:
      display_name: গালাতীয়
      author: পৌল।
      audience: গালাতিয়ার (মধ্য আনাতোলিয়া) খ্রিস্টীয় সমাবেশগুলো, যাদের সুন্নত ও তোরাহ পালন গ্রহণের জন্য চাপ দেওয়া হচ্ছিল।
      date: আনুমানিক ৪৮–৫৫ খ্রিস্টাব্দ (বিতর্কিত)।
    Ephesians:
      display_name: ইফিষীয়
      author: পৌল, অথবা পৌলের নামে লেখা তাঁর কোনো ঘনিষ্ঠ শিষ্য (বিতর্কিত)।
      audience: এশিয়া অঞ্চলের খ্রিস্টানদের সাধারণ পাঠকগোষ্ঠী; প্রাচীনতম পাণ্ডুলিপিগুলোতে “ইফিষ” স্থাননামটি নেই।
      date: পৌলের লেখা হলে আনুমানিক ৬০-এর দশক; ছদ্মনামে লেখা হলে আনুমানিক ৮০–৯০-এর দশক খ্রিস্টাব্দ।
    Philippians:
      display_name: ফিলিপীয়
      author: পৌল, সঙ্গে তীমথিয়।
      audience: মাকিদনিয়ার রোমীয় উপনিবেশ ফিলিপির খ্রিস্টীয় সমাবেশ।
      date: আনুমানিক ৬০–৬২ খ্রিস্টাব্দ; কারাগার থেকে লেখা।
    Colossians:
      display_name: কলসীয়
      author: পৌল, সঙ্গে তীমথিয়—অথবা পৌলের নামে তাঁর কোনো ঘনিষ্ঠ শিষ্য (বিতর্কিত)।
      audience: লিকুস উপত্যকার কলসীর খ্রিস্টানরা, যারা একটি সমন্বয়বাদী শিক্ষার মুখোমুখি হয়েছিল।
      date: পৌলের লেখা হলে আনুমানিক ৬০–৬২ খ্রিস্টাব্দ; ছদ্মনামে লেখা হলে আরও পরে।
    1 Thessalonians:
      display_name: ১ থিষলনীকীয়
      author: পৌল, সঙ্গে সীল ও তীমথিয়।
      audience: নির্যাতনের মুখোমুখি থিষলনীকার নবীন খ্রিস্টীয় সমাবেশ।
      date: আনুমানিক ৫০–৫১ খ্রিস্টাব্দ—সম্ভবত টিকে থাকা পৌলীয় পত্রগুলোর মধ্যে প্রাচীনতম।
    2 Thessalonians:
      display_name: ২ থিষলনীকীয়
      author: পৌল (বিতর্কিত; কিছু গবেষকের মতে এটি ছদ্মনামে লেখা)।
      audience: শেষকাল-সংক্রান্ত বিভ্রান্তির মোকাবিলা করা থিষলনীকার সমাবেশ।
      date: পৌলের লেখা হলে আনুমানিক ৫১ খ্রিস্টাব্দ।
    1 Timothy:
      display_name: ১ তীমথিয়
      author: পৌল, অথবা পৌলের নামে লেখা কোনো শিষ্য (পালকীয় পত্রগুলোকে ব্যাপকভাবে ছদ্মনামে লেখা বলে মনে করা হয়)।
      audience: ইফিষে পৌলের প্রতিনিধি হিসেবে তীমথিয়; পরবর্তী কালের মণ্ডলী-ব্যবস্থার জন্য একটি নির্দেশিকা।
      date: পৌলের লেখা হলে আনুমানিক ৬০-এর দশকের মাঝামাঝি; ছদ্মনামে লেখা হলে আনুমানিক ৯০–১১০ খ্রিস্টাব্দ।
    2 Timothy:
      display_name: ২ তীমথিয়
      author: পৌল, অথবা পৌলের নামে কোনো শিষ্য।
      audience: তীমথিয়—পত্রটি কারাগার থেকে পৌলের বিদায়বাণী হিসেবে রচিত।
      date: পৌলের লেখা হলে আনুমানিক ৬০-এর দশকের মাঝামাঝি; ছদ্মনামে লেখা হলে আনুমানিক ৯০–১১০ খ্রিস্টাব্দ।
    Titus:
      display_name: তীত
      author: পৌল, অথবা পৌলের নামে কোনো শিষ্য।
      audience: ক্রীতে পৌলের প্রতিনিধি হিসেবে তীত।
      date: পৌলের লেখা হলে আনুমানিক ৬০-এর দশকের মাঝামাঝি; ছদ্মনামে লেখা হলে আনুমানিক ৯০–১১০ খ্রিস্টাব্দ।
    Philemon:
      display_name: ফিলীমন
      author: পৌল, সঙ্গে তীমথিয়।
      audience: খ্রিস্টান দাসমালিক ফিলীমনকে, তাঁর পালিয়ে যাওয়া দাস ওনীষিমের বিষয়ে।
      date: আনুমানিক ৬০–৬২ খ্রিস্টাব্দ।
    Hebrews:
      display_name: ইব্রীয়
      author: লেখক অজ্ঞাত। প্রচলিতভাবে পৌল, আপল্লো, বার্ণবা, প্রিষ্কিল্লা ও অন্যদের নাম প্রস্তাব করা হয়েছে; কোনো প্রস্তাবেই ঐকমত্য নেই।
      audience: গ্রিকভাষী ইহুদি খ্রিস্টানরা, যারা তাদের খ্রিস্টীয় বিশ্বাসের স্বীকারোক্তি থেকে পিছিয়ে যাওয়ার প্রলোভনে পড়েছিল।
      date: আনুমানিক ৬০–৯৫ খ্রিস্টাব্দ।
