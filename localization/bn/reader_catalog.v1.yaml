  Gospel of Thomas:
    display_name: থমাসের সুসমাচার
    author: লেখক অজ্ঞাত; সূচনাবাক্যে এই বাণীসংকলনটি ‘দিদিমোস যিহূদা থমাস’-এর নামে আরোপ করা হয়েছে। সম্পূর্ণ রূপে এটি কেবল নাগ হাম্মাদি থেকে পাওয়া চতুর্থ শতাব্দীর একটি কপটিক অনুবাদে (NHC II,2) টিকে আছে; অক্সিরিনখাস থেকে এর তিনটি গ্রিক খণ্ডাংশও পাওয়া গেছে।
    audience: সিরীয় প্রজ্ঞাধারা ও প্রাথমিক জ্ঞানবাদী চিন্তায় প্রভাবিত খ্রিস্টীয় পাঠকসমাজ, যারা যিশুর বাণীর মধ্যে গূঢ় আত্মজ্ঞান অনুসন্ধানে আগ্রহী ছিল।
    date: গ্রিক মূল রচনাটি সম্ভবত আনুমানিক ৫০–১৪০ খ্রিস্টাব্দের; কপটিক পাণ্ডুলিপিটি আনুমানিক ৩৪০ খ্রিস্টাব্দের।
    summary: থমাসের সুসমাচার হলো যিশুর নামে প্রচলিত বাণীগুলোর একটি সংকলন। এতে ধারাবাহিক কোনো কাহিনি নেই এবং বাণীগুলোর অর্থ আবিষ্কার করার জন্য পাঠকদের বারবার আহ্বান জানানো হয়েছে।
