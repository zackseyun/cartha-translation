  Treatise on the Resurrection:
    display_name: পুনরুত্থান-বিষয়ক আলোচনা
    author: লেখক অজ্ঞাত। রচনাটি রেগিনোস নামের এক শিক্ষার্থীর প্রতি একজন শিক্ষকের চিঠি হিসেবে বিন্যস্ত; শিক্ষক বা রেগিনোস—কাউকেই নিশ্চিতভাবে শনাক্ত করা যায় না।
    audience: পুনরুত্থান সম্বন্ধে শিক্ষা অন্বেষণকারী খ্রিস্টানেরা, বিশেষত সেই পাঠকেরা, যাঁরা পুনরুত্থানের জীবনে দেহগত, আত্মিক এবং বর্তমান অংশগ্রহণের ধারণাগুলি বিবেচনা করছিলেন।
    date: সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর শেষভাগের রচনা বলে ধরা হয় (প্রায়ই আনুমানিক ১৭০–২০০ খ্রিস্টাব্দ); আগের একটি গ্রিক রচনার চতুর্থ শতাব্দীর কপটিক অনুলিপিতে এটি সংরক্ষিত।
