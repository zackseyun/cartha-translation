    author: অজ্ঞাতনামা। লেখক নিজেকে একজন শিষ্য বা শিক্ষার্থী বলেছেন, কিন্তু তাঁকে বা যাঁর উদ্দেশে লেখা সেই দিয়োগনেতুসকে নির্ভরযোগ্যভাবে শনাক্ত করা যায় না।
    audience: একজন শিক্ষিত অখ্রিস্টীয় অনুসন্ধানী—এবং তাঁর মতো পাঠকেরা—যিনি খ্রিস্টীয় উপাসনা, নৈতিকতা, সামাজিক পরিচয়, প্রেম এবং এই বিশ্বাসকে আপাতদৃষ্টিতে নতুন মনে হওয়ার কারণ সম্পর্কে জানতে চেয়েছিলেন।
    date: প্রায়ই খ্রিস্টীয় দ্বিতীয় শতাব্দীর শেষভাগ বা তৃতীয় শতাব্দীর প্রথমভাগের রচনা বলে তারিখ নির্ধারণ করা হয়, যদিও প্রস্তাবিত সময়ের মধ্যে ব্যাপক পার্থক্য আছে; শেষ দুটি অধ্যায় অন্য কোনো রচনা থেকে আসতে পারে।
    chapters:
      '1':
        title: দিয়োগনেতুস বিশ্বাস বুঝতে চান
      '2':
        title: মানুষের হাতে গড়া প্রতিমা
      '3':
        title: খ্রিস্টানেরা মিথ্যা উপাসনা বর্জন করেন
      '4':
        title: ঈশ্বরের উত্তম দান বর্জন
      '5':
        title: পরবাসী, তবু সম্পূর্ণভাবে আপন
      '6':
        title: জগতের মধ্যে আত্মা অবস্থান করে
      '7':
        title: অদৃশ্য সৃষ্টিকর্তার কাছ থেকে সত্য
      '8':
        title: বিশ্বাস গোপন সত্য প্রকাশ করে
      '9':
        title: বিস্ময়কর অনুগ্রহের মাধ্যমে পরিত্রাণ
      '10':
        title: প্রকৃত সুখ প্রেম থেকে আসে
      '11':
        title: অনুগ্রহ মণ্ডলীকে নিরন্তর সমৃদ্ধ করে
      '12':
        title: জ্ঞানপূর্ণ হৃদয় ফল দেয়
