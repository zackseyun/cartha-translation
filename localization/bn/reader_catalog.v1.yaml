  Gospel of Philip:
    display_name: ফিলিপের সুসমাচার
    author: লেখক অজ্ঞাত। পাণ্ডুলিপির শেষের শিরোনামলিপিতে এই নামটি রয়েছে, তবে রচনাটি ফিলিপকে এর লেখক বলে পরিচয় দেয় না। একমাত্র টিকে থাকা অনুলিপিটি হলো নাগ হাম্মাদি কোডেক্স II,3-এর কপটিক পাঠ।
    audience: ভ্যালেন্তিনীয় ধারার ধর্মীয় আচার-সংক্রান্ত শিক্ষার সঙ্গে পরিচিত একটি প্রাচীন খ্রিস্টীয় সম্প্রদায়—বিশেষত বাপ্তিস্ম, অভিষেক, প্রভুভোজ, মুক্তি, পুনরুত্থান ও বিবাহকক্ষের প্রতীকী ভাষা সম্পর্কে।
    date: সাধারণত খ্রিস্টীয় ২য় শতাব্দীর শেষভাগ বা ৩য় শতাব্দীর প্রথমভাগের রচনা বলে অনুমান করা হয়; আগের একটি গ্রিক রূপ থেকে অনূদিত ৪র্থ শতাব্দীর কপটিক পাণ্ডুলিপিতে এটি সংরক্ষিত আছে।
