  Exegesis on the Soul:
    display_name: আত্মা-বিষয়ক ব্যাখ্যা
    author: লেখক অজ্ঞাত। লেখক একজন খ্রিস্টীয় ধর্মোপদেশক, যিনি বাইবেলীয় ও গ্রিক সাহিত্যের চিত্রকল্পকে আত্মার পতন, অনুতাপ ও পুনঃপ্রতিষ্ঠার রূপক হিসেবে নতুনভাবে পাঠ করেছেন।
    audience: শাস্ত্র ও নৈতিক উপদেশের সঙ্গে পরিচিত সেই খ্রিস্টানেরা, যাঁদের বিশৃঙ্খল কামনা থেকে ফিরে অনুতাপ করতে এবং ঐশী সত্তার সঙ্গে পুনর্মিলিত হতে আহ্বান জানানো হচ্ছিল।
