books:
  Genesis:
    display_name: আদিপুস্তক
    author: লেখক অজ্ঞাত; ঐতিহ্যগতভাবে মোশির রচনা বলে মনে করা হয়। আধুনিক গবেষণা অনুযায়ী, দীর্ঘ সময় ধরে রচিত বিভিন্ন উৎস পরে একত্রে সম্পাদনা করা হয়েছে।
    audience: চুক্তিবদ্ধ জাতি হিসেবে ইস্রায়েল—যাতে ঈশ্বরের সৃষ্টি, মনোনয়ন ও প্রতিজ্ঞার মধ্যে জাতির উৎপত্তির কাহিনি প্রতিষ্ঠিত হয়।
    date: কয়েক শতাব্দী ধরে রচিত; ব্যাবিলনীয় নির্বাসনের সময় বা পরে, আনুমানিক খ্রিস্টপূর্ব ষষ্ঠ–পঞ্চম শতাব্দীতে, এটি বর্তমান স্বীকৃত রূপ লাভ করে।
    summary: আদিপুস্তকে সৃষ্টি, মানুষের বিদ্রোহ ও ছড়িয়ে পড়া এবং আব্রাহাম, ইসহাক, যাকোব ও যোষেফের পরিবারের কাহিনি বলা হয়েছে—যাঁদের মধ্য দিয়ে ইস্রায়েলের প্রতি ঈশ্বরের চুক্তির প্রতিজ্ঞাগুলোর সূচনা হয়।
    chapters:
      '1':
        title: ঈশ্বর আকাশমণ্ডল ও পৃথিবী সৃষ্টি করেন
      '2':
        title: ঈশ্বর পুরুষ ও নারীকে গঠন করেন
      '3':
