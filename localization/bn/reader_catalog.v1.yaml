  Martyrdom of Polycarp:
    display_name: পলিকার্পের শহীদত্ব
    author: স্মির্নার মণ্ডলীর অজ্ঞাতনামা সদস্যরা, যারা সেই সম্প্রদায়ের নামে লিখেছেন; শেষের পাঠ-হস্তান্তরসংক্রান্ত টীকাগুলো পরবর্তী অনুলিপি ও প্রচারের ইতিহাস প্রতিফলিত করে।
    audience: ফিলোমেলিয়ামের মণ্ডলী এবং বৃহত্তর খ্রিস্টীয় সমাজ; তাদের কাছে পলিকার্পের গ্রেপ্তার, বিচার, মৃত্যু ও দৃষ্টান্তমূলক সহিষ্ণুতার বিবরণ তুলে ধরা হয়েছে।
    date: পলিকার্পের মৃত্যুর পরে রচিত; সাধারণত খ্রিস্টীয় দ্বিতীয় শতাব্দীর মধ্যভাগ বা পরবর্তী সময়ে স্থির করা হয়। তবে শহীদত্বের সুনির্দিষ্ট বছর এবং নথিটির চূড়ান্ত রূপ—উভয় বিষয়েই বিতর্ক আছে।
