    author: কয়েক শতাব্দী ধরে একাধিক লেখকের রচনা; ১–৩৯ অধ্যায়ের শিকড় খ্রিস্টপূর্ব অষ্টম শতাব্দীর জেরুশালেমের যিশাইয়ের মধ্যে, আর ৪০–৫৫ ("দ্বিতীয় যিশাইয়") ও ৫৬–৬৬ ("তৃতীয় যিশাইয়") অধ্যায় নির্বাসন ও প্রত্যাবর্তনের প্রেক্ষাপটে সাড়া দেয়।
    audience: পর্যায়ক্রমে আসিরীয় হুমকির মুখে থাকা যিহূদা, ব্যাবিলনীয় নির্বাসনের সময়কার জনগণ এবং নির্বাসন-পরবর্তী পুনর্গঠনের সময়কার জনগণ।
    date: আনুমানিক খ্রিস্টপূর্ব অষ্টম শতাব্দীর শেষভাগ থেকে পঞ্চম শতাব্দী পর্যন্ত রচিত।
