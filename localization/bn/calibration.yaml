book_localizations:
- source_title: Genesis
  title: আদিপুস্তক
  author: লেখক অজ্ঞাত; ঐতিহ্যগতভাবে মোশির রচনা বলে মনে করা হয়। আধুনিক গবেষণা অনুসারে, এটি দীর্ঘ সময়ের রচনাপ্রক্রিয়ার ফল, যেখানে বিভিন্ন উৎস পরে একত্রে সম্পাদিত হয়েছে।
  audience: চুক্তির জনগণ হিসেবে ইস্রায়েলের পরিচয়কে দৃঢ় করার জন্য—ঈশ্বরের সৃষ্টি, নির্বাচন ও প্রতিশ্রুতিতে তাদের উৎসকাহিনি স্থাপন করে।
  date: কয়েক শতাব্দী ধরে রচিত; ব্যাবিলনীয় নির্বাসনের সময় বা পরে, আনুমানিক খ্রিস্টপূর্ব ষষ্ঠ–পঞ্চম শতাব্দীতে, এটি বর্তমান স্বীকৃত রূপ লাভ করে।
  summary: আদিপুস্তকে সৃষ্টি, মানুষের বিদ্রোহ ও ছড়িয়ে পড়া, এবং আব্রাহাম, ইসহাক, যাকোব ও যোষেফের পরিবারের কাহিনি বলা হয়েছে—যাঁদের মাধ্যমে ইস্রায়েলের প্রতি ঈশ্বরের চুক্তির প্রতিশ্রুতিগুলোর সূচনা হয়।
- source_title: John
  title: যোহন
  author: লেখক অজ্ঞাত; ঐতিহ্য অনুসারে এটি প্রেরিত যোহন অথবা ‘প্রিয় শিষ্য’-এর নামে আরোপিত।
  audience: ইহুদি উপাসনালয়কেন্দ্রিক ইহুদি ধর্মের সঙ্গে টানাপোড়েনে থাকা একটি খ্রিস্টীয় সম্প্রদায়, যা প্রিয় শিষ্যের সাক্ষ্যকে কেন্দ্র করে গড়ে উঠেছিল।
  date: আনুমানিক ৯০–১১০ খ্রিস্টাব্দ।
  summary: যোহন যিশুকে অনন্তকালীন বাক্য হিসেবে তুলে ধরে—তিনি পিতাকে প্রকাশ করেন, তাঁর ওপর আস্থার মাধ্যমে জীবন দেন এবং তাঁর নিদর্শন, মৃত্যু ও পুনরুত্থানের মধ্য দিয়ে মহিমান্বিত হন।
- source_title: Gospel of Thomas
  title: থোমার সুসমাচার
  author: লেখক অজ্ঞাত; সূচনাবাক্যে এই বাণীসংগ্রহটি ‘দিদিমোস যিহূদা থোমা’র নামে আরোপিত হয়েছে। সম্পূর্ণ রচনাটি কেবল নাগ হাম্মাদি থেকে পাওয়া চতুর্থ শতাব্দীর একটি কপ্টিক অনুবাদে (NHC II,2) টিকে আছে; অক্সিরিঙ্কাস থেকে এর তিনটি গ্রিক খণ্ডাংশও পাওয়া গেছে।
  audience: সিরীয় প্রজ্ঞাধারা ও প্রাথমিক জ্ঞানবাদী চিন্তার প্রভাবে গড়ে ওঠা খ্রিস্টীয় পাঠকসমাজ, যারা যিশুর বাণীগুলোর মধ্যে গুপ্ত আত্মজ্ঞান অনুসন্ধানের দিকে মুখী।
  date: গ্রিক মূল রচনাটি সম্ভবত আনুমানিক ৫০–১৪০ খ্রিস্টাব্দের; কপ্টিক পাণ্ডুলিপিটি আনুমানিক ৩৪০ খ্রিস্টাব্দের।
  summary: থোমার সুসমাচার যিশুর নামে আরোপিত বাণীগুলোর একটি সংকলন। এতে ধারাবাহিক কোনো কাহিনি নেই এবং বারবার পাঠকদের এসব বাণীর অর্থ আবিষ্কার করতে আহ্বান জানানো হয়েছে।
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: আদিপুস্তক ১:১
  text: ঈশ্বর যখন আকাশমণ্ডল ও পৃথিবী সৃষ্টি করতে শুরু করলেন[ক]—
  translator_note: '[ক] ঐতিহ্যগত অনুবাদে এটিকে একটি সম্পূর্ণ বাক্য হিসেবে ধরা হয়: “আদিতে ঈশ্বর আকাশমণ্ডল ও পৃথিবী সৃষ্টি করলেন।” তবে হিব্রু বাক্যটি আরও স্বাভাবিকভাবে পরের কথার ভূমিকা হিসেবে কাজ করে; সে ক্ষেত্রে মূল ক্রিয়াটি ৩ পদের “ঈশ্বর বললেন”।'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: উপদেশক ১:২
  text: “বাষ্পের বাষ্প[ক],” কোহেলেত[খ] বলেন। “সবই বাষ্প—ক্ষণস্থায়ী, ধরে রাখা অসম্ভব এবং প্রায়ই আমাদের প্রত্যাশার বিপরীত।”
  translator_note: '[ক] হিব্রু ‘হেভেল’ শব্দের আক্ষরিক অর্থ ‘শ্বাস’ বা ‘বাষ্প’। উপদেশক বইজুড়ে এটি এমন কিছুকে বোঝায় যা দ্রুত চলে যায়, ধরে রাখা বা পুরোপুরি বোঝা যায় না এবং প্রায়ই মানুষের প্রত্যাশার চেয়ে ভিন্ন পরিণতি পায়। “বাষ্প” শব্দটি সেই চিত্রটি ধরে রাখে, কিন্তু সবকিছু অর্থহীন—এমন দাবি করে না। সম্ভাব্য অন্য অনুবাদ: “শ্বাস”, “নিছক শ্বাস” বা “ক্ষণস্থায়ী”। [খ] ‘কোহেলেত’ লেখকের হিব্রু নাম বা উপাধি। এটি প্রায়ই “শিক্ষক” বা “প্রচারক” হিসেবে অনূদিত হয়; কোনো একটি ব্যাখ্যাকে প্রাধান্য না দিয়ে সব সম্ভাবনা খোলা রাখতে এখানে ‘কোহেলেত’ রাখা হয়েছে।'
- source_path: nt/john/001/001.yaml
  reference: যোহন ১:১
  text: আদিতে[খ] বাক্য আগে থেকেই ছিলেন। বাক্য ঈশ্বরের সঙ্গে ছিলেন, আর বাক্য ঈশ্বর ছিলেন।[ক]
  translator_note: '[ক] অন্যভাবে: “বাক্য ঐশ্বরিক ছিলেন” অথবা “ঈশ্বর যা ছিলেন, বাক্যও তা-ই ছিলেন।” গ্রিক বাক্যগঠনটি বাক্যকে আগের অংশের ঈশ্বর থেকে স্বতন্ত্র রেখেও তাঁর পূর্ণ ঈশ্বরত্ব স্বীকার করে। [খ] এই সূচনা আদিপুস্তক ১:১-এর প্রতিধ্বনি করে এবং বাক্যকে সৃষ্টির সূচনার সঙ্গে যুক্ত করে। “আগে থেকেই ছিলেন” বোঝায় যে সূচনা উপস্থিত হওয়ার সময় বাক্য বিদ্যমান ছিলেন; তিনি তখন অস্তিত্বে আসেননি। সম্ভাব্য অন্য অনুবাদ: “ছিলেন” বা “বিদ্যমান ছিলেন”।'
- source_path: nt/romans/003/025.yaml
  reference: রোমীয় ৩:২৫
  text: ঈশ্বর তাঁকে তাঁর রক্তের ওপর বিশ্বাসের মাধ্যমে প্রায়শ্চিত্তের বলিরূপে[ক] উপস্থাপন করলেন। তিনি এমন করলেন নিজের ধার্মিকতা[গ] দেখানোর জন্য, কারণ অতীতে করা পাপগুলো তিনি এড়িয়ে গিয়েছিলেন।[খ]
  translator_note: '[ক] অন্যভাবে: “ক্রোধ প্রশমনের উপায়”; অথবা “অনুগ্রহাসন”—চুক্তির সিন্দুকের সোনার ঢাকনা, যার ওপর পুরাতন নিয়মে প্রায়শ্চিত্তের রক্ত ছিটানো হতো। [খ] অন্যভাবে: “বিশ্বাসের মাধ্যমে, তাঁর রক্ত দ্বারা।” [গ] অন্যভাবে: “ন্যায়বিচার”।'
- source_path: nt/1_peter/001/013.yaml
  reference: ১ পিতর ১:১৩
  text: তাই তোমাদের মনকে কাজের জন্য প্রস্তুত করো।[ক] পুরোপুরি সজাগ থাকো, আর যিশু মশীহ প্রকাশিত হলে তোমাদের কাছে যে অনুগ্রহ আনা হচ্ছে, তার ওপর সম্পূর্ণভাবে আশা রাখো।[খ]
  translator_note: '[ক] গ্রিক ভাষায় আক্ষরিকভাবে বলা হয়েছে, “তোমাদের মনের কোমর বেঁধে নাও।” এর চিত্রটি হলো কাজের জন্য প্রস্তুত হতে কোমরের চারপাশে লম্বা পোশাক গুটিয়ে বাঁধা। তাই এটি মানসিক প্রস্তুতি ও কাজের জন্য তৈরি থাকার আহ্বান। আক্ষরিক চিত্রটিও সম্ভাব্য অনুবাদ হিসেবে বজায় থাকে। [খ] “পুরোপুরি” ও “সম্পূর্ণভাবে” হিসেবে অনূদিত গ্রিক শব্দটি সজাগ থাকার সঙ্গে, আশা রাখার সঙ্গে, অথবা সম্ভবত উভয়ের সঙ্গেই যুক্ত হতে পারে।'
