  - রোমীয় ৩:২৫-এ ‘through faith in his blood’ মূল পাঠের সম্ভাব্য পাঠ হিসেবে রাখা হয়েছে, আর বিকল্প পাঠ পাদটীকায় দেওয়া হয়েছে; বাক্যবিন্যাসও সংশোধিত হয়েছে।
  - ১ পিতর ১:১৩-এ ‘fully clear-minded’ অর্থে ‘পুরোপুরি সজাগ থাকো’ আরও স্বাভাবিক ও যথাযথ।
