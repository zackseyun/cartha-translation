review:
  verdict: revise
  summary: May ilang kailangang ayusin para maging higit na idiomatiko at tumpak ang Tagalog, lalo na sa Genesis 1:1, sa paglalarawan ng mambabasa ng Ebanghelyo ni Tomas, at sa ilang piling pahayag. Pinananatili ng rebisyong ito ang mga alternatibo at paliwanag ng pinagmulan nang walang pagdaragdag ng doktrinal na pagbasa.
  issues:
  - 'Genesis 1:1: Ang “Nang pasimulan ng Diyos ang paglikha sa langit at sa lupa” ay hindi gaanong natural sa Tagalog; ginawang “Nang simulan ng Diyos na likhain ang langit at ang lupa.”'
  - 'Ebanghelyo ni Tomas: Ang “lihim na pagkilala sa sarili” ay maaaring magpahiwatig ng pagtatagong impormasyon; “esoterikong pagkilala sa sarili” ang mas tumpak para sa “esoteric self-knowledge.”'
  - 'Juan 1:1: Pinakinis ang paliwanag sa pagkakaiba ng Salita at ng Diyos sa naunang sugnay upang hindi magmukhang mas malawak na pahayag kaysa sa sinasabi ng tekstong Griego.'
  - '1 Pedro 1:13: Pinakinis ang pangunahing pahayag upang mas natural ang utos sa maramihan at mas malinaw ang “grace being brought.”'
