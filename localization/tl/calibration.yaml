book_localizations:
- source_title: Genesis
  title: Genesis
  author: Hindi kilala ang may-akda; ayon sa tradisyon, iniuugnay ito kay Moises. Ayon sa makabagong pag-aaral, mahaba ang kasaysayan ng pagkakabuo nito, kung saan pinagsama-sama at kalauna’y inayos ang iba’t ibang sanggunian.
  audience: Ang Israel sa pagkakakilanlan nito bilang bayang nakatali sa tipan; itinatatag nito ang salaysay ng pinagmulan ng bayan sa paglikha, pagpili, at pangako ng Diyos.
  date: Nabuo sa loob ng maraming siglo; umabot sa anyong tinanggap at naipasa sa atin noong humigit-kumulang ika-6 hanggang ika-5 siglo BC, sa panahon o pagkatapos ng pagkakatapon sa Babilonia.
  summary: Isinasalaysay ng Genesis ang paglikha, ang paghihimagsik at pagkakawatak-watak ng sangkatauhan, at ang pamilya nina Abraham, Isaac, Jacob, at Jose, na sa pamamagitan nila ay nagsimula ang mga pangako ng tipan ng Diyos sa Israel.
- source_title: John
  title: Juan
  author: Hindi kilala ang may-akda; ayon sa tradisyon, iniuugnay ito kay apostol Juan o sa “Minamahal na Alagad.”
  audience: Isang pamayanang Kristiyano na may tensiyon sa Judaismong nakasentro sa sinagoga at nahubog sa patotoo ng Minamahal na Alagad.
  date: Humigit-kumulang AD 90–110.
  summary: Inilalahad ng Juan si Jesus bilang walang-hanggang Salita na naghahayag sa Ama, nagbibigay ng buhay sa pamamagitan ng pagtitiwala sa kanya, at niluluwalhati sa pamamagitan ng kanyang mga tanda, kamatayan, at muling pagkabuhay.
- source_title: Gospel of Thomas
  title: Ebanghelyo ni Tomas
  author: Hindi kilala ang may-akda; iniuugnay ng pambungad ang kalipunan ng mga kasabihan kay “Didymos Judas Thomas.” Ang tanging buo nitong natitirang anyo ay isang saling Coptic noong ika-4 na siglo mula sa Nag Hammadi (NHC II,2); mayroon ding tatlong fragmentong Griego mula sa Oxyrhynchus.
  audience: Mga mambabasang Kristiyano na nahubog ng karunungang Siriyano at kaisipang proto-Gnostiko, at nakatuon sa esoterikong pagkilala sa sarili sa pamamagitan ng mga kasabihan ni Jesus.
  date: Malamang na mula noong humigit-kumulang AD 50–140 ang orihinal na Griego; humigit-kumulang AD 340 ang manuskritong Coptic.
  summary: Ang Ebanghelyo ni Tomas ay isang kalipunan ng mga kasabihang iniuugnay kay Jesus. Wala itong tuloy-tuloy na salaysay, at paulit-ulit nitong hinihikayat ang mga mambabasa na tuklasin ang kahulugan ng mga kasabihan.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Genesis 1:1
  text: Nang simulan ng Diyos na likhain ang langit at ang lupa[a]—
  translator_note: '[a] Itinuturing ito ng tradisyonal na salin bilang isang buong pangungusap: “Nang pasimula, nilikha ng Diyos ang langit at ang lupa.” Ngunit mas likas sa Hebreo na nagsisilbi itong panimula sa kasunod, at ang pangunahing kilos—“sinabi ng Diyos”—ay nasa talata 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Eclesiastes 1:2
  text: “Singaw ng mga singaw[a],” sabi ni Qoheleth[b]. “Ang lahat ay singaw—panandalian, hindi mahawakan, at madalas ay hindi ayon sa inaasahan natin.”
  translator_note: '[a] Ang salitang Hebreo na hevel ay literal na nangangahulugang hininga o singaw. Sa buong Eclesiastes, inilalarawan nito ang mabilis lumipas, hindi mahawakan o lubos na maunawaan, at madalas na iba ang kinahihinatnan sa inaasahan ng tao. Pinananatili ng “singaw” ang larawang ito nang hindi ipinapahayag na walang kabuluhan ang lahat. Maaari rin itong isalin bilang “hininga,” “pawang hininga,” o “panandalian.” [b] Ang Qoheleth ay pangalang Hebreo o titulo ng may-akda. Madalas itong isalin bilang “Guro” o “Mangangaral,” ngunit pinanatili rito ang “Qoheleth” upang manatiling bukas ang lahat ng posibleng kahulugan at walang papanigang isang interpretasyon.'
- source_path: nt/john/001/001.yaml
  reference: Juan 1:1
  text: Nang pasimula[b], umiiral na ang Salita. Kasama ng Diyos ang Salita, at ang Salita ay Diyos.[a]
  translator_note: '[a] Maaari ring isalin na “ang Salita ay banal” o “kung ano ang Diyos, gayon ang Salita.” Pinagtitibay ng pagkakasulat sa Griego na lubos na Diyos ang Salita, habang itinatangi ang Salita mula sa Diyos na binanggit sa naunang sugnay. [b] Umaalingawngaw sa pambungad na ito ang Genesis 1:1 at iniuugnay nito ang Salita sa pasimula ng paglikha. Ang “umiiral na” ay maaari ring isaling “naroon na”; ipinahihiwatig ng anyong Griego ang nagpapatuloy nang pag-iral ng Salita nang dumating ang pasimula, hindi na noon lamang siya umiral.'
- source_path: nt/romans/003/025.yaml
  reference: Roma 3:25
  text: Iniharap siya ng Diyos bilang handog na pantubos sa kasalanan[a] sa pamamagitan ng pananampalataya sa kanyang dugo[b]. Ginawa niya ito upang ipakita ang kanyang katuwiran[c], sapagkat pinalampas niya ang mga kasalanang nagawa noong nakaraan.
  translator_note: '[a] Maaari ring “handog na pumapawi ng poot”; o “luklukan ng awa,” ang gintong takip ng Kaban ng Tipan na winisikan ng dugong pantubos sa kasalanan sa Lumang Tipan. [b] Maaari ring “sa pamamagitan ng pananampalataya, sa bisa ng kanyang dugo.” [c] Maaari ring “katarungan.”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Pedro 1:13
  text: Kaya ihanda ninyo ang inyong mga isip para kumilos.[a] Maging ganap kayong malinaw mag-isip, at ituon ninyo nang lubos ang inyong pag-asa sa biyayang dinadala sa inyo kapag nahayag si Jesus na Mesiyas.[b]
  translator_note: '[a] Literal na sinasabi sa Griego, “bigkisan ninyo ang balakang ng inyong isip.” Inilalarawan nito ang pagtitipon at pagtatali sa baywang ng mahabang kasuotan upang maging handang kumilos. [b] Ang salitang Griego na isinaling “ganap” at “nang lubos” ay maaaring tumukoy sa pagiging malinaw mag-isip, sa pagtutuon ng pag-asa, o posibleng sa dalawang ito.'
