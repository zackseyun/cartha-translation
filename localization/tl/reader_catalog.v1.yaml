  2 Esdras:
    display_name: Ikalawang Esdras
    author: Hindi kilala; may balangkas na inedit ng mga Kristiyano sa paligid ng isang pangunahing bahaging orihinal na Judio (4 Ezra, mga kabanata 3–14).
    audience: Mga Judio pagkaraan ng 70 AD na nakikipagbuno sa tanong kung bakit pinahihintulutan ng Diyos ang kasamaan; kalaunan ay pinalawak para sa mga Kristiyanong mambabasa.
    date: Ang pangunahing bahaging Judio ay mula marahil noong mga 100 AD; ang mga dagdag na Kristiyano ay mula marahil noong ika-2–3 siglo AD.
