    audience: Isang pamayanang Kristiyanong Setiano na gumagamit ng masalimuot na mito, mga sagradong pangalan, mga larawang kaugnay ng bautismo, at papuring parang himno upang ipahayag ang espirituwal na pagkakakilanlan at paglaya.
    date: Karaniwang itinatakda sa ika-2 o ika-3 siglo AD; dalawang Coptic na sipi ang nananatili sa mga codex ng Nag Hammadi mula sa ika-4 na siglo.
