  Epistle to Diognetus:
    display_name: Liham kay Diogneto
    author: Hindi kilala. Tinatawag ng manunulat ang kanyang sarili na isang alagad o mag-aaral, ngunit hindi matiyak ang pagkakakilanlan niya ni ng sinulatan niyang si Diogneto.
    audience: Isang edukadong di-Kristiyanong nagtatanong—at mga mambabasang tulad niya—tungkol sa pagsamba, etika, pagkakakilanlan sa lipunan, at pag-ibig ng mga Kristiyano, pati sa waring pagiging bago ng pananampalataya.
    date: Madalas itakda sa huling bahagi ng ikalawa o unang bahagi ng ikatlong siglo AD, bagaman malaki ang pagkakaiba-iba ng mga panukala; maaaring nagmula sa ibang akda ang huling dalawang kabanata.
