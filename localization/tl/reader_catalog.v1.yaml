  Gospel of Thomas:
    display_name: Ebanghelyo ni Tomas
    author: Hindi kilala; iniuugnay ng pambungad ang kalipunan ng mga kasabihan kay “Didymos Judas Thomas.” Ang buong teksto ay nananatili lamang sa isang saling Coptic noong ika-4 na siglo mula sa Nag Hammadi (NHC II,2), at may tatlong piraso sa Griyego mula sa Oxyrhynchus.
    audience: Mga Kristiyanong mambabasa na nahubog ng karunungang Siriano at sinaunang kaisipang mala-Gnostiko, na nakatuon sa esoterikong pagkilala sa sarili sa mga kasabihan ni Jesus.
    date: Ang orihinal na tekstong Griyego ay malamang mula noong mga 50–140 AD; ang manuskritong Coptic ay mula noong mga 340 AD.
    summary: Ang Ebanghelyo ni Tomas ay isang kalipunan ng mga kasabihang iniuugnay kay Jesus. Wala itong tuloy-tuloy na salaysay at paulit-ulit nitong hinihikayat ang mga mambabasa na tuklasin ang kahulugan ng mga kasabihan.
