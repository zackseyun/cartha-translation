    audience: Isang grupong Kristiyano na tumutuligsa sa mga gawaing panghain at pansimbahan ng mga karibal, at gumagamit ng pag-uusap na naghahayag at kosmolohiyang kahawig ng Setiano upang muling bigyang-kahulugan si Judas at ang kamatayan ni Jesus.
    date: Karaniwang itinatakda sa kalagitnaan o huling bahagi ng ika-2 siglo AD; may alam si Irenaeus na isang Ebanghelyo ni Judas noong bandang 180, at malamang na mula sa ika-3 o ika-4 na siglo ang nananatiling Coptic na sipi.
