  Polycarp to the Philippians:
    display_name: Liham ni Policarpo sa mga Taga-Filipos
    author: Si Policarpo, obispo ng Smirna. Ayon sa ilang iskolar, maaaring pinagsama sa tekstong nakarating sa atin ang mga materyal na ipinadala sa mahigit sa isang pagkakataon.
    audience: Ang kapulungang Kristiyano sa Filipos, na humiling ng mga liham ni Ignacio at tumanggap ng payo tungkol sa pananampalataya, asal, pamumuno, salapi, at pagtitiyaga.
    date: Maaga hanggang kalagitnaan ng ikalawang siglo AD; malapit na kaugnay ng paglalakbay ni Ignacio ang kahit isang bahagi nito, samantalang ayon sa mga panukalang pinagsama-sama ang liham, maaaring medyo mas huli ang isang bahagi.
    chapters:
