  Fragments of Papias:
    display_name: Mga Sipi mula kay Papias
    author: Si Papias, obispo ng Hierapolis, ang may-akda ng nawawalang limang-aklat na Pagpapaliwanag sa mga Sinabi ng Panginoon; ang nalalabing kalipunan ay binubuo ng mga sipi at ulat na iningatan ng mga sumunod na may-akda.
    audience: Mga sinaunang Kristiyanong naghahanap ng mga naalaalang turo tungkol kay Jesus at sa mga apostol, na tinipon sa pamamagitan ng mga binanggit na kawing ng pasalitang patotoo at pagpapaliwanag.
    date: Karaniwang itinatakda ang akda ni Papias sa unang bahagi ng ikalawang siglo AD, madalas sa bandang 110–130; makikita ang nalalabing mga sipi sa mga may-akdang sumulat mula sa ikalawang siglo at sa mga sumunod pa.
