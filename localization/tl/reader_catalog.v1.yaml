  Martyrdom of Polycarp:
    display_name: Ang Pagkamartir ni Policarpo
    author: Mga di-kilalang kasapi ng iglesya sa Smirna, na sumulat sa ngalan ng kanilang pamayanan; makikita sa mga pangwakas na tala tungkol sa pagpapasa ng teksto ang pagkopya at pagpapalaganap nito noong mga sumunod na panahon.
    audience: Ang iglesya sa Filomelio at ang mas malawak na pamayanang Kristiyano; inihandog sa kanila ang salaysay tungkol sa pagdakip, paglilitis, kamatayan, at ulirang pagtitiis ni Policarpo.
    date: Isinulat pagkamatay ni Policarpo at karaniwang itinatakda sa kalagitnaan o huling bahagi ng ikalawang siglo AD; pinagtatalunan kapwa ang eksaktong taon ng pagkamartir at ang pinal na anyo ng dokumento.
