books:
  Genesis:
    display_name: Genesis
    author: Hindi kilala ang may-akda; ayon sa tradisyon, iniuugnay kay Moises. Ayon sa makabagong pag-aaral, mahaba ang kasaysayan ng pagkakabuo nito, at ang mga pinagkunang teksto ay pinagsama-sama at inayos nang dakong huli.
    audience: Ang Israel bilang bayang may pagkakakilanlang nakaugat sa tipan, na itinatag ang salaysay ng pinagmulan ng bayan sa paglikha, pagpili, at pangako ng Diyos.
    date: Nabuo sa loob ng maraming siglo; umabot sa kinikilalang anyo nito noong humigit-kumulang ika-6–5 siglo BC, sa panahon o pagkatapos ng pagkakatapon sa Babilonia.
    summary: Isinasalaysay sa Genesis ang paglikha, ang paghihimagsik at pagkakawatak-watak ng sangkatauhan, at ang pamilya nina Abraham, Isaac, Jacob, at Jose, na sa pamamagitan nila ay nagsimula ang mga pangako ng Diyos sa Israel ayon sa tipan.
