  book_metadata:
    Letters of Ignatius:
      display_name: Mga Liham ni Ignacio
      author: Si Ignacio, obispo ng Antioquia, ang may-akda ng pitong liham sa karaniwang tinatanggap na gitnang bersiyon; hindi kasama sa koleksiyong ito ang mga liham ni Ignacio na pinalawak kalaunan at ang mga liham na isinulat sa ilalim ng kanyang pangalan.
      audience: Mga kapulungang Kristiyano sa Efeso, Magnesia, Tralles, Roma, Filadelfia, at Esmirna, kasama si Policarpo, na kinausap habang naglalakbay si Ignacio patungo sa pagkamartir.
      date: Karaniwang itinatakda sa unang bahagi ng ikalawang siglo AD, madalas sa bandang 105–117, bagaman pinagtatalunan pa rin ang eksaktong pagkakasunod-sunod ng mga pangyayari sa paglalakbay ni Ignacio.
