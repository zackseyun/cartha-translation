  book_metadata:
    2 Esdras:
      display_name: Ikalawang Esdras
      author: Hindi kilala; may balangkas na inedit ng mga Kristiyano sa paligid ng isang pangunahing bahaging orihinal na Judio (4 Ezra, mga kabanata 3–14).
      audience: Mga Judio pagkaraan ng 70 AD na nakikipagbuno sa tanong kung bakit pinahihintulutan ng Diyos ang kasamaan; kalaunan ay pinalawak para sa mga Kristiyanong mambabasa.
      date: Ang pangunahing bahaging Judio ay mula marahil noong mga 100 AD; ang mga dagdag na Kristiyano ay mula marahil noong ika-2–3 siglo AD.
    Didache:
      display_name: Didache
      author: Hindi kilala (ang pamagat ay nangangahulugang “Aral ng Labindalawang Apostol”).
      audience: Mga unang kapulungang Kristiyano—isang maikling gabay tungkol sa wastong asal, bautismo, eukaristiya, at mga naglalakbay na guro.
      date: Marahil noong huling bahagi ng ika-1 hanggang unang bahagi ng ika-2 siglo AD.
    Gospel of Thomas:
      display_name: Ebanghelyo ni Tomas
      author: Hindi kilala; iniuugnay ng pambungad ang kalipunan ng mga kasabihan kay “Didymos Judas Thomas.” Ang buong teksto ay nananatili lamang sa isang saling Coptic noong ika-4 na siglo mula sa Nag Hammadi (NHC II,2), at may tatlong piraso sa Griyego mula sa Oxyrhynchus.
      audience: Mga Kristiyanong mambabasa na nahubog ng karunungang Siriano at sinaunang kaisipang mala-Gnostiko, na nakatuon sa esoterikong pagkilala sa sarili sa mga kasabihan ni Jesus.
      date: Ang orihinal na tekstong Griyego ay malamang mula noong mga 50–140 AD; ang manuskritong Coptic ay mula noong mga 340 AD.
      summary: Ang Ebanghelyo ni Tomas ay isang kalipunan ng mga kasabihang iniuugnay kay Jesus. Wala itong tuloy-tuloy na salaysay at paulit-ulit nitong hinihikayat ang mga mambabasa na tuklasin ang kahulugan ng mga kasabihan.
