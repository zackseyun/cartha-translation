payload:
  book_metadata:
    Gospel of Mary:
      display_name: Ebanghelyo ni Maria
      author: Hindi kilala. Inilalarawan sa akda si Maria bilang tumanggap at tagapagpaliwanag ng pahayag ni Jesus, ngunit hindi nito sinasabing si Maria ang sumulat ng natitirang ebanghelyo.
      audience: Mga sinaunang Kristiyanong mambabasa na nagsusuri sa pahayag, espirituwal na pag-akyat, awtoridad ng mga apostol, at pagiging lehitimo ng turo ni Maria sa mga alagad ni Jesus.
      date: Karaniwang itinatakda sa ika-2 siglo AD; may natitirang mga piraso sa Griyego mula sa ika-3 siglo, at ang pangunahing kopyang Coptic ay napanatili sa Berlin Codex 8502 na mula sa ika-5 siglo.
    Treatise on the Resurrection:
      display_name: Sanaysay tungkol sa Muling Pagkabuhay
      author: Hindi kilala. Inilahad ang akda bilang liham ng isang guro sa mag-aaral na nagngangalang Rheginos; hindi matiyak ang pagkakakilanlan ng guro o ni Rheginos.
      audience: Mga Kristiyanong naghahanap ng pagtuturo tungkol sa muling pagkabuhay, lalo na ang mga mambabasang nagsasaalang-alang sa pisikal at espirituwal na muling pagkabuhay at sa kasalukuyang pakikibahagi sa buhay na dulot nito.
      date: Karaniwang itinatakda sa huling bahagi ng ika-2 siglo AD (madalas, humigit-kumulang 170–200); napanatili sa isang kopyang Coptic mula sa ika-4 na siglo ng isang mas naunang akdang Griyego.
    Dialogue of the Savior:
      display_name: Pakikipag-usap ng Tagapagligtas
      author: Hindi kilala. Inilalagay ng dayalogo sa mga labi ni Jesus ang mapaghayag na pagtuturo sa pakikipag-usap kina Judas, Mateo, at Maria, ngunit hindi nito tinutukoy kung sino ang nagtipon ng akda.
      audience: Isang pangkat ng mga sinaunang Kristiyano na interesado sa pribadong pahayag, pagiging alagad, pagkilala sa sarili, panalangin, at disiplinadong paghahanda para sa kaligtasan.
      date: Karaniwang itinatakda sa ika-2 siglo AD, bagaman pinagtatalunan pa rin ang mga bahaging nabuo sa iba't ibang yugto at ang eksaktong petsa nito; napanatili sa isang manuskritong Coptic mula sa ika-4 na siglo.
    Exegesis on the Soul:
      display_name: Pagpapaliwanag tungkol sa Kaluluwa
      author: Hindi kilala. Ang may-akda ay isang Kristiyanong mangangaral na muling binasa ang mga larawang mula sa Bibliya at panitikang Griyego bilang alegorya ng pagkahulog, pagsisisi, at pagpapanumbalik ng kaluluwa.
      audience: Mga Kristiyanong pamilyar sa Kasulatan at pangaral tungkol sa wastong asal, na tinatawag na tumalikod sa magulong pagnanasa, magsisi, at muling makiisa sa Diyos.
      date: Karaniwang itinatakda sa huling bahagi ng ika-2 siglo o unang bahagi ng ika-3 siglo AD; napanatili sa isang saling Coptic mula sa Griyego na ginawa noong ika-4 na siglo.
    Book of Thomas the Contender:
      display_name: Aklat ni Tomas na Nakikipagtunggali
      author: Hindi kilala. Iniuugnay ng pangwakas na pamagat ang akda kay Judas Tomas at pinapangalanan si Mathaias bilang tagapagtala, ngunit mga pampanitikang pag-uugnay ang mga ito at hindi mapatutunayang mga pahayag tungkol sa pagkakakilanlan ng may-akda.
      audience: Mga Kristiyanong may pagkiling sa mahigpit na disiplina sa sarili, na hinihimok na kilalanin ang sarili, labanan ang mga pagnanasa ng katawan, at unawain ang pribadong pagtuturo ni Jesus kay Tomas.
      date: Madalas itinatakda sa huling bahagi ng ika-2 siglo o unang bahagi ng ika-3 siglo AD, at posibleng nagmula sa isang pamayanang Kristiyano sa Siria; napanatili sa isang manuskritong Coptic mula sa ika-4 na siglo.
    Tripartite Tractate:
      display_name: Tatlong-Bahaging Sanaysay
      author: Hindi kilala. Ang may-akda ay isang lubos na edukadong Kristiyanong teologong Valentiniano; hindi siya matiyak na maitutumbas sa sinumang gurong kilala sa pangalan.
      audience: Isang pamayanang Kristiyanong Valentiniano na tumatanggap ng masusing pagtuturo tungkol sa Diyos, mga aeon, paglikha, kay Cristo, sa iglesya, kaligtasan, at pangwakas na pagpapanumbalik.
      date: Karaniwang itinatakda sa ika-3 siglo AD, bagaman may mga pangangatwirang pumapabor sa huling kalahati nito; napanatili sa wikang Coptic sa Jung Codex mula sa ika-4 na siglo.
    Apocryphon of John:
      display_name: Lihim na Aklat ni Juan
      author: Hindi kilala. Sa ilalim ng huwad na pangalan, inilalahad ng akda ang isang pahayag ng muling nabuhay na si Jesus kay Juan na anak ni Zebedeo, at nananatili ito sa mahigit isang sinaunang bersiyon.
      audience: Mga Kristiyano sa tradisyong mapaghayag na Sethiano o malapit na kaugnay nito, na naghahanap ng salaysay tungkol sa banal na daigdig, paglikha, pagkakakilanlan ng tao, at paglaya mula sa mapanlabang mga pinuno.
      date: Malamang na umikot na ang isang maagang anyo noong ika-2 siglo AD; ang mga natitirang kopyang Coptic, na nagpapanatili ng mas maikli at mas mahabang mga bersiyon, ay mula sa ika-4 at ika-5 siglo.
