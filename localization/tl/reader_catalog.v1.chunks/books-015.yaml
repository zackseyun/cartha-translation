payload:
  book_metadata:
    1 Esdras:
      display_name: 1 Esdras
      author: Hindi kilala; isang muling pagkakabuo sa Griyego na nag-ayos sa ibang pagkakasunod-sunod ng 2 Cronica 35–36, Ezra, at Nehemias 7–8.
      audience: Mga Judio noong panahong Helenistiko na nagnanais ng malinaw na salaysay tungkol sa pagbabalik at pagpapanumbalik.
      date: Bandang ika-2–ika-1 siglo BC.
    Prayer of Manasseh:
      display_name: Panalangin ni Manases
      author: Hindi kilala; iniuugnay kay Haring Manases sa ilalim ng kanyang pangalan.
      audience: Mga nagsisisi na iniuugnay ang sarili sa pagsisisi ni Manases—ginagamit sa pagsamba sa ilang tradisyon.
      date: Bandang ika-2–ika-1 siglo BC.
    Psalm 151:
      display_name: Awit 151
      author: Hindi kilala; iniuugnay kay David sa ilalim ng kanyang pangalan. May anyong Hebreo na pinatutunayan ng 11QPsa.
      audience: Mga pamayanan sa Diaspora at Qumran na nagpapahalaga sa aklat ng mga awit ni David.
      date: Bandang ika-2 siglo BC o mas maaga.
    3 Maccabees:
      display_name: 3 Macabeo
      author: Hindi kilala; isinulat sa Griyego.
      audience: Mga Judiong nagsasalita ng Griyego sa diaspora ng Ehipto—isang salaysay ng pagliligtas na naganap sa panahon ni Ptolemy IV.
      date: Bandang ika-1 siglo BC hanggang ika-1 siglo AD.
    4 Maccabees:
      display_name: 4 Macabeo
      author: Hindi kilala; isang Judiong manunulat na nagsasalita ng Griyego at naimpluwensiyahan ng pilosopiyang Estoiko.
      audience: Mga Helenistikong Judio—isang pilosopikal na sermon tungkol sa katwirang nangingibabaw sa matinding damdamin sa pamamagitan ng katapatan.
      date: Bandang ika-1 siglo AD.
    Bel and the Dragon:
      display_name: Si Bel at ang Dragon
      author: Hindi kilala; isa sa mga Dagdag sa Daniel na nasa Griyego.
      audience: Mga Judiong nagsasalita ng Griyego—isang mapanuyang pagtuligsa sa pagsamba sa diyus-diyosan.
      date: Bandang ika-2–ika-1 siglo BC.
    Letter of Jeremiah:
      display_name: Liham ni Jeremias
      author: Hindi kilala; iniuugnay kay Jeremias sa ilalim ng kanyang pangalan.
      audience: Mga Judio sa diaspora na natutuksong sumamba sa mga diyus-diyosan sa kanilang paligid.
      date: Bandang ika-4–ika-2 siglo BC.
    Prayer of Azariah and Song of the Three:
      display_name: Panalangin ni Azarias at Awit ng Tatlo
      author: Hindi kilala; isa sa mga Dagdag sa Daniel na nasa Griyego.
      audience: Mga Judiong nagsasalita ng Griyego—materyal para sa pagsamba na kaugnay ng Daniel 3.
      date: Bandang ika-2 siglo BC.
    Susanna:
      display_name: Susana
      author: Hindi kilala; isa sa mga Dagdag sa Daniel na nasa Griyego.
      audience: Mga Judiong nagsasalita ng Griyego—isang kuwento tungkol sa katuwiran at sa pagsaway sa maling pagsaksi.
      date: Bandang ika-2–ika-1 siglo BC.
    1 Clement:
      display_name: 1 Clemente
      author: Hindi kilala; iniuugnay kay Clemente ng Roma.
      audience: Ang kapulungang Kristiyano sa Corinto, na nasangkot sa alitan tungkol sa pamumuno.
      date: Bandang AD 96.
