payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 Corinto
      author: Si Pablo, kasama si Sostenes.
      audience: Ang watak-watak na kapulungan ng mga Kristiyano sa Corinto.
      date: mga 53–55 AD, isinulat mula sa Efeso.
    2 Corinthians:
      display_name: 2 Corinto
      author: Si Pablo, kasama si Timoteo.
      audience: Ang kapulungan sa Corinto, matapos ang isang masakit na alitan.
      date: mga 55–56 AD.
    Galatians:
      display_name: Galacia
      author: Si Pablo.
      audience: Ang mga kapulungan ng mga Kristiyano sa Galacia (gitnang Anatolia) na ginigipit na magpatuli at sumunod sa Torah.
      date: mga 48–55 AD (pinagtatalunan).
    Ephesians:
      display_name: Efeso
      author: Si Pablo, o isang malapit na alagad na sumulat sa pangalan ni Pablo (pinagtatalunan).
      audience: Mga Kristiyanong mambabasa sa Asia sa pangkalahatan; wala ang pangalan ng lugar na “Efeso” sa pinakamatatandang manuskrito.
      date: mga dekada 60 AD kung kay Pablo; mga dekada 80–90 AD kung isinulat sa pangalan niya ng iba.
    Philippians:
      display_name: Filipos
      author: Si Pablo, kasama si Timoteo.
      audience: Ang kapulungan ng mga Kristiyano sa Filipos, isang kolonya ng Roma sa Macedonia.
      date: mga 60–62 AD, isinulat mula sa bilangguan.
    Colossians:
      display_name: Colosas
      author: Si Pablo, kasama si Timoteo—o isang malapit na alagad na sumulat sa pangalan ni Pablo (pinagtatalunan).
      audience: Ang mga Kristiyano sa Colosas, sa lambak ng Lycus, na nahaharap sa isang aral na naghahalo ng iba't ibang paniniwala.
      date: mga 60–62 AD kung kay Pablo; mas huli kung isinulat sa pangalan niya ng iba.
    1 Thessalonians:
      display_name: 1 Tesalonica
      author: Si Pablo, kasama sina Silvano at Timoteo.
      audience: Ang bagong tatag na kapulungan ng mga Kristiyano sa Tesalonica, na nahaharap sa pag-uusig.
      date: mga 50–51 AD—malamang na pinakamaagang liham ni Pablo na nananatili hanggang ngayon.
    2 Thessalonians:
      display_name: 2 Tesalonica
      author: Si Pablo (pinagtatalunan; itinuturing ng ilang iskolar na isinulat ito ng iba sa pangalan niya).
      audience: Ang kapulungan sa Tesalonica, upang tugunan ang kalituhan tungkol sa mga pangyayari sa wakas.
      date: mga 51 AD kung kay Pablo.
    1 Timothy:
      display_name: 1 Timoteo
      author: Si Pablo, o isang alagad na sumulat sa pangalan ni Pablo (malawak na itinuturing na isinulat sa pangalan niya ng iba ang mga Liham Pastoral).
      audience: Si Timoteo bilang kinatawan ni Pablo sa Efeso; isang gabay para sa kaayusan ng iglesya noong kalaunan.
      date: mga kalagitnaan ng dekada 60 AD kung kay Pablo; mga 90–110 AD kung isinulat sa pangalan niya ng iba.
    2 Timothy:
      display_name: 2 Timoteo
      author: Si Pablo, o isang alagad na sumulat sa pangalan ni Pablo.
      audience: Si Timoteo—iniharap bilang pamamaalam ni Pablo mula sa bilangguan.
      date: mga kalagitnaan ng dekada 60 AD kung kay Pablo; mga 90–110 AD kung isinulat sa pangalan niya ng iba.
    Titus:
      display_name: Tito
      author: Si Pablo, o isang alagad na sumulat sa pangalan ni Pablo.
      audience: Si Tito bilang kinatawan ni Pablo sa Creta.
      date: mga kalagitnaan ng dekada 60 AD kung kay Pablo; mga 90–110 AD kung isinulat sa pangalan niya ng iba.
    Philemon:
      display_name: Filemon
      author: Si Pablo, kasama si Timoteo.
      audience: Si Filemon, isang Kristiyanong may-ari ng alipin, tungkol kay Onesimo, ang alipin niyang tumakas.
      date: mga 60–62 AD.
    Hebrews:
      display_name: Mga Hebreo
      author: Hindi kilala. Ayon sa tradisyon, iminungkahi sina Pablo, Apolos, Bernabe, Priscila, at iba pa; walang mungkahing pinagkakasunduan ng nakararami.
      audience: Mga Kristiyanong Judio na nagsasalita ng Griyego at natutuksong umurong mula sa kanilang pagpapahayag ng pananampalatayang Kristiyano.
      date: mga 60–95 AD.
