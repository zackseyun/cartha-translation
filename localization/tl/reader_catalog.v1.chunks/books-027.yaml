payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Liham ni Policarpo sa mga Taga-Filipos
      author: Si Policarpo, obispo ng Smirna. Ayon sa ilang iskolar, maaaring pinagsama sa tekstong nakarating sa atin ang mga materyal na ipinadala sa mahigit sa isang pagkakataon.
      audience: Ang kapulungang Kristiyano sa Filipos, na humiling ng mga liham ni Ignacio at tumanggap ng payo tungkol sa pananampalataya, asal, pamumuno, salapi, at pagtitiyaga.
      date: Maaga hanggang kalagitnaan ng ikalawang siglo AD; malapit na kaugnay ng paglalakbay ni Ignacio ang kahit isang bahagi nito, samantalang ayon sa mga panukalang pinagsama-sama ang liham, maaaring medyo mas huli ang isang bahagi.
    Martyrdom of Polycarp:
      display_name: Ang Pagkamartir ni Policarpo
      author: Mga di-kilalang kasapi ng iglesya sa Smirna, na sumulat sa ngalan ng kanilang pamayanan; makikita sa mga pangwakas na tala tungkol sa pagpapasa ng teksto ang pagkopya at pagpapalaganap nito noong mga sumunod na panahon.
      audience: Ang iglesya sa Filomelio at ang mas malawak na pamayanang Kristiyano; inihandog sa kanila ang salaysay tungkol sa pagdakip, paglilitis, kamatayan, at ulirang pagtitiis ni Policarpo.
      date: Isinulat pagkamatay ni Policarpo at karaniwang itinatakda sa kalagitnaan o huling bahagi ng ikalawang siglo AD; pinagtatalunan kapwa ang eksaktong taon ng pagkamartir at ang pinal na anyo ng dokumento.
    Epistle to Diognetus:
      display_name: Liham kay Diogneto
      author: Hindi kilala. Tinatawag ng manunulat ang kanyang sarili na isang alagad o mag-aaral, ngunit hindi matiyak ang pagkakakilanlan niya ni ng sinulatan niyang si Diogneto.
      audience: Isang edukadong di-Kristiyanong nagtatanong—at mga mambabasang tulad niya—tungkol sa pagsamba, etika, pagkakakilanlan sa lipunan, at pag-ibig ng mga Kristiyano, pati sa waring pagiging bago ng pananampalataya.
      date: Madalas itakda sa huling bahagi ng ikalawa o unang bahagi ng ikatlong siglo AD, bagaman malaki ang pagkakaiba-iba ng mga panukala; maaaring nagmula sa ibang akda ang huling dalawang kabanata.
    Fragments of Papias:
      display_name: Mga Sipi mula kay Papias
      author: Si Papias, obispo ng Hierapolis, ang may-akda ng nawawalang limang-aklat na Pagpapaliwanag sa mga Sinabi ng Panginoon; ang nalalabing kalipunan ay binubuo ng mga sipi at ulat na iningatan ng mga sumunod na may-akda.
      audience: Mga sinaunang Kristiyanong naghahanap ng mga naalaalang turo tungkol kay Jesus at sa mga apostol, na tinipon sa pamamagitan ng mga binanggit na kawing ng pasalitang patotoo at pagpapaliwanag.
      date: Karaniwang itinatakda ang akda ni Papias sa unang bahagi ng ikalawang siglo AD, madalas sa bandang 110–130; makikita ang nalalabing mga sipi sa mga may-akdang sumulat mula sa ikalawang siglo at sa mga sumunod pa.
