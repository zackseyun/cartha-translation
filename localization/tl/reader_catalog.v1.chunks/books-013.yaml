payload:
  book_metadata:
    James:
      display_name: Santiago
      author: Ayon sa tradisyon, si Santiago na kapatid ni Jesus; hati ang mga makabagong iskolar kung tunay na siya ang may-akda o ginamit lamang ang kanyang pangalan.
      audience: Mga kapulungang Kristiyanong Judio sa diaspora.
      date: Mga dekada 50–60 AD kung tunay na si Santiago ang may-akda; bandang huling bahagi ng ika-1 siglo AD kung ginamit lamang ang kanyang pangalan.
    1 Peter:
      display_name: 1 Pedro
      author: Ayon sa tradisyon, si apostol Pedro, at si Silvano ang tagasulat; ipinapalagay ng ilang iskolar na ginamit lamang ang pangalan ni Pedro.
      audience: Mga Kristiyano sa Romanong Asia Minor na nakararanas ng paghamak ng lipunan.
      date: Mga dekada 60 AD kung kay Pedro; mga dekada 70–90 AD kung ginamit lamang ang kanyang pangalan.
    2 Peter:
      display_name: 2 Pedro
      author: Ayon sa tradisyon, si Pedro; malawak na pinaniniwalaan ng mga makabagong iskolar na ginamit lamang ang kanyang pangalan.
      audience: Mga Kristiyanong humaharap sa mga manlilibak na nagkakaila sa muling pagparito ni Cristo.
      date: Bandang unang bahagi ng ika-2 siglo AD.
    1 John:
      display_name: 1 Juan
      author: Hindi kilala; ayon sa tradisyon, si apostol Juan o ang nakatatandang pinuno ng pamayanang kaugnay ni Juan.
      audience: Pamayanang kaugnay ni Juan matapos ang pagkakahati, na nililinaw kung sino ang tunay na kabilang dito.
      date: Bandang 90–110 AD.
    2 John:
      display_name: 2 Juan
      author: “Ang nakatatanda.”
      audience: Isang partikular na kapulungang Kristiyano (“ang hinirang na ginang”) na binabalaan laban sa mga huwad na guro.
      date: Bandang 90–110 AD.
    3 John:
      display_name: 3 Juan
      author: “Ang nakatatanda.”
      audience: Si Gayo, isang indibiduwal na pinunong tumatanggap sa mga naglalakbay na misyonero.
      date: Bandang 90–110 AD.
    Jude:
      display_name: Judas
      author: Ayon sa tradisyon, si Judas na kapatid ni Santiago at ni Jesus.
      audience: Mga pamayanang Kristiyano na pinapasok ng mga gurong nagtataguyod ng maluwag na pamumuhay.
      date: Bandang mga dekada 60–90 AD.
    Revelation:
      display_name: Pahayag
      author: Si Juan ng Patmos (naiiba ang estilo sa Ikaapat na Ebanghelyo).
      audience: Pitong kapulungang Kristiyano sa Romanong Asia Minor na nasa ilalim ng panggigipit ng imperyo.
      date: Bandang dekada 90 AD, ayon sa tradisyon ay sa panahon ng paghahari ni Domiciano.
    Tobit:
      display_name: Tobit
      author: Hindi kilala.
      audience: Mga Judiong nasa diaspora na nagsisikap mamuhay nang may kabanalan at unawain ang pag-aasawa at pagkalinga ng Diyos sa ilalim ng dayuhang pamamahala.
      date: Bandang 225–175 BC; isinulat sa Aramaico, at may bersiyong Hebreo ring pinatutunayan sa Qumran.
    Judith:
      display_name: Judit
      author: Hindi kilala.
      audience: Mga Judiong nahaharap sa banta ng mga dayuhan—isang mapanghamong salaysay ng banal na paglaban.
      date: Bandang 150–100 BC.
    Greek Additions to Esther:
      display_name: Mga Dagdag sa Ester sa Griyego
      author: Hindi kilala; mga karagdagang bahaging idinagdag sa saling Griyego ng Ester.
      audience: Mga Judiong nagsasalita ng Griyego na nagnanais ng salaysay tungkol kay Ester na may hayagang panalangin at pagtukoy sa Diyos.
      date: Bandang ika-2–ika-1 siglo BC.
    Wisdom of Solomon:
      display_name: Karunungan ni Solomon
      author: Hindi kilala; ipinangalan kay Solomon kahit hindi siya ang may-akda. Isinulat sa Griyego ng isang Helenistikong Judiong may-akda, malamang sa Alejandria.
      audience: Mga Helenistikong Judio na nakikipag-ugnayan sa pilosopiyang Griyego at ipinagtatanggol ang karunungan ng Israel laban sa mga alternatibong pagano at tumalikod sa pananampalataya.
      date: Bandang 50 BC–50 AD.
