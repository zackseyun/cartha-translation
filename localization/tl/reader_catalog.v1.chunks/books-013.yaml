review:
  verdict: revise
  review_summary: Binago ang mga saling may dagdag, kulang, o bahagyang maling diin upang manatiling tapat sa canonical English source; kumpleto ang lahat ng field.
  issues:
  - Inalis ang dagdag na 'pag-uusig' sa 1 Peter audience, dahil social hostility lamang ang source.
  - Inayos ang ilang pamagat upang hindi magdagdag ng layon o magbago ng diin, lalo na sa 1 Peter 5, 2 Peter 2, Revelation 5, 10, at Tobit 2.
  - Nilinaw ang 3 John audience at ang patunay ng Hebreong bersiyon ng Tobit sa Qumran.
  - Inayos ang ilang salitang mas tumpak para sa source, gaya ng 'nagpropesiya' at 'kabutihang-asal'.
