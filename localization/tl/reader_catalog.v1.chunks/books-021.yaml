review:
  verdict: revise
  review_summary: Napanatili ang kumpleto at tapat na lokalisasyon ng lahat ng field. Inayos ang ilang pamagat upang maging mas tumpak sa source, lalo na ang “grip,” “Exodus,” hinaharap na pagtataksil ng mga pari, “illumines,” at pagkabuhay-muli ng mga patriyarka.
  issues:
  - 'Testament of Reuben 1: Ang “paghahari” ay mas malakas kaysa “grip”; ginawang “mahigpit na kapit.”'
  - 'Testament of Simeon 9: Ang “Exodus” ay hindi lamang pangkalahatang “pag-alis”; ginawang “Exodo.”'
  - 'Testament of Levi 14, 18: Ibinalik ang hinaharap na aspekto ng “will betray” at ang kahulugang “illumines.”'
  - 'Testament of Judah 25: Ginawang mas idiomatiko at tumpak ang “resurrected.”'
