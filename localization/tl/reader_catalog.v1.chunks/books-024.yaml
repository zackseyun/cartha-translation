review:
  verdict: revise
  review_summary: Kumpleto at halos tapat ang salin. Inayos ang ilang pananalitang kulang o mas malakas kaysa sa pinagmulan, lalo na ang pseudonymous na pag-uugnay sa Liham ni Pedro kay Felipe at ang neutral na “hands over” sa Ebanghelyo ni Judas.
  issues:
  - Nilinaw na pseudonymous ang pag-uugnay ng Liham ni Pedro kay Felipe, gaya ng source.
  - Pinalitan ang “Ipinagkanulo” ng “Isinuko” para sa neutral na “hands over” sa Gospel of Judas 7.
  - Pinakinis ang ilang pamagat upang mas tuwirang tumbasan ang source nang hindi nagdaragdag ng kahulugan.
