payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Ang Kalagayan ng mga Arkonte
      author: Hindi kilala. Binibigyang-kahulugan ng may-akda ang Genesis sa pamamagitan ng isang mito ng paghahayag tungkol sa mga arkonte; hindi matitiyak na maiuugnay ang akda sa sinumang gurong kilala sa pangalan.
      audience: Mga Kristiyano sa isang pamayanang Setiano o kaugnay nito na bumabasa sa Genesis bilang tunggalian ng mga mangmang na tagapamahala ng kosmos, banal na karunungan, at espirituwal na pinagmulan ng sangkatauhan.
      date: Karaniwang inilalagay sa ika-3 siglo AD; napanatili sa isang Coptic na sipi mula sa ika-4 na siglo sa Nag Hammadi Codex II.
    On the Origin of the World:
      display_name: Tungkol sa Pinagmulan ng Daigdig
      author: Hindi kilala. Pinagsasama at binabago ng akda ang ilang tradisyong Judio, Kristiyano, Platoniko, at mitolohikal nang hindi pinapangalanan ang tagapagtipon nito.
      audience: Mga mambabasa sa isang kapaligirang Kristiyano na may impluwensiyang Gnostiko at naghahanap ng alternatibong salaysay tungkol sa paglikha, sa mga tagapamahala ng kosmos, kay Sophia, kina Adan at Eva, at sa pangwakas na hantungan ng daigdig.
      date: Karaniwang ipinapalagay na mula sa ika-3 siglo AD, bagaman maaaring may mas naunang mga materyal na pinagbabatayan ito; pangunahing napanatili sa mga Coptic na saksi mula sa ika-4 na siglo.
    Sophia of Jesus Christ:
      display_name: Karunungan ni Jesu-Cristo
      author: Hindi kilala. Iniangkop ng may-akda ang materyal na matatagpuan din sa Eugnostos upang maging isang pag-uusap ni Jesus at ng kaniyang mga alagad pagkatapos ng muling pagkabuhay.
      audience: Mga Kristiyanong interesado sa inihayag na karunungan tungkol sa Diyos na higit sa lahat, sa kaayusan ng makalangit na daigdig, at sa pinagmulan at kaligtasan ng kaluluwa.
      date: Madalas itakda sa huling bahagi ng ika-2 siglo o sa ika-3 siglo AD; napanatili sa mga Coptic na sipi mula sa Nag Hammadi at sa Berlin Codex.
    Gospel of the Egyptians:
      display_name: Ebanghelyo ng mga Ehipsiyo
      author: Hindi kilala. Ang akdang ito mula sa Nag Hammadi, na tinatawag ding Banal na Aklat ng Dakilang Espiritung Di-nakikita, ay naiiba sa mas naunang Griegong Ebanghelyo ng mga Ehipsiyo na nakikilala lamang sa pamamagitan ng mga sipi.
      audience: Isang pamayanang Kristiyanong Setiano na gumagamit ng masalimuot na mito, mga sagradong pangalan, mga larawang kaugnay ng bautismo, at papuring parang himno upang ipahayag ang espirituwal na pagkakakilanlan at paglaya.
      date: Karaniwang itinatakda sa ika-2 o ika-3 siglo AD; dalawang Coptic na sipi ang nananatili sa mga codex ng Nag Hammadi mula sa ika-4 na siglo.
    Letter of Peter to Philip:
      display_name: Liham ni Pedro kay Felipe
      author: Hindi kilala. Ang maikling pambungad na liham at ang kasunod na paghahayag ay pseudonymously na iniuugnay kina Pedro at Felipe sa halip na matiyak na isinulat ng alinman sa dalawang apostol.
      audience: Mga Kristiyanong naghahanap ng awtoridad ng mga apostol para sa turo tungkol sa Tagapagligtas, sa mga mapanlabang kapangyarihan, pagdurusa, misyon, at pagpapanumbalik sa mga alagad.
      date: Karaniwang itinatakda sa huling bahagi ng ika-2 siglo o unang bahagi ng ika-3 siglo AD; napanatili sa isang sipi mula sa Nag Hammadi noong ika-4 na siglo at sa isa pang mas huling Coptic na saksi.
    Gospel of Judas:
      display_name: Ebanghelyo ni Judas
      author: Hindi kilala. Iniuugnay ng pamagat ang salaysay kay Judas, ngunit hindi pinatutunayan ng akda na si Judas Iscariote ang makasaysayang may-akda nito.
      audience: Isang grupong Kristiyano na tumutuligsa sa mga gawaing panghain at pansimbahan ng mga karibal, at gumagamit ng pag-uusap na naghahayag at kosmolohiyang kahawig ng Setiano upang muling bigyang-kahulugan si Judas at ang kamatayan ni Jesus.
      date: Karaniwang itinatakda sa kalagitnaan o huling bahagi ng ika-2 siglo AD; may alam si Irenaeus na isang Ebanghelyo ni Judas noong bandang 180, at malamang na mula sa ika-3 o ika-4 na siglo ang nananatiling Coptic na sipi.
    Protoevangelium of James:
      display_name: Protoebanghelyo ni Santiago
      author: Hindi kilala. Sinasabi ng tagapagsalaysay na siya si Santiago, ngunit isinulat ang akda sa pangalan nito ng ibang tao at hindi ito gawa ni Santiago na kapatid ni Jesus.
      audience: Mga Kristiyanong interesado sa kapanganakan at paglaki ni Maria, sa kaniyang di-naglahong kadalisayan, sa kapanganakan ni Jesus, at sa mga sagot na pasalaysay sa mga tanong na iniwang bukas ng Mateo at Lucas.
      date: Karaniwang itinatakda sa huling kalahati ng ika-2 siglo AD; nananatili ito sa maraming mas huling manuskritong Griego at sinaunang salin.
