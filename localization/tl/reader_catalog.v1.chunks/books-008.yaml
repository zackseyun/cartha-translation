    Isaiah:
      display_name: Isaias
      author: Maraming may-akda sa loob ng ilang siglo; ang mga kabanata 1–39 ay nag-ugat sa gawain ni Isaias ng Jerusalem noong ika-8 siglo BC, samantalang ang 40–55 ("Ikalawang Isaias") at 56–66 ("Ikatlong Isaias") ay tumutugon sa pagkatapon at pagbabalik.
      audience: Sunod-sunod na para sa Juda sa ilalim ng banta ng Asiria, sa mga ipinatapon sa Babilonia, at sa mga nagpanumbalik ng bayan pagkatapos ng pagkatapon.
      date: Binubuo sa loob ng panahong humigit-kumulang mula sa huling bahagi ng ika-8 siglo hanggang ika-5 siglo BC.
    Jeremiah:
      display_name: Jeremias
      author: Si Jeremias na taga-Anatot; malaki ang naging bahagi ng kalihim niyang si Baruc at ng mga sumunod na patnugot sa pag-edit nito.
      audience: Juda bago, habang, at pagkatapos ng pananakop ng Babilonia.
      date: Huling bahagi ng ika-7 siglo hanggang unang bahagi ng ika-6 siglo BC.
