  issues:
  - 'Isaias 18: Inalis ang paulit-ulit at di-natural na pariralang “sa Malayong Lugar” upang tumukoy sa malayong lupain na nagpapadala ng mga sugo.'
  - 'Isaias 29: Inayos ang aspekto upang tumugma sa pamagat na naglalarawan ng Jerusalem sa ilalim ng pagkubkob.'
  - 'Isaias 54: Ginawang mas tapat ang “restores” bilang “ipinapanumbalik.”'
  - 'Jeremias 3 at 25: Inayos ang aspekto at pagkakalahad upang tumugma sa kasalukuyang pagbabalik ng Israel at sa pagdating ni Nabucodonosor laban sa Juda.'
