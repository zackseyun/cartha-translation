  book_metadata:
    Lamentations:
      display_name: Mga Panaghoy
      author: Hindi kilala; ayon sa tradisyon, si Jeremias ang sumulat nito.
      audience: Mga taga-Juda na nagdadalamhati sa pagkawasak ng Jerusalem noong 586 BC.
      date: Di-nagtagal pagkatapos ng 586 BC.
    Ezekiel:
      display_name: Ezekiel
      author: Si Ezekiel, isang paring ipinatapon sa Babilonia; dumaan din ito sa paglinang ng mga patnugot.
      audience: Mga taga-Juda na ipinatapon sa Babilonia at muling inuunawa ang presensya ng Diyos kahit malayo sa templo.
      date: Humigit-kumulang 593–571 BC ang ministeryo ng propeta; nabuo ang panghuling anyo nito nang mas huli nang kaunti.
    Daniel:
      display_name: Daniel
      author: Hindi kilala; inilalahad ng aklat na ito na si Daniel noong panahon ng pagkakatapon ang may-akda nito.
      audience: Mga Judio na inuusig sa ilalim ng mga Helenista—lalo na sa pamumuno ni Antioco IV Epifanes (167–164 BC).
      date: Umabot sa kinikilalang anyo nito noong humigit-kumulang 165 BC; ginamit sa kabanata 1–6 ang mas matatandang salaysay tungkol sa buhay sa palasyo.
    Hosea:
      display_name: Oseas
      author: Si Oseas na anak ni Beeri.
      audience: Ang hilagang kaharian ng Israel sa mga huling dekada nito bago sakupin ng Asiria.
      date: Humigit-kumulang 750–722 BC.
