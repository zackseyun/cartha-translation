      display_name: Ebanghelyo ni Felipe
      author: Hindi kilala. Makikita ang pamagat sa pangwakas na tala ng manuskrito, ngunit hindi sinasabi ng akda na si Felipe ang sumulat nito. Ang tanging natitirang kopya ay ang tekstong Koptiko sa Nag Hammadi Codex II,3.
      audience: Isang sinaunang pamayanang Kristiyano na pamilyar sa pagtuturong sakramental na kahawig ng tradisyong Valentinian, lalo na tungkol sa bautismo, pagpapahid ng langis, Eukaristiya, pagtubos, muling pagkabuhay, at larawan ng silid-pangkasal.
      date: Karaniwang itinatakda sa huling bahagi ng ika-2 siglo o unang bahagi ng ika-3 siglo AD; napanatili sa isang manuskritong Koptiko mula sa ika-4 na siglo na isinalin mula sa isang mas naunang anyong Griyego.
