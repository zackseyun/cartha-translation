      display_name: 1 Enoc
      author: Hindi kilala; iniuugnay sa ilalim ng sagisag na pangalan sa patriyarkang si Enoc na nabuhay bago ang Baha. Isang pinagsama-samang akda na binuo mula sa ilang magkakaibang bahagi.
      audience: Mga pamayanang apokaliptiko ng mga Judio na nagmumuni-muni tungkol sa kasamaan sa sansinukob, paghatol, at kalendaryo; binasa rin nang maglaon sa mga sinaunang pamayanang Kristiyano.
      date: Pinagsama-sama ang mga bahagi noong humigit-kumulang ika-3 siglo BC hanggang ika-1 siglo AD; ang buong teksto ay napanatili lamang sa Ge'ez (Etiopiko).
