  book_metadata:
    Luke:
      display_name: Lucas
      author: Hindi kilala; ayon sa tradisyon, si Lucas na kasama ni Pablo sa paglalakbay ang sumulat nito.
      audience: Mga Kristiyanong mambabasa sa daigdig na Griyego-Romano na marunong bumasa at sumulat; inihandog ito kay “Teofilo.”
      date: mga 80–90 AD.
    John:
      display_name: Juan
      author: Hindi kilala; ayon sa tradisyon, si apostol Juan o ang “Minamahal na Alagad” ang sumulat nito.
      audience: Isang pamayanang Kristiyano na may tensiyon sa Judaismong nakasentro sa sinagoga at nabuo sa paligid ng patotoo ng Minamahal na Alagad.
      date: mga 90–110 AD.
      summary: Inilalarawan ni Juan si Jesus bilang walang-hanggang Salita na naghahayag sa Ama, nagbibigay ng buhay sa mga nagtitiwala sa kanya, at niluluwalhati sa pamamagitan ng kanyang mga tanda, kamatayan, at muling pagkabuhay.
    Acts:
      display_name: Mga Gawa
      author: Hindi kilala; siya rin ang may-akda ng Lucas.
      audience: Mga Kristiyanong mambabasa sa daigdig na Griyego-Romano; ito ang ikalawang bahagi ng akdang inihandog kay Teofilo.
      date: mga 80–90 AD.
    Romans:
      display_name: Mga Taga-Roma
      author: Si Pablo, sa tulong ng tagasulat na si Tercio.
      audience: Mga Kristiyano sa Roma—mga mananampalatayang Judio at hindi Judio na may tensiyon tungkol sa Torah at pagkakakilanlan.
      date: mga 56–58 AD, isinulat mula sa Corinto.
