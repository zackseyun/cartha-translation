  issues:
  - 'John 15: Ang draft na “pumuputol sa mga sanga” ay hindi tumpak na katumbas ng “prunes branches”; ginawang “pumupungos ng mga sanga.”'
  - 'John 20: Ang “Nagpakita si Jesus kay Maria” ay mas pangkalahatan kaysa “reveals self to Mary”; ginawang “Ipinakilala ni Jesus ang Sarili Niya kay Maria.”'
