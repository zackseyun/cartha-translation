  book_metadata:
    Genesis:
      display_name: Genesis
      author: Hindi kilala ang may-akda; ayon sa tradisyon, iniuugnay kay Moises. Ayon sa makabagong pag-aaral, mahaba ang kasaysayan ng pagkakabuo nito, at ang mga pinagkunang teksto ay pinagsama-sama at inayos nang dakong huli.
      audience: Ang Israel bilang bayang may pagkakakilanlang nakaugat sa tipan, na itinatag ang salaysay ng pinagmulan ng bayan sa paglikha, pagpili, at pangako ng Diyos.
      date: Nabuo sa loob ng maraming siglo; umabot sa kinikilalang anyo nito noong humigit-kumulang ika-6–5 siglo BC, sa panahon o pagkatapos ng pagkakatapon sa Babilonia.
      summary: Isinasalaysay sa Genesis ang paglikha, ang paghihimagsik at pagkakawatak-watak ng sangkatauhan, at ang pamilya nina Abraham, Isaac, Jacob, at Jose, na sa pamamagitan nila ay nagsimula ang mga pangako ng Diyos sa Israel ayon sa tipan.
    Exodus:
      display_name: Exodo
      author: Hindi kilala ang may-akda; ayon sa tradisyon, iniuugnay kay Moises. Ayon sa makabagong pag-aaral, mahaba ang kasaysayan ng pagkakabuo nito, at ang mga pinagkunang teksto ay pinagsama-sama at inayos nang dakong huli.
      audience: Ang Israel bilang bayang pinalaya at nakipagtipan, na natututuhan kung ano ang ibig sabihin ng pagiging bansa ng PANGINOON sa ilalim ng kanyang kautusan.
      date: Nabuo sa loob ng maraming siglo; umabot sa kinikilalang anyo nito noong humigit-kumulang ika-6–5 siglo BC.
    Leviticus:
      display_name: Levitico
      author: Hindi kilala ang may-akda; ayon sa tradisyon, iniuugnay kay Moises. Iniuugnay ito ng makabagong pag-aaral sa tinatawag na Pinagkunang Makasaserdote.
      audience: Ang mga paring Israelita at ang sambayanang sumasamba—mga tagubilin tungkol sa paghahandog, kabanalan, at pagsasaayos ng buhay sa paligid ng presensya ng Diyos.
      date: May mga patong ng pagkakabuo mula sa huling bahagi ng panahon ng monarkiya hanggang sa panahon matapos ang pagkakatapon (humigit-kumulang ika-7–5 siglo BC).
