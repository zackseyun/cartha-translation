    Proverbs:
      display_name: Mga Kawikaan
      author: Isang antolohiya; binabanggit sa mga pamagat si Solomon, si Agur, si Lemuel, at ang “mga pantas.”
      audience: Mga kabataang Israelita na hinuhubog sa karunungan para sa pang-araw-araw na buhay.
      date: Mga bahagi na binuo mula bandang ika-10 hanggang ika-4 na siglo BC.
    Ecclesiastes:
      display_name: Mangangaral
      author: Hindi kilala; ang nagsasalita ay si “Qohelet,” na ayon sa tradisyon ay kinikilalang si Solomon.
      audience: Mga Israelitang humaharap sa mga limitasyon ng karunungan, kayamanan, at pagsisikap sa ilalim ng araw.
      date: Malamang bandang ika-5 hanggang ika-3 siglo BC, batay sa Hebreong naimpluwensiyahan ng Aramaico.
    Song of Solomon:
      display_name: Awit ni Solomon
      author: Hindi kilala; binabanggit si Solomon sa pamagat.
      audience: Ang Israel, na binabasa ang erotikong pag-ibig bilang lente sa matalik na ugnayan ng tipan—at nang lumaon, ang mga mambabasang Judio at Kristiyano na binabasa ito bilang alegorya.
      date: Malamang mula sa panahon pagkaraan ng pagkakatapon, bandang ika-5 hanggang ika-3 siglo BC.
