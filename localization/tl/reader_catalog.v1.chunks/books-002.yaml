    Numbers:
      display_name: Mga Bilang
      author: Hindi kilala; ayon sa tradisyon, iniuugnay kay Moises.
      audience: Ang Israel habang naglalakbay mula sa Ehipto patungo sa lupang pangako—ang salinlahing nasa ilang, at ang mga mambabasa noong kalaunan na natututo mula sa kanilang mga pagkakamali.
      date: May mga bahaging nabuo mula sa huling panahon ng monarkiya hanggang sa panahon matapos ang pagkakatapon (humigit-kumulang ika-7–ika-5 siglo BC).
    Deuteronomy:
      display_name: Deuteronomio
      author: Hindi kilala; inilahad bilang mga pamamaalam na talumpati ni Moises. Itinuturing ng makabagong pag-aaral na nag-ugat ang isang pangunahing bahagi nito sa reporma sa ilalim ni Josias noong huling bahagi ng ika-7 siglo BC.
      audience: Ang Israel habang naghahanda itong pumasok sa lupain—at, noong kalaunan, ang mga tapon na nagtatanong kung paano mamumuhay nang tapat kahit walang templo o hari.
      date: Ang pangunahing bahagi ay mula sa humigit-kumulang huling bahagi ng ika-7 siglo BC; umabot sa pinal na anyo noong panahon ng pagkakatapon.
    Joshua:
      display_name: Josue
      author: Hindi kilala; bahagi ng Kasaysayang Deuteronomistiko.
      audience: Ang Israel noong panahon ng monarkiya at pagkakatapon, na nagninilay tungkol sa pananakop, tipan, at kahulugan ng lupain.
      date: Tinipon noong humigit-kumulang ika-7–ika-6 na siglo BC mula sa mas matatandang tradisyon.
