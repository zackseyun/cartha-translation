payload:
  book_metadata:
    Sirach:
      display_name: Sirac
      author: Yeshua ben Eleazar ben Sira ng Jerusalem; isinalin sa Griyego ng kaniyang apo.
      audience: Mga kabataang lalaking Judio na sinasanay sa karunungan sa Jerusalem noong panahong Helenistiko.
      date: Orihinal na Hebreo, humigit-kumulang 195–175 BC; saling Griyego, humigit-kumulang 132 BC.
    Baruch:
      display_name: Baruc
      author: Hindi kilala; iniuugnay sa ilalim ng sagisag na pangalan kay Baruc, ang kalihim ni Jeremias.
      audience: Mga Judiong nasa diaspora na nagmumuni-muni tungkol sa pagkakatapon, pagsisisi, at karunungan.
      date: Humigit-kumulang ika-2 siglo BC.
    1 Maccabees:
      display_name: 1 Macabeo
      author: Hindi kilala; malamang na isang may-akda mula sa Jerusalem na sumulat sa Hebreo (ang tekstong Griyego lamang ang nananatili).
      audience: Mga Judio sa panahon ng pag-aalsa ng mga Hasmoneo at pagkatapos nito; isinasalaysay ang pagiging lehitimo ng dinastiyang Hasmoneo.
      date: Humigit-kumulang 100 BC.
    2 Maccabees:
      display_name: 2 Macabeo
      author: Isang hindi kilalang tagapagpaikli ng mas mahabang akda ni Jason ng Cirene; isinulat sa Griyego.
      audience: Mga Judiong nagsasalita ng Griyego sa diaspora—binibigyang-diin ang pagkamartir, pagkalinga ng Diyos, at muling pagkabuhay.
      date: Humigit-kumulang 124 BC o di-nagtagal pagkatapos nito.
