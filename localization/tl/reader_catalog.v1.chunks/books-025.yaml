payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Ebanghelyo ni Tomas tungkol sa Kabataan ni Jesus
      author: Hindi kilala. Walang binanggit na may-akda sa pinakamaagang anyo nito na maaaring matukoy; ang pag-uugnay kay Tomas ay nagmula sa mga pamagat ng mas huling manuskrito at sa pagpapasa ng teksto.
      audience: Mga Kristiyanong interesado sa pagkabata ni Jesus at sa kung paano maisasalaysay ang kapangyarihan ng Diyos, disiplina, pagkatuto, at paglago niya bago magsimula ang mga salaysay ng mga kanonikong Ebanghelyo.
      date: Karaniwang ipinapalagay na nagmula ito noong ika-2 siglo AD, ngunit nananatili ang teksto sa ilang bersiyong Griego na malaki ang pagkakaiba at sa mga sinaunang salin.
    Acts of Paul and Thecla:
      display_name: Mga Gawa nina Pablo at Tecla
      author: Hindi kilala. Isa itong bahagi ng mas mahabang Mga Gawa ni Pablo; hindi sapat ang isang sinaunang ulat na isang presbitero ang sumulat ng Mga Gawa upang matiyak kung sino ang may-akda.
      audience: Mga Kristiyanong naaakit sa mga salaysay tungkol sa pangangaral ng mga apostol, hindi pag-aasawa, bautismo, pagtitiis na gaya ng sa isang martir, at awtoridad ng isang babae na magturo at magpatotoo.
      date: Isinulat noong ika-2 siglo AD, marahil sa huling kalahati nito; kumalat ito kapuwa bilang bahagi ng Mga Gawa ni Pablo at bilang hiwalay na akda.
    Gospel of Peter:
      display_name: Ebanghelyo ni Pedro
      author: Hindi kilala. Nagsasalita ang natitirang salaysay sa tinig ni Pedro at ipinasa sa ilalim ng kaniyang pangalan, ngunit hindi ito itinuturing na akda ng makasaysayang apostol.
      audience: Mga sinaunang Kristiyanong interesado sa mas pinalawak na salaysay ng pagpapakasakit at muling pagkabuhay, marahil sa mga pamayanang nagbigay ng natatanging bigat sa awtoridad ni Pedro.
      date: Karaniwang itinatakda sa ika-2 siglo AD; ang pangunahing natitirang bahagi sa Griego ay mula sa isang mas huling manuskritong natagpuan sa Akhmim.
    2 Clement:
      display_name: 2 Clemente
      author: Hindi kilala. Sa kabila ng tradisyonal na pamagat nito, isa itong sinaunang homiliyang Kristiyano at hindi ikalawang liham ni Clemente ng Roma.
      audience: Isang kapulungang Kristiyano na hinihimok na magsisi, mamuhay nang naaayon sa kanilang mga paniniwala, pangalagaan ang mahihina, at matapat na magtiis habang umaasa sa muling pagkabuhay at paghuhukom.
      date: Karaniwang itinatakda sa unang kalahati o kalagitnaan ng ika-2 siglo AD (humigit-kumulang c. 100–160); hindi tiyak kung saan ito isinulat.
    Epistle of Barnabas:
      display_name: Sulat ni Bernabe
      author: Hindi kilala. Ayon sa tradisyon, iniugnay ang akda kay Bernabe na kasama ni Pablo, ngunit hindi tinatanggap ng makabagong pag-aaral ang pag-uugnay na iyon.
      audience: Mga Kristiyanong Hentil na tinuturuan na angkinin ang mga Kasulatan ng Israel sa pamamagitan ng interpretasyong nakasentro kay Cristo at alegorikal, habang itinatangi ang kanilang pagkakakilanlan sa tipan mula sa mga kaugaliang Judio.
      date: Karaniwang itinatakda sa pagitan ng pagkawasak ng templo sa Jerusalem noong AD 70 at ng unang bahagi ng ika-2 siglo, madalas sa c. 80–130.
