review:
  verdict: revise
  review_summary: Naibigay ang kumpletong rebisadong salin. Itinama ang ilang pamagat na nagbago ng ugnayan o kahulugan sa pinagmulan.
  issues:
  - 'Acts of Paul and Thecla 2: inayos ang di-ganap na pahayag upang malinaw na si Tecla ang nananabik kay Pablo.'
  - 'Acts of Paul and Thecla 11: itinama ang kahulugang ang belo ni Tecla ang iniligtas, hindi si Tecla na nasa likod ng tabing.'
  - 'Protoevangelium of James 28: itinama ang maling ''kay Maria'' tungo sa ''himala ni Maria''.'
  - '2 Clement 7: ''contest'' ay isinaling ''paligsahan'', hindi ''laban''.'
  - 'Epistle of Barnabas 8: isinalin ang ''foreshadows'' bilang pagpapahiwatig nang patiuna.'
