payload:
  book_metadata:
    Joel:
      display_name: Joel
      author: Si Joel na anak ni Petuel.
      audience: Ang Juda pagkatapos ng pagkakatapon, habang tumutugon sa salot ng mga balang bilang tanda ng Araw ng PANGINOON.
      date: Malamang noong mga ika-5–ika-4 na siglo BC.
    Amos:
      display_name: Amos
      author: Si Amos na taga-Tekoa, isang pastol mula sa Juda na nangaral sa hilaga.
      audience: Ang hilagang Israel sa panahon ng kasaganaan at kawalang-katarungan sa ilalim ni Jeroboam II.
      date: Mga 760–750 BC.
    Obadiah:
      display_name: Obadias
      author: Si Obadias.
      audience: Ang Juda matapos ipagkanulo ng Edom ang Jerusalem—isang propesiya tungkol sa pagbagsak ng Edom.
      date: Hindi nagtagal pagkatapos ng 586 BC.
    Jonah:
      display_name: Jonas
      author: Hindi kilala; ang pangunahing tauhan ay si Jonas na anak ni Amitai.
      audience: Ang Israel pagkatapos ng pagkakatapon—isang satirikong pagsaway sa makitid na pagkiling sa sariling lahi at pagpapatibay sa awa ng Diyos sa mga tagalabas.
      date: Malamang noong mga ika-5–ika-4 na siglo BC.
    Micah:
      display_name: Mikas
      author: Si Mikas na taga-Moreset.
      audience: Ang Juda noong huling bahagi ng ika-8 siglo BC, lalo na ang mahihirap sa kanayunan na sinasamantala ng mga makapangyarihan sa lungsod.
      date: Mga 740–700 BC.
    Nahum:
      display_name: Nahum
      author: Si Nahum na taga-Elkos.
      audience: Ang Juda habang ipinagdiriwang ang nalalapit na pagbagsak ng Nineve.
      date: Ilang sandali bago ang 612 BC.
    Habakkuk:
      display_name: Habakuk
      author: Si Habakuk.
      audience: Ang Juda habang nahaharap sa pag-angat ng Babilonia—isang pakikipag-usap ng propeta sa Diyos tungkol sa katarungan.
      date: Mga huling bahagi ng ika-7 siglo BC.
    Zephaniah:
      display_name: Zefanias
      author: Si Zefanias na anak ni Cusi.
      audience: Ang Juda sa ilalim ni Josias, bago magsimula ang kanyang mga reporma.
      date: Mga 640–609 BC.
    Haggai:
      display_name: Hagai
      author: Si Hagai.
      audience: Ang mga nagbalik mula sa pagkakatapon na muling nagtatayo ng templo sa ilalim ni Dario.
      date: 520 BC.
    Zechariah:
      display_name: Zacarias
      author: Si Zacarias na anak ni Berequias; ang mga kabanata 9–14 ay malamang na mula sa mas huling manunulat.
      audience: Ang mga nagbalik mula sa pagkakatapon na muling nagtatayo ng templo, at ang mas huling mga pamayanan pagkatapos ng pagkakatapon.
      date: Ang mga kabanata 1–8 ay mula sa mga 520–518 BC; ang 9–14 ay marahil isinulat makalipas ang isang siglo.
    Malachi:
      display_name: Malakias
      author: Hindi kilala; ang “Malakias” ay nangangahulugang “aking sugo.”
      audience: Ang Juda pagkatapos ng pagkakatapon, na nagiging pabaya sa pagsamba at katapatan sa ilalim ng pamamahala ng Persia.
      date: Mga kalagitnaan ng ika-5 siglo BC.
    Matthew:
      display_name: Mateo
      author: Hindi kilala; ayon sa tradisyon, isinulat ito ni apostol Mateo. Sa makabagong pag-aaral, itinuturing na ang may-akda ay isang Kristiyanong Judio na nagsasalita ng Griyego at humango sa Marcos at sa isang sangguniang kahawig ng Q.
      audience: Isang pamayanang Kristiyanong Judio na nagsisikap unawain kung ano ang nagpapatuloy at ano ang nagbabago sa kaugnayan nito sa Judaismo ng sinagoga.
      date: Mga 80–90 AD.
    Mark:
      display_name: Marcos
      author: Hindi kilala; iniuugnay ito ng tradisyon kay Juan Marcos, na kasama ni Pedro sa paglalakbay.
      audience: Isang pamayanang Kristiyano na nagsasalita ng Griyego, marahil sa Roma, na dumaranas o nanganganib dumanas ng pag-uusig.
      date: Mga 65–75 AD, sa panahon ng Digmaang Judio at ng pagkawasak ng templo.
