      author: Hindi kilala; posibleng iisang manunulat din ang sumulat ng Mga Cronica.
      audience: Mga nagbalik mula sa pagkakatapon na muling nagtatayo ng Jerusalem sa ilalim ng pamamahala ng Persia.
      date: Bandang kalagitnaan ng ika-5 hanggang ika-4 na siglo BC.
    Nehemiah:
      display_name: Nehemias
      author: Hindi kilala; naglalaman ito ng salaysay sa unang panauhan na iniuugnay kay Nehemias.
      audience: Mga nagbalik mula sa pagkakatapon na muling nagtatayo ng mga pader ng Jerusalem at nagpapanibago ng tipan sa ilalim ng pamamahala ng Persia.
      date: Bandang kalagitnaan ng ika-5 hanggang ika-4 na siglo BC.
    Esther:
      display_name: Ester
      author: Hindi kilala.
      audience: Mga Judiong naninirahan sa labas ng kanilang lupain sa ilalim ng dayuhang pamamahala, lalo na sa Persia.
      date: Bandang huling bahagi ng panahon ng Persia o unang bahagi ng panahong Helenistiko (ika-4–ika-3 siglo BC).
    Job:
      display_name: Job
      author: Hindi kilala.
      audience: Mga Israelitang nagsisikap unawain ang pagdurusa ng walang sala at ang katarungan ng Diyos.
      date: Ayon sa pangkalahatang pananaw sa tradisyon ng karunungan, ang aklat ay mula bandang ika-6–ika-4 na siglo BC at humango sa mas matatandang kuwentong-bayan.
    Psalms:
      display_name: Mga Awit
      author: Maraming may-akda sa loob ng maraming siglo; binabanggit sa mga pamagat si David, Asaf, Korah, Solomon, Moises, at iba pa.
      audience: Ang Israel at ang kapulungan sa templo sa kanilang pagsamba—pati ang bawat sumunod na pamayanang nananalangin at nananaghoy.
      date: Binuo bandang ika-10–ika-3 siglo BC; ang panghuling pagtitipon ay ginawa noong panahon matapos ang pagkakatapon.
