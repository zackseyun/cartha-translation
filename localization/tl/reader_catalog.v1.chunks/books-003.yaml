review:
  verdict: revise
  review_summary: Kumpleto ang chunk at karamihan sa salin ay tapat. Inayos ang ilang pamagat para maging mas tiyak sa source, lalo na ang anak na babae ni Jefta, ang inuupahang lagalag na pari ni Mikas, mga nakapatay ng tao, at mga kaalyadong Filisteo.
  issues:
  - 'Judges 2: Inalis ang idinagdag na “Tipan,” na wala sa canonical title.'
  - 'Judges 11: Ginawang “anak na babae” at “hain” upang tumugma sa “daughter as sacrifice.”'
  - 'Judges 17: Isinalin ang “hires wandering priest” nang hindi inaalis ang pagiging pari o ang pag-upa.'
  - 'Joshua 20: Nilinaw ang “manslayers” bilang mga nakapatay ng tao.'
  - '2 Samuel 8: Nilinaw na ang tinutukoy ay mga kaalyadong Filisteo.'
