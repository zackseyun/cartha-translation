payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: അർക്കോന്മാരുടെ യാഥാർഥ്യം
      author: അജ്ഞാതൻ. അർക്കോന്മാരെക്കുറിച്ചുള്ള ഒരു വെളിപ്പാടാത്മക പുരാവൃത്തത്തിലൂടെ ഗ്രന്ഥകാരൻ ഉല്പത്തി പുസ്തകത്തെ വ്യാഖ്യാനിക്കുന്നു; ഈ കൃതി ഒരു നിർദിഷ്ട ഗുരുവിന്റേതാണെന്ന് ഉറപ്പോടെ പറയാനാവില്ല.
      audience: അജ്ഞരായ പ്രാപഞ്ചിക ഭരണാധികാരികളും ദൈവിക ജ്ഞാനവും മനുഷ്യരാശിയുടെ ആത്മീയ ഉത്ഭവവും തമ്മിലുള്ള സംഘർഷമായി ഉല്പത്തി പുസ്തകത്തെ വായിച്ചിരുന്ന സേത്തീയമോ അതുമായി ബന്ധമുള്ളതോ ആയ പശ്ചാത്തലത്തിലെ ക്രിസ്ത്യാനികൾ.
      date: സാധാരണയായി എ.ഡി. മൂന്നാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കുന്നു; നാഗ് ഹമ്മാദി കോഡെക്സ് II-ൽ നാലാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് പകർപ്പായി സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
    On the Origin of the World:
      display_name: ലോകത്തിന്റെ ഉത്ഭവത്തെക്കുറിച്ച്
      author: അജ്ഞാതൻ. സമാഹർത്താവിന്റെ പേര് പറയാതെ, യഹൂദ, ക്രിസ്തീയ, പ്ലേറ്റോണിക, പുരാവൃത്ത പാരമ്പര്യങ്ങളിൽ പലതും ഈ കൃതി സംയോജിപ്പിക്കുകയും പുനരവതരിപ്പിക്കുകയും ചെയ്യുന്നു.
      audience: സൃഷ്ടി, പ്രാപഞ്ചിക ഭരണാധികാരികൾ, സോഫിയ, ആദാമും ഹവ്വയും, ലോകത്തിന്റെ അന്തിമവിധി എന്നിവയെക്കുറിച്ചുള്ള ഒരു ബദൽ ചരിത്രം അന്വേഷിച്ചിരുന്ന ജ്ഞാനവാദാഭിമുഖ്യമുള്ള ക്രിസ്തീയ പരിസരത്തിലെ വായനക്കാർ.
      date: സാധാരണയായി എ.ഡി. മൂന്നാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കപ്പെടുന്നു; എന്നാൽ അതിന്റെ അടിത്തറയിൽ അതിലും പഴയ സാമഗ്രികൾ ഉണ്ടായിരിക്കാം. പ്രധാനമായും നാലാം നൂറ്റാണ്ടിലെ കോപ്റ്റിക് സാക്ഷ്യങ്ങളിലാണ് ഇത് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    Sophia of Jesus Christ:
      display_name: യേശുക്രിസ്തുവിന്റെ ജ്ഞാനം
      author: അജ്ഞാതൻ. യൂഗ്നോസ്റ്റോസിൽനിന്നും അറിയപ്പെടുന്ന ഉള്ളടക്കത്തെ, ഉയിർത്തെഴുന്നേൽപ്പിനുശേഷം യേശുവും ശിഷ്യന്മാരും തമ്മിൽ നടക്കുന്ന ഒരു സംവാദമായി ഗ്രന്ഥകാരൻ രൂപാന്തരപ്പെടുത്തുന്നു.
      audience: അതീന്ദ്രിയനായ ദൈവം, സ്വർഗീയ ലോകത്തിന്റെ ക്രമീകരണം, ആത്മാവിന്റെ ഉത്ഭവവും രക്ഷയും എന്നിവയെക്കുറിച്ചുള്ള വെളിപ്പെടുത്തപ്പെട്ട ജ്ഞാനത്തിൽ താത്പര്യമുള്ള ക്രിസ്ത്യാനികൾ.
      date: പലപ്പോഴും എ.ഡി. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിലോ മൂന്നാം നൂറ്റാണ്ടിലോ രചിക്കപ്പെട്ടതായി കണക്കാക്കുന്നു; നാഗ് ഹമ്മാദിയിലെയും ബെർലിൻ കോഡെക്സിലെയും കോപ്റ്റിക് പകർപ്പുകളിൽ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
    Gospel of the Egyptians:
      display_name: ഈജിപ്തുകാരുടെ സുവിശേഷം
      author: അജ്ഞാതൻ. ‘മഹാനായ അദൃശ്യ ആത്മാവിന്റെ വിശുദ്ധ ഗ്രന്ഥം’ എന്നും അറിയപ്പെടുന്ന ഈ നാഗ് ഹമ്മാദി കൃതി, ഉദ്ധരണികളിലൂടെ മാത്രം അറിയപ്പെടുന്ന, ഇതിലും പഴയ ഗ്രീക്ക് ‘ഈജിപ്തുകാരുടെ സുവിശേഷ’ത്തിൽനിന്ന് വ്യത്യസ്തമാണ്.
      audience: സങ്കീർണമായ പുരാവൃത്തം, വിശുദ്ധ നാമങ്ങൾ, സ്നാനസംബന്ധിയായ പ്രതിരൂപങ്ങൾ, സ്തുതിഗീതാത്മകമായ സ്തുതി എന്നിവ ഉപയോഗിച്ച് ആത്മീയ സ്വത്വവും വിടുതലും ആവിഷ്കരിച്ചിരുന്ന ഒരു സേത്തീയ ക്രിസ്തീയ സമൂഹം.
      date: സാധാരണയായി എ.ഡി. രണ്ടാം അല്ലെങ്കിൽ മൂന്നാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കുന്നു; നാലാം നൂറ്റാണ്ടിലെ നാഗ് ഹമ്മാദി കോഡെക്സുകളിൽ രണ്ട് കോപ്റ്റിക് പകർപ്പുകൾ നിലനിൽക്കുന്നു.
    Letter of Peter to Philip:
      display_name: ഫിലിപ്പോസിനുള്ള പത്രോസിന്റെ കത്ത്
      author: അജ്ഞാതൻ. ആരംഭത്തിലെ ഹ്രസ്വമായ കത്തും തുടർന്നുള്ള വെളിപ്പാടും പത്രോസിനും ഫിലിപ്പോസിനും വ്യാജനാമത്തിൽ ആട്രിബ്യൂട്ട് ചെയ്യപ്പെട്ടവയാണ്; അവരിൽ ആരെങ്കിലും യഥാർഥത്തിൽ എഴുതിയതാണെന്ന് ഉറപ്പിക്കാനാവില്ല.
      audience: രക്ഷകൻ, ശത്രുതാപരമായ ശക്തികൾ, കഷ്ടപ്പാട്, ദൗത്യം, ശിഷ്യന്മാരുടെ പുനഃസ്ഥാപനം എന്നിവയെക്കുറിച്ചുള്ള ഉപദേശത്തിന് അപ്പസ്തോലിക അംഗീകാരം തേടിയിരുന്ന ക്രിസ്ത്യാനികൾ.
      date: സാധാരണയായി എ.ഡി. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിലോ മൂന്നാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിലോ ഉള്ളതായി കണക്കാക്കുന്നു; നാലാം നൂറ്റാണ്ടിലെ ഒരു നാഗ് ഹമ്മാദി പകർപ്പിലും പിൽക്കാലത്തെ ഒരു കോപ്റ്റിക് സാക്ഷ്യത്തിലും സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
    Gospel of Judas:
      display_name: യൂദാസിന്റെ സുവിശേഷം
      author: അജ്ഞാതൻ. ശീർഷകം ഈ വിവരണത്തെ യൂദാസിന്റെ പേരിൽ ആരോപിക്കുന്നുണ്ടെങ്കിലും, യൂദാസ് ഇസ്കര്യോത്താ അതിന്റെ ചരിത്രപരമായ ഗ്രന്ഥകാരനാണെന്ന് ഈ കൃതി സ്ഥാപിക്കുന്നില്ല.
      audience: എതിരാളികളായ വിഭാഗങ്ങളുടെ ബലിസംബന്ധവും സഭാസംബന്ധവുമായ ആചാരങ്ങളെ വിമർശിക്കുകയും, യൂദാസിനെയും യേശുവിന്റെ മരണത്തെയും പുനർവ്യാഖ്യാനിക്കാൻ വെളിപ്പാടാത്മക സംവാദവും സേത്തീയ സ്വഭാവമുള്ള പ്രപഞ്ചവിജ്ഞാനവും ഉപയോഗിക്കുകയും ചെയ്തിരുന്ന ഒരു ക്രിസ്തീയ സംഘം.
      date: സാധാരണയായി എ.ഡി. രണ്ടാം നൂറ്റാണ്ടിന്റെ മധ്യത്തിലോ അവസാനത്തിലോ ഉള്ളതായി കണക്കാക്കുന്നു; ഏകദേശം എ.ഡി. 180-ഓടെ ഐറേനേയൂസിന് ‘യൂദാസിന്റെ സുവിശേഷം’ അറിയാമായിരുന്നു. നിലനിൽക്കുന്ന കോപ്റ്റിക് പകർപ്പ് ഒരുപക്ഷേ മൂന്നാം അല്ലെങ്കിൽ നാലാം നൂറ്റാണ്ടിലേതാണ്.
    Protoevangelium of James:
      display_name: യാക്കോബിന്റെ പ്രഥമസുവിശേഷം
      author: അജ്ഞാതൻ. ആഖ്യാതാവ് താൻ യാക്കോബാണെന്ന് അവകാശപ്പെടുന്നുണ്ടെങ്കിലും, ഈ കൃതി വ്യാജനാമത്തിലുള്ളതാണ്; യേശുവിന്റെ സഹോദരനായ യാക്കോബ് എഴുതിയതല്ല.
      audience: മറിയത്തിന്റെ ജനനവും വളർച്ചയും, അവളുടെ നിത്യകന്യകാത്വം, യേശുവിന്റെ ജനനം, മത്തായിയും ലൂക്കോസും തുറന്നുവിട്ട ചോദ്യങ്ങൾക്കുള്ള ആഖ്യാനരൂപത്തിലുള്ള ഉത്തരങ്ങൾ എന്നിവയിൽ താത്പര്യമുള്ള ക്രിസ്ത്യാനികൾ.
      date: പൊതുവേ എ.ഡി. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാന പകുതിയിലേതായി കണക്കാക്കുന്നു; പിൽക്കാലത്തെ അനേകം ഗ്രീക്ക് കൈയെഴുത്തുപ്രതികളിലും പുരാതന വിവർത്തനങ്ങളിലും ഇത് നിലനിൽക്കുന്നു.
  chapter_titles:
    Apocryphon of John:
      '17':
        title: ദൈവപരിപാലനം മനസ്സുകളെ ഉണർത്തുന്നു
      '18':
        title: ആത്മാക്കൾ ദുഷ്ട പോരാട്ടങ്ങളിൽനിന്ന് പിന്തിരിയുന്നു
      '19':
        title: കരുണാമയനായ ആത്മാവ് മനുഷ്യരെ ഉണർത്തുന്നു
      '20':
        title: ആത്മാക്കളെ രക്ഷിക്കാൻ വെളിച്ചം ഇറങ്ങിവരുന്നു
      '21':
        title: രക്ഷകൻ ഗൂഢജ്ഞാനം ഏല്പിക്കുന്നു
    Hypostasis of the Archons:
      '1':
        title: ആത്മാവ് പ്രാപഞ്ചിക ശക്തികളെ വെളിപ്പെടുത്തുന്നു
      '2':
        title: ശബ്ദം അന്ധനായ ഭരണാധികാരിയെ തുറന്നുകാട്ടുന്നു
      '3':
        title: ദൈവിക വെളിച്ചം ആദാമിനെ ജീവിപ്പിക്കുന്നു
      '4':
        title: സ്ത്രീ ഭരണാധികാരികളുടെ അതിക്രമത്തിൽനിന്ന് രക്ഷപ്പെടുന്നു
      '5':
        title: സർപ്പം ആത്മീയ സത്യം പഠിപ്പിക്കുന്നു
      '6':
