payload:
  book_metadata:
    1 Esdras:
      display_name: 1 എസ്ദ്രാസ്
      author: അജ്ഞാതൻ; 2 ദിനവൃത്താന്തം 35–36, എസ്രാ, നെഹെമ്യാവ് 7–8 എന്നിവയുടെ ക്രമം മാറ്റി ഗ്രീക്കിൽ പുനഃസംയോജിപ്പിച്ച കൃതി.
      audience: മടങ്ങിവരവിന്റെയും പുനഃസ്ഥാപനത്തിന്റെയും വ്യക്തമായ ഒരു വിവരണം ആഗ്രഹിച്ച ഹെല്ലനിസ്റ്റിക് കാലഘട്ടത്തിലെ യഹൂദർ.
      date: ക്രി.മു. ഏകദേശം 2–1 നൂറ്റാണ്ടുകൾ.
    Prayer of Manasseh:
      display_name: മനശ്ശെയുടെ പ്രാർഥന
      author: അജ്ഞാതൻ; മനശ്ശെ രാജാവിന്റെ പേരിൽ കപടനാമമായി ആട്രിബ്യൂട്ട് ചെയ്യപ്പെട്ടത്.
      audience: മനശ്ശെയുടെ മാനസാന്തരവുമായി തങ്ങളെ ബന്ധപ്പെടുത്തിയ അനുതാപികൾ—ചില പാരമ്പര്യങ്ങളിൽ ആരാധനാക്രമത്തിൽ ഉപയോഗിക്കപ്പെട്ടത്.
      date: ക്രി.മു. ഏകദേശം 2–1 നൂറ്റാണ്ടുകൾ.
    Psalm 151:
      display_name: സങ്കീർത്തനം 151
      author: അജ്ഞാതൻ; ദാവീദിന്റെ പേരിൽ കപടനാമമായി ആട്രിബ്യൂട്ട് ചെയ്യപ്പെട്ടത്. ഇതിന്റെ ഒരു എബ്രായരൂപം 11QPsa-യിൽ സാക്ഷ്യപ്പെടുത്തിയിട്ടുണ്ട്.
      audience: ദാവീദിന്റെ സങ്കീർത്തനസമാഹാരത്തോട് ഭക്തിയുണ്ടായിരുന്ന പ്രവാസി, കുമ്രാൻ സമൂഹങ്ങൾ.
      date: ക്രി.മു. ഏകദേശം 2-ാം നൂറ്റാണ്ടിലോ അതിനു മുമ്പോ.
    3 Maccabees:
      display_name: 3 മക്കബായർ
      author: അജ്ഞാതൻ; ഗ്രീക്കിൽ രചിക്കപ്പെട്ടത്.
      audience: ഈജിപ്തിലെ ഗ്രീക്കുഭാഷികളായ പ്രവാസി യഹൂദർ—ടോളമി നാലാമന്റെ ഭരണകാലം പശ്ചാത്തലമാക്കിയ ഒരു വിടുതൽവിവരണം.
      date: ക്രി.മു. ഏകദേശം 1-ാം നൂറ്റാണ്ടുമുതൽ ക്രി.വ. 1-ാം നൂറ്റാണ്ടുവരെ.
    4 Maccabees:
      display_name: 4 മക്കബായർ
      author: അജ്ഞാതൻ; സ്റ്റോയിക് തത്ത്വചിന്തയുടെ സ്വാധീനമേറ്റ ഗ്രീക്കുഭാഷിയായ ഒരു യഹൂദരചയിതാവ്.
      audience: ഹെല്ലനിസ്റ്റിക് യഹൂദർ—വിശ്വസ്തതയിലൂടെ യുക്തി വികാരങ്ങളെ കീഴടക്കുന്നതിനെക്കുറിച്ചുള്ള ഒരു തത്ത്വചിന്താപരമായ പ്രഭാഷണം.
      date: ക്രി.വ. ഏകദേശം 1-ാം നൂറ്റാണ്ട്.
    Bel and the Dragon:
      display_name: ബേലും മഹാസർപ്പവും
      author: അജ്ഞാതൻ; ദാനീയേലിനോടു ചേർത്ത ഗ്രീക്ക് ഭാഗങ്ങളിൽ ഒന്ന്.
      audience: ഗ്രീക്കുഭാഷികളായ യഹൂദർ—വിഗ്രഹാരാധനയെ പരിഹസിച്ചുകൊണ്ടുള്ള ഒരു വിമർശനം.
      date: ക്രി.മു. ഏകദേശം 2–1 നൂറ്റാണ്ടുകൾ.
    Letter of Jeremiah:
      display_name: യിരെമ്യാവിന്റെ കത്ത്
      author: അജ്ഞാതൻ; യിരെമ്യാവിന്റെ പേരിൽ കപടനാമമായി ആട്രിബ്യൂട്ട് ചെയ്യപ്പെട്ടത്.
      audience: ചുറ്റുമുള്ള വിഗ്രഹാരാധനയിൽ ആകർഷിക്കപ്പെടാൻ സാധ്യതയുണ്ടായിരുന്ന പ്രവാസി യഹൂദർ.
      date: ക്രി.മു. ഏകദേശം 4–2 നൂറ്റാണ്ടുകൾ.
    Prayer of Azariah and Song of the Three:
      display_name: അസര്യാവിന്റെ പ്രാർഥനയും മൂവരുടെ ഗീതവും
      author: അജ്ഞാതൻ; ദാനീയേലിനോടു ചേർത്ത ഗ്രീക്ക് ഭാഗങ്ങളിൽ ഒന്ന്.
      audience: ഗ്രീക്കുഭാഷികളായ യഹൂദർ—ദാനീയേൽ 3-നുള്ള ആരാധനാക്രമസാമഗ്രി.
      date: ക്രി.മു. ഏകദേശം 2-ാം നൂറ്റാണ്ട്.
    Susanna:
      display_name: ശൂശന്നാ
      author: അജ്ഞാതൻ; ദാനീയേലിനോടു ചേർത്ത ഗ്രീക്ക് ഭാഗങ്ങളിൽ ഒന്ന്.
      audience: ഗ്രീക്കുഭാഷികളായ യഹൂദർ—നീതിയുടെയും വ്യാജസാക്ഷ്യത്തെ തുറന്നുകാട്ടുന്നതിന്റെയും കഥ.
      date: ക്രി.മു. ഏകദേശം 2–1 നൂറ്റാണ്ടുകൾ.
    1 Clement:
      display_name: 1 ക്ലെമെന്റ്
      author: അജ്ഞാതൻ; റോമിലെ ക്ലെമെന്റിനോട് ആട്രിബ്യൂട്ട് ചെയ്യപ്പെട്ടത്.
      audience: നേതൃത്വത്തെച്ചൊല്ലിയുള്ള തർക്കത്തിൽ അകപ്പെട്ടിരുന്ന കൊരിന്തിലെ ക്രിസ്തീയസഭ.
      date: ക്രി.വ. ഏകദേശം 96.
  chapter_titles:
    2 Maccabees:
      '12':
        title: വീണുപോയവർക്കായി യൂദാ പ്രാർഥിക്കുന്നു
      '13':
        title: വിജയത്തിനായി യൂദാ പ്രാർഥിക്കുന്നു
      '14':
        title: നിക്കാനോർ സമാധാനധാരണയെ വഞ്ചിക്കുന്നു
      '15':
        title: നിക്കാനോറിന്റെ പരാജയം യഹൂദർ ആഘോഷിക്കുന്നു
    1 Esdras:
      '1':
        title: യോശീയാവ് പെസഹ ആചരിച്ച് മരിക്കുന്നു
      '2':
        title: കോരെശ് യിരെമ്യാവിന്റെ വചനം നിവർത്തിക്കുന്നു
      '3':
        title: സത്യം ജയിക്കുന്നുവെന്ന് സെരുബ്ബാബേൽ പ്രഖ്യാപിക്കുന്നു
      '4':
        title: ആലയം പുനർനിർമിക്കാൻ ദാര്യാവേശ് അനുമതി നൽകുന്നു
      '5':
        title: പ്രവാസികൾ മടങ്ങിവന്ന് യാഗപീഠം പുനർനിർമിക്കുന്നു
      '6':
        title: ആലയപ്പണിക്ക് പ്രവാചകന്മാർ പ്രോത്സാഹനം നൽകുന്നു
      '7':
        title: വലിയ ആനന്ദത്തോടെ ആലയം പൂർത്തിയാകുന്നു
      '8':
        title: എസ്രാ ജനത്തെ സുരക്ഷിതമായി മടക്കിക്കൊണ്ടുവരുന്നു
      '9':
        title: അവിശ്വസ്തമായ വിവാഹങ്ങളെ എസ്രാ നേരിടുന്നു
    Prayer of Manasseh:
      '1':
        title: ദൈവിക കരുണയ്ക്കായി മനശ്ശെ യാചിക്കുന്നു
    Psalm 151:
      '1':
        title: ഏറ്റവും ഇളയ ഇടയൻ രാജാവായി അഭിഷേകം ചെയ്യപ്പെടുന്നു
    3 Maccabees:
      '1':
        title: ആലയത്തിൽ പ്രവേശിക്കണമെന്ന് രാജാവ് ശഠിക്കുന്നു
      '2':
        title: വിടുതലിനായി ഇസ്രായേൽ പ്രാർഥിക്കുന്നു
      '3':
        title: യഹൂദരെ നശിപ്പിക്കാൻ രാജാവ് പദ്ധതിയിടുന്നു
      '4':
        title: പരസ്യമായി പ്രദർശിപ്പിക്കപ്പെട്ട യഹൂദർ വിലപിക്കുന്നു
      '5':
        title: വധത്തിനായി ആനകളെ കൊണ്ടുവരുന്നു
      '6':
        title: സ്വർഗീയ ദൂതന്മാർ യഹൂദരെ രക്ഷിക്കുന്നു
      '7':
        title: രാജാവ് യഹൂദരെ സുരക്ഷിതരായി വിട്ടയക്കുന്നു
    4 Maccabees:
      '1':
        title: യുക്തി വികാരങ്ങളെ ഭരിക്കുന്നു
      '2':
        title: വികാരങ്ങളെ കീഴടക്കാൻ ന്യായപ്രമാണം യുക്തിയെ നയിക്കുന്നു
      '3':
        title: ശത്രുവിന്റെ വെള്ളം ദാവീദ് നിരസിക്കുന്നു
      '4':
        title: സ്വർഗീയ സൈന്യങ്ങൾ യഹൂദരെ സംരക്ഷിക്കുന്നു
      '5':
        title: പന്നിയിറച്ചി കഴിക്കാൻ എലെയാസർ വിസമ്മതിക്കുന്നു
      '6':
        title: എലെയാസർ അചഞ്ചലനായി മരിക്കുന്നു
      '7':
        title: യുക്തിയുടെ ശക്തി എലെയാസർ തെളിയിക്കുന്നു
      '8':
        title: ഏഴു സഹോദരന്മാർ സ്വേച്ഛാധിപതിയെ നേരിടുന്നു
      '9':
        title: ഒന്നാമത്തെ സഹോദരൻ രക്തസാക്ഷിയായി മരിക്കുന്നു
      '10':
        title: നാലാമത്തെ സഹോദരൻ നാവ് നീട്ടിക്കൊടുക്കാൻ വിസമ്മതിക്കുന്നു
      '11':
        title: ആറാമത്തെ സഹോദരൻ പീഡനം സഹിക്കുന്നു
      '12':
        title: ഏറ്റവും ഇളയ സഹോദരൻ സ്വയം എറിയുന്നു
      '13':
        title: സഹോദരന്മാർ പരസ്പരം ധൈര്യപ്പെടുത്തുന്നു
      '14':
        title: മരിക്കാൻ അമ്മ പുത്രന്മാരെ പ്രേരിപ്പിക്കുന്നു
      '15':
        title: പുത്രന്മാരെക്കാൾ ദൈവത്തെ അമ്മ തിരഞ്ഞെടുക്കുന്നു
      '16':
        title: മരിക്കാൻ അമ്മ പുത്രന്മാരെ ബോധ്യപ്പെടുത്തുന്നു
      '17':
        title: ഏഴു രക്തസാക്ഷികൾ ദൈവത്തെ ആദരിക്കുന്നു
      '18':
        title: മക്കൾ ന്യായപ്രമാണം പാലിച്ച് ജീവിക്കുന്നു
    Bel and the Dragon:
      '1':
        title: ദാനീയേൽ ബേലിനെയും മഹാസർപ്പത്തെയും പരാജയപ്പെടുത്തുന്നു
    Letter of Jeremiah:
      '1':
        title: ബാബേലിൽ വിഗ്രഹങ്ങളെ ഭയപ്പെടുന്നത് വ്യർഥം
    Prayer of Azariah and Song of the Three:
      '1':
        title: കത്തിജ്വലിക്കുന്ന തീയിൽ അസര്യാവ് പ്രാർഥിക്കുന്നു
    Susanna:
      '1':
        title: ന്യായാധിപന്മാരുടെ ഗൂഢാലോചന ദാനീയേൽ തുറന്നുകാട്ടുന്നു
    1 Clement:
      '1':
        title: അവിശുദ്ധമായ കലാപത്താൽ സഹോദരന്മാർ കഷ്ടപ്പെടുന്നു
      '2':
        title: താഴ്മ സമാധാനപൂർണമായ തീക്ഷ്ണത ഉളവാക്കുന്നു
      '3':
        title: അസൂയ യുദ്ധവും പ്രവാസവും വരുത്തുന്നു
      '4':
        title: അസൂയ പുരാതന കൊലപാതകങ്ങളിലേക്കു നയിച്ചു
      '5':
        title: പത്രോസും പൗലോസും സ്ഥിരതയ്ക്കായി സഹിച്ചു
