      '44':
        title: മിന്നൽനക്ഷത്രങ്ങൾ ശക്തിയാൽ ബന്ധിക്കപ്പെട്ടിരിക്കുന്നു
      '45':
        title: നിഷേധികളെ വിധിക്കുന്ന രണ്ടാമത്തെ ഉപമ
      '46':
        title: മനുഷ്യപുത്രനെ ഹാനോക്ക് കാണുന്നു
      '47':
        title: നീതിമാന്മാരുടെ രക്തത്തിന് സ്വർഗത്തിൽ ഉത്തരം ലഭിക്കുന്നു
      '48':
        title: നീതിയുടെ ഉറവ ചുറ്റും നിറയുന്നു
      '49':
        title: തിരഞ്ഞെടുക്കപ്പെട്ടവൻ മറഞ്ഞിരിക്കുന്നതിനെ വിധിക്കുന്നു
      '50':
        title: വിശുദ്ധർ ജയിക്കുന്നു; പാപികൾ താമസിയാതെ നശിക്കുന്നു
      '51':
        title: തിരഞ്ഞെടുക്കപ്പെട്ടവൻ മറഞ്ഞിരുന്ന ജ്ഞാനം വെളിപ്പെടുത്തുന്നു
      '52':
        title: ലോഹപർവതങ്ങൾ ഹാനോക്ക് കാണുന്നു
      '53':
