      '40':
        title: സ്വർഗീയ സൈന്യത്തെ ഹാനോക്ക് കാണുന്നു
      '41':
        title: സ്വർഗത്തിലെ ഭണ്ഡാരങ്ങളും മറഞ്ഞിരിക്കുന്ന നിയമങ്ങളും
      '42':
        title: ജ്ഞാനം വെറുതെ ഒരു ഭവനം തേടുന്നു
      '43':
