      '54':
        title: രാജാക്കന്മാർ കത്തുന്ന താഴ്‌വരയിലേക്ക് എറിയപ്പെടുന്നു
      '55':
        title: പുരാതനനായവൻ ഇനി ഒരിക്കലുമില്ലെന്ന് സത്യം ചെയ്യുന്നു
      '56':
        title: ശിക്ഷ നടപ്പാക്കുന്ന ദൂതന്മാർ അസസേലിന്റെ സൈന്യത്തെ ബന്ധിക്കുന്നു
