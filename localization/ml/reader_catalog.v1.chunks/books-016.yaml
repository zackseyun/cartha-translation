      '62':
        title: സിംഹാസനസ്ഥനായ മനുഷ്യപുത്രൻ വിധിക്കുന്നു
      '63':
        title: രാജാക്കന്മാർ കർത്താവിനോട് ക്ഷമ യാചിക്കുന്നു
