      '20':
        title: വിശുദ്ധ കാവൽദൂതന്മാരും അവരുടെ മേഖലകളും
      '21':
        title: അഗാധത്തിൽ ചങ്ങലയ്ക്കിട്ട ഏഴ് നക്ഷത്രങ്ങൾ
      '22':
        title: ആത്മാക്കളുടെ ഗുഹകൾ ഹാനോക്ക് കാണുന്നു
      '23':
        title: അണയാത്ത അഗ്നി ഹാനോക്ക് കാണുന്നു
      '24':
        title: മനോഹരമായ ഏഴ് പർവതങ്ങൾ തിളങ്ങുന്നു
      '25':
        title: ന്യായവിധിവരെ വിലക്കപ്പെട്ട സുഗന്ധവൃക്ഷം
      '26':
        title: വിശുദ്ധ ഹൃദയം ഹാനോക്ക് കാണുന്നു
      '27':
        title: ദൈവദൂഷകർക്കുള്ള ശപിക്കപ്പെട്ട താഴ്‌വര വെളിപ്പെടുന്നു
      '28':
        title: കുതിച്ചൊഴുകുന്ന ജലമുള്ള കിഴക്കൻ പർവതങ്ങൾ
      '29':
        title: ന്യായവിധിയുടെ വൃക്ഷങ്ങൾ ഹാനോക്ക് കാണുന്നു
      '30':
        title: വറ്റാത്ത ജലം നിറഞ്ഞ താഴ്‌വര
      '31':
        title: പർവതങ്ങളിൽ വിശുദ്ധ സുഗന്ധങ്ങൾ വിരിയുന്നു
      '32':
        title: നീതിയുടെ തോട്ടം വെളിപ്പെടുന്നു
      '33':
        title: സ്വർഗീയ കവാടങ്ങളിൽ നക്ഷത്രങ്ങൾക്ക് പേരിടുന്നു
      '34':
        title: ആകാശത്തിലെ കാലാവസ്ഥാ സംവിധാനം വെളിപ്പെടുന്നു
      '35':
        title: പടിഞ്ഞാറൻ കവാടങ്ങൾ കിഴക്കുള്ളവയോട് പൊരുത്തപ്പെടുന്നു
      '36':
        title: സ്വർഗീയ കവാടങ്ങൾ ഹാനോക്ക് കാണുന്നു
      '37':
        title: ജ്ഞാനത്തിന്റെ വെളിപ്പാട് ഹാനോക്ക് പ്രഖ്യാപിക്കുന്നു
      '38':
        title: നീതിമാന്മാർ ഒരുമിച്ചുകൂടുന്നു; പാപികൾ വിധിക്കപ്പെടുന്നു
      '39':
