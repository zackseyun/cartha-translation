locale: ml
source_catalog_sha256: ec74c36516f84fea14e3d62329a38731b464f113276935cab09aa146bdd1e82b
source_chunk_sha256: f46d81eed1ad9bbf3a09d6ab280933ed9544097b026cae49ea5a054532eb9d59
chunk_id: books-014
status: reviewed
payload:
  book_metadata:
    Sirach:
      display_name: സിറാക്ക്
      author: യെരൂശലേമുകാരനായ യേശുവാ ബെൻ എലെയാസർ ബെൻ സിറാ; അദ്ദേഹത്തിന്റെ പൗത്രൻ ഗ്രീക്കിലേക്കു വിവർത്തനം ചെയ്തു.
      audience: ഹെല്ലനിസ്റ്റിക് കാലഘട്ടത്തിലെ യെരൂശലേമിൽ ജ്ഞാനത്തിൽ പരിശീലനം നേടിക്കൊണ്ടിരുന്ന യഹൂദ യുവാക്കൾ.
      date: ഹീബ്രു മൂലകൃതി ഏകദേശം ക്രി.മു. 195–175; ഗ്രീക്ക് വിവർത്തനം ഏകദേശം ക്രി.മു. 132.
    Baruch:
      display_name: ബാറൂക്ക്
      author: അജ്ഞാതൻ; യിരെമ്യാവിന്റെ എഴുത്തുകാരനായ ബാറൂക്കിന് ആപാദിക്കപ്പെട്ട കൃതി.
      audience: പ്രവാസം, മാനസാന്തരം, ജ്ഞാനം എന്നിവയെക്കുറിച്ച് ചിന്തിച്ചിരുന്ന പ്രവാസി യഹൂദർ.
      date: ഏകദേശം ക്രി.മു. രണ്ടാം നൂറ്റാണ്ട്.
    1 Maccabees:
      display_name: 1 മക്കബായർ
      author: അജ്ഞാതൻ; ഹീബ്രുവിൽ എഴുതിയ ഒരു യെരൂശലേംകാരനായിരിക്കാം (ഗ്രീക്ക് പാഠം മാത്രമേ നിലനിൽക്കുന്നുള്ളൂ).
      audience: ഹാസ്മോന്യ കലാപകാലത്തും അതിനുശേഷവും ജീവിച്ചിരുന്ന യഹൂദർ; ഹാസ്മോന്യ രാജവംശത്തിന്റെ നിയമസാധുത വിവരിക്കുന്ന കൃതി.
      date: ഏകദേശം ക്രി.മു. 100.
    2 Maccabees:
      display_name: 2 മക്കബായർ
      author: കുറേനക്കാരനായ യാസോന്റെ ദീർഘമായ കൃതിയെ സംഗ്രഹിച്ച അജ്ഞാതനായ ഒരാൾ; ഗ്രീക്കിൽ രചിക്കപ്പെട്ടു.
      audience: ഗ്രീക്ക് സംസാരിച്ചിരുന്ന പ്രവാസി യഹൂദർ—രക്തസാക്ഷിത്വം, ദൈവപരിപാലനം, പുനരുത്ഥാനം എന്നിവയ്ക്ക് ഊന്നൽ നൽകുന്നു.
      date: ഏകദേശം ക്രി.മു. 124-ലോ അതിനു തൊട്ടുപിന്നാലെയോ.
  chapter_titles:
    Wisdom of Solomon:
      '7':
        title: പ്രാർഥന ജ്ഞാനവും വിവേകവും നൽകുന്നു
      '8':
        title: ജ്ഞാനം ഭരണാധികാരികളെ നയിക്കുകയും ശക്തിപ്പെടുത്തുകയും ചെയ്യുന്നു
      '9':
        title: രാജാവ് ദൈവികജ്ഞാനത്തിനായി പ്രാർഥിക്കുന്നു
      '10':
        title: ജ്ഞാനം നീതിമാന്മാരെ കാത്ത് വിടുവിക്കുന്നു
      '11':
        title: ശിക്ഷണത്തിലൂടെ ദൈവം കരുണ കാണിക്കുന്നു
      '12':
        title: വിഗ്രഹങ്ങളെ പരിഹസിക്കൽ വ്യർഥപ്രതീക്ഷ നൽകുന്നു
      '13':
        title: മനുഷ്യർ ജീവനില്ലാത്ത വിഗ്രഹങ്ങളെ ആരാധിക്കുന്നു
      '14':
        title: കടലിലൂടെ കപ്പലുകളെ ദൈവം നയിക്കുന്നു
      '15':
        title: ദൈവത്തിന്റെ കരുണ സത്യാരാധനയിലേക്കു നയിക്കുന്നു
      '16':
        title: പീഡകരെ വിധിക്കുമ്പോഴും ദൈവം വേണ്ടത് നൽകുന്നു
      '17':
        title: ഭീതിനിറഞ്ഞ രാത്രിയുടെ പിടിയിൽ
      '18':
        title: വെളിച്ചത്താൽ ദൈവം വഴിനടത്തുന്നു
      '19':
        title: ഇസ്രായേലിനായി മേഘങ്ങൾ വഴിമാറുന്നു
    Sirach:
      '1':
        title: ദൈവം ജ്ഞാനം അളന്ന് നൽകുന്നു
      '2':
        title: പരീക്ഷകൾ വിശ്വസ്ത ദാസരെ തെളിയിക്കുന്നു
      '3':
        title: മാതാപിതാക്കളെ ആദരിച്ച് ദീർഘായുസ്സ് നേടുക
      '4':
        title: പീഡിതരെ രക്ഷിച്ച് ജ്ഞാനം തേടുക
      '5':
        title: സമ്പത്തിലല്ല, ദൈവത്തിൽ ആശ്രയിക്കുക
      '6':
        title: കർഷകനെപ്പോലെ ജ്ഞാനം തേടുക
      '7':
        title: ഹൃദയത്തിൽ ആഴമായ വിനയം സൂക്ഷിക്കുക
      '8':
        title: മൂഢരെ ഒഴിവാക്കി മുതിർന്നവരെ ആദരിക്കുക
      '9':
        title: അസൂയയ്ക്കും കാമത്തിനും എതിരെ ജാഗ്രത പാലിക്കുക
      '10':
        title: ജ്ഞാനമുള്ള നേതൃത്വം ക്രമം സ്ഥാപിക്കുന്നു
      '11':
        title: ജ്ഞാനം ദരിദ്രരെ ഉയർത്തുന്നു
      '12':
        title: പാപികളെയല്ല, നീതിമാന്മാരെ സഹായിക്കുക
      '13':
        title: കീൽ തൊട്ടാൽ കൈയിൽ പറ്റും
      '14':
        title: ജ്ഞാനം ശാശ്വതാനുഗ്രഹം നൽകുന്നു
      '15':
        title: ജ്ഞാനം തന്നെ തേടുന്നവരെ കണ്ടുമുട്ടുന്നു
      '16':
        title: വിശ്വസ്തനായ ഒരാൾ ഒരു നഗരത്തെ നിലനിർത്തുന്നു
      '17':
        title: മനുഷ്യർ ദൈവത്തിന്റെ പ്രതിരൂപത്തിൽ സൃഷ്ടിക്കപ്പെട്ടു
      '18':
        title: നല്ല പ്രവൃത്തികൾ നശിപ്പിക്കരുത്
      '19':
        title: സുഖഭോഗം പിന്തുടരുന്നവർ നാശത്തിലാകുന്നു
      '20':
        title: സംസാരിക്കാൻ ഉചിതമായ സമയം ശ്രദ്ധിക്കുക
      '21':
        title: പ്രാർഥിക്കുക, പാപത്തിൽനിന്ന് ഓടിയകലുക, ജ്ഞാനം തേടുക
      '22':
        title: മടി ലജ്ജയും ദുഃഖവും വരുത്തുന്നു
      '23':
        title: ആന്തരിക ശിക്ഷണത്തിനും ജ്ഞാനത്തിനുമായി പ്രാർഥിക്കുക
      '24':
        title: ജ്ഞാനം സ്വയം പുകഴ്ത്തി സംസാരിക്കുന്നു
      '25':
        title: ജ്ഞാനം ദൈവത്തെയും മനുഷ്യരെയും ആദരിക്കുന്നു
      '26':
        title: ഭാര്യ സന്തോഷമോ വേദനയോ നൽകുന്നു
      '27':
        title: നീതി പിന്തുടർന്ന് അഭിമാനത്തോടെ അണിയുക
      '28':
        title: പാപങ്ങൾ ക്ഷമിച്ച് കരുണ നേടുക
      '29':
        title: അയൽക്കാരനോട് ക്ഷമിച്ച് കരുണ നേടുക
      '30':
        title: മക്കളെ മാന്യരായി വളർത്തുക
      '31':
        title: സമ്പത്ത് ഉത്കണ്ഠയും വേദനയും വരുത്തുന്നു
      '32':
        title: വിനയത്തോടെ ആദ്യം മറ്റുള്ളവരെ സേവിക്കുക
      '33':
        title: തന്നെ ഭയപ്പെടുന്നവരെ കർത്താവ് സംരക്ഷിക്കുന്നു
      '34':
        title: വ്യക്തമായ ഉറപ്പില്ലെങ്കിൽ സ്വപ്നങ്ങൾ വഴിതെറ്റിച്ചേക്കാം
      '35':
        title: നേതാക്കൾ വിനയവും ജ്ഞാനവും പുലർത്തണം
      '36':
        title: കർത്താവിനെ ഭയപ്പെടുന്നതിലൂടെ വിടുതൽ വരുന്നു
      '37':
        title: സുഹൃത്തുക്കളെയും ഉപദേശത്തെയും വിവേകത്തോടെ തിരഞ്ഞെടുക്കുക
      '38':
        title: വൈദ്യരെ ആദരിക്കുക; സൗഖ്യത്തിനായി പ്രാർഥിക്കുക
      '39':
        title: നിയമം ഭക്തിയോടെ പാലിക്കുന്നവനെ സിറാക്ക് പുകഴ്ത്തുന്നു
      '40':
        title: ജീവിതത്തിന്റെ ഭാരങ്ങളും അനുഗ്രഹങ്ങളും
      '41':
        title: മരണം അന്തിമവിശ്രമം നൽകുന്നു
      '42':
        title: ദുഷ്കരമെങ്കിലും അനിവാര്യമായ കാര്യങ്ങളെ അഭിമുഖീകരിക്കുക
      '43':
        title: ആകാശവിസ്മയങ്ങൾ ദൈവത്തെ സ്തുതിക്കാൻ പ്രേരിപ്പിക്കുന്നു
      '44':
        title: വിശ്വാസത്താൽ നയിക്കപ്പെട്ട പൂർവികർ
      '45':
        title: മോശയ്ക്ക് എല്ലാവരിലും മേലായ ബഹുമതി
      '46':
        title: ദൈവജനത്തിനുവേണ്ടി യോശുവ പോരാടുന്നു
      '47':
        title: നാഥാനെ നേരിട്ട ദാവീദ് പ്രശംസിക്കപ്പെടുന്നു
      '48':
        title: ഏലിയാവും അഗ്നിജ്വാലപോലുള്ള വാക്കുകളുള്ള പ്രവാചകന്മാരും
      '49':
        title: പരിഷ്കാരങ്ങൾക്കായി യോശിയാവിനെ ആദരിക്കുന്നു
      '50':
        title: ശിമയോൻ തന്റെ ജനത്തെ അനുഗ്രഹിക്കുന്നു
      '51':
        title: ഞാൻ എന്റെ ദൈവത്തെ സ്തുതിക്കുന്നു
    Baruch:
      '1':
        title: നദിക്കരയിൽ ബാറൂക്ക് പാപസമ്മതം വായിക്കുന്നു
      '2':
        title: മോശയിലൂടെ നൽകിയ മുന്നറിയിപ്പുകൾ കർത്താവ് നടപ്പാക്കുന്നു
      '3':
        title: ജനം നിലവിളിച്ച് പാപം ഏറ്റുപറഞ്ഞ് മടങ്ങിവരുന്നു
      '4':
        title: ദൈവത്തിന്റെ കല്പനകൾ ജീവൻ നൽകുന്നു
      '5':
        title: യെരൂശലേമേ, നിലനിൽക്കുന്ന മഹിമ അണിയുക
    1 Maccabees:
      '1':
        title: ഗ്രീക്ക് സ്വേച്ഛാധിപത്യത്തെ ഇസ്രായേൽ ചെറുക്കുന്നു
      '2':
        title: നിയമം പാലിക്കുമെന്ന് മത്തത്തിയാസ് പ്രതിജ്ഞ ചെയ്യുന്നു
      '3':
        title: ഇസ്രായേലിന്റെ സഹായത്തിനായി യൂദാസ് പ്രാർഥിക്കുന്നു
      '4':
        title: ദേവാലയം ശുദ്ധീകരിച്ച് വീണ്ടും പ്രതിഷ്ഠിക്കുന്നു
      '5':
        title: ചുറ്റുമുള്ള ജനതകളെ യൂദാസ് തോൽപ്പിക്കുന്നു
      '6':
        title: പരാജയത്തിനുശേഷം അന്ത്യോക്കസ് മരിക്കുന്നു
      '7':
        title: നിക്കാനോറിന്റെ സൈന്യത്തെ യൂദാസ് തോൽപ്പിക്കുന്നു
      '8':
        title: റോമാക്കാരുടെ സൗഹൃദം യൂദാസ് തേടുന്നു
      '9':
        title: യൂദാസിനുശേഷം യോനാഥാൻ നേതൃത്വം ഏറ്റെടുക്കുന്നു
      '10':
        title: അലക്സാണ്ടറുടെ പ്രീതി യോനാഥാൻ നേടുന്നു
