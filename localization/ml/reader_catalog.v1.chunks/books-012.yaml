payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 കൊരിന്ത്യർ
      author: പൗലോസ്, സോസ്തനേസിനോടൊപ്പം.
      audience: കൊരിന്തിലെ ഭിന്നതകളാൽ കലുഷിതമായ ക്രിസ്തീയ സഭ.
      date: ഏകദേശം ക്രി.വ. 53–55; എഫെസൊസിൽനിന്ന് എഴുതിയത്.
    2 Corinthians:
      display_name: 2 കൊരിന്ത്യർ
      author: പൗലോസ്, തിമൊഥെയൊസിനോടൊപ്പം.
      audience: വേദനാജനകമായ ഒരു സംഘർഷത്തിനുശേഷമുള്ള കൊരിന്ത്യസഭ.
      date: ഏകദേശം ക്രി.വ. 55–56.
    Galatians:
      display_name: ഗലാത്യർ
      author: പൗലോസ്.
      audience: പരിച്ഛേദനയും തോറാ ആചരണവും സ്വീകരിക്കാൻ സമ്മർദം നേരിട്ടിരുന്ന ഗലാത്യയിലെ (മധ്യ അനത്തോലിയയിലെ) ക്രിസ്തീയ സഭകൾ.
      date: ഏകദേശം ക്രി.വ. 48–55 (അഭിപ്രായഭേദമുണ്ട്).
    Ephesians:
      display_name: എഫെസ്യർ
      author: പൗലോസ്, അല്ലെങ്കിൽ പൗലോസിന്റെ പേരിൽ എഴുതിയ അടുത്ത ശിഷ്യൻ (അഭിപ്രായഭേദമുണ്ട്).
      audience: ഏഷ്യാ പ്രവിശ്യയിലെ ക്രിസ്ത്യാനികൾ പൊതുവായി; ഏറ്റവും പഴയ കൈയെഴുത്തുപ്രതികളിൽ “എഫെസൊസ്” എന്ന സ്ഥലനാമം കാണുന്നില്ല.
      date: പൗലോസ് എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 60-കൾ; മറ്റൊരാൾ പൗലോസിന്റെ പേരിൽ എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 80–90-കൾ.
    Philippians:
      display_name: ഫിലിപ്പിയർ
      author: പൗലോസ്, തിമൊഥെയൊസിനോടൊപ്പം.
      audience: മക്കെദോന്യയിലെ റോമൻ കോളനിയായ ഫിലിപ്പിയിലെ ക്രിസ്തീയ സഭ.
      date: ഏകദേശം ക്രി.വ. 60–62; തടവിൽനിന്ന് എഴുതിയത്.
    Colossians:
      display_name: കൊലൊസ്സ്യർ
      author: പൗലോസ്, തിമൊഥെയൊസിനോടൊപ്പം—അല്ലെങ്കിൽ പൗലോസിന്റെ പേരിൽ എഴുതിയ അടുത്ത ശിഷ്യൻ (അഭിപ്രായഭേദമുണ്ട്).
      audience: വ്യത്യസ്ത വിശ്വാസങ്ങളെ സമന്വയിപ്പിച്ച ഒരു ഉപദേശം നേരിട്ടിരുന്ന, ലൈക്കൊസ് താഴ്‌വരയിലെ കൊലൊസ്സയിലുള്ള ക്രിസ്ത്യാനികൾ.
      date: പൗലോസ് എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 60–62; മറ്റൊരാൾ പൗലോസിന്റെ പേരിൽ എഴുതിയതാണെങ്കിൽ അതിനുശേഷം.
    1 Thessalonians:
      display_name: 1 തെസ്സലൊനീക്യർ
      author: പൗലോസ്, സില്വാനൊസിനോടും തിമൊഥെയൊസിനോടുംൊപ്പം.
      audience: പീഡനം നേരിട്ടിരുന്ന തെസ്സലൊനീക്യയിലെ പുതുതായി രൂപപ്പെട്ട ക്രിസ്തീയ സഭ.
      date: ഏകദേശം ക്രി.വ. 50–51—നിലവിൽ ലഭ്യമായ പൗലോസിന്റെ ലേഖനങ്ങളിൽ ഏറ്റവും പഴയതായിരിക്കാം.
    2 Thessalonians:
      display_name: 2 തെസ്സലൊനീക്യർ
      author: പൗലോസ് (അഭിപ്രായഭേദമുണ്ട്; ഇത് മറ്റൊരാൾ പൗലോസിന്റെ പേരിൽ എഴുതിയതാണെന്ന് ചില പണ്ഡിതർ കരുതുന്നു).
      audience: അന്ത്യകാലത്തെക്കുറിച്ചുള്ള ആശയക്കുഴപ്പം അഭിസംബോധന ചെയ്യുന്ന ലേഖനം ലഭിച്ച തെസ്സലൊനീക്യസഭ.
      date: പൗലോസ് എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 51.
    1 Timothy:
      display_name: 1 തിമൊഥെയൊസ്
      author: പൗലോസ്, അല്ലെങ്കിൽ പൗലോസിന്റെ പേരിൽ എഴുതിയ ഒരു ശിഷ്യൻ (ഇടയലേഖനങ്ങൾ മറ്റൊരാൾ പൗലോസിന്റെ പേരിൽ എഴുതിയതാണെന്ന അഭിപ്രായം വ്യാപകമാണ്).
      audience: എഫെസൊസിലെ പൗലോസിന്റെ പ്രതിനിധിയായ തിമൊഥെയൊസ്; പിൽക്കാല സഭാക്രമത്തിനുള്ള ഒരു മാർഗനിർദേശഗ്രന്ഥം.
      date: പൗലോസ് എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 60-കളുടെ മധ്യത്തിൽ; മറ്റൊരാൾ പൗലോസിന്റെ പേരിൽ എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 90–110.
    2 Timothy:
      display_name: 2 തിമൊഥെയൊസ്
      author: പൗലോസ്, അല്ലെങ്കിൽ പൗലോസിന്റെ പേരിൽ എഴുതിയ ഒരു ശിഷ്യൻ.
      audience: തിമൊഥെയൊസ്—തടവിൽനിന്നുള്ള പൗലോസിന്റെ വിടവാങ്ങൽസന്ദേശമായി അവതരിപ്പിച്ചിരിക്കുന്നു.
      date: പൗലോസ് എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 60-കളുടെ മധ്യത്തിൽ; മറ്റൊരാൾ പൗലോസിന്റെ പേരിൽ എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 90–110.
    Titus:
      display_name: തീത്തൊസ്
      author: പൗലോസ്, അല്ലെങ്കിൽ പൗലോസിന്റെ പേരിൽ എഴുതിയ ഒരു ശിഷ്യൻ.
      audience: ക്രേത്തയിലെ പൗലോസിന്റെ പ്രതിനിധിയായ തീത്തൊസ്.
      date: പൗലോസ് എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 60-കളുടെ മധ്യത്തിൽ; മറ്റൊരാൾ പൗലോസിന്റെ പേരിൽ എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 90–110.
    Philemon:
      display_name: ഫിലേമോൻ
      author: പൗലോസ്, തിമൊഥെയൊസിനോടൊപ്പം.
      audience: ഒളിച്ചോടിയ അടിമയായ ഒനേസിമൊസിനെ സംബന്ധിച്ച്, അടിമകളെ കൈവശംവെച്ചിരുന്ന ക്രിസ്ത്യാനിയായ ഫിലേമോൻ.
      date: ഏകദേശം ക്രി.വ. 60–62.
    Hebrews:
      display_name: എബ്രായർ
      author: അജ്ഞാതൻ. പാരമ്പര്യം പൗലോസ്, അപ്പൊല്ലോസ്, ബർന്നബാസ്, പ്രിസ്കില്ല എന്നിവരെയും മറ്റുള്ളവരെയും നിർദേശിച്ചിട്ടുണ്ട്; ഒരു നിർദേശത്തിനും പൊതുസമ്മതിയില്ല.
      audience: തങ്ങളുടെ ക്രിസ്തീയ വിശ്വാസപ്രഖ്യാപനത്തിൽനിന്ന് പിന്നോട്ടുപോകാൻ പ്രലോഭിപ്പിക്കപ്പെട്ട, ഗ്രീക്ക് സംസാരിച്ചിരുന്ന യഹൂദ ക്രിസ്ത്യാനികൾ.
      date: ഏകദേശം ക്രി.വ. 60–95.
  chapter_titles:
    Romans:
      '11':
        title: കൃപയാൽ ജാതികൾ വിളിക്കപ്പെടുന്നു
      '12':
        title: ജീവിതങ്ങളെ ജീവനുള്ള യാഗമായി സമർപ്പിക്കുക
      '13':
        title: അധികാരികൾക്ക് കീഴടങ്ങുകയും സ്നേഹിക്കുകയും ചെയ്യുക
      '14':
        title: വിശ്വാസത്തിൽ ബലഹീനരായവരെ സ്വീകരിക്കുക
      '15':
        title: യഹൂദരെയും ജാതികളെയും ഒന്നിപ്പിക്കുക
      '16':
        title: അഭിവാദ്യങ്ങളും മുന്നറിയിപ്പുകളും
    1 Corinthians:
      '1':
        title: എല്ലാവർക്കുമുള്ള ദൈവത്തിന്റെ വിശ്വസ്തമായ സമൃദ്ധി
      '2':
        title: ദൈവാത്മാവിൽനിന്നുള്ള ജ്ഞാനം വെളിപ്പെടുന്നു
      '3':
        title: കൊരിന്ത്യർ ദൈവത്തിന്റെ ആലയമാണെന്ന് പൗലോസ് മുന്നറിയിപ്പുനൽകുന്നു
      '4':
        title: അഹങ്കാരത്തെക്കാൾ വിശ്വസ്തതയാണ് പ്രധാനം
      '5':
        title: സഭയിൽ ശിക്ഷണനടപടി സ്വീകരിക്കാൻ പൗലോസ് കല്പിക്കുന്നു
      '6':
        title: തർക്കങ്ങൾ സഭയ്ക്കുള്ളിൽ പരിഹരിക്കുക
      '7':
        title: വിവാഹത്തെ മാനിക്കാൻ പൗലോസ് പഠിപ്പിക്കുന്നു
      '8':
        title: വ്യക്തിസ്വാതന്ത്ര്യത്തെക്കാൾ സ്നേഹത്തിന് മുൻതൂക്കം
      '9':
        title: പൗലോസ് തന്റെ അപ്പൊസ്തലത്വത്തെ സ്വതന്ത്രമായി പ്രതിരോധിക്കുന്നു
      '10':
        title: ദൈവജനത്തിനുള്ള ഇസ്രായേലിന്റെ മുന്നറിയിപ്പ്
      '11':
        title: ആരാധനയിലെ ഐക്യം ക്രിസ്തുവിനെ ആദരിക്കുന്നു
      '12':
        title: ആത്മാവിന്റെ ദാനങ്ങൾ സഭയുടെ ഐക്യം വളർത്തുന്നു
      '13':
        title: സ്നേഹം ഒരിക്കലും കൈവിടുന്നില്ല
      '14':
        title: ആളുകളെ ആകർഷിക്കുന്നതിനെക്കാൾ സ്നേഹത്തിന് മുൻഗണന നൽകാൻ പൗലോസ് ആവശ്യപ്പെടുന്നു
      '15':
        title: ക്രിസ്തു ഉയിർക്കുന്നു; മരണം വീഴുന്നു
      '16':
        title: വഴിപാടുകളും യാത്രാപദ്ധതികളും ചർച്ചചെയ്യുന്നു
    2 Corinthians:
      '1':
        title: കഷ്ടതയിൽ ദൈവത്തിന്റെ ആശ്വാസം
      '2':
        title: സ്നേഹത്തിനും ക്ഷമയ്ക്കും ആഹ്വാനം
      '3':
        title: രൂപാന്തരപ്പെട്ട ജീവിതങ്ങൾ സാക്ഷ്യപ്പെടുത്തുന്ന ശുശ്രൂഷ
      '4':
        title: ക്രിസ്തുവിന്റെ മഹത്ത്വം പ്രഖ്യാപിക്കുന്നു
      '5':
        title: ക്രിസ്തുവിന്റെ സ്നേഹം ശുശ്രൂഷയെ നയിക്കുന്നു
      '6':
        title: ദൈവത്തിനുവേണ്ടി കഷ്ടത സഹിക്കുക
      '7':
        title: ഭക്ത്യാദരവോടെ വിശുദ്ധി പിന്തുടരുക
      '8':
        title: മക്കെദോന്യരുടെ കൃപ ദാനത്തിന് പ്രചോദനമാകുന്നു
      '9':
        title: വിശുദ്ധർക്കുവേണ്ടി സന്തോഷത്തോടെ നൽകുക
      '10':
        title: ക്രിസ്തുവിന്റെ സൗമ്യതയെ മുൻനിർത്തുന്നു
      '11':
        title: വിശ്വസ്തമായ ജീവിതത്തിനായുള്ള തീക്ഷ്ണത
      '12':
