status: reviewed
payload:
  book_metadata:
    Psalms of Solomon:
      display_name: സോളമോന്റെ സങ്കീർത്തനങ്ങൾ
      author: അജ്ഞാതൻ; സോളമോന്റെ പേരിൽ രചിക്കപ്പെട്ടതായി അവതരിപ്പിക്കപ്പെട്ടിരിക്കുന്നു.
      audience: ക്രി.മു. 63-ൽ പോംപെയുടെ കീഴടക്കത്തോട് പ്രതികരിച്ച യെരൂശലേമിലെ ഭക്തരായ യഹൂദർ.
      date: ഏകദേശം ക്രി.മു. ഒന്നാം നൂറ്റാണ്ടിന്റെ മധ്യകാലം.
    Shepherd of Hermas:
      display_name: ഹെർമാസിന്റെ ഇടയൻ
      author: റോമിൽ ജീവിച്ചിരുന്ന ഹെർമാസ് എന്ന ക്രിസ്ത്യാനി.
      audience: റോമിലെ ക്രിസ്തീയസഭ — മാനസാന്തരത്തെക്കുറിച്ചുള്ള ധാർമികവും അന്ത്യകാലദർശനപരവുമായ ഒരു പ്രവചനം.
      date: ഏകദേശം ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭം മുതൽ മധ്യം വരെ.
  chapter_titles:
    Jubilees:
      '17':
        title: അബ്രാഹാമിന്റെ വിശ്വാസം തെളിയിക്കപ്പെടുന്നു
      '18':
        title: സീയോനിൽ അബ്രാഹാമിന്റെ അനുസരണം പരീക്ഷിക്കപ്പെടുന്നു
      '19':
        title: അബ്രാഹാം മരിക്കുന്നു; യാക്കോബ് അനുഗ്രഹിക്കപ്പെടുന്നു
      '20':
        title: വിശുദ്ധി പാലിക്കാൻ അബ്രാഹാം കൽപ്പിക്കുന്നു
      '21':
        title: നീതിയിൽ നടക്കാൻ അബ്രാഹാം യാക്കോബിനെ അനുഗ്രഹിക്കുന്നു
      '22':
        title: വാരോത്സവം സ്ഥാപിക്കപ്പെടുന്നു
      '23':
        title: ഏശാവിന്റെ കോപത്തിൽനിന്ന് യാക്കോബ് ഓടിപ്പോകുന്നു
      '24':
        title: യാക്കോബ് ലാബാനെ വഞ്ചനാപൂർവം സേവിക്കുന്നു
      '25':
        title: യാക്കോബ് കനാനിലേക്കു മടങ്ങുന്നു
      '26':
        title: യാക്കോബ് ഏശാവുമായി അനുരഞ്ജനപ്പെടുന്നു
      '27':
        title: ഏശാവിൽനിന്ന് ഓടിപ്പോകുമ്പോൾ യാക്കോബ് സ്വപ്നം കാണുന്നു
      '28':
        title: ലാബാൻ വിവാഹകാര്യത്തിൽ യാക്കോബിനെ വഞ്ചിക്കുന്നു
      '29':
        title: യാക്കോബ് ലാബാനെ അറിയിക്കാതെ പോകുന്നു
      '30':
        title: ശിമെയോനും ലേവിയും ദീനായ്ക്കുവേണ്ടി പ്രതികാരം ചെയ്യുന്നു
      '31':
        title: യിസ്ഹാക്ക് ലേവിയെയും യെഹൂദയെയും അനുഗ്രഹിക്കുന്നു
      '32':
        title: യാക്കോബ് ദശാംശം നൽകുകയും പ്രാർഥിക്കുകയും ചെയ്യുന്നു
      '33':
        title: രൂബേൻ യാക്കോബിനെ ഗുരുതരമായി വേദനിപ്പിക്കുന്നു
      '34':
        title: യോസേഫ് ഈജിപ്തിലേക്കു വിൽക്കപ്പെടുന്ന ദുരന്തം
      '35':
        title: മക്പേലയ്ക്കു സമീപം റിബെക്ക മരിക്കുന്നു
      '36':
        title: മരിക്കുന്നതിനുമുമ്പ് യിസ്ഹാക്ക് അനുഗ്രഹിക്കുന്നു
      '37':
        title: ഏശാവ് തന്റെ ശപഥം ഉപേക്ഷിക്കുന്നു
      '38':
        title: യുദ്ധത്തിൽ യാക്കോബ് ഏശാവിനെ കൊല്ലുന്നു
      '39':
        title: യോസേഫ് പോത്തീഫറിന്റെ ഭാര്യയെ ചെറുക്കുന്നു
      '40':
        title: യോസേഫ് ഈജിപ്തിന്റെ ഭരണാധികാരിയായി ഉയരുന്നു
      '41':
        title: സന്തതി ലഭിക്കാൻ താമാർ യെഹൂദയെ വഞ്ചിക്കുന്നു
      '42':
        title: യോസേഫ് സഹോദരന്മാരെ പരീക്ഷിക്കുന്നു
      '43':
        title: ബെന്യാമിനുവേണ്ടി യെഹൂദ അപേക്ഷിക്കുന്നു
      '44':
        title: യാക്കോബിന്റെ ഈജിപ്തിലേക്കുള്ള യാത്ര
      '45':
        title: യിസ്രായേൽ ഗോഷെനിൽ താമസമാക്കുന്നു
      '46':
        title: യോസേഫിന്റെ കീഴിൽ യിസ്രായേൽ അഭിവൃദ്ധിപ്പെടുന്നു
      '47':
        title: മോശ ഞാങ്ങണക്കൂട്ടത്തിനിടയിൽ മറയ്ക്കപ്പെടുന്നു
      '48':
        title: മസ്തേമ മോശയെ ആക്രമിക്കുന്നെങ്കിലും പരാജയപ്പെടുന്നു
      '49':
        title: പെസഹാക്കുഞ്ഞാടിനെ മുറിക്കാതെ മുഴുവനായി ചുട്ടെടുക്കുന്നു
      '50':
        title: ശബ്ബത്ത് വിശ്രമവും വിലക്കപ്പെട്ട ജോലിയും
    Psalms of Solomon:
      '1':
        title: കർത്താവ് എന്റെ ദുരിതനിലവിളി കേൾക്കുന്നു
      '2':
        title: അഹങ്കാരികളായ പാപികളെ ദൈവം വേഗത്തിൽ വിധിക്കുന്നു
      '3':
        title: നീതിമാന്മാർ കർത്താവിനെ നിരന്തരം സ്തുതിക്കുന്നു
      '4':
        title: കപടഭക്തന്റെ അന്ത്യം ലജ്ജാകരം
      '5':
        title: ദൈവം എല്ലാവർക്കും സമൃദ്ധമായി നൽകുന്നു
      '6':
        title: ഒരുങ്ങിയ ഹൃദയം കർത്താവിനെ വിളിച്ചപേക്ഷിക്കുന്നു
      '7':
        title: കർത്താവ് ശത്രുക്കളുടെ പിടിയിൽനിന്ന് സംരക്ഷിക്കുന്നു
      '8':
        title: കർത്താവ് എന്നേക്കും നീതിയോടെ വിധിക്കുന്നു
      '9':
        title: ദൈവത്തിന്റെ കരുണയിലാണ് യിസ്രായേലിന്റെ പ്രത്യാശ
      '10':
        title: ശിക്ഷണം സ്വീകരിക്കുന്നത് ശുദ്ധീകരണം നൽകുന്നു
      '11':
        title: വിദൂരദേശങ്ങളിൽനിന്ന് യിസ്രായേലിനെ ഒരുമിച്ചുകൂട്ടണമേ
      '12':
        title: മന്ത്രിച്ചുപറയുന്ന നുണകളിൽനിന്ന് എന്നെ രക്ഷിക്കണമേ
      '13':
        title: നീതിമാന്മാർ നാശത്തിൽനിന്ന് മോചിതരായി ജീവിക്കുന്നു
      '14':
        title: വിശ്വസ്തർ എന്നേക്കുമുള്ള ജീവവൃക്ഷങ്ങൾ
      '15':
        title: ദുരിതത്തിൽ ഞാൻ കർത്താവിനെ വിളിച്ചപേക്ഷിച്ചു
      '16':
        title: ദൈവത്തിന്റെ കരുണ എന്നെ ഉണർത്തി
      '17':
        title: കർത്താവാണ് സത്യവാനും നിത്യനുമായ രാജാവ്
      '18':
        title: കരുണയുടെ ദിവസത്തിനായി യിസ്രായേലിനെ ശുദ്ധീകരിക്കണമേ
    Shepherd of Hermas:
      '1':
        title: ഹെർമാസ് ദുഷ്ടമോഹത്തെ നേരിടുന്നു
      '2':
        title: പുസ്തകവുമായി ഒരു സ്ത്രീ പ്രത്യക്ഷപ്പെടുന്നു
      '3':
        title: കുടുംബം മാനസാന്തരപ്പെടണമെന്ന് ദൂതൻ ആവശ്യപ്പെടുന്നു
      '4':
        title: വായിച്ചശേഷം സ്ത്രീ പോകുന്നു
      '5':
        title: ആത്മാവ് ഹെർമാസിനെ വീണ്ടും ഉയർത്തുന്നു
      '6':
        title: മാനസാന്തരപ്പെടാൻ മക്കൾക്കു മുന്നറിയിപ്പ്
      '7':
        title: ഹെർമാസിന് ക്ഷമ ലഭിക്കുന്നു; മക്കൾ ശുദ്ധീകരിക്കപ്പെടുന്നു
      '8':
        title: സഭ വൃദ്ധയായ സ്ത്രീയായി വെളിപ്പെടുന്നു
      '9':
        title: വയലിൽ ഹെർമാസ് ആ സ്ത്രീയെ കണ്ടുമുട്ടുന്നു
      '10':
        title: ജലത്തിന്മേൽ പണിയപ്പെടുന്ന ഗോപുരം കാണിക്കുന്നു
      '11':
        title: സ്ത്രീ ദർശനം വിശദീകരിക്കുന്നു
      '12':
        title: ദൂതന്മാർ ഗോപുരം പണിയുന്നു
      '13':
        title: കല്ലുകൾ ഗോപുരത്തിൽ കൃത്യമായി ചേരുന്നു
      '14':
        title: പാപികൾ ഗോപുരത്തിൽനിന്ന് തള്ളപ്പെടുന്നു
      '15':
        title: തള്ളപ്പെട്ട കല്ലുകൾക്കു മാനസാന്തരപ്പെടാം
      '16':
        title: ഏഴു സ്ത്രീകൾ ഗോപുരത്തെ താങ്ങുന്നു
      '17':
        title: മൂന്നാം ദർശനം, ഒമ്പതാം ഭാഗം
      '18':
        title: ശുദ്ധീകരിക്കപ്പെടാൻ നേതാക്കൾക്കു മുന്നറിയിപ്പ്
      '19':
        title: മൂന്നു രൂപങ്ങളുടെ ആദ്യ വിശദീകരണം
      '20':
        title: 'രണ്ടാം ദർശനം: നവീകരിക്കപ്പെട്ട ആത്മാക്കൾ'
      '21':
        title: മൂന്നാം ദർശനം നവീകരണം കാണിക്കുന്നു
      '22':
        title: മൃഗം മഹാകഷ്ടതയെ പ്രതിനിധാനം ചെയ്യുന്നു
      '23':
        title: നിർമലഹൃദയത്തോടെ സേവിക്കാൻ കന്യക ആവശ്യപ്പെടുന്നു
      '24':
        title: മൃഗത്തിന്റെ തലയിലെ നാലു നിറങ്ങൾ
      '25':
        title: ഇടയൻ പ്രധാനകാര്യങ്ങൾ വെളിപ്പെടുത്തുന്നു
      '26':
        title: ഏക സത്യദൈവത്തിൽ വിശ്വസിക്കുക
      '27':
        title: മാന്യത ധരിക്കുക
      '28':
        title: സത്യസന്ധമായി ജീവിക്കാൻ ദൂതൻ ആവശ്യപ്പെടുന്നു
      '29':
        title: നിർമലതയുടെ കൽപ്പന കർശനമായി പാലിക്കുക
      '30':
        title: മാനസാന്തരം യഥാർഥ വിവേകം നൽകുന്നു
      '31':
        title: മാനസാന്തരത്തിലൂടെ ക്ഷമ ലഭിക്കുന്നു
      '32':
        title: ക്ഷമാശീലം പരിശുദ്ധാത്മാവിന് സ്വതന്ത്രമായി വസിക്കാൻ ഇടമൊരുക്കുന്നു
      '33':
        title: നീതിയുടെ വഴിയും ദുഷ്ടതയുടെ വഴിയും തിരിച്ചറിയുക
      '34':
        title: കർത്താവിനെ ഭയപ്പെട്ട് നീതിയോടെ ജീവിക്കുക
      '35':
        title: നന്മയെയും തിന്മയെയും കുറിച്ച് ദൂതൻ സംസാരിക്കുന്നു
      '36':
        title: സംശയത്തെ നിരസിച്ച് വിശ്വസ്തനായ ദൈവത്തെ സേവിക്കുക
      '37':
