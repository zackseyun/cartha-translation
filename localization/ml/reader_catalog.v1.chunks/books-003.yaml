payload:
  book_metadata:
    Judges:
      display_name: ന്യായാധിപന്മാർ
      author: രചയിതാവ് അജ്ഞാതൻ; ആവർത്തനപുസ്തകപരമായ ചരിത്രത്തിന്റെ ഭാഗം.
      audience: രാജവാഴ്ചയ്ക്കു മുമ്പുള്ള തങ്ങളുടെ ഭൂതകാലത്തെ വിശ്വാസത്യാഗത്തിന്റെയും വിടുതലിന്റെയും മുന്നറിയിപ്പുനൽകുന്ന ആവർത്തനചക്രമായി വായിച്ച പിൽക്കാല ഇസ്രായേൽജനത.
      date: ഏകദേശം ക്രി.മു. 7–6 നൂറ്റാണ്ടുകളിൽ സമാഹരിക്കപ്പെട്ടത്.
    Ruth:
      display_name: രൂത്ത്
      author: രചയിതാവ് അജ്ഞാതൻ.
      audience: പ്രവാസാനന്തര ഇസ്രായേൽജനത — ഒരുപക്ഷേ എസ്രാ-നെഹെമ്യാവിന്റെ ബഹിഷ്കരണനയങ്ങൾക്കെതിരെ വിദേശികളെ ഉൾക്കൊള്ളണമെന്ന് വാദിച്ചിരിക്കാം.
      date: മിക്കവാറും പ്രവാസാനന്തര കാലത്തേത്, ഏകദേശം ക്രി.മു. 6–4 നൂറ്റാണ്ടുകൾ.
    1 Samuel:
      display_name: 1 ശമൂവേൽ
      author: രചയിതാവ് അജ്ഞാതൻ; ആവർത്തനപുസ്തകപരമായ ചരിത്രത്തിന്റെ ഭാഗം.
      audience: ശമൂവേൽ, ശൗൽ, ദാവീദ് എന്നിവരുടെ കീഴിൽ രാജവാഴ്ച ഉയർന്നുവന്നതിനെക്കുറിച്ച് ചിന്തിക്കുന്ന ഇസ്രായേൽജനത.
      date: പഴയ സ്രോതസ്സുകളിൽനിന്ന് ഏകദേശം ക്രി.മു. 7–6 നൂറ്റാണ്ടുകളിൽ സമാഹരിക്കപ്പെട്ടത്.
    2 Samuel:
      display_name: 2 ശമൂവേൽ
      author: രചയിതാവ് അജ്ഞാതൻ; ആവർത്തനപുസ്തകപരമായ ചരിത്രത്തിന്റെ ഭാഗം.
      audience: രാജത്വത്തിന്റെ അടിസ്ഥാന മാതൃകയായി ദാവീദിന്റെ ഭരണത്തെയും അതിന്റെ വിജയങ്ങളെയും ദുരന്തങ്ങളെയും വായിക്കുന്ന ഇസ്രായേൽജനത.
      date: ഏകദേശം ക്രി.മു. 7–6 നൂറ്റാണ്ടുകളിൽ സമാഹരിക്കപ്പെട്ടത്.
  chapter_titles:
    Joshua:
      '8':
        title: ഹായി പിടിച്ചടക്കപ്പെടുന്നു; ന്യായപ്രമാണം പുതുക്കപ്പെടുന്നു
      '9':
        title: സമാധാനത്തിനായി ഗിബെയോന്യർ വഞ്ചിക്കുന്നു
      '10':
        title: യുദ്ധത്തിൽ സൂര്യൻ നിശ്ചലമായി നിൽക്കുന്നു
      '11':
        title: ഇസ്രായേൽ വടക്കോട്ട് മുന്നേറി വിജയം നേടുന്നു
      '12':
        title: മുപ്പത്തൊന്ന് രാജാക്കന്മാർ ഇവിടെ പരാജയപ്പെടുന്നു
      '13':
        title: കൈവശമാക്കാൻ ഇനിയും വളരെ ദേശം ശേഷിക്കുന്നു
      '14':
        title: കാലേബ് തന്റെ പർവതഭവനം അവകാശപ്പെടുന്നു
      '15':
        title: യെഹൂദയുടെ പട്ടണങ്ങളും നീരുറവകളും സുരക്ഷിതമാക്കപ്പെടുന്നു
      '16':
        title: യോർദ്ദാനു പടിഞ്ഞാറുള്ള എഫ്രയീമിന്റെ ദേശം
      '17':
        title: മനശ്ശെയുടെ അവകാശവും കടമയും
      '18':
        title: ബെന്യാമീന്റെ അതിർത്തികളും പട്ടണങ്ങളും
      '19':
        title: ലേവ്യർക്ക് അവരുടെ പട്ടണങ്ങൾ ലഭിക്കുന്നു
      '20':
        title: മനഃപൂർവമല്ലാതെ കൊല ചെയ്തവർക്കുള്ള സങ്കേതനഗരങ്ങൾ
      '21':
        title: പൗരോഹിത്യത്തിനായി ലേവ്യരെ വേർതിരിക്കുന്നു
      '22':
        title: കിഴക്കൻ ഗോത്രങ്ങൾ സാക്ഷ്യയാഗപീഠം പണിയുന്നു
      '23':
        title: വിശ്വസ്തമായി അനുസരിക്കാൻ യോശുവ ആഹ്വാനം ചെയ്യുന്നു
      '24':
        title: തിരഞ്ഞെടുക്കാൻ യോശുവ ഇസ്രായേലിനെ വിളിക്കുന്നു
    Judges:
      '1':
        title: കനാന്യർക്കെതിരെ യെഹൂദ നേതൃത്വം നൽകുന്നു
      '2':
        title: ലംഘനത്തെക്കുറിച്ച് ദൂതൻ ഇസ്രായേലിനെ ശാസിക്കുന്നു
      '3':
        title: ഒത്നീയേൽ അരാമിനെ തോൽപ്പിക്കുന്നു
      '4':
        title: ന്യായാധിപയായ ദെബോര സീസെരയെ തോൽപ്പിക്കുന്നു
      '5':
        title: വിജയത്തിനായി ദെബോര ദൈവത്തെ സ്തുതിക്കുന്നു
      '6':
        title: ഗിദെയോൻ വിശ്വാസത്തിനും സംശയത്തിനും ഇടയിൽ ഉഴലുന്നു
      '7':
        title: ഗിദെയോൻ തനിച്ചുതന്നെ മിദ്യാനെ തോൽപ്പിക്കുന്നു
      '8':
        title: സഹായം നിഷേധിച്ച പട്ടണങ്ങളെ ഗിദെയോൻ ശിക്ഷിക്കുന്നു
      '9':
        title: യോഥാം ശെഖേമിന് മുന്നറിയിപ്പു നൽകുന്നു
      '10':
        title: വിഗ്രഹാരാധനയ്ക്കുശേഷം അമ്മോന്യർ ഇസ്രായേലിനെ പീഡിപ്പിക്കുന്നു
      '11':
        title: യിഫ്താഹ് മകളെ ബലിയർപ്പിക്കാമെന്ന് നേർച്ച നേരുന്നു
      '12':
        title: ‘ശിബ്ബോലെത്ത്’ പരീക്ഷയിൽ എഫ്രയീമ്യർ കൊല്ലപ്പെടുന്നു
      '13':
        title: ശിംശോന്റെ ജനനം ദൂതൻ വാഗ്ദാനം ചെയ്യുന്നു
      '14':
        title: കഴുതയുടെ താടിയെല്ലുകൊണ്ട് ശിംശോൻ ഫെലിസ്ത്യരെ തോൽപ്പിക്കുന്നു
      '15':
        title: പ്രതികാരത്തോടെ ശിംശോൻ ഫെലിസ്ത്യരെ കൊല്ലുന്നു
      '16':
        title: ഫെലിസ്ത്യക്ഷേത്രം ശിംശോൻ ഇടിച്ചുതകർക്കുന്നു
      '17':
        title: അലഞ്ഞുതിരിയുന്ന പുരോഹിതനെ മീഖാ കൂലിക്കെടുക്കുന്നു
      '18':
        title: വിഗ്രഹത്തിനായി ദാൻ പുരോഹിതനെ മോഷ്ടിച്ചെടുക്കുന്നു
      '19':
        title: ബെന്യാമീന്യർ ലേവ്യന്റെ വെപ്പാട്ടിയെ കൊല്ലുന്നു
      '20':
        title: ഗിബെയയിൽ ഇസ്രായേൽ ബെന്യാമീനെ തോൽപ്പിക്കുന്നു
      '21':
        title: ബെന്യാമീൻ പ്രതിസന്ധി അതിജീവിക്കുന്നു
    Ruth:
      '1':
        title: എല്ലാം നഷ്ടപ്പെട്ട നൊവൊമി ശൂന്യയായി മടങ്ങുന്നു
      '2':
        title: ബോവസിന്റെ വയലിൽ രൂത്ത് കതിർ പെറുക്കുന്നു
      '3':
        title: രാത്രിയിൽ രൂത്ത് സംരക്ഷണം തേടുന്നു
      '4':
        title: ബോവസ് രൂത്തിനെയും കുടുംബത്തെയും വീണ്ടെടുക്കുന്നു
    1 Samuel:
      '1':
        title: ഒരു മകനുവേണ്ടി ഹന്നാ പ്രാർഥിക്കുന്നു
      '2':
        title: ദൈവത്തിന്റെ പരമാധികാരത്തെ ഹന്നാ സ്തുതിക്കുന്നു
      '3':
        title: ദൈവത്തിന്റെ വിളി ശമൂവേൽ കേൾക്കുന്നു
      '4':
        title: ഇസ്രായേലിന് പെട്ടകം ഫെലിസ്ത്യരോട് നഷ്ടമാകുന്നു
      '5':
        title: പെട്ടകം നിമിത്തം ഫെലിസ്ത്യർ കഷ്ടപ്പെടുന്നു
      '6':
        title: പെട്ടകം മടങ്ങിവരുന്നു; ബേത്ത്-ശേമെശ് ആനന്ദിക്കുന്നു
      '7':
        title: ഇസ്രായേൽ മാനസാന്തരപ്പെട്ട് ഫെലിസ്ത്യരെ തോൽപ്പിക്കുന്നു
      '8':
        title: ഇസ്രായേൽ ഒരു രാജാവിനെ ആവശ്യപ്പെടുന്നു
      '9':
        title: ശൗൽ പ്രവാചകനായ ശമൂവേലിനെ കണ്ടുമുട്ടുന്നു
      '10':
        title: ശമൂവേൽ ശൗലിനെ രാജാവായി അഭിഷേകം ചെയ്യുന്നു
      '11':
        title: അമ്മോനെതിരെ ശൗൽ ഇസ്രായേലിനെ ഒന്നിപ്പിക്കുന്നു
      '12':
        title: ഇസ്രായേലിന്റെ പാപത്തെ ശമൂവേൽ അപലപിക്കുന്നു
      '13':
        title: ശൗൽ ദൈവത്തിന്റെ കല്പന അനുസരിക്കുന്നില്ല
      '14':
        title: ദാവീദ് വിശ്വസ്തതയോടെ ഫെലിസ്ത്യരെ തോൽപ്പിക്കുന്നു
      '15':
        title: ശൗലിന്റെ അസൂയ ദാവീദിന് ഭീഷണിയാകുന്നു
      '16':
        title: ശൗലിനു പകരം ദൈവം ദാവീദിനെ തിരഞ്ഞെടുക്കുന്നു
      '17':
        title: ദാവീദ് മല്ലനായ ഗൊല്യാത്തിനെ തോൽപ്പിക്കുന്നു
      '18':
        title: യോനാഥാനും ദാവീദും ആത്മബന്ധത്തിലാകുന്നു
      '19':
        title: ദാവീദ് ശൗലിൽനിന്ന് രക്ഷപ്പെടുന്നു
      '20':
        title: അപകടത്തെക്കുറിച്ച് യോനാഥാൻ ദാവീദിന് മുന്നറിയിപ്പു നൽകുന്നു
      '21':
        title: ദാവീദ് പുരോഹിതനായ അഹീമേലെക്കിന്റെ അടുക്കലേക്ക് ഓടിപ്പോകുന്നു
      '22':
        title: അദുല്ലാമിൽ ദാവീദ് നേതാവാകുന്നു
      '23':
        title: ദാവീദ് ശൗൽ രാജാവിന്റെ ജീവൻ രക്ഷിക്കുന്നു
      '24':
        title: ഗുഹയിൽവെച്ച് ദാവീദ് ശൗലിന്റെ ജീവൻ രക്ഷിക്കുന്നു
      '25':
        title: അബീഗയിൽ അപേക്ഷിക്കുന്നു; നാബാൽ മരിക്കുന്നു
      '26':
        title: ദാവീദ് ശൗലിന്റെ ജീവൻ രക്ഷിക്കുന്നു
      '27':
        title: ആഖീശിനുവേണ്ടി ആക്രമണങ്ങൾ നടത്തിയതായി ദാവീദ് നടിക്കുന്നു
      '28':
        title: നിരാശയിൽ ശൗൽ ശമൂവേലിനെ തേടുന്നു
      '29':
        title: ദാവീദിനെ യുദ്ധത്തിൽനിന്ന് ഒഴിവാക്കുന്നു
      '30':
        title: സിക്ലാഗിലെ ബന്ദികളെ ദാവീദ് രക്ഷിക്കുന്നു
      '31':
        title: ശൗൽ വീഴുന്നു; ഫെലിസ്ത്യർ വിജയിക്കുന്നു
