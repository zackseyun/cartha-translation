status: reviewed
payload:
  book_metadata:
    Proverbs:
      display_name: സദൃശ്യവാക്യങ്ങൾ
      author: ഒരു സമാഹാരം; ശീർഷകക്കുറിപ്പുകളിൽ ശലോമോൻ, ആഗൂർ, ലെമൂവേൽ, "ജ്ഞാനികൾ" എന്നിവരുടെ പേരുകൾ കാണുന്നു.
      audience: ദൈനംദിന ജീവിതത്തിനാവശ്യമായ ജ്ഞാനത്തിൽ വളർത്തപ്പെടുന്ന യുവ ഇസ്രായേല്യർ.
      date: രചനയുടെ വിവിധ പാളികൾ ഏകദേശം ക്രി.മു. 10–4 നൂറ്റാണ്ടുകളിലേതാണ്.
    Ecclesiastes:
      display_name: സഭാപ്രസംഗി
      author: രചയിതാവ് അജ്ഞാതൻ; പ്രഭാഷകൻ "കോഹെലെത്ത്" എന്നാണ് അറിയപ്പെടുന്നത്; പാരമ്പര്യമായി ശലോമോനുമായി തിരിച്ചറിയപ്പെടുന്നു.
      audience: സൂര്യനുകീഴിൽ ജ്ഞാനം, സമ്പത്ത്, പ്രയത്നം എന്നിവയ്ക്കുള്ള പരിമിതികളെ അഭിമുഖീകരിക്കുന്ന ഇസ്രായേല്യർ.
      date: അരമായ സ്വാധീനമുള്ള എബ്രായ ഭാഷയെ അടിസ്ഥാനമാക്കി, സാധ്യതയേറിയ കാലം ഏകദേശം ക്രി.മു. 5–3 നൂറ്റാണ്ടുകളാണ്.
    Song of Solomon:
      display_name: ഉത്തമഗീതം
      author: രചയിതാവ് അജ്ഞാതൻ; ശീർഷകക്കുറിപ്പ് ശലോമോനെ പരാമർശിക്കുന്നു.
      audience: ഉടമ്പടിയിലെ ആത്മബന്ധം മനസ്സിലാക്കാനുള്ള ഒരു വീക്ഷണമായി ലൈംഗികപ്രണയത്തെ വായിക്കുന്ന ഇസ്രായേൽ—പിന്നീട് അതിനെ രൂപകാത്മകമായി വായിച്ച യഹൂദ-ക്രൈസ്തവ വായനക്കാരും.
      date: സാധ്യതയനുസരിച്ച് പ്രവാസാനന്തരകാലത്ത്, ഏകദേശം ക്രി.മു. 5–3 നൂറ്റാണ്ടുകളിൽ.
  chapter_titles:
    Psalms:
      '104':
        title: യഹോവ സൃഷ്ടിക്കുകയും പരിപാലിക്കുകയും പുതുക്കുകയും ചെയ്യുന്നു
      '105':
        title: ദൈവത്തിന് നന്ദി പറയുക; ഉടമ്പടി ഓർക്കുക
      '106':
        title: മറന്നുപോയ സ്നേഹം എന്നേക്കുമായി വീണ്ടെടുക്കപ്പെട്ടു
      '107':
        title: വീണ്ടെടുക്കപ്പെട്ടവർ കർത്താവിന് നന്ദി പറയട്ടെ
      '108':
        title: വിടുതലിനായി ദാവീദ് പ്രാർഥിക്കുന്നു
      '109':
        title: ദുഷ്ടനായ പീഡകനെതിരെ അടിയന്തര നിലവിളി
      '110':
        title: വിശുദ്ധപ്രഭയോടെ ദാവീദ് ഭരിക്കുന്നു
      '111':
        title: പൂർണഹൃദയത്തോടെ യഹോവയെ സ്തുതിക്കുക
      '112':
        title: ദൈവഭക്തനായ വ്യക്തി അനുഗൃഹീതൻ
      '113':
        title: എളിയവരെ ഉയർത്തുന്ന യഹോവയെ സ്തുതിക്കുക
      '114':
        title: ഇസ്രായേലിന്റെ പുറപ്പാടും പ്രകൃതിയുടെ പ്രതികരണവും
      '115':
        title: മഹത്ത്വം യഹോവയ്ക്കു മാത്രം
      '116':
        title: രക്ഷിക്കുന്ന യഹോവയെ സങ്കീർത്തനക്കാരൻ സ്നേഹിക്കുന്നു
      '117':
        title: നിലനിൽക്കുന്ന സ്നേഹത്തിനായി യഹോവയെ സ്തുതിക്കുക
      '118':
        title: നന്ദി പറയാൻ സങ്കീർത്തനം 118 ആഹ്വാനം ചെയ്യുന്നു
      '120':
        title: സങ്കീർത്തനക്കാരൻ നിലവിളിക്കുന്നു; കർത്താവ് ഉത്തരമരുളുന്നു
      '121':
        title: സഹായം കർത്താവിൽനിന്നു വരുന്നു
      '122':
        title: യെരൂശലേമിന്റെ സമാധാനത്തിനായി ദാവീദ് പ്രാർഥിക്കുന്നു
      '123':
        title: യഹോവയിൽ ആശ്രയിച്ച് സങ്കീർത്തനക്കാരൻ മേലോട്ടു നോക്കുന്നു
      '124':
        title: അപകടത്തിൽനിന്ന് യഹോവ ഇസ്രായേലിനെ രക്ഷിക്കുന്നു
      '125':
        title: ആശ്രയം അചഞ്ചലമായ സുരക്ഷ നൽകുന്നു
      '126':
        title: സീയോന്റെ പുനഃസ്ഥാപനം അതിരറ്റ സന്തോഷം നൽകുന്നു
      '127':
        title: യഹോവ പണിയുകയും സംരക്ഷിക്കുകയും ചെയ്യുന്നു
      '128':
        title: ദൈവത്തെ ഭയപ്പെടുന്നവർ അനുഗൃഹീതർ
      '129':
        title: ഇസ്രായേലിന്റെ ശത്രുക്കൾക്ക് നമ്മെ തോൽപ്പിക്കാനാവില്ല
      '130':
        title: കരുണയ്ക്കായി സങ്കീർത്തനക്കാരൻ നിലവിളിക്കുന്നു
      '131':
        title: ദാവീദ് ദൈവസന്നിധിയിൽ ശാന്തമായി വിശ്രമിക്കുന്നു
      '132':
        title: യഹോവയുടെ വാസസ്ഥലം ദാവീദ് അന്വേഷിക്കുന്നു
      '133':
        title: ദൈവജനത്തിന്റെ ഐക്യത്തെ ദാവീദ് പുകഴ്ത്തുന്നു
      '134':
        title: രാത്രികാവൽക്കാർ യഹോവയെ സ്തുതിക്കുന്നു
      '135':
        title: വിഗ്രഹങ്ങളെ പരാജയപ്പെടുത്തുന്ന യഹോവയെ സ്തുതിക്കുക
      '136':
        title: അവസാനമില്ലാത്ത സ്നേഹത്തിനായി യഹോവയ്ക്ക് നന്ദി പറയുക
      '137':
        title: യെരൂശലേമിനെ ഓർത്ത് പ്രവാസികൾ കരയുന്നു
      '138':
        title: ദാവീദ് പരസ്യമായി യഹോവയ്ക്ക് നന്ദി പറയുന്നു
      '139':
        title: ദൈവത്തിന്റെ പൂർണമായ അറിവും സാന്നിധ്യവും
      '140':
        title: അക്രമത്തിൽനിന്ന് ദൈവം ദാവീദിനെ കാക്കുന്നു
      '141':
        title: വാക്കുകൾ നിയന്ത്രിക്കപ്പെടാൻ ദാവീദ് പ്രാർഥിക്കുന്നു
      '142':
        title: ദാവീദ് കർത്താവിനോട് നിലവിളിക്കുന്നു
      '143':
        title: കരുണയ്ക്കായി ദാവീദ് പ്രാർഥിക്കുന്നു
      '144':
        title: സംരക്ഷണത്തിനായി ദാവീദ് പ്രാർഥിക്കുന്നു
      '145':
        title: ദൈവത്തിന്റെ മഹത്ത്വത്തെ ദാവീദ് സ്തുതിക്കുന്നു
      '146':
        title: എന്റെ ആത്മാവ് എന്നേക്കും ദൈവത്തെ സ്തുതിക്കുന്നു
      '147':
        title: വീണ്ടും പണിയുകയും സൗഖ്യമാക്കുകയും ചെയ്യുന്ന യഹോവയെ സ്തുതിക്കുക
      '148':
        title: സകല സൃഷ്ടിയും കർത്താവിനെ സ്തുതിക്കുന്നു
      '149':
        title: എല്ലാവരും യാഹിനെ സ്തുതിക്കട്ടെ
      '150':
        title: സകല വാദ്യങ്ങളോടുംകൂടെ യാഹിനെ സ്തുതിക്കുക
    Proverbs:
      '1':
        title: കർത്താവിനോടുള്ള ഭയം ശലോമോൻ പഠിപ്പിക്കുന്നു
      '2':
        title: ദൈവത്തെ അന്വേഷിക്കുന്നതിലൂടെ ജ്ഞാനം ലഭിക്കുന്നു
      '3':
        title: ദൈവത്തിൽ ആശ്രയിക്കുക; ജ്ഞാനം നേടുക
      '4':
        title: എല്ലാറ്റിനുമുപരി ജ്ഞാനം തേടാൻ പിതാവ് പ്രേരിപ്പിക്കുന്നു
      '5':
        title: വ്യഭിചാരത്തിനെതിരെ പിതാവ് മുന്നറിയിപ്പു നൽകുന്നു
      '6':
        title: പാപത്തിനും അലസതയ്ക്കുമെതിരായ മുന്നറിയിപ്പുകൾ
      '7':
        title: വ്യഭിചാരത്തിന്റെ പ്രലോഭനത്തിൽനിന്ന് അകന്നുനിൽക്കുക
      '8':
        title: അന്വേഷിക്കുന്നവരെ ജ്ഞാനം വിളിക്കുന്നു
      '9':
        title: ജ്ഞാനം ക്ഷണിക്കുന്നു; ഭോഷത്തം പ്രലോഭിപ്പിക്കുന്നു
      '10':
        title: നീതിയും ദുഷ്ടതയും തമ്മിലുള്ള വൈരുധ്യങ്ങൾ
      '11':
        title: നേർമ്മ അനുഗ്രഹത്തിലേക്കു നയിക്കുന്നു
      '12':
        title: നീതിമാന്മാർ ജ്ഞാനത്തോടെയും നന്മയോടെയും ജീവിക്കുന്നു
      '13':
        title: പഠിക്കാൻ സന്നദ്ധത ജീവനിലേക്കു നയിക്കുന്നു
      '14':
        title: ജ്ഞാനം ഭവനം പണിയുകയും കർത്താവിനെ ഭയപ്പെടുകയും ചെയ്യുന്നു
      '15':
        title: സൗമ്യമായ സംസാരം ജീവൻ നൽകുന്നു
      '16':
        title: മനുഷ്യർ പദ്ധതിയിടുന്നു; ഫലങ്ങൾ ദൈവം നയിക്കുന്നു
      '17':
        title: ദൈവഭയം ജ്ഞാനം നൽകുന്നു
      '18':
        title: ജ്ഞാനം കേൾക്കുന്നു; ഭോഷത്തം തിരുത്തൽ നിരസിക്കുന്നു
      '19':
        title: സമ്പത്തിനേക്കാൾ എപ്പോഴും ശ്രേഷ്ഠം സത്യസന്ധത
      '20':
        title: മദ്യപാനം ഒഴിവാക്കി സത്യസന്ധതയെ വിലമതിക്കുക
      '21':
        title: ദൈവം ഹൃദയങ്ങളെ വിധിക്കുകയും നീതിയെ വിലമതിക്കുകയും ചെയ്യുന്നു
      '22':
        title: താഴ്മ ദൈവത്തെ കൂടുതൽ ബഹുമാനിക്കുന്നു
      '23':
        title: അതിഭക്ഷണത്തിനും അത്യാഗ്രഹത്തിനുമെതിരെ മുന്നറിയിപ്പ്
      '24':
        title: ദുഷ്ടരോട് അസൂയപ്പെടരുത്
      '25':
        title: ജ്ഞാനം താഴ്മയ്ക്ക് ആഹ്വാനം ചെയ്യുന്നു
      '26':
        title: ഭോഷന്മാർ തങ്ങളെയും മറ്റുള്ളവരെയും ദോഷപ്പെടുത്തുന്നു
      '27':
        title: താഴ്മയും യാഥാർഥ്യബോധവും പഠിപ്പിക്കുന്നു
      '28':
        title: യഹോവയെ അന്വേഷിച്ച് നീതിമാന്മാർ വിജയം നേടുന്നു
      '29':
        title: ദുശ്ശാഠ്യം നാശത്തിലേക്കു നയിക്കുന്നു
      '30':
        title: ആഗൂർ അഗാധമായ താഴ്മയോടെ സംസാരിക്കുന്നു
      '31':
        title: നീതി നിലനിർത്താൻ അമ്മ രാജാവിനെ ഉപദേശിക്കുന്നു
    Ecclesiastes:
      '1':
