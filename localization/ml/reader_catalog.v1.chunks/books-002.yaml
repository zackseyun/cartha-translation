payload:
  book_metadata:
    Numbers:
      display_name: സംഖ്യാപുസ്തകം
      author: രചയിതാവ് അജ്ഞാതൻ; പാരമ്പര്യമായി മോശെയുടേതെന്ന് കരുതപ്പെടുന്നു.
      audience: ഈജിപ്തിനും വാഗ്ദത്തദേശത്തിനുമിടയിൽ യാത്ര ചെയ്തിരുന്ന ഇസ്രായേൽ—മരുഭൂമിയിലെ തലമുറയും അവരുടെ പരാജയങ്ങളിൽനിന്ന് പാഠം പഠിക്കുന്ന പിൽക്കാല വായനക്കാരും.
      date: രാജവാഴ്ചയുടെ അവസാനകാലംമുതൽ പ്രവാസാനന്തരകാലംവരെയുള്ള രചനാഘട്ടങ്ങൾ (ഏകദേശം ക്രി.മു. 7–5 നൂറ്റാണ്ടുകൾ).
    Deuteronomy:
      display_name: ആവർത്തനപുസ്തകം
      author: രചയിതാവ് അജ്ഞാതൻ; മോശെയുടെ വിടവാങ്ങൽ പ്രസംഗങ്ങളായാണ് അവതരിപ്പിച്ചിരിക്കുന്നത്. ആധുനിക പണ്ഡിതപഠനം ഇതിന്റെ മുഖ്യഭാഗത്തെ ക്രി.മു. 7-ാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിൽ യോശീയാവിന്റെ ഭരണകാലത്തു നടന്ന പരിഷ്കരണവുമായി ബന്ധിപ്പിക്കുന്നു.
      audience: ദേശത്തേക്കു പ്രവേശിക്കാൻ ഒരുങ്ങിയിരുന്ന ഇസ്രായേൽ—കൂടാതെ, ദേവാലയമോ രാജാവോ ഇല്ലാതെ എങ്ങനെ വിശ്വസ്തരായി ജീവിക്കാമെന്ന് അന്വേഷിച്ച പിൽക്കാല പ്രവാസികളും.
      date: മുഖ്യഭാഗം ഏകദേശം ക്രി.മു. 7-ാം നൂറ്റാണ്ടിന്റെ അവസാനം; പ്രവാസകാലത്ത് അന്തിമരൂപം പ്രാപിച്ചു.
    Joshua:
      display_name: യോശുവ
      author: രചയിതാവ് അജ്ഞാതൻ; ആവർത്തനപുസ്തകചരിത്രത്തിന്റെ ഭാഗം.
      audience: രാജവാഴ്ചയുടെയും പ്രവാസത്തിന്റെയും കാലത്തെ ഇസ്രായേൽ; ദേശജയം, ഉടമ്പടി, ദേശത്തിന്റെ അർഥം എന്നിവയെക്കുറിച്ച് ചിന്തിക്കുന്നു.
      date: പഴയ പാരമ്പര്യങ്ങളെ ആധാരമാക്കി ഏകദേശം ക്രി.മു. 7–6 നൂറ്റാണ്ടുകളിൽ സമാഹരിക്കപ്പെട്ടു.
  chapter_titles:
    Leviticus:
      '8':
        title: അഹരോൻ പുരോഹിതനായി പ്രതിഷ്ഠിക്കപ്പെടുന്നു
      '9':
        title: അർപ്പിച്ച യാഗത്തെ അഗ്നി ദഹിപ്പിക്കുന്നു
      '10':
        title: നാദാബും അബീഹൂവും ശിക്ഷിക്കപ്പെടുന്നു
      '11':
        title: ശുദ്ധവും അശുദ്ധവുമായ ഭക്ഷണങ്ങളെക്കുറിച്ചുള്ള നിയമങ്ങൾ
      '12':
        title: പ്രസവശേഷം സ്ത്രീ ശുദ്ധീകരിക്കപ്പെടുന്നു
      '13':
        title: പുരോഹിതന്മാർ ത്വഗ്രോഗങ്ങൾ പരിശോധിക്കുന്നു
      '14':
        title: യാഗങ്ങളിലൂടെ ശുദ്ധി വീണ്ടെടുക്കുന്നു
      '15':
        title: ശരീരസ്രവങ്ങൾ മൂലമുള്ള അശുദ്ധി
      '16':
        title: എല്ലാ പാപങ്ങൾക്കും പ്രായശ്ചിത്തം ചെയ്യുന്നു
      '17':
        title: യാഗങ്ങൾ സമാഗമകൂടാരത്തിന്റെ വാതിൽക്കൽ കൊണ്ടുവരണം
      '18':
        title: ധാർമിക വിശുദ്ധി പാലിക്കാൻ യഹോവ കല്പിക്കുന്നു
      '19':
        title: വിശുദ്ധരാകാൻ ഇസ്രായേൽ വിളിക്കപ്പെടുന്നു
      '20':
        title: ഗുരുതരമായ പാപങ്ങൾക്ക് കഠിനശിക്ഷകൾ
      '21':
        title: പുരോഹിതന്മാർ സവിശേഷ വിശുദ്ധി പാലിക്കണം
      '22':
        title: വിശുദ്ധ വഴിപാടുകൾ ശ്രദ്ധയോടെ കൈകാര്യം ചെയ്യണം
      '23':
        title: ആരാധനയ്ക്കുള്ള നിശ്ചിത സമയങ്ങൾ പഠിപ്പിക്കുന്നു
      '24':
        title: വിളക്കുകൾ കത്തുന്നു; അപ്പം അർപ്പിക്കുന്നു
      '25':
        title: ഓരോ ഏഴാം വർഷവും ദേശം വിശ്രമിക്കുന്നു
      '26':
        title: ഉടമ്പടിയുടെ വഴി ഇസ്രായേൽ തിരഞ്ഞെടുക്കുന്നു
      '27':
        title: നേർച്ചകളും സമർപ്പണങ്ങളും വിശ്വസ്തതയോടെ നിറവേറ്റണം
    Numbers:
      '1':
        title: മോശെ ഇസ്രായേല്യ പുരുഷന്മാരെ എണ്ണുന്നു
      '2':
        title: ഗോത്രങ്ങൾ തിരുനിവാസത്തിനു ചുറ്റും പാളയമടിക്കുന്നു
      '3':
        title: ലേവ്യർ ദൈവത്തിന്റെ വിശുദ്ധ നിവാസത്തിൽ ശുശ്രൂഷിക്കുന്നു
      '4':
        title: കെഹാത്യർ വിശുദ്ധ വസ്തുക്കൾ പരിപാലിക്കുന്നു
      '5':
        title: മറഞ്ഞിരിക്കുന്ന പാപത്തെ ദൈവം വിധിക്കുന്നു
      '6':
        title: നാസീർവ്രതവും അനുഗ്രഹവും
      '7':
        title: പ്രമാണിമാർ വിശുദ്ധമന്ദിരത്തിനായി വഴിപാടുകൾ അർപ്പിക്കുന്നു
      '8':
        title: ദൈവത്തെ സേവിക്കാൻ ലേവ്യർ ശുദ്ധീകരിക്കപ്പെടുന്നു
      '9':
        title: പെസഹ ആചരിക്കാൻ യഹോവ കല്പിക്കുന്നു
      '10':
        title: വെള്ളിക്കാഹളങ്ങൾ ദൈവകല്പനകൾക്ക് സൂചന നൽകുന്നു
      '11':
        title: ദുരാഗ്രഹത്തെത്തുടർന്ന് മഹാമാരി ബാധിക്കുന്നു
      '12':
        title: മോശെയുടെ അധികാരത്തിനെതിരെ മിര്യാം സംസാരിക്കുന്നു
      '13':
        title: പന്ത്രണ്ടുപേർ വാഗ്ദത്തദേശം നിരീക്ഷിക്കുന്നു
      '14':
        title: അവിശ്വാസം നിമിത്തം ഇസ്രായേൽ ശിക്ഷിക്കപ്പെടുന്നു
      '15':
        title: വഴിപാടുകളെയും വസ്ത്രത്തൊങ്ങലുകളെയും കുറിച്ചുള്ള നിർദേശങ്ങൾ
      '16':
        title: കോരഹ് മത്സരിക്കുന്നു; ഭൂമി വിഴുങ്ങുന്നു
      '17':
        title: അഹരോന്റെ വടി പുരോഹിതവംശത്തെ സ്ഥിരീകരിക്കുന്നു
      '18':
        title: പുരോഹിതന്മാരുടെ മേൽനോട്ടത്തിൽ ലേവ്യർ സേവിക്കുന്നു
      '19':
        title: ചുവന്ന പശുവിനെക്കുറിച്ചുള്ള നിയമം ശുദ്ധീകരണം നൽകുന്നു
      '20':
        title: കാദേശിൽ മോശെ പ്രതിസന്ധി നേരിടുന്നു
      '21':
        title: ഇസ്രായേൽ കനാന്യരാജാവിനെ തോൽപ്പിക്കുന്നു
      '22':
        title: ഇസ്രായേലിനെ ശപിക്കാൻ ബിലെയാം വിസമ്മതിക്കുന്നു
      '23':
        title: ബിലെയാം ഇസ്രായേലിനെ വീണ്ടും വീണ്ടും അനുഗ്രഹിക്കുന്നു
      '24':
        title: ഇസ്രായേലിന്റെ ഭാവിമഹത്ത്വം ബിലെയാം പ്രഖ്യാപിക്കുന്നു
      '25':
        title: ഫീനെഹാസ് സിമ്രിയെ കൊല്ലുന്നു
      '26':
        title: മോശെ പുതിയ യോദ്ധാക്കളെ എണ്ണുന്നു
      '27':
        title: പിതാവിന്റെ അവകാശത്തിനായി പുത്രിമാർ അപേക്ഷിക്കുന്നു
      '28':
        title: ഇസ്രായേൽ പതിവുയാഗങ്ങൾ അർപ്പിക്കുന്നു
      '29':
        title: ഇസ്രായേൽ മാസത്തിലെ യാഗങ്ങൾ അർപ്പിക്കുന്നു
      '30':
        title: നേർച്ചകളെക്കുറിച്ച് മോശെ സംസാരിക്കുന്നു
      '31':
        title: മിദ്യാനോടു പ്രതികാരം ചെയ്യാൻ മോശെ കല്പിക്കുന്നു
      '32':
        title: രൂബേനും ഗാദും കിഴക്കൻ ദേശം ആവശ്യപ്പെടുന്നു
      '33':
        title: ഈജിപ്തിൽനിന്നുള്ള ഇസ്രായേലിന്റെ യാത്ര വിവരിക്കുന്നു
      '34':
        title: കനാന്റെ അതിർത്തികൾ യഹോവ നിർണയിക്കുന്നു
      '35':
        title: സങ്കേതനഗരങ്ങൾ അഭയം നൽകുന്നു
      '36':
        title: സെലോഫഹാദിന്റെ പുത്രിമാർ സ്വന്തം കുലത്തിൽ വിവാഹം കഴിക്കുന്നു
    Deuteronomy:
      '1':
        title: ദൈവത്തിന്റെ വിശ്വസ്തത മോശെ ഓർമിപ്പിക്കുന്നു
      '2':
        title: ഇസ്രായേൽ ഏദോമിനെയും മോവാബിനെയും ഒഴിവാക്കുന്നു
      '3':
        title: ഇസ്രായേൽ ഓഗ് രാജാവിനെ തോൽപ്പിക്കുന്നു
      '4':
        title: ജ്ഞാനപൂർവം അനുസരിക്കാൻ മോശെ പ്രബോധിപ്പിക്കുന്നു
      '5':
        title: പത്തു കല്പനകൾ മോശെ വീണ്ടും പ്രസ്താവിക്കുന്നു
      '6':
        title: ദൈവത്തെ സ്നേഹിക്കാൻ മോശെ ഇസ്രായേലിനോടു കല്പിക്കുന്നു
      '7':
        title: ഇസ്രായേൽ വിഗ്രഹങ്ങൾ നശിപ്പിക്കണം
      '8':
        title: കഷ്ടതയിൽ ദൈവം പരിപാലിച്ചതിനെ ഓർക്കുക
      '9':
        title: ഇസ്രായേലിനുവേണ്ടി മോശെ അപേക്ഷിക്കുന്നു
      '10':
        title: ദൈവം ആവശ്യപ്പെടുന്ന കാര്യങ്ങളെക്കുറിച്ച് മോശെ സംസാരിക്കുന്നു
      '11':
        title: സ്നേഹിക്കാൻ മോശെ ഇസ്രായേലിനോടു കല്പിക്കുന്നു
      '12':
        title: തിരഞ്ഞെടുത്ത സ്ഥലത്തുമാത്രം ആരാധിക്കുക
      '13':
        title: വ്യാജപ്രവാചകന്മാരെയും വിഗ്രഹങ്ങളെയും നിരസിക്കുക
      '14':
        title: ദൈവജനമായി വ്യത്യസ്തമായി ജീവിക്കുക
      '15':
        title: ഓരോ ഏഴാം വർഷവും കടങ്ങൾ ഇളച്ചുകൊടുക്കുക
      '16':
        title: ഉദാരതയോടെ ഉത്സവങ്ങൾ ആഘോഷിക്കുക
      '17':
        title: വിഗ്രഹാരാധനയെ വിധിച്ച് നിയമം പാലിക്കുക
      '18':
