payload:
  book_metadata:
    2 Esdras:
      display_name: 2 എസ്ദ്രാസ്
      author: അജ്ഞാതൻ; യഥാർത്ഥത്തിൽ യഹൂദമായിരുന്ന കാതലായ ഭാഗത്തെ (4 എസ്രാ, 3–14 അധ്യായങ്ങൾ) ചുറ്റി ക്രൈസ്തവരാൽ തിരുത്തിച്ചേർത്ത ഒരു ചട്ടക്കൂടുണ്ട്.
      audience: ദൈവനീതിയെക്കുറിച്ചുള്ള ചോദ്യങ്ങളുമായി മല്ലിട്ടിരുന്ന എ.ഡി. 70-നു ശേഷമുള്ള യഹൂദർ; പിന്നീട് ക്രൈസ്തവ വായനക്കാർക്കായി വിപുലീകരിക്കപ്പെട്ടു.
      date: യഹൂദ കാതൽ ഏകദേശം എ.ഡി. 100; ക്രൈസ്തവ കൂട്ടിച്ചേർക്കലുകൾ ഏകദേശം എ.ഡി. 2–3 നൂറ്റാണ്ടുകൾ.
    Didache:
      display_name: ദിദാഖെ
      author: അജ്ഞാതൻ (ശീർഷകത്തിന്റെ അർഥം "പന്ത്രണ്ട് അപ്പൊസ്തലന്മാരുടെ ഉപദേശം" എന്നാണ്).
      audience: ആദ്യകാല ക്രൈസ്തവസഭകൾക്കായി—ധാർമികജീവിതം, സ്നാനം, കർത്തൃഭോജനം, സഞ്ചരിക്കുന്ന ഉപദേഷ്ടാക്കൾ എന്നിവയെക്കുറിച്ചുള്ള ഒരു സംക്ഷിപ്ത മാർഗദർശിക.
      date: ഏകദേശം എ.ഡി. ഒന്നാം നൂറ്റാണ്ടിന്റെ അവസാനം മുതൽ രണ്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭം വരെ.
    Gospel of Thomas:
      display_name: തോമസിന്റെ സുവിശേഷം
      author: അജ്ഞാതൻ; ആമുഖവാക്യം ഈ വചനസമാഹാരം "ദിദിമോസ് യൂദാസ് തോമസ്" എഴുതിയതാണെന്ന് പറയുന്നു. നാഗ് ഹമ്മാദിയിൽനിന്നുള്ള നാലാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് പരിഭാഷയിൽ (NHC II,2) മാത്രമാണ് ഇത് പൂർണരൂപത്തിൽ നിലനിൽക്കുന്നത്; ഓക്സിറിങ്കസിൽനിന്നുള്ള മൂന്ന് ഗ്രീക്ക് ശകലങ്ങളും ലഭ്യമാണ്.
      audience: സുറിയാനി ജ്ഞാനപാരമ്പര്യവും ആദിമ ജ്ഞാനവാദചിന്തയും സ്വാധീനിച്ച, യേശുവിന്റെ വചനങ്ങളിലൂടെ നിഗൂഢമായ ആത്മജ്ഞാനത്തിലേക്ക് അഭിമുഖമായ ക്രൈസ്തവ വായനക്കാർ.
      date: ഗ്രീക്ക് മൂലരചന മിക്കവാറും ഏകദേശം എ.ഡി. 50–140; കോപ്റ്റിക് കൈയെഴുത്തുപ്രതി ഏകദേശം എ.ഡി. 340.
      summary: തോമസിന്റെ സുവിശേഷം യേശുവിന്റേതായി പറയപ്പെടുന്ന വചനങ്ങളുടെ ഒരു സമാഹാരമാണ്. തുടർച്ചയായ കഥ ഇതിലില്ല; വചനങ്ങളുടെ അർഥം കണ്ടെത്താൻ അത് വായനക്കാരെ ആവർത്തിച്ചു ക്ഷണിക്കുന്നു.
  chapter_titles:
    2 Baruch:
      '72':
        title: പ്രകാശമുള്ള ജലങ്ങൾ മശീഹയുടെ കാലത്തെ അടയാളപ്പെടുത്തുന്നു
      '73':
        title: സമാധാനയുഗം എല്ലാ കലഹവും അവസാനിപ്പിക്കുന്നു
      '74':
        title: നിർമാതാക്കൾ സമാധാനത്തിൽ വിളവെടുക്കുന്നു
      '75':
        title: ബാരൂക്ക് ദൈവത്തിന്റെ കരുണയെ സ്തുതിക്കുന്നു
      '76':
        title: ജനം ബാരൂക്കിന്റെ ഉപദേശം തേടുന്നു
      '77':
        title: ബാരൂക്ക് ജനത്തെ ന്യായപ്രമാണം ഓർമിപ്പിക്കുന്നു
      '78':
        title: ബാരൂക്ക് പ്രവാസികൾക്ക് പ്രത്യാശയുടെ സന്ദേശം എഴുതുന്നു
      '79':
        title: സ്രഷ്ടാവിന്റെ സ്നേഹം മാറ്റമില്ലാതെ നിലനിൽക്കുന്നു
      '80':
        title: നെബൂഖദ്നേസറിന്റെ ആക്രമണം മുൻനിശ്ചയിക്കപ്പെട്ടത്
      '81':
        title: ദുരിതമനുഭവിക്കുന്നവർക്ക് ദൈവകരുണ സമീപം
      '82':
        title: ദുഷ്ടജനതകൾ ന്യായവിധി നേരിടുന്നു
      '83':
        title: മോശയും യിരെമ്യാവും ന്യായവിധികളെക്കുറിച്ച് മുന്നറിയിപ്പു നൽകി
      '84':
        title: ന്യായപ്രമാണം ഓർക്കാൻ ബാരൂക്ക് ആഹ്വാനം ചെയ്യുന്നു
      '85':
        title: അവസാനം അടുത്തിരിക്കുന്നു; കല്പനകൾ സ്വീകരിക്കുക
      '86':
        title: കൂടിവരവുകളിൽ കത്ത് ഉറക്കെ വായിക്കുക
      '87':
        title: പഠിപ്പിച്ച കല്പനകൾ മുറുകെപ്പിടിക്കുക
    2 Esdras:
      '1':
        title: ഇസ്രായേലിന്റെ തിരസ്കാരത്തെക്കുറിച്ച് ദൈവം വിലപിക്കുന്നു
      '2':
        title: എസ്രാ ഭാവിയിലെ മഹത്ത്വം കാണുന്നു
      '3':
        title: ഇസ്രായേലിന്റെ ചരിത്രം അനുസ്മരിച്ച് എസ്രാ പ്രാർഥിക്കുന്നു
      '4':
        title: എസ്രായുടെ പരിമിതികൾ ഊരീയേൽ പഠിപ്പിക്കുന്നു
      '5':
        title: വരാനിരിക്കുന്ന ഭീതിക്കിടെ എസ്രാ അപേക്ഷിക്കുന്നു
      '6':
        title: സൃഷ്ടിയുടെ ദിവസങ്ങൾ അനുസ്മരിച്ച് എസ്രാ പ്രാർഥിക്കുന്നു
      '7':
        title: എസ്രാ അന്തിമന്യായവിധി കാണുന്നു
      '8':
        title: ഗ്രാഹ്യത്തിനായി എസ്രാ പ്രാർഥിക്കുന്നു
      '9':
        title: സീയോന്റെ ഭാവിമഹത്ത്വം എസ്രാ കാണുന്നു
      '10':
        title: എസ്രാ സീയോന്റെ മഹത്ത്വം കാണുന്നു
      '11':
        title: കഴുകനെക്കുറിച്ചുള്ള സ്വപ്നങ്ങൾ അന്ത്യത്തെ മുൻകൂട്ടി സൂചിപ്പിക്കുന്നു
      '12':
        title: സിംഹത്തെയും കഴുകന്മാരെയും കുറിച്ച് എസ്രാ സ്വപ്നം കാണുന്നു
      '13':
        title: കടലിൽനിന്നുള്ള മനുഷ്യൻ സൃഷ്ടിയെ വിടുവിക്കുന്നു
      '14':
        title: കർത്താവ് പറഞ്ഞ വിശ്വസ്ത വചനങ്ങൾ
      '15':
        title: വരാനിരിക്കുന്ന ന്യായവിധിയെക്കുറിച്ച് പ്രവാചകൻ മുന്നറിയിപ്പു നൽകുന്നു
      '16':
        title: ദൈവത്തിന്റെ ന്യായവിധികൾ ഭൂമിയെയും കടലിനെയും കുലുക്കുന്നു
    Didache:
      '1':
        title: ദൈവത്തെ സ്നേഹിച്ച് ജീവന്റെ വഴി തിരഞ്ഞെടുക്കുക
      '2':
        title: തിന്മ ഒഴിവാക്കി കല്പനകൾ അനുസരിക്കുക
      '3':
        title: തിന്മയുടെ എല്ലാ രൂപത്തിൽനിന്നും ഓടിയകലുക
      '4':
        title: ദൈവവചനത്തെ എപ്പോഴും ആദരിക്കുക
      '5':
        title: മരണത്തിന്റെ വഴി പാപത്തിലേക്കു നയിക്കുന്നു
      '6':
        title: ഒന്നും കൂട്ടിച്ചേർക്കാതെ ഉപദേശം അനുസരിക്കുക
      '7':
        title: ഒഴുകുന്ന വെള്ളത്തിൽ വിശ്വസ്തതയോടെ സ്നാനം നൽകുക
      '8':
        title: നീതിമാനായ പിതാവിനോടു പ്രാർഥിക്കുക
      '9':
        title: പാനപാത്രത്തിനും അപ്പത്തിനുംവേണ്ടി നന്ദി അർപ്പിക്കുക
      '10':
        title: പരിശുദ്ധ പിതാവിന് നന്ദി അർപ്പിക്കുന്നു
      '11':
        title: യഥാർഥ ഉപദേഷ്ടാക്കളെയും പ്രവാചകന്മാരെയും സ്വീകരിക്കുക
      '12':
        title: യാത്രക്കാരെ സഹായിക്കുക, എന്നാൽ അവരെ പരിശോധിക്കുക
      '13':
        title: യഥാർഥ പ്രവാചകന്മാരെയും ഉപദേഷ്ടാക്കളെയും പിന്തുണയ്ക്കുക
      '14':
        title: അപ്പം നുറുക്കുന്നതിനുമുമ്പ് പാപങ്ങൾ ഏറ്റുപറയുക
      '15':
        title: യോഗ്യരായ മേൽവിചാരകന്മാരെയും ശുശ്രൂഷകരെയും നിയമിക്കുക
      '16':
        title: ജാഗരൂകരായിരിക്കുക; വിശ്വാസം പരീക്ഷകളിൽ നിലനിൽക്കും
    Gospel of Thomas:
      '0':
        title: യേശുവിന്റെ നിഗൂഢവചനങ്ങൾ തോമസ് എഴുതുന്നു
      '1':
        title: യേശു നിഗൂഢജ്ഞാനം പഠിപ്പിക്കുന്നു
      '2':
        title: രാജ്യം നിങ്ങളുടെ അകത്തും പുറത്തും
      '3':
        title: രാജ്യം അകത്തും പുറത്തും
      '4':
        title: യേശു വിനയത്തിന്റെ ജ്ഞാനം പഠിപ്പിക്കുന്നു
      '5':
        title: യേശു രഹസ്യങ്ങളെക്കുറിച്ച് സംസാരിക്കുന്നു
      '6':
        title: മനുഷ്യൻ തിന്നുന്ന സിംഹം അനുഗൃഹീതമാണ്
      '7':
        title: ജ്ഞാനിയായ മീൻപിടിത്തക്കാരൻ വലിയ മീൻ തിരഞ്ഞെടുക്കുന്നു
      '8':
        title: ജ്ഞാനിയായ മീൻപിടിത്തക്കാരൻ വലിയത് തിരഞ്ഞെടുക്കുന്നു
      '9':
        title: വിതക്കാരൻ വിത്ത് എല്ലായിടത്തും വിതറുന്നു
      '10':
        title: ജ്വലിക്കുന്ന തീയെ യേശു കാത്തുസൂക്ഷിക്കുന്നു
      '11':
        title: കടന്നുപോകുന്നതിനെക്കുറിച്ച് യേശു സംസാരിക്കുന്നു
      '12':
        title: യാക്കോബ് ശിഷ്യന്മാരെ നയിക്കും
      '13':
        title: ഉപവാസം, പ്രാർഥന, ദാനധർമം എന്നിവ പാപം
      '14':
        title: യേശു യഥാർഥ ഭക്തി പഠിപ്പിക്കുന്നു
      '15':
        title: നിങ്ങളുടെ പിതാവായവനെ ആരാധിക്കുക
      '16':
        title: ഭിന്നതയെക്കുറിച്ച് യേശു സംസാരിക്കുന്നു
      '17':
        title: ആരംഭം കണ്ടെത്തുന്നവൻ അനുഗൃഹീതൻ
      '18':
        title: യേശു ആരംഭവും അവസാനവും വിശദീകരിക്കുന്നു
