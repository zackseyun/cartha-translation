payload:
  book_metadata:
    James:
      display_name: യാക്കോബ്
      author: പരമ്പരാഗതമായി യേശുവിന്റെ സഹോദരനായ യാക്കോബ്; ഇത് അദ്ദേഹത്തിന്റെ സ്വന്തം രചനയാണോ മറ്റൊരാൾ അദ്ദേഹത്തിന്റെ പേരിൽ എഴുതിയതാണോ എന്ന കാര്യത്തിൽ ആധുനിക പണ്ഡിതന്മാർക്കിടയിൽ അഭിപ്രായഭിന്നതയുണ്ട്.
      audience: പ്രവാസദേശങ്ങളിലെ യഹൂദ-ക്രിസ്തീയ സഭകൾ.
      date: അദ്ദേഹത്തിന്റെ സ്വന്തം രചനയാണെങ്കിൽ ഏകദേശം ക്രി.വ. 50–60-കൾ; മറ്റൊരാൾ അദ്ദേഹത്തിന്റെ പേരിൽ എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. ഒന്നാം നൂറ്റാണ്ടിന്റെ അവസാനം.
    1 Peter:
      display_name: 1 പത്രോസ്
      author: പരമ്പരാഗതമായി ശീലാസിനെ എഴുത്തുകാരനായി ഉപയോഗിച്ച അപ്പൊസ്തലനായ പത്രോസ്; ചില പണ്ഡിതന്മാർ ഇത് മറ്റൊരാൾ പത്രോസിന്റെ പേരിൽ എഴുതിയതാണെന്ന് കരുതുന്നു.
      audience: സാമൂഹികമായ എതിർപ്പ് നേരിട്ടിരുന്ന റോമൻ ഏഷ്യാമൈനറിലെ ക്രിസ്ത്യാനികൾ.
      date: പത്രോസ് എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 60-കൾ; മറ്റൊരാൾ അദ്ദേഹത്തിന്റെ പേരിൽ എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 70–90-കൾ.
    2 Peter:
      display_name: 2 പത്രോസ്
      author: പരമ്പരാഗതമായി പത്രോസ്; മറ്റൊരാൾ പത്രോസിന്റെ പേരിൽ എഴുതിയതാണെന്നാണ് ആധുനിക പണ്ഡിതന്മാരിൽ പലരും കരുതുന്നത്.
      audience: ക്രിസ്തുവിന്റെ പുനരാഗമനത്തെ നിഷേധിക്കുന്ന പരിഹാസികളെ നേരിട്ടിരുന്ന ക്രിസ്ത്യാനികൾ.
      date: ഏകദേശം ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭം.
    1 John:
      display_name: 1 യോഹന്നാൻ
      author: രചയിതാവ് അജ്ഞാതൻ; പരമ്പരാഗതമായി അപ്പൊസ്തലനായ യോഹന്നാനോ യോഹന്നാനീയ മൂപ്പനോ എന്ന് കരുതപ്പെടുന്നു.
      audience: ഒരു പിളർപ്പിനുശേഷം ആരാണ് തങ്ങളുടെ കൂട്ടത്തിൽ ഉൾപ്പെടുന്നതെന്ന് നിർവചിച്ചുകൊണ്ടിരുന്ന യോഹന്നാനീയ സമൂഹം.
      date: ഏകദേശം ക്രി.വ. 90–110.
    2 John:
      display_name: 2 യോഹന്നാൻ
      author: “മൂപ്പൻ.”
      audience: വ്യാജ അധ്യാപകരെക്കുറിച്ച് മുന്നറിയിപ്പു ലഭിക്കുന്ന ഒരു പ്രത്യേക ക്രിസ്തീയ സഭ (“തിരഞ്ഞെടുക്കപ്പെട്ട സ്ത്രീ”).
      date: ഏകദേശം ക്രി.വ. 90–110.
    3 John:
      display_name: 3 യോഹന്നാൻ
      author: “മൂപ്പൻ.”
      audience: സഞ്ചാരികളായ മിഷനറിമാർക്ക് ആതിഥ്യമരുളിയിരുന്ന വ്യക്തിഗത നേതാവായ ഗായൊസ്.
      date: ഏകദേശം ക്രി.വ. 90–110.
    Jude:
      display_name: യൂദാ
      author: പരമ്പരാഗതമായി യാക്കോബിന്റെയും യേശുവിന്റെയും സഹോദരനായ യൂദാ.
      audience: ധാർമിക നിയന്ത്രണങ്ങളെ നിരസിച്ചിരുന്ന അധ്യാപകർ നുഴഞ്ഞുകയറിയ ക്രിസ്തീയ സമൂഹങ്ങൾ.
      date: ഏകദേശം ക്രി.വ. 60–90-കൾ.
    Revelation:
      display_name: വെളിപ്പാട്
      author: പത്മൊസിലെ യോഹന്നാൻ (നാലാമത്തെ സുവിശേഷത്തിൽനിന്ന് വ്യത്യസ്തമായ രചനാശൈലിയുള്ളത്).
      audience: സാമ്രാജ്യത്വ സമ്മർദത്തിൻ കീഴിലായിരുന്ന റോമൻ ഏഷ്യാമൈനറിലെ ഏഴ് ക്രിസ്തീയ സഭകൾ.
      date: ഏകദേശം ക്രി.വ. 90-കൾ; പരമ്പരാഗതമായി ദൊമീഷ്യന്റെ ഭരണകാലത്ത്.
    Tobit:
      display_name: തോബിത്
      author: രചയിതാവ് അജ്ഞാതൻ.
      audience: വിദേശഭരണത്തിൻ കീഴിൽ ഭക്തി, വിവാഹം, ദൈവപരിപാലനം എന്നിവയുമായി ബന്ധപ്പെട്ട ജീവിതം നയിച്ചിരുന്ന പ്രവാസി യഹൂദർ.
      date: ഏകദേശം ക്രി.മു. 225–175; അരമായ ഭാഷയിൽ രചിക്കപ്പെട്ടത്; ഇതിന്റെ ഒരു എബ്രായ പതിപ്പും കുമ്രാനിൽനിന്ന് ലഭിച്ചിട്ടുണ്ട്.
    Judith:
      display_name: യൂദിത്ത്
      author: രചയിതാവ് അജ്ഞാതൻ.
      audience: വിദേശഭീഷണിയിലായിരുന്ന യഹൂദർ—ഭക്തിയോടെയുള്ള ധീരമായ ചെറുത്തുനിൽപ്പിന്റെ കഥ.
      date: ഏകദേശം ക്രി.മു. 150–100.
    Greek Additions to Esther:
      display_name: എസ്ഥേറിനുള്ള ഗ്രീക്ക് കൂട്ടിച്ചേർക്കലുകൾ
      author: രചയിതാവ് അജ്ഞാതൻ; എസ്ഥേറിന്റെ ഗ്രീക്ക് പരിഭാഷയിൽ ചേർത്ത അനുബന്ധഭാഗങ്ങൾ.
      audience: പ്രാർഥനയും ദൈവത്തെക്കുറിച്ചുള്ള വ്യക്തമായ പരാമർശങ്ങളും ഉൾപ്പെടുന്ന എസ്ഥേറിന്റെ കഥ ആഗ്രഹിച്ച ഗ്രീക്ക് സംസാരിച്ചിരുന്ന യഹൂദർ.
      date: ഏകദേശം ക്രി.മു. രണ്ടാം–ഒന്നാം നൂറ്റാണ്ടുകൾ.
    Wisdom of Solomon:
      display_name: ശലോമോന്റെ ജ്ഞാനം
      author: രചയിതാവ് അജ്ഞാതൻ; ശലോമോന്റെ പേരിൽ എഴുതപ്പെട്ടതായി കണക്കാക്കപ്പെടുന്നു. ഗ്രീക്കിൽ രചിച്ചത് ഹെല്ലനിസ്റ്റിക് യഹൂദനായ ഒരു എഴുത്തുകാരനാണ്; സാധ്യതയനുസരിച്ച് അലക്സാണ്ട്രിയയിൽവെച്ച്.
      audience: ഗ്രീക്ക് തത്ത്വചിന്തയുമായി സംവദിക്കുകയും വിജാതീയവും വിശ്വാസത്യാഗപരവുമായ ബദലുകൾക്കെതിരെ ഇസ്രായേലിന്റെ ജ്ഞാനത്തെ ന്യായീകരിക്കുകയും ചെയ്തിരുന്ന ഹെല്ലനിസ്റ്റിക് യഹൂദർ.
      date: ഏകദേശം ക്രി.മു. 50–ക്രി.വ. 50.
  chapter_titles:
    Hebrews:
      '11':
        title: പൂർവികരുടെ വിശ്വാസം നിലനിൽക്കുന്നു
      '12':
        title: യേശുവിനോടൊപ്പം കഷ്ടത സഹിക്കുക
      '13':
        title: സ്നേഹത്തിലും വിശ്വാസത്തിലും ജീവിക്കുക
    James:
      '1':
        title: പരീക്ഷണങ്ങളാൽ തെളിയിക്കപ്പെട്ട വിശ്വാസം നിലനിൽക്കുന്നു
      '2':
        title: പ്രവൃത്തികളില്ലാത്ത വിശ്വാസം നിർജീവമാണ്
      '3':
        title: നാവിനെ നിയന്ത്രിച്ച് ജ്ഞാനത്തോടെ സംസാരിക്കുക
      '4':
        title: സ്വാർഥതയിൽനിന്ന് കലഹങ്ങൾ ഉണ്ടാകുന്നു
      '5':
        title: ധനികരായ പീഡകരുടെ ന്യായവിധി അടുത്തിരിക്കുന്നു
    1 Peter:
      '1':
        title: സ്വർഗീയ അവകാശത്തിലുള്ള പ്രത്യാശ
      '2':
        title: ജീവനുള്ള കല്ലിന്മേൽ പണിയപ്പെടുന്ന വിശ്വാസികൾ
      '3':
        title: ഭാര്യമാർ ജീവിതത്തിലൂടെ ക്രിസ്തുവിനെ ആദരിക്കുന്നു
      '4':
        title: നന്മ ചെയ്യുന്നതിനാൽ കഷ്ടം സഹിക്കുക
      '5':
        title: മാതൃകയിലൂടെ വിശ്വസ്തതയോടെ മൂപ്പന്മാർ പരിപാലിക്കുന്നു
    2 Peter:
      '1':
        title: ആത്മീയ വളർച്ചയെക്കുറിച്ച് പത്രോസ് പഠിപ്പിക്കുന്നു
      '2':
        title: വ്യാജ അധ്യാപകർ പെട്ടെന്നുള്ള ന്യായവിധി വരുത്തുന്നു
      '3':
        title: അന്തിമ ന്യായവിധിയെക്കുറിച്ച് പത്രോസ് മുന്നറിയിപ്പു നൽകുന്നു
    1 John:
      '1':
        title: വെളിച്ചം യഥാർഥ കൂട്ടായ്മ വെളിപ്പെടുത്തുന്നു
      '2':
        title: സ്നേഹം ദൈവത്തിന്റെ കല്പനകൾ പാലിക്കുന്നു
      '3':
        title: ദൈവത്തിൽനിന്നു ജനിച്ചവർ പാപത്തെ ജയിക്കുന്നു
      '4':
        title: യഥാർഥ സ്നേഹം ദൈവത്തിൽനിന്നു വരുന്നു
      '5':
        title: യേശുവിൽ വിശ്വസിക്കുന്നവർക്ക് നിത്യജീവനുണ്ട്
    2 John:
      '1':
        title: വ്യാജ അധ്യാപകരെക്കുറിച്ച് മൂപ്പൻ മുന്നറിയിപ്പു നൽകുന്നു
    3 John:
      '1':
        title: ഗായൊസിന്റെ ക്ഷേമത്തിനായി മൂപ്പൻ പ്രാർഥിക്കുന്നു
    Jude:
      '1':
        title: ഭക്തിഹീനരായ നുഴഞ്ഞുകയറ്റക്കാരെക്കുറിച്ച് യൂദാ മുന്നറിയിപ്പു നൽകുന്നു
    Revelation:
      '1':
        title: ദൈവം യോഹന്നാന് ദർശനങ്ങൾ കാണിക്കുന്നു
      '2':
        title: യേശു ഏഴ് സഭകളോടു സംസാരിക്കുന്നു
      '3':
        title: മാനസാന്തരപ്പെടാൻ ലവൊദിക്യയ്ക്ക് യേശുവിന്റെ മുന്നറിയിപ്പ്
      '4':
        title: സ്വർഗത്തിലെ സിംഹാസനം മഹത്ത്വത്തിൽ തിളങ്ങുന്നു
      '5':
        title: കുഞ്ഞാട് ചുരുൾ ഏറ്റുവാങ്ങി വീണ്ടെടുക്കുന്നു
      '6':
        title: നാല് കുതിരച്ചേവകർ വലിയ ദുരിതങ്ങൾ വരുത്തുന്നു
      '7':
        title: മുദ്രയേറ്റ ദാസർ നിത്യസ്തുതി പാടുന്നു
      '8':
        title: ഏഴ് കാഹളങ്ങൾ മുഴങ്ങുമ്പോൾ ഭയാനകമായ ന്യായവിധികൾ വരുന്നു
      '9':
        title: വെട്ടുക്കിളികൾ ഭൂമിയിലെ പാപികളെ പീഡിപ്പിക്കുന്നു
      '10':
