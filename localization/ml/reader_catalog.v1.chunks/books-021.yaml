payload:
  book_metadata:
    Thunder, Perfect Mind:
      display_name: ഇടിമുഴക്കം, പൂർണ മനസ്സ്
      author: അജ്ഞാതൻ.
      audience: ഗ്രീക്കോ-ഈജിപ്ഷ്യൻ ജ്ഞാനസാഹിത്യത്തിലോ ജ്ഞാനവാദത്തിലോ താത്പര്യമുള്ള വായനക്കാർ; ദിവ്യയായ ഒരു സ്ത്രീരൂപത്തിന്റെ ശബ്ദത്തിലുള്ള, ലിംഗസ്വത്വം എടുത്തുകാട്ടുന്ന സ്വയംവെളിപ്പെടുത്തൽ കവിത.
      date: സാധ്യതയനുസരിച്ച് ക്രി.വ. 1–2 നൂറ്റാണ്ടുകൾ; നാഗ് ഹമ്മാദിയിൽ (NHC VI,2) സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
    Testament of Reuben:
      display_name: രൂബേന്റെ നിയമപത്രം
      author: അജ്ഞാതൻ; യാക്കോബിന്റെ പുത്രന്മാരുടെ മരണശയ്യയിലെ പ്രസംഗങ്ങളായി അവതരിപ്പിക്കപ്പെടുന്ന പന്ത്രണ്ട് ഗോത്രപിതാക്കന്മാരുടെ നിയമപത്രങ്ങളുടെ ഭാഗം.
      audience: ഗോത്രപിതാക്കന്മാരുടെ പാപസമ്മതങ്ങളിൽനിന്ന് ധാർമ്മികപാഠങ്ങൾ അഭ്യസിക്കുന്ന യഹൂദ വായനക്കാരും (പിന്നീട്) ക്രൈസ്തവ വായനക്കാരും.
      date: ക്രൈസ്തവപൂർവ യഹൂദ മൂലരൂപം ഏകദേശം ക്രി.മു. 2-ാം നൂറ്റാണ്ടിലേതായിരിക്കാം; ക്രൈസ്തവ പത്രാധിപത്യപാളി ഏകദേശം ക്രി.വ. 1–2 നൂറ്റാണ്ടുകളിലേത്.
    Testament of Simeon:
      display_name: ശിമയോന്റെ നിയമപത്രം
      author: അജ്ഞാതൻ; പന്ത്രണ്ട് ഗോത്രപിതാക്കന്മാരുടെ നിയമപത്രങ്ങളുടെ ഭാഗം.
      audience: യഹൂദ വായനക്കാരും (പിന്നീട്) ക്രൈസ്തവ വായനക്കാരും.
      date: യഹൂദ മൂലരൂപം ഏകദേശം ക്രി.മു. 2-ാം നൂറ്റാണ്ടിലേത്; ക്രൈസ്തവ സംശോധനം ഏകദേശം ക്രി.വ. 1–2 നൂറ്റാണ്ടുകളിലേത്.
    Testament of Levi:
      display_name: ലേവിയുടെ നിയമപത്രം
      author: അജ്ഞാതൻ; പന്ത്രണ്ട് ഗോത്രപിതാക്കന്മാരുടെ നിയമപത്രങ്ങളുടെ ഭാഗം.
      audience: യഹൂദ വായനക്കാരും (പിന്നീട്) ക്രൈസ്തവ വായനക്കാരും; പ്രത്യേകിച്ച് പൗരോഹിത്യത്തിൽ താത്പര്യമുള്ള സമൂഹങ്ങൾ.
      date: യഹൂദ മൂലരൂപം ഏകദേശം ക്രി.മു. 2-ാം നൂറ്റാണ്ടിലേത്; ക്രൈസ്തവ സംശോധനം ഏകദേശം ക്രി.വ. 1–2 നൂറ്റാണ്ടുകളിലേത്.
    Testament of Judah:
      display_name: യൂദായുടെ നിയമപത്രം
      author: അജ്ഞാതൻ; പന്ത്രണ്ട് ഗോത്രപിതാക്കന്മാരുടെ നിയമപത്രങ്ങളുടെ ഭാഗം.
      audience: യഹൂദ വായനക്കാരും (പിന്നീട്) ക്രൈസ്തവ വായനക്കാരും.
      date: യഹൂദ മൂലരൂപം ഏകദേശം ക്രി.മു. 2-ാം നൂറ്റാണ്ടിലേത്; ക്രൈസ്തവ സംശോധനം ഏകദേശം ക്രി.വ. 1–2 നൂറ്റാണ്ടുകളിലേത്.
    Testament of Issachar:
      display_name: യിസ്സാഖാരിന്റെ നിയമപത്രം
      author: അജ്ഞാതൻ; പന്ത്രണ്ട് ഗോത്രപിതാക്കന്മാരുടെ നിയമപത്രങ്ങളുടെ ഭാഗം.
      audience: യഹൂദ വായനക്കാരും (പിന്നീട്) ക്രൈസ്തവ വായനക്കാരും.
      date: യഹൂദ മൂലരൂപം ഏകദേശം ക്രി.മു. 2-ാം നൂറ്റാണ്ടിലേത്; ക്രൈസ്തവ സംശോധനം ഏകദേശം ക്രി.വ. 1–2 നൂറ്റാണ്ടുകളിലേത്.
  chapter_titles:
    Shepherd of Hermas:
      '47':
        title: ഹെർമാസ് യഥാർഥ നഗരം തിരഞ്ഞെടുക്കുന്നു
      '48':
        title: സമ്പത്ത് സേവനത്തിനുള്ള കടമ കൊണ്ടുവരുന്നു
      '49':
        title: പങ്കിടുന്ന സമ്പത്ത് പൂർണത നൽകുന്നു
      '50':
        title: ഹെർമാസ് ഉപവാസത്തെ തെറ്റായി മനസ്സിലാക്കുന്നു
      '51':
        title: ഹെർമാസ് ഗ്രാഹ്യം തേടുന്നു
      '52':
        title: ഉപമയുടെ അർഥം ഹെർമാസിനെ പഠിപ്പിക്കുന്നു
      '53':
        title: ഹെർമാസ് ശരീരത്തെയും ആത്മാവിനെയും ശുദ്ധീകരിക്കുന്നു
      '54':
        title: സുഖലോലുപരായ ആടുകളെ മേയ്ക്കുന്ന ഇടയന്മാരെ കാണുക
      '55':
        title: കർശനനായ ഇടയൻ സുഖലോലുപരായ ആടുകളെ ശിക്ഷണത്തിലാക്കുന്നു
      '56':
        title: അലഞ്ഞുതിരിയുന്ന ആടുകളെ ഇടയൻ ശിക്ഷിക്കുന്നു
      '57':
        title: സുഖലോലുപത കനത്ത ശിക്ഷ വരുത്തുന്നു
      '58':
        title: ശിക്ഷയുടെ ദൈർഘ്യത്തെക്കുറിച്ച് ഹെർമാസ് ചോദിക്കുന്നു
      '59':
        title: ആശ്വാസത്തിനായി ഹെർമാസ് പ്രാർഥിക്കുന്നു
      '60':
        title: മാനസാന്തരത്തിന് വിനയപൂർവമായ ശിക്ഷണവും സഹനവും വേണം
      '61':
        title: ഫലമുള്ളവരെ ദൂതൻ കിരീടമണിയിക്കുന്നു
      '62':
        title: വൃക്ഷം ദൈവത്തിന്റെ നിയമത്തെ പ്രതിനിധീകരിക്കുന്നു
      '63':
        title: വീണ്ടും നട്ട വടികളെ ഇടയൻ വേർതിരിക്കുന്നു
    Thunder, Perfect Mind:
      '1':
        title: അന്വേഷകരോടു സംസാരിക്കുന്ന ഇടിമുഴക്കം
      '2':
        title: ആദ്യത്തേതും അവസാനത്തേതും കന്യകയും ഞാൻ
      '3':
        title: അറിവും അജ്ഞതയും ഒന്നിക്കുന്നു
      '4':
        title: ഭയവും ശക്തിയും എന്നിൽ
      '5':
        title: അവൾ വെറുക്കപ്പെട്ടു, സ്നേഹിക്കപ്പെട്ടു, മരണമെന്ന് വിളിക്കപ്പെട്ടു
      '6':
        title: മനസ്സും വിശ്രമവും എന്നിൽ
      '7':
        title: എന്നിലൂടെ സമാധാനം യുദ്ധം കൊണ്ടുവരുന്നു
      '8':
        title: കേൾക്കപ്പെടുന്ന ശബ്ദത്തിനുള്ളിലെ നിശ്ശബ്ദത
      '9':
        title: നീതിയും വക്താവും ഞാൻ
      '10':
        title: സ്രഷ്ടാവിന്റെ നാമം ഞാൻ വിളിച്ചുപറയുന്നു
      '11':
        title: സഹനവും ക്ഷമയും വരുന്നു
    Testament of Reuben:
      '1':
        title: പാപത്തിന്റെ പിടിയെക്കുറിച്ച് രൂബേൻ മുന്നറിയിപ്പു നൽകുന്നു
      '2':
        title: ഏഴ് ആത്മാക്കൾ മനുഷ്യരെ നിയന്ത്രിക്കുന്നു
      '3':
        title: ഏഴ് തെറ്റുകൾ യുവാക്കളെ ബന്ധിച്ചിടുന്നു
      '4':
        title: കാമവും വിഗ്രഹാരാധനയും ഇപ്പോൾത്തന്നെ ഒഴിവാക്കുക
      '5':
        title: സ്ത്രീകൾ പ്രലോഭനംകൊണ്ട് കെണിയിലാക്കുന്നു
      '6':
        title: ബെലിയാറിന്റെ കെണികളിൽനിന്ന് മനസ്സിനെ കാക്കുക
      '7':
        title: രൂബേന്റെ അസ്ഥികൾ സ്വദേശത്തേക്കു മടങ്ങുന്നു
    Testament of Simeon:
      '1':
        title: സാക്ഷ്യം പറയാൻ ശിമയോൻ പുത്രന്മാരെ കൂട്ടിവരുത്തുന്നു
      '2':
        title: അസൂയാപൂർവമായ ഗൂഢാലോചനകളെക്കുറിച്ച് ശിമയോൻ അനുതപിക്കുന്നു
      '3':
        title: അസൂയയുടെ ആത്മാവിനോടു ശിമയോൻ പോരാടുന്നു
      '4':
        title: യോസേഫ് കരുണ കാണിക്കുന്നു; ശിമയോൻ മുന്നറിയിപ്പു നൽകുന്നു
      '5':
        title: വിശുദ്ധി സൗന്ദര്യം നൽകുന്നു; പാപം നിരസിക്കുക
      '6':
        title: തിന്മ നിരസിച്ച് വിശുദ്ധിയിൽ തഴച്ചുവളരുക
      '7':
        title: ഭാവിയിലെ രാജാവിനെക്കുറിച്ച് ശിമയോൻ പ്രവചിക്കുന്നു
      '8':
        title: ശിമയോൻ മരിക്കുന്നു; അസ്ഥികൾ ഹെബ്രോനിലേക്കു കൊണ്ടുപോകുന്നു
      '9':
        title: ശിമയോനെക്കുറിച്ച് വിലപിച്ച് പുറപ്പാടിനായി കാത്തിരിക്കുക
    Testament of Levi:
      '1':
        title: തന്റെ മരണത്തെക്കുറിച്ച് ലേവി പ്രവചിക്കുന്നു
      '2':
        title: സ്വർഗത്തിലെ ദുഷിപ്പ് ലേവി കാണുന്നു
      '3':
        title: ദൈവക്രോധത്തിൽ സ്വർഗങ്ങൾ വിറയ്ക്കുന്നു
      '4':
        title: വിശുദ്ധ ശുശ്രൂഷയ്ക്കായി ലേവി തിരഞ്ഞെടുക്കപ്പെടുന്നു
      '5':
        title: പ്രതികാരത്തിനായി ദൂതൻ ലേവിയെ ആയുധമണിയിക്കുന്നു
      '6':
        title: കൂട്ടക്കൊലയുടെ ക്രോധത്തിന് ലേവി പ്രായശ്ചിത്തം ചെയ്യുന്നു
      '7':
        title: ലേവിയുടെ വാളാൽ ശെഖേം ശപിക്കപ്പെടുന്നു
      '8':
        title: ദൂതന്മാർ ലേവിയെ പൗരോഹിത്യത്തിലേക്ക് അഭിഷേകം ചെയ്യുന്നു
      '9':
        title: നിയമങ്ങളിൽ യിസ്ഹാക്ക് ലേവിയെ പരിശീലിപ്പിക്കുന്നു
      '10':
        title: ഭാവിയിലെ ദുഷ്ടതയെക്കുറിച്ച് ലേവി മുന്നറിയിപ്പു നൽകുന്നു
      '11':
        title: പ്രവചനത്തോടുകൂടെ ലേവി പുത്രന്മാർക്കു പേരിടുന്നു
      '12':
        title: ലേവി തന്റെ വംശാവലികൾ രേഖപ്പെടുത്തുന്നു
      '13':
        title: ദൈവത്തിന്റെ നിയമത്തെ ഭയഭക്തിയോടെ പാലിക്കാൻ ലേവി കൽപ്പിക്കുന്നു
      '14':
        title: പുരോഹിതന്മാർ തങ്ങളുടെ വിളിയെ വഞ്ചിക്കും
      '15':
