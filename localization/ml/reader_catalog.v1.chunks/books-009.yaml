chunk_id: books-009
status: reviewed
payload:
  book_metadata:
    Lamentations:
      display_name: വിലാപങ്ങൾ
      author: രചയിതാവ് അജ്ഞാതൻ; പാരമ്പര്യം ഇത് യിരെമ്യാവിന്റേതാണെന്ന് കരുതുന്നു.
      audience: ക്രി.മു. 586-ൽ യെരൂശലേം നശിച്ചതിൽ ദുഃഖിച്ചിരുന്ന യെഹൂദ്യർ.
      date: ക്രി.മു. 586-നു തൊട്ടുപിന്നാലെ.
    Ezekiel:
      display_name: യെഹെസ്കേൽ
      author: ബാബിലോണിലേക്കു പ്രവാസിയായി കൊണ്ടുപോകപ്പെട്ട പുരോഹിതനായ യെഹെസ്കേൽ; പിന്നീട് പത്രാധിപത്യപരമായ രൂപവികാസവും ഉണ്ടായിട്ടുണ്ട്.
      audience: ദൈവസാന്നിധ്യം ദേവാലയത്തിനു പുറത്തും എങ്ങനെ അനുഭവിക്കാമെന്ന് പുതുതായി ചിന്തിച്ചിരുന്ന, ബാബിലോണിലെ യെഹൂദ്യ പ്രവാസികൾ.
      date: പ്രവാചകന്റെ ശുശ്രൂഷ ഏകദേശം ക്രി.മു. 593–571; അന്തിമരൂപം കുറച്ചുകൂടി പിൽക്കാലത്തേത്.
    Daniel:
      display_name: ദാനീയേൽ
      author: രചയിതാവ് അജ്ഞാതൻ; പ്രവാസകാലത്തെ ദാനീയേലിന്റെ രചനയായാണ് പുസ്തകം സ്വയം അവതരിപ്പിക്കുന്നത്.
      audience: ഹെല്ലനിസ്റ്റിക് ഭരണകാലത്തെ പീഡനം അനുഭവിച്ച യെഹൂദർ—പ്രത്യേകിച്ച് അന്തിയോക്കസ് നാലാമൻ എപ്പിഫാനസിന്റെ കാലത്ത് (ക്രി.മു. 167–164).
      date: ലഭ്യമായിരിക്കുന്ന രൂപം ഏകദേശം ക്രി.മു. 165-ൽ കൈവരിച്ചു; 1–6 അധ്യായങ്ങളിൽ അതിലും പഴക്കമുള്ള രാജസഭാകഥകൾ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്.
    Hosea:
      display_name: ഹോശേയ
      author: ബെയേരിയുടെ മകൻ ഹോശേയ.
      audience: അശ്ശൂർ കീഴടക്കുന്നതിനു മുമ്പുള്ള അവസാന ദശകങ്ങളിലെ വടക്കൻ ഇസ്രായേൽരാജ്യം.
      date: ഏകദേശം ക്രി.മു. 750–722.
  chapter_titles:
    Jeremiah:
      '33':
        title: തകർന്ന നഗരത്തിനു സൗഖ്യം വാഗ്ദാനം ചെയ്യുന്നു
      '34':
        title: സിദെക്കീയാവിനുള്ള ന്യായവിധിയും മുന്നറിയിപ്പും
      '35':
        title: രേഖാബ്യർ വിശ്വസ്തമായി അനുസരിക്കുന്നു
      '36':
        title: ബാരൂക്ക് മുന്നറിയിപ്പിന്റെ ചുരുൾ എഴുതുന്നു
      '37':
        title: യിരെമ്യാവ് സിദെക്കീയാരാജാവിനു മുന്നറിയിപ്പു നൽകുന്നു
      '38':
        title: യിരെമ്യാവിനെ ജലസംഭരണിയിൽ എറിയുന്നു
      '39':
        title: ഏബെദ്-മേലെക്ക് യിരെമ്യാവിനെ രക്ഷിക്കുന്നു
      '40':
        title: യെരൂശലേം വീണശേഷം യിരെമ്യാവ് മോചിതനാകുന്നു
      '41':
        title: യിശ്മായേൽ വഞ്ചനയിലൂടെ ഗെദല്യാവിനെ കൊല്ലുന്നു
      '42':
        title: ഈജിപ്തിലേക്കു പലായനം ചെയ്യരുതെന്ന് യിരെമ്യാവ് മുന്നറിയിപ്പു നൽകുന്നു
      '43':
        title: മത്സരികൾ യിരെമ്യാവിനെ ബലമായി ഈജിപ്തിലേക്കു കൊണ്ടുപോകുന്നു
      '44':
        title: ദൈവകല്പന അനുസരിക്കാൻ വിസമ്മതിക്കുന്നു
      '45':
        title: ദുഃഖഭാരത്താൽ ബാരൂക്ക് തളരുന്നു
      '46':
        title: അഹങ്കാരിയായ ഈജിപ്തുസാമ്രാജ്യത്തെ ദൈവം വിധിക്കുന്നു
      '47':
        title: തടയാനാവാത്ത പ്രളയം ഫെലിസ്ത്യരെ നേരിടുന്നു
      '48':
        title: മോവാബിന്റെ നാശവും ഭാവിപ്രത്യാശയും
      '49':
        title: യെഹൂദയ്ക്കു ചുറ്റുമുള്ള ജനതകൾക്കുള്ള ന്യായവിധി
      '50':
        title: ബാബിലോൺ വീഴുന്നു; ദൈവം ജയിക്കുന്നു
      '51':
        title: ദൈവിക ന്യായവിധിയിൽ ബാബിലോൺ വീഴുന്നു
      '52':
        title: യെരൂശലേം വീഴുന്നു; ദേവാലയം കത്തിക്കപ്പെടുന്നു
    Lamentations:
      '1':
        title: ഉപേക്ഷിക്കപ്പെട്ട യെരൂശലേം ഏകാകിയായി കരയുന്നു
      '2':
        title: കർത്താവ് സീയോന്റെമേൽ ക്രോധം ചൊരിയുന്നു
      '3':
        title: പ്രഭാതംതോറുമുള്ള കരുണയിൽനിന്ന് പ്രത്യാശ ഉദിക്കുന്നു
      '4':
        title: വിലയേറിയ സീയോൻ നശിച്ച് പട്ടിണിയിലാകുന്നു
      '5':
        title: 'ജനത്തിന്റെ നിലവിളി: കർത്താവേ, കേൾക്കണമേ'
    Ezekiel:
      '1':
        title: യെഹെസ്കേൽ സ്വർഗീയ ദർശനം കാണുന്നു
      '2':
        title: യെഹെസ്കേലിന് ദൈവിക നിയോഗം ലഭിക്കുന്നു
      '3':
        title: യെഹെസ്കേൽ വിലാപങ്ങളുടെ ചുരുൾ തിന്നുന്നു
      '4':
        title: യെഹെസ്കേൽ യെരൂശലേമിന്റെ ഉപരോധം അഭിനയിച്ചു കാണിക്കുന്നു
      '5':
        title: യെഹെസ്കേൽ പ്രതീകാത്മകമായി തലമുടി ക്ഷൗരം ചെയ്യുന്നു
      '6':
        title: യെഹെസ്കേൽ ഇസ്രായേലിനെതിരെ പ്രവചിക്കുന്നു
      '7':
        title: വരാനിരിക്കുന്ന ന്യായവിധി ദൈവം പ്രഖ്യാപിക്കുന്നു
      '8':
        title: ദേവാലയത്തിലെ മ്ലേച്ഛതകൾ യെഹെസ്കേൽ കാണുന്നു
      '9':
        title: ശിക്ഷകർ യെരൂശലേമിന്റെ പാപത്തെ വിധിക്കുന്നു
      '10':
        title: മഹത്ത്വം ന്യായവിധിയുടെ തീക്കനലുകൾ വിതറുന്നു
      '11':
        title: നഗരത്തിന്റെ നാശത്തെക്കുറിച്ച് യെഹെസ്കേൽ പ്രവചിക്കുന്നു
      '12':
        title: യെഹെസ്കേൽ പ്രവാസം അഭിനയിച്ചു കാണിക്കുന്നു
      '13':
        title: യെഹെസ്കേൽ വ്യാജപ്രവാചകരെ കുറ്റംവിധിക്കുന്നു
      '14':
        title: ഇസ്രായേലിന്റെ അവിശ്വസ്തതയെ ദൈവം വിധിക്കുന്നു
      '15':
        title: യെരൂശലേമിനെ ഉപയോഗശൂന്യമായ മുന്തിരിവള്ളിയോട് ഉപമിക്കുന്നു
      '16':
        title: യെരൂശലേമിന്റെ അവിശ്വസ്തതയെക്കുറിച്ച് ദൈവം വിലപിക്കുന്നു
      '17':
        title: കഴുകന്മാരെക്കുറിച്ചുള്ള യെഹെസ്കേലിന്റെ കടങ്കഥ
      '18':
        title: ദൈവം ഓരോ വ്യക്തിയെയും വിധിക്കുന്നു
      '19':
        title: ഇസ്രായേലിന്റെ പ്രഭുക്കന്മാർ പരാജയപ്പെട്ട് വീഴുന്നു
      '20':
        title: ഇസ്രായേലിന്റെ മത്സരനിറഞ്ഞ ഭൂതകാലം ദൈവം വിവരിക്കുന്നു
      '21':
        title: ന്യായവിധിയുടെ വാൾ ജനതകൾക്കെതിരെ വരുന്നു
      '22':
        title: രക്തക്കറ പുരണ്ട നഗരമായി യെരൂശലേം തുറന്നുകാട്ടപ്പെടുന്നു
      '23':
        title: വിഗ്രഹങ്ങളെ മോഹിച്ച രണ്ടു സഹോദരിമാർ
      '24':
        title: യെഹെസ്കേലിന്റെ ഭാര്യ അടയാളമായി എടുത്തുകൊള്ളപ്പെടുന്നു
      '25':
        title: യെഹൂദയ്ക്കു ചുറ്റുമുള്ള ജനതകൾ ന്യായവിധി നേരിടുന്നു
      '26':
        title: സന്തോഷിച്ച സോരിനെ ദൈവം വിധിക്കുന്നു
      '27':
        title: പ്രതാപശാലിയായ സോരിനെക്കുറിച്ചുള്ള വിലാപഗാനം
      '28':
        title: സോരിന്റെ ഭരണാധികാരിയെ യെഹെസ്കേൽ നേരിടുന്നു
      '29':
        title: ഫറവോന്റെ അഹങ്കാരം ഈജിപ്തിനെ വീഴ്ത്തുന്നു
      '30':
        title: ഫറവോന്റെ അധികാരം നീക്കപ്പെടുന്നു
      '31':
        title: അശ്ശൂർ വീഴുന്നു; ഫറവോനു മുന്നറിയിപ്പ്
      '32':
        title: ഫറവോൻ ബാബിലോണിനു മുന്നിൽ വീഴുന്നു
      '33':
        title: യെഹെസ്കേൽ കാവൽനിന്ന് ദുഷ്ടർക്കു മുന്നറിയിപ്പു നൽകുന്നു
      '34':
        title: ഇടയന്മാർ പരാജയപ്പെടുന്നു; ദൈവം ഇടയനാകും
      '35':
        title: ഏദോം വെറുക്കുന്നു; ശൂന്യത ഉടൻ വരുന്നു
      '36':
        title: ഇസ്രായേൽ പുനഃസ്ഥാപിക്കപ്പെടുന്നു; മലകൾ ഫലസമൃദ്ധമാകുന്നു
      '37':
        title: ഉണങ്ങിയ അസ്ഥികൾ ജീവിക്കുന്നു; ജനം വീണ്ടും ഒന്നാകുന്നു
      '38':
        title: ഗോഗ് ഇസ്രായേലിനെ ആക്രമിക്കുന്നു; പരിശുദ്ധനായ ദൈവം സംരക്ഷിക്കുന്നു
      '39':
        title: ഗോഗ് നശിപ്പിക്കപ്പെടുന്നു; ജനതകൾ യഹോവയെ അറിയുന്നു
      '40':
        title: ഉയർന്ന മലയിൽ ദർശനം ആരംഭിക്കുന്നു; അളവെടുപ്പ് നടക്കുന്നു
      '41':
        title: ദേവാലയത്തിന്റെ ഉൾഭാഗം അളക്കുന്നു; വിശുദ്ധ മഹത്ത്വം വെളിപ്പെടുന്നു
      '42':
        title: വേർതിരിക്കപ്പെട്ട പുരോഹിതമുറികൾ അളക്കുന്നു
      '43':
        title: മഹത്ത്വം മടങ്ങിവരുന്നു; ദേവാലയം വിശുദ്ധസാന്നിധ്യത്താൽ നിറയുന്നു
      '44':
        title: അടച്ചിട്ട കവാടം യെഹെസ്കേൽ കാണുന്നു
      '45':
        title: ദൈവത്തിനും ജനത്തിനുമുള്ള ഭൂമി
      '46':
        title: ആരാധന ക്രമീകരിക്കുന്നു; പ്രഭുവും ആരാധിക്കുന്നു
      '47':
        title: ജീവജലം ഒഴുകി ജീവൻ പകരുന്നു
      '48':
