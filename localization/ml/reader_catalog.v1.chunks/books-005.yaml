payload:
  book_metadata:
    Ezra:
      display_name: എസ്രാ
      author: രചയിതാവ് അജ്ഞാതൻ; ദിനവൃത്താന്തങ്ങളുടെ രചയിതാവിന്റെ അതേ കൈപ്പണിയായിരിക്കാം.
      audience: പേർഷ്യൻ ഭരണത്തിൻ കീഴിൽ യെരൂശലേം പുനർനിർമിച്ചുകൊണ്ടിരുന്ന മടങ്ങിവന്ന പ്രവാസികൾ.
      date: ഏകദേശം ക്രി.മു. അഞ്ചാം നൂറ്റാണ്ടിന്റെ മധ്യം മുതൽ നാലാം നൂറ്റാണ്ടുവരെ.
    Nehemiah:
      display_name: നെഹെമ്യാവ്
      author: രചയിതാവ് അജ്ഞാതൻ; നെഹെമ്യാവിന്റേതെന്ന് കരുതപ്പെടുന്ന ഒരു ആദ്യപുരുഷ സ്മരണക്കുറിപ്പ് ഇതിൽ ഉൾക്കൊള്ളുന്നു.
      audience: പേർഷ്യൻ ഭരണത്തിൻ കീഴിൽ യെരൂശലേമിന്റെ മതിലുകൾ പുനർനിർമിക്കുകയും ഉടമ്പടി പുതുക്കുകയും ചെയ്തുകൊണ്ടിരുന്ന മടങ്ങിവന്ന പ്രവാസികൾ.
      date: ഏകദേശം ക്രി.മു. അഞ്ചാം നൂറ്റാണ്ടിന്റെ മധ്യം മുതൽ നാലാം നൂറ്റാണ്ടുവരെ.
    Esther:
      display_name: എസ്ഥേർ
      author: രചയിതാവ് അജ്ഞാതൻ.
      audience: വിദേശഭരണത്തിൻ കീഴിൽ, പ്രത്യേകിച്ച് പേർഷ്യയിൽ, ചിതറിപ്പാർത്തിരുന്ന യെഹൂദർ.
      date: ഏകദേശം പേർഷ്യൻ കാലഘട്ടത്തിന്റെ അവസാനമോ ഹെല്ലനിസ്റ്റിക് കാലഘട്ടത്തിന്റെ ആരംഭമോ (ക്രി.മു. നാലാം–മൂന്നാം നൂറ്റാണ്ടുകൾ).
    Job:
      display_name: ഇയ്യോബ്
      author: രചയിതാവ് അജ്ഞാതൻ.
      audience: നിരപരാധിയുടെ കഷ്ടപ്പാടിനെയും ദൈവിക നീതിയെയും കുറിച്ച് ചിന്തിച്ചുപോരാടിയിരുന്ന ഇസ്രായേല്യർ.
      date: പഴയ നാടോടിവിവരണങ്ങളെ ആശ്രയിക്കുന്ന ഈ പുസ്തകം ഏകദേശം ക്രി.മു. ആറാം–നാലാം നൂറ്റാണ്ടുകളിൽ രൂപപ്പെട്ടതാണെന്നാണ് ജ്ഞാനസാഹിത്യപാരമ്പര്യത്തെക്കുറിച്ചുള്ള പൊതുവായ പണ്ഡിതാഭിപ്രായം.
    Psalms:
      display_name: സങ്കീർത്തനങ്ങൾ
      author: നൂറ്റാണ്ടുകളിലായി ജീവിച്ചിരുന്ന പല രചയിതാക്കൾ; ശീർഷകക്കുറിപ്പുകളിൽ ദാവീദ്, ആസാഫ്, കോരഹ്, ശലോമോൻ, മോശെ തുടങ്ങിയവരുടെ പേരുകൾ കാണുന്നു.
      audience: ആരാധനയിൽ പങ്കെടുത്ത ഇസ്രായേലും ദൈവാലയസഭയും—കൂടാതെ പിൽക്കാലത്തെ പ്രാർഥനയുടെയും വിലാപത്തിന്റെയും എല്ലാ സമൂഹങ്ങളും.
      date: ഏകദേശം ക്രി.മു. പത്താം–മൂന്നാം നൂറ്റാണ്ടുകളിൽ രചിക്കപ്പെട്ടു; അന്തിമ സമാഹാരം പ്രവാസാനന്തര കാലഘട്ടത്തിലായിരുന്നു.
  chapter_titles:
    2 Chronicles:
      '20':
        title: ശത്രുക്കളുടെമേൽ യെഹൂദയുടെ വിജയം
      '21':
        title: യെഹോരാം സഹോദരന്മാരെ കൊല്ലുന്നു
      '22':
        title: അഹസ്യാവ് ദുഷിച്ച വഴികൾ പിന്തുടരുന്നു
      '23':
        title: യോവാശിനെ രാജാവായി പുനഃസ്ഥാപിക്കുന്നു
      '24':
        title: ദൈവാലയത്തിന്റെ നവീകരണവും തുടർന്നുള്ള അധഃപതനവും
      '25':
        title: അമസ്യാവ് ഏദോമിനെ തോൽപ്പിക്കുന്നു
      '26':
        title: ഉസ്സീയാവിന്റെ അഭിവൃദ്ധി അവസാനിക്കുന്നു
      '27':
        title: യോഥാം യെഹൂദയെ ശക്തിപ്പെടുത്തുന്നു
      '28':
        title: ആഹാസിന്റെ കടുത്ത അവിശ്വസ്തത
      '29':
        title: ഹിസ്കീയാവ് ദൈവാലയം വീണ്ടും തുറക്കുന്നു
      '30':
        title: ഇസ്രായേലെല്ലാം പെസഹ ആചരിക്കുന്നു
      '31':
        title: ഹിസ്കീയാവ് ദൈവാലയഭണ്ഡാരങ്ങൾ നിറയ്ക്കുന്നു
      '32':
        title: ദൂതന്റെ ശക്തിയാൽ യെരൂശലേം വിടുവിക്കപ്പെടുന്നു
      '33':
        title: മനശ്ശെ അനുതപിച്ച് യാഗപീഠം പുനഃസ്ഥാപിക്കുന്നു
      '34':
        title: യോശീയാവ് ന്യായപ്രമാണം കണ്ടെത്തി വായിക്കുന്നു
      '35':
        title: യോശീയാവ് മഹത്തായ പെസഹാഘോഷം നയിക്കുന്നു
      '36':
        title: യെഹൂദ ബാബിലോന്യശക്തിക്കു കീഴടങ്ങുന്നു
    Ezra:
      '1':
        title: ദൈവാലയം പുനർനിർമിക്കാൻ കോരെശ് അനുമതി നൽകുന്നു
      '2':
        title: പ്രവാസികളോടൊപ്പം എസ്രാ മടങ്ങിവരുന്നു
      '3':
        title: ഭയത്തിനിടയിലും യെരൂശലേമിൽ യാഗപീഠം പുനർനിർമിക്കുന്നു
      '4':
        title: ശത്രുക്കൾ ദൈവാലയപുനർനിർമാണം തടയുന്നു
      '5':
        title: ദൈവം ദൈവാലയപുനർനിർമാണത്തിനു വഴികാട്ടുന്നു
      '6':
        title: ദൈവാലയനിർമാണം പുനരാരംഭിക്കാൻ ദാര്യാവേശ് കല്പിക്കുന്നു
      '7':
        title: എസ്രാ ദൈവത്തിന്റെ ന്യായപ്രമാണം പഠിപ്പിക്കുന്നു
      '8':
        title: എസ്രാ പ്രാർഥിച്ച് സുരക്ഷിതമായി മടങ്ങിയെത്തുന്നു
      '9':
        title: ഇസ്രായേലിന്റെ പാപകരമായ വിവാഹങ്ങളെക്കുറിച്ച് എസ്രാ ദുഃഖിക്കുന്നു
      '10':
        title: പാപകരമായ വിവാഹങ്ങളെ എസ്രാ നേരിടുന്നു
    Nehemiah:
      '1':
        title: നെഹെമ്യാവ് യെരൂശലേമിനുവേണ്ടി പ്രാർഥിക്കുന്നു
      '2':
        title: പുനർനിർമാണത്തിനായി രാജാവ് നെഹെമ്യാവിനെ അയയ്ക്കുന്നു
      '3':
        title: ഒന്നിച്ചുള്ള അധ്വാനത്തിൽ യെരൂശലേമിന്റെ മതിലുകൾ ഉയരുന്നു
      '4':
        title: നെഹെമ്യാവ് യെരൂശലേമിനെ സംരക്ഷിക്കുന്നു
      '5':
        title: നെഹെമ്യാവ് സാമൂഹിക അനീതിക്കെതിരെ പോരാടുന്നു
      '6':
        title: ദൈവത്തിന്റെ പ്രവൃത്തി തടയുന്നതിൽ ശത്രുക്കൾ പരാജയപ്പെടുന്നു
      '7':
        title: നഗരകാവൽക്കാരുടെയും ജനത്തിന്റെയും പട്ടിക
      '8':
        title: എസ്രാ ന്യായപ്രമാണം വായിക്കുമ്പോൾ ജനം കരയുന്നു
      '9':
        title: ഇസ്രായേൽ ദൈവത്തോട് പാപങ്ങൾ ഏറ്റുപറയുന്നു
      '10':
        title: ജനം ദൈവവുമായി ഉടമ്പടി ചെയ്യുന്നു
      '11':
        title: നേതാക്കൾ വിശുദ്ധനഗരത്തിൽ ജനങ്ങളെ പാർപ്പിക്കുന്നു
      '12':
        title: മതിൽപ്രതിഷ്ഠ ആരാധനയോടെ ആഘോഷിക്കുന്നു
      '13':
        title: നെഹെമ്യാവ് ദൈവാലയം വീണ്ടും ശുദ്ധീകരിക്കുന്നു
    Esther:
      '1':
        title: വസ്ഥിരാജ്ഞിയെ രാജാവ് പുറത്താക്കുന്നു
      '2':
        title: എസ്ഥേർ പുതിയ രാജ്ഞിയാകുന്നു
      '3':
        title: യെഹൂദരെ നശിപ്പിക്കാൻ ഹാമാൻ പദ്ധതിയിടുന്നു
      '4':
        title: പ്രവർത്തിക്കാൻ മൊർദ്ദെഖായി എസ്ഥേരിനെ പ്രേരിപ്പിക്കുന്നു
      '5':
        title: എസ്ഥേർ രാജാവിനെയും ഹാമാനെയും ക്ഷണിക്കുന്നു
      '6':
        title: രാജാവ് മൊർദ്ദെഖായിയെ പരസ്യമായി ആദരിക്കുന്നു
      '7':
        title: ഹാമാന്റെ ഗൂഢപദ്ധതി എസ്ഥേർ വെളിപ്പെടുത്തുന്നു
      '8':
        title: ഹാമാന്റെ അധികാരസ്ഥാനത്ത് മൊർദ്ദെഖായി എത്തുന്നു
      '9':
        title: യെഹൂദർ വിജയകരമായി സ്വയം പ്രതിരോധിക്കുന്നു
      '10':
        title: മൊർദ്ദെഖായി ജ്ഞാനത്തോടും നന്മയോടുംകൂടെ ഭരിക്കുന്നു
    Job:
      '1':
        title: എല്ലാം നഷ്ടപ്പെട്ടിട്ടും ഇയ്യോബ് ആരാധിക്കുന്നു
      '2':
        title: ഇയ്യോബ് വിശ്വസ്തതയോടെ കഷ്ടത സഹിക്കുന്നു
      '3':
        title: ഇയ്യോബ് തന്റെ ജന്മദിവസത്തെ ശപിക്കുന്നു
      '4':
        title: ഇയ്യോബ് വിതച്ചതിനെക്കുറിച്ച് എലീഫസ് ശാസിക്കുന്നു
      '5':
        title: ദൈവത്തെ അന്വേഷിക്കാൻ എലീഫസ് ഇയ്യോബിനെ ഉപദേശിക്കുന്നു
      '6':
        title: ഇയ്യോബ് തന്റെ കനത്ത ഭാരം വിവരിക്കുന്നു
      '7':
        title: ഇയ്യോബ് തന്റെ കഷ്ടതയെക്കുറിച്ച് പരാതിപ്പെടുന്നു
      '8':
        title: ഇയ്യോബിന്റെ കഷ്ടതയെക്കുറിച്ച് ബിൽദദ് അവനെ ശാസിക്കുന്നു
      '9':
        title: ദൈവത്തിന്റെ ശക്തിക്കുമുമ്പിൽ ഇയ്യോബ് വിലപിക്കുന്നു
      '10':
        title: എന്തിന് എന്നോട് പോരാടുന്നു എന്ന് ഇയ്യോബ് ചോദിക്കുന്നു
      '11':
        title: സോഫർ ജ്ഞാനവാക്കുകളാൽ ഇയ്യോബിനെ ശാസിക്കുന്നു
      '12':
        title: സുഹൃത്തുക്കളുടെ പൊള്ളയായ വാക്കുകളെ ഇയ്യോബ് പരിഹസിക്കുന്നു
      '13':
        title: ഇയ്യോബ് ദൈവസന്നിധിയിൽ സത്യം പറയുന്നു
      '14':
