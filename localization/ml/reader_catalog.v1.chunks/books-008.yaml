payload:
  book_metadata:
    Isaiah:
      display_name: യെശയ്യാവ്
      author: പല നൂറ്റാണ്ടുകളിലായി ഒന്നിലധികം രചയിതാക്കൾ; 1–39 അധ്യായങ്ങൾ ക്രി.മു. എട്ടാം നൂറ്റാണ്ടിലെ യെരൂശലേമുകാരനായ യെശയ്യാവിൽ വേരൂന്നിയവയാണ്; 40–55 ("രണ്ടാം യെശയ്യാവ്"), 56–66 ("മൂന്നാം യെശയ്യാവ്") എന്നീ ഭാഗങ്ങൾ പ്രവാസത്തിന്റെയും മടങ്ങിവരവിന്റെയും സാഹചര്യങ്ങളോട് പ്രതികരിക്കുന്നു.
      audience: അശ്ശൂരിന്റെ ഭീഷണി നേരിട്ട യെഹൂദാ, ബാബിലോന്യ പ്രവാസത്തിലുള്ളവർ, പ്രവാസാനന്തര പുനഃസ്ഥാപനകാലത്തുള്ളവർ—തുടർച്ചയായ ഈ ഘട്ടങ്ങളിലെ ജനങ്ങൾ.
      date: ഏകദേശം ക്രി.മു. എട്ടാം നൂറ്റാണ്ടിന്റെ അവസാനംമുതൽ അഞ്ചാം നൂറ്റാണ്ടുവരെ വിവിധ ഘട്ടങ്ങളിലായി രചിക്കപ്പെട്ടത്.
    Jeremiah:
      display_name: യിരെമ്യാവ്
      author: അനാഥോത്തിലെ യിരെമ്യാവ്; അദ്ദേഹത്തിന്റെ എഴുത്തുകാരനായ ബാരൂക്കും പിൽക്കാലത്തെ മറ്റുള്ളവരും ഗണ്യമായ സംശോധനം നടത്തി.
      audience: ബാബിലോന്യർ കീഴടക്കുന്നതിനു തൊട്ടുമുമ്പും അതിനിടയിലും അതിനുശേഷവും ഉണ്ടായിരുന്ന യെഹൂദാ.
      date: ക്രി.മു. ഏഴാം നൂറ്റാണ്ടിന്റെ അവസാനഭാഗംമുതൽ ആറാം നൂറ്റാണ്ടിന്റെ ആദ്യഭാഗംവരെ.
  chapter_titles:
    Isaiah:
      '1':
        title: ധിക്കാരിയായ യെഹൂദയെ ദൈവം നിരസിക്കുന്നു
      '2':
        title: യഹോവയുടെ ആലയം എല്ലാറ്റിനും മീതെ ഉയർത്തപ്പെടുന്നു
      '3':
        title: ന്യായവിധി രാജ്യത്തിന്റെ തകർച്ച വരുത്തുന്നു
      '4':
        title: നാശത്തിനുശേഷം പുനഃസ്ഥാപനം വാഗ്ദാനം ചെയ്യപ്പെടുന്നു
      '5':
        title: കർത്താവിന്റെ മുന്തിരിത്തോട്ടം അക്രമം വിളയിക്കുന്നു
      '6':
        title: ദൈവത്തിന്റെ അതിമഹത്തായ തേജസ്സ് യെശയ്യാവ് കാണുന്നു
      '7':
        title: അശ്ശൂർ വരുംമുമ്പ് ഇമ്മാനുവേൽ ജനിക്കുന്നു
      '8':
        title: മഹേർ-ശാലാൽ-ഹാശ്-ബസ് എന്ന പേര് ന്യായവിധിയെ സൂചിപ്പിക്കുന്നു
      '9':
        title: യെശയ്യാവിന് വെളിച്ചം പ്രത്യാശ നൽകുന്നു
      '10':
        title: അഹങ്കാരിയായ അശ്ശൂരിനെ ദൈവം വിധിക്കുന്നു
      '11':
        title: പുതിയ രാജാവ് ഭൂമിയിൽ സമാധാനം കൊണ്ടുവരുന്നു
      '12':
        title: ദൈവജനം തങ്ങളുടെ രക്ഷയെച്ചൊല്ലി സ്തുതിക്കുന്നു
      '13':
        title: ബാബിലോൻ സമ്പൂർണ നാശം നേരിടുന്നു
      '14':
        title: വീണുപോയ ബാബിലോൻ രാജാവിനെ ഇസ്രായേൽ പരിഹസിക്കുന്നു
      '15':
        title: മോവാബിന് പെട്ടെന്ന് കനത്ത ദുരന്തം സംഭവിക്കുന്നു
      '16':
        title: മോവാബിന്റെ അഹങ്കാരം കഠിനമായ ന്യായവിധി വരുത്തുന്നു
      '17':
        title: ദമസ്കൊസും എഫ്രയീമും പൂർണമായി ശൂന്യമാക്കപ്പെടുന്നു
      '18':
        title: വിദൂരദേശം ദൂരേക്കു ദൂതന്മാരെ അയക്കുന്നു
      '19':
        title: ഈജിപ്ത് അപമാനവും തുടർന്ന് സൗഖ്യവും നേരിടുന്നു
      '20':
        title: അടയാളമായി യെശയ്യാവ് വസ്ത്രമുരിഞ്ഞ് നടക്കുന്നു
      '21':
        title: ബാബിലോൻ പെട്ടെന്ന് വീഴുന്നു; വിരുന്ന് അവസാനിക്കുന്നു
      '22':
        title: യെരൂശലേമിന്റെ കോലാഹലം ന്യായവിധി വരുത്തുന്നു
      '23':
        title: സോരിന്റെ സമ്പത്തും ശക്തിയും തകരുന്നു
      '24':
        title: ഭൂമി സർവവ്യാപകമായ സമ്പൂർണ ന്യായവിധി നേരിടുന്നു
      '25':
        title: യഹോവ വിരുന്നൊരുക്കി മരണത്തെ നീക്കുന്നു
      '26':
        title: ദൈവം തന്റെ ജനത്തെ സുരക്ഷിതരായി കാക്കുന്നു
      '27':
        title: ലിവ്യാഥാൻ പരാജയപ്പെടുന്നു; ഇസ്രായേൽ സംരക്ഷിക്കപ്പെടുന്നു
      '28':
        title: അഹങ്കാരികളായ നേതാക്കൾ ദൈവവചനത്തെ പരിഹസിക്കുന്നു
      '29':
        title: ഉപരോധത്തിൽ യെരൂശലേം താഴ്ത്തപ്പെടുന്നു
      '30':
        title: ഈജിപ്തിൽ ആശ്രയിക്കുന്ന യെഹൂദാ നാശം നേരിടുന്നു
      '31':
        title: ദൈവം മാത്രമാണ് സീയോനുവേണ്ടി പോരാടുന്നത്
      '32':
        title: നീതിമാനായ രാജാവ് ന്യായം കൊണ്ടുവരുന്നു
      '33':
        title: ദുഷ്ടന്മാരുടെമേൽ അക്രമം തിരിച്ചുവരുന്നു
      '34':
        title: യഹോവ ഏദോമിനെ കഠിനമായി വിധിക്കുന്നു
      '35':
        title: മരുഭൂമി തേജസ്സോടെ പൂക്കുന്നു
      '36':
        title: യെഹൂദയുടെ ആശ്രയത്തെ റബ്-ശാക്കേ പരിഹസിക്കുന്നു
      '37':
        title: ഹിസ്കീയാവ് പ്രാർഥിക്കുന്നു; ദൈവം ഉത്തരം നൽകുന്നു
      '38':
        title: ഹിസ്കീയാവിന്റെ രോഗവും സൗഖ്യവും
      '39':
        title: ബാബിലോൻ ഹിസ്കീയാവിന്റെ നിക്ഷേപങ്ങൾ കാണുന്നു
      '40':
        title: ദൈവജനത്തിന് ആശ്വാസം വരുന്നു
      '41':
        title: യഹോവ മാത്രം ചരിത്രത്തെ നിയന്ത്രിക്കുന്നു
      '42':
        title: ദാസൻ സൗമ്യമായി ന്യായം സ്ഥാപിക്കുന്നു
      '43':
        title: ഇസ്രായേലിനോടൊപ്പം എപ്പോഴും ഉണ്ടായിരിക്കുമെന്ന് ദൈവം വാഗ്ദാനം ചെയ്യുന്നു
      '44':
        title: യഹോവ മാത്രമാണ് സത്യദൈവം
      '45':
        title: ഇസ്രായേലിനെ മോചിപ്പിക്കാൻ കോരെശ് തിരഞ്ഞെടുക്കപ്പെടുന്നു
      '46':
        title: യഹോവ ഇസ്രായേലിനെ ജീവിതത്തിലുടനീളം വഹിക്കുന്നു
      '47':
        title: പ്രതികാരത്താൽ ബാബിലോൻ വീഴുന്നു
      '48':
        title: ഇസ്രായേലിന്റെ ദുശ്ശാഠ്യം ചോദ്യം ചെയ്യപ്പെടുന്നു
      '49':
        title: ദാസന്റെ ദൗത്യം അതിവിശാലമാണ്
      '50':
        title: കഷ്ടതയിലും ദാസൻ ആശ്രയിക്കുന്നു
      '51':
        title: അബ്രാഹാമിന്റെ വിശ്വസ്തത ഓർക്കുക
      '52':
        title: യെരൂശലേം പ്രവാസത്തിൽനിന്ന് ഉണരുന്നു
      '53':
        title: കഷ്ടമനുഭവിക്കുന്ന ദാസൻ പാപം വഹിക്കുന്നു
      '54':
        title: ഉപേക്ഷിക്കപ്പെട്ട തന്റെ മണവാട്ടിയെ ദൈവം പുനഃസ്ഥാപിക്കുന്നു
      '55':
        title: വരുവിൻ, ജീവൻ സൗജന്യമായി സ്വീകരിക്കുവിൻ
      '56':
        title: വിശ്വസ്തരായ വിദേശ ആരാധകരെ ദൈവം സ്വാഗതം ചെയ്യുന്നു
      '57':
        title: നീതിയോടെ ജീവിക്കുവിൻ; രക്ഷ അടുത്തിരിക്കുന്നു
      '58':
        title: ദൈവജനം പുനഃസ്ഥാപിക്കപ്പെടും
      '59':
        title: യഥാർഥമായി നീതിയും കരുണയും അന്വേഷിക്കുവിൻ
      '60':
        title: സീയോനെ സഹായിക്കാൻ വീണ്ടെടുപ്പുകാരൻ വരുന്നു
      '61':
        title: സൗഖ്യമാക്കാൻ ദൈവം ദാസനെ അഭിഷേകം ചെയ്യുന്നു
      '62':
        title: സീയോനെ മാനിക്കുമെന്ന് യഹോവ സത്യം ചെയ്യുന്നു
      '63':
        title: യോദ്ധാവായ ദൈവം ക്രോധത്തോടെ മടങ്ങിവരുന്നു
      '64':
        title: പരിശുദ്ധനായ ദൈവം മടങ്ങിവരണമെന്ന പ്രാർഥന
      '65':
        title: വിശ്വസ്ത ശേഷിപ്പിനായി പുതിയ ആകാശങ്ങൾ
      '66':
        title: കർത്താവ് സീയോനെ വിധിക്കുകയും പുനഃസ്ഥാപിക്കുകയും ചെയ്യുന്നു
    Jeremiah:
      '1':
        title: ദൈവം യിരെമ്യാവിനെ പ്രവാചകനായി നിയമിക്കുന്നു
      '2':
        title: യെരൂശലേം ജീവജലം ഉപേക്ഷിക്കുന്നു
      '3':
        title: ഇസ്രായേൽ വിശ്വസ്തനായ ദൈവത്തിലേക്ക് മടങ്ങുന്നു
      '4':
        title: യെഹൂദാ വരാനിരിക്കുന്ന ന്യായവിധി നേരിടുന്നു
      '5':
        title: യെരൂശലേം അഴിമതികൊണ്ട് നിറഞ്ഞിരിക്കുന്നു
      '6':
        title: വടക്കുനിന്ന് സൈന്യം വരും
      '7':
        title: യിരെമ്യാവ് ആലയത്തിൽ മുന്നറിയിപ്പ് നൽകുന്നു
      '8':
        title: യെഹൂദയുടെ ന്യായവിധി പൂർണമായിരിക്കുന്നു
      '9':
        title: ജനം വഞ്ചനകൊണ്ട് നിറഞ്ഞിരിക്കുന്നു
      '10':
        title: വിഗ്രഹങ്ങൾ മനുഷ്യനിർമിതവും പൊള്ളയുമാണ്
      '11':
        title: യെഹൂദാ ഉടമ്പടി ലംഘിച്ചിരിക്കുന്നു
      '12':
        title: ദുഷ്ടന്മാർ അഭിവൃദ്ധിപ്പെടുന്നത് എന്തുകൊണ്ട്?
      '13':
        title: അഹങ്കാരംമൂലം യെഹൂദാ ഉപയോഗശൂന്യമാകുന്നു
      '14':
        title: വരൾച്ച യെഹൂദയെ നിരാശയിലാഴ്ത്തുന്നു
      '15':
        title: ന്യായവിധി ഇപ്പോൾ ഒഴിവാക്കാനാവില്ല
      '16':
