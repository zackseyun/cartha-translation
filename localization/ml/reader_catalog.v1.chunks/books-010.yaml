chunk_id: books-010
status: reviewed
payload:
  book_metadata:
    Joel:
      display_name: യോവേൽ
      author: പെത്തൂവേലിന്റെ മകൻ യോവേൽ.
      audience: വെട്ടുക്കിളിബാധയെ യഹോവയുടെ ദിവസത്തിന്റെ അടയാളമായി കണ്ട് അതിനോട് പ്രതികരിക്കുന്ന പ്രവാസാനന്തര യെഹൂദാ.
      date: സാധ്യതയനുസരിച്ച് ക്രി.മു. 5–4 നൂറ്റാണ്ടുകൾ.
    Amos:
      display_name: ആമോസ്
      author: തെക്കോവക്കാരനായ ആമോസ്; വടക്കൻ ദേശത്ത് പ്രസംഗിച്ച യെഹൂദ്യനായ ഒരു ഇടയൻ.
      audience: യൊരോബെയാം രണ്ടാമന്റെ ഭരണകാലത്തെ സമൃദ്ധിക്കും അനീതിക്കും നടുവിലായിരുന്ന വടക്കൻ ഇസ്രായേൽ.
      date: ഏകദേശം ക്രി.മു. 760–750.
    Obadiah:
      display_name: ഓബദ്യാവ്
      author: ഓബദ്യാവ്.
      audience: എദോം യെരൂശലേമിനെ വഞ്ചിച്ചതിനുശേഷമുള്ള യെഹൂദാ—എദോമിന്റെ പതനത്തെക്കുറിച്ചുള്ള ഒരു പ്രവചനം.
      date: ക്രി.മു. 586-നു തൊട്ടുപിന്നാലെ.
    Jonah:
      display_name: യോനാ
      author: രചയിതാവ് അജ്ഞാതൻ; കഥയിലെ മുഖ്യകഥാപാത്രം അമിത്തായിയുടെ മകൻ യോനാ.
      audience: പ്രവാസാനന്തര ഇസ്രായേൽ—സ്വന്തം വംശത്തിൽ ഒതുങ്ങിനിൽക്കുന്ന മനോഭാവത്തെ ആക്ഷേപഹാസ്യത്തോടെ ശാസിക്കുകയും അന്യരോടുള്ള ദൈവത്തിന്റെ കരുണ ഉറപ്പിക്കുകയും ചെയ്യുന്ന കൃതി.
      date: സാധ്യതയനുസരിച്ച് ക്രി.മു. 5–4 നൂറ്റാണ്ടുകൾ.
    Micah:
      display_name: മീഖാ
      author: മോരേശെത്ത് സ്വദേശിയായ മീഖാ.
      audience: ക്രി.മു. 8-ാം നൂറ്റാണ്ടിന്റെ അവസാനകാലത്തെ യെഹൂദാ; പ്രത്യേകിച്ച് നഗരങ്ങളിലെ പ്രമാണിവർഗത്തിന്റെ ചൂഷണത്തിനിരയായ ഗ്രാമീണ ദരിദ്രർ.
      date: ഏകദേശം ക്രി.മു. 740–700.
    Nahum:
      display_name: നഹൂം
      author: എൽക്കോശുകാരനായ നഹൂം.
      audience: നിനവേയുടെ ആസന്നമായ പതനം ആഘോഷിക്കുന്ന യെഹൂദാ.
      date: ക്രി.മു. 612-നു തൊട്ടുമുമ്പ്.
    Habakkuk:
      display_name: ഹബക്കൂക്ക്
      author: ഹബക്കൂക്ക്.
      audience: ബാബിലോന്റെ ഉയർച്ചയെ അഭിമുഖീകരിക്കുന്ന യെഹൂദാ—നീതിയെക്കുറിച്ച് ഒരു പ്രവാചകൻ ദൈവവുമായി നടത്തുന്ന സംവാദം.
      date: ഏകദേശം ക്രി.മു. 7-ാം നൂറ്റാണ്ടിന്റെ അവസാനകാലം.
    Zephaniah:
      display_name: സെഫന്യാവ്
      author: കൂശിയുടെ മകൻ സെഫന്യാവ്.
      audience: യോശീയാവിന്റെ പരിഷ്കാരങ്ങൾ ആരംഭിക്കുന്നതിനു തൊട്ടുമുമ്പ്, അവന്റെ ഭരണത്തിൻ കീഴിലായിരുന്ന യെഹൂദാ.
      date: ഏകദേശം ക്രി.മു. 640–609.
    Haggai:
      display_name: ഹഗ്ഗായി
      author: ഹഗ്ഗായി.
      audience: ദാര്യാവേശിന്റെ ഭരണകാലത്ത് ദൈവാലയം പുനർനിർമിച്ചുകൊണ്ടിരുന്ന മടങ്ങിവന്നവർ.
      date: ക്രി.മു. 520.
    Zechariah:
      display_name: സെഖര്യാവ്
      author: ബെരെഖ്യാവിന്റെ മകൻ സെഖര്യാവ്; 9–14 അധ്യായങ്ങൾ പിൽക്കാലത്തെ മറ്റൊരു രചയിതാവിൽനിന്നായിരിക്കാം.
      audience: മടങ്ങിവന്ന് ദൈവാലയം പുനർനിർമിച്ചിരുന്നവരും പിൽക്കാലത്തെ പ്രവാസാനന്തര സമൂഹങ്ങളും.
      date: 1–8 അധ്യായങ്ങൾ ഏകദേശം ക്രി.മു. 520–518; 9–14 അധ്യായങ്ങൾ ഒരുപക്ഷേ ഒരു നൂറ്റാണ്ടിനുശേഷം.
    Malachi:
      display_name: മലാഖി
      author: രചയിതാവ് അജ്ഞാതൻ; “മലാഖി” എന്നതിന് “എന്റെ ദൂതൻ” എന്നാണ് അർഥം.
      audience: പേർഷ്യൻ ഭരണത്തിൻ കീഴിൽ ആരാധനയിലും വിശ്വസ്തതയിലും അലംഭാവം വളർന്ന പ്രവാസാനന്തര യെഹൂദാ.
      date: ഏകദേശം ക്രി.മു. 5-ാം നൂറ്റാണ്ടിന്റെ മധ്യകാലം.
    Matthew:
      display_name: മത്തായി
      author: രചയിതാവ് അജ്ഞാതൻ; പാരമ്പര്യം ഇതിന്റെ രചന അപ്പൊസ്തലനായ മത്തായിക്കു നൽകുന്നു. ആധുനിക പണ്ഡിതാഭിപ്രായമനുസരിച്ച്, മർക്കോസിനെയും Q-വിനോടു സാമ്യമുള്ള ഒരു സ്രോതസ്സിനെയും ആശ്രയിച്ച ഗ്രീക്കുഭാഷിയായ ഒരു യഹൂദക്രൈസ്തവനാണ് രചയിതാവ്.
      audience: സിനഗോഗ് കേന്ദ്രീകൃത യഹൂദമതവുമായുള്ള തുടർച്ചയും വ്യത്യാസവും എങ്ങനെ മനസ്സിലാക്കണമെന്നു ചിന്തിച്ചിരുന്ന ഒരു യഹൂദക്രൈസ്തവ സമൂഹം.
      date: ഏകദേശം ക്രി.വ. 80–90.
    Mark:
      display_name: മർക്കോസ്
      author: രചയിതാവ് അജ്ഞാതൻ; പാരമ്പര്യം ഇതിനെ പത്രോസിന്റെ യാത്രാസഹചാരിയായ യോഹന്നാൻ മർക്കോസുമായി ബന്ധപ്പെടുത്തുന്നു.
      audience: ഒരുപക്ഷേ റോമിൽ, പീഡനത്തിനിടയിലോ അതിന്റെ ഭീഷണിക്കു സമീപമോ ജീവിച്ചിരുന്ന ഗ്രീക്കുഭാഷിയായ ഒരു ക്രൈസ്തവ സമൂഹം.
      date: ഏകദേശം ക്രി.വ. 65–75; യഹൂദയുദ്ധത്തിന്റെയും ദൈവാലയനാശത്തിന്റെയും കാലത്തോട് അടുത്ത്.
  chapter_titles:
    Hosea:
      '12':
        title: നുണയ്ക്കും അക്രമത്തിനും ന്യായവിധിയിലൂടെ പ്രതിഫലം
      '13':
        title: ഒരിക്കൽ ശക്തനായിരുന്ന എഫ്രയീം ഇപ്പോൾ ഓടിപ്പോകുന്നു
      '14':
        title: ഇസ്രായേൽ അനുതപിച്ച് കരുണ തേടുന്നു
    Joel:
      '1':
        title: ഉപവസിക്കാൻ യോവേൽ ആഹ്വാനം ചെയ്യുന്നു
      '2':
        title: പൂർണഹൃദയത്തോടെ മടങ്ങിവരുക
      '3':
        title: എല്ലാവരുടെയുംമേൽ ആത്മാവിനെ പകരുന്നു
      '4':
        title: ന്യായവിധിക്കായി ജനതകൾ കൂടിവരുന്നു
    Amos:
      '1':
        title: ജനതകളുടെ ക്രൂരതയെ ദൈവം വിധിക്കുന്നു
      '2':
        title: ഇസ്രായേൽ ഉറപ്പായ ന്യായവിധി നേരിടുന്നു
      '3':
        title: ഇസ്രായേലിന്റെ പാപങ്ങൾ ദുരന്തം വരുത്തുന്നു
      '4':
        title: സമ്പന്നസ്ത്രീകൾ ന്യായവിധി നേരിടുന്നു
      '5':
        title: അനുതപിച്ചില്ലെങ്കിൽ ജനത വീഴും
      '6':
        title: സുഖലോലുപരായ പ്രമാണികൾ നാശം അവഗണിക്കുന്നു
      '7':
        title: വരാനിരിക്കുന്ന നാശത്തിന്റെ ദർശനങ്ങൾ ആമോസ് കാണുന്നു
      '8':
        title: വേനൽപ്പഴം ഇസ്രായേലിന്റെ അന്ത്യം സൂചിപ്പിക്കുന്നു
      '9':
        title: ഒഴിവാക്കാനാവാത്ത ന്യായവിധിയും പുനഃസ്ഥാപനവും
    Obadiah:
      '1':
        title: വഞ്ചന നിമിത്തം എദോം വിധിക്കപ്പെടുന്നു
    Jonah:
      '1':
        title: നിനവേയിലേക്കുള്ള ദൗത്യത്തിൽനിന്ന് യോനാ ഓടിപ്പോകുന്നു
      '2':
        title: മത്സ്യത്തിന്റെ വയറ്റിൽ യോനാ പ്രാർഥിക്കുന്നു
      '3':
        title: യോനായുടെ ആഹ്വാനത്തിൽ നിനവേ അനുതപിക്കുന്നു
      '4':
        title: ദൈവത്തിന്റെ കരുണയിൽ യോനാ അസ്വസ്ഥനാകുന്നു
    Micah:
      '1':
        title: ശമര്യയെയും യെഹൂദയെയും ദൈവം വിധിക്കുന്നു
      '2':
        title: അത്യാഗ്രഹികളായ ഗൂഢാലോചകരെ മീഖാ കുറ്റംവിധിക്കുന്നു
      '3':
        title: നേതാക്കൾ ജനത്തെ ക്രൂരമായി ചൂഷണം ചെയ്യുന്നു
      '4':
        title: യഹോവ സകല ജനതകൾക്കും മീതെ വാഴുന്നു
      '5':
        title: ബേത്‌ലഹേമിൽനിന്ന് ദാവീദീയ രാജാവ് വരും
      '6':
        title: യഹോവ ഇസ്രായേലിനെതിരെ വ്യവഹാരം ഉന്നയിക്കുന്നു
      '7':
        title: ദുഃഖത്തിനിടയിൽ മീഖാ പ്രാർഥിക്കുന്നു
    Nahum:
      '1':
        title: നിനവേയുടെ കുറ്റത്തിന് ദൈവം ശിക്ഷ നൽകുന്നു
      '2':
        title: ദൂതൻ യെഹൂദയ്ക്കു സമാധാനവാർത്ത കൊണ്ടുവരുന്നു
      '3':
        title: നിനവേ സമ്പൂർണ അപമാനം നേരിടുന്നു
    Habakkuk:
      '1':
        title: ദുഷ്ടഭരണത്തെക്കുറിച്ച് ഹബക്കൂക്ക് വിലപിക്കുന്നു
      '2':
        title: അഹങ്കാരികളായ പീഡകരെ ദൈവം താക്കീതുചെയ്യുന്നു
      '3':
        title: വിശുദ്ധഭയത്തോടെ ഹബക്കൂക്ക് പ്രാർഥിക്കുന്നു
    Zephaniah:
      '1':
        title: പാപം നിമിത്തം ദൈവം യെഹൂദയെ വിധിക്കുന്നു
      '2':
        title: ജനതകൾ ശിക്ഷിക്കപ്പെടുന്നു, എങ്കിലും പ്രത്യാശ നിലനിൽക്കുന്നു
      '3':
        title: ശുദ്ധീകരിക്കപ്പെട്ട ജനത്തെച്ചൊല്ലി സീയോൻ ആനന്ദിക്കുന്നു
    Haggai:
      '1':
        title: തന്റെ ആലയം പുനർനിർമിക്കാൻ യഹോവ ആഹ്വാനം ചെയ്യുന്നു
      '2':
        title: ദൈവാലയ നിർമാതാക്കളെ ദൈവം ധൈര്യപ്പെടുത്തുന്നു
    Zechariah:
      '1':
        title: ദൈവം കരുണയോടെ മടങ്ങിവരുന്നു
      '2':
