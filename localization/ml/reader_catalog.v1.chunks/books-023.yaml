payload:
  book_metadata:
    Gospel of Mary:
      display_name: മറിയത്തിന്റെ സുവിശേഷം
      author: അജ്ഞാതൻ. ഈ കൃതി മറിയത്തെ യേശുവിന്റെ വെളിപ്പാടു സ്വീകരിക്കുകയും വ്യാഖ്യാനിക്കുകയും ചെയ്യുന്നവളായി അവതരിപ്പിക്കുന്നു; എന്നാൽ നിലനിൽക്കുന്ന ഈ സുവിശേഷം മറിയം എഴുതിയതാണെന്ന് അവകാശപ്പെടുന്നില്ല.
      audience: വെളിപ്പാട്, ആത്മീയ ആരോഹണം, അപ്പൊസ്തലിക അധികാരം, യേശുവിന്റെ ശിഷ്യന്മാർക്കിടയിൽ മറിയത്തിന്റെ ഉപദേശത്തിനുള്ള സാധുത എന്നിവയെക്കുറിച്ച് ചിന്തിച്ചിരുന്ന ആദിമ ക്രിസ്തീയ വായനക്കാർ.
      date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിലേതായി കാലനിർണയം ചെയ്യപ്പെടുന്നു; മൂന്നാം നൂറ്റാണ്ടിലെ ഗ്രീക്ക് ശകലങ്ങൾ നിലനിൽക്കുന്നു, പ്രധാന കോപ്റ്റിക് സാക്ഷ്യം അഞ്ചാം നൂറ്റാണ്ടിലെ ബെർലിൻ കോഡെക്സ് 8502-ൽ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
    Treatise on the Resurrection:
      display_name: പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള പ്രബന്ധം
      author: അജ്ഞാതൻ. റെഗിനോസ് എന്നു പേരുള്ള ഒരു ശിഷ്യന് അധ്യാപകൻ എഴുതിയ കത്തിന്റെ രൂപത്തിലാണ് ഈ കൃതി; അധ്യാപകനെയോ റെഗിനോസിനെയോ ഉറപ്പായി തിരിച്ചറിയാനാവില്ല.
      audience: പുനരുത്ഥാനത്തെക്കുറിച്ച് പ്രബോധനം തേടിയിരുന്ന ക്രിസ്ത്യാനികൾ, പ്രത്യേകിച്ച് പുനരുത്ഥാനജീവിതത്തിലെ ശാരീരികവും ആത്മീയവും ഇപ്പോഴത്തെതുമായ പങ്കാളിത്തത്തെ വിലയിരുത്തിയിരുന്ന വായനക്കാർ.
      date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനകാലത്തേതായി (പലപ്പോഴും ഏകദേശം ക്രി.വ. 170–200) കണക്കാക്കുന്നു; അതിനു മുമ്പുണ്ടായിരുന്ന ഒരു ഗ്രീക്ക് കൃതിയുടെ നാലാം നൂറ്റാണ്ടിലെ കോപ്റ്റിക് പകർപ്പിലാണ് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    Dialogue of the Savior:
      display_name: രക്ഷകന്റെ സംവാദം
      author: അജ്ഞാതൻ. യൂദാസ്, മത്തായി, മറിയം എന്നിവരുമായുള്ള സംഭാഷണത്തിൽ വെളിപ്പാടുസംബന്ധമായ ഉപദേശങ്ങൾ യേശുവിന്റെ വാക്കുകളായി ഈ കൃതി അവതരിപ്പിക്കുന്നു; എന്നാൽ അതിന്റെ സമാഹർത്താവിനെ തിരിച്ചറിയിക്കുന്നില്ല.
      audience: സ്വകാര്യ വെളിപ്പാട്, ശിഷ്യത്വം, ആത്മജ്ഞാനം, പ്രാർഥന, രക്ഷയ്ക്കായുള്ള സന്യാസപരമായ ഒരുക്കം എന്നിവയിൽ താത്പര്യമുണ്ടായിരുന്ന ഒരു ആദിമ ക്രിസ്തീയ സമൂഹം.
      date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കപ്പെടുന്നു; എങ്കിലും ഇതിന്റെ രചനാഘട്ടങ്ങളും കൃത്യമായ കാലവും സംബന്ധിച്ച് അഭിപ്രായവ്യത്യാസം തുടരുന്നു. നാലാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് കൈയെഴുത്തുപ്രതിയിലാണ് ഇത് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    Exegesis on the Soul:
      display_name: ആത്മാവിനെക്കുറിച്ചുള്ള വ്യാഖ്യാനം
      author: അജ്ഞാതൻ. ആത്മാവിന്റെ വീഴ്ച, മാനസാന്തരം, പുനഃസ്ഥാപനം എന്നിവയുടെ രൂപകമായി ബൈബിളിലെയും ഗ്രീക്ക് സാഹിത്യത്തിലെയും പ്രതിരൂപങ്ങളെ പുനർവായിക്കുന്ന ഒരു ക്രിസ്തീയ പ്രഭാഷകനാണ് രചയിതാവ്.
      audience: വിശുദ്ധലിഖിതവും ധാർമിക പ്രബോധനവും പരിചിതമായ, ക്രമരഹിതമായ മോഹങ്ങൾ വിട്ട് മാനസാന്തരത്തിലേക്കും ദൈവികതയുമായുള്ള പുനഃസംഗമത്തിലേക്കും വിളിക്കപ്പെട്ടിരുന്ന ക്രിസ്ത്യാനികൾ.
      date: പൊതുവേ ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിലോ മൂന്നാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിലോ ഉള്ളതെന്ന് കാലനിർണയം ചെയ്യപ്പെടുന്നു; ഗ്രീക്കിൽനിന്നുള്ള നാലാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് പരിഭാഷയിലാണ് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    Book of Thomas the Contender:
      display_name: പോരാളിയായ തോമസിന്റെ പുസ്തകം
      author: അജ്ഞാതൻ. കൃതിയുടെ അവസാനത്തിലുള്ള ശീർഷകം അതിനെ യൂദാസ് തോമസുമായി ബന്ധപ്പെടുത്തുകയും മത്തായാസിനെ രേഖപ്പെടുത്തിയവനായി പറയുകയും ചെയ്യുന്നു; എന്നാൽ ഇവ സ്ഥിരീകരിക്കാവുന്ന കർത്തൃത്വാവകാശങ്ങളല്ല, സാഹിത്യപരമായ ആട്രിബ്യൂഷനുകളാണ്.
      audience: ആത്മജ്ഞാനം തേടാനും ശാരീരിക വികാരങ്ങളെ ചെറുക്കാനും തോമസിനുള്ള യേശുവിന്റെ സ്വകാര്യ പ്രബോധനം മനസ്സിലാക്കാനും ആഹ്വാനം ചെയ്യപ്പെട്ട, സന്യാസജീവിതത്തോട് ചായ്‌വുള്ള ക്രിസ്ത്യാനികൾ.
      date: പലപ്പോഴും ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിലോ മൂന്നാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിലോ ഉള്ളതെന്ന് കാലനിർണയം ചെയ്യപ്പെടുന്നു; ഒരുപക്ഷേ സുറിയാനി ക്രിസ്തീയ പശ്ചാത്തലത്തിൽ രൂപപ്പെട്ടതാകാം. നാലാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് കൈയെഴുത്തുപ്രതിയിലാണ് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    Tripartite Tractate:
      display_name: ത്രിഭാഗ പ്രബന്ധം
      author: അജ്ഞാതൻ. രചയിതാവ് ഉന്നതവിദ്യാഭ്യാസം നേടിയ ഒരു വാലന്റീനിയൻ ക്രിസ്തീയ ദൈവശാസ്ത്രജ്ഞനായിരുന്നു; പേരറിയാവുന്ന ഏതെങ്കിലും അധ്യാപകനുമായി അദ്ദേഹത്തെ ഉറപ്പായി തിരിച്ചറിയാനാവില്ല.
      audience: ദൈവം, യുഗസത്തകൾ, സൃഷ്ടി, ക്രിസ്തു, സഭ, രക്ഷ, അന്തിമ പുനഃസ്ഥാപനം എന്നിവയെക്കുറിച്ചുള്ള വിശദമായ പ്രബോധനം സ്വീകരിച്ചിരുന്ന ഒരു വാലന്റീനിയൻ ക്രിസ്തീയ സമൂഹം.
      date: സാധാരണയായി ക്രി.വ. മൂന്നാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കപ്പെടുന്നു; ചില വാദങ്ങൾ ആ നൂറ്റാണ്ടിന്റെ ഉത്തരാർധത്തെ അനുകൂലിക്കുന്നു. നാലാം നൂറ്റാണ്ടിലെ കോപ്റ്റിക് യുങ് കോഡെക്സിലാണ് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    Apocryphon of John:
      display_name: യോഹന്നാന്റെ രഹസ്യഗ്രന്ഥം
      author: അജ്ഞാതൻ. ഉയിർത്തെഴുന്നേറ്റ യേശു സെബെദിയുടെ മകനായ യോഹന്നാനു നൽകിയ വെളിപ്പാടായി ഈ കൃതി വ്യാജനാമത്തിൽ അവതരിപ്പിക്കപ്പെടുന്നു; ഇതിന്റെ ഒന്നിലധികം പുരാതന പാഠരൂപങ്ങൾ നിലനിൽക്കുന്നു.
      audience: ദൈവിക മണ്ഡലം, സൃഷ്ടി, മനുഷ്യന്റെ സ്വത്വം, ശത്രുതാപരമായ ഭരണാധികാരികളിൽനിന്നുള്ള മോചനം എന്നിവയെക്കുറിച്ചുള്ള വിവരണം തേടിയിരുന്ന സേത്തീയമോ അതിനോട് അടുത്ത ബന്ധമുള്ളതോ ആയ വെളിപ്പാടുപാരമ്പര്യത്തിലെ ക്രിസ്ത്യാനികൾ.
      date: ഇതിന്റെ ഒരു ആദ്യകാല രൂപം ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിൽ പ്രചരിച്ചിരുന്നിരിക്കാം; ഹ്രസ്വവും ദീർഘവുമായ പാഠരൂപങ്ങൾ സംരക്ഷിക്കുന്ന, ഇപ്പോൾ നിലനിൽക്കുന്ന കോപ്റ്റിക് സാക്ഷ്യങ്ങൾ നാലും അഞ്ചും നൂറ്റാണ്ടുകളിലേതാണ്.
  chapter_titles:
    Gospel of Philip:
      '17':
        title: യേശു തിന്മ വെളിപ്പെടുത്തി നീക്കുന്നു
      '18':
        title: വിശുദ്ധ ഐക്യം നിത്യപ്രകാശം നൽകുന്നു
    Gospel of Mary:
      '1':
        title: രക്ഷകൻ പാപത്തിനെതിരെ പഠിപ്പിക്കുന്നു
      '2':
        title: യേശു ശിഷ്യന്മാർക്ക് സമാധാനം നൽകുന്നു
      '3':
        title: മറിയം ഉപദേശങ്ങളാൽ ആശ്വസിപ്പിക്കുന്നു
      '4':
        title: ആത്മാവ് മറവിയെ ജയിക്കുന്നു
      '5':
        title: സുവിശേഷം പ്രസംഗിക്കാൻ ലേവി പ്രേരിപ്പിക്കുന്നു
    Treatise on the Resurrection:
      '1':
        title: ക്രിസ്തു യഥാർഥ പൂർത്തീകരണം നൽകുന്നു
      '2':
