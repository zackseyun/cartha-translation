    Gospel of Philip:
      display_name: ഫിലിപ്പോസിന്റെ സുവിശേഷം
      author: അജ്ഞാതൻ. കൈയെഴുത്തുപ്രതിയുടെ അവസാനക്കുറിപ്പിൽ ഈ ശീർഷകം കാണപ്പെടുന്നുണ്ടെങ്കിലും, ഫിലിപ്പോസാണ് ഇതിന്റെ രചയിതാവെന്ന് കൃതി പറയുന്നില്ല. നിലവിലുള്ള ഏക പ്രതി നാഗ് ഹമ്മാദി കോഡെക്സ് II,3-ലെ കോപ്റ്റിക് പാഠമാണ്.
      audience: വാലന്റീനിയൻ ശൈലിയിലുള്ള കൂദാശാപരമായ പ്രബോധനവുമായി—പ്രത്യേകിച്ച് സ്നാനം, അഭിഷേകം, യൂഖാരിസ്റ്റ്, വീണ്ടെടുപ്പ്, പുനരുത്ഥാനം, മണവറയുടെ പ്രതീകഭാഷ എന്നിവയുമായി—പരിചയമുള്ള ഒരു ആദിമ ക്രിസ്തീയ സമൂഹം.
      date: സാധാരണയായി ക്രി.വ. 2-ാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിലോ 3-ാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിലോ ഉള്ളതെന്നു തീയതിനിർണയം ചെയ്യപ്പെടുന്നു; അതിനു മുമ്പുണ്ടായിരുന്ന ഒരു ഗ്രീക്ക് രൂപത്തിൽനിന്ന് വിവർത്തനം ചെയ്ത, 4-ാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് കൈയെഴുത്തുപ്രതിയിലാണ് ഇത് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
