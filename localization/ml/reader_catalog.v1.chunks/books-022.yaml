      '7':
        title: ശത്രുക്കളുടെ അഭിവൃദ്ധിക്കായി പ്രാർഥിക്കുക
      '8':
        title: പഠിപ്പുകൾ വരുംതലമുറയിലെ പുത്രന്മാർക്ക് കൈമാറുക
    Testament of Asher:
      '1':
        title: ആശേർ മക്കളെ നീതിയുടെ വഴിയിൽ ഉപദേശിക്കുന്നു
      '2':
        title: മറച്ചുവെച്ച ദുഷ്ടത പൂർണമായും കുറ്റംവിധിക്കപ്പെടുന്നു
      '3':
        title: ഇരുമനസ്സോടെയുള്ള ജീവിതം ഒഴിവാക്കാൻ ആശേർ കല്പിക്കുന്നു
      '4':
        title: ഭക്തർ ദുഷ്ടതയ്ക്കെതിരെ ഉറച്ചുനിൽക്കുന്നു
      '5':
        title: ആശേർ ദ്വന്ദ്വയാഥാർഥ്യം പഠിപ്പിക്കുന്നു
      '6':
