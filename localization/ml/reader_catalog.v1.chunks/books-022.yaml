      '4':
        title: കരുണയുള്ള സെബൂലൂൻ കുഴിക്ക് കാവൽ നിൽക്കുന്നു
      '5':
        title: കരുണ സെബൂലൂന്റെ കുടുംബത്തെ സുരക്ഷിതരാക്കുന്നു
      '6':
        title: വള്ളം കണ്ടുപിടിച്ചവൻ സമൃദ്ധമായ മീൻപിടിത്തം പങ്കിടുന്നു
      '7':
        title: നിഷ്കളങ്കഹൃദയത്തോടെയുള്ള ഉദാരതയ്ക്ക് സെബൂലൂൻ ആഹ്വാനം ചെയ്യുന്നു
      '8':
        title: സെബൂലൂൻ അനുകമ്പ പഠിപ്പിക്കുന്നു
      '9':
        title: സന്തതികൾക്ക് സെബൂലൂൻ മുന്നറിയിപ്പ് നൽകുന്നു
      '10':
        title: ഭാവിയിലെ വീണ്ടെടുപ്പിനെക്കുറിച്ച് സെബൂലൂൻ പ്രവചിക്കുന്നു
    Testament of Dan:
      '1':
