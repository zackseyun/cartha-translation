      '6':
        title: ദൈവത്തെ ഭയപ്പെടുക; സാത്താന്റെ നുണകൾ തള്ളിക്കളയുക
      '7':
        title: ദാന്റെ അസ്ഥികൾ പൂർവികരോടൊപ്പം വിശ്രമിക്കുന്നു
    Testament of Naphtali:
      '1':
        title: നഫ്താലി തന്റെ പുത്രന്മാരെ അനുഗ്രഹിക്കുന്നു
      '2':
        title: ദൈവം ഓരോ ആത്മാവിനെയും പൂർണതയോടെ രൂപപ്പെടുത്തുന്നു
      '3':
        title: ദുഷ്ടാത്മാക്കളിൽനിന്ന് ഹൃദയങ്ങളെ കാത്തുകൊള്ളുക
      '4':
        title: ദൈവത്തിന്റെ രക്ഷയോടെ പ്രവാസം അവസാനിക്കുന്നു
      '5':
        title: ലേവിയും യെഹൂദയും യോസേഫും ഉന്നതരാകുന്നു
      '6':
        title: കൊടുങ്കാറ്റ് യാക്കോബിന്റെ കുടുംബത്തെ ചിതറിക്കുന്നു
      '7':
        title: നഫ്താലി ഇരുണ്ട സത്യങ്ങൾ മറച്ചുവെക്കുന്നു
      '8':
        title: ദൈവത്തെ ആദരിക്കാൻ ജ്ഞാനം തേടുക
      '9':
        title: നഫ്താലിയുടെ അസ്ഥികൾ സ്വദേശത്തേക്കു മടങ്ങുന്നു
    Testament of Gad:
      '1':
        title: വിദ്വേഷത്തിന്റെ വിഷത്തെക്കുറിച്ച് ഗാദ് മുന്നറിയിപ്പ് നൽകുന്നു
      '2':
        title: യോസേഫിനെ വഞ്ചിച്ചതായി ഗാദ് ഏറ്റുപറയുന്നു
      '3':
        title: ആത്മാവിനെ വിഴുങ്ങുന്ന വിദ്വേഷം ഒഴിവാക്കുക
