status: reviewed
payload:
  book_metadata:
    Gospel of Truth:
      display_name: സത്യത്തിന്റെ സുവിശേഷം
      author: അജ്ഞാതൻ; വാലെന്റിനസോ അദ്ദേഹത്തിന്റെ പാരമ്പര്യത്തിലുള്ളവരോ രചിച്ചതായി പരക്കെ കണക്കാക്കപ്പെടുന്നു.
      audience: വാലെന്റീനിയൻ ജ്ഞാനവാദ പ്രസ്ഥാനത്തിലെ ക്രിസ്തീയ വായനക്കാർ.
      date: ഏകദേശം ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ മധ്യഭാഗം; നാഗ് ഹമ്മാദിയിൽ സംരക്ഷിക്കപ്പെട്ടു.
    Jubilees:
      display_name: ജൂബിലികൾ
      author: അജ്ഞാതൻ; മോശയ്ക്ക് സീനായിൽ ലഭിച്ച വെളിപ്പാടായി അവതരിപ്പിക്കപ്പെടുന്നു.
      audience: 364 ദിവസമുള്ള സൗരകലണ്ടറും കർശനമായ ഹലാഖയും പാലിച്ചിരുന്ന യഹൂദസമൂഹങ്ങൾ (ഒരുപക്ഷേ കുമ്രാനിലേതുപോലുള്ള പശ്ചാത്തലത്തിൽപ്പെട്ടവർ).
      date: ഏകദേശം ക്രി.മു. രണ്ടാം നൂറ്റാണ്ടിന്റെ മധ്യഭാഗം; ഗഈസ് (എത്യോപ്യൻ) ഭാഷയിൽ പൂർണരൂപത്തിൽ സംരക്ഷിക്കപ്പെട്ടു.
  chapter_titles:
    Gospel of Thomas:
      '49':
        title: ഏകാകികളായ തിരഞ്ഞെടുക്കപ്പെട്ടവർ രാജ്യം കണ്ടെത്തും
      '50':
        title: യേശു പ്രകാശത്തെക്കുറിച്ച് സംസാരിക്കുന്നു
      '51':
        title: മരിച്ചവരുടെ വിശ്രമം അറിയാതെ വരുന്നു
      '52':
        title: സംസാരിക്കുന്ന മരിച്ചവരുടെ ഇടയിൽ ജീവിക്കുന്നത്
      '53':
        title: ശിഷ്യർ പരിച്ഛേദനയെക്കുറിച്ച് ചോദിക്കുന്നു
      '54':
        title: യേശു ദരിദ്രരെ അനുഗ്രഹിക്കുന്നു
      '55':
        title: വെറുക്കുക, അല്ലെങ്കിൽ ക്രിസ്തുവിനെ അനുഗമിക്കുക
      '56':
        title: ലോകം ശവമാണെന്ന് കണ്ടെത്തുന്നവന് അത് അയോഗ്യം
      '57':
        title: അധ്വാനിക്കുന്നവൻ അനുഗൃഹീതൻ
      '58':
        title: യേശു കഠിനാധ്വാനത്തെ അനുഗ്രഹിക്കുന്നു
      '59':
        title: ജീവിച്ചിരിക്കുമ്പോൾ ജീവനുള്ളവനെ അന്വേഷിക്കുക
      '60':
        title: ശമര്യക്കാരൻ കുഞ്ഞാടിനെ യെഹൂദ്യയിലേക്ക് കൊണ്ടുപോകുന്നു
      '61':
        title: യേശു ശലോമെയെ പ്രകാശത്തെക്കുറിച്ച് പഠിപ്പിക്കുന്നു
      '62':
        title: രഹസ്യങ്ങൾ രഹസ്യമായി വെളിപ്പെടുത്തപ്പെടുന്നു
      '63':
        title: ഒരുക്കമില്ലാതെ ധനികൻ മരിക്കുന്നു
      '64':
        title: യജമാനൻ അപ്രതീക്ഷിത അതിഥികളെ ക്ഷണിക്കുന്നു
      '65':
        title: നല്ല മനുഷ്യന്റെ മുന്തിരിത്തോട്ടം നശിപ്പിക്കപ്പെടുന്നു
      '66':
        title: തിരസ്കരിക്കപ്പെട്ട കല്ല് എനിക്കു കാണിച്ചുതരൂ
      '67':
        title: എല്ലാം അറിഞ്ഞിട്ടും സ്വയം അറിയാത്തവൻ
      '68':
        title: പീഡിപ്പിക്കപ്പെടുന്നവർ അനുഗൃഹീതർ
      '69':
        title: വിശക്കുന്ന ആത്മാക്കൾ അനുഗൃഹീതർ
      '70':
        title: യേശു ആന്തരിക ദാരിദ്ര്യത്തെക്കുറിച്ച് സംസാരിക്കുന്നു
      '71':
        title: വീട് തകരുമെന്ന് യേശു പ്രവചിക്കുന്നു
      '72':
        title: സ്വത്ത് വിഭജിക്കാൻ യേശു വിസമ്മതിക്കുന്നു
      '73':
        title: കൂടുതൽ വേലക്കാരെ അയയ്ക്കാൻ യേശു പ്രേരിപ്പിക്കുന്നു
      '74':
        title: ദാഹിക്കുന്ന ജനക്കൂട്ടമുണ്ടെങ്കിലും കിണർ ശൂന്യം
      '75':
        title: ഏകാകികൾ മണവറയിൽ പ്രവേശിക്കുന്നു
      '76':
        title: എന്നേക്കും നിലനിൽക്കുന്ന നിധി അന്വേഷിക്കുക
      '77':
        title: യേശു ദിവ്യപ്രകാശമായി സംസാരിക്കുന്നു
      '78':
        title: മൃദുവസ്ത്രങ്ങളെക്കുറിച്ച് യേശു ചോദിക്കുന്നു
      '79':
        title: സത്യം സഹിക്കുന്ന സ്ത്രീ അനുഗൃഹീത
      '80':
        title: ശരീരം കണ്ടെത്തുന്നവന് ലോകം അയോഗ്യം
      '81':
        title: സമ്പത്തും അധികാരവും സംബന്ധിച്ച യേശുവിന്റെ വൈരുധ്യം
      '82':
        title: അടുത്തിരിക്കുന്നവർക്ക് തീ സമീപം
      '83':
        title: രൂപങ്ങൾ വെളിപ്പെടുന്നു, പക്ഷേ പ്രകാശം മറഞ്ഞിരിക്കുന്നു
      '84':
        title: നിങ്ങളുടെ സാദൃശ്യം കാണുന്നത് സന്തോഷം നൽകുന്നു
      '85':
        title: ആദാം മഹാശക്തിയിൽനിന്ന് വന്നു
      '86':
        title: യേശു ഭവനരാഹിത്യത്തെക്കുറിച്ച് സംസാരിക്കുന്നു
      '87':
        title: ശരീരത്തിന്റെയും ആത്മാവിന്റെയും ആശ്രിതത്വം ദയനീയം
      '88':
        title: ദൂതന്മാരും പ്രവാചകന്മാരും വരും
      '89':
        title: ശുദ്ധീകരണത്തെക്കുറിച്ച് യേശു ചോദിക്കുന്നു
      '90':
        title: അന്വേഷകർക്ക് യേശു വിശ്രമം നൽകുന്നു
      '91':
        title: യേശു യഥാർഥ ജ്ഞാനം വെളിപ്പെടുത്തുന്നു
      '92':
        title: അന്വേഷിക്കുക, നിങ്ങൾ കണ്ടെത്തും
      '93':
        title: വിശുദ്ധമായവ വിവേകത്തോടെ നൽകുക
      '94':
        title: അന്വേഷണം കണ്ടെത്തലിലേക്കു നയിക്കുന്നു
      '95':
        title: തിരിച്ചുകിട്ടുമെന്ന് പ്രതീക്ഷിക്കാതെ കടം കൊടുക്കുക
      '96':
        title: രാജ്യം മറഞ്ഞിരിക്കുന്ന പുളിമാവുപോലെ
      '97':
        title: സ്ത്രീ അറിയാതെ മാവ് നഷ്ടപ്പെടുത്തുന്നു
      '98':
        title: മനുഷ്യൻ ആദ്യം തന്റെ ശക്തി പരീക്ഷിക്കുന്നു
      '99':
        title: യഥാർഥ സഹോദരന്മാർ പിതാവിനെ അനുസരിക്കുന്നു
      '100':
        title: നികുതിയെക്കുറിച്ച് യേശു ഉത്തരം പറയുന്നു
      '101':
        title: യഥാർഥ ശിഷ്യനാകാൻ വെറുക്കണം
      '102':
        title: സ്വാർഥരായ പരീശന്മാരെ യേശു ശപിക്കുന്നു
      '103':
        title: ഒരുങ്ങിയിരിക്കുന്ന മനുഷ്യൻ അനുഗൃഹീതൻ
      '104':
        title: മണവാളൻ പോയശേഷം പ്രാർഥിക്കുക
      '105':
        title: ഉൾക്കാഴ്ച പരസ്യമായ അപമാനം വരുത്തുന്നു
      '106':
        title: ഐക്യം പർവതങ്ങളെ നീക്കുന്നു
      '107':
        title: രാജ്യം നഷ്ടപ്പെട്ട ആടിനെ അന്വേഷിക്കുന്നു
      '108':
        title: യേശു മറഞ്ഞിരിക്കുന്ന കാര്യങ്ങൾ വെളിപ്പെടുത്തുന്നു
      '109':
        title: മറഞ്ഞിരുന്ന നിധി സ്വയം വെളിപ്പെടുന്നു
      '110':
        title: കണ്ടെത്തിയ ലൗകികസമ്പത്ത് ഉപേക്ഷിക്കുക
      '111':
        title: അവന്റെ മുമ്പിൽ ആകാശങ്ങൾ ചുരുട്ടപ്പെടുന്നു
      '112':
        title: ജഡത്തെ ആശ്രയിക്കുന്നതിനെതിരെ യേശു മുന്നറിയിപ്പു നൽകുന്നു
      '113':
        title: രാജത്വം ഭൂമിയിൽ വ്യാപിച്ചിരിക്കുന്നു
      '114':
        title: യേശു മറിയത്തെ സമത്വത്തെക്കുറിച്ച് പഠിപ്പിക്കുന്നു
    Gospel of Truth:
      '1':
        title: കൃപ പിതാവിന്റെ സത്യം വെളിപ്പെടുത്തുന്നു
      '2':
        title: മറവിയിൽ തെറ്റ് ശക്തിപ്രാപിക്കുന്നു
      '3':
        title: പിതാവ് മക്കൾക്ക് ജ്ഞാനം വെളിപ്പെടുത്തുന്നു
      '4':
        title: പേരു വിളിക്കപ്പെട്ടവർ വിശ്രമം പ്രാപിക്കുന്നു
      '5':
        title: യേശു എല്ലാവരെയും പൂർണതയിലേക്കു കൊണ്ടുവരുന്നു
      '6':
        title: വചനം തെറ്റിനെ പിളർന്നുകടക്കുന്നു
      '7':
        title: പിതാവിന്റെ നാമം ഉളവാക്കുന്നു
      '8':
        title: ഭീതി ഒന്നുമല്ലെന്ന് പ്രകാശം വെളിപ്പെടുത്തുന്നു
      '9':
        title: അവൻ അവരെ പ്രകാശവും ജീവനും പഠിപ്പിച്ചു
      '10':
        title: ഇടയൻ ആ ഒരേയൊരു ആടിനെ അന്വേഷിക്കുന്നു
      '11':
        title: ഗ്രഹണം അന്ധരെ ഉണർത്തുന്നു
      '12':
        title: പ്രകാശം പാപങ്ങളിൽനിന്നുള്ള വീണ്ടെടുപ്പു നൽകുന്നു
      '13':
        title: അവൻ തന്റെ ഇഷ്ടം പ്രകാശത്തിൽ അരുളുന്നു
      '14':
        title: പിതാവ് പ്രിയപുത്രന് പേരു നൽകുന്നു
      '15':
        title: പിതാവിനുള്ളിൽ സത്യം വിശ്രമിക്കുന്നു
      '16':
        title: ഞാൻ എന്നെത്തന്നെ പിതാവിന് സമർപ്പിക്കുന്നു
    Jubilees:
      '1':
        title: കരുണയ്ക്കായി മോശ അപേക്ഷിക്കുന്നു
      '2':
        title: ഇസ്രായേലിനുള്ള ശബ്ബത്തിന്റെ വിശുദ്ധി
      '3':
        title: ഏദെനിൽ ആദാം ഹവ്വയ്ക്ക് പേരു നൽകുന്നു
      '4':
        title: ഹാനോക്ക് ന്യായവിധിയെക്കുറിച്ച് മുന്നറിയിപ്പു നൽകുന്നു
      '5':
        title: പാപം നിമിത്തം പ്രളയം വിധിക്കപ്പെടുന്നു
      '6':
        title: മഴവില്ല് നോഹയുമായി ഉടമ്പടി സ്ഥാപിക്കുന്നു
      '7':
        title: നീതിയെക്കുറിച്ച് നോഹ തന്റെ സന്തതികൾക്ക് മുന്നറിയിപ്പു നൽകുന്നു
