payload:
  book_metadata:
    Letters of Ignatius:
      display_name: ഇഗ്നേഷ്യസിന്റെ കത്തുകൾ
      author: പൊതുവേ അംഗീകരിക്കപ്പെടുന്ന മധ്യപാഠരൂപത്തിലെ ഏഴ് കത്തുകളുടെ രചയിതാവ് അന്ത്യോക്യയിലെ ബിഷപ്പായ ഇഗ്നേഷ്യസാണ്; പിന്നീട് വികസിപ്പിച്ച പാഠങ്ങളും ഇഗ്നേഷ്യസിന്റെ പേരിൽ മറ്റുള്ളവർ എഴുതിയ കത്തുകളും ഈ സമാഹാരത്തിൽ ഉൾപ്പെടുന്നില്ല.
      audience: രക്തസാക്ഷിത്വത്തിലേക്കുള്ള യാത്രയ്ക്കിടെ ഇഗ്നേഷ്യസ് എഫെസൊസ്, മഗ്നേഷ്യ, ത്രല്ലെസ്, റോം, ഫിലദെൽഫിയ, സ്മിർണ എന്നിവിടങ്ങളിലെ ക്രിസ്തീയസഭകളെയും പോളിക്കാർപ്പിനെയും അഭിസംബോധന ചെയ്തു.
      date: സാധാരണയായി എ.ഡി. രണ്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിലേതായി, മിക്കപ്പോഴും ഏകദേശം എ.ഡി. 105–117 കാലഘട്ടത്തിലേതായി കണക്കാക്കപ്പെടുന്നു; എന്നാൽ ഇഗ്നേഷ്യസിന്റെ യാത്രയുടെ കൃത്യമായ കാലക്രമം ഇപ്പോഴും ചർച്ചാവിഷയമാണ്.
  chapter_titles:
    Epistle of Barnabas:
      '12':
        title: മോശെയുടെ കരങ്ങൾ യേശുവിലേക്കു വിരൽചൂണ്ടുന്നു
      '13':
        title: യാക്കോബിന്റെ അനുഗ്രഹം സ്ഥാനമാറ്റം മുൻകൂട്ടി അറിയിക്കുന്നു
      '14':
        title: യേശു ഹൃദയങ്ങളെ ദൈവത്തിനായി വീണ്ടെടുക്കുന്നു
      '15':
        title: നീതിക്കുശേഷം ശബ്ബത്ത് വിശ്രമം വരുന്നു
      '16':
        title: യഥാർഥ ദേവാലയം വിശ്വാസികളുടെ ഉള്ളിലാണ്
      '17':
        title: രക്ഷ ഇപ്പോൾ വ്യക്തമായി വിശദീകരിക്കുന്നു
      '18':
        title: വെളിച്ചത്തിന്റെ ദൂതന്മാരും ഇരുട്ടിന്റെ അധിപനും
      '19':
        title: വെളിച്ചത്തിന്റെ വഴി സമർപ്പണം ആവശ്യപ്പെടുന്നു
      '20':
        title: ഇരുണ്ട പാത നിത്യനാശത്തിലേക്കു നയിക്കുന്നു
      '21':
        title: മഹത്ത്വത്തിനായി കർത്താവിന്റെ കല്പനകൾ അനുസരിക്കുക
    Letters of Ignatius:
      '1':
        title: ഇഗ്നേഷ്യസ് എഫെസൊസ് സഭയെ അഭിവാദ്യം ചെയ്യുന്നു
      '2':
        title: വിശ്വാസികൾ തടവുകാരനായ ഇഗ്നേഷ്യസിനെ പിന്തുണയ്ക്കുന്നു
      '3':
        title: ഐക്യത്തോടും പ്രാർഥനയോടുംകൂടെ ബിഷപ്പിനെ ആദരിക്കുക
      '4':
        title: ഇഗ്നേഷ്യസ് താഴ്മയോടെ സംസാരിക്കുന്നു
      '5':
        title: യേശുവിന്റെ സ്നേഹത്തിലൂടെ ഐക്യം
      '6':
        title: ബിഷപ്പ് വിശ്വാസികളെ പ്രാർഥനയിൽ ഒന്നിപ്പിക്കുന്നു
      '7':
        title: ശാന്തമായി നയിക്കുന്ന ബിഷപ്പിനെ ആദരിക്കുക
      '8':
        title: വ്യാജ ഉപദേഷ്ടാക്കളുടെ സ്വാധീനത്തെ സൂക്ഷിക്കുക
      '9':
        title: എഫെസൊസുകാരുടെ സമർപ്പണവും ഇഗ്നേഷ്യസും
      '10':
        title: ദുഷിച്ച ഉപദേശം തള്ളി ഉറച്ചുനിൽക്കുക
      '11':
        title: എല്ലാവർക്കുംവേണ്ടി നിരന്തരം പ്രാർഥിക്കുക
      '12':
        title: എല്ലാ ബന്ധനങ്ങൾക്കും മീതെ ക്രിസ്തു
      '13':
        title: ശിക്ഷാവിധിക്കു വിധേയനായവനായി ഇഗ്നേഷ്യസ് എഴുതുന്നു
      '14':
        title: സമാധാനം സാത്താന്റെ തന്ത്രങ്ങളുടെ ശക്തി തകർക്കുന്നു
      '15':
        title: വിശ്വാസം നന്മയിലേക്കും സ്നേഹത്തിലേക്കും നയിക്കുന്നു
      '16':
        title: മൗനത്തിലൂടെ സത്യം ജീവിച്ചുകാണിക്കുക
      '17':
        title: കുടുംബങ്ങളെ തകർക്കുന്നവർ അവകാശികളാകുകയില്ല
      '18':
        title: ദൈവത്തെക്കുറിച്ചുള്ള അറിവ് വിവേകത്തോടെ സ്വീകരിക്കുക
      '19':
        title: ക്രൂശിനുവേണ്ടി സ്വയം ഒന്നുമല്ലെന്നു കരുതുക
      '20':
        title: മറിയവും നക്ഷത്രവും ക്രിസ്തുവിന്റെ വിജയവും
      '21':
        title: വീണ്ടും എഴുതാൻ ഇഗ്നേഷ്യസ് പ്രത്യാശിക്കുന്നു
      '22':
        title: വായനക്കാർക്കുവേണ്ടി ഇഗ്നേഷ്യസ് പ്രാർഥിക്കുന്നു
      '23':
        title: മഗ്നേഷ്യയിലെ സഭ കൃപയാൽ അനുഗ്രഹിക്കപ്പെടുന്നു
      '24':
        title: ഐക്യത്തിനായി ഇഗ്നേഷ്യസ് പ്രാർഥിക്കുന്നു
      '25':
        title: ബിഷപ്പിനായി ഇഗ്നേഷ്യസ് ദൈവത്തിനു നന്ദി പറയുന്നു
      '26':
        title: നിങ്ങളുടെ യുവ ബിഷപ്പിനെ ആദരിക്കുക
      '27':
        title: യഥാർഥ ക്രിസ്ത്യാനികളായി ജീവിക്കുക
      '28':
        title: വിശ്വാസം നിത്യമായ അടയാളം തിരഞ്ഞെടുക്കുന്നു
      '29':
        title: ഇഗ്നേഷ്യസ് സഭയുടെ ഐക്യത്തെ ആശ്ലേഷിക്കുന്നു
      '30':
        title: വിശ്വാസികൾ ബിഷപ്പിന്റെ കീഴിൽ ഒന്നിച്ചുകൂടുന്നു
      '31':
        title: കൃപയിലൂടെ യേശു വെളിപ്പെടുന്നു
      '32':
        title: ഉയിർത്തെഴുന്നേറ്റ ക്രിസ്തുവിലുള്ള പ്രത്യാശ നിലനിൽക്കുന്നു
      '33':
        title: പഴയ പുളിമാവ് നീക്കിക്കളയുക
      '34':
        title: ക്രിസ്തുവെന്ന അടിസ്ഥാനത്തിൽ ഉറച്ചുനിൽക്കുക
      '35':
        title: താഴ്മ വിശ്വാസത്തിൽ സന്തോഷം നൽകുന്നു
      '36':
        title: വിശ്വാസത്തിൽ ബിഷപ്പിനോടു ഒന്നിക്കുക
      '37':
        title: പ്രാർഥനകൾ സഭയ്ക്കു ആശ്വാസം നൽകുന്നു
      '38':
        title: ദൈവിക ഐക്യത്തോടെ സഭകളെ അഭിവാദ്യം ചെയ്യുക
      '39':
        title: യേശുവിന്റെ കഷ്ടാനുഭവത്തിലൂടെ സമാധാനം
      '40':
        title: ചിന്തയിലും ക്ഷമയിലും കുറ്റമറ്റവരാകുക
      '41':
        title: വിശ്വാസികൾ ബിഷപ്പിനെയും ക്രിസ്തുവിനെയും അനുസരിക്കുന്നു
      '42':
        title: നേതാക്കളെ യേശുക്രിസ്തുവിനെപ്പോലെ ആദരിക്കുക
      '43':
        title: അഹങ്കാരത്തെക്കാൾ സൗമ്യത ആഗ്രഹിക്കുക
      '44':
        title: സ്വർഗീയ അറിവിനെ ഇഗ്നേഷ്യസ് ഭയഭക്തിയോടെ സമീപിച്ചു
      '45':
        title: വഴിതെറ്റിക്കുന്ന ഉപദേശങ്ങളെയല്ല, വിശ്വാസത്തെ പോഷിപ്പിക്കുക
      '46':
        title: സഭാനേതൃത്വത്തോടു വിശ്വസ്തരായി തുടരുക
      '47':
        title: സൗമ്യത ആയുധമാക്കുക
      '48':
        title: ക്രിസ്തു മാത്രം യഥാർഥ ജീവൻ നൽകുന്നു
      '49':
        title: യഥാർഥ കഷ്ടാനുഭവം ക്രിസ്തുവിന്റെ യാഥാർഥ്യം തെളിയിക്കുന്നു
      '50':
        title: വ്യാജ ഉപദേഷ്ടാക്കളുടെ മാരകഫലം ഒഴിവാക്കുക
      '51':
        title: പ്രാർഥനയിലും സമർപ്പണത്തിലും ഒന്നിക്കുക
      '52':
        title: സ്നേഹത്തോടെ ബിഷപ്പിനു കീഴടങ്ങുക
      '53':
        title: റോമിലെ വിശ്വസ്തസഭയ്ക്ക് അഭിവാദ്യം
      '54':
        title: എന്റെ യാത്രയുടെ അന്ത്യത്തിനായി പ്രാർഥിക്കുക
      '55':
        title: മനുഷ്യരുടെതല്ല, ദൈവത്തിന്റെ അംഗീകാരം തേടുക
      '56':
        title: ആന്തരിക ശക്തിക്കായി പ്രാർഥിക്കുക
      '57':
        title: ദൈവത്തിനുവേണ്ടി മനസ്സോടെ മരണത്തെ നേരിടുക
      '58':
        title: ഇഗ്നേഷ്യസ് കഷ്ടാനുഭവത്തെ സ്വാഗതം ചെയ്യുന്നു
      '59':
        title: ക്രിസ്തുവിനുവേണ്ടി ലൗകിക മോഹങ്ങളെ ക്രൂശിക്കുക
      '60':
        title: ഇഗ്നേഷ്യസ് ലൗകിക മോഹങ്ങളെ നിരസിക്കുന്നു
      '61':
        title: വിശ്വസ്തതയോടെ കഷ്ടം സഹിക്കാൻ ഇഗ്നേഷ്യസ് ആഗ്രഹിക്കുന്നു
      '62':
        title: സിറിയയിലെ സഭയ്ക്ക് ഇടയപരിപാലനം ലഭിക്കാൻ പ്രാർഥിക്കുക
      '63':
        title: സ്മിർണയിൽനിന്ന് സിറിയയ്ക്ക് അഭിവാദ്യം
      '64':
        title: ഐക്യത്തിനായി ഫിലദെൽഫിയ പ്രശംസിക്കപ്പെടുന്നു
      '65':
        title: ബിഷപ്പ് സദ്ഗുണത്തോടെ ദൈവത്തെ സേവിക്കുന്നു
      '66':
        title: നിങ്ങളുടെ ഇടയനെ വിശ്വസ്തതയോടെ അനുഗമിക്കുക
      '67':
        title: ഹാനികരമായ ഉപദേശങ്ങൾ നിരസിക്കുക
      '68':
        title: ഒരുമിച്ച് ഒരേ യൂഖാരിസ്റ്റിൽ പങ്കുചേരുക
      '69':
        title: യേശുക്രിസ്തുവിനുവേണ്ടിയുള്ള ബന്ധനങ്ങളിൽ ആനന്ദിക്കുക
      '70':
        title: യഹൂദമതത്തെ നിരസിച്ച് ക്രിസ്തുവിനെ സ്വീകരിക്കുക
      '71':
        title: ആത്മാവ് മറഞ്ഞിരിക്കുന്ന സത്യങ്ങൾ വെളിപ്പെടുത്തുന്നു
      '72':
        title: ഐക്യം വിഭാഗീയതയെ നിരസിക്കുന്നു
      '73':
        title: ക്രിസ്തു എല്ലാവരെയും ദൈവത്തിൽ ഒന്നിപ്പിക്കുന്നു
      '74':
