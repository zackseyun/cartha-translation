payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: തോമാസിന്റെ ബാല്യകാല സുവിശേഷം
      author: രചയിതാവ് അജ്ഞാതൻ. കണ്ടെത്താനാകുന്ന ഇതിന്റെ ഏറ്റവും ആദ്യകാല രൂപത്തിൽ രചയിതാവിന്റെ പേര് പറയുന്നില്ല; തോമാസിന്റെ പേരിലുള്ള രചനയെന്ന വിശേഷണം പിൽക്കാല കൈയെഴുത്തുപ്രതികളുടെ ശീർഷകങ്ങളിലും പകർന്നുപോന്ന പാരമ്പര്യത്തിലുമാണ് കാണുന്നത്.
      audience: യേശുവിന്റെ ബാല്യകാലത്തെക്കുറിച്ചും, അംഗീകൃത സുവിശേഷവിവരണങ്ങൾ ആരംഭിക്കുന്നതിനു മുമ്പുള്ള ദൈവിക ശക്തി, ശിക്ഷണം, പഠനം, പക്വതയിലേക്കുള്ള വളർച്ച എന്നിവ എങ്ങനെ വിവരിക്കാമെന്നതിനെക്കുറിച്ചും അറിയാൻ ആഗ്രഹിച്ച ക്രിസ്ത്യാനികൾ.
      date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കപ്പെടുന്നു; എന്നാൽ പരസ്പരം ഗണ്യമായി വ്യത്യസ്തമായ പല ഗ്രീക്ക് പാഠരൂപങ്ങളിലും ആദ്യകാല വിവർത്തനങ്ങളിലുമാണ് ഈ കൃതി നിലനിൽക്കുന്നത്.
    Acts of Paul and Thecla:
      display_name: പൗലോസിന്റെയും തെക്ലയുടെയും പ്രവൃത്തികൾ
      author: രചയിതാവ് അജ്ഞാതൻ. ഇത് കൂടുതൽ വിപുലമായ ‘പൗലോസിന്റെ പ്രവൃത്തികൾ’ എന്ന കൃതിയിലെ ഒരു സംഭവവിവരണമാണ്; ഒരു പ്രെസ്ബിറ്റർ ആ കൃതി രചിച്ചതായി പറയുന്ന പുരാതന റിപ്പോർട്ടുകൊണ്ട് രചയിതാവിനെ ഉറപ്പായി തിരിച്ചറിയാൻ കഴിയില്ല.
      audience: അപ്പൊസ്തലിക പ്രസംഗം, ബ്രഹ്മചര്യം, സ്നാനം, രക്തസാക്ഷിത്വത്തോടു സമാനമായ സഹനം, പഠിപ്പിക്കാനും സാക്ഷ്യം വഹിക്കാനുമുള്ള ഒരു സ്ത്രീയുടെ അധികാരം എന്നിവയെക്കുറിച്ചുള്ള കഥകളിൽ താത്പര്യമുണ്ടായിരുന്ന ക്രിസ്ത്യാനികൾ.
      date: ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിൽ, ഒരുപക്ഷേ അതിന്റെ ഉത്തരാർധത്തിൽ, രചിക്കപ്പെട്ടു; ‘പൗലോസിന്റെ പ്രവൃത്തികൾ’ എന്ന കൃതിയുടെ ഭാഗമായും സ്വതന്ത്ര കൃതിയായും ഇത് പ്രചരിച്ചു.
    Gospel of Peter:
      display_name: പത്രോസിന്റെ സുവിശേഷം
      author: രചയിതാവ് അജ്ഞാതൻ. നിലനിൽക്കുന്ന വിവരണം പത്രോസിന്റെ ശബ്ദത്തിലാണ് സംസാരിക്കുന്നത്; അദ്ദേഹത്തിന്റെ പേരിലാണ് ഇത് പകർന്നുപോന്നതും. എങ്കിലും ചരിത്രപുരുഷനായ അപ്പൊസ്തലൻ പത്രോസ് രചിച്ച കൃതിയായി ഇതിനെ കണക്കാക്കുന്നില്ല.
      audience: പീഡാനുഭവത്തിന്റെയും പുനരുത്ഥാനത്തിന്റെയും വിപുലമായ ഒരു വിവരണത്തിൽ താത്പര്യമുണ്ടായിരുന്ന ആദിമ ക്രിസ്ത്യാനികൾ; ഒരുപക്ഷേ പത്രോസിന്റെ അധികാരത്തിന് പ്രത്യേക പ്രാധാന്യമുണ്ടായിരുന്ന സമൂഹങ്ങളിലുള്ളവർ.
      date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കപ്പെടുന്നു; നിലനിൽക്കുന്ന പ്രധാന ഗ്രീക്ക് ശകലം അഖ്മീമിൽ കണ്ടെത്തിയ, ഏറെ പിൽക്കാലത്തുള്ള ഒരു കൈയെഴുത്തുപ്രതിയിൽനിന്നാണ്.
    2 Clement:
      display_name: 2 ക്ലെമന്റ്
      author: രചയിതാവ് അജ്ഞാതൻ. പരമ്പരാഗത ശീർഷകം അങ്ങനെയാണെങ്കിലും, ഇത് റോമിലെ ക്ലെമന്റ് എഴുതിയ രണ്ടാമത്തെ ലേഖനമല്ല; മറിച്ച് ഒരു ആദിമ ക്രിസ്തീയ പ്രസംഗമാണ്.
      audience: മാനസാന്തരം, ധാർമികമായ സ്ഥിരത, ദുർബലരോടുള്ള കരുതൽ, പുനരുത്ഥാനത്തിലും ന്യായവിധിയിലുമുള്ള പ്രത്യാശയോടെ വിശ്വസ്തമായി സഹിച്ചുനിൽക്കൽ എന്നിവയ്ക്കായി പ്രബോധിപ്പിക്കപ്പെടുന്ന ഒരു ക്രിസ്തീയ സഭാസമൂഹം.
      date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ ആദ്യപകുതിയിലോ മധ്യത്തിലോ ഉള്ളതായി കണക്കാക്കപ്പെടുന്നു (ഏകദേശം ക്രി.വ. 100–160); രചനാസ്ഥലം അനിശ്ചിതമാണ്.
    Epistle of Barnabas:
      display_name: ബർണബാസിന്റെ ലേഖനം
      author: രചയിതാവ് അജ്ഞാതൻ. ഈ കൃതി പരമ്പരാഗതമായി പൗലോസിന്റെ സഹപ്രവർത്തകനായ ബർണബാസുമായി ബന്ധപ്പെടുത്തിയിരുന്നെങ്കിലും, ആ രചനാകർത്തൃത്വം ആധുനിക പണ്ഡിതലോകം അംഗീകരിക്കുന്നില്ല.
      audience: യിസ്രായേലിന്റെ തിരുവെഴുത്തുകളെ ക്രിസ്തുവിനെ കേന്ദ്രീകരിച്ചും ആലങ്കാരികമായും വ്യാഖ്യാനിച്ച് തങ്ങളുടേതായി സ്വീകരിക്കാനും, തങ്ങളുടെ ഉടമ്പടി-സ്വത്വത്തെ യഹൂദ ആചാരങ്ങളിൽനിന്ന് വേർതിരിച്ചറിയാനും പഠിപ്പിക്കപ്പെട്ടിരുന്ന യഹൂദേതര ക്രിസ്ത്യാനികൾ.
      date: സാധാരണയായി ക്രി.വ. 70-ലെ യെരൂശലേം ദേവാലയനാശത്തിനും രണ്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിനും ഇടയിലുള്ള കാലത്തേതായി, പലപ്പോഴും ഏകദേശം ക്രി.വ. 80–130 കാലഘട്ടത്തിലേതായി, കണക്കാക്കപ്പെടുന്നു.
  chapter_titles:
    Protoevangelium of James:
      '11':
        title: മറിയത്തിന്റെ വിശുദ്ധ ദൗത്യം ദൂതൻ അറിയിക്കുന്നു
      '12':
        title: മറിയം എലിസബത്തിനെ സന്ദർശിച്ച് മടങ്ങുന്നു
      '13':
        title: മറിയം ഗർഭിണിയായതിൽ യോസേഫ് വിലപിക്കുന്നു
      '14':
        title: സ്വപ്നത്തിൽ ദൂതൻ യോസേഫിനോടു സംസാരിക്കുന്നു
      '15':
        title: യോസേഫ് തെറ്റുചെയ്തെന്ന് പുരോഹിതൻ കുറ്റപ്പെടുത്തുന്നു
      '16':
        title: പരിശോധനയ്ക്കുശേഷം യോസേഫ് മറിയത്തെ വിട്ടയക്കുന്നു
      '17':
        title: മറിയം ബേത്‌ലഹേമിലേക്കു യാത്രചെയ്യുന്നു
      '18':
        title: നിശ്ചലമായ ലോകം യോസേഫ് കാണുന്നു
      '19':
        title: കന്യകാപ്രസവം പ്രസവസഹായിക കാണുന്നു
      '20':
        title: മറിയത്തെ പരിശോധിച്ച ശലോമെയുടെ കൈ പൊള്ളുന്നു
      '21':
        title: നവജാതനായ രാജാവിനെ ജ്ഞാനികൾ അന്വേഷിക്കുന്നു
      '22':
        title: ശിശുക്കളെ കൊല്ലാൻ ഹെരോദാവ് കല്പിക്കുന്നു
      '23':
        title: ഹെരോദാവിന്റെ ഭീഷണി സെഖര്യാവ് നേരിടുന്നു
      '24':
        title: വിശുദ്ധമന്ദിരത്തിൽ സെഖര്യാവ് കൊല്ലപ്പെടുന്നു
      '25':
        title: കലാപകാലത്ത് യാക്കോബ് വിവരണം എഴുതുന്നു
      '26':
        title: ബോഡ്മർ പപ്പൈറസിൽ ഹ്രസ്വപാഠം കാണപ്പെടുന്നു
      '27':
        title: യോസേഫ് ബേത്‌ലഹേമിൽ പ്രസവസഹായികയെ അന്വേഷിക്കുന്നു
      '28':
        title: മറിയത്തിന്റെ അത്ഭുതം യോസേഫ് വിശദീകരിക്കുന്നു
      '29':
        title: ശിശുവിനെ തൊട്ട് ശലോമെ സൗഖ്യം പ്രാപിക്കുന്നു
      '30':
        title: യഹൂദരുടെ രാജാവിനെ ജ്ഞാനികൾ അന്വേഷിക്കുന്നു
    Infancy Gospel of Thomas:
      '1':
        title: തോമാസ് യേശുവിനെക്കുറിച്ച് പറയുന്നു
      '2':
        title: യേശു വെള്ളം തെളിയിച്ച് പക്ഷികളെ രൂപപ്പെടുത്തുന്നു
      '3':
        title: യേശു അന്നാസിന്റെ മകനെ ശപിക്കുന്നു
      '4':
        title: യേശു ശപിച്ച കുട്ടി മരിക്കുന്നു
      '5':
        title: യേശു യോസേഫിനെ ജ്ഞാനം പഠിപ്പിക്കുന്നു
      '6':
        title: യേശുവിന്റെ ജ്ഞാനത്തിനുമുന്നിൽ അധ്യാപകൻ വിഷമിക്കുന്നു
      '7':
        title: യേശുവിന്റെ ശ്രേഷ്ഠജ്ഞാനം അധ്യാപകൻ സമ്മതിക്കുന്നു
      '8':
        title: യേശു ചിരിക്കുകയും സൗഖ്യമാക്കുകയും പ്രഖ്യാപിക്കുകയും ചെയ്യുന്നു
      '9':
        title: വീണുപോയ സീനോയെ യേശു ജീവിപ്പിക്കുന്നു
      '10':
        title: മരംവെട്ടുകാരന്റെ കാൽ യേശു സൗഖ്യമാക്കുന്നു
      '11':
        title: പൊട്ടിയ കുടം യേശു അത്ഭുതകരമായി നിറയ്ക്കുന്നു
      '12':
        title: യേശു വിതച്ച വിത്തിൽനിന്ന് യോസേഫ് വിളവെടുക്കുന്നു
      '13':
        title: യേശുവിന്റെ സഹായത്തോടെ യോസേഫ് കിടക്ക പൂർത്തിയാക്കുന്നു
      '14':
        title: യേശുവിനെ വെല്ലുവിളിച്ച അധ്യാപകൻ മരിക്കുന്നു
      '15':
