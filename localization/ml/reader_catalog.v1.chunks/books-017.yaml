payload:
  book_metadata:
    2 Baruch:
      display_name: 2 ബാരൂക്ക്
      author: അജ്ഞാതൻ; യിരെമ്യാവിന്റെ എഴുത്തുകാരനായ ബാരൂക്കിന്റെ പേരിൽ രചിക്കപ്പെട്ടതായി കരുതപ്പെടുന്നു.
      audience: ക്രി.വ. 70-ൽ ദേവാലയം നശിപ്പിക്കപ്പെട്ടശേഷം പ്രവാസത്തിന്റെ അർഥം ദൈവശാസ്ത്രപരമായി മനസ്സിലാക്കാൻ ശ്രമിച്ച യഹൂദർ.
      date: ഏകദേശം ക്രി.വ. ഒന്നാം നൂറ്റാണ്ടിന്റെ അവസാനം മുതൽ രണ്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭം വരെ; പ്രധാനമായും സുറിയാനി ഭാഷയിൽ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
  chapter_titles:
    1 Enoch:
      '81':
        title: ഹാനോക്ക് സ്വർഗീയ ഫലകങ്ങൾ വായിക്കുന്നു
      '82':
        title: സംരക്ഷിച്ചുവെക്കാൻ ഹാനോക്ക് മെഥൂശലഹിനോട് കല്പിക്കുന്നു
      '83':
        title: ഭൂമി നശിപ്പിക്കപ്പെടുന്നത് ഹാനോക്ക് കാണുന്നു
      '84':
        title: ഹാനോക്ക് പരിശുദ്ധനായ ദൈവത്തെ വാഴ്ത്തുന്നു
      '85':
        title: കുടുംബത്തിന്റെ ഭാവിയെക്കുറിച്ച് ഹാനോക്ക് സ്വപ്നം കാണുന്നു
      '86':
        title: നക്ഷത്രങ്ങൾ വീണ് കന്നുകാലികളുടെ ഇടയിൽ മേയുന്നു
      '87':
        title: ഏഴ് സ്വർഗീയ ജീവികൾ ഗോപുരം കാണിച്ചുകൊടുക്കുന്നു
      '88':
        title: ദൂതൻ വീണ നക്ഷത്രത്തെ പിടികൂടുന്നു
      '89':
        title: മൃഗപ്രതീകങ്ങൾ ഹാനോക്ക് കാണുന്നു
      '90':
        title: ഇടയന്മാർ ആട്ടിൻകൂട്ടത്തെ ദുർഭരണം ചെയ്യുന്നു; ആടുകൾ പുനഃസ്ഥാപിക്കപ്പെടുന്നു
      '91':
        title: ഭാവിയിലെ ശിക്ഷകൾ ഹാനോക്ക് വെളിപ്പെടുത്തുന്നു
      '92':
        title: നീതിമാന്മാരുടെ തലമുറകൾക്കായി ഹാനോക്ക് എഴുതുന്നു
      '93':
        title: ആഴ്ചകൾ ചരിത്രത്തിന്റെയും ന്യായവിധിയുടെയും രൂപരേഖ നൽകുന്നു
      '94':
        title: ദുഷ്ടവഴികൾക്കുപകരം നീതി തിരഞ്ഞെടുക്കുക
      '95':
        title: വരാനിരിക്കുന്ന ശിക്ഷാവിധിയെച്ചൊല്ലി ഹാനോക്ക് കരയുന്നു
      '96':
        title: നീതിമാന്മാർ പാപികൾക്കുമീതെ ഉയർന്നുപറക്കും
      '97':
        title: നീതിമാന്മാർ ആനന്ദിക്കുന്നു; പാപികൾ വീഴുന്നു
      '98':
        title: ആഡംബരം ലജ്ജയും നാശവും വരുത്തുന്നു
      '99':
        title: ദുഷ്പ്രവൃത്തിക്കാർക്കെതിരെ അയ്യോ എന്ന പ്രഖ്യാപനങ്ങൾ
      '100':
        title: ദൂതന്മാർ ദുഷ്ടരെ വിധിക്കുകയും നീതിമാന്മാരെ കാക്കുകയും ചെയ്യുന്നു
      '101':
        title: ദൈവത്തെ ഭയപ്പെടുക; തിന്മ ചെയ്യുന്നത് നിർത്തുക
      '102':
        title: ന്യായവിധിദിവസത്തിൽ നീതിമാന്മാർ ആനന്ദിക്കുന്നു
      '103':
        title: ശാശ്വതമായ നീതീകരണം ഹാനോക്ക് പ്രഖ്യാപിക്കുന്നു
      '104':
        title: പാപത്തിനെതിരെ ഹാനോക്ക് മുന്നറിയിപ്പു നൽകുന്നു
      '105':
        title: മഹത്ത്വത്തിന്റെ മുമ്പാകെ പേരുകൾ സ്ഥാപിക്കപ്പെടുന്നു
      '106':
        title: ഭാവിപ്രത്യാശയുടെ അടയാളമായി നോഹയ്ക്ക് പേരിടുന്നു
      '107':
        title: അവസാന തലമുറ പുനഃസ്ഥാപനം കൊണ്ടുവരുന്നു
      '108':
        title: ഹാനോക്ക് അന്തിമ മുന്നറിയിപ്പ് എഴുതുന്നു
    2 Baruch:
      '1':
        title: ദൈവം ബാരൂക്കിനും യെഹൂദയ്ക്കും മുന്നറിയിപ്പു നൽകുന്നു
      '2':
        title: പുറപ്പെട്ടുപോകാൻ കർത്താവ് ബാരൂക്കിനോട് കല്പിക്കുന്നു
      '3':
        title: യെരൂശലേമിന്റെ വിധിയെക്കുറിച്ച് ബാരൂക്ക് അപേക്ഷിക്കുന്നു
      '4':
        title: മറഞ്ഞിരിക്കുന്ന നഗരത്തിന്റെ യാഥാർഥ്യം കർത്താവ് വെളിപ്പെടുത്തുന്നു
      '5':
        title: ബാരൂക്ക് യിരെമ്യാവിന്റെ സംഘത്തോടൊപ്പം കരയുന്നു
      '6':
        title: സീയോനെ കാക്കുന്ന ദൂതന്മാരെ ബാരൂക്ക് കാണുന്നു
      '7':
        title: സീയോനെ മറിച്ചിടാൻ ദൂതന്മാർക്ക് കല്പന ലഭിക്കുന്നു
      '8':
        title: സ്വർഗീയരൂപം വിശുദ്ധവസ്തുക്കൾ നീക്കംചെയ്യുന്നു
      '9':
        title: യിരെമ്യാവും ബാരൂക്കും ഒരുമിച്ച് വിലപിക്കുന്നു
      '10':
        title: സീയോന്റെ ശൂന്യതയെച്ചൊല്ലി ബാരൂക്ക് അതിയായി വിലപിക്കുന്നു
      '11':
        title: ബാബിലോണിന്റെ അഭിവൃദ്ധിയെച്ചൊല്ലി ബാരൂക്ക് വിലപിക്കുന്നു
      '12':
        title: വരാനിരിക്കുന്ന ക്രോധത്തെക്കുറിച്ച് ബാരൂക്ക് മുന്നറിയിപ്പു നൽകുന്നു
      '13':
        title: ഭാവിയിൽ സാക്ഷ്യം വഹിക്കുന്നതിനെക്കുറിച്ച് ദൈവം ബാരൂക്കിനു കാണിച്ചുകൊടുക്കുന്നു
      '14':
        title: നീതിമാനായിരിക്കുന്നതിന്റെ പ്രയോജനം ബാരൂക്ക് ചോദ്യം ചെയ്യുന്നു
      '15':
        title: പാപികളുടെ ഉത്തരവാദിത്വം കർത്താവ് വിശദീകരിക്കുന്നു
      '16':
        title: ഭാവിയിലെ മഹത്ത്വത്താൽ ബാരൂക്കിന് ധൈര്യം ലഭിക്കുന്നു
      '17':
        title: ആയുസ്സിന്റെ അർഥം ബാരൂക്ക് മനസ്സിലാക്കുന്നു
      '18':
        title: ദൈവികപ്രകാശത്തെക്കുറിച്ച് ബാരൂക്ക് വിശദീകരിക്കുന്നു
      '19':
        title: ദൈവം ഓരോരുത്തരെയും വിധിക്കുന്നു
      '20':
        title: വേഗത്തിൽ വരാനിരിക്കുന്ന ന്യായവിധി ദൈവം വാഗ്ദാനം ചെയ്യുന്നു
      '21':
        title: കിദ്രോൻ താഴ്‌വരയ്ക്കരികെ ബാരൂക്ക് പ്രാർഥിക്കുന്നു
      '22':
        title: മുകളിൽനിന്നുള്ള ശബ്ദം ബാരൂക്ക് അനുസരിക്കുന്നു
      '23':
        title: കാത്തിരിക്കുന്ന എല്ലാ തലമുറകളെയും ദൈവം ഓർക്കുന്നു
      '24':
        title: ഭാവിയിലെ ന്യായവിധി ബാരൂക്ക് കാണുന്നു
      '25':
        title: അവസാനംവരെ ബാരൂക്ക് സംരക്ഷിക്കപ്പെടുന്നു
      '26':
        title: കഷ്ടകാലത്തിന്റെ ദൈർഘ്യം ബാരൂക്ക് ചോദിക്കുന്നു
      '27':
        title: വരാനിരിക്കുന്ന കാലത്തിലെ സംഭവങ്ങൾ ബാരൂക്ക് വിവരിക്കുന്നു
      '28':
        title: നശിക്കാത്തതിനെക്കുറിച്ച് ബാരൂക്ക് ചോദിക്കുന്നു
      '29':
        title: ഭൂമി സമൃദ്ധിയാൽ നിറഞ്ഞുകവിഞ്ഞൊഴുകുന്നു
      '30':
        title: മശിഹായോടൊപ്പം ആത്മാക്കൾ ഉയിർക്കുന്നു
      '31':
        title: ബാരൂക്ക് മൂപ്പന്മാരെ സീയോനിലേക്കു കൂട്ടിവരുത്തുന്നു
      '32':
        title: ദൈവത്തിന്റെ ന്യായപ്രമാണത്തിലൂടെ സുരക്ഷിതരായിരിക്കുക
      '33':
        title: തങ്ങിനിൽക്കാൻ ജനം ബാരൂക്കിനോട് അപേക്ഷിക്കുന്നു
      '34':
        title: ബാരൂക്ക് കരയുകയും ജനത്തെ ആശ്വസിപ്പിക്കുകയും ചെയ്യുന്നു
      '35':
        title: സീയോന്റെ ദുഃഖത്തെച്ചൊല്ലി ബാരൂക്ക് കരയുന്നു
      '36':
        title: ദേവദാരുവിനെ മുന്തിരിവള്ളി കുറ്റപ്പെടുത്തുന്നു
      '37':
        title: വീണ ദേവദാരുവിനെ മുന്തിരിവള്ളി കുറ്റപ്പെടുത്തുന്നു
      '38':
        title: ദർശനത്തിന്റെ വ്യാഖ്യാനത്തിനായി ബാരൂക്ക് പ്രാർഥിക്കുന്നു
      '39':
        title: രാജ്യങ്ങളെക്കുറിച്ച് ബാരൂക്ക് മുൻകൂട്ടിപ്പറയുന്നു
      '40':
        title: മശിഹാ ശേഷിപ്പായ ജനത്തെ സംരക്ഷിക്കും
      '41':
        title: ഭാവിസംഭവങ്ങളെക്കുറിച്ച് ബാരൂക്ക് ചോദിക്കുന്നു
      '42':
        title: കഴിഞ്ഞകാലത്തെക്കാൾ വിശ്വാസമാണ് പ്രധാനം
      '43':
        title: ശാശ്വതമായ ആശ്വാസത്തിന് ബാരൂക്ക് ചെവികൊടുക്കുന്നു
      '44':
        title: ബാരൂക്ക് മകനായ ജ്ഞാനത്തെ വിളിക്കുന്നു
      '45':
        title: സഹിച്ചുനിൽക്കുക; ഭയപ്പെടുക; സീയോനെ അന്വേഷിക്കുക
      '46':
        title: ബാരൂക്ക് മൂപ്പന്മാർക്ക് പ്രത്യാശ ഉറപ്പുനൽകുന്നു
      '47':
        title: ബാരൂക്ക് ഏഴുദിവസം ഉപവസിക്കുന്നു
      '48':
        title: ശേഷിപ്പിനുവേണ്ടി ബാരൂക്ക് പ്രാർഥിക്കുന്നു
      '49':
        title: ഭാവിജീവിതത്തെക്കുറിച്ച് ബാരൂക്ക് ചോദിക്കുന്നു
      '50':
        title: മരിച്ചവർ തിരിച്ചറിയപ്പെടുന്നവരായി ഉയിർക്കും
      '51':
        title: ദുഷ്ടർ വാടുന്നു; നീതിമാന്മാർ മഹത്ത്വീകരിക്കപ്പെടുന്നു
      '52':
