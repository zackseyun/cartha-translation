payload:
  book_metadata:
    1 Kings:
      display_name: 1 രാജാക്കന്മാർ
      author: രചയിതാവ് അജ്ഞാതൻ; ആവർത്തനപുസ്തകാധിഷ്ഠിത ചരിത്രത്തിന്റെ ഭാഗം.
      audience: രാജ്യം വീണത് എന്തുകൊണ്ടെന്ന് ചോദിച്ചിരുന്ന പ്രവാസകാലത്തെയും പ്രവാസാനന്തരകാലത്തെയും ഇസ്രായേൽജനത.
      date: ബാബിലോന്യ പ്രവാസകാലത്ത്, ഏകദേശം ക്രി.മു. 6-ാം നൂറ്റാണ്ടിൽ, അന്തിമരൂപം പ്രാപിച്ചു.
    2 Kings:
      display_name: 2 രാജാക്കന്മാർ
      author: രചയിതാവ് അജ്ഞാതൻ; ആവർത്തനപുസ്തകാധിഷ്ഠിത ചരിത്രത്തിന്റെ ഭാഗം.
      audience: പ്രവാസത്തിലായിരുന്ന ഇസ്രായേൽജനത—ബാബിലോന്യ കീഴടക്കലിൽ അവസാനിച്ച വിഭജിത രാജ്യങ്ങളുടെ പതനത്തെക്കുറിച്ചുള്ള ദൈവശാസ്ത്രപരമായ വിശകലനം.
      date: ക്രി.മു. 586-നുശേഷം, ഏകദേശം ക്രി.മു. 6-ാം നൂറ്റാണ്ടിൽ, അന്തിമരൂപം പ്രാപിച്ചു.
    1 Chronicles:
      display_name: 1 ദിനവൃത്താന്തം
      author: രചയിതാവ് അജ്ഞാതൻ; പാരമ്പര്യം അവരെ "ദിനവൃത്താന്തകാരൻ" എന്നു വിളിക്കുന്നു.
      audience: പേർഷ്യൻ കാലഘട്ടത്തിലെ യെഹൂദ് പ്രദേശത്തുണ്ടായിരുന്ന പ്രവാസാനന്തര യെഹൂദ്യസമൂഹം; ദാവീദ്, ദൈവാലയം, ആരാധന എന്നിവയെ ആധാരമാക്കി തങ്ങളുടെ സ്വത്വം വീണ്ടും ഉറപ്പിച്ചിരുന്നവർ.
      date: ഏകദേശം ക്രി.മു. 4-ാം നൂറ്റാണ്ട്.
    2 Chronicles:
      display_name: 2 ദിനവൃത്താന്തം
      author: രചയിതാവ് അജ്ഞാതൻ; ദിനവൃത്താന്തകാരൻ.
      audience: പ്രവാസാനന്തര യെഹൂദ്യസമൂഹം.
      date: ഏകദേശം ക്രി.മു. 4-ാം നൂറ്റാണ്ട്.
  chapter_titles:
    2 Samuel:
      '24':
        title: ദാവീദ് മഹാമാരി അവസാനിപ്പിക്കുന്നു
    1 Kings:
      '1':
        title: ശലോമോൻ രാജാവായി അഭിഷേകം ചെയ്യപ്പെടുന്നു
      '2':
        title: ദാവീദ് ശലോമോനോട് വിശ്വസ്തനായിരിക്കാൻ കൽപ്പിക്കുന്നു
      '3':
        title: ശലോമോൻ ദൈവികജ്ഞാനം ചോദിക്കുന്നു
      '4':
        title: ശലോമോൻ ക്രമബദ്ധമായ ശക്തിയോടെ ഭരിക്കുന്നു
      '5':
        title: ശലോമോൻ ദൈവാലയം പണിത് പ്രശസ്തി നേടുന്നു
      '6':
        title: ദൈവാലയനിർമാണം ശ്രദ്ധാപൂർവം ആരംഭിക്കുന്നു
      '7':
        title: ശലോമോൻ ദൈവാലയത്തിലെ ഉപകരണങ്ങളുടെ നിർമാണം പൂർത്തിയാക്കുന്നു
      '8':
        title: ശലോമോൻ ദൈവാലയത്തിൽ പ്രാർഥിക്കുന്നു
      '9':
        title: കർത്താവ് ശലോമോനോടുള്ള ഉടമ്പടി വീണ്ടും ഉറപ്പിക്കുന്നു
      '10':
        title: രാജ്ഞി ശലോമോന്റെ ജ്ഞാനത്തെ പ്രശംസിക്കുന്നു
      '11':
        title: ശലോമോൻ ഇടറി ദൈവത്തിൽനിന്ന് അകന്നുപോകുന്നു
      '12':
        title: രഹബെയാം ജനത്തിന്റെ അപേക്ഷ നിരസിക്കുന്നു
      '13':
        title: പ്രവാചകൻ രാജാവിനെ ധിക്കരിക്കുകയും മരിക്കുകയും ചെയ്യുന്നു
      '14':
        title: യൊരോബെയാം ദൈവിക ന്യായവിധി നേരിടുന്നു
      '15':
        title: ആസാ വിശ്വസ്തതയോടെ വിഗ്രഹങ്ങൾ നീക്കുന്നു
      '16':
        title: കർത്താവ് ഇസ്രായേലിന്റെ രാജാക്കന്മാരെ വിധിക്കുന്നു
      '17':
        title: ഏലിയാവ് വിധവയ്ക്ക് അത്ഭുതകരമായി ആഹാരം നൽകുന്നു
      '18':
        title: ഏലിയാവ് ആഹാബിനെ നേരിട്ട് ന്യായവിധി അറിയിക്കുന്നു
      '19':
        title: ഏലിയാവിന് ഹോരേബിൽ ദൗത്യം ലഭിക്കുന്നു
      '20':
        title: ആഹാബ് ബെൻ-ഹദദിനെ വെറുതെ വിടുന്നു
      '21':
        title: ഈസേബെൽ നാബോത്തിന്റെ കൊലപാതകം ആസൂത്രണം ചെയ്യുന്നു
      '22':
        title: മീഖായാവ് പ്രവചിച്ചതുപോലെ ആഹാബ് മരിക്കുന്നു
    2 Kings:
      '1':
        title: അഹസ്യാവ് ഏലിയാവ് അറിയിച്ച ന്യായവിധി നേരിടുന്നു
      '2':
        title: ഏലിയാവ് ചുഴലിക്കാറ്റിൽ സ്വർഗത്തിലേക്ക് എടുക്കപ്പെടുന്നു
      '3':
        title: യോരാം എലീശയോടൊപ്പം മോവാബിനെതിരെ യുദ്ധം ചെയ്യുന്നു
      '4':
        title: എലീശ ആവശ്യത്തിലിരിക്കുന്നവരെ സഹായിക്കുന്നു
      '5':
        title: നയമാന്റെ കുഷ്ഠരോഗം സുഖപ്പെടുന്നു
      '6':
        title: എലീശ അരാമിന്റെ പദ്ധതികൾ വെളിപ്പെടുത്തുന്നു
      '7':
        title: ശമര്യയിലെ ക്ഷാമം പെട്ടെന്ന് അവസാനിക്കുന്നു
      '8':
        title: എലീശ മുന്നറിയിപ്പ് നൽകുകയും രാജാക്കന്മാരെ വിധിക്കുകയും ചെയ്യുന്നു
      '9':
        title: യേഹൂ ആഹാബിന്റെ കുടുംബത്തെ വധിക്കുന്നു
      '10':
        title: യേഹൂ ബാലാരാധന നശിപ്പിക്കുന്നു
      '11':
        title: ദൈവാലയത്തിലെ അധികാരമാറ്റത്തിൽ യോവാശ് രാജാവാകുന്നു
      '12':
        title: യോവാശ് ദൈവാലയം അറ്റകുറ്റപ്പണി ചെയ്യുന്നു
      '13':
        title: ഇസ്രായേലിനോടുള്ള കരുണയുടെ ആവർത്തനചക്രം അവസാനിക്കുന്നു
      '14':
        title: അമസ്യാവ് ഏദോമിനെ തോൽപ്പിച്ചിട്ടും പരാജയപ്പെടുന്നു
      '15':
        title: യെഹൂദാ സുസ്ഥിരമാകുന്നു; ഇസ്രായേൽ ക്ഷയിക്കുന്നു
      '16':
        title: ആഹാസ് അസീറിയയുടെ സഹായം തേടുന്നു
      '17':
        title: തുടർച്ചയായ പാപംനിമിത്തം ഇസ്രായേൽ പ്രവാസത്തിലാകുന്നു
      '18':
        title: ഹിസ്കീയാവ് കർത്താവിൽ മാത്രം ആശ്രയിക്കുന്നു
      '19':
        title: കർത്താവ് യെരൂശലേമിനെ അസീറിയയിൽനിന്ന് വിടുവിക്കുന്നു
      '20':
        title: ഹിസ്കീയാവ് പ്രാർഥിച്ച് സൗഖ്യം പ്രാപിക്കുന്നു
      '21':
        title: മനശ്ശെ യെഹൂദയെ തിന്മയിലേക്ക് നയിക്കുന്നു
      '22':
        title: യോശീയാവ് ന്യായപ്രമാണം കണ്ടെത്തി അനുതപിക്കുന്നു
      '23':
        title: യോശീയാവ് വിഗ്രഹാരാധന നീക്കി പെസഹ പുനഃസ്ഥാപിക്കുന്നു
      '24':
        title: ബാബിലോൻ യെഹോയാഖീനെ പിടിച്ചുകൊണ്ടുപോകുന്നു
      '25':
        title: യെഹോയാഖീൻ ബാബിലോനിൽ ആദരിക്കപ്പെടുന്നു
    1 Chronicles:
      '1':
        title: ദൈവം ഇസ്രായേലിന്റെ വംശപരമ്പര സ്ഥാപിക്കുന്നു
      '2':
        title: തലമുറകളിലൂടെ തുടരുന്ന യെഹൂദയുടെ വംശപരമ്പര
      '3':
        title: ദാവീദിന്റെ ഭവനം തുടർന്നുപോകുന്നു
      '4':
        title: യാഫെത്തിന്റെ സന്തതികളുടെ പേരുകൾ രേഖപ്പെടുത്തുന്നു
      '5':
        title: കിഴക്കൻ ഗോത്രങ്ങൾ വടക്കോട്ട് പ്രവാസത്തിലാകുന്നു
      '6':
        title: ലേവിയുടെ പുരോഹിതവംശം ആദരിക്കപ്പെടുന്നു
      '7':
        title: യിസ്സാഖാറിന്റെ ശക്തരായ യോദ്ധാക്കൾ
      '8':
        title: ബെന്യാമീന്റെ നേതാക്കളും കുലങ്ങളും
      '9':
        title: യെരൂശലേമിലേക്കുള്ള മടങ്ങിവരവും പുനർനിർമാണവും
      '10':
        title: ശൗൽ ഗിൽബോവാമലയിൽ മരിക്കുന്നു
      '11':
        title: ദാവീദ് എല്ലാവരുടെയും രാജാവായി അഭിഷേകം ചെയ്യപ്പെടുന്നു
      '12':
        title: യോദ്ധാക്കൾ ദാവീദിന്റെ രാജ്യത്തോടു ചേരുന്നു
      '13':
        title: ദാവീദ് പെട്ടകം തിരികെ കൊണ്ടുവരുന്നു
      '14':
        title: ദാവീദ് വീണ്ടും ഫെലിസ്ത്യരെ തോൽപ്പിക്കുന്നു
      '15':
        title: പെട്ടകം യെരൂശലേമിലേക്ക് കൊണ്ടുവരുന്നു
      '16':
        title: ദാവീദ് ദൈവാലയാരാധനയ്ക്കുള്ള ചുമതലകൾ നൽകുന്നു
      '17':
        title: ദൈവം ദാവീദിന്റെ രാജവംശത്തെക്കുറിച്ച് വാഗ്ദാനം ചെയ്യുന്നു
      '18':
        title: ദാവീദ് ജനതകളുടെമേൽ വിജയം നേടുന്നു
      '19':
        title: യോവാബ് അമ്മോനെയും അരാമിനെയും തോൽപ്പിക്കുന്നു
      '20':
        title: യോവാബ് രബ്ബാ നഗരം പിടിച്ചടക്കുന്നു
      '21':
        title: ദാവീദിന്റെ ജനസംഖ്യാകണക്കെടുപ്പ് മഹാമാരി വരുത്തുന്നു
      '22':
        title: ദൈവത്തിന്റെ ആലയം പണിയാൻ ശലോമോൻ തിരഞ്ഞെടുക്കപ്പെടുന്നു
      '23':
        title: ലേവ്യരെ ശുശ്രൂഷയ്ക്കായി ക്രമീകരിക്കുന്നു
      '24':
        title: പുരോഹിതരെ നറുക്കിട്ട് വിഭാഗങ്ങളാക്കുന്നു
      '25':
        title: സംഗീതജ്ഞരെ ആരാധനയ്ക്കായി ക്രമീകരിക്കുന്നു
      '26':
