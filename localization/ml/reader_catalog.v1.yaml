    chapters:
      '1':
        title: വെളിച്ചം യഥാർഥ കൂട്ടായ്മ വെളിപ്പെടുത്തുന്നു
      '2':
        title: സ്നേഹം ദൈവത്തിന്റെ കല്പനകൾ പാലിക്കുന്നു
      '3':
        title: ദൈവത്തിൽനിന്നു ജനിച്ചവർ പാപത്തെ ജയിക്കുന്നു
      '4':
        title: യഥാർഥ സ്നേഹം ദൈവത്തിൽനിന്നു വരുന്നു
      '5':
        title: യേശുവിൽ വിശ്വസിക്കുന്നവർക്ക് നിത്യജീവനുണ്ട്
  2 John:
    display_name: 2 യോഹന്നാൻ
    author: “മൂപ്പൻ.”
    audience: വ്യാജ അധ്യാപകരെക്കുറിച്ച് മുന്നറിയിപ്പു ലഭിക്കുന്ന ഒരു പ്രത്യേക ക്രിസ്തീയ സഭ (“തിരഞ്ഞെടുക്കപ്പെട്ട സ്ത്രീ”).
    date: ഏകദേശം ക്രി.വ. 90–110.
    chapters:
      '1':
        title: വ്യാജ അധ്യാപകരെക്കുറിച്ച് മൂപ്പൻ മുന്നറിയിപ്പു നൽകുന്നു
  3 John:
    display_name: 3 യോഹന്നാൻ
    author: “മൂപ്പൻ.”
    audience: സഞ്ചാരികളായ മിഷനറിമാർക്ക് ആതിഥ്യമരുളിയിരുന്ന വ്യക്തിഗത നേതാവായ ഗായൊസ്.
    date: ഏകദേശം ക്രി.വ. 90–110.
