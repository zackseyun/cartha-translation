  James:
    display_name: യാക്കോബ്
    author: പരമ്പരാഗതമായി യേശുവിന്റെ സഹോദരനായ യാക്കോബ്; ഇത് അദ്ദേഹത്തിന്റെ സ്വന്തം രചനയാണോ മറ്റൊരാൾ അദ്ദേഹത്തിന്റെ പേരിൽ എഴുതിയതാണോ എന്ന കാര്യത്തിൽ ആധുനിക പണ്ഡിതന്മാർക്കിടയിൽ അഭിപ്രായഭിന്നതയുണ്ട്.
    audience: പ്രവാസദേശങ്ങളിലെ യഹൂദ-ക്രിസ്തീയ സഭകൾ.
