  Gospel of Philip:
    display_name: ഫിലിപ്പോസിന്റെ സുവിശേഷം
    author: അജ്ഞാതൻ. കൈയെഴുത്തുപ്രതിയുടെ അവസാനക്കുറിപ്പിൽ ഈ ശീർഷകം കാണപ്പെടുന്നുണ്ടെങ്കിലും, ഫിലിപ്പോസാണ് ഇതിന്റെ രചയിതാവെന്ന് കൃതി പറയുന്നില്ല. നിലവിലുള്ള ഏക പ്രതി നാഗ് ഹമ്മാദി കോഡെക്സ് II,3-ലെ കോപ്റ്റിക് പാഠമാണ്.
    audience: വാലന്റീനിയൻ ശൈലിയിലുള്ള കൂദാശാപരമായ പ്രബോധനവുമായി—പ്രത്യേകിച്ച് സ്നാനം, അഭിഷേകം, യൂഖാരിസ്റ്റ്, വീണ്ടെടുപ്പ്, പുനരുത്ഥാനം, മണവറയുടെ പ്രതീകഭാഷ എന്നിവയുമായി—പരിചയമുള്ള ഒരു ആദിമ ക്രിസ്തീയ സമൂഹം.
    date: സാധാരണയായി ക്രി.വ. 2-ാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിലോ 3-ാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിലോ ഉള്ളതെന്നു തീയതിനിർണയം ചെയ്യപ്പെടുന്നു; അതിനു മുമ്പുണ്ടായിരുന്ന ഒരു ഗ്രീക്ക് രൂപത്തിൽനിന്ന് വിവർത്തനം ചെയ്ത, 4-ാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് കൈയെഴുത്തുപ്രതിയിലാണ് ഇത് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    chapters:
      '1':
        title: ക്രിസ്തു സമ്പൂർണ ദൈവികകുടുംബത്തെ കൊണ്ടുവരുന്നു
      '2':
        title: വിശ്വാസം ശൈത്യകാലത്ത് വാഗ്ദാനത്തിന്റെ വിത്തു വിതയ്ക്കുന്നു
      '3':
        title: വാക്കുകൾ യഥാർഥ ആത്മീയയാഥാർഥ്യം വെളിപ്പെടുത്തുന്നു
      '4':
        title: ക്രിസ്തു ആത്മീയ അടിമത്തത്തിൽനിന്ന് വീണ്ടെടുക്കുന്നു
      '5':
        title: യേശു ഭൗമികപിതാവിനെ വേർതിരിച്ചുകാട്ടുന്നു
      '6':
        title: മറഞ്ഞിരിക്കുന്ന ദൈവികയാഥാർഥ്യം യേശു വെളിപ്പെടുത്തുന്നു
      '7':
        title: പുനരുത്ഥാനം ശരീരധാരിയായ ജീവിതത്തെ രൂപാന്തരപ്പെടുത്തുന്നു
      '8':
        title: യേശു സ്വയം പടിപടിയായി വെളിപ്പെടുത്തുന്നു
      '9':
        title: ആത്മീയമക്കൾ നിലനിൽക്കുന്ന ജീവനെ വർധിപ്പിക്കുന്നു
      '10':
        title: ആത്മീയമായി പൂർണത നേടിയവർ എല്ലാവരെയും സേവിക്കുന്നു
      '11':
        title: സ്നാനം അമർത്യജീവനിലേക്കു രൂപാന്തരപ്പെടുത്തുന്നു
      '12':
        title: വിവാഹരഹസ്യം വിശുദ്ധ ഐക്യം പുനഃസ്ഥാപിക്കുന്നു
      '13':
        title: ദൈവികസത്യം ആത്മീയ പുനർജന്മം നൽകുന്നു
      '14':
        title: ക്രിസ്തു ഐക്യവും ജീവനും പുനഃസ്ഥാപിക്കുന്നു
      '15':
        title: പുനരുത്ഥാനം യഥാർഥജീവനെ ഇപ്പോൾ ഉണർത്തുന്നു
      '16':
        title: ദൈവികകൃപയിലൂടെ വിശ്വാസം പക്വത പ്രാപിക്കുന്നു
      '17':
        title: യേശു തിന്മ വെളിപ്പെടുത്തി നീക്കുന്നു
      '18':
        title: വിശുദ്ധ ഐക്യം നിത്യപ്രകാശം നൽകുന്നു
  Gospel of Mary:
    display_name: മറിയത്തിന്റെ സുവിശേഷം
    author: അജ്ഞാതൻ. ഈ കൃതി മറിയത്തെ യേശുവിന്റെ വെളിപ്പാടു സ്വീകരിക്കുകയും വ്യാഖ്യാനിക്കുകയും ചെയ്യുന്നവളായി അവതരിപ്പിക്കുന്നു; എന്നാൽ നിലനിൽക്കുന്ന ഈ സുവിശേഷം മറിയം എഴുതിയതാണെന്ന് അവകാശപ്പെടുന്നില്ല.
    audience: വെളിപ്പാട്, ആത്മീയ ആരോഹണം, അപ്പൊസ്തലിക അധികാരം, യേശുവിന്റെ ശിഷ്യന്മാർക്കിടയിൽ മറിയത്തിന്റെ ഉപദേശത്തിനുള്ള സാധുത എന്നിവയെക്കുറിച്ച് ചിന്തിച്ചിരുന്ന ആദിമ ക്രിസ്തീയ വായനക്കാർ.
    date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിലേതായി കാലനിർണയം ചെയ്യപ്പെടുന്നു; മൂന്നാം നൂറ്റാണ്ടിലെ ഗ്രീക്ക് ശകലങ്ങൾ നിലനിൽക്കുന്നു, പ്രധാന കോപ്റ്റിക് സാക്ഷ്യം അഞ്ചാം നൂറ്റാണ്ടിലെ ബെർലിൻ കോഡെക്സ് 8502-ൽ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നു.
    chapters:
      '1':
        title: രക്ഷകൻ പാപത്തിനെതിരെ പഠിപ്പിക്കുന്നു
      '2':
        title: യേശു ശിഷ്യന്മാർക്ക് സമാധാനം നൽകുന്നു
      '3':
        title: മറിയം ഉപദേശങ്ങളാൽ ആശ്വസിപ്പിക്കുന്നു
      '4':
        title: ആത്മാവ് മറവിയെ ജയിക്കുന്നു
      '5':
        title: സുവിശേഷം പ്രസംഗിക്കാൻ ലേവി പ്രേരിപ്പിക്കുന്നു
  Treatise on the Resurrection:
    display_name: പുനരുത്ഥാനത്തെക്കുറിച്ചുള്ള പ്രബന്ധം
    author: അജ്ഞാതൻ. റെഗിനോസ് എന്നു പേരുള്ള ഒരു ശിഷ്യന് അധ്യാപകൻ എഴുതിയ കത്തിന്റെ രൂപത്തിലാണ് ഈ കൃതി; അധ്യാപകനെയോ റെഗിനോസിനെയോ ഉറപ്പായി തിരിച്ചറിയാനാവില്ല.
    audience: പുനരുത്ഥാനത്തെക്കുറിച്ച് പ്രബോധനം തേടിയിരുന്ന ക്രിസ്ത്യാനികൾ, പ്രത്യേകിച്ച് പുനരുത്ഥാനജീവിതത്തിലെ ശാരീരികവും ആത്മീയവും ഇപ്പോഴത്തെതുമായ പങ്കാളിത്തത്തെ വിലയിരുത്തിയിരുന്ന വായനക്കാർ.
    date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനകാലത്തേതായി (പലപ്പോഴും ഏകദേശം ക്രി.വ. 170–200) കണക്കാക്കുന്നു; അതിനു മുമ്പുണ്ടായിരുന്ന ഒരു ഗ്രീക്ക് കൃതിയുടെ നാലാം നൂറ്റാണ്ടിലെ കോപ്റ്റിക് പകർപ്പിലാണ് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    chapters:
      '1':
        title: ക്രിസ്തു യഥാർഥ പൂർത്തീകരണം നൽകുന്നു
      '2':
        title: ക്രിസ്തു മരണത്തിന്റെ പിടിയെ ജയിക്കുന്നു
      '3':
        title: പുനരുത്ഥാനം യാഥാർഥ്യത്തെ രൂപാന്തരപ്പെടുത്തുന്നു
      '4':
        title: വിശ്വാസികൾ ക്രിസ്തുവിന്റെ പുനരുത്ഥാനത്തിൽ പങ്കുചേരുന്നു
      '5':
        title: ക്രിസ്തുവിന്റെ പുനരുത്ഥാനത്തിലുള്ള വിശ്വാസം
      '6':
        title: രക്ഷയുടെ ജ്ഞാനം എന്നേക്കും നിലനിൽക്കുന്നു
      '7':
        title: കൃപ നിത്യജീവനെ കാത്തുസൂക്ഷിക്കുന്നു
      '8':
        title: പുനരുത്ഥാനം യഥാർഥ ജീവനെ വെളിപ്പെടുത്തുന്നു
      '9':
        title: പുനരുത്ഥാനം ജീർണതയെ ജയിക്കുന്നു
      '10':
        title: പുനരുത്ഥാനത്തിനായി ഭിന്നതയിൽനിന്ന് വിടുതൽ നേടുക
      '11':
        title: മറ്റുള്ളവർക്കുവേണ്ടി ഉപദേശം പങ്കിടുക
  Dialogue of the Savior:
    display_name: രക്ഷകന്റെ സംവാദം
    author: അജ്ഞാതൻ. യൂദാസ്, മത്തായി, മറിയം എന്നിവരുമായുള്ള സംഭാഷണത്തിൽ വെളിപ്പാടുസംബന്ധമായ ഉപദേശങ്ങൾ യേശുവിന്റെ വാക്കുകളായി ഈ കൃതി അവതരിപ്പിക്കുന്നു; എന്നാൽ അതിന്റെ സമാഹർത്താവിനെ തിരിച്ചറിയിക്കുന്നില്ല.
    audience: സ്വകാര്യ വെളിപ്പാട്, ശിഷ്യത്വം, ആത്മജ്ഞാനം, പ്രാർഥന, രക്ഷയ്ക്കായുള്ള സന്യാസപരമായ ഒരുക്കം എന്നിവയിൽ താത്പര്യമുണ്ടായിരുന്ന ഒരു ആദിമ ക്രിസ്തീയ സമൂഹം.
    date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കപ്പെടുന്നു; എങ്കിലും ഇതിന്റെ രചനാഘട്ടങ്ങളും കൃത്യമായ കാലവും സംബന്ധിച്ച് അഭിപ്രായവ്യത്യാസം തുടരുന്നു. നാലാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് കൈയെഴുത്തുപ്രതിയിലാണ് ഇത് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    chapters:
      '1':
        title: യേശു യഥാർഥ വിശ്രമം പഠിപ്പിക്കുന്നു
      '2':
        title: ദൈവം നിത്യജീവനിലേക്കു നയിക്കുന്നു
      '3':
        title: ആനന്ദത്തോടെ അപകടം തരണം ചെയ്യുക
      '4':
        title: ഉള്ളിലെ ആത്മാവിനെ ക്രമപ്പെടുത്തുക
      '5':
        title: ദുഃഖത്തിനപ്പുറം സത്യം തേടുക
      '6':
        title: ഹൃദയത്തിന്റെ ഉള്ളറ ശുദ്ധീകരിക്കുക
      '7':
        title: സ്വർഗീയ നന്മ പ്രതിഫലിപ്പിക്കുക
      '8':
        title: ദൈവിക ശക്തി സകലത്തെയും നിലനിർത്തുന്നു
      '9':
        title: ആദ്യം ദൈവിക ഉറവിടത്തെ അറിയുക
      '10':
        title: നിത്യനായ ദൈവത്തെ എന്നേക്കും കാണുക
      '11':
        title: ദൈവിക പ്രകാശം ധരിക്കുക
      '12':
        title: ക്രിസ്തുവിന്റെ ആത്മീയ സമ്പത്ത് വെളിപ്പെടുത്തുക
      '13':
        title: സ്നേഹത്താൽ സംഘർഷത്തെ ജയിക്കുക
      '14':
        title: യഥാർഥ പ്രാർഥന അതീതതയിലേക്ക് ഉയരുന്നു
      '15':
        title: ആന്തരിക ജീവനെ ശ്രദ്ധയോടെ കാക്കുക
  Exegesis on the Soul:
    display_name: ആത്മാവിനെക്കുറിച്ചുള്ള വ്യാഖ്യാനം
    author: അജ്ഞാതൻ. ആത്മാവിന്റെ വീഴ്ച, മാനസാന്തരം, പുനഃസ്ഥാപനം എന്നിവയുടെ രൂപകമായി ബൈബിളിലെയും ഗ്രീക്ക് സാഹിത്യത്തിലെയും പ്രതിരൂപങ്ങളെ പുനർവായിക്കുന്ന ഒരു ക്രിസ്തീയ പ്രഭാഷകനാണ് രചയിതാവ്.
    audience: വിശുദ്ധലിഖിതവും ധാർമിക പ്രബോധനവും പരിചിതമായ, ക്രമരഹിതമായ മോഹങ്ങൾ വിട്ട് മാനസാന്തരത്തിലേക്കും ദൈവികതയുമായുള്ള പുനഃസംഗമത്തിലേക്കും വിളിക്കപ്പെട്ടിരുന്ന ക്രിസ്ത്യാനികൾ.
    date: പൊതുവേ ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിലോ മൂന്നാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിലോ ഉള്ളതെന്ന് കാലനിർണയം ചെയ്യപ്പെടുന്നു; ഗ്രീക്കിൽനിന്നുള്ള നാലാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് പരിഭാഷയിലാണ് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    chapters:
      '1':
        title: കരുണ തേടി ആത്മാവ് മാനസാന്തരപ്പെടുന്നു
      '2':
        title: മോഹങ്ങളിലൂടെ ആത്മാവ് ദൈവത്തെ വഞ്ചിക്കുന്നു
      '3':
        title: സ്നാനത്തിലൂടെ ദൈവം ആത്മാവിനെ ശുദ്ധീകരിക്കുന്നു
      '4':
        title: ആത്മാവ് ദൈവിക ഉറവിടവുമായി വീണ്ടും ചേരുന്നു
      '5':
        title: മറഞ്ഞിരിക്കുന്ന ദൈവത്തോട് ആത്മാർഥമായി പ്രാർഥിക്കുക
      '6':
        title: മോഹത്തിൽനിന്ന് ആത്മാവ് ഭവനത്തിലേക്കു മടങ്ങുന്നു
      '7':
        title: ആത്മാർഥമായ വിലാപം ദൈവം കേൾക്കുന്നു
  Book of Thomas the Contender:
    display_name: പോരാളിയായ തോമസിന്റെ പുസ്തകം
    author: അജ്ഞാതൻ. കൃതിയുടെ അവസാനത്തിലുള്ള ശീർഷകം അതിനെ യൂദാസ് തോമസുമായി ബന്ധപ്പെടുത്തുകയും മത്തായാസിനെ രേഖപ്പെടുത്തിയവനായി പറയുകയും ചെയ്യുന്നു; എന്നാൽ ഇവ സ്ഥിരീകരിക്കാവുന്ന കർത്തൃത്വാവകാശങ്ങളല്ല, സാഹിത്യപരമായ ആട്രിബ്യൂഷനുകളാണ്.
    audience: ആത്മജ്ഞാനം തേടാനും ശാരീരിക വികാരങ്ങളെ ചെറുക്കാനും തോമസിനുള്ള യേശുവിന്റെ സ്വകാര്യ പ്രബോധനം മനസ്സിലാക്കാനും ആഹ്വാനം ചെയ്യപ്പെട്ട, സന്യാസജീവിതത്തോട് ചായ്‌വുള്ള ക്രിസ്ത്യാനികൾ.
    date: പലപ്പോഴും ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിലോ മൂന്നാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിലോ ഉള്ളതെന്ന് കാലനിർണയം ചെയ്യപ്പെടുന്നു; ഒരുപക്ഷേ സുറിയാനി ക്രിസ്തീയ പശ്ചാത്തലത്തിൽ രൂപപ്പെട്ടതാകാം. നാലാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് കൈയെഴുത്തുപ്രതിയിലാണ് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    chapters:
      '1':
        title: തോമസിന്റെ ഉപദേശങ്ങൾ മത്തായാസ് രേഖപ്പെടുത്തുന്നു
      '2':
        title: ആത്മപരിശോധനയ്ക്ക് ക്രിസ്തു പ്രേരിപ്പിക്കുന്നു
      '3':
        title: അദൃശ്യ സത്യം യേശു പഠിപ്പിക്കുന്നു
      '4':
        title: മോഹത്തിന്റെ പിടിയെക്കുറിച്ച് രക്ഷകൻ മുന്നറിയിപ്പു നൽകുന്നു
      '5':
        title: പാപികളെക്കുറിച്ച് തോമസ് ചോദിക്കുന്നു
      '6':
        title: ആത്മീയ അന്ധകാരത്തെക്കുറിച്ച് രക്ഷകൻ മുന്നറിയിപ്പു നൽകുന്നു
      '7':
        title: ജാഗരൂകരായ വിശുദ്ധർ ഭാഗ്യവാന്മാർ
  Tripartite Tractate:
    display_name: ത്രിഭാഗ പ്രബന്ധം
    author: അജ്ഞാതൻ. രചയിതാവ് ഉന്നതവിദ്യാഭ്യാസം നേടിയ ഒരു വാലന്റീനിയൻ ക്രിസ്തീയ ദൈവശാസ്ത്രജ്ഞനായിരുന്നു; പേരറിയാവുന്ന ഏതെങ്കിലും അധ്യാപകനുമായി അദ്ദേഹത്തെ ഉറപ്പായി തിരിച്ചറിയാനാവില്ല.
    audience: ദൈവം, യുഗസത്തകൾ, സൃഷ്ടി, ക്രിസ്തു, സഭ, രക്ഷ, അന്തിമ പുനഃസ്ഥാപനം എന്നിവയെക്കുറിച്ചുള്ള വിശദമായ പ്രബോധനം സ്വീകരിച്ചിരുന്ന ഒരു വാലന്റീനിയൻ ക്രിസ്തീയ സമൂഹം.
    date: സാധാരണയായി ക്രി.വ. മൂന്നാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കപ്പെടുന്നു; ചില വാദങ്ങൾ ആ നൂറ്റാണ്ടിന്റെ ഉത്തരാർധത്തെ അനുകൂലിക്കുന്നു. നാലാം നൂറ്റാണ്ടിലെ കോപ്റ്റിക് യുങ് കോഡെക്സിലാണ് സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത്.
    chapters:
      '1':
        title: ദൈവം അധ്വാനമില്ലാതെ സകലതും സൃഷ്ടിക്കുന്നു
      '2':
        title: ദൈവത്തിന്റെ അഗ്രാഹ്യ മഹത്ത്വം പുത്രൻ വെളിപ്പെടുത്തുന്നു
      '3':
        title: സമൂഹം ദൈവിക നിത്യജീവനിൽ പങ്കുചേരുന്നു
      '4':
        title: ദൈവം സത്തകളെ പ്രകാശത്തിലേക്ക് ഉണർത്തുന്നു
      '5':
        title: പൂർണനായ പുത്രനിലൂടെ ദൈവം വെളിപ്പെടുത്തുന്നു
      '6':
        title: നിത്യസത്തകൾ ദൈവസ്വഭാവം പ്രതിഫലിപ്പിക്കുന്നു
      '7':
        title: മറഞ്ഞിരിക്കുന്ന ദൈവത്തെ പുത്രൻ വെളിപ്പെടുത്തുന്നു
      '8':
        title: ദൈവം നിത്യസത്തകളെ ശക്തിപ്പെടുത്തുന്നു
      '9':
        title: അദൃശ്യ സൗരഭ്യത്തിലൂടെ ദൈവം ആകർഷിക്കുന്നു
      '10':
        title: ദൈവം സകല സത്തകളിലൂടെയും ഒഴുകുന്നു
      '11':
        title: വീണുപോയ സത്ത പൂർണത തേടി പരാജയപ്പെടുന്നു
      '12':
        title: വചനം മാനസാന്തരപ്പെട്ട് ഐക്യം കൊണ്ടുവരുന്നു
      '13':
        title: അഹങ്കാരം ആത്മാക്കൾക്കിടയിൽ സംഘർഷം സൃഷ്ടിക്കുന്നു
      '14':
        title: വീണ്ടെടുപ്പിലൂടെ രക്ഷകൻ സകലത്തെയും പുനഃസ്ഥാപിക്കുന്നു
      '15':
        title: ജ്ഞാനസന്ദേശം സത്തയെ ശക്തിപ്പെടുത്തുന്നു
      '16':
        title: വചനം സൃഷ്ടിക്കുവേണ്ടി പ്രാർഥിക്കുന്നു
      '17':
        title: വചനം രക്ഷയുടെ മണ്ഡലം സ്ഥാപിക്കുന്നു
      '18':
        title: വചനം ന്യായവിധിയും രക്ഷയും ഒരുക്കുന്നു
      '19':
        title: എതിർവിഭാഗങ്ങൾക്ക് ക്രമീകൃത സ്ഥാനങ്ങൾ ലഭിക്കുന്നു
      '20':
        title: പരമാധികാരി അധോമണ്ഡലങ്ങളെ ക്രമീകരിക്കുന്നു
      '21':
        title: മരണവിധേയത്വത്തിലൂടെയും കഷ്ടതയിലൂടെയും മനുഷ്യവർഗം പഠിക്കുന്നു
      '22':
        title: ആത്മീയ ശക്തികൾ ക്രമവും ക്രമക്കേടും കലർത്തുന്നു
      '23':
        title: രക്ഷകനെക്കുറിച്ചുള്ള പ്രവാചകദർശനങ്ങൾ
      '24':
        title: രക്ഷകൻ നിത്യസ്വാതന്ത്ര്യം നൽകുന്നു
      '25':
        title: രക്ഷകൻ മനുഷ്യവർഗത്തെ വിഭജിക്കുന്നു
      '26':
        title: ക്രിസ്തു സകല സൃഷ്ടിയെയും ഒന്നിപ്പിക്കുന്നു
      '27':
        title: ദൈവജ്ഞാനം സൃഷ്ടിയെ എന്നേക്കുമായി പുനഃസ്ഥാപിക്കുന്നു
      '28':
        title: ആന്തരിക വിശ്വാസത്തിലൂടെയുള്ള വീണ്ടെടുപ്പ്
      '29':
        title: ക്രിസ്തുവിനാൽ നയിക്കപ്പെടുന്ന സേവകർ
      '30':
        title: ക്രിസ്തുവിന്റെ പ്രകാശം നിത്യപുനഃസ്ഥാപനം വെളിപ്പെടുത്തുന്നു
  Apocryphon of John:
    display_name: യോഹന്നാന്റെ രഹസ്യഗ്രന്ഥം
    author: അജ്ഞാതൻ. ഉയിർത്തെഴുന്നേറ്റ യേശു സെബെദിയുടെ മകനായ യോഹന്നാനു നൽകിയ വെളിപ്പാടായി ഈ കൃതി വ്യാജനാമത്തിൽ അവതരിപ്പിക്കപ്പെടുന്നു; ഇതിന്റെ ഒന്നിലധികം പുരാതന പാഠരൂപങ്ങൾ നിലനിൽക്കുന്നു.
    audience: ദൈവിക മണ്ഡലം, സൃഷ്ടി, മനുഷ്യന്റെ സ്വത്വം, ശത്രുതാപരമായ ഭരണാധികാരികളിൽനിന്നുള്ള മോചനം എന്നിവയെക്കുറിച്ചുള്ള വിവരണം തേടിയിരുന്ന സേത്തീയമോ അതിനോട് അടുത്ത ബന്ധമുള്ളതോ ആയ വെളിപ്പാടുപാരമ്പര്യത്തിലെ ക്രിസ്ത്യാനികൾ.
    date: ഇതിന്റെ ഒരു ആദ്യകാല രൂപം ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിൽ പ്രചരിച്ചിരുന്നിരിക്കാം; ഹ്രസ്വവും ദീർഘവുമായ പാഠരൂപങ്ങൾ സംരക്ഷിക്കുന്ന, ഇപ്പോൾ നിലനിൽക്കുന്ന കോപ്റ്റിക് സാക്ഷ്യങ്ങൾ നാലും അഞ്ചും നൂറ്റാണ്ടുകളിലേതാണ്.
    chapters:
      '1':
        title: യോഹന്നാൻ യേശുവിന്റെ ജ്ഞാനം തേടുന്നു
      '2':
