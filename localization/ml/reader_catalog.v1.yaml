      '31':
        title: ഇസ്രായേലിന്റെ പുനഃസ്ഥാപനം ദൈവം വാഗ്ദാനം ചെയ്യുന്നു
      '32':
        title: പ്രത്യാശയോടെ യിരെമ്യാവ് നിലം വാങ്ങുന്നു
