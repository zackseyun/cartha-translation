        title: വിവാഹത്തെയും ദൈവരാജ്യത്തെയും കുറിച്ച് യേശു പഠിപ്പിക്കുന്നു
      '20':
        title: സേവനത്തിലൂടെയുള്ള മഹത്ത്വം യേശു പഠിപ്പിക്കുന്നു
      '21':
        title: രാജാവായി യേശു യെരൂശലേമിൽ പ്രവേശിക്കുന്നു
      '22':
