  Leviticus:
    display_name: ലേവ്യപുസ്തകം
    author: രചയിതാവ് അജ്ഞാതൻ; പാരമ്പര്യമായി മോശെയുടേതെന്ന് കരുതപ്പെടുന്നു. ആധുനിക പണ്ഡിതപഠനം ഇതിനെ പുരോഹിതസ്രോതസ്സിൽ ഉൾപ്പെടുത്തുന്നു.
    audience: ഇസ്രായേലിലെ പുരോഹിതന്മാർക്കും ആരാധകസമൂഹത്തിനും—യാഗം, വിശുദ്ധി, ദൈവസാന്നിധ്യത്തെ കേന്ദ്രമാക്കിയുള്ള ജീവിതക്രമം എന്നിവയ്ക്കുള്ള നിർദേശങ്ങൾ.
    date: രാജഭരണത്തിന്റെ അവസാനകാലംമുതൽ പ്രവാസാനന്തരകാലംവരെയുള്ള രചനാപാളികൾ (ഏകദേശം ക്രി.മു. 7–5 നൂറ്റാണ്ടുകൾ).
    chapters:
      '1':
        title: യഹോവയ്ക്കു പ്രസാദകരമായ ഹോമയാഗങ്ങൾ
      '2':
        title: അവിടുത്തെ സന്നിധിയിൽ ദഹിപ്പിക്കുന്ന ധാന്യയാഗങ്ങൾ
      '3':
        title: സമാധാനയാഗം യാഗപീഠത്തിന്മേൽ അർപ്പിക്കുന്നു
      '4':
        title: പുരോഹിതന്മാരുടെയും ജനത്തിന്റെയും പാപങ്ങൾ
      '5':
        title: പാപങ്ങൾ ഏറ്റുപറഞ്ഞ് യാഗം കൊണ്ടുവരുക
      '6':
        title: പുരോഹിതന്മാർ യാഗങ്ങൾ ശ്രദ്ധയോടെ കൈകാര്യം ചെയ്യുന്നു
      '7':
        title: അകൃത്യയാഗവും സമാധാനയാഗവും വിശദീകരിക്കുന്നു
      '8':
        title: അഹരോൻ പുരോഹിതനായി പ്രതിഷ്ഠിക്കപ്പെടുന്നു
      '9':
        title: അർപ്പിച്ച യാഗത്തെ അഗ്നി ദഹിപ്പിക്കുന്നു
      '10':
        title: നാദാബും അബീഹൂവും ശിക്ഷിക്കപ്പെടുന്നു
      '11':
        title: ശുദ്ധവും അശുദ്ധവുമായ ഭക്ഷണങ്ങളെക്കുറിച്ചുള്ള നിയമങ്ങൾ
      '12':
        title: പ്രസവശേഷം സ്ത്രീ ശുദ്ധീകരിക്കപ്പെടുന്നു
      '13':
        title: പുരോഹിതന്മാർ ത്വഗ്രോഗങ്ങൾ പരിശോധിക്കുന്നു
      '14':
        title: യാഗങ്ങളിലൂടെ ശുദ്ധി വീണ്ടെടുക്കുന്നു
      '15':
        title: ശരീരസ്രവങ്ങൾ മൂലമുള്ള അശുദ്ധി
      '16':
        title: എല്ലാ പാപങ്ങൾക്കും പ്രായശ്ചിത്തം ചെയ്യുന്നു
      '17':
        title: യാഗങ്ങൾ സമാഗമകൂടാരത്തിന്റെ വാതിൽക്കൽ കൊണ്ടുവരണം
      '18':
        title: ധാർമിക വിശുദ്ധി പാലിക്കാൻ യഹോവ കല്പിക്കുന്നു
      '19':
        title: വിശുദ്ധരാകാൻ ഇസ്രായേൽ വിളിക്കപ്പെടുന്നു
      '20':
        title: ഗുരുതരമായ പാപങ്ങൾക്ക് കഠിനശിക്ഷകൾ
      '21':
        title: പുരോഹിതന്മാർ സവിശേഷ വിശുദ്ധി പാലിക്കണം
      '22':
        title: വിശുദ്ധ വഴിപാടുകൾ ശ്രദ്ധയോടെ കൈകാര്യം ചെയ്യണം
      '23':
        title: ആരാധനയ്ക്കുള്ള നിശ്ചിത സമയങ്ങൾ പഠിപ്പിക്കുന്നു
      '24':
        title: വിളക്കുകൾ കത്തുന്നു; അപ്പം അർപ്പിക്കുന്നു
      '25':
        title: ഓരോ ഏഴാം വർഷവും ദേശം വിശ്രമിക്കുന്നു
      '26':
        title: ഉടമ്പടിയുടെ വഴി ഇസ്രായേൽ തിരഞ്ഞെടുക്കുന്നു
      '27':
        title: നേർച്ചകളും സമർപ്പണങ്ങളും വിശ്വസ്തതയോടെ നിറവേറ്റണം
  Numbers:
