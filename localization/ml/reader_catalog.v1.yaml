      '14':
        title: സാക്ഷിമൊഴി മാറ്റാൻ യോസേഫ് വിസമ്മതിക്കുന്നു
      '15':
        title: യോസേഫ് സഹോദരന്മാരെ അപമാനത്തിൽനിന്ന് കാക്കുന്നു
      '16':
        title: വഞ്ചനയെക്കുറിച്ച് യോസേഫ് മൗനം പാലിക്കുന്നു
      '17':
