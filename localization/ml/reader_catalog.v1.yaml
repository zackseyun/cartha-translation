    catholic: കത്തോലിക്ക
    eastern_orthodox: പൗരസ്ത്യ ഓർത്തഡോക്സ്
    ethiopian_orthodox: എത്യോപ്യൻ ഓർത്തഡോക്സ്
    all_books: എല്ലാ പുസ്തകങ്ങളും
    start_with_tradition: നിങ്ങളുടെ പാരമ്പര്യത്തിൽനിന്ന് തുടങ്ങുക
    selection_prompt: ആദ്യം ഏത് ബൈബിൾ കാനോനാണ് കാണിക്കേണ്ടത്?
    selection_help: നിങ്ങളുടെ സഭ ഉപയോഗിക്കുന്ന കാനോൻ തിരഞ്ഞെടുക്കുക; അല്ലെങ്കിൽ പാരമ്പര്യം വ്യക്തമാക്കുന്ന അടയാളങ്ങളോടെ ലഭ്യമായ എല്ലാ പുസ്തകങ്ങളും കാണുക. ഇത് എപ്പോൾ വേണമെങ്കിലും മാറ്റാം.
  authority:
    canonical_scripture: കാനോനിക തിരുവെഴുത്ത്
    deuterocanonical_scripture: ദ്വിതീയകാനോനിക തിരുവെഴുത്ത്
    deuterocanonical_apocrypha: ദ്വിതീയകാനോനികം / അപ്പോക്രിഫ
    varies_by_tradition: പാരമ്പര്യമനുസരിച്ച് വ്യത്യാസപ്പെടുന്നു
    canonical_in: '{canon}-ൽ കാനോനികം'
    historical_jewish_writing: ചരിത്രപരമായ യഹൂദ രചന
    early_christian_writing: ആദിമ ക്രൈസ്തവ രചന
    nag_hammadi_text: നാഗ് ഹമ്മാദി ഗ്രന്ഥം
    historical_text: ചരിത്രഗ്രന്ഥം
    non_canonical: കാനോനികമല്ലാത്തത്
    shown_in_all_books: എല്ലാ പുസ്തകങ്ങളുടെയും കാഴ്ചയിൽ കാണിക്കുന്നു
books:
  Genesis:
    display_name: ഉല്പത്തി
    author: രചയിതാവ് അജ്ഞാതൻ; പാരമ്പര്യമായി മോശെയുടേതെന്ന് കരുതപ്പെടുന്നു. ആധുനിക പണ്ഡിതപഠനമനുസരിച്ച്, വിവിധ സ്രോതസ്സുകൾ പിന്നീട് ഒരുമിച്ച് സംശോധനം ചെയ്യപ്പെട്ട ദീർഘമായൊരു രചനാചരിത്രം ഇതിനുണ്ട്.
    audience: ദൈവത്തിന്റെ സൃഷ്ടി, തിരഞ്ഞെടുപ്പ്, വാഗ്ദത്തം എന്നിവയിൽ ജനത്തിന്റെ ഉത്ഭവകഥയെ ഉറപ്പിച്ചുകൊണ്ട് ഉടമ്പടിയാൽ സ്വത്വം നേടിയ ഇസ്രായേൽ ജനത്തിന്.
    date: നൂറ്റാണ്ടുകളിലായി രചിക്കപ്പെട്ടു; ബാബിലോൻ പ്രവാസകാലത്തോ അതിനുശേഷമോ, ഏകദേശം ക്രി.മു. 6–5 നൂറ്റാണ്ടുകളിൽ, ഇന്ന് ലഭിച്ചിരിക്കുന്ന രൂപത്തിലെത്തി.
    summary: സൃഷ്ടി, മനുഷ്യരുടെ മത്സരവും ചിതറിപ്പോകലും, ദൈവം ഇസ്രായേലിനോടുള്ള ഉടമ്പടിയുടെ വാഗ്ദത്തങ്ങൾ ആരംഭിക്കുന്നതിന് ഉപാധിയായ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ്, യോസേഫ് എന്നിവരുടെ കുടുംബം—ഇവയെക്കുറിച്ചാണ് ഉല്പത്തി വിവരിക്കുന്നത്.
    chapters:
      '1':
        title: ദൈവം ആകാശവും ഭൂമിയും സൃഷ്ടിക്കുന്നു
      '2':
        title: ദൈവം പുരുഷനെയും സ്ത്രീയെയും രൂപപ്പെടുത്തുന്നു
      '3':
        title: മനുഷ്യർ ഏദെനിൽനിന്നു വീഴുന്നു
      '4':
        title: കയീൻ തന്റെ സഹോദരനായ ഹാബെലിനെ കൊല്ലുന്നു
      '5':
        title: ആദാംമുതൽ നോഹവരെയുള്ള വംശാവലി രേഖപ്പെടുത്തുന്നു
      '6':
        title: ദൈവം പ്രളയത്തിലൂടെ പാപത്തെ ന്യായംവിധിക്കുന്നു
      '7':
        title: പ്രളയജലം ഭൂമിയെ മൂടുന്നു
      '8':
        title: നോഹ പെട്ടകത്തിൽനിന്നിറങ്ങി ദൈവത്തെ ആരാധിക്കുന്നു
      '9':
        title: പ്രളയത്തിനുശേഷമുള്ള നോഹയുടെ കുടുംബം
      '10':
        title: നോഹയുടെ സന്തതികൾ വിവിധ ദേശങ്ങളിലേക്കു വ്യാപിക്കുന്നു
      '11':
        title: ഗോപുരത്തിലെ ഭാഷാക്കുഴപ്പം ജനത്തെ ചിതറിക്കുന്നു
      '12':
        title: അബ്രാം അനുസരിച്ച് കനാനിലേക്കു പുറപ്പെടുന്നു
      '13':
        title: അബ്രാം സമ്പന്നനായി മടങ്ങിവന്ന് പ്രാർഥിക്കുന്നു
      '14':
        title: ആക്രമികളിൽനിന്ന് അബ്രാം ലോത്തിനെ രക്ഷിക്കുന്നു
      '15':
        title: ദൈവം അബ്രാമിന് സന്തതികളെ വാഗ്ദാനം ചെയ്യുന്നു
      '16':
        title: ഹാഗാർ മരുഭൂമിയിലെ ഉറവിലേക്കു ഓടിപ്പോകുന്നു
      '17':
        title: അബ്രാഹാം പരിച്ഛേദനയേൽക്കുന്നു; ദൈവം ഉടമ്പടി പുതുക്കുന്നു
      '18':
        title: ദൈവം അബ്രാഹാമിന് ഒരു മകനെ വാഗ്ദാനം ചെയ്യുന്നു
      '19':
        title: ലോത്ത് തീപിടിച്ച നഗരങ്ങളിൽനിന്ന് ഓടിരക്ഷപ്പെടുന്നു
      '20':
        title: മുന്നറിയിപ്പിനുശേഷം അബീമേലെക്ക് സാറായെ മടക്കിക്കൊടുക്കുന്നു
      '21':
        title: സാറാ അബ്രാഹാമിന് യിസ്ഹാക്കിനെ പ്രസവിക്കുന്നു
      '22':
        title: അബ്രാഹാം മോറിയായിൽ യിസ്ഹാക്കിനെ യാഗമായി അർപ്പിക്കുന്നു
      '23':
        title: സാറാ മരിക്കുന്നു; അബ്രാഹാം ശവസംസ്കാരസ്ഥലം വാങ്ങുന്നു
      '24':
        title: ദാസൻ യിസ്ഹാക്കിനുവേണ്ടി റിബെക്കയെ കണ്ടെത്തുന്നു
      '25':
        title: അബ്രാഹാമിന്റെ സന്തതികളും മരണവും രേഖപ്പെടുത്തുന്നു
      '26':
        title: യിസ്ഹാക്ക് ഗെരാറിൽ സംരക്ഷിതനായി താമസിക്കുന്നു
      '27':
        title: യാക്കോബ് യിസ്ഹാക്കിനെ വഞ്ചിച്ച് അനുഗ്രഹം നേടുന്നു
      '28':
        title: ദൂതന്മാരുള്ള കോവണിപ്പടി യാക്കോബ് സ്വപ്നം കാണുന്നു
      '29':
        title: യാക്കോബ് റാഹേലിനെ സ്നേഹിക്കുകയും ലേയയെ കണ്ടുമുട്ടുകയും ചെയ്യുന്നു
      '30':
        title: കരുണയാൽ യാക്കോബ് സമൃദ്ധനാകുന്നു
      '31':
        title: ലാബാന്റെ ക്രോധത്തെ യാക്കോബ് ഭയപ്പെടുന്നു
      '32':
        title: യാക്കോബ് ദൈവത്തിന്റെ ദൂതനോടു മല്ലിടുന്നു
      '33':
        title: യാക്കോബ് ഏശാവിനെ സമാധാനത്തോടെ കണ്ടുമുട്ടുന്നു
      '34':
        title: ശെഖേം ദീനയെ ക്രൂരമായി മാനഭംഗപ്പെടുത്തുന്നു
      '35':
        title: യാക്കോബ് ബേഥേലിലെ യാഗപീഠത്തിലേക്കു മടങ്ങുന്നു
      '36':
        title: സേയീർദേശത്തുള്ള ഏശാവിന്റെ സന്തതികൾ
      '37':
        title: യോസേഫിന്റെ സഹോദരന്മാർ അവനെ കുറഞ്ഞ വിലയ്ക്കു വിൽക്കുന്നു
      '38':
        title: താമാർ രഹസ്യമായി യെഹൂദായുടെ പുത്രന്മാരെ പ്രസവിക്കുന്നു
      '39':
        title: പോത്തീഫറിന്റെ വീട്ടിൽ യോസേഫ് അഭിവൃദ്ധിപ്പെടുന്നു
      '40':
        title: ഫറവോന്റെ ഉദ്യോഗസ്ഥർ സ്വപ്നം കണ്ട് ഭയപ്പെടുന്നു
      '41':
        title: യോസേഫ് ഫറവോന്റെ സ്വപ്നങ്ങൾ വ്യാഖ്യാനിക്കുന്നു
      '42':
        title: ധാന്യം വാങ്ങാൻ യാക്കോബ് പുത്രന്മാരെ അയക്കുന്നു
      '43':
        title: ബെന്യാമീൻ സഹോദരന്മാരോടൊപ്പം ഈജിപ്തിലേക്കു പോകുന്നു
      '44':
        title: ബെന്യാമീന്റെ ജീവനുവേണ്ടി യെഹൂദാ അപേക്ഷിക്കുന്നു
      '45':
        title: യോസേഫ് സഹോദരന്മാരുമായി വീണ്ടും ഒന്നിക്കുന്നു
      '46':
        title: ഇസ്രായേൽ സുരക്ഷിതമായി ഗോഷെനിലേക്കു യാത്രചെയ്യുന്നു
      '47':
        title: യോസേഫ് തന്റെ കുടുംബത്തിന് ആഹാരം നൽകുന്നു
      '48':
        title: യാക്കോബ് വിവേകത്തോടെ യോസേഫിന്റെ പുത്രന്മാരെ അനുഗ്രഹിക്കുന്നു
      '49':
        title: യാക്കോബ് പുത്രന്മാരുടെ ഭാവിയെക്കുറിച്ച് പ്രവചിക്കുന്നു
      '50':
        title: യാക്കോബിന്റെ അവസാന ആഗ്രഹം യോസേഫ് നിറവേറ്റുന്നു
  Exodus:
    display_name: പുറപ്പാട്
    author: രചയിതാവ് അജ്ഞാതൻ; പാരമ്പര്യമായി മോശെയുടേതെന്ന് കരുതപ്പെടുന്നു. ആധുനിക പണ്ഡിതപഠനമനുസരിച്ച്, വിവിധ സ്രോതസ്സുകൾ പിന്നീട് ഒരുമിച്ച് സംശോധനം ചെയ്യപ്പെട്ട ദീർഘമായൊരു രചനാചരിത്രം ഇതിനുണ്ട്.
    audience: മോചിപ്പിക്കപ്പെട്ട് ഉടമ്പടിയിൽ ചേർക്കപ്പെട്ട ജനമെന്ന നിലയിൽ, യഹോവയുടെ നിയമത്തിൻകീഴിൽ അവിടുത്തെ ജനതയായി ജീവിക്കുക എന്നതിന്റെ അർഥം പഠിക്കുന്ന ഇസ്രായേലിന്.
    date: നൂറ്റാണ്ടുകളിലായി രചിക്കപ്പെട്ടു; ഏകദേശം ക്രി.മു. 6–5 നൂറ്റാണ്ടുകളിൽ ഇന്ന് ലഭിച്ചിരിക്കുന്ന രൂപത്തിലെത്തി.
    chapters:
      '1':
        title: ദൈവം ഇസ്രായേലിന്റെ വളർച്ചയെ അനുഗ്രഹിക്കുന്നു
      '2':
        title: മോശെ ഫറവോനിൽനിന്നു രക്ഷിക്കപ്പെടുന്നു
      '3':
        title: മോശെ ദൈവത്തിന്റെ വിളി കേൾക്കുന്നു
      '4':
        title: മോശെ ദൈവത്തിന്റെ ശക്തിയെ അഭിമുഖീകരിക്കുന്നു
      '5':
        title: ഫറവോൻ തന്റെ ഹൃദയം കഠിനമാക്കുന്നു
      '6':
        title: വിടുവിക്കുമെന്ന് യഹോവ വാഗ്ദാനം ചെയ്യുന്നു
      '7':
