  Gospel of Peter:
    display_name: പത്രോസിന്റെ സുവിശേഷം
    author: രചയിതാവ് അജ്ഞാതൻ. നിലനിൽക്കുന്ന വിവരണം പത്രോസിന്റെ ശബ്ദത്തിലാണ് സംസാരിക്കുന്നത്; അദ്ദേഹത്തിന്റെ പേരിലാണ് ഇത് പകർന്നുപോന്നതും. എങ്കിലും ചരിത്രപുരുഷനായ അപ്പൊസ്തലൻ പത്രോസ് രചിച്ച കൃതിയായി ഇതിനെ കണക്കാക്കുന്നില്ല.
    audience: പീഡാനുഭവത്തിന്റെയും പുനരുത്ഥാനത്തിന്റെയും വിപുലമായ ഒരു വിവരണത്തിൽ താത്പര്യമുണ്ടായിരുന്ന ആദിമ ക്രിസ്ത്യാനികൾ; ഒരുപക്ഷേ പത്രോസിന്റെ അധികാരത്തിന് പ്രത്യേക പ്രാധാന്യമുണ്ടായിരുന്ന സമൂഹങ്ങളിലുള്ളവർ.
    date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കപ്പെടുന്നു; നിലനിൽക്കുന്ന പ്രധാന ഗ്രീക്ക് ശകലം അഖ്മീമിൽ കണ്ടെത്തിയ, ഏറെ പിൽക്കാലത്തുള്ള ഒരു കൈയെഴുത്തുപ്രതിയിൽനിന്നാണ്.
    chapters:
      '1':
        title: കർത്താവിനെ വിചാരണചെയ്യാൻ ഹെരോദാവ് കല്പിക്കുന്നു
      '2':
        title: യോസേഫ് കർത്താവിന്റെ ശരീരം അടക്കംചെയ്യുന്നു
      '3':
        title: ജനക്കൂട്ടം ദൈവപുത്രനെ പരിഹസിക്കുന്നു
      '4':
        title: കുറ്റവാളി യേശുവിന്റെ മാനം കാക്കുന്നു
      '5':
        title: മധ്യാഹ്നത്തിൽ യെഹൂദ്യയെ അന്ധകാരം മൂടുന്നു
      '6':
        title: യേശുവിനെ യോസേഫിന്റെ കല്ലറയിൽ വയ്ക്കുന്നു
      '7':
        title: ചെയ്ത അനീതിയെക്കുറിച്ച് ജനങ്ങൾ വിലപിക്കുന്നു
      '8':
        title: മൂപ്പന്മാർ യേശുവിന്റെ കല്ലറ കാക്കുന്നു
      '9':
        title: പുലരിയിൽ സ്വർഗീയശബ്ദം മുഴങ്ങുന്നു
      '10':
        title: മൂന്നു പുരുഷന്മാർ കല്ലറയിൽനിന്ന് പുറത്തുവരുന്നു
      '11':
        title: പടയാളികൾ പീലാത്തോസിനെ വിവരം അറിയിക്കുന്നു
      '12':
        title: മഗ്ദലന മറിയം കല്ലറ അന്വേഷിക്കുന്നു
      '13':
        title: ദൂതന്റെ വാർത്ത കേട്ട് സ്ത്രീകൾ ഓടിപ്പോകുന്നു
      '14':
        title: ഉത്സവത്തിനുശേഷം ശിഷ്യന്മാർ കരയുന്നു
  2 Clement:
    display_name: 2 ക്ലെമന്റ്
    author: രചയിതാവ് അജ്ഞാതൻ. പരമ്പരാഗത ശീർഷകം അങ്ങനെയാണെങ്കിലും, ഇത് റോമിലെ ക്ലെമന്റ് എഴുതിയ രണ്ടാമത്തെ ലേഖനമല്ല; മറിച്ച് ഒരു ആദിമ ക്രിസ്തീയ പ്രസംഗമാണ്.
    audience: മാനസാന്തരം, ധാർമികമായ സ്ഥിരത, ദുർബലരോടുള്ള കരുതൽ, പുനരുത്ഥാനത്തിലും ന്യായവിധിയിലുമുള്ള പ്രത്യാശയോടെ വിശ്വസ്തമായി സഹിച്ചുനിൽക്കൽ എന്നിവയ്ക്കായി പ്രബോധിപ്പിക്കപ്പെടുന്ന ഒരു ക്രിസ്തീയ സഭാസമൂഹം.
    date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ ആദ്യപകുതിയിലോ മധ്യത്തിലോ ഉള്ളതായി കണക്കാക്കപ്പെടുന്നു (ഏകദേശം ക്രി.വ. 100–160); രചനാസ്ഥലം അനിശ്ചിതമാണ്.
    chapters:
      '1':
        title: നമ്മുടെ ന്യായാധിപനായ യേശുക്രിസ്തു
      '2':
        title: സഭ വിശ്വാസത്താൽ നിറയുന്നു
      '3':
        title: ക്രിസ്തു നമ്മോടു കരുണ കാണിക്കുന്നു
      '4':
        title: പ്രവൃത്തികളിലെ യഥാർഥ ഏറ്റുപറച്ചിൽ
      '5':
        title: ദൈവത്തിനായി നിർഭയരായി ജീവിക്കുക
      '6':
        title: സമ്പത്തിനുപകരം ദൈവത്തെ തിരഞ്ഞെടുക്കുക
      '7':
        title: പൂർണഹൃദയത്തോടെ മത്സരത്തിൽ പ്രവേശിക്കുക
      '8':
        title: ജീവിച്ചിരിക്കുമ്പോൾത്തന്നെ മാനസാന്തരപ്പെടുക
      '9':
        title: ശരീരത്തെ ദേവാലയമായി കാത്തുസൂക്ഷിക്കുക
      '10':
        title: സദ്ഗുണവും സമാധാനവും പിന്തുടരുക
      '11':
        title: നിർമലഹൃദയത്തോടെ ദൈവത്തെ സേവിക്കുക
      '12':
        title: സ്നേഹവും നീതിയും നമ്മെ കാത്തിരിക്കുന്നു
      '13':
        title: മാനസാന്തരപ്പെട്ട് നന്മ പിന്തുടരുക
      '14':
        title: ജീവനുള്ള സഭയുടെ ഭാഗമാകുക
      '15':
        title: ആത്മനിയന്ത്രണം ആത്മാർഥമായി അഭ്യസിക്കുക
      '16':
        title: സമയം ശേഷിക്കുമ്പോൾ മാനസാന്തരപ്പെടുക
      '17':
        title: ദുർബലരെ നന്മയിലേക്കു നയിക്കുക
      '18':
        title: നീതിക്കായി പരിശ്രമിക്കുക
      '19':
        title: ഇപ്പോൾ പൂർണഹൃദയത്തോടെ മാനസാന്തരപ്പെടുക
      '20':
        title: കഷ്ടതയിലെ ദൈവിക പരിശീലനത്തിൽ ആശ്രയിക്കുക
  Epistle of Barnabas:
    display_name: ബർണബാസിന്റെ ലേഖനം
    author: രചയിതാവ് അജ്ഞാതൻ. ഈ കൃതി പരമ്പരാഗതമായി പൗലോസിന്റെ സഹപ്രവർത്തകനായ ബർണബാസുമായി ബന്ധപ്പെടുത്തിയിരുന്നെങ്കിലും, ആ രചനാകർത്തൃത്വം ആധുനിക പണ്ഡിതലോകം അംഗീകരിക്കുന്നില്ല.
    audience: യിസ്രായേലിന്റെ തിരുവെഴുത്തുകളെ ക്രിസ്തുവിനെ കേന്ദ്രീകരിച്ചും ആലങ്കാരികമായും വ്യാഖ്യാനിച്ച് തങ്ങളുടേതായി സ്വീകരിക്കാനും, തങ്ങളുടെ ഉടമ്പടി-സ്വത്വത്തെ യഹൂദ ആചാരങ്ങളിൽനിന്ന് വേർതിരിച്ചറിയാനും പഠിപ്പിക്കപ്പെട്ടിരുന്ന യഹൂദേതര ക്രിസ്ത്യാനികൾ.
    date: സാധാരണയായി ക്രി.വ. 70-ലെ യെരൂശലേം ദേവാലയനാശത്തിനും രണ്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിനും ഇടയിലുള്ള കാലത്തേതായി, പലപ്പോഴും ഏകദേശം ക്രി.വ. 80–130 കാലഘട്ടത്തിലേതായി, കണക്കാക്കപ്പെടുന്നു.
    chapters:
      '1':
        title: ദൈവകൃപ പ്രിയസമൂഹത്തെ നിറയ്ക്കുന്നു
      '2':
        title: വിശ്വാസികൾ ദൈവത്തിന്റെ യഥാർഥ കല്പന അന്വേഷിക്കുന്നു
      '3':
        title: ഉപവാസത്തിന്റെ അർഥം കരുണയും നീതിയുമാണ്
      '4':
        title: ജാഗരൂകരായ ക്രിസ്ത്യാനികൾ പരീക്ഷകൾ പ്രതീക്ഷിക്കുന്നു
      '5':
        title: പാപികൾക്കുവേണ്ടി യേശു കഷ്ടം സഹിച്ചു
      '6':
        title: വാഗ്ദത്ത രാജ്യം യേശു പൂർത്തീകരിക്കുന്നു
      '7':
        title: യേശുവിന്റെ മുറിവുകൾക്കായി ദൈവത്തിനു നന്ദി പറയുക
      '8':
        title: പെൺകിടാവിന്റെ ബലി യേശുവിനെ മുൻകൂട്ടി സൂചിപ്പിക്കുന്നു
      '9':
        title: ഹൃദയപരിച്ഛേദനം വിശ്വാസത്തെ സൂചിപ്പിക്കുന്നു
      '10':
        title: ഭക്ഷണനിയമങ്ങൾ ആത്മീയപാഠങ്ങൾ പഠിപ്പിക്കുന്നു
      '11':
        title: സ്നാനവും ക്രൂശും പാപമോചനം നൽകുന്നു
      '12':
        title: മോശെയുടെ കരങ്ങൾ യേശുവിലേക്കു വിരൽചൂണ്ടുന്നു
      '13':
        title: യാക്കോബിന്റെ അനുഗ്രഹം സ്ഥാനമാറ്റം മുൻകൂട്ടി അറിയിക്കുന്നു
      '14':
        title: യേശു ഹൃദയങ്ങളെ ദൈവത്തിനായി വീണ്ടെടുക്കുന്നു
      '15':
        title: നീതിക്കുശേഷം ശബ്ബത്ത് വിശ്രമം വരുന്നു
      '16':
        title: യഥാർഥ ദേവാലയം വിശ്വാസികളുടെ ഉള്ളിലാണ്
      '17':
        title: രക്ഷ ഇപ്പോൾ വ്യക്തമായി വിശദീകരിക്കുന്നു
      '18':
        title: വെളിച്ചത്തിന്റെ ദൂതന്മാരും ഇരുട്ടിന്റെ അധിപനും
      '19':
        title: വെളിച്ചത്തിന്റെ വഴി സമർപ്പണം ആവശ്യപ്പെടുന്നു
      '20':
        title: ഇരുണ്ട പാത നിത്യനാശത്തിലേക്കു നയിക്കുന്നു
      '21':
        title: മഹത്ത്വത്തിനായി കർത്താവിന്റെ കല്പനകൾ അനുസരിക്കുക
  Letters of Ignatius:
    display_name: ഇഗ്നേഷ്യസിന്റെ കത്തുകൾ
    author: പൊതുവേ അംഗീകരിക്കപ്പെടുന്ന മധ്യപാഠരൂപത്തിലെ ഏഴ് കത്തുകളുടെ രചയിതാവ് അന്ത്യോക്യയിലെ ബിഷപ്പായ ഇഗ്നേഷ്യസാണ്; പിന്നീട് വികസിപ്പിച്ച പാഠങ്ങളും ഇഗ്നേഷ്യസിന്റെ പേരിൽ മറ്റുള്ളവർ എഴുതിയ കത്തുകളും ഈ സമാഹാരത്തിൽ ഉൾപ്പെടുന്നില്ല.
    audience: രക്തസാക്ഷിത്വത്തിലേക്കുള്ള യാത്രയ്ക്കിടെ ഇഗ്നേഷ്യസ് എഫെസൊസ്, മഗ്നേഷ്യ, ത്രല്ലെസ്, റോം, ഫിലദെൽഫിയ, സ്മിർണ എന്നിവിടങ്ങളിലെ ക്രിസ്തീയസഭകളെയും പോളിക്കാർപ്പിനെയും അഭിസംബോധന ചെയ്തു.
    date: സാധാരണയായി എ.ഡി. രണ്ടാം നൂറ്റാണ്ടിന്റെ ആരംഭത്തിലേതായി, മിക്കപ്പോഴും ഏകദേശം എ.ഡി. 105–117 കാലഘട്ടത്തിലേതായി കണക്കാക്കപ്പെടുന്നു; എന്നാൽ ഇഗ്നേഷ്യസിന്റെ യാത്രയുടെ കൃത്യമായ കാലക്രമം ഇപ്പോഴും ചർച്ചാവിഷയമാണ്.
    chapters:
      '1':
        title: ഇഗ്നേഷ്യസ് എഫെസൊസ് സഭയെ അഭിവാദ്യം ചെയ്യുന്നു
      '2':
        title: വിശ്വാസികൾ തടവുകാരനായ ഇഗ്നേഷ്യസിനെ പിന്തുണയ്ക്കുന്നു
      '3':
        title: ഐക്യത്തോടും പ്രാർഥനയോടുംകൂടെ ബിഷപ്പിനെ ആദരിക്കുക
      '4':
        title: ഇഗ്നേഷ്യസ് താഴ്മയോടെ സംസാരിക്കുന്നു
      '5':
        title: യേശുവിന്റെ സ്നേഹത്തിലൂടെ ഐക്യം
      '6':
        title: ബിഷപ്പ് വിശ്വാസികളെ പ്രാർഥനയിൽ ഒന്നിപ്പിക്കുന്നു
      '7':
        title: ശാന്തമായി നയിക്കുന്ന ബിഷപ്പിനെ ആദരിക്കുക
      '8':
        title: വ്യാജ ഉപദേഷ്ടാക്കളുടെ സ്വാധീനത്തെ സൂക്ഷിക്കുക
      '9':
        title: എഫെസൊസുകാരുടെ സമർപ്പണവും ഇഗ്നേഷ്യസും
      '10':
        title: ദുഷിച്ച ഉപദേശം തള്ളി ഉറച്ചുനിൽക്കുക
      '11':
        title: എല്ലാവർക്കുംവേണ്ടി നിരന്തരം പ്രാർഥിക്കുക
      '12':
        title: എല്ലാ ബന്ധനങ്ങൾക്കും മീതെ ക്രിസ്തു
      '13':
        title: ശിക്ഷാവിധിക്കു വിധേയനായവനായി ഇഗ്നേഷ്യസ് എഴുതുന്നു
      '14':
        title: സമാധാനം സാത്താന്റെ തന്ത്രങ്ങളുടെ ശക്തി തകർക്കുന്നു
      '15':
        title: വിശ്വാസം നന്മയിലേക്കും സ്നേഹത്തിലേക്കും നയിക്കുന്നു
      '16':
