      '18':
        title: യോസേഫ് താഴ്മയും അനുഗ്രഹവും പഠിപ്പിക്കുന്നു
      '19':
        title: ഭാവിരാജ്യത്തെക്കുറിച്ചുള്ള ദർശനം യോസേഫ് വെളിപ്പെടുത്തുന്നു
      '20':
        title: തന്റെ അസ്ഥികൾ കൊണ്ടുപോകാൻ യോസേഫ് കല്പിക്കുന്നു
  Testament of Benjamin:
