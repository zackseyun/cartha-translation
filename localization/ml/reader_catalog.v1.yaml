      '5':
        title: ധനികരായ പീഡകരുടെ ന്യായവിധി അടുത്തിരിക്കുന്നു
  1 Peter:
    display_name: 1 പത്രോസ്
    author: പരമ്പരാഗതമായി ശീലാസിനെ എഴുത്തുകാരനായി ഉപയോഗിച്ച അപ്പൊസ്തലനായ പത്രോസ്; ചില പണ്ഡിതന്മാർ ഇത് മറ്റൊരാൾ പത്രോസിന്റെ പേരിൽ എഴുതിയതാണെന്ന് കരുതുന്നു.
    audience: സാമൂഹികമായ എതിർപ്പ് നേരിട്ടിരുന്ന റോമൻ ഏഷ്യാമൈനറിലെ ക്രിസ്ത്യാനികൾ.
    date: പത്രോസ് എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 60-കൾ; മറ്റൊരാൾ അദ്ദേഹത്തിന്റെ പേരിൽ എഴുതിയതാണെങ്കിൽ ഏകദേശം ക്രി.വ. 70–90-കൾ.
