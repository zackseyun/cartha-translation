  Psalms:
    display_name: സങ്കീർത്തനങ്ങൾ
    author: നൂറ്റാണ്ടുകളിലായി ജീവിച്ചിരുന്ന പല രചയിതാക്കൾ; ശീർഷകക്കുറിപ്പുകളിൽ ദാവീദ്, ആസാഫ്, കോരഹ്, ശലോമോൻ, മോശെ തുടങ്ങിയവരുടെ പേരുകൾ കാണുന്നു.
    audience: ആരാധനയിൽ പങ്കെടുത്ത ഇസ്രായേലും ദൈവാലയസഭയും—കൂടാതെ പിൽക്കാലത്തെ പ്രാർഥനയുടെയും വിലാപത്തിന്റെയും എല്ലാ സമൂഹങ്ങളും.
    date: ഏകദേശം ക്രി.മു. പത്താം–മൂന്നാം നൂറ്റാണ്ടുകളിൽ രചിക്കപ്പെട്ടു; അന്തിമ സമാഹാരം പ്രവാസാനന്തര കാലഘട്ടത്തിലായിരുന്നു.
    chapters:
      '1':
        title: നീതിയുള്ള ജീവിതം അനുഗൃഹീതം
      '2':
