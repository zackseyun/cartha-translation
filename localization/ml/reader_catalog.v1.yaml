  Infancy Gospel of Thomas:
    display_name: തോമാസിന്റെ ബാല്യകാല സുവിശേഷം
    author: രചയിതാവ് അജ്ഞാതൻ. കണ്ടെത്താനാകുന്ന ഇതിന്റെ ഏറ്റവും ആദ്യകാല രൂപത്തിൽ രചയിതാവിന്റെ പേര് പറയുന്നില്ല; തോമാസിന്റെ പേരിലുള്ള രചനയെന്ന വിശേഷണം പിൽക്കാല കൈയെഴുത്തുപ്രതികളുടെ ശീർഷകങ്ങളിലും പകർന്നുപോന്ന പാരമ്പര്യത്തിലുമാണ് കാണുന്നത്.
    audience: യേശുവിന്റെ ബാല്യകാലത്തെക്കുറിച്ചും, അംഗീകൃത സുവിശേഷവിവരണങ്ങൾ ആരംഭിക്കുന്നതിനു മുമ്പുള്ള ദൈവിക ശക്തി, ശിക്ഷണം, പഠനം, പക്വതയിലേക്കുള്ള വളർച്ച എന്നിവ എങ്ങനെ വിവരിക്കാമെന്നതിനെക്കുറിച്ചും അറിയാൻ ആഗ്രഹിച്ച ക്രിസ്ത്യാനികൾ.
    date: സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിലേതായി കണക്കാക്കപ്പെടുന്നു; എന്നാൽ പരസ്പരം ഗണ്യമായി വ്യത്യസ്തമായ പല ഗ്രീക്ക് പാഠരൂപങ്ങളിലും ആദ്യകാല വിവർത്തനങ്ങളിലുമാണ് ഈ കൃതി നിലനിൽക്കുന്നത്.
    chapters:
      '1':
