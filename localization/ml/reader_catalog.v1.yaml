    date: യഹൂദ മൂലരൂപം ഏകദേശം ക്രി.മു. 2-ാം നൂറ്റാണ്ടിലേത്; ക്രൈസ്തവ സംശോധനം ഏകദേശം ക്രി.വ. 1–2 നൂറ്റാണ്ടുകളിലേത്.
    chapters:
      '1':
        title: യൂദാ പുത്രന്മാരോട് അന്തിമവാക്കുകൾ പങ്കിടുന്നു
      '2':
        title: ദൈവം നൽകിയ യോദ്ധാവിന്റെ ശക്തി യൂദാ പ്രകടിപ്പിക്കുന്നു
      '3':
        title: യൂദാ ഒറ്റയ്ക്ക് കനാന്യ രാജാക്കന്മാരെ തോൽപ്പിക്കുന്നു
      '4':
        title: യൂദായെ കാക്കുന്ന ദൂതനെ യാക്കോബ് കാണുന്നു
      '5':
        title: യൂദാ അരേതയെയും തപ്പൂവേയെയും കീഴടക്കുന്നു
      '6':
        title: ഉഗ്രയുദ്ധത്തിൽ യൂദാ ജയിക്കുന്നു
      '7':
        title: ആക്രമണത്തിനിടയിലൂടെ യൂദാ പാഞ്ഞുകയറുന്നു
      '8':
        title: യൂദാ ശൂവയെ വിവാഹം ചെയ്ത് പുത്രന്മാരെ നേടുന്നു
      '9':
        title: ഏശാവിന്റെ വൻസൈന്യത്തെ യൂദാ തോൽപ്പിക്കുന്നു
      '10':
        title: ദുഷ്ടരായ പുത്രന്മാർമൂലം താമാർ കഷ്ടപ്പെടുന്നു
      '11':
        title: ഭാര്യയുടെ പാപങ്ങളെ യൂദാ ശപിക്കുന്നു
      '12':
        title: വടിയുടെ സഹായത്തോടെ താമാർ യൂദായെ കബളിപ്പിക്കുന്നു
      '13':
        title: പാപങ്ങളെക്കുറിച്ച് യൂദാ മക്കൾക്കു മുന്നറിയിപ്പു നൽകുന്നു
      '14':
        title: മദ്യപാനത്തെയും പാപങ്ങളെയും കുറിച്ച് യൂദാ മുന്നറിയിപ്പു നൽകുന്നു
      '15':
        title: കാമത്തിന്റെ പിടിയെക്കുറിച്ച് യൂദാ മുന്നറിയിപ്പു നൽകുന്നു
      '16':
        title: വീഞ്ഞിനെതിരെ യൂദാ മുന്നറിയിപ്പു നൽകുന്നു
      '17':
        title: അത്യാഗ്രഹത്തെയും കാമത്തെയും കുറിച്ച് യൂദാ പുത്രന്മാർക്കു മുന്നറിയിപ്പു നൽകുന്നു
      '18':
        title: ലൈംഗിക അധാർമ്മികതയെയും അത്യാഗ്രഹത്തെയും സൂക്ഷിക്കുക
      '19':
        title: അത്യാഗ്രഹത്തിനെതിരെ യൂദാ മുന്നറിയിപ്പു നൽകുന്നു
      '20':
        title: മനുഷ്യ മനസ്സാക്ഷി ആത്മാക്കൾക്കിടയിൽ കുടുങ്ങുന്നു
      '21':
        title: ഭാവിയിലെ രാജാക്കന്മാരെക്കുറിച്ച് യൂദാ മുന്നറിയിപ്പു നൽകുന്നു
      '22':
        title: ദൈവിക ന്യായവിധി ആന്തരിക സംഘർഷം കൊണ്ടുവരുന്നു
      '23':
        title: ഭാവിയിലെ ദുഷ്ടതയെക്കുറിച്ച് യൂദാ വിലപിക്കുന്നു
      '24':
        title: ആത്മാവിനെ പകരുന്ന ദിവ്യ ഭരണാധികാരി
      '25':
        title: നിത്യജീവനായി ഗോത്രപിതാക്കന്മാർ ഉയിർപ്പിക്കപ്പെടുന്നു
      '26':
        title: വിശ്വസ്തമായി ജീവിക്കാൻ യൂദാ കൽപ്പിക്കുന്നു
