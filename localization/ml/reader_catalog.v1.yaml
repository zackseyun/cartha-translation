        title: ഇസ്രായേലിനെ ശപിക്കാൻ ബിലെയാം വിസമ്മതിക്കുന്നു
      '23':
        title: ബിലെയാം ഇസ്രായേലിനെ വീണ്ടും വീണ്ടും അനുഗ്രഹിക്കുന്നു
      '24':
        title: ഇസ്രായേലിന്റെ ഭാവിമഹത്ത്വം ബിലെയാം പ്രഖ്യാപിക്കുന്നു
      '25':
        title: ഫീനെഹാസ് സിമ്രിയെ കൊല്ലുന്നു
      '26':
        title: മോശെ പുതിയ യോദ്ധാക്കളെ എണ്ണുന്നു
      '27':
        title: പിതാവിന്റെ അവകാശത്തിനായി പുത്രിമാർ അപേക്ഷിക്കുന്നു
      '28':
        title: ഇസ്രായേൽ പതിവുയാഗങ്ങൾ അർപ്പിക്കുന്നു
      '29':
        title: ഇസ്രായേൽ മാസത്തിലെ യാഗങ്ങൾ അർപ്പിക്കുന്നു
      '30':
        title: നേർച്ചകളെക്കുറിച്ച് മോശെ സംസാരിക്കുന്നു
      '31':
        title: മിദ്യാനോടു പ്രതികാരം ചെയ്യാൻ മോശെ കല്പിക്കുന്നു
      '32':
        title: രൂബേനും ഗാദും കിഴക്കൻ ദേശം ആവശ്യപ്പെടുന്നു
      '33':
        title: ഈജിപ്തിൽനിന്നുള്ള ഇസ്രായേലിന്റെ യാത്ര വിവരിക്കുന്നു
      '34':
        title: കനാന്റെ അതിർത്തികൾ യഹോവ നിർണയിക്കുന്നു
      '35':
        title: സങ്കേതനഗരങ്ങൾ അഭയം നൽകുന്നു
      '36':
        title: സെലോഫഹാദിന്റെ പുത്രിമാർ സ്വന്തം കുലത്തിൽ വിവാഹം കഴിക്കുന്നു
  Deuteronomy:
    display_name: ആവർത്തനപുസ്തകം
    author: രചയിതാവ് അജ്ഞാതൻ; മോശെയുടെ വിടവാങ്ങൽ പ്രസംഗങ്ങളായാണ് അവതരിപ്പിച്ചിരിക്കുന്നത്. ആധുനിക പണ്ഡിതപഠനം ഇതിന്റെ മുഖ്യഭാഗത്തെ ക്രി.മു. 7-ാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിൽ യോശീയാവിന്റെ ഭരണകാലത്തു നടന്ന പരിഷ്കരണവുമായി ബന്ധിപ്പിക്കുന്നു.
    audience: ദേശത്തേക്കു പ്രവേശിക്കാൻ ഒരുങ്ങിയിരുന്ന ഇസ്രായേൽ—കൂടാതെ, ദേവാലയമോ രാജാവോ ഇല്ലാതെ എങ്ങനെ വിശ്വസ്തരായി ജീവിക്കാമെന്ന് അന്വേഷിച്ച പിൽക്കാല പ്രവാസികളും.
    date: മുഖ്യഭാഗം ഏകദേശം ക്രി.മു. 7-ാം നൂറ്റാണ്ടിന്റെ അവസാനം; പ്രവാസകാലത്ത് അന്തിമരൂപം പ്രാപിച്ചു.
    chapters:
      '1':
        title: ദൈവത്തിന്റെ വിശ്വസ്തത മോശെ ഓർമിപ്പിക്കുന്നു
      '2':
        title: ഇസ്രായേൽ ഏദോമിനെയും മോവാബിനെയും ഒഴിവാക്കുന്നു
      '3':
        title: ഇസ്രായേൽ ഓഗ് രാജാവിനെ തോൽപ്പിക്കുന്നു
      '4':
        title: ജ്ഞാനപൂർവം അനുസരിക്കാൻ മോശെ പ്രബോധിപ്പിക്കുന്നു
      '5':
        title: പത്തു കല്പനകൾ മോശെ വീണ്ടും പ്രസ്താവിക്കുന്നു
      '6':
        title: ദൈവത്തെ സ്നേഹിക്കാൻ മോശെ ഇസ്രായേലിനോടു കല്പിക്കുന്നു
      '7':
        title: ഇസ്രായേൽ വിഗ്രഹങ്ങൾ നശിപ്പിക്കണം
      '8':
        title: കഷ്ടതയിൽ ദൈവം പരിപാലിച്ചതിനെ ഓർക്കുക
      '9':
        title: ഇസ്രായേലിനുവേണ്ടി മോശെ അപേക്ഷിക്കുന്നു
      '10':
        title: ദൈവം ആവശ്യപ്പെടുന്ന കാര്യങ്ങളെക്കുറിച്ച് മോശെ സംസാരിക്കുന്നു
      '11':
        title: സ്നേഹിക്കാൻ മോശെ ഇസ്രായേലിനോടു കല്പിക്കുന്നു
      '12':
        title: തിരഞ്ഞെടുത്ത സ്ഥലത്തുമാത്രം ആരാധിക്കുക
      '13':
        title: വ്യാജപ്രവാചകന്മാരെയും വിഗ്രഹങ്ങളെയും നിരസിക്കുക
      '14':
        title: ദൈവജനമായി വ്യത്യസ്തമായി ജീവിക്കുക
      '15':
        title: ഓരോ ഏഴാം വർഷവും കടങ്ങൾ ഇളച്ചുകൊടുക്കുക
      '16':
        title: ഉദാരതയോടെ ഉത്സവങ്ങൾ ആഘോഷിക്കുക
      '17':
        title: വിഗ്രഹാരാധനയെ വിധിച്ച് നിയമം പാലിക്കുക
      '18':
        title: പുരോഹിതന്മാരെയും ലേവ്യരെയും വിശ്വസ്തതയോടെ പിന്തുണയ്ക്കുക
      '19':
        title: അബദ്ധത്തിൽ കൊല ചെയ്തവർക്ക് നഗരങ്ങൾ അഭയം നൽകുന്നു
      '20':
        title: യുദ്ധത്തിൽ യഹോവയിൽ ആശ്രയിക്കുക
      '21':
        title: കൊല്ലപ്പെട്ടവരുടെ കാര്യത്തിൽ നീതിയോടെ പ്രവർത്തിക്കുക
      '22':
        title: വിശുദ്ധിയും മാന്യതയും സംരക്ഷിക്കുക
      '23':
        title: ആവർത്തനപുസ്തകത്തിലെ വിശുദ്ധിക്കായുള്ള കല്പനകൾ
      '24':
        title: നീതിയും മനുഷ്യന്റെ മാന്യതയും സംരക്ഷിക്കുക
      '25':
        title: കുറ്റക്കാരനെ അപമാനിക്കാതെ ശിക്ഷിക്കുക
      '26':
        title: ആദ്യഫലങ്ങൾ അർപ്പിച്ച് യഹോവയോടു വിശ്വാസം ഏറ്റുപറയുക
      '27':
        title: കല്ലുകൊണ്ടുള്ള യാഗപീഠം പണിയാൻ മോശെ കല്പിക്കുന്നു
      '28':
        title: അനുസരണം അനുഗ്രഹം കൊണ്ടുവരുന്നു
      '29':
        title: ഭാവിതലമുറകളോടൊപ്പം ഉടമ്പടിയിൽ പ്രവേശിക്കുക
      '30':
        title: ജീവൻ തിരഞ്ഞെടുക്കാൻ മോശെ ഇസ്രായേലിനെ പ്രബോധിപ്പിക്കുന്നു
      '31':
        title: മോശെ എഴുതിവെച്ച് ചുമതല യോശുവയ്ക്ക് കൈമാറുന്നു
      '32':
        title: മോശെ സാക്ഷ്യഗീതം ആലപിക്കുന്നു
      '33':
        title: ഓരോ ഗോത്രത്തെയും മോശെ അനുഗ്രഹിക്കുന്നു
      '34':
        title: മോശെ ദേശം കണ്ടശേഷം മരിക്കുന്നു
  Joshua:
    display_name: യോശുവ
    author: രചയിതാവ് അജ്ഞാതൻ; ആവർത്തനപുസ്തകചരിത്രത്തിന്റെ ഭാഗം.
    audience: രാജവാഴ്ചയുടെയും പ്രവാസത്തിന്റെയും കാലത്തെ ഇസ്രായേൽ; ദേശജയം, ഉടമ്പടി, ദേശത്തിന്റെ അർഥം എന്നിവയെക്കുറിച്ച് ചിന്തിക്കുന്നു.
    date: പഴയ പാരമ്പര്യങ്ങളെ ആധാരമാക്കി ഏകദേശം ക്രി.മു. 7–6 നൂറ്റാണ്ടുകളിൽ സമാഹരിക്കപ്പെട്ടു.
    chapters:
      '1':
        title: നേതൃത്വം ഏറ്റെടുക്കാൻ ദൈവം യോശുവയോടു കല്പിക്കുന്നു
      '2':
        title: ഇസ്രായേലിന്റെ ചാരന്മാരെ രാഹാബ് ഒളിപ്പിക്കുന്നു
      '3':
        title: ഇസ്രായേൽ ഉണങ്ങിയ നിലത്തിലൂടെ യോർദാൻ കടക്കുന്നു
      '4':
        title: പന്ത്രണ്ടു കല്ലുകൾ നദികടന്നതിന്റെ സ്മാരകമാകുന്നു
      '5':
        title: യഹോവയുടെ സൈന്യാധിപനെ യോശുവ കണ്ടുമുട്ടുന്നു
      '6':
        title: വിശ്വസ്തമായ പ്രദക്ഷിണത്തിലൂടെ യെരീഹോ വീഴുന്നു
      '7':
        title: ആഖാന്റെ പാപം ഇസ്രായേലിന് പരാജയം വരുത്തുന്നു
      '8':
        title: ഹായി പിടിച്ചടക്കപ്പെടുന്നു; ന്യായപ്രമാണം പുതുക്കപ്പെടുന്നു
      '9':
        title: സമാധാനത്തിനായി ഗിബെയോന്യർ വഞ്ചിക്കുന്നു
      '10':
        title: യുദ്ധത്തിൽ സൂര്യൻ നിശ്ചലമായി നിൽക്കുന്നു
      '11':
        title: ഇസ്രായേൽ വടക്കോട്ട് മുന്നേറി വിജയം നേടുന്നു
      '12':
        title: മുപ്പത്തൊന്ന് രാജാക്കന്മാർ ഇവിടെ പരാജയപ്പെടുന്നു
      '13':
        title: കൈവശമാക്കാൻ ഇനിയും വളരെ ദേശം ശേഷിക്കുന്നു
      '14':
        title: കാലേബ് തന്റെ പർവതഭവനം അവകാശപ്പെടുന്നു
      '15':
        title: യെഹൂദയുടെ പട്ടണങ്ങളും നീരുറവകളും സുരക്ഷിതമാക്കപ്പെടുന്നു
      '16':
        title: യോർദ്ദാനു പടിഞ്ഞാറുള്ള എഫ്രയീമിന്റെ ദേശം
      '17':
        title: മനശ്ശെയുടെ അവകാശവും കടമയും
      '18':
        title: ബെന്യാമീന്റെ അതിർത്തികളും പട്ടണങ്ങളും
      '19':
        title: ലേവ്യർക്ക് അവരുടെ പട്ടണങ്ങൾ ലഭിക്കുന്നു
      '20':
        title: മനഃപൂർവമല്ലാതെ കൊല ചെയ്തവർക്കുള്ള സങ്കേതനഗരങ്ങൾ
      '21':
        title: പൗരോഹിത്യത്തിനായി ലേവ്യരെ വേർതിരിക്കുന്നു
      '22':
        title: കിഴക്കൻ ഗോത്രങ്ങൾ സാക്ഷ്യയാഗപീഠം പണിയുന്നു
      '23':
        title: വിശ്വസ്തമായി അനുസരിക്കാൻ യോശുവ ആഹ്വാനം ചെയ്യുന്നു
      '24':
        title: തിരഞ്ഞെടുക്കാൻ യോശുവ ഇസ്രായേലിനെ വിളിക്കുന്നു
  Judges:
    display_name: ന്യായാധിപന്മാർ
    author: രചയിതാവ് അജ്ഞാതൻ; ആവർത്തനപുസ്തകപരമായ ചരിത്രത്തിന്റെ ഭാഗം.
    audience: രാജവാഴ്ചയ്ക്കു മുമ്പുള്ള തങ്ങളുടെ ഭൂതകാലത്തെ വിശ്വാസത്യാഗത്തിന്റെയും വിടുതലിന്റെയും മുന്നറിയിപ്പുനൽകുന്ന ആവർത്തനചക്രമായി വായിച്ച പിൽക്കാല ഇസ്രായേൽജനത.
    date: ഏകദേശം ക്രി.മു. 7–6 നൂറ്റാണ്ടുകളിൽ സമാഹരിക്കപ്പെട്ടത്.
    chapters:
      '1':
        title: കനാന്യർക്കെതിരെ യെഹൂദ നേതൃത്വം നൽകുന്നു
      '2':
