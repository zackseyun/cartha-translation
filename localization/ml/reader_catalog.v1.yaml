      '7':
        title: ന്യായവിധിക്കിടയിലും പ്രവചനം പ്രത്യാശ വാഗ്ദാനം ചെയ്യുന്നു
      '8':
        title: ആശേരിനെ ഹെബ്രോനിൽ സമാധാനപൂർവം അടക്കം ചെയ്യുന്നു
  Testament of Joseph:
