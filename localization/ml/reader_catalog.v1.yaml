    display_name: ഫിലിപ്പിയർക്കുള്ള പോളികാർപ്പിന്റെ ലേഖനം
    author: സ്മിർണയിലെ ബിഷപ്പായ പോളികാർപ്പ്. ലഭ്യമായ പാഠത്തിൽ ഒന്നിലധികം സന്ദർഭങ്ങളിൽ അയച്ച ഉള്ളടക്കം സംയോജിപ്പിച്ചിട്ടുണ്ടെന്ന് ചില പണ്ഡിതർ കരുതുന്നു.
    audience: ഇഗ്നേഷ്യസിന്റെ ലേഖനങ്ങൾ അഭ്യർഥിക്കുകയും വിശ്വാസം, പെരുമാറ്റം, നേതൃത്വം, പണം, സ്ഥിരോത്സാഹം എന്നിവയെക്കുറിച്ചുള്ള ഉപദേശം ലഭിക്കുകയും ചെയ്ത ഫിലിപ്പിയിലെ ക്രൈസ്തവസഭ.
    date: ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ ആദ്യകാലം മുതൽ മധ്യകാലം വരെ; ഇതിന്റെ ഒരു ഭാഗമെങ്കിലും ഇഗ്നേഷ്യസിന്റെ യാത്രയുമായി അടുത്ത് ബന്ധപ്പെട്ടിരിക്കുന്നു. ഇത് വിവിധ ഭാഗങ്ങൾ ചേർന്ന ലേഖനമാണെന്ന നിർദേശമനുസരിച്ച്, ഒരു ഭാഗം കുറച്ചുകൂടി പിൽക്കാലത്തേതായിരിക്കാം.
    chapters:
      '1':
        title: ഫിലിപ്പിയർക്ക് പോളികാർപ്പിന്റെ അഭിവാദ്യം
