  Gospel of Thomas:
    display_name: തോമസിന്റെ സുവിശേഷം
    author: അജ്ഞാതൻ; ആമുഖവാക്യം ഈ വചനസമാഹാരം "ദിദിമോസ് യൂദാസ് തോമസ്" എഴുതിയതാണെന്ന് പറയുന്നു. നാഗ് ഹമ്മാദിയിൽനിന്നുള്ള നാലാം നൂറ്റാണ്ടിലെ ഒരു കോപ്റ്റിക് പരിഭാഷയിൽ (NHC II,2) മാത്രമാണ് ഇത് പൂർണരൂപത്തിൽ നിലനിൽക്കുന്നത്; ഓക്സിറിങ്കസിൽനിന്നുള്ള മൂന്ന് ഗ്രീക്ക് ശകലങ്ങളും ലഭ്യമാണ്.
    audience: സുറിയാനി ജ്ഞാനപാരമ്പര്യവും ആദിമ ജ്ഞാനവാദചിന്തയും സ്വാധീനിച്ച, യേശുവിന്റെ വചനങ്ങളിലൂടെ നിഗൂഢമായ ആത്മജ്ഞാനത്തിലേക്ക് അഭിമുഖമായ ക്രൈസ്തവ വായനക്കാർ.
    date: ഗ്രീക്ക് മൂലരചന മിക്കവാറും ഏകദേശം എ.ഡി. 50–140; കോപ്റ്റിക് കൈയെഴുത്തുപ്രതി ഏകദേശം എ.ഡി. 340.
    summary: തോമസിന്റെ സുവിശേഷം യേശുവിന്റേതായി പറയപ്പെടുന്ന വചനങ്ങളുടെ ഒരു സമാഹാരമാണ്. തുടർച്ചയായ കഥ ഇതിലില്ല; വചനങ്ങളുടെ അർഥം കണ്ടെത്താൻ അത് വായനക്കാരെ ആവർത്തിച്ചു ക്ഷണിക്കുന്നു.
