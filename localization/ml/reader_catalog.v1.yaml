  Jude:
    display_name: യൂദാ
    author: പരമ്പരാഗതമായി യാക്കോബിന്റെയും യേശുവിന്റെയും സഹോദരനായ യൂദാ.
    audience: ധാർമിക നിയന്ത്രണങ്ങളെ നിരസിച്ചിരുന്ന അധ്യാപകർ നുഴഞ്ഞുകയറിയ ക്രിസ്തീയ സമൂഹങ്ങൾ.
    date: ഏകദേശം ക്രി.വ. 60–90-കൾ.
    chapters:
      '1':
        title: ഭക്തിഹീനരായ നുഴഞ്ഞുകയറ്റക്കാരെക്കുറിച്ച് യൂദാ മുന്നറിയിപ്പു നൽകുന്നു
  Revelation:
    display_name: വെളിപ്പാട്
    author: പത്മൊസിലെ യോഹന്നാൻ (നാലാമത്തെ സുവിശേഷത്തിൽനിന്ന് വ്യത്യസ്തമായ രചനാശൈലിയുള്ളത്).
    audience: സാമ്രാജ്യത്വ സമ്മർദത്തിൻ കീഴിലായിരുന്ന റോമൻ ഏഷ്യാമൈനറിലെ ഏഴ് ക്രിസ്തീയ സഭകൾ.
    date: ഏകദേശം ക്രി.വ. 90-കൾ; പരമ്പരാഗതമായി ദൊമീഷ്യന്റെ ഭരണകാലത്ത്.
    chapters:
      '1':
