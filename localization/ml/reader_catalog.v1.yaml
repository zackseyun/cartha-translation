  Wisdom of Solomon:
    display_name: ശലോമോന്റെ ജ്ഞാനം
    author: രചയിതാവ് അജ്ഞാതൻ; ശലോമോന്റെ പേരിൽ എഴുതപ്പെട്ടതായി കണക്കാക്കപ്പെടുന്നു. ഗ്രീക്കിൽ രചിച്ചത് ഹെല്ലനിസ്റ്റിക് യഹൂദനായ ഒരു എഴുത്തുകാരനാണ്; സാധ്യതയനുസരിച്ച് അലക്സാണ്ട്രിയയിൽവെച്ച്.
    audience: ഗ്രീക്ക് തത്ത്വചിന്തയുമായി സംവദിക്കുകയും വിജാതീയവും വിശ്വാസത്യാഗപരവുമായ ബദലുകൾക്കെതിരെ ഇസ്രായേലിന്റെ ജ്ഞാനത്തെ ന്യായീകരിക്കുകയും ചെയ്തിരുന്ന ഹെല്ലനിസ്റ്റിക് യഹൂദർ.
    date: ഏകദേശം ക്രി.മു. 50–ക്രി.വ. 50.
    chapters:
      '1':
        title: അന്വേഷകർക്ക് ദൈവം ജ്ഞാനം വെളിപ്പെടുത്തുന്നു
      '2':
        title: ദുഷ്ടർ ജീവിതത്തിന്റെ യഥാർഥ സന്തോഷം നിരസിക്കുന്നു
      '3':
        title: നീതിമാന്മാരുടെ ആത്മാക്കൾ സമാധാനത്തിൽ വിശ്രമിക്കുന്നു
      '4':
        title: സദ്ഗുണം ആദരിക്കപ്പെടുന്നു; ഭക്തിഹീനർ ലജ്ജിക്കുന്നു
      '5':
        title: നീതിമാന്മാർ ദുഷ്ടതയെ ധൈര്യത്തോടെ തുറന്നുകാട്ടുന്നു
      '6':
        title: ജ്ഞാനം യഥാർഥ രാജത്വത്തിലേക്കു നയിക്കുന്നു
      '7':
