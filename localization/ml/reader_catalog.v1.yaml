      '3':
        title: ദൈവത്തിൽ ആശ്രയിക്കുക; ജ്ഞാനം നേടുക
      '4':
        title: എല്ലാറ്റിനുമുപരി ജ്ഞാനം തേടാൻ പിതാവ് പ്രേരിപ്പിക്കുന്നു
      '5':
        title: വ്യഭിചാരത്തിനെതിരെ പിതാവ് മുന്നറിയിപ്പു നൽകുന്നു
      '6':
        title: പാപത്തിനും അലസതയ്ക്കുമെതിരായ മുന്നറിയിപ്പുകൾ
      '7':
        title: വ്യഭിചാരത്തിന്റെ പ്രലോഭനത്തിൽനിന്ന് അകന്നുനിൽക്കുക
      '8':
        title: അന്വേഷിക്കുന്നവരെ ജ്ഞാനം വിളിക്കുന്നു
      '9':
        title: ജ്ഞാനം ക്ഷണിക്കുന്നു; ഭോഷത്തം പ്രലോഭിപ്പിക്കുന്നു
      '10':
        title: നീതിയും ദുഷ്ടതയും തമ്മിലുള്ള വൈരുധ്യങ്ങൾ
      '11':
        title: നേർമ്മ അനുഗ്രഹത്തിലേക്കു നയിക്കുന്നു
      '12':
        title: നീതിമാന്മാർ ജ്ഞാനത്തോടെയും നന്മയോടെയും ജീവിക്കുന്നു
      '13':
        title: പഠിക്കാൻ സന്നദ്ധത ജീവനിലേക്കു നയിക്കുന്നു
      '14':
        title: ജ്ഞാനം ഭവനം പണിയുകയും കർത്താവിനെ ഭയപ്പെടുകയും ചെയ്യുന്നു
      '15':
        title: സൗമ്യമായ സംസാരം ജീവൻ നൽകുന്നു
      '16':
        title: മനുഷ്യർ പദ്ധതിയിടുന്നു; ഫലങ്ങൾ ദൈവം നയിക്കുന്നു
      '17':
        title: ദൈവഭയം ജ്ഞാനം നൽകുന്നു
      '18':
        title: ജ്ഞാനം കേൾക്കുന്നു; ഭോഷത്തം തിരുത്തൽ നിരസിക്കുന്നു
      '19':
        title: സമ്പത്തിനേക്കാൾ എപ്പോഴും ശ്രേഷ്ഠം സത്യസന്ധത
      '20':
        title: മദ്യപാനം ഒഴിവാക്കി സത്യസന്ധതയെ വിലമതിക്കുക
      '21':
        title: ദൈവം ഹൃദയങ്ങളെ വിധിക്കുകയും നീതിയെ വിലമതിക്കുകയും ചെയ്യുന്നു
      '22':
        title: താഴ്മ ദൈവത്തെ കൂടുതൽ ബഹുമാനിക്കുന്നു
      '23':
        title: അതിഭക്ഷണത്തിനും അത്യാഗ്രഹത്തിനുമെതിരെ മുന്നറിയിപ്പ്
      '24':
        title: ദുഷ്ടരോട് അസൂയപ്പെടരുത്
      '25':
        title: ജ്ഞാനം താഴ്മയ്ക്ക് ആഹ്വാനം ചെയ്യുന്നു
      '26':
        title: ഭോഷന്മാർ തങ്ങളെയും മറ്റുള്ളവരെയും ദോഷപ്പെടുത്തുന്നു
      '27':
        title: താഴ്മയും യാഥാർഥ്യബോധവും പഠിപ്പിക്കുന്നു
      '28':
        title: യഹോവയെ അന്വേഷിച്ച് നീതിമാന്മാർ വിജയം നേടുന്നു
      '29':
        title: ദുശ്ശാഠ്യം നാശത്തിലേക്കു നയിക്കുന്നു
      '30':
        title: ആഗൂർ അഗാധമായ താഴ്മയോടെ സംസാരിക്കുന്നു
      '31':
        title: നീതി നിലനിർത്താൻ അമ്മ രാജാവിനെ ഉപദേശിക്കുന്നു
  Ecclesiastes:
    display_name: സഭാപ്രസംഗി
    author: രചയിതാവ് അജ്ഞാതൻ; പ്രഭാഷകൻ "കോഹെലെത്ത്" എന്നാണ് അറിയപ്പെടുന്നത്; പാരമ്പര്യമായി ശലോമോനുമായി തിരിച്ചറിയപ്പെടുന്നു.
    audience: സൂര്യനുകീഴിൽ ജ്ഞാനം, സമ്പത്ത്, പ്രയത്നം എന്നിവയ്ക്കുള്ള പരിമിതികളെ അഭിമുഖീകരിക്കുന്ന ഇസ്രായേല്യർ.
    date: അരമായ സ്വാധീനമുള്ള എബ്രായ ഭാഷയെ അടിസ്ഥാനമാക്കി, സാധ്യതയേറിയ കാലം ഏകദേശം ക്രി.മു. 5–3 നൂറ്റാണ്ടുകളാണ്.
    chapters:
      '1':
        title: സൂര്യനുകീഴിലുള്ളതെല്ലാം വ്യർഥം
      '2':
        title: സുഖഭോഗം നിലനിൽക്കുന്ന നേട്ടമൊന്നും നൽകുന്നില്ല
      '3':
        title: ഓരോ കാര്യത്തിനുമുള്ള സമയം വരുന്നു
      '4':
        title: ക്രൂരമായ പീഡനം നിറഞ്ഞ ജീവിതം
      '5':
        title: ദൈവത്തെ ഭയപ്പെട്ട് നേർച്ചകൾ നിറവേറ്റുക
      '6':
        title: ആസ്വദിക്കാനാകാത്ത സമ്പത്ത് കയ്പേറിയതാണ്
      '7':
        title: അഹങ്കാരത്തേക്കാൾ ജ്ഞാനം ശ്രേഷ്ഠം
      '8':
        title: താഴ്മയോടെ ജീവിക്കാൻ ജ്ഞാനം പഠിപ്പിക്കുന്നു
      '9':
        title: നീതിമാനും ദുഷ്ടനും ഒരേ വിധി പങ്കിടുന്നു
      '10':
        title: ഭോഷത്തം ജ്ഞാനത്തെ വേഗത്തിൽ നശിപ്പിക്കുന്നു
      '11':
        title: കഴിയുമ്പോൾ ധൈര്യത്തോടെ സാഹസത്തിന് മുതിരുക
      '12':
        title: യൗവനത്തിൽ സ്രഷ്ടാവിനെ ഓർക്കുക
  Song of Solomon:
    display_name: ഉത്തമഗീതം
    author: രചയിതാവ് അജ്ഞാതൻ; ശീർഷകക്കുറിപ്പ് ശലോമോനെ പരാമർശിക്കുന്നു.
    audience: ഉടമ്പടിയിലെ ആത്മബന്ധം മനസ്സിലാക്കാനുള്ള ഒരു വീക്ഷണമായി ലൈംഗികപ്രണയത്തെ വായിക്കുന്ന ഇസ്രായേൽ—പിന്നീട് അതിനെ രൂപകാത്മകമായി വായിച്ച യഹൂദ-ക്രൈസ്തവ വായനക്കാരും.
    date: സാധ്യതയനുസരിച്ച് പ്രവാസാനന്തരകാലത്ത്, ഏകദേശം ക്രി.മു. 5–3 നൂറ്റാണ്ടുകളിൽ.
    chapters:
      '1':
        title: സ്ത്രീ തന്റെ പ്രിയകാമുകനെ അന്വേഷിക്കുന്നു
      '2':
        title: പ്രണയികൾ അഗാധമായ ആദരവ് പരസ്പരം പ്രകടിപ്പിക്കുന്നു
      '3':
        title: സ്ത്രീ നഗരത്തിൽ തന്റെ പ്രിയനെ കണ്ടെത്തുന്നു
      '4':
        title: പുരുഷൻ വധുവിന്റെ ശാരീരികസൗന്ദര്യത്തെ പുകഴ്ത്തുന്നു
      '5':
        title: കാണാതായ പ്രിയനെ സ്ത്രീ അന്വേഷിക്കുന്നു
      '6':
        title: പുരുഷൻ അതുല്യമായ അർപ്പണവും സ്നേഹവും ആഘോഷിക്കുന്നു
      '7':
        title: പ്രിയപുരുഷൻ സ്ത്രീയുടെ സൗന്ദര്യത്തെ പുകഴ്ത്തുന്നു
      '8':
        title: പരസ്യമായി സ്നേഹം പ്രകടിപ്പിക്കാൻ സ്ത്രീ ആഗ്രഹിക്കുന്നു
  Isaiah:
    display_name: യെശയ്യാവ്
    author: പല നൂറ്റാണ്ടുകളിലായി ഒന്നിലധികം രചയിതാക്കൾ; 1–39 അധ്യായങ്ങൾ ക്രി.മു. എട്ടാം നൂറ്റാണ്ടിലെ യെരൂശലേമുകാരനായ യെശയ്യാവിൽ വേരൂന്നിയവയാണ്; 40–55 ("രണ്ടാം യെശയ്യാവ്"), 56–66 ("മൂന്നാം യെശയ്യാവ്") എന്നീ ഭാഗങ്ങൾ പ്രവാസത്തിന്റെയും മടങ്ങിവരവിന്റെയും സാഹചര്യങ്ങളോട് പ്രതികരിക്കുന്നു.
    audience: അശ്ശൂരിന്റെ ഭീഷണി നേരിട്ട യെഹൂദാ, ബാബിലോന്യ പ്രവാസത്തിലുള്ളവർ, പ്രവാസാനന്തര പുനഃസ്ഥാപനകാലത്തുള്ളവർ—തുടർച്ചയായ ഈ ഘട്ടങ്ങളിലെ ജനങ്ങൾ.
    date: ഏകദേശം ക്രി.മു. എട്ടാം നൂറ്റാണ്ടിന്റെ അവസാനംമുതൽ അഞ്ചാം നൂറ്റാണ്ടുവരെ വിവിധ ഘട്ടങ്ങളിലായി രചിക്കപ്പെട്ടത്.
    chapters:
      '1':
        title: ധിക്കാരിയായ യെഹൂദയെ ദൈവം നിരസിക്കുന്നു
      '2':
        title: യഹോവയുടെ ആലയം എല്ലാറ്റിനും മീതെ ഉയർത്തപ്പെടുന്നു
      '3':
        title: ന്യായവിധി രാജ്യത്തിന്റെ തകർച്ച വരുത്തുന്നു
      '4':
        title: നാശത്തിനുശേഷം പുനഃസ്ഥാപനം വാഗ്ദാനം ചെയ്യപ്പെടുന്നു
      '5':
        title: കർത്താവിന്റെ മുന്തിരിത്തോട്ടം അക്രമം വിളയിക്കുന്നു
      '6':
        title: ദൈവത്തിന്റെ അതിമഹത്തായ തേജസ്സ് യെശയ്യാവ് കാണുന്നു
      '7':
        title: അശ്ശൂർ വരുംമുമ്പ് ഇമ്മാനുവേൽ ജനിക്കുന്നു
      '8':
        title: മഹേർ-ശാലാൽ-ഹാശ്-ബസ് എന്ന പേര് ന്യായവിധിയെ സൂചിപ്പിക്കുന്നു
      '9':
        title: യെശയ്യാവിന് വെളിച്ചം പ്രത്യാശ നൽകുന്നു
      '10':
        title: അഹങ്കാരിയായ അശ്ശൂരിനെ ദൈവം വിധിക്കുന്നു
      '11':
        title: പുതിയ രാജാവ് ഭൂമിയിൽ സമാധാനം കൊണ്ടുവരുന്നു
      '12':
        title: ദൈവജനം തങ്ങളുടെ രക്ഷയെച്ചൊല്ലി സ്തുതിക്കുന്നു
      '13':
        title: ബാബിലോൻ സമ്പൂർണ നാശം നേരിടുന്നു
      '14':
        title: വീണുപോയ ബാബിലോൻ രാജാവിനെ ഇസ്രായേൽ പരിഹസിക്കുന്നു
      '15':
        title: മോവാബിന് പെട്ടെന്ന് കനത്ത ദുരന്തം സംഭവിക്കുന്നു
      '16':
        title: മോവാബിന്റെ അഹങ്കാരം കഠിനമായ ന്യായവിധി വരുത്തുന്നു
      '17':
        title: ദമസ്കൊസും എഫ്രയീമും പൂർണമായി ശൂന്യമാക്കപ്പെടുന്നു
      '18':
        title: വിദൂരദേശം ദൂരേക്കു ദൂതന്മാരെ അയക്കുന്നു
      '19':
        title: ഈജിപ്ത് അപമാനവും തുടർന്ന് സൗഖ്യവും നേരിടുന്നു
      '20':
        title: അടയാളമായി യെശയ്യാവ് വസ്ത്രമുരിഞ്ഞ് നടക്കുന്നു
      '21':
        title: ബാബിലോൻ പെട്ടെന്ന് വീഴുന്നു; വിരുന്ന് അവസാനിക്കുന്നു
      '22':
        title: യെരൂശലേമിന്റെ കോലാഹലം ന്യായവിധി വരുത്തുന്നു
      '23':
        title: സോരിന്റെ സമ്പത്തും ശക്തിയും തകരുന്നു
      '24':
