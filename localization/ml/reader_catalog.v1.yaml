  Martyrdom of Polycarp:
    display_name: പോളികാർപ്പിന്റെ രക്തസാക്ഷിത്വം
    author: സ്മിർണയിലെ സഭയിലെ പേരറിയാത്ത അംഗങ്ങൾ, സമൂഹത്തിന്റെ പേരിൽ എഴുതിയത്; അവസാനത്തിലുള്ള പകർപ്പുപരമ്പരയെക്കുറിച്ചുള്ള കുറിപ്പുകൾ പിൽക്കാലത്തെ പകർപ്പെടുപ്പും പ്രചാരവും പ്രതിഫലിപ്പിക്കുന്നു.
    audience: പോളികാർപ്പിന്റെ അറസ്റ്റ്, വിചാരണ, മരണം, മാതൃകാപരമായ സഹനം എന്നിവ വിവരിക്കുന്ന ഈ രേഖ ഫിലോമേലിയത്തിലെ സഭയ്ക്കും വിശാലമായ ക്രൈസ്തവ കൂട്ടായ്മയ്ക്കുമായി നൽകിയതാണ്.
    date: പോളികാർപ്പിന്റെ മരണത്തിനുശേഷം എഴുതപ്പെട്ടത്; സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ മധ്യത്തിലോ അവസാനത്തിലോ ഉള്ളതായി കണക്കാക്കുന്നു. രക്തസാക്ഷിത്വത്തിന്റെ കൃത്യമായ വർഷവും രേഖയുടെ അന്തിമരൂപവും സംബന്ധിച്ച് അഭിപ്രായവ്യത്യാസമുണ്ട്.
    chapters:
      '1':
        title: സഭ എല്ലാവർക്കും കരുണ ആശംസിക്കുന്നു
      '2':
        title: പോളികാർപ്പിന്റെ രക്തസാക്ഷിത്വം സ്ഥിരീകരിക്കപ്പെടുന്നു
      '3':
        title: രക്തസാക്ഷികൾ ക്രിസ്തുവിനുവേണ്ടി സഹിച്ചുനിൽക്കുന്നു
      '4':
        title: ജെർമാനിക്കസ് വന്യമൃഗങ്ങളെ നേരിടുന്നു
      '5':
        title: ക്വിന്റസിന് ധൈര്യം നഷ്ടപ്പെടുന്നു
      '6':
        title: പോളികാർപ്പ് എല്ലാവർക്കുമായി പ്രാർഥിക്കുന്നു
      '7':
        title: സ്വന്തം വീട്ടിലുള്ളവരാൽ ഒറ്റിക്കൊടുക്കപ്പെടുന്നു
      '8':
        title: പോളികാർപ്പ് തന്റെ വിധിയെ സ്വാഗതം ചെയ്യുന്നു
      '9':
        title: ക്രിസ്തുവിനെ നിഷേധിക്കാൻ ഹെരോദാവ് പോളികാർപ്പിനെ പ്രേരിപ്പിക്കുന്നു
      '10':
        title: സ്വർഗീയശബ്ദം പോളികാർപ്പിനെ ശക്തിപ്പെടുത്തുന്നു
      '11':
        title: ക്രിസ്തുവിനെ കുറ്റപ്പെടുത്താൻ പോളികാർപ്പ് വിസമ്മതിക്കുന്നു
      '12':
        title: മരണഭീഷണികളെ പോളികാർപ്പ് പരിഹസിക്കുന്നു
      '13':
        title: പോളികാർപ്പിനെ ചുട്ടുകൊല്ലണമെന്ന് ജനക്കൂട്ടം ആവശ്യപ്പെടുന്നു
      '14':
        title: സ്തംഭത്തിൽ കെട്ടപ്പെട്ട് പോളികാർപ്പ് പ്രാർഥിക്കുന്നു
      '15':
        title: പോളികാർപ്പ് സ്തംഭത്തിങ്കൽ പ്രാർഥിക്കുന്നു
      '16':
        title: തീജ്വാലകൾ പോളികാർപ്പിനെ വലയം ചെയ്യുന്നു
      '17':
        title: പോളികാർപ്പിന്റെ രക്തം തീ കെടുത്തുന്നു
      '18':
        title: നിക്കേറ്റസ് അധികാരിയോട് നിഷേധിക്കാൻ ആവശ്യപ്പെടുന്നു
      '19':
        title: ക്രൈസ്തവർ പോളികാർപ്പിന്റെ അസ്ഥികൾ ശേഖരിക്കുന്നു
      '20':
        title: പോളികാർപ്പ് ഭരണാധികാരിയെ ജയിച്ച് കിരീടം പ്രാപിക്കുന്നു
      '21':
        title: മാർക്കിയാനസ് വിശ്വാസികൾക്ക് സംഗ്രഹം അയയ്ക്കുന്നു
      '22':
        title: ശബ്ബത്തിൽ പോളികാർപ്പ് രക്തസാക്ഷിയാകുന്നു
      '23':
        title: പോളികാർപ്പിനെ രാജ്യത്തിലേക്ക് അനുഗമിക്കുക
  Epistle to Diognetus:
    display_name: ദിയോഗ്നേറ്റസിനുള്ള ലേഖനം
    author: പേരറിയാത്തയാൾ. എഴുത്തുകാരൻ സ്വയം ഒരു ശിഷ്യൻ അഥവാ പഠിതാവ് എന്നു വിളിക്കുന്നു; എന്നാൽ അദ്ദേഹത്തെയോ ലേഖനം അഭിസംബോധന ചെയ്യുന്ന ദിയോഗ്നേറ്റസിനെയോ ഉറപ്പായി തിരിച്ചറിയാനാവില്ല.
    audience: ക്രൈസ്തവ ആരാധന, ധാർമികജീവിതം, സാമൂഹിക സ്വത്വം, സ്നേഹം, വിശ്വാസത്തിന്റെ പ്രകടമായ പുതുമ എന്നിവയെക്കുറിച്ച് അന്വേഷിക്കുന്ന വിദ്യാസമ്പന്നനായ ഒരു അക്രൈസ്തവനും അദ്ദേഹത്തെപ്പോലുള്ള വായനക്കാരും.
    date: പലപ്പോഴും ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ അവസാനമോ മൂന്നാം നൂറ്റാണ്ടിന്റെ ആദ്യമോ ആയി തീയതി നിശ്ചയിക്കപ്പെടുന്നു; എങ്കിലും നിർദേശങ്ങൾക്കിടയിൽ വലിയ വ്യത്യാസമുണ്ട്. അവസാനത്തെ രണ്ടു അധ്യായങ്ങൾ മറ്റൊരു കൃതിയിൽനിന്നുള്ളതായിരിക്കാം.
    chapters:
      '1':
        title: ദിയോഗ്നേറ്റസ് വിശ്വാസത്തെക്കുറിച്ചുള്ള ഗ്രാഹ്യം തേടുന്നു
      '2':
        title: മനുഷ്യരുടെ കൈകളാൽ രൂപപ്പെടുത്തിയ വിഗ്രഹങ്ങൾ
      '3':
        title: ക്രൈസ്തവർ വ്യാജാരാധന നിരസിക്കുന്നു
      '4':
        title: ദൈവത്തിന്റെ നല്ല ദാനങ്ങളെ നിരസിക്കൽ
      '5':
        title: പരദേശികളെങ്കിലും പൂർണമായി ഉൾപ്പെട്ടവർ
      '6':
        title: ലോകത്തിനുള്ളിൽ ആത്മാവ് വസിക്കുന്നു
      '7':
        title: അദൃശ്യനായ സ്രഷ്ടാവിൽനിന്നുള്ള സത്യം
      '8':
        title: വിശ്വാസം മറഞ്ഞിരുന്ന സത്യം വെളിപ്പെടുത്തുന്നു
      '9':
        title: വിസ്മയകരമായ കൃപയിലൂടെയുള്ള രക്ഷ
      '10':
        title: യഥാർഥ സന്തോഷം സ്നേഹത്തിൽനിന്ന് വരുന്നു
      '11':
        title: കൃപ സഭയെ നിരന്തരം സമ്പന്നമാക്കുന്നു
      '12':
        title: ജ്ഞാനം നിറഞ്ഞ ഹൃദയം ഫലം കായ്ക്കുന്നു
  Fragments of Papias:
    display_name: പാപ്പിയാസിന്റെ ശകലങ്ങൾ
    author: നഷ്ടപ്പെട്ട അഞ്ചു പുസ്തകങ്ങളടങ്ങിയ ‘കർത്താവിന്റെ വചനങ്ങളുടെ വ്യാഖ്യാനങ്ങൾ’ എന്ന കൃതിയുടെ രചയിതാവായ ഹിയരാപൊലിസിലെ ബിഷപ്പ് പാപ്പിയാസ്; നിലനിൽക്കുന്ന സമാഹാരം പിൽക്കാല എഴുത്തുകാർ സംരക്ഷിച്ച ഉദ്ധരണികളും വിവരണങ്ങളും ചേർന്നതാണ്.
    audience: പേരെടുത്തുപറയുന്ന വാമൊഴിസാക്ഷ്യത്തിന്റെയും വ്യാഖ്യാനത്തിന്റെയും പരമ്പരകളിലൂടെ സമാഹരിക്കപ്പെട്ട, യേശുവിനെയും അപ്പൊസ്തലന്മാരെയും കുറിച്ചുള്ള ഓർമയിൽ നിലനിന്ന പഠിപ്പിക്കലുകൾ അന്വേഷിച്ച ആദിമ ക്രൈസ്തവർ.
    date: പാപ്പിയാസിന്റെ കൃതി സാധാരണയായി ക്രി.വ. രണ്ടാം നൂറ്റാണ്ടിന്റെ ആദ്യകാലത്തേതായി, പലപ്പോഴും ഏകദേശം 110–130 കാലയളവിലേതായി, കണക്കാക്കപ്പെടുന്നു; നിലനിൽക്കുന്ന ശകലങ്ങൾ രണ്ടാം നൂറ്റാണ്ടുമുതലുള്ള എഴുത്തുകാരുടെ കൃതികളിലാണ് കാണപ്പെടുന്നത്.
    chapters:
      '1':
        title: യോഹന്നാന്റെ കാലത്തിനുശേഷം നേതാക്കൾ ഉയർന്നുവരുന്നു
      '2':
        title: പാപ്പിയാസ് കർത്താവിന്റെ പഠിപ്പിക്കലുകൾ എഴുതുന്നു
      '3':
        title: വ്യഭിചാരിണിയായ സ്ത്രീയെ യേശു രക്ഷിക്കുന്നു
      '4':
        title: മൂപ്പനായ യോഹന്നാന്റെ പാരമ്പര്യങ്ങൾ പാപ്പിയാസ് പഠിപ്പിക്കുന്നു
      '5':
        title: ജെറോം പാപ്പിയാസിന്റെ കൃതിയെ വിവരിക്കുന്നു
      '6':
        title: ഐറേനിയോസ് പാപ്പിയാസിൽനിന്ന് പഠിക്കുന്നു
      '7':
        title: ആൻഡ്രിയാസ് പാപ്പിയാസിന്റെ സാക്ഷ്യം ഉദ്ധരിക്കുന്നു
      '8':
