  John:
    display_name: യോഹന്നാൻ
    author: രചയിതാവ് അജ്ഞാതൻ; അപ്പൊസ്തലനായ യോഹന്നാനോ "പ്രിയശിഷ്യനോ" ആണ് രചിച്ചതെന്ന് പാരമ്പര്യം പറയുന്നു.
    audience: പ്രിയശിഷ്യന്റെ സാക്ഷ്യത്തെ ആധാരമാക്കി രൂപപ്പെട്ടതും സിനഗോഗ് കേന്ദ്രീകൃത യഹൂദമതവുമായി സംഘർഷത്തിലായിരുന്നതുമായ ഒരു ക്രിസ്തീയ സമൂഹം.
    date: ഏകദേശം എ.ഡി. 90–110.
    summary: പിതാവിനെ വെളിപ്പെടുത്തുകയും തന്നിലുള്ള വിശ്വാസത്തിലൂടെ ജീവൻ നൽകുകയും തന്റെ അടയാളങ്ങൾ, മരണം, പുനരുത്ഥാനം എന്നിവയിലൂടെ മഹത്ത്വപ്പെടുകയും ചെയ്യുന്ന നിത്യവചനമായി യോഹന്നാൻ യേശുവിനെ അവതരിപ്പിക്കുന്നു.
    chapters:
      '1':
        title: വചനം ജഡമായിത്തീരുന്നു
      '2':
        title: യേശു വെള്ളം വീഞ്ഞാക്കുന്നു
      '3':
        title: ദൈവം തന്റെ പ്രിയപുത്രനെ നൽകുന്നു
      '4':
        title: യേശു ശമര്യക്കാരിയായ സ്ത്രീയെ കണ്ടുമുട്ടുന്നു
      '5':
        title: യേശു ശബ്ബത്തിൽ ഒരു മനുഷ്യനെ സൗഖ്യമാക്കുന്നു
      '6':
        title: യേശു അയ്യായിരം പേർക്ക് ഭക്ഷണം നൽകുന്നു
      '7':
        title: യേശു ഉത്സവത്തിൽ പഠിപ്പിക്കുന്നു
      '8':
        title: ലോകത്തിന്റെ വെളിച്ചമായ യേശു തിരസ്കരിക്കപ്പെടുന്നു
      '9':
        title: യേശു അന്ധനായ മനുഷ്യനെ സൗഖ്യമാക്കുന്നു
      '10':
        title: യേശു തന്റെ ആടുകളെക്കുറിച്ച് സംസാരിക്കുന്നു
      '11':
        title: യേശു ലാസറിനെ മരണത്തിൽനിന്ന് ഉയിർപ്പിക്കുന്നു
      '12':
        title: മറിയ യേശുവിന്റെ സംസ്കാരത്തിനായി അവനെ അഭിഷേകം ചെയ്യുന്നു
      '13':
        title: യേശു ശിഷ്യന്മാരുടെ കാലുകൾ കഴുകുന്നു
      '14':
        title: യേശു പരിശുദ്ധാത്മാവിനെ വാഗ്ദാനം ചെയ്യുന്നു
      '15':
        title: സത്യമായ മുന്തിരിവള്ളിയായ യേശു കൊമ്പുകളെ വെട്ടിയൊരുക്കുന്നു
      '16':
        title: കഷ്ടം വരുന്നു, എന്നാൽ സന്തോഷം നിലനിൽക്കുന്നു
      '17':
        title: യേശു തന്റെ ശിഷ്യന്മാർക്കുവേണ്ടി പ്രാർഥിക്കുന്നു
      '18':
        title: യേശു അറസ്റ്റിലാകുന്നു; പത്രോസ് തള്ളിപ്പറയുന്നു
      '19':
        title: യേശു ചാട്ടവാറടിയേൽക്കുകയും പരിഹസിക്കപ്പെടുകയും ക്രൂശിക്കപ്പെടുകയും ചെയ്യുന്നു
      '20':
        title: യേശു മറിയയ്ക്ക് തന്നെ വെളിപ്പെടുത്തുന്നു
      '21':
        title: യേശു കടൽത്തീരത്ത് പത്രോസിനെ പുനഃസ്ഥാപിക്കുന്നു
  Acts:
    display_name: അപ്പൊസ്തലപ്രവൃത്തികൾ
    author: രചയിതാവ് അജ്ഞാതൻ; ലൂക്കോസിന്റെ അതേ രചയിതാവ്.
    audience: ഗ്രീക്കോ-റോമൻ ക്രിസ്തീയ വായനക്കാർ; തെയോഫിലോസിനെ അഭിസംബോധന ചെയ്ത കൃതിയുടെ രണ്ടാം ഭാഗം.
    date: ഏകദേശം എ.ഡി. 80–90.
    chapters:
      '1':
        title: സാക്ഷികൾ ആത്മാവിനായി കാത്തിരിക്കുന്നു
      '2':
        title: പെന്തെക്കൊസ്തിൽ ആത്മാവ് ജ്വലിക്കുന്നു
      '3':
        title: പത്രോസ് മുടന്തനായ ഭിക്ഷക്കാരനെ സൗഖ്യമാക്കുന്നു
      '4':
        title: അപ്പൊസ്തലന്മാർ വിശുദ്ധ ധൈര്യത്തോടെ സംസാരിക്കുന്നു
      '5':
        title: ന്യായവിധിയും അത്ഭുതങ്ങളും സഭയെ പരീക്ഷിക്കുന്നു
      '6':
        title: ഏഴ് ശുശ്രൂഷകർ സഭയെ സഹായിക്കുന്നു
      '7':
        title: സ്തെഫാനോസ് സ്വർഗം തുറന്നിരിക്കുന്നതു കാണുന്നു
      '8':
        title: സുവിശേഷം ശമര്യയിൽ എത്തുന്നു
      '9':
        title: ശൗൽ ഉയിർത്തെഴുന്നേറ്റ യേശുവിനെ കണ്ടുമുട്ടുന്നു
      '10':
        title: യഹൂദേതരർ പരിശുദ്ധാത്മാവിനെ പ്രാപിക്കുന്നു
      '11':
        title: യഹൂദേതരരെ ഉൾപ്പെടുത്തിയതിനെ പത്രോസ് ന്യായീകരിക്കുന്നു
      '12':
        title: ഒരു ദൂതൻ പത്രോസിനെ മോചിപ്പിക്കുന്നു
      '13':
        title: പൗലോസ് യഹൂദേതരരോടുള്ള ദൗത്യം ആരംഭിക്കുന്നു
      '14':
        title: പീഡനങ്ങൾക്കിടയിലും പൗലോസ് ഉറച്ചുനിൽക്കുന്നു
      '15':
        title: യെരൂശലേം സഭാസമ്മേളനം യഹൂദേതരരെ സ്വാഗതം ചെയ്യുന്നു
      '16':
        title: ആരാധന തടവറ തുറക്കുന്നു
      '17':
        title: പൗലോസ് അജ്ഞാതദൈവത്തെക്കുറിച്ച് പ്രഖ്യാപിക്കുന്നു
      '18':
        title: സുവിശേഷം കൊരിന്തിൽ എത്തുന്നു
      '19':
        title: അർത്തെമിസിനെച്ചൊല്ലി എഫെസൊസിൽ കലാപം
      '20':
        title: മൂപ്പന്മാരോട് പൗലോസിന്റെ കണ്ണീരോടെയുള്ള വിടവാങ്ങൽ
      '21':
        title: പൗലോസ് യെരൂശലേമിലേക്കു മടങ്ങുന്നു
      '22':
        title: പൗലോസ് തന്റെ വിളിയെ ന്യായീകരിക്കുന്നു
      '23':
        title: പൗലോസ് ന്യായാധിപസഭയുടെ മുമ്പിൽ നിൽക്കുന്നു
      '24':
        title: പൗലോസ് ഫെലിക്സിന്റെ മുമ്പിൽ സാക്ഷ്യം പറയുന്നു
      '25':
        title: പൗലോസ് കൈസരോട് അപ്പീൽ ചെയ്യുന്നു
      '26':
        title: പൗലോസ് അഗ്രിപ്പാവിന്റെ മുമ്പിൽ സാക്ഷ്യം പറയുന്നു
      '27':
        title: കപ്പൽച്ചേതത്തിലൂടെ ദൈവം പൗലോസിനെ കാത്തുരക്ഷിക്കുന്നു
      '28':
        title: സുവിശേഷം റോമിൽ എത്തുന്നു
  Romans:
    display_name: റോമർ
    author: ലേഖകനായ തെർത്തിയൊസിനോടൊപ്പം പൗലോസ്.
    audience: റോമിലെ ക്രിസ്ത്യാനികൾ—തോറായെയും സ്വത്വത്തെയും ചൊല്ലി സംഘർഷത്തിലായിരുന്ന യഹൂദരും യഹൂദേതരരുമായ വിശ്വാസികൾ.
    date: ഏകദേശം എ.ഡി. 56–58; കൊരിന്തിൽവെച്ച് എഴുതിയത്.
    chapters:
      '1':
        title: പൗലോസ് യേശുവിലൂടെ ലഭിക്കുന്ന നീതി പ്രഖ്യാപിക്കുന്നു
      '2':
        title: പക്ഷപാതമില്ലാതെ ന്യായവിധി വരുന്നു
      '3':
        title: എല്ലാവരും പാപത്തിന്റെ കുറ്റത്തിൻകീഴിലാണ്
      '4':
        title: അബ്രാഹാം വിശ്വാസത്താൽ മാത്രം നീതീകരിക്കപ്പെടുന്നു
      '5':
        title: ക്രിസ്തുവിന്റെ മരണത്തിലൂടെ നീതി
      '6':
        title: പാപത്തിനല്ല, ദൈവത്തിനായി ജീവിക്കുക
      '7':
        title: വിശ്വാസികൾ പാപത്തോടു പോരാടുന്നു
      '8':
        title: ഒന്നിനും നമ്മെ ക്രിസ്തുവിൽനിന്ന് വേർപെടുത്താനാവില്ല
      '9':
        title: ഇസ്രായേലിനോടുള്ള കരുണയും ക്രോധവും
      '10':
        title: രക്ഷ എല്ലാവർക്കും സമീപമാണ്
      '11':
        title: കൃപയാൽ ജാതികൾ വിളിക്കപ്പെടുന്നു
      '12':
        title: ജീവിതങ്ങളെ ജീവനുള്ള യാഗമായി സമർപ്പിക്കുക
      '13':
        title: അധികാരികൾക്ക് കീഴടങ്ങുകയും സ്നേഹിക്കുകയും ചെയ്യുക
      '14':
        title: വിശ്വാസത്തിൽ ബലഹീനരായവരെ സ്വീകരിക്കുക
      '15':
        title: യഹൂദരെയും ജാതികളെയും ഒന്നിപ്പിക്കുക
      '16':
        title: അഭിവാദ്യങ്ങളും മുന്നറിയിപ്പുകളും
  1 Corinthians:
    display_name: 1 കൊരിന്ത്യർ
    author: പൗലോസ്, സോസ്തനേസിനോടൊപ്പം.
    audience: കൊരിന്തിലെ ഭിന്നതകളാൽ കലുഷിതമായ ക്രിസ്തീയ സഭ.
    date: ഏകദേശം ക്രി.വ. 53–55; എഫെസൊസിൽനിന്ന് എഴുതിയത്.
    chapters:
      '1':
        title: എല്ലാവർക്കുമുള്ള ദൈവത്തിന്റെ വിശ്വസ്തമായ സമൃദ്ധി
      '2':
        title: ദൈവാത്മാവിൽനിന്നുള്ള ജ്ഞാനം വെളിപ്പെടുന്നു
      '3':
        title: കൊരിന്ത്യർ ദൈവത്തിന്റെ ആലയമാണെന്ന് പൗലോസ് മുന്നറിയിപ്പുനൽകുന്നു
      '4':
        title: അഹങ്കാരത്തെക്കാൾ വിശ്വസ്തതയാണ് പ്രധാനം
      '5':
        title: സഭയിൽ ശിക്ഷണനടപടി സ്വീകരിക്കാൻ പൗലോസ് കല്പിക്കുന്നു
      '6':
        title: തർക്കങ്ങൾ സഭയ്ക്കുള്ളിൽ പരിഹരിക്കുക
      '7':
        title: വിവാഹത്തെ മാനിക്കാൻ പൗലോസ് പഠിപ്പിക്കുന്നു
      '8':
        title: വ്യക്തിസ്വാതന്ത്ര്യത്തെക്കാൾ സ്നേഹത്തിന് മുൻതൂക്കം
      '9':
        title: പൗലോസ് തന്റെ അപ്പൊസ്തലത്വത്തെ സ്വതന്ത്രമായി പ്രതിരോധിക്കുന്നു
      '10':
        title: ദൈവജനത്തിനുള്ള ഇസ്രായേലിന്റെ മുന്നറിയിപ്പ്
      '11':
        title: ആരാധനയിലെ ഐക്യം ക്രിസ്തുവിനെ ആദരിക്കുന്നു
      '12':
        title: ആത്മാവിന്റെ ദാനങ്ങൾ സഭയുടെ ഐക്യം വളർത്തുന്നു
      '13':
        title: സ്നേഹം ഒരിക്കലും കൈവിടുന്നില്ല
      '14':
