      '23':
        title: കപടഭക്തിക്കെതിരെ യേശു മുന്നറിയിപ്പു നൽകുന്നു
      '24':
        title: ദൈവാലയത്തിന്റെ നാശം യേശു മുൻകൂട്ടി പറയുന്നു
