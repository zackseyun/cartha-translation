        title: അവിശുദ്ധമായ കലാപത്താൽ സഹോദരന്മാർ കഷ്ടപ്പെടുന്നു
      '2':
        title: താഴ്മ സമാധാനപൂർണമായ തീക്ഷ്ണത ഉളവാക്കുന്നു
      '3':
        title: അസൂയ യുദ്ധവും പ്രവാസവും വരുത്തുന്നു
      '4':
        title: അസൂയ പുരാതന കൊലപാതകങ്ങളിലേക്കു നയിച്ചു
      '5':
        title: പത്രോസും പൗലോസും സ്ഥിരതയ്ക്കായി സഹിച്ചു
      '6':
        title: ദൈവം തിരഞ്ഞെടുത്ത സ്ത്രീകളെ അസൂയ വേട്ടയാടി
      '7':
        title: രക്ഷയ്ക്കുള്ള രക്തം അമൂല്യം
      '8':
        title: പാപിയുടെ മാനസാന്തരമാണ് കർത്താവ് ആഗ്രഹിക്കുന്നത്
      '9':
        title: നീതിമാനായ ഹാനോക്ക് എടുക്കപ്പെടുന്നു
      '10':
        title: അനുസരണത്തിലൂടെ അബ്രാഹാം വിശ്വസ്തനെന്ന് തെളിഞ്ഞു
      '11':
        title: അതിഥിസൽക്കാരത്താൽ ലോത്ത് രക്ഷിക്കപ്പെടുന്നു
      '12':
        title: രാഹാബ് വിശ്വസ്തതയോടെ ചാരന്മാരെ ഒളിപ്പിക്കുന്നു
      '13':
        title: നമുക്ക് താഴ്മയോടെ കർത്താവിനെ അന്വേഷിക്കാം
      '14':
        title: പരസ്പരം സൗമ്യതയോടെ പെരുമാറുക
      '15':
        title: ദൈവഭക്തിയോടു ചേർന്ന സമാധാനം പിന്തുടരുക
      '16':
        title: മശീഹ എളിമയിലും താഴ്മയിലും വന്നു
      '17':
        title: കഠിനജീവിതം നയിച്ച പ്രവാചകന്മാരെ അനുകരിക്കുക
      '18':
        title: ദാവീദ് താഴ്മയോടെ തന്റെ പാപങ്ങൾ ഏറ്റുപറയുന്നു
      '19':
        title: സമാധാനപൂർണമായ ജീവിതത്തിന് താഴ്മ വഴികാട്ടുന്നു
      '20':
        title: സൃഷ്ടി ക്രമബദ്ധമായ സമാധാനത്തിൽ പ്രവർത്തിക്കുന്നു
      '21':
        title: ദൈവസന്നിധിയിൽ യോഗ്യമായി ജീവിക്കുക
      '22':
        title: കർത്താവിനെ ഭയപ്പെടാൻ ക്രിസ്തു വിളിക്കുന്നു
      '23':
        title: ആത്മാർഥഹൃദയത്തെ പിതാവ് കരുതുന്നു
      '24':
        title: ഭാവിയിലെ പുനരുത്ഥാനം ദൈവം ഉറപ്പുനൽകുന്നു
      '25':
        title: ഫീനിക്സ് മരിച്ച് വീണ്ടും ഉയിർക്കുന്നു
      '26':
        title: വിശ്വസ്തദാസന്മാരെ ദൈവം ഉയിർപ്പിക്കും
      '27':
        title: വിശ്വസ്തനായ ദൈവത്തിൽ ഹൃദയം ഉറപ്പിക്കുക
      '28':
        title: ദൈവത്തെ ഭയപ്പെടുക; എവിടെയും ഒളിക്കാനാവില്ല
      '29':
        title: ശുദ്ധമായ കൈകളോടെ അടുത്തുവരുക
      '30':
        title: പാപങ്ങൾ ഉപേക്ഷിച്ച് താഴ്മ സ്വീകരിക്കുക
      '31':
        title: അബ്രാഹാമിനെയും യിസ്ഹാക്കിനെയും യാക്കോബിനെയും പോലെ വിശ്വാസം പിന്തുടരുക
      '32':
        title: ദൈവഹിതം നമ്മെ നീതിമാന്മാരാക്കുന്നു
      '33':
        title: നന്മപ്രവൃത്തികൾ ചെയ്യാൻ ഉത്സാഹിക്കുക
      '34':
        title: ഉത്സാഹമുള്ള ജോലിക്കാർ തങ്ങളുടെ അപ്പം സമ്പാദിക്കുന്നു
      '35':
        title: സ്വർഗീയ പ്രതിഫലങ്ങൾക്കായി സഹിച്ചുനിൽക്കുക
      '36':
        title: നമ്മുടെ മഹാപുരോഹിതനായ യേശു രക്ഷിക്കുന്നു
      '37':
        title: പടയാളികൾ കൽപ്പനകൾ വിശ്വസ്തതയോടെ അനുസരിക്കുന്നു
      '38':
        title: മശീഹയായ യേശുവിലുള്ള സമൂഹം
      '39':
        title: പരിഹാസകർക്ക് തങ്ങളെത്തന്നെ ശുദ്ധരാക്കാനാവില്ല
      '40':
        title: കർത്താവിന്റെ ചട്ടങ്ങൾ നടപ്പാക്കുക
      '41':
        title: നിയോഗിക്കപ്പെട്ട ശുശ്രൂഷയിൽ സേവിക്കുക
      '42':
        title: അപ്പൊസ്തലന്മാർ നേതാക്കളെ ക്രമമായി നിയമിച്ചു
      '43':
        title: ദൈവഹിതപ്രകാരം മോശെ പുരോഹിതന്മാരെ തിരഞ്ഞെടുത്തു
      '44':
        title: അംഗീകൃത മൂപ്പന്മാരെ നീക്കരുത്
      '45':
        title: ദൈവത്തെ ആദരിച്ചതിനാൽ നീതിമാന്മാർ കഷ്ടപ്പെട്ടു
      '46':
        title: വിശുദ്ധ മാതൃകകളോട് ഒന്നായി ചേർന്നുനിൽക്കുക
      '47':
        title: പൗലോസ് നിങ്ങൾക്കെഴുതിയ കത്ത് ഓർക്കുക
      '48':
        title: നിർമലരായി നീതിയുടെ കവാടത്തിൽ പ്രവേശിക്കുക
      '49':
        title: സ്നേഹം നമ്മെ ദൈവത്തോട് ഒന്നിപ്പിക്കുന്നു
      '50':
        title: സ്നേഹം ദൈവത്തിന്റെ തിരഞ്ഞെടുക്കപ്പെട്ടവരെ പൂർണരാക്കുന്നു
      '51':
        title: നമ്മുടെ പാപങ്ങളും തെറ്റുകളും ഏറ്റുപറയുക
      '52':
        title: ദൈവത്തിന് സ്തുതിയാഗം അർപ്പിക്കുക
      '53':
        title: മോശ ധൈര്യത്തോടെ ഇസ്രായേലിനുവേണ്ടി മധ്യസ്ഥത വഹിച്ചു
      '54':
        title: സമാധാനപ്രിയരായ നേതാക്കൾ ആട്ടിൻകൂട്ടത്തെ ആദരിക്കുന്നു
      '55':
        title: സ്ത്രീകൾ ധീരകൃത്യങ്ങൾ ചെയ്തു
      '56':
        title: വഴിതെറ്റിയവർ അനുസരിക്കാൻ പ്രാർഥിക്കുക
      '57':
        title: വിനയമാണ് ജ്ഞാനമെന്ന് ജ്ഞാനം പ്രഖ്യാപിക്കുന്നു
      '58':
        title: ദൈവത്തിൽ ആശ്രയിച്ച് എന്നേക്കും സുരക്ഷിതരായിരിക്കുക
      '59':
        title: തിരഞ്ഞെടുക്കപ്പെട്ടവരെ ദൈവം കാത്തുസൂക്ഷിക്കാൻ പ്രാർഥിക്കുക
      '60':
        title: പാപങ്ങൾ ക്ഷമിച്ച് ചുവടുകൾ നയിക്കണമേ
      '61':
        title: ദൈവം ഭരണാധികാരികളെ ജ്ഞാനത്തോടെ നയിക്കുന്നു
      '62':
        title: സദ്ഗുണത്തോടെ ജീവിക്കാൻ വിശ്വാസം പഠിപ്പിക്കുന്നു
      '63':
        title: വിനയം സമാധാനവും സന്തോഷവും നൽകുന്നു
      '64':
        title: എല്ലാവർക്കും വിശ്വാസവും സഹനവും നൽകണമേ
      '65':
        title: പ്രതിനിധികൾ സുവാർത്തയുമായി മടങ്ങിവരട്ടെ
  1 Enoch:
    display_name: 1 ഹാനോക്ക്
    author: അജ്ഞാതം; പ്രളയത്തിനു മുമ്പുള്ള ഗോത്രപിതാവായ ഹാനോക്കിന്റെ പേരിൽ കപടനാമമായി ആരോപിക്കപ്പെട്ട കൃതി. വ്യത്യസ്തമായ പല ഭാഗങ്ങൾ ചേർത്ത് രൂപപ്പെടുത്തിയ ഒരു സമാഹാരകൃതിയാണിത്.
    audience: പ്രപഞ്ചത്തിലെ തിന്മ, ന്യായവിധി, കലണ്ടർ എന്നിവയെക്കുറിച്ച് ചിന്തിച്ചിരുന്ന യഹൂദ അന്ത്യകാലദർശന സമൂഹങ്ങൾക്കായി; പിന്നീട് ആദിമ ക്രൈസ്തവ വൃത്തങ്ങളിലും ഇത് വായിക്കപ്പെട്ടു.
    date: ഭാഗങ്ങൾ ഏകദേശം ക്രി.മു. മൂന്നാം നൂറ്റാണ്ടുമുതൽ ക്രി.വ. ഒന്നാം നൂറ്റാണ്ടുവരെയുള്ള കാലത്ത് സമാഹരിക്കപ്പെട്ടു; പൂർണരൂപത്തിൽ സംരക്ഷിക്കപ്പെട്ടിരിക്കുന്നത് ഗെഎസ് (എത്യോപ്യൻ) ഭാഷയിൽ മാത്രമാണ്.
    chapters:
      '1':
        title: ദൈവം നീതിമാന്മാരെയും ദുഷ്ടരെയും വിധിക്കുന്നു
      '2':
        title: ആകാശവും ഭൂമിയും സാക്ഷ്യം വഹിക്കുന്നു
      '3':
        title: പതിനാലു മരങ്ങൾ ശൈത്യകാലത്തെ അതിജീവിക്കുന്നു
      '4':
        title: വേനൽക്കാല സൂര്യൻ ക്രമീകൃത ശക്തിയെ അടയാളപ്പെടുത്തുന്നു
      '5':
        title: സൃഷ്ടി ദൈവത്തിന്റെ ഭരണത്തോട് വിശ്വസ്തമാണ്
      '6':
        title: മനുഷ്യസ്ത്രീകൾക്കായി കാവൽമാലാഖമാർ ഇറങ്ങിവരുന്നു
      '7':
        title: ഭീമാകാര സന്തതി ഭൂമിയെ നശിപ്പിക്കുന്നു
      '8':
        title: കാവൽമാലാഖമാർ വിലക്കപ്പെട്ട അറിവ് പഠിപ്പിക്കുന്നു
      '9':
        title: ഭൂമിയിലെ അധാർമികത ദൂതന്മാർ അറിയിക്കുന്നു
      '10':
        title: വീണുപോയ കാവൽമാലാഖമാർക്ക് ന്യായവിധി വരുന്നു
      '11':
        title: ദൈവം സമൃദ്ധമായ അനുഗ്രഹങ്ങൾ വാഗ്ദാനം ചെയ്യുന്നു
      '12':
        title: ഹാനോക്ക് വീണുപോയ കാവൽമാലാഖമാരെ നേരിടുന്നു
      '13':
        title: കാവൽമാലാഖമാർക്കുള്ള കരുണ ഹാനോക്ക് നിരസിക്കുന്നു
      '14':
        title: വെളിപ്പെട്ട സ്വർഗീയ മഹത്ത്വം ഹാനോക്ക് കാണുന്നു
      '15':
        title: കാവൽമാലാഖമാരുടെ ന്യായവിധി ദൈവം വിശദീകരിക്കുന്നു
      '16':
        title: ശരീരമില്ലാത്ത ആത്മാക്കൾ ഭൂമിയിൽ അലഞ്ഞുനടക്കുന്നു
      '17':
        title: ഭയാനകമായ പരലോക മേഖലകളിലൂടെ ഹാനോക്ക് സഞ്ചരിക്കുന്നു
      '18':
        title: സൃഷ്ടിശക്തികളുടെ കലവറകൾ കാണിച്ചുകൊടുക്കുന്നു
      '19':
        title: ദൂതന്മാർ അന്തിമ ന്യായവിധി നേരിടും
      '20':
        title: വിശുദ്ധ കാവൽദൂതന്മാരും അവരുടെ മേഖലകളും
      '21':
        title: അഗാധത്തിൽ ചങ്ങലയ്ക്കിട്ട ഏഴ് നക്ഷത്രങ്ങൾ
      '22':
        title: ആത്മാക്കളുടെ ഗുഹകൾ ഹാനോക്ക് കാണുന്നു
      '23':
