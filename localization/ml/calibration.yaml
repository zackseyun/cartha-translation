book_localizations:
- source_title: Genesis
  title: ഉല്പത്തി
  author: ഗ്രന്ഥകാരൻ അജ്ഞാതൻ; പാരമ്പര്യമായി മോശെയുടേതായി കണക്കാക്കപ്പെടുന്നു. ആധുനിക പണ്ഡിതപഠനമനുസരിച്ച്, വിവിധ സ്രോതസ്സുകൾ പിന്നീട് സംയോജിപ്പിച്ച് എഡിറ്റുചെയ്ത ദീർഘമായ ഒരു രചനാചരിത്രം ഇതിനുണ്ട്.
  audience: ദൈവത്തിന്റെ സൃഷ്ടി, തിരഞ്ഞെടുപ്പ്, വാഗ്ദാനം എന്നിവയിൽ ജനതയുടെ ഉത്ഭവകഥയെ ഉറപ്പിച്ചുകൊണ്ട്, ഉടമ്പടിജനമെന്ന സ്വത്വമുള്ള ഇസ്രായേൽ.
  date: നൂറ്റാണ്ടുകളിലായി രചിക്കപ്പെട്ടു; ബാബിലോൻ പ്രവാസകാലത്തോ അതിനുശേഷമോ, ഏകദേശം ക്രി.മു. ആറാം–അഞ്ചാം നൂറ്റാണ്ടുകളിൽ, ഇന്ന് ലഭിച്ചിരിക്കുന്ന രൂപത്തിലെത്തി.
  summary: സൃഷ്ടി, മനുഷ്യരുടെ കലാപവും ചിതറിപ്പോകലും, ദൈവത്തിന്റെ ഇസ്രായേലിനോടുള്ള ഉടമ്പടിവാഗ്ദാനങ്ങൾ ആരംഭിക്കുന്നതിനു വഴിയായ അബ്രാഹാം, യിസ്ഹാക്ക്, യാക്കോബ്, യോസേഫ് എന്നിവരുടെ കുടുംബവും ഉല്പത്തി വിവരിക്കുന്നു.
- source_title: John
  title: യോഹന്നാൻ
  author: ഗ്രന്ഥകാരൻ അജ്ഞാതൻ; പാരമ്പര്യം ഇത് അപ്പൊസ്തലനായ യോഹന്നാന്റെയോ “പ്രിയശിഷ്യന്റെയോ” രചനയായി കണക്കാക്കുന്നു.
  audience: പ്രിയശിഷ്യന്റെ സാക്ഷ്യത്തെ ആധാരമാക്കി രൂപപ്പെട്ടതും സിനഗോഗ്-കേന്ദ്രിത യഹൂദമതവുമായി സംഘർഷത്തിലായിരുന്നതുമായ ഒരു ക്രൈസ്തവസമൂഹം.
  date: ഏകദേശം ക്രി.വ. 90–110.
  summary: പിതാവിനെ വെളിപ്പെടുത്തുകയും തന്നിലുള്ള വിശ്വാസത്തിലൂടെ ജീവൻ നൽകുകയും തന്റെ അടയാളങ്ങൾ, മരണം, പുനരുത്ഥാനം എന്നിവയിലൂടെ മഹത്ത്വപ്പെടുകയും ചെയ്യുന്ന നിത്യവചനമായി യോഹന്നാൻ യേശുവിനെ അവതരിപ്പിക്കുന്നു.
- source_title: Gospel of Thomas
  title: തോമാസിന്റെ സുവിശേഷം
  author: ഗ്രന്ഥകാരൻ അജ്ഞാതൻ; ഗ്രന്ഥാരംഭം ഈ വചനസമാഹാരം “ദിദിമോസ് യൂദാസ് തോമാസ്” എന്നയാളുടേതായി പറയുന്നു. നാഗ് ഹമ്മാദിയിൽനിന്നുള്ള നാലാം നൂറ്റാണ്ടിലെ കോപ്റ്റിക് പരിഭാഷയിൽ (NHC II,2) മാത്രമാണ് പൂർണരൂപം നിലനിൽക്കുന്നത്; ഓക്സിറിങ്കസിൽനിന്ന് മൂന്ന് ഗ്രീക്ക് ശകലങ്ങളും ലഭിച്ചിട്ടുണ്ട്.
  audience: സുറിയാനി ജ്ഞാനപാരമ്പര്യവും ആദിമ ജ്ഞാനവാദചിന്തയും സ്വാധീനിച്ച, യേശുവിന്റെ വചനങ്ങളിലൂടെ നിഗൂഢമായ ആത്മജ്ഞാനം തേടാൻ അഭിമുഖീകരിക്കപ്പെട്ട ക്രൈസ്തവ വായനക്കാർ.
  date: ഗ്രീക്ക് മൂലരചന ഏകദേശം ക്രി.വ. 50–140; കോപ്റ്റിക് കൈയെഴുത്തുപ്രതി ഏകദേശം ക്രി.വ. 340.
  summary: തോമാസിന്റെ സുവിശേഷം യേശുവിന്റേതായി പറയപ്പെടുന്ന വചനങ്ങളുടെ ഒരു സമാഹാരമാണ്. തുടർച്ചയായ ഒരു കഥ ഇതിലില്ല; വചനങ്ങളുടെ അർഥം കണ്ടെത്താൻ ഇത് വായനക്കാരെ ആവർത്തിച്ച് ആഹ്വാനം ചെയ്യുന്നു.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: ഉല്പത്തി 1:1
  text: ദൈവം ആകാശവും ഭൂമിയും സൃഷ്ടിക്കാൻ തുടങ്ങിയപ്പോൾ[a]—
  translator_note: '[a] പാരമ്പര്യപരിഭാഷ ഇതിനെ ഒരു പൂർണവാക്യമായി കാണുന്നു: “ആദിയിൽ ദൈവം ആകാശവും ഭൂമിയും സൃഷ്ടിച്ചു.” എന്നാൽ, എബ്രായവാക്യം സ്വാഭാവികമായി തുടർന്നുവരുന്നതിനെ പരിചയപ്പെടുത്തുന്നതായും 3-ാം വാക്യത്തിലെ “ദൈവം അരുളിച്ചെയ്തു” എന്നതിനെ മുഖ്യപ്രവൃത്തിയായും വായിക്കാം.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: സഭാപ്രസംഗി 1:2
  text: “നീരാവികളുടെ നീരാവി[a],” കോഹെലെത്ത്[b] പറയുന്നു. “എല്ലാം നീരാവിയാണ്—ക്ഷണികം, പിടിച്ചുനിർത്താനാവാത്തത്, പലപ്പോഴും നാം പ്രതീക്ഷിക്കുന്നതുപോലെയല്ലാത്തത്.”
  translator_note: '[a] ഹേവെൽ എന്ന എബ്രായപദത്തിന്റെ അക്ഷരാർഥം ശ്വാസം അല്ലെങ്കിൽ നീരാവി എന്നാണ്. സഭാപ്രസംഗിയിലുടനീളം, വേഗം കടന്നുപോകുന്നതും പിടിച്ചുനിർത്താനോ പൂർണമായി മനസ്സിലാക്കാനോ കഴിയാത്തതും പലപ്പോഴും മനുഷ്യർ പ്രതീക്ഷിക്കുന്നതിൽനിന്ന് വ്യത്യസ്തമായി തീരുന്നതുമായ കാര്യങ്ങളെ അത് വിവരിക്കുന്നു. ഒന്നിനും അർഥമില്ലെന്ന് പ്രസ്താവിക്കാതെ “നീരാവി” എന്ന പരിഭാഷ ആ ദൃശ്യരൂപം നിലനിർത്തുന്നു. “ശ്വാസം,” “വെറും ശ്വാസം,” “ക്ഷണികം” എന്നിവയും സാധ്യമായ പരിഭാഷകളാണ്. [b] കോഹെലെത്ത് എന്നത് ഗ്രന്ഥകാരന്റെ എബ്രായപേരോ സ്ഥാനപ്പേരോ ആണ്. ഇത് പലപ്പോഴും “ഉപദേഷ്ടാവ്” അല്ലെങ്കിൽ “പ്രസംഗകൻ” എന്നു പരിഭാഷപ്പെടുത്തുന്നു; എന്നാൽ ഒരു വ്യാഖ്യാനത്തിന് മുൻഗണന നൽകാതെ സാധ്യമായ എല്ലാ അർഥങ്ങൾക്കും ഇടം നൽകാൻ ഇവിടെ “കോഹെലെത്ത്” എന്നുതന്നെ നിലനിർത്തുന്നു.'
- source_path: nt/john/001/001.yaml
  reference: യോഹന്നാൻ 1:1
  text: ആദിയിൽ[b] വചനം ഇതിനകം നിലനിന്നിരുന്നു. വചനം ദൈവത്തോടുകൂടെ ആയിരുന്നു; വചനം ദൈവമായിരുന്നു.[a]
  translator_note: '[a] അല്ലെങ്കിൽ, “വചനം ദൈവികമായിരുന്നു”; അതുമല്ലെങ്കിൽ, “ദൈവം എന്തായിരുന്നുവോ അതുതന്നെയായിരുന്നു വചനം.” മുൻവാക്യഭാഗത്തിൽ വചനത്തെ ദൈവത്തിൽനിന്ന് വേർതിരിച്ചുകാണിക്കുമ്പോഴും വചനം പൂർണമായി ദൈവമാണെന്ന് ഗ്രീക്ക് വാക്യഘടന ഉറപ്പിക്കുന്നു. [b] ഈ ആരംഭം ഉല്പത്തി 1:1-നെ പ്രതിധ്വനിപ്പിക്കുകയും വചനത്തെ സൃഷ്ടിയുടെ ആരംഭവുമായി ബന്ധിപ്പിക്കുകയും ചെയ്യുന്നു. “ആയിരുന്നു,” “നിലനിന്നിരുന്നു” എന്നിവയും സാധ്യമായ പരിഭാഷകളാണ്; അപൂർണ ഭൂതകാലരൂപമായ ἦν, ആരംഭം വന്നപ്പോൾ വചനം പുതുതായി ഉണ്ടായതല്ല, അന്നേ തുടർന്നും നിലനിന്നിരുന്നു എന്നു സൂചിപ്പിക്കുന്നു.'
- source_path: nt/romans/003/025.yaml
  reference: റോമർ 3:25
  text: അവന്റെ രക്തത്തിലുള്ള വിശ്വാസത്തിലൂടെ[b] ദൈവം അവനെ പാപപരിഹാരയാഗമായി[a] മുന്നിൽ നിർത്തി. മുമ്പ് ചെയ്ത പാപങ്ങളെ അവൻ അവഗണിച്ചുകടന്നതിനാൽ, തന്റെ നീതി[c] വെളിപ്പെടുത്താനാണ് ദൈവം ഇതു ചെയ്തത്.
  translator_note: '[a] അല്ലെങ്കിൽ, “കോപശമനയാഗം”; അതുമല്ലെങ്കിൽ, പഴയനിയമത്തിൽ പാപപരിഹാരരക്തം തളിച്ചിരുന്ന ഉടമ്പടിപ്പെട്ടകത്തിന്റെ സ്വർണാവരണമായ “കരുണാസനം.” [b] അല്ലെങ്കിൽ, “വിശ്വാസത്തിലൂടെ, അവന്റെ രക്തത്താൽ.” [c] അല്ലെങ്കിൽ, “ന്യായം.”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 പത്രോസ് 1:13
  text: അതുകൊണ്ട്, പ്രവർത്തിക്കാൻ നിങ്ങളുടെ മനസ്സുകളെ ഒരുക്കുക.[a] പൂർണമായി വ്യക്തബോധമുള്ളവരായിരിക്കുക; യേശു മശീഹ വെളിപ്പെടുമ്പോൾ നിങ്ങളിലേക്കു കൊണ്ടുവരപ്പെടുന്ന കൃപയിൽ നിങ്ങളുടെ പ്രത്യാശ പൂർണമായി അർപ്പിക്കുക.[b]
  translator_note: '[a] ഗ്രീക്കിൽ അക്ഷരാർഥം, “നിങ്ങളുടെ മനസ്സിന്റെ അരക്കെട്ട് മുറുക്കുക” എന്നാണ്. പ്രവർത്തിക്കാൻ ഒരുങ്ങേണ്ടതിന് നീണ്ട വസ്ത്രം അരയ്ക്കുചുറ്റും കൂട്ടിക്കെട്ടുന്നതിന്റെ ദൃശ്യമാണ് ഇത്. [b] “പൂർണമായും,” “പൂർണമായി” എന്നു പരിഭാഷപ്പെടുത്തിയിരിക്കുന്ന ഗ്രീക്കുപദം വ്യക്തബോധമുള്ളവരായിരിക്കുന്നതിനെയോ പ്രത്യാശ അർപ്പിക്കുന്നതിനെയോ, ഒരുപക്ഷേ രണ്ടിനെയുമോ വിശേഷിപ്പിക്കാം.'
