  summary: മിക്ക മെറ്റാഡാറ്റയും UI ലേബലുകളും സ്വാഭാവികവും ഉറവിടത്തോടു വിശ്വസ്തവുമാണ്. റോമർ 3:25-ൽ ‘passed over’ എന്നതിനെ ‘ശിക്ഷിക്കാതെ വിട്ടു’ എന്നു വികസിപ്പിക്കാതെ കൂടുതൽ നേരിട്ട് നൽകുകയും, 1 പത്രോസ് 1:13-ൽ കൃപ ‘നിങ്ങളിലേക്കു കൊണ്ടുവരപ്പെടുന്നു’ എന്ന ഇപ്പോഴുള്ള പ്രയോഗം നിലനിർത്തുകയും ചെയ്തു. ചില വാക്യഘടനകൾ കൂടുതൽ സ്വാഭാവികമാക്കി.
