book_localizations:
- source_title: Genesis
  title: उत्पत्ती
  author: लेखक अज्ञात; परंपरेनुसार याचे लेखन मोशेला दिले जाते. आधुनिक अभ्यासकांच्या मते, या ग्रंथाची रचना दीर्घ काळ चालली आणि विविध स्रोत नंतर संपादित करून एकत्र करण्यात आले.
  audience: कराराच्या नात्यातून आपली ओळख समजून घेणारा इस्राएल; देवाची सृष्टी, निवड आणि अभिवचन यांत लोकांच्या उगमाची कथा रुजवणारा हा ग्रंथ आहे.
  date: अनेक शतकांच्या काळात रचना झाली; बाबेलच्या बंदिवासाच्या काळात किंवा त्यानंतर, इ.स.पू. सु. सहावे–पाचवे शतक, याला आजचे प्राप्त स्वरूप मिळाले.
  summary: उत्पत्ती या ग्रंथात सृष्टी, मानवाचे बंड आणि विखुरणे, तसेच अब्राहाम, इसहाक, याकोब आणि योसेफ यांच्या कुटुंबाची कथा सांगितली आहे; याच कुटुंबाद्वारे इस्राएलासाठी असलेल्या देवाच्या कराराच्या अभिवचनांची सुरुवात होते.
- source_title: John
  title: योहान
  author: लेखक अज्ञात; परंपरेनुसार याचे लेखन प्रेषित योहान किंवा “प्रिय शिष्य” याला दिले जाते.
  audience: सभास्थान-केंद्रित यहुदी धर्माशी तणावाचे संबंध असलेला आणि प्रिय शिष्याच्या साक्षीभोवती घडलेला ख्रिस्ती समुदाय.
  date: इ.स. सु. ९०–११०.
  summary: योहान येशूला अनंतकाळचा शब्द म्हणून सादर करतो—जो पित्याला प्रकट करतो, त्याच्यावर विश्वास ठेवणाऱ्यांना जीवन देतो आणि आपली चिन्हे, मृत्यू व पुनरुत्थान यांद्वारे गौरविला जातो.
- source_title: Gospel of Thomas
  title: थोमाचे शुभवर्तमान
  author: लेखक अज्ञात; आरंभीच्या वाक्यानुसार या वचनसंग्रहाचे श्रेय “दिदिमोस यहूदा थोमा” याला दिले आहे. संपूर्ण ग्रंथ केवळ नाग हम्मादी येथील चौथ्या शतकातील कॉप्टिक भाषांतरात (NHC II,2) उपलब्ध आहे; ऑक्सिरिंखस येथून त्याचे तीन ग्रीक तुकडेही सापडले आहेत.
  audience: सिरियाई ज्ञानपरंपरा आणि आरंभिक ज्ञानवादी विचारांनी घडलेले, येशूच्या वचनांमधून गूढ आत्मज्ञान मिळवण्याकडे कल असलेले ख्रिस्ती वाचक.
  date: ग्रीक मूळ बहुधा इ.स. सु. ५०–१४०; कॉप्टिक हस्तलिखित इ.स. सु. ३४०.
  summary: थोमाचे शुभवर्तमान हा येशूला दिलेल्या वचनांचा संग्रह आहे. त्यात सलग कथानक नाही आणि या वचनांचा अर्थ शोधण्याचे आवाहन ते वाचकांना वारंवार करते.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: उत्पत्ती १:१
  text: जेव्हा देवाने आकाश आणि पृथ्वी निर्माण करण्यास सुरुवात केली[a]—
  translator_note: '[a] पारंपरिक भाषांतर हे पूर्ण वाक्य मानते: “आरंभी देवाने आकाश आणि पृथ्वी निर्माण केली.” मात्र इब्री वाक्यरचना पुढे येणाऱ्या मजकुराची प्रस्तावना म्हणून अधिक स्वाभाविकपणे समजते; त्यातील मुख्य कृती तिसऱ्या वचनातील “देव म्हणाला” ही आहे.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: उपदेशक १:२
  text: “वाफांची वाफ[a],” कोहेलेथ[b] म्हणतो. “सगळे काही वाफ आहे—क्षणभंगुर, पकडून ठेवता न येणारे आणि अनेकदा आपल्या अपेक्षेपेक्षा वेगळे.”
  translator_note: '[a] ‘हेवेल’ या इब्री शब्दाचा शब्दशः अर्थ ‘श्वास’ किंवा ‘वाफ’ असा आहे. उपदेशक या संपूर्ण ग्रंथात हा शब्द लवकर नाहीसे होणारे, पकडून किंवा पूर्णपणे समजून घेता न येणारे आणि अनेकदा लोकांच्या अपेक्षेपेक्षा वेगळे ठरणारे यांसाठी वापरतो. “वाफ” ही प्रतिमा जपते आणि काहीच अर्थपूर्ण नाही असा दावा करत नाही. [b] ‘कोहेलेथ’ हे लेखकाचे इब्री नाव किंवा पदवी आहे. याचे भाषांतर अनेकदा “शिक्षक” किंवा “उपदेशक” असे केले जाते; पण कोणत्याही एका अर्थाला प्राधान्य न देता सर्व शक्यता खुल्या ठेवण्यासाठी येथे “कोहेलेथ” हेच रूप ठेवले आहे.'
- source_path: nt/john/001/001.yaml
  reference: योहान १:१
  text: आरंभी[b] शब्द आधीपासूनच अस्तित्वात होता. शब्द देवाबरोबर होता आणि शब्द देव होता.[a]
  translator_note: '[a] किंवा, “शब्द दैवी होता”; अथवा, “देवाचे जे स्वरूप होते, तेच शब्दाचेही होते.” ग्रीक वाक्यरचना शब्द पूर्णपणे देव आहे असे प्रतिपादन करते, तसेच आधीच्या वाक्यखंडात शब्द आणि देव यांच्यात भेदही राखते. [b] ही सुरुवात उत्पत्ती १:१ ची आठवण करून देते आणि शब्दाचा संबंध सृष्टीच्या आरंभाशी जोडते. “होता” किंवा “अस्तित्वात होता” हीही संभाव्य भाषांतरे आहेत; येथे वापरलेले “आधीपासूनच अस्तित्वात होता” हे आरंभ झाला तेव्हा शब्द अस्तित्वात होता, तो त्या वेळी अस्तित्वात आला नाही, हे स्पष्ट करते.'
- source_path: nt/romans/003/025.yaml
  reference: रोमकरांस ३:२५
  text: देवाने त्याला त्याच्या रक्तावरील विश्वासाद्वारे[b] प्रायश्चित्ताचे बलिदान[a] म्हणून लोकांसमोर ठेवले. पूर्वी केलेल्या पापांकडे त्याने दुर्लक्ष केले होते; म्हणून आपले नीतिमत्त्व[c] दाखवण्यासाठी त्याने हे केले.
  translator_note: '[a] किंवा, “कोपशमन”; अथवा, “दयासन”—कराराच्या कोशावरील सोन्याचे झाकण, ज्यावर जुन्या करारात प्रायश्चित्ताचे रक्त शिंपडले जात असे. [b] किंवा, “विश्वासाद्वारे, त्याच्या रक्ताने.” [c] किंवा, “न्याय.”'
- source_path: nt/1_peter/001/013.yaml
  reference: १ पेत्र १:१३
  text: म्हणून, कृती करण्यासाठी आपली मने तयार करा.[a] पूर्णपणे स्पष्टचित्त राहा आणि येशू मसीहा प्रकट होईल तेव्हा तुमच्याकडे आणल्या जाणाऱ्या कृपेवर आपली आशा पूर्णपणे ठेवा.[b]
  translator_note: '[a] ग्रीक भाषेत शब्दशः, “आपल्या मनाच्या कमरेला पट्टा बांधा,” असे म्हटले आहे. कृतीसाठी तयार होता यावे म्हणून कमरेभोवती लांब वस्त्र खोचून घेण्याचे चित्र यात आहे. [b] “पूर्णपणे” असा अनुवाद केलेला ग्रीक शब्द स्पष्टचित्त राहण्याला, आशा ठेवण्याला किंवा कदाचित दोन्हींना लागू होऊ शकतो.'
