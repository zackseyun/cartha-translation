  Tripartite Tractate:
    display_name: त्रिखंडात्मक प्रबंध
    author: लेखक अज्ञात. लेखक अत्यंत सुशिक्षित व्हॅलेंटिनियन ख्रिस्ती धर्मचिंतक होता; त्याची कोणत्याही नामांकित शिक्षकासोबत खात्रीशीर ओळख पटवता येत नाही.
