      '7':
        title: गर्वापेक्षा ज्ञान श्रेष्ठ
      '8':
        title: ज्ञान नम्रपणे जगायला शिकवते
      '9':
        title: नीतिमान आणि दुष्ट यांची गती एकच
      '10':
        title: मूर्खपणा ज्ञानाचा लवकर नाश करतो
      '11':
