        title: हिज्कीया प्रार्थना करतो; देव उत्तर देतो
      '38':
        title: हिज्कीयाचे आजारपण आणि बरे होणे
      '39':
        title: बाबेल हिज्कीयाचा खजिना पाहते
      '40':
        title: देवाच्या लोकांसाठी सांत्वन येते
      '41':
        title: परमेश्वर एकटाच इतिहासावर राज्य करतो
