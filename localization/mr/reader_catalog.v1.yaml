  Polycarp to the Philippians:
    display_name: फिलिप्पैकरांना पॉलीकार्पचे पत्र
    author: स्मुर्नाचा बिशप पॉलीकार्प. काही विद्वानांच्या मते, उपलब्ध मजकुरात एकाहून अधिक प्रसंगी पाठवलेली सामग्री एकत्र केली आहे.
    audience: फिलिप्पै येथील ख्रिस्ती सभा; तिने इग्नेशियसची पत्रे मागितली होती आणि तिला विश्वास, आचरण, नेतृत्व, पैसा आणि चिकाटी यांविषयी मार्गदर्शन मिळाले.
    date: इ.स. दुसऱ्या शतकाच्या आरंभीचा ते मध्यकाळ; पत्राचा किमान काही भाग इग्नेशियसच्या प्रवासाशी जवळून संबंधित आहे, तर हे पत्र अनेक भागांचे मिळून बनले असल्याचे मानणाऱ्यांच्या मते त्यातील एखादा भाग काहीसा नंतरचा असू शकतो.
