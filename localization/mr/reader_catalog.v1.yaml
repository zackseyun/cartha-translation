  Hebrews:
    display_name: इब्री लोकांस
    author: लेखक अज्ञात. परंपरेने पौल, अपुल्लोस, बर्णबा, प्रिस्किल्ला आणि इतरांची नावे सुचवली आहेत; मात्र कोणत्याही मतावर सर्वसहमती नाही.
    audience: आपण स्वीकारलेल्या ख्रिस्ती विश्वासापासून पुन्हा मागे वळण्याचा मोह होत असलेले ग्रीकभाषक यहूदी ख्रिस्ती.
    date: इ.स. सु. ६०–९५.
    chapters:
      '1':
        title: देव आपल्या पुत्राद्वारे बोलतो
      '2':
        title: येशू दुःख सोसून तारण देतो
      '3':
        title: विश्वासू येशूवर दृष्टी खिळवा
      '4':
        title: देवाने वचन दिलेल्या विसाव्यात प्रवेश करा
      '5':
        title: ख्रिस्ताने परिपूर्ण यज्ञ अर्पण केला
      '6':
        title: आत्मिक प्रगल्भतेकडे पुढे चला
      '7':
        title: मलकीसदेकाच्या क्रमाप्रमाणे येशू सदासर्वकाळ याजक
      '8':
        title: येशूच्या रक्ताद्वारे नवा करार
      '9':
        title: येशू खऱ्या स्वर्गीय पवित्रस्थानात प्रवेश करतो
      '10':
        title: ख्रिस्ताच्या रक्ताद्वारे देवाजवळ या
      '11':
        title: पूर्वजांचा विश्वास टिकून राहतो
      '12':
        title: येशूसोबत दुःख सहन करा
      '13':
        title: प्रेमाने जगा आणि भरवसा ठेवा
  James:
    display_name: याकोब
    author: परंपरेनुसार येशूचा भाऊ याकोब; आधुनिक अभ्यासकांमध्ये हे पत्र खरोखर त्यानेच लिहिले की त्याच्या नावाने दुसऱ्याने लिहिले, याबाबत मतभेद आहेत.
    audience: यहूदी ख्रिस्ती प्रवासी समाजातील मंडळ्या.
    date: खरोखर याकोबने लिहिले असल्यास इ.स.चे सुमारे ५०–६० चे दशक; त्याच्या नावाने दुसऱ्याने लिहिले असल्यास इ.स.च्या पहिल्या शतकाचा उत्तरार्ध.
    chapters:
      '1':
        title: परीक्षांमध्ये पारखलेला विश्वास टिकतो
      '2':
        title: कृतींविना विश्वास मृत आहे
      '3':
        title: जिभेवर ताबा ठेवा, सुज्ञपणे बोला
      '4':
