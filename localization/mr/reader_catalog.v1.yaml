        title: मिसर नम्र होतो आणि नंतर बरा केला जातो
      '20':
        title: चिन्ह म्हणून यशया वस्त्रे उतरवून चालतो
      '21':
        title: बाबेल अचानक पडते; मेजवानी संपते
      '22':
        title: यरुशलेमच्या गोंगाटामुळे न्याय ओढवतो
      '23':
        title: सोरचे धन आणि सामर्थ्य कोसळते
      '24':
        title: संपूर्ण पृथ्वीवर व्यापक न्याय
      '25':
        title: परमेश्वर मेजवानी देतो आणि मृत्यू दूर करतो
      '26':
        title: देव आपल्या लोकांना सुरक्षित ठेवतो
      '27':
        title: लिव्याथानचा पराभव; इस्राएलचे रक्षण
      '28':
        title: गर्विष्ठ पुढारी देवाच्या वचनाची थट्टा करतात
      '29':
        title: वेढ्याखाली यरुशलेम नम्र होते
