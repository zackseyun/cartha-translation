        title: देवाच्या दूतावर विश्वास ठेवून योसेफ खातो
      '8':
        title: योसेफ त्या स्त्रीपासून विवस्त्र अवस्थेत पळतो
      '9':
        title: योसेफ बेड्यांत कृतज्ञतेने गातो
      '10':
        title: योसेफ सहनशीलता आणि शुद्धतेचे आवाहन करतो
      '11':
        title: योसेफ निर्वासनात भावांचा सन्मान करतो
      '12':
        title: योसेफ मिसरमध्ये कृपापात्र ठरतो
