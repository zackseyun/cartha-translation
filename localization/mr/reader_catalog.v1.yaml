    audience: प्रतिस्पर्धी गटांच्या बलिदानविषयक आणि कलीसियाई प्रथांवर टीका करणारा आणि यहूदा व येशूचा मृत्यू यांचा नव्याने अर्थ लावण्यासाठी प्रकटीकरणात्मक संवाद व सेथियन प्रकारचे विश्ववर्णन वापरणारा एक ख्रिस्ती गट.
    date: हे लिखाण सहसा इ.स. दुसऱ्या शतकाच्या मध्यकाळातील किंवा उत्तरार्धातील मानले जाते; सुमारे इ.स. १८० मध्ये इरेनियसला ‘यहूदाचे शुभवर्तमान’ माहीत होते आणि उपलब्ध कॉप्टिक प्रत बहुधा इ.स. तिसऱ्या किंवा चौथ्या शतकातील आहे.
