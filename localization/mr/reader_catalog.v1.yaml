        title: तोबीत पुत्राला नीतिमत्त्वाचे शिक्षण देतो
      '5':
        title: मार्गदर्शन मिळालेला तोबिया प्रवासाला निघतो
      '6':
        title: तोबिया आरोग्यदायी गुण असलेला मासा पकडतो
      '7':
        title: तोबिया एक्बाताना येथे साराशी लग्न करतो
      '8':
        title: तोबिया साराशी लग्न करून प्रार्थना करतो
      '9':
        title: गबाएल तोबीतचे पैसे परत करतो
      '10':
        title: तोबिया सुखरूप घरी परततो
      '11':
        title: पुत्रामुळे तोबीतची दृष्टी परत येते
      '12':
        title: रफाएल आपली खरी ओळख प्रकट करतो
      '13':
        title: तोबीत यरुशलेमसाठी प्रार्थना करतो
      '14':
        title: तोबीत इस्राएलचे भविष्य आधीच पाहतो
  Judith:
