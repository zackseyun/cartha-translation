    author: पौल (याबाबत मतभेद आहेत; काही विद्वानांच्या मते हे दुसऱ्याने पौलाच्या नावाने लिहिले).
    audience: अंतकाळाविषयीचा गोंधळ दूर करण्यासाठी थेस्सलनीका येथील मंडळीला लिहिलेले.
    date: पौलाने लिहिले असल्यास इ.स. सु. ५१.
    chapters:
      '1':
        title: छळ सोसणाऱ्या विश्वासू लोकांना देव प्रतिफळ देतो
      '2':
        title: ख्रिस्ताच्या आगमनापूर्वी बंड होईल
      '3':
        title: पौल मंडळीच्या वाढीसाठी प्रार्थना करतो
  1 Timothy:
    display_name: १ तीमथ्य
    author: पौल, किंवा पौलाच्या नावाने लिहिणारा शिष्य (मेंढपाळविषयक पत्रे दुसऱ्यांनी पौलाच्या नावाने लिहिली, असे मत व्यापकपणे मानले जाते).
    audience: इफिस येथे पौलाचा प्रतिनिधी असलेला तीमथ्य; नंतरच्या काळातील मंडळीच्या व्यवस्थेसाठी मार्गदर्शक लेखन.
    date: पौलाने लिहिले असल्यास इ.स.च्या सु. ६०च्या दशकाच्या मध्यात; दुसऱ्याने पौलाच्या नावाने लिहिले असल्यास इ.स. सु. ९०–११०.
    chapters:
      '1':
        title: तीमथ्याने तिथेच राहावे, असा पौलाचा आग्रह
      '2':
        title: राज्यकर्त्यांसाठी प्रार्थना करा आणि शांततेने जगा
      '3':
        title: मंडळीच्या पुढाऱ्यांसाठी आवश्यक गुण
      '4':
        title: खोटे शिक्षक आणि दंतकथा नाकारा
      '5':
        title: विधवा आणि वडीलजनांचा विश्वासूपणे सन्मान करा
      '6':
        title: संपत्तीविषयी पौलाचा तीमथ्याला सल्ला
  2 Timothy:
    display_name: २ तीमथ्य
    author: पौल, किंवा पौलाच्या नावाने लिहिणारा शिष्य.
    audience: तीमथ्य—तुरुंगातून पौलाने दिलेला निरोप अशा स्वरूपात मांडलेले.
    date: पौलाने लिहिले असल्यास इ.स.च्या सु. ६०च्या दशकाच्या मध्यात; दुसऱ्याने पौलाच्या नावाने लिहिले असल्यास इ.स. सु. ९०–११०.
    chapters:
      '1':
        title: तीमथ्या, कृपेत खंबीर राहा
      '2':
