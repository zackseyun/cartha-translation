  Jeremiah:
    display_name: यिर्मया
    author: अनाथोथचा यिर्मया; त्याचा लेखनिक बारूख आणि नंतरच्या संपादकांनी मोठ्या प्रमाणात संपादन केले.
    audience: बाबेलच्या आक्रमणाच्या उंबरठ्यावर, आक्रमणाच्या काळात आणि त्यानंतरचा यहूदा.
    date: इ.स.पू. ७व्या शतकाचा उत्तरार्ध ते ६व्या शतकाचा पूर्वार्ध.
