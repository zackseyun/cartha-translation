  2 Peter:
    display_name: २ पेत्र
    author: परंपरेनुसार पेत्र; आधुनिक अभ्यासकांमध्ये हे पेत्राच्या नावाने दुसऱ्याने लिहिले असल्याचे मत व्यापक आहे.
    audience: ख्रिस्ताच्या पुनरागमनाला नाकारणाऱ्या थट्टेखोरांचा सामना करणारे ख्रिस्ती.
