  1 Esdras:
    display_name: १ एस्द्रास
    author: अज्ञात; २ इतिहास ३५–३६, एज्रा आणि नहेम्या ७–८ यांचा क्रम बदलून केलेली ग्रीक पुनर्रचना.
    audience: परत येणे आणि पुनर्स्थापना यांचे सुसंगत कथन हवे असलेले हेलेनिस्टिक काळातील यहूदी.
    date: सुमारे इ.स.पू. दुसरे–पहिले शतक.
    chapters:
      '1':
        title: योशीया वल्हांडण पाळतो आणि मरण पावतो
      '2':
        title: कोरेश यिर्मयाचे वचन पूर्ण करतो
      '3':
        title: जरुब्बाबेल सत्याचा विजय घोषित करतो
      '4':
        title: दारयावेश मंदिर पुन्हा बांधण्याची परवानगी देतो
      '5':
        title: बंदिवासातील लोक परतून वेदी बांधतात
      '6':
        title: संदेष्टे मंदिराच्या कामाला प्रोत्साहन देतात
      '7':
        title: मोठ्या आनंदात मंदिर पूर्ण होते
      '8':
        title: एज्रा लोकांना सुखरूप परत आणतो
      '9':
        title: एज्रा विश्वासघातकी विवाहांना सामोरा जातो
  Prayer of Manasseh:
    display_name: मनश्शेची प्रार्थना
    author: अज्ञात; मनश्शे राजाच्या नावाने छद्मरीत्या जोडलेले.
    audience: मनश्शेच्या पश्चात्तापाशी स्वतःला जोडणारे पश्चात्तापी लोक—काही परंपरांमध्ये उपासनेत वापरले जाते.
    date: सुमारे इ.स.पू. दुसरे–पहिले शतक.
    chapters:
      '1':
        title: मनश्शे देवाच्या दयेसाठी याचना करतो
  Psalm 151:
    display_name: स्तोत्र १५१
    author: अज्ञात; दावीदाच्या नावाने छद्मरीत्या जोडलेले. याचे एक हिब्रू रूप 11QPsa मध्ये आढळते.
    audience: दावीदाच्या स्तोत्रसंग्रहाशी निष्ठा असलेले प्रवासी यहूदी आणि कुमरान समुदाय.
    date: सुमारे इ.स.पू. दुसरे शतक किंवा त्यापूर्वीचे.
    chapters:
      '1':
        title: सर्वांत धाकट्या मेंढपाळाचा राजा म्हणून अभिषेक
  3 Maccabees:
    display_name: ३ मक्काबी
    author: अज्ञात; ग्रीक भाषेत रचलेले.
    audience: इजिप्तमधील ग्रीकभाषी प्रवासी यहूदी—चौथा टॉलेमी याच्या काळातील सुटकेचे कथन.
    date: सुमारे इ.स.पू. पहिले शतक ते इ.स. पहिले शतक.
    chapters:
      '1':
        title: राजा मंदिरात प्रवेश करण्याचा हट्ट धरतो
      '2':
        title: इस्राएल सुटकेसाठी प्रार्थना करतो
      '3':
        title: राजा यहूद्यांच्या विनाशाची योजना आखतो
      '4':
        title: यहूदी सार्वजनिकरीत्या शोक करतात
      '5':
        title: हत्तींना वधासाठी आणले जाते
      '6':
        title: स्वर्गीय देवदूत यहूद्यांना वाचवतात
      '7':
        title: राजा यहूद्यांना सुखरूप मुक्त करतो
  4 Maccabees:
    display_name: ४ मक्काबी
    author: अज्ञात; स्तोइक तत्त्वज्ञानाचा प्रभाव असलेला ग्रीकभाषी यहूदी लेखक.
    audience: हेलेनिस्टिक यहूदी—विश्वासूपणाद्वारे विवेक वासनांवर कसा प्रभुत्व मिळवतो यावरील तात्त्विक उपदेश.
    date: सुमारे इ.स. पहिले शतक.
    chapters:
      '1':
        title: विवेक वासनांवर राज्य करतो
      '2':
        title: नियमशास्त्र विवेकाच्या प्रभुत्वाला दिशा देते
      '3':
        title: दावीद शत्रूकडून आणलेले पाणी नाकारतो
      '4':
        title: स्वर्गीय सैन्य यहूद्यांचे रक्षण करते
      '5':
        title: एलाजार डुकराचे मांस नाकारतो
      '6':
        title: एलाजार शेवटपर्यंत दृढ राहून मरतो
      '7':
        title: एलाजार विवेकाचे सामर्थ्य सिद्ध करतो
      '8':
        title: सात भाऊ अत्याचारी राजाला सामोरे जातात
      '9':
        title: पहिला भाऊ हुतात्मा होतो
      '10':
        title: चौथा भाऊ आपली जीभ देण्यास नकार देतो
      '11':
        title: सहावा भाऊ यातना सहन करतो
      '12':
        title: सर्वांत धाकटा भाऊ स्वतःला फेकून देतो
      '13':
        title: भाऊ एकमेकांना धीर देतात
      '14':
        title: आई मुलांना मृत्यू पत्करण्याचे आवाहन करते
      '15':
        title: आई मुलांपेक्षा देवाला निवडते
      '16':
        title: आई मुलांना मृत्यू पत्करण्यास प्रवृत्त करते
      '17':
        title: सात हुतात्मे देवाचा सन्मान करतात
      '18':
        title: मुले नियमशास्त्र पाळून जगतात
  Bel and the Dragon:
    display_name: बेल आणि अजगर
    author: अज्ञात; दानिएलच्या ग्रंथातील ग्रीक भरांपैकी एक.
    audience: ग्रीकभाषी यहूदी—मूर्तिपूजेची खिल्ली उडवणारे खंडन.
    date: सुमारे इ.स.पू. दुसरे–पहिले शतक.
    chapters:
      '1':
        title: दानिएल बेल आणि अजगराचा पराभव करतो
  Letter of Jeremiah:
    display_name: यिर्मयाचे पत्र
    author: अज्ञात; यिर्मयाच्या नावाने छद्मरीत्या जोडलेले.
    audience: आजूबाजूच्या मूर्तिपूजेच्या मोहात पडण्याची शक्यता असलेले प्रवासी यहूदी.
    date: सुमारे इ.स.पू. चौथे–दुसरे शतक.
    chapters:
      '1':
        title: बाबेलमध्ये मूर्तींची व्यर्थ भीती
  Prayer of Azariah and Song of the Three:
    display_name: अजऱ्याची प्रार्थना आणि तिघांचे गीत
    author: अज्ञात; दानिएलच्या ग्रंथातील ग्रीक भरांपैकी एक.
    audience: ग्रीकभाषी यहूदी—दानिएल ३ साठीचे उपासनेतील साहित्य.
    date: सुमारे इ.स.पू. दुसरे शतक.
    chapters:
      '1':
        title: अजऱ्या धगधगत्या अग्नीत प्रार्थना करतो
  Susanna:
    display_name: सुसन्ना
    author: अज्ञात; दानिएलच्या ग्रंथातील ग्रीक भरांपैकी एक.
    audience: ग्रीकभाषी यहूदी—नीतिमत्त्वाची आणि खोट्या साक्षीचा निषेध होण्याची कथा.
    date: सुमारे इ.स.पू. दुसरे–पहिले शतक.
    chapters:
      '1':
        title: दानिएल न्यायाधीशांचा कट उघड करतो
  1 Clement:
    display_name: १ क्लेमेंट
    author: अज्ञात; रोमच्या क्लेमेंटचे लेखन मानले जाते.
    audience: नेतृत्वावरील वादात अडकलेली करिंथमधील ख्रिस्ती मंडळी.
    date: सुमारे इ.स. ९६.
    chapters:
      '1':
        title: अधार्मिक उठावामुळे बंधूंना दुःख
      '2':
        title: नम्रतेतून शांततापूर्ण आवेश निर्माण होतो
      '3':
        title: मत्सर युद्ध आणि बंदिवास आणतो
      '4':
        title: ईर्ष्येमुळे प्राचीन काळी हत्या झाल्या
      '5':
        title: पेत्र आणि पौल यांनी धीराने संकटे सोसली
      '6':
        title: मत्सराने देवाच्या निवडलेल्या स्त्रियांचा छळ केला
      '7':
        title: तारणासाठी मौल्यवान रक्त
      '8':
        title: स्वामी पाप्याचा पश्चात्ताप पसंत करतो
      '9':
        title: नीतिमान हनोख वर घेतला जातो
      '10':
        title: अब्राहाम आज्ञाधारकतेने विश्वासू ठरतो
      '11':
        title: आदरातिथ्यामुळे लोटाची सुटका होते
      '12':
        title: राहाब विश्वासूपणे हेरांना लपवते
      '13':
        title: नम्र होऊन प्रभूला शोधू या
      '14':
        title: एकमेकांशी सौम्यपणे वागा
      '15':
        title: सुभक्तीशी जोडलेल्या शांततेच्या मागे लागा
      '16':
        title: मसीहा दीनतेने आणि नम्रतेने आला
      '17':
        title: साधेपणाने जगलेल्या संदेष्ट्यांचे अनुकरण करा
      '18':
        title: दावीद नम्रपणे आपली पापे कबूल करतो
      '19':
        title: नम्रता शांततापूर्ण जीवनाचा मार्ग दाखवते
      '20':
        title: सृष्टी सुव्यवस्थित शांततेत चालते
      '21':
        title: देवासमोर योग्य रीतीने जगा
      '22':
        title: ख्रिस्त प्रभूचे भय बाळगण्यास बोलावतो
      '23':
        title: पिता निष्कपट हृदयाची काळजी घेतो
      '24':
        title: देव भावी पुनरुत्थानाची खात्री देतो
      '25':
        title: फिनिक्स मरतो आणि पुन्हा उठतो
      '26':
        title: देव विश्वासू सेवकांना उठवेल
      '27':
        title: आपले जीव विश्वासू देवाशी दृढपणे जोडा
      '28':
        title: देवाचे भय बाळगा; कुठेही लपता येत नाही
      '29':
        title: स्वच्छ हातांनी जवळ या
      '30':
        title: पापांपासून पळा, नम्रता स्वीकारा
      '31':
        title: अब्राहाम, इसहाक आणि याकोब विश्वासाने चालतात
      '32':
        title: देवाची इच्छा आपल्याला नीतिमान करते
      '33':
        title: चांगली कामे करण्यास तत्पर व्हा
      '34':
        title: तत्पर कामगार आपली भाकर कमावतात
      '35':
        title: स्वर्गीय प्रतिफळांसाठी धीर धरा
      '36':
        title: आपला प्रमुख याजक येशू तारण करतो
      '37':
        title: सैनिक आज्ञांचे विश्वासूपणे पालन करतात
      '38':
        title: मसीहा येशूमधील समुदाय
      '39':
        title: थट्टा करणारे स्वतःला शुद्ध करू शकत नाहीत
      '40':
        title: स्वामीचे विधी पाळा
      '41':
        title: नेमून दिलेल्या सेवेत कार्य करा
      '42':
        title: प्रेषितांनी योग्य रीतीने नेते नेमले
      '43':
        title: मोशेने देवाच्या आज्ञेने याजक निवडले
      '44':
        title: मान्यताप्राप्त वडिलांना पदावरून काढू नका
      '45':
        title: देवाचा सन्मान केल्यामुळे नीतिमानांनी दुःख सोसले
      '46':
        title: पवित्र आदर्शांना एकत्रितपणे धरून राहा
      '47':
        title: पौलाने तुम्हाला लिहिलेल्या पत्राची आठवण ठेवा
      '48':
        title: शुद्ध अंतःकरणाने नीतिमत्त्वाच्या द्वारातून प्रवेश करा
      '49':
        title: प्रेम आपल्याला देवाशी जोडते
      '50':
        title: प्रेम देवाच्या निवडलेल्यांना परिपूर्ण करते
      '51':
        title: आपली पापे आणि चुका कबूल करू या
      '52':
        title: देवाला स्तुतीचे बलिदान अर्पण करा
      '53':
        title: मोशेने इस्राएलसाठी धैर्याने मध्यस्थी केली
      '54':
        title: शांतिप्रिय नेते कळपाचा सन्मान करतात
      '55':
        title: स्त्रियांनी पराक्रमाची कृत्ये केली
      '56':
        title: भरकटलेल्यांनी आज्ञाधारक व्हावे म्हणून प्रार्थना करा
      '57':
        title: नम्रता हेच शहाणपण आहे, असे ज्ञान सांगते
      '58':
        title: देवावर भरवसा ठेवा आणि सर्वकाळ सुरक्षित राहा
      '59':
        title: देवाने निवडलेल्यांचे रक्षण करावे म्हणून प्रार्थना करा
      '60':
        title: पापांची क्षमा कर आणि आमच्या पावलांना मार्ग दाखव
      '61':
        title: देव राज्यकर्त्यांना ज्ञानाने मार्गदर्शन करतो
      '62':
        title: विश्वास सद्गुणी जीवन जगायला शिकवतो
      '63':
        title: नम्रतेमुळे शांती आणि आनंद मिळतात
      '64':
        title: सर्वांना विश्वास आणि धीर दे
      '65':
        title: प्रतिनिधींना शुभवार्तेसह परत पाठवा
  1 Enoch:
    display_name: १ हनोख
    author: लेखक अज्ञात; जलप्रलयापूर्वीचा कुलपिता हनोख याच्या नावाने छद्मनामाने जोडले गेले आहे. वेगवेगळ्या स्वतंत्र विभागांपासून संकलित केलेला हा एक संयुक्त ग्रंथ आहे.
    audience: विश्वातील दुष्टता, न्यायनिवाडा आणि कालगणना यांवर चिंतन करणारे यहूदी प्रलयदर्शी समुदाय; नंतर आरंभीच्या ख्रिस्ती वर्तुळांतही वाचला गेला.
    date: विविध विभागांचे संकलन अंदाजे इ.स.पू. तिसरे शतक ते इ.स. पहिले शतक; संपूर्ण ग्रंथ केवळ गीझ (इथिओपिक) भाषेत जतन झाला आहे.
    chapters:
      '1':
        title: देव नीतिमानांचा आणि दुष्टांचा न्याय करतो
      '2':
        title: आकाश आणि पृथ्वी साक्ष देतात
      '3':
        title: चौदा वृक्ष हिवाळ्यात टिकून राहतात
      '4':
        title: उन्हाळ्यातील सूर्य सुव्यवस्थित सामर्थ्य दाखवतो
      '5':
        title: सृष्टी देवाच्या शासनाशी विश्वासू राहते
      '6':
        title: मानवी स्त्रियांसाठी पहारेकरी पृथ्वीवर उतरतात
      '7':
        title: प्रचंडकाय संतती पृथ्वीचा विध्वंस करते
      '8':
