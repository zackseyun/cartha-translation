        title: योसेफ खोट्या उपासनेचे प्रस्ताव नाकारतो
      '5':
        title: योसेफ प्राणघातक प्रलोभनाला न जुमानतो
      '6':
        title: योसेफ विषारी अन्नाचा प्रस्ताव नाकारतो
