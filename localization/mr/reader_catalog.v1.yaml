  Proverbs:
    display_name: नीतिसूत्रे
    author: एक संकलन; शीर्षलेखांमध्ये शलमोन, आगूर, लमुएल आणि “ज्ञानी लोक” यांची नावे दिली आहेत.
    audience: दैनंदिन जीवनासाठी सुज्ञ बनवले जात असलेले तरुण इस्राएली.
    date: रचनेचे विविध स्तर अंदाजे इ.स.पू. १०वे–४थे शतक.
    chapters:
      '1':
        title: शलमोन परमेश्वराचे भय शिकवतो
      '2':
        title: देवाचा शोध घेतल्याने ज्ञान मिळते
      '3':
        title: देवावर भरवसा ठेवा आणि ज्ञान मिळवा
      '4':
        title: वडील सर्वांत अधिक ज्ञान मिळवण्याचा आग्रह करतात
      '5':
        title: वडील व्यभिचाराविरुद्ध सावध करतात
      '6':
        title: पाप आणि आळसाविरुद्ध इशारे
      '7':
        title: व्यभिचाराच्या मोहापासून दूर राहा
      '8':
        title: ज्ञान शोधणाऱ्यांना हाक मारते
      '9':
        title: ज्ञान आमंत्रण देते; मूर्खपणा मोहात पाडतो
      '10':
        title: नीतिमत्ता आणि दुष्टता यांतील विरोधाभास
      '11':
        title: सरळपणामुळे आशीर्वाद मिळतो
      '12':
        title: नीतिमान सुज्ञपणे आणि चांगले जीवन जगतात
      '13':
        title: शिकण्याची वृत्ती जीवनाकडे नेते
      '14':
        title: ज्ञान घर उभारते आणि प्रभूचे भय बाळगते
      '15':
        title: सौम्य बोलणे जीवन देते
      '16':
        title: योजना माणूस करतो; परिणाम देव ठरवतो
      '17':
        title: देवाचे भय ज्ञान देते
      '18':
        title: ज्ञान ऐकते; मूर्खपणा सुधारणा नाकारतो
      '19':
        title: संपत्तीपेक्षा सचोटी नेहमीच श्रेष्ठ
      '20':
        title: मद्यधुंदी टाळा; सचोटीला महत्त्व द्या
      '21':
        title: देव अंतःकरणांचा न्याय करतो आणि न्यायाला महत्त्व देतो
      '22':
        title: नम्रता देवाचा अधिक सन्मान करते
      '23':
        title: खादाडपणा आणि लोभाविरुद्ध इशारा
      '24':
        title: दुष्ट लोकांचा हेवा करू नका
      '25':
        title: ज्ञान नम्रतेचे आवाहन करते
      '26':
        title: मूर्ख स्वतःचे आणि इतरांचे नुकसान करतात
      '27':
        title: नम्रता आणि वास्तवदृष्टीची शिकवण
      '28':
        title: परमेश्वराचा शोध घेऊन नीतिमान विजयी होतात
      '29':
        title: हट्टीपणा विनाशाकडे नेतो
      '30':
        title: आगूर अत्यंत नम्रतेने बोलतो
      '31':
        title: आई राजाला न्याय टिकवण्याची ताकीद देते
  Ecclesiastes:
    display_name: उपदेशक
    author: लेखक अज्ञात; वक्ता “कोहेलेथ” असून परंपरेने त्याची ओळख शलमोनाशी जोडली जाते.
