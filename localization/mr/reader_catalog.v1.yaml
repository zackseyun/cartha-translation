      '15':
        title: योसेफ भावांना लज्जेपासून वाचवतो
      '16':
        title: फसवणुकीबद्दल योसेफ मौन राखतो
      '17':
        title: योसेफ प्रेम करतो आणि दोष झाकतो
      '18':
        title: योसेफ नम्रता आणि आशीर्वादाची शिकवण देतो
      '19':
        title: योसेफ भावी राज्याचा दृष्टान्त प्रकट करतो
      '20':
        title: योसेफ आपली अस्थी घेऊन जाण्याची आज्ञा देतो
  Testament of Benjamin:
    display_name: बन्यामीनचा मृत्युपत्रोपदेश
    author: लेखक अज्ञात; ‘बारा कुलपितांचे मृत्युपत्रोपदेश’ या संग्रहाचा भाग.
