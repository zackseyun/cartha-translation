  Obadiah:
    display_name: ओबद्या
    author: ओबद्या.
    audience: अदोमने यरुशलेमचा विश्वासघात केल्यानंतरचा यहूदा—अदोमच्या पतनाविषयीची भविष्यवाणी.
    date: इ.स.पू. ५८६ नंतर लवकरच.
    chapters:
      '1':
        title: विश्वासघाताबद्दल अदोमचा न्याय
  Jonah:
    display_name: योना
    author: लेखक अज्ञात; कथेतील मुख्य पात्र अमित्तयचा पुत्र योना आहे.
    audience: निर्वासनोत्तर काळातील इस्राएल—वांशिक संकुचितपणावर उपरोधिक टीका आणि बाहेरच्यांवरील देवाच्या दयेची पुष्टी.
    date: बहुधा इ.स.पू. सुमारे ५वे–४थे शतक.
    chapters:
      '1':
        title: योना निनवेच्या कामगिरीपासून पळतो
      '2':
        title: योना माशाच्या पोटात प्रार्थना करतो
      '3':
        title: योनाच्या आवाहनावर निनवे पश्चात्ताप करते
      '4':
        title: देवाच्या दयेमुळे योना नाराज होतो
  Micah:
    display_name: मीखा
    author: मोरेशेथचा मीखा.
    audience: इ.स.पू. ८व्या शतकाच्या उत्तरार्धातील यहूदा; विशेषतः शहरी उच्चभ्रूंच्या विरोधात असलेले ग्रामीण गरीब.
    date: इ.स.पू. सु. ७४०–७००.
    chapters:
      '1':
        title: देव शोमरोन आणि यहूदाचा न्याय करतो
      '2':
        title: मीखा लोभी कारस्थानी लोकांचा निषेध करतो
      '3':
        title: नेते लोकांचे क्रूरपणे शोषण करतात
      '4':
        title: परमेश्वर सर्व राष्ट्रांवर राज्य करतो
      '5':
        title: बेथलेहेममधून राजा दावीद येईल
      '6':
        title: परमेश्वर इस्राएलविरुद्ध खटला मांडतो
      '7':
        title: मीखा दुःखात प्रार्थना करतो
  Nahum:
    display_name: नहूम
    author: एल्कोशचा नहूम.
    audience: निनवेच्या निकट येऊन ठेपलेल्या पतनाचा आनंद साजरा करणारा यहूदा.
    date: इ.स.पू. ६१२ च्या थोडे आधी.
    chapters:
      '1':
        title: देव निनवेला तिच्या अपराधाची शिक्षा देतो
      '2':
        title: संदेशवाहक यहूदाला शांतीची बातमी आणतो
      '3':
        title: निनवेला संपूर्ण अपमानाला सामोरे जावे लागते
  Habakkuk:
    display_name: हबक्कूक
    author: हबक्कूक.
    audience: बाबेलच्या उदयाला सामोरा जाणारा यहूदा—न्यायाविषयी संदेष्टा आणि देव यांच्यातील संवाद.
    date: इ.स.पू. ७व्या शतकाच्या उत्तरार्धात.
    chapters:
      '1':
        title: हबक्कूक दुष्ट सत्तेबद्दल विलाप करतो
      '2':
        title: देव गर्विष्ठ अत्याचाऱ्यांना इशारा देतो
      '3':
        title: हबक्कूक पवित्र भयाने प्रार्थना करतो
  Zephaniah:
    display_name: सफन्या
    author: कूशीचा पुत्र सफन्या.
    audience: योशीयाच्या सुधारणांच्या उंबरठ्यावर, त्याच्या राजवटीतील यहूदा.
    date: इ.स.पू. सु. ६४०–६०९.
    chapters:
      '1':
        title: देव यहूदाचा त्याच्या पापाबद्दल न्याय करतो
      '2':
        title: राष्ट्रांना शिक्षा होते, तरी आशा उरते
      '3':
        title: शुद्ध केलेल्या लोकांमुळे सीयोन आनंदित होते
  Haggai:
    display_name: हाग्गय
    author: हाग्गय.
    audience: दारयावेशच्या कारकिर्दीत मंदिर पुन्हा बांधणारे मायदेशी परतलेले लोक.
    date: इ.स.पू. ५२०.
    chapters:
      '1':
        title: परमेश्वर आपले मंदिर पुन्हा बांधण्यास सांगतो
      '2':
        title: देव मंदिर बांधणाऱ्यांना प्रोत्साहन देतो
  Zechariah:
    display_name: जखऱ्या
    author: बेरेक्याचा पुत्र जखऱ्या; अध्याय ९–१४ बहुधा नंतरच्या एखाद्या लेखकाकडून आलेले आहेत.
    audience: मंदिर पुन्हा बांधणारे मायदेशी परतलेले लोक आणि निर्वासनोत्तर काळातील नंतरचे समुदाय.
    date: अध्याय १–८ इ.स.पू. सु. ५२०–५१८; अध्याय ९–१४ कदाचित सुमारे एक शतकानंतरचे.
    chapters:
      '1':
        title: देव करुणेने परत येतो
      '2':
        title: यरुशलेम आनंदाने ओसंडून वाहते
      '3':
        title: देव यहोशवाला शुद्ध करतो
      '4':
        title: जरुब्बाबेल आत्म्याच्या सामर्थ्याने बांधतो
      '5':
        title: देशातून दुष्टता दूर केली जाते
      '6':
        title: याजक यहोशवासाठी मुकुट
      '7':
        title: न्यायाशिवाय उपवास व्यर्थ ठरतो
      '8':
        title: सीयोन शांततेत पुन्हा बांधले जाते
      '9':
        title: इस्राएलचा राजा नम्रपणे येतो
      '10':
        title: मूर्तींकडे नव्हे, पावसासाठी देवाकडे मागा
      '11':
        title: मेंढपाळ मेंढरांना सोडून देतो
      '12':
        title: यरुशलेम राष्ट्रांसाठी दहशत ठरते
      '13':
        title: देश पापापासून शुद्ध केला जातो
      '14':
        title: परमेश्वर यरुशलेमसाठी लढतो
  Malachi:
    display_name: मलाखी
    author: लेखक अज्ञात; “मलाखी” या नावाचा अर्थ “माझा संदेशवाहक” असा आहे.
    audience: पर्शियन राजवटीत उपासना आणि विश्वासूपणा यांबाबत निष्काळजी होत चाललेला निर्वासनोत्तर काळातील यहूदा.
    date: इ.स.पू. ५व्या शतकाच्या मध्यकाळात.
    chapters:
      '1':
        title: देव अप्रामाणिक याजकांचा निषेध करतो
      '2':
        title: यहूदाने कराराचा विश्वासघात केला
      '3':
        title: संदेशवाहक शुद्धीकरणाची तयारी करतो
  Matthew:
    display_name: मत्तय
    author: लेखक अज्ञात; परंपरेनुसार याचे लेखन प्रेषित मत्तयाने केले. आधुनिक अभ्यासकांच्या मते, मार्क आणि ‘क्यू’सदृश स्रोताचा आधार घेणारा ग्रीकभाषी यहूदी-ख्रिस्ती लेखक यामागे होता.
    audience: सभास्थानातील यहूदी धर्माशी असलेल्या सातत्य आणि तुटलेपणाच्या प्रश्नांशी झगडणारा एक यहूदी-ख्रिस्ती समुदाय.
    date: इ.स. सु. ८०–९०.
    chapters:
      '1':
        title: येशूचा मसीहाच्या वंशात जन्म
      '2':
        title: ज्ञानी लोक नवजात राजाची उपासना करतात
      '3':
        title: योहान अभिषिक्त येशूला बाप्तिस्मा देतो
      '4':
        title: देवाचे राज्य जवळ आले आहे, असे येशू शिकवतो
      '5':
        title: येशू राज्याचा मार्ग शिकवतो
      '6':
        title: प्रथम पित्याचे राज्य शोधा
      '7':
        title: ख्रिस्तावर आपले जीवन उभारा
      '8':
        title: येशू बरे करून आपला अधिकार दाखवतो
      '9':
        title: येशू पक्षाघाती माणसाला बरे करतो
      '10':
        title: येशू बारा प्रेषितांना पाठवतो
      '11':
        title: अविश्वासाबद्दल येशू नगरांना फटकारतो
      '12':
        title: येशू खरे कुटुंब कोणते हे सांगतो
      '13':
        title: येशू राज्याविषयी दाखले शिकवतो
      '14':
        title: येशू चमत्काराने मोठ्या समुदायांना अन्न देतो
      '15':
        title: येशू धार्मिक ढोंगीपणाला आव्हान देतो
      '16':
        title: येशू मंडळी आणि दुःख यांविषयी प्रकट करतो
      '17':
        title: येशूचे रूपांतर होते आणि तो एलियाविषयी सांगतो
      '18':
        title: येशू नम्रता आणि क्षमा शिकवतो
      '19':
        title: येशू विवाह आणि राज्य यांविषयी शिकवतो
      '20':
        title: सेवेद्वारे मोठेपण मिळते, असे येशू शिकवतो
      '21':
        title: येशू राजा म्हणून यरुशलेममध्ये प्रवेश करतो
      '22':
        title: येशू नेत्यांच्या सापळ्यांना सुज्ञपणे उत्तरे देतो
      '23':
        title: येशू ढोंगीपणाविरुद्ध इशारा देतो
      '24':
        title: येशू मंदिराच्या विध्वंसाची भविष्यवाणी करतो
      '25':
        title: येशू राष्ट्रांचा वेगवेगळा न्याय करतो
      '26':
        title: येशूला अटक होते, त्याची थट्टा होते आणि त्याला वधस्तंभावर खिळले जाते
      '27':
        title: येशूला पुरले जाते आणि पहारेकरी कबरेची सुरक्षा करतात
      '28':
        title: येशू पुन्हा उठतो आणि शिष्यांना पाठवतो
  Mark:
    display_name: मार्क
    author: लेखक अज्ञात; परंपरा याचा संबंध पेत्राचा प्रवासी सहकारी योहान मार्क याच्याशी जोडते.
    audience: छळाच्या धोक्याखाली किंवा त्याच्या जवळ असलेला, कदाचित रोममधील ग्रीकभाषी ख्रिस्ती समुदाय.
    date: इ.स. सु. ६५–७५; यहूदी युद्ध आणि मंदिराचा विध्वंस यांच्या आसपासचा काळ.
    chapters:
      '1':
        title: येशू देवाच्या राज्याची घोषणा करतो
      '2':
        title: येशू बरे करतो आणि पापांची क्षमा करतो
      '3':
        title: येशू बारा शिष्यांना निवडतो
      '4':
        title: येशू समुद्राजवळ दाखल्यांतून शिकवतो
      '5':
        title: येशू एका यहुदीतर मनुष्याला बरे करतो
      '6':
        title: येशू पाच हजारांना जेवू घालतो
      '7':
        title: येशू मानवी परंपरांना आव्हान देतो
      '8':
        title: येशू चार हजार लोकांना जेवू घालतो
      '9':
        title: येशू आपले गौरव प्रकट करतो
      '10':
        title: येशू मुलांचे राज्यात स्वागत करतो
      '11':
        title: जयजयकारात येशू यरुशलेममध्ये प्रवेश करतो
      '12':
        title: येशू कपटी प्रश्नांना उत्तरे देतो आणि शिकवतो
      '13':
        title: येशू महासंकटाविषयी शिकवतो
      '14':
        title: रात्री यहूदा येशूचा विश्वासघात करतो
      '15':
        title: येशूला वधस्तंभावर खिळले जाते आणि श्रद्धेने पुरले जाते
      '16':
        title: येशू उठतो; स्त्रिया ही बातमी सांगतात
  Luke:
    display_name: लूक
    author: लेखक अज्ञात; परंपरेनुसार याचे लेखन पौलाचा प्रवासी सहकारी लूक याने केले.
    audience: ग्रीक-रोमन जगातील सुशिक्षित ख्रिस्ती वाचकवर्ग, ज्यांना "थियफिल" याला उद्देशून संबोधले आहे.
    date: सु. इ.स. ८०–९०.
    chapters:
      '1':
        title: देव दोन चमत्कारिक जन्मांची घोषणा करतो
      '2':
        title: येशूचा जन्म आनंद घेऊन येतो
      '3':
        title: योहान येशूसाठी मार्ग तयार करतो
      '4':
        title: येशू मोहाचा प्रतिकार करून सेवाकार्य सुरू करतो
      '5':
        title: येशू माणसे धरणाऱ्या मच्छीमारांना बोलावतो
      '6':
        title: येशू बारा प्रेषित निवडतो
      '7':
        title: येशू शताधिपतीच्या सेवकाला बरे करतो
      '8':
        title: येशू राज्याविषयी दाखल्यांतून शिकवतो
      '9':
        title: येशू संपूर्ण समर्पणाची मागणी करतो
      '10':
        title: येशू शिष्यांना पुढे पाठवतो
      '11':
        title: येशू चिकाटीने प्रार्थना करायला शिकवतो
      '12':
        title: येशू ढोंगीपणाविरुद्ध इशारा देतो
      '13':
        title: येशू इशारा देतो आणि बरे करतो
      '14':
        title: येशू नम्रता आणि उदारता शिकवतो
      '15':
        title: येशू हरवलेल्या पापी लोकांचे स्वागत करतो
      '16':
        title: येशू संपत्तीच्या उपासनेचा निषेध करतो
      '17':
        title: येशू शिष्यांना इशारा देतो आणि सेवा करायला शिकवतो
      '18':
        title: येशू चिकाटीच्या प्रार्थनेविषयी शिकवतो
      '19':
        title: येशू यरीहोमध्ये जक्कयाचे तारण करतो
      '20':
        title: येशू मंदिरातील पुढाऱ्यांना आव्हान देतो
      '21':
        title: विधवेचे दान आणि येणारे महासंकट
      '22':
        title: येशू जैतून डोंगरावर प्रार्थना करतो
      '23':
        title: येशूला नव्या कबरेत पुरले जाते
      '24':
        title: येशू उठतो आणि पापक्षमतेची घोषणा करतो
  John:
    display_name: योहान
    author: लेखक अज्ञात; परंपरेनुसार याचे लेखन प्रेषित योहान किंवा "प्रिय शिष्य" याने केले.
