      '13':
        title: बाबेलचा संपूर्ण विनाश होणार
      '14':
        title: इस्राएल पडलेल्या बाबेलच्या राजाची थट्टा करतो
      '15':
        title: मवाबवर अचानक मोठे संकट
      '16':
        title: मवाबच्या गर्वामुळे कठोर न्याय
      '17':
        title: दिमिष्क आणि एफ्राईम उजाड होतात
      '18':
        title: दूरचा देश दूत पाठवतो
