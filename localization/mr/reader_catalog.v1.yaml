    display_name: उत्पत्ति
    author: लेखक अज्ञात; परंपरेने याचे लेखन मोशेला दिले जाते. आधुनिक संशोधनानुसार, दीर्घ काळ चाललेल्या रचनाप्रक्रियेत विविध स्रोत नंतर एकत्र संपादित करण्यात आले.
    audience: कराराने घडलेली आपली ओळख जाणणारा इस्राएल—देवाची सृष्टी, निवड आणि अभिवचन यांमध्ये लोकांच्या उत्पत्तीची कथा रुजवण्यासाठी.
    date: अनेक शतकांच्या कालावधीत रचना झाली; बाबेलच्या बंदिवासाच्या काळात किंवा त्यानंतर, अंदाजे इ.स.पू. सहाव्या ते पाचव्या शतकात, याला आजचे प्राप्त स्वरूप मिळाले.
    summary: उत्पत्ति या पुस्तकात सृष्टी, मानवाचे बंड आणि विखुरणे, तसेच अब्राहाम, इसहाक, याकोब आणि योसेफ यांच्या कुटुंबाची कथा सांगितली आहे; त्यांच्याद्वारे इस्राएलासाठी देवाच्या कराराची अभिवचने उलगडू लागतात.
