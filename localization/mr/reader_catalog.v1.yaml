  Exegesis on the Soul:
    display_name: आत्म्याचे निरूपण
    author: लेखक अज्ञात. लेखक हा एक ख्रिस्ती प्रवचनकार असून, आत्म्याचे पतन, पश्चात्ताप आणि पुनःस्थापना यांचे रूपक म्हणून तो बायबलमधील आणि ग्रीक साहित्यातील प्रतिमांचे नव्याने वाचन करतो.
    audience: पवित्र शास्त्र आणि नैतिक बोध यांची ओळख असलेले, तसेच अनियंत्रित इच्छांपासून वळून पश्चात्ताप करण्यासाठी आणि दैवी तत्त्वाशी पुन्हा एकरूप होण्यासाठी बोलावले जात असलेले ख्रिस्ती.
