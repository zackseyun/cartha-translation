  Song of Solomon:
    display_name: शलमोनाचे गीत
    author: लेखक अज्ञात; शीर्षलेखात शलमोनाचा उल्लेख आहे.
    audience: करारातील जिव्हाळ्याचे भिंग म्हणून कामुक प्रेमाकडे पाहणारा इस्राएल—आणि नंतर त्याचा रूपकात्मक अर्थ लावणारे यहूदी व ख्रिस्ती वाचक.
    date: बहुधा निर्वासनोत्तर काळातील, अंदाजे इ.स.पू. ५वे–३रे शतक.
