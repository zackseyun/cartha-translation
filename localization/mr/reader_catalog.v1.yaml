  Infancy Gospel of Thomas:
    display_name: थोमाचे येशूच्या बालपणाचे शुभवर्तमान
    author: लेखक अज्ञात. उपलब्ध पुराव्यांवरून पुनर्रचित करता येणाऱ्या त्याच्या सर्वांत प्राचीन स्वरूपात लेखकाचे नाव दिलेले नाही; थोमाच्या नावाने झालेले श्रेयांकन नंतरच्या हस्तलिखितांच्या शीर्षकांत आणि पाठपरंपरेत आढळते.
    audience: येशूच्या बालपणाविषयी आणि अधिकृत शुभवर्तमानांतील वृत्तांत सुरू होण्यापूर्वी त्याचे दैवी सामर्थ्य, शिस्त, शिक्षण आणि परिपक्व होणे यांचे वर्णन कसे केले जाऊ शकते याविषयी कुतूहल असलेले ख्रिस्ती.
    date: सामान्यतः याचा उगम इ.स.च्या दुसऱ्या शतकात मानला जातो; मात्र हा मजकूर परस्परांहून बऱ्याच अंशी भिन्न असलेल्या अनेक ग्रीक पाठरूपांत आणि प्राचीन अनुवादांत उपलब्ध आहे.
    chapters:
      '1':
        title: थोमा येशूविषयी सांगतो
      '2':
        title: येशू पाणी स्वच्छ करून पक्षी घडवतो
      '3':
        title: येशू हन्नाच्या मुलाला शाप देतो
      '4':
        title: येशूच्या शापाने बालक मरते
      '5':
        title: येशू योसेफाला ज्ञान शिकवतो
      '6':
        title: येशूच्या ज्ञानापुढे शिक्षक हतबल होतो
      '7':
        title: शिक्षक येशूचे श्रेष्ठ ज्ञान मान्य करतो
      '8':
        title: येशू हसतो, बरे करतो आणि घोषणा करतो
      '9':
        title: येशू पडलेल्या झेनोला पुन्हा जिवंत करतो
      '10':
        title: येशू लाकूडतोड्याचा पाय बरा करतो
      '11':
        title: येशू चमत्काराने फुटकी घागर भरतो
      '12':
        title: येशूने पेरलेल्या बीजाचे पीक योसेफ कापतो
      '13':
        title: येशूच्या मदतीने योसेफ पलंग पूर्ण करतो
      '14':
        title: येशूला आव्हान दिल्यानंतर शिक्षक मरतो
      '15':
        title: येशूच्या बोलण्याने शिक्षक आनंदित होतो
      '16':
        title: येशू याकोबाचा सर्पदंश बरा करतो
      '17':
        title: येशू बाळ योसेफाला बरे करतो
      '18':
        title: येशू घटनास्थळी एका मनुष्याला जिवंत करतो
      '19':
        title: बारा वर्षांचा येशू मंदिरात शिकवतो
  Acts of Paul and Thecla:
    display_name: पौल आणि थेक्ला यांची कृत्ये
    author: लेखक अज्ञात. हा ‘पौलाची कृत्ये’ या अधिक विस्तृत ग्रंथातील एक प्रसंग आहे; एका धर्मगुरूने हा ग्रंथ रचल्याचा प्राचीन वृत्तांत लेखकाची ओळख निश्चितपणे पटवून देत नाही.
    audience: प्रेषितांचा उपदेश, ब्रह्मचर्य, बाप्तिस्मा, हौतात्म्यासारखे धैर्यपूर्ण सहन करणे आणि शिकवण्याचा व साक्ष देण्याचा एका स्त्रीचा अधिकार यांविषयीच्या कथांकडे आकर्षित झालेले ख्रिस्ती.
    date: इ.स.च्या दुसऱ्या शतकात, बहुधा त्या शतकाच्या उत्तरार्धात, रचलेला; ‘पौलाची कृत्ये’ या ग्रंथाचा भाग म्हणून आणि स्वतंत्र ग्रंथ म्हणूनही तो प्रचलित होता.
    chapters:
      '1':
        title: पौल अनेसिफराच्या घरी उपदेश करतो
      '2':
        title: थेक्ला पौलाचे ऐकते आणि त्याची आस धरते
      '3':
        title: थामिरिस राज्यपालासमोर पौलावर आरोप करतो
      '4':
        title: थेक्ला तुरुंगात पौलाला भेटून त्याला धीर देते
      '5':
        title: खांबाला बांधून जाळले जात असताना थेक्ला बचावते
      '6':
        title: पौल आणि थेक्ला उपवास व प्रार्थना करतात
      '7':
        title: पौल थेक्लाला अंत्युखियाला पाठवतो
      '8':
        title: त्रिफिना थेक्लाचे हिंस्र पशूंपासून रक्षण करते
      '9':
        title: थेक्ला कुंडात स्वतःला बाप्तिस्मा देते
      '10':
        title: थेक्ला सेल्यूकियात स्त्रियांना शिकवते
      '11':
        title: स्वर्गीय वाणी थेक्ला आणि तिचा बुरखा वाचवते
  Gospel of Peter:
    display_name: पेत्राचे शुभवर्तमान
    author: लेखक अज्ञात. उपलब्ध कथन पेत्राच्या वाणीने बोलते आणि त्याच्या नावाने प्रसारित झाले; परंतु ते ऐतिहासिक प्रेषित पेत्राने लिहिलेले मानले जात नाही.
    audience: येशूच्या दुःखभोगाचे आणि पुनरुत्थानाचे विस्तृत कथन जाणून घेण्याची इच्छा असलेले आरंभीचे ख्रिस्ती; बहुधा अशा समुदायांतील, जिथे पेत्राच्या अधिकाराला विशेष महत्त्व होते.
    date: सामान्यतः इ.स.च्या दुसऱ्या शतकातील मानले जाते; उपलब्ध असलेला प्रमुख ग्रीक अंश खूप नंतरच्या एका हस्तलिखितातून आला असून ते अख्मीम येथे सापडले.
    chapters:
      '1':
        title: हेरोद प्रभूच्या खटल्याची आज्ञा देतो
      '2':
        title: योसेफ प्रभूचे शरीर पुरतो
      '3':
        title: जमाव देवाच्या पुत्राची थट्टा करतो
      '4':
        title: अपराधी येशूच्या सन्मानाचे संरक्षण करतो
      '5':
        title: भर दुपारी यहूदियावर अंधार पसरतो
      '6':
        title: येशूला योसेफाच्या कबरीत ठेवले जाते
      '7':
        title: केलेल्या गैरकृत्याबद्दल लोक शोक करतात
      '8':
        title: वडीलजन येशूच्या कबरीवर पहारा ठेवतात
      '9':
        title: पहाटे स्वर्गीय वाणी ऐकू येते
      '10':
        title: तीन पुरुष कबरीतून बाहेर येतात
      '11':
        title: सैनिक पिलाताला वृत्तांत देतात
      '12':
        title: मरीया मग्दालिया कबरीचा शोध घेते
      '13':
        title: देवदूताची बातमी ऐकून स्त्रिया पळून जातात
      '14':
        title: सणानंतर शिष्य रडतात
  2 Clement:
    display_name: २ क्लेमेंट
    author: लेखक अज्ञात. पारंपरिक शीर्षक तसे असले, तरी हे रोमच्या क्लेमेंटने लिहिलेले दुसरे पत्र नसून आरंभीचे ख्रिस्ती प्रवचन आहे.
    audience: पश्चात्ताप, नैतिक आचरणातील सातत्य, असुरक्षित लोकांची काळजी आणि पुनरुत्थान व न्यायनिवाडा यांच्या आशेने विश्वासूपणे टिकून राहणे यांसाठी आवाहन केलेली ख्रिस्ती सभा.
    date: सामान्यतः इ.स.च्या दुसऱ्या शतकाच्या पूर्वार्धातील किंवा मध्यकाळातील (अंदाजे इ.स. १००–१६०) मानले जाते; ते कोठे रचले गेले हे अनिश्चित आहे.
    chapters:
      '1':
        title: येशू ख्रिस्त आपला न्यायाधीश
      '2':
        title: मंडळी विश्वासाने भरून जाते
      '3':
        title: ख्रिस्त आपल्यावर दया करतो
      '4':
        title: कृतीतून खरी कबुली
      '5':
        title: देवासाठी निर्भयपणे जगा
      '6':
        title: संपत्तीऐवजी देवाला निवडा
      '7':
        title: स्पर्धेत मनापासून उतरा
      '8':
        title: जिवंत असतानाच पश्चात्ताप करा
      '9':
        title: देहाचे मंदिराप्रमाणे रक्षण करा
      '10':
        title: सद्गुण आणि शांती यांचा पाठपुरावा करा
      '11':
        title: शुद्ध अंतःकरणाने देवाची सेवा करा
      '12':
        title: प्रेम आणि नीतिमत्त्व वाट पाहत आहेत
      '13':
        title: पश्चात्ताप करा आणि चांगुलपणाचा पाठपुरावा करा
      '14':
        title: जिवंत मंडळीचे सदस्य व्हा
      '15':
        title: मनापासून आत्मसंयम पाळा
      '16':
        title: वेळ आहे तोवर पश्चात्ताप करा
      '17':
        title: दुर्बळांना चांगुलपणाकडे जाण्यास मदत करा
      '18':
        title: नीतिमत्त्वासाठी झटा
      '19':
        title: आत्ताच मनापासून पश्चात्ताप करा
      '20':
        title: दुःखातील देवाच्या शिस्तीवर भरवसा ठेवा
  Epistle of Barnabas:
    display_name: बर्णबाचे पत्र
    author: लेखक अज्ञात. परंपरेने या ग्रंथाचा संबंध पौलाचा सहकारी बर्णबा याच्याशी जोडला गेला होता; परंतु आधुनिक विद्वान हे श्रेयांकन स्वीकारत नाहीत.
    audience: ख्रिस्तकेंद्री आणि रूपकात्मक अर्थनिर्णयाद्वारे इस्राएलची पवित्र शास्त्रे स्वतःची मानण्याची शिकवण मिळणारे, तसेच आपली कराराधारित ओळख यहुदी आचारांपासून वेगळी समजणारे यहुदीतर ख्रिस्ती.
    date: सामान्यतः यरुशलेमच्या मंदिराचा इ.स. ७० मध्ये झालेला विध्वंस आणि दुसऱ्या शतकाचा आरंभ यांच्या दरम्यानचा, बहुधा अंदाजे इ.स. ८०–१३०, मानला जातो.
    chapters:
      '1':
        title: देवाची कृपा प्रिय समुदायाला भरून टाकते
      '2':
        title: विश्वासणारे देवाची खरी आज्ञा शोधतात
      '3':
        title: उपवास म्हणजे दया आणि न्याय
      '4':
        title: जागरूक ख्रिस्ती परीक्षांची वाट पाहतात
      '5':
        title: येशूने पापी लोकांसाठी दुःख सोसले
      '6':
        title: येशू वचन दिलेल्या राज्याची पूर्तता करतो
      '7':
        title: येशूच्या जखमांसाठी देवाचे आभार माना
      '8':
        title: कालवडीचे बलिदान येशूची पूर्वछाया दाखवते
      '9':
        title: हृदयाची सुंता विश्वास दर्शवते
      '10':
        title: अन्नविषयक नियम आध्यात्मिक धडे शिकवतात
      '11':
        title: बाप्तिस्मा आणि क्रूस क्षमा देतात
      '12':
        title: मोशेचे उभारलेले हात येशूकडे निर्देश करतात
      '13':
        title: याकोबाचा आशीर्वाद उलटफेराचे भाकीत करतो
      '14':
        title: येशू देवासाठी हृदयांचे उद्धार करतो
      '15':
        title: न्यायानंतर शब्बाथची विश्रांती येते
      '16':
        title: खरे मंदिर विश्वासणाऱ्यांच्या अंतःकरणात आहे
      '17':
        title: तारण आता स्पष्टपणे समजावले आहे
      '18':
        title: प्रकाशाचे देवदूत आणि अंधकाराचा शासक
      '19':
        title: प्रकाशाचा मार्ग समर्पणाची आज्ञा देतो
      '20':
        title: अंधकाराचा मार्ग सार्वकालिक नाशाकडे नेतो
      '21':
        title: गौरवासाठी प्रभूच्या आज्ञा पाळा
  Letters of Ignatius:
    display_name: इग्नेशियसची पत्रे
    author: सर्वसाधारणपणे मान्य असलेल्या मध्यम पाठपरंपरेतील सात पत्रांचा लेखक अंत्युखियाचा बिशप इग्नेशियस; नंतर विस्तारलेली आणि इग्नेशियसच्या नावाने लिहिलेली पत्रे या संग्रहात समाविष्ट नाहीत.
    audience: हौतात्म्याकडे जात असताना इग्नेशियसने इफिस, मॅग्नेशिया, त्राल्लेस, रोम, फिलदेल्फिया आणि स्मुर्णा येथील ख्रिस्ती मंडळांना, तसेच पॉलीकार्पला उद्देशून लिहिलेली पत्रे.
    date: सहसा इ.स.च्या दुसऱ्या शतकाच्या आरंभीची, बहुधा सु. इ.स. १०५–११७ दरम्यानची मानली जातात; मात्र इग्नेशियसच्या प्रवासाचा नेमका कालक्रम अद्याप वादग्रस्त आहे.
    chapters:
      '1':
        title: इग्नेशियस इफिसच्या मंडळीला अभिवादन करतो
      '2':
        title: विश्वासणारे बंदिवान इग्नेशियसला साहाय्य करतात
      '3':
        title: ऐक्य आणि प्रार्थनेने बिशपचा सन्मान करा
      '4':
        title: इग्नेशियस नम्रपणे बोलतो
      '5':
        title: येशूवरील प्रेमातून ऐक्य
      '6':
        title: बिशप विश्वासणाऱ्यांना प्रार्थनेत एकत्र आणतो
      '7':
        title: शांतपणे उत्तम नेतृत्व करणाऱ्या बिशपचा आदर करा
      '8':
        title: खोट्या शिक्षकांच्या प्रभावापासून सावध राहा
      '9':
        title: इफिसकरांची इग्नेशियसप्रती निष्ठा
      '10':
        title: दुष्ट शिकवण नाकारून ठाम राहा
      '11':
        title: सर्व लोकांसाठी सतत प्रार्थना करा
      '12':
        title: ख्रिस्त सर्व बंधनांपेक्षा श्रेष्ठ
      '13':
        title: दोषी ठरवलेला मनुष्य म्हणून इग्नेशियस लिहितो
