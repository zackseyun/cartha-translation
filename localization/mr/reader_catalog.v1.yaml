  Gospel of Philip:
    display_name: फिलिपचे शुभवर्तमान
    author: लेखक अज्ञात. हे शीर्षक हस्तलिखिताच्या अखेरच्या नोंदीत आढळते; मात्र या ग्रंथात फिलिप हा त्याचा लेखक असल्याचे म्हटलेले नाही. सध्या उपलब्ध असलेली एकमेव प्रत नाग हम्मादी कोडेक्स II,3 मधील कॉप्टिक मजकूर आहे.
    audience: व्हॅलेंटिनीय शैलीच्या संस्कारविषयक शिक्षणाशी—विशेषतः बाप्तिस्मा, अभिषेक, प्रभुभोजन, मुक्ती, पुनरुत्थान आणि विवाहकक्षाच्या प्रतिमांशी—परिचित असलेला आरंभीचा ख्रिस्ती समुदाय.
    date: सामान्यतः इ.स. दुसऱ्या शतकाच्या उत्तरार्धातील किंवा तिसऱ्या शतकाच्या पूर्वार्धातील मानला जातो; पूर्वीच्या ग्रीक रूपावरून अनुवादित केलेल्या चौथ्या शतकातील कॉप्टिक हस्तलिखितात तो जतन झाला आहे.
    chapters:
      '1':
        title: ख्रिस्त संपूर्ण दैवी कुटुंब आणतो
      '2':
        title: विश्वास हिवाळ्यात भावी आशेचे बी पेरतो
      '3':
        title: शब्द खरे आध्यात्मिक वास्तव प्रकट करतात
      '4':
        title: ख्रिस्त आध्यात्मिक बंदिवासातून मुक्त करतो
      '5':
        title: येशू पृथ्वीवरील पित्यापासून भेद करतो
      '6':
        title: येशू गुप्त दैवी वास्तव प्रकट करतो
      '7':
        title: पुनरुत्थान देहधारी जीवनाचे रूपांतर करते
      '8':
        title: येशू हळूहळू स्वतःला प्रकट करतो
      '9':
        title: आध्यात्मिक मुले चिरस्थायी जीवनाचा विस्तार करतात
      '10':
        title: आध्यात्मिकदृष्ट्या पूर्ण झालेले सर्वांची सेवा करतात
      '11':
        title: बाप्तिस्मा अमर जीवनासाठी रूपांतर करतो
      '12':
        title: विवाहाचे रहस्य पवित्र ऐक्य पुनर्स्थापित करते
      '13':
        title: दैवी सत्य आध्यात्मिक पुनर्जन्म घडवते
      '14':
        title: ख्रिस्त ऐक्य आणि जीवन पुनर्स्थापित करतो
      '15':
        title: पुनरुत्थान खरे जीवन आताच जागृत करते
      '16':
        title: दैवी कृपेने विश्वास परिपक्व होतो
      '17':
        title: येशू दुष्टता उघड करतो आणि दूर करतो
      '18':
        title: पवित्र एकात्मतेतून शाश्वत प्रकाश मिळतो
  Gospel of Mary:
    display_name: मरियेचे शुभवर्तमान
    author: लेखक अज्ञात. या ग्रंथात मरियेला येशूच्या प्रकटीकरणाची प्राप्तकर्ती आणि त्याचा अर्थ सांगणारी म्हणून सादर केले आहे; पण सध्या उपलब्ध असलेले शुभवर्तमान मरियेने लिहिले, असा दावा त्यात केलेला नाही.
    audience: प्रकटीकरण, आध्यात्मिक उन्नती, प्रेषितांचा अधिकार आणि येशूच्या शिष्यांमध्ये मरियेच्या शिकवणीची वैधता यांविषयी विचारमंथन करणारे आरंभीचे ख्रिस्ती वाचक.
    date: सामान्यतः इ.स. दुसऱ्या शतकातील मानले जाते; तिसऱ्या शतकातील ग्रीक तुकडे उपलब्ध आहेत आणि त्याची प्रमुख कॉप्टिक प्रत पाचव्या शतकातील बर्लिन कोडेक्स ८५०२ मध्ये जतन झाली आहे.
    chapters:
      '1':
        title: तारणारा पापाविरुद्ध शिकवतो
      '2':
        title: येशू शिष्यांना शांती देऊन पाठवतो
      '3':
        title: मरिया शिकवणीद्वारे सांत्वन करते
      '4':
        title: आत्मा विस्मृतीवर मात करतो
      '5':
        title: लेवी शुभवर्तमान घोषित करण्याचे आवाहन करतो
  Treatise on the Resurrection:
    display_name: पुनरुत्थानावरील प्रबंध
    author: लेखक अज्ञात. हा ग्रंथ एका शिक्षकाने रेगिनोस नावाच्या शिष्याला लिहिलेल्या पत्राच्या रूपात मांडला आहे; त्या शिक्षकाची किंवा रेगिनोसची खात्रीशीर ओळख पटलेली नाही.
    audience: पुनरुत्थानाविषयी मार्गदर्शन शोधणारे ख्रिस्ती, विशेषतः शारीरिक व आध्यात्मिक पुनरुत्थानाचा आणि वर्तमानकाळात पुनरुत्थित जीवनात सहभागी होण्याचा विचार करणारे वाचक.
    date: सामान्यतः इ.स. दुसऱ्या शतकाच्या उत्तरार्धातील (बहुधा सु. १७०–२००) मानला जातो; पूर्वीच्या एका ग्रीक ग्रंथाची चौथ्या शतकातील कॉप्टिक प्रत जतन झाली आहे.
    chapters:
      '1':
        title: ख्रिस्त खरे परिपूर्णत्व आणतो
      '2':
        title: ख्रिस्त मृत्यूच्या पकडीवर मात करतो
      '3':
        title: पुनरुत्थान वास्तवाचे रूपांतर करते
      '4':
        title: विश्वासणारे ख्रिस्ताच्या पुनरुत्थानात सहभागी होतात
      '5':
        title: ख्रिस्ताच्या पुनरुत्थानावरील विश्वास
      '6':
        title: तारणाचे ज्ञान सदासर्वकाळ टिकते
      '7':
        title: कृपा शाश्वत जीवनाचे रक्षण करते
      '8':
        title: पुनरुत्थान खरे जीवन प्रकट करते
      '9':
        title: पुनरुत्थान नाशावर विजय मिळवते
      '10':
        title: पुनरुत्थानासाठी विभाजनातून मुक्त व्हा
      '11':
        title: इतरांच्या हितासाठी शिकवण सांगा
  Dialogue of the Savior:
    display_name: तारणाऱ्याचा संवाद
    author: लेखक अज्ञात. या संवादात यहूदा, मत्तय आणि मरिया यांच्याशी झालेल्या संभाषणात प्रकटीकरणात्मक शिकवण येशूच्या मुखातून दिली आहे; मात्र त्याचा संकलक कोण होता, हे सांगितलेले नाही.
    audience: खासगी प्रकटीकरण, शिष्यत्व, आत्मज्ञान, प्रार्थना आणि तारणासाठीची वैराग्यपूर्ण तयारी यांत रस असलेला आरंभीचा ख्रिस्ती समुदाय.
    date: सामान्यतः इ.स. दुसऱ्या शतकातील मानला जातो; मात्र त्याच्या रचनेतील विविध स्तर आणि नेमका काळ यांविषयी मतभेद कायम आहेत. तो चौथ्या शतकातील एका कॉप्टिक हस्तलिखितात जतन झाला आहे.
