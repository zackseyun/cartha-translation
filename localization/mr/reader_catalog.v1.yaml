  Isaiah:
    display_name: यशया
    author: अनेक शतकांच्या काळात अनेक लेखकांनी रचना केली; अध्याय १–३९ यांची मुळे इ.स.पू. ८व्या शतकातील यरुशलेमच्या यशयामध्ये आहेत, तर ४०–५५ ("दुसरा यशया") आणि ५६–६६ ("तिसरा यशया") हे निर्वासन आणि परतणे यांना प्रतिसाद देतात.
    audience: अश्शूरच्या धोक्याखालील यहूदा, बाबेलमधील निर्वासित आणि निर्वासनानंतर पुनर्स्थापित झालेला समुदाय — अनुक्रमे.
    date: अंदाजे इ.स.पू. ८व्या शतकाच्या उत्तरार्धापासून ५व्या शतकापर्यंत रचना झाली.
