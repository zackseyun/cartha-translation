payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: आर्कॉनांचे वास्तवस्वरूप
      author: लेखक अज्ञात आहे. लेखक उत्पत्तीच्या पुस्तकाचा अर्थ आर्कॉनांविषयीच्या प्रकटीकरणात्मक मिथकाद्वारे लावतो; हे लिखाण कोणत्याही नावाने ओळखल्या जाणाऱ्या शिक्षकाचे आहे, असे खात्रीने म्हणता येत नाही.
      audience: उत्पत्तीचे पुस्तक अज्ञानी वैश्विक शासक, दैवी प्रज्ञा आणि मानवजातीचा आध्यात्मिक उगम यांच्यातील संघर्ष म्हणून वाचणारे सेथियन किंवा संबंधित वातावरणातील ख्रिस्ती.
      date: हे लिखाण सामान्यतः इ.स. तिसऱ्या शतकातील मानले जाते; त्याची प्रत इ.स. चौथ्या शतकातील नाग हम्मादी कोडेक्स II या कॉप्टिक हस्तलिखितात जतन झाली आहे.
    On the Origin of the World:
      display_name: जगाच्या उत्पत्तीविषयी
      author: लेखक अज्ञात आहे. या लिखाणात अनेक यहुदी, ख्रिस्ती, प्लेटोवादी आणि पौराणिक परंपरांचे संकलन व पुनर्मांडणी केली आहे; मात्र संकलकाचे नाव दिलेले नाही.
      audience: सृष्टी, वैश्विक शासक, सोफिया, आदाम व हव्वा आणि जगाचे अंतिम भवितव्य यांचा पर्यायी इतिहास जाणून घेऊ इच्छिणारे, ज्ञानवादी प्रवृत्तीच्या ख्रिस्ती वातावरणातील वाचक.
      date: हे लिखाण सहसा इ.स. तिसऱ्या शतकातील मानले जाते, तरी त्यामागील काही सामग्री अधिक जुनी असू शकते; ते मुख्यतः इ.स. चौथ्या शतकातील कॉप्टिक प्रतींमध्ये जतन झाले आहे.
    Sophia of Jesus Christ:
      display_name: येशू ख्रिस्ताची प्रज्ञा
      author: लेखक अज्ञात आहे. युग्नोस्टोस या लिखाणातूनही ज्ञात असलेली सामग्री लेखकाने येशू आणि त्याच्या शिष्यांमधील पुनरुत्थानानंतरचा संवाद म्हणून रूपांतरित केली आहे.
      audience: अतीत देव, स्वर्गीय जगाची रचना आणि आत्म्याचा उगम व तारण यांविषयीच्या प्रकट ज्ञानात रस असलेले ख्रिस्ती.
      date: हे लिखाण बहुधा इ.स. दुसऱ्या शतकाच्या उत्तरार्धातील किंवा तिसऱ्या शतकातील मानले जाते; नाग हम्मादी आणि बर्लिन कोडेक्समधील कॉप्टिक प्रतींमध्ये ते जतन झाले आहे.
    Gospel of the Egyptians:
      display_name: इजिप्शियनांचे शुभवर्तमान
      author: लेखक अज्ञात आहे. नाग हम्मादी येथे सापडलेले हे लिखाण ‘महान अदृश्य आत्म्याचा पवित्र ग्रंथ’ या नावानेही ओळखले जाते. ते केवळ उद्धरणांतून ज्ञात असलेल्या, यापूर्वीच्या ग्रीक ‘इजिप्शियनांचे शुभवर्तमान’ यापेक्षा वेगळे आहे.
      audience: आपली आध्यात्मिक ओळख आणि मुक्ती व्यक्त करण्यासाठी गहन मिथककथा, पवित्र नावे, बाप्तिस्म्याच्या प्रतिमा आणि स्तुतिगीतांचा उपयोग करणारा सेथियन ख्रिस्ती समुदाय.
      date: हे लिखाण सामान्यतः इ.स. दुसऱ्या किंवा तिसऱ्या शतकातील मानले जाते; इ.स. चौथ्या शतकातील नाग हम्मादी कोडेक्समध्ये त्याच्या दोन कॉप्टिक प्रती उपलब्ध आहेत.
    Letter of Peter to Philip:
      display_name: पेत्राचे फिलिप्पाला पत्र
      author: लेखक अज्ञात आहे. आरंभीचे छोटेसे पत्र आणि त्यानंतरचे प्रकटीकरण यांचे श्रेय पेत्र व फिलिप्प यांना छद्मनावाने दिले आहे; यांपैकी कोणत्याही प्रेषिताने ते लिहिले, असे खात्रीने म्हणता येत नाही.
      audience: तारणारा, विरोधी सत्ता, दुःखसहन, मिशन आणि शिष्यांचे पुनर्स्थापन यांविषयीच्या शिकवणीसाठी प्रेषितांचा आधार शोधणारे ख्रिस्ती.
      date: हे लिखाण सामान्यतः इ.स. दुसऱ्या शतकाच्या उत्तरार्धातील किंवा तिसऱ्या शतकाच्या आरंभीचे मानले जाते; इ.स. चौथ्या शतकातील नाग हम्मादी प्रत आणि त्यानंतरची एक कॉप्टिक प्रत यांमध्ये ते जतन झाले आहे.
    Gospel of Judas:
      display_name: यहूदाचे शुभवर्तमान
      author: लेखक अज्ञात आहे. शीर्षकात या कथनाचे श्रेय यहूदाला दिले आहे; परंतु यहूदा इस्कर्योत हाच त्याचा ऐतिहासिक लेखक होता, असे या लिखाणावरून सिद्ध होत नाही.
      audience: प्रतिस्पर्धी गटांच्या बलिदानविषयक आणि कलीसियाई प्रथांवर टीका करणारा आणि यहूदा व येशूचा मृत्यू यांचा नव्याने अर्थ लावण्यासाठी प्रकटीकरणात्मक संवाद व सेथियन प्रकारचे विश्ववर्णन वापरणारा एक ख्रिस्ती गट.
      date: हे लिखाण सहसा इ.स. दुसऱ्या शतकाच्या मध्यकाळातील किंवा उत्तरार्धातील मानले जाते; सुमारे इ.स. १८० मध्ये इरेनियसला ‘यहूदाचे शुभवर्तमान’ माहीत होते आणि उपलब्ध कॉप्टिक प्रत बहुधा इ.स. तिसऱ्या किंवा चौथ्या शतकातील आहे.
    Protoevangelium of James:
      display_name: याकोबाचे आदिशुभवर्तमान
      author: लेखक अज्ञात आहे. निवेदक स्वतःला याकोब म्हणवतो; परंतु हे लिखाण छद्मनावाने लिहिलेले आहे आणि येशूचा भाऊ याकोब याने ते लिहिलेले नाही.
      audience: मरियेचा जन्म व संगोपन, तिचे चिरंतन कौमार्य, येशूचा जन्म आणि मत्तय व लूक यांनी अनुत्तरित ठेवलेल्या प्रश्नांची कथारूप उत्तरे यांत रस असलेले ख्रिस्ती.
      date: हे लिखाण सामान्यतः इ.स. दुसऱ्या शतकाच्या उत्तरार्धातील मानले जाते; नंतरच्या काळातील अनेक ग्रीक हस्तलिखिते आणि प्राचीन भाषांतरे यांमध्ये ते उपलब्ध आहे.
