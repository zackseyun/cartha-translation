      author: अज्ञात; आरंभीच्या वाक्यात या वचनसंग्रहाचे श्रेय "दिदिमोस यहूदा थॉमस" याला दिले आहे. संपूर्ण ग्रंथ केवळ नाग हम्मादी येथील चौथ्या शतकातील कॉप्टिक अनुवादात (NHC II,2) टिकून आहे; ऑक्सिरिंखस येथून त्याचे तीन ग्रीक तुकडेही सापडले आहेत.
      audience: सीरियाई ज्ञानपरंपरा आणि ज्ञानवादी विचारांच्या आरंभीच्या रूपाचा प्रभाव असलेले ख्रिस्ती वाचक; येशूच्या वचनांद्वारे गूढ आत्मज्ञान मिळवण्यावर भर देणारे.
      date: ग्रीक मूळ बहुधा इ.स. सु. ५०–१४०; कॉप्टिक हस्तलिखित बहुधा इ.स. सु. ३४०.
      summary: थॉमसचे शुभवर्तमान हा येशूच्या नावावर सांगितलेल्या वचनांचा संग्रह आहे. त्यात सलग कथानक नाही आणि वाचकांनी या वचनांचा अर्थ शोधावा, असे आवाहन त्यात वारंवार केले आहे.
