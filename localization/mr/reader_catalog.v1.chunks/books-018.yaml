review:
  verdict: revise
  review_summary: पूर्ण मराठी स्थानिकीकरण तपासून सादर केले आहे. काही शीर्षकांतील सूक्ष्म अर्थच्छटा अधिक अचूक केल्या आहेत; सर्व की आणि क्षेत्रे कायम ठेवली आहेत.
  issues:
  - Gospel of Thomas 11 मध्ये “passing”चा अर्थ “नाहीसे होणे” असा अति-विशिष्ट झाला होता.
  - Gospel of Thomas 13 मध्ये मूळ शीर्षकातील ठाम विधानासाठी “ठरू शकतात” हा अनिश्चित अर्थ होता.
  - Gospel of Thomas 17, 28, 37 आणि 43 मध्ये अनुक्रमे “finds,” एकवचन “drunk,” “strip off shame,” आणि एकवचन “disciples’ question” यांचे अर्थ अधिक अचूक केले आहेत.
