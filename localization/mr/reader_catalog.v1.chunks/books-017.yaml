  review_summary: पूर्ण मराठी स्थानिकीकरण परत दिले आहे. काही शीर्षकांतील अर्थदोष, विशेषतः हनोक 84, हनोक 105, 2 बारुख 31, 36, 44 व 65, दुरुस्त केले आहेत; मेटाडेटाही अधिक नैसर्गिक व स्रोताशी सुसंगत केले आहे.
  issues:
  - 1 Enoch 84 मध्ये ‘Blesses’चा अर्थ ‘धन्यवाद देतो’ असा झाला होता; ‘आशीर्वाद देतो’ केला.
  - 1 Enoch 105 मध्ये ‘set before glory’चा अर्थ अधिक अचूक केला.
  - 2 Baruch 31 आणि 46 मध्ये ‘elders’ऐवजी ‘fathers’ असा अर्थ होऊ नये म्हणून ‘वडीलजन’ केले.
  - 2 Baruch 36 मध्ये आरोप करणारा द्राक्षवेल आहे, देवदार नव्हे; कर्ता दुरुस्त केला.
  - 2 Baruch 44 मधील ‘Son Wisdom’ हा संबोधनात्मक घटक स्पष्ट केला.
  - 2 Baruch 65 मध्ये ‘evil reigns darkly’ अधिक निकटपणे अनुवादित केले.
