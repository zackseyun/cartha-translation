      date: सामान्यतः इ.स. दुसऱ्या शतकाच्या उत्तरार्धातील किंवा तिसऱ्या शतकाच्या पूर्वार्धातील मानला जातो; पूर्वीच्या ग्रीक रूपावरून अनुवादित केलेल्या चौथ्या शतकातील कॉप्टिक हस्तलिखितात तो जतन झाला आहे.
