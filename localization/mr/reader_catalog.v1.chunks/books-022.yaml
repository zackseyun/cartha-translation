      author: लेखक अज्ञात. हे शीर्षक हस्तलिखिताच्या अखेरच्या नोंदीत आढळते; मात्र या ग्रंथात फिलिप हा त्याचा लेखक असल्याचे म्हटलेले नाही. सध्या उपलब्ध असलेली एकमेव प्रत नाग हम्मादी कोडेक्स II,3 मधील कॉप्टिक मजकूर आहे.
