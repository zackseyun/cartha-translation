review:
  verdict: revise
  review_summary: संपूर्ण चंक तपासून पूर्ण मराठी मजकूर दिला आहे. काही शीर्षकांतील अर्थछटा अधिक अचूक केल्या आहेत; विशेषतः निर्वासन, अंधारी सत्ये, मुखवटाधारी दुष्टता, आणि मृत्यू/दफन यांबाबत.
  issues:
  - नफताली 7 मध्ये ‘dark truths’चा अर्थ ‘कटू सत्ये’ असा झाला होता; तो ‘अंधारी सत्ये’ असा केला.
  - आशेर 2 मध्ये मूळातील ‘masked wickedness’ अधिक नेमकेपणाने अनुवादित केले.
  - योसेफ 11 व बन्यामीन 12 मधील निर्वासन आणि मृत्यूचे अर्थ अधिक अचूक केले.
  - काही शीर्षकांतील क्रियापदबंध आणि शब्दनिवड स्पष्ट व स्रोताशी सुसंगत केली.
  model_id: gpt-5.6-terra
