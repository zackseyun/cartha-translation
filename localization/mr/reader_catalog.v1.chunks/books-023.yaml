payload:
  book_metadata:
    Gospel of Mary:
      display_name: मरियेचे शुभवर्तमान
      author: लेखक अज्ञात. या ग्रंथात मरियेला येशूच्या प्रकटीकरणाची प्राप्तकर्ती आणि त्याचा अर्थ सांगणारी म्हणून सादर केले आहे; पण सध्या उपलब्ध असलेले शुभवर्तमान मरियेने लिहिले, असा दावा त्यात केलेला नाही.
      audience: प्रकटीकरण, आध्यात्मिक उन्नती, प्रेषितांचा अधिकार आणि येशूच्या शिष्यांमध्ये मरियेच्या शिकवणीची वैधता यांविषयी विचारमंथन करणारे आरंभीचे ख्रिस्ती वाचक.
      date: सामान्यतः इ.स. दुसऱ्या शतकातील मानले जाते; तिसऱ्या शतकातील ग्रीक तुकडे उपलब्ध आहेत आणि त्याची प्रमुख कॉप्टिक प्रत पाचव्या शतकातील बर्लिन कोडेक्स ८५०२ मध्ये जतन झाली आहे.
    Treatise on the Resurrection:
      display_name: पुनरुत्थानावरील प्रबंध
      author: लेखक अज्ञात. हा ग्रंथ एका शिक्षकाने रेगिनोस नावाच्या शिष्याला लिहिलेल्या पत्राच्या रूपात मांडला आहे; त्या शिक्षकाची किंवा रेगिनोसची खात्रीशीर ओळख पटलेली नाही.
      audience: पुनरुत्थानाविषयी मार्गदर्शन शोधणारे ख्रिस्ती, विशेषतः शारीरिक व आध्यात्मिक पुनरुत्थानाचा आणि वर्तमानकाळात पुनरुत्थित जीवनात सहभागी होण्याचा विचार करणारे वाचक.
      date: सामान्यतः इ.स. दुसऱ्या शतकाच्या उत्तरार्धातील (बहुधा सु. १७०–२००) मानला जातो; पूर्वीच्या एका ग्रीक ग्रंथाची चौथ्या शतकातील कॉप्टिक प्रत जतन झाली आहे.
    Dialogue of the Savior:
      display_name: तारणाऱ्याचा संवाद
      author: लेखक अज्ञात. या संवादात यहूदा, मत्तय आणि मरिया यांच्याशी झालेल्या संभाषणात प्रकटीकरणात्मक शिकवण येशूच्या मुखातून दिली आहे; मात्र त्याचा संकलक कोण होता, हे सांगितलेले नाही.
      audience: खासगी प्रकटीकरण, शिष्यत्व, आत्मज्ञान, प्रार्थना आणि तारणासाठीची वैराग्यपूर्ण तयारी यांत रस असलेला आरंभीचा ख्रिस्ती समुदाय.
      date: सामान्यतः इ.स. दुसऱ्या शतकातील मानला जातो; मात्र त्याच्या रचनेतील विविध स्तर आणि नेमका काळ यांविषयी मतभेद कायम आहेत. तो चौथ्या शतकातील एका कॉप्टिक हस्तलिखितात जतन झाला आहे.
    Exegesis on the Soul:
      display_name: आत्म्याचे निरूपण
      author: लेखक अज्ञात. लेखक हा एक ख्रिस्ती प्रवचनकार असून, आत्म्याचे पतन, पश्चात्ताप आणि पुनःस्थापना यांचे रूपक म्हणून तो बायबलमधील आणि ग्रीक साहित्यातील प्रतिमांचे नव्याने वाचन करतो.
      audience: पवित्र शास्त्र आणि नैतिक बोध यांची ओळख असलेले, तसेच अनियंत्रित इच्छांपासून वळून पश्चात्ताप करण्यासाठी आणि दैवी तत्त्वाशी पुन्हा एकरूप होण्यासाठी बोलावले जात असलेले ख्रिस्ती.
      date: सामान्यतः इ.स. दुसऱ्या शतकाच्या उत्तरार्धातील किंवा तिसऱ्या शतकाच्या पूर्वार्धातील मानला जातो; ग्रीक भाषेतून केलेल्या चौथ्या शतकातील कॉप्टिक अनुवादात तो जतन झाला आहे.
    Book of Thomas the Contender:
      display_name: प्रतिस्पर्धी थोमाचे पुस्तक
      author: लेखक अज्ञात. शेवटच्या शीर्षकात हा ग्रंथ यहूदा थोमाशी जोडला आहे आणि नोंदकर्ता म्हणून मथायासचे नाव दिले आहे; पण ही सत्यापित करता येण्यासारखी लेखकत्वाची विधाने नसून साहित्यिक श्रेयारोप आहेत.
      audience: आत्मज्ञान मिळवण्याचा प्रयत्न करावा, शारीरिक वासनांना विरोध करावा आणि थोमाला येशूने खासगीत दिलेली शिकवण समजून घ्यावी, असे आवाहन केलेले वैराग्याभिमुख ख्रिस्ती.
      date: बहुधा इ.स. दुसऱ्या शतकाच्या उत्तरार्धातील किंवा तिसऱ्या शतकाच्या पूर्वार्धातील मानले जाते; कदाचित त्याची पार्श्वभूमी सिरियाई ख्रिस्ती समाजातील असावी. ते चौथ्या शतकातील एका कॉप्टिक हस्तलिखितात जतन झाले आहे.
    Tripartite Tractate:
      display_name: त्रिखंडात्मक प्रबंध
      author: लेखक अज्ञात. लेखक अत्यंत सुशिक्षित व्हॅलेंटिनियन ख्रिस्ती धर्मचिंतक होता; त्याची कोणत्याही नामांकित शिक्षकासोबत खात्रीशीर ओळख पटवता येत नाही.
      audience: देव, युगे, सृष्टी, ख्रिस्त, मंडळी, तारण आणि अंतिम पुनःस्थापना यांविषयी सविस्तर मार्गदर्शन घेणारा व्हॅलेंटिनियन ख्रिस्ती समुदाय.
      date: सामान्यतः इ.स. तिसऱ्या शतकातील मानला जातो; काही मते त्या शतकाच्या उत्तरार्धाचा काळ अधिक संभाव्य मानतात. तो चौथ्या शतकातील युंग कोडेक्समध्ये कॉप्टिक भाषेत जतन झाला आहे.
    Apocryphon of John:
      display_name: योहानचे गुप्त पुस्तक
      author: लेखक अज्ञात. हा ग्रंथ जेबेदीचा पुत्र योहान याला पुनरुत्थित येशूने दिलेले प्रकटीकरण असल्याचे छद्मनामाने सादर करतो आणि त्याच्या एकापेक्षा अधिक प्राचीन आवृत्त्या उपलब्ध आहेत.
      audience: दैवी क्षेत्र, सृष्टी, मानवी अस्मिता आणि वैरी सत्ताधीशांपासून मुक्ती यांचा वृत्तान्त शोधणारे सेथियन किंवा त्याच्याशी जवळून संबंधित प्रकटीकरणात्मक परंपरेतील ख्रिस्ती.
      date: याचे आरंभीचे एखादे रूप बहुधा इ.स. दुसऱ्या शतकात प्रचलित होते; लघु आणि दीर्घ अशा आवृत्त्या जतन करणाऱ्या उपलब्ध कॉप्टिक प्रती चौथ्या व पाचव्या शतकांतील आहेत.
