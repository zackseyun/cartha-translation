payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: फिलिप्पैकरांना पॉलीकार्पचे पत्र
      author: स्मुर्नाचा बिशप पॉलीकार्प. काही विद्वानांच्या मते, उपलब्ध मजकुरात एकाहून अधिक प्रसंगी पाठवलेली सामग्री एकत्र केली आहे.
      audience: फिलिप्पै येथील ख्रिस्ती सभा; तिने इग्नेशियसची पत्रे मागितली होती आणि तिला विश्वास, आचरण, नेतृत्व, पैसा आणि चिकाटी यांविषयी मार्गदर्शन मिळाले.
      date: इ.स. दुसऱ्या शतकाच्या आरंभीचा ते मध्यकाळ; पत्राचा किमान काही भाग इग्नेशियसच्या प्रवासाशी जवळून संबंधित आहे, तर हे पत्र अनेक भागांचे मिळून बनले असल्याचे मानणाऱ्यांच्या मते त्यातील एखादा भाग काहीसा नंतरचा असू शकतो.
    Martyrdom of Polycarp:
      display_name: पॉलीकार्पचे हौतात्म्य
      author: स्मुर्नाच्या मंडळीतील अज्ञात सदस्यांनी समुदायाच्या वतीने लिहिले; शेवटी असलेल्या हस्तांतरणविषयक नोंदी नंतरच्या नकलांची आणि प्रसाराची माहिती देतात.
      audience: फिलोमेलियम येथील मंडळी आणि व्यापक ख्रिस्ती समुदाय; त्यांच्यासाठी पॉलीकार्पची अटक, न्यायचौकशी, मृत्यू आणि त्याची अनुकरणीय सहनशीलता यांचा वृत्तान्त दिला आहे.
      date: पॉलीकार्पच्या मृत्यूनंतर लिहिलेले; सामान्यतः इ.स. दुसऱ्या शतकाच्या मध्यकाळातील किंवा उत्तरार्धातील मानले जाते. मात्र हौतात्म्याचे नेमके वर्ष आणि दस्तऐवजाचे अंतिम स्वरूप या दोन्हींबद्दल मतभेद आहेत.
    Epistle to Diognetus:
      display_name: डायोग्नेटसला पत्र
      author: अज्ञात. लेखक स्वतःला शिष्य किंवा शिकणारा म्हणतो; पण त्याची किंवा ज्याला उद्देशून पत्र लिहिले त्या डायोग्नेटसची निश्चित ओळख पटलेली नाही.
      audience: ख्रिस्ती नसलेला एक सुशिक्षित जिज्ञासू—आणि त्याच्यासारखे वाचक—जे ख्रिस्ती उपासना, नीतिमत्ता, सामाजिक ओळख, प्रेम आणि हा विश्वास नवा का भासतो यांविषयी विचारत होते.
      date: बहुधा इ.स. दुसऱ्या शतकाचा उत्तरार्ध किंवा तिसऱ्या शतकाचा आरंभ असा काळ सांगितला जातो; मात्र मते बरीच भिन्न आहेत. शेवटची दोन प्रकरणे एखाद्या वेगळ्या ग्रंथातून आली असावीत.
    Fragments of Papias:
      display_name: पापियासच्या लिखाणाचे तुकडे
      author: प्रभूच्या वचनांचे स्पष्टीकरण या आता लुप्त झालेल्या पाच खंडांच्या ग्रंथाचा लेखक, हियरापोलिसचा बिशप पापियास. उपलब्ध संग्रहात नंतरच्या लेखकांनी जतन केलेली उद्धरणे आणि वृत्तान्त आहेत.
      audience: येशू आणि प्रेषित यांच्याविषयी स्मरणात राहिलेल्या शिकवणी जाणून घेऊ इच्छिणारे आरंभीचे ख्रिस्ती; ही सामग्री मौखिक साक्ष आणि अर्थनिर्णय यांच्या नावनिशी दिलेल्या साखळ्यांमधून संकलित केली होती.
      date: पापियासचा ग्रंथ सामान्यतः इ.स. दुसऱ्या शतकाच्या आरंभीचा, बहुधा सु. इ.स. ११०–१३० मधील मानला जातो; उपलब्ध तुकडे दुसऱ्या शतकापासून पुढे लेखन करणाऱ्या लेखकांच्या ग्रंथांत आढळतात.
