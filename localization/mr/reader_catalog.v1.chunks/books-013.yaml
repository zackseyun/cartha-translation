    James:
      display_name: याकोब
      author: परंपरेनुसार येशूचा भाऊ याकोब; आधुनिक अभ्यासकांमध्ये हे पत्र खरोखर त्यानेच लिहिले की त्याच्या नावाने दुसऱ्याने लिहिले, याबाबत मतभेद आहेत.
      audience: यहूदी ख्रिस्ती प्रवासी समाजातील मंडळ्या.
      date: खरोखर याकोबने लिहिले असल्यास इ.स.चे सुमारे ५०–६० चे दशक; त्याच्या नावाने दुसऱ्याने लिहिले असल्यास इ.स.च्या पहिल्या शतकाचा उत्तरार्ध.
    1 Peter:
      display_name: १ पेत्र
      author: परंपरेनुसार प्रेषित पेत्राने, सिल्वानाच्या लेखनिक म्हणून साहाय्याने लिहिले; काही अभ्यासकांच्या मते हे पेत्राच्या नावाने दुसऱ्याने लिहिले आहे.
      audience: सामाजिक विरोध सहन करणारे रोमी आशिया मायनरमधील ख्रिस्ती.
      date: पेत्राने लिहिले असल्यास इ.स.चे सुमारे ६० चे दशक; त्याच्या नावाने दुसऱ्याने लिहिले असल्यास इ.स.चे सुमारे ७०–९० चे दशक.
    2 Peter:
      display_name: २ पेत्र
      author: परंपरेनुसार पेत्र; आधुनिक अभ्यासकांमध्ये हे पेत्राच्या नावाने दुसऱ्याने लिहिले असल्याचे मत व्यापक आहे.
      audience: ख्रिस्ताच्या पुनरागमनाला नाकारणाऱ्या थट्टेखोरांचा सामना करणारे ख्रिस्ती.
      date: इ.स.च्या दुसऱ्या शतकाचा साधारण प्रारंभ.
    1 John:
      display_name: १ योहान
      author: लेखक अज्ञात; परंपरेनुसार प्रेषित योहान किंवा योहानी परंपरेतील वडील.
      audience: फूट पडल्यानंतर कोण समुदायाचा भाग आहे हे स्पष्ट करणारा योहानी समुदाय.
      date: इ.स. सुमारे ९०–११०.
    2 John:
