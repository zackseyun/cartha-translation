      audience: ग्रीक तत्त्वज्ञानाशी संवाद साधणारे आणि मूर्तिपूजक व धर्मत्यागी पर्यायांच्या विरोधात इस्राएलच्या ज्ञानपरंपरेचे समर्थन करणारे हेलेनिस्टिक यहूदी.
      date: इ.स.पू. सुमारे ५० ते इ.स. सुमारे ५०.
