      date: सहसा इ.स.च्या दुसऱ्या शतकाच्या आरंभीची, बहुधा सु. इ.स. १०५–११७ दरम्यानची मानली जातात; मात्र इग्नेशियसच्या प्रवासाचा नेमका कालक्रम अद्याप वादग्रस्त आहे.
