    Amos:
      display_name: आमोस
      author: उत्तरेकडे जाऊन संदेश देणारा, यहूदातील तकोवा येथील मेंढपाळ आमोस.
      audience: यरोबाम दुसरा याच्या कारकिर्दीत समृद्धी आणि अन्याय यांचा अनुभव घेणारे उत्तरेकडील इस्राएल.
      date: इ.स.पू. सु. ७६०–७५०.
    Obadiah:
      display_name: ओबद्या
      author: ओबद्या.
      audience: अदोमने यरुशलेमचा विश्वासघात केल्यानंतरचा यहूदा—अदोमच्या पतनाविषयीची भविष्यवाणी.
      date: इ.स.पू. ५८६ नंतर लवकरच.
    Jonah:
      display_name: योना
