  review_summary: पूर्ण मराठी अनुवाद जतन केला आहे. काही शीर्षके स्रोताशी अधिक नेमके जुळावीत म्हणून दुरुस्त केली आहेत, विशेषतः अनुवाद 31–32 आणि यहोशवा 5.
  issues:
  - अनुवाद 31 मधील मसुद्यातील ‘जबाबदारी सोपवतो’ हा स्रोतापेक्षा अधिक स्पष्ट करणारा अर्थ होता; तो संक्षिप्त केला.
  - अनुवाद 32 मध्ये ‘Against’ हा साक्षीचा विरोधात्मक अर्थ गाळला होता; तो पुनर्स्थापित केला.
  - यहोशवा 5 मध्ये स्रोत ‘the Lord's Army’ म्हणतो, तर मसुद्यात ‘सैन्याच्या सेनापतीला’ असे होते; स्रोताशी जुळवले.
