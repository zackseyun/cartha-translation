book_localizations:
- source_title: Genesis
  title: ကမ္ဘာဦးကျမ်း
  author: ရေးသားသူကို အတိအကျ မသိရပါ။ အစဉ်အလာအရ မောရှေရေးသားသည်ဟု ယူဆကြသည်။ ခေတ်သစ်ကျမ်းပညာရှင်များကမူ အရင်းအမြစ်အမျိုးမျိုးကို နောက်ပိုင်းတွင် တည်းဖြတ်ပေါင်းစည်းထားသည့် ရာစုနှစ်များစွာ ကြာမြင့်သော ဖွဲ့စည်းရေးသမိုင်းရှိသည်ဟု ရှုမြင်ကြသည်။
  audience: ဘုရားသခင်၏ ဖန်ဆင်းခြင်း၊ ရွေးကောက်ခြင်းနှင့် ကတိတော်တို့တွင် မိမိတို့လူမျိုး၏ မူလဇာတ်ကြောင်းကို အခြေပြုကာ ပဋိညာဉ်ဆိုင်ရာ ကိုယ်ပိုင်လက္ခဏာကို ခံယူထားသော အစ္စရေးလူမျိုး။
  date: ရာစုနှစ်များစွာအတွင်း ရေးဖွဲ့ခဲ့ပြီး၊ ဘာဗုလုန်ပြည်သို့ ပြည်နှင်ခံရချိန် သို့မဟုတ် ထိုနောက်ပိုင်းဖြစ်သော ခရစ်တော်မပေါ်မီ ၆ ရာစုမှ ၅ ရာစုခန့်တွင် ယနေ့လက်ခံရရှိထားသည့် ပုံစံသို့ ရောက်ရှိခဲ့သည်။
  summary: ကမ္ဘာဦးကျမ်းတွင် ဖန်ဆင်းခြင်း၊ လူသားတို့၏ ပုန်ကန်မှုနှင့် အရပ်ရပ်သို့ ကွဲလွင့်သွားခြင်း၊ ထို့ပြင် အစ္စရေးလူမျိုးအတွက် ဘုရားသခင်၏ ပဋိညာဉ်ကတိတော်များ အစပြုရာ အာဗြဟံ၊ ဣဇာက်၊ ယာကုပ်နှင့် ယောသပ်တို့၏ မိသားစုအကြောင်းကို ပြောပြထားသည်။
- source_title: John
  title: ရှင်ယောဟန်ခရစ်ဝင်
  author: ရေးသားသူကို အတိအကျ မသိရပါ။ အစဉ်အလာအရ တမန်တော်ယောဟန် သို့မဟုတ် “ချစ်တော်မူသောတပည့်တော်” ရေးသားသည်ဟု ယူဆကြသည်။
  audience: တရားဇရပ်ကို ဗဟိုပြုသော ယုဒဘာသာဝင်များနှင့် တင်းမာမှုရှိပြီး၊ ချစ်တော်မူသောတပည့်တော်၏ သက်သေခံချက်ကို အခြေခံ၍ ဖွဲ့စည်းထားသော ခရစ်ယာန်အသိုင်းအဝိုင်း။
  date: ခရစ်နှစ် ၉၀–၁၁၀ ခန့်။
  summary: ရှင်ယောဟန်ခရစ်ဝင်က ယေရှုကို ခမည်းတော်အား ဖော်ပြတော်မူသော ထာဝရနှုတ်ကပတ်တော်၊ ကိုယ်တော်ကို ယုံကြည်ကိုးစားခြင်းအားဖြင့် အသက်ကို ပေးတော်မူသောအရှင်အဖြစ် တင်ပြထားပြီး၊ ကိုယ်တော်၏ နိမိတ်လက္ခဏာများ၊ သေခြင်းနှင့် ရှင်ပြန်ထမြောက်ခြင်းတို့အားဖြင့် ဘုန်းထင်ရှားတော်မူကြောင်း ဖော်ပြထားသည်။
- source_title: Gospel of Thomas
  title: သောမတ်ခရစ်ဝင်
  author: ရေးသားသူကို အတိအကျ မသိရပါ။ အဖွင့်စာပိုဒ်က ဤမိန့်ဆိုချက်စုစည်းမှုကို “ဒိဒုမုစ် ယုဒ သောမတ်” နှင့် ဆက်စပ်ဖော်ပြထားသည်။ အပြည့်အစုံကျန်ရှိသော စာမူမှာ နာဂ်ဟာမာဒီတွင် တွေ့ရှိခဲ့သည့် ၄ ရာစု ကော့ပ်တစ်ဘာသာပြန်ကျမ်း (NHC II,2) တစ်ခုတည်းသာဖြစ်ပြီး၊ အောက်စီရင်ခတ်စ်မှ ဂရိဘာသာ အပိုင်းအစသုံးခုလည်း ကျန်ရှိသည်။
  audience: ဆီးရီးယားဒေသ၏ ဉာဏ်ပညာအစဉ်အလာနှင့် ဂနောစတစ်အကြို အတွေးအခေါ်တို့၏ လွှမ်းမိုးမှုကို ခံရကာ၊ ယေရှု၏ မိန့်ဆိုချက်များမှ လျှို့ဝှက်နက်နဲသော မိမိကိုယ်ကိုသိကျွမ်းမှုကို ရှာဖွေရန် ဦးတည်သည့် ခရစ်ယာန်စာဖတ်ပရိသတ်။
  date: မူရင်းဂရိစာမူသည် ခရစ်နှစ် ၅၀–၁၄၀ ခန့် ဖြစ်နိုင်ပြီး၊ ကော့ပ်တစ်စာမူမှာ ခရစ်နှစ် ၃၄၀ ခန့်ဖြစ်သည်။
  summary: သောမတ်ခရစ်ဝင်သည် ယေရှုမိန့်တော်မူသည်ဟု သတ်မှတ်ထားသော မိန့်ဆိုချက်များကို စုစည်းထားခြင်းဖြစ်သည်။ အစမှအဆုံး ဆက်စပ်နေသော ဇာတ်ကြောင်းမပါဝင်ဘဲ၊ မိန့်ဆိုချက်များ၏ အဓိပ္ပာယ်ကို ရှာဖွေတွေ့ရှိရန် စာဖတ်သူများအား ထပ်တလဲလဲ တိုက်တွန်းထားသည်။
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: ကမ္ဘာဦးကျမ်း ၁:၁
  text: ဘုရားသခင်သည် ကောင်းကင်နှင့် မြေကြီးကို စတင်ဖန်ဆင်းတော်မူသောအခါ[က]—
  translator_note: '[က] အစဉ်အလာဘာသာပြန်ဆိုချက်က ဤစကားကို “အစအဦး၌ ဘုရားသခင်သည် ကောင်းကင်နှင့် မြေကြီးကို ဖန်ဆင်းတော်မူ၏” ဟူသော ပြည့်စုံသည့် ဝါကျအဖြစ် ယူဆသည်။ ဟီဘရူးစာသားအရမူ နောက်တွင်လာမည့် အကြောင်းအရာကို မိတ်ဆက်ပေးသော စကားစုအဖြစ် ယူခြင်းက ပို၍ သဘာဝကျပြီး၊ အဓိကလုပ်ဆောင်ချက်မှာ အခန်းငယ် ၃ ရှိ “ဘုရားသခင် မိန့်တော်မူသည်” ဟူသောအချက်ဖြစ်သည်။'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: ဒေသနာကျမ်း ၁:၂
  text: “အငွေ့တကာ့အငွေ့[က]” ဟု ကိုဟေလက်[ခ] ဆိုသည်။ “အရာခပ်သိမ်းသည် အငွေ့ပင်—ခဏသာတည်ပြီး ဖမ်းဆုပ်မထားနိုင်သည့်အပြင်၊ မျှော်လင့်ထားသည့်အတိုင်းလည်း မကြာခဏ ဖြစ်မလာတတ်။”
  translator_note: '[က] ဟီဘရူးစကားလုံး ‘ဟေဗဲလ်’ (hevel) သည် စာသားအတိုင်းဆိုလျှင် “အသက်ရှူငွေ့” သို့မဟုတ် “အငွေ့” ဟု အဓိပ္ပာယ်ရသည်။ ဒေသနာကျမ်းတစ်လျှောက်တွင် ယင်းစကားလုံးက လျင်မြန်စွာ ပျောက်ကွယ်သွားသောအရာ၊ ဖမ်းဆုပ်၍မရ သို့မဟုတ် အပြည့်အဝ နားလည်၍မရသောအရာနှင့် လူတို့မျှော်လင့်သည့်အတိုင်း မဟုတ်ဘဲ ဖြစ်လာတတ်သောအရာတို့ကို ဖော်ပြသည်။ “အငွေ့” ဟူသောပြန်ဆိုချက်သည် ဘာမျှအဓိပ္ပာယ်မရှိဟု မဆိုဘဲ မူရင်းပုံရိပ်ကို ထိန်းသိမ်းထားသည်။ “အသက်ရှူငွေ့၊” “အသက်ရှူငွေ့မျှသာ” သို့မဟုတ် “ခဏသာတည်သောအရာ” ဟုလည်း ပြန်ဆိုနိုင်သည်။ [ခ] ‘ကိုဟေလက်’ (Qoheleth) သည် စာရေးသူ၏ ဟီဘရူးအမည် သို့မဟုတ် ဘွဲ့အမည်ဖြစ်သည်။ ယင်းကို “ဆရာ” သို့မဟုတ် “တရားဟောဆရာ” ဟု မကြာခဏ ပြန်ဆိုကြသော်လည်း၊ အဓိပ္ပာယ်ဖြစ်နိုင်ခြေအားလုံးကို ထိန်းသိမ်းပြီး အနက်တစ်မျိုးကို ဦးစားမပေးရန် ဤနေရာတွင် ‘ကိုဟေလက်’ ဟု ထားရှိသည်။'
- source_path: nt/john/001/001.yaml
  reference: ရှင်ယောဟန် ၁:၁
  text: အစအဦး၌[ခ] နှုတ်ကပတ်တော်သည် ရှိနှင့်ပြီးဖြစ်သည်။ နှုတ်ကပတ်တော်သည် ဘုရားသခင်နှင့်အတူ ရှိတော်မူပြီး၊ နှုတ်ကပတ်တော်သည် ဘုရားသခင် ဖြစ်တော်မူသည်။[က]
  translator_note: '[က] “နှုတ်ကပတ်တော်သည် ဘုရားသဘောသဘာဝနှင့် ပြည့်စုံသည်” သို့မဟုတ် “ဘုရားသခင်သည် မည်သို့ဖြစ်တော်မူသနည်း၊ နှုတ်ကပတ်တော်လည်း ထိုသို့ဖြစ်တော်မူသည်” ဟုလည်း ပြန်ဆိုနိုင်သည်။ ဂရိစကားအသုံးအနှုန်းက နှုတ်ကပတ်တော်သည် ဘုရားသခင် အပြည့်အဝဖြစ်ကြောင်း အတည်ပြုသကဲ့သို့၊ ရှေ့စကားပိုဒ်တွင် နှုတ်ကပတ်တော်နှင့် ဘုရားသခင်ကိုလည်း ခွဲခြားဖော်ပြထားသည်။ [ခ] ဤအဖွင့်စကားသည် ကမ္ဘာဦးကျမ်း ၁:၁ ကို ပြန်လည်အမှတ်ရစေပြီး နှုတ်ကပတ်တော်ကို ဖန်ဆင်းခြင်း၏ အစအဦးနှင့် ဆက်စပ်ပေးသည်။ “ရှိနှင့်ပြီးဖြစ်သည်” ဟူသောပြန်ဆိုချက်က အစအဦးရောက်လာချိန်တွင် နှုတ်ကပတ်တော် ရှိနေပြီးဖြစ်ကြောင်း၊ ထိုအချိန်မှ စတင်ဖြစ်ပေါ်လာခြင်းမဟုတ်ကြောင်း ဖော်ပြသည်။ “ရှိတော်မူသည်” သို့မဟုတ် “တည်ရှိတော်မူသည်” ဟုလည်း ပြန်ဆိုနိုင်သည်။'
- source_path: nt/romans/003/025.yaml
  reference: ရောမဩဝါဒစာ ၃:၂၅
  text: ဘုရားသခင်သည် သူ့ကို သူ၏အသွေးတော်အားဖြင့် ယုံကြည်ခြင်းဖြင့် အပြစ်ဖြေရာယဇ်[က]အဖြစ် ထားတော်မူခဲ့သည်။ ရှေးက ကျူးလွန်ခဲ့သော အပြစ်များကို အရေးမယူဘဲ ကျော်လွန်ထားတော်မူခဲ့သောကြောင့် မိမိ၏ ဖြောင့်မတ်ခြင်း[ဂ]ကို ထင်ရှားစေရန် ဤသို့ပြုတော်မူခဲ့သည်။
  translator_note: '[က] “အမျက်ပြေစရာ” ဟုလည်း ပြန်ဆိုနိုင်သည်။ သို့မဟုတ် ဓမ္မဟောင်းခေတ်တွင် အပြစ်ဖြေရာအသွေးကို ဖျန်းသော ပဋိညာဉ်သေတ္တာ၏ ရွှေအဖုံးဖြစ်သည့် “ကရုဏာပလ္လင်” ကို ရည်ညွှန်းနိုင်သည်။ [ခ] “ယုံကြည်ခြင်းအားဖြင့်၊ သူ၏အသွေးတော်ကြောင့်” ဟုလည်း ဖတ်ရှုနိုင်သည်။ [ဂ] “တရားမျှတခြင်း” ဟုလည်း ပြန်ဆိုနိုင်သည်။'
- source_path: nt/1_peter/001/013.yaml
  reference: ရှင်ပေတရုဩဝါဒစာပထမစောင် ၁:၁၃
  text: ထို့ကြောင့် လုပ်ဆောင်ရန် သင်တို့၏စိတ်ကို အသင့်ပြင်ကြလော့။[က] လုံးလုံးလျားလျား သတိကြည်လင်လျက်၊ ယေရှုမေရှိယ ပေါ်ထွန်းတော်မူသောအခါ သင်တို့ထံ ယူဆောင်လာလျက်ရှိသော ကျေးဇူးတော်ကို အပြည့်အဝ မျှော်လင့်ကြလော့။[ခ]
  translator_note: '[က] ဂရိစာသားအတိုင်းဆိုလျှင် “သင်တို့စိတ်၏ ခါးကို စည်းကြလော့” ဟု ဆိုသည်။ ယင်းသည် လုပ်ဆောင်ရန် အသင့်ဖြစ်စေရန် ဝတ်ရုံရှည်ကို ခါးပတ်လည်တွင် စုစည်းချည်နှောင်သည့် ပုံရိပ်ဖြစ်ပြီး၊ စိတ်ကို ကြိုတင်ပြင်ဆင်ကာ လုပ်ဆောင်ရန် အသင့်ရှိခြင်းကို ဆိုလိုသည်။ [ခ] “အပြည့်အဝ” ဟုပြန်ဆိုထားသော ဂရိစကားလုံးသည် သတိကြည်လင်ခြင်းနှင့် သက်ဆိုင်နိုင်သည်၊ မျှော်လင့်ခြင်းနှင့် သက်ဆိုင်နိုင်သည်၊ သို့မဟုတ် နှစ်ခုလုံးနှင့် သက်ဆိုင်နိုင်သည်။'
