payload:
  book_metadata:
    Ezra:
      display_name: ဧဇရ
      author: ရေးသားသူအမည် မသိရပါ။ ရာဇဝင်ချုပ်ကျမ်းများကို ရေးသားသူနှင့် တစ်ဦးတည်း ဖြစ်နိုင်သည်။
      audience: ပါရှားအုပ်ချုပ်မှုအောက်တွင် ယေရုရှလင်မြို့ကို ပြန်လည်တည်ဆောက်နေသော ပြည်တော်ပြန်များ။
      date: ခန့်မှန်းခြေ ဘီစီ ၅ ရာစုအလယ်ပိုင်းမှ ၄ ရာစုအတွင်း။
    Nehemiah:
      display_name: နေဟမိ
      author: ရေးသားသူအမည် မသိရပါ။ နေဟမိရေးသားသည်ဟု ယူဆရသော ပထမပုဂ္ဂိုလ် ကိုယ်တွေ့မှတ်တမ်းတစ်ခု ပါဝင်သည်။
      audience: ပါရှားအုပ်ချုပ်မှုအောက်တွင် ယေရုရှလင်မြို့ရိုးများကို ပြန်လည်တည်ဆောက်၍ ပဋိညာဉ်ကို အသစ်ပြန်လည်ခိုင်မြဲစေသော ပြည်တော်ပြန်များ။
      date: ခန့်မှန်းခြေ ဘီစီ ၅ ရာစုအလယ်ပိုင်းမှ ၄ ရာစုအတွင်း။
    Esther:
      display_name: ဧသတာ
      author: ရေးသားသူအမည် မသိရပါ။
      audience: တိုင်းတစ်ပါးအုပ်ချုပ်မှုအောက်တွင် ပြန့်ကျဲနေထိုင်ကြသော ဂျူးလူမျိုးများ၊ အထူးသဖြင့် ပါရှားပြည်ရှိ ဂျူးများ။
      date: ခန့်မှန်းခြေ ပါရှားခေတ်နှောင်းပိုင်း သို့မဟုတ် ဟေလေနစ်ခေတ်အစောပိုင်း (ဘီစီ ၄–၃ ရာစု)။
    Job:
      display_name: ယောဘ
      author: ရေးသားသူအမည် မသိရပါ။
      audience: အပြစ်မဲ့သူ၏ ဆင်းရဲဒုက္ခနှင့် ဘုရားသခင်၏ တရားမျှတမှုကို နားလည်ရန် ရုန်းကန်နေကြသော အစ္စရေးလူမျိုးများ။
      date: ပညာကျမ်းအစဉ်အလာဆိုင်ရာ ပညာရှင်အများစု၏ ယူဆချက်အရ ဤကျမ်းကို ပိုရှေးကျသော ရိုးရာပုံပြင်အကြောင်းအရာများအပေါ် အခြေခံလျက် ခန့်မှန်းခြေ ဘီစီ ၆–၄ ရာစုအတွင်းဟု သတ်မှတ်ကြသည်။
    Psalms:
      display_name: ဆာလံကျမ်း
      author: ရာစုနှစ်များတစ်လျှောက် စာရေးသူများစွာက ရေးသားခဲ့ကြသည်။ ကျမ်းခေါင်းစဉ်များတွင် ဒါဝိဒ်၊ အာသပ်၊ ကောရသားများ၊ ရှောလမုန်၊ မောရှေနှင့် အခြားသူများ၏ အမည်များကို ဖော်ပြထားသည်။
      audience: ဝတ်ပြုကိုးကွယ်သော အစ္စရေးလူမျိုးနှင့် ဗိမာန်တော်ပရိသတ်၊ ထို့ပြင် နောက်ပိုင်းခေတ်တိုင်းတွင် ဆုတောင်း၍ ငိုကြွေးမြည်တမ်းသော လူမှုအသိုင်းအဝိုင်းအားလုံး။
      date: ခန့်မှန်းခြေ ဘီစီ ၁၀–၃ ရာစုအတွင်း ရေးစပ်ခဲ့ပြီး ပြည်နှင်ဒဏ်ခံရပြီးနောက်ခေတ်တွင် နောက်ဆုံးစုစည်းခဲ့သည်။
  chapter_titles:
    2 Chronicles:
      '20':
        title: ရန်သူများအပေါ် ယုဒပြည် အောင်ပွဲခံခြင်း
      '21':
        title: ယောရံက ညီအစ်ကိုများကို သတ်ဖြတ်ခြင်း
      '22':
        title: အာခဇိသည် ဆိုးယုတ်သောလမ်းကို လိုက်ခြင်း
      '23':
        title: ယောရှကို ရှင်ဘုရင်အဖြစ် ပြန်လည်တင်မြှောက်ခြင်း
      '24':
        title: ဗိမာန်တော်ကို ပြုပြင်ပြီးနောက် ဆုတ်ယုတ်ခြင်း
      '25':
        title: အာမဇိက ဧဒုံပြည်ကို အနိုင်ယူခြင်း
      '26':
        title: ဩဇိ၏ ကြီးပွားချမ်းသာမှု အဆုံးသတ်ခြင်း
      '27':
        title: ယောသံက ယုဒပြည်ကို အင်အားခိုင်မာစေခြင်း
      '28':
        title: အာခတ်၏ အလွန်ကြီးမားသော သစ္စာမဲ့မှု
      '29':
        title: ဟေဇကိက ဗိမာန်တော်ကို ပြန်လည်ဖွင့်လှစ်ခြင်း
      '30':
        title: အစ္စရေးလူအပေါင်းတို့ ပသခါပွဲ ကျင်းပခြင်း
      '31':
        title: ဟေဇကိက ဗိမာန်တော်ဘဏ္ဍာခန်းများကို ဖြည့်ဆည်းခြင်း
      '32':
        title: ကောင်းကင်တမန်၏ တန်ခိုးဖြင့် ယေရုရှလင်မြို့ ကယ်တင်ခံရခြင်း
      '33':
        title: မနာရှေ နောင်တရ၍ ယဇ်ပလ္လင်ကို ပြန်လည်ပြုပြင်ခြင်း
      '34':
        title: ယောရှိက ပညတ်ကျမ်းကို တွေ့ရှိ၍ ဖတ်ခြင်း
      '35':
        title: ယောရှိက ကြီးကျယ်သော ပသခါပွဲကို ဦးဆောင်ခြင်း
      '36':
        title: ယုဒပြည် ဗာဗုလုန်အာဏာအောက် ကျရောက်ခြင်း
    Ezra:
      '1':
        title: ကုရုမင်းက ဗိမာန်တော် ပြန်လည်တည်ဆောက်ခွင့်ပြုခြင်း
      '2':
        title: ဧဇရက ပြည်နှင်ခံရသူများနှင့်အတူ ပြန်လာခြင်း
      '3':
        title: ကြောက်ရွံ့မှုကြားမှ ယေရုရှလင်မြို့တွင် ယဇ်ပလ္လင်ကို ပြန်လည်တည်ဆောက်ခြင်း
      '4':
        title: ရန်သူများက ဗိမာန်တော် ပြန်လည်တည်ဆောက်မှုကို ရပ်တန့်စေခြင်း
      '5':
        title: ဘုရားသခင်က ဗိမာန်တော် ပြန်လည်တည်ဆောက်မှုကို လမ်းပြခြင်း
      '6':
        title: ဒါရိမင်းက ဗိမာန်တော်တည်ဆောက်မှု ပြန်စေရန် အမိန့်ပေးခြင်း
      '7':
        title: ဧဇရက ဘုရားသခင်၏ ပညတ်တရားကို သွန်သင်ခြင်း
      '8':
        title: ဧဇရ ဆုတောင်း၍ ဘေးကင်းစွာ ပြန်လာခြင်း
      '9':
        title: အစ္စရေးလူတို့၏ အပြစ်ရှိသော အိမ်ထောင်ရေးများကြောင့် ဧဇရ ဝမ်းနည်းခြင်း
      '10':
        title: အပြစ်ရှိသော အိမ်ထောင်ရေးများကို ဧဇရ ရင်ဆိုင်ဖြေရှင်းခြင်း
    Nehemiah:
      '1':
        title: နေဟမိက ယေရုရှလင်မြို့အတွက် ဆုတောင်းခြင်း
      '2':
        title: ရှင်ဘုရင်က ပြန်လည်တည်ဆောက်ရန် နေဟမိကို စေလွှတ်ခြင်း
      '3':
        title: ယေရုရှလင်မြို့ရိုးကို အားလုံးအတူ တည်ဆောက်ခြင်း
      '4':
        title: နေဟမိက ယေရုရှလင်မြို့ကို ကာကွယ်ခြင်း
      '5':
        title: နေဟမိက လူမှုရေးမတရားမှုကို တိုက်ဖျက်ခြင်း
      '6':
        title: ဘုရားသခင်၏ အမှုကို ရန်သူများ မတားဆီးနိုင်ခြင်း
      '7':
        title: မြို့စောင့်များနှင့် ပြည်သူများကို စာရင်းပြုစုခြင်း
      '8':
        title: ဧဇရ ပညတ်ကျမ်းဖတ်စဉ် လူတို့ ငိုကြွေးခြင်း
      '9':
        title: အစ္စရေးလူတို့က ဘုရားသခင်ရှေ့တွင် အပြစ်များကို ဝန်ခံခြင်း
      '10':
        title: လူတို့က ဘုရားသခင်နှင့် ပဋိညာဉ်ပြုခြင်း
      '11':
        title: ခေါင်းဆောင်များက သန့်ရှင်းသောမြို့တွင် လူများနေထိုင်စေခြင်း
      '12':
        title: မြို့ရိုးဆက်ကပ်ပွဲကို ဝတ်ပြုကိုးကွယ်၍ ကျင်းပခြင်း
      '13':
        title: နေဟမိက ဗိမာန်တော်ကို ထပ်မံသန့်စင်ခြင်း
    Esther:
      '1':
        title: ရှင်ဘုရင်က မိဖုရားဝါရှတိကို နှင်ထုတ်ခြင်း
      '2':
        title: ဧသတာ မိဖုရားသစ် ဖြစ်လာခြင်း
      '3':
        title: ဟာမန်က ဂျူးလူမျိုးများကို ဖျက်ဆီးရန် ကြံစည်ခြင်း
      '4':
        title: မော်ဒကဲက ဧသတာအား လုပ်ဆောင်ရန် တိုက်တွန်းခြင်း
      '5':
        title: ဧသတာက ရှင်ဘုရင်နှင့် ဟာမန်ကို ဖိတ်ခေါ်ခြင်း
      '6':
        title: ရှင်ဘုရင်က မော်ဒကဲကို လူသိရှင်ကြား ဂုဏ်ပြုခြင်း
      '7':
        title: ဧသတာက ဟာမန်၏ အကြံအစည်ကို ဖော်ထုတ်ခြင်း
      '8':
        title: မော်ဒကဲက ဟာမန်၏ အာဏာနေရာကို ဆက်ခံခြင်း
      '9':
        title: ဂျူးလူမျိုးများ အောင်မြင်စွာ ခုခံကာကွယ်ခြင်း
      '10':
        title: မော်ဒကဲက ပညာရှိစွာ ကောင်းမွန်စွာ အုပ်ချုပ်ခြင်း
    Job:
      '1':
        title: ယောဘ အရာအားလုံးဆုံးရှုံးသော်လည်း ဝတ်ပြုကိုးကွယ်ခြင်း
      '2':
        title: ယောဘက ဆင်းရဲဒုက္ခကို သစ္စာရှိစွာ ခံရပ်ခြင်း
      '3':
        title: ယောဘက မိမိမွေးဖွားသောနေ့ကို ကျိန်ဆဲခြင်း
      '4':
        title: ဧလိဖတ်က ယောဘအား မျိုးစေ့ကြဲခြင်းအကြောင်း ဆုံးမခြင်း
      '5':
        title: ဘုရားသခင်ကို ရှာရန် ယောဘအား ဧလိဖတ် အကြံပေးခြင်း
      '6':
        title: ယောဘက မိမိ၏ လေးလံသောဝန်ကို ဖော်ပြခြင်း
      '7':
        title: ယောဘက ဆင်းရဲဒုက္ခအကြောင်း ညည်းညူခြင်း
      '8':
        title: ယောဘ၏ ဆင်းရဲဒုက္ခနှင့်ပတ်သက်၍ ဗိလဒဒ် ဆုံးမခြင်း
      '9':
        title: ဘုရားသခင်၏ တန်ခိုးကြောင့် ယောဘ ငိုကြွေးခြင်း
      '10':
        title: အဘယ်ကြောင့် အကျွန်ုပ်ကို ဆန့်ကျင်တော်မူသနည်းဟု ယောဘ မေးခြင်း
      '11':
        title: ဇောဖာက ယောဘကို ပညာစကားဖြင့် ဆုံးမခြင်း
      '12':
        title: မိတ်ဆွေတို့၏ အနှစ်မဲ့စကားများကို ယောဘ သရော်ခြင်း
      '13':
        title: ယောဘက ဘုရားသခင်ရှေ့တွင် အမှန်တရားကို ပြောခြင်း
      '14':
        title: လူ့အသက်၏ မခိုင်မြဲမှုကြောင့် ယောဘ ငိုကြွေးခြင်း
      '15':
        title: ဧလိဖတ်က ယောဘကို အပြစ်ရှိသည်ဟု စွပ်စွဲခြင်း
      '16':
