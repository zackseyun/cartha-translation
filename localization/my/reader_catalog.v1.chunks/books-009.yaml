payload:
  book_metadata:
    Lamentations:
      display_name: မြည်တမ်းစကား
      author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ ယေရမိရေးသားသည်ဟု ယူဆကြသည်။
      audience: ခရစ်တော်မပေါ်မီ ၅၈၆ ခုနှစ်တွင် ယေရုရှလင်မြို့ ဖျက်ဆီးခံရမှုကြောင့် ဝမ်းနည်းပူဆွေးနေသော ယုဒပြည်သားများ။
      date: ခရစ်တော်မပေါ်မီ ၅၈၆ ခုနှစ်နောက် မကြာမီ။
    Ezekiel:
      display_name: ယေဇကျေလ
      author: ဗာဗုလုန်ပြည်သို့ ပြည်နှင်ခံရသော ယဇ်ပုရောဟိတ် ယေဇကျေလ။ နောက်ပိုင်းတွင် တည်းဖြတ်ဖွဲ့စည်းမှုများလည်း ရှိခဲ့သည်။
      audience: ဗိမာန်တော်နှင့် ဝေးကွာနေချိန်တွင် ဘုရားသခင်၏ မျက်မှောက်တော်ကို နည်းသစ်ဖြင့် နားလည်လာသော ဗာဗုလုန်ပြည်ရောက် ယုဒပြည်သားများ။
      date: ပရောဖက်အဖြစ် အမှုဆောင်ခဲ့သည့်ကာလမှာ ခရစ်တော်မပေါ်မီ ၅၉၃–၅၇၁ ခုနှစ်ခန့်ဖြစ်ပြီး၊ နောက်ဆုံးပုံစံမှာ ထိုထက် အနည်းငယ် နောက်ကျနိုင်သည်။
    Daniel:
      display_name: ဒံယေလ
      author: ရေးသားသူအမည် မသိရပါ။ ပြည်နှင်ခံကာလမှ ဒံယေလ၏ စာအဖြစ် တင်ပြထားသည်။
      audience: ဟေလေနစ်ခေတ်တွင် ညှဉ်းပန်းနှိပ်စက်ခံနေရသော ဂျူးလူမျိုးများ—အထူးသဖြင့် အန္တိအုတ် ၄ အက်ပီဖာနက် လက်ထက် (ခရစ်တော်မပေါ်မီ ၁၆၇–၁၆၄ ခုနှစ်) မှ လူများ။
      date: လက်ခံရရှိထားသည့် ပုံစံသို့ ခရစ်တော်မပေါ်မီ ၁၆၅ ခုနှစ်ခန့်တွင် ရောက်ရှိခဲ့သည်။ အခန်း ၁–၆ တွင် ပိုမိုရှေးကျသော နန်းတွင်းဇာတ်လမ်းများ ပါဝင်သည်။
    Hosea:
      display_name: ဟောရှေ
      author: ဗေရိ၏သား ဟောရှေ။
      audience: အာရှုရိတို့ မသိမ်းပိုက်မီ နောက်ဆုံးဆယ်စုနှစ်များအတွင်းရှိ မြောက်ပိုင်းဣသရေလနိုင်ငံ။
      date: ခရစ်တော်မပေါ်မီ ၇၅၀–၇၂၂ ခုနှစ်ခန့်။
  chapter_titles:
    Jeremiah:
      '33':
        title: ပျက်စီးနေသောမြို့အတွက် ပြန်လည်ကျန်းမာစေမည်ဟု ကတိပေးခြင်း
      '34':
        title: ဇေဒကိမင်းအား တရားစီရင်ချက်နှင့် သတိပေးချက်
      '35':
        title: ရေခပ်အမျိုးသားတို့ သစ္စာရှိစွာ နာခံခြင်း
      '36':
        title: ဗာရုတ်က သတိပေးချက်ပါသော စာလိပ်ကို ရေးသားခြင်း
      '37':
        title: ယေရမိက ဇေဒကိမင်းကို သတိပေးခြင်း
      '38':
        title: ယေရမိကို ရေတွင်းထဲ ပစ်ချခြင်း
      '39':
        title: ဧဗက်မေလက်က ယေရမိကို ကယ်တင်ခြင်း
      '40':
        title: ယေရုရှလင်ကျဆုံးပြီးနောက် ယေရမိ လွတ်မြောက်ခြင်း
      '41':
        title: ဣရှမေလက ဂေဒလိကို လှည့်စားသတ်ဖြတ်ခြင်း
      '42':
        title: အီဂျစ်ပြည်သို့ မပြေးကြရန် ယေရမိ သတိပေးခြင်း
      '43':
        title: ပုန်ကန်သူတို့က ယေရမိကို အီဂျစ်ပြည်သို့ အတင်းခေါ်ဆောင်ခြင်း
      '44':
        title: ဘုရားသခင်၏ အမိန့်တော်ကို မနာခံရန် ငြင်းဆန်ခြင်း
      '45':
        title: ဝမ်းနည်းပူဆွေးမှုကြောင့် ဗာရုတ် အားကုန်နွမ်းနယ်ခြင်း
      '46':
        title: မာနကြီးသော အီဂျစ်အင်ပါယာကို ဘုရားသခင် တရားစီရင်ခြင်း
      '47':
        title: ဖိလိတ္တိလူတို့ မတားဆီးနိုင်သော ရေလွှမ်းမိုးမှုကို ရင်ဆိုင်ရခြင်း
      '48':
        title: မောဘပြည် ပျက်စီးခြင်းနှင့် အနာဂတ်မျှော်လင့်ချက်
      '49':
        title: ယုဒပြည်ဝန်းကျင် လူမျိုးများအပေါ် တရားစီရင်ခြင်း
      '50':
        title: ဗာဗုလုန်ကျဆုံး၍ ဘုရားသခင် အောင်နိုင်ခြင်း
      '51':
        title: ဘုရားသခင်၏ တရားစီရင်မှုကြောင့် ဗာဗုလုန်ကျဆုံးခြင်း
      '52':
        title: ယေရုရှလင်ကျဆုံး၍ ဗိမာန်တော် မီးရှို့ခံရခြင်း
    Lamentations:
      '1':
        title: စွန့်ပစ်ခံရသော ယေရုရှလင် တစ်ကိုယ်တည်း ငိုကြွေးခြင်း
      '2':
        title: ထာဝရဘုရားက ဇိအုန်အပေါ် အမျက်တော် သွန်းလောင်းခြင်း
      '3':
        title: နံနက်တိုင်းရသော ကရုဏာတော်မှ မျှော်လင့်ခြင်း ပေါက်ဖွားလာခြင်း
      '4':
        title: အဖိုးတန်ဇိအုန် ပျက်စီး၍ ငတ်မွတ်ခြင်း
      '5':
        title: အို ထာဝရဘုရား၊ ကြားတော်မူပါဟု လူတို့ အော်ဟစ်ခြင်း
    Ezekiel:
      '1':
        title: ယေဇကျေလ ကောင်းကင်ဆိုင်ရာ ရူပါရုံကို မြင်ခြင်း
      '2':
        title: ယေဇကျေလ ဘုရားသခင်၏ တာဝန်ပေးခြင်းကို ခံယူရခြင်း
      '3':
        title: ယေဇကျေလ မြည်တမ်းစကားပါသော စာလိပ်ကို စားခြင်း
      '4':
        title: ယေဇကျေလက ယေရုရှလင်ဝိုင်းရံခံရမှုကို သရုပ်ဖော်ခြင်း
      '5':
        title: ယေဇကျေလက ဆံပင်ရိတ်၍ အမှတ်လက္ခဏာပြခြင်း
      '6':
        title: ယေဇကျေလက ဣသရေလကို ဆန့်ကျင်၍ ပရောဖက်ပြုခြင်း
      '7':
        title: ဘုရားသခင်က ရောက်လာမည့် တရားစီရင်မှုကို ကြေညာခြင်း
      '8':
        title: ယေဇကျေလက ဗိမာန်တော်ထဲမှ စက်ဆုပ်ဖွယ်အမှုများကို မြင်ခြင်း
      '9':
        title: သုတ်သင်သူတို့က ယေရုရှလင်၏ အပြစ်ကို တရားစီရင်ခြင်း
      '10':
        title: ဘုန်းတော်က တရားစီရင်ခြင်း၏ မီးခဲများကို ဖြန့်ကြဲခြင်း
      '11':
        title: ယေဇကျေလက မြို့ပျက်စီးမည့်အကြောင်း ပရောဖက်ပြုခြင်း
      '12':
        title: ယေဇကျေလက ပြည်နှင်ခံရမှုကို သရုပ်ဖော်ခြင်း
      '13':
        title: ယေဇကျေလက မိစ္ဆာပရောဖက်များကို ပြစ်တင်ရှုတ်ချခြင်း
      '14':
        title: ဘုရားသခင်က ဣသရေလ၏ သစ္စာဖောက်မှုကို တရားစီရင်ခြင်း
      '15':
        title: ယေရုရှလင်ကို အသုံးမဝင်သော စပျစ်နွယ်ပင်နှင့် နှိုင်းယှဉ်ခြင်း
      '16':
        title: ဘုရားသခင်က ယေရုရှလင်၏ သစ္စာမဲ့မှုအတွက် မြည်တမ်းခြင်း
      '17':
        title: လင်းယုန်များအကြောင်း ယေဇကျေလ၏ ပဟေဠိ
      '18':
        title: ဘုရားသခင်က လူတစ်ဦးစီကို တရားစီရင်ခြင်း
      '19':
        title: ဣသရေလမင်းသားများ ကျဆုံး၍ မအောင်မြင်ခြင်း
      '20':
        title: ဘုရားသခင်က ဣသရေလ၏ ပုန်ကန်သောအတိတ်ကို ပြန်လည်ဖော်ပြခြင်း
      '21':
        title: တရားစီရင်ခြင်းဓားသည် လူမျိုးများထံ ရောက်လာခြင်း
      '22':
        title: ယေရုရှလင်သည် သွေးစွန်းသောမြို့ဖြစ်ကြောင်း ဖော်ထုတ်ခြင်း
      '23':
        title: ရုပ်တုများနောက် တပ်မက်လိုက်စားသော ညီအစ်မနှစ်ဦး
      '24':
        title: ယေဇကျေလ၏ ဇနီးကို အမှတ်လက္ခဏာအဖြစ် သိမ်းယူခြင်း
      '25':
        title: ယုဒပြည်ဝန်းကျင် လူမျိုးများ တရားစီရင်ခြင်းခံရခြင်း
      '26':
        title: တုရုမြို့ ဝမ်းမြောက်ခဲ့သောကြောင့် ဘုရားသခင် တရားစီရင်ခြင်း
      '27':
        title: ခမ်းနားသော တုရုမြို့အတွက် ဈာပနသီချင်း
      '28':
        title: ယေဇကျေလက တုရုမင်းကို ရင်ဆိုင်ပြောဆိုခြင်း
      '29':
        title: ဖာရောဘုရင်၏ မာနကြောင့် အီဂျစ်ပြည် ကျဆုံးခြင်း
      '30':
        title: ဖာရောဘုရင်၏ တန်ခိုးအာဏာ ဖယ်ရှားခံရခြင်း
      '31':
        title: အာရှုရိကျဆုံးခြင်းက ဖာရောဘုရင်ကို သတိပေးခြင်း
      '32':
        title: ဖာရောဘုရင် ဗာဗုလုန်လက်ချက်ဖြင့် ကျဆုံးခြင်း
      '33':
        title: ကင်းစောင့် ယေဇကျေလက ဆိုးယုတ်သူတို့ကို သတိပေးခြင်း
      '34':
        title: သိုးထိန်းတို့ ပျက်ကွက်သော်လည်း ဘုရားသခင် ကိုယ်တိုင် ထိန်းကျောင်းမည်
      '35':
        title: ဧဒုံ၏ မုန်းတီးမှုကြောင့် မကြာမီ ပျက်စီးခြင်း ရောက်လာမည်
      '36':
        title: ဣသရေလ ပြန်လည်ထူထောင်၍ တောင်များ သီးပွင့်ခြင်း
      '37':
        title: အရိုးခြောက်တို့ အသက်ရှင်၍ လူမျိုး ပြန်လည်ပေါင်းစည်းခြင်း
      '38':
        title: ဂေါဂက ဣသရေလကို တိုက်ခိုက်သော်လည်း သန့်ရှင်းတော်မူသော ဘုရား ကာကွယ်ခြင်း
      '39':
        title: ဂေါဂ ပျက်စီး၍ လူမျိုးတို့ ထာဝရဘုရားကို သိလာခြင်း
      '40':
        title: မြင့်သောတောင်ပေါ်တွင် တိုင်းတာခြင်းဖြင့် ရူပါရုံ စတင်ခြင်း
      '41':
        title: ဗိမာန်တော်အတွင်းပိုင်းကို တိုင်းတာ၍ သန့်ရှင်းသော ဘုန်းတော် ထင်ရှားခြင်း
      '42':
        title: ယဇ်ပုရောဟိတ်အခန်းများကို တိုင်းတာ၍ သီးသန့်ထားခြင်း
      '43':
        title: ဘုန်းတော် ပြန်ကြွလာ၍ ဗိမာန်တော် သန့်ရှင်းခြင်းနှင့် ပြည့်ဝခြင်း
      '44':
        title: ယေဇကျေလက ပိတ်ထားသော တံခါးကို မြင်ခြင်း
