payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: အာခွန်တို့၏ ဖြစ်တည်မှု
      author: အမည်မသိ။ စာရေးသူသည် ကမ္ဘာဦးကျမ်းကို အာခွန်တို့အကြောင်း ဗျာဒိတ်ဆန်သော ဒဏ္ဍာရီတစ်ရပ်ဖြင့် အနက်ဖွင့်ထားသည်။ ဤစာကို အမည်တပ်နိုင်သော ဆရာတစ်ဦးဦး ရေးသားသည်ဟု ခိုင်လုံစွာ သတ်မှတ်၍မရပါ။
      audience: ကမ္ဘာဦးကျမ်းကို မသိနားမလည်သော စကြဝဠာအုပ်စိုးသူများ၊ ဘုရားသခင်နှင့်ဆိုင်သော ဉာဏ်ပညာနှင့် လူသားတို့၏ ဝိညာဉ်ရေးမူလအစတို့ကြား ပဋိပက္ခအဖြစ် ဖတ်ရှုသည့် ဆေသီယန် သို့မဟုတ် ဆက်နွှယ်ရာ အသိုင်းအဝိုင်းမှ ခရစ်ယာန်များ။
      date: ခရစ်နှစ် ၃ ရာစုဝန်းကျင်ဟု ယေဘုယျအားဖြင့် ယူဆကြသည်။ နာဂ်ဟာမာဒီ ကိုဒက်စ် ၂ ထဲရှိ ခရစ်နှစ် ၄ ရာစု ကော့ပ်တစ်မိတ္တူတစ်စောင်တွင် ထိန်းသိမ်းကျန်ရစ်သည်။
    On the Origin of the World:
      display_name: ကမ္ဘာလောက၏ မူလအစအကြောင်း
      author: အမည်မသိ။ ဤစာသည် ဂျူး၊ ခရစ်ယာန်၊ ပလေတိုဝါဒနှင့် ဒဏ္ဍာရီဆိုင်ရာ အစဉ်အလာအမျိုးမျိုးကို ပေါင်းစပ်ပြင်ဆင်ထားသော်လည်း စုစည်းသူ၏အမည်ကို မဖော်ပြပါ။
      audience: ဖန်ဆင်းခြင်း၊ စကြဝဠာအုပ်စိုးသူများ၊ ဆိုဖီယာ၊ အာဒံနှင့် ဧဝ၊ ထို့ပြင် ကမ္ဘာလောက၏ နောက်ဆုံးကြမ္မာတို့နှင့်ပတ်သက်သော သမားရိုးကျမဟုတ်သည့် သမိုင်းအမြင်ကို ရှာဖွေသော နောစတစ်ဆန်သည့် ခရစ်ယာန်ပတ်ဝန်းကျင်မှ စာဖတ်သူများ။
      date: အစောပိုင်း အကြောင်းအရာများကို အခြေခံထားနိုင်သော်လည်း ခရစ်နှစ် ၃ ရာစုက စာဟု ယေဘုယျအားဖြင့် သတ်မှတ်ကြသည်။ အဓိကအားဖြင့် ခရစ်နှစ် ၄ ရာစုမှ ကော့ပ်တစ်စာမူအထောက်အထားများ၌ ထိန်းသိမ်းကျန်ရစ်သည်။
    Sophia of Jesus Christ:
      display_name: ယေရှုခရစ်၏ ဉာဏ်ပညာ
      author: အမည်မသိ။ စာရေးသူသည် ယူဂနော့စတောစ်စာမှလည်း သိရှိရသော အကြောင်းအရာကို ယေရှုနှင့် တပည့်တော်များကြား ရှင်ပြန်ထမြောက်ပြီးနောက် ဆွေးနွေးခန်းအဖြစ် ပြောင်းလဲရေးသားထားသည်။
      audience: အရာခပ်သိမ်းကို ကျော်လွန်သော ဘုရားသခင်၊ ကောင်းကင်လောက၏ အစီအစဉ်နှင့် ဝိညာဉ်၏ မူလအစနှင့် ကယ်တင်ခြင်းတို့ဆိုင်ရာ ဖွင့်ပြသော ဉာဏ်ပညာကို စိတ်ဝင်စားသည့် ခရစ်ယာန်များ။
      date: ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုဟု မကြာခဏ သတ်မှတ်ကြသည်။ နာဂ်ဟာမာဒီနှင့် ဘာလင် ကိုဒက်စ်တို့မှ ကော့ပ်တစ်မိတ္တူများ၌ ထိန်းသိမ်းကျန်ရစ်သည်။
    Gospel of the Egyptians:
      display_name: အီဂျစ်လူမျိုးတို့၏ ဧဝံဂေလိကျမ်း
      author: အမည်မသိ။ မဟာမမြင်နိုင်သော ဝိညာဉ်တော်၏ သန့်ရှင်းသောကျမ်းဟုလည်း ခေါ်သော ဤနာဂ်ဟာမာဒီစာသည် ကိုးကားချက်များမှသာ သိရသည့် အစောပိုင်း ဂရိဘာသာ အီဂျစ်လူမျိုးတို့၏ ဧဝံဂေလိကျမ်းနှင့် မတူသော စာဖြစ်သည်။
      audience: ဝိညာဉ်ရေးကိုယ်ပိုင်လက္ခဏာနှင့် လွတ်မြောက်ခြင်းကို ဖော်ပြရန် အဓိပ္ပာယ်သိပ်သည်းသော ဒဏ္ဍာရီ၊ မြင့်မြတ်သည့်နာမတော်များ၊ ဗတ္တိဇံဆိုင်ရာ ပုံရိပ်များနှင့် ဓမ္မသီချင်းဆန်သော ချီးမွမ်းမှုတို့ကို အသုံးပြုသည့် ဆေသီယန် ခရစ်ယာန်အသိုင်းအဝိုင်း။
      date: ခရစ်နှစ် ၂ ရာစု သို့မဟုတ် ၃ ရာစုက စာဟု ယေဘုယျအားဖြင့် သတ်မှတ်ကြသည်။ ခရစ်နှစ် ၄ ရာစု နာဂ်ဟာမာဒီ ကိုဒက်စ်များထဲတွင် ကော့ပ်တစ်မိတ္တူနှစ်စောင် ကျန်ရစ်သည်။
    Letter of Peter to Philip:
      display_name: ဖိလိပ္ပုထံ ပေတရု၏စာ
      author: အမည်မသိ။ အဖွင့်စာတိုနှင့် ယင်းနောက်ပါ ဖွင့်ပြချက်ကို ပေတရုနှင့် ဖိလိပ္ပုတို့အား အမည်ခံ၍ ရေးထားခြင်းဖြစ်ပြီး တမန်တော်တစ်ဦးဦးက အမှန်တကယ် ရေးသားခဲ့သည်ဟု ခိုင်လုံစွာ မဆိုနိုင်ပါ။
      audience: ကယ်တင်ရှင်၊ ရန်လိုသော တန်ခိုးများ၊ ဆင်းရဲဒုက္ခ၊ သာသနာပြုခြင်းနှင့် တပည့်တော်များ ပြန်လည်တည်ဆောက်ခံရခြင်းတို့ဆိုင်ရာ သွန်သင်ချက်အတွက် တမန်တော်တို့၏ အခွင့်အာဏာကို ရှာဖွေသော ခရစ်ယာန်များ။
      date: ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုအစောပိုင်းဟု ယေဘုယျအားဖြင့် သတ်မှတ်ကြသည်။ ခရစ်နှစ် ၄ ရာစု နာဂ်ဟာမာဒီမိတ္တူတစ်စောင်နှင့် ထိုထက်နောက်ကျသော ကော့ပ်တစ်စာမူအထောက်အထားတစ်ခု၌ ထိန်းသိမ်းကျန်ရစ်သည်။
    Gospel of Judas:
      display_name: ယုဒ၏ ဧဝံဂေလိကျမ်း
      author: အမည်မသိ။ ခေါင်းစဉ်က ဤဇာတ်ကြောင်းကို ယုဒနှင့် ဆက်စပ်ဖော်ပြသော်လည်း ယုဒရှကာရုတ်သည် သမိုင်းအရ စာရေးသူဖြစ်ကြောင်း ဤစာက အတည်မပြုနိုင်ပါ။
      audience: အခြားအုပ်စုများ၏ ယဇ်ပူဇော်ခြင်းနှင့် အသင်းတော်ဆိုင်ရာ အလေ့အထများကို ဝေဖန်ကာ ယုဒနှင့် ယေရှု၏သေခြင်းကို ပြန်လည်အနက်ဖွင့်ရန် ဗျာဒိတ်ဆန်သော ဆွေးနွေးခန်းနှင့် ဆေသီယန်ဆန်သည့် စကြဝဠာအမြင်ကို အသုံးပြုသော ခရစ်ယာန်အုပ်စုတစ်စု။
      date: ခရစ်နှစ် ၂ ရာစုအလယ်ပိုင်း သို့မဟုတ် နှောင်းပိုင်းဟု ယေဘုယျအားဖြင့် သတ်မှတ်ကြသည်။ ခရစ်နှစ် ၁၈၀ ဝန်းကျင်တွင် အီရီနေယပ်စ်သည် ယုဒ၏ ဧဝံဂေလိကျမ်းတစ်စောင်ကို သိရှိခဲ့ပြီး ယနေ့ကျန်ရစ်သည့် ကော့ပ်တစ်မိတ္တူမှာ ခရစ်နှစ် ၃ ရာစု သို့မဟုတ် ၄ ရာစုက ဖြစ်နိုင်သည်။
    Protoevangelium of James:
      display_name: ယာကုပ်၏ ရှေးဦးဧဝံဂေလိကျမ်း
      author: အမည်မသိ။ ဇာတ်ကြောင်းပြောသူက မိမိကိုယ်ကို ယာကုပ်ဟု ဆိုသော်လည်း ဤစာသည် ယာကုပ်အမည်ခံ ရေးသားထားခြင်းဖြစ်ပြီး ယေရှု၏ညီ ယာကုပ်က ရေးသားခဲ့ခြင်းမဟုတ်ပါ။
      audience: မာရိ၏ မွေးဖွားခြင်းနှင့် ကြီးပြင်းလာပုံ၊ သူ၏ အစဉ်အမြဲ စင်ကြယ်မှု၊ ယေရှု၏ မွေးဖွားခြင်းနှင့် မဿဲနှင့် လုကာတို့ မဖြေထားသော မေးခွန်းများအတွက် ဇာတ်ကြောင်းဆန်သည့် အဖြေများကို စိတ်ဝင်စားသော ခရစ်ယာန်များ။
      date: ခရစ်နှစ် ၂ ရာစု၏ နောက်ပိုင်းတစ်ဝက်က စာဟု ယေဘုယျအားဖြင့် သတ်မှတ်ကြသည်။ နောက်ပိုင်းခေတ် ဂရိစာမူများစွာနှင့် ရှေးဟောင်းဘာသာပြန်များတွင် ထိန်းသိမ်းကျန်ရစ်သည်။
  chapter_titles:
    Apocryphon of John:
      '17':
        title: ကြိုတင်စောင့်ရှောက်မှုက စိတ်များကို နိုးထစေသည်
      '18':
        title: ဝိညာဉ်များသည် မကောင်းမှုနှင့် ရုန်းကန်ခြင်းမှ လှည့်ထွက်ကြသည်
      '19':
        title: ကရုဏာရှင် ဝိညာဉ်တော်က လူတို့ကို နိုးထစေသည်
      '20':
        title: ဝိညာဉ်များကို ကယ်တင်ရန် အလင်းဆင်းသက်လာသည်
      '21':
        title: ကယ်တင်ရှင်က လျှို့ဝှက်ဉာဏ်ပညာကို အပ်နှံသည်
    Hypostasis of the Archons:
      '1':
        title: ဝိညာဉ်တော်က စကြဝဠာတန်ခိုးများကို ဖော်ပြသည်
      '2':
        title: အသံတော်က မျက်စိကန်းသော အုပ်စိုးသူကို ဖော်ထုတ်သည်
      '3':
        title: ဘုရားအလင်းက အာဒံကို အသက်ရှင်စေသည်
      '4':
        title: မိန်းမသည် အုပ်စိုးသူတို့၏ အကြမ်းဖက်မှုမှ လွတ်မြောက်သည်
      '5':
        title: မြွေက ဝိညာဉ်ရေးသမ္မာတရားကို သင်ပေးသည်
      '6':
        title: ကာဣနက အာဗေလကိုသတ်၍ ရှေသက အစားထိုးသည်
      '7':
        title: နောဧသည် သင်္ဘောတည်ဆောက်ပြီး နှစ်ကြိမ် ကယ်တင်ခံရသည်
      '8':
        title: နောရေယာသည် အမှောင်တန်ခိုးများကို ရဲဝံ့စွာ ခုခံသည်
      '9':
        title: အဲလဲလက်က စစ်မှန်သော မူလအစကို အာမခံသည်
      '10':
        title: ဉာဏ်ပညာ၏သမီးက အုပ်စိုးသူကို ချုပ်နှောင်သည်
      '11':
        title: ဆာဗာအုတ် နောင်တရ၍ ဉာဏ်ပညာကို ချီးမွမ်းသည်
      '12':
        title: ဖွင့်ပြသူက ထာဝရအသက်ကို ယူဆောင်လာသည်
    On the Origin of the World:
      '1':
