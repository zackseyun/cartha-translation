payload:
  book_metadata:
    Letters of Ignatius:
      display_name: အစ်ဂနေးရှပ်၏ စာများ
      author: ယေဘုယျလက်ခံထားသော အလယ်အလတ်မူကွဲမှ စာခုနစ်စောင်ကို အန္တိအုတ်မြို့၏ အသင်းတော်ကြီးကြပ်သူ အစ်ဂနေးရှပ်က ရေးသားခဲ့သည်။ နောက်ပိုင်းတွင် တိုးချဲ့ထားသော စာများနှင့် အစ်ဂနေးရှပ်၏အမည်ကို အသုံးပြု၍ အခြားသူများရေးသားခဲ့သော စာများမှာ ဤစုစည်းမှုတွင် မပါဝင်ပါ။
      audience: အစ်ဂနေးရှပ်သည် အသက်ပေးသေဆုံးရမည့်ခရီးသို့ သွားနေစဉ် ဧဖက်၊ မဂ္ဂနီးရှား၊ ထရားလက်စ်၊ ရောမ၊ ဖိလဒေလဖိနှင့် စမုရနမြို့တို့ရှိ ခရစ်ယာန်အသင်းတော်များအပြင် ပေါလီကာပ်ထံသို့ ရည်ရွယ်ရေးသားခဲ့သည်။
      date: အများအားဖြင့် ခရစ်နှစ် ၂ ရာစုအစောပိုင်း၊ ခန့်မှန်းခြေ ခရစ်နှစ် ၁၀၅–၁၁၇ ဟု သတ်မှတ်ကြသော်လည်း အစ်ဂနေးရှပ်၏ခရီးစဉ် အချိန်ကာလအတိအကျကိုမူ ဆွေးနွေးငြင်းခုံနေဆဲဖြစ်သည်။
  chapter_titles:
    Epistle of Barnabas:
      '12':
        title: မောရှေ၏ဆန့်ထားသောလက်များက ယေရှုကို ညွှန်ပြသည်
      '13':
        title: ယာကုပ်၏ကောင်းချီးက အခြေအနေပြောင်းပြန်ဖြစ်မည်ကို ကြိုဟောသည်
      '14':
        title: ယေရှုသည် စိတ်နှလုံးများကို ဘုရားသခင်အတွက် ရွေးနုတ်သည်
      '15':
        title: တရားမျှတမှုပြီးနောက် ဥပုသ်နေ့ငြိမ်ဝပ်ခြင်း ရောက်လာသည်
      '16':
        title: စစ်မှန်သောဗိမာန်တော်သည် ယုံကြည်သူများအတွင်း၌ ရှိသည်
      '17':
        title: ကယ်တင်ခြင်းအကြောင်းကို ယခု ရှင်းလင်းစွာ ရှင်းပြသည်
      '18':
        title: အလင်း၏ကောင်းကင်တမန်များနှင့် အမှောင်၏အုပ်စိုးရှင်
      '19':
        title: အလင်းလမ်းက ဆည်းကပ်မှုကို မိန့်မှာသည်
      '20':
        title: အမှောင်လမ်းက ထာဝရပျက်စီးခြင်းသို့ ပို့ဆောင်သည်
      '21':
        title: ဘုန်းအသရေရရန် သခင်ဘုရား၏အမိန့်များကို နာခံပါ
    Letters of Ignatius:
      '1':
        title: အစ်ဂနေးရှပ်က ဧဖက်အသင်းတော်ကို နှုတ်ဆက်သည်
      '2':
        title: ယုံကြည်သူများက အကျဉ်းသားအစ်ဂနေးရှပ်ကို ကူညီကြသည်
      '3':
        title: စည်းလုံးစွာ ဆုတောင်း၍ အသင်းတော်ကြီးကြပ်သူကို ဂုဏ်ပြုပါ
      '4':
        title: အစ်ဂနေးရှပ်က နှိမ့်ချစွာ ပြောဆိုသည်
      '5':
        title: ယေရှုကိုချစ်ခြင်းအားဖြင့် စည်းလုံးကြသည်
      '6':
        title: အသင်းတော်ကြီးကြပ်သူက ယုံကြည်သူများကို ဆုတောင်းခြင်း၌ စည်းလုံးစေသည်
      '7':
        title: တိတ်ဆိတ်စွာ ကောင်းမွန်စွာ ဦးဆောင်သော အသင်းတော်ကြီးကြပ်သူကို လေးစားပါ
      '8':
        title: မှားယွင်းသောဆရာများ၏ လွှမ်းမိုးမှုကို သတိပြုပါ
      '9':
        title: ဧဖက်သားတို့၏ အစ်ဂနေးရှပ်အပေါ် ဆည်းကပ်မှု
      '10':
        title: ဆိုးညစ်သောသွန်သင်ချက်ကို ငြင်းပယ်၍ ခိုင်မြဲစွာ ရပ်တည်ပါ
      '11':
        title: လူအားလုံးအတွက် အစဉ်မပြတ် ဆုတောင်းပါ
      '12':
        title: ခရစ်တော်သည် အချုပ်အနှောင်အားလုံးထက် မြင့်မြတ်သည်
      '13':
        title: အစ်ဂနေးရှပ်က သေဒဏ်စီရင်ခံရသူအဖြစ် ရေးသားသည်
      '14':
        title: ငြိမ်သက်ခြင်းက စာတန်၏အကြံအစည်များကို ချိုးဖျက်သည်
      '15':
        title: ယုံကြည်ခြင်းက ကောင်းမြတ်ခြင်းနှင့် ချစ်ခြင်းသို့ ပို့ဆောင်သည်
      '16':
        title: တိတ်ဆိတ်ခြင်းဖြင့် သမ္မာတရားအတိုင်း အသက်ရှင်ခြင်း
      '17':
        title: အိမ်ထောင်စုများကို ဖျက်ဆီးသူတို့သည် အမွေမခံရ
      '18':
        title: ဘုရားသခင်ကို သိကျွမ်းခြင်းအား ပညာရှိစွာ ခံယူပါ
      '19':
        title: လက်ဝါးကပ်တိုင်အတွက် မိမိကိုယ်ကို အရာမထင်ခြင်း
      '20':
        title: မာရိ၊ ကြယ်နှင့် ခရစ်တော်၏ ဖြိုချခြင်း
      '21':
        title: အစ်ဂနေးရှပ်က ထပ်မံရေးသားနိုင်ရန် မျှော်လင့်သည်
      '22':
        title: အစ်ဂနေးရှပ်က စာဖတ်သူများအတွက် ဆုတောင်းသည်
      '23':
        title: မဂ္ဂနီးရှားအသင်းတော်သည် ကျေးဇူးတော်ခံစားရသည်
      '24':
        title: အစ်ဂနေးရှပ်က စည်းလုံးညီညွတ်ရေးအတွက် ဆုတောင်းသည်
      '25':
        title: အစ်ဂနေးရှပ်က အသင်းတော်ကြီးကြပ်သူအတွက် ဘုရားသခင်ကို ကျေးဇူးတင်သည်
      '26':
        title: သင်တို့၏ ငယ်ရွယ်သောအသင်းတော်ကြီးကြပ်သူကို ဂုဏ်ပြုပါ
      '27':
        title: ခရစ်ယာန်များအဖြစ် စစ်မှန်စွာ အသက်ရှင်ပါ
      '28':
        title: ယုံကြည်ခြင်းက ထာဝရတည်သော အမှတ်လက္ခဏာကို ရွေးချယ်သည်
      '29':
        title: အစ်ဂနေးရှပ်က အသင်းတော်၏စည်းလုံးမှုကို လက်ခံကြိုဆိုသည်
      '30':
        title: ယုံကြည်သူများသည် အသင်းတော်ကြီးကြပ်သူ၏ ဦးဆောင်မှုအောက်တွင် စုဝေးကြသည်
      '31':
        title: ယေရှုကို ကျေးဇူးတော်အားဖြင့် ဖော်ပြသည်
      '32':
        title: ရှင်ပြန်ထမြောက်သောခရစ်တော်၌ မျှော်လင့်ခြင်း တည်မြဲသည်
      '33':
        title: ယခင်တဆေးဟောင်းကို ဖယ်ရှားပါ
      '34':
        title: ခရစ်တော်၏အုတ်မြစ်ပေါ်တွင် ခိုင်မြဲစွာ ရပ်တည်ပါ
      '35':
        title: နှိမ့်ချခြင်းက ယုံကြည်ခြင်း၌ ဝမ်းမြောက်ခြင်းကို ဆောင်ကြဉ်းသည်
      '36':
        title: အသင်းတော်ကြီးကြပ်သူနှင့် ယုံကြည်ခြင်း၌ စည်းလုံးပါ
      '37':
        title: ဆုတောင်းခြင်းများက အသင်းတော်ကို အားသစ်လောင်းပေးသည်
      '38':
        title: ဘုရားသခင်နှင့်အညီ ညီညွတ်စွာ အသင်းတော်များကို နှုတ်ဆက်ပါ
      '39':
        title: ယေရှု၏ဆင်းရဲဒုက္ခခံခြင်းအားဖြင့် ငြိမ်သက်ခြင်းရသည်
      '40':
        title: စိတ်နှလုံးသန့်ရှင်း၍ သည်းခံခြင်းရှိပါ
      '41':
        title: ယုံကြည်သူများသည် အသင်းတော်ကြီးကြပ်သူနှင့် ခရစ်တော်ကို နာခံကြသည်
      '42':
        title: ခေါင်းဆောင်များကို ယေရှုခရစ်ကဲ့သို့ ဂုဏ်ပြုပါ
      '43':
        title: မာနထက် နူးညံ့သိမ်မွေ့ခြင်းကို တောင့်တပါ
      '44':
        title: အစ်ဂနေးရှပ်က ကောင်းကင်ဆိုင်ရာအသိပညာကို ထုတ်ဖော်ပြောရန် စိုးရွံ့ခဲ့သည်
      '45':
        title: မိစ္ဆာသွန်သင်ချက်များမဟုတ်ဘဲ ယုံကြည်ခြင်းဖြင့် အားဖြည့်ပါ
      '46':
        title: အသင်းတော်ခေါင်းဆောင်မှုအပေါ် သစ္စာစောင့်သိပါ
      '47':
        title: နူးညံ့သိမ်မွေ့ခြင်းဖြင့် မိမိကိုယ်ကို လက်နက်တပ်ဆင်ပါ
      '48':
        title: ခရစ်တော်တစ်ပါးတည်းသာ စစ်မှန်သောအသက်ကို ပေးသည်
      '49':
        title: အမှန်တကယ် ဆင်းရဲဒုက္ခခံခြင်းက ခရစ်တော် အမှန်တကယ်ရှိကြောင်း သက်သေပြသည်
      '50':
        title: မှားယွင်းသောဆရာများ၏ သေစေနိုင်သည့်အသီးကို ရှောင်ကြဉ်ပါ
      '51':
        title: ဆုတောင်းခြင်းနှင့် ဆည်းကပ်ခြင်း၌ စည်းလုံးပါ
      '52':
        title: ချစ်ခြင်းဖြင့် အသင်းတော်ကြီးကြပ်သူ၏ ဦးဆောင်မှုကို ခံယူပါ
      '53':
        title: ရောမမြို့ရှိ သစ္စာရှိအသင်းတော်သို့ နှုတ်ခွန်းဆက်ခြင်း
      '54':
        title: ကျွန်ုပ်၏ခရီးဆုံးတိုင်ရောက်ရန် ဆုတောင်းပေးပါ
      '55':
        title: လူ၏အသိအမှတ်ပြုမှုမဟုတ်ဘဲ ဘုရားသခင်၏နှစ်သက်မှုကို ရှာပါ
      '56':
        title: အတွင်းစိတ်ခွန်အားအတွက် ဆုတောင်းပါ
      '57':
        title: ဘုရားသခင်အတွက် သေခြင်းကို လိုလိုလားလား ရင်ဆိုင်ပါ
      '58':
        title: အစ်ဂနေးရှပ်က ဆင်းရဲဒုက္ခကို လက်ခံကြိုဆိုသည်
      '59':
        title: ခရစ်တော်အတွက် လောကီတပ်မက်မှုများကို လက်ဝါးကပ်တိုင်တင်ပါ
      '60':
        title: အစ်ဂနေးရှပ်က လောကီတပ်မက်မှုများကို ငြင်းပယ်သည်
      '61':
        title: အစ်ဂနေးရှပ်က သစ္စာရှိစွာ ဆင်းရဲဒုက္ခခံလိုသည်
      '62':
        title: သိုးထိန်းပြုစုမှုခံရသော ဆီးရီးယားအသင်းတော်အတွက် ဆုတောင်းပါ
      '63':
        title: စမုရနမှ ဆီးရီးယားသို့ နှုတ်ခွန်းဆက်ခြင်း
      '64':
        title: ဖိလဒေလဖိအသင်းတော်၏ စည်းလုံးမှုကို ချီးမွမ်းသည်
      '65':
        title: အသင်းတော်ကြီးကြပ်သူသည် အကျင့်သီလဖြင့် ဘုရားသခင်ကို အမှုဆောင်သည်
      '66':
        title: သင်တို့၏သိုးထိန်းနောက်သို့ သစ္စာရှိစွာ လိုက်ပါ
      '67':
        title: အန္တရာယ်ဖြစ်စေသော သွန်သင်ချက်များကို ငြင်းပယ်ပါ
      '68':
