payload:
  book_metadata:
    Gospel of Mary:
      display_name: မာရိခရစ်ဝင်ကျမ်း
      author: အမည်မသိသူ ရေးသားသည်။ ဤစာတွင် မာရိကို ယေရှု၏ဖွင့်ပြချက်ကို လက်ခံရရှိပြီး အနက်ဖွင့်သူအဖြစ် တင်ပြထားသော်လည်း ယနေ့ကျန်ရှိသော ခရစ်ဝင်ကျမ်းကို မာရိရေးသားခဲ့သည်ဟု မဆိုထားပါ။
      audience: ဖွင့်ပြချက်၊ ဝိညာဉ်ရေးရာအထက်သို့တက်လှမ်းခြင်း၊ တမန်တော်တို့၏အခွင့်အာဏာနှင့် ယေရှု၏တပည့်များအလယ် မာရိ၏သွန်သင်ချက်ကို လက်ခံသင့်မသင့်တို့နှင့်ပတ်သက်၍ စဉ်းစားဆင်ခြင်နေသော အစောပိုင်းခရစ်ယာန်စာဖတ်သူများ။
      date: ယေဘုယျအားဖြင့် ခရစ်နှစ် ၂ ရာစုတွင် ရေးသားခဲ့သည်ဟု ခန့်မှန်းကြသည်။ ဂရိဘာသာဖြင့် အပိုင်းအစများသည် ၃ ရာစုမှ ကျန်ရှိပြီး အဓိက ကော့ပ်တစ်ဘာသာ မူကို ၅ ရာစုနှစ် ဘာလင်ကိုဒက်စ် ၈၅၀၂ တွင် ထိန်းသိမ်းထားသည်။
    Treatise on the Resurrection:
      display_name: ရှင်ပြန်ထမြောက်ခြင်းဆိုင်ရာ ကျမ်းပြုစာ
      author: အမည်မသိသူ ရေးသားသည်။ ဤစာကို ဆရာတစ်ဦးက ရေဂီနော့စ်အမည်ရှိ တပည့်တစ်ဦးထံ ရေးသောစာပုံစံဖြင့် ဖွဲ့စည်းထားသည်။ ဆရာဖြစ်သူနှင့် ရေဂီနော့စ်တို့ မည်သူမည်ဝါဖြစ်ကြောင်းကိုမူ သေချာစွာ မဖော်ထုတ်နိုင်ပါ။
      audience: ရှင်ပြန်ထမြောက်ခြင်းအကြောင်း သွန်သင်ချက်ရှာဖွေနေသော ခရစ်ယာန်များ၊ အထူးသဖြင့် ကိုယ်ခန္ဓာပိုင်းနှင့် ဝိညာဉ်ရေးရာ ရှင်ပြန်ထမြောက်ခြင်းတို့အပြင် ယခုပင် ရှင်ပြန်ထမြောက်ခြင်းအသက်တာတွင် ပါဝင်ခံစားနိုင်ခြင်းကို ဆင်ခြင်နေသော စာဖတ်သူများ။
      date: ယေဘုယျအားဖြင့် ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း (ခန့်မှန်းခြေ ခရစ်နှစ် ၁၇၀–၂၀၀) တွင် ရေးသားခဲ့သည်ဟု ယူဆကြသည်။ အစောပိုင်း ဂရိဘာသာစာမူတစ်ခုမှ ပြန်ဆိုထားသည့် ၄ ရာစုနှစ် ကော့ပ်တစ်ဘာသာ မိတ္တူဖြင့် ထိန်းသိမ်းထားသည်။
    Dialogue of the Savior:
      display_name: ကယ်တင်ရှင်နှင့် ဆွေးနွေးခန်း
      author: အမည်မသိသူ ရေးသားသည်။ ဤဆွေးနွေးခန်းတွင် ယေရှုက ယုဒ၊ မဿဲ၊ မာရိတို့နှင့် စကားပြောရင်း ဖွင့်ပြချက်ဆိုင်ရာ သွန်သင်ချက်ပေးသည့်ပုံစံဖြင့် တင်ပြထားသော်လည်း စုစည်းပြုစုသူ မည်သူဖြစ်ကြောင်း မဖော်ပြထားပါ။
      audience: သီးသန့်ဖွင့်ပြချက်၊ တပည့်တော်ဖြစ်ခြင်း၊ မိမိကိုယ်ကိုသိခြင်း၊ ဆုတောင်းခြင်းနှင့် ကယ်တင်ခြင်းအတွက် ခြိုးခြံစွာပြင်ဆင်ခြင်းတို့ကို စိတ်ဝင်စားသော အစောပိုင်းခရစ်ယာန်အသိုင်းအဝိုင်းတစ်ခု။
      date: ယေဘုယျအားဖြင့် ခရစ်နှစ် ၂ ရာစုတွင် ရေးသားခဲ့သည်ဟု သတ်မှတ်ကြသော်လည်း စာဖွဲ့စည်းပုံအလွှာများနှင့် ရက်စွဲအတိအကျကို အငြင်းပွားဆဲဖြစ်သည်။ ၄ ရာစုနှစ် ကော့ပ်တစ်ဘာသာစာမူဖြင့် ထိန်းသိမ်းထားသည်။
    Exegesis on the Soul:
      display_name: ဝိညာဉ်အကြောင်း အနက်ဖွင့်ဆိုချက်
      author: အမည်မသိသူ ရေးသားသည်။ စာရေးသူသည် သမ္မာကျမ်းစာနှင့် ဂရိစာပေမှ ပုံရိပ်များကို ဝိညာဉ်၏ကျဆင်းခြင်း၊ နောင်တရခြင်းနှင့် ပြန်လည်ထူထောင်ခြင်းဆိုင်ရာ ပုံဆောင်ချက်အဖြစ် ပြန်လည်ဖတ်ရှုသည့် ခရစ်ယာန်တရားဟောဆရာတစ်ဦးဖြစ်သည်။
      audience: ကျမ်းစာနှင့် ကိုယ်ကျင့်တရားဆိုင်ရာ တိုက်တွန်းနှိုးဆော်ချက်များကို ရင်းနှီးပြီး မထိန်းမသိမ်းသော တပ်မက်မှုမှ နောင်တနှင့် ဘုရားသဘောသဘာဝနှင့် ပြန်လည်ပေါင်းစည်းခြင်းသို့ ခေါ်ယူခံရသော ခရစ်ယာန်များ။
      date: ယေဘုယျအားဖြင့် ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုအစောပိုင်းတွင် ရေးသားခဲ့သည်ဟု ခန့်မှန်းကြသည်။ ဂရိဘာသာမှ ပြန်ဆိုထားသည့် ၄ ရာစုနှစ် ကော့ပ်တစ်ဘာသာပြန်ဖြင့် ထိန်းသိမ်းထားသည်။
    Book of Thomas the Contender:
      display_name: ပြိုင်ဘက် သောမတ်စ်၏ကျမ်း
      author: အမည်မသိသူ ရေးသားသည်။ အဆုံးသတ်ခေါင်းစဉ်တွင် ဤစာကို ယုဒ သောမတ်စ်နှင့် ဆက်စပ်ဖော်ပြပြီး မှတ်တမ်းတင်သူအဖြစ် မာသိုင်းယပ်စ်ကို အမည်တပ်ထားသော်လည်း ယင်းတို့သည် စိစစ်အတည်ပြုနိုင်သော စာရေးသူဆိုင်ရာ အဆိုများမဟုတ်ဘဲ စာပေသဘောအရ သတ်မှတ်ထားခြင်းများသာ ဖြစ်သည်။
      audience: မိမိကိုယ်ကိုသိမြင်ရန်၊ ကိုယ်ခန္ဓာ၏တပ်မက်စိတ်များကို ဆန့်ကျင်ရန်နှင့် သောမတ်စ်အား ယေရှုပေးသော သီးသန့်သွန်သင်ချက်ကို နားလည်ရန် တိုက်တွန်းခံရသည့် ခြိုးခြံစွာအသက်ရှင်လိုသော ခရစ်ယာန်များ။
      date: ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုအစောပိုင်းတွင်၊ ဆီးရီးယားခရစ်ယာန်ပတ်ဝန်းကျင်တစ်ခု၌ ဖြစ်နိုင်ဖွယ် ရေးသားခဲ့သည်ဟု မကြာခဏ ခန့်မှန်းကြသည်။ ၄ ရာစုနှစ် ကော့ပ်တစ်ဘာသာစာမူဖြင့် ထိန်းသိမ်းထားသည်။
    Tripartite Tractate:
      display_name: သုံးပိုင်းပါ ကျမ်းပြုစာ
      author: အမည်မသိသူ ရေးသားသည်။ စာရေးသူသည် ပညာအလွန်တတ်မြောက်သော ဗယ်လင်တီးနီးယန်း ခရစ်ယာန်ဓမ္မပညာရှင်တစ်ဦးဖြစ်သော်လည်း အမည်သိဆရာတစ်ဦးဦးနှင့် သေချာစွာ ဖော်ထုတ်တူညီစေနိုင်ခြင်း မရှိပါ။
      audience: ဘုရားသခင်၊ အီအွန်များ၊ ဖန်ဆင်းခြင်း၊ ခရစ်တော်၊ အသင်းတော်၊ ကယ်တင်ခြင်းနှင့် အဆုံးစွန်ပြန်လည်ထူထောင်ခြင်းတို့အကြောင်း အဆက်မပြတ် သွန်သင်ပို့ချမှုခံယူနေသော ဗယ်လင်တီးနီးယန်း ခရစ်ယာန်အသိုင်းအဝိုင်းတစ်ခု။
      date: ယေဘုယျအားဖြင့် ခရစ်နှစ် ၃ ရာစုတွင် ရေးသားခဲ့သည်ဟု ခန့်မှန်းကြပြီး အချို့က ထိုရာစု၏နှောင်းပိုင်းဖြစ်နိုင်သည်ဟု အဆိုပြုကြသည်။ ၄ ရာစုနှစ် ယွန်းကိုဒက်စ်တွင် ကော့ပ်တစ်ဘာသာဖြင့် ထိန်းသိမ်းထားသည်။
    Apocryphon of John:
      display_name: ယောဟန်၏ လျှို့ဝှက်ကျမ်း
      author: အမည်မသိသူ ရေးသားသည်။ ဤစာသည် ရှင်ပြန်ထမြောက်သော ယေရှုက ဇေဗေဒဲ၏သား ယောဟန်အား ဖွင့်ပြခြင်းကို ယောဟန်နှင့် အမည်လွှဲဆက်စပ်၍ တင်ပြထားပြီး ရှေးဟောင်းမူကွဲတစ်မျိုးထက်မကဖြင့် ကျန်ရှိသည်။
      audience: ဘုရားသဘောသဘာဝဆိုင်ရာ နယ်ပယ်၊ ဖန်ဆင်းခြင်း၊ လူသား၏ပင်ကိုလက္ခဏာနှင့် ရန်လိုသော အုပ်စိုးသူများထံမှ လွတ်မြောက်ခြင်းတို့အကြောင်း ရှင်းလင်းချက်ရှာဖွေနေသည့် ဆက်သီယန် သို့မဟုတ် ယင်းနှင့် နီးစပ်သော ဖွင့်ပြချက်အစဉ်အလာမှ ခရစ်ယာန်များ။
      date: အစောပိုင်းပုံစံတစ်မျိုးသည် ခရစ်နှစ် ၂ ရာစုတွင် ပျံ့နှံ့ခဲ့ဖွယ်ရှိသည်။ အတိုနှင့် အရှည် မူကွဲများကို ထိန်းသိမ်းထားသည့် ယနေ့ကျန်ရှိသော ကော့ပ်တစ်ဘာသာ သက်သေစာမူများမှာ ၄ ရာစုနှင့် ၅ ရာစုတို့မှ ဖြစ်သည်။
  chapter_titles:
    Gospel of Philip:
      '17':
        title: ယေရှုသည် မကောင်းမှုကို ဖော်ထုတ်၍ ဖယ်ရှားသည်
      '18':
        title: သန့်ရှင်းသောပေါင်းစည်းခြင်းက ထာဝရအလင်းကို ဆောင်ကြဉ်းသည်
    Gospel of Mary:
      '1':
        title: ကယ်တင်ရှင်သည် အပြစ်ကို ဆန့်ကျင်ရန် သွန်သင်သည်
      '2':
        title: ယေရှုသည် တပည့်များအား ငြိမ်သက်ခြင်းဖြင့် စေလွှတ်သည်
      '3':
        title: မာရိသည် သွန်သင်ချက်များဖြင့် နှစ်သိမ့်သည်
      '4':
        title: ဝိညာဉ်သည် မေ့လျော့ခြင်းကို အောင်နိုင်သည်
      '5':
        title: လေဝိသည် ခရစ်ဝင်သတင်းကြေညာရန် တိုက်တွန်းသည်
    Treatise on the Resurrection:
      '1':
        title: ခရစ်တော်သည် စစ်မှန်သောပြည့်စုံခြင်းကို ဆောင်ကြဉ်းသည်
      '2':
