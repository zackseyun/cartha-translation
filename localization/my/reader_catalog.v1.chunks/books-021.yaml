      display_name: ယုဒ၏ နောက်ဆုံးမှာတမ်း
      author: အမည်မသိ။ ဘိုးဘေးဆယ့်နှစ်ပါး၏ နောက်ဆုံးမှာတမ်းများထဲမှ တစ်စောင်ဖြစ်သည်။
      audience: ဂျူးစာဖတ်သူများနှင့် နောက်ပိုင်း ခရစ်ယာန်စာဖတ်သူများ။
      date: ခရစ်မပေါ်မီ ၂ ရာစုခန့်က ဂျူးမူရင်းအလွှာ ရှိနိုင်ပြီး ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်တွင် ခရစ်ယာန်တည်းဖြတ်မှု ပြုလုပ်ခဲ့ပုံရသည်။
    Testament of Issachar:
      display_name: ဣသခါ၏ နောက်ဆုံးမှာတမ်း
      author: အမည်မသိ။ ဘိုးဘေးဆယ့်နှစ်ပါး၏ နောက်ဆုံးမှာတမ်းများထဲမှ တစ်စောင်ဖြစ်သည်။
      audience: ဂျူးစာဖတ်သူများနှင့် နောက်ပိုင်း ခရစ်ယာန်စာဖတ်သူများ။
      date: ခရစ်မပေါ်မီ ၂ ရာစုခန့်က ဂျူးမူရင်းအလွှာ ရှိနိုင်ပြီး ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်တွင် ခရစ်ယာန်တည်းဖြတ်မှု ပြုလုပ်ခဲ့ပုံရသည်။
  chapter_titles:
    Shepherd of Hermas:
      '47':
        title: ဟေရမသည် စစ်မှန်သောမြို့ကို ရွေးချယ်သည်
      '48':
        title: စည်းစိမ်ဥစ္စာသည် အစေခံရမည့် တာဝန်ကို ဖြစ်စေသည်
      '49':
        title: စည်းစိမ်ကို ဝေမျှခြင်းက ပြည့်စုံမှုကို ဖြစ်စေသည်
      '50':
        title: ဟေရမသည် အစာရှောင်ခြင်းကို နားလည်မှုလွဲသည်
      '51':
        title: ဟေရမသည် နားလည်သဘောပေါက်မှုကို ရှာဖွေသည်
      '52':
        title: ဟေရမသည် ဥပမာ၏ အဓိပ္ပာယ်ကို သင်ယူရသည်
      '53':
        title: ဟေရမသည် ကိုယ်နှင့်စိတ်ဝိညာဉ်ကို သန့်စင်သည်
      '54':
        title: စည်းစိမ်ယစ်သော သိုးများကို ထိန်းကျောင်းသည့် သိုးထိန်းများ
      '55':
        title: တင်းကျပ်သောသိုးထိန်းက အလိုလိုက်သောသိုးများကို ဆုံးမသည်
      '56':
        title: သိုးထိန်းက လမ်းလွဲသောသိုးများကို အပြစ်ပေးသည်
      '57':
        title: အလိုလိုက်မှုကြောင့် ကြီးလေးသော အပြစ်ဒဏ်ခံရသည်
      '58':
        title: ဟေရမက အပြစ်ဒဏ်ကာလကို မေးမြန်းသည်
      '59':
        title: ဟေရမက သက်သာခွင့်ရရန် ဆုတောင်းသည်
      '60':
        title: နောင်တရခြင်း၌ နှိမ့်ချစွာ ဆုံးမမှုကို ခံယူပြီး ကြံ့ကြံ့ခံရမည်
      '61':
        title: ကောင်းသောအသီးရှိသူများကို ကောင်းကင်တမန်က သရဖူဆောင်းပေးသည်
      '62':
        title: သစ်ပင်သည် ဘုရားသခင်၏ ပညတ်တရားကို ကိုယ်စားပြုသည်
      '63':
        title: သိုးထိန်းက ပြန်စိုက်ထားသော တုတ်တံများကို ခွဲခြားသည်
    Thunder, Perfect Mind:
      '1':
        title: မိုးခြိမ်းသံက ရှာဖွေသူများအား ပြောဆိုသည်
      '2':
        title: ငါသည် အဦးဆုံး၊ နောက်ဆုံးနှင့် အပျိုစင်ဖြစ်သည်
      '3':
        title: အသိပညာနှင့် မသိနားမလည်မှုတို့ ပေါင်းစည်းသည်
      '4':
        title: ကြောက်ရွံ့မှုနှင့် ခွန်အားသည် ငါ့အတွင်း၌ ရှိသည်
      '5':
        title: သူမကို မုန်းလည်းမုန်း၊ ချစ်လည်းချစ်၍ သေခြင်းဟု ခေါ်ကြသည်
      '6':
        title: စိတ်နှင့် ငြိမ်သက်ခြင်းသည် ငါ့အတွင်း၌ ရှိသည်
      '7':
        title: ငါ့အားဖြင့် ငြိမ်သက်ခြင်းသည် စစ်ပွဲကို ဖြစ်စေသည်
      '8':
        title: အသံတစ်သံအတွင်းမှ တိတ်ဆိတ်ခြင်းကို ကြားရသည်
      '9':
        title: ငါသည် တရားမျှတမှုနှင့် အကျိုးဆောင်သူဖြစ်သည်
      '10':
        title: ဖန်ဆင်းရှင်၏ နာမတော်ကို ငါကြွေးကြော်သည်
      '11':
        title: သည်းခံခြင်းနှင့် ခွင့်လွှတ်ခြင်း ရောက်လာသည်
    Testament of Reuben:
      '1':
        title: အပြစ်၏ ချုပ်ကိုင်မှုကို ရုဗင် သတိပေးသည်
      '2':
        title: ဝိညာဉ်ခုနစ်ပါးက လူသားတို့ကို အုပ်စိုးသည်
      '3':
        title: မှားယွင်းမှုခုနစ်မျိုးက လူငယ်များကို ချည်နှောင်ထားသည်
      '4':
        title: ကာမတပ်မက်မှုနှင့် ရုပ်တုကိုးကွယ်မှုကို ယခုပင် ရှောင်ကြဉ်ပါ
      '5':
        title: အမျိုးသမီးများက ဖြားယောင်းမှုဖြင့် ထောင်ချောက်ဆင်သည်
      '6':
        title: ဗေလျာ၏ ထောင်ချောက်များမှ စိတ်ကို ကာကွယ်ပါ
      '7':
        title: ရုဗင်၏ အရိုးများကို ဇာတိမြေသို့ ပြန်ယူလာသည်
    Testament of Simeon:
      '1':
        title: ရှိမောင်က သက်သေခံပြောဆိုရန် သားများကို စုဝေးစေသည်
      '2':
        title: မနာလို၍ အကွက်ဆင်ခဲ့ခြင်းအတွက် ရှိမောင် နောင်တရသည်
      '3':
        title: ရှိမောင်က မနာလိုစိတ်ဝိညာဉ်ကို တိုက်ခိုက်သည်
      '4':
        title: ယောသပ်က ကရုဏာပြ၍ ရှိမောင်က သတိပေးသည်
      '5':
        title: သန့်ရှင်းမှုက လှပစေသည်၊ အပြစ်ကို ငြင်းပယ်ပါ
      '6':
        title: မကောင်းမှုကို ငြင်းပယ်၍ သန့်ရှင်းခြင်း၌ ရှင်သန်ကြီးပွားပါ
      '7':
        title: ရှိမောင်က အနာဂတ်ရှင်ဘုရင်အကြောင်း ပရောဖက်ပြုသည်
      '8':
        title: ရှိမောင် သေဆုံး၍ သူ၏အရိုးများကို ဟေဗြုန်သို့ ယူဆောင်သည်
      '9':
        title: ရှိမောင်အတွက် ငိုကြွေး၍ ထွက်မြောက်မည့်အချိန်ကို စောင့်ကြသည်
    Testament of Levi:
      '1':
        title: လေဝိက မိမိသေဆုံးမည့်အကြောင်း ပရောဖက်ပြုသည်
      '2':
        title: လေဝိက ကောင်းကင်ဘုံ၏ ဖောက်ပြန်ပျက်စီးမှုကို မြင်သည်
      '3':
        title: ဘုရားသခင်၏ အမျက်တော်ကြောင့် ကောင်းကင်များ တုန်လှုပ်သည်
      '4':
        title: လေဝိသည် သန့်ရှင်းသောအမှုတော်အတွက် ရွေးချယ်ခံရသည်
      '5':
        title: ကောင်းကင်တမန်က လက်စားချေရန် လေဝိအား လက်နက်တပ်ဆင်ပေးသည်
      '6':
        title: သတ်ဖြတ်မှုအပေါ် အမျက်ထွက်ခဲ့ခြင်းအတွက် လေဝိ အပြစ်ဖြေသည်
      '7':
        title: လေဝိ၏ဓားကြောင့် ရှေခင် ကျိန်ခြင်းခံရသည်
      '8':
        title: ကောင်းကင်တမန်များက လေဝိကို ယဇ်ပုရောဟိတ်အဖြစ် ခန့်အပ်သည်
      '9':
        title: ဣဇာက်က လေဝိအား ပညတ်များကို သင်ကြားပေးသည်
      '10':
        title: အနာဂတ်ဆိုးယုတ်မှုအကြောင်း လေဝိ သတိပေးသည်
      '11':
