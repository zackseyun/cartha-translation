payload:
  book_metadata:
    Thunder, Perfect Mind:
      display_name: မိုးခြိမ်းသံ၊ ပြည့်စုံသောစိတ်
      author: အမည်မသိ။
      audience: ဂရိ-အီဂျစ် ဉာဏ်ပညာစာပေ သို့မဟုတ် ဂနော့စတစ်စာပေကို ဖတ်ရှုသူများအတွက် ဖြစ်ပုံရသည်။ ဘုရားသဘောဆောင်သော အမျိုးသမီးပုဂ္ဂိုလ်တစ်ဦး၏ အသံဖြင့် မိမိကိုယ်ကို ဖော်ပြထားသည့် ကဗျာဖြစ်သည်။
      date: ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်က ဖြစ်နိုင်ဖွယ်ရှိပြီး နာဂ်ဟမ္မာဒီ စာမူစု (NHC VI,2) တွင် ထိန်းသိမ်းထားသည်။
    Testament of Reuben:
      display_name: ရုဗင်၏ နောက်ဆုံးမှာတမ်း
      author: အမည်မသိ။ ယာကုပ်၏သားများ သေခါနီး ပြောကြားခဲ့သော မိန့်ခွန်းများအဖြစ် တင်ပြသည့် ဘိုးဘေးဆယ့်နှစ်ပါး၏ နောက်ဆုံးမှာတမ်းများထဲမှ တစ်စောင်ဖြစ်သည်။
      audience: ဘိုးဘေးများ၏ အပြစ်ဝန်ခံချက်များမှတစ်ဆင့် ကျင့်ဝတ်ကို သင်ယူသော ဂျူးစာဖတ်သူများနှင့် နောက်ပိုင်း ခရစ်ယာန်စာဖတ်သူများ။
      date: ခရစ်မပေါ်မီ ၂ ရာစုခန့်က ဂျူးမူရင်းအလွှာ ရှိနိုင်ပြီး ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်တွင် ခရစ်ယာန်တည်းဖြတ်မှုအလွှာ ထပ်ပေါင်းခဲ့ပုံရသည်။
    Testament of Simeon:
      display_name: ရှိမောင်၏ နောက်ဆုံးမှာတမ်း
      author: အမည်မသိ။ ဘိုးဘေးဆယ့်နှစ်ပါး၏ နောက်ဆုံးမှာတမ်းများထဲမှ တစ်စောင်ဖြစ်သည်။
      audience: ဂျူးစာဖတ်သူများနှင့် နောက်ပိုင်း ခရစ်ယာန်စာဖတ်သူများ။
      date: ခရစ်မပေါ်မီ ၂ ရာစုခန့်က ဂျူးမူရင်းအလွှာ ရှိနိုင်ပြီး ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်တွင် ခရစ်ယာန်တည်းဖြတ်မှု ပြုလုပ်ခဲ့ပုံရသည်။
    Testament of Levi:
      display_name: လေဝိ၏ နောက်ဆုံးမှာတမ်း
      author: အမည်မသိ။ ဘိုးဘေးဆယ့်နှစ်ပါး၏ နောက်ဆုံးမှာတမ်းများထဲမှ တစ်စောင်ဖြစ်သည်။
      audience: ဂျူးစာဖတ်သူများနှင့် နောက်ပိုင်း ခရစ်ယာန်စာဖတ်သူများ၊ အထူးသဖြင့် ယဇ်ပုရောဟိတ်အမှုကို စိတ်ဝင်စားသော အသိုင်းအဝိုင်းများ။
      date: ခရစ်မပေါ်မီ ၂ ရာစုခန့်က ဂျူးမူရင်းအလွှာ ရှိနိုင်ပြီး ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်တွင် ခရစ်ယာန်တည်းဖြတ်မှု ပြုလုပ်ခဲ့ပုံရသည်။
