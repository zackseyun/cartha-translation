payload:
  book_metadata:
    Isaiah:
      display_name: ဟေရှာယ
      author: ရာစုနှစ်များတစ်လျှောက် စာရေးသူအများအပြား ရေးသားခဲ့ကြသည်။ အခန်း ၁–၃၉ သည် ခရစ်တော်မပေါ်မီ ၈ ရာစုက ယေရုရှလင်မြို့သား ဟေရှာယတွင် အခြေခံပြီး၊ အခန်း ၄၀–၅၅ ("ဒုတိယ ဟေရှာယ") နှင့် ၅၆–၆၆ ("တတိယ ဟေရှာယ") တို့သည် ပြည်နှင်ဒဏ်ခံရခြင်းနှင့် ပြန်လာခြင်းတို့ကို တုံ့ပြန်ထားသည်။
      audience: အဆက်ဆက်အားဖြင့် အာရှုရိ၏ ခြိမ်းခြောက်မှုအောက်ရှိ ယုဒပြည်သူများ၊ ဗာဗုလုန်သို့ ပြည်နှင်ဒဏ်ခံရသူများနှင့် ပြည်နှင်ဒဏ်နောက်ပိုင်း ပြန်လည်ထူထောင်ရေးကာလရှိ လူများ။
      date: ခန့်မှန်းအားဖြင့် ခရစ်တော်မပေါ်မီ ၈ ရာစုနှောင်းပိုင်းမှ ၅ ရာစုအထိ ကာလအတွင်း ရေးဖွဲ့ခဲ့သည်။
    Jeremiah:
      display_name: ယေရမိ
      author: အာနသုတ်မြို့သား ယေရမိ၊ သူ၏စာရေး ဗာရုတ်နှင့် နောက်ပိုင်း တည်းဖြတ်သူများကလည်း အတော်အတန် တည်းဖြတ်ခဲ့ကြသည်။
      audience: ဗာဗုလုန်၏ သိမ်းပိုက်မှုမတိုင်မီ၊ သိမ်းပိုက်နေစဉ်နှင့် သိမ်းပိုက်ပြီးနောက်ပိုင်းရှိ ယုဒပြည်သူများ။
      date: ခန့်မှန်းအားဖြင့် ခရစ်တော်မပေါ်မီ ၇ ရာစုနှောင်းပိုင်းမှ ၆ ရာစုအစောပိုင်းအထိ။
  chapter_titles:
    Isaiah:
      '1':
        title: ပုန်ကန်သော ယုဒကို ဘုရားသခင် ငြင်းပယ်တော်မူခြင်း
      '2':
        title: ထာဝရဘုရား၏အိမ်တော်သည် အရာခပ်သိမ်းထက် မြင့်မားခြင်း
      '3':
        title: တရားစီရင်ခြင်းကြောင့် တိုင်းပြည် ပြိုလဲခြင်း
      '4':
        title: ပျက်စီးပြီးနောက် ပြန်လည်ထူထောင်မည်ဟု ကတိပြုခြင်း
      '5':
        title: သခင်၏စပျစ်ဥယျာဉ်က အကြမ်းဖက်မှုကို သီးပွင့်ခြင်း
      '6':
        title: ဘုရားသခင်၏ အံ့မခန်းဘုန်းတော်ကို ဟေရှာယ မြင်ခြင်း
      '7':
        title: အာရှုရိမလာမီ ဧမာနွေလ မွေးဖွားခြင်း
      '8':
        title: မာဟေရရှာလလဟာရှဗတ်အမည်က တရားစီရင်ခြင်းကို ဖော်ပြခြင်း
      '9':
        title: အလင်းက မျှော်လင့်ခြင်း ဆောင်ကြဉ်းခြင်း
      '10':
        title: မာနကြီးသော အာရှုရိကို ဘုရားသခင် တရားစီရင်ခြင်း
      '11':
        title: ရှင်ဘုရင်သစ်က ကမ္ဘာပေါ် ငြိမ်းချမ်းရေး ဆောင်ကြဉ်းခြင်း
      '12':
        title: ဘုရားသခင်၏လူတို့က မိမိတို့၏ကယ်တင်ခြင်းအတွက် ချီးမွမ်းခြင်း
      '13':
        title: ဗာဗုလုန် လုံးဝပျက်စီးခြင်းနှင့် ရင်ဆိုင်ရခြင်း
      '14':
        title: ကျဆုံးသော ဗာဗုလုန်ရှင်ဘုရင်ကို အစ္စရေး လှောင်ပြောင်ခြင်း
      '15':
        title: မောဘပြည် ရုတ်တရက် ဘေးဒုက္ခကြီး ခံစားရခြင်း
      '16':
        title: မောဘ၏မာနကြောင့် ပြင်းထန်စွာ တရားစီရင်ခံရခြင်း
      '17':
        title: ဒမာသက်နှင့် ဧဖရိမ်တို့ အကုန်အစင် လုယူခံရခြင်း
      '18':
        title: ဝေးလံသောပြည်က တမန်များကို အဝေးသို့ စေလွှတ်ခြင်း
      '19':
        title: အီဂျစ် နှိမ့်ချခံရပြီးနောက် အနာပျောက်ကင်းခြင်း
      '20':
        title: ဟေရှာယက နိမိတ်လက္ခဏာအဖြစ် အဝတ်မပါဘဲ လျှောက်သွားခြင်း
      '21':
        title: ဗာဗုလုန် ရုတ်တရက်ကျဆုံးပြီး ပွဲခံခြင်း အဆုံးသတ်ခြင်း
      '22':
        title: ယေရုရှလင်၏ ဆူညံပွက်လောရိုက်မှုကြောင့် တရားစီရင်ခံရခြင်း
      '23':
        title: တုရုမြို့၏ ဥစ္စာနှင့် တန်ခိုး ပြိုလဲခြင်း
      '24':
        title: ကမ္ဘာမြေ အနှံ့အပြား လုံးဝတရားစီရင်ခံရခြင်း
      '25':
        title: ထာဝရဘုရားက ပွဲတော်ကျင်းပ၍ သေခြင်းကို ပယ်ရှားတော်မူခြင်း
      '26':
        title: ဘုရားသခင်က မိမိ၏လူတို့ကို ဘေးကင်းစွာ စောင့်ရှောက်ခြင်း
      '27':
        title: လေဝိသန် ရှုံးနိမ့်ပြီး အစ္စရေး စောင့်ရှောက်ခံရခြင်း
      '28':
        title: မာနကြီးသော ခေါင်းဆောင်များက ဘုရားသခင်၏နှုတ်ကပတ်တော်ကို လှောင်ပြောင်ခြင်း
      '29':
        title: ဝိုင်းရံခံရစဉ် ယေရုရှလင် နှိမ့်ချခံရခြင်း
      '30':
        title: အီဂျစ်ကို ယုံကြည်သော ယုဒ ပျက်စီးခြင်းနှင့် ရင်ဆိုင်ရခြင်း
      '31':
        title: ဘုရားသခင်တစ်ပါးတည်းက ဇိအုန်အတွက် တိုက်ခိုက်တော်မူခြင်း
      '32':
        title: ဖြောင့်မတ်သော ရှင်ဘုရင်က တရားမျှတမှု ဆောင်ကြဉ်းခြင်း
      '33':
        title: အကြမ်းဖက်မှုသည် မကောင်းမှုပြုသူထံ ပြန်ရောက်ခြင်း
      '34':
        title: ဧဒုံကို ထာဝရဘုရား ပြင်းထန်စွာ တရားစီရင်တော်မူခြင်း
      '35':
        title: တောကန္တာရသည် ဘုန်းအသရေနှင့် ပွင့်လန်းခြင်း
      '36':
        title: ရာဗရှာခက ယုဒ၏ယုံကြည်ကိုးစားမှုကို လှောင်ပြောင်ခြင်း
      '37':
        title: ဟေဇကိ ဆုတောင်း၍ ဘုရားသခင် ဖြေကြားတော်မူခြင်း
      '38':
        title: ဟေဇကိ၏ နာမကျန်းမှုနှင့် အနာပျောက်ကင်းခြင်း
      '39':
        title: ဟေဇကိ၏ ဘဏ္ဍာများကို ဗာဗုလုန် မြင်တွေ့ခြင်း
      '40':
        title: ဘုရားသခင်၏လူတို့အတွက် နှစ်သိမ့်မှု ရောက်လာခြင်း
      '41':
        title: သမိုင်းကို ထာဝရဘုရားတစ်ပါးတည်း အုပ်စိုးတော်မူခြင်း
      '42':
        title: အစေခံက နူးညံ့စွာ တရားမျှတမှု ဆောင်ကြဉ်းခြင်း
      '43':
        title: အစ္စရေးနှင့် အစဉ်အမြဲအတူရှိမည်ဟု ဘုရားသခင် ကတိပြုခြင်း
      '44':
        title: ထာဝရဘုရားတစ်ပါးတည်းသာ စစ်မှန်သော ဘုရားသခင်ဖြစ်ခြင်း
      '45':
        title: အစ္စရေးကို လွတ်မြောက်စေရန် ကုရု ရွေးချယ်ခံရခြင်း
      '46':
        title: အစ္စရေးကို ဘဝတစ်လျှောက် ထာဝရဘုရား ထမ်းပိုးတော်မူခြင်း
      '47':
        title: အပြစ်ဒဏ်ပေးခြင်းအောက်၌ ဗာဗုလုန် ကျဆုံးခြင်း
      '48':
        title: အစ္စရေး၏ ခေါင်းမာမှုကို ထိပ်တိုက်ဖော်ထုတ်ခြင်း
      '49':
        title: အစေခံ၏ တာဝန်သည် များစွာ ပို၍ကြီးမြတ်ခြင်း
      '50':
        title: ဆင်းရဲဒုက္ခခံရသော်လည်း အစေခံ ယုံကြည်ကိုးစားခြင်း
      '51':
        title: အာဗြဟံ၏ သစ္စာရှိမှုကို အမှတ်ရခြင်း
      '52':
        title: ယေရုရှလင်က သုံ့ပန်းဘဝမှ နိုးထခြင်း
      '53':
        title: ဆင်းရဲဒုက္ခခံသော အစေခံက အပြစ်ကို ထမ်းခြင်း
      '54':
        title: စွန့်ပစ်ခံရသော မိမိ၏သတို့သမီးကို ဘုရားသခင် ပြန်လည်ထူထောင်ခြင်း
      '55':
        title: လာ၍ အသက်ကို အခမဲ့ ခံယူကြလော့
      '56':
        title: သစ္စာရှိသော တိုင်းတစ်ပါးသား ဝတ်ပြုသူများကို ဘုရားသခင် ကြိုဆိုတော်မူခြင်း
      '57':
        title: ဖြောင့်မတ်စွာ အသက်ရှင်ကြလော့၊ ကယ်တင်ခြင်း နီးလာပြီ
      '58':
        title: ဘုရားသခင်၏လူတို့ ပြန်လည်ထူထောင်ခံရမည်
      '59':
        title: တရားမျှတမှုနှင့် ကရုဏာကို အမှန်တကယ် ရှာဖွေကြလော့
      '60':
        title: ရွေးနုတ်ကယ်တင်ရှင်က ဇိအုန်ကို ကူညီရန် ကြွလာခြင်း
      '61':
        title: အနာပျောက်စေရန် အစေခံကို ဘုရားသခင် ဘိသိက်ပေးတော်မူခြင်း
      '62':
        title: ဇိအုန်ကို ဂုဏ်ပြုမည်ဟု ထာဝရဘုရား ကျိန်ဆိုတော်မူခြင်း
      '63':
        title: စစ်သူရဲ ဘုရားသခင် အမျက်တော်နှင့် ပြန်ကြွလာခြင်း
      '64':
        title: သန့်ရှင်းသော ဘုရားသခင် ပြန်ကြွလာရန် ဆုတောင်းခြင်း
      '65':
        title: သစ္စာရှိသော အကြွင်းအကျန်အတွက် ကောင်းကင်သစ်များ
      '66':
        title: သခင်က ဇိအုန်ကို တရားစီရင်၍ ပြန်လည်ထူထောင်တော်မူခြင်း
    Jeremiah:
      '1':
        title: ယေရမိကို ပရောဖက်အဖြစ် ဘုရားသခင် ခန့်ထားတော်မူခြင်း
      '2':
        title: ယေရုရှလင်က အသက်ရေကို စွန့်ပစ်ခြင်း
      '3':
        title: အစ္စရေးက သစ္စာရှိသော ဘုရားသခင်ထံ ပြန်လာခြင်း
      '4':
        title: ယုဒ ရောက်လာမည့် တရားစီရင်ခြင်းနှင့် ရင်ဆိုင်ရခြင်း
      '5':
        title: ယေရုရှလင်တွင် အကျင့်ပျက်ခြစားမှု အပြည့်ရှိခြင်း
      '6':
        title: မြောက်အရပ်မှ စစ်တပ် ရောက်လာမည်
      '7':
        title: ဗိမာန်တော်၌ ယေရမိ သတိပေးခြင်း
      '8':
        title: ယုဒအပေါ် တရားစီရင်ခြင်း ပြည့်စုံသွားခြင်း
      '9':
        title: လူတို့တွင် သစ္စာဖောက်မှု အပြည့်ရှိခြင်း
      '10':
        title: ရုပ်တုများသည် လူလုပ်၍ အနှစ်မဲ့ခြင်း
      '11':
