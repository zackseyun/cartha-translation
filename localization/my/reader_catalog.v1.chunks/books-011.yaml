payload:
  book_metadata:
    Luke:
      display_name: လုကာ
      author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ ပေါလု၏ ခရီးသွားဖော် လုကာရေးသားသည်ဟု ယူဆကြသည်။
      audience: စာတတ်မြောက်သော ဂရိ-ရောမနောက်ခံ ခရစ်ယာန်စာဖတ်သူများအတွက်ဖြစ်ပြီး “သော်ဖိလု” ထံ လိပ်မူထားသည်။
      date: အေဒီ ၈၀–၉၀ ခန့်။
    John:
      display_name: ယောဟန်
      author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ တမန်တော်ယောဟန် သို့မဟုတ် “ချစ်တော်မူသောတပည့်” ရေးသားသည်ဟု ယူဆကြသည်။
      audience: တရားဇရပ်အခြေပြု ယုဒဘာသာဝင်များနှင့် တင်းမာမှုရှိနေပြီး ချစ်တော်မူသောတပည့်၏ သက်သေခံချက်ကို ဗဟိုပြု၍ ဖွဲ့စည်းထားသော ခရစ်ယာန်အသိုင်းအဝိုင်းအတွက် ဖြစ်သည်။
      date: အေဒီ ၉၀–၁၁၀ ခန့်။
      summary: ယောဟန်ခရစ်ဝင်ကျမ်းတွင် ယေရှုကို ခမည်းတော်အား ဖော်ပြပေးသော ထာဝရနှုတ်ကပတ်တော်၊ ကိုယ်တော်ကို ယုံကြည်အားကိုးခြင်းမှတစ်ဆင့် အသက်ကိုပေးသောအရှင်အဖြစ် တင်ပြထားပြီး၊ ကိုယ်တော်၏ နိမိတ်လက္ခဏာများ၊ သေခြင်းနှင့် ရှင်ပြန်ထမြောက်ခြင်းတို့မှတစ်ဆင့် ဘုန်းထင်ရှားတော်မူကြောင်း ဖော်ပြထားသည်။
    Acts:
      display_name: တမန်တော်ဝတ္ထု
      author: ရေးသားသူအမည် မသိရပါ။ လုကာခရစ်ဝင်ကျမ်းကို ရေးသားသူနှင့် အတူတူဖြစ်သည်။
      audience: ဂရိ-ရောမနောက်ခံ ခရစ်ယာန်စာဖတ်သူများအတွက် ဖြစ်ပြီး သော်ဖိလုထံ လိပ်မူထားသော ကျမ်း၏ ဒုတိယတွဲဖြစ်သည်။
      date: အေဒီ ၈၀–၉၀ ခန့်။
    Romans:
      display_name: ရောမဩဝါဒစာ
      author: ပေါလုရေးသားပြီး စာရေးကူ တေရတိက ကူညီရေးသားခဲ့သည်။
      audience: ရောမမြို့ရှိ ခရစ်ယာန်များ—မောရှေပညတ်တရားနှင့် မိမိတို့၏ အမှတ်လက္ခဏာဆိုင်ရာ ကိစ္စများကြောင့် အချင်းချင်း တင်းမာမှုရှိနေသော ယုဒလူမျိုးနှင့် လူမျိုးခြား ယုံကြည်သူများအတွက် ဖြစ်သည်။
      date: အေဒီ ၅၆–၅၈ ခန့်၊ ကောရိန္သုမြို့မှ ရေးသားခဲ့သည်။
  chapter_titles:
    Mark:
      '4':
        title: ယေရှုက ပင်လယ်ကမ်းနားတွင် ပုံဥပမာများဖြင့် သွန်သင်တော်မူခြင်း
      '5':
        title: ယေရှုက လူမျိုးခြားအမျိုးသားတစ်ဦးကို ကုသတော်မူခြင်း
      '6':
        title: ယေရှုက လူငါးထောင်ကို ကျွေးမွေးတော်မူခြင်း
      '7':
        title: ယေရှုက လူတို့၏ အစဉ်အလာများကို ရင်ဆိုင်မေးခွန်းထုတ်တော်မူခြင်း
      '8':
        title: ယေရှုက လူလေးထောင်ကို ကျွေးမွေးတော်မူခြင်း
      '9':
        title: ယေရှုက မိမိ၏ဘုန်းတော်ကို ထင်ရှားစေတော်မူခြင်း
      '10':
        title: ယေရှုက နိုင်ငံတော်အတွက် ကလေးငယ်များကို ကြိုဆိုတော်မူခြင်း
      '11':
        title: ယေရှုသည် ချီးမွမ်းခံလျက် ယေရုရှလင်မြို့သို့ ဝင်တော်မူခြင်း
      '12':
        title: ယေရှုက ထောင်ချောက်ဆင်သော မေးခွန်းများကို ဖြေကြား၍ သွန်သင်တော်မူခြင်း
      '13':
        title: ယေရှုက ဒုက္ခဆင်းရဲကာလအကြောင်း သွန်သင်တော်မူခြင်း
      '14':
        title: ညအချိန်တွင် ယုဒက ယေရှုကို သစ္စာဖောက်ခြင်း
      '15':
        title: ယေရှု လက်ဝါးကပ်တိုင်တင်ခံရပြီး သစ္စာရှိစွာ သင်္ဂြိုဟ်ခံရခြင်း
      '16':
        title: ယေရှု ရှင်ပြန်ထမြောက်တော်မူ၍ အမျိုးသမီးများက သတင်းပြောကြားခြင်း
    Luke:
      '1':
        title: အံ့ဖွယ်မွေးဖွားခြင်းနှစ်ခုကို ဘုရားသခင် ကြေညာတော်မူခြင်း
      '2':
        title: ယေရှု ဖွားမြင်တော်မူ၍ ဝမ်းမြောက်ခြင်း ဆောင်ကြဉ်းခြင်း
      '3':
        title: ယောဟန်က ယေရှုအတွက် လမ်းခရီးကို ပြင်ဆင်ခြင်း
      '4':
        title: ယေရှုက စုံစမ်းသွေးဆောင်မှုကို ခုခံ၍ အမှုတော်စတင်ခြင်း
      '5':
        title: ယေရှုက လူတို့ကို စုသိမ်းမည့် တံငါသည်များအား ခေါ်တော်မူခြင်း
      '6':
        title: ယေရှုက တမန်တော်ဆယ့်နှစ်ပါးကို ရွေးချယ်တော်မူခြင်း
      '7':
        title: ယေရှုက တပ်မှူး၏ အစေခံကို ကုသတော်မူခြင်း
      '8':
        title: ယေရှုက နိုင်ငံတော်ဆိုင်ရာ ပုံဥပမာများကို သွန်သင်တော်မူခြင်း
      '9':
        title: ယေရှုက အပြည့်အဝ ဆက်ကပ်လိုက်လျှောက်ရန် မိန့်တော်မူခြင်း
      '10':
        title: ယေရှုက တပည့်များကို စေလွှတ်တော်မူခြင်း
      '11':
        title: ယေရှုက လက်မလျှော့ဘဲ ဆုတောင်းခြင်းကို သွန်သင်တော်မူခြင်း
      '12':
        title: ယေရှုက သူတော်ကောင်းယောင်ဆောင်ခြင်းကို သတိပေးတော်မူခြင်း
      '13':
        title: ယေရှုက သတိပေး၍ ရောဂါကုသတော်မူခြင်း
      '14':
        title: ယေရှုက နှိမ့်ချခြင်းနှင့် ရက်ရောခြင်းကို သွန်သင်တော်မူခြင်း
      '15':
        title: ယေရှုက ပျောက်ဆုံးနေသော အပြစ်သားများကို ကြိုဆိုတော်မူခြင်း
      '16':
        title: ယေရှုက စည်းစိမ်ဥစ္စာကို ကိုးကွယ်ခြင်းအား ရှုတ်ချတော်မူခြင်း
      '17':
        title: ယေရှုက တပည့်များကို သတိပေး၍ အစေခံရန် သွန်သင်တော်မူခြင်း
      '18':
        title: ယေရှုက လက်မလျှော့ဘဲ ဆုတောင်းခြင်းကို သွန်သင်တော်မူခြင်း
      '19':
        title: ယေရှုက ယေရိခေါမြို့တွင် ဇက္ခဲကို ကယ်တင်တော်မူခြင်း
      '20':
        title: ယေရှုက ဗိမာန်တော်ခေါင်းဆောင်များကို စိန်ခေါ်တော်မူခြင်း
      '21':
        title: မုဆိုးမ၏ ပေးလှူမှုနှင့် လာမည့်ဒုက္ခဆင်းရဲကာလ
      '22':
        title: ယေရှုက သံလွင်တောင်ပေါ်တွင် ဆုတောင်းတော်မူခြင်း
      '23':
        title: ယေရှုကို သင်္ချိုင်းသစ်တွင် သင်္ဂြိုဟ်ခြင်း
      '24':
        title: ယေရှု ရှင်ပြန်ထမြောက်၍ အပြစ်လွှတ်ခြင်းကို ကြေညာတော်မူခြင်း
    John:
      '1':
        title: နှုတ်ကပတ်တော်သည် လူ့ဇာတိခံယူတော်မူခြင်း
      '2':
        title: ယေရှုက ရေကို စပျစ်ဝိုင်အဖြစ် ပြောင်းလဲတော်မူခြင်း
      '3':
        title: ဘုရားသခင်က ချစ်တော်မူသော သားတော်ကို ပေးတော်မူခြင်း
      '4':
        title: ယေရှုက ရှမာရိအမျိုးသမီးနှင့် တွေ့ဆုံတော်မူခြင်း
      '5':
        title: ယေရှုက ဥပုသ်နေ့တွင် အမျိုးသားတစ်ဦးကို ကုသတော်မူခြင်း
      '6':
        title: ယေရှုက လူငါးထောင်ရှိသော လူအုပ်ကို ကျွေးမွေးတော်မူခြင်း
      '7':
        title: ယေရှုက ပွဲတော်တွင် သွန်သင်တော်မူခြင်း
      '8':
        title: လောက၏အလင်းဖြစ်သော ယေရှုကို ငြင်းပယ်ခြင်း
      '9':
        title: ယေရှုက မျက်မမြင်တစ်ဦးကို ကုသတော်မူခြင်း
      '10':
        title: ယေရှုက မိမိ၏သိုးများအကြောင်း မိန့်တော်မူခြင်း
      '11':
        title: ယေရှုက လာဇရုကို သေခြင်းမှ ရှင်ပြန်ထမြောက်စေတော်မူခြင်း
      '12':
        title: မာရိက ယေရှု၏သင်္ဂြိုဟ်ခြင်းအတွက် ဆီလိမ်းပေးခြင်း
      '13':
        title: ယေရှုက တပည့်များ၏ခြေကို ဆေးပေးတော်မူခြင်း
      '14':
        title: ယေရှုက သန့်ရှင်းသောဝိညာဉ်တော်ကို ကတိပေးတော်မူခြင်း
      '15':
        title: စစ်မှန်သော စပျစ်နွယ်ပင်ဖြစ်သော ယေရှုက အကိုင်းများကို သုတ်သင်ရှင်းလင်းတော်မူခြင်း
      '16':
        title: ဒုက္ခရောက်လာသော်လည်း ဝမ်းမြောက်ခြင်းတည်ရှိနေခြင်း
      '17':
        title: ယေရှုက မိမိ၏တပည့်များအတွက် ဆုတောင်းတော်မူခြင်း
      '18':
        title: ယေရှု ဖမ်းဆီးခံရပြီး ပေတရုက ငြင်းပယ်ခြင်း
      '19':
        title: ယေရှု ရိုက်နှက်၊ လှောင်ပြောင်၊ လက်ဝါးကပ်တိုင်တင်ခံရခြင်း
      '20':
        title: ယေရှုက မာရိအား ကိုယ်တော်တိုင် ထင်ရှားပြတော်မူခြင်း
      '21':
        title: ယေရှုက ပင်လယ်ကမ်းနားတွင် ပေတရုကို ပြန်လည်ခန့်ထားတော်မူခြင်း
    Acts:
      '1':
        title: သက်သေခံများက ဝိညာဉ်တော်ကို စောင့်မျှော်ခြင်း
      '2':
        title: ပင်တေကုတ္တေပွဲနေ့တွင် ဝိညာဉ်တော်က မီးညှိပေးတော်မူခြင်း
      '3':
        title: ပေတရုက ခြေမသန်သော သူတောင်းစားကို ကုသခြင်း
      '4':
        title: တမန်တော်များက သန့်ရှင်းသောရဲရင့်ခြင်းဖြင့် ဟောပြောခြင်း
      '5':
        title: တရားစီရင်ခြင်းနှင့် အံ့ဖွယ်အမှုများက အသင်းတော်ကို စမ်းသပ်ခြင်း
      '6':
