payload:
  book_metadata:
    Judges:
      display_name: တရားသူကြီးမှတ်စာ
      author: ရေးသားသူအမည်မသိ။ တရားဟောရာကျမ်းအမြင်ဖြင့် ရေးသားထားသော သမိုင်းမှတ်တမ်း၏ အစိတ်အပိုင်းတစ်ခုဖြစ်သည်။
      audience: မင်းစနစ်မပေါ်မီ မိမိတို့၏အတိတ်ကို ဘုရားအားစွန့်ခွာခြင်းနှင့် ကယ်တင်ခြင်းတို့ အဖန်ဖန်ဖြစ်ပေါ်သည့် သတိပေးစရာသံသရာအဖြစ် ပြန်လည်ဖတ်ရှုသော နောက်ခေတ်အစ္စရေးလူမျိုး။
      date: ခန့်မှန်းခြေ ဘီစီ ၇ ရာစုမှ ၆ ရာစုအတွင်း စုစည်းခဲ့သည်။
    Ruth:
      display_name: ရုသဝတ္ထု
      author: ရေးသားသူအမည်မသိ။
      audience: ပြည်နှင်ဒဏ်မှ ပြန်လာပြီးနောက်ခေတ် အစ္စရေးလူမျိုး—ဧဇရနှင့် နေဟမိတို့၏ ပြင်ပလူမျိုးများကို ဖယ်ထုတ်သည့် မူဝါဒများကို ဆန့်ကျင်၍ တိုင်းတစ်ပါးသားများကို လက်ခံပါဝင်စေရန် အကြောင်းပြုထားခြင်း ဖြစ်နိုင်သည်။
      date: ဖြစ်နိုင်ခြေအများဆုံးမှာ ပြည်နှင်ဒဏ်မှ ပြန်လာပြီးနောက်ခေတ်၊ ခန့်မှန်းခြေ ဘီစီ ၆ ရာစုမှ ၄ ရာစုအတွင်း ဖြစ်သည်။
    1 Samuel:
      display_name: ဓမ္မရာဇဝင် ပထမစောင်
      author: ရေးသားသူအမည်မသိ။ တရားဟောရာကျမ်းအမြင်ဖြင့် ရေးသားထားသော သမိုင်းမှတ်တမ်း၏ အစိတ်အပိုင်းတစ်ခုဖြစ်သည်။
      audience: ရှမွေလ၊ ရှောလုနှင့် ဒါဝိဒ်တို့လက်ထက်တွင် မင်းစနစ် ပေါ်ပေါက်လာပုံကို ပြန်လည်ဆင်ခြင်သော အစ္စရေးလူမျိုး။
      date: ရှေးကျသော ရင်းမြစ်များကို အခြေခံ၍ ခန့်မှန်းခြေ ဘီစီ ၇ ရာစုမှ ၆ ရာစုအတွင်း စုစည်းခဲ့သည်။
    2 Samuel:
      display_name: ဓမ္မရာဇဝင် ဒုတိယစောင်
      author: ရေးသားသူအမည်မသိ။ တရားဟောရာကျမ်းအမြင်ဖြင့် ရေးသားထားသော သမိုင်းမှတ်တမ်း၏ အစိတ်အပိုင်းတစ်ခုဖြစ်သည်။
      audience: ဒါဝိဒ်၏ နန်းစံကာလ—အောင်မြင်မှုများနှင့် ဝမ်းနည်းဖွယ်ဖြစ်ရပ်များ—ကို မင်းစနစ်၏ အခြေခံပုံစံအဖြစ် ဖတ်ရှုသော အစ္စရေးလူမျိုး။
      date: ခန့်မှန်းခြေ ဘီစီ ၇ ရာစုမှ ၆ ရာစုအတွင်း စုစည်းခဲ့သည်။
  chapter_titles:
    Joshua:
      '8':
        title: အာဣမြို့ကို သိမ်းပိုက်၍ ပညတ်တရားကို အသစ်ပြန်လည်အတည်ပြုခြင်း
      '9':
        title: ဂိဗောင်လူတို့ ငြိမ်းချမ်းရေးရရန် လှည့်ဖြားခြင်း
      '10':
        title: စစ်ပွဲအတွင်း နေမင်း ရပ်တန့်ခြင်း
      '11':
        title: အစ္စရေးတို့ မြောက်ဘက်သို့ ချီတက်၍ အောင်ပွဲခံခြင်း
      '12':
        title: ဤနေရာ၌ ရှင်ဘုရင် သုံးဆယ့်တစ်ပါး ရှုံးနိမ့်ခြင်း
      '13':
        title: သိမ်းယူရန် မြေများစွာ ကျန်ရှိနေခြင်း
      '14':
        title: ကာလက်က မိမိ၏ တောင်တန်းဒေသကို တောင်းခံခြင်း
      '15':
        title: ယုဒ၏ မြို့များနှင့် ရေတွင်းများကို ရရှိခြင်း
      '16':
        title: ယော်ဒန်မြစ်အနောက်ဘက်ရှိ ဧဖရိမ်၏နယ်မြေ
      '17':
        title: မနာရှေ၏ အမွေနယ်မြေနှင့် တာဝန်
      '18':
        title: ဗင်္ယာမိန်၏ နယ်နိမိတ်များနှင့် မြို့များ
      '19':
        title: လေဝိအမျိုးသားတို့ မိမိတို့၏မြို့များကို ရရှိခြင်း
      '20':
        title: လူသတ်မိသူများအတွက် ခိုလှုံရာမြို့များ
      '21':
        title: လေဝိအမျိုးသားတို့ကို ယဇ်ပုရောဟိတ်အမှုအတွက် သီးသန့်ခွဲထားခြင်း
      '22':
        title: အရှေ့ဘက်အနွယ်များက သက်သေခံရာယဇ်ပလ္လင် တည်ဆောက်ခြင်း
      '23':
        title: ယောရှုက သစ္စာရှိစွာ နာခံရန် တိုက်တွန်းခြင်း
      '24':
        title: ယောရှုက အစ္စရေးတို့အား ရွေးချယ်ရန် ခေါ်ယူခြင်း
    Judges:
      '1':
        title: ယုဒအနွယ်က ခါနာန်လူတို့ကို တိုက်ခိုက်ရာတွင် ဦးဆောင်ခြင်း
      '2':
        title: အစ္စရေးတို့ ပဋိညာဉ်ချိုးဖောက်သဖြင့် ကောင်းကင်တမန် ဆုံးမခြင်း
      '3':
        title: ဩသံယေလက အာရမ်ကို အနိုင်ယူခြင်း
      '4':
        title: ဒေဗောရ တရားစီရင်၍ သိသရကို အနိုင်ယူခြင်း
      '5':
        title: ဒေဗောရက အောင်ပွဲအတွက် ဘုရားသခင်ကို ချီးမွမ်းခြင်း
      '6':
        title: ဂိဒေါင် ယုံကြည်ခြင်းနှင့် သံသယကြား စိတ်လွန်ဆွဲခြင်း
      '7':
        title: ဂိဒေါင်က မိဒျန်တပ်ကို အနည်းငယ်သောလူဖြင့် အနိုင်ယူခြင်း
      '8':
        title: ဂိဒေါင်က ကူညီရန် ငြင်းဆန်သောမြို့များကို အပြစ်ပေးခြင်း
      '9':
        title: ယောသံက ရှေခင်မြို့သားတို့ကို သတိပေးခြင်း
      '10':
        title: ရုပ်တုကိုးကွယ်ပြီးနောက် အမ္မုန်လူတို့က အစ္စရေးကို ဖိနှိပ်ခြင်း
      '11':
        title: ယေဖသက သမီးကို ယဇ်ပူဇော်ရန် သစ္စာကတိပြုခြင်း
      '12':
        title: ဧဖရိမ်လူတို့ ရှိဗ္ဗောလက်စကားလုံး စမ်းသပ်မှုကြောင့် သေဆုံးခြင်း
      '13':
        title: ကောင်းကင်တမန်က ရှံဆုန်မွေးဖွားမည်ဟု ကတိပေးခြင်း
      '14':
        title: ရှံဆုန်က မေးရိုးအရိုးဖြင့် ဖိလိတ္တိလူတို့ကို အနိုင်ယူခြင်း
      '15':
        title: ရှံဆုန်က လက်စားချေ၍ ဖိလိတ္တိလူတို့ကို သတ်ဖြတ်ခြင်း
      '16':
        title: ရှံဆုန်က ဖိလိတ္တိဗိမာန်ကို ဖြိုချခြင်း
      '17':
        title: မိက္ခာက လှည့်လည်သွားလာသော ယဇ်ပုရောဟိတ်ကို ငှားရမ်းခြင်း
      '18':
        title: ဒန်အနွယ်က ရုပ်တုအတွက် ယဇ်ပုရောဟိတ်ကို ခိုးယူခြင်း
      '19':
        title: ဗင်္ယာမိန်လူတို့က လေဝိအမျိုးသား၏ မယားငယ်ကို သတ်ခြင်း
      '20':
        title: အစ္စရေးတို့က ဂိဗာမြို့၌ ဗင်္ယာမိန်အနွယ်ကို အနိုင်ယူခြင်း
      '21':
        title: ဗင်္ယာမိန်အနွယ် အကျပ်အတည်းမှ လွတ်မြောက်ရှင်သန်ခြင်း
    Ruth:
      '1':
        title: နောမိသည် ဆုံးရှုံးမှုအပြည့်ဖြင့် လက်ချည်းပြန်လာခြင်း
      '2':
        title: ရုသသည် ဗောဇ၏လယ်၌ ကောက်သင်းကောက်ခြင်း
      '3':
        title: ရုသသည် ညအချိန်၌ ကာကွယ်စောင့်ရှောက်မှု တောင်းခံခြင်း
      '4':
        title: ဗောဇသည် ရုသနှင့် မိသားစုကို ရွေးနုတ်ခြင်း
    1 Samuel:
      '1':
        title: ဟန္နသည် သားတစ်ဦးရရန် ဆုတောင်းခြင်း
      '2':
        title: ဟန္နက ဘုရားသခင်၏ အချုပ်အခြာအာဏာကို ချီးမွမ်းခြင်း
      '3':
        title: ရှမွေလသည် ဘုရားသခင်၏ ခေါ်သံကို ကြားခြင်း
      '4':
        title: အစ္စရေးတို့ ပဋိညာဉ်သေတ္တာကို ဖိလိတ္တိလူတို့ထံ ဆုံးရှုံးခြင်း
      '5':
        title: ပဋိညာဉ်သေတ္တာကြောင့် ဖိလိတ္တိလူတို့ ဒုက္ခရောက်ခြင်း
      '6':
        title: ပဋိညာဉ်သေတ္တာ ပြန်ရောက်၍ ဗက်ရှေမက်မြို့သားတို့ ဝမ်းမြောက်ခြင်း
      '7':
        title: အစ္စရေးတို့ နောင်တရ၍ ဖိလိတ္တိလူတို့ကို အနိုင်ယူခြင်း
      '8':
        title: အစ္စရေးတို့ ရှင်ဘုရင်တစ်ပါး တောင်းဆိုခြင်း
      '9':
        title: ရှောလုသည် ပရောဖက်ရှမွေလနှင့် တွေ့ဆုံခြင်း
      '10':
        title: ရှမွေလက ရှောလုကို ရှင်ဘုရင်အဖြစ် ဘိသိက်ပေးခြင်း
      '11':
        title: ရှောလုက အမ္မုန်လူတို့ကို တိုက်ခိုက်ရန် အစ္စရေးတို့ကို စည်းလုံးစေခြင်း
      '12':
        title: ရှမွေလက အစ္စရေးတို့၏ အပြစ်ကို ပြစ်တင်ရှုတ်ချခြင်း
      '13':
        title: ရှောလုက ဘုရားသခင်၏ အမိန့်ကို မနာခံခြင်း
      '14':
        title: ဒါဝိဒ်က ယုံကြည်စိတ်ချစွာ ဖိလိတ္တိလူတို့ကို အနိုင်ယူခြင်း
      '15':
        title: ရှောလု၏ မနာလိုမှုက ဒါဝိဒ်ကို ခြိမ်းခြောက်ခြင်း
      '16':
        title: ဘုရားသခင်က ရှောလုအစား ဒါဝိဒ်ကို ရွေးချယ်ခြင်း
      '17':
        title: ဒါဝိဒ်က လူထွားကြီး ဂေါလျတ်ကို အနိုင်ယူခြင်း
      '18':
        title: ယောနသန်နှင့် ဒါဝိဒ် ချစ်ခင်ရင်းနှီးစွာ သစ္စာဖွဲ့ခြင်း
      '19':
        title: ဒါဝိဒ်က ရှောလုလက်မှ လွတ်မြောက်ခြင်း
      '20':
        title: ယောနသန်က အန္တရာယ်အကြောင်း ဒါဝိဒ်ကို သတိပေးခြင်း
      '21':
        title: ဒါဝိဒ်သည် ယဇ်ပုရောဟိတ် အဟိမလက်ထံ ထွက်ပြေးခြင်း
      '22':
        title: ဒါဝိဒ်သည် အဒုလံ၌ ခေါင်းဆောင်ဖြစ်လာခြင်း
      '23':
        title: ဒါဝိဒ်က ရှင်ဘုရင်ရှောလု၏အသက်ကို ချမ်းသာပေးခြင်း
      '24':
