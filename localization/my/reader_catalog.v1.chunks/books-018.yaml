payload:
  book_metadata:
    2 Esdras:
      display_name: ၂ ဧဇရ
      author: ရေးသားသူအမည်မသိ။ မူလ ဂျူးအဓိကပိုင်း (၄ ဧဇရ၊ အခန်း ၃–၁၄) ကို ခရစ်ယာန်တည်းဖြတ်ထားသော ဘောင်ဖြင့် ဝန်းရံထားသည်။
      audience: အေဒီ ၇၀ နောက်ပိုင်း ဘုရားသခင်၏တရားမျှတမှုနှင့် ဆင်းရဲဒုက္ခပြဿနာကို နားလည်ရန် ရုန်းကန်နေသော ဂျူးများအတွက်ဖြစ်ပြီး၊ နောက်ပိုင်းတွင် ခရစ်ယာန်စာဖတ်သူများအတွက် ထပ်မံဖြည့်စွက်ခဲ့သည်။
      date: ဂျူးအဓိကပိုင်းသည် အေဒီ ၁၀၀ ခန့်၊ ခရစ်ယာန်ဖြည့်စွက်ချက်များသည် အေဒီ ၂ ရာစုမှ ၃ ရာစုခန့်။
    Didache:
      display_name: ဒီဒါခေး
      author: ရေးသားသူအမည်မသိ (ခေါင်းစဉ်၏အဓိပ္ပာယ်မှာ “တမန်တော်ဆယ့်နှစ်ပါး၏ သွန်သင်ချက်” ဖြစ်သည်)။
      audience: အစောပိုင်းခရစ်ယာန်အသင်းအဖွဲ့များအတွက် ကိုယ်ကျင့်တရား၊ ဗတ္တိဇံ၊ ကျေးဇူးတော်ချီးမွမ်းပွဲနှင့် လှည့်လည်သွန်သင်သူများအကြောင်း အကျဉ်းချုပ်လမ်းညွှန်စာအုပ်။
      date: အေဒီ ၁ ရာစုနှောင်းပိုင်းမှ ၂ ရာစုအစောပိုင်းခန့်။
    Gospel of Thomas:
      display_name: သောမတ်ခရစ်ဝင်ကျမ်း
      author: ရေးသားသူအမည်မသိ။ အစစာပိုဒ်က ဤမိန့်ဆိုချက်စုစည်းမှုကို “ဒိဒုမု ယုဒ သောမတ်” နှင့် ဆက်စပ်ဖော်ပြသည်။ အပြည့်အစုံကျန်ရှိသည့် စာမူမှာ နာ့ဂ်ဟာမာဒီမှ ၄ ရာစု ကော့ပတစ်ဘာသာပြန် (NHC II,2) တစ်ခုတည်းဖြစ်ပြီး၊ အောက်ဆီရင်ခပ်စ်မှ ဂရိစာမူအပိုင်းအစ သုံးခုလည်း ကျန်ရှိသည်။
      audience: ဆီးရီးယားဉာဏ်ပညာအစဉ်အလာနှင့် အစောပိုင်းဂနော့စတစ်အတွေးအခေါ်တို့၏ လွှမ်းမိုးမှုရှိပြီး၊ ယေရှု၏မိန့်ဆိုချက်များမှတစ်ဆင့် လျှို့ဝှက်နက်နဲသော မိမိကိုယ်ကိုသိမြင်မှုကို အလေးထားသည့် ခရစ်ယာန်စာဖတ်ပရိသတ်။
      date: ဂရိမူရင်းသည် အေဒီ ၅၀–၁၄၀ ခန့် ဖြစ်နိုင်ပြီး၊ ကော့ပတစ်စာမူသည် အေဒီ ၃၄၀ ခန့်။
      summary: သောမတ်ခရစ်ဝင်ကျမ်းသည် ယေရှုမိန့်ဆိုခဲ့သည်ဟု ယူဆထားသော မိန့်ဆိုချက်များကို စုစည်းထားသည့် ကျမ်းဖြစ်သည်။ ဆက်တိုက်ဖြစ်ပျက်သည့် ဇာတ်လမ်းမပါဝင်ဘဲ မိန့်ဆိုချက်များ၏ အဓိပ္ပာယ်ကို ရှာဖွေသိမြင်ရန် စာဖတ်သူများကို ထပ်ခါတလဲလဲ တိုက်တွန်းထားသည်။
  chapter_titles:
    2 Baruch:
      '72':
        title: တောက်ပသောရေများက မေရှိယ၏ကာလကို ညွှန်ပြသည်
      '73':
        title: ငြိမ်းချမ်းသောခေတ်က ပဋိပက္ခအားလုံးကို အဆုံးသတ်သည်
      '74':
        title: တည်ဆောက်သူများ ငြိမ်းချမ်းစွာ ရိတ်သိမ်းကြသည်
      '75':
        title: ဗာရုတ်က ဘုရားသခင်၏ကရုဏာတော်ကို ချီးမွမ်းသည်
      '76':
        title: လူတို့က ဗာရုတ်၏သွန်သင်မှုကို တောင်းခံကြသည်
      '77':
        title: ဗာရုတ်က လူတို့အား ပညတ်တရားကို သတိပေးသည်
      '78':
        title: ဗာရုတ်က ပြည်နှင်ခံရသူများထံ မျှော်လင့်ခြင်းအကြောင်း ရေးပို့သည်
      '79':
        title: ဖန်ဆင်းရှင်၏မေတ္တာတော် မပြောင်းလဲဘဲ တည်ရှိသည်
      '80':
        title: နေဗုခဒ်နေဇာ၏တိုက်ခိုက်မှု သတ်မှတ်ထားပြီးဖြစ်သည်
      '81':
        title: ဒုက္ခရောက်သူများအတွက် ဘုရားသခင်၏ကရုဏာတော် နီးကပ်လာသည်
      '82':
        title: ဆိုးယုတ်သောလူမျိုးများ တရားစီရင်ခြင်းကို ရင်ဆိုင်ရသည်
      '83':
        title: မောရှေနှင့် ယေရမိတို့က တရားစီရင်ခြင်းများအကြောင်း သတိပေးခဲ့သည်
      '84':
        title: ပညတ်တရားကို အောက်မေ့ရန် ဗာရုတ်တိုက်တွန်းသည်
      '85':
        title: အဆုံးနီးပြီ၊ ပညတ်ချက်များကို လက်ခံကြလော့
      '86':
        title: စုဝေးပွဲများ၌ စာကို အသံထွက်ဖတ်ကြလော့
      '87':
        title: သွန်သင်ထားသော ပညတ်ချက်များကို မြဲမြံစွာ ကိုင်စွဲကြလော့
    2 Esdras:
      '1':
        title: ဣသရေလ၏ငြင်းပယ်မှုကြောင့် ဘုရားသခင် ဝမ်းနည်းသည်
      '2':
        title: ဧဇရက အနာဂတ်ဘုန်းအသရေကို မြင်သည်
      '3':
        title: ဧဇရက ဣသရေလသမိုင်းကို ပြန်လည်ဖော်ပြ၍ ဆုတောင်းသည်
      '4':
        title: ဥရေလက ဧဇရအား သူ၏အကန့်အသတ်များကို သွန်သင်သည်
      '5':
        title: ရောက်လာမည့် ကြောက်မက်ဖွယ်ဘေးအတွင်း ဧဇရ အသနားခံသည်
      '6':
        title: ဧဇရက ဖန်ဆင်းခြင်းနေ့ရက်များကို ပြန်လည်ဖော်ပြ၍ ဆုတောင်းသည်
      '7':
        title: ဧဇရက နောက်ဆုံးတရားစီရင်ခြင်းကို မြင်သည်
      '8':
        title: နားလည်နိုင်ရန် ဧဇရ ဆုတောင်းသည်
      '9':
        title: ဧဇရက ဇိအုန်၏အနာဂတ်ဘုန်းအသရေကို မြင်သည်
      '10':
        title: ဧဇရက ဇိအုန်၏ဘုန်းအသရေကို မြင်သည်
      '11':
        title: လင်းယုန်အိပ်မက်များက အဆုံးကို ကြိုတင်ညွှန်ပြသည်
      '12':
        title: ဧဇရက ခြင်္သေ့နှင့် လင်းယုန်များအကြောင်း အိပ်မက်မက်သည်
      '13':
        title: ပင်လယ်မှပေါ်လာသောသူက ဖန်ဆင်းရာကို ကယ်တင်သည်
      '14':
        title: သစ္စာရှိသောစကားများကို ဟောပြောရန် သခင်မိန့်မှာသည်
      '15':
        title: ရောက်လာမည့် တရားစီရင်ခြင်းအကြောင်း ပရောဖက်သတိပေးသည်
      '16':
        title: ဘုရားသခင်၏တရားစီရင်မှုများက မြေနှင့်ပင်လယ်ကို တုန်လှုပ်စေသည်
    Didache:
      '1':
        title: ဘုရားသခင်ကို ချစ်၍ အသက်လမ်းကို ရွေးချယ်လော့
      '2':
        title: မကောင်းမှုကို ရှောင်၍ ပညတ်ချက်များကို လိုက်နာလော့
      '3':
        title: မကောင်းမှုမျိုးစုံမှ ထွက်ပြေးလော့
      '4':
        title: ဘုရားသခင်၏နှုတ်ကပတ်တော်ကို အစဉ်ရိုသေလော့
      '5':
        title: သေခြင်းလမ်းသည် အပြစ်သို့ ဦးတည်သည်
      '6':
        title: ထပ်မဖြည့်ဘဲ သွန်သင်ချက်ကို လိုက်နာလော့
      '7':
        title: စီးဆင်းသောရေ၌ သစ္စာရှိစွာ ဗတ္တိဇံပေးလော့
      '8':
        title: ဖြောင့်မတ်သောအဘထံ ဆုတောင်းလော့
      '9':
        title: ခွက်နှင့်မုန့်အတွက် ကျေးဇူးတင်လော့
      '10':
        title: သန့်ရှင်းတော်မူသောအဘထံ ကျေးဇူးတော်ချီးမွမ်းခြင်း ဆက်ကပ်သည်
      '11':
        title: စစ်မှန်သောဆရာများနှင့် ပရောဖက်များကို ကြိုဆိုလော့
      '12':
        title: ခရီးသွားများကို ကူညီသော်လည်း စစ်ဆေးကြလော့
      '13':
        title: စစ်မှန်သောပရောဖက်များနှင့် ဆရာများကို ထောက်ပံ့လော့
      '14':
        title: မုန့်ဖဲ့ခြင်းမပြုမီ အပြစ်များကို ဝန်ခံလော့
      '15':
        title: ထိုက်တန်သော ကြီးကြပ်သူများနှင့် သင်းထောက်များကို ခန့်ထားလော့
      '16':
        title: သတိစောင့်၍ စမ်းသပ်မှုများအတွင်း ယုံကြည်ခြင်း၌ တည်ကြည်လော့
    Gospel of Thomas:
      '0':
        title: သောမတ်က ယေရှု၏လျှို့ဝှက်မိန့်ဆိုချက်များကို ရေးသားသည်
      '1':
        title: ယေရှုက လျှို့ဝှက်ဉာဏ်ပညာကို သွန်သင်သည်
      '2':
        title: နိုင်ငံတော်သည် သင်တို့၏အတွင်းနှင့် အပြင်၌ရှိသည်
      '3':
        title: နိုင်ငံတော်သည် အတွင်း၌လည်းကောင်း အပြင်၌လည်းကောင်း ရှိသည်
      '4':
        title: ယေရှုက နှိမ့်ချခြင်းဆိုင်ရာ ဉာဏ်ပညာကို သွန်သင်သည်
      '5':
        title: ယေရှုက လျှို့ဝှက်ချက်များအကြောင်း မိန့်ဆိုသည်
      '6':
        title: လူက စားသောခြင်္သေ့သည် မင်္ဂလာရှိ၏
      '7':
        title: ပညာရှိတံငါသည်က ငါးကြီးကို ရွေးချယ်သည်
      '8':
        title: ပညာရှိတံငါသည်က ငါးကြီးကို ရွေးချယ်သည်
      '9':
        title: မျိုးစေ့ကြဲသူက မျိုးစေ့ကို နေရာအနှံ့ ကြဲသည်
      '10':
        title: ယေရှုက တောက်လောင်သောမီးကို စောင့်ရှောက်သည်
      '11':
        title: ယေရှုက ကွယ်ပျောက်ခြင်းအကြောင်း မိန့်ဆိုသည်
      '12':
        title: ယာကုပ်က တပည့်များကို ဦးဆောင်မည်
      '13':
        title: အစာရှောင်ခြင်း၊ ဆုတောင်းခြင်းနှင့် အလှူပေးခြင်းသည် အပြစ်ဖြစ်နိုင်သည်
      '14':
        title: ယေရှုက စစ်မှန်သော ဘုရားဝတ်၌မွေ့လျော်ခြင်းကို သွန်သင်သည်
      '15':
        title: သင်တို့၏အဘဖြစ်သောသူကို ကိုးကွယ်ကြလော့
      '16':
        title: ယေရှုက ကွဲပြားခြင်းအကြောင်း မိန့်ဆိုသည်
      '17':
        title: အစကို တွေ့ရှိသူသည် မင်္ဂလာရှိ၏
      '18':
