payload:
  book_metadata:
    Numbers:
      display_name: တောလည်ရာကျမ်း
      author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ မောရှေရေးသားသည်ဟု ယူဆကြသည်။
      audience: အီဂျစ်ပြည်မှ ကတိထားရာပြည်သို့ ခရီးသွားနေသည့် အစ္စရေးလူမျိုး—တောကန္တာရမျိုးဆက်နှင့် သူတို့၏အမှားများမှ သင်ခန်းစာယူကြသည့် နောက်ပိုင်းစာဖတ်သူများ။
      date: ဘီစီ ၇ ရာစုမှ ၅ ရာစုခန့်၊ ဘုရင်စနစ်နှောင်းပိုင်းမှ ပြည်နှင်ခံရပြီးနောက်ကာလအထိ အဆင့်ဆင့် ရေးဖွဲ့ခဲ့သည်။
    Deuteronomy:
      display_name: တရားဟောရာကျမ်း
      author: ရေးသားသူအမည် မသိရပါ။ မောရှေ၏ နှုတ်ဆက်မိန့်ခွန်းများအဖြစ် တင်ပြထားသည်။ ခေတ်သစ်ပညာရှင်များက မူလအနှစ်သာရပိုင်းကို ဘီစီ ၇ ရာစုနှောင်းပိုင်း ယောရှိမင်းလက်ထက် ပြုပြင်ပြောင်းလဲမှုနှင့် ဆက်စပ်သတ်မှတ်ကြသည်။
      audience: ထိုပြည်သို့ ဝင်ရောက်ရန် ပြင်ဆင်နေသည့် အစ္စရေးလူမျိုးနှင့် နောက်ပိုင်းတွင် ဗိမာန်တော် သို့မဟုတ် ဘုရင်မရှိဘဲ သစ္စာရှိစွာ မည်သို့အသက်ရှင်ရမည်ကို မေးမြန်းနေကြသည့် ပြည်နှင်ခံများ။
      date: မူလအနှစ်သာရပိုင်းမှာ ဘီစီ ၇ ရာစုနှောင်းပိုင်းခန့်က ဖြစ်ပြီး၊ ပြည်နှင်ခံရသည့်ကာလတွင် နောက်ဆုံးပုံစံသို့ ရောက်ရှိခဲ့သည်။
    Joshua:
      display_name: ယောရှုမှတ်စာ
      author: ရေးသားသူအမည် မသိရပါ။ တရားဟောရာကျမ်းဆိုင်ရာ သမိုင်းမှတ်တမ်း၏ အစိတ်အပိုင်းတစ်ခုဖြစ်သည်။
      audience: ဘုရင်စနစ်နှင့် ပြည်နှင်ခံရသည့်ကာလအတွင်းရှိ အစ္စရေးလူမျိုးတို့အတွက်ဖြစ်ပြီး၊ သိမ်းပိုက်ခြင်း၊ ပဋိညာဉ်နှင့် ထိုပြည်၏အဓိပ္ပာယ်တို့ကို ပြန်လည်ဆင်ခြင်စေသည်။
      date: ရှေးကျသော အစဉ်အလာများကို အခြေခံ၍ ဘီစီ ၇ ရာစုမှ ၆ ရာစုခန့်အတွင်း စုစည်းခဲ့သည်။
  chapter_titles:
    Leviticus:
      '8':
        title: အာရုန်ကို ယဇ်ပုရောဟိတ်အဖြစ် သန့်ရှင်းခန့်အပ်ခြင်း
      '9':
        title: ပူဇော်သက္ကာကို မီးလောင်ကျွမ်းစေခြင်းဖြင့် ဘုရားသခင်၏ဘုန်းတော် ထင်ရှားခြင်း
      '10':
        title: နာဒပ်နှင့် အဘိဟု အပြစ်ဒဏ်ခံရခြင်း
      '11':
        title: စင်ကြယ်သောနှင့် မစင်ကြယ်သော အစားအစာဆိုင်ရာ ပညတ်များ
      '12':
        title: မီးဖွားပြီးသော အမျိုးသမီး၏ သန့်စင်ခြင်း
      '13':
        title: ယဇ်ပုရောဟိတ်များက အရေပြားရောဂါများကို စစ်ဆေးခြင်း
      '14':
        title: ပူဇော်သက္ကာများဖြင့် သန့်စင်ကာ ပြန်လည်လက်ခံခြင်း
      '15':
        title: ခန္ဓာကိုယ်မှ အရည်ယိုစီးမှုကြောင့် မစင်ကြယ်ခြင်း
      '16':
        title: အပြစ်အားလုံးအတွက် အပြစ်ဖြေခြင်း
      '17':
        title: ပူဇော်သက္ကာများကို တဲတော်တံခါးဝသို့ ယူဆောင်လာခြင်း
      '18':
        title: ထာဝရဘုရားက ကိုယ်ကျင့်တရားသန့်ရှင်းမှုကို မိန့်မှာခြင်း
      '19':
        title: အစ္စရေးလူမျိုးကို သန့်ရှင်းခြင်းသို့ ခေါ်တော်မူခြင်း
      '20':
        title: ကြီးလေးသောအပြစ်များအတွက် ပြင်းထန်သည့် စီရင်ချက်များ
      '21':
        title: ယဇ်ပုရောဟိတ်များ အထူးသန့်ရှင်းမှုကို ထိန်းသိမ်းရခြင်း
      '22':
        title: သန့်ရှင်းသော ပူဇော်သက္ကာများကို ဂရုတစိုက် ကိုင်တွယ်ခြင်း
      '23':
        title: ဝတ်ပြုရန် သတ်မှတ်ထားသောအချိန်များကို သွန်သင်ခြင်း
      '24':
        title: ဆီမီးများ ထွန်းညှိ၍ မုန့်ကို ဆက်ကပ်ခြင်း
      '25':
        title: သတ္တမနှစ်တိုင်း မြေကို အနားပေးခြင်း
      '26':
        title: အစ္စရေးလူမျိုးက ပဋိညာဉ်လမ်းကို ရွေးချယ်ခြင်း
      '27':
        title: သစ္စာကတိများနှင့် ဆက်ကပ်မှုများကို သစ္စာရှိစွာ ဆောင်ရွက်ခြင်း
    Numbers:
      '1':
        title: မောရှေက အစ္စရေးအမျိုးသားများကို စာရင်းကောက်ခြင်း
      '2':
        title: လူမျိုးနွယ်များ တဲတော်ပတ်လည်တွင် စုဝေးခြင်း
      '3':
        title: လေဝိအမျိုးသားများ ဘုရားသခင်၏ သန့်ရှင်းသောနေရာတော်၌ အမှုဆောင်ခြင်း
      '4':
        title: ကောဟတ်အမျိုးသားများ သန့်ရှင်းသောပစ္စည်းများကို စောင့်ရှောက်ခြင်း
      '5':
        title: ဘုရားသခင်က ဖုံးကွယ်ထားသောအပြစ်ကို စီရင်ခြင်း
      '6':
        title: နာဇရိသစ္စာကတိနှင့် ကောင်းချီးပေးခြင်း
      '7':
        title: ခေါင်းဆောင်များက သန့်ရှင်းရာဌာနအတွက် လက်ဆောင်များ ဆက်ကပ်ခြင်း
      '8':
        title: ဘုရားသခင်ကို အမှုဆောင်ရန် လေဝိအမျိုးသားများကို သန့်စင်ခြင်း
      '9':
        title: ထာဝရဘုရားက ပသခါပွဲဆိုင်ရာ နာခံမှုကို မိန့်မှာခြင်း
      '10':
        title: ငွေတံပိုးများက ဘုရားသခင်၏ အမိန့်များကို အချက်ပြခြင်း
      '11':
        title: တပ်မက်မှုကြောင့် ကပ်ဘေးကျရောက်ခြင်း
      '12':
        title: မိရိအံက မောရှေ၏ အခွင့်အာဏာကို ဆန့်ကျင်ပြောဆိုခြင်း
      '13':
        title: လူဆယ့်နှစ်ဦးက ကတိထားရာပြည်ကို စူးစမ်းခြင်း
      '14':
        title: သံသယကြောင့် အစ္စရေးလူမျိုး အပြစ်ဒဏ်ခံရခြင်း
      '15':
        title: ပူဇော်သက္ကာများနှင့် အဝတ်ပန်းဖွားများဆိုင်ရာ ညွှန်ကြားချက်များ
      '16':
        title: ကောရဟ ပုန်ကန်၍ မြေမျိုခြင်း
      '17':
        title: အာရုန်၏တောင်ဝှေးက ယဇ်ပုရောဟိတ်မျိုးရိုးကို သက်သေပြခြင်း
      '18':
        title: လေဝိအမျိုးသားများ ယဇ်ပုရောဟိတ်တို့၏ ကြီးကြပ်မှုအောက်တွင် အမှုဆောင်ခြင်း
      '19':
        title: နွားမနီဆိုင်ရာ ပညတ်ဖြင့် သန့်စင်ခြင်း
      '20':
        title: မောရှေ ကာဒေရှအရပ်တွင် အခက်ကြုံခြင်း
      '21':
        title: အစ္စရေးလူမျိုးက ခါနာန်ဘုရင်ကို အနိုင်ယူခြင်း
      '22':
        title: ဗာလမ်က အစ္စရေးလူမျိုးကို ကျိန်ဆဲရန် ငြင်းပယ်ခြင်း
      '23':
        title: ဗာလမ်က အစ္စရေးလူမျိုးကို အကြိမ်ကြိမ် ကောင်းချီးပေးခြင်း
      '24':
        title: ဗာလမ်က အစ္စရေး၏ အနာဂတ်ဘုန်းအသရေကို ကြေညာခြင်း
      '25':
        title: ဖိနဟတ်က ဇိမရိကို သတ်ခြင်း
      '26':
        title: မောရှေက စစ်တိုက်နိုင်သူ မျိုးဆက်သစ်ကို စာရင်းကောက်ခြင်း
      '27':
        title: သမီးများက ဖခင်၏အမွေကို တောင်းခံခြင်း
      '28':
        title: အစ္စရေးလူမျိုးက ပုံမှန်ပူဇော်သက္ကာများ ဆက်ကပ်ခြင်း
      '29':
        title: အစ္စရေးလူမျိုးက လအလိုက် ပူဇော်သက္ကာများ ဆက်ကပ်ခြင်း
      '30':
        title: မောရှေက သစ္စာကတိများအကြောင်း ပြောဆိုခြင်း
      '31':
        title: မောရှေက မိဒျန်လူမျိုးကို လက်စားချေရန် အမိန့်ပေးခြင်း
      '32':
        title: ရုဗင်နှင့် ဂဒ်အမျိုးတို့က အရှေ့ဘက်မြေကို တောင်းဆိုခြင်း
      '33':
        title: အီဂျစ်ပြည်မှစသည့် အစ္စရေးလူမျိုး၏ ခရီးစဉ်ကို စာရင်းပြုခြင်း
      '34':
        title: ထာဝရဘုရားက ခါနာန်ပြည်၏ နယ်နိမိတ်များကို သတ်မှတ်ခြင်း
      '35':
        title: ခိုလှုံရာမြို့များက အကာအကွယ်ပေးခြင်း
      '36':
        title: ဇလောဖဟတ်၏သမီးများက မိမိတို့အမျိုးစုအတွင်း လက်ထပ်ခြင်း
    Deuteronomy:
      '1':
        title: မောရှေက ဘုရားသခင်၏ သစ္စာတော်ကို ပြန်လည်ပြောပြခြင်း
      '2':
        title: အစ္စရေးလူမျိုးက ဧဒုံနှင့် မောဘပြည်ကို ရှောင်ကွင်းခြင်း
      '3':
        title: အစ္စရေးလူမျိုးက ဩဃမင်းကို အနိုင်ယူခြင်း
      '4':
        title: မောရှေက ပညာရှိစွာ နာခံရန် တိုက်တွန်းခြင်း
      '5':
        title: မောရှေက ပညတ်တော်ဆယ်ပါးကို ပြန်လည်မိန့်ဆိုခြင်း
      '6':
        title: မောရှေက ဘုရားသခင်ကို ချစ်ရန် အစ္စရေးလူမျိုးအား မိန့်မှာခြင်း
      '7':
        title: အစ္စရေးလူမျိုးက ရုပ်တုများကို ဖျက်ဆီးရခြင်း
      '8':
        title: ဆင်းရဲခက်ခဲချိန်၌ ဘုရားသခင်၏ စောင့်ရှောက်မှုကို အောက်မေ့ခြင်း
      '9':
        title: မောရှေက အစ္စရေးလူမျိုးအတွက် တောင်းပန်ခြင်း
      '10':
        title: မောရှေက ဘုရားသခင် တောင်းဆိုသောအရာများကို ပြောကြားခြင်း
      '11':
        title: မောရှေက ချစ်ရန် အစ္စရေးလူမျိုးအား မိန့်မှာခြင်း
      '12':
