payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: သောမ၏ ယေရှုကလေးဘဝ ဧဝံဂေလိကျမ်း
      author: အမည်မသိသူ ရေးသားထားသည်။ ပြန်လည်ဖော်ထုတ်နိုင်သမျှ အစောဆုံးမူတွင် စာရေးသူ၏အမည် မပါရှိပါ။ သောမရေးသားသည်ဟု သတ်မှတ်ခြင်းမှာ နောက်ပိုင်းလက်ရေးမူများ၏ ခေါင်းစဉ်များနှင့် လက်ဆင့်ကမ်းပို့ချမှုမှ ဆင်းသက်လာခြင်းဖြစ်သည်။
      audience: ယေရှု၏ကလေးဘဝအကြောင်းနှင့် ကျမ်းရင်းဝင်ဧဝံဂေလိမှတ်တမ်းများ မစတင်မီ ဘုရားတန်ခိုး၊ ဆုံးမပဲ့ပြင်မှု၊ သင်ယူမှုနှင့် ရင့်ကျက်လာမှုတို့ကို မည်သို့ ဇာတ်ကြောင်းပြောနိုင်မည်ကို သိလိုသော ခရစ်ယာန်များအတွက် ဖြစ်သည်။
      date: အများအားဖြင့် ခရစ်နှစ် ၂ ရာစုမှ ဆင်းသက်လာသည်ဟု ယူဆကြသော်လည်း အကြောင်းအရာအတော်အတန်ကွဲပြားသည့် ဂရိမူကွဲအများအပြားနှင့် ရှေးခေတ်ဘာသာပြန်မူများအဖြစ် ယင်းစာသား တည်ရှိနေသည်။
    Acts of Paul and Thecla:
      display_name: ပေါလုနှင့် သက်ကလာတို့၏ လုပ်ဆောင်ချက်များ
      author: အမည်မသိသူ ရေးသားထားသည်။ ဤစာသည် ပိုမိုရှည်လျားသော ပေါလု၏လုပ်ဆောင်ချက်များကျမ်းမှ ဇာတ်လမ်းပိုင်းတစ်ခုဖြစ်သည်။ သင်းအုပ်အကြီးအကဲတစ်ဦးက ထိုကျမ်းကို ရေးသားခဲ့ကြောင်း ရှေးခေတ်မှတ်တမ်းတစ်ခု၌ ဆိုထားသော်လည်း စာရေးသူမည်သူဖြစ်ကြောင်း ယုံကြည်စိတ်ချစွာ မသတ်မှတ်နိုင်ပါ။
      audience: တမန်တော်များ၏ တရားဟောခြင်း၊ အိမ်ထောင်မပြုဘဲနေခြင်း၊ ဗတ္တိဇံခံယူခြင်း၊ အာဇာနည်ကဲ့သို့ ကြံ့ကြံ့ခံခြင်းနှင့် အမျိုးသမီးတစ်ဦး၏ သွန်သင်ခွင့်၊ သက်သေခံခွင့်တို့ကို ဖော်ပြသည့် ဇာတ်လမ်းများအား စိတ်ဝင်စားသော ခရစ်ယာန်များအတွက် ဖြစ်သည်။
      date: ခရစ်နှစ် ၂ ရာစုအတွင်း၊ ဖြစ်နိုင်ဖွယ်အားဖြင့် ထိုရာစု၏ နှောင်းပိုင်းတွင် ရေးသားခဲ့သည်။ ပေါလု၏လုပ်ဆောင်ချက်များကျမ်းအတွင်း အစိတ်အပိုင်းတစ်ခုအဖြစ်လည်းကောင်း၊ သီးခြားစာတစ်စောင်အဖြစ်လည်းကောင်း ပျံ့နှံ့ခဲ့သည်။
    Gospel of Peter:
      display_name: ပေတရု၏ ဧဝံဂေလိကျမ်း
      author: အမည်မသိသူ ရေးသားထားသည်။ ကျန်ရှိနေသော ဇာတ်ကြောင်းမှာ ပေတရုကိုယ်တိုင် ပြောသည့်အသံဖြင့် ရေးသားပြီး သူ၏အမည်ဖြင့် လက်ဆင့်ကမ်းခဲ့သော်လည်း သမိုင်းဝင်တမန်တော်ပေတရု၏ လက်ရာဟု မယူဆကြပါ။
      audience: ယေရှု၏ ဆင်းရဲဒုက္ခခံရမှုနှင့် ရှင်ပြန်ထမြောက်မှုအကြောင်း ပိုမိုချဲ့ထွင်ထားသော ဇာတ်ကြောင်းကို စိတ်ဝင်စားသည့် အစောပိုင်းခရစ်ယာန်များအတွက် ဖြစ်ပြီး၊ ပေတရု၏ဩဇာအာဏာကို အထူးအလေးထားသော အသိုင်းအဝိုင်းများအတွင်း ရည်ရွယ်ခဲ့ဖွယ်ရှိသည်။
      date: အများအားဖြင့် ခရစ်နှစ် ၂ ရာစုအတွင်းဟု သတ်မှတ်ကြသည်။ အဓိကကျန်ရှိနေသော ဂရိစာအပိုင်းအစမှာ များစွာနောက်ကျသောခေတ်မှ လက်ရေးမူဖြစ်ပြီး အက်ခမင်မြို့တွင် တွေ့ရှိခဲ့သည်။
    2 Clement:
      display_name: ကလေမင် ဒုတိယစာ
      author: အမည်မသိသူ ရေးသားထားသည်။ အစဉ်အလာခေါင်းစဉ်က ထိုသို့ဆိုသော်လည်း ဤစာသည် ရောမမြို့သား ကလေမင်၏ ဒုတိယစာမဟုတ်ဘဲ အစောပိုင်းခရစ်ယာန်တရားဟောချက်တစ်ရပ် ဖြစ်သည်။
      audience: နောင်တရရန်၊ ကိုယ်ကျင့်တရား၌ တစ်သမတ်တည်းရှိရန်၊ အားနည်းသူများကို စောင့်ရှောက်ရန်နှင့် ရှင်ပြန်ထမြောက်ခြင်း၊ တရားစီရင်ခြင်းတို့ကို မျှော်လင့်လျက် သစ္စာရှိစွာ ကြံ့ကြံ့ခံရန် တိုက်တွန်းခံရသော ခရစ်ယာန်ပရိသတ်အတွက် ဖြစ်သည်။
      date: အများအားဖြင့် ခရစ်နှစ် ၂ ရာစု၏ ပထမပိုင်း သို့မဟုတ် အလယ်ပိုင်း (ခန့်မှန်း ခရစ်နှစ် ၁၀၀–၁၆၀) တွင် ရေးသားခဲ့သည်ဟု သတ်မှတ်ကြသည်။ ရေးသားခဲ့သည့်နေရာမှာ မသေချာပါ။
    Epistle of Barnabas:
      display_name: ဗာနဗ၏ ဩဝါဒစာ
      author: အမည်မသိသူ ရေးသားထားသည်။ ဤစာကို အစဉ်အလာအရ ပေါလု၏အဖော် ဗာနဗနှင့် ဆက်စပ်ခဲ့ကြသော်လည်း ခေတ်သစ်ပညာရှင်များက ထိုသတ်မှတ်ချက်ကို လက်မခံကြပါ။
      audience: အစ္စရေးလူမျိုး၏ ကျမ်းစာများကို ခရစ်တော်ဗဟိုပြု၍ ပုံဆောင်အဓိပ္ပာယ်ဖွင့်ဆိုခြင်းဖြင့် မိမိတို့နှင့်သက်ဆိုင်သည်ဟု ခံယူရန် သွန်သင်ခံရသည့်အပြင်၊ မိမိတို့၏ ပဋိညာဉ်ဆိုင်ရာကိုယ်ပိုင်လက္ခဏာကို ဂျူးလူမျိုးတို့၏ ကျင့်ထုံးများမှ ခွဲခြားသတ်မှတ်ရန် သွန်သင်ခံရသော လူမျိုးခြားခရစ်ယာန်များအတွက် ဖြစ်သည်။
      date: ယေရုရှလင်ဗိမာန်တော် ပျက်စီးခဲ့သည့် ခရစ်နှစ် ၇၀ နှင့် ခရစ်နှစ် ၂ ရာစုအစောပိုင်းကြား၊ မကြာခဏဆိုသလို ခန့်မှန်း ခရစ်နှစ် ၈၀–၁၃၀ အတွင်း ရေးသားခဲ့သည်ဟု သတ်မှတ်ကြသည်။
  chapter_titles:
    Protoevangelium of James:
      '11':
        title: ကောင်းကင်တမန်က မာရိ၏သန့်ရှင်းသောတာဝန်ကို ကြေညာသည်
      '12':
        title: မာရိသည် ဧလိရှဗက်ထံ သွားရောက်ပြီး ပြန်လာသည်
      '13':
        title: မာရိကိုယ်ဝန်ရှိနေသဖြင့် ယောသပ် ဝမ်းနည်းပူဆွေးသည်
      '14':
        title: ယောသပ်၏အိပ်မက်ထဲတွင် ကောင်းကင်တမန် စကားပြောသည်
      '15':
        title: ယဇ်ပုရောဟိတ်က ယောသပ်ကို မတရားပြုသည်ဟု စွပ်စွဲသည်
      '16':
        title: စမ်းသပ်စစ်ဆေးပြီးနောက် ယောသပ်က မာရိကို လွှတ်ပေးသည်
      '17':
        title: မာရိသည် ဗက်လင်မြို့သို့ ခရီးသွားသည်
      '18':
        title: ယောသပ်သည် လှုပ်ရှားမှုရပ်တန့်နေသော လောကကို မြင်သည်
      '19':
        title: ဝမ်းဆွဲဆရာမသည် အပျိုကညာ၏သားဖွားခြင်းကို မြင်သည်
      '20':
        title: ရှာလုံက မာရိကို စစ်ဆေးရာ သူ၏လက် လောင်ကျွမ်းသည်
      '21':
        title: ပညာရှိများက မွေးကင်းစဘုရင်ကို ရှာဖွေကြသည်
      '22':
        title: ဟေရုဒ်မင်းက မွေးကင်းစကလေးများကို သတ်ရန် အမိန့်ပေးသည်
      '23':
        title: ဇာခရိသည် ဟေရုဒ်မင်း၏ ခြိမ်းခြောက်မှုကို ရင်ဆိုင်သည်
      '24':
        title: ဇာခရိသည် သန့်ရှင်းရာဌာန၌ အသတ်ခံရသည်
      '25':
        title: မငြိမ်မသက်ဖြစ်နေစဉ် ယာကုပ်က မှတ်တမ်းရေးသားသည်
      '26':
        title: ဗော့ဒ်မာ ကျူစာလိပ်တွင် ပိုတိုသောမူ ပါရှိသည်
      '27':
        title: ယောသပ်သည် ဗက်လင်မြို့တွင် ဝမ်းဆွဲဆရာမကို ရှာသည်
      '28':
        title: ယောသပ်က မာရိ၏အံ့ဖွယ်ဖြစ်ရပ်ကို ရှင်းပြသည်
      '29':
        title: ရှာလုံသည် ကလေးငယ်ကို ထိတွေ့၍ ရောဂါပျောက်သည်
      '30':
        title: ပညာရှိများက ဂျူးလူမျိုးတို့၏ဘုရင်ကို ရှာဖွေကြသည်
    Infancy Gospel of Thomas:
      '1':
        title: သောမက ယေရှုအကြောင်း ပြောပြသည်
      '2':
        title: ယေရှုသည် ရေကို ကြည်လင်စေပြီး ငှက်ရုပ်များ ပုံဖော်သည်
      '3':
        title: ယေရှုက အန္န၏သားကို ကျိန်ဆိုသည်
      '4':
        title: ယေရှု ကျိန်ဆိုသောကြောင့် ကလေးတစ်ဦး သေဆုံးသည်
      '5':
        title: ယေရှုက ယောသပ်အား ပညာအကြောင်း သွန်သင်သည်
      '6':
        title: ဆရာသည် ယေရှု၏ပညာကြောင့် အခက်တွေ့သည်
      '7':
        title: ဆရာက ယေရှု၏အသိပညာ ပိုမိုမြင့်မားကြောင်း ဝန်ခံသည်
      '8':
        title: ယေရှုသည် ရယ်မော၍ ကုသပေးပြီး ကြေညာသည်
      '9':
        title: ယေရှုသည် ပြုတ်ကျသော ဇေနုန်ကို အသက်ပြန်ရှင်စေသည်
      '10':
        title: ယေရှုသည် သစ်ခုတ်သမား၏ခြေကို ကုသပေးသည်
      '11':
        title: ယေရှုသည် ကွဲနေသောရေအိုးကို အံ့ဖွယ်နည်းဖြင့် ရေပြည့်စေသည်
      '12':
        title: ယောသပ်သည် ယေရှုစိုက်သောမျိုးစေ့မှ သီးနှံရိတ်သိမ်းသည်
      '13':
        title: ယောသပ်သည် ယေရှု၏အကူအညီဖြင့် အိပ်ရာကို ပြီးစီးစေသည်
      '14':
        title: ယေရှုကို စိန်ခေါ်ပြီးနောက် ဆရာ သေဆုံးသည်
      '15':
