payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: ဖိလိပ္ပိမြို့သားများထံ ပေါ်လီကာပ်၏စာ
      author: စမုရနမြို့၏ ဘုန်းတော်ကြီး ပေါ်လီကာပ်။ လက်ရှိရရှိထားသောစာသားသည် အချိန်တစ်ကြိမ်ထက်မက ပေးပို့ခဲ့သည့် အကြောင်းအရာများကို ပေါင်းစပ်ထားခြင်းဖြစ်သည်ဟု ပညာရှင်အချို့က ယူဆကြသည်။
      audience: အစ်ဂနေးရှပ်၏စာများကို တောင်းခံခဲ့ပြီး ယုံကြည်ခြင်း၊ အကျင့်အကြံ၊ ခေါင်းဆောင်မှု၊ ငွေကြေးနှင့် ကြံ့ကြံ့ခံခြင်းတို့အကြောင်း အကြံပေးချက်များ ရရှိခဲ့သော ဖိလိပ္ပိမြို့ရှိ ခရစ်ယာန်အသင်းတော်။
      date: ခရစ်နှစ် ၂ ရာစု အစောပိုင်းမှ အလယ်ပိုင်းအတွင်း။ အနည်းဆုံး တစ်စိတ်တစ်ပိုင်းသည် အစ်ဂနေးရှပ်၏ခရီးစဉ်နှင့် နီးကပ်စွာ ဆက်စပ်နေပြီး၊ စာအများအပြားကို ပေါင်းစပ်ထားခြင်းဖြစ်နိုင်သည်ဟူသော အဆိုများအရ အပိုင်းတစ်ခုမှာ အနည်းငယ် နောက်ကျနိုင်သည်။
    Martyrdom of Polycarp:
      display_name: ပေါ်လီကာပ်၏ မာတုရသေခြင်း
      author: စမုရနမြို့ရှိ အသင်းတော်ကိုယ်စား အမည်မဖော်ဘဲ ရေးသားခဲ့သော အသင်းသားများ။ အဆုံးပိုင်းရှိ လက်ဆင့်ကမ်းကူးယူမှု မှတ်ချက်များသည် နောက်ပိုင်းကာလ၌ မိတ္တူကူးခြင်းနှင့် ပျံ့နှံ့ခြင်းကို ထင်ဟပ်စေသည်။
      audience: ဖိလိုမေလီယမ်မြို့ရှိ အသင်းတော်နှင့် ပိုမိုကျယ်ပြန့်သော ခရစ်ယာန်အသိုင်းအဝိုင်း။ ပေါ်လီကာပ် အဖမ်းခံရခြင်း၊ စစ်ဆေးစီရင်ခံရခြင်း၊ သေဆုံးခြင်းနှင့် စံနမူနာယူဖွယ် ကြံ့ကြံ့ခံခြင်းတို့အကြောင်း မှတ်တမ်းအဖြစ် ပေးပို့ထားသည်။
      date: ပေါ်လီကာပ် သေဆုံးပြီးနောက် ရေးသားခဲ့ပြီး အများအားဖြင့် ခရစ်နှစ် ၂ ရာစု အလယ်ပိုင်း သို့မဟုတ် နှောင်းပိုင်းဟု သတ်မှတ်ကြသည်။ မာတုရသေခြင်း ဖြစ်ပွားသည့် နှစ်အတိအကျနှင့် စာတမ်း၏ နောက်ဆုံးပုံစံ နှစ်ခုလုံးကို ပညာရှင်များ ဆွေးနွေးငြင်းခုံနေဆဲဖြစ်သည်။
    Epistle to Diognetus:
      display_name: ဒိုင်အော့ဂနီးတပ်ထံပေးစာ
      author: အမည်မသိ။ စာရေးသူက မိမိကိုယ်ကို တပည့် သို့မဟုတ် သင်ယူသူဟု ခေါ်ဆိုသော်လည်း သူ့ကိုသော်လည်းကောင်း၊ စာလက်ခံသူ ဒိုင်အော့ဂနီးတပ်ကိုသော်လည်းကောင်း အခိုင်အမာ မည်သူမည်ဝါဟု မဖော်ထုတ်နိုင်ပါ။
      audience: ခရစ်ယာန်ဝတ်ပြုခြင်း၊ ကိုယ်ကျင့်တရား၊ လူမှုအသိုင်းအဝိုင်းအတွင်း ကိုယ်ပိုင်လက္ခဏာ၊ မေတ္တာနှင့် ယုံကြည်ခြင်းသည် အသစ်အဆန်းဟု ထင်ရခြင်းတို့အကြောင်း မေးမြန်းသော ပညာတတ် ခရစ်ယာန်မဟုတ်သူ စူးစမ်းလေ့လာသူတစ်ဦးနှင့် သူကဲ့သို့သော စာဖတ်သူများ။
      date: ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုအစောပိုင်းဟု မကြာခဏ သတ်မှတ်ကြသော်လည်း အဆိုပြုသည့်ကာလများမှာ အလွန်ကွဲပြားကြသည်။ နောက်ဆုံးအခန်းနှစ်ခန်းသည် အခြားစာတစ်စောင်မှ ဖြစ်နိုင်သည်။
    Fragments of Papias:
      display_name: ပါပိယပ်၏ ကျန်ရှိသောစာပိုင်းများ
      author: ပျောက်ဆုံးနေသော ငါးတွဲပါ «သခင်ဘုရား၏ မိန့်ဆိုချက်များအပေါ် ရှင်းလင်းဖွင့်ဆိုချက်များ» ကို ရေးသားခဲ့သည့် ဟေရပေါလိမြို့၏ ဘုန်းတော်ကြီး ပါပိယပ်။ ယနေ့ကျန်ရှိသော စုစည်းမှုမှာ နောက်ပိုင်းစာရေးဆရာများ ထိန်းသိမ်းထားခဲ့သည့် ကိုးကားချက်များနှင့် ပြန်လည်တင်ပြချက်များဖြစ်သည်။
      audience: ယေရှုနှင့် တမန်တော်များအကြောင်း မှတ်မိလက်ဆင့်ကမ်းခဲ့သော သွန်သင်ချက်များကို ရှာဖွေသည့် ရှေးဦးခရစ်ယာန်များ။ ထိုသွန်သင်ချက်များကို အမည်ဖော်ပြထားသော နှုတ်ဖြင့် သက်သေခံလက်ဆင့်ကမ်းမှုနှင့် အနက်ဖွင့်ဆိုမှု အဆင့်ဆင့်မှ စုဆောင်းထားသည်။
      date: ပါပိယပ်၏ စာကို အများအားဖြင့် ခရစ်နှစ် ၂ ရာစုအစောပိုင်း၊ မကြာခဏ ခန့်မှန်းခြေ ခရစ်နှစ် ၁၁၀–၁၃၀ ဟု သတ်မှတ်ကြသည်။ ကျန်ရှိသော စာပိုင်းများကို ခရစ်နှစ် ၂ ရာစုမှစ၍ နောက်ပိုင်းကာလအထိ ရေးသားခဲ့သော စာရေးဆရာများ၏ စာများတွင် တွေ့ရသည်။
  chapter_titles:
    Letters of Ignatius:
      '90':
        title: အစ်ဂနေးရှပ်က ဘုန်းတော်ကြီး ပေါ်လီကာပ်ထံ စာရေးသည်
      '91':
        title: အစ်ဂနေးရှပ်က အမှုတော်တွင် တည်ကြည်ရန် တိုက်တွန်းသည်
      '92':
        title: ထိခိုက်နစ်နာမှုကို ဉာဏ်ပညာဖြင့် ကုစားပါ
      '93':
        title: ပေတုံးကဲ့သို့ ခိုင်မြဲစွာ ရပ်တည်ပါ
      '94':
        title: ဘုရားသခင်၏ သဘောတူညီမှုဖြင့် မုဆိုးမများကို စောင့်ရှောက်ပါ
      '95':
        title: မကောင်းသောအကျင့်များကို ရှောင်၍ ပညာရှိစွာ လက်ထပ်ပါ
      '96':
        title: နာခံပါ၊ အစေခံပါ၊ အတူတကွ တိုးတက်ပါ
      '97':
        title: ပေါ်လီကာပ်က ဆီးရီးယားသို့ ကိုယ်စားလှယ် စေလွှတ်သည်
      '98':
        title: ဂုဏ်ယူဖွယ်လုပ်ရပ်များအတွက် သတင်းစေတမန်များကို စီစဉ်ပါ
    Polycarp to the Philippians:
      '1':
        title: ပေါ်လီကာပ်က ဖိလိပ္ပိမြို့သားများကို နှုတ်ဆက်သည်
      '2':
        title: ခရစ်တော်သည် အပြစ်သားများအတွက် ဆင်းရဲဒုက္ခခံခဲ့သည်
      '3':
        title: ကြည်ညိုမှုနှင့် သမ္မာတရားဖြင့် ဘုရားသခင်ကို အစေခံပါ
      '4':
        title: ပေါ်လီကာပ်က ဖြောင့်မတ်ခြင်းအကြောင်း ရေးသားသည်
      '5':
        title: မုဆိုးမများသည် စိတ်ရင်းမှန်ဖြင့် အစဉ်ဆုတောင်းရမည်
      '6':
        title: သင်းထောက်များသည် ယခု ခရစ်တော်ကို အပြစ်ကင်းစွာ အစေခံကြပါစေ
      '7':
        title: အသက်ကြီးသူများသည် လူတိုင်းအပေါ် သနားကြင်နာပါ
      '8':
        title: အန္တိခရစ်နှင့် မှားယွင်းသောသွန်သင်ချက်များကို ငြင်းပယ်ပါ
      '9':
        title: မျှော်လင့်ခြင်းကို စွဲကိုင်၍ ခရစ်တော်နောက် လိုက်ပါ
      '10':
        title: သစ္စာရှိသော သန့်ရှင်းသူများ၏ စံနမူနာကို လိုက်နာပါ
      '11':
        title: ခိုင်မြဲစွာ ရပ်တည်၍ မေတ္တာဖြင့် အသက်ရှင်ပါ
      '12':
        title: လောဘနှင့် ရုပ်တုကိုးကွယ်ခြင်းကို ယခုပင် ငြင်းပယ်ပါ
      '13':
        title: ပေါ်လီကာပ်က ဖိလိပ္ပိမြို့သားများ၏ ယုံကြည်ခြင်းအတွက် ဆုတောင်းသည်
      '14':
        title: ဆီးရီးယားသို့ ပို့သောစာများကို စောင့်မျှော်နေသည်
      '15':
        title: ခရက်စင်က စာကို အပြစ်တင်စရာမရှိဘဲ ပို့ဆောင်သည်
    Martyrdom of Polycarp:
      '1':
        title: အသင်းတော်က လူတိုင်းထံ ကရုဏာမေတ္တာ ပို့သသည်
      '2':
        title: ပေါ်လီကာပ်၏ မာတုရသေခြင်း အတည်ပြည့်စုံသည်
      '3':
        title: မာတုရများသည် ခရစ်တော်အတွက် ကြံ့ကြံ့ခံကြသည်
      '4':
        title: ဂျာမနီကပ်က သားရဲများကို ရင်ဆိုင်သည်
      '5':
        title: ကွင်တပ်က သတ္တိမခိုင်ဘဲ ကျရှုံးသည်
      '6':
        title: ပေါ်လီကာပ်က လူတိုင်းအတွက် ဆုတောင်းသည်
      '7':
        title: မိမိအိမ်သားကပင် ပေါ်လီကာပ်ကို သစ္စာဖောက်သည်
      '8':
        title: ပေါ်လီကာပ်က မိမိကြမ္မာကို လက်ခံကြိုဆိုသည်
      '9':
        title: ဟေရုဒ်က ပေါ်လီကာပ်အား ငြင်းပယ်ရန် တိုက်တွန်းသည်
      '10':
        title: ကောင်းကင်အသံက ပေါ်လီကာပ်ကို ခွန်အားပေးသည်
      '11':
        title: ပေါ်လီကာပ်က ခရစ်တော်ကို ကဲ့ရဲ့ရန် ငြင်းဆိုသည်
      '12':
        title: ပေါ်လီကာပ်က သေခြင်းခြိမ်းခြောက်မှုများကို လှောင်ပြောင်သည်
      '13':
        title: လူအုပ်က ပေါ်လီကာပ်ကို မီးရှို့ရန် တောင်းဆိုသည်
      '14':
        title: ပေါ်လီကာပ်သည် မီးရှို့မည့်တိုင်၌ ချည်နှောင်ခံရလျက် ဆုတောင်းသည်
      '15':
        title: ပေါ်လီကာပ်က မီးရှို့မည့်တိုင်တွင် ဆုတောင်းသည်
      '16':
        title: မီးလျှံများက ပေါ်လီကာပ်ကို ဝိုင်းပတ်သည်
      '17':
        title: ပေါ်လီကာပ်၏ သွေးက မီးကို ငြိမ်းစေသည်
      '18':
        title: နိကီးတပ်က အုပ်ချုပ်ရေးအရာရှိအား ငြင်းပယ်ရန် တိုက်တွန်းသည်
      '19':
