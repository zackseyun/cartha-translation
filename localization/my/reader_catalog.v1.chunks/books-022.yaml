  book_metadata:
    Testament of Zebulun:
      display_name: ဇာဗုလုန်၏ သေတမ်းစာ
      author: ရေးသားသူအမည်မသိ။ ဘိုးဘေးကြီးဆယ့်နှစ်ပါး၏ သေတမ်းစာများတွင် တစ်စောင်အပါအဝင်ဖြစ်သည်။
      audience: ဂျူးစာဖတ်သူများ (နောက်ပိုင်းတွင် ခရစ်ယာန်စာဖတ်သူများလည်း)။
      date: ဂျူးမူရင်းအနှစ်သာရမှာ ခန့်မှန်းခြေ ဘီစီ ၂ ရာစုမှဖြစ်ပြီး၊ ခရစ်ယာန်တို့၏ တည်းဖြတ်မှုမှာ ခန့်မှန်းခြေ အေဒီ ၁ ရာစုမှ ၂ ရာစုအတွင်း ဖြစ်နိုင်သည်။
