    Gospel of Philip:
      display_name: ဖိလိပ္ပုခရစ်ဝင်
      author: ရေးသားသူအမည်မသိ။ လက်ရေးမူအဆုံးရှိ စာတမ်းအမည်တွင် ဤခေါင်းစဉ်ကို တွေ့ရသော်လည်း ဖိလိပ္ပုက ရေးသားသူဖြစ်ကြောင်း စာတမ်းကိုယ်တိုင် မဖော်ပြပါ။ ယနေ့တိုင် ကျန်ရစ်သည့် တစ်ခုတည်းသော မိတ္တူမှာ နာဂ်ဟာမာဒီ ကိုဒက်စ် II,3 ပါ ကော့ပတစ်ဘာသာစာသား ဖြစ်သည်။
      audience: ဗယ်လင်တီးနီးယန်းပုံစံ စက္ကမင်တယ်ဆိုင်ရာ သွန်သင်ချက်များ—အထူးသဖြင့် ဗတ္တိဇံ၊ ဆီလိမ်းခြင်း၊ ပွဲတော်မင်္ဂလာ၊ ရွေးနုတ်ခြင်း၊ ရှင်ပြန်ထမြောက်ခြင်းနှင့် မင်္ဂလာဆောင်ခန်း ပုံရိပ်များ—ကို သိကျွမ်းသည့် အစောပိုင်းခရစ်ယာန်အသိုင်းအဝိုင်းတစ်ရပ်။
      date: အများအားဖြင့် အေဒီ ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုအစောပိုင်းဟု ခန့်မှန်းကြသည်။ အစောပိုင်းဂရိမူတစ်ရပ်မှ ဘာသာပြန်ထားသော ၄ ရာစု ကော့ပတစ်လက်ရေးမူဖြင့် ထိန်းသိမ်းထားသည်။
  chapter_titles:
    Testament of Issachar:
      '6':
        title: သားစဉ်မြေးဆက်တို့ ပြည်နှင်ဒဏ်ခံရမည်
      '7':
        title: ဣသခါက ဖြောင့်မတ်ခြင်းကို ဆင်ခြင်သုံးသပ်သည်
    Testament of Zebulun:
      '1':
        title: ဘိုးဘေးကြီးက သားတို့အား ဆိုးယုတ်မှုကို သတိပေးသည်
      '2':
        title: ဇာဗုလုန်က နှုတ်ဆိတ်ခဲ့သည့် အပြစ်ကြောင့် ငိုကြွေးသည်
      '3':
        title: အစောင့်များ တွင်းကို စောင့်နေစဉ် ဇာဗုလုန် ဆုတောင်းသည်
      '4':
        title: ကရုဏာရှိသော ဇာဗုလုန်က တွင်းကို စောင့်သည်
      '5':
        title: ကရုဏာတရားက ဇာဗုလုန်၏ မိသားစုကို ဘေးကင်းစေသည်
      '6':
        title: လှေတီထွင်သူက များပြားသော ငါးဖမ်းရလဒ်ကို မျှဝေသည်
      '7':
        title: ဇာဗုလုန်က စိတ်နှလုံးရိုးဖြောင့်စွာ ရက်ရောရန် တိုက်တွန်းသည်
      '8':
        title: ဇာဗုလုန်က ကရုဏာတရားကို သင်ပေးသည်
      '9':
        title: ဇာဗုလုန်က သားစဉ်မြေးဆက်တို့ကို သတိပေးသည်
      '10':
        title: ဇာဗုလုန်က အနာဂတ်ရွေးနုတ်ခြင်းကို ပရောဖက်ပြုသည်
    Testament of Dan:
      '1':
        title: ဒန်က အတိတ်က မနာလိုစိတ်ကို ဝန်ခံသည်
      '2':
        title: ဒန်က အမျက်ဒေါသ၏ ချုပ်ကိုင်မှုကို သတိပေးသည်
      '3':
        title: အမှန်တရားက မျက်စိကန်းစေသော ဒေါသကို အနိုင်ယူသည်
      '4':
        title: ဒေါသက စိတ်ဝိညာဉ်နှင့် စိတ်ကို ဖောက်ပြန်စေသည်
      '5':
        title: နောင်တရခြင်းက ထာဝရငြိမ်သက်ခြင်းကို ဆောင်ကြဉ်းသည်
      '6':
        title: ဘုရားသခင်ကို ကြောက်ရွံ့၍ စာတန်၏ မုသားများကို ငြင်းပယ်ကြလော့
      '7':
        title: ဒန်၏ အရိုးများ ဘိုးဘေးတို့နှင့်အတူ ငြိမ်ဝပ်သည်
    Testament of Naphtali:
      '1':
        title: နဿလိက သူ၏သားတို့ကို ကောင်းချီးပေးသည်
      '2':
        title: ဘုရားသခင်က စိတ်ဝိညာဉ်တိုင်းကို ပြည့်စုံစွာ ပုံသွင်းသည်
      '3':
        title: မကောင်းသောဝိညာဉ်များမှ စိတ်နှလုံးကို စောင့်ရှောက်ကြလော့
      '4':
        title: ပြည်နှင်ဒဏ်သည် ဘုရားသခင်၏ ကယ်တင်ခြင်းဖြင့် အဆုံးသတ်မည်
      '5':
        title: လေဝိ၊ ယုဒနှင့် ယောသပ်တို့ မြင့်မားစွာ တက်လာမည်
      '6':
        title: မုန်တိုင်းက ယာကုပ်၏ မိသားစုကို ကွဲလွင့်စေသည်
      '7':
        title: နဿလိက မှောင်မိုက်သော အမှန်တရားများကို ဖုံးကွယ်သည်
      '8':
        title: ဘုရားသခင်ကို ဂုဏ်ပြုရန် ပညာကို ရှာကြလော့
      '9':
        title: နဿလိ၏ အရိုးများ အမိမြေသို့ ပြန်ရောက်သည်
    Testament of Gad:
      '1':
        title: ဂဒ်က မုန်းတီးမှု၏ အဆိပ်ကို သတိပေးသည်
      '2':
        title: ဂဒ်က ယောသပ်ကို သစ္စာဖောက်ခဲ့ကြောင်း ဝန်ခံသည်
      '3':
        title: စိတ်ဝိညာဉ်ကို ဝါးမျိုသော မုန်းတီးမှုကို ရှောင်ကြလော့
      '4':
        title: မုန်းတီးမှုက အသက်မဟုတ်ဘဲ သေခြင်းကို ဆောင်လာသည်
      '5':
        title: နောင်တရခြင်းက ဘုရားအလင်းကို ဆောင်လာသည်
      '6':
        title: စိတ်နှလုံးမှ ခွင့်လွှတ်၍ ငြိမ်သက်ခြင်းကို ရယူကြလော့
      '7':
        title: ရန်သူများ ကြွယ်ဝချမ်းသာရန် ဆုတောင်းပေးကြလော့
      '8':
        title: သွန်သင်ချက်များကို နောင်လာမည့် သားတို့ထံ လက်ဆင့်ကမ်းကြလော့
    Testament of Asher:
      '1':
        title: အာရှာက သားသမီးတို့အား ဖြောင့်မတ်စွာ သွန်သင်သည်
      '2':
        title: ဟန်ဆောင်ဖုံးကွယ်ထားသော ဆိုးယုတ်မှုကို လုံးဝ ရှုတ်ချသည်
      '3':
