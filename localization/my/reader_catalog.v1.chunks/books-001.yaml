payload:
  book_metadata:
    Genesis:
      display_name: ကမ္ဘာဦးကျမ်း
      author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ မောရှေရေးသားသည်ဟု ယူဆကြသည်။ ခေတ်သစ်ပညာရှင်များကမူ အချိန်ကာလရှည်ကြာစွာ ဖွဲ့စည်းလာခဲ့ပြီး နောက်ပိုင်းတွင် ရင်းမြစ်အမျိုးမျိုးကို စုစည်းတည်းဖြတ်ထားသည်ဟု ရှုမြင်ကြသည်။
      audience: ဘုရားသခင်၏ ဖန်ဆင်းခြင်း၊ ရွေးကောက်ခြင်းနှင့် ကတိတော်တို့၌ မိမိတို့လူမျိုး၏ မူလဇာတ်ကြောင်းကို အခြေတည်လျက် ပဋိညာဉ်ခံလူမျိုးအဖြစ် မည်သူတို့ဖြစ်ကြောင်း နားလည်စေရန် ဣသရေလလူမျိုးအတွက် ရည်ရွယ်သည်။
      date: ရာစုနှစ်များတစ်လျှောက် ဖွဲ့စည်းရေးသားခဲ့သည်။ ဗာဗုလုန်ပြည်သို့ ဖမ်းဆီးခေါ်ဆောင်ခံရသည့်ကာလအတွင်း သို့မဟုတ် ထိုကာလနောက်ပိုင်း၊ ခန့်မှန်းအားဖြင့် ဘီစီ ၆ ရာစုမှ ၅ ရာစုအတွင်း ယနေ့လက်ခံထားသည့် ပုံစံသို့ ရောက်ရှိခဲ့သည်။
      summary: ကမ္ဘာဦးကျမ်းတွင် ဖန်ဆင်းခြင်း၊ လူသားတို့၏ ပုန်ကန်မှုနှင့် အရပ်ရပ်သို့ ကွဲပြားပျံ့နှံ့သွားခြင်းအကြောင်း၊ ထို့ပြင် ဣသရေလအတွက် ဘုရားသခင်၏ ပဋိညာဉ်ကတိတော်များ စတင်ရာ အာဗြဟံ၊ ဣဇာက်၊ ယာကုပ်နှင့် ယောသပ်တို့၏ မိသားစုအကြောင်းကို ပြောပြထားသည်။
    Exodus:
      display_name: ထွက်မြောက်ရာကျမ်း
      author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ မောရှေရေးသားသည်ဟု ယူဆကြသည်။ ခေတ်သစ်ပညာရှင်များကမူ အချိန်ကာလရှည်ကြာစွာ ဖွဲ့စည်းလာခဲ့ပြီး နောက်ပိုင်းတွင် ရင်းမြစ်အမျိုးမျိုးကို စုစည်းတည်းဖြတ်ထားသည်ဟု ရှုမြင်ကြသည်။
      audience: လွတ်မြောက်ပြီး ပဋိညာဉ်ခံလူမျိုးဖြစ်လာသော ဣသရေလသည် ဘုရားသခင်၏ ပညတ်တရားအောက်၌ ထာဝရဘုရား၏ လူမျိုးဖြစ်ခြင်း၏ အဓိပ္ပာယ်ကို သင်ယူစေရန် ရည်ရွယ်သည်။
      date: ရာစုနှစ်များတစ်လျှောက် ဖွဲ့စည်းရေးသားခဲ့ပြီး ခန့်မှန်းအားဖြင့် ဘီစီ ၆ ရာစုမှ ၅ ရာစုအတွင်း ယနေ့လက်ခံထားသည့် ပုံစံသို့ ရောက်ရှိခဲ့သည်။
    Leviticus:
      display_name: ဝတ်ပြုရာကျမ်း
      author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ မောရှေရေးသားသည်ဟု ယူဆကြသည်။ ခေတ်သစ်ပညာရှင်များကမူ ယဇ်ပုရောဟိတ်ဆိုင်ရာ ရင်းမြစ်တွင် ပါဝင်သည်ဟု သတ်မှတ်ကြသည်။
      audience: ဣသရေလယဇ်ပုရောဟိတ်များနှင့် ဝတ်ပြုကိုးကွယ်သည့် အသိုင်းအဝိုင်းအတွက် ဖြစ်ပြီး ယဇ်ပူဇော်ခြင်း၊ သန့်ရှင်းခြင်းနှင့် ဘုရားသခင်၏ မျက်မှောက်တော်ကို ဗဟိုပြု၍ ဘဝကို စီမံနေထိုင်ခြင်းဆိုင်ရာ ညွှန်ကြားချက်များ ပေးထားသည်။
      date: ဘုရင်စနစ်နှောင်းပိုင်းမှ ပြည်နှင်ခံရပြီးနောက်ကာလအထိ ရေးဖွဲ့မှုအလွှာများ ပါဝင်ပြီး ခန့်မှန်းအားဖြင့် ဘီစီ ၇ ရာစုမှ ၅ ရာစုအတွင်း ဖြစ်သည်။
  chapter_titles:
    Genesis:
      '1':
        title: ဘုရားသခင်သည် ကောင်းကင်နှင့် မြေကြီးကို ဖန်ဆင်းတော်မူခြင်း
      '2':
        title: ဘုရားသခင်သည် ယောက်ျားနှင့် မိန်းမကို ပုံဖော်တော်မူခြင်း
      '3':
        title: လူသားတို့ ဧဒင်ဥယျာဉ်မှ ကျဆုံးခြင်း
      '4':
        title: ကာဣနက ညီအာဗေလကို သတ်ခြင်း
      '5':
        title: အာဒံမှ နောဧအထိ မျိုးရိုးစဉ်ဆက်
      '6':
        title: ဘုရားသခင်သည် အပြစ်ကို ရေလွှမ်းမိုးခြင်းဖြင့် တရားစီရင်ခြင်း
      '7':
        title: ရေလွှမ်းမိုးရာ မြေကြီးကို ဖုံးလွှမ်းခြင်း
      '8':
        title: နောဧသည် သင်္ဘောမှထွက်၍ ဘုရားသခင်ကို ဝတ်ပြုခြင်း
      '9':
        title: ရေလွှမ်းမိုးပြီးနောက် နောဧ၏ မိသားစု
      '10':
        title: နောဧမှ ဆင်းသက်သူတို့ အရပ်ရပ်သို့ ပျံ့နှံ့ခြင်း
      '11':
        title: ဗာဗေလမျှော်စင်၌ ဘာသာစကားရှုပ်ထွေး၍ လူတို့ ကွဲပြားသွားခြင်း
      '12':
        title: အာဗြံသည် နာခံ၍ ခါနာန်ပြည်သို့ ထွက်ခွာခြင်း
      '13':
        title: အာဗြံသည် ကြွယ်ဝစွာ ပြန်လာ၍ ဆုတောင်းခြင်း
      '14':
        title: အာဗြံသည် ကျူးကျော်သူတို့လက်မှ လောတကို ကယ်တင်ခြင်း
      '15':
        title: ဘုရားသခင်က အာဗြံအား သားစဉ်မြေးဆက် ပေးမည်ဟု ကတိပြုခြင်း
      '16':
        title: ဟာဂရသည် ထွက်ပြေး၍ တောကန္တာရရှိ စမ်းရေတွင်းသို့ ရောက်ခြင်း
      '17':
        title: အာဗြဟံ အရေဖျားလှီးခံ၍ ဘုရားသခင်က ပဋိညာဉ်ကို အသစ်ပြုခြင်း
      '18':
        title: ဘုရားသခင်က အာဗြဟံအား သားတစ်ဦး ပေးမည်ဟု ကတိပြုခြင်း
      '19':
        title: လောတသည် မီးလောင်သော မြို့များမှ ထွက်ပြေးခြင်း
      '20':
        title: သတိပေးခံရပြီးနောက် အဘိမလက်က စာရာကို ပြန်ပေးခြင်း
      '21':
        title: စာရာသည် အာဗြဟံအတွက် ဣဇာက်ကို မွေးဖွားခြင်း
      '22':
        title: အာဗြဟံသည် မောရိယတောင်ပေါ်တွင် ဣဇာက်ကို ပူဇော်ခြင်း
      '23':
        title: စာရာသေဆုံး၍ အာဗြဟံက မြေဝယ်ခြင်း
      '24':
        title: အစေခံက ဣဇာက်အတွက် ရေဗက္ကကို ရှာတွေ့ခြင်း
      '25':
        title: အာဗြဟံ၏ သားစဉ်မြေးဆက်နှင့် သေဆုံးခြင်းမှတ်တမ်း
      '26':
        title: ဣဇာက်သည် ဂေရာမြို့တွင် ကာကွယ်စောင့်ရှောက်ခံရ၍ နေထိုင်ခြင်း
      '27':
        title: ယာကုပ်သည် ဣဇာက်ကို လှည့်စား၍ ကောင်းချီးရယူခြင်း
      '28':
        title: ယာကုပ်သည် ကောင်းကင်တမန်များရှိသော လှေကားကို အိပ်မက်မြင်ခြင်း
      '29':
        title: ယာကုပ်သည် ရာခေလကို ချစ်၍ လေအာနှင့် ဆုံတွေ့ခြင်း
      '30':
        title: ယာကုပ်သည် ကရုဏာတော်ကြောင့် ကြွယ်ဝလာခြင်း
      '31':
        title: ယာကုပ်သည် လာဗန်၏ အမျက်ဒေါသကို ကြောက်ရွံ့ခြင်း
      '32':
        title: ယာကုပ်သည် ဘုရားသခင်၏ ကောင်းကင်တမန်နှင့် နပန်းလုံးခြင်း
      '33':
        title: ယာကုပ်နှင့် ဧသော ငြိမ်းချမ်းစွာ တွေ့ဆုံခြင်း
      '34':
        title: ရှေခင်က ဒိနကို ရက်စက်စွာ မတရားပြုခြင်း
      '35':
        title: ယာကုပ်သည် ဗေသလရှိ ယဇ်ပလ္လင်သို့ ပြန်လာခြင်း
      '36':
        title: စိရပြည်ရှိ ဧသော၏ သားစဉ်မြေးဆက်
      '37':
        title: ယောသပ်၏ အစ်ကိုတို့က သူ့ကို ဈေးပေါပေါဖြင့် ရောင်းစားခြင်း
      '38':
        title: တာမာသည် ယုဒ၏ သားများကို လျှို့ဝှက်စွာ မွေးဖွားခြင်း
      '39':
        title: ယောသပ်သည် ပေါတိဖာ၏ အိမ်တွင် အောင်မြင်ခြင်း
      '40':
        title: ဖာရောဘုရင်၏ အရာရှိတို့ အိပ်မက်မက်၍ ကြောက်ရွံ့ခြင်း
      '41':
        title: ယောသပ်သည် ဖာရောဘုရင်၏ အိပ်မက်များကို အနက်ဖွင့်ခြင်း
      '42':
        title: ယာကုပ်သည် သားတို့ကို စပါးဝယ်ရန် စေလွှတ်ခြင်း
      '43':
        title: ဗင်္ယာမိန်သည် အစ်ကိုတို့နှင့်အတူ အီဂျစ်ပြည်သို့ လိုက်ပါခြင်း
      '44':
        title: ယုဒသည် ဗင်္ယာမိန်၏ အသက်အတွက် အသနားခံခြင်း
      '45':
        title: ယောသပ်နှင့် အစ်ကိုတို့ ပြန်လည်ဆုံစည်းခြင်း
      '46':
        title: ဣသရေလသည် ဂေါရှင်ပြည်သို့ ဘေးကင်းစွာ ခရီးသွားခြင်း
      '47':
        title: ယောသပ်သည် မိသားစုကို အစာကျွေးမွေးခြင်း
      '48':
        title: ယာကုပ်သည် ယောသပ်၏ သားတို့ကို ဉာဏ်ပညာဖြင့် ကောင်းချီးပေးခြင်း
      '49':
        title: ယာကုပ်သည် သားတို့၏ အနာဂတ်အကြောင်း ပရောဖက်ပြုခြင်း
      '50':
        title: ယောသပ်သည် ယာကုပ်၏ နောက်ဆုံးဆန္ဒကို ဖြည့်ဆည်းခြင်း
    Exodus:
      '1':
        title: ဘုရားသခင်သည် ဣသရေလလူမျိုး တိုးပွားခြင်းကို မျက်နှာသာပေးခြင်း
      '2':
        title: မောရှေသည် ဖာရောဘုရင်၏ လက်မှ ကယ်တင်ခံရခြင်း
      '3':
        title: မောရှေသည် ဘုရားသခင်၏ ခေါ်တော်မူသံကို ကြားခြင်း
      '4':
        title: မောရှေသည် ဘုရားသခင်၏ တန်ခိုးတော်နှင့် ရင်ဆိုင်ခြင်း
      '5':
        title: ဖာရောဘုရင်သည် မိမိစိတ်နှလုံးကို ခိုင်မာစေခြင်း
      '6':
        title: ထာဝရဘုရားက ကယ်တင်မည်ဟု ကတိပြုခြင်း
      '7':
        title: အာရုန်နှင့် မောရှေတို့ ရင်ဆိုင်ပြောဆိုခြင်း
      '8':
