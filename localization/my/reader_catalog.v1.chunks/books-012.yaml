payload:
  book_metadata:
    1 Corinthians:
      display_name: ကောရိန္သုဩဝါဒစာ ပထမစောင်
      author: ပေါလုနှင့် သောသင်။
      audience: သဘောထားကွဲလွဲ၍ ပဋိပက္ခများနေသော ကောရိန္သုမြို့ရှိ ခရစ်ယာန်အသင်းတော်။
      date: ခရစ်နှစ် ၅၃–၅၅ ဝန်းကျင်၊ ဧဖက်မြို့မှ ရေးသားခဲ့သည်။
    2 Corinthians:
      display_name: ကောရိန္သုဩဝါဒစာ ဒုတိယစောင်
      author: ပေါလုနှင့် တိမောသေ။
      audience: နာကျင်ဖွယ် ပဋိပက္ခတစ်ရပ် ဖြစ်ပွားပြီးနောက် ကောရိန္သုမြို့ရှိ အသင်းတော်။
      date: ခရစ်နှစ် ၅၅–၅၆ ဝန်းကျင်။
    Galatians:
      display_name: ဂလာတိဩဝါဒစာ
      author: ပေါလု။
      audience: အရေဖျားလှီးခြင်းနှင့် တိုရာကျမ်းပညတ်များကို လိုက်နာရန် ဖိအားပေးခံနေရသော ဂလာတိပြည် (အာနာတိုလီယာအလယ်ပိုင်း) ရှိ ခရစ်ယာန်အသင်းတော်များ။
      date: ခရစ်နှစ် ၄၈–၅၅ ဝန်းကျင် (ပညာရှင်များအကြား အငြင်းပွားဆဲ)။
    Ephesians:
      display_name: ဧဖက်ဩဝါဒစာ
      author: ပေါလု၊ သို့မဟုတ် ပေါလု၏အမည်ဖြင့် ရေးသားသော သူနှင့်ရင်းနှီးသည့် တပည့်တစ်ဦး (အငြင်းပွားဆဲ)။
      audience: အာရှဒေသရှိ ခရစ်ယာန်စာဖတ်သူများအတွက် ယေဘုယျအားဖြင့် ရည်ရွယ်ထားသည်။ အစောဆုံးလက်ရေးမူများတွင် “ဧဖက်” ဟူသော နေရာအမည် မပါရှိပါ။
      date: ပေါလုရေးသားခဲ့လျှင် ခရစ်နှစ် ၆၀ ပြည့်လွန်နှစ်များဝန်းကျင်၊ ပေါလု၏အမည်ဖြင့် အခြားသူရေးသားခဲ့လျှင် ခရစ်နှစ် ၈၀ ပြည့်လွန်နှစ်များမှ ၉၀ ပြည့်လွန်နှစ်များဝန်းကျင်။
    Philippians:
      display_name: ဖိလိပ္ပိဩဝါဒစာ
      author: ပေါလုနှင့် တိမောသေ။
      audience: မက်ဆီဒိုးနီးယားပြည်ရှိ ရောမကိုလိုနီမြို့တစ်မြို့ဖြစ်သော ဖိလိပ္ပိမြို့မှ ခရစ်ယာန်အသင်းတော်။
      date: ခရစ်နှစ် ၆၀–၆၂ ဝန်းကျင်၊ အကျဉ်းကျနေစဉ် ရေးသားခဲ့သည်။
    Colossians:
      display_name: ကောလောသဲဩဝါဒစာ
      author: ပေါလုနှင့် တိမောသေ၊ သို့မဟုတ် ပေါလု၏အမည်ဖြင့် ရေးသားသော သူနှင့်ရင်းနှီးသည့် တပည့်တစ်ဦး (အငြင်းပွားဆဲ)။
      audience: ဘာသာရေးအယူအဆများ ရောနှောထားသည့် သွန်သင်ချက်တစ်ရပ်နှင့် ရင်ဆိုင်နေရသော လိုင်ကပ်ချိုင့်ဝှမ်း၊ ကောလောသဲမြို့ရှိ ခရစ်ယာန်များ။
      date: ပေါလုရေးသားခဲ့လျှင် ခရစ်နှစ် ၆၀–၆၂ ဝန်းကျင်၊ ပေါလု၏အမည်ဖြင့် အခြားသူရေးသားခဲ့လျှင် ထို့ထက်နောက်ကျနိုင်သည်။
    1 Thessalonians:
      display_name: သက်သာလောနိတ်ဩဝါဒစာ ပထမစောင်
      author: ပေါလု၊ သိလွာနုနှင့် တိမောသေ။
      audience: ညှဉ်းပန်းနှိပ်စက်မှုနှင့် ရင်ဆိုင်နေရသော သက်သာလောနိတ်မြို့ရှိ စတင်ဖွဲ့စည်းခါစ ခရစ်ယာန်အသင်းတော်။
      date: ခရစ်နှစ် ၅၀–၅၁ ဝန်းကျင်။ ယနေ့တိုင် ကျန်ရှိသည့် ပေါလု၏စာများအနက် အစောဆုံးဖြစ်ဖွယ်ရှိသည်။
    2 Thessalonians:
      display_name: သက်သာလောနိတ်ဩဝါဒစာ ဒုတိယစောင်
      author: ပေါလု (အငြင်းပွားဆဲဖြစ်ပြီး ပေါလု၏အမည်ဖြင့် အခြားသူရေးသားခဲ့သည်ဟု ပညာရှင်အချို့က ယူဆကြသည်)။
      audience: နောက်ဆုံးကာလဆိုင်ရာ အယူအဆရှုပ်ထွေးမှုကို ဖြေရှင်းပေးရန် ရည်ရွယ်ထားသော သက်သာလောနိတ်မြို့ရှိ အသင်းတော်။
      date: ပေါလုရေးသားခဲ့လျှင် ခရစ်နှစ် ၅၁ ဝန်းကျင်။
    1 Timothy:
      display_name: တိမောသေဩဝါဒစာ ပထမစောင်
      author: ပေါလု၊ သို့မဟုတ် ပေါလု၏အမည်ဖြင့် ရေးသားသော တပည့်တစ်ဦး (သင်းအုပ်ဆိုင်ရာဩဝါဒစာများကို ပေါလု၏အမည်ဖြင့် အခြားသူရေးသားခဲ့သည်ဟု ကျယ်ကျယ်ပြန့်ပြန့် ယူဆကြသည်)။
      audience: ဧဖက်မြို့တွင် ပေါလု၏ကိုယ်စားလှယ်အဖြစ် ဆောင်ရွက်သော တိမောသေအတွက်ဖြစ်ပြီး နောက်ပိုင်းအသင်းတော် စီမံဖွဲ့စည်းပုံအတွက် လမ်းညွှန်ချက်များလည်း ပါဝင်သည်။
      date: ပေါလုရေးသားခဲ့လျှင် ခရစ်နှစ် ၆၀ ပြည့်လွန်နှစ်များအလယ်ပိုင်းဝန်းကျင်၊ ပေါလု၏အမည်ဖြင့် အခြားသူရေးသားခဲ့လျှင် ခရစ်နှစ် ၉၀–၁၁၀ ဝန်းကျင်။
    2 Timothy:
      display_name: တိမောသေဩဝါဒစာ ဒုတိယစောင်
      author: ပေါလု၊ သို့မဟုတ် ပေါလု၏အမည်ဖြင့် ရေးသားသော တပည့်တစ်ဦး။
      audience: တိမောသေအတွက်ဖြစ်ပြီး အကျဉ်းကျနေသော ပေါလု၏ နှုတ်ဆက်အမှာစာအဖြစ် ပုံဖော်ရေးသားထားသည်။
      date: ပေါလုရေးသားခဲ့လျှင် ခရစ်နှစ် ၆၀ ပြည့်လွန်နှစ်များအလယ်ပိုင်းဝန်းကျင်၊ ပေါလု၏အမည်ဖြင့် အခြားသူရေးသားခဲ့လျှင် ခရစ်နှစ် ၉၀–၁၁၀ ဝန်းကျင်။
    Titus:
      display_name: တိတုဩဝါဒစာ
      author: ပေါလု၊ သို့မဟုတ် ပေါလု၏အမည်ဖြင့် ရေးသားသော တပည့်တစ်ဦး။
      audience: ကရေတေကျွန်းတွင် ပေါလု၏ကိုယ်စားလှယ်အဖြစ် ဆောင်ရွက်သော တိတု။
      date: ပေါလုရေးသားခဲ့လျှင် ခရစ်နှစ် ၆၀ ပြည့်လွန်နှစ်များအလယ်ပိုင်းဝန်းကျင်၊ ပေါလု၏အမည်ဖြင့် အခြားသူရေးသားခဲ့လျှင် ခရစ်နှစ် ၉၀–၁၁၀ ဝန်းကျင်။
    Philemon:
      display_name: ဖိလေမုန်ဩဝါဒစာ
      author: ပေါလုနှင့် တိမောသေ။
      audience: ခရစ်ယာန်ကျွန်ပိုင်ရှင် ဖိလေမုန်ထံ သူ့ထံမှ ထွက်ပြေးသွားသော ကျွန်ဩနေသိမ်အကြောင်း ရေးသားထားသည်။
      date: ခရစ်နှစ် ၆၀–၆၂ ဝန်းကျင်။
    Hebrews:
      display_name: ဟေဗြဲဩဝါဒစာ
      author: ရေးသူအမည်မသိပါ။ အစဉ်အလာအရ ပေါလု၊ အာပေါလု၊ ဗာနဗ၊ ပြစ်ကိလနှင့် အခြားသူများ၏အမည်ကို အဆိုပြုခဲ့ကြသော်လည်း မည်သည့်အဆိုကိုမျှ ပညာရှင်အများစုက သဘောတူလက်ခံထားခြင်း မရှိပါ။
      audience: မိမိတို့၏ ခရစ်ယာန်ယုံကြည်ဝန်ခံမှုမှ ပြန်လည်ဝေးကွာသွားရန် သွေးဆောင်ခံနေရသော ဂရိစကားပြော ဂျူးခရစ်ယာန်များ။
      date: ခရစ်နှစ် ၆၀–၉၅ ဝန်းကျင်။
  chapter_titles:
    Romans:
      '11':
        title: ကျေးဇူးတော်အားဖြင့် လူမျိုးခြားတို့ကို ခေါ်တော်မူခြင်း
      '12':
        title: အသက်ရှင်သော ယဇ်အဖြစ် မိမိတို့၏ဘဝကို ဆက်ကပ်ခြင်း
      '13':
        title: အာဏာပိုင်တို့ကို နာခံ၍ ချစ်ခြင်းမေတ္တာထားခြင်း
      '14':
        title: ယုံကြည်ခြင်းအားနည်းသူတို့ကို လက်ခံခြင်း
      '15':
        title: ဂျူးနှင့် လူမျိုးခြားတို့ စည်းလုံးခြင်း
      '16':
        title: နှုတ်ခွန်းဆက်စကားများနှင့် သတိပေးချက်များ
    1 Corinthians:
      '1':
        title: လူအားလုံးအတွက် ဘုရားသခင်၏ သစ္စာရှိသော ကြွယ်ဝပြည့်စုံမှု
      '2':
        title: ဘုရားသခင်၏ဝိညာဉ်တော်ထံမှ ဉာဏ်ပညာကို ဖော်ပြခြင်း
      '3':
        title: ကောရိန္သုအသင်းတော်သည် ဘုရားသခင်၏ဗိမာန်တော်ဖြစ်ကြောင်း ပေါလုသတိပေးခြင်း
      '4':
        title: မာနထက် သစ္စာရှိခြင်းက ပိုအရေးကြီးသည်
      '5':
        title: အသင်းတော်၌ စည်းကမ်းထိန်းသိမ်းရန် ပေါလုညွှန်ကြားခြင်း
      '6':
        title: အငြင်းပွားမှုများကို အသင်းတော်အတွင်း ဖြေရှင်းခြင်း
      '7':
        title: အိမ်ထောင်ရေးကို ရိုသေလေးစားရန် ပေါလုသွန်သင်ခြင်း
      '8':
        title: ကိုယ်ပိုင်လွတ်လပ်ခွင့်ထက် ချစ်ခြင်းမေတ္တာကို ဦးစားပေးခြင်း
      '9':
        title: ပေါလုက မိမိ၏တမန်တော်အရာကို လွတ်လပ်စွာ ကာကွယ်ပြောဆိုခြင်း
      '10':
        title: ဘုရားသခင်၏လူတို့အတွက် အစ္စရေး၏ သတိပေးသင်ခန်းစာ
      '11':
        title: ဝတ်ပြုကိုးကွယ်ရာ၌ စည်းလုံးခြင်းက ခရစ်တော်ကို ဂုဏ်ပြုသည်
      '12':
        title: ဝိညာဉ်တော်၏ဆုကျေးဇူးများက အသင်းတော်၏စည်းလုံးမှုကို တည်ဆောက်သည်
      '13':
        title: ချစ်ခြင်းမေတ္တာသည် ဘယ်သောအခါမျှ လက်မလျှော့
      '14':
        title: အထင်ကြီးစေခြင်းထက် ချစ်ခြင်းမေတ္တာကို ဦးစားပေးရန် ပေါလုတိုက်တွန်းခြင်း
      '15':
        title: ခရစ်တော်ထမြောက်၍ သေခြင်းတရား ကျဆုံးခြင်း
      '16':
