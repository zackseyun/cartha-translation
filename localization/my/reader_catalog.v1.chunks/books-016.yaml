      '11':
        title: ဘုရားသခင်သည် ကြွယ်ဝသော ကောင်းချီးများကို ကတိပြုတော်မူသည်
      '12':
        title: ဧနောက်သည် ကျဆုံးသော ကင်းစောင့်များကို ရင်ဆိုင်ပြောဆိုသည်
      '13':
        title: ဧနောက်သည် ကင်းစောင့်များအတွက် ကရုဏာရရန် ငြင်းဆိုသည်
      '14':
        title: ဧနောက်သည် ထင်ရှားပြသော ကောင်းကင်ဘုံဘုန်းအသရေကို မြင်သည်
      '15':
        title: ဘုရားသခင်သည် ကင်းစောင့်များအပေါ် စီရင်ချက်ကို ရှင်းပြတော်မူသည်
      '16':
