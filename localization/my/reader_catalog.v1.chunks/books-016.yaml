      '27':
        title: ဘုရားကို စော်ကားသူများအတွက် ကျိန်ခြင်းခံရသော ချိုင့်ဝှမ်းကို ဖော်ပြသည်
      '28':
        title: အရှေ့ဘက်တောင်များမှ ရေများ ပေါက်ထွက်စီးဆင်းသည်
      '29':
        title: ဧနောက်သည် တရားစီရင်ခြင်းဆိုင်ရာ သစ်ပင်များကို မြင်သည်
      '30':
        title: မကုန်ခန်းနိုင်သော ရေများဖြင့် ပြည့်နေသည့် ချိုင့်ဝှမ်း
      '31':
        title: တောင်များပေါ်၌ သန့်ရှင်းသော ရနံ့များ ပွင့်လန်းသည်
      '32':
        title: ဖြောင့်မတ်ခြင်းဥယျာဉ်ကို ဖော်ပြသည်
