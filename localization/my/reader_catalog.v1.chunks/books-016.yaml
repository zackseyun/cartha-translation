      '54':
        title: ရှင်ဘုရင်များကို မီးလောင်နေသော ချိုင့်ဝှမ်းထဲ ပစ်ချသည်
      '55':
        title: ရှေးကာလမှ စိုးမိုးတော်မူသောအရှင်က နောက်တစ်ဖန် မဖြစ်စေရဟု ကျိန်ဆိုသည်
      '56':
        title: အပြစ်ဒဏ်ပေးသော ကောင်းကင်တမန်များက အာဇာဇေလ၏ အပေါင်းအပါတို့ကို ချည်နှောင်သည်
      '57':
