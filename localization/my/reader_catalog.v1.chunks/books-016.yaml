        title: ကောင်းကင်တံခါးများ၌ ကြယ်တို့၏အမည်များကို ဖော်ပြသည်
      '34':
        title: ကောင်းကင်၏ ရာသီဥတုယန္တရားကို ဖွင့်ပြသည်
      '35':
        title: အနောက်ဘက်တံခါးများသည် အရှေ့ဘက်တံခါးများနှင့် ကိုက်ညီသည်
      '36':
