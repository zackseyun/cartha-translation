      '19':
        title: ကောင်းကင်တမန်များသည် နောက်ဆုံးတရားစီရင်ခြင်းကို ရင်ဆိုင်ရမည်
      '20':
        title: သန့်ရှင်းသော ကင်းစောင့်ကောင်းကင်တမန်များနှင့် သူတို့၏ နယ်ပယ်များ
      '21':
        title: ကြယ်ခုနစ်လုံးကို အနက်ဆုံးချောက်ထဲ၌ သံကြိုးခတ်ထားသည်
      '22':
        title: ဧနောက်သည် ဝိညာဉ်များ၏ လိုဏ်ဂူများကို မြင်သည်
      '23':
        title: ဧနောက်သည် မငြိမ်းနိုင်သောမီးကို မြင်သည်
      '24':
