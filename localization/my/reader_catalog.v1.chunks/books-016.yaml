payload:
  book_metadata:
    1 Enoch:
      display_name: ဧနောက် ပထမစောင်
      author: အမည်မသိ။ ရေလွှမ်းမိုးခြင်းမတိုင်မီခေတ် ဘိုးဘေးဧနောက် ရေးသားခဲ့သယောင် အမည်ခံထားသည်။ သီးခြားကဏ္ဍအမျိုးမျိုးကို စုစည်းထားသော ပေါင်းစပ်လက်ရာတစ်ခုဖြစ်သည်။
      audience: စကြဝဠာအတွင်းရှိ မကောင်းမှု၊ တရားစီရင်ခြင်းနှင့် ပြက္ခဒိန်အကြောင်း ဆင်ခြင်သုံးသပ်ကြသော ဂျူးပရလောကဗျာဒိတ်ဆိုင်ရာ အသိုင်းအဝိုင်းများအတွက် ဖြစ်သည်။ နောက်ပိုင်းတွင် အစောပိုင်းခရစ်ယာန်အသိုင်းအဝိုင်းများ၌လည်း ဖတ်ရှုခဲ့ကြသည်။
      date: ကဏ္ဍများကို ခန့်မှန်းခြေ ဘီစီ ၃ ရာစုမှ အေဒီ ၁ ရာစုအတွင်း စုစည်းခဲ့သည်။ အပြည့်အစုံကို ဂီအဲဇ် (အီသီယိုးပီးယား) ဘာသာဖြင့်သာ ထိန်းသိမ်းထားနိုင်ခဲ့သည်။
  chapter_titles:
    1 Clement:
      '47':
        title: သင်တို့ထံ ပေါလုရေးခဲ့သောစာကို သတိရကြလော့
      '48':
        title: ဖြောင့်မတ်ခြင်းတံခါးသို့ စင်ကြယ်စွာ ဝင်ကြလော့
      '49':
        title: ချစ်ခြင်းမေတ္တာသည် ကျွန်ုပ်တို့ကို ဘုရားသခင်နှင့် ပေါင်းစည်းပေးသည်
      '50':
        title: ချစ်ခြင်းမေတ္တာသည် ဘုရားသခင်ရွေးကောက်ထားသူတို့ကို ပြည့်စုံစေသည်
      '51':
        title: ကျွန်ုပ်တို့၏ အပြစ်များနှင့် အမှားများကို ဝန်ခံကြလော့
      '52':
        title: ဘုရားသခင်အား ချီးမွမ်းခြင်းယဇ် ပူဇော်ကြလော့
      '53':
        title: မောရှေသည် အစ္စရေးအတွက် ရဲဝံ့စွာ ကြားဝင်တောင်းလျှောက်ခဲ့သည်
      '54':
        title: ငြိမ်းချမ်းမှုကို မြတ်နိုးသော ခေါင်းဆောင်များသည် သိုးစုကို ဂုဏ်ပြုကြသည်
      '55':
        title: အမျိုးသမီးများသည် ရဲရင့်သောလုပ်ရပ်များကို လုပ်ဆောင်ခဲ့ကြသည်
      '56':
        title: လမ်းလွဲသူများ နာခံလာရန် ဆုတောင်းကြလော့
      '57':
        title: နှိမ့်ချခြင်းသည် ပညာရှိရာရောက်ကြောင်း ပညာက ကြေညာသည်
      '58':
        title: ဘုရားသခင်ကို ယုံကြည်ကိုးစားလျှင် ထာဝရလုံခြုံမည်
      '59':
        title: ဘုရားသခင်သည် ရွေးကောက်ထားသူတို့ကို စောင့်ရှောက်ရန် ဆုတောင်းကြလော့
      '60':
        title: အပြစ်များကို ခွင့်လွှတ်၍ ခြေလှမ်းများကို လမ်းညွှန်တော်မူပါ
      '61':
        title: ဘုရားသခင်သည် အုပ်စိုးသူတို့ကို ပညာဖြင့် လမ်းညွှန်တော်မူသည်
      '62':
        title: ယုံကြည်ခြင်းက သီလရှိစွာ အသက်ရှင်ရန် သွန်သင်သည်
      '63':
        title: နှိမ့်ချခြင်းသည် ငြိမ်းချမ်းမှုနှင့် ဝမ်းမြောက်မှုကို ဆောင်ကြဉ်းသည်
      '64':
        title: လူအပေါင်းတို့အား ယုံကြည်ခြင်းနှင့် ခံနိုင်ရည် ပေးသနားတော်မူပါ
      '65':
        title: ကိုယ်စားလှယ်များ သတင်းကောင်းနှင့်အတူ ပြန်လာကြသည်
    1 Enoch:
      '1':
        title: ဘုရားသခင်သည် ဖြောင့်မတ်သူနှင့် ဆိုးယုတ်သူတို့ကို တရားစီရင်တော်မူသည်
      '2':
        title: ကောင်းကင်နှင့် မြေကြီးတို့က သက်သေခံကြသည်
      '3':
        title: သစ်ပင်ဆယ့်လေးပင်သည် ဆောင်းရာသီကို ကြံ့ကြံ့ခံသည်
      '4':
