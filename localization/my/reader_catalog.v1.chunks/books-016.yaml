      '37':
        title: ဧနောက်သည် ပညာ၏ ဖွင့်ပြချက်ကို ကြေညာသည်
      '38':
        title: ဖြောင့်မတ်သူများ စုဝေးပြီး အပြစ်သားများ တရားစီရင်ခံရသည်
      '39':
        title: ရွေးကောက်ထားသော သားသမီးများ ကောင်းကင်မှ ဆင်းသက်လာကြသည်
      '40':
