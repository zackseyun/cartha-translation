        title: ဧနောက်သည် ကောင်းကင်ဆိုင်ရာ ပုံဥပမာကို မြင်သည်
      '44':
        title: လျှပ်စီးကြယ်များကို တန်ခိုးဖြင့် ချည်နှောင်ထားသည်
      '45':
        title: ငြင်းပယ်သူများ တရားစီရင်ခံရမည့် ဒုတိယပုံဥပမာ
      '46':
        title: ဧနောက်သည် လူသား၏သားကို မြင်သည်
      '47':
        title: ဖြောင့်မတ်သူတို့၏ သွေးက ကောင်းကင်ဘုံ၌ တုံ့ပြန်သည်
      '48':
        title: ဖြောင့်မတ်ခြင်းစမ်းရေသည် ဝန်းရံလျက်ရှိသည်
      '49':
        title: ရွေးကောက်ခံရသူသည် ဖုံးကွယ်ထားသောအရာများကို တရားစီရင်သည်
      '50':
        title: သန့်ရှင်းသူတို့ အောင်နိုင်ပြီး အပြစ်သားတို့ မကြာမီ ပျက်စီးမည်
      '51':
        title: ရွေးကောက်ခံရသူသည် ဖုံးကွယ်ထားသော ပညာကို ဖော်ပြသည်
      '52':
        title: ဧနောက်သည် သတ္တုတောင်များကို မြင်သည်
      '53':
