payload:
  book_metadata:
    Proverbs:
      display_name: သုတ္တံကျမ်း
      author: စာစုများကို စုစည်းထားသော ကျမ်းဖြစ်သည်။ ခေါင်းစီးများတွင် ရှောလမုန်၊ အာဂုရ၊ လေမွေလနှင့် “ပညာရှိတို့” ကို အမည်ဖော်ပြထားသည်။
      audience: နေ့စဉ်ဘဝအတွက် ပညာတရား၌ လေ့ကျင့်ပျိုးထောင်ခံနေရသော ဣသရေလလူငယ်များ။
      date: ရေးသားပြုစုမှုအလွှာများမှာ ခန့်မှန်းခြေ ဘီစီ ၁၀ ရာစုမှ ၄ ရာစုအတွင်း ဖြစ်သည်။
    Ecclesiastes:
      display_name: ဒေသနာကျမ်း
      author: ရေးသားသူအမည်မသိ။ ဟောပြောသူမှာ “ကိုဟေလက်” ဖြစ်ပြီး အစဉ်အလာအရ ရှောလမုန်ဟု သတ်မှတ်ကြသည်။
      audience: ဤလောက၌ ပညာ၊ စည်းစိမ်နှင့် ကြိုးပမ်းအားထုတ်မှုတို့၏ အကန့်အသတ်များကို ရင်ဆိုင်နေရသော ဣသရေလလူမျိုး။
      date: အာရမိတ်ဘာသာ၏ သက်ရောက်မှုရှိသော ဟီဘရူးအသုံးအနှုန်းများအပေါ် အခြေခံ၍ ခန့်မှန်းခြေ ဘီစီ ၅ ရာစုမှ ၃ ရာစုအတွင်း ဖြစ်နိုင်သည်။
    Song of Solomon:
      display_name: ရှောလမုန်သီချင်း
      author: ရေးသားသူအမည်မသိ။ ခေါင်းစီးတွင် ရှောလမုန်ကို ရည်ညွှန်းထားသည်။
      audience: ကာမဆန္ဒပါသော ချစ်ခြင်းမေတ္တာကို ပဋိညာဉ်ဆိုင်ရာ ရင်းနှီးမှုကို မြင်နိုင်သည့် ရှုထောင့်တစ်ခုအဖြစ် ဖတ်ရှုသော ဣသရေလလူမျိုး၊ ထို့နောက် ယင်းကို ပုံဆောင်သဘောဖြင့် ဖတ်ရှုခဲ့ကြသော ဂျူးနှင့် ခရစ်ယာန်စာဖတ်သူများ။
      date: ပြည်နှင်ဒဏ်ခံရပြီးနောက်ပိုင်း၊ ခန့်မှန်းခြေ ဘီစီ ၅ ရာစုမှ ၃ ရာစုအတွင်း ဖြစ်နိုင်သည်။
  chapter_titles:
    Psalms:
      '104':
        title: ထာဝရဘုရားသည် ဖန်ဆင်း၊ ထောက်ပံ့၍ အသစ်ပြုပြင်တော်မူသည်
      '105':
        title: ပဋိညာဉ်ကို အောက်မေ့သော ဘုရားသခင်အား ကျေးဇူးတင်ကြလော့
      '106':
        title: မေ့လျော့ခဲ့သော်လည်း ထာဝရမေတ္တာဖြင့် ရွေးနုတ်ခံရခြင်း
      '107':
        title: ရွေးနုတ်ခံရသူတို့၊ ထာဝရဘုရားအား ကျေးဇူးတင်ကြလော့
      '108':
        title: ဒါဝိဒ်သည် ကယ်တင်တော်မူရန် ဆုတောင်းသည်
      '109':
        title: ဆိုးယုတ်သော ဖိနှိပ်သူကို ဆန့်ကျင်သည့် အရေးပေါ်အော်ဟစ်ချက်
      '110':
        title: ဒါဝိဒ်သည် သန့်ရှင်းသော ဘုန်းအာနုဘော်ဖြင့် အုပ်စိုးသည်
      '111':
        title: ထာဝရဘုရားအား စိတ်နှလုံးအကြွင်းမဲ့ ချီးမွမ်းကြလော့
      '112':
        title: ဘုရားတရားကိုင်းရှိုင်းသူသည် မင်္ဂလာရှိ၏
      '113':
        title: နှိမ့်ချသူကို ချီးမြှောက်သော ထာဝရဘုရားအား ချီးမွမ်းကြလော့
      '114':
        title: ဣသရေလလူမျိုး ထွက်မြောက်ခြင်းနှင့် သဘာဝလောက၏ တုံ့ပြန်မှု
      '115':
        title: ဘုန်းတော်သည် ထာဝရဘုရားတစ်ပါးတည်း၌သာ ရှိစေသတည်း
      '116':
        title: ကယ်တင်တော်မူသော ထာဝရဘုရားကို ဆာလံဆရာ ချစ်မြတ်နိုးသည်
      '117':
        title: တည်မြဲသောမေတ္တာတော်ကြောင့် ထာဝရဘုရားအား ချီးမွမ်းကြလော့
      '118':
        title: ဆာလံ ၁၁၈ က ကျေးဇူးတင်ရန် ဖိတ်ခေါ်သည်
      '120':
        title: ဆာလံဆရာ အော်ဟစ်သောအခါ အရှင်ဖြေကြားတော်မူသည်
      '121':
        title: ကူမတော်မူခြင်းသည် အရှင်ထံမှ လာ၏
      '122':
        title: ယေရုရှလင်မြို့ ငြိမ်းချမ်းရေးအတွက် ဒါဝိဒ် ဆုတောင်းသည်
      '123':
        title: ဆာလံဆရာသည် ထာဝရဘုရားကို ယုံကြည်လျက် မျှော်ကြည့်သည်
      '124':
        title: ထာဝရဘုရားသည် ဣသရေလကို ဘေးအန္တရာယ်မှ ကယ်တင်တော်မူသည်
      '125':
        title: ယုံကြည်ကိုးစားခြင်းက မတုန်မလှုပ်လုံခြုံမှုကို ပေးသည်
      '126':
        title: ဇိအုန် ပြန်လည်ထူထောင်ခြင်းက အလွန်ကြီးမားသော ဝမ်းမြောက်မှုကို ဆောင်ကြဉ်းသည်
      '127':
        title: ထာဝရဘုရားသည် တည်ဆောက်၍ ကာကွယ်တော်မူသည်
      '128':
        title: ဘုရားသခင်ကို ကြောက်ရွံ့ရိုသေသူတို့သည် မင်္ဂလာရှိကြ၏
      '129':
        title: ဣသရေလ၏ ရန်သူများသည် ငါတို့ကို မနိုင်ကြ
      '130':
        title: ဆာလံဆရာသည် ကရုဏာတော်အတွက် အော်ဟစ်တောင်းလျှောက်သည်
      '131':
        title: ဒါဝိဒ်သည် ဘုရားသခင်ရှေ့တော်၌ ငြိမ်သက်စွာ နားနေသည်
      '132':
        title: ဒါဝိဒ်သည် ထာဝရဘုရား စံတော်မူရာအရပ်ကို ရှာဖွေသည်
      '133':
        title: ဘုရားအလိုတော်နှင့်ညီသော စည်းလုံးညီညွတ်မှုကို ဒါဝိဒ် ချီးမွမ်းသည်
      '134':
        title: ညစောင့်သူတို့သည် ထာဝရဘုရားအား ချီးမွမ်းကြသည်
      '135':
        title: ရုပ်တုတို့ကို အနိုင်ယူသော ထာဝရဘုရားအား ချီးမွမ်းကြလော့
      '136':
        title: အဆုံးမရှိသော မေတ္တာတော်အတွက် ထာဝရဘုရားအား ကျေးဇူးတင်ခြင်း
      '137':
        title: ပြည်နှင်ခံရသူတို့သည် ယေရုရှလင်ကို အောက်မေ့လျက် ငိုကြွေးကြသည်
      '138':
        title: ဒါဝိဒ်သည် လူအများရှေ့တွင် ထာဝရဘုရားအား ကျေးဇူးတင်သည်
      '139':
        title: ဘုရားသခင်၏ ပြည့်စုံသော သိကျွမ်းမှုနှင့် မျက်မှောက်တော်
      '140':
        title: ဘုရားသခင်သည် ဒါဝိဒ်ကို အကြမ်းဖက်မှုမှ ကွယ်ကာတော်မူသည်
      '141':
        title: မိမိစကားကို ထိန်းသိမ်းနိုင်ရန် ဒါဝိဒ် ဆုတောင်းသည်
      '142':
        title: ဒါဝိဒ်သည် အရှင်ထံ အော်ဟစ်တောင်းလျှောက်သည်
      '143':
        title: ဒါဝိဒ်သည် ကရုဏာတော်အတွက် ဆုတောင်းသည်
      '144':
        title: ဒါဝိဒ်သည် ကာကွယ်စောင့်ရှောက်တော်မူရန် ဆုတောင်းသည်
      '145':
        title: ဒါဝိဒ်သည် ဘုရားသခင်၏ ဘုန်းတော်ကို ချီးမွမ်းသည်
      '146':
        title: ငါ့ဝိညာဉ်သည် ဘုရားသခင်အား အစဉ်အမြဲ ချီးမွမ်းသည်
      '147':
        title: ပြန်လည်တည်ဆောက်၍ ကုသပေးသော ထာဝရဘုရားအား ချီးမွမ်းကြလော့
      '148':
        title: ဖန်ဆင်းခံအားလုံး အရှင်ကို ချီးမွမ်းကြသည်
      '149':
        title: အရာခပ်သိမ်း ယာဟ်ကို ချီးမွမ်းကြစေ
      '150':
        title: တူရိယာမျိုးစုံဖြင့် ယာဟ်ကို ချီးမွမ်းကြလော့
    Proverbs:
      '1':
        title: ရှောလမုန်သည် အရှင်ကို ကြောက်ရွံ့ရိုသေရန် သွန်သင်သည်
      '2':
        title: ဘုရားသခင်ကို ရှာဖွေခြင်းမှ ပညာရရှိသည်
      '3':
        title: ဘုရားသခင်ကို ယုံကြည်၍ ပညာကို ရယူလော့
      '4':
        title: အရာခပ်သိမ်းထက် ပညာကို ဦးစားပေးရန် ဖခင်တိုက်တွန်းသည်
      '5':
        title: အိမ်ထောင်ရေးဖောက်ပြန်ခြင်းကို ရှောင်ရန် ဖခင်သတိပေးသည်
      '6':
        title: အပြစ်နှင့် ပျင်းရိခြင်းကို ရှောင်ရန် သတိပေးချက်များ
      '7':
        title: သွေးဆောင်သော အိမ်ထောင်ရေးဖောက်ပြန်မှုနှင့် ဝေးဝေးနေလော့
      '8':
        title: ပညာသည် ရှာဖွေသူတို့ကို လှမ်းခေါ်သည်
      '9':
        title: ပညာက ဖိတ်ခေါ်၍ မိုက်မဲခြင်းက သွေးဆောင်သည်
      '10':
        title: ဖြောင့်မတ်ခြင်းနှင့် ဆိုးယုတ်ခြင်းတို့၏ ဆန့်ကျင်ဘက်များ
      '11':
        title: ဖြောင့်မတ်မှန်ကန်ခြင်းက ကောင်းချီးသို့ ပို့ဆောင်သည်
      '12':
        title: ဖြောင့်မတ်သူတို့သည် ပညာရှိစွာ ကောင်းမွန်သောဘဝကို ရှင်သန်ကြသည်
      '13':
        title: သွန်သင်ဆုံးမမှုကို လက်ခံခြင်းက အသက်ရှင်ခြင်းသို့ ပို့ဆောင်သည်
      '14':
        title: ပညာသည် အိမ်ကို တည်ဆောက်၍ အရှင်ကို ကြောက်ရွံ့ရိုသေသည်
      '15':
        title: နူးညံ့သောစကားက အသက်ရှင်ခြင်းကို ဆောင်ကြဉ်းသည်
      '16':
        title: လူက အစီအစဉ်ချသော်လည်း ရလဒ်ကို ဘုရားသခင် ဦးဆောင်တော်မူသည်
      '17':
        title: ဘုရားသခင်ကို ကြောက်ရွံ့ရိုသေခြင်းက ပညာကို ဆောင်ကြဉ်းသည်
      '18':
        title: ပညာက နားထောင်သော်လည်း မိုက်မဲခြင်းက ဆုံးမမှုကို ငြင်းပယ်သည်
      '19':
        title: စည်းစိမ်ထက် သမာဓိက အမြဲသာလွန်သည်
      '20':
        title: ယစ်မူးခြင်းကို ရှောင်၍ သမာဓိကို တန်ဖိုးထားလော့
      '21':
        title: ဘုရားသခင်သည် စိတ်နှလုံးတို့ကို စစ်ကြော၍ တရားမျှတမှုကို တန်ဖိုးထားတော်မူသည်
      '22':
        title: နှိမ့်ချခြင်းသည် ဘုရားသခင်ကို ပို၍ ဂုဏ်ပြုသည်
      '23':
        title: အစားအသောက်တပ်မက်မှုနှင့် လောဘကို ရှောင်ရန် သတိပေးသည်
      '24':
        title: ဆိုးယုတ်သူတို့ကို မနာလိုနှင့်
      '25':
        title: ပညာက နှိမ့်ချရန် ဖိတ်ခေါ်သည်
      '26':
