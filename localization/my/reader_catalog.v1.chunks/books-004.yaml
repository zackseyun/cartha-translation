payload:
  book_metadata:
    1 Kings:
      display_name: ဓမ္မရာဇဝင် ပထမစောင်
      author: ရေးသားသူအမည် မသိရပါ။ တရားဟောရာကျမ်းအမြင်ဖြင့် ရေးသားထားသော သမိုင်းမှတ်တမ်း၏ အစိတ်အပိုင်းတစ်ခုဖြစ်သည်။
      audience: တိုင်းနိုင်ငံ အဘယ်ကြောင့် ကျဆုံးခဲ့ရသည်ကို မေးမြန်းနေကြသော ပြည်နှင်ခံကာလနှင့် ပြည်နှင်ခံဘဝအပြီးကာလမှ အစ္စရေးလူမျိုး။
      date: ဗာဗုလုန်ပြည်နှင်ခံကာလ၊ ခန့်မှန်း ဘီစီ ၆ ရာစုတွင် နောက်ဆုံးပုံစံသို့ ရောက်ရှိခဲ့သည်။
    2 Kings:
      display_name: ဓမ္မရာဇဝင် ဒုတိယစောင်
      author: ရေးသားသူအမည် မသိရပါ။ တရားဟောရာကျမ်းအမြင်ဖြင့် ရေးသားထားသော သမိုင်းမှတ်တမ်း၏ အစိတ်အပိုင်းတစ်ခုဖြစ်သည်။
      audience: ပြည်နှင်ခံဘဝရောက်နေသော အစ္စရေးလူမျိုး—ကွဲပြားသွားသည့် တိုင်းနိုင်ငံနှစ်ခုကို ဘာသာရေးရှုထောင့်မှ ဆန်းစစ်ပြီး ဗာဗုလုန်၏ သိမ်းပိုက်မှုဖြင့် အဆုံးသတ်ပုံကို ဖော်ပြထားသည်။
      date: ဘီစီ ၅၈၆ နောက်ပိုင်း၊ ခန့်မှန်း ဘီစီ ၆ ရာစုတွင် နောက်ဆုံးပုံစံသို့ ရောက်ရှိခဲ့သည်။
    1 Chronicles:
      display_name: ရာဇဝင်ချုပ် ပထမစောင်
      author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ “ရာဇဝင်ချုပ်ရေးသူ” ဟု ခေါ်ဆိုကြသည်။
      audience: ပါရှန်းခေတ် ယေဟုဒ်ပြည်ရှိ ပြည်နှင်ခံဘဝအပြီး ယုဒလူမှုအသိုင်းအဝိုင်းသည် ဒါဝိဒ်၊ ဗိမာန်တော်နှင့် ဝတ်ပြုကိုးကွယ်ခြင်းတို့ကို ဗဟိုပြု၍ မိမိတို့၏ အမှတ်သညာကို ပြန်လည်အခြေချနေကြသည်။
      date: ခန့်မှန်း ဘီစီ ၄ ရာစု။
    2 Chronicles:
      display_name: ရာဇဝင်ချုပ် ဒုတိယစောင်
      author: ရေးသားသူအမည် မသိရပါ။ ရာဇဝင်ချုပ်ရေးသူဟု ခေါ်ဆိုကြသည်။
      audience: ပြည်နှင်ခံဘဝအပြီး ယုဒလူမှုအသိုင်းအဝိုင်း။
      date: ခန့်မှန်း ဘီစီ ၄ ရာစု။
  chapter_titles:
    2 Samuel:
      '24':
        title: ဒါဝိဒ်သည် ကပ်ဘေးကို ရပ်တန့်စေသည်
    1 Kings:
      '1':
        title: ရှောလမုန်အား ဘုရင်အဖြစ် ဘိသိက်ပေးခြင်း
      '2':
        title: ဒါဝိဒ်သည် ရှောလမုန်အား သစ္စာရှိစွာ မှာကြားသည်
      '3':
        title: ရှောလမုန်သည် ဘုရားသခင်နှစ်သက်သော ဉာဏ်ပညာကို တောင်းခံသည်
      '4':
        title: ရှောလမုန်သည် စနစ်တကျ ခိုင်မာစွာ အုပ်ချုပ်သည်
      '5':
        title: ရှောလမုန်သည် ဗိမာန်တော်ကို တည်ဆောက်၍ ကျော်ကြားလာသည်
      '6':
        title: ဗိမာန်တော်ကို ဂရုတစိုက် စတင်တည်ဆောက်ခြင်း
      '7':
        title: ရှောလမုန်သည် ဗိမာန်တော်အသုံးအဆောင်များကို အပြီးသတ်သည်
      '8':
        title: ရှောလမုန်သည် ဗိမာန်တော်၌ ဆုတောင်းသည်
      '9':
        title: ထာဝရဘုရားသည် ရှောလမုန်နှင့် ပြုသော ပဋိညာဉ်ကို ထပ်မံအတည်ပြုသည်
      '10':
        title: မိဖုရားသည် ရှောလမုန်၏ ဉာဏ်ပညာကို ချီးမွမ်းသည်
      '11':
        title: ရှောလမုန်သည် ယိမ်းယိုင်၍ လမ်းလွဲသွားသည်
      '12':
        title: ရောဗောင်သည် လူတို့၏ အသနားခံချက်ကို ငြင်းပယ်သည်
      '13':
        title: ပရောဖက်သည် ဘုရင်ကို ဖီဆန်ပြီး သေဆုံးသည်
      '14':
        title: ယေရောဗောင်သည် ဘုရားသခင်၏ တရားစီရင်မှုကို ရင်ဆိုင်ရသည်
      '15':
        title: အာသသည် ရုပ်တုများကို သစ္စာရှိစွာ ဖယ်ရှားသည်
      '16':
        title: ထာဝရဘုရားသည် အစ္စရေးဘုရင်များကို တရားစီရင်သည်
      '17':
        title: ဧလိယသည် မုဆိုးမအား အံ့ဖွယ်နည်းဖြင့် ကျွေးမွေးသည်
      '18':
        title: ဧလိယသည် အာဟပ်ကို ရင်ဆိုင်၍ တရားစီရင်သည်
      '19':
        title: ဧလိယသည် ဟောရပ်အရပ်၌ တာဝန်သစ်ကို ရရှိသည်
      '20':
        title: အာဟပ်သည် ဗင်ဟာဒဒ်ကို အသက်ချမ်းသာပေးသည်
      '21':
        title: ယေဇဗေလသည် နာဗုတ်ကို သတ်ရန် စီစဉ်သည်
      '22':
        title: မိက္ခာယု ကြိုတင်ဟောခဲ့သည့်အတိုင်း အာဟပ်သေဆုံးသည်
    2 Kings:
      '1':
        title: အာခဇိသည် ဧလိယကြေညာသော တရားစီရင်မှုကို ရင်ဆိုင်ရသည်
      '2':
        title: ဧလိယသည် လေဘွေဖြင့် ချီဆောင်ခြင်းခံရသည်
      '3':
        title: ယောရံသည် ဧလိရှဲနှင့်အတူ မောဘကို တိုက်ခိုက်သည်
      '4':
        title: ဧလိရှဲသည် လိုအပ်နေသူများကို ကူညီထောက်ပံ့သည်
      '5':
        title: နေမန်သည် နူနာရောဂါမှ သန့်ရှင်းပျောက်ကင်းသည်
      '6':
        title: ဧလိရှဲသည် အာရံ၏ အကြံအစည်များကို ဖော်ထုတ်သည်
      '7':
        title: ရှမာရိပြည်၏ အစာခေါင်းပါးမှု ရုတ်တရက် အဆုံးသတ်သည်
      '8':
        title: ဧလိရှဲသည် ဘုရင်များကို သတိပေး၍ တရားစီရင်သည်
      '9':
        title: ယေဟုသည် အာဟပ်၏ အိမ်သူအိမ်သားများကို ကွပ်မျက်သည်
      '10':
        title: ယေဟုသည် ဗာလကိုးကွယ်မှုကို ဖျက်ဆီးသည်
      '11':
        title: ဗိမာန်တော်အာဏာသိမ်းမှုတွင် ယောရှအား သရဖူဆောင်းပေးသည်
      '12':
        title: ယောရှသည် ဗိမာန်တော်ကို ပြုပြင်သည်
      '13':
        title: အစ္စရေးအပေါ် ကရုဏာပြမှုသံသရာ အဆုံးသတ်သည်
      '14':
        title: အာမဇိသည် ဧဒုံကို အနိုင်ယူသော်လည်း ကျရှုံးသည်
      '15':
        title: ယုဒပြည် တည်ငြိမ်သော်လည်း အစ္စရေး ယိုယွင်းလာသည်
      '16':
        title: အာခတ်သည် အာရှုရိ၏ အကူအညီကို အားကိုးသည်
      '17':
        title: အစ္စရေးသည် မပြတ်ကျူးလွန်သော အပြစ်ကြောင့် ပြည်နှင်ခံရသည်
      '18':
        title: ဟေဇကိသည် ထာဝရဘုရားတစ်ပါးတည်းကိုသာ ယုံကြည်အားကိုးသည်
      '19':
        title: ထာဝရဘုရားသည် ယေရုရှလင်ကို အာရှုရိလက်မှ ကယ်တင်သည်
      '20':
        title: ဟေဇကိ ဆုတောင်း၍ ရောဂါပျောက်ကင်းသည်
      '21':
        title: မနာရှေသည် ယုဒပြည်ကို ဒုစရိုက်ထဲသို့ ဦးဆောင်သည်
      '22':
        title: ယောရှိသည် ပညတ်ကျမ်းကို တွေ့ရှိ၍ နောင်တရသည်
      '23':
        title: ယောရှိသည် ရုပ်တုကိုးကွယ်မှုကို သုတ်သင်၍ ပသခါပွဲကို ပြန်လည်ကျင်းပသည်
      '24':
        title: ဗာဗုလုန်သည် ယေခေါယာခိန်ကို ဖမ်းဆီးခေါ်ဆောင်သည်
      '25':
        title: ယေခေါယာခိန်သည် ဗာဗုလုန်၌ ဂုဏ်ပြုခံရသည်
    1 Chronicles:
      '1':
        title: ဘုရားသခင်သည် အစ္စရေး၏ မျိုးရိုးစဉ်ဆက်ကို ချမှတ်သည်
      '2':
        title: မျိုးဆက်အဆက်ဆက်ရှိ ယုဒ၏ မျိုးရိုး
      '3':
        title: ဒါဝိဒ်၏ အမျိုးအနွယ် ဆက်လက်တည်ရှိသည်
      '4':
        title: ယာဖက်၏ သားစဉ်မြေးဆက်များကို အမည်တပ်ဖော်ပြသည်
      '5':
        title: အရှေ့ဘက်အနွယ်များ မြောက်ဘက်သို့ ပြည်နှင်ခံရသည်
      '6':
        title: လေဝိ၏ ယဇ်ပုရောဟိတ်မျိုးရိုး ဂုဏ်ပြုခံရသည်
      '7':
        title: ဣသခါ၏ ခွန်အားကြီး စစ်သူရဲများ
      '8':
        title: ဗင်ယာမိန်၏ ခေါင်းဆောင်များနှင့် အဆွေအမျိုးများ
      '9':
        title: ယေရုရှလင်သို့ ပြန်လာ၍ ပြန်လည်တည်ဆောက်ခြင်း
      '10':
        title: ရှောလုသည် ဂိလဗောတောင်ပေါ်၌ သေဆုံးသည်
      '11':
        title: ဒါဝိဒ်အား အားလုံး၏ ဘုရင်အဖြစ် ဘိသိက်ပေးသည်
      '12':
        title: စစ်သူရဲများသည် ဒါဝိဒ်၏ နိုင်ငံနှင့် ပူးပေါင်းသည်
      '13':
        title: ဒါဝိဒ်သည် ပဋိညာဉ်သေတ္တာကို ပြန်လည်ယူဆောင်သည်
      '14':
        title: ဒါဝိဒ်သည် ဖိလိတ္တိလူတို့ကို ထပ်မံအနိုင်ယူသည်
      '15':
        title: ပဋိညာဉ်သေတ္တာကို ယေရုရှလင်သို့ ယူဆောင်သည်
      '16':
        title: ဒါဝိဒ်သည် ဗိမာန်တော်ဝတ်ပြုမှုအတွက် တာဝန်များ ခန့်အပ်သည်
      '17':
        title: ဘုရားသခင်သည် ဒါဝိဒ်၏ မင်းဆက်အကြောင်း ကတိပြုသည်
      '18':
        title: ဒါဝိဒ်သည် လူမျိုးများကို အောင်နိုင်သည်
      '19':
        title: ယွာဘသည် အမ္မုန်နှင့် အာရံကို အနိုင်ယူသည်
      '20':
        title: ယွာဘသည် ရဗ္ဗာမြို့ကို သိမ်းပိုက်သည်
      '21':
        title: ဒါဝိဒ်၏ လူဦးရေစာရင်းကြောင့် ကပ်ဘေးကျရောက်သည်
      '22':
        title: ဘုရားသခင်၏ အိမ်တော်ကို တည်ဆောက်ရန် ရှောလမုန် ရွေးချယ်ခံရသည်
      '23':
        title: လေဝိအမျိုးသားများကို အမှုတော်အတွက် စနစ်တကျ ဖွဲ့စည်းသည်
      '24':
        title: ယဇ်ပုရောဟိတ်များကို မဲချ၍ အဖွဲ့ခွဲသည်
      '25':
