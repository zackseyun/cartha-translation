payload:
  book_metadata:
    Sirach:
      display_name: ဆီရက်ကျမ်း
      author: ယေရုရှလင်မြို့သား ယေရှုအာ ဘင် ဧလာဇာ ဘင် စီရာ၊ ဂရိဘာသာသို့ သူ၏မြေးက ဘာသာပြန်ဆိုခဲ့သည်။
      audience: ဟေလေနစ်ခေတ် ယေရုရှလင်မြို့တွင် ဉာဏ်ပညာဆိုင်ရာ လေ့ကျင့်သင်ကြားမှုခံယူနေသော ဂျူးလူငယ်အမျိုးသားများ။
      date: မူရင်းဟီဘရူးကျမ်းမှာ ခန့်မှန်းခြေ ဘီစီ ၁၉၅–၁၇၅၊ ဂရိဘာသာပြန်ကျမ်းမှာ ခန့်မှန်းခြေ ဘီစီ ၁၃၂။
    Baruch:
      display_name: ဗာရုက်ကျမ်း
      author: အမည်မသိစာရေးသူ၊ ယေရမိ၏ အတွင်းရေးမှူး ဗာရုက်ရေးသားသည်ဟု အမည်ခံထားသည်။
      audience: ပြည်နှင်ခံရခြင်း၊ နောင်တရခြင်းနှင့် ဉာဏ်ပညာတို့ကို ဆင်ခြင်နေသော အရပ်ရပ်သို့ ပျံ့နှံ့နေသည့် ဂျူးများ။
      date: ခန့်မှန်းခြေ ဘီစီ ၂ ရာစု။
    1 Maccabees:
      display_name: မက္ကဘီ ပထမစောင်
      author: အမည်မသိစာရေးသူ၊ ဟီဘရူးဘာသာဖြင့် ရေးသားခဲ့သော ယေရုရှလင်မြို့သား စာရေးသူတစ်ဦး ဖြစ်ဖွယ်ရှိသည် (ဂရိဘာသာကျမ်းသာ ကျန်ရစ်သည်)။
      audience: ဟာစမိုနီယန်တော်လှန်ရေးကာလနှင့် ယင်းနောက်ပိုင်းရှိ ဂျူးများအတွက် ဟာစမိုနီယန်မင်းဆက်၏ တရားဝင်မှုကို ဇာတ်ကြောင်းပြန်ဆိုထားသည်။
      date: ခန့်မှန်းခြေ ဘီစီ ၁၀၀။
    2 Maccabees:
      display_name: မက္ကဘီ ဒုတိယစောင်
      author: ကုရေနေမြို့သား ယာသုန်၏ ပိုရှည်လျားသော လက်ရာကို အကျဉ်းချုပ်ရေးသားသည့် အမည်မသိစာရေးသူတစ်ဦး၊ ဂရိဘာသာဖြင့် ရေးဖွဲ့ခဲ့သည်။
      audience: ဂရိစကားပြောသော အရပ်ရပ်သို့ ပျံ့နှံ့နေသည့် ဂျူးများ—ယုံကြည်ချက်အတွက် အသက်စွန့်ခြင်း၊ ဘုရားသခင်၏ စီမံစောင့်ရှောက်မှုနှင့် ရှင်ပြန်ထမြောက်ခြင်းတို့ကို အလေးပေးထားသည်။
      date: ခန့်မှန်းခြေ ဘီစီ ၁၂၄ သို့မဟုတ် ယင်းနောက် မကြာမီ။
  chapter_titles:
    Wisdom of Solomon:
      '7':
        title: ဆုတောင်းခြင်းက ဉာဏ်ပညာနှင့် နားလည်နိုင်စွမ်းကို ဆောင်ကြဉ်းသည်
      '8':
        title: ဉာဏ်ပညာက အုပ်စိုးသူများကို လမ်းပြ၍ ခွန်အားပေးသည်
      '9':
        title: ရှင်ဘုရင်သည် ဘုရားပေးဉာဏ်ပညာအတွက် ဆုတောင်းသည်
      '10':
        title: ဉာဏ်ပညာက ဖြောင့်မတ်သူများကို ကာကွယ်ကယ်တင်သည်
      '11':
        title: ဘုရားသခင်သည် ဆုံးမခြင်းအားဖြင့် ကရုဏာပြတော်မူသည်
      '12':
        title: ရုပ်တုများကို လှောင်ပြောင်ခြင်းက အချည်းနှီးသော မျှော်လင့်ချက်ကို ဖြစ်စေသည်
      '13':
        title: လူတို့သည် အသက်မရှိသော ရုပ်တုများကို ကိုးကွယ်ကြသည်
      '14':
        title: ဘုရားသခင်သည် ပင်လယ်ပြင်၌ သင်္ဘောများကို လမ်းပြတော်မူသည်
      '15':
        title: ဘုရားသခင်၏ ကရုဏာတော်က မှန်ကန်သော ဝတ်ပြုကိုးကွယ်ခြင်းသို့ လမ်းပြသည်
      '16':
        title: ဘုရားသခင်သည် ဖိနှိပ်သူများကို တရားစီရင်စဉ် မိမိလူတို့ကို ထောက်ပံ့တော်မူသည်
      '17':
        title: ကြောက်မက်ဖွယ်ည၏ ပွေ့ဖက်မှုအတွင်း ပိတ်မိခြင်း
      '18':
        title: ဘုရားသခင်သည် အလင်းဖြင့် လမ်းပြတော်မူသည်
      '19':
        title: ဣသရေလအတွက် မိုးတိမ်များ ခွဲထွက်သွားသည်
    Sirach:
      '1':
        title: ဘုရားသခင်သည် ဉာဏ်ပညာကို တိုင်းတာ၍ ပေးသနားတော်မူသည်
      '2':
        title: စမ်းသပ်မှုများက သစ္စာရှိသော အစေခံများကို စစ်ဆေးအတည်ပြုသည်
      '3':
        title: မိဘများကို ရိုသေလျှင် အသက်ရှည်သည်
      '4':
        title: ဖိနှိပ်ခံရသူများကို ကယ်တင်၍ ဉာဏ်ပညာကို ရှာဖွေပါ
      '5':
        title: စည်းစိမ်ကို မကိုးစားဘဲ ဘုရားသခင်ကို ကိုးစားပါ
      '6':
        title: လယ်သမားတစ်ဦးကဲ့သို့ ဉာဏ်ပညာကို ရှာဖွေပါ
      '7':
        title: စိတ်နှလုံးအတွင်း နှိမ့်ချမှုကို နက်ရှိုင်းစွာ ထိန်းသိမ်းပါ
      '8':
        title: မိုက်မဲသူများကို ရှောင်၍ အသက်ကြီးသူများကို ရိုသေလေးစားပါ
      '9':
        title: မနာလိုမှုနှင့် ကာမတပ်မက်မှုကို သတိထားပါ
      '10':
        title: ပညာရှိသော ဦးဆောင်မှုက စနစ်တကျဖြစ်စေသည်
      '11':
        title: ဉာဏ်ပညာက ဆင်းရဲသားကို ချီးမြှင့်သည်
      '12':
        title: ဖြောင့်မတ်သူများကို ကူညီပါ၊ အပြစ်သားများကို မကူညီပါနှင့်
      '13':
        title: ကတ္တရာစေးကို ထိလျှင် ကိုယ်၌ ကပ်ငြိသည်
      '14':
        title: ဉာဏ်ပညာက ထာဝရကောင်းချီးကို ဆောင်ကြဉ်းသည်
      '15':
        title: ဉာဏ်ပညာသည် မိမိကို ရှာဖွေသူများနှင့် ဆုံတွေ့သည်
      '16':
        title: သစ္စာရှိသူတစ်ဦးက မြို့ကို တည်တံ့စေသည်
      '17':
        title: လူသားတို့ကို ဘုရားသခင်၏ ပုံသဏ္ဌာန်တော်နှင့်အညီ ဖန်ဆင်းထားသည်
      '18':
        title: ကောင်းမှုများကို အချည်းနှီးမဖြစ်စေနှင့်
      '19':
        title: အပျော်အပါးနောက် လိုက်သူများ ပျက်စီးကြသည်
      '20':
        title: စကားပြောရာ၌ အချိန်အခါကို သတိထားရန် တိုက်တွန်းချက်
      '21':
        title: ဆုတောင်းပါ၊ အပြစ်မှ ထွက်ပြေးပါ၊ ဉာဏ်ပညာကို ရှာဖွေပါ
      '22':
        title: ပျင်းရိမှုက အရှက်ကွဲခြင်းနှင့် ဝမ်းနည်းခြင်းကို ဖြစ်စေသည်
      '23':
        title: အတွင်းစိတ်ကို ထိန်းသိမ်းနိုင်ရန်နှင့် ဉာဏ်ပညာအတွက် ဆုတောင်းပါ
      '24':
        title: ဉာဏ်ပညာက မိမိကိုယ်ကို ချီးမွမ်း၍ မိန့်ဆိုသည်
      '25':
        title: ဉာဏ်ပညာက ဘုရားသခင်နှင့် လူတို့ကို ဂုဏ်ပြုသည်
      '26':
        title: ဇနီးသည် ဝမ်းမြောက်ခြင်း သို့မဟုတ် နာကျင်ခြင်းကို ဆောင်ကြဉ်းသည်
      '27':
        title: ဖြောင့်မတ်ခြင်းကို လိုက်စား၍ ဂုဏ်ယူစွာ ဝတ်ဆင်ပါ
      '28':
        title: အပြစ်များကို ခွင့်လွှတ်၍ ကရုဏာကို ခံစားရပါ
      '29':
        title: အိမ်နီးချင်းကို ခွင့်လွှတ်၍ ကရုဏာကို ခံစားရပါ
      '30':
        title: သားများကို ဂုဏ်သိက္ခာရှိစွာ ပြုစုပျိုးထောင်ပါ
      '31':
        title: စည်းစိမ်ဥစ္စာက စိုးရိမ်ပူပန်မှုနှင့် နာကျင်မှုကို ဖြစ်စေသည်
      '32':
        title: သူတစ်ပါးကို ဦးစွာ နှိမ့်ချစွာ အစေခံပါ
      '33':
        title: သခင်ဘုရားသည် မိမိကို ကြောက်ရွံ့ရိုသေသူများအား ကာကွယ်တော်မူသည်
      '34':
        title: ရှင်းလင်းသော အဓိပ္ပာယ်မရှိလျှင် အိပ်မက်များက လမ်းလွဲစေနိုင်သည်
      '35':
        title: ခေါင်းဆောင်များသည် နှိမ့်ချ၍ ပညာရှိစွာ နေသင့်သည်
      '36':
        title: သခင်ဘုရားကို ကြောက်ရွံ့ရိုသေခြင်းအားဖြင့် ကယ်တင်ခြင်းရောက်လာသည်
      '37':
        title: မိတ်ဆွေများနှင့် အကြံဉာဏ်ကို ပညာရှိစွာ ရွေးချယ်ပါ
      '38':
        title: ဆရာဝန်များကို ဂုဏ်ပြု၍ အနာပျောက်ရန် ဆုတောင်းပါ
      '39':
        title: ဆီရက်သည် ပညတ်တရားကို ဆည်းကပ်လိုက်နာသူအား ချီးမွမ်းသည်
      '40':
        title: ဘဝ၏ ဝန်ထုပ်ဝန်ပိုးများနှင့် ကောင်းချီးများ
      '41':
        title: သေခြင်းက နောက်ဆုံးအနားယူခြင်းကို ဆောင်ကြဉ်းသည်
      '42':
        title: ခက်ခဲသော်လည်း လိုအပ်သော အကြောင်းအရာများကို ပြောဆိုပါ
      '43':
        title: မိုးကောင်းကင်၏ အံ့ဖွယ်ရာများက ဘုရားသခင်ကို ချီးမွမ်းရန် လှုံ့ဆော်သည်
      '44':
        title: ဘိုးဘေးများသည် ယုံကြည်ခြင်းဖြင့် လမ်းပြခံခဲ့ရသည်
      '45':
        title: မောရှေသည် အားလုံးထက် ဂုဏ်ပြုခံရသည်
      '46':
        title: ယောရှုသည် ဘုရားသခင်၏ လူမျိုးအတွက် တိုက်ခိုက်သည်
      '47':
        title: နာသန်နှင့် ရင်ဆိုင်ရသော ဒါဝိဒ် ချီးမွမ်းခံရသည်
      '48':
        title: ဧလိယသည် လောင်မြိုက်သော စကားများဖြင့် ပရောဖက်ပြုသည်
      '49':
        title: ယောရှိသည် ပြုပြင်ပြောင်းလဲမှုကြောင့် ဂုဏ်ပြုခံရသည်
      '50':
        title: ရှိမုန်သည် မိမိလူမျိုးကို ကောင်းချီးပေးသည်
      '51':
        title: အကျွန်ုပ်၏ ဘုရားသခင်ကို ချီးမွမ်းပါမည်
    Baruch:
      '1':
        title: ဗာရုက်သည် မြစ်နားတွင် အပြစ်ဝန်ခံချက်ကို ဖတ်ကြားသည်
      '2':
        title: သခင်ဘုရားသည် မောရှေအားဖြင့် ပေးထားသော သတိပေးချက်များကို အကောင်အထည်ဖော်တော်မူသည်
      '3':
        title: လူတို့သည် အော်ဟစ်၍ အပြစ်ဝန်ခံကာ ပြန်လှည့်လာကြသည်
      '4':
