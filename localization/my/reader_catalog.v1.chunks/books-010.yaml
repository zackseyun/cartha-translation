payload:
  book_metadata:
    Joel:
      display_name: ယောလ
      author: ပေသွေလ၏သား ယောလ။
      audience: ကျိုင်းကောင်ဘေးကို ထာဝရဘုရား၏နေ့တော်၏ နိမိတ်တစ်ခုအဖြစ် ရင်ဆိုင်တုံ့ပြန်နေသော ပြည်နှင်ဒဏ်လွန်ခေတ် ယုဒပြည်သူများ။
      date: ခန့်မှန်းခြေ ဘီစီ ၅ ရာစုမှ ၄ ရာစုအတွင်း ဖြစ်နိုင်သည်။
    Amos:
      display_name: အာမုတ်
      author: မြောက်ပိုင်းတွင် တရားဟောခဲ့သော ယုဒပြည်သား သိုးထိန်း၊ တေကောမြို့သား အာမုတ်။
      audience: ယေရောဗောင်မင်း ဒုတိယလက်ထက် စီးပွားကြွယ်ဝသော်လည်း မတရားမှုများရှိနေသော မြောက်ပိုင်းဣသရေလနိုင်ငံ။
      date: ခန့်မှန်းခြေ ဘီစီ ၇၆၀–၇၅၀။
    Obadiah:
      display_name: ဩဗဒိ
      author: ဩဗဒိ။
      audience: ဧဒုံပြည်က ယေရုရှလင်မြို့ကို သစ္စာဖောက်ပြီးနောက် ယုဒပြည်သူများအတွက်—ဧဒုံပြည် ပျက်စီးကျဆုံးမည့်အကြောင်း ပရောဖက်ပြုချက်။
      date: ဘီစီ ၅၈၆ နောက် မကြာမီ။
    Jonah:
      display_name: ယောန
      author: ရေးသားသူအမည်မသိ။ အဓိကဇာတ်ကောင်မှာ အမိတ္တဲ၏သား ယောနဖြစ်သည်။
      audience: ပြည်နှင်ဒဏ်လွန်ခေတ် ဣသရေလလူမျိုးအတွက်—မိမိလူမျိုးအတွင်းသာ ကျဉ်းမြောင်းစွာ ပိတ်လှောင်နေမှုကို သရော်ဝေဖန်ပြီး ပြင်ပလူမျိုးများအပေါ် ဘုရားသခင်၏ကရုဏာကို အတည်ပြုထားသည်။
      date: ခန့်မှန်းခြေ ဘီစီ ၅ ရာစုမှ ၄ ရာစုအတွင်း ဖြစ်နိုင်သည်။
    Micah:
      display_name: မိက္ခာ
      author: မောရရှက်မြို့သား မိက္ခာ။
      audience: ဘီစီ ၈ ရာစုနှောင်းပိုင်း ယုဒပြည်သူများ၊ အထူးသဖြင့် မြို့ပြအာဏာရှိလူတန်းစားတို့၏ ဖိနှိပ်မှုကို ခံနေရသော ကျေးလက်ဆင်းရဲသားများ။
      date: ခန့်မှန်းခြေ ဘီစီ ၇၄၀–၇၀၀။
    Nahum:
      display_name: နာဟုံ
      author: ဧလကောရှမြို့သား နာဟုံ။
      audience: မကြာမီ နိနေဝေမြို့ ပျက်စီးကျဆုံးမည့်အရေးကို ဝမ်းမြောက်နေသော ယုဒပြည်သူများ။
      date: ဘီစီ ၆၁၂ မတိုင်မီ မကြာမီ။
    Habakkuk:
      display_name: ဟဗက္ကုတ်
      author: ဟဗက္ကုတ်။
      audience: ဗာဗုလုန်နိုင်ငံ အင်အားကြီးလာမှုကို ရင်ဆိုင်နေရသော ယုဒပြည်သူများအတွက်—တရားမျှတမှုနှင့်ပတ်သက်၍ ပရောဖက်နှင့် ဘုရားသခင်တို့၏ အပြန်အလှန်ပြောဆိုမှု။
      date: ခန့်မှန်းခြေ ဘီစီ ၇ ရာစုနှောင်းပိုင်း။
    Zephaniah:
      display_name: ဇေဖနိ
      author: ကုရှိ၏သား ဇေဖနိ။
      audience: ယောရှိမင်း၏ ပြုပြင်ပြောင်းလဲမှုများ မစတင်မီကာလ၊ သူ၏အုပ်စိုးမှုအောက်ရှိ ယုဒပြည်သူများ။
      date: ခန့်မှန်းခြေ ဘီစီ ၆၄၀–၆၀၉။
    Haggai:
      display_name: ဟဂ္ဂဲ
      author: ဟဂ္ဂဲ။
      audience: ဒါရိမင်းလက်ထက် ဗိမာန်တော်ကို ပြန်လည်တည်ဆောက်နေသော နေရပ်ပြန်လာသူများ။
      date: ဘီစီ ၅၂၀။
    Zechariah:
      display_name: ဇာခရိ
      author: ဗေရခိ၏သား ဇာခရိ။ အခန်းကြီး ၉–၁၄ ကို နောက်ပိုင်းစာရေးသူတစ်ဦးက ရေးသားခဲ့ခြင်း ဖြစ်နိုင်သည်။
      audience: ဗိမာန်တော်ကို ပြန်လည်တည်ဆောက်နေသော နေရပ်ပြန်လာသူများနှင့် နောက်ပိုင်း ပြည်နှင်ဒဏ်လွန်ခေတ် လူမှုအသိုင်းအဝိုင်းများ။
      date: အခန်းကြီး ၁–၈ သည် ခန့်မှန်းခြေ ဘီစီ ၅၂၀–၅၁၈၊ အခန်းကြီး ၉–၁၄ သည် ရာစုနှစ်တစ်ခုခန့် နောက်ပိုင်း ဖြစ်နိုင်သည်။
    Malachi:
      display_name: မာလခိ
      author: ရေးသားသူအမည်မသိ။ “မာလခိ” ဟူသည် “ငါ၏တမန်” ဟု အဓိပ္ပာယ်ရသည်။
      audience: ပါရှားအုပ်ချုပ်မှုအောက်တွင် ဝတ်ပြုကိုးကွယ်ခြင်းနှင့် သစ္စာစောင့်သိခြင်း၌ ပေါ့လျော့လာသော ပြည်နှင်ဒဏ်လွန်ခေတ် ယုဒပြည်သူများ။
      date: ခန့်မှန်းခြေ ဘီစီ ၅ ရာစုအလယ်ပိုင်း။
    Matthew:
      display_name: မဿဲ
      author: ရေးသားသူအမည်မသိ။ အစဉ်အလာအရ တမန်တော်မဿဲ ရေးသားသည်ဟု ယူဆကြသည်။ ခေတ်သစ်သုတေသနပညာရှင်များကမူ မာကုကျမ်းနှင့် Q နှင့်ဆင်တူသော ရင်းမြစ်တစ်ခုကို အသုံးပြုသည့် ဂရိစကားပြော ယုဒခရစ်ယာန် စာရေးသူတစ်ဦးဟု ယူဆကြသည်။
      audience: တရားဇရပ်ဗဟိုပြု ယုဒဘာသာနှင့် ဆက်နွှယ်နေမှု၊ ကွာခြားနေမှုတို့ကို စဉ်းစားရုန်းကန်နေသော ယုဒခရစ်ယာန် လူမှုအသိုင်းအဝိုင်းတစ်ခု။
      date: ခန့်မှန်းခြေ အေဒီ ၈၀–၉၀။
    Mark:
      display_name: မာကု
      author: ရေးသားသူအမည်မသိ။ အစဉ်အလာအရ ပေတရု၏ ခရီးသွားဖော် ယောဟန်မာကုနှင့် ဆက်စပ်သည်ဟု ယူဆကြသည်။
      audience: နှိပ်စက်ညှဉ်းပန်းမှုကို ခံနေရသော သို့မဟုတ် ခံရမည့်အန္တရာယ်နီးကပ်နေသော ဂရိစကားပြော ခရစ်ယာန်လူမှုအသိုင်းအဝိုင်းတစ်ခု၊ ရောမမြို့တွင် ဖြစ်နိုင်သည်။
      date: ခန့်မှန်းခြေ အေဒီ ၆၅–၇၅၊ ယုဒစစ်ပွဲနှင့် ဗိမာန်တော်ပျက်စီးမှု ဝန်းကျင်ကာလ။
  chapter_titles:
    Hosea:
      '12':
        title: လိမ်ညာမှုနှင့် အကြမ်းဖက်မှုအတွက် တရားစီရင်ခံရခြင်း
      '13':
        title: တစ်ချိန်က အင်အားကြီးသော ဧဖရိမ် ယခု ထွက်ပြေးရပြီ
      '14':
        title: ဣသရေလ နောင်တရ၍ ကရုဏာတော်ကို တောင်းခံသည်
    Joel:
      '1':
        title: ယောလက အစာရှောင်ရန် ဆော်ဩသည်
      '2':
        title: စိတ်နှလုံးအကြွင်းမဲ့ဖြင့် ပြန်လှည့်ကြလော့
      '3':
        title: လူအားလုံးအပေါ် ဝိညာဉ်တော် သွန်းလောင်းခြင်း
      '4':
        title: လူမျိုးများ တရားစီရင်ခံရန် စုဝေးကြသည်
    Amos:
      '1':
        title: လူမျိုးတို့၏ ရက်စက်မှုကို ဘုရားသခင် တရားစီရင်သည်
      '2':
        title: ဣသရေလသည် မလွဲမသွေ တရားစီရင်ခံရမည်
      '3':
        title: ဣသရေလ၏အပြစ်များက ဘေးဒုက္ခဖြစ်စေသည်
      '4':
        title: ချမ်းသာကြွယ်ဝသော အမျိုးသမီးများ တရားစီရင်ခံရမည်
      '5':
        title: နောင်တမရလျှင် နိုင်ငံ ပျက်စီးမည်
      '6':
        title: စည်းစိမ်ခံ အာဏာရှိလူတန်းစားက ပျက်စီးခြင်းကို လျစ်လျူရှုသည်
      '7':
        title: အာမုတ်က ပျက်စီးခြင်းရူပါရုံများကို မြင်သည်
      '8':
        title: နွေသီးခြင်းက ဣသရေလ၏အဆုံးကို ပြသည်
      '9':
        title: ရှောင်လွှဲမရသော တရားစီရင်ခြင်းနှင့် ပြန်လည်ထူထောင်ခြင်း
    Obadiah:
      '1':
        title: သစ္စာဖောက်မှုကြောင့် ဧဒုံ တရားစီရင်ခံရသည်
    Jonah:
      '1':
        title: ယောနသည် နိနေဝေသို့ သွားရမည့်တာဝန်မှ ထွက်ပြေးသည်
      '2':
        title: ယောနသည် ငါး၏ဝမ်းထဲ၌ ဆုတောင်းသည်
      '3':
        title: ယောန၏ ကြွေးကြော်သံကြောင့် နိနေဝေမြို့သားများ နောင်တရကြသည်
      '4':
        title: ဘုရားသခင်၏ကရုဏာကြောင့် ယောန မကျေမနပ်ဖြစ်သည်
    Micah:
      '1':
        title: ရှမာရိနှင့် ယုဒကို ဘုရားသခင် တရားစီရင်သည်
      '2':
        title: လောဘကြီးသော အကြံအစည်ရှင်များကို မိက္ခာ ပြစ်တင်ရှုတ်ချသည်
      '3':
        title: ခေါင်းဆောင်များက လူထုကို ရက်စက်စွာ ခေါင်းပုံဖြတ်သည်
      '4':
        title: ထာဝရဘုရားသည် လူမျိုးအပေါင်းတို့၏အထက်၌ စိုးစံသည်
      '5':
        title: ဗက်လင်မြို့မှ ဒါဝိဒ်မင်း ပေါ်ထွန်းလာမည်
      '6':
        title: ထာဝရဘုရားက ဣသရေလကို တရားစွဲဆိုသည်
      '7':
        title: မိက္ခာသည် ဝမ်းနည်းခြင်းကြားမှ ဆုတောင်းသည်
    Nahum:
      '1':
        title: နိနေဝေ၏အပြစ်ကို ဘုရားသခင် အပြစ်ပေးသည်
      '2':
        title: တမန်က ယုဒပြည်သို့ ငြိမ်းချမ်းရေးသတင်း ယူဆောင်လာသည်
      '3':
        title: နိနေဝေသည် အရှက်ကွဲခြင်း အပြည့်အဝ ခံရမည်
    Habakkuk:
      '1':
        title: ဆိုးညစ်သူများ အုပ်စိုးမှုအတွက် ဟဗက္ကုတ် မြည်တမ်းသည်
      '2':
        title: မာနကြီးသော ဖိနှိပ်သူများကို ဘုရားသခင် သတိပေးသည်
      '3':
        title: ဟဗက္ကုတ်သည် သန့်ရှင်းသော ကြောက်ရွံ့မှုဖြင့် ဆုတောင်းသည်
    Zephaniah:
      '1':
        title: ယုဒ၏အပြစ်ကို ဘုရားသခင် တရားစီရင်သည်
      '2':
        title: လူမျိုးတို့ အပြစ်ပေးခံရသော်လည်း မျှော်လင့်ချက် ကျန်ရှိသည်
      '3':
        title: သန့်စင်ခံရသော လူမျိုးအတွက် ဇိအုန် ဝမ်းမြောက်သည်
    Haggai:
