payload:
  book_metadata:
    2 Baruch:
      display_name: ဗာရုတ် ဒုတိယကျမ်း
      author: ရေးသားသူအမည်မသိ။ ယေရမိ၏ စာရေးတော် ဗာရုတ် ရေးသားသကဲ့သို့ အမည်ခံထားသည်။
      audience: ခရစ်နှစ် ၇၀ တွင် ဗိမာန်တော်ဖျက်ဆီးခံရပြီးနောက် ပြည်နှင်ဒဏ်ခံရခြင်း၏ အဓိပ္ပာယ်ကို ဘာသာရေးရှုထောင့်မှ ဆင်ခြင်နေကြသော ဂျူးလူမျိုးများအတွက် ဖြစ်သည်။
      date: ခန့်မှန်းခြေ ခရစ်နှစ် ၁ ရာစုနှောင်းပိုင်းမှ ၂ ရာစုအစောပိုင်းအတွင်း။ အဓိကအားဖြင့် ဆီးရီးယားဘာသာဖြင့် ထိန်းသိမ်းလက်ဆင့်ကမ်းခဲ့သည်။
  chapter_titles:
    1 Enoch:
      '81':
        title: ဧနောက်သည် ကောင်းကင်ဆိုင်ရာ ကျောက်ပြားများကို ဖတ်ရှုသည်
      '82':
        title: ထိန်းသိမ်းထားရန် မသုရှလအား ဧနောက် မှာကြားသည်
      '83':
        title: ကမ္ဘာမြေ ပျက်စီးခြင်းကို ဧနောက်မြင်သည်
      '84':
        title: သန့်ရှင်းတော်မူသော ဘုရားသခင်ကို ဧနောက် ချီးမွမ်းသည်
      '85':
        title: မိသားစု၏ ကံကြမ္မာကို ဧနောက် အိပ်မက်မြင်သည်
      '86':
        title: ကြယ်များ ကြွေကျ၍ နွားတိရစ္ဆာန်များအလယ်တွင် စားသောက်သည်
      '87':
        title: ကောင်းကင်ဘုံသား ခုနစ်ပါးက မျှော်စင်ကို ပြသသည်
      '88':
        title: ကောင်းကင်တမန်သည် ကြွေကျသောကြယ်ကို ဖမ်းဆီးသည်
      '89':
        title: တိရစ္ဆာန်ပုံဆောင်ချက်များကို ဧနောက်မြင်သည်
      '90':
        title: သိုးထိန်းများက သိုးအုပ်ကို မှားယွင်းအုပ်ချုပ်ပြီး သိုးအုပ်ကို ပြန်လည်တည်ဆောက်သည်
      '91':
        title: အနာဂတ်အပြစ်ဒဏ်များကို ဧနောက် ဖော်ပြသည်
      '92':
        title: ဖြောင့်မတ်သော နောင်မျိုးဆက်များအတွက် ဧနောက် ရေးသားသည်
      '93':
        title: ရက်သတ္တပတ်များက သမိုင်းနှင့် တရားစီရင်ခြင်းကို အကျဉ်းချုပ်ဖော်ပြသည်
      '94':
        title: ဆိုးယုတ်သောလမ်းများအစား ဖြောင့်မတ်ခြင်းကို ရွေးချယ်ကြလော့
      '95':
        title: လာမည့်ပြစ်ဒဏ်စီရင်ခြင်းကြောင့် ဧနောက် ငိုကြွေးသည်
      '96':
        title: ဖြောင့်မတ်သူတို့သည် အပြစ်သားတို့ထက် မြင့်မားစွာ ပျံတက်ကြမည်
      '97':
        title: ဖြောင့်မတ်သူတို့ ဝမ်းမြောက်ပြီး အပြစ်သားတို့ ကျဆုံးကြသည်
      '98':
        title: စည်းစိမ်ယစ်မူးခြင်းက အရှက်ကွဲခြင်းနှင့် ပျက်စီးခြင်းကို ဖြစ်စေသည်
      '99':
        title: ဒုစရိုက်ပြုသူတို့အပေါ် အမင်္ဂလာများ ကြေညာသည်
      '100':
        title: ကောင်းကင်တမန်တို့က ဆိုးယုတ်သူများကို စီရင်ပြီး ဖြောင့်မတ်သူများကို စောင့်ရှောက်သည်
      '101':
        title: ဘုရားသခင်ကို ကြောက်ရွံ့၍ ဒုစရိုက်ပြုခြင်းကို ရပ်တန့်ကြလော့
      '102':
        title: တရားစီရင်ရာနေ့၌ ဖြောင့်မတ်သူတို့ ဝမ်းမြောက်ကြမည်
      '103':
        title: ထာဝရအပြစ်ကင်းကြောင်း ထင်ရှားမည်ကို ဧနောက် ကြေညာသည်
      '104':
        title: အပြစ်မပြုရန် ဧနောက် သတိပေးသည်
      '105':
        title: ဘုန်းအသရေတော်ရှေ့၌ အမည်များကို တင်ထားသည်
      '106':
        title: အနာဂတ်မျှော်လင့်ချက်ကြောင့် နောဧဟု အမည်ပေးသည်
      '107':
        title: နောက်ဆုံးမျိုးဆက်က ပြန်လည်ထူထောင်ခြင်းကို ဆောင်ကြဉ်းသည်
      '108':
        title: နောက်ဆုံးသတိပေးချက်ကို ဧနောက် ရေးသားသည်
    2 Baruch:
      '1':
        title: ဘုရားသခင်က ဗာရုတ်အား ယုဒပြည်အကြောင်း သတိပေးသည်
      '2':
        title: ထွက်ခွာသွားရန် ထာဝရဘုရားက ဗာရုတ်အား မိန့်မှာသည်
      '3':
        title: ယေရုရှလင်မြို့၏ ကံကြမ္မာအတွက် ဗာရုတ် အသနားခံသည်
      '4':
        title: ကွယ်ဝှက်ထားသောမြို့၏ အမှန်တကယ်တည်ရှိမှုကို ထာဝရဘုရား ဖော်ပြသည်
      '5':
        title: ယေရမိ၏အဖွဲ့နှင့်အတူ ဗာရုတ် ငိုကြွေးသည်
      '6':
        title: ဇိအုန်ကို စောင့်ရှောက်နေသော ကောင်းကင်တမန်များကို ဗာရုတ်မြင်သည်
      '7':
        title: ဇိအုန်ကို ဖြိုဖျက်ရန် ကောင်းကင်တမန်များ အမိန့်ရသည်
      '8':
        title: ကောင်းကင်ဘုံမှ ပုဂ္ဂိုလ်တစ်ပါးက သန့်ရှင်းသောပစ္စည်းများကို ဖယ်ရှားသည်
      '9':
        title: ယေရမိနှင့် ဗာရုတ် အတူတကွ ဝမ်းနည်းငိုကြွေးသည်
      '10':
        title: ဇိအုန်ပျက်သုဉ်းခြင်းအတွက် ဗာရုတ် အလွန်တရာ မြည်တမ်းသည်
      '11':
        title: ဗာဗုလုန်၏ ကြီးပွားမှုအတွက် ဗာရုတ် မြည်တမ်းသည်
      '12':
        title: လာမည့်အမျက်ဒေါသအကြောင်း ဗာရုတ် သတိပေးသည်
      '13':
        title: ဗာရုတ်၏ အနာဂတ်သက်သေခံမှုကို ဘုရားသခင် ပြသသည်
      '14':
        title: ဖြောင့်မတ်သူဖြစ်ခြင်း၏ အကျိုးကျေးဇူးကို ဗာရုတ် မေးခွန်းထုတ်သည်
      '15':
        title: အပြစ်သားတို့ မိမိတို့အပြစ်အတွက် တာဝန်ရှိကြောင်း ထာဝရဘုရား ရှင်းပြသည်
      '16':
        title: အနာဂတ်ဘုန်းအသရေကြောင့် ဗာရုတ် အားတက်လာသည်
      '17':
        title: အသက်တာကာလ၏ အဓိပ္ပာယ်ကို ဗာရုတ် သိရှိသည်
      '18':
        title: ဘုရားသခင်၏ အလင်းအကြောင်း ဗာရုတ် ရှင်းပြသည်
      '19':
        title: ဘုရားသခင်သည် လူတစ်ဦးစီကို တရားစီရင်သည်
      '20':
        title: လျင်မြန်စွာ ရောက်လာမည့် တရားစီရင်ခြင်းကို ဘုရားသခင် ကတိပြုသည်
      '21':
        title: ကိဒြုန်ချောင်းနားတွင် ဗာရုတ် ဆုတောင်းသည်
      '22':
        title: အထက်မှလာသော အသံကို ဗာရုတ် နာခံသည်
      '23':
        title: စောင့်ဆိုင်းနေသော မျိုးဆက်အားလုံးကို ဘုရားသခင် သတိရသည်
      '24':
        title: အနာဂတ်တရားစီရင်ခြင်းကို ဗာရုတ်မြင်သည်
      '25':
        title: အဆုံးတိုင်အောင် ဗာရုတ်ကို အသက်ချမ်းသာပေးထားသည်
      '26':
        title: ဒုက္ခဆင်းရဲကာလ၏ ကြာချိန်ကို ဗာရုတ် မေးမြန်းသည်
      '27':
        title: လာမည့်ကာလ၏ အဖြစ်အပျက်များကို ဗာရုတ် ဖော်ပြသည်
      '28':
        title: မပျက်စီးနိုင်သောအရာအကြောင်း ဗာရုတ် မေးမြန်းသည်
      '29':
        title: ကမ္ဘာမြေသည် ပေါများကြွယ်ဝမှုဖြင့် ပြည့်လျှံသည်
      '30':
        title: ဝိညာဉ်တို့သည် မေရှိယနှင့်အတူ ထမြောက်ကြသည်
      '31':
        title: ဇိအုန်၌ အကြီးအကဲများကို ဗာရုတ် စုဝေးစေသည်
      '32':
        title: ဘုရားသခင်၏ ပညတ်တရားကို လိုက်နာ၍ ဘေးကင်းစွာ နေကြလော့
      '33':
        title: ဆက်နေပါရန် လူတို့က ဗာရုတ်ကို တောင်းပန်သည်
      '34':
        title: ဗာရုတ် ငိုကြွေးလျက် လူတို့ကို နှစ်သိမ့်အားပေးသည်
      '35':
        title: ဇိအုန်၏ ဝမ်းနည်းခြင်းအတွက် ဗာရုတ် ငိုကြွေးသည်
      '36':
        title: စပျစ်နွယ်ပင်က အာရဇ်ပင်ကို စွပ်စွဲသည်
      '37':
        title: လဲကျသော အာရဇ်ပင်ကို စပျစ်နွယ်ပင်က စွပ်စွဲသည်
      '38':
        title: ဗျာဒိတ်ရူပါရုံ၏ အနက်ဖွင့်ဆိုချက်အတွက် ဗာရုတ် ဆုတောင်းသည်
      '39':
        title: နိုင်ငံတော်များအကြောင်း ဗာရုတ် ကြိုတင်ဟောပြောသည်
      '40':
        title: မေရှိယသည် ကျန်ကြွင်းသောလူတို့ကို ကာကွယ်မည်
      '41':
        title: အနာဂတ်အဖြစ်အပျက်များအကြောင်း ဗာရုတ် မေးမြန်းသည်
      '42':
        title: အတိတ်ထက် ယုံကြည်ခြင်းက ပို၍ အရေးကြီးသည်
      '43':
        title: ထာဝရနှစ်သိမ့်မှုကို ဗာရုတ် လက်ခံနာယူသည်
      '44':
        title: သားကို ခေါ်၍ ဗာရုတ်က ပညာစကားပြောသည်
      '45':
        title: တည်ကြည်စွာခံရပ်၍ ကြောက်ရွံ့ခြင်းဖြင့် ဇိအုန်ကို ရှာကြလော့
      '46':
        title: အကြီးအကဲများအား မျှော်လင့်ချက်ရှိကြောင်း ဗာရုတ် အာမခံသည်
      '47':
        title: ဗာရုတ် ခုနစ်ရက် အစာရှောင်သည်
      '48':
        title: ကျန်ကြွင်းသူတို့အတွက် ဗာရုတ် ဆုတောင်းသည်
      '49':
        title: အနာဂတ်အသက်တာအကြောင်း ဗာရုတ် မေးမြန်းသည်
      '50':
        title: သေလွန်သူတို့ ထမြောက်၍ မည်သူမည်ဝါဖြစ်ကြောင်း သိမြင်နိုင်မည်
      '51':
        title: ဆိုးယုတ်သူတို့ ညှိုးနွမ်း၍ ဖြောင့်မတ်သူတို့ ဘုန်းထင်ရှားမည်
      '52':
        title: သေလွန်သူတို့ ပြန်လာပြီး အသက်ရှင်သူတို့က သူတို့ကို မှတ်မိကြသည်
      '53':
        title: မိုးတိမ်ဗျာဒိတ်ရူပါရုံကို ဗာရုတ် အိပ်မက်မြင်သည်
      '54':
        title: ဗျာဒိတ်ရူပါရုံ၏ ရှင်းလင်းချက်အတွက် ဗာရုတ် ဆုတောင်းသည်
      '55':
        title: အနာဂတ်နက်နဲရာများကို ဘုရားသခင်က ဗာရုတ်အား ပြသသည်
      '56':
        title: မိုးတိမ်သည် ကမ္ဘာဦးအစကို ကိုယ်စားပြုသည်
      '57':
