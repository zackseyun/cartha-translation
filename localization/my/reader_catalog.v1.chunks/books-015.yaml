      '1':
        title: ဒံယေလက ဗေလနှင့် နဂါးကို အနိုင်ယူသည်
    Letter of Jeremiah:
      '1':
        title: ဗာဗုလုန်ရှိ ရုပ်တုများကို ကြောက်စရာဟု မှားယွင်းစွာ ယူဆကြသည်
    Prayer of Azariah and Song of the Three:
      '1':
        title: တောက်လောင်သောမီးထဲ၌ အာဇရိ ဆုတောင်းသည်
    Susanna:
      '1':
        title: တရားသူကြီးများ၏ အကြံအစည်ကို ဒံယေလ ဖော်ထုတ်သည်
    1 Clement:
      '1':
