payload:
  book_metadata:
    1 Esdras:
      display_name: ဧဇဒရ ပထမစောင်
      author: ရေးသားသူအမည် မသိရပါ။ ရာဇဝင်ချုပ် ဒုတိယစောင် ၃၅–၃၆၊ ဧဇရနှင့် နေဟမိ ၇–၈ တို့ကို အစီအစဉ်ပြန်စီထားသည့် ဂရိဘာသာဖြင့် ပြန်လည်ဖွဲ့စည်းထားသော စာဖြစ်သည်။
      audience: ပြန်လာခြင်းနှင့် ပြန်လည်ထူထောင်ခြင်းအကြောင်းကို ရှင်းလင်းသော ဇာတ်ကြောင်းဖြင့် လိုလားသည့် ဟေလေနစ်ခေတ် ဂျူးလူမျိုးများ။
      date: ခန့်မှန်းခြေ ဘီစီ ၂ ရာစုမှ ၁ ရာစုအတွင်း။
    Prayer of Manasseh:
      display_name: မနာရှေ၏ ဆုတောင်းချက်
      author: ရေးသားသူအမည် မသိရပါ။ မနာရှေမင်းအား ရည်ညွှန်း၍ အမည်ခံတင်ပြထားသည်။
      audience: မနာရှေ၏ နောင်တရခြင်းနှင့် မိမိတို့ကိုယ်ကို ထပ်တူမြင်သော နောင်တရသူများ—အချို့အစဉ်အလာများတွင် ဝတ်ပြုရေး၌ အသုံးပြုကြသည်။
      date: ခန့်မှန်းခြေ ဘီစီ ၂ ရာစုမှ ၁ ရာစုအတွင်း။
    Psalm 151:
      display_name: ဆာလံ ၁၅၁
      author: ရေးသားသူအမည် မသိရပါ။ ဒါဝိဒ်အား ရည်ညွှန်း၍ အမည်ခံတင်ပြထားသည်။ ဟေဗြဲဘာသာပုံစံတစ်မျိုးကို 11QPsa တွင် တွေ့ရှိထားသည်။
      audience: ဒါဝိဒ်၏ ဆာလံကျမ်းကို မြတ်နိုးသော ပြည်ပရောက်ဂျူးအသိုင်းအဝိုင်းများနှင့် ကွမ်းရန်အသိုင်းအဝိုင်းများ။
      date: ခန့်မှန်းခြေ ဘီစီ ၂ ရာစု သို့မဟုတ် ထိုထက်စောသောကာလ။
    3 Maccabees:
      display_name: မက္ကဘီး တတိယစောင်
      author: ရေးသားသူအမည် မသိရပါ။ ဂရိဘာသာဖြင့် ရေးစပ်ထားသည်။
      audience: အီဂျစ်ပြည်ရှိ ဂရိစကားပြော ပြည်ပရောက်ဂျူးများ—တော်လမီ စတုတ္ထမင်းလက်ထက်ကို နောက်ခံထားသည့် ကယ်တင်ခြင်းဇာတ်ကြောင်းဖြစ်သည်။
      date: ခန့်မှန်းခြေ ဘီစီ ၁ ရာစုမှ အေဒီ ၁ ရာစုအတွင်း။
    4 Maccabees:
      display_name: မက္ကဘီး စတုတ္ထစောင်
      author: ရေးသားသူအမည် မသိရပါ။ စတိုးအစ်ဒဿန၏ လွှမ်းမိုးမှုခံထားရသော ဂရိစကားပြော ဂျူးစာရေးသူတစ်ဦး ဖြစ်သည်။
      audience: ဟေလေနစ်ယဉ်ကျေးမှုအောက်ရှိ ဂျူးများ—သစ္စာစောင့်သိခြင်းအားဖြင့် ဆင်ခြင်တုံတရားက ပြင်းပြသောစိတ်ဆန္ဒကို ထိန်းချုပ်နိုင်ပုံအကြောင်း ဒဿနဆန်သော တရားဟောချက်ဖြစ်သည်။
      date: ခန့်မှန်းခြေ အေဒီ ၁ ရာစု။
    Bel and the Dragon:
      display_name: ဗေလနှင့် နဂါး
      author: ရေးသားသူအမည် မသိရပါ။ ဒံယေလကျမ်း၏ ဂရိဘာသာ ထပ်ဖြည့်စာများအနက် တစ်ပုဒ်ဖြစ်သည်။
      audience: ဂရိစကားပြော ဂျူးများ—ရုပ်တုကိုးကွယ်ခြင်းကို သရော်ဝေဖန်ထားသော စာဖြစ်သည်။
      date: ခန့်မှန်းခြေ ဘီစီ ၂ ရာစုမှ ၁ ရာစုအတွင်း။
    Letter of Jeremiah:
      display_name: ယေရမိ၏ စာ
      author: ရေးသားသူအမည် မသိရပါ။ ယေရမိအား ရည်ညွှန်း၍ အမည်ခံတင်ပြထားသည်။
      audience: ပတ်ဝန်းကျင်ရှိ ရုပ်တုကိုးကွယ်မှု၏ သွေးဆောင်မှုခံနေရသော ပြည်ပရောက်ဂျူးများ။
      date: ခန့်မှန်းခြေ ဘီစီ ၄ ရာစုမှ ၂ ရာစုအတွင်း။
    Prayer of Azariah and Song of the Three:
      display_name: အာဇရိ၏ ဆုတောင်းချက်နှင့် လူသုံးဦး၏ သီချင်း
      author: ရေးသားသူအမည် မသိရပါ။ ဒံယေလကျမ်း၏ ဂရိဘာသာ ထပ်ဖြည့်စာများအနက် တစ်ပုဒ်ဖြစ်သည်။
      audience: ဂရိစကားပြော ဂျူးများ—ဒံယေလ အခန်းကြီး ၃ အတွက် ဝတ်ပြုရေးဆိုင်ရာ စာသားဖြစ်သည်။
      date: ခန့်မှန်းခြေ ဘီစီ ၂ ရာစု။
    Susanna:
      display_name: စူစန္နာ
      author: ရေးသားသူအမည် မသိရပါ။ ဒံယေလကျမ်း၏ ဂရိဘာသာ ထပ်ဖြည့်စာများအနက် တစ်ပုဒ်ဖြစ်သည်။
      audience: ဂရိစကားပြော ဂျူးများ—ဖြောင့်မတ်ခြင်းနှင့် မမှန်မကန်သက်သေထွက်ဆိုမှုကို ဖော်ထုတ်ဆုံးမသည့် ဇာတ်လမ်းဖြစ်သည်။
      date: ခန့်မှန်းခြေ ဘီစီ ၂ ရာစုမှ ၁ ရာစုအတွင်း။
    1 Clement:
      display_name: ကလဲမင့် ပထမစာ
      author: ရေးသားသူအမည် မသိရပါ။ ရောမမြို့သား ကလဲမင့်အား ရည်ညွှန်း၍ အမည်ခံတင်ပြထားသည်။
      audience: ခေါင်းဆောင်မှုဆိုင်ရာ အငြင်းပွားမှုတွင် ပါဝင်ရှုပ်ထွေးနေသော ကောရိန္သုမြို့ရှိ ခရစ်ယာန်အသင်းတော်။
      date: ခန့်မှန်းခြေ အေဒီ ၉၆ ခုနှစ်။
  chapter_titles:
    2 Maccabees:
      '12':
        title: ကျဆုံးသူများအတွက် ယုဒ ဆုတောင်းသည်
      '13':
        title: အောင်ပွဲရရန် ယုဒ ဆုတောင်းသည်
      '14':
        title: နိကာနော်က မိမိ၏ ငြိမ်းချမ်းရေးကတိကို သစ္စာဖောက်သည်
      '15':
        title: နိကာနော် ရှုံးနိမ့်ခြင်းကို ဂျူးများ ဆင်နွှဲကြသည်
    1 Esdras:
      '1':
        title: ယောရှိသည် ပသခါပွဲကျင်းပပြီး ကွယ်လွန်သည်
      '2':
        title: ကုရုသည် ယေရမိ၏ စကားကို ပြည့်စုံစေသည်
      '3':
        title: အမှန်တရား အနိုင်ရကြောင်း ဇေရုဗဗေလ ကြေညာသည်
      '4':
        title: ဗိမာန်တော် ပြန်ဆောက်ရန် ဒါရိ ခွင့်ပြုသည်
      '5':
        title: ပြည်နှင်ခံရသူများ ပြန်လာ၍ ယဇ်ပလ္လင်ကို ပြန်ဆောက်ကြသည်
      '6':
        title: ပရောဖက်များက ဗိမာန်တော်လုပ်ငန်းကို အားပေးကြသည်
      '7':
        title: ဗိမာန်တော်ကို အလွန်ဝမ်းမြောက်စွာ အပြီးသတ်ကြသည်
      '8':
        title: ဧဇရသည် လူများကို ဘေးကင်းစွာ ပြန်ခေါ်ဆောင်သည်
      '9':
        title: သစ္စာမဲ့သော အိမ်ထောင်ရေးများကို ဧဇရ ရင်ဆိုင်ဖြေရှင်းသည်
    Prayer of Manasseh:
      '1':
        title: မနာရှေသည် ဘုရား၏ ကရုဏာတော်ကို အသနားခံသည်
    Psalm 151:
      '1':
        title: အငယ်ဆုံးသိုးထိန်းကို ဘုရင်အဖြစ် ဘိသိက်ပေးသည်
    3 Maccabees:
      '1':
        title: မင်းကြီးက ဗိမာန်တော်ထဲ ဝင်မည်ဟု မရမကတောင်းဆိုသည်
      '2':
        title: ကယ်တင်ခြင်းရရန် အစ္စရေးလူတို့ ဆုတောင်းကြသည်
      '3':
        title: ဂျူးလူမျိုးတို့ကို ဖျက်ဆီးရန် မင်းကြီး စီစဉ်သည်
      '4':
        title: လူမြင်ကွင်းတွင် ပြသခံရသော ဂျူးများ ငိုကြွေးကြသည်
      '5':
        title: ကွပ်မျက်ရန် ဆင်များကို ခေါ်ဆောင်လာသည်
      '6':
        title: ကောင်းကင်တမန်များက ဂျူးတို့ကို ကယ်တင်ကြသည်
      '7':
        title: မင်းကြီးက ဂျူးတို့ကို ဘေးကင်းစွာ လွှတ်ပေးသည်
    4 Maccabees:
      '1':
        title: ဆင်ခြင်တုံတရားက ပြင်းပြသောစိတ်ဆန္ဒများကို အုပ်စိုးသည်
      '2':
        title: ပညတ်တရားက ဆင်ခြင်တုံတရား၏ ထိန်းချုပ်နိုင်စွမ်းကို လမ်းညွှန်သည်
      '3':
        title: ဒါဝိဒ်က ရန်သူ့နယ်မှ ရေကို မသောက်ဘဲ ငြင်းပယ်သည်
      '4':
        title: ကောင်းကင်ဗိုလ်ခြေများက ဂျူးတို့ကို ကာကွယ်ကြသည်
      '5':
        title: ဧလာဇာက ဝက်သားစားရန် ငြင်းပယ်သည်
      '6':
        title: ဧလာဇာသည် မယိမ်းမယိုင်ဘဲ သေဆုံးသည်
      '7':
        title: ဧလာဇာက ဆင်ခြင်တုံတရား၏ တန်ခိုးကို သက်သေပြသည်
      '8':
        title: ညီအစ်ကိုခုနစ်ဦး အာဏာရှင်နှင့် ရင်ဆိုင်ကြသည်
      '9':
        title: ပထမညီအစ်ကိုသည် ယုံကြည်ချက်အတွက် အသက်ပေးသည်
      '10':
        title: စတုတ္ထညီအစ်ကိုက လျှာထုတ်ပေးရန် ငြင်းပယ်သည်
      '11':
        title: ဆဋ္ဌမညီအစ်ကိုသည် ညှဉ်းပန်းမှုကို ခံရပ်သည်
      '12':
        title: အငယ်ဆုံးညီက မိမိကိုယ်ကို အောက်သို့ ပစ်ချသည်
      '13':
        title: ညီအစ်ကိုများ အချင်းချင်း အားပေးကြသည်
      '14':
        title: မိခင်က သားများအား အသက်ပေးရန် တိုက်တွန်းသည်
      '15':
        title: မိခင်က သားများထက် ဘုရားသခင်ကို ရွေးချယ်သည်
      '16':
        title: မိခင်က သားများကို အသက်ပေးရန် ဖျောင်းဖျသည်
      '17':
        title: ယုံကြည်ချက်အတွက် အသက်ပေးသူ ခုနစ်ဦးက ဘုရားသခင်ကို ဂုဏ်ပြုကြသည်
      '18':
        title: သားသမီးများသည် ပညတ်တရားကို စောင့်၍ အသက်ရှင်ကြသည်
