payload:
  book_metadata:
    Psalms of Solomon:
      display_name: ရှောလမုန်၏ ဆာလံသီချင်းများ
      author: ရေးသားသူအမည်မသိ၊ ရှောလမုန်ဟု အမည်တုဖြင့် ရည်ညွှန်းထားသည်။
      audience: ဘီစီ ၆၃ ခုနှစ်တွင် ပွန်ပေ၏ သိမ်းပိုက်မှုကို တုံ့ပြန်နေကြသော ယေရုရှလင်မြို့ရှိ ဘုရားတရားကိုင်းရှိုင်းသည့် ဂျူးလူမျိုးများ။
      date: ဘီစီ ၁ ရာစုအလယ်ပိုင်းခန့်။
    Shepherd of Hermas:
      display_name: ဟေရမတ်၏ သိုးထိန်း
      author: ရောမမြို့တွင် နေထိုင်သော ခရစ်ယာန်တစ်ဦး ဟေရမတ်။
      audience: ရောမမြို့ရှိ ခရစ်ယာန်အသင်းတော်အတွက်—နောင်တရခြင်းနှင့်ဆိုင်သော ကိုယ်ကျင့်တရားပိုင်းနှင့် ကမ္ဘာပျက်ကပ်ဆိုင်ရာ ပရောဖက်ပြုချက်တစ်ရပ်။
      date: အေဒီ ၂ ရာစုအစောပိုင်းမှ အလယ်ပိုင်းခန့်။
  chapter_titles:
    Jubilees:
      '17':
        title: အာဗြဟံ၏ ယုံကြည်ခြင်း မှန်ကန်ကြောင်း သက်သေပြခြင်း
      '18':
        title: ဇိအုန်၌ အာဗြဟံ၏ နာခံမှုကို စမ်းသပ်ခြင်း
      '19':
        title: အာဗြဟံသေဆုံး၍ ယာကုပ် ကောင်းချီးခံရခြင်း
      '20':
        title: သန့်ရှင်းစင်ကြယ်ရန် အာဗြဟံမှာကြားခြင်း
      '21':
        title: ဖြောင့်မတ်ခြင်းအတွက် ယာကုပ်ကို အာဗြဟံကောင်းချီးပေးခြင်း
      '22':
        title: သီတင်းပတ်ပွဲတော်ကို စတင်သတ်မှတ်ခြင်း
      '23':
        title: ဧသော၏ အမျက်မှ ယာကုပ်ထွက်ပြေးခြင်း
      '24':
        title: ယာကုပ်က လာဗန်ထံ မရိုးမသား အမှုထမ်းခြင်း
      '25':
        title: ယာကုပ် ခါနာန်ပြည်သို့ ပြန်လာခြင်း
      '26':
        title: ယာကုပ်နှင့် ဧသော ပြန်လည်သင့်မြတ်ခြင်း
      '27':
        title: ဧသောထံမှ ထွက်ပြေးစဉ် ယာကုပ်အိပ်မက်မက်ခြင်း
      '28':
        title: လာဗန်က ယာကုပ်ကို လှည့်စား၍ အိမ်ထောင်ပြုပေးခြင်း
      '29':
        title: ယာကုပ်က လာဗန်ထံမှ တိတ်တဆိတ် ထွက်ခွာခြင်း
      '30':
        title: ရှိမောင်နှင့် လေဝိက ဒိနအတွက် လက်စားချေခြင်း
      '31':
        title: ဣဇာက်က လေဝိနှင့် ယုဒကို ကောင်းချီးပေးခြင်း
      '32':
        title: ယာကုပ် ဆယ်ဖို့တစ်ဖို့ပေး၍ ဆုတောင်းခြင်း
      '33':
        title: ရုဗင်က ယာကုပ်ကို အကြီးအကျယ် ပြစ်မှားခြင်း
      '34':
        title: ယောသပ်ကို အီဂျစ်ပြည်သို့ ရောင်းစားသည့် အဖြစ်ဆိုး
      '35':
        title: မက္ပေလအနီး၌ ရေဗက္ကာသေဆုံးခြင်း
      '36':
        title: ဣဇာက် မသေဆုံးမီ ကောင်းချီးပေးခြင်း
      '37':
        title: ဧသောက မိမိကျိန်ဆိုချက်ကို စွန့်လွှတ်ခြင်း
      '38':
        title: တိုက်ပွဲတွင် ယာကုပ်က ဧသောကို သတ်ခြင်း
      '39':
        title: ယောသပ်က ပေါတိဖာ၏ ဇနီးကို ငြင်းဆန်ခြင်း
      '40':
        title: ယောသပ် အီဂျစ်ပြည်ကို အုပ်ချုပ်သည့် ရာထူးရခြင်း
      '41':
        title: သားသမီးရရန် တာမာက ယုဒကို လှည့်စားခြင်း
      '42':
        title: ယောသပ်က မိမိညီအစ်ကိုများကို စမ်းသပ်ခြင်း
      '43':
        title: ဗင်ယာမိန်အတွက် ယုဒ အသနားခံခြင်း
      '44':
        title: အီဂျစ်ပြည်သို့ ယာကုပ်၏ ခရီးစဉ်
      '45':
        title: ဣသရေလအမျိုး ဂေါရှင်ပြည်တွင် အခြေချခြင်း
      '46':
        title: ယောသပ်လက်ထက်တွင် ဣသရေလအမျိုး တိုးပွားစည်ပင်ခြင်း
      '47':
        title: မောရှေကို ကျူပင်များကြား ဝှက်ထားခြင်း
      '48':
        title: မတ်စတေမာက မောရှေကို တိုက်ခိုက်သော်လည်း မအောင်မြင်ခြင်း
      '49':
        title: ပသခါသိုးသငယ်ကို တစ်ကောင်လုံး ကင်ခြင်း
      '50':
        title: ဥပုသ်နေ့ အနားယူခြင်းနှင့် တားမြစ်ထားသော အလုပ်များ
    Psalms of Solomon:
      '1':
        title: ဒုက္ခရောက်၍ အကျွန်ုပ်၏ အော်ဟစ်သံကို သခင်ကြားတော်မူခြင်း
      '2':
        title: ဘုရားသခင်က မာနကြီးသော အပြစ်သားများကို အလျင်အမြန် တရားစီရင်ခြင်း
      '3':
        title: ဖြောင့်မတ်သူတို့က သခင်ကို အစဉ်ချီးမွမ်းခြင်း
      '4':
        title: သူတော်ကောင်းယောင်ဆောင်သူ၏ ရှက်ဖွယ်အဆုံး
      '5':
        title: ဘုရားသခင်က လူအားလုံးအတွက် ကြွယ်ဝစွာ ထောက်ပံ့ခြင်း
      '6':
        title: အသင့်ရှိသော စိတ်နှလုံးက သခင်ကို ခေါ်ခြင်း
      '7':
        title: ရန်သူတို့၏ လက်မှ သခင်က ကာကွယ်ခြင်း
      '8':
        title: သခင်က ထာဝစဉ် ဖြောင့်မတ်စွာ တရားစီရင်ခြင်း
      '9':
        title: ဘုရားသခင်၏ ကရုဏာ၌ ဣသရေလ၏ မျှော်လင့်ချက်
      '10':
        title: ဆုံးမခြင်းကို လက်ခံလျှင် သန့်စင်ခြင်းရခြင်း
      '11':
        title: ဝေးလံသော ပြည်များမှ ဣသရေလကို စုသိမ်းတော်မူပါ
      '12':
        title: တီးတိုးပြောသော မုသားများမှ အကျွန်ုပ်ကို ကယ်တင်တော်မူပါ
      '13':
        title: ဖြောင့်မတ်သူတို့ ပျက်စီးခြင်းကင်း၍ အသက်ရှင်ခြင်း
      '14':
        title: သစ္စာရှိသူတို့သည် ထာဝရအသက်ပင်များ ဖြစ်ခြင်း
      '15':
        title: ဒုက္ခရောက်ချိန်၌ သခင်ကို ခေါ်ခြင်း
      '16':
        title: ဘုရားသခင်၏ ကရုဏာက အကျွန်ုပ်ကို နိုးထစေခြင်း
      '17':
        title: သခင်သည် စစ်မှန်သော ထာဝရဘုရင် ဖြစ်တော်မူခြင်း
      '18':
        title: ကရုဏာပြုရာနေ့အတွက် ဣသရေလကို သန့်စင်တော်မူပါ
    Shepherd of Hermas:
      '1':
        title: ဟေရမတ် မကောင်းသော တပ်မက်မှုနှင့် ရင်ဆိုင်ရခြင်း
      '2':
        title: စာအုပ်ကိုင်ထားသော အမျိုးသမီး ပေါ်လာခြင်း
      '3':
        title: မိသားစု နောင်တရရန် စေတမန်က တိုက်တွန်းခြင်း
      '4':
        title: စာဖတ်ပြီးနောက် အမျိုးသမီး ထွက်ခွာခြင်း
      '5':
        title: ဝိညာဉ်တော်က ဟေရမတ်ကို တစ်ဖန် ချီဆောင်ခြင်း
      '6':
        title: နောင်တရရန် သားသမီးများကို သတိပေးခြင်း
      '7':
        title: ဟေရမတ် ခွင့်လွှတ်ခံရ၍ သားသမီးများ သန့်စင်ခံရခြင်း
      '8':
        title: အသင်းတော်ကို အဘွားအိုအဖြစ် ဖော်ပြခြင်း
      '9':
        title: လယ်ကွင်း၌ ဟေရမတ်က အမျိုးသမီးနှင့် တွေ့ဆုံခြင်း
      '10':
        title: ရေပေါ်၌ တည်ဆောက်သော မျှော်စင်ကို ပြသခြင်း
      '11':
        title: အမျိုးသမီးက ရူပါရုံကို ရှင်းပြခြင်း
      '12':
        title: ကောင်းကင်တမန်များက မျှော်စင်တည်ဆောက်ခြင်း
      '13':
        title: ကျောက်တုံးများ မျှော်စင်တွင် အံဝင်ခွင်ကျဖြစ်ခြင်း
      '14':
        title: အပြစ်သားများ မျှော်စင်မှ ပယ်ချခံရခြင်း
      '15':
        title: ပယ်ချခံရသော ကျောက်တုံးများ နောင်တရနိုင်ခြင်း
      '16':
        title: အမျိုးသမီးခုနစ်ဦးက မျှော်စင်ကို ထောက်မခြင်း
      '17':
        title: ရူပါရုံ ၃၊ အပိုင်း ၉
      '18':
        title: သန့်စင်ကြရန် ခေါင်းဆောင်များကို သတိပေးခြင်း
      '19':
        title: အသွင်သုံးမျိုးအနက် ပထမအသွင်ကို ရှင်းပြခြင်း
      '20':
        title: ဒုတိယရူပါရုံ—အသစ်ပြုပြင်ခံရသော စိတ်ဝိညာဉ်များ
      '21':
        title: တတိယရူပါရုံက အသစ်ပြုပြင်ခြင်းကို ပြသခြင်း
      '22':
        title: သားရဲက ကြီးစွာသော ဆင်းရဲဒုက္ခကို ကိုယ်စားပြုခြင်း
      '23':
        title: အပျိုစင်က စိတ်နှလုံးဖြူစင်စွာ အစေခံရန် တိုက်တွန်းခြင်း
      '24':
        title: သားရဲ၏ ဦးခေါင်းပေါ်ရှိ အရောင်လေးမျိုး
      '25':
        title: သိုးထိန်းက အဓိကအကြောင်းများကို ဖော်ပြခြင်း
      '26':
        title: တစ်ဆူတည်းသော စစ်မှန်သည့် ဘုရားသခင်ကို ယုံကြည်ပါ
      '27':
        title: ဂုဏ်သိက္ခာကို ဝတ်ဆင်ပါ
      '28':
        title: သမ္မာတရားနှင့်အညီ အသက်ရှင်ရန် စေတမန်က တိုက်တွန်းခြင်း
      '29':
        title: ကာမစောင့်စည်းမှုကို တင်းကျပ်စွာ လိုက်နာရန် အမိန့်ပေးခြင်း
      '30':
        title: နောင်တရခြင်းက မှန်ကန်သော နားလည်မှုကို ဆောင်ကြဉ်းခြင်း
      '31':
        title: နောင်တရခြင်းကြောင့် ခွင့်လွှတ်ခြင်း ရရှိခြင်း
      '32':
        title: သည်းခံခြင်း၌ သန့်ရှင်းသော ဝိညာဉ်တော် လွတ်လပ်စွာ ကိန်းဝပ်ခြင်း
      '33':
        title: ဖြောင့်မတ်သောလမ်းနှင့် ဆိုးယုတ်မှုကို ခွဲခြားသိမြင်ခြင်း
      '34':
        title: သခင်ကို ကြောက်ရွံ့၍ ဖြောင့်မတ်စွာ အသက်ရှင်ပါ
      '35':
        title: ကောင်းခြင်းနှင့် ဆိုးခြင်းအကြောင်း စေတမန်ပြောခြင်း
      '36':
        title: သံသယကို ပယ်၍ သစ္စာရှိသော ဘုရားသခင်ကို အစေခံပါ
      '37':
        title: ဝမ်းနည်းခြင်းက ပျက်စီးစေသလို ကယ်တင်လည်းကယ်တင်ခြင်း
      '38':
        title: ဝမ်းနည်းခြင်းက စိတ်ဝိညာဉ်ကို နွမ်းနယ်စေခြင်း
