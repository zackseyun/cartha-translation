payload:
  book_metadata:
    Gospel of Truth:
      display_name: သမ္မာတရား ဧဝံဂေလိကျမ်း
      author: ရေးသားသူအမည် မသိရပါ။ ဗာလင်တီးနပ်စ် သို့မဟုတ် သူ၏အဖွဲ့က ရေးသားသည်ဟု လူအများက ယူဆကြသည်။
      audience: ဗာလင်တီးနပ်စ်ဝါဒဆိုင်ရာ ဂနော့စတစ်လှုပ်ရှားမှုအတွင်းရှိ ခရစ်ယာန်စာဖတ်သူများ။
      date: ခရစ်နှစ် ၂ ရာစုအလယ်ပိုင်းခန့်။ နာဂ်ဟာမာဒီတွင် စာမူအဖြစ် ထိန်းသိမ်းထားခဲ့သည်။
    Jubilees:
      display_name: ယုဘိလီကျမ်း
      author: ရေးသားသူအမည် မသိရပါ။ မောရှေအား သိနာတောင်တွင် ဖွင့်ပြခဲ့သည့် ဗျာဒိတ်တော်အဖြစ် တင်ပြထားသည်။
      audience: ၃၆၄ ရက်ပါ နေနှစ်ပြက္ခဒိန်နှင့် တင်းကျပ်သော ဂျူးတရားကျင့်ထုံးတို့ကို လိုက်နာသည့် ဂျူးအသိုင်းအဝိုင်းများ (ကွမ်ရန်နှင့် ယဉ်ကျေးမှုနောက်ခံတူနိုင်ဖွယ်ရှိသည်)။
      date: ခရစ်မပေါ်မီ ၂ ရာစုအလယ်ပိုင်းခန့်။ ဂီအက်ဇ် (အီသီယိုးပီးယား) ဘာသာဖြင့် အပြည့်အစုံ ထိန်းသိမ်းထားခဲ့သည်။
  chapter_titles:
    Gospel of Thomas:
      '49':
        title: တစ်ကိုယ်တည်းနေသော ရွေးချယ်ခံရသူတို့ နိုင်ငံတော်ကို တွေ့လိမ့်မည်
      '50':
        title: ယေရှုက အလင်းအကြောင်း မိန့်တော်မူသည်
      '51':
        title: သေလွန်သူတို့၏ ငြိမ်သက်ခြင်းသည် မသိမသာ ရောက်လာသည်
      '52':
        title: စကားပြောနေသော သေလွန်သူတို့အလယ်၌ အသက်ရှင်နေခြင်း
      '53':
        title: အရေဖျားလှီးခြင်းအကြောင်း တပည့်တို့ မေးမြန်းသည်
      '54':
        title: ဆင်းရဲသားတို့ကို ယေရှု ကောင်းချီးပေးသည်
      '55':
        title: မုန်းရမည်လော၊ ခရစ်တော်နောက် လိုက်ရမည်လော
      '56':
        title: လောကသည် အလောင်းကောင်ဖြစ်ကြောင်း တွေ့သိ၍ မထိုက်တန်ဟု မှတ်ယူခြင်း
      '57':
        title: အလုပ်ကြိုးစားသူသည် မင်္ဂလာရှိ၏
      '58':
        title: ကြိုးစားအားထုတ်ခြင်းကို ယေရှု ကောင်းချီးပေးသည်
      '59':
        title: အသက်ရှင်စဉ် အသက်ရှင်တော်မူသောသူကို ရှာကြလော့
      '60':
        title: ရှမာရိလူတစ်ဦး သိုးသငယ်ကို ယုဒပြည်သို့ သယ်ဆောင်သည်
      '61':
        title: အလင်းအကြောင်း စလောမေကို ယေရှု သွန်သင်သည်
      '62':
        title: နက်နဲရာများကို လျှို့ဝှက်စွာ ဖွင့်ပြသည်
      '63':
        title: သူဌေးသည် အဆင်သင့်မဖြစ်ဘဲ သေဆုံးသည်
      '64':
        title: သခင်က မမျှော်လင့်ထားသော ဧည့်သည်များကို ဖိတ်ခေါ်သည်
      '65':
        title: သူတော်ကောင်း၏ စပျစ်ဥယျာဉ် ဖျက်ဆီးခံရသည်
      '66':
        title: ပယ်ထားသော ကျောက်ကို ငါ့အား ပြကြလော့
      '67':
        title: အရာခပ်သိမ်းကို သိသော်လည်း မိမိကိုယ်ကို မသိခြင်း
      '68':
        title: ညှဉ်းပန်းနှိပ်စက်ခံရသူတို့သည် မင်္ဂလာရှိကြ၏
      '69':
        title: ဆာလောင်သော ဝိညာဉ်တို့သည် မင်္ဂလာရှိကြ၏
      '70':
        title: အတွင်းစိတ်၏ ဆင်းရဲခြင်းအကြောင်း ယေရှု မိန့်တော်မူသည်
      '71':
        title: အိမ်ပြိုကျမည်ဟု ယေရှု ကြိုတင်မိန့်တော်မူသည်
      '72':
        title: ပစ္စည်းဥစ္စာ ခွဲဝေပေးရန် ယေရှု ငြင်းဆိုသည်
      '73':
        title: လုပ်သားများ ထပ်မံလိုအပ်ကြောင်း ယေရှု တိုက်တွန်းသည်
      '74':
        title: ရေငတ်သူများစွာရှိသော်လည်း ရေတွင်းမှာ ဗလာဖြစ်နေသည်
      '75':
        title: တစ်ကိုယ်တည်းနေသူတို့ မင်္ဂလာဆောင်ခန်းထဲသို့ ဝင်ကြသည်
      '76':
        title: ထာဝရတည်မည့် ဘဏ္ဍာကို ရှာကြလော့
      '77':
        title: ယေရှုက မိမိကို ဘုရား၏အလင်းအဖြစ် မိန့်တော်မူသည်
      '78':
        title: နူးညံ့သော အဝတ်အစားအကြောင်း ယေရှု မေးခွန်းထုတ်သည်
      '79':
        title: အမှန်တရားကို သည်းခံ၍ စောင့်ထိန်းသော အမျိုးသမီးသည် မင်္ဂလာရှိ၏
      '80':
        title: လောကသည် ခန္ဓာကိုယ်ဖြစ်ကြောင်း တွေ့သိ၍ မထိုက်တန်ဟု မှတ်ယူခြင်း
      '81':
        title: ကြွယ်ဝမှုနှင့် အာဏာဆိုင်ရာ ယေရှု၏ ဝိရောဓိစကား
      '82':
        title: အနီးသို့ ချဉ်းကပ်သူတို့အနားတွင် မီးရှိသည်
      '83':
        title: ပုံရိပ်များ ထင်ရှားသော်လည်း အလင်းက ကွယ်ဝှက်နေသည်
      '84':
        title: မိမိနှင့်တူသော ပုံရိပ်ကို မြင်လျှင် ဝမ်းမြောက်ရသည်
      '85':
        title: အာဒံသည် ကြီးမြတ်သော တန်ခိုးမှ ဖြစ်ပေါ်လာသည်
      '86':
        title: အိမ်ယာမဲ့ခြင်းအကြောင်း ယေရှု မိန့်တော်မူသည်
      '87':
        title: ခန္ဓာနှင့် ဝိညာဉ် အပြန်အလှန်မှီခိုခြင်း၏ ဆင်းရဲဒုက္ခ
      '88':
        title: ကောင်းကင်တမန်များနှင့် ပရောဖက်များ လာကြလိမ့်မည်
      '89':
        title: သန့်စင်ခြင်းအကြောင်း ယေရှု မေးခွန်းထုတ်သည်
      '90':
        title: ရှာဖွေသူတို့အား ယေရှု ငြိမ်သက်ခြင်း ပေးသည်
      '91':
        title: မှန်ကန်သော အသိပညာကို ယေရှု ဖွင့်ပြသည်
      '92':
        title: ရှာကြလော့၊ တွေ့ကြလိမ့်မည်
      '93':
        title: သန့်ရှင်းသောအရာများကို ပညာရှိစွာ ပေးကြလော့
      '94':
        title: ရှာဖွေခြင်းက တွေ့ရှိစေသည်
      '95':
        title: ပြန်ရရန် မမျှော်လင့်ဘဲ ချေးငှားပေးကြလော့
      '96':
        title: နိုင်ငံတော်သည် ဝှက်ထားသော တဆေးနှင့်တူသည်
      '97':
        title: အမျိုးသမီးတစ်ဦး မသိလိုက်ဘဲ မုန့်ညက်များ ဆုံးရှုံးသည်
      '98':
        title: လူတစ်ဦးက မိမိခွန်အားကို ဦးစွာ စမ်းသပ်သည်
      '99':
        title: ညီအစ်ကိုမောင်နှမစစ်တို့သည် အဖ၏အလိုကို နာခံကြသည်
      '100':
        title: အခွန်ပေးခြင်းအကြောင်း ယေရှု ဖြေကြားသည်
      '101':
        title: တပည့်စစ်ဖြစ်ရန် မုန်းရမည့်အရာ
      '102':
        title: တစ်ကိုယ်ကောင်းဆန်သော ဖာရိရှဲတို့ကို ယေရှု ကျိန်ဆိုသည်
      '103':
        title: အသင့်ပြင်ထားသောသူသည် မင်္ဂလာရှိ၏
      '104':
        title: သတို့သား ထွက်ခွာပြီးနောက် ဆုတောင်းကြလော့
      '105':
        title: ထိုးထွင်းသိမြင်မှုက လူပုံအလယ် အရှက်ရစေသည်
      '106':
        title: တစ်လုံးတစ်ဝတည်းဖြစ်ခြင်းက တောင်များကို ရွေ့စေသည်
      '107':
        title: နိုင်ငံတော်က ပျောက်သောသိုးကို ရှာဖွေသည်
      '108':
        title: ကွယ်ဝှက်ထားသောအရာများကို ယေရှု ဖွင့်ပြသည်
      '109':
        title: ဝှက်ထားသော ဘဏ္ဍာသည် သူ့ကိုယ်သူ ဖော်ပြသည်
      '110':
        title: တွေ့ရှိထားသော လောကစည်းစိမ်ကို စွန့်လွှတ်ခြင်း
      '111':
        title: သူ့ရှေ့၌ ကောင်းကင်များ လိပ်တင်သွားသည်
      '112':
        title: ဇာတိခန္ဓာကို အမှီပြုခြင်းအကြောင်း ယေရှု သတိပေးသည်
      '113':
        title: နိုင်ငံတော်သည် မြေကြီးပေါ်တွင် ပျံ့နှံ့နေသည်
      '114':
        title: မာရိနှင့် တန်းတူညီမျှမှုအကြောင်း ယေရှု သွန်သင်သည်
    Gospel of Truth:
      '1':
        title: ကျေးဇူးတော်က အဖ၏ သမ္မာတရားကို ဖွင့်ပြသည်
      '2':
        title: မေ့လျော့ခြင်းအတွင်း အမှားသည် အားကောင်းလာသည်
      '3':
        title: အဖက သားသမီးတို့အား အသိပညာကို ဖွင့်ပြသည်
      '4':
        title: နာမည်ဖြင့် ခေါ်တော်မူခြင်းခံရသူတို့ ငြိမ်သက်ခြင်း ရရှိကြသည်
      '5':
        title: ယေရှုက အရာခပ်သိမ်းကို ပြည့်စုံစေသည်
      '6':
        title: နှုတ်ကပတ်တော်က အမှားကို ထိုးဖောက်ဖြတ်တောက်သည်
      '7':
        title: အဖက နာမည်ပေး၍ ဖြစ်ပေါ်စေသည်
      '8':
        title: ကြောက်မက်ဖွယ်ရာသည် ဘာမျှမဟုတ်ကြောင်း အလင်းက ဖော်ပြသည်
      '9':
        title: သူက အလင်းနှင့် အသက်အကြောင်း သူတို့ကို သွန်သင်သည်
      '10':
        title: သိုးထိန်းက သိုးတစ်ကောင်ကို ရှာဖွေသည်
      '11':
        title: နားလည်ခြင်းက မျက်မမြင်တို့ကို နိုးထစေသည်
      '12':
        title: အလင်းက အပြစ်များမှ ရွေးနုတ်ခြင်းကို ဆောင်ကြဉ်းသည်
      '13':
        title: သူက အလင်း၌ အလိုတော်ကို မိန့်ကြားသည်
      '14':
        title: အဖက ချစ်မြတ်နိုးသောသားကို နာမည်ပေးသည်
      '15':
        title: အဖအတွင်း၌ သမ္မာတရား ငြိမ်သက်နေသည်
      '16':
        title: ကျွန်ုပ်သည် အဖအတွက် မိမိကိုယ်ကို ဆက်ကပ်သည်
    Jubilees:
      '1':
        title: မောရှေက ကရုဏာတော်အတွက် အသနားခံသည်
      '2':
        title: ဣသရေလအတွက် ဥပုသ်နေ့၏ သန့်ရှင်းမြင့်မြတ်မှု
      '3':
        title: ဧဒင်တွင် အာဒံက ဧဝကို နာမည်ပေးသည်
      '4':
        title: ဧနောက်က တရားစီရင်ခြင်းအကြောင်း သတိပေးသည်
      '5':
