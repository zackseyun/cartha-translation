books:
  Genesis:
    display_name: ကမ္ဘာဦးကျမ်း
    author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ မောရှေရေးသားသည်ဟု ယူဆကြသည်။ ခေတ်သစ်ပညာရှင်များကမူ အချိန်ကာလရှည်ကြာစွာ ဖွဲ့စည်းလာခဲ့ပြီး နောက်ပိုင်းတွင် ရင်းမြစ်အမျိုးမျိုးကို စုစည်းတည်းဖြတ်ထားသည်ဟု ရှုမြင်ကြသည်။
    audience: ဘုရားသခင်၏ ဖန်ဆင်းခြင်း၊ ရွေးကောက်ခြင်းနှင့် ကတိတော်တို့၌ မိမိတို့လူမျိုး၏ မူလဇာတ်ကြောင်းကို အခြေတည်လျက် ပဋိညာဉ်ခံလူမျိုးအဖြစ် မည်သူတို့ဖြစ်ကြောင်း နားလည်စေရန် ဣသရေလလူမျိုးအတွက် ရည်ရွယ်သည်။
    date: ရာစုနှစ်များတစ်လျှောက် ဖွဲ့စည်းရေးသားခဲ့သည်။ ဗာဗုလုန်ပြည်သို့ ဖမ်းဆီးခေါ်ဆောင်ခံရသည့်ကာလအတွင်း သို့မဟုတ် ထိုကာလနောက်ပိုင်း၊ ခန့်မှန်းအားဖြင့် ဘီစီ ၆ ရာစုမှ ၅ ရာစုအတွင်း ယနေ့လက်ခံထားသည့် ပုံစံသို့ ရောက်ရှိခဲ့သည်။
    summary: ကမ္ဘာဦးကျမ်းတွင် ဖန်ဆင်းခြင်း၊ လူသားတို့၏ ပုန်ကန်မှုနှင့် အရပ်ရပ်သို့ ကွဲပြားပျံ့နှံ့သွားခြင်းအကြောင်း၊ ထို့ပြင် ဣသရေလအတွက် ဘုရားသခင်၏ ပဋိညာဉ်ကတိတော်များ စတင်ရာ အာဗြဟံ၊ ဣဇာက်၊ ယာကုပ်နှင့် ယောသပ်တို့၏ မိသားစုအကြောင်းကို ပြောပြထားသည်။
    chapters:
      '1':
        title: ဘုရားသခင်သည် ကောင်းကင်နှင့် မြေကြီးကို ဖန်ဆင်းတော်မူခြင်း
      '2':
        title: ဘုရားသခင်သည် ယောက်ျားနှင့် မိန်းမကို ပုံဖော်တော်မူခြင်း
      '3':
        title: လူသားတို့ ဧဒင်ဥယျာဉ်မှ ကျဆုံးခြင်း
      '4':
        title: ကာဣနက ညီအာဗေလကို သတ်ခြင်း
      '5':
        title: အာဒံမှ နောဧအထိ မျိုးရိုးစဉ်ဆက်
      '6':
        title: ဘုရားသခင်သည် အပြစ်ကို ရေလွှမ်းမိုးခြင်းဖြင့် တရားစီရင်ခြင်း
      '7':
        title: ရေလွှမ်းမိုးရာ မြေကြီးကို ဖုံးလွှမ်းခြင်း
      '8':
        title: နောဧသည် သင်္ဘောမှထွက်၍ ဘုရားသခင်ကို ဝတ်ပြုခြင်း
      '9':
        title: ရေလွှမ်းမိုးပြီးနောက် နောဧ၏ မိသားစု
      '10':
        title: နောဧမှ ဆင်းသက်သူတို့ အရပ်ရပ်သို့ ပျံ့နှံ့ခြင်း
      '11':
        title: ဗာဗေလမျှော်စင်၌ ဘာသာစကားရှုပ်ထွေး၍ လူတို့ ကွဲပြားသွားခြင်း
      '12':
        title: အာဗြံသည် နာခံ၍ ခါနာန်ပြည်သို့ ထွက်ခွာခြင်း
      '13':
        title: အာဗြံသည် ကြွယ်ဝစွာ ပြန်လာ၍ ဆုတောင်းခြင်း
      '14':
        title: အာဗြံသည် ကျူးကျော်သူတို့လက်မှ လောတကို ကယ်တင်ခြင်း
      '15':
        title: ဘုရားသခင်က အာဗြံအား သားစဉ်မြေးဆက် ပေးမည်ဟု ကတိပြုခြင်း
      '16':
