        title: ယောသပ်က မုသားပြောသည်ဟူသော စွပ်စွဲချက်များကို ရင်ဆိုင်သည်
      '14':
        title: ယောသပ်က ထွက်ဆိုချက်ကို ပြောင်းလဲရန် ငြင်းဆန်သည်
      '15':
        title: ယောသပ်က အစ်ကိုတို့ကို အရှက်ကွဲခြင်းမှ ကာကွယ်သည်
      '16':
        title: ယောသပ်က လှည့်ဖြားမှုအကြောင်း နှုတ်ဆိတ်နေသည်
      '17':
        title: ယောသပ်က ချစ်၍ အပြစ်များကို ဖုံးအုပ်ပေးသည်
      '18':
        title: ယောသပ်က နှိမ့်ချခြင်းနှင့် ကောင်းချီးကို သင်ပေးသည်
      '19':
        title: ယောသပ်က အနာဂတ်နိုင်ငံတော်ဆိုင်ရာ ရူပါရုံကို ဖော်ပြသည်
      '20':
        title: ယောသပ်က သူ၏အရိုးများကို သယ်ဆောင်ရန် မိန့်မှာသည်
  Testament of Benjamin:
    display_name: ဗင်ယာမိန်၏ သေတမ်းစာ
    author: ရေးသားသူအမည်မသိ။ ဘိုးဘေးကြီးဆယ့်နှစ်ပါး၏ သေတမ်းစာများတွင် တစ်စောင်အပါအဝင်ဖြစ်သည်။
    audience: ဂျူးစာဖတ်သူများ (နောက်ပိုင်းတွင် ခရစ်ယာန်စာဖတ်သူများလည်း)။
    date: ဂျူးမူရင်းအနှစ်သာရမှာ ခန့်မှန်းခြေ ဘီစီ ၂ ရာစုမှဖြစ်ပြီး၊ ခရစ်ယာန်တို့၏ တည်းဖြတ်မှုမှာ ခန့်မှန်းခြေ အေဒီ ၁ ရာစုမှ ၂ ရာစုအတွင်း ဖြစ်နိုင်သည်။
    chapters:
      '1':
        title: ဗင်ယာမိန်က သားနှစ်ယောက်အတွက် ဆုတောင်းသည်
      '2':
        title: ယောသပ်က သစ္စာဖောက်ခံရမှုကို ညီထံမှ ဖုံးကွယ်ထားသည်
      '3':
        title: ဗင်ယာမိန်က ယောသပ်၏ ကရုဏာကို အတုယူရန် တိုက်တွန်းသည်
      '4':
        title: ဖြောင့်မတ်သူတို့က အဆိုးကို အကောင်းဖြင့် အနိုင်ယူကြသည်
      '5':
        title: ကောင်းမှုပြုခြင်းက မှောင်မိုက်မှုကို မောင်းထုတ်သည်
      '6':
        title: လမ်းပြကောင်းကင်တမန်က ငြိမ်သက်ခြင်းဖြင့် အနိုင်ယူသည်
      '7':
        title: ဗေလျာ၏ လှည့်ဖြားသော အကျင့်များကို ရှောင်ကြလော့
      '8':
        title: ဗင်ယာမိန်က ကယ်တင်ရှင်၏ ဘုန်းအသရေကို ပရောဖက်ပြုသည်
      '9':
        title: ပရောဖက်က ဗိမာန်တော် ပြန်လည်သစ်လွင်မည်ဟု ကြိုဟောသည်
      '10':
        title: နောက်ဆုံးရှင်ပြန်ထမြောက်ခြင်းအတွက် အမှန်တရားကို ကျင့်သုံးကြလော့
      '11':
        title: ဝံပုလွေက သစ္စာရှိသော အစေခံ ပေါ်ထွန်းမည်ဟု ပရောဖက်ပြုသည်
      '12':
        title: ဗင်ယာမိန် သေဆုံး၍ ဟေဗြုန်တွင် သင်္ဂြိုဟ်ရန် မိန့်မှာသည်
  Gospel of Philip:
    display_name: ဖိလိပ္ပုခရစ်ဝင်
    author: ရေးသားသူအမည်မသိ။ လက်ရေးမူအဆုံးရှိ စာတမ်းအမည်တွင် ဤခေါင်းစဉ်ကို တွေ့ရသော်လည်း ဖိလိပ္ပုက ရေးသားသူဖြစ်ကြောင်း စာတမ်းကိုယ်တိုင် မဖော်ပြပါ။ ယနေ့တိုင် ကျန်ရစ်သည့် တစ်ခုတည်းသော မိတ္တူမှာ နာဂ်ဟာမာဒီ ကိုဒက်စ် II,3 ပါ ကော့ပတစ်ဘာသာစာသား ဖြစ်သည်။
    audience: ဗယ်လင်တီးနီးယန်းပုံစံ စက္ကမင်တယ်ဆိုင်ရာ သွန်သင်ချက်များ—အထူးသဖြင့် ဗတ္တိဇံ၊ ဆီလိမ်းခြင်း၊ ပွဲတော်မင်္ဂလာ၊ ရွေးနုတ်ခြင်း၊ ရှင်ပြန်ထမြောက်ခြင်းနှင့် မင်္ဂလာဆောင်ခန်း ပုံရိပ်များ—ကို သိကျွမ်းသည့် အစောပိုင်းခရစ်ယာန်အသိုင်းအဝိုင်းတစ်ရပ်။
    date: အများအားဖြင့် အေဒီ ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုအစောပိုင်းဟု ခန့်မှန်းကြသည်။ အစောပိုင်းဂရိမူတစ်ရပ်မှ ဘာသာပြန်ထားသော ၄ ရာစု ကော့ပတစ်လက်ရေးမူဖြင့် ထိန်းသိမ်းထားသည်။
    chapters:
      '1':
        title: ခရစ်တော်က ပြည့်စုံသော ဘုရားဆိုင်ရာမိသားစုကို ဆောင်ကြဉ်းသည်
      '2':
        title: ယုံကြည်ခြင်းက ဆောင်းရာသီ၏ ကတိကို မျိုးစေ့ကြဲသည်
      '3':
        title: စကားလုံးများက စစ်မှန်သော ဝိညာဉ်ရေးအဖြစ်မှန်ကို ဖော်ပြသည်
      '4':
        title: ခရစ်တော်က ဝိညာဉ်ရေးအချုပ်အနှောင်မှ ရွေးနုတ်သည်
      '5':
        title: ယေရှုက မြေကြီးဆိုင်ရာ ဖခင်ကို ခွဲခြားဖော်ပြသည်
      '6':
        title: ယေရှုက ဖုံးကွယ်နေသော ဘုရားဆိုင်ရာအဖြစ်မှန်ကို ဖော်ပြသည်
      '7':
        title: ရှင်ပြန်ထမြောက်ခြင်းက ကိုယ်ခန္ဓာနှင့်တကွ အသက်ရှင်မှုကို ပြောင်းလဲစေသည်
      '8':
        title: ယေရှုက မိမိကိုယ်ကို တဖြည်းဖြည်း ဖော်ပြသည်
      '9':
        title: ဝိညာဉ်ရေးသားသမီးတို့က တည်မြဲသောအသက်ကို တိုးပွားစေသည်
      '10':
        title: ဝိညာဉ်ရေးအရ ပြည့်စုံသူတို့က လူတိုင်းကို အစေခံကြသည်
      '11':
        title: ဗတ္တိဇံက မသေနိုင်သောအသက်သို့ ပြောင်းလဲစေသည်
      '12':
        title: လက်ထပ်ခြင်းနက်နဲရာက သန့်ရှင်းသော တစ်လုံးတစ်ဝတည်းဖြစ်မှုကို ပြန်လည်ဖြစ်စေသည်
      '13':
        title: ဘုရားဆိုင်ရာအမှန်တရားက ဝိညာဉ်ရေးအသစ်မွေးဖွားခြင်းကို ဆောင်လာသည်
      '14':
        title: ခရစ်တော်က တစ်လုံးတစ်ဝတည်းဖြစ်မှုနှင့် အသက်ကို ပြန်လည်ဖြစ်စေသည်
      '15':
        title: ရှင်ပြန်ထမြောက်ခြင်းက ယခုပင် စစ်မှန်သောအသက်ကို နိုးထစေသည်
      '16':
        title: ဘုရားကျေးဇူးတော်အားဖြင့် ယုံကြည်ခြင်း ရင့်ကျက်လာသည်
      '17':
        title: ယေရှုသည် မကောင်းမှုကို ဖော်ထုတ်၍ ဖယ်ရှားသည်
      '18':
        title: သန့်ရှင်းသောပေါင်းစည်းခြင်းက ထာဝရအလင်းကို ဆောင်ကြဉ်းသည်
  Gospel of Mary:
    display_name: မာရိခရစ်ဝင်ကျမ်း
    author: အမည်မသိသူ ရေးသားသည်။ ဤစာတွင် မာရိကို ယေရှု၏ဖွင့်ပြချက်ကို လက်ခံရရှိပြီး အနက်ဖွင့်သူအဖြစ် တင်ပြထားသော်လည်း ယနေ့ကျန်ရှိသော ခရစ်ဝင်ကျမ်းကို မာရိရေးသားခဲ့သည်ဟု မဆိုထားပါ။
    audience: ဖွင့်ပြချက်၊ ဝိညာဉ်ရေးရာအထက်သို့တက်လှမ်းခြင်း၊ တမန်တော်တို့၏အခွင့်အာဏာနှင့် ယေရှု၏တပည့်များအလယ် မာရိ၏သွန်သင်ချက်ကို လက်ခံသင့်မသင့်တို့နှင့်ပတ်သက်၍ စဉ်းစားဆင်ခြင်နေသော အစောပိုင်းခရစ်ယာန်စာဖတ်သူများ။
    date: ယေဘုယျအားဖြင့် ခရစ်နှစ် ၂ ရာစုတွင် ရေးသားခဲ့သည်ဟု ခန့်မှန်းကြသည်။ ဂရိဘာသာဖြင့် အပိုင်းအစများသည် ၃ ရာစုမှ ကျန်ရှိပြီး အဓိက ကော့ပ်တစ်ဘာသာ မူကို ၅ ရာစုနှစ် ဘာလင်ကိုဒက်စ် ၈၅၀၂ တွင် ထိန်းသိမ်းထားသည်။
    chapters:
      '1':
        title: ကယ်တင်ရှင်သည် အပြစ်ကို ဆန့်ကျင်ရန် သွန်သင်သည်
      '2':
        title: ယေရှုသည် တပည့်များအား ငြိမ်သက်ခြင်းဖြင့် စေလွှတ်သည်
      '3':
        title: မာရိသည် သွန်သင်ချက်များဖြင့် နှစ်သိမ့်သည်
      '4':
        title: ဝိညာဉ်သည် မေ့လျော့ခြင်းကို အောင်နိုင်သည်
      '5':
        title: လေဝိသည် ခရစ်ဝင်သတင်းကြေညာရန် တိုက်တွန်းသည်
  Treatise on the Resurrection:
    display_name: ရှင်ပြန်ထမြောက်ခြင်းဆိုင်ရာ ကျမ်းပြုစာ
    author: အမည်မသိသူ ရေးသားသည်။ ဤစာကို ဆရာတစ်ဦးက ရေဂီနော့စ်အမည်ရှိ တပည့်တစ်ဦးထံ ရေးသောစာပုံစံဖြင့် ဖွဲ့စည်းထားသည်။ ဆရာဖြစ်သူနှင့် ရေဂီနော့စ်တို့ မည်သူမည်ဝါဖြစ်ကြောင်းကိုမူ သေချာစွာ မဖော်ထုတ်နိုင်ပါ။
    audience: ရှင်ပြန်ထမြောက်ခြင်းအကြောင်း သွန်သင်ချက်ရှာဖွေနေသော ခရစ်ယာန်များ၊ အထူးသဖြင့် ကိုယ်ခန္ဓာပိုင်းနှင့် ဝိညာဉ်ရေးရာ ရှင်ပြန်ထမြောက်ခြင်းတို့အပြင် ယခုပင် ရှင်ပြန်ထမြောက်ခြင်းအသက်တာတွင် ပါဝင်ခံစားနိုင်ခြင်းကို ဆင်ခြင်နေသော စာဖတ်သူများ။
    date: ယေဘုယျအားဖြင့် ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း (ခန့်မှန်းခြေ ခရစ်နှစ် ၁၇၀–၂၀၀) တွင် ရေးသားခဲ့သည်ဟု ယူဆကြသည်။ အစောပိုင်း ဂရိဘာသာစာမူတစ်ခုမှ ပြန်ဆိုထားသည့် ၄ ရာစုနှစ် ကော့ပ်တစ်ဘာသာ မိတ္တူဖြင့် ထိန်းသိမ်းထားသည်။
    chapters:
      '1':
        title: ခရစ်တော်သည် စစ်မှန်သောပြည့်စုံခြင်းကို ဆောင်ကြဉ်းသည်
      '2':
        title: ခရစ်တော်သည် သေခြင်း၏ချုပ်ကိုင်မှုကို အောင်နိုင်သည်
      '3':
        title: ရှင်ပြန်ထမြောက်ခြင်းသည် အရှိတရားကို ပြောင်းလဲစေသည်
      '4':
        title: ယုံကြည်သူများသည် ခရစ်တော်၏ရှင်ပြန်ထမြောက်ခြင်းတွင် ပါဝင်ကြသည်
      '5':
        title: ခရစ်တော်၏ရှင်ပြန်ထမြောက်ခြင်းကို ယုံကြည်ခြင်း
      '6':
        title: ကယ်တင်ခြင်း၏ပညာသည် ထာဝစဉ်တည်သည်
      '7':
