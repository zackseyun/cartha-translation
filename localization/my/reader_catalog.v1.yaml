      '25':
        title: အာဗြဟံ၏ သားစဉ်မြေးဆက်နှင့် သေဆုံးခြင်းမှတ်တမ်း
      '26':
        title: ဣဇာက်သည် ဂေရာမြို့တွင် ကာကွယ်စောင့်ရှောက်ခံရ၍ နေထိုင်ခြင်း
      '27':
