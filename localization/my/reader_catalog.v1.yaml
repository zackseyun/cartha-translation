        title: ရှမာရိနှင့် ယုဒကို ဘုရားသခင် တရားစီရင်သည်
      '2':
        title: လောဘကြီးသော အကြံအစည်ရှင်များကို မိက္ခာ ပြစ်တင်ရှုတ်ချသည်
      '3':
        title: ခေါင်းဆောင်များက လူထုကို ရက်စက်စွာ ခေါင်းပုံဖြတ်သည်
      '4':
        title: ထာဝရဘုရားသည် လူမျိုးအပေါင်းတို့၏အထက်၌ စိုးစံသည်
      '5':
        title: ဗက်လင်မြို့မှ ဒါဝိဒ်မင်း ပေါ်ထွန်းလာမည်
      '6':
        title: ထာဝရဘုရားက ဣသရေလကို တရားစွဲဆိုသည်
      '7':
        title: မိက္ခာသည် ဝမ်းနည်းခြင်းကြားမှ ဆုတောင်းသည်
  Nahum:
    display_name: နာဟုံ
    author: ဧလကောရှမြို့သား နာဟုံ။
    audience: မကြာမီ နိနေဝေမြို့ ပျက်စီးကျဆုံးမည့်အရေးကို ဝမ်းမြောက်နေသော ယုဒပြည်သူများ။
    date: ဘီစီ ၆၁၂ မတိုင်မီ မကြာမီ။
    chapters:
      '1':
        title: နိနေဝေ၏အပြစ်ကို ဘုရားသခင် အပြစ်ပေးသည်
      '2':
        title: တမန်က ယုဒပြည်သို့ ငြိမ်းချမ်းရေးသတင်း ယူဆောင်လာသည်
      '3':
        title: နိနေဝေသည် အရှက်ကွဲခြင်း အပြည့်အဝ ခံရမည်
  Habakkuk:
    display_name: ဟဗက္ကုတ်
    author: ဟဗက္ကုတ်။
    audience: ဗာဗုလုန်နိုင်ငံ အင်အားကြီးလာမှုကို ရင်ဆိုင်နေရသော ယုဒပြည်သူများအတွက်—တရားမျှတမှုနှင့်ပတ်သက်၍ ပရောဖက်နှင့် ဘုရားသခင်တို့၏ အပြန်အလှန်ပြောဆိုမှု။
    date: ခန့်မှန်းခြေ ဘီစီ ၇ ရာစုနှောင်းပိုင်း။
    chapters:
      '1':
        title: ဆိုးညစ်သူများ အုပ်စိုးမှုအတွက် ဟဗက္ကုတ် မြည်တမ်းသည်
      '2':
        title: မာနကြီးသော ဖိနှိပ်သူများကို ဘုရားသခင် သတိပေးသည်
      '3':
        title: ဟဗက္ကုတ်သည် သန့်ရှင်းသော ကြောက်ရွံ့မှုဖြင့် ဆုတောင်းသည်
  Zephaniah:
    display_name: ဇေဖနိ
    author: ကုရှိ၏သား ဇေဖနိ။
    audience: ယောရှိမင်း၏ ပြုပြင်ပြောင်းလဲမှုများ မစတင်မီကာလ၊ သူ၏အုပ်စိုးမှုအောက်ရှိ ယုဒပြည်သူများ။
    date: ခန့်မှန်းခြေ ဘီစီ ၆၄၀–၆၀၉။
    chapters:
      '1':
        title: ယုဒ၏အပြစ်ကို ဘုရားသခင် တရားစီရင်သည်
      '2':
        title: လူမျိုးတို့ အပြစ်ပေးခံရသော်လည်း မျှော်လင့်ချက် ကျန်ရှိသည်
      '3':
        title: သန့်စင်ခံရသော လူမျိုးအတွက် ဇိအုန် ဝမ်းမြောက်သည်
  Haggai:
    display_name: ဟဂ္ဂဲ
    author: ဟဂ္ဂဲ။
    audience: ဒါရိမင်းလက်ထက် ဗိမာန်တော်ကို ပြန်လည်တည်ဆောက်နေသော နေရပ်ပြန်လာသူများ။
    date: ဘီစီ ၅၂၀။
    chapters:
      '1':
        title: မိမိအိမ်တော်ကို ပြန်လည်တည်ဆောက်ရန် ထာဝရဘုရား တိုက်တွန်းသည်
      '2':
        title: ဗိမာန်တော် တည်ဆောက်သူများကို ဘုရားသခင် အားပေးသည်
  Zechariah:
    display_name: ဇာခရိ
    author: ဗေရခိ၏သား ဇာခရိ။ အခန်းကြီး ၉–၁၄ ကို နောက်ပိုင်းစာရေးသူတစ်ဦးက ရေးသားခဲ့ခြင်း ဖြစ်နိုင်သည်။
    audience: ဗိမာန်တော်ကို ပြန်လည်တည်ဆောက်နေသော နေရပ်ပြန်လာသူများနှင့် နောက်ပိုင်း ပြည်နှင်ဒဏ်လွန်ခေတ် လူမှုအသိုင်းအဝိုင်းများ။
    date: အခန်းကြီး ၁–၈ သည် ခန့်မှန်းခြေ ဘီစီ ၅၂၀–၅၁၈၊ အခန်းကြီး ၉–၁၄ သည် ရာစုနှစ်တစ်ခုခန့် နောက်ပိုင်း ဖြစ်နိုင်သည်။
    chapters:
      '1':
        title: ဘုရားသခင်သည် ကရုဏာဖြင့် ပြန်လာသည်
      '2':
        title: ယေရုရှလင်မြို့၌ ဝမ်းမြောက်ခြင်း လျှံပယ်မည်
      '3':
        title: ယောရှုကို ဘုရားသခင် သန့်စင်ပေးသည်
      '4':
        title: ဇေရုဗဗေလသည် ဝိညာဉ်တော်အားဖြင့် တည်ဆောက်သည်
      '5':
        title: ဆိုးညစ်မှုကို ပြည်မှ ဖယ်ရှားသည်
      '6':
        title: ယဇ်ပုရောဟိတ်ယောရှုအတွက် သရဖူများ
      '7':
        title: တရားမျှတမှုမရှိလျှင် အစာရှောင်ခြင်း အချည်းနှီးဖြစ်သည်
      '8':
        title: ဇိအုန်ကို ငြိမ်းချမ်းစွာ ပြန်လည်တည်ဆောက်သည်
      '9':
        title: ဣသရေလ၏ဘုရင်သည် နှိမ့်ချစွာ ကြွလာသည်
      '10':
        title: ရုပ်တုများကို မကိုးစားဘဲ မိုးကို တောင်းလျှောက်ကြလော့
      '11':
        title: သိုးထိန်းက သိုးများကို စွန့်ပစ်သည်
      '12':
        title: ယေရုရှလင်သည် လူမျိုးတို့အတွက် ထိတ်လန့်စရာ ဖြစ်လာသည်
      '13':
        title: ပြည်ကို အပြစ်မှ သန့်စင်သည်
      '14':
        title: ထာဝရဘုရားသည် ယေရုရှလင်အတွက် စစ်တိုက်သည်
  Malachi:
    display_name: မာလခိ
    author: ရေးသားသူအမည်မသိ။ “မာလခိ” ဟူသည် “ငါ၏တမန်” ဟု အဓိပ္ပာယ်ရသည်။
    audience: ပါရှားအုပ်ချုပ်မှုအောက်တွင် ဝတ်ပြုကိုးကွယ်ခြင်းနှင့် သစ္စာစောင့်သိခြင်း၌ ပေါ့လျော့လာသော ပြည်နှင်ဒဏ်လွန်ခေတ် ယုဒပြည်သူများ။
    date: ခန့်မှန်းခြေ ဘီစီ ၅ ရာစုအလယ်ပိုင်း။
    chapters:
      '1':
        title: မရိုးသားသော ယဇ်ပုရောဟိတ်များကို ဘုရားသခင် ပြစ်တင်ရှုတ်ချသည်
      '2':
        title: ယုဒသည် ပဋိညာဉ်ကို သစ္စာဖောက်သည်
      '3':
        title: တမန်သည် သန့်စင်ခြင်းအတွက် လမ်းပြင်ဆင်သည်
  Matthew:
    display_name: မဿဲ
    author: ရေးသားသူအမည်မသိ။ အစဉ်အလာအရ တမန်တော်မဿဲ ရေးသားသည်ဟု ယူဆကြသည်။ ခေတ်သစ်သုတေသနပညာရှင်များကမူ မာကုကျမ်းနှင့် Q နှင့်ဆင်တူသော ရင်းမြစ်တစ်ခုကို အသုံးပြုသည့် ဂရိစကားပြော ယုဒခရစ်ယာန် စာရေးသူတစ်ဦးဟု ယူဆကြသည်။
    audience: တရားဇရပ်ဗဟိုပြု ယုဒဘာသာနှင့် ဆက်နွှယ်နေမှု၊ ကွာခြားနေမှုတို့ကို စဉ်းစားရုန်းကန်နေသော ယုဒခရစ်ယာန် လူမှုအသိုင်းအဝိုင်းတစ်ခု။
    date: ခန့်မှန်းခြေ အေဒီ ၈၀–၉၀။
    chapters:
      '1':
        title: မေရှိယ၏ မျိုးရိုးမှ ယေရှု မွေးဖွားသည်
      '2':
        title: ပညာရှိများက မွေးကင်းစဘုရင်ကို ကိုးကွယ်ကြသည်
      '3':
        title: ယောဟန်က ယေရှုကို ဗတ္တိဇံပေး၍ ဘိသိက်ခံတော်မူသည်
      '4':
        title: ဘုရားသခင်၏နိုင်ငံတော် နီးလာပြီဟု ယေရှု သွန်သင်သည်
      '5':
        title: နိုင်ငံတော်၏လမ်းစဉ်ကို ယေရှု သွန်သင်သည်
      '6':
        title: အဘ၏နိုင်ငံတော်ကို ဦးစွာရှာကြလော့
      '7':
        title: သင်တို့၏အသက်တာကို ခရစ်တော်အပေါ် တည်ဆောက်ကြလော့
      '8':
        title: ယေရှုသည် ရောဂါကုသ၍ အာဏာတော်ကို ပြသည်
      '9':
        title: ယေရှုသည် လေဖြတ်သူကို ကုသပေးသည်
      '10':
        title: ယေရှုသည် တမန်တော်ဆယ့်နှစ်ပါးကို စေလွှတ်သည်
      '11':
        title: မယုံကြည်သော မြို့များကို ယေရှု ပြစ်တင်သည်
      '12':
        title: မိသားစုအစစ်အမှန်ကို ယေရှု ဖော်ပြသည်
      '13':
        title: နိုင်ငံတော်အကြောင်း ပုံဥပမာများကို ယေရှု သွန်သင်သည်
      '14':
        title: ယေရှုသည် လူအုပ်ကြီးကို အံ့ဖွယ်နည်းဖြင့် အစာကျွေးသည်
      '15':
        title: ဘာသာရေးအရ ဟန်ဆောင်မှုကို ယေရှု ရင်ဆိုင်ဖော်ထုတ်သည်
      '16':
        title: အသင်းတော်နှင့် ဆင်းရဲဒုက္ခအကြောင်း ယေရှု ဖော်ပြသည်
      '17':
        title: ယေရှု၏အသွင်အပြင် ပြောင်းလဲ၍ ဧလိယအကြောင်း မိန့်တော်မူသည်
      '18':
        title: နှိမ့်ချခြင်းနှင့် ခွင့်လွှတ်ခြင်းကို ယေရှု သွန်သင်သည်
      '19':
        title: အိမ်ထောင်ရေးနှင့် နိုင်ငံတော်အကြောင်း ယေရှု သွန်သင်သည်
      '20':
        title: အစေခံခြင်းအားဖြင့် ကြီးမြတ်ခြင်းအကြောင်း ယေရှု သွန်သင်သည်
      '21':
        title: ယေရှုသည် ဘုရင်အဖြစ် ယေရုရှလင်မြို့သို့ ဝင်တော်မူသည်
      '22':
        title: ခေါင်းဆောင်တို့၏ ထောင်ချောက်ဆင်မေးခွန်းများကို ယေရှု ပညာရှိစွာ ဖြေသည်
      '23':
        title: ဟန်ဆောင်မှုကို ရှောင်ရန် ယေရှု သတိပေးသည်
      '24':
        title: ဗိမာန်တော် ပျက်စီးမည့်အကြောင်း ယေရှု ကြိုတင်ဟောပြောသည်
      '25':
        title: ယေရှုသည် လူမျိုးတို့ကို ခွဲခြား၍ တရားစီရင်သည်
      '26':
        title: ယေရှု ဖမ်းဆီးခံရ၍ လှောင်ပြောင်ခံရပြီး လက်ဝါးကပ်တိုင်တင်ခံရသည်
      '27':
        title: ယေရှုကို သင်္ဂြိုဟ်ပြီး အစောင့်များက သင်္ချိုင်းကို လုံခြုံစေသည်
      '28':
        title: ယေရှု ရှင်ပြန်ထမြောက်၍ တပည့်တော်များကို စေလွှတ်သည်
  Mark:
    display_name: မာကု
    author: ရေးသားသူအမည်မသိ။ အစဉ်အလာအရ ပေတရု၏ ခရီးသွားဖော် ယောဟန်မာကုနှင့် ဆက်စပ်သည်ဟု ယူဆကြသည်။
