      '3':
        title: အန္နက မိမိ၌ သားသမီးမရှိခြင်းကို ငိုကြွေးသည်
      '4':
        title: အန္နဆုတောင်းရာ ကောင်းကင်တမန်က တုံ့ပြန်သည်
      '5':
        title: ယောကိမ်က အပြစ်မရှိသည်ကို မြင်သည်
      '6':
        title: ယောကိမ်က မာရိကို အိမ်သို့ ခွန်အားနှင့် ကြိုဆိုသည်
      '7':
        title: အစ္စရေး၏ ချစ်ခင်ခြင်းကို ခံရသော သမီးငယ်က ကခုန်သည်
      '8':
        title: မာရိသည် ဗိမာန်တော်တွင် ဆက်လက်နေထိုင်သည်
      '9':
        title: အပျိုကညာအတွက် ယောသပ်ကို ရွေးချယ်သည်
      '10':
