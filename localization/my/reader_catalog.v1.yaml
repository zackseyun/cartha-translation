        title: အနာဂတ်နက်နဲရာများကို ဘုရားသခင်က ဗာရုတ်အား ပြသသည်
      '56':
        title: မိုးတိမ်သည် ကမ္ဘာဦးအစကို ကိုယ်စားပြုသည်
