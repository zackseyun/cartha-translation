    date: ဘုရင်စနစ်နှောင်းပိုင်းမှ ပြည်နှင်ခံရပြီးနောက်ကာလအထိ ရေးဖွဲ့မှုအလွှာများ ပါဝင်ပြီး ခန့်မှန်းအားဖြင့် ဘီစီ ၇ ရာစုမှ ၅ ရာစုအတွင်း ဖြစ်သည်။
