      '107':
        title: နောက်ဆုံးမျိုးဆက်က ပြန်လည်ထူထောင်ခြင်းကို ဆောင်ကြဉ်းသည်
      '108':
        title: နောက်ဆုံးသတိပေးချက်ကို ဧနောက် ရေးသားသည်
  2 Baruch:
    display_name: ဗာရုတ် ဒုတိယကျမ်း
    author: ရေးသားသူအမည်မသိ။ ယေရမိ၏ စာရေးတော် ဗာရုတ် ရေးသားသကဲ့သို့ အမည်ခံထားသည်။
    audience: ခရစ်နှစ် ၇၀ တွင် ဗိမာန်တော်ဖျက်ဆီးခံရပြီးနောက် ပြည်နှင်ဒဏ်ခံရခြင်း၏ အဓိပ္ပာယ်ကို ဘာသာရေးရှုထောင့်မှ ဆင်ခြင်နေကြသော ဂျူးလူမျိုးများအတွက် ဖြစ်သည်။
    date: ခန့်မှန်းခြေ ခရစ်နှစ် ၁ ရာစုနှောင်းပိုင်းမှ ၂ ရာစုအစောပိုင်းအတွင်း။ အဓိကအားဖြင့် ဆီးရီးယားဘာသာဖြင့် ထိန်းသိမ်းလက်ဆင့်ကမ်းခဲ့သည်။
    chapters:
      '1':
        title: ဘုရားသခင်က ဗာရုတ်အား ယုဒပြည်အကြောင်း သတိပေးသည်
      '2':
        title: ထွက်ခွာသွားရန် ထာဝရဘုရားက ဗာရုတ်အား မိန့်မှာသည်
      '3':
        title: ယေရုရှလင်မြို့၏ ကံကြမ္မာအတွက် ဗာရုတ် အသနားခံသည်
      '4':
        title: ကွယ်ဝှက်ထားသောမြို့၏ အမှန်တကယ်တည်ရှိမှုကို ထာဝရဘုရား ဖော်ပြသည်
      '5':
        title: ယေရမိ၏အဖွဲ့နှင့်အတူ ဗာရုတ် ငိုကြွေးသည်
