  Hebrews:
    display_name: ဟေဗြဲဩဝါဒစာ
    author: ရေးသူအမည်မသိပါ။ အစဉ်အလာအရ ပေါလု၊ အာပေါလု၊ ဗာနဗ၊ ပြစ်ကိလနှင့် အခြားသူများ၏အမည်ကို အဆိုပြုခဲ့ကြသော်လည်း မည်သည့်အဆိုကိုမျှ ပညာရှင်အများစုက သဘောတူလက်ခံထားခြင်း မရှိပါ။
    audience: မိမိတို့၏ ခရစ်ယာန်ယုံကြည်ဝန်ခံမှုမှ ပြန်လည်ဝေးကွာသွားရန် သွေးဆောင်ခံနေရသော ဂရိစကားပြော ဂျူးခရစ်ယာန်များ။
    date: ခရစ်နှစ် ၆၀–၉၅ ဝန်းကျင်။
    chapters:
      '1':
        title: ဘုရားသခင်က မိမိ၏သားတော်မှတစ်ဆင့် မိန့်တော်မူခြင်း
      '2':
        title: ယေရှုသည် ဒုက္ခခံခြင်းအားဖြင့် ကယ်တင်တော်မူခြင်း
      '3':
        title: သစ္စာရှိသော ယေရှုကို မျက်မှောက်ပြုခြင်း
      '4':
        title: ဘုရားသခင် ကတိထားတော်မူသော ငြိမ်ဝပ်ခြင်းသို့ ဝင်ရောက်ခြင်း
      '5':
        title: ခရစ်တော်က ပြည့်စုံသောယဇ်ကို ပူဇော်ခြင်း
      '6':
        title: ဝိညာဉ်ရေးရာ ရင့်ကျက်မှုသို့ ရှေ့ဆက်ခြင်း
      '7':
        title: မေလခိဇေဒက်နည်းတူ ယေရှုသည် ထာဝရယဇ်ပုရောဟိတ်ဖြစ်ခြင်း
      '8':
        title: ယေရှု၏အသွေးအားဖြင့် ပဋိညာဉ်သစ်ကို တည်စေခြင်း
      '9':
        title: ယေရှုက ကောင်းကင်ဘုံရှိ စစ်မှန်သော သန့်ရှင်းရာဌာနတော်သို့ ဝင်ရောက်ခြင်း
      '10':
        title: ခရစ်တော်၏အသွေးအားဖြင့် ဘုရားသခင်ထံ ချဉ်းကပ်ခြင်း
      '11':
        title: ဘိုးဘေးတို့၏ ယုံကြည်ခြင်း တည်မြဲသည်
      '12':
        title: ယေရှုနှင့်အတူ ဆင်းရဲဒုက္ခကို ကြံ့ကြံ့ခံပါ
      '13':
        title: ချစ်ခြင်းမေတ္တာနှင့် ယုံကြည်ကိုးစားမှုဖြင့် အသက်ရှင်ပါ
  James:
    display_name: ယာကုပ်ဩဝါဒစာ
    author: အစဉ်အလာအရ ယေရှု၏ညီ ယာကုပ်ဟု ယူဆကြသည်။ မျက်မှောက်ခေတ် ပညာရှင်များကမူ ယာကုပ်ကိုယ်တိုင် ရေးသားခြင်းလော၊ ယာကုပ်၏အမည်ကိုခံယူ၍ အခြားသူတစ်ဦး ရေးသားခြင်းလောဟူ၍ အမြင်ကွဲပြားကြသည်။
    audience: ပြည်ပအရပ်ရပ်၌ ပျံ့နှံ့နေသော ဂျူးခရစ်ယာန် အသင်းတော်များ။
    date: ယာကုပ်ကိုယ်တိုင် ရေးသားခဲ့လျှင် ခရစ်နှစ် ၅၀–၆၀ ပြည့်လွန်နှစ်များခန့်၊ ယာကုပ်၏အမည်ကိုခံယူ၍ ရေးသားခဲ့လျှင် ခရစ်နှစ် ပထမရာစုနှောင်းပိုင်းခန့်။
    chapters:
      '1':
        title: စမ်းသပ်မှုများဖြင့် စစ်ဆေးခံရသော ယုံကြည်ခြင်း တည်မြဲသည်
      '2':
        title: အကျင့်မပါသော ယုံကြည်ခြင်းသည် အသေဖြစ်သည်
      '3':
        title: လျှာကိုထိန်း၍ ပညာရှိစွာ ပြောဆိုပါ
      '4':
        title: ရန်ပွဲများသည် တစ်ကိုယ်ကောင်းဆန်မှုမှ ဖြစ်ပေါ်သည်
      '5':
        title: ဖိနှိပ်သော သူဌေးတို့အတွက် တရားစီရင်ခြင်း နီးပြီ
  1 Peter:
    display_name: ပေတရုဩဝါဒစာ ပထမစောင်
    author: အစဉ်အလာအရ တမန်တော်ပေတရုက ရေးသားပြီး သိလွာနုက စာရေးကူညီသူဖြစ်သည်ဟု ယူဆကြသည်။ ပညာရှင်အချို့ကမူ ပေတရု၏အမည်ကိုခံယူ၍ အခြားသူတစ်ဦး ရေးသားသည်ဟု ယူဆကြသည်။
    audience: ရောမအင်ပါယာလက်အောက်ရှိ အာရှမိုင်းနားဒေသတွင် လူမှုအသိုင်းအဝိုင်း၏ ရန်လိုမှုကို ရင်ဆိုင်နေရသော ခရစ်ယာန်များ။
    date: ပေတရု ရေးသားခဲ့လျှင် ခရစ်နှစ် ၆၀ ပြည့်လွန်နှစ်များခန့်၊ ပေတရု၏အမည်ကိုခံယူ၍ ရေးသားခဲ့လျှင် ခရစ်နှစ် ၇၀–၉၀ ပြည့်လွန်နှစ်များခန့်။
    chapters:
      '1':
        title: ကောင်းကင်ဘုံရှိ အမွေကို မျှော်လင့်ခြင်း
      '2':
        title: ယုံကြည်သူတို့သည် အသက်ရှင်သော ကျောက်ပေါ်တွင် တည်ဆောက်ခံရသည်
      '3':
        title: ဇနီးတို့သည် မိမိတို့၏ အသက်တာဖြင့် ခရစ်တော်ကို ဂုဏ်ပြုကြသည်
      '4':
        title: ကောင်းမှန်ရာကို ပြုသောကြောင့် ဆင်းရဲခံရခြင်း
      '5':
        title: အသက်ကြီးသူတို့သည် ယုံကြည်ခြင်း၏ စံနမူနာဖြင့် စောင့်ရှောက်ကြသည်
  2 Peter:
    display_name: ပေတရုဩဝါဒစာ ဒုတိယစောင်
    author: အစဉ်အလာအရ ပေတရုရေးသားသည်ဟု ယူဆကြသည်။ မျက်မှောက်ခေတ် ပညာရှင်အများစုကမူ ပေတရု၏အမည်ကိုခံယူ၍ အခြားသူတစ်ဦး ရေးသားသည်ဟု ယူဆကြသည်။
    audience: ခရစ်တော် ပြန်လည်ကြွလာမည်ကို ငြင်းပယ်လှောင်ပြောင်သူများနှင့် ရင်ဆိုင်နေရသော ခရစ်ယာန်များ။
    date: ခရစ်နှစ် ဒုတိယရာစုအစောပိုင်းခန့်။
    chapters:
      '1':
        title: ပေတရုက ဝိညာဉ်ရေးရာ ကြီးထွားမှုကို သွန်သင်သည်
      '2':
        title: မှားယွင်းသောဆရာတို့သည် လျင်မြန်သည့် တရားစီရင်ခြင်းကို ခံရမည်
      '3':
        title: ပေတရုက နောက်ဆုံးတရားစီရင်ခြင်းကို သတိပေးသည်
  1 John:
    display_name: ယောဟန်ဩဝါဒစာ ပထမစောင်
    author: ရေးသားသူအမည် မဖော်ပြထားပါ။ အစဉ်အလာအရ တမန်တော်ယောဟန် သို့မဟုတ် ယောဟန်အသိုင်းအဝိုင်းမှ အသက်ကြီးသူတစ်ဦးဟု ယူဆကြသည်။
    audience: အုပ်စုကွဲသွားပြီးနောက် မည်သူတို့က အသိုင်းအဝိုင်းတွင် အမှန်တကယ် ပါဝင်သူများဖြစ်ကြောင်း သတ်မှတ်နေသော ယောဟန်နှင့်ဆက်နွှယ်သည့် ယုံကြည်သူအသိုင်းအဝိုင်း။
    date: ခရစ်နှစ် ၉၀–၁၁၀ ခန့်။
    chapters:
      '1':
        title: အလင်းသည် စစ်မှန်သော မိတ်သဟာယကို ဖော်ပြသည်
      '2':
        title: ချစ်ခြင်းမေတ္တာရှိသူသည် ဘုရားသခင်၏ ပညတ်များကို စောင့်ထိန်းသည်
      '3':
        title: ဘုရားသခင်ထံမှ မွေးဖွားသူတို့သည် အပြစ်ကို အောင်နိုင်ကြသည်
      '4':
        title: စစ်မှန်သော ချစ်ခြင်းမေတ္တာသည် ဘုရားသခင်ထံမှ လာသည်
      '5':
        title: ယေရှုကို ယုံကြည်သူ၌ ထာဝရအသက်ရှိသည်
  2 John:
    display_name: ယောဟန်ဩဝါဒစာ ဒုတိယစောင်
    author: “အသက်ကြီးသူ။”
    audience: မှားယွင်းသွန်သင်သူများကို သတိပြုရန် သတိပေးခံရသည့် သီးခြားခရစ်ယာန်အသင်းတော်တစ်ပါး (“ရွေးကောက်ခံအမျိုးသမီး”)။
    date: ခရစ်နှစ် ၉၀–၁၁၀ ခန့်။
    chapters:
      '1':
        title: အသက်ကြီးသူက မှားယွင်းသောဆရာတို့ကို သတိပေးသည်
  3 John:
    display_name: ယောဟန်ဩဝါဒစာ တတိယစောင်
    author: “အသက်ကြီးသူ။”
    audience: နယ်လှည့်သာသနာပြုများကို ဧည့်ခံပေးသော ခေါင်းဆောင်တစ်ဦးဖြစ်သည့် ဂါယု။
    date: ခရစ်နှစ် ၉၀–၁၁၀ ခန့်။
    chapters:
      '1':
        title: အသက်ကြီးသူက ဂါယု အစစအရာရာ ကောင်းစားရန် ဆုတောင်းသည်
  Jude:
    display_name: ယုဒဩဝါဒစာ
    author: အစဉ်အလာအရ ယာကုပ်၏ညီ၊ ယေရှု၏ညီဖြစ်သူ ယုဒဟု ယူဆကြသည်။
    audience: အကျင့်ပျက်လွတ်လပ်စွာ နေထိုင်ရန် သွန်သင်သူများ စိမ့်ဝင်လာနေသော ခရစ်ယာန်အသိုင်းအဝိုင်းများ။
    date: ခရစ်နှစ် ၆၀–၉၀ ပြည့်လွန်နှစ်များခန့်။
    chapters:
      '1':
        title: ယုဒက ဘုရားမဲ့သော ကျူးကျော်ဝင်ရောက်သူတို့ကို သတိပေးသည်
  Revelation:
    display_name: ဗျာဒိတ်ကျမ်း
    author: ပတ်မုကျွန်းမှ ယောဟန် (စတုတ္ထခရစ်ဝင်ကျမ်းနှင့် ရေးဟန်ကွဲပြားသည်)။
    audience: အင်ပါယာ၏ ဖိအားအောက်တွင် ရှိနေသော ရောမအင်ပါယာလက်အောက် အာရှမိုင်းနားဒေသရှိ ခရစ်ယာန်အသင်းတော် ခုနစ်ပါး။
    date: ခရစ်နှစ် ၉၀ ပြည့်လွန်နှစ်များခန့်၊ အစဉ်အလာအရ ဒေါမိတိအန်မင်း နန်းစံချိန်။
    chapters:
      '1':
        title: ဘုရားသခင်က ယောဟန်အား ရူပါရုံများကို ပြသသည်
      '2':
        title: ယေရှုက အသင်းတော်ခုနစ်ပါးကို မိန့်ကြားသည်
      '3':
        title: ယေရှုက လောဒိကိမြို့သားတို့အား နောင်တရရန် သတိပေးသည်
      '4':
        title: ကောင်းကင်ဘုံ၏ ပလ္လင်တော်သည် ဘုန်းအသရေဖြင့် တောက်ပသည်
      '5':
        title: သိုးသငယ်သည် စာလိပ်ကိုယူ၍ ရွေးနုတ်ကယ်တင်သည်
      '6':
        title: မြင်းစီးသူလေးဦးက ဘေးဒုက္ခကြီးများ ဆောင်ကြဉ်းသည်
      '7':
        title: တံဆိပ်ခတ်ခံရသော အစေခံတို့သည် ထာဝရချီးမွမ်းသီဆိုကြသည်
      '8':
        title: တံပိုးခုနစ်လုံးမှုတ်၍ ကြောက်မက်ဖွယ် တရားစီရင်မှုများ ဖြစ်ပေါ်သည်
      '9':
        title: ကျိုင်းကောင်တို့သည် မြေကြီးပေါ်ရှိ အပြစ်သားများကို ညှဉ်းဆဲကြသည်
      '10':
