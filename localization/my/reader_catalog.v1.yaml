        title: အနက်ရောင်ရေများသည် အာဒံ၏ လွန်ကျူးမှုကို ဆိုလိုသည်
      '58':
        title: အပြစ်က ကမ္ဘာမြေကို ဖုံးလွှမ်းသည်ကို အာဒံမြင်သည်
      '59':
        title: အပြစ်နှင့်ပြည့်သော ကမ္ဘာပေါ်တွင် မိုးတိမ် မြင့်တက်လာသည်
      '60':
        title: အာမောရိလူတို့၏ ဆိုးယုတ်မှုက အစ္စရေးကို စွန်းထင်းစေသည်
      '61':
        title: ဒါဝိဒ်နှင့် ရှောလမုန်တို့၏ခေတ် စည်ပင်ဝပြောသည်
      '62':
        title: ယေရောဗောင်၏ အပြစ်က ပျက်စီးခြင်းကို ဖြစ်စေသည်
      '63':
        title: ဟေဇကိ၏ ဖြောင့်မတ်ခြင်း ထင်ရှားသည်
      '64':
        title: မနာရှေ၏ ဆိုးယုတ်မှုက ညစ်ညမ်းစေသည်
      '65':
        title: အာမုန်၏ ဒုစရိုက်က အမှောင်ထုအတွင်း စိုးမိုးသည်
      '66':
        title: ယောရှိ၏ စင်ကြယ်မှုက ဇိအုန်ကို ပြန်လည်ထူထောင်သည်
      '67':
