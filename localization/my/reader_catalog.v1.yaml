    date: ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်က ဖြစ်နိုင်ဖွယ်ရှိပြီး နာဂ်ဟမ္မာဒီ စာမူစု (NHC VI,2) တွင် ထိန်းသိမ်းထားသည်။
    chapters:
      '1':
        title: မိုးခြိမ်းသံက ရှာဖွေသူများအား ပြောဆိုသည်
      '2':
        title: ငါသည် အဦးဆုံး၊ နောက်ဆုံးနှင့် အပျိုစင်ဖြစ်သည်
      '3':
        title: အသိပညာနှင့် မသိနားမလည်မှုတို့ ပေါင်းစည်းသည်
      '4':
        title: ကြောက်ရွံ့မှုနှင့် ခွန်အားသည် ငါ့အတွင်း၌ ရှိသည်
      '5':
        title: သူမကို မုန်းလည်းမုန်း၊ ချစ်လည်းချစ်၍ သေခြင်းဟု ခေါ်ကြသည်
      '6':
        title: စိတ်နှင့် ငြိမ်သက်ခြင်းသည် ငါ့အတွင်း၌ ရှိသည်
      '7':
        title: ငါ့အားဖြင့် ငြိမ်သက်ခြင်းသည် စစ်ပွဲကို ဖြစ်စေသည်
      '8':
        title: အသံတစ်သံအတွင်းမှ တိတ်ဆိတ်ခြင်းကို ကြားရသည်
      '9':
        title: ငါသည် တရားမျှတမှုနှင့် အကျိုးဆောင်သူဖြစ်သည်
      '10':
        title: ဖန်ဆင်းရှင်၏ နာမတော်ကို ငါကြွေးကြော်သည်
      '11':
        title: သည်းခံခြင်းနှင့် ခွင့်လွှတ်ခြင်း ရောက်လာသည်
  Testament of Reuben:
    display_name: ရုဗင်၏ နောက်ဆုံးမှာတမ်း
    author: အမည်မသိ။ ယာကုပ်၏သားများ သေခါနီး ပြောကြားခဲ့သော မိန့်ခွန်းများအဖြစ် တင်ပြသည့် ဘိုးဘေးဆယ့်နှစ်ပါး၏ နောက်ဆုံးမှာတမ်းများထဲမှ တစ်စောင်ဖြစ်သည်။
    audience: ဘိုးဘေးများ၏ အပြစ်ဝန်ခံချက်များမှတစ်ဆင့် ကျင့်ဝတ်ကို သင်ယူသော ဂျူးစာဖတ်သူများနှင့် နောက်ပိုင်း ခရစ်ယာန်စာဖတ်သူများ။
    date: ခရစ်မပေါ်မီ ၂ ရာစုခန့်က ဂျူးမူရင်းအလွှာ ရှိနိုင်ပြီး ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်တွင် ခရစ်ယာန်တည်းဖြတ်မှုအလွှာ ထပ်ပေါင်းခဲ့ပုံရသည်။
    chapters:
      '1':
        title: အပြစ်၏ ချုပ်ကိုင်မှုကို ရုဗင် သတိပေးသည်
      '2':
        title: ဝိညာဉ်ခုနစ်ပါးက လူသားတို့ကို အုပ်စိုးသည်
      '3':
        title: မှားယွင်းမှုခုနစ်မျိုးက လူငယ်များကို ချည်နှောင်ထားသည်
      '4':
        title: ကာမတပ်မက်မှုနှင့် ရုပ်တုကိုးကွယ်မှုကို ယခုပင် ရှောင်ကြဉ်ပါ
      '5':
        title: အမျိုးသမီးများက ဖြားယောင်းမှုဖြင့် ထောင်ချောက်ဆင်သည်
      '6':
        title: ဗေလျာ၏ ထောင်ချောက်များမှ စိတ်ကို ကာကွယ်ပါ
      '7':
        title: ရုဗင်၏ အရိုးများကို ဇာတိမြေသို့ ပြန်ယူလာသည်
  Testament of Simeon:
    display_name: ရှိမောင်၏ နောက်ဆုံးမှာတမ်း
    author: အမည်မသိ။ ဘိုးဘေးဆယ့်နှစ်ပါး၏ နောက်ဆုံးမှာတမ်းများထဲမှ တစ်စောင်ဖြစ်သည်။
    audience: ဂျူးစာဖတ်သူများနှင့် နောက်ပိုင်း ခရစ်ယာန်စာဖတ်သူများ။
    date: ခရစ်မပေါ်မီ ၂ ရာစုခန့်က ဂျူးမူရင်းအလွှာ ရှိနိုင်ပြီး ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်တွင် ခရစ်ယာန်တည်းဖြတ်မှု ပြုလုပ်ခဲ့ပုံရသည်။
    chapters:
      '1':
        title: ရှိမောင်က သက်သေခံပြောဆိုရန် သားများကို စုဝေးစေသည်
      '2':
        title: မနာလို၍ အကွက်ဆင်ခဲ့ခြင်းအတွက် ရှိမောင် နောင်တရသည်
      '3':
        title: ရှိမောင်က မနာလိုစိတ်ဝိညာဉ်ကို တိုက်ခိုက်သည်
      '4':
        title: ယောသပ်က ကရုဏာပြ၍ ရှိမောင်က သတိပေးသည်
      '5':
        title: သန့်ရှင်းမှုက လှပစေသည်၊ အပြစ်ကို ငြင်းပယ်ပါ
      '6':
        title: မကောင်းမှုကို ငြင်းပယ်၍ သန့်ရှင်းခြင်း၌ ရှင်သန်ကြီးပွားပါ
      '7':
        title: ရှိမောင်က အနာဂတ်ရှင်ဘုရင်အကြောင်း ပရောဖက်ပြုသည်
      '8':
        title: ရှိမောင် သေဆုံး၍ သူ၏အရိုးများကို ဟေဗြုန်သို့ ယူဆောင်သည်
      '9':
        title: ရှိမောင်အတွက် ငိုကြွေး၍ ထွက်မြောက်မည့်အချိန်ကို စောင့်ကြသည်
  Testament of Levi:
    display_name: လေဝိ၏ နောက်ဆုံးမှာတမ်း
    author: အမည်မသိ။ ဘိုးဘေးဆယ့်နှစ်ပါး၏ နောက်ဆုံးမှာတမ်းများထဲမှ တစ်စောင်ဖြစ်သည်။
    audience: ဂျူးစာဖတ်သူများနှင့် နောက်ပိုင်း ခရစ်ယာန်စာဖတ်သူများ၊ အထူးသဖြင့် ယဇ်ပုရောဟိတ်အမှုကို စိတ်ဝင်စားသော အသိုင်းအဝိုင်းများ။
    date: ခရစ်မပေါ်မီ ၂ ရာစုခန့်က ဂျူးမူရင်းအလွှာ ရှိနိုင်ပြီး ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်တွင် ခရစ်ယာန်တည်းဖြတ်မှု ပြုလုပ်ခဲ့ပုံရသည်။
    chapters:
      '1':
        title: လေဝိက မိမိသေဆုံးမည့်အကြောင်း ပရောဖက်ပြုသည်
      '2':
        title: လေဝိက ကောင်းကင်ဘုံ၏ ဖောက်ပြန်ပျက်စီးမှုကို မြင်သည်
      '3':
        title: ဘုရားသခင်၏ အမျက်တော်ကြောင့် ကောင်းကင်များ တုန်လှုပ်သည်
      '4':
        title: လေဝိသည် သန့်ရှင်းသောအမှုတော်အတွက် ရွေးချယ်ခံရသည်
      '5':
        title: ကောင်းကင်တမန်က လက်စားချေရန် လေဝိအား လက်နက်တပ်ဆင်ပေးသည်
      '6':
        title: သတ်ဖြတ်မှုအပေါ် အမျက်ထွက်ခဲ့ခြင်းအတွက် လေဝိ အပြစ်ဖြေသည်
      '7':
        title: လေဝိ၏ဓားကြောင့် ရှေခင် ကျိန်ခြင်းခံရသည်
      '8':
        title: ကောင်းကင်တမန်များက လေဝိကို ယဇ်ပုရောဟိတ်အဖြစ် ခန့်အပ်သည်
      '9':
        title: ဣဇာက်က လေဝိအား ပညတ်များကို သင်ကြားပေးသည်
      '10':
        title: အနာဂတ်ဆိုးယုတ်မှုအကြောင်း လေဝိ သတိပေးသည်
      '11':
        title: လေဝိက ပရောဖက်ပြုချက်နှင့်အညီ သားများကို အမည်ပေးသည်
      '12':
        title: လေဝိက မိမိ၏ ဆွေစဉ်မျိုးဆက်စာရင်းကို မှတ်တမ်းတင်သည်
      '13':
        title: ဘုရားသခင်ကို ကြောက်ရွံ့၍ ပညတ်တရားကို စောင့်ရန် လေဝိ မိန့်မှာသည်
      '14':
        title: ယဇ်ပုရောဟိတ်များက မိမိတို့၏ ခေါ်ယူခြင်းကို သစ္စာဖောက်မည်
      '15':
        title: တရားစီရင်မှုအောက်တွင် ဗိမာန်တော် ပျက်စီးသည်
      '16':
        title: ပုန်ကန်မှု ရက်သတ္တပတ်ခုနစ်ဆယ်
      '17':
        title: ညစ်ညူးမှု ယုဘိလခုနစ်ကာလ
      '18':
        title: ထာဝရယဇ်ပုရောဟိတ်က ကမ္ဘာကို အလင်းပေးသည်
      '19':
        title: သားများက ဘုရားသခင်၏ ပညတ်တရားကို လိုက်နာမည်ဟု ကတိပြုသည်
  Testament of Judah:
    display_name: ယုဒ၏ နောက်ဆုံးမှာတမ်း
    author: အမည်မသိ။ ဘိုးဘေးဆယ့်နှစ်ပါး၏ နောက်ဆုံးမှာတမ်းများထဲမှ တစ်စောင်ဖြစ်သည်။
    audience: ဂျူးစာဖတ်သူများနှင့် နောက်ပိုင်း ခရစ်ယာန်စာဖတ်သူများ။
    date: ခရစ်မပေါ်မီ ၂ ရာစုခန့်က ဂျူးမူရင်းအလွှာ ရှိနိုင်ပြီး ခရစ်နှစ် ၁ ရာစုမှ ၂ ရာစုခန့်တွင် ခရစ်ယာန်တည်းဖြတ်မှု ပြုလုပ်ခဲ့ပုံရသည်။
    chapters:
      '1':
        title: ယုဒက သားများအား နောက်ဆုံးစကားများ ပြောကြားသည်
      '2':
        title: ဘုရားပေးသော စစ်သူရဲခွန်အားကို ယုဒ ပြသသည်
      '3':
        title: ယုဒက ခါနာန်ရှင်ဘုရင်များကို တစ်ဦးတည်း အနိုင်ယူသည်
      '4':
        title: ယုဒကို စောင့်ရှောက်နေသော ကောင်းကင်တမန်ကို ယာကုပ် မြင်သည်
      '5':
        title: ယုဒက အာရေတာနှင့် သပ်ဖူးအေကို သိမ်းပိုက်သည်
      '6':
        title: ယုဒက ပြင်းထန်သောတိုက်ပွဲတွင် အနိုင်ရသည်
      '7':
        title: ပစ်ခတ်မှုကြားမှ ယုဒ ရှေ့သို့ တဟုန်ထိုးတက်သည်
      '8':
        title: ယုဒက ရှုအာနှင့် လက်ထပ်၍ သားများ ထွန်းကားသည်
      '9':
        title: ယုဒက ဧသော၏ အင်အားကြီးစစ်တပ်ကို အနိုင်ယူသည်
      '10':
        title: တာမာသည် ဆိုးယုတ်သောသားများကြောင့် ဒုက္ခခံရသည်
      '11':
        title: ယုဒက ဇနီး၏ အပြစ်များကို ကျိန်ဆဲသည်
      '12':
        title: တာမာက တောင်ဝှေးဖြင့် ယုဒကို လှည့်စားသည်
      '13':
        title: ယုဒက သားသမီးများအား အပြစ်များအကြောင်း သတိပေးသည်
      '14':
        title: ယုဒက အရက်မူးခြင်းနှင့် အပြစ်များကို ရှောင်ရန် သတိပေးသည်
      '15':
        title: ယုဒက ကာမတပ်မက်မှု၏ ချုပ်ကိုင်ခြင်းကို သတိပေးသည်
      '16':
        title: ယုဒက စပျစ်ရည်ကို ရှောင်ရန် သတိပေးသည်
      '17':
        title: ယုဒက သားများအား လောဘနှင့် ကာမတပ်မက်မှုအကြောင်း သတိပေးသည်
      '18':
        title: လိင်အကျင့်ပျက်မှုနှင့် လောဘကို သတိပြုရှောင်ကြဉ်ပါ
      '19':
        title: ယုဒက လောဘကို ရှောင်ရန် သတိပေးသည်
      '20':
        title: လူ့အသိစိတ်သည် ဝိညာဉ်များကြားတွင် ပိတ်မိနေသည်
      '21':
        title: ယုဒက အနာဂတ်ရှင်ဘုရင်များကို သတိပေးသည်
      '22':
        title: ဘုရားသခင်၏ တရားစီရင်မှုက အတွင်းပဋိပက္ခကို ဖြစ်စေသည်
      '23':
        title: ယုဒက အနာဂတ်ဆိုးယုတ်မှုအတွက် မြည်တမ်းသည်
      '24':
        title: ဝိညာဉ်တော်ကို သွန်းလောင်းသော ဘုရားရှင်အုပ်စိုးသူ
      '25':
        title: ဘိုးဘေးများသည် ထာဝရအသက်အတွက် ရှင်ပြန်ထမြောက်ကြသည်
      '26':
        title: သစ္စာရှိစွာ အသက်ရှင်ရန် ယုဒ မိန့်မှာသည်
