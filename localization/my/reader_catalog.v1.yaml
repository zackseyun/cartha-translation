  Sophia of Jesus Christ:
    display_name: ယေရှုခရစ်၏ ဉာဏ်ပညာ
    author: အမည်မသိ။ စာရေးသူသည် ယူဂနော့စတောစ်စာမှလည်း သိရှိရသော အကြောင်းအရာကို ယေရှုနှင့် တပည့်တော်များကြား ရှင်ပြန်ထမြောက်ပြီးနောက် ဆွေးနွေးခန်းအဖြစ် ပြောင်းလဲရေးသားထားသည်။
    audience: အရာခပ်သိမ်းကို ကျော်လွန်သော ဘုရားသခင်၊ ကောင်းကင်လောက၏ အစီအစဉ်နှင့် ဝိညာဉ်၏ မူလအစနှင့် ကယ်တင်ခြင်းတို့ဆိုင်ရာ ဖွင့်ပြသော ဉာဏ်ပညာကို စိတ်ဝင်စားသည့် ခရစ်ယာန်များ။
    date: ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုဟု မကြာခဏ သတ်မှတ်ကြသည်။ နာဂ်ဟာမာဒီနှင့် ဘာလင် ကိုဒက်စ်တို့မှ ကော့ပ်တစ်မိတ္တူများ၌ ထိန်းသိမ်းကျန်ရစ်သည်။
    chapters:
      '1':
        title: ယေရှုက တပည့်တော်များအား သမ္မာတရားကို ဖော်ပြသည်
      '2':
        title: ဘုရားသခင်၏ ထာဝရနက်နဲရာကို ရှင်းပြသည်
      '3':
        title: ကွယ်ဝှက်သော ဘုရား၏ ကောင်းမြတ်ခြင်းမှ ဖန်ဆင်းခြင်း ဖြစ်ပေါ်သည်
      '4':
        title: မြင်နိုင်သောလောကက ယုံကြည်ခြင်းသို့ လမ်းပြသည်
      '5':
        title: ဘုရားသခင်က တောက်ပသော လူသားကို ဖော်ပြသည်
      '6':
        title: ခရစ်တော်က အခွင့်အာဏာဖြင့် ကောင်းကင်တမန်များကို ဖန်ဆင်းသည်
      '7':
        title: ကယ်တင်ရှင်က အတွင်းရှိ ဘုရားအလင်းကို နိုးထစေသည်
      '8':
        title: ကောင်းကင်ဘုံများသည် သဟဇာတညီညွတ်ကြသည်
      '9':
        title: ဘုရားဆိုင်ရာ ဉာဏ်ပညာနှင့် စစ်မှန်သော အသိပညာ
      '10':
        title: ထာဝရဘုရား၏ ပြည့်စုံသော အလိုတော်ကို ဖော်ပြသည်
  Gospel of the Egyptians:
    display_name: အီဂျစ်လူမျိုးတို့၏ ဧဝံဂေလိကျမ်း
    author: အမည်မသိ။ မဟာမမြင်နိုင်သော ဝိညာဉ်တော်၏ သန့်ရှင်းသောကျမ်းဟုလည်း ခေါ်သော ဤနာဂ်ဟာမာဒီစာသည် ကိုးကားချက်များမှသာ သိရသည့် အစောပိုင်း ဂရိဘာသာ အီဂျစ်လူမျိုးတို့၏ ဧဝံဂေလိကျမ်းနှင့် မတူသော စာဖြစ်သည်။
    audience: ဝိညာဉ်ရေးကိုယ်ပိုင်လက္ခဏာနှင့် လွတ်မြောက်ခြင်းကို ဖော်ပြရန် အဓိပ္ပာယ်သိပ်သည်းသော ဒဏ္ဍာရီ၊ မြင့်မြတ်သည့်နာမတော်များ၊ ဗတ္တိဇံဆိုင်ရာ ပုံရိပ်များနှင့် ဓမ္မသီချင်းဆန်သော ချီးမွမ်းမှုတို့ကို အသုံးပြုသည့် ဆေသီယန် ခရစ်ယာန်အသိုင်းအဝိုင်း။
    date: ခရစ်နှစ် ၂ ရာစု သို့မဟုတ် ၃ ရာစုက စာဟု ယေဘုယျအားဖြင့် သတ်မှတ်ကြသည်။ ခရစ်နှစ် ၄ ရာစု နာဂ်ဟာမာဒီ ကိုဒက်စ်များထဲတွင် ကော့ပ်တစ်မိတ္တူနှစ်စောင် ကျန်ရစ်သည်။
    chapters:
      '1':
        title: ဘုရားသခင်က ထာဝရ ဘုရားဆိုင်ရာအလင်းကို ဖော်ပြသည်
      '2':
        title: တန်ခိုးသုံးပါးသည် တိတ်ဆိတ်ခြင်းမှ ပေါ်ထွက်လာသည်
      '3':
        title: ခမည်းတော်သည် မြင့်မြတ်သော တိတ်ဆိတ်ခြင်းမှ ပေါ်ထွက်လာသည်
      '4':
        title: ကောင်းကင်သတ္တဝါများက ဝိညာဉ်တော်ကို ချီးမွမ်းကြသည်
      '5':
        title: အာဒမတ်စ်က ဖန်ဆင်းခြင်းအလုံးစုံကို ဖြစ်ပေါ်စေသည်
      '6':
        title: ခရစ်တော်က မသေနိုင်သော လူမျိုးကို တည်ထောင်သည်
      '7':
        title: ဘုရားတန်ခိုးများက ညီညွတ်ခြင်း၌ ဝမ်းမြောက်ကြသည်
      '8':
        title: ခရစ်တော်က ပြည့်ဝသော ဘုန်းအာနုဘော်ကို ဖော်ပြသည်
      '9':
        title: ရှေသက ဝိညာဉ်ရေးသားစဉ်မြေးဆက်အတွက် ဆုတောင်းသည်
      '10':
        title: ဆိုဖီယာသည် ဘုရားဆိုင်ရာ ဉာဏ်ပညာမှ ပေါ်ထွက်လာသည်
      '11':
        title: ကောင်းကင်တမန်များက မျိုးနွယ်ကို ကာကွယ်သည်
      '12':
        title: ရှေသက ခရစ်တော်မှတစ်ဆင့် ကယ်တင်ခြင်းကို ပြင်ဆင်သည်
      '13':
        title: ဟောပြောသူက ထာဝရမမြင်နိုင်သော ဘုရားကို တိုင်တည်ခေါ်သည်
      '14':
        title: ရှေသက လျှို့ဝှက်ကျမ်းကို ရေးသားခဲ့သည်
  Letter of Peter to Philip:
    display_name: ဖိလိပ္ပုထံ ပေတရု၏စာ
    author: အမည်မသိ။ အဖွင့်စာတိုနှင့် ယင်းနောက်ပါ ဖွင့်ပြချက်ကို ပေတရုနှင့် ဖိလိပ္ပုတို့အား အမည်ခံ၍ ရေးထားခြင်းဖြစ်ပြီး တမန်တော်တစ်ဦးဦးက အမှန်တကယ် ရေးသားခဲ့သည်ဟု ခိုင်လုံစွာ မဆိုနိုင်ပါ။
    audience: ကယ်တင်ရှင်၊ ရန်လိုသော တန်ခိုးများ၊ ဆင်းရဲဒုက္ခ၊ သာသနာပြုခြင်းနှင့် တပည့်တော်များ ပြန်လည်တည်ဆောက်ခံရခြင်းတို့ဆိုင်ရာ သွန်သင်ချက်အတွက် တမန်တော်တို့၏ အခွင့်အာဏာကို ရှာဖွေသော ခရစ်ယာန်များ။
    date: ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုအစောပိုင်းဟု ယေဘုယျအားဖြင့် သတ်မှတ်ကြသည်။ ခရစ်နှစ် ၄ ရာစု နာဂ်ဟာမာဒီမိတ္တူတစ်စောင်နှင့် ထိုထက်နောက်ကျသော ကော့ပ်တစ်စာမူအထောက်အထားတစ်ခု၌ ထိန်းသိမ်းကျန်ရစ်သည်။
    chapters:
      '1':
        title: ပေတရုက ဖိလိပ္ပုအား ပြန်လာရန် တိုက်တွန်းသည်
      '2':
        title: တမန်တော်များက သံလွင်တောင်ပေါ်တွင် ဆုတောင်းကြသည်
      '3':
        title: ယေရှုက ဘုရားဆိုင်ရာ ပြည့်စုံခြင်းကို ရှင်းပြသည်
      '4':
        title: အုပ်စိုးသူက စစ်မှန်သော ဘုရား၏ အကြံအစည်ကို ဆန့်ကျင်သည်
      '5':
        title: ခရစ်တော်က ပျောက်ဆုံးသူတို့ကို ယုံကြည်ခြင်းဖြင့် ကယ်တင်သည်
      '6':
        title: ယေရှုက ထာဝရခွန်အားကို ကတိပြုသည်
      '7':
        title: တမန်တော်များက ညှဉ်းပန်းမှုကြားတွင် တရားဟောကြသည်
      '8':
        title: ပေတရုက သန့်ရှင်းသော အမွေအနှစ်ကို ကြေညာသည်
  Gospel of Judas:
    display_name: ယုဒ၏ ဧဝံဂေလိကျမ်း
    author: အမည်မသိ။ ခေါင်းစဉ်က ဤဇာတ်ကြောင်းကို ယုဒနှင့် ဆက်စပ်ဖော်ပြသော်လည်း ယုဒရှကာရုတ်သည် သမိုင်းအရ စာရေးသူဖြစ်ကြောင်း ဤစာက အတည်မပြုနိုင်ပါ။
    audience: အခြားအုပ်စုများ၏ ယဇ်ပူဇော်ခြင်းနှင့် အသင်းတော်ဆိုင်ရာ အလေ့အထများကို ဝေဖန်ကာ ယုဒနှင့် ယေရှု၏သေခြင်းကို ပြန်လည်အနက်ဖွင့်ရန် ဗျာဒိတ်ဆန်သော ဆွေးနွေးခန်းနှင့် ဆေသီယန်ဆန်သည့် စကြဝဠာအမြင်ကို အသုံးပြုသော ခရစ်ယာန်အုပ်စုတစ်စု။
    date: ခရစ်နှစ် ၂ ရာစုအလယ်ပိုင်း သို့မဟုတ် နှောင်းပိုင်းဟု ယေဘုယျအားဖြင့် သတ်မှတ်ကြသည်။ ခရစ်နှစ် ၁၈၀ ဝန်းကျင်တွင် အီရီနေယပ်စ်သည် ယုဒ၏ ဧဝံဂေလိကျမ်းတစ်စောင်ကို သိရှိခဲ့ပြီး ယနေ့ကျန်ရစ်သည့် ကော့ပ်တစ်မိတ္တူမှာ ခရစ်နှစ် ၃ ရာစု သို့မဟုတ် ၄ ရာစုက ဖြစ်နိုင်သည်။
    chapters:
      '1':
        title: ယေရှုက ယုဒအား နက်နဲရာများကို ဖော်ပြသည်
      '2':
        title: ယုဒတစ်ဦးတည်းသာ ယေရှုထံ ချဉ်းကပ်သည်
      '3':
        title: ယေရှုက သန့်ရှင်းသော အသိုင်းအဝိုင်းကို ဖော်ပြသည်
