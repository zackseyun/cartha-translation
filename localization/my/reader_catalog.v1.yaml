      '20':
        title: ရှာလုံက မာရိကို စစ်ဆေးရာ သူ၏လက် လောင်ကျွမ်းသည်
      '21':
        title: ပညာရှိများက မွေးကင်းစဘုရင်ကို ရှာဖွေကြသည်
      '22':
        title: ဟေရုဒ်မင်းက မွေးကင်းစကလေးများကို သတ်ရန် အမိန့်ပေးသည်
      '23':
        title: ဇာခရိသည် ဟေရုဒ်မင်း၏ ခြိမ်းခြောက်မှုကို ရင်ဆိုင်သည်
      '24':
        title: ဇာခရိသည် သန့်ရှင်းရာဌာန၌ အသတ်ခံရသည်
      '25':
        title: မငြိမ်မသက်ဖြစ်နေစဉ် ယာကုပ်က မှတ်တမ်းရေးသားသည်
      '26':
        title: ဗော့ဒ်မာ ကျူစာလိပ်တွင် ပိုတိုသောမူ ပါရှိသည်
      '27':
        title: ယောသပ်သည် ဗက်လင်မြို့တွင် ဝမ်းဆွဲဆရာမကို ရှာသည်
      '28':
        title: ယောသပ်က မာရိ၏အံ့ဖွယ်ဖြစ်ရပ်ကို ရှင်းပြသည်
      '29':
        title: ရှာလုံသည် ကလေးငယ်ကို ထိတွေ့၍ ရောဂါပျောက်သည်
      '30':
        title: ပညာရှိများက ဂျူးလူမျိုးတို့၏ဘုရင်ကို ရှာဖွေကြသည်
  Infancy Gospel of Thomas:
    display_name: သောမ၏ ယေရှုကလေးဘဝ ဧဝံဂေလိကျမ်း
    author: အမည်မသိသူ ရေးသားထားသည်။ ပြန်လည်ဖော်ထုတ်နိုင်သမျှ အစောဆုံးမူတွင် စာရေးသူ၏အမည် မပါရှိပါ။ သောမရေးသားသည်ဟု သတ်မှတ်ခြင်းမှာ နောက်ပိုင်းလက်ရေးမူများ၏ ခေါင်းစဉ်များနှင့် လက်ဆင့်ကမ်းပို့ချမှုမှ ဆင်းသက်လာခြင်းဖြစ်သည်။
    audience: ယေရှု၏ကလေးဘဝအကြောင်းနှင့် ကျမ်းရင်းဝင်ဧဝံဂေလိမှတ်တမ်းများ မစတင်မီ ဘုရားတန်ခိုး၊ ဆုံးမပဲ့ပြင်မှု၊ သင်ယူမှုနှင့် ရင့်ကျက်လာမှုတို့ကို မည်သို့ ဇာတ်ကြောင်းပြောနိုင်မည်ကို သိလိုသော ခရစ်ယာန်များအတွက် ဖြစ်သည်။
    date: အများအားဖြင့် ခရစ်နှစ် ၂ ရာစုမှ ဆင်းသက်လာသည်ဟု ယူဆကြသော်လည်း အကြောင်းအရာအတော်အတန်ကွဲပြားသည့် ဂရိမူကွဲအများအပြားနှင့် ရှေးခေတ်ဘာသာပြန်မူများအဖြစ် ယင်းစာသား တည်ရှိနေသည်။
    chapters:
      '1':
        title: သောမက ယေရှုအကြောင်း ပြောပြသည်
      '2':
        title: ယေရှုသည် ရေကို ကြည်လင်စေပြီး ငှက်ရုပ်များ ပုံဖော်သည်
      '3':
        title: ယေရှုက အန္န၏သားကို ကျိန်ဆိုသည်
      '4':
        title: ယေရှု ကျိန်ဆိုသောကြောင့် ကလေးတစ်ဦး သေဆုံးသည်
      '5':
        title: ယေရှုက ယောသပ်အား ပညာအကြောင်း သွန်သင်သည်
      '6':
        title: ဆရာသည် ယေရှု၏ပညာကြောင့် အခက်တွေ့သည်
      '7':
        title: ဆရာက ယေရှု၏အသိပညာ ပိုမိုမြင့်မားကြောင်း ဝန်ခံသည်
      '8':
        title: ယေရှုသည် ရယ်မော၍ ကုသပေးပြီး ကြေညာသည်
      '9':
        title: ယေရှုသည် ပြုတ်ကျသော ဇေနုန်ကို အသက်ပြန်ရှင်စေသည်
      '10':
        title: ယေရှုသည် သစ်ခုတ်သမား၏ခြေကို ကုသပေးသည်
      '11':
        title: ယေရှုသည် ကွဲနေသောရေအိုးကို အံ့ဖွယ်နည်းဖြင့် ရေပြည့်စေသည်
      '12':
        title: ယောသပ်သည် ယေရှုစိုက်သောမျိုးစေ့မှ သီးနှံရိတ်သိမ်းသည်
      '13':
        title: ယောသပ်သည် ယေရှု၏အကူအညီဖြင့် အိပ်ရာကို ပြီးစီးစေသည်
      '14':
        title: ယေရှုကို စိန်ခေါ်ပြီးနောက် ဆရာ သေဆုံးသည်
      '15':
        title: ယေရှု၏စကားကြောင့် ဆရာ ဝမ်းမြောက်သည်
      '16':
        title: ယေရှုသည် မြွေကိုက်ခံရသော ယာကုပ်ကို ကုသပေးသည်
      '17':
        title: ယေရှုသည် ယောသပ်အမည်ရှိ ကလေးငယ်ကို ကုသပေးသည်
      '18':
        title: ယေရှုသည် ထိုနေရာရှိ လူတစ်ဦးကို အသက်ပြန်ရှင်စေသည်
      '19':
        title: အသက်ဆယ့်နှစ်နှစ်အရွယ် ယေရှုသည် ဗိမာန်တော်၌ သွန်သင်သည်
  Acts of Paul and Thecla:
    display_name: ပေါလုနှင့် သက်ကလာတို့၏ လုပ်ဆောင်ချက်များ
    author: အမည်မသိသူ ရေးသားထားသည်။ ဤစာသည် ပိုမိုရှည်လျားသော ပေါလု၏လုပ်ဆောင်ချက်များကျမ်းမှ ဇာတ်လမ်းပိုင်းတစ်ခုဖြစ်သည်။ သင်းအုပ်အကြီးအကဲတစ်ဦးက ထိုကျမ်းကို ရေးသားခဲ့ကြောင်း ရှေးခေတ်မှတ်တမ်းတစ်ခု၌ ဆိုထားသော်လည်း စာရေးသူမည်သူဖြစ်ကြောင်း ယုံကြည်စိတ်ချစွာ မသတ်မှတ်နိုင်ပါ။
    audience: တမန်တော်များ၏ တရားဟောခြင်း၊ အိမ်ထောင်မပြုဘဲနေခြင်း၊ ဗတ္တိဇံခံယူခြင်း၊ အာဇာနည်ကဲ့သို့ ကြံ့ကြံ့ခံခြင်းနှင့် အမျိုးသမီးတစ်ဦး၏ သွန်သင်ခွင့်၊ သက်သေခံခွင့်တို့ကို ဖော်ပြသည့် ဇာတ်လမ်းများအား စိတ်ဝင်စားသော ခရစ်ယာန်များအတွက် ဖြစ်သည်။
    date: ခရစ်နှစ် ၂ ရာစုအတွင်း၊ ဖြစ်နိုင်ဖွယ်အားဖြင့် ထိုရာစု၏ နှောင်းပိုင်းတွင် ရေးသားခဲ့သည်။ ပေါလု၏လုပ်ဆောင်ချက်များကျမ်းအတွင်း အစိတ်အပိုင်းတစ်ခုအဖြစ်လည်းကောင်း၊ သီးခြားစာတစ်စောင်အဖြစ်လည်းကောင်း ပျံ့နှံ့ခဲ့သည်။
    chapters:
      '1':
        title: ပေါလုသည် ဩနေသိဖော်၏အိမ်တွင် တရားဟောသည်
      '2':
        title: သက်ကလာသည် နားထောင်ရင်း ပေါလုကို တောင့်တသည်
      '3':
        title: သာမိရစ်က ပေါလုကို ဘုရင်ခံရှေ့တွင် စွပ်စွဲသည်
      '4':
        title: သက်ကလာသည် ထောင်ထဲသို့ သွား၍ ပေါလုကို အားပေးသည်
      '5':
        title: သက်ကလာသည် မီးရှို့သတ်ရန် ချည်ထားသည့်တိုင်မှ လွတ်မြောက်သည်
      '6':
        title: ပေါလုနှင့် သက်ကလာတို့သည် အစာရှောင်၍ ဆုတောင်းကြသည်
      '7':
        title: ပေါလုသည် သက်ကလာကို အန္တိအုတ်မြို့သို့ စေလွှတ်သည်
      '8':
        title: ထရီဖိုင်နာသည် သက်ကလာကို သားရဲများရန်မှ ကာကွယ်သည်
      '9':
        title: သက်ကလာသည် ရေကန်ထဲတွင် မိမိကိုယ်ကို ဗတ္တိဇံပေးသည်
      '10':
        title: သက်ကလာသည် ဆဲလူးကိမြို့ရှိ အမျိုးသမီးများကို သွန်သင်သည်
      '11':
        title: ကောင်းကင်အသံက သက်ကလာကို ကယ်တင်ပြီး မျက်နှာဖုံးပေးသည်
  Gospel of Peter:
    display_name: ပေတရု၏ ဧဝံဂေလိကျမ်း
    author: အမည်မသိသူ ရေးသားထားသည်။ ကျန်ရှိနေသော ဇာတ်ကြောင်းမှာ ပေတရုကိုယ်တိုင် ပြောသည့်အသံဖြင့် ရေးသားပြီး သူ၏အမည်ဖြင့် လက်ဆင့်ကမ်းခဲ့သော်လည်း သမိုင်းဝင်တမန်တော်ပေတရု၏ လက်ရာဟု မယူဆကြပါ။
    audience: ယေရှု၏ ဆင်းရဲဒုက္ခခံရမှုနှင့် ရှင်ပြန်ထမြောက်မှုအကြောင်း ပိုမိုချဲ့ထွင်ထားသော ဇာတ်ကြောင်းကို စိတ်ဝင်စားသည့် အစောပိုင်းခရစ်ယာန်များအတွက် ဖြစ်ပြီး၊ ပေတရု၏ဩဇာအာဏာကို အထူးအလေးထားသော အသိုင်းအဝိုင်းများအတွင်း ရည်ရွယ်ခဲ့ဖွယ်ရှိသည်။
    date: အများအားဖြင့် ခရစ်နှစ် ၂ ရာစုအတွင်းဟု သတ်မှတ်ကြသည်။ အဓိကကျန်ရှိနေသော ဂရိစာအပိုင်းအစမှာ များစွာနောက်ကျသောခေတ်မှ လက်ရေးမူဖြစ်ပြီး အက်ခမင်မြို့တွင် တွေ့ရှိခဲ့သည်။
    chapters:
      '1':
        title: ဟေရုဒ်မင်းက သခင်ဘုရားကို စစ်ဆေးစီရင်ရန် အမိန့်ပေးသည်
      '2':
        title: ယောသပ်သည် သခင်ဘုရား၏အလောင်းကို သင်္ဂြိုဟ်သည်
      '3':
        title: လူအုပ်က ဘုရားသခင်၏သားတော်ကို လှောင်ပြောင်သည်
      '4':
        title: ပြစ်မှုကျူးလွန်သူက ယေရှု၏ဂုဏ်သိက္ခာကို ကာကွယ်ပြောဆိုသည်
      '5':
        title: မွန်းတည့်ချိန်တွင် ယုဒပြည်ကို အမှောင်ဖုံးလွှမ်းသည်
      '6':
        title: ယေရှုကို ယောသပ်၏သင်္ချိုင်းတွင် ထားသည်
      '7':
        title: ကျူးလွန်ခဲ့သောမတရားမှုကြောင့် လူများ ဝမ်းနည်းကြသည်
      '8':
        title: အကြီးအကဲများက ယေရှု၏သင်္ချိုင်းကို စောင့်ကြပ်သည်
      '9':
        title: အရုဏ်တက်ချိန်တွင် ကောင်းကင်အသံ ထွက်ပေါ်သည်
      '10':
        title: လူသုံးဦး သင်္ချိုင်းမှ ထွက်လာသည်
      '11':
        title: စစ်သားများက ပိလတ်မင်းထံ အစီရင်ခံသည်
      '12':
        title: မာဂဒလမာရိသည် သင်္ချိုင်းကို ရှာဖွေသည်
      '13':
        title: အမျိုးသမီးများသည် ကောင်းကင်တမန်၏သတင်းကြောင့် ထွက်ပြေးကြသည်
      '14':
        title: ပွဲတော်အပြီးတွင် တပည့်များ ငိုကြွေးကြသည်
  2 Clement:
    display_name: ကလေမင် ဒုတိယစာ
    author: အမည်မသိသူ ရေးသားထားသည်။ အစဉ်အလာခေါင်းစဉ်က ထိုသို့ဆိုသော်လည်း ဤစာသည် ရောမမြို့သား ကလေမင်၏ ဒုတိယစာမဟုတ်ဘဲ အစောပိုင်းခရစ်ယာန်တရားဟောချက်တစ်ရပ် ဖြစ်သည်။
    audience: နောင်တရရန်၊ ကိုယ်ကျင့်တရား၌ တစ်သမတ်တည်းရှိရန်၊ အားနည်းသူများကို စောင့်ရှောက်ရန်နှင့် ရှင်ပြန်ထမြောက်ခြင်း၊ တရားစီရင်ခြင်းတို့ကို မျှော်လင့်လျက် သစ္စာရှိစွာ ကြံ့ကြံ့ခံရန် တိုက်တွန်းခံရသော ခရစ်ယာန်ပရိသတ်အတွက် ဖြစ်သည်။
    date: အများအားဖြင့် ခရစ်နှစ် ၂ ရာစု၏ ပထမပိုင်း သို့မဟုတ် အလယ်ပိုင်း (ခန့်မှန်း ခရစ်နှစ် ၁၀၀–၁၆၀) တွင် ရေးသားခဲ့သည်ဟု သတ်မှတ်ကြသည်။ ရေးသားခဲ့သည့်နေရာမှာ မသေချာပါ။
    chapters:
      '1':
        title: ငါတို့၏တရားသူကြီး ယေရှုခရစ်
      '2':
        title: အသင်းတော်သည် ယုံကြည်ခြင်းနှင့် ပြည့်ဝသည်
      '3':
        title: ခရစ်တော်သည် ငါတို့ကို ကရုဏာပြသည်
      '4':
        title: စစ်မှန်သောဝန်ခံခြင်းကို အပြုအမူဖြင့် ဖော်ပြခြင်း
      '5':
        title: ဘုရားသခင်အတွက် မကြောက်မရွံ့ အသက်ရှင်ပါ
      '6':
        title: စည်းစိမ်ထက် ဘုရားသခင်ကို ရွေးချယ်ပါ
      '7':
        title: ပြိုင်ပွဲတွင် စိတ်နှလုံးအကြွင်းမဲ့ ပါဝင်ပါ
      '8':
        title: အသက်ရှင်နေစဉ် နောင်တရပါ
      '9':
        title: ကိုယ်ခန္ဓာကို ဗိမာန်တော်ကဲ့သို့ စောင့်ရှောက်ပါ
      '10':
        title: သီလနှင့် ငြိမ်သက်ခြင်းကို အားထုတ်ရှာဖွေပါ
      '11':
        title: သန့်ရှင်းသောစိတ်နှလုံးဖြင့် ဘုရားသခင်ကို အစေခံပါ
      '12':
        title: မေတ္တာနှင့် ဖြောင့်မတ်ခြင်းက စောင့်ကြိုနေသည်
      '13':
        title: နောင်တရ၍ ကောင်းမြတ်ခြင်းကို အားထုတ်ပါ
      '14':
        title: အသက်ရှင်သောအသင်းတော်၌ ပါဝင်ပါ
      '15':
        title: မိမိကိုယ်ကို ထိန်းချုပ်ခြင်းကို စိတ်အားထက်သန်စွာ ကျင့်သုံးပါ
      '16':
        title: အချိန်ရှိနေသေးစဉ် နောင်တရပါ
      '17':
        title: အားနည်းသူများ ကောင်းမြတ်ခြင်းသို့ ရောက်အောင် ကူညီပါ
      '18':
        title: ဖြောင့်မတ်ခြင်းနောက်သို့ ကြိုးစားလိုက်လျှောက်ပါ
      '19':
        title: ယခုပင် စိတ်နှလုံးအကြွင်းမဲ့ နောင်တရပါ
      '20':
        title: ဆင်းရဲဒုက္ခ၌ ဘုရားသခင်၏ လေ့ကျင့်ပဲ့ပြင်မှုကို ယုံကြည်ပါ
  Epistle of Barnabas:
    display_name: ဗာနဗ၏ ဩဝါဒစာ
    author: အမည်မသိသူ ရေးသားထားသည်။ ဤစာကို အစဉ်အလာအရ ပေါလု၏အဖော် ဗာနဗနှင့် ဆက်စပ်ခဲ့ကြသော်လည်း ခေတ်သစ်ပညာရှင်များက ထိုသတ်မှတ်ချက်ကို လက်မခံကြပါ။
    audience: အစ္စရေးလူမျိုး၏ ကျမ်းစာများကို ခရစ်တော်ဗဟိုပြု၍ ပုံဆောင်အဓိပ္ပာယ်ဖွင့်ဆိုခြင်းဖြင့် မိမိတို့နှင့်သက်ဆိုင်သည်ဟု ခံယူရန် သွန်သင်ခံရသည့်အပြင်၊ မိမိတို့၏ ပဋိညာဉ်ဆိုင်ရာကိုယ်ပိုင်လက္ခဏာကို ဂျူးလူမျိုးတို့၏ ကျင့်ထုံးများမှ ခွဲခြားသတ်မှတ်ရန် သွန်သင်ခံရသော လူမျိုးခြားခရစ်ယာန်များအတွက် ဖြစ်သည်။
    date: ယေရုရှလင်ဗိမာန်တော် ပျက်စီးခဲ့သည့် ခရစ်နှစ် ၇၀ နှင့် ခရစ်နှစ် ၂ ရာစုအစောပိုင်းကြား၊ မကြာခဏဆိုသလို ခန့်မှန်း ခရစ်နှစ် ၈၀–၁၃၀ အတွင်း ရေးသားခဲ့သည်ဟု သတ်မှတ်ကြသည်။
    chapters:
      '1':
        title: ဘုရားသခင်၏ကျေးဇူးတော်သည် ချစ်မြတ်နိုးရသော အသိုင်းအဝိုင်းကို ပြည့်ဝစေသည်
      '2':
        title: ယုံကြည်သူများသည် ဘုရားသခင်၏ စစ်မှန်သောပညတ်ကို ရှာဖွေကြသည်
      '3':
        title: အစာရှောင်ခြင်းဟူသည် ကရုဏာနှင့် တရားမျှတမှုဖြစ်သည်
      '4':
        title: နိုးနိုးကြားကြားရှိသော ခရစ်ယာန်များသည် စမ်းသပ်မှုများကို စောင့်မျှော်ကြသည်
      '5':
        title: ယေရှုသည် အပြစ်သားများအတွက် ဆင်းရဲဒုက္ခခံခဲ့သည်
      '6':
        title: ယေရှုသည် ကတိထားသောနိုင်ငံတော်ကို ပြည့်စုံစေသည်
      '7':
        title: ယေရှု၏ဒဏ်ရာများအတွက် ဘုရားသခင်ကို ကျေးဇူးတင်ပါ
      '8':
        title: နွားမပျိုယဇ်သည် ယေရှုကို ကြိုတင်ပုံဖော်သည်
      '9':
        title: စိတ်နှလုံးအရေဖျားလှီးခြင်းသည် ယုံကြည်ခြင်းကို ဖော်ပြသည်
      '10':
        title: အစားအသောက်ဆိုင်ရာ ပညတ်များက ဝိညာဉ်ရေးသင်ခန်းစာများကို သင်ပေးသည်
      '11':
        title: ဗတ္တိဇံနှင့် လက်ဝါးကပ်တိုင်က ခွင့်လွှတ်ခြင်းကို ဆောင်ကြဉ်းပေးသည်
      '12':
        title: မောရှေ၏ဆန့်ထားသောလက်များက ယေရှုကို ညွှန်ပြသည်
      '13':
        title: ယာကုပ်၏ကောင်းချီးက အခြေအနေပြောင်းပြန်ဖြစ်မည်ကို ကြိုဟောသည်
      '14':
        title: ယေရှုသည် စိတ်နှလုံးများကို ဘုရားသခင်အတွက် ရွေးနုတ်သည်
      '15':
        title: တရားမျှတမှုပြီးနောက် ဥပုသ်နေ့ငြိမ်ဝပ်ခြင်း ရောက်လာသည်
      '16':
        title: စစ်မှန်သောဗိမာန်တော်သည် ယုံကြည်သူများအတွင်း၌ ရှိသည်
      '17':
        title: ကယ်တင်ခြင်းအကြောင်းကို ယခု ရှင်းလင်းစွာ ရှင်းပြသည်
      '18':
        title: အလင်း၏ကောင်းကင်တမန်များနှင့် အမှောင်၏အုပ်စိုးရှင်
      '19':
        title: အလင်းလမ်းက ဆည်းကပ်မှုကို မိန့်မှာသည်
      '20':
        title: အမှောင်လမ်းက ထာဝရပျက်စီးခြင်းသို့ ပို့ဆောင်သည်
      '21':
        title: ဘုန်းအသရေရရန် သခင်ဘုရား၏အမိန့်များကို နာခံပါ
  Letters of Ignatius:
    display_name: အစ်ဂနေးရှပ်၏ စာများ
    author: ယေဘုယျလက်ခံထားသော အလယ်အလတ်မူကွဲမှ စာခုနစ်စောင်ကို အန္တိအုတ်မြို့၏ အသင်းတော်ကြီးကြပ်သူ အစ်ဂနေးရှပ်က ရေးသားခဲ့သည်။ နောက်ပိုင်းတွင် တိုးချဲ့ထားသော စာများနှင့် အစ်ဂနေးရှပ်၏အမည်ကို အသုံးပြု၍ အခြားသူများရေးသားခဲ့သော စာများမှာ ဤစုစည်းမှုတွင် မပါဝင်ပါ။
    audience: အစ်ဂနေးရှပ်သည် အသက်ပေးသေဆုံးရမည့်ခရီးသို့ သွားနေစဉ် ဧဖက်၊ မဂ္ဂနီးရှား၊ ထရားလက်စ်၊ ရောမ၊ ဖိလဒေလဖိနှင့် စမုရနမြို့တို့ရှိ ခရစ်ယာန်အသင်းတော်များအပြင် ပေါလီကာပ်ထံသို့ ရည်ရွယ်ရေးသားခဲ့သည်။
    date: အများအားဖြင့် ခရစ်နှစ် ၂ ရာစုအစောပိုင်း၊ ခန့်မှန်းခြေ ခရစ်နှစ် ၁၀၅–၁၁၇ ဟု သတ်မှတ်ကြသော်လည်း အစ်ဂနေးရှပ်၏ခရီးစဉ် အချိန်ကာလအတိအကျကိုမူ ဆွေးနွေးငြင်းခုံနေဆဲဖြစ်သည်။
    chapters:
      '1':
        title: အစ်ဂနေးရှပ်က ဧဖက်အသင်းတော်ကို နှုတ်ဆက်သည်
      '2':
        title: ယုံကြည်သူများက အကျဉ်းသားအစ်ဂနေးရှပ်ကို ကူညီကြသည်
      '3':
        title: စည်းလုံးစွာ ဆုတောင်း၍ အသင်းတော်ကြီးကြပ်သူကို ဂုဏ်ပြုပါ
      '4':
        title: အစ်ဂနေးရှပ်က နှိမ့်ချစွာ ပြောဆိုသည်
      '5':
        title: ယေရှုကိုချစ်ခြင်းအားဖြင့် စည်းလုံးကြသည်
      '6':
        title: အသင်းတော်ကြီးကြပ်သူက ယုံကြည်သူများကို ဆုတောင်းခြင်း၌ စည်းလုံးစေသည်
      '7':
        title: တိတ်ဆိတ်စွာ ကောင်းမွန်စွာ ဦးဆောင်သော အသင်းတော်ကြီးကြပ်သူကို လေးစားပါ
      '8':
        title: မှားယွင်းသောဆရာများ၏ လွှမ်းမိုးမှုကို သတိပြုပါ
      '9':
        title: ဧဖက်သားတို့၏ အစ်ဂနေးရှပ်အပေါ် ဆည်းကပ်မှု
      '10':
        title: ဆိုးညစ်သောသွန်သင်ချက်ကို ငြင်းပယ်၍ ခိုင်မြဲစွာ ရပ်တည်ပါ
      '11':
        title: လူအားလုံးအတွက် အစဉ်မပြတ် ဆုတောင်းပါ
      '12':
        title: ခရစ်တော်သည် အချုပ်အနှောင်အားလုံးထက် မြင့်မြတ်သည်
      '13':
        title: အစ်ဂနေးရှပ်က သေဒဏ်စီရင်ခံရသူအဖြစ် ရေးသားသည်
      '14':
        title: ငြိမ်သက်ခြင်းက စာတန်၏အကြံအစည်များကို ချိုးဖျက်သည်
      '15':
        title: ယုံကြည်ခြင်းက ကောင်းမြတ်ခြင်းနှင့် ချစ်ခြင်းသို့ ပို့ဆောင်သည်
      '16':
        title: တိတ်ဆိတ်ခြင်းဖြင့် သမ္မာတရားအတိုင်း အသက်ရှင်ခြင်း
      '17':
        title: အိမ်ထောင်စုများကို ဖျက်ဆီးသူတို့သည် အမွေမခံရ
      '18':
        title: ဘုရားသခင်ကို သိကျွမ်းခြင်းအား ပညာရှိစွာ ခံယူပါ
      '19':
        title: လက်ဝါးကပ်တိုင်အတွက် မိမိကိုယ်ကို အရာမထင်ခြင်း
      '20':
        title: မာရိ၊ ကြယ်နှင့် ခရစ်တော်၏ ဖြိုချခြင်း
      '21':
        title: အစ်ဂနေးရှပ်က ထပ်မံရေးသားနိုင်ရန် မျှော်လင့်သည်
      '22':
        title: အစ်ဂနေးရှပ်က စာဖတ်သူများအတွက် ဆုတောင်းသည်
      '23':
        title: မဂ္ဂနီးရှားအသင်းတော်သည် ကျေးဇူးတော်ခံစားရသည်
      '24':
        title: အစ်ဂနေးရှပ်က စည်းလုံးညီညွတ်ရေးအတွက် ဆုတောင်းသည်
      '25':
        title: အစ်ဂနေးရှပ်က အသင်းတော်ကြီးကြပ်သူအတွက် ဘုရားသခင်ကို ကျေးဇူးတင်သည်
      '26':
        title: သင်တို့၏ ငယ်ရွယ်သောအသင်းတော်ကြီးကြပ်သူကို ဂုဏ်ပြုပါ
      '27':
        title: ခရစ်ယာန်များအဖြစ် စစ်မှန်စွာ အသက်ရှင်ပါ
      '28':
        title: ယုံကြည်ခြင်းက ထာဝရတည်သော အမှတ်လက္ခဏာကို ရွေးချယ်သည်
      '29':
        title: အစ်ဂနေးရှပ်က အသင်းတော်၏စည်းလုံးမှုကို လက်ခံကြိုဆိုသည်
      '30':
        title: ယုံကြည်သူများသည် အသင်းတော်ကြီးကြပ်သူ၏ ဦးဆောင်မှုအောက်တွင် စုဝေးကြသည်
      '31':
        title: ယေရှုကို ကျေးဇူးတော်အားဖြင့် ဖော်ပြသည်
      '32':
        title: ရှင်ပြန်ထမြောက်သောခရစ်တော်၌ မျှော်လင့်ခြင်း တည်မြဲသည်
      '33':
        title: ယခင်တဆေးဟောင်းကို ဖယ်ရှားပါ
      '34':
        title: ခရစ်တော်၏အုတ်မြစ်ပေါ်တွင် ခိုင်မြဲစွာ ရပ်တည်ပါ
      '35':
        title: နှိမ့်ချခြင်းက ယုံကြည်ခြင်း၌ ဝမ်းမြောက်ခြင်းကို ဆောင်ကြဉ်းသည်
      '36':
        title: အသင်းတော်ကြီးကြပ်သူနှင့် ယုံကြည်ခြင်း၌ စည်းလုံးပါ
      '37':
        title: ဆုတောင်းခြင်းများက အသင်းတော်ကို အားသစ်လောင်းပေးသည်
      '38':
        title: ဘုရားသခင်နှင့်အညီ ညီညွတ်စွာ အသင်းတော်များကို နှုတ်ဆက်ပါ
      '39':
        title: ယေရှု၏ဆင်းရဲဒုက္ခခံခြင်းအားဖြင့် ငြိမ်သက်ခြင်းရသည်
      '40':
        title: စိတ်နှလုံးသန့်ရှင်း၍ သည်းခံခြင်းရှိပါ
      '41':
        title: ယုံကြည်သူများသည် အသင်းတော်ကြီးကြပ်သူနှင့် ခရစ်တော်ကို နာခံကြသည်
      '42':
        title: ခေါင်းဆောင်များကို ယေရှုခရစ်ကဲ့သို့ ဂုဏ်ပြုပါ
      '43':
        title: မာနထက် နူးညံ့သိမ်မွေ့ခြင်းကို တောင့်တပါ
      '44':
        title: အစ်ဂနေးရှပ်က ကောင်းကင်ဆိုင်ရာအသိပညာကို ထုတ်ဖော်ပြောရန် စိုးရွံ့ခဲ့သည်
      '45':
        title: မိစ္ဆာသွန်သင်ချက်များမဟုတ်ဘဲ ယုံကြည်ခြင်းဖြင့် အားဖြည့်ပါ
      '46':
        title: အသင်းတော်ခေါင်းဆောင်မှုအပေါ် သစ္စာစောင့်သိပါ
      '47':
        title: နူးညံ့သိမ်မွေ့ခြင်းဖြင့် မိမိကိုယ်ကို လက်နက်တပ်ဆင်ပါ
      '48':
        title: ခရစ်တော်တစ်ပါးတည်းသာ စစ်မှန်သောအသက်ကို ပေးသည်
      '49':
        title: အမှန်တကယ် ဆင်းရဲဒုက္ခခံခြင်းက ခရစ်တော် အမှန်တကယ်ရှိကြောင်း သက်သေပြသည်
      '50':
        title: မှားယွင်းသောဆရာများ၏ သေစေနိုင်သည့်အသီးကို ရှောင်ကြဉ်ပါ
      '51':
        title: ဆုတောင်းခြင်းနှင့် ဆည်းကပ်ခြင်း၌ စည်းလုံးပါ
      '52':
        title: ချစ်ခြင်းဖြင့် အသင်းတော်ကြီးကြပ်သူ၏ ဦးဆောင်မှုကို ခံယူပါ
      '53':
        title: ရောမမြို့ရှိ သစ္စာရှိအသင်းတော်သို့ နှုတ်ခွန်းဆက်ခြင်း
      '54':
        title: ကျွန်ုပ်၏ခရီးဆုံးတိုင်ရောက်ရန် ဆုတောင်းပေးပါ
      '55':
        title: လူ၏အသိအမှတ်ပြုမှုမဟုတ်ဘဲ ဘုရားသခင်၏နှစ်သက်မှုကို ရှာပါ
      '56':
        title: အတွင်းစိတ်ခွန်အားအတွက် ဆုတောင်းပါ
      '57':
        title: ဘုရားသခင်အတွက် သေခြင်းကို လိုလိုလားလား ရင်ဆိုင်ပါ
      '58':
        title: အစ်ဂနေးရှပ်က ဆင်းရဲဒုက္ခကို လက်ခံကြိုဆိုသည်
      '59':
        title: ခရစ်တော်အတွက် လောကီတပ်မက်မှုများကို လက်ဝါးကပ်တိုင်တင်ပါ
      '60':
        title: အစ်ဂနေးရှပ်က လောကီတပ်မက်မှုများကို ငြင်းပယ်သည်
      '61':
        title: အစ်ဂနေးရှပ်က သစ္စာရှိစွာ ဆင်းရဲဒုက္ခခံလိုသည်
      '62':
        title: သိုးထိန်းပြုစုမှုခံရသော ဆီးရီးယားအသင်းတော်အတွက် ဆုတောင်းပါ
      '63':
        title: စမုရနမှ ဆီးရီးယားသို့ နှုတ်ခွန်းဆက်ခြင်း
      '64':
        title: ဖိလဒေလဖိအသင်းတော်၏ စည်းလုံးမှုကို ချီးမွမ်းသည်
      '65':
        title: အသင်းတော်ကြီးကြပ်သူသည် အကျင့်သီလဖြင့် ဘုရားသခင်ကို အမှုဆောင်သည်
      '66':
        title: သင်တို့၏သိုးထိန်းနောက်သို့ သစ္စာရှိစွာ လိုက်ပါ
      '67':
        title: အန္တရာယ်ဖြစ်စေသော သွန်သင်ချက်များကို ငြင်းပယ်ပါ
      '68':
        title: ယူခရစ်ပွဲတစ်ပွဲတည်းကို အတူတကွ ဝေမျှပါ
      '69':
        title: ယေရှုခရစ်အတွက် ချည်နှောင်ခံရခြင်း၌ ဝမ်းမြောက်ပါ
      '70':
        title: ဂျူးဘာသာကို ငြင်းပယ်၍ ခရစ်တော်ကို လက်ခံပါ
      '71':
        title: ဝိညာဉ်တော်က ဖုံးကွယ်ထားသော သမ္မာတရားများကို ဖော်ပြသည်
      '72':
        title: စည်းလုံးခြင်းက အုပ်စုကွဲခြင်းကို ငြင်းပယ်သည်
      '73':
        title: ခရစ်တော်က လူအားလုံးကို ဘုရားသခင်၌ စည်းလုံးစေသည်
      '74':
        title: အန္တိအုတ်အသင်းတော်သို့ ငြိမ်သက်ခြင်း ရောက်လာသည်
      '75':
        title: ဖီလိုနှင့် ရိုင်ယပ်စ်တို့ကို ထိုက်တန်စွာ ဂုဏ်ပြုသည်
      '76':
        title: စမုရနအသင်းတော်သည် ကြွယ်ဝစွာ ကောင်းချီးခံစားရသည်
      '77':
        title: ယေရှုခရစ်၏ စစ်မှန်သော ဆင်းသက်လာခြင်း
      '78':
        title: ခရစ်တော်၏ ဆင်းရဲဒုက္ခခံခြင်းသည် အမှန်တကယ်ဖြစ်သည်
      '79':
        title: ရှင်ပြန်ထမြောက်သောယေရှုသည် ကိုယ်ခန္ဓာနှင့် ဆက်လက်ရှိနေခဲ့သည်
      '80':
        title: သားရဲတိရစ္ဆာန်များကို နောင်တရရန် သတိပေးသည်
      '81':
        title: ခရစ်တော်ကို ငြင်းပယ်ခြင်းသည် ရှင်ပြန်ထမြောက်ခြင်းကို ငြင်းပယ်ခြင်းဖြစ်သည်
      '82':
        title: ယူခရစ်သည် ခရစ်တော်၏အသားဖြစ်သည်
      '83':
        title: မှားယွင်းသောဆရာများ၏ သွန်သင်ချက်များကို ရှောင်ကြဉ်ပါ
      '84':
        title: ခရစ်တော်နောက်သို့ လိုက်သကဲ့သို့ အသင်းတော်ကြီးကြပ်သူနောက်သို့ လိုက်ပါ
      '85':
        title: နိုးထ၍ နောင်တရပါ
      '86':
        title: ခရစ်တော်၏ အမှုဆောင်များကို ကြိုဆိုပါ
      '87':
        title: အန္တိအုတ်သို့ ငြိမ်းချမ်းရေးကိုယ်စားလှယ်တစ်ဦး စေလွှတ်ပါ
      '88':
        title: ဘားရပ်စ်က အကျဉ်းကျနေသော အစ်ဂနေးရှပ်ကို အားပေးသည်
      '89':
        title: အစ်ဂနေးရှပ်က ယုံကြည်သူများကို အမည်တပ်၍ နှုတ်ဆက်သည်
      '90':
        title: အစ်ဂနေးရှပ်က ဘုန်းတော်ကြီး ပေါ်လီကာပ်ထံ စာရေးသည်
      '91':
        title: အစ်ဂနေးရှပ်က အမှုတော်တွင် တည်ကြည်ရန် တိုက်တွန်းသည်
      '92':
        title: ထိခိုက်နစ်နာမှုကို ဉာဏ်ပညာဖြင့် ကုစားပါ
      '93':
        title: ပေတုံးကဲ့သို့ ခိုင်မြဲစွာ ရပ်တည်ပါ
      '94':
        title: ဘုရားသခင်၏ သဘောတူညီမှုဖြင့် မုဆိုးမများကို စောင့်ရှောက်ပါ
      '95':
        title: မကောင်းသောအကျင့်များကို ရှောင်၍ ပညာရှိစွာ လက်ထပ်ပါ
      '96':
        title: နာခံပါ၊ အစေခံပါ၊ အတူတကွ တိုးတက်ပါ
      '97':
        title: ပေါ်လီကာပ်က ဆီးရီးယားသို့ ကိုယ်စားလှယ် စေလွှတ်သည်
      '98':
        title: ဂုဏ်ယူဖွယ်လုပ်ရပ်များအတွက် သတင်းစေတမန်များကို စီစဉ်ပါ
  Polycarp to the Philippians:
    display_name: ဖိလိပ္ပိမြို့သားများထံ ပေါ်လီကာပ်၏စာ
    author: စမုရနမြို့၏ ဘုန်းတော်ကြီး ပေါ်လီကာပ်။ လက်ရှိရရှိထားသောစာသားသည် အချိန်တစ်ကြိမ်ထက်မက ပေးပို့ခဲ့သည့် အကြောင်းအရာများကို ပေါင်းစပ်ထားခြင်းဖြစ်သည်ဟု ပညာရှင်အချို့က ယူဆကြသည်။
    audience: အစ်ဂနေးရှပ်၏စာများကို တောင်းခံခဲ့ပြီး ယုံကြည်ခြင်း၊ အကျင့်အကြံ၊ ခေါင်းဆောင်မှု၊ ငွေကြေးနှင့် ကြံ့ကြံ့ခံခြင်းတို့အကြောင်း အကြံပေးချက်များ ရရှိခဲ့သော ဖိလိပ္ပိမြို့ရှိ ခရစ်ယာန်အသင်းတော်။
    date: ခရစ်နှစ် ၂ ရာစု အစောပိုင်းမှ အလယ်ပိုင်းအတွင်း။ အနည်းဆုံး တစ်စိတ်တစ်ပိုင်းသည် အစ်ဂနေးရှပ်၏ခရီးစဉ်နှင့် နီးကပ်စွာ ဆက်စပ်နေပြီး၊ စာအများအပြားကို ပေါင်းစပ်ထားခြင်းဖြစ်နိုင်သည်ဟူသော အဆိုများအရ အပိုင်းတစ်ခုမှာ အနည်းငယ် နောက်ကျနိုင်သည်။
    chapters:
      '1':
        title: ပေါ်လီကာပ်က ဖိလိပ္ပိမြို့သားများကို နှုတ်ဆက်သည်
      '2':
        title: ခရစ်တော်သည် အပြစ်သားများအတွက် ဆင်းရဲဒုက္ခခံခဲ့သည်
      '3':
        title: ကြည်ညိုမှုနှင့် သမ္မာတရားဖြင့် ဘုရားသခင်ကို အစေခံပါ
      '4':
        title: ပေါ်လီကာပ်က ဖြောင့်မတ်ခြင်းအကြောင်း ရေးသားသည်
      '5':
        title: မုဆိုးမများသည် စိတ်ရင်းမှန်ဖြင့် အစဉ်ဆုတောင်းရမည်
      '6':
        title: သင်းထောက်များသည် ယခု ခရစ်တော်ကို အပြစ်ကင်းစွာ အစေခံကြပါစေ
      '7':
        title: အသက်ကြီးသူများသည် လူတိုင်းအပေါ် သနားကြင်နာပါ
      '8':
        title: အန္တိခရစ်နှင့် မှားယွင်းသောသွန်သင်ချက်များကို ငြင်းပယ်ပါ
      '9':
        title: မျှော်လင့်ခြင်းကို စွဲကိုင်၍ ခရစ်တော်နောက် လိုက်ပါ
      '10':
        title: သစ္စာရှိသော သန့်ရှင်းသူများ၏ စံနမူနာကို လိုက်နာပါ
      '11':
        title: ခိုင်မြဲစွာ ရပ်တည်၍ မေတ္တာဖြင့် အသက်ရှင်ပါ
      '12':
        title: လောဘနှင့် ရုပ်တုကိုးကွယ်ခြင်းကို ယခုပင် ငြင်းပယ်ပါ
      '13':
        title: ပေါ်လီကာပ်က ဖိလိပ္ပိမြို့သားများ၏ ယုံကြည်ခြင်းအတွက် ဆုတောင်းသည်
      '14':
        title: ဆီးရီးယားသို့ ပို့သောစာများကို စောင့်မျှော်နေသည်
      '15':
        title: ခရက်စင်က စာကို အပြစ်တင်စရာမရှိဘဲ ပို့ဆောင်သည်
  Martyrdom of Polycarp:
    display_name: ပေါ်လီကာပ်၏ မာတုရသေခြင်း
    author: စမုရနမြို့ရှိ အသင်းတော်ကိုယ်စား အမည်မဖော်ဘဲ ရေးသားခဲ့သော အသင်းသားများ။ အဆုံးပိုင်းရှိ လက်ဆင့်ကမ်းကူးယူမှု မှတ်ချက်များသည် နောက်ပိုင်းကာလ၌ မိတ္တူကူးခြင်းနှင့် ပျံ့နှံ့ခြင်းကို ထင်ဟပ်စေသည်။
    audience: ဖိလိုမေလီယမ်မြို့ရှိ အသင်းတော်နှင့် ပိုမိုကျယ်ပြန့်သော ခရစ်ယာန်အသိုင်းအဝိုင်း။ ပေါ်လီကာပ် အဖမ်းခံရခြင်း၊ စစ်ဆေးစီရင်ခံရခြင်း၊ သေဆုံးခြင်းနှင့် စံနမူနာယူဖွယ် ကြံ့ကြံ့ခံခြင်းတို့အကြောင်း မှတ်တမ်းအဖြစ် ပေးပို့ထားသည်။
    date: ပေါ်လီကာပ် သေဆုံးပြီးနောက် ရေးသားခဲ့ပြီး အများအားဖြင့် ခရစ်နှစ် ၂ ရာစု အလယ်ပိုင်း သို့မဟုတ် နှောင်းပိုင်းဟု သတ်မှတ်ကြသည်။ မာတုရသေခြင်း ဖြစ်ပွားသည့် နှစ်အတိအကျနှင့် စာတမ်း၏ နောက်ဆုံးပုံစံ နှစ်ခုလုံးကို ပညာရှင်များ ဆွေးနွေးငြင်းခုံနေဆဲဖြစ်သည်။
    chapters:
      '1':
        title: အသင်းတော်က လူတိုင်းထံ ကရုဏာမေတ္တာ ပို့သသည်
      '2':
        title: ပေါ်လီကာပ်၏ မာတုရသေခြင်း အတည်ပြည့်စုံသည်
      '3':
        title: မာတုရများသည် ခရစ်တော်အတွက် ကြံ့ကြံ့ခံကြသည်
      '4':
        title: ဂျာမနီကပ်က သားရဲများကို ရင်ဆိုင်သည်
      '5':
        title: ကွင်တပ်က သတ္တိမခိုင်ဘဲ ကျရှုံးသည်
      '6':
        title: ပေါ်လီကာပ်က လူတိုင်းအတွက် ဆုတောင်းသည်
      '7':
        title: မိမိအိမ်သားကပင် ပေါ်လီကာပ်ကို သစ္စာဖောက်သည်
      '8':
        title: ပေါ်လီကာပ်က မိမိကြမ္မာကို လက်ခံကြိုဆိုသည်
      '9':
        title: ဟေရုဒ်က ပေါ်လီကာပ်အား ငြင်းပယ်ရန် တိုက်တွန်းသည်
      '10':
        title: ကောင်းကင်အသံက ပေါ်လီကာပ်ကို ခွန်အားပေးသည်
      '11':
        title: ပေါ်လီကာပ်က ခရစ်တော်ကို ကဲ့ရဲ့ရန် ငြင်းဆိုသည်
      '12':
        title: ပေါ်လီကာပ်က သေခြင်းခြိမ်းခြောက်မှုများကို လှောင်ပြောင်သည်
      '13':
        title: လူအုပ်က ပေါ်လီကာပ်ကို မီးရှို့ရန် တောင်းဆိုသည်
      '14':
        title: ပေါ်လီကာပ်သည် မီးရှို့မည့်တိုင်၌ ချည်နှောင်ခံရလျက် ဆုတောင်းသည်
      '15':
        title: ပေါ်လီကာပ်က မီးရှို့မည့်တိုင်တွင် ဆုတောင်းသည်
      '16':
        title: မီးလျှံများက ပေါ်လီကာပ်ကို ဝိုင်းပတ်သည်
      '17':
        title: ပေါ်လီကာပ်၏ သွေးက မီးကို ငြိမ်းစေသည်
      '18':
        title: နိကီးတပ်က အုပ်ချုပ်ရေးအရာရှိအား ငြင်းပယ်ရန် တိုက်တွန်းသည်
      '19':
        title: ခရစ်ယာန်များက ပေါ်လီကာပ်၏ အရိုးများကို စုသိမ်းကြသည်
      '20':
        title: ပေါ်လီကာပ်က အုပ်စိုးသူကို အောင်နိုင်၍ သရဖူကို ရရှိသည်
      '21':
        title: မာစီယာနပ်က ယုံကြည်သူများထံ အကျဉ်းချုပ် ပေးပို့သည်
      '22':
        title: ပေါ်လီကာပ်သည် ဥပုသ်နေ့၌ မာတုရသေခြင်း ခံသည်
      '23':
        title: ပေါ်လီကာပ်နောက်လိုက်၍ နိုင်ငံတော်ထဲ ဝင်ကြပါ
  Epistle to Diognetus:
    display_name: ဒိုင်အော့ဂနီးတပ်ထံပေးစာ
    author: အမည်မသိ။ စာရေးသူက မိမိကိုယ်ကို တပည့် သို့မဟုတ် သင်ယူသူဟု ခေါ်ဆိုသော်လည်း သူ့ကိုသော်လည်းကောင်း၊ စာလက်ခံသူ ဒိုင်အော့ဂနီးတပ်ကိုသော်လည်းကောင်း အခိုင်အမာ မည်သူမည်ဝါဟု မဖော်ထုတ်နိုင်ပါ။
    audience: ခရစ်ယာန်ဝတ်ပြုခြင်း၊ ကိုယ်ကျင့်တရား၊ လူမှုအသိုင်းအဝိုင်းအတွင်း ကိုယ်ပိုင်လက္ခဏာ၊ မေတ္တာနှင့် ယုံကြည်ခြင်းသည် အသစ်အဆန်းဟု ထင်ရခြင်းတို့အကြောင်း မေးမြန်းသော ပညာတတ် ခရစ်ယာန်မဟုတ်သူ စူးစမ်းလေ့လာသူတစ်ဦးနှင့် သူကဲ့သို့သော စာဖတ်သူများ။
    date: ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုအစောပိုင်းဟု မကြာခဏ သတ်မှတ်ကြသော်လည်း အဆိုပြုသည့်ကာလများမှာ အလွန်ကွဲပြားကြသည်။ နောက်ဆုံးအခန်းနှစ်ခန်းသည် အခြားစာတစ်စောင်မှ ဖြစ်နိုင်သည်။
    chapters:
      '1':
        title: ဒိုင်အော့ဂနီးတပ်က ယုံကြည်ခြင်းကို နားလည်ရန် ရှာဖွေသည်
      '2':
