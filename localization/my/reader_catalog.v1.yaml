      '50':
        title: ယောသပ်သည် ယာကုပ်၏ နောက်ဆုံးဆန္ဒကို ဖြည့်ဆည်းခြင်း
  Exodus:
    display_name: ထွက်မြောက်ရာကျမ်း
    author: ရေးသားသူအမည် မသိရပါ။ အစဉ်အလာအရ မောရှေရေးသားသည်ဟု ယူဆကြသည်။ ခေတ်သစ်ပညာရှင်များကမူ အချိန်ကာလရှည်ကြာစွာ ဖွဲ့စည်းလာခဲ့ပြီး နောက်ပိုင်းတွင် ရင်းမြစ်အမျိုးမျိုးကို စုစည်းတည်းဖြတ်ထားသည်ဟု ရှုမြင်ကြသည်။
    audience: လွတ်မြောက်ပြီး ပဋိညာဉ်ခံလူမျိုးဖြစ်လာသော ဣသရေလသည် ဘုရားသခင်၏ ပညတ်တရားအောက်၌ ထာဝရဘုရား၏ လူမျိုးဖြစ်ခြင်း၏ အဓိပ္ပာယ်ကို သင်ယူစေရန် ရည်ရွယ်သည်။
    date: ရာစုနှစ်များတစ်လျှောက် ဖွဲ့စည်းရေးသားခဲ့ပြီး ခန့်မှန်းအားဖြင့် ဘီစီ ၆ ရာစုမှ ၅ ရာစုအတွင်း ယနေ့လက်ခံထားသည့် ပုံစံသို့ ရောက်ရှိခဲ့သည်။
