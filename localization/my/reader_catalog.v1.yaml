      '68':
        title: အနာဂတ်ကယ်တင်ခြင်းက ဝမ်းမြောက်ခြင်းကို ဆောင်ကြဉ်းသည်
      '69':
        title: နောက်ဆုံးရေများသည် ကမ္ဘာလောကနှင့် သက်ဆိုင်သည်
      '70':
        title: ကမ္ဘာလောက၏အချိန်သည် တရားစီရင်ရန် အဆင်သင့်ဖြစ်လာသည်
      '71':
        title: သန့်ရှင်းသောလူတို့အား ကရုဏာပြသည်
