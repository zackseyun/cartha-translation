  Apocryphon of John:
    display_name: ယောဟန်၏ လျှို့ဝှက်ကျမ်း
    author: အမည်မသိသူ ရေးသားသည်။ ဤစာသည် ရှင်ပြန်ထမြောက်သော ယေရှုက ဇေဗေဒဲ၏သား ယောဟန်အား ဖွင့်ပြခြင်းကို ယောဟန်နှင့် အမည်လွှဲဆက်စပ်၍ တင်ပြထားပြီး ရှေးဟောင်းမူကွဲတစ်မျိုးထက်မကဖြင့် ကျန်ရှိသည်။
    audience: ဘုရားသဘောသဘာဝဆိုင်ရာ နယ်ပယ်၊ ဖန်ဆင်းခြင်း၊ လူသား၏ပင်ကိုလက္ခဏာနှင့် ရန်လိုသော အုပ်စိုးသူများထံမှ လွတ်မြောက်ခြင်းတို့အကြောင်း ရှင်းလင်းချက်ရှာဖွေနေသည့် ဆက်သီယန် သို့မဟုတ် ယင်းနှင့် နီးစပ်သော ဖွင့်ပြချက်အစဉ်အလာမှ ခရစ်ယာန်များ။
    date: အစောပိုင်းပုံစံတစ်မျိုးသည် ခရစ်နှစ် ၂ ရာစုတွင် ပျံ့နှံ့ခဲ့ဖွယ်ရှိသည်။ အတိုနှင့် အရှည် မူကွဲများကို ထိန်းသိမ်းထားသည့် ယနေ့ကျန်ရှိသော ကော့ပ်တစ်ဘာသာ သက်သေစာမူများမှာ ၄ ရာစုနှင့် ၅ ရာစုတို့မှ ဖြစ်သည်။
    chapters:
      '1':
        title: ယောဟန်သည် ယေရှု၏ဉာဏ်ပညာကို ရှာဖွေသည်
      '2':
        title: ကောင်းကင်ဘုံသည် ဘုရားသဘောသဘာဝဆိုင်ရာ ပုံသဏ္ဌာန်များကို ဖော်ပြသည်
      '3':
        title: ကွယ်ဝှက်သောဘုရားသခင်သည် အမြင့်ဆုံးအရှိတရားဖြစ်သည်
      '4':
        title: ဘုရားသဘောသဘာဝဆိုင်ရာ ကြိုတင်စီမံမှုသည် ထွန်းလင်းတောက်ပသည်
      '5':
        title: ဘာဘဲလိုသည် တန်ခိုးများကို တောင်းခံသည်
      '6':
        title: ခရစ်တော်သည် ကြိုတင်စီမံမှုမှ ပေါ်ထွန်းလာသည်
      '7':
        title: ထာဝရအသက်သည် ဝိညာဉ်တော်ကို ချီးမွမ်းသည်
      '8':
        title: အာဒံသည် ကွယ်ဝှက်သောဘုရားသခင်ကို ချီးမွမ်းခဲ့သည်
      '9':
        title: ဆိုဖီယာသည် မပြည့်စုံသောသတ္တဝါကို ဖန်ဆင်းသည်
      '10':
        title: မာနကြီးသောအုပ်စိုးရှင်သည် နယ်ပယ်များကို ဖွဲ့စည်းသည်
      '11':
        title: မသိနားမလည်သောအုပ်စိုးရှင်သည် အစီအစဉ်ကို ပုံတူကူးသည်
      '12':
        title: ဉာဏ်ပညာသည် အမှောင်ထဲတွင် နောင်တရသည်
      '13':
        title: အာဏာပိုင်များသည် လူ့ခန္ဓာကိုယ်ကို ဖွဲ့စည်းသည်
      '14':
        title: ဘုရားသခင်သည် အာဒံအတွင်း၌ အလင်းကို ဝှက်ထားသည်
      '15':
        title: အုပ်စိုးရှင်များသည် အာဒံမေ့လျော့စေရန် သွေးဆောင်ကြသည်
      '16':
        title: ဘုရားအလင်းသည် လူသားတို့ကို နိုးထစေသည်
      '17':
        title: ကြိုတင်စောင့်ရှောက်မှုက စိတ်များကို နိုးထစေသည်
      '18':
        title: ဝိညာဉ်များသည် မကောင်းမှုနှင့် ရုန်းကန်ခြင်းမှ လှည့်ထွက်ကြသည်
      '19':
        title: ကရုဏာရှင် ဝိညာဉ်တော်က လူတို့ကို နိုးထစေသည်
      '20':
        title: ဝိညာဉ်များကို ကယ်တင်ရန် အလင်းဆင်းသက်လာသည်
      '21':
        title: ကယ်တင်ရှင်က လျှို့ဝှက်ဉာဏ်ပညာကို အပ်နှံသည်
  Hypostasis of the Archons:
    display_name: အာခွန်တို့၏ ဖြစ်တည်မှု
    author: အမည်မသိ။ စာရေးသူသည် ကမ္ဘာဦးကျမ်းကို အာခွန်တို့အကြောင်း ဗျာဒိတ်ဆန်သော ဒဏ္ဍာရီတစ်ရပ်ဖြင့် အနက်ဖွင့်ထားသည်။ ဤစာကို အမည်တပ်နိုင်သော ဆရာတစ်ဦးဦး ရေးသားသည်ဟု ခိုင်လုံစွာ သတ်မှတ်၍မရပါ။
    audience: ကမ္ဘာဦးကျမ်းကို မသိနားမလည်သော စကြဝဠာအုပ်စိုးသူများ၊ ဘုရားသခင်နှင့်ဆိုင်သော ဉာဏ်ပညာနှင့် လူသားတို့၏ ဝိညာဉ်ရေးမူလအစတို့ကြား ပဋိပက္ခအဖြစ် ဖတ်ရှုသည့် ဆေသီယန် သို့မဟုတ် ဆက်နွှယ်ရာ အသိုင်းအဝိုင်းမှ ခရစ်ယာန်များ။
    date: ခရစ်နှစ် ၃ ရာစုဝန်းကျင်ဟု ယေဘုယျအားဖြင့် ယူဆကြသည်။ နာဂ်ဟာမာဒီ ကိုဒက်စ် ၂ ထဲရှိ ခရစ်နှစ် ၄ ရာစု ကော့ပ်တစ်မိတ္တူတစ်စောင်တွင် ထိန်းသိမ်းကျန်ရစ်သည်။
    chapters:
      '1':
        title: ဝိညာဉ်တော်က စကြဝဠာတန်ခိုးများကို ဖော်ပြသည်
      '2':
        title: အသံတော်က မျက်စိကန်းသော အုပ်စိုးသူကို ဖော်ထုတ်သည်
      '3':
        title: ဘုရားအလင်းက အာဒံကို အသက်ရှင်စေသည်
      '4':
        title: မိန်းမသည် အုပ်စိုးသူတို့၏ အကြမ်းဖက်မှုမှ လွတ်မြောက်သည်
      '5':
        title: မြွေက ဝိညာဉ်ရေးသမ္မာတရားကို သင်ပေးသည်
      '6':
        title: ကာဣနက အာဗေလကိုသတ်၍ ရှေသက အစားထိုးသည်
      '7':
        title: နောဧသည် သင်္ဘောတည်ဆောက်ပြီး နှစ်ကြိမ် ကယ်တင်ခံရသည်
      '8':
        title: နောရေယာသည် အမှောင်တန်ခိုးများကို ရဲဝံ့စွာ ခုခံသည်
      '9':
        title: အဲလဲလက်က စစ်မှန်သော မူလအစကို အာမခံသည်
      '10':
        title: ဉာဏ်ပညာ၏သမီးက အုပ်စိုးသူကို ချုပ်နှောင်သည်
      '11':
        title: ဆာဗာအုတ် နောင်တရ၍ ဉာဏ်ပညာကို ချီးမွမ်းသည်
      '12':
        title: ဖွင့်ပြသူက ထာဝရအသက်ကို ယူဆောင်လာသည်
  On the Origin of the World:
    display_name: ကမ္ဘာလောက၏ မူလအစအကြောင်း
    author: အမည်မသိ။ ဤစာသည် ဂျူး၊ ခရစ်ယာန်၊ ပလေတိုဝါဒနှင့် ဒဏ္ဍာရီဆိုင်ရာ အစဉ်အလာအမျိုးမျိုးကို ပေါင်းစပ်ပြင်ဆင်ထားသော်လည်း စုစည်းသူ၏အမည်ကို မဖော်ပြပါ။
    audience: ဖန်ဆင်းခြင်း၊ စကြဝဠာအုပ်စိုးသူများ၊ ဆိုဖီယာ၊ အာဒံနှင့် ဧဝ၊ ထို့ပြင် ကမ္ဘာလောက၏ နောက်ဆုံးကြမ္မာတို့နှင့်ပတ်သက်သော သမားရိုးကျမဟုတ်သည့် သမိုင်းအမြင်ကို ရှာဖွေသော နောစတစ်ဆန်သည့် ခရစ်ယာန်ပတ်ဝန်းကျင်မှ စာဖတ်သူများ။
    date: အစောပိုင်း အကြောင်းအရာများကို အခြေခံထားနိုင်သော်လည်း ခရစ်နှစ် ၃ ရာစုက စာဟု ယေဘုယျအားဖြင့် သတ်မှတ်ကြသည်။ အဓိကအားဖြင့် ခရစ်နှစ် ၄ ရာစုမှ ကော့ပ်တစ်စာမူအထောက်အထားများ၌ ထိန်းသိမ်းကျန်ရစ်သည်။
    chapters:
      '1':
        title: အမှောင်ထဲမှ ပရမ်းပတာအခြေအနေ ပေါ်ထွက်လာသည်
      '2':
        title: ဉာဏ်ပညာက ကောင်းကင်၏ နယ်နိမိတ်ကို ဖွဲ့စည်းသည်
      '3':
        title: အုပ်စိုးသူက မိမိတစ်ဦးတည်း အုပ်စိုးသည်ဟု မှားယွင်းယူဆသည်
      '4':
        title: သတ္တဝါခုနစ်ပါးက ကောင်းကင်များကို အုပ်ချုပ်သည်
      '5':
        title: မျက်စိကန်းသော ဘုရားက မိမိတစ်ပါးတည်းသာ ရှိသည်ဟု ဆိုသည်
      '6':
        title: ဆာဗာအုတ်က မိဘတို့၏ အမှောင်ကို ငြင်းပယ်သည်
      '7':
        title: ကောင်းကင်အုပ်စိုးသူက ပုံတူများကို ဖန်ဆင်းသည်
      '8':
        title: အသက်၏တန်ခိုးများက သေခြင်းကို အနိုင်ယူသည်
      '9':
        title: ပထမအုပ်စိုးသူက ဘုရားဆိုင်ရာ ယုံကြည်ခြင်းကို မြင်သည်
      '10':
        title: တောက်ပသော အာဒံသည် အလင်းထဲတွင် ပေါ်လာသည်
      '11':
