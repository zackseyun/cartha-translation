  Fragments of Papias:
    display_name: ပါပိယပ်၏ ကျန်ရှိသောစာပိုင်းများ
    author: ပျောက်ဆုံးနေသော ငါးတွဲပါ «သခင်ဘုရား၏ မိန့်ဆိုချက်များအပေါ် ရှင်းလင်းဖွင့်ဆိုချက်များ» ကို ရေးသားခဲ့သည့် ဟေရပေါလိမြို့၏ ဘုန်းတော်ကြီး ပါပိယပ်။ ယနေ့ကျန်ရှိသော စုစည်းမှုမှာ နောက်ပိုင်းစာရေးဆရာများ ထိန်းသိမ်းထားခဲ့သည့် ကိုးကားချက်များနှင့် ပြန်လည်တင်ပြချက်များဖြစ်သည်။
    audience: ယေရှုနှင့် တမန်တော်များအကြောင်း မှတ်မိလက်ဆင့်ကမ်းခဲ့သော သွန်သင်ချက်များကို ရှာဖွေသည့် ရှေးဦးခရစ်ယာန်များ။ ထိုသွန်သင်ချက်များကို အမည်ဖော်ပြထားသော နှုတ်ဖြင့် သက်သေခံလက်ဆင့်ကမ်းမှုနှင့် အနက်ဖွင့်ဆိုမှု အဆင့်ဆင့်မှ စုဆောင်းထားသည်။
    date: ပါပိယပ်၏ စာကို အများအားဖြင့် ခရစ်နှစ် ၂ ရာစုအစောပိုင်း၊ မကြာခဏ ခန့်မှန်းခြေ ခရစ်နှစ် ၁၁၀–၁၃၀ ဟု သတ်မှတ်ကြသည်။ ကျန်ရှိသော စာပိုင်းများကို ခရစ်နှစ် ၂ ရာစုမှစ၍ နောက်ပိုင်းကာလအထိ ရေးသားခဲ့သော စာရေးဆရာများ၏ စာများတွင် တွေ့ရသည်။
    chapters:
      '1':
        title: ယောဟန်၏ အုပ်စိုးမှုနောက်တွင် ခေါင်းဆောင်များ ပေါ်ထွန်းလာသည်
      '2':
        title: ပါပိယပ်က သခင်ဘုရား၏ သွန်သင်ချက်များကို ရေးသားသည်
      '3':
        title: ယေရှုက အိမ်ထောင်ရေးဖောက်ပြန်သော အမျိုးသမီးကို ကယ်တင်သည်
      '4':
        title: ပါပိယပ်က အကြီးအကဲ ယောဟန်၏ အစဉ်အလာများကို သွန်သင်သည်
      '5':
        title: ဂျရုမ်းက ပါပိယပ်၏ စာကို ဖော်ပြသည်
      '6':
        title: အီရနေးယပ်က ပါပိယပ်ထံမှ သင်ယူသည်
      '7':
        title: အန်ဒရေယပ်က ပါပိယပ်၏ သက်သေခံချက်ကို ကိုးကားသည်
      '8':
        title: စာတန် ရှုံးနိမ့်ချိန်တွင် ကောင်းကင်တမန်များ ကျဆုံးကြသည်
      '9':
        title: အနက်ဖွင့်သူများက နေ့ရက်များကို ခရစ်တော်နှင့် ဆက်စပ်ကြသည်
      '10':
        title: ပရဒိသုကို အသင်းတော်ဟု အနက်ဖွင့်သည်
      '11':
        title: ပါပိယပ်က အနာဂတ်နိုင်ငံတော်အကြောင်း ဖော်ပြသည်
      '12':
        title: ပါပိယပ်က ကလေးကဲ့သို့သော ယုံကြည်ခြင်းကို အဓိပ္ပာယ်ဖွင့်သည်
      '13':
        title: မက်စီမပ်က ပါပိယပ်၏ သွန်သင်ချက်ကို ကိုးကားသည်
      '14':
        title: ဖိုတီယပ်က ပါပိယပ်၏ အမြင်ကို ငြင်းပယ်သည်
      '15':
        title: အပိုလီနာရီယပ်က ယုဒ၏ အဆုံးသတ်ကို ပြန်လည်ပြောပြသည်
      '16':
