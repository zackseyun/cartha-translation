    date: ယေဘုယျအားဖြင့် ခရစ်နှစ် ၂ ရာစုနှောင်းပိုင်း သို့မဟုတ် ၃ ရာစုအစောပိုင်းတွင် ရေးသားခဲ့သည်ဟု ခန့်မှန်းကြသည်။ ဂရိဘာသာမှ ပြန်ဆိုထားသည့် ၄ ရာစုနှစ် ကော့ပ်တစ်ဘာသာပြန်ဖြင့် ထိန်းသိမ်းထားသည်။
