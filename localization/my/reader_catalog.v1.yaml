    author: ရေးသားသူအမည် မသိရပါ။ ရောမမြို့သား ကလဲမင့်အား ရည်ညွှန်း၍ အမည်ခံတင်ပြထားသည်။
    audience: ခေါင်းဆောင်မှုဆိုင်ရာ အငြင်းပွားမှုတွင် ပါဝင်ရှုပ်ထွေးနေသော ကောရိန္သုမြို့ရှိ ခရစ်ယာန်အသင်းတော်။
    date: ခန့်မှန်းခြေ အေဒီ ၉၆ ခုနှစ်။
    chapters:
      '1':
        title: မသန့်ရှင်းသော ပုန်ကန်မှုကြောင့် ညီအစ်ကိုများ ဒုက္ခခံရသည်
      '2':
        title: နှိမ့်ချခြင်းက ငြိမ်းချမ်းသော စိတ်အားထက်သန်မှုကို ဖြစ်ပေါ်စေသည်
      '3':
        title: မနာလိုမှုက စစ်ပွဲနှင့် သုံ့ပန်းဘဝကို ဖြစ်စေသည်
      '4':
        title: မနာလိုမှုကြောင့် ရှေးခေတ်လူသတ်မှုများ ဖြစ်ပွားခဲ့သည်
      '5':
        title: ပေတရုနှင့် ပေါလုတို့ ခံနိုင်ရည်ရှိစွာ ဆင်းရဲဒုက္ခခံခဲ့ကြသည်
      '6':
        title: မနာလိုမှုက ဘုရားသခင်ရွေးချယ်သော အမျိုးသမီးများကို လိုက်လံနှိပ်စက်သည်
      '7':
        title: ကယ်တင်ခြင်းအတွက် တန်ဖိုးကြီးသော သွေး
      '8':
        title: အရှင်သည် အပြစ်သား နောင်တရခြင်းကို ပို၍နှစ်သက်သည်
      '9':
        title: ဖြောင့်မတ်သော ဧနောက်ကို အထက်သို့ ခေါ်ဆောင်သည်
      '10':
        title: အာဗြဟံသည် နာခံခြင်းဖြင့် သစ္စာရှိကြောင်း သက်သေပြသည်
      '11':
        title: ဧည့်ဝတ်ပြုခြင်းကြောင့် လောတ ကယ်တင်ခံရသည်
      '12':
        title: ရာခပ်သည် သူလျှိုများကို သစ္စာရှိစွာ ဝှက်ထားပေးသည်
      '13':
        title: မိမိတို့ကိုယ်ကို နှိမ့်ချ၍ သခင်ကို ရှာကြစို့
      '14':
        title: အချင်းချင်း နူးညံ့သိမ်မွေ့စွာ ဆက်ဆံကြစို့
      '15':
        title: ဘုရားဝတ်၌ မွေ့လျော်ခြင်းနှင့် ယှဉ်သော ငြိမ်းချမ်းရေးကို လိုက်စားကြစို့
      '16':
        title: မေရှိယသည် နိမ့်ကျခြင်းနှင့် နှိမ့်ချခြင်းဖြင့် ကြွလာသည်
      '17':
        title: ခြိုးခြံစွာ အသက်ရှင်ခဲ့သော ပရောဖက်များကို အတုယူကြစို့
      '18':
        title: ဒါဝိဒ်သည် မိမိအပြစ်များကို နှိမ့်ချစွာ ဝန်ခံသည်
      '19':
        title: နှိမ့်ချခြင်းက ငြိမ်းချမ်းစွာ အသက်ရှင်ရန် လမ်းညွှန်သည်
      '20':
        title: ဖန်ဆင်းထားသမျှသည် အစီအစဉ်တကျ ငြိမ်းချမ်းစွာ လည်ပတ်သည်
      '21':
        title: ဘုရားသခင်ရှေ့တော်၌ ထိုက်တန်စွာ အသက်ရှင်ကြစို့
      '22':
        title: ခရစ်တော်က သခင်ကို ကြောက်ရွံ့ရန် ခေါ်တော်မူသည်
      '23':
        title: ခမည်းတော်သည် စိတ်ရိုးဖြောင့်သူကို စောင့်ရှောက်သည်
      '24':
        title: အနာဂတ် ရှင်ပြန်ထမြောက်ခြင်းကို ဘုရားသခင် အာမခံသည်
      '25':
        title: ဖီးနစ်ငှက် သေဆုံးပြီး ပြန်လည်ရှင်သန်သည်
      '26':
        title: သစ္စာရှိသော အစေခံများကို ဘုရားသခင် ထမြောက်စေမည်
      '27':
        title: သစ္စာရှိသော ဘုရားသခင်၌ စိတ်နှလုံးကို ခိုင်မြဲစွာ တွယ်ကပ်ကြစို့
      '28':
        title: ဘုရားသခင်ကို ကြောက်ရွံ့ကြစို့၊ မည်သည့်နေရာတွင်မျှ ပုန်း၍မရ
      '29':
        title: သန့်ရှင်းသောလက်များဖြင့် အနီးတော်သို့ ချဉ်းကပ်ကြစို့
      '30':
        title: အပြစ်များကို ရှောင်၍ နှိမ့်ချခြင်းကို ခံယူကြစို့
      '31':
        title: အာဗြဟံ၊ ဣဇာက်နှင့် ယာကုပ်တို့သည် ယုံကြည်ခြင်းကို လိုက်လျှောက်ကြသည်
      '32':
        title: ဘုရားသခင်၏ အလိုတော်က ကျွန်ုပ်တို့ကို ဖြောင့်မတ်စေသည်
      '33':
        title: ကောင်းသောအမှုများကို အလျင်အမြန် ပြုကြစို့
      '34':
        title: စိတ်အားထက်သန်သော အလုပ်သမားများသည် မိမိတို့စားစရာကို ရရှိကြသည်
      '35':
        title: ကောင်းကင်ဆုလာဘ်များအတွက် ခံနိုင်ရည်ရှိကြစို့
      '36':
        title: ကျွန်ုပ်တို့၏ ယဇ်ပုရောဟိတ်မင်း ယေရှု ကယ်တင်တော်မူသည်
      '37':
        title: စစ်သည်များသည် အမိန့်များကို သစ္စာရှိစွာ လိုက်နာကြသည်
      '38':
        title: မေရှိယယေရှု၌ တစ်စုတစ်ဝေးတည်း ဖြစ်ခြင်း
      '39':
        title: ကဲ့ရဲ့သူများသည် မိမိတို့ကိုယ်ကို သန့်ရှင်းအောင် မလုပ်နိုင်ကြ
      '40':
        title: အရှင်၏ ပြဋ္ဌာန်းချက်များကို လိုက်နာဆောင်ရွက်ကြစို့
      '41':
        title: သတ်မှတ်ပေးထားသော အမှုတော်တာဝန်အတွင်း အစေခံကြစို့
      '42':
        title: တမန်တော်များက ခေါင်းဆောင်များကို စနစ်တကျ ခန့်အပ်ကြသည်
      '43':
        title: မောရှေသည် ဘုရားသခင်၏ အမိန့်အရ ယဇ်ပုရောဟိတ်များကို ရွေးချယ်သည်
      '44':
        title: အသိအမှတ်ပြုခံရသော အသက်ကြီးသူများကို မဖယ်ရှားကြနှင့်
      '45':
        title: ဘုရားသခင်ကို ဂုဏ်ပြုသောကြောင့် ဖြောင့်မတ်သူများ ဒုက္ခခံခဲ့ကြသည်
      '46':
        title: သန့်ရှင်းသော စံနမူနာများကို အတူတကွ ခိုင်မြဲစွာ ဆုပ်ကိုင်ကြစို့
      '47':
        title: သင်တို့ထံ ပေါလုရေးခဲ့သောစာကို သတိရကြလော့
      '48':
        title: ဖြောင့်မတ်ခြင်းတံခါးသို့ စင်ကြယ်စွာ ဝင်ကြလော့
      '49':
        title: ချစ်ခြင်းမေတ္တာသည် ကျွန်ုပ်တို့ကို ဘုရားသခင်နှင့် ပေါင်းစည်းပေးသည်
      '50':
        title: ချစ်ခြင်းမေတ္တာသည် ဘုရားသခင်ရွေးကောက်ထားသူတို့ကို ပြည့်စုံစေသည်
      '51':
        title: ကျွန်ုပ်တို့၏ အပြစ်များနှင့် အမှားများကို ဝန်ခံကြလော့
      '52':
        title: ဘုရားသခင်အား ချီးမွမ်းခြင်းယဇ် ပူဇော်ကြလော့
      '53':
        title: မောရှေသည် အစ္စရေးအတွက် ရဲဝံ့စွာ ကြားဝင်တောင်းလျှောက်ခဲ့သည်
      '54':
        title: ငြိမ်းချမ်းမှုကို မြတ်နိုးသော ခေါင်းဆောင်များသည် သိုးစုကို ဂုဏ်ပြုကြသည်
      '55':
        title: အမျိုးသမီးများသည် ရဲရင့်သောလုပ်ရပ်များကို လုပ်ဆောင်ခဲ့ကြသည်
      '56':
        title: လမ်းလွဲသူများ နာခံလာရန် ဆုတောင်းကြလော့
      '57':
        title: နှိမ့်ချခြင်းသည် ပညာရှိရာရောက်ကြောင်း ပညာက ကြေညာသည်
      '58':
        title: ဘုရားသခင်ကို ယုံကြည်ကိုးစားလျှင် ထာဝရလုံခြုံမည်
      '59':
        title: ဘုရားသခင်သည် ရွေးကောက်ထားသူတို့ကို စောင့်ရှောက်ရန် ဆုတောင်းကြလော့
      '60':
        title: အပြစ်များကို ခွင့်လွှတ်၍ ခြေလှမ်းများကို လမ်းညွှန်တော်မူပါ
      '61':
        title: ဘုရားသခင်သည် အုပ်စိုးသူတို့ကို ပညာဖြင့် လမ်းညွှန်တော်မူသည်
      '62':
        title: ယုံကြည်ခြင်းက သီလရှိစွာ အသက်ရှင်ရန် သွန်သင်သည်
      '63':
        title: နှိမ့်ချခြင်းသည် ငြိမ်းချမ်းမှုနှင့် ဝမ်းမြောက်မှုကို ဆောင်ကြဉ်းသည်
      '64':
        title: လူအပေါင်းတို့အား ယုံကြည်ခြင်းနှင့် ခံနိုင်ရည် ပေးသနားတော်မူပါ
      '65':
        title: ကိုယ်စားလှယ်များ သတင်းကောင်းနှင့်အတူ ပြန်လာကြသည်
  1 Enoch:
    display_name: ဧနောက် ပထမစောင်
    author: အမည်မသိ။ ရေလွှမ်းမိုးခြင်းမတိုင်မီခေတ် ဘိုးဘေးဧနောက် ရေးသားခဲ့သယောင် အမည်ခံထားသည်။ သီးခြားကဏ္ဍအမျိုးမျိုးကို စုစည်းထားသော ပေါင်းစပ်လက်ရာတစ်ခုဖြစ်သည်။
    audience: စကြဝဠာအတွင်းရှိ မကောင်းမှု၊ တရားစီရင်ခြင်းနှင့် ပြက္ခဒိန်အကြောင်း ဆင်ခြင်သုံးသပ်ကြသော ဂျူးပရလောကဗျာဒိတ်ဆိုင်ရာ အသိုင်းအဝိုင်းများအတွက် ဖြစ်သည်။ နောက်ပိုင်းတွင် အစောပိုင်းခရစ်ယာန်အသိုင်းအဝိုင်းများ၌လည်း ဖတ်ရှုခဲ့ကြသည်။
    date: ကဏ္ဍများကို ခန့်မှန်းခြေ ဘီစီ ၃ ရာစုမှ အေဒီ ၁ ရာစုအတွင်း စုစည်းခဲ့သည်။ အပြည့်အစုံကို ဂီအဲဇ် (အီသီယိုးပီးယား) ဘာသာဖြင့်သာ ထိန်းသိမ်းထားနိုင်ခဲ့သည်။
    chapters:
      '1':
        title: ဘုရားသခင်သည် ဖြောင့်မတ်သူနှင့် ဆိုးယုတ်သူတို့ကို တရားစီရင်တော်မူသည်
      '2':
        title: ကောင်းကင်နှင့် မြေကြီးတို့က သက်သေခံကြသည်
      '3':
        title: သစ်ပင်ဆယ့်လေးပင်သည် ဆောင်းရာသီကို ကြံ့ကြံ့ခံသည်
      '4':
        title: နွေရာသီနေက စနစ်တကျရှိသော တန်ခိုးကို ဖော်ပြသည်
      '5':
        title: ဖန်ဆင်းခြင်းသည် ဘုရားသခင်၏ အုပ်စိုးမှုအပေါ် သစ္စာစောင့်သိသည်
      '6':
        title: ကင်းစောင့်များသည် လူ့အမျိုးသမီးများကို ရယူရန် ဆင်းသက်လာကြသည်
      '7':
        title: ဧရာမသားစဉ်မြေးဆက်တို့က မြေကြီးကို ဖျက်ဆီးကြသည်
      '8':
        title: ကင်းစောင့်များသည် တားမြစ်ထားသော အသိပညာကို သင်ပေးကြသည်
      '9':
        title: ကောင်းကင်တမန်များက မြေကြီး၏ တရားမဲ့မှုကို တင်ပြကြသည်
      '10':
        title: ကျဆုံးသော ကင်းစောင့်များအပေါ် တရားစီရင်ခြင်း ကျရောက်လာသည်
      '11':
        title: ဘုရားသခင်သည် ကြွယ်ဝသော ကောင်းချီးများကို ကတိပြုတော်မူသည်
      '12':
        title: ဧနောက်သည် ကျဆုံးသော ကင်းစောင့်များကို ရင်ဆိုင်ပြောဆိုသည်
      '13':
        title: ဧနောက်သည် ကင်းစောင့်များအတွက် ကရုဏာရရန် ငြင်းဆိုသည်
      '14':
        title: ဧနောက်သည် ထင်ရှားပြသော ကောင်းကင်ဘုံဘုန်းအသရေကို မြင်သည်
      '15':
        title: ဘုရားသခင်သည် ကင်းစောင့်များအပေါ် စီရင်ချက်ကို ရှင်းပြတော်မူသည်
      '16':
        title: ကိုယ်ခန္ဓာမဲ့ ဝိညာဉ်များသည် မြေကြီးပေါ် လှည့်လည်ကြသည်
      '17':
        title: ဧနောက်သည် ကြောက်မက်ဖွယ် အခြားလောကနယ်ပယ်များသို့ လှည့်လည်ကြည့်ရှုသည်
      '18':
        title: ဖန်ဆင်းခြင်းစွမ်းအားများ၏ သိုလှောင်ရာများကို ပြသသည်
      '19':
        title: ကောင်းကင်တမန်များသည် နောက်ဆုံးတရားစီရင်ခြင်းကို ရင်ဆိုင်ရမည်
      '20':
        title: သန့်ရှင်းသော ကင်းစောင့်ကောင်းကင်တမန်များနှင့် သူတို့၏ နယ်ပယ်များ
      '21':
        title: ကြယ်ခုနစ်လုံးကို အနက်ဆုံးချောက်ထဲ၌ သံကြိုးခတ်ထားသည်
      '22':
        title: ဧနောက်သည် ဝိညာဉ်များ၏ လိုဏ်ဂူများကို မြင်သည်
      '23':
        title: ဧနောက်သည် မငြိမ်းနိုင်သောမီးကို မြင်သည်
      '24':
        title: ခမ်းနားသော တောင်ခုနစ်လုံး တောက်ပနေသည်
      '25':
        title: မွှေးကြိုင်သောအပင်ကို တရားစီရင်ချိန်အထိ တားမြစ်ထားသည်
      '26':
        title: ဧနောက်သည် သန့်ရှင်းမြင့်မြတ်သော အချက်အချာနေရာကို မြင်သည်
      '27':
        title: ဘုရားကို စော်ကားသူများအတွက် ကျိန်ခြင်းခံရသော ချိုင့်ဝှမ်းကို ဖော်ပြသည်
      '28':
        title: အရှေ့ဘက်တောင်များမှ ရေများ ပေါက်ထွက်စီးဆင်းသည်
      '29':
        title: ဧနောက်သည် တရားစီရင်ခြင်းဆိုင်ရာ သစ်ပင်များကို မြင်သည်
      '30':
        title: မကုန်ခန်းနိုင်သော ရေများဖြင့် ပြည့်နေသည့် ချိုင့်ဝှမ်း
      '31':
        title: တောင်များပေါ်၌ သန့်ရှင်းသော ရနံ့များ ပွင့်လန်းသည်
      '32':
        title: ဖြောင့်မတ်ခြင်းဥယျာဉ်ကို ဖော်ပြသည်
      '33':
        title: ကောင်းကင်တံခါးများ၌ ကြယ်တို့၏အမည်များကို ဖော်ပြသည်
      '34':
        title: ကောင်းကင်၏ ရာသီဥတုယန္တရားကို ဖွင့်ပြသည်
      '35':
        title: အနောက်ဘက်တံခါးများသည် အရှေ့ဘက်တံခါးများနှင့် ကိုက်ညီသည်
      '36':
        title: ဧနောက်သည် ကောင်းကင်တံခါးများကို မြင်သည်
      '37':
        title: ဧနောက်သည် ပညာ၏ ဖွင့်ပြချက်ကို ကြေညာသည်
      '38':
        title: ဖြောင့်မတ်သူများ စုဝေးပြီး အပြစ်သားများ တရားစီရင်ခံရသည်
      '39':
        title: ရွေးကောက်ထားသော သားသမီးများ ကောင်းကင်မှ ဆင်းသက်လာကြသည်
      '40':
        title: ဧနောက်သည် ကောင်းကင်ဗိုလ်ခြေကို မြင်သည်
      '41':
        title: ကောင်းကင်ဘဏ္ဍာတိုက်များနှင့် ဖုံးကွယ်ထားသော နိယာမများ
      '42':
        title: ပညာသည် နေစရာကို အချည်းနှီး ရှာဖွေသည်
      '43':
        title: ဧနောက်သည် ကောင်းကင်ဆိုင်ရာ ပုံဥပမာကို မြင်သည်
      '44':
        title: လျှပ်စီးကြယ်များကို တန်ခိုးဖြင့် ချည်နှောင်ထားသည်
      '45':
        title: ငြင်းပယ်သူများ တရားစီရင်ခံရမည့် ဒုတိယပုံဥပမာ
      '46':
        title: ဧနောက်သည် လူသား၏သားကို မြင်သည်
      '47':
        title: ဖြောင့်မတ်သူတို့၏ သွေးက ကောင်းကင်ဘုံ၌ တုံ့ပြန်သည်
      '48':
        title: ဖြောင့်မတ်ခြင်းစမ်းရေသည် ဝန်းရံလျက်ရှိသည်
      '49':
        title: ရွေးကောက်ခံရသူသည် ဖုံးကွယ်ထားသောအရာများကို တရားစီရင်သည်
      '50':
        title: သန့်ရှင်းသူတို့ အောင်နိုင်ပြီး အပြစ်သားတို့ မကြာမီ ပျက်စီးမည်
      '51':
        title: ရွေးကောက်ခံရသူသည် ဖုံးကွယ်ထားသော ပညာကို ဖော်ပြသည်
      '52':
        title: ဧနောက်သည် သတ္တုတောင်များကို မြင်သည်
      '53':
        title: အပြစ်သားတို့၏ ပူဇော်သက္ကာများဖြင့် ပြည့်နေသော ချိုင့်ဝှမ်း
      '54':
        title: ရှင်ဘုရင်များကို မီးလောင်နေသော ချိုင့်ဝှမ်းထဲ ပစ်ချသည်
      '55':
        title: ရှေးကာလမှ စိုးမိုးတော်မူသောအရှင်က နောက်တစ်ဖန် မဖြစ်စေရဟု ကျိန်ဆိုသည်
      '56':
        title: အပြစ်ဒဏ်ပေးသော ကောင်းကင်တမန်များက အာဇာဇေလ၏ အပေါင်းအပါတို့ကို ချည်နှောင်သည်
      '57':
        title: စကြဝဠာဆိုင်ရာ ဆူညံတုန်လှုပ်မှုနှင့် သန့်ရှင်းသော ဝတ်ပြုခြင်း
      '58':
        title: ဧနောက်သည် ဖြောင့်မတ်သူတို့ကို ကောင်းချီးပေးသည်
      '59':
        title: ဧနောက်သည် မိုးခြိမ်းသံ၏ လျှို့ဝှက်ချက်များကို မြင်သည်
      '60':
        title: အမြင့်ဆုံးကောင်းကင် တုန်လှုပ်သော်လည်း ကရုဏာတော် တည်မြဲသည်
      '61':
        title: ကောင်းကင်တမန်များသည် ဖြောင့်မတ်သူတို့အတွက် တိုင်းတာကြသည်
      '62':
        title: ရာဇပလ္လင်ပေါ် စံမြန်းသော လူသား၏သားသည် တရားစီရင်သည်
      '63':
        title: ရှင်ဘုရင်များသည် သခင်ထံ ခွင့်လွှတ်မှု တောင်းပန်ကြသည်
      '64':
        title: ဧနောက်သည် ဖုံးကွယ်နေသော အပြစ်သားများကို မြင်သည်
      '65':
        title: နောဧသည် မြေကြီးအတွက် ငိုကြွေးသည်
      '66':
        title: ကောင်းကင်တမန်များသည် အမိန့်တော်အရ ရေလွှမ်းမိုးရာရေများကို ထိန်းထားကြသည်
      '67':
        title: နောဧသည် ဘုရားသခင်၏ ကတိတော်ကို ကြားရသည်
      '68':
        title: ဧနောက်သည် ဖုံးကွယ်ထားသောအရာများ၏ ဖွင့်ပြချက်ကို လက်ခံရရှိသည်
      '69':
        title: ကျဆုံးသော ကောင်းကင်တမန်များ၏ အမည်များကို ဖော်ပြ၍ တရားစီရင်သည်
      '70':
        title: ဧနောက်ကို ကောင်းကင်နန်းတော်သို့ ပြောင်းရွှေ့ပို့ဆောင်သည်
      '71':
        title: ဧနောက်သည် ကောင်းကင်ဆိုင်ရာ လျှို့ဝှက်ချက်များကို မြင်သည်
      '72':
        title: ဥရေလသည် နေ၏ စနစ်တကျသတ်မှတ်ထားသော လမ်းကြောင်းကို ဖော်ပြသည်
      '73':
        title: လ၏ အဆင့်များကို အမိန့်တော်ဖြင့် အုပ်ချုပ်ထားသည်
      '74':
        title: နေနှင့်လ၏ တိကျသော လည်ပတ်စည်းချက်များ
      '75':
        title: စကြဝဠာဆိုင်ရာ ခေါင်းဆောင်များသည် သတ်မှတ်ထားသော အမှုကို အစဉ်ထမ်းဆောင်ကြသည်
      '76':
        title: ဧနောက်သည် မြေကြီးပေါ်ရှိ လေများကို မြင်သည်
      '77':
        title: ဧနောက်သည် လေလေးမျိုးကို မြင်သည်
      '78':
        title: အလင်းကြီးများ၏ အမည်များကို ဖော်ပြသည်
      '79':
        title: ဧနောက်သည် ကောင်းကင်ဆိုင်ရာ စီရင်ထုံးအားလုံးကို ဖော်ပြသည်
      '80':
