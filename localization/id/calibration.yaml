  summary: Payload perlu revisi kecil untuk ketepatan makna dan keluwesan bahasa Indonesia, terutama pada catatan Yohanes 1:1, perluasan yang tidak ada dalam Roma 3:25, serta beberapa frasa metadata dan SPOB.
  issues:
  - Catatan Yohanes 1:1 salah menerjemahkan alternatif “what God was, the Word was”; terjemahan yang tepat ialah “apa adanya Allah, demikianlah Firman itu,” bukan “apa yang ada pada Allah, ada pada Firman.”
  - Roma 3:25 menambahkan “tanpa menghukumnya,” yang tidak terdapat dalam teks SPOB; frasa itu perlu dihapus.
