book_localizations:
- source_title: Genesis
  title: Kejadian
  author: Anonim; secara tradisional dianggap ditulis oleh Musa. Kajian modern memandang kitab ini memiliki sejarah penyusunan yang panjang, dengan berbagai sumber yang kemudian disunting menjadi satu.
  audience: Israel dalam identitasnya sebagai umat perjanjian, yang kisah asal-usulnya berakar pada penciptaan, pemilihan, dan janji Allah.
  date: Disusun selama berabad-abad; mencapai bentuk akhirnya sekitar abad ke-6–5 SM, pada masa atau setelah pembuangan ke Babel.
  summary: Kejadian mengisahkan penciptaan, pemberontakan dan tercerai-berainya umat manusia, serta keluarga Abraham, Ishak, Yakub, dan Yusuf, yang melaluinya janji-janji perjanjian Allah kepada Israel mulai terwujud.
- source_title: John
  title: Yohanes
  author: Anonim; tradisi mengaitkannya dengan Rasul Yohanes atau “Murid yang Dikasihi.”
  audience: Sebuah komunitas Kristen yang mengalami ketegangan dengan Yudaisme sinagoge dan terbentuk di sekitar kesaksian Murid yang Dikasihi.
  date: Sekitar tahun 90–110 M.
  summary: Yohanes memperkenalkan Yesus sebagai Firman kekal yang menyatakan Bapa, memberikan hidup melalui kepercayaan kepada-Nya, dan dimuliakan melalui tanda-tanda, kematian, serta kebangkitan-Nya.
- source_title: Gospel of Thomas
  title: Injil Tomas
  author: Anonim; bagian pembukanya mengaitkan kumpulan perkataan ini dengan “Didimos Yudas Tomas.” Naskah lengkapnya hanya bertahan dalam terjemahan Koptik dari abad ke-4 yang ditemukan di Nag Hammadi (NHC II,2), sementara tiga fragmen Yunani ditemukan di Oxyrhynchus.
  audience: Pembaca Kristen yang dibentuk oleh tradisi hikmat Suriah dan pemikiran proto-Gnostik, serta diarahkan kepada pengenalan diri yang bersifat esoteris melalui perkataan-perkataan Yesus.
  date: Naskah asli berbahasa Yunani kemungkinan berasal dari sekitar tahun 50–140 M; manuskrip Koptiknya dari sekitar tahun 340 M.
  summary: Injil Tomas merupakan kumpulan perkataan yang dikaitkan dengan Yesus. Kitab ini tidak memiliki kisah yang berkesinambungan dan berulang kali mengajak pembaca menemukan makna perkataan-perkataan tersebut.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Kejadian 1:1
  text: Ketika Allah mulai menciptakan langit dan bumi[a]—
  translator_note: '[a] Terjemahan tradisional memperlakukan bagian ini sebagai kalimat lengkap: “Pada mulanya, Allah menciptakan langit dan bumi.” Namun, bahasa Ibraninya lebih wajar dipahami sebagai pengantar bagi bagian sesudahnya, dengan tindakan utama, “Allah berfirman,” pada ayat 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Pengkhotbah 1:2
  text: “Uap dari segala uap[a],” kata Qohelet[b]. “Segala sesuatu adalah uap—singkat, mustahil digenggam, dan sering kali tidak seperti yang kita harapkan.”
  translator_note: '[a] Kata Ibrani hevel secara harfiah berarti napas atau uap. Di sepanjang Kitab Pengkhotbah, kata ini menggambarkan sesuatu yang cepat berlalu, tidak dapat digenggam atau dipahami sepenuhnya, dan sering kali ternyata berbeda dari yang diharapkan orang. “Uap” mempertahankan gambaran itu tanpa menyatakan bahwa tidak ada sesuatu pun yang bermakna. Kemungkinan terjemahan lain mencakup “napas,” “sekadar napas,” dan “fana.” [b] Qohelet adalah nama atau gelar Ibrani penulis kitab ini. Kata tersebut sering diterjemahkan sebagai “Sang Guru” atau “Sang Pengkhotbah,” tetapi di sini bentuk “Qohelet” dipertahankan agar semua kemungkinan maknanya tetap terbuka tanpa mengutamakan satu penafsiran.'
- source_path: nt/john/001/001.yaml
  reference: Yohanes 1:1
  text: Pada mulanya[b], Firman sudah ada. Firman itu bersama Allah, dan Firman itu adalah Allah.[a]
  translator_note: '[a] Atau, “Firman itu bersifat ilahi,” atau, “apa adanya Allah, demikianlah Firman itu.” Susunan kata Yunaninya menegaskan bahwa Firman sepenuhnya adalah Allah, sekaligus membedakan Firman dari Allah dalam klausa sebelumnya. [b] Pembukaan ini menggemakan Kejadian 1:1 dan menghubungkan Firman dengan awal penciptaan. Ungkapan “sudah ada” menunjukkan bahwa Firman telah ada ketika permulaan itu tiba, bukan baru menjadi ada pada saat itu; kemungkinan terjemahan lain ialah “ada.”'
- source_path: nt/romans/003/025.yaml
  reference: Roma 3:25
  text: Allah menampilkan Dia sebagai pengorbanan pendamaian[a] melalui iman kepada darah-Nya[b]. Allah melakukan ini untuk menunjukkan kebenaran-Nya[c], sebab Ia telah membiarkan dosa-dosa yang dilakukan pada masa lampau berlalu.
  translator_note: '[a] Atau, “korban yang meredakan murka”; atau, “tutup pendamaian,” yaitu penutup emas pada Tabut Perjanjian, tempat darah pendamaian dipercikkan dalam Perjanjian Lama. [b] Atau, “melalui iman, oleh darah-Nya.” [c] Atau, “keadilan.”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Petrus 1:13
  text: Karena itu, siapkanlah pikiran kalian untuk bertindak.[a] Hendaklah kalian sepenuhnya berpikiran jernih, dan letakkanlah seluruh pengharapan kalian pada anugerah yang sedang dibawa kepada kalian ketika Yesus Sang Mesias dinyatakan.[b]
  translator_note: '[a] Secara harfiah, bahasa Yunaninya mengatakan, “ikatlah pinggang pikiran kalian.” Gambarannya ialah mengumpulkan pakaian panjang dan mengikatnya pada pinggang agar siap bertindak. [b] Kata Yunani yang diterjemahkan dengan “sepenuhnya” dan “seluruh” dapat berkaitan dengan kejernihan pikiran, dengan tindakan menaruh pengharapan, atau mungkin dengan keduanya.'
