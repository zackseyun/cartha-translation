payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Hakikat Para Penguasa
      author: Anonim. Penulis menafsirkan Kitab Kejadian melalui mitos pewahyuan tentang para penguasa; karya ini tidak dapat dikaitkan secara pasti dengan seorang guru bernama tertentu.
      audience: Umat Kristen dalam lingkungan Setian atau lingkungan terkait yang membaca Kitab Kejadian sebagai konflik antara para penguasa kosmis yang tidak tahu, hikmat ilahi, dan asal-usul rohani manusia.
      date: Umumnya diperkirakan berasal dari abad ke-3 M; tersimpan dalam sebuah salinan Koptik dari abad ke-4 di Kodeks Nag Hammadi II.
    On the Origin of the World:
      display_name: Tentang Asal-Usul Dunia
      author: Anonim. Karya ini memadukan dan mengolah kembali sejumlah tradisi Yahudi, Kristen, Platonis, dan mitologis tanpa menyebut nama penyusunnya.
      audience: Para pembaca dalam lingkungan Kristen bercorak Gnostik yang mencari kisah tandingan tentang penciptaan, para penguasa kosmis, Sofia, Adam dan Hawa, serta nasib akhir dunia.
      date: Biasanya diperkirakan berasal dari abad ke-3 M, meskipun mungkin didasari bahan-bahan yang lebih awal; terutama tersimpan dalam sejumlah naskah Koptik dari abad ke-4.
    Sophia of Jesus Christ:
      display_name: Hikmat Yesus Kristus
      author: Anonim. Penulis mengadaptasi bahan yang juga dikenal dari Eugnostos menjadi dialog pascakebangkitan antara Yesus dan murid-muridnya.
      audience: Umat Kristen yang tertarik pada hikmat yang diwahyukan tentang Allah yang transenden, tatanan alam surgawi, serta asal-usul dan keselamatan jiwa.
      date: Sering diperkirakan berasal dari akhir abad ke-2 atau abad ke-3 M; tersimpan dalam salinan-salinan Koptik dari Nag Hammadi dan Kodeks Berlin.
    Gospel of the Egyptians:
      display_name: Injil Orang Mesir
      author: Anonim. Karya Nag Hammadi ini, yang juga disebut Kitab Suci Roh Agung yang Tak Terlihat, berbeda dari Injil Orang Mesir berbahasa Yunani yang lebih awal dan hanya dikenal melalui kutipan-kutipan.
      audience: Komunitas Kristen Setian yang menggunakan mitos yang padat, nama-nama suci, gambaran baptisan, dan pujian berbentuk kidung untuk mengungkapkan jati diri serta pembebasan rohani.
      date: Biasanya diperkirakan berasal dari abad ke-2 atau ke-3 M; dua salinan Koptik masih bertahan dalam kodeks-kodeks Nag Hammadi dari abad ke-4.
    Letter of Peter to Philip:
      display_name: Surat Petrus kepada Filipus
      author: Anonim. Surat pembuka yang singkat dan pewahyuan sesudahnya secara pseudonim dikaitkan dengan Petrus dan Filipus, bukan dapat dipastikan ditulis oleh salah satu dari kedua rasul itu.
      audience: Umat Kristen yang mencari kewibawaan rasuli bagi ajaran tentang Sang Juru Selamat, kuasa-kuasa yang memusuhi, penderitaan, misi, dan pemulihan para murid.
      date: Umumnya diperkirakan berasal dari akhir abad ke-2 atau awal abad ke-3 M; tersimpan dalam sebuah salinan Nag Hammadi dari abad ke-4 dan sebuah naskah Koptik yang lebih kemudian.
    Gospel of Judas:
      display_name: Injil Yudas
      author: Anonim. Judulnya mengaitkan kisah ini dengan Yudas, tetapi karya tersebut tidak membuktikan bahwa Yudas Iskariot adalah penulis historisnya.
      audience: Sebuah kelompok Kristen yang mengkritik praktik pengurbanan dan praktik gerejawi kelompok-kelompok saingan, dengan menggunakan dialog pewahyuan dan kosmologi bercorak Setian untuk menafsirkan kembali Yudas dan kematian Yesus.
      date: Biasanya diperkirakan berasal dari pertengahan atau akhir abad ke-2 M; Ireneus mengenal sebuah Injil Yudas sekitar tahun 180, dan salinan Koptik yang masih bertahan mungkin berasal dari abad ke-3 atau ke-4.
    Protoevangelium of James:
      display_name: Protoinjil Yakobus
      author: Anonim. Narator mengaku sebagai Yakobus, tetapi karya ini bersifat pseudonim dan tidak ditulis oleh Yakobus, saudara Yesus.
      audience: Umat Kristen yang tertarik pada kelahiran dan masa pertumbuhan Maria, kemurniannya yang kekal, kelahiran Yesus, serta jawaban berbentuk kisah atas pertanyaan-pertanyaan yang tidak dijawab oleh Matius dan Lukas.
      date: Umumnya diperkirakan berasal dari paruh kedua abad ke-2 M; karya ini masih bertahan dalam banyak manuskrip Yunani yang lebih kemudian dan terjemahan-terjemahan kuno.
