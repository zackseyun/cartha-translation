payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 Korintus
      author: Paulus, bersama Sostenes.
      audience: Jemaat Kristen di Korintus yang terpecah oleh perselisihan.
      date: Sekitar 53–55 M, ditulis dari Efesus.
    2 Corinthians:
      display_name: 2 Korintus
      author: Paulus, bersama Timotius.
      audience: Jemaat Korintus, setelah konflik yang menyakitkan.
      date: Sekitar 55–56 M.
    Galatians:
      display_name: Galatia
      author: Paulus.
      audience: Jemaat-jemaat Kristen di Galatia (Anatolia tengah) yang mendapat tekanan untuk menerima sunat dan menaati Taurat.
      date: Sekitar 48–55 M (diperdebatkan).
    Ephesians:
      display_name: Efesus
      author: Paulus, atau seorang murid dekat yang menulis atas nama Paulus (diperdebatkan).
      audience: Pembaca Kristen secara umum di Asia; nama tempat "Efesus" tidak terdapat dalam naskah-naskah tertua.
      date: Sekitar dasawarsa 60-an M jika ditulis oleh Paulus; sekitar dasawarsa 80-an–90-an M jika pseudonim.
    Philippians:
      display_name: Filipi
      author: Paulus, bersama Timotius.
      audience: Jemaat Kristen di Filipi, sebuah koloni Romawi di Makedonia.
      date: Sekitar 60–62 M, ditulis dari penjara.
    Colossians:
      display_name: Kolose
      author: Paulus, bersama Timotius—atau seorang murid dekat yang menulis atas nama Paulus (diperdebatkan).
      audience: Orang-orang Kristen di Kolose, di Lembah Likus, yang menghadapi ajaran sinkretis.
      date: Sekitar 60–62 M jika ditulis oleh Paulus; lebih kemudian jika pseudonim.
    1 Thessalonians:
      display_name: 1 Tesalonika
      author: Paulus, bersama Silvanus dan Timotius.
      audience: Jemaat Kristen yang masih muda di Tesalonika, yang menghadapi penganiayaan.
      date: Sekitar 50–51 M—kemungkinan besar surat Paulus tertua yang masih ada.
    2 Thessalonians:
      display_name: 2 Tesalonika
      author: Paulus (diperdebatkan; beberapa ahli berpendapat bahwa surat ini ditulis atas nama Paulus).
      audience: Jemaat Tesalonika, untuk menanggapi kebingungan tentang akhir zaman.
      date: Sekitar 51 M jika ditulis oleh Paulus.
    1 Timothy:
      display_name: 1 Timotius
      author: Paulus, atau seorang murid yang menulis atas nama Paulus (Surat-Surat Pastoral secara luas dianggap pseudonim).
      audience: Timotius sebagai utusan Paulus di Efesus; sebuah pedoman bagi tata gereja pada masa kemudian.
      date: Sekitar pertengahan dasawarsa 60-an M jika ditulis oleh Paulus; sekitar 90–110 M jika pseudonim.
    2 Timothy:
      display_name: 2 Timotius
      author: Paulus, atau seorang murid yang menulis atas nama Paulus.
      audience: Timotius—disajikan sebagai pesan perpisahan Paulus dari penjara.
      date: Sekitar pertengahan dasawarsa 60-an M jika ditulis oleh Paulus; sekitar 90–110 M jika pseudonim.
    Titus:
      display_name: Titus
      author: Paulus, atau seorang murid yang menulis atas nama Paulus.
      audience: Titus sebagai utusan Paulus di Kreta.
      date: Sekitar pertengahan dasawarsa 60-an M jika ditulis oleh Paulus; sekitar 90–110 M jika pseudonim.
    Philemon:
      display_name: Filemon
      author: Paulus, bersama Timotius.
      audience: Filemon, seorang pemilik budak Kristen, mengenai Onesimus, budaknya yang melarikan diri.
      date: Sekitar 60–62 M.
    Hebrews:
      display_name: Ibrani
      author: Tidak diketahui. Tradisi menyebut Paulus, Apolos, Barnabas, Priskila, dan tokoh-tokoh lain; tidak ada usulan yang diterima secara umum.
      audience: Orang-orang Kristen Yahudi berbahasa Yunani yang tergoda untuk meninggalkan pengakuan iman Kristen mereka.
      date: Sekitar 60–95 M.
