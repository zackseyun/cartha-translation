    Numbers:
      display_name: Bilangan
      author: Anonim; secara tradisional dikaitkan dengan Musa.
      audience: Bangsa Israel dalam perjalanan antara Mesir dan tanah yang dijanjikan—angkatan padang gurun, serta para pembaca pada masa kemudian yang belajar dari kegagalan mereka.
      date: Lapisan-lapisan penyusunan berasal dari akhir zaman kerajaan hingga masa pascapembuangan (sekitar abad ke-7–5 SM).
    Deuteronomy:
      display_name: Ulangan
      author: Anonim; disajikan sebagai pidato-pidato perpisahan Musa. Kajian modern menempatkan inti kitab ini pada reformasi akhir abad ke-7 SM di bawah pemerintahan Yosia.
      audience: Bangsa Israel yang bersiap memasuki tanah itu—dan, pada masa kemudian, orang-orang buangan yang bertanya bagaimana hidup dengan setia tanpa bait suci atau raja.
      date: Bagian inti berasal dari sekitar akhir abad ke-7 SM; mencapai bentuk akhirnya pada masa pembuangan.
    Joshua:
      display_name: Yosua
      author: Anonim; bagian dari Sejarah Deuteronomistis.
      audience: Bangsa Israel pada masa kerajaan dan pembuangan, yang merenungkan penaklukan, perjanjian, dan makna tanah itu.
      date: Disusun sekitar abad ke-7–6 SM dari tradisi-tradisi yang lebih tua.
