review:
  verdict: revise
  review_summary: Terjemahan lengkap dan pada umumnya setia. Beberapa istilah serta frasa antarmuka telah diperhalus agar lebih alami dan lebih tepat terhadap sumber, khususnya “preloaded”, judul tradisional Testaments of the Twelve Patriarchs, dan contoh pencarian.
  issues:
  - Mengganti frasa kaku “ringkasan yang telah dimuat sebelumnya” dengan “ringkasan pramuat”.
  - Memperbaiki nama bagian menjadi “Wasiat Kedua Belas Patriarkh”, yang lebih tepat untuk Testaments of the Twelve Patriarchs.
  - Menyesuaikan contoh kutipan pencarian agar tidak menambahkan “lesu” yang tidak ada dalam sumber.
