payload:
  book_metadata:
    Joel:
      display_name: Yoel
      author: Yoel bin Petuel.
      audience: Yehuda pascapembuangan yang menanggapi wabah belalang sebagai tanda Hari TUHAN.
      date: Kemungkinan sekitar abad ke-5–4 SM.
    Amos:
      display_name: Amos
      author: Amos dari Tekoa, seorang gembala dari Yehuda yang berkhotbah di kerajaan utara.
      audience: Israel Utara pada masa kemakmuran dan ketidakadilan di bawah pemerintahan Yerobeam II.
      date: Sekitar 760–750 SM.
    Obadiah:
      display_name: Obaja
      author: Obaja.
      audience: Yehuda setelah Edom mengkhianati Yerusalem—sebuah nubuat tentang kejatuhan Edom.
      date: Tidak lama setelah 586 SM.
    Jonah:
      display_name: Yunus
      author: Tidak diketahui; tokoh utamanya ialah Yunus bin Amitai.
      audience: Israel pascapembuangan—sebuah teguran satiris terhadap sikap etnis yang tertutup dan penegasan tentang belas kasihan Allah kepada orang luar.
      date: Kemungkinan sekitar abad ke-5–4 SM.
    Micah:
      display_name: Mikha
      author: Mikha dari Moresyet.
      audience: Yehuda pada akhir abad ke-8 SM, khususnya kaum miskin pedesaan yang berhadapan dengan kalangan elite perkotaan.
      date: Sekitar 740–700 SM.
    Nahum:
      display_name: Nahum
      author: Nahum dari Elkos.
      audience: Yehuda yang merayakan kejatuhan Niniwe yang segera tiba.
      date: Tidak lama sebelum 612 SM.
    Habakkuk:
      display_name: Habakuk
      author: Habakuk.
      audience: Yehuda yang menghadapi kebangkitan Babel—dialog seorang nabi dengan Allah tentang keadilan.
      date: Sekitar akhir abad ke-7 SM.
    Zephaniah:
      display_name: Zefanya
      author: Zefanya bin Kusyi.
      audience: Yehuda di bawah pemerintahan Yosia, menjelang pembaruan yang dilakukannya.
      date: Sekitar 640–609 SM.
    Haggai:
      display_name: Hagai
      author: Hagai.
      audience: Orang-orang yang kembali dari pembuangan dan membangun kembali Bait Allah di bawah pemerintahan Darius.
      date: 520 SM.
    Zechariah:
      display_name: Zakharia
      author: Zakharia bin Berekhya; pasal 9–14 kemungkinan ditulis oleh orang lain pada masa kemudian.
      audience: Orang-orang yang kembali dari pembuangan dan membangun kembali Bait Allah, serta komunitas-komunitas pascapembuangan pada masa kemudian.
      date: Pasal 1–8 sekitar 520–518 SM; pasal 9–14 mungkin sekitar satu abad kemudian.
    Malachi:
      display_name: Maleakhi
      author: Tidak diketahui; “Maleakhi” berarti “utusanku”.
      audience: Yehuda pascapembuangan yang mulai lalai dalam ibadah dan kesetiaan di bawah pemerintahan Persia.
      date: Sekitar pertengahan abad ke-5 SM.
    Matthew:
      display_name: Matius
      author: Tidak diketahui; tradisi mengaitkannya dengan Rasul Matius. Kajian modern memandang penulisnya sebagai seorang Yahudi pengikut Kristus yang berbahasa Yunani dan menggunakan Markus serta sumber yang menyerupai Q.
      audience: Sebuah komunitas Yahudi pengikut Kristus yang bergumul dengan kesinambungan dan ketidaksinambungan hubungannya dengan Yudaisme sinagoge.
      date: Sekitar 80–90 M.
    Mark:
      display_name: Markus
      author: Tidak diketahui; tradisi mengaitkannya dengan Yohanes Markus, rekan seperjalanan Petrus.
      audience: Sebuah komunitas pengikut Kristus berbahasa Yunani, mungkin di Roma, yang sedang menghadapi atau berada di bawah ancaman penganiayaan.
      date: Sekitar 65–75 M, pada masa Perang Yahudi dan penghancuran Bait Allah.
