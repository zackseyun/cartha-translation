  book_metadata:
    Polycarp to the Philippians:
      display_name: Polikarpus kepada Jemaat di Filipi
      author: Polikarpus, uskup Smirna. Sebagian ahli memahami teks yang sampai kepada kita sebagai gabungan bahan yang dikirim pada lebih dari satu kesempatan.
      audience: Jemaat Kristen di Filipi, yang meminta surat-surat Ignatius dan menerima nasihat tentang iman, perilaku, kepemimpinan, uang, dan ketekunan.
      date: Awal hingga pertengahan abad ke-2 M; setidaknya sebagian isinya berkaitan erat dengan perjalanan Ignatius, sedangkan pandangan bahwa surat ini merupakan gabungan memungkinkan adanya bagian yang berasal dari masa agak kemudian.
    Martyrdom of Polycarp:
      display_name: Kemartiran Polikarpus
      author: Para anggota jemaat di Smirna yang tidak diketahui namanya, menulis atas nama komunitas tersebut; catatan penutup tentang penerusan teks mencerminkan penyalinan dan peredarannya pada masa kemudian.
      audience: Jemaat di Filomelium dan persekutuan Kristen yang lebih luas, yang menerima kisah tentang penangkapan, pengadilan, kematian, dan ketabahan Polikarpus yang patut diteladani.
      date: Ditulis setelah kematian Polikarpus, biasanya diperkirakan berasal dari pertengahan atau akhir abad ke-2 M; baik tahun persis kemartirannya maupun bentuk akhir dokumen ini masih diperdebatkan.
    Epistle to Diognetus:
      display_name: Surat kepada Diognetus
      author: Tidak diketahui. Penulis menyebut dirinya seorang murid atau pelajar, tetapi baik dirinya maupun Diognetus yang disapa dalam surat ini tidak dapat diidentifikasi dengan pasti.
      audience: Seorang penanya non-Kristen yang terpelajar—beserta pembaca lain seperti dia—yang bertanya tentang ibadah, etika, identitas sosial, kasih, dan kesan bahwa iman Kristen itu baru.
      date: Sering diperkirakan berasal dari akhir abad ke-2 atau awal abad ke-3 M, meskipun berbagai usulan tanggal sangat beragam; dua bab terakhir mungkin berasal dari karya yang berbeda.
    Fragments of Papias:
      display_name: Fragmen-Fragmen Papias
      author: Papias, uskup Hierapolis, penulis karya lima buku yang telah hilang, Penjelasan tentang Perkataan-Perkataan Tuhan; kumpulan yang masih ada terdiri atas kutipan dan laporan yang dilestarikan oleh para penulis kemudian.
      audience: Umat Kristen awal yang mencari ajaran-ajaran yang diingat tentang Yesus dan para rasul, yang dihimpun melalui rangkaian kesaksian lisan dan penafsiran dari orang-orang yang disebutkan namanya.
      date: Karya Papias biasanya diperkirakan berasal dari awal abad ke-2 M, sering kali sekitar 110–130 M; fragmen-fragmen yang masih ada ditemukan dalam tulisan para penulis dari abad ke-2 dan sesudahnya.
