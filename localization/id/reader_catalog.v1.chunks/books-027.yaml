review:
  verdict: revise
  review_summary: Terjemahan lengkap dan pada umumnya setia. Beberapa judul diperhalus agar lebih tepat mengikuti makna sumber, khususnya rujukan kepada pemerintahan Yohanes dan penyangkalan yang didesak Niketes.
  issues:
  - 'Fragments of Papias 1: "John''s Reign" diterjemahkan lebih tepat sebagai "pemerintahan Yohanes", bukan sekadar "masa Yohanes".'
  - 'Martyrdom of Polycarp 18: Judul diperjelas supaya tindakan penyangkalan yang didesak Niketes dan subjek pejabatnya tetap tercakup.'
