      display_name: Ezra
      author: Anonim; mungkin ditulis oleh penulis yang sama dengan kitab Tawarikh.
      audience: Orang-orang yang kembali dari pembuangan dan membangun kembali Yerusalem di bawah pemerintahan Persia.
      date: Sekitar pertengahan abad ke-5 hingga abad ke-4 SM.
    Nehemiah:
      display_name: Nehemia
      author: Anonim; memuat memoar orang pertama yang dikaitkan dengan Nehemia.
      audience: Orang-orang yang kembali dari pembuangan, membangun kembali tembok Yerusalem, dan memperbarui perjanjian di bawah pemerintahan Persia.
      date: Sekitar pertengahan abad ke-5 hingga abad ke-4 SM.
    Esther:
      display_name: Ester
      author: Anonim.
      audience: Orang Yahudi di diaspora yang hidup di bawah pemerintahan asing, terutama di Persia.
      date: Sekitar akhir zaman Persia atau awal zaman Helenistis (abad ke-4–ke-3 SM).
    Job:
      display_name: Ayub
      author: Anonim.
      audience: Orang Israel yang bergumul dengan penderitaan orang tak bersalah dan keadilan ilahi.
      date: Menurut pandangan umum dalam kajian tradisi hikmat, kitab ini berasal dari sekitar abad ke-6–ke-4 SM dan memanfaatkan bahan cerita rakyat yang lebih tua.
    Psalms:
      display_name: Mazmur
      author: Ditulis oleh banyak pengarang selama berabad-abad; keterangan judul menyebut Daud, Asaf, Korah, Salomo, Musa, dan yang lainnya.
      audience: Israel dan jemaat di Bait Allah dalam ibadah—serta setiap komunitas doa dan ratapan pada masa-masa kemudian.
      date: Disusun sekitar abad ke-10–ke-3 SM; bentuk akhirnya dihimpun pada masa pascapembuangan.
