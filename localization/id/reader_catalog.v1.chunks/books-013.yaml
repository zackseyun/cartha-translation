payload:
  book_metadata:
    James:
      display_name: Yakobus
      author: Secara tradisional Yakobus, saudara Yesus; para ahli modern terbagi antara atribusi autentik dan pseudonim.
      audience: Jemaat-jemaat Kristen Yahudi di perantauan.
      date: Sekitar tahun 50-an–60-an M jika autentik; sekitar akhir abad pertama M jika pseudonim.
    1 Peter:
      display_name: 1 Petrus
      author: Secara tradisional Rasul Petrus, dengan Silwanus sebagai juru tulis; sebagian ahli menganggapnya pseudonim.
      audience: Umat Kristen di Asia Kecil Romawi yang mengalami permusuhan sosial.
      date: Sekitar tahun 60-an M jika berasal dari Petrus; sekitar tahun 70-an–90-an M jika pseudonim.
    2 Peter:
      display_name: 2 Petrus
      author: Secara tradisional Petrus; banyak ahli modern menganggapnya pseudonim.
      audience: Umat Kristen yang menghadapi para pencemooh yang menyangkal parusia.
      date: Sekitar awal abad kedua M.
    1 John:
      display_name: 1 Yohanes
      author: Anonim; secara tradisional Rasul Yohanes atau penatua Yohanes.
      audience: Komunitas Yohanes setelah perpecahan, yang menentukan siapa yang termasuk di dalamnya.
      date: Sekitar tahun 90–110 M.
    2 John:
      display_name: 2 Yohanes
      author: “Sang penatua.”
      audience: Sebuah jemaat Kristen tertentu (“ibu yang terpilih”) yang diperingatkan terhadap pengajar palsu.
      date: Sekitar tahun 90–110 M.
    3 John:
      display_name: 3 Yohanes
      author: “Sang penatua.”
      audience: Gayus, seorang pemimpin yang menampung para misionaris keliling.
      date: Sekitar tahun 90–110 M.
    Jude:
      display_name: Yudas
      author: Secara tradisional Yudas, saudara Yakobus dan Yesus.
      audience: Komunitas-komunitas Kristen yang disusupi pengajar libertin.
      date: Sekitar tahun 60-an–90-an M.
    Revelation:
      display_name: Wahyu
      author: Yohanes dari Patmos (berbeda gaya dari Injil Keempat).
      audience: Tujuh jemaat Kristen di Asia Kecil Romawi di bawah tekanan kekaisaran.
      date: Sekitar tahun 90-an M, menurut tradisi pada masa pemerintahan Domitianus.
    Tobit:
      display_name: Tobit
      author: Anonim.
      audience: Orang Yahudi di perantauan yang menjalani kesalehan, perkawinan, dan pemeliharaan ilahi di bawah kekuasaan asing.
      date: Sekitar tahun 225–175 SM; disusun dalam bahasa Aram, dengan versi Ibrani juga dibuktikan di Qumran.
    Judith:
      display_name: Yudit
      author: Anonim.
      audience: Orang Yahudi di bawah ancaman asing—sebuah kisah perlawanan saleh yang menantang.
      date: Sekitar tahun 150–100 SM.
    Greek Additions to Esther:
      display_name: Tambahan Yunani untuk Ester
      author: Anonim; materi pelengkap yang ditambahkan dalam terjemahan Yunani Ester.
      audience: Orang Yahudi berbahasa Yunani yang menginginkan kisah Ester dengan doa dan rujukan eksplisit kepada Allah.
      date: Sekitar abad kedua–pertama SM.
    Wisdom of Solomon:
      display_name: Kebijaksanaan Salomo
      author: Anonim; secara pseudonim dikaitkan dengan Salomo. Disusun dalam bahasa Yunani oleh seorang penulis Yahudi Helenistis, kemungkinan di Aleksandria.
      audience: Orang Yahudi Helenistis yang bergumul dengan filsafat Yunani, membela kebijaksanaan Israel terhadap alternatif pagan dan murtad.
      date: Sekitar tahun 50 SM–50 M.
