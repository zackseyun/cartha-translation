review:
  verdict: revise
  review_summary: Chunk lengkap dan pada umumnya setia. Saya memperbaiki beberapa judul yang mengubah atau menambahkan nuansa sumber, terutama Gospel of Mary 1, Exegesis on the Soul 2 dan 6, serta Tripartite Tractate 11.
  issues:
  - 'Gospel of Mary 1: draf menambahkan gagasan ''penolakan terhadap'' yang tidak ada dalam sumber.'
  - 'Exegesis on the Soul 2: ''berbagai'' menambahkan pembatas yang tidak ada dalam sumber.'
  - 'Exegesis on the Soul 6: ''yang menyesatkan'' menambahkan penilaian yang tidak ada dalam sumber.'
  - 'Tripartite Tractate 11: draf membalik hubungan makna; sumber menyatakan makhluk yang jatuh mencari kesempurnaan tetapi gagal.'
