payload:
  book_metadata:
    Gospel of Mary:
      display_name: Injil Maria
      author: Anonim. Karya ini menampilkan Maria sebagai penerima dan penafsir wahyu Yesus, tetapi tidak menyatakan bahwa Maria menulis injil yang masih bertahan ini.
      audience: Para pembaca Kristen awal yang bergumul dengan persoalan wahyu, kenaikan rohani, kewibawaan para rasul, dan keabsahan pengajaran Maria di antara murid-murid Yesus.
      date: Biasanya diperkirakan berasal dari abad ke-2 M; fragmen-fragmen Yunaninya yang masih ada berasal dari abad ke-3, sedangkan naskah utama dalam bahasa Koptik tersimpan dalam Kodeks Berlin 8502 dari abad ke-5.
    Treatise on the Resurrection:
      display_name: Risalah tentang Kebangkitan
      author: Anonim. Karya ini disusun sebagai surat seorang guru kepada murid bernama Reginos; baik sang guru maupun Reginos tidak dapat diidentifikasi secara pasti.
      audience: Orang-orang Kristen yang mencari pengajaran tentang kebangkitan, khususnya pembaca yang mempertimbangkan segi jasmani, rohani, dan keikutsertaan pada masa kini dalam kehidupan kebangkitan.
      date: Biasanya diperkirakan berasal dari akhir abad ke-2 M (sering sekitar 170–200 M); karya Yunani yang lebih awal ini tersimpan dalam sebuah salinan Koptik dari abad ke-4.
    Dialogue of the Savior:
      display_name: Dialog Sang Juru Selamat
      author: Anonim. Dialog ini menyajikan pengajaran berupa wahyu dari mulut Yesus dalam percakapan dengan Yudas, Matius, dan Maria, tetapi tidak menyebutkan siapa penyusunnya.
      audience: Suatu kelompok Kristen awal yang berminat pada wahyu pribadi, pemuridan, pengenalan diri, doa, dan persiapan asketis menuju keselamatan.
      date: Umumnya diperkirakan berasal dari abad ke-2 M, meskipun lapisan-lapisan penyusunan dan tarikh tepatnya masih diperdebatkan; karya ini tersimpan dalam sebuah naskah Koptik dari abad ke-4.
    Exegesis on the Soul:
      display_name: Tafsir tentang Jiwa
      author: Anonim. Penulisnya adalah seorang pengkhotbah Kristen yang menafsirkan kembali gambaran-gambaran dari Alkitab dan sastra Yunani sebagai alegori tentang kejatuhan, pertobatan, dan pemulihan jiwa.
      audience: Orang-orang Kristen yang mengenal Kitab Suci dan nasihat moral serta dipanggil untuk meninggalkan keinginan yang tidak tertata, bertobat, dan bersatu kembali dengan Yang Ilahi.
      date: Umumnya diperkirakan berasal dari akhir abad ke-2 atau awal abad ke-3 M; karya ini tersimpan dalam terjemahan Koptik dari bahasa Yunani yang berasal dari abad ke-4.
    Book of Thomas the Contender:
      display_name: Kitab Tomas Sang Penantang
      author: Anonim. Judul penutupnya mengaitkan karya ini dengan Yudas Tomas dan menyebut Mathaias sebagai pencatat, tetapi penyebutan ini merupakan atribusi sastra, bukan klaim kepengarangan yang dapat diverifikasi.
      audience: Orang-orang Kristen yang cenderung menjalani hidup asketis dan didorong untuk mencari pengenalan diri, melawan hawa nafsu jasmani, serta memahami pengajaran pribadi Yesus kepada Tomas.
      date: Sering diperkirakan berasal dari akhir abad ke-2 atau awal abad ke-3 M, mungkin dalam lingkungan Kristen Suriah; karya ini tersimpan dalam sebuah naskah Koptik dari abad ke-4.
    Tripartite Tractate:
      display_name: Risalah Tiga Bagian
      author: Anonim. Penulisnya adalah seorang teolog Kristen Valentinian yang sangat terpelajar; ia tidak dapat diidentifikasi secara pasti sebagai guru tertentu yang dikenal namanya.
      audience: Sebuah komunitas Kristen Valentinian yang menerima pengajaran mendalam tentang Allah, para eon, penciptaan, Kristus, gereja, keselamatan, dan pemulihan akhir.
      date: Biasanya diperkirakan berasal dari abad ke-3 M, meskipun ada pendapat yang lebih mendukung paruh kedua abad tersebut; karya ini tersimpan dalam bahasa Koptik di Kodeks Jung dari abad ke-4.
    Apocryphon of John:
      display_name: Apokrifon Yohanes
      author: Anonim. Dengan menggunakan nama samaran, karya ini menyajikan wahyu dari Yesus yang telah bangkit kepada Yohanes anak Zebedeus dan masih bertahan dalam lebih dari satu versi penyuntingan kuno.
      audience: Orang-orang Kristen dalam tradisi pewahyuan Setian atau tradisi yang berkaitan erat dengannya, yang mencari penjelasan tentang alam ilahi, penciptaan, jati diri manusia, dan pembebasan dari para penguasa yang memusuhi.
      date: Suatu bentuk awalnya kemungkinan telah beredar pada abad ke-2 M; naskah-naskah Koptik yang masih bertahan, yang memuat versi penyuntingan pendek dan panjang, berasal dari abad ke-4 dan ke-5.
