payload:
  book_metadata:
    2 Esdras:
      display_name: 2 Esdras
      author: Anonim, dengan bingkai yang disunting oleh orang Kristen seputar inti yang semula bersifat Yahudi (4 Ezra, pasal 3–14).
      audience: Orang Yahudi setelah tahun 70 M yang bergumul dengan teodise; kemudian diperluas untuk pembaca Kristen.
      date: Inti Yahudi sekitar tahun 100 M; tambahan Kristen sekitar abad ke-2–3 M.
    Didache:
      display_name: Didache
      author: Anonim (judulnya berarti "Ajaran Kedua Belas Rasul").
      audience: Jemaat-jemaat Kristen awal — sebuah pedoman ringkas tentang etika, baptisan, ekaristi, dan pengajar keliling.
      date: Sekitar akhir abad ke-1 hingga awal abad ke-2 M.
    Gospel of Thomas:
      display_name: Injil Tomas
      author: Anonim; bagian pembuka mengaitkan kumpulan perkataan ini dengan "Didymos Yudas Tomas." Naskah lengkapnya hanya bertahan dalam terjemahan Koptik abad ke-4 dari Nag Hammadi (NHC II,2), dengan tiga fragmen Yunani dari Oxyrhynchus.
      audience: Pembaca Kristen yang dibentuk oleh tradisi hikmat Suriah dan pemikiran proto-Gnostik, serta diarahkan pada pengenalan diri yang esoteris dalam perkataan-perkataan Yesus.
      date: Naskah asli Yunani kemungkinan berasal dari sekitar tahun 50–140 M; manuskrip Koptik sekitar tahun 340 M.
      summary: Injil Tomas adalah kumpulan perkataan yang dikaitkan dengan Yesus. Kitab ini tidak memiliki kisah yang berkesinambungan dan berulang kali mengajak pembaca menemukan makna perkataan-perkataan tersebut.
