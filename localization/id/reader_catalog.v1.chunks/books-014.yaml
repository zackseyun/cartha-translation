payload:
  book_metadata:
    Sirach:
      display_name: Sirakh
      author: Yesua bin Eleazar bin Sira dari Yerusalem; terjemahan bahasa Yunani dibuat oleh cucunya.
      audience: Para pemuda Yahudi yang dididik dalam hikmat di Yerusalem pada zaman Helenistik.
      date: Naskah asli bahasa Ibrani sekitar 195–175 SM; terjemahan bahasa Yunani sekitar 132 SM.
    Baruch:
      display_name: Barukh
      author: Anonim; dikaitkan dengan Barukh, juru tulis Yeremia, dengan menggunakan namanya.
      audience: Orang-orang Yahudi di diaspora yang merenungkan pembuangan, pertobatan, dan hikmat.
      date: Sekitar abad ke-2 SM.
    1 Maccabees:
      display_name: 1 Makabe
      author: Anonim, kemungkinan seorang penulis dari Yerusalem yang menulis dalam bahasa Ibrani (hanya naskah bahasa Yunani yang masih ada).
      audience: Orang-orang Yahudi pada masa dan setelah pemberontakan Hashmoni; karya ini mengisahkan legitimasi wangsa Hashmoni.
      date: Sekitar 100 SM.
    2 Maccabees:
      display_name: 2 Makabe
      author: Seorang peringkas anonim dari karya yang lebih panjang oleh Yason dari Kirene; disusun dalam bahasa Yunani.
      audience: Orang-orang Yahudi berbahasa Yunani di diaspora—dengan penekanan pada kemartiran, pemeliharaan ilahi, dan kebangkitan.
      date: Sekitar 124 SM atau tidak lama sesudahnya.
