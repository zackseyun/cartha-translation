      author: Ignatius, uskup Antiokhia, untuk ketujuh surat dalam resensi menengah yang diterima secara umum; surat-surat Ignatius yang diperluas pada masa kemudian dan yang ditulis dengan nama samaran tidak termasuk dalam kumpulan ini.
