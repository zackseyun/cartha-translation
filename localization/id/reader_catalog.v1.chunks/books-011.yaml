  book_metadata:
    Luke:
      display_name: Lukas
      author: Anonim; tradisi mengaitkannya dengan Lukas, rekan seperjalanan Paulus.
      audience: Para pembaca Kristen terpelajar berlatar Yunani-Romawi, yang ditujukan kepada "Teofilus".
      date: Sekitar 80–90 M.
    John:
      display_name: Yohanes
      author: Anonim; tradisi mengaitkannya dengan rasul Yohanes atau "Murid yang Dikasihi".
      audience: Sebuah komunitas Kristen yang mengalami ketegangan dengan Yudaisme sinagoge, terbentuk di sekitar kesaksian Murid yang Dikasihi.
      date: Sekitar 90–110 M.
      summary: Yohanes menyajikan Yesus sebagai Firman kekal yang menyatakan Bapa, memberi hidup melalui percaya kepada-Nya, dan dimuliakan melalui tanda-tanda, kematian, serta kebangkitan-Nya.
    Acts:
      display_name: Kisah Para Rasul
      author: Anonim; penulis yang sama dengan Lukas.
      audience: Para pembaca Kristen berlatar Yunani-Romawi; jilid kedua dari karya yang ditujukan kepada Teofilus.
      date: Sekitar 80–90 M.
    Romans:
      display_name: Roma
      author: Paulus, dengan juru tulis Tertius.
      audience: Orang-orang Kristen di Roma — orang percaya Yahudi dan non-Yahudi yang mengalami ketegangan mengenai Taurat dan identitas.
      date: Sekitar 56–58 M., ditulis dari Korintus.
