      display_name: Amsal
      author: Sebuah antologi; judul-judul pengantarnya menyebut Salomo, Agur, Lemuel, dan “orang-orang bijak.”
      audience: Orang-orang muda Israel yang dibentuk dalam hikmat untuk kehidupan sehari-hari.
      date: Terdiri atas beberapa lapisan penulisan, sekitar abad ke-10–ke-4 SM.
    Ecclesiastes:
      display_name: Pengkhotbah
      author: Tidak diketahui; penuturnya adalah “Qohelet,” yang menurut tradisi diidentifikasi sebagai Salomo.
      audience: Orang Israel yang menghadapi keterbatasan hikmat, kekayaan, dan jerih payah di bawah matahari.
      date: Kemungkinan sekitar abad ke-5–ke-3 SM, berdasarkan bahasa Ibrani yang dipengaruhi bahasa Aram.
