  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Injil Masa Kanak-Kanak Tomas
      author: Anonim. Bentuk paling awal yang dapat direkonstruksi tidak menyebutkan nama penulis; pengaitan dengan Tomas berasal dari judul-judul naskah dan proses penyalinan pada masa kemudian.
      audience: Umat Kristen yang ingin mengetahui masa kanak-kanak Yesus dan bagaimana kuasa ilahi, disiplin, pembelajaran, serta proses menjadi dewasa dapat dikisahkan sebelum dimulainya catatan Injil kanonik.
      date: Biasanya ditelusuri hingga abad ke-2 M, tetapi teks ini bertahan dalam beberapa versi Yunani yang sangat berbeda serta terjemahan-terjemahan awal.
    Acts of Paul and Thecla:
      display_name: Kisah Paulus dan Tekla
      author: Anonim. Karya ini merupakan satu bagian dari Kisah Paulus yang lebih luas; laporan kuno bahwa seorang presbiter menyusun Kisah tersebut tidak dapat memastikan identitas penulisnya.
      audience: Umat Kristen yang tertarik pada kisah-kisah tentang pemberitaan para rasul, hidup tanpa menikah, baptisan, ketabahan seperti seorang martir, serta kewenangan seorang perempuan untuk mengajar dan bersaksi.
      date: Disusun pada abad ke-2 M, mungkin pada paruh kedua abad tersebut; karya ini beredar baik sebagai bagian dari Kisah Paulus maupun sebagai karya tersendiri.
    Gospel of Peter:
      display_name: Injil Petrus
      author: Anonim. Narasi yang masih bertahan dituturkan dengan suara Petrus dan diwariskan atas namanya, tetapi tidak dianggap sebagai karya rasul Petrus yang hidup dalam sejarah.
      audience: Umat Kristen awal yang tertarik pada kisah sengsara dan kebangkitan yang diperluas, mungkin dalam komunitas-komunitas tempat kewibawaan Petrus memiliki pengaruh khusus.
      date: Biasanya diperkirakan berasal dari abad ke-2 M; fragmen utama berbahasa Yunani yang masih bertahan berasal dari naskah yang jauh lebih kemudian dan ditemukan di Akhmim.
    2 Clement:
      display_name: 2 Klemens
      author: Anonim. Meskipun judul tradisionalnya demikian, karya ini merupakan khotbah Kristen awal, bukan surat kedua yang ditulis oleh Klemens dari Roma.
      audience: Jemaat Kristen yang dinasihati agar bertobat, hidup dengan moral yang konsisten, memperhatikan orang-orang rentan, dan tetap setia bertahan dalam pengharapan akan kebangkitan dan penghakiman.
      date: Biasanya diperkirakan berasal dari paruh pertama atau pertengahan abad ke-2 M (sekitar 100–160 M); tempat penyusunannya tidak diketahui dengan pasti.
    Epistle of Barnabas:
      display_name: Surat Barnabas
      author: Anonim. Karya ini secara tradisional dikaitkan dengan Barnabas, rekan Paulus, tetapi kajian modern tidak menerima pengaitan tersebut.
      audience: Umat Kristen non-Yahudi yang diajar untuk menerima Kitab Suci Israel sebagai milik mereka melalui penafsiran kristologis dan alegoris, sambil membedakan identitas perjanjian mereka dari praktik Yahudi.
      date: Umumnya diperkirakan berasal dari masa antara penghancuran Bait Allah di Yerusalem pada 70 M dan awal abad ke-2, sering kali sekitar 80–130 M.
