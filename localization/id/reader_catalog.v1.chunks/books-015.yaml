  book_metadata:
    1 Esdras:
      display_name: 1 Esdras
      author: Anonim; sebuah penyusunan ulang dalam bahasa Yunani yang menata kembali 2 Tawarikh 35–36, Ezra, dan Nehemia 7–8.
      audience: Orang Yahudi pada zaman Helenistik yang menginginkan kisah yang runtut tentang kepulangan dan pemulihan.
      date: Sekitar abad ke-2–1 SM.
    Prayer of Manasseh:
      display_name: Doa Manasye
      author: Anonim; secara pseudonim dikaitkan dengan Raja Manasye.
      audience: Orang-orang yang bertobat dan menghayati pertobatan Manasye—digunakan dalam liturgi di beberapa tradisi.
      date: Sekitar abad ke-2–1 SM.
    Psalm 151:
      display_name: Mazmur 151
      author: Anonim; secara pseudonim dikaitkan dengan Daud. Suatu bentuk dalam bahasa Ibrani ditemukan dalam 11QPsa.
      audience: Komunitas diaspora dan Qumran yang menghayati kumpulan mazmur Daud.
      date: Sekitar abad ke-2 SM atau lebih awal.
    3 Maccabees:
      display_name: 3 Makabe
      author: Anonim; disusun dalam bahasa Yunani.
      audience: Orang Yahudi diaspora penutur bahasa Yunani di Mesir—sebuah kisah pembebasan dengan latar pemerintahan Ptolemeus IV.
      date: Sekitar abad ke-1 SM hingga abad ke-1 M.
    4 Maccabees:
      display_name: 4 Makabe
      author: Anonim; seorang penulis Yahudi berbahasa Yunani yang dipengaruhi filsafat Stoa.
      audience: Orang Yahudi Helenistik—sebuah khotbah filosofis tentang akal budi yang menguasai hawa nafsu melalui kesetiaan.
      date: Sekitar abad ke-1 M.
    Bel and the Dragon:
      display_name: Bel dan Naga
      author: Anonim; salah satu Tambahan Yunani pada Kitab Daniel.
      audience: Orang Yahudi penutur bahasa Yunani—sebuah polemik bernada ejekan terhadap penyembahan berhala.
      date: Sekitar abad ke-2–1 SM.
    Letter of Jeremiah:
      display_name: Surat Yeremia
      author: Anonim; secara pseudonim dikaitkan dengan Yeremia.
      audience: Orang Yahudi diaspora yang tergoda oleh penyembahan berhala di lingkungan mereka.
      date: Sekitar abad ke-4–2 SM.
    Prayer of Azariah and Song of the Three:
      display_name: Doa Azarya dan Nyanyian Ketiga Pemuda
      author: Anonim; salah satu Tambahan Yunani pada Kitab Daniel.
      audience: Orang Yahudi penutur bahasa Yunani—bahan liturgis untuk Daniel 3.
      date: Sekitar abad ke-2 SM.
    Susanna:
      display_name: Susana
      author: Anonim; salah satu Tambahan Yunani pada Kitab Daniel.
      audience: Orang Yahudi penutur bahasa Yunani—sebuah kisah tentang kebenaran dan kesaksian palsu yang dikecam.
      date: Sekitar abad ke-2–1 SM.
    1 Clement:
      display_name: 1 Klemens
      author: Anonim, dikaitkan dengan Klemens dari Roma.
      audience: Jemaat Kristen di Korintus yang sedang terlibat dalam perselisihan kepemimpinan.
      date: Sekitar tahun 96 M.
