books:
  Genesis:
    display_name: Kejadian
    author: Anonim; secara tradisional dikaitkan dengan Musa. Kajian modern memandang kitab ini memiliki sejarah penyusunan yang panjang, dengan berbagai sumber yang kemudian disunting menjadi satu.
    audience: Israel dalam identitasnya sebagai umat perjanjian, dengan kisah asal-usul bangsa itu berakar pada penciptaan, pemilihan, dan janji Allah.
    date: Disusun selama berabad-abad; mencapai bentuk yang diterima sekarang sekitar abad ke-6–5 SM, pada masa atau sesudah pembuangan ke Babel.
    summary: Kejadian mengisahkan penciptaan, pemberontakan dan tercerai-berainya umat manusia, serta keluarga Abraham, Ishak, Yakub, dan Yusuf, yang melalui mereka janji-janji perjanjian Allah kepada Israel mulai berawal.
