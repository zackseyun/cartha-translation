  Epistle to Diognetus:
    display_name: Surat kepada Diognetus
    author: Tidak diketahui. Penulis menyebut dirinya seorang murid atau pelajar, tetapi baik dirinya maupun Diognetus yang disapa dalam surat ini tidak dapat diidentifikasi dengan pasti.
    audience: Seorang penanya non-Kristen yang terpelajar—beserta pembaca lain seperti dia—yang bertanya tentang ibadah, etika, identitas sosial, kasih, dan kesan bahwa iman Kristen itu baru.
    date: Sering diperkirakan berasal dari akhir abad ke-2 atau awal abad ke-3 M, meskipun berbagai usulan tanggal sangat beragam; dua bab terakhir mungkin berasal dari karya yang berbeda.
