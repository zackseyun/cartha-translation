book_localizations:
- source_title: Genesis
  title: 创世记
  author: 作者不详；传统上归于摩西。现代学术研究认为，本书经历了漫长的成书过程，由不同来源的材料在后期编订而成。
  audience: 以圣约身份凝聚的以色列人；本书把这个民族的起源叙事奠基于上帝的创造、拣选和应许。
  date: 历经数百年逐步成书；约在公元前6至5世纪，即巴比伦流亡期间或之后，形成现今传承下来的定本。
  summary: 《创世记》讲述创造、人类的悖逆与分散，以及亚伯拉罕、以撒、雅各和约瑟一家的故事；上帝赐给以色列的圣约应许由此展开。
- source_title: John
  title: 约翰福音
  author: 作者不详；传统上认为作者是使徒约翰或“蒙爱门徒”。
  audience: 一个与会堂犹太教关系紧张的基督徒群体；这个群体围绕“蒙爱门徒”的见证而形成。
  date: 约公元90至110年。
  summary: 《约翰福音》把耶稣呈现为永恒的“道”：他彰显父，使信靠他的人得生命，并借着他的神迹、死亡和复活得着荣耀。
- source_title: Gospel of Thomas
  title: 多马福音
  author: 作者不详；开篇将这部语录集归于“迪狄摩·犹大·多马”。全书仅完整保存于纳格·哈玛迪文库的一份4世纪科普特文译本（NHC II,2）中，此外还有三份出土于俄克喜林库斯的希腊文残片。
  audience: 受叙利亚智慧传统和早期诺斯替思想影响的基督徒读者；其取向是从耶稣的言论中寻求隐秘的自我认识。
  date: 希腊文原本很可能写于约公元50至140年；现存科普特文抄本约写于公元340年。
  summary: 《多马福音》是一部归于耶稣的语录集。它没有连贯的故事情节，并一再呼吁读者领悟这些话的含义。
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: 创世记 1:1
  text: 当上帝开始创造天地时[a]——
  translator_note: '[a] 传统译法把本句视为一个完整句子：“起初，上帝创造天地。”但按希伯来文，更自然的理解是本句引出下文，主句的动作是第3节的“上帝说”。'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: 传道书 1:2
  text: “雾气，尽是雾气[a]！”科赫莱特[b]说：“一切都是雾气——转瞬即逝，无法握住，而且往往并不像我们所预料的那样。”
  translator_note: '[a] 希伯来词 hevel 的字面意思是“气息”或“雾气”。在《传道书》中，这个词描述那些迅速消逝、无法把握或完全理解，并且结果常与人的预期不同的事物。译作“雾气”保留了这一具体意象，却不武断地宣称一切都毫无意义。也可译作“气息”“不过是一口气”或“短暂易逝”。


    [b] “科赫莱特”是作者的希伯来名字或称号，常译作“教师”或“传道者”。此处保留“科赫莱特”这一音译，以涵盖各种可能的含义，不偏向某一种解释。'
- source_path: nt/john/001/001.yaml
  reference: 约翰福音 1:1
  text: 太初[b]，道已经存在。道与上帝同在，道就是上帝。[a]
  translator_note: '[a] 也可译作“道具有神性”，或“上帝是怎样的，道也是怎样的”。希腊文的措辞既确认道完全是上帝，也把道与前一句中的上帝区别开来。


    [b] 这个开篇呼应《创世记》1:1，把道与创造的起始联系起来。“已经存在”表明，当起初来到时，道一直存在，而不是那时才开始存在；也可译作“原在”或“存在”。'
- source_path: nt/romans/003/025.yaml
  reference: 罗马书 3:25
  text: 上帝将他设立为赎罪的祭物[a]，借着信，藉着他的血[b]。他这样做，是要显明自己的公义[c]，因为他曾越过过去所犯的罪。
  translator_note: '[a] 或译“平息忿怒的祭物”；也可译“施恩座”，即旧约中约柜的金盖，赎罪之血洒在其上。


    [b] 或译“借着信，凭着他的血”。


    [c] 或译“正义”。'
- source_path: nt/1_peter/001/013.yaml
  reference: 彼得前书 1:13
  text: 所以，要整备你们的心思，预备行动。[a]要完全保持清醒，把你们的盼望完全寄托于耶稣基督显现时将带给你们的恩典。[b]
  translator_note: '[a] 希腊文直译为“束起你们心思的腰”。这个意象是把长衣在腰间束好，以便随时行动。


    [b] 译作“完全”的那个希腊词可以修饰“保持清醒”，也可以修饰“寄托盼望”，还可能同时修饰两者。'
