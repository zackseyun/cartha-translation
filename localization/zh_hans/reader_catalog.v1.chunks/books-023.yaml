payload:
  book_metadata:
    Gospel of Mary:
      display_name: 马利亚福音
      author: 作者不详。作品将马利亚描绘为耶稣启示的领受者和阐释者，但并未声称现存福音书由马利亚写成。
      audience: 早期基督徒读者；他们关注启示、灵性升华、使徒权威，以及马利亚在耶稣门徒中教导的正当性等问题。
      date: 通常断代为公元2世纪；现存希腊文残片出自3世纪，主要的科普特文见证则保存在5世纪的《柏林抄本8502》中。
    Treatise on the Resurrection:
      display_name: 论复活
      author: 作者不详。作品采用教师写信给名叫雷吉诺斯的学生这一形式；无论是教师还是雷吉诺斯，其身份都无法得到可靠确认。
      audience: 寻求复活教导的基督徒，尤其是思考身体层面、灵性层面以及当下如何参与复活生命的读者。
      date: 通常认为成书于公元2世纪晚期（常定为约170—200年）；现存文本是4世纪的科普特文抄本，译自更早的希腊文作品。
    Dialogue of the Savior:
      display_name: 救主对话录
      author: 作者不详。这篇对话以耶稣与犹大、马太和马利亚交谈的形式，把启示性的教导置于耶稣口中，但没有说明编纂者是谁。
      audience: 一个关注私下启示、门徒之道、自我认识、祷告以及以禁欲操练预备得救的早期基督徒群体。
      date: 一般认为成书于公元2世纪，但其文本层次和确切年代仍有争议；现存于一份4世纪的科普特文抄本中。
    Exegesis on the Soul:
      display_name: 灵魂释义
      author: 作者不详。作者是一位基督徒讲道者，把圣经和希腊文学中的意象重新解读为灵魂堕落、悔改与复归的寓言。
      audience: 熟悉圣经和道德劝诫的基督徒；他们受劝勉离开失序的欲望，转向悔改，并与神圣重新联合。
      date: 一般断代为公元2世纪晚期或3世纪早期；现存文本是4世纪由希腊文译成的科普特文译本。
    Book of Thomas the Contender:
      display_name: 争战者多马书
      author: 作者不详。篇末标题把作品与犹大·多马联系起来，并称马泰亚斯为记录者，但这些是文学上的归名，并非可以证实的作者身份声明。
      audience: 倾向禁欲生活的基督徒；他们受劝勉追求自我认识、抵制肉体欲望，并领会耶稣私下对多马所作的教导。
      date: 常被断代为公元2世纪晚期或3世纪早期，可能产生于叙利亚基督教环境；现存于一份4世纪的科普特文抄本中。
    Tripartite Tractate:
      display_name: 三部论
      author: 作者不详。作者是一位学识渊博的瓦伦廷派基督徒神学家；无法可靠地认定他就是某位有名可考的教师。
      audience: 一个瓦伦廷派基督徒群体，接受有关上帝、永世体、创造、基督、教会、救恩及最终复归的系统教导。
      date: 通常断代为公元3世纪，也有观点倾向于3世纪后半叶；现存文本以科普特文保存在4世纪的《荣格抄本》中。
    Apocryphon of John:
      display_name: 约翰秘传
      author: 作者不详。作品以伪名方式呈现复活后的耶稣向西庇太之子约翰所作的启示，且以不止一种古代版本流传。
      audience: 塞特派或与其密切相关的启示传统中的基督徒；他们寻求有关神圣领域、创造、人的身份以及从敌对统治者手中获得解放的论述。
      date: 早期形态可能已于公元2世纪流传；现存科普特文见证保留长、短两种版本，年代为4世纪和5世纪。
