    Sirach:
      display_name: 德训篇
      author: 耶路撒冷的西拉之子、厄肋阿匝尔之子耶稣；希腊文译本由他的孙子翻译。
      audience: 在希腊化时期的耶路撒冷接受智慧教导的犹太青年男子。
      date: 希伯来文原作约写于公元前195—175年；希腊文译本约完成于公元前132年。
    Baruch:
      display_name: 巴录书
      author: 作者不详；托名于耶利米的书记巴录。
      audience: 思考流亡、悔改与智慧的散居犹太人。
      date: 约公元前2世纪。
    1 Maccabees:
      display_name: 马加比一书
      author: 作者不详，可能是耶路撒冷的一位作者，以希伯来文写成（现仅存希腊文文本）。
      audience: 哈斯摩尼起义期间及之后的犹太人；本书叙述哈斯摩尼王朝的正当性。
      date: 约公元前100年。
    2 Maccabees:
      display_name: 马加比二书
      author: 一位不具名的节编者，根据昔兰尼的雅松所写的一部更长著作加以节编；以希腊文写成。
      audience: 讲希腊语的散居犹太人——着重殉道、天意与复活。
      date: 约公元前124年或稍后。
