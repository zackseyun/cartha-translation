  book_metadata:
    Numbers:
      display_name: 民数记
      author: 作者不详；传统上认为是摩西所作。
      audience: 在埃及与应许之地之间行进的以色列人——旷野一代，以及后来从他们的失败中汲取教训的读者。
      date: 成书包含多个编纂层次，年代从王国后期延续至被掳归回后时期（约公元前7至5世纪）。
    Deuteronomy:
      display_name: 申命记
      author: 作者不详；全书以摩西临别讲话的形式呈现。现代学术研究通常认为，其核心部分形成于公元前7世纪后期约西亚执政期间的改革时期。
      audience: 准备进入那地的以色列人——以及后来那些身处流亡、思考在没有圣殿或君王的情况下如何忠信生活的人。
      date: 核心部分约形成于公元前7世纪后期；在被掳时期定型。
    Joshua:
      display_name: 约书亚记
      author: 作者不详；属于申命记史书的一部分。
      audience: 处于王国时期和被掳时期的以色列人，他们反思征服、圣约以及那地的意义。
      date: 约于公元前7至6世纪根据更早的传统编纂而成。
