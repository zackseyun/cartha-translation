payload:
  book_metadata:
    1 Corinthians:
      display_name: 哥林多前书
      author: 保罗，与所提尼共同署名。
      audience: 哥林多纷争不断的基督徒会众。
      date: 约公元53—55年，写于以弗所。
    2 Corinthians:
      display_name: 哥林多后书
      author: 保罗，与提摩太共同署名。
      audience: 经历一场痛苦冲突后的哥林多会众。
      date: 约公元55—56年。
    Galatians:
      display_name: 加拉太书
      author: 保罗。
      audience: 加拉太（安纳托利亚中部）各地的基督徒会众；他们正受到压力，被要求接受割礼并遵守《托拉》。
      date: 约公元48—55年（有争议）。
    Ephesians:
      display_name: 以弗所书
      author: 保罗，或一位以保罗之名写作的亲近门徒（有争议）。
      audience: 广泛的亚细亚基督徒读者；最早期抄本中没有“以弗所”这一地名。
      date: 若为保罗所作，约写于公元60年代；若为托名作品，约写于公元80—90年代。
    Philippians:
      display_name: 腓立比书
      author: 保罗，与提摩太共同署名。
      audience: 马其顿罗马殖民城腓立比的基督徒会众。
      date: 约公元60—62年，写于狱中。
    Colossians:
      display_name: 歌罗西书
      author: 保罗，与提摩太共同署名；也可能是一位亲近门徒以保罗之名写作（有争议）。
      audience: 吕古斯河谷歌罗西的基督徒；他们正面对一种混合多种观念的教导。
      date: 若为保罗所作，约写于公元60—62年；若为托名作品，则写于更晚时期。
    1 Thessalonians:
      display_name: 帖撒罗尼迦前书
      author: 保罗，与西拉和提摩太共同署名。
      audience: 正遭受迫害的帖撒罗尼迦年轻基督徒会众。
      date: 约公元50—51年，可能是现存最早的保罗书信。
    2 Thessalonians:
      display_name: 帖撒罗尼迦后书
      author: 保罗（有争议；一些学者认为这是托名作品）。
      audience: 帖撒罗尼迦会众；本书回应他们对末世之事的困惑。
      date: 若为保罗所作，约写于公元51年。
    1 Timothy:
      display_name: 提摩太前书
      author: 保罗，或一位以保罗之名写作的门徒（《教牧书信》被广泛认为是托名作品）。
      audience: 作为保罗驻以弗所代表的提摩太；本书也是关于后期教会秩序的指导手册。
      date: 若为保罗所作，约写于公元60年代中期；若为托名作品，约写于公元90—110年。
    2 Timothy:
      display_name: 提摩太后书
      author: 保罗，或一位以保罗之名写作的门徒。
      audience: 提摩太；本书以保罗在狱中的临别赠言为叙述框架。
      date: 若为保罗所作，约写于公元60年代中期；若为托名作品，约写于公元90—110年。
    Titus:
      display_name: 提多书
      author: 保罗，或一位以保罗之名写作的门徒。
      audience: 作为保罗驻克里特代表的提多。
      date: 若为保罗所作，约写于公元60年代中期；若为托名作品，约写于公元90—110年。
    Philemon:
      display_name: 腓利门书
      author: 保罗，与提摩太共同署名。
      audience: 基督徒奴隶主腓利门；内容关乎他逃走的奴隶阿尼西谋。
      date: 约公元60—62年。
    Hebrews:
      display_name: 希伯来书
      author: 作者不详。传统上曾提出保罗、亚波罗、巴拿巴、百基拉等人，但没有一种说法得到一致认可。
      audience: 说希腊语的犹太基督徒；他们受到诱惑，可能渐渐偏离自己所宣认的基督信仰。
      date: 约公元60—95年。
