    Letters of Ignatius:
      display_name: 伊格那丢书信
      author: 通常公认的中篇版本所收七封书信，作者为安提阿主教伊格那丢；后世增补及托名伊格那丢的书信不在本书信集中。
      audience: 写给以弗所、马格尼西亚、特拉勒斯、罗马、非拉铁非和士每拿的基督徒会众，以及坡旅甲；这些信写于伊格那丢前往殉道之地的途中。
      date: 通常断代为公元2世纪初，常定在约公元105至117年；但伊格那丢行程的确切年代仍有争议。
