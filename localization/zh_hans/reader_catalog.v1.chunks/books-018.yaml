  book_metadata:
    2 Esdras:
      display_name: 以斯拉二书
      author: 作者不详；其核心原为犹太文献（《以斯拉四书》，第3—14章），外有经基督徒编辑的框架。
      audience: 面向公元70年后思索神义论问题的犹太人；后来经扩充，也面向基督徒读者。
      date: 犹太文献核心约成于公元100年；基督徒增补部分约成于公元2—3世纪。
    Didache:
      display_name: 十二使徒遗训
      author: 作者不详（书名意为“十二使徒的教导”）。
      audience: 面向早期基督徒群体——这是一部关于伦理、洗礼、圣餐和巡回教师的简明手册。
      date: 约成于公元1世纪末至2世纪初。
    Gospel of Thomas:
      display_name: 多马福音
      author: 作者不详；开篇将这部语录集归于“低土马·犹大·多马”。全本仅存于纳格·哈玛迪出土的一份公元4世纪科普特语译本（NHC II,2）；此外还有三份出自俄克喜林库斯的希腊语残片。
      audience: 面向受叙利亚智慧传统和原始诺斯替思想影响的基督徒读者，着重从耶稣的语录中寻求隐秘的自我认识。
      date: 希腊语原作很可能约成于公元50—140年；现存科普特语抄本约抄于公元340年。
      summary: 《多马福音》是一部归于耶稣名下的语录集。全书没有连贯的故事情节，并一再呼吁读者探寻这些语录的含义。
