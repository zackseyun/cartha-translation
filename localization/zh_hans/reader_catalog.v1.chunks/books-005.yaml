    Ezra:
      display_name: 以斯拉记
      author: 作者佚名；可能与《历代志》出自同一人之手。
      audience: 在波斯统治下返回并重建耶路撒冷的人。
      date: 约公元前5世纪中叶至公元前4世纪。
    Nehemiah:
      display_name: 尼希米记
      author: 作者佚名；书中收录了一份相传由尼希米所写的第一人称回忆录。
      audience: 在波斯统治下返回、重建耶路撒冷城墙并重申圣约的人。
      date: 约公元前5世纪中叶至公元前4世纪。
    Esther:
      display_name: 以斯帖记
      author: 作者佚名。
      audience: 受外族统治、散居各地的犹太人，尤其是在波斯的犹太人。
      date: 约在波斯时期晚期或希腊化时期早期（公元前4至3世纪）。
    Job:
      display_name: 约伯记
      author: 作者佚名。
      audience: 思索无辜者受苦与上帝公义问题的以色列人。
      date: 智慧传统研究中的一般看法认为，本书约成于公元前6至4世纪，并采用了更古老的民间素材。
    Psalms:
      display_name: 诗篇
      author: 由多个世纪中的多位作者写成；篇首题注提到大卫、亚萨、可拉、所罗门、摩西等人。
      audience: 敬拜中的以色列民和圣殿会众——也面向后来每一个祷告和哀诉的群体。
      date: 约写于公元前10至3世纪；流亡归回后完成最终汇编。
