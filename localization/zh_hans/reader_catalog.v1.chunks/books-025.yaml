payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: 《多马幼年福音》
      author: 作者不详。其可追溯的最早文本形态并未注明作者；归于多马名下，是后期抄本标题和流传过程中的做法。
      audience: 对耶稣的童年感到好奇，并想了解在正典福音书的记述开始之前，神圣能力、管教、学习和成长可能如何被讲述的基督徒。
      date: 通常认为可追溯至公元2世纪，但现存文本包括若干差异显著的希腊文修订本和早期译本。
    Acts of Paul and Thecla:
      display_name: 《保罗与特克拉行传》
      author: 作者不详。这是篇幅更长的《保罗行传》中的一个故事；古代虽有记载称该行传由一位长老撰写，但无法据此确切认定作者身份。
      audience: 受使徒宣讲、独身、洗礼、如殉道者般坚忍，以及女性教导和作见证的权柄等故事吸引的基督徒。
      date: 成书于公元2世纪，可能在该世纪后半叶；它既作为《保罗行传》的一部分流传，也作为独立作品流传。
    Gospel of Peter:
      display_name: 《彼得福音》
      author: 作者不详。现存叙事以彼得的口吻讲述，并以他的名义流传，但一般不认为这是历史上的使徒彼得所作。
      audience: 对内容有所扩展的受难与复活叙事感兴趣的早期基督徒，可能来自特别重视彼得权威的群体。
      date: 通常定年于公元2世纪；现存最主要的希腊文残篇出自年代晚得多的一份抄本，该抄本发现于艾赫米姆。
    2 Clement:
      display_name: 《克莱孟二书》
      author: 作者不详。尽管传统标题如此称呼，这部作品其实是一篇早期基督教讲道，而不是罗马的克莱孟所写的第二封信。
      audience: 一个受到劝勉的基督徒会众；劝勉内容包括悔改、言行一致、照顾弱者，以及怀着对复活和审判的盼望忠心忍耐。
      date: 通常定年于公元2世纪上半叶或中叶（约公元100—160年）；成书地点尚不确定。
    Epistle of Barnabas:
      display_name: 《巴拿巴书信》
      author: 作者不详。传统上，这部作品被认为与保罗的同伴巴拿巴有关，但现代学术界不接受这一作者归属。
      audience: 外邦基督徒；他们受教以基督论和寓意式的方式解释以色列的经书，并据此将这些经书视为自己的，同时将自身的圣约身份与犹太人的实践区分开来。
      date: 通常定年于公元70年耶路撒冷圣殿被毁之后至公元2世纪初之间，常见估计为约公元80—130年。
