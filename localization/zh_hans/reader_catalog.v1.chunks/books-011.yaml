    Luke:
      display_name: 路加福音
      author: 作者不详；传统上认为作者是保罗的旅伴路加。
      audience: 受过教育的希腊罗马文化背景的基督徒读者；本书题献给“提阿非罗”。
      date: 约写于公元80—90年。
    John:
      display_name: 约翰福音
      author: 作者不详；传统上认为作者是使徒约翰或“耶稣所爱的门徒”。
      audience: 一个与犹太会堂群体关系紧张的基督徒群体，其信仰传统围绕耶稣所爱的门徒的见证形成。
      date: 约写于公元90—110年。
      summary: 约翰福音将耶稣呈现为永恒的道：他彰显父，使信靠他的人得生命，并借着神迹、受死和复活得荣耀。
    Acts:
      display_name: 使徒行传
      author: 作者不详；与路加福音出自同一位作者。
      audience: 希腊罗马文化背景的基督徒读者；这是题献给提阿非罗之作品的第二卷。
      date: 约写于公元80—90年。
    Romans:
      display_name: 罗马书
      author: 保罗，德丢代笔。
      audience: 罗马的基督徒——犹太信徒和外邦信徒因律法与身份认同问题而关系紧张。
      date: 约写于公元56—58年，写作地点为哥林多。
