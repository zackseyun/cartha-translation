  book_metadata:
    1 Esdras:
      display_name: 以斯得拉一书
      author: 作者不详；这是一部希腊文改编作品，重新编排了《历代志下》35—36章、《以斯拉记》和《尼希米记》7—8章的内容。
      audience: 希望读到一部脉络清晰、讲述归回与复兴的希腊化时期犹太人。
      date: 约公元前2至1世纪。
    Prayer of Manasseh:
      display_name: 玛拿西祷言
      author: 作者不详；托名于玛拿西王。
      audience: 认同玛拿西悔改经历的忏悔者——在某些传统中用于礼仪。
      date: 约公元前2至1世纪。
    Psalm 151:
      display_name: 诗篇第151篇
      author: 作者不详；托名于大卫。死海古卷11QPsa中有其希伯来文版本的见证。
      audience: 敬重大卫诗篇集的散居地和昆兰群体。
      date: 约公元前2世纪或更早。
    3 Maccabees:
      display_name: 马加比三书
      author: 作者不详；以希腊文写成。
      audience: 埃及讲希腊语的散居犹太人——这是一部以托勒密四世统治时期为背景的获救叙事。
      date: 约公元前1世纪至公元1世纪。
    4 Maccabees:
      display_name: 马加比四书
      author: 作者不详；作者是一位受斯多葛哲学影响、讲希腊语的犹太人。
      audience: 希腊化犹太人——这是一篇探讨理性如何借着忠贞克制情欲的哲理讲章。
      date: 约公元1世纪。
    Bel and the Dragon:
      display_name: 彼勒与大龙
      author: 作者不详；属于希腊文《但以理书》补篇之一。
      audience: 讲希腊语的犹太人——这是一篇嘲讽偶像崇拜的论辩作品。
      date: 约公元前2至1世纪。
    Letter of Jeremiah:
      display_name: 耶利米书信
      author: 作者不详；托名于耶利米。
      audience: 身处异教环境、受到偶像崇拜诱惑的散居犹太人。
      date: 约公元前4至2世纪。
    Prayer of Azariah and Song of the Three:
      display_name: 亚撒利雅祷言与三童歌
      author: 作者不详；属于希腊文《但以理书》补篇之一。
      audience: 讲希腊语的犹太人——作为《但以理书》第3章的礼仪材料。
      date: 约公元前2世纪。
    Susanna:
      display_name: 苏撒拿传
      author: 作者不详；属于希腊文《但以理书》补篇之一。
      audience: 讲希腊语的犹太人——这是一个彰显正义并斥责诬告的故事。
      date: 约公元前2至1世纪。
    1 Clement:
      display_name: 革利免一书
      author: 作者不详，传统上归于罗马的革利免。
      audience: 正陷于领袖争端的哥林多基督徒会众。
      date: 约公元96年。
