payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: 执政者的本质
      author: 作者不详。作者通过一则关于执政者的启示性神话来诠释《创世记》；无法确切认定此作为某位有名有姓的教师所作。
      audience: 处于塞特派或相关环境中的基督徒；他们把《创世记》理解为无知的宇宙统治者、神圣智慧与人类属灵起源之间的冲突。
      date: 一般认为成书于公元3世纪；现存文本见于纳戈·哈玛迪文库第二抄本的一份公元4世纪科普特语抄本。
    On the Origin of the World:
      display_name: 论世界的起源
      author: 作者不详。此作综合并改写了若干犹太教、基督教、柏拉图主义和神话传统，但没有注明编纂者。
      audience: 处于诺斯替化基督教环境中的读者；他们希望了解一种关于创造、宇宙统治者、索菲亚、亚当和夏娃以及世界最终归宿的另类历史叙述。
      date: 通常认为成书于公元3世纪，但其中可能包含更早的材料；主要保存于公元4世纪的科普特语抄本。
    Sophia of Jesus Christ:
      display_name: 耶稣基督的智慧
      author: 作者不详。作者把亦见于《欧格诺斯托斯》的材料改编成耶稣复活后与门徒之间的对话。
      audience: 对有关超越之神、天界秩序以及灵魂的起源与得救之启示性智慧感兴趣的基督徒。
      date: 通常认为成书于公元2世纪末或3世纪；现有科普特语抄本见于纳戈·哈玛迪文库和柏林抄本。
    Gospel of the Egyptians:
      display_name: 埃及人福音
      author: 作者不详。这部纳戈·哈玛迪文献又称《伟大不可见之灵圣书》，不同于仅从引文中得知、年代更早的希腊文《埃及人福音》。
      audience: 一个塞特派基督徒群体；他们借助浓缩繁复的神话、神圣名号、洗礼意象和颂歌式赞美来表达属灵身份与解救。
      date: 通常认为成书于公元2或3世纪；两份科普特语抄本保存于公元4世纪的纳戈·哈玛迪抄本中。
    Letter of Peter to Philip:
      display_name: 彼得致腓力书
      author: 作者不详。开篇的短信及随后启示均托名彼得和腓力，并不能确认为两位使徒中的任何一人所作。
      audience: 寻求以使徒权威支持有关救主、敌对势力、受苦、使命及门徒复兴之教导的基督徒。
      date: 一般认为成书于公元2世纪末或3世纪初；现存文本见于一份公元4世纪的纳戈·哈玛迪抄本及另一份年代更晚的科普特语抄本。
    Gospel of Judas:
      display_name: 犹大福音
      author: 作者不详。书名把这篇叙事归于犹大，但作品本身并不能证明加略人犹大是其历史上的作者。
      audience: 一个批评其他群体献祭和教会制度实践的基督徒团体；他们借助启示性对话和塞特派类型的宇宙论，重新诠释犹大和耶稣之死。
      date: 通常认为成书于公元2世纪中叶或后期；约公元180年，爱任纽已知有一部《犹大福音》，现存科普特语抄本可能出自公元3或4世纪。
    Protoevangelium of James:
      display_name: 雅各原福音
      author: 作者不详。叙述者自称雅各，但此作属于托名作品，并非耶稣的兄弟雅各所写。
      audience: 对马利亚的出生与成长、她始终保持的纯洁、耶稣的诞生，以及用叙事回答《马太福音》和《路加福音》未解问题感兴趣的基督徒。
      date: 一般认为成书于公元2世纪后半叶；现存于许多年代更晚的希腊文抄本和古代译本中。
