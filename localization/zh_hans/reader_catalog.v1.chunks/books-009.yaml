      date: 公元前586年后不久。
    Ezekiel:
      display_name: 以西结书
      author: 以西结，一位流亡巴比伦的祭司；本书亦经历了编辑和发展。
      audience: 流亡巴比伦的犹大人；他们在没有圣殿的处境中重新认识上帝的临在。
      date: 先知事奉时期约为公元前593—571年；本书最终定型稍晚。
    Daniel:
      display_name: 但以理书
      author: 作者不详；本书自称为流亡时期的但以理所作。
      audience: 遭受希腊化政权迫害的犹太人，尤其是安条克四世·伊皮法尼在位时期（公元前167—164年）。
      date: 约在公元前165年形成现今流传的定本；第1—6章吸收了更早的宫廷故事。
