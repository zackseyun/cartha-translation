payload:
  book_metadata:
    Joel:
      display_name: 约珥书
      author: 毗土珥的儿子约珥。
      audience: 被掳归回后的犹大；他们正面对蝗灾，并将其视为耶和华之日的征兆。
      date: 可能约为公元前5至4世纪。
    Amos:
      display_name: 阿摩司书
      author: 来自提哥亚的阿摩司；他是犹大的一名牧人，曾在北方传道。
      audience: 耶罗波安二世统治时期的北国以色列；当时社会繁荣，却充满不公。
      date: 约公元前760至750年。
    Obadiah:
      display_name: 俄巴底亚书
      author: 俄巴底亚。
      audience: 以东背叛耶路撒冷之后的犹大；这是关于以东覆亡的预言。
      date: 公元前586年后不久。
    Jonah:
      display_name: 约拿书
      author: 作者不详；故事主角是亚米太的儿子约拿。
      audience: 被掳归回后的以色列；本书以讽刺手法责备族群上的狭隘排外，也肯定上帝对外族人的怜悯。
      date: 可能约为公元前5至4世纪。
    Micah:
      display_name: 弥迦书
      author: 来自摩利沙的弥迦。
      audience: 公元前8世纪末的犹大，尤其关注受城市权贵压迫的乡村穷人。
      date: 约公元前740至700年。
    Nahum:
      display_name: 那鸿书
      author: 来自伊勒歌斯的那鸿。
      audience: 因尼尼微即将覆亡而欢庆的犹大。
      date: 公元前612年之前不久。
    Habakkuk:
      display_name: 哈巴谷书
      author: 哈巴谷。
      audience: 面对巴比伦崛起的犹大；书中记载先知就公义问题与上帝展开对话。
      date: 约公元前7世纪末。
    Zephaniah:
      display_name: 西番雅书
      author: 古示的儿子西番雅。
      audience: 约西亚统治下、改革前夕的犹大。
      date: 约公元前640至609年。
    Haggai:
      display_name: 哈该书
      author: 哈该。
      audience: 在大流士统治下重建圣殿的归回者。
      date: 公元前520年。
    Zechariah:
      display_name: 撒迦利亚书
      author: 比利家的儿子撒迦利亚；第9至14章很可能出自较晚的另一位作者。
      audience: 重建圣殿的归回者，以及后来被掳归回后的群体。
      date: 第1至8章约写于公元前520至518年；第9至14章或许晚约一个世纪。
    Malachi:
      display_name: 玛拉基书
      author: 作者不详；“玛拉基”意为“我的使者”。
      audience: 波斯统治下、在敬拜和忠信上日渐松懈的被掳归回后犹大。
      date: 约公元前5世纪中叶。
    Matthew:
      display_name: 马太福音
      author: 作者不详；传统认为作者是使徒马太。现代学术研究认为，作者是一位说希腊语的犹太基督徒，取材于《马可福音》和一份类似Q资料的来源。
      audience: 一个犹太基督徒群体；他们正思考自身与犹太会堂传统之间既延续又有区别的关系。
      date: 约公元80至90年。
    Mark:
      display_name: 马可福音
      author: 作者不详；传统将本书与彼得的旅伴约翰·马可联系起来。
      audience: 一个说希腊语的基督徒群体，可能位于罗马，正遭受或面临迫害的威胁。
      date: 约公元65至75年，处于犹太战争及圣殿被毁前后。
