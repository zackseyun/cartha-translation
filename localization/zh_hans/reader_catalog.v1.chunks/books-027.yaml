payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: 坡旅甲致腓立比人书
      author: 士每拿主教坡旅甲。一些学者认为，现存文本合并了在不止一个时间发出的材料。
      audience: 腓立比的基督徒会众；他们曾索取伊格那丢的书信，并得到有关信仰、品行、带领、金钱和坚忍的劝勉。
      date: 公元2世纪初至中叶；至少有一部分与伊格那丢的行程密切相关，而认为此信由多部分合成的观点则容许其中某一部分成文稍晚。
    Martyrdom of Polycarp:
      display_name: 坡旅甲殉道记
      author: 士每拿教会中不具名的成员，以该群体的名义写作；结尾关于传抄流传的说明反映了后来的抄写与传播。
      audience: 菲罗米利安教会及更广泛的基督徒团契；本文记述了坡旅甲被捕、受审、死亡和堪为典范的坚忍。
      date: 写于坡旅甲去世之后，通常定于公元2世纪中叶或后期；但殉道的确切年份和文献的最终形态都存在争议。
    Epistle to Diognetus:
      display_name: 致丢格那妥书
      author: 作者不详。作者自称门徒或学习者，但无论是他本人还是收信人丢格那妥，都无法得到确切确认。
      audience: 一位受过教育、正在探询的非基督徒，以及与他相似的读者；他们询问基督徒的敬拜、伦理、社会身份、爱，以及这信仰为何看似新近出现。
      date: 常被定于公元2世纪末或3世纪初，但各种主张差异很大；最后两章可能出自另一部作品。
    Fragments of Papias:
      display_name: 帕皮亚残篇
      author: 希拉波立主教帕皮亚是已经失传的五卷本《主言释义》的作者；现存汇编由后世作者保存的引文与转述构成。
      audience: 寻求有关耶稣和使徒之传承教导的早期基督徒；这些教导借着具名的口述见证与解释传承链汇集而成。
      date: 帕皮亚的作品通常定于公元2世纪初，常约为110至130年；现存残篇见于公元2世纪及其后写作的作者作品中。
