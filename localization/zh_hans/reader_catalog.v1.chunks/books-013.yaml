payload:
  book_metadata:
    James:
      display_name: 雅各书
      author: 传统上认为作者是耶稣的兄弟雅各；现代学界对于本书是雅各本人所作还是托名之作，意见不一。
      audience: 散居各地的犹太基督徒会众。
      date: 若为雅各本人所作，约在公元50至60年代；若为托名之作，约在公元1世纪末。
    1 Peter:
      display_name: 彼得前书
      author: 传统上认为作者是使徒彼得，由西拉代笔；有些学者认为本书是托名之作。
      audience: 罗马帝国小亚细亚地区遭受社会排斥的基督徒。
      date: 若为彼得所作，约在公元60年代；若为托名之作，约在公元70至90年代。
    2 Peter:
      display_name: 彼得后书
      author: 传统上认为作者是彼得；现代学界普遍认为本书是托名之作。
      audience: 面对讥诮者的基督徒；这些人否认基督会再临。
      date: 约在公元2世纪初。
    1 John:
      display_name: 约翰一书
      author: 作者不详；传统上认为是使徒约翰或约翰团体中的长老。
      audience: 经历分裂之后、正在厘清谁属于群体的约翰团体。
      date: 约在公元90至110年。
    2 John:
      display_name: 约翰二书
      author: “长老”。
      audience: 某个具体的基督徒会众（“蒙拣选的女士”）；信中警告他们防备假教师。
      date: 约在公元90至110年。
    3 John:
      display_name: 约翰三书
      author: “长老”。
      audience: 该犹，一位接待巡回传道者的领袖。
      date: 约在公元90至110年。
    Jude:
      display_name: 犹大书
      author: 传统上认为作者是雅各和耶稣的兄弟犹大。
      audience: 受到放纵主义教师渗透的基督徒群体。
      date: 约在公元60至90年代。
    Revelation:
      display_name: 启示录
      author: 拔摩岛的约翰（文体与《约翰福音》不同）。
      audience: 罗马帝国小亚细亚地区在帝国压力下的七个基督徒会众。
      date: 约在公元90年代；传统上认为是在多米田统治时期。
    Tobit:
      display_name: 多俾亚传
      author: 作者不详。
      audience: 生活在外邦统治下、思考虔敬、婚姻和上帝眷顾的散居犹太人。
      date: 约在公元前225至175年；以亚兰文写成，昆兰也出土了希伯来文版本的证据。
    Judith:
      display_name: 友弟德传
      author: 作者不详。
      audience: 身处外来威胁下的犹太人——一个讲述以虔诚信仰勇敢抵抗的故事。
      date: 约在公元前150至100年。
    Greek Additions to Esther:
      display_name: 以斯帖记希腊文增补
      author: 作者不详；是在《以斯帖记》希腊文译本中加入的补充材料。
      audience: 讲希腊语的犹太人；他们希望《以斯帖记》的故事明确包含祷告和对上帝的提及。
      date: 约在公元前2至1世纪。
    Wisdom of Solomon:
      display_name: 所罗门智训
      author: 作者不详；托名所罗门。由一位希腊化犹太作者以希腊文写成，很可能成书于亚历山大城。
      audience: 接触希腊哲学的希腊化犹太人；本书为以色列的智慧辩护，以回应异教和背弃信仰者提出的其他选择。
      date: 约在公元前50年至公元50年。
