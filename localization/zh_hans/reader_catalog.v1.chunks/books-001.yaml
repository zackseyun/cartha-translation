  book_metadata:
    Genesis:
      display_name: 创世记
      author: 作者不详；传统上归于摩西。现代学术研究认为，本书经历了漫长的成书过程，后来由不同来源的材料编辑而成。
      audience: 处于圣约身份中的以色列人；本书以神的创造、拣选和应许为根基，讲述这个民族的起源。
      date: 历经数百年逐步写成；约于公元前6至5世纪，即巴比伦流亡期间或之后，形成流传至今的定本。
      summary: 《创世记》讲述创造、人类的悖逆与分散，以及亚伯拉罕、以撒、雅各和约瑟一家；神对以色列的圣约应许由此展开。
    Exodus:
      display_name: 出埃及记
      author: 作者不详；传统上归于摩西。现代学术研究认为，本书经历了漫长的成书过程，后来由不同来源的材料编辑而成。
      audience: 已经获释并与神立约的以色列人；他们要学习在神的律法之下作耶和华的国民意味着什么。
      date: 历经数百年逐步写成；约于公元前6至5世纪形成流传至今的定本。
    Leviticus:
      display_name: 利未记
      author: 作者不详；传统上归于摩西。现代学术研究将其归入祭司文献来源。
      audience: 以色列的祭司和敬拜群体——内容涉及献祭、圣洁，以及如何以神的同在为中心安排生活。
      date: 各成书层次的年代从王国后期延续到流亡归回之后（约公元前7至5世纪）。
