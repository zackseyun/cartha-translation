      author: 作者不详；托名于大洪水前的族长以诺。此书是一部由若干不同部分汇编而成的复合作品。
      audience: 思考宇宙中的邪恶、审判和历法问题的犹太启示文学群体；后来也为早期基督徒群体所阅读。
      date: 各部分约于公元前3世纪至公元1世纪汇编成书；仅有吉兹语（埃塞俄比亚语）译本完整保存至今。
