      author: 一部汇编；篇首题注提到所罗门、亚古珥、利慕伊和“智慧人”。
      audience: 在日常生活中接受智慧塑造的以色列年轻人。
      date: 各层文本约写于公元前10至4世纪。
    Ecclesiastes:
      display_name: 传道书
      author: 作者不详；书中的发言者是“传道者”（Qohelet），传统上被认为是所罗门。
      audience: 面对日光之下智慧、财富和劳碌之局限的以色列人。
      date: 根据受亚兰语影响的希伯来文推测，可能写于公元前5至3世纪左右。
    Song of Solomon:
      display_name: 雅歌
      author: 作者不详；篇首题注提到所罗门。
      audience: 以色列人将情欲之爱视为理解圣约亲密关系的一个视角；后来，犹太和基督教读者也用寓意方式解读本书。
      date: 可能写于被掳归回之后，约公元前5至3世纪。
