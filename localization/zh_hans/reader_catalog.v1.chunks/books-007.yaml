review:
  verdict: revise
  review_summary: 已完成完整中文校订。修正了《雅歌》受众说明对“erotic love”的弱化、若干章节标题的语义偏移，以及“Yah”的译名；保留了全部规范键、章节键和字段。
  issues:
  - 《雅歌》受众说明原译将“erotic love”弱化为一般“男女情爱”，并使“作为理解圣约亲密关系的视角”的表述不够明确，已据原文校正。
  - 诗篇149、150原文使用“Yah”，原译一律改作“耶和华”，已改为“雅”。
  - 箴言16原文说上帝引导结果，原译“决定结果”语气过强，已改正。
  - 诗篇105、106及雅歌6等标题已调整，以更贴合原文关系与限定。
