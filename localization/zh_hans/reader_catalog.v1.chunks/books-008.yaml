  book_metadata:
    Isaiah:
      display_name: 以赛亚书
      author: 历经数百年由多位作者写成；第1—39章源自公元前8世纪耶路撒冷的以赛亚，而第40—55章（“第二以赛亚”）和第56—66章（“第三以赛亚”）则回应被掳与归回的处境。
      audience: 先后面向亚述威胁下的犹大、被掳巴比伦的人，以及被掳归回后重建时期的人。
      date: 约写于公元前8世纪末至公元前5世纪。
    Jeremiah:
      display_name: 耶利米书
      author: 亚拿突人耶利米；其书记巴录及后来的编者进行了大量编订。
      audience: 巴比伦征服前夕、期间及之后的犹大人。
      date: 公元前7世纪末至公元前6世纪初。
