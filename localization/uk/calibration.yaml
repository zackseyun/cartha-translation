review:
  verdict: revise
  summary: Внесено стилістичні й змістові уточнення, зокрема до передачі формулювання в 1 Петра 1:13 та до природності українських формулювань. Усі поля звірено з наданим джерельним контекстом; доктринальних додатків не внесено.
  issues:
  - '1 Петра 1:13: «принесуть вам, коли з’явиться» неточно передавало теперішній пасивний зворот «being brought» та «is revealed»; виправлено на формулювання про благодать, що приходить під час об’явлення Ісуса Месії.'
  - 'Еклезіаста 1:2: «Пара над парами» збережено як образний переклад, але внутрішню фразу відредаговано для природнішої української узгодженості.'
  - 'У метаданих уточнено окремі формулювання відповідно до джерела: редакційне поєднання джерел у Бутті, «вступний рядок» Євангелія від Томи та назву «Улюблений Учень».'
  - У Римлян 3:25 «представив» замінено на природніше в українському біблійному контексті «явив».
