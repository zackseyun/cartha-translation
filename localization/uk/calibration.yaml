book_localizations:
- source_title: Genesis
  title: Буття
  author: Автор невідомий; традиційно авторство приписують Мойсеєві. Сучасні дослідники вважають, що книга мала тривалу історію формування, а різні джерела згодом були об’єднані редакторами.
  audience: Ізраїль у його завітній самоідентичності; книга закорінює розповідь про походження народу в Божому творінні, обранні та обітниці.
  date: Книга складалася протягом століть; усталеної форми набула приблизно у VI–V століттях до н. е., під час або після Вавилонського вигнання.
  summary: Книга Буття розповідає про створення світу, бунт і розсіяння людства, а також про родину Авраама, Ісаака, Якова та Йосипа, через яку починаються Божі завітні обітниці Ізраїлеві.
- source_title: John
  title: Євангеліє від Івана
  author: Автор невідомий; традиція приписує цей твір апостолові Івану або «Улюбленому Учневі».
  audience: Християнська громада, що перебувала в напружених відносинах із синагогальним юдаїзмом і сформувалася навколо свідчення Улюбленого Учня.
  date: Приблизно 90–110 роки н. е.
  summary: Євангеліє від Івана представляє Ісуса як вічне Слово, що відкриває Отця, дає життя через довіру до Нього та прославляється через Свої знамення, смерть і воскресіння.
- source_title: Gospel of Thomas
  title: Євангеліє від Томи
  author: Автор невідомий; у вступному рядку збірку висловів приписано «Дідиму Юді Томі». Повністю твір зберігся лише в коптському перекладі IV століття з Наг-Хаммаді (NHC II,2); також збереглися три грецькі фрагменти з Оксіринха.
  audience: Християнські читачі, сформовані під впливом сирійської традиції мудрості та протогностичної думки й зорієнтовані на езотеричне самопізнання у висловах Ісуса.
  date: Грецький оригінал, імовірно, датується приблизно 50–140 роками н. е.; коптський рукопис — приблизно 340 роком н. е.
  summary: Євангеліє від Томи — це збірка висловів, приписаних Ісусові. У ній немає послідовної розповіді, і вона неодноразово закликає читачів відкривати значення цих висловів.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Буття 1:1
  text: Коли Бог почав творити небо й землю[а] —
  translator_note: '[а] Традиційний переклад розглядає ці слова як завершене речення: «На початку Бог створив небо й землю». Однак єврейський текст природніше вводить те, що йде далі, а головна дія — «Бог сказав» — з’являється у вірші 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Еклезіаста 1:2
  text: '«Пара над парами[а], — каже Когелет[б]. — Усе — пара: вона швидко минає, її неможливо втримати, і часто все виявляється не таким, як ми очікуємо».'
  translator_note: '[а] Єврейське слово hevel буквально означає «подих» або «пара». У книзі Еклезіаста воно описує те, що швидко минає, чого неможливо втримати чи до кінця збагнути і що часто виявляється не таким, як очікують люди. Варіант «пара» зберігає цей образ, не стверджуючи, що ніщо не має сенсу. Можливі також переклади: «подих», «лише подих», «скороминуще». [б] Когелет — єврейське ім’я або титул автора. Його часто перекладають як «Учитель» або «Проповідник», але тут збережено форму «Когелет», щоб не віддати перевагу одному з можливих значень.'
- source_path: nt/john/001/001.yaml
  reference: Івана 1:1
  text: На початку[б] Слово вже існувало. Слово було з Богом, і Слово було Богом[а].
  translator_note: '[а] Можливі також переклади: «Слово було божественним» або «чим був Бог, тим було й Слово». Грецьке формулювання стверджує, що Слово повною мірою є Богом, водночас відрізняючи Слово від Бога, згаданого в попередній частині речення. [б] Цей початок перегукується з Буття 1:1 і пов’язує Слово з початком творіння. Вислів «вже існувало» передає тривале існування Слова на той час, коли настав початок, а не Його виникнення тоді; можливі також варіанти «було» та «існувало».'
- source_path: nt/romans/003/025.yaml
  reference: Римлян 3:25
  text: Бог явив Його як жертву примирення[а] через віру в Його кров[б]. Він зробив це, щоб показати Свою праведність[в], бо залишав без покарання гріхи, вчинені раніше.
  translator_note: '[а] Або «жертву умилостивлення»; або «віко примирення» — золоте віко Ковчега Завіту, на яке за Старого Завіту кропили кров’ю задля примирення. [б] Або «через віру, Його кров’ю». [в] Або «справедливість».'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Петра 1:13
  text: Тому приготуйте свій розум до дії[а]. Будьте цілковито тверезі й повністю покладіть свою надію на благодать, що приходить до вас під час об’явлення Ісуса Месії[б].
  translator_note: '[а] Грецький текст буквально каже: «підпережіть стегна свого розуму». Це образ людини, яка підбирає довгий одяг і закріплює його на поясі, щоб бути готовою діяти. [б] Грецьке слово, перекладене як «цілковито» та «повністю», може стосуватися тверезості думки, покладання надії або, можливо, обох висловів.'
