payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Полікарп до филип’ян
      author: Полікарп, єпископ Смирни. Деякі дослідники вважають, що збережений текст поєднує матеріали, надіслані в різний час.
      audience: Християнська громада у Филипах, яка попросила листи Ігнатія й отримала настанови про віру, поведінку, керівництво, гроші та витривалість.
      date: Початок — середина II століття н. е.; принаймні частина твору тісно пов’язана з подорожжю Ігнатія, тоді як припущення про складений характер листа допускають дещо пізніше датування певної його частини.
    Martyrdom of Polycarp:
      display_name: Мучеництво Полікарпа
      author: Анонімні члени церкви у Смирні, які писали від імені громади; прикінцеві примітки про передання тексту відображають його пізніше переписування й поширення.
      audience: Церква у Філомелії та ширша християнська спільнота, яким запропоновано розповідь про арешт, суд, смерть Полікарпа та його взірцеву витривалість.
      date: Написано після смерті Полікарпа, зазвичай датується серединою або другою половиною II століття н. е.; як точний рік мучеництва, так і остаточна форма документа залишаються предметом дискусій.
    Epistle to Diognetus:
      display_name: Послання до Діогнета
      author: Автор невідомий. Він називає себе учнем або тим, хто навчається, але ані його, ані адресата Діогнета неможливо впевнено ідентифікувати.
      audience: Освічений нехристиянин, який шукає відповідей, — і подібні до нього читачі, — запитуючи про християнське богопоклоніння, етику, суспільну ідентичність, любов та позірну новизну віри.
      date: Часто датується кінцем II або початком III століття н. е., хоча запропоновані датування дуже різняться; останні два розділи можуть походити з іншого твору.
    Fragments of Papias:
      display_name: Фрагменти Папія
      author: Папій, єпископ Ієраполя, є автором утраченого п’ятитомного твору «Тлумачення висловів Господа»; збережена збірка складається з цитат і повідомлень, переданих пізнішими авторами.
      audience: Ранні християни, які шукали збережених у пам’яті вчень про Ісуса й апостолів, зібраних через названі ланцюги усних свідчень і тлумачень.
      date: Твір Папія зазвичай датують початком II століття н. е., часто приблизно 110–130 роками; збережені фрагменти містяться у творах авторів, що писали від II століття й пізніше.
