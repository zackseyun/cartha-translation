review:
  verdict: revise
  review_summary: Виконано повну перевірку й внесено точкові мовні та смислові правки. Збережено всі ключі, номери розділів і повний склад каталогу; виправлено неточні або неприродні формулювання, зокрема щодо сакраментального навчання, грецької форми тексту та кількох назв розділів.
  issues:
  - У метаданих «Gospel of Philip» уточнено переклад «Valentinian-style sacramental instruction» як сакраментальне навчання, а також передано, що коптський рукопис є перекладом із давнішої грецької форми.
  - 'У низці заголовків усунуто додані відтінки або неприродні конструкції: «мовчазна співучасть», «двоєдушне життя», «мир ... перемагає», «піднесення ... слуги», «перетворює для безсмертного життя».'
  - Уточнено окремі формулювання, щоб вони точніше відтворювали англійські джерельні заголовки без конфесійного посилення.
