payload:
  book_metadata:
    Genesis:
      display_name: Буття
      author: Автор невідомий; традиційно авторство приписують Мойсеєві. Сучасні дослідники вважають, що книга має тривалу історію укладання, а її джерела пізніше були відредаговані й об’єднані.
      audience: Ізраїль як народ завіту, чия розповідь про походження спирається на Боже творіння, обрання та обітницю.
      date: Книгу укладали протягом століть; своєї остаточної форми вона набула приблизно у VI–V століттях до н. е., під час або після вавилонського полону.
      summary: Книга Буття розповідає про створення світу, бунт і розсіяння людства, а також про родину Авраама, Ісака, Якова та Йосипа, через яких починають здійснюватися Божі обітниці завіту з Ізраїлем.
    Exodus:
      display_name: Вихід
      author: Автор невідомий; традиційно авторство приписують Мойсеєві. Сучасні дослідники вважають, що книга має тривалу історію укладання, а її джерела пізніше були відредаговані й об’єднані.
      audience: Ізраїль як визволений народ, з яким укладено завіт і який навчається, що означає бути народом ГОСПОДА та жити за Його законом.
      date: Книгу укладали протягом століть; своєї остаточної форми вона набула приблизно у VI–V століттях до н. е.
    Leviticus:
      display_name: Левит
      author: Автор невідомий; традиційно авторство приписують Мойсеєві. Сучасні дослідники відносять книгу до Священницького джерела.
      audience: 'Ізраїльські священники та громада, що поклоняється Богові: настанови про жертвоприношення, святість і впорядкування життя довкола Божої присутності.'
      date: Різні шари тексту формувалися від пізнього періоду монархії до часу після полону (приблизно VII–V століття до н. е.).
