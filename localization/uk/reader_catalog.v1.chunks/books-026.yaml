    Letters of Ignatius:
      display_name: Листи Ігнатія
      author: Ігнатій, єпископ Антіохії, автор семи листів загальновизнаної середньої редакції; пізніші розширені та псевдонімні Ігнатієві листи не входять до цієї збірки.
      audience: Християнські громади в Ефесі, Магнесії, Траллах, Римі, Філадельфії та Смирні, а також Полікарп, до яких Ігнатій звертався під час своєї подорожі до мученицької смерті.
      date: Зазвичай датуються початком II століття н. е., найчастіше приблизно 105–117 роками, хоча точна хронологія подорожі Ігнатія залишається предметом дискусій.
