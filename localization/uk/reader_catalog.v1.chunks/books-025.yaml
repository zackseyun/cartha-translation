review:
  verdict: revise
  review_summary: Виправлено неточності у кількох заголовках і в описі аудиторії «Діянь Павла і Теклі». Усі поля повні, а назви книг, ключі розділів і структура збережені.
  issues:
  - «Joseph Releases Mary After Testing» перекладено так, ніби відпустили обох; виправлено на дію Йосипа щодо Марії.
  - «Thecla Longs Paul» передано як прагнення до Павла; виправлено як туга за Павлом.
  - «a woman's authority to teach» не означає «право»; виправлено на «авторитет жінки».
