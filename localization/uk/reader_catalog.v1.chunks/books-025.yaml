payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Євангеліє дитинства від Томи
      author: Автор невідомий. У найдавнішій формі тексту, яку можна відновити, автора не названо; приписування твору Томі з’явилося в пізніших заголовках рукописів і в процесі передавання тексту.
      audience: Християни, які цікавилися дитинством Ісуса й тим, як можна було оповісти про Божу силу, виховання, навчання та дорослішання до початку подій канонічних Євангелій.
      date: Зазвичай походження твору відносять до II століття н. е., проте текст зберігся в кількох істотно відмінних грецьких редакціях і ранніх перекладах.
    Acts of Paul and Thecla:
      display_name: Діяння Павла і Теклі
      author: Автор невідомий. Це епізод із ширших «Діянь Павла»; давнє повідомлення про те, що ці «Діяння» написав один пресвітер, не дає змоги достовірно встановити автора.
      audience: Християни, яких приваблювали розповіді про апостольську проповідь, безшлюбність, хрещення, витривалість, подібну до мученицької, а також про авторитет жінки навчати й свідчити.
      date: Твір написано у II столітті н. е., імовірно в його другій половині; він поширювався і в складі «Діянь Павла», і як окремий твір.
    Gospel of Peter:
      display_name: Євангеліє від Петра
      author: Автор невідомий. У збереженій оповіді розповідь ведеться від імені Петра, і твір передавався під його ім’ям, однак його не вважають працею історичного апостола.
      audience: Ранні християни, зацікавлені в розширеній оповіді про страждання та воскресіння, імовірно в громадах, де авторитет Петра мав особливу вагу.
      date: Твір зазвичай датують II століттям н. е.; основний збережений грецький фрагмент походить зі значно пізнішого рукопису, знайденого в Ахмімі.
    2 Clement:
      display_name: Друге послання Климента
      author: Автор невідомий. Попри традиційну назву, це ранньохристиянська проповідь, а не другий лист Климента Римського.
      audience: Християнська громада, яку закликають до покаяння, моральної послідовності, турботи про вразливих і вірної витривалості в надії на воскресіння та суд.
      date: Твір зазвичай датують першою половиною або серединою II століття н. е. (приблизно 100–160 рр.); місце його написання невідоме.
    Epistle of Barnabas:
      display_name: Послання Варнави
      author: Автор невідомий. Твір традиційно пов’язували з Варнавою, супутником Павла, але сучасні дослідники не приймають такого авторства.
      audience: Християни з неюдейського середовища, яких навчали вважати Писання Ізраїлю своєю спадщиною через христологічне й алегоричне тлумачення, водночас відмежовуючи свою завітну ідентичність від юдейських звичаїв.
      date: Твір зазвичай датують періодом між зруйнуванням Єрусалимського храму в 70 році н. е. та початком II століття, часто приблизно 80–130 роками.
