  review_summary: Повний переклад перевірено й виправлено. Уточнено кілька заголовків, де чернетка зміщувала зміст або суб’єкта дії; усі інші значення є повними та вірними канонічному англійському джерелу.
  issues:
  - '1 Еноха 47: усунено додане значення «знаходить відповідь»; відтворено дію «відповідає».'
  - '1 Еноха 57: «Holy Worship» перекладено як «святе поклоніння», а не як поклоніння, яке здійснюють святі.'
  - '1 Еноха 61: збережено нейтральне «міряють», без невказаного в джерелі відтінку розподілу.'
