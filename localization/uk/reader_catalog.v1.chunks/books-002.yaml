    Numbers:
      display_name: Числа
      author: Автор невідомий; традиційно авторство приписують Мойсеєві.
      audience: Ізраїль у дорозі між Єгиптом і обіцяною землею — покоління, що мандрувало пустелею, а також пізніші читачі, які вчилися на його помилках.
      date: Композиційні шари датують періодом від пізньої монархії до післявигнанського часу (прибл. VII–V ст. до н. е.).
    Deuteronomy:
      display_name: Повторення Закону
      author: Автор невідомий; текст подано як прощальні промови Мойсея. Сучасні дослідники пов’язують його основне ядро з реформою царя Йосії наприкінці VII ст. до н. е.
      audience: Ізраїль, який готується увійти в землю, — а також пізніші вигнанці, що запитували, як жити у вірності без храму й царя.
      date: Основне ядро — приблизно кінець VII ст. до н. е.; остаточної форми книга набула в період вигнання.
    Joshua:
      display_name: Ісус Навин
      author: Автор невідомий; книга є частиною Девтерономістичної історії.
      audience: Ізраїль за часів монархії та вигнання, який осмислював завоювання, завіт і значення землі.
      date: Укладено приблизно у VII–VI ст. до н. е. на основі давніших традицій.
