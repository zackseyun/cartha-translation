payload:
  book_metadata:
    Joel:
      display_name: Йоіл
      author: Йоіл, син Петуїла.
      audience: Юдея після вигнання, що сприймає навалу сарани як ознаку Дня ГОСПОДНЬОГО.
      date: Імовірно, близько V–IV століть до н. е.
    Amos:
      display_name: Амос
      author: Амос із Текоа, юдейський пастух, який проповідував на півночі.
      audience: Північний Ізраїль у період добробуту й несправедливості за правління Єровоама II.
      date: Близько 760–750 років до н. е.
    Obadiah:
      display_name: Овдій
      author: Овдій.
      audience: Юдея після того, як Едом зрадив Єрусалим; пророцтво про падіння Едому.
      date: Невдовзі після 586 року до н. е.
    Jonah:
      display_name: Йона
      author: Автор невідомий; головний герой — Йона, син Аміттая.
      audience: Ізраїль після вигнання; сатиричний докір за етнічну замкненість і утвердження Божого милосердя до чужинців.
      date: Імовірно, близько V–IV століть до н. е.
    Micah:
      display_name: Михей
      author: Михей із Морешета.
      audience: Юдея наприкінці VIII століття до н. е., особливо її сільська біднота, протиставлена міській верхівці.
      date: Близько 740–700 років до н. е.
    Nahum:
      display_name: Наум
      author: Наум з Елкоша.
      audience: Юдея, що радіє близькому падінню Ніневії.
      date: Незадовго до 612 року до н. е.
    Habakkuk:
      display_name: Авакум
      author: Авакум.
      audience: Юдея перед лицем піднесення Вавилона; діалог пророка з Богом про справедливість.
      date: Близько кінця VII століття до н. е.
    Zephaniah:
      display_name: Софонія
      author: Софонія, син Куші.
      audience: Юдея за правління Йосії, напередодні його реформ.
      date: Близько 640–609 років до н. е.
    Haggai:
      display_name: Огій
      author: Огій.
      audience: Ті, хто повернувся з вигнання й відбудовував храм за правління Дарія.
      date: 520 рік до н. е.
    Zechariah:
      display_name: Захарія
      author: Захарія, син Берехії; розділи 9–14, імовірно, належать пізнішому авторові.
      audience: Ті, хто повернувся з вигнання й відбудовував храм, а також пізніші громади після вигнання.
      date: Розділи 1–8 — близько 520–518 років до н. е.; 9–14 — можливо, століттям пізніше.
    Malachi:
      display_name: Малахія
      author: Автор невідомий; «Малахія» означає «мій посланець».
      audience: Юдея після вигнання, яка за перського правління стала недбалою в поклонінні та вірності.
      date: Близько середини V століття до н. е.
    Matthew:
      display_name: Матвій
      author: Автор невідомий; традиція приписує книгу апостолові Матвію. Сучасні дослідники вважають, що її написав грецькомовний автор із юдеохристиянського середовища, використовуючи Євангеліє від Марка та джерело, подібне до Q.
      audience: Юдеохристиянська громада, що осмислює тяглість і розрив із синагогальним юдаїзмом.
      date: Близько 80–90 років н. е.
    Mark:
      display_name: Марк
      author: Автор невідомий; традиція пов’язує книгу з Іваном Марком, супутником Петра.
      audience: Грецькомовна християнська громада, можливо в Римі, яка зазнавала переслідувань або жила під їхньою загрозою.
      date: Близько 65–75 років н. е., у період Юдейської війни та зруйнування храму.
