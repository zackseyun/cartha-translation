review:
  verdict: revise
  review_summary: Виконано повну перевірку й виправлено неточне ототожнення первосвященника Йошуа з Ісусом у заголовках Захарії 3 і 6, а також згладжено заголовок Матвія 1 для точного передання змісту джерела. Решта локалізації є повною та загалом вірно передає канонічні англійські значення без конфесійної адвокації.
  issues:
  - 'Захарія 3 і 6: «Joshua» не слід передавати як «Ісус», оскільки це створює хибне ототожнення з Ісусом із Євангелій; вжито «Йошуа».'
  - 'Матвія 1: початковий варіант був граматично й семантично неприродним; заголовок уточнено як народження Ісуса з роду Месії.'
