review:
  verdict: revise
  review_summary: Виправлено неточності в ARIA-мітці, окремих коротких UI-рядках і формулюванні опису підсвічування слів Ісуса; усі поля, ключі та заповнювач {placeholder} збережено.
  issues:
  - 'brandAria: у чернетці вжито неприродне «читач» замість назви/опису засобу читання.'
  - 'searchFor: «за» точніше передає англійське for у контексті пошукових збігів.'
  - 'spotlightBest: узгоджено коротку мітку з «найкращий збіг».'
  - 'pickerJesusWordsBody: відтворено обидві дії оригіналу — glow і shimmer.'
  - 'ariaDismiss: «Сховати» є відповідником UI-дії Dismiss, на відміну від «Відхилити».'
  - 'introQuote: дещо уточнено відтворення процесу оцифрування та максимальної відкритості без зміни змісту.'
