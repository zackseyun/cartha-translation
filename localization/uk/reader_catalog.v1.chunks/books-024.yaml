payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Іпостась архонтів
      author: Автор невідомий. Він тлумачить Книгу Буття через міф-одкровення про архонтів; цей твір не можна з певністю приписати якомусь відомому вчителеві.
      audience: Християни із сетіанського або спорідненого середовища, які читали Книгу Буття як розповідь про протистояння між невігласними космічними правителями, божественною мудрістю та духовним походженням людства.
      date: Зазвичай твір датують III століттям н. е.; він зберігся в коптській копії IV століття в Наг-Хаммадському кодексі II.
    On the Origin of the World:
      display_name: Про походження світу
      author: Автор невідомий. У творі поєднано й переосмислено кілька юдейських, християнських, платонічних і міфологічних традицій, але ім’я укладача не названо.
      audience: Читачі з християнського середовища з гностичними нахилами, які шукали альтернативну історію творення, космічних правителів, Софії, Адама та Єви й остаточної долі світу.
      date: Зазвичай твір датують III століттям н. е., хоча в його основі можуть лежати давніші матеріали; зберігся переважно в коптських рукописах IV століття.
    Sophia of Jesus Christ:
      display_name: Премудрість Ісуса Христа
      author: Автор невідомий. Він переробив матеріал, відомий також із твору «Євгност», на діалог Ісуса з учнями після воскресіння.
      audience: Християни, зацікавлені в одкровенні мудрості про трансцендентного Бога, устрій небесного світу, а також походження і спасіння душі.
      date: Твір часто датують кінцем II або III століттям н. е.; він зберігся в коптських копіях із Наг-Хаммаді та Берлінського кодексу.
    Gospel of the Egyptians:
      display_name: Євангеліє єгиптян
      author: Автор невідомий. Цей твір із Наг-Хаммаді, відомий також як «Священна книга Великого Невидимого Духа», відрізняється від давнішого грецького «Євангелія єгиптян», відомого лише за цитатами.
      audience: Сетіанська християнська громада, яка за допомогою складної міфології, священних імен, образів хрещення та гімнічної хвали виражала свою духовну ідентичність і сподівання на визволення.
      date: Зазвичай твір відносять до II або III століття н. е.; дві його коптські копії збереглися в Наг-Хаммадських кодексах IV століття.
    Letter of Peter to Philip:
      display_name: Послання Петра до Филипа
      author: Автор невідомий. Короткий вступний лист і подальше одкровення псевдонімно приписано Петрові й Филипові, а не написано достовірно кимось із цих апостолів.
      audience: Християни, які шукали апостольського підтвердження вчення про Спасителя, ворожі сили, страждання, місію та відновлення учнів.
      date: Зазвичай твір датують кінцем II або початком III століття н. е.; він зберігся в Наг-Хаммадській копії IV століття та в пізнішому коптському рукописі.
    Gospel of Judas:
      display_name: Євангеліє Юди
      author: Автор невідомий. Назва приписує оповідь Юді, проте сам твір не підтверджує, що його історичним автором був Юда Іскаріот.
      audience: Християнська група, критично налаштована до жертовних і церковних практик своїх опонентів, яка за допомогою діалогу-одкровення та космології сетіанського типу по-новому тлумачила Юду і смерть Ісуса.
      date: Зазвичай твір датують серединою або кінцем II століття н. е.; Іриней знав «Євангеліє Юди» близько 180 року, а збережена коптська копія, ймовірно, належить до III або IV століття.
    Protoevangelium of James:
      display_name: Протоєвангеліє Якова
      author: Автор невідомий. Оповідач називає себе Яковом, але твір є псевдонімним і не був написаний Яковом, братом Ісуса.
      audience: Християни, зацікавлені в народженні та вихованні Марії, її довічній чистоті, Різдві Ісуса й оповідних відповідях на питання, які залишили відкритими Матвій і Лука.
      date: Зазвичай твір датують другою половиною II століття н. е.; він зберігся в численних пізніших грецьких рукописах і давніх перекладах.
