payload:
  book_metadata:
    Gospel of Mary:
      display_name: Євангеліє від Марії
      author: Автор невідомий. У творі Марію представлено як ту, що отримала й витлумачила одкровення Ісуса, однак у ньому не стверджується, що збережене Євангеліє написала Марія.
      audience: Ранні християнські читачі, які осмислювали одкровення, духовне сходження, апостольський авторитет і правомірність учення Марії серед учнів Ісуса.
      date: Зазвичай датується II століттям н. е.; збереглися грецькі фрагменти III століття, а головний коптський текст міститься в Берлінському кодексі 8502 V століття.
    Treatise on the Resurrection:
      display_name: Трактат про воскресіння
      author: Автор невідомий. Твір має форму листа вчителя до учня на ім’я Регін; ані вчителя, ані Регіна неможливо достовірно ототожнити з відомими особами.
      audience: Християни, які шукали настанов про воскресіння, особливо читачі, що розмірковували про тілесний і духовний виміри воскресіння та про участь у воскреслому житті вже тепер.
      date: Зазвичай відноситься до кінця II століття н. е. (часто приблизно до 170–200 років); зберігся в коптській копії IV століття давнішого грецького твору.
    Dialogue of the Savior:
      display_name: Діалог Спасителя
      author: Автор невідомий. У діалозі одкровення подано як учення з уст Ісуса в розмові з Юдою, Матвієм і Марією, але укладача твору не названо.
      audience: Ранньохристиянське коло, зацікавлене в особистому одкровенні, учнівстві, самопізнанні, молитві та аскетичному приготуванні до спасіння.
      date: Зазвичай відноситься до II століття н. е., хоча етапи укладання та точне датування залишаються спірними; зберігся в коптському рукописі IV століття.
    Exegesis on the Soul:
      display_name: Тлумачення про душу
      author: Автор невідомий. Автор — християнський проповідник, який переосмислює біблійні та грецькі літературні образи як алегорію падіння, покаяння й відновлення душі.
      audience: Християни, обізнані з Писанням і моральними настановами, яких закликали відвернутися від невпорядкованих бажань, покаятися та знову з’єднатися з божественним.
      date: Загалом датується кінцем II або початком III століття н. е.; зберігся в коптському перекладі з грецької, виконаному в IV столітті.
    Book of Thomas the Contender:
      display_name: Книга Томи Подвижника
      author: Автор невідомий. У кінцевій назві твір пов’язано з Юдою Томою, а Маттаю названо записувачем, проте це літературні атрибуції, а не підтверджені відомості про авторство.
      audience: Схильні до аскези християни, яких закликали шукати самопізнання, опиратися тілесним пристрастям і осягати особисті настанови Ісуса Томі.
      date: Часто датується кінцем II або початком III століття н. е.; можливо, виник у сирійському християнському середовищі. Зберігся в коптському рукописі IV століття.
    Tripartite Tractate:
      display_name: Тричастинний трактат
      author: Автор невідомий. Автор був високоосвіченим християнським богословом валентиніанської традиції; достовірно ототожнити його з будь-яким відомим учителем неможливо.
      audience: Валентиніанська християнська громада, яка отримувала докладні настанови про Бога, еони, творіння, Христа, церкву, спасіння та остаточне відновлення.
      date: Зазвичай датується III століттям н. е., хоча дехто обстоює датування його другою половиною; зберігся коптською мовою в Кодексі Юнга IV століття.
    Apocryphon of John:
      display_name: Апокриф Івана
      author: Автор невідомий. Твір псевдонімно подає одкровення воскреслого Ісуса Іванові, сину Зеведея, і зберігся в кількох давніх редакціях.
      audience: Християни сетіанської або близької до неї традиції одкровення, які шукали пояснення божественного світу, творіння, людської ідентичності та визволення від ворожих правителів.
      date: Рання форма, ймовірно, була в обігу у II столітті н. е.; збережені коптські свідки, що містять коротшу й довшу редакції, датуються IV і V століттями.
