payload:
  book_metadata:
    Proverbs:
      display_name: Приповісті
      author: Збірка творів; у заголовках названо Соломона, Агура, Лемуїла та «мудрих».
      audience: Молоді ізраїльтяни, яких наставляли в мудрості для повсякденного життя.
      date: Різні шари тексту складалися приблизно в X–IV століттях до н. е.
    Ecclesiastes:
      display_name: Екклезіаст
      author: Автор невідомий; промовець називає себе «Когелетом», якого традиційно ототожнюють із Соломоном.
      audience: Ізраїльтяни, які стикалися з обмеженістю мудрості, багатства й людських зусиль під сонцем.
      date: Імовірно, приблизно V–III століття до н. е., судячи з арамейського впливу на давньоєврейську мову тексту.
    Song of Solomon:
      display_name: Пісня над піснями
      author: Автор невідомий; у заголовку згадується Соломон.
      audience: Ізраїль, який сприймав еротичне кохання як образ близькості завіту, а згодом — юдейські та християнські читачі, які тлумачили книгу алегорично.
      date: Імовірно, після вигнання, приблизно у V–III століттях до н. е.
