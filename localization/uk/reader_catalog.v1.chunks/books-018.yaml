payload:
  book_metadata:
    2 Esdras:
      display_name: 2 Ездри
      author: Анонімний твір із відредагованим християнами обрамленням навколо первісно юдейського ядра (4 Ездри, розділи 3–14).
      audience: Юдеї після 70 року н. е., які намагалися осмислити проблему теодицеї; пізніше текст було розширено для читачів-християн.
      date: Юдейське ядро — близько 100 року н. е.; християнські доповнення — приблизно II–III століття н. е.
    Didache:
      display_name: Дідахе
      author: Анонімний твір (назва означає «Вчення дванадцятьох апостолів»).
      audience: Ранні християнські громади — короткий посібник з етики, хрещення, євхаристії та ставлення до мандрівних учителів.
      date: Приблизно кінець I — початок II століття н. е.
    Gospel of Thomas:
      display_name: Євангеліє від Томи
      author: Автор невідомий; у вступі збірку висловів приписано «Дидиму Юді Томі». Повністю текст зберігся лише в коптському перекладі IV століття з Наг-Хаммаді (NHC II,2); також відомі три грецькі фрагменти з Оксіринха.
      audience: Християнські читачі, на яких вплинули сирійська традиція мудрості та протогностична думка й для яких важливим було езотеричне самопізнання через вислови Ісуса.
      date: Грецький оригінал, імовірно, було створено приблизно між 50 і 140 роками н. е.; коптський рукопис — близько 340 року н. е.
      summary: Євангеліє від Томи — це збірка висловів, приписуваних Ісусові. У ньому немає безперервної оповіді, і воно неодноразово закликає читачів відкривати значення цих висловів.
