review:
  verdict: revise
  review_summary: Повний український каталог відредаговано. Виправлено кілька неточних або стилістично невдалих відповідників, зокрема в метаданих Псалмів та в заголовках, де початковий переклад звужував або змінював зміст англійського джерела.
  issues:
  - 'Psalms.author: «Корея» виправлено на нормативне «Кораха».'
  - 'Ezra 3: «попри страх» уточнено як «зі страхом», що точніше передає fearfully.'
  - 'Job 19: вилучено додане «зустріти»; заголовок передає прагнення Визволителя.'
  - 'Job 33: додано адресата заклику Елігу для ясності та збереження змісту.'
  - 'Psalms.audience: «голосить у скорботі» замінено нейтральним і природним «нарікає».'
