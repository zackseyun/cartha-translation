  book_metadata:
    Ezra:
      display_name: Ездра
      author: Анонімний автор; можливо, текст належить тому самому авторові або укладачеві, що й книги Хронік.
      audience: Поверненці, які відбудовували Єрусалим під перською владою.
      date: Бл. середини V — IV століття до н. е.
    Nehemiah:
      display_name: Негемія
      author: Анонімний автор; текст містить спогади від першої особи, які приписують Негемії.
      audience: Поверненці, які відбудовували мури Єрусалима й поновлювали завіт під перською владою.
      date: Бл. середини V — IV століття до н. е.
    Esther:
      display_name: Естер
      author: Анонімний автор.
      audience: Юдеї діаспори під чужоземною владою, особливо в Персії.
      date: Бл. пізнього перського або раннього елліністичного періоду (IV–III століття до н. е.).
    Job:
      display_name: Йов
      author: Анонімний автор.
      audience: Ізраїльтяни, які намагалися осмислити страждання невинних і Божу справедливість.
      date: За загальноприйнятим поглядом дослідників традиції мудрості, книга датується приблизно VI–IV століттями до н. е. й спирається на давніший народний матеріал.
    Psalms:
      display_name: Псалми
      author: Багато авторів упродовж століть; у надписах названо Давида, Асафа, Кораха, Соломона, Мойсея та інших.
      audience: Ізраїль і храмова громада під час богослужіння, а також кожна пізніша спільнота, що молиться й нарікає.
      date: Створені приблизно в X–III століттях до н. е.; остаточно укладені в післявигнанський період.
