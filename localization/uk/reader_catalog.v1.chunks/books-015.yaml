  book_metadata:
    1 Esdras:
      display_name: 1 Ездри
      author: Автор невідомий; грецька переробка зі зміненим порядком матеріалу з 2 Хронік 35–36, Ездри та Неемії 7–8.
      audience: Юдеї елліністичного періоду, які прагнули мати цілісну розповідь про повернення та відновлення.
      date: Бл. II–I ст. до н. е.
    Prayer of Manasseh:
      display_name: Молитва Манасії
      author: Автор невідомий; твір псевдонімно приписано цареві Манасії.
      audience: Люди, які каються та ототожнюють себе з покаянням Манасії; у деяких традиціях твір використовують у богослужінні.
      date: Бл. II–I ст. до н. е.
    Psalm 151:
      display_name: Псалом 151
      author: Автор невідомий; твір псевдонімно приписано Давидові. Єврейську форму засвідчено в 11QPsa.
      audience: Громади діаспори та Кумрану, віддані Давидовому Псалтирю.
      date: Бл. II ст. до н. е. або раніше.
    3 Maccabees:
      display_name: 3 Макавеїв
      author: Автор невідомий; твір написано грецькою мовою.
      audience: Грекомовні юдеї єгипетської діаспори; розповідь про визволення, події якої відбуваються за Птолемея IV.
      date: Бл. I ст. до н. е. — I ст. н. е.
    4 Maccabees:
      display_name: 4 Макавеїв
      author: Автор невідомий; грекомовний юдейський автор, на якого вплинула стоїчна філософія.
      audience: Юдеї елліністичного світу; філософська проповідь про те, як розум завдяки вірності опановує пристрасті.
      date: Бл. I ст. н. е.
    Bel and the Dragon:
      display_name: Бел і Дракон
      author: Автор невідомий; одне з грецьких доповнень до Даниїла.
      audience: Грекомовні юдеї; глузлива полеміка проти ідолопоклонства.
      date: Бл. II–I ст. до н. е.
    Letter of Jeremiah:
      display_name: Послання Єремії
      author: Автор невідомий; твір псевдонімно приписано Єремії.
      audience: Юдеї діаспори, яких спокушало навколишнє ідолопоклонство.
      date: Бл. IV–II ст. до н. е.
    Prayer of Azariah and Song of the Three:
      display_name: Молитва Азарії та Пісня трьох юнаків
      author: Автор невідомий; одне з грецьких доповнень до Даниїла.
      audience: Грекомовні юдеї; богослужбовий матеріал до 3-го розділу Даниїла.
      date: Бл. II ст. до н. е.
    Susanna:
      display_name: Сусанна
      author: Автор невідомий; одне з грецьких доповнень до Даниїла.
      audience: Грекомовні юдеї; розповідь про праведність і викриття неправдивого свідчення.
      date: Бл. II–I ст. до н. е.
    1 Clement:
      display_name: 1 Климента
      author: Автор невідомий; твір приписують Клименту Римському.
      audience: Християнська громада в Коринті, охоплена суперечкою щодо керівництва.
      date: Бл. 96 р. н. е.
