      '6':
        title: Священники дбайливо поводяться з приношеннями
      '7':
        title: Пояснення жертв за провину та мирних жертв
      '8':
        title: Посвячення Аарона на священника
      '9':
        title: Вогонь пожирає явлену жертву
      '10':
