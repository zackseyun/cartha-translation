        title: Гостинність урятувала Лота
      '12':
        title: Рахав вірно переховує розвідників
      '13':
        title: Смиряймося й шукаймо Господа
      '14':
        title: Ставмося одне до одного лагідно
      '15':
        title: Прагнімо миру, поєднаного з побожністю
      '16':
        title: Месія прийшов у покорі й смиренні
      '17':
        title: Наслідуймо пророків, які жили суворо
