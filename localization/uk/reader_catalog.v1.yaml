    author: Автор невідомий; традиція пов’язує книгу з Іваном Марком, супутником Петра.
    audience: Грецькомовна християнська громада, можливо в Римі, яка зазнавала переслідувань або жила під їхньою загрозою.
    date: Близько 65–75 років н. е., у період Юдейської війни та зруйнування храму.
    chapters:
      '1':
        title: Ісус проповідує Боже Царство
      '2':
        title: Ісус зцілює і прощає гріхи
      '3':
        title: Ісус обирає дванадцятьох учнів
      '4':
        title: Ісус навчає притчами біля моря
      '5':
        title: Ісус зцілює чоловіка з іншого народу
      '6':
        title: Ісус годує п’ять тисяч людей
      '7':
        title: Ісус викриває людські традиції
      '8':
        title: Ісус годує чотири тисячі людей
      '9':
        title: Ісус являє Свою славу
      '10':
        title: Ісус приймає дітей у Царство
      '11':
        title: Ісус входить у Єрусалим під вигуки хвали
      '12':
        title: Ісус відповідає на підступні запитання й навчає
      '13':
        title: Ісус навчає про прийдешні лиха
      '14':
        title: Юда вночі зраджує Ісуса
      '15':
        title: Ісуса розпинають і віддано ховають
      '16':
        title: Ісус воскресає, і жінки сповіщають про це
  Luke:
    display_name: Лука
    author: Автор невідомий; традиція приписує авторство Луці, супутнику Павла в подорожах.
    audience: Освічені греко-римські читачі-християни; твір адресовано «Теофілу».
    date: бл. 80–90 рр. н. е.
    chapters:
      '1':
        title: Бог звіщає про два чудесні народження
      '2':
        title: Народження Ісуса приносить радість
      '3':
        title: Іван готує дорогу для Ісуса
      '4':
        title: Ісус протистоїть спокусі й починає служіння
      '5':
        title: Ісус кличе рибалок ловити людей
      '6':
        title: Ісус обирає дванадцятьох апостолів
      '7':
        title: Ісус зцілює слугу сотника
      '8':
        title: Ісус навчає притчами про Царство
      '9':
        title: Ісус вимагає цілковитої відданості
      '10':
        title: Ісус посилає учнів
      '11':
        title: Ісус навчає наполегливо молитися
      '12':
        title: Ісус застерігає від лицемірства
      '13':
        title: Ісус застерігає та зцілює
      '14':
        title: Ісус навчає смирення й щедрості
      '15':
        title: Ісус приймає заблудлих грішників
      '16':
        title: Ісус засуджує поклоніння багатству
      '17':
        title: Ісус застерігає учнів і закликає служити
      '18':
        title: Ісус навчає наполегливо молитися
      '19':
        title: Ісус спасає Закхея в Єрихоні
      '20':
        title: Ісус кидає виклик храмовим провідникам
      '21':
        title: Дар вдови та прийдешні лиха
      '22':
        title: Ісус молиться на Оливній горі
      '23':
        title: Ісуса ховають у новій гробниці
      '24':
        title: Ісус воскресає й проголошує прощення
  John:
    display_name: Іван
    author: Автор невідомий; традиція приписує авторство апостолу Івану або «улюбленому учневі».
    audience: Християнська спільнота, що перебувала в напружених відносинах із синагогальним юдаїзмом і сформувалася навколо свідчення улюбленого учня.
    date: бл. 90–110 рр. н. е.
    summary: Іван представляє Ісуса як вічне Слово, яке відкриває Отця, дає життя через довіру до Нього та прославляється через Свої знамення, смерть і воскресіння.
    chapters:
      '1':
        title: Слово стає тілом
      '2':
        title: Ісус перетворює воду на вино
      '3':
        title: Бог віддає Свого улюбленого Сина
      '4':
        title: Ісус зустрічає самарянку
      '5':
        title: Ісус зцілює чоловіка в суботу
      '6':
        title: Ісус годує п’ятитисячний натовп
      '7':
        title: Ісус навчає на святі
      '8':
        title: Ісуса, Світло світу, відкидають
      '9':
        title: Ісус зцілює сліпого
      '10':
        title: Ісус говорить про Своїх овець
      '11':
        title: Ісус воскрешає Лазаря з мертвих
      '12':
        title: Марія помазує Ісуса перед похованням
      '13':
        title: Ісус миє ноги учням
      '14':
        title: Ісус обіцяє Святого Духа
      '15':
        title: Ісус — справжня виноградна лоза, що очищає гілки
      '16':
        title: Надходять труднощі, але радість залишається
      '17':
        title: Ісус молиться за Своїх учнів
      '18':
        title: Ісуса заарештовують, а Петро зрікається Його
      '19':
        title: Ісуса бичують, висміюють і розпинають
      '20':
        title: Ісус являється Марії
      '21':
        title: Ісус відновлює Петра біля моря
  Acts:
    display_name: Дії
    author: Автор невідомий; той самий, що й автор Євангелія від Луки.
    audience: Греко-римські читачі-християни; друга частина твору, адресованого Теофілу.
    date: бл. 80–90 рр. н. е.
    chapters:
      '1':
        title: Свідки чекають на Духа
      '2':
        title: Дух запалює П’ятидесятницю
      '3':
        title: Петро зцілює кульгавого жебрака
      '4':
        title: Апостоли говорять зі святою сміливістю
      '5':
        title: Суд і чудеса випробовують церкву
      '6':
        title: Семеро служителів підтримують церкву
      '7':
        title: Степан бачить відкрите небо
      '8':
        title: Добра звістка досягає Самарії
      '9':
        title: Савло зустрічає воскреслого Ісуса
      '10':
        title: Люди з інших народів отримують Святого Духа
      '11':
        title: Петро обстоює прийняття людей з інших народів
      '12':
        title: Ангел визволяє Петра
      '13':
        title: Павло починає місію серед інших народів
      '14':
        title: Павло витримує переслідування
      '15':
        title: Єрусалимська рада приймає людей з інших народів
      '16':
        title: Поклоніння відчиняє в’язницю
      '17':
        title: Павло звіщає про невідомого Бога
      '18':
        title: Добра звістка досягає Коринта
      '19':
        title: В Ефесі здіймається бунт через Артеміду
      '20':
        title: Павло зі сльозами прощається зі старійшинами
      '21':
        title: Павло повертається до Єрусалима
      '22':
        title: Павло захищає своє покликання
      '23':
        title: Павло постає перед радою
      '24':
        title: Павло свідчить перед Феліксом
      '25':
        title: Павло звертається до кесаря
      '26':
        title: Павло свідчить перед Агриппою
      '27':
        title: Бог зберігає Павла під час кораблетрощі
      '28':
        title: Добра звістка приходить до Рима
  Romans:
    display_name: До римлян
    author: Павло, разом із писарем Тертієм.
    audience: Християни в Римі — віруючі з юдеїв та інших народів, між якими були суперечності щодо Тори й ідентичності.
    date: бл. 56–58 рр. н. е.; написано в Коринті.
    chapters:
      '1':
        title: Павло звіщає праведність Ісуса
      '2':
        title: Суд приходить без упередженості
      '3':
        title: Усі винні під владою гріха
      '4':
        title: Авраам виправданий тільки вірою
      '5':
        title: Праведність через смерть Христа
      '6':
        title: Живіть для Бога, а не для гріха
      '7':
        title: Віруючі борються з гріхом
      '8':
        title: Ніщо не відділить нас від Христа
      '9':
        title: Милість і гнів щодо Ізраїлю
      '10':
        title: Спасіння близьке для всіх
      '11':
        title: Язичники покликані благодаттю
      '12':
        title: Віддайте своє життя як живу жертву
      '13':
        title: Коріться владі та любіть
      '14':
        title: Приймайте слабких у вірі
      '15':
        title: Єдність юдеїв і язичників
      '16':
        title: Вітання та застереження
  1 Corinthians:
    display_name: 1 Коринтян
    author: Павло, разом із Состеном.
    audience: Схильна до чвар християнська громада в Коринті.
    date: бл. 53–55 рр. н. е., написано в Ефесі.
    chapters:
      '1':
        title: Божі щедрі дари для всіх
      '2':
        title: Відкрита мудрість від Божого Духа
      '3':
        title: Павло застерігає коринтян щодо храму
      '4':
        title: Вірність важливіша за гордість
      '5':
        title: Павло наказує застосовувати церковну дисципліну
      '6':
        title: Розв’язуйте суперечки всередині церкви
      '7':
        title: Павло навчає шанувати шлюб
      '8':
        title: Любов важливіша за особисту свободу
      '9':
        title: Павло відстоює своє апостольство, не вимагаючи плати
      '10':
        title: Ізраїль як застереження для Божого народу
      '11':
        title: Єдність у поклонінні шанує Христа
      '12':
        title: Дари Духа зміцнюють єдність церкви
      '13':
        title: Любов ніколи не відступає
      '14':
        title: Павло закликає дбати про любов, а не про враження
      '15':
        title: Христос воскресає, а смерть зазнає поразки
      '16':
        title: Пожертви та плани подорожі
  2 Corinthians:
    display_name: 2 Коринтян
    author: Павло, разом із Тимофієм.
    audience: Коринтська громада після болісного конфлікту.
    date: бл. 55–56 рр. н. е.
    chapters:
      '1':
        title: Божа втіха у стражданнях
      '2':
        title: Заклик до любові та прощення
      '3':
        title: Змінені життя засвідчують служіння
      '4':
        title: Звіщення слави Христа
      '5':
        title: Любов Христа спонукає до служіння
      '6':
        title: Витримуйте страждання заради Бога
      '7':
        title: Прагніть святості з благоговінням
      '8':
        title: Благодать македонців надихає давати
      '9':
        title: Радісно давайте для святих
      '10':
        title: Лагідність Христа
      '11':
        title: Ревність за вірне життя
      '12':
        title: Хваліться слабкістю та благодаттю
      '13':
        title: Перевіряймо себе, чи не живемо в гріху
  Galatians:
    display_name: Галатів
    author: Павло.
    audience: Християнські громади в Галатії (центральна Анатолія), яких спонукали прийняти обрізання й дотримуватися Тори.
    date: бл. 48–55 рр. н. е. (датування дискусійне).
    chapters:
      '1':
        title: Павло захищає своє Євангеліє
      '2':
        title: Павло викриває помилку Петра
      '3':
        title: Віра Авраама виправдовує
      '4':
        title: Христос звільняє нас від Закону
      '5':
        title: Живіть вірою, а не Законом
      '6':
        title: Носіть тягарі одне одного
  Ephesians:
    display_name: Ефесян
    author: Павло або близький учень, який писав від імені Павла (питання дискусійне).
    audience: Широке коло християн із провінції Азія; назва міста «Ефес» відсутня в найдавніших рукописах.
    date: бл. 60-х рр. н. е., якщо автором був Павло; бл. 80–90-х рр. н. е., якщо твір написано від його імені.
    chapters:
      '1':
        title: Божа благодать, якою запечатано віруючих
      '2':
        title: Христос приносить мир усім
      '3':
        title: Таємниця, відкрита через Євангеліє
      '4':
        title: Молитва про єдність у тілі Христа
      '5':
        title: Наслідуйте Бога й живіть мудро
      '6':
        title: Діти, слухайтеся батьків і шануйте їх
  Philippians:
    display_name: Филип’ян
    author: Павло, разом із Тимофієм.
    audience: Християнська громада у Филипах, римській колонії в Македонії.
    date: бл. 60–62 рр. н. е., написано у в’язниці.
    chapters:
      '1':
        title: Павло молиться за филип’ян
      '2':
        title: Ісус смиренний і звеличений
      '3':
        title: Радійте, пізнаючи Христа
      '4':
        title: Стійте твердо з радістю
  Colossians:
    display_name: Колосян
    author: Павло, разом із Тимофієм, — або близький учень, який писав від імені Павла (питання дискусійне).
    audience: Християни в Колосах, у долині річки Лік, які зіткнулися із синкретичним ученням.
    date: бл. 60–62 рр. н. е., якщо автором був Павло; пізніше, якщо твір написано від його імені.
    chapters:
      '1':
        title: Павло молиться за віру колосян
      '2':
        title: Павло закликає віруючих триматися Христа
      '3':
        title: Відкиньте гріх і живіть у любові
      '4':
        title: Павло просить молитися за нього у кайданах і підбадьорює
  1 Thessalonians:
    display_name: 1 Солунян
    author: Павло, разом із Силуаном і Тимофієм.
    audience: Молода християнська громада в Солуні, яка зазнавала переслідувань.
    date: бл. 50–51 рр. н. е. — імовірно, найдавніший зі збережених листів Павла.
    chapters:
      '1':
        title: Благодать, мир, віра, любов і надія
      '2':
        title: Сміливе проповідування з чистими намірами
      '3':
        title: Тимофій підбадьорює у стражданнях
      '4':
        title: Павло закликає до святого життя
      '5':
        title: Пильнуйте, очікуючи спасіння
  2 Thessalonians:
    display_name: 2 Солунян
    author: Павло (питання дискусійне; деякі дослідники вважають, що лист написано від його імені).
    audience: Солунська громада, у якій виникла плутанина щодо останніх подій.
    date: бл. 51 р. н. е., якщо автором був Павло.
    chapters:
      '1':
        title: Бог винагороджує вірних, яких переслідують
      '2':
        title: Перед приходом Христа станеться відступництво
      '3':
        title: Павло молиться за зростання церкви
  1 Timothy:
    display_name: 1 Тимофію
    author: Павло або учень, який писав від імені Павла (Пастирські послання багато дослідників вважають написаними від його імені).
    audience: Тимофій як представник Павла в Ефесі; настанови щодо пізнішого устрою церкви.
    date: бл. середини 60-х рр. н. е., якщо автором був Павло; бл. 90–110 рр. н. е., якщо твір написано від його імені.
    chapters:
      '1':
        title: Павло просить Тимофія залишитися
      '2':
        title: Моліться за правителів і живіть мирно
      '3':
        title: Необхідні якості церковних керівників
      '4':
        title: Відкидай неправдивих учителів і міфи
      '5':
        title: Належно шануй вдів і старійшин
      '6':
        title: Павло наставляє Тимофія щодо багатства
  2 Timothy:
    display_name: 2 Тимофію
    author: Павло або учень, який писав від імені Павла.
    audience: Тимофій — лист подано як прощальне послання Павла з в’язниці.
    date: бл. середини 60-х рр. н. е., якщо автором був Павло; бл. 90–110 рр. н. е., якщо твір написано від його імені.
    chapters:
      '1':
        title: Тимофію, твердо тримайся благодаті
      '2':
        title: Знось страждання заради Христа
      '3':
        title: Застереження уникати неправдивих учителів
      '4':
        title: Вірно проповідуй усім
  Titus:
    display_name: Титу
    author: Павло або учень, який писав від імені Павла.
    audience: Тит як представник Павла на Криті.
    date: бл. середини 60-х рр. н. е., якщо автором був Павло; бл. 90–110 рр. н. е., якщо твір написано від його імені.
    chapters:
      '1':
        title: Павло наставляє Тита на Криті
      '2':
        title: Навчай людей різного віку жити за благодаттю
      '3':
        title: Живіть смиренно, очікуючи Христа
  Philemon:
    display_name: Филимону
    author: Павло, разом із Тимофієм.
    audience: Филимон, християнин-рабовласник, у справі його раба-втікача Онисима.
    date: бл. 60–62 рр. н. е.
    chapters:
      '1':
        title: Павло просить звільнити Онисима
  Hebrews:
    display_name: Євреїв
    author: Автор невідомий. Традиція називала Павла, Аполлоса, Варнаву, Прискиллу та інших; жодна з версій не має загальної згоди.
    audience: Грекомовні християни юдейського походження, які могли відійти від свого християнського сповідання.
    date: бл. 60–95 рр. н. е.
    chapters:
      '1':
        title: Бог говорить через Свого Сина
      '2':
        title: Ісус спасає через страждання
      '3':
        title: Зосередьтеся на вірному Ісусі
      '4':
        title: Увійдіть в обіцяний Богом спочинок
      '5':
        title: Христос приніс досконалу жертву
      '6':
        title: Прямуйте до духовної зрілості
      '7':
        title: Ісус — священник навіки за чином Мелхиседека
      '8':
        title: Новий Завіт через кров Ісуса
      '9':
        title: Ісус входить до справжньої небесної святині
      '10':
        title: Наближаймося завдяки крові Христа
      '11':
        title: Віра предків залишається непохитною
      '12':
        title: Зносіть страждання разом з Ісусом
      '13':
        title: Живіть у любові й довірі
  James:
    display_name: Якова
    author: Традиційно автором вважають Якова, брата Ісуса; сучасні дослідники не мають єдиної думки, чи авторство справжнє, чи псевдонімне.
    audience: Юдеохристиянські громади в діаспорі.
    date: Бл. 50–60-х років н. е., якщо авторство справжнє; бл. кінця I століття н. е., якщо псевдонімне.
    chapters:
      '1':
        title: Випробувана віра витримує
      '2':
        title: Віра без діл мертва
      '3':
        title: Приборкуйте язик і говоріть мудро
      '4':
        title: Сварки виникають через егоїзм
      '5':
        title: Наближається суд над багатими гнобителями
  1 Peter:
    display_name: 1 Петра
    author: Традиційно автором вважають апостола Петра, а Силуана — писарем; деякі дослідники вважають авторство псевдонімним.
    audience: Християни в римській Малій Азії, які зазнавали ворожості з боку суспільства.
    date: Бл. 60-х років н. е., якщо автором був Петро; бл. 70–90-х років н. е., якщо авторство псевдонімне.
    chapters:
      '1':
        title: Надія на небесну спадщину
      '2':
        title: Віряни збудовані на живому камені
      '3':
        title: Дружини вшановують Христа своїм життям
      '4':
        title: Страждайте за те, що чините добро
      '5':
        title: Старійшини піклуються, подаючи приклад віри
  2 Peter:
    display_name: 2 Петра
    author: Традиційно автором вважають Петра; у сучасній науці поширена думка, що авторство псевдонімне.
    audience: Християни, які стикалися з насмішниками, що заперечували парусію.
    date: Бл. початку II століття н. е.
    chapters:
      '1':
        title: Петро навчає духовного зростання
      '2':
        title: Лжевчителі накликають швидкий суд
      '3':
        title: Петро застерігає про останній суд
  1 John:
    display_name: 1 Івана
    author: Автор невідомий; традиційно ним вважають апостола Івана або старійшину з Іванового кола.
    audience: Іванова спільнота після розколу, яка з’ясовувала, хто до неї належить.
    date: Бл. 90–110 років н. е.
    chapters:
      '1':
        title: Світло виявляє справжню єдність
      '2':
        title: Любов спонукає виконувати Божі заповіді
      '3':
        title: Народжені від Бога перемагають гріх
      '4':
        title: Справжня любов походить від Бога
      '5':
        title: Хто вірить в Ісуса, має вічне життя
  2 John:
    display_name: 2 Івана
    author: «Старійшина».
    audience: Конкретна християнська громада («обрана пані»), яку застерігають від лжевчителів.
    date: Бл. 90–110 років н. е.
    chapters:
      '1':
        title: Старійшина застерігає від лжевчителів
  3 John:
    display_name: 3 Івана
    author: «Старійшина».
    audience: Гай — один із провідників, який приймав мандрівних місіонерів.
    date: Бл. 90–110 років н. е.
    chapters:
      '1':
        title: Старійшина молиться за добробут Гая
  Jude:
    display_name: Юди
    author: Традиційно автором вважають Юду, брата Якова та Ісуса.
    audience: Християнські громади, до яких проникали вчителі розпусного способу життя.
    date: Бл. 60–90-х років н. е.
    chapters:
      '1':
        title: Юда застерігає від безбожних чужинців
  Revelation:
    display_name: Об’явлення
    author: Іван із Патмосу (стиль твору відрізняється від стилю четвертого Євангелія).
    audience: Сім християнських громад у римській Малій Азії, які зазнавали тиску імперської влади.
    date: Бл. 90-х років н. е.; традиційно датують часом правління Доміціана.
    chapters:
      '1':
        title: Бог показує Іванові видіння
      '2':
        title: Ісус промовляє до семи церков
      '3':
        title: Ісус закликає Лаодикію покаятися
      '4':
        title: Небесний престол сяє славою
      '5':
        title: Агнець бере сувій і викуповує
      '6':
        title: Чотири вершники несуть великі лиха
      '7':
        title: Позначені печаттю слуги співають вічну хвалу
      '8':
        title: Сім сурм сповіщають жахливі суди
      '9':
        title: Сарана мучить грішників землі
      '10':
        title: Могутній ангел присягає про останній час
      '11':
        title: Двоє свідків пророкують, а потім воскресають
      '12':
        title: Жінка народжує Сина, якому належить царювати
      '13':
        title: Звір виходить із моря
      '14':
        title: Агнець збирає вірних довкола Себе
      '15':
        title: Іван бачить небесний гнів
      '16':
        title: Ангели виливають чаші гніву
      '17':
        title: Суд над Вавилоном і Божа перемога
      '18':
        title: Небеса радіють падінню Вавилона
      '19':
        title: Небеса святкують весілля Агнця
      '20':
        title: Іван бачить останній суд
      '21':
        title: Усе стає новим
      '22':
        title: Ісус незабаром прийде
  Tobit:
    display_name: Товит
    author: Автор невідомий.
    audience: Юдеї діаспори, які прагнули зберігати побожність, будувати шлюб і покладатися на Боже провидіння під чужоземною владою.
    date: Бл. 225–175 років до н. е.; твір було складено арамейською, а в Кумрані також засвідчено давньоєврейську версію.
    chapters:
      '1':
        title: Товит вірно пам’ятає про Бога
      '2':
        title: Товит ховає зневаженого ближнього
      '3':
        title: Товит плаче й молиться про смерть
      '4':
        title: Товит наставляє сина жити праведно
      '5':
        title: Товія вирушає в дорогу з провідником
      '6':
        title: Товія ловить рибу, що приносить зцілення
      '7':
        title: Товія одружується із Сарою в Екбатані
      '8':
        title: Товія одружується із Сарою та молиться
      '9':
        title: Гаваїл повертає Товитові гроші
      '10':
        title: Товія безпечно повертається додому
      '11':
        title: Син повертає Товитові зір
      '12':
        title: Рафаїл відкриває, хто він насправді
      '13':
        title: Товит молиться за Єрусалим
      '14':
        title: Товит передбачає майбутнє Ізраїлю
  Judith:
    display_name: Юдита
    author: Автор невідомий.
    audience: Юдеї під чужоземною загрозою — зухвала оповідь про побожний опір.
    date: Бл. 150–100 років до н. е.
    chapters:
      '1':
        title: Навуходоносор нападає на Арфаксада
      '2':
        title: Олоферн рушає на захід
      '3':
        title: Приморські народи здаються й віддають багатства
      '4':
        title: Ізраїль постить і молиться про допомогу
      '5':
        title: Ахіор розповідає історію Ізраїлю
      '6':
        title: Ахіор застерігає Олоферна
      '7':
        title: У Бетулії закінчується вода
      '8':
        title: Юдита обіцяє Боже спасіння
      '9':
        title: Юдита молиться про Божу силу
      '10':
        title: Юдита входить до ассирійського табору
      '11':
        title: Олоферн запрошує Юдиту ввійти
      '12':
        title: Юдита шукає Божого проводу
      '13':
        title: Юдита відтинає голову Олофернові
      '14':
        title: Ізраїль святкує перемогу Юдити
      '15':
        title: Ізраїль забирає ассирійську здобич
      '16':
        title: Юдита веде пісню хвали
  Greek Additions to Esther:
    display_name: Грецькі додатки до Естер
    author: Автор невідомий; додатковий матеріал, уміщений у грецькому перекладі книги Естер.
    audience: Грекомовні юдеї, які хотіли бачити в оповіді про Естер виразні молитви й прямі згадки про Бога.
    date: Бл. II–I століть до н. е.
    chapters:
      '1':
        title: Мардохей бачить сон і застерігає царя
      '2':
        title: Цар видає наказ про знищення
      '3':
        title: Мардохей та Естер моляться про допомогу
      '4':
        title: Естер постає перед царем
      '5':
        title: Цар карає Амана й рятує юдеїв
      '6':
        title: Мардохей згадує сон і пророкує
  Wisdom of Solomon:
    display_name: Мудрість Соломона
    author: Автор невідомий; твір псевдонімно приписано Соломонові. Його написав грецькою елліністичний юдейський автор, імовірно в Александрії.
    audience: Елліністичні юдеї, які осмислювали грецьку філософію та обстоювали мудрість Ізраїлю перед язичницькими й відступницькими альтернативами.
    date: Бл. 50 року до н. е. – 50 року н. е.
    chapters:
      '1':
        title: Бог відкриває мудрість тим, хто її шукає
      '2':
        title: Нечестиві відкидають справжню радість життя
      '3':
        title: Душі праведних спочивають у мирі
      '4':
        title: Чесноту вшановують, а безбожних осоромлюють
      '5':
        title: Праведні сміливо викривають нечестя
      '6':
        title: Мудрість веде до справжнього царювання
      '7':
        title: Молитва приносить мудрість і розуміння
      '8':
        title: Мудрість скеровує і зміцнює правителів
      '9':
        title: Цар молиться про Божу мудрість
      '10':
        title: Мудрість захищає і визволяє праведних
      '11':
        title: Бог виявляє милість через виховання
      '12':
        title: Глузування з ідолів залишає без надії
      '13':
        title: Люди поклоняються бездушним ідолам
      '14':
        title: Бог веде кораблі морем
      '15':
        title: Боже милосердя веде до правдивого поклоніння
      '16':
        title: Бог дає поживу й судить гнобителів
      '17':
        title: У пастці обіймів страшної ночі
      '18':
        title: Бог веде світлом
      '19':
        title: Хмари розступаються перед Ізраїлем
  Sirach:
    display_name: Сирах
    author: Єшуа бен Елеазар бен Сіра з Єрусалима; грецький переклад виконав його онук.
    audience: Молоді юдейські чоловіки, яких навчали мудрості в Єрусалимі елліністичної доби.
    date: Єврейський оригінал — бл. 195–175 рр. до н. е.; грецький переклад — бл. 132 р. до н. е.
    chapters:
      '1':
        title: Бог вимірює мудрість і дарує її
      '2':
        title: Випробування засвідчують вірність слуг
      '3':
        title: Шануй батьків — і житимеш довго
      '4':
        title: Захищай пригноблених і шукай мудрості
      '5':
        title: Покладайся на Бога, а не на багатство
      '6':
        title: Шукай мудрості, як хлібороб
      '7':
        title: Глибоко в серці зберігай смирення
      '8':
        title: Уникай нерозумних і шануй старших
      '9':
        title: Стережися ревнощів і хтивості
      '10':
        title: Мудре правління приносить лад
      '11':
        title: Мудрість підносить бідного
      '12':
        title: Допомагай праведним, а не грішникам
      '13':
        title: Доторкнешся до смоли — забруднишся
      '14':
        title: Мудрість приносить вічне благословення
      '15':
        title: Мудрість зустрічає тих, хто її шукає
      '16':
        title: Один вірний підтримує місто
      '17':
        title: Людей створено за Божим образом
      '18':
        title: Не псуй добрих справ
      '19':
        title: Хто женеться за насолодою, той занепадає
      '20':
        title: Говори обачно й у слушний час
      '21':
        title: Молися, утікай від гріха й шукай мудрості
      '22':
        title: Лінощі приносять сором і горе
      '23':
        title: Молися про внутрішню дисципліну й мудрість
      '24':
        title: Мудрість говорить на власну похвалу
      '25':
        title: Мудрість шанує Бога й людей
      '26':
        title: Дружина приносить радість або біль
      '27':
        title: Прагни праведності й носи її з гідністю
      '28':
        title: Прощай гріхи — і здобудеш милість
      '29':
        title: Прости ближнього — і здобудеш милість
      '30':
        title: Виховуй синів у честі
      '31':
        title: Багатство приносить тривогу й біль
      '32':
        title: Смиренно служи спершу іншим
      '33':
        title: Господь захищає тих, хто Його боїться
      '34':
        title: Сни можуть ввести в оману, якщо вони неясні
      '35':
        title: Керівники мають бути смиренними й мудрими
      '36':
        title: Порятунок приходить через страх Господній
      '37':
        title: Мудро обирай друзів і порадників
      '38':
        title: Шануй лікарів, молися про зцілення
      '39':
        title: Сирах прославляє відданого знавця Закону
      '40':
        title: Тягарі й благословення життя
      '41':
        title: Смерть приносить останній спочинок
      '42':
        title: Говори про складні, але необхідні речі
      '43':
        title: Небесні дива спонукають славити Бога
      '44':
        title: Предків вела віра
      '45':
        title: Мойсей ушанований понад усіх
      '46':
        title: Ісус Навин воює за Божий народ
      '47':
        title: Давида прославлено за протистояння Натанові
      '48':
        title: Ілля та пророки з палаючими словами
      '49':
        title: Йосію вшановано за реформи
      '50':
        title: Симон благословляє свій народ
      '51':
        title: Я прославляю свого Бога
  Baruch:
    display_name: Варух
    author: Невідомий автор; твір псевдонімно приписано Варухові, писарю Єремії.
    audience: Юдеї діаспори, які роздумували про вигнання, покаяння та мудрість.
    date: Бл. II ст. до н. е.
    chapters:
      '1':
        title: Варух читає сповідання біля річки
      '2':
        title: Господь виконує перестороги, дані через Мойсея
      '3':
        title: Народ волає, сповідується й навертається
      '4':
        title: Божі заповіді дають життя
      '5':
        title: Єрусалиме, зодягнися у вічну славу
  1 Maccabees:
    display_name: 1 Макавеїв
    author: Невідомий автор, імовірно з Єрусалима, який писав єврейською мовою (зберігся лише грецький текст).
    audience: Юдеї за часів повстання Хасмонеїв і після нього; оповідь обґрунтовує законність династії Хасмонеїв.
    date: Бл. 100 р. до н. е.
    chapters:
      '1':
        title: Ізраїль чинить опір грецькій тиранії
      '2':
        title: Маттатія присягає дотримуватися Закону
      '3':
        title: Юда молиться про допомогу Ізраїлю
      '4':
        title: Храм очищено й наново освячено
      '5':
        title: Юда перемагає навколишні народи
      '6':
        title: Антіох помирає після поразки
      '7':
        title: Юда перемагає військо Никанора
      '8':
        title: Юда шукає дружби з Римом
      '9':
        title: Йонатан очолює народ після Юди
      '10':
        title: Йонатан здобуває прихильність Александра
      '11':
        title: Йонатан протистоїть загрозі Птолемея
      '12':
        title: Симон укріплює твердині Юдеї
      '13':
        title: Симон руйнує єрусалимську фортецю
      '14':
        title: Симон укріплює мир в Ізраїлі
