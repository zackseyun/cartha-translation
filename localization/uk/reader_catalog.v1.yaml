        title: Любов єднає нас із Богом
      '50':
        title: Любов удосконалює Божих обранців
      '51':
        title: Визнаймо свої гріхи й помилки
      '52':
        title: Принесімо Богові жертву хвали
      '53':
        title: Мойсей сміливо заступився за Ізраїль
      '54':
        title: Миролюбні провідники шанують отару
      '55':
        title: Жінки звершували мужні вчинки
      '56':
        title: Моліться, щоб заблукалі скорилися
      '57':
        title: 'Мудрість проголошує: смирення мудре'
