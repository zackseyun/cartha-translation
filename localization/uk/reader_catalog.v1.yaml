  Apocryphon of John:
    display_name: Апокриф Івана
    author: Автор невідомий. Твір псевдонімно подає одкровення воскреслого Ісуса Іванові, сину Зеведея, і зберігся в кількох давніх редакціях.
    audience: Християни сетіанської або близької до неї традиції одкровення, які шукали пояснення божественного світу, творіння, людської ідентичності та визволення від ворожих правителів.
    date: Рання форма, ймовірно, була в обігу у II столітті н. е.; збережені коптські свідки, що містять коротшу й довшу редакції, датуються IV і V століттями.
    chapters:
      '1':
        title: Іван шукає мудрості Ісуса
      '2':
        title: Небо відкриває божественні образи
      '3':
        title: Прихований Бог — найвища реальність
      '4':
        title: Божественне Передбачення яскраво сяє
      '5':
        title: Барбело просить сил
      '6':
        title: Христос походить від Провидіння
      '7':
        title: Вічне Життя прославляє Духа
      '8':
        title: Адам прославив прихованого Бога
      '9':
        title: Софія створює недосконалу істоту
      '10':
        title: Гордий правитель утворює світи
      '11':
        title: Невіглас-правитель копіює порядок
      '12':
        title: Мудрість кається в темряві
      '13':
        title: Влади утворюють людське тіло
      '14':
        title: Бог приховує світло в Адамі
      '15':
        title: Правителі спокушають Адама забути
      '16':
        title: Божественне світло пробуджує людство
      '17':
        title: Провидіння пробуджує розум
      '18':
        title: Душі відвертаються від змагань зі злом
      '19':
        title: Милосердний Дух пробуджує людей
      '20':
        title: Світло сходить, щоб спасти душі
      '21':
        title: Спаситель доручає приховану мудрість
  Hypostasis of the Archons:
    display_name: Іпостась архонтів
    author: Автор невідомий. Він тлумачить Книгу Буття через міф-одкровення про архонтів; цей твір не можна з певністю приписати якомусь відомому вчителеві.
    audience: Християни із сетіанського або спорідненого середовища, які читали Книгу Буття як розповідь про протистояння між невігласними космічними правителями, божественною мудрістю та духовним походженням людства.
    date: Зазвичай твір датують III століттям н. е.; він зберігся в коптській копії IV століття в Наг-Хаммадському кодексі II.
    chapters:
      '1':
        title: Дух відкриває космічні сили
      '2':
        title: Голос викриває сліпого правителя
      '3':
        title: Божественне світло оживляє Адама
      '4':
        title: Жінка рятується від насильства правителів
      '5':
        title: Змій навчає духовної істини
      '6':
        title: Каїн убиває Авеля, Сет заступає його місце
      '7':
        title: Ной будує ковчег і двічі рятується
      '8':
        title: Норея сміливо протистоїть темним силам
      '9':
        title: Елелет запевняє в істинному походженні
      '10':
        title: Дочка Мудрості обмежує правителя
      '11':
        title: Саваоф кається і прославляє Мудрість
      '12':
        title: Одкровитель приносить вічне життя
  On the Origin of the World:
    display_name: Про походження світу
    author: Автор невідомий. У творі поєднано й переосмислено кілька юдейських, християнських, платонічних і міфологічних традицій, але ім’я укладача не названо.
    audience: Читачі з християнського середовища з гностичними нахилами, які шукали альтернативну історію творення, космічних правителів, Софії, Адама та Єви й остаточної долі світу.
    date: Зазвичай твір датують III століттям н. е., хоча в його основі можуть лежати давніші матеріали; зберігся переважно в коптських рукописах IV століття.
    chapters:
      '1':
        title: Хаос постає з темряви
      '2':
        title: Мудрість утворює межу небес
      '3':
        title: Правитель помилково вважає себе єдиним володарем
      '4':
        title: Сім істот керують небесами
      '5':
        title: Сліпий бог заявляє, що існує лише він
      '6':
        title: Саваоф відкидає темряву своїх батьків
      '7':
        title: Небесний правитель створює подоби
      '8':
        title: Сили життя долають смерть
      '9':
        title: Перший правитель бачить божественну Віру
      '10':
        title: Осяйний Адам з’являється у світлі
      '11':
        title: Ерос пробуджує бажання і смерть
      '12':
        title: Створено рай зі священними деревами
      '13':
        title: Божественна кров породжує квіти
      '14':
        title: Мудрість упорядковує небесні тіла
      '15':
        title: Учитель викриває космічне невігластво
      '16':
        title: Єва народжує без чоловіка
      '17':
