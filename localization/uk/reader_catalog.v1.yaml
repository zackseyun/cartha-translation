      '34':
        title: Старанні працівники заробляють свій хліб
      '35':
        title: Будьмо витривалі заради небесних нагород
      '36':
        title: Ісус, наш Первосвященник, спасає
      '37':
        title: Воїни сумлінно виконують накази
