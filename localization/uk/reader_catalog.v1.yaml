  Polycarp to the Philippians:
    display_name: Полікарп до филип’ян
    author: Полікарп, єпископ Смирни. Деякі дослідники вважають, що збережений текст поєднує матеріали, надіслані в різний час.
    audience: Християнська громада у Филипах, яка попросила листи Ігнатія й отримала настанови про віру, поведінку, керівництво, гроші та витривалість.
    date: Початок — середина II століття н. е.; принаймні частина твору тісно пов’язана з подорожжю Ігнатія, тоді як припущення про складений характер листа допускають дещо пізніше датування певної його частини.
