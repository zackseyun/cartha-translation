  Leviticus:
    display_name: Левит
    author: Автор невідомий; традиційно авторство приписують Мойсеєві. Сучасні дослідники відносять книгу до Священницького джерела.
    audience: 'Ізраїльські священники та громада, що поклоняється Богові: настанови про жертвоприношення, святість і впорядкування життя довкола Божої присутності.'
    date: Різні шари тексту формувалися від пізнього періоду монархії до часу після полону (приблизно VII–V століття до н. е.).
    chapters:
      '1':
        title: Цілопалення, приємні ГОСПОДУ
      '2':
        title: Хлібні приношення спалюють перед Ним
      '3':
