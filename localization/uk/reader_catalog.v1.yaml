  Gospel of Philip:
    display_name: Євангеліє від Филипа
    author: Анонімний твір. Назва міститься в кінцевій приписці рукопису, однак сам твір не називає Филипа своїм автором. Єдина збережена копія — коптський текст Наг-Хаммадійського кодексу II,3.
    audience: Рання християнська спільнота, обізнана із сакраментальним навчанням валентиніанського типу, зокрема про хрещення, помазання, Євхаристію, викуплення, воскресіння та образ шлюбного покою.
    date: Зазвичай датується кінцем II або початком III ст. н. е.; збереглося в коптському рукописі IV ст., перекладеному з давнішої грецької форми.
    chapters:
      '1':
        title: Христос приводить до повноти Божої родини
      '2':
        title: Віра сіє зимову обітницю
      '3':
        title: Слова відкривають справжню духовну дійсність
      '4':
        title: Христос визволяє з духовного полону
      '5':
        title: Ісус відрізняє земного батька
      '6':
        title: Ісус відкриває приховану Божу дійсність
      '7':
        title: Воскресіння перетворює тілесне життя
      '8':
        title: Ісус поступово відкриває Себе
      '9':
        title: Духовні діти примножують нетлінне життя
      '10':
        title: Духовно зрілі служать усім
      '11':
        title: Хрещення перетворює на безсмертне життя
      '12':
        title: Таїнство шлюбу відновлює священну єдність
      '13':
        title: Божа істина приносить духовне відродження
      '14':
        title: Христос відновлює єдність і життя
      '15':
        title: Воскресіння вже тепер пробуджує справжнє життя
      '16':
        title: Віра дозріває завдяки Божій благодаті
      '17':
        title: Ісус викриває та усуває зло
      '18':
        title: Священне єднання приносить вічне світло
  Gospel of Mary:
    display_name: Євангеліє від Марії
    author: Автор невідомий. У творі Марію представлено як ту, що отримала й витлумачила одкровення Ісуса, однак у ньому не стверджується, що збережене Євангеліє написала Марія.
    audience: Ранні християнські читачі, які осмислювали одкровення, духовне сходження, апостольський авторитет і правомірність учення Марії серед учнів Ісуса.
    date: Зазвичай датується II століттям н. е.; збереглися грецькі фрагменти III століття, а головний коптський текст міститься в Берлінському кодексі 8502 V століття.
    chapters:
      '1':
        title: Спаситель навчає проти гріха
      '2':
        title: Ісус посилає учнів із миром
      '3':
        title: Марія втішає повчаннями
      '4':
        title: Душа долає забуття
      '5':
        title: Левій закликає звіщати Євангеліє
  Treatise on the Resurrection:
    display_name: Трактат про воскресіння
    author: Автор невідомий. Твір має форму листа вчителя до учня на ім’я Регін; ані вчителя, ані Регіна неможливо достовірно ототожнити з відомими особами.
    audience: Християни, які шукали настанов про воскресіння, особливо читачі, що розмірковували про тілесний і духовний виміри воскресіння та про участь у воскреслому житті вже тепер.
    date: Зазвичай відноситься до кінця II століття н. е. (часто приблизно до 170–200 років); зберігся в коптській копії IV століття давнішого грецького твору.
    chapters:
      '1':
        title: Христос приносить справжню повноту
      '2':
        title: Христос долає владу смерті
      '3':
        title: Воскресіння перетворює дійсність
      '4':
        title: Віруючі поділяють воскресіння Христа
      '5':
        title: Віра у воскресіння Христа
      '6':
        title: Мудрість спасіння перебуває повіки
      '7':
        title: Благодать зберігає вічне життя
      '8':
        title: Воскресіння відкриває справжнє життя
      '9':
        title: Воскресіння перемагає тління
      '10':
        title: Уникайте поділу заради воскресіння
      '11':
        title: Діліться вченням заради інших
  Dialogue of the Savior:
    display_name: Діалог Спасителя
    author: Автор невідомий. У діалозі одкровення подано як учення з уст Ісуса в розмові з Юдою, Матвієм і Марією, але укладача твору не названо.
    audience: Ранньохристиянське коло, зацікавлене в особистому одкровенні, учнівстві, самопізнанні, молитві та аскетичному приготуванні до спасіння.
    date: Зазвичай відноситься до II століття н. е., хоча етапи укладання та точне датування залишаються спірними; зберігся в коптському рукописі IV століття.
    chapters:
      '1':
        title: Ісус навчає справжнього спокою
      '2':
        title: Бог веде до вічного життя
      '3':
        title: Долання небезпеки з радістю
      '4':
        title: Упорядкуйте свою душу
      '5':
        title: Шукайте істину поза смутком
      '6':
        title: Очистьте своє серце
      '7':
        title: Відображайте небесну доброту
      '8':
        title: Божественна сила підтримує все
      '9':
        title: Передусім пізнайте божественне джерело
      '10':
        title: Споглядайте вічного Бога повіки
      '11':
        title: Зодягніться в божественне світло
      '12':
        title: Відкривайте духовні багатства Христа
      '13':
        title: Долайте ворожнечу любов’ю
      '14':
        title: Справжня молитва здіймається вище
      '15':
        title: Ретельно оберігайте внутрішнє життя
  Exegesis on the Soul:
    display_name: Тлумачення про душу
    author: Автор невідомий. Автор — християнський проповідник, який переосмислює біблійні та грецькі літературні образи як алегорію падіння, покаяння й відновлення душі.
    audience: Християни, обізнані з Писанням і моральними настановами, яких закликали відвернутися від невпорядкованих бажань, покаятися та знову з’єднатися з божественним.
    date: Загалом датується кінцем II або початком III століття н. е.; зберігся в коптському перекладі з грецької, виконаному в IV столітті.
    chapters:
      '1':
        title: Душа кається й шукає милості
      '2':
        title: Душа зраджує Бога через бажання
      '3':
        title: Бог очищує душу через хрещення
      '4':
        title: Душа знову єднається з божественним джерелом
      '5':
        title: Щиро моліться прихованому Богові
      '6':
        title: Душа повертається додому від бажання
      '7':
        title: Бог чує щирий плач
  Book of Thomas the Contender:
    display_name: Книга Томи Подвижника
    author: Автор невідомий. У кінцевій назві твір пов’язано з Юдою Томою, а Маттаю названо записувачем, проте це літературні атрибуції, а не підтверджені відомості про авторство.
    audience: Схильні до аскези християни, яких закликали шукати самопізнання, опиратися тілесним пристрастям і осягати особисті настанови Ісуса Томі.
    date: Часто датується кінцем II або початком III століття н. е.; можливо, виник у сирійському християнському середовищі. Зберігся в коптському рукописі IV століття.
    chapters:
      '1':
        title: Маттая записує повчання Томи
      '2':
        title: Христос закликає досліджувати себе
      '3':
        title: Ісус навчає невидимої істини
      '4':
        title: Спаситель застерігає від влади бажань
      '5':
        title: Тома запитує про грішників
      '6':
        title: Спаситель застерігає від духовної темряви
      '7':
        title: Блаженні пильні святі
  Tripartite Tractate:
    display_name: Тричастинний трактат
    author: Автор невідомий. Автор був високоосвіченим християнським богословом валентиніанської традиції; достовірно ототожнити його з будь-яким відомим учителем неможливо.
    audience: Валентиніанська християнська громада, яка отримувала докладні настанови про Бога, еони, творіння, Христа, церкву, спасіння та остаточне відновлення.
    date: Зазвичай датується III століттям н. е., хоча дехто обстоює датування його другою половиною; зберігся коптською мовою в Кодексі Юнга IV століття.
    chapters:
      '1':
        title: Бог творить усе без зусиль
      '2':
        title: Син відкриває незбагненну славу Бога
      '3':
        title: Спільнота поділяє божественне вічне життя
      '4':
        title: Бог пробуджує істот світлом
      '5':
        title: Бог відкриває себе через досконалого Сина
      '6':
        title: Вічні істоти відображають природу Бога
      '7':
        title: Син відкриває прихованого Бога
      '8':
        title: Бог наділяє силою вічних істот
      '9':
        title: Бог приваблює невидимими пахощами
      '10':
