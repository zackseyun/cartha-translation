    audience: የኢግናጥዮስን ደብዳቤዎች የጠየቀውና ስለ እምነት፣ ምግባር፣ አመራር፣ ገንዘብ እና ጽናት ምክር የተቀበለው በፊልጵስዩስ የነበረው የክርስቲያኖች ጉባኤ።
    date: ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን መጀመሪያ እስከ አጋማሽ፤ ቢያንስ ከፊሉ ከኢግናጥዮስ ጉዞ ጋር በቅርብ የተያያዘ ሲሆን፣ ደብዳቤው ከተለያዩ ክፍሎች የተዋቀረ ነው የሚሉ ሐሳቦች አንድ ክፍል ከዚያ ጥቂት ዘግይቶ የተጻፈ ሊሆን እንደሚችል ያስችላሉ።
