  variant: modern standard Amharic in Ge'ez script
  status: pilot
book_localizations:
- source_title: Genesis
  title: ዘፍጥረት
  author: ደራሲው አይታወቅም፤ በትውፊት ለሙሴ ይደረግለታል። ዘመናዊ ምሁራን ግን መጽሐፉ የተለያዩ ምንጮች በኋላ ተሰናድተው የተዋሃዱበት ረጅም የአጻጻፍ ታሪክ እንዳለው ያስባሉ።
  audience: በቃል ኪዳን ማንነቱ የተመሠረተ እስራኤል፤ የሕዝቡን የመነሻ ታሪክ በእግዚአብሔር ፍጥረት፣ ምርጫና ተስፋ ላይ ያጸናል።
  date: ለብዙ ምዕተ ዓመታት ተጻፈ፤ አሁን የሚታወቀውን ቅርጽ ያገኘው በባቢሎን ምርኮ ዘመን ወይም ከዚያ በኋላ፣ በግምት ከክርስቶስ ልደት በፊት በ6ኛው–5ኛው ምዕተ ዓመት ነው።
  summary: ዘፍጥረት ስለ ፍጥረት፣ ስለ ሰው ልጆች ዓመፅና መበታተን፣ እንዲሁም የእስራኤል የቃል ኪዳን ተስፋዎች መጀመሪያ ስለሚሆኑበት የአብርሃም፣ የይስሐቅ፣ የያዕቆብና የዮሴፍ ቤተሰብ ይተርካል።
- source_title: John
  title: ዮሐንስ
  author: ደራሲው አይታወቅም፤ ትውፊት መጽሐፉን ለሐዋርያው ዮሐንስ ወይም «ለተወደደው ደቀ መዝሙር» ይደረግለታል።
  audience: ከምኩራብ ይሁዲነት ጋር በውጥረት ውስጥ የነበረና በተወደደው ደቀ መዝሙር ምስክርነት ዙሪያ የተቀረጸ የክርስቲያን ማኅበረሰብ።
  date: በግምት ከክርስቶስ ልደት በኋላ 90–110 ዓ.ም.
  summary: ዮሐንስ ኢየሱስን አብን የሚገልጥ፣ በእርሱ መታመን ሕይወትን የሚሰጥ፣ በምልክቶቹ፣ በሞቱና በትንሣኤው ክብር የሚቀበል ዘላለማዊው ቃል አድርጎ ያቀርበዋል።
- source_title: Gospel of Thomas
  title: የቶማስ ወንጌል
  author: ደራሲው አይታወቅም፤ የመጽሐፉ መግቢያ ይህን የንግግሮች ስብስብ «ዲዲሞስ ይሁዳ ቶማስ» እንደጻፈው ይገልጻል። ሙሉ ቅጂው የተረፈው በናግ ሐማዲ (NHC II,2) ከተገኘ የ4ኛው ምዕተ ዓመት የኮፕቲክ ትርጉም ብቻ ሲሆን፣ ከኦክሲሪንከስ የተገኙ ሦስት የግሪክኛ ቁርጥራጮችም አሉ።
  audience: በሶርያዊ የጥበብ ወግና በቀደምት ግኖስቲካዊ አስተሳሰብ ተጽእኖ የተቀረጸ፣ በኢየሱስ ንግግሮች ውስጥ ወዳለ ምስጢራዊ ራስን ማወቅ የሚያተኩር ክርስቲያናዊ አንባቢ ማኅበረሰብ።
  date: የግሪክኛው መጀመሪያ ጽሑፍ ምናልባት በግምት ከክርስቶስ ልደት በኋላ 50–140 ዓ.ም. ነው፤ የኮፕቲክ የእጅ ጽሑፉ ደግሞ በግምት 340 ዓ.ም. ነው።
  summary: የቶማስ ወንጌል ለኢየሱስ የተሰጡ ንግግሮች ስብስብ ነው። ተከታታይ ታሪክ የለውም፤ አንባቢዎች የንግግሮቹን ትርጉም እንዲያገኙ ደጋግሞ ይጠራቸዋል።
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: ዘፍጥረት 1፥1
  text: እግዚአብሔር ሰማያትንና ምድርን መፍጠር በጀመረ ጊዜ[ሀ]—
  translator_note: '[ሀ] ባሕላዊው ትርጉም ይህን እንደ ሙሉ ዓረፍተ ነገር ይወስደዋል፦ «በመጀመሪያ እግዚአብሔር ሰማያትንና ምድርን ፈጠረ።» የዕብራይስጡ አገላለጽ ግን ቀጥሎ ያለውን ነገር እንደ መግቢያ ማቅረቡ ይበልጥ ተፈጥሯዊ ነው፤ ዋናው ድርጊትም በቁጥር 3 ያለው «እግዚአብሔር አለ» የሚለው ነው።'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: መክብብ 1፥2
  text: «የትነቶች ትነት[ሀ]፣» ይላል ቆሄሌት[ለ]። «ሁሉም ትነት ነው—አጭር ጊዜ የሚቆይ፣ ሊጨበጥ የማይችል፣ ብዙ ጊዜም እንደምንጠብቀው የማይሆን።»
  translator_note: '[ሀ] ሄቨል የሚለው የዕብራይስጥ ቃል በቀጥታ «እስትንፋስ» ወይም «ትነት» ማለት ነው። በመክብብ ውስጥ ቶሎ የሚያልፈውን፣ ሊጨበጥ ወይም ሙሉ በሙሉ ሊገባ የማይችለውን፣ ብዙ ጊዜም ሰዎች ከሚጠብቁት በተለየ ሁኔታ የሚሆነውን ይገልጻል። «ትነት» የሚለው ትርጉም ምንም ነገር ትርጉም የለውም ሳይል ይህን ምስል ይጠብቃል። «እስትንፋስ፣» «ከንቱ እስትንፋስ» ወይም «ጊዜያዊ» ተብሎም ሊተረጎም ይችላል። [ለ] ቆሄሌት የደራሲው የዕብራይስጥ ስም ወይም ማዕረግ ነው። ብዙ ጊዜ «መምህሩ» ወይም «ሰባኪው» ተብሎ ይተረጎማል፤ አንዱን ትርጓሜ ከሌላው ሳናስቀድም ሊኖሩ የሚችሉትን ትርጉሞች ሁሉ ለማስቀረት «ቆሄሌት» የሚለውን እንዳለ አቆይተነዋል።'
- source_path: nt/john/001/001.yaml
  reference: ዮሐንስ 1፥1
  text: በመጀመሪያ[ለ] ቃል አስቀድሞ ነበረ። ቃል ከእግዚአብሔር ጋር ነበረ፤ ቃልም እግዚአብሔር ነበረ።[ሀ]
  translator_note: '[ሀ] ወይም፣ «ቃል መለኮታዊ ነበረ» ወይም «እግዚአብሔር የሆነው ቃልም እርሱ ነበረ።» የግሪክኛው አገላለጽ በቀደመው ሐረግ ቃልን ከእግዚአብሔር ለይቶ ሲያቀርብ፣ ቃል ፍጹም እግዚአብሔር መሆኑን ያረጋግጣል። [ለ] ይህ መክፈቻ ዘፍጥረት 1፥1ን ያስተጋባል፤ ቃልንም ከፍጥረት መጀመሪያ ጋር ያገናኘዋል። «አስቀድሞ ነበረ» የሚለው አተረጓጎም መጀመሪያው በደረሰ ጊዜ ቃል እንደ ነበረ እንጂ ያን ጊዜ ወደ መኖር እንዳልመጣ ያሳያል። «ነበረ» ወይም «ይኖር ነበር» ተብሎም ሊተረጎም ይችላል።'
- source_path: nt/romans/003/025.yaml
  reference: ሮሜ 3፥25
  text: እግዚአብሔር እርሱን በደሙ በኩል በሚኖር እምነት የሚገኝ የማስተሰረያ መሥዋዕት[ሀ] አድርጎ አቀረበው።[ለ] ይህንም ያደረገው ቀድሞ የተፈጸሙትን ኃጢአቶች ሳይቀጣ አልፎአቸው ስለነበር፣ ጽድቁን[ሐ] ለማሳየት ነው።
  translator_note: '[ሀ] «ቁጣን የሚያስታግስ መሥዋዕት» ወይም «የስርየት መክደኛ» ተብሎም ሊተረጎም ይችላል። የስርየት መክደኛው በብሉይ ኪዳን የማስተሰረያ ደም ይረጭበት የነበረው የቃል ኪዳኑ ታቦት የወርቅ መክደኛ ነው። [ለ] ወይም፣ «በእምነት፣ በደሙ።» [ሐ] ወይም፣ «ፍትሑን።»'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 ጴጥሮስ 1፥13
  text: ስለዚህ አእምሮአችሁን ለተግባር አዘጋጁ።[ሀ] ሙሉ በሙሉ ንቁ ሁኑ፤ ኢየሱስ መሲሕ ሲገለጥ ወደ እናንተ በሚመጣው ጸጋ ላይ ተስፋችሁን ፈጽሞ አድርጉ።[ለ]
  translator_note: '[ሀ] የግሪክኛው ቃል በቀጥታ «የአእምሮአችሁን ወገብ ታጠቁ» ይላል። ይህም ለመንቀሳቀስ ዝግጁ እንዲሆኑ ረጅም ልብሳቸውን ሰብስበው በወገባቸው ዙሪያ የሚታጠቁ ሰዎችን ይስላል። ስለዚህ ምስሉ አእምሮን ማዘጋጀትና ለተግባር ዝግጁ መሆንን ያመለክታል። [ለ] «ሙሉ በሙሉ» እና «ፈጽሞ» ተብሎ የተተረጎመው አንዱ የግሪክኛ ቃል ንቁ ከመሆን፣ ተስፋን ከማድረግ ወይም ምናልባት ከሁለቱም ጋር ሊያያዝ ይችላል።'
