payload:
  book_metadata:
    Proverbs:
      display_name: ምሳሌ
      author: የተለያዩ ጽሑፎች ስብስብ፤ የርእስ ጽሑፎቹ ሰሎሞንን፣ አጉርን፣ ልሙኤልንና «ጠቢባንን» ይጠቅሳሉ።
      audience: ለዕለት ተዕለት ኑሮ በጥበብ እየተቀረጹ ያሉ ወጣት እስራኤላውያን።
      date: የተለያዩ የድርሰት ክፍሎች፣ በግምት ከ10ኛው እስከ 4ኛው ክፍለ ዘመን ዓ.ዓ።
    Ecclesiastes:
      display_name: መክብብ
      author: ደራሲው አይታወቅም፤ ተናጋሪው «ቆሄሌት» ሲሆን በባህል ከሰሎሞን ጋር ይዛመዳል።
      audience: ከፀሐይ በታች የጥበብን፣ የሀብትንና የጥረትን ውስንነት የሚጋፈጡ እስራኤላውያን።
      date: በአራማይክ ተጽዕኖ ባደረበት ዕብራይስጥ ላይ ተመሥርቶ፣ ምናልባት ከ5ኛው እስከ 3ኛው ክፍለ ዘመን ዓ.ዓ. ገደማ።
    Song of Solomon:
      display_name: መኃልየ መኃልይ
      author: ደራሲው አይታወቅም፤ የርእስ ጽሑፉ ሰሎሞንን ይጠቅሳል።
      audience: የወሲባዊ ፍቅርን በቃል ኪዳን ውስጥ ያለውን ቅርበት ለመረዳት እንደ መነጽር የሚያነብ እስራኤል፤ በኋላም በምሳሌያዊ መንገድ ያነበቡት አይሁዳውያንና ክርስቲያኖች።
      date: ምናልባት ከምርኮ መመለስ በኋላ፣ ከ5ኛው እስከ 3ኛው ክፍለ ዘመን ዓ.ዓ. ገደማ።
  chapter_titles:
    Psalms:
      '104':
        title: እግዚአብሔር ይፈጥራል፣ ያቀርባል፣ ያድሳል
      '105':
        title: እግዚአብሔርን አመስግኑ፤ ቃል ኪዳኑን አስታውሱ
      '106':
        title: የተረሳ ፍቅር፣ ለዘላለም የተዋጀ
      '107':
        title: የተዋጁት ጌታን እንዲያመሰግኑ ጥሪ
      '108':
        title: ዳዊት ለመዳን ይጸልያል
      '109':
        title: በክፉ ጨቋኝ ላይ አስቸኳይ ጩኸት
      '110':
        title: ዳዊት በቅዱስ ግርማ ይገዛል
      '111':
        title: እግዚአብሔርን በፍጹም ልብ አመስግኑ
      '112':
        title: እግዚአብሔርን የሚፈራ ሰው ብፁዕ ነው
      '113':
        title: ትሑታንን ከፍ የሚያደርገውን እግዚአብሔር አመስግኑ
      '114':
        title: የእስራኤል ዘፀአትና የተፈጥሮ ምላሽ
      '115':
        title: ክብር ለእግዚአብሔር ብቻ
      '116':
        title: መዝሙረኛው አዳኙን እግዚአብሔር ይወዳል
      '117':
        title: ዘላለማዊ ፍቅር ያለውን እግዚአብሔር አመስግኑ
      '118':
        title: መዝሙር 118 እንድናመሰግን ይጠራል
      '120':
        title: መዝሙረኛው ይጮኻል፤ ጌታም ይመልሳል
      '121':
        title: ረዳት ከጌታ ይመጣል
      '122':
        title: ዳዊት ለኢየሩሳሌም ሰላም ይጸልያል
      '123':
        title: መዝሙረኛው እግዚአብሔርን ታምኖ ወደ ላይ ይመለከታል
      '124':
        title: እግዚአብሔር እስራኤልን ከአደጋ ያድናል
      '125':
        title: መታመን የማይናወጥ ደኅንነትን ያመጣል
      '126':
        title: የጽዮን መመለስ እጅግ ታላቅ ደስታን ያመጣል
      '127':
        title: እግዚአብሔር ይገነባል፣ ይጠብቃልም
      '128':
        title: እግዚአብሔርን የሚፈሩ ብፁዓን ናቸው
      '129':
        title: የእስራኤል ጠላቶች ሊያሸንፉን አይችሉም
