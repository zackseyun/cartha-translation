      '131':
        title: ዳዊት በእግዚአብሔር ፊት በጸጥታ ያርፋል
      '132':
        title: ዳዊት የእግዚአብሔርን ማደሪያ ይፈልጋል
      '133':
        title: ዳዊት በእግዚአብሔር የሚወደድ አንድነትን ያወድሳል
      '134':
        title: የሌሊት ጠባቂዎች እግዚአብሔርን ያመሰግናሉ
      '135':
        title: ጣዖታትን የሚያሸንፈውን እግዚአብሔር አመስግኑ
      '136':
        title: ማለቂያ ለሌለው ፍቅሩ እግዚአብሔርን ማመስገን
      '137':
        title: ምርኮኞች ኢየሩሳሌምን አስበው ያለቅሳሉ
      '138':
        title: ዳዊት በአደባባይ እግዚአብሔርን ያመሰግናል
      '139':
        title: የእግዚአብሔር ፍጹም እውቀትና መገኘት
      '140':
        title: እግዚአብሔር ዳዊትን ከጥቃት ይከላከላል
      '141':
        title: ዳዊት አንደበቱ እንዲጠበቅ ይጸልያል
      '142':
        title: ዳዊት ወደ ጌታ ይጮኻል
      '143':
        title: ዳዊት ምሕረትን ለምኖ ይጸልያል
      '144':
        title: ዳዊት ጥበቃን ለምኖ ይጸልያል
      '145':
        title: ዳዊት የእግዚአብሔርን ክብር ያወድሳል
      '146':
        title: ነፍሴ ለዘላለም እግዚአብሔርን ታመሰግናለች
      '147':
        title: መልሶ የሚገነባውንና የሚፈውሰውን እግዚአብሔር አመስግኑ
      '148':
        title: ፍጥረት ሁሉ ጌታን ያመሰግናል
      '149':
        title: ሁሉም ያህን ያመስግን
      '150':
        title: በመሣሪያዎች ሁሉ ያህን አመስግኑ
    Proverbs:
      '1':
        title: ሰሎሞን ጌታን መፍራትን ያስተምራል
      '2':
        title: ጥበብ እግዚአብሔርን በመፈለግ ይገኛል
      '3':
        title: እግዚአብሔርን ታመን፤ ጥበብንም አግኝ
      '4':
        title: አባት ከሁሉ በላይ ጥበብን እንዲሹ ይመክራል
      '5':
        title: አባት ከምንዝር ያስጠነቅቃል
      '6':
        title: ከኃጢአትና ከስንፍና የሚያስጠነቅቁ ምክሮች
      '7':
        title: ከሚያማልል ምንዝር ራቁ
      '8':
        title: ጥበብ ለሚፈልጓት ጮክ ብላ ትጠራለች
      '9':
        title: ጥበብ ትጋብዛለች፤ ሞኝነት ትፈትናለች
      '10':
        title: የጽድቅና የክፋት ንጽጽር
      '11':
        title: ቅንነት ወደ በረከት ይመራል
      '12':
        title: ጻድቃን በጥበብና በመልካም ሁኔታ ይኖራሉ
      '13':
        title: ለመማር ዝግጁ መሆን ወደ ሕይወት ይመራል
      '14':
        title: ጥበብ ቤትን ትገነባለች፣ ጌታንም ታከብራለች
      '15':
        title: ለስላሳ ንግግር ሕይወትን ያመጣል
      '16':
        title: ሰው ያቅዳል፤ እግዚአብሔር ውጤቱን ይመራል
      '17':
        title: እግዚአብሔርን መፍራት ጥበብን ያመጣል
      '18':
        title: ጥበብ ታዳምጣለች፤ ሞኝነት እርማትን ትንቃለች
      '19':
        title: ቅንነት ሁልጊዜ ከሀብት ይበልጣል
      '20':
        title: ስካርን ራቁ፤ ቅንነትን ከፍ አድርጉ
      '21':
        title: እግዚአብሔር ልብን ይመረምራል፣ ፍትሕንም ከፍ አድርጎ ይመለከታል
      '22':
        title: ትሕትና እግዚአብሔርን ይበልጥ ታከብራለች
      '23':
        title: ከሆዳምነትና ከስግብግብነት ያስጠነቅቃል
      '24':
        title: በክፉ ሰዎች አትቅኑ
      '25':
        title: ጥበብ ወደ ትሕትና ትጠራለች
      '26':
        title: ሞኞች ራሳቸውንና ሌሎችን ይጎዳሉ
      '27':
        title: ትሕትናንና ተጨባጭነትን ያስተምራል
      '28':
        title: ጻድቃን እግዚአብሔርን በመፈለግ ድል ያደርጋሉ
      '29':
        title: ግትርነት ወደ ጥፋት ይመራል
      '30':
        title: አጉር በጥልቅ ትሕትና ይናገራል
      '31':
        title: እናት ንጉሡ ፍትሕን እንዲያጸና ታስጠነቅቃለች
    Ecclesiastes:
      '1':
        title: ከፀሐይ በታች ሁሉም ከንቱ ነው
      '2':
        title: ደስታ ዘላቂ ጥቅም አያመጣም
      '3':
        title: ለእያንዳንዱ ዓላማ ጊዜ አለው
      '4':
        title: ሕይወት በጭካኔ ጭቆና የተሞላ ነው
      '5':
        title: እግዚአብሔርን አክብሩ፤ ስእለቶቻችሁንም ፈጽሙ
      '6':
        title: ልትደሰቱበት ያልቻላችሁት ሀብት መራራ ነው
      '7':
        title: ጥበብ ከትዕቢት ይሻላል
      '8':
        title: ጥበብ በትሕትና መኖርን ታስተምራለች
      '9':
        title: ጻድቃንና ክፉዎች ተመሳሳይ ዕጣ ይጋራሉ
      '10':
        title: ሞኝነት ጥበብን በፍጥነት ያበላሻል
      '11':
        title: በቻላችሁበት ጊዜ አደጋ ውሰዱ
      '12':
        title: በወጣትነትህ ፈጣሪህን አስብ
    Song of Solomon:
      '1':
        title: ሴቲቱ የምትወደውን ፍቅረኛዋን ትፈልጋለች
      '2':
