    1 Enoch:
      display_name: 1 ሄኖክ
      author: ደራሲው አይታወቅም፤ መጽሐፉ ከጥፋት ውኃ በፊት ለኖረው አባት ሄኖክ በስሙ እንደተጻፈ ተደርጎ ቀርቧል። ከተለያዩ ክፍሎች የተሰባሰበ ድብልቅ ሥራ ነው።
      audience: ስለ ዓለማቀፋዊ ክፋት፣ ፍርድና የቀን አቆጣጠር ያሰላስሉ ለነበሩ የአይሁድ ራእያዊ ማኅበረሰቦች፤ በኋላም በጥንቶቹ ክርስቲያናዊ ማኅበረሰቦች ይነበብ ነበር።
      date: ክፍሎቹ ከ3ኛው ክፍለ ዘመን ዓ.ዓ. እስከ 1ኛው ክፍለ ዘመን ዓ.ም. ገደማ እንደተሰባሰቡ ይገመታል፤ ሙሉ ቅጂው የተጠበቀው በግዕዝ (ኢትዮጵያዊ) ብቻ ነው።
