  verdict: revise
  review_summary: የሙሉ ቁራጩ ትርጉም ተሻሽሏል። በደራሲ መረጃው ውስጥ የቀረ የእንግሊዝኛ ቃል ተወግዷል፤ በርካታ ርዕሶችም ከዋናው የእንግሊዝኛ ትርጉም ጋር እንዲስማሙ ተስተካክለዋል።
  issues:
