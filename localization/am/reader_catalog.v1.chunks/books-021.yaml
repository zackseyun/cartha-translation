payload:
  book_metadata:
    Thunder, Perfect Mind:
      display_name: ነጎድጓድ፣ ፍጹም አእምሮ
      author: ስሙ ያልታወቀ።
      audience: የግሪክ-ግብፅ ጥበብ ወይም ግኖስቲካዊ ጽሑፎች አንባቢዎች፤ በመለኮታዊት ሴት ምስል ድምፅ የቀረበ ጾታ የተለየበት ራስን የመግለጥ ግጥም።
      date: ምናልባት በ1ኛው–2ኛው ክፍለ ዘመን ዓ.ም. አካባቢ፤ በናግ ሐማዲ (NHC VI,2) ተጠብቆ ቆይቷል።
    Testament of Reuben:
      display_name: የሮቤል ኑዛዜ
      author: ስሙ ያልታወቀ፤ የያዕቆብ ልጆች በሞት አልጋቸው ላይ ያደረጓቸው ንግግሮች ተደርገው ከቀረቡት «የአሥራ ሁለቱ አባቶች ኑዛዜዎች» አንዱ ነው።
      audience: ከአባቶች ኑዛዜዎች ሥነ ምግባርን ለሚማሩ አይሁዳውያን (በኋላም ክርስቲያኖች) አንባቢዎች።
      date: ከክርስትና በፊት የነበረው የአይሁድ ዋና ይዘት በ2ኛው ክፍለ ዘመን ዓ.ዓ. አካባቢ፤ ክርስቲያናዊው የአርትዖት ክፍል ደግሞ በ1ኛው–2ኛው ክፍለ ዘመን ዓ.ም. አካባቢ።
    Testament of Simeon:
      display_name: የስምዖን ኑዛዜ
      author: ስሙ ያልታወቀ፤ ከ«አሥራ ሁለቱ አባቶች ኑዛዜዎች» አንዱ ነው።
      audience: አይሁዳውያን (በኋላም ክርስቲያኖች) አንባቢዎች።
      date: የአይሁድ ዋና ይዘት በ2ኛው ክፍለ ዘመን ዓ.ዓ. አካባቢ፤ ክርስቲያናዊ አርትዖት ደግሞ በ1ኛው–2ኛው ክፍለ ዘመን ዓ.ም. አካባቢ።
