  book_metadata:
    Judges:
      display_name: መሳፍንት
      author: ደራሲው አልታወቀም፤ የዘዳግም ታሪክ ክፍል ነው።
      audience: በንጉሣዊው ሥርዓት በፊት የነበረውን ታሪኩን፣ ከእምነት መውደቅና መዳን የሚደጋገም ዑደት እንደ ማስጠንቀቂያ የሚያነብ የኋለኛው ዘመን እስራኤል።
      date: ከክርስቶስ በፊት በ7ኛው–6ኛው መቶ ዘመን አካባቢ ተሰብስቦ የተዘጋጀ።
    Ruth:
      display_name: ሩት
      author: ደራሲው አልታወቀም።
      audience: ከምርኮ በኋላ የነበረ እስራኤል፤ ምናልባትም በዕዝራና በነህምያ ዘመን የነበሩትን የማግለል ፖሊሲዎች በመቃወም የባዕዳንን መካተት የሚደግፍ።
