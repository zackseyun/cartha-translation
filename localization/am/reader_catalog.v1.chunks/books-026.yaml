payload:
  book_metadata:
    Letters of Ignatius:
      display_name: የኢግናጥዮስ ደብዳቤዎች
      author: በሰፊው ተቀባይነት ባገኘው መካከለኛ የጽሑፍ ቅጂ ውስጥ ላሉት ሰባት ደብዳቤዎች፣ የአንጾኪያው ጳጳስ ኢግናጥዮስ፤ ከጊዜ በኋላ የተስፋፉትና በኢግናጥዮስ ስም የተጻፉት ደብዳቤዎች በዚህ ስብስብ ውስጥ አልተካተቱም።
      audience: ኢግናጥዮስ ወደ ሰማዕትነት በሚያመራው ጉዞው ወቅት የጻፋቸው፣ በኤፌሶን፣ በማግኔዥያ፣ በትራሌስ፣ በሮም፣ በፊላዴልፊያና በሰምርኔስ ላሉ የክርስቲያን ማኅበራት፣ እንዲሁም ለፖሊካርፕ።
      date: ብዙውን ጊዜ በ2ኛው ክፍለ ዘመን ዓ.ም. መጀመሪያ፣ በተለምዶ በ105–117 ዓ.ም. አካባቢ እንደተጻፉ ይገመታል፤ ሆኖም የኢግናጥዮስ ጉዞ ትክክለኛ የጊዜ ቅደም ተከተል አሁንም አከራካሪ ነው።
