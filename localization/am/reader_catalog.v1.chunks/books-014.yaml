payload:
  book_metadata:
    Sirach:
      display_name: ሲራክ
      author: የኢየሩሳሌሙ ኢያሱ ወልደ አልዓዛር ወልደ ሲራ፤ ወደ ግሪክኛ የተረጎመው የልጅ ልጁ ነው።
      audience: በግሪካዊው ባህል ተጽዕኖ ዘመን በኢየሩሳሌም ጥበብን ይማሩ ለነበሩ ወጣት አይሁዳውያን ወንዶች።
      date: የዕብራይስጥ መጀመሪያ ጽሑፍ ከ195–175 ዓ.ዓ. ገደማ፤ የግሪክኛ ትርጉም በ132 ዓ.ዓ. ገደማ።
    Baruch:
      display_name: ባሮክ
      author: ስሙ ያልታወቀ፤ ለኤርምያስ ጸሐፊ ለባሮክ ተሰጥቶ በስሙ የቀረበ።
      audience: ስለ ስደት፣ ንስሐ እና ጥበብ ያስቡ ለነበሩ በውጭ አገር የተበተኑ አይሁዳውያን።
      date: በ2ኛው መቶ ዘመን ዓ.ዓ. ገደማ።
    1 Maccabees:
      display_name: 1 መቃብያን
      author: ስሙ ያልታወቀ፤ ምናልባትም በዕብራይስጥ የጻፈ የኢየሩሳሌም ደራሲ ሊሆን ይችላል (አሁን ያለው የግሪክኛው ጽሑፍ ብቻ ነው)።
      audience: በሐስሞናውያን ዓመፅ ዘመንና ከዚያ በኋላ ለነበሩ አይሁዳውያን፤ የሐስሞናውያንን ሥርወ መንግሥት ሕጋዊነት የሚተርክ።
      date: በ100 ዓ.ዓ. ገደማ።
    2 Maccabees:
      display_name: 2 መቃብያን
      author: የቀሬናዊው ኢያሶን ረዘም ያለ ሥራ ያሳጠረ ስሙ ያልታወቀ ደራሲ፤ በግሪክኛ የተጻፈ።
      audience: ግሪክኛ ለሚናገሩ በውጭ አገር ለተበተኑ አይሁዳውያን፤ ለእምነት ስለ መሞት፣ ስለ መለኮታዊ አስተዳደር እና ስለ ትንሣኤ አጽንዖት የሚሰጥ።
      date: በ124 ዓ.ዓ. ገደማ ወይም ከዚያ ብዙም ሳይቆይ።
