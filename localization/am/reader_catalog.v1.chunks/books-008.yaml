payload:
  book_metadata:
    Isaiah:
      display_name: ኢሳይያስ
      author: በብዙ መቶ ዓመታት ውስጥ በበርካታ ደራሲያን የተጻፈ፤ ምዕራፎች 1–39 ሥራቸው በ8ኛው መቶ ዘመን ቅ.ል.ዘ. በኢየሩሳሌም በነበረው በኢሳይያስ የተመሠረተ ሲሆን፣ 40–55 («ሁለተኛው ኢሳይያስ») እና 56–66 («ሦስተኛው ኢሳይያስ») ለምርኮውና ከምርኮ መመለሱ ምላሽ ይሰጣሉ።
      audience: በተከታታይ በአሦር ስጋት ሥር ለነበረችው ይሁዳ፣ በባቢሎን ምርኮ ለነበሩት፣ እና ከምርኮ በኋላ ለተመለሱት።
      date: ከ8ኛው መቶ ዘመን ቅ.ል.ዘ. መጨረሻ እስከ 5ኛው መቶ ዘመን ቅ.ል.ዘ. ገደማ ተጻፈ።
    Jeremiah:
      display_name: ኤርምያስ
      author: የዓናቶቱ ኤርምያስ፤ በጸሐፊው ባሮክና በኋላ በመጡ ሌሎች እጆች በከፍተኛ ደረጃ ተስተካክሏል።
      audience: ከባቢሎናውያን ወረራ ዋዜማ፣ በወረራው ወቅትና ከወረራው በኋላ ለነበረችው ይሁዳ።
      date: ከ7ኛው መቶ ዘመን ቅ.ል.ዘ. መጨረሻ እስከ 6ኛው መቶ ዘመን ቅ.ል.ዘ. መጀመሪያ።
