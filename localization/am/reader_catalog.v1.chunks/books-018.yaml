payload:
  book_metadata:
    2 Esdras:
      display_name: 2 እስድራስ
      author: ደራሲው አይታወቅም፤ በመጀመሪያ አይሁዳዊ በነበረው ዋና ክፍል (4 ዕዝራ፣ ምዕራፍ 3–14) ዙሪያ በክርስቲያኖች የተስተካከለ ማዕቀፍ አለው።
      audience: ከ70 ዓ.ም. በኋላ ክፉ ነገር እያለ የእግዚአብሔርን ፍትሕ ለመረዳት ለሚታገሉ አይሁድ፤ በኋላም ለክርስቲያን አንባቢዎች ተስፋፍቷል።
      date: የአይሁድ ዋና ክፍል በ100 ዓ.ም. ገደማ፤ የክርስቲያኖች ተጨማሪ ክፍሎች በ2ኛው–3ኛው መቶ ዘመን ዓ.ም. ገደማ።
    Didache:
      display_name: ዲዳኬ
      author: ደራሲው አይታወቅም (ርዕሱ “የአሥራ ሁለቱ ሐዋርያት ትምህርት” ማለት ነው)።
      audience: ለጥንት የክርስቲያን ጉባኤዎች—ስለ ሥነ ምግባር፣ ጥምቀት፣ ቁርባንና ተጓዥ አስተማሪዎች አጭር መመሪያ።
      date: በ1ኛው መቶ ዘመን ዓ.ም. መጨረሻ–በ2ኛው መቶ ዘመን ዓ.ም. መጀመሪያ ገደማ።
    Gospel of Thomas:
      display_name: የቶማስ ወንጌል
      author: ደራሲው አይታወቅም፤ የመክፈቻው ንግግር የአባባሎቹን ስብስብ ለ“ዲዲሞስ ይሁዳ ቶማስ” ያስገባል። ሙሉ ቅጂው የተረፈው ከናግ ሐማዲ (NHC II,2) በተገኘ የ4ኛው መቶ ዘመን የቅብጥ ትርጉም ብቻ ሲሆን፣ ከኦክሲሪንኩስም ሦስት የግሪክኛ ቁርጥራጮች ተገኝተዋል።
      audience: በሶርያዊ ጥበብና ቀደምት ግኖስቲካዊ አስተሳሰብ ተጽዕኖ የተቀረጸ፣ በኢየሱስ አባባሎች ውስጥ ያለውን ምስጢራዊ ራስን ማወቅ የሚፈልግ የክርስቲያን አንባቢ ማኅበረሰብ።
      date: የግሪክኛው መጀመሪያ ጽሑፍ ከ50–140 ዓ.ም. ገደማ ሊሆን ይችላል፤ የቅብጥ ቅጂው በ340 ዓ.ም. ገደማ።
      summary: የቶማስ ወንጌል ለኢየሱስ የተሰጡ አባባሎች ስብስብ ነው። ተከታታይ ታሪክ የለውም፤ አንባቢዎችም የአባባሎቹን ትርጉም እንዲያገኙ ደጋግሞ ይጠራል።
