payload:
  book_metadata:
    1 Corinthians:
      display_name: 1ኛ ቆሮንቶስ
      author: ጳውሎስ፣ ከሶስቴንስ ጋር።
      audience: በክፍፍል የተቸገረው በቆሮንቶስ ያለው የክርስቲያኖች ጉባኤ።
      date: በግምት እ.ኤ.አ. 53–55፣ ከኤፌሶን የተጻፈ።
    2 Corinthians:
      display_name: 2ኛ ቆሮንቶስ
      author: ጳውሎስ፣ ከጢሞቴዎስ ጋር።
      audience: ከአሳዛኝ ግጭት በኋላ ለቆሮንቶስ ጉባኤ።
      date: በግምት እ.ኤ.አ. 55–56።
    Galatians:
      display_name: ገላትያ
      author: ጳውሎስ።
      audience: ግርዛትንና የኦሪት ሕግን መጠበቅ እንዲቀበሉ ጫና የደረሰባቸው፣ በገላትያ (መካከለኛው አናቶሊያ) ያሉ የክርስቲያኖች ጉባኤዎች።
      date: በግምት እ.ኤ.አ. 48–55 (አከራካሪ ነው)።
    Ephesians:
      display_name: ኤፌሶን
      author: ጳውሎስ፣ ወይም በጳውሎስ ስም የጻፈ የቅርብ ደቀ መዝሙር (አከራካሪ ነው)።
      audience: በእስያ ለሚገኙ ክርስቲያኖች በአጠቃላይ የተጻፈ፤ “ኤፌሶን” የሚለው የቦታ ስም እጅግ ቀደምት በሆኑት የእጅ ጽሑፎች ውስጥ የለም።
      date: ጳውሎስ ከጻፈው በግምት በእ.ኤ.አ. 60ዎቹ፤ በሌላ ሰው ስም የተጻፈ ከሆነ በእ.ኤ.አ. 80ዎቹ–90ዎቹ።
    Philippians:
      display_name: ፊልጵስዩስ
      author: ጳውሎስ፣ ከጢሞቴዎስ ጋር።
      audience: በመቄዶንያ የሮም ቅኝ ግዛት በነበረችው ፊልጵስዩስ ላለው የክርስቲያኖች ጉባኤ።
      date: በግምት እ.ኤ.አ. 60–62፣ ከእስር ቤት የተጻፈ።
    Colossians:
      display_name: ቆላስይስ
      author: ጳውሎስ፣ ከጢሞቴዎስ ጋር፤ ወይም በጳውሎስ ስም የጻፈ የቅርብ ደቀ መዝሙር (አከራካሪ ነው)።
      audience: የተቀላቀለ ሃይማኖታዊ ትምህርት ለገጠማቸው፣ በሊቆስ ሸለቆ በምትገኘው ቆላስይስ ላሉ ክርስቲያኖች።
      date: ጳውሎስ ከጻፈው በግምት እ.ኤ.አ. 60–62፤ በሌላ ሰው ስም የተጻፈ ከሆነ ከዚያ በኋላ።
    1 Thessalonians:
      display_name: 1ኛ ተሰሎንቄ
      author: ጳውሎስ፣ ከስልዋኖስና ከጢሞቴዎስ ጋር።
      audience: ስደት ለገጠመው፣ በተሰሎንቄ ላለው አዲስ የክርስቲያኖች ጉባኤ።
      date: በግምት እ.ኤ.አ. 50–51፤ ምናልባትም ከጳውሎስ ደብዳቤዎች መካከል እስከ ዛሬ የተጠበቀው ቀደምቱ ነው።
    2 Thessalonians:
      display_name: 2ኛ ተሰሎንቄ
      author: ጳውሎስ (አከራካሪ ነው፤ አንዳንድ ምሁራን በጳውሎስ ስም በሌላ ሰው የተጻፈ ነው ይላሉ)።
      audience: ስለ መጨረሻው ዘመን የተፈጠረውን ግራ መጋባት ለማብራራት፣ ለተሰሎንቄ ጉባኤ።
      date: ጳውሎስ ከጻፈው በግምት እ.ኤ.አ. 51።
    1 Timothy:
      display_name: 1ኛ ጢሞቴዎስ
      author: ጳውሎስ፣ ወይም በጳውሎስ ስም የጻፈ ደቀ መዝሙር (የእረኝነት መልእክቶች በሌላ ሰው ስም እንደተጻፉ በሰፊው ይታመናል)።
      audience: በኤፌሶን የጳውሎስ ወኪል ለሆነው ጢሞቴዎስ፤ በኋለኛው ዘመን ለቤተ ክርስቲያን ሥርዓት መመሪያ የሆነ።
      date: ጳውሎስ ከጻፈው በግምት በእ.ኤ.አ. 60ዎቹ አጋማሽ፤ በሌላ ሰው ስም የተጻፈ ከሆነ በግምት እ.ኤ.አ. 90–110።
    2 Timothy:
      display_name: 2ኛ ጢሞቴዎስ
      author: ጳውሎስ፣ ወይም በጳውሎስ ስም የጻፈ ደቀ መዝሙር።
      audience: ለጢሞቴዎስ፤ ከእስር ቤት የተላከ የጳውሎስ የመሰናበቻ መልእክት ሆኖ የቀረበ።
      date: ጳውሎስ ከጻፈው በግምት በእ.ኤ.አ. 60ዎቹ አጋማሽ፤ በሌላ ሰው ስም የተጻፈ ከሆነ በግምት እ.ኤ.አ. 90–110።
    Titus:
      display_name: ቲቶ
      author: ጳውሎስ፣ ወይም በጳውሎስ ስም የጻፈ ደቀ መዝሙር።
      audience: በቀርጤስ የጳውሎስ ወኪል ለሆነው ቲቶ።
      date: ጳውሎስ ከጻፈው በግምት በእ.ኤ.አ. 60ዎቹ አጋማሽ፤ በሌላ ሰው ስም የተጻፈ ከሆነ በግምት እ.ኤ.አ. 90–110።
    Philemon:
      display_name: ፊልሞና
      author: ጳውሎስ፣ ከጢሞቴዎስ ጋር።
      audience: ሸሽቶ ስለነበረው ባሪያው አናሲሞስ፣ ባሪያ ለነበረው ክርስቲያን ፊልሞና።
      date: በግምት እ.ኤ.አ. 60–62።
    Hebrews:
      display_name: ዕብራውያን
      author: ጸሐፊው አይታወቅም። ትውፊት ጳውሎስን፣ አጵሎስን፣ በርናባስን፣ ጵርስቅላንና ሌሎችን ጠቅሷል፤ ከቀረቡት ሐሳቦች አንዱም አጠቃላይ ስምምነት አላገኘም።
      audience: ከክርስቲያናዊ እምነት ኑዛዜያቸው ወደ ኋላ ሊመለሱ የተፈተኑ፣ ግሪክኛ ተናጋሪ የአይሁድ ክርስቲያኖች።
      date: በግምት እ.ኤ.አ. 60–95።
