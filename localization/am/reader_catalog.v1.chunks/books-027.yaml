payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: ፖሊካርፕ ለፊልጵስያውያን
      author: የስምርና ጳጳስ ፖሊካርፕ። አንዳንድ ምሁራን የደረሰን ጽሑፍ ከአንድ ጊዜ በላይ የተላኩ ነገሮችን አጣምሮ እንደያዘ ያስባሉ።
      audience: የኢግናጥዮስን ደብዳቤዎች የጠየቀውና ስለ እምነት፣ ምግባር፣ አመራር፣ ገንዘብ እና ጽናት ምክር የተቀበለው በፊልጵስዩስ የነበረው የክርስቲያኖች ጉባኤ።
      date: ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን መጀመሪያ እስከ አጋማሽ፤ ቢያንስ ከፊሉ ከኢግናጥዮስ ጉዞ ጋር በቅርብ የተያያዘ ሲሆን፣ ደብዳቤው ከተለያዩ ክፍሎች የተዋቀረ ነው የሚሉ ሐሳቦች አንድ ክፍል ከዚያ ጥቂት ዘግይቶ የተጻፈ ሊሆን እንደሚችል ያስችላሉ።
    Martyrdom of Polycarp:
      display_name: የፖሊካርፕ ሰማዕትነት
      author: በስምርና ያለችው ቤተ ክርስቲያን ስም የጻፉ ስማቸው ያልታወቀ የማኅበሩ አባላት፤ በመጨረሻ ያሉት የጽሑፉ ቅብብሎሽ ማስታወሻዎች በኋላ የተደረገውን ቅጂና ስርጭት ያንጸባርቃሉ።
      audience: የፖሊካርፕን መያዝ፣ ፍርድ፣ ሞት እና አርአያ የሆነ ጽናት የሚተርክ ዘገባ የቀረበላቸው በፊሎሜልዮን ያለችው ቤተ ክርስቲያንና ሰፊው የክርስቲያኖች ኅብረት።
      date: ፖሊካርፕ ከሞተ በኋላ የተጻፈ ሲሆን፣ በአብዛኛው ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን አጋማሽ ወይም በኋለኛው ክፍል እንደተጻፈ ይታሰባል፤ የሰማዕትነቱ ትክክለኛ ዓመትም ሆነ የሰነዱ የመጨረሻ ቅርጽ አከራካሪ ነው።
    Epistle to Diognetus:
      display_name: ወደ ዲዮግኔቶስ የተላከ መልእክት
      author: ስሙ ያልታወቀ ጸሐፊ። ጸሐፊው ራሱን ደቀ መዝሙር ወይም ተማሪ ብሎ ይጠራል፤ ነገር ግን እሱም ሆነ መልእክቱ የተጻፈለት ዲዮግኔቶስ በእርግጠኝነት ሊለዩ አይችሉም።
      audience: ስለ ክርስቲያናዊ አምልኮ፣ ሥነ ምግባር፣ ማኅበራዊ ማንነት፣ ፍቅር እና እምነቱ አዲስ መስሎ ስለመታየቱ የጠየቀ የተማረ ክርስቲያን ያልሆነ ጠያቂ—እና እንደ እሱ ያሉ አንባቢዎች።
      date: ብዙውን ጊዜ ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን መጨረሻ ወይም በ3ኛው ክፍለ ዘመን መጀመሪያ እንደተጻፈ ይታሰባል፤ ሆኖም የቀረቡት ግምቶች በእጅጉ ይለያያሉ። የመጨረሻዎቹ ሁለት ምዕራፎች ከሌላ ጽሑፍ የመጡ ሊሆኑ ይችላሉ።
    Fragments of Papias:
      display_name: የፓፒያስ ቅንጭብ ጽሑፎች
      author: ለጠፋው ባለ አምስት መጻሕፍት «የጌታ ንግግሮች ማብራሪያዎች» ጸሐፊ የነበረው የሂያራፖሊስ ጳጳስ ፓፒያስ፤ አሁን ያለው ስብስብ በኋለኞቹ ጸሐፊዎች ተጠብቀው ከቆዩ ጥቅሶችና ዘገባዎች የተዋቀረ ነው።
      audience: ስማቸው በተጠቀሰ የቃል ምስክርነትና የትርጓሜ ቅብብሎሽ አማካይነት የተሰበሰቡትን፣ ስለ ኢየሱስና ስለ ሐዋርያት በትውስታ የተጠበቁ ትምህርቶች የሚፈልጉ የጥንት ክርስቲያኖች።
      date: የፓፒያስ ሥራ በአብዛኛው ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን መጀመሪያ፣ ብዙውን ጊዜ ከ110–130 ገደማ፣ እንደተጻፈ ይገመታል፤ የተረፉት ቅንጭብ ጽሑፎች ግን ከ2ኛው ክፍለ ዘመን ጀምሮ በጻፉ ጸሐፊዎች ሥራዎች ውስጥ ይገኛሉ።
