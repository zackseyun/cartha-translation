payload:
  book_metadata:
    Ezra:
      display_name: ዕዝራ
      author: ደራሲው አይታወቅም፤ ምናልባት ዜና መዋዕልን ያዘጋጀው ሰው ሊሆን ይችላል።
      audience: በፋርስ አገዛዝ ሥር ወደ አገራቸው ተመልሰው ኢየሩሳሌምን ይገነቡ ለነበሩ ሰዎች።
      date: በግምት ከክርስቶስ በፊት ከ5ኛው መቶ ዘመን አጋማሽ እስከ 4ኛው መቶ ዘመን።
    Nehemiah:
      display_name: ነህምያ
      author: ደራሲው አይታወቅም፤ ለነህምያ የተሰጠ በመጀመሪያ መደብ የተጻፈ የሕይወት ማስታወሻ ይዟል።
      audience: በፋርስ አገዛዝ ሥር ወደ አገራቸው ተመልሰው የኢየሩሳሌምን ቅጥሮች ይገነቡና ቃል ኪዳኑን ያድሱ ለነበሩ ሰዎች።
      date: በግምት ከክርስቶስ በፊት ከ5ኛው መቶ ዘመን አጋማሽ እስከ 4ኛው መቶ ዘመን።
    Esther:
      display_name: አስቴር
      author: ደራሲው አይታወቅም።
      audience: በባዕድ አገዛዝ ሥር በተለያዩ አገሮች፣ በተለይም በፋርስ፣ ተበትነው ለነበሩ አይሁድ።
      date: በግምት በፋርስ ዘመን መጨረሻ ወይም በግሪክ ዘመን መጀመሪያ (ከክርስቶስ በፊት 4ኛው–3ኛው መቶ ዘመን)።
    Job:
      display_name: ኢዮብ
      author: ደራሲው አይታወቅም።
      audience: ንጹሕ ሰው ስለሚደርስበት መከራና ስለ መለኮታዊ ፍትሕ መልስ ይፈልጉ ለነበሩ እስራኤላውያን።
      date: በጥንታዊ የጥበብ ሥነ ጽሑፍ ጥናት ዘንድ ያለው የአብዛኛው ስምምነት፣ መጽሐፉ የቆዩ የሕዝብ ተረቶችን በመጠቀም በግምት ከክርስቶስ በፊት ከ6ኛው እስከ 4ኛው መቶ ዘመን እንደተጻፈ ያስቀምጣል።
    Psalms:
      display_name: መዝሙራት
      author: በብዙ መቶ ዘመናት ውስጥ በተለያዩ ደራሲያን የተጻፉ ናቸው፤ የመዝሙራቱ መግቢያ ጽሑፎች ዳዊትን፣ አሳፍን፣ ቆሬን፣ ሰሎሞንን፣ ሙሴንና ሌሎችን ይጠቅሳሉ።
      audience: በአምልኮ ላይ ለነበሩ እስራኤላውያንና የቤተ መቅደሱ ጉባኤ፤ እንዲሁም ከዚያ በኋላ ለመጡ ጸሎትና ልቅሶ ለሚያቀርቡ ማኅበረሰቦች ሁሉ።
      date: በግምት ከክርስቶስ በፊት ከ10ኛው እስከ 3ኛው መቶ ዘመን የተጻፉ ሲሆን፣ የመጨረሻው ስብስብ ከምርኮ መልስ ዘመን ተዘጋጅቷል።
