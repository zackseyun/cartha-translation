      audience: በ70 ዓ.ም. ቤተ መቅደሱ ከፈረሰ በኋላ ስደትን ከሃይማኖታዊ አንጻር ለመረዳት ይጥሩ የነበሩ አይሁድ።
      date: በግምት ከ1ኛው ክፍለ ዘመን ዓ.ም. መጨረሻ እስከ 2ኛው ክፍለ ዘመን ዓ.ም. መጀመሪያ፤ በዋናነት በሶርያይስጥ ተጠብቆ ቆይቷል።
