  book_metadata:
    Luke:
      display_name: ሉቃስ
      author: ጸሐፊው አይታወቅም፤ ትውፊት ግን የጳውሎስ የጉዞ ባልደረባ ለነበረው ሉቃስ ያያይዘዋል።
      audience: “ቴዎፍሎስ” ተብሎ የተጠራ፣ ማንበብና መጻፍ ለሚችል የግሪክና የሮም ባህል ላለው ክርስቲያን አንባቢ ማኅበረሰብ።
      date: በእ.ኤ.አ. 80–90 ገደማ።
    John:
      display_name: ዮሐንስ
      author: ጸሐፊው አይታወቅም፤ ትውፊት ግን ለሐዋርያው ዮሐንስ ወይም “ለተወደደው ደቀ መዝሙር” ያያይዘዋል።
      audience: ከምኩራብ አይሁዳዊነት ጋር ውጥረት ውስጥ የነበረና በተወደደው ደቀ መዝሙር ምስክርነት ዙሪያ የተመሠረተ ክርስቲያን ማኅበረሰብ።
      date: በእ.ኤ.አ. 90–110 ገደማ።
      summary: ዮሐንስ፣ ኢየሱስን አብን የሚገልጥ፣ በእርሱ በመታመን ሕይወትን የሚሰጥ፣ በምልክቶቹ፣ በሞቱና በትንሣኤውም ክብርን የተቀበለ ዘላለማዊው ቃል አድርጎ ያቀርበዋል።
    Acts:
      display_name: የሐዋርያት ሥራ
      author: ጸሐፊው አይታወቅም፤ የሉቃስን ወንጌል የጻፈው ያው ጸሐፊ ነው።
      audience: የግሪክና የሮም ባህል ላለው ክርስቲያን አንባቢ ማኅበረሰብ፤ ለቴዎፍሎስ የተጻፈው ሥራ ሁለተኛ ክፍል።
      date: በእ.ኤ.አ. 80–90 ገደማ።
    Romans:
      display_name: ሮሜ
      author: ጳውሎስ፣ ከጸሐፊው ጠርጥዮስ ጋር።
