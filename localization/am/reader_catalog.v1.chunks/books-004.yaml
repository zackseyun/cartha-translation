payload:
  book_metadata:
    1 Kings:
      display_name: 1 ነገሥት
      author: ደራሲው አይታወቅም፤ የዘዳግም ታሪክ ክፍል ነው።
      audience: መንግሥቱ ለምን እንደወደቀ ለሚጠይቁ፣ በምርኮ ዘመንና ከምርኮ በኋላ ለነበሩ እስራኤላውያን።
      date: በባቢሎን ምርኮ ዘመን፣ በግምት በ6ኛው ክፍለ ዘመን ከክርስቶስ በፊት፣ የመጨረሻ ቅርጹን አግኝቷል።
    2 Kings:
      display_name: 2 ነገሥት
      author: ደራሲው አይታወቅም፤ የዘዳግም ታሪክ ክፍል ነው።
