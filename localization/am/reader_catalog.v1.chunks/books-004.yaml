      date: ከ586 ዓ.ዓ. በፊት በኋላ፣ በግምት በ6ኛው ክፍለ ዘመን ከክርስቶስ በፊት፣ የመጨረሻ ቅርጹን አግኝቷል።
    1 Chronicles:
      display_name: 1 ዜና መዋዕል
      author: ደራሲው አይታወቅም፤ በባህል “የዜና መዋዕል ጸሐፊ” ተብሎ ይጠራል።
      audience: በፋርስ አገዛዝ ዘመን በይሁድ ለነበረው፣ ከምርኮ በኋላ ማንነቱን በዳዊት፣ በቤተ መቅደሱና በአምልኮ ዙሪያ እንደገና ለሚያጸናው የይሁዳ ማኅበረሰብ።
      date: በግምት በ4ኛው ክፍለ ዘመን ከክርስቶስ በፊት።
    2 Chronicles:
