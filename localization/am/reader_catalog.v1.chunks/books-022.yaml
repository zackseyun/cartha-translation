    Gospel of Philip:
      display_name: የፊልጶስ ወንጌል
      author: ደራሲው አይታወቅም። ርዕሱ በብራናው መዝጊያ ላይ ይታያል፤ ሆኖም ሥራው ፊልጶስን እንደ ጸሐፊው አይለይም። ብቸኛው የተረፈ ቅጂ በናግ ሐማዲ ኮዴክስ II,3 ውስጥ ያለው የቅብጥ ጽሑፍ ነው።
      audience: ከቫለንቲናዊ አስተሳሰብ ጋር የሚመሳሰል የምሥጢራት ትምህርትን—በተለይ ጥምቀትን፣ ቅባትን፣ ቁርባንን፣ ቤዛነትን፣ ትንሣኤንና የሙሽራ ክፍል ምሳሌያዊ ምስሎችን—ለምታውቅ የጥንት ክርስቲያን ማኅበረሰብ።
      date: በተለምዶ የ2ኛው ክፍለ ዘመን ዓ.ም. መጨረሻ ወይም የ3ኛው ክፍለ ዘመን ዓ.ም. መጀመሪያ ተደርጎ ይታሰባል፤ ከቀደመ የግሪክኛ ቅርጽ በተተረጎመ የ4ኛው ክፍለ ዘመን የቅብጥ ብራና ውስጥ ተጠብቆ ቆይቷል።
