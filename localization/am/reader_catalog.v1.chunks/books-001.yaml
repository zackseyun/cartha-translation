payload:
  book_metadata:
    Genesis:
      display_name: ዘፍጥረት
      author: ደራሲው አይታወቅም፤ በባህል ለሙሴ ይሰጣል። ዘመናዊ ምሁራዊ ጥናት ደግሞ በኋላ አንድ ላይ የተሰናዱ ምንጮችን ያካተተ ረጅም የድርሰት ታሪክ እንዳለው ይመለከታል።
      audience: በቃል ኪዳን ማንነቱ የተገለጸው እስራኤል፤ የሕዝቡን የአጀማመር ታሪክ በእግዚአብሔር ፍጥረት፣ ምርጫና ተስፋ ላይ ያጸናል።
      date: በብዙ ምዕተ ዓመታት ውስጥ የተደረሰ ሲሆን፣ በባቢሎን ምርኮ ዘመን ወይም ከዚያ በኋላ፣ በግምት ከክርስቶስ በፊት በ6ኛው–5ኛው ምዕተ ዓመት፣ አሁን ያለውን ቅርጽ አግኝቷል።
      summary: ዘፍጥረት ስለ ፍጥረት፣ ስለ ሰው ልጅ ዓመፅና መበታተን፣ እንዲሁም እግዚአብሔር ለእስራኤል የሰጣቸው የቃል ኪዳን ተስፋዎች ስለሚጀምሩባቸው ስለ አብርሃም፣ ይስሐቅ፣ ያዕቆብና ዮሴፍ ቤተሰብ ይናገራል።
    Exodus:
      display_name: ዘፀአት
      author: ደራሲው አይታወቅም፤ በባህል ለሙሴ ይሰጣል። ዘመናዊ ምሁራዊ ጥናት ደግሞ በኋላ አንድ ላይ የተሰናዱ ምንጮችን ያካተተ ረጅም የድርሰት ታሪክ እንዳለው ይመለከታል።
      audience: ነፃ የወጣና በቃል ኪዳን የታሰረ ሕዝብ የሆነው እስራኤል፤ በእግዚአብሔር ሕግ ሥር የእርሱ ሕዝብ መሆን ምን ማለት እንደሆነ ይማራል።
      date: በብዙ ምዕተ ዓመታት ውስጥ የተደረሰ ሲሆን፣ በግምት ከክርስቶስ በፊት በ6ኛው–5ኛው ምዕተ ዓመት አሁን ያለውን ቅርጽ አግኝቷል።
