      display_name: ዘሌዋውያን
      author: ደራሲው አይታወቅም፤ በባህል ለሙሴ ይሰጣል። ዘመናዊ ምሁራዊ ጥናት ደግሞ የካህናት ምንጭ ክፍል እንደሆነ ይመድበዋል።
      audience: የእስራኤል ካህናትና አምላኪው ማኅበረሰብ፤ ስለ መሥዋዕት፣ ቅድስናና ሕይወትን በእግዚአብሔር ህልውና ዙሪያ ስለ ማደራጀት መመሪያዎችን ይሰጣል።
      date: ከንጉሣዊው ዘመን መጨረሻ እስከ ድኅረ ምርኮ ዘመን የሚደርሱ የድርሰት ንብርብሮች አሉት፤ በግምት ከክርስቶስ በፊት ከ7ኛው–5ኛው ምዕተ ዓመት።
