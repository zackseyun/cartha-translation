payload:
  book_metadata:
    Infancy Gospel of Thomas:
      display_name: የቶማስ የሕፃንነት ወንጌል
      author: ደራሲው አይታወቅም። እንደገና ማዋቀር በሚቻልበት ጥንታዊው ቅርጽ ውስጥ የደራሲ ስም አልተጠቀሰም፤ ለቶማስ መሰጠቱ በኋለኞቹ የብራና ቅጂዎች ርዕሶችና የጽሑፉ ቅብብሎሽ የተገኘ ነው።
      audience: ስለ ኢየሱስ ሕፃንነት፣ እንዲሁም ቀኖናዊዎቹ የወንጌል ታሪኮች ከመጀመራቸው በፊት መለኮታዊ ኃይል፣ ተግሣጽ፣ ትምህርትና እድገት እንዴት በትረካ ሊቀርቡ እንደሚችሉ ለማወቅ የሚጓጉ ክርስቲያኖች።
      date: ብዙውን ጊዜ መነሻው በ2ኛው ክፍለ ዘመን ዓ.ም. እንደሆነ ይታሰባል፤ ሆኖም ጽሑፉ እርስ በርሳቸው በእጅጉ በሚለያዩ በርካታ የግሪክኛ እትሞችና ቀደምት ትርጉሞች ተጠብቆ ቆይቷል።
    Acts of Paul and Thecla:
      display_name: የጳውሎስና የቴክላ ሥራዎች
      author: ደራሲው አይታወቅም። ይህ ከሰፊው የጳውሎስ ሥራዎች የተወሰደ ክፍል ነው፤ አንድ ቀሳውስት ይህን መጽሐፍ እንዳዘጋጀ የሚናገር ጥንታዊ ዘገባ ደራሲውን በእርግጠኝነት ሊለይ አይችልም።
      audience: ስለ ሐዋርያዊ ስብከት፣ ያለ ጋብቻ ስለ መኖር፣ ጥምቀት፣ ሰማዕትነትን ስለሚመስል ጽናት፣ እንዲሁም አንዲት ሴት ለማስተማርና ለመመስከር ስላላት ሥልጣን በሚናገሩ ታሪኮች የሚማረኩ ክርስቲያኖች።
      date: በ2ኛው ክፍለ ዘመን ዓ.ም.፣ ምናልባትም በኋለኛው አጋማሽ፣ ተዘጋጅቷል፤ በየጳውሎስ ሥራዎች ውስጥም ሆነ እንደ ገለልተኛ መጽሐፍ ይሰራጭ ነበር።
    Gospel of Peter:
      display_name: የጴጥሮስ ወንጌል
      author: ደራሲው አይታወቅም። ተጠብቆ የቆየው ትረካ በጴጥሮስ አንደበት የተነገረ ሲሆን በስሙም ተላልፏል፤ ነገር ግን የታሪካዊው ሐዋርያ ሥራ ተደርጎ አይቆጠርም።
      audience: በሰፋ የቀረበውን የሕማምና የትንሣኤ ትረካ ለማወቅ የሚፈልጉ ቀደምት ክርስቲያኖች፤ ምናልባትም የጴጥሮስ ሥልጣን ልዩ ክብደት በነበረው ማኅበረሰብ ውስጥ።
      date: ብዙውን ጊዜ በ2ኛው ክፍለ ዘመን ዓ.ም. እንደተጻፈ ይገመታል፤ በዋናነት ተጠብቆ የቆየው የግሪክኛ ቁራጭ ግን በአኽሚም ከተገኘ እጅግ ኋለኛ ዘመን የብራና ቅጂ የመጣ ነው።
    2 Clement:
      display_name: 2 ቀሌምንጦስ
      author: ደራሲው አይታወቅም። ባሕላዊ ርዕሱ እንዲህ ቢልም፣ ይህ በሮም ቀሌምንጦስ የተጻፈ ሁለተኛ ደብዳቤ ሳይሆን የቀደምት ክርስቲያኖች ስብከት ነው።
      audience: ንስሐ እንዲገባ፣ ምግባሩን ከእምነቱ ጋር እንዲያስማማ፣ ለተጎጂዎች እንዲጠነቀቅ፣ እንዲሁም ትንሣኤንና ፍርድን በመተማመን በታማኝነት እንዲጸና የተመከረ የክርስቲያኖች ጉባኤ።
      date: ብዙውን ጊዜ በ2ኛው ክፍለ ዘመን ዓ.ም. የመጀመሪያ አጋማሽ ወይም አጋማሽ (በግምት ከ100–160 ዓ.ም.) እንደተጻፈ ይታሰባል፤ የተጻፈበት ቦታ አይታወቅም።
    Epistle of Barnabas:
      display_name: የበርናባስ መልእክት
      author: ደራሲው አይታወቅም። መጽሐፉ በባሕል ከጳውሎስ ባልደረባ ከበርናባስ ጋር ቢያያዝም፣ ዘመናዊ ምሁራን ይህን የደራሲነት ግምት አይቀበሉትም።
      audience: የቃል ኪዳን ማንነታቸውን ከአይሁድ ልማዶች በመለየት፣ የእስራኤልን ቅዱሳት መጻሕፍት ክርስቶስን ማዕከል ባደረገና ምሳሌያዊ በሆነ ትርጓሜ የራሳቸው አድርገው እንዲቀበሉ የሚማሩ ከአሕዛብ የመጡ ክርስቲያኖች።
      date: በተለምዶ በ70 ዓ.ም. የኢየሩሳሌም ቤተ መቅደስ ከፈረሰበት ጊዜ እስከ 2ኛው ክፍለ ዘመን ዓ.ም. መጀመሪያ ድረስ፣ ብዙውን ጊዜም በግምት ከ80–130 ዓ.ም. መካከል እንደተጻፈ ይታሰባል።
  chapter_titles:
    Protoevangelium of James:
      '11':
        title: መልአኩ የማርያምን ቅዱስ ተልእኮ ያበስራል
      '12':
        title: ማርያም ኤልሳቤጥን ጎብኝታ ትመለሳለች
      '13':
        title: ዮሴፍ በማርያም መፀነስ ያዝናል
      '14':
        title: ዮሴፍ በሕልሙ መልአኩ ሲናገር ያያል
      '15':
        title: ካህኑ ዮሴፍን በበደል ይከሳል
      '16':
        title: ዮሴፍ ከፈተናው በኋላ ማርያምን ይለቅቃል
      '17':
        title: ማርያም ወደ ቤተልሔም ትጓዛለች
      '18':
        title: ዮሴፍ የቆመ ዓለምን ያያል
      '19':
        title: አዋላጇ የድንግልን መውለድ ታያለች
      '20':
        title: ሰሎሜ ማርያምን ስትመረምር እጇ ይቃጠላል
      '21':
        title: ሰብአ ሰገል አዲስ የተወለደውን ንጉሥ ይፈልጋሉ
      '22':
        title: ሄሮድስ ሕፃናት እንዲገደሉ ያዛል
      '23':
        title: ዘካርያስ የሄሮድስን ዛቻ ይጋፈጣል
      '24':
        title: ዘካርያስ በመቅደሱ ይገደላል
      '25':
        title: ያዕቆብ በብጥብጡ ወቅት ታሪኩን ይጽፋል
      '26':
        title: የቦድመር ፓፒረስ አጭሩን እትም ይዟል
      '27':
        title: ዮሴፍ በቤተልሔም አዋላጅ ይፈልጋል
      '28':
        title: ዮሴፍ የማርያምን ተአምር ያስረዳል
      '29':
        title: ሰሎሜ ሕፃኑን በመንካት ትፈወሳለች
      '30':
        title: ሰብአ ሰገል የአይሁድን ንጉሥ ይፈልጋሉ
    Infancy Gospel of Thomas:
      '1':
        title: ቶማስ ስለ ኢየሱስ ይናገራል
      '2':
        title: ኢየሱስ ውኃውን ያጠራል፤ ወፎችንም ይሠራል
      '3':
        title: ኢየሱስ የሐናን ልጅ ይረግማል
      '4':
        title: ኢየሱስ አንድን ሕፃን ይረግማል፤ ሕፃኑም ይሞታል
      '5':
        title: ኢየሱስ ዮሴፍን ጥበብ ያስተምራል
      '6':
        title: መምህሩ የኢየሱስን ጥበብ መቋቋም ይሳነዋል
      '7':
        title: መምህሩ የኢየሱስን የላቀ እውቀት ያምናል
      '8':
        title: ኢየሱስ ይስቃል፣ ይፈውሳል፣ ያውጃል
      '9':
        title: ኢየሱስ የወደቀውን ዜኖን ከሞት ያስነሣል
      '10':
        title: ኢየሱስ የእንጨት ቆራጩን እግር ይፈውሳል
      '11':
        title: ኢየሱስ የተሰበረውን እንስራ በተአምር ይሞላል
      '12':
        title: ዮሴፍ የኢየሱስን ዘር ያጭዳል
      '13':
        title: ዮሴፍ ከኢየሱስ ጋር አልጋውን ያጠናቅቃል
      '14':
        title: መምህሩ ኢየሱስን ከተገዳደረ በኋላ ይሞታል
      '15':
        title: ኢየሱስ ተናግሮ መምህሩን ደስ ያሰኛል
      '16':
        title: ኢየሱስ ያዕቆብን ከእባብ ንክሻ ይፈውሳል
      '17':
        title: ኢየሱስ ሕፃኑን ዮሴፍ ይፈውሳል
      '18':
        title: ኢየሱስ በስፍራው አንድን ሰው ከሞት ያስነሣል
      '19':
        title: የአሥራ ሁለት ዓመቱ ኢየሱስ በቤተ መቅደስ ያስተምራል
    Acts of Paul and Thecla:
      '1':
        title: ጳውሎስ በኦኔሲፎሮስ ቤት ይሰብካል
      '2':
        title: ቴክላ ጳውሎስን እየሰማች ትናፍቀዋለች
      '3':
        title: ታሚሪስ ጳውሎስን በገዢው ፊት ይከሳል
      '4':
        title: ቴክላ ጳውሎስን በእስር ቤት ጎብኝታ ታበረታታዋለች
      '5':
        title: ቴክላ በእንጨት ላይ ከመቃጠል ታመልጣለች
      '6':
        title: ጳውሎስ ከቴክላ ጋር ይጾማል፣ ይጸልያል
      '7':
        title: ጳውሎስ ቴክላን ወደ አንጾኪያ ይልካታል
      '8':
        title: ትሪፊና ቴክላን ከአውሬዎች ትጠብቃለች
      '9':
