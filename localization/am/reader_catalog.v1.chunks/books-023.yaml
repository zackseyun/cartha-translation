payload:
  book_metadata:
    Gospel of Mary:
      display_name: የማርያም ወንጌል
      author: ደራሲው አይታወቅም። ድርሰቱ ማርያምን የኢየሱስን መገለጥ እንደተቀበለችና እንደተረጎመች ያቀርባታል፤ ነገር ግን የተረፈውን ወንጌል ማርያም እንደጻፈችው አይናገርም።
      audience: ስለ መገለጥ፣ መንፈሳዊ ዕርገት፣ ሐዋርያዊ ሥልጣን እና በኢየሱስ ደቀ መዛሙርት መካከል የማርያም ትምህርት ተቀባይነት ሊኖረው ስለመቻሉ ሲያስቡ ለነበሩ የጥንት ክርስቲያን አንባቢዎች።
      date: በአብዛኛው ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን እንደተጻፈ ይገመታል፤ የግሪክኛ ቁርጥራጮች ከ3ኛው ክፍለ ዘመን ተርፈዋል፣ ዋናው የቅብጥኛ ምስክር ጽሑፍም ከ5ኛው ክፍለ ዘመን በሆነው የበርሊን ኮዴክስ 8502 ውስጥ ተጠብቆ ይገኛል።
    Treatise on the Resurrection:
      display_name: ስለ ትንሣኤ የተጻፈ ድርሰት
      author: ደራሲው አይታወቅም። ድርሰቱ አንድ መምህር ሬጊኖስ ለተባለ ተማሪው እንደጻፈው ደብዳቤ ሆኖ ቀርቧል፤ መምህሩም ሆነ ሬጊኖስ ማን እንደሆኑ በእርግጠኝነት ማወቅ አይቻልም።
      audience: ስለ ትንሣኤ ትምህርት ለሚፈልጉ ክርስቲያኖች፣ በተለይም በትንሣኤ ሕይወት ሥጋዊ፣ መንፈሳዊ እና አሁናዊ ተሳትፎ ምን እንደሆነ ለሚመዝኑ አንባቢዎች።
      date: በአብዛኛው ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን መጨረሻ (ብዙውን ጊዜ በግምት 170–200) እንደተጻፈ ይታሰባል፤ ቀደም ብሎ ከተጻፈ የግሪክኛ ድርሰት በተተረጎመ፣ ከ4ኛው ክፍለ ዘመን በሆነ የቅብጥኛ ቅጂ ተጠብቆ ይገኛል።
    Dialogue of the Savior:
      display_name: የአዳኙ ውይይት
      author: ደራሲው አይታወቅም። ውይይቱ ኢየሱስ ከይሁዳ፣ ከማቴዎስ እና ከማርያም ጋር ሲነጋገር የመገለጥ ትምህርትን በአፉ ያስቀምጣል፤ ነገር ግን አሰናጅቶ ያቀረበውን ሰው አይገልጽም።
      audience: በግል መገለጥ፣ በደቀ መዝሙርነት፣ ራስን በማወቅ፣ በጸሎት እና ለድነት በሚያዘጋጅ የተጋድሎ ኑሮ ፍላጎት ለነበረው የጥንት ክርስቲያን ማኅበር።
      date: በተለምዶ ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን እንደተጻፈ ይታሰባል፤ ሆኖም የአጻጻፉ ደረጃዎችና ትክክለኛ ዘመኑ አሁንም አከራካሪ ናቸው። ድርሰቱ ከ4ኛው ክፍለ ዘመን በሆነ የቅብጥኛ የእጅ ጽሑፍ ተጠብቆ ይገኛል።
    Exegesis on the Soul:
      display_name: ስለ ነፍስ ትርጓሜ
      author: ደራሲው አይታወቅም። ደራሲው የመጽሐፍ ቅዱስንና የግሪክ ሥነ ጽሑፍን ምስሎች የነፍስ ውድቀት፣ ንስሓ እና መመለስ ምሳሌ አድርጎ እንደገና የሚተረጉም ክርስቲያን ሰባኪ ነው።
      audience: ቅዱሳት መጻሕፍትንና የሥነ ምግባር ምክርን ለሚያውቁ፣ ከተዛባ ምኞት ወደ ንስሓና ከመለኮታዊው ጋር ወደ መታረቅ ለሚጠሩ ክርስቲያኖች።
      date: በአጠቃላይ ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን መጨረሻ ወይም በ3ኛው ክፍለ ዘመን መጀመሪያ እንደተጻፈ ይታሰባል፤ ከግሪክኛ በተተረጎመ፣ ከ4ኛው ክፍለ ዘመን በሆነ የቅብጥኛ ትርጉም ተጠብቆ ይገኛል።
    Book of Thomas the Contender:
      display_name: የተፋላሚው ቶማስ መጽሐፍ
      author: ደራሲው አይታወቅም። የመዝጊያ ርዕሱ ድርሰቱን ከይሁዳ ቶማስ ጋር ያዛምደውና ማትያስን መዝጋቢው ብሎ ይጠራዋል፤ እነዚህ ግን ሊረጋገጡ የሚችሉ የደራሲነት መግለጫዎች ሳይሆኑ ሥነ ጽሑፋዊ ውሰናዎች ናቸው።
      audience: ራስን ለማወቅ፣ ሥጋዊ ምኞቶችን ለመቋቋም እና ኢየሱስ ለቶማስ በግል የሰጠውን ትምህርት ለመረዳት ለሚበረታቱ የተጋድሎ ኑሮን የሚያዘነብሉ ክርስቲያኖች።
      date: ብዙውን ጊዜ ከክርስቶስ ልደት በኋላ በ2ኛው ክፍለ ዘመን መጨረሻ ወይም በ3ኛው ክፍለ ዘመን መጀመሪያ፣ ምናልባትም በሶርያ ክርስቲያናዊ አውድ እንደተጻፈ ይታሰባል፤ ከ4ኛው ክፍለ ዘመን በሆነ የቅብጥኛ የእጅ ጽሑፍ ተጠብቆ ይገኛል።
    Tripartite Tractate:
      display_name: ባለሦስት ክፍል ድርሰት
      author: ደራሲው አይታወቅም። ደራሲው ከፍተኛ ትምህርት የነበረው ቫለንቲናዊ ክርስቲያን የነገረ መለኮት ምሁር ነበር፤ ከአንድ የታወቀ መምህር ጋር በእርግጠኝነት ማዛመድ አይቻልም።
      audience: ስለ እግዚአብሔር፣ ኤዎናት፣ ፍጥረት፣ ክርስቶስ፣ ቤተ ክርስቲያን፣ ድነት እና የመጨረሻ መመለስ ሰፊ ትምህርት ለሚቀበል ቫለንቲናዊ ክርስቲያን ማኅበር።
      date: በአብዛኛው ከክርስቶስ ልደት በኋላ በ3ኛው ክፍለ ዘመን እንደተጻፈ ይታሰባል፤ አንዳንድ ሙግቶች የዚያን ክፍለ ዘመን የኋለኛ አጋማሽ ይጠቁማሉ። በቅብጥኛ ቋንቋ ተጠብቆ የሚገኘው በ4ኛው ክፍለ ዘመን በተዘጋጀው የዩንግ ኮዴክስ ውስጥ ነው።
    Apocryphon of John:
      display_name: የዮሐንስ ምስጢራዊ መጽሐፍ
      author: ደራሲው አይታወቅም። ድርሰቱ ከሙታን የተነሣው ኢየሱስ ለዘብዴዎስ ልጅ ዮሐንስ የሰጠው መገለጥ እንደሆነ በሌላ ሰው ስም ያቀርባል፤ ከአንድ በላይ ጥንታዊ የጽሑፍ እትሞችም ተርፈውታል።
      audience: ስለ መለኮታዊው ዓለም፣ ፍጥረት፣ የሰው ማንነት እና ከጠላት ገዥዎች ነፃ መውጣት ትረካ ለሚፈልጉ፣ በሴታዊ ወይም ከእርሱ ጋር በቅርብ በተዛመደ የመገለጥ ወግ ውስጥ ለነበሩ ክርስቲያኖች።
      date: የቀደመው ቅርጽ ምናልባት በ2ኛው ክፍለ ዘመን ተሰራጭቶ ነበር፤ አጭርና ረጅም እትሞችን የጠበቁት የቅብጥኛ ምስክር ጽሑፎች ግን ከ4ኛውና ከ5ኛው ክፍለ ዘመን ናቸው።
  chapter_titles:
    Gospel of Philip:
      '17':
        title: ኢየሱስ ክፋትን ገልጦ ያስወግዳል
      '18':
        title: ቅዱስ ኅብረት ዘላለማዊ ብርሃንን ያመጣል
    Gospel of Mary:
      '1':
        title: አዳኙ ኃጢአትን ስለመቃወም ያስተምራል
      '2':
        title: ኢየሱስ ደቀ መዛሙርቱን በሰላም ይልካል
      '3':
        title: ማርያም በትምህርቶቹ ታጽናናለች
