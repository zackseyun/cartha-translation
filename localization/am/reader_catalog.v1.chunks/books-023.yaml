    Treatise on the Resurrection:
      '1':
        title: ክርስቶስ እውነተኛ ፍጻሜን ያመጣል
      '2':
        title: ክርስቶስ የሞትን ጉልበት ድል ያደርጋል
      '3':
        title: ትንሣኤ እውነታን ይለውጣል
      '4':
        title: አማኞች በክርስቶስ ትንሣኤ ይካፈላሉ
      '5':
        title: በክርስቶስ ትንሣኤ ማመን
      '6':
