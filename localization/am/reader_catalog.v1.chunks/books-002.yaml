payload:
  book_metadata:
    Numbers:
      display_name: ዘኍልቍ
      author: ደራሲው አይታወቅም፤ በትውፊት ለሙሴ ይሰጣል።
      audience: ከግብፅ ወደ ተስፋይቱ ምድር በመጓዝ ላይ የነበረው እስራኤል—የምድረ በዳው ትውልድና ከስህተቶቹ የሚማሩ የኋላ ዘመን አንባቢዎች።
      date: ከንጉሣዊው ዘመን መጨረሻ አንስቶ እስከ ምርኮ በኋላው ዘመን ድረስ የተፈጠሩ የድርሰት ንብርብሮች (በግምት ከ7ኛው እስከ 5ኛው ክፍለ ዘመን ዓ.ዓ.)።
    Deuteronomy:
      display_name: ዘዳግም
      author: ደራሲው አይታወቅም፤ ጽሑፉ የሙሴ የመሰናበቻ ንግግሮች ሆኖ ቀርቧል። ዘመናዊ ምርምር ዋናውን ክፍል በኢዮስያስ ዘመን፣ በ7ኛው ክፍለ ዘመን ዓ.ዓ. መጨረሻ ከተደረገው ማሻሻያ ጋር ያያይዘዋል።
      audience: ወደ ምድሪቱ ለመግባት የተዘጋጀው እስራኤል—በኋላም ያለ ቤተ መቅደስና ያለ ንጉሥ በታማኝነት እንዴት መኖር እንደሚቻል የጠየቁ ምርኮኞች።
      date: ዋናው ክፍል በግምት በ7ኛው ክፍለ ዘመን ዓ.ዓ. መጨረሻ፤ በምርኮው ዘመን የመጨረሻ ቅርጹን አግኝቷል።
    Joshua:
      display_name: ኢያሱ
      author: ደራሲው አይታወቅም፤ የዘዳግም ታሪክ ክፍል ነው።
      audience: በንጉሣዊውና በምርኮው ዘመን ስለ ወረራ፣ ስለ ቃል ኪዳንና ስለ ምድሪቱ ትርጉም ያሰላሰለው እስራኤል።
      date: ከቀደሙ ትውፊቶች በግምት በ7ኛው–6ኛው ክፍለ ዘመን ዓ.ዓ. ተሰብስቦ ተዘጋጅቷል።
