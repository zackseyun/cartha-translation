payload:
  book_metadata:
    Joel:
      display_name: ኢዩኤል
      author: የፋቱኤል ልጅ ኢዩኤል።
      audience: የአንበጣ ወረርሽኝን የእግዚአብሔር ቀን ምልክት አድርጎ ለተቀበለው፣ ከምርኮ በኋላ ለነበረው ይሁዳ።
      date: ምናልባት በ5ኛው–4ኛው መቶ ዘመን ዓ.ዓ. አካባቢ።
    Amos:
      display_name: አሞጽ
      author: በሰሜኑ የሰበከ፣ ከይሁዳ የመጣው የቴቁሔ እረኛ አሞጽ።
      audience: በኢዮርብዓም ዳግማዊ ዘመን ብልጽግናና ኢፍትሐዊነት ሰፍኖበት ለነበረው ሰሜናዊው እስራኤል።
      date: በ760–750 ዓ.ዓ. አካባቢ።
    Obadiah:
      display_name: አብድዩ
      author: አብድዩ።
      audience: ኤዶም ኢየሩሳሌምን ከከዳች በኋላ ለነበረው ይሁዳ—ስለ ኤዶም ውድቀት የተነገረ ትንቢት።
      date: ከ586 ዓ.ዓ. ብዙም ሳይቆይ።
    Jonah:
      display_name: ዮናስ
      author: ጸሐፊው አይታወቅም፤ ዋናው ገጸ ባሕርይ የአማቴ ልጅ ዮናስ ነው።
      audience: ከምርኮ በኋላ ለነበረው እስራኤል—በዘር የተወሰነ ጠባብነትን በሽሙጥ የሚገሥጽና እግዚአብሔር ከማኅበረሰቡ ውጭ ላሉትም ያለውን ምሕረት የሚያረጋግጥ መልእክት።
      date: ምናልባት በ5ኛው–4ኛው መቶ ዘመን ዓ.ዓ. አካባቢ።
    Micah:
      display_name: ሚክያስ
      author: የሞሬሼቱ ሚክያስ።
      audience: በ8ኛው መቶ ዘመን ዓ.ዓ. መጨረሻ ለነበረው ይሁዳ፤ በተለይም በከተማ ልሂቃን የተጨቆኑትን የገጠር ድሆች በመደገፍ።
      date: በ740–700 ዓ.ዓ. አካባቢ።
    Nahum:
      display_name: ናሆም
      author: የኤልቆሽ ሰው ናሆም።
      audience: የነነዌን በቅርቡ መውደቅ ደስ ብሎት ለሚጠባበቀው ይሁዳ።
      date: ከ612 ዓ.ዓ. ጥቂት ቀደም ብሎ።
    Habakkuk:
      display_name: ዕንባቆም
      author: ዕንባቆም።
      audience: የባቢሎንን መነሣት ለተጋፈጠው ይሁዳ—አንድ ነቢይ ስለ ፍትሕ ከእግዚአብሔር ጋር ያደረገው ምልልስ።
      date: በ7ኛው መቶ ዘመን ዓ.ዓ. መጨረሻ አካባቢ።
    Zephaniah:
      display_name: ሶፎንያስ
      author: የኩሲ ልጅ ሶፎንያስ።
      audience: ኢዮስያስ በነገሠበት ዘመን፣ ማሻሻያዎቹ ሊጀምሩ በተቃረቡበት ወቅት ለነበረው ይሁዳ።
      date: በ640–609 ዓ.ዓ. አካባቢ።
    Haggai:
      display_name: ሐጌ
      author: ሐጌ።
      audience: በዳርዮስ ዘመን ቤተ መቅደሱን ይገነቡ ለነበሩት ከምርኮ ተመላሾች።
      date: 520 ዓ.ዓ.
    Zechariah:
      display_name: ዘካርያስ
      author: የበራክዩ ልጅ ዘካርያስ፤ ምዕራፍ 9–14 ምናልባት በኋላ በነበረ ሌላ ጸሐፊ የተጻፉ ናቸው።
      audience: ቤተ መቅደሱን ይገነቡ ለነበሩት ከምርኮ ተመላሾችና ከዚያም በኋላ ለነበሩ የድኅረ ምርኮ ማኅበረሰቦች።
      date: ምዕራፍ 1–8 በ520–518 ዓ.ዓ. አካባቢ፤ 9–14 ምናልባት ከአንድ መቶ ዓመት ገደማ በኋላ።
    Malachi:
      display_name: ሚልክያስ
      author: ጸሐፊው አይታወቅም፤ “ሚልክያስ” ማለት “መልእክተኛዬ” ማለት ነው።
      audience: በፋርስ አገዛዝ ሥር በአምልኮና በታማኝነት እየላላ ለመጣው፣ ከምርኮ በኋላ ለነበረው ይሁዳ።
      date: በ5ኛው መቶ ዘመን ዓ.ዓ. አጋማሽ አካባቢ።
    Matthew:
      display_name: ማቴዎስ
      author: ጸሐፊው አይታወቅም፤ ትውፊት ለሐዋርያው ማቴዎስ ይሰጠዋል። ዘመናዊ ምሁራዊ ጥናት ግን ከማርቆስና ከQ ከሚመስል ምንጭ የተጠቀመ ግሪክኛ ተናጋሪ አይሁዳዊ ክርስቲያን ጸሐፊ እንደጻፈው ይመለከታል።
      audience: ከምኩራብ አይሁዳዊነት ጋር ባለው ቀጣይነትና ልዩነት ጉዳይ ላይ ይታገል ለነበረ አይሁዳዊ ክርስቲያን ማኅበረሰብ።
      date: በ80–90 ዓ.ም. አካባቢ።
    Mark:
      display_name: ማርቆስ
      author: ጸሐፊው አይታወቅም፤ ትውፊት ከጴጥሮስ የጉዞ ጓደኛ ከነበረው ከዮሐንስ ማርቆስ ጋር ያያይዘዋል።
      audience: ምናልባት በሮም፣ በስደት ሥጋት ሥር ወይም በስደት አደጋ አቅራቢያ ለነበረ ግሪክኛ ተናጋሪ ክርስቲያን ማኅበረሰብ።
      date: በ65–75 ዓ.ም. አካባቢ፤ በአይሁድ ጦርነትና በቤተ መቅደሱ መፍረስ ወቅት አካባቢ።
