payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: የገዢዎች ምንነት
      author: ስሙ ያልታወቀ ደራሲ። ደራሲው ዘፍጥረትን ስለ ገዢዎቹ በሚናገር የራእይ አፈ ታሪክ ይተረጉመዋል፤ ይህን ሥራ ለአንድ በስም ለሚታወቅ መምህር በእርግጠኝነት መመደብ አይቻልም።
      audience: ዘፍጥረትን በማያውቁ የዓለማት ገዢዎች፣ በመለኮታዊ ጥበብና በሰው ልጅ መንፈሳዊ አመጣጥ መካከል እንደሚካሄድ ግጭት አድርገው የሚያነቡ፣ ከሴታውያን ወይም ከተዛማጅ አካባቢ የነበሩ ክርስቲያኖች።
      date: በተለምዶ በ3ኛው ክፍለ ዘመን ዓ.ም. እንደተጻፈ ይገመታል፤ በ4ኛው ክፍለ ዘመን በተገለበጠው የናግ ሐማዲ ኮዴክስ II የቅብጥ ቅጂ ውስጥ ተጠብቆ ይገኛል።
    On the Origin of the World:
      display_name: ስለ ዓለም አመጣጥ
      author: ስሙ ያልታወቀ ደራሲ። ጽሑፉ አዘጋጁን በስም ሳይጠቅስ የተለያዩ የአይሁድ፣ የክርስቲያን፣ የፕላቶናዊና የአፈ ታሪክ ወጎችን ያዋህዳል፣ እንደገናም ያቀናብራል።
      audience: ስለ ፍጥረት፣ ስለ ዓለማት ገዢዎች፣ ስለ ሶፊያ፣ ስለ አዳምና ሔዋን እንዲሁም ስለ ዓለም የመጨረሻ ዕጣ ከተለመደው የተለየ ታሪክ የሚፈልጉ፣ በግኖስጢሳዊ ዝንባሌ ባለው ክርስቲያናዊ አካባቢ የሚገኙ አንባቢዎች።
      date: ብዙውን ጊዜ በ3ኛው ክፍለ ዘመን ዓ.ም. እንደተጻፈ ይገመታል፤ ምንም እንኳ ቀደምት ምንጮች መሠረት ሆነውት ሊሆኑ ቢችሉም። በዋናነት በ4ኛው ክፍለ ዘመን በተዘጋጁ የቅብጥ ምስክሮች ተጠብቆ ይገኛል።
    Sophia of Jesus Christ:
      display_name: የኢየሱስ ክርስቶስ ሶፊያ
      author: ስሙ ያልታወቀ ደራሲ። ደራሲው በኤውግኖስጦስ ውስጥም የሚታወቀውን ይዘት፣ ኢየሱስ ከትንሣኤው በኋላ ከደቀ መዛሙርቱ ጋር እንዳደረገው ውይይት አድርጎ አቀናብሮታል።
      audience: ስለ ሁሉን ተሻጋሪው አምላክ፣ ስለ ሰማያዊው ዓለም ሥርዓት፣ እንዲሁም ስለ ነፍስ አመጣጥና ድነት በተገለጠ ጥበብ ላይ ፍላጎት ያላቸው ክርስቲያኖች።
      date: ብዙውን ጊዜ በ2ኛው ክፍለ ዘመን መጨረሻ ወይም በ3ኛው ክፍለ ዘመን ዓ.ም. እንደተጻፈ ይገመታል፤ ከናግ ሐማዲና ከበርሊን ኮዴክስ በተገኙ የቅብጥ ቅጂዎች ተጠብቆ ይገኛል።
    Gospel of the Egyptians:
      display_name: የግብፃውያን ወንጌል
      author: ስሙ ያልታወቀ ደራሲ። «የታላቁ የማይታይ መንፈስ ቅዱስ መጽሐፍ» ተብሎም የሚጠራው ይህ የናግ ሐማዲ ጽሑፍ፣ በጥቅሶች ብቻ ከሚታወቀው ቀደምት የግሪክ «የግብፃውያን ወንጌል» የተለየ ነው።
      audience: መንፈሳዊ ማንነትንና መዳንን ለመግለጽ ጥልቅ አፈ ታሪክን፣ ቅዱሳን ስሞችን፣ የጥምቀት ምስሎችንና መዝሙራዊ ምስጋናን የሚጠቀም የሴታውያን ክርስቲያን ማኅበረሰብ።
      date: ብዙውን ጊዜ በ2ኛው ወይም በ3ኛው ክፍለ ዘመን ዓ.ም. እንደተጻፈ ይገመታል፤ ሁለት የቅብጥ ቅጂዎች በ4ኛው ክፍለ ዘመን የናግ ሐማዲ ኮዴክሶች ውስጥ ተጠብቀው ይገኛሉ።
    Letter of Peter to Philip:
      display_name: ጴጥሮስ ለፊልጶስ የጻፈው ደብዳቤ
      author: ስሙ ያልታወቀ ደራሲ። አጭሩ የመክፈቻ ደብዳቤና ተከትሎ የሚመጣው ራእይ ለጴጥሮስና ለፊልጶስ በሌላ ሰው ስም የተሰጡ ናቸው፤ በሁለቱ ሐዋርያት በአንዳቸው እንደተጻፉ በእርግጠኝነት ሊረጋገጥ አይችልም።
      audience: ስለ አዳኙ፣ ስለ ጠላት ኃይሎች፣ ስለ መከራ፣ ስለ ተልእኮና ስለ ደቀ መዛሙርቱ መታደስ ለሚሰጠው ትምህርት ሐዋርያዊ ሥልጣን የሚፈልጉ ክርስቲያኖች።
      date: በተለምዶ በ2ኛው ክፍለ ዘመን መጨረሻ ወይም በ3ኛው ክፍለ ዘመን መጀመሪያ ዓ.ም. እንደተጻፈ ይገመታል፤ በ4ኛው ክፍለ ዘመን የናግ ሐማዲ ቅጂና ከዚያ በኋላ በተዘጋጀ የቅብጥ ቅጂ ተጠብቆ ይገኛል።
    Gospel of Judas:
      display_name: የይሁዳ ወንጌል
      author: ስሙ ያልታወቀ ደራሲ። ርዕሱ ትረካውን ለይሁዳ ቢያቀርበውም፣ ጽሑፉ የአስቆሮቱ ይሁዳ ታሪካዊ ደራሲው እንደሆነ አያረጋግጥም።
      audience: ተቀናቃኝ የመሥዋዕትና የቤተ ክርስቲያን ልማዶችን የሚተች፣ ይሁዳንና የኢየሱስን ሞት እንደገና ለመተርጎም የራእይ ውይይትንና የሴታውያን ዓይነት የዓለማት አስተሳሰብን የሚጠቀም ክርስቲያን ቡድን።
      date: ብዙውን ጊዜ በ2ኛው ክፍለ ዘመን መካከል ወይም መጨረሻ ዓ.ም. እንደተጻፈ ይገመታል፤ ኢራኔዎስ በ180 ዓ.ም. አካባቢ «የይሁዳ ወንጌል» የተባለ ጽሑፍ ያውቅ ነበር፣ አሁን ያለው የቅብጥ ቅጂ ደግሞ ምናልባት ከ3ኛው ወይም ከ4ኛው ክፍለ ዘመን ነው።
    Protoevangelium of James:
      display_name: የያዕቆብ ቀዳማዊ ወንጌል
      author: ስሙ ያልታወቀ ደራሲ። ተራኪው ያዕቆብ ነኝ ቢልም፣ ጽሑፉ በሌላ ሰው ስም የተጻፈ ሲሆን የኢየሱስ ወንድም በሆነው በያዕቆብ አልተጻፈም።
      audience: በማርያም ልደትና አስተዳደግ፣ በዘላቂ ንጽሕናዋ፣ በኢየሱስ ልደት፣ እንዲሁም ማቴዎስና ሉቃስ ክፍት ባስቀሯቸው ጥያቄዎች ላይ ትረካዊ መልሶችን የሚፈልጉ ክርስቲያኖች።
      date: በአጠቃላይ በ2ኛው ክፍለ ዘመን የኋለኛው አጋማሽ ዓ.ም. እንደተጻፈ ይገመታል፤ በብዙ የኋለኛ ዘመን የግሪክ የእጅ ጽሑፎችና በጥንታዊ ትርጉሞች ተጠብቆ ይገኛል።
  chapter_titles:
    Apocryphon of John:
      '17':
        title: መለኮታዊው እንክብካቤ አእምሮዎችን ያነቃል
      '18':
        title: ነፍሳት ከክፉ ትግሎች ይመለሳሉ
      '19':
        title: መሐሪው መንፈስ ሰዎችን ያነቃል
      '20':
        title: ብርሃን ነፍሳትን ለማዳን ይወርዳል
      '21':
        title: አዳኙ ስውር ጥበብን አደራ ይሰጣል
    Hypostasis of the Archons:
      '1':
        title: መንፈስ የዓለማትን ኃይሎች ይገልጣል
      '2':
        title: ድምፁ ዓይነ ስውሩን ገዢ ያጋልጣል
      '3':
        title: መለኮታዊ ብርሃን አዳምን ሕያው ያደርጋል
      '4':
        title: ሴቲቱ ከገዢዎቹ ጥቃት ታመልጣለች
      '5':
        title: እባቡ መንፈሳዊ እውነትን ያስተምራል
      '6':
        title: ቃየን አቤልን ይገድላል፤ ሴት ይተካዋል
      '7':
        title: ኖኅ መርከብ ይሠራል፤ ሁለት ጊዜ ይድናል
      '8':
        title: ኖርያ የጨለማ ኃይሎችን በድፍረት ትቃወማለች
      '9':
        title: ኤሌሌት እውነተኛውን አመጣጥ ያረጋግጣል
      '10':
        title: የጥበብ ልጅ ለገዢው ወሰን ታበጃለች
      '11':
        title: ሳባዎት ንስሐ ገብቶ ጥበብን ያመሰግናል
      '12':
        title: ገላጩ የዘላለምን ሕይወት ያመጣል
    On the Origin of the World:
      '1':
        title: ትርምስ ከጨለማ ይወጣል
      '2':
        title: ጥበብ የሰማይን ወሰን ትሠራለች
      '3':
        title: ገዢው ተሳስቶ ብቻውን ይገዛል
      '4':
        title: ሰባት ፍጡራን ሰማያትን ያስተዳድራሉ
      '5':
        title: ዓይነ ስውሩ አምላክ ብቻውን እንዳለ ይናገራል
      '6':
