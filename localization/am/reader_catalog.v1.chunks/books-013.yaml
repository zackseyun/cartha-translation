payload:
  book_metadata:
    James:
      display_name: ያዕቆብ
      author: በትውፊት የኢየሱስ ወንድም ያዕቆብ እንደጻፈው ይታመናል፤ የዘመናችን ምሁራን ግን እርሱ እንደጻፈው ወይም በስሙ እንደተጻፈ ይከፋፈላሉ።
      audience: በተለያዩ አገሮች ለተበተኑ የአይሁድ ክርስቲያን ጉባኤዎች።
      date: በእርግጥ ያዕቆብ ከጻፈው፣ በ50ዎቹ–60ዎቹ ዓ.ም. ገደማ፤ በስሙ ከተጻፈ፣ በ1ኛው ክፍለ ዘመን ዓ.ም. መጨረሻ ገደማ።
    1 Peter:
      display_name: 1 ጴጥሮስ
      author: በትውፊት ሲላስ ጸሐፊ ሆኖ ሐዋርያው ጴጥሮስ እንደጻፈው ይታመናል፤ አንዳንድ ምሁራን ግን በጴጥሮስ ስም እንደተጻፈ ያስባሉ።
      audience: በሮም ግዛት በነበረችው ትንሿ እስያ ማኅበራዊ ጥላቻ ለገጠማቸው ክርስቲያኖች።
      date: ጴጥሮስ ከጻፈው፣ በ60ዎቹ ዓ.ም. ገደማ፤ በስሙ ከተጻፈ፣ በ70ዎቹ–90ዎቹ ዓ.ም. ገደማ።
    2 Peter:
      display_name: 2 ጴጥሮስ
      author: በትውፊት ጴጥሮስ እንደጻፈው ይታመናል፤ ብዙዎቹ የዘመናችን ምሁራን ግን በጴጥሮስ ስም እንደተጻፈ ያስባሉ።
      audience: የክርስቶስን ዳግም ምጽአት የሚክዱ ፌዘኞች ለገጠሟቸው ክርስቲያኖች።
      date: በ2ኛው ክፍለ ዘመን ዓ.ም. መጀመሪያ ገደማ።
    1 John:
      display_name: 1 ዮሐንስ
      author: ጸሐፊው አልተጠቀሰም፤ በትውፊት ሐዋርያው ዮሐንስ ወይም የዮሐንስ ወገን ሽማግሌ እንደጻፈው ይታመናል።
      audience: ከመከፋፈል በኋላ ማን የማኅበሩ አባል እንደሆነ ለሚወስነው የዮሐንስ ወገን ማኅበረሰብ።
      date: በ90–110 ዓ.ም. ገደማ።
    2 John:
      display_name: 2 ዮሐንስ
      author: “ሽማግሌው።”
      audience: ከሐሰተኛ አስተማሪዎች እንዲጠነቀቅ ለተመከረ አንድ የተወሰነ የክርስቲያን ጉባኤ (“ለተመረጠችው እመቤት”)።
      date: በ90–110 ዓ.ም. ገደማ።
    3 John:
      display_name: 3 ዮሐንስ
      author: “ሽማግሌው።”
      audience: ተጓዥ ሰባኪዎችን ለሚያስተናግደው ጋይዮስ ለተባለ መሪ።
      date: በ90–110 ዓ.ም. ገደማ።
    Jude:
      display_name: ይሁዳ
      author: በትውፊት የያዕቆብና የኢየሱስ ወንድም ይሁዳ እንደጻፈው ይታመናል።
      audience: ልቅ ኑሮን የሚያስተምሩ መምህራን ሰርገው ለገቡባቸው የክርስቲያን ማኅበረሰቦች።
      date: በ60ዎቹ–90ዎቹ ዓ.ም. ገደማ።
    Revelation:
      display_name: ራእይ
      author: የፍጥሞ ዮሐንስ (የአጻጻፍ ስልቱ ከአራተኛው ወንጌል የተለየ ነው)።
      audience: በንጉሠ ነገሥቱ አገዛዝ ጫና ሥር ለነበሩት በሮም ግዛት ትንሿ እስያ የሚገኙ ሰባት የክርስቲያን ጉባኤዎች።
      date: በ90ዎቹ ዓ.ም. ገደማ፤ በትውፊት በዶሚቲያኖስ የግዛት ዘመን።
    Tobit:
      display_name: ጦቢት
      author: ጸሐፊው አልተጠቀሰም።
      audience: በባዕድ አገዛዝ ሥር ሆነው በአምልኮ፣ በጋብቻና በእግዚአብሔር ምሪት ለመኖር ለሚጥሩ በተለያዩ አገሮች ለተበተኑ አይሁድ።
      date: በ225–175 ዓ.ዓ. ገደማ፤ በአራማይክ ቋንቋ የተጻፈ ሲሆን የዕብራይስጥ ቅጂም በቁምራን ተገኝቷል።
    Judith:
      display_name: ዮዲት
      author: ጸሐፊው አልተጠቀሰም።
      audience: በባዕድ ኃይል ሥጋት ሥር ለነበሩ አይሁድ፤ በእምነት ስለሚደረግ ደፋር ተቃውሞ የሚተርክ ታሪክ።
      date: በ150–100 ዓ.ዓ. ገደማ።
    Greek Additions to Esther:
      display_name: የአስቴር የግሪክ ተጨማሪዎች
      author: ጸሐፊው አልተጠቀሰም፤ በግሪክ የአስቴር ትርጉም ላይ የተጨመሩ ተጨማሪ ክፍሎች።
      audience: ጸሎትና ስለ እግዚአብሔር ግልጽ ማጣቀሻ ያለበትን የአስቴር ታሪክ ለፈለጉ ግሪክኛ ተናጋሪ አይሁድ።
      date: በ2ኛው–1ኛው ክፍለ ዘመን ዓ.ዓ. ገደማ።
    Wisdom of Solomon:
      display_name: የሰሎሞን ጥበብ
      author: ጸሐፊው አልተጠቀሰም፤ በሐሰተኛ ስም ለሰሎሞን የተሰጠ ነው። ምናልባት በእስክንድርያ በኖረ የግሪክ ባህል ተጽዕኖ ባለበት የአይሁድ ጸሐፊ በግሪክኛ ተጽፏል።
      audience: ከግሪክ ፍልስፍና ጋር ሐሳብ ለሐሳብ ለሚገናኙና የእስራኤልን ጥበብ ከአረማዊና ከክህደት አማራጮች አንጻር ለሚከላከሉ የግሪክ ባህል ተጽዕኖ ያረፈባቸው አይሁድ።
      date: በ50 ዓ.ዓ.–50 ዓ.ም. ገደማ።
