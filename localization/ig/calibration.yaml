review:
  verdict: revise
  summary: Emezigharịrị njehie dị na Jenesis 1:1, mee ka ụfọdụ nkọwa bụrụ Igbo a na-asụ n’oge a, ma debe ihe ndị source kwuru na nhọrọ ndị ọzọ dị na ndetu.
  issues:
  - 'Jenesis 1:1 nwere njehie mkpụrụokwu: “malitere ike” kwesịrị ịbụ “malitere ịkpụ.”'
  - Nkọwa ndị na-agụ akwụkwọ maka Jọn na 1 Pita chọrọ ka e mee ha ka ha bụrụ Igbo dịkwuo ire ụtọ ma debe kpọmkwem ihe source pụtara.
  - Nkọwa ndị na-agụ akwụkwọ maka Oziọma Tọmas chọrọ nhazi ka “Syrian wisdom and proto-Gnostic thought” ghara ịpụta n’ụzọ na-adịghị edo anya.
  - Ndị Rom 3:25 kwesịrị iji “gafere” mee ka “passed over” pụta karịa “leghaara ... anya,” nke nwere ike ịda ka nleghara anya nkịtị.
