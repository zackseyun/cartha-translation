book_localizations:
- source_title: Genesis
  title: Jenesis
  author: A maghị onye dere ya; ọdịnala na-ekwu na ọ bụ Mosis dere ya. Ndị ọkà mmụta nke oge a na-ahụ na o nwere ogologo akụkọ nhazi, nke e si n’ọtụtụ isi mmalite dee, e mesịakwa dezie ha ọnụ.
  audience: Ndị Izrel, ka ha mata njirimara ha dịka ndị Chineke na ha gbara ndụ; ọ na-agbadoro akụkọ mmalite ha n’okike Chineke, nhọpụta ya, na nkwa ya.
  date: E dere ya n’ime ọtụtụ narị afọ; ọ ruru n’ụdị a nabatara ugbu a ihe dị ka narị afọ nke isii ruo nke ise Tupu Oge Ndị Kraịst, n’oge ndọrọ n’agha Babilọn ma ọ bụ mgbe ọ gasịrị.
  summary: Jenesis na-akọ banyere okike, nnupụisi ụmụ mmadụ na mgbasa ha, nakwa ezinụlọ Ebreham, Aịzik, Jekọb, na Josef, bụ ndị nkwa ọgbụgba ndụ Chineke nye Izrel si n’aka ha malite.
- source_title: John
  title: Jọn
  author: A maghị onye dere ya; ọdịnala na-ekwu na ọ bụ Jọn onyeozi ma ọ bụ “Onye Na-eso ụzọ A Hụrụ n’Anya” dere ya.
  audience: Otu ndị Kraịst nọ n’esemokwu ha na okpukpe ndị Juu nke ụlọ nzukọ, ndị e hiwere gburugburu akaebe Onye Na-eso ụzọ A Hụrụ n’Anya.
  date: Ihe dị ka afọ 90–110 Oge Ndị Kraịst.
  summary: Jọn na-egosi Jizọs dị ka Okwu ebighị ebi nke na-ekpughe Nna, na-enye ndụ site n’ịtụkwasị ya obi, na onye a na-enye otuto site n’ihe ịrịba ama ya, ọnwụ ya, na mbilite n’ọnwụ ya.
- source_title: Gospel of Thomas
  title: Oziọma Tọmas
  author: A maghị onye dere ya; okwu mmalite ya na-ekwu na “Didimos Judas Tọmas” bụ onye e kwuru na nchịkọta okwu ndị a sitere n’aka ya. Naanị otu nsụgharị Kọptik nke narị afọ nke anọ, a chọtara na Nag Hammadi (NHC II,2), ka fọdụrụ n’uju; e nwekwara iberibe Grik atọ sitere na Oxyrhynchus.
  audience: Ndị Kraịst na-agụ ya, ndị amamihe Siria na echiche proto-Gnostik kpụziri, ma lekwasị anya n’ọmụma onwe onye zoro ezo dị n’okwu Jizọs.
  date: O yikarịrị ka e dere nke mbụ n’asụsụ Grik ihe dị ka afọ 50–140 Oge Ndị Kraịst; ihe odide Kọptik ahụ bụ ihe dị ka afọ 340 Oge Ndị Kraịst.
  summary: Oziọma Tọmas bụ nchịkọta okwu ndị e kwuru na Jizọs kwuru. Ọ nweghị akụkọ na-aga n’ihu, ọ na-akpọkwa ndị na-agụ ya ugboro ugboro ka ha chọpụta ihe okwu ndị ahụ pụtara.
spob_critical_passages:
- source_path: ot/genesis/001/001.yaml
  reference: Jenesis 1:1
  text: Mgbe Chineke malitere ịkpụ eluigwe na ụwa[a]—
  translator_note: '[a] Nsụgharị ọdịnala na-ewere nke a dị ka ahịrịokwu zuru ezu: “Na mmalite, Chineke kere eluigwe na ụwa.” Ma Hibru ahụ na-ewebata ihe na-esote ya n’ụzọ ka mma; isi omume ahụ, “Chineke wee sị,” dị n’amaokwu nke 3.'
- source_path: ot/ecclesiastes/001/002.yaml
  reference: Ekliziastis 1:2
  text: “Alụlụ nke alụlụ[a],” ka Qoheleth[b] na-ekwu. “Ihe niile bụ alụlụ—ọ naghị adịte aka, a pụghị ijide ya, ọtụtụ mgbe ọ na-apụtakwa n’ụzọ anyị na-atụghị anya ya.”
  translator_note: '[a] Okwu Hibru bụ́ hevel pụtara n’ụzọ nkịtị ume ma ọ bụ alụlụ. N’akwụkwọ Ekliziastis niile, ọ na-akọwa ihe na-agafe ngwa ngwa, nke a na-apụghị ijide ma ọ bụ ghọta n’ụzọ zuru ezu, na nke na-apụtakarị n’ụzọ dị iche n’ihe ndị mmadụ tụrụ anya ya. “Alụlụ” na-edobe ihe atụ ahụ n’ekwughị na ọ dịghị ihe ọ bụla nwere isi. O nwekwara ike ịbụ “ume,” “naanị ume,” ma ọ bụ “ihe na-agafe ngwa ngwa.” [b] Qoheleth bụ aha Hibru ma ọ bụ utu aha onye dere akwụkwọ a. A na-asụgharịkarị ya “Onye Ozizi” ma ọ bụ “Onye Nkwusa,” ma anyị hapụrụ “Qoheleth” iji kwe ka nkọwa niile nwere ike ịdị, n’ebughị otu nkọwa ụzọ.'
- source_path: nt/john/001/001.yaml
  reference: Jọn 1:1
  text: Na mmalite[b], Okwu ahụ adịlarị. Okwu ahụ na Chineke nọ, Okwu ahụ bụkwa Chineke.[a]
  translator_note: '[a] Ma ọ bụ, “Okwu ahụ bụ nke Chineke,” ma ọ bụ, “ihe Chineke bụ ka Okwu ahụ bụ.” Otú e si dee Grik ahụ na-ekwu na Okwu ahụ bụ Chineke n’uju, ma na-ekewa Okwu ahụ na Chineke a kpọrọ aha n’ahịrịokwu bu ya ụzọ. [b] Mmalite a na-echetara Jenesis 1:1 ma na-ejikọ Okwu ahụ na mmalite okike. Okwu Grik ahụ na-egosi na Okwu ahụ adịlarị mgbe mmalite bịara, ọ bụghị na ọ malitere ịdị adị n’oge ahụ; a pụkwara ịsụgharị ya “dị” ma ọ bụ “dị adị.”'
- source_path: nt/romans/003/025.yaml
  reference: Ndị Rom 3:25
  text: Chineke gosipụtara ya dị ka àjà mkpuchi mmehie[a] site n’okwukwe n’ọbara ya[b]. O mere nke a iji gosi ezi omume ya[c], n’ihi na ọ gafere mmehie ndị e mere n’oge gara aga.
  translator_note: '[a] Ma ọ bụ “àjà nke na-ewepụ iwe”; ma ọ bụ “oche ebere,” ya bụ, mkpuchi ọlaedo nke Igbe Ọgbụgba Ndụ, ebe a na-efesa ọbara mkpuchi mmehie n’Agba Ochie. [b] Ma ọ bụ, “site n’okwukwe, site n’ọbara ya.” [c] Ma ọ bụ “ikpe ziri ezi.”'
- source_path: nt/1_peter/001/013.yaml
  reference: 1 Pita 1:13
  text: Ya mere, kwadebenụ uche unu maka ime ihe.[a] Nọgidenụ na-adị anya nke ọma, ma tụkwasịkwanụ olileanya unu n’uju n’amara a na-ewetara unu mgbe a ga-ekpughe Jizọs Kraịst.[b]
  translator_note: '[a] N’ụzọ nkịtị, Grik ahụ na-ekwu, “kekọtanụ úkwù nke uche unu.” Ọ na-ese onyinyo ịchịkọta uwe ogologo n’úkwù ka mmadụ wee dị njikere ime ihe. [b] Okwu Grik a sụgharịrị “n’uju” nwere ike ịkọwa ịdị anya nke ọma, ma ọ bụ ịtụkwasị olileanya, ma eleghị anya ọ pụkwara ịkọwa ha abụọ.'
