  Polycarp to the Philippians:
    display_name: Polycarp Degara Ndị Filipaị
    author: Polycarp, bishọp nke Smịna. Ụfọdụ ndị ọkà mmụta na-ewere ederede anyị natara dị ka njikọta ihe ndị e zigara n’oge karịrị otu.
    audience: Ọgbakọ Ndị Kraịst dị na Filipaị, bụ́ ndị rịọrọ ka e zitere ha akwụkwọ ozi Ignatius ma nata ndụmọdụ banyere okwukwe, akparamàgwà, idu ndú, ego, na ntachi obi.
    date: Ná mmalite ruo n’etiti narị afọ nke abụọ AD; ọ dịkarịa ala, otu akụkụ nwere njikọ chiri anya na njem Ignatius, ebe echiche na ọ bụ akwụkwọ ozi e jikọtara ọnụ na-enye ohere na akụkụ ọzọ nwere ike ịbụ nke obere oge gasịrị.
