    audience: Otu Ndị Kraịst na-akatọ omume ịchụ àjà na usoro ụka nke ndị ọzọ, na-eji mkparịta ụka mkpughe na nkọwa banyere eluigwe na ụwa yiri nke ndị Set akọwa Judas na ọnwụ Jizọs n’ụzọ ọhụrụ.
    date: A na-ekwukarị na e dere ya n’etiti ma ọ bụ n’ọgwụgwụ narị afọ nke abụọ AD; Irenaeus maara otu Oziọma Judas ka ọ na-erule ihe dị ka afọ 180, ebe akwụkwọ Koptik nke ka dị nwere ike ịbụ nke narị afọ nke atọ ma ọ bụ nke anọ.
