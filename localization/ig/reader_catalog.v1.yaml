    audience: Otu ọgbakọ Ndị Kraịst oge mbụ maara ozizi banyere emume nsọ ndị yiri nke ndị Valentịnịa, karịsịa baptizim, ite mmanụ, Oriri Nsọ, mgbapụta, mbilite n'ọnwụ, na ihe atụ nke ụlọ alụmdi na nwunye.
    date: A na-echekarị na e dere ya n'ọgwụgwụ narị afọ nke abụọ ma ọ bụ ná mmalite narị afọ nke atọ Oge Ndị Kraịst; e chekwara ya n'ihe odide Koptik nke narị afọ nke anọ, nke a sụgharịrị site n'ụdị Grik e dere tupu ya.
