  Fragments of Papias:
    display_name: Iberibe Ihe Odide Papias
    author: Papias, bishọp nke Hierapolis, bụ onye dere nkọwa nwere akwụkwọ ise nke furu efu, nke a kpọrọ Nkọwa Okwu Onyenwe Anyị; nchịkọta ka dị taa bụ okwu ndị e hotara na akụkọ ndị ode akwụkwọ mechara chekwaa.
    audience: Ndị Kraịst oge mbụ chọrọ ozizi ndị a na-echeta banyere Jizọs na ndịozi, nke a chịkọtara site n’usoro akaebe ọnụ na nkọwa e si n’aka ndị a kpọrọ aha nweta.
    date: A na-ekwukarị na Papias dere ọrụ ya ná mmalite narị afọ nke abụọ AD, ọtụtụ mgbe n’ihe dị ka 110–130; iberibe ndị fọdụrụ dị n’akwụkwọ ndị ode akwụkwọ dere malite na narị afọ nke abụọ gaa n’ihu.
