  Martyrdom of Polycarp:
    display_name: Ọnwụ Polycarp n’ihi Okwukwe
    author: Ndị a na-amaghị aha ha so na chọọchị dị na Smịna, dere ya n’aha ọgbakọ ahụ; ihe ndị e dere ná mmechi banyere nnyefe ederede ahụ na-egosi na e mechara depụtaghachi ya ma kesaa ya.
    audience: Chọọchị dị na Filomelium na ọgbakọ Ndị Kraịst n’ebe niile, bụ́ ndị e nyere akụkọ banyere njide Polycarp, ikpe ya, ọnwụ ya, na ntachi obi ya kwesịrị nṅomi.
    date: E dere ya mgbe Polycarp nwụsịrị, a na-ekwukarị na ọ bụ n’etiti ma ọ bụ n’ọgwụgwụ narị afọ nke abụọ AD; a ka na-arụrịta ụka banyere kpọmkwem afọ ọ nwụrụ n’ihi okwukwe nakwa ụdị ikpeazụ nke akwụkwọ ahụ.
