  Gospel of Thomas:
    display_name: Oziọma Tọmọs
    author: A maghị onye dere ya; okwu mmalite ya na-ekwu na nchịkọta okwu ahụ bụ nke “Didymos Judas Thomas.” Naanị nsụgharị Kọptik nke narị afọ nke 4 e si na Nag Hammadi nweta (NHC II,2) ka fọdụrụ n’uju, tinyere iberibe atọ e dere n’asụsụ Grik ndị e si Oxyrhynchus nweta.
    audience: Ndị na-agụ akwụkwọ Ndị Kraịst nke amamihe Siria na echiche Gnostik mbụ kpụziri, bụ́ ndị lekwasịrị anya n’ịmata onwe ha n’ụzọ nzuzo site n’okwu Jizọs.
    date: Ọ ga-abụ na e dere nke mbụ n’asụsụ Grik n’ihe dị ka afọ 50–140 O.A.; ihe odide Kọptik ahụ bụ nke ihe dị ka afọ 340 O.A.
    summary: Oziọma Tọmọs bụ nchịkọta okwu ndị e kwuru na Jizọs kwuru. Ọ dịghị akụkọ na-aga n’ihu site ná mmalite ruo ná ngwụcha n’ime ya, ọ na-akpọkwa ndị na-agụ ya ugboro ugboro ka ha chọpụta ihe okwu ndị ahụ pụtara.
