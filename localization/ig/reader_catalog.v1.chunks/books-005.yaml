  book_metadata:
    Ezra:
      display_name: Ezra
      author: A maghị onye dere ya; o nwere ike ịbụ otu onye dere Ihe E Mere.
      audience: Ndị si n’ala ọzọ lọta, ndị na-ewughachi Jerusalem n’okpuru ọchịchị Peshia.
      date: Ihe dị ka n’etiti narị afọ nke ise ruo narị afọ nke anọ Tupu Oge Ndị Kraịst.
    Nehemiah:
      display_name: Nehemiah
      author: A maghị onye dere ya; ọ gụnyere ihe ncheta e dere n’olu onye mbụ, nke a na-ekwu na ọ bụ nke Nehemiah.
      audience: Ndị si n’ala ọzọ lọta, ndị na-ewughachi mgbidi Jerusalem ma na-eme ka ọgbụgba ndụ dị ọhụrụ n’okpuru ọchịchị Peshia.
      date: Ihe dị ka n’etiti narị afọ nke ise ruo narị afọ nke anọ Tupu Oge Ndị Kraịst.
    Esther:
      display_name: Esta
      author: A maghị onye dere ya.
      audience: Ndị Juu bi n’ala ọzọ n’okpuru ọchịchị ndị mba ọzọ, karịsịa na Peshia.
      date: Ihe dị ka n’ọgwụgwụ oge Peshia ma ọ bụ na mmalite oge ndị Gris (narị afọ nke anọ ruo nke atọ Tupu Oge Ndị Kraịst).
    Job:
      display_name: Job
      author: A maghị onye dere ya.
      audience: Ndị Izrel na-agbalị ịghọta ahụhụ onye aka ya dị ọcha na ikpe ziri ezi nke Chineke.
      date: Echiche ọtụtụ ndị ọkà mmụta ọdịnala amamihe nabatara na-etinye akwụkwọ a n’ihe dị ka narị afọ nke isii ruo nke anọ Tupu Oge Ndị Kraịst, ma ọ dabeere n’akụkọ ọdịnala ndị ka ochie.
    Psalms:
      display_name: Abụ Ọma
      author: Ọtụtụ ndị dere ya n’ime ọtụtụ narị afọ; ihe e dere n’elu abụ ndị ahụ kpọrọ Devid, Asaf, Kora, Solomọn, Mosis, na ndị ọzọ aha.
      audience: Izrel na ọgbakọ ụlọnsọ ukwu n’ofufe—nakwa obodo ọ bụla mechara bụrụ nke ekpere na akwa arịrị.
      date: E dere ha n’ihe dị ka narị afọ nke iri ruo nke atọ Tupu Oge Ndị Kraịst; a chịkọtara ha n’ụdị ikpeazụ n’oge sochiri ndọrọ n’agha.
