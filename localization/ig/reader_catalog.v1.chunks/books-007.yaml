review:
  verdict: revise
  review_summary: Ederezigharịrị chunk ahụ n’Igbo. E doziri ụfọdụ ntụgharị okwu na-adịghị mma ma ọ bụ na-adịghị egosipụta isi ihe nke ọma, karịsịa Ekliziastis 11, Ilu 14, na Abụ nke Solomọn 4–5.
  issues:
  - Ekliziastis 11 nwere ntụgharị na-adịghị asụ Igbo nke ọma maka “Take Risks While You Can”; edoziwo ya.
  - Ilu 14 kwuru “ezinụlọ” kama “ụlọ” ma mee ka akụkụ “reveres Lord” doo anya; edoziwo ya.
  - Abụ nke Solomọn 4 na 5 chọrọ okwu ziri ezi karịa maka “bride” na “missing lover”; edoziwo ha.
