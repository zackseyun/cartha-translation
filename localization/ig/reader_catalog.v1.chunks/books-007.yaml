  book_metadata:
    Proverbs:
      display_name: Ilu
      author: Nchịkọta ihe odide; okwu mmalite ndị ahụ kpọrọ Solomọn, Agọ, Lemuel, na “ndị maara ihe” aha.
      audience: Ụmụ Izrel na-eto eto a na-azụ n'amamihe maka ndụ kwa ụbọchị.
      date: E dere akụkụ ya dị iche iche ihe dịka narị afọ nke 10 ruo nke 4 T.K.
    Ecclesiastes:
      display_name: Ekliziastis
      author: A maghị onye dere ya; onye na-ekwu okwu bụ “Kohelet,” onye omenala na-ewere dị ka Solomọn.
      audience: Ụmụ Izrel na-eche ihe gbasara ókè amamihe, akụnụba, na mbọ mmadụ nwere n'okpuru anyanwụ ihu.
      date: O yikarịrị ka ọ bụ ihe dịka narị afọ nke 5 ruo nke 3 T.K., dị ka asụsụ Hibru ya nke asụsụ Arameik metụtara si gosi.
    Song of Solomon:
      display_name: Abụ nke Solomọn
      author: A maghị onye dere ya; okwu mmalite ya kpọrọ Solomọn aha.
      audience: Ụmụ Izrel na-agụ banyere ịhụnanya nwoke na nwanyị dị ka ụzọ e si aghọta mmekọrịta chiri anya nke ọgbụgba ndụ—emesịa, ndị Juu na ndị Kraịst gụkwara ya dị ka akụkọ ihe atụ.
      date: O yikarịrị ka ọ bụ mgbe a lọtachara n'ala a dọọrọ ha n'agha, ihe dịka narị afọ nke 5 ruo nke 3 T.K.
