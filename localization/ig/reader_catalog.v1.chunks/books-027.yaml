payload:
  book_metadata:
    Polycarp to the Philippians:
      display_name: Polycarp Degara Ndị Filipaị
      author: Polycarp, bishọp nke Smịna. Ụfọdụ ndị ọkà mmụta na-ewere ederede anyị natara dị ka njikọta ihe ndị e zigara n’oge karịrị otu.
      audience: Ọgbakọ Ndị Kraịst dị na Filipaị, bụ́ ndị rịọrọ ka e zitere ha akwụkwọ ozi Ignatius ma nata ndụmọdụ banyere okwukwe, akparamàgwà, idu ndú, ego, na ntachi obi.
      date: Ná mmalite ruo n’etiti narị afọ nke abụọ AD; ọ dịkarịa ala, otu akụkụ nwere njikọ chiri anya na njem Ignatius, ebe echiche na ọ bụ akwụkwọ ozi e jikọtara ọnụ na-enye ohere na akụkụ ọzọ nwere ike ịbụ nke obere oge gasịrị.
    Martyrdom of Polycarp:
      display_name: Ọnwụ Polycarp n’ihi Okwukwe
      author: Ndị a na-amaghị aha ha so na chọọchị dị na Smịna, dere ya n’aha ọgbakọ ahụ; ihe ndị e dere ná mmechi banyere nnyefe ederede ahụ na-egosi na e mechara depụtaghachi ya ma kesaa ya.
      audience: Chọọchị dị na Filomelium na ọgbakọ Ndị Kraịst n’ebe niile, bụ́ ndị e nyere akụkọ banyere njide Polycarp, ikpe ya, ọnwụ ya, na ntachi obi ya kwesịrị nṅomi.
      date: E dere ya mgbe Polycarp nwụsịrị, a na-ekwukarị na ọ bụ n’etiti ma ọ bụ n’ọgwụgwụ narị afọ nke abụọ AD; a ka na-arụrịta ụka banyere kpọmkwem afọ ọ nwụrụ n’ihi okwukwe nakwa ụdị ikpeazụ nke akwụkwọ ahụ.
    Epistle to Diognetus:
      display_name: Akwụkwọ Ozi Degara Diognetus
      author: Onye a na-amaghị aha ya. Onye dere ya kpọrọ onwe ya onye na-eso ụzọ ma ọ bụ onye na-amụta ihe, ma a pụghị ịmata nke ọma ma ya onwe ya ma Diognetus onye e degaara ya akwụkwọ ozi ahụ.
      audience: Onye na-abụghị Onye Kraịst, nke gụrụ akwụkwọ ma na-achọ ịmata ihe—tinyere ndị na-agụ akwụkwọ yiri ya—na-ajụ banyere ofufe Ndị Kraịst, ụkpụrụ omume ha, ọnọdụ ha n’obodo, ịhụnanya, na ihe mere okwukwe ahụ ji yie ihe malitere ọhụrụ.
      date: A na-ekwukarị na e dere ya n’ọgwụgwụ narị afọ nke abụọ ma ọ bụ ná mmalite narị afọ nke atọ AD, ọ bụ ezie na echiche dị iche iche gbasara ụbọchị ya; isi abụọ ikpeazụ nwere ike isi n’akwụkwọ ọzọ pụta.
    Fragments of Papias:
      display_name: Iberibe Ihe Odide Papias
      author: Papias, bishọp nke Hierapolis, bụ onye dere nkọwa nwere akwụkwọ ise nke furu efu, nke a kpọrọ Nkọwa Okwu Onyenwe Anyị; nchịkọta ka dị taa bụ okwu ndị e hotara na akụkọ ndị ode akwụkwọ mechara chekwaa.
      audience: Ndị Kraịst oge mbụ chọrọ ozizi ndị a na-echeta banyere Jizọs na ndịozi, nke a chịkọtara site n’usoro akaebe ọnụ na nkọwa e si n’aka ndị a kpọrọ aha nweta.
      date: A na-ekwukarị na Papias dere ọrụ ya ná mmalite narị afọ nke abụọ AD, ọtụtụ mgbe n’ihe dị ka 110–130; iberibe ndị fọdụrụ dị n’akwụkwọ ndị ode akwụkwọ dere malite na narị afọ nke abụọ gaa n’ihu.
