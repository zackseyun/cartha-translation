review:
  verdict: revise
  review_summary: E meziwo ntụgharị asụsụ ahụ n’uju. E doziri aha Hermas, Issakar, na Levi; e meziekwa ọtụtụ nkebi okwu ndị gbagọrọ agbagọ ma ọ bụ ndị na-adịghị egosi ihe isi Bekee kwuru kpọmkwem.
  issues:
  - Draft jiri “Hamas” kama Hermas n’aha isi ọtụtụ.
  - Draft kpọrọ Testament of Issachar “Isaka,” nke nwere ike ịgbagwoju ya na Aịzik anya.
  - Ụfọdụ aha isi gbagọrọ ihe isi Bekee pụtara, gụnyere Reuben 49, Levi 14, na Judah 11 na 26.
  - A gbanwere ụfọdụ okwu ka ha bụrụ Igbo doro anya ma ghara ịgbakwunye nkọwa na-adịghị na isi.
