payload:
  book_metadata:
    Gospel of Mary:
      display_name: Oziọma Meri
      author: Amaghị onye dere ya. Akwụkwọ a na-egosi Meri dịka onye natara mkpughe Jizọs ma kọwaa ya, ma ọ naghị ekwu na Meri dere oziọma ahụ fọdụrụ ruo taa.
      audience: Ndị Kraịst oge mbụ na-agbalị ịghọta mkpughe, nrịgo ime mmụọ, ikike ndịozi, na ma ozizi Meri ò kwesịrị ịbụ nke a nabatara n'etiti ndị na-eso ụzọ Jizọs.
      date: A na-ekwukarị na e dere ya na narị afọ nke abụọ AD; iberibe ya e dere n'asụsụ Grik fọdụrụ site na narị afọ nke atọ, ebe isi akwụkwọ akaebe ya n'asụsụ Kọptik dị na Kodeks Berlin 8502 nke narị afọ nke ise.
    Treatise on the Resurrection:
      display_name: Edemede Banyere Mbilite n'Ọnwụ
      author: Amaghị onye dere ya. E haziri akwụkwọ a dịka akwụkwọ ozi onye nkụzi degaara nwa akwụkwọ aha ya bụ Reginos; a pụghị ịmata nke ọma onye nkụzi ahụ ma ọ bụ Reginos.
      audience: Ndị Kraịst na-achọ nkuzi banyere mbilite n'ọnwụ, karịchaa ndị na-atụle akụkụ anụ ahụ na nke mmụọ, nakwa ikere òkè ugbu a na ndụ mbilite n'ọnwụ.
      date: A na-edobekarị ya na ngwụcha narị afọ nke abụọ AD (ọtụtụ mgbe ihe dịka 170–200); e chekwara ya n'ụdị oyiri Kọptik nke narị afọ nke anọ, nke a sụgharịrị site n'akwụkwọ Grik e dere tupu ya.
    Dialogue of the Savior:
      display_name: Mkparịta Ụka nke Onye Nzọpụta
      author: Amaghị onye dere ya. Mkparịta ụka ahụ na-etinye nkuzi mkpughe n'ọnụ Jizọs mgbe ya na Judas, Matiu na Meri na-akparịta, ma ọ naghị akọwa onye chịkọtara ya.
      audience: Otu ndị Kraịst oge mbụ nwere mmasị na mkpughe nzuzo, iso ụzọ, ịmata onwe onye, ekpere, na nkwadebe nke ịjụ ihe ụtọ onwe onye maka nzọpụta.
      date: A na-ekwukarị na ọ bụ nke narị afọ nke abụọ AD, ọ bụ ezie na a ka na-arụrịta ụka banyere usoro akụkụ ndị mejupụtara ya na kpọmkwem oge e dere ya; e chekwara ya n'akwụkwọ Kọptik nke narị afọ nke anọ.
    Exegesis on the Soul:
      display_name: Nkọwa Banyere Mkpụrụ Obi
      author: Amaghị onye dere ya. Onye dere ya bụ onye Kraịst na-ekwusa ozi, onye kọwagharịrị ihe atụ sitere na Baịbụl na akwụkwọ ndị Grik dịka akụkọ ihe atụ banyere ọdịda mkpụrụ obi, nchegharị ya, na mweghachi ya.
      audience: Ndị Kraịst maara Akwụkwọ Nsọ na ndụmọdụ gbasara omume ọma, bụ́ ndị a na-akpọ ka ha hapụ ọchịchọ na-enweghị usoro, chegharịa, ma dịghachi n'otu na Chineke.
      date: N'ozuzu, a na-ekwu na e dere ya na ngwụcha narị afọ nke abụọ ma ọ bụ na mmalite narị afọ nke atọ AD; e chekwara ya na nsụgharị Kọptik nke narị afọ nke anọ, nke sitere n'asụsụ Grik.
    Book of Thomas the Contender:
      display_name: Akwụkwọ Tọmọs Onye Mgba
      author: Amaghị onye dere ya. Aha e dere na ngwụcha ya jikọtara akwụkwọ ahụ na Judas Tọmọs ma kpọọ Matayas onye dekọrọ ya, ma ihe ndị a bụ njikọ e ji hazie akụkọ ahụ, ọ bụghị nkwupụta a pụrụ iji ihe akaebe kwado banyere ndị dere ya.
      audience: Ndị Kraịst nwere mmasị n'ịjụ ihe ụtọ onwe ha, bụ́ ndị a gbara ume ka ha chọọ ịmata onwe ha, guzogide agụụ anụ ahụ, ma ghọta nkuzi nzuzo Jizọs nyere Tọmọs.
      date: A na-ekwukarị na e dere ya na ngwụcha narị afọ nke abụọ ma ọ bụ na mmalite narị afọ nke atọ AD, ikekwe n'etiti ndị Kraịst Siria; e chekwara ya n'akwụkwọ Kọptik nke narị afọ nke anọ.
    Tripartite Tractate:
      display_name: Edemede Akụkụ Atọ
      author: Amaghị onye dere ya. Onye dere ya bụ ọkà mmụta okpukpe Kraịst nke òtù Valentinus, onye gụrụ akwụkwọ nke ukwuu; ọ gaghị ekwe omume ịmata ya nke ọma dịka otu onye nkụzi a kpọrọ aha.
      audience: Otu ndị Kraịst nke òtù Valentinus na-anata nkuzi sara mbara banyere Chineke, ndị aeon, okike, Kraịst, nzukọ Kraịst, nzọpụta, na mweghachi ikpeazụ.
      date: A na-ekwukarị na e dere ya na narị afọ nke atọ AD, ebe ụfọdụ na-arụ ụka na ọ bụ n'ọkara ikpeazụ nke narị afọ ahụ; e chekwara ya n'asụsụ Kọptik n'ime Kodeks Jung nke narị afọ nke anọ.
    Apocryphon of John:
      display_name: Akwụkwọ Nzuzo Jọn
      author: Amaghị onye dere ya. Akwụkwọ ahụ na-eji aha Jọn nwa Zebedi akọwa mkpughe Jizọs bilitere n'ọnwụ nyere ya, ọ dịkwa taa n'ụdị nhazi ihe odide oge ochie karịrị otu.
      audience: Ndị Kraịst nọ n'ọdịnala mkpughe nke òtù Set ma ọ bụ nke yiri ya nke ukwuu, bụ́ ndị na-achọ nkọwa banyere ala nke Chineke, okike, onye mmadụ bụ, na ntọhapụ n'aka ndị ọchịchị iro.
      date: Ọ ga-abụ na ụdị mbụ ya malitere ịgbasa na narị afọ nke abụọ AD; akwụkwọ akaebe Kọptik ndị fọdụrụ, nke chekwara ụdị dị mkpụmkpụ na nke dị ogologo, sitere na narị afọ nke anọ na nke ise.
