review:
  verdict: revise
  review_summary: Emezigharịrị chunk ahụ n’Igbo. A doziri ụfọdụ aha isi nke na-adịghị mma n’asụsụ ma ọ bụ nke gbanwere ntakịrị ihe isiokwu Bekee pụtara; metadata niile ka na-egosipụta nlezianya akụkọ ihe mere eme nke isi mmalite.
  issues:
  - Doziri Gospel of Mary 1 ka ọ bụrụ nkuzi banyere mmehie, ọ bụghị naanị okwu na-adịghị eke nke ‘megidere mmehie’.
  - Doziri Exegesis on the Soul 4 ka o kwuo nloghachi mkpụrụ obi n’otu na isi iyi Chineke.
  - Doziri Book of Thomas the Contender 7 ka o gosipụta na ndị nsọ na-amụ anya bụ ndị a gọziri agọzi.
  - Doziri Tripartite Tractate 19 ka o chekwaa echiche na otu ndị na-emegide ibe ha na-anata ọkwa e haziri n’usoro.
