review:
  verdict: revise
  review_summary: E mezigharịrị ntụgharị asụsụ ahụ n’ụzọ zuru ezu. E doziri ụfọdụ okwu na-adịghị egosipụta isi mmalite nke ọma, gụnyere nkọwa onye dere Shepherd of Hermas, “moral” na nkọwa ndị na-ege ntị, na ọtụtụ aha isi nke nwere nghọta ezughị ezu ma ọ bụ na-ezighị ezi.
  issues:
  - E nwere ntụgharị ụfọdụ gbanwere ma ọ bụ hapụ akụkụ nke isiokwu Bekee, dịka Jubilees 32, 36, 49–50 na Psalms of Solomon 15.
  - Nkọwa Shepherd of Hermas jiri “amụma gbasara omume ọma” mee ka “moral prophecy” yie nkwado omume karịa amụma gbasara omume na nchegharị.
  - E dezigharịrị nhọrọ okwu ụfọdụ ka ha kwekọọ n’isi mmalite n’enweghị nkwupụta okpukpe karịrị akarị.
