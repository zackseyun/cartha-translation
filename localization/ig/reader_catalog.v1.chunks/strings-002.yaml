  verdict: revise
  review_summary: Edere chunk ahụ n’Igbo nke ọma n’ozuzu ya, ma e mezie ụfọdụ okwu ka ha kwekọọ kpọmkwem na source, karịsịa "chapter", "preloaded", "incipit", na aha akụkụ ụfọdụ.
  issues:
  - Dochie "isi" na "isiakwụkwọ" n’ebe ọ pụtara chapter ka ihe ahụ ghara ịpụta naanị "head".
  - '"e tinyegoro" pụtara ihe etinyere/uploaded, ọ bụghị "preloaded"; e meela ka ọ pụta "ebuburula".'
  - '"Open incipit" ka a sụgharịrị dịka "Mepee okwu mbụ" kama "okwu mmalite", nke nwere ike ịpụta introduction.'
  - Aha "Testaments of the Twelve Patriarchs" e degharịala ka ọ bụrụ aha akwụkwọ kwesịrị ekwesị karịa "covenants".
