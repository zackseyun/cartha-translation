  review_summary: Agbazigharịrị ntụgharị ole na ole iji mee ka ihe pụtara n’asụsụ Bekee bụrụ nke ziri ezi, karịsịa Nahum 1 na Matiu 1. Akụkụ ndị ọzọ zuru ezu ma na-esochi isi mmalite ahụ nke ọma.
