payload:
  book_metadata:
    Joel:
      display_name: Joel
      author: Joel nwa Petuel.
      audience: Juda mgbe a lọtara site n’ala ọzọ, ka ha na-emeghachi omume n’ihe otiti igurube dị ka ihe ịrịba ama nke Ụbọchị ONYENWE ANYỊ.
      date: O yikarịrị ka ọ bụ ihe dị ka narị afọ nke ise ruo nke anọ T.K.
    Amos:
      display_name: Emọs
      author: Emọs onye Tekoa, onye ọzụzụ atụrụ si Juda nke kwusara ozi n’ebe ugwu.
      audience: Izrel nke dị n’ebe ugwu n’oge ọganihu na ikpe na-ezighị ezi n’okpuru Jeroboam nke Abụọ.
      date: Ihe dị ka afọ 760–750 T.K.
    Obadiah:
      display_name: Obadaịa
      author: Obadaịa.
      audience: Juda mgbe Edọm raara Jerusalem nye ndị iro—amụma banyere ọdịda Edọm.
      date: N’oge na-adịghị anya ka afọ 586 T.K. gasịrị.
    Jonah:
      display_name: Jona
      author: A maghị onye dere ya; onye akụkọ a gbadoro ụkwụ na ya bụ Jona nwa Amitaị.
      audience: Izrel mgbe a lọtara site n’ala ọzọ—ịba mba n’ụzọ akaje maka ikewapụ onwe ha n’ihi agbụrụ, na nkwenye na Chineke na-emere ndị si ná mba ọzọ ebere.
      date: O yikarịrị ka ọ bụ ihe dị ka narị afọ nke ise ruo nke anọ T.K.
    Micah:
      display_name: Maịka
      author: Maịka onye Moreshet.
      audience: Juda ná ngwụcha narị afọ nke asatọ T.K., karịsịa ndị ogbenye bi n’ime ime obodo, n’ihu mmegbu ndị ọgaranya na ndị ọchịchị bi n’obodo ukwu.
      date: Ihe dị ka afọ 740–700 T.K.
    Nahum:
      display_name: Nahum
      author: Nahum onye Elkosh.
      audience: Juda ka ọ na-aṅụrị ọṅụ maka ọdịda Ninive na-abịanụ.
      date: Obere oge tupu afọ 612 T.K.
    Habakkuk:
      display_name: Habakọk
      author: Habakọk.
      audience: Juda ka ọ na-eche mbilite Babilọn ihu—mkparịta ụka onye amụma na Chineke banyere ikpe ziri ezi.
      date: Ihe dị ka ngwụcha narị afọ nke asaa T.K.
    Zephaniah:
      display_name: Zefanaịa
      author: Zefanaịa nwa Kushi.
      audience: Juda n’okpuru Josaịa, obere oge tupu ọ malite ime mgbanwe ya.
      date: Ihe dị ka afọ 640–609 T.K.
    Haggai:
      display_name: Hagaị
      author: Hagaị.
      audience: Ndị lọtara n’ala ha ka ha na-ewughachi ụlọnsọ ukwu n’okpuru ọchịchị Darayọs.
      date: Afọ 520 T.K.
    Zechariah:
      display_name: Zekaraịa
      author: Zekaraịa nwa Berekaịa; o yikarịrị ka onye ọzọ dere isi nke 9–14 n’oge e mesịrị.
      audience: Ndị lọtara n’ala ha ka ha na-ewughachi ụlọnsọ ukwu, nakwa ọgbọ ndị biri mgbe a lọtara site n’ala ọzọ.
      date: Isi nke 1–8, ihe dị ka afọ 520–518 T.K.; isi nke 9–14, ikekwe ihe dị ka otu narị afọ ka e mesịrị.
    Malachi:
      display_name: Malakaị
      author: A maghị onye dere ya; “Malakaị” pụtara “onye ozi m.”
      audience: Juda mgbe a lọtara site n’ala ọzọ, mgbe ha malitere ileghara ofufe na ikwesị ntụkwasị obi anya n’okpuru ọchịchị Peshia.
      date: Ihe dị ka etiti narị afọ nke ise T.K.
    Matthew:
      display_name: Matiu
      author: A maghị onye dere ya; ọdịnala na-ekwu na ọ bụ Matiu onyeozi dere ya. Ndị ọkà mmụta nke oge a na-ewere onye dere ya dị ka onye Juu kwere na Kraịst, nke na-asụ Grik, onye jiri Mak na isi mmalite yiri Q dee ya.
      audience: Ọgbakọ ndị Juu kwere na Kraịst, bụ́ ndị na-atụle ihe ndị jikọrọ ha na okpukpe ndị Juu nke ụlọ nzukọ na ihe ndị mere ka ha dị iche.
      date: Ihe dị ka afọ 80–90 M.K.
    Mark:
      display_name: Mak
      author: A maghị onye dere ya; ọdịnala jikọtara ya na Jọn Mak, onye ya na Pita so mee njem.
      audience: Ọgbakọ Ndị Kraịst na-asụ Grik, ikekwe na Rom, nke nọ n’okpuru iyi egwu mkpagbu ma ọ bụ nke iyi egwu ahụ dị nso.
      date: Ihe dị ka afọ 65–75 M.K., n’oge Agha Ndị Juu na mbibi nke ụlọnsọ ukwu.
