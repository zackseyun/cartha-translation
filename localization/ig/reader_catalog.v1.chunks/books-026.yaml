      display_name: Akwụkwọ Ozi Ignatius
      author: Ignatius, bishọp Antiọk, maka akwụkwọ ozi asaa nke mbipụta etiti a na-anabatakarị; akwụkwọ ozi Ignatius ndị e mechara gbasaa na ndị e dere n'aha ya adịghị na nchịkọta a.
      audience: Ọgbakọ Ndị Kraịst nọ n'Efesọs, Magnesia, Tralles, Rom, Filadelfia na Smịna, tinyere Polycarp, ndị e degaara akwụkwọ ozi ndị a mgbe Ignatius na-aga n'ebe a ga-egbu ya n'ihi okwukwe ya.
      date: A na-edokarị ya na mmalite narị afọ nke abụọ AD, nke a na-atụkarị n'agbata afọ 105–117, ọ bụ ezie na a ka na-arụrịta ụka banyere kpọmkwem usoro oge njem Ignatius.
