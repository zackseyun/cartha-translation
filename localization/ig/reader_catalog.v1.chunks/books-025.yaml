  book_metadata:
    Infancy Gospel of Thomas:
      display_name: Oziọma banyere Oge Jizọs Bụ Nwata nke Tọmọs
      author: A maghị onye dere ya. Ụdị ya kacha ochie a pụrụ ịchọpụta ekwughị aha onye dere ya; ikwu na ọ bụ Tọmọs ka e ji dee ya sitere n’aha e nyere ya n’isi akwụkwọ odide ndị e mechara na n’otú e si nyefee ya.
      audience: Ndị Kraịst chọrọ ịmata banyere oge Jizọs bụ nwata na otú a pụrụ isi kọọ ike Chineke, ọzụzụ, mmụta, na ito eto ya tupu akụkọ Oziọma ndị dị n’akwụkwọ nsọ amalite.
      date: A na-ahụkarị mmalite ya na narị afọ nke abụọ AD, ma akwụkwọ a dịgidewo n’ụdị Grik dị iche nnọọ na nsụgharị oge ochie.
    Acts of Paul and Thecla:
      display_name: Ọrụ Pọl na Tekla
      author: A maghị onye dere ya. Ọ bụ otu akụkọ dị n’ime Ọrụ Pọl ka ukwuu; akụkọ oge ochie na otu presbịta dere Ọrụ ahụ enweghị ike iji n’aka chọpụta onye dere ya.
      audience: Ndị Kraịst akụkọ banyere nkwusa ndịozi, ịghara ịlụ di ma ọ bụ nwunye, baptizim, ntachi obi yiri nke ndị na-anwụ n’ihi okwukwe, na ikike nwanyị nwere izi ihe na ịgba akaebe na-amasị.
      date: E dere ya na narị afọ nke abụọ AD, ikekwe n’ọkara ikpeazụ ya; ọ gbasara ma dị ka akụkụ nke Ọrụ Pọl ma dị ka akwụkwọ kwụụrụ onwe ya.
    Gospel of Peter:
      display_name: Oziọma Pita
      author: A maghị onye dere ya. Akụkọ fọdụrụ na-ekwu okwu n’olu Pita, e jikwa aha ya nyefee ya, ma a naghị ele ya anya dị ka ọrụ Pita, onyeozi ahụ dị n’akụkọ ihe mere eme.
      audience: Ndị Kraịst oge mbụ nwere mmasị n’akụkọ gbasapụrụ agbasapụ banyere ahụhụ na mbilite n’ọnwụ, ikekwe n’ime ọgbakọ ebe ikike Pita dị mkpa pụrụ iche.
      date: A na-ahụkarị ya dịka akwụkwọ e dere na narị afọ nke abụọ AD; iberibe Grik bụ isi fọdụrụ sitere n’akwụkwọ odide e dere ọtụtụ oge ka e mesịrị, nke a chọtara na Akhmim.
    2 Clement:
      display_name: Klement nke Abụọ
      author: A maghị onye dere ya. N’agbanyeghị aha ọdịnala ya, nke a bụ okwuchukwu Ndị Kraịst oge mbụ, ọ bụghị akwụkwọ ozi nke abụọ Klement onye Rom dere.
      audience: Ọgbakọ Ndị Kraịst a na-agba ume ka ha chegharịa, na-adịgide n’omume ọma, na-elekọta ndị na-adịghị ike, ma jiri okwukwe tachie obi n’olileanya mbilite n’ọnwụ na ikpe.
      date: A na-ahụkarị ya dịka akwụkwọ e dere n’ọkara mbụ ma ọ bụ n’etiti narị afọ nke abụọ AD (ihe dịka 100–160); ebe e dere ya amaghị.
    Epistle of Barnabas:
      display_name: Akwụkwọ Ozi Banabas
      author: A maghị onye dere ya. N’ọdịnala, e jikọtara ọrụ a na Banabas, onye Pọl na ya so, ma ndị ọkà mmụta nke oge a anabataghị njirimara ahụ.
      audience: Ndị Kraịst na-abụghị ndị Juu a na-akụziri ka ha were Akwụkwọ Nsọ Izrel dị ka nke ha site n’ịkọwa ya n’ụzọ metụtara Kraịst na n’ụzọ ihe atụ, ebe ha na-ekewapụ njirimara ọgbụgba ndụ ha n’omume ndị Juu.
      date: A na-ahụkarị ya dịka akwụkwọ e dere n’agbata mbibi ụlọ nsọ Jerusalem n’afọ AD 70 na mmalite narị afọ nke abụọ, ọtụtụ mgbe ihe dịka 80–130.
