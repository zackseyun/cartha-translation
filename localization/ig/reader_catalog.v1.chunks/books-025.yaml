review:
  verdict: revise
  review_summary: E degharịrị chunk ahụ n’Igbo ka ọ bụrụ nke zuru ezu ma kwekọọ n’isi mmalite Bekee. E doziri nkebi ahịrịokwu na-adịghị eke, ntụgharị ụfọdụ na-ezighị ezi, na aha ụfọdụ na-adịghị ebugharị ihe isi mmalite pụtara n’ụzọ ziri ezi.
  issues:
  - E nwere ọtụtụ ntụgharị aha isi nke na-adịghị eke ma ọ bụ na-agbanwe ihe pụtara, dịka okwu gbasara ule, nrọ, ọchịchịrị, na mkpuchi/ákwà Tekla.
  - A doziri ụfọdụ nhọrọ okwu n’akụkụ metadata na aha isi ka ha ghara ịkọwa ihe karịa isi mmalite ma ka ha bụrụ Igbo doro anya.
