  verdict: revise
  review_summary: E dezigharịrị ntụgharị ahụ iji meziwanye ịdị nkenke, nkịtị okwu UI, na ntụkwasị obi n’ihe ederede Bekee kwuru, karịsịa maka navigation, passage, Testaments of the Twelve Patriarchs, na nkọwa mmalite.
  issues:
  - ‘Reader navigation’ abụghị ‘Njem’; a gbanwere ya ka ọ bụrụ nduzi/nchịgharị ebe ọgụgụ.
  - ‘Jump to passage’ ekwesịghị ịsụgharị naanị dịka ịga n’amaokwu.
  - A doziri aha ‘Testaments of the Twelve Patriarchs’; draft gara n’ọgbụgba ndụ n’ụzọ na-adịghị kwekọọ.
  - A megharịrị introQuote ka ọ ghara ikwu na e mepụtara akwụkwọ site n’ihe odide, kama ka o kwuo na e dere/chịkọtara ha site n’ihe odide ndị e nyochara.
