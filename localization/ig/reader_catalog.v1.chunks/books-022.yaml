review:
  verdict: revise
  review_summary: E mezigharịrị chunk ahụ n’uju. A dozie aha isi nke metụtara ìhè, nkịtị, na nkwupụta ndị na-adịghị mma n’asụsụ Igbo; metadata nọgidere na-egosi enweghị ntụkwasị obi banyere ndị dere na ụbọchị e dere akwụkwọ ndị a.
  issues:
  - Aha ole na ole n’ime draft ahụ nwere usoro okwu na-adịghị eke ma ọ bụ na-eme ka ihe isiokwu Bekee kwuru pụta n’ụzọ na-ezughị ezu, karịsịa Testament of Issachar 6, Testament of Asher 2, Testament of Benjamin 6 na 11, na ụfọdụ aha Gospel of Philip.
  - E dochieghị ozi akụkọ ihe mere eme ma ọ bụ nkọwa okpukpe e nyere n’isi mmalite; e jigidere okwu dịka “ikekwe” na “a na-echekarị” iji zere ikwubiga okwu ókè.
