payload:
  book_metadata:
    Hypostasis of the Archons:
      display_name: Ọdịdị Ndị Ọchịchị
      author: Amaghị onye dere ya. Onye dere akwụkwọ a kọwara Jenesis site n’akụkọ mkpughe banyere ndị ọchịchị; a pụghị ikwu n’ụzọ doro anya na ọ bụ otu onye nkụzi a kpọrọ aha dere ya.
      audience: Ndị Kraịst nọ n’etiti ndị Set ma ọ bụ n’otu yiri ha, bụ́ ndị gụrụ Jenesis dị ka ọgụ dị n’etiti ndị ọchịchị kosmik na-amaghị ihe, amamihe Chineke, na mmalite ime mmụọ nke mmadụ.
      date: A na-ekwukarị na e dere ya na narị afọ nke atọ AD; e chekwara ya n’otu akwụkwọ Koptik nke narị afọ nke anọ dị na Kodeks Nag Hammadi nke Abụọ.
    On the Origin of the World:
      display_name: Banyere Mmalite Ụwa
      author: Amaghị onye dere ya. Akwụkwọ a jikọtara ma gbanwee ọtụtụ ọdịnala ndị Juu, ndị Kraịst, echiche Plato, na akụkọ chi dị iche iche, n’agbanyeghị na ọ kpọghị aha onye chịkọtara ya.
      audience: Ndị na-agụ akwụkwọ nọ n’etiti Ndị Kraịst nwere echiche Gnostik, bụ́ ndị chọrọ akụkọ ọzọ banyere okike, ndị ọchịchị kosmik, Sofia, Adam na Iv, na ihe ga-eme ụwa n’ikpeazụ.
      date: A na-ekwukarị na e dere ya na narị afọ nke atọ AD, ọ bụ ezie na o nwere ike ịbụ na e nwere ihe ndị e dere tupu mgbe ahụ ọ dabere na ha; e chekwara ya karịsịa n’ihe odide Koptik nke narị afọ nke anọ.
    Sophia of Jesus Christ:
      display_name: Amamihe Jizọs Kraịst
      author: Amaghị onye dere ya. Onye dere ya gbanwere ihe ndị a makwaara n’akwụkwọ Eugnostos ka ha bụrụ mkparịta ụka dị n’etiti Jizọs na ndị na-eso ụzọ ya mgbe o si n’ọnwụ bilie.
      audience: Ndị Kraịst nwere mmasị n’amamihe e kpughere banyere Chineke nke karịrị ihe niile, nhazi ụwa eluigwe, nakwa mmalite na nzọpụta nke mkpụrụ obi.
      date: A na-ekwukarị na e dere ya n’ọgwụgwụ narị afọ nke abụọ ma ọ bụ na narị afọ nke atọ AD; e chekwara ya n’akwụkwọ Koptik ndị sitere na Nag Hammadi na Kodeks Berlin.
    Gospel of the Egyptians:
      display_name: Oziọma Ndị Ijipt
      author: Amaghị onye dere ya. Akwụkwọ Nag Hammadi a, nke a na-akpọkwa Akwụkwọ Nsọ nke Mmụọ Ukwu A Na-adịghị Ahụ Anya, dị iche n’Oziọma Ndị Ijipt Grik nke bu ya ụzọ, bụ́ nke a maara naanị site n’ihe ndị ọzọ hotara na ya.
      audience: Otu Ndị Kraịst Set bụ́ ndị ji akụkọ omimi gbara ọkpụrụkpụ, aha ndị dị nsọ, ihe oyiyi nke baptizim, na otuto e ji abụ kọwaa njirimara ime mmụọ na nnapụta.
      date: A na-ekwukarị na e dere ya na narị afọ nke abụọ ma ọ bụ nke atọ AD; akwụkwọ Koptik abụọ nke ya ka dị n’ime kodeks Nag Hammadi nke narị afọ nke anọ.
    Letter of Peter to Philip:
      display_name: Akwụkwọ Ozi Pita Degara Filip
      author: Amaghị onye dere ya. E kwuru n’aha Pita na Filip na ọ bụ ha dere obere akwụkwọ ozi mmalite a na mkpughe sochiri ya, kama ịbụ ihe e nwere ike ikwenye n’ụzọ doro anya na otu n’ime ndịozi abụọ ahụ dere.
      audience: Ndị Kraịst chọrọ nkwado ndịozi maka ozizi banyere Onye Nzọpụta, ike ndị iro, ahụhụ, ozi, na mweghachi nke ndị na-eso ụzọ.
      date: A na-ekwukarị na e dere ya n’ọgwụgwụ narị afọ nke abụọ ma ọ bụ ná mmalite narị afọ nke atọ AD; e chekwara ya n’otu akwụkwọ Nag Hammadi nke narị afọ nke anọ nakwa n’ihe odide Koptik ọzọ e dere mgbe e mesịrị.
    Gospel of Judas:
      display_name: Oziọma Judas
      author: Amaghị onye dere ya. Aha akwụkwọ ahụ na-ekwu na akụkọ ahụ sitere n’aka Judas, ma akwụkwọ ahụ egosighị na Judas Iskarịọt bụ onye dere ya n’ezie n’akụkọ ihe mere eme.
      audience: Otu Ndị Kraịst na-akatọ omume ịchụ àjà na usoro ụka nke ndị ọzọ, na-eji mkparịta ụka mkpughe na nkọwa banyere eluigwe na ụwa yiri nke ndị Set akọwa Judas na ọnwụ Jizọs n’ụzọ ọhụrụ.
      date: A na-ekwukarị na e dere ya n’etiti ma ọ bụ n’ọgwụgwụ narị afọ nke abụọ AD; Irenaeus maara otu Oziọma Judas ka ọ na-erule ihe dị ka afọ 180, ebe akwụkwọ Koptik nke ka dị nwere ike ịbụ nke narị afọ nke atọ ma ọ bụ nke anọ.
    Protoevangelium of James:
      display_name: Oziọma Mbụ Jemis
      author: Amaghị onye dere ya. Onye na-akọ akụkọ ahụ na-ekwu na ya bụ Jemis, ma e dere akwụkwọ ahụ n’aha onye ọzọ, ọ bụghịkwa Jemis nwanne Jizọs dere ya.
      audience: Ndị Kraịst nwere mmasị n’ọmụmụ Meri na nzụlite ya, ịdị ọcha ya na-adịgide adịgide, ọmụmụ Jizọs, na akụkọ ndị na-aza ajụjụ Matiu na Luk hapụrụ n’emeghị ka ha doo anya.
      date: N’ozuzu, a na-ekwu na e dere ya n’ọkara ikpeazụ nke narị afọ nke abụọ AD; ọ ka dị n’ọtụtụ ihe odide Grik e dere mgbe e mesịrị na nsụgharị oge ochie.
