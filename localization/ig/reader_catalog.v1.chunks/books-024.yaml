  verdict: revise
  review_summary: Emezigharịrị ntụgharị asụsụ Igbo zuru ezu. A doziri ụfọdụ okwu na-agbakwunye ihe na-adịghị na isi mmalite, karịsịa aha mpaghara eluigwe, njedebe nke ọgbaaghara, na nkọwa na-ezighị ezi banyere Meri.
  issues:
  - Aha ole na ole na nkọwa ụfọdụ agbakwụnyere ma ọ bụ gbanwere ihe isi mmalite kwuru; edoziwo ha.
  - E wepụrụ nkọwa okpukpe na-enweghị isi mmalite n’aha isi Gospel of Judas 6.
  - E doziri Protoevangelium of James 6 ka ọ ghara ikwu na Meri bụ onye ahụ siri ike.
