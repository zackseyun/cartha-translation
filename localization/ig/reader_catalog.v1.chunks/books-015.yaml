  book_metadata:
    1 Esdras:
      display_name: Esdras nke Mbụ
      author: A maghị onye dere ya; ọ bụ nhazigharị e mere n'asụsụ Grik, nke gbanwere usoro akụkọ dị na 2 Ihe E Mere 35–36, Ezra, na Nehemaya 7–8.
      audience: Ndị Juu nke oge ndị Gris, bụ́ ndị chọrọ akụkọ doro anya banyere nlọghachi na mweghachi.
      date: Ihe dị ka narị afọ nke abụọ ruo narị afọ mbụ T.K.
    Prayer of Manasseh:
      display_name: Ekpere Manase
      author: A maghị onye dere ya; e dere ya n'aha Eze Manase, dị ka à ga-asị na ọ bụ ya dere ya.
      audience: Ndị na-echegharị echegharị, ndị na-ewere nchegharị Manase ka nke ha—a na-ejikwa ya eme ihe n’ofufe n'ọdịnala ụfọdụ.
      date: Ihe dị ka narị afọ nke abụọ ruo narị afọ mbụ T.K.
    Psalm 151:
      display_name: Abụ Ọma nke 151
      author: A maghị onye dere ya; e dere ya n'aha Devid, dị ka à ga-asị na ọ bụ ya dere ya. A hụrụ otu ụdị ya e dere n'asụsụ Hibru na 11QPsa.
      audience: Ndị Juu bi ná mba ọzọ na ndị obodo Kumran, bụ́ ndị ji akwụkwọ Abụ Ọma Devid kpọrọ ihe.
      date: Ihe dị ka narị afọ nke abụọ T.K. ma ọ bụ tupu mgbe ahụ.
    3 Maccabees:
      display_name: Makabi nke Atọ
      author: A maghị onye dere ya; e dere ya n'asụsụ Grik.
      audience: Ndị Juu bi n'Ijipt ma na-asụ Grik—ọ bụ akụkọ nnapụta nke mere n'oge ọchịchị Ptolemi nke Anọ.
      date: Ihe dị ka narị afọ mbụ T.K. ruo narị afọ mbụ M.K.
    4 Maccabees:
      display_name: Makabi nke Anọ
      author: A maghị onye dere ya; ọ bụ onye Juu na-asụ Grik, onye nkà ihe ọmụma ndị Stoik metụtara echiche ya.
      audience: Ndị Juu nke omenala ndị Gris—ọ bụ okwuchukwu nkà ihe ọmụma banyere otú ezi uche si achị agụụ obi site n'ikwesị ntụkwasị obi.
      date: Ihe dị ka narị afọ mbụ M.K.
    Bel and the Dragon:
      display_name: Bel na Agwọ Ukwu Ahụ
      author: A maghị onye dere ya; ọ bụ otu n'ime ihe ndị e tinyere n'Akwụkwọ Daniel n'asụsụ Grik.
      audience: Ndị Juu na-asụ Grik—ọ bụ okwu ịkwa emo nke na-emegide ikpere arụsị.
      date: Ihe dị ka narị afọ nke abụọ ruo narị afọ mbụ T.K.
    Letter of Jeremiah:
      display_name: Akwụkwọ Ozi Jeremaya
      author: A maghị onye dere ya; e dere ya n'aha Jeremaya, dị ka à ga-asị na ọ bụ ya dere ya.
      audience: Ndị Juu bi ná mba ọzọ, bụ́ ndị ikpere arụsị nke ndị gbara ha gburugburu na-anwa ọnwụnwa.
      date: Ihe dị ka narị afọ nke anọ ruo narị afọ nke abụọ T.K.
    Prayer of Azariah and Song of the Three:
      display_name: Ekpere Azaraya na Abụ Ndị Ikom Atọ Ahụ
      author: A maghị onye dere ya; ọ bụ otu n'ime ihe ndị e tinyere n'Akwụkwọ Daniel n'asụsụ Grik.
      audience: Ndị Juu na-asụ Grik—ihe e ji efe ofufe nke metụtara Daniel 3.
      date: Ihe dị ka narị afọ nke abụọ T.K.
    Susanna:
      display_name: Susana
      author: A maghị onye dere ya; ọ bụ otu n'ime ihe ndị e tinyere n'Akwụkwọ Daniel n'asụsụ Grik.
      audience: Ndị Juu na-asụ Grik—akụkọ banyere ezi omume na otú e si baara ịgba akaebe ụgha mba.
      date: Ihe dị ka narị afọ nke abụọ ruo narị afọ mbụ T.K.
    1 Clement:
      display_name: Klement nke Mbụ
      author: A maghị onye dere ya; e kwuru na ọ bụ Klement onye Rom dere ya.
      audience: Ọgbakọ Ndị Kraịst dị na Kọrịnt, nke esemokwu banyere ndị isi nọ na ya.
      date: Ihe dị ka afọ 96 M.K.
