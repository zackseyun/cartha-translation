payload:
  book_metadata:
    1 Corinthians:
      display_name: 1 Ndị Kọrịnt
      author: Pọl, ya na Sọstenes.
      audience: Ọgbakọ Ndị Kraịst nọ na Kọrịnt nke esemokwu kewara ekewa.
      date: Ihe dị ka afọ 53–55 O.K., e dere ya site n’Efesọs.
    2 Corinthians:
      display_name: 2 Ndị Kọrịnt
      author: Pọl, ya na Timoti.
      audience: Ọgbakọ dị na Kọrịnt, mgbe esemokwu na-ewute ha gasịrị.
      date: Ihe dị ka afọ 55–56 O.K.
    Galatians:
      display_name: Ndị Galeshia
      author: Pọl.
      audience: Ọgbakọ Ndị Kraịst dị na Galeshia (n’etiti Anatolia), bụ́ ndị a na-amanye ka ha bie úgwù ma debe Iwu Tora.
      date: Ihe dị ka afọ 48–55 O.K. (a ka na-arụ ụka banyere ya).
    Ephesians:
      display_name: Ndị Efesọs
      author: Pọl, ma ọ bụ onye na-eso ụzọ ya nke ukwuu nke dere n’aha Pọl (a ka na-arụ ụka banyere ya).
      audience: Ndị Kraịst n’Eshia n’ozuzu ha; aha ebe ahụ bụ “Efesọs” adịghị n’ihe odide aka ndị kacha ochie.
      date: Ihe dị ka afọ ndị 60 O.K. ma ọ bụrụ na ọ bụ Pọl dere ya; ihe dị ka afọ ndị 80–90 O.K. ma ọ bụrụ na e dere ya n’aha ya.
    Philippians:
      display_name: Ndị Filipai
      author: Pọl, ya na Timoti.
      audience: Ọgbakọ Ndị Kraịst dị na Filipai, ógbè ndị Rom na-achị na Masedonia.
      date: Ihe dị ka afọ 60–62 O.K., e dere ya n’ụlọ mkpọrọ.
    Colossians:
      display_name: Ndị Kọlọsi
      author: Pọl, ya na Timoti—ma ọ bụ onye na-eso ụzọ ya nke ukwuu nke dere n’aha Pọl (a ka na-arụ ụka banyere ya).
      audience: Ndị Kraịst nọ na Kọlọsi, na ndagwurugwu Laịkọs, bụ́ ndị na-eche ozizi na-agwakọta nkwenkwe dị iche iche ihu.
      date: Ihe dị ka afọ 60–62 O.K. ma ọ bụrụ na ọ bụ Pọl dere ya; e mesịrị karịa nke ahụ ma ọ bụrụ na e dere ya n’aha ya.
    1 Thessalonians:
      display_name: 1 Ndị Tesalonaịka
      author: Pọl, ya na Saịlas na Timoti.
      audience: Ọgbakọ Ndị Kraịst ọhụrụ dị na Tesalonaịka, bụ́ ndị na-eche mkpagbu ihu.
      date: Ihe dị ka afọ 50–51 O.K.—o nwere ike ịbụ akwụkwọ ozi Pọl kacha ochie ka dị taa.
    2 Thessalonians:
      display_name: 2 Ndị Tesalonaịka
      author: Pọl (a ka na-arụ ụka banyere ya; ụfọdụ ndị ọkà mmụta kwenyere na e dere ya n’aha ya).
      audience: Ọgbakọ dị na Tesalonaịka, iji dozie mgbagwoju anya banyere ihe ndị ga-eme n’oge ikpeazụ.
      date: Ihe dị ka afọ 51 O.K. ma ọ bụrụ na ọ bụ Pọl dere ya.
    1 Timothy:
      display_name: 1 Timoti
      author: Pọl, ma ọ bụ onye na-eso ụzọ ya nke dere n’aha Pọl (ọtụtụ ndị ọkà mmụta kwenyere na e dere Akwụkwọ Ozi Ndị Ọzụzụ Atụrụ n’aha Pọl).
      audience: Timoti dị ka onye nnọchiteanya Pọl n’Efesọs; akwụkwọ ntụziaka banyere otú e si ahazi chọọchị n’oge e mesịrị.
      date: Ihe dị ka etiti afọ ndị 60 O.K. ma ọ bụrụ na ọ bụ Pọl dere ya; ihe dị ka afọ 90–110 O.K. ma ọ bụrụ na e dere ya n’aha ya.
    2 Timothy:
      display_name: 2 Timoti
      author: Pọl, ma ọ bụ onye na-eso ụzọ ya nke dere n’aha Pọl.
      audience: Timoti—a haziri ya dị ka okwu ikpeazụ Pọl si n’ụlọ mkpọrọ.
      date: Ihe dị ka etiti afọ ndị 60 O.K. ma ọ bụrụ na ọ bụ Pọl dere ya; ihe dị ka afọ 90–110 O.K. ma ọ bụrụ na e dere ya n’aha ya.
    Titus:
      display_name: Taịtọs
      author: Pọl, ma ọ bụ onye na-eso ụzọ ya nke dere n’aha Pọl.
      audience: Taịtọs dị ka onye nnọchiteanya Pọl na Krit.
      date: Ihe dị ka etiti afọ ndị 60 O.K. ma ọ bụrụ na ọ bụ Pọl dere ya; ihe dị ka afọ 90–110 O.K. ma ọ bụrụ na e dere ya n’aha ya.
    Philemon:
      display_name: Faịlimọn
      author: Pọl, ya na Timoti.
      audience: Faịlimọn, Onye Kraịst nwere ohu, banyere Ọnesimọs, ohu ya gbapụrụ agbapụ.
      date: Ihe dị ka afọ 60–62 O.K.
    Hebrews:
      display_name: Ndị Hibru
      author: A maghị onye dere ya. Omenala akpọtụla Pọl, Apọlọs, Banabas, Prisila, na ndị ọzọ aha; o nweghị echiche nke mmadụ niile kwenyere na ya.
      audience: Ndị Kraịst Juu na-asụ Grik, bụ́ ndị ọnwụnwa na-adọghachi azụ n’okwukwe Ndị Kraịst ha na-abịara.
      date: Ihe dị ka afọ 60–95 O.K.
