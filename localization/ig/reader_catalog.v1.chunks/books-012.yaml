  verdict: revise
  review_summary: Agbaziri ntụgharị Igbo niile; edozila aha isi nke Faịlimọn 1 ka ọ ghara ikwu nnwere onwe a na-ekwughị n’isi mmalite Bekee, ma mezie 1 Ndị Kọrịnt 3 ka o doo anya na ịdọ aka ná ntị ahụ metụtara ụlọ nsọ.
  issues:
  - 'Philemon 1: draft ahụ gbakwụnyere na Pọl rịọrọ nnwere onwe Ọnesimọs, ebe isi mmalite Bekee kwuru naanị na Pọl rịọrọ arịrịọ maka Ọnesimọs.'
  - '1 Corinthians 3: ntụgharị draft ahụ nwere ike ịpụta na ndị Kọrịnt bụ ụlọ nsọ; edozila ya ka ọ kpọọ ụlọ nsọ kpọmkwem dịka isi mmalite si kwuo.'
