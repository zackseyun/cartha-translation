    Sirach:
      display_name: Sirak
      author: Yeshua ben Eleaza ben Sira nke Jerusalem; nwa nwa ya sụgharịrị ya n’asụsụ Grik.
      audience: Ụmụ okorobịa ndị Juu a na-azụ n’amamihe na Jerusalem n’oge ndị Gris na-achị.
      date: 'Ihe odide Hibru mbụ: ihe dị ka afọ 195–175 T.K.; nsụgharị Grik: ihe dị ka afọ 132 T.K.'
    Baruch:
      display_name: Baruk
      author: Amaghị onye dere ya; e dere ya n’aha Baruk, odeakwụkwọ Jeremaịa.
      audience: Ndị Juu bi n’ala ọzọ na-atụgharị uche banyere ije biri n’ala ọzọ, nchegharị, na amamihe.
      date: Ihe dị ka narị afọ nke abụọ T.K.
    1 Maccabees:
      display_name: 1 Makabi
      author: Amaghị onye dere ya; ọ ga-abụ na ọ bụ onye Jerusalem dere ya n’asụsụ Hibru (ọ bụ naanị nsụgharị Grik ka dị ugbu a).
      audience: Ndị Juu n’oge nnupụisi ndị Hasmoni na mgbe ọ gasịrị; akwụkwọ ahụ na-akọwa ihe mere ọchịchị ndị Hasmoni ji nwee ikike ịchị.
      date: Ihe dị ka afọ 100 T.K.
    2 Maccabees:
      display_name: 2 Makabi
      author: Onye a na-amaghị aha ya mere nchịkọta nke akwụkwọ toro ogologo nke Jason onye Saịrini dere; e dere ya n’asụsụ Grik.
      audience: Ndị Juu bi n’ala ọzọ na-asụ Grik—ọ na-emesi ịnwụ n’ihi okwukwe, nlekọta Chineke, na mbilite n’ọnwụ ike.
      date: Ihe dị ka afọ 124 T.K. ma ọ bụ obere oge mgbe nke ahụ gasịrị.
