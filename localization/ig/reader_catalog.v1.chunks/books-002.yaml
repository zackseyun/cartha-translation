    Numbers:
      display_name: Ọnụọgụgụ
      author: A maghị onye dere ya; dịka ọdịnala si kwuo, ọ bụ Mosis dere ya.
      audience: Ụmụ Izrel nọ n'ụzọ site n'Ijipt gaa n'ala ahụ e kwere ná nkwa—ọgbọ ahụ nọ n'ọzara, nakwa ndị gụrụ ya n'oge ndị sochirinụ ka ha mụta ihe site na ọdịda ha.
      date: Akụkụ dị iche iche e dere malite ná ngwụcha oge ọchịchị ndị eze ruo n'oge sochiri ndọrọ n'agha (ihe dị ka narị afọ nke asaa ruo nke ise Tupu Kraịst).
    Deuteronomy:
      display_name: Diuterọnọmi
      author: A maghị onye dere ya; e gosipụtara ya dịka okwu ikpeazụ Mosis kwuru tupu ọ lawa. Ndị ọkà mmụta nke oge a na-ekwu na isi akụkụ ya sitere n'oge mgbanwe Eze Josaịa mere ná ngwụcha narị afọ nke asaa Tupu Kraịst.
      audience: Ụmụ Izrel na-akwadebe ịbanye n'ala ahụ—nakwa ndị e mechara dọrọ n'agha, bú ndị na-ajụ otu ha ga-esi bie ndụ n'ikwesị ntụkwasị obi mgbe ha na-enweghị ụlọ nsọ ma ọ bụ eze.
      date: Isi akụkụ ya bụ nke ngwụcha narị afọ nke asaa Tupu Kraịst; ọ nwetara ọdịdị ikpeazụ ya n'oge ndọrọ n'agha.
    Joshua:
      display_name: Jọshụa
      author: A maghị onye dere ya; ọ bụ akụkụ nke Akụkọ Ihe Mere Eme nke Diuterọnọmi.
      audience: Ụmụ Izrel n'oge ọchịchị ndị eze na n'oge ndọrọ n'agha, ka ha na-atụgharị uche banyere mmeri ala, ọgbụgba ndụ, na ihe ala ahụ pụtara.
      date: A chịkọtara ya n'ihe dị ka narị afọ nke asaa ruo nke isii Tupu Kraịst site n'ọdịnala ndị ka ochie.
