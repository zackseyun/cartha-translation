  book_metadata:
    Luke:
      display_name: Luk
      author: A maghị onye dere ya; ọdịnala na-ekwu na ọ bụ Luk, onye ya na Pọl so mee njem.
      audience: Ndị Kraịst gụrụ akwụkwọ n’ụwa ndị Gris na Rom, e degaara “Teọfilọs.”
      date: Ihe dị ka afọ 80–90 mgbe Kraịst nwụsịrị.
    John:
      display_name: Jọn
      author: A maghị onye dere ya; ọdịnala na-ekwu na ọ bụ Jọn onyeozi ma ọ bụ “Onye Na-eso Ụzọ Jizọs Hụrụ n’Anya.”
      audience: Otu obodo ndị Kraịst nke nwere esemokwu na okpukpe ndị Juu nke ụlọ nzukọ, nke e guzobere gburugburu akaebe Onye Na-eso Ụzọ Jizọs Hụrụ n’Anya.
      date: Ihe dị ka afọ 90–110 mgbe Kraịst nwụsịrị.
      summary: Jọn na-egosi Jizọs dịka Okwu ahụ dị ebighị ebi, onye na-ekpughe Nna, na-enye ndụ site n’ịtụkwasị ya obi, onye a na-enye otuto site n’ihe ịrịba ama ya, ọnwụ ya, na mbilite n’ọnwụ ya.
    Acts:
      display_name: Ọrụ Ndịozi
      author: A maghị onye dere ya; ọ bụkwa onye ahụ dere Luk.
      audience: Ndị Kraịst n’ụwa ndị Gris na Rom; ọ bụ mpịakọta nke abụọ nke akwụkwọ e degaara Teọfilọs.
      date: Ihe dị ka afọ 80–90 mgbe Kraịst nwụsịrị.
    Romans:
      display_name: Ndị Rom
      author: Pọl, ya na onye odeakwụkwọ ya, Teshọs.
      audience: Ndị Kraịst nọ na Rom—ndị kwere ekwe bụ ndị Juu na ndị mba ọzọ, ndị nwere esemokwu banyere Iwu Mosis na onye ha bụ.
      date: Ihe dị ka afọ 56–58 mgbe Kraịst nwụsịrị; e dere ya na Kọrịnt.
