      author: Amaghị onye dere ya; ọtụtụ ndị na-ekwu na ọ bụ Valentinus ma ọ bụ ụlọ akwụkwọ echiche ya dere ya.
      audience: Ndị Kraịst na-agụ akwụkwọ n’ime òtù Gnostik nke Valentinus.
