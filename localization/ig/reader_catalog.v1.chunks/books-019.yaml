    Jubilees:
      display_name: Jubili
      author: Amaghị onye dere ya; e gosipụtara ya dị ka mkpughe e nyere Mosis n’Ugwu Saịnaị.
      audience: Ọgbakọ ndị Juu (ikekwe ndị sitere n’otu gburugburu ahụ ndị Kumran si na ya) bụ́ ndị kwenyesiri ike n’usoro afọ anyanwụ nke ụbọchị 364 na idebe iwu halakha nke ọma.
      date: Ihe dị ka etiti narị afọ nke abụọ Tupu Oge Ndị Kraịst; e chekwara ya n’uju n’asụsụ Ge’ez (Etiopia).
