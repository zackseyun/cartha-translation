  book_metadata:
    Lamentations:
      display_name: Abụ Ákwá
      author: A maghị onye dere ya; ọdịnala na-ekwu na ọ bụ Jeremaịa dere ya.
      audience: Ndị Juda na-eru uju n’ihi mbibi e bibiri Jerusalem n’afọ 586 T.K.
      date: N’oge na-adịghị anya ka afọ 586 T.K. gachara.
    Ezekiel:
      display_name: Ezikiel
      author: Ezikiel, onye nchụàjà a dọọrọ n’agha gaa Babilọn; e mezigharịrị ma hazie akwụkwọ ahụ ka oge na-aga.
      audience: Ndị Juda a dọọrọ n’agha gaa Babilọn, bụ́ ndị na-amụtakwa ịghọta na Chineke nọnyere ha n’agbanyeghị na ha anọghị n’ụlọ nsọ.
      date: Ihe dị ka afọ 593–571 T.K. maka oge onye amụma ahụ jere ozi; e mechara nye akwụkwọ ahụ ọdịdị ikpeazụ ya obere oge ka nke ahụ gasịrị.
    Daniel:
      display_name: Daniel
      author: A maghị onye dere ya; akwụkwọ ahụ kọwara onwe ya dị ka nke Daniel, onye dịrị ndụ n’oge ndọrọ n’agha.
      audience: Ndị Juu a na-akpagbu n’okpuru ọchịchị ndị Gris—karịchaa n’okpuru Antiọkọs nke Anọ Epifanes (167–164 T.K.).
      date: Ọ nwetara ọdịdị a nabatara ya ugbu a n’ihe dị ka afọ 165 T.K.; isi nke 1–6 gụnyere akụkọ ndị eze nke dịbu adị tupu mgbe ahụ.
    Hosea:
      display_name: Hosea
      author: Hosea nwa Beeri.
      audience: Alaeze Izrel nke ugwu n’ime afọ ikpeazụ ya tupu Asiria emerie ya.
      date: Ihe dị ka afọ 750–722 T.K.
