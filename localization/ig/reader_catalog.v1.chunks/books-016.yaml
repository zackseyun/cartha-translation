    1 Enoch:
      display_name: 1 Inọk
      author: A maghị onye dere ya; e ji aha Inọk, nna ochie dịrị ndụ tupu Iju Mmiri ahụ, dee ya dị ka a ga-asị na ọ bụ ya dere ya. Ọ bụ akwụkwọ e jikọtara ọnụ site n'akụkụ dị iche iche.
      audience: Ọgbakọ ndị Juu nwere mmasị n'ọhụ apọkalips, bú ndị na-atụgharị uche banyere ajọ ihe nke ụwa dum, ikpe, na kalenda; e mesịkwara gụọ ya n'etiti ndị Kraịst oge mbụ.
      date: A chịkọtara akụkụ ya n'ihe dị ka narị afọ nke atọ T.K. ruo narị afọ nke mbụ M.K.; ọ bụ naanị n'asụsụ Ge'ez (Etiopia) ka e chekwara ya n'uju.
