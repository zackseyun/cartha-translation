  review_summary: E mezigharịrị ntụgharị okwu ole na ole iji mee ka ha kwekọọ kpọmkwem na isi mmalite Bekee, karịsịa ebe e nwere nkọwa agbakwunyere, ntụgharị na-ezighị ezi, ma ọ bụ okwu na-adịghị doo anya.
  issues:
  - '1 Clement 56: ''submit'' ka a sụgharịrị n''ụzọ ziri ezi dị ka irubere isi.'
  - '1 Enoch 13, 26, 31, 34, 44, 50, 55, 61, 73, 75, na 79: e degharịrị ụfọdụ aha isi iji dozie nghọta na izere nkọwa na-adịghị na isi mmalite.'
  - 'Metadata audience: e wepụrụ nkọwa na-amachibido ''cosmic evil'' naanị n''eluigwe na n''ụwa.'
