payload:
  book_metadata:
    Genesis:
      display_name: Jenesis
      author: A maghị onye dere ya; ọdịnala na-ekwu na ọ bụ Mosis dere ya. Ndị ọkà mmụta nke oge a na-ahụ ya dị ka akwụkwọ nwere ogologo akụkọ nhazi, nke e mechara dekọta isi mmalite dị iche iche ọnụ.
      audience: Izrel n'ịmata onwe ha dị ka ndị ọgbụgba ndụ, na-eme ka akụkọ mmalite ndị mmadụ gbanye mgbọrọgwụ n'okike Chineke, nhọpụta, na nkwa ya.
      date: E dere ya n'ime ọtụtụ narị afọ; ọ ruru n'ụdị a nabatara ya ihe dị ka narị afọ nke isii ruo nke ise Tupu Kraịst, n'oge ma ọ bụ mgbe ndọrọ n'agha Babilọn gasịrị.
      summary: Jenesis na-akọ banyere okike, nnupụisi na mgbasa nke ụmụ mmadụ, nakwa ezinụlọ Ebreham, Aịzik, Jekọb, na Josef, bụ́ ndị ọgbụgba ndụ Chineke kwere Izrel si n'aka ha malite.
    Exodus:
      display_name: Ọpụpụ
      author: A maghị onye dere ya; ọdịnala na-ekwu na ọ bụ Mosis dere ya. Ndị ọkà mmụta nke oge a na-ahụ ya dị ka akwụkwọ nwere ogologo akụkọ nhazi, nke e mechara dekọta isi mmalite dị iche iche ọnụ.
      audience: Izrel dị ka ndị a tọhapụrụ ma soro Chineke gbaa ndụ, na-amụta ihe ịbụ mba ONYENWE n'okpuru iwu ya pụtara.
      date: E dere ya n'ime ọtụtụ narị afọ; ọ ruru n'ụdị a nabatara ya ihe dị ka narị afọ nke isii ruo nke ise Tupu Kraịst.
    Leviticus:
      display_name: Levitikọs
      author: A maghị onye dere ya; ọdịnala na-ekwu na ọ bụ Mosis dere ya. Ndị ọkà mmụta nke oge a na-etinye ya n'isi mmalite ndị nchụaja.
      audience: Ndị nchụaja Izrel na ọgbakọ ndị na-efe ofufe — ntụziaka maka ịchụ àjà, ịdị nsọ, na ịhazi ndụ gburugburu ọnụnọ Chineke.
      date: Usoro nhazi ya sitere n'ọgwụgwụ oge ọchịchị ndị eze ruo oge mgbe ndọrọ n'agha gasịrị (ihe dị ka narị afọ nke asaa ruo nke ise Tupu Kraịst).
