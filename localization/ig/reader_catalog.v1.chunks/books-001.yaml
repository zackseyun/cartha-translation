review:
  verdict: revise
  review_summary: E dezigharịrị aha ụfọdụ na nkọwa metadata iji mee ka ha kwekọọ n'ụzọ ziri ezi na isiokwu Bekee, karịsịa ebe draft gbanwere ihe omume, hapụrụ ihe dị mkpa, ma ọ bụ jiri okwu na-adịghị edo anya.
  issues:
  - A doziri ọtụtụ aha isi, gụnyere Jenesis 19, 21, 23, 24, 36, 40; Ọpụpụ 17, 32, 35; na Levitikọs 7.
  - A mere ka ụfọdụ ntụgharị okwu gbasara onyinye, ebe ịchụ àjà, na ihe ndị mere n'akụkọ kwekọọ nke ọma na isi Bekee.
  - E dekwara metadata n'ụzọ na-adịghị akwalite echiche okpukpe ọ bụla ma na-edobe nkwupụta akụkọ mmụta nke isi mmalite.
