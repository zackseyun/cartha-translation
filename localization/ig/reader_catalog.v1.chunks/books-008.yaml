review:
  verdict: revise
  review_summary: E dechara ntụgharị Igbo zuru ezu ma dozie okwu ole na ole ka ha kwekọọ n’isi mmalite Bekee, karịsịa nkọwa banyere Chineke/ncheta ntụkwasị obi na ndị ofufe si mba ọzọ.
  issues:
  - Doziri ntụgharị ụfọdụ nke "faithful" nke draft tụgharịrị dị ka "kwesịrị ntụkwasị obi," nke nwere ike ịpụta "trustworthy" kama "faithful."
  - Doziri nkọwa ndị dere Aịzaya ka ọ ghara ikwu n’ụzọ siri ike karịa isi mmalite banyere mgbọrọgwụ isi 1–39.
