payload:
  book_metadata:
    Isaiah:
      display_name: Aịzaya
      author: Ọtụtụ ndị dere ya n’ime ọtụtụ narị afọ; isi nke 1–39 gbanyere mkpọrọgwụ n’Aịzaya onye Jerusalem nke narị afọ nke asatọ Tupu Kraịst, ebe isi nke 40–55 (“Aịzaya nke Abụọ”) na 56–66 (“Aịzaya nke Atọ”) na-aza ọnọdụ ndọkpụ n’agha na nlọghachi.
      audience: Ndị Juda n’oge Asiria na-eyi ha egwu, n’oge a dọọrọ ha n’agha na Babilọn, na n’oge mweghachi mgbe ha lọtara—n’usoro oge ndị a.
      date: E dere ya n’agbata ihe dị ka ngwụcha narị afọ nke asatọ na narị afọ nke ise Tupu Kraịst.
    Jeremiah:
      display_name: Jeremaya
      author: Jeremaya onye Anatọt; Barọk, odeakwụkwọ ya, deziri ọtụtụ akụkụ ya, ndị ọzọ mechara deziekwa ya.
      audience: Ndị Juda obere oge tupu Babilọn merie ha, n’oge mmeri ahụ, na mgbe e mesịrị.
      date: Ngwụcha narị afọ nke asaa ruo mmalite narị afọ nke isii Tupu Kraịst.
