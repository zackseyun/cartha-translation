review:
  verdict: revise
  review_summary: E mezigharịrị ntụgharị asụsụ Igbo n’ime chunk a dum. E doziri aha isi ole na ole nwere nkọwa na-adịghị eguzosi ike n’ihe na canonical English (karịsịa Joshua 23; Judges 2, 4, 7, 14, 19; 1 Samuel 14, 23, 25, 27, 28, 31; na 2 Samuel 14, 21), ma echekwara igodo na nhazi niile.
  issues:
  - Ụfọdụ isiokwu draft gbanwere ma ọ bụ belata ihe canonical kwuru, dịka Joshua 23, Judges 2 na 4, na 1 Samuel 23.
  - E ji ụfọdụ okwu na-adịghị mma ma ọ bụ nke na-ezughị ezu tụgharịa isiokwu ụfọdụ, dịka Judges 14 na 19, 1 Samuel 25 na 27, na 2 Samuel 21.
  - A haziri okwu metadata Ruth ka ọ ghara ịdị ka nkwado ndọrọ ndọrọ ọchịchị kama o debe ọdịdị ‘possibly arguing’ nke source.
