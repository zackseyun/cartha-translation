payload:
  book_metadata:
    James:
      display_name: Jemis
      author: Dị ka ọdịnala si kwuo, ọ bụ Jemis, nwanne Jizọs; ndị ọkà mmụta nke oge a kewara n’echiche ma ọ bụ ya dere ya n’ezie ma ọ bụ e dere ya n’aha ya.
      audience: Ọgbakọ Ndị Kraịst Juu nọ ná mba ọzọ.
      date: Ihe dị ka afọ 50–60 AD ma ọ bụrụ na ọ bụ ya dere ya n’ezie; ihe dị ka ngwụcha narị afọ mbụ AD ma ọ bụrụ na e dere ya n’aha ya.
    1 Peter:
      display_name: 1 Pita
      author: Dị ka ọdịnala si kwuo, ọ bụ Pita onyeozi, Saịlvanọs bụrụ onye odeakwụkwọ ya; ụfọdụ ndị ọkà mmụta kweere na e dere ya n’aha Pita.
      audience: Ndị Kraịst nọ n’Eshia Maịnọ nke Rom, ndị na-eche mmegide ọha mmadụ ihu.
      date: Ihe dị ka afọ 60 AD ma ọ bụrụ na ọ bụ Pita dere ya; ihe dị ka afọ 70–90 AD ma ọ bụrụ na e dere ya n’aha ya.
    2 Peter:
      display_name: 2 Pita
      author: Dị ka ọdịnala si kwuo, ọ bụ Pita; ọtụtụ ndị ọkà mmụta nke oge a kweere na e dere ya n’aha Pita.
      audience: Ndị Kraịst na-eche ndị na-akwa emo ihu, bụ ndị na-agọnahụ ọbịbịa Kraịst ọzọ.
      date: Ihe dị ka mmalite narị afọ nke abụọ AD.
    1 John:
      display_name: 1 Jọn
      author: A maghị onye dere ya; dị ka ọdịnala si kwuo, ọ bụ Jọn onyeozi ma ọ bụ okenye nke òtù Jọn.
      audience: Obodo ndị Jọn mgbe nkewa gasịrị, na-akọwa onye so n’ime ha.
      date: Ihe dị ka afọ 90–110 AD.
    2 John:
      display_name: 2 Jọn
      author: “Okenye ahụ.”
      audience: Otu ọgbakọ Ndị Kraịst a kapịrị ọnụ (“nwanyị ahụ a họpụtara”), nke a dọrọ aka ná ntị banyere ndị ozizi ụgha.
      date: Ihe dị ka afọ 90–110 AD.
    3 John:
      display_name: 3 Jọn
      author: “Okenye ahụ.”
      audience: Gayọs, otu onye ndu na-anabata ndị ozi ala ọzọ na-eme njem.
      date: Ihe dị ka afọ 90–110 AD.
    Jude:
      display_name: Jud
      author: Dị ka ọdịnala si kwuo, ọ bụ Jud, nwanne Jemis na Jizọs.
      audience: Obodo Ndị Kraịst ndị ozizi na-akwalite omume rụrụ arụ na-ezobata n’ime ha.
      date: Ihe dị ka afọ 60–90 AD.
    Revelation:
      display_name: Mkpughe
      author: Jọn nke Patmọs (ụdị ide ya dị iche na nke Oziọma nke Anọ).
      audience: Ọgbakọ Ndị Kraịst asaa nọ n’Eshia Maịnọ nke Rom, n’okpuru nrụgide ọchịchị alaeze ukwu.
      date: Ihe dị ka afọ 90 AD; dị ka ọdịnala si kwuo, n’oge ọchịchị Domishan.
    Tobit:
      display_name: Tobit
      author: A maghị onye dere ya.
      audience: Ndị Juu nọ ná mba ọzọ, na-ebi nsọpụrụ Chineke, alụmdi na nwunye, na nlekọta Chineke n’okpuru ọchịchị ndị mba ọzọ.
      date: Ihe dị ka afọ 225–175 BC; e dere ya n’asụsụ Aramaik, a hụkwara nsụgharị Hibru ya na Kumran.
    Judith:
      display_name: Judit
      author: A maghị onye dere ya.
      audience: Ndị Juu nọ n’ihe iyi egwu ndị mba ọzọ—akụkọ nkwụsi ike nke iguzogide n’ụzọ nsọpụrụ Chineke.
      date: Ihe dị ka afọ 150–100 BC.
    Greek Additions to Esther:
      display_name: Ihe Ndị Grik Gbakwunyere n’Akwụkwọ Esta
      author: A maghị onye dere ya; ihe mgbakwunye e tinyere na nsụgharị Grik nke akwụkwọ Esta.
      audience: Ndị Juu na-asụ Grik chọrọ ka akụkọ Esta nwee ekpere na ntụaka doro anya banyere Chineke.
      date: Ihe dị ka narị afọ nke abụọ ruo nke mbụ BC.
    Wisdom of Solomon:
      display_name: Amamihe Solomọn
      author: A maghị onye dere ya; e dere ya n’aha Solomọn n’agbanyeghị na ọ bụghị ya dere ya. Otu onye Juu nke omenala ndị Grik, ma eleghị anya n’Aleksandria, dere ya n’asụsụ Grik.
      audience: Ndị Juu nke omenala ndị Grik na-atụle nkà ihe ọmụma Grik, na-agbachitere amamihe Izrel pụọ n’ụzọ ndị ọgọ mmụọ na ndị gbakụtara okwukwe azụ.
      date: Ihe dị ka afọ 50 BC ruo 50 AD.
