review:
  verdict: revise
  review_summary: Emezigharịrị ntụgharị asụsụ niile. A doziewo aha ole na ole, oke ụbọchị ndị e mere ka ha bụrụ kpọmkwem karịa isi mmalite, na aha isiakwụkwọ ụfọdụ nke gbanwere ihe pụtara ma ọ bụ tinye nkọwa na-adịghị na isi mmalite.
  issues:
  - E dekọrọ ụbọchị ụfọdụ dị ka oke afọ (dịka 50–69 na 70–99) kama ịsụgharị oke narị afọ/afọ dị n’isi mmalite.
  - Aha isiakwụkwọ ụfọdụ nwere nkọwa gbanwere ma ọ bụ karịrị isi mmalite, ọkachasị 1 Pita 5, Mkpughe 10 na 14, Tobit 5, 11 na 14, na Judit 6.
  - A gbanwere ‘scribe’ n’1 Pita ka ọ bụrụ ‘odeakwụkwọ’ n’ụzọ nwere ike ikwu na Saịlvanọs bụ onye dere; e doziri ya ka ọ bụrụ onye odeakwụkwọ/onyinye enyemaka n’ide.
