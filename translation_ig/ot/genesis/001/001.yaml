  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: ig
  text: Na mmalite, mgbe Chineke kere eluigwe na ụwa[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'N’ụzọ ọdịnala, a na-atụgharị ya dịka ahịrịokwu zuru ezu: “Na mmalite, Chineke kere eluigwe na ụwa.” Ma n’asụsụ Hibru, בְּרֵאשִׁית, nke a na-ejighị akara nkọwapụta dee, sochiri ngwaa zuru ezu בָּרָא; ya mere, a pụrụ ịgụ ya n’ụzọ sitere n’okike dịka nkebi ahịrịokwu oge dabere, dịka Jenesis 2:4b. Ahịrịokwu isi dị n’amaokwu 3: “Chineke wee sị, ‘Ka ìhè dịrị.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Na mmalite, mgbe … kere
  rationale: “Na mmalite” na-egosipụta echiche רֵאשִׁית nke ọma, ebe “mgbe” na-eme ka o doo anya na ahịrịokwu a bụ nkebiokwu oge nke na-eduga n'ahịrịokwu isi sochirinụ.
- source_word: בָּרָא
  choice: kere
  rationale: “Kere” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ọrụ Chineke nke ime ka ihe dịrị; ọ naghị ekpebi ụzọ e si kee ihe.
- source_word: אֱלֹהִים
  choice: Chineke
  rationale: Ọ bụ ezie na ọdịdị okwu Hibru a yiri ọtụtụ, ngwaa בָּרָא dị n'ọnụọgụ otu ebe a, ya mere ọ na-ezo aka n'otu Chineke.
- source_word: אֵת
  choice: '[atụgharịghị ya; akara nke ihe ngwaa metụtara kpọmkwem]'
  rationale: אֵת bụ akara ụtọasụsụ Hibru nke na-egosi ihe ngwaa metụtara kpọmkwem; usoro okwu Igbo na-egosipụta ọrụ ya n'enweghị okwu pụrụ iche.
- source_word: הַשָּׁמַיִם
  choice: eluigwe
  rationale: “Eluigwe” bụ okwu Igbo a na-eji maka mbara elu ma dabara n'okwu jikọrọ “eluigwe na ụwa,” nke na-anọchi anya ihe niile e kere eke.
- source_word: הָאָרֶץ
  choice: ụwa
  rationale: Ọ bụ ezie na אָרֶץ nwekwara ike ịpụta “ala,” njikọ ya na “eluigwe” n'ebe a na-egosi ụwa dum.
theological_decisions:
- issue: Ọdịdị ụtọasụsụ nke okwu mmeghe
  choice: 'Nkebiokwu oge dabere n''ahịrịokwu na-esote: “Na mmalite, mgbe Chineke kere eluigwe na ụwa—”'
  alternative: 'Ahịrịokwu zuru ezu: “Na mmalite, Chineke kere eluigwe na ụwa.”'
  rationale: Enweghị mkpụrụokwu nrụtụ aka n'ihu בְּרֵאשִׁית, ọ na-esokwa ngwaa zuru ezu בָּרָא; nke a na-akwado ịgụ ya dịka nkebiokwu oge na-eduga n'ahịrịokwu isi, dịka usoro yiri ya dị na Jenesis 2:4b na Hosea 1:2. Ma ebe ịgụ ya dịka ahịrịokwu zuru ezu bụkwa ọdịnala siri ike, e debere ya n'ala peeji kama ikpochapụ nghọta ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Akara ogologo “—” na-egosi na amaokwu a bụ nkebiokwu na-echere mmezu ya n'amaokwu ndị na-esote; e debere marker [a] ozugbo n'isiokwu ahụ.
