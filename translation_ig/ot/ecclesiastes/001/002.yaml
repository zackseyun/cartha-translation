source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: ig
  text: 'Kohelet[b] kwuru, sị: “Ume karịrị ume niile[a]; ume karịrị ume niile, ihe niile bụ naanị ume.”'
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Hibru hevel pụtara n’ụzọ nkịtị “ume” ma ọ bụ “alụlụ.” N’ime ugboro iri atọ na asatọ e ji ya mee ihe n’akwụkwọ a, ọ na-ebukarị echiche atọ jikọrọ ọnụ: ihe na-adị nwa oge, dịka ume na-apụ ozugbo; ihe a na-apụghị ijide; na ihe na-apụta n’ụzọ megidere ihe a tụrụ anya ya. O nweghị otu okwu Igbo na-ekpuchi ha niile. Ya mere, anyị debere ihe oyiyi ahụ bụ “ume.” Usoro Hibru הֲבֵל הֲבָלִים bụ ụzọ e si egosi ogo kachasị elu, dịka “abụ karịrị abụ niile” ma ọ bụ “ebe nsọ kachanụ.”'
    reason: lexical_choice
  - marker: b
    text: Kohelet bụ aha ma ọ bụ utu aha Hibru a na-asụgharịkarị dịka “Onye Ozizi” ma ọ bụ “Onye Nkwusa.” Nke ọ bụla n’ime ha na-eme ka ihe okwu ahụ nwere ike ịpụta dị warara; ya mere, anyị dere aha Hibru ahụ n’ụda Igbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל (hevel)
  choice: ume
  rationale: Okwu Hibru a pụtara n'ụzọ nkịtị “ume” ma ọ bụ “alụlụ.” N’akwụkwọ a, ọ na-ejikọta echiche nke ihe na-adị nwa oge, ihe a na-apụghị ijide, na ihe na-apụta n’ụzọ megidere ihe a tụrụ anya ya. “Ume” na-edobe ihe oyiyi ahụ kama ịhọrọ naanị otu n’ime echiche ndị ahụ.
- source_word: הֲבֵל הֲבָלִים
  choice: ume nke ume niile
  rationale: Usoro Hibru “X nke X niile” bụ ụzọ e si egosi ogo kachasị elu, dịka “abụ nke abụ niile.” Nsụgharị a na-edobe ma usoro ahụ ma ihe oyiyi nke ume.
- source_word: אָמַר
  choice: ka … na-ekwu
  rationale: Ọ bụ ezie na ngwaa Hibru dị n’ụdị a na-ejikarị akọ ihe gara aga, n’okwu mmeghe nke ụdị a ọ na-eweta nkwupụta onye ahụ dị ka nke ka na-ekwu okwu ugbu a.
- source_word: קֹהֶלֶת
  choice: Kohelet
  rationale: E degharịrị aha/utu aha Hibru a n’ụda Igbo ka a ghara ikpebi na ọ pụtara naanị “Onye Ozizi” ma ọ bụ “Onye Nkwusa.”
- source_word: הַכֹּל
  choice: ihe niile
  rationale: Nke a na-egosipụta oke zuru ezu nke okwu Hibru ahụ n’Igbo dị mfe ma bụrụkwa nke okike.
- source_word: הָבֶל
  choice: naanị ume
  rationale: N’ọnọdụ nkwubiokwu a, “naanị” na-enye ụda nke ibelata uru ihe niile dịka ihe gbapụ ngwa ngwa, ka onye na-agụ ghara ịghọta okwu ahụ nanị dịka nkwupụta banyere ihe e ji ihe niile mee.
theological_decisions:
- issue: Otu e si asụgharị הֶבֶל, isi ihe oyiyi Kohelet ji arụ ọrụ
  choice: Idowe ihe oyiyi ahụ dịka “ume”—“ume nke ume niile” n’usoro ogo kachasị elu na “naanị ume” na nkwubiokwu.
  alternative: ihe efu; ihe na-enweghị isi; ihe na-abaghị uru; ihe na-agafe ngwa ngwa; alụlụ
  rationale: Okwu ndị na-akọwa echiche kpọmkwem na-ahọrọkarị naanị otu akụkụ nke הֶבֶל ma tufuo akụkụ ndị ọzọ. “Ihe na-enweghị isi” nwekwara ike itinye echiche na ndụ enweghị ihe ọ bụla ọ pụtara, nke okwu Hibru n’onwe ya anaghị ekwupụta n’ụzọ doro anya. “Ume” na-ahapụ mgbagwoju na esemokwu nke ihe oyiyi ahụ ka ọnọdụ akwụkwọ kọwaa ya.
- issue: Otu e si egosi onye a kpọrọ קֹהֶלֶת
  choice: Kohelet
  alternative: Onye Ozizi; Onye Nkwusa; Onye Nzukọ
  rationale: Ihe utu aha a pụtara kpọmkwem abụghị ihe e ji otu okwu mee mkpebi n’enweghị mgbagha. Idegharị ya dịka “Kohelet” na-edobe ohere ahụ ma ghara ịkwado otu nkọwa okpukpe pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A hapụrụ mmegharị ahịrị Hibru ahụ ka ike uri ya dịrị. “Ume nke ume niile” abụghị akpaokwu mkparịta ụka kwa ụbọchị, ma ọ bụ usoro uri doro anya nke na-edobe ụdị ogo kachasị elu dị na isi mmalite.
