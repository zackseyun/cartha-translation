source:
  edition: SBLGNT
  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: ig
  text: na-azụlite anyị[a], ka anyị, mgbe anyị jụworo omume na-adịghị asọpụrụ Chineke na ọchịchọ nke ụwa[b], bie ndụ n’oge a dị ugbu a n’ụzọ anyị si achịkwa onwe anyị, n’ụzọ ziri ezi, na n’ụzọ na-asọpụrụ Chineke[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-akụziri anyị” ma ọ bụ “na-adọ anyị aka ná ntị.” Okwu Grik ahụ gụnyere ọzụzụ na-akpụ mmadụ n’omume.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “agụụ nke ụwa.”
    reason: lexical_alternative
  - marker: c
    text: 'N’asụsụ Grik, e ji okwu nkọwa atọ kwuo ya: ibi ndụ n’ụzọ e ji achịkwa onwe, n’ụzọ ziri ezi, na n’ụzọ na-asọpụrụ Chineke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: na-azụ anyị
  rationale: Ọ na-egosi ọzụzụ na-akụzi mmadụ ma na-akpụkwa omume ya; ọ bụghị naanị inye ihe ọmụma, ọ bụghịkwa naanị ịta ahụhụ.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-egosi ebumnuche ma ọ bụ ihe a chọrọ ka ọ pụta, dịka njikọ Grik a si arụ ọrụ n’ebe a.
- source_word: ἀρνησάμενοι
  choice: mgbe anyị jụchara
  rationale: Ụdị a na-egosi ịjụ ihe n’ụzọ doro anya tupu ibi ụdị ndụ a kọwara n’ahịrịokwu bụ isi.
- source_word: ἀσέβειαν
  choice: omume na-adịghị asọpụrụ Chineke
  rationale: Nke a na-edobe akụkụ okpukpe na nke omume dị n’okwu ahụ, ma na-ada nghọta n’Igbo nke oge a.
- source_word: κοσμικὰς ἐπιθυμίας
  choice: ọchịchọ nke ụwa
  rationale: Ọ na-ezo aka n’ọchịchọ ndị usoro ụwa a na-akwalite; ọ naghị eme ka okwu ahụ sie ike karịa ihe Grik kwuru.
- source_word: σωφρόνως
  choice: na-achịkwa onwe anyị
  rationale: Ọ na-egosi ibi ndụ nwere njide onwe onye na ezi uche, bụkwa isi echiche okwu a na Taitọs.
- source_word: δικαίως
  choice: na-eme ihe ziri ezi
  rationale: Ọ na-egosi omume kwekọrọ n’ihe ziri ezi; ntụgharị a na-edobe ya dị ka otu n’ime ụzọ atọ e si ebi ndụ.
- source_word: εὐσεβῶς
  choice: na-asọpụtakwa Chineke
  rationale: Ọ na-egosi ndụ a tụkwasịrị n’ịsọpụrụ Chineke na nrubeisi nye ya.
- source_word: ζήσωμεν
  choice: anyị wee bie ndụ
  rationale: N’okpuru “ka,” nke a na-egosi ndụ a chọrọ ka ọzụzụ amara Chineke mịa n’ime ndị kwere ekwe, n’emeghị ya iwu kpọmkwem ma ọ bụ ihe ga-emerịrị.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: n’oge dị ugbu a
  rationale: Ọ na-edobe echiche nke oge a nke dị iche n’oge na-abịa, ma na-ada n'ụzọ dị mfe n’Igbo.
theological_decisions:
- issue: 'Usoro okwu atọ: σωφρόνως καὶ δικαίως καὶ εὐσεβῶς'
  choice: na-achịkwa onwe anyị, na-eme ihe ziri ezi, na-asọpụtakwa Chineke
  alternative: jiri njide onwe onye, ezi omume, na nsọpụrụ Chineke bie ndụ
  rationale: Grik ji ilu atọ kọwaa otu e si ebi ndụ. Tụgharịa ha dị ka omume atọ na-aga n’usoro na-echekwa nhazi na ibu echiche ha, ma mee ka Igbo bụrụ nke sitere n’ọnụ mmadụ pụta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-aga n’ihu site n’amaokwu bu ya ụzọ, ya mere e bidoro ya n’obere mkpụrụedemede ma debe rikoma n’isi njedebe. A zere okwu ụka nke otu òtù pụrụ iche.
