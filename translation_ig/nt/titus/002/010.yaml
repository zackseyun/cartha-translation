source:
  edition: SBLGNT
  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: ig
  text: ka ha ghara izuru ihe, kama ka ha gosi ikwesị ntụkwasị obi ọma n’ụzọ ọ bụla[a], ka ha wee mee ka ozizi nke Chineke, Onye Nzọpụta anyị, maa mma n’ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha gosi okwukwe ọma n’ụzọ ọ bụla.” Okwu Grik πίστις na-apụtakarị “okwukwe,” ma n’ebe a o yikarịrị ka ọ na-ekwu maka ikwesị ntụkwasị obi ma ọ bụ ịbụ onye a pụrụ ịtụkwasị obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: νοσφιζομένους
  choice: ka ha ghara izuru ihe
  rationale: Okwu a na-egosi iwere ma ọ bụ idobere onwe onye ihe bụ nke onye ọzọ. N'ọnọdụ ndị ohu na ndị nwe ha, “izuru ihe” doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: ka ha gosi na ha kwesịrị ntụkwasị obi n'ụzọ zuru ezu
  rationale: N'ọnọdụ a, πίστις na-ezo nke ukwuu n'ikwesị ntụkwasị obi na omume. “N'ụzọ zuru ezu” na-egosipụta ike πᾶσαν, ebe echiche nke ἀγαθήν dị n'àgwà ọma nke ntụkwasị obi ahụ.
- source_word: κοσμῶσιν
  choice: mee ka ... maa mma
  rationale: Nke a na-edobe ihe atụ nke ịchọ ihe mma, ma na-ekwu ya n'Igbo dị mfe ma dị ndụ.
- source_word: διδασκαλίαν
  choice: ozizi
  rationale: “Ozizi” bụ okwu Igbo a na-aghọta nke ọma maka ihe a na-akụzi, ma dabara n'okwu διδασκαλία.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: nke Chineke, Onye Nzọpụta anyị
  rationale: Nke a na-edobe Chineke dị ka Onye Nzọpụta anyị dịka ahịrịokwu Grik si kwuo, n'etinyeghị onye ọzọ n'ahịrịokwu ahụ.
- source_word: ἐν πᾶσιν
  choice: n'ihe niile
  rationale: 'Nke a na-echekwa obosara na obere mgbagwoju anya nke ahịrịokwu Grik: ọ pụrụ ịpụta n''ihe niile ma ọ bụ n''ụzọ niile.'
theological_decisions:
- issue: Ihe πίστις pụtara n'ọnọdụ omume a
  choice: kwesịrị ntụkwasị obi
  alternative: ezi okwukwe
  rationale: Ọnọdụ ahụ bụ omume ndị ohu n'ebe ndị nwe ha nọ, ya mere ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi bụ echiche kacha pụta ìhè. Ihe ọzọ πίστις pụrụ ịpụta ka e debere n'okpuru peeji.
- issue: Onye okwu “Onye Nzọpụta anyị” na-ezo aka na ya
  choice: Chineke, Onye Nzọpụta anyị
  alternative: Ịgụ ya n'ìhè ebe ndị ọzọ kpọrọ Kraịst Onye Nzọpụta
  rationale: Amaokwu a n'onwe ya kpọrọ Chineke Onye Nzọpụta anyị. Nsụgharị ahụ echekwala nke ahụ n'emeghị ka ọ bụrụ nkwupụta doro anya banyere Kraịst ebe ahịrịokwu a ekwughị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù dee ya. Ahịrịokwu ahụ na-aga n'ihu n'iwu e nyere ndị ohu n'amaokwu ndị gbara ya gburugburu; ya mere e debere “ha” n'enweghị ịkpọghachi aha otu ahụ. E jiri “mee ka ... maa mma” chekwaa ihe atụ dị na κοσμέω n'ụzọ ndị na-agụ Igbo ga-aghọta.
