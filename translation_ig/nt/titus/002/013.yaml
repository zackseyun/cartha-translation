  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: ig
  text: ka anyị na-atụsi anya ike olileanya a gọziri agọzi na ngosipụta nke ebube nke Chineke ukwu na Onye Nzọpụta anyị, Jizọs Mesaya ahụ,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, nke o yikarịrị obere: “ebube nke Chineke ukwu na nke Onye Nzọpụta anyị, Jizọs Mesaya,” ma ọ bụrụ na a ghọta “Chineke” na “Onye Nzọpụta” dịka mmadụ abụọ dị iche, ọ bụghị dịka aha abụọ nke Jizọs.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: ka anyị na-atụsi anya ike
  rationale: Nke a na-egosi nchere na-aga n’ihu nke jupụtara n’ọchịchọ na atụmanya, ma na-ejikọkwa ahịrịokwu a na ihe e kwuru tupu ya.
- source_word: μακαρίαν ἐλπίδα
  choice: olileanya ahụ a gọziri agọzi
  rationale: Ọ na-echekwa echiche nke olileanya nwere ngọzi pụrụ iche, ọ bụghị naanị ọchịchọ mmadụ na-ejighị n’aka.
- source_word: ἐπιφάνειαν
  choice: mpụta ìhè
  rationale: Okwu a na-egosi ngosipụta a ga-ahụ anya; ‘mpụta ìhè’ bụ Igbo doro anya ma ghara ịbụ okwu okpukpe siri ike nghọta.
- source_word: δόξης
  choice: nke ebube
  rationale: 'A na-echekwa njikọ genitive dị na Grik: mpụta ìhè nke ebube.'
- source_word: τοῦ μεγάλου θεοῦ
  choice: nke Chineke ukwu anyị
  rationale: ‘Chineke ukwu’ na-ebuga μεγάλου θεοῦ n’ụzọ kwụ ọtọ ma dị ùgwù.
- source_word: σωτῆρος ἡμῶν
  choice: na Onye Nzọpụta anyị
  rationale: ‘Onye Nzọpụta’ bụ okwu Igbo doro anya na nke a na-ejikarị akọwa onye na-azọpụta.
- source_word: Ἰησοῦ Χριστοῦ
  choice: bụ́ Jizọs, Mesaya ahụ
  rationale: Χριστός bụ aha ọkwa pụtara Mesaya; ‘bụ́’ na-eme ka nkọwa aha ahụ bụrụ nke sitere n’okike n’Igbo, ebe ‘ahụ’ na-egosi aha ọkwa a maara ama.
theological_decisions:
- issue: Ma ‘Chineke ukwu anyị na Onye Nzọpụta anyị’ na-ekwu maka otu onye, bụ́ Jizọs Mesaya, ka ọ na-ekwu maka Chineke na Jizọs dị ka mmadụ abụọ dị iche
  choice: 'E dere ya dị ka otu onye: Jizọs Mesaya bụ Chineke ukwu anyị na Onye Nzọpụta anyị.'
  alternative: 'A pụrụ ịghọta ya dị ka mmadụ abụọ: Chineke ukwu, na Onye Nzọpụta anyị bụ́ Jizọs Mesaya.'
  rationale: N’asụsụ Grik, otu article na-achị aha mmadụ abụọ dị n’otu ọnụọgụ, τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν, aha ‘Jizọs Mesaya’ esochiekwa ya. Nke a na-akacha egosi otu onye, ma ihe ọzọ a pụrụ ịghọta ka edebere n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-atụsi anya ike’ na-egosi atụmanya siri ike; ‘mpụta ìhè’ na-ezere jargon. E debere akara ntụaka [a] ozugbo n’ebe esemokwu gbasara onye okwu ahụ na-ezo aka dị.
