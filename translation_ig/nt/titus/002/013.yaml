review_pass:
  verdict: revise
  source_fidelity: A chọrọ mmezi iji wepụ nnọchiaha «anyị» n’ebe ọ na-adịghị kpọmkwem na Grik («Chineke ukwu anyị»), ebe ἡμῶν na-agbaso «Onye Nzọpụta». Ekwu «ngosipụta» na-ebuga ἐπιφάνεια n’ụzọ doro anya karịa «mpụta ìhè». A na-edobe ọgụgụ bụ isi nke na-ahụ Jizọs Mesaya dịka otu onye a kpọrọ Chineke ukwu na Onye Nzọpụta, ma a na-edobe ọgụgụ ọzọ n’ala peeji.
  naturalness: «Ka anyị na-atụsi anya ike» dabara n’usoro ahịrịokwu na-aga n’ihu sitere n’amaokwu ndị bu ụzọ. «Ngosipụta nke ebube» bụ Igbo Izugbe dị mfe ma bụrụkwa ihe okike karịa «mpụta ìhè». «Jizọs Mesaya ahụ» na-arụ ọrụ nke ọma dịka aha ọkwa n’ụdị apposition, na-enweghị kọma nke kewara aha ahụ n’enweghị mkpa.
  terminology: «Olileanya a gọziri agọzi», «ebube», «Chineke», «Onye Nzọpụta», na «Mesaya» dabara n’usoro okwu dị ùgwù na nke a na-ahụkarị. E ji «Mesaya» sụgharịa Χριστός, kama ịhapụ ya dịka transliteration «Kraịst».
  issues:
  - severity: medium
    issue: «Chineke ukwu anyị» na-etinye «anyị/our» n’ọrụ na «Chineke».
    rationale: N’ederede Grik, ἡμῶν na-esote σωτῆρος («Onye Nzọpụta anyị»), ọ bụghị θεοῦ («Chineke»). Ọ bụ ezie na echiche otu-onye nwere ike ime ka English gbasaa «our» n’aha abụọ ahụ, Igbo nwere ike idobe ebe Grik tinyere ya n’enweghị ọnwụ nke ọgụgụ bụ isi.
  - severity: low
    issue: «mpụta ìhè» anaghị ada ka nsụgharị kacha eke maka ἐπιφάνεια n’ebe a.
    rationale: O nwere ike ịpụta mpụta nke ìhè n’onwe ya. «Ngosipụta» na-egosi ịpụta/igosi n’ihu mmadụ ma na-edobe nghọta eschatological nke ἐπιφάνεια.
  - severity: low
    issue: Kọma dị n’etiti «Jizọs» na «Mesaya ahụ» na-ekewa aha ọkwa ahụ n’enweghị mkpa.
    rationale: «Jizọs Mesaya ahụ» bụ apposition aha na aha ọkwa nke na-agụ nke ọma karịa ya na kọma.
