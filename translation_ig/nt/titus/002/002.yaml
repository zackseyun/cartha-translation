revisions:
- from: Ndị ikom meworo agadi kwesịrị ịbụ ndị na-ejide onwe ha, ndị a na-akwanyere ùgwù, ndị na-achịkwa onwe ha, bụrụkwa ndị siri ike n'okwukwe[a], n'ịhụnanya, na n'ịtachi obi.
  to: Ndị ikom meworo agadi kwesịrị ịbụ ndị nwere uche doro anya, ndị a na-akwanyere ùgwù, ndị na-achịkwa onwe ha, bụrụkwa ndị siri ike n’okwukwe[a], n’ịhụnanya, na n’ịtachi obi.
  rationale: The revision distinguishes νηφαλίους from σώφρονας by rendering the former as clear-headedness and retaining self-control for the latter. It otherwise preserves the draft’s accurate handling of the age-based address, the virtue-list register, the participial metaphor of soundness, and the footnoted ambiguity of πίστις.
