id: TIT.2.2
reference: Titus 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: ig
  text: Ndị ikom meworo agadi kwesịrị ịbụ ndị nwere uche doro anya, ndị a na-akwanyere ùgwù, ndị na-achịkwa onwe ha, bụrụkwa ndị siri ike n’okwukwe[a], n’ịhụnanya, na n’ịtachi obi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị siri ike n’ikwesị ntụkwasị obi.” Okwu Grik πίστις nwere ike ịpụta “okwukwe” ma ọ bụ “ikwesị ntụkwasị obi,” dabere n’ọnọdụ e ji ya mee ihe.
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: ndị ikom meworo agadi
  rationale: N'ebe a okwu ahụ na-ezo aka n'ikom ndị kara nká, ọ bụghị ndị okenye ji ọkwa n'ọgbakọ; nsụgharị a na-edobe ma afọ ha ma okike ha anya.
- source_word: νηφαλίους
  choice: ndị na-ejide onwe ha
  rationale: Okwu Grik ahụ nwere ike ịpụta izere ịṅụbiga mmanya ókè, ma n'ebe a ọ gbasakwara ịdị nwayọọ na ịchịkwa omume; nkebi a na-enye echiche sara mbara ahụ n'Igbo nkịtị.
- source_word: σεμνούς
  choice: ndị a na-akwanyere ùgwù
  rationale: Ọ na-egosi ịdị ùgwù na omume kwesịrị nsọpụrụ, ọ bụghị naanị ịbụ onye ihu jọrọ njọ ma ọ bụ onye anaghị achị ọchị.
- source_word: σώφρονας
  choice: ndị na-achịkwa onwe ha
  rationale: Ọ na-egosi ezi uche a zụrụ azụ na ikike mmadụ nwere ịchị ọchịchọ na omume ya.
- source_word: ὑγιαίνοντας
  choice: ndị siri ike
  rationale: N'ụzọ nkịtị ọ bụ ịdị mma n'ahụ́; n'ebe a ọ bụ ihe atụ nke ịdị zuru oke ma guzosie ike n'àgwà atọ ndị na-esochi.
- source_word: τῇ πίστει
  choice: n'okwukwe
  rationale: Πίστις na-anabata ma echiche nke okwukwe ma nke ikwesị ntụkwasị obi; a họọrọ okwu a na-ahụkarị maka 'faith,' ebe e debere ihe ọzọ nwere ike ịpụta n'ala ala peeji.
- source_word: τῇ ἀγάπῃ
  choice: n'ịhụnanya
  rationale: Nke a bụ nsụgharị Igbo doro anya ma bụrụkwa nke nkịtị maka ἀγάπη, na-edobekwa nhazi nke àgwà atọ ahụ.
- source_word: τῇ ὑπομονῇ
  choice: n'ịtachi obi
  rationale: Okwu a na-egosi ịnọgide na-eguzosi ike mgbe ihe siri ike; 'ịtachi obi' bụ okwu Igbo dị ndụ ma doo anya maka ntachi obi na nkwụsi ike ahụ.
- source_word: εἶναι
  choice: kwesịrị ịbụ
  rationale: Infinitive a na-adabere n'iwu ma ọ bụ ndụmọdụ sitere n'amaokwu bu ụzọ; 'kwesịrị ịbụ' na-eme ka ike ndụmọdụ ahụ pụta n'Igbo ebumpụta ụwa.
theological_decisions:
- issue: Ihe πίστις pụtara n'usoro àgwà ọma a
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: N'usoro 'okwukwe, ịhụnanya, na ịtachi obi,' πίστις nwere ike izo aka n'ịtụkwasị Chineke obi ma ọ bụ n'ịbụ onye kwesịrị ntụkwasị obi. Isi ederede jiri 'okwukwe,' ma ihe odide ala peeji debere nghọta nke ọzọ ka a ghara imechi mgbagwoju anya dị n'asụsụ mbụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A zere ịkpọ ndị a 'ndị okenye' n'ihi na nke ahụ nwere ike ime ka onye na-agụ ya chee na ọ bụ ọkwa ọchịchị n'ọgbakọ. Nhazi ahịrịokwu ahụ na-edobe usoro àgwà ọma nke Grik, ma jiri nkebi okwu ebumpụta ụwa n'Igbo.
