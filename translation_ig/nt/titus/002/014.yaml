  to: onye nyere onwe ya n’ihi anyị, ka o wee gbapụta anyị ná ndụ megidere iwu niile, meekwa ka otu ndị pụrụ iche nke ya[a] dị ọcha, ndị na-anụ ọkụ n’obi ime ezi ọrụ.
