  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: ig
  text: onye nyere onwe ya n’ihi anyị, ka o wee gbapụta anyị ná ndụ megidere iwu niile, meekwa ka otu ndị pụrụ iche nke ya[a] dị ọcha, ndị na-anụ ọkụ n’obi ime ezi ọrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “otu ndị ọ ji kpọrọ ihe” ma ọ bụ “otu ndị bụ nke ya.” Okwu Grik a sụgharịrị “otu ndị pụrụ iche nke ya” na-echekwa echiche ọgbụgba ndụ nke otu ndị bụ ihe onwunwe pụrụ iche nke ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: nyere onwe ya
  rationale: Nke a na-egosi na o ji aka ya nye onwe ya, n’etinyeghị nkọwa ọzọ na-adịghị n’okwu Grik.
- source_word: ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  rationale: Okwu a na-egosi na o mere ya maka ọdịmma anyị ma na-ahapụkwa obosara echiche nke okwu Grik n’ebughị ụzọ kpebie otu nkọwa kpọmkwem banyere àjà mgbapụta.
- source_word: ἵνα λυτρώσηται
  choice: ka o wee gbapụta
  rationale: “Gbapụta” na-ejigide echiche nke ịtọhapụ mmadụ site n’ịkwụ ụgwọ ma ọ bụ site n’ike nzọpụta, ma bụrụkwa okwu doro anya n’Igbo.
- source_word: ἀπὸ πάσης ἀνομίας
  choice: ná mmebi iwu niile
  rationale: “Mmebi iwu” na-egosi kpọmkwem ọnọdụ ma ọ bụ omume megidere iwu; “niile” na-egosipụta oke zuru ezu nke πάσης.
- source_word: καθαρίσῃ
  choice: mee ka ... dị ọcha
  rationale: Usoro a bụ Igbo nkịtị ma na-egosipụta ime ka ndị ahụ dị ọcha n’ụzọ omume na nke ọgbụgba ndụ.
- source_word: ἑαυτῷ
  choice: nke ya onwe ya
  rationale: E tinyere echiche nke ịbụ nke ya n’ahịrịokwu gbasara ndị ahụ, ka Igbo wee daa nke ọma ma chekwaa echiche nke inwe ha nye onwe ya.
- source_word: λαὸν περιούσιον
  choice: otu ndị nke ya onwe ya
  rationale: Nke a na-echekwa echiche ọgbụgba ndụ nke ndị pụrụ iche bụ nke ya, n’emeghị ka ọ bụrụ naanị na ha dị iche n’ebe ndị ọzọ nọ.
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: ndị na-anụ ọkụ n’obi ime ezi ọrụ
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi ịnụ ọkụ n’obi na itinye onwe mmadụ n’ime ezi omume.
theological_decisions:
- issue: Ike echiche ὑπὲρ ἡμῶν n’onyinye Kraịst nyere onwe ya
  choice: n’ihi anyị
  alternative: n’ọnọdụ anyị
  rationale: “N’ihi anyị” na-egosi na onyinye ahụ bụ maka anyị, ma ọ naghị amanye naanị otu usoro nkọwa banyere otú mgbapụta si arụ ọrụ.
- issue: Echiche ọgbụgba ndụ dị na λαὸν περιούσιον
  choice: otu ndị nke ya onwe ya
  alternative: otu ndị ọ ji kpọrọ ihe; otu ndị pụrụ iche
  rationale: Nhọrọ a na-eme ka o doo anya na ndị ahụ bụ nke ya kpọmkwem, si otú ahụ chekwaa ụda okwu ọgbụgba ndụ nke amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ụdị nkebiokwu njikọ nke Grik (“onye ...”), n’ihi na amaokwu a na-aga n’ihu site n’amaokwu bu ya ụzọ.
