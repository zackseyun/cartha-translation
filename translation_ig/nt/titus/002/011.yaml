  text: Ἐπεφάνη γὰρ ἡ χάρις τοῦ ⸀θεοῦ σωτήριος πᾶσιν ἀνθρώποις
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: ig
  text: N’ihi na amara Chineke, nke na-eweta nzọpụta nye mmadụ niile,[b] apụtala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “amara Chineke apụtala, na-azọpụta mmadụ niile,” ma ọ bụ “amara Chineke apụtala nye mmadụ niile.” Nkọwaaha Grik σωτήριος (“nke na-azọpụta,” “nke na-eweta nzọpụta”) na nkebiokwu πᾶσιν ἀνθρώποις nwere ike ijikọ n’ụzọ dịtụ iche.
    reason: lexical_alternative
  - marker: b
    text: “Mmadụ niile” sụgharịrị okwu Grik ἄνθρωποι, nke na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: apụtala
  rationale: Okwu a na-egosi na amara ahụ apụtawo ma mee ka a mara ya; “apụtala” bụ Igbo dị mfe ma na-egosikwa na ihe ahụ mere nwere mkpa ruo ugbu a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ndụmọdụ ndị bu ya ụzọ site n’inye ihe kpatara ha.
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihu ọma Chineke nke a na-enye n’efu, ma ọ naghị etinye nkọwa ozizi karịrị ihe Grik kwuru.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: N’usoro “amara Chineke,” Igbo na-egosi nke ọma na ọ bụ amara nke Chineke, n’enweghị mkpa ịgbakwunye “sitere n’aka.”
- source_word: σωτήριος
  choice: nke na-ewetara … nzọpụta
  rationale: Nkọwa a na-egosi ike adjective ahụ dị ka ihe na-eweta nzọpụta, ma na-ada nke ọma n’Igbo karịa ịkpọ amara ahụ naanị “nke na-azọpụta.”
- source_word: πᾶσιν ἀνθρώποις
  choice: mmadụ niile
  rationale: “Mmadụ” ebe a metụtara ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke. “Niile” na-edobe obosara okwu Grik ahụ n’enweghị ịkọwa ya dị ka naanị ụdị mmadụ niile.
theological_decisions:
- issue: Oke πᾶσιν ἀνθρώποις n’ihe gbasara nzọpụta
  choice: mmadụ niile
  alternative: ụdị mmadụ niile; nye mmadụ niile
  rationale: Nsụgharị ahụ na-edobe obosara okwu Grik ahụ, ma ọ naghị ekpebi ma ọ pụtara onye ọ bụla n’otu n’otu ma ọ bụ mmadụ si n’òtù na ọnọdụ niile. Ọ naghịkwa ekpebi ozizi kpọmkwem banyere otú onye ọ bụla si enweta nzọpụta ahụ.
- issue: Mmekọrịta σωτήριος na πᾶσιν ἀνθρώποις
  choice: nke na-ewetara mmadụ niile nzọpụta
  alternative: nke na-azọpụta mmadụ niile; apụtala nye mmadụ niile
  rationale: Nhọrọ bụ isi na-ewere σωτήριος dị ka nkọwa amara nke na-eweta nzọpụta, ebe ntụaka ala peeji na-edobe ụzọ ndị ọzọ a pụrụ isi ghọta nhazi okwu Grik ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Nhazi ahịrịokwu ahụ na-eme ka ọ doo anya na σωτήριος na-akọwa amara Chineke, ebe ntụaka ala peeji na-echekwa mgbagwoju anya dị n’otú e nwere ike isi jikọta ya na πᾶσιν ἀνθρώποις.
