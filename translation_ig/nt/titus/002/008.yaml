  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: ig
  text: okwu dị mma[a] nke a na-apụghị ịkatọ[b], ka onye nọ n’akụkụ mmegide[c] wee nwee ihere, ebe ọ na-enweghị ihe ọjọọ ọ bụla ọ ga-ekwu banyere anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “okwu dị mma” ma ọ bụ “ozi dị mma.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “nke na-enweghị ihe a ga-eji taa ya ụta” ma ọ bụ “nke nkatọ na-apụghị iru.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, “onye si n’akụkụ nke ọzọ,” ya bụ, onye mmegide.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: okwu
  rationale: N’ebe a, λόγος na-ezo aka n’ihe Taịtọs na-ekwu na n’ụzọ o si ekwu ya mgbe ọ na-ezi ihe. “Okwu” bụ okwu Igbo sara mbara nke na-edobe ma ọdịnaya ma omume ikwu okwu, n’enweghị ịkọwa ya naanị dị ka otu mkpụrụokwu.
- source_word: ὑγιῆ
  choice: ziri ezi
  rationale: ὑγιής pụtara n'ụzọ nkịtị ihe dị mma n’ahụ, ma n’Akwụkwọ Ozi Ndị Ọzụzụ Atụrụ ọ na-egosi ihe siri ike, dị mma, na-enweghị mmebi n’ozizi ma ọ bụ omume. “Ziri ezi” bụ Igbo eke nke na-ebute echiche ahụ n’enweghị okwu na-adịghị ada ka Igbo.
- source_word: ἀκατάγνωστον
  choice: nke a na-apụghị ịkatọ
  rationale: Nkebiokwu a na-egosi na okwu ahụ adịghị enye ezi ihe ndabere a ga-eji maa ya ikpe ma ọ bụ katọọ ya. Usoro nkebiokwu a doro anya ma bụrụkwa Igbo eke karịa ịtụkọta ọtụtụ nkọwa n’otu ebe.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-egosi ebumnuche ma ọ bụ ihe a tụrụ anya na ọ ga-esi na ndụ na nkuzi dị mma pụta.
- source_word: ὁ ἐξ ἐναντίας
  choice: onye na-emegide anyị
  rationale: Okwu Grik a pụtara onye nọ n’akụkụ mmegide. Nsụgharị a na-ada nke ọma n’Igbo ma jikọta ya n'ụzọ eke na “banyere anyị” nke na-abịa n’ikpeazụ.
- source_word: ἐντραπῇ
  choice: ihere wee mee
  rationale: Ụdị ngwaa a na-egosi na onye mmegide ga-eru n’ihere ma ọ bụ bụrụ onye e mere ihere. “Ihere wee mee” na-edobe ike mmekọrịta mmadụ na omume dị n’okwu ahụ ma ghara ịkpọpụta onye mere ya ihere.
- source_word: μηδὲν ἔχων λέγειν
  choice: ọ na-enweghị ihe ... ọ ga-ekwu
  rationale: Nke a bụ usoro Igbo eke maka echiche nke enweghị ebubo ma ọ bụ okwu ọ bụla a pụrụ ikwu.
- source_word: περὶ ἡμῶν
  choice: banyere anyị
  rationale: A hapụrụ nnọchiaha onye mbụ ọtụtụ dịka ọ dị na Grik, n’agbanyeghị na ndị ọ na-agụnye nwere ike ịbụ Pọl, Taịtọs, na ndị ọzọ so n’ọrụ ahụ.
- source_word: φαῦλον
  choice: ihe ọjọọ
  rationale: φαῦλος n’ebe a na-egosi ihe rụrụ arụ ma ọ bụ ihe kwesịrị nkatọ. “Ihe ọjọọ” na-edobe ibu omume ọma na omume ọjọọ nke okwu Grik ahụ.
theological_decisions:
- issue: Ndị “anyị” dị na περὶ ἡμῶν na-agụnye
  choice: A sụgharịrị ya naanị dịka “banyere anyị.”
  alternative: “Banyere gị,” “banyere anyị bụ Ndị Kraịst,” ma ọ bụ “banyere ozizi anyị.”
  rationale: Grik kwuru onye mbụ ọtụtụ. Ịhapụ ya dịka “anyị” na-ezere ime ka ọ bụrụ naanị Taịtọs ma ọ bụ ịgbasa ya hoo haa ruo n’ebe ọ ga-agụnye Ndị Kraịst niile.
- issue: Ma ἐντραπῇ pụtara ime onye ahụ ihere ka ọ bụ na ihere mere ya
  choice: “Ihere wee mee” na-ahapụ onye ma ọ bụ ihe kpatara ihere ahụ n’ezoghị ọnụ.
  alternative: “Ka e wee mee ya ihere.”
  rationale: Ụdị Grik nwere ike ibu echiche nke ịbụ onye e mere ihere ma ọ bụ iru n’ihere. Nsụgharị a na-echekwa esemokwu ahụ n’enweghị ịkpọpụta onye na-eme ya ihere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “okwu ziri ezi” ka ọ bụrụ okwu eke maka atụ ahụike dị na ὑγιῆ; ihe odide ala ala peeji na-echekwa ụzọ ndị ọzọ e nwere ike isi ghọta λόγον ὑγιῆ. A nọgidere na-eji “anyị” dịka Grik si kwuo, n’enweghị ịgbasa ma ọ bụ ibelata ndị ọ na-agụnye.
