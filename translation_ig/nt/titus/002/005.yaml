  rationale: 'The revision makes two limited, safe improvements: it specifies household work with “n''ụlọ,” and it replaces an imprecise alternative footnote for submission with one that retains the reflexive, relational force of the Greek. It also regularizes the natural expression for kindness as “ndị nwere obi ọma.” No theological system is added, and the wording remains limited to their own husbands as in the source.'
