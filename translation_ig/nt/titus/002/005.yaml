id: TIT.2.5
reference: Titus 2:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: ig
  text: ndị na-ejide onwe ha, ndị dị ọcha, ndị na-arụ ọrụ n'ụlọ[a], ndị nwere obi ọma, ndị na-edo onwe ha n'okpuru di nke ha[b], ka a ghara ikwulu okwu Chineke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị na-arụsi ọrụ ike n'ụlọ” ma ọ bụ “ndị na-elekọta ụlọ.” Okwu Grik a dị ụkọ; ọ na-ezo aka n'itinye aka n'ọrụ ezinụlọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-edobe onwe ha n'okpuru di nke ha.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka a ghara ikwutọ okwu Chineke,” ma ọ bụ “ka a ghara ikwu okwu ọjọọ megide okwu Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώφρονας
  choice: ndị na-ejide onwe ha
  rationale: Nke a na-egosi mmadụ nwere ezi uche ma na-achịkwa ọchịchọ na omume ya; okwu a bụ nke doro ndị Igbo nke oge a anya n'ime ndepụta àgwà ọma.
- source_word: ἁγνάς
  choice: ndị dị ọcha
  rationale: Ọ na-echekwa echiche sara mbara nke ịdị ọcha, karịsịa n'omume, n'ebughị ya naanị n'ihe gbasara mmekọahụ.
- source_word: οἰκουργούς
  choice: ndị na-arụ ọrụ ụlọ[a]
  rationale: Okwu Grik a dị ụkọ ma jikọta ụlọ na ịrụ ọrụ. Nsụgharị a na-egosi itinye aka n'ọrụ na ibu ọrụ ezinụlọ n'emeghị ka ọ pụta na a machibidoro ha ịpụ n'ụlọ.
- source_word: ἀγαθάς
  choice: ndị obiọma
  rationale: N'ime ndepụta àgwà na omume, “ndị obiọma” na-egosi ịdị mma a na-ahụ n'otú e si emeso ndị ọzọ karịa okwu sara mbara naanị dịka “ndị ọma.”
- source_word: ὑποτασσομένας
  choice: ndị na-edo onwe ha n'okpuru
  rationale: Nke a na-echekwa ụdị participle na echiche nke ido onwe n'usoro n'ime mmekọrịta, n'etinyeghị nkọwa ụka ma ọ bụ usoro ozizi karịrị ihe amaokwu ahụ kwuru.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: di nke ha
  rationale: N'ọnọdụ ezinụlọ a, ἀνήρ pụtara di. “Nke ha” na-echekwa ἰδίοις ma na-eme ka o doo anya na okwu a metụtara di ha onwe ha.
- source_word: ἵνα μὴ
  choice: ka a ghara
  rationale: Nke a na-enye ebumnuche nke njikọ Grik ahụ n'ụzọ Igbo dị mfe ma kwekọọ n'asụsụ nkịtị.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a bụ nsụgharị kwụ ọtọ ma bụrụkwa ụzọ Igbo a maara nke ọma isi kwuo ozi ma ọ bụ okwu sitere n'aka Chineke.
- source_word: βλασφημῆται
  choice: ikwulu
  rationale: “Ikwulu” na-agụnye ikwu okwu ọjọọ, ịkatọ, ma ọ bụ ime ihe nsọ ihe ihere; n'ebe a ọ na-egosi nkwutọ a pụrụ iweta n'okwu Chineke.
theological_decisions:
- issue: Ịsụgharị οἰκουργούς n'emeghị ka ọ bụrụ iwu igbochi ụmụ nwanyị ịnọ naanị n'ụlọ
  choice: ndị na-arụ ọrụ ụlọ
  alternative: ndị na-arụsi ọrụ ike n'ụlọ; ndị na-elekọta ụlọ
  rationale: Okwu ahụ na-elekwasị anya n'ọrụ na ibu ọrụ ezinụlọ. Nsụgharị a anaghị agbakwụnye echiche nke mmechi ma ọ bụ mmachibido nke okwu Grik ahụ ekwughị kpọmkwem.
- issue: Ịsụgharị ὑποτασσομένας n'ichekwa usoro mmekọrịta n'alụmdi na nwunye n'etinyeghị ozizi otu ụka
  choice: ndị na-edo onwe ha n'okpuru di nke ha
  alternative: ndị na-anọ n'okpuru di nke ha
  rationale: Nsụgharị a na-echekwa echiche nke ido onwe n'usoro na ọdịdị omume na-aga n'ihu, ma na-amachikwa ya n'ebe di ha onwe ha nọ dịka Grik si kwuo.
- issue: Ihe βλασφημῆται pụtara mgbe okwu Chineke bụ ihe a na-ekwu okwu ọjọọ megide
  choice: ka a ghara ikwulu okwu Chineke
  alternative: ka a ghara ikwutọ okwu Chineke; ka a ghara ikwu okwu ọjọọ megide okwu Chineke
  rationale: “Ikwulu” na-echekwa ịdị arọ nke okwu Grik ahụ, ma ihe odide ala peeji na-akọwa na n'ebe a ọ gụnyere nkwutọ ma ọ bụ ikwu okwu ọjọọ megide ozi Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere amaokwu ahụ dịka ndepụta àgwà na-aga n'ihu site n'iji “ndị...” mee otu usoro. A zere okwu ga-egosi na οἰκουργούς pụtara ịnọchibido n'ụlọ, ma e chekwara ike na oke mmekọrịta nke ὑποτασσομένας na τοῖς ἰδίοις ἀνδράσιν.
