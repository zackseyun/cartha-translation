id: TIT.2.15
reference: Titus 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: ig
  text: Kwuo ihe ndị a, gbaakwa ndị mmadụ ume, baakwa ha mba n'ikike zuru ezu. Ekwela ka onye ọ bụla leghara gị anya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “leda gị anya” ma ọ bụ “were gị dị ka onye na-enweghị ihe ọ pụtara.”
    reason: Okwu Grik περιφρονέω nwere ike ịpụta ileghara mmadụ anya, ileda ya anya, ma ọ bụ were ya dị ka onye na-enweghị uru.
lexical_decisions:
- source_word: Ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-arụtụ aka n'iwu na nkuzi ndị bu ụzọ n'isiakwụkwọ a, n'emeghị ka ihe ọ na-ezo aka na ya dị warara karịa Grik.
- source_word: λάλει
  choice: Kwuo
  rationale: Ọ bụ iwu ka Taịtọs na-ekwupụta ihe ndị a; “kwuo” na-edobe nghọta sara mbara nke okwu Grik n'emeghị ya naanị “kụzie.”
- source_word: παρακάλει
  choice: gbaakwa ndị mmadụ ume
  rationale: Nkebiokwu a bụ Igbo doro anya nke na-egosi ịgba ume na ịkpọku mmadụ ka o mee ihe kwesịrị ekwesị. E tinyere “ndị mmadụ” dị ka mmejuputa ihe e kwuru n'ụzọ doro anya n'Igbo, ebe ihe a na-ekwu maka ya pụtara ìhè site n'ọnọdụ okwu ahụ.
- source_word: ἔλεγχε
  choice: baakwa ha mba
  rationale: Ọ na-enye ike nke ikpughe ihe ọjọọ na ịdọ onye mere ya aka ná ntị n'ọnọdụ nlekọta ọgbakọ.
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: n'ikike zuru ezu
  rationale: Nke a na-egosi na a ga-eji ibu ikike zuru oke rụọ ọrụ ndị ahụ, ọ bụghị nanị ikwu okwu n'olu iwu.
- source_word: μηδείς
  choice: onye ọ bụla
  rationale: N'ime iwu na-adịghị mma “Ekwela ka...,” nke a bụ ụzọ Igbo si akọwa “ọ dịghị onye” n'ụzọ eke.
- source_word: σου
  choice: gị
  rationale: Ọ bụ onye a na-eleghara anya; nnọchiaha Igbo a na-enye nghọta ahụ kpọmkwem.
- source_word: περιφρονείτω
  choice: leghara gị anya
  rationale: Ọ na-egosi ile mmadụ anya dị ka onye na-enweghị ihe ọ pụtara ma ọ bụ ịghara ịṅa ya ntị. Isi ederede na-eji okwu Igbo doro anya, ebe ihe ọzọ nwere ike ịbụ “leda gị anya” dị n'ala peeji.
theological_decisions:
- issue: Ike ọrụ Taịtọs n'okwu μετὰ πάσης ἐπιταγῆς
  choice: Taịtọs ga-ekwu, gbaa ume, ma baa mba n'ikike zuru ezu.
  alternative: A pụrụ ịghọta ya dị ka naanị ikwu okwu n'olu na-enye iwu, ma ọ bụ dị ka ikike dị naanị n'ozi ahụ.
  rationale: Nkebiokwu ahụ na-akọwa otú a ga-esi mee iwu atọ ahụ. “N'ikike zuru ezu” na-edobe ibu ọrụ na ikike e nyere ya, ma ọ naghị eme ka ikike ahụ bụrụ nke onwe ya na-enweghị oke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Njikọ “-kwa” na-ejikọta iwu atọ ahụ n'ụzọ eke, ebe “n'ikike zuru ezu” na-ezere ụda ochie ma na-edobe ike okwu Grik.
