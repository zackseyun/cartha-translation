  text: περὶ πάντα σεαυτὸν παρεχόμενος τύπον καλῶν ἔργων, ἐν τῇ διδασκαλίᾳ ⸀ἀφθορίαν, ⸀σεμνότητα,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/007.yaml
  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: ig
  text: N'ihe niile[a], gosi onwe gị dị ka ihe nlereanya[b] nke ọrụ ọma; n'izi ihe gị[c], gosi enweghị nrụrụ aka[d] na ịdị ùgwù[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘N'ụzọ niile,’ ‘n'ihe niile,’ ma ọ bụ, n'ụzọ nkịtị karịa, ‘banyere ihe niile.’ N'ebe a, o yikarịrị ka ọ na-egosi obosara omume mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ ‘ụkpụrụ’ ma ọ bụ ‘ihe atụ.’
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ ‘n'ozizi ahụ’ ma ọ bụ ‘n'ozizi.’
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ ‘ịdị ọcha’ ma ọ bụ ‘iguzosi ike n'ezi ihe.’ Okwu Grik ahụ na-ekwu n'ụzọ sara mbara maka enweghị mmebi ma ọ bụ nrụrụ aka.
    reason: lexical_alternative
  - marker: e
    text: Ma ọ bụ ‘ịdị njọ n'omume’ ma ọ bụ ‘ịdị kwesịrị nsọpụrụ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ πάντα
  choice: N'ụzọ niile
  rationale: Nkebiokwu a na-arụ ọrụ dị ka nkọwa ụzọ e si eme ihe, na-egosi na omume Taịtọs niile kwesịrị ịbụ ihe nlereanya. Ọ bụ Igbo sitere n'okike ma na-edobe obosara okwu Grik ahụ.
- source_word: σεαυτὸν παρεχόμενος
  choice: gosi onwe gị
  rationale: Nke a na-edobe ike nnọchiaha onwe onye dị na Grik ma na-egosi na Taịtọs ga-eme ka ndụ ya pụta ìhè nye ndị ọzọ.
- source_word: τύπον
  choice: ihe nlereanya
  rationale: N'ebe a, okwu ahụ pụtara onye ma ọ bụ ụkpụrụ ndị ọzọ kwesịrị iṅomi. ‘Ihe nlereanya’ doro anya n'Igbo nke oge a.
- source_word: καλῶν ἔργων
  choice: n'ọrụ ọma
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke na-ejigide echiche omume ọma n'enweghị ịgbakwụnye nkọwa ozizi ọzọ.
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: n'izi ihe gị
  rationale: Ọnọdụ gbara ya gburugburu na-ekwu maka ọrụ Taịtọs nke izi ihe. Nsụgharị a bụ nke nkịtị ma doo anya karịa okwu ụka pụrụ iche.
- source_word: ἀφθορίαν
  choice: ịdị ọcha
  rationale: Okwu Grik ahụ na-egosi ihe a na-emerụghị emerụ ma ọ bụ ihe na-enweghị ntụpọ. N'ebe a, ‘ịdị ọcha’ na-ekwupụta ịdị ọcha ma ọ bụ izu oke nke izi ihe n'Igbo sitere n'okike, ebe ndetu na-edobe nhọrọ ‘iguzosi ike n'ezi ihe.’
- source_word: σεμνότητα
  choice: ịdị ùgwù
  rationale: Okwu ahụ na-egosi ịdị arọ na omume kwesịrị nsọpụrụ. ‘Ịdị ùgwù’ na-ewepụta nke a n'ụzọ dị mfe nghọta ma dịkwa ebube.
theological_decisions:
- issue: Ma a ga-eji okwu ụka pụrụ iche sụgharịa διδασκαλία
  choice: E ji ‘n'izi ihe gị’ mee ya.
  alternative: n'ozizi ahụ; n'ozizi
  rationale: Okwu ahụ nwere ike ịpụta ihe a na-akụzi ma ọ bụ ọrụ izi ihe. N'ebe a, ịkpọ ya ọrụ Taịtọs nke izi ihe bụ ihe sitere n'okike, ma ndetu na-edobe obosara okwu Grik ahụ.
- issue: Otú a ga-esi kọwaa ἀφθορίαν n'ihe metụtara izi ihe
  choice: E ji ‘ịdị ọcha’ mee ya.
  alternative: iguzosi ike n'ezi ihe; ịbụ ihe a na-emerụghị emerụ
  rationale: ‘Ịdị ọcha’ bụ okwu Igbo dị mfe nke na-edobe echiche nke enweghị mmebi ma ọ bụ ntụpọ, n'emeghị ka okwu ahụ bụrụ naanị ezi omume nke onye ma ọ bụ naanị ọdịnaya ozizi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ebube. Ahịrịokwu ahụ ji iwu ‘gosi’ na ‘nwee’ mee ka ike ndụmọdụ dị na participle na accusatives nke Grik doo anya n'Igbo, n'ọnọdụ nke ndụmọdụ Pọl na-enye Taịtọs. A zere okwu ụka siri ike ebe okwu nkịtị zuru ezu.
