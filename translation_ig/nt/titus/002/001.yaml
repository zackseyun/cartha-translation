id: TIT.2.1
reference: Titus 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σὺ δὲ λάλει ἃ πρέπει τῇ ὑγιαινούσῃ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/001.yaml
  text: But as for you[a], speak the things that are fitting for sound teaching.
translation:
  language: ig
  text: Ma gị onwe gị, kwuo ihe ndị dabara n’ozizi ziri ezi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σὺ
  choice: gị onwe gị
  rationale: Nnọchiaha ahụ pụtara ìhè n'asụsụ Grik ma na-emesi ọdịiche dị n'etiti Taịtọs na ndị nkuzi ụgha a kpọtụrụ aha na mbụ ike.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche n'etiti ihe e kwuru banyere ndị nkuzi ụgha na iwu a na-enye Taịtọs.
- source_word: λάλει
  choice: kwuo
  rationale: Nhọrọ a na-edobe iwu sara mbara nke ikwu okwu, n'emeghị ka ọ bụrụ naanị izi ihe n'usoro iwu.
- source_word: ἃ
  choice: ihe ndị
  rationale: Ọ na-egosipụta ọdịdị ọtụtụ nke nnọchiaha njikọ ahụ n'ụzọ Igbo dị mfe ma doo anya.
- source_word: πρέπει
  choice: kwesịrị ekwesị maka
  rationale: Ọ na-egosipụta ihe dabara adaba ma ọ bụ kwekọrọ n'ụdị ozizi ahụ.
- source_word: ὑγιαινούσῃ
  choice: zuru ezi
  rationale: N'ọnọdụ a, okwu ahụ na-eji echiche ahụike mee ihe atụ banyere ozizi na-adịghị emerụ emerụ ma bụrụ nke a pụrụ ịtụkwasị obi; 'zuru ezi' bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: διδασκαλίᾳ
  choice: ozizi
  rationale: Ọ na-ekpuchi ma ihe a na-akụzi ma ọrụ izi ihe, ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
theological_decisions:
- issue: Nsụgharị τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: ozizi zuru ezi
  alternative: ozizi dị mma; ozizi na-enye ahụike
  rationale: Nhọrọ a na-echekwa echiche nke ozizi a pụrụ ịtụkwasị obi na nke na-adịghị emerụ emerụ, n'enweghị itinye nkọwa otu ụka pụrụ iche. A naghị eji 'na-enye ahụike' n'ihi na ọ pụrụ ime ka onye na-agụ ya chee na ọ bụ ahụike anụ ahụ ka a na-ekwu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji 'Ma gị onwe gị' chekwaa nkwusi ike na ọdịiche nke Σὺ δὲ; e jighị okwu nkà mmụta okpukpe siri ike ebe okwu nkịtị zuru.
