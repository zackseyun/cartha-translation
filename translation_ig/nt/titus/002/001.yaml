    rationale: “Zuru ezi” can mean entirely or completely correct and does not naturally carry the source’s metaphorical sense of sound/healthy, reliable teaching. “Ozizi ziri ezi” is the more idiomatic Standard Igbo expression and preserves the intended doctrinal-quality sense.
