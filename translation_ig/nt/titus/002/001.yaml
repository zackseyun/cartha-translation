  source_fidelity: 'The contrastive force of Σὺ δέ is well represented by “Ma gị onwe gị,” and “kwuo ihe ndị” adequately conveys the command and the plural relative pronoun. However, “ozizi zuru ezi” does not best render ὑγιαινούσῃ διδασκαλίᾳ: “zuru ezi” commonly suggests completeness or being wholly/certainly correct, rather than the established metaphor of sound, reliable teaching.'
  naturalness: “Ma gị onwe gị, kwuo ihe ndị dabara n’ozizi ziri ezi” is natural, contemporary Standard Igbo. “Dabara n’” idiomatically expresses what is appropriate to or consistent with the teaching.
  terminology: Use “ozizi ziri ezi” for sound teaching. It is clear Igbo ecclesial and general usage for teaching that is right/reliable, without importing a denominational interpretation. No footnote is needed in Igbo for the English pronoun note, since the contrast is directly expressed.
