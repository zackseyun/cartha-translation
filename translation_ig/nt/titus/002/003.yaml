  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: ig
  text: Ka ụmụ nwanyị ndị agadi, n’otu aka ahụ, bụrụ ndị omume ha kwesịrị ihe dị nsọ, ndị na-adịghị ekwutọ mmadụ, ndị mmanya dị ukwuu na-adịghị eme ohu[a], ndị na-akụzi ihe ọma,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị riri ọtụtụ mmanya ahụ.” N’asụsụ Grik, ihe e kwuru kpọmkwem bụ ndị “a meworo ohu nye mmanya dị ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: ụmụ nwanyị ndị agadi
  rationale: Ọ na-ezo aka kpọmkwem n’ụmụ nwanyị kara nká, dịka ntụziaka e nyere ndị ikom agadi n’amaokwu bu ụzọ.
- source_word: ὡσαύτως
  choice: sikwa otu a
  rationale: Ọ na-ejikọta ndụmọdụ a na nke e nyere ndị ikom agadi n’amaokwu bu ụzọ.
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: na-akpa àgwà kwesịrị ekwesị n’ihu Chineke
  rationale: Nkebiokwu ahụ na-ekwu maka omume ma ọ bụ ọnọdụ mmadụ nke dabara n’ihe dị nsọ; nsụgharị a bụ nke Igbo doro anya ma dị ugwu.
- source_word: μὴ διαβόλους
  choice: ka ha ghara ịbụ ndị nkwutọ
  rationale: N’ebe a διάβολος na-akọwa ndị na-ekwutọ mmadụ, ọ bụghị Ekwensu n’onwe ya.
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: ka ha ghara ịbụkwa ndị e mere ohu nye ọtụtụ mmanya
  rationale: Ọ na-edowe ihe atụ nke ịbụ ohu dị na perfect passive participle δεδουλωμένας, kama ịgbanwe ya naanị ka ọ bụrụ ịṅụbiga mmanya ókè.
- source_word: καλοδιδασκάλους
  choice: ndị na-akụzi ihe ọma
  rationale: Ọ na-egosi na ihe ha na-akụzi bụ ihe ọma, ọ bụghị naanị na ha maara nka izi ihe.
theological_decisions:
- issue: Ichekwa ihe atụ nke ịbụ ohu n’okwu banyere mmanya
  choice: ndị e mere ohu nye ọtụtụ mmanya
  alternative: ndị mmanya riri ahụ́
  rationale: Asụsụ Grik na-egosi ịbụ onye mmanya chịrị dịka ohu; idebe ihe atụ a na-echekwa ike na esemokwu nke okwu mbụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. A họọrọ “n’ihu Chineke” iji mee ka echiche ἱεροπρεπεῖς—àgwà dabara n’ihe dị nsọ—pụta nke ọma n’Igbo, n’enweghị itinye nkwenkwe ụka pụrụ iche.
