  source_fidelity: 'A ghọtara akụkụ ndị bụ isi nke Grik nke ọma: ụmụ nwanyị ndị agadi, njikọ ya na ntụziaka bu ụzọ, nkwutọ, ịbụ ohu nye mmanya, na izi ihe ọma. Ma “n’ihu Chineke” anaghị apụta n’ederede Grik; ἱεροπρεπεῖς na-ekwu maka àgwà dabara n’ihe dị nsọ, ọ bụghị ime ihe n’ihu Chineke kpọmkwem. Ọzọkwa, “kama” na-etinye mmegide nke isi mmalite enweghị.'
