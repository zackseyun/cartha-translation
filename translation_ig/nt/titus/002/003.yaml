  to: Ka ụmụ nwanyị ndị agadi, n’otu aka ahụ, bụrụ ndị omume ha kwesịrị ihe dị nsọ, ndị na-adịghị ekwutọ mmadụ, ndị mmanya dị ukwuu na-adịghị eme ohu[a], ndị na-akụzi ihe ọma,
