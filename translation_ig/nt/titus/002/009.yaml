  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: ig
  text: Ndị ohu kwesịrị ido onwe ha n'okpuru ndị nwe ha n'ihe niile, bụrụ ndị na-atọ ha ụtọ, ghara ịza ha okwu azụ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ghara ịgbagha ha” ma ọ bụ “ghara ikwu okwu megide ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: Ndị ohu
  rationale: N'ọnọdụ iwu ezinụlọ a, okwu ahụ na-ezo aka n ndị nọ n'ọnọdụ ịbụ ihe onwunwe na n'okpuru ikike ndị nwe ha; “ndị ohu” na-egosipụta ezi ọnọdụ mmekọrịta ahụ karịa “ndị na-eje ozi.”
- source_word: ἰδίοις δεσπόταις
  choice: ndị nwe ha
  rationale: δεσπότης n'ebe a pụtara onye nwere ohu ma na-achị ya; “ndị nwe ha” bụ okwu Igbo doro anya nke na-egosikwa ἰδίοις, ya bụ, ndị nwe ha kpọmkwem.
- source_word: ὑποτάσσεσθαι
  choice: ga-edo onwe ha n'okpuru
  rationale: Nke a na-egosipụta omume nke mmadụ ido onwe ya n'okpuru ikike onye ọzọ, ma na-eburu ike ndụmọdụ/iwu nke ahịrịokwu ahụ.
- source_word: ἐν πᾶσιν
  choice: n'ihe niile
  rationale: Ọ na-echekwa obosara okwu Grik ahụ n'ụzọ Igbo na-ada nke ọma.
- source_word: εὐαρέστους εἶναι
  choice: na-eme ihe ga-atọ ha ụtọ
  rationale: N'Igbo nkịtị, nke a na-ekwupụta ịbụ ndị na-amasị ndị nwe ha site n'omume karịa nsụgharị kpọmkwem nke nwere ike ịda mgbagwoju anya.
- source_word: μὴ ἀντιλέγοντας
  choice: ghara ịza ha okwu azụ
  rationale: ἀντιλέγω nwere ike ịpụta ikwu megide, ịgbagha, ma ọ bụ ịza okwu azụ. N'ọnọdụ a, “ịza ha okwu azụ” na-egosipụta mmegide ọnụ e bu n'uche.
theological_decisions:
- issue: Nsụgharị δοῦλος n'ọnọdụ iwu ezinụlọ
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: Ebe e jikọtara ha na δεσπόταις, ọnọdụ ịbụ ohu dị mkpa. Nhọrọ a anaghị akwado usoro ịgba ohu; ọ na-akọwa ọnọdụ ọha mmadụ nke ihe odide ahụ na-ekwu banyere ya.
- issue: Oke okwu ἐν πᾶσιν
  choice: n'ihe niile
  alternative: n'akụkụ niile
  rationale: E debeghị ihe mgbochi na ederede Grik n'onwe ya, ya mere nsụgharị ahụ na-echekwa obosara na esemokwu okwu ahụ kama ịgbakwunye nkọwa na-adịghị na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji “ndị ohu” chekwaa ọnọdụ mmekọrịta akụkọ ihe mere eme ahụ n'enweghị ime ka ọ dị nro. E tinyere naanị otu akara nkọwa ụkwụ n'ahụ ederede, kwekọrọ na ndepụta nkọwa ụkwụ.
