  text: so that they may train the younger women to be loving toward their husbands and loving toward their children[c][b][a],
translation:
  language: ig
  text: ka ha wee kuziere[a] ndị inyom ndị ka na-eto eto[b] ka ha bụrụ ndị na-ahụ di ha n’anya na ụmụ ha n’anya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dụọ ha ọdụ,” “zụlite ha,” ma ọ bụ “kụziere ha ka ha nwee uche ziri ezi.” Ngwaa Grik ahụ nwere echiche nke ịdụ mmadụ ọdụ ma ọ bụ ịzụ ya ka o nwee ezi uche na omume kwesịrị ekwesị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị inyom na-eto eto.” Grik kwuru n’ụzọ nkịtị, “ndị ka na-eto eto [ndị inyom],” n’ọdịiche na ndị inyom ndị okenye a kpọtụrụ aha n’okwu gbara ya gburugburu.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka ha hụ di ha n’anya, hụkwa ụmụ ha n’anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ha wee
  rationale: Na-egosi nzube ma ọ bụ ihe a chọrọ ka o si na ya pụta; okwu a bụ ụzọ Igbo e ji ekwu ya nke ọma.
- source_word: σωφρονίζωσι
  choice: kuziere
  rationale: Ngwaa a nwere echiche nke ịdụ mmadụ ọdụ, ịzụ ya, ma ọ bụ iduga ya n’omume nwere uche. “Kuziere” dabara n’ọrụ ụmụ nwanyị ndị okenye n’ebe ndị na-eto eto nọ, ebe nkọwa ala peeji na-edebe obosara ihe okwu Grik ahụ pụtara.
- source_word: τὰς νέας
  choice: ụmụ nwanyị ndị ka na-eto eto
  rationale: Ọ bụ adjective feminine plural e ji dochie aha, ma ọ na-arụtụ aka n’ụmụ nwanyị ndị ka na-eto eto n’ọdịiche na ndị okenye a kpọtụrụ aha n’okwu gbara ya gburugburu.
- source_word: φιλάνδρους
  choice: ndị hụrụ di ha ... n’anya
  rationale: Na-egosi ịhụ di mmadụ n’anya; e mere ya ka ọ bụrụ ahịrịokwu dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: εἶναι
  choice: ka ha bụrụ
  rationale: Na-emejupụta ngwaa bu ya ụzọ ma na-egosi ụdị mmadụ a ga-akụziri ndị nwanyị ahụ ịbụ.
- source_word: φιλοτέκνους
  choice: ndị hụrụ ... ụmụ ha n’anya
  rationale: Na-egosi ịhụ ụmụ mmadụ n’anya; ejikọtara ya na φιλάνδρους n’usoro yiri ibe ya dịka ọ dị na Grik.
theological_decisions:
- issue: Ókè ndị okwu “ụmụ nwanyị ndị ka na-eto eto” na-ezo aka na ha n’ọnọdụ ndụ ezinụlọ
  choice: A sụgharịrị ya dịka ụmụ nwanyị ndị ka na-eto eto, n’emeghị ka ọ bụrụ naanị “ndị nwunye na-eto eto.”
  alternative: ụmụ nwunye ndị ka na-eto eto
  rationale: Grik kwuru ụmụ nwanyị ndị ka na-eto eto, ọ bụghị “ndị nwunye” kpọmkwem, ọ bụ ezie na okwu banyere di na ụmụ na-egosi ọnọdụ ezinụlọ nke amaokwu a na-ekwu maka ya. Nsụgharị ahụ anaghị eme ka okwu ahụ dị warara karịa isi mmalite, ọ naghịkwa eme ya ka ọ bụrụ nkọwa zuru ezu banyere ọrụ ụmụ nwanyị niile.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ “ụmụ nwanyị ndị ka na-eto eto” iji chekwaa ọdịiche dị n’etiti νέας na ụmụ nwanyị ndị okenye n’okwu gbara ya gburugburu. E tinyere akara nkọwa ala peeji niile n’ahịrị isi n’usoro [a][b][c].
