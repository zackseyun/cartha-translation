  text: Τοὺς νεωτέρους ὡσαύτως παρακάλει σωφρονεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/006.yaml
  text: Likewise[b][a], urge the younger men to be self-controlled.
translation:
  language: ig
  text: N’otu aka ahụ, gbaakwa ụmụ okorobịa ume ka ha nwee njide onwe ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ha nwee ezi uche,” ma ọ bụ “ka uche ha dị mma ma ha na-achị onwe ha.” Okwu Grik ahụ na-emesi ezi mkpebi na njide onwe ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: ụmụ okorobịa
  rationale: Ọdịdị okwu Grik a bụ nke nwoke, ọtụtụ, ma n’usoro ndụmọdụ ndị gbara amaokwu a gburugburu ọ na-ezo aka kpọmkwem n’ụmụ nwoke ndị na-eto eto, ọ bụghị ndị ntorobịa niile.
- source_word: ὡσαύτως
  choice: N’otu aka ahụ
  rationale: Nke a na-ejikọta ndụmọdụ a na ndụmọdụ ndị bu ya ụzọ ma na-egosipụta usoro yiri ibe ya n'ụzọ Igbo dị mfe ma kwụ ọtọ.
- source_word: παρακάλει
  choice: gbaakwa ... ume
  rationale: Iwu a na-agwa Taịtọs ka ọ nọgide na-agba ha ume ma na-adụ ha ọdụ. “Gbaa ume” na-enye ike arịrịọ na ndụmọdụ ahụ n’asụsụ Igbo nke oge a.
- source_word: σωφρονεῖν
  choice: ka ha nwee njide onwe ha
  rationale: Okwu a gụnyere ezi uche, ịchị onwe onye, na omume a haziri nke ọma. “Inwe njide onwe” na-egosipụta isi echiche ahụ n'ụzọ ndị nkịtị ga-aghọta.
theological_decisions:
- issue: Ndị a na-ekwu maka ha n’okwu νεωτέρους
  choice: ụmụ okorobịa, ya bụ ụmụ nwoke ndị na-eto eto
  alternative: ndị ntorobịa n’ozuzu ha
  rationale: N’ihi na Grik ji ụdị okwu nwoke ọtụtụ, usoro okwu gbara ya gburugburu na-ekewakwa ndị mmadụ dịka afọ ndụ na mmekọahụ, nsụgharị ahụ debere ntụaka kpọmkwem nye ụmụ nwoke ndị na-eto eto.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ụmụ okorobịa” na-edebe ntụaka nwoke nke Grik; “nwee njide onwe ha” na-enye echiche sara mbara nke σωφρονεῖν n’enweghị ịgbakwunye nkọwa okpukpe pụrụ iche.
