id: TIT.3.2
reference: Titus 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: ig
  text: ka ha ghara ikwutọ onye ọ bụla[a], ka ha ghara ịbụ ndị na-ese okwu[b], ka ha bụrụ ndị dị nwayọọ n’imeso ndị ọzọ, na-egosikwa mmadụ niile obi umeala zuru oke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka ha ghara ikwu okwu ọjọọ megide onye ọ bụla.” Okwu Grik ahụ nwere ike ịgụnye okwu mkparị sara mbara karịa nkwutọ nkịtị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka ha bụrụ ndị udo.” Okwu Grik ahụ pụtara ndị na-adịghị achọ ọgụ ma ọ bụ esemokwu.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “na-egosikwa mmadụ niile ịdị nwayọọ zuru oke.” πραΰτης na-ezo aka n’obi umeala na ịdị nwayọọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα
  choice: onye ọ bụla
  rationale: N’usoro okwu a, μηδένα bụ onye omume βλασφημεῖν metụtara. Mgbe e tinyere ya n’ahịrịokwu na-adịghị mma, “onye ọ bụla” na-egosi n’ụzọ nkịtị na iwu a metụtara mmadụ niile n’enweghị onye e wepụrụ.
- source_word: βλασφημεῖν
  choice: ikwutọ
  rationale: N’ebe a, okwu ahụ gbasara okwu ọjọọ a na-ekwu megide mmadụ, ọ bụghị nkwulu megide Chineke. “Ikwutọ” dị nkenke ma doo anya, ebe nkọwa ala peeji na-echekwa echiche sara mbara nke ikwu okwu ọjọọ ma ọ bụ mkparị.
- source_word: ἀμάχους εἶναι
  choice: ka ha ghara ịbụ ndị na-ese okwu
  rationale: ἀμάχους na-akọwa ndị na-adịghị achọ ọgụ ma ọ bụ esemokwu. Nsụgharị a na-echekwa ọdịdị nkwụsị nke okwu Grik ma bụrụkwa Igbo nkịtị.
- source_word: ἐπιεικεῖς
  choice: ka ha na-echebara ndị ọzọ echiche
  rationale: ἐπιεικής nwere echiche nke ịdị nwayọọ, inwe ezi uche, ịhapụ isi ike, na imere ndị ọzọ ebere. Ahịrịokwu a na-enye echiche ahụ n’Igbo doro anya ma na-eme ka ọ dị iche na πραΰτης nke na-esochi.
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: na-egosikwa ... ịdị nwayọọ n’ụzọ zuru ezu
  rationale: ἐνδεικνυμένους bụ igosi àgwà ahụ n’omume; πᾶσαν na-emesi ịdị ukwuu na izu oke ya ike; πραΰτης bụ ịdị nwayọọ nke na-enweghị mpako ma ọ bụ ike ike.
- source_word: πρὸς πάντας ἀνθρώπους
  choice: mmadụ niile
  rationale: πρός na-egosi ndị a na-emeso àgwà ahụ, ebe πάντας ἀνθρώπους gụnyere mmadụ niile, ọ bụghị naanị ụmụ nwoke.
theological_decisions:
- issue: Ma ἀνθρώπους ọ̀ na-ezo aka naanị n’ụmụ nwoke
  choice: mmadụ niile
  alternative: ụmụ nwoke niile
  rationale: N’ebe a, ἀνθρώπους bụ aha izugbe maka mmadụ niile. “Mmadụ niile” na-echekwa oke iwu ahụ n’enweghị ime ka ọ dị ka ọ bụ naanị nwoke ka e kwuru maka ya.
- issue: Ịmata ọdịiche dị n’etiti ἐπιεικεῖς na πραΰτητα
  choice: “na-echebara ndị ọzọ echiche” maka ἐπιεικεῖς; “ịdị nwayọọ” maka πραΰτητα
  alternative: iji “ịdị nwayọọ” maka ha abụọ
  rationale: Okwu abụọ ahụ nwere mpaghara echiche na-ejikọta, ma ha abụghị otu okwu. Nsụgharị a na-echekwa ọdịiche ahụ n’enweghị itinye nkọwa okpukpe pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere “ka ha” iji mee ka usoro ndụmọdụ nke infinitive ndị Grik, nke na-adabere n’iwu dị n’amaokwu gara aga, bụrụ nke nkịtị n’Igbo. E zere okwu ụka pụrụ iche na nkọwa nke ga-emechi obosara echiche okwu Grik.
