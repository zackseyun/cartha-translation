  to: ka ha ghara ikwutọ onye ọ bụla[a], ka ha ghara ịbụ ndị na-ese okwu[b], ka ha bụrụ ndị dị nwayọọ n’imeso ndị ọzọ, na-egosikwa mmadụ niile obi umeala zuru oke[c].
  rationale: The revision makes the rendering of ἐπιεικεῖς more direct while preserving its interpersonal ethical force. It renders πραΰτης with the established Igbo expression “obi umeala,” whose accompanying footnote explicitly preserves the alternative “ịdị nwayọọ.” The prohibition against quarrelling, the broader nuance of βλασφημεῖν, and the inclusive scope toward all people remain intact. Footnote markers are in ascending order and each is anchored once.
