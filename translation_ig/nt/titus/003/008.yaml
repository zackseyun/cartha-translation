id: TIT.3.8
reference: Titus 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: ig
  text: 'Okwu a bụ nke a pụrụ ịtụkwasị obi, ọchọkwara m ka i jiri nkwuwa okwu kwusie ike banyere ihe ndị a[a], ka ndị kweere Chineke[b] lezie anya n’ịrara onwe ha nye ịrụ ezi ọrụ. Ihe ndị a dị mma, bakwaara ndị mmadụ uru.


    [a] A pụkwara ịsụgharị ya, “ka i sie ọnwụ banyere ihe ndị a,” ma ọ bụ “ka i jiri obi ike kwupụta ihe ndị a.”


    [b] A pụkwara ịsụgharị ya, “ndị kwere na Chineke,” ma ọ bụ “ndị tụkwasịrị Chineke obi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka i sie ọnwụ banyere ihe ndị a,” ma ọ bụ “ka i jiri obi ike kwupụta ihe ndị a.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị kwere na Chineke,” ma ọ bụ “ndị tụkwasịrị Chineke obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Okwu a bụ nke a pụrụ ịtụkwasị obi
  rationale: 'Nke a na-egosipụta usoro okwu a na-ahụ n’akwụkwọ ozi ndị a: λόγος na-arụtụ aka n’ozi ma ọ bụ okwu e kwuru tupu ya, ebe πιστός na-egosi na e kwesịrị ịtụkwasị ya obi.'
- source_word: περὶ τούτων
  choice: ihe ndị a
  rationale: Ntụgharị a na-ejikọta iwu ahụ na ihe ndị a kọwara tupu amaokwu a, ma na-adịkwa mfe nghọta n’Igbo.
- source_word: βούλομαί σε
  choice: Achọrọ m ka i
  rationale: Ọ na-egosipụta ọchịchọ na ntụziaka onye dere akwụkwọ ahụ n’Igbo nke oge a.
- source_word: διαβεβαιοῦσθαι
  choice: jiri nkwuwa okwu mesie ... ike
  rationale: Ngwaa ahụ pụtara ikwupụta ma ọ bụ isi ọnwụ n’ihe n’ụzọ siri ike na nke obi siri ike; okwu Igbo a na-edobe ma nkwenye ma ike dị na ya.
- source_word: ἵνα φροντίζωσιν
  choice: ka ... lezie anya
  rationale: Ọ na-egosipụta ichebara ihe echiche nke ọma na ilezi anya ka e mee ya, ọ bụghị naanị ịkpachara anya n’ihi ihe ize ndụ.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: n’ịrara onwe ha nye ịrụ ezi ọrụ
  rationale: N’ebe a, προΐστασθαι nwere echiche nke itinye onwe mmadụ n’ọrụ ma nọgide na-eme ya, ọ bụghị nanị idu ndị ọzọ n’ọrụ ahụ.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: ndị kweere Chineke
  rationale: Nke a na-edobe njikọ kpọmkwem nke πιστεύω na dative θεῷ, tinyere echiche nke ndị bịara ikwere ma nọgide n’okwukwe ahụ.
- source_word: καλὰ καὶ ὠφέλιμα
  choice: dị mma, bakwaara ... uru
  rationale: Nke a na-edobe ma ịdị mma nke ihe ndị ahụ ma uru ha na-abara mmadụ.
- source_word: τοῖς ἀνθρώποις
  choice: ndị mmadụ
  rationale: ἀνθρώποις na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ikwere na ezi ọrụ
  choice: E debere ikwere Chineke tupu ịrara onwe nye ezi ọrụ.
  alternative: Ịkọwa ezi ọrụ dị ka ihe na-eweta nzọpụta ma ọ bụ dị ka ndụmọdụ nkịtị na-enweghị njikọ na okwukwe.
  rationale: Usoro okwu Grik na-egosi ezi ọrụ dị ka ihe kwesịrị isi n’okwukwe ndị kwere ekwe pụta; ọ naghị ekwu na ọ bụ ezi ọrụ na-eme ka a zọpụta mmadụ.
- issue: Ihe πιστεύω na dative θεῷ pụtara
  choice: ndị kweere Chineke
  alternative: ndị kwere na Chineke; ndị tụkwasịrị Chineke obi
  rationale: Ntụgharị bụ isi na-edobe nhazi Grik nke ịkwere Chineke, ebe e tinyere ụzọ ndị ọzọ a pụrụ isi ghọta ya n’ala ala peeji ka e ghara ikpochapụ ihe okwu ahụ nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. “Jiri nkwuwa okwu mesie ... ike” na-eburu ike nke διαβεβαιοῦσθαι, ebe “lezie anya n’ịrara onwe ha nye” na-egosipụta ma ichebara ihe echiche nke ọma ma ịnọgide n’ezi ọrụ.
