  naturalness: The Igbo is generally clear and uses an appropriate modern, dignified Standard Igbo register. “Jiri nkwuwa okwu kwusie ike banyere ihe ndị a” is a more natural and precise way to express forceful affirmation concerning the preceding matters.
  terminology: “Ndị kweere Chineke” suitably preserves πιστεύω with the dative Θεῷ without imposing the more interpretive “in God.” “Ezi ọrụ” and “ndị mmadụ” are appropriate. The footnote alternatives are retained and the anchors remain correctly placed.
