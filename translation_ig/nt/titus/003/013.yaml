  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: ig
  text: Jiri uchu kwadoo Zenas onye ọka iwu na Apọlọs n’ụzọ ha[a], ka ha ghara ịkpa ụkọ n’ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jiri uchu zipụ Zenas onye ọka iwu na Apọlọs n’ụzọ ha.” Ngwaa Grik ahụ pụrụ ịpụta iziga ndị njem n’ụzọ ha, ma ọ na-agụnyekarị inye ha nkwado bara uru maka njem ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: Zenas
  rationale: E depụtara aha Grik a n’ụdị mkpụrụedemede Igbo nke na-edobe ụda na njirimara aha ahụ.
- source_word: τὸν νομικὸν
  choice: onye ọka iwu
  rationale: νομικός na-egosi onye maara iwu nke ọma; n’ebe a, ọ bụ nkọwa ọrụ Zenas, ya mere ‘onye ọka iwu’ bụ okwu Igbo dị nkenke ma doo anya.
- source_word: Ἀπολλῶν
  choice: Apọlọs
  rationale: E depụtara aha ahụ n’ụdị dabara na mkpọpụta na usoro odide Igbo.
- source_word: σπουδαίως
  choice: Gbalịsie ike
  rationale: Nkebiokwu a na-egosi ịdị uchu na itinye obi n’ihe e nyere n’iwu, n’etinyeghị echiche na ọ bụ naanị ime ya ọsọ ọsọ.
- source_word: πρόπεμψον
  choice: inyere ... aka ịga n’ihu na njem ha
  rationale: N’ọnọdụ njem, προπέμπω na-agụnyekarị inyere ndị njem aka ma nye ha nkwado ha chọrọ, ọ bụghị nanị ịsị ha pụọ.
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: ka ihe ọ bụla ghara ịkọ ha
  rationale: 'Nke a na-edobe ebumnobi nke ahịrịokwu Grik: ka ha ghara inwe ụkọ n’ihe ọ bụla dị ha mkpa.'
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Gbalịsie ike’ na-egosi ịdị uchu, ebe ‘inyere ... aka ịga n’ihu na njem ha’ na-eme ka nkwado bara uru nke πρόπεμψον pụta ìhè.
