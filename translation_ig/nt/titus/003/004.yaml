  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: ig
  text: Ma mgbe obiọma Chineke, Onye Nzọpụta anyị, na ịhụnanya ya n’ebe ụmụ mmadụ nọ pụtara ìhè,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịhụ ụmụ mmadụ n’anya”; okwu Grik ahụ pụtara obiọma ma ọ bụ ịhụnanya e nwere n’ebe ụmụ mmadụ nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi oge, ebe “ma” na-egosipụta ntakịrị ntụgharị site n’ọnọdụ mmehie a kọwara tupu nke a gaa n’ihe Chineke mere iji zọpụta.
- source_word: χρηστότης
  choice: obiọma
  rationale: “Obiọma” bụ okwu Igbo dị mfe ma dị ebube nke na-egosi ịdị mma na mmesapụ aka e mere mmadụ, ma na-ekewapụkwa ya n’echiche φιλανθρωπία.
- source_word: φιλανθρωπία
  choice: ịhụnanya ... nwere n’ebe ụmụ mmadụ nọ
  rationale: Nkebiokwu a na-egosi kpọmkwem ịhụnanya na obi ebere a na-egosi ụmụ mmadụ, n’enweghị ịtụnye echiche teknụzụ nke oge a n’okwu ahụ.
- source_word: ἐπεφάνη
  choice: pụtara ìhè
  rationale: “Pụtara ìhè” na-egosipụta ihe bịara pụta ma bụrụ nke a hụrụ ma ọ bụ mara, ma na-ahapụ ụzọ ngosipụta ya n’enweghị nkọwa agbakwunyere.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Chineke, Onye Nzọpụta anyị
  rationale: Usoro a bụ nke sitere n’okike asụsụ Igbo ma na-edobe “Onye Nzọpụta anyị” dị ka aha e ji akọwa Chineke.
theological_decisions:
- issue: Onye “Chineke, Onye Nzọpụta anyị” na-ezo aka na ya
  choice: E debere ya dịka aha Chineke n’amaokwu a, n’enweghị ịgbakwunye “Nna” n’ime ederede.
  alternative: Ịsụgharị ya “Chineke Nna, Onye Nzọpụta anyị” iji mee ka onye ọ na-ezo aka na ya doo anya.
  rationale: Ọ bụ ezie na ọnọdụ akwụkwọ ozi ndị a na-egosikarị na aha a na-ezo aka na Chineke Nna ma amaokwu nke isii kpọrọ Jizọs Kraịst iche, okwu Grik n’onwe ya ekwughị “Nna.” Ya mere, nsụgharị ahụ na-edobe okwu na esemokwu nkà mmụta okpukpe ahụ n’enweghị idozi ya karịa ihe isi mmalite kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E ji “ụmụ mmadụ” mee ka o doo anya na ịhụnanya ahụ metụtara mmadụ niile; e zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
