source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: ig
  text: Ka ndị nke anyị[a] mụtakwa itinye onwe ha n'ịrụ ọrụ ọma[b] iji gboo mkpa ndị dị mkpa[c], ka ha ghara ịbụ ndị na-adịghị amị mkpụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị anyị” ma ọ bụ “ndị anyị onwe anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mụtakwa ibute ụzọ n'ọrụ ọma” ma ọ bụ “mụtakwa ịnọgide na-arụ ọrụ ọma.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “iji gboo mkpa ndị dị ngwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: Ka ... mụtakwa
  rationale: Ụdị iwu onye nke atọ ọtụtụ na-enye ndụmọdụ siri ike; “Ka ... mụta” na-echekwa ike agbamume ahụ n'Igbo n'emeghị ya iwu karịrị isi mmalite.
- source_word: οἱ ἡμέτεροι
  choice: ndị nke anyị
  rationale: Nke a bụ aha e ji ụdị nnọchiaha ahụ mee, pụtara ndị so n'òtù Pọl na Taịtọs; ọ naghị ekewapụ nwoke na nwanyị.
- source_word: καλῶν ἔργων
  choice: ọrụ ọma
  rationale: Nsụgharị doro anya nke okwu ahụ, nke na-echekwakwa isiokwu a na-ekwughachi n'akwụkwọ Taịtọs banyere omume bara uru.
- source_word: προΐστασθαι
  choice: itinye onwe ha n'ọrụ
  rationale: Ngwaa ahụ nwere ike ịpụta ibute ụzọ, ilekọta, ma ọ bụ itinye onwe n'ihe. N'ebe a, ọ na-egosi itinye uchu n'ọrụ ọma, ma a na-echekwa ohere nke “ibute ụzọ” na nkọwa ala peeji.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: iji gboo mkpa ndị dị mkpa
  rationale: εἰς na-egosi ebumnuche ma ọ bụ ihe ọrụ ọma ahụ na-aga izute; ἀναγκαίας na-akọwa χρείας dịka mkpa dị mkpa ma ọ bụ dị ngwa.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: ka ha ghara ịbụ ndị na-adịghị amị mkpụrụ
  rationale: Na-echekwa ahịrịokwu ebumnuche na ihe atụ nke enweghị mkpụrụ, n'agbanyeghị na ọ pụtara ndụ na-enweghị uru ma ọ bụ nsonaazụ ọma.
theological_decisions:
- issue: Oke ndị οἱ ἡμέτεροι na-ezo aka na ha
  choice: ndị nke anyị, ya bụ ndị otu okwukwe Pọl na Taịtọs
  alternative: ndị ikom nke anyị; ndị nke anyị n'ụzọ na-emegide ndị nọ n'èzí
  rationale: Okwu Grik ahụ bụ nke mmekọrịta na nke ọha mmadụ, ọ bụghị okwu na-amachi ya n'ebe ndị nwoke nọ. Nsụgharị ahụ na-ahapụ ihe dị iche n'etiti ndị otu ha na ndị ọzọ n'ọnọdụ okwu ahụ, n'etinyeghị nkọwa okpukpe ọzọ.
- issue: Ihe προΐστασθαι pụtara n'ọnọdụ a
  choice: itinye onwe ha n'ọrụ ọma
  alternative: ibute ụzọ n'ọrụ ọma; ịnọgide na-arụ ọrụ ọma
  rationale: Okwu ahụ nwere nghọta sara mbara. N'ebe a, njikọ ya na ọrụ ọma na igbo mkpa na-akwado itinye uchu ma ọ bụ itinye onwe, ma nkọwa ala peeji na-echekwa nghọta “ibute ụzọ.”
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta mee ya. “Ọrụ ọma” na “ịmị mkpụrụ” na-echekwa okwu na ihe atụ ndị a na-ekwughachi n'akwụkwọ Taịtọs. E debere akara nkọwa ala peeji ozugbo e kwuchara akụkụ ndị ha na-akọwa.
