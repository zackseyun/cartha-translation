id: TIT.3.1
reference: Titus 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: ig
  text: Nọgide na-echetara ha ka ha doo onwe ha n’okpuru ndị ọchịchị na ndị isi ọchịchị, ka ha rube isi, ka ha dị njikere ịrụ ezi ọrụ ọ bụla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: Na-echetara
  rationale: Ọ bụ iwu dị n'ụdị present nye otu onye, nke na-egosi na Taịtọs kwesịrị ịnọgide na-echetara ha; “Na-echetara” na-egosipụta nke a n'ụzọ Igbo dị mfe.
- source_word: αὐτοὺς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n'ebe ndị kwere ekwe Taịtọs na-akụziri nọ.
- source_word: ἀρχαῖς
  choice: ndị ọchịchị
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'ebe ndị na-achị obodo nọ, ọ bụghị ike mmụọ.
- source_word: ἐξουσίαις
  choice: ndị nwere ikike
  rationale: N'ịgbaso ἀρχαῖς, ọ na-egosi ndị ma ọ bụ ụlọ ọrụ e nyere ikike ọchịchị; nsụgharị a na-edobe okwu abụọ Grik ahụ iche.
- source_word: ὑποτάσσεσθαι
  choice: ka ha na-edo onwe ha n'okpuru
  rationale: Nke a na-egosi itinye onwe onye n'usoro n'okpuru ọchịchị, na-enweghị ịgbakwunye echiche nke ịbụ ohu ma ọ bụ nrubeisi na-enweghị oke.
- source_word: πειθαρχεῖν
  choice: ka ha na-erube isi
  rationale: Ngwaa ahụ pụtara irubere ndị nọ n'ikike isi; okwu Igbo a bụ nke doro anya ma kwekọọ n'usoro ndụmọdụ ahụ.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: ịrụ ezi ọrụ ọ bụla
  rationale: πρός na-egosi ihe a ga-adị njikere ime, ebe ἔργον ἀγαθόν bụ ọrụ ọma ma ọ bụ ezi omume.
- source_word: ἑτοίμους εἶναι
  choice: ka ha dị njikere
  rationale: Nkebiokwu a na-akpọ ndị kwere ekwe ka ha nọ n'ọnọdụ ịdị njikere ime ezi ọrụ.
theological_decisions:
- issue: Ókè nrubeisi nye usoro ọchịchị obodo
  choice: E dere amaokwu ahụ dịka ndụmọdụ zuru ezu ka ndị kwere ekwe doo onwe ha n'okpuru ndị ọchịchị ma rube isi, na-ekwughị na nrubeisi ahụ enweghị ókè n'ọnọdụ niile.
  alternative: Ịsụgharị ya n'ụzọ ga-egosi na a ga-erubere ọchịchị isi n'enweghị ihe ọ bụla ga-egbochi ya.
  rationale: ἀρχαῖς na ἐξουσίαις na-ezo aka n'ebe ọchịchị obodo nọ. Nsụgharị ahụ na-edobe iwu ahụ nke ọma, ma ọ naghị etinye nkọwa nke ihe odide ahụ ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Mmegharị “na-” n'usoro ndụmọdụ ahụ na-egosipụta ọdịdị na-aga n'ihu nke ngwaa Grik ndị ahụ n'ụzọ Igbo sitere n'okike.
