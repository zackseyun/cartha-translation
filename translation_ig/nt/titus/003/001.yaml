revisions:
- from: Na-echetara ha ka ha na-edo onwe ha n'okpuru ndị ọchịchị na ndị nwere ikike, ka ha na-erube isi, ka ha dị njikere ịrụ ezi ọrụ ọ bụla.
  to: Nọgide na-echetara ha ka ha doo onwe ha n’okpuru ndị ọchịchị na ndị isi ọchịchị, ka ha rube isi, ka ha dị njikere ịrụ ezi ọrụ ọ bụla.
  rationale: The revision preserves the source's sequence and scope while using idiomatic Standard Igbo. It explicitly expresses the ongoing force of the present imperative, retains the paired civic terms, and avoids resolving the exhortation into an assertion of absolute obedience.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the three coordinated infinitival exhortations accurately: subjection to governing rulers/authorities, obedience, and readiness for every good work. A revision improves the imperative''s ongoing force and makes the second governmental term less awkward without importing a claim of unconditional obedience.'
  naturalness: “Na-echetara ha” is understandable but is less idiomatic as a standalone imperative than “Nọgide na-echetara ha.” The repeated “ka ha na-” structure is also unnecessarily heavy. “Ndị nwere ikike” can sound like any persons who possess ability or permission; “ndị isi ọchịchị” more naturally identifies the governmental-authority sense required by the context.
  terminology: “Ndị ọchịchị” and “ndị isi ọchịchị” retain the twofold κυβερνητικό/civic reference of ἀρχαῖς and ἐξουσίαις without suggesting cosmic powers. “Rube isi” is an appropriate rendering of πειθαρχεῖν, and “ezi ọrụ ọ bụla” faithfully renders πᾶν ἔργον ἀγαθόν.
  issues:
  - severity: medium
    issue: The opening imperative is not fully natural as written.
    rationale: “Na-echetara ha” may be read as a progressive clause rather than a direct instruction. “Nọgide na-echetara ha” is a clear, natural imperative and appropriately reflects the present imperative's ongoing orientation.
  - severity: low
    issue: “Ndị nwere ikike” is broad and stylistically cumbersome in this paired civic expression.
    rationale: In ordinary modern Igbo it may denote people who have ability, permission, or authority generally. “Ndị isi ọchịchị” gives the contextual governmental sense of ἐξουσίαις while maintaining its distinction from “ndị ọchịchị.”}],
  revised_text: Nọgide na-echetara ha ka ha doo onwe ha n’okpuru ndị ọchịchị na ndị isi ọchịchị, ka ha rube isi, ka ha dị njikere ịrụ ezi ọrụ ọ bụla.
