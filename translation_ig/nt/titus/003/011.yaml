  terminology: '“na-eme mmehie” appropriately represents the present ἁμαρτάνει. No gender-specific term should be added in Igbo: “onye dị otu a” adequately refers to the masculine-singular Greek expression without imposing male sex. The footnote should give a genuine lexical alternative for the revised main rendering and explain αὐτοκατάκριτος without adding a doctrine of final judgment.'
