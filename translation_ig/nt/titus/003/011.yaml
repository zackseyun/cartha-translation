  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: ig
  text: n’ịmara na onye dị otu a apụwo n’ụzọ ma na-eme mmehie, onye onwe ya mara ikpe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ἐξέστραπται dịka, “agbagọwo” ma ọ bụ “emebiwo.” Okwu Grik ahụ dị n’ụdị perfect, na-egosi ọnọdụ sitere n’ịpụ n’ụzọ na mbụ. “Onye onwe ya mara ikpe” nwekwara ike ịpụta, “onye onwe ya katọrọ” ma ọ bụ “onye omume ya n’onwe ya na-egosi na ikpe mara ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: ebe ị maara
  rationale: Na-ejigide njikọ nke participle a na iwu dị n’amaokwu bu ya ụzọ, ma na-egosi na onye a na-agwa okwu bụ onye maara ọnọdụ ahụ; ‘ebe’ anaghị emechi ma njikọ ahụ bụ kpọmkwem nke ihe kpatara ya ma ọ bụ nkọwa ọnọdụ.
- source_word: ἐξέστραπται
  choice: agbagọwo
  rationale: Perfect tense na-egosi ọnọdụ dị ugbu a nke sitere n’ịhapụ ụzọ ziri ezi na mbụ. ‘Agbagọwo’ na-egosi mgbanwe ahụ na ọnọdụ ọ rụpụtara n’enweghị itinye nkọwa karịrị ederede.
- source_word: ὁ τοιοῦτος
  choice: onye dị otu a
  rationale: Ọ bụ ụzọ Igbo nkịtị na nke doro anya isi zoo aka n’otu onye ahụ a kpọrọ onye na-akpata nkewa n’amaokwu gara aga. N’asụsụ Igbo, ‘onye’ anaghị egosi okike, ọ dịghịkwa mkpa ịgbakwunye ‘nwoke’ iji mee ka ntụaka otu onye doo anya.
- source_word: ἁμαρτάνει
  choice: na-eme mmehie
  rationale: Ọdịdị present na-egosi omume na-aga n’ihu; ‘na-eme mmehie’ na-ebute nke a n’Igbo nke ọma n’etinyeghị echiche ọzọ dịka ‘na-anọgide n’ime mmehie.’
- source_word: ὢν
  choice: na-
  rationale: A jikọtara participle a n'ụzọ eke n’Igbo na predicate so ya, ‘na-ama onwe ya ikpe,’ nke na-edobe njikọ ya na nkọwa gara aga.
- source_word: αὐτοκατάκριτος
  choice: na-ama onwe ya ikpe
  rationale: Nke a na-edobe ike reflexive nke okwu Grik ma na-ada nke ọma n’Igbo. Ọ nwere ike ịpụta na omume ma ọ bụ akaebe onye ahụ na-egosi na ikpe mara ya, n’enweghị ikwu na ọ bụ ikpe ikpeazụ.
theological_decisions:
- issue: Ntụaka okike dị na ὁ τοιοῦτος
  choice: onye dị otu a
  alternative: nwoke dị otu a
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ masculine singular n’ụtọasụsụ, ‘onye dị otu a’ bụ ntụgharị Igbo kwesịrị ekwesị maka otu onye a na-ekwu maka ya, ebe Igbo anaghị etinye okike n’okwu ‘onye.’ Ịgbakwunye ‘nwoke’ nwere ike ime ka ihe ederede pụtara sie ike karịa ka usoro Igbo chọrọ.
- issue: Ike αὐτοκατάκριτος
  choice: na-ama onwe ya ikpe
  alternative: onye ikpe mara site n’onwe ya
  rationale: 'Nhọrọ a na-echekwa esemokwu dị n’okwu ahụ: a pụrụ ịghọta ya dịka onye omume ma ọ bụ akaebe ya na-ama ikpe, ma ọ bụ onye ikpe mara site n’onwe ya. Ọ naghị ebubata ozizi zuru ezu banyere ikpe ikpeazụ.'
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu na-aga were were n’Igbo kama iṅomi usoro participle Grik n’ụzọ siri ike; e debere ịdịgide nke omume na ọnọdụ perfect verb pụtara.
