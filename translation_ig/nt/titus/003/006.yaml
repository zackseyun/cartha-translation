  yaml_path: translation/nt/titus/003/006.yaml
  text: whom he poured out on us richly through Jesus the Messiah our Savior[b][a],
translation:
  language: ig
  text: nke Ọ wụkwasịrị n’elu anyị n’ụba site na Jizọs Mezaya ahụ, Onye Nzọpụta anyị.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye Ọ wụkwasịrị n’elu anyị n’ụba.” Nnọchiaha ahụ na-ezo aka na Mmụọ Nsọ e kwuru banyere ya n’amaokwu nke 5.
    reason: lexical_alternative
  - marker: b
    text: 'Grik: “Jizọs Kraịst.” N’ebe a, a sụgharịrị Χριστός dị ka utu aha “Mezaya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ
  choice: onye
  rationale: Nnọchiaha a na-alaghachi n’ebe Mmụọ Nsọ dị n’amaokwu nke 5. “Onye” bụ ụzọ Igbo si ezo aka n’ebe onye dị, ma ọ na-edobekwa nghọta ahụ na Mmụọ Nsọ abụghị ihe nkịtị.
- source_word: ἐξέχεεν ἐφ’ ἡμᾶς
  choice: ọ wụkwasịrị anyị
  rationale: “Wụkwasị” na-egosipụta ihe a na-awụsa n’elu ma ọ bụ n’ebe mmadụ nọ; ọ bụkwa okwu Igbo dị ndụ ma kwekọọ n’onyonyo nke ịwụsa Mmụọ Nsọ.
- source_word: πλουσίως
  choice: n’ụba
  rationale: “N’ụba” na-egosi ọtụtụ ihe na afọ ojuju, ya bụ, na ọ bụghị n’ókè nta ka e nyere Mmụọ Nsọ.
- source_word: διὰ
  choice: site n’aka
  rationale: N’ebe a διά tinyere genitive na-egosi ụzọ ma ọ bụ onye e si n’aka ya mee ihe. “Site n’aka” bụ ụzọ Igbo doro anya isi kwuo nke a.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mezaya
  rationale: Χριστός bụ utu aha pụtara Mezaya. Ntinye “bụ” na-eme ka utu aha ahụ daa nke ọma n’Igbo ma ghara ịdị ka aha ọzọ e jikọrọ na Jizọs.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: Onye Nzọpụta anyị
  rationale: Nke a na-edobe σωτήρ dị ka utu aha Jizọs ma na-eji usoro okwu Igbo kwuo “our Savior” n’ụzọ doro anya.
theological_decisions:
- issue: Onye οὗ na-ezo aka na ya
  choice: A sụgharịrị ya “onye,” na-ezo aka na Mmụọ Nsọ e kwuru banyere ya n’amaokwu nke 5.
  alternative: “nke,” ma ọ bụrụ na a chọrọ ntụaka na-adịchaghị ka nke onye
  rationale: Ihe e kwuru ozugbo tupu ya bụ Mmụọ Nsọ. Nhọrọ “onye” na-echekwa ntụaka ahụ na ọdịdị nke onye, ma e depụtara “nke” n’ala peeji iji gosi ohere asụsụ nke nnọchiaha Grik ahụ.
- issue: Nsụgharị Χριστοῦ
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dị ka utu aha, n’akụkụ utu aha ọzọ, “Onye Nzọpụta anyị.” Ya mere, “Mezaya” na-eme ka ihe utu aha ahụ pụtara pụta ìhè.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-aga n’ihu site n’amaokwu nke 5, ya mere e ji obere mkpụrụedemede malite “onye.” “Wụkwasịrị anyị n’ụba” na-echekwa onyonyo nke ịwụsa ihe n’elu ndị mmadụ ma na-ada nke ọma n’Igbo.
