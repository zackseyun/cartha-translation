  rationale: The revision retains the verse’s dependent-clause form, abundance, mediatorial sense, and Christological titles. It avoids making a personal-versus-impersonal distinction from the Greek relative pronoun itself, restores the explicit “upon us” imagery, and uses more idiomatic Standard Igbo for the mediatorial phrase.
