id: TIT.3.3
reference: Titus 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: ig
  text: N’ihi na n’oge gara aga, anyị onwe anyị bụkwa ndị na-enweghị uche, ndị na-enupụ isi, ndị a na-eduhie ụzọ[a], ndị ọchịchọ na ihe ụtọ dị iche iche mere ohu, ndị na-ebi n’ajọ obi na anyaụfụ, ndị jọgburu onwe ha[b], na ndị na-akpọ ibe anyị asị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị e duhiere.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị mmadụ kpọrọ asị.” Okwu Grik ahụ nwere ike ịpụta ma ndị jọgburu onwe ha (ndị na-eme ka mmadụ asọ oyi) ma ndị mmadụ kpọrọ asị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: N’ihi na anyị onwe anyị bụkwa ... n’oge gara aga
  rationale: “N’ihi na” na-egosi njikọ γάρ na okwu bu ụzọ; “anyị onwe anyị bụkwa” na-echekwa nkwusi ike nke καὶ ἡμεῖς, ebe “n’oge gara aga” na-enye echiche oge nke ποτε n’Igbo dị mfe.
- source_word: ἀνόητοι
  choice: ndị na-enweghị uche
  rationale: Nke a na-egosi enweghị nghọta ma ọ bụ ezi uche n’omume, ma ghara ime ka okwu ahụ sie ike karịa isi Grik.
- source_word: ἀπειθεῖς
  choice: ndị na-enupụ isi
  rationale: Ọ na-egosi ịjụ ikwenye ma ọ bụ irube isi; n’usoro mmehie a, “na-enupụ isi” bụ okwu Igbo doro anya ma dị ndụ.
- source_word: πλανώμενοι
  choice: ndị a na-eduhie
  rationale: Ụdị a na-echekwa nghọta passive nke participle ahụ—ndị a na-edupụ n’ụzọ ziri ezi—ma na-ahapụ “ndị e duhiere” dịka ụzọ ọzọ kwe omume.
- source_word: δουλεύοντες
  choice: ndị ọchịchọ na ihe ụtọ dị iche iche mere ohu
  rationale: Nkebi a na-echekwa ike nke asụsụ ịgba ohu dị na δουλεύοντες, ma na-ada n’ụzọ eke n’Igbo karịa ntụgharị siri ike nke usoro okwu Grik.
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: ọchịchọ na ihe ụtọ dị iche iche
  rationale: “Ọchịchọ” sara mbara karịa agụụ mmekọahụ naanị; “dị iche iche” na-emetụta ma ọchịchọ ma ihe ụtọ dịka echiche nkebi Grik ahụ si dị.
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: Anyị na-ebi ndụ anyị n’ajọ obi na anyaụfụ
  rationale: “Na-ebi ndụ anyị” na-egosipụta ịdịgide nke διάγοντες; “ajọ obi” dabara n’ọnọdụ mmejọ megide mmadụ ibe ya karịa “ihe ọjọọ” n’ozuzu.
- source_word: στυγητοί
  choice: ndị a na-asọ oyi
  rationale: Nke a na-egosipụta echiche na ndị ọzọ na-ewere ha dị ka ndị jọgburu onwe ha. Ebe adjective Grik ahụ nwekwara ike ịpụta “ndị mmadụ kpọrọ asị,” a debere nghọta ahụ n’ala peeji.
- source_word: μισοῦντες ἀλλήλους
  choice: na-akpọkwa ibe anyị asị
  rationale: Nke a bụ ụzọ Igbo nkịtị na kpọmkwem isi kwuo ịkpọrịta ibe ha asị, ma “kwa” na-enyere usoro ndepụta ahụ aka ịga nke ọma.
theological_decisions:
- issue: Ike nke δουλεύοντες mgbe ọchịchọ na ihe ụtọ bụ ndị nwe mmadụ
  choice: ndị ọchịchọ na ihe ụtọ dị iche iche mere ohu
  alternative: ndị na-ejere ọchịchọ na ihe ụtọ dị iche iche ozi
  rationale: “Mere ohu” na-echekwa ihe oyiyi nke ịbụ n’okpuru ike na njide siri ike, n’enweghị itinye usoro ozizi karịrị ihe amaokwu ahụ kwuru.
- issue: Ma στυγητοί bụ active ka ọ bụ passive n’echiche
  choice: ndị a na-asọ oyi
  alternative: ndị mmadụ kpọrọ asị
  rationale: Okwu Grik ahụ nwere ike ịkọwa ndị na-akpata ịsọ oyi ma ọ bụ ndị a kpọrọ asị. Isi okwu họọrọ okwu Igbo eke nke na-ejigide ọnọdụ ọjọọ ahụ, ebe ala peeji na-echekwa nghọta ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu kewara ndepụta ogologo Grik ahụ ụzọ abụọ ka ọ bụrụ nke a na-agụ nke ọma, ebe nkwughachi “anyị” ka na-echekwa itinye Pọl na ndị ọzọ n’ọnọdụ gara aga ahụ.
