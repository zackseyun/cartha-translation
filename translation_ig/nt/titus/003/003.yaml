revisions:
- from: N’ihi na anyị onwe anyị bụkwa ndị na-enweghị uche n’oge gara aga, ndị na-enupụ isi, ndị a na-eduhie[a], ndị ọchịchọ na ihe ụtọ dị iche iche mere ohu. Anyị na-ebi ndụ anyị n’ajọ obi na anyaụfụ, bụrụ ndị a na-asọ oyi[b], na-akpọkwa ibe anyị asị.
  to: N’ihi na n’oge gara aga, anyị onwe anyị bụkwa ndị na-enweghị uche, ndị na-enupụ isi, ndị a na-eduhie ụzọ[a], ndị ọchịchọ na ihe ụtọ dị iche iche mere ohu, ndị na-ebi n’ajọ obi na anyaụfụ, ndị jọgburu onwe ha[b], na ndị na-akpọ ibe anyị asị.
  rationale: The revision keeps the source’s single list of former characteristics under ‘anyị ... bụkwa,’ improves the idiomatic passive expression for πλανώμενοι with ‘a na-eduhie ụzọ,’ and renders στυγητοί in the main text as ‘detestable’ while explicitly retaining its disputed passive alternative in the footnote. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:27:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the inclusive former condition, disobedience, deception, bondage to diverse desires and pleasures, malice, envy, and reciprocal hatred. A revision is needed chiefly for the ambiguous στυγητοί: the main Igbo wording should more clearly express the active sense selected in the English audit trail (''hateful/detestable''), while the footnote preserves the passive alternative (''hated'').'
  naturalness: The vice list is generally understandable Standard Igbo. Recasting it as one coordinated past-tense description avoids the slight shift produced by beginning a new present-progressive sentence ('anyị na-ebi ndụ anyị') after 'anyị ... bụkwa.'
  terminology: ‘Ndị ọchịchọ na ihe ụtọ dị iche iche mere ohu’ retains the strong slave/bondage force of δουλεύοντες naturally. ‘Ndị na-enweghị uche,’ ‘ndị na-enupụ isi,’ ‘anyaụfụ,’ and ‘na-akpọ ibe anyị asị’ are suitable. ‘Ndị jọgburu onwe ha’ is a clearer main-text rendering for the active/detestable construal of στυγητοί than ‘ndị a na-asọ oyi,’ which can be read primarily as passive.
  issues:
  - severity: medium
    issue: The rendering of στυγητοί is not sufficiently explicit about the selected active sense.
    rationale: ‘Ndị a na-asọ oyi’ readily suggests people whom others loathe, whereas the main reading selected by the audit trail is ‘hateful, detestable.’ The Greek adjective is genuinely ambiguous, so the passive sense should remain in a footnote rather than be obscured.
  - severity: low
    issue: The second sentence shifts the list into a present-progressive construction.
    rationale: The participles are governed by ἦμεν (‘we were’). A unified past-oriented Igbo construction more smoothly represents the former state without altering aspectual force.
  revised_text: N’ihi na n’oge gara aga, anyị onwe anyị bụkwa ndị na-enweghị uche, ndị na-enupụ isi, ndị a na-eduhie ụzọ[a], ndị ọchịchọ na ihe ụtọ dị iche iche mere ohu, ndị na-ebi n’ajọ obi na anyaụfụ, ndị jọgburu onwe ha[b], na ndị na-akpọ ibe anyị asị.
  revised_footnotes:
