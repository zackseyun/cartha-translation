  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: ig
  text: Mgbe m zitere Atemas ma ọ bụ Taịkikọs ka ọ bịakwute gị, gbalịsie ike ịbịakwute m na Nikọpolis[a], n’ihi na ekpebiela m ịnọ ebe ahụ n’oge oyi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gbalịsie ike ịbịakwute m ruo Nikọpolis.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ekpebiela m ịgafe oge oyi ebe ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Mgbe m zitere
  rationale: Ὅταν ya na aorist subjunctive na-egosi ihe a na-atụ anya na ọ ga-eme n’ọdịnihu; ‘Mgbe m zitere’ na-egosipụta nke a n’ụzọ Igbo dị ndụ.
- source_word: Ἀρτεμᾶν
  choice: Atemas
  rationale: E dere aha onye a n’ụdị mkpụrụokwu kwekọrọ n’usoro ụda Igbo.
- source_word: ἢ Τυχικόν
  choice: ma ọ bụ Taịkọs
  rationale: ἢ na-egosi nhọrọ n’etiti mmadụ abụọ; e degharịrị Τυχικός n’usoro ụda Igbo.
- source_word: σπούδασον
  choice: gbalịsie ike
  rationale: Okwu iwu a na-akpọ Tito ka o jiri ịdị uchu na ezi mbọ mee ihe ahụ; ọ bụghị naanị ka o mee ngwa ngwa.
- source_word: ἐλθεῖν πρός με
  choice: ịbịakwute m
  rationale: Ọ na-egosi njem a na-eme n’ebe Pọl nọ; ‘ịbịakwute m’ jikọtara infinitive na ntụziaka ahụ n’Igbo nkịtị.
- source_word: εἰς Νικόπολιν
  choice: na Nikọpolis
  rationale: N’ebe a, εἰς na-akọwa ebe Tito ga-ahụ Pọl; ‘na Nikọpolis’ na-ezere nkwughachi ntụziaka ma na-echekwa ebe njem ahụ na-aga.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere e ji nye arịrịọ ahụ.
- source_word: κέκρικα
  choice: ekpebiela m
  rationale: Perfect active na-egosi mkpebi e merela nke ka dị ire ugbu a; ‘ekpebiela m’ na-echekwa ọnọdụ ahụ.
- source_word: παραχειμάσαι
  choice: ịnọ ebe ahụ n’oge oyi
  rationale: Okwu ahụ pụtara ịnọ ma ọ bụ ịgafe oge oyi n’otu ebe; nsụgharị a doro ndị na-agụ Igbo nke oge a anya.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo zuru oke, dị ugwu ma dị mfe nghọta. E ji ‘gbalịsie ike’ chekwaa ịdị uchu na mbọ dị na σπούδασον, ebe ‘ịnọ ebe ahụ n’oge oyi’ na-akọwa παραχειμάσαι n’enweghị ịgbakwụnye nkọwa ụka ọ bụla.
