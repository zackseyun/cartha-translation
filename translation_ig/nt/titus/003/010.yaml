  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: ig
  text: Mgbe ị dọsịrị onye na-akpata nkewa aka ná ntị otu ugboro na ugboro nke abụọ, jụ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-akwalite nkewa,” ma ọ bụ, dị ka nsụgharị ọdịnala ụfọdụ si kwuo, “onye na-ezi ozizi ụgha.” Okwu Grik a yiri ka ọ na-ezo aka n’onye na-akpata nkewa n’ime ọgbakọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: onye na-akpata nkewa
  rationale: N'okwu Grik oge ahụ, okwu a na-ezo aka karịsịa n'onye na-akwalite ịkpa ókè n'ìgwè ma ọ bụ na-akpata nkewa, ọ bụghị naanị n'onye nwere ozizi ụgha n'echiche ụka nke e mesịrị.
- source_word: ἄνθρωπον
  choice: onye
  rationale: N'agbanyeghị na ụdị okwu Grik ahụ bụ nwoke n'ụtọasụsụ, ebe a ọ na-ezo aka n'otu mmadụ n'ozuzu; “onye” bụ ụzọ Igbo nkịtị na nke ziri ezi isi kwuo ya n'ebughị okike nwoke n'ime ihe okwu ahụ pụtara.
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: Mgbe ị dọrọ ... aka ná ntị nke mbụ na nke abụọ
  rationale: 'Nke a na-edobe usoro ahụ nke ọma: a ga-ebu ụzọ dọọ onye ahụ aka ná ntị ugboro abụọ iji gbazie ya tupu e mee ihe e nyere n''iwu.'
- source_word: παραιτοῦ
  choice: jụ ya
  rationale: “Jụ ya” na-egosi mkpebi ịkwụsị ịnabata ma ọ bụ iso onye ahụ na-emekọ ihe, ma ọ naghị agbasa ihe Grik kwuru karịa ókè.
theological_decisions:
- issue: Ma a ga-asụgharị αἱρετικὸν dị ka onye ozizi ya bụ nke ụgha n'echiche nkà mmụta okpukpe e mesịrị, ka ọ bụ onye na-akpata nkewa.
  choice: onye na-akpata nkewa
  alternative: onye na-akwalite otu nkewa; onye ozizi ya bụ nke ụgha
  rationale: Nhọrọ a na-echekwa ihe okwu ahụ yiri ka ọ pụtara na narị afọ mbụ—onye na-eme ka òtù kewaa—ma na-ezere ibubata nkọwa teknụzụ banyere ozizi nduhie nke malitere ịpụta nke ọma n'oge e mesịrị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E tinyere nkebiokwu oge n'isi ahịrịokwu ka usoro mmezi ugboro abụọ tupu ịjụ onye ahụ doo anya. Akara nkọwa ala ala [a] dị n'ahịrịokwu.
