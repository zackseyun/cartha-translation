review_pass:
  verdict: revise
  source_fidelity: The main rendering correctly takes αἱρετικόν in its likely contextual sense of a person who causes or promotes factional division, rather than imposing the later technical sense ‘heretic.’ ‘Onye’ appropriately renders generic ἄνθρωπον. The sequence of two prior admonitions is retained, and ‘jụ ya’ is an acceptable concise rendering of παραιτοῦ.
  naturalness: The draft is understandable Standard Igbo, but ‘aka ná ntị nke mbụ na nke abụọ’ is less idiomatic than explicitly expressing the two occasions. Using ‘otu ugboro na ugboro nke abụọ’ makes the required sequence clearer and more natural.
  terminology: ‘Onye na-akpata nkewa’ is suitable and non-sectarian. The footnote’s proposed traditional alternative, ‘onye ozizi ya bụ nke ụgha,’ is awkward Igbo and shifts from describing a person to describing that person’s teaching. ‘Onye na-ezi ozizi ụgha’ is idiomatic, while the note properly clarifies that this is a traditional, later-sounding interpretive rendering rather than the preferred sense.
  issues:
  - severity: low
    issue: The expression for the first and second warnings is somewhat compressed.
    rationale: ‘Otu ugboro na ugboro nke abụọ’ clearly communicates μίαν καὶ δευτέραν and reads more naturally in contemporary Standard Igbo.
  - severity: medium
    issue: The footnote’s traditional alternative is grammatically and idiomatically weak.
    rationale: ‘Onye ozizi ya bụ nke ụgha’ does not naturally mean ‘heretical person’ and can obscure the intended lexical alternative. ‘Onye na-ezi ozizi ụgha’ conveys the traditional doctrinal rendering more clearly, while the explanatory note limits its applicability.
