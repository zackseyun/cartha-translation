id: TIT.3.9
reference: Titus 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: ig
  text: Ma zere arụmụka nzuzu[a], na usoro ọmụmụ, na esemokwu, na ọgụ okwu gbasara iwu[b]; n’ihi na ha abaghị uru, ha bụkwa ihe efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “esemokwu nzuzu” ma ọ bụ “ntule nzuzu.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọgụ okwu ndị metụtara iwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: arụmụka nzuzu
  rationale: Nke a na-egosi ajụjụ ma ọ bụ nchọgharị ndị na-ebute esemokwu, bụ́ ndị na-enweghị ezi uche ma ọ bụ uru; ọ bụghị nanị ajụjụ nkịtị.
- source_word: γενεαλογίας
  choice: usoro ọmụmụ nna nna
  rationale: Nke a bụ ụzọ doro ndị na-agụ Igbo anya isi kwuo usoro agbụrụ ma ọ bụ usoro ndị nna nna, n’etinyeghị nkọwa akụkọ ihe mere eme nke amaokwu ahụ n’onwe ya ekwughị.
- source_word: ἔρεις
  choice: esemokwu
  rationale: Ọ na-egosi ndọrọndọrọ na nkewa dị n’etiti mmadụ, ma na-adị iche n’ụzọ kwesịrị ekwesị n’okwu na-esote nke pụtara ọgụ okwu.
- source_word: μάχας νομικὰς
  choice: ọgụ okwu gbasara iwu
  rationale: μάχας n’ebe a na-ezo aka n’esemokwu ọnụ, ọ bụghị ọgụ anụ ahụ; νομικὰς na-akọwa na ọgụ okwu ndị ahụ metụtara iwu.
- source_word: περιΐστασο
  choice: zere
  rationale: Ngwaa iwu a na-agwa Taịtọs ka ọ ghara itinye onwe ya n’ihe ndị ahụ; “zere” dị nkenke ma bụrụkwa Igbo eke.
- source_word: ἀνωφελεῖς
  choice: abaghị uru
  rationale: Ọ na-egosi ihe na-adịghị eweta enyemaka ma ọ bụ uru.
- source_word: μάταιοι
  choice: ihe efu
  rationale: Ọ na-egosi ihe na-enweghị isi ma ọ bụ mkpụrụ ọma, ma na-eme ka okwu ikpeazụ nke amaokwu ahụ sie ike.
theological_decisions:
- issue: Ihe “usoro ọmụmụ nna nna” na “ọgụ okwu gbasara iwu” pụtara kpọmkwem
  choice: Ịhapụ okwu abụọ ahụ n’ụdị sara mbara dịka Grik si dị
  alternative: Ịkọwa ha kpọmkwem dịka arụmụka ndị Juu banyere agbụrụ, ma ọ bụ dịka ntule nke otu ozizi ihe omimi oge ochie
  rationale: Amaokwu ahụ akọwaghị usoro ozizi ma ọ bụ otu akụkọ ihe mere eme a kapịrị ọnụ. Nsụgharị sara mbara na-echekwa nghọta dị iche iche isi mmalite ahụ nwere ike ikwe, n’etinyeghị ozizi ma ọ bụ nkọwa pụrụ iche.
- issue: Ma νόμος ọ̀ bụ Iwu Mosis kpọmkwem ka ọ bụ iwu n’ozuzu ya
  choice: iwu, n’enweghị mkpụrụedemede ukwu
  alternative: Iwu, iji gosi Iwu Mosis kpọmkwem
  rationale: νομικὰς bụ okwu nkọwa na Grik, amaokwu ahụ enweghịkwa aha kpọmkwem na-amanye ka a ghọta ya naanị dịka Iwu Mosis. Mkpụrụedemede nta na-echekwa oghere nghọta ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọgụ okwu” na-egosi esemokwu ọnụ kama ọgụ anụ ahụ; ahịrịokwu ahụ na-echekwakwa ndepụta na nkwughachi nke Grik n’enweghị ịkọwapụta ụdị ozizi ma ọ bụ akụkọ ihe mere eme a kapịrị ọnụ.
