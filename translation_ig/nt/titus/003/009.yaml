- from: Ma zere arụmụka nzuzu[a], na usoro ọmụmụ nna nna, na esemokwu, na ọgụ okwu gbasara iwu[b], n’ihi na ha abaghị uru, bụrụkwa ihe efu.
  to: Ma zere arụmụka nzuzu[a], na usoro ọmụmụ, na esemokwu, na ọgụ okwu gbasara iwu[b]; n’ihi na ha abaghị uru, ha bụkwa ihe efu.
  rationale: The revision removes the interpretive and redundant addition “nna nna” from the rendering of γενεαλογίας, preserves the plurality/list sense without specifying a historical system, and adjusts footnote a so that its alternatives retain the force of μωρὰς. The final clause is made syntactically explicit without altering meaning.
