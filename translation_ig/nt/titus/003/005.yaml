id: TIT.3.5
reference: Titus 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: ig
  text: ọ bụghị site n’ọrụ ndị anyị onwe anyị rụrụ n’ezi omume[a], kama dịka ebere ya si dị, ọ zọpụtara anyị site n’ịsa ahụ[b] nke ọmụmụ ọhụrụ na mme ọhụrụ nke Mmụọ Nsọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ ndị anyị onwe anyị rụrụ n’ikpe ziri ezi.” Okwu Greek ahụ pụrụ ịpụta “ezi omume” ma ọ bụ “ikpe ziri ezi.”
    reason: alternative_reading
  - marker: b
    text: “Ịsa ahụ” nwere ike izo aka na baptizim, n’ịsachapụ mmadụ n’ụzọ ihe atụ, ma ọ bụ na ha abụọ; Greek n’onwe ya anaghị amanye ka a họrọ naanị otu n’ime ha n’isiokwu.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mme ọhụrụ site n’aka Mmụọ Nsọ.” Nhazi okwu Greek ahụ kwere ụzọ ndị dịtụ iche isi jikọta “Mmụọ Nsọ” na “mme ọhụrụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: ọ bụghị n’ihi ọrụ
  rationale: ἐκ na-egosi ihe e si na ya nweta ma ọ bụ ihe bụ ntọala; “ọ bụghị n’ihi ọrụ” bụ Igbo ebumpụta ụwa nke na-edobe ọdịiche dị n’etiti ọrụ mmadụ na ebere Chineke.
- source_word: τῶν ἐν δικαιοσύνῃ
  choice: ndị e mere n’ezi omume
  rationale: Nkebiokwu a na-akọwa ọrụ ndị ahụ. “Ezi omume” na-enye echiche nke δικαιοσύνη n’Igbo nkịtị ma ghara ịtụgharị ya ka ọ bụrụ ikpe ziri ezi naanị.
- source_word: ἃ ἐποιήσαμεν ἡμεῖς
  choice: bụ́ ndị anyị onwe anyị mere
  rationale: “anyị onwe anyị” na-echekwa nkwusi ike dị na nnọchiaha Greek ἡμεῖς.
- source_word: κατὰ τὸ αὐτοῦ ἔλεος
  choice: dịka ebere ya si dị
  rationale: Nke a na-egosipụta κατά dị ka ụkpụrụ ma ọ bụ ntọala, na-enweghị ime ka ọ bụrụ naanị ihe kpatara ya.
- source_word: ἔσωσεν ἡμᾶς
  choice: ọ zọpụtara anyị
  rationale: “Zọpụta” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa nzọpụta n’ọnọdụ a.
- source_word: διὰ λουτροῦ
  choice: site n’ịsa ahụ
  rationale: διά na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ihe; “ịsa ahụ” na-edobe ihe oyiyi λουτρόν ma ghara ikwu hoo haa na ọ bụ baptizim naanị.
- source_word: παλιγγενεσίας
  choice: nke ọmụmụ ọzọ
  rationale: “Ọmụmụ ọzọ” na-ekwupụta echiche nke ịmụ ọhụrụ ma ọ bụ regeneration n’Igbo dị mfe nghọta.
- source_word: καὶ ἀνακαινώσεως
  choice: na ime ka anyị dị ọhụrụ
  rationale: Ụdị okwu a bụ Igbo ebumpụta ụwa maka ἀνακαίνωσις ma na-echekwa njikọ ya na “ọmụmụ ọzọ.”
- source_word: πνεύματος ἁγίου
  choice: site n’aka Mmụọ Nsọ
  rationale: Nke a na-egosi Mmụọ Nsọ dịka onye na-eme ka mmadụ dị ọhụrụ, ma na-ejikọta ya kpọmkwem na nkebiokwu dị ya nso.
theological_decisions:
- issue: Ihe δικαιοσύνη pụtara n’ebe a
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a okwu ahụ na-akọwa ụdị ọrụ ndị mmadụ mere. “Ezi omume” dabara nke ọma n’Igbo nkịtị, ebe ndetu na-echekwa “ikpe ziri ezi” dịka ihe ọzọ okwu Greek ahụ pụrụ ịpụta.
- issue: Ihe λουτρόν na-ezo aka na ya
  choice: ịsa ahụ, na-ekwughị kpọmkwem na ọ bụ baptizim
  alternative: ịsa ahụ nke baptizim; ịsachapụ mmehie n’ụzọ ihe atụ
  rationale: Greek nwere ike ịkpọlite echiche baptizim, ịsachapụ, ma ọ bụ ha abụọ. Isiokwu ahụ anaghị edozi esemokwu ahụ n’ụzọ otu ozizi.
- issue: Mmekọrịta πνεύματος ἁγίου na ἀνακαινώσεως
  choice: Mmụọ Nsọ bụ onye na-eme ka anyị dị ọhụrụ
  alternative: ime ọhụrụ nke Mmụọ Nsọ
  rationale: Genitive ahụ na-esochi “ime ọhụrụ” ozugbo, ya mere ịkọwa ya dịka onye na-arụ ọrụ ahụ dabara nke ọma, ebe ndetu na-echekwa nhazi ọzọ Greek ahụ kwere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Ejiri “anyị onwe anyị” chekwaa nkwusi ike Greek; e zere itinye ozizi pụrụ iche banyere baptizim n’isiokwu.
