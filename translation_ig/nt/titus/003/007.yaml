  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: ig
  text: ka, mgbe a gụrụ anyị n’onye ezi omume[b] site n’amara ya, anyị wee ghọọ ndị nketa dịka olileanya nke ndụ ebighị ebi si dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’olileanya nke ndụ ebighị ebi.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “a mara ọkwa na anyị bụ ndị ezi omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a bụ ụzọ Igbo si egosipụta nzube ma ọ bụ ihe si na ya pụta n'ụzọ doro anya ma dịkwa eke.
- source_word: δικαιωθέντες
  choice: mgbe e mere ka anyị bụrụ ndị ezi omume
  rationale: Nke a na-edobe olu nnara na omume ahụ buru ụzọ mee tupu ‘anyị wee ghọọ’; ọ naghịkwa amanye nkọwa naanị n’ụzọ ikpe ma ọ bụ naanị n’ụzọ mgbanwe ime mmụọ.
- source_word: τῇ ἐκείνου χάριτι
  choice: site n’amara ya
  rationale: ‘Site na’ na-egosi ngwa ma ọ bụ ihe e ji mee ya; ‘ya’ na-edobe ntakịrị nghọtahie dị n’onye nnọchiaha Grik n’ebughị ụzọ kpọọ onye ọ bụ aha.
- source_word: κληρονόμοι
  choice: ndị nketa
  rationale: Nke a na-edobe onyonyo nke ndị nwere ikike ịnata ihe nketa ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: γενηθῶμεν
  choice: anyị wee ghọọ
  rationale: ‘Ghọọ’ na-egosi ịbanye n’ọnọdụ ọhụrụ, kwekọrọ na γίνομαι, ma usoro ‘wee’ na-esochi ἵνα nke ọma.
- source_word: κατ’ ἐλπίδα
  choice: dịka olileanya ... si dị
  rationale: Nke a na-edobe echiche κατά nke ịdị ‘n’usoro’ ma ọ bụ ‘dịka ... si dị,’ ebe ihe ọzọ nwere ike ịbụ ‘n’olileanya.’
- source_word: ζωῆς αἰωνίου
  choice: nke ndụ ebighị ebi
  rationale: Nke a bụ ntụgharị Igbo doro anya nke na-egosi ihe olileanya ahụ metụtara.
theological_decisions:
- issue: Ihe δικαιωθέντες pụtara n’okwu nzọpụta Pọl
  choice: e mere ka anyị bụrụ ndị ezi omume
  alternative: a mara ọkwa na anyị bụ ndị ezi omume
  rationale: Nhọrọ bụ isi na-edobe olu nnara na esemokwu dị n’etiti nghọta nke ime ka mmadụ bụrụ onye ezi omume na nke ikwupụta na ọ bụ onye ezi omume; nkọwa ala peeji na-enye ụzọ nke abụọ n’emechighị okwu ahụ n’otu nkuzi.
- issue: Onye ἐκείνου (‘ya’) na-ezo aka na ya
  choice: ya, n’akpọghị onye ahụ aha kpọmkwem
  alternative: nke Chineke / nke Jizọs Kraịst
  rationale: Ịhapụ ya dịka ‘ya’ na-edobe njikọ ya na okwu nzọpụta gara aga ma zere idozi kpọmkwem onye nnọchiaha ahụ na-ezo aka na ya karịa ka amaokwu a n’onwe ya mere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. Usoro ‘ka ... anyị wee’ na-eme ka njikọ nzube pụta ìhè, ebe ‘ndị nketa’ na-edobe ihe atụ nke ihe nketa.
