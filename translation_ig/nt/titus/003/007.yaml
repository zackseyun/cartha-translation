review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the purpose clause, grace as the means, heirship, and eternal life. However, “e mere ka anyị bụrụ ndị ezi omume” naturally suggests that people were made morally righteous, whereas δικαιωθέντες more specifically denotes being reckoned/declared righteous in this context. A conventional Igbo judicial/accounting expression better preserves the Greek passive without importing an inward-transformative sense.
  naturalness: The proposed revision is clear, idiomatic Standard Igbo, and retains a suitably formal biblical register. Removing the comma immediately after “ka” also improves the flow.
  terminology: “A gụrụ anyị n’onye ezi omume” is an established, suitably concise way to convey justification in Igbo. “Ndị nketa,” “amara,” “olileanya,” and “ndụ ebighị ebi” are appropriate and consistent theological vocabulary. The pronoun “ya” properly leaves the antecedent no more explicit than the Greek clause does.
  issues:
  - severity: medium
    issue: “e mere ka anyị bụrụ ndị ezi omume” can imply moral transformation rather than justification.
    rationale: The aorist passive participle δικαιωθέντες is best represented with an Igbo expression of being accounted or declared righteous. The existing wording risks narrowing the source’s judicial/forensic semantic component.
  - severity: low
    issue: Comma placement after “ka” interrupts the purpose-clause opening.
    rationale: Standard Igbo reads more naturally without a comma directly after the subordinating conjunction.
  revised_text: ka, mgbe a gụrụ anyị n’onye ezi omume[b] site n’amara ya, anyị wee ghọọ ndị nketa dịka olileanya nke ndụ ebighị ebi si dị.[a]
  revised_footnotes:
