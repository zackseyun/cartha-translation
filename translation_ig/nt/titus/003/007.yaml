  rationale: The revision replaces a potentially transformative rendering of δικαιωθέντες with “a gụrụ anyị n’onye ezi omume,” preserving passive voice and the justification sense while avoiding a denominationally loaded explanation. It retains the draft’s careful ambiguity in “ya,” its inheritance imagery, and its alternative for κατ’ ἐλπίδα.
