  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: ig
  text: Ndị niile mụ na ha nọ na-ekele gị. Kelee ndị hụrụ anyị n’anya n’okwukwe[a]. Ka amara dịnyere unu niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’okwukwe ahụ”; ma ọ bụ “n’ikwesị ntụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: na-ekele
  rationale: N’ebe a, ἀσπάζομαι bụ ekele a na-eziga ná ngwụcha akwụkwọ ozi; “na-ekele” bụ okwu Igbo doro anya ma dịkwa nkenke.
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: Ndị niile mụ na ha nọ
  rationale: Nke a na-egosi ndị niile ha na Pọl nọ, ma na-edobe πάντες, ya bụ “niile,” na mmekọrịta μετά, “mụ na ha nọ.”
- source_word: ἄσπασαι
  choice: Keleekwa
  rationale: Ụdị iwu nke ἀσπάζομαι ka a sụgharịrị “Keleekwa”; “-kwa” na-eme ka njikọ ya na ekele dị n’ahịrịokwu bu ụzọ bụrụ ihe e ji asụsụ Igbo ekwu nke ọma.
- source_word: φιλοῦντας
  choice: ndị hụrụ anyị n’anya
  rationale: φιλέω na-egosi ịhụnanya na mmetụta mmadụ nwere n’ebe ibe ya nọ; “hụrụ anyị n’anya” bụ ụzọ Igbo nkịtị na nke kwesịrị ekwesị isi kwuo ya.
- source_word: ἐν πίστει
  choice: n’okwukwe
  rationale: “N’okwukwe” na-edobe ụzọ okwu Grik si ghere oghe ma na-egosi okwukwe dịka ọnọdụ ma ọ bụ ihe jikọrọ ịhụnanya ahụ; a hapụrụ nghọta ndị ọzọ n’okpuru peeji.
- source_word: ἡ χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị eme ihe maka χάρις n’ọgụgụ isiokwu a, karịchaa n’ọ祝 ngọzi ndịozi.
- source_word: μετὰ πάντων ὑμῶν
  choice: dịnyere unu niile
  rationale: E tinyere ngwaa “dịnyere,” nke dị n’echiche ọ bụ ezie na edeghị ya n’asụsụ Grik; “unu niile” na-edobe πάντων ma gosikwa na ὑμῶν bụ ọtụtụ mmadụ.
theological_decisions:
- issue: Nkọwa πίστις n’okwu ἐν πίστει
  choice: okwukwe
  alternative: okwukwe ahụ; ikwesị ntụkwasị obi
  rationale: “Okwukwe” bụ nghọta kacha kwekọọ n’ebe a dịka ihe jikọrọ ndị kwere ekwe n’ịhụnanya, ma ihe odide Grik nwekwara ike izo aka n’“okwukwe ahụ” ma ọ bụ n’“ikwesị ntụkwasị obi.” Ya mere, e dobeghị otu nkọwa dịka naanị nke ga-ekwe omume; e gosiri ndị ọzọ n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Gị” n’ahịrịokwu mbụ na-egosi onye otu Titus, ebe “unu niile” n’ọ祝 ngọzi ikpeazụ na-edobe ụdị ọtụtụ mmadụ dị na Grik. E debere ahịrịokwu ndị ahụ nkenke dịka ekele mmechi akwụkwọ ozi.
