revisions:
- from: n’olileanya nke ndụ ebighị ebi, nke Chineke, onye na-adịghị agha ụgha, kwere ná nkwa tupu oge niile amalite.[a]
  to: n’olileanya nke ndụ ebighị ebi, nke Chineke onye na-adịghị ekwu ụgha kwere ná nkwa tupu ọgbọ niile amalite.[a]
  rationale: The revision improves idiomatic Standard Igbo for God’s truthfulness and brings the temporal phrase closer to the Greek and the English audit trail. It leaves unresolved whether the phrase refers to “before time began,” a divine decree, or any particular recipient of the promise.
  reviewer_model: gpt-5.6-terra
