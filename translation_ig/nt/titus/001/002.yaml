base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: ig
  text: n’olileanya nke ndụ ebighị ebi, nke Chineke onye na-adịghị ekwu ụgha kwere ná nkwa tupu ọgbọ niile amalite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “tupu oge amalite.” N’asụsụ Grik, okwu ahụ na-ekwu n’ụzọ nkịtị banyere “tupu oge ebighị ebi” ma ọ bụ “tupu oge ndị na-adịte aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: n’olileanya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji asụ asụsụ nke ọma iji gosi na ozi Pọl metụtara olileanya ahụ, n’ebughị ụzọ kpebie ma ἐπί pụtara ntọala, ọnọdụ, ma ọ bụ ebumnuche.
- source_word: ζωῆς αἰωνίου
  choice: nke ndụ ebighị ebi
  rationale: Ọ na-egosi na ndụ ebighị ebi bụ ihe olileanya ahụ lekwasịrị anya na ya, ma na-echekwa ma echiche ogologo oge ya ma mkpa okwu ahụ nwere n’Agba Ọhụrụ.
- source_word: ἣν
  choice: nke
  rationale: Nnochiaha a na-ezo aka n’‘ndụ ebighị ebi,’ nke kwekọrọ na ụdị nwanyị otu ihe nke okwu Grik ahụ, kama ịtụgharị ya ka ọ na-ezo aka n’olileanya.
- source_word: ἐπηγγείλατο
  choice: kwere ná nkwa
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ n’omume nke ikwe nkwa; ọ dịghị mkpa ịmanye ọdịdị middle nke ngwaa Grik ahụ n’Igbo.
- source_word: ὁ ἀψευδὴς θεὸς
  choice: Chineke, onye na-adịghị agha ụgha
  rationale: Ọ na-egosi kpọmkwem na Chineke adịghị ekwu ụgha, na-enweghị ime ka okwu ahụ sie ike karịa adjective Grik site n’ịsị na ọ ‘pụtaghị na ọ pụrụ’ ịgha ụgha.
- source_word: πρὸ χρόνων αἰωνίων
  choice: tupu oge niile amalite
  rationale: Nke a na-echekwa echiche nke ihe mere tupu oge ma ọ bụ ọgbọ ndị ahụ amalite, n’asụsụ Igbo dị ugbu a, ma ghara ịkọwa kpọmkwem ihe omimi banyere ọdịdị oge.
theological_decisions:
- issue: Okwu oge πρὸ χρόνων αἰωνίων na nkwa Chineke
  choice: tupu oge niile amalite
  alternative: tupu oge amalite; tupu oge ebighị ebi
  rationale: Nsụgharị a na-edobe nkwa ahụ tupu oge ndị a maara n’akụkọ ihe mere eme, ma ọ naghị ekpebi onye e kwere nkwa ahụ ma ọ bụ otú nkwa ahụ si dị tupu oge amalite.
- issue: Nkọwa Chineke dị ka ἀψευδής
  choice: Chineke, onye na-adịghị agha ụgha
  alternative: Chineke, onye na-apụghị ịgha ụgha; Chineke onye eziokwu
  rationale: Nhọrọ a na-anọ nso n’ókè adjective Grik ahụ ma na-ezere itinye nkwupụta siri ike karịa ihe amaokwu ahụ kwuru kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ya. ‘Olileanya,’ ‘ndụ ebighị ebi,’ na ‘kwere ná nkwa’ bụ okwu ndị a maara nke ọma n’Igbo Ndị Kraịst, ma ahịrịokwu ahụ ka bụ nke onye Igbo oge a pụrụ ịghọta. E debere mgbagwoju anya nke okwu oge ahụ n’ala ala peeji.
