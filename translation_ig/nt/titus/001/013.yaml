  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: ig
  text: Àmà a bụ eziokwu. N’ihi nke a, baara ha mba n’ụzọ siri ike, ka ha wee dị mma n’okwukwe,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha wee dị mma n’okwukwe ha.” Nkebiokwu Grik ahụ nwere ike ịpụta ịbụ ndị dị mma n’okwukwe nke ha, ma ọ bụ ịdị mma n’okwukwe Ndị Kraịst dịka nchịkọta ozizi.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: àmà
  rationale: “Àmà” na-egosi okwu akaebe e kwuru banyere ndị Krit n’amaokwu bu ụzọ ma na-echekwa echiche nke ịgba akaebe.
- source_word: ἀληθής
  choice: eziokwu
  rationale: Nke a na-ekwu na àmà ahụ kwekọrọ n’eziokwu; okwu a bụ nke doro anya ma bụrụkwa Igbo nkịtị.
- source_word: δι’ ἣν αἰτίαν
  choice: N’ihi nke a
  rationale: Ọ na-egosi ihe mere iwu na-esonụ ji dị mkpa, dabere n’ihe e kwuru n’ihu.
- source_word: ἔλεγχε
  choice: baara ha mba
  rationale: Ọ na-egosi ịkpọ njehie ha asị n’ihu ha iji dozie ha, ọ bụghị nanị ịkụziri ha nwayọọ.
- source_word: ἀποτόμως
  choice: nke ukwuu
  rationale: N’ebe a, ọ na-egosi mba siri ike ma kwụ ọtọ; “nke ukwuu” na-enye ike okwu ahụ n’Igbo eke n’enweghị echiche nke ntaramahụhụ anụ ahụ.
- source_word: ὑγιαίνωσιν
  choice: ka ha wee guzosie ike
  rationale: Ngwaa ahụ sitere n’echiche ahụ ike ma n’ebe a na-ekwu maka ọnọdụ okwukwe ziri ezi. “Guzosie ike” bụ ụzọ Igbo doro anya isi kwupụta ịdị mma na enweghị ntụpọ n’okwukwe.
- source_word: ἐν τῇ πίστει
  choice: n’okwukwe
  rationale: Nkebiokwu a nwere ike ịpụta ọnọdụ okwukwe ha ma ọ bụ okwukwe Ndị Kraịst dịka ozizi a na-ekwere. Nsụgharị a na-ahapụ ohere abụọ ahụ kama ịmanye otu naanị.
theological_decisions:
- issue: Ihe ἐν τῇ πίστει pụtara
  choice: n’okwukwe
  alternative: n’okwukwe Ndị Kraịst
  rationale: N’akwụkwọ ozi ndị a, okwu ahụ nwere ike izo aka n’okwukwe dịka nchịkọta ozizi Ndị Kraịst; ma ọ pụkwara ịkọwa ịdị mma n’ikw 믿ere ha. E debere mgbagwoju anya a n’isiokwu, kọwaakwa ya n’okpuru.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ahịrịokwu dị mkpirikpi na okwu a na-anụkarị mee ka iwu Pọl siri ike pụta ìhè, ma e chekwara nghọtahie dị na ἐν τῇ πίστει site n’ihe odide ukwu na nkọwa ala peeji.
