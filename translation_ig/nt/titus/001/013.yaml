review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the causal connection, the imperative to rebuke, and the purpose clause. However, “guzosie ike” means to stand firm/persevere and does not adequately render ὑγιαίνωσιν, whose health/soundness metaphor is central in this context.
  naturalness: “Baara ha mba nke ukwuu” is understandable, but “baara ha mba n’ụzọ siri ike” more naturally expresses the manner denoted by ἀποτόμως. “Ka ha wee dị mma n’okwukwe” is a natural Standard Igbo way to retain the figurative sense of being healthy/sound in faith.
  terminology: “Àmà a bụ eziokwu” is acceptable for ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. The revised wording retains the ambiguity of ἐν τῇ πίστει; the footnote distinguishes personal faith from the Christian faith understood as a body of teaching without making either reading mandatory.
  issues:
  - severity: medium
    issue: “ka ha wee guzosie ike n’okwukwe” for ἵνα ὑγιαίνωσιν ἐν τῇ πίστει
    rationale: “Guzosie ike” conveys firmness or perseverance, rather than the source verb’s metaphor of health/soundness. This alters the stated goal of rebuke.
  - severity: low
    issue: “baara ha mba nke ukwuu” for ἔλεγχε αὐτοὺς ἀποτόμως
    rationale: The phrase can intensify the rebuke, but it is less precise about the sharp/stern manner of rebuking than “n’ụzọ siri ike.”
  - severity: low
    issue: Footnote wording does not clearly preserve the two alternatives represented in the English audit trail
    rationale: “Ịdị ike” and “ịdị ziri ezi” are not the most direct Igbo expressions for being healthy/sound. The note should contrast soundness in their own faith with soundness in the Christian faith as a body of teaching.
  revised_text: Àmà a bụ eziokwu. N’ihi nke a, baara ha mba n’ụzọ siri ike, ka ha wee dị mma n’okwukwe,[a]
  revised_footnotes:
