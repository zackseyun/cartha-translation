    text: Ma ọ bụ, “ka ha wee dị mma n’okwukwe ha.” Nkebiokwu Grik ahụ nwere ike ịpụta ịbụ ndị dị mma n’okwukwe nke ha, ma ọ bụ ịdị mma n’okwukwe Ndị Kraịst dịka nchịkọta ozizi.
    reason: alternative_reading
  revision_rationale: The revision replaces a perseverance expression with wording that preserves the source’s health/soundness metaphor, sharpens the manner of rebuke, and revises the footnote to state both viable senses of ἐν τῇ πίστει clearly in Standard Igbo.
