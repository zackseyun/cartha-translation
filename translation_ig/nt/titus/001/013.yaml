revisions:
- from: Àmà a bụ eziokwu. N’ihi nke a, baara ha mba nke ukwuu, ka ha wee guzosie ike n’okwukwe,[a]
  to: Àmà a bụ eziokwu. N’ihi nke a, baara ha mba n’ụzọ siri ike, ka ha wee dị mma n’okwukwe,[a]
  rationale: The revision replaces a perseverance expression with wording that preserves the source’s health/soundness metaphor, sharpens the manner of rebuke, and revises the footnote to state both viable senses of ἐν τῇ πίστει clearly in Standard Igbo.
  reviewer_model: gpt-5.6-terra
