review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the necessity expressed by δεῖ, the office term ἐπίσκοπον, and the sequence of required negative qualities. However, “Ọ gaghị abụ” normally has a future/prohibitive sense (“he will not/must not be”), whereas the Greek states present qualifications under δεῖ. The revision retains the required-qualification sense throughout.
  naturalness: Most wording is clear Standard Igbo. A semicolon and repeated present habitual negatives make the qualification list more idiomatic and prevent the unintended future reading. “Onye na-achọ naanị uche ya” is more natural and focused for αὐθάδη than the longer “onye isiike nke na-eme naanị uche nke ya.”
  terminology: “Onye nlekọta” is an appropriate non-denominational rendering of ἐπίσκοπος. “Onye Chineke nyefere ọrụ nlekọta” clearly expresses θεοῦ οἰκονόμον without importing a later ecclesiastical office. The rendering of αἰσχροκερδής retains both greed and the disgraceful character of the gain.
  issues:
  - severity: medium
    issue: “Ọ gaghị abụ” changes the force of the qualification list.
    rationale: The Greek μὴ + adjectives, governed by δεῖ ... εἶναι, means that the overseer must not be characterized by these traits. In ordinary Igbo, “Ọ gaghị abụ” can sound future-oriented or like a prohibition rather than a present requisite.
  - severity: low
    issue: The main-text phrase for αὐθάδη is unnecessarily expanded and somewhat imprecise.
    rationale: “Onye isiike” can suggest harshness or domineering behavior. “Onye na-achọ naanị uche ya” directly conveys the self-pleasing/self-willed sense.
  - severity: low
    issue: Footnote b’s alternative is narrower than the note’s explanation.
    rationale: “Uru aghụghọ” focuses on fraud, while αἰσχροκερδής includes gain pursued in morally disgraceful ways more broadly. The revised footnote labels the narrower wording explicitly as an alternative while preserving the broader explanation.
  revised_text: N’ihi na onye nlekọta[a] aghaghị ịbụ onye a na-enweghị ihe a pụrụ ịta ya ụta, dịka onye Chineke nyefere ọrụ nlekọta; ọ ghaghị ịbụ onye na-achọ naanị uche ya, onye na-adịghị ewe iwe ngwa ngwa, onye na-adịghị aṅụbiga mmanya ókè, onye na-adịghị eme ihe ike, ma ọ bụ onye na-adịghị enwe anyaukwu maka uru e nwetara n’ụzọ ihere[b].
