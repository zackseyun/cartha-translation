id: TIT.1.7
reference: Titus 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: ig
  text: N’ihi na onye nlekọta[a] aghaghị ịbụ onye a na-enweghị ihe a pụrụ ịta ya ụta, dịka onye Chineke nyefere ọrụ nlekọta; ọ ghaghị ịbụ onye na-achọ naanị uche ya, onye na-adịghị ewe iwe ngwa ngwa, onye na-adịghị aṅụbiga mmanya ókè, onye na-adịghị eme ihe ike, ma ọ bụ onye na-adịghị enwe anyaukwu maka uru e nwetara n’ụzọ ihere[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “bishọp.” Okwu Grik a pụtara onye na-elekọta ma na-ahụ maka ndị ọzọ; “onye nlekọta” anaghị ebubata echiche pụrụ iche banyere ọkwa ọchịchị ụka nke bilitere n’oge e mesịrị.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “onye anyaukwu maka uru aghụghọ.” Okwu Grik ahụ na-emesi uru a na-achọ n’ụzọ rụrụ arụ ma ọ bụ nke ihere ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεῖ
  choice: aghaghị
  rationale: Na-egosi mkpa na iwu siri ike n’ụzọ Igbo doro anya, kama okwu dị nro dịka ‘kwesịrị.’
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejigide njikọ nkọwa amaokwu a na ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: ἐπίσκοπον
  choice: onye nlekọta
  rationale: Na-egosipụta onye ọrụ ya bụ ilekọta na ile anya n’isi ndị ọzọ, na-etinyeghị echiche ọchịchị ụka e mesịrị n’ime okwu ahụ.
- source_word: ἀνέγκλητον
  choice: onye a na-enweghị ihe a pụrụ ịta ya ụta
  rationale: Na-egosi na e nweghị ebubo ziri ezi a pụrụ iweta megide ya, n’emeghị ka okwu ahụ pụta na onye ahụ enweghị mmehie ọ bụla.
- source_word: ὡς θεοῦ οἰκονόμον
  choice: dịka onye na-elekọta ihe Chineke nyere ya n’aka
  rationale: Na-egosipụta ọrụ nlekọta na ịza ajụjụ nye Chineke, n’asụ Igbo nkịtị ma dị ùgwù.
- source_word: αὐθάδη
  choice: onye isiike nke na-eme naanị uche nke ya
  rationale: Na-ejikọta isiike, ịchọ ihe masịrị onwe onye, na ịgbaso uche nke onwe, nke okwu Grik ahụ nwere ike ịpụta.
- source_word: ὀργίλον
  choice: onye iwe na-ewe ngwa ngwa
  rationale: Na-egosi àgwà mmadụ nke na-adị ngwa iwe, ọ bụghị naanị otu omume iwe.
- source_word: πάροινον
  choice: onye na-aṅụbiga mmanya ókè
  rationale: Na-egosi omume ịṅụ mmanya gabiga ókè n’ebughị ụzọ kpọọ onye ahụ onye aṅụrụma riri ahụ.
- source_word: πλήκτην
  choice: onye na-eme ihe ike
  rationale: Ọ bụ okwu Igbo a na-aghọta ngwa ngwa maka onye na-akụ mmadụ ma ọ bụ na-akpa àgwà ime ihe ike.
- source_word: αἰσχροκερδῆ
  choice: onye anyaukwu maka uru e nwetara n’ụzọ ihere
  rationale: Na-echekwa ma echiche anyaukwu ma àgwà ọjọọ ma ọ bụ ihe ihere metụtara uru ahụ; ọ bụghị naanị uru megidere iwu.
theological_decisions:
- issue: Otu e si asụgharị ἐπίσκοπος dịka ọrụ dị n’ọgbakọ ndị kwere ekwe
  choice: onye nlekọta
  alternative: bishọp
  rationale: ‘Onye nlekọta’ na-egosipụta isi ihe okwu Grik pụtara n’ebughị echiche ụka ma ọ bụ usoro ọchịchị e guzobere n’oge e mesịrị bata n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke doro anya ma dị ùgwù, mee ntụgharị a. E kewara ogologo usoro Grik ahụ ụzọ ahịrịokwu abụọ ka ọ bụrụ Igbo eke ma dị mfe nghọta, ma e chekwara usoro àgwà niile na njikọ nkọwa nke γὰρ.
