revisions:
- from: N’ihi na onye nlekọta[a] aghaghị ịbụ onye a na-enweghị ihe a pụrụ ịta ya ụta, dịka onye na-elekọta ihe Chineke nyere ya n’aka. Ọ gaghị abụ onye isiike nke na-eme naanị uche nke ya, onye iwe na-ewe ngwa ngwa, onye na-aṅụbiga mmanya ókè, onye na-eme ihe ike, ma ọ bụ onye anyaukwu maka uru e nwetara n’ụzọ ihere[b].
  to: N’ihi na onye nlekọta[a] aghaghị ịbụ onye a na-enweghị ihe a pụrụ ịta ya ụta, dịka onye Chineke nyefere ọrụ nlekọta; ọ ghaghị ịbụ onye na-achọ naanị uche ya, onye na-adịghị ewe iwe ngwa ngwa, onye na-adịghị aṅụbiga mmanya ókè, onye na-adịghị eme ihe ike, ma ọ bụ onye na-adịghị enwe anyaukwu maka uru e nwetara n’ụzọ ihere[b].
  rationale: The revision corrects the modal/aspectual force of the negative qualifications, improves the rendering of self-willed, and makes the stewardship phrase explicit and natural in Standard Igbo. It preserves the source’s single explanatory sentence and every listed qualification, without adding ecclesiastical or doctrinal implications.
