id: TIT.1.9
reference: Titus 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: ig
  text: Ọ ghaghị ijidesi okwu ahụ a pụrụ ịtụkwasị obi ike, nke kwekọrọ n’ozizi ahụ,[a] ka o wee nwee ike iji ozizi ziri ezi dụọ ndị mmadụ ọdụ, baakwa ndị na-ekwu okwu megide ya mba.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ijidesi okwu ahụ kwesịrị ntụkwasị obi ike dị ka ozizi ahụ si dị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “gosikwa ndị na-ekwu okwu megide ya na ha ezighị ezi.” Okwu Grik ahụ nwere ike ịpụta ikpughe njehie ma ọ bụ igosi na mmadụ ezighị ezi, tinyere ịba ya mba.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: ijidesi ... ike
  rationale: Nkebiokwu a na-egosi ịrapara n’ihe nke ọma na ịnọgide na-ejide ya; ọ bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: πιστοῦ λόγου
  choice: okwu ahụ a pụrụ ịtụkwasị obi
  rationale: πιστός n’ebe a na-akọwa okwu ahụ dị ka nke kwesiri ntụkwasị obi, ọ bụghị dị ka okwu nke onye kwere ekwe.
- source_word: κατὰ τὴν διδαχήν
  choice: nke kwekọrọ n’ozizi ahụ
  rationale: κατά na-egosi na okwu ahụ dabara n’ozizi ahụ ma na-agbaso ya; njirimara ‘ahụ’ na-echekwa echiche nke ozizi a maara ama.
- source_word: παρακαλεῖν
  choice: dụọ ndị mmadụ ọdụ
  rationale: N’ọnọdụ a, παρακαλέω gụnyere ịgba ume na ịrịọsi ike n’ụzọ nwere ikike; ‘dụọ ... ọdụ’ na-enye echiche ahụ n’Igbo nkịtị.
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: iji ozizi ziri ezi
  rationale: ὑγιαίνω bụ ihe atụ nke pụtara ihe dị mma ma na-enweghị ntụpọ; ‘ozizi ziri ezi’ bụ ụzọ Igbo nke oge a si akọwa sound teaching n’enweghị okwu ụka siri ike.
- source_word: ἀντιλέγοντας
  choice: ndị na-ekwu okwu megide ya
  rationale: Nke a na-echekwa isi echiche nke ikwu okwu megide ozi ma ọ bụ ozizi ahụ, kama ime ka ọ bụrụ naanị mmegide n’omume.
- source_word: ἐλέγχειν
  choice: baakwa ... mba
  rationale: Nhọrọ a na-echekwa ike nke ịdọ aka ná ntị na ịgbazi ndị mmegide; ihe ọzọ ọ pụrụ ịpụta, bụ́ igosi na ha ezighị ezi, dị n’okpuru peeji.
- source_word: δυνατὸς ᾖ
  choice: ka o wee nwee ike
  rationale: Nke a na-egosipụta ikike ma na-echekwa ebumnuche nke ἵνα n’Igbo dị mfe.
theological_decisions:
- issue: Ihe ‘ozizi ahụ’ na ‘okwu ahụ a pụrụ ịtụkwasị obi’ na-ezo aka na ya
  choice: A sụgharịrị ha dị ka ozi na ozizi Ndị Kraịst a maara ama nke onye ndu ga-ejidesi ike.
  alternative: Ozizi omume ọma n’ozuzu ya, ma ọ bụ echiche nke onye ndu n’onwe ya.
  rationale: Njirimara dị na διδαχή na ojiji πιστὸς λόγος n’Akwụkwọ Ozi Ndị Ọzụzụ Atụrụ na-egosi ozizi e nyere ma mara ama, ma nsụgharị ahụ etinyeghị usoro nkwenkwe nke e guzobere n’oge e mesịrị.
- issue: Ike na obosara ihe ἐλέγχειν pụtara
  choice: baara ... mba
  alternative: gosi ndị na-ekwu okwu megide ya na ha ezighị ezi
  rationale: Amaokwu ahụ jikọtara ọrụ ọma nke ịdụ ọdụ na ọrụ ịgbazi mmegide. Isi ederede na-echekwa ụda ịba mba, ebe ihe e dere n’okpuru peeji na-echekwa echiche nke ịkọwa ma ọ bụ igosi njehie.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. ‘Ijidesi ... ike,’ ‘dụọ ... ọdụ,’ na ‘baakwa ... mba’ bụ okwu ndị mmadụ na-aghọta nke ọma; e zere okwu ụka pụrụ iche na nkọwa nke otu ụka.
