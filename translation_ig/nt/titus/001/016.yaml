  rationale: The revision retains the draft’s faithful rendering while making the present-tense practical denial idiomatic in Igbo and replacing the redundant, source-unwarranted “kwa” construction with a natural expression for being unfit. The footnote set remains anchored and sequential, and footnote d retains the legitimate alternative sense ‘disqualified/rejected.’
