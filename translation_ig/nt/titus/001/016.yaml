base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: ig
  text: Ha na-ekwupụta na ha maara Chineke[a], ma n'omume ha ha na-agọnahụ ya[b]. Ha bụ ndị a na-asọ oyi[c], ndị na-enupụ isi, na ndị na-adịghị eru maka ezi ọrụ ọ bụla[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha na-azọrọ na ha maara Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ma site n'ọrụ ha, ha na-agọnahụ ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị bụ ihe arụ.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “ndị a jụrụ maka ezi ọrụ ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: Chineke
  rationale: Ọ bụ ihe nnara nke ahịrịokwu ahụ, bụrụkwa okwu Igbo a na-ejikarị akọwa onye ha na-ekwu na ha maara.
- source_word: ὁμολογοῦσιν
  choice: na-ekwupụta
  rationale: N'ebe a, okwu ahụ na-egosi nkwupụta ọnụ nke omume ha na-emegide; “na-ekwupụta” na-edobe ọdịiche ahụ n'ụzọ doro anya.
- source_word: εἰδέναι
  choice: na ha maara
  rationale: Nke a na-asụgharị infinitive ahụ n'Igbo eke, na-egosi ihe ha na-ekwupụta banyere mmekọrịta ha na Chineke.
- source_word: τοῖς δὲ ἔργοις
  choice: ma ha ji omume ha
  rationale: “Ji” na-egosi ụzọ ma ọ bụ ihe e ji eme ihe, ebe “omume” na-egosi omume ndụ ha, ọ bụghị naanị ọrụ aka.
- source_word: ἀρνοῦνται
  choice: agọnahụ ya
  rationale: Nke a na-edobe ike nke nkwuwa okwu Grik ma na-eburu “Chineke” n'ihu dị ka onye ha na-agọnahụ.
- source_word: βδελυκτοὶ
  choice: ndị a na-asọ oyi
  rationale: Ọ na-egosi na ha bụ ndị omume ọjọọ ha mere ka a kpọọ ha asị, ma na-edobe ịdị njọ nke okwu Grik n'Igbo a na-aghọta ugbu a.
- source_word: ὄντες
  choice: Ha bụ
  rationale: E kewara participle ahụ ka ọ bụrụ ahịrịokwu Igbo zuru ezu iji mee ka ndepụta nkọwa ndị na-esochi ya doo anya ma bụrụ nke eke.
- source_word: ἀπειθεῖς
  choice: ndị na-enupụ isi
  rationale: Ọ na-egosi ịjụ irube isi n'ụzọ doro anya ma dabara n'ọnọdụ omume na okwukwe nke amaokwu ahụ.
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: maka ezi ọrụ ọ bụla
  rationale: Nke a na-egosi ihe ha na-erughị eru ime, ma na-echekwa ịdị obosara nke πᾶν.
- source_word: ἀδόκιμοι
  choice: ndị na-erughịkwa eru
  rationale: Ọ na-egosi na ha adịghị mma ma ọ bụ adịghị njikere iru ụkpụrụ a chọrọ maka ezi ọrụ, n'enweghị itinye nkọwa pụrụ iche na-adịghị n'amaokwu ahụ.
theological_decisions:
- issue: Mmekọrịta dị n'etiti nkwupụta ọnụ na ịgọnahụ site n'omume
  choice: Ha na-ekwu na ha maara Chineke, ma omume ha na-arụ ọrụ dị ka ịgọnahụ ya.
  alternative: A pụrụ ịghọta ya dị ka ịgọnahụ eziokwu Chineke n'ozuzu, kama ịgọnahụ Chineke n'onwe ya.
  rationale: “Chineke” bụ ihe nnara e kwuru kpọmkwem na nkebi mbụ, ya mere nkebi nke abụọ na-eburu ya n'ihu n'ụzọ eke. Nsụgharị ahụ na-echekwa esemokwu dị n'etiti okwu ọnụ na omume n'etinyeghị ozizi ọzọ n'ime ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu Grik ahụ ụzọ abụọ maka ịdị eke n'Igbo, ma njikọ echiche na ike nke nkatọ ahụ ka echekwara. “Omume” na-ezo aka n'ihe ha na-eme ná ndụ, ebe “ezi ọrụ” na-edobe okwu a na-ejikarị eme ihe n'okwu gbasara omume ọma.
