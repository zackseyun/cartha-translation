  text: but hospitable[a], loving what is good, self-controlled, upright, holy, and disciplined[d][c][b],
translation:
  language: ig
  text: kama, ọ ga-abụ onye na-anabata ndị ọbịa, onye hụrụ ihe ọma n’anya, onye nwere uche ziri ezi, onye ziri ezi, onye dị nsọ, na onye na-ejide onwe ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Okwu Grik abụọ e ji kọwaa àgwà ndị a nwere njikọ: “onye nwere uche ziri ezi” (σώφρονα) na-egosi echiche ziri ezi, ịdị akọ, na imeru ihe n’ókè; “onye na-ejide onwe ya” (ἐγκρατῆ) na-emesi imeri ọchịchọ na mkpali ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: kama
  rationale: Ọ na-egosi ọdịiche dị n’etiti àgwà ọjọọ ndị e kwuru n’amaokwu gara aga na àgwà ọma ndị a chọrọ n’ebe a.
- source_word: φιλόξενον
  choice: onye na-anabata ndị ọbịa
  rationale: Nke a na-egosi onye ji obi ọma anabata ndị ọbịa na ndị bịara ọhụrụ; ọ bụ okwu Igbo doro anya ma dịkwa n’ụzọ e si ekwu okwu ugbu a.
- source_word: φιλάγαθον
  choice: onye hụrụ ihe ọma n’anya
  rationale: 'Ọ na-edobe echiche kpọmkwem nke okwu Grik ahụ: ịhụ ihe dị mma n’anya.'
- source_word: σώφρονα
  choice: onye nwere uche zuru oke
  rationale: Okwu ahụ gụnyere iche echiche nke ọma, ịdị akọ, na ịchịkwa omume; nsụgharị a na-enyekwa ohere ịmata ọdịiche ya na ἐγκρατῆ.
- source_word: δίκαιον
  choice: onye ezi omume
  rationale: N’usoro àgwà a, okwu ahụ na-egosi ibi ndụ ziri ezi na ime ihe kwesiri ekwesi, ọ bụghị naanị ikpe ikpe n’ụzọ ziri ezi.
- source_word: ὅσιον
  choice: onye dị nsọ
  rationale: Ọ na-egosi ndụ nke kwekọrọ n’ihe dị nsọ na nrubeisi nye Chineke, na-enweghị ịgbakwunye nkọwa nke otu ụka.
- source_word: ἐγκρατῆ
  choice: onye na-ejide onwe ya
  rationale: Ọ na-emesi ikike mmadụ nwere ịchịkwa agụụ na mkpali ya ike, ma na-edobe ọdịiche dị n’etiti ya na σώφρονα.
theological_decisions:
- issue: Ịmata ọdịiche dị n’etiti σώφρονα na ἐγκρατῆ, bụ́ àgwà ọma abụọ yiri onwe ha
  choice: A sụgharịrị σώφρονα ka ọ bụrụ “onye nwere uche zuru oke,” sụgharịa ἐγκρατῆ ka ọ bụrụ “onye na-ejide onwe ya.”
  alternative: A pụrụ ịsụgharị ha dịka “onye na-achịkwa onwe ya” na “onye nwere ọzụzụ,” ma ọ bụ jiri okwu abụọ ndị ọzọ yiri onwe ha.
  rationale: 'Okwu Grik abụọ ahụ nwere njikọ ma ha abụghị otu ihe kpamkpam: nke mbụ na-elekwasị anya n’uche ziri ezi na ịdị akọ, nke ikpeazụ na-elekwasị anya n’ịchịkwa ọchịchọ na mkpali. Nsụgharị a anaghị agwakọta ha.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta àgwà nke Grik, ma jiri nkebi ahịrịokwu “onye...” mee ka ụdị adjective ndị Grik pụta nke ọma n’Igbo. Akara ntụaka [a] dị n’isiokwu ahụ ma kwekọọ na nkọwa ala peeji.
