- from: kama ọ ga-abụ onye na-anabata ndị ọbịa, onye hụrụ ihe ọma n’anya, onye nwere uche zuru oke, onye ezi omume, onye dị nsọ, na onye na-ejide onwe ya.[a]
  to: kama, ọ ga-abụ onye na-anabata ndị ọbịa, onye hụrụ ihe ọma n’anya, onye nwere uche ziri ezi, onye ziri ezi, onye dị nsọ, na onye na-ejide onwe ya.[a]
