revisions:
- from: ọ bụrụ na onye ahụ bụ onye a na-apụghị ibo ebubo kwesị ekwesị, bụrụ di nke otu nwunye,[a] nwee ụmụ ndị kwesịrị ntụkwasị obi,[b] ndị a na-adịghị ebo ebubo ibi ndụ ọjọọ na-enweghị njide onwe onye, ndị na-enupụkwaghị isi.
  to: ọ bụrụ na onye ọ bụla bụ onye a na-enweghị ihe a pụrụ iji boro ebubo, bụrụ di nke otu nwunye,[a] nwee ụmụ ndị kwesịrị ntụkwasị obi,[b] ndị a na-adịghị ebubo na ha na-ebi ndụ enweghị njide onwe onye ma ọ bụ na-enupụ isi.
  rationale: The revision corrects the idiom for ‘above reproach’ and removes the unintended ‘no longer’ from the final qualification. It keeps the male-specific Greek marital idiom transparent, preserves the disputed sense of πιστά in the footnote, and retains the accusation nuance of ἐν κατηγορίᾳ for both following descriptions.
  reviewer_model: gpt-5.6-terra
