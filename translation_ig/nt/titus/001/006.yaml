base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: ig
  text: ọ bụrụ na onye ọ bụla bụ onye a na-enweghị ihe a pụrụ iji boro ebubo, bụrụ di nke otu nwunye,[a] nwee ụmụ ndị kwesịrị ntụkwasị obi,[b] ndị a na-adịghị ebubo na ha na-ebi ndụ enweghị njide onwe onye ma ọ bụ na-enupụ isi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwoke nke otu nwanyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụmụ ndị kwere ekwe.” Okwu Grik bụ πιστά nwere ike ịpụta “ndị kwesịrị ntụkwasị obi” ma ọ bụ “ndị kwere ekwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: onye a na-apụghị ibo ebubo kwesị ekwesị
  rationale: Nke a na-egosi na e nweghị ebubo ziri ezi a pụrụ ịkwado megide ya; ọ naghị ekwu na onye ahụ enweghị mmehie ọ bụla.
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: di nke otu nwunye
  rationale: Ọ na-esochi ọdịdị okwu Grik n'ụzọ doro anya ma hapụ ajụjụ nkọwa gbasara ọnọdụ alụmdi na nwunye na ikwesị ntụkwasị obi ka ha ghara ikpebi n'ime ntụgharị.
- source_word: τέκνα
  choice: ụmụ
  rationale: Nke a bụ okwu Igbo nkịtị na nke sitere n'okike maka ụmụ mmadụ n'ọnọdụ ezinụlọ.
- source_word: πιστά
  choice: ndị kwesịrị ntụkwasị obi
  rationale: πιστά nwere ike ịpụta ndị kwesịrị ntụkwasị obi ma ọ bụ ndị kwere ekwe. Isi ederede jiri nkọwa sara mbara, ebe ihe odide ala peeji chekwara nke ọzọ.
- source_word: κατηγορίᾳ
  choice: ndị a na-adịghị ebo ebubo
  rationale: Nke a chekwara echiche nke ebubo dị n'okwu ἐν κατηγορίᾳ ma mee ka ahịrịokwu ahụ bụrụ Igbo sitere n'okike.
- source_word: ἀσωτίας
  choice: ibi ndụ ọjọọ na-enweghị njide onwe onye
  rationale: Nkebiokwu a na-egosi ndụ mmefu na omume rụrụ arụ nke na-enweghị njide onwe onye, n'asụsụ ndị nkịtị ga-aghọta.
- source_word: ἀνυπότακτα
  choice: ndị na-enupụ isi
  rationale: Ọ na-egosi ịjụ ido onwe n'okpuru ọchịchị ma ọ bụ usoro kwesịrị ekwesị.
theological_decisions:
- issue: Ihe πιστά pụtara na τέκνα ἔχων πιστά
  choice: ụmụ ndị kwesịrị ntụkwasị obi
  alternative: ụmụ ndị kwere ekwe
  rationale: Okwu Grik ahụ nwere ezi nghọta abụọ n'ebe a. Isi ederede na-eji nke sara mbara, ma ihe odide ala peeji na-echekwa nghọta gbasara okwukwe.
- issue: Ike okwu μιᾶς γυναικὸς ἀνήρ
  choice: di nke otu nwunye
  alternative: nwoke nke otu nwanyị
  rationale: Ntụgharị doro anya nke ọdịdị Grik na-ezere itinye mkpebi otu ụka banyere alụmdi na nwunye, ịlụ ọzọ, ma ọ bụ ikwesị ntụkwasị obi nke okwu ahụ n'onwe ya na-akọwaghị kpamkpam.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke oge a, dị ùgwù ma doo ndị nkịtị anya. A zere okwu ụka pụrụ iche. E tinyere akara ihe odide ala peeji niile n'isi ederede ozugbo n'akụkụ okwu ha na-akọwa.
