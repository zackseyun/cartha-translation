    text: Ma ọ bụ, “ụmụ ndị kwere ekwe.” Okwu Grik bụ πιστά nwere ike ịpụta “ndị kwesịrị ntụkwasị obi” ma ọ bụ “ndị kwere ekwe.”
    reason: alternative_reading
  revision_rationale: The revision corrects the idiom for ‘above reproach’ and removes the unintended ‘no longer’ from the final qualification. It keeps the male-specific Greek marital idiom transparent, preserves the disputed sense of πιστά in the footnote, and retains the accusation nuance of ἐν κατηγορίᾳ for both following descriptions.
