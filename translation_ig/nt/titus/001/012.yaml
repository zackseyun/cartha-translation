  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: ig
  text: Otu onye n’ime ha, bú onye amụma nke ha onwe ha, kwuru, sị, “Ndị Krit bụ ndị ụgha mgbe niile, anụ ọhịa ọjọọ, ndị anyaukwu umengwụ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “afọ dị umengwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: Otu onye n’ime ha ... kwuru
  rationale: Nke a na-egosi ma nnọchiaha na-akọwaghị kpọmkwem onye ahụ (τις) ma echiche nke ịbụ onye sitere n’etiti ha (ἐξ αὐτῶν), n’ụzọ Igbo doro anya.
- source_word: ἴδιος αὐτῶν προφήτης
  choice: bú onye amụma nke ha onwe ha
  rationale: “Nke ha onwe ha” na-emesi ike na onye amụma ahụ bụ onye sitere n’etiti ndị Krit ma bụrụ nke ha.
- source_word: Κρῆτες
  choice: Ndị Krit
  rationale: Nke a bụ aha ndị bi na Krit n’ụdị dabara n’usoro ịkpọ agbụrụ ma ọ bụ ndị obodo n’Igbo.
- source_word: ἀεὶ ψεῦσται
  choice: na-abụ ndị ụgha mgbe niile
  rationale: “Mgbe niile” na-ebute ike ἀεί, ebe “ndị ụgha” na-asụgharị ψεῦσται kpọmkwem.
- source_word: κακὰ θηρία
  choice: anụ ọhịa ọjọọ
  rationale: Nke a na-echekwa ihe atụ anụ ọhịa dị n’ahịa Grik nakwa ike ikpe omume dị na κακά.
- source_word: γαστέρες ἀργαί
  choice: ndị oke nri dị umengwụ
  rationale: Nkebiokwu Grik pụtara n'ụzọ nkịtị “afọ dị umengwụ,” ma ebe a ọ na-akọwa ndị na-eribiga nri ókè ma na-adịghị arụ ọrụ; nsụgharị a na-eme ka mkparị ahụ doo onye Igbo anya.
theological_decisions:
- issue: Okwu siri ike a na-ekwu banyere otu agbụrụ n’ime okwu e hotara
  choice: Ịsụgharị okwu ahụ ozugbo dị ka ihe onye amụma nke ndị Krit kwuru, na-enweghị ime ka mkparị ya dị nro
  alternative: Ịkọwa ya n’ụzọ dị nro iji belata okwu ọjọọ ahụ gbasara ndị Krit
  rationale: Ihe odide ahụ gosiri nke ọma na nke a bụ okwu e hotara n’ọnụ “onye amụma nke ha onwe ha.” Ịhapụ okwu ahụ ka ọ sie ike na-echekwa arụmụka na esemokwu dị n’akwụkwọ mbụ, na-enweghị ime ya ka ọ bụrụ nkwupụta ozizi gbasara ndị Krit niile n’oge niile.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Akara ụkwụ [a] dị n’ebe ọ metụtara nkebiokwu ikpeazụ.
