revisions:
- from: Otu onye n’ime ha, bú onye amụma nke ha onwe ha, kwuru, sị, “Ndị Krit na-abụ ndị ụgha mgbe niile, anụ ọhịa ọjọọ, ndị oke nri dị umengwụ.”[a]
  to: Otu onye n’ime ha, bú onye amụma nke ha onwe ha, kwuru, sị, “Ndị Krit bụ ndị ụgha mgbe niile, anụ ọhịa ọjọọ, ndị anyaukwu umengwụ.”[a]
  rationale: The revision preserves the harsh cited saying and all three Greek predicates, but replaces an unclear expression for the final insult with idiomatic Standard Igbo. The footnote remains anchored to the final phrase and preserves the literal sense of γαστέρες ἀργαί.
  reviewer_model: gpt-5.6-terra
