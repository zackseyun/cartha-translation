review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the partitive speaker, the emphatic phrase 'their own prophet,' the threefold proverbial characterization, and the literal alternative in the footnote. However, 'ndị oke nri dị umengwụ' does not naturally and clearly convey γαστέρες ἀργαί as an idiomatic insult for gluttonous, idle people; it can be understood as people associated with plentiful food or as physically large eaters.
  naturalness: The verse is generally clear Standard Igbo. Recasting the first predicate as 'bụ ndị ụgha mgbe niile' is more direct and idiomatic for the categorical proverbial quotation, and 'ndị anyaukwu umengwụ' is natural contemporary Igbo.
  terminology: '''Ndị Krit'' and ''onye amụma nke ha onwe ha'' appropriately retain the ethnic name and the force of ἴδιος. ''Anụ ọhịa ọjọọ'' faithfully preserves the metaphorical insult without interpretive softening. ''Ndị anyaukwu umengwụ'' renders the idiomatic force of ''lazy bellies''; the footnote preserves the literal body-part image.'
  issues:
  - severity: medium
    issue: The expression 'ndị oke nri dị umengwụ' is semantically unclear and is not a natural Igbo equivalent for 'lazy gluttons.'
    rationale: γαστέρες ἀργαί literally means 'idle/lazy bellies' and idiomatically disparages people as gluttonous and idle. 'Ndị anyaukwu umengwụ' communicates this force more clearly, while the footnote retains the literal wording.
  - severity: low
    issue: '''na-abụ ndị ụgha mgbe niile'' is less direct than needed in a proverbial nominal characterization.'
    rationale: '''bụ ndị ụgha mgbe niile'' more naturally states the Greek present proverbial assertion while retaining ''always.'''
  revised_text: Otu onye n’ime ha, bú onye amụma nke ha onwe ha, kwuru, sị, “Ndị Krit bụ ndị ụgha mgbe niile, anụ ọhịa ọjọọ, ndị anyaukwu umengwụ.”[a]
