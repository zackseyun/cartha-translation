  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: ig
  text: A ghaghị imechi ha ọnụ,[a] n’ihi na ha na-akụghasị ezinụlọ niile[b] site n’ịkụzi ihe ha na-ekwesịghị ịkụzi n’ihi uru rụrụ arụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A ghaghị ime ka ha kwụsị ikwu okwu.” N’ụzọ nkịtị, okwu Grik ahụ bụ “imechi ọnụ.”
    reason: lexical_alternative
  - marker: b
    text: “Ezinụlọ niile” na-ezo aka n’ezinụlọ na ndị niile bi ma dabere n’otu ụlọ, ọ bụghị naanị ụlọ dịka ihe owuwu.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “uru na-adịghị mma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: A ghaghị imechi ha ọnụ
  rationale: Nkebi a na-egosi na ọ dị mkpa ma bụrụ iwu ka a kwụsị ha ikwu ma ọ bụ ịkụzi ihe ọjọọ. “Imechi ha ọnụ” na-edobe ihe oyiyi dị na ngwaa Grik ahụ ma na-ada nke ọma n’Igbo.
- source_word: οἵτινες
  choice: n’ihi na ha
  rationale: N’ebe a, nnọchiaha ahụ na-eweta ihe mere a ga-eji mechie ha ọnụ; “n’ihi na ha” na-eme ka njikọ nkọwa ahụ doo anya.
- source_word: ὅλους οἴκους
  choice: ezinụlọ niile
  rationale: οἶκος nwere ike ịpụta ndị niile nọ n’otu ụlọ ma ọ bụ ezinụlọ, ọ bụghị naanị ụlọ dịka ihe owuwu. “Ezinụlọ niile” dabara n’ọnọdụ mmekọrịta mmadụ nke amaokwu a.
- source_word: ἀνατρέπουσιν
  choice: na-akụghasị
  rationale: Okwu a pụtara ịkwatu, ịtụgharị, ma ọ bụ ime ka ihe ghara ịdị n’usoro. “Na-akụghasị” na-egosi mmebi siri ike ha na-akpatara ezinụlọ n’ebughị ụzọ kwuo na e bibiri ha kpamkpam.
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: site n’ịkụzi ihe ha na-ekwesịghị ịkụzi
  rationale: Nke a na-egosi ụzọ ha si akụghasị ezinụlọ, ya bụ site n’ozizi na-ekwesịghị ekwesị. Ikwughachi “ịkụzi” na-eme ka Igbo doo anya ma bụrụ nke okike.
- source_word: αἰσχροῦ κέρδους χάριν
  choice: ka ha wee nweta uru ihere
  rationale: 'Nkebi a na-ekpughe ebumnobi ha: inweta uru n’ụzọ ihere ma ọ bụ nke na-adịghị mma. Nsụgharị a na-edobe ikpe omume dị n’okwu Grik ahụ.'
theological_decisions:
- issue: Ụdị iwu e nyere banyere ndị ozizi ụgha
  choice: A ghaghị imechi ha ọnụ
  alternative: A ghaghị ime ka ha kwụsị ikwu okwu
  rationale: Okwu Grik ahụ siri ike ma lekwasị anya n’ịkwụsị ozizi ha na-emebi ihe; ọ naghị akọwa ụzọ anụahụ, nke ọchịchị, ma ọ bụ nke ntaramahụhụ a ga-esi mee ya. Ya mere, nsụgharị ahụ anaghị atụkwasị usoro ọ bụla ederede ahụ na-ekwughị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. “Imechi ha ọnụ” na-echekwa ihe oyiyi Grik ahụ n’enweghị ịkọwa usoro a ga-eji kwụsị ha; “ezinụlọ” na-egosi ndị nọ n’ụlọ karịa ụlọ ahụ n’onwe ya.
