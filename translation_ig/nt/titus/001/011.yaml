review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the obligation in δεῖ, the restraining sense of ἐπιστομίζειν, the household sense of ὅλους οἴκους, and the means expressed by διδάσκοντες. However, “ka ha wee nweta uru ihere” can imply that the gain is a prospective result (“so that they may obtain”) rather than the stated motive marked by χάριν, and “uru ihere” is not the most natural Standard Igbo expression for disgraceful/sordid gain.
  naturalness: “A ghaghị imechi ha ọnụ” is an intelligible and suitably forceful Igbo rendering, especially with its clarifying note. “Na-akụghasị ezinụlọ niile” is natural. Recasting the final motive phrase as “n’ihi uru rụrụ arụ” is more idiomatic and direct.
  terminology: “Ezinụlọ” appropriately conveys οἶκος as a household unit in context. “Uru rụrụ arụ” naturally conveys the moral censure in αἰσχροῦ κέρδους without adding a particular form of gain or method of silencing.
  issues:
  - severity: medium
    issue: The final phrase “ka ha wee nweta uru ihere” weakens and slightly shifts the causal/motivational force of αἰσχροῦ κέρδους χάριν.
    rationale: χάριν means “for the sake of/because of.” “Ka ha wee nweta” more naturally expresses purpose or intended result, while “uru ihere” is less idiomatic than “uru rụrụ arụ.”
  revised_text: A ghaghị imechi ha ọnụ,[a] n’ihi na ha na-akụghasị ezinụlọ niile[b] site n’ịkụzi ihe ha na-ekwesịghị ịkụzi n’ihi uru rụrụ arụ.[c]
  revised_footnotes:
