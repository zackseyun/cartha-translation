revisions:
- from: A ghaghị imechi ha ọnụ,[a] n’ihi na ha na-akụghasị ezinụlọ niile[b] site n’ịkụzi ihe ha na-ekwesịghị ịkụzi, ka ha wee nweta uru ihere.[c]
  to: A ghaghị imechi ha ọnụ,[a] n’ihi na ha na-akụghasị ezinụlọ niile[b] site n’ịkụzi ihe ha na-ekwesịghị ịkụzi n’ihi uru rụrụ arụ.[c]
  rationale: The revision preserves the Greek syntax and sense while correcting the final clause to express motivation rather than a possible future outcome. It also uses an established, natural Igbo ethical expression for shameful or sordid gain. No doctrinal or coercive method is added to the command to silence these teachers.
