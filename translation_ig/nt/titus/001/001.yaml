id: TIT.1.1
reference: Titus 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: ig
  text: Pọl, ohu Chineke na onyeozi Jizọs bụ́ Mezaịa, maka[a] okwukwe ndị Chineke họpụtara na ịmata[b] eziokwu ahụ nke kwekọrọ n’nsọpụrụ Chineke[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dị ka okwukwe ndị Chineke họpụtara na ịmata eziokwu ahụ si dị.”
    reason: κατά nwere ike igosi ebumnuche ma ọ bụ ntụaka, nakwa nkwekọrịta.
  - marker: b
    text: Ma ọ bụ, “ịmata eziokwu ahụ nke ọma.”
    reason: ἐπίγνωσις nwere ike ibu echiche nke mmata zuru ezu ma ọ bụ nke miri emi.
  - marker: c
    text: Ma ọ bụ, “eziokwu ahụ nke na-eduga ná nsọpụrụ Chineke.”
    reason: Njikọ κατά na εὐσέβεια nwere ike ịghọta dị ka nkwekọrịta ma ọ bụ dị ka ihe eziokwu ahụ na-amịpụta.
lexical_decisions:
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosi onye nwe ya kpamkpam ma na-ejere ya ozi; ọ na-edobe ịdị arọ nke okwu Grik karịa naanị “onye na-eje ozi.”
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” bụ okwu Igbo doro anya maka onye e nyere ikike ma ziga ya ka ọ rụọ ọrụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mezaịa
  rationale: A sụgharịrị Χριστός dị ka aha ọkwa, “Mezaịa,” ma jiri ahịrịokwu Igbo “bụ́ Mezaịa” mee ka ọ daa nke ọma ma doo anya.
- source_word: κατὰ
  choice: maka
  rationale: N’ebe a, “maka” na-egosi na ozi Pọl chere ihu n’okwukwe na mmata ndị a, na-enweghị ime ka naanị otu nghọta nke njikọ ahụ bụrụ iwu.
- source_word: πίστιν
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ahụkarị nke na-eburu echiche nke ikwere na ịtụkwasị obi.
- source_word: ἐκλεκτῶν θεοῦ
  choice: ndị Chineke họpụtara
  rationale: Nke a na-edobe echiche doro anya nke Chineke ịhọrọ ha, ma ghara itinye nkọwa otu ụka n’ime ya.
- source_word: ἐπίγνωσιν
  choice: ịmata
  rationale: “Ịmata” bụ okwu dị mfe ma kwekọọ na isi echiche ahụ; ihe nwere ike ịbụ “ịmata nke ọma” ka edebere n’ala ala peeji.
- source_word: ἀληθείας
  choice: eziokwu ahụ
  rationale: “Eziokwu ahụ” na-egosi eziokwu a kapịrị ọnụ nke ederede ahụ na-ekwu banyere ya.
- source_word: τῆς κατ’ εὐσέβειαν
  choice: nke kwekọrọ ná ndụ nsọpụrụ Chineke
  rationale: Nke a na-edobe njikọ κατά dị ka nkwekọrịta, ma tinye “ndụ” iji mee ka εὐσέβεια bụrụ echiche doro anya ma dị ndụ n’Igbo.
theological_decisions:
- issue: Njikọ κατὰ πίστιν ... καὶ ἐπίγνωσιν na ọrụ onyeozi Pọl
  choice: onye e zitere maka okwukwe ... na ịmata ...
  alternative: dị ka okwukwe ... na ịmata ... si dị
  rationale: Usoro okwu Grik dị mkpirikpi ma nwee ike ịpụta ebumnuche, ntụaka, ma ọ bụ nkwekọrịta. Isi ederede na-egosi ntụziaka ọrụ Pọl, ebe ihe e dere n’ala ala peeji na-edobe nghọta ọzọ.
- issue: Ihe τῆς κατ’ εὐσέβειαν na-ekwu banyere eziokwu
  choice: eziokwu nke kwekọrọ ná ndụ nsọpụrụ Chineke
  alternative: eziokwu nke na-eduga ná ndụ nsọpụrụ Chineke
  rationale: κατά na-akwado nghọta nke nkwekọrịta; ma nsonaazụ nke eziokwu n’ibi ndụ nsọpụrụ Chineke ka bụkwa nghọta kwere omume, ya mere e debere ya n’ala ala peeji.
- issue: Ndị ἐκλεκτῶν θεοῦ bụ
  choice: ndị Chineke họpụtara
  alternative: ndị Chineke họọrọ ịbụ ndị nke ya
  rationale: Nhọrọ bụ isi na-edobe okwu ederede banyere nhọrọ Chineke n’enweghị ịkọwa usoro ma ọ bụ oge nhọrọ ahụ karịa ihe amaokwu kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ohu” na-edobe ịdị arọ nke δοῦλος; “Jizọs bụ́ Mezaịa” na-egosi Χριστός dị ka aha ọkwa. E tinyere “onye e zitere” iji mee ka njikọ “maka” laghachi n’ọrụ onyeozi n’ụzọ doro anya n’Igbo, n’agbanyeghị na okwu ahụ adịghị iche n’usoro Grik.
