- from: 'Nye Taịtọs, ezi nwa m site n’okwukwe anyị nwere n’otu:[a]


    Ka amara na udo si n’aka Chineke Nna na Mesaya Jizọs,[b] Onye Nzọpụta anyị, dịrị gị.'
  to: 'Nye Taịtọs, ezi nwa m n’ime okwukwe anyị nwekọrọ ọnụ:[a]


    Ka amara na udo nke si n’aka Chineke Nna na Mesaya Jizọs, Onye Nzọpụta anyị, dịrị gị.[b]'
  rationale: The revision corrects the directional/means nuance introduced by “site n’” while retaining the intended spiritual-kinship sense and the shared nature of πίστις. It also makes the blessing’s “from God ... and Messiah Jesus” construction more fluent in Standard Igbo without adding theological content. Footnote markers and their scope remain valid.
  reviewer_model: gpt-5.6-terra
