  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: ig
  text: 'Nye Taịtọs, ezi nwa m n’ime okwukwe anyị nwekọrọ ọnụ:[a]


    Ka amara na udo nke si n’aka Chineke Nna na Mesaya Jizọs, Onye Nzọpụta anyị, dịrị gị.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dịka okwukwe anyị na-ekekọrịta si dị.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Kraịst Jizọs”; a sụgharịrị Χριστός dịka aha-ọkwa “Mesaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ τέκνῳ
  choice: ezi nwa m
  rationale: “Ezi nwa m” na-egosi na mmekọrịta ime mmụọ Pọl na Taịtọs bụ nke bụ eziokwu, ọ bụghị na ọ na-ekwu maka nwa a mụrụ n’anụ ahụ.
- source_word: κατὰ κοινὴν πίστιν
  choice: site n’okwukwe anyị nwere n’otu
  rationale: Nke a na-egosi na okwukwe ha abụọ na-ekekọrịta bụ ihe jikọrọ ha dịka nna na nwa n’ime mmụọ. Ihe e dere n’ala peeji na-echekwa ụzọ ọzọ e nwere ike isi ghọta κατά dịka njikọ ma ọ bụ ụkpụrụ.
- source_word: πίστιν
  choice: okwukwe
  rationale: N’ebe a, πίστις na-ekwu maka okwukwe Ndị Kraịst nke Pọl na Taịtọs nwere n’otu, ọ bụghị àgwà ikwesị ntụkwasị obi.
- source_word: χάρις καὶ εἰρήνη
  choice: amara na udo
  rationale: Ndị a bụ okwu ngọzi Pọl na-ejikarị ede ekele n’akwụkwọ ozi ya; okwu Igbo ndị a bụ ndị doro anya ma bụrụkwa ndị a maara nke ọma.
- source_word: θεοῦ πατρὸς
  choice: Chineke Nna
  rationale: Asụsụ Grik kwuru “Chineke Nna,” ọ bụghị “Chineke Nna anyị,” ya mere a hapụrụ ya otú ahụ.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesaya Jizọs
  rationale: A sụgharịrị Χριστός dịka aha-ọkwa “Mesaya,” kama idegharị ya dịka aha nkịtị, iji chekwaa ihe okwu Grik ahụ pụtara.
- source_word: σωτῆρος ἡμῶν
  choice: Onye Nzọpụta anyị
  rationale: Nkebiokwu a na-akọwa Mesaya Jizọs ozugbo dịka Onye Nzọpụta anyị.
theological_decisions:
- issue: Otu e si asụgharị Χριστός n’aha-ọkwa Χριστοῦ Ἰησοῦ
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: “Mesaya” na-eme ka ihe aha-ọkwa Grik Χριστός pụtara pụta ìhè, kama iji naanị okwu e deregharị ederegharị.
- issue: Onye σωτῆρος ἡμῶν na-akọwa
  choice: “Onye Nzọpụta anyị” na-akọwa Mesaya Jizọs.
  alternative: Ịgụ ya dịka aha-ọkwa metụtara isi mmalite ngọzi ahụ n’ozuzu ya.
  rationale: N’usoro okwu Grik, τοῦ σωτῆρος ἡμῶν nọ ozugbo n’azụ Χριστοῦ Ἰησοῦ ma na-akọwa ya, ya mere nsụgharị ahụ mere njikọ a ka ọ doo anya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A gbakwụnyere “dịrị gị” iji mezue ụdị ngọzi a n’Igbo, ebe asụsụ Grik hapụrụ ngwaa ahụ ka onye na-agụ ya ghọta ya. E debere ihe atụ nna na nwa n’ime mmụọ n’enweghị ịkpọ Taịtọs “nwa nwoke,” ebe τέκνον pụtara nwa n’ozuzu ya.
