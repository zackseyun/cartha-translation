id: TIT.1.5
reference: Titus 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: ig
  text: Ọ bụ n’ihi nke a ka m ji hapụ gị na Krit, ka i wee dozie ihe ndị ka fọdụrụ[a], họpụtakwa ndị okenye n’obodo ọ bụla[b], dị ka m nyere gị ntụziaka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị ka na-adịghị ezu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’obodo n’obodo.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “dị ka m nyere gị iwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: Ọ bụ n’ihi nke a
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n’ụzọ doro anya ma na-echekwa echiche nke ihe kpatara ihe ọzọ.
- source_word: ἀπέλιπόν
  choice: ka m ji hapụ gị
  rationale: “Hapụ” na-egosi na Pọl hapụrụ Taịtọs na Krit n’enweghị itinye nkwusi ike na-adịghị na okwu Grik.
- source_word: ἐν Κρήτῃ
  choice: na Krit
  rationale: Nkebiokwu a na-egosi ebe, jiri aha agwaetiti ahụ dịka a na-ede ya n’Igbo.
- source_word: ἵνα
  choice: ka i wee
  rationale: Ọ na-egosi nzube Pọl ji hapụ Taịtọs na Krit.
- source_word: τὰ λείποντα
  choice: ihe ndị ka fọdụrụ
  rationale: Nke a na-egosi ihe ndị a na-emechabeghị; e debere echiche ọzọ, “ihe ndị na-adịghị,” n’ala ala peeji.
- source_word: ἐπιδιορθώσῃ
  choice: dozie
  rationale: “Dozie” na-agụnye ido ihe n’usoro na ime ka ihe na-ezughị oke guzozie, ma bụrụkwa okwu Igbo dị mfe nghọta.
- source_word: καταστήσῃς
  choice: họpụta
  rationale: N’ebe a okwu ahụ pụtara ịhọpụta ma ọ bụ itinye mmadụ n’ọrụ a họpụtara ya ịrụ.
- source_word: κατὰ πόλιν
  choice: n’obodo ọ bụla
  rationale: Ọ na-echekwa echiche nkesa nke κατά, ya bụ ime nke a n’obodo n’obodo.
- source_word: πρεσβυτέρους
  choice: ndị okenye
  rationale: N’ebe a ọ na-ezo aka ná ndị ndu a nabatara n’ọgbakọ, ọ bụghị nanị ndị nwoke merela agadi; okwu a anaghị ebubata usoro ọchịchị ụka nke otu nzukọ okpukpe.
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: dị ka m nyere gị ntụziaka
  rationale: Nke a na-echekwa ikike dị n’okwu Pọl ma ghara ime ka ụda ya sie ike karịa ka o kwesịrị.
theological_decisions:
- issue: Aha ọrụ ọgbakọ dị na πρεσβυτέρους
  choice: ndị okenye
  alternative: ndị presbịta; ndị nwoke merela agadi
  rationale: Amaokwu a na-ekwu maka ndị a họpụtara ibu ọrụ n’ọgbakọ, ma nsụgharị ahụ ekwesịghị ikpebi arụmụka e mesịrị banyere usoro ọchịchị ụka.
- issue: Ike dị n’okwu διεταξάμην
  choice: nyere gị ntụziaka
  alternative: nyere gị iwu; gwara gị ihe ị ga-eme
  rationale: Okwu Grik ahụ nwere ike ịpụta ntụziaka nwere ikike ma ọ bụ iwu. Isi okwu a na-egosi ikike Pọl n’ụzọ ebumpụta ụwa, ebe e debere “nyere gị iwu” dị ka ụzọ ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ndị okenye” dịka okwu ụka sara mbara nke na-adịghị akwado usoro ọchịchị ụka nke otu nzukọ pụrụ iche. E tinyere akara ala ala peeji ozugbo n’ebe okwu ha na-akọwa dị.
