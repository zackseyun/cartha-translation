  rationale: The revision replaces an unnatural calque with an idiomatic Standard Igbo expression. The note preserves the source phrase’s possible senses—association with a circumcision group or origin from among circumcised people—without making either interpretation explicit in the main text. The final comma is retained because the Greek verse continues syntactically into the next verse.
