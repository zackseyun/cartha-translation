id: TIT.1.10
reference: Titus 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: ig
  text: N’ihi na e nwere ọtụtụ ndị na-enupụ isi, ndị na-ekwu okwu efu na ndị na-eduhie ndị mmadụ, karịsịa ndị e biri úgwù[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị otu ibi úgwù” ma ọ bụ “ndị si n’etiti ndị e biri úgwù.” O yikarịrị ka okwu a na-ezo aka n’ụlọọrụ ndị Juu ma ọ bụ ndị na-akwalite ibi úgwù, ma okwu Grik ahụ akọwaghị nke a kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na okwu a na-enye ihe mere ntụziaka dị n’amaokwu bu ụzọ ji dị mkpa.
- source_word: πολλοὶ
  choice: ọtụtụ ndị
  rationale: Na-egosipụta ọnụ ọgụgụ buru ibu; ịgbakwunye “ndị” na-eme ka okwu ahụ zuo oke ma bụrụ Igbo ebumpụta ụwa.
- source_word: ἀνυπότακτοι
  choice: ndị na-enupụ isi
  rationale: Na-egosi ndị na-ajụ ido onwe ha n’okpuru ikike kwesịrị ekwesị; okwu a doro ndị na-agụ Igbo nke oge a anya.
- source_word: ματαιολόγοι
  choice: ndị na-ekwu okwu efu
  rationale: Na-echekwa echiche nke ndị okwu ha na-abaghị uru ma ọ bụ enweghị isi.
- source_word: φρεναπάται
  choice: ndị na-eduhie ndị mmadụ
  rationale: Na-enye echiche nke ndị na-eduhie uche ndị ọzọ n’ụzọ Igbo dị mfe nghọta.
- source_word: μάλιστα
  choice: karịsịa
  rationale: Na-akọwapụta otu ìgwè a na-elekwasị anya n’ime ọtụtụ ndị ahụ.
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: ndị nke ibi úgwù
  rationale: Na-esochi nkebi Grik ahụ nso n’ebughị ụzọ kpebie na ọ pụtara ndị Juu niile ma ọ bụ otu òtù a kpọrọ aha.
theological_decisions:
- issue: Ndị okwu “οἱ ἐκ τῆς περιτομῆς” na-ezo aka na ha
  choice: ndị nke ibi úgwù
  alternative: ndị otu ibi úgwù; ndị si n’etiti ndị e biri úgwù
  rationale: O yikarịrị ka okwu a na-ezo aka n’ebe ndị Juu ma ọ bụ ndị na-akwalite idebe ibi úgwù nọ, ma Grik ahụ ekwughị kpọmkwem otú ahụ. Nsụgharị bụ isi na-echekwa obosara na ntakịrị nghọta na-ezughị ezu dị na isi mmalite.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E tinyere akara nkọwa [a] ozugbo n’akụkụ okwu ọ na-akọwa. Akara rikoma ikpeazụ na-egosi na amaokwu a na-aga n’ihu n’ahịrịokwu na-esochi ya.
