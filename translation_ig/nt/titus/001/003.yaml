id: TIT.1.3
reference: Titus 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: ig
  text: ma n'oge nke aka ya, o mere ka a mata okwu ya site ná nkwusa ahụ e nyefere m[a], dịka iwu Chineke Onye Nzọpụta anyị si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịghọta ya dịka: “okwu ya ... nke e nyefere m.” Nnọchiaha Grik ahụ nwere ike izo aka n’“okwu ya” kama izo aka na “nkwusa ahụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: o mere ka a mata
  rationale: Nke a na-egosipụta ime ka ihe e zoro ezo pụta ìhè ma bụrụkwa Igbo dị ugbu a na nke doro anya; Chineke bụ isiokwu a na-aghọta site n'amaokwu bu ụzọ.
- source_word: καιροῖς ἰδίοις
  choice: n'oge nke ya
  rationale: Ọ na-echekwa ike nnọchiaha ἰδίοις ma na-egosi oge Chineke họpụtara n'onwe ya.
- source_word: τὸν λόγον αὐτοῦ
  choice: okwu ya
  rationale: Ọ na-echekwa njikọ okwu λόγος ma na-adabara ozi Chineke kwupụtara n'ọnọdụ a.
- source_word: ἐν κηρύγματι
  choice: site ná nkwusa ahụ
  rationale: ἐν nwere ọrụ ụzọ e si mee ihe ebe a; “nkwusa” nwekwara ike ịpụta omume ikwusa ma ọ bụ ozi a na-ekwusa.
- source_word: ὃ
  choice: ahụ e nyefere m
  rationale: Nnọchiaha neuter singular a kacha nso κήρυγμα; nhazi Igbo a na-eme ka nkwusa ahụ bụrụ ihe e nyefere Pọl.
- source_word: ἐπιστεύθην
  choice: e nyefere m
  rationale: Aorist passive ebe a pụtara inye mmadụ ihe ka ọ lekọta ma ọ bụ rụọ, ọ bụghị na Pọl kwere ihe ahụ.
- source_word: κατ’ ἐπιταγὴν
  choice: dịka iwu ... si dị
  rationale: Nke a na-egosi na inyefe ozi ahụ kwekọrọ n'iwu nwere ikike.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Chineke, Onye Nzọpụta anyị
  rationale: Ọ na-echekwa Chineke dị ka onye a kpọrọ Onye Nzọpụta ma na-enye Igbo doro anya na nke dị ùgwù.
theological_decisions:
- issue: Onye bụ isiokwu a na-aghọta na ἐφανέρωσεν, na ihe καιροῖς ἰδίοις pụtara
  choice: Chineke bụ onye mere ka okwu ya pụta ìhè “n'oge nke ya.”
  alternative: Ịsụgharị ya n'enweghị onye kpọmkwem, dịka “n'oge kwesịrị ekwesị, e mere ka ọ pụta ìhè.”
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu maka Chineke kwere nkwa tupu oge ebighị ebi, ma ugbu a mee ka okwu ya pụta ìhè; nke a na-echekwakwa nnọchiaha ἰδίοις.
- issue: Ihe nnọchiaha ὃ na-ezo aka na ya
  choice: Ọ na-ezo aka na “nkwusa ahụ.”
  alternative: Ọ nwere ike ịzo aka na “okwu ya,” nke ga-enye echiche, “okwu ya ... nke e nyefere m.”
  rationale: κήρυγμα bụ aha kacha nso dabara n'ụdị neuter singular ahụ, ma ἐπιστεύθην na-adabara nke ọma n'ihe e nyere Pọl ka ọ kwusaa. A na-edebe nghọta ọzọ na nkọwa ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “mere ka a mata” zere okwu nkà mmụta siri ike; e debere “okwu ya” na “nkwusa” iji chekwaa ọdịiche dị n'etiti λόγος na κήρυγμα. Naanị ihe chọrọ nkọwa ala peeji bụ mgbagwoju anya gbasara ihe ὃ na-ezo aka na ya; “n'oge nke ya” echekwalarị ihe ọzọ English footnote a kwuru, ebe “nkwusa” n'onwe ya na-anabata ma omume ikwusa ma ozi a kwusara.
