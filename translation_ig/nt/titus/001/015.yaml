id: TIT.1.15
reference: Titus 1:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: ig
  text: Ihe niile dị ọcha[a] nye ndị dị ọcha; ma nye ndị e metọrọ na ndị na-ekweghị ekwe, ọ dịghị ihe ọ bụla dị ọcha. Kama, e metọọla ma uche ha ma akọ na uche ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a na-ezo aka ma n'ihe dị ọcha dịka usoro okpukpe si dị ma n'ihe dị ọcha n'omume.
    reason: lexical_nuance
lexical_decisions:
- source_word: πάντα
  choice: Ihe niile
  rationale: Ụdị nnọchiaha a na-agụnye ihe n'ozuzu ya; “Ihe niile” na-edobe obosara na usoro ilu dị n'okwu Grik.
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: dị ọcha / ndị dị ọcha
  rationale: “Dị ọcha” bụ okwu Igbo nkịtị nke nwere ike ịpụta ịdị ọcha n'usoro okpukpe nakwa n'omume; “ndị dị ọcha” na-asụgharị adjective Grik e ji mee aha.
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: ma nye ndị e metọrọ
  rationale: “E metọrọ” na-egosi ọnọdụ ruru unyi ma ọ bụ rụrụ arụ nke sitere n'ihe mere na mbụ, dịka perfect participle Grik si kwuo.
- source_word: ἀπίστοις
  choice: ndị na-ekweghị ekwe
  rationale: N'ebe a, okwu ahụ na-egosi ndị na-enweghị okwukwe, ọ bụghị nanị ndị na-adịghị eguzosi ike n'ihe.
- source_word: οὐδὲν καθαρόν
  choice: ọ dịghị ihe ọ bụla dị ọcha
  rationale: Nke a na-edobe otu okwu banyere ịdị ọcha ahụ e ji malite amaokwu ahụ ma na-egosikwa na ọ dịghị otu ihe a hapụrụ.
- source_word: ἀλλὰ
  choice: Kama
  rationale: '“Kama” na-egosi ntụgharị siri ike: nsogbu ahụ abụghị ihe ndị dị n''èzí, kama ọ bụ ọnọdụ dị n''ime mmadụ.'
- source_word: μεμίανται
  choice: e metọọla
  rationale: Ụdị a na-egosi na mmetọ ahụ emeela ma ọnọdụ ya ka dị ugbu a, nke kwekọrọ na perfect Grik.
- source_word: νοῦς
  choice: uche
  rationale: “Uche” bụ okwu Igbo doro anya maka ikike mmadụ ji eche echiche ma ghọta ihe.
- source_word: συνείδησις
  choice: akọ na uche
  rationale: “Akọ na uche” bụ okwu Igbo a na-ejikarị akọwa ikike dị n'ime mmadụ nke na-agba akaebe ma na-ekpe omume ya ikpe.
- source_word: καὶ ... καὶ
  choice: ma ... ma
  rationale: Usoro “ma ... ma” na-emesi ike na akụkụ abụọ ahụ—uche na akọ na uche—emetọọla.
theological_decisions:
- issue: Oke ihe okwu ịdị ọcha pụtara
  choice: E ji “dị ọcha” mee ihe ebe niile iji hapụ ma echiche nke ịdị ọcha dịka iwu okpukpe si dị ma nke ịdị ọcha n'omume.
  alternative: Ịsụgharị ya n'ụzọ ga-eme ka ọ bụrụ naanị ịdị ọcha dịka usoro okpukpe si dị.
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara iwu na nchegbu ndị Juu banyere ịdị ọcha, ma okwu Pọl gbasakwara ọnọdụ ime mmụọ na omume nke onye ahụ. Ya mere, e kwesịghị imechi ihe ọ pụtara n'otu akụkụ naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ilu nke ahịrịokwu mbụ na nkwughachi okwu ndị metụtara ịdị ọcha na mmetọ.
