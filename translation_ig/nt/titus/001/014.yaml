- from: ka ha ghara itinye uche n’akụkọ ifo ndị Juu na n’iwu ndị mmadụ na-esite n’aka ndị na-agbakụta eziokwu azụ.[a]
  to: ka ha ghara itinye uche n’akụkọ ifo ndị Juu na n’iwu ndị sitere n’aka ndị mmadụ na-ewepụ onwe ha n’eziokwu.[a]
  rationale: 'The revision replaces an unclear rendering of “turning away from the truth” with idiomatic Standard Igbo while retaining the genitive relationship: the commands are those from people who turn away from the truth. The footnote remains a valid alternative for μὴ προσέχοντες and mirrors the corrected syntax.'
  reviewer_model: gpt-5.6-terra
