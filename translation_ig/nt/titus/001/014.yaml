    text: Ma ọ bụ, “ka ha ghara ịrara onwe ha nye akụkọ ifo ndị Juu na iwu ndị sitere n’aka ndị mmadụ na-ewepụ onwe ha n’eziokwu.”
    reason: lexical_alternative
  revision_rationale: 'The revision replaces an unclear rendering of “turning away from the truth” with idiomatic Standard Igbo while retaining the genitive relationship: the commands are those from people who turn away from the truth. The footnote remains a valid alternative for μὴ προσέχοντες and mirrors the corrected syntax.'
