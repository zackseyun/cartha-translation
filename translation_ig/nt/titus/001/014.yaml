  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: ig
  text: ka ha ghara itinye uche n’akụkọ ifo ndị Juu na n’iwu ndị sitere n’aka ndị mmadụ na-ewepụ onwe ha n’eziokwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha ghara ịrara onwe ha nye akụkọ ifo ndị Juu na iwu ndị sitere n’aka ndị mmadụ na-ewepụ onwe ha n’eziokwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: ka ha ghara itinye uche na
  rationale: Nkebi a na-aga n’ihu n’echiche ndụmọdụ dị n’amaokwu bu ya ụzọ. “Itinye uche na” bụ Igbo dị ugbu a ma na-egosi mmadụ idowe uche ya n’ihe ma ọ bụ ilekwasị ya anya.
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: akụkọ ifo ndị Juu
  rationale: μῦθος na-ezo aka n’akụkọ e chepụtara echepụta ma ọ bụ akụkọ ọdịnala na-abụghị eziokwu; “akụkọ ifo” bụ okwu Igbo doro anya. “Ndị Juu” na-egosi ụdị ma ọ bụ ebe akụkọ ndị ahụ si.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: iwu ndị mmadụ
  rationale: ἐντολαῖς pụtara iwu ma ọ bụ ihe e nyere n’iwu, ebe ἀνθρώπων pụtara mmadụ n’ozuzu. Nsụgharị a na-eme ka ọdịiche dị n’etiti iwu mmadụ na eziokwu Chineke pụta n’etinyeghị nkọwa karịrị ihe ederede kwuru.
- source_word: ἀποστρεφομένων
  choice: ndị na-agbakụta … azụ
  rationale: Okwu a na-echekwa onyinyo dị na ngwaa Grik nke mmadụ isi n’ihe tụgharịa ma ọ bụ jụ ya, kama ịsụgharị ya nanị dị ka “jụ.”
- source_word: τὴν ἀλήθειαν
  choice: eziokwu
  rationale: Nke a bụ nsụgharị Igbo kwesịrị ekwesị ma dị mfe nghọta maka ἀλήθεια. A kọwaghị ya kpọmkwem dị ka “eziokwu nke ozi ọma,” n’ihi na ederede ahụ ekwughị nke ahụ hoo haa.
theological_decisions:
- issue: Ihe ἀποστρεφομένων na-akọwa
  choice: 'E jikọtara ya na “ndị mmadụ”: “iwu ndị mmadụ na-esite n’aka ndị na-agbakụta eziokwu azụ.”'
  alternative: A pụrụ ịghọta ya n’ụzọ sara mbara dịka ihe na-akọwa ndị e jikọtara ma akụkọ ifo ma iwu ndị ahụ na ha.
  rationale: N’usoro asụsụ Grik, ἀποστρεφομένων na ἀνθρώπων nọ n’otu ụdị genitive plural, ya mere njikọ ha bụ nke kacha nso ma bụrụkwa nke kacha kwekọọ n’usoro okwu. “Na-esite n’aka” mere njikọ a doo anya n’Igbo n’etinyeghị ozizi ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Akụkọ ifo” na “iwu ndị mmadụ” na-enye nsụgharị eke n’Igbo, ebe “na-agbakụta eziokwu azụ” na-echekwa onyinyo na esemokwu dị n’ederede Grik.
