  text: εἴ πως καταντήσω εἰς τὴν ἐξανάστασιν ⸂τὴν ἐκ⸃ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/011.yaml
  text: if somehow I may attain to the resurrection from the dead[a].
translation:
  language: ig
  text: ma ọ bụrụ na, n’ụzọ ọ bụla, m eruo mbilite n’ọnwụ sitere n’etiti ndị nwụrụ anwụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara okwu Grik nso karị, “mbilite-pụta site n’etiti ndị nwụrụ anwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: ma eleghị anya
  rationale: Nke a na-edobe ụda nkwusioru na ịdị umeala n’obi dị n’okwu Grik, n’ebughị ụzọ kọwaa ma Pọl na-enwe obi abụọ banyere nkwa Chineke.
- source_word: καταντήσω
  choice: m ga-erute
  rationale: Ngwaa a na-egosi iru ebe ma ọ bụ ihe e lekwasịrị anya; “erute” bụ okwu Igbo doro anya ma dịkwa mma maka ebumnuche nke ga-eme n’ọdịnihu.
- source_word: εἰς
  choice: na
  rationale: N’usoro okwu Igbo a, “erute na” na-egosi iru ihe e lekwasịrị anya n’ụzọ sitere n’okwu nkịtị.
- source_word: ἐξανάστασιν
  choice: mbilite n’ọnwụ
  rationale: Aha Grik a na-ezo aka ná mbilite n’ọnwụ. Ịmepụta okwu Igbo ọhụrụ nke ga-anọchi “out-resurrection” ga-eme ka amaokwu ahụ sie ike nghọta; a na-edobe ọdịiche nke ụdị okwu Grik ahụ na nkọwa ala peeji.
- source_word: τὴν ἐκ νεκρῶν
  choice: site n’etiti ndị nwụrụ anwụ
  rationale: Nke a na-eme ka ἐκ pụta ìhè dị ka isi n’etiti ndị nwụrụ anwụ pụta, ma ọ ka bụ Igbo dị mfe nghọta.
theological_decisions:
- issue: Ma a ga-asụgharị ἐξανάστασις n’ụzọ ga-ekewapụ ya nke ukwuu na ἀνάστασις, dị ka à ga-asị na ọ na-ezo aka n’ụdị mbilite n’ọnwụ pụrụ iche.
  choice: Jiri “mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ” n’ahịrịokwu bụ isi.
  alternative: “mbilite pụrụ iche nke isi n’etiti ndị nwụrụ anwụ pụta” ma ọ bụ “mbilite pụta site n’etiti ndị nwụrụ anwụ.”
  rationale: Okwu ahụ na-ezo anya ná mbilite site n’etiti ndị nwụrụ anwụ, ma ụdị pụrụ iche nke okwu ἐξανάστασις n’onwe ya anaghị amanye nkọwa na ọ bụ ụdị mbilite pụrụ iche. Nsụgharị a na-edobe esemokwu nkà mmụta okpukpe ahụ n’ebughị ụzọ dozie ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ma eleghị anya” na-eburu nkwusioru nke εἴ πως, ebe “site n’etiti ndị nwụrụ anwụ” na-edobe ike nke ἐκ n’enweghị okwu ọhụrụ na-eduhie anya.
