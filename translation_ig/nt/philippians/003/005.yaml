id: PHP.3.5
reference: Philippians 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: περιτομῇ ὀκταήμερος, ἐκ γένους Ἰσραήλ, φυλῆς Βενιαμίν, Ἑβραῖος ἐξ Ἑβραίων, κατὰ νόμον Φαρισαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/005.yaml
  text: circumcised on the eighth day, from the people of Israel, of the tribe of Benjamin, a Hebrew from Hebrews; according to the law, a Pharisee,
translation:
  language: ig
  text: E biri m ugwu n’ụbọchị nke asatọ; abụ m onye si n’agbụrụ Izrel, onye si n’ebo Benjamin, onye Hibru sitere n’ụlọ ndị Hibru[a]; n’ihe gbasara Iwu, abụ m onye Farisii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye Hibru nke ndị Hibru mụrụ,” nke na-emesi usoro ọmụmụ na njirimara Hibru Pọl ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιτομῇ ὀκταήμερος
  choice: e biri m ugwu n’ụbọchị nke asatọ
  rationale: Nke a na-egosipụta n’Igbo doro anya na e mere obibi ugwu ahụ kpọmkwem n’ụbọchị nke asatọ, ma chekwaa ihe ọ pụtara dị ka akara ọgbụgba ndụ ndị Juu.
- source_word: ἐκ γένους Ἰσραήλ
  choice: abụ m onye si n’agbụrụ Izrel
  rationale: “Agbụrụ Izrel” na-egosipụta usoro ọmụmụ na njirimara agbụrụ Pọl na-ekwu maka ya, n’asụsụ Igbo dị mfe nghọta.
- source_word: φυλῆς Βενιαμίν
  choice: onye si n’ebo Benjamin
  rationale: “Ebo” bụ okwu Igbo kwesịrị ekwesị maka φυλή ma na-egosipụta usoro ọmụmụ ebo ahụ nke ọma.
- source_word: Ἑβραῖος ἐξ Ἑβραίων
  choice: onye Hibru nke ndị Hibru mụrụ
  rationale: Nke a na-echekwa nkwusi ike nke ahịrịokwu Grik ma na-eme ka njikọ ọmụmụ na njirimara Hibru doo onye na-agụ Igbo anya; e debere ntụgharị dị mkpụmkpụ karị n’ala peeji.
- source_word: κατὰ νόμον
  choice: n’ihe gbasara Iwu
  rationale: N’ebe a κατά na-egosi akụkụ a na-atụle. “N’ihe gbasara Iwu” na-eduga nke ọma n’aha “onye Farisii” n’Igbo ma ghara ikwu na ọ bụ naanị nrubeisi n’iwu ka a na-ekwu.
- source_word: Φαρισαῖος
  choice: onye Farisii
  rationale: Nke a bụ ntụgharị aha otu ndị Juu ahụ nke a na-amata n’Igbo, ma “onye” na-eme ka njirimara Pọl doo anya.
theological_decisions:
- issue: Ihe Ἑβραῖος ἐξ Ἑβραίων pụtara kpọmkwem
  choice: onye Hibru nke ndị Hibru mụrụ
  alternative: onye Hibru si n’etiti ndị Hibru
  rationale: Nhọrọ bụ isi na-egosipụta n'ụzọ ebumpụta ụwa na Pọl sitere n’ezinụlọ Hibru ma nwee njirimara Hibru, n’enweghị itinye ozizi ọzọ; ntụaka ala peeji na-echekwa ụdị okwu nke nwere ike ịdị obosara karị.
- issue: Mmekọrịta κατὰ νόμον na Φαρισαῖος
  choice: n’ihe gbasara Iwu, abụ m onye Farisii
  alternative: dị ka Iwu si dị, abụ m onye Farisii
  rationale: Nhọrọ a na-echekwa na Pọl na-akọ ọnọdụ ma ọ bụ njirimara ya n’ihe gbasara Iwu, kama ime ka ahịrịokwu ahụ kwuo na ịbụ onye Farisii bụ ihe Iwu nyere iwu.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri usoro ndepụta nwere semicolon chekwaa ọsọ na nkwusi ike nke Grik. A kpọrọ νόμος “Iwu” n’isi mkpụrụedemede iji gosi Iwu ndị Juu e zoro aka na ya.
