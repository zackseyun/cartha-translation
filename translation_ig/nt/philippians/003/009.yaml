id: PHP.3.9
reference: Philippians 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὑρεθῶ ἐν αὐτῷ, μὴ ἔχων ἐμὴν δικαιοσύνην τὴν ἐκ νόμου ἀλλὰ τὴν διὰ πίστεως Χριστοῦ, τὴν ἐκ θεοῦ δικαιοσύνην ἐπὶ τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/009.yaml
  text: and be found in him[a], not having my own righteousness from the law[b], but that which is through faith in Messiah—the righteousness from God based on faith.
translation:
  language: ig
  text: ka a hụ m n’ime ya, n’enweghị ezi omume[b] nke aka m, nke sitere n’iwu, kama nke sitere n’okwukwe n’ebe Mesaịa[a] nọ—ezi omume nke sitere na Chineke, nke dabeere n’okwukwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ikwesị ntụkwasị obi nke Mesaịa.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ikpe ziri ezi” (n’ebe abụọ a kpọrọ “ezi omume”).
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρεθῶ
  choice: ka a hụkwa m
  rationale: Nke a na-edobe ụdị ngwaa nnara na echiche nzube/ọchịchọ nke okwu Grik ahụ, ma na-ada nke ọma n’Igbo.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Ọ na-edobe okwu Pọl gbasara ịdị ‘n’ime’ Mesaịa n’ụzọ sara mbara, n’etinyeghị nkọwa pụrụ iche n’ime ya.
- source_word: μὴ ἔχων
  choice: n’enweghị
  rationale: Ọ na-egosi ọnọdụ Pọl mgbe a hụrụ ya n’ime Mesaịa, ma kwekọọ n’ụdị participle nke isi mmalite.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: ‘Ezi omume’ bụ okwu Igbo doro anya maka δικαιοσύνη n’ebe a; e debere ‘ikpe ziri ezi’ dị ka nhọrọ ọzọ n’ala ala peeji.
- source_word: τὴν ἐκ νόμου
  choice: nke sitere n’iwu
  rationale: Ọ na-egosi na iwu bụ isi mmalite nke ezi omume Pọl na-ajụ ịdabere na ya, n’ebughị nkọwa ndị ọzọ bata.
- source_word: διὰ πίστεως Χριστοῦ
  choice: site n’inwe okwukwe na Mesaịa
  rationale: Isi ederede na-ewere genitive ahụ dị ka okwukwe a na-etinye na Mesaịa; a hapụrụ nhọrọ nke ikwesị ntụkwasị obi Mesaịa n’ala ala peeji iji chekwaa nghọta abụọ ahụ.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: A sụgharịrị aha ọkwá Χριστός dị ka ‘Mesaịa’ ebe ọ ka nwere ike aha ọkwá doro anya.
- source_word: τὴν ἐκ θεοῦ δικαιοσύνην
  choice: ezi omume nke sitere na Chineke
  rationale: Ọ na-edobe nkwughachi nke δικαιοσύνη ma kọwaa Chineke dị ka onye ọ sitere n’aka ya.
- source_word: ἐπὶ τῇ πίστει
  choice: nke dabeere n’okwukwe
  rationale: Ọ na-egosipụta echiche nke ntọala ma ọ bụ ihe a tụkwasịrị ya n’elu n’Igbo nke oge a.
theological_decisions:
- issue: Ihe πίστεως Χριστοῦ pụtara
  choice: okwukwe na Mesaịa
  alternative: ikwesị ntụkwasị obi nke Mesaịa
  rationale: Nhazi genitive a ka nwere nghọta abụọ a na-arụrịta ụka banyere ha. Isi ederede họọrọ okwukwe mmadụ na Mesaịa, ebe ala ala peeji chekwara nghọta nke ikwesị ntụkwasị obi Mesaịa.
- issue: Nsụgharị δικαιοσύνη n’okwu Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: ‘Ezi omume’ dabara n’usoro arụmụka Pọl ma bụrụkwa okwu ndị na-agụ Igbo ga-aghọta; ala ala peeji na-egosi na okwu Grik ahụ nwekwara akụkụ nke ikpe ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. E debere ahịrịokwu ahụ dị ka akụkụ na-aga n’ihu site n’amaokwu bu ya ụzọ; ‘n’ime ya’ chekwara obosara nke okwu Pọl, ebe ‘Mesaịa’ chekwara Χριστός dị ka aha ọkwá.
