  rationale: The revision removes an unwarranted additive nuance, replaces an awkward expression for faith in the Messiah with standard natural Igbo, and streamlines the repeated righteousness phrase while preserving the source syntax, the disputed πίστεως Χριστοῦ reading, the lexical alternative for δικαιοσύνη, and both footnote anchors.
