base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/002.yaml
  text: Watch out for the dogs[a]; watch out for the evil workers[c][b]; watch out for the mutilation.
translation:
  language: ig
  text: Lezienụ anya maka nkịta ndị ahụ; lezienụ anya maka ndị ọrụ ọjọọ; lezienụ anya maka igbubi ahụ́.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a pụtara “igbubi” ma ọ bụ “imebi ahụ́.” Pọl ji ya mee egwuregwu okwu mkparị megide “ibi úgwù” dị n'amaokwu na-esonụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: Lezienụ anya maka
  rationale: Okwu iwu a pụtara ịkpachara anya ma ọ bụ ịnọ na nche. Ikwughachi ya ugboro atọ na-echekwa ngwa ngwa na ike nke ịdọ aka ná ntị ahụ.
- source_word: τοὺς κύνας
  choice: nkịta ndị ahụ
  rationale: A hapụrụ ihe atụ siri ike Pọl ji mee ihe n'ọnọdụ nkịtị, n'etinyeghị nkọwa ọzọ ga-akọwa ya karịa ihe Grik kwuru.
- source_word: τοὺς κακοὺς ἐργάτας
  choice: ndị ọrụ ọjọọ
  rationale: Nke a na-echekwa ma echiche omume ọjọọ dị na κακούς ma ihe ἐργάτας pụtara n'ụzọ doro anya ma dị mfe.
- source_word: τὴν κατατομήν
  choice: ndị na-ebibi ahụ́ site n'ibibi ya úgwù
  rationale: κατατομή bụ aha na-egosi igbubi ma ọ bụ imebi ahụ́, bụrụkwa egwuregwu okwu mkparị megide περιτομή (‘ibi úgwù’) n'amaokwu na-esonụ. N'Igbo, nsụgharị a na-eme ka onye a na-adọ aka ná ntị banyere ya doo anya, ma na-echekwa echiche nke imebi ahụ́ na njikọ ya na ibi úgwù.
theological_decisions:
- issue: Otu a ga-esi tụgharị κατατομήν n'ihe gbasara περιτομή (‘ibi úgwù’) dị n'amaokwu na-esonụ
  choice: ndị na-ebibi ahụ́ site n'ibibi ya úgwù
  alternative: mbibi ahụ́; ndị na-agbubi ahụ́
  rationale: Pọl kpachaara anya jiri okwu mkparị dị iche na okwu nkịtị maka ibi úgwù. Nsụgharị a na-echekwa nkọcha ahụ na egwuregwu okwu ya, n'emeghị ya ka ọ bụrụ naanị ‘ibi úgwù ụgha,’ nke ga-etinye nkọwa na-adịghị n'okwu Grik ahụ kpọmkwem.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ugwu. E ji usoro yiri onwe ya—“lezienụ anya maka”—ugboro atọ iji chekwaa nkwughachi na ike ịdọ aka ná ntị dị na Grik. A hapụrụ “nkịta” dịka ihe atụ siri ike n'enweghị ime ka ọ dị nro.
