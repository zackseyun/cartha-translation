  text: ὧν τὸ τέλος ἀπώλεια, ὧν ὁ θεὸς ἡ κοιλία καὶ ἡ δόξα ἐν τῇ αἰσχύνῃ αὐτῶν, οἱ τὰ ἐπίγεια φρονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/019.yaml
  text: Their end is destruction[a], their god is the belly[b], and their glory is in their shame—their minds are set on earthly things.
translation:
  language: ig
  text: Ọgwụgwụ ha bụ ịla n’iyi, chi ha bụ afọ ha,[a] ebube ha dịkwa n’ihe ihere ha—ha na-echebara ihe nke ụwa echiche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “chi ha bụ agụụ ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: ọgwụgwụ
  rationale: “Ọgwụgwụ” na-edobe mkpụmkpụ okwu Grik ahụ ma nwee ike ịpụta ma njedebe ma ihe ga-eme ha n’ikpeazụ.
- source_word: ἀπώλεια
  choice: ịla n’iyi
  rationale: Nke a bụ okwu Igbo doro anya nke na-egosi mbibi siri ike, n’etinyeghị nkọwa karịrị ihe okwu Grik kwuru.
- source_word: κοιλία
  choice: afọ
  rationale: “Afọ” na-edobe ihe atụ gbasara akụkụ ahụ nke okwu Grik, kama ịkọwa ya ozugbo dịka agụụ ma ọ bụ ọchịchọ.
- source_word: δόξα
  choice: ebube
  rationale: “Ebube” bụ ntụgharị kpọmkwem nke na-edobe ịkwa emo dị n’ịkpọ ihe ihere ha ebube.
- source_word: αἰσχύνη
  choice: ihe ihere
  rationale: Nke a na-egosi ma ihere ma mmechuihu n’asụsụ Igbo nkịtị.
- source_word: τὰ ἐπίγεια
  choice: ihe nke ụwa
  rationale: Okwu a dị mfe nghọta ma na-anọ nso n’echiche nke ihe ndị dị n’ụwa.
- source_word: φρονοῦντες
  choice: na-atụkwasị uche ha n’ihe
  rationale: Nke a na-egosi na echiche na ọchịchọ ha na-aga n’ihu n’ịdabere n’ihe ndị ahụ, dịka participle Grik si gosi.
- source_word: ὧν ... ὧν
  choice: ha ... ha
  rationale: Iji nnọchiaha “ha” na-eme ka Igbo bụrụ nke e kere eke ma na-edobe ntụaka ugboro ugboro nye ndị a kpọrọ aha n’amaokwu bu ụzọ.
theological_decisions:
- issue: Ihe atụ dị n’okwu “chi ha bụ afọ ha”
  choice: E debere “afọ” n’amaokwu n’onwe ya.
  alternative: chi ha bụ agụụ ha
  rationale: Okwu Grik ji akụkụ ahụ mee ihe atụ banyere ọchịchọ ndị na-achị mmadụ. Idebe ihe atụ ahụ na-egbochi ịkọwa ya naanị n’otu ụzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E kewara ahịrịokwu ikpeazụ iche iji mee ka usoro okwu ahụ doo anya n’Igbo, ma e debere ike na esemokwu nke okwu mbụ.
