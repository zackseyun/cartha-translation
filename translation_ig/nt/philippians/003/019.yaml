  to: Ọgwụgwụ ha bụ ịla n’iyi, chi ha bụ afọ ha,[a] ebube ha dịkwa n’ihe ihere ha—ha na-echebara ihe nke ụwa echiche.
  rationale: The final clause has been revised to an idiomatic Standard Igbo expression for an ongoing mental orientation toward earthly things. The rest of the wording and the single, correctly anchored lexical-alternative footnote are retained.
