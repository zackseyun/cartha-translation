source:
  edition: SBLGNT
  text: ἀδελφοί, ἐγὼ ἐμαυτὸν ⸀οὐ λογίζομαι κατειληφέναι· ἓν δέ, τὰ μὲν ὀπίσω ἐπιλανθανόμενος τοῖς δὲ ἔμπροσθεν ἐπεκτεινόμενος,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/013.yaml
  text: 'Brothers[a], I do not consider myself to have taken hold of it. But one thing: forgetting the things behind and reaching forward to the things ahead,'
translation:
  language: ig
  text: 'Ụmụnna[a], echeghị m na ejidela m ya. Ma otu ihe: na-echefu ihe ndị dị n’azụ, na-agbatị onwe m gaa n’ihu n’ebe ihe ndị dị n’ihu nọ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “Ụmụnna” dị n'ụdị nwoke; ma Pọl na-ejikarị ya akpọ ndị kwere ekwe niile, ndị nwoke na ndị nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: ἀδελφοί
  choice: Ụmụnna
  rationale: Ọ bụ okwu a na-eji akpọ ndị mmadụ kpọmkwem. N'Igbo nkịtị, “ụmụnna” nwere ike ịgụnye ọgbakọ ndị kwere ekwe dum; ndetu ala kọwara ọdịdị nwoke nke okwu Grik ahụ na ojiji ya n'ebe ọgbakọ agwakọtara nọ.
- source_word: λογίζομαι
  choice: echeghị m
  rationale: Nke a na-egosipụta nyocha ma ọ bụ mkpebi Pọl banyere onwe ya n'Igbo dị mfe ma dị ugbu a.
- source_word: κατειληφέναι
  choice: na m ejidela ya
  rationale: “Ejidela” na-echekwa ihe atụ nke ijide ihe n'aka dị n'okwu Grik ahụ na amaokwu gbara ya gburugburu; “ya” na-eme ka ihe e zoro ezo a na-ekwu banyere ya doo anya n'Igbo.
- source_word: ἓν δέ
  choice: Ma otu ihe
  rationale: Nke a na-echekwa mkpụmkpụ na nkwụsị mberede nke okwu Grik ahụ, n'etinyeghị ngwaa a na-ekwughị n'isi mmalite.
- source_word: τὰ μὲν ὀπίσω
  choice: ihe ndị dị n'azụ
  rationale: 'Nke a na-echekwa ọtụtụ ihe na ọdịiche gbasara ebe: ihe ndị dị n''azụ megide ihe ndị dị n''ihu.'
- source_word: ἐπιλανθανόμενος
  choice: ana m echefu
  rationale: Ọ na-enye isi okwu ahụ pụtara n'ụzọ nkịtị ma ghara ịkọwa ya karịa ihe ederede kwuru.
- source_word: τοῖς δὲ ἔμπροσθεν
  choice: ihe ndị dị n'ihu
  rationale: Ọ na-adaba n'ụzọ ziri ezi na “ihe ndị dị n'azụ,” ma na-echekwa ntụgharị uche gaa n'ihu.
- source_word: ἐπεκτεινόμενος
  choice: na-agbatịkwa onwe m iru
  rationale: Nke a na-egosipụta mgbatị ahụ siri ike gaa n'ihu, na-echekwakwa onyonyo nke onye na-agbalị iru ihe dị n'ihu.
theological_decisions: []
