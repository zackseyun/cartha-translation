  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ “Ma otu ihe” n'ụdị mkpụmkpụ ya iji chekwaa ellipsis nke Grik, ma chekwaakwa onyonyo nke ijide ihe na ịgbatị onwe gaa n'ihu.
