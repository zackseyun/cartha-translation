    rationale: The Greek ἐπεκτεινόμενος takes the sense of stretching oneself toward the things ahead. Adding an explicit directional construction makes this relation clear without adding interpretive content.
  - severity: low
    issue: Word order in "echeghị m na m ejidela ya" is less idiomatic than available Standard Igbo phrasing.
    rationale: '"Echeghị m na ejidela m ya" preserves exactly the same meaning while reading more smoothly.'
