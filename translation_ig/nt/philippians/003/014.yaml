  text: I press on toward the goal for the prize of the upward call of God in Messiah Jesus[a][b].
translation:
  language: ig
  text: Ana m agba mbọ n’ihu n’ebe mgbaru ọsọ ahụ dị, ka m nweta ihe nrite nke ọkpụkpọ elu nke Chineke n’ime Mesaya Jizọs[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọkpụkpọ nke eluigwe” ma ọ bụ “ọkpụkpọ si n’elu bịa.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik: “n’ime Kraịst Jizọs”; a sụgharịrị Χριστός dịka “Mesaya” n’ihi na ọ bụ aha-ọkwa n’ebe a.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ σκοπόν
  choice: iru ebe a chọrọ
  rationale: N’ọnọdụ ihe atụ nke ịgba ọsọ a, okwu ahụ na-egosi ịga n’ihu n’ebe e guzobere dịka njedebe; ntụgharị a bụ Igbo doro anya ma na-edobe onyinyo ahụ.
- source_word: διώκω
  choice: Ana m agbasi mbọ ike
  rationale: N'ebe a, ngwaa ahụ na-egosi nchụso siri ike na ịga n’ihu, ọ bụghị mkpagbu; okwu a na-egosi ịdị uchu onye na-agba ọsọ.
- source_word: εἰς τὸ βραβεῖον
  choice: ka m nweta ihe nrite
  rationale: εἰς na-egosi ebumnuche nke mgbalị ahụ; ntụgharị a na-eme ka njikọ dị n’etiti ịgba mbọ na ihe nrite doo anya n’Igbo.
- source_word: ἄνω
  choice: nke na-aga n’elu
  rationale: Nke a na-edobe ntụgharị oghere nke ἄνω na njikọ ya na onyinyo ịgba ọsọ, n’agbanyeghị na okwu ahụ nwekwara ike ịpụta na ọkpụkpọ ahụ si n’eluigwe bịa.
- source_word: κλήσεως τοῦ θεοῦ
  choice: ọkpụkpọ Chineke
  rationale: Ọ na-egosipụta usoro genitive nke Grik n'ụzọ Igbo sitere n'okike, na-ahapụ ka Chineke bụrụ onye nwe ma ọ bụ isi iyi ọkpụkpọ ahụ.
- source_word: Χριστῷ
  choice: Mesaya
  rationale: Χριστός bụ aha-ọkwa n'ebe a; “Mesaya” na-eme ka ọrụ aha-ọkwa ahụ pụta ìhè kama ime ya naanị akụkụ aha mmadụ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaya Jizọs
  rationale: A na-edobe okwu njikọ ἐν na asụsụ Pọl banyere ịdị n’ime Mesaya, n’enweghị ịkọwa ya karịa ihe ederede kwuru.
theological_decisions:
- issue: Ihe ἄνω κλήσεως pụtara
  choice: ọkpụkpọ ... nke na-aga n’elu
  alternative: ọkpụkpọ nke eluigwe / ọkpụkpọ si n’elu bịa
  rationale: Nhọrọ a na-edobe onyinyo ịgba ọsọ na ntụgharị “n’elu,” ma ihe odide ala ala na-echekwa nghọta ndị ọzọ gbasara isi iyi ma ọ bụ ọdịdị ọkpụkpọ ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ebe a chọrọ” gosipụta ebe njedebe n’ọsọ, “ihe nrite” maka ụgwọ onye meriri, ma debe “n’ime Mesaya Jizọs” n’ụdị dị nso n’asụsụ Pọl.
