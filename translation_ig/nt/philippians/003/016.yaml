  yaml_path: translation/nt/philippians/003/016.yaml
  text: Only[a], let us keep in step with what we have attained.
translation:
  language: ig
  text: Naanị[a], ka anyị na-aga n’usoro ahụ ruo n’ókè anyị rurula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ka anyị na-eso otu ụkpụrụ ahụ” / “ka anyị nọgide n’otu ụkpụrụ ahụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πλήν
  choice: Naanị
  rationale: N’ebe a, okwu ahụ na-amachi ma na-eme ka ndụmọdụ Pọl lekwasị anya n’ihe dị mkpa; “Naanị” na-egosipụta ike a n’Igbo dị mfe ma doo anya.
- source_word: εἰς ὃ
  choice: n’ókè
  rationale: Nkebiokwu a na-arụtụ aka n’ókè ma ọ bụ n’ogo e rutere. “N’ókè” na-ejikọta nke ọma na ἐφθάσαμεν ma na-ezere ịkọwapụta ihe Grik na-ahapụghị anya.
- source_word: ἐφθάσαμεν
  choice: anyị rurula
  rationale: Ụdị ngwaa a na-ekwu maka ebe ma ọ bụ ogo e rutere nke ka metụtara ọnọdụ ha ugbu a. “Anyị rurula” na-egosipụta nke a n’Igbo nkịtị.
- source_word: τῷ αὐτῷ
  choice: kwekọrọ
  rationale: Dative a na-egosi ịga n’otu usoro, ụzọ, ma ọ bụ ụkpụrụ ahụ, ma aha nke ihe ahụ adịghị n’ihe odide SBLGNT. “Kwekọrọ” na-enye echiche ahụ n’etinyeghị aha a na-ekwughị kpọmkwem.
- source_word: στοιχεῖν
  choice: ịnọgide na-aga n’usoro
  rationale: Ngwaa a na-enye echiche nke ịga n’ahịrị ma ọ bụ ibi ndụ kwekọrọ n’ụkpụrụ. Nsụgharị a na-echekwa ihe atụ nke ije ma bụrụkwa Igbo a na-aghọta nke ọma.
theological_decisions:
- issue: Ma a ga-etinye aha doro anya dịka “ụkpụrụ” n’ihi τῷ αὐτῷ
  choice: Etinyeghị aha ahụ n’ahịrị bụ isi; e jiri “na-aga n’usoro kwekọrọ” gosipụta echiche ya.
  alternative: “ka anyị na-eje ije site n’otu ụkpụrụ ahụ” ma ọ bụ “ka anyị nọgide n’otu ụkpụrụ ahụ.”
  rationale: Ihe odide Grik dị mkpirikpi hapụrụ ihe a na-agbaso ka ọ bụrụ ihe a ghọtara n’enweghị ikwu aha ya. Ịghara itinye “ụkpụrụ” n’ahịrị bụ isi na-ezere ịgbaso mgbakwunye ndị dị n’ụfọdụ ihe odide ọzọ ma na-echekwa ntakịrị mgbagwoju anya dị na isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Na-aga n’usoro” na-echekwa ihe atụ nke στοιχεῖν, ebe “n’ókè anyị rurula” na-egosi ogo e rutere n’enweghị ime ka okwu ahụ pụta ihe karịa ka Grik si kwuo ya.
