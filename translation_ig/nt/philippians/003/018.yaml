id: PHP.3.18
reference: Philippians 3:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ περιπατοῦσιν οὓς πολλάκις ἔλεγον ὑμῖν, νῦν δὲ καὶ κλαίων λέγω, τοὺς ἐχθροὺς τοῦ σταυροῦ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/018.yaml
  text: For many walk[a], whom I often told you about, and now even weeping I say, are enemies of the cross of Messiah,
translation:
  language: ig
  text: N’ihi na ọtụtụ mmadụ na-ebi ndụ[a], ndị m gwara unu banyere ha ọtụtụ ugboro, ma ndị m na-agwa unu ugbu a, ọbụna ka m na-akwa ákwá, na ha bụ ndị iro nke obe Mesaịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “na-eje ije.” N’ebe a ọ pụtara ụzọ mmadụ si ebi ndụ.
    reason: Echekwara ihe atụ okwu Grik ma kọwaa ihe ọ pụtara n’Igbo ugbu a.
  - marker: b
    text: Ma ọ bụ, “Kraịst.”
    reason: Ọ na-enye ụdị ọzọ a na-ejikarị asụgharị utu aha Grik Χριστός.
lexical_decisions:
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: Adjective a na-arụ ọrụ dịka aha ma na-egosi ọtụtụ ndị; ‘ọtụtụ mmadụ’ doro anya ma bụrụ Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a na-enye ihe mere e ji kwuo ndụmọdụ dị n’amaokwu bu ya ụzọ.
- source_word: περιπατοῦσιν
  choice: na-ebi ndụ
  rationale: N’ebe a, okwu Grik pụtara ụzọ mmadụ si ebi ndụ, ọ bụghị naanị ije ụkwụ; nsụgharị a na-eme ka ihe Pọl bu n’obi doo onye na-agụ Igbo anya, ebe nkọwa ala peeji na-echekwa ihe atụ okwu Grik.
- source_word: πολλάκις ἔλεγον ὑμῖν
  choice: ndị m gwara unu banyere ha ọtụtụ ugboro
  rationale: Ọ na-echekwa omume e mere ugboro ugboro n’oge gara aga, nke imperfect ἔλεγον na πολλάκις na-egosi.
- source_word: νῦν δὲ καὶ κλαίων λέγω
  choice: ndị m na-agwakwa unu banyere ha ugbu a, ọbụna ka m na-akwa ákwá
  rationale: Ọ na-echekwa okwu a na-ekwu ugbu a, ihe καὶ ji mesie ya ike, na omume ịkwa ákwá nke na-aga n’otu oge ahụ.
- source_word: ἐχθροὺς
  choice: ndị iro
  rationale: Nke a na-egosi ndị na-emegide obe n’ụzọ siri ike ma kpọmkwem.
- source_word: σταυροῦ
  choice: obe
  rationale: ‘Obe’ bụ okwu Igbo kwụ ọtọ maka σταυρός ma na-eburu ihe ọ pụtara banyere ọnwụ n’obe n’ebe a.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dịka utu aha n’ahịrịokwu a; ‘Mesaịa’ na-eme ka ihe utu aha ahụ pụtara pụta ìhè kama iji ya dịka aha nkịtị.
theological_decisions:
- issue: Otu e si asụgharị Χριστοῦ n’okwu ‘obe nke Χριστός’
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a okwu ahụ bụ utu aha nke Onye E Tere Mmanụ, ya mere ‘Mesaịa’ na-echekwa ihe ọ pụtara. E tinyere ‘Kraịst’ na nkọwa ala peeji dịka ụdị a maara nke ọma, n’enweghị ịgbanwe ihe ederede Grik kwuru.
- issue: Mmekọrịta περιπατοῦσιν na τοὺς ἐχθρούς
  choice: na-ebi ndụ dị ka ndị iro
  alternative: na-eje ije, ndị iro
  rationale: Akụkụ ikpeazụ na-akọwa ụdị ndụ ọtụtụ ndị ahụ na-ebi. ‘Dị ka ndị iro’ na-eme ka njikọ ahụ doo anya n’Igbo ma ghara ikpebi ndị ndị a bụ karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu nwere akara ogologo iji debe usoro nke ahịrịokwu Grik—isiokwu, nkebi ndị na-akọwa ya, na nkwubi okwu ‘dị ka ndị iro’—n’enweghị ime ka Igbo sie ike. E zere okwu ụka nke otu denominashọn pụrụ iche.
