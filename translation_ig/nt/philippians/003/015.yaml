reference: Philippians 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅσοι οὖν τέλειοι, τοῦτο φρονῶμεν· καὶ εἴ τι ἑτέρως φρονεῖτε, καὶ τοῦτο ὁ θεὸς ὑμῖν ἀποκαλύψει·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/015.yaml
  text: Therefore[a], all of us who are mature should think this way; and if you think differently about anything[b], God will reveal this also to you.
translation:
  language: ig
  text: Ya mere, ka anyị niile bụ ndị tozuru okè[a] chee echiche otú a; ọ bụrụkwa na n’ihe ọ bụla unu na-eche echiche n’ụzọ dị iche[b], Chineke ga-ekpughekwara unu nke a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ndị zuru oke.” Okwu Grik τέλειοι nwere ike ịpụta “ndị zuru oke,” ma n’ebe a o yikarịrị ka ọ na-ekwu maka ndị tozuru okè n’ime mmụọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “ọ bụrụkwa na n’ihe ọ bụla unu na-eche echiche n’ụzọ ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl na-ewepụta site n’ihe o kwuru tupu nke a.
- source_word: ὅσοι
  choice: anyị niile bú ndị
  rationale: Ọ na-agụnye Pọl na ndị niile nọ n’òtù ahụ bụ ndị okwu na-esonụ metụtara.
- source_word: τέλειοι
  choice: tozuru okè
  rationale: N’ebe a, ọ kacha egosi ntozu ime mmụọ, ma okwu Igbo a ka na-ahapụ echiche nke iru ntozu ma ọ bụ izu oke ka ihe ndị gbara amaokwu ahụ gburugburu kpebie.
- source_word: τοῦτο φρονῶμεν
  choice: ka ... nwee otu echiche a
  rationale: Nke a na-egosipụta subjunctive nke agbamume ma na-ezo aka n’uche na ụzọ iche echiche Pọl kọwara n’amaokwu ndị bu ụzọ.
- source_word: εἴ τι ἑτέρως φρονεῖτε
  choice: ọ bụrụkwa na unu nwere echiche dị iche n’ihe ọ bụla
  rationale: Ọ na-edobe ọnọdụ ahụ, echiche nke ịdị iche n’uche, na obosara nke τι.
- source_word: ἀποκαλύψει
  choice: ga-ekpughekwara unu
  rationale: Ọ na-edobe echiche nke Chineke ime ka ihe a na-amaghị pụta ìhè, tinyere καί nke pụtara na Chineke ga-ekpughere ha nke a kwa.
theological_decisions:
- issue: Ihe τέλειοι pụtara n’agbamume Pọl
  choice: ndị tozuru okè
  alternative: ndị zuru oke
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-egosi na Pọl ka na-agbalị iru ihe dị n’ihu; ya mere, okwu a yiri ka ọ na-ekwu maka ntozu ime mmụọ karịa izu oke na-enweghị ntụpọ. Ihe e dere n’ala peeji na-echekwa ụzọ ọzọ e nwere ike isi ghọta ya.
- issue: Onye φρονῶμεν na-agụnye
  choice: ka anyị ... nwee
  alternative: unu kwesịrị inwe
  rationale: Ụdị onye mbụ n’ọnụọgụgụ φρονῶμεν gụnyere Pọl na ndị ọ na-agwa okwu, n’ụdị agbamume.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “nwee otu echiche a” mee ka echiche na ọnọdụ uche nke φρονέω doo anya, ma zere okwu ụka pụrụ iche nke otu nzukọ.
