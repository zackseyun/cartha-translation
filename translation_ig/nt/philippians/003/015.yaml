    text: A pụkwara ịtụgharị ya, “ndị zuru oke.” Okwu Grik τέλειοι nwere ike ịpụta “ndị zuru oke,” ma n’ebe a o yikarịrị ka ọ na-ekwu maka ndị tozuru okè n’ime mmụọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “ọ bụrụkwa na n’ihe ọ bụla unu na-eche echiche n’ụzọ ọzọ.”
    reason: lexical_alternative
  revision_rationale: The revision removes the added “otu” (“one/same”) and uses “chee echiche otú a” to represent the present hortatory subjunctive φρονῶμεν and the backward-looking demonstrative τοῦτο. It also regularizes “bụ” and improves the footnote editorial phrasing. No doctrinal interpretation has been added, and the alternative sense of τέλειοι remains available in the footnote.
