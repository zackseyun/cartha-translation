id: PHP.3.20
reference: Philippians 3:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμῶν γὰρ τὸ πολίτευμα ἐν οὐρανοῖς ὑπάρχει, ἐξ οὗ καὶ σωτῆρα ἀπεκδεχόμεθα κύριον Ἰησοῦν Χριστόν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/020.yaml
  text: For our citizenship is in heaven[a], from where we also eagerly await a Savior[d][c][b], the Lord Jesus the Messiah.
translation:
  language: ig
  text: N’ihi na anyị bụ ụmụ amaala eluigwe[a][b], ọ bụkwa n’ebe ahụ ka anyị si na-atụsi anya ike na-echere Onye Nzọpụta, bụ́ Onyenwe anyị Jizọs, Mesaịa ahụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obodo anyị dị n’eluigwe.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “n’eluigwe” dị n’ụdị ọtụtụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Onyenwe anyị Jizọs Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: πολίτευμα
  choice: anyị bụ ụmụ amaala eluigwe
  rationale: Nkebi okwu a na-egosipụta ọnọdụ na njikọ ndị kwere ekwe dị ka ụmụ amaala. Nsụgharị a na-edowe echiche ndọrọ ndọrọ obodo dị n’okwu Grik ahụ ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: ἐν οὐρανοῖς
  choice: eluigwe
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ, ‘eluigwe’ bụ ụzọ Igbo si ekwu maka ebe ahụ n’ụzọ doro anya ma bụrụkwa nke e ji eme ihe.
- source_word: ὑπάρχει
  choice: anyị bụ
  rationale: N’usoro ahịrịokwu Igbo a, ‘anyị bụ’ na-egosipụta ọnọdụ dị ugbu a nke ngwaa Grik ahụ n’ụzọ nkịtị, kama ịsụgharị ya n’ụzọ siri ike dịka ‘dị adị.’
- source_word: ἐξ οὗ
  choice: ọ bụkwa n’ebe ahụ ka anyị si
  rationale: Nke a na-ezo azụ n’eluigwe dị ka ebe Onye Nzọpụta ga-esi bịa, ma na-echekwa echiche ebe okwu Grik ahụ nwere.
- source_word: σωτῆρα
  choice: Onye Nzọpụta
  rationale: Nke a bụ okwu Igbo doro anya na nke a na-ejikarị akọwa onye na-azọpụta, ma na-echekwa ibu okwu ahụ nwere banyere Jizọs.
- source_word: ἀπεκδεχόμεθα
  choice: na-atụsi anya ike na-echere
  rationale: Okwu ndị a na-egosipụta ma nchere na atụmanya siri ike dị n’ụdị ngwaa Grik ahụ.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo kwesịrị ekwesị maka aha nsọpụrụ ahụ n’ebe a, ma na-echekwa ojiji ya banyere Kraịst.
- source_word: Χριστόν
  choice: Mesaịa ahụ
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dị ka aha ọkwa nke Onye ahụ e tere mmanụ; ‘Mesaịa ahụ’ na-egosipụta ihe aha ahụ pụtara kama ime ya ka ọ bụrụ naanị aha mmadụ.
theological_decisions:
- issue: Nsụgharị Χριστόν n’usoro aha κύριον Ἰησοῦν Χριστόν
  choice: Mesaịa ahụ n’isiokwu
  alternative: Kraịst
  rationale: Ọnọdụ a na-ekwu maka Onye Nzọpụta a na-atụ anya ya, ya mere echiche aha ọkwa nke Χριστός ka dị ndụ. E tinyere ‘Kraịst’ n’ala ala peeji ka e wee ghara izochi ụzọ ọdịnala si asụgharị ya.
- issue: Ihe πολίτευμα na-egosi
  choice: ọnọdụ anyị dị ka ụmụ amaala eluigwe
  alternative: obodo anyị / ọchịchị obodo anyị
  rationale: Okwu Grik ahụ nwere ike izo aka n’ọnọdụ ịbụ nwa amaala ma ọ bụ n’obodo ndị mmadụ so na ya. Isiokwu ahụ jiri nkebi okwu doro anya maka ịbụ ụmụ amaala, ebe e debere nghọta nke ‘obodo’ n’ala ala peeji.
translation_notes:
  register: E jiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Na-atụsi anya ike na-echere’ na-eburu mmetụta atụmanya siri ike, ebe ‘Mesaịa ahụ’ na-eme ka Χριστός doo anya dịka aha ọkwa. Akara ala ala peeji niile dị n’isiokwu.
