base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/001.yaml
  text: Finally[a], my brothers, rejoice in the Lord. To write the same things to you is not troublesome for me[d][c][b], and is safe for you.
translation:
  language: ig
  text: N'ikpeazụ[a], ụmụnna m[b], ṅụrịa ọṅụ n'ime Onyenwe anyị. Ideere unu otu ihe ndị ahụ anaghị esiri m ike[c], ma ọ bụ ihe nchebe nye unu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Banyere ihe ndị ọzọ,” ma ọ bụ, “Site ugbu a gawa.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n'ebe a na-ezo aka n'ọgbakọ niile, ya bụ, ma ndị nwoke ma ndị nwanyị.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “adịghị arọ m,” ma ọ bụ, “adịghị agwụ m ike.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “ọ bụ nchekwa nye unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: N'ikpeazụ
  rationale: Ọ bụ akara ntụgharị n'okwu. “N'ikpeazụ” bụ Igbo doro anya, ma nkọwa ndị ọzọ ka e debere n'okpuru peeji n'ihi na okwu Grik ahụ nwere ike ịpụta ihe karịrị otu.
- source_word: ἀδελφοί μου
  choice: ụmụnna m
  rationale: “Ụmụnna” bụ ụzọ Igbo sitere n'okike e si akpọ ndị otu ọgbakọ, ma ọ na-agụnye ndị nwoke na ndị nwanyị n'ọnọdụ a.
- source_word: χαίρετε
  choice: ṅụrịa ọṅụ
  rationale: Na-egosipụta iwu ka ọtụtụ mmadụ nwee ọṅụ, ma na-echekwa ike ndụmọdụ ahụ.
- source_word: ἐν κυρίῳ
  choice: n'ime Onyenwe anyị
  rationale: Na-echekwa okwu njikọ ahụ na ntọala okpukpe Pọl nyere ọṅụ ahụ.
- source_word: τὰ αὐτά
  choice: otu ihe ndị ahụ
  rationale: Na-ahapụ ihe okwu ahụ na-ezo aka na ya ka ọ dị obosara ma ghara ikpebi ma ọ bụ ndụmọdụ ụfọdụ ma ọ bụ ozizi gara aga.
- source_word: γράφειν
  choice: idekwara
  rationale: Na-anọchi infinitive Grik n'ụzọ Igbo na-aga were were n'ahịrịokwu a.
- source_word: οὐκ ὀκνηρόν
  choice: adịghị enye m nsogbu
  rationale: Na-egosi na ideghachi ihe ndị ahụ anaghị arọ Pọl ma ọ bụ mee ka ọ laa azụ, na-enweghị ime ka ọ bụrụ naanị ike ọgwụgwụ.
- source_word: ἀσφαλές
  choice: ihe na-echebe unu
  rationale: Na-egosipụta nchekwa na nchedo okwu Grik ahụ pụtara n'Igbo doro anya.
theological_decisions:
- issue: Aha e ji akpọ ọgbakọ
  choice: ụmụnna m
  alternative: ụmụnne m ndị nwoke na ndị nwanyị
  rationale: Ọ bụ ezie na ἀδελφοί bụ ụdị ọtụtụ nke nwoke na ụtọasụsụ Grik, n'ebe a ọ na-akpọ ọgbakọ niile. “Ụmụnna” na Standard Igbo nwere ike ịgụnye ha niile n'ụzọ sitere n'okike.
- issue: Ihe ideghachi ihe Pọl kwuru na-eme
  choice: ihe na-echebe unu
  alternative: ọ dị unu mma ma na-enye unu ntụkwasị obi
  rationale: Nhọrọ ahụ na-echekwa echiche nchekwa nke ἀσφαλές n'enweghị ịkọwa kpọmkwem ụdị ihe ize ndụ e ji ya egbochi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ụmụnna” mee ka okwu ahụ bụrụ nke Igbo sitere n'okike ma kọwaa oke ndị ọ gụnyere n'okpuru peeji. A hapụrụ mgbagwoju anya dị na τὰ αὐτά ka ọ ghara ịbụ nke a kọwara karịa isi mmalite.
