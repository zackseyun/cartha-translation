- from: N'ikpeazụ[a], ụmụnna m[b], ṅụrịa ọṅụ n'ime Onyenwe anyị. Idekwara unu otu ihe ndị ahụ adịghị enye m nsogbu[c], ma ọ bụ ihe na-echebe unu[d].
  to: N'ikpeazụ[a], ụmụnna m[b], ṅụrịa ọṅụ n'ime Onyenwe anyị. Ideere unu otu ihe ndị ahụ anaghị esiri m ike[c], ma ọ bụ ihe nchebe nye unu[d].
  rationale: The revision removes the unsupported additive force in “Idekwara” and corrects the logical relation between the two clauses. “Ihe nchebe nye unu” preserves the protective/safeguarding sense of ἀσφαλές while remaining natural Igbo. Footnote anchors and all four footnotes are retained and correctly matched.
