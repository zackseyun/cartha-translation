base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/006.yaml
  text: as to zeal[a], persecuting the church; as to righteousness under the law[b], having become blameless.
translation:
  language: ig
  text: N’ihe banyere ịnụ ọkụ n’obi, akpagburu m ọgbakọ; n’ihe banyere ezi omume[a] n’okpuru Iwu[b], aghọrọ m onye a na-apụghị ịta ụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “n’Iwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: n’ihe banyere
  rationale: Nkebiokwu a na-egosi akụkụ a na-eji atụ Pọl; ọ na-edobekwa usoro nkwughachi nke amaokwu ahụ n’Igbo nkịtị.
- source_word: ζῆλος
  choice: ịnụ ọkụ n’obi
  rationale: Nke a na-egosi oke ịnụ ọkụ n’obi na nkwụsi ike Pọl nwere n’okpukpe ya mbụ.
- source_word: διώκων
  choice: akpagburu m
  rationale: N’ebe a, okwu ahụ pụtara ime ndị kwere ekwe ihe ike n’ihi okwukwe ha. E tinyere onye nke mbụ iji mee ka ahịrịokwu ndepụta ahụ bụrụ Igbo doro anya, ebe onye na-ekwu okwu pụtara ìhè n’ọnọdụ ya.
- source_word: ἐκκλησίαν
  choice: ọgbakọ ndị kwere na Kraịst
  rationale: Nke a na-egosi obodo ndị Kraịst, ọ bụghị naanị nzukọ nkịtị, ma zere nghọta nke ‘ụka’ dị ka ụlọ ma ọ bụ otu denomination.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: ‘Ezi omume’ na-egosi ọnọdụ ziri ezi a na-atụ dịka Iwu si dị; ‘ezi ikpe’ ka nọkwa dị ka nhọrọ n’okpuru amaokwu.
- source_word: ἐν νόμῳ
  choice: n’okpuru Iwu
  rationale: Nke a bụ Igbo doro anya maka mpaghara ma ọ bụ ụkpụrụ Iwu ji atụ ezi omume ahụ; nkọwa okwu n’okpuru na-edobe ọdịdị nkịtị ‘n’Iwu.’
- source_word: γενόμενος
  choice: aghọrọ m
  rationale: Ọ na-edobe echiche nke ihe ruru ọnọdụ zuru ezu n’oge ndụ Pọl gara aga, dịka participle aorist si dị.
- source_word: ἄμεμπτος
  choice: onye a na-apụghị ịta ụta
  rationale: Nke a pụtara na a pụghị ịbo ya ebubo n’usoro nyocha ahụ, n’ebughị ụzọ kwuo na o nweghị mmehie ọ bụla.
theological_decisions:
- issue: Ókè nkwupụta Pọl na a pụghị ịta ya ụta ruru
  choice: Nkwupụta ahụ metụtara ezi omume a na-atụ n’okpuru Iwu.
  alternative: Pọl na-ekwu na o nweghị mmehie ọ bụla ma ọ bụ na okwu ya bụ naanị okwu ịkwa emo.
  rationale: Ụtọasụsụ Grik jikọtara ἄμεμπτος na δικαιοσύνη τὴν ἐν νόμῳ. Ya mere, okwu ahụ na-akọ ọnọdụ ndụ ya mbụ dịka ụkpụrụ Iwu si tụọ ya, ọ bụghị nkwupụta zuru ụwa ọnụ na mmadụ zuru oke n’ihu Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ọgbakọ ndị kwere na Kraịst’ iji mee ka ἐκκλησία doo anya n’enweghị ịkwado otu denomination. E debere usoro nkwughachi ‘n’ihe banyere … n’ihe banyere …’ nke Grik.
