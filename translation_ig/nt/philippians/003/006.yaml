revisions:
- from: N’ihe banyere ịnụ ọkụ n’obi, akpagburu m ọgbakọ ndị kwere na Kraịst; n’ihe banyere ezi omume[a] n’okpuru Iwu[b], aghọrọ m onye a na-apụghị ịta ụta.
  to: N’ihe banyere ịnụ ọkụ n’obi, akpagburu m ọgbakọ; n’ihe banyere ezi omume[a] n’okpuru Iwu[b], aghọrọ m onye a na-apụghị ịta ụta.
  rationale: Removed the added qualifier from “church” in order to preserve the source’s wording while retaining the established contextual sense. The alternative in footnote a has been adjusted to a more idiomatic Standard Igbo expression for “justice.” The rendering continues to limit “blameless” to the stated Law-related standard, rather than implying sinlessness.
