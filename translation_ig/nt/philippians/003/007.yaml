  text: Ἀλλὰ ἅτινα ἦν μοι κέρδη, ταῦτα ἥγημαι διὰ τὸν Χριστὸν ζημίαν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/007.yaml
  text: But whatever things were gains to me[b][a], these I have considered loss because of Messiah.
translation:
  language: ig
  text: Ma ihe ọ bụla bụụrụ m uru, agụwo m ihe ndị ahụ dịka mfu[a] n’ihi Mesaịa ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ewerewo m ihe ndị ahụ dịka mfu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị siri ike megide ihe ndị Pọl kwuru tupu nke a banyere ihe ọ pụrụ ịtụkwasị obi.
- source_word: ἅτινα ἦν μοι κέρδη
  choice: ihe ọ bụla bụụrụ m uru
  rationale: “Ihe ọ bụla” na-achịkọta uru niile Pọl depụtara; “uru” na-edobekwa echiche azụmahịa dị na κέρδη.
- source_word: ταῦτα ἥγημαι
  choice: ewerela m ihe ndị ahụ
  rationale: Ụdị ngwaa zuru oke na-egosi mkpebi e mere nke ka na-achị echiche Pọl ugbu a; “ewerela m” na-egosipụta ntule ahụ n’Igbo dị mfe ma dị ndụ.
- source_word: διὰ τὸν Χριστὸν
  choice: n’ihi Mesaịa ahụ
  rationale: διά tinyere accusative na-egosi ihe kpatara ya; “Mesaịa” na-edobe Χριστός dịka aha ọkwa, ọ bụghị naanị dịka aha mmadụ.
- source_word: ζημίαν
  choice: dị ka mfu
  rationale: “Mfu” na-emegide “uru” ma na-echekwa ihe atụ nke ịgụ uru na mfu; otu mkpụrụokwu ahụ na-achịkọta uru ndị ahụ niile dịka otu mfu.
theological_decisions:
- issue: Otú e si sụgharị Χριστόν
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka aha ọkwa nke Onye E Tere Mmanụ. “Mesaịa” na-eme ka ọrụ aha ọkwa ahụ pụta ìhè, ebe “Kraịst” bụkwa okwu Ndị Kraịst Igbo maara nke ọma.
- issue: Ihe διὰ τὸν Χριστόν pụtara
  choice: n’ihi Mesaịa ahụ
  alternative: n’ihi Kraịst
  rationale: διά na accusative ebe a kacha egosi ihe kpatara ntule ọhụrụ Pọl; a hapụghị ya ka ọ bụrụ naanị ebumnuche nke “maka ọdịmma ya.”
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu, dee ya. Ahịrịokwu ahụ na-echekwa ntụnyere azụmahịa dị n’etiti “uru” na “mfu,” tinyere mmetụta nke mkpebi gara aga nke ka dị irè ugbu a.
