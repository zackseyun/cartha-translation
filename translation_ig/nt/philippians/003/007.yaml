- from: Ma ihe ọ bụla bụụrụ m uru, ewerela m ihe ndị ahụ dị ka mfu[a] n’ihi Mesaịa ahụ.[b]
  to: Ma ihe ọ bụla bụụrụ m uru, agụwo m ihe ndị ahụ dịka mfu[a] n’ihi Mesaịa ahụ.[b]
  rationale: The revision makes Paul’s settled accounting judgment explicit with “agụwo m ... dịka mfu,” while preserving the singular collective “mfu,” the contrast with “uru,” and the causal sense of “n’ihi.” The rendering “Mesaịa ahụ” is retained as the translation of the title Χριστόν; the familiar form “Kraịst” remains an alternative in the footnote.
