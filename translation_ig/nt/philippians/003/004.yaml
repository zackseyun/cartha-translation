    text: 'Ma ọ bụ, “ntụkwasị obi n’otú mmadụ dị na n’ihe a na-ahụ anya.” N’asụsụ Grik: “n’anụ ahụ.”'
    reason: lexical_alternative
  revision_rationale: The revision preserves the source’s concessive opening, emphatic “even,” repeated “flesh,” and comparative force. It keeps “anụ ahụ” in the text and confines the contextual sense of status or outward credentials to the footnote.
