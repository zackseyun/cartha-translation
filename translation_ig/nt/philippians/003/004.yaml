source:
  edition: SBLGNT
  text: καίπερ ἐγὼ ἔχων πεποίθησιν καὶ ἐν σαρκί. Εἴ τις δοκεῖ ἄλλος πεποιθέναι ἐν σαρκί, ἐγὼ μᾶλλον·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/004.yaml
  text: Though I myself have confidence even in the flesh. If anyone else thinks he has confidence in the flesh[a], I have more.
translation:
  language: ig
  text: Ọ bụ ezie na mụ onwe m nwere ntụkwasị obi ọbụna n’anụ ahụ. Ọ bụrụ na onye ọ bụla ọzọ echee na ya nwere ntụkwasị obi n’anụ ahụ[a], m nwere ntụkwasị obi karịa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ntụkwasị obi n’otú mmadụ dị na n’ihe a na-ahụ anya.” N’asụsụ Grik: “n’anụ ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίπερ
  choice: Ọ bụ ezie na
  rationale: Nke a na-egosipụta nkwenye nke na-eduga n’ihe ga-emegide ya, dị ka okwu Grik si eme.
- source_word: ἐγὼ
  choice: mụ onwe m
  rationale: Ọ na-echekwa nkwusi ike Pọl tinyere n’aha onye nke mbụ.
- source_word: πεποίθησιν / πεποιθέναι
  choice: ntụkwasị obi / nwere ntụkwasị obi
  rationale: Ọ na-egosipụta obi ike ma ọ bụ ndabere siri ike, n’enweghị ịgbatị okwu ahụ ka ọ bụrụ naanị ihe mmadụ ji anya isi.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: Ọ na-echekwa ihe oyiyi okwu Grik n’ahịrị bụ isi; ihe ndị gbara amaokwu a gburugburu na-egosi na ọ bụ ọnọdụ mmadụ na ihe mpụga ọ na-eji anya isi ka a na-ekwu maka ya, ọ bụghị kpọmkwem ọchịchọ mmehie.
- source_word: δοκεῖ
  choice: echee
  rationale: Ọ bụ okwu Igbo dị mfe ma kwekọọ n’echiche nke mmadụ ịtụle ma ọ bụ iche na ya nwere ntụkwasị obi dị otú ahụ.
- source_word: ἄλλος
  choice: ọzọ
  rationale: Mgbe e jikọtara ya na ‘onye ọ bụla,’ ọ na-echekwa ntụnyere Pọl na-eme n’etiti onwe ya na ndị ọzọ.
- source_word: μᾶλλον
  choice: nke m karịrị nke ya
  rationale: Nke a na-eme ka ntụnyere ahụ doo anya n’Igbo ma na-echekwa nkwupụta Pọl na ihe ọ ga-eji nwee ntụkwasị obi karịrị nke onye ọzọ.
theological_decisions:
- issue: Ihe σάρξ pụtara na Ndị Filipaị 3:4
  choice: E debere ya dịka “anụ ahụ” n’ahịrị bụ isi, ebe nkọwa ala peeji na-akọwa na n’ebe a ọ na-ezo aka n’ihe mmadụ bụ na ihe a na-ahụ anya ọ na-eji nwee ntụkwasị obi.
  alternative: “ọnọdụ mmadụ na ihe o ji bụrụ onye a ma ama” ma ọ bụ ịkọwa ya dịka “ọdịdị mmehie.”
  rationale: Amaokwu 5–6 na-edepụta ibi úgwù, agbụrụ, iwu, na ịnụ ọkụ n’obi; ya mere okwu a n’ebe a metụtara ihe mmadụ bụ na ihe mpụga ọ rụzuru, ọ bụghị isiokwu nke ọdịdị mmehie. Idebe “anụ ahụ” na-echekwa obosara na esemokwu dị n’okwu Grik.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere “anụ ahụ” iji chekwaa okwu Grik, ma kọwaa ihe ọ pụtara n’ọnọdụ a n’ala peeji.
