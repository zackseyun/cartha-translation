revisions:
- from: Ọ bụ ezie na mụ onwe m nwekwara ntụkwasị obi n’anụ ahụ. Ọ bụrụ na onye ọ bụla ọzọ echee na ya nwere ntụkwasị obi n’anụ ahụ[a], nke m karịrị nke ya.
  to: Ọ bụ ezie na mụ onwe m nwere ntụkwasị obi ọbụna n’anụ ahụ. Ọ bụrụ na onye ọ bụla ọzọ echee na ya nwere ntụkwasị obi n’anụ ahụ[a], m nwere ntụkwasị obi karịa ya.
  rationale: The revision preserves the source’s concessive opening, emphatic “even,” repeated “flesh,” and comparative force. It keeps “anụ ahụ” in the text and confines the contextual sense of status or outward credentials to the footnote.
