id: PHP.3.12
reference: Philippians 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐχ ὅτι ἤδη ἔλαβον ἢ ἤδη τετελείωμαι, διώκω δὲ εἰ καὶ καταλάβω, ἐφ’ ᾧ καὶ κατελήμφθην ὑπὸ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/012.yaml
  text: Not that I have already received it or have already been perfected[c][b][a], but I press on to see if I may also take hold of that for which I too was taken hold of by Christ.
translation:
  language: ig
  text: Ọ bụghị na enwetalarị m ya[a], ma ọ bụ na e meworị m ka m zuo oke[b]; kama ana m achụso ya, ka m hụ ma m̀ ga-ejidekwa ihe ahụ Kraịst[c] jidere m maka ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “enwetalarị m”; Grik ekwughị kpọmkwem ihe e nwetara, kama a na-aghọta ya site n’ihe ndị gbara amaokwu a gburugburu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “aghọọlarị m onye zuru oke” ma ọ bụ “e meworị m onye zuru ezu.”
    reason: lexical_alternative
  - marker: c
    text: Grik bụ Christos; a pụkwara ịsị “Mezaịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβον
  choice: enwetalarị m ya
  rationale: “Enweta” na-egosi irute ma ọ bụ inweta ihe a na-ekwu maka ya n’amaokwu ndị gbara ya gburugburu. E tinyere “ya” iji mee ka Igbo doo anya, ebe Grik hapụrụ ihe a na-enweta n’ekwughị aha.
- source_word: τετελείωμαι
  choice: e meworị m ka m zuo oke
  rationale: Nke a na-echekwa olu nnara na ọnọdụ nke ihe e mezuru nke perfect passive, ma ọ naghị ekpebi ihe okwu ahụ pụtara n’usoro ozizi ọ bụla gbasara izu oke.
- source_word: διώκω
  choice: ana m agbasi mbọ ike
  rationale: N’ebe a, διώκω pụtara ịnọgide na-achụso ihe mgbaru ọsọ. Okwu Igbo a bụ nke nkịtị ma na-egosi mbọ na-aga n’ihu.
- source_word: καταλάβω
  choice: m̀ ga-ejidekwa
  rationale: “Jide” na-echekwa ihe atụ nke ijide ihe ma na-ejikọta okwu a na κατελήμφθην e ji otu mgbọrọgwụ kwuo n’azụ amaokwu ahụ.
- source_word: ἐφ’ ᾧ
  choice: ihe ahụ ... maka ya
  rationale: A tụgharịrị nkebiokwu a dị ka ihe mgbaru ọsọ ma ọ bụ nzube Kraịst ji jide Pọl, ma e kwughị ya n’ụzọ ga-ewepụ ohere nghọta dị n’usoro Grik.
- source_word: κατελήμφθην
  choice: jidere m
  rationale: Okwu a na-echekwa olu nnara dị na Grik n’echiche ya, ma na-eme ka egwuregwu okwu dị n’etiti “jidekwa” na “jidere” pụta ìhè.
- source_word: Χριστοῦ
  choice: Kraịst
  rationale: “Kraịst” bụ ntụgharị a maara nke ọma n’akwụkwọ Pọl, ebe odide ala peeji na-egosi na a pụkwara ịghọta aha ahụ dị ka “Mezaịa.”
theological_decisions:
- issue: Ma τετελείωμαι ọ̀ ga-egosi ozizi banyere enweghị mmehie kpamkpam
  choice: e meworị m ka m zuo oke
  alternative: aghọọlarị m onye zuru oke; e meworị m onye zuru ezu
  rationale: Pọl na-agọnahụ na ya eruola ọnọdụ e mezuru, ma Grik akọwaghị ọnọdụ ahụ site n’usoro ozizi e mepụtara mgbe e mesịrị. Nsụgharị ahụ na-echekwa olu nnara na esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ana m agbasi mbọ ike” na-egosi ịchụso ihe mgbaru ọsọ n’enweghị okwu ochie ma ọ bụ nke otu ụka kpọmkwem. E jikwa “jidekwa/jidere” chekwaa egwuregwu okwu dị na Grik.
