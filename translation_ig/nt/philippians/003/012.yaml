  to: Ọ bụghị na enwetalarị m ya[a], ma ọ bụ na e meworị m ka m zuo oke[b]; kama ana m achụso ya, ka m hụ ma m̀ ga-ejidekwa ihe ahụ Kraịst[c] jidere m maka ya.
  rationale: The revision changes only the clause representing διώκω and its relation to εἰ καί. “Ana m achụso ya” faithfully expresses ongoing pursuit and uses the implicit contextual object transparently; “ka m hụ ma” retains the contingent aim. The paired “ejidekwa/jidere” continues to reflect the Greek verbal wordplay, and “maka ya” leaves the debated ἐφ’ ᾧ relation appropriately open while favoring the contextual purpose/goal sense.
