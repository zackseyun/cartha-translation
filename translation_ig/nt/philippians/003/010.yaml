id: PHP.3.10
reference: Philippians 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦ γνῶναι αὐτὸν καὶ τὴν δύναμιν τῆς ἀναστάσεως αὐτοῦ καὶ ⸀κοινωνίαν παθημάτων αὐτοῦ, ⸀συμμορφιζόμενος τῷ θανάτῳ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/010.yaml
  text: to know him[a], and the power of his resurrection, and the fellowship of his sufferings, being conformed to his death[b],
translation:
  language: ig
  text: ka m wee mara ya[a], marakwa ike nke mbilite n'ọnwụ ya, na iketa oke n'ahụhụ ya, ebe a na-eme ka m yie ya n'ọnwụ ya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka m wee bịaruo n'ịmara ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ebe m na-aghọ onye yiri ya n'ọnwụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναι
  choice: ka m wee mara
  rationale: Na-egosi ebumnuche Pọl ma na-edobe echiche nke ịmata Kraịst n'ụzọ mmekọrịta na ahụmahụ, ọ bụghị naanị ịma ihe banyere ya.
- source_word: δύναμιν
  choice: ike
  rationale: “Ike” bụ okwu Igbo doro anya nke na-egosi ike dị irè e gosipụtara na mbilite n'ọnwụ ya.
- source_word: ἀναστάσεως
  choice: mbilite n'ọnwụ
  rationale: Nke a bụ ụzọ a na-ejikarị akọwa mbilite onye nwụrụ anwụ, ma dabara kpọmkwem n'ihe Pọl na-ekwu.
- source_word: κοινωνίαν
  choice: iketa oke na
  rationale: “Iketa oke na” na-egosi isonye n'ezie n'ahụhụ Kraịst, karịa naanị inwe mmetụta ọmịiko ma ọ bụ mmekọrịta na-enweghị isonye.
- source_word: παθημάτων
  choice: ahụhụ
  rationale: “Ahụhụ” na-enye nkọwa kpọmkwem ma dị mfe nghọta banyere ihe mgbu na mkpagbu Kraịst tara.
- source_word: συμμορφιζόμενος
  choice: ebe a na-eme ka m yie ya
  rationale: 'Na-edobe ọdịdị participle na-aga n''ihu nakwa ohere nke nghọta passive: a na-eme ka Pọl kwekọọ n''ụdị ọnwụ Kraịst.'
- source_word: τῷ θανάτῳ αὐτοῦ
  choice: n'ọnwụ ya
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma bụrụ ihe mmadụ na-asụ nke na-egosi na ọnwụ Kraịst bụ ụkpụrụ a na-eme ka Pọl yie.
theological_decisions:
- issue: Ihe κοινωνίαν παθημάτων αὐτοῦ pụtara
  choice: iketa oke n'ahụhụ ya
  alternative: mmekọrịta nke ahụhụ ya
  rationale: Nhọrọ a na-egosi isonye n'ezie n'usoro ahụhụ Kraịst, ma ọ naghị ebubata nkọwa ozizi pụrụ iche.
- issue: Olu nke συμμορφιζόμενος
  choice: ebe a na-eme ka m yie ya n'ọnwụ ya
  alternative: ebe m na-aghọ onye yiri ya n'ọnwụ ya
  rationale: Ụdị Greek nwere ike ibu echiche passive ma ọ bụ usoro mmadụ na-abanye na ya. Isi nsụgharị na-edobe echiche passive; ndetu ala na-echekwa ụzọ ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “iketa oke” zere ka κοινωνία bụrụ naanị mmekọrịta nkịtị, ebe “a na-eme ka m yie ya” na-echekwa usoro na-aga n'ihu na ụda passive nke participle Greek.
