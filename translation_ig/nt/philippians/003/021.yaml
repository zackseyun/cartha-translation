id: PHP.3.21
reference: Philippians 3:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς μετασχηματίσει τὸ σῶμα τῆς ταπεινώσεως ⸀ἡμῶν σύμμορφον τῷ σώματι τῆς δόξης αὐτοῦ κατὰ τὴν ἐνέργειαν τοῦ δύνασθαι αὐτὸν καὶ ὑποτάξαι ⸀αὑτῷ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/021.yaml
  text: who will transform our lowly body to be like the body of his glory[c][b][a], by the power that enables him even to subject all things to himself.
translation:
  language: ig
  text: onye ga-agbanwe ahụ anyị dị ala[a], mee ka ọ yie ahụ ya nke jupụtara n’ebube[b], site n’ike na-arụ ọrụ nke o ji enwe ike ọbụna ido ihe niile n’okpuru ya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ nkịtị: “ahụ nke mmechuihu anyị.”'
    reason: lexical_alternative
  - marker: b
    text: 'N''ụzọ nkịtị: “ahụ nke ebube ya.”'
    reason: lexical_alternative
  - marker: c
    text: 'Ma ọ bụ: “dị ka ọrụ ike nke o ji enwe ike ido ihe niile n’okpuru ya si dị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετασχηματίσει
  choice: ga-agbanwe
  rationale: Ọ na-egosi mgbanwe n'ezie n'ọdịdị ma ọ bụ n'ọnọdụ; “ga-agbanwe” bụ okwu Igbo doro anya ma na-echekwa ọdịnihu nke ngwaa ahụ.
- source_word: τὸ σῶμα τῆς ταπεινώσεως ἡμῶν
  choice: ahụ anyị dị ala
  rationale: Nke a na-ekwupụta ọnọdụ ahụ anyị ugbu a n'ụzọ Igbo nkịtị, ma ihe e dere n'ụzọ nkịtị, “ahụ nke mmechuihu anyị,” dị na nkọwa ala peeji.
- source_word: σύμμορφον
  choice: mee ka ọ yie
  rationale: Ọ na-egosi na a ga-eme ka ahụ anyị nwee ọdịdị kwekọrọ n'ahụ Kraịst; okwu a bụ nke mmadụ nkịtị ga-aghọta, na-enweghị ime ka myiri ahụ bụrụ naanị myiri na-adịghị omimi.
- source_word: τῷ σώματι τῆς δόξης αὐτοῦ
  choice: ahụ ya nke jupụtara n'ebube
  rationale: Nke a na-egosi ahụ e ji ebube mara ma na-echekwa njikọ genitive nke Grik n'ụzọ Igbo na-aga were were.
- source_word: κατὰ τὴν ἐνέργειαν
  choice: site n'ike
  rationale: ἐνέργεια bụ ike na-arụ ọrụ nke ọma; “site n'ike” na-ekwupụta ụzọ mgbanwe ahụ ga-esi mee, ebe nsụgharị nke na-esochi ọdịdị Grik nso dị na nkọwa ala peeji.
- source_word: τοῦ δύνασθαι αὐτὸν
  choice: nke o ji enwe ike
  rationale: Nke a na-ejikọta ike ahụ na ikike Kraịst n'onwe ya, na-enweghị ikwu na ike si n'aka onye ọzọ na-abịa nyere ya aka.
- source_word: ὑποτάξαι αὑτῷ τὰ πάντα
  choice: idobe ọbụna ihe niile n'okpuru onwe ya
  rationale: Ọ na-echekwa echiche nke iweta ihe niile n'okpuru ọchịchị ya, obosara nke “ihe niile,” na ntụaka reflexive “onwe ya.”
theological_decisions:
- issue: Mmekọrịta dị n'etiti ịdị ala nke ahụ ugbu a na ebube nke ahụ n'ọdịnihu
  choice: E gosipụtara mgbanwe ga-eme n'ọdịnihu, nke ga-eme ka ahụ ndị kwere ekwe dị ala yie ahụ Kraịst nke jupụtara n'ebube.
  alternative: A pụrụ itinye okwu “mbilite n'ọnwụ” n'ahịrịokwu ahụ iji kọwaa usoro mgbanwe ahụ.
  rationale: Amaokwu Grik na-ekwu hoo haa maka mgbanwe nke ahụ na ime ka ọ kwekọọ n'ahụ Kraịst, ma ọ naghị akọwa usoro mbilite n'ọnwụ ebe a; ya mere, a naghị etinye nkọwa ozizi ọzọ n'ime ederede.
- issue: Isi iyi na ụdị ike Kraịst
  choice: “nke o ji enwe ike” na-egosi ike na-arụ ọrụ nke Kraịst ji edo ihe niile n'okpuru onwe ya.
  alternative: “ike nke na-eme ka o nwee ike” nwere ike ịdị ka à ga-asị na onye ọzọ na-enye Kraịst ikike ahụ.
  rationale: Nhazi Grik na-elekwasị anya n'ọrụ ike kwekọrọ n'ikike ya; nsụgharị a na-echekwa nke ahụ n'enweghị ịkọwa isi iyi nke ike ahụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “ahụ anyị dị ala” na “ahụ ya nke jupụtara n'ebube” ka okwu genitive nke Grik nwee nghọta n'Igbo, ebe e debere ụdị nsụgharị ndị na-esochi okwu Grik nso na nkọwa ala peeji. “Idobe ... n'okpuru onwe ya” na-echekwa ma ọchịchị ma ntụaka nye Kraịst n'onwe ya.
