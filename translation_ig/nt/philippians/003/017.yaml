    issue: E tinyere “m” n’ime “Ụmụnna m.”
    rationale: Okwu Grik ἀδελφοί n’amaokwu a enweghị μου (“m/my”). Itinye ya na-agbakwunye ihe na-adịghị na ederede isi.
  - severity: medium
    issue: “Jikọnụ aka na-eṅomi m” adịghị akọwapụta nke ọma iwu Συμμιμηταί ... γίνεσθε.
    rationale: “Jikọnụ aka” na-adịkarị ka imekọ ọrụ; “soronu m n’ịṅomi” na-egosi nke ọma na ndị a kpọrọ ka ha sonye ọnụ n’ịṅomi Pọl.
  - severity: low
    issue: “Ndị na-eje ije otu a” nwere ike ịghọta dịka ije anụ ahụ.
    rationale: περιπατοῦντας bụ ihe atụ Pọl ji akọwa ibi ndụ. “Ndị na-ebi ndụ n’ụzọ dị otu a” bụ ụzọ Igbo doro anya, nke na-echekwa echiche ahụ.
  - severity: low
    issue: Nkọwa ala peeji a kwuru “ụdị oke ọtụtụ.”
    rationale: Nke kwesịrị ịbụ “ụdị ọtụtụ nwoke,” n’ihi na nke a bụ ihe nkọwa mkpụrụasụsụ Grik chọrọ.
