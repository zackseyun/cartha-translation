  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Συμμιμηταί μου γίνεσθε, ἀδελφοί, καὶ σκοπεῖτε τοὺς οὕτω περιπατοῦντας καθὼς ἔχετε τύπον ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/017.yaml
  text: Brothers[a], join in imitating me, and keep your eyes on those who walk this way[b], just as you have us as a pattern.
translation:
  language: ig
  text: Ụmụnna[a], soronu m n’ịṅomi m, leruokwanụ ndị na-ebi ndụ n’ụzọ dị otu a anya, dị ka anyị bụụrụ unu ihe nlereanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ụmụnna, ndị nwoke na ndị nwanyị.” Okwu Grik ahụ dị n’ụdị ọtụtụ nwoke, ma o yikarịrị ka ọ na-agwa ọgbakọ niile okwu.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ụkpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συμμιμηταί μου γίνεσθε
  choice: jikọnụ aka na-eṅomi m
  rationale: Nke a na-egosipụta iwu ahụ n’asụsụ Igbo dị mfe ma na-echekwa echiche dị na Συμμιμηταί nke bụ́ na ha niile ga-esoro ibe ha na-eṅomi Pọl, ọ bụghị naanị ka onye ọ bụla mee ya naanị ya.
- source_word: ἀδελφοί
  choice: Ụmụnna m
  rationale: “Ụmụnna” bụ okwu nkwanye ùgwù Pọl ji akpọ ndị kwere ekwe; ọ na-edobe ọdịdị okwu Grik nke dị n’ụdị oke, ebe nkọwa ala peeji na-egosi na o yikarịrị ka ọ na-agwa ọgbakọ niile okwu.
- source_word: σκοπεῖτε
  choice: lekwasịkwanụ ... anya
  rationale: Nhọrọ a na-egosi ilebara mmadụ anya nke ọma na nke na-aga n’ihu, dịka ngwaa Grik si pụta.
- source_word: οὕτω περιπατοῦντας
  choice: ndị na-eje ije otu a
  rationale: “Na-eje ije” na-echekwa ihe atụ Pọl ji ekwu banyere ụzọ mmadụ si ebi ndụ, ebe “otu a” na-anọchi οὕτω nke ọma.
- source_word: τύπον
  choice: ihe nlereanya
  rationale: N’ebe a, τύπος pụtara ihe atụ ma ọ bụ ụkpụrụ e kwesịrị ịgbaso. “Ihe nlereanya” bụ okwu Igbo doro anya ma kwekọọ n’echiche ahụ.
- source_word: ἡμᾶς
  choice: anyị
  rationale: E debere nnọchiaha ọtụtụ nke Grik; a tụgharịghị ya ka ọ bụrụ naanị Pọl, n’ihi na o nwere ike ịgụnye ndị ya na ha na-eje ozi.
theological_decisions:
- issue: Ndị ἀδελφοί na-ezo aka na ha
  choice: E ji “Ụmụnna m” mee ihe n’ahịrịokwu, e mesịakwa kọwaa n’ala peeji na o yikarịrị ka ọ na-agụnye ndị nwoke na ndị nwanyị nọ n’ọgbakọ.
  alternative: Ịsụgharị ya ozugbo dịka “ụmụnna m ndị nwoke na ndị nwanyị.”
  rationale: Ụdị okwu Grik bụ oke ọtụtụ, ma n’ọnọdụ a Pọl nwere ike na-agwa ọgbakọ niile okwu. Nhọrọ a na-echekwa ma ọdịdị okwu mbụ ahụ ma obosara ndị ọ na-ezo aka na ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Jikọnụ aka” na-eme ka echiche ime ihe ọnụ pụta ìhè; “na-eje ije” na-echekwa ihe atụ dị n’asụsụ mbụ.
