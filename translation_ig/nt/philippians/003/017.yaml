  rationale: E wepụrụ “m” nke na-adịghị n’ederede Grik mgbe ἀδελφοί. E dochiri okwu banyere isonye n’ịṅomi na nke na-adịghị enwe mgbagwoju anya n’Igbo, ma deziekwa okwu περιπατέω ka ọ na-ekwu maka ibi ndụ, ọ bụghị naanị ije. A hapụrụ ọtụtụ “anyị” na “ihe nlereanya,” tinyere anka na nkọwa ala peeji abụọ ahụ.
