review_pass:
  verdict: revise
  source_fidelity: A chọrọ ndozi n’ihi na ederede ahụ gbakwụnyere “m” na ἀδελφοί, ebe SBLGNT nwere naanị “ụmụnna/brothers.” Ọzọkwa, “jikọnụ aka na-eṅomi m” nwere ike ịpụta imekọ ọrụ n’ozuzu karịa isonye n’ịṅomi; e degharịrị ya iji gosi iwu mkpokọta ahụ nke ọma. A debere “anyị” n’akụkụ τύπον, dị ka ọtụtụ nnọchiaha Grik si dị.
  naturalness: “Ndị na-eje ije otu a” nwere ike ịkpọpụta ije anụ ahụ n’Igbo nke oge a. “Ndị na-ebi ndụ n’ụzọ dị otu a” na-ewepụta ihe atụ Pọl banyere omume ndụ n’ụzọ doro anya ma bụrụ Igbo nkịtị. E mekwara ahịrị ikpeazụ ka ọ bụrụ nke na-aga nke ọma n’Igbo.
  terminology: “Ihe nlereanya” dabara τύπον nke ọma n’ebe a. “Ụmụnna” na-edobe mkpọku nkwanye ùgwù ahụ; nkọwa ala peeji na-akọwa na ụdị ọtụtụ nwoke nke Grik nwere ike ịgụnye ọgbakọ dum. E meziekwara nkọwa ahụ ka ọ ghara ịkpọ ụdị nwoke ọtụtụ “ụdị oke ọtụtụ.”
  issues:
