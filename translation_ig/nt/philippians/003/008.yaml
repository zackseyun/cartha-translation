id: PHP.3.8
reference: Philippians 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀μενοῦνγε καὶ ἡγοῦμαι πάντα ζημίαν εἶναι διὰ τὸ ὑπερέχον τῆς γνώσεως Χριστοῦ Ἰησοῦ τοῦ κυρίου μου δι’ ὃν τὰ πάντα ἐζημιώθην, καὶ ἡγοῦμαι ⸀σκύβαλα ἵνα Χριστὸν κερδήσω
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/008.yaml
  text: More than that[a], I consider all things to be loss because of the surpassing value of the knowledge of Messiah Jesus my Lord, for whose sake I have suffered the loss of all things and consider them rubbish[c][b], so that I may gain Messiah.
translation:
  language: ig
  text: Ee, karịa nke ahụ, ana m agụ ihe niile dịka mfu n’ihi uru pụrụ iche nke ịmata Kraịst Jizọs, Onyenwe m; n’ihi ya ka m tara mfu nke ihe niile, ana m agụkwa ha dịka ihe mkpofu[a], ka m wee nweta Kraịst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a siri ike; ọ pụkwara ịpụta “ihe a jụrụ ajụ,” “unyi,” ma ọ bụ “nsị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ μενοῦνγε καὶ
  choice: Karịa nke ahụ
  rationale: Nkebiokwu a na-eme ka okwu ahụ sie ike ma na-ebuga echiche ahụ n’ihu; nsụgharị a bụ Igbo nkịtị ma na-egosi na ihe a karịrị ihe e kwuru tupu ya.
- source_word: ἡγοῦμαι
  choice: ana m ewere
  rationale: Ngwaa ahụ na-egosi ịtụle ma kpebie uru ihe bara; ‘ana m ewere’ na-arụ ọrụ nke ọma n’ebe abụọ ọ pụtara.
- source_word: πάντα / τὰ πάντα
  choice: ihe niile
  rationale: Nke a na-echekwa obosara okwu Grik ahụ n’Igbo doro anya.
- source_word: ζημίαν
  choice: mfu
  rationale: ‘Mfu’ na-echekwa ihe atụ nke uru na ọghọm nke Pọl ji arụ okwu.
- source_word: διὰ τὸ ὑπερέχον τῆς γνώσεως
  choice: n’ihi ịdị oke ọnụ ahịa nke ịmata
  rationale: Nke a na-egosipụta ịdị elu pụrụ iche nke γνώσις ma na-enye ya n’Igbo dị ndụ dị ka mmekọrịta nke ịmata mmadụ, na-enweghị iwepụ usoro echiche Grik ahụ.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Kraịst Jizọs
  rationale: ‘Kraịst’ bụ okwu a maara nke ọma n’Igbo maka Χριστός ma ka nwekwara ike ịrụ ọrụ dịka aha-ọrụ nke Onye E Tere Mmanụ.
- source_word: τοῦ κυρίου μου
  choice: Onyenwe m
  rationale: Nke a na-echekwa ihe onye nwe na ịdị arọ nke κύριος n’okwu gbasara Kraịst.
- source_word: δι’ ὃν
  choice: Ọ bụkwa n’ihi ya
  rationale: Nke a na-egosi na ọ bụ n’ihi Kraịst ka mfu ahụ ji bịa, ma na-anọgide n’ụdị Igbo sitere n’okike.
- source_word: ἐζημιώθην
  choice: ka m tufuru
  rationale: Nke a na-egosi mfu e nwetara n’ezie; gburugburu okwu ahụ na-eme ka ihe kpatara ya doo anya, ọbụna ma Igbo anaghị egosipụta passive n’ụzọ siri ike dịka Grik.
- source_word: σκύβαλα
  choice: ihe mkpofu
  rationale: Okwu a na-egosi ihe a jụrụ ajụ ma tụfuo; ndetu ala na-echekwa ike na obosara okwu Grik ahụ.
- source_word: ἵνα Χριστὸν κερδήσω
  choice: ka m wee rite Kraịst
  rationale: ‘Ka m wee’ na-egosi nzube, ‘rite’ na-aga n’ihu n’ihe atụ nke mfu na uru.
theological_decisions:
- issue: Nsụgharị Χριστός n’okwu Pọl
  choice: Kraịst
  alternative: Mesaịa / Onye E Tere Mmanụ
  rationale: ‘Kraịst’ bụ ụdị Igbo a nabatara nke ukwuu, ma ebe a okwu ahụ ka na-ezo aka n’aha-ọrụ ahụ, ọ bụghị naanị aha mmadụ. A naghị etinye nkọwa otu ụka pụrụ iche n’ime amaokwu ahụ.
- issue: Ụdị γνώσεως
  choice: ịmata Kraịst Jizọs
  alternative: ihe ọmụma banyere Kraịst Jizọs
  rationale: ‘Ịmata’ na-echekwa ohere nke nghọta mmekọrịta onwe onye, ebe ‘ihe ọmụma banyere’ nwere ike ime ka ọ bụrụ naanị ozi mmadụ maara. Grik ahụ n’onwe ya nwere ike ibu echiche sara mbara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ mfu na uru ka ọ dị, ma zere okwu ụka pụrụ iche. Akara ndetu ala [a] dị n’isiokwu ahụ kpọmkwem n’ebe okwu σκύβαλα pụtara.
