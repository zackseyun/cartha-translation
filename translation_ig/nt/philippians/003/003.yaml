reference: Philippians 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμεῖς γάρ ἐσμεν ἡ περιτομή, οἱ πνεύματι θεοῦ λατρεύοντες καὶ καυχώμενοι ἐν Χριστῷ Ἰησοῦ καὶ οὐκ ἐν σαρκὶ πεποιθότες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/003/003.yaml
  text: For we are the circumcision[a], who worship by the Spirit of God and boast in Messiah Jesus and put no confidence in the flesh[c][b],
translation:
  language: ig
  text: N’ihi na anyị bụ ndị e biri úgwù, bụ ndị ji Mmụọ Chineke na-efe ofufe, na-anya isi n’ime Mesaịa Jizọs, ndị na-adịghị atụkwasịkwa anụ ahụ[c] obi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere ọgụgụ nke nwere ike ịpụta, “ndị ji mmụọ efe Chineke ofufe.”
    reason: textual_variant
  - marker: b
    text: “Mesaịa” na-atụgharị okwu Grik ahụ, Christos.
    reason: lexical_alternative
  - marker: c
    text: “Anụ ahụ” n’ebe a na-ezo n’ihe gbasara ahụ mmadụ ma ọ bụ ọnọdụ mmadụ a pụrụ iji tụkwasị onwe onye obi, dịka ibi úgwù, agbụrụ, ma ọ bụ ọkwa.
    reason: cultural_note
lexical_decisions:
- source_word: περιτομή
  choice: ndị e biri úgwù
  rationale: Na-edobe okwu ọgbụgba ndụ ahụ n’ụdị doro anya, ma na-eme ka okwu Pọl banyere ndị bụ ezi ndị ibi úgwù pụta ìhè n’Igbo nkịtị.
- source_word: πνεύματι θεοῦ
  choice: ji Mmụọ Chineke
  rationale: “Ji” na-egosi na Mmụọ Chineke bụ onye na-enye ike ma ọ bụ ụzọ e si efe ofufe, dịka ọgụgụ SBLGNT θεοῦ si kwado.
- source_word: λατρεύοντες
  choice: efe ofufe
  rationale: Nke a bụ okwu Igbo dị mma maka ijere Chineke ozi n’ofufe, ma na-edobe echiche nke ọrụ nsọ.
- source_word: καυχώμενοι
  choice: na-anya isi
  rationale: 'Ọ na-edobe ntụnyere Pọl: ihe ndị kwere ekwe ji anya isi bụ Mesaịa Jizọs, ọ bụghị ihe mmadụ nwere n’anụ ahụ.'
- source_word: Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: “Mesaịa” na-egosipụta Χριστός dịka utu aha, ebe “n’ime” na-edobe njikọ ἐν na ọnọdụ njikọ ha na ya.
- source_word: σαρκί
  choice: anụ ahụ
  rationale: Na-edobe ihe oyiyi nkịtị na nke ihe atụ ọnụ; n’ebe a ọ gụnyere ibi úgwù na ihe mmadụ nwere ike iji tụkwasị onwe ya obi.
- source_word: πεποιθότες
  choice: ndị na-adịghịkwa atụkwasị ... obi
  rationale: Na-egosi ntụkwasị obi siri ike ma guzosie ike, nke a na-ajụ kpamkpam n’ihe metụtara anụ ahụ.
- source_word: γάρ
  choice: N’ihi na
  rationale: Na-ejikọta amaokwu a na ịdọ aka ná ntị dị n’amaokwu bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ya.
theological_decisions:
- issue: Ihe σάρξ pụtara n’amaokwu a
  choice: “Anụ ahụ” na-ezo isi n’ihe gbasara ahụ mmadụ na ọnọdụ mmadụ nke a pụrụ iji tụkwasị onwe onye obi, dịka ibi úgwù na ọkwa mmadụ.
  alternative: Ọdịdị mmehie dị n’ime mmadụ.
  rationale: Ihe Pọl depụtara ozugbo n’amaokwu ndị so ya—ibi úgwù, agbụrụ, iwu, na ọkwa—na-akwado nghọta nke ihe mmadụ nwere n’anụ ahụ karịa naanị ụkpụrụ mmehie dị n’ime.
- issue: Ike πνεύματι θεοῦ
  choice: Mmụọ Chineke bụ onye e ji ma ọ bụ onye na-enye ike ife ofufe.
  alternative: Mmụọ mmadụ, ma ọ bụ ife Chineke ofufe n’ụzọ ime mmụọ.
  rationale: Ọgụgụ θεοῦ nke SBLGNT na-atụ aka n’ụzọ kacha kwe omume n’ebe Mmụọ Chineke nọ, ma na-edobe ọdịiche dị n’etiti ọrụ Mmụọ na ihe mpụga nke anụ ahụ.
- issue: “Anyị bụ ndị e biri úgwù”
  choice: E debere okwu ahụ dịka njirimara ọgbụgba ndụ e ji ihe atụ kọwaa ndị kwere ekwe.
  alternative: Ịkọwapụta ya dịka “anyị bụ ezi ndị Chineke” ma ọ bụ “anyị bụ ndị e biri úgwù n’ezie.”
  rationale: Ịghara ịgbasa ya n’ime nkọwa na-edobe ike, nghọtahie a kpachapụrụ anya, na esemokwu dị n’okwu Pọl.
translation_notes:
  register: Igbo Ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. E ji “úgwù” mee ka ọdịiche ụda olu dị n’etiti úgwù (circumcision) na ùgwù (honor) doo anya. Akara nkọwa ala peeji niile dị n’ahịrị isi.
