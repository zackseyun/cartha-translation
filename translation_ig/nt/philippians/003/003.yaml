- from: N’ihi na ọ bụ anyị bụ ndị e biri úgwù, anyị ndị ji Mmụọ Chineke efe ofufe, na-anya isi n’ime Mesaịa Jizọs, ndị na-adịghịkwa atụkwasị anụ ahụ[c] obi.[a][b]
