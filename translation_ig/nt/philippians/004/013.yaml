  text: I am able to do all things through the one who strengthens me[a][b].
translation:
  language: ig
  text: Enwere m ike ime ihe niile site n'aka onye na-enye m ike[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Enwere m ike n'ihe niile.” N'amaokwu ndị gbara ya gburugburu, ihe ọ pụtara bụ na o nwere ike ịnagide ọnọdụ niile dị iche iche.
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ Grik, e kwuru, “onye na-enye m ike”; a kpọghị Kraịst aha kpọmkwem n'amaokwu a, ọ bụ ezie na ihe ndị gbara ya gburugburu na-atụ aro na ọ bụ ya ka okwu ahụ na-ezo aka.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: ihe niile
  rationale: Okwu a pụtara n'ụzọ sara mbara ‘ihe niile.’ Ihe ndị Pọl kwuru n’amaokwu ndị gbara ya gburugburu na-egosi na ọ na-ekwu maka ọnọdụ dị iche iche ọ na-agafe, ma nsụgharị a na-edobe obosara okwu Grik ahụ.
- source_word: ἰσχύω
  choice: Enwere m ike ime
  rationale: Ngwaa a na-egosi inwe ike ma ọ bụ ịdị ike ime ihe. ‘Enwere m ike ime’ bụ Igbo doro anya ma dịkwa mma n’ọnọdụ a, n’enweghị ikwubiga ihe amaokwu ahụ ókè.
- source_word: ἐν
  choice: site n’aka
  rationale: Ọ bụ ezie na isi ihe ἐν pụtara bụ ‘n’ime,’ mgbe o so onye na-eme ka ihe kwe omume dị ka ebe a, ‘site n’aka’ na-egosi ụzọ ma ọ bụ onye e ji nweta ike ahụ n’Igbo eke.
- source_word: τῷ ἐνδυναμοῦντί με
  choice: onye ahụ na-enye m ike
  rationale: 'Participụl nwere artikụl a na-arụ ọrụ dị ka aha: ‘onye ahụ na-enye m ike.’ Nhọrọ a na-edobe omume na-aga n’ihu ma ghara ịtinye aha Kraịst, nke na-adịghị n’ederede Grik nke amaokwu a.'
theological_decisions:
- issue: Onye ‘onye ahụ na-enye m ike’ na-ezo aka na ya
  choice: E debere okwu ahụ dịka ‘onye ahụ na-enye m ike,’ n’etinyeghị ‘Kraịst’ n’isi amaokwu.
  alternative: ‘site n’aka Kraịst onye na-enye m ike’
  rationale: Ihe ndị gbara amaokwu a gburugburu na-egosi nke ọma na onye ahụ bụ Kraịst Jizọs, ma amaokwu Grik a n’onwe ya akpọghị ya aha. Ya mere, nsụgharị ahụ na-edobe ihe e kwuru kpọmkwem ma kọwaa ihe a na-aghọta site n’ọnọdụ ya n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, dee amaokwu ahụ. ‘Site n’aka’ bụ ụzọ Igbo si egosi onye e si n’aka ya nweta ike; ‘onye ahụ’ na-enyere ahịrịokwu ahụ aka ịgụ nke ọma ma na-edobe articular substantive nke Grik. Akara nkọwa [a] na [b] dị n’isi amaokwu ahụ.
