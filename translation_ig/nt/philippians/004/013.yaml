  source_fidelity: 'The main sense is accurately conveyed: πάντα ἰσχύω expresses comprehensive capability, and the participial phrase is properly left unnamed rather than adding Christ. “Site n''aka” is an idiomatic Igbo rendering of the instrumental/personal force of ἐν here. However, “onye ahụ” adds a demonstrative nuance (‘that person’) not required by the Greek articular participle and is less natural than the substantive relative phrase without ahụ.'
