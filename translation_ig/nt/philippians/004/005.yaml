lexical_decisions:
- source_word: ἐπιεικές
  choice: na-emeso ndị ọzọ ihe n’obiọma
  rationale: Nke a na-egosi àgwà nke imeso ndị ọzọ ihe n’ụzọ dị nro, nke nwere nchebara echiche na nke na-adịghị esi ọnwụ n’ihe mmadụ ruuru ya. Ọ sara mbara karịa naanị “ịdị nwayọọ,” ma bụrụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: γνωσθήτω
  choice: Ka mmadụ niile mara
  rationale: Usoro a na-egosipụta iwu dị na γνωσθήτω n’Igbo nkịtị, na-eme ka o doo anya na àgwà ahụ kwesịrị ịpụta ìhè ruo ndị ọzọ amata ya.
- source_word: πᾶσιν ἀνθρώποις
  choice: mmadụ niile
  rationale: Ọ na-ezo aka n’ebe mmadụ niile nọ n’enweghị ịkpa oke nwoke na nwanyị.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị eme ihe n’Igbo maka κύριος, ọ na-echekwakwa ịdị arọ nke aha ahụ n’ihe gbasara okwukwe.
- source_word: ἐγγύς
  choice: dị nso
  rationale: “Dị nso” na-anọgideghị kpọmkwem n’otu nkọwa naanị; ọ pụrụ ịpụta na Onyenwe anyị nọ mmadụ nso ma ọ bụ na ọbịbịa ya adịla nso.
theological_decisions:
- issue: Ihe ὁ κύριος ἐγγύς pụtara
  choice: Onyenwe anyị dị nso
  alternative: Onyenwe anyị nọ anyị nso; ma ọ bụ, ọbịbịa Onyenwe anyị dị nso
  rationale: Asụsụ Grik nwere ike igosi ịdị nso ya ugbu a, ịdị nso nke ọbịbịa ya, ma ọ bụ ha abụọ. Isi amaokwu ahụ anaghị ekpebi naanị otu n’ime ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A kọwara ἐπιεικές dịka omume mmadụ n’ebe ndị ọzọ nọ ka obosara echiche okwu Grik ahụ ghara ịbelata ruo nanị àgwà ịdị nwayọọ.
