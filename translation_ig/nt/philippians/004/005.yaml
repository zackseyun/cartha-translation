  verdict: revise
  source_fidelity: A chọrọ mgbanwe dị nta. «Ka mmadụ niile mara na unu na-emeso ndị ọzọ ihe n’obiọma» na-ekwupụta omume e mere ndị ọzọ karịa àgwà «τὸ ἐπιεικὲς ὑμῶν» nke Pọl kwuru ka a mata. Ọzọkwa, «obiọma» na-adabara n’ụfọdụ ọnọdụ, mana o nwere ike ịpụta ebere ma ọ bụ imesapụ aka karịa nwayọọ, ịtụrụ ndị ọzọ n’obi, na ezi uche dị n’okwu Grik ahụ. «Onyenwe anyị dị nso» na-echekwa amụma okwu ἐγγύς nke nwere ike ịpụta ịdị nso ugbu a ma ọ bụ ịdị nso ọbịbịa ya.
  naturalness: «Ka mmadụ niile mata ịdị nwayọọ unu» dị mkpirikpi, dị n’usoro Igbo Izugbe, ma na-egosipụta nke ọma ka àgwà unu pụta ìhè ma mmadụ niile mata ya. «Ndidi n’ebe ndị ọzọ nọ» ka «nnagide» dabara nke ọma dịka nhọrọ ọzọ maka forbearance n’amaokwu a.
  terminology: «Onyenwe anyị» dabara maka κύριος n’ebe a. «Ịdị nwayọọ» bụ ntụgharị isi a pụrụ ịdabere na ya maka ἐπιεικές; ihe odide ala peeji na-echekwa nhọrọ ndị ọzọ—obiọma, ndidi, na ịdị ezi uche—ka a ghara ime ka okwu Grik ahụ bụrụ naanị otu nghọta.
  issues:
