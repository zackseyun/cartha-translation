    issue: The alternative-reading footnote gives only “dịnyere unu niile,” rather than the full alternative wording.
    rationale: The relevant variant is best presented as the complete blessing, so readers can see that “with all of you” stands in place of “with your spirit.” This also makes the footnote independently intelligible and accurately anchored to the disputed phrase.
