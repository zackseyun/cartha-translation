  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ ⸂τοῦ πνεύματος⸃ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/023.yaml
  text: The grace of the Lord Jesus Christ be with your spirit[a].
translation:
  language: ig
  text: Ka amara nke Onyenwe anyị Jizọs Mezaịa dịnyere mmụọ unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide ochie nwere: “Ka amara nke Onyenwe anyị Jizọs Mezaịa dịnyere unu niile.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις n’ọgụgụ isi Pọl; ọ na-echekwa echiche nke ihu ọma Chineke a na-enye n’efu na ịdị mma ya.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nsọpụrụ kwekọrọ n’ọrụ κύριος dị ka utu aha nke Jizọs n’ebe a, ma bụrụkwa okwu doro ndị na-agụ Igbo anya.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Mezaịa
  rationale: “Jizọs” na-anọchi aha ahụ, ebe “Mezaịa” na-egosipụta Χριστός dị ka utu aha, ya bụ, Onye Chineke tere mmanụ, kama ime ka ọ bụrụ naanị akụkụ nke aha mmadụ.
- source_word: μετὰ
  choice: dịnyere
  rationale: N’ọdịdị ngọzi a, “dịnyere” na-egosipụta ịnọnyere ma ọ bụ iso mmadụ n'ụzọ na-ada nke ọma n’Igbo.
- source_word: πνεύματος
  choice: mmụọ
  rationale: N’ebe a, okwu ahụ na-ezo aka na mmụọ ma ọ bụ ndụ ime nke ndị a na-agwa okwu, ọ bụghị n’ụzọ doro anya na Mmụọ Nsọ.
- source_word: ὑμῶν
  choice: unu
  rationale: “Unu” na-eme ka ọtụtụ mmadụ dị na nnọchiaha Grik ahụ pụta ìhè n’Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστοῦ dị ka “Mezaịa” ka ọ bụ “Kraịst”
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’agbanyeghị na njikọ “Jizọs Kraịst” aghọwo ihe yiri aha zuru ezu n’ọtụtụ ebe, Χριστός ka nwere ike utu aha n’usoro ngọzi a. “Mezaịa” na-echekwa ọrụ utu aha ahụ n’enweghị itinye nkọwa nke otu chọọchị.
- issue: Onye πνεύματος na-ezo aka na ya
  choice: mmụọ mmadụ/ndụ ime nke ndị kwere ekwe
  alternative: Mmụọ Nsọ
  rationale: Nnọchiaha “unu” jikọrọ ya na ndị Filipaị, ma enweghị ihe na-akọwapụta kpọmkwem na ọ bụ Mmụọ Nsọ. Ya mere e dere “mmụọ” n’enweghị mkpụrụedemede ukwu.
- issue: Otu e si ghọta otu “mmụọ” na ọtụtụ “unu”
  choice: Mmụọ dị ka ndụ ime ha nke e lere anya n’otu
  alternative: Mmụọ nke onye ọ bụla n’ime ha
  rationale: E chekwara otu ọnụọgụ dị na Grik, tinyere ọtụtụ ndị e ji “unu” kpọọ, ka nghọta mkpokọta na nghọta nke onye ọ bụla nọgide bụrụ ihe ga-ekwe omume.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị nsọpụrụ ma dị mfe nghọta. E ji usoro ngọzi “Ka … dịnyere …” mee ka ahịrịokwu na-enweghị ngwaa kpọmkwem na Grik bụrụ ekpere-ngọzi eke n’Igbo. Akara ntụaka [a] dị n’ahịrịokwu isi.
