id: PHP.4.8
reference: Philippians 4:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὸ λοιπόν, ἀδελφοί, ὅσα ἐστὶν ἀληθῆ, ὅσα σεμνά, ὅσα δίκαια, ὅσα ἁγνά, ὅσα προσφιλῆ, ὅσα εὔφημα, εἴ τις ἀρετὴ καὶ εἴ τις ἔπαινος, ταῦτα λογίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/008.yaml
  text: Finally[a], brothers, whatever is true, whatever is honorable, whatever is just, whatever is pure, whatever is lovely, whatever is commendable—if there is any virtue and if there is any praise—think about these things.
translation:
  language: ig
  text: N'ikpeazụ, ụmụnna[a], ihe ọ bụla bụ eziokwu, ihe ọ bụla kwesịrị nsọpụrụ, ihe ọ bụla ziri ezi, ihe ọ bụla dị ọcha, ihe ọ bụla na-akpali ịhụnanya, ihe ọ bụla a na-ekwu okwu ọma banyere ya—ọ bụrụ na e nwere ezi omume ọ bụla, ọ bụrụkwa na e nwere otuto ọ bụla—chebaranụ ihe ndị a echiche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụmụnna ndị nwoke na ndị nwaanyị.” Okwu Grik a sụgharịrị “ụmụnna” nwere ike ịgụnye ndị nwoke na ndị nwaanyị niile nọ n'ọgbakọ ndị kwere ekwe.
    reason: cultural_note
lexical_decisions:
- source_word: Τὸ λοιπόν
  choice: N'ikpeazụ
  rationale: Ọ bụ akara okwu na-ebute ndụmọdụ mmechi; nsụgharị a bụ nke e ji eme ihe n'Igbo ma na-echekwa ọrụ mgbanwe ya.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” na-echekwa ụdị okwu ezinụlọ Pọl ji kpọọ ndị kwere ekwe; nkọwa ala peeji na-egosi na okwu Grik ahụ nwere ike ịgụnye ndị nwoke na ndị nwaanyị.
- source_word: ὅσα
  choice: ihe ọ bụla
  rationale: Ntughari a na-echekwa ugboro ugboro na ọdịdị nkesa nke ndepụta Grik ahụ n'Igbo doro anya.
- source_word: ἀληθῆ
  choice: bụ eziokwu
  rationale: Nke a na-egosipụta echiche sara mbara nke ihe bụ eziokwu, ọ bụghị naanị okwu mmadụ na-ekwu n'eziokwu.
- source_word: σεμνά
  choice: kwesịrị nsọpụrụ
  rationale: Ọ na-egosi ihe nwere ịdị arọ n'omume ma kwesịkwa ka a kwanyere ya ùgwù.
- source_word: δίκαια
  choice: ziri ezi
  rationale: Ọ bụ okwu Igbo dị mfe ma sara mbara maka ihe kwụ ọtọ, nke ikpe ziri ezi dịkwa na ya.
- source_word: ἁγνά
  choice: dị ọcha
  rationale: Ọ na-echekwa ma ịdị ọcha n'omume ma ịdị ọcha nke ime obi, na-enweghị ime ka ọ bụrụ naanị okwu gbasara mmekọahụ.
- source_word: προσφιλῆ
  choice: na-akpali ịhụnanya
  rationale: Ọ na-egosipụta ihe na-akpọlite ịhụnanya ma ọ bụ mmasị, nke bụ isi echiche okwu Grik a.
- source_word: εὔφημα
  choice: a na-ekwu okwu ọma banyere ya
  rationale: Okwu a na-egosi ihe a na-anụ aha ọma banyere ya ma ọ bụ ihe mmadụ na-ekwu maka ya n'ụzọ dị mma; ọ na-ekewapụkwa ya n'ἔπαινος nke sochirinụ.
- source_word: εἴ τις ἀρετὴ
  choice: ọ bụrụ na e nwere ezi omume ọ bụla
  rationale: “Ezi omume” na-ebuga echiche nke ịdị mma ma ọ bụ omume ọma, ma na-echekwa usoro ọnọdụ dị na Grik.
- source_word: ἔπαινος
  choice: ihe ọ bụla kwesịrị otuto
  rationale: Nke a na-ebuga echiche nke ihe na-akpata otuto ma na-arụ ọrụ dị ka aha n'usoro ahịrịokwu Igbo.
- source_word: ταῦτα λογίζεσθε
  choice: na-echebara ihe ndị a echiche
  rationale: Ọ na-egosi iwu ka ha nọgide na-etinye uche ha n'ihe ndị a ma tụlee ha nke ọma, ọ bụghị nanị icheta ha otu mgbe.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-ezo naanị aka n'ụmụ nwoke ka ọ bụ n'ọgbakọ niile
  choice: E debere “ụmụnna” n'ahịrịokwu bụ isi ma kọwaa oke ya na nkọwa ala peeji.
  alternative: “Ụmụnna ndị nwoke na ndị nwaanyị” n'ahịrịokwu bụ isi.
  rationale: Ụdị Grik bụ aha ọtụtụ nke nwoke, ma n'okwu Pọl ọ na-abụkarị ụzọ ịkpọ ndị kwere ekwe niile. Nhọrọ a na-echekwa ọdịdị okwu mbụ ma ghara izochi na ọ pụrụ ịgụnye nwoke na nwaanyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere usoro ndepụta ugboro ugboro nke amaokwu Grik ahụ, ma zere okwu ụka pụrụ iche nke otu denominashion.
