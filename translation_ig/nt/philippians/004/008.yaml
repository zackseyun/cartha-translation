    text: A pụkwara ịsụgharị ya “ụmụnna ndị nwoke na ndị nwaanyị.” Okwu Grik a sụgharịrị “ụmụnna” nwere ike ịgụnye ndị nwoke na ndị nwaanyị niile nọ n'ọgbakọ ndị kwere ekwe.
    reason: cultural_note
  revision_rationale: The revision makes the final command explicitly imperative and restores the noun-based parallelism of “virtue” and “praise.” It otherwise preserves the draft’s faithful, natural rendering and its footnote anchor.
