id: PHP.4.2
reference: Philippians 4:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εὐοδίαν παρακαλῶ καὶ Συντύχην παρακαλῶ τὸ αὐτὸ φρονεῖν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/002.yaml
  text: I urge Euodia[a], and I urge Syntyche, to think the same way in the Lord.
translation:
  language: ig
  text: Ana m arịọ Yụodia, ana m arịọkwa Sintike, ka ha nwee otu uche[a] n’ime Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka ha chee echiche n’otu ụzọ n’ime Onyenwe anyị”; ma ọ bụ, “ka ha kwekọrịta n’ime Onyenwe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐοδίαν
  choice: Yụodia
  rationale: E degharịrị aha Grik ahụ n’usoro mkpọpụta na ide aha kwekọrọ n’Igbo, kama ịsụgharị ihe aha ahụ pụtara.
- source_word: παρακαλῶ
  choice: ana m arịọ
  rationale: Nhọrọ a na-egosi arịrịọ siri ike ma bụrụ nke onwe onye, n’enweghị ụda iwu. E debere nkwugharị ngwaa ahụ maka nwanyị nke ọ bụla dịka ọ dị n’isi mmalite.
- source_word: Συντύχην
  choice: Sintike
  rationale: E degharịrị aha Grik ahụ n’usoro dị mfe onye na-agụ Igbo ịkpọ, kama ịsụgharị ihe aha ahụ pụtara.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: ka ha nwee otu uche
  rationale: Nkebiokwu a na-echekwa echiche nke inwe otu ụzọ iche echiche na otu ọnọdụ obi. Ọ sara mbara karịa nanị ikwekọrịta n’otu okwu.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: A hapụrụ njikọ ahụ n’ụdị na-egosi na ịdị n’otu a gbadoro ụkwụ na mmekọrịta ha na Onyenwe anyị, ọ bụghị naanị idozi esemokwu nke onwe.
theological_decisions:
- issue: Ihe “n’ime Onyenwe anyị” na-akọwa
  choice: E jikọtara ya na arịrịọ ka ha nwee otu uche.
  alternative: Ịkọwa ya kpọmkwem dịka “n’ịdị n’otu na Onyenwe anyị.”
  rationale: Ụdị dị nso n’isi mmalite na-echekwa obosara nke ἐν κυρίῳ ma ghara ikpebi n’ụzọ dị warara ụdị mmekọrịta ahụ pụtara.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugwu dị na ya ma dị mfe nghọta. E debere nkwugharị “ana m arịọ” iji gosipụta na Pọl kpọrọ nwanyị nke ọ bụla arịrịọ n’otu n’otu.
