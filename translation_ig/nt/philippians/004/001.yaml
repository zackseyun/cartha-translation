id: PHP.4.1
reference: Philippians 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε, ἀδελφοί μου ἀγαπητοὶ καὶ ἐπιπόθητοι, χαρὰ καὶ στέφανός μου, οὕτως στήκετε ἐν κυρίῳ, ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/001.yaml
  text: So then[a], my beloved and longed-for brothers, my joy and crown, stand firm in the Lord in this way[b], beloved.
translation:
  language: ig
  text: Ya mere, ụmụnna m[a] ndị m hụrụ n’anya na ndị m na-achọsi ike ịhụ, unu bụ ọṅụ m na okpueze m[b], guzosienụ ike otu a n’Onyenwe anyị, ndị m hụrụ n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a dị n’ụdị nwoke n’ụtọ asụsụ; ma n’ebe a Pọl na-agwa ndị kwere ekwe nọ n’ọgbakọ ahụ okwu, ọ bụghị naanị ụmụ nwoke.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya “okpueze mmeri.” Okwu Grik ahụ na-ezo aka n’okpueze e ji ahịhịa ma ọ bụ akwụkwọ kpaa nke a na-enye onye meriri n’asọmpi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu amaokwu a, ma bụrụkwa okwu Igbo doro anya ma dị ire.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: Ọ bụ okwu a na-ejikarị akpọ ndị otu okwukwe n’Igbo. Ọ na-edobe ụdị okwu ịkpọ mmadụ nke Grik ma na-adabara ọgbakọ ahụ dum.
- source_word: ἀγαπητοί
  choice: ndị m hụrụ n’anya
  rationale: Na-egosipụta ịhụnanya Pọl n'ụzọ nkịtị n’Igbo. E debere nkwughachi ya n’ebe abụọ dịka ọ dị na Grik.
- source_word: ἐπιπόθητοι
  choice: ndị agụụ ịhụ unu na-agụ m
  rationale: Na-egosipụta ọchịchọ miri emi Pọl nwere ịhụ ha ọzọ karịa naanị ịsị na ọ na-echeta ha.
- source_word: χαρά
  choice: ọṅụ m
  rationale: Na-edobe okwu Pọl kpọmkwem na ndị Filipaị n’onwe ha bụ ihe na-enye ya ọṅụ.
- source_word: στέφανος
  choice: okpueze m
  rationale: “Okpueze” bụ okwu Igbo a na-aghọta ngwa ngwa; nkọwa ala peeji na-egosi na ihe oyiyi Grik bụ okpueze mmeri e ji ahịhịa ma ọ bụ akwụkwọ kpaa.
- source_word: στήκετε
  choice: Guzosienụ ike
  rationale: Na-enye iwu ka ha nọgide guzosie ike, ghara ịla azụ n’okwukwe.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Na-edobe okwu mmekọrịta Pọl na-ejikarị eme ihe n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: οὕτως
  choice: n’ụzọ dị otu a
  rationale: Na-edobe echiche banyere ụzọ ha ga-esi guzosie ike, ma na-atụ aka n’ihe e kwuru tupu ya.
theological_decisions:
- issue: Ndị okwu ἀδελφοί na-agụnye
  choice: E ji “ụmụnna” mee ihe n’ahịrị isi, tinyekwa nkọwa na ọ na-agwa ndị kwere ekwe niile nọ n’ọgbakọ ahụ okwu.
  alternative: “ụmụnna nwoke na ụmụnna nwanyị”
  rationale: Ụdị Grik bụ nke nwoke n’ụtọ asụsụ, ma ebe akwụkwọ ozi ahụ na-agwa ọgbakọ dum okwu. “Ụmụnna” bụ okwu Igbo sitere n’echiche ikwu na ibe, nke nwere ike ịgụnye ọgbakọ dum n’enweghị itinye nkọwa na-adịghị n’ụdị okwu mbụ.
- issue: Ihe οὕτως na-atụ aka na ya
  choice: “n’ụzọ dị otu a” na-atụ aka n’ụzọ e gosipụtara n’ihe Pọl kwuru tupu amaokwu a.
  alternative: Iwere ya naanị dịka okwu nkwubi okwu pụtara “ya mere.”
  rationale: E debere ike adverb ahụ kama ijikọ ya kpamkpam na ὥστε; nke a na-echekwa njikọ amaokwu ahụ na ndụ na olileanya a kọwara tupu ya, n’agbanyeghị na oke kpọmkwem nke ntụaka ahụ ka nwere ike ịdị ghe oghe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E kewara ahịrị ahụ ụzọ abụọ ka ogologo okwu ịkpọ ha ghara ime ka iwu bụ isi ghara ido anya. “Guzosienụ” na “unu” na-egosi na a na-agwa ọtụtụ mmadụ okwu.
