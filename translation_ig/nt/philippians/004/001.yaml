revisions:
- from: Ya mere, ụmụnna m[a] ndị m hụrụ n’anya, ndị agụụ ịhụ unu na-agụ m, unu bụ ọṅụ m na okpueze m[b]. Guzosienụ ike n’ime Onyenwe anyị n’ụzọ dị otu a, ndị m hụrụ n’anya.
  to: Ya mere, ụmụnna m[a] ndị m hụrụ n’anya na ndị m na-achọsi ike ịhụ, unu bụ ọṅụ m na okpueze m[b], guzosienụ ike otu a n’Onyenwe anyị, ndị m hụrụ n’anya.
  rationale: The revision retains every source element and the original’s ambiguity while improving Standard Igbo idiom, anchoring the grammatical-gender note to the relevant word, and using the more natural Pauline expression “n’Onyenwe anyị.” No theological interpretation has been added.
