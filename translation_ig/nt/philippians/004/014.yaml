  text: Nevertheless[b][a], you did well by sharing in my affliction.
translation:
  language: ig
  text: Ma, unu mere nke ọma site n'iso m keta òkè ná mkpagbu m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “site n'iso m sonye ná nsogbu m” ma ọ bụ “site n'iso m keta òkè ná nhụjuanya m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ma
  rationale: Na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n'ihe Pọl kwuru tupu nke a, n'emeghị ka mmegide ahụ sie ike karịa ka Grik si dị.
- source_word: καλῶς
  choice: nke ọma
  rationale: Na-enye omume ndị Filipaị otuto n'ụzọ doro anya ma bụrụkwa okwu Igbo a na-asụkarị.
- source_word: ἐποιήσατε
  choice: unu mere
  rationale: Oge gara aga dabara na aorist Grik ma jikọta nke ọma na ‘nke ọma.’
- source_word: συγκοινωνήσαντές
  choice: site n'iso m kee òkè
  rationale: Na-echekwa echiche nke iso mmadụ sonye ma ọ bụ bụrụ onye mmekọ, ọ bụghị nanị inye aka n'ebe dị anya.
- source_word: τῇ θλίψει
  choice: ná mkpagbu m
  rationale: ‘Mkpagbu’ na-egosipụta nsogbu na nhụjuanya dị n'okwu θλῖψις; ‘m’ na-eme ka njikọ μου na ahụmahụ Pọl pụta ìhè n'Igbo.
