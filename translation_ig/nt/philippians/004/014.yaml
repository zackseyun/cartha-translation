  register: 'Asụsụ Igbo Ọha: dị mfe, dị ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E debere ntụgharị dị nro nke πλὴν na ịdị arọ nke θλῖψις n''enweghị ịgbakwụnye nkọwa okpukpe pụrụ iche.'
