  yaml_path: translation/nt/philippians/004/017.yaml
  text: Not that I seek the gift[a], but I seek the fruit that increases to your account.
translation:
  language: ig
  text: Ọ bụghị na m na-achọ onyinye ahụ, kama m na-achọ mkpụrụ nke na-amụba n’akaụntụ unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “mkpụrụ nke na-aba ụba n’akaụntụ unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιζητῶ
  choice: m na-achọ
  rationale: Ọ na-egosi ịchọ ihe ma ọ bụ ịchọsi ya ike; ikwughachi ya ugboro abụọ na-echekwa ọdịiche dị n'ahịrịokwu Grik.
- source_word: δόμα
  choice: onyinye ahụ
  rationale: Nke a na-ezo aka n'onyinye ndị Filipaị nyere Pọl; ntụgharị a dị mfe ma kwụ ọtọ.
- source_word: καρπὸν
  choice: mkpụrụ
  rationale: Ọ na-echekwa ihe atụ banyere mkpụrụ ma ghara ime ka ọ bụrụ naanị uru ego.
- source_word: πλεονάζοντα
  choice: nke na-abawanye
  rationale: Ọ na-egosi ihe na-eto ma ọ bụ na-amụba, ma dabara nke ọma na okwu bụ 'mkpụrụ'.
- source_word: εἰς λόγον ὑμῶν
  choice: n'akwụkwọ ndekọ unu
  rationale: N'ọnọdụ a, λόγος nwere echiche azụmahịa banyere akaụntụ ma ọ bụ ndekọ; okwu a na-echekwa ihe atụ ahụ.
- source_word: οὐχ ὅτι ... ἀλλὰ
  choice: Ọ bụghị na ... kama
  rationale: Ọ na-echekwa usoro Pọl ji kọwaa ihe ọ na-apụtaghị ma gosi ihe ọ na-achọ n'ezie.
theological_decisions:
- issue: Njikọ ihe atụ nke mkpụrụ na okwu ndekọ ego
  choice: E chekwara ha abụọ dịka 'mkpụrụ' na 'akwụkwọ ndekọ unu.'
  alternative: A pụrụ ịsụgharị ya dịka 'uru nke na-abawanye maka ọdịmma unu.'
  rationale: Grik na-ejikọta ihe atụ abụọ ahụ, ya mere ekwesịghị ịgbatị ha ka ha bụrụ naanị echiche nke uru ime mmụọ ma ọ bụ ụgwọ ọrụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji 'akwụkwọ ndekọ' mee ka echiche azụmahịa dị na λόγος doo ndị nkịtị anya, ebe e chekwara 'mkpụrụ' dịka ihe atụ.
