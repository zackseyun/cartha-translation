revisions:
- from: Ọ bụghị na m na-achọ onyinye ahụ, kama m na-achọ mkpụrụ nke na-abawanye n'akwụkwọ ndekọ unu.[a]
  to: Ọ bụghị na m na-achọ onyinye ahụ, kama m na-achọ mkpụrụ nke na-amụba n’akaụntụ unu.[a]
  rationale: The revision replaces “akwụkwọ ndekọ” with “akaụntụ” to preserve the commercial reckoning/credit sense of εἰς λόγον ὑμῶν, while retaining the source’s fruit metaphor and rhetorical contrast. The footnote is revised to offer a genuine lexical alternative for πλεονάζοντα without replacing the account metaphor with a generalized notion of benefit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:05Z'
review_pass:
  verdict: revise
  source_fidelity: The repeated present verb is retained accurately in “m na-achọ ... m na-achọ,” and “onyinye ahụ” faithfully renders τὸ δόμα. “Mkpụrụ” appropriately preserves καρπός as a metaphor. However, “n'akwụkwọ ndekọ unu” means “in your record book” and does not as directly convey the commercial sense of something accruing/being credited to their account expressed by εἰς λόγον ὑμῶν.
  naturalness: The draft is clear Standard Igbo. “Akaụntụ” is a natural, widely understood modern term in this financial metaphor and more idiomatically expresses the intended account/credit sense than “akwụkwọ ndekọ.”
  terminology: No theological terminology requires adjustment. Retaining both “mkpụrụ” and the account imagery properly preserves Paul’s juxtaposed agricultural and commercial metaphors without doctrinal expansion.
  issues:
  - severity: medium
    issue: The rendering of εἰς λόγον ὑμῶν as “n'akwụkwọ ndekọ unu” is overly concrete and weakens the directional/account-credit force.
    rationale: λόγος here has commercial-accounting force, while εἰς indicates accrual toward their account. “n’akaụntụ unu” conveys this more directly in current Standard Igbo.
  - severity: low
    issue: The footnote’s “nye uru unu” shifts from account/credit imagery to general benefit.
    rationale: Although it is not incompatible with the wider sense, it is not a close lexical alternative and flattens the source metaphor. The alternative should retain account language.
  revised_text: Ọ bụghị na m na-achọ onyinye ahụ, kama m na-achọ mkpụrụ nke na-amụba n’akaụntụ unu.[a]
  revised_footnotes:
  - marker: a
    text: 'Ma ọ bụ: “mkpụrụ nke na-aba ụba n’akaụntụ unu.”'
    reason: lexical_alternative
  revision_rationale: The revision replaces “akwụkwọ ndekọ” with “akaụntụ” to preserve the commercial reckoning/credit sense of εἰς λόγον ὑμῶν, while retaining the source’s fruit metaphor and rhetorical contrast. The footnote is revised to offer a genuine lexical alternative for πλεονάζοντα without replacing the account metaphor with a generalized notion of benefit.
