  - marker: b
    text: N'ụzọ nkịtị, “Ọzọ, aga m asị, ṅụrịanụ ọṅụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χαίρετε
  choice: Na-aṅụrịnụrị ọṅụ
  rationale: Ọ bụ iwu dị n'ụdị onye nke abụọ ọtụtụ; ntụgharị a na-egosipụta oku ka ha nọgide na-aṅụrị ọṅụ, ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: ἐν
  choice: n’ime
  rationale: “N’ime” na-edobe echiche nke ọnọdụ ma ọ bụ mmekọrịta—ịṅụrị ọṅụ n’ịdị n’otu na Onyenwe anyị—na-enweghị imechi ya ka ọ bụrụ naanị “n’ihi.”
- source_word: κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị eme ihe maka κύριος n'Igbo; n'ebe a ọ na-ezo aka na Kraịst.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Ọ bụ okwu Igbo ebumpụta ụwa nke na-egosipụta ịdịgide nke “mgbe nile.”
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ na-egosipụta nkwughachi e ji emesi iwu ahụ ike.
- source_word: ἐρῶ
  choice: Aga m ekwu
  rationale: Ọ na-edobe ọdịdị ọdịnihu nke ngwaa Grik, kama ịgbanwe ya ka ọ bụrụ ugbu a.
- source_word: χαίρετε
  choice: na-aṅụrịnụrị ọṅụ
  rationale: E ji otu ntụgharị ahụ mee ihe ọzọ iji chekwaa nkwughachi na ike okwu Pọl.
theological_decisions:
- issue: Ihe “n’ime Onyenwe anyị” pụtara
  choice: 'E debere ya dịka ọnọdụ/mmekọrịta: ndị kwere ekwe ga-aṅụrị ọṅụ n’ime mmekọrịta na ịdị n’otu ha na Onyenwe anyị.'
  alternative: “N’ihi Onyenwe anyị” ma ọ bụ “site n’ike Onyenwe anyị.”
  rationale: ἐν κυρίῳ n’akwụkwọ Pọl na-egosikarị ọnọdụ ma ọ bụ mmekọrịta. “N’ime Onyenwe anyị” na-echekwa obosara echiche ahụ n’enweghị ịkọwa ya gabiga ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere iwu ahụ n'ụdị ọtụtụ, ọdịnihu nke ἐρῶ, na nkwughachi nke χαίρετε.
