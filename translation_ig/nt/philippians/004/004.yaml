  rationale: The revision supplies an idiomatic Standard Igbo plural imperative for both occurrences of χαίρετε, retaining their deliberate repetition. It also renders πάλιν ἐρῶ with a direct future construction, while preserving “n’ime Onyenwe anyị” as the appropriately broad rendering of ἐν κυρίῳ. Footnotes are adjusted to match the corrected text and remain properly anchored.
