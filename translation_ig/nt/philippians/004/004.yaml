  text: Rejoice in the Lord always[a]; again I will say[b], rejoice.
translation:
  language: ig
  text: Ṅụrịanụ ọṅụ n’ime Onyenwe anyị mgbe niile[a]; ọzọ, aga m asị[b], ṅụrịanụ ọṅụ.
