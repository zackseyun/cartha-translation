source:
  edition: SBLGNT
  text: Οἴδατε δὲ καὶ ὑμεῖς, Φιλιππήσιοι, ὅτι ἐν ἀρχῇ τοῦ εὐαγγελίου, ὅτε ἐξῆλθον ἀπὸ Μακεδονίας, οὐδεμία μοι ἐκκλησία ἐκοινώνησεν εἰς λόγον δόσεως καὶ λήμψεως εἰ μὴ ὑμεῖς μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/015.yaml
  text: And you yourselves also know[a], Philippians, that at the beginning of the gospel, when I departed from Macedonia, no church shared with me in the matter of giving and receiving except you alone.
translation:
  language: ig
  text: Ma unu onwe unu makwaara, ndị Filipaị, na ná mmalite nke ozi ọma, mgbe m si Masedonia pụọ, ọ dịghị ọgbakọ ọbụla soro m keta òkè n’ihe banyere inye na ịnata ihe, ma e wezụga unu naanị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe ndekọ banyere inye na ịnata ihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδατε δὲ καὶ ὑμεῖς
  choice: Ma unu onwe unu makwaara
  rationale: “Makwaara” na-egosi ihe ha maara ugbu a, ma na-echekwa ike mgbakwunye nke καί; “unu onwe unu” na-emesi ὑμεῖς ike. “Ma” na-ebuga okwu n’ihu n’enweghị igosi nnukwu mmegide.
- source_word: Φιλιππήσιοι
  choice: ndị Filipaị
  rationale: Ụdị a bụ ụzọ Igbo si akpọ ndị obodo Filipaị, ma dabara n’okwu a na-agwa ha kpọmkwem.
- source_word: ἐν ἀρχῇ τοῦ εὐαγγελίου
  choice: ná mmalite nke ozi ọma
  rationale: Ọ na-echekwa okwu Grik n’enweghị ịkọwa kpọmkwem ma ọ bụ mmalite ozi Pọl n’etiti ha ka e bu n’obi.
- source_word: ὅτε ἐξῆλθον ἀπὸ Μακεδονίας
  choice: mgbe m si Masedonia pụọ
  rationale: Nke a bụ Igbo ebumpụta ụwa maka otu ihe mere mgbe Pọl hapụrụ Masedonia.
- source_word: οὐδεμία μοι ἐκκλησία ἐκοινώνησεν
  choice: ọ dịghị ọgbakọ kwadoro m
  rationale: “Kwadoro m” na-egosi isoro Pọl kere òkè n’ụzọ bara uru n’ọnọdụ enyemaka ego a, ma zere asụsụ azụmahịa siri ike.
- source_word: εἰς λόγον δόσεως καὶ λήμψεως
  choice: n’ihe banyere inye ihe na ịnata ihe
  rationale: Ọ na-enye isi okwu ahụ n’Igbo doro anya ma na-echekwa akụkụ abụọ ahụ—inye na ịnata. A hapụrụ echiche akwụkwọ ndekọ ego n’ala ala peeji.
- source_word: εἰ μὴ ὑμεῖς μόνοι
  choice: ma e wezụga naanị unu
  rationale: Ọ na-echekwa nkwusi ike na ọ bụ naanị ndị Filipaị mere nke a.
theological_decisions:
- issue: Ụdị mmekọrịta a kpọrọ κοινωνέω
  choice: kwadoro m
  alternative: soro m nwee mmekọrịta / soro m kee òkè
  rationale: N’ọnọdụ a, okwu ndị so ya banyere inye na ịnata na-egosi nkwado a na-ahụ anya, ma okwu ahụ ka sara mbara karịa naanị azụmahịa ma ọ bụ onyinye otu ugboro.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ọgbakọ” maka ἐκκλησία na “ozi ọma” maka εὐαγγέλιον. E debere ntakịrị mgbagwoju anya dị na λόγος n’ala ala peeji kama idozi ya kpamkpam n’ahịrị isi.
