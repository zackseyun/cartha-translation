  to: Ma unu onwe unu makwaara, ndị Filipaị, na ná mmalite nke ozi ọma, mgbe m si Masedonia pụọ, ọ dịghị ọgbakọ ọbụla soro m keta òkè n’ihe banyere inye na ịnata ihe, ma e wezụga unu naanị.[a]
  rationale: E dochiri “kwadoro m” anya ka e wee chekwaa ike κοινωνέω—iso mmadụ keta òkè—na-enweghị ịmanye nkọwa okpukpe ma ọ bụ azụmahịa. E debere “n’ihe banyere inye na ịnata ihe” maka εἰς λόγον δόσεως καὶ λήμψεως, ebe ihe odide ala ala na-enye nhọrọ nke na-egosi ụda ndekọ/akaụntụ. Nkwusi ike dị na “unu naanị” ka dị.
