id: PHP.4.3
reference: Philippians 4:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ναὶ ἐρωτῶ καὶ σέ, ⸂γνήσιε σύζυγε⸃, συλλαμβάνου αὐταῖς, αἵτινες ἐν τῷ εὐαγγελίῳ συνήθλησάν μοι μετὰ καὶ Κλήμεντος καὶ τῶν λοιπῶν συνεργῶν μου, ὧν τὰ ὀνόματα ἐν βίβλῳ ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/003.yaml
  text: Yes[a], I ask you also, true companion, help these women, who contended alongside me in the gospel[b], together with Clement and the rest of my fellow workers, whose names are in the book of life.
translation:
  language: ig
  text: Ee, ana m arịọkwa gị, ezi onye mụ na ya na-arụkọ ọrụ[a], nyere ụmụ nwanyị ndị a aka, bụ ndị ha na Klement na ndị ọrụ ibe m ndị ọzọ soro m gbaa mgba n’ozi ọma[b]; aha ndị a dị n’akwụkwọ nke ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ezi onye mụ na ya kekọtara yoke.” Ụfọdụ na-ewerekwa okwu Grik a dị ka aha mmadụ, “Sizịgọs.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ha na m soro lụọ ọgụ,” ma ọ bụ, “ha na m rụkọrọ ọrụ n’akụkụ m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Ee
  rationale: Na-edobe nkwenye na ntụgharị okwu Pọl ji malite arịrịọ ya.
- source_word: ἐρωτῶ
  choice: ana m arịọ
  rationale: Na-egosi arịrịọ nke onwe n’ụzọ doro anya, n’etinyeghị ike karịrị nke okwu Grik nwere.
- source_word: γνήσιε σύζυγε
  choice: ezi onye mụ na ya na-arụkọ ọrụ
  rationale: A ghọtara ya dị ka okwu a na-akpọ onye ọrụ ibe a na-akpọghị aha; nsụgharị a bụ nke Igbo dị ndụ ma na-egosi ezi mmekọrịta ha.
- source_word: συλλαμβάνου
  choice: nyere ... aka
  rationale: Na-egosi iwu ka onye ahụ kwado ụmụ nwanyị ahụ ma soro ha buru ibu ọrụ.
- source_word: αὐταῖς
  choice: ụmụ nwanyị ndị a
  rationale: Na-eme ka ụdị nwanyị nke nnọchiaha Grik pụta ìhè ma na-ezo aka na Yudia na Sintike ndị a kpọrọ aha n’amaokwu bu ụzọ.
- source_word: συνήθλησάν μοι
  choice: ha na m so lụọ ọgụ
  rationale: Na-echekwa onyinyo asọmpi ma ọ bụ mgba dị na συναθλέω, ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: n’ọrụ ozi ọma
  rationale: Na-enye okwu Grik ahụ n’Igbo eke, ma ghara imechi ma ọ bụ kọwaa kpọmkwem ụdị ọrụ ahụ karịa ihe isi mmalite kwuru.
- source_word: συνεργῶν
  choice: ndị ọzọ mụ na ha na-arụkọ ọrụ
  rationale: Na-enye echiche ndị ọrụ ibe Pọl n'ụzọ doro anya na nke eke n’Igbo.
- source_word: βίβλῳ ζωῆς
  choice: akwụkwọ nke ndụ
  rationale: Na-edobe ahịrịokwu Akwụkwọ Nsọ a ma ama, nke na-ezo aka n’akwụkwọ ndị aha ndị nke Chineke dị na ya.
theological_decisions:
- issue: Nkọwa γνήσιε σύζυγε
  choice: 'Okwu nkọwa a gwara otu nwoke a na-akpọghị aha: “ezi onye mụ na ya na-arụkọ ọrụ”'
  alternative: Ọ pụrụ ịbụ aha mmadụ, “Sizịgọs,” ma ọ bụ, n’ụzọ nkịtị karị, “ezi onye mụ na ya kekọtara yoke.”
  rationale: γνήσιε kwekọrọ nke ọma na okwu nkọwa a na-akpọ mmadụ, ebe σύζυγε na-egosi onye e jikọtara ya na ibe ya n’ọrụ. E debere ohere nkọwa ndị ọzọ n’ala peeji n’ihi na okwu ahụ nwere ike ịpụta ihe karịrị otu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E ji “lụọọ ọgụ” chekwaa onyinyo mgba dị na ngwaa Grik; e tinyere “ọrụ” na “ozi ọma” ka ahịrịokwu ahụ daa nke ọma n’Igbo na-enweghị ịkọwa echiche ahụ oke.
