  to: Ee, ana m arịọkwa gị, ezi onye mụ na ya na-arụkọ ọrụ[a], nyere ụmụ nwanyị ndị a aka, bụ ndị ha na Klement na ndị ọrụ ibe m ndị ọzọ soro m gbaa mgba n’ozi ọma[b]; aha ndị a dị n’akwụkwọ nke ndụ.
  rationale: E degharịrị ahịrịokwu ahụ ka «bụ ndị» jikọọ ụmụ nwanyị ahụ na ngwaa «soro m gbaa mgba», tinyekwa Klement na ndị ọrụ ibe ndị ọzọ n’otu njikọ isi mmalite nwere. E wepụrụ «ọrụ» n’ihu «ozi ọma» iji ghara ịgbakwunye echiche, ma họrọ «gbaa mgba» maka onyinyo συναθλέω. A hapụrụ okwu a na-akpọ onye a na-amaghị aha na ala peeji ya ka ohere «Syzygus» na «yokefellow» dịgide.
