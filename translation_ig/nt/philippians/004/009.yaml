  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἃ καὶ ἐμάθετε καὶ παρελάβετε καὶ ἠκούσατε καὶ εἴδετε ἐν ἐμοί, ταῦτα πράσσετε· καὶ ὁ θεὸς τῆς εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/009.yaml
  text: What you also learned and received and heard and saw in me—practice these things[b][a], and the God of peace will be with you.
translation:
  language: ig
  text: Ihe ndị unu mụtara ma nata, nụrụ ma hụ n’ime m[a]—na-etinyenụ ihe ndị a n’ọrụ[b]; Chineke nke udo ga-anọnyere unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “hụrụ n’ime m” dịka “hụrụ n’omume m” ma ọ bụ “hụrụ ná ndụ m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-emenụ ihe ndị a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ
  choice: Ihe ndị
  rationale: Nnọchiaha a bụ nke ọtụtụ ihe; “Ihe ndị” na-egosipụta ọtụtụ ahụ nke ọma ma na-eduga n’usoro ngwaa ndị na-esochi.
- source_word: ἐμάθετε
  choice: unu mụtara
  rationale: Ọ na-egosi ihe ndị Filipaị mụtara n’aka Pọl; okwu a bụ Igbo nkịtị ma doo anya.
- source_word: παρελάβετε
  choice: unu natara
  rationale: “Natara” na-edobe obosara echiche nke ịnata ozizi ma ọ bụ ihe e nyefere ha, n’akọwaghị ya kpọmkwem dị ka ọdịnala.
- source_word: ἠκούσατε
  choice: unu nụrụ
  rationale: Ọ na-edobe ngwaa dị mfe na usoro yiri ibe ya dị n’amaokwu ahụ.
- source_word: εἴδετε ἐν ἐμοί
  choice: unu hụrụ n’ime m
  rationale: Nsụgharị a na-esochi okwu Grik nso ma hapụ ohere ma ọ̀ bụ omume Pọl, ndụ ya, ma ọ bụ ihe a hụrụ n’ahụ ya ka a na-ekwu; nkọwa ọzọ dị n’ala peeji.
- source_word: ταῦτα πράσσετε
  choice: na-eme ihe ndị a
  rationale: Ụdị “na-eme” na-egosi omume a ga-anọgide na-eme, nke kwekọrọ n’iwu present imperative πράσσετε.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Chineke nke udo
  rationale: Ọ na-edobe usoro genitive nke okwu Grik na aha Pọl na-ejikarị akpọ Chineke, n’akọwaghị ya naanị dị ka onye na-enye udo.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: ga-anọnyekwa unu
  rationale: Ọ na-egosi nkwa banyere ọnụnọ Chineke; “-kwa” na-eburu njikọ καί dị n’ihu nkebi nke abụọ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti irube isi na ọnụnọ Chineke
  choice: E depụtara ya dị ka ndụmọdụ nke nkwa na-esochi, jiri njikọ “-kwa” kama ime ya ahịrịokwu ọnọdụ.
  alternative: A pụrụ ịsụgharị ya n’ụzọ siri ike dịka, “Ọ bụrụ na unu emee ihe ndị a, Chineke... ga-anọnyere unu.”
  rationale: Grik ji καί jikọta nkebi abụọ ahụ; o kwughị ya kpọmkwem n’usoro ọnọdụ. Nsụgharị a na-edobe ike ndụmọdụ na nkwa ahụ n’etinyeghị nkọwa banyere ihe na-akpata ihe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ngwaa anọ ahụ na nkwughachi “ndị unu” iji mee ka njikọ ha na “Ihe ndị” doo anya. E ji apostrophe Igbo kwesịrị ekwesị mee n’ime, n’omume, ná ndụ, na n’ọrụ.
