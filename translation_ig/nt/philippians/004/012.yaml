reference: Philippians 4:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἶδα καὶ ταπεινοῦσθαι, οἶδα καὶ περισσεύειν· ἐν παντὶ καὶ ἐν πᾶσιν μεμύημαι, καὶ χορτάζεσθαι καὶ πεινᾶν, καὶ περισσεύειν καὶ ὑστερεῖσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/012.yaml
  text: 'I know how to be brought low, and I know how to abound. In every circumstance and in all things I have learned the secret: both to be well fed and to be hungry, both to abound and to be in need.'
translation:
  language: ig
  text: 'Ama m otú m ga-esi biri mgbe e wedara m ala, amakwa m otú m ga-esi biri n’ụba. N’ọnọdụ ọ bụla nakwa n’ihe niile, amụtala m ihe nzuzo[a]: ma iriju afọ ma ịgụ agụụ, ma ibi n’ụba ma ịnọ ná mkpa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ ka nso n’okwu Grik: “e webatala m n’ihe nzuzo.” Pọl ji okwu nnabata n’ime ihe nzuzo mee ihe atụ maka ịmụ ihe nzuzo a.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Ama m otú m ga-esi
  rationale: N'okwu Igbo, nke a na-egosi amamihe e nwetara site n'ahụmahụ banyere otú e si ebi n'ọnọdụ ndị a, ọ bụghị naanị ịma ihe n'uche.
- source_word: ταπεινοῦσθαι
  choice: ibi mgbe e wedara m ala
  rationale: Nke a na-echekwa echiche nke ọnọdụ mere ka mmadụ daa ala, kama ime ya naanị ka ọ bụrụ ịdị umeala n'obi.
- source_word: περισσεύειν
  choice: ibi n'ụba
  rationale: “Ụba” na-egosi inwe ihe karịrị mkpa ma na-ahapụ okwu ahụ ka ọ gbasaa karịa naanị ego.
- source_word: ἐν παντὶ καὶ ἐν πᾶσιν
  choice: N'ọnọdụ ọ bụla nakwa n'ihe niile
  rationale: Nsụgharị a na-edobe akụkụ abụọ nke ahịrịokwu Grik ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: μεμύημαι
  choice: amụtala m ihe nzuzo
  rationale: Okwu ahụ sitere n'asụsụ nnabata n'ime ihe nzuzo, ma Pọl ji ya mee ihe atụ maka ihe ọ mụtara banyere ibi n'ọnọdụ niile; nkọwa ala peeji na-echekwa ihe okwu ahụ pụtara n'ụzọ nkịtị.
- source_word: χορτάζεσθαι
  choice: rịjuo afọ
  rationale: N'ihi na e tinyere ya megide ịnọ agụụ, okwu a na-egosi iri nri ruo mgbe afọ juru.
- source_word: πεινᾶν
  choice: nọrọ agụụ
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ kpọmkwem na ihe dị iche na iriju afọ.
- source_word: ὑστερεῖσθαι
  choice: nọrọ ná mkpa
  rationale: Nke a na-egosi enweghị ihe dị mkpa n'ụzọ sara mbara, ọ bụghị naanị enweghị ego.
theological_decisions:
- issue: Ma ταπεινοῦσθαι ọ na-ekwu maka ịdị umeala n'obi ka ọ bụ ọnọdụ e wedara mmadụ ala
  choice: ibi mgbe e wedara m ala
  alternative: ibi ndụ umeala n'obi
  rationale: Ụdị ngwaa ahụ na ihe ndị gbara ya gburugburu—agụụ, ụba, na mkpa—na-akwado ọnọdụ ndụ dara ala. Nsụgharị ahụ anaghị eme ka okwu ahụ bụrụ naanị àgwà ime mmụọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwugharị nke “Ama m” na ụzọ anọ e si tụnyere ọnọdụ ndụ, ebe a zere ime ka “ụba” na “mkpa” bụrụ naanị okwu gbasara ego.
