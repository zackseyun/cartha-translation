- from: Keleenụ onye nsọ ọ bụla n’ime Mesaya Jizọs.[a] Ụmụnna ndị mụ na ha nọ na-ekele unu.[b]
  to: Keleenụ onye nsọ ọ bụla nọ n’ime Mesaịa Jizọs.[a] Ụmụnna ndị mụ na ha nọ na-ezitere unu ekele.[b]
  rationale: The revision standardizes the rendering of Messiah as “Mesaịa,” clarifies the modifying phrase “in Messiah Jesus” with “nọ,” and uses an idiomatic Igbo letter-closing expression for the greetings sent by Paul’s companions. It preserves the source’s ambiguity about the scope of ἀδελφοί and retains both footnote anchors and their functions.
