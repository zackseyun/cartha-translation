  text: Ἀσπάσασθε πάντα ἅγιον ἐν Χριστῷ Ἰησοῦ. ἀσπάζονται ὑμᾶς οἱ σὺν ἐμοὶ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/021.yaml
  text: Greet every saint in Messiah Jesus[b][a]. The brothers with me greet you.
translation:
  language: ig
  text: Keleenụ onye nsọ ọ bụla nọ n’ime Mesaịa Jizọs.[a] Ụmụnna ndị mụ na ha nọ na-ezitere unu ekele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime Kraịst Jizọs.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” n’ebe a nwere ike ịpụta ndị kwere ekwe ibe Pọl, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Keleenụ
  rationale: Ụdị iwu a na-akpọ ndị a na-edegara akwụkwọ ka ha zie onye ọ bụla ekele; “Keleenụ” bụ okwu Igbo dị mfe ma kwekọọ n’usoro mmechi akwụkwọ ozi.
- source_word: πάντα ἅγιον
  choice: onye nsọ ọ bụla
  rationale: πᾶς na aha otu onye nwere nghọta nkesa, ya bụ onye nke ọ bụla n’ìgwè ndị e doro nsọ; ntụgharị a na-echekwa ma nghọta ahụ ma okwu ịdị nsọ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaya Jizọs
  rationale: ἐν ka e debere dịka “n’ime,” ebe Χριστός bụ utu aha pụtara Mesaya, ọ bụghị naanị aha onwe onye.
- source_word: ἀσπάζονται
  choice: na-ekele
  rationale: N’ọnọdụ mmechi akwụkwọ ozi, ngwaa a pụtara na ndị ahụ na-eziga ekele; okwu Igbo a dị kpọmkwem ma bụrụ nke e ji eme ihe ugbu a.
- source_word: οἱ σὺν ἐμοὶ ἀδελφοί
  choice: Ụmụnna ndị mụ na ha nọ
  rationale: “Ụmụnna” bụ ntụgharị Igbo ebumpụta ụwa maka ἀδελφοί, ma ọ nwekwara ike ịgụnye ndị nwoke na ndị nwanyị bụ ndị kwere ekwe dịka ọnọdụ siri dị; “ndị mụ na ha nọ” na-egosipụta σὺν ἐμοί nke ọma.
theological_decisions:
- issue: Χριστός dịka utu aha
  choice: Mesaya
  alternative: Kraịst
  rationale: Okwu Grik ahụ sitere n’echiche onye e tere mmanụ ma na-arụ ọrụ dịka utu aha; “Mesaya” na-eme ka nke ahụ pụta ìhè n’enweghị itinye nkọwa otu ụka.
- issue: Mkpokọta ἀδελφοί
  choice: Ụmụnna
  alternative: Ụmụnne nwoke
  rationale: Ọ bụ ezie na ἀδελφοί bụ ụdị ọtụtụ nke nwoke na ụtọasụsụ Grik, n’ọnọdụ a o nwere ike ịpụta ndị kwere ekwe ibe Pọl n’ozuzu ha; “Ụmụnna” na-echekwa obosara ahụ n’Igbo.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka o doo anya na Pọl na-agwa ọtụtụ mmadụ okwu; e debere usoro ahịrịokwu abụọ nke isi mmalite.
