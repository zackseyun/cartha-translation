  text: ὅτι καὶ ἐν Θεσσαλονίκῃ καὶ ἅπαξ καὶ δὶς εἰς τὴν χρείαν μοι ἐπέμψατε.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/016.yaml
  text: because even in Thessalonica you sent for my need both once and twice[a].
translation:
  language: ig
  text: n’ihi na ọbụna na Tesalonaịka, unu ziteere m ihe iji gboo mkpa m otu ugboro na ugboro abụọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya n’ụzọ dị nkenke: “unu ziteere m ihe iji gboo mkpa m ihe karịrị otu ugboro.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-ewebata ihe kpatara okwu Pọl kwuru n’amaokwu ndị gbara ya gburugburu; nke a bụ njikọ doro anya ma bụrụkwa nke e ji eme ihe n’Igbo ugbu a.
- source_word: ἐν Θεσσαλονίκῃ
  choice: mgbe m nọ na Tesalonaịka
  rationale: Ọ bụ ezie na Grik kwuru naanị ‘na Tesalonaịka,’ usoro a na-eme ka onye a na-ekwu na ọ nọ ebe ahụ doo anya n’Igbo, n’enweghị ịgbanwe isi echiche ọnọdụ ahụ.
- source_word: καὶ ἅπαξ καὶ δὶς
  choice: ọ bụghị naanị otu ugboro kama ugboro abụọ
  rationale: Na-echekwa nkwusiri ike dị n’okwu Grik banyere iziga ha ihe otu ugboro na ugboro nke abụọ, ma na-ada nke ọma n’Igbo.
- source_word: εἰς τὴν χρείαν μοι
  choice: ihe ga-egbo mkpa m
  rationale: Na-egosipụta χρεία dị n’otu ọnụọgụ dịka ‘mkpa m,’ ma kọwaa n’ụzọ Igbo ebumnuche nke ihe e zigara n’etinyeghị ụdị enyemaka a na-ekwu maka ya.
- source_word: ἐπέμψατε
  choice: unu ziteere m
  rationale: Na-asụgharị ngwaa ahụ dịka ‘unu zigara m’; ihe e zigara ka bụ ihe a na-aghọtaghị kpọmkwem dịka ọ dị na Grik.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ọ bụghị naanị otu ugboro kama ugboro abụọ’ chekwaa nkwusiri ike nke ἅπαξ καὶ δὶς, ebe nkọwa ala peeji na-enye okwu Igbo dị nkenke karịa.
