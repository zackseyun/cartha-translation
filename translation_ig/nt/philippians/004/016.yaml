    issue: The translation renders ἐν Θεσσαλονίκῃ as “mgbe m nọ na Tesalonaịka.”
    rationale: The Greek states “in Thessalonica,” not explicitly “when I was in Thessalonica.” Although the context concerns Paul, the added temporal clause and subject go beyond the source wording.
