  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδὲν μεριμνᾶτε, ἀλλ’ ἐν παντὶ τῇ προσευχῇ καὶ τῇ δεήσει μετ’ εὐχαριστίας τὰ αἰτήματα ὑμῶν γνωριζέσθω πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/006.yaml
  text: Do not be anxious about anything[a], but in everything, by prayer and petition with thanksgiving[c][b], let your requests be made known to God.
translation:
  language: ig
  text: Unu echegbula onwe unu banyere ihe ọ bụla[a]. Kama, n’ihe niile, site n’ekpere na arịrịọ, tinyere ekele, meenụ ka Chineke mara arịrịọ unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu echegbula onwe unu maka ihe ọ bụla.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “meenụ ka e mee ka a mara arịrịọ unu n’ihu Chineke.”
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: μηδὲν μεριμνᾶτε
  choice: Unu echegbula onwe unu banyere ihe ọ bụla
  rationale: Nke a na-egosipụta mmachibido ichegbu onwe n’ụzọ Igbo dị ndụ ma doo anya, ebe ‘ihe ọ bụla’ na-eburu ịdị obosara nke μηδὲν.
- source_word: ἐν παντὶ
  choice: n’ihe niile
  rationale: Ọ na-echekwa ịdị obosara nke okwu Grik ahụ ma bụrụkwa okwu Igbo nkịtị.
- source_word: τῇ προσευχῇ
  choice: site n’ekpere
  rationale: ‘Ekpere’ bụ okwu Igbo a na-aghọta nke ọma maka ịgwa Chineke okwu n’ekpere.
- source_word: τῇ δεήσει
  choice: arịrịọ
  rationale: ‘Arịrịọ’ na-egosi ịrịọsi ike maka mkpa pụrụ iche, ma na-edobe ọdịiche dị n’etiti προσευχή na δέησις.
- source_word: μετ’ εὐχαριστίας
  choice: tinyere ekele
  rationale: Nke a na-echekwa echiche nke ime ekpere na arịrịọ n’obi ekele.
- source_word: τὰ αἰτήματα ὑμῶν
  choice: ihe ndị unu na-arịọ ya
  rationale: Nke a bụ Igbo eke ma doro ndị na-agụ ya anya karịa ịmegharị ‘arịrịọ’ ọzọ.
- source_word: γνωριζέσθω
  choice: meenụ ka Chineke mara
  rationale: Ọ na-eburu ike nke iwu ahụ n’Igbo eke, ọ bụ ezie na ọ na-agbanwe passive Grik ka ọ bụrụ usoro causative a na-anụkarị n’Igbo.
- source_word: πρὸς τὸν θεόν
  choice: ka Chineke mara
  rationale: E tinyere onye a na-agwa arịrịọ ahụ n’usoro okwu Igbo eke; echiche bụ ime ka arịrịọ ndị ahụ ruo Chineke.
theological_decisions:
- issue: Ihe πρὸς τὸν θεόν pụtara n’ebe a
  choice: ka Chineke mara
  alternative: n’ihu Chineke
  rationale: πρός na-akwado echiche nke ime ka Chineke mara arịrịọ; ‘n’ihu Chineke’ kwekwara omume ma nwee ike igosi ọnọdụ ekpere n’ihu ya. E debeghị otu echiche ahụ n’enweghị akara, kama e tinyere ya n’ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ugwu. E ji ‘unu’ debe onye nke abụọ ọtụtụ n’ọnụ ọgụgụ. A zere okwu ochie ma chekwaa ọdịiche dị n’etiti ekpere sara mbara na arịrịọ maka mkpa pụrụ iche.
