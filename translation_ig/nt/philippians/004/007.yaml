id: PHP.4.7
reference: Philippians 4:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ θεοῦ ἡ ὑπερέχουσα πάντα νοῦν φρουρήσει τὰς καρδίας ὑμῶν καὶ τὰ νοήματα ὑμῶν ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/007.yaml
  text: And the peace of God[a], which surpasses all understanding, will guard your hearts and your minds in Messiah Jesus.
translation:
  language: ig
  text: Udo nke Chineke, nke karịrị nghọta niile, ga-echekwa obi unu na echiche unu n’ime Mesaịa Jizọs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” bụ okwu Igbo doro anya ma dịkwa n’usoro asụsụ Akwụkwọ Nsọ; ọ na-enye ohere maka ịdị jụụ n’ime mmadụ na ezi mmekọrịta dị n’okwu Grik a.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: Nke a na-edobe genitive Grik ahụ n’enweghị ịkọwa ya karịa ka ederede siri kwuo; ọ pụkwara ịgụnye echiche na udo ahụ si n’aka Chineke.
- source_word: ἡ ὑπερέχουσα
  choice: nke karịrị
  rationale: “Nke karịrị” na-egosi na udo Chineke gafere ma ọ bụ dị elu karịa oke nghọta, n’Igbo dị mfe ma bụrụkwa nke ugwu.
- source_word: πάντα νοῦν
  choice: nghọta niile
  rationale: N’ọnọdụ a νοῦς na-arụtụ aka n’ike mmadụ nwere ịghọta ihe; “nghọta niile” na-egosipụta nke ahụ karịa ntụgharị nkịtị “uche niile.”
- source_word: φρουρήσει
  choice: ga-echekwa
  rationale: Okwu a na-eburu echiche onye nche na-eche ihe nche; “ga-echekwa” na-ejikọta nchedo na ilekọta n’ụzọ Igbo nkịtị.
- source_word: τὰς καρδίας ὑμῶν
  choice: obi unu
  rationale: “Obi” na-edobe ihe oyiyi Akwụkwọ Nsọ nke etiti ndụ ime mmadụ, ọchịchọ, na mmetụta ya.
- source_word: τὰ νοήματα ὑμῶν
  choice: echiche unu
  rationale: νοήματα bụ echiche ma ọ bụ ihe uche na-eche; “echiche unu” ziri ezi ma ghara ime ka “obi” na “uche” yie otu ihe.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: “N’ime” na-edobe echiche mmekọrịta na ọnọdụ nke ἐν, ebe “Mesaịa” na-atụgharị Χριστός dịka aha ọrụ onye ahụ e tere mmanụ.
theological_decisions:
- issue: Ihe ἐν Χριστῷ Ἰησοῦ pụtara n’usoro okwu Pọl
  choice: n’ime Mesaịa Jizọs
  alternative: n’ime Kraịst Jizọs
  rationale: A họọrọ “Mesaịa” iji gosipụta na Χριστός bụ aha ọrụ nke Onye E Tere Mmanụ, ebe “n’ime” na-ahapụ echiche njikọ na ọnọdụ ime mmụọ ahụ n’enweghị ịkọwa ya n’ụzọ otu ozizi pụrụ iche.
- issue: Mmekọrịta genitive dị na εἰρήνη τοῦ θεοῦ
  choice: udo nke Chineke
  alternative: udo si n’aka Chineke
  rationale: '“Nke Chineke” na-edobe ambiguity nke Grik: udo ahụ bụ nke Chineke, ọ pụkwara ịbụ nke si n’aka ya, n’ebughị ụzọ mechie ihe ọ pụtara naanị n’isi mmalite ya.'
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ugwu. E ji “unu” mee ka plural nke ὑμῶν pụta ìhè. Ahịrịokwu ahụ na-agbaso usoro Grik nke ọma ma na-anọgide bụrụ nke ndị na-agụ Igbo taa ga-aghọta ngwa ngwa.
