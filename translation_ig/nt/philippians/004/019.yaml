source:
  edition: SBLGNT
  text: ὁ δὲ θεός μου πληρώσει πᾶσαν χρείαν ὑμῶν κατὰ ⸂τὸ πλοῦτος⸃ αὐτοῦ ἐν δόξῃ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/019.yaml
  text: And my God will supply every need of yours according to his riches in glory in Messiah Jesus[a][b][c][d].
translation:
  language: ig
  text: Ma Chineke m ga-egboro unu mkpa unu niile dịka akụnụba ya si dị n’ebube n’ime Mesaịa Jizọs.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Kraịst Jizọs.”
    reason: lexical_alternative
  - marker: b
    text: “Dịka akụnụba ya si dị” na-egosi oke ma ọ bụ ụkpụrụ onyinye Chineke; ọ bụghị naanị na onyinye ahụ si n’akụnụba ya pụta.
    reason: alternative_reading
  - marker: c
    text: Ma eleghị anya, a pụrụ ịsụgharị “n’ebube” dịka “n’ụzọ dị ebube.”
    reason: alternative_reading
  - marker: d
    text: 'Usoro okwu Grik nwekwara ike ikwe ka a jikọta “n’ebube” na “n’ime Mesaịa Jizọs” ọnụ: “n’ebube n’ime Mesaịa Jizọs.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ δὲ θεός μου
  choice: Ma Chineke m
  rationale: δέ bụ njikọ dị nro n’ebe a; “Ma” na-ejikọta okwu a na ihe Pọl kwuru tupu ya, na-enweghị ime ka ọdịiche ahụ sie ike karịa nke Grik.
- source_word: πληρώσει
  choice: ga-egboro
  rationale: N’ọnọdụ a, πληρόω pụtara inye ihe na-adịghị ma ọ bụ igbo mkpa; “ga-egboro” bụ okwu Igbo doro anya ma dịkwa ndụ.
- source_word: πᾶσαν χρείαν ὑμῶν
  choice: mkpa unu niile
  rationale: Nke a na-egosipụta χρεία dị ka mkpa ma na-echekwa ike nkesa nke πᾶσαν—mkpa nke ọ bụla unu nwere.
- source_word: κατὰ τὸ πλοῦτος αὐτοῦ
  choice: dịka ụba akụ ya si dị
  rationale: κατά na accusative na-egosi ụkpụrụ ma ọ bụ oke e ji enye ihe, ọ bụghị naanị ebe onyinye si pụta. “Dịka … si dị” na-echekwa echiche ahụ.
- source_word: ἐν δόξῃ
  choice: n’ebube
  rationale: Nsụgharị a na-edobe prepositional phrase nke Grik ma ghara ikpebi kpọmkwem ma ọ na-egosi ọnọdụ, ụzọ, ma ọ bụ àgwà nke inye ihe.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: Χριστός bụ aha-ọkwa nke pụtara Mesaịa, Onye e tere mmanụ. “N’ime” na-echekwa asụsụ njikọ Pọl ji mee ihe, ebe “Mesaịa” na-egosipụta aha-ọkwa ahụ.
theological_decisions:
- issue: Otú e si asụgharị Χριστός na ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  alternative: n’ime Kraịst Jizọs
  rationale: Isi nsụgharị na-egosipụta Χριστός dịka aha-ọkwa “Mesaịa,” ebe ihe odide ala peeji na-edobe ụdị omenala “Kraịst.”
- issue: Mmekọrịta ἐν δόξῃ na ἐν Χριστῷ Ἰησοῦ
  choice: 'E debere ha n’usoro Grik: “n’ebube n’ime Mesaịa Jizọs”'
  alternative: Ịghọta “n’ebube” dịka “n’ụzọ dị ebube,” ma ọ bụ ijikọ ya n’ụzọ ọzọ na “n’ime Mesaịa Jizọs”
  rationale: Usoro okwu Grik ekwughị kpamkpam ebe nkebi nke ọ bụla dabere; ya mere, isi nsụgharị anaghị emechi nghọta ndị ahụ, ebe ihe odide ala peeji na-akọwa ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ga-egboro unu mkpa unu niile” bụ okwu Igbo ebumpụta ụwa maka inye ihe niile dị mkpa; e debere “n’ebube” n’ụdị dị mkpirikpi iji chekwaa nghọtahie ziri ezi dị na Grik.
