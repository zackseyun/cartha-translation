  rationale: The sole revision replaces the redundant phrase “ụba akụ ya” with the idiomatic Standard Igbo compound “akụnụba ya,” including the corresponding explanatory footnote. The translation otherwise faithfully preserves the Greek wording and its syntactic ambiguity, including the relation of “n’ebube” and “n’ime Mesaịa Jizọs.”
