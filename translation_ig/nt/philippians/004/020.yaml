  yaml_path: translation/nt/philippians/004/020.yaml
  text: To our God and Father be the glory forever and ever[a]. Amen.
translation:
  language: ig
  text: Ka otuto dịrị Chineke na Nna anyị ruo mgbe niile ebighị ebi[a]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ n'ụzọ nkịtị karị, “ruo n’ọgbọ nke ọgbọ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: (ekwughị ya iche)
  rationale: Ọ bụ njikọ dị nro nke na-eduga n'okwu otuto mmechi; n'Igbo, ịhapụ ya n'ekwughị ya iche na-eme ka ahịrịokwu ahụ daa nke ọma n'etinyeghị echiche oge ma ọ bụ mmegide na-adịghị na isi mmalite.
- source_word: θεῷ καὶ πατρὶ ἡμῶν
  choice: Chineke anyị na Nna anyị
  rationale: Nke a na-edobe okwu abụọ ahụ dị ka aha na nkọwa nke otu onye, ebe ‘anyị’ na-emetụta Chineke na Nna n'ụzọ Igbo na-aghọta nke ọma.
- source_word: ἡ δόξα
  choice: Ka otuto dịrị
  rationale: Ahịrịokwu Grik enweghị ngwaa; ụdị ‘Ka ... dịrị’ bụ ụzọ ebumpụta ụwa na nke dị nsọ e si ekwupụta otuto a n'Igbo.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: ruo mgbe niile ebighị ebi
  rationale: Ọ bụ akpaalaokwu na-egosi oge na-enweghị ọgwụgwụ; nsụgharị a doro ndị na-agụ Igbo anya ma na-edobe ịdị elu nke okwu otuto ahụ.
- source_word: ἀμήν
  choice: Amen
  rationale: E debere okwu a n'ụdị a maara nke ọma n'ofufe Ndị Kraịst dị ka nkwenye siri ike.
theological_decisions:
- issue: Itinye ngwaa a na-ekwughị n'ahịrịokwu otuto ahụ
  choice: Ka otuto dịrị
  alternative: Otuto dịrị / otuto bụ nke
  rationale: Ebe Grik enweghị ngwaa, ‘Ka otuto dịrị’ na-egosipụta ọrụ ahịrịokwu ahụ dị ka okwu otuto ma ghara ikwu hoo haa na ọ bụ nanị nkwupụta banyere ihe dị ugbu a.
- issue: Mmekọrịta dị n'etiti ‘Chineke’ na ‘Nna anyị’
  choice: Chineke anyị na Nna anyị
  alternative: Chineke, ya bụ Nna anyị
  rationale: Nhọrọ a na-edobe otu onye a na-ekwu maka ya ma ghara ime ka ‘καί’ bụrụ nkọwa ‘ya bụ’ n'ụzọ nwere ike iwepụ ntakịrị ọdịdị okwu Grik.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro okwu otuto a na-anụkarị n'Igbo mee ka amaokwu ahụ daa nke ọma, ebe e debere nkọwa nkịtị nke akpaalaokwu oge n'ala ala peeji.
