  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐχάρην δὲ ἐν κυρίῳ μεγάλως ὅτι ἤδη ποτὲ ἀνεθάλετε τὸ ὑπὲρ ἐμοῦ φρονεῖν, ἐφ’ ᾧ καὶ ἐφρονεῖτε ἠκαιρεῖσθε δέ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/010.yaml
  text: I rejoiced greatly in the Lord that now at last you have revived your concern for me[a]; indeed, you were concerned[b], but you lacked opportunity.
translation:
  language: ig
  text: Enwere m ọṅụ dị ukwuu n’ime Onyenwe anyị, n’ihi na ugbu a, n’ikpeazụ, nlekọta unu n’ebe m nọ ebilitela ọzọ[a]. N’ezie, unu nọ na-eche banyere m[b], ma unu enweghị ohere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “unu etoola ọzọ” n’ihe gbasara nlekọta unu n’ebe m nọ”; ngwaa ahụ na-eji onyinyo osisi nke ito ma ọ bụ ịma ifuru ọzọ. Ma ọ bụ, “unu emela ka nlekọta unu n’ebe m nọ dị ọhụrụ ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “unu nọ na-echeta m,” ma ọ bụ “unu nọ na-elebara m anya.” Ngwaa Grik a nwere ike ịpụta iche banyere mmadụ, ilebara ya anya, ma ọ bụ inwe nlekọta maka ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην
  choice: Enwere m ọṅụ
  rationale: Ọ na-egosipụta ọṅụ Pọl n’onwe ya n'ụzọ doro anya ma bụrụkwa okwu Igbo nkịtị.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Ọ na-echekwa okwu Pọl nke na-egosi na Onyenwe anyị bụ ebe na ntọala ọṅụ ya.
- source_word: μεγάλως
  choice: dị ukwuu
  rationale: Ọ na-echekwa ike nke adverb ahụ ma jikọta ya nke ọma na ọṅụ Pọl.
- source_word: ἤδη ποτὲ
  choice: ugbu a, n’ikpeazụ
  rationale: Ọ na-egosi na mgbe oge gafesịrị, nchegbu ha pụtara ìhè ọzọ, n’ebughị ebubo na ha leghaara Pọl anya.
- source_word: ἀνεθάλετε
  choice: amalitela ito ọzọ
  rationale: Ọ na-echekwa ihe atụ osisi nke ngwaa Grik ahụ—ịmalite ito ma ọ bụ maa ifuru ọzọ—ma ka bụrụ Igbo a na-aghọta nke ọma.
- source_word: τὸ ὑπὲρ ἐμοῦ φρονεῖν
  choice: nchegbu unu banyere m
  rationale: N’ebe a φρονεῖν karịrị nanị iche echiche; ọ na-egosi nlekọta na mmasị bara uru banyere Pọl.
- source_word: ἐφ’ ᾧ
  choice: N’ezie
  rationale: Ọ na-ewebata nkọwa Pọl na ha nọgidere na-eche banyere ya n'ụzọ Igbo dị larịị.
- source_word: ἐφρονεῖτε
  choice: unu nọ na-eche banyere m
  rationale: Ọ na-edobe obosara ihe φρονέω nwere ike ịpụta, ya bụ icheta mmadụ, ilebara ya anya, ma ọ bụ nwee nchegbu banyere ya.
- source_word: ἠκαιρεῖσθε
  choice: unu enweghị ohere
  rationale: Ọ na-egosi enweghị oge ma ọ bụ ọnọdụ kwesịrị ekwesị, ọ bụghị enweghị ọchịchọ inyere Pọl aka.
theological_decisions:
- issue: Ihe ‘n’ime Onyenwe anyị’ pụtara kpọmkwem
  choice: E debere ya dịka ‘n’ime Onyenwe anyị.’
  alternative: ‘n’ihi Onyenwe anyị’
  rationale: Nkebiokwu Grik nwere ike igosi ebe ime mmụọ ma ọ bụ ntọala ọṅụ ahụ; nsụgharị a anaghị emechi obosara ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke ἀνεθάλετε n’ahịrị bụ isi, ebe nkọwa ala peeji na-enye ụzọ ndị ọzọ e si ghọta ya. ‘Onyenwe anyị’ bụ okwu a maara nke ọma maka κύριος n’ebe a.
