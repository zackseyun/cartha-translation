id: PHP.4.18
reference: Philippians 4:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπέχω δὲ πάντα καὶ περισσεύω· πεπλήρωμαι δεξάμενος παρὰ Ἐπαφροδίτου τὰ παρ’ ὑμῶν, ὀσμὴν εὐωδίας, θυσίαν δεκτήν, εὐάρεστον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/018.yaml
  text: But I have received everything[a], and I abound. I am fully supplied, having received from Epaphroditus what came from you—a fragrant aroma, an acceptable sacrifice, pleasing to God.
translation:
  language: ig
  text: Ma anatala m ihe niile[a], enwekwara m karịa ihe m chọrọ. Ejuwo m afọ, ebe m natara n’aka Epafrọditọs ihe sitere n’aka unu—ísì ọma, àjà a nabatara, nke na-atọ Chineke ụtọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma eleghị anya: “Enwere m ihe niile n’uju,” ma ọ bụ “Anatala m ụgwọ zuru ezu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχω
  choice: anatala m
  rationale: Ngwaa a nwere ike ịpụta ịnara ihe n’uju ma ọ bụ ịnata ụgwọ zuru ezu. “Anatala m” dabara n’ọnọdụ onyinye nkwado a ma ghara ime ka echiche azụmahịa pụta karịa ka ederede Gris si kwuo.
- source_word: πάντα
  choice: ihe niile unu zitere
  rationale: “Ihe niile” na-egosi mkpokọta onyinye ahụ; “unu zitere” na-eme ka ihe a na-ekwu doo anya n’Igbo, dịka ahịrịokwu ndị so ya na-egosi na ihe ahụ si n’aka ndị Filipaị.
- source_word: περισσεύω
  choice: enweekwa m karịa ihe ga-ezuru m
  rationale: Nke a na-egosi ụba karịrị naanị izu oke, ma bụrụ okwu Igbo nkịtị ma doo anya.
- source_word: πεπλήρωμαι
  choice: ezuola m oke
  rationale: Oge perfect nke Gris na-egosi ọnọdụ Pọl nọ na ya ugbu a n’ihi onyinye ahụ. Nhọrọ a na-egosi na e nyere ya ihe zuru ya n’uju.
- source_word: δεξάμενος
  choice: ebe m natara
  rationale: Nke a na-egosi ọnọdụ ma ọ bụ ihe kpatara o ji nwee ihe zuru ezu, na-enweghị ịkọwapụta njikọ oge karịa ihe participle ahụ kwuru.
- source_word: παρὰ Ἐπαφροδίτου
  choice: n’aka Epafrọditọs
  rationale: Nke a na-egosi Epafrọditọs dịka onye Pọl si n’aka ya nata onyinye ahụ, ebe okwu na-esote na-egosi na ọ bụ ndị Filipaị zitere ya.
- source_word: τὰ παρ’ ὑμῶν
  choice: ihe si n’aka unu bịa
  rationale: Ọ na-edobe ndị a na-agwa okwu dịka ndị onyinye ahụ sitere n’aka ha, n’asụsụ Igbo dị mfe ma kwekọọ na Gris.
- source_word: ὀσμὴν εὐωδίας
  choice: ihe na-esi ísì ụtọ
  rationale: Ọ na-edobe onyonyo ísì ọma nke àjà, nke nwere mgbọrọgwụ n’asụsụ ofufe Agba Ochie, ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: θυσίαν δεκτήν
  choice: àjà a na-anabata
  rationale: Ọ na-echekwa okwu àjà na echiche na a nabatara ya, na-enweghị ime ka onye na-anabata ya doo anya karịa usoro Gris; okwu na-esote na-ejikọta ya na Chineke.
- source_word: εὐάρεστον τῷ θεῷ
  choice: nke na-atọ Chineke ụtọ
  rationale: Ọ na-egosi na Chineke nwere mmasị n’onyinye ahụ, n’asụsụ Igbo dị ugbu a, dị ùgwù, ma doo anya.
theological_decisions:
- issue: Onyonyo àjà e ji kọwaa onyinye ego ndị Filipaị
  choice: 'E debe usoro onyonyo ofufe ahụ: “ihe na-esi ísì ụtọ, àjà a na-anabata nke na-atọ Chineke ụtọ.”'
  alternative: Ịsụgharị ya naanị dịka onyinye Chineke ji obi ụtọ nabata, ma wepụ okwu ísì ụtọ na àjà.
  rationale: Pọl kpachaara anya jiri asụsụ àjà na ofufe kọwaa nkwado ha. Idebe ísì ụtọ, àjà a na-anabata, na ihe na-atọ Chineke ụtọ na-echekwa ike nkà mmụta okpukpe nke ederede ahụ n’etinyeghị ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “karịa ihe ga-ezuru m” na “ezuola m oke” kewaa echiche περισσεύω na πεπλήρωμαι. E debere onyonyo àjà ahụ n’uju.
