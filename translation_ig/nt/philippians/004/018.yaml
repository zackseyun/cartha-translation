revisions:
- from: Ma anatala m ihe niile unu zitere[a], enweekwa m karịa ihe ga-ezuru m. Ugbu a, ezuola m oke, ebe m natara n’aka Epafrọditọs ihe si n’aka unu bịa—ihe na-esi ísì ụtọ, àjà a na-anabata nke na-atọ Chineke ụtọ.
  to: Ma anatala m ihe niile[a], enwekwara m karịa ihe m chọrọ. Ejuwo m afọ, ebe m natara n’aka Epafrọditọs ihe sitere n’aka unu—ísì ọma, àjà a nabatara, nke na-atọ Chineke ụtọ.
  rationale: The revision follows ἀπέχω πάντα without anticipating the later identification of the gift, preserves περισσεύω as abundance beyond need, and renders πεπλήρωμαι with an idiomatic expression of completed fullness. It also sharpens the sacrificial imagery by using “ísì ọma” while retaining the source’s three coordinated descriptions of the Philippians’ gift.
