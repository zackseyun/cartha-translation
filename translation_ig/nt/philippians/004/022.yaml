revisions:
- from: Ndị nsọ niile na-ekele unu, karịsịa ndị si n’ezinụlọ Siza.[a]
  to: Ndị nsọ niile na-ekele unu, ma karịsịa ndị si n’ụlọ Siza.[a]
  rationale: The revision changes only the rendering of Caesar’s οἰκία from “ezinụlọ” (family) to “ụlọ” (household). This preserves the source’s broader, historically appropriate reference while retaining its deliberate lack of specificity about the persons’ exact roles or status. Adding “ma” represents the mild connective δέ naturally without altering the emphasis conveyed by “karịsịa.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the greeting, the comprehensive scope of πάντες, the Pauline term “saints,” the emphasis of μάλιστα δέ, and the name/title “Caesar.” However, “ezinụlọ Siza” ordinarily denotes Caesar’s family/relatives and therefore narrows οἱ ἐκ τῆς Καίσαρος οἰκίας, which refers more broadly to persons associated with the imperial household.
  naturalness: “Ndị nsọ niile na-ekele unu” and “karịsịa” are natural Standard Igbo in a respectful epistolary register. Replacing “ezinụlọ Siza” with “ụlọ Siza” avoids the familial implication while remaining concise and idiomatic in context.
  terminology: “Ndị nsọ” appropriately preserves the established Pauline designation without implying an elite class. “Siza” retains the historically specific Greek designation. “Ụlọ Siza” is preferable to “ezinụlọ Siza” for the imperial household.
  issues:
  - severity: medium
    issue: “ndị si n’ezinụlọ Siza” restricts Caesar’s household to his family.
    rationale: Igbo “ezinụlọ” normally means family or kinship group. The Greek οἰκία here can include household personnel and others connected with the imperial establishment, not merely blood relatives.
  - severity: low
    issue: The footnote’s alternative repeats the same overly narrow familial wording.
    rationale: Because “ụlọ eze ukwu” is used in the explanation, the main wording and alternative should likewise distinguish the household from Caesar’s blood family.
  revised_text: Ndị nsọ niile na-ekele unu, ma karịsịa ndị si n’ụlọ Siza.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nke ụlọ Siza.” Okwu a na-ekwu banyere ndị metụtara ụlọ ọchịchị Siza, ọ bụghị naanị ndị ikwu Siza n’ọbara.
    reason: lexical_alternative
  revision_rationale: The revision changes only the rendering of Caesar’s οἰκία from “ezinụlọ” (family) to “ụlọ” (household). This preserves the source’s broader, historically appropriate reference while retaining its deliberate lack of specificity about the persons’ exact roles or status. Adding “ma” represents the mild connective δέ naturally without altering the emphasis conveyed by “karịsịa.”
