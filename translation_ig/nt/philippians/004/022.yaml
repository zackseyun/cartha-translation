  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάζονται ὑμᾶς πάντες οἱ ἅγιοι, μάλιστα δὲ οἱ ἐκ τῆς Καίσαρος οἰκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/022.yaml
  text: All the saints greet you[a], especially those of Caesar’s household.
translation:
  language: ig
  text: Ndị nsọ niile na-ekele unu, ma karịsịa ndị si n’ụlọ Siza.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nke ụlọ Siza.” Okwu a na-ekwu banyere ndị metụtara ụlọ ọchịchị Siza, ọ bụghị naanị ndị ikwu Siza n’ọbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζονται
  choice: na-ekele
  rationale: Nke a bụ okwu a na-ejikarị eziga ekele n’akwụkwọ ozi; “na-ekele” bụ okwu Igbo doro anya ma dịkwa n’okike.
- source_word: πάντες οἱ ἅγιοι
  choice: Ndị nsọ niile
  rationale: “Ndị nsọ” na-echekwa aha Pọl na-akpọ ndị kwere ekwe, kama ịgbasa ya dịka “ndị Chineke.”
- source_word: μάλιστα δὲ
  choice: karịsịa
  rationale: Ọ na-egosi otu ìgwè e mesiri ike n’etiti ìgwè ahụ niile; “karịsịa” na-enye echiche ahụ nke ọma.
- source_word: οἱ ἐκ τῆς Καίσαρος οἰκίας
  choice: ndị si n’ezinụlọ Siza
  rationale: “Si n’ezinụlọ Siza” na-egosipụta ἐκ τῆς ... οἰκίας n’enweghị ikwu na ha bụcha ndị ikwu Siza n’ọbara.
- source_word: Καίσαρος
  choice: Siza
  rationale: Ọ na-echekwa aha/utu aha ọchịchị dị na Grik kama iji nkọwa sara mbara dịka “eze ukwu.”
theological_decisions:
- issue: Ihe “ndị nsọ” pụtara n’ojiji Pọl
  choice: E ji “ndị nsọ” mee aha ndị kwere ekwe niile.
  alternative: Ndị Chineke; ndị kwere ekwe
  rationale: Nsụgharị a na-echekwa okwu Pọl ma ghara ime ka ọ bụrụ naanị aha ìgwè pụrụ iche nke Ndị Kraịst kacha dị nsọ.
- issue: Ndị a kpọrọ “ndị si n’ezinụlọ Siza” bụ ndị ole
  choice: Ndị ha na ụlọ eze ukwu nwere njikọ, n’enweghị ịkọwa ụdị njikọ ahụ.
  alternative: Ndị ikwu Siza n’ọbara
  rationale: Okwu Grik nwere ike ịgụnye ndị ọrụ, ndị ohu, ndị e mere onwe ha, ma ọ bụ ndị ọzọ jikọrọ ụlọ ọchịchị; amaokwu ahụ ekwughị na ha bụ ndị ezinụlọ ya n’ọbara.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere “ndị nsọ” maka nkwekọrịta okwu na izi ezi nke nkà mmụta okpukpe; “Siza” na-echekwa aha/utu aha akụkọ ihe mere eme.
