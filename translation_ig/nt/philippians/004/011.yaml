    rationale: Although it can indicate want, it is less explicit than the Greek phrase’s reference to personal lack or need and is less suitable in this formal epistolary context.
  - severity: low
    issue: “Inwe afọ ojuju” is less natural than “ịdị afọ ojuju” for the adjectival predicate αὐτάρκης.
    rationale: The revised infinitival phrase directly expresses ‘to be content’ in idiomatic Standard Igbo.
