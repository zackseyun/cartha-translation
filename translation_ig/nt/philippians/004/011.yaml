  text: οὐχ ὅτι καθ’ ὑστέρησιν λέγω, ἐγὼ γὰρ ἔμαθον ἐν οἷς εἰμι αὐτάρκης εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/004/011.yaml
  text: Not that I am speaking from need[a], for I have learned to be content in whatever circumstances I am in.
translation:
  language: ig
  text: Ọ bụghị na m na-ekwu nke a n’ihi na m nọ ná mkpa[a]; n’ihi na amụtala m ịdị afọ ojuju n’ọnọdụ ọ bụla m nọ na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi ụkọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ὑστέρησιν
  choice: n’ihi na ihe na-akọ m
  rationale: Nkebiokwu a na-egosi ụkọ ma ọ bụ mkpa onwe onye dị ka ihe ga-akpali okwu ahụ. Nke a bụ ụzọ Igbo nkịtị si ekwu na mmadụ enweghị ihe dị ya mkpa.
- source_word: λέγω
  choice: m na-ekwu
  rationale: Ụdị a na-egosi okwu Pọl na-ekwu ugbu a n’ụzọ dabara adaba n’Igbo.
- source_word: ἔμαθον
  choice: amụtala m
  rationale: Oge ngwaa a na-arụtụ aka n’ihe ọ mụtara nke ka na-emetụta ọnọdụ ya ugbu a; ụdị mmezu a na-egosipụta nke ahụ nke ọma n’Igbo.
- source_word: ἐν οἷς εἰμι
  choice: n’ọnọdụ ọ bụla m nọ na ya
  rationale: Nkebiokwu ahụ na-ekwu banyere ọnọdụ dị iche iche mmadụ nwere ike ịnọ na ha, ọ bụghị naanị ebe ọ nọ.
- source_word: αὐτάρκης
  choice: inwe afọ ojuju
  rationale: N’ebe a, okwu ahụ na-egosi na Pọl amụtala ịdị na-eju ya afọ n’agbanyeghị ọnọdụ ya. Nhọrọ a na-ezere ime ka isi okwu bụrụ na ọ dabere naanị n’ike onwe ya.
theological_decisions:
- issue: Nkọwa echiche nkà ihe ọmụma nwere ike ịdị na αὐτάρκης
  choice: inwe afọ ojuju
  alternative: izuru onwe ya
  rationale: Ihe gbara amaokwu a gburugburu na-akọwa ọnọdụ Pọl mụtara ịnọ na ya n’agbanyeghị mgbanwe dị iche iche. “Inwe afọ ojuju” dabara n’ebe a ma ghara ikwusi ike na mmadụ adịghị mkpa onye ọzọ; e debere nhọrọ ọzọ n’ala ala peeji.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. A họọrọ “ihe na-akọ m” ka ọ bụrụ okwu ndị mmadụ na-aghọta ngwa ngwa, ebe “n’ihi ụkọ” dị n’ala ala peeji iji chekwaa ụzọ ọzọ e si akọwa καθ’ ὑστέρησιν.
