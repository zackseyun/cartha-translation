review_pass:
  verdict: revise
  source_fidelity: The draft conveys the main sense accurately, but “ihe na-akọ m” is less direct and can sound colloquial or contextually vague for καθ’ ὑστέρησιν. “M nọ ná mkpa” clearly expresses Paul’s personal need/lack. The semicolon more naturally marks the Greek’s transition to the explanatory clause.
  naturalness: “Ịdị afọ ojuju” is the more idiomatic predicate construction for ‘to be content’ than “inwe afọ ojuju” in this setting. The revised wording is clear, modern Standard Igbo, and retains the source’s restrained register.
  terminology: “Ná mkpa” faithfully renders speaking from personal need. “Ịdị afọ ojuju” appropriately renders αὐτάρκης contextually without asserting autonomous self-sufficiency. The lexical alternative ‘n’ihi ụkọ’ is retained in the footnote.
  issues:
