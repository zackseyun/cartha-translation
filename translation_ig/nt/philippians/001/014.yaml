  source_fidelity: A chọrọ idozi “Ọtụtụ n’ime” ka ọ bụrụ “Ihe ka ọtụtụ n’ime,” n’ihi na πλείονας ebe a pụtara “most/the greater number,” ọ bụghị naanị “many.” A ga-ejikọtakwa ἐν κυρίῳ n’ụzọ doro anya na obi siri ha ike, kama ka ọ dị ka ọ na-akọwa ụmụnna naanị ha.
  naturalness: 'Ahịrịokwu mbụ nwere nhazi na-adịghị asọ nke ọma: “ụmụnna nọ n’ime Onyenwe anyị, ebe ọ bụ na...” Nhazi emezigharịrị na-eme ka njikọ dị n’etiti agbụ Pọl, obi siri ha ike n’ime Onyenwe anyị, na ikwu okwu n’atụghị egwu doo anya. E meziekwara nkọwa ala peeji ka ọ bụrụ Standard Igbo na-asọ asọ.'
  terminology: “Onyenwe anyị,” “agbụ m,” “obi sie ha ike,” “okwu ahụ,” na “n’atụghị egwu” na-edobe isi ihe Grik nke ọma. “Ụmụnna” kwesịrị ịdị n’ahịrịokwu; nkọwa ala peeji na-akọwa na o yikarịrị ka ọ gụnyere ndị kwere ekwe ibe ha n’ozuzu.
