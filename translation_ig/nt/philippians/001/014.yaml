revisions:
- from: Ọtụtụ n’ime ụmụnna[a] nọ n’ime Onyenwe anyị, ebe ọ bụ na agbụ m emewo ka obi sie ha ike, na-enwekwu obi ike ikwu okwu ahụ n’atụghị egwu.
  to: Ihe ka ọtụtụ n’ime ụmụnna[a], ndị agbụ m mere ka obi sie ha ike n’ime Onyenwe anyị, na-enwekwu obi ike ikwu okwu ahụ n’atụghị egwu.
  rationale: E dochiela “Ọtụtụ n’ime” anya na “Ihe ka ọtụtụ n’ime” iji gosipụta ike πλείονας. E degharịrị nhazi ahịrịokwu ka “n’ime Onyenwe anyị” kọwaa obi siri ụmụnna ahụ ike, ebe “agbụ m” na-egosi ihe kpatara obi ike ha. A hapụrụ “okwu ahụ” n’enweghị ịgbakwunye “nke Chineke,” ma debe ọdịiche dị n’etiti inwe obi ike (τολμᾶν) na enweghị egwu (ἀφόβως).
