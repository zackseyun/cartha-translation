  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τοὺς πλείονας τῶν ἀδελφῶν ἐν κυρίῳ πεποιθότας τοῖς δεσμοῖς μου περισσοτέρως τολμᾶν ἀφόβως τὸν ⸀λόγον λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/014.yaml
  text: And most of the brothers[a], having become confident in the Lord because of my chains, dare all the more to speak the word fearlessly.
translation:
  language: ig
  text: Ihe ka ọtụtụ n’ime ụmụnna[a], ndị agbụ m mere ka obi sie ha ike n’ime Onyenwe anyị, na-enwekwu obi ike ikwu okwu ahụ n’atụghị egwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị”; o yikarịrị ka n’ebe a okwu a na-ezo aka n’ebe ndị kwere ekwe ibe ha nọ n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονας
  choice: Ọtụtụ n’ime
  rationale: N’ihi na okwu a nwere article tinyere partitive genitive, ọ pụtara ọtụtụ ma ọ bụ ihe ka n’ọnụ ọgụgụ n’ime ụmụnna, ọ bụghị nanị ‘ndị ọzọ karịa.’
- source_word: ἀδελφῶν
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo kwekọrọ n’ụzọ ebumpụta ụwa na plural ἀδελφῶν; ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị bụ ndị kwere ekwe, ya mere e tinyere nkọwa n’ala peeji.
- source_word: ἐν κυρίῳ
  choice: nọ n’ime Onyenwe anyị
  rationale: E chekwara okwu Pọl a dịka ọ dị, ma jikọta ya na ndị ụmụnna ka Igbo wee bụrụ nke doro anya, ebe ntụkwasị obi ha ka sitere n’ọnọdụ ha n’ime Onyenwe anyị.
- source_word: πεποιθότας
  choice: obi sie ha ike
  rationale: Perfect participle na-egosi ọnọdụ ntụkwasị obi siri ike nke sitere n’ihe mere tupu ya; ‘obi sie ha ike’ na-enye echiche ahụ n’Igbo nkịtị.
- source_word: τοῖς δεσμοῖς μου
  choice: agbụ m emewo ka
  rationale: ‘Agbụ m’ na-edobe ihe oyiyi kpọmkwem nke δεσμοί, ebe nhazi ‘emewo ka’ na-egosipụta mmetụta ma ọ bụ ihe kpatara obi ji sie ha ike.
- source_word: περισσοτέρως
  choice: na-enwekwu
  rationale: Nke a na-egosipụta echiche comparative nke ‘karịsịa’ ma ọ bụ ‘ọbụna karịa’ n’ụzọ Igbo na-asọ asọ.
- source_word: τολμᾶν
  choice: obi ike
  rationale: N’usoro ‘na-enwekwu obi ike,’ okwu a na-egosi mkpebi siri ike na nkwuwa okwu ime ihe ahụ.
- source_word: ἀφόβως
  choice: n’atụghị egwu
  rationale: Nke a na-edobe kpọmkwem echiche nke enweghị egwu, kama iji okwu sara mbara dịka ‘n’atụghị ụjọ’ ma ọ bụ ‘n’ike.’
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: Nke a na-edobe article na λόγος n’enweghị ịgbakwụnye ‘nke Chineke,’ nke adịghị n’ederede Grik, ọ bụ ezie na ihe a na-ekwu bụ ozi ọma.
- source_word: λαλεῖν
  choice: ikwu
  rationale: ‘Ikwu’ bụ nsụgharị nkịtị na nke ziri ezi maka ngwaa izugbe λαλεῖν, n’enweghị ime ka ọ bụrụ ‘ikwusa’ nke siri ike karịa isi mmalite.
theological_decisions:
- issue: Ókè ndị ἀδελφῶν na-ezo aka na ha
  choice: E jiri ‘ụmụnna’ mee ihe n’ahịrịokwu, tinyekwa nkọwa na ọ pụrụ ịgụnye ụmụ nwoke na ụmụ nwanyị ndị kwere ekwe.
  alternative: ‘ụmụnne nwoke’ ma ọ bụ ‘ndị kwere ekwe’
  rationale: Ụdị Grik bụ masculine plural, ma ‘ụmụnna’ n’Igbo bụ okwu ezinụlọ sara mbara nke dabara nke ọma n’ebe a ma nwee ike ịgụnye ọgbakọ ndị kwere ekwe dum; nkọwa ala peeji na-eme ka nke a pụta ìhè.
- issue: Njikọ ἐν κυρίῳ na πεποιθότας
  choice: A ghọtara ‘n’ime Onyenwe anyị’ dịka ọnọdụ ndị ụmụnna na ntọala obi ike ha, ebe agbụ Pọl bụ ihe kpaliri obi ike ahụ.
  alternative: ‘Onyenwe anyị mere ka obi sie ha ike site n’agbụ m’
  rationale: Nhazi Grik nwere ike ibute obere mgbagwoju anya n’ihe ἐν κυρίῳ jikọrọ na ya. Nsụgharị a na-edobe okwu ahụ n’enweghị ime ka Onyenwe anyị bụrụ onye na-eme ihe kpọmkwem karịa ka ederede kwuru.
translation_notes:
  register: Asụsụ bụ Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E debere ihe oyiyi ‘agbụ,’ okwu Pọl ‘n’ime Onyenwe anyị,’ na ọdịiche dị n’etiti inwe obi ike na ikwu okwu n’atụghị egwu.
