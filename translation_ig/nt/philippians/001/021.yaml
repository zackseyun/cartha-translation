id: PHP.1.21
reference: Philippians 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐμοὶ γὰρ τὸ ζῆν Χριστὸς καὶ τὸ ἀποθανεῖν κέρδος.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/021.yaml
  text: For to me[a], to live is Christ, and to die is gain.
translation:
  language: ig
  text: N’ihi na n’ebe m nọ, ịdị ndụ bụ Kraịst[a], ịnwụ anwụ bụkwa uru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mezaịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμοὶ
  choice: n’ebe m nọ
  rationale: 'Nke a na-egosipụta echiche Pọl nke onwe ya n’ụzọ Igbo dị mfe ma doo anya: ‘n’ebe m nọ’ ma ọ bụ ‘maka m.’'
- source_word: γὰρ
  choice: N’ihi na
  rationale: Okwu a na-ejikọta amaokwu a na echiche gara aga dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: τὸ ζῆν
  choice: ịdị ndụ
  rationale: Infinitive a e ji dịka aha ka e si tụgharị ya n’ụzọ na-adịkarị n’Igbo, ma ọ na-edobe ndakọrịta ya na ‘ịnwụ anwụ.’
- source_word: Χριστὸς
  choice: Kraịst
  rationale: ‘Kraịst’ bụ ụdị a maara nke ọma n’Igbo, ọ pụkwara ịrụ ọrụ dịka utu aha na dịka aha a na-eji akpọ Jizọs; e debere ‘Mezaịa’ dịka nhọrọ n’okpuru peeji.
- source_word: τὸ ἀποθανεῖν
  choice: ịnwụ anwụ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ nke nkịtị maka ‘to die,’ ma na-edobe usoro ahịrịokwu ahụ na ‘ịdị ndụ.’
- source_word: κέρδος
  choice: uru
  rationale: ‘Uru’ na-enye echiche nke ihe mmadụ ritere ma ọ bụ ihe baara ya uru, n’enweghị ụda azụmahịa siri ike.
theological_decisions:
- issue: Ma Χριστός ebe a ọ bụ utu aha ‘Mezaịa’ ka ọ bụ aha a na-eji akpọ Jizọs
  choice: Kraịst
  alternative: Mezaịa
  rationale: N’okwu Pọl a dị mkpirikpi, Χριστός nwere ike ịdị ka aha a na-eji akpọ Jizọs, ma ike ya dịka utu aha ka dị; ya mere a debere nhọrọ ‘Mezaịa’ n’okpuru peeji kama idozi nghọta ahụ kpamkpam.
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere mkpụmkpụ na ndakọrịta nke okwu Grik ahụ: ‘ịdị ndụ … ịnwụ anwụ,’ tinyere nkwupụta Pọl nke onwe ya.'
