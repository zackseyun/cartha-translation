  to: 'Gịnịzi? Naanị nke a: n’ụzọ ọ bụla, ma ọ bụ dị ka ihe ngọpụ, ma ọ bụ n’eziokwu, a na-ekwusa Mesaịa. Ana m aṅụrị ọṅụ n’ihi nke a; m ga-aṅụrịkwa ọṅụ.'
