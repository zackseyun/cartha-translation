id: PHP.1.18
reference: Philippians 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί γάρ; πλὴν ⸀ὅτι παντὶ τρόπῳ, εἴτε προφάσει εἴτε ἀληθείᾳ, Χριστὸς καταγγέλλεται, καὶ ἐν τούτῳ χαίρω· ἀλλὰ καὶ χαρήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/018.yaml
  text: What then? Only that in every way[a], whether in pretense or in truth, Messiah is being proclaimed, and in this I rejoice. Yes[b], and I will rejoice.
translation:
  language: ig
  text: 'Gịnịzi? Naanị nke a: n’ụzọ ọ bụla, ma ọ bụ dị ka ihe ngọpụ, ma ọ bụ n’eziokwu, a na-ekwusa Mesaịa. Ana m aṅụrị ọṅụ n’ihi nke a; m ga-aṅụrịkwa ọṅụ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γάρ
  choice: Gịnịzi?
  rationale: Na-edobe ajụjụ mkpirikpi Pọl ji tụgharịa okwu ya gaa ná nkwubi okwu, n’etinyeghị nkọwa ọzọ.
- source_word: πλὴν ὅτι
  choice: 'Naanị nke a:'
  rationale: Na-egosipụta na ihe Pọl lekwasịrị anya bụ eziokwu na-esochi ya, ma bụrụkwa Igbo doro anya.
- source_word: παντὶ τρόπῳ
  choice: n’ụzọ ọ bụla
  rationale: Na-echekwa echiche nke ‘n’ụzọ niile’ ma ọ bụ ‘n’ụzọ ọ bụla’ n’ụdị Igbo e ji eme ihe ugbu a.
- source_word: προφάσει
  choice: dị ka ihe ngọpụ
  rationale: Na-echekwa echiche nke pretext ma ọ bụ ihe e ji ekpuchi ebumnobi n’ebughị ụzọ kọwaa kpọmkwem ụdị ebumnobi ọjọọ ahụ.
- source_word: ἀληθείᾳ
  choice: n’eziokwu
  rationale: Na-edobe okwu ahụ n’ụzọ kpọmkwem ma chekwaa ọdịiche ya na προφάσει.
- source_word: Χριστὸς
  choice: Mesaịa ahụ
  rationale: Χριστός bụ aha-ọkwa n’ebe a, ya mere ‘Mesaịa’ na-egosipụta ihe aha-ọkwa Grik ahụ pụtara; ihe ngosi ‘ahụ’ na-eme ka ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa.
- source_word: καταγγέλλεται
  choice: a na-ekwusa
  rationale: Na-echekwa passive na present aspect nke nkwusa a na-aga n’ihu, ma jiri okwu Igbo a na-aghọta nke ọma maka nkwusa ọha.
- source_word: ἐν τούτῳ χαίρω
  choice: Ana m aṅụrị ọṅụ n’ihi nke a
  rationale: Igbo ebumpụta ụwa na-ejikọta ọṅụ Pọl na eziokwu ahụ e kwuru n’ihu, n’agbanyeghị na nhazi okwu gbanwere ntakịrị.
- source_word: ἀλλὰ καὶ χαρήσομαι
  choice: m ga-aṅụrịkwa ọṅụ
  rationale: Na-echekwa future na additive καί; ‘-kwa’ na-eburu echiche nke ‘ọzọkwa,’ ebe njikọ semikolon na-eme ka Igbo ahụ ghara ịdị arọ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ bụ aha-ọkwa nke onye a na-ekwusa, ya mere ‘Mesaịa’ na-eme ka ihe Χριστός pụtara pụta ìhè kama iji transliteration nke aghọwo aha yiri aha mmadụ.
- issue: Ihe bụ isi iyi ọṅụ Pọl
  choice: Ejikọtara ‘n’ihi nke a’ na nkwusa Mesaịa ahụ
  alternative: Ịhapụ ‘n’ime nke a’ ka ọ bụrụ ntụaka sara mbara
  rationale: ἐν τούτῳ na-ezo aka n’eziokwu e kwuru ozugbo n’ihu—na a na-ekwusa Mesaịa ahụ—ma nsụgharị ahụ anaghị ekwu na Pọl kwadoro ebumnobi ụgha nke ụfọdụ ndị nkwusa.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E zere okwu ụka pụrụ iche na nkọwa nke ga-ekpebi ihe odide ahụ karịa ka Grik si kwuo. Akara ụda dị mkpa dị na ‘aṅụrị’ na ‘ọṅụ’ iji mee ka ọgụgụ doo anya.
