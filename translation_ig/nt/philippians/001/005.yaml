id: PHP.1.5
reference: Philippians 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπὶ τῇ κοινωνίᾳ ὑμῶν εἰς τὸ εὐαγγέλιον ἀπὸ ⸀τῆς πρώτης ἡμέρας ἄχρι τοῦ νῦν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/005.yaml
  text: because of your partnership in the gospel from the first day until now,[a]
translation:
  language: ig
  text: n’ihi òkè unu n’oziọma ahụ site n’ụbọchị mbụ ruo ugbu a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka oziọma ahụ.” Akpaokwu Grik ahụ nwere ike igosi ma na oziọma ahụ bụ ihe ha na-ekere òkè na ya, ma ọ bụ na ọ bụ ebumnuche òkè ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ
  choice: n’ihi
  rationale: Ya na dative τῇ κοινωνίᾳ, ọ na-egosi ihe mere Pọl ji ekele Chineke n’ahịrịokwu gbara ya gburugburu; “n’ihi” na-egosipụta nke a nke ọma n’Igbo.
- source_word: κοινωνίᾳ
  choice: ịdị n’otu
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ịkekọrịta na isonye n’ọrụ oziọma, ọ bụghị naanị mmekọrịta enyi. “Ịdị n’otu” bụ okwu Igbo dị mfe ma na-egosi njikọ na òkè ha nwere ọnụ.
- source_word: ὑμῶν
  choice: unu
  rationale: Genitive a na-egosi na ndị Filipaị bụ ndị sonyere n’ịdị n’otu ahụ.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: n’oziọma ahụ
  rationale: Akpaokwu Greek a nwere ike igosi ebe ma ọ bụ ihe jikọrọ òkè ha nwere ọnụ, ma ọ bụ ebumnuche ya. Nsụgharị isi na-agụ ya dị ka isonye ha n’ihe metụtara oziọma, ebe nkọwa ala peeji na-echekwa nghọta nke ebumnuche.
- source_word: εὐαγγέλιον
  choice: oziọma
  rationale: “Oziọma” bụ okwu a maara nke ọma n’Igbo maka εὐαγγέλιον ma na-echekwa ịdị arọ ya n’akwụkwọ Pọl.
- source_word: ἀπὸ τῆς πρώτης ἡμέρας
  choice: site n’ụbọchị mbụ
  rationale: Ọ na-egosi oge òkè ndị Filipaị malitere.
- source_word: ἄχρι τοῦ νῦν
  choice: ruo ugbu a
  rationale: Ọ na-egosi na òkè ahụ gara n’ihu ruo n’oge Pọl na-ede akwụkwọ ozi a.
theological_decisions:
- issue: Ma εἰς τὸ εὐαγγέλιον ọ̀ na-egosi mpaghara òkè ha ma ọ bụ ebumnuche ya
  choice: n’oziọma ahụ
  alternative: maka oziọma ahụ
  rationale: Greek nwere ike ibu nghọta abụọ a. E tinyere otu n’ahụ amaokwu ma debe nke ọzọ na nkọwa ala peeji ka a ghara idozi ihe isi mmalite hapụrụ ka ọ nwee nghọta abụọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma nwee ugwu. E ji “ịdị n’otu” zere okwu na-egosi naanị mmetụta enyi, ma mee ka òkè ha na-ekere n’oziọma pụta ìhè. Akara nkọwa [a] dị n’ahụ amaokwu.
