  text: εἰ δὲ τὸ ζῆν ἐν σαρκί, τοῦτό μοι καρπὸς ἔργου— καὶ τί αἱρήσομαι οὐ γνωρίζω·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/022.yaml
  text: But if to go on living in the flesh means fruitful labor for me[b][a], yet which I will choose I do not know.
translation:
  language: ig
  text: Ma ọ bụrụ na ịnọgide na-adị ndụ n’anụ ahụ[a] pụtara ọrụ na-amị mkpụrụ[b] nye m, ma nke m ga-ahọrọ, amaghị m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mkpụrụ nke ọrụ” ma ọ bụ “ọrụ na-amị mkpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ζῆν
  choice: ịnọgide na-adị ndụ
  rationale: Nkebi a na-ekwu maka ịga n’ihu ná ndụ ugbu a; ntụgharị a na-egosi ịdịgide ndụ n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἐν σαρκί
  choice: n’anụ ahụ
  rationale: N’ebe a, σάρξ na-ezo aka ná ndụ mmadụ n’ahụ n’ụwa, ọ bụghị n’ọdịdị mmehie. “N’anụ ahụ” na-edobe okwu Pọl ji ma na-eme ka ihe ọ na-ekwu doo anya.
- source_word: καρπὸς ἔργου
  choice: ọrụ na-amị mkpụrụ
  rationale: Okwu Grik a dị mkpirikpi ma nwee ike ịpụta “mkpụrụ nke ọrụ.” “Ọrụ na-amị mkpụrụ” bụ Igbo dị ndụ nke na-egosi ọrụ bara uru n’emebighị ihe atụ nke mkpụrụ.
- source_word: αἱρήσομαι
  choice: m ga-ahọrọ
  rationale: Okwu a na-egosi ịhọrọ otu n’ime ụzọ abụọ Pọl na-atụle.
- source_word: οὐ γνωρίζω
  choice: amaghị m
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na Pọl ejighị n’aka nke ọ ga-ahọrọ; “amaghị m” bụ ntụgharị Igbo kachasị mfe ma kwekọọ n’echiche ahụ.
theological_decisions:
- issue: Ihe σάρξ pụtara n’amaokwu a
  choice: Ndụ mmadụ n’ahụ n’ụwa (“n’anụ ahụ”)
  alternative: Ọdịdị mmehie
  rationale: Ihe gbara amaokwu a gburugburu na-atụnyere ịnọgide ndụ n’ụwa na ịpụ gaa ịnọnyere Kraịst. Ya mere, σάρξ na-ezo aka n’ịdị ndụ n’ahụ, ọ bụghị n’omume ma ọ bụ ọdịdị mmehie.
- issue: Mmekọrịta dị n’etiti τὸ ζῆν ἐν σαρκί na καρπὸς ἔργου
  choice: Ịnọgide ndụ n’anụ ahụ pụtara ọrụ na-amị mkpụrụ nye Pọl
  alternative: Ịnọgide ndụ n’anụ ahụ bụ mkpụrụ nke ọrụ
  rationale: Asụsụ Grik ahụ dị mkpirikpi ma nwee ihe a hapụrụ ka onye na-agụ ya ghọta. Isi ntụgharị a na-enye njikọ kacha kwe omume n’Igbo, ebe ihe odide ala peeji na-edobe ụzọ ọzọ e nwere ike isi ghọta okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ esemokwu dị n’etiti ịnọgide ndụ na ịhọrọ ịpụ, ma zere ime ka σάρξ bụrụ okwu gbasara “ọdịdị mmehie.”
