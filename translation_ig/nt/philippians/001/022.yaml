- from: Ma ọ bụrụ na ịnọgide na-adị ndụ n’anụ ahụ[a] pụtara ọrụ na-amị mkpụrụ[b] nye m, ma amaghị m nke m ga-ahọrọ.
  to: Ma ọ bụrụ na ịnọgide na-adị ndụ n’anụ ahụ[a] pụtara ọrụ na-amị mkpụrụ[b] nye m, ma nke m ga-ahọrọ, amaghị m.
  rationale: 'The revision retains every semantic component of the Greek while making the final clause more idiomatic in Standard Igbo: Paul does not know which option he will choose. Footnote anchors and their lexical alternatives are retained unchanged.'
