revisions:
- from: Ma achọrọ m ka unu mara, ụmụnna m[a], na ihe ndị mere m emeela, n’ezie, ka ozi ọma[b] gaa n’ihu,
  to: Achọrọ m ka unu mara, ụmụnna[a], na ihe ndị dakwasịrị m, n’ezie, emewo ka ozi ọma[b] nwee ọganihu,
  rationale: The revision more closely represents Paul’s broad reference to his circumstances and the good news’ resulting progress, while retaining the unexpected-result nuance of μᾶλλον through “n’ezie.” It uses a natural Standard Igbo vocative without adding a possessive and corrects the explanatory precision of the inclusive-reference footnote. Both required footnote anchors remain attached to their relevant terms.
