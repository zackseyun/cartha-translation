source:
  edition: SBLGNT
  text: Γινώσκειν δὲ ὑμᾶς βούλομαι, ἀδελφοί, ὅτι τὰ κατ’ ἐμὲ μᾶλλον εἰς προκοπὴν τοῦ εὐαγγελίου ἐλήλυθεν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/012.yaml
  text: I want you to know[a], brothers, that what has happened to me has actually advanced the good news[b],
translation:
  language: ig
  text: Achọrọ m ka unu mara, ụmụnna[a], na ihe ndị dakwasịrị m, n’ezie, emewo ka ozi ọma[b] nwee ọganihu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ụmụnna nwoke na ụmụnna nwanyị; okwu Grik ahụ dị n’ụdị nwoke, ma n’ebe a ọ pụrụ izo aka n’ọgbakọ ndị kwere ekwe niile.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, oziọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκειν ... βούλομαι
  choice: achọrọ m ka unu mara
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji nkwanye ùgwù ekwupụta na onye dere akwụkwọ chọrọ ime ka ndị na-agụ ya mata otu ihe.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a, δέ na-egosi ngafe dị nro gaa n’isiokwu ọzọ, ọ bụghị nnukwu mmegide; “Ma” na-edobe njikọ ahụ n’ebughị ihe ọzọ a na-adịghị n’isi mmalite bata.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: “Ụmụnna” bụ okwu nkịtị na nke ugwu n’Igbo maka ndị nọ n’otu ezinụlọ ma ọ bụ obodo okwukwe; “m” na-eme ka ụdị ịkpọ oku Pọl ji mee ihe daa nke ọma n’Igbo.
- source_word: τὰ κατ’ ἐμὲ
  choice: ihe ndị mere m
  rationale: Nkebiokwu a na-ezo aka n’ọnọdụ na ihe ndị dakwasịrị Pọl n’ozuzu. Nsụgharị a doro anya ma ghara ịkọwapụta kpọmkwem ihe odide Grik hapụrụ n’ogo sara mbara.
- source_word: μᾶλλον
  choice: n’ezie
  rationale: N’ọnọdụ a, okwu ahụ na-egosi nsonaazụ megidere ihe ndị na-agụ akwụkwọ nwere ike ịtụ anya. “N’ezie” na-egosipụta ihe ijuanya ahụ n’enweghị ịtinye nkọwa ọzọ.
- source_word: εἰς προκοπὴν
  choice: ka ... gaa n’ihu
  rationale: Nke a na-egosipụta mmepe ma ọ bụ ịga n’ihu n’asụsụ Igbo dị ndụ, ma na-echekwa echiche mmegharị gaa n’ihu dị na προκοπή.
- source_word: τοῦ εὐαγγελίου
  choice: ozi ọma
  rationale: Nke a na-enye isi ihe εὐαγγέλιον pụtara n’ụzọ onye Igbo nke oge a ga-aghọta ozugbo; ụdị okwu ụka a na-ejikọta ọnụ dị na ndetu ala peeji.
- source_word: ἐλήλυθεν
  choice: emeela ... ka ... gaa n’ihu
  rationale: Ụdị a na-egosipụta na ihe ndị mere n’oge gara aga arụpụtala nsonaazụ nke ka dị ugbu a, dịka perfect tense Grik si mee.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-akpọ naanị ụmụ nwoke ka ọ bụ ọgbakọ niile
  choice: E debere “ụmụnna m” n’ahịrị isi ma kọwaa nghọta sara mbara ya na ndetu ala peeji.
  alternative: “ụmụnna nwoke na ụmụnna nwanyị” n’ahịrị isi
  rationale: Okwu Grik bụ ụdị ọtụtụ nke nwoke, ma n’ụdị ịkpọ ọgbakọ a ọ pụrụ ịgụnye ụmụ nwanyị. Nhọrọ a na-echekwa ọdịdị okwu ahụ ma ghara izochi nghọta nwere ike ịdị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị ugwu, dee ya. A hapụrụ akara njikọ “Ma” iji gosipụta δέ; ahịrịokwu ahụ na-ejedebe na rikoma n’ihi na amaokwu ahụ na-aga n’ihu n’amaokwu na-esote. Akara ndetu [a] dị kpọmkwem n’akụkụ “ụmụnna m,” ebe [b] dị n’akụkụ “ozi ọma.”
