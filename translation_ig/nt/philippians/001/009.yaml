  register: Standard Igbo dị ugwu ma dị mfe nghọta. E jiri ‘ịmata ihe dị iche iche’ mee ka echiche omume na nke bara uru nke αἴσθησις pụta ìhè, n'enweghị itinye nkọwa otu ụka. E debere ihe mgbagwoju anya nke ἐν site na ihe odide bụ isi na nkọwa ala peeji.
