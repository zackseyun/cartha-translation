lexical_decisions:
- source_word: καὶ τοῦτο
  choice: Ana m ... a
  rationale: Ụdị a na-ejikọta amaokwu ahụ na ihe bu ya ụzọ ma na-edobe ike nke τοῦτο n'Igbo dị mfe nghọta.
- source_word: προσεύχομαι
  choice: ekpekwa ekpere
  rationale: Ọ na-egosi ekpere Pọl na-ekpe ugbu a ma na-aga n'ihu; ‘-kwa’ na-edobe njikọ καί.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-ewebata ihe ekpere ahụ chọrọ, ma nwee ike ibu ma ọdịnaya ma nzube dị na ἵνα.
- source_word: ἡ ἀγάπη ὑμῶν
  choice: ịhụnanya unu
  rationale: Nke a bụ nsụgharị nkịtị, doro anya nke na-edobe onye nwe ịhụnanya ahụ n'ụdị ọtụtụ.
- source_word: ἔτι μᾶλλον καὶ μᾶλλον περισσεύῃ
  choice: na-abawanye ụba karịa
  rationale: ‘Na-abawanye ụba’ na-egosi mmụba na-aga n'ihu na echiche nke ịba ụba; ‘karịa’ na-eburu ike nke ἔτι μᾶλλον καὶ μᾶλλον n'Igbo na-adịghị arọ.
- source_word: ἐν ἐπιγνώσει
  choice: na nghọta
  rationale: ‘Nghọta’ bụ okwu Igbo dị ugbu a ma dị mfe, na-egosi ihe ọmụma miri emi n'enweghị ịgbakwunye nkọwa teknụzụ na-adịghị mkpa. Preposition ‘na’ na-edobe njikọ sara mbara nke ἐν.
- source_word: πάσῃ αἰσθήσει
  choice: ikike niile ịmata ihe dị iche iche
  rationale: Nkebiokwu a na-egosi nghọta bara uru nke e ji amata ihe kwesịrị ekwesị, ọ bụghị naanị mmetụta anụ ahụ; ‘niile’ na-anọchi πάσῃ.
