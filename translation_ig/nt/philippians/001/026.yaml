  text: ἵνα τὸ καύχημα ὑμῶν περισσεύῃ ἐν Χριστῷ Ἰησοῦ ἐν ἐμοὶ διὰ τῆς ἐμῆς παρουσίας πάλιν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/026.yaml
  text: so that your boasting in Messiah Jesus may abound because of me through my coming to you again[a][b][c][d].
translation:
  language: ig
  text: ka ịnya isi unu n’ime Mesaya Jizọs wee baa ụba n’ihi m, site n’ọbịbịa m ọzọ n’ebe unu nọ[a][b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ka ịnya isi unu wee baa ụba n’ime Mesaya Jizọs.”'
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ mbụ, ọ bụ “n’ime m”; ihe ọ pụtara n’ebe a nwere ike ịbụ “n’ihi m” ma ọ bụ “n’ihi ihe metụtara m.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị “Mesaya Jizọs” dịka “Kraịst Jizọs.”
    reason: lexical_alternative
  - marker: d
    text: 'Ma ọ bụ: “ka ihe unu ji anya isi n’ime Mesaya Jizọs wee baa ụba n’ihi m, site n’ọbịbịa m ọzọ n’ebe unu nọ.”'
    reason: previous_rendering
lexical_decisions:
- source_word: ἵνα
  choice: ka … wee
  rationale: Usoro a na-egosi nzube ma ọ bụ ihe ga-esi n’okwu bu ya ụzọ pụta, ma bụrụkwa Igbo dị mfe nghọta.
- source_word: καύχημα
  choice: ịnya isi
  rationale: Okwu a nwere ike ịpụta ịnya isi n’onwe ya ma ọ bụ ihe mmadụ ji anya isi. “Ịnya isi” na-edobe nkọwa sara mbara nke okwu Grik ahụ; e nyere nkọwa nke ọzọ n’ala peeji.
- source_word: περισσεύῃ
  choice: baa ụba
  rationale: Nke a na-egosi mmụba ma na-edobe ike nke ụdị ngwaa e ji soro ἵνα.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaya Jizọs
  rationale: “Mesaya” na-egosipụta Χριστός dị ka aha ọkwá, ebe “n’ime” na-edobe njikọ ἐν n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: ἐν ἐμοὶ
  choice: n’ihi m
  rationale: Ọ bụ ezie na nsụgharị nkịtị bụ “n’ime m,” n’ebe a ọ na-egosi na Pọl bụ ihe kpatara ma ọ bụ ihe mere ịnya isi ahụ ji abawanye.
- source_word: διὰ τῆς ἐμῆς παρουσίας
  choice: site n’ịbịakwute unu
  rationale: παρουσία n’ebe a na-ekwu maka Pọl ịbịa ịnọnyere ndị Filipaị ọzọ; “ịbịakwute” bụ okwu Igbo ebumpụta ụwa n’ọnọdụ a.
- source_word: πάλιν πρὸς ὑμᾶς
  choice: ịbịakwute unu ọzọ
  rationale: Nke a na-egosi n’ụzọ doro anya na ọ bụ nletaghachi Pọl na-ekwu maka ya.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: A họọrọ “Mesaya” iji gosi na Χριστός bụ aha ọkwá nke pụtara Onye E Tere Mmanụ, kama ime ka ọ dị naanị ka aha mmadụ.
- issue: Njikọ ἐν Χριστῷ Ἰησοῦ
  choice: E jikọtara ya na “ịnya isi unu”
  alternative: A pụrụ ijikọ ya na “baa ụba”
  rationale: Usoro okwu na otú Pọl si eji okwu “ịnya isi n’ime Mesaya” eme ihe na-akwado njikọ a, ma ihe odide Grik ka nwere ntakịrị ohere maka njikọ nke ọzọ; e debere nke ahụ n’ala peeji.
- issue: Nkọwa καύχημα
  choice: ịnya isi
  alternative: ihe unu ji anya isi
  rationale: A họọrọ okwu nke na-adịghị emechi ma ọ bụ naanị omume ịnya isi ma ọ bụ ihe e ji anya isi; ala peeji na-egosi nkọwa aha-ihe ahụ nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ịnya isi” bụ okwu ndị mmadụ maara nke ọma; “baa ụba” na-egosi mmụba n’enweghị ịgbakwunye nkọwa na-adịghị n’ihe odide. E debere akara ala peeji niile [a]–[d] n’isiokwu ahụ.
