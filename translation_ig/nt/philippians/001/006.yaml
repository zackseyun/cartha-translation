id: PHP.1.6
reference: Philippians 1:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πεποιθὼς αὐτὸ τοῦτο ὅτι ὁ ἐναρξάμενος ἐν ὑμῖν ἔργον ἀγαθὸν ἐπιτελέσει ἄχρι ἡμέρας ⸂Χριστοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/006.yaml
  text: 'I am confident of this very thing: that he who began a good work among you will bring it to completion at the day of Messiah Jesus.'
translation:
  language: ig
  text: 'Ekwenyesiri m ike n’ihe a kpọmkwem: na onye malitere ezi ọrụ n’etiti unu[a] ga-arụzu ya ruo ụbọchị Mesaịa[b] Jizọs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime unu.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ọdịnala: “Kraịst Jizọs.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθὼς
  choice: Enwere m obi ike
  rationale: Ọ bụ participle jikọrọ na onye mbụ n’okwu gbara ya gburugburu; ntụgharị a na-egosipụta obi ike Pọl n’ụzọ Igbo dị eke.
- source_word: αὐτὸ τοῦτο
  choice: banyere nke a kpọmkwem
  rationale: Nke a na-echekwa nkwusi ike dị n’okwu Grik ahụ n’enweghị ntụgharị siri ike nghọta.
- source_word: ὁ ἐναρξάμενος
  choice: onye ahụ malitere
  rationale: Ọ na-echekwa onye na-eme ihe dịka onye dị ndụ, bụ́ onye a ghọtara na ọ bụ Chineke, ma ọ naghị etinye aha na-adịghị na Grik.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Nnọchiaha ahụ dị n’ụdị ọtụtụ, na okwu ahụ bụ maka ọgbakọ dị na Filipaị; ‘n’etiti unu’ na-egosipụta akụkụ nke ọgbakọ ma hapụkwa ‘n’ime unu’ dịka nhọrọ.
- source_word: ἔργον ἀγαθὸν
  choice: ezi ọrụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma dị mfe nghọta nke okwu Grik ahụ.
- source_word: ἐπιτελέσει
  choice: ga-arụzu ya
  rationale: ‘Ịrụzu’ na-egosi na onye malitere ọrụ ahụ ga-eme ka ọ ruo na njedebe ya nke ọma.
- source_word: ἄχρι ἡμέρας
  choice: ruo n’ụbọchị
  rationale: Nke a na-echekwa ókè oge nke ἄχρι n’enweghị ịgbanwe ya ka ọ bụrụ naanị ihe ga-eme kpọmkwem n’ụbọchị ahụ.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesaịa Jizọs
  rationale: Χριστός bụ aha-ọkwa pụtara Mesaịa; a tụgharịrị ya kama idegharị ya naanị dịka ‘Kraịst.’
theological_decisions:
- issue: Ma ọrụ ahụ ọ na-emetụta onye ọ bụla n’otu n’otu ka ọ̀ bụ ọgbakọ n’ozuzu ya
  choice: Isiokwu ahụ ji ‘n’etiti unu’ mee ka akụkụ nke ọgbakọ pụta ìhè.
  alternative: ‘n’ime unu,’ nke nwere ike ịgụnye ma ọ bụ mesie ọrụ dị n’ime onye ọ bụla ike.
  rationale: ὑμῖν dị n’ụdị ọtụtụ, ebe ọnọdụ akwụkwọ ozi ahụ bụ okwu a gwara ọgbakọ Filipaị. Nhọrọ a anaghị agọnahụ etu amaokwu ahụ nwere ike isi metụta ndị mmadụ n’otu n’otu.
- issue: Ma ἄχρι ἡμέρας ọ pụtara na a ga-arụzu ọrụ ahụ ‘ruo’ ụbọchị ahụ ka ọ̀ bụ ‘n’ụbọchị’ ahụ
  choice: ‘ruo n’ụbọchị’
  alternative: ‘n’ụbọchị’
  rationale: ‘Ruo’ na-anọgide nso na ókè oge Grik ahụ ma na-echekwa ohere nghọta banyere usoro ọrụ ahụ na mmezu ya, kama idozi esemokwu ahụ n’otu ụzọ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji ahịrịokwu dị mfe nghọta mee ya, ma e chekwara nkwusi ike, ọnọdụ ọgbakọ, na ókè oge dị n’asụsụ Grik.
