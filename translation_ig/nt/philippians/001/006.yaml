  to: 'Ekwenyesiri m ike n’ihe a kpọmkwem: na onye malitere ezi ọrụ n’etiti unu[a] ga-arụzu ya ruo ụbọchị Mesaịa[b] Jizọs.'
  rationale: The revision improves idiomatic Standard Igbo in the opening while retaining the Greek emphasis and its first-person perspective. It retains the corporately apt but non-exclusive ‘n’etiti unu’ and the temporally faithful ‘ruo ụbọchị.’ Footnote anchors have been attached to the words they annotate; no doctrinal inference has been added.
