id: PHP.1.20
reference: Philippians 1:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατὰ τὴν ἀποκαραδοκίαν καὶ ἐλπίδα μου ὅτι ἐν οὐδενὶ αἰσχυνθήσομαι, ἀλλ’ ἐν πάσῃ παρρησίᾳ ὡς πάντοτε καὶ νῦν μεγαλυνθήσεται Χριστὸς ἐν τῷ σώματί μου, εἴτε διὰ ζωῆς εἴτε διὰ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/020.yaml
  text: in keeping with my eager expectation and hope that I will not be put to shame in anything[a], but that with all boldness, as always, even now Messiah will be magnified in my body[b], whether through life or through death.
translation:
  language: ig
  text: 'dị ka oké atụmanya m na olileanya m si dị: na a gaghị emechu m ihu n’ihe ọ bụla[a], kama na, n’obi ike zuru ezu, dị ka mgbe niile, otu ahụkwa ugbu a, a ga-eme ka ịdị ukwuu nke Mesaịa[b] pụta ìhè n’ahụ m, ma ọ̀ bụ site ná ndụ, ma ọ̀ bụ site n’ọnwụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “agaghị m enwe ihere.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ
  choice: dị ka … si dị
  rationale: Ọ na-egosi na ihe Pọl na-ekwu kwekọrọ n’oké atụmanya ya na olileanya ya; nke a bụ ụzọ Igbo si ekwu ya n’enweghị isi oghere ma ọ bụ ihe kpatara ya.
- source_word: ἀποκαραδοκίαν
  choice: oké atụmanya
  rationale: Okwu a na-egosi atụmanya siri ike nke onye ji ịnụ ọkụ n’obi na-ele ihe ga-abịa anya.
- source_word: ἐλπίδα
  choice: olileanya
  rationale: Nke a bụ okwu Igbo doro anya maka olileanya Pọl nwere banyere ihe ọ na-atụ anya ya.
- source_word: ἐν οὐδενὶ
  choice: n’ihe ọ bụla
  rationale: Ọ na-echekwa ngọnarị zuru ezu nke okwu Grik ahụ ma na-ada nke ọma n’Igbo.
- source_word: αἰσχυνθήσομαι
  choice: a gaghị emechu m ihu
  rationale: Nhọrọ a na-echekwa ọdịdị nnara nke ngwaa ahụ na echiche nke ịbụ onye ihere mere n’ihu ọha; e tinyere ‘agaghị m enwe ihere’ na nkọwa ala peeji dịka ihe ọzọ okwu ahụ pụrụ ịpụta.
- source_word: παρρησίᾳ
  choice: site n’iji obi ike zuru ezu
  rationale: N’ebe a, okwu ahụ na-egosi nkwuwa okwu na obi ike n’ihu ọha karịa nanị ikwu okwu n’ezoghị ọnụ.
- source_word: μεγαλυνθήσεται
  choice: a ga-eme ka ịdị ukwuu … pụta ìhè
  rationale: Nke a na-egosipụta echiche nke ime ka a hụ onye ahụ dịka onye dị ukwuu, ma na-ada nke ọma karịa nsụgharị nkịtị nke na-agaghị adị mfe n’Igbo.
- source_word: Χριστὸς
  choice: Mesaịa
  rationale: N’ebe a Χριστός ka nwere ike dị ka aha ọkwá nke Onye E Tere Mmanụ, ya mere ‘Mesaịa’ na-echekwa ihe aha ahụ pụtara; ‘Kraịst’ dị na nkọwa ala peeji dịka nhọrọ ọdịnala.
- source_word: ἐν τῷ σώματί μου
  choice: n’ahụ m
  rationale: Ọ na-echekwa okwu Pọl banyere ahụ ya n’onwe ya dịka ebe ịdị ukwuu Mesaịa ga-apụta ìhè.
- source_word: εἴτε διὰ ζωῆς εἴτε διὰ θανάτου
  choice: ma ọ̀ bụ site ná ndụ, ma ọ̀ bụ site n’ọnwụ
  rationale: Ọ na-echekwa nhazi yiri ibe ya na echiche διά nke ụzọ ma ọ bụ ọnọdụ e si eme ka nke a pụta ìhè.
theological_decisions:
- issue: Otu e si sụgharịa Χριστός n’akwụkwọ ozi Pọl
  choice: Mesaịa
  alternative: Kraịst
  rationale: Aha ahụ ka na-arụ ọrụ dịka aha ọkwá nwere ihe ọ pụtara, ọ bụghị naanị dịka aha mmadụ; ‘Mesaịa’ na-eme ka echiche nke Onye E Tere Mmanụ nọgide pụta ìhè.
- issue: Ihe αἰσχυνθήσομαι pụtara
  choice: a gaghị emechu m ihu
  alternative: agaghị m enwe ihere
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara akaebe Pọl n’ihu ọha na ma a ga-eme ka olileanya ya ghara isi ike; nsụgharị bụ isi na-echekwa echiche nke ịbụ onye e wedara n’ihere, ebe nkọwa ala peeji na-echekwa nghọta nke ime ihere n’ime obi.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, nke nwere ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-aga n’ihu site n’ihe e kwuru n’amaokwu bu ya ụzọ, ya mere e debere mmalite ‘dị ka … si dị.’ E tinyere akara ụda olu naanị n’ebe ha na-enyere aka igosi ọdịiche, dịka ‘ma ọ̀ bụ.’
