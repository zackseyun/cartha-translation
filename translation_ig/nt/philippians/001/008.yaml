source:
  edition: SBLGNT
  text: μάρτυς γάρ ⸀μου ὁ θεός, ὡς ἐπιποθῶ πάντας ὑμᾶς ἐν σπλάγχνοις ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/008.yaml
  text: For God is my witness[b][a], how I long for all of you with the affections of Messiah Jesus.
translation:
  language: ig
  text: N’ihi na Chineke bụ onye akaebe m banyere otú m si agụ unu niile agụụ n’ịhụnanya miri emi nke Mesaịa Jizọs.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị: “Kraịst Jizọs.”'
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịsị: “n’ọmịiko nke Mesaịa Jizọs.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυς
  choice: onye akaebe
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ n’ilu Grik nke Pọl ji kpọkuo Chineke ka ọ bụrụ onye na-akwado eziokwu nke obi ya.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya, na-enye ihe mere Pọl ji kwuo okwu ịhụnanya ahụ.
- source_word: ὡς
  choice: banyere otú
  rationale: Ọ na-ewebata ọdịnaya na ịdị omimi nke agụụ Pọl, ọ bụghị naanị eziokwu na ọ na-agụ ha agụụ.
- source_word: ἐπιποθῶ
  choice: m si agụ ... agụụ
  rationale: ‘Ịgụ mmadụ agụụ’ bụ ụzọ Igbo si ekwu ọchịchọ siri ike ịhụ onye ọzọ, ma na-anọgide n’asụsụ dị mma ma bụrụ nke mmadụ niile ga-aghọta.
- source_word: πάντας ὑμᾶς
  choice: unu niile
  rationale: Ọ na-echekwa nkwusi ike nke πάντας, ya bụ na Pọl na-ekwu banyere ha niile n’enweghị onye a hapụrụ.
- source_word: σπλάγχνοις
  choice: ịhụnanya miri emi
  rationale: N’ụzọ nkịtị okwu ahụ na-ezo aka n’ime afọ dịka ebe mmetụta siri ike si apụta; ntụgharị a na-ebute echiche ịhụnanya na ọmịiko miri emi n’Igbo ekeghị eke.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesaịa Jizọs
  rationale: A sụgharịrị Χριστός dịka aha-ọkwa ‘Mesaịa,’ ebe Jizọs bụ aha onye; nke a na-echekwa ike aha-ọkwa ahụ.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n’usoro aha-ọkwa Pọl
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: ‘Mesaịa’ na-eme ka ihe Χριστός pụtara dịka Onye E Tere Mmanụ pụta ìhè; ‘Kraịst Jizọs’ bụkwa usoro ọdịnala a na-ahụkarị, ya mere e debere ya n’okpuru peeji.
- issue: Mmekọrịta ἐν σπλάγχνοις na Mesaịa Jizọs
  choice: site n’ịhụnanya miri emi nke Mesaịa Jizọs
  alternative: site n’ọmịiko nke Mesaịa Jizọs
  rationale: E kweghị ikpebi ma okwu ahụ bụ naanị mmetụta ịhụnanya ma ọ bụ naanị ọmịiko; isiokwu ahụ jiri okwu sara mbara, ebe ihe ọzọ dị n’okpuru peeji.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere nsụgharị nkịtị nke σπλάγχνοις dịka akụkụ ime ahụ, n’ihi na nke ahụ agaghị ebute ilu mmetụta uche nke Grik n’ụzọ eke n’Igbo. E tinyere akara ụkwụ [a] na [b] n’isiokwu ahụ.
