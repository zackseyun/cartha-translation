id: PHP.1.13
reference: Philippians 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε τοὺς δεσμούς μου φανεροὺς ἐν Χριστῷ γενέσθαι ἐν ὅλῳ τῷ πραιτωρίῳ καὶ τοῖς λοιποῖς πᾶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/013.yaml
  text: so that my chains in Messiah have become known throughout the whole imperial guard and to all the rest[b][a],
translation:
  language: ig
  text: nke mere na agbụ m n’ihi Mesaịa aghọọla ihe a maara nke ọma n’etiti ndị nche eze ukwu niile nakwa n’etiti ndị ọzọ niile,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “agbụ m n’ime Mesaịa.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’ime praetorium dum.” Okwu a nwere ike ịpụta ndị nche eze ukwu ma ọ bụ isi ụlọ ọrụ, ma ọ bụ ebe obibi, nke onye ọchịchị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: nke mere na
  rationale: Na-egosi ihe si n’okwu bu ụzọ pụta; ọ bụ usoro okwu Igbo dị mfe ma na-edobe ike nke nsonaazụ ahụ.
- source_word: τοὺς δεσμούς μου
  choice: agbụ m
  rationale: Na-edobe ihe oyiyi nkịtị nke δεσμούς, ‘agbụ,’ kama ịkọwa ya naanị dị ka mkpọrọ.
- source_word: φανεροὺς ... γενέσθαι
  choice: a matala ... na
  rationale: Na-egosipụta na ihe kpatara agbụ Pọl bịara doo ndị mmadụ anya ma bụrụ ihe a maara.
- source_word: ἐν Χριστῷ
  choice: bụ n’ihi Mesaịa
  rationale: N’ọnọdụ a, ọ na-egosi njikọ agbụ Pọl na Mesaịa, yikarịrị ka ihe kpatara eji kee ya agbụ; e debere ntụgharị nke na-egosipụta ‘n’ime Mesaịa’ na nkọwa ala peeji.
- source_word: Χριστῷ
  choice: Mesaịa
  rationale: Na-edobe Χριστός dị ka aha ọkwa pụtara Onye E Tere Mmanụ, ọ bụghị naanị dị ka aha mmadụ.
- source_word: ἐν ὅλῳ τῷ πραιτωρίῳ
  choice: n’ebe ndị nche eze ukwu niile nọ
  rationale: Na-enye ihe a na-ewerekarị dị ka ntụaka okwu πραιτώριον n’ebe a—ndị nche eze ukwu—ma na-edebe nhọrọ ‘praetorium’ na nkọwa ala peeji.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: n’etiti ndị ọzọ niile
  rationale: Na-agbasawanye ndị maara okwu ahụ gafee ndị nche eze ukwu, ma na-edobe ‘niile’ nke πᾶσιν.
theological_decisions:
- issue: Ihe ἐν Χριστῷ pụtara n’ihe gbasara agbụ Pọl
  choice: agbụ m bụ n’ihi Mesaịa
  alternative: agbụ m n’ime Mesaịa
  rationale: Isiokwu gbara ya gburugburu na-elekwasị anya n’ịmata ihe mere e ji kee Pọl agbụ. Ma ebe ἐν Χριστῷ nwekwara ike igosi ịdị n’ime Mesaịa ma ọ bụ njikọ ya na ya, a hapụrụ nhọrọ ahụ n’akụkụ nkọwa kama ikpochapụ mgbagwoju anya ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri ‘agbụ’ debe ihe oyiyi okwu Grik; e jiri ‘Mesaịa’ debe Χριστός dị ka aha ọkwa. Akara nkọwa ala peeji [a] na [b] pụtara n’ahịrị isi.
