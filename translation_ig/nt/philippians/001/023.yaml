id: PHP.1.23
reference: Philippians 1:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνέχομαι δὲ ἐκ τῶν δύο, τὴν ἐπιθυμίαν ἔχων εἰς τὸ ἀναλῦσαι καὶ σὺν Χριστῷ εἶναι, πολλῷ ⸀γὰρ μᾶλλον κρεῖσσον,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/023.yaml
  text: But I am hard pressed between the two[a], having the desire to depart and be with Messiah[b], for that is far better.
translation:
  language: ig
  text: Ma anọ m ná nrụgide n’etiti ihe abụọ a, ebe m nwere ọchịchọ ịpụ[a] na ịnọnyere Kraịst, n’ihi na nke ahụ ka nnọọ mma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nke a nwere ike ịpụta “ịnwụ.” N'ụzọ nkịtị, “ịpụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέχομαι
  choice: a nọ m ná nrụgide
  rationale: Nke a na-egosi na ihe abụọ ahụ na-akpa Pọl aka ma na-etinye ya n’ọnọdụ siri ike, n’enweghị ịgbakwunye na o meela mkpebi.
- source_word: ἐκ τῶν δύο
  choice: n’etiti ihe abụọ a
  rationale: Ọ bụ ụzọ Igbo si ekwu n’ụzọ doro anya na mmadụ nọ n’etiti nhọrọ abụọ, ọ bụ ezie na okwu Grik ahụ n’onwe ya yiri ‘site n’ihe abụọ ahụ.’
- source_word: τὴν ἐπιθυμίαν ἔχων
  choice: agụụ ... na-agụ m
  rationale: Akpaalaokwu Igbo a na-edobe ike nke aha Grik pụtara ‘ọchịchọ’ ma na-ada ka Igbo nkịtị.
- source_word: ἀναλῦσαι
  choice: ịpụ
  rationale: A họọrọ okwu pụtara ‘ịpụ’ iji chekwaa okwu ntụnyere Pọl ji kama ịkọwa ya ozugbo dị ka ọnwụ.
- source_word: Χριστῷ
  choice: Kraịst
  rationale: ‘Kraịst’ bụ aha-ọkwa a maara nke ọma n’Igbo maka Χριστός, ya bụ Onye e tere mmanụ ahụ.
- source_word: πολλῷ γὰρ μᾶλλον κρεῖσσον
  choice: n’ihi na nke ahụ ka nnọọ mma
  rationale: ‘Ka nnọọ mma’ na-egosipụta ike ntụnyere dị n’okwu Grik ma na-ada nke ọma n’Igbo nke oge a.
theological_decisions:
- issue: Mmekọrịta ya na Kraịst mgbe ọ pụsịrị ndụ a
  choice: ịpụ na ịnọnyere Kraịst
  alternative: ịnwụ ma gaa eluigwe ozugbo
  rationale: Nsụgharị ahụ na-ekwu naanị ihe Grik kwuru—ịpụ na ịnọnyere Kraịst—ma ọ naghị etinye nkọwa banyere usoro ma ọ bụ oge ihe ga-eme.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ ‘ịpụ’ na mgbagwoju anya mmụta-okpukpe dị n’amaokwu ahụ.
