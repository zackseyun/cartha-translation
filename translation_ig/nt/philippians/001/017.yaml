  text: οἱ δὲ ἐξ ⸂ἐριθείας τὸν Χριστὸν καταγγέλλουσιν, οὐχ ἁγνῶς, οἰόμενοι θλῖψιν ἐγείρειν τοῖς δεσμοῖς μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/017.yaml
  text: But the others proclaim the Messiah out of selfish ambition[a], not sincerely[b], thinking to raise up affliction for me in my imprisonment.
translation:
  language: ig
  text: Ma ndị ọzọ na-ekwusa Mesaịa ahụ n’ihi ịchọ uru na ọkwá maka onwe ha, ọ bụghị n’ezi obi, na-eche na ha ga-eme ka m nwekwuo mkpagbu n’agbụ m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “ịkpalite mkpagbu n’agbụ m.” “Agbụ m” nwere ike izo ọnọdụ mkpọrọ Pọl aka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐριθείας
  choice: ọchịchọ ịchọ ọdịmma onwe ha
  rationale: Nke a na-egosi ọchịchọ mmadụ ji achọ uru na ọkwá nke ya n’ụzọ na-akpalite nkewa; ọ bụghị naanị ịchọ ọdịmma onwe onye n’ozuzu.
- source_word: Χριστόν
  choice: Kraịst
  rationale: N’Igbo nke oge a, “Kraịst” bụ aha-ọkwa a maara nke ọma maka Mesaịa ahụ, ma dabara n’ihe a na-ekwusa banyere Jizọs n’ebe a.
- source_word: καταγγέλλουσιν
  choice: na-ekwusa
  rationale: “Na-ekwusa” na-egosi ikwupụta ozi ahụ n’ihu ọha, n’enweghị ime ka ọ bụrụ naanị ikwusa ozi n’usoro ofufe.
- source_word: ἁγνῶς
  choice: site n’obi dị ọcha
  rationale: N’ebe a, okwu ahụ metụtara ịdị ọcha nke ebumnobi; nkebiokwu Igbo a na-eme ka nke ahụ doo anya.
- source_word: οἰόμενοι
  choice: na-eche
  rationale: Ọ na-egosi echiche ma ọ bụ atụmatụ ha chere na omume ha ga-emezu.
- source_word: θλῖψιν ἐγείρειν
  choice: ga-eme ka ahụhụ m ... ka njọ
  rationale: N’ọnọdụ a, okwu ahụ pụtara ịkpatara Pọl mkpagbu ma ọ bụ ime ka nsogbu ya bawanye; nsụgharị a bụ nke eke n’Igbo ma na-echekwa ebumnobi ọjọọ ahụ.
- source_word: τοῖς δεσμοῖς μου
  choice: n’agbụ m
  rationale: Nke a na-echekwa ihe oyiyi nkịtị nke “agbụ,” nke na-anọchi anya ọnọdụ mkpọrọ Pọl.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Kraịst
  alternative: Mesaịa ahụ
  rationale: Χριστός bụ aha-ọkwa, ma “Kraịst” bụ ụdị aha-ọkwa ahụ e guzobere ma ghọta nke ọma n’Igbo. “Mesaịa ahụ” ga-ekwupụta ihe ọ pụtara n’ụzọ doro anya karị, ma ọ nwere ike ịdị ka nkọwa kama ụdị a na-ejikarị eme ihe.
- issue: Mmekọrịta θλῖψιν na τοῖς δεσμοῖς μου
  choice: ime ka ahụhụ m na-ata n’agbụ m ka njọ
  alternative: ịkpalite mkpagbu nye agbụ m
  rationale: Dative ahụ nwere ike ịkọwa mkpagbu e tinyere n’ọnọdụ agbụ Pọl. Nsụgharị a na-egosi na ndị ahụ chọrọ ime ka ahụhụ mkpọrọ ya bawanye, n’ebughị ụzọ kọwaa kpọmkwem otú ha ga-esi mee ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E jiri “n’obi dị ọcha” kọwaa ịdị ọcha nke ebumnobi, ma debe “agbụ” iji chekwaa ihe oyiyi sitere n’asụsụ mbụ.
