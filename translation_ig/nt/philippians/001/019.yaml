id: PHP.1.19
reference: Philippians 1:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι τοῦτό μοι ἀποβήσεται εἰς σωτηρίαν διὰ τῆς ὑμῶν δεήσεως καὶ ἐπιχορηγίας τοῦ πνεύματος Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/019.yaml
  text: For I know that this will turn out for my deliverance through your prayer and the provision of the Spirit of Jesus the Messiah[b][a],
translation:
  language: ig
  text: N’ihi na ama m na ihe a ga-emecha bụrụ nnapụta m[a] site n’arịrịọ unu na nkwado nke Mmụọ Jizọs bụ́ Mesaya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nzọpụta” ma ọ bụ “igosi na ikpe mara ya ezighị ezi.”
    reason: alternative_reading
  - marker: b
    text: 'N’asụsụ Grik: “Mmụọ Jizọs Kraịst.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: ama m
  rationale: Ụdị a na-egosi ihe Pọl maara ugbu a ma na-echekwa obi ike dị n’okwu ya.
- source_word: τοῦτό
  choice: ihe a
  rationale: Ọ na-ezo aka n’ọnọdụ Pọl niile a kọwara n’amaokwu ndị bu ụzọ, n’akọwaghị ya karịa ka Grik si kwuo.
- source_word: ἀποβήσεται
  choice: ga-emecha bụrụ
  rationale: Ọ na-egosi ihe ọnọdụ ahụ ga-amịpụta n’ikpeazụ; okwu a bụ Igbo dị mfe ma kwekọọ n’echiche nke nsonaazụ.
- source_word: σωτηρίαν
  choice: nnapụta
  rationale: N’ọnọdụ mkpọrọ Pọl, ‘nnapụta’ na-egosi ihe ga-esi n’ọnọdụ ya pụta, ma okwu Grik ka nwekwara nghọta sara mbara nke nzọpụta ma ọ bụ igosi na onye ahụ bụ onye ezi omume.
- source_word: δεήσεως
  choice: arịrịọ
  rationale: ‘Arịrịọ’ na-egosipụta ekpere a na-arịọsi ike, nke kwekọrọ n’aha Grik karịa naanị okwu izugbe maka ekpere.
- source_word: ἐπιχορηγίας
  choice: nkwado
  rationale: Okwu a na-egosi enyemaka ma ọ bụ ihe e nyere n’ụba; ‘nkwado’ bụ okwu Igbo doro anya n’ebe a ma ghara ịkọwapụta genitive ahụ gabiga ókè.
- source_word: πνεύματος Ἰησοῦ Χριστοῦ
  choice: Mmụọ Jizọs bụ́ Mesaya
  rationale: A hapụrụ njikọ genitive ahụ n’ụzọ kwụ ọtọ dịka Mmụọ nke metụtara Jizọs, ma sụgharịa Χριστός dịka utu aha ‘Mesaya’.
theological_decisions:
- issue: Ihe σωτηρίαν pụtara n’ọnọdụ mkpọrọ Pọl
  choice: nnapụta
  alternative: nzọpụta; ma ọ bụ igosi na ikpe mara Pọl ezighị ezi
  rationale: Nnapụta dabara nke ọma n’ọnọdụ ahụ, ma nkọwa ala peeji na-echekwa obosara okwu Grik kama imechi ya n’otu nkọwa okpukpe.
- issue: Njikọ dị na ἐπιχορηγίας τοῦ πνεύματος
  choice: nkwado nke Mmụọ Jizọs bụ́ Mesaya
  alternative: onyinye nke Mmụọ Jizọs bụ́ Mesaya
  rationale: Ụdị isiokwu ahụ na-echekwa ohere na ọ bụ Mmụọ na-enye nkwado ma ọ bụ na Mmụọ n’onwe ya bụ ihe e nyere, kama idozi nghọta genitive ahụ n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụdaolu n’okwu bụ́ iji gbochie mgbagwoju anya, ma zere okwu ụka nke otu òtù pụrụ iche.
