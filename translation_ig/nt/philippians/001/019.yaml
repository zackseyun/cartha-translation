  source_fidelity: 'Igbo text accurately represents the Greek clause structure: Paul''s present confidence, the broad demonstrative “ihe a,” future outcome, σωτηρία as “nnapụta,” and the two means expressed by διά. “Nkwado nke Mmụọ Jizọs bụ́ Mesaya” retains the source’s concise and somewhat open genitive relation rather than forcing a doctrinally narrow explanation.'
