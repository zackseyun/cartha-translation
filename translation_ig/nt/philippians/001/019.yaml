  terminology: “Nnapụta” suitably conveys deliverance while footnote a preserves the broader semantic possibilities of σωτηρία. “Mmụọ Jizọs bụ́ Mesaya” faithfully renders the expression while rendering Χριστός as the title Mesaya. Both markers are correctly placed at the terms to which their notes apply.
