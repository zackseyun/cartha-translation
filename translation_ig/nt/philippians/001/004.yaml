lexical_decisions:
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Na-egosipụta echiche nke ime ihe mgbe niile n'ụzọ doro anya na Igbo.
- source_word: ἐν πάσῃ δεήσει μου
  choice: n'arịrịọ m niile
  rationale: δέησις bụ arịrịọ e ji ekpe ekpere maka mkpa; “arịrịọ m niile” na-edobe πάσῃ na onye nwe ya, μου.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: maka unu niile
  rationale: Na-edobe ma echiche nke ịrịọchitere ndị ahụ arịrịọ ma nkwusi ike dị na πάντων.
- source_word: μετὰ χαρᾶς
  choice: eji ọṅụ
  rationale: Ụzọ Igbo dị n'okike isi kwuo na ọṅụ so arịrịọ ahụ.
- source_word: τὴν δέησιν ποιούμενος
  choice: ana m ... arịọ arịrịọ
  rationale: Na-egosipụta participle nke na-akọwa ihe Pọl na-eme; ikwughachi “arịrịọ” na-echekwa nkwughachi δέησις dị n'amaokwu Grik.
