  text: Ana m ekele Chineke m mgbe ọ bụla m chetara unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ana m ekele Chineke m n’ihi ncheta ọ bụla banyere unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστῶ
  choice: Ana m ekele
  rationale: Okwu a bụ ngwaa dị n’oge ugbu a, onye mbụ otu; “Ana m ekele” bụ ụzọ Igbo nkịtị si egosipụta inye Chineke ekele.
- source_word: τῷ θεῷ μου
  choice: Chineke m
  rationale: Dative a so εὐχαριστέω na-egosi onye a na-ekele; n’Igbo, a na-etinye onye ahụ ozugbo n’azụ “ekele,” ebe “m” na-edobe nnọchiaha nke onye nwe ihe.
- source_word: ἐπὶ πάσῃ
  choice: mgbe ọ bụla
  rationale: N’ebe a, ἐπὶ tinyere dative na-egosi ọnọdụ ma ọ bụ oge ekele ahụ na-eme; “mgbe ọ bụla” na-enye Igbo dị ire ma na-edobe echiche nkesa nke πάσῃ.
- source_word: τῇ μνείᾳ
  choice: m chetara
  rationale: Ọ bụ ezie na Grik ji aha “ncheta,” Igbo na-ekwukarị echiche a n’ụzọ ebumpụta ụwa site na ngwaa “chetara.”
- source_word: ὑμῶν
  choice: unu
  rationale: “Unu” na-egosi nke ọma na onye nke abụọ ebe a bụ ọtụtụ mmadụ, dịka ụdị Grik si dị.
