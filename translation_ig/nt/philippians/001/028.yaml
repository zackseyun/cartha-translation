revisions:
- from: Ndị na-emegide unu ekwela ka ha mee ka ụjọ tụwa unu n'ụzọ ọ bụla[a]. Nke a bụụrụ ha ihe ịrịba ama[b] nke mbibi, ma ọ bụ ihe ịrịba ama nke nzọpụta unu—nke a sikwa n'aka Chineke[c].
  to: Unu ekwela ka ndị na-emegide unu menye unu ụjọ n’ụzọ ọ bụla[a]. Nke a bụụrụ ha ihe ịrịba ama[b] nke mbibi, ma bụrụụrụ unu ihe ịrịba ama nke nzọpụta—nke a sitere na Chineke[c].
  rationale: The revision retains the draft’s meaning while making the one Greek noun ἔνδειξις govern both “mbibi” and “nzọpụta” in a natural Igbo parallel construction. It also uses a direct source expression for ἀπὸ θεοῦ and improves the clarity and idiomatic quality of the footnotes. The ambiguity of τοῦτο is retained.
  reviewer_model: gpt-5.6-terra
