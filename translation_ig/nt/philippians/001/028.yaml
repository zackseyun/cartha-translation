source:
  edition: SBLGNT
  text: καὶ μὴ πτυρόμενοι ἐν μηδενὶ ὑπὸ τῶν ἀντικειμένων (ἥτις ⸂ἐστὶν αὐτοῖς⸃ ἔνδειξις ἀπωλείας, ⸀ὑμῶν δὲ σωτηρίας, καὶ τοῦτο ἀπὸ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/028.yaml
  text: and not being frightened in anything by those who oppose you[a]. This is a sign to them of destruction[c][b], but of your salvation—and this from God.
translation:
  language: ig
  text: Unu ekwela ka ndị na-emegide unu menye unu ụjọ n’ụzọ ọ bụla[a]. Nke a bụụrụ ha ihe ịrịba ama[b] nke mbibi, ma bụrụụrụ unu ihe ịrịba ama nke nzọpụta—nke a sitere na Chineke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ekwela ka ha mee ka unu maa jijiji” ma ọ bụ “ekwela ka ha menye unu ụjọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị ya, “ihe akaebe” ma ọ bụ “ihe na-egosi.”
    reason: lexical_alternative
  - marker: c
    text: Okwu ahụ bụ “nke a sitere na Chineke” nwere ike izo aka kpọmkwem na nzọpụta unu, ma ọ bụ n’ihe dum e kwuru n’ihu ya.
    reason: alternative_reading
lexical_decisions:
- source_word: πτυρόμενοι
  choice: ekwela ka ha mee ka ụjọ tụwa unu
  rationale: Okwu a na-egosi ịbụ onye ihe mberede ma ọ bụ mmegide mere ka ụjọ jide ya. Nsụgharị a bụ Igbo dị mfe ma na-egosikwa na ndị mmegide na-achọ imenye ha ụjọ.
- source_word: ἐν μηδενί
  choice: n'ụzọ ọ bụla
  rationale: Nke a na-edobe echiche zuru ezu nke ‘ọ bụghị n’ụzọ ọbụla’ n’Igbo a na-asụ ugbu a.
- source_word: ἀντικειμένων
  choice: ndị na-emegide unu
  rationale: Ọ na-akọwa ndị guzoro megide ndị kwere ekwe; nsụgharị a doro anya ma gosipụta mmekọrịta ahụ.
- source_word: ἔνδειξις
  choice: ihe ịrịba ama
  rationale: Okwu Grik a pụtara ihe na-egosi ma ọ bụ na-enye ihe akaebe. ‘Ihe ịrịba ama’ bụ okwu Igbo dị mfe nke na-edobe obosara echiche ahụ.
- source_word: ἀπωλείας
  choice: mbibi
  rationale: ‘Mbibi’ na-egosipụta ọdịda ma ọ bụ ikpe na-abịa n’etinyeghị nkọwa karịa ihe okwu Grik kwuru.
- source_word: σωτηρίας
  choice: nzọpụta
  rationale: ‘Nzọpụta’ na-edobe ibu echiche banyere ọrụ nzọpụta Chineke dị n’okwu Pọl.
- source_word: τοῦτο ἀπὸ θεοῦ
  choice: nke a sikwa n'aka Chineke
  rationale: E debere ‘nke a’ ka ihe ọ na-ezo aka na ya ghara ịbụ nke a kpebiri n’ụzọ na-adịghị n’ihe odide Grik.
theological_decisions:
- issue: Ihe τοῦτο (‘nke a’) na-ezo aka na ya
  choice: 'E debere ya n’obosara ya: ‘nke a sikwa n''aka Chineke.’'
  alternative: Ọ pụrụ izo aka kpọmkwem na nzọpụta unu, ma ọ bụ n’ihe ịrịba ama niile nke obi ike ha na ihe nke ahụ pụtara nye ndị mmegide.
  rationale: Asụsụ Grik ekpebighị kpọmkwem ihe ‘nke a’ na-ezo aka na ya; ya mere, nsụgharị ahụ echekwaghị esemokwu ahụ kama ịkọwa ya n’otu ụzọ naanị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-arụ ọrụ nke ọma n’Igbo kama idowe participle Grik n’ụdị ga-ada ka ahịrịokwu na-ezughị ezu. E debere mgbagwoju anya nke ‘nke a’ site na ndetu ala peeji.
