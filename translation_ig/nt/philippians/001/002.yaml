revisions:
- from: Ka amara na udo sitere n’aka Chineke Nna anyị na Onyenwe anyị Jizọs bụ́ Mezaịa ahụ dịrị unu.[a][b]
  to: Ka amara na udo sitere n’aka Chineke Nna anyị na Onyenwe anyị[b] Jizọs bụ Mezaịa ahụ[a] dịrị unu.
  rationale: The revision preserves the Greek greeting and its formal register, makes the Messiah title idiomatic and explicit in Igbo, relocates the anchors to their referents, and replaces the inaccurate κύριος footnote with a concise viable lexical alternative.
