    text: Ma ọ bụ, Kraịst.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, Nna-ukwu.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek greeting and its formal register, makes the Messiah title idiomatic and explicit in Igbo, relocates the anchors to their referents, and replaces the inaccurate κύριος footnote with a concise viable lexical alternative.
