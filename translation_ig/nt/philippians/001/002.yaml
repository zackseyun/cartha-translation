  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].
translation:
  language: ig
  text: Ka amara na udo sitere n’aka Chineke Nna anyị na Onyenwe anyị[b] Jizọs bụ Mezaịa ahụ[a] dịrị unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, Kraịst.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, Nna-ukwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις; ọ na-echekwa echiche ihu ọma Chineke na ịdị arọ okwu a n’akwụkwọ Pọl.
- source_word: ὑμῖν
  choice: dịrị unu
  rationale: N’ụdị ekele na ngọzi Igbo, a na-egosipụta dative a nke ọma site n’usoro “dịrị unu.”
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” bụ ntụgharị doro anya ma dịkwa ndụ n’Igbo, na-echekwakwa echiche zuru ezu nke سلام/ọdịmma dị n’ekele a.
- source_word: ἀπό
  choice: sitere n’aka
  rationale: “Sitere n’aka” na-egosi ebe amara na udo si abịa n’ụzọ Igbo na-ada nke ọma.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Chineke Nna anyị
  rationale: Nke a na-ewere “Nna anyị” dị ka nkọwa onye Chineke bụ, dịka usoro Grik si dị, ma na-ada nke ọma n’Igbo.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ a maara nke ọma maka κύριος n’Igbo ma na-echekwa ịdị arọ ya mgbe a na-ekwu maka Jizọs.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mezaịa ahụ
  rationale: “Mezaịa” na-eme ka ihe Χριστός pụtara dịrị onye na-agụ ya anya dị ka aha ọkwá, kama ile ya naanị dịka aha mmadụ; “bụ́ … ahụ” na-eme ka usoro ahụ bụrụ Igbo nkịtị.
theological_decisions:
- issue: Otu e si asụgharị Χριστοῦ n’ekele Pọl
  choice: Mezaịa ahụ
  alternative: Kraịst
  rationale: N’agbanyeghị na “Kraịst” bụ ụdị ọdịnala a maara nke ọma, Χριστός sitere n’echiche onye e tere mmanụ, ya bụ Mezaịa. Isi ederede na-eme ka aha ọkwá ahụ doo anya, ebe ihe odide ala peeji na-echekwa ụdị ọdịnala.
- issue: Mmekọrịta dị n’etiti θεοῦ na πατρὸς ἡμῶν
  choice: Chineke Nna anyị
  alternative: Chineke anyị na Nna
  rationale: Usoro Grik kacha akwado na “Nna anyị” na-akọwa Chineke, ọ bụghị na ọ na-ekewa “Chineke anyị” na “Nna” dịka aha abụọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A gbatịrị ekele Grik na-enweghị ngwaa ka ọ bụrụ usoro ngọzi Igbo “Ka … dịrị unu,” n’enweghị ịgbanwe isi ihe ọ pụtara. Akara ụda dị na “bụ́” na-enyere aka ịmata copula ahụ nke ọma.
