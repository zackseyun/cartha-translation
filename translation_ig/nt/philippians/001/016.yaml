id: PHP.1.16
reference: Philippians 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ μὲν ἐξ ⸂ἀγάπης, εἰδότες ὅτι εἰς ἀπολογίαν τοῦ εὐαγγελίου κεῖμαι⸃,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/016.yaml
  text: The former do so out of love[a], knowing that I am appointed for the defense of the good news[b],
translation:
  language: ig
  text: Ndị nke mbụ na-eme nke a n’ihi ịhụnanya,[a] n’ihi na ha maara na e debere m maka ịgbachitere ozi ọma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “Ndị nke mbụ … n’ihi ịhụnanya”; a ghọtara “na-eme nke a” site n’ihe gbara amaokwu a gburugburu.
    reason: implicit_action
  - marker: b
    text: A pụkwara ịsụgharị ya, “na m nọ ebe a maka ịgbachitere ozi ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν
  choice: Ndị nke mbụ na-eme nke a
  rationale: Nkebi okwu Grik a enweghị ngwaa, ọ na-emekwa ọdịiche na οἱ δέ nke na-esote. A gbakwụnyere “na-eme nke a” site n’ihe gbara amaokwu ahụ gburugburu ka Igbo wee doo anya ma nọgide na-egosi ndị nke mbụ n’otu abụọ ahụ.
- source_word: ἐξ ἀγάπης
  choice: n’ihi ịhụnanya
  rationale: Nke a na-egosi na ịhụnanya bụ ihe kpaliri ha ime ihe ahụ; ọ bụkwa ụzọ Igbo nkịtị si kwuo ἐξ tinyere aha na-egosi ebumnobi.
- source_word: εἰδότες
  choice: n’ihi na ha maara
  rationale: Ọ bụ ezie na Grik ji participle, ntụgharị a na-egosi n’Igbo nke ọma na ihe ha maara bụ ihe mere ha ji mee omume ahụ n’ịhụnanya.
- source_word: εἰς ἀπολογίαν
  choice: maka ịgbachitere
  rationale: ἀπολογία nwere echiche nke ịza ebubo ma ọ bụ ịkọwa ihe n’ụzọ ga-akwado ya; “ịgbachitere” na-edobe echiche ahụ n’asụsụ Igbo doro anya.
- source_word: τοῦ εὐαγγελίου
  choice: ozi ọma
  rationale: “Ozi ọma” na-enye ihe εὐαγγέλιον pụtara n’asụsụ Igbo dị mfe nghọta ma na-ezo aka n’ozi Ndị Kraịst a kpọrọ aha n’ebe a.
- source_word: κεῖμαι
  choice: e debere m
  rationale: N’ebe a κεῖμαι abụghị nanị ịdina ala; ọ na-egosi na Pọl nọ n’ọnọdụ e nyere ya maka ọrụ ịgbachitere ozi ọma. “E debere m” na-echekwa ma echiche ọnọdụ ma echiche nhọpụta ahụ n’etinyeghị nkọwa karịrị isi okwu Grik.
theological_decisions:
- issue: Ihe κεῖμαι pụtara n’ọnọdụ mkpọrọ Pọl
  choice: e debere m
  alternative: anọ m ebe a
  rationale: “E debere m” na-egosi na ọnọdụ Pọl nwere nzube n’ịgbachitere ozi ọma, ma ọ naghị ekwu kpọmkwem onye debere ya ma ọ bụ kọwaa nkuzi banyere nhọpụta karịa ihe amaokwu ahụ kwuru. E tinyere ntụgharị nke na-elekwasị anya n’ọnọdụ ya n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ mere ngwaa e zoro ezo na Grik ka ọ pụta ìhè, ebe ala ala peeji na-echekwa ụdị okwu Grik ahụ na ụzọ ọzọ e nwere isi ghọta κεῖμαι.
