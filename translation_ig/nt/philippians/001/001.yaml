id: PHP.1.1
reference: Philippians 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος καὶ Τιμόθεος δοῦλοι ⸂Χριστοῦ Ἰησοῦ⸃ πᾶσιν τοῖς ἁγίοις ἐν Χριστῷ Ἰησοῦ τοῖς οὖσιν ἐν Φιλίπποις σὺν ἐπισκόποις καὶ διακόνοις·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/001.yaml
  text: 'Paul and Timothy[a], servants of Messiah Jesus, to all the saints in Messiah Jesus who are in Philippi[c][b], together with the overseers and deacons:'
translation:
  language: ig
  text: 'Pọl na Timoti, ndị ohu[a] nke Mesaya Jizọs[b], nye ndị nsọ niile nọ n’ime Mesaya Jizọs, bụ ndị nọ na Filipaị, ya na ndị nlekọta[c] na ndị dikọn:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị na-eje ozi,” ma ọ bụ “ndị ohu agbụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Kraịst Jizọs.” Okwu Grik Χριστός bụ aha pụtara “Mesaya.”
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya, “ndị bishọp.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: “Ndị ohu” na-egosipụta ọnọdụ mmadụ nọ n’okpuru onye nwe ya karịa okwu sara mbara maka ndị na-eje ozi; nke a na-echekwa ịdị arọ nke δοῦλοι n’ebe a.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Mesaya Jizọs
  rationale: Χριστός bụ utu aha pụtara Mesaya; ịsụgharị ya dị ka “Mesaya” na-echekwa ọrụ ya dị ka utu aha, ebe “Jizọs” ka bụ aha onye.
- source_word: ἁγίοις
  choice: ndị nsọ
  rationale: “Ndị nsọ” bụ okwu Igbo doro anya ma guzosie ike maka ndị e kewapụrụ nye Chineke, ma dabara n’usoro ekele Pọl.
- source_word: ἐν
  choice: n’ime
  rationale: “N’ime” na-echekwa okwu Pọl banyere njikọ ndị kwere ekwe na Mesaya, kama ịgbanwe ya ka ọ bụrụ nanị ịnọnyere ya.
- source_word: τοῖς οὖσιν ἐν Φιλίπποις
  choice: ndị ... nọ ... na Filipaị
  rationale: A haziri nkebi participle ahụ n’ụzọ Igbo si ekwu okwu nke ọma, ma e chekwara ebe ha nọ, ya bụ Filipaị.
- source_word: σὺν
  choice: tinyere
  rationale: “Tinyere” na-egosipụta njikọ na isonyere ndị nlekọta na ndị dikọn n’otu ndị a na-edegara.
- source_word: ἐπισκόποις
  choice: ndị nlekọta
  rationale: Okwu a na-asụgharị ihe okwu Grik ahụ pụtara n’enweghị ibubata nhazi ọkwa ụka nke mechara tolite.
- source_word: διακόνοις
  choice: ndị dikọn
  rationale: N’ihi na e jikọtara ha na ndị nlekọta n’ebe a, “ndị dikọn” na-egosi ọrụ a maara n’ọgbakọ karịa okwu izugbe maka ndị na-eje ozi.
- source_word: πᾶσιν τοῖς ἁγίοις
  choice: ndị nsọ niile
  rationale: Nke a na-echekwa “niile” na usoro adreesị Grik n’Igbo dị mfe ma kwụ ọtọ.
theological_decisions:
- issue: Otú e si asụgharị Χριστός n’usoro ekele Pọl
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: “Mesaya” na-eme ka utu aha Χριστός pụta ìhè; ọ naghị eme ya ka ọ bụrụ aha ọzọ nke Jizọs.
- issue: Otú e si asụgharị δοῦλοι na Ndị Filipaị 1:1
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: “Ndị ohu” na-echekwa echiche nke ịbụ nke onye nwe ha na ịnọ n’okpuru ọchịchị ya, bụ́ ihe δοῦλοι nwere ike nke ọma n’ebe a.
- issue: Ọkwa ἐπίσκοποι n’ọgbakọ
  choice: ndị nlekọta
  alternative: ndị bishọp
  rationale: “Ndị nlekọta” na-asụgharị ọrụ okwu ahụ n’onwe ya ma zere ikpebi na ọ bụ kpọmkwem ọkwa bishọp nke usoro ụka ndị mechara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Na-edegara” na-eme ka usoro adreesị akwụkwọ ozi doo anya n’Igbo, ọ bụ ezie na ngwaa ahụ adịghị n’ahịrị Grik n’onwe ya. E chekwara “n’ime Mesaya Jizọs” iji ghara ime ka echiche njikọ ahụ bụrụ naanị ọnọdụ ebe.
