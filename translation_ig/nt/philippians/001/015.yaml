  to: Ụfọdụ na-ekwusa Mesaya[a] n’ihi anyaụfụ na ịsọ mpi, ma ndị ọzọ na-ekwusa ya n’ihi ezi obi.
  rationale: Replaced “obiọma” with “ezi obi” to express the favorable motive denoted by εὐδοκία more directly, moved the note marker to “Mesaya,” and made the footnote wording more idiomatic. No interpretive or doctrinal expansion has been introduced.
