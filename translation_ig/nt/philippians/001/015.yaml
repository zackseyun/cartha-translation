    text: A pụkwara ịkpọ ya “Kraịst.” Okwu Grik bụ Χριστός (Christos).
    reason: lexical_alternative
  revision_rationale: Replaced “obiọma” with “ezi obi” to express the favorable motive denoted by εὐδοκία more directly, moved the note marker to “Mesaya,” and made the footnote wording more idiomatic. No interpretive or doctrinal expansion has been introduced.
