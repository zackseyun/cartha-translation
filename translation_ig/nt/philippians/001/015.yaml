  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τινὲς μὲν καὶ διὰ φθόνον καὶ ἔριν, τινὲς δὲ καὶ δι’ εὐδοκίαν τὸν Χριστὸν κηρύσσουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/015.yaml
  text: Some indeed proclaim the Messiah because of envy and rivalry[a], but others because of goodwill.
translation:
  language: ig
  text: Ụfọdụ na-ekwusa Mesaya[a] n’ihi anyaụfụ na ịsọ mpi, ma ndị ọzọ na-ekwusa ya n’ihi ezi obi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịkpọ ya “Kraịst.” Okwu Grik bụ Χριστός (Christos).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τινὲς μὲν … τινὲς δὲ
  choice: Ụfọdụ … ma ndị ọzọ
  rationale: Ọ na-egosi ìgwè abụọ e ji tụnyere ibe ha; usoro a bụ Igbo nkịtị ma na-echekwa ọdịiche μέν … δέ.
- source_word: διὰ φθόνον
  choice: n’ihi anyaụfụ
  rationale: διά ya na accusative na-egosi ihe kpatara omume ahụ, ya bụ ebumnuche sitere n’anyaụfụ.
- source_word: ἔριν
  choice: ịsọ mpi
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ịsọ mpi megide ibe ha n’ụzọ na-adịghị mma, ọ bụghị naanị esemokwu n’ozuzu.
- source_word: δι’ εὐδοκίαν
  choice: n’ihi obiọma
  rationale: Ọ na-emegide anyaụfụ na ịsọ mpi, ma na-egosi ezi ọchịchọ ma ọ bụ obi ọma n’ebe onye ọzọ nọ.
- source_word: τὸν Χριστόν
  choice: Mesaya
  rationale: Χριστός bụ aha ọkwá nke pụtara Onye E Tere Mmanụ; “Mesaya” na-echekwa ọrụ ya dịka aha ọkwá n’ebe a.
- source_word: κηρύσσουσιν
  choice: na-ekwusa
  rationale: “Na-ekwusa” na-egosi ime ka ozi mara n’ihu ọha ma dabara n’echiche heraldic nke κηρύσσω.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dịka Mesaya ka ọ bụ Kraịst
  choice: Mesaya
  alternative: Kraịst
  rationale: Edemede Grik ji article mee ka Χριστός pụta dịka aha ọkwá. “Mesaya” na-eme ka ihe aha ọkwá ahụ pụtara doo anya, ebe “Kraịst” ka bụ ụzọ ọdịnala a pụrụ isi kpọọ ya.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma nwee ugwu. E meghachiri “na-ekwusa” n’ahịrịokwu nke abụọ iji mee ka njikọ ya doo anya n’Igbo; “ya” na-ezo aka na Mesaya. Akara ndetu [a] dị n’isiokwu ma na-enye ụdị aha ọdịnala ọzọ.
