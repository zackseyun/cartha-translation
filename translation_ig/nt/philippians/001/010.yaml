id: PHP.1.10
reference: Philippians 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τὸ δοκιμάζειν ὑμᾶς τὰ διαφέροντα, ἵνα ἦτε εἰλικρινεῖς καὶ ἀπρόσκοποι εἰς ἡμέραν Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/010.yaml
  text: so that you may approve the things that are excellent[a], in order that you may be pure and blameless for the day of Messiah[b],
translation:
  language: ig
  text: ka unu wee nyochaa ma kwado ihe ndị ka mma[a], ka unu wee bụrụ ndị dị ọcha na ndị a na-apụghị ịta ụta maka ụbọchị Mesaịa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị: “nyochaa ma kwado ihe ndị dị mkpa,” “nyochaa ma kwado ihe ndị kachasị mma,” ma ọ bụ, n''ụzọ ka nso n''okwu Grik: “nyochaa ma kwado ihe ndị dị iche.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nsụgharị ọdịnala: “maka ụbọchị Kraịst.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δοκιμάζειν
  choice: nyochaa ma kwado
  rationale: Ngwaa Grik a gụnyere ile ihe ule ma ọ bụ nyochaa ya, nakwa ịkwado ya mgbe a chọpụtara na ọ dị mma. Okwu abụọ a jikọtara ọnụ na-eme ka echiche abụọ ahụ pụta ìhè n'Igbo dị mfe nghọta.
- source_word: τὰ διαφέροντα
  choice: ihe ndị ka mma
  rationale: N'ụzọ nkịtị, ọ bụ ‘ihe ndị dị iche,’ ma n'okwu a ọ na-ezo aka n'ihe ndị ka ibe ha mma ma ọ bụ ndị dị mkpa karịa. ‘Ihe ndị ka mma’ na-echekwa ike ntụnyere ahụ n'Igbo nkịtị.
- source_word: εἰλικρινεῖς
  choice: ndị obi ha dị ọcha
  rationale: Ọ nwere ike ịpụta ịdị ọcha ma ọ bụ ezi obi. Akpaala okwu Igbo a na-egosi ịdị ọcha n'omume na ezi obi, ma ọ naghị emechi ụzọ n'otu naanị n'ime echiche ndị ahụ.
- source_word: ἀπρόσκοποι
  choice: ndị a na-apụghị ịta ụta
  rationale: Okwu ahụ nwere ike ịpụta ndị na-adịghị asụ ngọngọ ma ọ bụ ndị na-adịghị eme ka ndị ọzọ sụọ ngọngọ. Nsụgharị a na-enye echiche sara mbara nke ndụ na-enweghị ihe kwesịrị ịta ụta.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: maka ụbọchị Mesaịa
  rationale: εἰς na-egosi ebumnuche ma ọ bụ nkwadebe chere ụbọchị ahụ ihu; ‘maka’ na-egosipụta nke a nke ọma. Χριστός bụ aha-ọrụ ebe a, ya mere e ji ‘Mesaịa’ chekwaa ihe aha-ọrụ ahụ pụtara.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n'ahịrịokwu gbasara ụbọchị ikpeazụ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N'ebe a Χριστός na-arụ ọrụ dị ka aha-ọrụ nke Onye E Tere Mmanụ, ọ bụghị naanị dị ka aha mmadụ. ‘Mesaịa’ na-eme ka ihe aha-ọrụ ahụ pụtara doo anya; e debere ‘Kraịst’ n'okpuru ederede n'ihi na ọ bụ nsụgharị ọdịnala ndị na-agụ Igbo maara nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ chekwara usoro ebumnuche abụọ dị na Grik (‘ka… ka…’), ma zere ịkọwa kpọmkwem ma ἀπρόσκοποι ọ bụ ịghara ịsụ ngọngọ ka ọ bụ ịghara ime ka onye ọzọ sụọ ngọngọ.
