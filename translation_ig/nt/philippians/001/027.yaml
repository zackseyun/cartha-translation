revisions:
- from: Naanị, na-ebinụ ndụ unu n’ụzọ kwesịrị ozi ọma nke Mesaịa[b], [a]ka, ma m bịara hụ unu ma ọ bụ m anọghị, m wee nụ akụkọ banyere unu na unu na-eguzosi ike n’otu mmụọ[c], were otu mkpụrụ obi[d] na-agbakọ mbọ ọnụ maka okwukwe nke ozi ọma[e].
  to: Naanị, na-ebinụ ndụ unu[a] n’ụzọ kwesịrị ozi ọma nke Mesaịa[b], ka, ma m bịara hụ unu ma ọ bụ m anọghị, m nụ akụkọ banyere unu na unu na-eguzosi ike n’otu mmụọ[c], jiri otu mkpụrụ obi[d] na-agbakọ mbọ ọnụ maka okwukwe nke ozi ọma[e].
  rationale: The revision repairs the misplaced footnote anchor, expresses the Greek purpose clause naturally with “ka m nụ,” and improves the participial unity-and-striving phrase without resolving the ambiguity of “one spirit” or the gospel-faith genitive.
  reviewer_model: gpt-5.6-terra
