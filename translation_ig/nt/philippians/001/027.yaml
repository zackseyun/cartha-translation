id: PHP.1.27
reference: Philippians 1:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μόνον ἀξίως τοῦ εὐαγγελίου τοῦ Χριστοῦ πολιτεύεσθε, ἵνα εἴτε ἐλθὼν καὶ ἰδὼν ὑμᾶς εἴτε ἀπὼν ⸀ἀκούω τὰ περὶ ὑμῶν, ὅτι στήκετε ἐν ἑνὶ πνεύματι, μιᾷ ψυχῇ συναθλοῦντες τῇ πίστει τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/027.yaml
  text: Only conduct yourselves in a manner worthy of the gospel of Messiah[a], so that whether I come and see you or am absent, I may hear about you that you are standing firm in one spirit, with one soul striving together for the faith of the gospel[e][d][c][b],
translation:
  language: ig
  text: Naanị, na-ebinụ ndụ unu[a] n’ụzọ kwesịrị ozi ọma nke Mesaịa[b], ka, ma m bịara hụ unu ma ọ bụ m anọghị, m nụ akụkọ banyere unu na unu na-eguzosi ike n’otu mmụọ[c], jiri otu mkpụrụ obi[d] na-agbakọ mbọ ọnụ maka okwukwe nke ozi ọma[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa Grik a nwekwara echiche metụtara ịbụ nwa amaala; n’ụzọ nkịtị, ‘na-ebinụ dịka ụmụ amaala.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘Kraịst.’
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, ‘n’otu Mmụọ,’ ya bụ, Mmụọ Nsọ.
    reason: alternative_reading
  - marker: d
    text: Ma ọ bụ, ‘jiri otu uche.’
    reason: lexical_alternative
  - marker: e
    text: Ma ọ bụ, ‘na-agbakọ mbọ ọnụ maka ikwere n’ozi ọma.’
    reason: alternative_reading
lexical_decisions:
- source_word: Μόνον
  choice: Naanị
  rationale: E debere ya n’isi ahịrịokwu dịka o si dị na Grik, iji gosipụta ike nke otu ndụmọdụ a.
- source_word: ἀξίως
  choice: n’ụzọ kwesịrị
  rationale: Nke a na-egosi na okwu ahụ na-akọwa otú ha ga-esi ebi ndụ, ọ bụghị na ha ga-enweta uru site n’omume ha.
- source_word: πολιτεύεσθε
  choice: na-ebinụ ndụ unu
  rationale: Nke a bụ Igbo doro anya maka omume na ụzọ ndụ mmadụ; nkọwa ala peeji na-echekwa ndabere okwu ahụ gbasara ibi dịka ụmụ amaala.
- source_word: εὐαγγελίου
  choice: ozi ọma
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke a na-amakarị maka εὐαγγέλιον.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka aha ọkwa nke Onye E Tere Mmanụ, ya mere ‘Mesaịa’ na-echekwa ihe aha ahụ pụtara.
- source_word: ἀκούω τὰ περὶ ὑμῶν
  choice: m wee nụ akụkọ banyere unu
  rationale: Ọ bụ ụzọ Igbo sitere n’okike nke na-egosipụta akpaalaokwu Grik ahụ n’enweghị ntụgharị siri ike.
- source_word: στήκετε
  choice: unu na-eguzosi ike
  rationale: Nke a na-echekwa ihe oyiyi nke iguzo nakwa echiche nke ịnọgide n’atụghị egwu.
- source_word: ἐν ἑνὶ πνεύματι
  choice: n’otu mmụọ
  rationale: Mkpụrụedemede nta na-adabara ịdị n’otu nke ndị kwere ekwe n’akụkụ ‘otu mkpụrụ obi,’ ma nkọwa ala peeji na-ahapụ ohere na ọ pụrụ ịbụ Mmụọ Nsọ.
- source_word: μιᾷ ψυχῇ
  choice: were otu mkpụrụ obi
  rationale: Nke a na-echekwa ihe oyiyi doro anya nke ψυχή kama ịgbanwe ya ozugbo ka ọ bụrụ naanị uche.
- source_word: συναθλοῦντες
  choice: na-agbakọ mbọ ọnụ
  rationale: Ọ na-egosipụta ịlụ ọgụ ma ọ bụ ịgba mbọ dịka ndị nọ n’otu ìgwè, n’Igbo a na-aghọta nke ọma.
- source_word: τῇ πίστει τοῦ εὐαγγελίου
  choice: maka okwukwe nke ozi ọma
  rationale: Nke a na-anọ Grik nso ma hapụ mmekọrịta dị n’etiti ‘okwukwe’ na ‘ozi ọma’ ka ọ ghara ịbụ nke a kọwara gabiga ihe odide ahụ.
theological_decisions:
- issue: Ma πνεύματι ọ na-ezo aka na mmụọ ịdị n’otu nke ndị kwere ekwe ka ọ bụ Mmụọ Nsọ
  choice: n’otu mmụọ
  alternative: n’otu Mmụọ
  rationale: Njikọ ya na ‘otu mkpụrụ obi’ na-akwado echiche ịdị n’otu na otu mkpebi, ma ihe odide ahụ anaghị ewepụ ohere na ọ na-ezo aka na Mmụọ Nsọ.
- issue: Mmekọrịta genitive dị na τῇ πίστει τοῦ εὐαγγελίου
  choice: maka okwukwe nke ozi ọma
  alternative: maka ikwere n’ozi ọma
  rationale: Isi ntụgharị na-echekwa nhazi na mgbagwoju anya nke Grik; ntụgharị ọzọ na-akọwa ya dịka okwukwe a tụkwasịrị n’ozi ọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe oyiyi nke iguzosi ike, otu mkpụrụ obi, na ịgbakọ mbọ ọnụ. E tinyere akara nkọwa ala peeji niile [a] ruo [e] n’ahịrịokwu isi.
