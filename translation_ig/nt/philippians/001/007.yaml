revisions:
- from: Ọ bụ ihe ziri ezi ka m nwee echiche a banyere unu niile[a], n’ihi na enwere m unu n’obi m. Ma mgbe m nọ n’agbụ ma mgbe m na-agbachitere oziọma ahụ ma na-eme ka o guzosie ike, unu niile bụ ndị mụ na ha na-eketa amara.
  to: Ọ bụkwa ihe ziri ezi ka m nwee echiche dị otú a banyere unu niile[a], n’ihi na ana m ebu unu n’obi m; ma n’agbụ m ma n’ịgbachitere na n’ime ka oziọma ahụ guzosie ike, unu niile bụ ndị mụ na ha na-eketa amara.
  rationale: The revision restores the Greek both-and coordination and makes the heart-clause idiomatic in Standard Igbo. It retains the source’s ambiguity through the existing footnote and does not define “grace” more narrowly than the text does.
