id: PHP.1.7
reference: Philippians 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθώς ἐστιν δίκαιον ἐμοὶ τοῦτο φρονεῖν ὑπὲρ πάντων ὑμῶν, διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς, ἔν τε τοῖς δεσμοῖς μου καὶ ἐν τῇ ἀπολογίᾳ καὶ βεβαιώσει τοῦ εὐαγγελίου συγκοινωνούς μου τῆς χάριτος πάντας ὑμᾶς ὄντας·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/007.yaml
  text: For it is right for me to think this about all of you[a], because I have you in my heart, since both in my chains and in the defense and confirmation of the gospel[b], all of you are fellow partakers with me of grace.
translation:
  language: ig
  text: Ọ bụkwa ihe ziri ezi ka m nwee echiche dị otú a banyere unu niile[a], n’ihi na ana m ebu unu n’obi m; ma n’agbụ m ma n’ịgbachitere na n’ime ka oziọma ahụ guzosie ike, unu niile bụ ndị mụ na ha na-eketa amara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na unu nwere m n’obi unu.” A pụrụ ịghọta ahịrịokwu Grik ahụ n’ụzọ abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιον
  choice: ihe ziri ezi
  rationale: Na-egosi na echiche Pọl banyere ha kwesịrị ekwesị ma bụrụ nke ziri ezi, n’asụsụ Igbo dị mfe ma kwanyere ugwu.
- source_word: φρονεῖν
  choice: nwee echiche a
  rationale: Na-eburu echiche nke iche echiche na inwe ọnọdụ obi ma ọ bụ uche kwụsiri ike, n’enweghị ibelata ya ka ọ bụrụ naanị mmetụta.
- source_word: ὑπὲρ πάντων ὑμῶν
  choice: banyere unu niile
  rationale: N’ebe a ὑπέρ jikọtara na φρονεῖν pụtara echiche Pọl banyere ndị Filipaị niile.
- source_word: διὰ τὸ ἔχειν με ἐν τῇ καρδίᾳ ὑμᾶς
  choice: n’ihi na enwere m unu n’obi m
  rationale: Nke a bụ ọgụgụ dabara nke ọma na okwu ịhụnanya Pọl, ma e debere ọgụgụ ọzọ enwere ike na nkọwa ala peeji.
- source_word: δεσμοῖς
  choice: agbụ
  rationale: Na-echekwa ihe atụ doro anya nke agbụ mkpọrọ dị na okwu Grik, kama ịsụgharị ya naanị dịka ịnọ n’ụlọ mkpọrọ.
- source_word: ἀπολογίᾳ
  choice: na-agbachitere
  rationale: Na-egosi ọrụ Pọl nke ịza ebubo ma ọ bụ igosi na oziọma ahụ bụ eziokwu.
- source_word: βεβαιώσει
  choice: na-eme ka o guzosie ike
  rationale: Nkebiokwu a bụ Igbo ebumpụta ụwa nke na-egosi ime ka eziokwu na ọnọdụ oziọma ahụ sie ike.
- source_word: συγκοινωνούς
  choice: ndị mụ na ha na-eketa
  rationale: Na-egosi ikere òkè ọnụ n’ụzọ dị mfe ma na-ezere nkwughachi na-adịghị mkpa.
- source_word: χάριτος
  choice: amara
  rationale: Amara bụ okwu Igbo a na-ahụkarị maka χάρις ma na-echekwa ibu mmụta okpukpe nke okwu ahụ.
theological_decisions:
- issue: Ihe abụọ ahịrịokwu banyere obi nwere ike ịpụta
  choice: enwere m unu n’obi m
  alternative: unu nwere m n’obi unu
  rationale: N’ihi na με na ὑμᾶς abụọ dị n’ọnọdụ accusative n’akụkụ ἔχειν, a pụrụ ịghọta ahịrịokwu ahụ n’ụzọ abụọ. Isi ederede họọrọ nke dabara nke ọma na ịhụnanya Pọl gosiri n’okwu gbara ya gburugburu, ma nkọwa ala peeji chekwara nke ọzọ.
- issue: Ihe amara a na-ekekọrịta gụnyere
  choice: ekwughị kpọmkwem ma ọ bụ naanị ọrụ oziọma, ahụhụ, ma ọ bụ amara nzọpụta
  alternative: ịkọwa amara ahụ kpọmkwem dịka otu n’ime ihe ndị ahụ
  rationale: Ederede Grik hapụrụ oke okwu χάριτος sara mbara; ya mere nsụgharị ekwesịghị itinye nkọwa okpukpe karịrị ihe e dere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “oziọma” na “amara” mee ihe dịka okwu Baịbụl a maara nke ọma; e zere usoro okwu Bekee siri ike.
