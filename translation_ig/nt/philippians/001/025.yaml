id: PHP.1.25
reference: Philippians 1:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τοῦτο πεποιθὼς οἶδα ὅτι μενῶ καὶ ⸀παραμενῶ πᾶσιν ὑμῖν εἰς τὴν ὑμῶν προκοπὴν καὶ χαρὰν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/025.yaml
  text: And convinced of this[a], I know that I will remain and continue with all of you for your progress and joy in the faith,
translation:
  language: ig
  text: N'ịbụ onye kwenyesiri ike banyere nke a, ama m na m ga-anọgide, m ga-anọnyekwa unu niile, maka ọganihu unu na ọṅụ unu n'okwukwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọṅụ nke okwukwe” ma ọ bụ “ọṅụ nke sitere n'okwukwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεποιθὼς
  choice: kwenyesiri ike
  rationale: Ụdị okwu a na-egosi nkwenye siri ike nke dịgideworo; “kwenyesiri ike” na-ekwupụta ya n'Igbo nkịtị ma dị ùgwù.
- source_word: μενῶ
  choice: ga-anọgide
  rationale: Ọ na-edobe echiche nke ịnọgide ma na-egosikwa ọdịnihu nke ngwaa Grik ahụ.
- source_word: παραμενῶ
  choice: nọnyekwa unu niile
  rationale: Ngwaa a na-agbakwụnye echiche nke ịnọgide n'akụkụ ha; “nọnyekwa” na-eme ka ọ dị iche ntakịrị na μενῶ ma bụrụ Igbo sitere n'okike.
- source_word: πᾶσιν ὑμῖν
  choice: unu niile
  rationale: Ọ na-edobe πᾶσιν nke pụtara mmadụ niile n'enweghị onye e wepụrụ.
- source_word: προκοπὴν
  choice: ọganihu
  rationale: “Ọganihu” na-egosi ịga n'ihu ma ọ bụ ito eto, nke dabara n'ọnọdụ a.
- source_word: χαρὰν τῆς πίστεως
  choice: ọṅụ unu n'okwukwe
  rationale: Nhọrọ a bụ Igbo doro anya nke na-ejikọta ọṅụ ahụ na ndụ okwukwe, ma ihe odide ala peeji na-echekwa ụzọ ndị ọzọ e nwere ike isi ghọta njikọ genitive ahụ.
- source_word: πίστεως
  choice: okwukwe
  rationale: N'ebe a πίστις na-ezo aka ná ndụ ha nke ikwere; “okwukwe” bụ okwu Igbo kwesịrị ekwesị ma bụrụ nke a na-aghọta nke ọma.
theological_decisions:
- issue: Ihe genitive pụtara na χαρὰν τῆς πίστεως
  choice: ọṅụ unu n'okwukwe
  alternative: ọṅụ nke okwukwe; ọṅụ nke sitere n'okwukwe
  rationale: Nhazi okwu Grik ahụ nwere ike igosi ọṅụ dị n'ime okwukwe, ọṅụ nke okwukwe, ma ọ bụ ọṅụ sitere n'okwukwe. Isi ihe odide họọrọ okwu Igbo sitere n'okike, ebe ihe odide ala peeji na-echekwa nghọta ndị ọzọ n'enweghị ikpebi otu naanị ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma dị ùgwù. E debere ngwaa abụọ μενῶ na παραμενῶ iche dịka “ga-anọgide” na “nọnyekwa,” ma zere itinye echiche ‘ịnọgide ndụ’ nke na-apụtaghị kpọmkwem n'amaokwu ahụ.
