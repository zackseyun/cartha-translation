id: PHP.1.29
reference: Philippians 1:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ὑμῖν ἐχαρίσθη τὸ ὑπὲρ Χριστοῦ, οὐ μόνον τὸ εἰς αὐτὸν πιστεύειν ἀλλὰ καὶ τὸ ὑπὲρ αὐτοῦ πάσχειν),
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/029.yaml
  text: For it has been graciously granted to you on behalf of Messiah not only to believe in him[a], but also to suffer for him[d][c][b],
translation:
  language: ig
  text: N’ihi na e jiri amara nye unu, n’ihi Mezaịa[d], ọ bụghị naanị ka unu kwere na ya[a], kama unu taakwa ahụhụ n’ihi ya[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “tụkwasị ya obi.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “maka ya.”
    reason: lexical_alternative
  - marker: c
    text: 'N’asụsụ Grik, otu okwu ahụ, ὑπέρ, dị n’akụkụ abụọ a: n’ihi Mezaịa na ịta ahụhụ n’ihi ya.'
    reason: source_structure
  - marker: d
    text: A pụkwara ịhazi akụkụ a, “N’ihi Mezaịa, e jiri amara nye unu ...” A pụkwara ịkpọ “Mezaịa” “Kraịst”; Χριστός bụ utu aha n’ebe a.
    reason: lexical_and_structural_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ebe a, okwu a na-akọwa ihe mere ndị kwere ekwe ji kwesị iguzosi ike n’atụghị egwu, dị ka amaokwu bu ụzọ si kwuo.
- source_word: ἐχαρίσθη
  choice: e jiri amara nye unu
  rationale: Nhọrọ a na-egosi na ihe ahụ bụ onyinye e nyere n’amara, ọ bụghị naanị ikike e nyere ha.
- source_word: τὸ ὑπὲρ Χριστοῦ
  choice: n’ihi Mezaịa
  rationale: ὑπέρ na-egosi na Mezaịa bụ onye ihe ndị a metụtara na onye a na-eme ha n’ihi ya. A họọrọ “Mezaịa” iji gosipụta na Χριστός bụ utu aha.
- source_word: πιστεύειν εἰς αὐτόν
  choice: ka unu kwere na ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-ejikarị ekwu maka itinye okwukwe n’ime mmadụ.
- source_word: πάσχειν
  choice: ka unu taakwa ahụhụ
  rationale: Ọ na-enye kpọmkwem ihe infinitive Grik pụtara, ebe “-kwa” na-echekwa njikọ nke οὐ μόνον ... ἀλλὰ καί, ya bụ, “ọ bụghị naanị ... kama ... kwa.”
- source_word: ὑπὲρ αὐτοῦ
  choice: n’ihi ya
  rationale: Nke a na-egosi ịta ahụhụ n’ihi Mezaịa ma ọ bụ n’ihi ihe metụtara ya, na-enweghị ịgbasa okwu karịa ihe Grik kwuru.
theological_decisions:
- issue: Ma a ga-eme ka okwu ahụ na-egosi na ma ikwere ma ịta ahụhụ bụ ihe e nyere n’amara ghara ịdị ike
  choice: E debere okwu onyinye amara ka ọ metụta ma ikwere na Mezaịa ma ịta ahụhụ n’ihi ya.
  alternative: Ịsụgharị ya dịka nanị na e nyere ha ohere, ma ọ bụ ịhazi ahịrịokwu ahụ ka ọ ghara ịpụta na onyinye ahụ gụnyere ihe abụọ ahụ.
  rationale: Usoro Grik tinyere infinitive abụọ ahụ n’okpuru ἐχαρίσθη. Ya mere, nsụgharị ahụ kwesịrị ịhapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị, ọ bụghị idozi ya n’ụzọ na-adịghị n’ihe odide.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “E jiri amara nye” na-echekwa echiche onyinye dị na χαρίζομαι, ebe “Mezaịa” na-egosi utu aha Χριστός; “Kraịst” dị na nkọwa ala peeji dịka okwu ọzọ a na-ejikarị eme ihe.
