  yaml_path: translation/nt/philippians/001/030.yaml
  text: having the same struggle that you saw in me and now hear that I still have.
translation:
  language: ig
  text: Unu na-enwe otu mgba ahụ, dị ka unu hụrụ n’ime m, nakwa dịka unu na-anụ ugbu a banyere m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγῶνα
  choice: ọgụ
  rationale: N'ebe a, okwu ahụ na-ezo aka na mgba siri ike n'ihi ozi ọma, ọ bụghị naanị esemokwu ma ọ bụ ọgụ anụ ahụ.
- source_word: ἔχοντες
  choice: unu na-alụ
  rationale: N'Igbo, 'ịlụ ọgụ' na-egosi nke ọma na ha so n'otu mgba ahụ; ntụgharị nkịtị dịka 'inwe ọgụ' agaghị ada ka Igbo eke.
- source_word: τὸν αὐτὸν
  choice: otu ... ahụ
  rationale: Na-egosi na mgba ndị Filipaị na nke Pọl bụ otu ụdị mgba ahụ.
- source_word: ἐν ἐμοί
  choice: ka m na-alụ / na m ka na-alụ
  rationale: Okwu Grik ahụ pụtara n'ụzọ nkịtị 'n'ime m' ma n'ọnọdụ a na-ezo aka n'ọgụ a hụrụ na nke a na-anụ na Pọl na-alụ; a sụgharịrị ya n'ụzọ Igbo doro anya.
theological_decisions:
- issue: Ma νῦν ἀκούετε ἐν ἐμοί na-ekwu na ha na-anụ banyere ọnọdụ Pọl ugbu a
  choice: nke unu na-anụkwa ugbu a na m ka na-alụ
  alternative: nke unu na-anụkwa ugbu a n'ime m
  rationale: Nhọrọ a na-edobe echiche nke mgba Pọl ka na-aga n'ihu ma na-eme ka ahịrịokwu ahụ bụrụ Igbo eke, n'enweghị itinye nkọwa gbasara ụdị mkpagbu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji 'unu' mee ka onye a na-agwa n'ụdị ọtụtụ pụta ìhè; e debere ahịrịokwu ahụ dịka akụkụ na-aga n'ihu site n'amaokwu 29.
