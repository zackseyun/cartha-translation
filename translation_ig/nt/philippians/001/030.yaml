- from: unu na-alụ otu ọgụ ahụ unu hụrụ ka m na-alụ, nke unu na-anụkwa ugbu a na m ka na-alụ.
  to: Unu na-enwe otu mgba ahụ, dị ka unu hụrụ n’ime m, nakwa dịka unu na-anụ ugbu a banyere m.
  rationale: The revision retains the participial sense of ἔχοντες (‘having/experiencing’), renders τὸν αὐτὸν ἀγῶνα as ‘otu mgba ahụ,’ and uses balanced comparative clauses for οἷον ... καὶ νῦν. “Banyere m” is an idiomatic contextual rendering of the second ἐν ἐμοί, indicating that what they hear concerns Paul’s ongoing conflict without inserting ‘still’ or specifying its form.
  reviewer_model: gpt-5.6-terra
