source:
  edition: SBLGNT
  text: πεπληρωμένοι ⸂καρπὸν δικαιοσύνης τὸν⸃ διὰ Ἰησοῦ Χριστοῦ εἰς δόξαν καὶ ἔπαινον θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/011.yaml
  text: filled with the fruit of righteousness that comes through Jesus the Messiah[b][a], to the glory and praise of God.
translation:
  language: ig
  text: jupụtakwa na mkpụrụ nke ezi omume[a] nke sitere n'aka Jizọs, bụ Mesaịa[b], maka ebube na otuto Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ nke ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Jizọs Kraịst”; “Mesaịa” na-atụgharị Christos dị ka utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένοι
  choice: jupụtakwa
  rationale: Okwu a bụ participle zuru oke nke na-egosi ọnọdụ sitere n’ihe mezuru emezu; “jupụtakwa” na-ejikọta ya nke ọma na ekpere dị n’ahịrịokwu bu ya ụzọ ma na-egosi ịnọ n’ọnọdụ nke ijupụta.
- source_word: καρπὸν
  choice: mkpụrụ
  rationale: “Mkpụrụ” na-edobe ihe atụ nke ihe ndụ ma ọ bụ omume mmadụ na-amịpụta.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: N’ebe a, “ezi omume” bụ okwu Igbo doro anya maka ịdị ndụ n’ụzọ ziri ezi, ma ọ naghị ekpebi kpọmkwem ụdị njikọ genitive ahụ; e debere “ikpe ziri ezi” dị ka nhọrọ ọzọ n’ala peeji.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: nke na-abịa site na Jizọs bụ Mezaya
  rationale: “Site na” na-egosi ụzọ ma ọ bụ onye e si n’aka ya nweta mkpụrụ ahụ; “bụ Mezaya” na-egosipụta Χριστός dị ka utu aha n’Igbo dị mfe nghọta.
- source_word: εἰς δόξαν καὶ ἔπαινον θεοῦ
  choice: iji wetara Chineke ebube na otuto
  rationale: “Iji wetara” na-egosipụta ebumnuche ma ọ bụ nsonaazụ nke εἰς, ebe “ebube na otuto” na-edobe okwu abụọ dị iche n’asụsụ Grik.
theological_decisions:
- issue: Ihe “mkpụrụ ezi omume” pụtara
  choice: E debere ya dị ka “mkpụrụ ezi omume,” nke nwere ike ịbụ mkpụrụ e ji ezi omume mara ma ọ bụ mkpụrụ nke bụ ezi omume.
  alternative: Ịkọwa ya kpọmkwem dị ka omume ọma ndị Mezaya na-eme ka ndị kwere ekwe rụọ, ma ọ bụ dị ka ezi omume a na-agụnyere ha.
  rationale: Njikọ genitive dị na καρπὸν δικαιοσύνης nwere ike ịpụta ihe karịrị otu ihe. Nsụgharị ahụ na-edobe ihe atụ na mgbagwoju anya ahụ kama ịkọwa otu nkọwa naanị.
- issue: Χριστός dị ka utu aha
  choice: Jizọs bụ Mezaya
  alternative: Jizọs Kraịst
  rationale: “Mezaya” na-eme ka ihe utu aha Χριστός pụtara pụta ìhè, ebe usoro “Jizọs bụ Mezaya” bụ Igbo nkịtị nke na-egosi onye Jizọs bụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ malitere n’obere mkpụrụedemede ma jiri “-kwa” n’ihi na ọ na-aga n’ihu n’ahịrịokwu malitere n’amaokwu bu ụzọ.
