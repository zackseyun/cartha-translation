  text: τὸ δὲ ἐπιμένειν ⸀ἐν τῇ σαρκὶ ἀναγκαιότερον δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/001/024.yaml
  text: But to remain in the flesh is more necessary for your sake[a].
translation:
  language: ig
  text: Ma ịnọgide n’anụ ahụ dị mkpa karịa maka unu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịga n’ihu ịdị ndụ n’anụ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἐπιμένειν
  choice: ịnọgide
  rationale: Aha-ngwaa nwere άρθρον a pụtara ịnọgide ma ọ bụ ịga n’ihu ịnọ ndụ; “ịnọgide” bụ Igbo dị mfe ma na-edobe isi okwu Pọl banyere ịga n’ihu n’ụwa a.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị dị iche n’echiche bu ụzọ banyere ịpụ gaa ịnọnyere Kraịst.
- source_word: ἐν τῇ σαρκὶ
  choice: n’anụ ahụ
  rationale: N’ebe a σάρξ na-ezo aka ná ndụ mmadụ n’ahụ n’ụwa, ọ bụghị n’ọchịchọ mmehie. Nsụgharị a na-edobe okwu ihe odide Gris.
- source_word: ἀναγκαιότερον
  choice: dị mkpa karịa
  rationale: Ọ na-edobe ụdị ntụnyere dị na okwu Gris ma bụrụkwa okwu Igbo doro anya.
- source_word: δι’ ὑμᾶς
  choice: n’ihi unu
  rationale: N’okwu gbara ya gburugburu, nkebi a na-egosi na ịnọgide Pọl ga-abara ndị Filipaị uru; “n’ihi unu” na-edobe ma ihe kpatara ya ma echiche nke uru ha.
theological_decisions:
- issue: Ihe σάρξ pụtara n’amaokwu a
  choice: ndụ mmadụ n’anụ ahụ (“n’anụ ahụ”)
  alternative: ọchịchọ mmehie; ma ọ bụ nkọwa sara mbara, “ịnọgide ndụ n’ụwa a”
  rationale: Ihe gbara amaokwu a gburugburu na-egosi ọdịiche dị n’etiti ịpụ gaa ịnọnyere Kraịst na ịnọgide ndụ n’anụ ahụ maka uru ndị Filipaị. Ịsụgharị ya dịka ọchịchọ mmehie ga-etinye echiche na-adịghị n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “N’anụ ahụ” na-edobe ihe atụ okwu Gris, ebe nkọwa ala peeji na-eme ka echiche nke ịnọgide ndụ doo anya.
