  yaml_path: translation/nt/philippians/002/018.yaml
  text: In the same way[a], you also rejoice and rejoice with me.
translation:
  language: ig
  text: N'otu aka ahụ[a], unu kwa ṅụrịanụ ọṅụ, sorokwanụ m ṅụrịa ọṅụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N'otu aka ahụ, unu kwa nweenụ obi ụtọ ma soro m kerịta ọṅụ unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ αὐτὸ
  choice: N’otu aka ahụ
  rationale: Nkebiokwu a na-arụ ọrụ dị ka adverb, na-atụ aka n’ihe Pọl kwuru n’amaokwu bu ụzọ. “N’otu aka ahụ” bụ Igbo dị mfe ma na-edobe njikọ ahụ; δέ bụ njikọ dị nro nke ekwesịghị ịtụgharị ya iche n’ebe a.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu
  rationale: καί na ὑμεῖς na-egosi na ndị Filipaị kwesịkwara iso mee otu ihe ahụ. “Unu onwe unu” na-egosipụta nkwusi ike nke nnọchiaha ahụ n’Igbo eke.
- source_word: χαίρετε
  choice: ṅụrịanụ ọṅụ
  rationale: Ọ bụ iwu dị n’onye nke abụọ, ọtụtụ mmadụ. “Ṅụrịanụ ọṅụ” na-edobe ike nke ngwaa χαίρω na isiokwu ọṅụ a na-ahụ ugboro ugboro n’akwụkwọ Filipaị.
- source_word: συγχαίρετέ μοι
  choice: sorokwa m ṅụrịakwa ọṅụ
  rationale: Ngwaa mgbakwụnye συγχαίρω pụtara iso onye ọzọ ṅụrịa ọṅụ. Nhazi a na-egosi nke ọma na Pọl bụ onye ha na ya ga-ekekọrịta ọṅụ ahụ, ma na-edobekwa καί nke abụọ.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “ṅụrịanụ ọṅụ” kwado okwu ọṅụ Pọl ji eme ihe ugboro ugboro, ebe “sorokwa m ṅụrịakwa ọṅụ” na-egosipụta ọṅụ a na-ekekọrịta.
