  to: N'otu aka ahụ[a], unu kwa ṅụrịanụ ọṅụ, sorokwanụ m ṅụrịa ọṅụ.
  rationale: 'The revision removes unsupported reflexive emphasis, marks both imperatives as plural, and retains the source’s parallel commands: the readers are to rejoice and to rejoice together with Paul. The footnote is adjusted to match the revised plural imperative wording while retaining the stated lexical alternative.'
