revisions:
- from: Ya mere, ndị m hụrụ n’anya, dị nnọọ ka unu na-erube isi mgbe niile—ọ bụghị naanị mgbe m nọ n’etiti unu, kama karịa nke ukwuu ugbu a m na-anọghị[a]—jiri egwu na ịma jijiji[c] na-arụzunụ nzọpụta nke unu[b].
  to: Ya mere, ndị m hụrụ n’anya, dị nnọọ ka unu na-erube isi mgbe niile—ọ bụghị naanị mgbe m nọ n’etiti unu, kama ugbu a, karịsịa mgbe m na-anọghị n’etiti unu[a]—jiri egwu na ịma jijiji[c] na-arụpụta nzọpụta nke unu[b].
  rationale: The revision replaces an awkward verbal choice, clarifies the syntactic contrast between Paul's presence and absence, and gives footnotes that explain lexical force without imposing a doctrinal resolution absent from the verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential transition, affectionate address, established obedience, the presence/absence contrast, the intensified 'much more,' and the imperative concerning salvation. However, 'na-arụzunụ' is not the most natural or exact rendering of κατεργάζεσθε here; 'na-arụpụta' more directly conveys carrying something through to its outcome. The revised wording also makes Paul's absence parallel to his presence more explicitly.
  naturalness: 'The revised sentence has more idiomatic Standard Igbo word order: ''ugbu a, karịsịa mgbe m na-anọghị n’etiti unu'' clearly modifies the comparative contrast and avoids the somewhat compressed original sequence.'
  terminology: '''Nzọpụta'' appropriately retains the theological weight of σωτηρία, and ''egwu na ịma jijiji'' faithfully retains the conventional, solemn Greek expression. The revised explanatory note avoids deciding beyond the verse itself whether the command concerns earning salvation, while still explaining the verbal sense.'
  issues:
  - severity: medium
    issue: The expression 'na-arụzunụ nzọpụta' is semantically and idiomatically weak for κατεργάζεσθε.
    rationale: '''Rụzuo'' commonly means fulfill or complete, whereas κατεργάζομαι here calls for actively carrying out or bringing to effect. ''Na-arụpụta'' is a more natural Standard Igbo equivalent and preserves the imperative''s force.'
  - severity: low
    issue: The wording of the absence contrast is compressed and less parallel than the Greek.
    rationale: Adding 'mgbe m na-anọghị n’etiti unu' supplies a clear counterpart to 'mgbe m nọ n’etiti unu' without adding meaning.
  - severity: medium
    issue: Footnote b resolves a theological implication more strongly than the verse itself states.
    rationale: The note's assertion that the command 'does not mean earning it' goes beyond a lexical explanation. A neutral explanation of bringing salvation to expression/completion preserves the text's theological tension.
  revised_text: Ya mere, ndị m hụrụ n’anya, dị nnọọ ka unu na-erube isi mgbe niile—ọ bụghị naanị mgbe m nọ n’etiti unu, kama ugbu a, karịsịa mgbe m na-anọghị n’etiti unu[a]—jiri egwu na ịma jijiji[c] na-arụpụta nzọpụta nke unu[b].
