id: PHP.2.12
reference: Philippians 2:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὥστε, ἀγαπητοί μου, καθὼς πάντοτε ὑπηκούσατε, μὴ ὡς ἐν τῇ παρουσίᾳ μου μόνον ἀλλὰ νῦν πολλῷ μᾶλλον ἐν τῇ ἀπουσίᾳ μου, μετὰ φόβου καὶ τρόμου τὴν ἑαυτῶν σωτηρίαν κατεργάζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/012.yaml
  text: So then[a], my beloved, just as you have always obeyed—not only in my presence, but now much more in my absence—work out your own salvation with fear and trembling[c][b],
translation:
  language: ig
  text: Ya mere, ndị m hụrụ n’anya, dị nnọọ ka unu na-erube isi mgbe niile—ọ bụghị naanị mgbe m nọ n’etiti unu, kama ugbu a, karịsịa mgbe m na-anọghị n’etiti unu[a]—jiri egwu na ịma jijiji[c] na-arụpụta nzọpụta nke unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “kama ugbu a, karịsịa mgbe m na-anọghị.”
    reason: lexical_alternative
  - marker: b
    text: “Na-arụpụta” nwere ike ịpụta ịrụ ọrụ n’ihe ruo n’imezu ya, ka nzọpụta ahụ pụta ìhè n’ụzọ ndụ unu.
    reason: alternative_reading
  - marker: c
    text: “Egwu na ịma jijiji” bụ okwu e ji egosi ịdị egwu na ịdị mkpa nke ukwuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu na-esite n’ihe e kwuru banyere Kraịst na ndụ nrubeisi n’amaokwu ndị bu ụzọ.
- source_word: ἀγαπητοί μου
  choice: ndị m hụrụ n’anya
  rationale: Ọ bụ okwu ịhụnanya Pọl ji akpọ ndị ọ na-edegara akwụkwọ; nsụgharị a bụ nke sitere n’obi, dị ùgwù, dịkwa mfe nghọta.
- source_word: καθὼς πάντοτε ὑπηκούσατε
  choice: dị nnọọ ka unu na-erube isi mgbe niile
  rationale: Ọ na-egosi na nrubeisi abụrụla ụzọ ndụ ha ruo oge a, n’enweghị ịgbakwụnye onye e rubere isi ebe Grik ekwughị ya kpọmkwem.
- source_word: παρουσίᾳ / ἀπουσίᾳ
  choice: mgbe m nọ n’etiti unu / ugbu a m na-anọghị
  rationale: E ji ahịrịokwu ndị a mee ka ọdịiche dị n’etiti ịnọ ya na anọghị ya doo anya n’Igbo nkịtị.
- source_word: πολλῷ μᾶλλον
  choice: karịa nke ukwuu
  rationale: Ọ na-echekwa ike nke ntụnyere Grik, nke pụtara ‘ọtụtụ karịa’ ma ọ bụ ‘karịsịa.’
- source_word: μετὰ φόβου καὶ τρόμου
  choice: jiri egwu na ịma jijiji
  rationale: A hapụrụ ike na ịdị oké mkpa nke okwu abụọ ahụ ka ha dị, kama ime ka ha bụrụ naanị nkwanye ùgwù na-enweghị mmetụta miri emi.
- source_word: τὴν ἑαυτῶν σωτηρίαν
  choice: nzọpụta nke unu
  rationale: ‘Nzọpụta’ na-echekwa ịdị arọ nke σωτηρία, ebe ‘nke unu’ na-egosi ọrụ dịịrị ndị a na-agwa okwu n’onwe ha n’enweghị echiche na onye ọ bụla ga-anọrọ naanị ya.
- source_word: κατεργάζεσθε
  choice: na-arụzunụ
  rationale: Ọ na-enye echiche nke ịnọgide na-eme ihe ruo na mmezu ya. Ọ naghị eji okwu Igbo ga-ekwu kpọmkwem na ha ga-azụ ma ọ bụ nweta nzọpụta site n’ọrụ.
theological_decisions:
- issue: Ihe ‘na-arụzunụ nzọpụta nke unu’ pụtara
  choice: A na-agwa ha ka ha na-eme ka nzọpụta metụta ma pụta ìhè n’ụzọ ndụ ha ruo na mmezu ya.
  alternative: Na mmadụ ga-eji ike na ọrụ nke aka ya nweta nzọpụta.
  rationale: κατεργάζεσθε nwere ike ịpụta imezu ma ọ bụ iburu ihe ruo n’isi. Amaokwu na-esote kwuru na Chineke na-arụ ọrụ n’ime ha; n’agbanyeghị nke ahụ, e chekwara iwu siri ike dị n’amaokwu a kama iwepụ esemokwu nkà mmụta okpukpe ahụ.
- issue: Ike okwu ‘egwu na ịma jijiji’
  choice: Egwu nsọ, ịdị umeala n’obi, na iji ihe Chineke kpọrọ ihe kpọrọ ihe nke ukwuu.
  alternative: Ụjọ na-eme ka mmadụ maa jijiji naanị ya, ma ọ bụ nkwanye ùgwù nkịtị na-enweghị ịdị oké mkpa.
  rationale: A hapụrụ ihe atụ okwu Grik ahụ ka ọ dị ike, ebe nkọwa ala peeji na-enyere onye na-agụ aka ịghọta na ọ na-ekwu banyere ọnọdụ mmadụ n’ihu Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu ndị mmadụ na-asụkarị, ma e chekwara usoro ntụnyere, ike iwu, na esemokwu nkà mmụta okpukpe dị n’akwụkwọ Grik.
