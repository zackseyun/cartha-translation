  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πᾶσα γλῶσσα ἐξομολογήσηται ὅτι κύριος Ἰησοῦς Χριστὸς εἰς δόξαν θεοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/011.yaml
  text: and every tongue should confess that Jesus the Messiah is Lord[b][a], to the glory of God the Father.
translation:
  language: ig
  text: ka ire ọ bụla kwupụtakwa[b] na Jizọs bụ́ Mezaịa[a] bụ Onyenwe anyị, maka otuto Chineke Nna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị: “Jizọs Mezaịa bụ Onyenwe anyị.”'
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịsị: “Ka ire ọ bụla kwupụta.”'
    reason: previous_rendering
lexical_decisions:
- source_word: πᾶσα γλῶσσα
  choice: ire ọ bụla
  rationale: Nke a na-edobe ihe atụ ahụ banyere “ire” ma na-egosikwa na nkwupụta ahụ metụtara mmadụ niile.
- source_word: ἐξομολογήσηται
  choice: kwupụta
  rationale: “Kwupụta” na-egosi ikwupụta ihe n’ihu ọha n’etinyeghị nkọwa ọzọ na-adịghị n’asụsụ Grik.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa κύριος n’ụzọ dị nsọ ma na-edobe ịdị arọ nke nkwupụta banyere Jizọs.
- source_word: Χριστός
  choice: Mezaịa
  rationale: Χριστός bụ aha ọkwa nke pụtara Onye E Tere Mmanụ; “Mezaịa” na-eme ka ọrụ ya dị ka aha ọkwa pụta ìhè n’Igbo, kama ile ya anya naanị dị ka aha mmadụ.
- source_word: εἰς δόξαν
  choice: iji nye ... otuto
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi gosi na nkwupụta ahụ na-ewetara Chineke otuto.
- source_word: θεοῦ πατρός
  choice: Chineke Nna
  rationale: Nke a bụ usoro okwu Igbo kwesịrị ekwesị ma doo anya maka Chineke bụ́ Nna.
theological_decisions:
- issue: Otu e si sụgharịa Χριστός n’okwu nkwupụta banyere Jizọs
  choice: Mezaịa
  alternative: Kraịst
  rationale: A họọrọ aha ọkwa a sụgharịrị n’ụzọ na-eme ka ihe Χριστός pụtara pụta ìhè, ma a naghị atụkwasị nkọwa ụka pụrụ iche na ya.
- issue: Mmekọrịta κύριος na Ἰησοῦς Χριστός
  choice: Jizọs bụ́ Mezaịa bụ Onyenwe anyị
  alternative: Jizọs Mezaịa bụ Onyenwe anyị
  rationale: Nke a na-eme ka “Mezaịa” doo anya dị ka aha ọkwa Jizọs, ebe “Onyenwe anyị” ka bụ isi ihe a na-ekwupụta banyere ya.
translation_notes:
  register: E ji asụsụ Igbo izugbe, nke dị ùgwù ma dị mfe nghọta. “Ka” na ụdị ngwaa “kwupụta” na-edobe njikọ ahịrịokwu a na ebumnuche malitere n’amaokwu bu ya ụzọ; “-kwa” na-anọchi καὶ n’ụzọ e ji ekwu Igbo nke ọma.
