    issue: The final prepositional expression is slightly over-interpreted.
    rationale: “Iji nye Chineke Nna otuto” explicitly states that the confession is undertaken in order to give God glory. The Greek εἰς δόξαν more directly expresses the result/aim, “for the glory of God the Father.”
  - severity: low
    issue: Footnote anchors are attached to “Onyenwe anyị” although the notes concern earlier expressions.
    rationale: Footnote b concerns the rendering of the opening confession clause, and footnote a concerns the title “Mezaịa.” Moving each anchor to its pertinent wording makes the notes intelligible and correctly anchored.
