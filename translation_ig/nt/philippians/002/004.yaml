  source_fidelity: The translation accurately conveys the distributive force of ἕκαστοι (“onye ọ bụla n’ime unu”), the contrast-plus-addition of μὴ ... ἀλλὰ καί (“ghara ... naanị ..., kama ... kwa”), and the broad reference of τὰ ἑαυτῶν / τὰ ἑτέρων as personal and others’ concerns rather than possessions alone. It does not wrongly imply total neglect of one’s own concerns.
