id: PHP.2.4
reference: Philippians 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ τὰ ἑαυτῶν ⸀ἕκαστοι ⸀σκοποῦντες, ἀλλὰ καὶ τὰ ἑτέρων ⸁ἕκαστοι.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/004.yaml
  text: Each of you should look not only to your own interests[a], but also to the interests of others.
translation:
  language: ig
  text: Ka onye ọ bụla n’ime unu ghara ilekwasị anya naanị n’ihe gbasara onwe ya,[a] kama ka ọ lekwasịkwa anya n’ihe gbasara ndị ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik: “Ka onye ọ bụla n’ime unu ghara ile naanị ihe nke aka ya anya, kama ka ọ lekwara ihe nke ndị ọzọ anya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοποῦντες
  choice: lekwasị anya
  rationale: Okwu a na-egosi iji nlezianya tụkwasị uche na ihe ma ọ bụ na-elebara ya anya; “lekwasị anya” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: τὰ ἑαυτῶν
  choice: ihe gbasara onwe ya
  rationale: Nkebi okwu Grik a sara mbara karịa naanị ihe onwunwe; ọ gụnyere mkpa, ọdịmma, na ihe ndị metụtara mmadụ n’onwe ya. “Ihe gbasara onwe ya” na-echekwa obosara ahụ.
- source_word: ἕκαστοι
  choice: onye ọ bụla n’ime unu
  rationale: Ọ na-ekesa ndụmọdụ ahụ nye onye nke ọ bụla nọ n’etiti ndị a na-agwa okwu.
- source_word: ἀλλὰ καὶ
  choice: ọ bụghị naanị ... kama ... kwa
  rationale: 'Nhazi a na-egosipụta ma ọdịiche ma mgbakwunye: a naghị asị ka mmadụ hapụ ihe gbasara onwe ya kpamkpam, kama ka ọ lebakwaara nke ndị ọzọ anya.'
- source_word: τὰ ἑτέρων
  choice: ihe gbasara ndị ọzọ
  rationale: Dị ka τὰ ἑαυτῶν, nke a na-ezo aka n’ụzọ sara mbara ná mkpa, ọdịmma, na ihe ndị metụtara ndị ọzọ, ọ bụghị naanị ihe ha nwere.
theological_decisions:
- issue: Ma amaokwu a ọ na-amachibido ilebara ihe gbasara onwe onye anya kpamkpam
  choice: “ọ bụghị naanị ... kama ... kwa”
  alternative: “elekwasịla anya n’ihe gbasara onwe unu, kama...”
  rationale: 'καὶ na nkebi nke abụọ na-akwado nghọta mgbakwunye: onye kwere ekwe ekwesịghị ile naanị ọdịmma nke ya anya, kama ọ ga-elekwa nke ndị ọzọ anya. Nke a na-ezere ime ka amaokwu ahụ bụrụ iwu nke ịhapụ mkpa onwe onye kpamkpam.'
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. E ji otu onye (“onye ọ bụla ... onwe ya ... ka ọ”) chekwaa ike nkesa nke ἕκαστοι, ebe “ihe gbasara” na-ezere ime ka τὰ bụrụ naanị ihe onwunwe.
