  text: τοῦτον μὲν οὖν ἐλπίζω πέμψαι ὡς ἂν ἀφίδω τὰ περὶ ἐμὲ ἐξαυτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/023.yaml
  text: Therefore[a], I hope to send him as soon as I see how things go with me.
translation:
  language: ig
  text: Ya mere, enwere m olileanya iziga ya ozugbo m matara[a] otú ihe si dịịrị m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ozugbo m hụrụ nke ọma ihe ndị metụtara m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Timoti e kwuru okwu ya n'amaokwu ndị bu ụzọ; “ya” bụ ụzọ Igbo si ekwu ya nke ọma karịa “onye a.”
- source_word: μὲν οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ntụgharị nke sitere n'ihe e kwuru tupu ya pụta, n'okwu Igbo doro anya ma kwekọọ n'ọnọdụ a.
- source_word: ἐλπίζω πέμψαι
  choice: enwere m olileanya iziga
  rationale: Nke a na-edobe echiche nke olileanya ma ọ bụ atụmanya dị na ἐλπίζω, tinyere ngwaa iziga.
- source_word: ὡς ἂν ἀφίδω
  choice: ozugbo m matara
  rationale: Nkebiokwu a na-ezo aka n'oge ọdịnihu dabere n'ịmata nke ọma otú ọnọdụ Pọl ga-esi kwụsị; “ozugbo” na-egosipụta oge ahụ n'ụzọ Igbo kwesịrị ekwesị.
- source_word: ἀφίδω
  choice: m matara
  rationale: N'ebe a, ịhụ pụtara ịghọta ma ọ bụ ịmata otú ihe si aga; “matara” na-eme ka nke a doo onye Igbo anya n'enweghị ịgbakwunye nkọwa na-adịghị na isiokwu.
- source_word: τὰ περὶ ἐμέ
  choice: otú ihe si dịịrị m
  rationale: Ọ na-ezo aka n'ọnọdụ na ihe ndị metụtara Pọl; okwu a bụ nke mmadụ nkịtị ga-aghọta ma ọ naghị akpọchi kpọmkwem ihe ga-eme.
- source_word: ἐξαυτῆς
  choice: ozugbo
  rationale: Ọ na-emesi ngwa ngwa ike, ya mere e jikọtara ya na nkebiokwu oge ahụ dị ka “ozugbo.”
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji “matara” mee ka echiche ịhụ/ịghọta n'ọnọdụ a pụta ìhè, ebe ntụaka ala peeji na-edobe nsụgharị nke dị nso n'ụdị okwu Grik.
