  text: but emptied himself[a], taking the form of a servant, becoming in the likeness of men[d][c][b]; and being found in appearance as a man
translation:
  language: ig
  text: kama o mere onwe ya ihe efu[a], were ọdịdị ohu, ghọọ n’oyiyi ụmụ mmadụ[b]; a hụkwara ya n’ọdịdị elu dị ka mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o tọgbọrọ onwe ya n’efu.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik: “ghọọ n’oyiyi ụmụ mmadụ.” Okwu a na-edobe echiche nke ịdị n’oyiyi ụmụ mmadụ, ma ọ pụtaghị na mmadụ ya abụghị nke eziokwu.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: kama
  rationale: Ọ na-egosi ọdịiche siri ike n’ihe e kwuru n’amaokwu bu ụzọ.
- source_word: ἑαυτὸν ἐκένωσεν
  choice: ọ tọgbọrọ onwe ya n’efu
  rationale: Nke a na-edobe ihe atụ dị na κενόω n’enweghị ịkọwa ya site n’ozizi e webatara n’èzí; nkebi ndị so ya na-egosi ụzọ o si mee ya.
- source_word: μορφὴν δούλου λαβών
  choice: were ọdịdị ohu
  rationale: “Ọdịdị” na-edobe njikọ ya na μορφή, ebe “ohu” na-egosi ọnọdụ onye nọ n’okpuru ọchịchị onye ọzọ n’ụzọ Igbo nkịtị ma dị ugwu.
- source_word: ἐν ὁμοιώματι ἀνθρώπων γενόμενος
  choice: ghọọ onye yiri ụmụ mmadụ
  rationale: “Ghọọ” na-anọchi γενόμενος kpọmkwem, “yiri” na-edobe echiche ὁμοίωμα, “ụmụ mmadụ” na-egosikwa ọtụtụ mmadụ n’enweghị ịkpa ókè nwoke na nwanyị.
- source_word: σχήματι εὑρεθεὶς ὡς ἄνθρωπος
  choice: mgbe a hụkwara ya n’ọdịdị elu dị ka mmadụ
  rationale: “Ọdịdị elu” na-egosi akụkụ a na-ahụ anya nke σχῆμα ma mee ka ọ dị iche na μορφή e kwuru na mbụ; “mmadụ” bụ okwu zuru mmadụ niile.
theological_decisions:
- issue: Ihe ἑαυτὸν ἐκένωσεν pụtara n’ihe gbasara Kraịst
  choice: Idobe ihe atụ ahụ dịka “ọ tọgbọrọ onwe ya n’efu,” ka nkebi ndị so ya kọwaa otú o si mee nke a.
  alternative: “o mere onwe ya ihe efu,” ma ọ bụ ịkọwa ya dịka ịhapụ àgwà chi ya
  rationale: Amaokwu ahụ n’onwe ya jikọtara omume a na iwere ọdịdị ohu na ịghọ onye yiri ụmụ mmadụ; nsụgharị ahụ ekwesịghị itinye ozizi nke ederede ahụ ekwughị kpọmkwem.
- issue: Ike okwu ὁμοίωμα n’ịkọwa mmadụ Kraịst ghọrọ
  choice: Idobe echiche nke “yiri” n’enweghị ikwu na mmadụ ya bụ naanị ihe yiri eziokwu.
  alternative: Ịsụgharị ya dịka naanị oyiyi mmadụ, ma ọ bụ ikwusi njirimara zuru oke ike karịa okwu Grik ahụ
  rationale: Nke a na-echekwa esemokwu na nghọta dị n’okwu Pọl, ma nkebi na-esote anaghị agọnahụ na ọ bụ mmadụ n’ezie.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma dị ugwu. A họọrọ “ohu” maka δοῦλος, “ọdịdị” maka μορφή, na “ọdịdị elu” maka σχῆμα iji chekwaa ọdịiche okwu Grik abụọ ahụ. Akara ndetu ala peeji [a] na [b] dịcha n’ederede isi.
