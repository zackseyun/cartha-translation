revisions:
- from: kama ọ tọgbọrọ onwe ya n’efu[a], were ọdịdị ohu, ghọọ onye yiri ụmụ mmadụ[b]; mgbe a hụkwara ya n’ọdịdị elu dị ka mmadụ.
  to: kama o mere onwe ya ihe efu[a], were ọdịdị ohu, ghọọ n’oyiyi ụmụ mmadụ[b]; a hụkwara ya n’ọdịdị elu dị ka mmadụ.
  rationale: The revision preserves the Greek metaphor of self-emptying in natural Igbo, restores the noun-based expression “n’oyiyi ụmụ mmadụ” for ὁμοίωμα, and removes an unsupported temporal nuance from the final coordinated participial clause. It retains the useful μορφή/σχῆμα distinction as “ọdịdị” and “ọdịdị elu.”
