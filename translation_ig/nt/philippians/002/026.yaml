source:
  edition: SBLGNT
  text: ἐπειδὴ ἐπιποθῶν ἦν πάντας ⸀ὑμᾶς, καὶ ἀδημονῶν διότι ἠκούσατε ὅτι ἠσθένησεν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/026.yaml
  text: since he was longing for all of you and was deeply distressed because you heard that he was sick[a].
translation:
  language: ig
  text: N’ihi na unu niile nọ na-agụ ya agụụ ike, obi erughịkwa ya ala nke ukwuu n’ihi na unu nụrụ na ọ rịara ọrịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na ọ nụrụ na unu anụla na ọ rịara ọrịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara e ji zighachi Epafrọdaịtọọs; okwu a na-egosipụta njikọ nke ihe kpatara ihe ọzọ n’Igbo nkịtị.
- source_word: ἐπιποθῶν ἦν
  choice: ọ nọ na-agụsi ya agụụ ike ịhụ
  rationale: Usoro a na-egosi ọchịchọ siri ike nke nọgidere na-adị n’oge gara aga; ‘ọ nọ na-agụsi ya agụụ ike ịhụ’ na-eburu ma ogologo oge ahụ ma ike ọchịchọ ahụ.
- source_word: πάντας ὑμᾶς
  choice: unu niile
  rationale: Nke a na-echekwa nkwusi ike nke πάντας, ya bụ na ọchịchọ ya metụtara onye ọ bụla n’ime ha.
- source_word: ἀδημονῶν
  choice: obi nọkwa na-ajọ ya nke ukwuu
  rationale: Akpaokwu Igbo a na-egosi oke nchegbu na mwute ime mmụọ, ọ bụghị naanị obere nchekasị.
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-egosi kpọmkwem ihe kpatara oke nchegbu ya.
- source_word: ἠκούσατε
  choice: unu nụrụ
  rationale: Ọ bụ nsụgharị doro anya ma dịkwa mfe nke aorist, nke na-adịghị agbakwụnye nkọwa oge na-adịghị na isiokwu Grik.
- source_word: ὅτι ἠσθένησεν
  choice: na ọ rịara ọrịa
  rationale: N’ebe a, ἀσθενέω na-ezo aka n’ọrịa anụ ahụ; ‘rịara ọrịa’ bụ Igbo eke ma na-egosikwa na ọrịa ahụ mere n’oge gara aga.
theological_decisions:
- issue: Onye bụ isiokwu zoro ezo n’ụdị ọzọ e nwere ike isi ghọta okwu ahụ
  choice: 'E ji isiokwu doro anya nke ederede bụ ‘unu’ tụgharịa ἠκούσατε: ‘unu nụrụ.’'
  alternative: ‘n’ihi na ọ nụrụ na unu anụla na ọ rịara ọrịa.’
  rationale: Ụdị okwu SBLGNT nyere nwere ἠκούσατε, onye nke abụọ n’ọnụọgụ ọtụtụ, ya mere isi ederede kwesịrị ikwu ‘unu nụrụ.’ Ma a debere ụdị ọzọ ahụ n’ala peeji iji gosipụta ọdịiche ntụgharị e nyefere na ihe ntụaka Bekee.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Ọ nọ na-agụsi ya agụụ ike ịhụ unu’ na-egosipụta ọchịchọ siri ike na-aga n’ihu, ebe ‘obi nọ na-ajọ ya nke ukwuu’ na-enye ịdị arọ nke ἀδημονῶν n’ụzọ ndị Igbo na-asụkarị.
