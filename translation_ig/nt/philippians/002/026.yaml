revisions:
- from: N’ihi na ọ nọ na-agụsi ya agụụ ike ịhụ unu niile, obi nọkwa na-ajọ ya nke ukwuu n’ihi na unu nụrụ na ọ rịara ọrịa.[a]
  to: N’ihi na unu niile nọ na-agụ ya agụụ ike, obi erughịkwa ya ala nke ukwuu n’ihi na unu nụrụ na ọ rịara ọrịa.[a]
  rationale: The revision removes the unsupported infinitive 'ịhụ' while preserving the imperfect, ongoing force of ἐπιποθῶν ἦν through 'nọ na-agụ ya agụụ ike.' It keeps the explicit comprehensiveness of πάντας ὑμᾶς ('unu niile'), the SBLGNT second-person plural reading of ἠκούσατε, and the supplied alternative reflected in the English audit trail.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly takes ἠκούσατε as second-person plural ('unu nụrụ') and accurately conveys the illness. However, 'ịhụ' ('to see') is not expressed in the Greek and should not be added to the main text. The periphrastic ongoing sense is retained in the revision.
  naturalness: The current wording 'ọ nọ na-agụsi ya agụụ ike ịhụ unu niile' is understandable, but it both introduces 'see' and is less direct than a construction in which 'unu niile' is the object of longing. The revised wording is natural Standard Igbo and preserves the strong emotional register.
  terminology: '''agụsi ... agụụ ike'' suitably conveys intense longing. ''obi erughị ya ala nke ukwuu'' is an idiomatic expression of serious inward distress and avoids reducing ἀδημονῶν to mere mild concern. ''rịara ọrịa'' naturally expresses that he fell ill.'
  issues:
  - severity: medium
    issue: The main text adds 'ịhụ' ('to see').
    rationale: ἐπιποθῶν ἦν πάντας ὑμᾶς says that he was longing for all of them; it does not explicitly state that he longed to see them. The Igbo should retain that scope without supplying an unstated action.
  - severity: low
    issue: The rendering of ἀδημονῶν can be made more idiomatic and emotionally precise.
    rationale: '''Obi nọ na-ajọ ya'' is understandable, but ''obi erughị ya ala nke ukwuu'' more naturally communicates the acute unsettled distress denoted by ἀδημονῶν.'
  revised_text: N’ihi na unu niile nọ na-agụ ya agụụ ike, obi erughịkwa ya ala nke ukwuu n’ihi na unu nụrụ na ọ rịara ọrịa.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na ọ nụrụ na unu anụla na ọ rịara ọrịa.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported infinitive 'ịhụ' while preserving the imperfect, ongoing force of ἐπιποθῶν ἦν through 'nọ na-agụ ya agụụ ike.' It keeps the explicit comprehensiveness of πάντας ὑμᾶς ('unu niile'), the SBLGNT second-person plural reading of ἠκούσατε, and the supplied alternative reflected in the English audit trail.
