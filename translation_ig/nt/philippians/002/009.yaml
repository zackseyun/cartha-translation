  text: διὸ καὶ ὁ θεὸς αὐτὸν ὑπερύψωσεν, καὶ ἐχαρίσατο αὐτῷ ⸀τὸ ὄνομα τὸ ὑπὲρ πᾶν ὄνομα,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/009.yaml
  text: Therefore God also highly exalted him and graciously gave him the name that is above every name[b][a],
translation:
  language: ig
  text: Ya mere, Chineke bulikwara ya elu nke ukwuu ma jiri amara nye ya[a] aha ahụ nke karịrị aha niile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ngwaa a dịka “nyere ya” ma ọ bụ “nyere ya n’onyinye.”
    reason: lexical_alternative
  - marker: b
    text: “Aha ahụ” nwere ike ịpụta ọ bụghị naanị aha a na-akpọ mmadụ, kamakwa ọkwa, ugwu, ma ọ bụ utu aha; amaokwu a n’onwe ya akọwaghị kpọmkwem aha a na-ekwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: N’ihi ya ... kwara
  rationale: “N’ihi ya” na-egosi ihe si n’ihe e kwuru tupu ya pụta, ebe mgbakwunye “-kwara” na-echekwa ike καί n’ụzọ Igbo sitere n’okike.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ isiokwu doro anya nke ahịrịokwu Grik; “Chineke” bụ okwu Igbo kwesị ekwesị maka ntụaka a.
- source_word: ὑπερύψωσεν
  choice: bulikwara ya elu nke ukwuu
  rationale: Nke a na-echekwa ike mgbakwunye dị na ngwaa Grik, ya bụ ibuli ya elu n’ụzọ pụrụ nnọọ iche, ma ka na-ada ka Igbo nke oge a.
- source_word: ἐχαρίσατο
  choice: werekwa amara nye ya
  rationale: Ọ na-egosi ma inye ihe ma echiche amara dị na ngwaa ahụ; ihe odide ala peeji na-edebe nhọrọ Igbo dị nkenke karị.
- source_word: τὸ ὄνομα
  choice: aha ahụ
  rationale: A hapụrụ ya dịka “aha” kama ịkọwa ya dịka ọkwa ma ọ bụ utu aha, n’ihi na amaokwu a akọwaghị kpọmkwem aha a na-ekwu.
- source_word: τὸ ὑπὲρ πᾶν ὄνομα
  choice: aha ahụ dị elu karịa aha niile
  rationale: Nke a na-echekwa ntụnyere Grik ma na-ada n’ụzọ doro anya na nke sitere n’okike n’Igbo.
theological_decisions:
- issue: Ihe “aha ahụ” bụ
  choice: E debere ya dịka “aha ahụ” n’akọwaghị aha ọ bụ n’ahịrịokwu bụ isi.
  alternative: Ịkọwa ya dịka aha “Jizọs,” ma ọ bụ dịka utu aha Chineke bụ “Onyenwe anyị.”
  rationale: Amaokwu nke 9 n’onwe ya ekwughị kpọmkwem aha ahụ; ya mere nsụgharị ahụ echekwala oghere nkọwa ahụ kama isi n’amaokwu 10–11 webata mkpebi n’ime amaokwu a.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “-kwara” gosi mgbakwunye καί, ma zere ịkọwa “aha ahụ” n’ụzọ ga-emechi nghọta ndị ederede ahụ ka hapụrụ oghe.
