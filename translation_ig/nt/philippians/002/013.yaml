  text: ⸀θεὸς γάρ ἐστιν ὁ ἐνεργῶν ἐν ὑμῖν καὶ τὸ θέλειν καὶ τὸ ἐνεργεῖν ὑπὲρ τῆς εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/013.yaml
  text: For God is the one working in you both to will and to work for his good pleasure[a][b].
translation:
  language: ig
  text: N’ihi na ọ bụ Chineke na-arụ ọrụ n’ime unu, na-eme ka unu nwee ọchịchọ ime ihe ma na-eme ka unu rụọkwa ọrụ[a], maka ihe na-atọ ya ụtọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma ọchịchọ ahụ ma ọrụ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị ka ihe na-atọ ya ụtọ si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Na-egosi na amaokwu a na-enye ihe kpatara ndụmọdụ dị n’amaokwu bu ya ụzọ, ma na-ada nke ọma n’Igbo.
- source_word: ὁ ἐνεργῶν
  choice: onye na-arụ ọrụ
  rationale: Na-echekwa ụdị okwu participle nke na-egosi na ọrụ Chineke na-aga n’ihu.
- source_word: ἐν ὑμῖν
  choice: n’ime unu
  rationale: Na-echekwa ohere ịghọta ya dịka ọrụ Chineke n’ime onye ọ bụla ma ọ bụ n’etiti ọgbakọ niile, ebe ‘unu’ bụ ọtụtụ mmadụ.
- source_word: τὸ θέλειν
  choice: inwe ọchịchọ ime ihe
  rationale: Na-ekwupụta echiche nke mmadụ ịchọ ma kpebie ime ihe n’Igbo doro anya, n’etinyeghị nkọwa banyere otú ọchịchọ ahụ si arụ ọrụ.
- source_word: τὸ ἐνεργεῖν
  choice: ịrụ ya
  rationale: Na-echekwa njikọ okwu ya na ἐνεργῶν (‘na-arụ ọrụ’) ma na-eme ka ntụnyere ọchịchọ na omume doo anya.
- source_word: ὑπὲρ τῆς εὐδοκίας
  choice: maka ihe na-atọ ya ụtọ
  rationale: ‘Maka’ na-egosipụta ebumnuche ma ọ bụ uru nke ὑπέρ nwere ike ịpụta n’ebe a; ‘ihe na-atọ ya ụtọ’ bụ Igbo ebumpụta ụwa maka εὐδοκία, ebe ‘ya’ na-ezo aka na Chineke.
theological_decisions:
- issue: Ọrụ Chineke na ọchịchọ na omume mmadụ
  choice: E gosiri Chineke dịka onye na-arụ ọrụ n’ime ndị kwere ekwe, nke metụtara ma ọchịchọ ha ma omume ha.
  alternative: Ịsụgharị ya dịka Chineke na-enye naanị ọchịchọ ma ọ bụ naanị ike ime ihe.
  rationale: Asụsụ Grik tinyere ma θέλειν ma ἐνεργεῖν n’okpuru ọrụ Chineke. Nsụgharị ahụ na-edobe ha abụọ n’enweghị ịkọwa ma ọ bụ dozie esemokwu dị n’etiti ọrụ Chineke na ọrụ mmadụ.
- issue: Ihe ὑπὲρ τῆς εὐδοκίας na-ezo aka na ya
  choice: ‘maka ihe na-atọ ya ụtọ’
  alternative: ‘dị ka ihe na-atọ ya ụtọ si dị’
  rationale: A họọrọ nghọta ebumnuche/uru nke ὑπέρ, ma e debere nghọta nke ụkpụrụ ma ọ bụ nkwekọrịta n’ala peeji n’ihi na usoro okwu ahụ nwere ike ibu ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ntughari ‘na-eme ka unu’ na-eme ka njikọ nke Chineke na infinitive abụọ ahụ pụta ìhè n’Igbo, ma ọ naghị etinye echiche nke mmanye. A hapụrụ ‘unu’ n’ụdị ọtụtụ mmadụ iji chekwaa ohere nghọta nke onye n’otu n’otu na nke ọgbakọ.
