  to: N’ihi na ọ bụ Chineke na-arụ ọrụ n’ime unu, na-eme ka unu nwee ọchịchọ ime ihe ma na-eme ka unu rụọkwa ọrụ[a], maka ihe na-atọ ya ụtọ[b].
