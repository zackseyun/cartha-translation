  text: σπουδαιοτέρως οὖν ἔπεμψα αὐτὸν ἵνα ἰδόντες αὐτὸν πάλιν χαρῆτε κἀγὼ ἀλυπότερος ὦ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/028.yaml
  text: Therefore I sent him all the more eagerly, so that when you see him again you may rejoice, and I may be less distressed.
translation:
  language: ig
  text: Ya mere, ezitere m ya n’ịnụ ọkụ n’obi ka ukwuu, ka unu wee ṅụrịa ọṅụ mgbe unu hụrụ ya ọzọ, ka mwute m wee dị ntakịrị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδαιοτέρως
  choice: n’ọṅụ ka ukwuu
  rationale: Na-egosipụta ụdị ntụnyere nke adverb ahụ—Paụl ji ọṅụ na ịnụ ọkụ n’obi ka ukwuu ziga ya—n’asụsụ Igbo dị mfe ma bụrụkwa eke.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Na-echekwa njikọ nkwubi okwu ahụ na ihe e kwuru tupu ya.
- source_word: ἔπεμψα
  choice: ezitere m
  rationale: Oge gara aga dị mfe na-egosipụta aorist ahụ nke ọma n’ebe a.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Ụdị Igbo a na-egosipụta ebumnuche ma ọ bụ nsonaazụ e bu n’obi.
- source_word: ἰδόντες
  choice: mgbe unu hụrụ
  rationale: Na-egosipụta participle ahụ dịka ọnọdụ oge n’ime ahịrịokwu ebumnuche.
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosipụta na ha ga-ahụ Epafrọdaịtọs ọzọ.
- source_word: χαρῆτε
  choice: unu wee ṅụrịa ọṅụ
  rationale: Na-echekwa echiche nke ịṅụrị ọṅụ na ụda okwu Paụl karịa naanị ‘inwe obi ụtọ.’
- source_word: κἀγὼ
  choice: ka mwute m
  rationale: A haziri njikọ ‘na mụ onwe m’ n’ụzọ Igbo eke, site n’ime mwute Paụl isiokwu nke nkebi nke abụọ, n’enweghị itinye echiche ọhụrụ.
- source_word: ἀλυπότερος
  choice: mwute m wee belata
  rationale: Na-echekwa ike ntụnyere ‘ịdị obere n’ime mwute’ n’ụzọ ndị Igbo nke oge a ga-aghọta nke ọma, na-enweghị ime ka ọ bụrụ kpọmkwem nchegbu kama mwute.
- source_word: ὦ
  choice: wee belata
  rationale: Na-egosipụta subjunctive nke ‘ịbụ’ site n’okwu Igbo eke nke pụtara ka ọnọdụ mwute ya dị ntakịrị.
