translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ usoro ahịrịokwu eke n’Igbo, ma debe njikọ ebumnuche abụọ na ike ntụnyere dị na Grik.
