  text: οἱ πάντες γὰρ τὰ ἑαυτῶν ζητοῦσιν, οὐ τὰ ⸂Ἰησοῦ Χριστοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/021.yaml
  text: For they all seek their own interests[a], not those of Jesus the Messiah.
translation:
  language: ig
  text: N’ihi na ha niile na-achọ ihe nke aka ha, ọ bụghị ihe nke Jizọs bụ́ Mesaịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάντες
  choice: ha niile
  rationale: Nkebiokwu a na-ezo aka n’ìgwè mmadụ niile Pọl na-ekwu maka ha; “ha niile” bụ Igbo doro anya nke na-edobe nkwusike ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu dị n’amaokwu bu ụzọ, ya mere “N’ihi na” na-ejikọta echiche abụọ ahụ n’ụzọ ebumpụta ụwa.
- source_word: τὰ ἑαυτῶν
  choice: ihe nke aka ha
  rationale: Nke a bụ akpaalaokwu Igbo na-egosi ihe mmadụ ji kpọrọ ihe ma ọ bụ ọdịmma onwe ya, ma ọ naghị eme ka okwu Grik sara mbara bụrụ naanị otu ụdị ọdịmma.
- source_word: ζητοῦσιν
  choice: na-achọ
  rationale: “Na-achọ” na-eburu echiche nke ilekwasị anya n’ihe ma ọ bụ ịchụso ya, ma na-arụ ọrụ nke ọma n’ọdịiche dị n’etiti ihe nke ha na ihe nke Jizọs.
- source_word: τὰ Ἰησοῦ Χριστοῦ
  choice: ihe nke Jizọs bụ́ Mesaya
  rationale: “Ihe nke” na-edobe nhazi okwu Grik nke hapụrụ aha ihe ahụ n’ụzọ nghọta, ebe “bụ́ Mesaya” na-egosi Χριστός dị ka utu aha.
theological_decisions:
- issue: Otú e si sụgharị Χριστοῦ n’okwu Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mesaya
  alternative: Jizọs Kraịst
  rationale: “Mesaya” na-eme ka ihe utu aha Χριστός pụtara pụta ìhè; e debere ụdị a maara nke ọma, “Jizọs Kraịst,” n’ala ala peeji ka a ghara izochi ụzọ ọzọ e si aghọta ma sụgharị okwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ihe nke aka ha” bụ akpaalaokwu ebumpụta ụwa nke na-edobe ọdịiche sara mbara dị n’akwụkwọ Grik n’etinyeghị nkọwa karịrị akarị.
