  text: ἀλλὰ εἰ καὶ σπένδομαι ἐπὶ τῇ θυσίᾳ καὶ λειτουργίᾳ τῆς πίστεως ὑμῶν, χαίρω καὶ συγχαίρω πᾶσιν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/017.yaml
  text: But even if I am being poured out as a drink offering upon the sacrifice and service of your faith[c][b][a], I rejoice and rejoice with all of you.
translation:
  language: ig
  text: Ma ọ bụrụgodị na a na-awụpụ m dị ka onyinye mmanya n’elu àjà na ọrụ ofufe nke okwukwe unu[c][b][a], ana m aṅụrị, mụ na unu niile na-aṅụrịkwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a na-awụpụ m dịka àjà mmanya.”
    reason: lexical_alternative
  - marker: b
    text: “Ọrụ ofufe” nwekwara ike ịbụ “ozi” ma ọ bụ “ọrụ”; okwu Grik ahụ ka nwere ụda asụsụ ofufe n’ebe a.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ikwesị ntụkwasị obi unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: a na-awụpụ m dị ka onyinye mmanya
  rationale: Nke a na-edobe ihe atụ nke onyinye mmanya a na-awụpụ n’ofufe àjà, ma mee ka ọ doo onye Igbo nke oge a anya.
- source_word: ἐπὶ
  choice: n’elu
  rationale: Ọ na-edobe echiche na a na-awụsa onyinye mmanya ahụ n’elu àjà, ma ọ bụ tinye ya n’àjà ahụ.
- source_word: θυσίᾳ
  choice: àjà
  rationale: “Àjà” bụ okwu Igbo doro anya nke na-edobe asụsụ ofufe na ịchụ àjà dị n’amaokwu ahụ.
- source_word: λειτουργίᾳ
  choice: ọrụ ofufe
  rationale: Nhọrọ a na-edobe njikọ ya na ofufe n’ọnọdụ a, ma ọ naghị amanye echiche na ọ bụ naanị ọrụ onye nchụàjà.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ ihe πίστις pụtara n’ụzọ kachasị kwekọọ n’ebe a; ihe ọzọ nwere ike ịbụ “ikwesị ntụkwasị obi.”
- source_word: χαίρω
  choice: ana m aṅụrị
  rationale: Ọ na-edobe okwu ọṅụ nke na-apụta ugboro ugboro n’akwụkwọ Ndị Filipaị.
- source_word: συγχαίρω
  choice: mụ na unu niile na-aṅụrịkwa
  rationale: Nke a na-egosi ọṅụ Pọl na ndị niile ọ na-agwa nwerekọrọ, kama ime ka ọ pụta nanị dị ka ikele ha.
- source_word: πᾶσιν ὑμῖν
  choice: unu niile
  rationale: Ọ na-edobe nkwusi ike Pọl na ọ na-agụnye mmadụ niile nọ n’ọgbakọ ahụ.
theological_decisions:
- issue: Ihe atụ nke àjà gbasara ahụhụ ma ọ bụ ọnwụ Pọl nwere ike ịbịa
  choice: E debere Pọl dị ka onye a na-awụpụ ka onyinye mmanya n’elu àjà na ọrụ ofufe nke okwukwe ha.
  alternative: Ịsụgharị ya nanị dị ka Pọl na-enye ndụ ya n’ọrụ ha, na-enweghị okwu àjà.
  rationale: Njikọ σπένδομαι, θυσία, na λειτουργία na-eme ka asụsụ àjà na ofufe bụrụ akụkụ dị mkpa nke ihe Pọl kwuru; ya mere, e kwesịghị ime ka ọ bụrụ naanị asụsụ ọrụ nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ya. E debere okwu ndị metụtara àjà na ofufe, ma zere ịkọwa λειτουργία n’ụzọ ga-amanye echiche ụka ọ bụla.
