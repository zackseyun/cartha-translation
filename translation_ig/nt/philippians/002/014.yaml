lexical_decisions:
- source_word: Πάντα
  choice: ihe niile
  rationale: Ọ na-egosi ihe niile n’enweghị nke a hapụrụ; okwu a bụkwa Igbo nkịtị ma doo anya.
- source_word: ποιεῖτε
  choice: Na-eme
  rationale: Ụdị iwu a dị ugbu a na-enye echiche nke omume a ga na-eme mgbe niile; “Na-eme” na-egosipụta iwu na-aga n’ihu n’Igbo.
- source_word: χωρὶς
  choice: n’ataghị … ma ọ bụ
  rationale: N’usoro ahịrịokwu a, okwu ahụ pụtara ime ihe mgbe àgwà abụọ a na-adịghị; ntụgharị a na-ada nke ọma n’Igbo.
- source_word: γογγυσμῶν
  choice: ntamu
  rationale: “Ntamu” na-egosi mkpesa a na-ekwu n’olu dị ala ma ọ bụ iwe n’obi, ma nwekwara ike idowe njikọ echiche ya na ntamu Izrel n’ọzara.
- source_word: διαλογισμῶν
  choice: esere okwu
  rationale: N’ebe a ọ kacha yie ka ọ na-ekwu maka esemokwu na ịrụrịta ụka n’etiti mmadụ, ọ bụghị naanị iche echiche n’ime obi.
