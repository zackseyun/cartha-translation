  terminology: 'Key terms are rendered consistently and intelligibly: self-humbling as ''wedara onwe ya ala,'' obedience as ''nrubeisi''/''onye na-erube isi,'' death as ''ọnwụ,'' and cross as ''obe.'' The final ''ọbụna'' suitably preserves the Greek rhetorical intensification without overinterpreting δέ.'
