  source_fidelity: The translation accurately represents the explicit reflexive self-humbling (ἐταπείνωσεν ἑαυτόν), the participial means/manner ('site n’ịghọ'), obedience carried as far as death (μέχρι θανάτου), and the climactic specification of crucifixion (θανάτου δὲ σταυροῦ). It does not add an object of obedience or doctrinal interpretation absent from the Greek.
