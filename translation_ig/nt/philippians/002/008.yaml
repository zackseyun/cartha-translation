id: PHP.2.8
reference: Philippians 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐταπείνωσεν ἑαυτὸν γενόμενος ὑπήκοος μέχρι θανάτου, θανάτου δὲ σταυροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/008.yaml
  text: he humbled himself[b][a], becoming obedient to the point of death—even death on a cross.
translation:
  language: ig
  text: O wedara onwe ya ala site n’ịghọ onye na-erube isi ruo n’ọnwụ[a]—ọbụna ọnwụ n’elu obe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ruo ọnwụ”; okwu a pụtara na nrubeisi ya gara n’ihu ruo ọnwụ n’onwe ya.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọnwụ, ọbụna nke obe”; ihe ọ pụtara bụ “ọbụna ọnwụ n’elu obe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταπείνωσεν
  choice: wedara ... ala
  rationale: Nkebi okwu a bụ ụzọ Igbo dị ugbu a si akọwa iweda mmadụ ala; olu na-eme ihe na-egosikwa na o ji aka ya mee ya.
- source_word: ἑαυτὸν
  choice: onwe ya
  rationale: E debere nnọchiaha nlaghachi a n’ụzọ doro anya iji chekwaa nkwusi ike dị n’ederede ahụ na o ji aka ya wedara onwe ya ala.
- source_word: γενόμενος
  choice: site n’ịghọ
  rationale: 'Nke a na-egosi n’Igbo ebumnuche participle ahụ nke ọma: ọ kọwara ụzọ o si wedara onwe ya ala, n’ebughị ụzọ kpebie ma ọ bụ naanị oge ka ọ na-egosi.'
- source_word: ὑπήκοος
  choice: onye na-erube isi
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa onye na-eme ihe e nyere ya n’iwu.
- source_word: μέχρι θανάτου
  choice: ruo n’ọnwụ
  rationale: Ọ na-echekwa ókè obedience ahụ ruru—ruo ọnwụ n’onwe ya—ma na-ada nke ọma n’Igbo.
- source_word: δὲ
  choice: ọbụna
  rationale: 'N’ebe a, okwu ahụ na-eme ka nkebi ikpeazụ sie ike: ọ bụghị naanị ọnwụ, kama ọbụna ụdị ọnwụ ihere nke obe.'
- source_word: σταυροῦ
  choice: n’elu obe
  rationale: Nke a bụ ntụgharị Igbo doro anya nke genitive dị mkpụmkpụ ahụ, na-eme ka obe ahụ n’onwe ya pụta ìhè.
theological_decisions:
- issue: Ike nke nkebi ikpeazụ θανάτου δὲ σταυροῦ
  choice: 'A tụgharịrị ya dịka nrịgo nkwusi ike: “ọbụna ọnwụ n’elu obe.”'
  alternative: “ọnwụ, ee, ọnwụ n’elu obe” ma ọ bụ ntụgharị nkịtị “ọnwụ nke obe.”
  rationale: Nke a na-echekwa otú ahịrịokwu ahụ si eru n’isi n’ụdị ọnwụ ihere ahụ, n’etinyeghị nkọwa ozizi ọzọ n’ime amaokwu ahụ.
- issue: Mmekọrịta participle γενόμενος na ngwaa bụ isi
  choice: “site n’ịghọ” ka e ji gosi ụzọ o si wedara onwe ya ala.
  alternative: “mgbe ọ ghọrọ” ma ọ bụ “ọ ghọkwara.”
  rationale: Nhọrọ a na-echekwa njikọ nke ụzọ ma ọ bụ ọnọdụ nke participle ahụ n’ebughị ụzọ mechie nghọta ya naanị n’usoro oge.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Wedara onwe ya ala” na “onye na-erube isi” bụ okwu ndị nkịtị ga-aghọta, ebe em dash na “ọbụna” na-echekwa nrịgo nkwusi ike nke Greek.
