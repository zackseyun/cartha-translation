  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A hapụrụ τέκνον ka ọ bụrụ “nwa,” ọ bụghị “nwa nwoke,” ma chekwaa ntụnyere ahụ na ọrụ Timoti na Pọl jikọrọ aka rụọ.
