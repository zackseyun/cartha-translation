- from: 'Ma unu maara àgwà ya nke a nwapụtarala[a]: na dị ka nwa na nna ya[b], ya na m jere ozi maka ozi ọma.'
  to: Ma unu maara àgwà ya e nwalegoro[a], na ya na m jere ozi maka ozi ọma dị ka nwa si eso nna ya[b].
  rationale: The revision preserves the verse’s syntax and meaning while using clearer Standard Igbo for Timothy’s tested character and an explicit, natural filial simile. The footnotes retain the lexical explanation and provide a closer Igbo representation of the source comparison.
