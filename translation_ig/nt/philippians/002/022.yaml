  text: τὴν δὲ δοκιμὴν αὐτοῦ γινώσκετε, ὅτι ὡς πατρὶ τέκνον σὺν ἐμοὶ ἐδούλευσεν εἰς τὸ εὐαγγέλιον.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/022.yaml
  text: But you know his proven character[b][a], that as a child with his father he served with me for the gospel.
translation:
  language: ig
  text: Ma unu maara àgwà ya e nwalegoro[a], na ya na m jere ozi maka ozi ọma dị ka nwa si eso nna ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “àgwà e gosipụtara na ọ bụ ezigbo ya.” Okwu Grik ahụ na-ekwu banyere àgwà e gosiri na ọ bụ ezigbo ya site n'ule.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “dị ka nwa n'ebe nna ya nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosipụta obere ntụgharị ma ọ bụ ọdịiche dị n'okwu gbara ya gburugburu n'Igbo nkịtị.
- source_word: δοκιμὴν αὐτοῦ
  choice: àgwà ya nke a nwapụtarala
  rationale: Na-egosi àgwà Timoti nke ule mere ka o doo anya na ọ bụ ezigbo ya, kama ịsụgharị ya nanị dị ka ihe àmà.
- source_word: γινώσκετε
  choice: unu maara
  rationale: Na-egosipụta ihe ndị Filipaị maara ugbu a banyere Timoti n'ụzọ doro anya.
- source_word: ὅτι
  choice: na
  rationale: Na-ewebata nkọwa nke ihe ha maara banyere Timoti.
- source_word: ὡς πατρὶ τέκνον
  choice: dị ka nwa na nna ya
  rationale: Na-echekwa ntụnyere ezinụlọ ahụ ma ghara ime τέκνον ka ọ bụrụ kpọmkwem ‘nwa nwoke’; ‘nna ya’ na-eme ka mmekọrịta ahụ doo anya n'Igbo.
- source_word: σὺν ἐμοὶ
  choice: ya na m
  rationale: Na-egosipụta na Timoti so Pọl rụọ otu ọrụ.
- source_word: ἐδούλευσεν
  choice: jere ozi
  rationale: Nke a bụ ụzọ Igbo dị ebube ma kwekọọ n'ọnọdụ ozi e ji egosipụta ije ozi, na-enweghị ime ka okwu ahụ bụrụ ịgba ohu n'ụzọ na-ekwesịghị ekwesị.
- source_word: εἰς τὸ εὐαγγέλιον
  choice: maka ozi ọma
  rationale: Na-egosipụta ebumnuche na ntụziaka nke ọrụ ha n'ụzọ Igbo nkịtị, ebe ozi ọma ka bụ ihe ọrụ ahụ lekwasịrị anya.
