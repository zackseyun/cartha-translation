  text: πληρώσατέ μου τὴν χαρὰν ἵνα τὸ αὐτὸ φρονῆτε, τὴν αὐτὴν ἀγάπην ἔχοντες, σύμψυχοι, τὸ ἓν φρονοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/002.yaml
  text: complete my joy[a], so that you may think the same way, having the same love, being united in soul[c][b], thinking one thing.
translation:
  language: ig
  text: Mezue ọṅụ m, ka unu wee nwee otu echiche[a], na-enwe otu ịhụnanya, bụrụ ndị dị n’otu obi[b], na-eche otu ihe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwee otu obi.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “bụrụ ndị nwere otu mkpụrụ obi”; ọzọkwa, “dịrị n’otu na mmụọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “tinye obi n’otu nzube.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πληρώσατέ μου τὴν χαρὰν
  choice: Mezue ọṅụ m
  rationale: “Mezue” na-egosi ime ka ihe ruo n’uju, ya mere ọ na-echekwa ihe atụ nke πλήρωμα dị n’okwu Grik ma na-ada nke ọma n’Igbo.
- source_word: ἵνα
  choice: ka unu wee
  rationale: N’ebe a, ἵνα na-ewebata ihe ga-eme ka ọṅụ Pọl zuo oke, ma nwee ike igosi nzube ma ọ bụ ihe a na-atụ anya ya.
- source_word: τὸ αὐτὸ φρονῆτε
  choice: nwee otu echiche
  rationale: Nhọrọ a na-egosi echiche ma ọ bụ ọnọdụ uche ha kwesịrị ịkekọrịta, ọ bụghị nanị iche otu echiche n’otu oge.
- source_word: τὴν αὐτὴν ἀγάπην ἔχοντες
  choice: na-enwe otu ịhụnanya ahụ
  rationale: Ọ na-echekwa usoro participle nke Grik nakwa okwu bụ ‘otu ịhụnanya,’ n’asụsụ Igbo doro anya.
- source_word: σύμψυχοι
  choice: bụrụ ndị nwere otu mkpụrụ obi
  rationale: Nke a na-echekwa ihe oyiyi nke ψυχή dị n’okwu Grik ma na-egosi ịdị n’otu nke ndụ ime mmadụ.
- source_word: τὸ ἓν φρονοῦντες
  choice: na-eche otu ihe
  rationale: Ọ na-echekwa nkwughachi nke φρονέω na mkpirikpi okwu Grik, n’agbanyeghị na okwu ahụ nwekwara ike ịpụta itinye obi n’otu nzube.
theological_decisions:
- issue: Otu a ga-esi chekwaa nkwughachi φρονέω na oku Pọl na-akpọ ka ha dịrị n’otu
  choice: Jiri “nwee otu echiche” na “na-eche otu ihe.”
  alternative: “nwee otu obi … tinye obi n’otu nzube”
  rationale: Nhọrọ a na-echekwa nkwughachi na mgbanwe dị n’usoro Grik, na-akpọkwa ha ka ha dịrị n’otu n’etinyeghị echiche nke na ha aghaghị ikwekọ n’ihe niile ma ọ bụ n’usoro ọchịchị ụka.
- issue: Ihe σύμψυχοι pụtara
  choice: “ndị nwere otu mkpụrụ obi”
  alternative: “ndị dị n’otu n’obi” ma ọ bụ “ndị dị n’otu na mmụọ”
  rationale: Isi okwu ahụ jikọtara σύν na ψυχή. Nsụgharị a na-echekwa ihe oyiyi ahụ ma hapụkwa nghọta ya sara mbara kama ịkọwa ya kpọmkwem dị ka ‘mmụọ.’
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro oku ahụ na nkebiokwu ndị na-esochi ya, tinyere ihe oyiyi ‘otu mkpụrụ obi’ na nkwughachi nke echiche, n’enweghị itinye nkọwa ụka pụrụ iche.
