  text: ἵνα ἐν τῷ ὀνόματι Ἰησοῦ πᾶν γόνυ κάμψῃ ἐπουρανίων καὶ ἐπιγείων καὶ καταχθονίων,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/010.yaml
  text: so that at the name of Jesus every knee should bow[a], of those in heaven and on earth and under the earth[b],
translation:
  language: ig
  text: ka, mgbe a kpọrọ aha Jizọs[a], ikpere niile nke ndị nọ n’eluigwe, nke ndị nọ n’ụwa, na nke ndị nọ n’okpuru ụwa[b] kpọọ isiala,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’aha Jizọs.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “nke ndị eluigwe, ndị ụwa, na ndị n’okpuru ụwa.” E tinyere “ndị nọ” ka okwu ahụ daa nke ọma n’Igbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro ‘ka ... wee’ na-egosi nzube ma ọ bụ ihe si n’okwu bu ụzọ pụta, dị ka ἵνα si arụ ọrụ n’ebe a, ma bụrụkwa Igbo nkịtị.
- source_word: ἐν τῷ ὀνόματι Ἰησοῦ
  choice: n’aha Jizọs
  rationale: Nke a na-anọgide nso n’usoro Grik ma nwee ike ibu echiche nke ịkpọ isiala mgbe a kpọrọ aha Jizọs ma ọ bụ ime ya n’aha ya; ihe odide ala peeji na-egosi ụzọ ọzọ e si aghọta ya.
- source_word: πᾶν γόνυ
  choice: ikpere niile
  rationale: A hapụrụ ihe atụ ahụ doro anya nke ikpere niile kama ịkọwa ya naanị dị ka ‘mmadụ niile.’
- source_word: κάμψῃ
  choice: wee gbuo
  rationale: ‘Igbu ikpere’ bụ ụzọ Igbo si ekwu ịkpọ isiala ma ọ bụ igosi nsọpụrụ; ‘wee’ dabara n’usoro subjunctive nke ἵνα.
- source_word: ἐπουρανίων
  choice: nke ndị nọ n’eluigwe
  rationale: Nke a na-egosipụta adjective ahụ e ji mee noun na genitive, n’enweghị ịkpọ ndị ahụ ndị mmụọ ozi kpọmkwem.
- source_word: ἐπιγείων
  choice: nke ndị nọ n’ụwa
  rationale: Ọ na-edobe usoro atọ ahụ ma na-ekwu okwu n’ụzọ Igbo na-ada nke ọma.
- source_word: καταχθονίων
  choice: nke ndị nọ n’okpuru ụwa
  rationale: Ọ na-edobe ihe oyiyi ebe dị n’okpuru ụwa n’enweghị itinye nkọwa pụrụ iche dịka ala mmụọ.
theological_decisions:
- issue: Ókè ndị okwu atọ ahụ—ἐπουρανίων, ἐπιγείων, καταχθονίων—gụnyere
  choice: E gosipụtara ha dịka ndị nọ n’eluigwe, n’ụwa, na n’okpuru ụwa, na-akọwa nsọpụrụ zuru ụwa ọnụ n’enweghị ịkpọ ụdị ndị ahụ aha kpọmkwem.
  alternative: Ịkpọ ha ndị mmụọ ozi, ụmụ mmadụ, na ndị nwụrụ anwụ ma ọ bụ ndị mmụọ ọjọọ.
  rationale: Grik na-egosi ógbè atọ zuru ụwa ọnụ, ma ọ naghị akọwa kpọmkwem ndị mejupụtara nke ọ bụla; ya mere nsụgharị ahụ echekwala obosara na nghọtahie ziri ezi nke okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Igbu ikpere’ na-edobe ihe oyiyi ahụ nke ịkpọ isiala, ebe usoro ‘ma nke ... ma nke ... ma nke ...’ na-egosipụta genitive atọ ahụ ma mesie ókè zuru ụwa ọnụ ike.
