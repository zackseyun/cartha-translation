    reason: lexical_alternative
  revision_rationale: The revision renders the contextual force of ἐν τῷ ὀνόματι Ἰησοῦ naturally as “mgbe a kpọrọ aha Jizọs,” while preserving the more literal alternative in a footnote. It replaces the unnatural knee-subject construction with the established homage expression “ikpere niile ... kpọọ isiala,” and directly attaches the three cosmic groups to “ikpere niile.” No identity is imposed on the heavenly, earthly, or under-earth groups.
