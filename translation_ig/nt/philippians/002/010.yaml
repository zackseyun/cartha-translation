review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the purpose clause, the universal image of every knee, and the threefold cosmic scope. However, “n’aha Jizọs” can naturally imply acting by Jesus’ authority in Igbo, whereas in this context ἐν τῷ ὀνόματι is most naturally understood as the occasion of Jesus’ name being invoked. The genitive modifiers should also attach directly to “ikpere niile,” rather than follow the verb in a loosely coordinated phrase.
  naturalness: '“Ikpere niile wee gbuo” is not a natural way to express the required image in Standard Igbo: “igbu ikpere” normally takes a personal subject. “Ikpere niile ... kpọọ isiala” is an established, elevated, and intelligible biblical formulation. The revised word order also makes the three groups modify the knees clearly.'
  terminology: “Jizọs,” “kpọọ isiala,” “eluigwe,” “ụwa,” and “n’okpuru ụwa” are appropriate Standard Igbo forms. The revision retains “n’okpuru ụwa” and does not overinterpret the final group as the dead, demons, or an underworld.
  issues:
  - severity: medium
    issue: The main rendering “n’aha Jizọs” is semantically open to an agency/authorization sense.
    rationale: In this context the phrase accompanies universal homage and is best rendered idiomatically as the occasion when Jesus’ name is invoked; the more literal phrase can be retained as a footnoted alternative.
  - severity: medium
    issue: “ikpere niile wee gbuo” is unnatural with “ikpere” as its subject.
    rationale: The idiom “igbu ikpere” ordinarily describes what a person does. “Ikpere niile ... kpọọ isiala” preserves the Greek bodily image while reading naturally in elevated Standard Igbo.
  - severity: low
    issue: The three genitive groups are placed after the verb with repeated “ma nke,” making their syntactic relationship to “ikpere niile” less clear.
    rationale: Placing them immediately after “ikpere niile” clearly represents the Greek genitives as identifying whose knees are in view.
  revised_text: ka, mgbe a kpọrọ aha Jizọs[a], ikpere niile nke ndị nọ n’eluigwe, nke ndị nọ n’ụwa, na nke ndị nọ n’okpuru ụwa[b] kpọọ isiala,
