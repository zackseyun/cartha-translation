- from: ka ikpere niile wee gbuo n’aha Jizọs[a]—ma nke ndị nọ n’eluigwe, ma nke ndị nọ n’ụwa, ma nke ndị nọ n’okpuru ụwa[b],
  to: ka, mgbe a kpọrọ aha Jizọs[a], ikpere niile nke ndị nọ n’eluigwe, nke ndị nọ n’ụwa, na nke ndị nọ n’okpuru ụwa[b] kpọọ isiala,
  rationale: The revision renders the contextual force of ἐν τῷ ὀνόματι Ἰησοῦ naturally as “mgbe a kpọrọ aha Jizọs,” while preserving the more literal alternative in a footnote. It replaces the unnatural knee-subject construction with the established homage expression “ikpere niile ... kpọọ isiala,” and directly attaches the three cosmic groups to “ikpere niile.” No identity is imposed on the heavenly, earthly, or under-earth groups.
