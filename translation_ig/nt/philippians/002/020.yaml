translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ya na m nwere otu obi’ na-enye ἰσόψυχον n’ụzọ ebumpụta ụwa n’Igbo, ebe nkọwa ala peeji na-edobe oyiyi okwu Grik. E debere τὰ περὶ ὑμῶν dị ka ‘ọdịmma unu,’ ma nyekwa ntụgharị sara mbara karị na nkọwa ala peeji.
