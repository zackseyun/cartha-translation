lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosipụta na okwu a na-akọwa ihe Pọl kwuru n’amaokwu bu ya ụzọ.
- source_word: οὐδένα ... ἔχω
  choice: enweghị m onye ọ bụla
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwekọọ na okwu Grik nke pụtara ‘enweghị m onye ọ bụla.’
- source_word: ἰσόψυχον
  choice: ya na m nwere otu obi
  rationale: Na-egosipụta na onye ahụ na Pọl nwere otu echiche na otu ọchịchọ ime ihe, ma na-anọgide nso n’oyiyi okwu Grik nke pụtara ‘mkpụrụ obi ha hà otu.’
- source_word: ὅστις
  choice: onye
  rationale: Nnọchiaha njikọ a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: γνησίως
  choice: jiri ezi obi
  rationale: Na-egosipụta eziokwu na enweghị aghụghọ dị n’ụzọ onye ahụ ga-esi lekọta ha.
- source_word: τὰ περὶ ὑμῶν
  choice: ọdịmma unu
  rationale: Na-egosipụta ọnọdụ, mkpa, na ihe metụtara ndị Filipaị n’ụzọ Igbo a na-aghọta ngwa ngwa.
- source_word: μεριμνήσει
  choice: ga-eche banyere
  rationale: N’ebe a, ngwaa ahụ na-egosi nlekọta sitere n’obi, ọ bụghị nchegbu na-adịghị mma.
