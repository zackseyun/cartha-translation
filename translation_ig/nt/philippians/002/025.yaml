id: PHP.2.25
reference: Philippians 2:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀναγκαῖον δὲ ἡγησάμην Ἐπαφρόδιτον τὸν ἀδελφὸν καὶ συνεργὸν καὶ συστρατιώτην μου, ὑμῶν δὲ ἀπόστολον καὶ λειτουργὸν τῆς χρείας μου, πέμψαι πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/025.yaml
  text: But I considered it necessary to send to you Epaphroditus—my brother and fellow worker and fellow soldier[b][a], and your messenger and minister to my need—
translation:
  language: ig
  text: Ma echere m na ọ dị mkpa iziga Epafroditọs ka ọ bịakwute unu—nwanne m, onye mụ na ya na-arụkọ ọrụ, na onye mụ na ya so n’agha; nakwa onye unu zitere[a] na onye na-ejere m ozi n’ihe dị m mkpa[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ozi unu”—ya bụ, onye unu zitere.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “onye na-eje ozi maka mkpa m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγκαῖον
  choice: ọ dị mkpa
  rationale: Nkebi okwu a na-egosi ihe e lere anya dị ka ihe a na-apụghị ịhapụ ime; ọ bụkwa Igbo nkịtị na nke doro anya.
- source_word: ἡγησάμην
  choice: echere m
  rationale: Ọ na-egosi mkpebi ma ọ bụ nyocha Pọl mere, ọ bụghị naanị echiche efu.
- source_word: πέμψαι
  choice: izitere unu
  rationale: Ọ na-asụgharị ‘iziga’ n'ụzọ dabara n’ebe a; etinyeghị ‘izighachi’ n’ihi na echiche ahụ adịghị kpọmkwem n’okwu Grik.
- source_word: ἀδελφὸν
  choice: nwanne m
  rationale: Ọ na-edobe okwu ezinụlọ Pọl ji kpọọ onye ya na ya kwere ekwe, na-enweghị ịgbasa ya karịa ihe e dere.
- source_word: συνεργὸν
  choice: onye mụ na ya na-arụkọ ọrụ
  rationale: Nke a bụ Igbo eke nke na-egosi onye ya na Pọl na-arụkọ ọrụ ozi.
- source_word: συστρατιώτην
  choice: onye mụ na ya bụ ndị agha ibe
  rationale: Ọ na-echekwa ihe atụ agha dị n’okwu Grik ma mee ka ọ ghọta nke ọma n’Igbo.
- source_word: ἀπόστολον
  choice: onye unu zitere
  rationale: N’ebe a, okwu ahụ na-ezo aka n’onye ndị Filipaị zigara dịka onye nnọchiteanya, na-enweghị ime ka ọ bụrụ aha ọkwa pụrụ iche.
- source_word: λειτουργὸν
  choice: onye na-ejere m ozi
  rationale: Ọ na-egosi ọrụ enyemaka dị ùgwù n’enweghị ime ka ọ bụrụ ọkwa ụka nke oge a.
- source_word: τῆς χρείας μου
  choice: n’ihe dị m mkpa
  rationale: Ọ na-akọwa mkpa Pọl nke Epafrọdaịtọs bịara ijere ya ozi banyere ya.
theological_decisions:
- issue: Ma ἀπόστολον ọ bụ aha ọkwa ‘onyeozi’ ka ọ bụ onye e zigara dịka onye nnọchiteanya
  choice: onye unu zitere
  alternative: onyeozi
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ndị Filipaị zigara Epafrọdaịtọs ka ọ nọchite anya ha. Nhọrọ a na-echekwa echiche iziga mmadụ n’enweghị itinye ya n’ọkwa ndịozi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro aha atọ Pọl kpọrọ Epafrọdaịtọs na ihe atụ agha ya; e jighị okwu nwere ike ịpụta ọkwa ụka nke oge a mee λειτουργός.
