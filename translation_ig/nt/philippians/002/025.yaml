- from: Ma echere m na ọ dị mkpa izitere unu Epafrọdaịtọs—nwanne m, onye mụ na ya na-arụkọ ọrụ, na onye mụ na ya bụ ndị agha ibe; ọ bụkwa onye unu zitere[a] na onye na-ejere m ozi n'ihe dị m mkpa[b]—
  to: Ma echere m na ọ dị mkpa iziga Epafroditọs ka ọ bịakwute unu—nwanne m, onye mụ na ya na-arụkọ ọrụ, na onye mụ na ya so n’agha; nakwa onye unu zitere[a] na onye na-ejere m ozi n’ihe dị m mkpa[b]—
  rationale: The revision corrects the fellow-soldier expression to idiomatic Standard Igbo, uses the conventional spelling of Epaphroditus, and makes the alternate-note orthography clearer. It otherwise preserves the draft's faithful rendering and its distinction between Paul’s associates and the Philippians’ commissioned representative.
