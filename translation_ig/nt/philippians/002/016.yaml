revisions:
- from: na-ejidesikwa okwu nke ndụ ike[a]. Mgbe ahụ, n’ụbọchị Mezaya[b], unu ga-abụ ihe m ga-eji nya isi na ọ bụghị n’efu ka m gbara ọsọ, ọ bụghịkwa n’efu ka m dọgburu onwe m n’ọrụ.
  to: na-ejidesi okwu nke ndụ ike[a], ka m nwee ihe m ga-eji na-anya isi n’ụbọchị Mezaya[b], na agbaghị m ọsọ n’efu, adọgburughịkwa m onwe m n’ọrụ n’efu.
  rationale: 'The revision removes unsupported “then” and future wording, and it renders εἰς καύχημα ἐμοὶ with a natural Igbo purpose/result construction: “ka m nwee ihe m ga-eji na-anya isi.” It retains the Greek ambiguity of ἐπέχοντες through the footnote and preserves the source’s parallel emphasis that Paul neither ran nor labored in vain.'
  reviewer_model: gpt-5.6-terra
