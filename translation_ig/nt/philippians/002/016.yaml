  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λόγον ζωῆς ἐπέχοντες, εἰς καύχημα ἐμοὶ εἰς ἡμέραν Χριστοῦ, ὅτι οὐκ εἰς κενὸν ἔδραμον οὐδὲ εἰς κενὸν ἐκοπίασα.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/016.yaml
  text: holding fast the word of life[a], for a boast to me in the day of Messiah[b], that I did not run in vain or labor in vain.
translation:
  language: ig
  text: na-ejidesi okwu nke ndụ ike[a], ka m nwee ihe m ga-eji na-anya isi n’ụbọchị Mezaya[b], na agbaghị m ọsọ n’efu, adọgburughịkwa m onwe m n’ọrụ n’efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-agbatị okwu nke ndụ nye ndị ọzọ” ma ọ bụ “na-ewepụta okwu nke ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Nsụgharị a na-ahụkarị bụ, “ụbọchị Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον ζωῆς
  choice: okwu nke ndụ
  rationale: 'Nke a na-edobe nkenke okwu Grik ahụ na ike ya abụọ: okwu na-enye ndụ na okwu gbasara ndụ.'
- source_word: ἐπέχοντες
  choice: na-ejidesikwa ... ike
  rationale: N’ọnọdụ ndụmọdụ a, ọ pụtara ịnọgide na-ejidesi okwu ahụ ike. Ihe ọ pụkwara ịpụta—ịgbatị ya nye ndị ọzọ ma ọ bụ ikwusa ya—dị n’ala peeji.
- source_word: καύχημα
  choice: ihe m ga-eji nya isi
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi ihe ga-enye Pọl ezi ihe mgbakwasị ụkwụ iji nya isi, n’enweghị echiche nke mpako ọjọọ.
- source_word: εἰς ἡμέραν Χριστοῦ
  choice: n’ụbọchị Mezaya
  rationale: Akara εἰς ebe a na-elekwasị anya n’ụbọchị ikpeazụ ahụ; ‘n’ụbọchị’ bụ okwu Igbo eke. Mezaya na-edobe Χριστός dịka aha ọkwa.
- source_word: οὐκ εἰς κενὸν
  choice: ọ bụghị n’efu
  rationale: Nke a bụ okwu Igbo doro anya maka mbọ na-enweghị mkpụrụ, ma na-edobekwa nkwughachi okwu Pọl.
- source_word: ἔδραμον
  choice: m gbara ọsọ
  rationale: Ọ na-edobe ihe atụ Pọl ji ịgba ọsọ kọwaa ụzọ ozi ya na mbọ ọ gbara.
- source_word: ἐκοπίασα
  choice: m dọgburu onwe m n’ọrụ
  rationale: Nke a na-egosi ọrụ siri ike na ike ọgwụgwụ dị na κοπιάω karịa naanị ‘rụọ ọrụ.’
theological_decisions:
- issue: Ịsụgharị Χριστοῦ n’okwu banyere ụbọchị ikpeazụ
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka aha ọkwa nke onye e tere mmanụ; ‘Mezaya’ na-edobe echiche eze na nke ụbọchị ikpeazụ ahụ.
- issue: Mmekọrịta εἰς καύχημα ἐμοί na nkebi sochirinụ
  choice: Mgbe ahụ, n’ụbọchị Mezaya, unu ga-abụ ihe m ga-eji nya isi
  alternative: ka ọ bụrụ ihe m ga-eji nya isi n’ụbọchị Mezaya
  rationale: Nhazi Igbo a na-eme ka ebumnuche/ntụgharị uche nke εἰς pụta ìhè, ma ghara ime ka ‘ịnya isi’ bụrụ mpako na-adịghị mma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-ejidesikwa’ jikọtara amaokwu a na ndụmọdụ gara aga; ‘unu ga-abụ ihe m ga-eji nya isi’ na-eme ka echiche Grik doo anya n’Igbo n’enweghị ịgbakwunye ozizi pụrụ iche.
