id: PHP.2.15
reference: Philippians 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα γένησθε ἄμεμπτοι καὶ ἀκέραιοι, τέκνα θεοῦ ⸂ἄμωμα μέσον⸃ γενεᾶς σκολιᾶς καὶ διεστραμμένης, ἐν οἷς φαίνεσθε ὡς φωστῆρες ἐν κόσμῳ
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/015.yaml
  text: so that you may become blameless and pure[a], children of God without blemish in the midst of a crooked and twisted generation[c][b], among whom you shine as lights in the world
translation:
  language: ig
  text: ka unu wee ghọọ ndị a na-apụghị ịta ụta na ndị dị ọcha, ụmụ Chineke na-enweghị ntụpọ n’etiti[a] ọgbọ gbagọrọ agbagọ na nke rụrụ arụ[b], n’etiti ha ka unu na-enwu[c] dịka ihe na-enye ìhè[d] n’ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ihe odide ụfọdụ enweghị okwu ndị a sụgharịrị “na-enweghị ntụpọ n’etiti.”
    reason: textual_variant
  - marker: b
    text: Okwu a yiri ka ọ na-ezo aka na Diuterọnọmi 32:5, ebe e mere ka ụmụ Chineke dị iche n’ọgbọ rụrụ arụ ma gbagọrọ agbagọ.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “a na-ahụ unu.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “ihe ndị na-enwu enwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosi nzube ma ọ bụ ihe ga-esi n’ihe ahụ pụta n’Igbo nkịtị.
- source_word: γένησθε
  choice: unu wee ghọọ
  rationale: “Ghọọ” na-echekwa echiche nke ịbịa bụrụ ihe, kama ikwu naanị ọnọdụ mmadụ nọ na ya.
- source_word: ἄμεμπτοι
  choice: ndị a na-apụghị ịta ụta
  rationale: Ọ na-egosi ndị a na-apụghị ibo ebubo ziri ezi n’omume ha.
- source_word: ἀκέραιοι
  choice: ndị dị ọcha
  rationale: Ọ na-enye echiche nke ịdị ọcha na iguzosi ike n’ezi ihe n’asụsụ ndị mmadụ na-aghọta.
- source_word: τέκνα θεοῦ
  choice: ụmụ Chineke
  rationale: τέκνα pụtara ụmụ n’enweghị ịkpa ókè nwoke na nwanyị.
- source_word: ἄμωμα
  choice: ndị na-enweghị ntụpọ
  rationale: Nke a na-edowe ihe atụ nke enweghị mmerụ ma ọ bụ ntụpọ, ma mee ka ọ dị iche na ἄμεμπτοι nke dị ná mmalite.
- source_word: μέσον γενεᾶς
  choice: n’etiti ọgbọ
  rationale: Ọ na-egosi na ụmụ Chineke bi n’ime ndị ọgbọ ahụ gbara ha gburugburu.
- source_word: σκολιᾶς καὶ διεστραμμένης
  choice: gbagọrọ agbagọ na nke rụrụ arụ
  rationale: Ọ na-echekwa okwu ikpe siri ike banyere ụzọ na omume ọgbọ ahụ, n’Igbo doro anya.
- source_word: ἐν οἷς
  choice: bụ́ ndị unu nọ n’etiti ha
  rationale: Nnọchiaha ahụ na-ezo aka ná ndị mejupụtara ọgbọ ahụ, ọ bụghị nanị n’oge ma ọ bụ ọnọdụ.
- source_word: φαίνεσθε
  choice: unu ... na-enwu
  rationale: N’ihi njikọ ya na φωστῆρες, echiche nke inye ìhè dabara nke ọma; ihe ọ pụkwara ịpụta dị ka “a na-ahụ unu” dị n’ala ala peeji.
- source_word: φωστῆρες
  choice: ọkụ
  rationale: “Ọkụ” bụ okwu Igbo dị mfe ma doo anya maka ihe na-enye ìhè; ala ala peeji na-edowe nhọrọ sara mbara karị.
- source_word: ἐν κόσμῳ
  choice: n’ụwa
  rationale: N’ebe a κόσμος na-ezo aka n’ụwa ụmụ mmadụ bi na ya.
theological_decisions:
- issue: Njikọ “ndị na-enweghị ntụpọ” na “ụmụ Chineke,” tinyere ihe yiri okwu Diuterọnọmi 32:5
  choice: E tinyere “ndị na-enweghị ntụpọ” ozugbo n’azụ “ụmụ Chineke,” ma hapụ ntụaka ahụ ka ọ pụta ìhè n’ala ala peeji.
  alternative: A pụrụ ijikọ “ndị na-enweghị ntụpọ” na nkebi ahụ dum, ma ọ bụ mee ka ntụaka Diuterọnọmi pụta ihe karịa n’ahịrị isi.
  rationale: Usoro okwu Grik na-eme ka ἄμωμα kọwaa ụmụ Chineke, ebe okwu banyere ọgbọ gbagọrọ agbagọ na nke rụrụ arụ na-akpali ncheta Diuterọnọmi 32:5. Nsụgharị isi ekwesịghị ịkọwa njikọ ahụ gabiga ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka njikọ ya na amaokwu bu ya ụzọ nọgide na “ka unu wee,” ma debeghachi ihe atụ nke enweghị ntụpọ na nke ìhè n’ụwa.
