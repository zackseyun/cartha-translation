revisions:
- from: ka unu wee ghọọ ndị a na-apụghị ịta ụta na ndị dị ọcha, ụmụ Chineke ndị na-enweghị ntụpọ n’etiti ọgbọ gbagọrọ agbagọ na nke rụrụ arụ,[a] bụ́ ndị unu nọ n’etiti ha na-enwu[b] dị ka ọkụ[c] n’ụwa.
  to: ka unu wee ghọọ ndị a na-apụghị ịta ụta na ndị dị ọcha, ụmụ Chineke na-enweghị ntụpọ n’etiti[a] ọgbọ gbagọrọ agbagọ na nke rụrụ arụ[b], n’etiti ha ka unu na-enwu[c] dịka ihe na-enye ìhè[d] n’ụwa.
  rationale: The revision replaces the overly narrow “ọkụ” with a broad and natural rendering of φωστῆρες, smooths the clause referring to those within the generation, and adds a restrained textual-variant note for the bracketed SBLGNT wording. It retains the Deuteronomy allusion as an explanatory footnote and does not make it part of the translated text.
  reviewer_model: gpt-5.6-terra
