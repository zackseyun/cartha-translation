revisions:
- from: N’ezie, ọ rịara ọrịa ruo n’ókè nke na ọ fọrọ obere ka ọ nwụọ[a]. Ma Chineke meere ya ebere—ọ bụghịkwa naanị ya, kama o mekwara m ebere—ka m ghara inwe mwute tụkwasị n’elu mwute[b].
  to: N’ezie, ọ rịara ọrịa ruo n’ókè nke na ọ fọrọ obere ka ọ nwụọ[a]. Ma Chineke meere ya ebere—ọ bụghịkwa naanị ya, kama o mekwara m ebere—ka m ghara inwe mwute n’elu mwute[b].
  rationale: Only the cumulative grief idiom has been adjusted for more natural Standard Igbo. The revision preserves the Greek repetition, Paul’s stated purpose, and the draft’s careful refusal to specify the means by which God showed mercy.
