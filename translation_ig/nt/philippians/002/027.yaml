id: PHP.2.27
reference: Philippians 2:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ ἠσθένησεν παραπλήσιον ⸀θανάτῳ· ἀλλὰ ὁ θεὸς ⸂ἠλέησεν αὐτόν⸃, οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ, ἵνα μὴ λύπην ἐπὶ λύπην σχῶ.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/027.yaml
  text: For indeed he was sick[a], nearly to death; but God had mercy on him, and not on him only but also on me[b], so that I might not have sorrow upon sorrow.
translation:
  language: ig
  text: N’ezie, ọ rịara ọrịa ruo n’ókè nke na ọ fọrọ obere ka ọ nwụọ[a]. Ma Chineke meere ya ebere—ọ bụghịkwa naanị ya, kama o mekwara m ebere—ka m ghara inwe mwute n’elu mwute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ bịaruru ọnwụ nso” ma ọ bụ “ọ rịara ọrịa ruo n’ókè ọnwụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “mwute n’elu mwute”; nke a na-egosi mwute ọzọ a gbakwụnyere ná mwute o nweburu.
    reason: cultural_note
lexical_decisions:
- source_word: ἠσθένησεν
  choice: ọ rịara ọrịa
  rationale: N’ebe a, ngwaa ahụ na-ekwu maka ọrịa anụ ahụ Epafrọdaịtọs rịara, ọ bụghị naanị adịghị ike; okwu a bụ Igbo doro anya ma dịkwa mma.
- source_word: παραπλήσιον θανάτῳ
  choice: ruo n’ókè nke na ọ fọrọ obere ka ọ nwụọ
  rationale: Nke a na-egosi na ọ bịaruru ọnwụ nso nke ukwuu, ma ọ nwụghị; ọ na-edobe nghọta dị na okwu Grik ahụ n’Igbo nkịtị.
- source_word: ἠλέησεν
  choice: meere ya ebere
  rationale: Nke a na-edobe ịdị arọ nke ebere Chineke ma bụrụkwa ụzọ e si ekwu ya n’Igbo nke ọma.
- source_word: οὐκ αὐτὸν δὲ μόνον ἀλλὰ καὶ ἐμέ
  choice: ọ bụghịkwa naanị ya, kama o mekwara m ebere
  rationale: E kwughachiri ‘ebere’ iji mee ka o doo anya na ebere Chineke metụtara ma ya ma Pọl, ma chekwaa ọdịiche okwu Grik ahụ.
- source_word: ἵνα μὴ
  choice: ka m ghara
  rationale: Nkebiokwu a na-egosipụta nzube ma ọ bụ ihe Chineke mere ka ọ ghara ime, n’enweghị ịkọwa njikọ ahụ karịa ihe Grik kwuru.
- source_word: λύπην ἐπὶ λύπην
  choice: mwute tụkwasị n’elu mwute
  rationale: Nke a na-edobe nkwughachi na mmetụta nke mwute na-agbakwasị mwute ọzọ.
- source_word: σχῶ
  choice: inwe
  rationale: Ọ bụ ntụgharị kpọmkwem na nke na-adịghị etinye nkọwa ọzọ n’echiche sara mbara nke ἔχω.
theological_decisions:
- issue: Njikọ dị n’etiti ebere Chineke na mgbake Epafrọdaịtọs
  choice: E debere ya dịka ‘Chineke meere ya ebere’ n’enweghị ịkọwa ụzọ e si mee ya.
  alternative: Ịsị kpọmkwem na Chineke gwọrọ ya n’ọrụ ebube.
  rationale: Amaokwu ahụ na-ekwu maka ebere Chineke, ma ọ kọwaghị usoro mgbake ahụ; ya mere, ntụgharị ahụ anaghị etinye nkọwa okpukpe ọzọ.
- issue: Ihe ἵνα na-egosi banyere nzube ma ọ bụ nsonaazụ
  choice: ka m ghara
  alternative: n’ihi ya, enweghị m
  rationale: A họọrọ usoro na-echekwa ike nzube nke ἵνα, ma na-ahapụkwa njikọ ahụ dịka ederede Grik si gosipụta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘rịara ọrịa’ maka ọrịa anụ ahụ, ‘meere ... ebere’ iji chekwaa ịdị arọ nke okwu okpukpe ahụ, ma debe usoro nkwughachi ‘mwute ... mwute’ nke dị n’asụsụ Grik.
