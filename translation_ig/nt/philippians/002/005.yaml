  yaml_path: translation/nt/philippians/002/005.yaml
  text: Have this mindset among yourselves[a], which was also in Messiah Jesus[b],
translation:
  language: ig
  text: Nweenụ uche a n’etiti unu[a], nke dịkwa n’ime Mesaịa Jizọs[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nweenụ uche a n’etiti unu, nke unu nwekwara n’ime Mesaịa Jizọs.”
    reason: alternative_reading
  - marker: b
    text: Okwu Grik bụ “Kraịst”; a sụgharịrị ya ebe a “Mesaịa” n’ihi na Χριστός na-arụ ọrụ dịka aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: otu echiche a
  rationale: Ihe ngosi a na-atụ aka n’ụzọ echiche a ga-akọwa site n’omume Mesaịa n’amaokwu ndị na-esote; ‘otu echiche a’ na-eme ka okwu Grik ahụ dị mkpụmkpụ ma doo anya n’Igbo.
- source_word: φρονεῖτε
  choice: Ka otu echiche a dịrị
  rationale: N’akwụkwọ Pọl, ngwaa a na-egosikarị echiche ma ọ bụ ọnọdụ obi mmadụ ji ebi ndụ, ọ bụghị naanị iche echiche; usoro a na-echekwa ike nke iwu ahụ n’Igbo eke.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Nnochiaha ahụ bụ ọtụtụ, ebe ihe gbara amaokwu a gburugburu na-ekwu maka ndụ ndị kwere ekwe n’otu; ya mere, ọ ka mma ịsụgharị ya dị ka ihe dị n’etiti ha karịa ihe dị naanị n’ime onye ọ bụla.
- source_word: ὃ
  choice: bụ́ nke
  rationale: Ọ na-ejikọta echiche a nyere ha iwu inwe na nke metụtara Jizọs, n’enweghị ịgbasa ahịrịokwu Grik ahụ karịa mkpa.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: A hapụrụ preposishọn ἐν dịka ‘n’ime’ iji ghara ikpebi kpọmkwem ụdị mmekọrịta a na-ekwu; ‘Mesaịa’ na-egosipụta Χριστός dịka utu aha.
theological_decisions:
- issue: Ma nkebi ikpeazụ ọ pụtara echiche e gosipụtara n’ime Jizọs, ka ọ bụ echiche ndị kwere ekwe nwere n’ihi ịdị n’ime ya.
  choice: 'Ọgụgụ ihe nlereanya: ‘bụ́ nke dịkwa n’ime Mesaịa Jizọs.’'
  alternative: 'Ọgụgụ isonye/ịdị n’otu: ‘nweekwanụ otu echiche a n’etiti unu, nke unu nwekwara n’ime Mesaịa Jizọs.’'
  rationale: Ihe na-esote na-akọwa iweda onwe Mesaịa ala dịka ihe nlereanya nye ndị kwere ekwe, nke na-akwado ọgụgụ mbụ. Ma okwu Grik ahụ dị nkenke, ọ pụkwara ịpụta echiche nke ịdị n’otu na Mesaịa; ya mere, e debere ọgụgụ ahụ ọzọ n’okpuru amaokwu.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù, dee ya. ‘Otu echiche’ na-ekwurịta ọnọdụ uche na obi n’ụzọ ndị na-agụ Igbo ga-aghọta; ‘n’etiti unu’ na-echekwa akụkụ mmekọrịta obodo nke okwu ahụ. E tinyere akara ndetu ala peeji [a] na [b] kpọmkwem n’ahịrị isi.
