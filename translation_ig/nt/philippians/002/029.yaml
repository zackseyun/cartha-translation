  text: προσδέχεσθε οὖν αὐτὸν ἐν κυρίῳ μετὰ πάσης χαρᾶς, καὶ τοὺς τοιούτους ἐντίμους ἔχετε,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/029.yaml
  text: So welcome him in the Lord with all joy[a], and hold people like him in honor.
translation:
  language: ig
  text: Ya mere, jirinụ ọṅụ niile nabata ya n’Onyenwe anyị, sopụrụnụkwa ndị dị otu ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikom dị otu ahụ.” Okwu Grik e ji mee ihe n’ebe a dị n’ụdị ọtụtụ nke nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέχεσθε
  choice: nabatanu
  rationale: Ọ bụ iwu ka ha jiri obi ọma nabata ya, ọ bụghị naanị ikwe ka ọ bata; “nabatanu” na-egosipụta nnabata ọma n’ụzọ Igbo si ekwu okwu.
- source_word: οὖν
  choice: Ya mere
  rationale: Nke a na-echekwa njikọ nkwubi okwu nke okwu Grik ahụ na ihe Pọl kwuru tupu ya.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: A hapụrụ okwu Pọl a n’ụdị ya dị mkpirikpi ka mmekọrịta ime mmụọ ọ na-egosi ghara ịghọ naanị nkọwa onye ntụgharị.
- source_word: μετὰ πάσης χαρᾶς
  choice: werenụ ọṅụ niile
  rationale: Nke a bụ ụzọ Igbo dị mma isi gosi na ha ga-eji ọṅụ zuru ezu nabata ya, ma na-echekwa ike nke πάσης.
- source_word: τοὺς τοιούτους
  choice: ndị dị otu ahụ
  rationale: Okwu a na-ezo aka n’ụdị ndị dị ka Epafrọdaịtus; nsụgharị a bụ nke sitere n’okwu Grik kpọmkwem ma dịkwa mma n’Igbo.
- source_word: ἐντίμους ἔχετε
  choice: na-asọpụkwa
  rationale: Ngwaa a na-egosi ile ndị dị otu ahụ anya dị ka ndị kwesịrị nsọpụrụ na imeso ha otú ahụ; “na-asọpụkwa” na-ekwupụta ya n’ụzọ dị mfe ma dị ndụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “N’ime Onyenwe anyị” na-echekwa ahịrịokwu Pọl n’enweghị ịkọwa kpọmkwem ụdị mmekọrịta ọ pụtara; “ndị dị otu ahụ” bụ okwu nkịtị n’Igbo, ebe nkọwa ala peeji na-egosi ụdị nwoke dị n’asụsụ Grik.
