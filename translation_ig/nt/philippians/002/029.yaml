  rationale: The revision corrects the Igbo syntax for welcoming someone “with all joy” and replaces an inaccurate verbal form with a natural plural imperative meaning “honor.” It retains the source’s concise Pauline phrase “in the Lord,” the generic reference to persons like Epaphroditus, and the grammatical-gender note without making the translation itself unnecessarily exclusive.
