  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι διὰ τὸ ἔργον ⸀Χριστοῦ μέχρι θανάτου ἤγγισεν, ⸀παραβολευσάμενος τῇ ψυχῇ ἵνα ἀναπληρώσῃ τὸ ὑμῶν ὑστέρημα τῆς πρός με λειτουργίας.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/030.yaml
  text: because for the work of Messiah he came near to death[c][b][a], risking his life to make up for what was lacking in your service to me.
translation:
  language: ig
  text: N’ihi ọrụ Mesaịa[a][c], ọ fọrọ obere ka ọ nwụọ, n’itinye ndụ ya n’ihe ize ndụ, ka o wee mezuo ihe kọrọ n’ije ozi unu nye m.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Kraịst.” N’asụsụ Grik: “ọrụ Kraịst/Mesaịa.”'
    reason: alternative_reading
  - marker: b
    text: “Ihe kọrọ” na-ekwu banyere ije ozi ndị Filipaị na-enweghị ike iji aka ha jeere Pọl n’ihi na ha anọghị ya nso; ọ pụtaghị na ha achọghị ijere ya ozi.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụ ya, “n’ihi na ọ bụ maka ọrụ Mesaịa.”
    reason: previous_rendering
lexical_decisions:
- source_word: διὰ τὸ ἔργον Χριστοῦ
  choice: maka ọrụ Mesaịa
  rationale: “Maka” na-egosipụta ihe kpatara ya ma ọ bụ ihe e ji mee ya, dịka διά tinyere accusative si arụ ọrụ n’ebe a; “ọrụ” na-echekwa ἔργον, ebe “Mesaịa” na-egosipụta aha-ọrụ Χριστός.
- source_word: μέχρι θανάτου ἤγγισεν
  choice: ọ fọrọ obere ka ọ nwụọ
  rationale: Nke a bụ ụzọ Igbo si ekwu nke ọma na mmadụ rutere nnọọ nso n’ọnwụ, ma ọ na-echekwa ihe nkebi Grik ahụ pụtara.
- source_word: παραβολευσάμενος τῇ ψυχῇ
  choice: ebe o tinyere ndụ ya n’ihe ize ndụ
  rationale: Participle ahụ na-egosi na o kpughere ndụ ya n’ihe egwu. N’ebe a ψυχή pụtara ndụ mmadụ n’ụwa, ọ bụghị mkpụrụ obi dị iche n’ahụ.
- source_word: ἵνα ἀναπληρώσῃ
  choice: ka o wee mejupụta
  rationale: “Ka o wee” na-egosipụta nzube nke ἵνα; “mejupụta” na-egosi iweta ihe achọrọ iji zuo ihe fọdụrụ.
- source_word: τὸ ὑμῶν ὑστέρημα
  choice: ihe fọdụrụ
  rationale: Nhọrọ a na-egosi ihe ha na-enweghị ike iweta n’aka ha n’ihi na ha anọghị ya nso, n’ebo ha ebubo mmejọ ma ọ bụ enweghị mmasị.
- source_word: τῆς πρός με λειτουργίας
  choice: n’ozi unu nye m
  rationale: “Ozi” na-ekpuchi ọrụ enyemaka na ije ozi nke λειτουργία pụtara n’okwu gbara ya gburugburu.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n’ahịrịokwu Pọl a
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός ka nwere ike ịnụ dịka aha-ọrụ n’okwu “ọrụ Mesaịa”; “Mesaịa” na-egosipụta ihe aha-ọrụ ahụ pụtara, ebe e debere “Kraịst” dịka nsụgharị ọzọ n’okpuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, sụgharịa ya. Ahịrịokwu “ọ fọrọ obere ka ọ nwụọ” na “tinye ndụ ya n’ihe ize ndụ” bụ okwu Igbo ebumpụta ụwa; e zere okwu ga-eme ka “ihe fọdụrụ” bụrụ ebubo megide ndị Filipaị.
