revisions:
- from: n’ihi na ọ bụ maka ọrụ Mesaịa[a][c] ka ọ fọrọ obere ka ọ nwụọ, ebe o tinyere ndụ ya n’ihe ize ndụ, ka o wee mejupụta ihe fọdụrụ n’ozi unu nye m.[b]
  to: N’ihi ọrụ Mesaịa[a][c], ọ fọrọ obere ka ọ nwụọ, n’itinye ndụ ya n’ihe ize ndụ, ka o wee mezuo ihe kọrọ n’ije ozi unu nye m.[b]
  rationale: The revision replaces an unnatural doubled causal opening, renders ὑστέρημα as a shortfall rather than a remainder, and uses “ije ozi” to preserve the practical-service sense of λειτουργία. It retains the source’s causal and purposive relationships, the title “Mesaịa,” and all footnote anchors.
