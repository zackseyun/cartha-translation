id: PHP.2.19
reference: Philippians 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐλπίζω δὲ ἐν κυρίῳ Ἰησοῦ Τιμόθεον ταχέως πέμψαι ὑμῖν, ἵνα κἀγὼ εὐψυχῶ γνοὺς τὰ περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/019.yaml
  text: But I hope in the Lord Jesus to send Timothy to you soon[a], so that I too may be encouraged when I learn the things concerning you.
translation:
  language: ig
  text: Ma enwere m olileanya n’Onyenwe anyị Jizọs izitere unu Timoti n’oge na-adịghị anya, ka obi sikwuo m ike mgbe m matara akụkọ banyere unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya n’ụzọ nkịtị karịa: “ihe banyere unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλπίζω
  choice: enwere m olileanya
  rationale: Ọ na-egosi olileanya Pọl nwere ugbu a, ma bụrụkwa ụzọ doro anya e si kwuo ya n’Igbo.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n’ihe Pọl na-ekwu.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: n’ime Onyenwe anyị Jizọs
  rationale: E debere echiche nke olileanya Pọl dị n’ime mmekọrịta ya na ịdabere n’Onyenwe anyị Jizọs.
- source_word: Τιμόθεον
  choice: Timoti
  rationale: E dere aha onye ahụ dịka a na-asụkarị ya n’Igbo.
- source_word: ταχέως
  choice: n’oge na-adịghị anya
  rationale: N’ebe a, okwu ahụ na-ekwu banyere mgbe a ga-eziga Timoti, ọ bụghị ọsọ njem ya.
- source_word: πέμψαι ὑμῖν
  choice: na m ga-ezitere unu
  rationale: Nke a bụ ụzọ Igbo dị ugbu a na nke kwụ ọtọ isi gosipụta ebumnuche iziga Timoti ka ọ bịakwute ha.
- source_word: ἵνα κἀγὼ
  choice: ka ... dịkwa m
  rationale: ‘Ka’ na-egosi nzube, ebe ‘-kwa’ na-echekwa nkwusi ike dị na κἀγώ, ya bụ, ‘mụ onwe m kwa.’
- source_word: εὐψυχῶ
  choice: obi dịkwa m mma
  rationale: Ngwaa ahụ pụtara inwe ezigbo mmụọ ma ọ bụ ịbụ onye akụkọ mere ka obi dị ya mma; nhọrọ a bụ Igbo nkịtị ma doo anya.
- source_word: γνοὺς
  choice: mgbe m matara
  rationale: Ọ bụ ezie na ọ bụ participle n’asụsụ Gris, ntụgharị oge a na-ada nke ọma n’Igbo ma na-echekwa njikọ oge ahụ.
- source_word: τὰ περὶ ὑμῶν
  choice: ọnọdụ unu
  rationale: Nkebiokwu ahụ na-ezo aka n’ihe gbasara ndụ na ọnọdụ ndị Filipaị. A họọrọ okwu Igbo dị mfe, ebe nkọwa okwu n’okpuru na-echekwa nsụgharị nkịtị karị.
theological_decisions:
- issue: Nsụgharị κύριος n’ime ἐν κυρίῳ Ἰησοῦ
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ bụ aha nsọpụrụ Kraịst a na-ejikarị emegharị κύριος n’Agba Ọhụrụ, ọ na-echekwakwa ịdị arọ nke aha ahụ n’ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. A zere ntụgharị siri ike nke ga-eme ka ahịrịokwu ahụ daa ka asụsụ mba ọzọ, ma e tinyere nkọwa n’okpuru iji chekwaa ọdịdị sara mbara nke τὰ περὶ ὑμῶν.
