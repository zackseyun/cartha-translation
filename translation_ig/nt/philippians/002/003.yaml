review_pass:
  verdict: revise
  source_fidelity: Ederede ahụ na-anọchi anya mgbochi μηδὲν, mkpali abụọ κατ’ ἐριθείαν / κατὰ κενοδοξίαν, na ntụziaka e ji umeala ele ndị ọzọ anya nke ọma. Otú ọ dị, “naanị” na-agbakwunye nkwusi ike a na-ahụghị n’ederede Grik, ebe “na-ewere” anaghị arụ ọrụ nke ọma dịka isi iwu sochiri “Unu emela.” A gbanwere ya ka iwu ahụ na-aga n’ihu n’Igbo, ma chekwaa echiche nke ὑπερέχοντας dị ka ịdị mkpa karịa.
  naturalness: “Kama n’ịdị umeala n’obi, werenụ …” bụ usoro Standard Igbo zuru ezu ma dị mfe ịgụ. “Ndị dị mkpa karịa unu onwe unu” na-egosi ntụnyere ahụ n’ụzọ dị mma karịa “ndị ka unu onwe unu mkpa,” nke na-ada ntakịrị adịghị eke.
  terminology: “Ọchịchọ ọdịmma onwe unu” na-egosi ἐριθεία dị ka ọchịchọ uru onwe onye; “mpako efu” dabara na κενοδοξία. “Ịdị umeala n’obi” bụ okwu Kwesịrị ekwesị maka ταπεινοφροσύνη. A hapụrụ ụzọ ọzọ “ka elu” n’ihe odide ala peeji maka ὑπερέχοντας.
