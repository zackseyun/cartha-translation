  text: μηδὲν κατ’ ἐριθείαν ⸂μηδὲ κατὰ⸃ κενοδοξίαν, ἀλλὰ τῇ ταπεινοφροσύνῃ ἀλλήλους ἡγούμενοι ὑπερέχοντας ἑαυτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/003.yaml
  text: Do nothing from selfish ambition or empty conceit[a], but in humility regard one another as more important than yourselves[b],
translation:
  language: ig
  text: Unu emela ihe ọ bụla n’ihi ọchịchọ ọdịmma onwe unu ma ọ bụ mpako efu[a]; kama n’ịdị umeala n’obi, werenụ ibe unu dịka ndị dị mkpa karịa unu onwe unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nganga efu” ma ọ bụ “ịchọ otuto efu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “werenụ ibe unu dịka ndị ka unu onwe unu elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲν
  choice: Unu emela ihe ọ bụla
  rationale: Nke a na-egosipụta iwu ndụmọdụ ahụ n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: κατ’ ἐριθείαν
  choice: n’ihi ịchọ ọdịmma onwe unu naanị
  rationale: Ọ na-egosipụta ọchịchọ mmadụ ji achọ uru nke onwe ya n’ụzọ na-akpata esemokwu ma ọ bụ nkewa, kama ịbụ naanị asọmpi nkịtị.
- source_word: κατὰ κενοδοξίαν
  choice: ma ọ bụ mpako efu
  rationale: “Mpako efu” na-egosipụta mpako nke na-enweghị ezigbo ihe ndabere, ma bụrụ okwu ndị Igbo nke oge a ga-aghọta ngwa ngwa.
- source_word: τῇ ταπεινοφροσύνῃ
  choice: n’ịdị umeala n’obi
  rationale: Nke a na-egosipụta ọnọdụ obi ma ọ bụ ụzọ e si eme ihe ahụ.
- source_word: ἀλλήλους ἡγούμενοι
  choice: na-ewere ibe unu
  rationale: “Iwere ... dị ka” na-egosipụta mkpebi nke uche na otú mmadụ si ele onye ọzọ anya; “ibe unu” na-echekwa echiche mmeghachi omume dị na ἀλλήλους.
- source_word: ὑπερέχοντας ἑαυτῶν
  choice: dị ka ndị ka unu onwe unu mkpa
  rationale: Nke a na-enye echiche ntụnyere nke ὑπερέχω n’ụzọ ebumpụta ụwa, n’ebughị ụzọ kwuo na ndị ọzọ dị elu n’ụdị ịdị adị ha.
theological_decisions:
- issue: Ma ὑπερέχοντας ọ pụtara na ndị ọzọ “ka mkpa” ka ọ bụ “ka elu.”
  choice: dị ka ndị ka unu onwe unu mkpa
  alternative: dị ka ndị ka unu onwe unu elu
  rationale: Ihe odide Grik nwere ike igosi ịbụ onye ka elu ma ọ bụ onye karịrị ibe ya. Isi ederede jiri okwu na-akọwa otú e kwesịrị isi jiri ndị ọzọ kpọrọ ihe; ihe odide ala peeji chekwara ntụgharị nke “ka elu.”
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ụdị ndụmọdụ e nyere ọgbakọ dum site n’iji “unu,” ma chekwaa ntụnyere na mgbagwoju ntakịrị dị na ὑπερέχοντας site n’ihe odide ala peeji.
