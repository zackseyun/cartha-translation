  text: I am confident in the Lord that I myself will also come soon.
translation:
  language: ig
  text: Enwere m ntụkwasị obi n’ime Onyenwe anyị na mụ onwe m kwa ga-abịa n’oge na-adịghị anya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Atụkwasịrị m Onyenwe anyị obi na mụ onwe m kwa ga-abịa n’oge na-adịghị anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πέποιθα
  choice: enwere m ntụkwasị obi
  rationale: Ụdị perfect a na-egosi ntụkwasị obi nke guzosiri ike ma na-adịgide ugbu a; okwu a bụ Igbo doro anya nke na-ezere ịkọwa ya dị ka naanị obi ike.
- source_word: δὲ
  choice: Ma
  rationale: E ji ‘Ma’ gosi njikọ dị nro na ihe Pọl kwuru tupu nke a, n’agbanyeghị na δὲ abụghị mgbe niile njụ siri ike.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-edobe akpaokwu Pọl ma na-egosi na ntụkwasị obi ahụ gbadoro ụkwụ n’Onyenwe anyị, n’enweghị ikwu na ọ bụ mkpughe kpọmkwem.
- source_word: ὅτι
  choice: na
  rationale: ‘Na’ na-ewebata ihe bụ ọdịnaya nke ntụkwasị obi Pọl n’ụzọ e si ekwu ya n’Igbo.
- source_word: καὶ αὐτὸς
  choice: mụ onwe m ga-abịakwa
  rationale: ‘Mụ onwe m’ na-echekwa nkwusi ike nke αὐτός, ebe njikọ ‘-kwa’ na-echekwa echiche mgbakwunye nke καί n’ihe metụtara iziga Timoti.
- source_word: ταχέως
  choice: n’oge na-adịghị anya
  rationale: N’ebe a okwu ahụ na-ekwu maka ịdị nso n’oge, ọ bụghị ọsọ njem.
- source_word: ἐλεύσομαι
  choice: ga-abịa
  rationale: Nke a na-echekwa ntụaka nke okwu Grik ahụ site n’echiche ndị Filipaị bụ ndị a na-agwa okwu.
- source_word: κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị maka κύριος n’ụzọ Pọl si eji ya n’ebe a.
theological_decisions:
- issue: Ụdị ntụkwasị obi Pọl na njikọ ya na Onyenwe anyị
  choice: enwere m ntụkwasị obi n’ime Onyenwe anyị
  alternative: atụkwasịrị m Onyenwe anyị obi na mụ onwe m ga-abịakwa n’oge na-adịghị anya
  rationale: Nhọrọ a na-echekwa echiche na olileanya Pọl dị n’ime Onyenwe anyị ma gbadoro ụkwụ na ya, ma ọ naghị eme ka okwu ahụ bụrụ nkwa nke sitere ná mkpughe kpọmkwem.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E debere nkwusi ike dị na ‘mụ onwe m’ na echiche mgbakwunye dị na ‘-kwa,’ ma zere okwu ụka nke otu denominashọn pụrụ iche.
