    reason: lexical_alternative
  revision_rationale: The revision omits the potentially adversative “Ma” for the mild δέ and relocates the additive particle to “mụ onwe m kwa,” preserving both the personal emphasis and the relation to Timothy’s proposed visit. The footnote remains a legitimate, natural alternative for πέποιθα ἐν κυρίῳ without resolving its nuance beyond the source.
