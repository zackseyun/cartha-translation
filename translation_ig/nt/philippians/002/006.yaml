lexical_decisions:
- source_word: ἐν μορφῇ θεοῦ
  choice: n’ụdị Chineke
  rationale: “Ụdị” na-edowe okwu Grik μορφή n’enweghị ime ka ọ bụrụ nkọwa nkà mmụta okpukpe dị warara; ọ na-ahapụkwa ịdị arọ nke okwu ahụ n’ebe Kraịst nọ.
- source_word: ὑπάρχων
  choice: ọ bụ ezie na ọ nọ
  rationale: 'N’usoro arụmụka a, participle ahụ nwere ike igosi nkwenye na-emegide ihe na-esote: n’agbanyeghị ọnọdụ ya, ọ họọrọ ụzọ iweda onwe ya ala. Ihe ọzọ nwere ike ịbụ “ebe ọ nọ,” nke e debere n’okpuru.'
- source_word: ἁρπαγμὸν
  choice: ihe ọ ga-eji meere onwe ya uru
  rationale: N’ebe a, okwu ahụ nwere ike ịpụta ihe mmadụ ji ọnọdụ ya eme uru onwe ya, nke dabara na mmegharị gaa n’ịtọgbọ onwe ya n’amaokwu 7. N’ihi na ihe ọ pụtara ka bụ okwu a na-arụrịta ụka, e debere “ihe a ga-ejidesi ike” na “ihe a ga-apụnara” n’okpuru.
- source_word: ἡγήσατο
  choice: echeghị
  rationale: Nke a na-enye echiche nke ile ihe anya ma kpebie ihe ọ bụ n’Igbo dị mfe ma dị ugbu a.
- source_word: τὸ εἶναι ἴσα θεῷ
  choice: ịha ka Chineke
  rationale: Nke a na-asụgharị infinitive ahụ n’ụzọ Igbo sitere n’okike ma na-echekwa echiche nke ịbụ onye ya na Chineke hara.
theological_decisions:
- issue: Ike okwu ἐν μορφῇ θεοῦ gbasara onye Kraịst bụ
  choice: Jiri “n’ụdị Chineke” n’ahịrị bụ isi.
  alternative: “n’ọdịdị Chineke” ma ọ bụ “ebe ọ bụ Chineke n’ọdịdị ya”
  rationale: Nke a na-edobe okwu Pọl n’onwe ya ma ghara iji okwu nkwenkwe e mepụtara n’oge e mesịrị dochie ya, ebe ọ ka na-ahapụ ịdị elu nke ihe amaokwu ahụ na-ekwu gbasara Kraịst.
- issue: Ihe ἁρπαγμός pụtara n’ihe gbasara ịha ka Chineke
  choice: Jiri “ihe ọ ga-eji meere onwe ya uru” n’ahịrị bụ isi.
  alternative: “ihe a ga-ejidesi ike” ma ọ bụ “ihe a ga-apụnara”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-emesi inye onwe ya ike, ọ bụghị ịchọ uru onwe ya. Ma n’ihi na nkọwa nke ijide ma ọ bụ ịpụnara ka kwe omume, e debere ya n’okpuru kama ikpochapụ esemokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. “Ọ bụ ezie na ọ nọ” na-eme ka ọdịiche dị n’etiti ọnọdụ Kraịst na iweda onwe ya ala pụta ìhè. “Meere onwe ya uru” bụ nkọwa sitere n’ọnọdụ amaokwu ahụ, ebe ndetu ala na-echekwa nkọwa ọdịnala nke ijide ma ọ bụ ịpụnara.
