id: PHP.2.1
reference: Philippians 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἴ τις οὖν παράκλησις ἐν Χριστῷ, εἴ τι παραμύθιον ἀγάπης, εἴ τις κοινωνία πνεύματος, εἴ τις σπλάγχνα καὶ οἰκτιρμοί,
base_translation:
  language: en
  yaml_path: translation/nt/philippians/002/001.yaml
  text: So if there is any encouragement in Messiah[a], if any comfort from love, if any fellowship of the Spirit, if any affection and compassion,
translation:
  language: ig
  text: Ya mere, ọ bụrụ na e nwere agbamume ọ bụla n'ime Mezaịa, ọ bụrụ na e nwere nkasi obi ọ bụla sitere n'ịhụnanya, ọ bụrụ na e nwere mmekọrịta ọ bụla nke Mmụọ[a], ọ bụrụkwa na e nwere mmetụta ịhụnanya miri emi na ọmịiko ọ bụla,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikere òkè n'ime Mmụọ”; ma o yighị ka nke a bụ ya, “mmekọrịta n'ime mmụọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi njikọ nkwubi okwu na ihe Pọl kwuru tupu nke a, ma bụrụkwa okwu Igbo doro anya.
- source_word: παράκλησις
  choice: agbamume
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ihe na-ewusi mmadụ obi ma na-akpali ya; ‘agbamume’ adịghị ekpuchi ya naanị n'okpuru nkasi obi ma ọ bụ iwu.
- source_word: ἐν Χριστῷ
  choice: n'ime Mezaịa
  rationale: Χριστός bụ aha ọkwa pụtara Mezaịa n'ebe a; ‘n'ime’ na-edebe isi nghọta nke ἐν na njikọ ndị kwere ekwe na Mezaịa.
- source_word: παραμύθιον
  choice: nkasi obi
  rationale: Ọ na-egosi okwu ma ọ bụ omume na-akasi obi. Nhọrọ a na-edebekwa ọdịiche ya na παράκλησις, nke a sụgharịrị ‘agbamume.’
- source_word: ἀγάπης
  choice: sitere n'ịhụnanya
  rationale: Nke a na-egosipụta n'Igbo nkasi obi nke ịhụnanya na-eweta, na-enweghị ịgbanwe isi nghọta genitive ahụ.
- source_word: κοινωνία
  choice: mmekọrịta
  rationale: ‘Mmekọrịta’ na-egosipụta njikọ na ikekọrịta ndụ ọnụ; n'ihi na njikọ ya na πνεύματος ka nwere ihe mgbagwoju anya, e debere nkọwa ọzọ n'ala peeji.
- source_word: πνεύματος
  choice: nke Mmụọ
  rationale: Mkpụrụedemede ukwu na-egosi na o yikarịrị ka Pọl na-ekwu maka Mmụọ Nsọ, ma etinyeghị ‘Nsọ’ nke na-adịghị n'okwu Grik ahụ kpọmkwem. Ihe ọzọ okwu ahụ pụrụ ịpụta dị n'ala peeji.
- source_word: σπλάγχνα
  choice: mmetụta ịhụnanya miri emi
  rationale: Ọ bụ akpaalaokwu sitere n'akụkụ ime ahụ nke na-egosi mmetụta ịhụnanya dị nro ma dị omimi; nsụgharị a bụ Igbo nkịtị ma zere okwu anatomical.
- source_word: οἰκτιρμοί
  choice: ọmịiko
  rationale: ‘Ọmịiko’ bụ okwu Igbo dị ugbu a nke na-egosi compassion n'ụzọ doro anya ma na-esonyere ‘mmetụta ịhụnanya miri emi’ nke ọma.
theological_decisions:
- issue: Ma πνεύματος ọ na-ezo aka kpọmkwem n'Mmụọ Nsọ, nakwa otú genitive ya na κοινωνία si arụ ọrụ
  choice: mmekọrịta nke Mmụọ
  alternative: 'ikere òkè n''ime Mmụọ; nke a na-adịchaghị ka ọ bụ ya: mmekọrịta n''ime mmụọ'
  rationale: N'usoro ngọzi Ndị Kraịst a, o yikarịrị ka πνεύματος na-ezo aka n'Mmụọ Nsọ. Otú ọ dị, Grik akọwaghị kpọmkwem ma ọ bụ mmekọrịta Mmụọ na-eweta, mmekọrịta ya na Mmụọ, ma ọ bụ ikere òkè n'ime Mmụọ; ya mere, e debere ihe ọzọ nwere ike ịbụ n'ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu anọ nke Grik na nkwughachi ‘ọ bụrụ na e nwere ... ọ bụla,’ tinyere kọma ikpeazụ n'ihi na amaokwu a na-aga n'ihu n'amaokwu 2.
