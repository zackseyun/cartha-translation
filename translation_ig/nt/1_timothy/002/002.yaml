id: 1TI.2.2
reference: 1 Timothy 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: ig
  text: maka ndị eze na ndị niile nọ n'ọkwá dị elu[a], ka anyị wee bie ndụ dị n'udo na nke dị jụụ, n'ịsọpụrụ Chineke na n'omume dị ùgwù niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị niile nwere ikike ọchịchị.” N'ụzọ nkịtị, okwu Grik ahụ bụ “ndị niile nọ n'ọnọdụ dị elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: maka
  rationale: N'ihe gbara amaokwu a gburugburu, okwu a na-egosi ndị a na-ekpe ekpere n'ihi ha; “maka” bụ ụzọ Igbo doro anya ma kwekọọ n'echiche ahụ.
- source_word: βασιλέων
  choice: ndị eze
  rationale: Aha Grik a pụtara ndị eze kpọmkwem; nsụgharị a na-echekwa ụdị okwu ahụ n'agbanyeghị na ọ pụrụ ịgụnye ndị ọchịchị kachasị elu n'ọnọdụ Rom.
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: ndị niile nọ n'ọkwá dị elu
  rationale: Nkebiokwu ahụ sara mbara karịa naanị ndị nwere ọkwa ọchịchị iwu kwadoro; ọ na-ekwu maka ndị nọ n'ọnọdụ dị elu ma ọ bụ ndị a ma ama n'ike.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo a na-egosi nzube ma ọ bụ ihe a tụrụ anya na ọ ga-esi na ekpere ahụ pụta.
- source_word: ἤρεμον
  choice: dị n'udo
  rationale: Okwu a na-egosi ọnọdụ ndụ nke ọgba aghara na nsogbu na-adịghị akpaghasị.
- source_word: ἡσύχιον
  choice: dị jụụ
  rationale: Nke a na-emesi ịdị nwayọọ na enweghị mkpọtụ ma ọ bụ nsogbu ike, ma na-edobe ọdịiche nta dị n'etiti ya na ἤρεμον.
- source_word: βίον διάγωμεν
  choice: anyị wee na-ebi ndụ
  rationale: Nkebiokwu Grik ahụ pụtara ibi ma ọ bụ iduzi ndụ mmadụ; okwu Igbo a bụ nke e ji eme ihe n'ụzọ ebumpụta ụwa.
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: na-asọpụrụ Chineke n'ụzọ niile
  rationale: εὐσέβεια na-egosi nsọpụrụ na nrara nye Chineke nke a na-egosipụta n'omume; nsụgharị a na-eme ka ihe okwu ahụ na-ezo aka na ya doo onye na-agụ Igbo anya.
- source_word: σεμνότητι
  choice: na-ebi ndụ kwesịrị nsọpụrụ
  rationale: Okwu a na-egosi omume dị ezigbo mkpa, kwesịkwara nsọpụrụ; nkebiokwu Igbo a na-ezere okwu ochie ma na-echekwa ibu omume ọma dị na ya.
theological_decisions:
- issue: Oke na nzube nke ikpe ekpere maka ndị ọchịchị
  choice: E gosiri na a ga-ekpe ekpere maka ndị eze na ndị nọ n'ọkwá dị elu, ka ndị kwere ekwe nwee ike ibi ndụ udo, na-asọpụrụ Chineke ma na-akpa àgwà kwesịrị nsọpụrụ.
  alternative: Ịsụgharị ya ka o mesie nrubeisi nye ndị ọchịchị ike karị, ma ọ bụ ka ọ bụrụ naanị ndị ji ikike ọchịchị iwu kwadoro.
  rationale: Okwu Grik ahụ kpọrọ ndị a ga-ekpe ekpere maka ha na nzube nke ekpere ahụ, ma o kwughị na a ga-akwado onye ọchịchị ọ bụla n'ihe niile. Ya mere, nsụgharị ahụ adịghị etinye ozizi ndọrọ ndọrọ ọchịchị ọzọ n'ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “dị n'udo” na “dị jụụ” iji chekwaa ọdịiche dị n'etiti ἤρεμον na ἡσύχιον, ebe e mere ka εὐσέβεια doo anya dịka ịsọpụrụ Chineke nke a na-egosipụta ná ndụ.
