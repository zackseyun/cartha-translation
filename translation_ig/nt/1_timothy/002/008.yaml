id: 1TI.2.8
reference: 1 Timothy 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: ig
  text: Ya mere, achọrọ m ka ndị nwoke n’ebe niile kpee ekpere, na-eweli aka dị nsọ elu n’enweghị iwe na arụmụka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’enweghị iwe na obi abụọ.” Okwu Grik a nwere ike ịpụta ịtụgharị uche ma ọ bụ obi abụọ dị n’ime mmadụ, ma n’ebe a o yikarịrị ka ọ na-ezo aka n’arụmụka na-akpata esemokwu n’ọgbakọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: achọrọ m
  rationale: Nke a na-egosi ọchịchọ na mkpebi Pọl n’ụzọ Igbo nke oge a na-aghọta nke ọma.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-echekwa njikọ echiche a na ihe e kwuru tupu ya.
- source_word: προσεύχεσθαι
  choice: na-ekpe ekpere
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ikpe ekpere.
- source_word: τοὺς ἄνδρας
  choice: ndị nwoke
  rationale: ἀνήρ ebe a na-ezo aka kpọmkwem n’ụmụ nwoke, ọ bụghị mmadụ niile, dịka ntụziaka dị iche iche nye ndị nwoke na ndị inyom n’okwu gbara ya gburugburu si kwado.
- source_word: ἐν παντὶ τόπῳ
  choice: nọ n’ebe niile
  rationale: Ọ na-enye echiche nkesa nke ‘n’ebe ọ bụla’ n’Igbo dị nro ma doo anya.
- source_word: ἐπαίροντας
  choice: na-eweli ... elu
  rationale: Ọ na-akọwa omume na-eso ikpe ekpere, ma bụrụkwa ụzọ Igbo ebumpụta ụwa si kwuo ya.
- source_word: ὁσίους χεῖρας
  choice: aka dị nsọ
  rationale: Ọ na-echekwa asụsụ ihe atụ nke Grik na echiche nke ndụ ma ọ bụ omume Chineke nabatara.
- source_word: χωρὶς
  choice: n’enweghị
  rationale: Ọ na-egosi na ihe ndị a ekwesịghị ịdị mgbe a na-ekpe ekpere.
- source_word: ὀργῆς
  choice: iwe
  rationale: ‘Iwe’ bụ okwu Igbo doro anya nke dabara n’ọnọdụ mmekọrịta mmadụ na ibe ya.
- source_word: διαλογισμοῦ
  choice: esemokwu
  rationale: διαλογισμός nwere ike ịpụta arụmụka, echiche ime obi, ma ọ bụ obi abụọ. N’ebe a, ijikọ ya na ‘iwe’ na ọnọdụ ekpere ọgbakọ na-akwado echiche esemokwu; a debere ‘obi abụọ’ n’ala peeji.
theological_decisions:
- issue: Nrụtụ aka kpọmkwem nke τοὺς ἄνδρας n’ihe gbasara okike
  choice: ndị nwoke
  alternative: ndị mmadụ; mmadụ niile; ndị di
  rationale: Ederede Grik jiri aha nke na-ezo aka n’ụmụ nwoke, ọnọdụ gbara ya gburugburu na-enyekwa ndị nwoke na ndị inyom ntụziaka dị iche iche; ya mere, a naghị eme ya ka ọ bụrụ okwu gbasara mmadụ niile.
- issue: Ihe διαλογισμοῦ pụtara n’ọnọdụ ekpere
  choice: esemokwu
  alternative: arụmụka; obi abụọ
  rationale: Njikọ ya na iwe na ọnọdụ ekpere ọgbakọ na-eme ka esemokwu na-akpata nkewa bụrụ ihe o yikarịrị ka e bu n’uche. Ma ebe ‘obi abụọ’ nwekwara nkwado n’ụzọ okwu Grik si arụ ọrụ, e debere ya n’ala peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ntụziaka siri ike nke ederede, nrụtụ aka kpọmkwem nye ndị nwoke, na ihe oyiyi nke iweli aka dị nsọ, ma na-edebe nghọta ọzọ nke διαλογισμοῦ n’ala peeji.
