  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: ig
  text: onye chọrọ ka a zọpụta mmadụ niile, nakwa ka ha bịa nweta ọmụma nke eziokwu ahụ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nwere ọchịchọ ka a zọpụta mmadụ niile.” Okwu Grik a nwekwara ike ịpụta “na-achọ” ma ọ bụ “nwere uche”; e ji “chọrọ” mee ka nsụgharị ahụ ghara ikpebi arụmụka nkà mmụta okpukpe karịa ihe okwu ahụ kwuru.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka ha bịa n’ọmụma zuru ezu nke eziokwu ahụ.” Aha okwu Grik ahụ nwere ike igosi ịma ihe nke ọma ma ọ bụ n’ụzọ zuru ezu karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: onye
  rationale: Nnọchiaha njikọ a na-ezo aka n’ebe Chineke nọ n’amaokwu bu ụzọ; “onye” na-ejikọta ahịrịokwu ahụ n’ụzọ dị mfe ma kwekọọ n’Igbo.
- source_word: πάντας ἀνθρώπους
  choice: mmadụ niile
  rationale: Nkebi okwu Grik a na-ekwu maka mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke; “mmadụ niile” na-egosipụta oke ya n’enweghị ibelata ya ka ọ bụrụ naanị ụdị mmadụ dị iche iche.
- source_word: θέλει
  choice: chọrọ
  rationale: θέλω nwere ike ịpụta ịchọ, inwe ọchịchọ, ma ọ bụ ikpebi. “Chọrọ” bụ okwu Igbo e ji eme ihe nke ọma nke na-edobe obosara ihe okwu Grik ahụ nwere n’ebughị ụzọ kpebie arụmụka banyere ụdị uche Chineke.
- source_word: σωθῆναι
  choice: ka a zọpụta
  rationale: Ọ bụ infinitive passive nke σῴζω, nke n’ebe a na-ekwu maka nzọpụta; “ka a zọpụta” na-edobe passive ahụ ma doo anya n’Igbo.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: ka ha bịakwa mara eziokwu ahụ nke ọma
  rationale: ἐπίγνωσις nwere ike ịpụta ịma, ịghọta, ma ọ bụ ịma nke ọma. Nsụgharị a na-eme ka okwu ahụ bụrụ Igbo ebumpụta ụwa ma na-egosi ụda nghọta miri emi okwu ahụ nwere.
- source_word: ἐλθεῖν
  choice: bịa
  rationale: ἔρχομαι tinyere εἰς na-egosi ịbata n’ọnọdụ ma ọ bụ iru ya; “bịa” na-edobe ihe atụ mmegharị ahụ n’ụzọ dabara adaba n’Igbo.
theological_decisions:
- issue: Oke πάντας ἀνθρώπους na uche Chineke banyere nzọpụta
  choice: A sụgharịrị πάντας ἀνθρώπους dịka “mmadụ niile,” θέλει dịka “chọrọ.”
  alternative: “ụdị mmadụ niile”; ma ọ bụ iji okwu siri ike nke pụtara na Chineke “ekpebiela” ịzọpụta mmadụ niile
  rationale: Okwu Grik ahụ n’onwe ya nwere oke zuru ụwa ọnụ. Nsụgharị ahụ ekwesịghị ibelata ya ka ọ bụrụ naanị ụdị mmadụ dị iche iche, ma ọ bụ mee θέλει ka ọ bụrụ okwu nkà mmụta okpukpe siri ike banyere mkpebi Chineke. Nke a na-edobe esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “ka a zọpụta mmadụ niile” na-edobe passive Grik ahụ, ebe “ka ha bịakwa mara eziokwu ahụ nke ọma” na-eme ka njikọ infinitive abụọ ahụ bụrụ nke dị mma n’Igbo. Akara nkọwa ala peeji [a] na [b] dị n’isiokwu ahụ.
