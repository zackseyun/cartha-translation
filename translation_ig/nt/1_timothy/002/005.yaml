  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: ig
  text: N’ihi na otu Chineke dị, otu onye ogbugbo dịkwa n’etiti Chineke na ụmụ mmadụ[a]—onye bụ mmadụ, Mesaya Jizọs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ na-ekwu maka mmadụ n’ozuzu. E ji “ụmụ mmadụ” mee ka njikọ ya na “mmadụ” e kwuru n’ikpeazụ pụta ìhè.
    reason: lexical_clarification
  - marker: b
    text: Ma ọ bụ, “Kraịst Jizọs.” “Kraịst” bụ ụdị Grik nke aha ọkwa ahụ a sụgharịrị “Mesaya.”
    reason: alternative_rendering
lexical_decisions:
- source_word: εἷς ... εἷς
  choice: otu ... otu
  rationale: 'E ji “otu” mee ihe n’ebe abụọ ahụ iji chekwaa nkwughachi siri ike dị na Grik: otu Chineke, otu onye ogbugbo.'
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ihe e kwuru n’ihu ya.
- source_word: μεσίτης
  choice: onye ogbugbo
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-anọ n’etiti akụkụ abụọ iji mee ka ha nwee mmekọrịta ma ọ bụ udo.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: n’etiti Chineke na ụmụ mmadụ
  rationale: Ọ bụ ezie na Grik ji ụdị okwu nke ihe nwe mee ihe, “onye ogbugbo” na Igbo na-achọkarị “n’etiti.” “Ụmụ mmadụ” ebe a pụtara mmadụ niile.
- source_word: ἄνθρωπος
  choice: onye ahụ bụ mmadụ
  rationale: Nke a na-ekwupụta n’ụzọ doro anya na onye ogbugbo ahụ bụ mmadụ n’ezie, ma na-ejikọkwa ya na “ụmụ mmadụ” e kwuru tupu ya.
- source_word: Χριστὸς Ἰησοῦς
  choice: Mesaya Jizọs
  rationale: A sụgharịrị Χριστός dị ka aha ọkwa “Mesaya,” ebe Jizọs bụ aha onye ahụ.
theological_decisions:
- issue: Njikọ dị n’etiti ἀνθρώπων na ἄνθρωπος
  choice: ụmụ mmadụ ... onye ahụ bụ mmadụ
  alternative: ndị mmadụ ... mmadụ ahụ
  rationale: Nhọrọ a na-egosi ma mmadụ niile nke ọtụtụ ma ịbụ mmadụ nke otu onye ogbugbo ahụ, na-enweghị ime ka okwu ahụ bụrụ naanị maka ụmụ nwoke.
- issue: Ikwupụta ἄνθρωπος Χριστὸς Ἰησοῦς
  choice: onye ahụ bụ mmadụ, ya bụ Mesaya Jizọs
  alternative: mmadụ ahụ, Mesaya Jizọs
  rationale: Nke a na-edobe nkwusi okwu nke amaokwu ahụ banyere ịbụ mmadụ nke Jizọs, ma ọ naghị etinye n’amaokwu ahụ nkwubi okwu ọ na-ekwughị banyere ịdị-Chineke ya.
- issue: Nsụgharị Χριστός dịka aha ọkwa
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: E ji “Mesaya” gosi na Χριστός bụ aha ọkwa ebe a, ọ bụghị aha ezinụlọ ma ọ bụ naanị akụkụ aha a na-edeghịgharị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro “otu ... ka e nwere, otu ... ka e nwekwara” na-eme ka nkwughachi na nkwusi okwu Grik pụta ìhè; akara ogologo ahụ na-egosi nkọwa apposition nke onye ogbugbo ahụ.
