    reason: lexical_clarification
  - marker: b
    text: Ma ọ bụ, “Kraịst Jizọs.” “Kraịst” bụ ụdị Grik nke aha ọkwa ahụ a sụgharịrị “Mesaya.”
    reason: alternative_rendering
  revision_rationale: The revision retains the Greek parallelism and all central terms, but uses more idiomatic Standard Igbo. 'Onye bụ mmadụ, Mesaya Jizọs' keeps the final wording as an identification of the one mediator and affirms his humanity without adding a demonstrative or an interpretive 'that is.' The notes are adjusted for lexical precision.
