  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: ig
  text: onye nyere onwe ya dịka ụgwọ mgbapụta maka mmadụ niile[a]—ihe àmà e mere ka a mara n’oge ndị kwesịrị ekwesị.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “maka ọdịmma mmadụ niile.” “Maka mmadụ niile” na-edebe obosara okwu Grik ahụ, na-ekpebighị ma Pọl ọ na-ekwu maka onye ọ bụla n’otu n’otu, ka ọ bụ ụdị mmadụ niile.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịtụgharị ya, “ịgba àmà ahụ,” ma ọ bụ “ihe àmà e mere ka a mara n’oge ndị kwesịrị ekwesị.” Okwu Grik a dị mkpirikpi; ọ pụrụ ịpụta na inye onwe Kraịst bụ ihe àmà e mere ka a mara n’oge Chineke họpụtara.
    reason: lexical_alternative
  - marker: c
    text: 'Nsụgharị ọzọ e nwere bụ: “ihe àmà e nyere n’oge ndị kwesịrị ekwesị.”'
    reason: previous_rendering
lexical_decisions:
- source_word: δοὺς
  choice: nyere
  rationale: Ọ bụ aorist participle nke δίδωμι, na-akọwa “mmadụ ahụ, Kraịst Jizọs” n’amaokwu bu ụzọ. “Onye nyere” na-eme ka njikọ ahụ doo anya n’Igbo n’enweghị ịgbatị ihe Grik kwuru.
- source_word: ἑαυτὸν
  choice: onwe ya
  rationale: Nnọchiaha nlọghachi a na-emesi ike na ọ bụ onwe ya ka o nyere; “onwe ya” bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a.
- source_word: ἀντίλυτρον
  choice: ụgwọ mgbapụta
  rationale: Okwu a pụtara ihe ma ọ bụ ụgwọ e nyere iji gbapụta ndị ọzọ, ebe ἀντί- nwekwara echiche nke ịnọchi anya ma ọ bụ ịbụ ihe e nyere n’ọnọdụ onye ọzọ. “Ụgwọ mgbapụta” na-eburu isi echiche ahụ n’enweghị itinye nkọwa ozizi karịrị okwu Grik.
- source_word: ὑπὲρ πάντων
  choice: maka mmadụ niile
  rationale: ὑπέρ nwere ike ịpụta “maka” ma ọ bụ “n’ihi ọdịmma/ọnọdụ.” N’ebe a πάντων na-ezo aka ná mmadụ dịka ihe gbara amaokwu ahụ gburugburu si gosi. Nsụgharị a na-edebe obosara okwu ahụ ma ọ naghị ekpebi ma ọ bụ onye ọ bụla n’otu n’otu ka e bu n’uche, ka ọ bụ ụdị mmadụ niile.
- source_word: τὸ μαρτύριον
  choice: ihe àmà ahụ
  rationale: Okwu ahụ nwere ike ịpụta “ihe àmà” ma ọ bụ “ịgba àmà.” Edemede ahụ kpọmkwem (τὸ) kwadoro “ahụ,” ebe nhazi apposition a na-ejikọta ihe àmà ahụ na inye onwe Kraịst, ma na-ahapụ mkpirikpi okwu Grik ka ọ dị.
- source_word: καιροῖς ἰδίοις
  choice: n’oge ndị kwesịrị ekwesị
  rationale: καιροῖς bụ ọtụtụ ma na-ezo aka n’oge dabara adaba ma ọ bụ oge a kara aka. “N’oge ndị kwesịrị ekwesị” na-edebe ọtụtụ ahụ ma ghara ịkọwapụta onye nwe oge ndị ahụ karịa ihe Grik kwuru.
theological_decisions:
- issue: Oke πάντων gbasara ụgwọ mgbapụta Kraịst
  choice: maka mmadụ niile
  alternative: maka onye ọ bụla; maka ụdị mmadụ niile
  rationale: Amaokwu ahụ ji okwu sara mbara kwuo ya, ma ọ naghị edozi n’onwe ya arụmụka ndị e mesịrị banyere ma ọ bụ onye ọ bụla n’otu n’otu ka e bu n’uche, ka ọ bụ ụdị na òtù mmadụ niile. Ya mere, nsụgharị ahụ na-edebe obosara na esemokwu dị n’okwu ahụ.
- issue: Echiche ịnọchi anya dị na ἀντίλυτρον
  choice: ụgwọ mgbapụta
  alternative: ụgwọ mgbapụta e nyere n’ọnọdụ ndị ọzọ
  rationale: ἀντίλυτρον nwere ike ibu echiche nke ihe e nyere n’ọnọdụ onye ọzọ, ma ịgbasa nke ahụ n’ahịrị bụ isi ga-abụ nkọwa karịa nsụgharị. “Ụgwọ mgbapụta” na-edebe isi echiche mgbapụta ahụ ma hapụ ike zuru ezu nke ἀντί- n’ihe ndekọ okwu.
- issue: Njikọ τὸ μαρτύριον na nkebi bu ya ụzọ
  choice: 'E debere ya dịka apposition: “ihe àmà ahụ n’oge ndị kwesịrị ekwesị”'
  alternative: “ihe àmà e nyere n’oge ndị kwesịrị ekwesị”; “nke bụ ihe àmà e mere ka a mara n’oge ndị kwesịrị ekwesị”
  rationale: Grik dị mkpirikpi, o nweghịkwa ngwaa doro anya n’akụkụ a. Nsụgharị bụ isi anaghị atụkwasị “e nyere” ma ọ bụ “e mere ka a mara,” ka ọ ghara idozi ihe ahịrịokwu ahụ hapụrụ ka ọ nwee ụzọ nghọta karịrị otu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta, mee ihe. “Ụgwọ mgbapụta” bụ okwu a na-aghọta nke ọma karịa ntụgharị teknụzụ dịka “ụgwọ nnọchi-mgbapụta.” Akara ogologo (—) na-egosi apposition dị na Grik ma na-enyere onye na-agụ ya aka ịhụ na “ihe àmà ahụ” na-akọwa ihe e kwuru banyere inye onwe Kraịst; a kpachapụrụ anya ghara ịtinye ngwaa na-adịghị na isi mmalite.
