id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: ig
  text: Ma anaghị m ekwe ka nwanyị kuzie ma ọ bụ ka ọ chị nwoke[a][b]; kama ka ọ nọrọ n’ịdị jụụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwunye ... di.” Okwu Grik ndị a nwere ike ịpụta “nwanyị/nwoke” n’izugbe ma ọ bụ “nwunye/di” n’ihe gbasara alụmdi na nwunye.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka ọ nwee ikike n’ebe nwoke nọ”; ikekwe, “ka ọ na-achị nwoke n’ike.” Ngwaa Grik a dị ụkọ, a na-arụkwa ụka banyere kpọmkwem ndò ihe ọ pụtara.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ịgbachi nkịtị.” Okwu Grik a nwere ike ịpụta ịdị jụụ, ịnọ nwayọọ, ma ọ bụ ịgbachi nkịtị, dabere n’ihe gbara ya gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: kụzie ihe
  rationale: Nke a na-egosipụta infinitive Grik dị ka ihe e kwere ma ọ bụ nke a na-ekweghị ka e mee, n’Igbo nkịtị ma doo anya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ihe dị iche na ntụziaka gara aga.
- source_word: γυναικί
  choice: nwanyị
  rationale: γυνή nwere ike ịpụta nwanyị ma ọ bụ nwunye; ebe a, ‘nwanyị’ bụ nghọta sara mbara dabara n’okwu gbara ya gburugburu, ma e debere ‘nwunye’ n’ala peeji.
- source_word: οὐκ ἐπιτρέπω
  choice: anaghị m ekwe ka
  rationale: Nke a bụ ụzọ Igbo dị ugbu a si egosipụta nkwupụta onye mbụ na nke ugbu a n’enweghị ịgbakwunye nkọwa oge na-adịghị na Grik.
- source_word: οὐδὲ
  choice: ma ọ bụ
  rationale: Ọ na-ejikọta omume nke abụọ a machibidoro na nke mbụ n'ụzọ doro anya n’Igbo.
- source_word: αὐθεντεῖν
  choice: ka ọ na-achị
  rationale: Okwu Grik a dị ụkọ, a na-arụkwa ụka banyere ndò ya. ‘Ịchị’ na-egosipụta ikike n’enweghị itinye ozugbo echiche nke iji ike emegbu mmadụ; a na-edebe ụzọ nghọta ndị ọzọ n’ala peeji.
- source_word: ἀνδρός
  choice: nwoke
  rationale: ἀνήρ nwere ike ịpụta nwoke ma ọ bụ di; ‘nwoke’ ka ahọpụtara n’isiokwu, ebe e debere nghọta alụmdi na nwunye n’ala peeji.
- source_word: ἀλλ’
  choice: kama
  rationale: Ọ na-egosi ihe a tụrụ anya ya dị iche n’ihe ndị a machibidoro.
- source_word: εἶναι
  choice: ka ọ nọrọ
  rationale: Nke a na-eme ka infinitive ahụ bụrụ Igbo eke ma na-egosi ọnọdụ a tụrụ anya n’aka nwanyị ahụ.
- source_word: ἐν ἡσυχίᾳ
  choice: n’ịdị jụụ
  rationale: ἡσυχία nwere ike ịpụta ịdị jụụ, ịnọ nwayọọ, ma ọ bụ ịgbachi nkịtị. ‘Ịdị jụụ’ anaghị ekwubiga ihe ókè dị ka a ga-asị na ọ pụtara enweghị ikwu okwu ọ bụla.
theological_decisions:
- issue: Ihe αὐθεντεῖν pụtara n’amaokwu a a na-arụ ụka banyere ya
  choice: ka ọ na-achị
  alternative: ka ọ nwee ikike n’ebe nwoke nọ; ka ọ na-achị nwoke n’ike
  rationale: A họọrọ okwu na-anọpụ iche nke na-egosi iji ikike eme ihe, n’ebughị ụzọ kpebie na ngwaa ahụ pụtara ọchịchị mmegbu. Ala peeji na-echekwa ejighị n’aka dị n’okwu Grik ahụ.
- issue: Ma γυνή / ἀνήρ pụtara nwanyị/nwoke ka ọ bụ nwunye/di
  choice: nwanyị ... nwoke
  alternative: nwunye ... di
  rationale: Aha abụọ ahụ nwere nghọta izugbe na nke alụmdi na nwunye. Ihe gbara amaokwu ahụ gburugburu na-akwado nghọta izugbe dị ka isi nsụgharị, ma a hapụrụ nghọta nke alụmdi na nwunye n’ala peeji iji chekwaa mgbagwoju anya dị na Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, mee nsụgharị ahụ. A haziri akara ala peeji ka ha soro okwu ha na-akọwa ozugbo, ma e chekwara mgbagwoju anya nke okwu ndị metụtara nwoke/nwanyị na ikike.
