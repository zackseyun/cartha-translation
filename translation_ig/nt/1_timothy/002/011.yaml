  text: γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: ig
  text: Ka nwanyị mụta ihe n’ịdị jụụ[b][a], na nrubeisi zuru ezu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwunye,” dabere n’ọnọdụ okwu; okwu Grik ahụ nwere ike ịpụta “nwanyị” ma ọ bụ “nwunye.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’ịgbachi nkịtị”; okwu Grik ahụ nwekwara ike ịpụta ịnọ jụụ ma ọ bụ ịdị nwayọọ, ọ bụghị na mmadụ aghaghị ịghara ikwu okwu ọ bụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: nwanyị
  rationale: γυνή nwere ike ịpụta ‘nwanyị’ ma ọ bụ ‘nwunye’ dabere n’ọnọdụ okwu. N’ebe a, ‘nwanyị’ adịghị eme ka ihe a na-ekwu bụrụ naanị banyere ndị lụrụ di, ma na-edobe ụdị otu onye dị na Grik.
- source_word: ἐν ἡσυχίᾳ
  choice: n’ịdị jụụ
  rationale: ἡσυχία nwere ike ịpụta ịnọ jụụ, ịdị nwayọọ, ma ọ bụ ịgbachi nkịtị. ‘N’ịdị jụụ’ na-egosi omume dị nwayọọ nke na-adịghị akpaghasị ihe, na-emeghị ka okwu ahụ bụrụ iwu ịghara ikwu okwu ọ bụla.
- source_word: μανθανέτω
  choice: Ka ... mụta ihe
  rationale: Nke a bụ ngwaa iwu, onye nke atọ, otu onye. Usoro ‘Ka ... mụta ihe’ na-ebute ike iwu ahụ n’Igbo ma na-edokwa akụkụ dị mma nke iwu ahụ—ya bụ, ka nwanyị mụta ihe.
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: na nrubeisi zuru ezu
  rationale: ὑποταγή pụtara nrubeisi ma ọ bụ ido onwe n’okpuru. ‘Zuru ezu’ na-egosipụta πάσῃ, ebe a na-ahapụghị onye ma ọ bụ ihe a ga-erubere isi ka ntụgharị tinye ya n’onwe ya.
theological_decisions:
- issue: Ma ἡσυχία ọ̀ pụtara ịgbachi nkịtị kpamkpam ka ọ bụ omume dị jụụ
  choice: ịdị jụụ
  alternative: ịgbachi nkịtị
  rationale: Okwu Grik ahụ nwere ike ịpụta ịgbachi nkịtị, ma ọ nwekwara ike ịpụta ịdị jụụ ma ọ bụ ịdị nwayọọ. Nhọrọ a anaghị eme ka iwu ahụ sie ike karịa ihe okwu Grik n’onwe ya kwuru.
- issue: Ma γυνή ka a sụgharịa ‘nwanyị’ ka ọ bụ ‘nwunye’
  choice: nwanyị
  alternative: nwunye
  rationale: Ọ dịghị ihe doro anya n’ahịrịokwu a nke na-egosi na ọ bụ naanị nwanyị lụrụ di ka a na-ekwu maka ya. ‘Nwanyị’ na-edobe ohere sara mbara nke okwu Grik, ebe nkọwa ala peeji na-egosi nhọrọ ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ka ... mụta ihe’ bụ usoro iwu ebumpụta ụwa n’Igbo; ‘nrubeisi zuru ezu’ na-edobe ike πάσῃ n’agbanyeghị na Grik akpọghị kpọmkwem onye a ga-erubere isi.
