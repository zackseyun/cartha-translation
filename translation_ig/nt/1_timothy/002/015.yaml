id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: ig
  text: 'Ma a ga-azọpụta nwanyị ahụ site n’ịmụ ụmụ[a], ma ọ bụrụ na ha[c] anọgide n’okwukwe[b] na ịhụnanya na ịdị nsọ, tinyere njide onwe ha.


    [a] A pụkwara ịsụgharị ya, “site n’ọmụmụ nwa ahụ.” Ụfọdụ na-aghọta nke a dị ka ọmụmụ otu nwa pụrụ iche, ikekwe ọmụmụ Mesaya; ma okwu Grik ahụ nwekwara ike ịpụta ịmụ ụmụ n’ozuzu ya.


    [b] N’ebe a, “okwukwe” nwekwara ike ịpụta “ikwesị ntụkwasị obi.”


    [c] N’asụsụ Grik, okwu ahụ si n’otu onye, “a ga-azọpụta nwanyị ahụ,” gaa n’ọtụtụ mmadụ, “ma ọ bụrụ na ha anọgide.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’ọmụmụ nwa ahụ.” Ụfọdụ na-aghọta nke a dị ka ọmụmụ otu nwa pụrụ iche, ikekwe ọmụmụ Mesaya; ma okwu Grik ahụ nwekwara ike ịpụta ịmụ ụmụ n’ozuzu ya.
    reason: alternative_reading
  - marker: b
    text: N’ebe a, “okwukwe” nwekwara ike ịpụta “ikwesị ntụkwasị obi.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, okwu ahụ si n’otu onye, “a ga-azọpụta nwanyị ahụ,” gaa n’ọtụtụ mmadụ, “ma ọ bụrụ na ha anọgide.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: a ga-azọpụta
  rationale: Ọ bụ ọdịnihu n’ụdị nnara nke σῴζω. N’akwụkwọ Pọl, ọ na-apụtakarị nzọpụta; nsụgharị ndị dịka ‘a ga-echebe’ nwere ike ime ka ihe ọ pụtara bụrụ naanị nchebe anụ ahụ, nke amaokwu ahụ ekwughị hoo haa.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe e kwuru tupu ya. ‘Ma’ bụ ụzọ doro anya ma bụrụkwa nke ebumpụta ụwa n’Igbo.
- source_word: διὰ τῆς τεκνογονίας
  choice: site n’ịmụ ụmụ
  rationale: τεκνογονία pụtara ịmụ nwa ma ọ bụ ịmụ ụmụ. ‘Ịmụ ụmụ’ na-egosi ihe a n’ozuzu ya n’Igbo, ebe e debere nghọta nke pụrụ izo aka n’otu ọmụmụ nwa pụrụ iche n’ala ala peeji.
- source_word: ἐὰν
  choice: ma ọ bụrụ na
  rationale: ἐάν na-ebute nkebiokwu nwere ọnọdụ; ‘ma ọ bụrụ na’ bụ nsụgharị Igbo kwụ ọtọ.
- source_word: μείνωσιν
  choice: ha anọgide
  rationale: μένω n’ebe a na-egosi ịnọgide ma ọ bụ ịga n’ihu n’ọnọdụ omume ndị a.
- source_word: ἐν πίστει
  choice: n’okwukwe
  rationale: πίστις na-apụtakarị okwukwe ma ọ bụ ntụkwasị obi. E debere ‘ikwesị ntụkwasị obi’ dị ka ụzọ ọzọ n’ala ala peeji n’ihi na ọ ga-ekwe omume n’ebe a.
- source_word: ἀγάπῃ
  choice: ịhụnanya
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme ihe maka ἀγάπη.
- source_word: ἁγιασμῷ
  choice: ịdị nsọ
  rationale: ἁγιασμός nwere ike ịpụta ido nsọ ma ọ bụ ịdị nsọ. ‘Ịdị nsọ’ dị mfe nghọta ma dabara n’usoro àgwà ọma ndị a.
- source_word: μετὰ σωφροσύνης
  choice: tinyere njide onwe ha
  rationale: σωφροσύνη na-egosi njide onwe onye, ezi uche, na ịdị akọ. ‘Njide onwe ha’ bụ okwu Igbo doro anya nke dabara n’ihe gbasara omume n’ebe a.
theological_decisions:
- issue: Mgbanwe site n’otu onye na ‘a ga-azọpụta nwanyị ahụ’ gaa n’ọtụtụ mmadụ na ‘ma ọ bụrụ na ha anọgide’
  choice: 'E debere mgbanwe ọnụọgụ dị n’asụsụ Grik: otu nwanyị na mbụ, ọtụtụ mmadụ emesịa.'
  alternative: A pụrụ ime ka ha kwekọọ site n’ịsụgharị ha abụọ dịka ụmụ nwanyị n’ozuzu; ma ọ bụ were otu nwanyị ahụ dịka Iv, were ‘ha’ dịka ụmụ nwanyị n’ozuzu.
  rationale: Ime ka otu onye na ọtụtụ mmadụ bụrụ otu ga-ezochi ihe dị mkpa dị n’ihe odide Grik. Nsụgharị ahụ hapụrụ esemokwu nkọwa ahụ ka ọ dị.
- issue: Ihe ‘a ga-azọpụta ... site n’ịmụ ụmụ’ pụtara
  choice: E debere ‘a ga-azọpụta ... site n’ịmụ ụmụ’ n’ebughị ụzọ kọwaa ụdị nzọpụta ahụ ma ọ bụ otu ịmụ ụmụ si metụta ya.
  alternative: A ga-echebe ya mgbe ọ na-amụ nwa; a ga-azọpụta ya site n’ịnabata ọrụ ịbụ nne; ma ọ bụ a ga-azọpụta ya site n’ọmụmụ Mesaya.
  rationale: Okwu Grik ahụ siri ike ma nwee ọtụtụ nkọwa ndị a na-arụrịta ụka banyere ha. Ọ naghị ekwu hoo haa na nke a bụ nchebe n’oge ọmụmụ nwa, ọrụ ịbụ nne, ma ọ bụ ọmụmụ Mesaya; ya mere, isi ederede ekwesịghị ikpebi otu nkọwa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu ebumpụta ụwa n’Igbo, ma e chekwara mgbagwoju anya dị n’okwu banyere nzọpụta, ịmụ ụmụ, na mgbanwe site n’otu onye gaa n’ọtụtụ mmadụ.
