  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: ig
  text: kama ka ha jiri ezi ọrụ chọọ onwe ha mma, dịka o kwesịrị ụmụ nwanyị ndị na-ekwupụta na ha na-asọpụrụ Chineke.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe dabara adaba” ma ọ bụ “ihe kwesịrị ekwesị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ndị na-ekwupụta na ha na-enwe ofufe nye Chineke.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “site n’ezi ọrụ”; n’ebe a, ezi ọrụ bụ ụzọ ha si achọ onwe ha mma n’ụzọ kwesịrị ekwesị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: kama
  rationale: Ọ na-egosi ntụnyere megide ịchọ mma nke mpụta a kpọrọ aha n’amaokwu nke 9; “kama” na-ejikọta echiche ahụ nke ọma.
- source_word: ὃ πρέπει
  choice: ihe kwesịrị
  rationale: Ọ na-echekwa echiche nke ihe dabara adaba ma ọ bụ ihe kwesịrị ekwesị n’omume.
- source_word: γυναιξὶν
  choice: ụmụ nwanyị
  rationale: N’ebe a, okwu ahụ na-ekwu maka ụmụ nwanyị n’ozuzu, ọ bụghị naanị ndị lụrụ di.
- source_word: ἐπαγγελλομέναις
  choice: ndị na-ekwupụta
  rationale: Ọ na-egosi nkwupụta mmadụ na-eme banyere onwe ya; ọ naghị eme ka okwu ahụ bụrụ nkwa siri ike.
- source_word: θεοσέβειαν
  choice: na ha na-asọpụrụ Chineke
  rationale: Nkọwa a na-egosipụta nsọpụrụ na nrara nye Chineke n’Igbo doro anya ma dị ugbu a.
- source_word: δι’ ἔργων ἀγαθῶν
  choice: ya bụ, ezi ọrụ
  rationale: N’usoro okwu a, ezi ọrụ bụ ụzọ kwesịrị ekwesị ụmụ nwanyị ahụ ga-esi chọọ onwe ha mma; “ya bụ” na-eme ka njikọ ahụ doo anya, ebe ndetu na-echekwa ọdịdị nkịtị nke διά.
theological_decisions:
- issue: Mmekọrịta dị n’etiti “ezi ọrụ” na nkwupụta nsọpụrụ Chineke
  choice: Ezi ọrụ bụ ihe ịchọ mma kwesịrị ekwesị na ngosipụta a na-ahụ anya nke ụmụ nwanyị na-ekwupụta na ha na-asọpụrụ Chineke.
  alternative: Ịghọta ezi ọrụ dịka ihe mmadụ ji erite nzọpụta ma ọ bụ nnabata Chineke.
  rationale: Ọnọdụ na usoro okwu ahụ na-atụnyere ihe ịchọ mma nke mpụta na omume kwesịrị ndị na-ekwupụta nsọpụrụ Chineke; amaokwu ahụ n’onwe ya ekwughị na ọrụ na-eweta nzọpụta.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E tinyere “chọọ onwe ha mma” site n’ọnọdụ amaokwu nke 9 iji mee ka ntụnyere ahụ bụrụ nke eke n’Igbo, ma ndetu [c] na-echekwa usoro na nghọta ọzọ nke okwu Grik.
