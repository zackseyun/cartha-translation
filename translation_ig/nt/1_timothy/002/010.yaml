revisions:
- from: kama ka ha jiri ihe kwesịrị ụmụ nwanyị ndị na-ekwupụta na ha na-asọpụrụ Chineke chọọ onwe ha mma, ya bụ, ezi ọrụ.[a][b][c]
  to: kama ka ha jiri ezi ọrụ chọọ onwe ha mma, dịka o kwesịrị ụmụ nwanyị ndị na-ekwupụta na ha na-asọpụrụ Chineke.[a][b][c]
  rationale: The revision removes the explicative “ya bụ” and renders δι’ ἔργων ἀγαθῶν as the means of the contextually implied adorning. It retains the natural Igbo expression “chọọ onwe ha mma,” which is warranted by the immediately preceding verse, without introducing any doctrinal claim about merit. Footnote b is adjusted to reflect devotion toward God more closely.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:21:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes the contrast with outward adornment in the preceding verse and accurately renders γυναῖξιν generically as “ụmụ nwanyị” and ἐπαγγελλομέναις as a profession/claim. However, “ya bụ” makes “ezi ọrụ” an explicit definition of “ihe kwesịrị,” whereas δι’ ἔργων ἀγαθῶν more directly expresses the means or manner of the implied adornment. A revision can preserve the contextual, implied verb while retaining this relation.
  naturalness: “Chọọ onwe ha mma” is natural Standard Igbo in the immediate context of v. 9. Placing “site n’ezi ọrụ” directly with that expression is clearer and more idiomatic than the former explanatory apposition.
  terminology: “Na-asọpụrụ Chineke” is a clear and acceptable rendering of θεοσέβειαν in Standard Igbo. The alternate footnote formerly given as “na ha rara onwe ha nye Chineke” is less precise, since it can suggest self-dedication rather than devotion/reverence toward God. The revised note gives a closer alternative.
  issues:
  - severity: medium
    issue: “Ya bụ, ezi ọrụ” weakens the force of διά.
    rationale: The Greek says literally “through/by means of good works,” with the verb of adornment understood from v. 9. “Ya bụ” recasts good works as a simple explanatory identification rather than retaining their instrumental relation.
  - severity: low
    issue: Footnote b’s lexical alternative is imprecise.
    rationale: “Na ha rara onwe ha nye Chineke” may convey dedicating oneself to God, while θεοσέβεια denotes devotion, reverence, or godliness directed toward God.
  revised_text: kama ka ha jiri ezi ọrụ chọọ onwe ha mma, dịka o kwesịrị ụmụ nwanyị ndị na-ekwupụta na ha na-asọpụrụ Chineke.[a][b][c]
