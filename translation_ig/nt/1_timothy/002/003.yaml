  yaml_path: translation/nt/1_timothy/002/003.yaml
  text: This is good and acceptable before God our Savior,
translation:
  language: ig
  text: Nke a dị mma, bụrụkwa ihe a na-anabata n’ihu Chineke, Onye Nzọpụta anyị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: Nke a
  rationale: Nnọchiaha nrụtụ aka a na-ezo aka n’iwu banyere ekpere dị n’amaokwu bu ụzọ, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: καλὸν
  choice: dị mma
  rationale: N’ọnọdụ a, okwu ahụ na-egosi ịdị mma ma ọ bụ ịdị kwesịrị ekwesị n’omume, ọ bụghị ịma mma n’ọdịdị.
- source_word: ἀπόδεκτον
  choice: ihe a na-anabata
  rationale: Nke a na-egosi ihe a nabatara nke ọma ma ọ bụ nke masịrị onye na-anabata ya; ọ naghị akọwa karịa isi okwu Grik.
- source_word: ἐνώπιον
  choice: n’ihu
  rationale: Ọ bụ ụzọ Igbo doro anya isi kwuo na ihe ahụ dị mma dịka Chineke si ele ya ma ọ bụ kpebie ya.
- source_word: σωτῆρος
  choice: Onye Nzọpụta
  rationale: Ọ na-echekwa aha-ọkwá ahụ nke na-egosi onye na-azọpụta, dịka e si eji ya eme ihe n’akwụkwọ ozi ndị a.
- source_word: ἡμῶν
  choice: anyị
  rationale: Ọ na-asụgharị nnọchiaha nke na-akọwa Onye Nzọpụta kpọmkwem.
- source_word: θεοῦ
  choice: Chineke
  rationale: 'A haziri ya dịka aha nke na-akọwa Onye Nzọpụta: Chineke bụ Onye Nzọpụta anyị.'
theological_decisions:
- issue: Mmekọrịta nkọwa dị na τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: Chineke, Onye Nzọpụta anyị
  alternative: Onye Nzọpụta anyị bụ́ Chineke
  rationale: Usoro a na-eme ka o doo anya n’Igbo na ‘Chineke’ na ‘Onye Nzọpụta anyị’ na-ezo aka n’otu onye ahụ, ma ọ naghị atụkwasị nkwupụta okwukwe ọzọ n’ihe ederede ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Akara rikoma na-enyere onye na-agụ ya aka ịhụ na ‘Onye Nzọpụta anyị’ na-akọwa ‘Chineke.’
