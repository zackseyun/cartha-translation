  text: For Adam was formed first[a], then Eve.
translation:
  language: ig
  text: N’ihi na e buru ụzọ kpụọ Adam[a], e mesịa kpụọ Iv.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “a kpụziri Adam.” Ngwaa a na-eme ka a cheta asụsụ e ji akọwa otú Chineke si kpụọ mmadụ n’akụkọ okike dị na Jenesis.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe mere e ji kwuo ntụziaka dị n’amaokwu bu ụzọ; ọ na-edobe ọrụ njikọ nkọwa nke okwu Grik ahụ.
- source_word: Ἀδὰμ
  choice: Adam
  rationale: Aha mmadụ; e dere ya n’ụdị a na-ejikarị ede ya n’Igbo.
- source_word: πρῶτος
  choice: e bu ụzọ
  rationale: 'Ọ na-egosi usoro oge: ọ bụ Adam ka e kpụrụ tupu Iv.'
- source_word: ἐπλάσθη
  choice: kpụọ
  rationale: Ngwaa a pụtara ịkpụzi ma ọ bụ ịkpụpụta ihe n’ụdị; ọ na-echekwa njikọ ya na asụsụ akụkọ okike dị na Jenesis karịa okwu sara mbara dị ka ‘kee.’
- source_word: εἶτα
  choice: e mesịa
  rationale: Ọ na-egosi ihe sochiri nke mbụ n’usoro oge n’asụsụ Igbo doro anya.
- source_word: Εὕα
  choice: Iv
  rationale: Aha mmadụ; e dere ya n’ụdị a na-ejikarị ede ya n’Igbo.
theological_decisions:
- issue: Mmekọrịta amaokwu a na usoro okike dị na Jenesis n’okwu ụka a na-arụrịta ụka banyere ya
  choice: 'Ịsụgharị ya dịka nkwupụta dị mfe banyere usoro oge: e bu ụzọ kpụọ Adam, e mesịa kpụọ Iv.'
  alternative: Ịtinye nkọwa banyere ikike ma ọ bụ ọrụ dị iche iche n’ime nsụgharị ahụ.
  rationale: Ihe odide Grik na-ekwu naanị usoro e si kpụọ ha; amaokwu a n’onwe ya akọwaghị ihe usoro ahụ pụtara n’ihe gbasara ikike ma ọ bụ ọrụ. Nsụgharị ahụ anaghị etinye nkwubi okwu okwukwe na-adịghị n’okwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. Nhazi ‘e bu ụzọ kpụọ … e mesịa kpụọ …’ na-eme ka usoro oge doo anya, ebe ‘kpụọ’ na-echekwa echiche nke ịkpụzi nke dị na πλάσσω.
