  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: ig
  text: A ghọgbughị Adam; ma nwanyị ahụ, ebe a ghọgburu ya[a], nọworo ná mmebi iwu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ebe a ghọgburu ya nke ukwuu’ ma ọ bụ ‘ebe a ghọgburu ya kpamkpam.’ Ngwaa Grik e ji ebe a nwere ike ịdị ike karịa ngwaa mbụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘ọ ghọrọ onye nọ ná mmebi iwu’ ma ọ bụ ‘ọ nọziela ná mmebi iwu.’ Ngwaa Grik ahụ dị n’ụdị perfect, nke nwere ike imesi ọnọdụ si n’ihe ahụ pụta ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: Adam
  rationale: E dere aha ahụ dịka a na-edekarị ya n’Igbo, kama ịsụgharị ya.
- source_word: ἠπατήθη
  choice: a ghọgbughị
  rationale: Ụdị ngwaa a na-egosi na e meghị Adam ka o kwere ihe na-abụghị eziokwu; nke a bụ ụzọ Igbo doro anya si kwuo passive aorist ahụ.
- source_word: γυνή
  choice: nwanyị ahụ
  rationale: N’ịtụnyere ya na Adam na n’ịtụ aka n’akụkọ Jenesis, ‘nwanyị ahụ’ doro anya karịa ‘nwunye ahụ,’ ma ọ naghị ekpebi ihe γυνή pụtara karịa ka ọnọdụ okwu chọrọ.
- source_word: ἐξαπατηθεῖσα
  choice: ebe a ghọgburu ya kpamkpam
  rationale: ‘Kpamkpam’ na-anwa igosipụta ike nke ngwaa ἐξαπατάω ma na-edebe participle ahụ dịka ihe mere tupu ọnọdụ e kwuru n’isi ahịrịokwu ahụ.
- source_word: ἐν παραβάσει
  choice: ná mmebi iwu
  rationale: Nke a na-edebe aha nkịtị παράβασις dịka ‘mmebi iwu,’ kama ịgbanwe ya ka ọ bụrụ aha e ji kpọọ nwanyị ahụ, dịka ‘onye mebiri iwu.’
- source_word: γέγονεν
  choice: abanyela
  rationale: Ụdị perfect nke γίνομαι na-egosi ma ihe mere ma ọnọdụ si na ya pụta; ‘abanyela’ na-egosipụta mgbanwe ahụ na ọnọdụ ka dị ugbu a n’ụzọ Igbo dị mma.
- source_word: δὲ
  choice: ma
  rationale: ‘Ma’ na-egosipụta ọdịiche dị n’etiti Adam na nwanyị ahụ.
- source_word: καὶ
  choice: A
  rationale: N’Igbo, njikọ nke amaokwu a na ihe bu ya ụzọ nwere ike ịdị n’enweghị ịmalite ya na ‘na’; nke a na-eme ka okwu ahụ bụrụ nke eke ma ghara ịgbakwunye ike njikọ na-adịghị na καί.
theological_decisions:
- issue: Otu e si kwuo njikọ nwanyị ahụ na mmebi iwu n’etinyeghị ozizi sara mbara banyere ụmụ nwanyị niile ma ọ bụ ụdị ịdị adị ha.
  choice: 'E debere ya dịka okwu gbasara ihe mere n’akụkọ Jenesis: ‘nwanyị ahụ, ebe a ghọgburu ya kpamkpam, abanyela ná mmebi iwu.’'
  alternative: ‘nwanyị ahụ ghọrọ onye mmebi iwu’ ma ọ bụ ‘nwanyị ahụ dara ná mmehie’
  rationale: Nhọrọ a na-edebe παράβασις dịka ‘mmebi iwu’ ma na-ezere ịgbanwe okwu ahụ ka ọ bụrụ aha njirimara nwanyị ahụ ma ọ bụ ịgbasa ihe amaokwu ahụ na-ekwu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji ‘ghọgburu’ mee ka echiche nke iduhie doo anya; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa nke otu ụka. Akara ụdaume na njikọta dịka ‘ná’ na-enyere ọgụgụ aka.
