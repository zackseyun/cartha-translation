review_pass:
  verdict: revise
  source_fidelity: The main contrast, passive verbs, and perfect-result sense are substantially represented. However, «kpamkpam» makes the force of ἐξαπατηθεῖσα categorically stronger than the Greek requires. The compound verb may be intensive, but that nuance is not obligatory in context and is better retained as a footnoted possibility. «Abanyela ná mmebi iwu» is understandable but suggests entering into transgression; «ọ nọworo ná mmebi iwu» more directly represents the Greek perfect’s resulting state without assigning the woman the label ‘transgressor.’
  naturalness: «A ghọgbughị Adam» and «ma nwanyị ahụ» are natural Standard Igbo. Removing «kpamkpam» from the text also makes the participial clause less heavy. «Ọ nọworo ná mmebi iwu» is idiomatic and preserves the state expressed by the perfect.
  terminology: Adam and nwanyị ahụ are appropriate. «Mmebi iwu» appropriately preserves παράβασις as an abstract act/state rather than changing it to ‘onye mmebi iwu.’
  issues:
  - severity: medium
    issue: The translation makes the deception unequivocally complete.
    rationale: «Kpamkpam» is a possible way to convey the compound ἐξαπατάω, but it is an interpretive intensification rather than a required meaning. The base rendering should preserve that lexical latitude; the alternative may be noted.
  - severity: low
    issue: The rendering of γέγονεν is somewhat directional.
    rationale: «Abanyela» can suggest ‘entered into’ transgression. The Greek ἐν παραβάσει γέγονεν more directly states that she has come to be/is in a state of transgression. «Ọ nọworo ná mmebi iwu» keeps the resulting-state force.
  - severity: low
    issue: Footnote b’s first alternative is not idiomatic Igbo.
    rationale: «Ọ bịara nọrọ ná mmebi iwu» is awkward. It should be recast as «ọ ghọrọ onye nọ ná mmebi iwu» only as a literal explanatory alternative, while the main text avoids adding the personal designation.
  revised_text: A ghọgbughị Adam; ma nwanyị ahụ, ebe a ghọgburu ya[a], nọworo ná mmebi iwu[b].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ebe a ghọgburu ya nke ukwuu’ ma ọ bụ ‘ebe a ghọgburu ya kpamkpam.’ Ngwaa Grik e ji ebe a nwere ike ịdị ike karịa ngwaa mbụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘ọ ghọrọ onye nọ ná mmebi iwu’ ma ọ bụ ‘ọ nọziela ná mmebi iwu.’ Ngwaa Grik ahụ dị n’ụdị perfect, nke nwere ike imesi ọnọdụ si n’ihe ahụ pụta ike.
    reason: lexical_alternative
