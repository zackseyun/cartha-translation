revisions:
- from: A ghọgbughị Adam; ma nwanyị ahụ, ebe a ghọgburu ya kpamkpam[a], abanyela ná mmebi iwu[b].
  to: A ghọgbughị Adam; ma nwanyị ahụ, ebe a ghọgburu ya[a], nọworo ná mmebi iwu[b].
  rationale: The revision retains the historical Genesis allusion and the contrast between Adam and the woman, but does not require an intensified sense for ἐξαπατηθεῖσα in the main text. It also renders the perfect γέγονεν as a continuing resultant state more directly, while retaining closely related alternatives in the footnote. No doctrinal expansion is introduced.
