source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: ig
  text: Ya mere, nke mbụ, ana m agba ume ka a na-arịọ arịrịọ, na-ekpe ekpere, na-ekpechitere ndị ọzọ ekpere, na-enye ekele maka mmadụ niile[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’aha mmadụ niile.”
    reason: lexical_alternative
  - marker: b
    text: “Mmadụ niile” si n’okwu Grik izugbe maka ụmụ mmadụ; ọ pụtaghị naanị ụmụ nwoke.
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ na-aghọta “mmadụ niile” ebe a dị ka “ụdị mmadụ niile”; ma okwu Grik ahụ n’onwe ya na-ekwu naanị “mmadụ niile.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ana m agba ume
  rationale: Nkebi a na-egosi agbamume siri ike sitere n’aka onyeozi; ọ karịrị arịrịọ nkịtị ma bụrụkwa okwu Igbo dị ugbu a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi na ihe a na-ekwu sitere n’ihe e kwuru tupu ya pụta.
- source_word: πρῶτον πάντων
  choice: nke mbụ
  rationale: Ọ na-ekwusi ike na nke a bụ ihe e kwesịrị ibute ụzọ, ọ bụghị na ọ ga-abụrịrị naanị ihe mbụ n’usoro e depụtara.
- source_word: ποιεῖσθαι
  choice: ka e kpee … ka a rịọchitere … nyekwa
  rationale: E ji usoro ahịrịokwu Igbo eke kewaa ngwaa ahụ n’ụzọ na-aga nke ọma n’Igbo ma ka na-achị ụdị ekpere anọ ahụ niile.
- source_word: δεήσεις
  choice: arịrịọ
  rationale: Ọ na-ezo aka n’arịrịọ siri ike nke mkpa kpaliri.
- source_word: προσευχάς
  choice: ekpere
  rationale: Nke a bụ okwu izugbe maka ikpegara Chineke ekpere.
- source_word: ἐντεύξεις
  choice: ka a rịọchitere ndị ọzọ arịrịọ
  rationale: N’ọnọdụ a, ọ na-egosi ịrịọ arịrịọ n’ihi ndị ọzọ; nkọwa a doro ndị na-agụ Igbo anya karịa otu aha pụrụ ịdị arọ.
- source_word: εὐχαριστίας
  choice: inye ekele
  rationale: Ọ na-edobe inye ekele dị ka ụdị omume ekpere pụrụ iche n’ime ndepụta ahụ.
- source_word: ὑπὲρ
  choice: maka
  rationale: N’ebe a ọ pụtara maka abamuru mmadụ ma ọ bụ n’aha ya; ‘maka’ bụ okwu Igbo kacha aga nke ọma, ebe e debere nghọta nke ‘n’aha’ na nkọwa ala peeji.
- source_word: πάντων ἀνθρώπων
  choice: mmadụ niile
  rationale: ἄνθρωπος ebe a bụ okwu izugbe maka ụmụ mmadụ, ọ bụghị naanị ụmụ nwoke; ‘mmadụ niile’ na-edobe oke okwu Grik ahụ n’enweghị ime ka ọ dị warara.
theological_decisions:
- issue: Oke πάντων ἀνθρώπων
  choice: mmadụ niile
  alternative: ụdị mmadụ niile
  rationale: Okwu Grik ahụ n’onwe ya na-ekwu ‘mmadụ niile.’ E nwere ndị na-aghọta ya dị ka ụdị ma ọ bụ òtù mmadụ niile, ma ntụgharị ahụ ekwesịghị ikpebi arụmụka ahụ site n’ime ka okwu ahụ dị warara.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. A zere okwu ụka nke otu nzukọ pụrụ iche, ma debe ọdịiche dị n’etiti arịrịọ, ekpere, ịrịọchitere ndị ọzọ arịrịọ, na inye ekele.
