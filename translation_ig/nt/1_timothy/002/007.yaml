revisions:
- from: Ọ bụ maka nke a ka e ji họpụta m ịbụ onye nkwusa na onyeozi[a]—ana m ekwu eziokwu; anaghị m agha ụgha—na ịbụ onye nkụzi nke ndị mba ọzọ[b] n’okwukwe na n’eziokwu.[c]
  to: Ọ bụ maka nke a ka a họpụtara m ka m bụrụ onye nkwusa na onyeozi[a]—ana m ekwu eziokwu; anaghị m agha ụgha—na onye nkụzi nke ndị mba ọzọ[b] n’okwukwe na n’eziokwu.[c]
  rationale: The revision makes the appointment passive explicit and idiomatic, keeps all three roles in parallel, and corrects the lexical alternatives in [a] and [b]. It preserves the source’s emphasis, ambiguity in ἐν πίστει, and formal register without adding doctrinal interpretation.
