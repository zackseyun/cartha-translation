id: 1TI.2.7
reference: 1 Timothy 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: ig
  text: Ọ bụ maka nke a ka a họpụtara m ka m bụrụ onye nkwusa na onyeozi[a]—ana m ekwu eziokwu; anaghị m agha ụgha—na onye nkụzi nke ndị mba ọzọ[b] n’okwukwe na n’eziokwu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nke a ka a họpụtara m maka ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye nkụzi nke mba dị iche iche.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ikwesị ntụkwasị obi na n’eziokwu.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: Ọ bụ maka nke a
  rationale: Nkebi okwu a na-ezo azụ n’ozi nzọpụta a kpọtụrụ aha tupu amaokwu a, ma na-egosi nzube e ji họpụta Pọl; Igbo a bụ nke e ji eme ihe ugbu a ma na-edobe ohere ịsụgharị ya ‘maka nke ahụ.’
- source_word: ἐτέθην
  choice: e ji họpụta m
  rationale: N’ebe a, ụdị ngwaa a na-egosi nhọpụta ma ọ bụ inye mmadụ ọrụ, ọ bụghị naanị idowe ya n’otu ebe.
- source_word: κῆρυξ
  choice: onye nkwusa
  rationale: Ọ na-egosi onye na-ekwupụta ozi n’ihu ọha n’aha onye ọzọ; ‘onye nkwusa’ bụ okwu Igbo doro anya ma dịkwa ebube maka ọrụ ahụ.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: N’ọnọdụ a, ọ bụ aha ọrụ Pọl ji akọwa onwe ya dị ka onye e zigara n’ọrụ pụrụ iche.
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: ana m ekwu eziokwu; anaghị m agha ụgha
  rationale: Nsụgharị a na-edobe nkwusi ike dị n’okwu abụọ ahụ n’Igbo nkịtị ma doo anya.
- source_word: διδάσκαλος ἐθνῶν
  choice: onye nkụzi nke ndị mba ọzọ
  rationale: N’ojiji Pọl, ἔθνη na-ezokarị aka ná ndị na-abụghị ndị Juu; ‘ndị mba ọzọ’ na-eme ka nke a doo onye Igbo na-agụ ya anya.
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: n’okwukwe na n’eziokwu
  rationale: A hapụrụ njikọ ἐν n’ụzọ na-adịghị ekpebi kpamkpam ma ọ na-ekwu banyere ọnọdụ, ụzọ, ma ọ bụ àgwà e ji ezi ihe; ‘okwukwe’ na-edobekwa nkọwa bụ isi nke πίστις.
theological_decisions:
- issue: Ihe ἐθνῶν pụtara n’ozi e nyere Pọl
  choice: ndị mba ọzọ
  alternative: mba niile
  rationale: Ojiji Pọl na ọnọdụ okwu a na-akwado na ọ na-ekwu banyere ndị na-abụghị ndị Juu, ma ihe okwu Grik ahụ pụtara n’ụzọ sara mbara bụ ‘mba niile,’ ya mere e debere ya na nkọwa ala peeji.
- issue: Nkọwa πίστις n’ahịrịokwu ἐν πίστει καὶ ἀληθείᾳ
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: ‘Okwukwe’ bụ nkọwa kacha adabara ebe a ma nwee ike ịkọwa ọnọdụ ma ọ bụ ụzọ ọrụ nkuzi ya; Otú ọ dị, πίστις nwekwara ike ịpụta ikwesị ntụkwasị obi, ya mere a hapụrụ nhọrọ ahụ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ebube. A họọrọ ‘onye nkwusa’ maka κῆρυξ ka echiche onye na-ekwupụta ozi n’ihu ọha doo anya, ebe ‘onyeozi’ na-edobe aha ọrụ ἀπόστολος. Akara nkọwa ala peeji niile [a], [b], na [c] dị n’ahụ amaokwu ahụ.
