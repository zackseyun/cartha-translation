id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: ig
  text: N’otu aka ahụkwa, ka ụmụ nwanyị jiri uwe kwesịrị ekwesị, na ihere na njide onwe onye, chọọ onwe ha mma; ọ bụghị n’ntutu isi a kpara akpa, ọlaedo, pel, ma ọ bụ uwe dị oke ọnụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O yikarịrị ka okwu ndị a—“ntutu isi a kpara akpa, ọlaedo, pel, ma ọ bụ uwe dị oke ọnụ”—na-ekwu maka ịchọ mma iji gosipụta akụnụba na ịdọta anya gabiga ókè, ọ bụghị iwu machibidoro ụdị ntutu a kpara akpa ma ọ bụ ihe ịchọ mma niile n’ọnọdụ niile.
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: N’otu aka ahụkwa
  rationale: Na-ejikọta ndụmọdụ a na nke bu ya ụzọ ma na-egosipụta ma echiche nke ‘otu aka ahụ’ ma mgbakwunye nke καί n’ụzọ Igbo na-ada nke ọma.
- source_word: γυναῖκας
  choice: ụmụ nwanyị
  rationale: N’ebe a, okwu ahụ na-ekwu maka ụmụ nwanyị n’ozuzu, ebe ọ dịghị ihe n’ahịrịokwu ahụ na-amachi ya naanị n’ebe ndị nwunye nọ.
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: jiri uwe kwesịrị ekwesị
  rationale: Na-egosipụta uwe ma na-eburu echiche nke ihe kwesịrị ekwesị, dị n’usoro, na nke a na-akwanyere ùgwù.
- source_word: μετὰ αἰδοῦς
  choice: jiri ịdị umeala n’obi
  rationale: Na-egosipụta àgwà nke izere ihe na-ekwesịghị ekwesị ma ghara ịchọ igosipụta onwe onye n’ụzọ na-adọta anya gabiga ókè.
- source_word: σωφροσύνης
  choice: njide onwe onye
  rationale: Na-eburu echiche nke ezi uche na ikike mmadụ nwere ijide onwe ya.
- source_word: κοσμεῖν ἑαυτάς
  choice: ka ... chọọ onwe ha mma
  rationale: Na-echekwa echiche nke ịchọ mma ma na-egosipụta ike ndụmọdụ dị na infinitive Grik ahụ.
- source_word: μὴ ἐν πλέγμασιν
  choice: ọ bụghị site n’ịkpa ntutu isi
  rationale: πλέγματα na-ezo aka n’usoro ntutu a kpara akpa, karịchaa dị ka ụdị ịchọ mma.
- source_word: χρυσίῳ
  choice: ọlaedo
  rationale: Na-ahapụ okwu ahụ ka ọ saa mbara dịka Grik si dị, n’enweghị ịkọwapụta ụdị ihe ịchọ mma e ji ọlaedo mee.
- source_word: μαργαρίταις
  choice: nkume pel
  rationale: Ọ bụ okwu Igbo doro anya maka pearls ma kwekọọ na ndepụta ihe ịchọ mma dị oke ọnụ.
- source_word: ἱματισμῷ πολυτελεῖ
  choice: uwe dị oke ọnụ
  rationale: Na-egosipụta ma uwe ma ọnụ ahịa ya, nke dabara na ọdịiche dị n’etiti ejiji kwesịrị ekwesị na ngosipụta akụnụba gabiga ókè.
theological_decisions:
- issue: Ma okwu a ọ na-ekwu maka ụmụ nwanyị niile ka ọ bụ naanị ndị nwunye
  choice: ụmụ nwanyị n’ozuzu
  alternative: ndị nwunye
  rationale: Ụdị ọtụtụ nke γυναῖκας na ọnọdụ ndụmọdụ izugbe adịghị enye akara alụmdi na nwunye nke ga-amachi okwu ahụ n’ebe ndị nwunye nọ.
- issue: Ma ndepụta ahụ ọ bụ mmachibido ihe ndị a iwu kpamkpam ka ọ bụ nkatọ ịchọ mma nke ngosipụta
  choice: E debere ndepụta ahụ kpọmkwem n’ahụ ederede, ebe ndetu na-akọwa na o yikarịrị ka ihe a na-elekwasị anya bụ ịchọ mma iji gosipụta akụnụba gabiga ókè.
  alternative: Mmachibido ịkpa ntutu, iyi ọlaedo ma ọ bụ pel, na iyi uwe dị oke ọnụ iwu n’ọnọdụ niile
  rationale: Ahịrịokwu ahụ na-eme ọdịiche n’etiti ịchọ onwe onye mma n’ụzọ kwesịrị ekwesị, nke ịdị umeala n’obi na njide onwe onye na-achị, na ụdị ịchọ mma nke okomoko. A naghị etinye nkọwa ahụ n’ime isi ederede ka ambiguity na ike ndepụta Grik wee dịgide.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ‘jiri ... chọọ onwe ha mma’ ka njikọ dị n’etiti uwe kwesịrị ekwesị na ụdị ịchọ mma ndị e depụtara doo anya. Akara ndetu [a] dị n’isi ederede ma kwekọọ na ndetu ya.
