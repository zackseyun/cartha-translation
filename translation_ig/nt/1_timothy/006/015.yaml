revisions:
- from: nke ọ ga-egosi n’oge nke ya[a]—Onye ahụ a gọziri agọzi, onye naanị ya bụ Onye Ọchịchị, Eze nke ndị na-achị dịka eze, na Onyenwe nke ndị na-achị achị[b],
