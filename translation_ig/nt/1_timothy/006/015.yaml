  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: ig
  text: nke ọ ga-egosi n’oge ndị nke ya[a]—Onye a gọziri agọzi, Onye Ọchịchị naanị ya, Eze nke ndị na-achị dịka eze, na Onyenwe nke ndị na-eji ikike achị[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “n’oge ndị nke ya.” Okwu a na-atụ aka n’oge dị iche iche e kenyere ya.
    reason: lexical_alternative
  - marker: b
    text: 'Ụdị ntụgharị a maara nke ọma bụ: “Eze ndị eze na Onyenwe ndị onyenwe.” Ma Grik ji okwu ngwaa mee ya; n’ụzọ nkịtị, “Eze nke ndị na-achị dịka eze, na Onyenwe nke ndị na-eji ikike achị.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: nke
  rationale: Nnochiaha njikọ a na-ezo aka n’ọbịbịa pụtara ìhè e kwuru na amaokwu 14; “nke” na-edobe ntụaka ahụ n’etinyeghị onye dị ka ihe ọ na-ezo aka na ya.
- source_word: καιροῖς ἰδίοις
  choice: n’oge nke ya
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa banyere oge ma ọ bụ mgbe dịịrị ya; nkọwa ala peeji na-eme ka o doo anya na Grik dị n'ụbara ma na-atụ aka n’oge ndị o kenyere.
- source_word: δείξει
  choice: ọ ga-egosi
  rationale: “Igosipụta” ma ọ bụ “igosi” na-ebute echiche nke ime ka ihe pụta ìhè. “Ọ ga-egosi” bụ okwu doro anya ma dị mfe nghọta n’Igbo.
- source_word: ὁ μακάριος
  choice: Onye ahụ a gọziri agọzi
  rationale: E ji nkọwa a mee aha nsọpụrụ nke Chineke; ọ na-edobe ịdị arọ nke μακάριος karịa okwu nkịtị dịka “onye obi ụtọ.”
- source_word: μόνος δυνάστης
  choice: onye naanị ya bụ Onye Ọchịchị
  rationale: Nke a na-egosi onye nwere ikike ọchịchị pụrụ iche, n’etinyeghị okwu ochie ma ọ bụ nke otu ụka pụrụ iche.
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: Eze nke ndị na-achị dịka eze
  rationale: Nke a na-edobe ụdị ngwaa nke βασιλευόντων—ndị na-arụ ọrụ ịchị dịka eze—kama ịgbanwe ya ozugbo ka ọ bụrụ naanị aha “ndị eze.”
- source_word: κύριος τῶν κυριευόντων
  choice: Onyenwe nke ndị na-achị achị
  rationale: “Onyenwe” na-arụ ọrụ dịka aha nsọpụrụ, ebe “ndị na-achị achị” na-edobe ụdị ngwaa na echiche nke ndị na-eji ikike achị.
theological_decisions:
- issue: Onye bụ isiokwu nke “ọ ga-egosi”
  choice: E debere naanị nnochiaha “ọ,” dịka usoro Grik si mee, ka aha nsọpụrụ ndị na-esochi ya kọwaa onye ahụ n’ime okwu gbara amaokwu ahụ gburugburu.
  alternative: Ịkpọ ya kpọmkwem “Chineke Nna,” onye ga-egosi ọbịbịa Jizọs Kraịst.
  rationale: Grik akpọghị aha onye ahụ kpọmkwem n’ebe a. Ịhapụ ya dịka nnochiaha na-echekwa otú amaokwu ahụ si kwuo ya ma zere idozi esemokwu nkọwa okpukpe n’ime ntụgharị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ dịka akụkụ nke na-aga n’ihu site n’amaokwu 14. Akara ala peeji [a] dị ozugbo n’akụkụ okwu gbasara oge, ebe [b] na-akọwa ọdịiche dị n’etiti ụdị okwu Grik na ụdị omenala a na-ejikarị.
