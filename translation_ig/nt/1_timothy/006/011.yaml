id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: ig
  text: Ma gị onwe gị, nwoke Chineke, gbapụ n’ihe ndị a; ma gbasoo ezi omume[a], ịsọpụrụ Chineke, okwukwe[b], ịhụnanya, ntachi obi, na ịdị nwayọọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikwesị ntụkwasị obi” ma ọ bụ “ntụkwasị obi.”
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik a dị ụkọ; a pụkwara ịsụgharị ya “ịdị umeala n’obi,” “inwe ndidi n’ebe ndị ọzọ nọ,” ma ọ bụ “ịdị umeala n’obi nke nwere ndidi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: Ma gị onwe gị
  rationale: Ọ na-egosi ọdịiche siri ike n’etiti Timoti na ndị a kọwara n’amaokwu ndị bu ụzọ, ma na-edobekwa nkwusi ike dị na Σὺ.
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: nwoke Chineke
  rationale: Ọ bụ okwu a na-akpọ Timoti kpọmkwem; ọ na-echekwa ụdị nwoke otu onye dị n’asụsụ Grik na aha a maara n’Akwụkwọ Nsọ.
- source_word: ταῦτα φεῦγε
  choice: gbapụ ihe ndị a
  rationale: “Gbapụ” na-echekwa ike nke iwu ahụ karịa okwu dị nro dịka “zere,” ebe “ihe ndị a” na-ezo aka n’ihe ọjọọ ndị e kwuru tupu ya.
- source_word: δίωκε
  choice: gbasoo
  rationale: Ọ na-egosi ịchụso àgwà ọma ndị a n’ọrụ, ma na-emegide “gbapụ” n’ahịrịokwu mbụ.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: N’usoro àgwà ọma a, “ezi omume” bụ okwu Igbo doro anya maka ibi ndụ n’ụzọ ziri ezi; e debere “ikpe ziri ezi” dị ka ụzọ ọzọ n’okpuru amaokwu.
- source_word: εὐσέβειαν
  choice: ịsọpụrụ Chineke
  rationale: Ọ na-egosi ndụ nsọpụrụ na nrubeisi nke gbadoro ụkwụ n’ebe Chineke nọ, n’asụsụ Igbo nke ndị mmadụ na-aghọta ngwa ngwa.
- source_word: πίστιν
  choice: okwukwe
  rationale: Ọ bụ ntụgharị bụ isi nke πίστις; n’usoro àgwà ọma a, “ikwesị ntụkwasị obi” ka nwekwara ike ịbụ ihe okwu ahụ pụtara, ya mere e tinyere ya n’okpuru amaokwu.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo doro anya na nke a na-ejikarị atụgharị ἀγάπη.
- source_word: ὑπομονήν
  choice: ntachi obi
  rationale: Ọ na-egosi ịnọgide na-eguzosi ike n’agbanyeghị nsogbu ma ọ bụ nrụgide.
- source_word: πραϋπαθίαν
  choice: ịdị nwayọọ
  rationale: Okwu Grik a dị ụkọ ma jikọta ịdị nro na njide onwe onye n’oge ihe siri ike; “ịdị nwayọọ” bụ ntụgharị Igbo kachasị mfe nghọta, ebe nkọwa ndị ọzọ dị n’okpuru amaokwu.
theological_decisions:
- issue: Ụdị nwoke dị n’okwu ὦ ἄνθρωπε θεοῦ
  choice: nwoke Chineke
  alternative: onye Chineke
  rationale: A na-agwa Timoti, nwoke otu onye, okwu kpọmkwem. Ya mere, e chekwara ụdị nwoke nke isi mmalite kama ime ka ọ ghọọ okwu na-enweghị njirimara nwoke ma ọ bụ nwanyị.
- issue: Mpaghara ihe δικαιοσύνη nwere ike ịpụta
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’usoro àgwà ọma a, ezi omume dabara nke ọma, ma “ikpe ziri ezi” bụkwa akụkụ ziri ezi nke ihe okwu Grik ahụ nwere ike ịpụta, ya mere e chekwara ya n’okpuru amaokwu.
- issue: Ihe πίστις pụtara n’usoro àgwà ọma
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi
  rationale: “Okwukwe” bụ ntụgharị bụ isi, ma ebe ọ bụ na okwu ahụ nọ n’usoro àgwà ọma, ọ pụkwara ịpụta ikwesị ntụkwasị obi. E meghị ka otu nghọta kpochapụ nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ọdịiche dị n’etiti “gbapụ” na “gbasoo,” tinyekwa akara nkọwa [a], [b], na [c] ozugbo n’akụkụ okwu ha na-akọwa.
