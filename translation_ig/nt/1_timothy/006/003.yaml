id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla na-ezi ozizi dị iche, ma ọ dịghị ekwenye n’okwu ndị dị mma[a]—okwu nke Onyenwe anyị Jizọs bụ́ Mezaya[b]—nakwa ozizi kwekọrọ n’ịsọpụrụ Chineke[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e ji okwu “nwere ahụ ike” kọwaa okwu ndị a; ọ na-ekwu n’ụzọ ihe atụ maka okwu ma ọ bụ ozizi dị mma.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ide ya, “Jizọs Kraịst.” Χριστός bụ aha-ọkwa pụtara “Mezaya” ma ọ bụ “Onye E Tere Mmanụ.”
    reason: alternative_reading
  - marker: c
    text: N’asụsụ Grik, okwu ahụ pụtara “dị ka” ma ọ bụ “kwekọrọ n’ịsọpụrụ Chineke”; ọ naghị ekwu kpọmkwem na ozizi ahụ “na-eduga n’” ya.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: na-ezi ozizi dị iche
  rationale: Nke a na-egosi izi ihe dị iche n’ozizi a nabatara, n’etinyeghị okwu siri ike dịka “ozizi ụgha,” nke adịghị kpọmkwem n’okwu Grik ahụ.
- source_word: προσέρχεται
  choice: na-anabata
  rationale: Ọ bụ ezie na ngwaa ahụ pụtara n’ụzọ nkịtị ‘ịbịaru nso,’ n’ebe a ọ na-egosi ịnabata, ịrapara n’ahụ, ma ọ bụ ikwenye n’ozizi.
- source_word: ὑγιαίνουσι λόγοις
  choice: okwu ndị ziri ezi
  rationale: Nhọrọ a bụ Igbo dị mfe ma doo anya maka okwu ndị ozizi ha dị mma na enweghị ntụpọ; ihe atụ nke ‘ahụ ike’ dị n’asụsụ Grik ka e debere na nkọwa ala peeji.
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: okwu nke Onyenwe anyị Jizọs bụ́ Mezaya
  rationale: Nkebi a na-akọwa na okwu ndị ahụ sitere n’aka Onyenwe anyị Jizọs ma ọ bụ bụrụ nke ya. A sụgharịrị Χριστός dịka aha-ọkwa ‘Mezaya.’
- source_word: κατ’ εὐσέβειαν
  choice: kwekọrọ n’ịsọpụrụ Chineke
  rationale: Nke a na-echekwa echiche nke ozizi kwekọrọ n’ụzọ ndụ na-asọpụrụ Chineke, n’ekwughị hoo haa na ọ bụ naanị ihe ozizi ahụ na-akpata.
- source_word: διδασκαλίᾳ
  choice: ozizi
  rationale: ‘Ozizi’ na-egosi ihe a na-akụzi ma dabara n’ọnọdụ a nke na-atụnyere ụdị nkuzi abụọ.
- source_word: εὐσέβειαν
  choice: ịsọpụrụ Chineke
  rationale: Nke a bụ okwu Igbo doro anya maka ndụ na omume sitere n’egwu na nsọpụrụ a na-enye Chineke.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n’aha-ọkwa Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mezaya
  alternative: Jizọs Kraịst
  rationale: Χριστός bụ aha-ọkwa pụtara ‘Onye E Tere Mmanụ,’ ya bụ Mezaya. Isi okwu debere ihe aha-ọkwa ahụ pụtara; nkọwa ala peeji debere ụdị a maara nke ọma, ‘Kraịst.’
- issue: Mmekọrịta ozizi na εὐσέβεια n’okwu κατ’ εὐσέβειαν
  choice: ozizi kwekọrọ n’ịsọpụrụ Chineke
  alternative: ozizi na-eduga n’ịsọpụrụ Chineke
  rationale: κατά na-egosi nkwekọrịta n’ụzọ doro anya; ịsị ‘na-eduga’ ga-eme ka echiche nke ihe na-akpata ihe pụta ìhè karịa ka Grik kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ ka bụ nkebi ọnọdụ na-aga n’ihu dịka ọ dị n’amaokwu Grik; emechiri ya na rikoma iji gosi njikọ ya na amaokwu na-esote. E ji ‘bụ́’ mee ka ‘Mezaya’ doo anya dịka aha-ọkwa.
