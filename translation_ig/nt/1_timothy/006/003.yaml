review_pass:
  verdict: revise
  source_fidelity: A chọrọ obere mmezi abụọ maka ntụkwasị obi n’asụsụ Grik. ὑγιαίνουσι λόγοις bụ, n’ụzọ ihe atụ, “okwu dị mma n’ahụ ike/okwu na-adịghị ebi ọrịa,” ya bụ okwu ozizi dị mma; “okwu ndị ziri ezi” na-agbanwe ya ka ọ bụrụ naanị “correct words.” Ọzọkwa, προσέρχεται n’ọnọdụ a na-egosi ikwenye n’azụ ma ọ bụ ịrapara n’okwu ndị ahụ karịa naanị ịnabata ha.
  naturalness: “Ọ dịghị ekwenye n’...” na “okwu ndị dị mma” bụ Igbo Izugbe dị mfe ma kwekọọ nke ọma n’ọdịdị ahịrịokwu a. A na-edobe rikoma ikpeazụ n’ihi na amaokwu Grik bụ nkebi ọnọdụ nke na-aga n’ihu n’amaokwu na-esote.
  terminology: “Jizọs bụ́ Mezaya” na-edobe χριστός dịka aha-ọkwa, ebe “ịsọpụrụ Chineke” na-ezisa εὐσέβεια n’ụzọ doro anya. Nkọwa ala peeji c ekwesịghị igosi “na-eduga n’” dị ka ihe ọzọ kwekọrọ n’usoro okwu Grik, n’ihi na κατά ebe a na-ekwu maka nkwekọrịta, ọ bụghị kpọmkwem ihe ozizi na-akpata.
  issues:
  - severity: medium
    issue: “okwu ndị ziri ezi” maka ὑγιαίνουσι λόγοις
    rationale: “Ziri ezi” pụtara ihe ziri ezi ma ọ bụ correct; ọ naghị eburu ihe atụ “sound/healthy” nke ὑγιαίνουσι. “Okwu ndị dị mma” na-edobe echiche nke okwu ozizi nwere ahụike ma na-adịkwa n’ụzọ Igbo.
  - severity: medium
    issue: “na-adịghị anabata” maka μὴ προσέρχεται
    rationale: “Ịnabata” nwere ike ịpụta ịnakwere ma ọ bụ ịkpọbata. N’ebe a, ngwaa Grik na dative na-ekwu maka ikwenye n’azụ, ịrapara n’ahụ, ma ọ bụ imekọrịta onwe ya na okwu ahụ; “ọ dịghị ekwenye n’” dabara nke ọma.
  - severity: low
    issue: Nkọwa ala peeji c na-ekwu “ozizi na-eduga n’ịsọpụrụ Chineke”
    rationale: Nke a na-atụgharị κατά εὐσέβειαν ka ọ bụrụ mmekọrịta kpatara ihe. Ihe Grik kwuru bụ ozizi kwekọrọ n’ịsọpụrụ Chineke; a pụrụ ịkọwa nke ahụ n’ala peeji n’enweghị ịgbakwunye echiche kpatara ihe.
