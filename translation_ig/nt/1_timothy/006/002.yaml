revisions:
- from: Ndị nwere ndị nna ha ukwu bụ ndị kwere ekwe ekwesịghị ileda ha anya n’ihi na ha bụ ụmụnna[a]. Kama, ha ga-ejere ha ozi nke ukwuu karị, n’ihi na ndị na-erite uru ahụ bụ ndị kwere ekwe, bụrụkwa ndị a hụrụ n’anya[b]. Na-akụzi ihe ndị a, na-agbakwa ndị mmadụ ume ka ha mee ha.
  to: Ndị nwere nna ukwu kwere ekwe ekwesịghị ileda ha anya n’ihi na ha bụ ụmụnna[a]. Kama, ka ha jere ha ozi karị, n’ihi na ndị na-erite uru ahụ bụ ndị kwere ekwe, bụrụkwa ndị a hụrụ n’anya[b]. Kụzie ihe ndị a, gbakwaakwa ume.
  rationale: E degharịrị aha ndị nna ukwu ka ọ soro ọkpụkpọ okwu Grik kpọmkwem ma doo anya n’Igbo. E ji usoro iwu “ka ha jere ... karị” dochie usoro ọdịnihu na nkebi na-adịghị ire. E wepụrụ nkọwa gbakwunyere n’iwu ikpeazụ iji ghara ịkọwapụta παρακάλει karịa ka isi mmalite si kwuo. E debere okwu banyere ndị na-erite uru ahụ ka ọ ghara imechi arụmụka sintaksis dị na Grik, ma ala ala peeji na-enye ọgụgụ kacha yie eziokwu.
