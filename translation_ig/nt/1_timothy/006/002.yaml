id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: ig
  text: Ndị nwere nna ukwu kwere ekwe ekwesịghị ileda ha anya n’ihi na ha bụ ụmụnna[a]. Kama, ka ha jere ha ozi karị, n’ihi na ndị na-erite uru ahụ bụ ndị kwere ekwe, bụrụkwa ndị a hụrụ n’anya[b]. Kụzie ihe ndị a, gbakwaakwa ume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke.” Okwu Grik ahụ dị n’ụdị nwoke ọtụtụ; n’ebe a, ọ na-ezo aka n’ụlọezinụlọ okwukwe nke ndị kwere ekwe ibe ha.
    reason: lexical_alternative
  - marker: b
    text: Nkebi okwu a, “ndị na-erite uru ahụ,” siri ike ịkọwa. O yikarịrị ka ọ na-ezo aka ná ndị nna ukwu kwere ekwe, bụ́ ndị na-erite uru n’ozi ndị ohu ha.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: ndị kwere ekwe
  rationale: N’ebe a, okwu ahụ na-akọwa ndị nna ukwu kweere na Kraịst, ọ bụghị naanị ndị a pụrụ ịtụkwasị obi.
- source_word: δεσπότας
  choice: ndị nna ha ukwu
  rationale: Nke a na-egosi ndị nwere ikike n’ebe ndị na-ejere ha ozi dị n’ọnọdụ ohu nọ; ọ bụkwa okwu Igbo doro anya ma dị ùgwù.
- source_word: καταφρονείτωσαν
  choice: ekwesịghị ileda ha anya
  rationale: Nkebi a na-egosi ile mmadụ anya nlelị ma ọ bụ ejighị ya kpọrọ ihe, ma na-edobe ike nke iwu a machibidoro iwu.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” na-enye echiche nke ndị otu ezinụlọ okwukwe. Ihe odide Grik jiri ụdị nwoke ọtụtụ, ma okwu ahụ nwekwara ike izo aka n’ebe ndị kwere ekwe ibe ha nọ n’ozuzu.
- source_word: μᾶλλον δουλευέτωσαν
  choice: ha ga-ejere ha ozi nke ukwuu karị
  rationale: “Ijere ozi” na-egosipụta ọrụ onye nọ n’ọnọdụ ohu na-arụ, ebe “nke ukwuu karị” na-echekwa μᾶλλον.
- source_word: πιστοί
  choice: ndị kwere ekwe
  rationale: Dị ka n’oge mbụ okwu ahụ pụtara n’amaokwu a, ọ na-ezo aka ná ndị kweere na Kraịst.
- source_word: ἀγαπητοὶ
  choice: ndị a hụrụ n’anya
  rationale: Nke a na-echekwa echiche ịhụnanya pụrụ iche dị n’etiti ndị kwere ekwe n’enweghị itinye nkọwa ọzọ.
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: ndị na-erite uru ahụ
  rationale: Okwu Grik a siri ike ịkọwa kpọmkwem. Nsụgharị a bụ Igbo ebumpụta ụwa ma hapụkwa uru ahụ n’ụzọ na-adịghị akọwapụta ya gabiga ihe isi mmalite kwuru.
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: Na-akụzi ihe ndị a, na-agbakwa ndị mmadụ ume ka ha mee ha
  rationale: Okwu abụọ ahụ bụ iwu a na-enye Timoti ka ọ nọgide na-akụzi ma na-agba ndị na-ege ya ntị ume ime ihe ndị ahụ.
theological_decisions:
- issue: Ihe ἀδελφοί pụtara n’etiti ndị kwere ekwe
  choice: ụmụnna
  alternative: ụmụnna nwoke; ụmụnna nwoke na ụmụnna nwanyị
  rationale: “Ụmụnna” bụ okwu Igbo sitere n’echiche ezinụlọ ma nwee ike ịgụnye ndị otu okwukwe, ebe ihe e dere n’ala ala peeji na-eme ka ụdị okwu Grik doo anya.
- issue: Okwu ọnọdụ mmadụ n’usoro ịgba ohu
  choice: ndị nna ha ukwu ... ejere ha ozi
  alternative: ndị nwe ha ... jeere ha ozi dị ka ndị ohu
  rationale: Amaokwu ahụ na-ekwu banyere ọnọdụ ịgba ohu, ma aha δοῦλος adịghị na ya. Ya mere, nsụgharị a na-echekwa eziokwu mmekọrịta ahụ n’enweghị ịtinye aha na-adịghị n’amaokwu ahụ.
- issue: Ndị οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι na-ezo aka na ha
  choice: ndị nna ukwu kwere ekwe bụ ndị na-erite uru ahụ
  alternative: ndị ohu kwere ekwe bụ ndị na-arara onwe ha nye ezi ọrụ; ma ọ bụ akụkụ abụọ ahụ na-eketa uru ahụ
  rationale: N’usoro okwu na n’ọnọdụ amaokwu ahụ, o yikarịrị ka ọ bụ ndị nna ukwu na-erite uru n’ozi ahụ. Ma ebe okwu Grik dị mkpụmkpụ ma sie ike, e debere okwu nsụgharị ahụ n’ụzọ na-adịghị emechi ụzọ nghọta ndị ọzọ kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị nna ha ukwu” iji mee ka mmekọrịta ikike doo anya, ma e zere okwu ga-eme ka ịgba ohu yie ihe a na-akwado. A hapụrụ mgbagwoju anya dị na nkebi banyere ndị na-erite uru ahụ, ma kọwaa ọgụgụ kacha yie eziokwu n’ala ala peeji.
