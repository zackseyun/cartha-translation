id: 1TI.6.10
reference: 1 Timothy 6:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: ig
  text: N’ihi na ịhụ ego n’anya bụ otu mgbọrọgwụ nke ihe ọjọọ dị iche iche[a]; ụfọdụ ndị, ka ha na-achọsi ya ike, esila n’okwukwe ahụ kpafuo[b], ma dupuo onwe ha n’ọtụtụ ihe mgbu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ntụgharị ọdịnala si dị, “N’ihi na ịhụ ego n’anya bụ mgbọrọgwụ nke ihe ọjọọ niile.” Okwu Grik ahụ kwekọrọ nke ọma karịa na “otu mgbọrọgwụ nke ihe ọjọọ dị iche iche,” nke na-ezere echiche na ihe ọjọọ ọ bụla nwere naanị otu ihe kpatara ya.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “esila n’okwukwe kpafuo.” N’ebe a, “okwukwe ahụ” yikarịrị ka ọ na-ezo aka n’okwukwe Ndị Kraịst dị ka nkwenkwe a na-ejide ma na-ekwupụta.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “dupuo onwe ha n’ọtụtụ mwute” ma ọ bụ “n’ọtụtụ nhụjuanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: otu mgbọrọgwụ
  rationale: Okwu ῥίζα enweghị njupụtaokwu n’ebe a ma bụrụ aha e ji kọwaa isiokwu tupu ngwaa; ‘otu mgbọrọgwụ’ na-egosi na ịhụ ego n’anya bụ otu n’ime isi mmalite, ọ bụghị naanị otu isi mmalite nke ihe ọjọọ niile.
- source_word: πάντων τῶν κακῶν
  choice: nke ụdị ihe ọjọọ niile
  rationale: Ntụgharị a na-egosipụta obosara nke ọtụtụ κακῶν n’ụzọ Igbo doro anya, na-enweghị ime ka okwu ahụ kwuo na ihe ọjọọ ọ bụla nwere naanị otu ihe kpatara ya.
- source_word: φιλαργυρία
  choice: ịhụ ego n’anya
  rationale: Nke a na-echekwa ihe oyiyi nke okwu Grik ahụ—ịhụ ego ma ọ bụ ọlaọcha n’anya—ma doo ndị na-agụ ya anya karịa okwu sara mbara dịka anyaukwu.
- source_word: ὀρεγόμενοι
  choice: ka ha na-achọsi ya ike
  rationale: Nkebi a na-egosi ọchịchọ siri ike ma na-aga n’ihu, ma jikọta ya n’ụzọ ebumpụta ụwa na mkpafụ ha.
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: esila n’okwukwe kpafuo
  rationale: ‘Kpafuo’ na-echekwa echiche nke isi n’ebe mmadụ nọ pụọ ma kpafuo, ebe ‘esila’ na-egosi nsonaazụ nke ka dị ugbu a.
- source_word: πίστεως
  choice: okwukwe
  rationale: N’ọnọdụ akwụkwọ ozi ndị a, okwu nwere njupụtaokwu ahụ yikarịrị ka ọ na-ezo aka n’okwukwe Ndị Kraịst dị ka nkwenkwe a na-ekwupụta, ọ bụ ezie na okwu Igbo ‘okwukwe’ ka na-echekwa ntakịrị ohere nke ntụkwasị obi onwe onye.
- source_word: περιέπειραν
  choice: mapuo onwe ha
  rationale: Ngwaa a pụtara ịmapu ma ọ bụ ịdụru ihe; ntụgharị a na-echekwa ihe oyiyi siri ike nke ederede ahụ.
- source_word: ὀδύναις πολλαῖς
  choice: ọtụtụ ihe mgbu
  rationale: ‘Ihe mgbu’ nwere ike ịgụnye ahụhụ, mwute, na nhụjuanya ime mmụọ, ya mere ọ naghị ebelata obosara okwu Grik ahụ.
theological_decisions:
- issue: Ókè okwu Pọl banyere ego na ihe ọjọọ ruru
  choice: Ịhụ ego n’anya bụ otu mgbọrọgwụ nke ụdị ihe ọjọọ niile.
  alternative: Ịhụ ego n’anya bụ mgbọrọgwụ nke ihe ọjọọ niile.
  rationale: Enweghị njupụtaokwu n’ihu ῥίζα, ma κακῶν dị n’ụdị ọtụtụ. Ntụgharị ahọpụtara anaghị eme ka Pọl kwuo na ịhụ ego n’anya bụ naanị ihe na-akpata ihe ọjọọ ọ bụla.
- issue: Ihe τῆς πίστεως pụtara
  choice: Okwukwe Ndị Kraịst dị ka nkwenkwe a na-ejide ma na-ekwupụta.
  alternative: Okwukwe dịka ntụkwasị obi onwe onye n’ebe Chineke nọ.
  rationale: Njupụtaokwu Grik na ojiji a na-ahụkarị n’Akwụkwọ Ozi Pastọral na-akwado echiche nke okwukwe Ndị Kraịst, ma ederede Igbo anaghị emechi kpamkpam ihe metụtara ntụkwasị obi onwe onye.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ ‘ịhụ ego n’anya’ kama ‘anyaukwu’ iji chekwaa kpọmkwem ihe φιλαργυρία pụtara; e chekwara ihe oyiyi siri ike nke ịmapu onwe onye. Akara nkọwa ụkwụ [a], [b], na [c] niile dị n’ederede isi.
