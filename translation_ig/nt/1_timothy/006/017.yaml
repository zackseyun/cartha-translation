  source_fidelity: 'Nkọwa ahụ na-esochi Grik nke ọma: iwu ahụ metụtara ndị bara ọgaranya n’oge a, ọ machibidoro mpako na itinye olileanya n’akụ na ụba na-enweghị ntụkwasị obi, ma mee ka Chineke bụrụ onye a ga-atụkwasị olileanya. Otú ọ dị, «ka ha tụkwasị ya na Chineke» anaghị ekwughachi «olileanya» n’ụzọ doro anya, ebe «ya» nwere ike nwee nrụtụ aka na-adịghị edo anya. Ikwughachi «olileanya ha» na-echekwa mmegide ἐπὶ πλούτου / ἐπὶ θεῷ kpọmkwem.'
