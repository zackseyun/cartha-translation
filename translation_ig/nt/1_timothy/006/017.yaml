id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: ig
  text: Nye ndị bara ọgaranya n’oge dị ugbu a[a] iwu ka ha ghara ịdị mpako, ka ha gharakwa ịtụkwasị olileanya ha n’akụ na ụba a na-ejighị n’aka[b], kama ka ha tụkwasị olileanya ha na Chineke, onye na-enye anyị ihe niile n’ụba ka anyị jiri ha nwee ọṅụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụwa dị ugbu a.” Okwu Grik ahụ nwere ike ịpụta “oge,” ma ọ bụ, site n’ịgbasa ihe ọ pụtara, usoro ụwa dị ugbu a; “oge” na-echekwa ọdịiche nke oge Pọl chọrọ igosi nke ọma karị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’akụ na ụba na-ejighị n’aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: ndị bara ọgaranya
  rationale: Nkebiokwu a na-ezo aka kpọmkwem n’ebe ndị nwere akụ na ụba nọ; nsụgharị a bụ Igbo nkịtị ma ghara ime ka aha ahụ daa ka mkparị.
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: n’oge dị ugbu a
  rationale: “Oge” na-echekwa echiche temporal na eskatọlọjị nke αἰών karịa “ụwa,” ma na-ada nke ọma n’Igbo ugbu a.
- source_word: παράγγελλε
  choice: Nye ... iwu
  rationale: Ngwaa ahụ bụ iwu nke nwere ikike, ọ bụghị naanị ndụmọdụ ma ọ bụ nkuzi.
- source_word: μὴ ὑψηλοφρονεῖν
  choice: ka ha ghara ịdị mpako
  rationale: Nke a na-egosipụta echiche nke ile onwe elu ma ọ bụ nganga n’ụzọ doro anya ma dịrị ndị na-agụ Igbo mfe.
- source_word: μηδὲ ἠλπικέναι
  choice: ka ha gharakwa ịtụkwasị olileanya ha
  rationale: “Ịtụkwasị olileanya” na-egosi olileanya e tinyere ma kwụsie ike n’ihe, kwekọrọ n’ụdị perfect infinitive.
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: n’akụ na ụba a na-ejighị n’aka
  rationale: Nsụgharị a na-akọwa akụ na ụba dị ka ihe na-enweghị ntụkwasị obi, ma na-echekwa njikọ ya na ihe a na-atụkwasị olileanya na ya.
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: kama ka ha tụkwasị ya na Chineke
  rationale: “Ya” na-anọchi anya olileanya ha, na-eme ka mmegide dị n’etiti akụ na ụba na Chineke doo anya n’Igbo.
- source_word: τῷ παρέχοντι ἡμῖν
  choice: onye na-enye anyị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kpọmkwem isi kọwaa Chineke dị ka onye na-enye anyị ihe.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-echekwa oke okwu Grik ahụ n’enweghị ịbelata ya naanị n’ihe ndị dị mkpa.
- source_word: πλουσίως
  choice: n’ụba
  rationale: “N’ụba” na-egosi inye nke ukwuu ma na-ada nke ọma n’Igbo; ọ na-ejigidekwa isiokwu nke ụba n’amaokwu ahụ.
- source_word: εἰς ἀπόλαυσιν
  choice: ka anyị jiri ha nwee ọṅụ
  rationale: 'Nke a na-egosipụta ebumnuche ma ọ bụ nsonaazụ nke onyinye Chineke n’Igbo nkịtị: ka anyị nwee ọṅụ n’ihe ndị ahụ.'
theological_decisions:
- issue: Ihe αἰών pụtara n’okwu metụtara ndụ na oge ikpeazụ
  choice: oge
  alternative: ụwa
  rationale: “Oge” na-echekwa ọdịiche temporal na eskatọlọjị nke Pọl, kama ime ka okwu ahụ bụrụ naanị banyere ụwa a na-ahụ anya.
- issue: Oke onyinye Chineke dị na πάντα
  choice: ihe niile
  alternative: ihe niile dị anyị mkpa
  rationale: E tinyebeghị okwu “dị anyị mkpa,” n’ihi na Grik kwuru okwu sara mbara. Nke a na-echekwa okwu ahụ n’enweghị itinye ozizi na-ekwe nkwa ịba ọgaranya.
- issue: Ihe e kwesịrị ịtụkwasị olileanya na ya
  choice: Chineke n’onwe ya
  alternative: onyinye Chineke
  rationale: Ụdị Grik na-etinye Chineke kpọmkwem megide akụ na ụba dị ka onye e kwesịrị ịtụkwasị olileanya na ya; e meghị ka ihe Ọ na-enye dochie Ọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ike iwu ahụ, mmegide dị n’etiti akụ na ụba na Chineke, nakwa obosara nke onyinye Chineke, n’enweghị ịgbakwunye nkọwa otu ụka.
