review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal sense of the Greek: enslaved persons are to regard their own masters as worthy of complete honor, so that both God''s name and the teaching are not reviled. However, “nwe ha n''onwe ha” does not accurately express ἰδίους (“their own/their respective”); it adds an unnecessary reflexive emphasis. The perfect-form “kwesịworo” is also not warranted by the present imperative construction.'
  naturalness: The revision uses more idiomatic Standard Igbo syntax and removes the unnatural reflexive phrase. “N'okpuru yoke” retains the established biblical loanword and the Greek metaphor of subjection without adding interpretation.
  terminology: “Ndị ohu” appropriately represents δοῦλοι in this context, and “ndị nwe ha” is a suitable rendering of δεσπότας. “Ozizi” is natural and suitably broad for διδασκαλία. Footnote c is revised because the draft's wording (“ikwulu ya dị ka ihe megidere Chineke”) narrows the coordinated objects and introduces an explanatory sense not present in βλασφημῆται.
  issues:
  - severity: medium
    issue: “ndị nwe ha n'onwe ha” for ἰδίους
    rationale: 'The phrase means “their owners themselves,” whereas the Greek identifies the particular masters belonging to each slave: “their own masters.” “Ndị nwe ha” supplies this naturally in Igbo.'
  - severity: low
    issue: “ndị kwesịworo nsọpụrụ niile”
    rationale: The perfect-like form “kwesịworo” is unnecessarily marked. “Ndị kwesị nsọpụrụ niile” more directly expresses “worthy of all honor.”
  - severity: medium
    issue: Footnote c narrows and overexplains βλασφημῆται
    rationale: The Greek passive applies to both “the name of God” and “the teaching.” The existing note's singular “ya” and “dị ka ihe megidere Chineke” do not preserve that scope or lexical ambiguity.
  - severity: low
    issue: Footnote anchors are all placed at sentence end
    rationale: Placing each anchor immediately after its corresponding word or expression makes the lexical alternatives unambiguous.
