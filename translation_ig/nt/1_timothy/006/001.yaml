id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: ig
  text: Ndị ohu niile nọ n'okpuru yoke kwesịrị iwere ndị nwe ha dị ka ndị kwesị nsọpụrụ niile, ka a ghara ikwulu aha Chineke na ozizi ahụ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-eje ozi” ma ọ bụ “ndị ohu agbụ”; okwu Grik bụ δοῦλοι. E ji “ndị ohu” mee ihe ebe a n'ihi na okwu “n'okpuru yoke” na-eme ka ọnọdụ ịbụ ohu pụta ìhè.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “nkuzi ahụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka a ghara ikwutọ ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: Nkebiokwu ahụ bụ “n'okpuru yok” na-eme ka ọnọdụ ịbụ ndị e kere agbụ pụta ìhè; “ndị ohu” bụ okwu Igbo doro anya nke na-egosipụta ọnọdụ ahụ, ọ bụghị naanị ndị na-eje ozi.
- source_word: ὑπὸ ζυγὸν
  choice: n'okpuru yok
  rationale: Nsụgharị a na-edobe ihe atụ nke yok nke na-egosi ido onwe n'okpuru ọchịchị na agbụ.
- source_word: δεσπότας
  choice: ndị nwe ha
  rationale: N'ebe a, okwu Grik ahụ na-ezo aka ná ndị nwere ikike n'ebe ndị ohu nọ; “ndị nwe ha” na-egosipụta mmekọrịta ahụ nke ọma n'Igbo.
- source_word: ἰδίους
  choice: ha n'onwe ha
  rationale: Nke a na-edobe echiche nke ndị nwe onye nke ya kpọmkwem, ọ bụghị ndị nwe n'ozuzu ha.
- source_word: πάσης τιμῆς ἀξίους
  choice: ndị kwesịworo nsọpụrụ niile
  rationale: Ọ na-egosipụta nyocha ahụ na nkwanye ùgwù zuru ezu e kwuru na Grik n'asụsụ Igbo dị mma.
- source_word: ἡγείσθωσαν
  choice: kwesịrị iwere ... dị ka
  rationale: Nke a na-egosipụta iwu ka ha nọgide na-ele ndị nwe ha anya ma na-ewere ha n'ụzọ a.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: aha Chineke
  rationale: Ọ bụ nsụgharị nkịtị ma guzosie ike nke na-edobe echiche banyere aha, njirimara, na ugwu Chineke.
- source_word: ἡ διδασκαλία
  choice: ozizi ahụ
  rationale: “Ozizi” bụ okwu Igbo nkịtị ma dị mfe nghọta maka ihe a na-akụzi, na-enweghị ime ka ọ bụrụ okwu nkà mmụta okpukpe pụrụ iche karịa ihe Grik kwuru.
- source_word: βλασφημῆται
  choice: a ghara ikwulu
  rationale: “Ikwulu” nwere ike ịgụnye ikwu okwu ọjọọ ma ọ bụ nke mkparị megide ma aha Chineke ma ozizi ahụ.
- source_word: Ὅσοι εἰσὶν
  choice: Ndị niile bụ
  rationale: Ọ na-egosipụta ike gụnyere mmadụ niile nke okwu Grik ὅσοι n'Igbo eke.
theological_decisions:
- issue: Nsụgharị δοῦλοι n'ọnọdụ mmekọrịta mmadụ na ibe ya na-akpata esemokwu
  choice: ndị ohu
  alternative: ndị na-eje ozi; ndị ohu e kere agbụ
  rationale: “Ndị ohu” na-egosipụta ezi ọnọdụ mmekọrịta mmadụ nke amaokwu ahụ na-ekwu maka ya, karịchaa n'ihi okwu “n'okpuru yok.” Nsụgharị ahụ anaghị akwado ịgba ohu.
- issue: Nsụgharị διδασκαλία
  choice: ozizi ahụ
  alternative: nkuzi ahụ
  rationale: “Ozizi ahụ” na-egosipụta ozi a na-akụzi ma na-edobe kpọmkwem ihe e ji article ahụ kọwaa, na-enweghị ịmanye nkọwa otu ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere ihe atụ “yok” na esemokwu dị n'okwu banyere ịgba ohu, na-enweghị ime ka ederede kwado usoro ahụ. E tinyere akara ndetu ala peeji niile n'ahịrịokwu bụ isi.
