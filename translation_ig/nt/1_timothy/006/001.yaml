revisions:
- from: Ndị niile bụ ndị ohu nọ n'okpuru yok kwesịrị iwere ndị nwe ha n'onwe ha dị ka ndị kwesịworo nsọpụrụ niile, ka a ghara ikwulu aha Chineke na ozizi ahụ.[a][b][c]
  to: Ndị ohu niile nọ n'okpuru yoke kwesịrị iwere ndị nwe ha dị ka ndị kwesị nsọpụrụ niile, ka a ghara ikwulu aha Chineke na ozizi ahụ.[a][b][c]
  rationale: The text is revised to render ἰδίους without an unwarranted reflexive, to use an unmarked and natural expression for “worthy,” and to correct the footnote for βλασφημῆται. The verse retains the source's yoke metaphor, the historical designation “ndị ohu,” and the coordinated reference to God's name and the teaching.
