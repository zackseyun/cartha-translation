id: 1TI.6.20
reference: 1 Timothy 6:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: ig
  text: Timoti e, chekwaa ihe ahụ e nyefere gị n’aka, ka ị na-ezere okwu efu na-adịghị nsọ na mmegide[a] nke ihe a na-akpọ “ihe ọmụma” n’ụzọ ụgha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nkwupụta ndị na-emegiderịta onwe ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nke a na-akpọ ihe ọmụma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: Timoti e
  rationale: Akara mkpọku Igbo “e” na-eme ka ọ bụrụ ịkpọ Timoti aha ihu na ihu n’ụzọ siri ike, ma na-anọgide n’asụsụ Igbo eke.
- source_word: παραθήκην
  choice: ihe ahụ e nyefere gị n’aka
  rationale: Nke a na-egosi ihe e tinyere n’aka mmadụ ka o debe ya nke ọma, ma ọ naghị akọwapụta kpọmkwem ihe ahụ bụ karịa ka okwu Grik si mee.
- source_word: φύλαξον
  choice: chekwaa
  rationale: “Chekwaa” na-egosi ilekọta na ichebe ihe e nyefere mmadụ, ọ bụghị naanị ijide ya.
- source_word: ἐκτρεπόμενος
  choice: na-ezere
  rationale: Okwu a na-egosi isi n’ihe ahụ wezuga onwe ya ma zere ya; “na-ezere” dabara nke ọma n’iwu dị n’ahịrịokwu ahụ.
- source_word: βεβήλους
  choice: ndị na-adịghị nsọ
  rationale: Nke a na-edobe ọdịiche dị n’etiti ihe nsọ na ihe na-abụghị nsọ n’enweghị itinye nkọwa okpukpe ọzọ.
- source_word: κενοφωνίας
  choice: okwu efu
  rationale: Ọ na-enye echiche nke okwu na-enweghị isi ma ọ bụ uru n’Igbo dị mfe nghọta.
- source_word: ἀντιθέσεις
  choice: okwu mmegide
  rationale: Okwu Grik nwere ike ịpụta mmegide ma ọ bụ nkwupụta ndị na-emegiderịta onwe ha. “Okwu mmegide” na-edobe obosara ahụ, ebe e nyere ụzọ ọzọ na nkọwa ala peeji.
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: nke ihe a na-akpọ “ihe ọmụma” n’ụzọ ụgha
  rationale: Nke a na-eme ka o doo anya na aha “ihe ọmụma” e nyere ya ezighị ezi, dị ka ψευδώνυμος si egosi.
theological_decisions:
- issue: Ihe παραθήκη na-ezo aka na ya
  choice: E sụgharịrị ya n’ozuzu dịka “ihe ahụ e nyefere gị n’aka.”
  alternative: Oziọma ahụ; ozizi ndịozi; ọrụ e nyere Timoti
  rationale: Okwu a na-egosi ihe e nyefere Timoti ka o chekwaa, ma amaokwu ahụ akọwaghị kpọmkwem ihe ọ bụ. Ya mere, nsụgharị ahụ anaghị amanye otu nkọwa okpukpe kpọmkwem.
- issue: Njikọ nke ἀντιθέσεις na ψευδώνυμος γνῶσις
  choice: E debere ya dịka okwu mmegide nke ihe a na-akpọ ihe ọmụma n’ụzọ ụgha.
  alternative: Ịghọta ἀντιθέσεις naanị dịka nkwupụta ndị na-emegiderịta onwe ha
  rationale: Nke a na-edobe njikọ mkpụrụokwu Grik na nghọtahie okwu “mmegide/imegide onwe ha” n’enweghị idozi ya n’ụzọ dị warara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Timoti e” na-edobe ike nke ịkpọ aha ihu na ihu; a zere okwu ụka pụrụ iche na nkọwa na-akọwapụta ihe e nyefere Timoti karịa ihe ederede kwuru.
