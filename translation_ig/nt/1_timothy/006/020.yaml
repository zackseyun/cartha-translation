    reason: lexical_alternative
  revision_rationale: The revision corrects the unnecessary narrowing of ἀντιθέσεις, improves idiomatic Igbo phrasing for the profane empty talk, and preserves the source text’s broad and polemical wording. Both footnote anchors remain attached to the terms they explain.
