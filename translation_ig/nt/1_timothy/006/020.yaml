  to: Timoti e, chekwaa ihe ahụ e nyefere gị n’aka, ka ị na-ezere okwu efu na-adịghị nsọ na mmegide[a] nke ihe a na-akpọ “ihe ọmụma” n’ụzọ ụgha[b].
