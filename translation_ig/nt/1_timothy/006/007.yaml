base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: ig
  text: N’ihi na anyị eweghị ihe ọ bụla bata n’ụwa[a], anyị enweghịkwa ike iji ihe ọ bụla pụọ na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik: “N’ihi na anyị eweghị ihe ọ bụla bata n’ụwa, n’ihi na anyị enweghịkwa ike iji ihe ọ bụla pụọ na ya.” Njikọ okwu Grik a pụrụ ịpụta “n’ihi na,” ma ọ bụ ọ pụrụ ibute okwu nke abụọ kwekọrọ na nke mbụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ihe ọ bụla ... -ghị
  rationale: Usoro njụ Igbo a na-egosi njụ zuru ezu ma na-ada nke ọma n’okwu a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na amaokwu a na-enye ihe ndabere ma ọ bụ nkọwa maka okwu bu ya ụzọ.
- source_word: εἰσηνέγκαμεν
  choice: anyị ewebataghị
  rationale: “Webata” na-echekwa echiche nke iweta ihe n’ime ebe, ya bụ, n’ụwa.
- source_word: εἰς τὸν κόσμον
  choice: n’ụwa
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu banyere ịbata n’ụwa mmadụ site n’ọmụmụ.
- source_word: ὅτι
  choice: anyị ... kwa
  rationale: E ji njikọ “-kwa” gosipụta ahịrịokwu nke abụọ dịka eziokwu kwekọrọ na nke mbụ; ndetu ala na-echekwa ohere ịgụ ya dịka ihe kpatara ya.
- source_word: οὐδὲ
  choice: anyị apụghịkwa ... ihe ọ bụla
  rationale: Ngwakọta “apụghịkwa” na “ihe ọ bụla” na-egosipụta njụ na njikọ nke ahịrịokwu nke abụọ.
- source_word: ἐξενεγκεῖν
  choice: ibupụ ... na ya
  rationale: “Ibupụ” na-echekwa onyinyo nke iburu ihe pụọ n’ụwa; “na ya” na-eme ka ebe a na-ebupụ ihe doo anya n’Igbo.
- source_word: τι
  choice: ihe ọ bụla
  rationale: N’okpuru njụ, nke a bụ nsụgharị Igbo ebumpụta ụwa maka ihe ọbụla n’enweghị otu e wepụrụ.
- source_word: δυνάμεθα
  choice: anyị apụghị
  rationale: Nke a na-egosipụta enweghị ike n’ụzọ doro anya ma dị mfe nghọta.
theological_decisions:
- issue: Ihe ὅτι pụtara mgbe ọ na-ebute ahịrịokwu nke abụọ
  choice: 'A gụrụ ya dịka njikọ na-ebute eziokwu nke abụọ kwekọrọ na nke mbụ: anyị ewetaghị ihe n’ụwa, anyị apụghịkwa ibupụ ihe na ya.'
  alternative: 'A pụrụ ịgụ ya dịka ihe kpatara ya: “n’ihi na anyị apụghịkwa ibupụ ihe ọ bụla na ya.”'
  rationale: Ọdịdị ilu nke amaokwu ahụ nwere okwu abụọ na-adakọrịta. Isi ederede na-echekwa ndakọrịta ahụ n’Igbo dị mfe, ebe ndetu ala na-egosi ezi mgbagwoju anya nke njikọ Grik ahụ n’enweghị idozi ya n’ụzọ siri ike.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “webata/ibupụ” chekwaa ntụgharị onyinyo nke ịbata n’ụwa na ịpụ na ya, ma e zere ịgbakwunye nkọwa okwukwe na-adịghị n’ederede.
