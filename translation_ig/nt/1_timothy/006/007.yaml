    issue: “ewebataghị” and “ibupụ” may suggest importing and exporting goods.
    rationale: Although lexically related to bringing in and taking out, these terms can sound commercial or administrative in Standard Igbo. The Greek proverb concerns arriving in the world at birth and departing at death; “anyị eweghị ihe ọ bụla bata n’ụwa” expresses this image more naturally.
  - severity: low
    issue: The footnote’s quoted alternative should use the same more natural wording as the revised text.
    rationale: This keeps the alternative causal reading clear and avoids introducing a different, commercially colored image in the note.
