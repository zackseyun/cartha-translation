  rationale: The revision replaces wording that can evoke import/export with a natural Standard Igbo expression for entering the world while carrying nothing. “Iji ihe ọ bụla pụọ na ya” clearly preserves the corresponding inability to take anything out. The footnote continues to mark the disputed/ambiguous force of ὅτι, preserving both the causal and coordinate possibilities.
