id: 1TI.6.19
reference: 1 Timothy 6:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: ig
  text: na-akwakọbaara onwe ha ezi ntọala maka ihe gaje ịbịa[a], ka ha wee jide ndụ ahụ bụ ndụ n’ezie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “maka ọdịnihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: na-akwakọbaara
  rationale: Okwu a na-egosi omume na-aga n’ihu nke ịkwakọba ihe bara uru; ọ na-echekwa echiche nke akụ a na-akwakọba n’enweghị asụsụ ochie.
- source_word: ἑαυτοῖς
  choice: onwe ha
  rationale: Ọ bụ nnọchiaha nlaghachi nke na-egosi na ihe a na-akwakọba ga-abara ndị ahụ onwe ha uru.
- source_word: θεμέλιον καλὸν
  choice: ezi ntọala
  rationale: Nke a na-echekwa ihe atụ nke ntọala ụlọ, ebe “ezi” na-egosi na ntọala ahụ dị mma ma kwesị ntụkwasị obi.
- source_word: εἰς τὸ μέλλον
  choice: maka ihe gaje ịbịa
  rationale: Nhọrọ a na-egosi ihe dị n’ihu ma ghara ịkọwa ya kpọmkwem dị ka “ọgbọ na-abịa,” ọ bụ ezie na ihe gbasara oge ikpeazụ dị n’okwu gbara ya gburugburu.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi nzube nke omume e kwuru okwu ya.
- source_word: ἐπιλάβωνται
  choice: jide
  rationale: “Jide” na-echekwa ihe atụ doro anya nke ịgbatị aka were ihe, kama ime ka ọ bụrụ naanị “nweta.”
- source_word: τῆς ὄντως ζωῆς
  choice: ndụ ahụ bụ ndụ n’ezie
  rationale: 'Nhọrọ a na-echekwa aha ahụ, ζωή, na nkwusi ike nke ὄντως: ọ bụghị naanị ndụ a na-akpọ ndụ, kama ndụ nke bụ ndụ n’ezie.'
theological_decisions:
- issue: Ma εἰς τὸ μέλλον ò kwesịrị ịpụta kpọmkwem dị ka oge ma ọ bụ ọgbọ ikpeazụ
  choice: maka ihe gaje ịbịa
  alternative: maka ọgbọ na-abịa
  rationale: Ihe gbara amaokwu ahụ gburugburu nwere ụda nke ihe ga-eme n’ọdịnihu n’echiche okpukpe, ma okwu Grik ahụ n’onwe ya ekwughị “ọgbọ.” Ya mere, a hapụrụ nghọta ahụ ka ọ saa mbara.
- issue: Otu e si egosipụta τῆς ὄντως ζωῆς
  choice: ndụ ahụ bụ ndụ n’ezie
  alternative: ezi ndụ
  rationale: “Ndụ ahụ bụ ndụ n’ezie” na-echekwa nkwusi ike na esemokwu dị n’ahịrịokwu Grik karịa “ezi ndụ,” nke nwere ike ime ka echiche ahụ dị mfe gabiga ókè.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. A hapụrụ ọdịdị ahịrịokwu ahụ dị ka nkebi na-aga n’ihu site n’amaokwu bu ya ụzọ, dịka participle Grik si dị; e chekwara ma ihe atụ nke ịkwakọba akụ ma nke ntọala, n’agbanyeghị na ha jikọtara ihe atụ abụọ.
