- from: Ma nsọpụrụ Chineke nke afọ ojuju na-eso bụ nnukwu uru[a][b].
  to: Ma ịsọpụrụ Chineke tinyere afọ ojuju bụ nnukwu uru[a][b].
  rationale: The revision renders the genitival accompaniment expressed by μετὰ directly and idiomatically with “tinyere.” It retains “uru” for πορισμός, preserving the contextual echo of gain in the preceding verse, and keeps the contextual rendering “afọ ojuju” for αὐταρκεία without forcing an interpretation of autonomous self-reliance.
