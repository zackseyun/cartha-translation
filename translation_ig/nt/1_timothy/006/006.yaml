id: 1TI.6.6
reference: 1 Timothy 6:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: ig
  text: Ma ịsọpụrụ Chineke tinyere afọ ojuju bụ nnukwu uru[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nnukwu irịta uru” ma ọ bụ “nnukwu ụzọ isi nweta uru.” Okwu Grik ahụ metụtara uru ma na-ekwughachi echiche dị n’amaokwu bu ụzọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “inwe ike igboro onwe onye mkpa” ma ọ bụ “inwe ihe zuru ezu.” N’ebe a, ihe ọ pụtara yikarịrị ka ọ bụ afọ ojuju ma ọ bụ inwe ihe zuru ezu, ọ bụghị ịdabere n’onwe onye nanị.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị megide echiche dị n’amaokwu bu ụzọ, bụ́ na e nwere ndị na-ewere nsọpụrụ Chineke dịka ụzọ isi nweta uru.
- source_word: πορισμὸς
  choice: uru
  rationale: “Uru” na-egosi ihe a na-enweta ma na-edobekwa nkwughachi okwu πορισμός dị n’amaokwu bu ụzọ, n’etinyeghị naanị akụnụba n’echiche ahụ.
- source_word: μέγας
  choice: nnukwu
  rationale: Nke a bụ ntụgharị doro anya nke adjective ahụ ma na-egosi ịdị ukwuu nke uru Pọl na-ekwu maka ya.
- source_word: εὐσέβεια
  choice: nsọpụrụ Chineke
  rationale: Nkebiokwu a na-egosi ndụ nke na-asọpụrụ Chineke ma raara onwe ya nye ya; ọ bụ Igbo dị mfe nghọta karịa okwu nwere ike ịdị ka emume okpukpe nkịtị.
- source_word: μετὰ
  choice: nke ... na-eso
  rationale: Ọ na-egosi njikọ ma ọ bụ ihe na-eso ihe ọzọ, dịka μετά na genitive si arụ ọrụ ebe a.
- source_word: αὐταρκείας
  choice: afọ ojuju
  rationale: N’ọdịnaya amaokwu ndị na-esote, okwu ahụ na-ezo aka n’inwe afọ ojuju n’ihe mmadụ nwere, ọ bụghị ibi ndụ dịka onye na-achọghị Chineke ma ọ bụ enyemaka onye ọ bụla.
theological_decisions:
- issue: Ihe αὐτάρκεια pụtara n’ebe a
  choice: afọ ojuju
  alternative: izuru onwe onye / inwe ihe zuru ezu
  rationale: Amaokwu 7–8 kọwara ya dịka inwe afọ ojuju n’ihe ndị dị mkpa e ji ebi ndụ. “Afọ ojuju” ezere echiche nke ịdabere naanị n’onwe onye.
- issue: Mmekọrịta dị n’etiti nsọpụrụ Chineke na uru
  choice: nsọpụrụ Chineke nke afọ ojuju na-eso bụ n’onwe ya nnukwu uru
  alternative: nsọpụrụ Chineke bụ ụzọ isi nweta nnukwu uru ma ọ bụrụ na afọ ojuju esoro ya
  rationale: Usoro okwu Grik nwere ike ibu echiche abụọ ahụ. Nsụgharị a na-edobe ntụnyere ya na amaokwu 5, ma ghara ime ka ọ dị ka Pọl na-akwado iji okpukpe achụ uru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Nsọpụrụ Chineke” na-akọwa ndụ chere ihu n’ebe Chineke nọ; “afọ ojuju” dabara n’ọdịnaya amaokwu ndị na-esote. E debere akara nkọwa ụkwụ [a][b] n’ahịrị isi.
