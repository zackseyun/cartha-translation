    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “inwe ike igboro onwe onye mkpa” ma ọ bụ “inwe ihe zuru ezu.” N’ebe a, ihe ọ pụtara yikarịrị ka ọ bụ afọ ojuju ma ọ bụ inwe ihe zuru ezu, ọ bụghị ịdabere n’onwe onye nanị.
    reason: lexical_alternative
