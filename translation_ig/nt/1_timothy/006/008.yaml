  text: ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: ig
  text: Ma ọ bụrụ na anyị nwere ihe oriri na ihe mkpuchi[a], anyị ga-enwe afọ ojuju n’ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe.” Okwu Grik ahụ nwekwara ike ịpụta n’ụzọ sara mbara ihe e ji ekpuchi mmadụ, ikekwe gụnyere ebe obibi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: ọ bụrụ na anyị nwere
  rationale: Partisipụl a na-akọ ọnọdụ metụtara ngwaa bụ isi. N'Igbo, nkebi ọnọdụ a na-egosi echiche ahụ nke ọma n'etinyeghị ya n'ọnọdụ siri ike dịka ‘ebe anyị nwere.’
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n'ihe e kwuru banyere uru na afọ ojuju n'amaokwu bu ụzọ.
- source_word: διατροφὰς
  choice: ihe oriri
  rationale: Okwu a pụtara ihe e ji azụ ndụ, karịsịa nri; ‘ihe oriri’ bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ a.
- source_word: σκεπάσματα
  choice: ihe mkpuchi
  rationale: Nhọrọ a na-echekwa obosara okwu Grik, nke nwere ike ịpụta uwe ma ọ bụ ihe ndị ọzọ na-ekpuchi mmadụ, ikekwe gụnyere ebe obibi.
- source_word: τούτοις
  choice: ihe ndị a
  rationale: Ọ na-ezo aka kpọmkwem n'ihe ndị dị mkpa a kpọtụrụ aha—ihe oriri na ihe mkpuchi.
- source_word: ἀρκεσθησόμεθα
  choice: ga-ezuru anyị
  rationale: Ọdịdị ọdịnihu a na-egosi na ihe ndị ahụ ga-ezu, ya bụ, anyị ga-enwe afọ ojuju na ha; ọ naghị agbanwe ya ka ọ bụrụ iwu ‘ka anyị nwee afọ ojuju.’
theological_decisions:
- issue: Ókè ihe σκεπάσματα pụtara
  choice: ihe mkpuchi, nke nwere ike ịgụnye uwe na ebe obibi
  alternative: naanị uwe; ma ọ bụ naanị ebe obibi
  rationale: Okwu Grik ahụ sara mbara. Ịhapụ ya ka ọ bụrụ ‘ihe mkpuchi’ na-echekwa obosara ya ma ghara ịmanye nkọwa mmekọrịta mmadụ pụrụ iche n'amaokwu ahụ.
- issue: Ụdị ἀρκεσθησόμεθα
  choice: 'okwu ọdịnihu na-egosi izu oke: ‘ga-ezuru anyị’'
  alternative: 'ndụmọdụ ma ọ bụ iwu: ‘ka afọ ju anyị’'
  rationale: Ihe odide Grik bụ future indicative, ọ bụghị imperative; nsụgharị ahụ kwesịrị ichekwa ọdịiche a n'agbanyeghị na okwu ahụ nwere ike inwe mmetụta agbamume.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Ihe mkpuchi’ na-echekwa mgbagwoju anya dị n'okwu Grik; ihe e dere n'okpuru peeji na-enye ‘uwe’ dịka nhọrọ nkọwa.
