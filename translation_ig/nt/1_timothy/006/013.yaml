reference: 1 Timothy 6:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: ig
  text: Ana m enye gị iwu n’ihu Chineke[a], onye na-enye ihe niile ndụ, na Mesaịa Jizọs[b], onye gbara ezi nkwupụta ahụ akaebe n’ihu Pọntiọs Paịlet[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘onye na-eme ka ihe niile dị ndụ’ ma ọ bụ ‘onye na-edebe ihe niile ndụ.’ Okwu Grik ζῳογονοῦντος nwere ike imesi ike n’inye ndụ ma ọ bụ n’ichekwa ndụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘Kraịst Jizọs.’ Okwu Grik Χριστός bụ utu aha nke pụtara ‘Mesaịa,’ ya bụ, ‘Onye E Tere Mmanụ.’
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, ‘onye kwupụtara ezi nkwupụta ahụ.’ A pụkwara ịghọta ἐπὶ Ποντίου Πιλάτου dị ka ‘n’oge Pọntiọs Paịlet’ ma ọ bụ ‘n’okpuru ọchịchị Pọntiọs Paịlet.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλω σοι
  choice: Ana m enye gị iwu siri ike
  rationale: παραγγέλλω na-egosi inye iwu ma ọ bụ ntụziaka dị arọ. ‘Iwu siri ike’ na-eme ka ịdị nsọ na ịdị arọ nke okwu Pọl pụta ìhè n’Igbo nkịtị.
- source_word: ἐνώπιον
  choice: n’ihu
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma kwekọọ n’echiche nke ịnọ n’ọdịdị ma ọ bụ n’ihu onye a kpọrọ aha.
- source_word: τοῦ θεοῦ τοῦ ζῳογονοῦντος τὰ πάντα
  choice: Chineke, onye na-enye ihe niile ndụ
  rationale: ζῳογονοῦντος nwere ike ịpụta inye ndụ, ime ka ihe dị ndụ, ma ọ bụ idebe ihe ndụ. Isi nsụgharị ahụ jiri okwu sara mbara nke na-adịghị amanye otu nkọwa naanị.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesaịa Jizọs
  rationale: Χριστός bụ utu aha nke pụtara Onye E Tere Mmanụ, ya bụ Mesaịa; nsụgharị a na-echekwa ọrụ ya dị ka utu aha.
- source_word: μαρτυρήσαντος
  choice: onye gbara ... akaebe
  rationale: Nkebiokwu Igbo ‘ịgba akaebe’ na-egosi ịgba ama n’ihu mmadụ ma dabara n’ọnọdụ ikpe a.
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: n’ihu Pọntiọs Paịlet
  rationale: ἐπί na genitive nwere ike ịpụta ‘n’oge’ ma ọ bụ ‘n’okpuru,’ ma njikọ ya na ịgba akaebe na ọnọdụ ikpe na-akwado ‘n’ihu.’
- source_word: τὴν καλὴν ὁμολογίαν
  choice: ezi nkwupụta ahụ
  rationale: ὁμολογία bụ nkwupụta ma ọ bụ ikweta n’ihu ọha; καλὴν bụ ‘ezi’ ma ọ bụ ‘dị mma.’ Okwu a na-echekwa njikọ ya na nkwupụta Timoti n’amaokwu ndị gbara ya gburugburu.
theological_decisions:
- issue: Ihe Χριστός pụtara ebe a
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: Ebe a, Χριστός ka nwere ike nke utu aha n’ime okwu nkwupụta dị nsọ; ‘Mesaịa’ na-eme ka ihe utu aha ahụ pụtara doo anya.
- issue: Ihe ζῳογονοῦντος pụtara
  choice: onye na-enye ihe niile ndụ
  alternative: onye na-eme ka ihe niile dị ndụ; onye na-edebe ihe niile ndụ
  rationale: Okwu Grik ahụ nwere ike izo aka n’inye ndụ ma ọ bụ n’ichekwa ndụ. Isi nsụgharị ahụ na-ahapụ obosara echiche ahụ, ebe ndetu ala peeji na-egosi ụzọ ndị ọzọ.
- issue: Njikọ μαρτυρήσαντος na ὁμολογίαν
  choice: onye gbara ezi nkwupụta ahụ akaebe
  alternative: onye kwupụtara ezi nkwupụta ahụ
  rationale: Grik ji ὁμολογίαν mee ihe a na-eme kpọmkwem na ngwaa ahụ. Igbo ‘gbara ... akaebe’ na-ada nke ọma ma na-echekwa echiche ịgba ama; ụzọ ọzọ na-egosipụta usoro Grik n’ụzọ ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ana m enye gị iwu siri ike’ na-eburu ịdị arọ nke adjuration ahụ; ‘ịgba akaebe’ na-edobe ụda metụtara ikpe. Akara ndetu [a], [b], na [c] niile dị n’ahịrị isi.
