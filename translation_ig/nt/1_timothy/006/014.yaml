id: 1TI.6.14
reference: 1 Timothy 6:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: ig
  text: ka i debe iwu ahụ n’enweghị ntụpọ, n’enweghịkwa ihe a ga-eji taa ụta[b][c], ruo mgbe Onyenwe anyị Jizọs, bụ́ Mesaya[a], ga-apụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs Kraịst.” Okwu Grik bụ Χριστός nwere ike ịrụ ọrụ dị ka aha ọkwá a sụgharịrị “Mesaya,” ma ọ bụ dị ka ụdị aha ọdịnala “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Okwu ndị a sụgharịrị “n’enweghị ntụpọ” na “n’enweghị ihe a ga-eji taa ụta” nwere ike ịkọwa iwu ahụ n’onwe ya, ma ọ bụ otú Timoti si debe ya. Usoro okwu Grik ahụ dị mkpụmkpụ, nke mere na njikọ ya adịghị akọwa nke ọma.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ka i debe iwu ahụ ka ọ ghara inwe ntụpọ, bụrụkwa nke a na-apụghị ịta ụta.”
    reason: previous_rendering
lexical_decisions:
- source_word: τηρῆσαί
  choice: debe
  rationale: “Debe” na-egosi irubere iwu ahụ isi n’ikwesị ntụkwasị obi ma na-ahapụkwa echiche nke ichekwa ya; ọ bụ okwu Igbo doro anya ma dịkwa mma n’ọnọdụ a.
- source_word: τὴν ἐντολήν
  choice: iwu ahụ
  rationale: “Iwu ahụ” na-edobe ịdị arọ nke aha Grik ahụ nakwa ntụaka ya n’ihe e nyere Timoti n’amaokwu ndị bu ụzọ.
- source_word: ἄσπιλον
  choice: n’enweghị ntụpọ
  rationale: Nke a na-enye echiche nke ihe na-enweghị unyi ma ọ bụ mmerụ, n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: ἀνεπίλημπτον
  choice: n’enweghị ihe a ga-eji taa ụta
  rationale: Nkebi a na-egosi na e nweghị ezi ihe ndabere a ga-eji bo ebubo ma ọ bụ taa ụta; ọ na-ada nke ọma karịa ntụgharị okwu n’otu n’otu.
- source_word: μέχρι
  choice: ruo mgbe
  rationale: Ọ na-egosi oge omume ahụ ga-adịgide ruo n’ihe ga-eme n’ọdịnihu.
- source_word: τῆς ἐπιφανείας
  choice: mgbe ... ga-apụta
  rationale: E ji ngwaa mee aha Grik ahụ n’Igbo eke, ma e webataghị echiche “ọbịbịa nke ugboro abụọ,” nke okwu ahụ n’onwe ya ekwughị kpọmkwem.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Kraịst nke a na-aghọta nke ọma n’Igbo.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mesaya
  rationale: “Mesaya” na-eme ka ọrụ Χριστός dị ka aha ọkwá pụta ìhè, ebe “bụ́” na-eme ka okwu ahụ bụrụ Igbo eke.
theological_decisions:
- issue: Ma ἄσπιλον na ἀνεπίλημπτον hà na-akọwa iwu ahụ ka hà na-akọwa otú Timoti ga-esi debe ya
  choice: E ji nkebi okwu “n’enweghị ntụpọ, n’enweghịkwa ihe a ga-eji taa ụta” mee ka njikọ ahụ ghara ịkọwa otu ụzọ naanị.
  alternative: “ka iwu ahụ ghara inwe ntụpọ, bụrụkwa nke a na-apụghị ịta ụta” ma ọ bụ “ka gị onwe gị ghara inwe ntụpọ, bụrụkwa onye a na-apụghị ịta ụta.”
  rationale: Ụdị okwu Grik ahụ dị mkpụmkpụ ma nwee ike ime ka njikọ nkọwa ahụ na-ezochi; ntụgharị ahụ anaghị ekpebi ihe ederede ahụ hapụrụ n’ọnọdụ mgbagwoju anya.
- issue: Ntụgharị Χριστοῦ n’aha Ἰησοῦ Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ọnọdụ a nke na-ekwu maka ọpụta ya, aha ọkwá ahụ ka na-ada nke ọma; “Mesaya” na-eme ka ihe Χριστός pụtara pụta ìhè, ebe a na-edekọ “Kraịst” dị ka ntụgharị ọdịnala ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Debe iwu ahụ” bụ okwu nkịtị ma sie ike; “ga-apụta” na-eme ka ἐπιφάνεια bụrụ Igbo eke n’etinyeghị nkọwa ndị ọzọ na-adịghị n’ederede Grik. E tinyere akara ntụaka ukwu niile [a], [b], na [c] n’ebe okwu ha metụtara dị.
