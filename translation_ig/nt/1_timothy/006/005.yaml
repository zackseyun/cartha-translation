base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: ig
  text: Esemokwu na-adịgide adịgide[a] n’etiti ndị uche ha mebiri emebi, ndị a napụworo eziokwu ahụ, ndị na-eche na ịsọpụrụ Chineke bụ ụzọ isi nweta uru.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọgụ okwu na-adịghị akwụsị akwụsị” ma ọ bụ “ịna-esere ibe ha okwu mgbe niile.” Okwu Grik ahụ na-enye echiche nke esemokwu ma ọ bụ mkpasu iwe na-adịgide adịgide.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “uru” ma ọ bụ “ihe na-eweta uru.” Ihe ọ pụtara bụ na ha na-ewere ịsọpụrụ Chineke dị ka ihe ha ga-eji nweta uru, karịchaa uru nke ihe onwunwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: esemokwu na-adịghị akwụsị akwụsị
  rationale: Nke a na-egosi esemokwu ma ọ bụ ịna-ese okwu nke na-aga n’ihu mgbe niile. O doro ndị na-agụ Igbo anya, ma ọ naghị eme ka okwu Grik sie ike karịa ka ọ dị.
- source_word: διεφθαρμένων ... τὸν νοῦν
  choice: ndị uche ha mebiri emebi
  rationale: Nkebi okwu a na-egosi ọnọdụ uche ha nọ na ya n’ihi mmebi e mebiworo ya. Ọ na-echekwa ma akụkụ echiche ma akụkụ omume dị n’okwu νοῦς.
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: ndị a napụworo eziokwu ahụ
  rationale: Okwu a na-echekwa olu nnara na ọnọdụ nke ịnapụ ha eziokwu, n’akwụghị onye mere ya.
- source_word: νομιζόντων
  choice: ndị na-eche
  rationale: N’ebe a, iche ha na-eche bụ echiche na-ezighị ezi nke ihe ndị gbara ya gburugburu na-ekpughe; Igbo a bụ nke nkịtị ma doo anya.
- source_word: πορισμὸν
  choice: ụzọ isi nweta uru
  rationale: Nke a na-egosi na ha na-ewere nsọpụrụ Chineke dị ka ihe a ga-eji nweta uru, ọ bụghị naanị na ọ bụ uru n’onwe ya.
- source_word: εὐσέβειαν
  choice: ịsọpụrụ Chineke
  rationale: Nke a na-egosi ndụ na omume nke nkwanye ùgwù na nrubeisi nye Chineke. Ọ naghị eme ka okwu ahụ bụrụ nanị emume okpukpe a na-ahụ anya.
theological_decisions:
- issue: Ma εὐσέβεια ọ̀ ga-egosi ezi nsọpụrụ Chineke ka ọ̀ bụ naanị okpukpe elu ọnụ
  choice: ịsọpụrụ Chineke
  alternative: ime okpukpe; nsọpụrụ Chineke nke elu ọnụ
  rationale: Okwu Grik ahụ n’onwe ya nwere ezi nghọta; ihe a katọrọ bụ iji ya achọ uru, ọ bụghị na nsọpụrụ Chineke n’onwe ya bụ ihe ọjọọ.
- issue: Ike a ga-enye διεφθαρμένων n’ikwu ọnọdụ omume ha
  choice: uche ha mebiri emebi
  alternative: ndị omume ọjọọ jupụtara n’uche ha
  rationale: Nhọrọ a na-echekwa ikpe siri ike dị n’amaokwu ahụ, ma ọ naghị etinye nkọwa ozizi ma ọ bụ okwu siri ike karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E chekwara usoro amaokwu Grik dị ka nkọwa ndị na-akọ ụdị ndị ahụ, ma zere okwu ụka pụrụ iche. A haziri akara ala peeji dịka [a] maka πορισμός na [b] maka διαπαρατριβαί, ha abụọ pụtara n’ederede bụ isi.
