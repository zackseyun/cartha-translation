  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: ig
  text: Ụfọdụ ndị na-azọrọ na ha nwere ya[a] emehiela ụzọ n’ihe gbasara okwukwe[b]. Ka amara dịnyere unu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke ụfọdụ na-azọrọ na ha nwere, ha esiwokwa n’okwukwe kpafuo.” Grik debere nnọchiaha nke pụtara “nke” n’ahịrịokwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: “Okwukwe” n’ebe a yiri ka ọ na-ezo aka n’okwukwe Ndị Kraịst dị ka nkwenye na ozizi ha, ma ọ pụkwara ịpụta okwukwe mmadụ n’onwe ya.
    reason: alternative_reading
  - marker: c
    text: “Unu” bụ ọtụtụ mmadụ na Grik. Ụfọdụ ihe odide ochie enweghị ahịrịokwu Grik a sụgharịrị “dịnyere unu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἥν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’“ihe ọmụma a na-akpọ n’ụzọ ụgha” nke dị n’amaokwu bu ụzọ. “Ya” bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya ma dịkwa mfe.
- source_word: ἐπαγγελλόμενοι
  choice: ndị na-azọrọ na ha nwere
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ikwu ma ọ bụ ịzọrọ na mmadụ nwere ihe ahụ, ọ bụghị ikwe nkwa.
- source_word: ἠστόχησαν
  choice: emehiela ụzọ
  rationale: Nke a na-egosi na ha agbaghị ebe ha kwesịrị iru ma ọ bụ na ha esiwo n’ụzọ ziri ezi pụọ. Okwu Igbo a na-edobe echiche nke ịhapụ ụzọ ma na-ada nke ọma.
- source_word: περὶ τὴν πίστιν
  choice: n’ihe gbasara okwukwe
  rationale: περί na-egosi ihe okwu ahụ metụtara. “Okwukwe” na-edobe πίστις, ebe ihe gbara ya gburugburu na-egosi na ọ pụrụ ịpụta okwukwe Ndị Kraịst dị ka ozizi na nkwenye ha.
- source_word: Ἡ χάρις μεθ’ ὑμῶν
  choice: Ka amara dịnyere unu
  rationale: Nke a bụ ngọzi mmechi akwụkwọ ozi. “Unu” na-egosi nke ọma na ὑμῶν bụ ọtụtụ mmadụ.
theological_decisions:
- issue: Ihe “okwukwe” pụtara n’ịdọ aka ná ntị a
  choice: Okwukwe Ndị Kraịst dị ka nkwenye na ozizi ha
  alternative: Okwukwe mmadụ n’onwe ya ma ọ bụ ntụkwasị obi ya
  rationale: N’akwụkwọ ozi ndị a, “okwukwe” na-apụtakarị nkwenye Ndị Kraịst, karịchaa mgbe a na-ekwu banyere ozizi ụgha. Otú ọ dị, nsụgharị ahụ anaghị etinye nkọwa a n’ime isiokwu ka e wee ghara imechi nghọta ọzọ kpamkpam.
- issue: Ndị ngọzi mmechi ahụ gbasara
  choice: E debere “unu” nke na-ekwu maka ọtụtụ mmadụ
  alternative: Iji okwu na-ekwu naanị Timoti
  rationale: Ihe odide Grik nwere ὑμῶν, nke bụ ọtụtụ mmadụ; ya mere ngọzi ahụ karịrị naanị Timoti, ma o nwere ike ịgụnye ọgbakọ ndị ya na ha nọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe njikọ ya na amaokwu bu ụzọ site n’iji “ya,” ma na-ezere itinye ozizi otu ụka n’ime ihe “okwukwe” pụtara.
