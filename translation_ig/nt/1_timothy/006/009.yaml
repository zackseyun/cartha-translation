  naturalness: The draft is generally natural Standard Igbo. Keeping the relative clause within the sentence is smoother and more closely reflects the Greek syntax. The snare footnote needed clearer, idiomatic wording.
  terminology: “Ọnwụnwa,” “ọnyà,” “ọchịchọ,” “ndị mmadụ,” “ịla n’iyi,” and “mbibi” are suitable Standard Igbo terms. “Ịla n’iyi na mbibi” preserves the emphatic paired warning without specifying an eternal-damnation sense.
  issues:
