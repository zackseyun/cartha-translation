id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: ig
  text: Ma ndị chọrọ ịba ọgaranya[a] na-adaba n’ọnwụnwa, n’ọnyà[b], na n’ọtụtụ ọchịchọ ndị na-enweghị uche ma na-emerụ ahụ, bụ ndị na-emikpu ndị mmadụ[c] n’ịla n’iyi na mbibi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịghọ ọgaranya.” Okwu Grik ahụ pụrụ igosi ọchịchọ ịghọ ọgaranya, ọ bụghị naanị ọnọdụ nke inwe akụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọnyà e ji ejide mmadụ.”
    reason: lexical_alternative
  - marker: c
    text: “Ndị mmadụ” na-asụgharị okwu Grik nke pụtara ụmụ mmadụ n’ozuzu, ọ bụghị nanị ụmụ nwoke.
    reason: generic_human_reference
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι
  choice: Ma ndị chọrọ
  rationale: “Chọrọ” na-egosi ọchịchọ ma ọ bụ ebumnobi siri ike, ebe “Ma” na-ejigide ntụgharị echiche nke δέ.
- source_word: πλουτεῖν
  choice: ịba ọgaranya
  rationale: Nke a na-egosi ọchịchọ mmadụ ịghọ onye bara ọgaranya, ọ bụghị nanị ọnọdụ mmadụ nwere akụ ugbu a.
- source_word: ἐμπίπτουσιν
  choice: na-adaba n’
  rationale: Ọ na-edobe ihe atụ Grik nke ịdaba n’ọnọdụ ọjọọ, ma bụrụkwa okwu Igbo doro anya.
- source_word: πειρασμόν
  choice: ọnwụnwa
  rationale: N’ọnọdụ ịdọ aka ná ntị a, okwu ahụ pụtara ihe na-akpali mmadụ ime ihe ọjọọ karịa ule nkịtị.
- source_word: παγίδα
  choice: ọnyà
  rationale: “Ọnyà” na-edobe ihe atụ nke ihe na-ejide mmadụ na-atụghị anya ya.
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: ọtụtụ ọchịchọ ndị na-enweghị uche ma na-emerụ ahụ
  rationale: Nsụgharị a na-eme ka o doo anya na àgwà abụọ ahụ—enweghị uche na ịdị emerụ ahụ—metụtara ọtụtụ ọchịchọ ndị ahụ niile.
- source_word: αἵτινες
  choice: Ọchịchọ ndị ahụ
  rationale: Ikwughachi “ọchịchọ ndị ahụ” na-eme ka onye okwu njikọ ahụ na-ezo aka na ya doo anya n’Igbo, n’enweghị ịgbanwe ihe ọ pụtara.
- source_word: βυθίζουσι
  choice: na-emikpu
  rationale: “Na-emikpu” na-echekwa ihe oyiyi siri ike nke ime ka mmadụ mikpuo ma ọ bụ daba n’ime mbibi.
- source_word: τοὺς ἀνθρώπους
  choice: ndị mmadụ
  rationale: Okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị nanị ụmụ nwoke.
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: ịla n’iyi na mbibi
  rationale: Okwu abụọ a na-echekwa njikọ okwu abụọ Grik na ịdị arọ nke ịdọ aka ná ntị ahụ, n’enweghị ime ka ha bụrụ otu okwu.
theological_decisions:
- issue: Ma “ὄλεθρον καὶ ἀπώλειαν” ọ̀ ga-akọwa kpọmkwem ikpe ebighị ebi
  choice: ịla n’iyi na mbibi
  alternative: ịla n’iyi na ntaramahụhụ ebighị ebi
  rationale: Okwu Grik ahụ na-egosi nsonaazụ dị oke njọ, ma amaokwu a n’onwe ya akọwaghị kpọmkwem na ọ bụ ikpe ebighị ebi. Ya mere, nsụgharị ahụ na-edobe ịdị arọ na mgbagwoju anya nke isi mmalite ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka njikọ nke αἵτινες na “ọchịchọ” doo anya, ebe a ka na-echekwa usoro echiche na ihe oyiyi siri ike nke Grik.
