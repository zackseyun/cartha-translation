  to: Onye naanị ya nwere anwụghị anwụ, onye bi n’ìhè a na-apụghị ịbịaru nso, onye ọ dịghị onye ọ bụla n’ime ụmụ mmadụ hụtụrụla, ọ dịghịkwa onye pụrụ ịhụ ya.[a] Ka nsọpụrụ na ọchịchị ebighị ebi dịrị ya.[b] Amen.
