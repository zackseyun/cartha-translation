id: 1TI.6.16
reference: 1 Timothy 6:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: ig
  text: Onye naanị ya nwere anwụghị anwụ, onye bi n’ìhè a na-apụghị ịbịaru nso, onye ọ dịghị onye ọ bụla n’ime ụmụ mmadụ hụtụrụla, ọ dịghịkwa onye pụrụ ịhụ ya.[a] Ka nsọpụrụ na ọchịchị ebighị ebi dịrị ya.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ikwu ya, “onye mmadụ ọ bụla na-ahụtụbeghị, onye mmadụ ọ bụla na-apụghịkwa ịhụ.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-aghọta na nkọwa a na otuto a na-ezo kpọmkwem karị n’ebe Onyenwe anyị Jizọs Kraịst nọ n’usoro okwu gbara amaokwu a gburugburu; ma okwu banyere onye a na-apụghị ịhụ na-atụ aka n’ebe Chineke nọ n’ụzọ kacha dabara adaba.
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος
  choice: naanị ya
  rationale: Nke a na-egosipụta n’ụzọ doro anya na ọ bụ naanị ya ka ihe ndị na-esote metụtara.
- source_word: ἔχων ἀθανασίαν
  choice: na-adịghị anwụ anwụ
  rationale: Ọ bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo na anwụghị anwụ bụ nke ya pụrụ iche, n’agbanyeghị na Grik jiri usoro okwu pụtara ‘nwere anwụghị anwụ.’
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: bi n’ìhè a na-apụghị ịbịaru nso
  rationale: ‘Bi’ na-anọchi οἰκῶν, ebe ‘ìhè a na-apụghị ịbịaru nso’ na-echekwa ike nke ἀπρόσιτον karịa nanị ịsị na ìhè ahụ siri ike iru.
- source_word: οὐδεὶς ἀνθρώπων
  choice: ọ dịghị onye ọ bụla n’ime ụmụ mmadụ
  rationale: Nke a na-echekwa ọdịdị nkewa nke ahịrịokwu Grik ma gosi na ọ na-ekwu banyere mmadụ niile, ọ bụghị naanị ụmụ nwoke.
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: ọ dịghịkwa onye pụrụ ịhụ ya
  rationale: ‘Pụrụ’ na-echekwa echiche δύναται banyere enweghị ike, ọ bụghị naanị na ihe ahụ emebeghị.
- source_word: τιμή
  choice: nsọpụrụ
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị maka otuto na nkwanye ùgwù dị n’usoro otuto a.
- source_word: κράτος αἰώνιον
  choice: ọchịchị ebighị ebi
  rationale: N’usoro otuto, κράτος nwere echiche nke ike ọchịchị na-achị achị; ‘ọchịchị ebighị ebi’ na-enye echiche ahụ n’Igbo nkịtị.
- source_word: ἀμήν
  choice: Amen
  rationale: E debere okwu ofufe a dịka a na-ejikarị ya eme ihe n’Igbo.
theological_decisions:
- issue: Onye nkọwa ndị a na otuto a na-ezo aka na ya
  choice: E debere nnọchiaha ‘ya’ n’enweghị ịgbakwunye aha, ebe nghọta kachasị kwekọọ na ahịrịokwu gbara ya gburugburu bụ na ọ na-ezo aka na Chineke.
  alternative: Ụfọdụ na-ewere na nkọwa na otuto a na-ezo kpọmkwem karị n’ebe Onyenwe anyị Jizọs Kraịst nọ.
  rationale: Okwu banyere onye mmadụ na-ahụtụbeghị ma ọ bụ na-apụghị ịhụ na-atụ aka n’ebe Chineke nọ n’ụzọ kachasị eke. Ma ebe usoro okwu sara mbara nwere ike ime ka ụfọdụ jikọta ya na Jizọs Kraịst, e debere esemokwu ahụ na nkọwa ala peeji kama itinye aha ga-emechi ụzọ nghọta ọzọ.
- issue: Mpụtara ἀνθρώπων
  choice: ụmụ mmadụ
  alternative: ụmụ nwoke
  rationale: N’ebe a, ἀνθρώπων na-anọchi mmadụ niile. Igbo ‘ụmụ mmadụ’ na-egosipụta oke ahụ n’enweghị ime ka okwu ahụ bụrụ naanị banyere nwoke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu ndị a na-ejikarị eme ihe karịa ntụgharị nke ga-eso nhazi Grik n’ụzọ ga-ada arọ n’Igbo; e chekwara usoro otuto na mgbagwoju anya gbasara onye a na-ezo aka na ya.
