  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: ig
  text: Onye ahụ ejirila mpako zaa aza[a]; ọ naghị aghọta ihe ọ bụla, kama ọ na-arịa ọrịa nke inwe mmasị n’arụmụka na esemokwu banyere okwu[b]. Site n’ihe ndị ahụ ka anyaụfụ, esemokwu, nkwutọ[c], na ajọ enyo si apụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụrụla onye nganga.” Okwu Grik ahụ na-enye oyiyi nke onye mpako zaa aza.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịlụ ọgụ n’okwu” ma ọ bụ “arụmụka banyere okwu.”
    reason: lexical_alternative
  - marker: c
    text: N’ebe a, “nkwutọ” bụ okwu mkparị ma ọ bụ okwu na-emebi aha a na-ekwu megide ndị mmadụ; n’ọnọdụ ndị ọzọ, okwu Grik a nwekwara ike ịpụta “ikwulu Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: ejirila mpako zaa aza
  rationale: Nke a na-echekwa oyiyi Grik nke mmadụ ịza aza n’ihi mpako, ma gosikwa ọnọdụ sitere n’ihe mere n’oge gara aga nke perfect tense na-egosi.
- source_word: μηδὲν ἐπιστάμενος
  choice: ọ dịghị ihe ọ ghọtara
  rationale: Nke a na-egosi na onye ahụ enweghị nghọta n’ezie, ọ bụghị naanị na ọ maghị ụfọdụ eziokwu.
- source_word: νοσῶν
  choice: ọ na-arịa ọrịa nke agụụ
  rationale: Ọ na-echekwa oyiyi ọrịa dị na νοσέω ma mee ka o doo anya na ọrịa ahụ bụ ihe atụ nke agụụ na-adịghị mma.
- source_word: περὶ ζητήσεις
  choice: ịrụ ụka
  rationale: N’ebe a ζητήσεις na-ezo aka n’arụmụka na esemokwu a na-etinye uche na ha, ọ bụghị nanị n’ajụjụ nkịtị.
- source_word: λογομαχίας
  choice: ịlụ ọgụ n’okwu
  rationale: Nhọrọ a na-echekwa ike nke okwu ngwakọta λόγος na μάχη—ọgụ metụtara okwu—ma bụrụ Igbo a na-aghọta ngwa ngwa.
- source_word: ἐξ ὧν γίνεται
  choice: Ihe ndị a na-amụta
  rationale: Nke a na-egosi na omume ọjọọ ndị na-esochi bụ ihe arụmụka na ọgụ okwu ndị ahụ na-amịpụta.
- source_word: φθόνος
  choice: anyaụfụ
  rationale: Anyaụfụ na-egosi iwe ma ọ bụ mwute n’ihi ihe ọma onye ọzọ nwere, nke dabara na φθόνος.
- source_word: ἔρις
  choice: esemokwu
  rationale: Esemokwu bụ okwu Igbo doro anya maka ọgụ, nghọtahie, na nkewa nke ἔρις na-egosi.
- source_word: βλασφημίαι
  choice: nkwutọ
  rationale: N’usoro mmehie metụtara mmekọrịta mmadụ na ibe ya, okwu a na-egosi okwu mkparị ma ọ bụ okwu na-emebi aha mmadụ; ‘nkwutọ’ dabara n’ọnọdụ a.
- source_word: ὑπόνοιαι πονηραί
  choice: ajọ enyo
  rationale: Nke a bụ ụzọ Igbo dị mkpụmkpụ ma bụrụkwa ihe e ji eme ihe maka echiche ọjọọ a na-enyo ndị ọzọ n’enweghị ezigbo ihe ndabere.
