  register: Ejiri Standard Igbo nke oge a, nke kwụ ọtọ ma dị ùgwù. A hapụrụ oyiyi ọrịa na ịza aza n’ihi mpako ka ike okwu Grik ghara ịla n’iyi; e tinyere nkọwa ndị ọzọ n’ala peeji.
