id: 1TI.6.18
reference: 1 Timothy 6:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀγαθοεργεῖν, πλουτεῖν ἐν ἔργοις καλοῖς, εὐμεταδότους εἶναι, κοινωνικούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/018.yaml
  text: to do good, to be rich in good works, to be generous, ready to share,
translation:
  language: ig
  text: ka ha na-eme ezi ihe, bụrụ ndị bara ọgaranya n’ọrụ ọma, na-emesapụ aka, dịkwa njikere iso ndị ọzọ kerịta ihe ha nwere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: na-eme ezi ihe
  rationale: Nke a na-edobe ike ngwaa ahụ—ime ihe dị mma—ma na-ada nke ọma n’Igbo oge a. Ọ naghị agbanwe ya ka ọ bụrụ naanị aha maka ‘ọrụ ọma.’
- source_word: πλουτεῖν
  choice: bụrụ ndị bara ọgaranya
  rationale: Nke a na-echekwa ihe atụ nke ịba ọgaranya, nke na-emegide akụnụba ihe onwunwe a kpọtụrụ aha n’akụkụ amaokwu a.
- source_word: ἐν ἔργοις καλοῖς
  choice: n’ọrụ ọma
  rationale: Nkebi a na-egosi ebe ma ọ bụ ihe ha ga-eji baa ọgaranya. ‘Ọrụ ọma’ bụ okwu doro anya, dịkwa ugwu n’Igbo.
- source_word: εὐμεταδότους
  choice: na-emesapụ aka
  rationale: Okwu a na-egosi mmadụ dị njikere inye ndị ọzọ ihe o nwere; ‘na-emesapụ aka’ bụ ụzọ Igbo si ekwu ịdị na-emesapụ aka n’enweghị ụda ochie.
- source_word: κοινωνικούς
  choice: dịkwa njikere iso ndị ọzọ kerịta ihe ha nwere
  rationale: Nke a na-egosipụta àgwà nke ịdị njikere ịkekọrịta ihe, ma na-ezere nghọtahie nke pụrụ ibilite ma a sụgharịa ya nanị dị ka ịdị n’otu obodo.
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: na-emesapụ aka, dịkwa njikere iso ndị ọzọ kerịta ihe ha nwere
  rationale: 'A na-edobe echiche abụọ ahụ: nke mbụ na-elekwasị anya n’inye ihe n’obi sara mbara, nke abụọ n’ịdị njikere iso ndị ọzọ kerịta ihe mmadụ nwere.'
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A hapụrụ usoro ahụ ka ọ bụrụ ihe iwu a malitere n’amaokwu gara aga chọrọ ka ha mee. E chekwara ihe atụ nke ‘ịba ọgaranya’ kama iji okwu ga-eme ka ihe atụ akụnụba ahụ laa n’iyi.
