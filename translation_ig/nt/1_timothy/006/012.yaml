id: 1TI.6.12
reference: 1 Timothy 6:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: ig
  text: Lụọ ezi ọgụ nke okwukwe[a]; jidesie ndụ ebighị ebi ahụ ike, nke a kpọrọ gị ka ị bata na ya, ma i kwupụtakwa ezi nkwupụta n’ihu ọtụtụ ndị akaebe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Lụọ ezi ọgụ e ji okwukwe alụ,” ma ọ bụ “Lụọ ezi ọgụ maka okwukwe.” Okwu Grik ahụ nwere ike ịpụta ọgụ nke okwukwe ji mara, ma ọ bụ ọgụ a na-alụ maka okwukwe Ndị Kraịst.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị akụkụ a naanị, “ma i kwupụtakwa ezi nkwupụta n’ihu ọtụtụ ndị akaebe.” Asụsụ Grik ekwughị ọdịnaya nkwupụta ahụ hoo haa. Ọ bụ ezie na nkwupụta ahụ so n’ahịrịokwu na-ekwu maka oku e kpọrọ ya ka ọ bata na ndụ ebighị ebi, njikọ kpọmkwem nke ọdịnaya ya na ndụ ahụ ekwughị n’ederede ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: Lụọ ezi ọgụ
  rationale: “Lụọ … ọgụ” bụ ụzọ Igbo si ekwu okwu n’ụzọ doro anya ma na-echekwa ihe atụ nke ọgụ na ike okwu nkwugharị dị n’etiti ἀγωνίζου na ἀγῶνα. “Ezi” na-egosi ọgụ dị mma, kwesịkwara ekwesị.
- source_word: τῆς πίστεως
  choice: nke okwukwe
  rationale: “Okwukwe” na-echekwa πίστις n’enweghị itinye nkọwa otu ụka. Usoro Igbo a nwere ike ịgụnye ma ọgụ nke okwukwe na-akọwa, ma ọgụ a na-alụ maka okwukwe; e debere nghọta abụọ ahụ na ndetu ala peeji.
- source_word: ἐπιλαβοῦ
  choice: jidesie … ike
  rationale: Nke a bụ okwu Igbo dị ndụ maka ijide ihe nke ọma ma ghara ịhapụ ya; ọ na-echekwa ihe atụ nke ịchịkọta ma jidesie ihe ike.
- source_word: τῆς αἰωνίου ζωῆς
  choice: ndụ ebighị ebi ahụ
  rationale: “Ndụ ebighị ebi” bụ okwu Igbo doro anya maka ndụ na-adịru mgbe ebighị ebi; “ahụ” na-egosi ndụ ahụ a kapịrị ọnụ nke amaokwu ahụ na-ekwu maka ya.
- source_word: εἰς ἣν ἐκλήθης
  choice: nke a kpọrọ gị ka ị bata na ya
  rationale: Nke a na-echekwa echiche εἰς nke ebe a na-aga ma ọ bụ ebumnuche, n’enweghị ịkọwa usoro oku Chineke karịa ihe ederede kwuru.
- source_word: τὴν καλὴν ὁμολογίαν
  choice: ezi nkwupụta
  rationale: “Nkwupụta” dabara na nkweta ma ọ bụ nkwupụta a na-eme n’ihu ọha; “ezi” na-echekwa καλός ma na-eme ka ya na “ezi ọgụ” kwekọọ.
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: n’ihu ọtụtụ ndị akaebe
  rationale: Nke a bụ ntụgharị Igbo dị nkenke ma kpọmkwem maka ime ihe n’ebe ọtụtụ ndị hụrụ ma nwee ike ịgba akaebe nọ.
theological_decisions:
- issue: Ihe τῆς πίστεως pụtara n’ahịrịokwu ahụ
  choice: “nke okwukwe,” nke na-ahapụ njikọ ahụ ka o nwee oghere nghọta
  alternative: “ọgụ maka okwukwe” ma ọ bụ “ọgụ e ji okwukwe alụ”
  rationale: N’asụsụ Grik, ọ pụrụ ịbụ ọgụ a na-alụ maka okwukwe Ndị Kraịst, ma ọ bụ ọgụ nke okwukwe na-akọwa. Igbo “nke okwukwe” na ndetu [a] na-echekwa esemokwu nghọta ahụ.
- issue: Njikọ dị n’etiti nkwupụta ahụ na ndụ ebighị ebi/oku ahụ
  choice: “nke i kwupụtakwara ezi nkwupụta banyere ya”
  alternative: “ị kwupụtakwara ezi nkwupụta” n’enweghị ikwu kpọmkwem ihe nkwupụta ahụ gbasara
  rationale: Usoro ahịrịokwu Grik na-akwado ijikọ nkwupụta ahụ na ndụ ebighị ebi a kpọrọ Timoti ka ọ bata na ya, ma ọ naghị ekwu ọdịnaya nkwupụta ahụ hoo haa. Ndetu [b] na-echekwa ọgụgụ nke na-ahapụ njikọ ahụ n’ụzọ na-apụtachaghị ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E chekwara ihe atụ nke ọgụ, iwu abụọ ahụ, na myiri dị n’etiti “ezi ọgụ” na “ezi nkwupụta.”
