- from: Lụọ ezi ọgụ nke okwukwe[a]; jidesie ndụ ebighị ebi ahụ ike, nke a kpọrọ gị ka ị bata na ya, nke i kwupụtakwara ezi nkwupụta banyere ya n’ihu ọtụtụ ndị akaebe.[b]
  to: Lụọ ezi ọgụ nke okwukwe[a]; jidesie ndụ ebighị ebi ahụ ike, nke a kpọrọ gị ka ị bata na ya, ma i kwupụtakwa ezi nkwupụta n’ihu ọtụtụ ndị akaebe.[b]
  rationale: 'A gbanwere akụkụ ikpeazụ ka ọ soro nhazi Grik: a kpọrọ Timoti ka ọ bata na ndụ ebighị ebi, ma o kwupụtakwara ezi nkwupụta n’ihu ọtụtụ ndị akaebe. Nke a na-ewepụ “banyere ya,” nke na-ekpebi ọdịnaya nkwupụta ahụ karịa ka Grik si kwuo, ma na-echekwa ohere nghọta ahụ n’ndetu [b].'
