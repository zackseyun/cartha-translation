revisions:
- from: A ga-ebu ụzọ nwalee ndị a kwa; mgbe ahụ, ọ bụrụ na e nweghị ihe ziri ezi a ga-eji bo ha ebubo, ka ha jee ozi dị ka ndị diacon.[a]
  to: Ndị a kwa, ka a buru ụzọ nwalee; emesịa ka ha jee ozi[a], ebe ha na-enweghị ihe a ga-eji bo ha ebubo.
  rationale: The revision keeps the Greek imperatives and sequence ('first ... then'), translates διακονείτωσαν directly as 'serve,' and moves the contextually specific 'as deacons' to a footnote. It renders the accompanying participle as a characterization rather than an if-condition, while expressing ἀνέγκλητοι as the absence of a basis for accusation.
  reviewer_model: gpt-5.6-terra
