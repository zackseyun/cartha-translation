    issue: The main text adds 'dị ka ndị diacon' to διακονείτωσαν.
    rationale: The immediate context concerns deacons, so this is a plausible contextual interpretation, but the Greek clause contains only the verb 'serve.' The office-specific rendering should be a footnoted alternative rather than main-text wording.
  - severity: medium
    issue: The phrase 'ọ bụrụ na e nweghị ihe ziri ezi ...' makes ἀνέγκλητοι ὄντες conditional and more paraphrastic.
    rationale: ὄντες is a present participle, 'being,' describing the persons as they serve. A nonconditional Igbo construction better preserves the syntax and avoids adding 'ziri ezi' explicitly.
  revised_text: Ndị a kwa, ka a buru ụzọ nwalee; emesịa ka ha jee ozi[a], ebe ha na-enweghị ihe a ga-eji bo ha ebubo.
