  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: ig
  text: Ndị a kwa, ka a buru ụzọ nwalee; emesịa ka ha jee ozi[a], ebe ha na-enweghị ihe a ga-eji bo ha ebubo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha jee ozi dịka ndị diakọn.” Ngwaa Grik ahụ pụtara “ije ozi”; n’ihi na okwu gbara ya gburugburu na-ekwu maka ndị diakọn, a pụkwara ịghọta ya n’echiche ọrụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ndị a kwa
  rationale: Na-ezo aka n’otu ndị a na-ekwu maka ha, ma na-echekwa echiche mgbakwunye dị na καὶ ... δὲ.
- source_word: δοκιμαζέσθωσαν πρῶτον
  choice: A ga-ebu ụzọ nwalee
  rationale: Na-egosi nyocha e mere iji chọpụta ma mmadụ ò ruru eru, ma na-edobe usoro oge nke πρῶτον.
- source_word: εἶτα
  choice: mgbe ahụ
  rationale: Na-egosi ihe ga-esochi ule ahụ.
- source_word: διακονείτωσαν
  choice: ka ha jee ozi dị ka ndị diacon
  rationale: Ngwaa ahụ pụtara ije ozi; ebe a, ọnọdụ okwu gbasara ndị diacon na-enye ya echiche ọrụ a họpụtara ahọpụta.
- source_word: ἀνέγκλητοι ὄντες
  choice: ọ bụrụ na e nweghị ihe ziri ezi a ga-eji bo ha ebubo
  rationale: Na-akọwa na e nweghị ebubo nwere isi a pụrụ iweta megide ha; ọ naghị ekwu na mmehie adịghị n’ime ha ma ọlị.
theological_decisions:
- issue: Ma a ga-asụgharị διακονείτωσαν dịka ije ozi n’ozuzu ya ka ọ bụ ije ozi dịka ndị diacon
  choice: ka ha jee ozi dị ka ndị diacon
  alternative: ka ha jee ozi
  rationale: Ọ bụ ezie na ngwaa Grik ahụ n’onwe ya pụtara ‘ije ozi,’ okwu gbara ya gburugburu bụ ntozu ndị diacon. A tụkwasịrị nkọwa ọrụ ahụ n’ahịrị, ma debe nhọrọ nkịtị n’ala peeji.
- issue: Ma ἀνέγκλητοι ọ pụtara izu oke na-enweghị mmehie
  choice: ọ bụrụ na e nweghị ihe ziri ezi a ga-eji bo ha ebubo
  alternative: ọ bụrụ na ha enweghị ntụpọ
  rationale: Okwu ahụ na-ekwu maka enweghị ebubo nwere isi, ọ bụghị izu oke na-enweghị mmehie.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma doo ndị nkịtị anya. E ji “ndị diacon” mee ka ọrụ a na-ekwu banyere ya pụta ìhè; ahịrịokwu banyere ebubo ziri ezi na-ezere nghọta na okwu ahụ pụtara enweghị mmehie kpamkpam.
