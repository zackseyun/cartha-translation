  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: ig
  text: Ọ gaghị abụ onye ka bịara ọhụrụ n’okwukwe, ka nganga ghara ịfụli ya elu, o wee daba n’ikpe nke Ekwensu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “daba n’otu ikpe ahụ a mara Ekwensu”; ma ọ bụ, “daba n’ikpe metụtara Ekwensu.”
    reason: alternative_reading
lexical_decisions:
- source_word: νεόφυτον
  choice: onye ka bịara ọhụrụ n’okwukwe
  rationale: Okwu Grik a pụtara n'ụzọ nkịtị ‘onye a kụrụ ọhụrụ,’ ma ebe a ọ na-ezo aka n’onye batara n’okwukwe n’oge na-adịbeghị anya. Nhọrọ Igbo a doro ndị na-agụ akwụkwọ taa anya ma na-edobe ihe e ji ihe atụ ahụ kwuo.
- source_word: τυφωθεὶς
  choice: nganga ghara ime ka ọ fụlie onwe ya elu
  rationale: Ngwaa a na-egosi ịbụ onye nganga ma ọ bụ mpako fụlitere elu. Nsụgharị a na-edobe ihe atụ nke ịfụli elu ma na-ada nke ọma n’Igbo ugbu a.
- source_word: κρίμα
  choice: ikpe
  rationale: ‘Ikpe’ nwere ike ịpụta ma mkpebi ikpe ma amamikpe, ya mere ọ na-edobe obosara na enweghị mkpebi doro anya dị n’okwu Grik.
- source_word: τοῦ διαβόλου
  choice: nke Ekwensu
  rationale: Njikọ genitive nke Grik edoghị anya ma ọ̀ bụ ikpe a mara Ekwensu ka ọ bụ ikpe metụtara Ekwensu n’ụzọ ọzọ. ‘Nke Ekwensu’ na-edobe nghọta abụọ ahụ.
- source_word: ἐμπέσῃ
  choice: daba n’
  rationale: ‘Daba n’ime’ bụ ụzọ Igbo si egosipụta ịbanye n’ọnọdụ ọjọọ, ma na-edobekwa ihe atụ dị na ngwaa Grik.
- source_word: ἵνα μὴ
  choice: ka ... ghara
  rationale: Nke a bụ usoro Igbo doro anya na nke sitere n’okike iji gosipụta nzube ma ọ bụ ihe a na-achọ igbochi.
theological_decisions:
- issue: Ihe εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου pụtara
  choice: daba n’ikpe nke Ekwensu
  alternative: daba n’otu amamikpe ahụ e mara Ekwensu; ma ọ bụ daba n’ikpe metụtara Ekwensu
  rationale: τοῦ διαβόλου nwere ike izo aka n’ikpe a mara Ekwensu ma ọ bụ n’ikpe ya na Ekwensu nwere njikọ n’ụzọ ọzọ. Isi okwu ahụ na-edobe enweghị mkpebi doro anya a, ebe nkọwa ala peeji na-egosi ụzọ ndị bụ isi e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. ‘Onye ka bịara ọhụrụ n’okwukwe’ na-ezere okwu ụka pụrụ iche, ebe ‘nganga ... fụlie onwe ya elu’ na-edobe ihe atụ nke isi mmalite n’ụzọ ndị Igbo na-aghọta.
