source:
  edition: SBLGNT
  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: ig
  text: Ka ndị dikọn bụrụ ndị di nwere otu nwunye[a], ndị na-ahụ maka ụmụ ha na ezinaụlọ nke ha nke ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikom nke otu nwanyị.” Okwu a nwere ike imesi ikwesị ntụkwasị obi n’alụmdi na nwunye ike; ụfọdụ na-aghọta ya kpọmkwem dịka nke na-egbochi ịlụ ọtụtụ nwunye ma ọ bụ ịlụ ọzọ mgbe alụmdi na nwunye kwụsịrị.
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονοι
  choice: Ndị dikọn
  rationale: N’ọnọdụ a, okwu ahụ bụ aha ọrụ a maara n’ọgbakọ, ọ bụghị naanị okwu izugbe maka ndị na-eje ozi.
- source_word: ἔστωσαν
  choice: ga-abụ
  rationale: N’usoro ihe ndị a chọrọ n’aka ndị ọrụ ọgbakọ, ụdị a na-egosi iwu ma ọ bụ ihe a chọrọ; “ga-abụ” na-ekwupụta ihe a chọrọ n’ụzọ Igbo dị nkenke.
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: ndị di nwere otu nwunye
  rationale: 'Nsụgharị a na-anọ Greek nso ma na-ahapụ nghọta okwu ahụ ghe oghe: ọ pụrụ imesi ikwesị ntụkwasị obi n’alụmdi na nwunye ike, ma ọ bụ metụta ịlụ ọtụtụ nwunye ma ọ bụ ịlụ ọzọ.'
- source_word: τέκνων
  choice: ụmụ ha
  rationale: Ọ bụ ezie na nnọchiaha nwe adịghị n’akụkụ okwu Greek a kpọmkwem, njikọ ya na “ezi na ụlọ nke ha” na-eme ka “ụmụ ha” bụrụ Igbo doro anya ma kwekọọ n’ihe a na-ekwu.
- source_word: καλῶς
  choice: nke ọma
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi isi kọwaa na nlekọta ahụ kwesịrị ịdị mma.
- source_word: προϊστάμενοι
  choice: na-elekọta
  rationale: Okwu a na-egosi idu ndú na ibu ọrụ nlekọta. “Na-elekọta” dabara n’ọnọdụ ezinụlọ ma zere ime ka okwu ahụ daa ka ọchịchị aka ike.
- source_word: τῶν ἰδίων οἴκων
  choice: ezi na ụlọ nke ha
  rationale: οἶκος ebe a pụtara ezinụlọ ma ọ bụ ndị niile nọ n’ụlọ, ọ bụghị naanị ụlọ e wuru; “ezi na ụlọ” na-ebute echiche mmekọrịta ezinụlọ ahụ n’Igbo.
theological_decisions:
- issue: Nkọwa nke μιᾶς γυναικὸς ἄνδρες n’ihe ndị a chọrọ n’aka ndị ọrụ ọgbakọ
  choice: E dere ya dịka “ndị di nwere otu nwunye” n’agbanyeghị na okwu ahụ nwere ọtụtụ nghọta.
  alternative: “ndị ikom na-ekwesị ntụkwasị obi nye nwunye ha,” “ndị ikom lụrụ naanị otu ugboro,” ma ọ bụ “ndị ikom nke otu nwanyị.”
  rationale: Greek ahụ dị nkenke ma bụrụ akpaala okwu a na-arụrịta ụka banyere ya. Nsụgharị bụ isi na-anọ nso n’ụdị okwu ahụ ka ọ ghara ikpebi ma isi okwu ya bụ ikwesị ntụkwasị obi n’alụmdi na nwunye, ịghara ịlụ ọtụtụ nwunye, ma ọ bụ ịghara ịlụ ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ndị dikọn” mee aha ọrụ ọgbakọ; e ji “ezi na ụlọ” gosi household karịa naanị ụlọ a na-ebi.
