revisions:
- from: Ndị dikọn ga-abụ ndị di nwere otu nwunye[a], na-elekọta ụmụ ha na ezi na ụlọ nke ha nke ọma.
  to: Ka ndị dikọn bụrụ ndị di nwere otu nwunye[a], ndị na-ahụ maka ụmụ ha na ezinaụlọ nke ha nke ọma.
  rationale: The revision preserves the source’s ambiguity about “one-woman men” in the main text and maintains the office designation. It replaces a less precise care-oriented verb with a natural expression for responsible household oversight, standardizes “ezinụlọ,” and renders the imperative as a qualification requirement rather than a simple future prediction. The footnote continues to present alternatives without endorsing any denominational conclusion.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:39Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies διάκονοι as the church office and preserves the male-specific, deliberately compact expression μιᾶς γυναικὸς ἄνδρες as “ndị di nwere otu nwunye.” It also retains both objects governed by προϊστάμενοι. However, “na-elekọta” can primarily mean caring for rather than exercising responsible oversight, and “ga-abụ” can sound simply future rather than imperative/normative.
  naturalness: “Ezi na ụlọ” is not the normal unified Standard Igbo form; “ezinụlọ” is natural and clear. “Ka ... bụrụ” gives a natural formal-biblical expression of the Greek imperative, and “na-ahụ maka” better conveys responsible management in this household setting.
  terminology: “Ndị dikọn” is an appropriate established church-office term. The main-text marital wording should remain formally noncommittal. The footnote is retained and slightly clarified so that the distinction between polygamy and remarriage is intelligible without deciding the disputed interpretation.
  issues:
  - severity: medium
    issue: The verb “na-elekọta” weakens the oversight/management sense of προϊστάμενοι.
    rationale: Although it can include supervision, it often foregrounds care. “Na-ahụ maka” more naturally communicates being responsible for and managing children and one’s household without importing an authoritarian sense.
  - severity: low
    issue: “Ezi na ụlọ” is nonstandard spacing/wording for the household unit.
    rationale: “Ezinụlọ” is the standard, natural Igbo term and best conveys οἶκος here as a household rather than a building.
  - severity: low
    issue: “Ga-abụ” may be heard as a future statement rather than a normative imperative.
    rationale: The present imperative ἔστωσαν is more directly represented in this register by “Ka ... bụrụ.”
  revised_text: Ka ndị dikọn bụrụ ndị di nwere otu nwunye[a], ndị na-ahụ maka ụmụ ha na ezinaụlọ nke ha nke ọma.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikom nke otu nwanyị.” Okwu a nwere ike imesi ikwesị ntụkwasị obi n’alụmdi na nwunye ike; ụfọdụ na-aghọta ya kpọmkwem dịka nke na-egbochi ịlụ ọtụtụ nwunye ma ọ bụ ịlụ ọzọ mgbe alụmdi na nwunye kwụsịrị.
    reason: alternative_reading
  revision_rationale: The revision preserves the source’s ambiguity about “one-woman men” in the main text and maintains the office designation. It replaces a less precise care-oriented verb with a natural expression for responsible household oversight, standardizes “ezinụlọ,” and renders the imperative as a qualification requirement rather than a simple future prediction. The footnote continues to present alternatives without endorsing any denominational conclusion.
