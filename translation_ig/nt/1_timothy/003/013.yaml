id: 1TI.3.13
reference: 1 Timothy 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: ig
  text: N’ihi na ndị jere ozi nke ọma na-enwetara onwe ha ọnọdụ ọma na obi ike dị ukwuu[a] n’okwukwe[b] nke dị n’ime Mesaịa Jizọs.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi dị ukwuu” ma ọ bụ “nkwuwa okwu dị ukwuu.” Okwu Grik ahụ nwere ike ịpụta obi ike, ntụkwasị obi, ma ọ bụ ikwu okwu n’ezoghị ọnụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ikwesi ntụkwasị obi nke dị n’ime Mesaịa Jizọs.” Okwu Grik πίστις nwere ike ịpụta “okwukwe,” “ntụkwasị obi,” ma ọ bụ “ikwesi ntụkwasị obi.”
    reason: alternative_reading
  - marker: c
    text: N’asụsụ Grik, “Kraịst”; a sụgharịrị ya “Mesaịa” n’ebe a n’ihi na okwu ahụ na-arụ ọrụ dị ka utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: ndị jere ozi
  rationale: Ngwaa Grik a pụtara ije ozi ma ọ bụ ijere ndị ọzọ ozi. Nhọrọ a dabara n’ọnọdụ a na-ekwu maka ndị na-eje ozi n’ọgbakọ, ma ọ naghị etinye aha ọkwa n’ime ngwaa ahụ.
- source_word: καλῶς
  choice: nke ọma
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa mfe isi kọwaa na ha jere ozi n’ụzọ kwesịrị ekwesị.
- source_word: βαθμὸν ... καλὸν
  choice: ọnọdụ ọma
  rationale: βαθμός nwere ike ịpụta nzọụkwụ, ọkwa, ma ọ bụ ọnọdụ mmadụ nwere. “Ọnọdụ ọma” na-egosi nsọpụrụ ha nwetara site n’ozi ọma ha, n’enweghị ikwu hoo haa na ọ bụ ọkwa ọchịchị chọọchị.
- source_word: περιποιοῦνται
  choice: na-enwetara onwe ha
  rationale: Olu etiti nke ngwaa Grik ahụ na-egosi na ihe ha nwetara bụ maka onwe ha; ntụgharị a chekwara echiche ahụ.
- source_word: παρρησίαν
  choice: obi ike
  rationale: Okwu a nwere echiche nke nkwuwa okwu na ntụkwasị obi siri ike. “Obi ike” bụ okwu Igbo e ji eme ihe n’ụzọ dị ndụ ma na-echekwa ike okwu Grik ahụ.
- source_word: πίστει
  choice: okwukwe
  rationale: “Okwukwe” bụ ntụgharị bụ isi nke πίστις n’ebe a, ebe a na-edebe “ikwesị ntụkwasị obi” dị ka ihe ọzọ okwu ahụ pụrụ ịpụta.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: nke dị n’ime Mesaịa Jizọs
  rationale: Nke a na-echekwa usoro Grik ahụ, bụ́ nke na-akọwa okwukwe ahụ dị ka nke dị n’ime Mesaịa Jizọs, kama ime ka njikọ ahụ ghọọ naanị “okwukwe na Jizọs.”
- source_word: Χριστῷ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a; “Mesaịa” na-egosipụta ihe utu aha ahụ pụtara.
theological_decisions:
- issue: Ihe πίστις pụtara n’okwu ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: Okwukwe bụ nghọta kacha kwekọọ n’ahịrịokwu a, ma πίστις nwekwara ike ịpụta ikwesị ntụkwasị obi. E debere nhọrọ nke ọzọ n’ala peeji ka a ghara ikpochapụ mgbagwoju anya dị n’ezie.
- issue: Njikọ nke ἐν Χριστῷ Ἰησοῦ na πίστις
  choice: okwukwe nke dị n’ime Mesaịa Jizọs
  alternative: okwukwe e nwere na Mesaịa Jizọs
  rationale: Isi ederede na-echekwa na nkebiokwu ahụ na-akọwa okwukwe dị “n’ime” Mesaịa Jizọs, kama ikpebi na ọ pụtara nanị okwukwe a tụkwasịrị na ya.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. “Jere ozi” na-ezere itinye aha ọkwa n’ime ngwaa ahụ; “ọnọdụ ọma” na-ezere ime βαθμός ka ọ bụrụ ọkwa ọchịchị kpọmkwem. Akara ala peeji [a], [b], na [c] niile dị n’isi ederede.
