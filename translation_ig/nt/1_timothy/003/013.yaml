revisions:
- from: N’ihi na ndị jere ozi nke ọma na-enwetara onwe ha ọnọdụ ọma na obi ike dị ukwuu[a] n’okwukwe[b] nke dị n’ime Mesaịa Jizọs.[c]
  to: N’ihi na ndị jere ozi nke ọma na-enwetara onwe ha ọnọdụ ọma na obi ike dị ukwuu[a] n’okwukwe[b] nke dị n’ime Mesaịa Jizọs.[c]
  rationale: The verse itself requires no change. The revision corrects the semantic error in footnote a, regularizes the Standard Igbo expression for ‘faithfulness’ in footnote b, and makes footnote c’s statement about Χριστός as a title more idiomatic. All original footnote anchors are retained.
