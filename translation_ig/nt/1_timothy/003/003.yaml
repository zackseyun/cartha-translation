translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ya. E debere usoro ndepụta nke Grik, tinyekwa ‘kama’ iji gosipụta ọdịiche dị n’etiti àgwà ime ihe ike na ịdị nwayọọ. Akara ntụaka niile dị n’ahịrị isi.
