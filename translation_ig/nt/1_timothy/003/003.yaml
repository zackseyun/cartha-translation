    issue: The rendering and note for πάροινον are malformed or unclear.
    rationale: “onye ịṅụbiga mmanya ókè na-achị” has no clear natural Standard Igbo syntax, and “onye mmanya na-adịghị eri ahụ” does not mean the intended lexical alternative. Both are replaced with idiomatic expressions.
  - severity: medium
    issue: The footnote for ἀφιλάργυρον is unidiomatic and semantically unclear.
    rationale: “onye anyaukwu ego na-adịghị achị” is not a natural way to express either ‘not a lover of money’ or ‘not greedy for money.’ It is replaced by a clear alternative.
  - severity: low
    issue: “Ọ ga-abụ” adds a future/modal element absent from the adjectival Greek list.
    rationale: Removing it yields a closer and more natural qualification list.
