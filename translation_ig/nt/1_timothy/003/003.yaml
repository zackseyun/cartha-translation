lexical_decisions:
- source_word: πάροινον
  choice: onye ịṅụbiga mmanya ókè na-achị
  rationale: Okwu a na-egosi onye mmanya na-achị ma ọ bụ onye omume ịṅụbiga mmanya ókè jidere; nsụgharị a na-egosipụta àgwà na-adịgide adịgide, ọ bụghị naanị otu mgbe mmadụ ṅụrụ mmanya.
- source_word: πλήκτην
  choice: onye na-eme ihe ike
  rationale: Ọ bụ ezie na okwu Grik a nwere ike ịpụta kpọmkwem onye na-akụ mmadụ ihe, ‘onye na-eme ihe ike’ bụ Igbo doro anya nke na-ekpuchi àgwà ime ihe ike ahụ.
- source_word: ἐπιεικῆ
  choice: onye dị nwayọọ
  rationale: Okwu a nwere echiche nke ịdị nwayọọ, inwe ndidi, na imeso ndị ọzọ ihe n'ụzọ ezi uche dị na ya; ‘onye dị nwayọọ’ dabara n’usoro àgwà ndị a nke ọma.
- source_word: ἄμαχον
  choice: onye na-adịghị ese okwu
  rationale: Okwu a na-akọwa onye na-adịghị achọ ọgụ ma ọ bụ esemokwu; nsụgharị na-adịghị mma a na-edobe ụdị okwu Grik ma bụrụkwa Igbo eke.
- source_word: ἀφιλάργυρον
  choice: onye na-adịghị ahụ ego n’anya
  rationale: Ngwakọta okwu Grik a na-agọnahụ ịhụ ọlaọcha ma ọ bụ ego n’anya kpọmkwem; ya mere nsụgharị a na-echekwa echiche nke ọchịchọ dị n’obi kama ime ka ọ bụrụ naanị anyaukwu.
