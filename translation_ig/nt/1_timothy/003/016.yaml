id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: ig
  text: 'N’enweghị mgbagha, ihe omimi nke ịsọpụrụ Chineke dị ukwuu:


    Onye[a] pụtara ìhè n’anụ ahụ,


    e gosiri na o ziri ezi n’ime mmụọ[b],


    ndị mmụọ ozi hụrụ ya,


    e kwusara ya n’etiti mba dị iche iche[c],


    a kwere na ya n’ụwa,


    e buliri ya n’ebube[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “Chineke pụtara ìhè n’anụ ahụ,” kama “Onye pụtara ìhè n’anụ ahụ.” Ederede Grik a gbasoro ebe a nwere nnọchiaha nwoke nke pụtara “onye.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, “e gosiri site ná Mmụọ Nsọ na o ziri ezi,” ma ọ bụ “e gosiri n’ime Mmụọ Nsọ na o ziri ezi.” Nkebi Grik ahụ nwere ike izo aka n’ọrụ Mmụọ Nsọ ma ọ bụ n’ọnọdụ ndụ ime mmụọ.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “e kwusara ya n’etiti ndị mba ọzọ,” ya bụ, ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “e buliri ya banye n’ebube.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: N’enweghị mgbagha
  rationale: Nke a na-egosi na ihe a bụ ihe a na-ekweta n’ozuzu ma na-enweghị esemokwu, n’asụsụ Igbo nke oge a.
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: ihe omimi nke ịsọpụrụ Chineke
  rationale: “Ihe omimi” na-echekwa echiche Pọl banyere eziokwu Chineke nke zoro ezo ma mesịa kpughee; “ịsọpụrụ Chineke” na-egosi ndụ ofufe na omume kwekọrọ na ya.
- source_word: Ὃς
  choice: Onye ahụ
  rationale: Ọ na-echekwa nnọchiaha nwoke nke ederede Grik dị oke mkpa ma na-ezo aka n’onye a na-ekwu banyere ya, na-etinyeghị ọgụgụ ọzọ bụ́ “Chineke” n’ahịrị bụ isi.
- source_word: ἐφανερώθη ἐν σαρκί
  choice: pụtara ìhè n’anụ ahụ
  rationale: Ọ na-egosi na a kpọpụtara onye ahụ n’ọha n’ọnọdụ ndụ mmadụ nwere anụ ahụ, ma na-edobe usoro uri dị n’okwu nkwupụta ahụ.
- source_word: ἐδικαιώθη ἐν πνεύματι
  choice: e gosiri na o ziri ezi n’ime mmụọ
  rationale: “E gosiri na o ziri ezi” na-ezere echiche na e mere ya onye ezi omume, kama ọ pụtara na a kwadoro ma gosipụta na ọ nọ n’ụzọ ziri ezi. “N’ime mmụọ” na-ahapụ πνεύματι ka ọ nọgide nwee nghọta karịrị otu.
- source_word: ὤφθη ἀγγέλοις
  choice: ndị mmụọ ozi hụrụ ya
  rationale: Nke a bụ ụzọ Igbo doro anya si kwuo na ndị mmụọ ozi hụrụ ya, ma na-echekwa ihe ὤφθη pụtara n’ebe a.
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: e kwusara ya n’etiti mba dị iche iche
  rationale: “Kwusara” na-egosi nkwusa ozi n’ọha; “mba dị iche iche” na-echekwa obosara ἔθνη ma na-agụnyekwa ndị na-abụghị ndị Juu.
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: ụwa kweere na ya
  rationale: Akpaalaokwu “kweere na ya” na-egosi okwukwe a tụkwasịrị n’onye ahụ, ọ bụghị nanị ikweta na akụkọ banyere ya bụ eziokwu.
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: e buliri ya n’ebube
  rationale: Ọ na-echekwa ọdịdị nnara nke ngwaa ahụ na njikọ ya na ebube, n’enweghị ikpebi ma ἐν pụtara “n’ime” ma ọ bụ “banye n’ime.”
theological_decisions:
- issue: 'Ọgụgụ dị iche ná mmalite abụ nkwupụta ahụ: Ὃς, θεός, ma ọ bụ ὅ'
  choice: A sụgharịrị Ὃς dị ka “Onye ahụ.”
  alternative: Ụfọdụ ihe odide nwere “Chineke pụtara ìhè n’anụ ahụ”; ụfọdụ nwekwara ọgụgụ neuter nke yiri “nke ahụ.”
  rationale: SBLGNT nwere Ὃς, nnọchiaha nwoke “onye.” Nsụgharị bụ isi na-agbaso ederede ahụ, ebe nkọwa ala peeji na-eme ka ọgụgụ “Chineke” a maara n’akụkọ ihe odide pụta ìhè.
- issue: Ihe ἐν πνεύματι na-ezo aka na ya
  choice: “n’ime mmụọ” n’ahịrị bụ isi
  alternative: “site ná Mmụọ Nsọ” ma ọ bụ “n’ime Mmụọ Nsọ”
  rationale: Nkebi Grik ahụ dị mkpụmkpụ, o nwekwaghị akara na-ekpebi kpọmkwem ma ọ bụ Mmụọ Nsọ bụ onye mere ihe ahụ, ma ọ bụ na ọ na-ekwu banyere ọnọdụ ndụ ime mmụọ. Nsụgharị ahụ na-ahapụ esemokwu a ka ọ dị.
- issue: Uzo e si ghọta ἐδικαιώθη banyere Kraịst
  choice: “e gosiri na o ziri ezi”
  alternative: “e mere ka ọ bụrụ onye ezi omume” ma ọ bụ “a kwadoro ya”
  rationale: N’ebe a, ngwaa ahụ dabara n’echiche nke igosi n’ọha na onye ahụ ziri ezi, ọ bụghị ime ka onye na-ezighị ezi ghọọ onye ezi omume.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere usoro ahịrị isii nke nkwupụta uri ahụ na nkwughachi nke ọdịdị nnara ebe Igbo na-anabata ya. A zere okwu ụka pụrụ iche nke otu denominashọn, ma e chekwara mgbagwoju anya nke ederede Grik n’ihe banyere Ὃς na ἐν πνεύματι.
