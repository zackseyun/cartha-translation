id: 1TI.3.11
reference: 1 Timothy 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: ig
  text: Ndị inyom[a] kwa ga-abụ ndị dị ùgwù, ndị na-adịghị ekwutọ mmadụ, ndị na-ejide onwe ha, na ndị kwesịrị ntụkwasị obi n'ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị nwunye kwa ga-abụ ndị dị ùgwù...” Okwu Grik γυναῖκας nwere ike ịpụta “ndị inyom” ma ọ bụ “ndị nwunye” n'ebe a; ederede ahụ ekwughị kpọmkwem “ndị nwunye ha.”
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: Ụmụ nwanyị
  rationale: γυνή nwere ike ịpụta “nwanyị” ma ọ bụ “nwunye.” Ebe ọ bụ na okwu Grik ahụ enweghị okwu na-egosi “ndị nwunye ha,” isiokwu bụ́ “Ụmụ nwanyị” na-ezere itinye ihe na-adịghị na ederede; a debere “ndị nwunye” n'ihe odide ala peeji iji chekwaa nghọta abụọ ahụ.
- source_word: ὡσαύτως
  choice: kwa
  rationale: “Kwa” na-egosi n'ụzọ dị mfe na àgwà ndị a kwekọrọ n'usoro ntozu e kwuru banyere ya tupu amaokwu a.
- source_word: σεμνάς
  choice: ndị dị ùgwù
  rationale: Nke a na-egosi ịdị nsọpụrụ, ịdị arọ n'omume, na ịbụ onye omume ya kwesịrị nsọpụrụ, n'Igbo dị ugbu a ma dịkwa ugwu.
- source_word: μὴ διαβόλους
  choice: ndị na-adịghị ekwutọ mmadụ
  rationale: N'ebe a διάβολος na-akọwa onye na-ebo mmadụ ebubo ọjọọ ma ọ bụ na-ekwutọ ya; ọ bụghị aha ekwensu.
- source_word: νηφαλίους
  choice: ndị na-ejide onwe ha
  rationale: Nhọrọ a na-ekwupụta uche na omume a na-achịkwa nke ọma, nke νηφάλιος nwere ike ịpụta, n'asụsụ Igbo ndị mmadụ na-aghọta ngwa ngwa.
- source_word: πιστὰς
  choice: ndị kwesịrị ntụkwasị obi
  rationale: Nke a na-egosi ịbụ ndị a pụrụ ịdabere na ha na ndị na-eguzosi ike n'omume.
- source_word: ἐν πᾶσιν
  choice: n'ihe niile
  rationale: Ọ na-echekwa oke sara mbara nke okwu Grik ahụ n'ụzọ doro anya.
theological_decisions:
- issue: Ndị γυναῖκας na-ezo aka na ha n'usoro ntozu a
  choice: Ụmụ nwanyị
  alternative: Ndị nwunye
  rationale: Okwu Grik ahụ nwere ike ịpụta ụmụ nwanyị na-eje ozi n'ọrụ a ma ọ bụ ndị nwunye ndị nwoke a kpọtụrụ aha. N'ihi na e tinyeghị okwu pụtara “ha” n'okwu ahụ, e ji okwu sara mbara mee isi ederede ma debe nghọta nke ọzọ n'ihe odide ala peeji, ka a ghara iji ntụgharị dozie esemokwu ahụ n'otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. Usoro nkebiokwu ndị yiri ibe ha na-echekwa ọdịdị ndepụta àgwà dị n'okwu Grik.
