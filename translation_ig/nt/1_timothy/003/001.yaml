id: 1TI.3.1
reference: 1 Timothy 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: ig
  text: 'Okwu a bụ nke e kwesịrị ịtụkwasị obi: Ọ bụrụ na onye ọ bụla na-achọ ọrụ nlekọta[a], ọ na-achọ ezi ọrụ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnọdụ onye nlekọta”; dịka e si asụ ya n'ọdịnala, “ọkwa bishọp.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ọrụ dị ùgwù.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Okwu a bụ nke e kwesịrị ịtụkwasị obi
  rationale: Nke a na-egosipụta usoro okwu Grik nke na-eme ka a mara na okwu na-esochi ya bụ nke a pụrụ ịdabere na ya; “okwu” dabara adaba karịa nsụgharị siri ike nke ga-eme ka λόγος bụrụ naanị otu mkpụrụokwu.
- source_word: εἴ τις
  choice: Ọ bụrụ na onye ọ bụla
  rationale: τις bụ nnọchiaha na-akọwaghị onye kpọmkwem, nke pụtara “onye ọ bụla” ma ọ bụ “otu onye”; okwu a n'onwe ya anaghị etinye nwoke naanị n'ọnọdụ ahụ.
- source_word: ἐπισκοπῆς
  choice: ọrụ nlekọta
  rationale: Nhọrọ a na-echekwa echiche nke ilekọta na iduzi ndị ọzọ, na-emesighị ya ozugbo ka ọ bụrụ ọkwa ụka e guzobere n'ụzọ ndị e mechara mara.
- source_word: ὀρέγεται
  choice: na-achọ
  rationale: N'ebe a, okwu ahụ pụtara ịgbatị ọchịchọ mmadụ n'ebe ihe nọ ma ọ bụ ịchọ iru ya; “na-achọ” bụ okwu Igbo dị mfe ma kwekọọ n'echiche ahụ.
- source_word: καλοῦ ἔργου
  choice: ezi ọrụ
  rationale: Nke a na-anọ nso n'okwu Grik, na-emesi ike na ihe a na-achọ bụ ọrụ dị mma, ọ bụghị naanị ọnọdụ ma ọ bụ aha ùgwù.
- source_word: ἐπιθυμεῖ
  choice: ọ na-achọ
  rationale: Okwu a pụtara inwe ọchịchọ maka ihe. Ikwughachi “na-achọ” na Igbo na-echekwa myirịta dị n'etiti ngwaa abụọ ahụ n'enweghị ịgbakwunye ike na-adịghị mkpa.
theological_decisions:
- issue: Ma a ga-eji aha ọkwa ụka e guzobere n'oge e mesịrị sụgharịa ἐπισκοπῆς
  choice: ọrụ nlekọta
  alternative: ọnọdụ onye nlekọta; ọkwa bishọp
  rationale: Aha Grik ahụ nwere ike ịpụta nlekọta ma ọ bụ ọrụ onye nlekọta. “Ọrụ nlekọta” na-echekwa obosara ihe okwu mbụ pụtara ma ghara ibubata usoro ọchịchị ụka nke otu òtù okpukpe.
- issue: Ma a ga-akọwa τις dị ka nwoke naanị
  choice: onye ọ bụla
  alternative: otu nwoke
  rationale: τις n'ahịrịokwu a bụ nnọchiaha izugbe. Ya mere, “onye ọ bụla” na-egosipụta ihe okwu ahụ n'onwe ya kwuru n'ebughị ụzọ kpebie ajụjụ ndị gbara ya gburugburu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, dee ya. “Ọrụ nlekọta” na-eme ka onye nkịtị ghọta na ihe a na-ekwu bụ ibu ọrụ ilekọta, ma ọ naghị akpọchi ihe okwu Grik pụtara n'ime usoro ọchịchị ụka nke otu denominashọn.
