revisions:
- from: Ndị dijọn, n'otu aka ahụ, ga-abụ ndị a na-akwanyere ùgwù, ndị na-adịghị ekwu okwu ihu abụọ[a], ndị mmanya dị ukwuu na-adịghị achị[b], ndị na-adịghị achọ uru ihere[c].
  to: Ndị dikọn ga-adịkwa ndị a na-akwanyere ùgwù, ndị na-adịghị ekwu okwu ihu abụọ[a], ndị na-adịghị arapara n’ịṅụ ọtụtụ mmanya[b], ndị na-adịghị achọ uru n’ụzọ ihere[c].
  rationale: The revision standardizes the church-office name, replaces an unnatural and source-shifting wine clause with an idiomatic rendering of ongoing attachment to much wine, and makes the final clause natural while retaining the moral force and breadth of αἰσχροκερδεῖς. Footnote anchors and their lexical-alternative functions are retained in source order.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:21:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands διάκονοι as the ecclesial role of deacons and preserves the sequence of qualifications. However, “ndị mmanya dị ukwuu na-adịghị achị” changes the construction into the idea that much wine does not rule them and is not idiomatic Igbo for προσέχοντας (“being devoted/attached to”). The revised wording retains the ongoing attachment to drinking much wine.
  naturalness: “Ndị dijọn” is not the standard, widely recognizable Igbo church title; “ndị dikọn” is preferred. The revised parallel clauses are fluent Standard Igbo. “Uru n'ụzọ ihere” naturally expresses gain sought in a shameful/base manner.
  terminology: “Ndị dikọn” appropriately retains the office title without importing later denominational structures. “Ndị a na-akwanyere ùgwù,” “okwu ihu abụọ,” and “uru n'ụzọ ihere” adequately convey σεμνούς, διλόγους, and αἰσχροκερδεῖς.
  issues:
  - severity: medium
    issue: The rendering of μὴ οἴνῳ πολλῷ προσέχοντας is grammatically and semantically unsuitable.
    rationale: “Ndị mmanya dị ukwuu na-adịghị achị” suggests that wine does not control them, whereas προσέχω here denotes giving oneself to or being preoccupied with much wine. “Ndị na-adịghị arapara n’ịṅụ ọtụtụ mmanya” is idiomatic and preserves the source sense.
  - severity: medium
    issue: The office title “Ndị dijọn” should be standardized.
    rationale: “Ndị dikọn” is the established Standard Igbo form for deacons and will be more readily understood in church and Bible-register usage.
  - severity: low
    issue: “Uru ihere” is not fully natural as a noun phrase.
    rationale: Adding “n'ụzọ” gives a natural expression for profit pursued in a shameful or base way, without narrowing the Greek to dishonest profit alone.
  revised_text: Ndị dikọn ga-adịkwa ndị a na-akwanyere ùgwù, ndị na-adịghị ekwu okwu ihu abụọ[a], ndị na-adịghị arapara n’ịṅụ ọtụtụ mmanya[b], ndị na-adịghị achọ uru n’ụzọ ihere[c].
