  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: ig
  text: Ndị dikọn ga-adịkwa ndị a na-akwanyere ùgwù, ndị na-adịghị ekwu okwu ihu abụọ[a], ndị na-adịghị arapara n’ịṅụ ọtụtụ mmanya[b], ndị na-adịghị achọ uru n’ụzọ ihere[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-adịghị agwa otu onye otu ihe, gwa onye ọzọ ihe ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-adịghị riri ahụ n’ịṅụ ọtụtụ mmanya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị na-adịghị achụ uru rụrụ arụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: Ndị dijọn
  rationale: N'ebe a okwu ahụ na-egosi ndị nwere ọrụ a ma ama n'ọgbakọ, n'ihi na ndepụta a na-esochi nke ndị nlekọta. Ya mere, aha ọrụ ahụ ka e ji mee ka ọnọdụ ya doo anya, n'enweghị itinye usoro ụka ndị mechara pụta.
- source_word: ὡσαύτως
  choice: n'otu aka ahụ
  rationale: Ọ na-ejikọta ntozu ndị a na nke ndị nlekọta e kwuru okwu ha tupu ebe a, ma na-ewebata ìgwè ọzọ.
- source_word: σεμνούς
  choice: ndị a na-akwanyere ùgwù
  rationale: Nke a na-egosi àgwà kwesịrị nsọpụrụ na omume dị arọ, n'ebughị echiche nke ịbụ onye ihu jọrọ njọ ma ọ bụ onye na-adịghị anụrị.
- source_word: μὴ διλόγους
  choice: ndị na-adịghị ekwu okwu ihu abụọ
  rationale: Akpaalaokwu Igbo a na-egosi aghụghọ n'okwu—ịgwa otu onye otu ihe, gwa onye ọzọ ihe ọzọ—ma na-ebuga ihe oyiyi nke okwu Grik ahụ n'ụzọ ndị mmadụ na-aghọta.
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: ndị mmanya dị ukwuu na-adịghị achị
  rationale: Nhọrọ a na-egosi mmadụ ịrapara n'ịṅụ oké mmanya ma ọ bụ ịbụ n'okpuru ike ya, ma na-edebe πολλῷ dị ka ‘dị ukwuu,’ n'ejighị asụsụ ọgwụ ọgbara ọhụrụ kọwaa ya.
- source_word: μὴ αἰσχροκερδεῖς
  choice: ndị na-adịghị achọ uru ihere
  rationale: Ọ na-ejigide ma ọchịchọ uru ma ọdịdị jọgburu onwe ya ma ọ bụ nke na-eweta ihere nke okwu Grik ahụ.
theological_decisions:
- issue: Aha ọrụ ọgbakọ maka διάκονος
  choice: Ndị dijọn
  alternative: ndị na-eje ozi; ndị ozi
  rationale: 'Ọnọdụ okwu a bụ ndepụta ntozu maka ọrụ ndị a ma ama n''ọgbakọ: ndị nlekọta buru ụzọ, ndị dijọn esochie. Aha ọrụ a na-edebe ọdịiche ahụ ma ọ naghị ewebata nkọwa otu ụka kpọmkwem.'
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ndị dijọn” bụ aha ọrụ ụka a na-amata nke ọma; “okwu ihu abụọ” bụ akpaalaokwu nkịtị maka duplicity n'okwu. E debeghị echiche nke πολλῷ n'akụkụ, ma zere ịkpọ ya ọrịa riri ahụ n'ụzọ kpọmkwem.
