  text: na-ejide ihe omimi nke okwukwe ahụ na akọ na uche dị ọcha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịtụgharị ya: “na-ejide ihe omimi nke okwukwe na akọ na uche dị ọcha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντας
  choice: na-ejidesikwa
  rationale: Ọ bụ participle nke na-egosi omume na-aga n’ihu, na-akọwa ndị na-eje ozi e kwuru okwu ha n’amaokwu gara aga. “Na-ejidesikwa” na-egosi na ha na-anọgide na-akwadosi ma na-echekwa okwukwe ahụ; “-kwa” jikọtara nke a na àgwà ndị ọzọ e depụtara.
- source_word: μυστήριον
  choice: ihe omimi
  rationale: N’okwu Pọl, okwu a na-abụkarị eziokwu Chineke nke zoro ezo na mbụ ma e mesịa mee ka a mara ya. “Ihe omimi” na-edobe okwu ahụ n’emegheghị nkọwa ya karịa ihe odide ahụ kwuru.
- source_word: τῆς πίστεως
  choice: nke okwukwe ahụ
  rationale: Artikụl Grik na ọnọdụ ntụziaka gbasara ndị na-eje ozi na-akwado nghọta nke okwukwe dị ka ihe Ndị Kraịst kweere, ọ bụghị naanị omume mmadụ nke ikwere. “Okwukwe ahụ” na-egosi nghọta a ma ka na-edobe okwu bụ́ okwukwe.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: na akọ na uche dị ọcha
  rationale: “Na” na-edobe njikọ ἐν n’ụzọ Igbo sitere n’okike, ebe “akọ na uche dị ọcha” na-egosi iguzosi ike n’ezi omume n’enweghị ikpe onwe onye mara mmadụ.
- source_word: καθαρᾷ
  choice: dị ọcha
  rationale: Nke a bụ ntụgharị kpọmkwem ma bụrụkwa okwu Igbo a na-aghọta nke ọma n’ihe gbasara ịdị ọcha n’omume.
- source_word: συνειδήσει
  choice: akọ na uche
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị maka ikike ime mmụọ nke na-agba akaebe banyere ezi ihe na ihe ọjọọ mmadụ mere.
theological_decisions:
- issue: Ihe τῆς πίστεως pụtara
  choice: ihe Ndị Kraịst kweere, ya bụ “okwukwe ahụ”
  alternative: omume mmadụ nke ikwere ma ọ bụ ikwesị ntụkwasị obi
  rationale: Ọnọdụ a bụ ntụziaka banyere ndị na-eje ozi n’ọgbakọ, ya mere o yikarịrị ka okwu ahụ na-ezo aka n’ozi na nkwenkwe Ndị Kraịst ha ga-ejidesi ike. Agbanyeghị, ntụgharị ahụ anaghị etinye nkọwa ozizi ndị mechara pụta n’ime amaokwu ahụ.
- issue: Mmekọrịta ἐν καθαρᾷ συνειδήσει na ijide okwukwe
  choice: ijide ya ka akọ na uche ha dị ọcha
  alternative: ijide ya site n’akọ na uche dị ọcha
  rationale: ἐν nwere ike igosi ọnọdụ ma ọ bụ ụzọ e si eme ihe. Igbo bụ “na akọ na uche dị ọcha” na-edobe ohere nghọta abụọ ahụ n’enweghị ịmanye otu naanị.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. “Ihe omimi” na “akọ na uche” bụ okwu ndị a maara nke ọma n’asụsụ ụka ma bụrụkwa ndị ndị nkịtị nwere ike ịghọta. E debere usoro participle ahụ ka ọ bụrụ nkebiokwu na-aga n’ihu site n’amaokwu gara aga.
