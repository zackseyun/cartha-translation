review_pass:
  verdict: revise
  source_fidelity: The conditional βραδύνω refers to Paul’s delayed arrival. The draft’s “ọ dị m anya ịbịa” can suggest that coming is distant or difficult rather than delayed; “m egbuo oge ịbịa” conveys the Greek sense directly. The purpose clause, normative impersonal construction, household image, explanatory relative clause, and the predicate “pillar and support of the truth” are otherwise retained.
  naturalness: The revised wording is fluent Standard Igbo. “Egbuo oge ịbịa” is idiomatic for being delayed, and “nkwado nke eziokwu” is a concise, natural noun rendering for ἑδραίωμα while preserving the architectural/support metaphor alongside “ogidi.”
  terminology: “Ezinụlọ Chineke” appropriately expresses οἶκος as God’s household; “ọgbakọ” is a suitable non-institutional rendering of ἐκκλησία, with traditional “ụka” preserved in a note. “Chineke dị ndụ,” “ogidi,” and “eziokwu” are accurate and suitably elevated without denominational expansion.
  issues:
  - severity: medium
    issue: The rendering of βραδύνω is semantically imprecise.
    rationale: “Ọ dị m anya ịbịa” more naturally denotes that arrival is far off or difficult. In this context βραδύνω means that Paul may be delayed or take a long time in coming.
  - severity: low
    issue: The rendering of ἑδραίωμα is somewhat periphrastic.
    rationale: “Ihe na-akwụsi eziokwu ike” is understandable, but “nkwado nke eziokwu” more directly renders the Greek noun and reads more naturally in coordination with “ogidi.”
  revised_text: Ma ọ bụrụ na m egbuo oge ịbịa, ana m edere gị ka ị mara otú e kwesịrị isi na-akpa àgwà n’ezinụlọ Chineke, nke bụ ọgbakọ[a] Chineke dị ndụ, ogidi na nkwado nke eziokwu[b].
