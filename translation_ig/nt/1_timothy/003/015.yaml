id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: ig
  text: Ma ọ bụrụ na m egbuo oge ịbịa, ana m edere gị ka ị mara otú e kwesịrị isi na-akpa àgwà n’ezinụlọ Chineke, nke bụ ọgbakọ[a] Chineke dị ndụ, ogidi na nkwado nke eziokwu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya dịka e si asụgharịkarị ya, “ụka nke Chineke dị ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ogidi na ebe nchebe siri ike nke eziokwu”; ụfọdụ na-atụkwa aro “ntọala” n’ọnọdụ “nkwado.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: ọ dị m anya ịbịa
  rationale: N’ọnọdụ a, okwu ahụ pụtara na Pọl egbuola oge ịbịa, ọ bụghị na ọ dị umengwụ. Nkebi a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo ya.
- source_word: ἵνα εἰδῇς
  choice: ka ị mara
  rationale: Nke a na-egosipụta nzube okwu Grik ahụ n’Igbo nkịtị.
- source_word: δεῖ
  choice: e kwesịrị
  rationale: Ọ na-egosi ihe dị mkpa na ihe kwesịrị ekwesị, n’enweghị ime ka iwu ahụ sie ike karịa ihe Grik kwuru.
- source_word: ἐν οἴκῳ θεοῦ
  choice: n’ezinụlọ Chineke
  rationale: οἶκος nwere ike ịpụta ụlọ ma ọ bụ ezinụlọ. Nkọwa na-esochi ya, ya bụ ọgbakọ Chineke, na-egosi na ihe a na-ekwu bụ ndị Chineke, ọ bụghị naanị ụlọ e wuru ewu.
- source_word: ἀναστρέφεσθαι
  choice: isi na-akpa àgwà
  rationale: N’ebe a, ngwaa ahụ gbasara ụzọ mmadụ si ebi ndụ ma na-eme omume n’etiti ndị Chineke.
- source_word: ἥτις
  choice: nke bụ
  rationale: Ọ na-ejikọta ‘ezinụlọ Chineke’ na nkọwa ya, ‘ọgbakọ Chineke dị ndụ,’ n’ụzọ Igbo doro anya.
- source_word: ἐκκλησία
  choice: ọgbakọ
  rationale: ‘Ọgbakọ’ na-ebute echiche bụ isi nke ndị a kpọkọtara ọnụ, ma na-ezere ime ka okwu ahụ buru naanị echiche ụlọ ma ọ bụ nzukọ ọchịchị.
- source_word: θεοῦ ζῶντος
  choice: Chineke dị ndụ
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma bụrụkwa nke e ji eme ihe maka ahịrịokwu Grik ahụ.
- source_word: στῦλος
  choice: ogidi
  rationale: ‘Ogidi’ na-echekwa ihe atụ e si n’ihe owuwu ụlọ nweta.
- source_word: ἑδραίωμα
  choice: ihe na-akwụsi ... ike
  rationale: Okwu Grik a na-ezo aka n’ihe na-eme ka ihe guzosie ike ma ọ bụ na-akwado ya. Nsụgharị a doro ndị Igbo nke oge a anya ma ghara ikwu na ọgbakọ bụ isi mmalite eziokwu.
- source_word: τῆς ἀληθείας
  choice: eziokwu
  rationale: N’Igbo, ‘eziokwu’ na-egosipụta nke ọma eziokwu ahụ a maara ama nke okwu Grik ahụ na-ezo aka na ya.
theological_decisions:
- issue: Otu e si sụgharịa ἐκκλησία n’ebe a
  choice: ọgbakọ
  alternative: ụka; nzukọ
  rationale: ‘Ọgbakọ’ na-echekwa echiche ndị Chineke kpọkọtara ọnụ n’ebughị ụzọ tinye nkọwa ọchịchị ụka ma ọ bụ nke otu okwukwe pụrụ iche. Ihe odide ala ala peeji na-egosi nsụgharị ọdịnala ‘ụka.’
- issue: Ihe ‘ogidi na ἑδραίωμα nke eziokwu’ pụtara
  choice: ogidi na ihe na-akwụsi eziokwu ike
  alternative: ogidi na ebe nchebe siri ike nke eziokwu; ogidi na ntọala nke eziokwu
  rationale: Nkebi Grik ahụ na-ekwu n’ezie na ọgbakọ Chineke bụ ogidi na ihe na-eme ka eziokwu guzosie ike. Nhọrọ a na-echekwa nkwupụta dị elu banyere ọrụ ọgbakọ, ma ọ naghị ekwu na ọgbakọ bụ ebe eziokwu si malite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Ezinụlọ Chineke’ na ‘ọgbakọ’ na-eme ka o doo anya na ihe a na-ekwu bụ ndị Chineke, ọ bụghị naanị ụlọ. Ahịrịokwu ahụ na-echekwa usoro na ihe atụ nke Grik ma na-asụ ya n’ụzọ ndị Igbo nkịtị ga-aghọta.
