  text: Ταῦτά σοι γράφω, ἐλπίζων ἐλθεῖν πρὸς σὲ ⸂ἐν τάχει⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/014.yaml
  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: ig
  text: Ana m ede gị ihe ndị a, na-atụ anya ịbịakwute gị n'oge na-adịghị anya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ngwa ngwa” ma ọ bụ “n'ime obere oge.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτά
  choice: ihe ndị a
  rationale: Nkebi a na-edobe otutu nke okwu Grik ahụ ma na-ezo aka ná ntụziaka ndị Pọl na-enye n'akwụkwọ ozi a.
- source_word: σοι
  choice: gị
  rationale: N'okwu Igbo bụ “Ana m edere gị,” nnọchiaha a na-egosi onye a na-edegara akwụkwọ ozi n'ụzọ ebumpụta ụwa.
- source_word: γράφω
  choice: Ana m edere
  rationale: Ụdị na-aga n'ihu dabara n'omume ide akwụkwọ ozi nke na-eme ugbu a.
- source_word: ἐλπίζων
  choice: na-enwe olileanya
  rationale: Nke a na-egosi olileanya onye dere ya n'emekwaghị ya ka ọ bụrụ ihe o ji n'aka kpamkpam.
- source_word: ἐλθεῖν
  choice: ịbịakwute
  rationale: Ọ na-egosi ngagharị onye dere akwụkwọ ozi n'ebe Timoti nọ.
- source_word: πρὸς σὲ
  choice: gị
  rationale: Mgbe e jikọtara ya na “ịbịakwute,” ọ na-egosi onye a na-aga ịhụ n'Igbo dị mfe ma kwe nghọta.
- source_word: ἐν τάχει
  choice: n'oge na-adịghị anya
  rationale: Nke a na-egosi na ọ na-atụ anya ịbịa n'oge dị nso, ma na-ahapụkwa nkọwa ọzọ nke ime ihe ngwa ngwa n'ihe odide ala peeji.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù; ahịrịokwu ahụ bụ nke akwụkwọ ozi ma dị mfe nghọta nye ndị nkịtị. E debere akara edemede ka amaokwu ahụ nwee ike ịga n'ihu n'amaokwu na-esote.
