- from: onye na-elekọta ezinụlọ nke ya nke ọma[a], na-eme ka ụmụ ya nọgide na nrubeisi[b], n’ịdị ùgwù zuru oke[c];
  to: onye na-eduzi ezinụlọ nke ya nke ọma[a], nwee ụmụ ya n’ọnọdụ nrubeisi[b], n’ịdị ùgwù niile[c];
  rationale: The revised text removes the unsupported causative and continuative nuance, strengthens the rendering of household leadership, and retains the Greek ambiguity concerning the scope of “with all dignity.” The three footnotes are retained with matching anchors and are adjusted to reflect the revised wording.
