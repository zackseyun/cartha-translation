base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/004.yaml
  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: ig
  text: onye na-eduzi ezinụlọ nke ya nke ọma[a], nwee ụmụ ya n’ọnọdụ nrubeisi[b], n’ịdị ùgwù niile[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-elekọta ezinụlọ nke ya nke ọma,” ma ọ bụ “onye na-achị ụlọ nke ya nke ọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye nwere ụmụ na-erube isi,” ma ọ bụ “onye na-edobe ụmụ ya n’okpuru ikike ya.”
    reason: lexical_alternative
  - marker: c
    text: Okwu a, “n’ịdị ùgwù niile,” nwere ike ịkọwa ụzọ ụmụ ya si erube isi, ma ọ bụ ụzọ o si eduzi ezinụlọ ya dum.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: ezinụlọ nke ya
  rationale: Οἶκος nwere ike ịpụta ụlọ ma ọ bụ ndị ezinụlọ bi n’okpuru nlekọta mmadụ. N’ebe a, “ezinụlọ nke ya” na-egosi ndị nọ n’ụlọ ya na usoro ndụ ụlọ ahụ, ọ bụghị naanị ụlọ e wuru ewu.
- source_word: καλῶς
  choice: nke ọma
  rationale: Nke a bụ ntụgharị doro anya ma bụrụkwa okwu Igbo a na-eji kwa ụbọchị maka ime ihe n’ụzọ kwesịrị ekwesị.
- source_word: προϊστάμενον
  choice: na-elekọta
  rationale: “Na-elekọta” na-egosi ibu ọrụ nke iduzi na ịhazi ezinụlọ, ma ọ naghị eme ka okwu ahụ daa ka ọchịchị aka ike. Ihe gbasara idu ndú ka dị na gburugburu okwu ahụ na nkebi na-esochi ya.
- source_word: τέκνα ἔχοντα
  choice: na-eme ka ụmụ ya nọgide
  rationale: 'E jiri usoro a mee ka τέκνα ἔχοντα ἐν ὑποταγῇ bụrụ Igbo sitere n’okike: ọ na-egosi na ọnọdụ ụmụ ya bụ nrubeisi n’okpuru nlekọta ya.'
- source_word: ἐν ὑποταγῇ
  choice: na nrubeisi
  rationale: “Nrubeisi” na-echekwa echiche nke ịnọ n’okpuru ikike na usoro, kama ime ka ọ bụrụ naanị na a na-achịkwa ha n’ike.
- source_word: μετὰ πάσης σεμνότητος
  choice: n’ịdị ùgwù zuru oke
  rationale: Σεμνότης na-egosi ịdị ùgwù, ịdị nsọpụrụ, na omume kwesịrị ekwesị. Nhazi okwu a na-ahapụ ohere ka ọ metụta nrubeisi ụmụ ahụ ma ọ bụ ụzọ nwoke ahụ si elekọta ezinụlọ ya dum.
theological_decisions:
- issue: Oke echiche dị n’okwu banyere idu ezinụlọ
  choice: Amaokwu a na-ekwu maka otu onye a ga-ahọpụta dị ka onye nlekọta si ebu ọrụ iduzi ezinụlọ nke ya.
  alternative: Ịgụ ya dị ka nkwupụta sara mbara banyere ụdị ikike ezinụlọ niile, ma ọ bụ ime ka ikike ahụ bụrụ naanị ilekọta mkpa ndị mmadụ.
  rationale: Προϊστάμενον na ὑποταγή na-egosi ezigbo ikike na usoro, ma amaokwu a bụ ihe e ji amata onye ruru eru, ọ bụghị nkọwa zuru ezu banyere usoro ezinụlọ niile.
- issue: Ihe “n’ịdị ùgwù zuru oke” na-akọwa
  choice: E debere okwu ahụ n’ụzọ na-adịghị ekpebi kpọmkwem ma ọ na-akọwa nrubeisi ụmụ ya ka ọ̀ bụ usoro nlekọta ezinụlọ ya dum.
  alternative: Ikpebi na ọ na-akọwa naanị omume ụmụ ya, ma ọ bụ naanị ụzọ nna ahụ si elekọta ezinụlọ.
  rationale: Nhazi asụsụ Grik na-enye ohere maka nghọta abụọ ahụ; ya mere, ntụgharị a echekwala mgbagwoju anya ahụ kama idozi ya n’enweghị ihe akaebe zuru ezu.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu dee ya. “Ezinụlọ” na-agụnye ndị nọ n’ụlọ, ebe “nlekọta” na “nrubeisi” jikọtara ibu ọrụ na ezigbo ikike n’enweghị ụda ọchịchị aka ike. E debere ahịrịokwu ahụ dịka nkebi na-aga n’ihu site n’ihe ndị gbara amaokwu a gburugburu.
