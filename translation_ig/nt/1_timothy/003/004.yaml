    reason: alternative_reading
  revision_rationale: The revised text removes the unsupported causative and continuative nuance, strengthens the rendering of household leadership, and retains the Greek ambiguity concerning the scope of “with all dignity.” The three footnotes are retained with matching anchors and are adjusted to reflect the revised wording.
