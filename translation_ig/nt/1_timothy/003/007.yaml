  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: ig
  text: Ọ ghaghịkwa inwe ezi àmà sitere n’aka ndị nọ n’èzí[a], ka ọ ghara ịdaba n’ihere[b] na n’ọnyà Ekwensu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “inwe aha ọma n’etiti ndị na-anọghị n’ime ọgbakọ Ndị Kraịst.” “Ndị nọ n’èzí” na-ezo aka n’azụ ọgbakọ Ndị Kraịst.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ọnọdụ nkọcha” ma ọ bụ “ndakpọ-aha.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ọnyà onye nkwutọ,” ma ọ bụrụ na a ghọta διάβολος n’ozuzu ya dịka onye na-ekwutọ mmadụ; ebe a, a ghọtara ya dịka Ekwensu.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: Ọ ga-abụ
  rationale: Na-egosipụta ihe a chọrọ n’aka onye nlekọta dịka iwu dị mkpa, n’Igbo kwụ ọtọ ma kwekọọ n’usoro ahịrịokwu ahụ.
- source_word: δὲ καὶ
  choice: -kwa
  rationale: Na-ejikọta ihe a chọrọ ebe a na ihe ndị e kwuru tupu ya, ma na-egosikwa na nke a bụ ihe ọzọ agbakwunyere.
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: onye ... na-agbara ezi àmà
  rationale: Ọ bụ ụzọ Igbo dị ndụ isi kwuo na mmadụ nwere ezi akaebe ma ọ bụ aha ọma n’anya ndị ọzọ, n’enweghị ịbelata μαρτυρία ka ọ bụrụ naanị ‘aha ọma.’
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: ndị nọ n’èzí
  rationale: Na-edobe ihe oyiyi Grik nke ndị ‘n’èzí’; ihe ọ pụtara bụ ndị na-abụghị ndị ọgbakọ Ndị Kraịst, nke a kọwara n’ala ala peeji.
- source_word: ἵνα μὴ
  choice: ka ọ ghara
  rationale: Na-egosipụta ebumnuche ma ọ bụ nsonaazụ a chọrọ izere n’Igbo doro anya.
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: ịdaba n’ọnụ nchị
  rationale: ‘Ọnụ nchị’ na-eburu echiche nke nkọcha, ịta ụta, na ihere n’ihu ọha; ‘ịdaba’ na-echekwa ihe atụ nke ἐμπέσῃ.
- source_word: παγίδα
  choice: ọnyà
  rationale: Ọ bụ okwu Igbo nkịtị ma sie ike maka ọnyà e ji amata ma ọ bụ jide mmadụ, na-echekwa ihe atụ nke Grik.
- source_word: τοῦ διαβόλου
  choice: Ekwensu
  rationale: N’ebe a, διάβολος yikarịrị ka ọ na-ezo aka n’onye ajọ omume ahụ, Setan; e debere nghọta ọzọ n’ala ala peeji.
theological_decisions:
- issue: Ihe τοῦ διαβόλου pụtara
  choice: ọnyà Ekwensu
  alternative: ọnyà onye nkwutọ
  rationale: Ojiji okwu a n’Akwụkwọ Nsọ Ọhụrụ, ọkachasị mgbe e ji mkpụrụokwu nkọwa mee ya, na-akwado nghọta ya dịka Ekwensu/Setan. Ma ebe διάβολος nwekwara ike ịpụta ‘onye nkwutọ,’ e chekwara nghọta ahụ n’ala ala peeji kama iwepụ esemokwu okwu ahụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. A họọrọ usoro okwu Igbo nke na-ada nke ọma kama ịrapara n’usoro okwu Grik, ebe a ka chekwara njikọ, ihe atụ, na nghọta ndị ọzọ dị mkpa site n’ala ala peeji.
