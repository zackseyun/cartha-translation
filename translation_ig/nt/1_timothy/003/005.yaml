id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: ig
  text: Ma ọ bụrụ na mmadụ amaghị otú e si eduzi ezi na ụlọ nke aka ya[b], olee otú ọ ga-esi lekọta[c] ọgbakọ Chineke[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọgbakọ nke Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “bute ụzọ n’ezi na ụlọ nke aka ya” ma ọ bụ “bụrụ onyeisi ezi na ụlọ nke aka ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “na-ahụ maka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-egosi ọnọdụ a na-atụle ma na-ejikọ ya n'ụzọ nwere obere ọdịiche na amaokwu bu ya ụzọ.
- source_word: τις
  choice: mmadụ
  rationale: Okwu Grik a na-ekwu banyere onye ọ bụla a na-atụle n’ozuzu ya. ‘Mmadụ’ bụ ụzọ Igbo nkịtị si kwuo ya n’etinyeghị nkọwa karịrị nke dị n’isi mmalite.
- source_word: τοῦ ἰδίου οἴκου
  choice: ezi na ụlọ nke aka ya
  rationale: N’ebe a, οἶκος abụghị naanị ụlọ e wuru, kama ọ bụ ezinụlọ na ndị nọ n’okpuru nlekọta onye ahụ. ‘Ezi na ụlọ’ na-ebute echiche ahụ nke ọma.
- source_word: προστῆναι
  choice: eduzi
  rationale: προΐστημι n’ebe a pụtara ibute ụzọ na ilekọta usoro ezi na ụlọ. ‘Eduzi’ na-egosi nduzi nwere ibu ọrụ n’enweghị ịgbakwunye echiche ọchịchị aka ike.
- source_word: οὐκ οἶδεν
  choice: amaghị otú e si
  rationale: οἶδα tinyere infinitive na-egosi amaghị otú e si eme ihe, ọ bụghị naanị enweghị ihe ọmụma banyere ya.
- source_word: πῶς
  choice: olee otú ọ ga-esi
  rationale: Nke a na-echekwa ajụjụ nkwupụta nke na-esite n’otú onye ahụ si elekọta ezi na ụlọ ya tụnyere nlekọta ọgbakọ.
- source_word: ἐκκλησίας θεοῦ
  choice: ọgbakọ Chineke
  rationale: ἐκκλησία n’ebe a bụ ọgbakọ ndị kwere ekwe. Usoro okwu a bụ Igbo doro anya ma kwekọọ na njikọ genitive nke Grik.
- source_word: ἐπιμελήσεται
  choice: ọ ga-esi lekọta
  rationale: ἐπιμελέομαι na-egosi iji nlezianya na-echebara ndị ọzọ echiche ma na-ahụ maka ọdịmma ha. ‘Lekọta’ na-echekwa echiche nlekọta a ma mee ka ọ dị iche na ‘eduzi’ dị na nkebi mbụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti iduzi ezi na ụlọ na ilekọta ọgbakọ
  choice: E ji ‘eduzi’ mee ihe n’ebe ezi na ụlọ dị, jirikwa ‘lekọta’ mee ihe n’ebe ọgbakọ Chineke dị.
  alternative: Iji ‘chịkwaa’ n’ebe ezi na ụlọ dị, ma ọ bụ iji otu okwu ‘duzie’ mee ihe na nkebi abụọ ahụ.
  rationale: Ihe odide Grik ji ngwaa abụọ dị iche, προΐστημι na ἐπιμελέομαι. Idebe ọdịiche ahụ na-egosi njikọ dị n’etiti ibu ọrụ abụọ ahụ n’emeghị ka nlekọta ọgbakọ bụrụ naanị ịchị ndị mmadụ.
- issue: Ụdị nwoke ma ọ bụ nwaanyị nke onye a na-ekwu banyere ya
  choice: E ji ‘mmadụ’ na nnọchiaha ‘ọ,’ nke na-adịghị egosi nwoke ma ọ bụ nwaanyị n’Igbo.
  alternative: Ịgbakwunye ‘nwoke’ n’amaokwu ahụ iji mee ka ọnọdụ ndị nlekọta ọgbakọ gbara ya gburugburu pụta ìhè.
  rationale: τις bụ nnọchiaha na-akọwaghị kpọmkwem onye ọ bụ. Ọ bụ ezie na ọnọdụ gbara amaokwu ahụ gburugburu na-ekwu banyere onye nlekọta n’ụdị nwoke, Igbo anaghị ekewa nnọchiaha onye nke atọ dịka nwoke na nwaanyị. Ịgbakwunye ‘nwoke’ n’ebe a ga-eme ka okwu ahụ kọwaa ihe karịa ka τις n’onwe ya si kọwaa ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-echekwa ụdị ajụjụ nkwupụta nke Grik, ma na-edobe ọdịiche dị n’etiti nduzi ezi na ụlọ na nlekọta ọgbakọ.
