review_pass:
  verdict: revise
  source_fidelity: The draft follows the Greek list closely and retains the male-specific, formally rendered expression μιᾶς γυναικὸς ἄνδρα without resolving its debated implications. However, “ga-abụ” can read chiefly as a future statement in Igbo and does not consistently convey the necessitative force of δεῖ. “Onye anya doro” is liable to mean someone with clear eyes/vision rather than the figurative ethical and mental sobriety of νηφάλιον.
  naturalness: The register and list structure are generally clear Standard Igbo. Recasting δεῖ with “aghaghị ịbụ” is idiomatic for a requirement, and “onye na-enwe uche doro anya” gives a natural figurative expression for sober-mindedness.
  terminology: “Onye nlekọta” appropriately renders ἐπίσκοπος by sense. “Di otu nwunye” and its note preserve the wording and ambiguity acceptably. The other virtue terms are suitable and neither import later ecclesiastical terminology nor impose an interpretation.
  issues:
  - severity: medium
    issue: The rendering of δεῖ as “ga-abụ” is too weak or future-oriented.
    rationale: δεῖ expresses necessity or requirement. “Aghaghị ịbụ” more directly communicates that force in this qualifications list.
  - severity: medium
    issue: “Onye anya doro” is not a secure idiomatic rendering of figurative νηφάλιον.
    rationale: It may be understood literally as having clear eyes. “Onye na-enwe uche doro anya” conveys being clear-headed/temperate without reducing the term to abstinence from alcohol.
  revised_text: N’ihi ya, onye nlekọta aghaghị ịbụ onye na-enweghị ihe a ga-eji taa ya ụta, di otu nwunye[a], onye na-enwe uche doro anya, onye na-achịkwa onwe ya, onye a na-akwanyere ùgwù, onye na-anabata ndị ọbịa nke ọma, na onye nwere ike izi ihe.
  revised_footnotes:
