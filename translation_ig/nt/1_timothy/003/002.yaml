  to: N’ihi ya, onye nlekọta aghaghị ịbụ onye na-enweghị ihe a ga-eji taa ya ụta, di otu nwunye[a], onye na-enwe uche doro anya, onye na-achịkwa onwe ya, onye a na-akwanyere ùgwù, onye na-anabata ndị ọbịa nke ọma, na onye nwere ike izi ihe.
