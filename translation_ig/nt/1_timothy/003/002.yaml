id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: ig
  text: N’ihi ya, onye nlekọta aghaghị ịbụ onye na-enweghị ihe a ga-eji taa ya ụta, di otu nwunye[a], onye na-enwe uche doro anya, onye na-achịkwa onwe ya, onye a na-akwanyere ùgwù, onye na-anabata ndị ọbịa nke ọma, na onye nwere ike izi ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwoke nke otu nwanyị.” Okwu a nwere ike na-emesi ikwesị ntụkwasị obi n’alụmdi na nwunye ike, ọ bụghị naanị ọnọdụ mmadụ n’ihe gbasara alụmdi na nwunye.
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: ga-abụ
  rationale: N’ime ndepụta ihe ndị a chọrọ n’aka onye nlekọta, ‘ga-abụ’ na-egosi ihe a na-apụghị ịhapụ, ọ bụghị naanị ndụmọdụ.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-egosi na ihe a na-ekwu bụ ihe na-esite n’okwu ndị bu ya ụzọ.
- source_word: ἐπίσκοπον
  choice: onye nlekọta
  rationale: Ọ na-akọwa ọrụ nke ilekọta ndị ọzọ n’etinyeghị aha ọkwa ụka nke malitere ịpụta n’ụzọ pụrụ iche n’oge ndị ọzọ.
- source_word: ἀνεπίλημπτον
  choice: onye na-enweghị ihe a ga-eji taa ya ụta
  rationale: Ọ na-egosi onye a na-enweghị ezi ihe a ga-eji bo ya ebubo ma ọ bụ taa ya ụta, n’ebughị ụzọ kwuo na onye ahụ enweghị mmehie ọ bụla.
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: di otu nwunye
  rationale: Nke a na-agbasochi usoro okwu Grik anya ma na-ahapụ ajụjụ nkọwa ya ghe oghe kama ịkọwa ya naanị dị ka ikwesị ntụkwasị obi n’alụmdi na nwunye.
- source_word: νηφάλιον
  choice: onye anya doro
  rationale: Ọ bụ okwu Igbo dị mfe nke na-egosi onye uche ya doro anya, onye na-akpachapụkwa anya, ọ bụghị naanị onye na-ezere mmanya.
- source_word: σώφρονα
  choice: onye na-achịkwa onwe ya
  rationale: Ọ na-egosi ezi uche na ịchịkwa agụụ na omume onwe onye.
- source_word: κόσμιον
  choice: onye a na-akwanyere ùgwù
  rationale: Ọ na-egosi omume kwesịrị ekwesị na ndụ a haziri nke ọma nke ndị ọzọ nwere ike ịsọpụrụ.
- source_word: φιλόξενον
  choice: onye na-anabata ndị ọbịa nke ọma
  rationale: Ọ na-akọwa njikere iji obi ọma nabata ma lekọta ndị ọbịa, tinyere ndị a na-amaghị.
- source_word: διδακτικόν
  choice: onye nwere ike izi ihe
  rationale: Ọ na-egosi ikike na ntozu izi ihe, ọ bụghị naanị ọchịchọ ime ya.
theological_decisions:
- issue: Nkọwa nke μιᾶς γυναικὸς ἄνδρα n’ihe ndị a chọrọ n’aka onye nlekọta ụka
  choice: E tinyere ‘di otu nwunye’ n’isiokwu ahụ
  alternative: ‘nwoke nke otu nwanyị’ ma ọ bụ ‘onye kwesịrị ntụkwasị obi nye nwunye ya’
  rationale: A na-arụrịta ụka ma okwu ahụ ọ na-elekwasị anya n’ikwesị ntụkwasị obi n’alụmdi na nwunye, n’ịjụ ịlụ ọtụtụ nwunye, ma ọ bụ n’ihe gbasara ịlụ ọzọ. Nsụgharị dị nso n’usoro Grik na-eme ka esemokwu nkọwa ahụ nọgide ghe oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu dee amaokwu ahụ. Ndepụta àgwà ndị ahụ nwere usoro okwu kwekọrọ ekwekọ iji mee ka ọ dị mfe ịgụ n’ihu ọha.
