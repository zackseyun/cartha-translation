revisions:
- from: Ruo mgbe m ga-abịa, na-etinye uchu n’ịgụpụta ihe n’ihu ọha[a], n’ịdụ ndị mmadụ ọdụ, na n’izi ihe.
  to: Ruo mgbe m ga-abịa, tinye uche gị n’ịgụpụta ihe n’ihu ọha[a], n’ịdụ ọdụ, na n’izi ihe.
  rationale: The revision makes the command form of πρόσεχε explicit, retains the likely public sense of ἀνάγνωσις without identifying its object in the main text, and preserves the threefold Greek sequence. The footnote remains anchored to the public-reading phrase and states the contextual Scriptural interpretation as likely rather than certain.
  reviewer_model: gpt-5.6-terra
