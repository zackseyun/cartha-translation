  text: ἕως ἔρχομαι πρόσεχε τῇ ἀναγνώσει, τῇ παρακλήσει, τῇ διδασκαλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/013.yaml
  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: ig
  text: Ruo mgbe m ga-abịa, tinye uche gị n’ịgụpụta ihe n’ihu ọha[a], n’ịdụ ọdụ, na n’izi ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịgụ Akwụkwọ Nsọ.” Asụsụ Grik kwuru naanị “ịgụ ihe,” ma n’ọnọdụ a, o yikarịrị ka ọ na-ekwu banyere ịgụ Akwụkwọ Nsọ n’ihu ọha n’ọgbakọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: Ruo mgbe m ga-abịa
  rationale: Nkebiokwu a na-egosi oge ọrụ Timoti ga-aga n’ihu ruo mgbe Pọl bịara; ọdịdị ngwaa Grik dị ugbu a nwere nghọta nke ihe ga-eme n’ọdịnihu n’ebe a.
- source_word: πρόσεχε
  choice: na-etinye uchu
  rationale: Iwu a na-akpọ Timoti ka ọ nọgide na-enye ihe ndị a nlebara anya na mgbalị, ọ bụghị naanị ka ọ lee ha anya otu ntabi anya.
- source_word: τῇ ἀναγνώσει
  choice: n’ịgụpụta ihe n’ihu ọha[a]
  rationale: ἀνάγνωσις pụtara ịgụ ihe; n’ọnọdụ nzukọ ndị kwere ekwe ebe a, o yikarịrị ka ọ bụ ịgụpụta ihe n’ihu ọha. E tinyeghị ‘Akwụkwọ Nsọ’ n’ahịrị bụ isi n’ihi na Grik akpọghị ihe a na-agụ aha.
- source_word: τῇ παρακλήσει
  choice: n’ịdụ ndị mmadụ ọdụ
  rationale: παράκλησις nwere ike ịpụta ịgba ume, ịrịọ arịrịọ, ma ọ bụ ịdụ ọdụ. N’usoro ọrụ ije ozi a, ‘ịdụ ndị mmadụ ọdụ’ na-egosipụta akụkụ nduzi na agbamume ya n’asụsụ Igbo doro anya.
- source_word: τῇ διδασκαλίᾳ
  choice: n’izi ihe
  rationale: διδασκαλία na-ezo aka n’omume ma ọ bụ ọdịnaya nke izi ihe; okwu a bụ nke nkịtị, doo anya, ọ naghịkwa eme ka ihe a bụrụ naanị usoro nkwenkwe a haziri ahazi.
theological_decisions:
- issue: Ma a ga-akpọ ihe a na-agụ ‘Akwụkwọ Nsọ’ kpọmkwem n’ahịrị bụ isi
  choice: ịgụpụta ihe n’ihu ọha
  alternative: ịgụ Akwụkwọ Nsọ
  rationale: Ọnọdụ akwụkwọ ozi a na-egosi nke ukwuu na ọ bụ ịgụ Akwụkwọ Nsọ n’ọgbakọ, ma Grik kwuru naanị ‘ịgụ ihe.’ Ya mere, ahịrị bụ isi na-egosi na a na-agụpụta ya n’ihu ọha ma hapụ aha ihe a na-agụ n’ala peeji.
- issue: Oke nghọta nke παράκλησις
  choice: ịdụ ndị mmadụ ọdụ
  alternative: ịgba ndị mmadụ ume
  rationale: N’ebe a, okwu ahụ nwere ike ibu ma agbamume ma ndụmọdụ siri ike. Nhọrọ bụ isi na-egosipụta ọrụ onye ndu n’usoro ya na ịgụ ihe na izi ihe, ebe a na-ekweta na ‘ịgba ume’ ka bụ nghọta ọzọ ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-etinye uchu’ na-egosi iwu a ga-anọgide na-eme; ‘ịgụpụta ihe n’ihu ọha’ na-eme ka ọnọdụ ọgbakọ pụta ìhè n’enweghị ịtinye ihe Grik na-akpọghị aha.
