id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: ig
  text: Ka onye ọ bụla ghara ileda ntorobịa gị anya, kama bụrụ ihe nlereanya nye ndị kwere ekwe n’okwu, n’omume, n’ịhụnanya, n’okwukwe[a], n’ịdị ọcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ikwesị ntụkwasị obi.” Okwu Grik a nwere ike ịpụta okwukwe ma ọ bụ ikwesị ntụkwasị obi n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: Ka onye ọ bụla ghara ileda gị anya
  rationale: Usoro a na-egosipụta iwu mgbochi dị n’asụsụ Grik n’Igbo nkịtị ma na-eburu echiche nke ile mmadụ anya nlelị.
- source_word: τῆς νεότητος
  choice: n’ihi na ị bụ nwata
  rationale: Nke a na-akọwa ihe kpatara nlelị ahụ n’Igbo doro anya; ọ na-ezo aka n’afọ ntorobịa Timoti, ọ bụghị àgwà ime ka nwata.
- source_word: τύπος γίνου
  choice: bụrụụrụ ... ihe nlereanya
  rationale: Ọ na-enye iwu ka Timoti bụrụ ụdị ezi omume ndị ọzọ ga-eṅomi, ma kwekọọ n’usoro okwu Igbo.
- source_word: τῶν πιστῶν
  choice: ndị kwere ekwe
  rationale: N’ebe a πιστοί na-ezo aka n’ìgwè ndị mmadụ bụ ndị kwere ekwe.
- source_word: ἐν λόγῳ
  choice: n’okwu
  rationale: N’usoro àgwà ọma a, λόγος na-ezo aka n’ihe mmadụ na-ekwu ma ọ bụ ụzọ o si ekwu okwu.
- source_word: ἐν ἀναστροφῇ
  choice: n’omume
  rationale: ἀναστροφή pụtara akparamàgwà ma ọ bụ ụzọ ndụ; “omume” dị nkenke ma dịkwa mfe nghọta.
- source_word: ἐν ἀγάπῃ
  choice: n’ịhụnanya
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma bụrụkwa nke ebumpụta ụwa maka ἀγάπη.
- source_word: ἐν πίστει
  choice: n’okwukwe
  rationale: “Okwukwe” na-echekwa isi nghọta nke ịtụkwasị Chineke obi, ebe e debere nghọta ọzọ nke ikwesị ntụkwasị obi n’ala ala peeji.
- source_word: ἐν ἁγνείᾳ
  choice: na n’ịdị ọcha
  rationale: ἁγνεία na-egosi ịdị ọcha n’omume na n’àgwà, nke nwere ike ịgụnye ịdị ọcha n’ihe gbasara mmekọahụ n’agbanyeghị na okwu ahụ abụghị naanị nke ahụ.
theological_decisions:
- issue: Ihe πίστις pụtara n’usoro àgwà ọma a
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: Ihe gbara okwu ahụ gburugburu nwere ike ịkwado okwukwe mmadụ nwere ma ọ bụ àgwà nke ịbụ onye kwesị ntụkwasị obi. E debere “okwukwe” n’ahịrị isi ma tinye nghọta ọzọ n’ala ala peeji ka a ghara idozi ihe Grik hapụrụ ghe oghe n’ụzọ otu akụkụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro “Ka onye ọ bụla ghara...” nye iwu mgbochi ahụ n’ụzọ ebumpụta ụwa, ma debe nhazi nke usoro àgwà ọma dị n’akwụkwọ Grik.
