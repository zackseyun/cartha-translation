review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, the call to exemplary conduct, and all five areas of example. However, “n’ihi na ị bụ nwata” recasts the Greek genitive “your youth” as an explicit causal clause and can suggest childhood rather than Timothy’s youth/young age. The source directly says not to despise his youth.
  naturalness: Most of the wording is clear Standard Igbo. “bụụrụ” is not appropriate here; “bụrụ” is the natural imperative. “nye ndị kwere ekwe” naturally expresses that Timothy is to be an example for/to the believers.
  terminology: “Ntorobịa gị” preserves νεότης without implying that Timothy is a child. “Ndị kwere ekwe,” “okwukwe,” “ịhụnanya,” and “ịdị ọcha” are suitable modern Standard Igbo renderings. The footnote appropriately retains the contextual alternative of faithfulness for πίστις.
  issues:
  - severity: medium
    issue: “n’ihi na ị bụ nwata” replaces “your youth” with “because you are a child.”
    rationale: This adds a causal formulation not explicit in Greek and may make νεότης sound like childhood. “Ntorobịa gị” directly and more accurately represents τῆς νεότητος.
  - severity: medium
    issue: “bụụrụ” should be “bụrụ.”
    rationale: The imperative required by γίνου is naturally rendered “bụrụ”; the draft form is not suitable Standard Igbo usage in this sentence.
  - severity: low
    issue: The relation of “example” to believers is clearer with “nye ndị kwere ekwe.”
    rationale: The genitive τῶν πιστῶν with τύπος is idiomatically expressed in Igbo as being an example for/to the believers.
  revised_text: Ka onye ọ bụla ghara ileda ntorobịa gị anya, kama bụrụ ihe nlereanya nye ndị kwere ekwe n’okwu, n’omume, n’ịhụnanya, n’okwukwe[a], n’ịdị ọcha.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ikwesị ntụkwasị obi.” Okwu Grik a nwere ike ịpụta okwukwe ma ọ bụ ikwesị ntụkwasị obi n’ebe a.
    reason: alternative_reading
  revision_rationale: The revision restores the source’s direct reference to Timothy’s youth, corrects the imperative form, and uses a natural Igbo construction for serving as an example to believers. It retains the virtue list and the footnoted ambiguity of πίστις without imposing a narrower interpretation.
