id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: ig
  text: Site n’itinye ihe ndị a n’ihu ụmụnna[a], ị ga-abụ ezi onye na-ejere Mezaịa Jizọs[b] ozi, onye a na-azụ site n’okwu nke okwukwe ahụ[c] na nke ezi nkuzi ahụ ị gbasoro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” dị n’ụdị nwoke, ma n’ọnọdụ a ọ pụrụ izo aka n’ebe ndị otu okwukwe niile nọ, gụnyere ndị nwanyị.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “Kraịst Jizọs.” E ji “Mezaịa” sụgharịa utu aha Grik Χριστός iji chekwaa ihe ọ pụtara.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “okwu okwukwe.” O yikarịrị ka “okwukwe ahụ” na-ezo aka n’ihe ndị Ndị Kraịst kweere.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-edobe ọtụtụ ihe okwu a na-arụtụ aka na ha, dịka ọtụtụ n’asụsụ Grik.
- source_word: ὑποτιθέμενος
  choice: na-edobe ... n’ihu
  rationale: Nke a na-echekwa onyinyo okwu Grik nke ịtụkwasị ma ọ bụ idobe ihe n’ihu mmadụ, ebe ọ ka na-egosi ime ka ọgbakọ mara ihe ndị ahụ.
- source_word: τοῖς ἀδελφοῖς
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo kwụ ọtọ ma dịkwa eke maka ndị otu okwukwe; n’ọnọdụ a ọ pụrụ ịgụnye ndị nwoke na ndị nwanyị.
- source_word: καλὸς
  choice: ezi
  rationale: “Ezi” na-akọwa ịdị mma na ntụkwasị obi nke onye na-eje ozi n’Igbo dị mfe.
- source_word: διάκονος
  choice: onye na-ejere ... ozi
  rationale: Ebe a okwu ahụ na-akọwa ọrụ ije ozi, ọ bụghị n’ụzọ doro anya ọkwa chọọchị a na-akpọ dikọn.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mezaịa Jizọs
  rationale: “Mezaịa” na-echekwa ihe utu aha Χριστός pụtara, ebe “Jizọs” bụ ụdị aha a maara nke ọma n’Igbo.
- source_word: ἐντρεφόμενος
  choice: na-azụ gị
  rationale: Nke a na-echekwa ihe atụ nke inweta nri na uto site n’okwu okwukwe na nkuzi.
- source_word: τοῖς λόγοις
  choice: okwu
  rationale: “Okwu” na-anọgide nso n’ọtụtụ λόγοις ma ghara ịgbanwe ya ozugbo ka ọ bụrụ naanị “nkuzi.”
- source_word: τῆς πίστεως
  choice: nke okwukwe ahụ
  rationale: Mkpụrụokwu ahụ na njikọ ya na nkuzi na-akwado nghọta nke okwukwe dịka ihe ndị kwere ekwe na-ekwere, ọ bụghị naanị omume mmadụ nke ikwere.
- source_word: τῆς καλῆς διδασκαλίας
  choice: nke ezi nkuzi ahụ
  rationale: “Ezi nkuzi” bụ Igbo doro anya nke na-echekwa ma okwu maka nkuzi ma nkọwa καλῆς.
- source_word: ᾗ παρηκολούθηκας
  choice: ahụ ị gbasoro
  rationale: Ọ na-ejikọ nkebi ahụ n’ụzọ kacha nso na “ezi nkuzi,” ma “ị gbasoro” na-ahapụ ma ịmụta nke ọma ma ịnọgide na ya ka ha nwee ike ịdị n’echiche ahụ.
theological_decisions:
- issue: Ntụgharị Χριστός
  choice: Mezaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: A họọrọ “Mezaịa” iji mee ka ihe utu aha ahụ pụtara pụta ìhè; a debere ụdị ọdịnala “Kraịst” n’okpuru peeji.
- issue: Ndị τοῖς ἀδελφοῖς na-ezo aka na ha
  choice: ụmụnna
  alternative: ụmụnna nwoke; ụmụnna nwoke na nwanyị
  rationale: “Ụmụnna” na-asụ Igbo nke ọma dịka okwu a na-akpọ ndị otu okwukwe. Ihe odide Grik bụ ụdị oke, ma n’ọnọdụ Ndị Kraịst ọ pụrụ ịgụnye ndị nwanyị; nkọwa na-edobe esemokwu ahụ.
- issue: Ihe τῆς πίστεως pụtara
  choice: okwukwe ahụ
  alternative: okwukwe; ikwesị ntụkwasị obi
  rationale: Mkpụrụokwu njirimara na njikọ ya na “nkuzi” na-eme ka ọ yie ka ọ na-ezo aka n’ihe okwukwe Ndị Kraịst nwere, ma a naghị ezobe ụzọ ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta mee ihe. A hapụrụ ihe atụ nke “idobe n’ihu” na “ịzụ” ka onyonyo okwu Grik ghara ịla n’iyi; a zere ịkpọ διάκονος ọkwa chọọchị pụrụ iche.
