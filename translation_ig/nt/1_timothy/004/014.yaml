language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: ig
  text: Elegharala onyinye ahụ dị n’ime gị anya, nke e nyere gị site n’amụma[a], ya na ibikwasị aka nke òtù ndị okenye n’ahụ gị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’okwu amụma.” Nkebiokwu ahụ nwere ike ịpụta na amụma so n’inye onyinye ahụ mee ma ọ bụ na ọ bụ ụzọ e si nye ya.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a pụtara òtù ndị okenye; a pụkwara ịsụgharị ya “ndị okenye” ma ọ bụ “ọgbakọ ndị okenye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμέλει
  choice: Elegharala
  rationale: Ọ na-egosi iwu ka a ghara ileghara ihe e nyere mmadụ anya ma ọ bụ hapụ ilekọta ya; ụdị a bụ Igbo doro anya ma na-egosi mmachibido na-aga n’ihu.
- source_word: χάρισμα
  choice: onyinye amara
  rationale: Ọ na-egosi onyinye e nyere site n’amara. Nke a na-eme ka echiche amara dị na okwu Grik pụta ìhè n’etinyeghị nkọwa pụrụ iche dịka ‘onyinye ime mmụọ.’
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: onyinye amara ahụ dị n’ime gị
  rationale: Ọ na-echekwa otú okwu Grik si kwuo na onyinye ahụ dị ‘n’ime’ Timoti, kama ịsụgharị ya naanị dịka ihe o nwere.
- source_word: ἐδόθη
  choice: e nyere
  rationale: Ọ na-echekwa olu nnara nke Grik ma ghara ịkpọ onye nyere ya aha, ebe ederede ahụ ekwughị ya kpọmkwem.
- source_word: διὰ προφητείας
  choice: site n’amụma
  rationale: ‘Site na’ na-egosi ụzọ ma ọ bụ ihe e ji nye onyinye ahụ, ma na-ahapụ ohere ma amụma ahụ so ya mee ma ọ bụ bụrụ ụzọ e si nye ya.
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: mgbe ... bikwasịrị ... aka
  rationale: Nke a bụ ụzọ Igbo si ekwu omume ibikwasị mmadụ aka n’ụzọ okike; ‘mgbe’ na-egosi na omume ahụ so n’inye onyinye ahụ mee, na-enweghị ịkọwa mmekọrịta ya karịa ihe Grik kwuru.
- source_word: πρεσβυτερίου
  choice: ndị okenye
  rationale: Okwu ahụ na-ezo aka n’òtù ndị okenye, ọ bụghị otu okenye. Igbo a doro ndị nkịtị anya ma zere okwu ụka nwere ibu nkọwa nke otu ụka pụrụ iche.
theological_decisions:
- issue: Ma a ga-akọwa χάρισμα kpọmkwem dịka onyinye ime mmụọ ma ọ bụ nke ije ozi
  choice: onyinye amara
  alternative: onyinye ime mmụọ
  rationale: Ebe ọnọdụ okwu nwere ike ịpụta onyinye maka ije ozi, Grik anaghị etinye adjective pụtara ‘ime mmụọ.’ ‘Onyinye amara’ na-echekwa njikọ ya na amara ma ghara imechi nkọwa ya.
- issue: Ụzọ e si ghọta ọrụ amụma n’inye onyinye ahụ
  choice: site n’amụma
  alternative: site n’okwu amụma
  rationale: διά na genitive nwere ike igosi ụzọ e si mee ihe, ma ihe e dere anaghị edo anya kpamkpam ma amụma ahụ bụ ụzọ e si nye onyinye ahụ ka ọ bụ okwu so n’emume ahụ. A hapụrụ esemokwu a ka ọ dị, tinyekwa ihe odide ala peeji.
- issue: Otu a ga-esi sụgharị πρεσβυτέριον n’etinyeghị usoro ọchịchị ụka e mechara guzobe
  choice: ndị okenye
  alternative: òtù ndị okenye
  rationale: Ọ na-egosi na ọtụtụ ndị okenye sonyere n’ibikwasị aka, ma ọ naghị ebubata aha ma ọ bụ usoro nke otu ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘onyinye amara’ iji gosipụta χάρισμα n’enweghị ịmanye nkọwa otu ụka; e mezigharịrị ahịrịokwu ibikwasị aka ka ọ daa ka Igbo nkịtị. Akara [a] na [b] dị n’ederede isi ma kwekọọ na ihe odide ala peeji.
