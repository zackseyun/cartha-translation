  to: Elegharala onyinye ahụ dị n’ime gị anya, nke e nyere gị site n’amụma[a], ya na ibikwasị aka nke òtù ndị okenye n’ahụ gị[b].
  rationale: E dozigharịrị ederede isi ka ọ ghara itinye ‘amara’ nke Grik ekwughị kpọmkwem, ka μετά ghara ịbụ “mgbe,” nakwa ka πρεσβυτέριον nọgide bụrụ otu òtù ndị okenye. E debeghị nkọwa ọ bụla nke ga-ekpebi ma amụma ahụ bụ ụzọ e si nye onyinye ahụ ma ọ bụ okwu so n’emume ahụ.
