translation:
  language: ig
  text: N’ihi na a na-edo ya nsọ site n’okwu Chineke na ekpere[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a na-eme ya nsọ,” ma ọ bụ, “a na-edobe ya iche.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “arịrịọ,” ma ọ bụ, “ekpere ịrịọchitere mmadụ arịrịọ,” n’ọnọdụ “ekpere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: a na-edo ya nsọ
  rationale: Okwu a bụ ngwaa dị n’ụdị ugbu a, nke onye ọzọ na-eme n’ahụ ihe a na-ekwu maka ya; “a na-edo ya nsọ” na-echekwa echiche ahụ ma na-ezo aka n’ihe oriri a kpọrọ aha n’amaokwu ndị bu ụzọ.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara okwu e kwuru n’amaokwu bu ụzọ; “n’ihi na” bụ ụzọ doro anya ma bụrụkwa nke nkịtị n’Igbo.
- source_word: διὰ
  choice: a na-esite ... edo
  rationale: Ebe διά ji genitive soro, ọ na-egosi ụzọ ma ọ bụ ihe e ji eme ihe; nhazi “a na-esite ... edo” na-egosipụta nke a n’Igbo dị mma.
- source_word: λόγου θεοῦ
  choice: okwu Chineke
  rationale: Nsụgharị a na-echekwa njikọ genitive ahụ, ma hapụkwa ihe “okwu Chineke” pụtara kpọmkwem ka ihe gbara amaokwu ahụ gburugburu kọwaa ya.
- source_word: ἐντεύξεως
  choice: ekpere
  rationale: “Ekpere” bụ okwu sara mbara ma kwekọọ n’ọnọdụ a nke ịnata ihe oriri site n’inye ekele; nkọwa ala peeji na-echekwa echiche ndị dị warara nke arịrịọ ma ọ bụ ịrịọchitere onye ọzọ arịrịọ.
theological_decisions:
- issue: Ihe okwu ido nsọ na-ezo aka na ya n’ebe a
  choice: E chekwara asụsụ nke ido ihe nsọ, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ihe a na-ekwu maka ya bụ ihe oriri a na-anabata iji ya.
  alternative: A pụrụ ịghọta okwu ahụ n’ụzọ sara mbara dịka ime ihe ka ọ dị nsọ n’echiche okpukpe.
  rationale: Amaokwu 3–4 na-ekwu maka ihe oriri a na-anata site n’inye ekele. Nsụgharị a anaghị etinye n’amaokwu ahụ echiche gbasara ime ka omume mmadụ dị ọcha, nzọpụta, ma ọ bụ ozizi sakrament nke okwu Grik ahụ n’onwe ya na-ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. A họọrọ nhazi “a na-esite ... edo ya nsọ” ka ọ chekwaa ụdị passive na ụzọ e si eme ihe n’ederede Grik, n’enweghị itinye nkọwa ozizi ọzọ.
