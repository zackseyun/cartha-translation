revisions:
- from: Ma Mmụọ Nsọ kwuru hoo haa na n’oge ndị ga-abịa, ụfọdụ ga-ahapụ okwukwe ahụ,[a] na-ege mmụọ ndị na-eduhie eduhie ntị, na-egekwa ozizi ndị mmụọ ọjọọ ntị.[b]
  to: Ma Mmụọ Nsọ na-ekwu hoo haa na n’oge ndị ga-abịa, ụfọdụ ga-ahapụ okwukwe ahụ,[a] na-ege mmụọ ndị na-eduhie ntị, na-egekwa ozizi ndị mmụọ ọjọọ ntị.[b]
  rationale: A gbanwere naanị «kwuru» ka ọ bụrụ «na-ekwu» iji soro oge ugbu a nke λέγει, ma wepụ nkwughachi na-adịghị eke na «na-eduhie eduhie». E debere «Ma» maka δέ, «n’oge ndị ga-abịa» maka ἐν ὑστέροις καιροῖς, na ambiguity nke διδασκαλίαις δαιμονίων site n’ederede isi na nkọwa ala.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Nsụgharị ahụ na-ebufe isi echiche nke Grik nke ọma: Mmụọ Nsọ na-ekwu n''ụzọ doro anya, ụfọdụ ga-ahapụ okwukwe ahụ, ma ha ga-atụkwasị uche n’mmụọ nduhie na ozizi ndị mmụọ ọjọọ. Otú ọ dị, «kwuru» bụ oge gara aga, ebe λέγει bụ oge ugbu a; «na-ekwu» ka kwekọrọ na isi mmalite.'
  naturalness: «Hoo haa» bụ okwu Igbo dị ndụ ma dabara na ῥητῶς. «Mmụọ ndị na-eduhie eduhie» adịghị eke nke ọma n’ebe a n’ihi nkwughachi ahụ; «mmụọ ndị na-eduhie» dị mfe ma na-egosi ike adjectival/agentive nke πλάνοις. Nhazi «na-ege ... ntị, na-egekwa ... ntị» bụ nke doro anya ma kwe omume n’Igbo.
  terminology: «Mmụọ Nsọ», «okwukwe ahụ», na «mmụọ ọjọọ» dabara na Standard Igbo na ndekọ nsọpụrụ nke akwụkwọ ozi a. «Ozizi ndị mmụọ ọjọọ» na-edobe genitive ahụ n’enweghị ikpebi n’ụzọ siri ike ma ozizi ahụ sitere n’aka ha ma ọ bụ jikọtara ha.
  issues:
  - severity: medium
    issue: Oge ngwaa na «kwuru»
    rationale: λέγει bụ present indicative. N’ihi ya, «na-ekwu hoo haa» na-echekwa oge na ike okwu amụma ahụ karịa «kwuru hoo haa».
  - severity: low
    issue: Nkwughachi na «mmụọ ndị na-eduhie eduhie»
    rationale: Nkwughachi a nwere ike ịda ka ọ bụghị Standard Igbo nke eke. «Mmụọ ndị na-eduhie» na-enye echiche ahụ n’enweghị mfu pụtara.
