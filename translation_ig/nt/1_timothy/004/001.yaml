id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: ig
  text: Ma Mmụọ Nsọ na-ekwu hoo haa na n’oge ndị ga-abịa, ụfọdụ ga-ahapụ okwukwe ahụ,[a] na-ege mmụọ ndị na-eduhie ntị, na-egekwa ozizi ndị mmụọ ọjọọ ntị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-adapụ n’okwukwe ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ya dị ka “ozizi sitere n’aka mmụọ ọjọọ.”
    reason: genitive_clarification
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: Mmụọ Nsọ
  rationale: N’ọnọdụ amụma a na akwụkwọ Pọl, okwu a kacha yie ka ọ na-ezo aka na Mmụọ Nsọ, ọ bụghị mmụọ mmadụ ma ọ bụ mmụọ n’ozuzu.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi ntụgharị dị nro n’echiche; “Ma” na-ejigide njikọ ahụ n’Igbo n’enweghị ime ka ọdịiche ahụ sie ike karịa isi mmalite.
- source_word: ῥητῶς λέγει
  choice: kwuru hoo haa
  rationale: Nke a na-egosi na Mmụọ ahụ na-ekwu okwu n’ụzọ doro anya nke na-enweghị mgbagwoju anya; oge ugbu a nke Grik kwekọrọ n’ụzọ Igbo si eji “kwuru” ewebata ihe e kwuru nke ka na-emetụta ndị na-agụ ya.
- source_word: ἐν ὑστέροις καιροῖς
  choice: n’oge ndị ga-abịa
  rationale: Ọ na-ezo aka n’oge ndị na-esote, na-enweghị ime ya ka ọ bụrụ naanị okwu nkà mmụta banyere oge ikpeazụ.
- source_word: ἀποστήσονταί τινες τῆς πίστεως
  choice: ụfọdụ ga-ahapụ okwukwe ahụ
  rationale: “Ga-ahapụ” na-egosi ịpụ ma ọ bụ ịdapụ n’ihe a na-ekwere, ebe “okwukwe ahụ” na-egosi okwukwe Ndị Kraịst dị ka ihe a kwenyere.
- source_word: προσέχοντες
  choice: na-ege ... ntị
  rationale: 'Akụkụ okwu a na-egosi ụzọ ma ọ bụ ihe so mee ka ha hapụ okwukwe ahụ: ha na-etinye uche n’ihe mmụọ na ozizi ndị ahụ na-ekwu.'
- source_word: πνεύμασι πλάνοις
  choice: mmụọ ndị na-eduhie eduhie
  rationale: πλάνος nwere ike ịkọwa ndị na-eduhie ndị ọzọ; nkebi Igbo a bụ nke eke ma na-egosipụta ọrụ mmụọ ndị ahụ.
- source_word: διδασκαλίαις δαιμονίων
  choice: ozizi ndị mmụọ ọjọọ
  rationale: Nke a na-ahapụ njikọ genitive ahụ ka ọ gosi ozizi sitere n’aka mmụọ ọjọọ ma ọ bụ nke ha na-akwalite, n’ebughị nkọwa karịrị ederede.
theological_decisions:
- issue: Onye “Mmụọ” na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ amụma ma ọ bụ mmụọ mmadụ
  rationale: Isiokwu ahụ nwere artikel, ọnọdụ ya bụkwa okwu amụma n’akwụkwọ Pọl; ya mere, ọ kacha kwekọọ na Mmụọ Nsọ, n’agbanyeghị na ederede akọwaghị ụzọ e si nata okwu ahụ.
- issue: Ihe “okwukwe ahụ” pụtara
  choice: okwukwe Ndị Kraịst dị ka ihe a kwenyere
  alternative: ntụkwasị obi nke mmadụ n’onwe ya ma ọ bụ ikwesị ntụkwasị obi
  rationale: Artikel na ọnọdụ nke ozizi ụgha na-akwado nghọta nke okwukwe dị ka ọdịnaya nke nkwenkwe, ma nsụgharị ahụ anaghị etinye ozizi ụka ọ bụla banyere ndapụ n’okwukwe.
- issue: Njikọ dị n’etiti “ozizi” na “mmụọ ọjọọ”
  choice: ozizi ndị mmụọ ọjọọ
  alternative: ozizi gbasara mmụọ ọjọọ
  rationale: Ọnọdụ ahụ kacha akwado na mmụọ ọjọọ bụ isi iyi ma ọ bụ ndị na-akwalite ozizi ahụ, ọ bụghị na ha bụ naanị isiokwu ozizi ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Hoo haa” na-enye ike nke ῥητῶς n’asụsụ nkịtị; “mmụọ ndị na-eduhie eduhie” na-ezere okwu ochie ma na-edobe echiche nke aghụghọ. Akara nkọwa ala ala [a] na [b] pụtara n’ederede isi.
