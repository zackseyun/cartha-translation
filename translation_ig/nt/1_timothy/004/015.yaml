  text: ταῦτα μελέτα, ἐν τούτοις ἴσθι, ἵνα σου ἡ προκοπὴ φανερὰ ⸀ᾖ πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: ig
  text: Na-eme ihe ndị a; tinye onwe gị kpamkpam n’ime ha[a], ka ọganihu gị wee pụta ìhè nye mmadụ niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “dịrị n’ime ihe ndị a.” Nke a pụtara itinye onwe gị n’ime ha nke ukwuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’iwu Pọl nyere tupu amaokwu a; nsụgharị a doro anya ma dịkwa n’ụdị Igbo a na-asụ ugbu a.
- source_word: μελέτα
  choice: na-eme ... mgbe niile
  rationale: N’ebe a, ngwaa ahụ gụnyere itinye uche na ime ihe ndị ahụ n’ụzọ na-aga n’ihu, ọ bụghị naanị ịtụgharị uche n’ime obi.
- source_word: ἐν τούτοις ἴσθι
  choice: tinye onwe gị kpamkpam n’ime ha
  rationale: Okwu Grik pụtara n’ụzọ nkịtị ‘dịrị n’ime ihe ndị a,’ nke na-egosi isonye na ha nke ukwuu. Nsụgharị a na-eme ka ihe okwu ahụ pụtara doo onye Igbo anya, ebe nkọwa ala peeji na-echekwa ọdịdị okwu nkịtị ahụ.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Nke a na-egosipụta nzube ma ọ bụ ihe ga-esi n’ime ihe ahụ pụta n’ụzọ e ji ekwu Igbo nke ọma.
- source_word: σου
  choice: gị
  rationale: Ọ bụ nnọchiaha nke na-egosi na ọganihu ahụ bụ nke Timoti.
- source_word: ἡ προκοπή
  choice: ọganihu
  rationale: Okwu a na-ekpuchi ito eto na ịga n’ihu ma n’omume ma n’ozi, n’emeghị ka ọ bụrụ naanị otu n’ime ha.
- source_word: φανερὰ ᾖ
  choice: wee pụta ìhè
  rationale: Nke a na-egosi na ọganihu Timoti ga-abụ ihe ndị ọzọ pụrụ ịhụ ma ghọta nke ọma.
- source_word: πᾶσιν
  choice: nye mmadụ niile
  rationale: A gbakwụnyere ‘mmadụ’ iji mee ka ihe a na-ekwu doo anya n’Igbo; ọ na-ezo aka n’ebe mmadụ niile nọ n’uche.
theological_decisions:
- issue: Ókè ọganihu Timoti a na-ahụ anya
  choice: E debere ‘ọganihu’ ka ọ gụnye ito eto ya n’omume, nkuzi, na ọrụ e nyere ya.
  alternative: Ịkọwa ya naanị dị ka ito eto ime mmụọ, ma ọ bụ naanị dị ka ịka nka n’ozi.
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu metụtara nkuzi, omume, na itinye onwe ya n’ozi. Ya mere, e kwesịghị ime ka okwu ahụ dị warara karịa otú Grik si kwuo ya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E jiri ‘na-eme ... mgbe niile’ gosipụta omume na-aga n’ihu, jiri ‘tinye onwe gị kpamkpam’ mee ka akpaalaokwu Grik doo anya.
