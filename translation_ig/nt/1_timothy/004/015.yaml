- from: Na-eme ihe ndị a mgbe niile; tinye onwe gị kpamkpam n’ime ha[a], ka ọganihu gị wee pụta ìhè nye mmadụ niile.
  to: Na-eme ihe ndị a; tinye onwe gị kpamkpam n’ime ha[a], ka ọganihu gị wee pụta ìhè nye mmadụ niile.
  rationale: A single small adjustment removes an unwarranted temporal intensifier. The revised text otherwise preserves the Greek's broad exhortation to sustained engagement, the idiomatic depth of involvement, and the purpose that Timothy's progress become evident to all.
