  yaml_path: translation/nt/1_timothy/004/009.yaml
  text: The saying is trustworthy and worthy of full acceptance,[a]
translation:
  language: ig
  text: Okwu a kwesịrị ntụkwasị obi, kwesịkwa ka a nabata ya n'ụzọ zuru ezu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Okwu ahụ kwesịrị ntụkwasị obi,” ma ọ bụ “Nkwupụta a kwesịrị ntụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: kwesiri ntụkwasị obi
  rationale: N'ime usoro okwu πιστὸς ὁ λόγος, okwu a na-egosi na ihe e kwuru bụ nke a pụrụ ịtụkwasị obi; ntụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: ὁ λόγος
  choice: Okwu a
  rationale: N'ebe a, λόγος na-ezo aka n'otu okwu ma ọ bụ nkwupụta a kpọtụrụ aha, ọ bụghị ‘okwu’ n'echiche nkà mmụta okpukpe sara mbara.
- source_word: πάσης
  choice: n'ụzọ zuru ezu
  rationale: N'ime πάσης ἀποδοχῆς, okwu a na-enye echiche nke nnabata zuru oke, ya mere a sụgharịrị ya n'ụzọ na-ada ka Igbo e ji eme ihe ugbu a.
- source_word: ἀποδοχῆς
  choice: ka a nabata ya
  rationale: ἀποδοχή pụtara nnabata ma ọ bụ ịnabata ihe; usoro ngwaa a bụ nke doro anya ma bụrụkwa Igbo eke.
- source_word: ἄξιος
  choice: kwesịkwa ka
  rationale: ἄξιος tinyere genitive pụtara na ihe ahụ kwesịrị ma ọ bụ tozuru inweta ihe a kpọrọ aha; ‘kwesịkwa ka’ na-ebufe nke a nke ọma.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu Grik ahụ na nkwughachi nke ‘kwesiri/kwesịkwa’ iji gosipụta na okwu ahụ bụ ma nke a pụrụ ịtụkwasị obi ma nke kwesịrị nnabata zuru oke.
