  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: ig
  text: N’ihi na ihe ọ bụla Chineke kere dị mma[a], ọ dịghịkwa ihe a ga-ajụ, ma e jiri ekele nabata ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe e kere eke ọ bụla nke Chineke dị mma.” Okwu Grik κτίσμα nwere ike ịpụta “ihe e kere eke” ma ọ bụ, n’ụzọ sara mbara, “ihe e mepụtara.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ dịghị ihe a pụrụ ịjụ mgbe e jiri ekele nabata ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Njikọ a na-enye ihe mere okwu bu ya ụzọ ji bụrụ eziokwu; “N’ihi na” na-egosipụta ọrụ nkọwa ahụ n’Igbo n'ụzọ doro anya.
- source_word: πᾶν κτίσμα θεοῦ
  choice: ihe ọ bụla Chineke kere
  rationale: Nke a na-egosipụta πᾶν n’ụzọ nkesa, ma na-asụgharị κτίσμα dị ka ihe e kere eke n’enweghị ime ka ọ bụrụ naanị anụmanụ ma ọ bụ naanị nri.
- source_word: καλόν
  choice: dị mma
  rationale: “Dị mma” bụ okwu Igbo kwesịrị ekwesị nke na-echekwa echiche banyere ịdị mma nke ihe Chineke kere.
- source_word: οὐδὲν ἀπόβλητον
  choice: ọ dịghịkwa ihe a ga-ajụ
  rationale: Nke a na-echekwa nkwupụta zuru ezu nke negation ahụ na echiche nke ihe a na-ekwesịghị ịjụ ma ọ bụ tụfuo.
- source_word: μετὰ εὐχαριστίας
  choice: site n’inye ekele
  rationale: Okwu a bụ Igbo eke nke na-egosipụta na a na-anabata ihe ahụ n’ọnọdụ nke inye Chineke ekele.
- source_word: λαμβανόμενον
  choice: ma a nabata ya
  rationale: Present passive participle ahụ jikọtara ọnọdụ nnabata ya na inye ekele; “ma” na-enye conditional nuance n’enweghị ịgbakwunye nkọwa ọzọ.
theological_decisions:
- issue: Ókè κτίσμα gbasara nri na ihe ndị ọzọ e kere eke
  choice: ihe ọ bụla Chineke kere
  alternative: ihe e kere eke ọ bụla nke Chineke; nri niile Chineke kere
  rationale: Ihe gbara amaokwu ahụ gburugburu metụtara nri, ma okwu Grik ahụ sara mbara karịa nri naanị. Nsụgharị a na-echekwa obosara ya ma ghara ime ka ọ bụrụ naanị anụmanụ, naanị nri, ma ọ bụ eluigwe na ụwa dum dị ka otu ihe.
- issue: Ike ọnọdụ dị na λαμβανόμενον μετὰ εὐχαριστίας
  choice: ma a nabata ya site n’inye ekele
  alternative: mgbe a nabatara ya site n’inye ekele; ebe a na-anabata ya site n’inye ekele
  rationale: “Ma” na-egosipụta na nkwupụta banyere ịghara ịjụ ihe ahụ jikọrọ ya na iji ekele nabata ya, ma ọ naghị eme ka participle ahụ sie ike karịa ihe Grik kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ihe ọ bụla Chineke kere” bụ okwu eke karịa nominalization siri ike, ma ọ na-echekwa obosara κτίσμα. E tinyere akara amaokwu nta [a] na [b] kpọmkwem n’ederede.
