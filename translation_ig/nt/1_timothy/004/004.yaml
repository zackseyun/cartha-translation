  rationale: The revision retains the draft’s faithful broad rendering of κτίσμα and its conditional understanding of λαμβανόμενον, while using a more idiomatic Standard Igbo expression for receiving something with thanksgiving. The footnote is aligned with that construction. No disputed interpretive or doctrinal claim has been added.
