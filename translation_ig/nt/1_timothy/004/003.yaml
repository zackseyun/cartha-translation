    text: Ma ọ bụ, n’ụzọ na-esochi okwu Grik nso karị, “na-amachibido ịlụ di ma ọ bụ nwunye na izere ihe oriri.” Ederede isi na-eme ka o doo anya na ndị ozizi ụgha ahụ na-enye iwu ka a zere ihe oriri.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported “ụfọdụ” while preserving the plural reference to foods. It replaces the less natural appositional wording with a coordinated description of one group—believers who know the truth—and retains the contextually required sense that the teachers command abstinence. The footnote has been made more concise and its wording aligned with the revised main text.
