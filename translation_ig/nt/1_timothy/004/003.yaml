revisions:
- from: ndị na-amachibido mmadụ ịlụ di ma ọ bụ nwunye, na-enyekwa iwu ka a zere iri ụdị nri ụfọdụ Chineke kere ka ndị kwere ekwe, ndị bịakwara mara eziokwu ahụ, jiri ekele nara ha[a].
  to: ndị na-amachibido mmadụ ịlụ di ma ọ bụ nwunye, ma na-enye iwu ka a zere ihe oriri ndị Chineke kere ka ndị kwere ekwe ma marakwa eziokwu ahụ were ekele nata ha[a].
  rationale: The revision removes the unsupported “ụfọdụ” while preserving the plural reference to foods. It replaces the less natural appositional wording with a coordinated description of one group—believers who know the truth—and retains the contextually required sense that the teachers command abstinence. The footnote has been made more concise and its wording aligned with the revised main text.
