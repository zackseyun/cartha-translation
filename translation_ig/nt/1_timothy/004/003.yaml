id: 1TI.4.3
reference: 1 Timothy 4:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: ig
  text: ndị na-amachibido mmadụ ịlụ di ma ọ bụ nwunye, ma na-enye iwu ka a zere ihe oriri ndị Chineke kere ka ndị kwere ekwe ma marakwa eziokwu ahụ were ekele nata ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-esochi okwu Grik nso karị, “na-amachibido ịlụ di ma ọ bụ nwunye na izere ihe oriri.” Ederede isi na-eme ka o doo anya na ndị ozizi ụgha ahụ na-enye iwu ka a zere ihe oriri.
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: ndị na-amachibido
  rationale: Ọ bụ participle nọ ugbu a nke na-aga n’ihu n’ịkọwa ndị e kwuru okwu ha n’amaokwu bu ụzọ; “na-amachibido” na-egosi mmachibido iwu n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: γαμεῖν
  choice: mmadụ ịlụ di ma ọ bụ nwunye
  rationale: Nke a na-egosipụta ihe infinitive ahụ pụtara n’Igbo n’enweghị ịkpa ókè n’etiti nwoke na nwanyị; ọ bụ ịlụ di ma ọ bụ nwunye ka a na-amachibido.
- source_word: ἀπέχεσθαι
  choice: na-enyekwa iwu ka a zere iri
  rationale: Infinitive ahụ pụtara izere ihe; n’usoro okwu Grik a, a ghaghị ịghọta na ndị ozizi ụgha na-amanye ndị ọzọ izere nri. Nsụgharị a mere ike iwu ahụ pụta ìhè n’Igbo eke, ebe nkọwa ala peeji na-edebe ọdịdị okwu Grik kpọmkwem.
- source_word: βρωμάτων
  choice: ụdị nri ụfọdụ
  rationale: Aha ahụ dị n’ụbara ma na-ekwu banyere ihe oriri. “Ụdị nri ụfọdụ” na-eme ka o doo anya na ọ bụghị nri niile ka a na-ekwu, ma ọ naghị akọwapụta ụdị ndị ederede ahụ na-akpọghị aha.
- source_word: ἃ
  choice: nri ... ha
  rationale: Njikọ okwu Igbo na-eji “ha” laghachi n’ụdị nri ndị ahụ ma na-edebe njikọ relative pronoun nke Grik.
- source_word: ἔκτισεν
  choice: kere
  rationale: “Kere” na-edebe asụsụ banyere okike nke κτίζω, kama okwu sara mbara dịka “mere.”
- source_word: εἰς μετάλημψιν
  choice: ka ... nara ha
  rationale: Nke a na-egosi ebumnuche e ji kee nri ndị ahụ—ka a nata ha ma rie ha—n’asụsụ Igbo dị mfe.
- source_word: μετὰ εὐχαριστίας
  choice: jiri ekele
  rationale: Ọ na-edebe echiche nke inye Chineke ekele mgbe a na-anata nri ahụ.
- source_word: τοῖς πιστοῖς
  choice: ndị kwere ekwe
  rationale: N’ebe a πιστοῖς na-akọwa ndị kweere, ọ bụghị nanị ndị na-eguzosi ike n’ihe.
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: ndị bịakwara mara eziokwu ahụ
  rationale: Perfect participle ahụ na-egosi na ha bịara mata eziokwu ahụ ma nọgide na-ama ya; “bịakwara mara” na-eburu echiche mmalite na ọnọdụ si na ya pụta.
theological_decisions:
- issue: Ma τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν na-ekwu banyere otu ìgwè mmadụ ka ọ bụ ìgwè abụọ
  choice: 'Otu ìgwè a kọwara n’ụzọ abụọ: ndị kwere ekwe, ndị bịakwara mara eziokwu ahụ'
  alternative: 'Ìgwè abụọ: ndị kwere ekwe na ndị maara eziokwu ahụ'
  rationale: Otu article e ji jikọta nkọwa abụọ ahụ n’asụsụ Grik na-akwado nghọta na ha bụ otu ndị ahụ. Nsụgharị Igbo ji apposition mee ka nke a pụta ìhè n’etinyeghị klas abụọ ndị ederede anaghị achọ.
- issue: Ike iwu dị na ἀπέχεσθαι n’usoro okwu ahụ
  choice: Mee ka ọ pụta ìhè na ndị ozizi ahụ na-enye iwu ka a zere nri ụfọdụ
  alternative: 'Soro ọdịdị okwu ahụ kpọmkwem: “na-amachibido ... izere nri”'
  rationale: Ọdịdị Grik dị mkpụmkpụ ma nwee ike iyi ihe na-emegiderịta onwe ya ma a sụgharịa ya okwu n’okwu. Ihe gbara ya gburugburu na-egosi na ndị ahụ na-amanye mmadụ izere nri; nkọwa ala peeji na-echekwa ọdịdị literal ahụ na mgbagwoju anya ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ịlụ di ma ọ bụ nwunye” gụnyere nwoke na nwanyị n’enweghị asụsụ okpukpe pụrụ iche. Akara nkọwa ala peeji [a] dị n’ederede isi dịka achọrọ.
