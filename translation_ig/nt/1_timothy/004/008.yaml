id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: ig
  text: N’ihi na mmega ahụ[a] bara uru nwa oge[b], ma ibi ndụ n’ụzọ na-asọpụrụ Chineke bara uru n’ihe niile, ebe ọ bụ na o nwere nkwa maka ndụ dị ugbu a nakwa ndụ nke ga-abịa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọzụzụ anụ ahụ” ma ọ bụ “mmega anụ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “bara uru nanị n’ókè dị nta.” Okwu Grik ahụ nwere ike ịpụta obere oge ma ọ bụ obere oke.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ebe o nwere nkwa nke ndụ dị ugbu a na nke ga-abịa.”
    reason: literal_rendering
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: ịzụ anụ ahụ
  rationale: Nke a na-egosi ọzụzụ ma ọ bụ mmega a na-enye ahụ, ma ọ naghị eme ka okwu ahụ bụrụ naanị egwuregwu ndị na-eme egwuregwu.
- source_word: πρὸς ὀλίγον
  choice: ruo obere oge
  rationale: Nkebiokwu Grik a nwere ike ịpụta obere oge ma ọ bụ uru dị nta. Isi ederede họọrọ nghọta oge, ebe e debere nghọta nke oke uru n’ala peeji.
- source_word: ὠφέλιμος
  choice: bara uru
  rationale: Ọ bụ okwu Igbo doro anya ma kwekọọ n’ahịrịokwu abụọ ahụ n’enweghị echiche uru ego.
- source_word: εὐσέβεια
  choice: ibi ndụ n’ụzọ na-asọpụrụ Chineke
  rationale: Nke a na-egosipụta ndụ nke nsọpụrụ na nrubeisi chere ihu n’ebe Chineke nọ, n’asụsụ Igbo ndị mmadụ na-aghọta nke ọma.
- source_word: πρὸς πάντα
  choice: n’ihe niile
  rationale: Ọ na-echekwa obosara nke okwu Grik ahụ, ya bụ na uru ya metụtara akụkụ niile.
- source_word: ἐπαγγελίαν ἔχουσα
  choice: ebe ọ bụ na o nwere nkwa
  rationale: 'Ọ na-eme ka njikọ nkọwa dị na participle Grik doo anya: nkwa ahụ bụ ihe mere ụdị ndụ a ji baa uru n’ihe niile.'
- source_word: ζωῆς τῆς νῦν
  choice: ndụ dị ugbu a
  rationale: Nke a bụ ntụgharị Igbo dị mfe ma na-edobe ọdịiche ya na ndụ nke ga-abịa.
- source_word: τῆς μελλούσης
  choice: ndụ nke ga-abịa
  rationale: Ọ na-eme ka okwu ζωή e hapụrụ n’ahịrị Grik pụta ìhè n’Igbo ma chekwaa echiche nke ndụ na-abịa.
theological_decisions:
- issue: Oke uru ịzụ anụ ahụ nwere
  choice: Ịzụ anụ ahụ bara uru, ma uru ya bụ nke nwere oke ma e jiri ya tụnyere uru zuru ebe niile nke ndụ na-asọpụrụ Chineke.
  alternative: Ịzụ anụ ahụ bara uru nanị n’ókè dị nta, ọ bụghị naanị ruo obere oge.
  rationale: Ihe odide ahụ anaghị ekwu na ịzụ anụ ahụ bụ ihe ọjọọ ma ọ bụ ihe na-abaghị uru. A hapụrụ ọdịiche dị n’etiti uru nwere oke na uru gbasara ihe niile, ma e gosikwara nghọta ọzọ nke πρὸς ὀλίγον n’ala peeji.
- issue: Ihe nkwa ndụ ahụ metụtara
  choice: Ndụ na-asọpụrụ Chineke nwere nkwa gbasara ndụ ugbu a na ndụ nke ga-abịa.
  alternative: Nkebiokwu ahụ nwere ike ịsụgharị n’ụzọ nkịtị dịka ‘o nwere nkwa nke ndụ dị ugbu a na nke ga-abịa.’
  rationale: Ntụgharị ahụ anaghị akọwapụta n’ụzọ karịrị ihe Grik kwuru ụdị ngọzi a na-ekwe ná ndụ ugbu a; ya mere ọ na-echekwa esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ibi ndụ n’ụzọ na-asọpụrụ Chineke” kama otu aha okpukpe siri ike, ka εὐσέβεια gosipụta àgwà na omume ndụ chere ihu n’ebe Chineke nọ n’enweghị itinye ozizi otu ụka.
