id: 1TI.4.16
reference: 1 Timothy 4:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: ig
  text: Lezie onwe gị na ozizi ahụ anya nke ọma; nọgidesie ike n’ihe ndị a.[a] N’ihi na site n’ime nke a, ị ga-azọpụta ma onwe gị ma ndị na-ege gị ntị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọgide n’ime ha,” ma ọ bụ, “tachie obi n’ime ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ị ga-echekwa.” Okwu Grik a sụgharịrị “ị ga-azọpụta” pụrụ ịpụta ịzọpụta, ịnapụta, ma ọ bụ ichekwa, dabere n’ọnọdụ okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: Lezie ... anya nke ọma
  rationale: Okwu iwu a na-egosi ilezi anya nke na-aga n’ihu, ọ bụghị ile anya otu ntabi anya. Nkebiokwu a bụ Igbo doro anya ma na-egosipụta nlezianya siri ike.
- source_word: σεαυτῷ
  choice: onwe gị
  rationale: Ọ na-egosi na Timoti ga-elezi onwe ya anya; usoro a bụ nke e ji ekwu ya n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: τῇ διδασκαλίᾳ
  choice: ozizi ahụ
  rationale: διδασκαλία nwere ike ịpụta omume izi ihe ma ọ bụ ọdịnaya a na-akụzi. “Ozizi ahụ” na-edobe obosara a ma zere okwu ụka siri ike nghọta.
- source_word: ἐπίμενε
  choice: nọgidesie ike
  rationale: Okwu iwu a na-egosi ịnọgide na-eme ihe n’enweghị ndapụ; “nọgidesie ike” na-eweta ma nnọgide ma ntachi obi.
- source_word: αὐτοῖς
  choice: n’ihe ndị a
  rationale: Nnọchiaha ọtụtụ a na-alaghachi n’ihe ndị a kpọtụrụla—ilezi onwe ya na ozizi ahụ anya. “N’ihe ndị a” na-eme ka ntụaka ahụ doo anya.
- source_word: τοῦτο γὰρ ποιῶν
  choice: N’ihi na site n’ime nke a
  rationale: Nkebiokwu participle a na-egosi ụzọ ihe ga-esi mee; “site n’ime nke a” na-egosipụta nke ahụ n’Igbo dị ire.
- source_word: σώσεις
  choice: ị ga-azọpụta
  rationale: σῴζω pụtara ịzọpụta, ma ọnọdụ okwu nwere ike ịgụnye nzọpụta, nchebe, ma ọ bụ ime ka mmadụ gafee ihe n’udo. A hapụrụ okwu ahụ ka ọ nọgide nwee ibu nkà mmụta okpukpe ya.
- source_word: τοὺς ἀκούοντάς σου
  choice: ndị na-ege gị ntị
  rationale: Present participle a na-ezo aka ná ndị na-anọgide na-anụ ma na-ege ozizi Timoti ntị. Nke a bụ okwu Igbo nke oge a ma doo anya.
theological_decisions:
- issue: Ihe “ịzọpụta” pụtara n’ọdụmọdụ e nyere onye ndu ụka
  choice: E debere “ị ga-azọpụta” n’ederede bụ isi n’agbanyeghị na a kọwaghị ya dị ka naanị nzọpụta ebighị ebi ma ọ bụ naanị ichebe mmadụ.
  alternative: A pụrụ ịsụgharị ya “ị ga-echekwa” iji mesie nchebe ime mmụọ ma ọ bụ nke ndụ ike.
  rationale: Amaokwu ahụ jikọtara nnọgidesi ike Timoti n’ibi ndụ na n’ozizi ya na nzọpụta nke ya na nke ndị na-ege ya ntị. Nsụgharị ahụ ekwesịghị ime ka okwu ahụ ghọọ na mmadụ ji ọrụ nke aka ya nweta nzọpụta, ma o kwesịghịkwa iwepụ ịdị arọ nke σώσεις; ya mere, e debere esemokwu na obosara nke okwu Grik ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Ozizi” na-edobe ma omume izi ihe ma ọdịnaya a na-akụzi; “nọgidesie ike” na-egosipụta nnọgide nwere ntachi obi. E tinyere akara ndetu ala peeji ozugbo n’ebe okwu ha na-akọwa dị.
