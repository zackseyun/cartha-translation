review_pass:
  verdict: revise
  source_fidelity: The draft correctly recognizes the authoritative, continuing force of παραγγέλλω and the paired imperatives. However, its explicit repeated object “ha” (‘them’) is not expressed in the Greek, while the Greek demonstrative ταῦτα is the stated object/content for the commands. Rendering the first clause as ‘give them orders concerning these things’ slightly shifts the construction from commanding/instructing these matters to commanding people about them.
  naturalness: The draft is understandable, but finite progressive forms (‘Na-enye … na-akụzikwara’) are less direct than normal Igbo imperative forms in this concise apostolic command. ‘Nye iwu …, kụzikwaara …’ is natural, clear Standard Igbo.
  terminology: ‘Nye iwu’ preserves the directive force of παραγγέλλω. ‘Kụzikwaara ihe ndị a’ retains the second imperative and the plural referent without adding a recipient. The lexical-alternative note is retained and anchored to the term it qualifies.
  issues:
  - severity: medium
    issue: The draft adds ‘ha’ (‘them’) to both imperatives and changes the first construction to ‘give them orders concerning these things.’
    rationale: Although recipients are contextually implied, they are not supplied in the Greek verse. The explicit ταῦτα more directly denotes the matters being commanded/taught; avoiding the added pronoun better preserves the concise source construction.
  - severity: low
    issue: The main text uses progressive finite forms rather than direct imperative forms.
    rationale: The Greek present imperatives can imply ongoing action, but Igbo direct imperatives are more idiomatic here; ongoing force need not be overtly grammaticalized.
  revised_text: Nye iwu[a] banyere ihe ndị a, kụzikwaara ihe ndị a.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Nye ntụziaka banyere ihe ndị a.”
    reason: lexical_alternative
