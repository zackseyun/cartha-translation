id: 1TI.4.11
reference: 1 Timothy 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παράγγελλε ταῦτα καὶ δίδασκε.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: ig
  text: Nye iwu[a] banyere ihe ndị a, kụzikwaara ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nye ntụziaka banyere ihe ndị a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παράγγελλε
  choice: Na-enye ha iwu
  rationale: Okwu iwu a dị n'ụdị na-egosi omume a ga na-eme n'ihu; ntụgharị a na-echekwa ike nke inye ndị ọzọ iwu ma na-ada nke ọma n'Igbo.
- source_word: ταῦτα
  choice: banyere ihe ndị a / ihe ndị a
  rationale: Nnọchiaha ngosi a dị n'ụdị ọtụtụ ma na-ezo aka n'ozizi na ntụziaka ndị bu ụzọ; e mere ka ọ pụta ìhè n'ahịrịokwu abụọ maka nghọta doro anya.
- source_word: καὶ
  choice: na-akụzikwara
  rationale: Mgbakwunye '-kwa-' na-ejikọta iwu nke abụọ na nke mbụ n'ụzọ Igbo dị mma, kwekọrọ na καὶ.
- source_word: δίδασκε
  choice: na-akụzikwara ha
  rationale: Ọ bụkwa iwu dị n'ụdị na-egosi omume na-aga n'ihu. 'Na-akụzikwara ha' na-egosi na Timoti ga na-ezi ndị ahụ ihe ndị a mgbe niile.
theological_decisions:
- issue: Ikike nlekọta ọgbakọ dị na παραγγέλλω
  choice: Na-enye ha iwu
  alternative: Na-enye ha ntụziaka
  rationale: A họọrọ okwu nwere ike nke inye iwu ka e wee ghara ime ka παραγγέλλω bụrụ naanị ndụmọdụ, ma etinyeghị echiche ọzọ banyere ọchịchị ụka nke okwu Grik ahụ na-ekwughị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. Usoro 'na-enye ... na-akụzikwara' na-egosipụta iwu ndị a ga na-eme mgbe niile; 'ha' na-eme ka ndị a na-enye iwu ma na-akụziri doo anya n'Igbo.
