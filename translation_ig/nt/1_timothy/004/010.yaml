id: 1TI.4.10
reference: 1 Timothy 4:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: ig
  text: Ọ bụkwa n’ihi nke a ka anyị na-adọgbu onwe anyị n’ọrụ, a na-akparịkwa anyị[a], n’ihi na anyị etinyela olileanya anyị n’ebe Chineke dị ndụ nọ[b], onye bụ Onye Nzọpụta mmadụ niile, karịsịa ndị kwere ekwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị na-adọgbu onwe anyị n’ọrụ, a na-ekwujọkwa anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị edoziela olileanya anyị n’ebe Chineke dị ndụ nọ.”
    reason: lexical_alternative
  - marker: c
    text: E sụgharịrị okwu ahụ bụ “Onye Nzọpụta mmadụ niile, karịsịa ndị kwere ekwe” dịka e dere ya. Ndị nkọwa nwere echiche dị iche iche ma “Onye Nzọpụta” n’ebe a ọ na-emesi nlekọta Chineke nke na-echekwa mmadụ niile ike, ma ọ bụ ndokwa nzọpụta ya maka mmadụ niile, ma ọ bụ nzọpụta a na-etinye n’ọrụ karịsịa n’ebe ndị kwere ekwe nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: n’ihi nke a
  rationale: Ọ na-ezo aka n’ihe e kwuru n’amaokwu bu ụzọ dị ka ihe mere ha ji agba mbọ; nke a bụkwa ụzọ Igbo doro anya ma dị mfe isi kwuo ya.
- source_word: γὰρ
  choice: Ọ bụkwa ... ka
  rationale: Usoro a na-egosi na ahịrịokwu ahụ na-akọwa ihe bu ya ụzọ, ma na-ada nke ọma n’Igbo.
- source_word: κοπιῶμεν
  choice: anyị na-adọgbu onwe anyị n’ọrụ
  rationale: Ọ na-egosi ọrụ siri ike na-agwụ ike, ọ bụghị nanị ịrụ ọrụ nkịtị.
- source_word: ὀνειδιζόμεθα
  choice: a na-ekwukwa anyị ọjọọ
  rationale: Ọ na-egosi mkparị na okwu ihere a na-ekwu megide mmadụ; e debere ya n’ụdị nnara dịka Grik si dị.
- source_word: ἠλπίκαμεν ἐπὶ
  choice: anyị etinyela olileanya anyị na
  rationale: Ụdị a na-egosi mkpebi e mere nke mmetụta ya ka na-adịgide, dịka perfect tense nke Grik si gosi.
- source_word: θεῷ ζῶντι
  choice: Chineke dị ndụ
  rationale: Nke a bụ okwu Baịbụl a maara nke ọma, ọ na-esokwa usoro okwu Igbo eke.
- source_word: σωτὴρ
  choice: Onye Nzọpụta
  rationale: Ọ na-echekwa ịdị arọ nke okwu ahụ n’ihe gbasara nzọpụta, na-enweghị imechi ohere nkọwa ya dịka onye na-anapụta ma ọ bụ na-echekwa.
- source_word: πάντων ἀνθρώπων
  choice: mmadụ niile
  rationale: Ọ na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ndị nwoke.
- source_word: μάλιστα
  choice: karịsịa
  rationale: Ọ na-echekwa ọdịiche dị n’etiti ‘mmadụ niile’ na ọnọdụ pụrụ iche nke ‘ndị kwere ekwe’ n’emeghị ka otu akụkụ kpochapụ nke ọzọ.
- source_word: πιστῶν
  choice: ndị kwere ekwe
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ụmụ mmadụ nwere okwukwe; nke a bụ okwu Igbo doro anya na nke a na-ejikarị eme ihe.
theological_decisions:
- issue: Ihe ‘Onye Nzọpụta mmadụ niile, karịsịa ndị kwere ekwe’ pụtara
  choice: E debere okwu sara mbara ‘mmadụ niile’ na okwu na-akọwapụta ‘karịsịa ndị kwere ekwe’ otu ha si dị n’isi mmalite.
  alternative: A pụrụ ịkọwa ‘Onye Nzọpụta’ dịka onye na-echekwa mmadụ niile ma na-azọpụta ndị kwere ekwe n’ụzọ mgbapụta; ma ọ bụ dịka nzọpụta e nyere mmadụ niile; ma ọ bụ kọwaa ‘mmadụ niile’ dịka ụdị mmadụ niile.
  rationale: Grik n’onwe ya jikọtara ịdị gbasara mmadụ niile na ọnọdụ pụrụ iche nke ndị kwere ekwe. Nsụgharị ahụ ekwesịghị idozi esemokwu nkà mmụta okpukpe a maka otu echiche okpukpe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-adọgbu onwe anyị n’ọrụ’ na-ebute ike κοπιάω n’ụzọ eke; ‘Onye Nzọpụta’ na-echekwa okwu nkà mmụta okpukpe ahụ. E tinyere akara ndetu ala peeji niile n’ahịrịokwu bụ isi.
