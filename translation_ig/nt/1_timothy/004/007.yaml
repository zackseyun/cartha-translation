- from: Ma jụ akụkọ ifo ndị na-adịghị nsọ, ndị yiri akụkọ ụmụanyị meworo agadi na-akọ[a]; kama zụọ onwe gị ka i bie ndụ nke ịsọpụrụ Chineke.
  to: Ma jụ akụkọ ifo ndị na-adịghị nsọ, ndị e ji mara ụmụ nwanyị meworo agadi; ma zụọ onwe gị n’ịsọpụrụ Chineke.[a]
  rationale: The revision corrects the syntax and source relationship of γραώδεις μύθους, uses standard orthography, and replaces an unnatural footnote alternative with an explanation of the Greek phrase’s literal wording and pejorative force. It retains the commands, contrast, athletic-training imagery, and God-oriented sense of εὐσέβεια.
