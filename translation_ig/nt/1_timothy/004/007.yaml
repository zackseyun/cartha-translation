  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: ig
  text: Ma jụ akụkọ ifo ndị na-adịghị nsọ, ndị e ji mara ụmụ nwanyị meworo agadi; ma zụọ onwe gị n’ịsọpụrụ Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, Grik kwuru, “akụkọ ifo ndị e ji mara ụmụ nwanyị meworo agadi.” Nke a bụ okwu nlelị; ọ naghị ekwu banyere ụmụ nwanyị meworo agadi nile.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: ndị na-adịghị nsọ
  rationale: Nke a na-egosipụta ọdịiche dị n'etiti ihe dị nsọ na ihe a na-ewere dị ka ihe nkịtị ma ọ bụ nke na-adịghị asọpụrụ Chineke, n'ebughị ụzọ mee ka ọ bụrụ naanị enweghị okwukwe.
- source_word: γραώδεις
  choice: ndị yiri akụkọ ụmụanyị meworo agadi na-akọ
  rationale: Nke a na-edobe ihe oyiyi kpọmkwem nke okwu Grik, nke pụtara ihe e ji mara ụmụanyị meworo agadi, tinyere ụda nlelị ya; e tinyere nkọwa ọzọ n'ala peeji.
- source_word: μύθους
  choice: akụkọ ifo
  rationale: “Akụkọ ifo” bụ okwu Igbo doro anya maka akụkọ e chepụtara echepụta ma ọ bụ akụkọ enweghị ntọala, ọ dabara n'ọnọdụ a.
- source_word: παραιτοῦ
  choice: jụ
  rationale: Iwu a gwara Timoti ka ọ jụ ma ghara ịnabata akụkọ ndị ahụ; “jụ” dị nkenke ma sie ike.
- source_word: γύμναζε
  choice: zụọn onwe gị
  rationale: Okwu Grik nwere ihe oyiyi nke ọzụzụ ahụ; “zụọn onwe gị” na-ebufe echiche nke omume a na-eme ugboro ugboro iji ruo otu ebumnuche.
- source_word: σεαυτόν
  choice: onwe gị
  rationale: A na-edobe nnọchiaha nlaghachi azụ nke na-egosi na Timoti ga-etinye onwe ya n'ọzụzụ ahụ.
- source_word: πρὸς εὐσέβειαν
  choice: ka i bie ndụ nke ịsọpụrụ Chineke
  rationale: πρός na-egosi ebumnuche, ebe εὐσέβεια n'ebe a bụ ndụ a tụkwasịrị n'ịtụ egwu na ịsọpụrụ Chineke; nkebi a na-ada nke ọma ma doo ndị na-agụ Igbo anya.
- source_word: δὲ ... δὲ
  choice: Ma ... kama
  rationale: “Ma” na-egosi ntụgharị site n'ihe bu ụzọ, “kama” na-egosikwa ọdịiche dị n'etiti ihe a ga-ajụ na ihe a ga-eme.
theological_decisions:
- issue: Nsụgharị nke okwu nlelị γραώδεις μύθους
  choice: ndị yiri akụkọ ụmụanyị meworo agadi na-akọ
  alternative: akụkọ ndị nwunye ochie na-akọ; akụkọ ifo nzuzu
  rationale: Nhọrọ a na-edobe kpọmkwem ihe oyiyi omenala na ụda nlelị dị n'okwu Grik kama ime ka ọ dị nro dịka naanị “nzuzu.” Ihe odide ala peeji kọwara na nke a bụ okwu nlelị ka a ghara iwere ya dịka nkwupụta banyere ụmụanyị niile meworo agadi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndụ nke ịsọpụrụ Chineke” kọwara εὐσέβεια n'ụzọ eke karịa otu aha nkịtị nwere ike ịdị mgbagwoju anya. Akara ala peeji [a] dị n'isiokwu ozugbo.
