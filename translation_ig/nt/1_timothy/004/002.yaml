translation:
  language: ig
  text: site n’ihu abụọ nke ndị na-ekwu ụgha, ndị e ji ígwè dị ọkụ kaa akara n’akọ na uche nke ha,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị e ji ígwè dị ọkụ kpọọ akọ na uche nke ha nkụ.” Okwu Grik ahụ pụrụ ịpụta na e tinyere akara n’akọ na uche ha, ma ọ bụ na e mere ka ọ ghara inwe mmetụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: site
  rationale: N’ebe a, ἐν na-egosi ụzọ ma ọ bụ ihe e ji mee omume ahụ; “site” na-ejikọta amaokwu a n’ụzọ ebumpụta ụwa na ihe bu ya ụzọ.
- source_word: ὑποκρίσει
  choice: ihu abụọ
  rationale: “Ihu abụọ” bụ okwu Igbo doro ndị mmadụ anya nke na-egosi omume aghụghọ na ime ka à ga-asị na mmadụ bụ ihe ọ na-abụghị.
- source_word: ψευδολόγων
  choice: ndị na-ekwu okwu ụgha
  rationale: Nhọrọ a na-egosipụta kpọmkwem ndị okwu ụgha ji mara, ma mee ka njikọ genitive ya na “ihu abụọ” doo anya.
- source_word: κεκαυστηριασμένων
  choice: ndị e ji ígwè ọkụ gbaa ... ọkụ
  rationale: Nke a na-edebe ihe oyiyi Grik nke iji ígwè dị ọkụ gbaa mmadụ akara ma ọ bụ kụọ anụ ahụ ọkụ, na-enweghị ikpebi ma isi echiche ya bụ akara e tinyere ma ọ bụ enweghịzi mmetụta.
- source_word: τὴν ἰδίαν συνείδησιν
  choice: akọ na uche nke ha
  rationale: “Akọ na uche” bụ okwu Igbo a na-ejikarị akọwa συνείδησις; “nke ha” na-echekwa ike nke ἰδίαν, ya bụ, nke ha onwe ha.
theological_decisions:
- issue: Ihe atụ dị na κεκαυστηριασμένων
  choice: E debere ihe oyiyi nke iji ígwè ọkụ gbaa akọ na uche ọkụ.
  alternative: Ịsị na akọ na uche ha “anaghịzi enwe mmetụta” ma ọ bụ na e “tinyere ya akara.”
  rationale: Asụsụ Grik nwere ike ịpụta ịgba akara ọkụ ma ọ bụ ịkụ ọkụ nke na-eme ka anụ ahụ gharazie inwe mmetụta. Nsụgharị bụ isi na-edebe esemokwu ahụ kama ịkọwa ya dịka ozizi banyere ọnọdụ ime mmụọ na-enweghị mgbanwe.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ihu abụọ” kama okwu mbinye dị ka “ihu abụọ/ịhypocrisy,” ebe “akọ na uche” na-edebe okwu okpukpe a maara nke ọma. Ihe odide a bụ nkebi ahịrịokwu na-aga n’ihu site n’amaokwu bu ya ụzọ, dị ka isi mmalite Grik.
