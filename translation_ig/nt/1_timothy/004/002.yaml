  rationale: The revision retains the instrumental sense of ἐν, the moral force of ὑποκρίσει, and the possessive emphasis in ‘akọ na uche nke ha.’ It replaces the unnatural repeated fire wording with a conventional branding image that is compatible with κεκαυστηριασμένων, while the footnote records the cauterization/insensibility possibility without turning the metaphor into a doctrinal conclusion.
