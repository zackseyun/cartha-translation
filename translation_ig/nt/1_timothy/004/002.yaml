review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly takes ἐν instrumentally (''site'') and preserves the genitive relation: the hypocrisy belongs to people characterized by lying. However, ''ndị e ji ígwè ọkụ gbaa akọ na uche nke ha ọkụ'' is awkward and overly repetitive in Igbo; it also presents the object simply as burned rather than preserving the passive participial image of a conscience branded/seared. A formulation with ''kaa akara'' better represents the possible branding sense while leaving the image open, as the source and audit trail require.'
  naturalness: ‘Site n’ihu abụọ’ and ‘ndị na-ekwu okwu ụgha’ are understandable, but ‘ndị na-ekwu ụgha’ is more idiomatic. The current wording for the final participial phrase is not natural Standard Igbo because ‘ígwè ọkụ’ plus ‘gbaa ... ọkụ’ redundantly repeats the fire image. ‘E ji ígwè dị ọkụ kaa akara n’akọ na uche nke ha’ is clear and dignified.
  terminology: ‘Ihu abụọ’ is an appropriate modern Standard Igbo equivalent for hypocrisy, and ‘akọ na uche’ is the established, suitable rendering of conscience. The revision retains both. ‘Ígwè dị ọkụ’ accurately conveys the branding/searing image without asserting a particular theological consequence.
  issues:
  - severity: medium
    issue: The rendering of κεκαυστηριασμένων is idiomatically strained and semantically imprecise.
    rationale: ‘Ndị e ji ígwè ọkụ gbaa akọ na uche nke ha ọkụ’ sounds like an action of burning the conscience and redundantly says both ‘hot iron’ and ‘burn with fire.’ The Greek perfect passive evokes an enduring state and may mean branded or cauterized. ‘E ji ígwè dị ọkụ kaa akara n’akọ na uche nke ha’ more naturally preserves the branding image; the footnote can retain the cauterization alternative.
  - severity: low
    issue: ‘Ndị na-ekwu okwu ụgha’ is less idiomatic than necessary.
    rationale: The Greek ψευδολόγων denotes liars/people who speak lies. ‘Ndị na-ekwu ụgha’ is a concise, natural Standard Igbo expression and maintains the characterization.
  revised_text: site n’ihu abụọ nke ndị na-ekwu ụgha, ndị e ji ígwè dị ọkụ kaa akara n’akọ na uche nke ha,[a]
