revisions:
- from: Ka e were ndị okenye na-eduzi nke ọma dị ka ndị kwesịrị nsọpụrụ okpukpu abụọ[a], karịsịa[b] ndị na-adọgbu onwe ha n’ọrụ ikwu okwu na izi ihe[c].
  to: Ka e were ndị okenye na-eduzi nke ọma dị ka ndị kwesịrị nsọpụrụ okpukpu abụọ[a], karịsịa[b] ndị na-adọgbu onwe ha n’ọrụ n’okwu na nkuzi[c].
  rationale: The revision corrects the misleading alternative in footnote a and renders ἐν λόγῳ more directly as “n’okwu,” without forcing it to mean preaching alone. It retains the source text’s ambiguity regarding the scope of “double honor” and the precise force of μάλιστα.
