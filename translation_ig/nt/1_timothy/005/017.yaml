id: 1TI.5.17
reference: 1 Timothy 5:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: ig
  text: Ka e were ndị okenye na-eduzi nke ọma dị ka ndị kwesịrị nsọpụrụ okpukpu abụọ[a], karịsịa[b] ndị na-adọgbu onwe ha n’ọrụ n’okwu na nkuzi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka e gụọ ha dịka ndị kwesịrị nsọpụrụ okpukpu abụọ.” Akpaokwu a nwere ike ịgụnye ma nkwanye ùgwù ma nkwado ihe onwunwe, karịsịa n’ihi amaokwu na-esonụ.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-aghọta “karịsịa” dịka “ya bụ,” nke ga-eme ka ndị okenye a na-ekwu maka ha bụrụ ndị na-arụsi ọrụ ike n’okwu na nkuzi.
    reason: alternative_reading
  - marker: c
    text: “N’okwu na nkuzi” yiri ka ọ na-ezo aka n’ozi e ji okwu eme, dịka ikwusa ozi na inye nkuzi.
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: ndị okenye
  rationale: N’akwụkwọ ozi ndị a, okwu a na-ezo aka ná ndị ndu a matara n’ọgbakọ, ọ bụghị naanị ndị nwoke merela agadi. “Ndị okenye” bụ okwu Igbo doro anya nke na-adịghị ebubata usoro ọchịchị ụka e mechara guzobe.
- source_word: καλῶς προεστῶτες
  choice: ndị ... na-eduzi nke ọma
  rationale: προΐστημι na-egosi idu ndú na ilekọta ndị ọzọ. “Na-eduzi nke ọma” na-echekwa ikike dị n’okwu ahụ ma na-ada ka Igbo nke oge a.
- source_word: διπλῆς τιμῆς
  choice: nsọpụrụ okpukpu abụọ
  rationale: 'Nsụgharị a na-echekwa ụdị okwu Grik ahụ na obosara ihe τιμή pụrụ ịpụta: ma nsọpụrụ ma nkwado ihe onwunwe, dịka amaokwu na-esonụ na-egosi.'
- source_word: ἀξιούσθωσαν
  choice: Ka e were ... dị ka ndị kwesịrị
  rationale: 'Nke a na-egosipụta iwu dị n’ụdị nnara: ọgbakọ ga-amata ma were ha dịka ndị kwesịrị nsọpụrụ ahụ.'
- source_word: μάλιστα
  choice: karịsịa
  rationale: “Karịsịa” na-enye otu ìgwè n’ime ndị okenye nkwusi ike pụrụ iche, n’emeghị ka o doo anya n’ụzọ a na-apụghị ịjụ ajụ na ọ pụtara “ya bụ.”
- source_word: κοπιῶντες
  choice: ndị na-adọgbu onwe ha n’ọrụ
  rationale: κοπιάω na-egosi ọrụ siri ike na mgbalị na-agwụ ike. Akpaokwu Igbo a na-ebupụta ịdị arọ nke mgbalị ahụ.
- source_word: ἐν λόγῳ
  choice: n’ọrụ ikwu okwu
  rationale: N’ebe a λόγος yiri ka ọ na-ezo aka n’ozi a na-eje site n’ikwu okwu, dị ka ikwusa ozi. “Ikwu okwu” na-echekwa obosara okwu Grik ahụ karịa ịkọwa ya nanị dị ka nkwusa.
- source_word: διδασκαλίᾳ
  choice: izi ihe
  rationale: “Izi ihe” bụ Igbo dị mfe ma kpọmkwem maka ọrụ inye ndị ọzọ nkuzi; ọ naghị eme ka okwu ahụ bụrụ naanị ozizi ndị e haziri n’usoro.
theological_decisions:
- issue: Ihe “nsọpụrụ okpukpu abụọ” pụtara banyere ndị ndu ọgbakọ
  choice: E debere “nsọpụrụ okpukpu abụọ” n’ahịrị bụ isi, na-akọwaghị ya dịka nkwanye ùgwù naanị ma ọ bụ ụgwọ ihe onwunwe naanị.
  alternative: nsọpụrụ pụrụ iche; nkwado ihe onwunwe okpukpu abụọ; nsọpụrụ gụnyere nkwado ihe onwunwe
  rationale: Amaokwu na-esonụ na-atụ aka na nkwado ihe onwunwe, ma τιμή nwekwara ike ịgụnye nkwanye ùgwù. Nsụgharị sara mbara na-echekwa nghọta abụọ ahụ.
- issue: Ike nke μάλιστα
  choice: A sụgharịrị ya “karịsịa.”
  alternative: ya bụ
  rationale: Nke a na-enye ndị na-arụsi ọrụ ike n’ikwu okwu na izi ihe nkwusi ike pụrụ iche, ma ọ naghị ekpebi ma okwu ahụ na-akọwa otu ìgwè n’ime ndị okenye ma ọ bụ ndị okenye niile e kwuru okwu ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “ndị okenye” dịka aha ndị ndu ọgbakọ a matara; a hapụrụ “nsọpụrụ okpukpu abụọ” n’obosara ya; a zere okwu ụka nke otu ọgbakọ pụrụ iji kwado usoro ọchịchị nke ya.
