  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: ig
  text: E bikwasịla onye ọ bụla aka ngwa ngwa[a], eketakwala òkè na mmehie nke ndị ọzọ; dobe onwe gị ọcha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, karịchaa n’ọnọdụ a, “Ahọpụtala ma ọ bụ enyela onye ọ bụla echichi ngwa ngwa.” N’asụsụ Grik, okwu ahụ n’ụzọ nkịtị bụ “ebikwasịla aka,” bụ́ akpaalaokwu a na-ejikarị eme ihe n’ịnye mmadụ ọrụ n’ozi ma ọ bụ n’ịkwado ya maka ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: Ebikwasịla ... aka
  rationale: Nke a na-edobe akpaalaokwu Grik nke pụtara n'ụzọ nkịtị ‘ibikwasị aka,’ n’emeghị ka ọ bụrụ naanị ịhọpụta ma ọ bụ ido echichi.
- source_word: ταχέως
  choice: ngwa ngwa
  rationale: N’ọnọdụ a, okwu ahụ na-adọ aka ná ntị megide ime ihe n’ọsọ na-enweghị nyocha zuru ezu; ‘ngwa ngwa’ bụ Igbo doro anya, ihe odide ala ala na-akọwakwa echiche nke ime ya tupu oge eruo.
- source_word: μηδενὶ
  choice: onye ọ bụla
  rationale: Mgbe e jikọtara ya na iwu na-ajụ ihe, ‘Ebikwasịla onye ọ bụla’ na-egosipụta oke zuru ụwa ọnụ nke okwu Grik.
- source_word: μηδὲ κοινώνει
  choice: eketakwala òkè ná
  rationale: Nke a na-egosi iso mee ihe ma ọ bụ ibu òkè n’ọrụ ọjọọ, na-enweghị ime ka ọ bụrụ naanị mkpakọrịta nkịtị.
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: mmehie ndị ọzọ
  rationale: Ọ na-egosi mmehie nke ndị ọzọ, ya bụ, mmehie na-abụghị nke onye a na-agwa okwu n’onwe ya.
- source_word: σεαυτὸν
  choice: onwe gị
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta nnọchiaha nlaghachi azụ nke onye a na-agwa okwu.
- source_word: ἁγνὸν
  choice: ọcha
  rationale: ‘Ọcha’ ebe a na-egosi ịdị ọcha n’omume n’ụzọ sara mbara; ọ naghị ekwe ka ihe ọ pụtara bụrụ naanị ịdị ọcha n’ihe gbasara mmekọahụ.
- source_word: τήρει
  choice: debe
  rationale: ‘Debe onwe gị ọcha’ bụ okwu Igbo dị eke ma na-egosi ịnọgide na-echekwa ọnọdụ ahụ.
theological_decisions:
- issue: Ihe ‘ibikwasị aka’ pụtara n’ọnọdụ a
  choice: E debere akpaalaokwu ahụ, ‘ibikwasị ... aka,’ n’amaokwu ahụ.
  alternative: ‘Ahọpụtala onye ọ bụla ngwa ngwa’ ma ọ bụ ‘Edola onye ọ bụla echichi ngwa ngwa.’
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu metụtara ndị okenye na ibu ọrụ ha, ya mere okwu ahụ nwere ike izo aka n’ịhọpụta, ido echichi, ma ọ bụ ịnakwere mmadụ maka ozi. Ma Grik n’onwe ya na-ekwu ‘ibikwasị aka,’ ya mere a hapụrụ nkọwa ya n’ụdị sara mbara ma kọwaa ihe o nwere ike ịpụta n’ihe odide ala ala.
- issue: Mmekọrịta dị n’etiti iwu abụọ ahụ
  choice: E sụgharịrị nkebi nke abụọ dịka ịdọ aka ná ntị ka mmadụ ghara iketa òkè ná mmehie ndị ọzọ, n’emeghị ka njikọ ya na ibikwasị aka bụrụ nke a kọwara kpọmkwem.
  alternative: Ikwu hoo haa na mmadụ na-eketa ikpe ọmụma site n’ido onye na-ekwesịghị ekwesị echichi ngwa ngwa, ma ọ bụ ile ya anya dịka ịdọ aka ná ntị izugbe na-enweghị njikọ na nkebi mbụ.
  rationale: Idobe nkebi abụọ ahụ n’akụkụ ibe ha na-egosi na ha nwere ike ịdị n’otu echiche, ma Grik akọwaghị kpọmkwem otú ha si jikọta. Nsụgharị ahụ na-echekwa ohere nkọwa a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere akpaalaokwu bụ isi iji zere ịmanye otu usoro ụka ma ọ bụ otu nkọwa n’ime amaokwu ahụ; ihe odide ala ala na-enye nkọwa ọnọdụ ya.
