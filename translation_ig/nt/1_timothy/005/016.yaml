id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: ig
  text: Ọ bụrụ na nwaanyị ọ bụla kwere ekwe nwere ụmụ nwanyị di ha nwụrụ[a], ka o nye ha nkwado, ka a ghara iboro ọgbakọ ahụ ibu, ka ọ wee nye ụmụ nwanyị ndị di ha nwụrụ n’ezie nkwado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie na-agụ, “ọ bụrụ na nwoke ma ọ bụ nwaanyị ọ bụla kwere ekwe nwere ụmụ nwanyị di ha nwụrụ,” ma ọ bụ, “ọ bụrụ na onye ọ bụla kwere ekwe nwere ụmụ nwanyị di ha nwụrụ.” Ọgụgụ ndị a na-agbasa ntụziaka ahụ karịa nwanyị kwere ekwe kpọmkwem.
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: nwaanyị ọ bụla kwere ekwe
  rationale: Ụdị πιστή bụ nke nwanyị, otu onye; ya mere nsụgharị a kọwara onye ahụ kpọmkwem dị ka nwaanyị kwere ekwe, ọ bụghị onye kwere ekwe n’ozuzu.
- source_word: χήρας
  choice: ụmụanyị di ha nwụrụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke a na-asụkarị iji kọwaa ụmụanyị di ha nwụrụ, karịsịa n’ọnọdụ enyemaka ihe onwunwe nke isiakwụkwọ a.
- source_word: ἐπαρκείτω / ἐπαρκέσῃ
  choice: na-egboro ha mkpa ha / nwee ike igboro ... mkpa ha
  rationale: ἐπαρκέω pụtara inye enyemaka zuru ezu. ‘Igboro mkpa’ na-egosipụta nkwado bara uru ma na-edobe otu echiche ahụ n’ebe abụọ ngwaa ahụ pụtara.
- source_word: βαρείσθω
  choice: ka a ghara ibunyere ... ibu
  rationale: Nke a na-edobe ihe atụ nke ibu dị na ngwaa Grik ma na-egosi ibu ọrụ nkwado nke nzukọ ahụ agaghị eburu.
- source_word: ἡ ἐκκλησία
  choice: nzukọ Kraịst
  rationale: N’ebe a, ἐκκλησία bụ ọgbakọ ndị kwere ekwe. ‘Nzukọ Kraịst’ doro ndị Igbo anya ma na-ezere nghọtahie na-ekwu naanị maka ụlọ ụka.
- source_word: ταῖς ὄντως χήραις
  choice: ụmụanyị ndị di ha nwụrụ n’ezie
  rationale: ‘N’ezie’ na-echekwa nkwusiri ike nke ὄντως na ụdị ụmụanyị di ha nwụrụ ndị isiakwụkwọ a kọwara dị ka ndị enweghị onye ọzọ ga-elekọta ha.
theological_decisions:
- issue: Okike onye a kpọrọ aha na nkebi mmeghe
  choice: nwaanyị ọ bụla kwere ekwe
  alternative: onye ọ bụla kwere ekwe; nwoke ma ọ bụ nwaanyị ọ bụla kwere ekwe
  rationale: Ihe odide SBLGNT e nyere nwere τις πιστή, nke bụ ụdị nwanyị, otu onye. Ya mere, isiokwu bụ nwaanyị kpọmkwem; a debere ọdịiche nke ụfọdụ akwụkwọ aka ochie n’ala peeji kama itinye ya n’ahịrị isi.
- issue: Ndị bụ ‘ụmụanyị di ha nwụrụ n’ezie’
  choice: e debere okwu ahụ n’enweghị ịgbakwunye nkọwa n’ahịrị isi
  alternative: ụmụanyị di ha nwụrụ ndị enweghị onye ga-elekọta ha
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-akọwa ụdị ahụ, ma okwu Grik n’onwe ya na-ekwu ‘n’ezie.’ Nsụgharị ahụ echekwala nkwusiri ike na esemokwu ahụ kama ịgbasa nkọwa n’ime amaokwu.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nzukọ Kraịst’ kọwaa ọgbakọ ndị kwere ekwe, e jikwa ‘igboro mkpa’ gosipụta nkwado zuru ezu n’ụzọ sitere n’okwu Grik.
