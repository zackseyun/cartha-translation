review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. The draft correctly retains the feminine singular subject in τις πιστή and correctly represents the purpose that the church's resources remain available for genuine widows. However, «ya na-egboro ha mkpa ha» is indicative rather than the imperative force of ἐπαρκείτω, «nzukọ Kraịst» adds «Kraịst,» which is not stated in ἡ ἐκκλησία, and «nwee ike» can introduce an unnecessary nuance of ability.
  naturalness: 'The revised wording uses idiomatic Standard Igbo: «ka o nye ha nkwado,» «ka a ghara iboro ọgbakọ ahụ ibu,» and «ụmụ nwanyị» (written as two words). It maintains a dignified contemporary register without overexplaining the category of true widows.'
  terminology: «nwaanyị ... kwere ekwe» accurately preserves the explicitly feminine believing subject. «ụmụ nwanyị di ha nwụrụ» is clear and natural for χήρας. «nye ... nkwado» conveys the practical support denoted by ἐπαρκέω consistently, while «n’ezie» preserves ὄντως without importing the contextual qualifications into the verse itself.
  issues:
  - severity: medium
    issue: The first support clause is rendered as an indicative statement.
    rationale: 'Greek ἐπαρκείτω is a present imperative: the believing woman is instructed to provide support. «ya na-egboro ha mkpa ha» means, in effect, “she is providing for them,” rather than “let her provide support for them.”'
  - severity: medium
    issue: «nzukọ Kraịst» adds a designation absent from the source.
    rationale: ἡ ἐκκλησία means “the church/congregation”; although the referent is Christian in context, «Kraịst» is not in this verse and should not be added to the translation.
  - severity: low
    issue: «nwee ike» adds an ability nuance.
    rationale: The ἵνα clause expresses purpose, not explicitly ability. A direct purpose rendering avoids this extra nuance.
  - severity: low
    issue: The compound noun is written «ụmụanyị».
    rationale: Standard orthography normally writes this expression as «ụmụ nwanyị».
  revised_text: Ọ bụrụ na nwaanyị ọ bụla kwere ekwe nwere ụmụ nwanyị di ha nwụrụ[a], ka o nye ha nkwado, ka a ghara iboro ọgbakọ ahụ ibu, ka ọ wee nye ụmụ nwanyị ndị di ha nwụrụ n’ezie nkwado.
  revised_footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie na-agụ, “ọ bụrụ na nwoke ma ọ bụ nwaanyị ọ bụla kwere ekwe nwere ụmụ nwanyị di ha nwụrụ,” ma ọ bụ, “ọ bụrụ na onye ọ bụla kwere ekwe nwere ụmụ nwanyị di ha nwụrụ.” Ọgụgụ ndị a na-agbasa ntụziaka ahụ karịa nwanyị kwere ekwe kpọmkwem.
    reason: textual_variant
  revision_rationale: The revision preserves the SBLGNT reading’s female singular subject, restores the imperative force of ἐπαρκείτω, removes the added word «Kraịst,» and renders the purpose clause directly. The textual-variant note remains anchored at the opening subject and describes the alternative readings without allowing them to replace the supplied critical text.
