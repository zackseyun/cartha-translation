revisions:
- from: Ọ bụrụ na nwaanyị ọ bụla kwere ekwe nwere ụmụanyị di ha nwụrụ[a], ya na-egboro ha mkpa ha, ka a ghara ibunyere nzukọ Kraịst ibu, ka o wee nwee ike igboro ụmụanyị ndị di ha nwụrụ n’ezie mkpa ha.
  to: Ọ bụrụ na nwaanyị ọ bụla kwere ekwe nwere ụmụ nwanyị di ha nwụrụ[a], ka o nye ha nkwado, ka a ghara iboro ọgbakọ ahụ ibu, ka ọ wee nye ụmụ nwanyị ndị di ha nwụrụ n’ezie nkwado.
  rationale: The revision preserves the SBLGNT reading’s female singular subject, restores the imperative force of ἐπαρκείτω, removes the added word «Kraịst,» and renders the purpose clause directly. The textual-variant note remains anchored at the opening subject and describes the alternative readings without allowing them to replace the supplied critical text.
