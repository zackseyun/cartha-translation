revisions:
- from: Sọpụrụ ụmụanyị di ha nwụrụ bụ ndị di ha nwụrụ n’ezie.[a]
  to: Sọpụrụ ụmụ nwanyị di ha nwụrụ, ndị n’ezie bụ ụmụ nwanyị di ha nwụrụ.[a]
  rationale: The revision corrects Standard Igbo word division and explicitly attaches n’ezie to the women’s status as widows, rather than to the fact of their husbands’ death. It preserves the deliberate repetition in the Greek and retains 'Sọpụrụ' as the broad main-text equivalent of τίμα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:43Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies χήρας as widows, τίμα as an imperative to honor, and ὄντως as a qualifier distinguishing those who are genuinely widows. However, placing n’ezie directly after di ha nwụrụ can be read as qualifying the husbands’ death ('whose husbands really died') rather than the women’s status as widows. The revision makes the scope explicit while retaining the Greek emphasis.
  naturalness: Ụmụanyị is not the preferred Standard Igbo orthography; ụmụ nwanyị should be written as two words. The revised wording is clear, idiomatic, and keeps the dignified biblical register.
  terminology: Sọpụrụ appropriately retains the broad sense of τιμάω. The alternative concerning practical help is suitably placed in a footnote and does not narrow the main text. 'Ụmụ nwanyị di ha nwụrụ' is a clear Standard Igbo designation for widows.
  issues:
  - severity: medium
    issue: Ambiguous placement of n’ezie
    rationale: 'In ''ụmụanyị di ha nwụrụ bụ ndị di ha nwụrụ n’ezie,'' n’ezie can be heard as modifying ''di ha nwụrụ'' rather than marking the distinction conveyed by ὄντως: those who genuinely qualify as widows.'
  - severity: low
    issue: Nonstandard word division
    rationale: Standard Igbo writes 'ụmụ nwanyị,' not 'ụmụanyị.' This occurs in the text and footnote.
  revised_text: Sọpụrụ ụmụ nwanyị di ha nwụrụ, ndị n’ezie bụ ụmụ nwanyị di ha nwụrụ.[a]
  revised_footnotes:
