  text: Honor widows who are truly widows[a].
translation:
  language: ig
  text: Sọpụrụ ụmụ nwanyị di ha nwụrụ, ndị n’ezie bụ ụmụ nwanyị di ha nwụrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nyere ụmụ nwanyị di ha nwụrụ, ndị n’ezie bụ ụmụ nwanyị di ha nwụrụ aka.” N’akụkụ a, “sọpụrụ” yiri ka ọ gụnyekwara ilekọta ha site n’inye ha ihe ha chọrọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χήρας
  choice: ụmụanyị di ha nwụrụ
  rationale: Okwu a na-ezo aka kpọmkwem n’ụmụanyị ndị di ha nwụrụ; nkọwa a bụ Igbo doro anya ma bụrụkwa nke ndị mmadụ na-eji taa.
- source_word: τίμα
  choice: Sọpụrụ
  rationale: Okwu Grik a pụtara ịkwanyere ùgwù na ile mmadụ anya dị ka onye bara uru. N’ọnọdụ a, ọ pụkwara ịgụnye inyere ha aka n’ihe ha chọrọ, ma ‘Sọpụrụ’ na-edobe obosara ihe okwu ahụ pụtara.
- source_word: τὰς ὄντως χήρας
  choice: bụ ndị di ha nwụrụ n’ezie
  rationale: Nkebi a na-ekwughachi echiche nke ịbụ nwaanyị di ya nwụrụ ma na-agbakwụnye ọdịiche ὄντως, ya bụ, ndị nọ n’ọnọdụ ahụ n’ezie dịka amaokwu ndị na-esochi ga-akọwa.
- source_word: ὄντως
  choice: n’ezie
  rationale: ‘N’ezie’ na-egosi na a na-akọwapụta otu ìgwè kpọmkwem, ọ bụghị naanị ikwusi okwu ike.
theological_decisions:
- issue: Ókè ihe τίμα pụtara n’ọnọdụ a
  choice: E jiri ‘Sọpụrụ’ mee ka ọ gụnye ịkwanyere ùgwù, ebe ọnọdụ okwu ahụ na-egosikwa na enyemaka ihe onwunwe nwere ike iso na ya.
  alternative: Nyere ụmụanyị di ha nwụrụ bụ ndị di ha nwụrụ n’ezie aka.
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu banyere ilekọta ụmụanyị di ha nwụrụ, ma ngwaa Grik ahụ sara mbara karịa inye naanị ego ma ọ bụ ihe onwunwe. Ya mere, isi ederede na-edobe ‘Sọpụrụ,’ ebe nkọwa ala peeji na-egosi ụzọ ọzọ dabara n’ọnọdụ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘ụmụanyị di ha nwụrụ’ kama okwu nwere ike ịbụ nke olumba, iji mee ka ihe ọ pụtara doo ndị na-agụ akwụkwọ anya.
