    reason: lexical_alternative
  revision_rationale: The revision corrects Standard Igbo word division and explicitly attaches n’ezie to the women’s status as widows, rather than to the fact of their husbands’ death. It preserves the deliberate repetition in the Greek and retains 'Sọpụrụ' as the broad main-text equivalent of τίμα.
