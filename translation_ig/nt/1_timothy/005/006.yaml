  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: ig
  text: Ma nwanyị ahụ nke na-ebi ndụ maka ihe ụtọ anwụọla, n’agbanyeghị na ọ ka dị ndụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwanyị ahụ nke na-emeju ọchịchọ onwe ya gabiga ókè anwụọla, n’agbanyeghị na ọ ka dị ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: na-ebi ndụ maka ihe ụtọ
  rationale: Ọ na-egosi ndụ mmadụ tinyere onwe ya n’ịchọ ihe ụtọ na imeju ọchịchọ onwe ya mgbe niile, ọ bụghị naanị ịnụ ụtọ ihe mgbe ụfọdụ. Nkebi a bụ Igbo dị ugbu a ma na-echekwa echiche nke omume na-aga n’ihu.
- source_word: ζῶσα
  choice: ọ bụ ezie na ọ ka dị ndụ
  rationale: 'Nke a na-egosipụta ike nkwenye/ntụnyere nke participle ahụ ma mee ka ihe mgbagwoju anya e bu n’uche doo anya: ọ nwụrụ anwụ n’otu ụzọ, n’agbanyeghị na ọ dị ndụ n’anụ ahụ.'
- source_word: τέθνηκεν
  choice: anwụọla
  rationale: Perfect tense na-egosi ọnọdụ dị ugbu a nke sitere n’ọnwụ. ‘Anwụọla’ na-echekwa ma omume ahụ ma ọnọdụ ọ rụpụtara, na-enweghị ịkọwa ụdị ọnwụ ahụ n’ime isiokwu.
- source_word: ἡ ... σπαταλῶσα
  choice: nwanyị ahụ na-ebi ndụ maka ihe ụtọ
  rationale: Article na participle nke feminine singular na-arụ ọrụ dịka aha. ‘Nwanyị ahụ...’ na-echekwa ntụaka gbasara nwanyị n’ọnọdụ okwu ahụ, karịsịa ebe a na-ekwu banyere ụmụanyị di ha nwụrụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti nwanyị a na nwanyị di ya nwụrụ nke tụkwasịrị Chineke obi ma nọgide n’ekpere n’amaokwu bu ụzọ.
theological_decisions:
- issue: Ụdị ‘ọnwụ’ a na-ekwu maka ya
  choice: E chekwara okwu ọnwụ ahụ dịka ihe atụ, n’akọwaghị ya kpọmkwem n’isiokwu.
  alternative: Ịsị kpọmkwem na ọ ‘nwụrụ anwụ n’ime mmụọ’ ma ọ bụ na ọ ‘nwụrụ anwụ n’omume ọma.’
  rationale: Njikọ ‘anwụọla’ na ‘ọ ka dị ndụ’ bụ paradox na-egosi ọnwụ na-abụghị nke anụ ahụ, ma ihe odide ahụ akọwaghị kpọmkwem ma ọ bụ ọnwụ ime mmụọ, nke omume, ma ọ bụ echiche ọzọ. Nsụgharị ahụ na-echekwa esemokwu nkà mmụta okpukpe a kama idozi ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Na-ebi ndụ maka ihe ụtọ’ bụ okwu eke nke na-egosi ụdị ndụ mmadụ na-ebi mgbe niile; ihe odide ukwu na nkọwa ala peeji na-echekwa ma ihe atụ nke ọnwụ ma nhọrọ okwu nke σπαταλῶσα.
