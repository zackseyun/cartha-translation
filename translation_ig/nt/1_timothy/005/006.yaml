  to: Ma nwanyị ahụ nke na-ebi ndụ maka ihe ụtọ anwụọla, n’agbanyeghị na ọ ka dị ndụ[a].
  rationale: The revision supplies nke to express the Greek substantival participle idiomatically in Standard Igbo. It otherwise preserves the draft’s lexical choices, the contrast, and the deliberate paradox of death while alive. The footnote remains an alternative rendering of σπαταλῶσα and does not impose a specific account of the metaphorical death.
