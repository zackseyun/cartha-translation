review_pass:
  verdict: revise
  source_fidelity: The draft conveys κρίμα, the causal ὅτι clause, and ἠθέτησαν well. However, “si otú ahụ” (“thus/in this way”) adds an element not present in the Greek. Replacing “na-ewetara onwe ha ikpe” with the more idiomatic “na-adaba n’ikpe” more directly renders ἔχουσαι κρίμα (“incurring/coming under judgment”).
  naturalness: “Ha na-adaba n’ikpe” is natural, clear Standard Igbo for coming under judgment. The revised footnote also corrects the nonstandard fused form “ụmụanyị” to “ụmụ nwanyị.”
  terminology: “Ikpe” appropriately leaves κρίμα broad. “Okwukwe mbụ ha” preserves πίστις as “faith” and the temporal sense of πρώτην without deciding the disputed contextual sense. The note retains “pledge” and “commitment” as alternatives; “ntinye aka” is more suitable than “mkpebi” for a prior commitment.
  issues:
  - severity: medium
    issue: Added phrase “si otú ahụ”
    rationale: The Greek text does not contain an equivalent of “thus/in this way.” The preceding context may explain the judgment, but this verse itself should not add that connective meaning.
  - severity: low
    issue: Footnote alternative “mkpebi mbụ” is imprecise
    rationale: “Mkpebi” normally means a decision, whereas the contextual alternative for πίστις is a pledge or commitment. “Ntụtụ aka”/“ntinye aka” better expresses commitment; “ntinye aka” is used in the revision.
  - severity: low
    issue: “ụmụanyị” is nonstandard orthography
    rationale: Standard Igbo writes “ụmụ nwanyị” as separate words.
  revised_text: Ha na-adaba n’ikpe, n’ihi na ha ajụla okwukwe mbụ ha[a].
