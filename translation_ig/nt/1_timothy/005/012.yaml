  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: ig
  text: Ha na-adaba n’ikpe, n’ihi na ha ajụla okwukwe mbụ ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nkwa mbụ ha” ma ọ bụ “ntinye aka mbụ ha.” Okwu Grik a nwere ike ịpụta “okwukwe,” ma n’ebe a ụfọdụ na-aghọta ya dị ka nkwa ma ọ bụ ntinye aka e mere na mbụ, ikekwe nke metụtara idebanye ha n’aha dị ka ụmụ nwanyị di ha nwụrụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: na-ewetara onwe ha
  rationale: Ọ bụ participle nke pụtara n'ụzọ nkịtị ‘na-enwe’; ya na κρίμα, okwu Igbo a na-egosi na ha na-eme ka ikpe bịakwasị ha, ma na-ejikọkwa amaokwu a na ihe e kwuru tupu ya.
- source_word: κρίμα
  choice: ikpe
  rationale: ‘Ikpe’ na-edobe ịdị arọ nke okwu Grik ahụ n’ebughị ụzọ kpebie na ọ bụ ikpe ọmụma ebighị ebi ma ọ bụ ntaramahụhụ kpọmkwem.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, ὅτι na-ewebata ihe kpatara ikpe ahụ; ‘n’ihi na’ bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: τὴν πρώτην πίστιν
  choice: okwukwe mbụ ha
  rationale: ‘Mbụ’ na-edobe πρώτην n’ụzọ na-ekwe ka ọ bụrụ nke mbụ ma ọ bụ nke gara aga; ‘okwukwe’ bụ isi nghọta πίστις. E debere nghọta ọzọ nke ‘nkwa mbụ’ ma ọ bụ ‘mkpebi mbụ’ n’okpuru ala.
- source_word: ἠθέτησαν
  choice: ha ajụla
  rationale: ἀθετέω nwere ike ịpụta ịjụ, iwepụ, ma ọ bụ ime ka ihe ghara ịdị irè. ‘Ajụla’ na-egosi na ha elegharala ihe mbụ ahụ anya ma ọ bụ jụ ya, n’etinyeghị nkọwa teknụzụ na-adịghị n’amaokwu ahụ.
theological_decisions:
- issue: Ihe τὴν πρώτην πίστιν pụtara n’ebe a
  choice: okwukwe mbụ ha
  alternative: nkwa mbụ ha; mkpebi mbụ ha
  rationale: πίστις na-apụtakarị ‘okwukwe,’ ya mere isi ederede jigidere ya. Ma n’ọnọdụ a, o nwekwara ike ịbụ nkwa ma ọ bụ mkpebi mbụ metụtara idebanye nwanyị di ya nwụrụ n’aha; e debere nghọta ahụ n’okpuru ala ka e ghara idozi esemokwu dị n’ihe odide Grik n’enweghị ihe akaebe zuru ezu.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro ‘na-ewetara onwe ha ikpe’ iji mee ka njikọ participle ahụ bụrụ ihe ebumpụta ụwa n’Igbo. Akara [a] dị n’isi ederede ma kwekọọ na nkọwa ala.
