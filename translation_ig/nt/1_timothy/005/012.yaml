    text: Ma ọ bụ, “nkwa mbụ ha” ma ọ bụ “ntinye aka mbụ ha.” Okwu Grik a nwere ike ịpụta “okwukwe,” ma n’ebe a ụfọdụ na-aghọta ya dị ka nkwa ma ọ bụ ntinye aka e mere na mbụ, ikekwe nke metụtara idebanye ha n’aha dị ka ụmụ nwanyị di ha nwụrụ.
    reason: alternative_reading
  revision_rationale: The revision removes wording absent from the source, uses an idiomatic Igbo expression for incurring judgment, and refines the alternative-reading note while retaining the source’s ambiguity about τὴν πρώτην πίστιν.
