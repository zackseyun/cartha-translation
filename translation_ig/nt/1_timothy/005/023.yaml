id: 1TI.5.23
reference: 1 Timothy 5:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: ig
  text: Aṅụkwala naanị mmiri ọzọ[a]; kama, na-aṅụ ntakịrị mmanya n’ihi afọ gị na ọrịa ndị na-arịakarị gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu Grik, “Abụkwala onye na-aṅụ mmiri.” Ihe ọ pụtara bụ na Timoti ekwesịghị ịnọgide na-aṅụ naanị mmiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι ὑδροπότει
  choice: Aṅụkwala naanị mmiri ọzọ
  rationale: Okwu a na-enye iwu ka Timoti kwụsị omume ọ na-emebu nke ịṅụ naanị mmiri. Itinye “naanị” na-eme ka ọdịiche dị n’etiti mmiri na ntakịrị mmanya doo anya, n’enweghị echiche na a machibidoro ya ịṅụ mmiri kpamkpam.
- source_word: ἀλλὰ
  choice: kama
  rationale: Njikọ a na-ewebata ntụziaka dị iche na nke bu ya ụzọ.
- source_word: οἴνῳ ὀλίγῳ
  choice: ntakịrị mmanya
  rationale: Nke a na-edobe ihe okwu Grik kpọrọ kpọmkwem, ya bụ mmanya, na oke nta e kwuru.
- source_word: χρῶ
  choice: na-aṅụ
  rationale: Ọ bụ ezie na χράομαι pụtara iji ihe eme ihe, n’ebe a ihe a na-eji bụ mmanya a na-aṅụ; “na-aṅụ” bụ ụzọ Igbo dị mma ma doo anya isi kwuo ya.
- source_word: διὰ τὸν στόμαχον
  choice: n’ihi afọ gị
  rationale: διά tinyere accusative na-egosi ihe kpatara ya; στόμαχος na-ezo aka n’afọ.
- source_word: τὰς πυκνάς σου ἀσθενείας
  choice: ọrịa ndị na-arịakarị gị
  rationale: πυκνάς na-egosi ugboro ugboro, ebe ἀσθενείας n’okwu ahụ metụtara ọrịa anụ ahụ. Nkebiokwu a bụ Igbo nkịtị nke na-echekwa echiche ahụ.
theological_decisions:
- issue: Ma a ga-eme ka o doo anya na Timoti na-aṅụ naanị mmiri
  choice: Aṅụkwala naanị mmiri ọzọ
  alternative: Aṅụkwala mmiri ọzọ
  rationale: Ọdịiche dị n’okwu ahụ—“kama, na-aṅụ ntakịrị mmanya”—na-egosi na ntụziaka ahụ abụghị ka ọ kwụsị ịṅụ mmiri kpamkpam, kama ka ọ ghara ịnọgide na-aṅụ naanị mmiri.
- issue: Ma a ga-asụgharị οἶνος kpọmkwem dị ka mmanya
  choice: mmanya
  alternative: ọgwụ e ji mmanya mee
  rationale: Okwu Grik kpọrọ mmanya kpọmkwem. Ịgbakwunye na ọ bụ ọgwụ ga-akọwapụta ihe ederede ahụ n’onwe ya na-ekwughị, ebe “ntakịrị” na ihe kpatara ya na-egosi oke na ebumnuche ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Afọ” bụ okwu ndị nkịtị na-eji maka stomach; “ọrịa ndị na-arịakarị gị” na-egosipụta ọrịa na-alọghachi ugboro ugboro n’ụzọ ebumpụta ụwa.
