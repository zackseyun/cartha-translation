  text: κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: ig
  text: Anabatala ebubo e boro onye okenye[a], ọ gwụla ma ọ sitere n'aka ndị akaebe abụọ ma ọ bụ atọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwoke meworo agadi,” ma ọ bụrụ na a ghọta πρεσβυτέρου dịka okwu gbasara afọ ndụ kama dịka ọkwa onye ndu n'ụka.
    reason: alternative_reading
  - marker: b
    text: Okwu a na-egosipụta ụkpụrụ ikpe dị n'Agba Ochie nke na-ekwu na a ga-eme ka okwu guzosie ike site n'aka ndị akaebe abụọ ma ọ bụ atọ (lee Diuterọnọmi 19:15).
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: ebubo e boro onye okenye
  rationale: N'ọnọdụ a, πρεσβύτερος yikarịrị ka ọ na-ezo aka n'onye ndu ụka a na-akpọ onye okenye; a hapụrụkwa nkọwa nke ‘nwoke meworo agadi’ na nkọwa ala peeji n'ihi na okwu Grik ahụ nwere ike ịpụta ya.
- source_word: κατηγορίαν
  choice: ebubo
  rationale: ‘Ebubo’ na-egosi okwu e boro mmadụ n'ụzọ iwu ma ọ bụ n'usoro ikpe, ma bụrụkwa okwu ndị Igbo nke oge a na-aghọta nke ọma.
- source_word: μὴ παραδέχου
  choice: Anabatala
  rationale: Ụdị iwu a na-asị ka a ghara ịnabata ma ọ bụ iburu ebubo ahụ gaa n'ihu; ‘Anabatala’ na-enye echiche usoro ahụ n'ụzọ dị mfe ma doo anya.
- source_word: ἐκτὸς εἰ μὴ
  choice: ọ gwụla ma
  rationale: Akpaalaokwu a na-ewebata ọnọdụ naanị ya ga-eme ka iwu ahụ nwee ihe e wepụrụ na ya; ‘ọ gwụla ma’ bụ Igbo nkịtị ma ziri ezi.
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: ọ dabere n'ịgba akaebe nke mmadụ abụọ ma ọ bụ atọ
  rationale: Nke a na-egosipụta na a ga-enwe ihe akaebe zuru oke sitere n'aka ndị akaebe abụọ ma ọ bụ atọ, ma na-edobe ụda okwu ikpe dị n'okwu Grik.
theological_decisions:
- issue: Ihe πρεσβυτέρου pụtara n'ọnọdụ ụka
  choice: onye okenye, ya bụ onye ndu ụka
  alternative: nwoke meworo agadi
  rationale: Ihe ndị gbara amaokwu a gburugburu na 1 Timoti 5 na ojiji okwu ahụ n'Akwụkwọ Ozi Pastoral na-akwado na ọ bụ onye ndu ụka ka a na-ekwu maka ya. Ma ebe okwu Grik ahụ nwekwara ike ịpụta nwoke meworo agadi, e debeghị ohere ahụ n'akụkụ kama e gosiri ya na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Onye okenye’ dabara n'okwu ụka a na-ahụkarị, ebe ‘ọ dabere n'ịgba akaebe’ na-eme ka ike ihe akaebe nke ἐπί pụta ìhè n'enweghị ịgbakwunye nkọwa okpukpe otu ụka.
