    reason: alternative_reading
  - marker: b
    text: Okwu a na-egosipụta ụkpụrụ ikpe dị n'Agba Ochie nke na-ekwu na a ga-eme ka okwu guzosie ike site n'aka ndị akaebe abụọ ma ọ bụ atọ (lee Diuterọnọmi 19:15).
    reason: cross_reference
  revision_rationale: 'The revision explicitly renders μάρτυρες as “ndị akaebe” while retaining the source’s evidentiary exception: an accusation is not to be received unless it comes on the basis of two or three witnesses. The footnote revision improves idiomatic Standard Igbo and preserves the OT legal allusion. No doctrinal interpretation has been added.'
