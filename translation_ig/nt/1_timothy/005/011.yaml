  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: ig
  text: Ma ajụ ịdebanye ụmụanyị di ha nwụrụ ndị ka na-eto eto n’ime ndepụta ahụ[a]; n’ihi na mgbe agụụ anụahụ na-achị ha n’ụzọ megide Mesaịa[b], ha na-achọ ịlụ di[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “jụ ụmụanyị di ha nwụrụ ndị ka na-eto eto.” Ihe ndị gbara amaokwu a gburugburu na-egosi na ihe a na-ekwu bụ ịghara idebanye aha ha n’ime ndepụta ahụ.
    reason: contextual_clarification
  - marker: b
    text: Okwu Grik ahụ n’ụzọ nkịtị na-ekwu maka ịghọ ndị agụụ anụahụ na-achị megide Mesaịa. Ọ nwekwara ike ịpụta na ọchịchọ ha na-emegide nraranye ma ọ bụ nkwa ha nyere Mesaịa. A na-asụgharịkwa utu aha “Mesaịa” dịka “Kraịst.”
    reason: lexical_and_theological_ambiguity
  - marker: c
    text: Ma ọ bụ, “ha chọrọ ịlụ di.” Amaokwu ahụ ekwughị n’onwe ya na ịlụ di ọzọ bụ ihe ọjọọ; ihe isi ike ahụ metụtara otú ọchịchọ a si emegide nraranye e kwuru okwu ya.
    reason: interpretive_clarification
lexical_decisions:
- source_word: νεωτέρας χήρας
  choice: ụmụanyị di ha nwụrụ ndị ka na-eto eto
  rationale: Nke a na-egosipụta ntụnyere dị na νεωτέρας ma ghara ịkọwapụta afọ ole a na-ekwu kpọmkwem.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche site n’iwu banyere ụmụanyị di ha nwụrụ e kwuru okwu ha tupu nke a.
- source_word: παραιτοῦ
  choice: ajụla idebanye aha
  rationale: N’ọnọdụ okwu a, iwu ahụ gbasara ịghara ịnabata ha n’ime ndepụta a na-ekwu maka ya, ọ bụghị ịjụ ha kpamkpam dịka mmadụ.
- source_word: ὅταν γὰρ
  choice: n’ihi na mgbe
  rationale: Ọ na-echekwa ma ihe kpatara iwu ahụ ma ọnọdụ nke na-eme mgbe ụfọdụ.
- source_word: καταστρηνιάσωσιν
  choice: agụụ anụahụ malitere ịchị ha
  rationale: Ngwaa a na-adịghị ahụkarị na-egosi ọchịchọ anụahụ ma ọ bụ agụụ siri ike nke na-amalite ịdọ mmadụ n’ụzọ megidere nkwa ma ọ bụ nrara onwe ya nye.
- source_word: τοῦ Χριστοῦ
  choice: n’ụzọ na-emegide Mesaịa
  rationale: Mesaịa na-egosipụta Χριστός dịka utu aha. ‘Na-emegide’ na-echekwa mmekọrịta siri ike ma na-edochaghị anya nke genitive Grik ahụ.
- source_word: γαμεῖν θέλουσιν
  choice: ha na-achọ ịlụ di
  rationale: Nke a na-egosipụta ọchịchọ ma ọ bụ ebumnuche dị na θέλουσιν tinyere infinitive γαμεῖν n’Igbo nkịtị.
theological_decisions:
- issue: Ntụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha; ya mere ‘Mesaịa’ na-eme ka nke ahụ pụta ìhè, ebe ‘Kraịst’ bụ ntụgharị ọdịnala a maara nke ọma.
- issue: Ihe καταστρηνιάσωσιν τοῦ Χριστοῦ pụtara
  choice: agụụ anụahụ malitere ịchị ha n’ụzọ na-emegide Mesaịa
  alternative: ọchịchọ ha dọpụrụ ha n’ebe Mesaịa nọ
  rationale: Nke a na-echekwa esemokwu dị n’okwu Grik ahụ n’etinyeghị nkọwa na ịlụ di ọzọ n’onwe ya bụ mmehie. Ọ na-ahapụkwa n’ụzọ kwesịrị ekwesị ihe jikọrọ ọchịchọ ahụ na nrara ha nye Mesaịa.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. A họọrọ ‘ụmụanyị di ha nwụrụ’ kama okwu nwere ike ịdị ochie ma ọ bụ ghara ido anya. E debere njikọ siri ike dị n’etiti ọchịchọ anụahụ na Mesaịa n’isiokwu ahụ, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ okwu Grik ahụ nwere ike inwe.
