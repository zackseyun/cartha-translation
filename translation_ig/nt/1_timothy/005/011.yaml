  - severity: medium
    issue: “malitere ịchị ha” na-agbakwunye echiche ‘malite.’
    rationale: καταστρηνιάσωσιν na-ekwu maka ịdaba n’agụụ/ịghọ ndị agụụ na-achị; ọ naghị akọwapụta na ọchịchọ ahụ malitere n’oge ahụ.
  - severity: medium
