revisions:
- from: Ma ajụla idebanye aha ụmụanyị di ha nwụrụ ndị ka na-eto eto[a]; n’ihi na mgbe agụụ anụahụ malitere ịchị ha n’ụzọ na-emegide Mesaịa[b], ha na-achọ ịlụ di[c].
  to: Ma ajụ ịdebanye ụmụanyị di ha nwụrụ ndị ka na-eto eto n’ime ndepụta ahụ[a]; n’ihi na mgbe agụụ anụahụ na-achị ha n’ụzọ megide Mesaịa[b], ha na-achọ ịlụ di[c].
  rationale: E degharịrị iwu mbụ iji wepụ mgbagwoju anya nke negation na iji gosipụta n’ụzọ doro anya na a gaghị edebanye ụmụanyị ndị ka na-eto eto n’ime ndepụta ahụ. E wepụrụ “malitere,” nke na-agbakwunye akụkụ oge na-adịghị n’asụsụ Grik, ma dezie nkọwa ala peeji ka ọ ghara iji “nrara” n’ebe “nraranye” kwesịrị ekwesị. Ntụgharị ahụ anaghị ekpebi kpọmkwem ụdị nraranye ma ọ bụ nkwa genitive ahụ na-atụ aka na ya.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:25:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'A chọrọ imezi iwu mbụ: “Ma ajụla idebanye aha …” nwere ike ịpụta “emela ịjụ idebanye aha,” ya bụ, ihe megidere παραιτοῦ. Ọzọkwa, “malitere ịchị” na-agbakwunye echiche mmalite nke aorist Grik ahụ na-ekwughị. Ntụgharị e deziri na-ekwu n’ụzọ doro anya ka a ghara idebanye ụmụanyị ndị a n’ime ndepụta ahụ, dịka ọnọdụ amaokwu si chọpụta, ma na-edobe enweghị nkọwa doro anya dị n’etiti καταστρηνιάω na τοῦ Χριστοῦ.'
  naturalness: Ederede a deziri dị ụtọ ma bụrụ Igbo Izugbe nke oge a. “Ajụ ịdebanye … n’ime ndepụta ahụ” na-enye iwu ahụ n’enweghị mgbagwoju anya, ebe “agụụ anụahụ na-achị ha n’ụzọ megide Mesaịa” na-adị mma karịa usoro nke na-ekwu na ọchịchọ ahụ ‘malitere.’
  terminology: “Mesaịa” kwesịrị ekwesị maka Χριστός dịka utu aha. “Ụmụanyị di ha nwụrụ” na “ịlụ di” bụ okwu Igbo a na-aghọta nke ọma. E dozikwara “nrara” n’ala peeji ka ọ bụrụ “nraranye,” ebe nrara pụtara ịrara mmadụ nye karịa devotion/commitment.
  issues:
