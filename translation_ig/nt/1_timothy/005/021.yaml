  to: Ana m enye gị iwu siri ike n’ihu Chineke na Mezaịa Jizọs na ndị mmụọ ozi a họọrọ[a] ka ị debe ihe ndị a n’enweghị ikpe e buru ụzọ kpebie[b], emekwala ihe ọ bụla n’ihi ile mmadụ anya n’ihu[c].
