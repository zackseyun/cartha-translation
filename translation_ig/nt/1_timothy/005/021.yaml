id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: ig
  text: Ana m enye gị iwu siri ike n’ihu Chineke na Mezaịa Jizọs na ndị mmụọ ozi a họọrọ[a] ka ị debe ihe ndị a n’enweghị ikpe e buru ụzọ kpebie[b], emekwala ihe ọ bụla n’ihi ile mmadụ anya n’ihu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị mmụọ ozi Chineke họpụtara.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’enweghị ajọ mbunobi.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, n’ebughị ụzọ kwado otu onye ma ọ bụ otu akụkụ.
    reason: lexical_clarification
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: Ana m enye gị iwu siri ike
  rationale: N’ọnọdụ ndụmọdụ dị nsọ a, okwu ahụ pụtara inye mmadụ iwu ma ọ bụ ịdọ ya aka ná ntị n’ụzọ dị oké mkpa, ọ bụghị naanị ịgba akaebe.
- source_word: ἐνώπιον
  choice: n’ihu
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma dịkwa ebube isi gosi na Chineke, Mezaịa Jizọs, na ndị mmụọ ozi bụ ndị akaebe nye iwu a.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mezaịa Jizọs
  rationale: A sụgharịrị Χριστός dịka aha ọkwá ‘Mezaịa’ n’ihi na ọ ka nwere ike aha ọkwá n’ebe a, kama iji naanị mkpụrụokwu e si n’asụsụ ọzọ nweta.
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: ndị mmụọ ozi a họọrọ
  rationale: Nke a na-edobe echiche nke ndị a họpụtara, n’etinyeghị onye họọrọ ha n’ahịrịokwu ebe Grik ekwughị ya kpọmkwem.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Okwu a na-ezo aka na ntụziaka ndị bu ya ụzọ ma na-ezere ịkọwa ihe ahụ karịa ka Grik siri kọwaa ya.
- source_word: φυλάξῃς
  choice: debe
  rationale: ‘Debe’ na-egosi irube isi na ịkpachara anya ime ihe ndị e nyere n’iwu.
- source_word: χωρὶς προκρίματος
  choice: n’enweghị ikpe e buru ụzọ kpebie
  rationale: Nke a na-edobe echiche πρόκριμα nke ikpe e kpebiri tupu e nyochaa okwu ahụ nke ọma.
- source_word: μηδὲν ποιῶν
  choice: emekwala ihe ọ bụla
  rationale: E mere participle ahụ ka ọ bụrụ iwu jikọrọ ya na nke bu ya ụzọ, nke na-ada nke ọma n’Igbo ma na-edobe njikọ echiche ahụ.
- source_word: κατὰ πρόσκλισιν
  choice: n’ihi ile mmadụ anya n’ihu
  rationale: Akpaalaokwu Igbo a na-egosi ịkwado otu onye ma ọ bụ otu akụkụ n’ụzọ na-ezighị ezi.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mezaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: ‘Mezaịa’ na-egosipụta ihe aha ọkwá Χριστός pụtara; ‘Kraịst’ bụkwa ụdị a na-ejikarị eme ihe n’ọgbakọ, ma ọ naghị akọwapụta ihe okwu Grik ahụ pụtara ozugbo.
- issue: Ndị mmụọ ozi ‘a họọrọ’
  choice: ndị mmụọ ozi a họọrọ
  alternative: ndị mmụọ ozi Chineke họpụtara
  rationale: Grik na-akpọ ha ‘ndị a họọrọ’ ma ọ kpọghị onye họọrọ ha aha n’ahịrịokwu a; ya mere, a hapụrụ onye mere nhọrọ ahụ n’ụzọ okwu ahụ si hapụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. Ahịrịokwu ahụ na-ejigide ịdị arọ nke iwu Pọl nyere, ma jiri ‘ile mmadụ anya n’ihu’ mee ka echiche nke ime mmadụ amara n’ụzọ na-ezighị ezi doo anya.
