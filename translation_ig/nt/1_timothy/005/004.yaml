revisions:
- from: 'Ma ọ bụrụ na nwanyị di ya nwụrụ nwere ụmụ ma ọ bụ ụmụ ụmụ[a], ka ụmụ ahụ buru ụzọ mụta igosi nsọpụrụ Chineke n’ebe ezinụlọ nke ha nọ[b], na ịkwụghachi ndị bu ha ụzọ n’ezinụlọ ụgwọ[c], n’ihi na nke a bụ ihe Chineke na-anabata.


    [a] A pụkwara ịsụgharị ya, “ụmụ ma ọ bụ ụmụ ụmụ ha na ndị ọzọ si n’ụmụ ha pụta.” Okwu Grik ahụ nwere ike ịgụnye ndị niile si n’ezinụlọ mmadụ pụta, ọ bụ ezie na n’ebe a o yikarịrị ka ọ na-ekwu banyere ụmụ ụmụ.


    [b] A pụkwara ịsụgharị ya, “ime omume nsọpụrụ Chineke n’ebe ezinụlọ nke ha nọ.” N’asụsụ Grik, ilekọta ezinụlọ jikọtara ya na nsọpụrụ a na-enye Chineke.


    [c] A pụkwara ịsụgharị ya, “ịkwụghachi ndị mụrụ ha ụgwọ” ma ọ bụ “ịkwụghachi ndị nna nna ha ụgwọ.” Okwu Grik ahụ pụtara ndị bu mmadụ ụzọ n’ezinụlọ.'
  to: Ma ọ bụrụ na nwanyị di ya nwụrụ nwere ụmụ ma ọ bụ ụmụ ụmụ[a], ka ụmụ ahụ buru ụzọ mụta ilekọta ezinụlọ nke ha n’ụzọ na-egosi nsọpụrụ Chineke[b], ma kwụghachi ndị bu ha ụzọ ụgwọ[c], n’ihi na nke a bụ ihe a na-anabata n’ihu Chineke.
  rationale: The revision restores the explicit phrase ‘n’ihu Chineke,’ improves the contextual expression of εὐσεβεῖν, and replaces the inaccurate lexical alternative in footnote a. It retains the source’s plural command to the children or grandchildren, the priority indicated by πρῶτον, and the deliberately broad sense of πρόγονοι.
  reviewer_model: gpt-5.6-terra
