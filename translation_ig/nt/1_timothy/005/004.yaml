    text: A pụkwara ịsụgharị ya, “ụmụ ma ọ bụ ndị si n’ezinụlọ ha pụta.” Okwu Grik ahụ nwere ike ịgụnye ndị si n’ọgbọ ndị na-esote pụta, ọ bụ ezie na n’ebe a o yikarịrị ka ọ na-ekwu banyere ụmụ ụmụ.
    reason: lexical_alternative
  - marker: b
