id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: ig
  text: Ma ọ bụrụ na nwanyị di ya nwụrụ nwere ụmụ ma ọ bụ ụmụ ụmụ[a], ka ụmụ ahụ buru ụzọ mụta ilekọta ezinụlọ nke ha n’ụzọ na-egosi nsọpụrụ Chineke[b], ma kwụghachi ndị bu ha ụzọ ụgwọ[c], n’ihi na nke a bụ ihe a na-anabata n’ihu Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụmụ ma ọ bụ ndị si n’ezinụlọ ha pụta.” Okwu Grik ahụ nwere ike ịgụnye ndị si n’ọgbọ ndị na-esote pụta, ọ bụ ezie na n’ebe a o yikarịrị ka ọ na-ekwu banyere ụmụ ụmụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ime omume nsọpụrụ Chineke n’ebe ezinụlọ nke ha nọ.” N’asụsụ Grik, ilekọta ezinụlọ jikọtara ya na nsọpụrụ Chineke.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ịkwụghachi ndị mụrụ ha ụgwọ” ma ọ bụ “ịkwụghachi ndị nna nna ha ụgwọ.” Okwu Grik ahụ pụtara ndị bu mmadụ ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: anyịanyị di ya nwụrụ
  rationale: Ọ bụ okwu Igbo doro anya maka nwanyị onye di ya nwụrụ; ọ dabara n’ihe a na-ekwu banyere ndị inyom di ha nwụrụ n’akụkụ akwụkwọ a.
- source_word: τέκνα ἢ ἔκγονα
  choice: ụmụ ma ọ bụ ụmụ ụmụ
  rationale: “Ụmụ” na-egosipụta τέκνα, ebe “ụmụ ụmụ” bụ nghọta kacha kwekọọ n’ọnọdụ a maka ἔκγονα; nkọwa ala peeji chekwara nghọta sara mbara nke “ndị si n’ụmụ ha pụta.”
- source_word: μανθανέτωσαν
  choice: ka ụmụ ahụ ... mụta
  rationale: Nke a na-edobe ike nke iwu dị na ngwaa Grik ahụ, ma na-eme ka o doo anya na isiokwu ọtụtụ bụ ụmụ ma ọ bụ ụmụ ụmụ nwanyị ahụ.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: Ọ na-egosi na ọrụ e kwesịrị ibu ụzọ rụọ bụ nke metụtara ezinụlọ nke aka ha.
- source_word: τὸν ἴδιον οἶκον
  choice: ezinụlọ nke ha
  rationale: N’ebe a οἶκος na-ekwu banyere ezinụlọ ma ọ bụ ndị ụlọ, ọ bụghị naanị ụlọ e wuru; “nke ha” na-egosipụta ἴδιον.
- source_word: εὐσεβεῖν
  choice: igosi nsọpụrụ Chineke
  rationale: Nhọrọ a na-echekwa echiche okpukpe dị n’okwu ahụ, ma na-ekwe ka ọnọdụ amaokwu ahụ gosi na nsọpụrụ ahụ pụtara omume a na-emere ezinụlọ.
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: ịkwụghachi ... ụgwọ
  rationale: Nkebiokwu a pụtara inyeghachi ihe e ji mmadụ n’ihi nlekọta e nyere ya na mbụ; okwu Igbo a dị nkenke ma bụrụkwa nke nkịtị.
- source_word: τοῖς προγόνοις
  choice: ndị bu ha ụzọ n’ezinụlọ
  rationale: Nke a na-echekwa obosara nke okwu Grik maka ndị ọgbọ gara aga n’ezinụlọ, n’akọwaghị ya naanị dị ka nne na nna ma ọ bụ nna nna na nne nna.
- source_word: ἀπόδεκτον
  choice: ihe ... na-anabata
  rationale: Ọ na-egosi na omume ahụ dị Chineke mma ma bụrụ nke ọ nabatara, n’etinyeghị echiche ọzọ na-adịghị n’okwu Grik.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: Chineke na-anabata
  rationale: Nke a bụ ntụgharị Igbo dị ndụ nke echiche ịbụ ihe a na-anabata n’ihu Chineke, ma na-echekwa Chineke dị ka onye na-enyocha omume ahụ.
theological_decisions:
- issue: Onye iwu dị n’okwu μανθανέτωσαν na-ezo aka na ya
  choice: Iwu ahụ bụ maka ụmụ ma ọ bụ ụmụ ụmụ nwanyị di ya nwụrụ.
  alternative: Iwu ahụ bụ maka ndị inyom di ha nwụrụ n’ozuzu ha, ebe isiokwu gbanwere n’agbanyeghị na ngwaa ahụ dị n’ọnụọgụ ọtụtụ.
  rationale: Ndị kacha nso ngwaa ahụ bụ “ụmụ ma ọ bụ ụmụ ụmụ,” ha dịkwa n’ọnụọgụ ọtụtụ. Nke a kwekọrọ n’echiche ka ndị ezinụlọ lekọta nwanyị ahụ ma kwụghachi ndị lekọtara ha na mbụ.
- issue: Ihe εὐσεβεῖν pụtara n’ihe gbasara ilekọta ezinụlọ
  choice: Ilekọta na ịrụ ọrụ dịịrị ezinụlọ bụ ụzọ e si egosi nsọpụrụ Chineke.
  alternative: Okwu ahụ pụtara naanị ịrụ ọrụ ezinụlọ, na-enweghị isi okpukpe pụtara ìhè.
  rationale: εὐσεβεῖν nwere echiche doro anya banyere nsọpụrụ na ofufe Chineke, amaokwu ahụ na-ekwukwa na omume a bụ ihe Chineke na-anabata. Ya mere, e chekwara ma akụkụ ime mmụọ ma omume ezinụlọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Nwanyị di ya nwụrụ” na “ezinụlọ” bụ okwu ndị mmadụ na-aghọta ngwa ngwa. A họọrọ “ndị bu ha ụzọ n’ezinụlọ” iji chekwaa obosara na obere mgbagwoju anya dị na πρόγονοι, ebe nkọwa ala peeji na-enye nhọrọ ndị kapịrị ọnụ.
