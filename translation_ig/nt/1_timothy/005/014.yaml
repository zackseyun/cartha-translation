id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: ig
  text: Ya mere, achọrọ m ka ụmụ nwanyị di ha nwụrụ bụ́ ndị ka na-eto eto lụọ di[b], mụọ ụmụ, lekọta ụlọ ha, gharakwa inye onye na-emegide[a] ohere ọ bụla ikwutọ mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye iro”; ọ pụrụ ịbụ na nke a na-ezo aka na Setan.
    reason: alternative_reading
  - marker: b
    text: Okwu Grik ahụ kwuru nanị “lụọ di.” Ebe ihe a na-ekwu gbasara ụmụ nwanyị di ha nwụrụ, ọ pụtara n’ọnọdụ a na ha ga-alụ di ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βούλομαι
  choice: achọrọ m
  rationale: Nke a na-egosi ọchịchọ Pọl n'ụzọ doro anya ma bụrụkwa okwu Igbo a na-asụ ugbu a.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe ndị e kwuru n’amaokwu ndị bu ụzọ.
- source_word: νεωτέρας
  choice: ụmụ nwanyị di ha nwụrụ bụ́ ndị ka na-eto eto
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara nanị ‘ndị nwanyị ka na-eto eto,’ ihe gbara amaokwu ahụ gburugburu na-egosi na ọ na-ekwu banyere ụmụ nwanyị di ha nwụrụ.
- source_word: γαμεῖν
  choice: lụọ di
  rationale: Ngwaa Grik ahụ pụtara ‘ịlụ di’ ma ọ bụ ‘ịlụ nwunye’; ebe ndị a na-ekwu okwu banyere ha bụ ụmụ nwanyị di ha nwụrụ, Igbo ‘lụọ di’ dabara adaba, n’ebughị ụzọ tinye echiche ‘ọzọ’ nke na-adịghị n’ime ngwaa ahụ n’onwe ya.
- source_word: τεκνογονεῖν
  choice: mụọ ụmụ
  rationale: Nke a na-egosipụta ịmụ ụmụ kpọmkwem ma bụrụkwa okwu Igbo ebumpụta ụwa.
- source_word: οἰκοδεσποτεῖν
  choice: lekọta ezinụlọ ha
  rationale: Okwu ahụ na-egosi ibu ọrụ nke ilekọta na ịhazi ihe gbasara ụlọ; nsụgharị a na-ezere itinye echiche ọchịchị aka ike.
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: gharakwa inye ... ohere ọ bụla
  rationale: Nkebiokwu a pụtara ịghara inye oghere ma ọ bụ ihe ga-eme ka mmegide nwee ike ikwu okwu ọjọọ.
- source_word: τῷ ἀντικειμένῳ
  choice: onye na-emegide ha
  rationale: Nke a na-edobe onye ahụ dị ka otu onye mmegide n’akọwapụtaghị ya ozugbo dị ka Setan.
- source_word: λοιδορίας χάριν
  choice: ikwutọ ha
  rationale: Nke a na-enye echiche nke okwu mkparị ma ọ bụ nkwutọ e kwuru megide ha n’Igbo doro anya.
theological_decisions:
- issue: Onye τῷ ἀντικειμένῳ na-ezo aka na ya
  choice: onye na-emegide ha n’ozuzu ya
  alternative: onye iro, nke pụrụ ịbụ Setan
  rationale: Okwu Grik ahụ akpọghị ekwensu aha. Ya mere, isi amaokwu ahụ na-edobe nghọtahie ahụ, ebe ihe e dere n’ala ala peeji na-egosi na ọ pụkwara ịbụ Setan.
translation_notes:
  register: 'Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere usoro ngwaa ndị ahụ n’ụdị kwekọrọ ekwekọ: lụọ, mụọ, lekọta, gharakwa inye. E tinyere akara nkọwa [a] n’ebe ‘onye na-emegide ha’ dị na [b] n’ebe ‘lụọ di’ dị ka ọdịnaya nkọwa nke ọ bụla si dị.'
