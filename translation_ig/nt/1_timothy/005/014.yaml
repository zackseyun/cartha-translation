    reason: lexical_alternative
  revision_rationale: 'The revision changes “ezinụlọ” to “ụlọ” to convey household administration more precisely. It removes the added relational pronouns. “Ikwutọ mmadụ” expresses slander/reviling without specifying its target, preserving the source’s ambiguity while remaining grammatical and natural in Igbo. Footnote anchors remain correctly placed: [b] on “lụọ di” and [a] on “onye na-emegide.”'
