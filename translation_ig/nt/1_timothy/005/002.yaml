source:
  edition: SBLGNT
  text: πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: ig
  text: na-emeso ụmụ nwanyị ndị ka okenye dị ka ndị nne, ụmụ nwanyị ndị ka nta dị ka ụmụnne nwanyị, n’ịdị ọcha zuru oke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “jirikwa ịdị ọcha zuru oke na-emeso ha.” N’ebe a, “ịdị ọcha” nwekwara ike imesi ike banyere ịkpachara anya n’omume mmekọahụ na omume kwesịrị ekwesị.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: ụmụ nwanyị ndị okenye
  rationale: Okwu a bụ adjective nke na-anọchi aha, bụrụkwa feminine accusative plural. N’ebe a, ọ na-emegide νεωτέρας, ya mere ọ na-ekwu maka afọ ndụ, ọ bụghị ọkwa ndị okenye n’ọgbakọ.
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-egosi ntụnyere, ma “dị ka” bụ ụzọ Igbo nkịtị si kwuo ya n’usoro a.
- source_word: μητέρας
  choice: ndị nne
  rationale: Nke a na-echekwa ihe atụ nke ezinụlọ n’etinyeghị okwu pụtara “nke gị,” nke na-adịghị n’asụsụ Grik.
- source_word: νεωτέρας
  choice: ụmụ agbọghọ
  rationale: N’usoro ọdịiche afọ a, okwu ahụ na-ezo aka n’ụmụ nwanyị ndị ka na-eto eto. “Ụmụ agbọghọ” bụ okwu Igbo e ji ekwu ụmụ nwanyị na-eto eto, ọ bụghị naanị ụmụaka.
- source_word: ἀδελφὰς
  choice: ụmụnne nwanyị
  rationale: Nke a na-echekwa ihe atụ nke mmekọrịta ezinụlọ, na-egosi ka e kwesịrị isi were ha dịka ụmụnne.
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: n’ịdị ọcha n’ụzọ niile
  rationale: “Ịdị ọcha” na-echekwa obosara ihe ἁγνεία pụtara, ebe “n’ụzọ niile” na-anọchi πάσῃ ma ghara ime ka okwu ahụ bụrụ naanị gbasara omume mmekọahụ.
theological_decisions:
- issue: Ókè ihe ἁγνεία pụtara n’iwu banyere ụmụ nwanyị na-eto eto
  choice: n’ịdị ọcha n’ụzọ niile
  alternative: n’ịdị ọcha zuru ezu n’omume mmekọahụ
  rationale: Ihe gbara okwu ahụ gburugburu na-eme ka ịdị ọcha n’omume mmekọahụ bụrụ akụkụ dị mkpa, ma okwu Grik ahụ nwekwara ike ịgụnye ịdị ọcha n’omume n’ozuzu ya. Nsụgharị sara mbara na-echekwa ma obosara okwu ahụ ma ike ọ nwere n’ebe a.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke dị ugbu a, dị ugwu ma dị mfe nghọta. E debere usoro ntụnyere ezinụlọ nke Grik. E jiri “ụmụ nwanyị ndị okenye” zere ịghọta πρεσβυτέρας dịka ọkwa ọchịchị n’ọgbakọ; e jikwa “ịdị ọcha” ghara imechi ihe ἁγνεία pụtara naanị n’ịghara inwe mmekọahụ.
