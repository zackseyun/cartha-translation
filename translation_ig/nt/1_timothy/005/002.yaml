revisions:
- from: na-emeso ụmụ nwanyị ndị okenye dị ka ndị nne, ụmụ agbọghọ dị ka ụmụnne nwanyị, n’ịdị ọcha n’ụzọ niile.[a]
  to: na-emeso ụmụ nwanyị ndị ka okenye dị ka ndị nne, ụmụ nwanyị ndị ka nta dị ka ụmụnne nwanyị, n’ịdị ọcha zuru oke.[a]
  rationale: The revision keeps the Greek’s comparative family imagery and its broad instruction to treat younger women in comprehensive purity. It replaces a term that can denote girls with one that clearly denotes younger women, without adding a specific age category. The note retains the possible strong contextual implication of sexual propriety without limiting the main text to that sense.
