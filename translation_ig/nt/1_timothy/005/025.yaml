  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: ig
  text: N’otu aka ahụ kwa, ọrụ ọma na-apụta ìhè, ọrụ ndị dị n’ụzọ ọzọ[a] enweghịkwa ike ịnọgide na-adị zoro ezo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọrụ ndị dị iche” ma ọ bụ “ọrụ ndị na-adịghị otú a.” Ụfọdụ na-aghọta na nke a na-ekwu kpọmkwem banyere ọrụ ọjọọ, n’ihi njikọ ya na amaokwu bu ụzọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: N’otu aka ahụ kwa
  rationale: Nke a na-ejikọta amaokwu a nke ọma na amaokwu bu ụzọ, ma na-echekwa ma echiche ὡσαύτως ma nkwusi ike nke καί.
- source_word: ἔργα τὰ καλά
  choice: ọrụ ọma
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu banyere omume ndị dị mma, na-enweghị itinye nkọwa okpukpe pụrụ iche.
- source_word: πρόδηλα
  choice: na-apụta ìhè
  rationale: Ọ na-egosi ihe pụtara nke ọma ma ọ bụ nke mmadụ pụrụ ịhụ ma mara, n’ụzọ kwekọrọ na ọdịiche dị n’etiti ya na ihe zoro ezo.
- source_word: τὰ ἄλλως ἔχοντα
  choice: ọrụ ndị na-adịghị otú ahụ
  rationale: 'Nkebiokwu a na-echekwa obosara na mgbagwoju anya nke Grik: ọ naghị ekpebi n’onwe ya ma ọrụ ndị a hà bụ ọrụ ọjọọ, ka hà bụ naanị ọrụ ndị na-apụtaghị ìhè ugbu a.'
- source_word: κρυβῆναι οὐ δύνανται
  choice: enweghị ike ịnọgide na nzuzo
  rationale: Nke a na-egosi enweghị ike ịnọgide na-ezo ezo, ma na-eweta echiche na ihe ndị a ga-emecha pụta ìhè.
theological_decisions:
- issue: Ma τὰ ἄλλως ἔχοντα ọ̀ na-ekwu kpọmkwem banyere ọrụ ọjọọ, ka ọ̀ na-ekwu n’ozuzu banyere ọrụ ndị na-adịghị ka ndị ahụ a kpọtụrụ aha.
  choice: ọrụ ndị na-adịghị otú ahụ
  alternative: ọrụ ọjọọ
  rationale: Grik ekwughị okwu pụtara ‘ọjọọ’ kpọmkwem. Ya mere, nsụgharị ahụ na-ahapụ nkebiokwu ahụ ka ọ nwee obosara o nwere n’asụsụ mbụ, ebe nkọwa ala peeji na-egosi nghọta ọzọ sitere na amaokwu bu ụzọ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-ezere okwu ụka pụrụ iche ma na-echekwa mgbagwoju anya dị na τὰ ἄλλως ἔχοντα.
