id: 1TI.5.20
reference: 1 Timothy 5:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: ig
  text: Baara ndị na-eme mmehie[b][a] mba n’ihu mmadụ niile, ka ndị ọzọ kwa tụọ egwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-anọgide na-eme mmehie”; ụdị ugbu a nke participle ahụ nwere ike igosi omume mmehie na-aga n’ihu.
    reason: lexical_alternative
  - marker: b
    text: Ihe ndị e kwuru ozugbo tupu amaokwu a nwere ike igosi na ndị a bụ ndị okenye ọgbakọ na-eme mmehie; ma amaokwu a n’onwe ya kwuru naanị “ndị na-eme mmehie.”
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: ndị na-eme mmehie
  rationale: Nke a na-asụgharị participle nke na-arụ ọrụ dị ka aha n'ụzọ doro anya ma kwekọọ n’Igbo. Ụdị present nwere ike igosi omume na-aga n’ihu, ma itinye ‘na-anọgide’ n’ahịrị bụ ịkọwa karịa okwu Grik n’onwe ya; ya mere e debere ya n’ala peeji.
- source_word: ἐνώπιον πάντων
  choice: n’ihu mmadụ niile
  rationale: Nke a na-edobe ihe okwu ahụ pụtara kpọmkwem, ya bụ ime ya n’ihu ndị niile nọ ya, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἔλεγχε
  choice: ka ị baara mba
  rationale: N’ọnọdụ ịdọ aka ná ntị a, ‘ịbara mba’ na-egosi ịkatọ mmejọ na ịgbazi onye mere ya; ọ naghị eme ka isi okwu bụrụ naanị ikpughe mmehie ahụ.
- source_word: οἱ λοιποὶ
  choice: ndị ọzọ
  rationale: Okwu a na-ezo aka n’ebe ndị fọdụrụ, e wezụga ndị a na-abara mba, nọ; ‘ndị ọzọ’ bụ okwu Igbo dị mfe ma bụrụ nke okike.
- source_word: φόβον ἔχωσιν
  choice: nwee egwu
  rationale: Nke a na-edobe akpaalaokwu Grik ‘inwe egwu’ n’enweghị ịkọwa ya naanị dị ka ụjọ dị ukwuu ma ọ bụ naanị egwu nsọpụrụ.
theological_decisions:
- issue: Ndị ‘na-eme mmehie’ bụ ndị ole n’ọnọdụ a?
  choice: Ahịrị bụ isi kwuru naanị ‘ndị na-eme mmehie,’ dịka amaokwu Grik ahụ si kwuo.
  alternative: N’ihi amaokwu ndị gbara ya gburugburu, okwu a nwere ike na-ezo kpọmkwem n’ebe ndị okenye ọgbakọ na-eme mmehie nọ.
  rationale: Amaokwu 19–20 nọ n’ọnọdụ ntụziaka banyere ndị okenye, ma amaokwu 20 ekwughị okwu pụtara ‘ndị okenye’ ọzọ. Ya mere, nsụgharị ahụ anaghị etinye okwu ahụ n’ahịrị bụ isi, kama ọ na-edobe njikọ ahụ n’ala peeji ka esemokwu ahụ ghara ịla n’iyi.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ka ị baara mba’ na-egosipụta iwu e nyere Timoti n’ụzọ okike; ‘n’ihu mmadụ niile’ na-echekwa ọdịdị ọha nke mgbazi ahụ. E debere akara ala peeji n’usoro ha si soro okwu metụtara ha n’ahịrị: [b] maka njirimara ndị ahụ, [a] maka omume na-aga n’ihu.'
