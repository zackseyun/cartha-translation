id: 1TI.5.5
reference: 1 Timothy 5:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: ig
  text: Ma, nwanyị di ya nwụrụ n’ezie, onye a hapụrụ naanị ya[a], etinyela olileanya ya n'ebe Chineke nọ[b], ọ na-anọgidekwa n’arịrịọ na ekpere[c] abalị na ehihie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye nọ naanị ya.” Okwu Grik ahụ na-emesi ọnọdụ ya ike dịka onye enweghị onye na-akwado ya, dịka ezinụlọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “nwere olileanya n'ebe Chineke nọ.” Oge perfect nke Grik nwere ike imesi ike na o tinyela olileanya ya n'ebe Chineke nọ nakwa na olileanya ahụ ka na-adịgide.
    reason: lexical_alternative
  - marker: c
    text: 'E debere ma “arịrịọ” ma “ekpere” iji gosipụta okwu Grik abụọ ahụ: nke mbụ na-elekwasị anya n’ihe ndị a kapịrị ọnụ a na-arịọ, ebe nke abụọ bụ okwu sara mbara maka ekpere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντως χήρα
  choice: nwanyị di ya nwụrụ n’ezie
  rationale: Ọ na-egosi nwanyị di ya nwụrụ nke dabara n’ụdị a na-akọwa n’okwu ndị gbara amaokwu a gburugburu, ọ bụghị naanị onye a na-akpọ nwanyị di ya nwụrụ.
- source_word: μεμονωμένη
  choice: onye a hapụrụ naanị ya
  rationale: 'Oge perfect participle na-egosi ọnọdụ ọ nọgidere na ya: ọ nọ naanị ya, o yikwara ka o nweghị ezinụlọ na-akwado ya.'
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: atụkwasịla Chineke olileanya ya
  rationale: Oge perfect na-egosi na o tinyela olileanya ya n’ebe Chineke nọ, ọnọdụ ahụ ka na-adịgidekwa.
- source_word: προσμένει
  choice: ọ na-anọgidekwa
  rationale: Ọ na-egosi omume nke na-aga n’ihu na nkwụsi ike, na-etinyeghị ike ọzọ okwu Grik na-ekwughị.
- source_word: ταῖς δεήσεσιν
  choice: n’arịrịọ
  rationale: ‘Arịrịọ’ na-egosi ịrịọ maka mkpa ndị a kapịrị ọnụ, nke na-enyere aka idobe ọdịiche ya na okwu izugbe maka ekpere.
- source_word: ταῖς προσευχαῖς
  choice: na ekpere
  rationale: Nke a bụ okwu sara mbara maka ekpere; e debere ya n’akụkụ ‘arịrịọ’ dịka e si nwee okwu abụọ na Grik.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ehihie na abalị
  rationale: Nke a bụ ụzọ Igbo dị ndụ si ekwu omume a na-eme mgbe niile; a gbanwere usoro okwu Grik iji mee ka ọ daa nke ọma n’Igbo.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị ma ọ bụ ọdịiche n’arụmụka ahụ; ‘Ma’ na-ejikọta amaokwu a nke ọma na ihe gbara ya gburugburu.
theological_decisions:
- issue: Ihe ‘nwanyị di ya nwụrụ n’ezie’ pụtara
  choice: 'Amaokwu ahụ na-akọwa otu nwanyị di ya nwụrụ nke ọnọdụ ya na omume ya na-egosi na ọ bụ onye kwesịrị ka ọgbakọ lekọta: a hapụrụ ya naanị ya, ọ tụkwasịrị Chineke olileanya, ọ na-anọgidesikwa ike n’ekpere.'
  alternative: Amaokwu ahụ na-ekwu naanị banyere ụmụ nwanyị niile di ha nwụrụ, na-enweghị ihe ọ bụla gbasara ndị tozuru maka nlekọta ọgbakọ.
  rationale: ὄντως na ihe gbara amaokwu ahụ gburugburu n’1 Timoti 5 na-egosi otu ụdị pụrụ iche. Nsụgharị ahụ na-edobe nke a n’etinyeghị usoro ụka ma ọ bụ ozizi otu chọọchị.
translation_notes:
  register: E ji Standard Igbo nke dị ùgwù ma dị mfe nghọta. ‘Nwanyị di ya nwụrụ’ bụ okwu doro anya n’asụsụ Igbo oge a. A họọrọ ‘Ma’ maka δὲ iji chekwaa njikọ na ọdịiche dị n’okwu gbara ya gburugburu. E tinyere akara nkọwa ụkwụ niile [a], [b], na [c] kpọmkwem n’ebe okwu ha metụtara dị.
