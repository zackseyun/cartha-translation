revisions:
- from: Ma nwanyị ahụ bụ́ nwanyị di ya nwụrụ n’ezie, onye a hapụrụ naanị ya[a], atụkwasịla Chineke olileanya ya[b], ọ na-anọgidekwa n’arịrịọ na ekpere[c] ehihie na abalị.
  to: Ma, nwanyị di ya nwụrụ n’ezie, onye a hapụrụ naanị ya[a], etinyela olileanya ya n'ebe Chineke nọ[b], ọ na-anọgidekwa n’arịrịọ na ekpere[c] abalị na ehihie.
  rationale: The revision improves idiomatic Standard Igbo and syntactic clarity, while retaining the Greek’s genuine-widow characterization, perfect tense for her settled hope, present persistence in two distinct prayer terms, and the night-to-day sequence. It does not add a church-policy interpretation to the verse itself.
