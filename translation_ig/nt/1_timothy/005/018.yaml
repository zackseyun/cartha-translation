revisions:
- from: N’ihi na Akwụkwọ Nsọ na-ekwu, “Ekela oke ehi ọnụ mgbe ọ na-azọcha ọka[a],” ọzọkwa, “Onye ọrụ kwesịrị ịnata ụgwọ ọrụ ya[b].”
  to: N’ihi na Akwụkwọ Nsọ na-ekwu, “Ekechila ehi ọnụ mgbe ọ na-azọcha ọka[a],” ọzọkwa, “Onye ọrụ kwesịrị ụgwọ ọrụ ya[b].”
  rationale: The revision corrects the negative imperative for muzzle, avoids unnecessarily narrowing the generic work animal to a bull, and renders the second citation more directly. Both quotations remain under the single introductory reference to Scripture, and the footnote anchors remain correctly placed.
