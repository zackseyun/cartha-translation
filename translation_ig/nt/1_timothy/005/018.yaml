review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the scriptural citation formula, the prohibition concerning an ox during threshing, and the principle that a laborer merits his own wages. However, “Ekela ... ọnụ” is not the clearest Standard Igbo negative imperative for “muzzle”; “Ekechila ... ọnụ” is the natural prohibition. “I nweta” is interpretively acceptable but is not needed for ἄξιος ... τοῦ μισθοῦ αὐτοῦ; the more direct wording preserves the predicative force.
  naturalness: With “Ekechila ehi ọnụ” and the direct “kwesịrị ụgwọ ọrụ ya,” the verse is clear, idiomatic, and appropriately formal in modern Standard Igbo. “Ehi” avoids specifying a bull where βοῦς is a work animal generically.
  terminology: “Akwụkwọ Nsọ,” “ehi,” “ịzọcha ọka,” “onye ọrụ,” and “ụgwọ ọrụ” are suitable Standard Igbo renderings. The singular possessive “ya” appropriately reflects αὐτοῦ without making a theological inference.
  issues:
  - severity: medium
    issue: “Ekela oke ehi ọnụ” is not the most natural or unambiguous Standard Igbo form for “Do not muzzle an ox.”
    rationale: The verb form “Ekechila” naturally expresses the negative command not to tie or shut an animal’s mouth. In addition, “oke ehi” specifically denotes a bull, while βοῦς here need not specify the animal’s sex.
  - severity: low
    issue: “kwesịrị ịnata ụgwọ ọrụ ya” adds an explicit infinitive (“to receive”) absent from the Greek.
    rationale: The meaning is not substantially changed, but “Onye ọrụ kwesịrị ụgwọ ọrụ ya” more directly represents Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ and reads naturally in Igbo.
  revised_text: N’ihi na Akwụkwọ Nsọ na-ekwu, “Ekechila ehi ọnụ mgbe ọ na-azọcha ọka[a],” ọzọkwa, “Onye ọrụ kwesịrị ụgwọ ọrụ ya[b].”
  revised_footnotes:
