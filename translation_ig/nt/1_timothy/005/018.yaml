base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: ig
  text: N’ihi na Akwụkwọ Nsọ na-ekwu, “Ekechila ehi ọnụ mgbe ọ na-azọcha ọka[a],” ọzọkwa, “Onye ọrụ kwesịrị ụgwọ ọrụ ya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe ọ na-azọcha mkpụrụ ọka.” Okwu Grik ahụ na-ekwu maka ehi nọ n’ọrụ ịzọcha ọka.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “Onye ọrụ kwesịrị ụgwọ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: N’ihi na Akwụkwọ Nsọ na-ekwu
  rationale: “N’ihi na” na-egosi njikọ nkọwa nke γάρ na amaokwu bu ụzọ; “Akwụkwọ Nsọ” bụ ụzọ Igbo si ekwu maka γραφή dị ka ihe odide nsọ nwere ikike, ebe “na-ekwu” na-echekwa oge ugbu a nke λέγει.
- source_word: Βοῦν
  choice: oke ehi
  rationale: βοῦς ebe a bụ ehi nwoke a na-eji arụ ọrụ ugbo; “oke ehi” na-akọwa ya nke ọma n’Igbo nkịtị.
- source_word: ἀλοῶντα
  choice: mgbe ọ na-azọcha ọka
  rationale: 'Nkebi okwu a na-egosi ihe oke ehi ahụ na-eme n’otu oge ahụ: ọ na-azọcha ọka iji kewapụ mkpụrụ ya.'
- source_word: οὐ φιμώσεις
  choice: Ekela ... ọnụ
  rationale: Ọ bụ iwu mgbochi e kwuru nye otu onye. “Ekela ... ọnụ” bụ okwu Igbo dị mkpirikpi ma dịkwa ugwu nke na-egosi igbochi anụmanụ iri ihe mgbe ọ na-arụ ọrụ.
- source_word: καί
  choice: ọzọkwa
  rationale: “Ọzọkwa” jikọtara okwu abụọ e hotara ma mee ka o doo anya na a na-agbakwụnye okwu nke abụọ.
- source_word: Ἄξιος ὁ ἐργάτης
  choice: Onye ọrụ kwesịrị
  rationale: ἐργάτης bụ onye na-arụ ọrụ; “Onye ọrụ” bụ okwu Igbo doro anya nke na-echekwa ịdị n’ozuzu nke ilu ahụ. “Kwesịrị” na-egosipụta ἄξιος n’ụzọ ebumpụta ụwa.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: ịnata ụgwọ ọrụ ya
  rationale: μισθός ebe a bụ ụgwọ e nyere maka ọrụ, ọ bụghị naanị ụgwọ ọrụ n’echiche nke ihe nrite. “Ya” na-echekwa otu onye nke αὐτοῦ.
theological_decisions:
- issue: Ma γραφή ọ na-achịkwa okwu abụọ ahụ e hotara
  choice: E debere okwu abụọ ahụ n’okpuru mmeghe “Akwụkwọ Nsọ na-ekwu,” n’enweghị ịkọwa karịa ihe ederede kwuru.
  alternative: Iwere naanị okwu mbụ dị ka Akwụkwọ Nsọ, ma were nke abụọ dị ka ilu ma ọ bụ okwu Onyenwe anyị nke nọ iche.
  rationale: Usoro ahịrịokwu Grik na-etinye okwu abụọ ahụ n’otu mmeghe ahụ. Nsụgharị ahụ ekwesịghị idozi arụmụka gbasara ókè akwụkwọ nsọ gafere ihe Pọl kwuru n’onwe ya.
- issue: Ụdị otu onye nke αὐτοῦ
  choice: ụgwọ ọrụ ya
  alternative: ụgwọ ọrụ ha
  rationale: “Ya” na-echekwa ụdị otu onye dị na Grik, ọ bụ ezie na ụkpụrụ ahụ gbasara ndị ọrụ n’ozuzu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ekela oke ehi ọnụ” na-echekwa ụda iwu nke okwu e hotara, ebe “kwesịrị ịnata ụgwọ ọrụ ya” na-ada n’ụzọ ebumpụta ụwa nye ndị na-agụ Igbo taa.
