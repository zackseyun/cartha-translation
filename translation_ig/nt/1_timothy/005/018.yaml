    text: A pụkwara ịsị, “mgbe ọ na-azọcha mkpụrụ ọka.” Okwu Grik ahụ na-ekwu maka ehi nọ n’ọrụ ịzọcha ọka.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “Onye ọrụ kwesịrị ụgwọ ya.”
    reason: lexical_alternative
