  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: ig
  text: Mmehie ụfọdụ ndị mmadụ pụtara ìhè[a], na-eburu ha ụzọ ruo n'ikpe[b], ma mmehie ụfọdụ ndị ọzọ na-esochi ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmehie ụfọdụ ndị mmadụ doro anya.”
    reason: lexical_alternative
  - marker: b
    text: “Ikpe” nwere ike ịpụta nyocha a na-eme mmadụ ugbu a n'ọnọdụ okwu a; ma okwu ahụ nwekwara ike izo aka n'ụzọ sara mbara n'ikpe Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: Mmehie ụfọdụ mmadụ
  rationale: Nke a na-egosi na mmehie ndị ahụ bụ nke ụfọdụ mmadụ, n'Igbo dị mfe ma kwekọọ n'usoro echiche Grik.
- source_word: πρόδηλοί
  choice: pụtara ìhè
  rationale: Akpaokwu a bụ Igbo nkịtị nke pụtara na ihe ahụ doro anya ma ọ bụ na a pụrụ ịhụ ya n'ụzọ dị mfe.
- source_word: προάγουσαι
  choice: na-eburu ha ụzọ aga
  rationale: Ọ na-echekwa onyonyo dị na Grik nke mmehie na-aga n'ihu ndị nwe ha; e tinyere “ha” dịka ihe ngwaa ahụ na-emetụta nke a ghọtara site n'ọnọdụ okwu.
- source_word: εἰς κρίσιν
  choice: n'ikpe
  rationale: “Ikpe” na-echekwa obosara okwu κρίσις n'ebughị ụzọ kpebie ma ọ bụ nyocha mmadụ ugbu a ka ọ bụ ikpe Chineke.
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: ma nke ndị ọzọ na-esochi ha n'azụ
  rationale: “Nke ndị ọzọ” na-eme ka o doo anya n'Igbo na isiokwu ka bụ mmehie, ebe “na-esochi ha n'azụ” na-echekwa onyonyo mmehie ndị na-abịa mgbe ndị nwe ha gasịrị.
theological_decisions:
- issue: Ihe “ikpe” (κρίσις) na-ezo aka na ya
  choice: E debere ya naanị dịka “ikpe.”
  alternative: Nnyocha ọgbakọ na-eme ugbu a, ma ọ bụ ikpe ikpeazụ nke Chineke.
  rationale: Ọnọdụ okwu dị nso nwere ike ịrụtụ aka na nyocha a na-eme mmadụ, ma okwu Grik ahụ nwekwara ike ibu nghọta sara mbara banyere ikpe Chineke. Nsụgharị ahụ ekpebighị nke ọ bụla n'ime ha.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ụfọdụ mmadụ” mee ka ἄνθρωπος bụrụ okwu gbasara mmadụ n'ozuzu ya, a hapụkwara ihe “ikpe” pụtara ka ọ nọgide nwee nghọta abụọ okwu Grik kwere.
