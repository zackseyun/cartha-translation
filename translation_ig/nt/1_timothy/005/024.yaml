review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the contrast between sins that are already evident and sins that become evident only later, and it appropriately leaves κρίσις ('judgment') unspecified. However, the final clause needs a clearer, grammatically complete Igbo expression of the ellipted subject, 'sins.'
  naturalness: ‘Mmehie ụfọdụ mmadụ’ is less natural than ‘Mmehie ụfọdụ ndị mmadụ’ for ‘the sins of some people.’ ‘Na-eburu ha ụzọ aga n’ikpe’ is also awkward; ‘na-eburu ha ụzọ ruo n’ikpe’ naturally conveys the directional image. The existing final clause, ‘ma nke ndị ọzọ,’ is structurally unclear because nke is singular and does not clearly identify ‘sins’ as the subject.
  terminology: ‘Mmehie,’ ‘pụta ìhè,’ and ‘ikpe’ are suitable Standard Igbo choices. ‘Ikpe’ properly preserves the source’s contextual and potentially broader ambiguity.
  issues:
  - severity: medium
    issue: The phrase ‘Mmehie ụfọdụ mmadụ’ is not the most natural or unambiguous Standard Igbo possessive expression.
    rationale: Adding ndị makes clear that the phrase means ‘the sins of some people,’ rather than leaving an awkward noun sequence.
  - severity: medium
    issue: ‘na-eburu ha ụzọ aga n'ikpe’ is idiomatically awkward.
    rationale: The participle προάγουσαι means that the sins go ahead of the people toward judgment. ‘Na-eburu ha ụzọ ruo n’ikpe’ expresses this naturally without adding interpretation.
  - severity: medium
    issue: ‘ma nke ndị ọzọ na-esochi ha n'azụ’ does not clearly supply the ellipted subject ‘sins.’
    rationale: The Greek retains ‘sins’ as the understood subject of ἐπακολουθοῦσιν. Repeating mmehie in Igbo resolves the ambiguity; ‘n’azụ’ is redundant with na-esochi.
  revised_text: Mmehie ụfọdụ ndị mmadụ pụtara ìhè[a], na-eburu ha ụzọ ruo n'ikpe[b], ma mmehie ụfọdụ ndị ọzọ na-esochi ha.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmehie ụfọdụ ndị mmadụ doro anya.”
    reason: lexical_alternative
  - marker: b
    text: “Ikpe” nwere ike ịpụta nyocha a na-eme mmadụ ugbu a n'ọnọdụ okwu a; ma okwu ahụ nwekwara ike izo aka n'ụzọ sara mbara n'ikpe Chineke.
    reason: alternative_reading
  revision_rationale: The revision retains the draft’s faithful rendering of the verse and its deliberate ambiguity concerning κρίσις. It makes the possessive construction natural in Standard Igbo, improves the expression of the sins’ preceding their owners to judgment, and explicitly restores ‘sins’ in the second clause so that the Greek ellipsis is clear and idiomatic in Igbo. The footnotes retain their original anchors and meanings.
