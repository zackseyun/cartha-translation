revisions:
- from: Mmehie ụfọdụ mmadụ pụtara ìhè[a], na-eburu ha ụzọ aga n'ikpe[b], ma nke ndị ọzọ na-esochi ha n'azụ.
  to: Mmehie ụfọdụ ndị mmadụ pụtara ìhè[a], na-eburu ha ụzọ ruo n'ikpe[b], ma mmehie ụfọdụ ndị ọzọ na-esochi ha.
  rationale: The revision retains the draft’s faithful rendering of the verse and its deliberate ambiguity concerning κρίσις. It makes the possessive construction natural in Standard Igbo, improves the expression of the sins’ preceding their owners to judgment, and explicitly restores ‘sins’ in the second clause so that the Greek ellipsis is clear and idiomatic in Igbo. The footnotes retain their original anchors and meanings.
