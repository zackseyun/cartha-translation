review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the passive reputation clause, the repeated conditional criteria, child-rearing without implying biological motherhood, hospitality, washing the saints’ feet, and aid to afflicted people. The final “ezi ọrụ niile” is less exact: παντὶ ἔργῳ ἀγαθῷ is distributive singular (“every/each good work”), not plural “all good works.” Removing “n''ụlọ ya” also avoids adding an explicit possessive/location not stated in the Greek, while retaining the verb’s sense of receiving guests.'
  naturalness: The revised Standard Igbo remains clear, formal, and natural. “Ọ gbasiri mbọ ike n’ọrụ ọma ọ bụla” communicates sustained, active commitment without the unnatural literal image of following work.
  terminology: “Ndị nsọ” appropriately preserves ἁγίων, with a clarifying note identifying them as God’s holy people/fellow believers. “Mkpagbu” suitably retains the broad distress/affliction sense and does not limit it to persecution.
  issues:
  - severity: low
    issue: The final object is rendered as plural “ezi ọrụ niile.”
    rationale: 'The Greek reads παντὶ ἔργῳ ἀγαθῷ, distributive singular: “every/each good work.” “Ọrụ ọma ọ bụla” represents this more closely.'
  - severity: low
    issue: “n'ụlọ ya” explicitly adds “her home.”
    rationale: ἐξενοδόχησεν denotes receiving guests/strangers, but the Greek does not explicitly state “her home.” “Ọ nabatara ndị ọbịa” preserves the sense without that addition.
  revised_text: 'A gbara ya ezi akaebe maka ezi ọrụ ya: ma ọ bụrụ na ọ zụlitere ụmụaka[a], ma ọ bụrụ na ọ nabatara ndị ọbịa, ma ọ bụrụ na ọ sara ndị nsọ[b] ụkwụ, ma ọ bụrụ na o nyeere ndị nọ ná mkpagbu aka, ma ọ bụrụkwa na ọ gbasiri mbọ ike n’ọrụ ọma ọ bụla.[c]'
