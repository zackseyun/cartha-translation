id: 1TI.5.10
reference: 1 Timothy 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: ig
  text: 'A gbara ya ezi akaebe maka ezi ọrụ ya: ma ọ bụrụ na ọ zụlitere ụmụaka[a], ma ọ bụrụ na ọ nabatara ndị ọbịa, ma ọ bụrụ na ọ sara ndị nsọ[b] ụkwụ, ma ọ bụrụ na o nyeere ndị nọ ná mkpagbu aka, ma ọ bụrụkwa na ọ gbasiri mbọ ike n’ọrụ ọma ọ bụla.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik kwuru naanị “zụlitere ụmụaka”; ọ naghị ekwu kpọmkwem na ha bụ ụmụ nke ya mụrụ.
    reason: preserve_ambiguity
  - marker: b
    text: “Ndị nsọ” n'ebe a bụ ndị Chineke doro nsọ, ya bụ, ndị kwere ekwe ibe ya.
    reason: lexical_clarification
  - marker: c
    text: A pụkwara ịsụgharị ya, “ọ gbasochiri ọrụ ọma ọ bụla.” Okwu Grik ahụ na-egosi iji ịnụ ọkụ n'obi na ntachi obi na-achụso ezi ọrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: A gbara ya ezi akaebe maka ezi ọrụ ya
  rationale: Nke a na-edobe echiche nke akaebe ndị ọzọ na-agba banyere àgwà ya, na ezi ọrụ ya bụ ihe e ji mara ya.
- source_word: ἐτεκνοτρόφησεν
  choice: ọ zụlitere ụmụaka
  rationale: Ngwaa Grik a pụtara ilekọta na ịzụlite ụmụaka; ọ naghị ekwu kpọmkwem na ha bụ ụmụ nke nwanyị ahụ mụrụ.
- source_word: ἐξενοδόχησεν
  choice: ọ nabatara ndị ọbịa n'ụlọ ya
  rationale: Nke a na-egosipụta kpọmkwem omume ịnabata ndị ọbịa ma ọ bụ ndị bịara abịa n'ụlọ, ọ bụghị naanị inwe mmụọ ile ọbịa n'ozuzu.
- source_word: ἁγίων πόδας ἔνιψεν
  choice: ọ sara ndị nsọ ụkwụ
  rationale: A hapụrụ omume ịsa ụkwụ ahụ n'ụzọ doro anya n'ihi na ọ bụ ọrụ ịdị umeala n'obi a kpọrọ aha kpọmkwem.
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: o nyeere ndị nọ ná mkpagbu aka
  rationale: Nkebi a sara mbara ma na-agụnye ndị nọ ná nsogbu, nhụjuanya, ma ọ bụ nrụgide, n'emeghị ka ọ bụrụ naanị mkpagbu n'ihi okwukwe.
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: ọ gbasiri mbọ ike ịrụ ezi ọrụ niile
  rationale: Nke a na-egosi ịchụso ezi ọrụ na itinye onwe ya na ya n'ụzọ na-aga n'ihu, kama ntụgharị Igbo na-adịghị eke nke ga-asị na ọ 'soro ọrụ n'azụ.'
theological_decisions:
- issue: Ndị ἅγιοι bụ ndị ndị?
  choice: ndị nsọ
  alternative: ndị kwere ekwe; ndị Chineke doro nsọ
  rationale: N'akwụkwọ Pọl, okwu a na-ezokarị aka n'ebe ndị Chineke kewapụrụ onwe ya nọ, ya bụ, ndị kwere ekwe. Ide ya 'ndị nsọ' na-edobe okwu isi ahụ n'ebughị ozizi otu ụka kpọmkwem bata.
- issue: Ihu ọrụ nwanyị ahụ n'ebe ụmụaka nọ
  choice: ọ zụlitere ụmụaka
  alternative: ọ zụlitere ụmụ nke ya
  rationale: Grik ekwughị na ụmụaka ahụ aghaghị ịbụ ụmụ o ji afọ ya mụọ; ya mere, a hapụrụ mmekọrịta ahụ ghe oghe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere usoro “ma ọ bụrụ na” ugboro ugboro iji gosipụta ndepụta ihe ndị e ji agba nwanyị ahụ akaebe. E zere okwu ụka pụrụ iche na nkọwa na-emechi ihe Grik hapụrụ ghe oghe.
