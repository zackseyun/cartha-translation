id: 1TI.5.13
reference: 1 Timothy 5:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: ig
  text: N'otu oge ahụ, ha na-amụtakwa ịdị umengwụ, na-agagharị site n'otu ụlọ gaa n'ọzọ. Ọ bụghịkwa naanị na ha dị umengwụ, kama ha bụkwa ndị na-ekwu okwu efu[a] na ndị na-etinye aka n'ihe na-adịghị ha mkpa[b], na-ekwu ihe ha na-ekwesịghị ikwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị na-agba asịrị.” Okwu Grik ahụ pụkwara izo aka n'okwu nzuzu ma ọ bụ okwu efu n'ụzọ sara mbara, ọ bụ ezie na n'ebe a o yikarịrị ka ọ gụnyere asịrị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ndị na-etinye ọnụ n'ihe ndị ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: N'otu oge ahụ, ha na-amụtakwa
  rationale: Nke a na-egosi ma ihe na-eme n'otu oge ma echiche mgbakwunye dị n'okwu Grik ahụ, n'Igbo na-ada nke ọma.
- source_word: ἀργαὶ
  choice: ịnọ nkịtị
  rationale: Ọ na-egosi enweghị ọrụ ma ọ bụ ịnọ n'enweghị ihe a na-arụ, ọ bụghị naanị ịdị umengwụ n'omume. E chekwara nkwughachi ya n'amaokwu ahụ.
- source_word: μανθάνουσιν
  choice: na-amụtakwa
  rationale: N'ebe a, ngwaa ahụ na-egosi ịmụta ma ọ bụ ịzụlite omume; njikọ ya na ‘ịnọ nkịtị’ mezuru echiche ahụ n'Igbo.
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: na-agagharị site n'ụlọ ruo n'ụlọ
  rationale: Ọ na-egosi ịga n'otu ụlọ gaa n'ụlọ ọzọ, dịka participle na object Grik si dị.
- source_word: φλύαροι
  choice: ndị na-ekwu okwu efu
  rationale: Okwu Grik ahụ nwere ike ịpụta ikwu okwu nzuzu, okwu efu, ma ọ bụ asịrị. Nhọrọ a na-edobe obosara ihe okwu ahụ pụrụ ịpụta, ebe nkọwa ala peeji na-egosi ‘ịgba asịrị’ dịka nhọrọ dabara n'ọnọdụ a.
- source_word: περίεργοι
  choice: ndị na-etinye aka n'ihe na-agbasaghị ha
  rationale: Nke a na-akọwa itinye aka n'ụzọ na-ekwesịghị ekwesị n'ihe ndị ọzọ, n'asụsụ Igbo doro anya nye ndị na-agụ akwụkwọ taa.
- source_word: λαλοῦσαι
  choice: na-ekwu
  rationale: Ngwaa dị mfe a na-ejikọta nke ọma na ihe na-esochi ya ma ghara ịgbakwụnye echiche na-adịghị na Grik.
- source_word: τὰ μὴ δέοντα
  choice: ihe ha na-ekwesịghị ikwu
  rationale: Nke a na-egosi ihe na-ekwesịghị ekwesị ma mee ka o doo anya na okwu ahụ gbasara ihe a na-ekwu, dịka λαλοῦσαι si gosi.
theological_decisions:
- issue: Ntụaka okike dị na adjective na participle ndị dị n'ụdị feminine plural
  choice: ha ... na-agagharị ... ndị na-ekwu okwu efu ... ndị na-etinye aka
  alternative: ụmụ nwanyị ndị a ...
  rationale: Ụdị Grik ahụ na-ezo aka kpọmkwem n'ụmụ nwanyị di ha nwụrụ ka dị obere n'amaokwu ndị gbara ya gburugburu. Igbo anaghị ekewa ‘ha’ dịka nwoke ma ọ bụ nwanyị, ya mere e debere ntụaka sitere n'ọnọdụ amaokwu ahụ n'enweghị ikwughachi ‘ụmụ nwanyị’ nke na-adịghị mkpa.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke ‘ịnọ nkịtị,’ ma kọwaa περίεργοι n'ụzọ eke kama iji otu aha Igbo nwere ike ghara ido ndị niile na-agụ akwụkwọ anya.
