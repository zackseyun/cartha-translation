  verdict: revise
  source_fidelity: A na-edobe usoro na isi echiche nke Grik ahụ nke ọma, gụnyere nkwughachi ἀργαί, ịgagharị n’ụlọ dị iche iche, na ikwu ihe na-ekwesịghị ekwesị. Otú ọ dị, “ịnọ nkịtị” pụtara ịdị jụụ ma ọ bụ ịghara ikwu okwu n’Igbo, ọ bụghị ἀργαί (“ịdị umengwụ/ịnọ n’enweghị ọrụ”). Ya mere ọ na-atụgharị isi okwu ahụ n’ụzọ na-ezighị ezi.
  naturalness: Ntụgharị ahụ na-adịkarị mfe ọgụgụ, ma “ihe na-agbasaghị ha” abụghị okwu Standard Igbo eke maka ihe na-adịghị onye mkpa ma ọ bụ ihe na-adịghị gbasara onye ahụ. “Ndị na-etinye aka n’ihe na-adịghị ha mkpa” doro anya ma dabara n’ọnọdụ a.
