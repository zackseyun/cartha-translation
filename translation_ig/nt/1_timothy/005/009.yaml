review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys official enrollment and the minimum-age qualification in intent, but its age wording is semantically defective: “ọ rughị ihe na-erughị afọ iri isii” is an unnatural and potentially self-contradictory double-negative expression. The final Greek idiom should remain formally open rather than be resolved as a single marriage.'
  naturalness: “anyịanyị” is not appropriate Standard Igbo in this context; “nwanyị” is required throughout. “Eruola afọ iri isii” is a clear, natural way to state that she has attained sixty years of age. “Nwunye nke otu di” preserves the deliberately formal, somewhat idiomatic quality of the Greek while remaining understandable.
  terminology: Use “nwanyị di ya nwụrụ” for χήρα and “denye ... n’akwụkwọ aha” for the official-list sense of καταλεγέσθω. Retain “nwunye nke otu di” and explain the principal interpretive options in a footnote without deciding the disputed sense.
  issues:
  - severity: high
    issue: The main text and footnote use “anyịanyị” rather than “nwanyị.”
    rationale: This is not suitable Standard Igbo wording and impairs comprehensibility; it must be corrected everywhere.
  - severity: high
    issue: The age phrase “ọ rughị ihe na-erughị afọ iri isii” is malformed and can obscure the minimum-age requirement.
    rationale: The Greek requires that the widow be at least sixty. “Eruola afọ iri isii” clearly expresses attainment of that threshold.
  - severity: medium
    issue: The alternative rendering in the footnote says “otu nwoke,” while the main idiom concerns a husband.
    rationale: “Nwoke” is broader than “di.” The footnote should use wording that accurately presents the idiomatic alternative while explaining its possible sense.
  revised_text: Ka e denye nwanyị di ya nwụrụ n’akwụkwọ aha naanị ma ọ bụrụ na o eruola afọ iri isii, bụrụkwa nwunye nke otu di.[a]
