- from: Ka e denye nwanyị di ya nwụrụ n'akwụkwọ aha naanị ma ọ bụrụ na ọ rughị ihe na-erughị afọ iri isii, bụrụkwa nwanyị nke otu di.[a]
  to: Ka e denye nwanyị di ya nwụrụ n’akwụkwọ aha naanị ma ọ bụrụ na o eruola afọ iri isii, bụrụkwa nwunye nke otu di.[a]
  rationale: The revision corrects the nonstandard/reduplicated noun and replaces the defective age expression with idiomatic Standard Igbo that accurately states the minimum age. It preserves the administrative sense of enrollment and retains the ambiguity of ἑνὸς ἀνδρὸς γυνή in the main text, with a non-doctrinal explanatory footnote.
