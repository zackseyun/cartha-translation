  text: Χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα, ἑνὸς ἀνδρὸς γυνή,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: ig
  text: Ka e denye nwanyị di ya nwụrụ n’akwụkwọ aha naanị ma ọ bụrụ na o eruola afọ iri isii, bụrụkwa nwunye nke otu di.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nwanyị nke otu nwoke.” Okwu a nwere ike ịpụta na o kwesịrị ntụkwasị obi n’alụmdi na nwunye ma ọ bụ na o nwere aha ọma n’ihe gbasara alụmdi na nwunye; ụfọdụ na-aghọtakwa ya dịka, “onye lụrụ di naanị otu ugboro.”
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: anyịanyị di ya nwụrụ
  rationale: Nke a bụ okwu Igbo doro anya maka nwanyị onye di ya nwụrụ, dịka ọnọdụ amaokwu a si dị.
- source_word: καταλεγέσθω
  choice: ka e denye ... n'akwụkwọ aha
  rationale: Ọ na-egosi itinye mmadụ n'usoro aha a kwadoro, ọ bụghị naanị ichebara ya echiche.
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: naanị ma ọ bụrụ na ọ rughị ihe na-erughị afọ iri isii
  rationale: Nke a na-egosi afọ kacha nta a chọrọ, ma na-enye γεγονυῖα echiche nke iru afọ ahụ.
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: anyịanyị nke otu di
  rationale: Nsụgharị a na-edobe usoro okwu Grik na mgbagwoju anya ya n'ebughị ụzọ kpebie ma ọ pụtara ikwesị ntụkwasị obi n'alụmdi na nwunye ka ọ bụ ịlụ naanị otu ugboro.
theological_decisions:
- issue: Ihe ἑνὸς ἀνδρὸς γυνή pụtara
  choice: anyịanyị nke otu di
  alternative: anyịanyị kwesịrị ntụkwasị obi nye di ya; ma ọ bụ nwanyị lụrụ di naanị otu ugboro
  rationale: Isi okwu Grik nwere ike imetụta omume na aha ọma n'alụmdi na nwunye, ma ụfọdụ na-aghọta ya dịka ịlụ di naanị otu ugboro. E debere mgbagwoju anya ahụ n'ahịrị bụ isi ma kọwaa ya n'okpuru.
translation_notes:
  register: Standard Igbo; okwu dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. E ji “akwụkwọ aha” mee ka ọrụ nchịkwa nke καταλεγέσθω pụta ìhè.
