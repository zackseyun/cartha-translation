- from: N’ihi na ụfọdụ ahapụworị ụzọ ahụ wee soro Setan.[a]
  to: N’ihi na ụfọdụ ahapụworị ụzọ ha wee soro Setan.
  rationale: The revision retains the causal connector, completed ‘already’ force, unspecified ‘some,’ the metaphorical departure expressed by ἐξετράπησαν, and the directional/allegiance sense of ὀπίσω τοῦ Σατανᾶ. It removes an inaccurate footnote and replaces the overly definite “ụzọ ahụ” with the natural idiom “ụzọ ha.”
  reviewer_model: gpt-5.6-terra
