id: 1TI.5.15
reference: 1 Timothy 5:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: ig
  text: N’ihi na ụfọdụ ahapụworị ụzọ ha wee soro Setan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: -worị
  rationale: Akara mmecha “-worị” na-egosi na nke a emeelarị tupu ugbu a ma ka metụta ọnọdụ a na-ekwu maka ya.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka ihe kpatara ya ma ọ bụ nkọwa ya.
- source_word: τινες
  choice: ụfọdụ
  rationale: Ọ na-ezo aka n’otu akụkụ ndị a na-akpọghị aha kpọmkwem.
- source_word: ἐξετράπησαν
  choice: ahapụworị ụzọ ahụ
  rationale: Nke a na-enye n’Igbo dị mfe ihe atụ nke isi n’ụzọ kwesịrị ekwesị wezuga onwe onye, n’enweghị itinye echiche na onye ọzọ manyere ha ime ya.
- source_word: ὀπίσω
  choice: wee soro
  rationale: Mgbe okwu a jikọrọ ya na mmadụ, ọ na-egosi ịga n’azụ onye ahụ ma ọ bụ iso ya; “wee soro” na-eme ka ihe ọ pụtara doo anya n’Igbo ugbu a.
- source_word: Σατανᾶ
  choice: Setan
  rationale: Nke a bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị ὀπίσω τοῦ Σατανᾶ dịka ịnọ “n’azụ Setan” n’ụzọ nkịtị, ka ọ bụ dịka iso Setan.
  choice: wee soro Setan
  alternative: n’azụ Setan
  rationale: “Iso Setan” na-egosipụta nke ọma echiche nke ịtụgharị gaa n’akụkụ ya ma ọ bụ iso nduzi ya, ebe ihe odide ala peeji na-echekwa ọdịdị okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-echekwa njikọ ihe kpatara ya, oge omume ahụ, na ihe atụ nke ịhapụ ụzọ iji soro Setan.
