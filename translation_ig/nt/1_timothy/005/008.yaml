id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla adịghị egboro ndị nke ya mkpa ha[a], karịchaa ndị nọ n’ezinụlọ ya, ọ gọnarịala okwukwe ahụ[b], ọ dịkwa njọ karịa onye na-ekweghị ekwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị ya.” Nkebiokwu a sara mbara karịa naanị ndị bi n’okpuru otu ụlọ; “ndị nọ n’ezinụlọ ya” na-akọwapụtakwa ndị o ji ọrụ pụrụ iche ilekọta.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ jụla okwukwe ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: onye ọ bụla
  rationale: Ọ na-egosi onye ọ bụla n’ozuzu ya, n’akọwaghị na ọ bụ naanị nwoke ma ọ bụ naanị nwaanyị.
- source_word: τῶν ἰδίων
  choice: ndị nke ya
  rationale: Nkebiokwu a sara mbara karịa naanị ndị bi n’otu ụlọ; ọ pụrụ ịgụnye ndị ikwu ma ọ bụ ndị ọzọ onye ahụ ji ọrụ ilekọta.
- source_word: μάλιστα
  choice: karịchaa
  rationale: Ọ na-eme ka otu ìgwè dị n’ime ìgwè sara mbara pụta ìhè dị ka ndị e kwesịrị ilekọta n’ụzọ pụrụ iche.
- source_word: οἰκείων
  choice: ndị nọ n’ezinụlọ ya
  rationale: Nke a na-ezo aka kpọmkwem n’ebe ndị so n’ụlọ ma ọ bụ n’ezinụlọ onye ahụ nọ, n’enweghị ime ka ọ bụrụ naanị ndị ikwu n’ọbara.
- source_word: προνοεῖ
  choice: adịghị egboro ... mkpa ha
  rationale: N’ebe a, ngwaa ahụ pụtara ibu ụzọ chebara ndị mmadụ echiche ma lekọta ha n’omume, ọkachasị site n’inye ha ihe ndị dị ha mkpa.
- source_word: τὴν πίστιν
  choice: okwukwe ahụ
  rationale: Nkọwa okwu a n’ebe a bụ okwukwe Ndị Kraịst onye ahụ na-ekwupụta, ọ bụghị naanị ntụkwasị obi dị n’obi.
- source_word: ἤρνηται
  choice: ọ gọnarịala
  rationale: Ụdị ngwaa Grik ahụ na-egosi omume e mewororị nke ọnọdụ ya ka dị ugbu a; “ọ gọnarịala” na-echekwa ma oge ahụ ma ịdị arọ nke nkwupụta ahụ.
- source_word: ἀπίστου
  choice: onye na-ekweghị ekwe
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’onye na-enweghị okwukwe, ọ bụghị naanị onye a na-apụghị ịtụkwasị obi.
- source_word: χείρων
  choice: njọ karịa
  rationale: Ọ na-egosi ntụnyere n’ihe metụtara ikpe omume, ma bụrụkwa okwu doro anya nye ndị na-agụ Igbo taa.
theological_decisions:
- issue: Ma ahịrịokwu ahụ ọ bụ naanị maka nwoke
  choice: Jiri “onye ọ bụla” mee ka ọ gbasaa nye mmadụ niile.
  alternative: Jiri okwu ga-akọwa kpọmkwem “nwoke ọ bụla.”
  rationale: Ọ bụ ezie na nhazi ụtọasụsụ Grik dị n’otu onye ma na-eji usoro nwoke, τις nwere ike ịrụ ọrụ izugbe. Igbo achọghị ịmanye okike mmadụ n’ebe isi mmalite ahụ na-ekwu maka onye ọ bụla.
- issue: Ihe τὴν πίστιν pụtara
  choice: “okwukwe ahụ,” ya bụ okwukwe Ndị Kraịst a na-ekwupụta
  alternative: Okwukwe dị ka ntụkwasị obi nke onwe, ma ọ bụ ikwesị ntụkwasị obi
  rationale: N’akwụkwọ ndị a, nkebiokwu nwere kpọmkwem article a na-ezokarị aka n’okwukwe a na-ekwupụta. Amaokwu ahụ na-ekwu na omume onye ahụ emegidewo nkwupụta okwukwe ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwụ ọtọ ma dị ùgwù. “Igbọrọ ... mkpa” na-eme ka nlekọta a bụrụ enyemaka bara uru n’omume, ebe “ndị nke ya” na-echekwa obosara nke τῶν ἰδίων tupu ahịrịokwu ahụ akọwapụta ndị nọ n’ezinụlọ ya.
