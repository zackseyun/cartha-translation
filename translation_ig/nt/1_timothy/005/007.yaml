  yaml_path: translation/nt/1_timothy/005/007.yaml
  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: ig
  text: Nye kwa iwu[a] banyere ihe ndị a, ka ha ghara inwe ihe a ga-eji taa ha ụta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kụziekwa ihe ndị a” ma ọ bụ “duziekwa ha n'ihe ndị a”; ngwaa Grik ahụ nwere ikike nke inye iwu.
    reason: lexical_alternative
  - marker: b
    text: Grik ekwughị kpọmkwem ndị “ha” bụ. N'ihe gbara amaokwu a gburugburu, o yikarịrị ka ọ na-ezo aka ná ndị ntụziaka ndị gara aga gbasara, karịsịa ndị inyom di ha nwụrụ na ezinụlọ ha.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Nyekwa
  rationale: E jikọtara njikọ καὶ na ngwaa dị ka “Nyekwa” ka Igbo wee daa nke ọma ma gosipụta na iwu a na-aga n'ihu n'ihe ndị e kwuru tupu ya.
- source_word: ταῦτα
  choice: banyere ihe ndị a
  rationale: “Ihe ndị a” na-ezo n'ụzọ doro anya ma na-enweghị ịkọwapụta gabiga ókè n'iwu ndị e kwuru n'akụkụ a.
- source_word: παράγγελλε
  choice: nye iwu
  rationale: Ngwaa a bụ iwu dị ugbu a nke nwere ikike; “nye iwu” na-echekwa ike ya karịa naanị “kụziere” ma ọ bụ “duzie.”
- source_word: ἵνα
  choice: ka
  rationale: “Ka” bụ ụzọ Igbo nkịtị si webata ebumnuche ma ọ bụ ihe a chọrọ ka o si na ya pụta.
- source_word: ἀνεπίλημπτοι
  choice: ghara inwe ihe a ga-eji taa ha ụta
  rationale: Nkebiokwu a na-egosi na e kwesịghị inwe ezi ihe a ga-eji bo ha ebubo ma ọ bụ taa ha ụta, n'ebughị echiche nke izu oke na-enweghị mmehie.
- source_word: ὦσιν
  choice: ha ghara inwe
  rationale: A tụgharịrị ụdị subjunctive a n'ụzọ ebumnuche dabara n'usoro Igbo; “ha” na-edobe isiokwu ọtụtụ nke Grik hapụrụ n'ekwughị kpọmkwem.
theological_decisions:
- issue: Ndị nnọchiaha ọtụtụ dị na “ka ha ghara inwe ihe a ga-eji taa ha ụta” na-ezo aka na ha
  choice: E ji “ha” mee ihe n'ekwughị kpọmkwem ndị ọ bụ.
  alternative: Ịkpọ ha ndị inyom di ha nwụrụ na ezinụlọ ha, ma ọ bụ Timoti na ọgbakọ n'ozuzu.
  rationale: Grik ekwughị isiokwu ọtụtụ ahụ kpọmkwem. Ihe gbara amaokwu ahụ gburugburu na-egosi karịsịa ndị inyom di ha nwụrụ na ezinụlọ ha, ma ịkpọ ha aha n'ahịrị bụ idozi ihe ederede hapụrụ ghe oghe.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. A họọrọ “taa ha ụta” kama okwu pụrụ ịdị ka mmadụ ga-abụ onye zuru oke kpamkpam; e debere nnọchiaha “ha” n'amaghị kpọmkwem ndị ọ na-ezo aka na ha, dịka Grik si mee.
