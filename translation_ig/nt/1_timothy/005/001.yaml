  source_fidelity: 'Ntụgharị ahụ na-esochi Grik nke ọma: Πρεσβυτέρῳ ka a ghọtara dịka nwoke meworo agadi, n’ihi ọdịiche ya na ụmụ okorobịa; μὴ ἐπιπλήξῃς bụ “Abarala ... mba”; παρακάλει bụ arịrịọ dị nro n’ọnọdụ a; ntụnyere nna na ụmụnne nwoke ka edobekwara. Okwu “jiri nkwanye ùgwù” na-akọwa ụda arịrịọ ahụ n’ụzọ kwekọrọ na ọdịiche dị n’etiti ịba mba na ịrịọ, ọ naghị agbanwe ihe amaokwu ahụ pụtara.'
  naturalness: Igbo ahụ bụ Standard Igbo doro anya ma na-agụ nke ọma. “Abarala nwoke meworo agadi mba” na “rịọ ya dị ka nna” bụ nkebiokwu eke. “Rịọkwa ụmụ okorobịa dị ka ụmụnne nwoke” na-edobe ellipsis nke ngwaa ahụ n’ụzọ Igbo na-anabata, ma na-eme ka usoro amaokwu ahụ dị mkpirikpi.
  terminology: “Nwoke meworo agadi” dabara nke ọma karịa “okenye” n’ederede isi, ebe “okenye” ka edobere n’akara ụkwụ dịka nhọrọ ọzọ nwere ike ịpụta okenye ọgbakọ. “Ụmụ okorobịa” na “ụmụnne nwoke” na-echekwa ọdịiche nwoke nke Grik. Akara ụkwụ [a] nọ kpọmkwem n’ebe Πρεσβυτέρῳ dị ma na-akọwa ambiguity ahụ n’ụzọ ziri ezi.
