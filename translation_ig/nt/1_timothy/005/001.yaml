id: 1TI.5.1
reference: 1 Timothy 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: ig
  text: Abarala nwoke meworo agadi mba[a], kama jiri nkwanye ùgwù rịọ ya dị ka nna; rịọkwa ụmụ okorobịa dị ka ụmụnne nwoke,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Abarala okenye mba n’ụzọ siri ike.” Okwu Grik a nwere ike ịpụta “nwoke meworo agadi” ma ọ bụ “okenye”; ma ntụnyere ya na ụmụ okorobịa n’ebe a na-akwado “nwoke meworo agadi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: nwoke meworo agadi
  rationale: Ọ bụ adjective e ji mee noun n’ebe a. Ntụnyere ya na νεωτέρους (‘ụmụ okorobịa’) na nkewa ndị nwoke na ndị nwanyị n’amaokwu na-esote na-akwado nghọta nke afọ ndụ karịa ọkwa ‘okenye’ n’ọgbakọ.
- source_word: μὴ ἐπιπλήξῃς
  choice: Abarala ... mba
  rationale: Akpaokwu Igbo a na-enye echiche nke ịba mmadụ mba ma ọ bụ ịkatọ ya; a hapụrụ okwu na-akọwa oke ike nke mba ahụ ka a ghara ịgbakwunye ihe Grik na-ekwughị kpọmkwem.
- source_word: ἀλλὰ παρακάλει
  choice: kama jiri nkwanye ùgwù rịọ ya
  rationale: παρακαλέω nwere ike ịpụta ịrịọ, ịgba ume, ma ọ bụ ịdụ ọdụ. N’ihi ntụnyere ezinụlọ na ọdịiche ya na ịba mba, ‘jiri nkwanye ùgwù rịọ ya’ na-egosipụta omume dị nro na nke nsọpụrụ n’ụzọ Igbo doro anya.
- source_word: ὡς πατέρα
  choice: dị ka nna
  rationale: Nke a na-edobe ntụnyere ὡς n’ụzọ Igbo dị mfe ma kwụ ọtọ.
- source_word: νεωτέρους
  choice: ụmụ okorobịa
  rationale: Okwu ahụ bụ masculine plural, amaokwu na-esotekwa na-ekewa ụmụ nwanyị iche; ya mere nsụgharị a na-edobe nkewa nwoke nke isi mmalite.
- source_word: ὡς ἀδελφούς
  choice: dị ka ụmụnne nwoke
  rationale: ‘Ụmụnne nwoke’ na-edobe masculine plural na ntụnyere ezinụlọ, n’etinyeghị ‘n’okwukwe,’ nke na-adịghị n’ihe odide Grik.
theological_decisions:
- issue: Ma Πρεσβυτέρῳ ọ pụtara onye ndu ọgbakọ ka ọ bụ nwoke meworo agadi
  choice: nwoke meworo agadi
  alternative: okenye ọgbakọ
  rationale: 'Usoro gbara amaokwu ahụ gburugburu bụ nke afọ ndụ na okike: nwoke meworo agadi/nna, ụmụ okorobịa/ụmụnne nwoke, e mesịa ụmụ nwanyị meworo agadi/ndị nne na ụmụ agbọghọ/ụmụnne nwanyị. Nke a na-akwado nghọta nke afọ ndụ, ma ihe odide ahụ ka nwere ike ịpụta ‘okenye.’'
- issue: Ma ἀδελφούς ò kwesịrị ịbụ okwu na-agụnye nwoke na nwanyị
  choice: ụmụnne nwoke
  alternative: ụmụnne nwoke na nwanyị
  rationale: N’ebe a, masculine plural so n’usoro na-ekewa ndị mmadụ dabere n’afọ ndụ na okike; ya mere e kwesịrị idobe ntụaka kpọmkwem n’ebe ụmụ nwoke nọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. ‘Jiri nkwanye ùgwù rịọ ya’ na-eme ka ọdịiche dị n’etiti ịba mba na ịgwa onye dị ka nna pụta ihe n’ụzọ dabara n’omume Igbo. Akara ụkwụ [a] dị n’isiokwu ahụ.
