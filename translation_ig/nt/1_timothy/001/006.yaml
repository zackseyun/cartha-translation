  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὧν τινες ἀστοχήσαντες ἐξετράπησαν εἰς ματαιολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/006.yaml
  text: Some[a], having missed these things, have turned aside to empty talk[b],
translation:
  language: ig
  text: Ụfọdụ mmadụ, ebe ha siri n’ihe ndị a kpafuo, atụgharịala gaa n’okwu efu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “mkparịta ụka na-abaghị uru” ma ọ bụ “okwu na-enweghị isi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν
  choice: ihe ndị a
  rationale: Ọ na-arụtụ aka n’ihe ndị e kwuru tupu ya n’amaokwu nke 5. Nsụgharị a na-eme ka njikọ ahụ doo anya n’Igbo, ma ọ naghị amachibido ihe ọ na-arụtụ aka nanị n’otu ihe.
- source_word: τινες
  choice: Ụfọdụ ndị mmadụ
  rationale: Ọ na-egosi ìgwè mmadụ a na-akọwaghị kpọmkwem. Okwu a bụ Igbo doro anya ma na-edobe enweghị nkọwa kpọmkwem dị n’asụsụ Grik.
- source_word: ἀστοχήσαντες
  choice: ebe ha na-enwetaghị
  rationale: Ngwaa ahụ pụtara ịghara iru ihe e bu n’obi ma ọ bụ ịhapụ ụzọ e ji aga ya. Nhọrọ a na-egosi na ha erughị ihe ndị e kwuru na mbụ, n’enweghị ịgbakwụnye ebumnobi ọjọọ nke okwu Grik ekwughị kpọmkwem.
- source_word: ἐξετράπησαν
  choice: esiwo n’ụzọ wezuga onwe ha
  rationale: Nke a na-edobe ihe atụ nke isi n’ụzọ kwesịrị ekwesị wezuga onwe mmadụ. Ọ na-egosikwa ọnọdụ rụpụtara ruo ugbu a.
- source_word: εἰς
  choice: banye n’
  rationale: 'Ọ na-egosi mmegharị na nsonaazụ: ha si n’ụzọ pụọ wee daba n’ụdị okwu a.'
- source_word: ματαιολογίαν
  choice: okwu efu
  rationale: Ọ pụtara okwu na-abaghị uru, nke na-enweghị ezi mkpụrụ. ‘Okwu efu’ dị nkenke, bụrụkwa okwu Igbo ndị mmadụ na-aghọta nke ọma.
theological_decisions:
- issue: Ihe ὧν na-arụtụ aka na ya
  choice: A sụgharịrị ya n’ozuzu dịka ‘ihe ndị a,’ na-arụtụ aka n’ebumnobi na àgwà ime mmụọ ndị e kwuru n’amaokwu nke 5.
  alternative: 'A pụrụ ịghọta ya dịka ihe atọ ahụ kpọmkwem: obi dị ọcha, akọ na uche dị mma, na okwukwe na-enweghị ihu abụọ.'
  rationale: Ụdị okwu Grik na-eleghachi anya n’ihe e kwuru tupu ya, ma ọ naghị amanye ka e mechie ihe ọ na-arụtụ aka n’otu ndepụta dị warara. ‘Ihe ndị a’ na-edobe ohere ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ ihe atụ nke isi n’ụzọ wezuga onwe mmadụ, ma zere okwu ochie ma ọ bụ okwu pụrụ iche nke otu ụka.
