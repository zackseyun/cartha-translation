  rationale: “Siri n’ihe ndị a kpafuo” is a natural Igbo rendering of the contextual sense of ἀστοχήσαντες and preserves the non-specific backward reference. “Atụgharịala gaa n’okwu efu” idiomatically conveys ἐξετράπησαν εἰς ματαιολογίαν. Footnote a is removed because its proposed alternative is no longer needed and the main wording directly reflects that lexical sense; footnote b remains anchored to “okwu efu.”
