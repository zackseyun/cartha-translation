id: 1TI.1.11
reference: 1 Timothy 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: ig
  text: dị ka oziọma nke ebube nke Chineke dị ngọzi[a] si dị, bú nke e nyefere n’aka m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ Igbo ka mfe, “oziọma dị ebube nke Chineke dị ngọzi.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: dị ka … si dị
  rationale: Nke a na-egosi ụkpụrụ ma ọ bụ ihe okwu ndị bu ya ụzọ kwekọrọ na ya; ọ bụkwa ụzọ Igbo si ekwu ‘according to’ n'ụzọ doro anya.
- source_word: εὐαγγέλιον
  choice: oziọma
  rationale: ‘Oziọma’ bụ okwu Igbo a maara nke ọma maka ozi ọma banyere nzọpụta, ma ọ na-echekwa ibu okwu ahụ nwere n’akwụkwọ Pọl.
- source_word: τῆς δόξης
  choice: nke ebube
  rationale: E debeere usoro genitive Grik ahụ ka ọ bụrụ ‘nke ebube,’ kama ịgbanwe ya ozugbo ka ọ bụrụ nkọwa ‘dị ebube’; nke a na-ahapụ njikọ okwu ahụ n’enweghị ịkọwa ya gabiga ókè.
- source_word: μακαρίου
  choice: onye a gọziri agọzi
  rationale: Mgbe e ji ya maka Chineke, okwu a na-egosi onye ngọzi na ùgwù zuru oke dịịrị; ‘onye a gọziri agọzi’ bụ okwu Igbo dị nsọ ma ghara ime ka ọ pụta nanị ‘onye obi dị ụtọ.’
- source_word: θεοῦ
  choice: Chineke
  rationale: Nke a bụ nsụgharị Igbo nkịtị na nke ziri ezi nke θεός.
- source_word: ὃ
  choice: bú nke
  rationale: Ọ na-alaghachi n’‘oziọma’ ma jikọta ya nke ọma na nkebiokwu na-esonụ.
- source_word: ἐπιστεύθην
  choice: e nyefere m n’aka
  rationale: N’ebe a πιστεύω n’ụdị passive pụtara inyefe mmadụ ihe ka ọ lekọta ma ọ bụ rụọ ọrụ ya, ọ bụghị ‘ikwere.’
- source_word: ἐγώ
  choice: m
  rationale: Nnochiaha onye mbụ dị n’ime ngwaa Igbo ahụ; ọnọdụ ya n’‘e nyefere m n’aka’ na-eme ka onye a nyefere ozi ahụ doo anya n’enweghị itinye okwu ọzọ.
theological_decisions:
- issue: Njikọ genitive dị na τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ
  choice: oziọma nke ebube nke Chineke onye a gọziri agọzi
  alternative: oziọma dị ebube nke Chineke onye a gọziri agọzi
  rationale: Isi nsụgharị ahụ na-echekwa ọdịdị okwu Grik, ‘oziọma nke ebube,’ ka a ghara ikpebi ma genitive ahụ bụ nke nwe ihe ma ọ bụ nke na-akọwa àgwà. E nyere ụdị Igbo ka mfe n’ala ala peeji.
- issue: Ihe ἐπιστεύθην pụtara
  choice: e nyefere m n’aka
  alternative: ekwere m
  rationale: N’usoro a, passive nke πιστεύω pụtara na e tinyere oziọma ahụ n’aka Pọl ka ọ lekọta ma kwusaa ya; ọ bụghị nkwupụta na Pọl kweere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma doo anya. A hapụrụ usoro ‘oziọma nke ebube’ n’isi ederede iji chekwaa mgbagwoju anya nke genitive Grik, ma tinye ụdị okwu ka mfe n’ala ala peeji.
