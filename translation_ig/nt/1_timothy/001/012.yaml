id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: ig
  text: Ana m ekele Mesaya Jizọs, Onyenwe anyị, onye nyere m ike, n’ihi na o weere m dị ka onye kwesịrị ntụkwasị obi ma họpụta m maka ije ozi[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “n’ọrụ” ma ọ bụ “maka ozi.” Okwu Grik διακονία pụtara ije ozi n’obosara, gụnyere ozi e nyere mmadụ ka ọ rụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: Ana m ekele
  rationale: Akpaokwu Grik a pụtara ikwupụta ekele. “Ana m ekele” bụ Igbo doro anya ma dịkwa ebumpụta ụwa.
- source_word: ἐνδυναμώσαντί με
  choice: onye nyere m ike
  rationale: Nke a na-egosi na Kraịst bụ onye mere Pọl ka o nwee ike ịrụ ọrụ ahụ; okwu a anaghị amanye echiche pụrụ iche banyere ụdị ike ahụ.
- source_word: Χριστῷ Ἰησοῦ
  choice: Kraịst Jizọs
  rationale: “Kraịst” bụ nsụgharị aha-ọrụ Χριστός nke ndị na-agụ Igbo maara nke ọma; ọ na-echekwa ntụaka ya nye Onye E Tere Mmanụ.
- source_word: τῷ κυρίῳ ἡμῶν
  choice: Onyenwe anyị
  rationale: Nke a bụ aha-ọrụ Kraịst nke na-egosi ọchịchị na ikike ya, ma bụrụkwa okwu Agba Ọhụrụ a na-ejikarị eme ihe n’Igbo.
- source_word: πιστόν
  choice: onye kwesịrị ntụkwasị obi
  rationale: N’ebe a πιστός na-egosi na a pụrụ ịtụkwasị Pọl obi n’ọrụ e nyere ya; ahịrịokwu Igbo a na-ewepụta echiche ahụ nke ọma.
- source_word: ἡγήσατο
  choice: o weere m dị ka
  rationale: Okwu a pụtara ile mmadụ anya ma ọ bụ ịgụ ya dịka onye nwere otu àgwà; nsụgharị a anaghị etinye echiche ikpe ụlọikpe.
- source_word: θέμενος
  choice: wee họpụta m
  rationale: Ọ bụ ezie na isi echiche ya bụ ‘itinye,’ n’ọnọdụ a ọ na-egosi inye mmadụ ọrụ ma ọ bụ ịhọpụta ya maka ọrụ ahụ.
- source_word: εἰς διακονίαν
  choice: maka ije ozi
  rationale: διακονία nwere obosara pụtara ọrụ e ji ejere ndị ọzọ ozi. “Ije ozi” na-ezere ime ka ọ bụrụ naanị ọkwa ndị ụkọchukwu ma ọ bụ ndị isi chọọchị.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Kraịst Jizọs
  alternative: Mesaya Jizọs
  rationale: “Kraịst” bụ ụdị a nabatara nke ọma n’Igbo maka Χριστός ma ka na-arụ ọrụ dịka aha-ọrụ. Akwụkwọ nkọwa na-eme ka ihe okwu ahụ pụtara doo anya, n’enweghị ịgbanwe ya ka ọ bụrụ naanị aha mmadụ.
- issue: Ụdị ọrụ e nyere Pọl
  choice: wee họpụta m maka ije ozi
  alternative: wee tinye m n’ozi
  rationale: Nhọrọ a na-egosi na Kraịst nyere Pọl ọrụ, ma ọ naghị ebubata usoro ọkwa chọọchị mechara pụta. Ọ na-echekwakwa obosara ihe διακονία pụtara.
- issue: Mmekọrịta dị n’etiti ịgụ Pọl dịka onye kwesịrị ntụkwasị obi na ịhọpụta ya
  choice: o weere m dị ka onye kwesịrị ntụkwasị obi wee họpụta m
  alternative: n’ihi na ọ họpụtara m maka ije ozi mgbe o weere m dị ka onye kwesịrị ntụkwasị obi
  rationale: A hapụrụ participle θέμενος ka ọ dabere n’omume Kraịst, dịka Grik si dị, n’enweghị ikwubi kpọmkwem ma ntụkwasị obi ahụ bụ ihe kpatara nhọpụta ahụ n’ụzọ zuru ezu.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ, nke dị ugbu a ma dị nsọ n’ụda ya. A họọrọ “ije ozi” kama okwu nwere ike igosi naanị ọkwa chọọchị. Akara nkọwa [a] dị n’ahịrịokwu bụ isi dịka achọrọ.
