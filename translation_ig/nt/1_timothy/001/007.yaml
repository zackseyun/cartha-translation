  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: ig
  text: Ha chọrọ ịbụ ndị ozizi iwu[a], ma ha adịghị aghọta ma ihe ha na-ekwu ma ihe ndị ha na-ekwu okwu banyere ha n’ụzọ siri ike.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị ozizi iwu” nwere ike ịpụta ndị na-azọrọ ikike ịkụzi iwu ndị Juu, ya bụ Tora.
    reason: cultural_note
  - marker: b
    text: 'A pụkwara ịsụ ya: “n’aghọtaghị ihe ha na-ekwu ma ọ bụ ihe ndị ha na-ekwu okwu banyere ha n’ụzọ siri ike.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλοντες
  choice: Ha chọrọ
  rationale: Na-egosipụta ọchịchọ na-aga n’ihu nke ndị a kpọtụrụ aha n’amaokwu bu ụzọ, n’asụsụ Igbo dị mfe ma bụrụkwa nke eke.
- source_word: εἶναι
  choice: ịbụ
  rationale: Ọ bụ infinitive na-emeju θέλοντες; ‘ịchọ ịbụ’ bụ usoro okwu Igbo kwesịrị ekwesị.
- source_word: νομοδιδάσκαλοι
  choice: ndị ozizi iwu
  rationale: Na-echekwa echiche nke ndị na-akụzi iwu n’emeghị ka isi amaokwu kwuo kpọmkwem na ọ bụ Iwu Mosis; nkọwa ụkwụ na-egosi ihe ọ pụrụ ịpụta n’ọnọdụ a.
- source_word: μὴ νοοῦντες
  choice: ma ha adịghị aghọta
  rationale: ‘Ma’ na-eme ka ọdịiche dị n’etiti ọchịchọ ha na enweghị nghọta ha pụta ìhè, dịka participle a si arụ ọrụ n’ọnọdụ a.
- source_word: μήτε ... μήτε
  choice: ma ... ma
  rationale: Usoro ‘ma X ma Y’ mgbe ngwaa dị n’ụdị njụ na-egosipụta ‘neither ... nor’ n’Igbo eke.
- source_word: ἃ λέγουσιν
  choice: ihe ha na-ekwu
  rationale: Na-egosipụta ọdịnaya nke okwu ha ma na-edobe present tense n’ụzọ Igbo na-agụ nke ọma.
- source_word: περὶ τίνων
  choice: ihe ndị ... banyere ha
  rationale: Na-echekwa echiche nke okwu gbasara ihe ụfọdụ, n’agbanyeghị na nhazi ahịrịokwu Igbo chọrọ ka ‘banyere ha’ bịa n’azụ.
- source_word: διαβεβαιοῦνται
  choice: ha ji obi ike na-ekwusi ike
  rationale: Na-egosipụta nkwupụta siri ike na ntụkwasị obi dị ukwuu, ọ bụghị nanị ikwu okwu nkịtị.
theological_decisions:
- issue: Ihe ‘iwu’ na νομοδιδάσκαλοι na-ezo aka na ya
  choice: E tinyere ‘iwu’ n’isi amaokwu n’enweghị ịkpọ ya Iwu Mosis ma ọ bụ Tora.
  alternative: ‘ndị ozizi Iwu Mosis’ ma ọ bụ ‘ndị ozizi Tora’
  rationale: N’ọnọdụ akwụkwọ ozi a, o yikarịrị ka ọ na-ezo aka n’iwu ndị Juu/Tora, ma okwu Grik ahụ n’onwe ya kwuru naanị ‘iwu.’ Ntụgharị a na-echekwa obosara okwu mbụ, ebe nkọwa ụkwụ na-enye ihe gbasara ọnọdụ omenala.
- issue: Mmekọrịta μὴ νοοῦντες na θέλοντες
  choice: 'A tụgharịrị ya n’ụdị ọdịiche: ‘ma ha adịghị aghọta.’'
  alternative: ‘n’agbanyeghị na ha adịghị aghọta’ ma ọ bụ ‘ha anaghị aghọta’
  rationale: Nke a na-eme ka esemokwu dị n’etiti ọchịchọ ịbụ ndị ozizi na enweghị nghọta pụta ìhè, n’ebughị nkọwa ozizi ọzọ abata.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị ozizi iwu’ zere okwu siri ike ma chekwaa njikọ ya na okwu Grik. A haziri nkebi ikpeazụ n’usoro Igbo eke, ebe nkọwa ụkwụ na-echekwa ntụgharị ọzọ nke nwere participle kpọmkwem.
