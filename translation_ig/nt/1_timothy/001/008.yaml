  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: ig
  text: Ma anyị maara na iwu ahụ dị mma, ma ọ bụrụ na mmadụ ejiri ya mee ihe dịka iwu si dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ọ bụrụ na mmadụ ejiri ya mee ihe n’ụzọ kwesịrị ekwesị,” ma ọ bụ “ọ bụrụ na mmadụ ejiri ya mee ihe n’ụzọ ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: anyị maara
  rationale: Ụdị οἶδα a nwere nghọta nke ihe a maara ugbu a ma guzosie ike; “anyị maara” bụ Igbo doro anya ma kwekọọ n’isi iyi.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi ntakịrị ntụgharị n’okwu. “Ma” na-egosipụta njikọ ahụ n’enweghị ime ka mmegide ya sie ike karịa ka Grik si kwuo.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ebute ihe a maara; “na” bụ njikọ nkịtị na nke eke n’Igbo.
- source_word: καλὸς
  choice: dị mma
  rationale: Ọ na-akọwa ezi àgwà iwu ahụ n’ụzọ sara mbara, n’enweghị ịgbakwụnye nkọwa pụrụ iche.
- source_word: ὁ νόμος
  choice: iwu ahụ
  rationale: Akara nrụtụ aka dị na Grik; “iwu ahụ” na-edobe ya ma hapụ kpọmkwem ókè iwu a pụtara ka ihe gbara amaokwu ahụ gburugburu kọwaa ya.
- source_word: ἐάν τις
  choice: ma ọ bụrụ na mmadụ
  rationale: Nke a bụ ọnọdụ gbasara onye ọ bụla n’ozuzu. “Mmadụ” bụ ụzọ Igbo si ekwu ya n’ụdị otu onye n’enweghị ịkọwa nwoke ma ọ bụ nwaanyị.
- source_word: αὐτῷ
  choice: ya
  rationale: Ọ na-alaghachi n’“iwu ahụ”; “ejiri ya mee ihe” bụ usoro Igbo eke maka χράομαι.
- source_word: νομίμως
  choice: dịka iwu si dị
  rationale: Nhọrọ a na-edobe njikọ okwu dị n’etiti νόμος na νομίμως ma na-ezere ime ka okwu ahụ bụrụ naanị iwu obodo ma ọ bụ nkwado gọọmenti.
- source_word: χρῆται
  choice: ejiri ya mee ihe
  rationale: Ọ na-enye nghọta nke iji ma ọ bụ itinye ihe n’ọrụ n’Igbo dị ugbu a ma doo anya.
theological_decisions:
- issue: Ókè ihe “iwu ahụ” pụtara
  choice: E dere ya naanị “iwu ahụ.”
  alternative: Iwu Mosis; ma ọ bụ iwu n’ozuzu ya
  rationale: Ihe gbara amaokwu ahụ gburugburu nwere ike ime ka a na-eche karịsịa banyere Iwu Mosis, ma Grik n’onwe ya akọwaghị ya otu ahụ. Nsụgharị ahụ anaghị emechi nghọta ahụ n’otu nkọwa ozizi.
- issue: Ihe νομίμως pụtara n’ebe a
  choice: dịka iwu si dị
  alternative: n’ụzọ kwesịrị ekwesị; n’ụzọ ziri ezi
  rationale: Nke a na-echekwa egwuregwu okwu dị n’etiti “iwu” na “dịka iwu si dị,” ma ihe okwu ahụ kpọmkwem chọrọ n’iji iwu eme ihe ka nwere ike ịbụ “n’ụzọ kwesịrị ekwesị” ma ọ bụ “n’ụzọ ziri ezi.”
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe obere ntụgharị δὲ site na “Ma,” na-edobekwa nkwughachi sitere na νόμος/νομίμως site na “iwu ahụ/dịka iwu si dị.”
