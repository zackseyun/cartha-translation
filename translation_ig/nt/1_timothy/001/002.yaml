id: 1TI.1.2
reference: 1 Timothy 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ig
  text: 'Nye Timoti, ezi nwa m n’okwukwe[a]: amara, ebere, na udo sitere n’aka Chineke Nna na Mesaịa Jizọs bụ Onyenwe anyị.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nwa m n’ezie n’okwukwe.”
    reason: lexical_alternative
  - marker: b
    text: 'Ntụgharị ọdịnala: “Kraịst Jizọs, Onyenwe anyị.”'
    reason: alternative_reading
lexical_decisions:
- source_word: γνησίῳ
  choice: ezi
  rationale: “Ezi” na-egosi na mmekọrịta ime mmụọ Pọl na Timoti bụ nke a pụrụ ịtụkwasị obi, n’emeghị ka a ghọta na Timoti bụ nwa o mụrụ n’anụ ahụ.
- source_word: τέκνῳ
  choice: nwa
  rationale: “Nwa” na-echekwa ihe atụ nke ịbụ nne ma ọ bụ nna n’ime mmụọ, ma ọ naghị etinye ihe karịrị ihe okwu Grik ahụ kwuru.
- source_word: ἐν πίστει
  choice: n’okwukwe
  rationale: Nke a na-echekwa ohere na okwu ahụ na-ekwu banyere okwukwe ha jikọrọ ọnụ ma ọ bụ ọnọdụ nke mmekọrịta ime mmụọ ha, na-enweghị idozi nghọta ahụ n’otu ụzọ naanị.
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa onyinye ọma Chineke nke mmadụ na-erughị eru inweta.
- source_word: ἔλεος
  choice: ebere
  rationale: “Ebere” bụ ntụgharị kpọmkwem ma dịkwa mma n’usoro ekele a.
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” na-echekwa ma echiche ekele ahụ ma ịdị omimi nke okwu ahụ n’ihe gbasara mmekọrịta mmadụ na Chineke.
- source_word: πατρὸς
  choice: Nna
  rationale: “Chineke Nna” bụ usoro okwu Igbo dị nkenke ma doo anya maka θεοῦ πατρός.
- source_word: Χριστοῦ
  choice: Mezaya
  rationale: E jiri “Mezaya” tụgharịa aha ọkwá ahụ kama idepụta ya naanị dị ka “Kraịst,” ka ihe ọ pụtara dị ka Onye E Tere Mmanụ pụta ìhè.
- source_word: κυρίου
  choice: Onyenwe
  rationale: “Onyenwe anyị” bụ ntụgharị Igbo a na-aghọta nke ọma, na-echekwakwa ịdị arọ nke aha ọkwá ahụ banyere Jizọs.
theological_decisions:
- issue: Ntụgharị Χριστοῦ Ἰησοῦ
  choice: Mezaya Jizọs
  alternative: Kraịst Jizọs
  rationale: Χριστός ka bụ aha ọkwá n’ebe a; “Mezaya” na-eme ka ihe ọ pụtara pụta ìhè, ebe ihe odide ala peeji na-edebe usoro ọdịnala “Kraịst Jizọs.”
- issue: Ike okwu ἐν πίστει
  choice: n’okwukwe
  alternative: n’okwukwe anyị jikọrọ ọnụ
  rationale: '“N’okwukwe” na-ahapụ nghọta okwu Grik ahụ ka ọ ghe oghe: ọ pụrụ izo aka n’okwukwe ha jikọrọ ọnụ ma ọ bụ n’ọnọdụ nke okwukwe, na-enweghị ịgbakwụnye “anyị jikọrọ ọnụ” n’ahịrị bụ isi.'
- issue: Mmekọrịta nke γνησίῳ τέκνῳ
  choice: ezi nwa m
  alternative: nwa m n’ezie
  rationale: “Ezi nwa m” na-echekwa ihe atụ nke Pọl dị ka nna ime mmụọ Timoti ma ghara ime ka ọ bụrụ ọmụmụ anụ ahụ.
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrị ahụ na-edebe ụdị ekele akwụkwọ ozi Grik nke na-enweghị ngwaa kpọmkwem; akara abụọ ahụ na-ekewa onye a na-edegara akwụkwọ ozi na ngọzi ahụ. E debeghị nkọwa ụka pụrụ iche n’ime ederede.
