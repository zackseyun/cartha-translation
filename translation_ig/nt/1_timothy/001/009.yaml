id: 1TI.1.9
reference: 1 Timothy 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: ig
  text: 'N''ịmara nke a: e dọghị iwu ahụ maka onye ezi omume, kama ọ bụ maka ndị na-emebi iwu na ndị nnupụisi, ndị na-adịghị asọpụrụ Chineke na ndị mmehie, ndị na-adịghị nsọ na ndị na-eleda ihe dị nsọ anya, ndị na-egbu nna ha na ndị na-egbu nne ha[a], na ndị ogbu mmadụ,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nwekwara ike ịbụ, “ndị na-eti nna ha ihe ike na ndị na-eti nne ha ihe ike”; okwu Grik ndị a nwere ike ịpụta imeso nne na nna ihe ike, ọ bụ ezie na n'ebe a “igbu” yikarịrị ka ọ bụ ihe a na-ekwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: ebe a maara nke a
  rationale: Na-edobe participle nke na-egosi ihe a maara nke bụ ntọala okwu bu ụzọ, n'Igbo dị mfe ma dị ugwu.
- source_word: δικαίῳ
  choice: maka onye ezi omume
  rationale: Na-edobe dative singular na echiche onye nnọchiteanya; okwu Igbo a anaghị etinye nwoke naanị n'ihe Greek ahụ na-ekwu n'ozuzu.
- source_word: νόμος οὐ κεῖται
  choice: e doghị iwu ahụ
  rationale: ‘Dọ iwu’ na-egosipụta echiche κεῖται nke idobe ma ọ bụ ịtọ iwu, kama ịkọwa ya n'ụzọ sara mbara dịka ‘iwu anaghị emetụta.’
- source_word: ἀνόμοις
  choice: ndị na-emebi iwu
  rationale: Okwu a bụ nke ndị mmadụ na-aghọta ngwa ngwa, ma na-echekwa echiche omume megidere iwu.
- source_word: ἀνυποτάκτοις
  choice: ndị nnupụisi
  rationale: Na-egosi ndị jụrụ ido onwe ha n'okpuru ọchịchị ma ọ bụ ntụziaka.
- source_word: ἀσεβέσι
  choice: ndị na-adịghị asọpụrụ Chineke
  rationale: Na-egosipụta enweghị nsọpụrụ na ịsọpụrụ Chineke nke okwu Greek a pụtara.
- source_word: ἁμαρτωλοῖς
  choice: ndị mmehie
  rationale: Ụdị aha a bụ Igbo nkịtị ma doo anya maka ndị na-eme mmehie.
- source_word: ἀνοσίοις
  choice: ndị na-adịghị nsọ
  rationale: Na-echekwa ihe dị iche n'etiti enweghị ịdị nsọ na ileda ihe dị nsọ anya nke okwu na-esochi ya pụtara.
- source_word: βεβήλοις
  choice: ndị na-eleda ihe dị nsọ anya
  rationale: Na-akọwa n'ụzọ doro anya omume nke iwere ihe dị nsọ dịka ihe nkịtị ma ọ bụ ihe a na-adịghị akwanyere ùgwù.
- source_word: πατρολῴαις
  choice: ndị na-egbu nna ha
  rationale: Okwu ahụ nwere ike ịpụta iti ihe ike ma ọ bụ igbu nna; n'usoro mmehie a, ‘igbu’ yiri ka ọ bụ echiche siri ike a chọrọ, ma e debere nhọrọ ọzọ n'ala peeji.
- source_word: μητρολῴαις
  choice: ndị na-egbu nne ha
  rationale: Ọ dabara na πατρολῴαις ma na-echekwa echiche yiri ya; e depụtara nghọta ọzọ n'ala peeji.
- source_word: ἀνδροφόνοις
  choice: ndị ogbu mmadụ
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-egbu mmadụ n'ụzọ ajọ omume.
theological_decisions:
- issue: Mmekọahụ nwoke n'ụdị δικαίῳ
  choice: onye ezi omume
  alternative: nwoke ezi omume
  rationale: Ọ bụ ezie na Greek bụ masculine singular, ọ na-arụ ọrụ nnọchiteanya. ‘Onye ezi omume’ na-edobe singular na nghọta izugbe ya n'Igbo n'enweghị itinye naanị nwoke n'ihe ederede ahụ.
- issue: Ike nkọwa πατρολῴαις / μητρολῴαις
  choice: ndị na-egbu nna ha / ndị na-egbu nne ha
  alternative: ndị na-eti nna ha / ndị na-eti nne ha ihe ike
  rationale: Okwu ndị a dị ụkọ ma nwee ike ịpụta mwakpo ike ma ọ bụ igbu nne na nna. N'ọnọdụ a, ‘igbu’ yikarịrị, ma ejighị n'aka ahụ echekwara n'ala peeji.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji usoro ndepụta na nkebiokwu ndị yiri ibe ha chekwaa ụda amaokwu ahụ; akara ala peeji [a] dị n'isi ederede.
