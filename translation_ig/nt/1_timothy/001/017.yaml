  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: ig
  text: Ka nsọpụrụ na ebube dịrị Eze nke oge niile, onye na-adịghị emebi emebi, onye a na-apụghị ịhụ anya, onye naanị ya bụ Chineke[a], ruo mgbe ebighị ebi. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ aka ochie na-agụ: “Chineke, onye naanị ya maara ihe.”'
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: Eze nke oge niile
  rationale: Nke a na-edobe usoro okwu Grik nke na-akpọ Chineke Eze na-achị oge niile, kama ime ka ọ bụrụ naanị nkọwa ‘Eze ebighị ebi.’
- source_word: ἀφθάρτῳ
  choice: onye na-adịghị emebi emebi
  rationale: Ọ na-egosi na ire ure, mbibi, ma ọ bụ ọnwụ adịghị emetụta Chineke; ọ bụkwa okwu Igbo doro anya ma dị ugwu.
- source_word: ἀοράτῳ
  choice: onye a na-apụghị ịhụ anya
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ ma doo anya nke ἀόρατος.
- source_word: μόνῳ θεῷ
  choice: onye naanị ya bụ Chineke
  rationale: Ọ na-echekwa nkwupụta nke ederede na ọ bụ naanị ya bụ Chineke, n’enweghị itinye ‘maara ihe,’ nke na-anọghị na ederede SBLGNT.
- source_word: τιμὴ καὶ δόξα
  choice: nsọpụrụ na ebube
  rationale: Okwu abụọ a na-ekwupụta τιμή na δόξα n’ụzọ a na-aghọta nke ọma n’Igbo ma dabara n’otuto dị nsọ.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: ruo mgbe niile ebighị ebi
  rationale: Nke a bụ ụzọ Igbo sitere n’okike esi egosi oge na-enweghị njedebe, kama ịsụgharị akpaalaokwu Grik ahụ n’ụzọ ga-ada ka okwu mba ọzọ.
- source_word: ἀμήν
  choice: Amen
  rationale: E debere okwu a dịka okwu nkwenye a maara nke ọma n’ofufe na n’Akwụkwọ Nsọ Igbo.
- source_word: δὲ
  choice: —
  rationale: A naghị etinye okwu mmalite pụrụ iche; δέ na-eme njikọ dị nro n’okwu Grik, ma ‘Ka … dịrị’ na-ebute otuto ahụ nke ọma n’Igbo n’enweghị ịgbakwunye echiche oge dịka ‘ugbu a.’
theological_decisions:
- issue: Ichekwa ike nkwupụta na ọ bụ naanị otu Chineke n’enweghị idozi esemokwu nkà mmụta okpukpe site n’ịgbakwunye nkọwa
  choice: onye naanị ya bụ Chineke
  alternative: Chineke naanị ya
  rationale: Nhọrọ a na-egosipụta μόνῳ θεῷ ozugbo ma hapụ nkwupụta ahụ ka ọ guzo dịka e dere ya.
- issue: Ụdị ederede nwere σοφῷ (‘maara ihe’)
  choice: E tinyeghị ‘maara ihe’ n’ahịrị bụ isi
  alternative: naanị Chineke maara ihe
  rationale: SBLGNT e nyere enweghị σοφῷ; ya mere, a na-edebe ụdị ahụ n’okpuru peeji kama itinye ya n’ahịrị bụ isi.
translation_notes:
  register: 'Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A haziri ahịrị ahụ dịka otuto: ‘Ka nsọpụrụ na ebube dịrị …’ Akara [a] dị n’ahịrị bụ isi ma kwekọọ na nkọwa ụdị ederede.'
