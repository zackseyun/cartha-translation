    text: 'Ụfọdụ akwụkwọ aka ochie na-agụ: “Chineke, onye naanị ya maara ihe.”'
    reason: textual_variant
  revision_rationale: The revision retains the source-faithful main translation while moving the textual-variant marker to its proper referent, clarifying that the variant calls God “wise,” and smoothing the final duration phrase into natural Standard Igbo. No doctrinal interpretation has been added.
