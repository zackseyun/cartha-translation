revisions:
- from: Ka nsọpụrụ na ebube dịrị Eze nke oge niile[a], onye na-adịghị emebi emebi, onye a na-apụghị ịhụ anya, onye naanị ya bụ Chineke, ruo mgbe niile ebighị ebi. Amen.
  to: Ka nsọpụrụ na ebube dịrị Eze nke oge niile, onye na-adịghị emebi emebi, onye a na-apụghị ịhụ anya, onye naanị ya bụ Chineke[a], ruo mgbe ebighị ebi. Amen.
  rationale: The revision retains the source-faithful main translation while moving the textual-variant marker to its proper referent, clarifying that the variant calls God “wise,” and smoothing the final duration phrase into natural Standard Igbo. No doctrinal interpretation has been added.
