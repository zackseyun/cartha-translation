id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: ig
  text: Dị ka m rịọrọ gị ka ị nọgide n’Efesọs mgbe m na-aga Masedonia, ka i wee nye ụfọdụ ndị iwu[a] ka ha ghara ịkụzi ozizi dị iche,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gwa ụfọdụ ndị ka ha ghara ịkụzi ozizi ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: Dị ka
  rationale: Ọ na-ewebata ncheta arịrịọ Pọl rịọrọ Timoti na mbụ ma na-edobe njikọ ahịrịokwu ahụ, nke na-aga n’ihu n’amaokwu ndị so ya.
- source_word: παρεκάλεσά
  choice: m rịọrọ
  rationale: “Rịọrọ” na-egosi arịrịọ siri ike ma dị mkpa, ma ọ naghị eme ka okwu ahụ bụrụ iwu kpọmkwem.
- source_word: προσμεῖναι
  choice: ka ị nọgide
  rationale: Ọ na-egosi ịnọgide n’otu ebe, ọ bụghị nanị ịnọ ebe ahụ nwa oge.
- source_word: ἐν Ἐφέσῳ
  choice: n’Efesọs
  rationale: A sụgharịrị njikọ ebe ahụ n’ụzọ Igbo nkịtị ma dee aha obodo ahụ n’ụdị a na-amata.
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: mgbe m na-aga Masedonia
  rationale: Ọ na-eme ka ọnọdụ oge nke participle ahụ doo anya, onye na-aga bụkwa Pọl.
- source_word: ἵνα
  choice: ka i wee
  rationale: Ọ na-egosi nzube e ji gwa Timoti ka ọ nọgide n’Efesọs.
- source_word: παραγγείλῃς
  choice: gwa ụfọdụ ndị ... ka ha ghara
  rationale: Nhazi okwu a bụ ụzọ Igbo dị ndụ e si enye ntụziaka nwere ikike. Ihe odide ala peeji na-edobe nhọrọ siri ike karị, “nye ... iwu.”
- source_word: τισὶν
  choice: ụfọdụ ndị
  rationale: Ọ na-ezo aka n’ụfọdụ mmadụ a na-akpọghị aha, dị ka indefinite plural nke Grik si dị.
- source_word: ἑτεροδιδασκαλεῖν
  choice: izi ozizi dị iche
  rationale: Ọ na-edobe echiche nke izi ozizi nke dị iche n’ozizi a nabatara, n’etinyeghị okwu siri ike karị bụ “ozizi ụgha” n’ime mkpụrụokwu ahụ.
theological_decisions:
- issue: Ike iwu dị na παραγγείλῃς n’ọnọdụ idozi ozizi n’ọgbakọ
  choice: “gwa ụfọdụ ndị ... ka ha ghara,” nke na-egosi ntụziaka nwere ikike
  alternative: “nye ụfọdụ ndị iwu”
  rationale: Okwu Grik ahụ karịrị aro nkịtị ma nwee ikike, ma nhazi ahọpụtara bụ Igbo doro anya nke na-adịghị ada ka okwu ochie. Ihe odide ala peeji na-egosi ntụgharị iwu siri ike karị.
- issue: Otu e si sụgharịa ἑτεροδιδασκαλεῖν
  choice: “izi ozizi dị iche”
  alternative: “izi ozizi ụgha” ma ọ bụ “izi ozizi ọzọ”
  rationale: Ngwakọta okwu Grik ahụ na-emesi ọdịiche n’ozizi ike. “Ozizi ụgha” ga-ekpebi ihe okwu ahụ pụtara karịa ka mkpụrụokwu ahụ n’onwe ya si kwuo, ebe “ozizi ọzọ” nwere ike ghara igosi ọdịiche ahụ nke ọma.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E debere ahịrịokwu ahụ ka ọ bụrụ nke na-aga n’ihu, dịka ihe odide Grik si dị, kama imechi ya n’ebe amaokwu a kwụsịrị.
