id: 1TI.1.5
reference: 1 Timothy 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: ig
  text: Ebumnuche[a] nke ntụziaka[b] ahụ bụ ịhụnanya nke si n’obi dị ọcha, akọ na uche dị mma, na okwukwe na-enweghị ihu abụọ[c] pụta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ihe a na-achọ iru” ma ọ bụ “ihe ga-esi na ya pụta.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “iwu” ma ọ bụ “ihe e nyere mmadụ n’aka ime.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya “okwukwe ezi obi.” N’ọnọdụ ụfọdụ, πίστις nwekwara ike ịpụta “ikwesị ntụkwasị obi” ma ọ bụ “ntụkwasị obi.”
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: ebumnuche
  rationale: N’ebe a, okwu a na-egosi ihe ntụziaka ahụ chọrọ imezu, ọ bụghị naanị njedebe ya. “Ebumnuche” na-akọwa echiche a nke ọma n’Igbo ugbu a.
- source_word: παραγγελίας
  choice: ntụziaka
  rationale: Okwu Grik a nwere ike ịpụta iwu, ihe e nyere mmadụ n’aka ime, ma ọ bụ ntụziaka. N’ọnọdụ a gbasara ozi Timoti na izi ihe, “ntụziaka” sara mbara ma dị mfe nghọta.
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo doro anya na nke a na-ejikarị akọwa ἀγάπη.
- source_word: ἐκ
  choice: si ... pụta
  rationale: 'N’ebe a ἐκ na-egosi isi mmalite: ịhụnanya ahụ na-esite n’àgwà atọ a kpọrọ aha pụta.'
- source_word: καθαρᾶς καρδίας
  choice: obi dị ọcha
  rationale: Nke a na-edobe ma ihe oyiyi nke “obi” ma echiche banyere ịdị ọcha n’ime mmadụ.
- source_word: συνειδήσεως ἀγαθῆς
  choice: akọ na uche dị mma
  rationale: “Akọ na uche” bụ ụzọ a na-anabata n’Igbo isi kwuo conscience; “dị mma” na-esochi ἀγαθῆς anya karịa nkọwa dịka “na-adịghị ama ikpe.”
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ nsụgharị bụ isi nke πίστις n’ebe a, ebe a na-ahapụkwa ohere nghọta ndị ọzọ na nkọwa ala peeji.
- source_word: ἀνυποκρίτου
  choice: na-enweghị ihu abụọ
  rationale: Nkebiokwu a na-egosipụta kpọmkwem na okwukwe ahụ enweghị omume ihu abụọ, ma bụrụkwa Igbo ndị mmadụ na-aghọta.
- source_word: δὲ
  choice: (egosighị ya iche n’okwu Igbo)
  rationale: δὲ bụ njikọ dị nro na-aga n’ihu n’okwu a. Ịgbakwunye “ma” nwere ike ime ka ọdịiche ahụ sie ike karịa ka Grik si kwuo, ya mere usoro ahịrịokwu Igbo na-eburu njikọ ahụ.
theological_decisions:
- issue: Ihe πίστις pụtara na πίστεως ἀνυποκρίτου
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi; ntụkwasị obi
  rationale: N’ọnọdụ a, “okwukwe” nwere ike ịbụ okwukwe nke ezi obi nke ịhụnanya si na ya apụta. Ma ebe πίστις nwekwara ike ịpụta ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi, e debere ohere ndị ahụ na nkọwa ala peeji kama ikpebi ya n’ụzọ ga-emechi nghọta ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. Nhazi “si ... pụta” na-eme ka o doo anya na obi dị ọcha, akọ na uche dị mma, na okwukwe na-enweghị ihu abụọ bụ isi mmalite atọ nke ịhụnanya ahụ. E gosighị δὲ site n’okwu njikọ pụrụ iche ka a ghara ime ka ọdịiche dị n’ahịrịokwu ahụ sie ike karịa nke dị na Grik.
