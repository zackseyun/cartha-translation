id: 1TI.1.18
reference: 1 Timothy 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: ig
  text: Ntụziaka a ka m na-atụkwasị gị n’aka, nwa m Timoti, dịka amụma ndị e buru banyere gị na mbụ[a] si dị, ka i wee jiri ha[b] lụọ ezi agha ahụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “metụtara gị”; ma ọ bụ ikekwe, “n’elu gị,” ya bụ, amụma ndị e kwuru n’elu Timoti.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “site na ha” ma ọ bụ “n’ime ha.” Okwu Grik ahụ nwere ike igosi ụzọ e si eme ihe ma ọ bụ ọnọdụ a nọ na ya eme ihe.
    reason: lexical_alternative
  - marker: c
    text: Nsụgharị a na-ahụkarị bụ, “lụ ọgụ ọma ahụ.” N’ụzọ ka nso n’okwu Grik, ọ bụ “lụọ ezi agha ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: Iwu
  rationale: “Iwu” na-egosi ntụziaka nwere ikike. N’ọnọdụ a, ọ na-ada nke ọma n’Igbo ma na-echekwa ịdị arọ nke ọrụ Pọl na-enye Timoti.
- source_word: παρατίθεμαί
  choice: ka m na-enyefe gị n’aka
  rationale: Nkebiokwu a na-egosi na Pọl na-etinye iwu ahụ n’aka Timoti ka ọ bụrụ ọrụ dịịrị ya, ọ bụghị naanị na ọ na-agwa ya okwu.
- source_word: τέκνον Τιμόθεε
  choice: nwa m Timoti
  rationale: Nke a bụ okwu ịhụnanya nke mmekọrịta ime mmụọ. Ọ bụ ezie na “m” adịghị iche n’ederede Grik, Igbo chọrọ ya ebe a ka okwu ịkpọ mmadụ “nwa” bụrụ nke sitere n’ọnụ onye na-ekwu okwu ma daa nke ọma.
- source_word: κατὰ
  choice: dịka … si dị
  rationale: Ụdị okwu a na-egosi na iwu ahụ kwekọrọ n’amụma ndị ahụ ma ọ bụ na ọ dabere na ha, n’enweghị ịkọwa njikọ ahụ karịa ihe Grik kwuru.
- source_word: προαγούσας
  choice: ndị e buru na mbụ
  rationale: N’ebe a, participle ahụ na-egosi amụma ndị buru ụzọ pụta ma ọ bụ ndị e buru tupu oge a.
- source_word: ἐπὶ σὲ
  choice: banyere gị
  rationale: “Banyere gị” bụ Igbo doro anya maka amụma ndị metụtara Timoti; ihe odide ala peeji na-edebe ohere nke nghọta “n’elu gị.”
- source_word: προφητείας
  choice: amụma
  rationale: “Amụma” bụ okwu Igbo a na-ejikarị akọwa ozi e buru site n’ike mmụọ amụma, ma ọ dabara n'ụdị ọtụtụ site n'okwu gbara ya gburugburu.
- source_word: ἐν αὐταῖς
  choice: site na ha
  rationale: '“Site na ha” na-ewere ἐν n’ụzọ nke ihe e ji arụ ọrụ: amụma ndị ahụ na-enyere Timoti aka ịga agha ahụ. Ihe odide ala peeji na-echekwa ohere nke ịghọta ya dịka ọnọdụ ma ọ bụ gburugburu ọrụ ahụ.'
- source_word: στρατεύῃ … τὴν καλὴν στρατείαν
  choice: gaa agha ọma ahụ
  rationale: “Ịga agha” bụ ụzọ Igbo si ekwu itinye onwe n’agha ma ọ bụ ibuso agha, ya mere ọ na-echekwa ihe atụ agha nke okwu Grik abụọ sitere n’otu mgbọrọgwụ.
theological_decisions:
- issue: Ụdị njikọ dị n’etiti amụma ndị e buru banyere Timoti na ọrụ e nyere ya
  choice: Amụma ndị ahụ na-akwado ma na-eduzi iwu Pọl na-enye Timoti, ma ederede ekwughị kpọmkwem ụdị emume ma ọ bụ usoro echichi ọ bụla.
  alternative: Ịsị na amụma ndị ahụ bụ emume echichi Timoti n’onwe ya, ma ọ bụ na ha bụ naanị okwu agbamume nzuzo.
  rationale: Grik jikọtara iwu ahụ na amụma ndị e buru na mbụ ma kwuo na Timoti ga-eji ha ma ọ bụ n’ime ha gaa agha ọma ahụ. Nsụgharị ahụ na-echekwa njikọ a n’ebughị ozizi ọzọ na-abụghị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Iwu a ka m na-enyefe gị n’aka” na-enye okwu ahụ ịdị arọ n’enweghị asụsụ siri ike gabiga ókè. “Gaa agha ọma ahụ” na-echekwa ihe atụ agha nke Grik, ebe ihe odide ala peeji na-enye ụdị okwu ọdịnala a maara nke ọma.
