id: 1TI.1.14
reference: 1 Timothy 1:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: ig
  text: Ma amara Onyenwe anyị bara ụba gabiga ókè[a], ya na okwukwe na ịhụnanya ndị dị n'ime Mesaya Jizọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “hiri nne nke ukwuu.”
    reason: Ọ na-egosi ụzọ ọzọ e si ekwupụta ike pụrụ iche dị na ngwaa Grik ὑπερεπλεόνασεν.
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: juputara nke ukwuu
  rationale: Ngwaa a e ji ihe mgbakwunye mee ka ọ sie ike pụtara ịba ụba gabiga ókè; ntụgharị a na-egosi ụba amara ahụ n'Igbo dị mfe ma dịkwa ugwu.
- source_word: δὲ
  choice: Ma
  rationale: N'ebe a, δέ na-egosi ọdịiche dị n'etiti ọnọdụ mmehie na ekweghị ekwe a kọwara tupu ya na ụba amara Onyenwe anyị.
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihu ọma Chineke nke mmadụ na-erughị eru inweta.
- source_word: κυρίου
  choice: Onyenwe
  rationale: '“Onyenwe” na-echekwa aha nsọpụrụ na ikike dị na κύριος ma na-ada nke ọma n''okwu a: “Onyenwe anyị.”'
- source_word: μετὰ
  choice: ya na
  rationale: μετά na genitive pụtara “ya na”; ebe a, ọ na-ejikọta okwukwe na ịhụnanya na amara ahụ juputara.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ ntụgharị doro anya na nke a na-ejikarị eme ihe maka πίστις n'ebe a.
- source_word: ἀγάπης
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo nkịtị na nke kwesịrị ekwesị maka ἀγάπη.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: ndị dị n'ime Mesaya Jizọs
  rationale: “Ndị” na-eme ka o doo anya na nkebiokwu a na-akọwa ma okwukwe ma ịhụnanya; “dị n'ime” na-echekwa njikọ ἐν n'ejighị nkọwa ihe kpatara ya tinye na ederede.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesaya Jizọs
  rationale: “Mesaya” na-ebupụta ihe Χριστός pụtara dị ka aha ọkwá, kama ime ya ka ọ bụrụ naanị aha mmadụ.
theological_decisions:
- issue: Njikọ “ya na okwukwe na ịhụnanya” na “amara”
  choice: E gosiri amara Onyenwe anyị dị ka nke juputara, ya na okwukwe na ịhụnanya ndị dị n'ime Mesaya Jizọs.
  alternative: Ịkọwa okwukwe na ịhụnanya kpọmkwem dị ka ihe amara ahụ mepụtara n'ime Pọl.
  rationale: Usoro okwu Grik jikọtara μετὰ πίστεως καὶ ἀγάπης na amara ahụ juputara, ma ọ naghị ekwu kpọmkwem na nkebiokwu a na-akọwa ihe kpatara ha; ntụgharị ahụ na-ahapụ nghọta abụọ ahụ oghe.
- issue: Ntụgharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: N'ebe a, Χριστός ka nwere ike aha ọkwá pụtara onye Chineke tere mmanụ; “Mesaya” na-echekwa ihe aha ahụ pụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. A họọrọ “juputara nke ukwuu” ka ọ bụrụ okwu nkịtị na-egosi ụba gabiga ókè; e debere “Mesaya” dị ka aha ọkwá. Akara ndetu ala [a] dị n'ederede isi.
