    reason: Ọ na-egosi ụzọ ọzọ e si ekwupụta ike pụrụ iche dị na ngwaa Grik ὑπερεπλεόνασεν.
  revision_rationale: A gbanwere naanị ngwaa mbụ ka ọ kpọkọta nke ọma echiche ὑπερεπλεόνασεν banyere amara bara ụba gabiga ókè. E debere njikọ “ya na” na nkebiokwu “ndị dị n'ime Mesaya Jizọs” ka ha ghara ịgbakwunye nkọwa gbasara onye okwukwe na ịhụnanya sitere n'aka ya ma ọ bụ ihe ha kpatara.
