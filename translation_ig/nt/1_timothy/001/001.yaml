  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: ig
  text: Pọl, onyeozi nke Mezaya Jizọs[a] site n’iwu Chineke Onye Nzọpụta anyị na Mezaya Jizọs, onye bụ olileanya anyị[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst Jizọs” n’ebe “Mezaya Jizọs” abụọ ahụ pụtara. Utu aha Grik Χριστός nwere ike ịbụ utu aha a sụgharịrị “Mezaya,” ma n’ọnọdụ ụfọdụ ọ na-arụ ọrụ dịka akụkụ aha, “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “site n’iwu Chineke Onye Nzọpụta anyị, na nke Mezaya Jizọs, olileanya anyị.”
    reason: previous_rendering
lexical_decisions:
- source_word: Παῦλος
  choice: Pọl
  rationale: Ọ bụ nsụgharị aha Παῦλος nke a na-ejikarị eme ihe n’Igbo.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” bụ okwu Ndị Kraịst maara nke ọma maka ọrụ na ọkwa a, ma na-edebekwa echiche nke onye e zigara ozi.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mezaya Jizọs
  rationale: A sụgharịrị Χριστός dị ka utu aha “Mezaya,” ebe a hapụrụ aha Ἰησοῦ dị ka “Jizọs”; n’ahịrị mmeghe a, utu aha ahụ ka nwere ike pụtara nke ọma.
- source_word: κατ’ ἐπιταγήν
  choice: site n’iwu
  rationale: Nke a na-egosi na ịbụ onyeozi Pọl sitere n’iwu nwere ikike Chineke nyere, ma ọ bụkwa okwu Igbo dị mfe ma doo anya.
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: Chineke Onye Nzọpụta anyị
  rationale: Ọ na-edobe “Onye Nzọpụta” dị ka utu aha a na-akpọ Chineke, dịka njikọ okwu Grik si dị.
- source_word: καὶ
  choice: na
  rationale: “Na” jikọtara Chineke Onye Nzọpụta anyị na Mezaya Jizọs dị ka ndị e jikọtara n’iwu ahụ, n’enweghị ịgbakwunye echiche ọzọ.
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: Mezaya Jizọs, onye bụ olileanya anyị
  rationale: Ahịrị nkọwa a na-eme ka Igbo bụrụ ihe a na-agụ n’enweghị mgbagwoju anya, ma na-edobe njirimara Mezaya Jizọs dị ka olileanya anyị.
- source_word: ἐλπίδος
  choice: olileanya
  rationale: “Olileanya” bụ okwu Igbo kwesịrị ekwesị nke na-eburu echiche nke atụmanya nwere ntụkwasị obi.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mezaya
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka na-arụ ọrụ dị ka utu aha, ya mere “Mezaya” na-eme ka ihe ọ pụtara pụta ìhè; e debere “Kraịst” n’akwụkwọ nkọwa dị ka nhọrọ omenala.
- issue: Njikọ “olileanya anyị” na Mezaya Jizọs
  choice: onye bụ olileanya anyị
  alternative: Mezaya Jizọs, olileanya anyị
  rationale: Ọ bụ nkọwa appositional na Grik. Ahịrị nke nwere “onye bụ” bụ Igbo eke ma na-edobe njirimara ahụ n’enweghị nkọwa ozizi agbakwunyere.
- issue: Oke njikọ “site n’iwu”
  choice: Iwu ahụ metụtara Chineke Onye Nzọpụta anyị na Mezaya Jizọs olileanya anyị ọnụ
  alternative: Iwu Chineke Onye Nzọpụta anyị, tinyere ịkpọ Mezaya Jizọs olileanya anyị n’enweghị ime ka o doo anya na iwu ahụ si n’aka ha abụọ
  rationale: Nhazi Grik jikọtara aha abụọ ahụ site na καί n’okpuru otu genitive nke ἐπιταγήν; nsụgharị ahụ na-edobe njikọ a, ebe akwụkwọ nkọwa [b] na-egosi ụzọ ọzọ e si kee ahịrị ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. “Onyeozi,” “Onye Nzọpụta,” na “olileanya” bụ okwu ụka a maara nke ọma ma ka bụkwa okwu ndị nkịtị nwere ike ịghọta. E tinyere akara [a] na [b] n’ahịrị isi dịka achọrọ.
