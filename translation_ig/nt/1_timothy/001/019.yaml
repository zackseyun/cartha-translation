  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: ig
  text: na-ejidesi okwukwe[b] na ezi akọ na uche ike; nke[a] ụfọdụ jụrụ wee kpuru ụgbọ n’ihe gbasara okwukwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’usoro asụsụ Grik, ‘nke’ yikarịrị ka ọ na-ezo aka n’‘ezi akọ na uche’; ụfọdụ na-ewere ya ka ọ na-ezo aka n’‘okwukwe na ezi akọ na uche’ ọnụ.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ‘okwukwe’ ebe a dịka ‘ntụkwasị obi,’ ma, nke na-adịkarịghị ebe a, dịka ‘iguzosi ike n’ihe.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: na-ejidesi ... ike
  rationale: Ọ na-egosi omume na-aga n’ihu nke ịrapara n’ihe ma ghara ịhapụ ya; ọ dabara n’ọdụmọdụ dị n’okwu gbara amaokwu a gburugburu.
- source_word: πίστιν
  choice: okwukwe
  rationale: N’ebe a, ọ kacha dabara ịghọta ya dị ka okwukwe Ndị Kraịst, ọ bụ ezie na okwu Grik ahụ nwekwara ike ịpụta ntụkwasị obi.
- source_word: ἀγαθὴν συνείδησιν
  choice: ezi akọ na uche
  rationale: Nke a na-egosipụta ἀγαθή (‘ezi’) n’enweghị ime ka ihe ọ pụtara bụrụ naanị akọ na uche na-adịghị ama mmadụ ikpe.
- source_word: ἥν
  choice: bụ́ nke
  rationale: Okwu njikọ ahụ na-ezo aka n’aha nwanyị dị n’otu n’Grik, ya bụ συνείδησιν (‘akọ na uche’), ma nsụgharị Igbo a na-ahapụ usoro okwu ahụ ka ọ dị nwayọọ kama ịgbakwunye nkọwa n’ime isiokwu.
- source_word: τινες
  choice: ụfọdụ ndị
  rationale: Ọ na-enye echiche nke ìgwè mmadụ a na-akọwaghị kpọmkwem.
- source_word: ἀπωσάμενοι
  choice: jụrụ
  rationale: Ọ na-egosi mkpebi siri ike nke ịjụ ma ọ bụ ịchụpụ ihe, n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: περὶ τὴν πίστιν
  choice: n’ihe banyere okwukwe
  rationale: Ọ na-egosi akụkụ ma ọ bụ ọnọdụ ebe mbibi ahụ metụtara, na-edobe mkpụrụokwu ahụ dịka okwukwe Ndị Kraịst.
- source_word: ἐναυάγησαν
  choice: kpụọ n’ụsọ
  rationale: Akpaalaokwu a na-edobe ihe atụ nke ụgbọ mmiri mebiri n’ụsọ, nke ngwaa Grik ahụ ji akọwa ọdachi dakwasịrị okwukwe ha.
theological_decisions:
- issue: Ihe ἥν na-ezo aka na ya
  choice: Ọ na-ezo kpọmkwem na ‘ezi akọ na uche.’
  alternative: Ọ nwere ike ịchịkọta ‘okwukwe na ezi akọ na uche’ ọnụ.
  rationale: N’usoro asụsụ Grik, ἥν bụ nwanyị dị n’otu, ya na συνείδησιν (‘akọ na uche’), bụ́ aha kacha nso, kwekọrọ. Ma ebe ‘nke’ n’Igbo anaghị egosi okike ma ọ bụ ọnụọgụ, e debere ihe ọzọ a pụrụ ịghọta na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu mee ihe. ‘Kpụọ n’ụsọ’ na-echekwa ihe atụ banyere ụgbọ mmiri n’emebighị ya ka ọ bụrụ naanị okwu nkọwa; e tinyebeghịkwa njikọ na-akọwa ihe kpatara ihe ji mee, dịka ‘n’ihi ya,’ n’ihi na ọ dịghị n’ederede Grik.
