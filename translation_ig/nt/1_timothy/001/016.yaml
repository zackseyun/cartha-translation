id: 1TI.1.16
reference: 1 Timothy 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: ig
  text: Ma ọ bụ n’ihi nke a ka e mere m ebere, ka Kraịst Jizọs[a] wee gosi n’ime m, onye mbụ[b], ndidi ya niile[c] n’ụzọ ga-abụ ihe nlereanya nye ndị ga-ekwere na ya[d] maka ndụ ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Mesaịa Jizọs.” Okwu Grik Χριστός bụ aha-ọrụ nke pụtara “Mesaịa” ma ọ bụ “Onye E Tere Mmanụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye bụ isi.” N’amaokwu bu ụzọ, Pọl kpọrọ onwe ya onye bụ isi n’etiti ndị mmehie.
    reason: ambiguity_context
  - marker: c
    text: Ma ọ bụ, “ogologo ntachi obi ya niile” ma ọ bụ “ndidi na-adịte aka ya niile.”
    reason: lexical_alternative
  - marker: d
    text: N’ụzọ nkịtị, “ndị na-aga ikwere na ya”; ihe a na-ekwu bụ ndị ga-emesịa kwere na ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠλεήθην
  choice: e meere m ebere
  rationale: Ọ bụ usoro nnara nke ngwaa ahụ; nsụgharị a bụ Igbo dị mfe ma na-ahapụ onye mere ebere ahụ n’aghaghị ịkpọ aha, dịka Grik si mee.
- source_word: πρώτῳ
  choice: onye bụ onye mbụ
  rationale: Nke a na-ejigide okwu Grik ‘mbụ/onye kachasị n’ihu’ ma na-ejikọta ya na nkwupụta Pọl banyere ndị mmehie n’amaokwu bu ụzọ, n’etinyeghị ‘onye kacha njọ’ kpọmkwem n’amaokwu a.
- source_word: ἐνδείξηται
  choice: gosi
  rationale: ‘Gosi’ na-ekwupụta ime ka ihe pụta ìhè n’ụzọ nkịtị ma doo anya n’Igbo.
- source_word: Χριστὸς Ἰησοῦς
  choice: Kraịst Jizọs
  rationale: ‘Kraịst’ bụ aha-ọrụ a maara nke ọma n’Igbo maka Χριστός; ihe odide ala peeji na-egosi ‘Mesaịa’ dịka nsụgharị pụtara ihe aha-ọrụ ahụ pụtara.
- source_word: ἅπασαν μακροθυμίαν
  choice: ogologo ntachi obi ya niile
  rationale: ‘Ogologo ntachi obi’ na-egosi njide onwe onye na ndidi na-adịte aka, ebe ‘ya niile’ na-echekwa nkwusi ike nke ἅπασαν.
- source_word: ὑποτύπωσιν
  choice: ihe nlereanya
  rationale: Ọ na-egosi ụdị ma ọ bụ ihe atụ e debere ka ndị ọzọ hụ ihe ga-adabara ha.
- source_word: τῶν μελλόντων πιστεύειν
  choice: ndị ga-ekwere
  rationale: Usoro a bụ Igbo nkịtị maka ndị ga-emesịa kwere, ma na-echekwa echiche ọdịnihu dị na μέλλω.
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: kwere na ya
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị ekwupụta ịtụkwasị onye obi na ikwere na ya.
- source_word: εἰς ζωὴν αἰώνιον
  choice: wee nweta ndụ ebighị ebi
  rationale: Ọ na-egosi ebumnuche ma ọ bụ nsonaazụ nke εἰς n’Igbo dị mfe, n’agbanyeghị na enwere ike ịsụ ya n’ụzọ na-edochaghị mmekọrịta ahụ anya.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Kraịst Jizọs
  alternative: Mesaịa Jizọs
  rationale: ‘Kraịst’ bụ ụdị a maara nke ọma n’Igbo, ebe ihe odide ala peeji na-echekwa ihe aha-ọrụ Grik ahụ pụtara, ya bụ ‘Mesaịa,’ n’etinyeghị nkọwa ụka pụrụ iche.
- issue: Onye mere ebere na onye gosiri ntachi obi
  choice: E debeghị onye mere ebere aha n’ahịrị mbụ, ma Kraịst Jizọs bụ onye gosiri ntachi obi n’ahịrị nzube.
  alternative: Ịkpọ Chineke Nna aha dịka onye mere ebere
  rationale: ἠλεήθην bụ usoro nnara na-enweghị onye ọrụ a kpọrọ aha; nkebi na-esote kpọrọ Kraịst Jizọs aha dịka onye gosiri ntachi obi. Nsụgharị ahụ anaghị ejikọta ma ọ bụ kewaa ọrụ ndị a karịa ihe ederede kwuru.
- issue: Mmekọrịta εἰς ζωὴν αἰώνιον
  choice: wee nweta ndụ ebighị ebi
  alternative: nke na-eduga ná ndụ ebighị ebi
  rationale: Nhọrọ bụ isi na-ekwupụta ndụ ebighị ebi dịka njedebe nke ikwere, ebe nhọrọ ọzọ na-eme ka ụzọ/nsonaazụ ahụ pụta ìhè; ha abụọ na-ezere ịkọwa usoro nzọpụta karịa ihe Grik kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu na-aga were were n’Igbo, ma e chekwara usoro nzube nke ἵνα, nnara nke ἠλεήθην, na echiche ọdịnihu nke μελλόντων. Akara ihe odide ala peeji niile dị n’ahịrị bụ isi.
