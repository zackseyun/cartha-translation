id: 1TI.1.4
reference: 1 Timothy 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: ig
  text: ka ha gharakwa ilekwasị akụkọ ifo na usoro ọmụmụ ndị na-enweghị njedebe anya, bụ́ ndị na-ebute ịkọ nkọ[a] karịa ọrụ nlekọta sitere n’aka Chineke[b] nke dị n’okwukwe[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-akpata esemokwu,” ma ọ bụ, “na-eme ka nyocha bilie.” Okwu Grik ahụ pụrụ ịpụta ajụjụ nyocha ma ọ bụ esemokwu; n’ebe a, ọ na-egosi ịkọ nkọ na-adịghị amị mkpụrụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nhazi Chineke,” “atụmatụ Chineke,” ma ọ bụ, “ọrụ nlekọta Chineke nyere.” Okwu Grik οἰκονομία pụrụ ịpụta nlekọta, nhazi, ma ọ bụ atụmatụ a haziri ahazi.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “n’ime okwukwe.” N’ebe a, “okwukwe” nwekwara ike inwe echiche nke “ịtụkwasị obi” ma ọ bụ “ikwesi ntụkwasị obi.”
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: ilekwasị anya
  rationale: Ọ na-egosi inye ihe ntị ma ọ bụ itinye uche na ya, ma na-aga n’ihu n’iwu e nyere n’amaokwu bu ụzọ.
- source_word: μύθοις
  choice: akụkọ ifo
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ nke a na-eji taa maka akụkọ e chepụtara echepụta; ọ naghị enye ya ụda akụkọ ụmụaka naanị.
- source_word: γενεαλογίαις ἀπεράντοις
  choice: usoro ọmụmụ ndị na-enweghị njedebe
  rationale: Ọ na-edobe echiche nke usoro ndị e si mụọ mmadụ nke na-aga n’ihu na-enweghị ọgwụgwụ.
- source_word: ἐκζητήσεις
  choice: ịkọ nkọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ajụjụ na nyocha na-adịghị amị mkpụrụ; ‘ịkọ nkọ’ na-egosipụta echiche efu na-adịghị ewuli okwukwe.
- source_word: παρέχουσι
  choice: na-akpata
  rationale: Ọ na-egosipụta na ihe ndị ahụ na-eweta ma ọ bụ na-eme ka ịkọ nkọ bilie.
- source_word: μᾶλλον ἢ
  choice: kama
  rationale: Ọ na-egosipụta ntụnyere nke na-emegide ihe abụọ a na-arụpụta.
- source_word: οἰκονομίαν θεοῦ
  choice: nlekọta sitere n’aka Chineke
  rationale: ‘Nlekọta’ na-ejigide isi echiche nke ọrụ onye e nyere ihe n’aka, nhazi, ma ọ bụ ilekọta atụmatụ; ‘sitere n’aka Chineke’ na-egosipụta θεοῦ dị ka isi mmalite n’enweghị imechi ụzọ nghọta ndị ọzọ.
- source_word: τὴν ἐν πίστει
  choice: nke a na-arụ n’okwukwe
  rationale: Nke a bụ Igbo eke nke na-egosi na nlekọta ahụ na-arụ ọrụ n’ime mpaghara okwukwe ma ọ bụ site n’okwukwe, n’enweghị ịkpa ókè n’etiti nghọta abụọ ahụ.
- source_word: πίστει
  choice: okwukwe
  rationale: Nke a bụ ntụgharị nkịtị nke πίστις n’ebe a; nkọwa ala peeji na-echekwa ohere nke ‘ịtụkwasị obi’ ma ọ bụ ‘ikwesị ntụkwasị obi.’
theological_decisions:
- issue: Ihe οἰκονομίαν θεοῦ pụtara
  choice: nlekọta sitere n’aka Chineke
  alternative: nhazi Chineke; atụmatụ Chineke; ọrụ nlekọta Chineke nyere
  rationale: Nhọrọ a na-echekwa obosara okwu οἰκονομία dị ka nlekọta, nhazi, ma ọ bụ atụmatụ a haziri ahazi, ma ghara itinye usoro ozizi dị warara n’ime amaokwu ahụ.
- issue: Nkọwa πίστει n’okwu τὴν ἐν πίστει
  choice: okwukwe
  alternative: ịtụkwasị obi; ikwesị ntụkwasị obi
  rationale: ‘Okwukwe’ bụ ntụgharị kwesịrị ekwesị n’ahịrị bụ isi, ebe nkọwa ala peeji na-echekwa obosara ihe πίστις pụrụ ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ njedebe ahịrị ahụ ka ọ bụrụ akara ogologo n’ihi na ahịrịokwu ahụ na-aga n’ihu site n’amaokwu bu ụzọ ruo n’amaokwu na-esote. E tinyere akara nkọwa [a], [b], na [c] ozugbo n’ebe okwu ndị ha na-akọwa dị.
