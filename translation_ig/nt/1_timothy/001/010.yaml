id: 1TI.1.10
reference: 1 Timothy 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: ig
  text: ndị na-eme omume rụrụ arụ n'ihe gbasara mmekọahụ, ndị ikom na-enwe mmekọahụ na ndị ikom ibe ha,[a] ndị na-atọrọ mmadụ ka ha ree ya ka ọ bụrụ ohu, ndị ụgha, ndị na-aṅụ iyi ụgha, na ihe ọ bụla ọzọ megidere ozizi ziri ezi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikom na-eme omume mmekọahụ nwoke na nwoke.” Okwu Grik bụ ἀρσενοκοῖται dị ụkọ, a na-arụrịtakwa ụka banyere ókè nkọwa ya ruru, ma ọ na-ezo aka n'omume mmekọahụ nwoke na nwoke.
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: ndị na-eme omume rụrụ arụ n'ihe gbasara mmekọahụ
  rationale: Nke a na-egosi ụdị omume mmekọahụ rụrụ arụ n'ozuzu ya, n'emeghị ka okwu ahụ bụrụ naanị otu ụdị mmehie mmekọahụ.
- source_word: ἀρσενοκοίταις
  choice: ndị ikom ha na ndị ikom ibe ha na-enwe mmekọahụ
  rationale: Ọ na-egosi kpọmkwem ndị nwoke na omume mmekọahụ nwoke na nwoke, n'etinyeghị echiche ọgbara ọhụrụ banyere njirimara mmadụ n'ime okwu Grik ahụ.
- source_word: ἀνδραποδισταῖς
  choice: ndị na-atọrọ mmadụ ree ha ka ha bụrụ ohu
  rationale: Okwu ahụ na-ezo aka n'ịnweta ma ọ bụ ịzụ ahịa mmadụ ka ha bụrụ ndị ohu; nsụgharị a na-eme ka ihe ọjọọ ahụ doo onye Igbo nke oge a anya.
- source_word: ψεύσταις
  choice: ndị ụgha
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke a na-aghọta nke ọma isi kwuo ndị na-ekwu ụgha.
- source_word: ἐπιόρκοις
  choice: ndị na-aṅụ iyi ụgha
  rationale: Ọ na-egosi ndị na-agba akaebe ụgha n'iyi ma ọ bụ ndị iyi ha abụghị eziokwu.
- source_word: καὶ εἴ τι ἕτερον
  choice: na ihe ọ bụla ọzọ
  rationale: Ọ na-echekwa ọdịdị okwu a nke na-eme ka ndepụta ahụ gbasaa ruo n'ihe ndị ọzọ yiri ha.
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: ozizi ziri ezi
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka ozizi dị mma na nke na-enweghị ntụpọ, ma ọ naghị eji asụsụ ụka siri ike na-enweghị mkpa.
- source_word: ἀντίκειται
  choice: megidere
  rationale: Ọ na-egosi na ihe ahụ na-emegide ozizi ahụ kpọmkwem.
theological_decisions:
- issue: Nsụgharị ἀρσενοκοίταις n'ọnọdụ a na-arụrịta ụka banyere nkọwa okwu na ozizi
  choice: ndị ikom ha na ndị ikom ibe ha na-enwe mmekọahụ
  alternative: ndị ikom na-eme omume mmekọahụ nwoke na nwoke
  rationale: Nhọrọ a na-elekwasị anya n'omume mmekọahụ nwoke na nwoke nke okwu Grik ahụ na-egosi, kama ibubata ụdị echiche ọgbara ọhụrụ banyere njirimara. E debere ụzọ ọzọ e si akọwa ya n'ala peeji n'ihi na okwu Grik ahụ dị ụkọ, a na-arụrịta ụka banyere ókè nkọwa ya rukwara.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma doo anya, dee ya. E mere ndepụta ahụ ka ọ na-aga nke ọma n'Igbo, ma chekwaa akara ala peeji [a] ozugbo n'akụkụ okwu ọ na-akọwa.
