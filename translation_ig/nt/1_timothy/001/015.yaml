source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: ig
  text: 'Okwu a bụ nke a pụrụ ịtụkwasị obi, kwesịkwa ka a nabata ya n''ụzọ zuru ezu: Mesaịa Jisọs[a] bịara n’ụwa ịzọpụta ndị mmehie; n’etiti ha, mụ onwe m bụ onye mbụ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst Jisọs.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsị, “onye kasị njọ n’etiti ha” ma ọ bụ “onye isi n’etiti ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: Okwu a bụ nke a pụrụ ịtụkwasị obi
  rationale: Usoro okwu a na-egosi okwu a pụrụ ịdabere na ya; ntụgharị a bụ Igbo dị ugbu a ma doo anya.
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: kwesịkwa ka a nabata ya n'ụzọ zuru ezu
  rationale: Nke a na-egosipụta na okwu ahụ kwesịrị nnabata zuru oke, ma zere ntụgharị nkịtị na-adịghị atọ ụtọ n’Igbo.
- source_word: ὅτι
  choice: ':'
  rationale: Akara ntụpọ abụọ na-ewebata ọdịnaya nke okwu a pụrụ ịtụkwasị obi, dịka ὅτι si arụ ọrụ n’ebe a, n’enweghị ime ya ka ọ bụrụ ihe kpatara ihe ọzọ.
- source_word: Χριστὸς Ἰησοῦς
  choice: Mezaịa Jizọs
  rationale: Χριστός ka bụ aha ọkwá n’okwu nkwupụta a; ya mere a sụgharịrị ya ‘Mezaịa,’ ebe Jizọs bụ aha e dere n’ụdị Igbo.
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: bịara n’ụwa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi chekwaa echiche nke ịbata n’ụwa.
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: ịzọpụta ndị mmehie
  rationale: ‘Ịzọpụta’ na ‘ndị mmehie’ bụ okwu Igbo doro anya ma dabara n’ihe nzọpụta a na-ekwu maka ya.
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: ndị mụ onwe m bụ onye mbụ n’etiti ha
  rationale: ‘Onye mbụ’ na-echekwa ihe πρῶτος pụtara n'ụzọ bụ isi—onye nọ n’isi ma ọ bụ onye kacha pụta ìhè—n’ebughị ụzọ kpebie na ọ pụtara naanị ‘onye kasị njọ.’ ‘Mụ onwe m’ na-egosipụta ike e tinyere na ἐγώ.
theological_decisions:
- issue: Otu e si sụgharịa Χριστός
  choice: Mezaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka aha ọkwá nke Onye E Tere Mmanụ; a hapụrụ ụdị ọdịnala ‘Kraịst’ na nkọwa ala peeji.
- issue: Ihe πρῶτος pụtara n’etiti ndị mmehie
  choice: onye mbụ n’etiti ha
  alternative: onye kasị njọ n’etiti ha; onyeisi ha
  rationale: Isiokwu Grik nwere ike igosi onye mbụ, onye nọ n’isi, ma ọ bụ onye kacha pụta ìhè. Isi ederede na-echekwa obosara ahụ; nkọwa ala peeji na-enye ụzọ ndị ọzọ a pụrụ isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro nkwupụta ahụ n’ụdị okwu nkịtị, ma chekwaa mgbagwoju anya dị na πρῶτος kama ikpebi otu nkọwa naanị.
