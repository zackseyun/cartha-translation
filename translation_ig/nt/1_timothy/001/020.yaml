  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: ig
  text: N’ime ha ka Haimenaịọs na Alegzanda nọ. Enyefere m ha n’aka Setan[a], ka e wee zụọ ha[b] ka ha ghara ikwu nkwulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “nyefere m ha n’aka Setan.” Okwu a nwere ike izo aka ná mgbazi siri ike e mere ka ha gbanwee, ọ bụghị ikpe mbibi ikpeazụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a pụkwara ịpụta “kuziere,” “zụlite,” ma ọ bụ “gbazie”; ọ na-agụnye echiche nke izi mmadụ ihe site n’ịgbazi ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: N’ime ha ka ... nọ
  rationale: Nke a na-egosipụta echiche partitive nke okwu Grik ahụ—mmadụ abụọ a so n’ìgwè ahụ e kwuru okwu ya—n’ụzọ Igbo na-ada nke ọma.
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: Haimenịọs na Alegzanda
  rationale: E dere aha ndị a n’ụdị mkpụrụokwu dabara n’ọkpụkpọ na usoro ide Igbo.
- source_word: παρέδωκα
  choice: Enyefere m
  rationale: Okwu a na-echekwa echiche nke inyefe mmadụ n’aka onye ọzọ, n’enweghị ịkọwa usoro ma ọ bụ ihe kpọmkwem inyefe ahụ pụtara.
- source_word: τῷ Σατανᾷ
  choice: n’aka Setan
  rationale: ‘Setan’ bụ aha a na-ejikarị eme ihe n’Igbo; ‘n’aka’ na-egosi onye e nyefere ha nye n’ụzọ ebumpụta ụwa.
- source_word: ἵνα παιδευθῶσι
  choice: ka e wee site n’ịgbazi ha kuziere ha
  rationale: παιδεύω nwere ma echiche izi ihe ma nke ọzụzụ sitere na mgbazi. Nsụgharị a jikọtara ha abụọ n’enweghị ịsị na ọ bụ ntaramahụhụ anụ ahụ.
- source_word: μὴ βλασφημεῖν
  choice: ịghara ikwu okwu nkwulu
  rationale: E jighị ihe okwu nkwulu ahụ lekwasịrị anya kpọmkwem dochie oghere dị n’ahịrị Grik; nke a na-echekwa ịdị arọ nke βλασφημέω ma ghara ịtinye ‘Chineke’ n’ebe isi mmalite ahụ na-ekwughị ya.
theological_decisions:
- issue: Ihe ‘inyefe n’aka Setan’ pụtara
  choice: E debere okwu ahụ n’ụdị nkịtị ma gosipụta ebumnuche mgbazi ya site n’ahịrị na-esote.
  alternative: Ịkọwa ya kpọmkwem dị ka ịchụpụ n’ọgbakọ, ịkpata ọrịa n’ụzọ ọrụ ebube, ma ọ bụ ikpe mbibi ikpeazụ.
  rationale: Nkebi ebumnuche ἵνα παιδευθῶσι na-egosi na ihe ahụ chọrọ ịgbazi ha. Ma amaokwu ahụ akọwaghị usoro o si mee, ya mere nsụgharị ahụ anaghị amanye otu nkọwa ụka ma ọ bụ nkwenkwe pụrụ iche.
- issue: Ihe παιδευθῶσι pụtara
  choice: site n’ịgbazi ha kuziere ha
  alternative: nye ha ntaramahụhụ; kuziere ha naanị
  rationale: Nhọrọ ahụ na-echekwa esemokwu dị n’etiti izi ihe na mgbazi siri ike, bụ́ ihe okwu Grik ahụ nwere ike ịgụnye.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrị ahụ ụzọ abụọ ka ọ gụọ nke ọma, ma e chekwara njikọ echiche ya. A hapụrụ nkọwa ‘inyefe n’aka Setan’ ka ọ nọgide nwee obosara na esemokwu dị n’isi mmalite.
