revisions:
- from: m bụbu onye na-ekwu okwu nkwulu, na onye mkpagbu, na onye na-eme ihe ike[a]. Ma e meere m ebere[b], n’ihi na emere m ihe ndị ahụ n’amaghị ama[c], mgbe m na-ekweghị ekwe[d].
  to: M bụbu onye na-ekwu okwu nkwulu, na onye na-akpagbu mmadụ, na onye na-eme ihe ike[a]. Ma e meere m ebere[b], n’ihi na emere m ihe n’amaghị ama[c], n’ekweghị ekwe[d].
  rationale: The revision removes the supplied object “ihe ndị ahụ,” renders the persecutor descriptor with an explicit but generic human object for clear modern Igbo, and changes the final phrase from a temporal “when” clause to an expression of the state of unbelief. Footnote c is corrected to give genuine alternatives for ἀγνοῶν. All source ambiguity and the causal force of ὅτι are retained without doctrinal expansion.
