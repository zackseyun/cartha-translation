  text: ⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/013.yaml
  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: ig
  text: M bụbu onye na-ekwu okwu nkwulu, na onye na-akpagbu mmadụ, na onye na-eme ihe ike[a]. Ma e meere m ebere[b], n’ihi na emere m ihe n’amaghị ama[c], n’ekweghị ekwe[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye mpako na-eme ndị ọzọ ihe ọjọọ,” ma ọ bụ “onye obi tara mmiri.” Okwu Grik a na-egosi omume mkparị na ime ihe ike gabigara ókè, ọ bụghị naanị mpako.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anatara m ebere.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mgbe m na-amaghị,” ma ọ bụ “n’ihi amaghị ama.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “n’enweghị okwukwe,” ma ọ bụ “n’emeghị ntụkwasị obi.” N’ebe a, ihe o yikarịrị ka ọ pụtara bụ enweghị okwukwe karịa ekwesịghị ntụkwasị obi n’ọgbụgba ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: m bụbu
  rationale: Nke a na-egosi ọnọdụ Pọl n’oge gara aga ma na-ejikọta ya na ihe e kwuru n’amaokwu bu ụzọ. “M bụbu” bụ Igbo nkịtị nke na-eburu ma echiche oge gara aga ma participle ahụ.
- source_word: βλάσφημον
  choice: onye na-ekwu okwu nkwulu
  rationale: Aha a na-akọwa mmadụ site n’omume ya. Nhọrọ a na-ezere ịgbakwunye onye a na-ekwulu mgbe Grik ekwughị ya kpọmkwem, ma na-eme ka okwu ahụ doo onye Igbo nke oge a anya.
- source_word: διώκτην
  choice: onye mkpagbu
  rationale: “Onye mkpagbu” bụ ụzọ dị mkpirikpi, dịkwa ugwu, isi kwuo onye na-akpagbu ndị ọzọ n’ihi okwukwe ha.
- source_word: ὑβριστήν
  choice: onye na-eme ihe ike
  rationale: Okwu Grik a na-egosi omume mkparị na ime ihe ike gabigara ókè, ọ bụghị naanị mpako. Isi ederede họọrọ okwu doro anya, ebe nkọwa ala peeji na-echekwa obosara ihe okwu ahụ pụtara.
- source_word: ἠλεήθην
  choice: e meere m ebere
  rationale: Nke a na-echekwa passive Grik ahụ ma na-egosi na ebere bụ ihe e mere Pọl, n’ebughị ụzọ kpọọ onye mere ya aha n’ahịrịokwu a.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Nke a na-echekwa njikọ ihe kpatara ya nke ὅτι, n’ebughị echiche na amaghị ama mere ka Pọl kwesị ebere.
- source_word: ἀγνοῶν ἐποίησα
  choice: emere m ihe ndị ahụ n’amaghị ama
  rationale: Nke a jikọtara participle na ngwaa ahụ n’Igbo dị mfe, ma “ihe ndị ahụ” na-ezo aka n’omume ọ ka depụtara n’ebughị ihe ọhụrụ n’ime ederede.
- source_word: ἐν ἀπιστίᾳ
  choice: mgbe m na-ekweghị ekwe
  rationale: N’ebe a ἀπιστία kacha egosi enweghị okwukwe ma ọ bụ ekweghị ekwe. Usoro a bụ Igbo nkịtị ma na-echekwa ya dịka ọnọdụ Pọl nọ n’ime ya mgbe o mere omume ndị ahụ.
theological_decisions:
- issue: Ihe ὅτι na-ewebata dịka ihe mere e ji meere Pọl ebere
  choice: “n’ihi na” na-egosi na Pọl kwuru na e meere ya ebere n’ihi na o mere ihe ndị ahụ n’amaghị ama mgbe ọ na-ekweghị ekwe.
  alternative: Ịghọta ya naanị dịka nkọwa ọnọdụ ihe ahụ mere, ọ bụghị dịka ihe kpatara ya.
  rationale: ὅτι nwere ike iweta ihe kpatara ya ma ọ bụ nkọwa ya. Ederede a na-echekwa njikọ ahụ n’enweghị ịsị na amaghị ama mere ka Pọl ruo eru inweta ebere; ya mere esemokwu nkà mmụta okpukpe dị n’ahịrịokwu ahụ ka dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E debere usoro nkọwa atọ ahụ na njikọ “na,” ma jiri usoro ngwaa ebe aha pụrụ ịdị arọ ma ọ bụ ghara ido anya. Akara nkọwa ala peeji niile dị n’isi ederede.
