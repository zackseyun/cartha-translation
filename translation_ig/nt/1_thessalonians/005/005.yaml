id: 1TH.5.5
reference: 1 Thessalonians 5:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: ig
  text: N’ihi na unu niile bụ ụmụ nke ìhè na ụmụ nke ehihie[a]. Anyị abụghị nke abalị ma ọ bụ nke ọchịchịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, Grik sịrị “ụmụ nwoke nke ìhè na ụmụ nwoke nke ehihie.” Nke a bụ ilu na-egosi ndị e ji ìhè na ehihie mara ma ọ bụ ndị bụ nke ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: niile
  rationale: E tinyere ya n’azụ “unu” n’usoro okwu Igbo nkịtị iji gosipụta na ọ na-agụnye onye ọ bụla n’ime ha.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-edobe njikọ nkọwa dị n’etiti amaokwu a na ihe e kwuru tupu ya.
- source_word: υἱοὶ
  choice: ụmụ
  rationale: “Ụmụ” bụ okwu Igbo ebumpụta ụwa maka ụmụ ma ọ bụ ndị sitere n’otu ìgwè; n’ilu a, ọ na-egosi ndị e ji ìhè na ehihie mara ma ọ bụ ndị bụ nke ha. Asụsụ Igbo anaghị amanye akara nwoke n’ụdị ọtụtụ a; ihe odide ala peeji na-egosi na Grik ji okwu pụtara “ụmụ nwoke” n’ụzọ nkịtị.
- source_word: φωτός
  choice: ìhè
  rationale: Ọ na-edobe ihe atụ nke ìhè na-emegide ọchịchịrị, tinyere echiche nke ịbụ nke ìhè.
- source_word: ἡμέρας
  choice: ehihie
  rationale: “Ehihie” na-egosipụta akụkụ ụbọchị nke ìhè ma na-emegide “abalị” n’ụzọ doro anya karịa “ụbọchị,” nke nwekwara ike ịpụta ụbọchị kalenda.
- source_word: οὐκ ἐσμὲν
  choice: Anyị abụghị
  rationale: Ọ na-echekwa mgbanwe onye nke abụọ “unu” gaa n’onye mbụ ọtụtụ “anyị” dị na Grik, kama ime ka ha bụrụ otu.
- source_word: νυκτός
  choice: nke abalị
  rationale: Ọ na-egosi ịbụ nke abalị ma na-edobe myirịta ya na “nke ìhè” na “nke ehihie.”
- source_word: σκότους
  choice: nke ọchịchịrị
  rationale: Ọ na-echekwa ihe atụ nke ọchịchịrị na-emegide ìhè n’amaokwu ahụ.
theological_decisions:
- issue: Ilụ ezinụlọ nwere akara nwoke na υἱοὶ φωτός / υἱοὶ ἡμέρας
  choice: ụmụ nke ìhè na ụmụ nke ehihie
  alternative: ụmụ nwoke nke ìhè na ụmụ nwoke nke ehihie
  rationale: Grik ji υἱοί, nke pụtara “ụmụ nwoke” n’ụzọ nkịtị, ma n’ilu a ọ na-agụnye ndị niile a na-agwa okwu ma na-egosi ndị bụ nke ìhè na ehihie. “Ụmụ nwoke” n’ahịrị Igbo bụ́ isi ga-ada ka ọ na-ewepụ ụmụ nwanyị; ya mere “ụmụ” na-ebuga ike ilu ahụ n’enweghị itinye nkọwa okpukpe ọzọ, ebe ihe odide ala peeji na-echekwa nkọwa ọdịdị okwu Grik.
- issue: Mgbanwe site n’onye nke abụọ gaa n’onye mbụ ọtụtụ
  choice: unu niile bụ ... Anyị abụghị ...
  alternative: unu niile bụ ... Unu abụghị ...
  rationale: A chekwara mgbanwe ahụ dị n’ihe odide Grik, nke nwere ike ịgụnye Pọl na ndị ya na ha nọ n’otu nkwupụta ahụ, kama idozi ya ka ọ bụrụ otu onye okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ụmụ nke ...” na-echekwa ilu nke ịbụ nke otu ihe; “ehihie” na-eme ka mmegide ya na “abalị” pụta ìhè. E debere akara ihe odide ala peeji [a] ozugbo n’ebe okwu ọ na-akọwa dị.
