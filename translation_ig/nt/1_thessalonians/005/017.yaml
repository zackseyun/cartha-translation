  text: ἀδιαλείπτως προσεύχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/017.yaml
  text: Pray without ceasing[a].
translation:
  language: ig
  text: Na-ekpenụ ekpere mgbe niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Na-ekpenụ ekpere n'esepụghị aka,” ma ọ bụ “Na-anọgidenụ n'ekpere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: mgbe niile
  rationale: Ọ na-egosi omume a na-eme n'esepụghị aka ma ọ bụ nke a na-anọgidesi ike na ya. N'Igbo nkịtị, “mgbe niile” na-enye iwu ahụ ike kwesịrị ekwesị n'ebughị n'uche na mmadụ ga na-ekwu ekpere n'ọnụ n'ụzọ na-akwụsịghị otu sekọnd.
- source_word: προσεύχεσθε
  choice: Na-ekpenụ ekpere
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke ọdịdị ya na-egosi omume na-aga n'ihu ma ọ bụ a na-eme mgbe niile. “Na-ekpenụ ekpere” bụ ụzọ Igbo dị ndụ si gosi iwu ahụ na omume na-aga n'ihu.
theological_decisions:
- issue: Ihe iwu a chọrọ n'omume
  choice: Ndụmọdụ zuru ezu ka ndị kwere ekwe nọgide na-ekpe ekpere mgbe niile.
  alternative: Iwu ka mmadụ na-ekwu ekpere n'ọnụ n'ụzọ na-akwụsịghị n'oge ọ bụla.
  rationale: Ngwakọta nke iwu dị n'ụdị na-aga n'ihu na ἀδιαλείπτως na-akpọ ndị mmadụ òkù ka ha nọgide n'ekpere. Nsụgharị ahụ echekwaghị iwu ahụ ume, ma ọ naghị amanye nkọwa na mmadụ aghaghị ikwu ekpere n'ọnụ sekọnd ọ bụla.
translation_notes:
  register: Standard Igbo; okwu dị mfe, dị ugwu, ma doo ndị na-agụ akwụkwọ taa anya. E ji akara ọtụtụ mmadụ “-nụ” chekwaa na iwu Grik ahụ bụ nke e nyere ọtụtụ mmadụ.
