revisions:
- from: Ma unu[a], ụmụnna, anọghị n'ọchịchịrị, nke ga-eme ka ụbọchị ahụ[b] bịakwasị unu dị ka onye ohi.
  to: Ma unu, ụmụnna[a], anọghị n'ọchịchịrị, ka ụbọchị ahụ[b] wee jide unu dị ka onye ohi.
  rationale: The revised ka ... wee clause is a close, natural way to represent the ἵνα relationship while leaving its precise purpose/result nuance unforced. "Jide" renders the overtaking/catching force of καταλάβῃ without paraphrasing it as surprise. Footnote placement is corrected, and no doctrinal interpretation has been added to the main text.
