id: 1TH.5.4
reference: 1 Thessalonians 5:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: ig
  text: Ma unu, ụmụnna[a], anọghị n'ọchịchịrị, ka ụbọchị ahụ[b] wee jide unu dị ka onye ohi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” n'ebe a na-agụnye ụmụnna nwoke na ụmụnna nwanyị.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ụbọchị Onyenwe anyị a kpọtụrụ aha n'amaokwu 2.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: Ma unu
  rationale: “Ma” na-egosi ọdịiche dị n'etiti ndị a na-ekwu okwu banyere ha n'amaokwu ndị bu ụzọ na ndị Tesalonaịka; “unu” nke e kwuru hoo haa na-echekwa nkwusi ike dị na ὑμεῖς.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa maka ndị otu ezinụlọ ma ọ bụ ndị otu okwukwe; ọ pụkwara ịgụnye ma ndị nwoke ma ndị nwanyị n'enweghị ịgbakwunye ihe na-adịghị n'okwu Grik.
- source_word: ἐν σκότει
  choice: n'ọchịchịrị
  rationale: Nhọrọ a na-echekwa ihe atụ nke ọchịchịrị, nke n'ebe a na-arụtụ aka n'amaghị ama na ọnọdụ ime mmụọ.
- source_word: ἵνα
  choice: nke ga-eme ka
  rationale: Nke a na-ejikọta ọnọdụ nke ịnọ n'ọchịchịrị na ihe ga-esi na ya pụta, ma ọ naghị ekpebi n'ụzọ siri ike ma ἵνα na-egosi nzube ka ọ bụ nsonaazụ.
- source_word: ἡ ἡμέρα
  choice: ụbọchị ahụ
  rationale: “Ahụ” na-egosi ụbọchị a kapịrị ọnụ nke a kpọtụrụla aha n'ọnọdụ gbara amaokwu a gburugburu, na-enweghị itinye nkọwa zuru ezu n'ahịrị isi.
- source_word: ὡς κλέπτης
  choice: dị ka onye ohi
  rationale: Nke a bụ ntụnyere Igbo doro anya ma na-echekwa ihe atụ Grik.
- source_word: καταλάβῃ
  choice: bịakwasị
  rationale: “Bịakwasị” na-egosi ihe na-erute mmadụ na mberede ma na-adaba nke ọma n'ihe atụ banyere ụbọchị ahụ na-abịa dị ka onye ohi; ọ naghị akọwapụta ya nanị dịka ‘ime ka o ju mmadụ anya.’
theological_decisions:
- issue: Adreesị ἀδελφοί na ọgbakọ nwere ma ndị nwoke ma ndị nwanyị
  choice: ụmụnna
  alternative: ụmụnne nwoke; ụmụnna nwoke na nwanyị
  rationale: N'Igbo, “ụmụnna” nwere ike ịbụ okwu mkpokọta maka ndị otu okwukwe, ya mere ọ na-echekwa adreesị ezinụlọ nke okwu Grik ma ghara iwepụ ụmụ nwanyị nọ n'ọgbakọ ahụ.
- issue: Ihe ἡ ἡμέρα na-arụtụ aka na ya n'ihe banyere ọgwụgwụ oge
  choice: ụbọchị ahụ
  alternative: ụbọchị Onyenwe anyị
  rationale: Okwu Grik n'onwe ya bụ naanị “ụbọchị ahụ,” ebe amaokwu 2 na-eme ka o doo anya na ọ bụ ụbọchị Onyenwe anyị. E debere nkọwa zuru ezu ahụ n'ala peeji kama itinye ya n'ahịrị isi.
- issue: 'Mmekọrịta nke ἵνα: nzube ka ọ bụ nsonaazụ'
  choice: nke ga-eme ka
  alternative: ka ụbọchị ahụ ghara ịbịakwasị unu
  rationale: Nhazi a na-echekwa njikọ dị n'etiti ọchịchịrị na ụbọchị ahụ ịbịakwasị mmadụ, ma ọ naghị eme ka okwu ahụ bụrụ nkwupụta nzube doro anya karịa ka Grik siri dị.
translation_notes:
  register: Asụsụ Igbo izugbe, dị ugwu ma dị mfe nghọta. E chekwara ihe atụ “ọchịchịrị” na “onye ohi.” Akara ala peeji [a] na-esochi “unu” dịka n'usoro enyere, ma nkọwa ya metụtara “ụmụnna”; [b] na-esochi “ụbọchị ahụ.”
