review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the contrast, the familial vocative, the darkness image, and the contextual reference of "the day." However, "nke ga-eme ka" makes the preceding condition the cause of the day’s action and is not a faithful rendering of ἵνα. "Bịakwasị" can mean come upon, but "jide" more directly conveys καταλάβῃ here: overtake/catch unexpectedly.'
  naturalness: The revision uses idiomatic Standard Igbo syntax. Moving footnote a to "ụmụnna" correctly anchors the note to the term it explains.
  terminology: '"Ụmụnna," "ọchịchịrị," "ụbọchị ahụ," and "onye ohi" are suitable, dignified, and readily understood. The contextual expansion "Ụbọchị Onyenwe anyị" remains confined to the footnote.'
  issues:
  - severity: medium
    issue: '"nke ga-eme ka" for ἵνα'
    rationale: This relative construction means “which will cause,” introducing a causal claim not expressed by ἵνα and producing an awkward logical relationship. A ka-clause preserves the Greek linkage without specifying it as a causal assertion.
  - severity: medium
    issue: '"bịakwasị" for καταλάβῃ'
    rationale: Although it can convey sudden arrival, it primarily focuses on coming upon. In this context καταλαμβάνω denotes overtaking or catching someone; "jide" expresses that sense more directly.
  - severity: low
    issue: Footnote a is anchored after "unu" rather than "ụmụnna"
    rationale: The footnote explains ἀδελφοί/"ụmụnna," so its marker should immediately follow that word.
  revised_text: Ma unu, ụmụnna[a], anọghị n'ọchịchịrị, ka ụbọchị ahụ[b] wee jide unu dị ka onye ohi.
  revised_footnotes:
