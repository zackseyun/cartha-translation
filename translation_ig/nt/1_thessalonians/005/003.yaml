id: 1TH.5.3
reference: 1 Thessalonians 5:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: ig
  text: Mgbe ha na-ekwu, “Udo na nchekwa[a],” mgbe ahụ mbibi mberede ga-abịakwasị ha, dịka mgbu ịmụ nwa[b] si abịakwasị nwanyị dị ime; ha agaghị agbanahụ ma ọlị.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Udo na nchebe.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mgbu ọmụmụ.”
    reason: lexical_alternative
  - marker: c
    text: 'N’asụsụ Grik, e ji nkwụsi ike jụ ya: “ha agaghị agbanahụ ma ọlị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: Mgbe ha na-ekwu
  rationale: “Mgbe” na-egosi oge ihe ahụ ga-eme n’ọnọdụ amụma a, ebe “ha na-ekwu” na-edobe onye a na-akpọghị aha na omume dị na nkebiokwu Grik.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: Udo na nchekwa
  rationale: “Udo” bụ ihe kwekọrọ na εἰρήνη, “nchekwa” na-egosikwa ọnọdụ mmadụ ji n’aka na ihe ize ndụ adịghị, nke bụ isi echiche ἀσφάλεια n’ebe a.
- source_word: αἰφνίδιος ... ὄλεθρος
  choice: mbibi mberede
  rationale: Nke a na-edobe ịdị ngwa na-atụghị anya ya nke αἰφνίδιος na ịdị arọ nke ὄλεθρος, n’enweghị ịkọwa kpọmkwem ụdị ma ọ bụ ogologo ntaramahụhụ ahụ.
- source_word: ἐφίσταται
  choice: ga-abịakwasị ha
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi mbibi nke na-abịara ha na mberede. Oge ọdịnihu na Igbo na-eme ka amụma dị n’ahịrịokwu ahụ doo anya.
- source_word: ἡ ὠδὶν
  choice: ihe mgbu ịmụ nwa
  rationale: Nke a bụ okwu Igbo doro anya maka ihe mgbu nke na-abịa mgbe nwanyị na-amụ nwa, ma na-edobe ihe atụ Grik.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: nwanyị dị ime
  rationale: Nke a bụ ụzọ ebumpụta ụwa n’Igbo e si kwuo onye nwere nwa n’afọ, n’enweghị ịgbatị okwu ahụ n’ụzọ siri ike.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: ha agaghịkwa agbanahụ ya ma ọlị
  rationale: '“Ma ọlị” na-egosipụta nkwusi ike dị n’ụzọ Grik si jụ ya ugboro abụọ: ọ gaghị ekwe omume na ha ga-agbanahụ.'
theological_decisions:
- issue: Ihe ὄλεθρος pụtara n’ịdọ aka ná ntị banyere ikpe ikpeazụ
  choice: A sụgharịrị ya “mbibi” n’enweghị ịkọwa ma ọ bụ mkpochapụ kpamkpam ma ọ bụ ụdị ntaramahụhụ ọzọ.
  alternative: “Ọdachi” ma ọ bụ “ịla n’iyi.”
  rationale: Okwu ahụ na-egosi ikpe dị oke njọ, ma amaokwu a n’onwe ya akọwaghị ụdị ikpe ahụ ma ọ bụ ogologo oge ọ ga-adị. “Mbibi” na-edobe ịdị arọ ya n’etinyeghị ozizi otu ụka.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ “ha” n’enweghị ịkọwa ndị ọ bụ, dịka isi mmalite Grik mere. Akara ụkwụ ala atọ ahụ niile pụtara n’ederede isi.
