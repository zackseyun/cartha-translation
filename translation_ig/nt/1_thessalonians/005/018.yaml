base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: ig
  text: N'ihe niile[a], na-enyenụ ekele, n'ihi na nke a bụ uche Chineke n'ime Mesaya Jizọs maka unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “n''ọnọdụ niile.” N''ụzọ nkịtị, Grik kwuru “n''ihe niile.” Nke a na-ekwu banyere ọnọdụ ndị kwere ekwe nọ na ha mgbe ha na-enye ekele; ọ pụtaghị na ha ga-enye Chineke ekele maka ihe ọjọọ n''onwe ya.'
    reason: lexical_alternative
  - marker: b
    text: 'Ụdị nsụgharị ọdịnala: “n''ime Kraịst Jizọs.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: n'ọnọdụ niile
  rationale: Nkebiokwu a na-egosi ọnọdụ ma ọ bụ gburugburu ihe mmadụ nọ na ya mgbe ọ na-enye ekele. Nhọrọ a na-ezere ime ka okwu ahụ pụta na a ga-enye Chineke ekele maka ihe ọjọọ n'onwe ya.
- source_word: εὐχαριστεῖτε
  choice: Na-enyenụ ekele
  rationale: Nke a bụ iwu e nyere ọtụtụ mmadụ, nke na-akpọ ha ka inye ekele bụrụ omume ha na-eme mgbe niile, n'enweghị itinye okwu ọzọ nke ga-emebiga ihe akụkụ ngwaa Grik pụtara.
- source_word: τοῦτο
  choice: nke a
  rationale: Okwu ngosi a na-atụ aka ozugbo n'iwu ka ha na-enye ekele, ma na-edobe mkpụmkpụ nke Grik.
- source_word: γὰρ
  choice: n'ihi na
  rationale: Ọ na-ewebata ihe mere e ji nye iwu ahụ; nke a bụ ụzọ doro anya ma bụrụkwa nke nkịtị n'Igbo.
- source_word: θέλημα θεοῦ
  choice: uche Chineke
  rationale: Ọ na-egosi ihe Chineke chọrọ ma na-asụ ya n'Igbo dị mfe ma kwụ ọtọ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n'ime Mesaya Jizọs
  rationale: A sụgharịrị Χριστός dị ka utu aha ‘Mesaya,’ ebe ‘n'ime’ na-edobe asụsụ Pọl banyere njikọ nke ndị kwere ekwe na Mesaya n'ebughị ụzọ kọwaa njikọ ahụ n'ụzọ ga-emechi nghọta ndị ọzọ.
- source_word: εἰς ὑμᾶς
  choice: maka unu
  rationale: N'ebe a, nkebiokwu ahụ na-egosi na uche Chineke metụtara ndị a na-agwa okwu ma ọ bụ na ọ bụ maka ha.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστῷ dị ka utu aha ka a ga-eji ụdị ọdịnala
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: Χριστός ka nwere ọrụ doro anya dị ka utu aha n'okwu a, ya mere ‘Mesaya’ na-eme ka ihe utu aha ahụ pụtara pụta ìhè; e debere ụdị ọdịnala n'ala peeji.
- issue: Ma ‘n'ọnọdụ niile’ ọ pụtara inye ekele n'ime ọnọdụ ọ bụla ka ọ bụ maka ihe ọ bụla
  choice: inye ekele n'ọnọdụ niile
  alternative: inye ekele maka ihe niile
  rationale: ἐν tinyere παντί na-egosi nke ọma gburugburu ma ọ bụ ọnọdụ a na-enye ekele n'ime ya. Nke a anaghị ekwu hoo haa na a ga-enye ekele maka ihe ọjọọ n'onwe ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee nsọpụrụ. Ụdị iwu ọtụtụ mmadụ ‘Na-enyenụ’ dabara n'okwu a na-agwa ọgbakọ dum. E debere ‘n'ime’ iji chekwaa asụsụ njikọ Pọl n'agbanyeghị na ọ bụ okwu pụrụ iche n'Igbo.
