- from: Na-enyenụ ekele n'ọnọdụ niile[a], n'ihi na nke a bụ uche Chineke maka unu n'ime Mesaya Jizọs.[b]
  to: N'ihe niile[a], na-enyenụ ekele, n'ihi na nke a bụ uche Chineke n'ime Mesaya Jizọs maka unu.[b]
