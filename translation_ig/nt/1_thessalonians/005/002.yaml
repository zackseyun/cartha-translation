id: 1TH.5.2
reference: 1 Thessalonians 5:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: ig
  text: N’ihi na unu onwe unu maara nke ọma na ụbọchị Onyenwe anyị na-abịa dị ka onye ohi n’abalị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: unu onwe unu
  rationale: Nke a na-echekwa nkwusiri ike dị na nnọchiaha Grik ahụ, ma na-ada nke ọma n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a bụ nkọwa ma ọ bụ ihe mere e ji kwuo okwu bu ya ụzọ.
- source_word: ἀκριβῶς
  choice: nke ọma
  rationale: N’akụkụ ngwaa ‘maara,’ okwu a na-egosi na ha maara ya nke ọma na n’ụzọ doro anya, n’enweghị ime ka ahịrịokwu ahụ sie ike nghọta.
- source_word: οἴδατε
  choice: maara
  rationale: Nke a bụ okwu Igbo kwụ ọtọ ma dịkwa ebumpụta ụwa maka ịmata ihe.
- source_word: ἡμέρα κυρίου
  choice: ụbọchị Onyenwe anyị
  rationale: Ọ na-echekwa akpaokwu amụma nke Akwụkwọ Nsọ gbasara ụbọchị Onyenwe anyị, ọ bụghị ụbọchị ofufe kwa izu.
- source_word: ὡς κλέπτης ἐν νυκτὶ
  choice: dị ka onye ohi n’abalị
  rationale: A hapụrụ ntụnyere ahụ otú ọ dị, n’asụsụ Igbo doro anya ma bụrụkwa nke e ji eme ihe.
- source_word: οὕτως ἔρχεται
  choice: na-abịa
  rationale: Ụdị ugbu a na-echekwa ịdị ndụ nke ngwaa Grik ahụ; njikọ ya na ‘dị ka onye ohi’ na-ebupụta ụzọ ọ ga-esi bịa n’enweghị itinye okwu ọzọ na-adịghị mkpa.
theological_decisions:
- issue: Ihe akpaokwu ἡμέρα κυρίου pụtara
  choice: ụbọchị Onyenwe anyị
  alternative: ụbọchị nke Onyenwe anyị; ụbọchị ofufe nke Onyenwe anyị
  rationale: N’ebe a, Pọl na-ekwu maka ụbọchị Onyenwe anyị ga-etinye aka n’ihe gbasara ụwa, ọ bụghị banyere ụbọchị ofufe kwa izu. Nsụgharị a na-echekwa akpaokwu ahụ e ji mara amụma Akwụkwọ Nsọ.
- issue: Ike ntụnyere ‘dị ka onye ohi n’abalị’
  choice: A hapụrụ ya dịka ntụnyere nke ọbịbịa a na-atụghị anya ya
  alternative: Ịkọwa ya dịka ọbịbịa nzuzo ma ọ bụ itinye usoro nkọwa banyere oge ikpeazụ
  rationale: Amaokwu ahụ n’onwe ya na-eji ihe atụ onye ohi eme ihe, ma ọ naghị akọwa usoro oge ikpeazụ ma ọ bụ kwuo hoo haa na ọbịbịa ahụ ga-abụ nke nzuzo. Ya mere, nsụgharị ahụ anaghị etinye nkọwa okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. ‘Unu onwe unu’ na-echekwa nkwusiri ike nke Grik; ‘Onyenwe anyị’ bụ okwu Akwụkwọ Nsọ a na-amakarị maka κύριος.
