    text: Ma ọ bụ, “Ka amara nke Onyenwe anyị Jizọs Kraịst soro unu dị.”
    reason: Ụdị ọdịnala “Kraịst” na-anọchi anya Χριστός; ederede bụ isi ji “Mezaịa” mee ka aha nsọpụrụ ahụ pụta ìhè.
  revision_rationale: The revision preserves every element of the Greek blessing and its implied wish while using the more idiomatic Igbo expression “soro unu dị.” It also removes the added relative clause and demonstrative from the rendering of Χριστοῦ, retaining “Kraịst” as a clearly anchored traditional alternative.
