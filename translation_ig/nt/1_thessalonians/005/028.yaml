- from: Ka amara nke Onyenwe anyị Jizọs, bụ́ Mezaịa ahụ, dịnyere unu.[a]
  to: Ka amara nke Onyenwe anyị Jizọs Mezaịa soro unu dị.[a]
  rationale: The revision preserves every element of the Greek blessing and its implied wish while using the more idiomatic Igbo expression “soro unu dị.” It also removes the added relative clause and demonstrative from the rendering of Χριστοῦ, retaining “Kraịst” as a clearly anchored traditional alternative.
  reviewer_model: gpt-5.6-terra
