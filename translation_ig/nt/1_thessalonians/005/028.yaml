  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: ig
  text: Ka amara nke Onyenwe anyị Jizọs Mezaịa soro unu dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka amara nke Onyenwe anyị Jizọs Kraịst soro unu dị.”
    reason: Ụdị ọdịnala “Kraịst” na-anọchi anya Χριστός; ederede bụ isi ji “Mezaịa” mee ka aha nsọpụrụ ahụ pụta ìhè.
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις dị ka ihu ọma na onyinye ọma Chineke, karịchaa n'okwu ngọzi Pọl ji mechie akwụkwọ ozi ya.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: A sụgharịrị κύριος dị ka “Onyenwe,” ma debe “anyị” nke dị na τοῦ κυρίου ἡμῶν; nke a na-echekwa ịdị arọ nke aha nsọpụrụ e nyere Jizọs.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E dere aha ahụ n'ụdị a maara nke ọma n'Igbo.
- source_word: Χριστοῦ
  choice: bụ́ Mezaịa ahụ
  rationale: N'ebe a, Χριστός bụ aha nsọpụrụ na-egosi Mezaịa ahụ, ọ bụghị naanị aha ọzọ e nyere Jizọs. Ntinye “bụ́” na-eme ka okwu ahụ bụrụ Igbo sitere n'ọnụ mmadụ, ebe “ahụ” na-egosi Mezaịa ahụ a tụrụ anya ya.
- source_word: μεθ’ ὑμῶν
  choice: dịnyere unu
  rationale: Ọ bụ ezie na Grik ahụ enweghị ngwaa e dere ede, ọ bụ usoro ngọzi na-achọ ka a ghọta “dị.” “Dịnyere unu” na-ekwupụta nke a n'Igbo dị mfe ma debe echiche nke ịnọnyere ha.
theological_decisions:
- issue: Otú e si asụgharị Χριστοῦ n'okwu ngọzi a
  choice: bụ́ Mezaịa ahụ
  alternative: Kraịst
  rationale: “Mezaịa” na-eme ka ọrụ Χριστός dị ka aha nsọpụrụ pụta ìhè. E nyere “Kraịst” n'ala ala peeji n'ihi na ọ bụ ụdị ọdịnala a maara nke ọma, nke nwekwara ike ịrụ ọrụ dị ka aha nsọpụrụ ma ọ bụ aha yiri aha mmadụ.
- issue: Igosipụta ngọzi dị n'ahịrịokwu Grik na-enweghị ngwaa
  choice: Ka ... dịnyere unu
  alternative: Amara ... dịnyere unu
  rationale: “Ka” na-egosi nke ọma na nke a bụ ọchịchọ ngọzi, ọ bụghị naanị nkwupụta. Ọ naghị ekpebi ihe karịrị ihe usoro okwu Grik ahụ pụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “Ka ... dịnyere unu” dabara n'okwu ngọzi, ebe nkebi kọma gbara “bụ́ Mezaịa ahụ” gburugburu na-eme ka aha nsọpụrụ ahụ doo anya.
