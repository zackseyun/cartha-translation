  yaml_path: translation/nt/1_thessalonians/005/011.yaml
  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: ig
  text: Ya mere, na-agbarịta onwe unu ume, na-ewulikwa ibe unu elu, dịka unu na-emekwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n'ihe e kwuru tupu nke a, ma bụrụkwa okwu Igbo doro anya ma kwekọọ n'ụzọ nkịtị.
- source_word: παρακαλεῖτε
  choice: na-agbarịta ibe unu ume
  rationale: Na-egosi omume nke ịgba ume n'etiti onwe ha; nhazi 'na-agbarịta' na-eme ka iwu ahụ bụrụ nke na-aga n'ihu ma gosipụta mmekọrịta ibe na ibe. Okwu Grik ahụ nwekwara ike ịpụta ịdụsi ọdụ ike, ya mere e debere nke ahụ n'ala peeji.
- source_word: ἀλλήλους
  choice: ibe unu
  rationale: Ọ bụ ụzọ Igbo a na-asụkarị si egosi na onye ọ bụla na-eme ihe ahụ n'ebe onye ọzọ nọ.
- source_word: οἰκοδομεῖτε
  choice: na-ewusikwa ... ike
  rationale: Na-echekwa ihe atụ nke iwu ụlọ dị na okwu Grik, ebe 'ike' na-eme ka ihe ọ pụtara banyere iwusi mmadụ ike doo onye Igbo nke oge a anya.
- source_word: εἷς τὸν ἕνα
  choice: ibe unu
  rationale: A sụgharịrị akpaala okwu Grik a n'ụzọ Igbo dị mma iji kwughachi ma mesie mmekọrịta ha n'otu n'otu ike.
- source_word: καθὼς καὶ ποιεῖτε
  choice: dịka unu na-emekwa ugbu a
  rationale: Na-echekwa ntụnyere ahụ, echiche nke 'kwa,' na omume ha nọ na-eme n'oge ahụ; 'ugbu a' na-eme ka omume na-aga n'ihu pụta ìhè n'Igbo.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji 'na-agbarịta ibe unu ume' na 'na-ewusikwa ibe unu ike' gosipụta iwu na-aga n'ihu na mmekọrịta ibe na ibe; e chekwara ihe atụ nke iwu ụlọ n'okwu οἰκοδομεῖτε.
