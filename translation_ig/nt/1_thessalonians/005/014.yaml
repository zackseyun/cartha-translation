- from: 'Anyị na-arịọkwa unu, ụmụnna[a]: dụọnụ ndị na-adịghị ebi ndụ n''usoro ọdụ[b]; gbaanụ ndị dara mba n''obi ume[c]; nyerenụ ndị na-adịghị ike aka[d]; nweenụ ndidi n''ebe mmadụ niile nọ.'
  to: Anyị na-arịọkwa unu, ụmụnna[a], ka unu dụọ ndị na-adịghị agbaso usoro ọdụ[b]; gbaanụ ndị obi ha dara mbà ume[c]; nyerenụ ndị na-adịghị ike aka[d]; nweenụ ndidi n'ebe mmadụ niile nọ.
  rationale: The revision corrects the malformed wording in the first imperative, makes the description of the fainthearted idiomatic in Standard Igbo, and repairs the grammatical error in footnote c. It preserves the source text’s four imperatives, broad lexical ranges, and nonsectarian pastoral register.
