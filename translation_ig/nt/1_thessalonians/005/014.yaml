id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: ig
  text: Anyị na-arịọkwa unu, ụmụnna[a], ka unu dụọ ndị na-adịghị agbaso usoro ọdụ[b]; gbaanụ ndị obi ha dara mbà ume[c]; nyerenụ ndị na-adịghị ike aka[d]; nweenụ ndidi n'ebe mmadụ niile nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ụmụnna nwoke na ụmụnna nwanyị”; Pọl na-agwa ọgbakọ niile okwu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụ ya, “ndị umengwụ” ma ọ bụ “ndị na-adịghị achị onwe ha achị.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “kasienụ ndị obi ha dara mbà obi.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “kwadọnụ ndị na-adịghị ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: anyị na-arịọ unu
  rationale: N'ebe a, okwu ahụ bụ arịrịọ siri ike nke na-ewebata ndụmọdụ ndịozi. ‘Anyị na-arịọ unu’ bụ Igbo doro anya ma dị ùgwù, nke na-adịghị eme ka ọ bụrụ naanị ịgba ume nkịtị.
- source_word: δέ
  choice: -kwa
  rationale: δέ na-egosi na okwu ahụ na-aga n'ihu ma ọ bụ na-atụgharị gaa n'iwu ndị ọzọ, ọ bụghị nnukwu mmegide. Mgbakwunye ‘-kwa’ na-egosipụta nke a n'ụzọ Igbo si ada nke ọma.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo a na-eji akpọ ndị otu okwukwe ma nwee ike ịgụnye ọgbakọ niile; nkọwa ala peeji na-eme ka ike ịgụnye ụmụ nwoke na ụmụ nwanyị doo anya.
- source_word: νουθετεῖτε
  choice: dụọnụ ... ọdụ
  rationale: Okwu Grik a pụtara ndụmọdụ ma ọ bụ ịdọ aka ná ntị nke chọrọ ime ka mmadụ gbanwee. ‘Dụọnụ ... ọdụ’ na-ejigide akụkụ mgbazi na nlekọta ahụ.
- source_word: ἀτάκτους
  choice: ndị na-adịghị ebi ndụ n'usoro
  rationale: ἄτακτος na-ezo aka n'ịpụ n'usoro ma ọ bụ n'omume kwesịrị ekwesị. Nhọrọ a na-edebe obosara okwu ahụ n'ejighị ya kpọchie naanị n'ịdị umengwụ.
- source_word: παραμυθεῖσθε
  choice: gbaanụ ... ume
  rationale: Ngwaa ahụ bụ iji okwu ọma gbaa onye dara mbà ume ma kasie ya obi. ‘Gbaanụ ... ume’ bụ okwu Igbo eke n'iwu nlekọta a.
- source_word: ὀλιγοψύχους
  choice: ndị dara mba n'obi
  rationale: Okwu ahụ na-akọwa ndị obi dara mbà, ndị ụjọ jidere, ma ọ bụ ndị ike mmụọ ha belatara. Nhọrọ a bụ nke a na-aghọta ngwa ngwa ma na-edebe echiche bụ isi.
- source_word: ἀντέχεσθε
  choice: nyerenụ ... aka
  rationale: Mgbe ngwaa a sochiri okwu dị na genitive, ọ pụrụ ịpụta ịrapara n'akụkụ mmadụ, ịkwado ya, ma ọ bụ inyere ya aka. Nhọrọ a na-egosi enyemaka nlekọta n'Igbo doro anya.
- source_word: τῶν ἀσθενῶν
  choice: ndị na-adịghị ike
  rationale: ἀσθενής nwere ike ịbụ adịghị ike n'anụ ahụ, n'omume, n'okwukwe, ma ọ bụ n'ọnọdụ mmadụ. ‘Ndị na-adịghị ike’ anaghị akọwapụta ụdị adịghị ike ahụ karịa ihe isi mmalite kwuru.
- source_word: μακροθυμεῖτε
  choice: nweenụ ndidi
  rationale: Ngwaa ahụ pụtara ịnagide ndị mmadụ ruo ogologo oge n'eweghị iwe ọsọ ọsọ. ‘Nweenụ ndidi’ bụ Igbo ugbu a, doro anya, ma kwekọọ n'iwu ahụ.
- source_word: πρὸς πάντας
  choice: n'ebe mmadụ niile nọ
  rationale: πρός n'ebe a na-egosi otú e si akpa àgwà n'ebe ndị ọzọ nọ. Nhọrọ a na-edebe oke zuru ụwa ọnụ nke ‘mmadụ niile.’
theological_decisions:
- issue: Ike ἀδελφοί nwere ịgụnye ọgbakọ niile
  choice: Jiri ‘ụmụnna’ n'ahịrị bụ isi ma kọwaa na ọ na-agwa ụmụ nwoke na ụmụ nwanyị niile okwu.
  alternative: ụmụnna nwoke na ụmụnna nwanyị
  rationale: Ụdị Grik ahụ bụ masculine plural, ma n'okwu a Pọl na-agwa ọgbakọ niile okwu. ‘Ụmụnna’ bụ okwu Igbo sitere n'ezinụlọ nke na-arụ ọrụ nke ọma n'okwu ọgbakọ ma ghara iwepụ ụmụ nwanyị; nkọwa ala peeji na-echekwa nkọwa nke ọnọdụ ahụ.
- issue: Ụdị adịghị ike ndị a ga-enyere aka
  choice: Hapụ ya ka ọ bụrụ ‘ndị na-adịghị ike’ n'enweghị ịkọwa ma ọ bụ nke anụ ahụ, nke okwukwe, nke omume, ma ọ bụ nke ọnọdụ mmadụ.
  alternative: ndị ọrịa ma ọ bụ ndị okwukwe ha na-adịghị ike
  rationale: Isi okwu Grik sara mbara, ya mere ịkpọ otu ụdị adịghị ike aha ga-edozi ihe ederede ahụ na-edozighị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro iwu ndị dị n'amaokwu ahụ ka e debere site n'iji ụdị plural imperative ‘-nụ.’ E zere okwu ụka pụrụ iche na nkọwa ga-eme ka ụdị ‘adịghị ike’ ma ọ bụ ‘ndị na-adịghị ebi ndụ n'usoro’ dị warara karịa Grik.
