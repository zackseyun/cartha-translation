revisions:
- from: Onye ahụ na-akpọ unu kwesịrị ntụkwasị obi; ọ ga-emekwa ya.[a]
  to: Onye na-akpọ unu bụ onye a pụrụ ịtụkwasị obi; ọ ga-emekwa ya.[a]
  rationale: The revision clarifies the predicate meaning of πιστός with an idiomatic Standard Igbo copular phrase, preserves the plural “unu,” and retains both the continuity/emphasis of καί in “-kwa” and the deliberately unspecified object of ποιήσει in “ya.”
