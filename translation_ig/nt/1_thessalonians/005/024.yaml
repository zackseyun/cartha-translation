  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: ig
  text: Onye na-akpọ unu bụ onye a pụrụ ịtụkwasị obi; ọ ga-emekwa ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị: “Onye na-akpọ unu na-adị ntụkwasị obi; ọ ga-emekwa ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς
  choice: kwesịrị ntụkwasị obi
  rationale: Nkọwa a na-egosi na Chineke bụ onye a pụrụ ịdabere na ya. Ọ bụ okwu Igbo doro anya ma bụrụkwa nke e ji asọpụrụ Chineke.
- source_word: ὁ καλῶν
  choice: Onye ahụ na-akpọ
  rationale: Nke a na-egosipụta participle nke dị ugbu a dị ka aha onye, ma na-echekwa echiche nke onye na-aga n'ihu ịkpọ ha.
- source_word: ὑμᾶς
  choice: unu
  rationale: “Unu” na-egosipụta kpọmkwem na nnọchiaha onye nke abụọ bụ ọtụtụ, ya bụ ọgbakọ ahụ.
- source_word: ὃς
  choice: ọ
  rationale: N'Igbo, ịmalite nkebi nke abụọ na “ọ” na-ejikọta ya nke ọma na “Onye ahụ” ma dịkwuo eke karịa iji usoro nnọchiaha njikọ nke Grik n'ụzọ siri ike.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” na “emekwa” na-egosi na onye na-akpọ ha bụkwa onye ga-eme ihe ahụ.
- source_word: ποιήσει
  choice: ga-eme ya
  rationale: Nke a na-echekwa ịdị nkenke na obosara nke ποιέω. “Ya” na-anọchi ihe Pọl rịọrọ ka Chineke mee n'amaokwu 23 n'ebughị ụzọ kọwaa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe a na-ekwughị kpọmkwem nke ποιήσει ga-eme
  choice: ga-eme ya
  alternative: ga-emezu ya
  rationale: Grik ekwughị ihe verb ahụ na-emetụta kpọmkwem. “Ga-eme ya” na-atụ aka n'ọrụ ido ha nsọ na ichekwa ha nke a kpọrọ aha n'amaokwu 23, ma ọ naghị akọwapụta ụzọ Chineke ga-esi mee ya ma ọ bụ mee ka ihe ahụ sie ike karịa isi mmalite.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu eke n'Igbo, ebe “unu” chekwara ọnụọgụ ọtụtụ nke ederede Grik; akara nkọwa [a] dị n'isi ederede.
