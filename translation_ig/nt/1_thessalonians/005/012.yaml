    reason: alternative_reading
  revision_rationale: 'The revision coordinates the latter two participial descriptions with the first, so all three plainly modify one group: those who labor among the congregation. It also corrects the explanatory Igbo wording in footnote a. No doctrinal expansion has been introduced.'
