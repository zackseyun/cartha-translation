  to: anyị na-arịọkwa unu, ụmụnna[a], ka unu mata[b] ndị na-adọgbu onwe ha n’ọrụ n’etiti unu, na-edu unu n’ime Onyenwe anyị[c], na ndị na-adọ unu aka ná ntị.
