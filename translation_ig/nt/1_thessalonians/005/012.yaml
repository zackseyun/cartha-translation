id: 1TH.5.12
reference: 1 Thessalonians 5:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: ig
  text: anyị na-arịọkwa unu, ụmụnna[a], ka unu mata[b] ndị na-adọgbu onwe ha n’ọrụ n’etiti unu, na-edu unu n’ime Onyenwe anyị[c], na ndị na-adọ unu aka ná ntị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ bụ “ụmụnna nwoke,” ma e ji ya ebe a na-agwa ọgbakọ dum okwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka unu kwanyere ugwu,” ma ọ bụ “ka unu ghọta ndị ha bụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị nọ n’isi unu n’ime Onyenwe anyị,” ma ọ bụ “ndị na-elekọta unu n’ime Onyenwe anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: Anyị na-arịọ unu
  rationale: “Na-arịọ” na-egosi arịrịọ dị nwayọọ nke ndị na-elekọta ọgbakọ, kama iwu siri ike.
- source_word: δὲ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” na-egosi njikọ na ntụgharị dị nwayọọ n’okwu ahụ, n’ebughị echiche mmegide siri ike bata.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu nkwupụta a na-eji agwa ndị otu okwukwe okwu n’Igbo; n’ebe a, ọ na-emetụta ọgbakọ dum.
- source_word: εἰδέναι
  choice: mata
  rationale: “Mata” na-echekwa isi okwu nke ịmara ma nabata ọnọdụ na ọrụ ndị a, n’ebughị iwu nrubeisi ma ọ bụ nsọpụrụ pụrụ iche bata.
- source_word: κοπιῶντας
  choice: ndị na-adọgbu onwe ha n’ọrụ
  rationale: Nkebi okwu a na-egosi ịdị uchu na ndọgbu dị na κοπιάω karịa naanị ịrụ ọrụ.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Nke a na-egosi na ọrụ ha na-arụ dị n’ime ọgbakọ ahụ.
- source_word: προϊσταμένους ὑμῶν
  choice: ndị na-edu unu
  rationale: “Na-edu unu” na-egosi ọrụ ndu na nlekọta, n’etinyeghị usoro ọchịchị ụka nke otu okpukpe n’ime amaokwu ahụ.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-echekwa njikọ nke ọrụ ndu ha na Onyenwe anyị, dịka okwu Grik ahụ si kwuo.
- source_word: νουθετοῦντας
  choice: ndị na-adọ unu aka ná ntị
  rationale: Okwu a na-egosi ndụmọdụ nwere mgbazi na ịdọ aka ná ntị, nke bụ akụkụ dị mkpa nke νουθετέω.
theological_decisions:
- issue: Ndị okwu ἀδελφοί na-agụnye
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị
  rationale: E debere ụdị okwu ezinụlọ dị nkenke n’isi ederede, ebe nkọwa ala peeji na-eme ka o doo anya na a na-agwa ọgbakọ dum okwu.
- issue: Ihe εἰδέναι pụtara n’ihe gbasara ndị ndu ọgbakọ
  choice: mata
  alternative: kwanyere ugwu; ghọta ndị ha bụ
  rationale: “Mata” na-ahapụ ohere dị n’etiti ịghọta ndị ha bụ, ịnabata ọrụ ha, na iji ha kpọrọ ihe, na-enweghị itinye nrubeisi ma ọ bụ ofufe n’ime okwu ahụ.
- issue: Ike nke προϊσταμένους ὑμῶν ἐν κυρίῳ
  choice: ndị na-edu unu n’ime Onyenwe anyị
  alternative: ndị nọ n’isi unu n’ime Onyenwe anyị; ndị na-elekọta unu n’ime Onyenwe anyị
  rationale: Nhọrọ bụ isi na-egosi ezi ọrụ ndu, ma nkọwa ala peeji na-echekwa ohere okwu Grik ahụ nwere maka ịbụ onye nọ n’isi ma ọ bụ onye nlekọta.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị nsọpụrụ ma dị mfe nghọta. “Na-adọgbu onwe ha n’ọrụ” na-enye ịdị arọ nke ọrụ siri ike; “na-adọ unu aka ná ntị” na-echekwa ma nkuzi ma mgbazi dị n’okwu ahụ. E debere akụkụ atọ ahụ dị ka nkọwa nke otu ìgwè ndị ahụ, ọ bụghị dị ka ìgwè atọ dị iche iche.
