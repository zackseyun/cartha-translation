  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντα δὲ δοκιμάζετε, τὸ καλὸν κατέχετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: ig
  text: Ma nyochaanụ ihe niile; jidesienụ ihe dị mma ike.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-egosipụta obosara nke aha nnọchi neuter plural ahụ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị, n’enweghị ime ka ọ bụrụ naanị amụma.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe e kwuru tupu ya, n’enweghị ime ka ọdịiche ahụ sie ike gabiga ókè.
- source_word: δοκιμάζετε
  choice: na-enyochanụ
  rationale: Ụdị iwu a na-akpọ ka a na-eme nyocha na ntule mgbe niile iji mata ihe bụ eziokwu ma ọ bụ ihe kwesịrị ekwesị.
- source_word: τὸ καλὸν
  choice: ihe dị mma
  rationale: Nke a bụ Igbo eke maka adjective neuter e ji dị ka aha, ma na-ezere okwu nkà ihe ọmụma siri ike.
- source_word: κατέχετε
  choice: jidesienụ ... ike
  rationale: Ọ na-egosi ijigide ihe nke ọma na ịnọgide na ya mgbe e nyochachara ya.
theological_decisions:
- issue: Ókè πάντα n’ọnọdụ okwu gbasara amụma na ịmata ihe
  choice: ihe niile
  alternative: amụma niile; ihe niile e kwuru
  rationale: Ọ bụ ezie na amaokwu ndị gbara ya gburugburu na-ekwu banyere amụma, Grik ahụ ji okwu sara mbara πάντα, ọ naghịkwa etinye aha ga-eme ka ọ bụrụ naanị amụma. Ya mere, nsụgharị ahụ na-echekwa obosara ya, ebe nkọwa ala peeji na-egosi ihe gbara ya gburugburu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ụdị iwu ọtụtụ mmadụ “-nụ” mee ka iwu abụọ ahụ kwekọọ; “jidesienụ ... ike” na-egosipụta nnọgidesi ike.
