id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: ig
  text: Ka Chineke nke udo n’onwe ya mee unu nsọ kpamkpam; ka e debe mmụọ unu na mkpụrụ obi unu na ahụ unu niile n’enweghị ihe a ga-eji taa unu ụta n’ọbịbịa Onyenwe anyị Jizọs, bụ́ Mezaịa ahụ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pọl kpọrọ “mmụọ na mkpụrụ obi na ahụ” aha. Ndị na-akọwa Akwụkwọ Nsọ ekwekọghị ma nke a ọ na-akụzi na mmadụ nwere akụkụ atọ, ka ọ bụ naanị ụzọ e si mesie mmadụ ahụ n’ozuzu ya ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, dịka ntụgharị ọdịnala si kwuo, “Onyenwe anyị Jizọs Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: Αὐτὸς δὲ
  choice: n’onwe ya
  rationale: “N’onwe ya” na-echekwa nkwusiri ike dị na Αὐτός; a naghị etinye okwu oge dịka “ugbu a,” ebe δέ na-arụ ọrụ dịka njikọ ma ọ bụ mgbanwe n’okwu ahụ.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: Chineke nke udo
  rationale: Nke a na-echekwa aha Pọl ji akọwa Chineke dịka Chineke onye udo bụ nke ya ma bụrụkwa onye na-eweta udo.
- source_word: ἁγιάσαι ὑμᾶς ὁλοτελεῖς
  choice: doo unu nsọ kpamkpam
  rationale: Ụdị arịrịọ dị na ngwaa Grik ka e gosiri site na “Ka”; “doo ... nsọ” na-echekwa echiche ịdị nsọ, ebe “kpamkpam” na-egosi izu oke nke ὁλοτελεῖς.
- source_word: ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: mmụọ unu na mkpụrụ obi unu na ahụ unu dum
  rationale: A hapụrụ aha atọ ahụ iche dịka ha dị na Grik, ebe “dum” na-egosi izu oke ma ghara ikpebi ma okwu ndị a na-akụzi nkewa mmadụ ụzọ atọ n’ụzọ teknụzụ.
- source_word: ἀμέμπτως ... τηρηθείη
  choice: ka e debe ... n’enweghị ihe a ga-eji taa unu ụta
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi ọchịchọ ka a chekwaa ha n’ọnọdụ enweghị ụta.
- source_word: ἐν τῇ παρουσίᾳ
  choice: ruo n’ọbịbịa
  rationale: N’ọnọdụ a παρουσία na-ezo aka n’ọbịbịa Jizọs; “ruo n’ọbịbịa” na-egosi na ichebe ha ga-adịgide ruo mgbe ahụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs, bụ́ Mezaịa ahụ
  rationale: Χριστός bụ aha-ọkwa pụtara Mezaịa, ya bụ Onye E Tere Mmanụ; “bụ́ ... ahụ” na-eme ka aha-ọkwa ahụ daa nke ọma n’Igbo.
theological_decisions:
- issue: Mmụọ, mkpụrụ obi, na ahụ dịka okwu atọ gbasara mmadụ
  choice: Idobe okwu atọ ahụ kpọmkwem ma tinye “dum” iji gosipụta izu oke
  alternative: Ịkọwa ha naanị dịka ụzọ okwu si gosi mmadụ niile, ma ọ bụ kwuo hoo haa na mmadụ nwere akụkụ atọ
  rationale: Grik kpọrọ mmụọ, mkpụrụ obi, na ahụ aha n’otu n’otu, ma amaokwu ahụ n’onwe ya anaghị edozi ma nke a bụ usoro nkà mmụta banyere akụkụ atọ nke mmadụ ka ọ bụ nkwusiri ike banyere mmadụ niile.
- issue: Ntụgharị Χριστοῦ
  choice: Mezaịa ahụ
  alternative: Kraịst
  rationale: Χριστός na-arụ ọrụ dịka aha-ọkwa, ya mere a sụgharịrị ihe ọ pụtara; e debere ụdị ọdịnala “Kraịst” n’ala ala peeji.
- issue: Oge ma ọ bụ njedebe nke ichebe ha
  choice: ruo n’ọbịbịa
  alternative: n’ọbịbịa
  rationale: “Ruo” na-eme ka Igbo doo anya na a na-arịọ ka nche ahụ dịgide ruo παρουσία, n’agbanyeghị na preposition Grik ἐν nwekwara ike ịpụta ọnọdụ “n’oge/na” ọbịbịa ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a ma dị ugwu dee ya. Ahịrịokwu ahụ na-anọgide n’ụdị ekpere ma ọ bụ arịrịọ (“Ka ...”), na-enweghị ịgbakwunye “Ugbu a.” E debere njikọ “na” n’etiti mmụọ, mkpụrụ obi, na ahụ iji chekwaa usoro na nkwusiri ike nke Grik.
