revisions:
- from: Ka Chineke nke udo n’onwe ya doo unu nsọ kpamkpam; ka e debe mmụọ unu na mkpụrụ obi unu na ahụ unu dum[a] n’enweghị ihe a ga-eji taa unu ụta, ruo n’ọbịbịa Onyenwe anyị Jizọs, bụ́ Mezaịa ahụ.[b]
  to: Ka Chineke nke udo n’onwe ya mee unu nsọ kpamkpam; ka e debe mmụọ unu na mkpụrụ obi unu na ahụ unu niile n’enweghị ihe a ga-eji taa unu ụta n’ọbịbịa Onyenwe anyị Jizọs, bụ́ Mezaịa ahụ.[a][b]
  rationale: The revision replaces ‘ruo n’ọbịbịa’ with ‘n’ọbịbịa’ to represent ἐν without adding an ‘until’ sense. It also places ‘niile’ after the coordinated triad so that the Greek emphasis on the intact whole is naturally applied to spirit, soul, and body together. Footnote a is clarified without taking a position on whether the triad is technical anthropology or comprehensive rhetoric.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:20:10Z'
review_pass:
  verdict: revise
  source_fidelity: The prayer-wish structure, intensive ‘himself,’ sanctification, the spirit–soul–body triad, blameless preservation, and ‘Jesus the Messiah’ are substantially represented. However, rendering ἐν τῇ παρουσίᾳ as ‘ruo n’ọbịbịa’ (‘until the coming’) adds a durative endpoint not expressed by ἐν, which more directly denotes the circumstance/time of the coming. ‘n’ọbịbịa’ preserves the source wording without resolving its precise temporal nuance.
  naturalness: The register is dignified and readily understandable Standard Igbo. Recasting the whole triad with ‘niile’ makes the scope of ‘whole/complete’ apply naturally to spirit, soul, and body together, rather than appearing to modify only ‘ahụ.’
  terminology: ‘Chineke nke udo,’ ‘mmụọ,’ ‘mkpụrụ obi,’ ‘ahụ,’ and ‘Mezaịa ahụ’ are appropriate. The traditional ‘Kraịst’ alternative is correctly retained in a footnote. The explanatory note is adjusted to say ‘the whole person’ rather than ‘all people.’
  issues:
  - severity: medium
    issue: ‘ruo n’ọbịbịa’ for ἐν τῇ παρουσίᾳ
    rationale: ‘Ruo’ means ‘until’ and specifies continuation up to an endpoint. The Greek preposition ἐν is most directly ‘at/in’ the coming; the translation should not add the endpoint sense.
  - severity: low
    issue: Scope of ‘dum’ in the spirit–soul–body phrase
    rationale: In ‘ahụ unu dum,’ ‘dum’ can be read syntactically as qualifying only ‘ahụ unu’ (your entire body), whereas ὁλόκληρον qualifies the entire listed expression. ‘Niile’ after the coordinated list more naturally covers all three.
  - severity: low
    issue: Footnote wording ‘mmadụ niile’
    rationale: This can mean ‘all people,’ while the intended interpretive alternative is the whole person. ‘mmadụ ahụ n’ozuzu ya’ is clearer and preserves the note’s neutrality.
  revised_text: Ka Chineke nke udo n’onwe ya mee unu nsọ kpamkpam; ka e debe mmụọ unu na mkpụrụ obi unu na ahụ unu niile n’enweghị ihe a ga-eji taa unu ụta n’ọbịbịa Onyenwe anyị Jizọs, bụ́ Mezaịa ahụ.[a][b]
  revised_footnotes:
  - marker: a
    text: Pọl kpọrọ “mmụọ na mkpụrụ obi na ahụ” aha. Ndị na-akọwa Akwụkwọ Nsọ ekwekọghị ma nke a ọ na-akụzi na mmadụ nwere akụkụ atọ, ka ọ bụ naanị ụzọ e si mesie mmadụ ahụ n’ozuzu ya ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, dịka ntụgharị ọdịnala si kwuo, “Onyenwe anyị Jizọs Kraịst.”
    reason: alternative_reading
  revision_rationale: The revision replaces ‘ruo n’ọbịbịa’ with ‘n’ọbịbịa’ to represent ἐν without adding an ‘until’ sense. It also places ‘niile’ after the coordinated triad so that the Greek emphasis on the intact whole is naturally applied to spirit, soul, and body together. Footnote a is clarified without taking a position on whether the triad is technical anthropology or comprehensive rhetoric.
