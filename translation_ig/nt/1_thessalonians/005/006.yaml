    rationale: In Standard Igbo, “uche zuru ike” denotes a mind at rest/relaxed. The Greek verb denotes being sober, with implications of clear-headed vigilance and self-restraint. “Uche zuru oke” communicates sound, sober-minded alertness more faithfully.
