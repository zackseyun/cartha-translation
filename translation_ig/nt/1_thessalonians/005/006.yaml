id: 1TH.5.6
reference: 1 Thessalonians 5:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα οὖν μὴ καθεύδωμεν ⸀ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: ig
  text: Ya mere, ka anyị ghara ihi ụra dị ka ndị ọzọ, kama ka anyị mụrụ anya, nweekwa uche zuru oke[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọrọ na nche” maka “mụrụ anya.” Ngwaa Grik a nwere ike imesi ịmụrụ anya ma ọ bụ ịnọ na nche ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ya mere
  rationale: Ngwakọta mkpụrụokwu abụọ a na-egosi nkwubi okwu sitere n'okwu ndị bu ụzọ; “Ya mere” bụ ụzọ Igbo doro anya ma dịkwa ebumpụta ụwa isi webata ndụmọdụ ahụ.
- source_word: μὴ καθεύδωμεν
  choice: ka anyị ghara ihi ụra
  rationale: Nke a na-edobe ihe atụ banyere ihi ụra, kama ịkọwa ya ozugbo dị ka enweghị nchebara echiche n'ụzọ ime mmụọ.
- source_word: ὡς οἱ λοιποί
  choice: dị ka ndị ọzọ
  rationale: Ọ na-egosi ndị fọdụrụ n'èzí ìgwè ndị a na-agwa okwu, n'ụzọ dị nkenke ma dị mfe nghọta.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosipụta ọdịiche siri ike n'etiti ihi ụra na ịmụrụ anya.
- source_word: γρηγορῶμεν
  choice: ka anyị mụrụ anya
  rationale: Nhọrọ a na-edobe mmegide doro anya dị n'etiti ihi ụra na ịmụrụ anya, ma ọ pụkwara ịpụta ịnọ na nche.
- source_word: νήφωμεν
  choice: nweekwa uche zuru ike
  rationale: N'Igbo nke oge a, okwu a na-egosi uche doro anya, nke na-adịghị aghara aghara, ma nwee njide onwe onye; ọ na-ebute echiche νήφω n'ụzọ kwụ ọtọ karịa ntụgharị nkịtị nke pụrụ iyi naanị izere mmanya.
theological_decisions:
- issue: Ihe atụ nke ihi ụra na ịmụrụ anya
  choice: E debere ihi ụra na ịmụrụ anya n'ahịrịokwu bụ isi dị ka ihe atụ gbasara ọnọdụ ime mmụọ na omume.
  alternative: Ịkọwa ya ozugbo dị ka enweghị nchebara echiche megide ịnọ na nche.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-ekwu banyere ìhè na ọchịchịrị, ehihie na abalị; idebe ihe atụ ahụ na-echekwa usoro echiche Pọl n'enweghị ịkọwa ya karịa ihe odide ahụ.
- issue: Nkọwa νήφω
  choice: nweekwa uche zuru ike
  alternative: anyị jide onwe anyị; anyị ghara ịṅụbiga mmanya ókè
  rationale: Okwu Grik ahụ nwere ike ịpụta ịdị sober n'ụzọ nkịtị nakwa inwe uche doro anya na njide onwe onye. Nhọrọ a na-ahapụ obosara echiche ahụ n'enweghị ime ka ọ bụrụ naanị iwu banyere mmanya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro ndụmọdụ nke onye dere ya ji “anyị” tinye onwe ya na ndị na-agụ ya, ma chekwaa ihe atụ ihi ụra/ịmụrụ anya.
