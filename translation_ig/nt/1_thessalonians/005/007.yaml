  text: οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: ig
  text: N’ihi na ndị na-ehi ụra na-ehi ụra n’abalị, na ndị na-aṅụbiga mmanya ókè na-aṅụbiga mmanya ókè n’abalị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe mere e ji nye agbamume dị n’amaokwu bu ụzọ, ma na-ejikọta echiche abụọ ahụ n’ụzọ doro anya.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: ndị na-ehi ụra na-ehi ụra
  rationale: E ji usoro izugbe sụgharịa participle ahụ, ma kwughachi ‘na-ehi ụra’ iji debe myiri na nkwughachi okwu dị na Grik.
- source_word: νυκτός
  choice: n’abalị
  rationale: Genitive a na-arụ ọrụ dị ka adverb nke oge; ‘n’abalị’ bụ ụzọ Igbo nkịtị na nkenke si egosi oge ahụ.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: ndị na-aṅụbigakwa mmanya ókè na-aṅụbigakwa ya ókè
  rationale: Nhọrọ a na-egosi ịṅụ mmanya ruo n’ókè mmadụ ṅụrụma, ma na-echekwa nkwughachi na myiri nke ahịrịokwu Grik. ‘Ya’ na-eme ka nkwughachi ahụ bụrụ Igbo sitere n’ọnụ mmadụ.
- source_word: καί
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ jikọtara nkebi abụọ yiri ibe ha n’ụzọ e si ekwu Igbo nke ọma, na-enye echiche ‘na/ọzọkwa’ nke καί.
theological_decisions:
- issue: Ma a ga-asụgharị ihi ụra na ịṅụbiga mmanya ókè dịka ihe nkịtị ka ọ bụ dịka ihe atụ ime mmụọ
  choice: 'E debere ihe oyiyi nkịtị: ‘na-ehi ụra’ na ‘na-aṅụbiga mmanya ókè.’'
  alternative: Ịkọwa ha ozugbo dịka amaghị ihe ime mmụọ na ndụ omume rụrụ arụ.
  rationale: N’ebe a Pọl ji omume ndị a na-ahụkarị n’abalị kọwaa agbamume ime mmụọ dị n’okwu gbara ya gburugburu. Idebe okwu nkịtị na-echekwa ihe atụ ahụ ma ghara itinye nkọwa ozizi n’ime nsụgharị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere usoro myiri nke nkebi abụọ ahụ; e jiri ‘-kwa’ mee njikọ ahụ ka ọ daa nke ọma n’Igbo.
