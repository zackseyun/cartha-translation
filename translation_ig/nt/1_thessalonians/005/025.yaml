  text: Ἀδελφοί, ⸀προσεύχεσθε περὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/025.yaml
  text: Brothers[a], pray for us.
translation:
  language: ig
  text: Ụmụnna[a], kpeerenụ anyị ekpere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ụmụnna ndị nwoke na ndị nwanyị,” n’ihi na o yikarịrị ka a na-agwa ọgbakọ ahụ dum okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ụmụnna
  rationale: Ọ bụ aha ịkpọ ọtụtụ mmadụ sitere na ἀδελφός. “Ụmụnna” bụ okwu Igbo dị ùgwù ma bụrụkwa nke e ji akpọ ndị otu okwukwe; ọ nwere ike ịgụnye nwoke na nwanyị n'ọnọdụ a, ebe ndetu ala na-eme ka nke ahụ doo anya.
- source_word: προσεύχεσθε
  choice: na-ekperenụ ... ekpere
  rationale: Ọ bụ iwu nye ọtụtụ mmadụ. Usoro “na-ekperenụ” na-egosipụta arịrịọ ka omume ahụ na-aga n'ihu n'ụzọ dị eke n'Igbo, n'ebughị ibu karịa ihe Grik kwuru.
- source_word: περὶ
  choice: anyị
  rationale: Mgbe περί sochiri genitive ἡμῶν n'arịrịọ ekpere, ọ na-egosi ndị a na-ekpe ekpere maka ha. N'Igbo, usoro eke bụ “ikpere mmadụ ekpere,” ya mere echiche “maka” dị n'ime nhazi ahịrịokwu ahụ.
- source_word: ἡμῶν
  choice: anyị
  rationale: Nnọchiaha onye mbụ n'ụbara na-ezo aka na Pọl na ndị ha na ya na-arụkọ ọrụ, ma nsụgharị ahụ anaghị akọwakwu ihe ederede na-ekwughị.
theological_decisions:
- issue: Aha ịkpọ Ἀδελφοί n'ọgbakọ o yikarịrị ka nwoke na nwanyị nọ na ya
  choice: Ụmụnna
  alternative: Ụmụnna ndị nwoke na ndị nwanyị
  rationale: “Ụmụnna” na-edobe ihe oyiyi ezinụlọ dị n'okwu Grik ma bụrụ okwu Igbo a na-ejikarị agwa ọgbakọ dum okwu. Ndetu ala na-echekwa nkọwa doro anya na ndị a na-akpọ nwere ike ịgụnye ma nwoke ma nwanyị, n'etinyeghị nkọwa ahụ ogologo n'ahịrịokwu dị mkpirikpi.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji usoro iwu nye ọtụtụ mmadụ “na-ekperenụ” na okwu okwukwe a maara nke ọma bụ “Ụmụnna.”
