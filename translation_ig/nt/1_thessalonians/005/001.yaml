id: 1TH.5.1
reference: 1 Thessalonians 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: ig
  text: Banyere oge dị iche iche na oge ndị a kara aka[b], ụmụnna[a], ọ dịghị unu mkpa ka e deere unu ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik kwuru n’ụzọ nkịtị “ụmụnne nwoke,” ma o yikarịrị ka okwu ahụ na-agụnye ụmụ nwoke na ụmụ nwanyị niile nọ n’ọgbakọ.
    reason: lexical_alternative
  - marker: b
    text: “Oge dị iche iche na oge ndị a kara aka” bụ okwu abụọ ejikọtara ọnụ iji kọwaa oge na oge pụrụ iche e kenyere, karịchaa n’ihe gbasara ihe ndị ga-eme n’ọdịnihu.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Banyere
  rationale: “Banyere” na-ewebata isiokwu ọhụrụ n’ụzọ dị mfe ma dị mma n’Igbo. A naghị atụgharị δέ ka ọ bụrụ “ma” ebe a, n’ihi na ọrụ ya bụkarị igosi mgbanwe isiokwu, ọ bụghị igosi esemokwu siri ike.
- source_word: τῶν χρόνων καὶ τῶν καιρῶν
  choice: oge dị iche iche na oge ndị a kara aka
  rationale: χρόνοι na-ezo aka n’oge ma ọ bụ ogologo oge dị iche iche, ebe καιροί na-ekwukarị maka oge pụrụ iche ma ọ bụ oge a kara aka. Nsụgharị a na-edobe ọdịiche ahụ n’Igbo na-enweghị iji okwu ndị siri ike nghọta.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu nkwanye ùgwù na nke a na-ejikarị akpọ ndị otu okwukwe n’Igbo. Ọ dabara n’ebe a maka ἀδελφοί, nke dị n’ụdị oke ma nke na-abụkarị aha a na-akpọ ọgbakọ niile.
- source_word: οὐ χρείαν ἔχετε
  choice: ọ dịghị unu mkpa
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kwuo na ihe adịghị mkpa nye ndị a na-agwa okwu, ma ọ na-edobe echiche nke akpaalaokwu Grik ahụ.
- source_word: ὑμῖν γράφεσθαι
  choice: ka e deere unu
  rationale: Ụdị a na-edobe olu nnara nke γράφεσθαι, n’ihi ya, ọ naghị etinye onye dere ihe n’ahịrịokwu ebe Grik ahụ ekwughị onye ahụ kpọmkwem.
theological_decisions:
- issue: Aha e ji akpọ ọgbakọ na ụdị oke nke ἀδελφοί
  choice: ụmụnna
  alternative: ụmụnne nwoke; ụmụnna nwoke na nwanyị
  rationale: Ọ bụ ezie na ἀδελφοί dị n’ụdị oke na Grik, n’ọnọdụ a o yikarịrị ka ọ na-agwa ọgbakọ ndị kwere ekwe niile okwu. “Ụmụnna” bụ ụzọ Igbo kwesịrị ekwesị isi chekwaa okwu ezinụlọ ahụ n’etinyeghị nkọwa okpukpe pụrụ iche; ihe odide ala peeji na-akọwa ọdịdị okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ usoro ahịrịokwu “ọ dịghị unu mkpa” ka ọ bụrụ nke sitere n’ọnụ onye Igbo nke ọma, ebe “ka e deere unu” na-echekwa olu nnara na enweghị onye edemede a kpọrọ aha na Grik.
