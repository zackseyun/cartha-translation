revisions:
- from: onye nwụrụ n’ihi anyị, ka anyị na ya dịrị ndụ ọnụ, ma anyị nọ na nche ma ọ bụ na anyị na-ehi ụra.[a]
  to: onye nwụrụ n’ihi anyị, ka, ma anyị mụrụ anya ma ọ bụ na anyị na-ehi ụra, anyị na ya dịrị ndụ ọnụ.[a]
  rationale: The revision translates γρηγορῶμεν with the less interpretively loaded 'anyị mụrụ anya,' preserving the Greek ambiguity that the English audit trail likewise preserves. It also improves the Igbo syntax of the ἵνα purpose clause and repairs the footnote's grammatical defect, without deciding between the alive/dead and ethical-vigilance readings.
