source:
  edition: SBLGNT
  text: τοῦ ἀποθανόντος ⸀περὶ ἡμῶν ἵνα εἴτε γρηγορῶμεν εἴτε καθεύδωμεν ἅμα σὺν αὐτῷ ζήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/010.yaml
  text: who died for us[a], so that whether we are awake or asleep, we may live together with him.
translation:
  language: ig
  text: onye nwụrụ n’ihi anyị, ka, ma anyị mụrụ anya ma ọ bụ na anyị na-ehi ụra, anyị na ya dịrị ndụ ọnụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma anyị nọ na nche ma ọ bụ na anyị na-ehi ụra.” Okwu a nwere ike ịkpọghachi ndụmọdụ banyere ịnọ na nche n’amaokwu ndị gbara ya gburugburu, ọ bụ ezie na n’ebe a o yikarịrị ka ọ na-ezo aka na ndị kwere ekwe ka dị ndụ ma ọ bụ ndị nwụrụ anwụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποθανόντος
  choice: onye nwụrụ
  rationale: Aorist participle ahụ na-akọwa Onyenwe anyị Jizọs Kraịst e kwuru okwu ya n’amaokwu gara aga; nkebi ahịrịokwu nwere ‘onye’ bụ Igbo eke karịa ntụgharị siri ike dịka ‘onye nwụworo.’
- source_word: περὶ ἡμῶν
  choice: n’ihi anyị
  rationale: N’ọnọdụ nzọpụta a, περί ya na genitive pụtara ime ihe maka ọdịmma mmadụ ma ọ bụ n’aha ya. ‘N’ihi anyị’ bụ okwu Igbo dị mfe nke na-egosipụta na ọnwụ ya bụ maka anyị n’etinyeghị nkọwa ozizi karịrị ihe ederede kwuru.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-egosipụta ebumnuche ma ọ bụ ihe ọnwụ Kraịst na-eweta, n’ụzọ Igbo dị nkenke ma bụrụkwa eke.
- source_word: γρηγορῶμεν
  choice: anyị nọ na nche
  rationale: γρηγορέω nwere ike ịpụta ịmụrụ anya ma ọ bụ ịnọ na nche. ‘Nọ na nche’ na-ejigide njikọ ya na ndụmọdụ banyere ịmụrụ anya n’amaokwu ndị gbara ya gburugburu, ma nwee ike ịrụ ọrụ dị ka ihe megidere ihi ụra.
- source_word: καθεύδωμεν
  choice: anyị na-ehi ụra
  rationale: A hapụrụ ihe oyiyi nke ihi ụra dịka Grik si kwuo ya. N’ebe a o yikarịrị ka ọ na-anọchi anya ọnwụ nke ndị kwere ekwe, ma okwu ahụ ka nwekwara ike ime ka onye na-agụ ya cheta ihi ụra n’ụzọ ime mmụọ n’amaokwu ndị dị nso.
- source_word: ἅμα
  choice: ọnụ
  rationale: ἅμα na σὺν na-egosipụta ịdị ndụ n’otu na Kraịst. ‘Ọnụ’ na-enye echiche nke ịdịkọ n’ụzọ Igbo eke.
- source_word: σὺν αὐτῷ
  choice: na ya
  rationale: σύν na-egosi iso ya ma ọ bụ njikọ ya na ya. E tinyere ya n’okwu ‘anyị na ya dịrị ndụ ọnụ’ iji zere nkwughachi na-adịghị eke.
- source_word: ζήσωμεν
  choice: anyị ... dịrị ndụ
  rationale: Subjunctive ahụ dị n’okpuru ἵνα na-egosi ebumnuche ma ọ bụ ihe e bu n’obi. ‘Ka anyị ... dịrị ndụ’ bụ usoro Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Ihe ‘ịnọ na nche ma ọ bụ ihi ụra’ pụtara n’ebe a
  choice: Ọ kachasị na-ezo aka n’ịdị ndụ ma ọ bụ ịnwụ anwụ, ma a hapụrụ ihe oyiyi ahụ n’ederede.
  alternative: Ọ nwere ike ịga n’ihu n’echiche nke ịmụrụ anya n’omume megide ịdị umengwụ n’ime mmụọ, dịka 5:6–7 si kwuo.
  rationale: N’agbanyeghị na ngwaa abụọ ahụ nwere ụda ndụmọdụ banyere ịmụrụ anya n’amaokwu ndị dị nso, okwu Pọl dabara nke ọma na 4:13–15, ebe ‘ihi ụra’ na-anọchi anya ọnwụ ndị kwere ekwe. Nkwa na ha ga-adị ndụ na Kraịst ma ha dị ndụ ma ha anwụọla na-eme ka nghọta a sie ike; ma ntụgharị ahụ ekpebighị ihe ahụ kpamkpam.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ‘anyị na ya dịrị ndụ ọnụ’ bụ okwu Igbo eke ma na-echekwa echiche ἅμα σὺν αὐτῷ. Akara nkọwa ala [a] dị n’ederede isi.
