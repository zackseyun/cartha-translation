id: 1TH.5.9
reference: 1 Thessalonians 5:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: ig
  text: N’ihi na Chineke edoghị anyị maka iwe, kama o doro anyị maka inweta nzọpụta[a] site n’aka Onyenwe anyị Jizọs, bụ́ Mezaịa ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ịnwe nzọpụta,” “ịkpata nzọpụta,” ma ọ bụ, ikekwe, “ka e chekwaa anyị ruo nzọpụta.” Okwu Grik περιποίησις sara mbara karịa naanị “inweta.”
    reason: lexical_alternative
  - marker: b
    text: 'Nsụgharị ọdịnala: “site n’aka Onyenwe anyị Jizọs Kraịst.” N’ebe a, a sụgharịrị utu aha Grik Χριστός dị ka “Mezaịa” iji mee ka ihe ọ pụtara pụta ìhè.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara agbamume dị n’amaokwu bu ụzọ; “N’ihi na” na-edobe njikọ ahụ n’Igbo doro anya.
- source_word: οὐκ ἔθετο ἡμᾶς ... ἀλλὰ εἰς
  choice: Chineke edoghị anyị ... kama o doro anyị
  rationale: “Ido mmadụ maka” na-egosi ịhọpụta ma ọ bụ itinye mmadụ n’ụzọ ga-eduga n’ihe a kpọrọ aha, ma ọ naghị etinye ozizi kara okwu Grik ahụ ike banyere akara aka.
- source_word: εἰς ὀργὴν
  choice: maka iwe
  rationale: “Iwe” bụ okwu Igbo kpọmkwem maka ὀργή, ma n’ebe a ọ na-ezo aka n’iwe Chineke metụtara ikpe ikpeazụ.
- source_word: εἰς περιποίησιν σωτηρίας
  choice: maka inweta nzọpụta
  rationale: N’ọnọdụ a, “inweta nzọpụta” na-egosi n’ụzọ eke na nzọpụta bụ ihe Chineke zubere ka ha nweta; ihe ndị ọzọ okwu περιποίησις nwere ike ịpụta ka edebere n’ala peeji.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: site n’aka Onyenwe anyị Jizọs, bụ́ Mezaịa ahụ
  rationale: “Site n’aka” na-egosi ụzọ ma ọ bụ onye Chineke ji mee ka nzọpụta bịa. A sụgharịrị Χριστός dị ka utu aha “Mezaịa,” ọ bụghị dị ka aha ezinụlọ.
theological_decisions:
- issue: Ma ἔθετο ò kwesịrị ịpụta akara aka n’ụzọ siri ike
  choice: edoghị anyị ... kama o doro anyị
  alternative: akaghị anyị aka
  rationale: Nsụgharị a na-ekwupụta nzube Chineke banyere ihe ga-eme ndị kwere ekwe n’ikpeazụ, ma ọ naghị amanye usoro ozizi pụrụ iche banyere akara aka n’ime okwu ahụ.
- issue: Ma a ga-asụgharị Χριστοῦ dị ka utu aha ka ọ bụ jiri ụdị ọdịnala “Kraịst”
  choice: Mezaịa ahụ
  alternative: Kraịst
  rationale: Χριστός bụ utu aha nke pụtara onye e tere mmanụ; “Mezaịa” na-eme ka ọrụ ya dị ka utu aha pụta ìhè, ebe e debere ụdị ọdịnala n’ala peeji.
- issue: Oke ihe περιποίησις pụtara
  choice: inweta nzọpụta
  alternative: ịnwe nzọpụta; ichekwa mmadụ ruo nzọpụta
  rationale: Ọnọdụ ahịrịokwu ahụ na-akwado inweta nzọpụta dị ka ihe a na-achọ iru, ma okwu Grik ahụ sara mbara; ya mere a naghị ezobe ihe ndị ọzọ ọ pụrụ ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E jighị okwu ụka pụrụ iche dochie nghọta sara mbara nke ederede ahụ; e debere mgbagwoju anya dị na περιποίησις n’ala peeji.
