  terminology: “Iwe,” “nzọpụta,” “Onyenwe anyị,” and “Mezaịa ahụ” are appropriate and consistent. Rendering Χριστός as “Mezaịa ahụ” presents the title’s meaning in idiomatic Igbo; the traditional “Kraịst” is properly retained in the note. Footnote a appropriately signals the lexical breadth of περιποίησις without presenting any alternative as certain.
