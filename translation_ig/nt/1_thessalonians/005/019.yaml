id: 1TH.5.19
reference: 1 Thessalonians 5:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ πνεῦμα μὴ σβέννυτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/019.yaml
  text: Do not quench the Spirit,[a]
translation:
  language: ig
  text: Unu emenyụla Mmụọ Nsọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ.” Okwu Grik ahụ nwekwara ike ịpụta mmụọ n’ozuzu ya; ma n’ebe a, o yikarịrị ka ọ na-ezo aka na Mmụọ Nsọ, ọkachasị n’ihi na e kwuru banyere amụma n’amaokwu na-esonụ.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: Mmụọ Nsọ
  rationale: N’ọnọdụ okwu a, ọkachasị n’ihi ihe e kwuru ozugbo banyere amụma n’amaokwu na-esonụ, okwu Grik a yikarịrị ka ọ na-ezo aka na Mmụọ Nsọ. Ịkpọ ya ‘Mmụọ Nsọ’ na-eme ka onye a na-ekwu maka ya doo anya n’Igbo, ebe ihe odide Grik oge ochie anaghị eji mkpụrụedemede ukwu kewaa echiche ndị a.
- source_word: μὴ
  choice: -la
  rationale: A jikọtara mmachibido iwu μή na ngwaa site n’usoro mmachibido iwu Igbo ‘emenyụla,’ nke pụtara ‘unu emenyụla.’
- source_word: σβέννυτε
  choice: emenyụla
  rationale: σβέννυμι pụtara imenyụ ọkụ. ‘Emenyụla’ na-echekwa ihe atụ nke imenyụ ihe yiri ire ọkụ, kama ịkọwa ya nanị dịka igbochi ma ọ bụ ịkwụsị ọrụ.
theological_decisions:
- issue: Ihe πνεῦμα na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ
  rationale: Njikọ ya na ịghara ile amụma anya nlelị n’amaokwu na-esonụ na-akwado na Pọl na-ekwu maka ọrụ Mmụọ Nsọ n’ọgbakọ. Ma ebe πνεῦμα nwekwara ike ịpụta ‘mmụọ’ n’ozuzu ya, e debere nke ahụ n’akụkụ nkọwa ka a ghara ikpochapụ nghọta ọzọ ahụ.
translation_notes:
  register: E ji Standard Igbo dị mfe ma dị nsọpụrụ. ‘Emenyụla’ na-echekwa ihe atụ doro anya nke imenyụ ọkụ; ‘unu’ na-egosi na iwu ahụ bụ maka ọtụtụ mmadụ, dịka ụdị ngwaa Grik si gosi.
