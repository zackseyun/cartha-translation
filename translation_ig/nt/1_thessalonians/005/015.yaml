id: 1TH.5.15
reference: 1 Thessalonians 5:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: ig
  text: Lezienụ anya ka onye ọ bụla ghara ịkwụ onye ọ bụla ihe ọjọọ ụgwọ maka ihe ọjọọ[a]; kama, na-achọsienụ ike mgbe niile ime ihe ọma n’ebe ibe unu nọ nakwa n’ebe mmadụ niile nọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lezienụ anya ka onye ọ bụla ghara ịkwụ onye ọ bụla ihe ọjọọ ụgwọ maka ihe ọjọọ.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka okwu ndị a, “ibe unu ... mmadụ niile,” na-agbasawanye site n’etiti ndị kwere ekwe ibe ha ruo mmadụ niile n’ụzọ sara mbara.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Lezienụ anya
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke pụtara ka ha kpachara anya ma hụ na ihe a sịrị emee; ọ bụghị naanị ile anya nkịtị.
- source_word: μή τις
  choice: ka onye ọ bụla ghara
  rationale: N’usoro ya na ὁρᾶτε, okwu a na-egosi ihe a ga-akpachara anya ka ọ ghara ime.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: iji ihe ọjọọ ... kwụọ ... ụgwọ ihe ọjọọ
  rationale: Nke a na-echekwa nkwughachi nke κακόν ma na-egosipụta ịbọ ọbọ site n’iji ihe ọjọọ zaghachi ihe ọjọọ.
- source_word: τινι
  choice: onye ọ bụla
  rationale: Ọ na-egosi onye omume nkwụghachi ahụ ga-erute ma na-echekwa obosara nke okwu Grik ahụ.
- source_word: ἀποδῷ
  choice: kwụọ ... ụgwọ
  rationale: Akpaalaokwu Igbo a na-egosi inyeghachi mmadụ ihe dịka nzaghachi nye ihe o mere, nke dabara n’echiche nke ịbọ ọbọ ebe a.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụkwa nke nkịtị maka adverb oge a.
- source_word: τὸ ἀγαθὸν
  choice: ihe dị mma
  rationale: Ọ na-eme ka adjective e jiri dị ka noun pụta n’Igbo n’ụzọ ebumpụta ụwa, na-enweghị ime ka ọ bụrụ echiche kpọrọ nkụ.
- source_word: διώκετε
  choice: na-achụso
  rationale: 'Ọ na-echekwa ike nke iwu ahụ: ọ bụghị naanị ịchọ ihe ọma, kama iji ịnụ ọkụ n’obi na-agbaso ya.'
- source_word: εἰς ἀλλήλους
  choice: n’ebe ibe unu nọ
  rationale: Ọ na-egosi ebe omume ọma ahụ chere ihu n’etiti ndị nọ n’otu ahụ.
- source_word: καὶ εἰς πάντας
  choice: nakwa n’ebe mmadụ niile nọ
  rationale: Ọ na-echekwa mkpokọta na obosara nke πάντας, ma na-apụta nke ọma n’Igbo ugbu a.
theological_decisions:
- issue: Ókè ọrụ ezi omume Ndị Kraịst
  choice: E debere ọdịiche dị n’etiti “ibe unu” na “mmadụ niile,” nke nwere ike isi n’ime obodo ndị kwere ekwe gbasaa ruo n’ebe mmadụ niile nọ.
  alternative: “Mmadụ niile” nwere ike ịpụta naanị ndị kwere ekwe niile.
  rationale: Usoro εἰς ἀλλήλους καὶ εἰς πάντας na-egosi mmegharị sitere n’òtù dị n’ime gaa n’òtù sara mbara karị, ma ntụgharị ahụ anaghị etinye nkọwa ụka karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Lezienụ anya” na “na-achụso” na-echekwa ike nke iwu abụọ dị na Grik; “kwụọ ... ụgwọ” na-egosipụta nkwụghachi n’enweghị iwebata okwu ụka pụrụ iche.
