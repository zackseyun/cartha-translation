    text: O yikarịrị ka okwu ndị a, “ibe unu ... mmadụ niile,” na-agbasawanye site n’etiti ndị kwere ekwe ibe ha ruo mmadụ niile n’ụzọ sara mbara.
    reason: cross_reference
  revision_rationale: The revision makes both Greek imperatives explicit in natural Standard Igbo, replaces an awkward retaliation idiom with a conventional Igbo construction, and improves the explanatory footnote. It preserves the source’s ethical scope and does not make the footnote’s likely community-to-all distinction into a doctrinal certainty.
