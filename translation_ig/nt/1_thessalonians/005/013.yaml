- from: na iwere ha kpọrọ ihe nke ukwuu n’ịhụnanya n’ihi ọrụ ha.[a] Na-adịrịtanụ n’udo.
  to: Nakwanụ were ha kpọrọ ihe nke ukwuu n’ịhụnanya n’ihi ọrụ ha.[a] Birinụ n’udo n’etiti onwe unu.
  rationale: The revision clarifies the plural exhortation implied by the Greek construction and renders the final reflexive phrase explicitly as peace within the community. It retains the draft’s accurate terminology and preserves the unusually strong adverb through both the main text and footnote.
