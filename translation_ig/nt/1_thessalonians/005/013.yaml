  text: καὶ ἡγεῖσθαι αὐτοὺς ⸀ὑπερεκπερισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/013.yaml
  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: ig
  text: Nakwanụ were ha kpọrọ ihe nke ukwuu n’ịhụnanya n’ihi ọrụ ha.[a] Birinụ n’udo n’etiti onwe unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “were ha kpọrọ ihe gabiga ókè n’ịhụnanya.” Okwu Grik e ji mee ihe ebe a na-egosi nkwusi ike pụrụ nnọọ iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: iwere ha kpọrọ ihe
  rationale: N’ebe a, ngwaa ahụ pụtara ile ndị a anya dị ka ndị bara uru ma kwanyere ha ùgwù; akpaalaokwu Igbo a na-egosipụta echiche ahụ n’asụsụ dị mfe ma doo anya.
- source_word: ὑπερεκπερισσοῦ
  choice: nke ukwuu
  rationale: Okwu Grik a bụ okwu nkwusi ike pụrụ iche. ‘Nke ukwuu’ na-ebute ike ya n’Igbo nkịtị, ebe nkọwa ọzọ dị n’ihe odide ala peeji na-echekwa oke nkwusi ike ahụ.
- source_word: ἐν ἀγάπῃ
  choice: n’ịhụnanya
  rationale: Nke a na-echekwa isi okwu ἀγάπη ma na-egosi na ịhụnanya bụ ọnọdụ ma ọ bụ ụzọ ha ga-esi were ndị ndu ahụ kpọrọ ihe.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: n’ihi ọrụ ha
  rationale: διά ya na ebubo na-egosi ihe kpatara ya; nsụgharị a na-echekwa aha kpọmkwem ‘ọrụ’ kama ịgbasa ya ka ọ bụrụ nkọwa.
- source_word: εἰρηνεύετε
  choice: Na-adịrịtanụ n’udo
  rationale: Iwu nke oge ugbu a na-akpọ ha ka udo bụrụ omume na-adịgide adịgide. Ụdị Igbo a dị nkenke ma na-egosi ọnọdụ udo ahụ.
- source_word: ἐν ἑαυτοῖς
  choice: -rịtanụ
  rationale: Mgbakwunye nnọkọrịta ‘-rịta-’ na-egosi na udo ahụ ga-adị n’etiti ha onwe ha, n’ụzọ dị ebumpụta ụwa n’Igbo.
- source_word: καὶ
  choice: na
  rationale: Njikọ a na-aga n’ihu n’usoro ndụmọdụ nke malitere n’amaokwu bu ụzọ.
- source_word: αὐτούς
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n’ebe ndị na-adọgbu onwe ha n’ọrụ n’etiti ọgbakọ ahụ, bụ́ ndị a kpọtụrụ aha n’amaokwu bu ụzọ.
