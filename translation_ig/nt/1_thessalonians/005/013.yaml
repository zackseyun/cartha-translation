review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the evaluative sense of ἡγεῖσθαι, the reason clause, and the communal peace command. However, “na iwere” is morphologically unsuitable here: it can read as second-person singular subjunctive and does not clearly continue the preceding plural appeal. The second sentence leaves ἐν ἑαυτοῖς implicit rather than explicitly expressing peace within the community.'
  naturalness: “Na-adịrịtanụ n’udo” is understandable, but “Birinụ n’udo n’etiti onwe unu” is more idiomatic Standard Igbo for an ongoing command to live peacefully with one another. “Nakwanụ were ...” supplies a natural plural exhortation in a verse presented independently.
  terminology: “Were ha kpọrọ ihe” appropriately renders the evaluative force of ἡγεῖσθαι. “N’ịhụnanya,” “ọrụ,” and “udo” preserve the key terms well. The intensive adverb is retained as “nke ukwuu,” with the footnote giving a closer, stronger alternative.
  issues:
  - severity: medium
    issue: “na iwere” lacks clear plural exhortative form.
    rationale: The Greek infinitive continues an appeal addressed to the plural community. In Standard Igbo, “i” may be read as singular; “nakwanụ were” clearly addresses the plural and works naturally as an exhortation.
  - severity: low
    issue: The communal scope of ἐν ἑαυτοῖς is only encoded indirectly in “-rịta-.”
    rationale: While reciprocal morphology suggests mutuality, “n’etiti onwe unu” explicitly and naturally represents “among yourselves.”
  revised_text: Nakwanụ were ha kpọrọ ihe nke ukwuu n’ịhụnanya n’ihi ọrụ ha.[a] Birinụ n’udo n’etiti onwe unu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “were ha kpọrọ ihe gabiga ókè n’ịhụnanya.” Okwu Grik e ji mee ihe ebe a na-egosi nkwusi ike pụrụ nnọọ iche.
    reason: lexical_alternative
  revision_rationale: The revision clarifies the plural exhortation implied by the Greek construction and renders the final reflexive phrase explicitly as peace within the community. It retains the draft’s accurate terminology and preserves the unusually strong adverb through both the main text and footnote.
