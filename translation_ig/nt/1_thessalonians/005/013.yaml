translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere mbido ‘na’ iji jikọta ndụmọdụ a na ahịrịokwu bu ya ụzọ, dị ka καὶ na infinitive Grik si eme.
