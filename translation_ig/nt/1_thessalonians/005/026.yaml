  yaml_path: translation/nt/1_thessalonians/005/026.yaml
  text: Greet all the brothers with a holy kiss[a][b].
translation:
  language: ig
  text: Jiri nsusu ọnụ dị nsọ kelee ụmụnna niile.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị niile,” n’ihi na okwu a sụgharịrị “ụmụnna” pụrụ izo aka n’ọgbakọ ndị kwere ekwe dum.
    reason: lexical_alternative
  - marker: b
    text: “Nsusu ọnụ dị nsọ” bụ ihe ndị mmadụ n’oge ahụ maara dị ka ihe e ji egosi mmekọrịta na ịhụnanya Ndị Kraịst nwere n’ebe ibe ha nọ.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: kelee
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha mee ya; “kelee” bụ ụzọ Igbo dị nkenke ma kwekọọ n’omume mmadụ iji ekele nabata ma ọ bụ kele ibe ya.
- source_word: ἀδελφοὺς
  choice: ụmụnna
  rationale: “Ụmụnna” na-asụgharị echiche nke ndị bụ otu ezinụlọ okwukwe n'ụzọ Igbo dị ndụ; n’ebe a, ọ pụrụ ịgụnye ndị nwoke na ndị nwanyị nọ n’ọgbakọ.
- source_word: πάντας
  choice: niile
  rationale: “Niile” na-egosipụta na a gaghị ahapụ onye ọ bụla n’ime ìgwè ahụ.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: jiri nsusu ọnụ dị nsọ
  rationale: “Jiri” na-egosipụta ụzọ e si kele ha, “nsusu ọnụ” bụ φίλημα, ebe “dị nsọ” na-echekwa nkọwa ἁγίῳ n’enweghị ịgbasa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-ezo aka naanị n’ụmụ nwoke ka ọ bụ n’ọgbakọ ndị kwere ekwe niile
  choice: ụmụnna
  alternative: ụmụnna ndị nwoke; ma ọ bụ ụmụnna nwoke na ụmụnna nwanyị
  rationale: Ụdị okwu Grik bụ ọtụtụ nke nwoke, ma n’okwu e degaara ọgbakọ ọ na-ejikarị ezo aka n’ezinụlọ ndị kwere ekwe dum. “Ụmụnna” bụ okwu Igbo nwere ike ichekwa ma ihe atụ ezinụlọ ma obosara ndị a na-agwa okwu; ihe nwere ike ịpụta nke ọma ka akọwara n’akụkụ ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ debere iwu ahụ n’ụdị doro anya, chekwaa ihe atụ nke ezinụlọ okwukwe, ma tinye akara akụkụ ala peeji [a] na [b] n’isiokwu ahụ.
