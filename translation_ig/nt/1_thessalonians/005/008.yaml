revisions:
- from: Ma ebe anyị so n'ụbọchị, ka uche anyị zuru anyị oke, ebe anyị yikwasịrị ihe mgbochi obi nke okwukwe[a] na ịhụnanya, yikwasịkwa olileanya nzọpụta dị ka okpu agha.[b]
  to: Ma ebe anyị bụ ndị nke ụbọchị, ka anyị nwee uche zuru oke, ka anyị yikwasị ihe nchebe obi nke okwukwe[a] na ịhụnanya, yikwasịkwa olileanya nzọpụta dịka okpu agha.[b]
  rationale: The revision corrects the unclear sobriety expression, removes an unwarranted completed-action sense from the participle, and uses more idiomatic Standard Igbo for belonging to the day. It retains the source’s contrast, exhortation, armor imagery, and the ambiguity of πίστις and the genitive relation in «olileanya nzọpụta».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:56Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the day/night and armor imagery, but «ka uche anyị zuru anyị oke» does not clearly express νήφωμεν (‘let us be sober / self-controlled’), and the perfect-like «ebe anyị yikwasịrị» can suggest armor already put on rather than the participial means accompanying the exhortation.
  naturalness: «anyị so n'ụbọchị» is understandable but less idiomatic and less direct than «anyị bụ ndị nke ụbọchị». The revised wording uses natural Standard Igbo while preserving the metaphor.
  terminology: «okwukwe», «ịhụnanya», «olileanya nzọpụta», «ihe nchebe obi», and «okpu agha» appropriately convey the virtue triad and military metaphor. The lexical alternative footnote should distinguish ‘trust’ from ‘faithfulness’ more accurately.
  issues:
  - severity: medium
    issue: Rendering of νήφωμεν
    rationale: «ka uche anyị zuru anyị oke» is awkward and is not a dependable rendering of the call to sobriety/self-control. «ka anyị nwee uche zuru oke» conveys the figurative sense without excluding the surrounding sobriety imagery.
  - severity: medium
    issue: Aspect and syntax of ἐνδυσάμενοι
    rationale: «ebe anyị yikwasịrị» presents the action as completed and its use of «ebe» is syntactically awkward here. «ka anyị yikwasị» provides a natural Igbo exhortation and preserves the armor action.
  - severity: low
    issue: Idiomatic rendering of ἡμέρας ὄντες
    rationale: «anyị bụ ndị nke ụbọchị» more directly and idiomatically expresses belonging to the metaphorical sphere of day than «anyị so n'ụbọchị».
  - severity: low
    issue: Footnote wording for πίστις
    rationale: The existing note’s opening alternative conflates ‘faithfulness’ with the separate possible sense ‘trust.’ Listing both explicitly is clearer and conforms to the English audit trail.
  revised_text: Ma ebe anyị bụ ndị nke ụbọchị, ka anyị nwee uche zuru oke, ka anyị yikwasị ihe nchebe obi nke okwukwe[a] na ịhụnanya, yikwasịkwa olileanya nzọpụta dịka okpu agha.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi na ịhụnanya” ma ọ bụ “ikwesị ntụkwasị obi na ịhụnanya.” Okwu Grik bụ pistis nwekwara ike ịpụta “okwukwe,” “ntụkwasị obi,” ma ọ bụ “ikwesị ntụkwasị obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “yikwasịkwa dịka okpu agha olileanya nzọpụta.”
    reason: previous_rendering
  revision_rationale: The revision corrects the unclear sobriety expression, removes an unwarranted completed-action sense from the participle, and uses more idiomatic Standard Igbo for belonging to the day. It retains the source’s contrast, exhortation, armor imagery, and the ambiguity of πίστις and the genitive relation in «olileanya nzọpụta».
