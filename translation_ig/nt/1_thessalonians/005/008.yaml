id: 1TH.5.8
reference: 1 Thessalonians 5:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: ig
  text: Ma ebe anyị bụ ndị nke ụbọchị, ka anyị nwee uche zuru oke, ka anyị yikwasị ihe nchebe obi nke okwukwe[a] na ịhụnanya, yikwasịkwa olileanya nzọpụta dịka okpu agha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi na ịhụnanya” ma ọ bụ “ikwesị ntụkwasị obi na ịhụnanya.” Okwu Grik bụ pistis nwekwara ike ịpụta “okwukwe,” “ntụkwasị obi,” ma ọ bụ “ikwesị ntụkwasị obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “yikwasịkwa dịka okpu agha olileanya nzọpụta.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Ma ebe anyị
  rationale: “Ma” na-egosi ọdịiche dị n’etiti “anyị” na ndị a kpọrọ aha n’amaokwu ndị bu ụzọ; “ebe” na-eme ka njikọ ya na nkebi participle na-esochi doo anya n’Igbo.
- source_word: ἡμέρας ὄντες
  choice: anyị so n'ụbọchị
  rationale: Nke a na-egosi ịbụ ndị nke ụbọchị ma ọ bụ iso n’akụkụ ụbọchị, ọ bụghị naanị na ihe na-eme n’oge ehihie; ọ na-echekwakwa ihe atụ Pọl ji.
- source_word: νήφωμεν
  choice: ka uche anyị zuru anyị oke
  rationale: νήφω nwere ike ịpụta izere ịṅụbiga mmanya ókè ma ọ bụ ịnọ na nche na ijide onwe. Nkebi Igbo a na-enye isi echiche nke ịdị njikere na inwe njide onwe n’enweghị ịkọwa ya karịa ihe odide ahụ.
- source_word: ἐνδυσάμενοι
  choice: ebe anyị yikwasịrị
  rationale: Nke a na-echekwa echiche participle nke iyi ngwa agha dịka ọnọdụ ma ọ bụ ụzọ e si eme ihe agbamume ahụ.
- source_word: θώρακα
  choice: ihe mgbochi obi
  rationale: Ọ bụ aha ngwa agha na-echebe obi na akụkụ ahụ dị n’ihu; okwu a doro ndị na-agụ Igbo nke oge a anya.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ nsụgharị nkịtị na nke kacha adabara πίστις n’usoro àgwà atọ—okwukwe, ịhụnanya, na olileanya—ebe e debere “ikwesị ntụkwasị obi” dịka ihe ọzọ o nwere ike ịpụta na nkọwa ala peeji.
- source_word: ἀγάπης
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nsụgharị kwesịrị ekwesị nke ἀγάπη n’ebe a.
- source_word: περικεφαλαίαν
  choice: okpu agha
  rationale: Ọ na-echekwa ihe atụ ndị agha ma na-akọwa ngwa nchebe isi n'ụzọ dị mfe nghọta.
- source_word: ἐλπίδα σωτηρίας
  choice: olileanya nzọpụta
  rationale: Nke a na-echekwa njikọ genitive nke Grik ma ghara ikpebi ma ọ bụ olileanya e nwere maka nzọpụta ka ọ bụ olileanya nke nzọpụta ji mara.
theological_decisions:
- issue: Ihe πίστις pụtara n’ihe atụ ngwa agha
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi; ntụkwasị obi
  rationale: Njikọ ya na ịhụnanya na olileanya na-akwado “okwukwe” dịka àgwà a na-ekwu maka ya, ma πίστις ka nwere ike ịpụta ikwesị ntụkwasị obi; ya mere e debere nke ahụ na nkọwa ala peeji.
- issue: Ike okwu ἡμέρας ὄντες
  choice: anyị so n'ụbọchị
  alternative: anyị bụ ndị nke ụbọchị
  rationale: Nhọrọ a na-egosi ịbụ ndị so n’akụkụ ụbọchị n’ihe atụ ahụ, ma ọ naghị etinye nkọwa ozizi ọzọ n’ihe Pọl kwuru.
- issue: Njikọ olileanya nzọpụta na okpu agha
  choice: yikwasịkwa olileanya nzọpụta dị ka okpu agha
  alternative: yikwasịkwa dị ka okpu agha olileanya nzọpụta
  rationale: Nhọrọ bụ isi na-asụ Igbo nke ọma ma na-echekwa olileanya nzọpụta dịka ihe e ji atụnyere okpu agha; e debere usoro okwu nke dị nso na Grik na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ihe mgbochi obi” na “okpu agha” na-eme ka ihe atụ ngwa agha doo anya; “ka uche anyị zuru anyị oke” na-ezere okwu siri ike ma na-eburu echiche nke ịmụrụ anya na ijide onwe nke νήφω.
