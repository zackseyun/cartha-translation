  text: προφητείας μὴ ἐξουθενεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/020.yaml
  text: Do not despise prophecies[a].
translation:
  language: ig
  text: Unu eledala amụma anya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu amụma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: amụma
  rationale: Okwu Grik a dị n'ụdị ọtụtụ ma na-ezo aka n'amụma dị iche iche ma ọ bụ okwu amụma. N'Igbo, “amụma” nwere ike ịpụta otu ma ọ bụ ọtụtụ dabere n'ọnọdụ; “unu” na ihe odide gbara ya gburugburu na-ahapụ ya n'ụzọ sara mbara n'ebughị ya gaa n'echiche ụka pụrụ iche.
- source_word: μὴ
  choice: Unu e…la
  rationale: Ụdị iwu mgbochi Igbo “unu e…la” na-enye iwu a gwara ọtụtụ mmadụ ka ha ghara ime ihe ahụ, n'etinyeghị ike ọzọ dịka “mgbe ọ bụla.”
- source_word: ἐξουθενεῖτε
  choice: eledala … anya
  rationale: “Ileda ihe anya” bụ ụzọ Igbo sitere n'okike isi kwuo ile ihe anya dị ka ihe na-abaghị uru ma ọ bụ iji nlelị mesoo ya. Ọ sara mbara karịa nanị ịjụ ya.
theological_decisions:
- issue: Ihe “amụma” pụtara n'ọgbakọ ndị Kraịst mbụ
  choice: E jidere okwu sara mbara “amụma” n'emeghị ka ọ bụrụ otu usoro pụrụ iche ma ọ bụ ozizi otu ụka.
  alternative: okwu amụma; ozi ndị a na-ekwu na ha sitere n'aka Chineke
  rationale: προφητείας na-ezo aka n'amụma ma ọ bụ nkwupụta amụma, ma amaokwu ahụ akọwaghị kpọmkwem usoro ya. Nsụgharị sara mbara na-echekwa nghọtahie na esemokwu nkà mmụta okpukpe dị n'okwu ahụ n'etinyeghị echiche cessationist ma ọ bụ continuationist.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma nwee ugwu. A họọrọ “eleda … anya” kama okwu siri ike ma ọ bụ nke ochie; akara [a] dị n'ederede isi.
