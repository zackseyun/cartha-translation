  source_fidelity: “Unu eledala amụma anya[a]” accurately renders the present plural prohibition μὴ ἐξουθενεῖτε and retains προφητείας as a broad, plural-capable reference to prophecies. Igbo “amụma” can naturally function without an overt plural marker in this context.
