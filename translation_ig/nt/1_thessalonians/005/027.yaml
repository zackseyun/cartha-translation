  verdict: revise
  source_fidelity: The draft correctly represents the passive infinitive ('ka e gụọrọ'), the comprehensive recipient phrase ('ụmụnna niile'), and preserves the possible force of τὸν κύριον through a footnote. However, 'Ana m etinye unu n’iyi' is not the most idiomatic Standard Igbo expression for ἐνορκίζω. The established, natural oath-imposition idiom is 'eji ... aṅụ mmadụ iyi.'
  naturalness: Replacing the calqued-sounding 'etinye unu n’iyi' with 'eji Onyenwe anyị aṅụ unu iyi' yields clear, dignified modern Standard Igbo. 'Ka e gụọrọ ụmụnna niile akwụkwọ ozi a' naturally conveys that the letter is to be read to all the brothers.
  terminology: '''Onyenwe anyị,'' ''akwụkwọ ozi,'' and ''ụmụnna'' are appropriate. The main text retains the familial term without prematurely resolving its likely inclusive reference; footnote b explains the Greek masculine plural.'
