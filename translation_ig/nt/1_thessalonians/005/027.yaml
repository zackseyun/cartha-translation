source:
  edition: SBLGNT
  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: ig
  text: Ana m eji Onyenwe anyị aṅụ unu iyi[a] ka e gụọrọ ụmụnna niile akwụkwọ ozi a[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’Onyenwe anyị.” Okwu Grik ahụ nwere ike ịpụta na Pọl ji Onyenwe anyị dịka onye a kpọkuru na onye nwere ikike n’iwu siri ike a.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ụmụnna” dị n’ụdị ọtụtụ nwoke n’ụtọasụsụ, ma o yikarịrị ka ọ na-ezo aka n’ọgbakọ dum, gụnyere ụmụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: Ana m etinye unu n’iyi
  rationale: Nke a na-echekwa ike okwu Grik ahụ, nke pụtara ijikọ mmadụ n’iyi ma ọ bụ inye ya iwu siri ike site n’iyi; ọ bụkwa Igbo doro anya karịa okwu ụka pụrụ iche.
- source_word: τὸν κύριον
  choice: n’ihu Onyenwe anyị
  rationale: N’usoro a, okwu ahụ nwere ike igosi Onyenwe anyị dị ka onye akaebe na onye nwere ikike n’iyi ahụ. ‘N’ihu Onyenwe anyị’ bụ Igbo eke ma na-echekwa echiche ahụ, ebe nkọwa ala peeji na-egosi nhọrọ ‘site n’Onyenwe anyị.’
- source_word: ἀναγνωσθῆναι
  choice: ka e gụọrọ
  rationale: Ụdị ngwaa a bụ nke nnara, ‘ka a gụọ ya.’ ‘Ka e gụọrọ’ na-egosi na a ga-agụrụ ọgbakọ ahụ akwụkwọ ozi ahụ, dị ka ọnọdụ ahụ chọrọ, n’enweghị ịgbakwunye okwu ‘n’olu dara ụda.’
- source_word: τὴν ἐπιστολήν
  choice: akwụkwọ ozi a
  rationale: Ọ na-ezo aka n’akwụkwọ ozi nke a ha na-anata ugbu a; ‘akwụkwọ ozi a’ bụ Standard Igbo dị mfe ma doo anya.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: ụmụnna niile
  rationale: ‘Ụmụnna’ bụ okwu Igbo ebumpụta ụwa maka ndị otu ezinụlọ ma ọ bụ ndị otu okwukwe, ọ pụkwara ịgụnye nwoke na nwanyị dịka ἀδελφοῖς si emekarị n’akwụkwọ Pọl. Nkọwa ala peeji na-echekwa eziokwu na okwu Grik ahụ bụ ọtụtụ nwoke n’ụdị ụtọasụsụ.
theological_decisions:
- issue: Ma ἀδελφοῖς n’ọgbakọ nwere nwoke na nwanyị ga-abụ ‘ụmụnne nwoke’ ka ọ bụ okwu na-agụnye ọgbakọ dum
  choice: ụmụnna
  alternative: ụmụnne nwoke
  rationale: ἀδελφοῖς bụ ọtụtụ nwoke n’ụdị ụtọasụsụ, ma n’akwụkwọ Pọl ọ na-ezokarị aka n’ọgbakọ Ndị Kraịst dum, gụnyere ụmụ nwanyị. ‘Ụmụnna’ na Standard Igbo na-echekwa oyiyi ezinụlọ ahụ ma na-arụkwa ọrụ n’ụzọ gụnyere mmadụ niile; nkọwa [b] na-eme ka ọdịdị Grik ahụ pụta ìhè.
- issue: Njikọ τὸν κύριον na ἐνορκίζω
  choice: n’ihu Onyenwe anyị
  alternative: site n’Onyenwe anyị
  rationale: Accusative ahụ nwere ike ịpụta onye a kpọkuru n’iyi ma ọ bụ ikike e ji enye iwu ahụ. Isi ederede ji okwu Igbo eke gosipụta Onyenwe anyị dịka onye akaebe/ikike, ma nkọwa [a] na-echekwa ntụgharị ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Ana m etinye unu n’iyi’ chekwaa ịdị arọ nke ἐνορκίζω; e zere okwu ochie ma ọ bụ nke otu ụka pụrụ iche. A debere akara nkọwa [a] na [b] n’isi ederede.
