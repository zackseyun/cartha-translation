  yaml_path: translation/nt/1_thessalonians/005/022.yaml
  text: Abstain from every kind of evil[a].
translation:
  language: ig
  text: Zerenụ ụdị ihe ọjọọ ọ bụla[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ụdịdị ihe ọjọọ ọ bụla”; n’ụzọ ọdịnala, “ọdịdị ọ bụla nke ihe ọjọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: Zerenụ ... aka
  rationale: Ọ bụ iwu dị n'ụdị ugbu a nye ọtụtụ mmadụ, nke na-akpọ ha ka ha nọgide na-ezere ihe ahụ. Akpaalaokwu Igbo a na-enye iwu ahụ n'ụzọ doro anya ma dịkwa eke.
- source_word: ἀπὸ
  choice: '... aka'
  rationale: N'ime akpaalaokwu ‘zere ... aka,’ ọ na-egosi ikewapụ onwe onye n'ihe ma ọ bụ izere ya.
- source_word: παντὸς
  choice: niile
  rationale: Ya na εἴδους jikọtara, ọ pụtara ụdị ọ bụla n'enweghị nke a hapụrụ; ‘niile’ na-ekwu nke a nke ọma n'Igbo.
- source_word: εἴδους
  choice: ụdị
  rationale: N'ebe a, okwu ahụ nwere nghọta nke ‘ụdị’ ma ọ bụ ‘otu n'ime ụdị dị iche iche,’ ọ bụghị naanị ihe yiri ihe n'ile anya.
- source_word: πονηροῦ
  choice: ihe ọjọọ
  rationale: Nke a bụ ntụgharị doro anya ma dị eke nke ihe bụ ajọ omume ma ọ bụ ihe ọjọọ n'ozuzu ya.
theological_decisions:
- issue: Ihe εἴδους pụtara n'okwu ἀπὸ παντὸς εἴδους πονηροῦ
  choice: ụdị ihe ọjọọ niile
  alternative: ụdịdị ihe ọjọọ niile; ihe ọ bụla yiri ihe ọjọọ
  rationale: N'ọnọdụ a, εἶδος yikarịrị ka ọ pụtara ‘ụdị’ karịa naanị ọdịdị a na-ahụ anya. Ntụgharị a anaghị etinye echiche na a ga-ezere ihe ọ bụla naanị n'ihi na ọ dị ka ihe ọjọọ, ma ihe odide ahụ akọwaghị ya otú ahụ. Ihe ndị ọzọ a pụrụ ịsụ dị na nkọwa ala peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe ma nwee nsọpụrụ. E ji ‘Zerenụ ... aka’ chekwaa ike iwu ahụ na echiche nke ịnọgide na-ezere ihe ọjọọ.
