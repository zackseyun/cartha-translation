id: 1TH.3.2
reference: 1 Thessalonians 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: ig
  text: anyị zigakwara Timoti, nwanne anyị na onye ọrụ ibe Chineke[a] n’ozi ọma nke Mesaịa[b], ka o mee ka unu guzosie ike ma gbaa unu ume n’ihe gbasara okwukwe unu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “onye ya na Chineke na-arụkọ ọrụ.” Ụfọdụ akwụkwọ odide na nsụgharị nwere okwu dị iche n’ebe a, dịka “onye na-ejere Chineke ozi.”
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, okwu a bụ “Kraịst”; a sụgharịrị ya “Mesaịa” ebe a n’ihi na ọ na-arụ ọrụ dị ka utu aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: anyị wee ziga
  rationale: Oge aorist na-akọ ihe mere eme n’ụzọ dị mfe; “ziga” bụ okwu Igbo nkịtị ma doo anya.
- source_word: Τιμόθεον
  choice: Timoti
  rationale: E dere aha ahụ n’ụdị a na-ejikarị ede Timothy n’Igbo.
- source_word: ἀδελφὸν ἡμῶν
  choice: nwanne anyị
  rationale: Nke a na-edobe ihe atụ ezinụlọ dị n’asụsụ Grik, bụ́ nke na-egosi mmekọrịta ndị kwere ekwe.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: onye ọrụ ibe Chineke
  rationale: Nhọrọ a na-anọ nso n’usoro okwu Grik ma na-ahapụ ike na esemokwu nkà mmụta okpukpe dị n’okwu ahụ n’enweghị ime ka ọ bụrụ naanị “onye na-ejere Chineke ozi.”
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: n’ozi ọma nke Mesaịa
  rationale: “N’” na-egosi ebe ọrụ Timoti hiwere isi, ebe “nke” na-edobe enweghị mgbagwoju anya zuru ezu banyere njikọ dị n’etiti ozi ọma ahụ na Mesaịa.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka utu aha; “Mesaịa” na-egosipụta ihe okwu ahụ pụtara karịa iji ya dị ka aha nkịtị.
- source_word: εἰς τὸ στηρίξαι
  choice: ka o mee ka unu guzosie ike
  rationale: Nke a na-egosipụta nzube nke iziga Timoti ma na-enye echiche nke ime ka okwukwe ha kwụsie ike.
- source_word: παρακαλέσαι
  choice: gbaa unu ume
  rationale: N’ọnọdụ a, okwu ahụ na-egosi nkwado na agbamume; ọ naghị amachi echiche ahụ naanị na nkasi obi ma ọ bụ ịdọ aka ná ntị.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: n’ihe gbasara okwukwe unu
  rationale: Nke a na-edobe echiche “banyere” ma ọ bụ “n’ihe metụtara” okwukwe ha, n’enweghị ịhọrọ naanị echiche “n’ihi.”
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo kwesịrị ekwesị maka πίστις n’ebe a, ebe ihe a na-ekwu bụ ntụkwasị obi ha na nkwụsi ike ha dị ka ndị kwere ekwe.
theological_decisions:
- issue: Otú e si sụgharịa συνεργὸν τοῦ θεοῦ
  choice: onye ọrụ ibe Chineke
  alternative: onye ya na Chineke na-arụkọ ọrụ; onye na-ejere Chineke ozi
  rationale: Ihe odide SBLGNT nwere συνεργὸν τοῦ θεοῦ. E kwesịghị ime ka okwu ahụ dị nro naanị n’ihi ihe isi ike nkà mmụta okpukpe ya. Isi nsụgharị na-edobe okwu siri ike ahụ, ebe ndetu ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ya na ọdịiche dị n’ihe odide ụfọdụ.
- issue: Otú e si sụgharịa Χριστοῦ na εὐαγγελίῳ τοῦ Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ utu aha n’ebe a, ya mere “Mesaịa” na-egosi isi ihe ọ pụtara. E tinyere “Kraịst,” bụ́ ụdị ọdịnala a maara nke ọma, na ndetu ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere usoro ahịrịokwu ahụ ka ọ na-aga were were n’Igbo, ma e chekwakwara njikọ echiche na ebumnuche dị n’asụsụ Grik. E tinyere akara ndetu [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
