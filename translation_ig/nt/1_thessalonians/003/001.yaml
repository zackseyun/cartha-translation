id: 1TH.3.1
reference: 1 Thessalonians 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὸ μηκέτι στέγοντες εὐδοκήσαμεν καταλειφθῆναι ἐν Ἀθήναις μόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/001.yaml
  text: Therefore[a], when we could bear it no longer, we were pleased to be left alone in Athens[b],
translation:
  language: ig
  text: Ya mere[a], mgbe anyị na-enweghịzi ike ịnagide ya, anyị kpebiri na ọ dị mma ka a hapụ anyị naanị anyị n'Atens[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “N'ihi nke a.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “anyị chere na ọ kacha mma ka a hapụ anyị n'Atens naanị anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n'ihe e kwuru tupu ya; ọ bụ njikọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: μηκέτι στέγοντες
  choice: mgbe anyị na-enweghịzi ike ịnagide ya
  rationale: Na-egosipụta na ha eruola ókè nke ntachi obi n'ihi nchegbu ha; ‘ịnagide ya’ dabara n'ọnọdụ a ma na-echekwa echiche nke στέγω.
- source_word: εὐδοκήσαμεν
  choice: anyị kpebiri na ọ dị mma
  rationale: Na-echekwa ma echiche mkpebi ma nkwenye na ihe ahụ bụ ihe kwesịrị ekwesị, n'ebughị ụzọ mee ya naanị okwu obi ụtọ.
- source_word: καταλειφθῆναι
  choice: ka a hapụ anyị
  rationale: Na-echekwa ụdị nnara-eme nke infinitive Grik ahụ, kama ịtụgharị ya ka ọ bụrụ naanị ‘ịnọgide.’
- source_word: ἐν Ἀθήναις
  choice: n'Atens
  rationale: Ụdị aha obodo Athens a na-aghọta nke ọma n'Igbo, tinyere akara ebe kwesịrị ekwesị.
- source_word: μόνοι
  choice: naanị anyị
  rationale: Na-egosi na ìgwè onye na-ekwu okwu ga-anọ n'enweghị ndị ọzọ, ma na-echekwa ọnụọgụ ọtụtụ nke Grik.
theological_decisions:
- issue: Onye ma ọ bụ ndị nnọchiaha ‘anyị’ na-ezo aka na ha, n'agbanyeghị esemokwu dị n'etiti ọtụtụ na otu n'akụkọ gbara ya gburugburu
  choice: E debere ‘anyị’ na ‘naanị anyị’ dịka Grik si kwuo.
  alternative: Ịtụgharị ya dịka ‘m kpebiri ịnọ naanị m,’ ma ọ bụ iwere ‘anyị’ dịka ọtụtụ e ji ede akwụkwọ nke na-ezo naanị na Pọl.
  rationale: εὐδοκήσαμεν na μόνοι bụ ụdị ọtụtụ. Nsụgharị ekwesịghị ikpebi arụmụka banyere ma Pọl ọ na-ekwu naanị maka onwe ya ka ọ̀ na-ekwu maka ndị otu ozi ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe ọtụtụ nke onye mbụ, ụdị nnara-eme, na ntakịrị mgbagwoju pụtara na εὐδοκήσαμεν; akara nkọwa ala [a] na [b] dị n'ederede isi.
