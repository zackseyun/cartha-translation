    text: A pụkwara ịsụ ya, “ndị nke ya niile e doro nsọ.” Okwu Grik a sụgharịrị “ndị nsọ” nwere ike izo aka n’ụmụ mmadụ dị nsọ, ndị mmụọ ozi, ma ọ bụ ha abụọ n’ebe a.
    reason: alternative_reading
  revision_rationale: 'A naanị otu mgbanwe ka e mere: e wepụrụ “ya” n’usoro “ga-abịa ya na” ka e wee nweta okwu Standard Igbo doro anya, “ga-abịa na.” Nke a na-echekwa μετὰ (“ya na/na”) na mgbagwoju anya nke “ndị nsọ ya niile.”'
