id: 1TH.3.13
reference: 1 Thessalonians 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: ig
  text: ka o wee mee ka obi unu guzosie ike, bụrụ ndị a na-apụghị ịta ụta n’ịdị nsọ n’ihu Chineke na Nna anyị, mgbe Onyenwe anyị Jizọs ga-abịa na ndị nsọ ya niile[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị nke ya niile e doro nsọ.” Okwu Grik a sụgharịrị “ndị nsọ” nwere ike izo aka n’ụmụ mmadụ dị nsọ, ndị mmụọ ozi, ma ọ bụ ha abụọ n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: ka o wee mee ka ... guzosie ike
  rationale: Nkebi a na-egosi nzube ma ọ bụ ihe ga-esi n'ihe e kwuru n'amaokwu gara aga pụta; usoro a na-eme ka nke ahụ doo anya n'Igbo.
- source_word: στηρίξαι
  choice: mee ka ... guzosie ike
  rationale: Okwu a pụtara ime ka ihe sie ike ma kwụsie ike; nke a bụ okwu Igbo doro anya ma kwekọọ na ‘obi’ dịka ihe a na-eme ka o guzosie ike.
- source_word: καρδίας
  choice: obi
  rationale: ‘Obi’ bụ okwu Igbo ebumpụta ụwa maka ime mmadụ, ọ bụghị naanị mmetụta uche.
- source_word: ἀμέμπτους
  choice: ndị a na-apụghị ịta ụta
  rationale: Nke a na-echekwa echiche nke ịbụ onye a na-enweghị ezi ihe e ji bo ya ebubo.
- source_word: ἐν ἁγιωσύνῃ
  choice: n'ịdị nsọ
  rationale: Ọ na-egosi ịdị nsọ dịka ọnọdụ ma ọ bụ àgwà, n'okwu Igbo dị mfe ma dị ùgwù.
- source_word: ἔμπροσθεν
  choice: n'ihu
  rationale: Ọ na-egosi ịnọ n'ihu Chineke ma ọ bụ n'anya ya.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: Chineke na Nna anyị
  rationale: Nke a na-echekwa njikọ aha abụọ ahụ n'ụzọ dabara adaba n'Igbo.
- source_word: παρουσίᾳ
  choice: mgbe ... ga-abịa
  rationale: N'ọnọdụ a gbasara ọgwụgwụ oge, παρουσία na-ezo aka n'ọbịbịa Onyenwe anyị; usoro Igbo a bụ nke doro anya.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị eme ihe maka κύριος dịka aha nsọpụrụ Kraịst.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E dere aha ahụ dịka usoro Standard Igbo si dị.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: ya na ndị nsọ ya niile
  rationale: ‘Ndị nsọ’ na-echekwa ịdị obosara nke ἅγιοι nke nwere ike izo aka n'ụmụ mmadụ dị nsọ, ndị mmụọ ozi, ma ọ bụ ha abụọ; nkọwa ala peeji na-egosi mgbagwoju a.
theological_decisions:
- issue: Ndị μετὰ πάντων τῶν ἁγίων αὐτοῦ na-ezo aka na ha
  choice: E jiri ‘ndị nsọ ya niile’ na-akọwaghị ma hà bụ ndị kwere ekwe, ndị mmụọ ozi, ma ọ bụ ha abụọ.
  alternative: ‘ndị nke ya niile e doro nsọ’ ma ọ bụ ‘ndị mmụọ ozi ya niile’
  rationale: ἁγίων nwere ike izo aka n'ụmụ mmadụ dị nsọ, ndị mmụọ ozi, ma ọ bụ ha abụọ n'ọnọdụ a. A hapụrụ esemokwu ahụ ka ederede Grik si hapụ ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri usoro okwu ebumpụta ụwa mee ihe, ma e chekwara njikọ echiche nke amaokwu Grik na mgbagwoju gbasara ndị a kpọrọ ‘ndị nsọ.’
