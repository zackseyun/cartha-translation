revisions:
- from: Ma ugbu a, Timoti esitela n’ebe unu nọ bịakwute anyị ma wetara anyị ozi ọma banyere okwukwe unu[a] na ịhụnanya unu. Ọ gwakwara anyị na unu na-echeta anyị n’ụzọ ọma mgbe niile, na ọ na-agụsi unu agụụ ike ịhụ anyị, dị nnọọ ka ọ na-agụsikwa anyị agụụ ike ịhụ unu,
  to: Ma ugbu a, Timoti esitela n’ebe unu nọ bịakwute anyị ma wetara anyị ozi ọma banyere okwukwe unu[a] na ịhụnanya unu; ọ gwakwara anyị na unu na-echeta anyị nke ọma mgbe niile, na agụụ ịhụ anyị na-agụ unu, dị nnọọ ka agụụ ịhụ unu na-agụkwa anyị,
  rationale: The revision corrects the grammatical subject of the Thessalonians’ longing and uses a natural Igbo construction for reciprocal affectionate desire. It otherwise retains the draft’s source-faithful lexical choices, its ambiguity note for πίστις, and the trailing comma because the Greek sentence continues into the following verse.
