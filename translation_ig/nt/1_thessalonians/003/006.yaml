id: 1TH.3.6
reference: 1 Thessalonians 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: ig
  text: Ma ugbu a, Timoti esitela n’ebe unu nọ bịakwute anyị ma wetara anyị ozi ọma banyere okwukwe unu[a] na ịhụnanya unu; ọ gwakwara anyị na unu na-echeta anyị nke ọma mgbe niile, na agụụ ịhụ anyị na-agụ unu, dị nnọọ ka agụụ ịhụ unu na-agụkwa anyị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwesị ntụkwasị obi unu.” Okwu Grik a bụ pistis nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: Ma ugbu a
  rationale: “Ugbu a” na-egosi oge akụkọ ahụ gbanwere, ebe “Ma” na-egosipụta ntụgharị dị nro site ná nchegbu Pọl gara aga ruo n’ozi ọma o nwetara.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: Timoti esitela n’ebe unu nọ bịakwute anyị
  rationale: A tụgharịrị genitive absolute ahụ ka ọ bụrụ nkebiokwu zuru ezu nke na-ada nke ọma n’Igbo; “esitela… bịakwute” na-egosikwa na ọ bịarutere n’oge na-adịbeghị anya.
- source_word: εὐαγγελισαμένου ἡμῖν
  choice: wetara anyị ozi ọma
  rationale: N’ebe a, ngwaa ahụ na-ekwu maka akụkọ ọma Timoti wetara, ọ bụghị kpọmkwem ikwusa oziọma nye ndị na-ekweghị ekwe. Nhọrọ a na-edebekwa njikọ okwu ahụ na “ozi ọma.”
- source_word: τὴν πίστιν
  choice: okwukwe
  rationale: “Okwukwe” bụ ntụgharị bụ isi nke πίστις ma dabara n’akụkọ banyere ịnọgide ha na-atụkwasị Chineke obi; e debere echiche ọzọ nke ikwesị ntụkwasị obi n’okpuru peeji.
- source_word: τὴν ἀγάπην
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa ntụgharị kwesịrị ekwesị nke ἀγάπη n’ebe a.
- source_word: μνείαν ἡμῶν ἀγαθὴν πάντοτε
  choice: unu na-echeta anyị n’ụzọ ọma mgbe niile
  rationale: Nhọrọ a na-edebe echiche nke ncheta dị mma ma na-ada nke ọma karịa nsụgharị okwu n’otu n’otu n’Igbo.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: ọ na-agụsi unu agụụ ike ịhụ anyị
  rationale: Akpaalaokwu Igbo a na-egosipụta ọchịchọ siri ike na nke sitere n’ịhụnanya nke ngwaa ἐπιποθέω pụtara.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: dị nnọọ ka ọ na-agụsikwa anyị agụụ ike ịhụ unu
  rationale: E megharịrị ngwaa a na-aghọta n’asụsụ Grik ka ntụnyere abụọ ahụ doo anya ma bụrụ Igbo eke.
theological_decisions:
- issue: πίστις nwere ike ịpụta okwukwe ma ọ bụ ikwesị ntụkwasị obi n’ebe a
  choice: okwukwe unu
  alternative: ikwesị ntụkwasị obi unu
  rationale: Ihe gbara amaokwu ahụ gburugburu na-elekwasị anya n’ịnọgide ndị Tesalonaịka n’okwukwe, ya mere “okwukwe” bụ nhọrọ bụ isi. Ma πίστις nwekwara ike ịgụnye echiche nke ịnọgidesi ike na ikwesị ntụkwasị obi, n’ihi ya e debere ya n’okpuru peeji kama iwepụ nghọta ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ogologo nhaziokwu Grik ahụ ụzọ abụọ ka ọ dị mfe ịgụ n’Igbo, ma rikoma dị n’ikpeazụ na-egosi na echiche ahụ na-aga n’ihu n’amaokwu na-esote.
