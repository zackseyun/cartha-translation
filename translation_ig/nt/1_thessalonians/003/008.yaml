  text: For now we live[b][a], if you stand firm in the Lord.
translation:
  language: ig
  text: N’ihi na ugbu a, anyị dị ndụ[b][a], ma ọ bụrụ na unu na-eguzosi ike n’ime Onyenweanyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị njikọ dị na mmalite a dịka “n’ihi na” ma ọ bụ “n’ihi”; n’asụsụ Igbo, a pụkwara ịhapụ ya ka ihe gbara ya gburugburu gosi njikọ ya.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “anyị dị ndụ” bụ okwu atụ na-egosi ume na agbamume ọhụrụ Pọl na ndị ya nwetara, ọ bụghị naanị na ha ka dị ndụ n’anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ebe a, njikọ a na-akọwa ihe mere Pọl ji nweta nkasi obi; “N’ihi na” na-egosipụta ike nkọwa na ihe kpatara ya, ma nkọwa ọzọ ka edebere n’ala peeji.
- source_word: νῦν
  choice: ugbu a
  rationale: Ọ na-edobe ntụaka oge nke okwu Grik ma na-emesi ume ọhụrụ Pọl nwere n’oge a ike.
- source_word: ζῶμεν
  choice: anyị dị ndụ
  rationale: Nke a na-edobe okwu Grik ahụ kpọmkwem, ma hapụkwa ike okwu atụ ya—ịnweta ume na ọṅụ ọhụrụ—ka ihe gbara ya gburugburu kọwaa.
- source_word: ἐὰν
  choice: ma ọ bụrụ na
  rationale: Ọ na-edobe usoro ọnọdụ dị n’okwu Grik n’enweghị ime ka ihe Pọl kwuru sie ike karịa ka o si kwuo ya.
- source_word: ὑμεῖς
  choice: unu
  rationale: “Unu” gosiri na Pọl na-agwa ọtụtụ ndị Tesalonaịka okwu, ma na-edobekwa nlebara anya pụrụ iche e tinyere n’aha nnọchiaha Grik ahụ.
- source_word: στήκετε
  choice: eguzosie ike
  rationale: Nkebiokwu Igbo a na-egosi iguzosi ike na ịnọgide na-enweghị ịda, bụ́ isi echiche nke στήκω n’ebe a.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Ọ na-edobe akpaokwu Pọl nke na-egosi ọnọdụ na mmekọrịta ha na Onyenwe anyị, n’enweghị imechi ya n’otu nkọwa ozizi pụrụ iche.
theological_decisions:
- issue: Ike okwu Pọl bụ́ “ugbu a anyị dị ndụ”
  choice: E debere ya dịka okwu kpọmkwem nke na-arụkwa ọrụ dị ka okwu atụ maka ume, nkasi obi, na ọṅụ ọhụrụ.
  alternative: Ịsụgharị ya ozugbo dịka “ugbu a anyị enwetala ume ọhụrụ.”
  rationale: Okwu Grik ahụ pụtara kpọmkwem “anyị dị ndụ,” ma ihe gbara ya gburugburu na-egosi ike okwu atụ. Idebe ya otu a na-echekwa ma okwu ahụ n’onwe ya ma nghọta sara mbara ya.
- issue: Ihe “n’ime Onyenwe anyị” pụtara
  choice: Iguzosi ike n’ọnọdụ mmekọrịta ha na Onyenwe anyị.
  alternative: “n’ịdị n’otu na Onyenwe anyị” ma ọ bụ “n’ikwesị ntụkwasị obi nye Onyenwe anyị.”
  rationale: Akpaokwu ahụ bara ụba n’ihe ọ pụtara. “N’ime Onyenwe anyị” na-echekwa obosara ya ma zere ịmanye otu ozizi ụka pụrụ iche n’ime ya.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Unu” na-egosi ọnụọgụ ọtụtụ nke ὑμεῖς; “Onyenwe anyị” na-edobe aha nsọ a maara nke ọma. E debere usoro ọnọdụ na nghọta sara mbara nke okwu Pọl n’enweghị ịkọwa esemokwu nkà mmụta okpukpe gabiga ihe isi mmalite kwuru.
