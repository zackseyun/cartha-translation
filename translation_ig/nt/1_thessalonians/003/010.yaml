  text: night and day praying most earnestly to see your face and to supply what is lacking in your faith,[a]
translation:
  language: ig
  text: N’abalị na n’ehihie, anyị na-ekpe ekpere na-arịọsi ike nke ukwuu ka anyị hụ ihu unu ma mezue ihe okwukwe unu ka na-enweghị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe na-efu n’okwukwe unu.” Okwu Grik ahụ nwekwara ike ịpụta n’ụzọ sara mbara ihe ndị ka chọrọ ka e wusie ike ma ọ bụ ka e mee ka ha zuo oke n’okwukwe unu.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: N'abalị na n'ehihie
  rationale: Ọ bụ ụzọ Igbo doro anya si egosi ekpere a na-ekpe ugboro ugboro, ma ọ bụ mgbe niile, n'abalị nakwa n'ehihie.
- source_word: ὑπερεκπερισσοῦ
  choice: ike nke ukwuu
  rationale: Nke a na-egosipụta ike pụrụ iche nke adverb Grik ahụ n'Igbo dị mfe ma dị ugwu.
- source_word: δεόμενοι
  choice: anyị na-arịọsi ... n'ekpere
  rationale: Okwu a pụtara ịrịọ arịrịọ siri ike; njikọ ‘na-arịọsi ike ... n'ekpere’ na-edobe ma ekpere ma ịdị uchu dị na ya.
- source_word: εἰς τὸ ἰδεῖν
  choice: ka anyị hụ
  rationale: Nkebi a na-egosi nzube; ‘ka anyị hụ’ bụ usoro ebumpụta ụwa n'Igbo.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: unu ihu na ihu
  rationale: Nke a na-echekwa ihe oyiyi nke ‘ihu’ ma na-ekwupụta n'ụzọ Igbo na ọ bụ ịhụ ha n'onwe ha, ọ bụghị naanị ịnụ banyere ha.
- source_word: καταρτίσαι
  choice: mejuo
  rationale: N'ọnọdụ a, ngwaa ahụ pụtara ime ka ihe zuru ezu site n'ịnye ihe dị mkpa; ‘mejuo’ kwekọrọ nke ọma na ihe ka na-adịghị.
- source_word: τὰ ὑστερήματα
  choice: ihe ka na-adịghị
  rationale: Nke a na-egosipụta ihe ndị na-erughị ma ọ bụ na-efu, n'ekwughị na okwukwe ha adịghị kpamkpam.
- source_word: τῆς πίστεως ὑμῶν
  choice: n'okwukwe unu
  rationale: ‘Okwukwe’ bụ ntụgharị ndabere kwesịrị ekwesị maka πίστις ebe a, ebe okwu a na-ekwu maka okwukwe ha nke ka chọrọ mmeju na iwusi ike.
theological_decisions:
- issue: Ntụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N'ebe a, ihe a na-ekwu bụ okwukwe ma ọ bụ ntụkwasị obi ndị Tesalonaịka nwere nke chọrọ ito eto; isi okwu abụghị omume ikwesị ntụkwasị obi ha.
- issue: Ihe τὰ ὑστερήματα τῆς πίστεως pụtara
  choice: ihe ka na-adịghị n'okwukwe unu
  alternative: ihe ka chọrọ iwusi ike ma ọ bụ imezu n'okwukwe unu
  rationale: Isi ntụgharị ahụ na-echekwa echiche nke ihe na-efu ma ọ bụ na-erughị, ebe nkọwa ala peeji na-edobe nghọta sara mbara na ọ bụ ihe chọrọ iwusi ike ma ọ bụ ime ka zuo oke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu mee ya. ‘Ihu na ihu’ na-eme ka okwu nkịtị banyere ịhụ mmadụ n'onwe ya doo anya, ebe ‘ihe ka na-adịghị’ na-ezere ikwu na okwukwe ha adịghị ma ọlị.
