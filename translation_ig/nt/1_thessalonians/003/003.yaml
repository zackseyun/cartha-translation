revisions:
- from: ka nsogbu ndị a ghara ime ka onye ọ bụla maa jijiji.[a][b] N’ihi na unu onwe unu maara na e debere anyị maka nke a.[c]
  to: ka onye ọ bụla ghara ịma jijiji[a] n’ihi mkpagbu ndị a.[b] N’ihi na unu onwe unu maara na anyị ka e debere maka nke a.[c]
  rationale: The revision strengthens fidelity to θλίψεσιν by using “mkpagbu,” makes the purpose clause idiomatic while retaining the contextual relation of the afflictions to the shaking, and revises the κείμεθα note so that all listed alternatives represent appointment/destiny rather than physical remaining. It preserves the source’s passive formulation and does not specify who appoints or impose a theological system.
