base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: ig
  text: ka onye ọ bụla ghara ịma jijiji[a] n’ihi mkpagbu ndị a.[b] N’ihi na unu onwe unu maara na anyị ka e debere maka nke a.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka obi onye ọ bụla ghara ịda” ma ọ bụ “ka onye ọ bụla ghara inwe obi mgbagwoju.” N’ebe ndị ọzọ, ngwaa Grik a na-adịghị ahụkarị nwekwara ike ịpụta iduhie mmadụ ma ọ bụ iji okwu ire ụtọ rata ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ahụhụ ndị a” ma ọ bụ “nsogbu ndị a.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a kara anyị aka maka nke a” ma ọ bụ “a họpụtara anyị maka nke a.”
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: ka ... ghara ime ka onye ọ bụla maa jijiji
  rationale: Nkebi infinitive nwere article na-egosi ebumnuche ma ọ bụ ihe a chọrọ ka ọ pụta site n'amaokwu bu ụzọ. N'ọnọdụ a, ngwaa a na-adịghị ahụkarị, σαίνεσθαι, pụtara ime ka mmadụ ghara iguzosi ike ma ọ bụ maa jijiji n'ihi ahụhụ. Nsụgharị a dị mfe ma na-edebe ihe Pọl na-echegbu onwe ya banyere ya; a kọwara ohere ndị ọzọ n'okpuru [a].
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: nsogbu ndị a
  rationale: θλῖψις na-egosi mkpagbu, nrụgide, ma ọ bụ ahụhụ siri ike. N'Igbo ugbu a, “nsogbu ndị a” bụ okwu doro anya nke na-arụ ọrụ nke ọma na ngwaa “ime ka ... maa jijiji”; ihe ọzọ nwere ike ịbụ “mkpagbu ndị a,” nke e debere n'okpuru [b].
- source_word: αὐτοὶ
  choice: unu onwe unu
  rationale: αὐτοὶ na-emesi onye a na-agwa okwu ike; “unu onwe unu” na-edebe nkwusi ike ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-enye ihe kpatara okwu bu ụzọ, ya mere “N’ihi na” bụ njikọ nkọwa doro anya ma dị ndụ n'Igbo.
- source_word: οἴδατε
  choice: maara
  rationale: 'Ọ bụ ezie na ọdịdị okwu Grik a yiri perfect, ihe ọ pụtara ebe a bụ ihe dị ugbu a: “unu maara.”'
- source_word: εἰς τοῦτο
  choice: maka nke a
  rationale: Nkebi a na-ezo aka n'ahụhụ ndị a kpọtụrụ aha. “Maka nke a” na-edebe nkenke na mgbagwoju anya dị n'okwu mbụ, kama ịgbakwunye “ebumnuche” n'ụzọ doro anya karịa Grik.
- source_word: κείμεθα
  choice: e debere anyị
  rationale: κεῖμαι pụtara n'ụzọ nkịtị ịnọ ma ọ bụ ịbụ onye e debere n'otu ọnọdụ; n'okwu a ọ na-egosi na nke a bụ ọnọdụ a họpụtara ma ọ bụ akaraara ha. “E debere anyị” na-anọ nso n'oyiyi okwu Grik ma na-ezere ịkọwa kpọmkwem onye mere ya.
theological_decisions:
- issue: Mmekọrịta ndị kwere ekwe na ahụhụ n'okwu εἰς τοῦτο κείμεθα
  choice: e debere anyị maka nke a
  alternative: a kara anyị aka maka nke a; a họpụtara anyị maka nke a
  rationale: Okwu ahụ na-egosi na mkpagbu bụ ihe a ga-atụ anya ya na ndụ ndị kwere ekwe, ma ọ naghị akọwapụta ozizi zuru ezu banyere akara aka ma ọ bụ predestination. “E debere anyị” na-edebe ịdị arọ nke passive ahụ na ihe a na-akọwaghị kpọmkwem banyere onye mere nhọpụta ahụ.
translation_notes:
  register: E jiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Maa jijiji” na-enye ihe oyiyi nke ịbụ onye nsogbu mere ka ọ ghara iguzosi ike; “e debere anyị” na-edebe passive na mgbagwoju anya nke κεῖμαι. E tinyere akara ụkwụokwu niile n'ederede, ozugbo e mesịrị okwu ha na-akọwa.
