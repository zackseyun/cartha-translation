id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: ig
  text: 'N’ihi nke a, mgbe mụ onwe m na-enweghịzi ike ịnagide, m zipụrụ ka m wee mata otú okwukwe unu[a] dị, ka ọ ghara ịbụ na onye na-anwa mmadụ anwawo unu, ọrụ ike anyị ewee bụrụ ihe efu[b].


    [a] A pụkwara ịsụgharị ya “ikwesi ntụkwasị obi unu” ma ọ bụ “ntụkwasị obi unu.” Okwu Grik ahụ nwere ike ịpụta echiche ndị a jikọrọ ọnụ, dabere n’ọnọdụ e ji ya mee ihe.


    [b] A pụkwara ịsụgharị ya “n’efu” ma ọ bụ “n’enweghị uru ọ bụla.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ikwesi ntụkwasị obi unu” ma ọ bụ “ntụkwasị obi unu.” Okwu Grik ahụ nwere ike ịpụta echiche ndị a jikọrọ ọnụ, dabere n’ọnọdụ e ji ya mee ihe.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “n’efu” ma ọ bụ “n’enweghị uru ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi ihe kpatara ihe Pọl mere, ma na-atụgharị uche azụ n’ihe ọ kọwara tupu amaokwu a.
- source_word: κἀγὼ
  choice: mụ onwe m
  rationale: Nke a na-eme ka onye na-ekwu okwu pụta ìhè n’ụzọ Igbo si ekwu ya, na-enweghị ime ka καί sie ike karịa ka ọ dị n’asụsụ Grik.
- source_word: μηκέτι στέγων
  choice: mgbe mụ onwe m na-enweghịzi ike idi ya
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa maka inwe ndidi ruo mgbe mmadụ na-enweghịzi ike ịnagide ọnọdụ ahụ.
- source_word: ἔπεμψα
  choice: m zipụrụ
  rationale: E debeghị onye e zipụrụ aha n’amaokwu a, dị ka Grik si hapụ onye ahụ n’ekwughị ya; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Timoti.
- source_word: εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν
  choice: ka m wee mata otú okwukwe unu dị
  rationale: Nke a na-egosi nzube izipụ ahụ ma na-asụ ya n’ụzọ Igbo doro anya, ya bụ ịchọpụta ọnọdụ okwukwe ha.
- source_word: μή πως
  choice: ka ọ ghara ịbụ na
  rationale: Ọ na-echekwa ụjọ ma ọ bụ nchegbu Pọl nwere banyere ihe nwere ike ịbụ na o meela.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: onye na-anwa mmadụ ọnwụnwa anwawola unu
  rationale: E debere njikọ okwu dị n’etiti onye na-anwa ọnwụnwa na omume ịnwa ọnwụnwa, ma a kọwaghị ya ozugbo dị ka Setan ebe Grik ji aha nkọwa mee ihe.
- source_word: εἰς κενὸν γένηται
  choice: ewee bụrụ ihe efu
  rationale: Ọ bụ okwu Igbo ebumpụta ụwa nke na-egosi na ọrụ ahụ nwere ike ghara iru ebumnobi ya; nkọwa ndị ọzọ dị n’ala peeji.
- source_word: ὁ κόπος ἡμῶν
  choice: ọrụ ike anyị
  rationale: Ọ na-echekwa echiche κόπος nke ọrụ e ji mgbalị na ndọgbu rụọ, ọ bụghị naanị ọrụ n’ozuzu ya.
theological_decisions:
- issue: Ihe πίστις pụtara n’ọnọdụ a
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi; ntụkwasị obi
  rationale: N’ebe a, “okwukwe” kacha egosi nkwenye na ntụkwasị obi ndị Tesalonaịka nọgidere nwee n’ozi ọma. E tinyere echiche ndị ọzọ okwu Grik ahụ nwere ike ibu n’ala peeji kama ịhọrọ otu n’ime ha n’ụzọ ga-emechi ihe okwu ahụ nwere ike ịpụta.
- issue: Onye ὁ πειράζων na-ezo aka na ya
  choice: onye na-anwa mmadụ ọnwụnwa
  alternative: Setan; onye ọnwụnwa ahụ
  rationale: Ọnọdụ ahụ na-egosi Setan, ma ihe odide Grik ejighị aha “Setan” ebe a; ya mere, a hapụrụ aha nkọwa ahụ iji zere itinye ihe na-adịghị n’amaokwu ahụ.
- issue: Ma ọrụ ndị ozi ahụ ọ pụrụ ịbụ ihe efu
  choice: ọrụ ike anyị ewee bụrụ ihe efu
  alternative: ọrụ ike anyị abụrụla ihe efu
  rationale: Nke a na-echekwa nchegbu Pọl na ihe ọrụ ha ga-esi pụta nwere ike ghara iru ebumnobi ya, n’agbanyeghị na okwu Grik ahụ na-ahapụ esemokwu dị n’etiti ihe nwere ike ịbụ na o meela na ihe ga-esi na ya pụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere okwu ụka pụrụ iche na nkọwa na-akpọ Setan aha ozugbo ebe isi odide jiri naanị aha nkọwa. E doziri akara ala peeji ka [a] soro “okwukwe unu,” ebe [b] soro “ihe efu,” n’ihi na nke ahụ kwekọrọ n’ihe ala peeji nke ọ bụla na-akọwa.
