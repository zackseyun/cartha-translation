id: 1TH.3.7
reference: 1 Thessalonians 3:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: ig
  text: N’ihi nke a, ụmụnna[b], banyere unu, anyị nwetara nkasi obi n’ime ahụhụ na mkpagbu anyị niile site n’okwukwe unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “site n’ikwesị ntụkwasị obi unu.” Okwu Grik bụ pistis nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi; n’ebe a, o yikarịrị ka ọ gụnyere ịnọgidesi ike nke ndị Tesalonaịka nọgidere na-ekwere.
    reason: alternative_reading
  - marker: b
    text: “Ụmụnna” bụ ụzọ Pọl na-ejikarị akpọ ndị ọgbakọ, ọ pụkwara ịgụnye ndị kwere ekwe niile, ma ndị nwoke ma ndị nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi njikọ nke ihe Pọl na-ekwu ebe a na akụkọ Timoti wetara n’amaokwu ndị bu ụzọ.
- source_word: παρεκλήθημεν
  choice: anyị nwetara nkasi obi
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi na akụkọ banyere ndị Tesalonaịka mere ka obi Pọl na ndị ya na ha nọ dajụọ n’ime ahụhụ ha.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ ụzọ Igbo dị ebube ma bụrụkwa ihe a na-aghọta nke ọma maka ịkpọ ndị otu ọgbakọ; ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị.
- source_word: ἐφ’ ὑμῖν
  choice: banyere unu
  rationale: Nke a na-egosi na ọnọdụ ndị Tesalonaịka bụ ihe e ji kasie ha obi, ma ọ naghị ekwu na ndị Tesalonaịka kpatara ahụhụ ha.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: n’ime ahụhụ na mkpagbu anyị niile
  rationale: Nsụgharị a na-edobe okwu abụọ ahụ na-akọwa nrụgide na ahụhụ siri ike, ma na-ada ka Igbo nke oge a.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: site n’okwukwe unu
  rationale: διά ya na genitive na-egosi ụzọ e si nweta nkasi obi; okwukwe ndị Tesalonaịka bụ ihe e ji kasie ndị ozi ahụ obi.
- source_word: πίστεως
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ nsụgharị bụ isi nke πίστις ebe a, ebe ihe gbara ya gburugburu na-egosikwa ịnọgidesi ike n’okwukwe.
theological_decisions:
- issue: Ma πίστις ọ pụtara okwukwe ka ọ bụ ikwesị ntụkwasị obi n’ebe a
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi; ịnọgidesi ike n’okwukwe
  rationale: Isi okwu ahụ bụ okwukwe ndị Tesalonaịka, ma akụkọ Timoti gosikwara na ha nọgidere na ya. Ya mere, e debere ‘okwukwe’ n’ahịrịokwu, tụkwasịkwa nghọta ọzọ ahụ n’okpuru peeji ka a ghara idozi ihe okwu Grik nwere ike ịgụnye n’otu ụzọ naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa ebube. A haziri nkebiokwu ndị ahụ ka ha soro usoro Grik nke ọma, ọkachasị ‘banyere unu,’ ka a ghara ime ka ọ dị ka ndị Tesalonaịka bụ ndị kpatara ahụhụ ahụ.
