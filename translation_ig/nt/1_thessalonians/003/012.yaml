id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: ig
  text: Ka Onyenweanyị mee ka unu bawanye ma jubiga ókè n’ịhụ ibe unu na mmadụ niile n’anya[a], dị nnọọ ka anyị kwa si eme otú ahụ n’ebe unu nọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ịhụnanya n’ebe ibe unu nọ na n’ebe mmadụ niile nọ.”
    reason: lexical_alternative
  - marker: b
    text: Nkebi ikpeazụ a dị mkpụmkpụ n’asụsụ Grik; n’okwu nkịtị ọ bụ, “dị nnọọ ka anyị kwa n’ebe unu nọ.” A na-aghọta ngwaa na echiche ịhụnanya site n’okwu bu ya ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Onyenweanyị
  rationale: Aha a na-echekwa κύριος dịka aha nsọpụrụ ‘Onyenweanyị,’ n’enweghị ịkọwapụta onye ọ na-ezo aka karịa ihe Grik kwuru.
- source_word: πλεονάσαι
  choice: mee ka unu bawanye
  rationale: Ụdị ngwaa optative dị n’arịrịọ a na-egosi ọchịchọ; ‘mee ka’ na-egosikwa na Onyenweanyị bụ onye na-eme ka mmụba ahụ dịrị.
- source_word: περισσεύσαι
  choice: jubiga ókè
  rationale: Nke a na-edobe ike nke ngwaa nke abụọ, nke pụtara ịba ụba nke ukwuu, ma na-ekewapụ ya na ‘bawanye.’
- source_word: τῇ ἀγάπῃ
  choice: n’ịhụnanya
  rationale: ‘Ịhụnanya’ bụ okwu Igbo doro anya maka ἀγάπη; ‘n’ịhụnanya’ na-egosi ihe mmụba ahụ metụtara.
- source_word: εἰς ἀλλήλους
  choice: n’ebe ibe unu nọ
  rationale: Nke a na-egosi ntụziaka ịhụnanya ahụ n’ụzọ Igbo kwụ ọtọ ma dị mma.
- source_word: καὶ εἰς πάντας
  choice: na n’ebe mmadụ niile nọ
  rationale: ‘Mmadụ niile’ na-edobe obosara πάντας, n’emeghị ka ọ bụrụ naanị ndị kwere ekwe.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: dị nnọọ ka anyị onwe anyị na-emere unu otu ahụ
  rationale: Nkebi Grik a hapụrụ ngwaa ya ka a ghọta ya site n’ihe bu ụzọ; ‘na-emere unu otu ahụ’ na-eme ka Igbo zuo oke n’ebughị nkọwa karịrị akarị.
- source_word: δὲ
  choice: Ka
  rationale: N’Igbo, usoro arịrịọ ‘Ka … mee’ na-eburu mgbanwe dị nro nke δέ na ọchịchọ optative n’ụzọ eke; itinye ‘ma’ ma ọ bụ ‘ugbu a’ ga-eme ka ọdịiche ahụ sie ike karịa nke Grik.
theological_decisions:
- issue: Onye ‘Onyenweanyị’ na-ezo aka
  choice: A hapụrụ ya dịka ‘Onyenweanyị’ n’enweghị aha ọzọ e tinyere.
  alternative: Ịkọwa ya kpọmkwem dịka Kraịst ma ọ bụ dịka Chineke.
  rationale: κύριος bụ naanị aha e ji kpọọ onye ahụ n’amaokwu a; nsụgharị ahụ ekwesịghị idozi ihe amaokwu ahụ n’onwe ya na-akọwaghị kpọmkwem.
- issue: Oke πάντας
  choice: A sụgharịrị ya ‘mmadụ niile.’
  alternative: ‘Ndị kwere ekwe niile’ ma ọ bụ naanị ‘niile.’
  rationale: Okwu ahụ sara mbara, ya mere a naghị amachi ya n’ebe ndị otu Kraịst nọ; ‘mmadụ’ na-eme ka okwu Igbo zuo oke n’enweghị ibelata obosara ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A họọrọ ‘jubiga ókè’ iji chekwaa nkwusi ike nke ngwaa abụọ ahụ, ebe ‘na-emere unu otu ahụ’ na-egosipụta nkebi Grik ahụ e hapụrụ ngwaa ya n’enweghị ịgbakwunye nkọwa ozizi.
