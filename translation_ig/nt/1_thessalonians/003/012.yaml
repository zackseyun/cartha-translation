    reason: lexical_alternative
  revision_rationale: The revision uses the normal Standard Igbo idiom for loving persons, retains both Greek verbs as distinct expressions (“bawanye” and “jubiga ókè”), removes added emphasis from “anyị onwe anyị,” and clarifies the inherited sense of the Greek ellipsis without specifying the Lord’s identity or restricting “all.” Both footnote anchors are retained and their explanations align with the revised wording.
