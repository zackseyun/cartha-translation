reference: 1 Thessalonians 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: ig
  text: Ka Chineke na Nna anyị n’onwe ya, ya na Onyenwe anyị Jizọs[a], duzie ụzọ anyị ka anyị bịakwute unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ngwaa a sụgharịrị “duzie” dị n’otu-ọnụọgụ, ọ bụ ezie na e jikọtara “Chineke na Nna anyị” na “Onyenwe anyị Jizọs” dị ka ndị isiokwu ya.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “mee ka ụzọ anyị gakwuru unu kwụrụ ọtọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: n’onwe ya
  rationale: Nke a na-emesi onye ahụ ike n’onwe ya; ọ na-egosi na Chineke na Nna anyị ga-eme ya n’onwe ya.
- source_word: δὲ
  choice: Ka
  rationale: δὲ na-egosi ntughari gaa n’ekpere ma ọ bụ ọchịchọ, ọ bụghị nnukwu mmegide. N’Igbo, usoro ọchịchọ nke malitere na “Ka” na-ebute echiche a n’ụzọ eke, ya mere ọ dịghị mkpa ịgbakwunye okwu dị ka “ma”.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: Chineke na Nna anyị
  rationale: Nke a na-ejigide aha abụọ ahụ maka otu onye, ma na-agbaso usoro Grik n’Igbo doro anya.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: Onyenwe anyị Jizọs
  rationale: “Onyenwe anyị” na-anọchi κύριος ἡμῶν, ebe “Jizọs” bụ ụdị aha ahụ a na-eji n’Igbo ugbu a.
- source_word: κατευθύναι
  choice: duzie
  rationale: Optative a na-egosi ekpere ma ọ bụ ọchịchọ. “Duzie” nwere echiche nke iduzi njem ma na-ahapụkwa ndabere nke ime ka ụzọ kwụrụ ọtọ.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: ụzọ anyị
  rationale: “Ụzọ anyị” nwere ike ịpụta ụzọ njem n’ezie ma ọ bụ ọnọdụ ga-eme ka njem ahụ kwe omume, dịka ὁδός si nwee obosara echiche n’ebe a.
- source_word: πρὸς ὑμᾶς
  choice: ka anyị bịakwute unu
  rationale: N’ọnọdụ njem a, okwu a na-egosi ịga n’ebe ndị Tesalonaịka nọ; nsụgharị a bụ Igbo eke ma doo anya.
theological_decisions:
- issue: 'Ngwaa otu-ọnụọgụ na ndị isiokwu abụọ: “Chineke na Nna anyị” na “Onyenwe anyị Jizọs”'
  choice: E debere Nna na Onyenwe anyị Jizọs ọnụ dị ka ndị na-eme otu ihe e kpere ka e mee, n’enweghị ịkọwa esemokwu ụtọasụsụ ahụ n’ime amaokwu.
  alternative: Ịhazigharị ahịrịokwu ka Chineke naanị ya yie onye ngwaa ahụ na-ekwu banyere ya, ma ọ bụ ikewapụ ihe ndị isiokwu abụọ ahụ na-eme.
  rationale: Grik jikọtara Nna na Onyenwe anyị Jizọs dị ka ndị isiokwu nke otu ngwaa dị n’otu-ọnụọgụ. E kwesịrị idebe njikọ ahụ ma ghara itinye nkọwa nkà mmụta okpukpe nke amaokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ka ... duzie” na-egosipụta ekpere-ọchịchọ ahụ; “ya na” na-eme ka ndị isiokwu abụọ ahụ pụta ìhè, ebe Igbo anaghị egosi otu-ọnụọgụ ma ọ bụ ọtụtụ-ọnụọgụ n’ụdị ngwaa dịka Grik si eme.
