id: 1TH.3.4
reference: 1 Thessalonians 3:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: ig
  text: N’ihi na ọbụna mgbe anyị na unu nọ, anyị nọgidere na-agwa unu tupu oge eruo na anyị ga-ahụ ahụhụ[a]. Ọ bụkwa otú ahụ ka o mere, unu makwaara ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a ga-emekpa anyị ahụ” ma ọ bụ “anyị ga-anọ ná mkpagbu.” Okwu Grik a nwere ike ịpụta ịnata nrụgide, nhụjuanya, ma ọ bụ mkpagbu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na ọbụna
  rationale: “N’ihi na” na-egosi na okwu a na-akọwa ihe e kwuru n’amaokwu bu ya ụzọ, ebe “ọbụna” na-echekwa nkwusi ike nke καί.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: mgbe anyị na unu nọ
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na ha nọ n’ebe ndị ahụ nọ ma soro ha biri.
- source_word: προελέγομεν
  choice: anyị nọgidere na-agwa unu tupu oge eruo
  rationale: “Nọgidere na-agwa” na-egosipụta omume gara n’ihu ma ọ bụ e mere ugboro ugboro nke imperfect, ebe “tupu oge eruo” na-echekwa echiche nke ikwu ihe tupu o mee.
- source_word: ὅτι μέλλομεν θλίβεσθαι
  choice: na anyị ga-ahụ ahụhụ
  rationale: “Ga-” na-egosi ihe a tụrụ anya na ọ ga-abịa; “ịhụ ahụhụ” bụ okwu Igbo doro anya nke nwere ike ịgụnye mkpagbu, nrụgide, na nsogbu n’enweghị ịkpa ókè n’otu ụdị ahụhụ.
- source_word: καθὼς καὶ ἐγένετο
  choice: Ọ bụkwa otú ahụ ka o mere
  rationale: Nke a na-echekwa ndakọrịta dị n’etiti ihe e buru ụzọ kwuo na ihe mechara mee, tinyekwara nkwusi ike dị nro nke καί.
- source_word: καὶ οἴδατε
  choice: unu makwaara ya
  rationale: “Ya” na-ezo aka n’ihe ahụ mere; “-kwa-” na-echekwa njikọ na nkwusi ike nke καί n’ụzọ Igbo dị mma.
theological_decisions:
- issue: Ụdị ahụhụ θλίβεσθαι na-ekwu maka ya
  choice: ahụhụ n’ozuzu ya, nke nwere ike ịgụnye mkpagbu na nrụgide
  alternative: mkpagbu kpọmkwem, ma ọ bụ ‘oke mkpagbu’ n’echiche pụrụ iche gbasara ọgwụgwụ oge
  rationale: Ihe gbara amaokwu a gburugburu na-egosi mmegide na nsogbu, ma okwu Grik ahụ anaghị amanye ka a kọwaa ya naanị dị ka mkpagbu kpọmkwem ma ọ bụ dị ka okwu nka gbasara ọgwụgwụ oge.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “ịhụ ahụhụ” ka ọ ghara imechi obosara ihe okwu Grik ahụ pụtara. E debere akara nkọwa ala peeji [a] kpọmkwem n’ebe okwu ọ na-akọwa dị.
