  source_fidelity: 'The translation accurately represents the Greek: the explanatory-emphatic καὶ γάρ, the imperfect/repeated sense of προελέγομεν, the anticipated suffering in μέλλομεν θλίβεσθαι, the correspondence of prediction and event in καθὼς καὶ ἐγένετο, and the concluding appeal to the readers'' knowledge are all retained. “anyị ga-ahụ ahụhụ” appropriately preserves the broad sense of θλίβεσθαι without restricting it to persecution.'
