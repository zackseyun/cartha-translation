id: 1TH.3.9
reference: 1 Thessalonians 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: ig
  text: N’ihi na, olee ekele anyị pụrụ iji kwụghachi Chineke banyere unu, maka ọṅụ niile anyị ji aṅụrị n’ihi unu n’ihu Chineke anyị?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα ... εὐχαριστίαν
  choice: olee ekele
  rationale: Ọ na-edobe ajụjụ nkwughachi nke Grik, ma na-ada nke ọma n’Igbo; ọ na-egosi na ekele ha ezughị ezu.
- source_word: δυνάμεθα
  choice: anyị pụrụ
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma kwekọọ n’echiche nke ‘anyị nwere ike.’
- source_word: ἀνταποδοῦναι
  choice: iji kwụghachi
  rationale: ‘Kwụghachi’ na-echekwa echiche nke inyeghachi ihe n’ọnọdụ ihe e nyere, n’enweghị ime ka okwu ahụ bụrụ naanị azụmahịa nkịtị.
- source_word: περὶ ὑμῶν
  choice: n’ihi unu
  rationale: N’ọnọdụ a, ọ bụ ụzọ Igbo sitere n’okike isi kwuo na unu bụ ihe kpatara ekele ahụ; nkọwa ala peeji na-echekwa ntụgharị nkịtị ‘banyere unu.’
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ
  choice: maka ọṅụ niile
  rationale: Ọ na-egosi ihe ndabere ma ọ bụ ihe kpatara inye Chineke ekele.
- source_word: ᾗ χαίρομεν
  choice: anyị ji aṅụrị
  rationale: Ọ na-echekwa njikọ dị n’etiti χαρά na χαίρομεν site n’iji ‘ọṅụ’ na ‘aṅụrị.’
- source_word: δι’ ὑμᾶς
  choice: n’ihi unu
  rationale: διά tinyere accusative na-egosi ihe kpatara ọṅụ ahụ.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: n’ihu Chineke anyị
  rationale: Ọ na-echekwa ihe atụ gbasara ịnọ n’ihu Chineke ma na-ada ugwu n’Igbo.
theological_decisions:
- issue: Ike ajụjụ nkwughachi ekele nye Chineke
  choice: E debere ‘olee ekele ... iji kwụghachi Chineke,’ nke na-egosi na ekele Pọl na ndị ibe ya enweghị ike izu oke.
  alternative: ‘Olee otú anyị ga-esi kelee Chineke nke ukwuu maka unu?’
  rationale: ἀνταποδοῦναι nwere echiche doro anya nke inyeghachi ma ọ bụ ịkwụghachi. Ajụjụ ahụ na-egosi ezughị oke nke ekele ha, ọ bụghị na mmadụ pụrụ ịkwụ Chineke ụgwọ n’ụzọ azụmahịa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ nkwughachi ‘ọṅụ ... aṅụrị’ iji gosipụta ikwughachi mkpụrụokwu dị na Grik, ma tinye akara ajụjụ iji mee ka ụdị ajụjụ nkwupụta ahụ doo anya.
