revisions:
- from: N’ihi na olee ekele anyị pụrụ iji kwụghachi Chineke n’ihi unu,[a] maka ọṅụ niile anyị ji aṅụrị n’ihi unu n’ihu Chineke anyị?
  to: N’ihi na, olee ekele anyị pụrụ iji kwụghachi Chineke banyere unu, maka ọṅụ niile anyị ji aṅụrị n’ihi unu n’ihu Chineke anyị?
  rationale: The revision changes the first ‘n’ihi unu’ to ‘banyere unu’ to represent περί ὑμῶν and retains ‘n’ihi unu’ for causal δι’ ὑμᾶς. It preserves the Greek rhetorical wording and the deliberate ‘ọṅụ ... aṅụrị’ cognate-style expression. The footnote is recast in clear Standard Igbo while still distinguishing an idiomatic rendering from the more literal wording.
  reviewer_model: gpt-5.6-terra
