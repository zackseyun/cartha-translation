    text: 'Ma ọ bụ, n’ụzọ Igbo ka mfe: “Olee otú anyị ga-esi kelee Chineke nke ọma maka unu?” N’ụzọ nkịtị karị, Grik sịrị: “Olee ekele anyị pụrụ iji kwụghachi Chineke banyere unu?”'
    reason: lexical_alternative
