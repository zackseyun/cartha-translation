  terminology: “Ụmụnna” is an established Igbo Christian congregational address and the note appropriately explains its likely inclusive reference. “Olileanya” is the standard, clear term for hope. The footnote on “ụra” preserves the lexical alternative and explains the metaphor without altering the main text.
