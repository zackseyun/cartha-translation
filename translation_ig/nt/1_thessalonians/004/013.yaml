id: 1TH.4.13
reference: 1 Thessalonians 4:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: ig
  text: Ma anyị achọghị ka unu ghara ịma, ụmụnna,[a] banyere ndị dara n’ụra,[b] ka unu ghara iru újú dị ka ndị ọzọ, bụ́ ndị na-enweghị olileanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” n’ebe a bụ okwu e ji agwa ọgbakọ ahụ dum, o yikwara ka ọ gụnyere ma ụmụ nwoke ma ụmụ nwaanyị.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ndị na-ehi ụra.” N’ebe a, Pọl ji “ụra” mee ihe atụ maka ndị kwere ekwe nwụrụ anwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: Ma anyị achọghị
  rationale: “Ma” na-egosi njikọ nwere ntakịrị ntụgharị n’okwu; “anyị achọghị” na-ebufe θέλομεν n’ụzọ Igbo dị mfe ma kwesị ntụkwasị obi.
- source_word: ὑμᾶς ἀγνοεῖν
  choice: ka unu ghara ịma
  rationale: Nke a na-egosi na Pọl achọghị ka ha bụrụ ndị na-amaghị ihe ahụ, na-enweghị iji okwu nwere ụda mkparị.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo a na-ejikarị akpọ ndị otu okwukwe; n’ebe a ọ na-agwa ọgbakọ dum okwu, ma ọ bụ nwoke ma ọ bụ nwaanyị.
- source_word: περὶ τῶν κοιμωμένων
  choice: banyere ndị dara n’ụra
  rationale: Ọ na-edowe ihe atụ nke ‘ụra’ e ji kwuo banyere ndị nwụrụ anwụ, kama ịgbanwe ya ozugbo ka ọ bụrụ ‘ndị nwụrụ anwụ.’
- source_word: ἵνα μὴ λυπῆσθε
  choice: ka unu ghara iru újú
  rationale: “Ka” na-ebufe nzube nke ἵνα; “iru újú” na-egosi mwute miri emi n’ụzọ ebumpụta ụwa, ma ọ naghị ekwu na ụdị mwute niile bụ ihe a machibidoro.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: dị ka ndị ọzọ
  rationale: Nke a bụ ntụgharị doro anya nke ntụnyere ahụ, na-ezo aka n’ụfọdụ ndị na-abụghị ndị kwere ekwe n’ọnọdụ a.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: bụ́ ndị na-enweghị olileanya
  rationale: Ọ na-edowe ọdịiche Pọl mere n’etiti ndị nwere olileanya mbilite n’ọnwụ na ndị na-enweghị ya.
theological_decisions:
- issue: Ihe κοιμωμένων pụtara n’okwu banyere ihe ndị ga-eme n’ọdịnihu
  choice: E debere ihe atụ ahụ dịka “ndị dara n’ụra.”
  alternative: “ndị nwụrụ anwụ” ma ọ bụ “ndị na-ehi ụra”
  rationale: Pọl jiri ụra mee ihe atụ maka ndị kwere ekwe nwụrụ anwụ n’ọnọdụ olileanya mbilite n’ọnwụ. Idebe ihe atụ ahụ na-echekwa ọdịdị na esemokwu nkà mmụta okpukpe dị n’okwu ahụ; ihe odide ala peeji na-akọwa onye ọ na-ezo aka na ya.
- issue: Ndị ἀδελφοί gụnyere
  choice: A sụgharịrị ya “ụmụnna,” nke n’Igbo nwere ike ịgụnye ọgbakọ dum.
  alternative: “ụmụ nwoke na ụmụ nwaanyị ibe anyị”
  rationale: Okwu Igbo “ụmụnna” dị ebumpụta ụwa n’ịkpọkọta ndị otu obodo ma ọ bụ okwukwe, ma nwee ike ịgụnye nwoke na nwaanyị n’enweghị ịgbakwunye ihe na-adịghị n’usoro okwu Grik.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ ‘ịda n’ụra,’ ma jiri ihe odide ala peeji kọwaa ya. E họọrọ ‘ụmụnna’ dịka okwu Igbo nkịtị maka ndị otu okwukwe, tinyere nkọwa banyere obosara ndị ọ gụnyere.
