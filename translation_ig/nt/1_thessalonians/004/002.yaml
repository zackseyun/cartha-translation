review_pass:
  verdict: revise
  source_fidelity: 'Isi ederede ahụ na-ebufe akụkụ ndị bụ isi nke Grik n’ụzọ kwesịrị ntụkwasị obi: οἴδατε γάρ dịka “N’ihi na unu maara,” παραγγελίας dịka “ntụziaka,” na διά + genitive dịka “site n’aka.” “Onyenwe anyị Jizọs” bụ aha nsọpụrụ a na-ahụkarị n’Igbo maka “Lord Jesus”; n’ọnọdụ a ọ na-arụ ọrụ dịka aha e guzobere, ọ bụghị nkwupụta ọhụrụ banyere onye nwe mmadụ.'
  naturalness: Ahịrịokwu a dị n’usoro Standard Igbo nke oge a ma dịkwa mfe ịgụ. “Ntụziaka ndị anyị nyere unu” na-egosi nke ọma ntụziaka ndị Pọl na ndị ibe ya nyere ndị na-agụ akwụkwọ.
  terminology: “Ntụziaka” dabara na παραγγελίας, n’agbanyeghị na okwu Grik ahụ nwere ike inwe ụda iwu nyere n’ike. “Site n’aka” na-edobe nghọta mediation/agency n’enweghị ime ka ọ bụrụ naanị ikike. Ma ndetu ala “n’ike nke” nwere ike ịpụta ‘by means of strength/power,’ ọ bụghị kpọmkwem ‘by the authority of’; “site n’ikike nke” ka ziri ezi.
  issues:
