    issue: Ndụmọdụ ọzọ dị na ndetu ala ji “n’ike” sụgharịa ‘by the authority.’
    rationale: N’Igbo, “n’ike” na-ezokarị aka n’ike ma ọ bụ agbara. Iji “site n’ikike nke” na-akọwa ikike/ikike ọchịchị a na-atụ aro, ma na-echekwa na ọ bụ naanị nghọta ọzọ, ọ bụghị ihe isi ederede kpebisiri ike.
