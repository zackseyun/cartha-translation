lexical_decisions:
- source_word: οἴδατε
  choice: unu maara
  rationale: Ụdị οἶδα nwere nghọta nke oge ugbu a na Grik Koine; “unu maara” bụ Igbo nkịtị ma doo anya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi nkọwa ma ọ bụ ihe ndabere nke okwu bu ụzọ; “N’ihi na” na-echekwa njikọ ahụ.
- source_word: τίνας παραγγελίας
  choice: ntụziaka ndị
  rationale: παραγγελία nwere ike ịbụ ntụziaka ma ọ bụ iwu e nyere n’ike. “Ntụziaka ndị” bụ okwu Igbo dị mfe nghọta ma ka na-enye echiche nke ihe e nyere ha ka ha mee.
- source_word: ἐδώκαμεν ὑμῖν
  choice: anyị nyere unu
  rationale: Nke a na-ebufe ngwaa na onye natara ya n’usoro Igbo eke.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: site n’aka Onyenwe anyị Jizọs
  rationale: διά tinyere genitive nwere ike igosi onye e si n’aka ya mee ihe ma ọ bụ ụzọ e si mee ya. Nhọrọ a na-echekwa nghọta nke mediation/agency n’agaghị ekpebi na ọ bụ naanị ikike ka e bu n’uche.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị ma dị ùgwù maka κύριος n’aha nsọpụrụ.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: E dere aha ahụ n’ụdị Standard Igbo a na-ejikarị.
theological_decisions:
- issue: Ike nghọta nke διὰ τοῦ κυρίου Ἰησοῦ
  choice: site n’aka Onyenwe anyị Jizọs
  alternative: n’ike nke Onyenwe anyị Jizọs
  rationale: Akụkụ Grik ahụ nwere ike igosi na e sitere n’aka Jizọs nye ntụziaka ndị ahụ, ma ọ bụ na e nyere ha n’ike ya. Isiokwu ahụ na-ahapụ echiche abụọ ahụ oghe; ndetu ala na-egosi nghọta nke ikike.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka onye nke abụọ n’ọnụọgụ ọtụtụ doo anya; e tinyere akara [a] kpọmkwem n’isiokwu.
