id: 1TH.4.6
reference: 1 Thessalonians 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: ig
  text: ka onye ọ bụla ghara ịgafe oke ma rigbuo nwanne ya[b] n'okwu a[a], n'ihi na Onyenwe anyị bụ onye na-abọ ọbọ n'ihe ndị a niile, dị ka anyị gwakwara unu na mbụ ma dọọ unu aka ná ntị nke ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ghara ịghọgbu nwanne ya n'okwu ahụ.” Okwu Grik ahụ nwere ike ịpụta irigbu mmadụ ma ọ bụ ịnara ya ihe n'ụzọ aghụghọ. N'ọnọdụ amaokwu ndị gbara ya gburugburu, o yikarịrị ka ọ na-ekwu maka mmejọ metụtara mmekọahụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “nwanne ya” bụ nke nwoke otu. O yikarịrị ka ọ na-elekwasị anya n'onye kwere ekwe ibe ya, ọ bụ ezie na ịdọ aka ná ntị a nwere ike iru ndị ọzọ niile nọ n'ọgbakọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: ka onye ọ bụla ghara ịgafe oke
  rationale: Nkebi infinitive a na-aga n'ihu n'iwu dị n'amaokwu gara aga. ‘Ịgafe oke’ na-edobe ihe atụ nke ịgafe ókè omume ọma ma na-ada nke ọma n'Igbo.
- source_word: πλεονεκτεῖν
  choice: rigbuo
  rationale: ‘Rigbuo’ na-egosi iji onye ọzọ mee ihe maka uru onwe onye ma ọ bụ ịnara ya ihe ruuru ya, n'emeghị ka okwu ahụ bụrụ naanị aghụghọ ego.
- source_word: ἐν τῷ πράγματι
  choice: n'okwu a
  rationale: Okwu Grik ahụ na-arụtụ aka n'ihe a na-ekwu maka ya n'akụkụ amaokwu ndị a, ma ọ kọwaghị ya kpọmkwem; ‘n'okwu a’ na-edobe njikọ ahụ na nghọta sara mbara ya.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: nwanne ya
  rationale: ‘Nwanne ya’ bụ ụzọ Igbo e si akọwa ἀδελφός n'ụzọ ebumpụta ụwa ma na-edobe echiche nke onye nọ n'otu ezinụlọ okwukwe, n'agbanyeghị na aha Grik ahụ bụ nke nwoke otu.
- source_word: ἔκδικος κύριος
  choice: Onyenwe anyị bụ onye na-abọ ọbọ
  rationale: Nke a na-edobe ike ikpe ziri ezi dị na ἔκδικος na nsọpụrụ aha κύριος; ọ na-egosi na Onyenwe anyị ga-eme ka onye mere ihe ọjọọ zaa ya.
- source_word: περὶ πάντων τούτων
  choice: n'ihe ndị a niile
  rationale: Nsụgharị a na-edobe obosara okwu Grik ahụ ma na-ejikọta ya na mmehie na mmegbu ndị a na-atụle.
- source_word: προείπαμεν
  choice: anyị gwakwara unu na mbụ
  rationale: Nke a na-egosi na e nyelarị ha ozi a tupu oge ahụ, na-enweghị ime ka ọ bụrụ otu ihe na ngwaa ịdọ aka ná ntị na-esote.
- source_word: διεμαρτυράμεθα
  choice: dọọ unu aka ná ntị nke ukwuu
  rationale: Nkebi a na-egosipụta ịdọ aka ná ntị siri ike na nke e ji ịdị arọ kwuo, nke kwekọrọ n'ike διαμαρτύρομαι n'ebe a.
theological_decisions:
- issue: Ihe ‘okwu a’ na-ezo aka na ụdị mmejọ ahụ
  choice: E debere ‘n'okwu a’ n'ahịrị isi, ebe ọnọdụ gbara ya gburugburu na-egosi mmejọ metụtara mmekọahụ.
  alternative: Ịghọta ya dị ka aghụghọ azụmahịa ma ọ bụ mmegbu mmadụ n'ozuzu.
  rationale: Amaokwu 3–5 na-ekwu maka ịdị nsọ na izere ịkwa iko. Otú ọ dị, πρᾶγμα na πλεονεκτεῖν nwere ike ịpụta ihe sara mbara; ya mere ahịrị isi anaghị akọwapụta ihe karịrị Grik, ebe nkọwa ala peeji na-egosi echiche ndị ahụ.
- issue: Nsụgharị ἀδελφός
  choice: nwanne ya
  alternative: nwanne nwoke ya; onye kwere ekwe ibe ya
  rationale: Grik bụ aha nwoke otu, ma ‘nwanne’ n'Igbo bụ okwu ebumpụta ụwa nke nwere ike izo aka n'onye nọ n'otu ezinụlọ ma ọ bụ n'otu okwukwe. Nkọwa ala peeji na-echekwa ọdịdị nwoke nke Grik na obosara omume ọma ahụ.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ bụ nsụgharị Igbo a na-anabata nke ọma maka κύριος n'okwu gbasara Kraịst na ikike ikpe ya.
- issue: Ike ἔκδικος
  choice: onye na-abọ ọbọ
  alternative: onye na-eme ka ikpe ziri ezi guzosie ike
  rationale: ‘Onye na-abọ ọbọ’ na-echekwa okwu ikpe na nkwụghachi dị n'okwu Grik, n'ebugharịghị ya ka ọ bụrụ iwe mmadụ nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. ‘Ịgafe oke,’ ‘rigbuo,’ na ‘dọọ ... aka ná ntị nke ukwuu’ na-enye okwu ahụ ịdị arọ n'enweghị asụsụ ochie ma ọ bụ nkọwa nke otu ụka pụrụ iche.
