review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the main contrasts: those living and remaining until the Lord’s coming will not be ahead of those who have fallen asleep. The sleep metaphor and the emphatic force of οὐ μὴ are retained. However, “ebute ... ụzọ” most commonly means to lead or guide someone, rather than to precede someone; it can therefore blur φθάσωμεν in this context.'
  naturalness: The sentence is generally clear Standard Igbo, but “agaghị ebute ndị dara n’ụra ụzọ” is less idiomatic for temporal priority. “agaghị aga ndị dara n’ụra n’ihu ma ọlị” is direct and natural.
  terminology: “Onyenweanyị,” “ọbịbịa,” and “ndị dara n’ụra” are suitable biblical-register terms. The wording “site n’okwu Onyenweanyị” preserves the Greek phrase’s ambiguity and authority claim.
  issues:
  - severity: medium
    issue: The rendering “agaghị ebute ndị dara n’ụra ụzọ ma ọlị” can mean “will not lead those asleep,” rather than “will not precede those who have fallen asleep.”
    rationale: Here φθάνω denotes being ahead of or preceding others. “Agaghị aga ... n’ihu” communicates that relation unambiguously while retaining the emphatic negation with “ma ọlị.”
