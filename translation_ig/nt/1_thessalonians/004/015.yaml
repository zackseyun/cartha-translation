reference: 1 Thessalonians 4:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: ig
  text: 'N’ihi na nke a ka anyị na-agwa unu site n’okwu Onyenweanyị[a]: anyị ndị dị ndụ, ndị fọdụrụ ruo ọbịbịa Onyenweanyị[b], agaghị aga ndị dara n’ụra[c] n’ihu ma ọlị.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site n’okwu sitere n’aka Onyenweanyị.” Okwu Grik ahụ nwere ike izo aka n’okwu Onyenweanyị Jizọs kwuru ma ọ bụ ná mkpughe e nyere site n’ikike Onyenweanyị.
    reason: alternative_reading
  - marker: b
    text: Okwu Grik παρουσία nwekwara ike ịpụta “ọnụnọ” ma ọ bụ “ịbịarute.”
    reason: lexical_alternative
  - marker: c
    text: “Ndị dara n’ụra” bụ ihe atụ e ji kwuo banyere ndị kwere ekwe nwụrụ anwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: site n’okwu Onyenweanyị
  rationale: Nke a na-egosi na okwu Pọl dabeere n’okwu nwere ikike Onyenweanyị, ma ọ naghị ekpebi ma ọ bụ okwu Jizọs kwuru nke a maara ama ka ọ bụ mkpughe e nyere Pọl.
- source_word: παρουσίαν
  choice: ọbịbịa
  rationale: N’ọnọdụ a nke ihe ga-eme n’ọdịnihu, okwu a na-ezo aka n’ọbịbịa Onyenweanyị; ‘ọbịbịa’ bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị.
- source_word: οἱ ζῶντες
  choice: anyị ndị dị ndụ
  rationale: Nke a na-edobe ụdị okwu Grik ahụ ma na-ada nke ọma n’Igbo.
- source_word: οἱ περιλειπόμενοι
  choice: ndị fọdụrụ
  rationale: Ọ na-akọwa ndị ka nọ ruo oge ahụ, n’etinyeghị echiche ọzọ nke ‘ịlanarị’ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: οὐ μὴ φθάσωμεν
  choice: agaghị ebute … ụzọ ma ọlị
  rationale: ‘Ma ọlị’ na-egosipụta nkwusi ike dị n’ụzọ Grik si jụ ya, ebe ‘ibute ụzọ’ na-egosi na ha agaghị aga ndị ahụ n’ihu.
- source_word: τοὺς κοιμηθέντας
  choice: ndị dara n’ụra
  rationale: Nke a na-edobe ihe atụ nke ihi ụra e ji kwuo banyere ndị nwụrụ anwụ, kama ịgbanwe ya ozugbo ka ọ bụrụ ‘ndị nwụrụ anwụ.’
- source_word: κύριος / κυρίου
  choice: Onyenweanyị
  rationale: N’amaokwu a, okwu a na-ezo aka na Jizọs ma gosipụta ọnọdụ ya dịka Onyenweanyị.
theological_decisions:
- issue: Ụdị ‘okwu Onyenweanyị’ Pọl na-adabere na ya
  choice: E debere okwu ahụ n’ụzọ na-egosi ikike Onyenweanyị ma na-ahapụ ụzọ o si ruo Pọl n’amaghị ama.
  alternative: Ikwupụta ya kpọmkwem dịka okwu Jizọs kwuru n’oge ozi ya n’ụwa, ma ọ bụ dịka mkpughe amụma e nyere Pọl.
  rationale: ἐν λόγῳ κυρίου anaghị akọwa kpọmkwem ụzọ e si nyefee okwu ahụ, ya mere nsụgharị ekwesịghị idozi ihe odide ahụ hapụrụ ghe oghe.
- issue: Ihe κοιμηθέντας pụtara
  choice: E debere ihe atụ nke ‘ịdaba n’ụra’ maka ndị kwere ekwe nwụrụ anwụ.
  alternative: Ịsụgharị ya ozugbo dịka ‘ndị nwụrụ anwụ.’
  rationale: Ihe atụ ahụ na-ejikọta ọnwụ na olileanya mbilite n’ọnwụ, ya mere idebe ya na-echekwa nghọta na ụda okwu Pọl.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Onyenweanyị’ na ‘ọbịbịa’ bụ okwu ndị nkịtị n’asụsụ Akwụkwọ Nsọ Igbo; ahịrịokwu ahụ na-edobe nkwusi ike na ihe atụ dị n’asụsụ Grik na-enweghị itinye nkọwa otu ụka pụrụ iche.
