source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: ig
  text: Ya mere[a], onye ọ bụla na-eleghara nke a anya anaghị eleghara mmadụ anya, kama ọ na-eleghara Chineke anya, onye na-enyekwa unu Mmụọ Nsọ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye ọ bụla na-ajụ nke a anaghị ajụ mmadụ, kama ọ na-ajụ Chineke.” Okwu Grik ahụ nwere ike ịpụta “ịjụ,” “ileghara anya,” ma ọ bụ “iwepụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “onye na-enyekwa Mmụọ Nsọ ya n’ime unu.” Preposition Grik ahụ pụtara n’ụzọ nkịtị “n’ime,” ọ bụ ezie na Igbo nkịtị na-ekwu “na-enye unu” n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere na ndụmọdụ e nyere n'amaokwu ndị bu ụzọ; “Ya mere” bụ okwu Igbo doro anya ma na-adịkwa n'okwu ugbu a.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: onye ọ bụla na-ajụ ... anaghị ajụ ... kama ọ na-ajụ
  rationale: Nkebiokwu nwere participle na-arụ ọrụ n'ozuzu ya, ya mere “onye ọ bụla” na-egosi na ọ bụghị naanị nwoke ka a na-ekwu maka ya. “Ịjụ” na-egosipụta ịjụ ma ọ bụ iwepụ ntụziaka nwere ikike; e depụtara ihe ndị ọzọ okwu ahụ pụrụ ịpụta n'okpuru ala.
- source_word: οὐκ ἄνθρωπον ... ἀλλὰ τὸν θεόν
  choice: anaghị ajụ mmadụ, kama ọ na-ajụ Chineke
  rationale: “Mmadụ” bụ aha izugbe n'ebe a, a na-etinyekwa ya n'ụzọ doro anya megide Chineke dịka Greek si mee.
- source_word: τὸν καὶ διδόντα
  choice: onye na-enyekwa
  rationale: A sụgharịrị participle dị ugbu a dịka nkebiokwu njikọ n'Igbo. “-kwa” na-anọchi anya καί ma na-ejikọta omume Chineke a na nkọwa gara aga.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: Mmụọ Nsọ ya
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka na Mmụọ Nsọ nke Chineke; nhazi okwu Igbo a bụ nke sitere n'okike ma na-echekwa njikọ nke “ya” na Chineke.
- source_word: εἰς ὑμᾶς
  choice: na-enye unu
  rationale: Ọ bụ ezie na εἰς na-enwekarị echiche nke “n'ime,” n'okwu a ya na δίδωμι, Igbo nkịtị na-asị “inye unu.” E chekwara nsụgharị nkịtị karịa n'okpuru ala ka a ghara ikpochapụ nghọtahie dị n'okwu Greek.
theological_decisions:
- issue: Ihe “Mmụọ Nsọ ya” na-ezo aka na ya
  choice: Okwu ahụ na-ezo aka na Mmụọ Nsọ nke Chineke na-enye ndị kwere ekwe.
  alternative: Mmụọ dị nsọ dịka onyinye ma ọ bụ àgwà na-enweghị ntụaka doro anya n'onwe ya.
  rationale: Nhazi Greek, τὸ πνεῦμα αὐτοῦ τὸ ἅγιον, n'ọnọdụ akwụkwọ Pọl a na-ezo aka n'ụzọ kwekọrọ ekwekọ na Mmụọ Nsọ. Nsụgharị ahụ anaghị agbakwunye nkọwa ozizi karịrị ihe ederede kwuru.
- issue: Ike izugbe nke ὁ ἀθετῶν
  choice: “onye ọ bụla na-ajụ”
  alternative: “onye ahụ na-ajụ” ma ọ bụ okwu nke nwere ike ịdị ka ọ bụ naanị nwoke ka a na-ekwu maka ya.
  rationale: Ụdị nwoke otu onye dị na Greek bụ nnọchiteanya izugbe, ọ bụghị mmachi nye ụmụ nwoke. “Onye ọ bụla” na-echekwa ike ahụ n'Igbo doro anya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ọdịiche siri ike dị n'etiti ịjụ mmadụ na ịjụ Chineke. E tinyere ụzọ ọzọ nke ἀθετέω na εἰς n'okpuru ala iji chekwaa oke nghọta nke Greek na-enweghị ime ka isi ederede sie ike.
