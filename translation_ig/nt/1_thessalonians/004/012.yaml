  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: ig
  text: ka unu wee na-ebi ndụ n’ụzọ kwesịrị ekwesị n’ebe ndị nọ n’èzí nọ, ghara inwe mkpa nke ihe ọ bụla[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu ghara inwe mkpa nke onye ọ bụla.” Okwu a nwere ike imesi ike na unu ekwesịghị ịdabere n’ebe ndị ọzọ nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ka unu wee
  rationale: Ọ na-egosi nzube ma ọ bụ ihe ga-esi n’ọdụmọdụ dị n’amaokwu bu ụzọ pụta; nke a bụ ụzọ Igbo dị mfe ma doo anya isi gosipụta ya.
- source_word: περιπατῆτε
  choice: na-ebi ndụ
  rationale: Ọ bụ ‘ije ije’ n’ụzọ nkịtị, ma n’ebe a ọ bụ ihe atụ Pọl ji ekwu banyere ụzọ mmadụ si ebi ndụ. ‘Na-ebi ndụ’ na-eme ka ihe ọ pụtara doo ndị na-agụ Igbo anya n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: εὐσχημόνως
  choice: n’ụzọ kwesịrị ekwesị
  rationale: Ọ na-egosi omume dabara adaba, nke a na-akwanyere ùgwù. Nhọrọ a bụ nke dị ugbu a ma ghara ime ka okwu ahụ sie ike karịa ka Grik siri kwuo ya.
- source_word: πρὸς τοὺς ἔξω
  choice: n’ihu ndị nọ n’èzí
  rationale: Ọ na-ekwu banyere omume ndị kwere ekwe n’ebe ndị na-abụghị akụkụ nke ọgbakọ ha nọ, karịchaa otú omume ahụ si apụta n’ihu ọha. ‘Ndị nọ n’èzí’ na-edobe ihe atụ nke Grik n’etinyeghị aha nkà mmụta okpukpe ọzọ.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: ka ihe ọ bụla ghara ịdị unu mkpa
  rationale: N’ụtọasụsụ na n’ọnọdụ okwu a, ọ kacha adaba ịghọta ya dị ka enweghị ihe dị mkpa a na-akọ ụkọ. Nhazi Igbo a bụ eke ma na-edobe obosara okwu ahụ.
theological_decisions:
- issue: Ihe nkebi ikpeazụ μηδενὸς χρείαν ἔχητε pụtara
  choice: ka ihe ọ bụla ghara ịdị unu mkpa
  alternative: ka unu ghara ịdị mkpa ịdabere n’onye ọ bụla
  rationale: Ihe ndị gbara amaokwu a gburugburu—ịrụ ọrụ aka na ilekọta ihe nke onwe—na-egosi izere ịdabere n’ụzọ na-ekwesịghị ekwesị n’ebe ndị ọzọ nọ. Ma Grik nwere ike izo aka n’ihe ma ọ bụ n’onye; ya mere, e debere nghọta nke abụọ n’okpuru ala kama idozi mgbagwoju anya ahụ kpamkpam.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A sụgharịrị ihe atụ ‘ije ije’ dị ka ‘ibi ndụ’ ka ọ bụrụ okwu Igbo eke; e debere ‘ndị nọ n’èzí’ iji ghara ịkpọ ha aha okpukpe nke Grik n’onwe ya na-ekwughị.
