translation:
  language: ig
  text: ọ bụghị n’agụụ nke ọchịchọ ọjọọ[a], dị nnọọ ka ndị mba ọzọ, bụ́ ndị na-amaghị Chineke[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’agụụ mmekọahụ na-achị mmadụ” ma ọ bụ “n’ọchịchọ mmekọahụ siri ike.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ndị mba ọzọ”; a pụkwara ịsụgharị ya “mba dị iche iche,” ma ọ bụ, n’ụzọ na-akọwakwu ihe, “ndị ọgọ mmụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: ọ bụghị n’ọchịchọ ọjọọ nke agụụ mmekọahụ
  rationale: Nkebiokwu a na-akọwa ụzọ a na-ekwesịghị isi chịkwaa ahụ mmadụ n’ihe gbasara mmekọahụ. “Ọchịchọ ọjọọ” na-egosi ike nke πάθος, ebe “agụụ mmekọahụ” na-eme ka ụdị ἐπιθυμία a na-ekwu maka ya doo anya n’ọnọdụ a.
- source_word: καθάπερ καὶ
  choice: dị nnọọ ka ... na-eme
  rationale: Nke a na-egosi ntụnyere nke Grik n'ụzọ Igbo na-aga were were; e tinyere “na-eme” iji mezue echiche omume nke amaokwu gara aga nke nkebiokwu a na-adabere na ya.
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’akwụkwọ Pọl, okwu a na-abụkarị ndị na-abụghị ndị Juu. “Ndị mba ọzọ” na-echekwa echiche ahụ n’Igbo n’etinyeghị okwu mkparị dị ka “ndị ọgọ mmụọ.”
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: bụ́ ndị na-amaghị Chineke
  rationale: Nke a na-asụgharị participle ahụ dịka nkebiokwu na-akọwa ndị ahụ, ma na-echekwa ọnọdụ na-aga n’ihu nke amaghị Chineke.
theological_decisions:
- issue: Ihe τὰ ἔθνη pụtara n’ebe a
  choice: ndị mba ọzọ
  alternative: mba dị iche iche; ndị ọgọ mmụọ
  rationale: “Ndị mba ọzọ” na-egosi ndị na-abụghị ndị Juu dịka okwu Pọl si arụkarị ọrụ, ma zere ịgbakwunye mkparị ma ọ bụ nkọwa okpukpe karịrị ihe ederede kwuru.
- issue: Ike nke πάθει ἐπιθυμίας
  choice: ọchịchọ ọjọọ nke agụụ mmekọahụ
  alternative: agụụ mmekọahụ na-achị mmadụ; ọchịchọ nke agụụ
  rationale: N’ọnọdụ ndụ mmekọahụ nke amaokwu ndị gbara ya gburugburu, okwu ahụ bụ ọchịchọ mmekọahụ na-adịghị n’usoro. Nsụgharị a na-edebe akụkụ abụọ nke nkebiokwu Grik ahụ n’ụzọ Igbo ga-aghọta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. Amaokwu a bụ ihe na-aga n’ihu site n’amaokwu 4, ya mere a hapụrụ ya dịka nkebiokwu na-amalite na “ọ bụghị.” E tinyere “na-eme” n’akụkụ ntụnyere ka okwu ahụ bụrụ Igbo ebumpụta ụwa n’enweghị mgbanwe n’echiche.
