    reason: lexical_alternative
  revision_rationale: The revision restores πάθος as the main term (“agụụ”) and expresses ἐπιθυμία as its qualifying genitive (“nke ọchịchọ ọjọọ”). “Ọjọọ” reflects the pejorative force of desire in this immediate sexual-ethics context without adding a separate Greek lexical item. The comparison and the non-God-knowing description remain intact, while the added finite verb is omitted to preserve the verse’s dependency on verse 4.
