  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: ig
  text: N’ihi na Chineke akpọghị anyị ka anyị bie ndụ adịghị ọcha[a], kama ka anyị bie ndụ nsọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘adịghị ọcha n’omume.’ Okwu Grik ahụ nwere ike ịpụta adịghị ọcha n’omume, karịchaa mmehie gbasara mmekọahụ n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘ime ka mmadụ dị nsọ.’ Okwu Grik ahụ nwere ike izo aka n’ịdị nsọ dịka ọnọdụ ma ọ bụ n’usoro ime ka mmadụ dị nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a bụ ihe mere e ji kwuo ndụmọdụ dị n’amaokwu ndị bu ya ụzọ.
- source_word: ἐκάλεσεν
  choice: akpọghị
  rationale: Oge aorist na-egosi ihe Chineke mere; ‘kpọọ’ na-edobekwa okwu nke ọkpụkpọ Chineke n’enweghị ịtinye nkọwa ozizi karịrị ihe amaokwu ahụ kwuru.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: ka anyị bie n’adịghị ọcha
  rationale: ἐπί ya na dative ebe a na-egosi ebumnuche ma ọ bụ ụdị ndụ; mgbakwunye ‘bie’ na-eme ka nke a doo anya n’Igbo, ebe ‘adịghị ọcha’ na-edobe ma echiche omume rụrụ arụ ma ụda asụsụ ịdị ọcha nke Akwụkwọ Nsọ.
- source_word: ἐν ἁγιασμῷ
  choice: ka anyị bie n’ịdị nsọ
  rationale: ἐν ἁγιασμῷ na-egosi ọnọdụ ma ọ bụ ụzọ ndụ megidere adịghị ọcha; ‘ịdị nsọ’ na-edobe nghọta nke ọnọdụ ịdị nsọ, ebe ndetu ala na-egosi na okwu Grik ahụ nwekwara ike ịpụta usoro ime ka mmadụ dị nsọ.
theological_decisions:
- issue: Ihe ‘ọkpụkpọ’ Chineke pụtara
  choice: E debere ya dị ka ọkpụkpọ Chineke n’ezie nke bụ ntọala ndụ dị nsọ.
  alternative: Ịkọwa ya naanị dị ka òkù izugbe, ma ọ bụ kpọmkwem dị ka ‘ọkpụkpọ na-arụpụta nzọpụta’ n’usoro ozizi pụrụ iche.
  rationale: Amaokwu ahụ na-ekwu na Chineke kpọrọ ndị kwere ekwe ka ha dịrị ndụ n’ịdị nsọ, ma ọ kọwaghị kpọmkwem otú ọkpụkpọ ahụ si arụ ọrụ; ya mere nsụgharị ahụ ezere itinye ozizi otu ụka.
- issue: ἁγιασμός dịka ọnọdụ ma ọ bụ usoro
  choice: ịdị nsọ
  alternative: ime ka mmadụ dị nsọ
  rationale: Ntụnyere ya na ἀκαθαρσία na-akwado nghọta nke ọnọdụ ma ọ bụ ụzọ ndụ dị nsọ, ma ndetu ala na-echekwa nghọta usoro nke okwu ahụ nwekwara ike ibu.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ka anyị bie’ mee ka mmekọrịta nke preposition ndị Grik na ụzọ ndụ doo anya n’Igbo, n’enweghị ịgbanwe isi echiche.
