revisions:
- from: N’ihi na Chineke akpọghị anyị ka anyị bie n’adịghị ọcha[a], kama ka anyị bie n’ịdị nsọ[b].
  to: N’ihi na Chineke akpọghị anyị ka anyị bie ndụ adịghị ọcha[a], kama ka anyị bie ndụ nsọ[b].
  rationale: The revision keeps the source's ethical contrast and the draft's valid explicit life-language while making the sentence more idiomatic. It also replaces an overly narrow lexical footnote with one that preserves the broader Pauline sense of ἀκαθαρσία, and clarifies the process sense of ἁγιασμός without doctrinal overstatement.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:44Z'
review_pass:
  verdict: revise
  source_fidelity: The main translation accurately conveys γάρ, God's past calling, and the contrast between ἐπὶ ἀκαθαρσίᾳ and ἐν ἁγιασμῷ. The explicating phrase “ka anyị bie” is compatible with the ethical-life context, though a slightly more idiomatic wording improves the Igbo expression of the contrast.
  naturalness: The wording is understandable Standard Igbo. “Bie ndụ adịghị ọcha / bie ndụ nsọ” is more natural and direct than repeating “bie n’…” with abstract nouns.
  terminology: “adịghị ọcha” and “ịdị nsọ” appropriately retain the moral/holiness contrast. Footnote a's proposed “omume rụrụ arụ” is too interpretively narrow and does not function well as a lexical alternative for ἀκαθαρσία, which has a broader moral-impurity sense. The sanctification alternative in footnote b should be phrased without adding an unnecessary first-person object.
  issues:
  - severity: medium
    issue: Footnote a gives “omume rụrụ arụ” as an alternative.
    rationale: This narrows ἀκαθαρσία to disgraceful conduct and can sound more condemnatory than the Greek term itself. A broader alternative such as “adịghị ọcha n’omume” preserves the contextual moral sense without over-specifying it.
  - severity: low
    issue: The phrase “bie n’adịghị ọcha ... bie n’ịdị nsọ” is less idiomatic than using “ndụ.”
    rationale: Using “bie ndụ adịghị ọcha ... bie ndụ nsọ” is clear, natural Standard Igbo and retains the supplied ethical-life implication of the Greek prepositional phrases.
  revised_text: N’ihi na Chineke akpọghị anyị ka anyị bie ndụ adịghị ọcha[a], kama ka anyị bie ndụ nsọ[b].
