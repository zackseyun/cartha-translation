  text: ὥστε παρακαλεῖτε ἀλλήλους ἐν τοῖς λόγοις τούτοις.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/018.yaml
  text: Therefore encourage one another with these words[a].
translation:
  language: ig
  text: Ya mere, jirinụ okwu ndị a gbaa ibe unu ume[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “jirinụ okwu ndị a kasienụ ibe unu obi.” Ngwaa Grik ahụ nwere ike ịpụta ịgba ume, ịkasi obi, ma ọ bụ ịdụ ọdụ; n’ebe a, ihe ndị gbara ya gburugburu na-akwado karịsịa nkasi obi na mmesi obi ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Njikọ a na-egosi nkwubi okwu sitere n’ozizi bu ụzọ banyere ọbịbịa Onyenwe anyị na mbilite n’ọnwụ nke ndị kwere ekwe.
- source_word: παρακαλεῖτε
  choice: na-agba ... ume
  rationale: Ngwaa a nwere ike ịpụta ịgba ume, ịkasi obi, ma ọ bụ ịdụ ọdụ. N’ebe a, ihe ndị bu ụzọ kwuru na-elekwasị anya n’inye ndị na-eru uju olileanya, ya mere ‘ịgba ume’ na-eburu echiche sara mbara ma gụnyekwa nkasi obi.
- source_word: ἀλλήλους
  choice: ibe unu
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe mgbe niile iji gosi na ndị niile a na-agwa okwu ga-emere ibe ha ihe ahụ.
- source_word: ἐν
  choice: jirinụ
  rationale: N’ebe a ἐν na-egosi ụzọ ma ọ bụ ihe e ji agba ume; ‘jirinụ’ na-enye echiche ahụ n’Igbo e ji ekwu okwu nke ọma.
- source_word: τοῖς λόγοις τούτοις
  choice: okwu ndị a
  rationale: Nke a na-ezo aka kpọmkwem n’ihe Pọl ka kwuchara, ma na-edobe ihe λόγοι pụtara n’ụzọ doro anya.
theological_decisions:
- issue: Ma παρακαλεῖτε pụtara ịgba ume, ịkasi obi, ka ọ bụ ịdụ ọdụ
  choice: ịgba ibe unu ume
  alternative: iji okwu ndị a na-akasi ibe unu obi
  rationale: Ọnọdụ okwu a na-akwado nkasi obi n’ihi nchegbu banyere ndị nwụrụ anwụ, ma ngwaa Grik ahụ sara mbara karịa naanị nkasi obi. Ya mere, e tinyere nhọrọ ọzọ n’ala ala peeji ka e wee ghara imechi nghọta abụọ ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma nwee ugwu. A họọrọ usoro ‘jirinụ ... na-agba’ iji mee ka ụzọ e si agba ume pụta ìhè, ma debe iwu ahụ dị ka nke a na-enye ọtụtụ mmadụ.
