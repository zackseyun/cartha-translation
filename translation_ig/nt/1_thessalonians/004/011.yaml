review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the three infinitives and the concluding appeal to prior apostolic instruction. However, “ka ọchịchọ unu bụrụ ibi ndụ” is grammatically and idiomatically strained in Standard Igbo, and it weakens the active force of φιλοτιμεῖσθαι (“make it your ambition / strive eagerly”).
  naturalness: The wording is generally clear and appropriately dignified, but recasting the opening as “ka unu mee ka ọ bụrụ ebumnobi unu” gives a natural Igbo construction while retaining the deliberate, paradoxical ambition to live quietly. “Iji aka unu arụ ọrụ” is more direct than “iji aka unu rụọ ọrụ.”
  terminology: “Ibi ndụ dị jụụ,” “ilekọta ihe nke unu,” and “anyị nyere unu iwu” appropriately render ἡσυχάζειν, πράσσειν τὰ ἴδια, and παρηγγείλαμεν. The terminology is non-sectarian and maintains the authoritative but ordinary register of the Greek.
  issues:
  - severity: medium
    issue: The opening expression is unnatural and insufficiently active.
    rationale: “Ka ọchịchọ unu bụrụ ibi ndụ...” is not a smooth Standard Igbo way to express φιλοτιμεῖσθαι with an infinitive. “Ka unu mee ka ọ bụrụ ebumnobi unu...” naturally expresses making something one’s aim or ambition.
  - severity: low
    issue: The instrumental phrase can be made more idiomatic.
    rationale: “Iji aka unu arụ ọrụ” directly expresses working with one’s own hands and preserves the possessive emphasis of ὑμῶν.
