  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: ig
  text: na ka unu mee ka ọ bụrụ ebumnobi unu ibi ndụ dị jụụ[a], ilekọta ihe nke unu[b], na iji aka unu arụ ọrụ, dịka anyị nyere unu iwu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu mee ka ọ bụrụ ebumnobi unu ịnọ jụụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ime ihe nke unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: ka ọchịchọ unu bụrụ
  rationale: Nke a na-egosi ime ihe ka ọ bụrụ ebumnobi a na-achọsi ike ma na-echekwa echiche pụrụ iche dị n’ime ịchọsi ibi ndụ dị jụụ ike.
- source_word: ἡσυχάζειν
  choice: ibi ndụ dị jụụ
  rationale: N’ebe a, okwu ahụ abụghị naanị ịghara ikwu okwu; ọ na-ezo aka n’ibi ndụ udo nke na-adịghị etinye aka n’ọgba aghara.
- source_word: πράσσειν τὰ ἴδια
  choice: ilekọta ihe gbasara unu
  rationale: 'Nke a bụ ụzọ Igbo si ekwu okwu ahụ n’ụzọ sitere n’okike: mmadụ ilekwasị anya n’ihe dịịrị ya, na-enweghị ụda okwu mkparị.'
- source_word: ἐργάζεσθαι ταῖς χερσὶν ὑμῶν
  choice: iji aka unu rụọ ọrụ
  rationale: Ọ na-egosi n'ụzọ doro anya na aka ha bụ ihe eji arụ ọrụ, ma na-echekwa nkwusiri ike nke nnọchiaha ὑμῶν.
- source_word: καθὼς
  choice: dịka
  rationale: Ọ na-ewebata ntụnyere n’etiti ndụ a gwara ha ibi na iwu ndịozi nyere ha na mbụ.
- source_word: παρηγγείλαμεν
  choice: anyị nyere unu n’iwu
  rationale: Nhọrọ a na-echekwa ikike na ịdị arọ nke ntụziaka ndịozi ahụ, kama ime ka ọ bụrụ naanị ndụmọdụ.
theological_decisions:
- issue: Ike iwu dị na ntụziaka ndịozi
  choice: anyị nyere unu n’iwu
  alternative: anyị kụziiri unu / anyị gwara unu
  rationale: παραγγέλλω nwere ike ịbụ ntụziaka e nyere n’ike. N’ebe a, nsụgharị ahụ na-echekwa ịdị arọ nke iwu omume Pọl nyere, n’etinyeghị ozizi ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-aga n’ihu site n’amaokwu bu ya ụzọ, ya mere e debere njikọ “na” ná mmalite. E chekwara ụda iwu ahụ n’enweghị okwu ụka pụrụ iche.
