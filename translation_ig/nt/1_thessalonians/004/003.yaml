source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: ig
  text: 'N’ihi na nke a bụ uche Chineke: ido unu nsọ[a]—ka unu zere omume mmekọahụ rụrụ arụ[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ịdị nsọ unu.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, porneia; okwu sara mbara maka omume mmekọahụ na-ekwesịghị ekwesị. N’ụzọ ọdịnala, “ịkwa iko.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: uche
  rationale: “Uche Chineke” bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ihe Chineke chọrọ ma nye iwu; ọ naghị eme ka okwu ahụ bụrụ naanị ọchịchọ na-adịghị ike ma ọ bụ nzube a kara aka.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: ido unu nsọ
  rationale: Nhọrọ a na-egosi ma ọrụ nke ịrara mmadụ nye Chineke ma ndụ ịdị nsọ nke na-esi na ya pụta. Ọ dịkwa mfe nghọta karịa okwu teknụzụ, ma na-ahapụ obosara ihe ἁγιασμός pụtara.
- source_word: ἀπέχεσθαι
  choice: ka unu zere
  rationale: Akụkụ a na-akọwapụta ihe ido ha nsọ gụnyere n’ọnọdụ a. “Ka unu zere” na-ebupụta ike nke infinitive ahụ n’Igbo dị ndụ ma doo anya.
- source_word: πορνείας
  choice: omume mmekọahụ rụrụ arụ
  rationale: πορνεία bụ okwu sara mbara maka omume mmekọahụ iwu Chineke na-akwadoghị; ntụgharị a anaghị akpa ya naanị n’otu ụdị mmehie mmekọahụ.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ndụmọdụ dị n’ihu ya site n’inye ihe kpatara ya ma ọ bụ ntọala ya.
theological_decisions:
- issue: Ihe ἁγιασμός pụtara n’ọdụmọdụ gbasara omume
  choice: “ido unu nsọ,” ebe nkebi na-esote kọwara ihe nke a gụnyere n’ihe gbasara omume
  alternative: “ịdị nsọ unu”
  rationale: Nhọrọ a na-echekwa ma echiche nke ịrara ndị kwere ekwe nye Chineke ma nke ibi ndụ kwekọrọ na nke ahụ, n’ebughị ụzọ kpebie na okwu ahụ bụ naanị ọnọdụ ma ọ bụ naanị usoro.
- issue: Obosara ihe πορνεία pụtara
  choice: “omume mmekọahụ rụrụ arụ”
  alternative: “ịkwa iko”
  rationale: Okwu Grik ahụ sara mbara karịa ịkwa iko n’otu nghọta kpọmkwem. Nhọrọ a na-ezere itinye ókè dị warara nke isi mmalite ahụ etinyeghị.
translation_notes:
  register: Standard Igbo dị ugbu a, kwanyere ùgwù ma dị mfe nghọta. E ji akara ogologo—gosipụta na nkebi “ka unu zere...” na-akọwapụta ihe “ido unu nsọ” gụnyere; e debere akara ntụaka ụkwụ niile n’isi ederede.
