reference: 1 Thessalonians 4:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: ig
  text: Mgbe ahụ, a ga-eburu anyị ndị dị ndụ, ndị fọdụrụ, elu n’ígwé ojii, n'otu oge anyị na ha[a], ka anyị zute Onyenwe anyị[b] n’ikuku; otu a ka anyị ga-anọnyere Onyenwe anyị mgbe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “a ga-adọpụta anyị elu.” Ngwaa Grik a na-egosi omume e ji ike mee na mberede.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “maka izute Onyenwe anyị.” Nkebiokwu a nwere ike ịpụta ịpụ gaa izute onye na-abịa, ma amaokwu a n'onwe ya akọwaghị usoro ihe ndị ọzọ ga-eso nzute a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπειτα
  choice: Mgbe ahụ
  rationale: Na-egosi ihe na-esote n'usoro mgbe mbilite n'ọnwụ nke ndị nwụrụ n'ime Kraịst e kwuru okwu ya n'amaokwu bu ụzọ.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: anyị ndị dị ndụ, ndị fọdụrụ
  rationale: Na-akọwapụta ndị kwere ekwe ka dị ndụ ma fọdụkwa ruo n'oge ahụ, n'enweghị echiche agbakwunyere na ha lanarịrị otu ihe ize ndụ.
- source_word: ἅμα σὺν αὐτοῖς
  choice: n'otu oge anyị na ha
  rationale: Na-echekwa ma echiche nke ime ihe n'otu oge ma nke ịnọnyere ndị a kpọlitere n'ọnwụ.
- source_word: ἁρπαγησόμεθα
  choice: a ga-eburu anyị ... rigoro
  rationale: Na-egosipụta ọdịdị passive na mmegharị elu nke ngwaa Grik ahụ n'Igbo dị mfe nghọta; ihe odide ala peeji na-egosi ike na mberede dị n'okwu ahụ.
- source_word: ἐν νεφέλαις
  choice: n'ígwé ojii
  rationale: Na-edobe ihe oyiyi a kpọmkwem dịka ọ dị na Grik, kama ịkọwa ya n'ụzọ ọzọ.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: ka anyị zute Onyenwe anyị
  rationale: Ọ bụ okwu Igbo dị n'usoro nke na-egosi ebumnuche mmegharị ahụ n'etinyeghị usoro ihe ndị ga-eme mgbe nzute ahụ gasịrị.
- source_word: εἰς ἀέρα
  choice: n'ikuku
  rationale: Na-egosi ebe nzute ahụ ga-adị n'Igbo e ji eme ihe kwa ụbọchị.
- source_word: καὶ οὕτως
  choice: otu a ka
  rationale: Na-egosi ụzọ ma ọ bụ nsonaazụ nke usoro ihe ndị a kọwara.
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: anyị ga-anọnyere Onyenwe anyị mgbe niile
  rationale: Na-echekwa nkwa ọdịnihu na ịdịgide adịgide nke ịnọnyere Onyenwe anyị.
theological_decisions:
- issue: Ntụgharị ἁρπαγησόμεθα n'amaokwu a na-ejikọkarị na arụmụka banyere “rapture”
  choice: a ga-eburu anyị ... rigoro
  alternative: a ga-apụnara anyị elu
  rationale: A họọrọ okwu na-egosi na ike sitere n'èzí ga-eburu ha elu, ma e tinyeghị ozizi otu chọọchị banyere oge ma ọ bụ usoro ihe omume ahụ.
- issue: Ihe εἰς ἀπάντησιν τοῦ κυρίου pụtara
  choice: ka anyị zute Onyenwe anyị
  alternative: maka nzute ha na Onyenwe anyị
  rationale: Ntụgharị a na-ekwu nzute ahụ n'ụzọ doro anya ma hapụ ihe ga-eso ya ka ọ bụrụ ihe amaokwu a na-akọwaghị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Onyenwe anyị” na-echekwa ike aha nsọpụrụ κύριος; a zere okwu pụrụ iche nke otu ụka ma ọ bụ usoro nkọwa banyere ọgwụgwụ ụwa.
