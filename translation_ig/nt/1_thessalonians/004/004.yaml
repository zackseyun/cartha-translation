id: 1TH.4.4
reference: 1 Thessalonians 4:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: ig
  text: ka onye ọ bụla n’ime unu mara otú ọ ga-esi nweta arịa nke aka ya[a] n’ịdị nsọ na nsọpụrụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “arịa nke aka ya” nwere ike ịpụta ahụ nke aka ya; ụfọdụ na-aghọta ya dị ka inweta nwunye nke aka ya.
    reason: Preserves the major interpretive ambiguity in σκεῦος and its relationship to κτᾶσθαι.
lexical_decisions:
- source_word: εἰδέναι
  choice: mara otú ọ ga-esi
  rationale: 'Infinitive with a practical sense: knowing how to act, naturally expressed in Igbo as knowing how one will do something.'
- source_word: ἕκαστον ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: Direct, inclusive rendering of “each of you.”
- source_word: τὸ ἑαυτοῦ σκεῦος
  choice: arịa nke aka ya
  rationale: Keeps the source metaphor “his own vessel” rather than deciding in the main text whether it means one’s body or one’s wife.
- source_word: κτᾶσθαι
  choice: nweta
  rationale: Reflects the verb’s acquisition sense (“acquire/obtain”), in keeping with the source wording and the audited consultation layer, while avoiding silently changing it to “control.”
- source_word: ἐν ἁγιασμῷ καὶ τιμῇ
  choice: n’ịdị nsọ na nsọpụrụ
  rationale: Natural Igbo that retains both sanctification/holiness and honor as the manner or sphere of the action.
theological_decisions:
- issue: Meaning of “his own vessel” (τὸ ἑαυτοῦ σκεῦος)
  choice: Retain the metaphor “arịa nke aka ya” in the text and explain the ambiguity in a footnote.
  alternative: Render explicitly as “ahụ nke aka ya” (his own body) or “nwunye nke aka ya” (his own wife).
  rationale: The Greek expression is disputed and can be understood in relation to one’s body or acquiring a wife. Choosing either explicitly would resolve genuine ambiguity not settled by the source wording.
- issue: Force of κτᾶσθαι
  choice: Render as “nweta” (acquire/obtain).
  alternative: Render as “jide onwe ya” or “chịkwaa” (control/possess).
  rationale: The middle infinitive commonly bears an acquisition sense. This preserves the lexical tension of the phrase, especially if “vessel” refers to a wife, without importing a particular doctrinal interpretation.
translation_notes:
  register: Standard Igbo; current, dignified, and accessible. The sentence remains a dependent clause because the supplied verse text itself continues the syntax of the preceding verse. The literal metaphor is retained only where needed to preserve source ambiguity, with the footnote providing ordinary-language clarification.
source_grounding:
