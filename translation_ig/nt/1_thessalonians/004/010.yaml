    text: “Ụmụnna” n’ebe a na-ezo aka n’ebe ndị kwere ekwe ibe ha nọ, ma o yikarịrị ka ọ gụnyere ma ndị nwoke ma ndị nwanyị nọ n’ọgbakọ ndị ahụ.
    reason: lexical_alternative
