  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: ig
  text: N’ihi na n’ezie, unu na-eme nke a n’ebe ụmụnna niile nọ na Masedonia dum. Ma anyị na-arịọ unu, ụmụnna,[a] ka unu na-emekwu nke a karị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” n’ebe a na-ezo aka n’ebe ndị kwere ekwe ibe ha nọ, ma o yikarịrị ka ọ gụnyere ma ndị nwoke ma ndị nwanyị nọ n’ọgbakọ ndị ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na, n’ezie
  rationale: Nke a na-egosipụta ma njikọ nkọwa nke γάρ ma nkwusi ike nke καί, n’Igbo dị mfe ma kwesị ekwesị.
- source_word: ποιεῖτε αὐτὸ
  choice: unu na-emere ... nke a
  rationale: Ụdị ‘na-eme’ na-egosi omume na-aga n’ihu; ‘nke a’ na-ezo azụ n’ịhụnanya ụmụnna a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: ụmụnna niile
  rationale: ‘Ụmụnna’ bụ okwu Igbo sitere n’okike nke na-ezo aka n’ezinụlọ ma nwee ike ịgụnye ndị kwere ekwe nwoke na nwanyị; ngwaa ‘na-emere’ na-eburu echiche omume e duziri n’ebe ha nọ.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: ndị nọ na Masedonia dum
  rationale: Nke a na-edobe ebe ndị ahụ nọ na echiche nke ógbè ahụ dum n'ụzọ Igbo na-ada nke ọma.
- source_word: παρακαλοῦμεν δὲ ὑμᾶς
  choice: Ma anyị na-arịọ unu
  rationale: ‘Na-arịọ’ na-egosipụta agbamume siri ike ma dị nro nke παρακαλέω; ‘Ma’ na-egosipụta mgbanwe dị nro nke δέ site n’otuto gaa n’agbamume ọzọ.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: Okwu a na-edobe ihe oyiyi nke njikọ ezinụlọ n’etiti ndị kwere ekwe, ma n’Igbo ọ pụghị naanị ndị nwoke.
- source_word: περισσεύειν μᾶλλον
  choice: ka unu na-emekwu ya karịa
  rationale: Nke a na-egosi mmụba gafere ogo ha nọ na ya ugbu a, na-ejikọkwa agbamume ahụ n’ụzọ doro anya na omume ịhụnanya e kwuru maka ya.
theological_decisions:
- issue: Ma ἀδελφοί/ἀδελφούς ọ na-ezo naanị n’ebe ndị nwoke nọ ka ọ bụ n’ebe ọgbakọ ndị kwere ekwe niile nọ
  choice: ụmụnna
  alternative: ụmụnna nwoke na nwanyị; ndị kwere ekwe ibe unu
  rationale: N’Igbo, ‘ụmụnna’ na-echekwa ihe oyiyi ezinụlọ nke okwu Grik ahụ ma nwee ike ịgụnye nwoke na nwanyị. Ihe odide gbara ya gburugburu na-egosi ndị kwere ekwe niile, ma a kọwara nke a n’ala peeji n’enweghị itinye nkọwa ogologo n’ahịrị bụ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. A họọrọ ‘ụmụnna’ iji chekwaa asụsụ ezinụlọ nke Grik n’enweghị ime ka ọ bụrụ naanị ndị nwoke. Akara ala peeji [a] dị n’ahịrị bụ isi dịka achọrọ.
