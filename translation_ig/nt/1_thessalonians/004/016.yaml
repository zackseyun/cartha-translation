id: 1TH.4.16
reference: 1 Thessalonians 4:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: ig
  text: N’ihi na Onyenwe anyị n’onwe ya ga-eji mkpu na-enye iwu[a], jiri olu onyeisi ndị mmụọ ozi, jirikwa opi Chineke si n’eluigwe rịdata, ndị nwụrụ anwụ n’ime Mesaịa ga-ebu ụzọ bilie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “iwu” ma ọ bụ “oku iwu.” Okwu Grik bụ κέλευσμα nwere ike ịpụta ọkpụkpọ ma ọ bụ mkpu e ji enye iwu.
    reason: lexical_alternative
  - marker: b
    text: 'Nsụgharị ọdịnala bụ: “ndị nwụrụ anwụ n’ime Kraịst ga-ebu ụzọ bilie.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ebe a, njikọ a na-akọwa ihe mere e ji nwee nkasi obi e kwuru n’amaokwu gara aga; “N’ihi na” na-egosipụta ọrụ nkọwa ahụ n’Igbo nkịtị.
- source_word: αὐτὸς ὁ κύριος
  choice: Onyenwe anyị n’onwe ya
  rationale: “N’onwe ya” na-echekwa nkwusi ike dị na αὐτός, ebe “Onyenwe anyị” bụ ụzọ Igbo a na-aghọta nke ọma si akpọ κύριος n’ebe a.
- source_word: ἐν κελεύσματι
  choice: ga-eji iwu
  rationale: κέλευσμα pụtara iwu ma ọ bụ ọkpụkpọ nwere ikike. “Iwu” dị nkenke ma kwesị ntụkwasị obi; e debere echiche nke iti mkpu iwu n’ala peeji.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: jiri olu onyeisi ndị mmụọ ozi
  rationale: Nke a na-egosipụta φωνή dịka “olu” na ἀρχάγγελος dịka onyeisi ndị mmụọ ozi, na-enweghị ịmanye echiche na ọ bụ otu onye a kpọrọ aha kpọmkwem.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: jirikwa opi Chineke
  rationale: “Opi” bụ okwu Igbo doro anya maka σάλπιγξ, ebe “Chineke” na-echekwa genitive θεοῦ.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: si n’eluigwe rịdata
  rationale: “Rịdata” na-egosipụta mmegharị si n’elu gaa n’ala nke καταβαίνω, “si n’eluigwe” echekwakwa ebe o si bịa.
- source_word: οἱ νεκροὶ
  choice: ndị nwụrụ anwụ
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo adjective a ji dịka aha mmadụ.
- source_word: ἐν Χριστῷ
  choice: n’ime Mesaịa
  rationale: Χριστός na-arụ ọrụ dịka utu aha nke Onye E Tere Mmanụ; “Mesaịa” na-echekwa ọrụ utu aha ahụ, ebe “n’ime” na-edobe njikọ dị na ἐν n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: ἀναστήσονται πρῶτον
  choice: ga-ebu ụzọ bilie
  rationale: “Bilie” na-egosipụta mbilite n’ọnwụ n’enweghị itinye passive na-adịghị n’ụdị Grik ahụ; “ga-ebu ụzọ” na-egosipụta usoro nke πρῶτον.
theological_decisions:
- issue: Nsụgharị Χριστῷ n’okwu ἐν Χριστῷ
  choice: n’ime Mesaịa
  alternative: n’ime Kraịst
  rationale: Okwu ahụ bụ utu aha n’ebe a, ya mere “Mesaịa” na-eme ka ihe ọ pụtara pụta ìhè. E debere “Kraịst,” nke ọtụtụ ndị maara nke ọma, dịka nsụgharị ọdịnala n’ala peeji.
- issue: Onye na-eti mkpu ma ọ bụ onye nwe olu ahụ
  choice: E kwughị kpọmkwem na ọ bụ Onyenwe anyị ma ọ bụ onyeisi ndị mmụọ ozi na-enye iwu ahụ
  alternative: Ịkọwa na Onyenwe anyị ji olu onyeisi ndị mmụọ ozi tie mkpu
  rationale: Usoro ahịrịokwu Grik depụtara iwu, olu onyeisi ndị mmụọ ozi, na opi Chineke n’akụkụ ibe ha ma hapụ njikọ ha n’ụzọ nwere nghọta karịrị otu; nsụgharị ahụ anaghị edozi ihe odide ahụ hapụrụ oghe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ihe atọ—iwu, olu onyeisi ndị mmụọ ozi, na opi Chineke—ma zere ịkọwapụta onye na-enye nke ọ bụla ebe Grik n’onwe ya ekwughị ya kpọmkwem.
