revisions:
- from: N’ihi na Onyenwe anyị n’onwe ya ga-eji iwu[a], jiri olu onyeisi ndị mmụọ ozi, jirikwa opi Chineke si n’eluigwe rịdata; ndị nwụrụ anwụ n’ime Mesaịa ga-ebu ụzọ bilie[b].
  to: N’ihi na Onyenwe anyị n’onwe ya ga-eji mkpu na-enye iwu[a], jiri olu onyeisi ndị mmụọ ozi, jirikwa opi Chineke si n’eluigwe rịdata, ndị nwụrụ anwụ n’ime Mesaịa ga-ebu ụzọ bilie[b].
  rationale: The only substantive correction replaces an instrumental expression that can suggest obedience to an order with a natural expression for a commanding cry. This better represents κέλευσμα and keeps the source’s threefold sequence and its lack of explicit identification of the speaker of each sound.
