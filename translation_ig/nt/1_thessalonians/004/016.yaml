review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the emphatic subject, the three accompanying elements, descent from heaven, and the sequence in which the dead in Messiah rise first. However, “ga-eji iwu” normally conveys acting by authority of a law or command, rather than the audible summons/commanding cry denoted by κέλευσμα in this context. A wording that identifies it as a commanding cry is more faithful.
  naturalness: The principal revision makes the first accompanying element idiomatic and clear in modern Standard Igbo while retaining the elevated register. The coordinated instrumental phrases and final resurrection clause remain natural.
  terminology: “Onyenwe anyị,” “onyeisi ndị mmụọ ozi,” “opi Chineke,” and “Mesaịa” are appropriate. “Mesaịa” retains Χριστός as a title; the familiar traditional “Kraịst” remains properly supplied in the footnote. The archangel phrase remains indefinite and does not identify a particular archangel.
  issues:
  - severity: medium
    issue: “ga-eji iwu” for ἐν κελεύσματι
    rationale: In Standard Igbo, “iji iwu” most readily means to act by means of, or under, an order/law. κέλευσμα here is a summons or commanding cry accompanying the descent. “mkpu na-enye iwu” conveys that event-like, audible sense without asserting more than the Greek states.
  revised_text: N’ihi na Onyenwe anyị n’onwe ya ga-eji mkpu na-enye iwu[a], jiri olu onyeisi ndị mmụọ ozi, jirikwa opi Chineke si n’eluigwe rịdata, ndị nwụrụ anwụ n’ime Mesaịa ga-ebu ụzọ bilie[b].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “iwu” ma ọ bụ “oku iwu.” Okwu Grik bụ κέλευσμα nwere ike ịpụta ọkpụkpọ ma ọ bụ mkpu e ji enye iwu.
    reason: lexical_alternative
  - marker: b
    text: 'Nsụgharị ọdịnala bụ: “ndị nwụrụ anwụ n’ime Kraịst ga-ebu ụzọ bilie.”'
    reason: alternative_reading
  revision_rationale: The only substantive correction replaces an instrumental expression that can suggest obedience to an order with a natural expression for a commanding cry. This better represents κέλευσμα and keeps the source’s threefold sequence and its lack of explicit identification of the speaker of each sound.
