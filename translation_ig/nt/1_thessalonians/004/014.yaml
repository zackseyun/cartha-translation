id: 1TH.4.14
reference: 1 Thessalonians 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: ig
  text: N’ihi na, ọ bụrụ na anyị kwere na Jizọs nwụrụ ma bilie ọzọ, otu ahụkwa Chineke ga-akpọta ndị dara n’ụra[a] site na Jizọs[b] soro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nwụrụ anwụ.” N’ebe a, Pọl ji “ịda n’ụra” mee ihe atụ maka ọnwụ ndị kwere ekwe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị dara n’ụra n’ime Jizọs.” A pụrụ ịghọta “site na Jizọs” (διὰ τοῦ Ἰησοῦ) n’ụzọ dị iche iche, dịka site n’aka Jizọs ma ọ bụ dịka njikọ chiri anya ha na Jizọs nwere.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: Ọ na-egosipụta ma γάρ nke na-enye ihe mere e ji kwuo okwu bu ụzọ, ma εἰ nke na-etinye ọnọdụ; ọ bụkwa usoro okwu Igbo doro anya.
- source_word: πιστεύομεν
  choice: anyị kwere
  rationale: Ọ na-egosipụta nkwenye nke ndị Kraịst niile banyere ọnwụ na mbilite n’ọnwụ Jizọs.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Ọ bụ nsụgharị aha a a na-ejikarị eme ihe n’Igbo Izugbe.
- source_word: ἀπέθανεν καὶ ἀνέστη
  choice: nwụrụ ma bilie ọzọ
  rationale: Ọ na-edobe omume abụọ ahụ dịka ihe mere eme, na-enweghị ime ἀνέστη ka ọ bụrụ okwu nnara.
- source_word: οὕτως καὶ
  choice: otu ahụkwa
  rationale: Ọ na-ejikọta mbilite n’ọnwụ Jizọs na ihe Chineke ga-emere ndị nwụrụ anwụ, ma ọ naghị akọwakarị otú njikọ ahụ si arụ ọrụ.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ okwu Igbo Izugbe a na-eji akọwa θεός ebe a.
- source_word: τοὺς κοιμηθέντας
  choice: ndị dara n’ụra
  rationale: Ọ na-edobe ihe atụ Pọl ji ụra kọwaa ọnwụ, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ‘ndị nwụrụ anwụ.’
- source_word: διὰ τοῦ Ἰησοῦ
  choice: site n’aka Jizọs
  rationale: Ọ na-egosipụta ụzọ ma ọ bụ onye e si n’aka ya mee ihe, bụ isi nghọta nke διά na genitive, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ.
- source_word: ἄξει σὺν αὐτῷ
  choice: ga-esi kpọta ... ka ha na ya nọrọ
  rationale: ‘Kpọta’ na-egosipụta ἄξει, ebe ‘ka ha na ya nọrọ’ na-egosipụta iso ya nke σύν; nhazi a bụ Igbo na-aga were were ma na-edobe Jizọs dịka onye ‘ya’ na-ezo aka na ya.
theological_decisions:
- issue: Ihe atụ ọnwụ dị na κοιμηθέντας
  choice: E debere ‘ndị dara n’ụra’ n’ahịrịokwu ahụ.
  alternative: ndị nwụrụ anwụ
  rationale: Ihe atụ ahụ dị mkpa n’okwu nkasi obi Pọl banyere ọnwụ ndị kwere ekwe na olileanya mbilite n’ọnwụ; nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
- issue: Nghọta nke διὰ τοῦ Ἰησοῦ
  choice: site n’aka Jizọs
  alternative: n’ime Jizọs; n’ihi Jizọs
  rationale: Nkebiokwu Grik ahụ nwere ike igosi onye e si n’aka ya mee ihe, njikọ chiri anya na Jizọs, ma ọ bụ ihe kpatara ya. Isi ahịrịokwu na-ahọrọ nghọta nkịtị nke διά na genitive, ebe nkọwa ala peeji na-echekwa mgbagwoju anya ahụ.
- issue: Onye αὐτῷ na-ezo aka na ya
  choice: E debere ya dịka ‘ya,’ nke na-ezo aka n’ebe Jizọs nọ n’okwu a.
  alternative: ịkpọ aha Jizọs ọzọ n’ụzọ doro anya
  rationale: Nnọchiaha ahụ na-edobe usoro Grik ma na-ekwe ka onye na-agụ ya ghọta na ọ na-ezo aka na Jizọs site n’ihe gbara ya gburugburu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ‘ịda n’ụra,’ ma jiri nkọwa ala peeji kọwaa ya. A haziri ‘ἄξει σὺν αὐτῷ’ dịka ‘ga-esi kpọta ... ka ha na ya nọrọ’ ka ahịrịokwu ahụ bụrụ nke e ji ọnụ ekwu n’ụzọ ebumpụta ụwa n’Igbo, na-enweghị iwepụ echiche nke iso Jizọs.
