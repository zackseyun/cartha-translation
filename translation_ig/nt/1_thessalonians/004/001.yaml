id: 1TH.4.1
reference: 1 Thessalonians 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: ig
  text: N’ikpeazụ, ya mere, ụmụnna[a], anyị na-arịọ unu ma na-agbakwa unu ume n’ime Onyenwe anyị Jizọs ka, dịka unu natara n’aka anyị ntụziaka banyere otú unu kwesịrị isi bie ndụ ma mee ihe na-atọ Chineke ụtọ—dịka unu na-emekwa—unu na-akawanye mma karịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ pụtara “ụmụnne nwoke,” ma a na-ejikarị ụdị ọtụtụ nke nwoke akọwa ìgwè gụnyere ma ndị nwoke ma ndị nwanyị. N’ebe a, “ụmụnna” gụnyere ha niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: N'ikpeazụ, ya mere
  rationale: Na-egosi ntụgharị gaa n'ịdọ aka ná ntị nke na-esote, ma na-edobe ma echiche λοιπὸν ma nke οὖν.
- source_word: ἀδελφοί
  choice: ụmụnna[a]
  rationale: “Ụmụnna” bụ okwu Igbo e ji akpọ ndị otu ezinụlọ ma ọ bụ obodo okwukwe; n'ebe a ọ gụnyere ndị nwoke na ndị nwanyị, dị ka ihe odide gbara ya gburugburu si gosi.
- source_word: ἐρωτῶμεν ... καὶ παρακαλοῦμεν
  choice: anyị na-arịọ unu ma na-agbakwa unu ume
  rationale: Na-edobe arịrịọ dị nro nke ἐρωτῶμεν na ike nke ndụmọdụ/ịgba ume dị na παρακαλοῦμεν.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: n'ime Onyenwe anyị Jizọs
  rationale: Na-edobe ἐν dịka “n'ime,” ebe “Onyenwe anyị” na-egosipụta κύριος dịka utu aha Jizọs.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: otú unu si nata n'aka anyị
  rationale: “Nata” na-edobe echiche nke ịnata ozizi ma ọ bụ ntụziaka sitere n'aka ndị ozi.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: unu kwesịrị isi na-ebi ndụ
  rationale: N'Igbo, “ibi ndụ” na-ebute ihe atụ Pọl ji “ije ije” kwuo banyere omume mmadụ n'ụzọ doro anya ma dịkwa eke.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: ma na-eme ihe na-atọ Chineke ụtọ
  rationale: Nke a bụ ụzọ Igbo dị eke isi kwuo ime ihe na-amasị Chineke.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: dị nnọọ ka unu si na-ebi ugbu a
  rationale: Na-ekweta na ha amalitelarị ibi otú ahụ; “ugbu a” na-eme ka ọnọdụ nke ngwaa ugbu a pụta ìhè n'Igbo.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: ka unu na-eme nke a karịa
  rationale: Na-egosipụta oku ka ha bawanye n'omume ahụ karịa ọkwa ha nọ ugbu a, n'Igbo dị mfe ma kwekọọ n'okwu gbara ya gburugburu.
theological_decisions:
- issue: Ndị ἀδελφοί na-ezo aka na ha
  choice: ụmụnna n'ahịrị isi, tinyere nkọwa ala peeji
  alternative: ụmụnne nwoke na ụmụnne nwanyị
  rationale: Ụdị Grik bụ ọtụtụ nke nwoke, ma o yikarịrị ka ọ na-akpọ nzukọ niile. “Ụmụnna” bụ okwu Igbo sara mbara; nkọwa ala peeji na-eme ka nsonye ụmụ nwanyị doo anya n'emeghị ka okwu Grik ghọọ ihe ọzọ.
- issue: κύριος dịka utu aha Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-edobe ịdị arọ nke utu aha Kraịst a, ọ dịghịkwa eme ka ọ bụrụ naanị onyeisi mmadụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu na nke ndị mmadụ taa na-aghọta. A tụgharịrị ihe atụ “ije ije” dịka “ibi ndụ” maka nghọta eke, ebe e debere nhazi arịrịọ, nkwenye banyere omume ha ugbu a, na oku ka ha bawanye na ya.
