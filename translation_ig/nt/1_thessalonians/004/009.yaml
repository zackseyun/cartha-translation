reference: 1 Thessalonians 4:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: ig
  text: Ma banyere ịhụnanya dị n’etiti ụmụnna[a], ọ dịghị mkpa ka e deere unu akwụkwọ[b], n’ihi na unu onwe unu bụ ndị Chineke kụziiri ka unu na-ahụ ibe unu n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịhụnanya n’ebe ụmụnna ndị kwere ekwe nọ.” Okwu Grik a ji oyiyi ezinụlọ kọwaa ịhụnanya dị n’etiti ndị Kraịst, ma ụmụ nwoke ma ụmụ nwanyị.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, e kwughị onye ga-ede akwụkwọ ahụ kpọmkwem; ihe ndị gbara amaokwu a gburugburu nwere ike na-ezo aka na Pọl na ndị ya na ha zitere akwụkwọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Ma banyere
  rationale: “Ma” na-egosipụta njikọ dị nro na mgbanwe isiokwu nke δὲ, ebe “banyere” na-asụgharị Περὶ n’ụzọ Igbo dị mfe ma kwesị ekwesị.
- source_word: φιλαδελφίας
  choice: ịhụnanya dị n’etiti ụmụnna
  rationale: Nhọrọ a na-echekwa oyiyi ezinụlọ dị n’okwu Grik ahụ ma na-egosi ịhụnanya dị n’etiti ndị otu ọgbakọ. Ihe e dere n’ala ala peeji kọwara na “ụmụnna” gụnyere ụmụ nwoke na ụmụ nwanyị kwere ekwe.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: ọ dịghị mkpa ka e deere unu akwụkwọ
  rationale: Mkpọaha “e” nke Igbo na-eme ka ahịrịokwu ahụ bụrụ nke mmadụ na-ekwukarị, ma ọ naghị ekpebi onye ga-ede akwụkwọ ebe Grik na-akpọghị onye ahụ aha.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: n’ihi na unu onwe unu
  rationale: “Unu onwe unu” na-echekwa nkwusi ike nke nnọchiaha abụọ dị na Grik; “n’ihi na” na-egosipụta ihe kpatara okwu ahụ.
- source_word: θεοδίδακτοί
  choice: bụ ndị Chineke kụziiri
  rationale: Nke a na-egosipụta nke ọma na Chineke bụ onye na-akụzi, ma na-ada ka Igbo nke oge a karịa ịmepụta otu okwu ọhụrụ maka njirimara Grik a na-adịghị ahụkarị.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: ka unu na-ahụ ibe unu n’anya
  rationale: Nhọrọ a bụ Igbo ebumpụta ụwa maka ịhụrịta onwe ha n’anya, ma na-egosipụta ebumnuche ma ọ bụ ihe nkuzi Chineke na-arụpụta.
theological_decisions:
- issue: Ọdịiche dị n’etiti φιλαδελφία na ἀγαπᾶν n’otu amaokwu ahụ
  choice: A sụgharịrị φιλαδελφία dị ka “ịhụnanya dị n’etiti ụmụnna,” ma sụgharịa ἀγαπᾶν dị ka “ịhụ ibe unu n’anya.”
  alternative: Iji otu ahịrịokwu ahụ, “ịhụnanya,” mee ha abụọ n’enweghị nkọwa oyiyi ezinụlọ.
  rationale: Nhọrọ a na-echekwa okwu ezinụlọ pụrụ iche nke φιλαδελφία ma hapụkwa ngwaa sara mbara nke ἀγαπᾶν ka ọ pụta ìhè, n’etinyeghị nkọwa ụka pụrụ iche.
- issue: Onye a na-eche na ọ bụ ya ga-ede n’okwu γράφειν
  choice: 'E ji mkpọaha mmadụ na-akọwaghị “e” mee ya: “ka e deere unu akwụkwọ.”'
  alternative: “Ka anyị deere unu akwụkwọ.”
  rationale: Grik ekwughị onye bụ isi nke ngwaa a kpọmkwem. Ọ bụ ezie na Pọl na ndị ya na ha zitere akwụkwọ nwere ike ịbụ ndị a na-eche, Igbo nwere ike idowe enweghị nkọwa ahụ n’ụzọ dị mma.
- issue: Ụdị ọrụ Chineke n’okwu θεοδίδακτοί
  choice: “Unu onwe unu bụ ndị Chineke kụziiri.”
  alternative: “Unu mụtara n’onwe unu ihe banyere Chineke.”
  rationale: θεοδίδακτοί na-egosi na Chineke bụ onye na-akụzi, ọ bụghị naanị na ihe a mụtara bụ ihe gbasara Chineke. Ya mere, ntụgharị ahụ na-echekwa ọrụ Chineke n’enweghị ịkọwa otú o si kụziere ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. “Ụmụnna” na-echekwa oyiyi ezinụlọ nke isi mmalite, ebe nkọwa [a] na-eme ka nghọta gụnyere nwoke na nwanyị doo anya. Mkpọaha “e” na [b] na-echekwa enweghị aha onye na-ede nke dị na Grik.
