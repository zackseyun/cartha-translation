translation:
  language: ig
  text: ndị gbukwara Onyenwe anyị Jizọs na ndị amụma[a], chụpụkwara anyị[b], ndị na-adịghị atọ Chineke ụtọ, ndị na-emegidekwa mmadụ niile[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “tinye Onyenwe anyị Jizọs n’ọnwụ.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ha “chụpụrụ anyị” ma ọ bụ “chụpụ anyị”; ngwaa Grik a kapịrị ọnụ karịa echiche sara mbara nke mkpagbu.
    reason: lexical_alternative
  - marker: c
    text: N’usoro ụtọasụsụ, nkọwa a na-aga n’ihu ikwu banyere otu ndị a kpọtụrụ aha n’amaokwu gara aga; e kwesịghị ịghọta ya dịka okwu metụtara ndị Juu niile n’oge na n’ebe niile.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: gbukwara
  rationale: “Igbu” na-egosipụta igbu mmadụ n’enweghị ịtinye echiche ọzọ banyere ebumnobi; mgbakwunye “-kwara” na-egosipụta καί nke mbụ.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Aha nsọpụrụ a bụ ụzọ Igbo a na-ejikarị akọwa κύριος dịka aha Kraịst.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: Aha mmadụ ahụ ka e dere n’ụdị mkpụrụokwu Igbo a na-ejikarị.
- source_word: τοὺς προφήτας
  choice: ndị amụma
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-ekwuchitere Chineke; ọ na-ezo aka n’usoro ndị amụma a maara.
- source_word: ἐκδιωξάντων
  choice: chụpụkwa anyị
  rationale: “Ịchụpụ” na-echekwa echiche kpọmkwem nke ịchụ mmadụ ka ọ pụọ, karịa okwu sara mbara dịka “ịkpagbu.”
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: ndị na-adịghị eme ihe na-atọ Chineke ụtọ
  rationale: Nkebiokwu a bụ Igbo eke nke na-egosipụta ọnọdụ na-aga n’ihu nke ịghara ime ihe na-atọ Chineke ụtọ.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: ndị na-emegidekwa mmadụ niile
  rationale: “Na-emegide” na-ebuga echiche nke mmegide n’enweghị ịgbakwunye oke iwe nke nwere ike ịdị n’okwu dịka “ịkpọ mmadụ asị.”
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: ndị ... gbukwara ... chụpụkwa ... ndị na-adịghị ... ndị na-emegidekwa
  rationale: Usoro nkebiokwu ndị a na-aga n’ihu ịkọwa ndị a kpọtụrụ aha n’amaokwu gara aga, ma na-anọgidekwa bụrụ otu ahịrịokwu n’Igbo.
theological_decisions:
- issue: Ndị nkọwa a na-ezo aka na ha
  choice: E debere ya dịka nkọwa na-aga n’ihu banyere otu ndị a kpọtụrụ aha n’amaokwu 14.
  alternative: Ịghọta ya dịka ikpe a mara ndị Juu niile n’oge niile na n’ebe niile.
  rationale: Ụtọasụsụ Grik, karịsịa τῶν na usoro participle ndị so ya, jikọtara nkọwa a na ndị e kwuru okwu ha n’amaokwu gara aga; nsụgharị ahụ anaghị agbasa ya karịa ndị e zoro aka na ha n’akụkụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro ebubo ndị ahụ n’ụdị na-aga n’ihu, a hapụkwara kọma ikpeazụ iji gosi na amaokwu a ka jikọtara na amaokwu na-esote.
