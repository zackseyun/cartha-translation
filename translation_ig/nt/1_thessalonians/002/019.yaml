revisions:
- from: N’ihi na gịnị bụ olileanya anyị, ma ọ bụ ọṅụ anyị, ma ọ bụ okpueze anyị ji anya isi—ọ́ bụghị unu n’ezie?—n’ihu Onyenwe anyị Jizọs mgbe ọ ga-abịa[a]?
  to: N’ihi na, gịnị ka bụ olileanya anyị, ma ọ bụ ọṅụ anyị, ma ọ bụ okpueze ịnya isi anyị—ọ́ bụghịkwa unu?—n’ihu Onyenwe anyị Jizọs n’oge ọbịbịa ya[a]?
  rationale: The revision corrects the invalid “presence” alternative in the footnote, uses -kwa to retain the force of καί, and expresses ἐν τῇ αὐτοῦ παρουσίᾳ naturally as “n’oge ọbịbịa ya.” No doctrinal interpretation has been added.
