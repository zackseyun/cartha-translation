id: 1TH.2.19
reference: 1 Thessalonians 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: ig
  text: N’ihi na, gịnị ka bụ olileanya anyị, ma ọ bụ ọṅụ anyị, ma ọ bụ okpueze ịnya isi anyị—ọ́ bụghịkwa unu?—n’ihu Onyenwe anyị Jizọs n’oge ọbịbịa ya[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ọnụnọ ya” ma ọ bụ “mgbe ọ ga-abịa.” Okwu Grik παρουσία pụrụ ịpụta ọnụnọ ma ọ bụ ọbịbịa; n’ebe a, ọ na-ezo aka n’ọbịbịa Onyenwe anyị Jizọs n’ọdịnihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: gịnị
  rationale: Ọ bụ ezie na okwu Grik a pụrụ ịpụta ‘onye’ ma ọ bụ ‘gịnị,’ aha ndị na-esochi ya—olileanya, ọṅụ, na okpueze—mere ka ‘gịnị’ bụrụ nsụgharị Igbo kacha kwekọọ na usoro ajụjụ ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: E debere njikọ nkọwa ya na ihe e kwuru n’amaokwu ndị bu ụzọ.
- source_word: ἐλπίς
  choice: olileanya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa atụmanya nwere ntụkwasị obi.
- source_word: χαρά
  choice: ọṅụ
  rationale: ‘Ọṅụ’ na-ebute ike mmetụta okwu Grik ahụ n’ụzọ dị nkenke ma dị mfe nghọta.
- source_word: στέφανος καυχήσεως
  choice: okpueze anyị ji anya isi
  rationale: ‘Okpueze’ na-anọchi ihe nrite nsọpụrụ ma ọ bụ mmeri; ‘anyị ji anya isi’ na-echekwa echiche καύχησις n’enweghị ịgbanwe ya ka ọ bụrụ naanị ọṅụ.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: ọ́ bụghị unu n’ezie?
  rationale: Ajụjụ a na-atụ anya azịza nkwenye; ‘n’ezie’ na-egosipụta nkwusi ike nke οὐχί na καί n’Igbo e ji eme ihe ugbu a.
- source_word: ἔμπροσθεν
  choice: n’ihu
  rationale: ‘N’ihu’ na-egosipụta ịnọ n’ihu mmadụ ma ọ bụ n’ebe ọ nọ n’ụzọ dị nkenke.
- source_word: κυρίου
  choice: Onyenwe
  rationale: ‘Onyenwe’ bụ nsụgharị Igbo kwesịrị ekwesị maka κύριος n’ebe a, ma kwekọọ na nkwupụta banyere Jizọs.
- source_word: παρουσίᾳ
  choice: mgbe ọ ga-abịa
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ọbịbịa Jizọs n’ọdịnihu. E debere echiche ndị ọzọ nke ‘ọnụnọ’ na ‘ọbịbịa/ọbịaru nso’ n’okpuru peeji.
theological_decisions:
- issue: Nsụgharị παρουσίᾳ n’ọnọdụ metụtara ihe ga-eme n’ọdịnihu
  choice: mgbe ọ ga-abịa
  alternative: mgbe ọ ga-anọ ya; mgbe ọ ga-erute
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ezo aka n’ọbịbịa Onyenwe anyị Jizọs n’ọdịnihu. Otú ọ dị, ebe παρουσία nwekwara ike ịpụta ‘ọnụnọ’ ma ọ bụ ‘ọbịbịa/irute,’ e chekwara nkọwa ndị ahụ n’okpuru peeji ka a ghara ihichapụ obosara okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ajụjụ nkwusi ike na ihe oyiyi ‘okpueze,’ ma zere ịgbakwunye nkọwa otu ụka ọ bụla.
