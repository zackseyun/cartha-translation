id: 1TH.2.10
reference: 1 Thessalonians 2:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: ig
  text: Unu bụ ndị akaebe, Chineke bụkwa onye akaebe, otu anyị si bie ndụ n’ịsọpụrụ Chineke[a], n’ezi omume, na n’enweghị ihe a ga-eji taa anyị ụta n’ebe unu ndị kwere ekwe nọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ịdị nsọ.” Okwu Grik ahụ na-emesi omume nsọ na nke ofufe n’ihu Chineke ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n’etiti unu ndị kwere ekwe,” kama “n’ebe unu ndị kwere ekwe nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: Unu bụ ndị akaebe, Chineke bụkwa onye akaebe
  rationale: Nke a na-echekwa ntụgharị uche e mere n’ịkpọ ndị Tesalonaịka aha mbụ dị ka ndị akaebe, mesịa kpọọ Chineke, ma mee ka okwu ahụ daa nke ọma n’Igbo.
- source_word: ὡς
  choice: banyere otu
  rationale: N’ebe a, ὡς na-ewebata ụzọ ma ọ bụ ụdị ndụ ndị ozi biri; ‘banyere otu ... si’ bụ usoro okwu Igbo doro anya n’arịrịọ a na-arịọ ndị akaebe.
- source_word: ὁσίως
  choice: n’ịsọpụrụ Chineke
  rationale: Okwu a na-egosi omume nsọ na nke ofufe n’ihu Chineke. Nhọrọ a na-eme ka akụkụ ya nke chere ihu n’ebe Chineke nọ pụta ìhè n’Igbo nke oge a.
- source_word: δικαίως
  choice: n’ezi omume
  rationale: Nke a na-akọwa omume ziri ezi n’omume na n’ụzọ e si emeso mmadụ, na-enweghị ime ka ọ bụrụ naanị okwu ikpe.
- source_word: ἀμέμπτως
  choice: n’enweghị ihe a ga-eji taa anyị ụta
  rationale: Nkebi okwu a na-egosi na e nweghị ebubo ziri ezi a pụrụ ịkpọgide n’omume ha, ma ọ naghị etinye echiche nke izu okè na-enweghị mmehie.
- source_word: ὑμῖν
  choice: n’etiti unu
  rationale: Dative a nwere ike igosi ndị omume ahụ metụtara ma ọ bụ ebe e gosipụtara ya. ‘N’etiti unu’ bụ Igbo eke ma na-echekwa otu n’ime nghọta ndị Grik kwere ka e nwee.
- source_word: τοῖς πιστεύουσιν
  choice: unu ndị kwere ekwe
  rationale: Nke a na-egosipụta participle ahụ dị ka njirimara ndị a na-agwa okwu, ma na-echekwa ike ngwaa nke ‘ikwere.’
- source_word: ἐγενήθημεν
  choice: anyị si bie ndụ
  rationale: N’agbanyeghị na γίνομαι na-apụtakarị ‘ịghọ’ ma ọ bụ ‘ịbụ,’ adverb atọ ndị a na-eme ka ọ kọwaa ụdị omume ma ọ bụ ndụ ndị ozi biri; ‘anyị si bie ndụ’ bụ okwu Igbo eke.
theological_decisions:
- issue: Nkọwa atọ banyere omume ndị ozi
  choice: A sụgharịrị ha dị ka ezigbo ụdị ndụ ndị ozi biri n’ihu Chineke na n’etiti ndị kwere ekwe, n’enweghị ihe a ga-eji taa ha ụta.
  alternative: Ịghọta okwu ndị a dị ka nzọrọ na ha zuru oke nke na ha enweghị mmehie ọ bụla, ma ọ bụ dị ka naanị okwu ịgbachitere onwe ha nke na-adịghị ekwu ihe banyere ezi omume ha.
  rationale: Amaokwu ahụ ji ndị mmadụ na Chineke kpọọ ndị akaebe banyere ntụkwasị obi nke omume ha. ‘N’enweghị ihe a ga-eji taa anyị ụta’ na-echekwa ike okwu ahụ ma ghara itinye ozizi nke izu okè na-enweghị mmehie.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘n’ịsọpụrụ Chineke’ mee ka akụkụ ὁσίως nke chere ihu n’ebe Chineke nọ doo anya; e debere mgbanwe nwere ike ịdị na ὑμῖν n’okpuru ala.
