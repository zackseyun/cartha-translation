revisions:
- from: Unu bụ ndị akaebe, Chineke bụkwa onye akaebe, banyere otu anyị si bie ndụ n’etiti unu ndị kwere ekwe[b] n’ịsọpụrụ Chineke[a], n’ezi omume, na n’enweghị ihe a ga-eji taa anyị ụta.
  to: Unu bụ ndị akaebe, Chineke bụkwa onye akaebe, otu anyị si bie ndụ n’ịsọpụrụ Chineke[a], n’ezi omume, na n’enweghị ihe a ga-eji taa anyị ụta n’ebe unu ndị kwere ekwe nọ[b].
  rationale: The revision directly renders the manner clause introduced by ὡς and adjusts the dative expression and its note so that the main text naturally accommodates the relational sense while preserving the viable locative alternative. No theological interpretation has been added.
