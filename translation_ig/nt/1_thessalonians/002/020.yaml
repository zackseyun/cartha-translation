  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: ig
  text: N’ihi na ọ bụ unu ka bụ otuto anyị na ọṅụ anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe anyị ji anya isi” ma ọ bụ “nsọpụrụ anyị” kama “otuto anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: unu
  rationale: Nnọchiaha onye nke abụọ n’ụbara ka e kwuru kpọmkwem iji mesie ndị Tesalonaịka ike; nhazi ‘ọ bụ unu bụ’ na-egosipụta nkwusi ike ahụ n’Igbo.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-enye ihe kpatara ma ọ bụ nkọwa nke okwu bu ya ụzọ, ma na-echekwa njikọ echiche ahụ nke ọma.
- source_word: ἐστε
  choice: ọ bụ ... bụ
  rationale: Ụdị njikọ a bụ ụzọ Igbo si ekwu nke ọma na ndị a kpọrọ aha bụ otuto na ọṅụ ndị na-ekwu okwu.
- source_word: δόξα
  choice: otuto
  rationale: ‘Otuto’ na-echekwa echiche nke glory, honor, ma ọ bụ ihe mmadụ ji anya isi n’ọnọdụ mmekọrịta a, n’agbanyeghị na ‘ihe anyị ji anya isi’ ga-abụ nkọwa doro anya karịa.
- source_word: ἡμῶν
  choice: anyị
  rationale: Ọ bụ nnọchiaha nwe nke onye mbụ n’ụbara, ya mere ‘anyị’ dabara kpọmkwem.
- source_word: χαρά
  choice: ọṅụ
  rationale: ‘Ọṅụ’ bụ aha nkịtị na nke kpọmkwem maka χαρά, na-egosi obi ụtọ karịa omume nke ịṅụrị ọṅụ.
theological_decisions:
- issue: Nsụgharị δόξα n’okwu Pọl banyere mmekọrịta ya na ndị kwere ekwe
  choice: otuto
  alternative: ihe anyị ji anya isi; nsọpụrụ
  rationale: ‘Otuto’ na-echekwa ịdị arọ na obosara nke okwu Grik ahụ, ma ọ naghị eme ka okwu a bụrụ naanị ịnya isi nke onwe. Ihe odide ala peeji na-edebe ụzọ nghọta ndị ọzọ dị mkpa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ọ bụ unu bụ’ mee ka nkwusi ike dị na ὑμεῖς pụta ìhè, ma e debere ihe odide ala peeji ozugbo n’ahịrịokwu dịka [a].
