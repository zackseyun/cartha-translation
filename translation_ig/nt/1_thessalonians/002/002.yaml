revisions:
- from: Ma mgbe anyị buru ụzọ taa ahụhụ, e mesọkwa anyị n’ụzọ ihere[a] na Filipaị, dị ka unu maara, anyị nwere nkwuwa okwu n’ime Chineke anyị[b] ịgwa unu ozi ọma nke Chineke n’etiti nnukwu ọgụ[c].
  to: Ma mgbe anyị butesịrị ahụhụ, e mesoro anyị ihe n’ụzọ ihere, dị ka unu maara, na Filipaị, anyị ji nkwuwa okwu n’ime Chineke anyị gwa unu ozi ọma nke Chineke n’etiti nnukwu mgba[c].
  rationale: The text is revised for idiomatic Standard Igbo and to avoid making Paul’s “much struggle” sound specifically like literal warfare. The location of the Philippi phrase remains attached to the prior suffering and mistreatment, as in the Greek. Footnote c is corrected so its alternative does not alter the prepositional relation. Footnote anchors a and b were removed from the running text because the revised wording does not require lexical-alternative notes; footnote c remains anchored to the phrase it explains.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:18Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the preceding suffering, disgraceful treatment, the Thessalonians' knowledge, Philippi, boldness in relation to God, proclamation of God's gospel, and the setting of substantial struggle. However, “n’etiti nnukwu ọgụ” can naturally suggest a literal battle or fight more strongly than ἀγών requires here; “nnukwu mgba” better retains the broad sense of strenuous conflict/struggle. The revised wording also makes the prior-completed force of προπαθόντες clearer.
  naturalness: “E mesọkwa anyị n’ụzọ ihere” is understandable but less idiomatic than “e mesoro anyị ihe n’ụzọ ihere.” The construction “anyị ji nkwuwa okwu n’ime Chineke anyị gwa unu” is a more natural Igbo way to express the Greek boldness followed by the infinitive of speaking.
  terminology: “Ozi ọma nke Chineke” appropriately retains the Greek genitive without narrowing it. “N’ime Chineke anyị” preserves the open relational/spherical force of ἐν τῷ θεῷ ἡμῶν. “Nnukwu mgba” is preferable to literal-sounding “nnukwu ọgụ” for ἀγών in this context.
  issues:
  - severity: medium
    issue: “n’etiti nnukwu ọgụ” is overly concrete.
    rationale: In ordinary modern Igbo, ọgụ readily denotes a fight or war. Although ἀγών can be a contest, its contextual sense here is wider ministry-related struggle or opposition; “mgba” is both natural and suitably broad.
  - severity: low
    issue: The passive expression for ὑβρισθέντες is somewhat unidiomatic.
    rationale: “E mesoro anyị ihe n’ụzọ ihere” more naturally expresses shameful, insolent mistreatment while retaining the passive sense.
  - severity: low
    issue: Footnote c’s alternative “n’agbanyeghị nnukwu mmegide” changes the relation.
    rationale: It means “despite great opposition,” whereas ἐν πολλῷ ἀγῶνι locates the speaking in/with much struggle. “n’ime nnukwu mmegide” preserves the relation.
  revised_text: Ma mgbe anyị butesịrị ahụhụ, e mesoro anyị ihe n’ụzọ ihere, dị ka unu maara, na Filipaị, anyị ji nkwuwa okwu n’ime Chineke anyị gwa unu ozi ọma nke Chineke n’etiti nnukwu mgba[c].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “e kparịrị anyị,” “e mesoro anyị ihe n’ụzọ jọgburu onwe ya,” ma ọ bụ “e metọrọ anyị.” Ngwaa Grik ahụ gụnyere imeso mmadụ ihe n’ụzọ mpako na mkparị, nke na-ewetara ya ihere n’ihu ọha.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “anyị kwuru okwu n’atụghị egwu n’ime Chineke anyị.” Ngwaa Grik ahụ n’onwe ya pụrụ ịgụnye ikwu okwu n’obi ike; ebe a, a sụgharịrị ya “anyị ji nkwuwa okwu” ma hapụ “gwa unu” ka ọ gosipụta infinitive na-esote ya.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “n’etiti nnukwu mgba” ma ọ bụ “n’ime nnukwu mmegide.”
    reason: lexical_alternative
