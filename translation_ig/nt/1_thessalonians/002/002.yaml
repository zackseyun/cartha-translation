id: 1TH.2.2
reference: 1 Thessalonians 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: ig
  text: Ma mgbe anyị butesịrị ahụhụ, e mesoro anyị ihe n’ụzọ ihere, dị ka unu maara, na Filipaị, anyị ji nkwuwa okwu n’ime Chineke anyị gwa unu ozi ọma nke Chineke n’etiti nnukwu mgba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: A pụkwara ịsị, “n’etiti nnukwu mgba” ma ọ bụ “n’ime nnukwu mmegide.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi nnukwu ọdịiche n’ihe Pọl kwuru tupu nke a; “Ma” bụ ụzọ Igbo nkịtị si zipụta njikọ a.
- source_word: προπαθόντες
  choice: mgbe anyị buru ụzọ taa ahụhụ
  rationale: Aorist participle a na-egosi na ahụhụ ahụ mere tupu omume bụ isi; “buru ụzọ” na-egosipụta echiche dị na προ- n’ụzọ Igbo doro anya.
- source_word: ὑβρισθέντες
  choice: e mesọkwa anyị n’ụzọ ihere
  rationale: Okwu Grik a karịrị naanị ịkpọ mmadụ asị; ọ gụnyere mmeso mkparị na-ewetara mmadụ ihere ma na-emebi ùgwù ya.
- source_word: καθὼς οἴδατε
  choice: dị ka unu maara
  rationale: Nke a na-edobe arịrịọ Pọl na-arịọ ndị na-agụ akwụkwọ ka ha cheta ihe ha maara, n’enweghị itinye nkwusi ike na-adịghị na Grik.
- source_word: ἐν Φιλίπποις
  choice: na Filipaị
  rationale: “Filipaị” bụ ntụgharị aha obodo Philippi kwekọrọ n’usoro ụda na odide Igbo.
- source_word: ἐπαρρησιασάμεθα
  choice: anyị nwere nkwuwa okwu
  rationale: Ngwaa ahụ na-egosi ikwu okwu n’atụghị egwu ma ọ bụ n’obi ike. Nhọrọ a na-ahapụ infinitive λαλῆσαι ka ọ bụrụ “ịgwa,” wee zere ikwugharị otu echiche ugboro abụọ.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: n’ime Chineke anyị
  rationale: A hapụrụ usoro ahụ nso na Grik ka ọ ghara ikpebi ma ἐν na-egosi ọnọdụ mmekọrịta, ntọala obi ike, ma ọ bụ ụzọ Chineke si nyere ha aka.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: ịgwa unu
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa eke isi zipụta omume ikwu okwu nye ndị a na-ekwu okwu banyere ha.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: ozi ọma nke Chineke
  rationale: Ọ na-edobe genitive Grik ma ghara ikpebi n'ụzọ dị warara ma ọ pụtara ozi sitere n’aka Chineke, ozi banyere Chineke, ma ọ bụ ozi nke ya.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: n’etiti nnukwu ọgụ
  rationale: ἀγών pụrụ ịpụta ọgụ, mgba, esemokwu, ma ọ bụ mmegide siri ike. “N’etiti nnukwu ọgụ” na-echekwa obosara echiche ahụ.
theological_decisions:
- issue: Ihe ἐν τῷ θεῷ ἡμῶν pụtara
  choice: n’ime Chineke anyị
  alternative: site n’aka Chineke anyị; n’ihi ntụkwasị obi anyị nwere na Chineke anyị
  rationale: A họọrọ okwu na-adịghị eme ka Chineke bụrụ naanị onye nyere ike, ma na-echekwa ohere na nkebiokwu ahụ na-ekwu banyere mmekọrịta ha na Chineke, ebe nkwuwa okwu ha hiwere isi, ma ọ bụ enyemaka ya.
- issue: Mmekọrịta genitive dị na τοῦ θεοῦ
  choice: ozi ọma nke Chineke
  alternative: ozi ọma sitere n’aka Chineke; ozi ọma banyere Chineke
  rationale: “Nke Chineke” na-echekwa ihe Grik na-ahapụ oghe, kama ịkọwa ya naanị dị ka isi mmalite ma ọ bụ naanị dị ka isiokwu ozi ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu Pọl ruo ókè Igbo kwere, ma gbanwee participle mmalite ka ọ bụrụ nkebiokwu oge doro anya. A hapụrụ “n’ime Chineke anyị” na “ozi ọma nke Chineke” n’ụdị na-echekwa nghọta sara mbara na mgbagwoju anya dị na Grik.
