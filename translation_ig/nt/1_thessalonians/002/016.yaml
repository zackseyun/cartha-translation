id: 1TH.2.16
reference: 1 Thessalonians 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: ig
  text: na-egbochi anyị ịgwa ndị mba ọzọ okwu ka a zọpụta ha, nke na-eme ka ha na-eme ka mmehie ha ruo n’uju mgbe niile. Ma iwe ahụ[a] abịakwasịla ha n’ikpeazụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O yikarịrị ka “iwe ahụ” na-ezo aka n’ikpe Chineke, ma Pọl ekwughị n’ebe a ma ọ na-ekwu maka ikpe mere n’oge ahụ, ikpe ikpeazụ, ma ọ bụ ha abụọ.
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịsụgharị “n’ikpeazụ” dịka “kpamkpam,” “ruo n’uju,” ma ọ bụ “ruo ọgwụgwụ” (Grik: εἰς τέλος).'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: na-egbochi anyị
  rationale: Ọ na-egosi omume mgbochi na-aga n’ihu, ma ọ naghị ekwu kpọmkwem na ọ bụ mmachibido iwu.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N’ebe a ọ na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ, ọ bụghị mba dị iche iche dịka ọchịchị.
- source_word: λαλῆσαι
  choice: ịgwa ... okwu
  rationale: Nke a na-asụgharị infinitive ahụ n’ụzọ nkịtị ma doo anya; ihe a ga-agwa ha pụtara site n’ihe gbara amaokwu ahụ gburugburu.
- source_word: ἵνα σωθῶσιν
  choice: ka a zọpụta ha
  rationale: Ọ na-edobe ahịrịokwu ebumnuche na ụdị passive nke ngwaa ahụ, n’etinyeghị nkọwa okpukpe ọzọ.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: si otú a na-emeju
  rationale: Nke a na-edobe njikọ nke ihe mgbochi ahụ na nsonaazụ ma ọ bụ ebumnuche ya n’enweghị ikwu hoo haa na imeju mmehie bụ ihe ha bu n’obi.
- source_word: ἀναπληρῶσαι
  choice: na-emeju ... ruo n’ókè ya
  rationale: Ọ na-egosipụta echiche nke ime ka mmehie ruo n’uju; ‘ruo n’ókè ya’ na-eme ka akpaalaokwu ahụ doo onye Igbo nke oge a anya.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Ọ na-egosi usoro omume na-aga n’ihu dịka adverb Grik ahụ si kwuo.
- source_word: ἔφθασεν
  choice: abịakwasịla
  rationale: Ụdị perfect Igbo na-egosi ihe merela nke ka nwere mmetụta ugbu a; ‘abịakwasịla’ dabara na ἐπ’ αὐτούς.
- source_word: ὀργή
  choice: iwe ahụ
  rationale: ‘Iwe’ na-edobe ịdị arọ nke okwu ahụ ma ghara iji ‘ikpe’ dochie ya, nke ga-abụ nkọwa karịa ntụgharị.
- source_word: εἰς τέλος
  choice: n’ikpeazụ
  rationale: Nke a bụ ntụgharị akpaalaokwu dị mma n’ọnọdụ a, ebe ndetu na-edobe ohere nke ‘kpamkpam’ ma ọ bụ ‘ruo ọgwụgwụ.’
theological_decisions:
- issue: Onye iwe ahụ bụ nke ya na ụdị ikpe ọ na-ezo aka na ya
  choice: E debere ya dịka ‘iwe ahụ,’ nke na-egosi iwe/ikpe Chineke site n’ọnọdụ amaokwu ahụ ma na-akọwaghị ụdị ikpe ahụ kpọmkwem.
  alternative: Ikpe pụrụ iche mere n’akụkọ ihe mere eme; ikpe ikpeazụ; ma ọ bụ ha abụọ.
  rationale: Pọl akọwaghị n’amaokwu a ma ọ bụ ikpe dị ugbu a, ikpe ikpeazụ, ma ọ bụ ha abụọ; ya mere ntụgharị ahụ na ndetu na-edobe mgbagwoju anya ahụ.
- issue: Ike nke εἰς τὸ ἀναπληρῶσαι
  choice: A sụgharịrị ya n’ụzọ nwere ike igosi ihe si na omume ha pụta n’enweghị imechi ụzọ na echiche ebumnuche.
  alternative: ‘ka ha wee mejupụta mmehie ha,’ nke nwere ike ịpụta ebumnuche ha kpọmkwem.
  rationale: ‘Si otú a’ na-egosi njikọ siri ike mana ọ naghị ekwu na ndị ahụ ji ụma kpebie imeju mmehie ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ndị mba ọzọ’ bụ okwu a na-aghọta nke ọma maka ndị na-abụghị ndị Juu. Akara ndetu abụọ dị n’ebe okwu ha na-akọwa nọ; e dezikwara usoro ndetu ka ọ kwekọọ na ha.
