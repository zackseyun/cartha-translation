- from: na-egbochi anyị ịgwa ndị mba ọzọ okwu ka a zọpụta ha, si otú a na-emeju mmehie ha mgbe niile ruo n’ókè ya. Ma iwe ahụ[a] abịakwasịla ha n’ikpeazụ[b].
  to: na-egbochi anyị ịgwa ndị mba ọzọ okwu ka a zọpụta ha, nke na-eme ka ha na-eme ka mmehie ha ruo n’uju mgbe niile. Ma iwe ahụ[a] abịakwasịla ha n’ikpeazụ[b].
  rationale: The revised result clause makes the opponents the clear referent and replaces an unnatural fullness expression with “ime ka mmehie ha ruo n’uju,” which preserves the source image without importing a doctrinal explanation. The wording “nke na-eme ka” marks consequence in context rather than claiming a conscious purpose. Footnote a is revised solely for clarity and natural Standard Igbo; it continues to leave the nature and timing of the wrath unspecified.
