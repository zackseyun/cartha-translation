translation:
  language: ig
  text: Dịka unu maara[a], anyị mesoro onye ọ bụla n’ime unu omume dịka nna si emeso ụmụ nke ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dabara kpọmkwem karị: “Dịka unu maara, otu anyị si meso onye ọ bụla n’ime unu dịka nna si emeso ụmụ nke ya.” N’asụsụ Grik, nkebi a ezughị oke n’onwe ya; ọ dabere n’okwu gbara ya gburugburu ka e wee ghọta omume ngwaa ahụ zuru ezu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: dị nnọọ ka
  rationale: Na-egosipụta ntụnyere siri ike ma na-arịọ ihe ndị Tesalonaịka maara banyere omume Pọl.
- source_word: οἴδατε
  choice: unu maara
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ perfect, ihe ọ pụtara ebe a bụ ihe ha maara ugbu a.
- source_word: ὡς (nke mbụ)
  choice: —
  rationale: E tinyere ọrụ ya n’usoro ahịrịokwu Igbo ‘dị nnọọ ka unu maara’; itinye ‘na’ n’ụzọ kpọmkwem ga-eme ka okwu ahụ ghara ịdị ụtọ.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: Na-echekwa ike nkesa nke okwu Grik ahụ, nke na-emesi nlekọta e nyere mmadụ n’otu n’otu ike.
- source_word: ὡς (nke abụọ)
  choice: dịka
  rationale: Na-egosipụta ntụnyere n’etiti omume ndị ozi ahụ na omume nna.
- source_word: πατὴρ
  choice: nna
  rationale: Aha a na-arụ ọrụ ntụnyere n’enweghị article; ‘nna’ bụ ntụgharị Igbo dị mfe ma kwekọọ n’oyiyi ahụ.
- source_word: τέκνα
  choice: ụmụ
  rationale: Okwu a gụnyere ụmụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke.
- source_word: ἑαυτοῦ
  choice: nke ya
  rationale: 'Na-echekwa nkwusi ike nke nnọchiaha reflexive ahụ: ụmụ nke nna ahụ n’onwe ya.'
- source_word: '[echiche ngwaa a hapụrụ nke a na-enweta site n’okwu gbara ya gburugburu]'
  choice: anyị mesoro ... omume / si emeso
  rationale: Nkebi Grik ahụ ezughị oke n’onwe ya. Okwu a gbakwunyere sara mbara, na-eme ka ahịrịokwu Igbo zuo oke n’ebughị ụzọ họrọ naanị otu n’ime omume ndị a kọwara n’okwu gbara ya gburugburu.
theological_decisions:
- issue: Ịgbakwunye omume ngwaa nke a na-ekwughị kpọmkwem n’ahịrịokwu Grik dị mkpirikpi
  choice: anyị mesoro onye ọ bụla n’ime unu omume dịka nna si emeso ụmụ nke ya
  alternative: Ịhapụ ya ka ọ dị ka nkebi na-ezughị oke, ma ọ bụ ịsụgharị ya kpọmkwem dị ka ‘anyị gbara onye ọ bụla ume’
  rationale: Grik ahụ bụ elliptical ma dabere n’ahịrịokwu gbara ya gburugburu. Ngwaa sara mbara na-eme ka Igbo doo anya ma na-ezere ime ka otu omume kpọmkwem bụrụ naanị ihe ederede ahụ pụtara.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘mesoro ... omume’ iji mee ka ellipsis doo anya, ebe ‘ụmụ nke ya’ na-echekwa oyiyi nna na ụmụ ya n’enweghị ịkọwa okike ụmụ ahụ.
