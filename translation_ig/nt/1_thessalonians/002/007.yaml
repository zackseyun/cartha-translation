reference: 1 Thessalonians 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: ig
  text: Ọ bụ ezie na, dị ka ndị ozi nke Mezaya[a], anyị pụrụ ịbụ ibu arọ, ma anyị ghọrọ ndị dị nwayọọ n’etiti unu, dị ka nwanyị na-elekọta ụmụ si eji ịhụnanya elekọta ụmụ nke ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a pụtara n’ụzọ nkịtị, “ịnọ n’arọ” ma ọ bụ “ịdị arọ.” Ọ pụrụ ịpụta ịbụ ibu arọ nye unu, iji ikike ndịozi atụ anya ihe n’aka unu, ma ọ bụ ime ka ọkwa ndịozi dị arọ. Ntụgharị ọdịnala bụ “ndị ozi nke Kraịst.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị ka nwanyị na-enye nwa ara si eji ịhụnanya elekọta ụmụ nke ya.” Okwu Grik ahụ pụrụ ịpụta nwanyị na-elekọta ụmụ ma ọ bụ nwanyị na-enye nwa ara.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάμενοι
  choice: Ọ bụ ezie na anyị nwere ike
  rationale: 'Ebe participle a jikọrọ na ἀλλά, ọ na-egosi nkwenye nke na-ebute ihe megidere ya: ‘ọ bụ ezie na anyị nwere ike ... ma.’'
- source_word: ἐν βάρει εἶναι
  choice: iji ikike anyị mee ihe n’etiti unu
  rationale: Akpaokwu ahụ pụtara n’ụzọ nkịtị ‘ịnọ n’ibu/arọ,’ ma n’ebe a o yikarịrị ka ọ na-ekwu maka iji ọnọdụ na ikike ndịozi mee ihe ma ọ bụ ịrịọ ihe; ntụgharị a na-ezere ime ka ọ bụrụ naanị ibu ego. E debere ihe oyiyi nkịtị na nkọwa ala peeji.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: dị ka ndị ozi nke Mezaya
  rationale: Χριστοῦ bụ aha ọkwa n’ebe a; ‘Mezaya’ na-egosipụta nke ahụ, ebe ‘ndị ozi nke’ na-ebute genitive ahụ n’Igbo dị mma.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: ma anyị dị
  rationale: Ọ bụ ezie na ἐγενήθημεν pụtara n’ụzọ nkịtị ‘anyị ghọrọ,’ n’Igbo, ‘anyị dị’ na-egosipụta omume ha n’etiti ndị ahụ nke ọma ma na-ada n’ụzọ ebumpụta ụwa.
- source_word: ἤπιοι
  choice: dị nwayọọ
  rationale: Nke a bụ okwu Igbo doro anya ma dị ebube maka ịdị gentle/mild.
- source_word: ἐν μέσῳ ὑμῶν
  choice: n’etiti unu
  rationale: Ọ na-edobe echiche nke ịnọ n’ime ọgbakọ ha, ma bụrụkwa akpaokwu Igbo a na-aghọta ngwa ngwa.
- source_word: ὡς ἐὰν τροφὸς
  choice: dị ka nne na-enye nwa ara
  rationale: τροφός nwere ike ịbụ nne ma ọ bụ nwanyị na-enye nwa ara ma na-elekọta nwa; ntụgharị a na-eme ka ihe atụ nlekọta nne pụta ìhè n’Igbo.
- source_word: θάλπῃ
  choice: si eji ịhụnanya lekọta
  rationale: Ngwaa ahụ nwere echiche ikpo ọkụ na ilekọta n’ụzọ dị nro; akpaokwu Igbo a na-ebute nlekọta ịhụnanya ahụ.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: ụmụ nke ya
  rationale: 'Ọ na-edobe nkwusi ike nke ἑαυτῆς: ụmụ bụ nke nwanyị ahụ n’onwe ya.'
theological_decisions:
- issue: Ntụgharị Χριστοῦ
  choice: Mezaya
  alternative: Kraịst
  rationale: N’akpaokwu a, Χριστός na-arụ ọrụ dị ka aha ọkwa nke Onye E Tere Mmanụ, ya mere ‘Mezaya’ ka a họọrọ; ‘Kraịst’ bụ ntụgharị ọdịnala.
- issue: Ihe ἐν βάρει εἶναι na-egosi
  choice: iji ikike ndịozi mee ihe
  alternative: ịbụ ibu arọ nye unu / ịrịọ ihe n’aka unu
  rationale: Ihe oyiyi Grik bụ ‘ịnọ n’arọ,’ nke nwere ike ịgụnye ibu ma ọ bụ arịrịọ, ma ihe gbara ya gburugburu na-emesi ọnọdụ na ikike ndịozi ike. Nkọwa ala peeji na-echekwa obosara nke okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘unu’ maka plural nke ὑμῶν. A zere okwu nwere ike ime ka ‘ibu’ bụrụ naanị ibu ego, ma e chekwara ihe oyiyi Grik na nkọwa ala peeji.
