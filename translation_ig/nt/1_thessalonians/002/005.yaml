  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: ig
  text: N’ihi na ọ dịghị mgbe anyị ji okwu ire ụtọ[a] bịakwute unu, dị ka unu maara; anyị ejighịkwa ihe ngọpụ kpuchie anyaukwu[b]—Chineke bụ onye akaebe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “jiri ire ụtọ”; n’ụzọ okwu Grik si kwuo ya kpọmkwem, “n’okwu ire ụtọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “jiri ihe mkpuchi zoo anyaukwu” ma ọ bụ “jiri ihe ngọpụ maka anyaukwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: N’ihi na ọ dịghị mgbe
  rationale: A sụgharịrị γάρ dị ka “N’ihi na” iji gosi njikọ ya na ihe Pọl kwuru tupu nke a. Njikọ οὔτε na ποτέ na-egosi ịgọnahụ ihe n’oge niile, nke “ọ dịghị mgbe” na-akọwa nke ọma n’Igbo.
- source_word: ἐν λόγῳ κολακείας
  choice: ji okwu ire ụtọ
  rationale: λόγος n’ebe a bụ okwu mmadụ na-ekwu, ebe κολακεία bụ okwu e ji eto mmadụ iji rata ya. “Ji okwu ire ụtọ” na-ada ka Igbo nkịtị ma na-echekwa ọrụ ἐν dị ka ụzọ e si mee ihe.
- source_word: ἐγενήθημεν
  choice: bịakwute unu
  rationale: N’ọnọdụ a, γίνομαι na-ekwu maka otú Pọl na ndị ya si pụta n’etiti ndị Tesalonaịka. “Bịakwute unu” dabara n’ọnọdụ nleta ozi ọma ahụ, n’agbanyeghị na “unu” adịghị kpọmkwem n’ahịrịokwu Grik.
- source_word: καθὼς οἴδατε
  choice: dị ka unu maara
  rationale: Nke a na-echekwa arịrịọ Pọl na-arịọ ndị na-agụ akwụkwọ ahụ ka ha gbaa akaebe site n’ihe ha onwe ha maara.
- source_word: ἐν προφάσει πλεονεξίας
  choice: ji ihe ngọpụ kpuchie anyaukwu
  rationale: πρόφασις nwere ike ịbụ ihe ngọpụ, ihe e mere ka ọ dị ka eziokwu, ma ọ bụ ihe mkpuchi; πλεονεξία bụ ọchịchọ inweta ihe karịrị akarị. Nhọrọ a na-eme ka echiche nke iji ihu ụgha kpuchie anyaukwu doo anya n’Igbo, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ e nwere isi ghọta ya.
- source_word: θεὸς μάρτυς
  choice: Chineke bụ onye akaebe
  rationale: Nke a na-echekwa kpọmkwem ịkpọ Chineke ka ọ gbaa akaebe, n’etinyeghị nnọchiaha nke na-adịghị n’ihe odide Grik.
theological_decisions:
- issue: Ihe Pọl na-agọnahụ banyere ụzọ ha si rụọ ọrụ na ebumnobi ha
  choice: Amaokwu ahụ na-agọnahụ ma iji okwu ire ụtọ rata mmadụ ma iji ihe ngọpụ kpuchie anyaukwu.
  alternative: Ịghọta ya dị ka ịkatọ ụdị nkwupụta niile a haziri nke ọma, ma ọ bụ ime ka ọ bụrụ naanị okwu banyere iri mmadụ ego.
  rationale: Okwu Grik κολακεία na πλεονεξία kpọrọ ebubo abụọ a aha kpọmkwem. Nsụgharị ahụ anaghị etinye ozizi sara mbara banyere nkwupụta okwu, ọ naghịkwa amachi anyaukwu naanị n’ego.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Okwu ire ụtọ” na “ihe ngọpụ kpuchie anyaukwu” bụ okwu ndị nkịtị ga-aghọta, ebe akara [a] na [b] na-echekwa nhọrọ okwu na nghọta dị n’asụsụ Grik.
