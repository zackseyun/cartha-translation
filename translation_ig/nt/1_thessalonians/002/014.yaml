revisions:
- from: N’ihi na unu onwe unu, ụmụnna, ghọrọ ndị na-eṅomi nzukọ Chineke ndị dị na Judia n’ime Mesaịa Jizọs, n’ihi na unu onwe unu sikwa n’aka ndị obodo unu taa ahụhụ ndị ahụ ha tara n’aka ndị Juu.[a]
  to: N’ihi na unu onwe unu, ụmụnna, ghọrọ ndị na-eṅomi nzukọ Chineke ndị dị na Judia n’ime Mesaịa Jizọs, n’ihi na unu onwe unu tara ahụhụ otu ahụ n’aka ndị obodo unu, dịka ha si tara n’aka ndị Juu.[a]
  rationale: The revision replaces an awkward repetition with an idiomatic comparative construction while retaining the source’s emphatic “you yourselves,” the same-suffering comparison, and the distinction between the Thessalonians’ local compatriots and the Jews who afflicted the Judean churches. The existing footnote anchor and wording remain valid.
  reviewer_model: gpt-5.6-terra
