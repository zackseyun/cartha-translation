id: 1TH.2.14
reference: 1 Thessalonians 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: ig
  text: N’ihi na unu onwe unu, ụmụnna, ghọrọ ndị na-eṅomi nzukọ Chineke ndị dị na Judia n’ime Mesaịa Jizọs, n’ihi na unu onwe unu tara ahụhụ otu ahụ n’aka ndị obodo unu, dịka ha si tara n’aka ndị Juu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Judia.” Okwu Grik ahụ nwere ike ịpụta ndị Juu ma ọ bụ ndị si Judia, dabere n’ọnọdụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: ghọrọ ndị na-eṅomi
  rationale: Nke a na-edobe ma echiche nke ‘ịghọ’ dị na ἐγενήθητε ma ntụnyere doro anya nke μιμηταί, kama ime ka ọ bụrụ naanị ‘ndị na-eso ụzọ.’
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo ebumpụta ụwa e ji akpọ ìgwè ndị kwere ekwe, ọ pụkwara ịgụnye nwoke na nwaanyị n’enweghị ịmanye nkọwa nwoke naanị.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: nzukọ Chineke
  rationale: ‘Nzukọ Chineke’ na-egosi ọgbakọ ndị kwere ekwe; otu ọdịdị ‘nzukọ’ n’Igbo nwere ike ịrụ ọrụ ebe Grik ji ọtụtụ, ebe nkebi na-esochi ya na-egosi ọtụtụ ọgbakọ.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: ndị dị na Judia
  rationale: Nke a na-akọwa nzukọ ndị ahụ site n’ebe ha dị ma na-asụ ya n’ụzọ Igbo kwụ ọtọ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: ‘Mesaịa’ na-echekwa ihe aha-ọrụ Χριστός pụtara, ‘onye e tere mmanụ,’ ebe ‘n’ime’ na-edobe njikọ ἐν nke Pọl ji eme ihe.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: taa ahụhụ ndị ahụ ha tara
  rationale: Usoro a na-egosipụta na ahụhụ ndị Tesalonaịka tara bụ otu ụdị ahụ ndị nzukọ Judia tara, n’ụzọ Igbo dị mma.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: ndị obodo unu
  rationale: ‘Ndị obodo unu’ na-egosi ndị ha na ha nwere otu agbụrụ ma ọ bụ obodo, ma ἰδίων na-enweta nkwusi ike site na ‘unu.’
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N’ọnọdụ a, ‘ndị Juu’ bụ ntụgharị a na-ahụkarị nke Ἰουδαίων; ọ naghị etinye n’ime amaokwu echiche na ọ bụ ndị Juu niile n’enweghị oke.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστῷ dị ka aha-ọrụ ma ọ bụ hapụ ya dị ka aha a na-akpọkarị
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a Χριστός ka nwere ihe aha-ọrụ pụtara. ‘Mesaịa’ na-echekwa nkọwa ahụ n’enweghị ịgbanwe ihe amaokwu ahụ na-ekwu banyere Jizọs.
- issue: Ókè ndị okwu ‘ndị Juu’ na-ezo aka na ha
  choice: E debere ‘ndị Juu’ n’ahịrị amaokwu, tinyezie nkọwa ọzọ n’ala peeji
  alternative: ndị Judia
  rationale: Ἰουδαίων nwere ike ịpụta ndị Juu ma ọ bụ ndị Judia. Amaokwu ahụ na-ekwu maka ndị kpọmkwem kpagburu nzukọ ndị ahụ, ọ bụghị ikwu na ndị Juu niile mere ya; a naghị agbasa ókè ahụ n’asụsụ ntụgharị.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E debere nkwughachi ‘unu onwe unu’ iji gosipụta nkwusi ike dị na ὑμεῖς na καὶ ὑμεῖς. Akara nkọwa [a] dị n’ahịrị amaokwu ma kwekọọ na nkọwa ala peeji.
