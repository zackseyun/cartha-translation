  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: ig
  text: anyị achọghịkwa otuto n’aka ndị mmadụ[a]—ma ọ bụ n’aka unu, ma ọ bụ n’aka ndị ọzọ—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nsọpụrụ” ma ọ bụ “nkwanye ùgwù” kama “otuto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητοῦντες
  choice: anyị achọghịkwa
  rationale: A na-eji ngwaa nke na-egosi ịchọ ihe mee ka participle ahụ bụrụ Igbo nkịtị; njikọ ya na οὔτε na ahịrịokwu gbara ya gburugburu chọrọ ụdị jụrụ ajụ. ‘-kwa’ na-ejikọta nkebi a na ihe bu ya ụzọ.
- source_word: ἐξ ἀνθρώπων
  choice: n’aka mmadụ
  rationale: N’Igbo, ‘n’aka mmadụ’ bụ ụzọ ebumpụta ụwa isi kwuo na ihe si n’ebe ụmụ mmadụ nọ, ebe ‘mmadụ’ nwere ike ịpụta mmadụ niile n’enweghị ịkọwa nwoke naanị.
- source_word: δόξαν
  choice: otuto
  rationale: N’ọnọdụ a, δόξα pụtara nkwanye ùgwù ma ọ bụ otuto ndị mmadụ na-enye. ‘Otuto’ na-eme ka echiche ahụ doo onye Igbo nke oge a anya, ebe e debere ụzọ ndị ọzọ n’ala ala peeji.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: -ghịkwa ... ma ọ bụ ... ma ọ bụ
  rationale: Usoro a na-echekwa njikọ nke nkebi jụrụ ajụ na ihe bu ya ụzọ, ma na-enye ụzọ Igbo doro anya isi depụta ebe atọ a na-ekwu na otuto ahụ esighị.
- source_word: ἀφ’ ὑμῶν
  choice: n’aka unu
  rationale: ‘Unu’ na-echekwa onye nke abụọ ọtụtụ, na-ezo aka kpọmkwem n’ebe ndị Tesalonaịka nọ.
- source_word: ἀπ’ ἄλλων
  choice: n’aka ndị ọzọ
  rationale: Nke a bụ nsụgharị dị nkenke ma bụrụkwa nke ebumpụta ụwa maka ndị mmadụ ndị ọzọ na-abụghị ndị a na-agwa okwu.
theological_decisions:
- issue: Ụdị δόξα a na-achọ
  choice: otuto sitere n’aka mmadụ
  alternative: nsọpụrụ ma ọ bụ nkwanye ùgwù sitere n’aka mmadụ
  rationale: ἐξ ἀνθρώπων na-egosi na ihe a na-ekwu bụ nnabata ma ọ bụ otuto ndị mmadụ, ọ bụghị ebube Chineke. ‘Otuto’ na-egosipụta nke a nke ọma n’Igbo nkịtị.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E jiri ‘n’aka mmadụ’ mee ka isi mmalite otuto ahụ doo anya, ma zere okwu ga-eme ka ἄνθρωποι bụrụ naanị ụmụ nwoke. Akara [a] dị n’ederede isi dịka achọrọ.
