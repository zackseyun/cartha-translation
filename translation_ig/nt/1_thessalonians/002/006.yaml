    issue: Generic plural ἀνθρώπων is represented by singular “mmadụ.”
    rationale: Although Igbo singular can sometimes be generic, “ndị mmadụ” is clearer in this sentence and better preserves the source’s reference to people generally, before specifying “unu” and “ndị ọzọ.”
