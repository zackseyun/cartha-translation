revisions:
- from: N’ihi na okwu anyị ji agba unu ume[a] esiteghị na njehie[b] ma ọ bụ n’adịghị ọcha, anyị ejighịkwa aghụghọ kwuo ya.
  to: N’ihi na arịrịọ anyị esiteghị na njehie, ma ọ bụ n’adịghị ọcha, ma ọ bụ n’ụzọ aghụghọ.[a][b]
  rationale: 'The revision restores the source’s single threefold construction: the appeal is neither from error nor from impurity nor carried out in a deceitful way. It removes added wording and the explicit second-person object while maintaining natural modern Standard Igbo and the broad sense of ἀκαθαρσία.'
