  yaml_path: translation/nt/1_thessalonians/002/003.yaml
  text: For our appeal does not come from error or impurity or deceit[b][a],
translation:
  language: ig
  text: N’ihi na arịrịọ anyị esiteghị na njehie, ma ọ bụ n’adịghị ọcha, ma ọ bụ n’ụzọ aghụghọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịdụ ọdụ anyị” ma ọ bụ “ịgba ume anyị.” Okwu Grik παράκλησις nwere ike ịpụta arịrịọ, ịdụ ọdụ, ma ọ bụ ịgba ume, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nduhie” maka “njehie.” Okwu e mesịrị sụgharịrị “aghụghọ” na-egosi nke ọma karị aghụghọ e kpachapụrụ anya mee.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: okwu anyị ji agba unu ume
  rationale: Nkebiokwu a na-egosipụta okwu e ji kpọkuo ma gbaa ndị na-ege ntị ume. Ọ bụ Igbo dị mfe ma doo anya, nke na-adịghị eme ka okwu ahụ bụrụ naanị nkasi obi ma ọ bụ naanị arịrịọ.
- source_word: πλάνης
  choice: njehie
  rationale: “Njehie” na-egosipụta echiche ma ọ bụ ozizi na-abụghị eziokwu, ma na-edobe ọdịiche dị n’etiti πλάνη na δόλος, nke na-ekwu kpọmkwem banyere aghụghọ e kpachapụrụ anya mee.
- source_word: ἀκαθαρσίας
  choice: adịghị ọcha
  rationale: Nhọrọ a na-edobe echiche sara mbara banyere adịghị ọcha n’omume, n’ebughị ụzọ kpebie na ọ bụ naanị mmehie mmekọahụ ka a na-ekwu maka ya.
- source_word: δόλῳ
  choice: anyị ejighịkwa aghụghọ kwuo ya
  rationale: “Aghụghọ” na-egosipụta atụmatụ e ji eduhie mmadụ. Usoro “ejighịkwa … kwuo ya” na-eme ka ἐν doo anya dị ka ụzọ e si kwuo okwu ahụ, ọ bụghị ebe okwu ahụ si malite.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: esiteghị na ... ma ọ bụ n’...; anyị ejighịkwa ... kwuo ya
  rationale: Nsụgharị a na-edobe ọdịiche dị n’etiti ἐκ/ἐξ, ndị na-egosi ebe ihe si malite, na ἐν, nke n’ebe a na-egosi ụzọ e si mee ihe.
- source_word: γὰρ
  choice: N’ihi na
  rationale: “N’ihi na” na-ejikọta amaokwu a na ihe e kwuru tupu ya ma na-egosi na Pọl na-enye nkọwa.
theological_decisions:
- issue: Oke ihe ἀκαθαρσία pụtara n’ọnọdụ a
  choice: adịghị ọcha
  alternative: adịghị ọcha n’ihe gbasara mmekọahụ
  rationale: Okwu Grik ahụ nwere ike ịgụnye mmehie mmekọahụ, ma amaokwu a akọwaghị ụdị adịghị ọcha a kpọmkwem. Ya mere, okwu sara mbara na-echekwa ihe ederede kwuru n’etinyeghị nkọwa dị warara.
- issue: Ọdịiche dị n’etiti πλάνη na δόλος
  choice: njehie ... aghụghọ
  alternative: n duhie ... aghụghọ
  rationale: Nhọrọ a na-echekwa esemokwu dị n’etiti okwu ma ọ bụ nkwenkwe na-abụghị eziokwu na ụzọ aghụghọ e kpachapụrụ anya mee, n’agbanyeghị na πλάνη nwekwara ike ịpụta nduhie.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debeghị usoro preposition Grik n’ụzọ isiike; kama, e gosipụtara ebe ihe si malite na ụzọ e si mee ya n’Igbo eke. Akara nkọwa ala ala [a] na [b] dị n’ebe okwu ha na-akọwa pụtara n’ahịrị isi.
