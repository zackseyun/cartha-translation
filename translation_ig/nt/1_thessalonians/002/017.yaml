  source_fidelity: Ihe odide bụ isi na-ewepụta nke ọma ọdịiche dị na δέ, nkwusiri ike dị na ἡμεῖς, nkewa nwa oge, na ọdịiche dị n’etiti ịnọ n’anụ ahụ na ịnọ n’obi. Otú ọ dị, ihe odide ala ala a maka ἀπορφανισθέντες edoghị anya ma ghara ikwu n’ụzọ ziri ezi ihe oyiyi Grik nke ịbụ ndị e mere ka ụmụ mgbei/bereft; a chọrọ idozi ya.
