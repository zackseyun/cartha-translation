language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: ig
  text: Ma anyị onwe anyị, ụmụnna[b], mgbe e kewapụrụ anyị n’ebe unu nọ nwa oge[a]—n’anụ ahụ, ọ bụghị n’obi—anyị kpesiri ike karịa, jiri oké ọchịchọ ịhụ unu ihu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị karị, “mgbe e mere anyị ka ụmụ mgbei, kewapụ anyị n’ebe unu nọ.” Okwu Grik ahụ ji ihe oyiyi siri ike nke ọnwụ na mwute kọwaa nkewa ahụ.
    reason: lexical_alternative
  - marker: b
    text: “Ụmụnna” bụ ụzọ Pọl si akpọ ha; n’ọnọdụ a o yikarịrị ka ọ na-ekwu banyere ọgbakọ ndị kwere ekwe dum, gụnyere ụmụ nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: Ma anyị onwe anyị
  rationale: “Ma” na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe e kwuru tupu ya; “anyị onwe anyị” na-echekwa nkwusiri ike dị n’Ἡμεῖς.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu nkwanye ùgwù Pọl ji akpọ ndị kwere ekwe; n’Igbo ọ na-ada nke ọma ma nwee ike ịgụnye ọgbakọ dum dịka ọnọdụ a si dị.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: mgbe e kewapụrụ anyị n’ebe unu nọ
  rationale: Nhọrọ a na-egosi na nkewa ahụ dakwasịrị ha ma na-ezere ahịrịokwu Igbo na-adịghị aga were were. Ihe oyiyi siri ike nke ịbụ ndị a napụrụ ndị ha hụrụ n’anya ka akọwara n’ala ala peeji.
- source_word: πρὸς καιρὸν ὥρας
  choice: nwa oge
  rationale: Nkebiokwu Grik a pụtara oge dị mkpirikpi, ọ bụghị otu awa kpọmkwem.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: n’anụ ahụ, ọ bụghị n’obi
  rationale: Nke a na-egosi ọdịiche dị n’etiti ịnọpụ iche n’ahụ na ịhụnanya nke ka dị n’obi, n’ụzọ Igbo nkịtị.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: anyị gbalịsiri ike karịa
  rationale: Ọ na-echekwa ma echiche nke mgbalị siri ike ma nkwusiri ike nke adverb comparative ahụ.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: ịhụ unu ihu
  rationale: Ọ na-echekwa okwu “ihu” nke dị na Grik na mmetụta nke ọchịchọ izute ha n’onwe ha.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: jiri oké ọchịchọ chọọ
  rationale: N’ebe a ἐπιθυμία bụ ọchịchọ siri ike nke ịhụ ndị a hụrụ n’anya, ọ bụghị agụụ mmekọahụ ma ọ bụ ọchịchọ ọjọọ.
theological_decisions:
- issue: Ndị okwu ἀδελφοί na-agụnye
  choice: ụmụnna
  alternative: ụmụnna nwoke na ụmụnna nwanyị
  rationale: A hapụrụ ụdị okwu Pọl ji kpọọ ha n’ụzọ dị nkenke ma kwekọọ n’Igbo. Ihe odide ala ala peeji na-akọwa na n’ọnọdụ a o yikarịrị ka ọ na-ekwu banyere ọgbakọ ndị kwere ekwe dum, gụnyere ụmụ nwanyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ọdịiche dị n’etiti nkewa n’anụ ahụ na ịdị n’otu n’obi, tinyere ike nke ọchịchọ Pọl ịhụ ha ihu.
