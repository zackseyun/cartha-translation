id: 1TH.2.1
reference: 1 Thessalonians 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: ig
  text: N’ihi na unu onwe unu maara, ụmụnna[a], na ọbịbịa anyị n’ebe unu nọ abụghị ihe efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ụmụnne nwoke.” Okwu Grik ahụ na-eji ụdị nwoke eme ihe, ma a na-ejikarị ya agwa ọgbakọ ndị kwere ekwe dum, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: unu onwe unu
  rationale: 'Nke a na-echekwa nkwusi ike dị n’okwu Grik ahụ: ndị Tesalonaịka maara ihe ahụ n’onwe ha site n’ihe ha hụrụ.'
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka nkwado ma ọ bụ ihe kpatara ya.
- source_word: οἴδατε
  choice: maara
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ nke perfect, ihe ọ pụtara ebe a bụ ịma ihe ugbu a; “maara” bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu ebumpụta ụwa na Igbo maka ịkpọkọta ndị otu okwukwe, ma ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị dịka ojiji Pọl si dị.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: ọbịbịa anyị bịakwutere unu
  rationale: Nke a na-egosipụta ọbịbịa ma ọ bụ mbata ha n’ebe ndị Tesalonaịka nọ, ma na-ada ka Igbo nke oge a.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ihe ndị a maara, dịka okwu Grik ahụ si arụ ọrụ ebe a.
- source_word: οὐ κενὴ γέγονεν
  choice: abụghị ihe efu
  rationale: '“Ihe efu” na-echekwa obosara nke κενή: ọbịbịa ahụ abụghị nke na-enweghị uru, ihe ọ rụpụtara, ma ọ bụ isi; a zere ịkọwa ya naanị dịka “enweghị mkpụrụ.”'
theological_decisions:
- issue: Otu e si sụgharịa ἀδελφοί mgbe a na-agwa ọgbakọ nwere ndị nwoke na ndị nwanyị
  choice: ụmụnna
  alternative: ụmụnna nwoke; ụmụnna nwoke na ụmụnna nwanyị
  rationale: “Ụmụnna” n’Igbo bụ okwu na-akwanyere ederede ùgwù ma bụrụkwa nke nwere ike ịgụnye ọgbakọ dum. Ihe odide ala ala peeji na-eme ka nke a doo anya n’enweghị ịmanye nkọwa okpukpe pụrụ iche.
- issue: Ihe κενή pụtara n’ebe a
  choice: ihe efu
  alternative: ihe na-amịghị mkpụrụ
  rationale: “Ihe efu” na-ahapụ ntakịrị obosara na esemokwu dị n’okwu Grik ahụ—ma enweghị uru ma enweghị ihe ọ rụpụtara—kama imechi ya naanị n’otu nsonaazụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwusi ike nke Αὐτοὶ site na “unu onwe unu,” ebe “ọbịbịa anyị bịakwutere unu” na-enye nghọta doro anya n’enweghị ịda ka ntụgharị okwu n’okwu.
