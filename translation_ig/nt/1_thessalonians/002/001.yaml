  terminology: '''Ụmụnna'' is an appropriate established Igbo church-register rendering for ἀδελφοί and can address the whole congregation. The footnote should identify the literal masculine expression accurately as ''ụmụnne nwoke,'' rather than label it as an alternative with a mismatched form.'
