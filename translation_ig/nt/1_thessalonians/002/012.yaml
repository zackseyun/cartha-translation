- from: na-agba unu ume, na-akasi unu obi, na-agbasikwa unu ume ike ka unu na-ebi ndụ[a] n’ụzọ kwesiri Chineke, onye na-akpọ unu ịbanye n’alaeze na ebube nke ya.[b]
  to: na-agba unu ume, na-akasi unu obi, na-arịọsikwa unu ike ka unu na-ebi ndụ[a] n’ụzọ kwesịịrị Chineke, onye na-akpọ unu ịbanye n’alaeze ya na ebube ya.[b]
  rationale: The revision distinguishes the three Greek participles more clearly and uses natural Standard Igbo for conduct worthy of God. It preserves the purpose relation, the present ‘who calls,’ the reflexive emphasis in God’s own kingdom and glory, and the explanatory footnote for the Greek walking metaphor.
