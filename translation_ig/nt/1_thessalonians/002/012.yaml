review_pass:
  verdict: revise
  source_fidelity: The purpose clause, present force of God's calling, and the coordinated kingdom-and-glory phrase are substantially represented. However, the rendering of μαρτυρόμενοι as “na-agbasikwa unu ume ike” is both repetitive after παρακαλοῦντες and less precise than the source's solemn insistence/appeal. The expression for living worthily also needs idiomatic Standard Igbo spelling and syntax.
  naturalness: The draft is generally clear, but “na-agbasikwa unu ume ike” sounds cumbersome and semantically overlaps with “na-agba unu ume.” “n’ụzọ kwesiri Chineke” lacks the standard form kwesịrị and is not the most natural construction for ‘worthily of God.’
  terminology: Use “na-arịọsikwa unu ike” for the solemn appeal of μαρτυρόμενοι, distinguished from encouragement and consolation. “n’ụzọ kwesịịrị Chineke” naturally conveys conduct fitting/worthy of God without adding a doctrinal interpretation. “alaeze ya na ebube ya” makes clear that the possessive applies to both coordinated nouns.
  issues:
  - severity: medium
    issue: μαρτυρόμενοι is rendered with a phrase that largely repeats the sense of παρακαλοῦντες.
    rationale: “na-agbasikwa unu ume ike” is awkward and means intensified encouragement; μαρτυρόμενοι in this context has the force of solemnly urging/insisting.
  - severity: medium
    issue: The phrase for ἀξίως τοῦ θεοῦ is nonstandard and awkwardly formed.
    rationale: “kwesiri” should be “kwesịrị,” and “n’ụzọ kwesịịrị Chineke” more naturally expresses a manner of life fitting/worthy of God.
  - severity: low
    issue: The possessive in the final coordinated phrase can be made clearer.
    rationale: Rendering both nouns with “ya” reflects that ἑαυτοῦ governs both ‘kingdom’ and ‘glory.’
