  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παρακαλοῦντες ὑμᾶς καὶ παραμυθούμενοι καὶ μαρτυρόμενοι, εἰς τὸ ⸀περιπατεῖν ὑμᾶς ἀξίως τοῦ θεοῦ τοῦ καλοῦντος ὑμᾶς εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: ig
  text: na-agba unu ume, na-akasi unu obi, na-arịọsikwa unu ike ka unu na-ebi ndụ[a] n’ụzọ kwesịịrị Chineke, onye na-akpọ unu ịbanye n’alaeze ya na ebube ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ n’ụzọ nkịtị, “ka unu na-eje ije”; “ije ije” bụ ihe atụ nke ụzọ mmadụ si ebi ndụ na omume ya.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị akụkụ mbụ ahụ, “na-adụ unu ọdụ, na-akasi unu obi, na-arịọsikwa unu ike.” Ngwaa atọ ahụ nwere echiche ndị na-adakọrịta: ịgba ume, nkasi obi, na arịrịọ siri ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: na-agba unu ume
  rationale: Ọ na-egosi ọrụ Pọl na ndị ibe ya nọgidere na-arụ n’etiti ha dịka nna; okwu a na-anụ nke ọma n’Igbo ma na-eburu echiche agbamume na ndụmọdụ siri ike.
- source_word: παραμυθούμενοι
  choice: na-akasi unu obi
  rationale: Nke a na-edobe ọdịiche dị n’etiti ịgba ume na ikasi obi, ma na-egosi okwu ọma e ji enye onye nkwado.
- source_word: μαρτυρόμενοι
  choice: na-agbasikwa unu ume ike
  rationale: N’ebe a, ngwaa ahụ pụtara ịrịọsi ike ma ọ bụ ịgba mmadụ akaebe n’ụzọ dị nsọ; ntụgharị a na-egosi ịdị arọ nke arịrịọ ahụ n’Igbo nkịtị.
- source_word: εἰς τὸ περιπατεῖν
  choice: ka unu na-ebi ndụ
  rationale: Ọ bụ ahịrịokwu na-egosi ebumnuche ma ọ bụ ihe a chọrọ ka ọ pụta. Kama ịsụgharị ‘ije ije’ n’ụzọ nwere ike ịpụta naanị ije ụkwụ n’Igbo, ‘ibi ndụ’ na-enye ihe atụ ahụ pụtara banyere omume mmadụ.
- source_word: ἀξίως τοῦ θεοῦ
  choice: n’ụzọ kwesiri Chineke
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị mma isi kwuo ibi ndụ kwekọrọ n’ịdị ukwuu na ọkpụkpọ Chineke, n’enweghị ịgbakwụnye echiche na-adịghị n’isi mmalite.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: onye na-akpọ unu
  rationale: Oge ugbu a na-edobe ọdịdị participle Grik ahụ ma ghara ikpebi nkuzi pụrụ iche banyere oge ma ọ bụ usoro ọkpụkpọ ahụ.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: ịbanye n’alaeze na ebube nke ya
  rationale: ‘Ịbanye’ na-eme ka εἰς pụta ìhè n’Igbo, ebe ‘nke ya’ na-edobe ike ἑαυτοῦ. A hapụrụ alaeze na ebube ka ha bụrụ ihe abụọ jikọrọ ọnụ dịka na Grik.
theological_decisions:
- issue: Ma a ga-edobe ihe atụ περιπατεῖν dịka ‘ije ije’ ma ọ bụ kọwaa ya dịka ụzọ ndụ
  choice: Jiri ‘na-ebi ndụ’ n’isi okwu, tinye ‘na-eje ije’ na nkọwa ala peeji
  alternative: ka unu na-eje ije n’ụzọ kwesiri Chineke
  rationale: N’Igbo nke oge a, ‘ije ije’ nwere ike ime ka onye na-agụ ya chee naanị ije ụkwụ. ‘Ibi ndụ’ na-ezipụta ihe atụ ahụ pụtara, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik.
- issue: Ike na oge nke τοῦ καλοῦντος ὑμᾶς
  choice: onye na-akpọ unu
  alternative: onye kpọrọ unu; onye nọ na-akpọ unu
  rationale: Nke a na-egosipụta present participle ahụ n’ụzọ dị mfe ma ghara ịmanye nghọta ụka pụrụ iche banyere oge ma ọ bụ arụmọrụ ọkpụkpọ Chineke.
- issue: Mmekọrịta βασιλείαν na δόξαν
  choice: alaeze na ebube nke ya
  alternative: alaeze ya dị ebube
  rationale: Grik jikọtara aha abụọ ahụ dịka ihe abụọ kwekọrọ; ịgbanwe ya ka ‘ebube’ kọwaa ‘alaeze’ ga-ewepụ esemokwu na ohere nghọta dị n’isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ibi ndụ’ karịa ntụgharị nkịtị ‘ije ije’ n’isi okwu maka nghọta ozugbo, ma e debere ihe atụ ahụ na nkọwa ala peeji. Usoro ngwaa atọ ahụ na-echekwa ụda ọrụ nna nke amaokwu gbara ya gburugburu.
