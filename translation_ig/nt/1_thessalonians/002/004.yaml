language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: ig
  text: Kama, dịka Chineke nwalechara anyị ma kwado anyị ka e tinye ozi ọma ahụ n’aka anyị, otu a ka anyị si ekwu okwu—ọ bụghị dị ka ndị na-eme ihe na-atọ mmadụ ụtọ, kama dị ka ndị na-eme ihe na-atọ Chineke ụtọ[a], onye na-enyocha obi anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, okwu a dị mkpirikpi: “ọ bụghị dị ka ndị na-eme ihe na-atọ mmadụ ụtọ, kama Chineke.” E kwuru “ime ihe na-atọ ụtọ” naanị n’akụkụ mbụ, ma a ghọtara ya n’akụkụ nke abụọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: nwalee anyị ma kwado anyị
  rationale: 'Ngwakọta a na-egosipụta ma nyocha ahụ ma nsonaazụ ya, ya bụ na Chineke kwadoro ha. Ọ na-enyekwa echiche nke perfect passive: nyocha e mere nke nsonaazụ ya ka dị.'
- source_word: πιστευθῆναι
  choice: tinye ozi ọma ahụ n’aka anyị
  rationale: Nke a bụ ụzọ Igbo si ekwu na e nyere mmadụ ihe dị mkpa ka ọ na-elekọta ya; ọ naghị agbagwoju ya anya na ‘ikwere ozi ọma.’
- source_word: τὸ εὐαγγέλιον
  choice: ozi ọma ahụ
  rationale: ‘Ozi ọma’ bụ okwu Igbo doro anya ma guzosie ike maka εὐαγγέλιον; njirimara ‘ahụ’ na-egosipụta definite article.
- source_word: οὕτως λαλοῦμεν
  choice: otu ahụ ka anyị si ekwu okwu
  rationale: Ọ na-ejikọta otú ha si ekwu okwu na nkwado na ọrụ Chineke nyere ha n’ahịrịokwu bu ụzọ.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: ọ bụghị iji mee ihe ga-atọ ndị mmadụ ụtọ
  rationale: Nke a bụ Igbo sitere n’okike nke na-egosipụta na ebumnuche ha abụghị ịchọ ihu ọma mmadụ.
- source_word: ἀλλὰ θεῷ
  choice: kama iji mee ihe ga-atọ Chineke ụtọ
  rationale: A gbakwụnyere ngwaa a ghọtara n’akụkụ nke abụọ ka Igbo wee doo anya ma bụrụ nke sitere n’okike; ihe odide Grik dị mkpirikpi ka a kọwara n’akwụkwọ nkọwa ala peeji.
- source_word: τῷ δοκιμάζοντι
  choice: onye na-enyocha
  rationale: Present participle na-egosi ọrụ Chineke na-aga n’ihu. ‘Na-enyocha’ dabara n’obi nke a na-eleba anya n’ime ya, ma ka na-edobe echiche nke δοκιμάζω.
- source_word: τὰς καρδίας ἡμῶν
  choice: obi anyị
  rationale: ‘Obi’ na-edobe ihe okwu Akwụkwọ Nsọ a pụtara banyere ime mmadụ, kama ibelata ya ka ọ bụrụ naanị uche ma ọ bụ mmetụta.
theological_decisions:
- issue: Otu e si sụgharị ọdịiche dị n’etiti ime ihe na-atọ mmadụ ụtọ na ime ihe na-atọ Chineke ụtọ
  choice: ọ bụghị iji mee ihe ga-atọ ndị mmadụ ụtọ, kama iji mee ihe ga-atọ Chineke ụtọ
  alternative: ọ bụghị dị ka ndị na-eme ihe na-atọ ndị mmadụ ụtọ, kama Chineke
  rationale: Grik kwuru ‘ime ihe na-atọ ụtọ’ naanị n’akụkụ mbụ ma hapụ ya ka a ghọta ya n’akụkụ nke abụọ. Ịhapụ ya otú ahụ n’Igbo nwere ike ime ka ihe ahụ ghara ido anya ma ọ bụ mee ka a ghọta ‘kama Chineke’ n’ụzọ na-ezighị ezi. Ya mere, isiokwu ahụ kọwara ngwaa ahụ n’akụkụ abụọ, ebe nkọwa ala peeji na-echekwa mkpụmkpụ nke Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Tinye ... n’aka anyị’ bụ akpaalaokwu sitere n’okike maka inyefe mmadụ ihe ka ọ na-elekọta. A gbasara ntụnyere ikpeazụ ntakịrị iji zere ahịrịokwu Igbo na-edoghị anya, ma nkọwa ala peeji na-egosi usoro Grik dị mkpirikpi.
