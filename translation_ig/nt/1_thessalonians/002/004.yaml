revisions:
- from: Kama, dị nnọọ ka Chineke si nwalee anyị ma kwado anyị, wee tinye ozi ọma ahụ n’aka anyị, otu ahụ ka anyị si ekwu okwu—ọ bụghị iji mee ihe ga-atọ ndị mmadụ ụtọ, kama iji mee ihe ga-atọ Chineke ụtọ[a], onye na-enyocha obi anyị.
  to: Kama, dịka Chineke nwalechara anyị ma kwado anyị ka e tinye ozi ọma ahụ n’aka anyị, otu a ka anyị si ekwu okwu—ọ bụghị dị ka ndị na-eme ihe na-atọ mmadụ ụtọ, kama dị ka ndị na-eme ihe na-atọ Chineke ụtọ[a], onye na-enyocha obi anyị.
  rationale: The revision clarifies that God's testing and approval qualified the speakers to be entrusted with the gospel, rather than merely narrating successive actions. It also restores the source's participial contrast while retaining clear modern Igbo. The footnote accurately notes the Greek ellipsis and supports the explicit second half in the main text.
  reviewer_model: gpt-5.6-terra
