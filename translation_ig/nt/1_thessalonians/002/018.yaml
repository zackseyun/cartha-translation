source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: ig
  text: N’ihi na anyị chọrọ ịbịakwute unu—mụ onwe m, Pọl, ihe karịrị otu ugboro[a]—ma Setan gbochiri anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “otu ugboro na ugboro abụọ”; nke a bụ akpaalaokwu pụtara na ọ bụghị naanị otu ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara okwu bu ya ụzọ; “N’ihi na” na-egosi njikọ nkọwa na ihe kpatara ya n’Igbo doro anya.
- source_word: ἠθελήσαμεν
  choice: anyị chọrọ
  rationale: θέλω ebe a na-egosi ọchịchọ ma ọ bụ mkpebi ime ihe; “anyị chọrọ” bụ okwu Igbo nkịtị nke na-anaghị etinye ihe karịrị ihe dị na isi mmalite.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: ịbịakwute unu
  rationale: Nke a na-echekwa echiche nke ịgakwuru ndị Tesalonaịka n’etinyeghị “ileta” ma ọ bụ “ịlọghachikwute,” bụ́ nkọwa ndị gbara ya gburugburu nwere ike ime ka a ghọta.
- source_word: ἐγὼ μὲν Παῦλος
  choice: mụ onwe m, Pọl
  rationale: Ọ na-ekewapụ Pọl n’ime “anyị” ma na-enye “mụ” ike kwesịrị ekwesị, n’agbanyeghị na μέν enweghị akụkụ δέ sochiri ya n’ahịrịokwu a.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: ihe karịrị otu ugboro[a]
  rationale: Akpaalaokwu ahụ pụtara n’ụzọ nkịtị “otu ugboro na ugboro abụọ,” ya bụ na Pọl chọrọ ịbịa ọ bụghị naanị otu ugboro. Nsụgharị a na-enye echiche ahụ n’Igbo eke, ebe nkọwa ala peeji na-edobe ọdịdị okwu mbụ.
- source_word: ἐνέκοψεν
  choice: gbochiri
  rationale: “Gbochiri” na-egosi igbochi ụzọ ma ọ bụ ime ka ebumnobi ghara ịga n’ihu, na-enweghị ịkọwa kpọmkwem otú mgbochi ahụ si mee.
- source_word: ὁ Σατανᾶς
  choice: Setan
  rationale: “Setan” bụ aha a na-ejikarị eme ihe n’Igbo maka aha/utu aha onye ahụ, ma na-echekwa na ederede ahụ na-ekwu maka onye na-eme ihe.
theological_decisions:
- issue: Ọrụ Setan n’ịkwụsị njem Pọl
  choice: ma Setan gbochiri anyị
  alternative: ma Onye Mmegide ahụ gbochiri anyị
  rationale: Isi mmalite kpọrọ Setan aha ma kwuo na ọ bụ ya mere mgbochi ahụ. Nsụgharị ahụ na-edobe ọrụ onye ahụ n’emeghị ka ọ bụrụ naanị ọnọdụ nkịtị, ma ọ bụ kọwaa ihe kpatara na otú o si gbochie ha karịa ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. E tinyere “chọrọ ịbịa” ọzọ n’etiti ahịrịokwu iji mee ka mgbanwe sitere na “anyị” gaa na “mụ onwe m, Pọl” doo anya n’Igbo, ebe a na-echekwa nkwusi ike na Pọl n’onwe ya.
