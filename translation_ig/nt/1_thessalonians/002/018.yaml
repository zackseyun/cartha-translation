revisions:
- from: N’ihi na anyị chọrọ ịbịakwute unu—mụ onwe m, Pọl, chọrọ ịbịa ihe karịrị otu ugboro[a]—ma Setan gbochiri anyị.
  to: N’ihi na anyị chọrọ ịbịakwute unu—mụ onwe m, Pọl, ihe karịrị otu ugboro[a]—ma Setan gbochiri anyị.
  rationale: The revision removes the repeated verb phrase while retaining the Greek’s marked transition from “anyị” to “mụ onwe m, Pọl.” “Ihe karịrị otu ugboro” gives the idiomatic sense without overstating the precise number, and the footnote preserves the literal Greek expression and its function.
