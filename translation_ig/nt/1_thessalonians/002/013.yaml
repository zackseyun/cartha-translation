id: 1TH.2.13
reference: 1 Thessalonians 2:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: ig
  text: 'N’ihi nke a kwa, anyị na-ekele Chineke mgbe niile: mgbe unu natara okwu Chineke ahụ unu nụrụ site n’aka anyị[a], unu nabatara ya ọ bụghị dị ka okwu mmadụ, kama, dịka ọ dị n’ezie, dị ka okwu Chineke, nke na-arụkwa ọrụ n’ime unu ndị na-ekwere.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ozi Chineke ahụ unu nụrụ site n’aka anyị.” Usoro okwu Grik a jikọtara ọtụtụ echiche ọnụ, a pụkwara ịkọwa ya n’ụzọ karịrị otu n’Igbo.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịghọta okwu ikpeazụ a ka ọ na-ezo aka na Chineke: “onye na-arụkwa ọrụ n’ime unu ndị na-ekwere.”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: n’ihi nke a
  rationale: Na-edobe njikọ nke ihe kpatara e ji ekele Chineke na ihe e kwuru tupu amaokwu a, kama ime ya naanị nkwubi okwu.
- source_word: εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως
  choice: anyị na-ekele Chineke mgbe niile
  rationale: Ụdị a bụ Igbo dị mfe ma dị ugwu, na-egosikwa omume ekele nke na-aga n’ihu ugboro ugboro.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: okwu Chineke ahụ unu nụrụ n’ọnụ anyị
  rationale: A kọwara usoro Grik ahụ e jikọtara ọnụ n’ụzọ Igbo si ada nke ọma. Ọ na-egosi na ọ bụ okwu Chineke nke ndị Tesalonaịka nụrụ site n’aka ndị ozi, n’emebighị ntụnyere dị n’etiti okwu mmadụ na okwu Chineke.
- source_word: παραλαβόντες ... ἐδέξασθε
  choice: mgbe unu natara ... unu nabatara ya
  rationale: A na-eji “natara” egosi ịnata ozi e nyefere ha, ebe “nabatara” na-egosi na ha ji obi ha kweta ma were ya; nke a na-echekwa ọdịiche dị n’etiti ngwaa Grik abụọ ahụ.
- source_word: οὐ λόγον ἀνθρώπων
  choice: ọ bụghị dị ka okwu mmadụ
  rationale: “Okwu mmadụ” bụ ụzọ Igbo dị ndụ isi gosipụta okwu sitere n’aka ụmụ mmadụ n’ozuzu ha, na-edobekwa ntụnyere ahụ nke ọma.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: kama dị ka ihe ọ bụ n’ezie—okwu Chineke
  rationale: 'Na-echekwa nkwenye siri ike nke ahịrịokwu Grik: ọ bụghị nanị na ha lere ya anya dị ka okwu Chineke, kama ọ bụ ya n’ezie.'
- source_word: ἐνεργεῖται
  choice: na-arụkwa ọrụ
  rationale: Na-egosipụta ike na omume nke na-aga n’ihu, n’agbanyeghị na ụdị ngwaa Grik ahụ agaghị ekpebi kpọmkwem ma a ga-aghọta ya dị ka middle ka ọ bụ passive.
- source_word: τοῖς πιστεύουσιν
  choice: ndị na-ekwere
  rationale: Na-edobe omume okwukwe nke present participle ma bụrụkwa okwu Igbo nkịtị ma doo anya.
theological_decisions:
- issue: Ihe ὃς na-ezo aka na ya
  choice: 'A tụgharịrị ya ka ọ na-ezo aka n’“okwu Chineke”: “nke na-arụkwa ọrụ.”'
  alternative: 'A pụkwara ịghọta ya ka ọ na-ezo aka na Chineke: “onye na-arụkwa ọrụ n’ime unu ndị na-ekwere.”'
  rationale: ὃς kwekọrọ na λόγος n’ụdị nwoke, otu, ma “okwu” bụkwa ihe dị ya nso ozugbo. Otú ọ dị, θεός nwekwara ụdị nwoke, otu, ya mere e debere nghọta nke ọzọ na nkọwa ala peeji kama ikpochapụ mgbagwoju anya ahụ.
- issue: Ike okwu λόγον θεοῦ
  choice: okwu Chineke
  alternative: ozi Chineke
  rationale: “Okwu Chineke” na-echekwa ntụnyere kpọmkwem dị n’etiti λόγον ἀνθρώπων na λόγον θεοῦ, na-agbakwụnyeghị ozizi sara mbara karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “N’ọnụ anyị” bụ akpaala okwu Igbo nkịtị maka ihe mmadụ nụrụ site n’okwu ndị ọzọ. Akara ogologo ahụ na-eme ka nkwenye “okwu Chineke” pụta ìhè n’enweghị itinye nkọwa okpukpe ọzọ.
