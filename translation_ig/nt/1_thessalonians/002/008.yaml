    text: Ma ọ bụ, “mkpụrụobi anyị onwe anyị,” ma ọ bụ, “onwe anyị kpamkpam.” N’ebe a, “ndụ” na-egosi na ha nyere onwe ha n’onwe ha, n’ụzọ inye onwe na ịchụ àjà.
    reason: lexical_alternative
