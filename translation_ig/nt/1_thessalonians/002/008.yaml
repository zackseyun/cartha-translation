id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: ig
  text: N’ụzọ dị otu a[a], ebe anyị na-achọsi unu ike, obi tọrọ anyị ụtọ ịkọrọ unu ọ bụghị naanị oziọma Chineke kamakwa ndụ anyị onwe anyị[b], n’ihi na unu aghọọla ndị anyị hụrụ n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu Grik a dị ụkọ dịka, “ebe anyị hụrụ unu n’anya nke ukwuu,” ma ọ bụ, “ebe agụụ unu na-agụ anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mkpụrụobi anyị onwe anyị,” ma ọ bụ, “onwe anyị kpamkpam.” N’ebe a, “ndụ” na-egosi na ha nyere onwe ha n’onwe ha, n’ụzọ inye onwe na ịchụ àjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: N’ihi ya
  rationale: Ọ na-ejikọta amaokwu a na ihe atụ nke nne na-elekọta ụmụ ya dị n’amaokwu bu ụzọ; ntụgharị a na-egosi njikọ ahụ n’Igbo nkịtị.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: ebe anyị nwere nnukwu agụụ ịhụnanya n’ebe unu nọ
  rationale: Okwu Grik a dị ụkọ na-egosi ịhụnanya miri emi na agụụ ịnọnyere ndị ahụ; nkebi a na-edobe mmetụta abụọ ahụ n’ụzọ doro anya.
- source_word: εὐδοκοῦμεν
  choice: obi dị anyị ụtọ
  rationale: Ọ na-egosi ọchịchọ na ọṅụ ime ihe ahụ, ọ bụghị nanị ikweta ime ya.
- source_word: μεταδοῦναι
  choice: ikesara ... nyekwa
  rationale: Ngwaa ahụ pụtara inye ndị ọzọ òkè n’ihe mmadụ nwere. N’Igbo, ‘ikesara’ dabara na oziọma, ebe ‘nyekwa’ na-eme ka inye onwe ha doo anya ma nọgide n’okpuru otu ngwaa Grik.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: oziọma Chineke
  rationale: ‘Oziọma’ bụ okwu Ndị Kraịst maara nke ọma, ma njikọ ‘Chineke’ na-edobe genitive Grik n’enweghị ịkọwa ma ọ bụ mechie ihe ọ pụrụ ịpụta.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: ndụ anyị onwe anyị
  rationale: N’ebe a ψυχή na-arụtụ aka ná ndụ ma ọ bụ mmadụ n’onwe ya, karịsịa n’inye onwe ha n’ịhụnanya; ‘onwe anyị’ na-edobe nkwusi ike nke ἑαυτῶν.
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere ha ji dị njikere inye oziọma na ndụ ha.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: unu aghọọla ndị anyị hụrụ n’anya nke ukwuu
  rationale: Nke a na-egosi ọnọdụ ọhụrụ ha bịara nwee n’ebe ndịozi ahụ nọ ma na-ebupụta ịhụnanya mmekọrịta dị na okwu Grik ahụ.
theological_decisions:
- issue: Ihe ψυχάς pụtara n’okwu banyere inye onwe ndịozi
  choice: ndụ anyị onwe anyị
  alternative: mkpụrụobi anyị onwe anyị; onwe anyị kpamkpam
  rationale: Ọnọdụ okwu a bụ nlekọta na inye onwe ha n’ihi ndị Tesalonaịka, ọ bụghị nkuzi banyere nkewa ahụ na mkpụrụobi. ‘Ndụ’ na-egosipụta inye onwe ha n’ezie ma ghara ịmanye echiche nkà mmụta okpukpe na-adịghị n’ihu ebe a.
- issue: Ike okwu ἀγαπητοὶ
  choice: ndị anyị hụrụ n’anya nke ukwuu
  alternative: ndị anyị hụrụ n’anya; ndị anyị ji kpọrọ ihe
  rationale: Nhọrọ a na-edobe ịhụnanya miri emi na mmekọrịta mmadụ nke okwu ahụ, n’enweghị ime ka ọ bụrụ aha nkà mmụta okpukpe pụrụ iche.
- issue: Njikọ nke participle ὁμειρόμενοι na isi ngwaa
  choice: ebe anyị nwere nnukwu agụụ ịhụnanya n’ebe unu nọ
  alternative: n’ihi na anyị nwere nnukwu agụụ ịhụnanya n’ebe unu nọ
  rationale: Participle ahụ nwere ike ịkọwa ọnọdụ ma ọ bụ ihe kpatara omume ahụ. ‘Ebe’ na-edobe njikọ ahụ n’ụzọ na-adịghị emechi ambiguity ahụ kpamkpam.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Oziọma’ bụ okwu ụka a maara ebe niile; ‘nnukwu agụụ ịhụnanya’ na-ebupụta mmetụta okwu Grik dị ụkọ n’enweghị ịtụkwasị ya n’otu nkọwa naanị. Akara nkọwa ala ala [a] na [b] dị n’ederede isi.
