revisions:
- from: N’ihi ya[a], ebe anyị nwere nnukwu agụụ ịhụnanya n’ebe unu nọ, obi dị anyị ụtọ ikesara unu ọ bụghị naanị oziọma Chineke, kama nyekwa unu ndụ anyị onwe anyị[b], n’ihi na unu aghọọla ndị anyị hụrụ n’anya nke ukwuu.
  to: N’ụzọ dị otu a[a], ebe anyị na-achọsi unu ike, obi tọrọ anyị ụtọ ịkọrọ unu ọ bụghị naanị oziọma Chineke kamakwa ndụ anyị onwe anyị[b], n’ihi na unu aghọọla ndị anyị hụrụ n’anya.
  rationale: The revision restores the adverbial force of οὕτως with ‘N’ụzọ dị otu a,’ uses a more natural Igbo expression for ὁμειρόμενοι while retaining its possible circumstantial/causal connection, and removes unsupported intensification in the final relational clause. The theological and lexical sense of the gospel, lives, and affection remains unchanged.
  reviewer_model: gpt-5.6-terra
