review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal sense, but its verbal aspect is inconsistent with the Greek: ἐργαζόμενοι is a present participle accompanying the aorist ἐκηρύξαμεν. The revision renders the work as ongoing while retaining the past event of proclamation. The purpose clause and the singular-inclusive force of τινα ὑμῶν are retained.'
  naturalness: “N’ihi na unu na-echeta” and “ụmụnna” are natural Standard Igbo. “Ịbụ ibu arọ nye onye ọ bụla n’ime unu” is more idiomatic and precise than “ịbụ onye ọ bụla n’ime unu ibu arọ.” The temporal and purpose relationships are made clearer without adding meaning.
  terminology: “Oziọma nke Chineke” appropriately preserves τὸ εὐαγγέλιον τοῦ θεοῦ without resolving the genitive beyond the source. “Ọrụ siri ike” and “ndọgbu” maintain the paired force of κόπος and μόχθος. A footnote is added for the congregation-inclusive contextual use of ἀδελφοί, parallel to the English audit trail.
  issues:
  - severity: medium
    issue: The draft has “anyị rụrụ ọrụ” (completed past work) but “anyị na-ekwusara” (ongoing present proclamation).
    rationale: The Greek has an ongoing participle, ἐργαζόμενοι (“working”), in connection with an aorist main verb, ἐκηρύξαμεν (“we proclaimed”). The Igbo should not reverse this relationship.
  - severity: medium
    issue: “ka anyị ghara ịbụ onye ọ bụla n’ime unu ibu arọ” is awkward and can momentarily suggest becoming one of them.
    rationale: “Ka anyị ghara ịbụ ibu arọ nye onye ọ bụla n’ime unu” clearly expresses the intended sense of not burdening any person among them.
  - severity: low
    issue: The draft’s theological rationale says a footnote clarifies the inclusive contextual force of ἀδελφοί, but no such footnote is present.
    rationale: Adding a concise contextual note aligns the delivered text with its stated decision and the English audit trail.
