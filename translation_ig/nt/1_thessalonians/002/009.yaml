- from: 'N’ihi na unu na-echeta[a], ụmụnna, ndọgbu onwe anyị na ihe isi ike anyị: anyị rụrụ ọrụ ehihie na abalị ka anyị ghara ịbụ onye ọ bụla n’ime unu ibu arọ, mgbe anyị na-ekwusara unu oziọma nke Chineke.'
  to: 'N’ihi na unu na-echeta[a], ụmụnna[b], ọrụ siri ike anyị na ndọgbu anyị: mgbe anyị na-arụ ọrụ n’abalị na n’ehihie ka anyị ghara ịbụ ibu arọ nye onye ọ bụla n’ime unu, anyị kpọsara unu oziọma nke Chineke.'
  rationale: 'The revision corrects the tense/aspect relationship, uses an idiomatic expression for imposing a burden, and supplies the missing contextual footnote for “ụmụnna.” It preserves the source’s sequence: the Thessalonians remember the missionaries’ strenuous labor and hardship; while working night and day in order not to burden anyone, they proclaimed God’s gospel to them.'
