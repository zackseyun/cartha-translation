id: 1TH.2.9
reference: 1 Thessalonians 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: ig
  text: 'N’ihi na unu na-echeta[a], ụmụnna[b], ọrụ siri ike anyị na ndọgbu anyị: mgbe anyị na-arụ ọrụ n’abalị na n’ehihie ka anyị ghara ịbụ ibu arọ nye onye ọ bụla n’ime unu, anyị kpọsara unu oziọma nke Chineke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “chetanụ.” Ụdị ngwaa Grik a nwekwara ike ịdị ka iwu, ma n’ebe a o yikarịrị ka ọ bụ nkwupụta: “unu na-echeta.”'
    reason: grammatical_alternative
  - marker: b
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ pụtara kpọmkwem “ụmụnna nwoke,” ma n’ebe a o nwere ike ịdị na-agwa ọgbakọ niile okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: unu na-echeta
  rationale: Ọ bụ ngwaa dị n’ụdị ugbu a, onye nke abụọ ọtụtụ; ya mere, a sụgharịrị ya dịka nkwupụta, ọ bụghị iwu.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa e ji akpọ ndị otu ezinụlọ ma ọ bụ ndị otu okwukwe; ọ nwekwara ike ịgụnye ọgbakọ niile n’enweghị ịgbasa okwu Grik n’ahịrị isi.
- source_word: κόπον
  choice: ndọgbu onwe anyị
  rationale: Ọ na-egosi ọrụ siri ike nke chọrọ nnukwu mgbalị, ma na-edobe ọdịiche ya na μόχθος.
- source_word: μόχθον
  choice: ihe isi ike anyị
  rationale: Nhọrọ a na-egosi ahụhụ na nsogbu jikọrọ ọrụ ahụ, ma ghara ikwughachi κόπος.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ehihie na abalị
  rationale: Nke a bụ usoro okwu Igbo doro anya na nke ebumpụta ụwa maka ọrụ a na-arụ mgbe niile; mgbanwe n’usoro okwu anaghị agbanwe ihe ọ pụtara.
- source_word: ἐργαζόμενοι
  choice: anyị rụrụ ọrụ
  rationale: Ọ na-akọwa ọnọdụ ha nọ na ya mgbe ha na-ekwusa oziọma, n’asụsụ Igbo kwụ ọtọ.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί
  choice: ka anyị ghara ịbụ ... ibu arọ
  rationale: Ọ na-echekwa ebumnuche dị na okwu Grik ma na-ekwupụta ibu ego ma ọ bụ mkpa ndụ n’ụzọ Igbo na-ada nke ọma.
- source_word: τινα ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: Nke a bụ ntụgharị Igbo doro anya nke okwu Grik na-ekwu banyere onye ọbụla n’etiti ha.
- source_word: ἐκηρύξαμεν
  choice: anyị na-ekwusara
  rationale: “Ikwusa” na-echekwa echiche nke ịkpọsa ozi n’ihu ọha, na-enweghị ime ka ọ bụrụ naanị okwu ụka pụrụ iche.
- source_word: εἰς ὑμᾶς
  choice: unu
  rationale: E tinyere ya dịka onye a na-agwa ozi ahụ, nke na-echekwa ntụziaka “nye unu” dị na Grik n’ụzọ Igbo dị mfe.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: oziọma nke Chineke
  rationale: A hapụrụ njikọ “nke Chineke” ka o nwee ike igosi isi mmalite, inwe, ma ọ bụ ọdịnaya n’enweghị ịkọwa ya otu ụzọ naanị.
theological_decisions:
- issue: Mmetụta ἀδελφοί nke nwere ike ịgụnye ọgbakọ niile
  choice: Jiri “ụmụnna” n’ahịrị isi
  alternative: ụmụnna nwoke na ụmụnna nwanyị
  rationale: Okwu Grik bụ ụdị ọtụtụ nke nwoke, ma n’ọnọdụ a o nwere ike ịkpọ ọgbakọ niile. “Ụmụnna” bụ okwu Igbo na-echekwa okwu ikwu nwanne ma nwee ike ịgụnye mmadụ niile; nkọwa ala peeji na-eme ka nke a doo anya.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “oziọma” dịka okwu Ndị Kraịst maara nke ọma, ebe a zere okwu siri ike ma ọ bụ nke otu ụka pụrụ iche.
