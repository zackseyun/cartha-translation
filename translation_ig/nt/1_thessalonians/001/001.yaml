    text: Ma ọ bụ, “Jizọs Kraịst.” Okwu Grik Χριστός pụtara “Mesaya”; ọtụtụ nsụgharị na-edegharị ya dịka “Kraịst.”
    reason: alternative_reading
  - marker: b
