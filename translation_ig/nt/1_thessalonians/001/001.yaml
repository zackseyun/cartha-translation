revisions:
- from: 'Pọl na Saịvanọs na Timoti na-edegara ọgbakọ[b] ndị Tesalonaịka nọ n’ime Chineke Nna na Onyenwe Jizọs bụ́ Mesaya[a] akwụkwọ: Ka amara na udo dịrị unu.'
  to: 'Pọl na Silvanọs na Timoti na-edegara ọgbakọ[b] ndị Tesalonaịka nọ n’ime Chineke Nna na Onyenwe Jizọs bụ́ Mesaya[a] akwụkwọ: Ka amara na udo dịrị unu.'
  rationale: Revised only the transliteration of Silvanus to reflect Σιλουανός directly and clarified the lexical footnote for ἐκκλησία. The wording otherwise preserves the source syntax and theological openness, including ἐν as ‘n’ime’ and Χριστός as ‘Mesaya.’
