  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: ig
  text: 'Pọl na Silvanọs na Timoti na-edegara ọgbakọ[b] ndị Tesalonaịka nọ n’ime Chineke Nna na Onyenwe Jizọs bụ́ Mesaya[a] akwụkwọ: Ka amara na udo dịrị unu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs Kraịst.” Okwu Grik Χριστός pụtara “Mesaya”; ọtụtụ nsụgharị na-edegharị ya dịka “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ụka.” Okwu Grik ἐκκλησία na-ekwu maka ọgbakọ ma ọ bụ nnọkọta ndị kpọkọtara ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: Pọl
  rationale: Ụdị aha Παῦλος a na-ejikarị eme ihe n’Igbo, nke na-ada nke ọma n’ọnụ ndị na-agụ Igbo.
- source_word: Σιλουανὸς
  choice: Saịvanọs
  rationale: E si n’ụdị Grik Σιλουανός sụgharịa aha ahụ ozugbo, kama iji ‘Saịlas,’ bụ́ nke na-anọchi ụdị Grik ọzọ.
- source_word: Τιμόθεος
  choice: Timoti
  rationale: Ụdị aha Τιμόθεος a maara nke ọma ma dị mfe nghọta n’Igbo.
- source_word: ἐκκλησίᾳ
  choice: ọgbakọ
  rationale: ‘Ọgbakọ’ na-egosi obodo ndị kwere ekwe zukọrọ ọnụ, bụ́ isi echiche okwu Grik a; ihe odide ala peeji na-enye ‘ụka’ dịka nhọrọ ọzọ.
- source_word: Θεσσαλονικέων
  choice: ndị Tesalonaịka
  rationale: Ọ na-akọwa ndị bi na Tesalonaịka ma ọ bụ ndị obodo ahụ; ụdị a dị nkenke ma doo anya n’Igbo.
- source_word: ἐν
  choice: n’ime
  rationale: E debere echiche nke ‘ịnọ n’ime’ iji chekwaa asụsụ Pọl banyere njikọ ha na Chineke na Onyenwe Jizọs, n’akọwaghị ya karịa ihe Grik kwuru.
- source_word: θεῷ πατρὶ
  choice: Chineke Nna
  rationale: Grik enweghị nnọchiaha nke pụtara ‘anyị’; ya mere, a gbakwụnyeghị ‘anyị’.
- source_word: κυρίῳ
  choice: Onyenwe
  rationale: ‘Onyenwe’ bụ nsụgharị kwesịrị ekwesị nke κύριος ebe a, na-agbakwụnyeghị nnọchiaha ‘anyị’ nke na-adịghị na Grik.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jizọs bụ́ Mesaya
  rationale: ‘Mesaya’ na-ebupụta ihe aha-ọrụ Χριστός pụtara, ebe ‘bụ́’ na-eme ka aha-ọrụ ahụ bụrụ Igbo dị mma ma doo anya.
- source_word: χάρις
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo a na-ejikarị asụgharị χάρις ma na-echekwa ihe ọ pụtara n’ekele Pọl.
- source_word: εἰρήνη
  choice: udo
  rationale: ‘Udo’ na-echekwa ma ihe okwu Grik ahụ pụtara ma ụda ekele ndị Juu na nke Ndị Kraịst oge mbụ.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Ka amara na udo dịrị unu
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo ọchịchọ ekele ahụ, ebe ọ na-echekwa amara, udo, na ndị a na-agwa okwu.
theological_decisions:
- issue: Nsụgharị Χριστός n’ekele ahụ
  choice: Mesaya
  alternative: Kraịst
  rationale: ‘Mesaya’ na-echekwa ihe aha-ọrụ Grik ahụ pụtara kama nanị idegharị ụda ya; ihe odide ala peeji na-egosi ụdị omenala ‘Kraịst.’
- issue: Njikọ nke ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ na-egosi
  choice: Ọgbakọ ahụ ‘nọ n’ime’ Chineke Nna na Onyenwe Jizọs bụ́ Mesaya
  alternative: Ọgbakọ ahụ bụ nke Chineke Nna na Onyenwe Jizọs bụ́ Mesaya
  rationale: ‘Nọ n’ime’ na-echekwa okwu na mgbagwoju echiche nke Pọl banyere ọnọdụ ma ọ bụ njikọ ọgbakọ ahụ, kama ịkọwa ya naanị dịka inwe ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘na-edegara … akwụkwọ’ iji mee ka usoro ekele akwụkwọ ozi nke na-enweghị ngwaa na Grik bụrụ Igbo zuru oke. E zere ‘Onyenwe anyị’ n’ihi na Grik enweghị ‘anyị,’ ma debe ‘n’ime’ ka a ghara idozi ihe ἐν pụtara n’otu ụzọ naanị.
