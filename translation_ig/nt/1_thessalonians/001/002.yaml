  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: ig
  text: Anyị na-ekele Chineke mgbe niile n’ihi unu niile, na-akpọtụ unu aha n’ekpere anyị n’akwụsịghị akwụsị[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’usoro okwu Grik, “n’akwụsịghị akwụsị” nwere ike ịkọwa kpọmkwem ịkpọtụ ha aha n’ekpere, ma ọ bụ kọwaa okwu ekele ahụ dum: “Anyị na-ekele Chineke n’akwụsịghị akwụsị ...”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: Anyị na-ekele
  rationale: Okwu a bụ ngwaa dị n’ụdị ugbu a, onye mbụ ọtụtụ. “Anyị na-ekele” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwupụta ekele a na-enye Chineke.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: Dative a na-egosi onye a na-enye ekele; n’usoro okwu Igbo, “na-ekele Chineke” na-egosi nke a nke ọma n’enweghị preposition ọzọ.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Nke a na-eburu echiche nke ime ihe mgbe niile, ma bụrụ okwu Igbo nkịtị na nke doro anya.
- source_word: περὶ πάντων ὑμῶν
  choice: n’ihi unu niile
  rationale: περί ya na genitive na-egosi ndị ekele ahụ metụtara. “N’ihi unu niile” bụ okwu Igbo e ji ekwu ekele n’ụzọ ebumpụta ụwa, ma na-echekwa ike nke πάντων, “unu niile.”
- source_word: μνείαν ποιούμενοι
  choice: na-akpọtụ unu aha
  rationale: Nkebi okwu a pụtara n’ụzọ nkịtị ime ka a kpọtụ mmadụ aha, karịsịa n’ekpere. “Na-akpọtụ unu aha” na-echekwa idiom ahụ karịa naanị “na-echeta unu,” ebe “unu” sitere n’ihe gbara ya gburugburu.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: n’ekpere anyị
  rationale: ἐπί ya na genitive n’idiom a na-ezo aka n’oge ma ọ bụ n’ime ekpere. “N’ekpere anyị” bụ ntụgharị Igbo dị mkpirikpi, doro anya, ma bụrụ nke ebumpụta ụwa.
- source_word: ἀδιαλείπτως
  choice: n’akwụsịghị akwụsị
  rationale: Okwu a na-egosi ịdịgide na ime ihe ugboro ugboro n’enweghị ịkwụsị. Nhọrọ a na-echekwa ike okwu Grik ma na-adịkwa mma n’Igbo.
