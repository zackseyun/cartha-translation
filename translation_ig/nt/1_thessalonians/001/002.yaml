translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ na kọma n’ọgwụgwụ n’ihi na echiche ya gara n’ihu n’amaokwu na-esote; e chekwakwara mgbagwoju anya nke ebe ἀδιαλείπτως na-adabere site n’akwụkwọ nkọwa.
