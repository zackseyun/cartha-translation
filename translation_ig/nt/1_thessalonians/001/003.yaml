id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: ig
  text: anyị na-echeta ọrụ nke okwukwe unu[a], ọrụ ike nke ịhụnanya unu, na ntachi obi nke olileanya unu n’Onyenwe anyị Jizọs, bụ Mesaya[b], n’ihu Chineke anyị, onye bụ Nna anyị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “okwukwe” ebe a dị ka “ikwesi ntụkwasị obi” ma ọ bụ “ntụkwasị obi.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ Khristos, ya bụ “Mesaya”; a na-asụgharịkwa ya “Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: anyị na-echeta
  rationale: Ọ bụ nkebi ngwaa na-aga n’ihu site n’amaokwu bu ụzọ; okwu a na-egosi ncheta na-aga n’ihu n’asụsụ Igbo dị mfe.
- source_word: ἔργου
  choice: ọrụ
  rationale: “Ọrụ” na-edobe ihe okwu Grik pụtara ma na-akwado usoro okwu atọ Pọl ji mee ihe.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ ntụgharị nkịtị nke πίστις; njikọ mkpụrụokwu ahụ ka na-ekwe ka a ghọta ya dị ka ọrụ sitere n’okwukwe ma ọ bụ nke okwukwe ji mara.
- source_word: κόπου
  choice: ndọgbu
  rationale: “Ndọgbu” na-egosi ọrụ siri ike na mgbalị dị ukwuu, bụ́ isi ike dị na κόπος.
- source_word: ἀγάπης
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa ntụgharị kwesịrị ekwesị nke ἀγάπη.
- source_word: ὑπομονῆς
  choice: ntachi obi
  rationale: “Ntachi obi” na-egosi ịnọgide guzosie ike mgbe ihe siri ike, n’enweghị itinye nkọwa karịrị nke okwu Grik.
- source_word: ἐλπίδος
  choice: olileanya
  rationale: Ọ bụ ntụgharị Igbo a na-ahụkarị nke ἐλπίς, nke na-egosi atụmanya e ji obi sie ike.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: n’Onyenwe anyị Jizọs, bụ Mesaya
  rationale: “N’Onyenwe anyị” na-egosipụta Onyenwe ahụ olileanya ha dabeere na ya; “Mesaya” na-edobe Χριστός dị ka utu aha, ebe “bụ” na-eme ka okwu ahụ bụrụ Igbo ebumpụta ụwa.
- source_word: ἔμπροσθεν
  choice: n’ihu
  rationale: Okwu a na-egosi ịnọ n’ihu ma ọ bụ n’ọdịdị ọnụnọ Chineke n’ụzọ dị nkenke.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: Chineke anyị na Nna anyị
  rationale: Nke a na-agbaso njikọ aha abụọ dị na Grik ma na-edobe Chineke na Nna dị ka otu onye a na-ekwu maka ya.
theological_decisions:
- issue: Ntụgharị Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka utu aha, ya mere “Mesaya” na-egosi ihe ọ pụtara; a debere ụdị a maara nke ọma, “Kraịst,” n’ala peeji.
- issue: Ihe πίστις pụtara na τῆς πίστεως
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi
  rationale: “Okwukwe” bụ isi ntụgharị dabara n’ebe a, ma πίστις nwekwara ike ibu echiche nke ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi; e debere ohere ndị ahụ n’ala peeji.
- issue: Njikọ olileanya na Onyenwe anyị Jizọs
  choice: olileanya unu nwere n’Onyenwe anyị Jizọs
  alternative: olileanya nke Onyenwe anyị Jizọs
  rationale: Genitive ahụ nwere ike ịkọwa onye olileanya ahụ dabeere na ya; “n’Onyenwe anyị” na-ekwupụta njikọ a n’Igbo n’enweghị ịkọwa olileanya ahụ karịa ihe ederede nyere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu atọ—ọrụ, ndọgbu, na ntachi obi—ma zere ịgbasa njikọ genitive ndị ahụ n’ụzọ ga-emechi nghọta ndị ederede Grik ka na-ekwe omume.
