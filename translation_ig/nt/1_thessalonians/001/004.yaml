  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰδότες, ἀδελφοὶ ἠγαπημένοι ὑπὸ ⸀θεοῦ, τὴν ἐκλογὴν ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/004.yaml
  text: For we know[a], brothers loved by God, your election[b],
translation:
  language: ig
  text: N’ihi na anyị maara nhọpụta unu[a], ụmụnna ndị Chineke hụrụ n’anya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na Chineke họọrọ unu.” Okwu Grik bụ aha, “nhọpụta”; ebe a, ọ naghị akọwa usoro ozizi pụrụ iche banyere otú nhọpụta ahụ si arụ ọrụ.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: n’ihi na anyị maara
  rationale: Ọ bụ participle pụtara ‘ebe anyị maara’ ma ọ bụ ‘n’ihi na anyị maara.’ N’ọnọdụ a, ntụgharị a na-egosi na okwu ahụ na-enye ihe kpatara nkwupụta Pọl, ma na-ada nke ọma n’Igbo.
- source_word: ἀδελφοὶ
  choice: ụmụnna
  rationale: ‘Ụmụnna’ bụ okwu Igbo ebumpụta ụwa e ji akpọ ndị otu okwukwe, ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị n’enweghị ịgbanwe echiche okwu Grik ahụ n’ebe a.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: Chineke hụrụ n’anya
  rationale: Nke a na-echekwa passive agent—ọ bụ Chineke hụrụ ha n’anya—ma na-eji okwu Igbo doro anya, dị ugbu a.
- source_word: ἐκλογὴν ὑμῶν
  choice: na ọ họọrọ unu
  rationale: Ọ bụ ezie na Grik ji aha ἐκλογή, Igbo na-ekwukarị echiche a nke ọma site n’ahịrịokwu ngwaa ‘ọ họọrọ unu.’ Nke a na-echekwa eziokwu nke ịhọrọ ha n’ebughị usoro ozizi pụrụ iche bata na ya.
theological_decisions:
- issue: Otu e si sụgharịa ἐκλογή n’ebe echiche ozizi dị iche iche na-arụ ụka
  choice: na ọ họọrọ unu
  alternative: nhọpụta unu
  rationale: ‘Ọ họọrọ unu’ na-egosi ihe ederede ahụ kwuru n'ụzọ Igbo nkịtị, ma ọ naghị akọwa ụzọ, oge, ma ọ bụ ntọala nke nhọpụta ahụ. N’ihi ya, ọ na-ahapụ esemokwu na mgbagwoju anya nke ederede ahụ ka ọ dị.
- issue: Ma ἀδελφοί ọ̀ ga-abụ okwu na-ezo naanị aka n’ụmụ nwoke
  choice: ụmụnna
  alternative: ụmụnna nwoke
  rationale: N’akwụkwọ ozi Pọl, okwu a na-akpọkarị ọgbakọ ndị kwere ekwe niile. ‘Ụmụnna’ bụ okwu Igbo kwesịrị ekwesị nke na-enye echiche mmekọrịta ezinụlọ ma nwee ike ịgụnye ọgbakọ niile.
translation_notes:
  register: Ejiri Standard Igbo dị mfe, dị ugwu, ma bụrụ nke ndị nkịtị ga-aghọta. Ahịrịokwu ahụ bụ akụkụ nke sentensị malitere n’amaokwu bu ya ụzọ, ya mere e debere ya n’ụdị na-aga n’ihu ma mechie ya na rikoma.
