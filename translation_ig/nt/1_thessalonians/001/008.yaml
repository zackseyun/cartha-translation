- from: N’ihi na okwu Onyenwe anyị esila n’aka unu daa ụda[a], ọ bụghị naanị na Masedonia na Akaịa, kama n’ebe niile ka okwukwe unu n’ebe Chineke nọ gbasaruru, nke mere na ọ dịghị anyị mkpa ikwu ihe ọ bụla.
  to: N’ihi na okwu Onyenwe anyị esitewo n’aka unu resaa ụda[a], ọ bụghị naanị na Masedonia na Akaịa, kama okwukwe unu n’ebe Chineke nọ eruola ebe niile, nke mere na anyị enweghịkwa mkpa ikwu ihe ọ bụla.
