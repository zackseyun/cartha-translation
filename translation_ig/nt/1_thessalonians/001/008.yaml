id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: ig
  text: N’ihi na okwu Onyenwe anyị esitewo n’aka unu resaa ụda[a], ọ bụghị naanị na Masedonia na Akaịa, kama okwukwe unu n’ebe Chineke nọ eruola ebe niile, nke mere na anyị enweghịkwa mkpa ikwu ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “esitewo n’aka unu adaala ụda.” Okwu Grik ahụ na-enye echiche nke ụda na-esi n’otu ebe apụta ma na-eru ebe dị anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήχηται
  choice: esila n’aka unu daa ụda
  rationale: Nke a na-edobe ihe atụ nke ụda siri n’otu ebe pụta wee ruo ebe dị anya, ma na-egosikwa ọnọdụ nke ihe ahụ rụpụtara ka dị ugbu a.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: okwu Onyenwe anyị
  rationale: 'Nke a bụ okwu Pọl ji eme ihe nke na-ahapụ njikọ genitive ahụ ka ọ ghere oghe ntakịrị: okwu sitere n’aka Onyenwe anyị ma ọ bụ okwu banyere ya.'
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: Masedonia na Akaịa
  rationale: A sụgharịghị aha ógbè ndị a; e dere ha n’ụdị kwekọrọ n’usoro ụda Igbo.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: kama n’ebe niile
  rationale: Nke a bụ ụzọ Igbo dị ire ụtọ isi gosipụta na ọ ruru ebe ọ bụla, n’agbanyeghị na Grik ji aha pụtara ‘ebe ọ bụla’ kpọmkwem.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: okwukwe unu n’ebe Chineke nọ
  rationale: ‘Okwukwe’ na-egosipụta πίστις, ebe ‘n’ebe Chineke nọ’ na-echekwa ntụziaka nke πρὸς n’ụzọ Igbo na-ada nke ọma, n’enweghị ịgbanwe ya naanị ka ọ bụrụ ‘okwukwe na Chineke.’
- source_word: ἐξελήλυθεν
  choice: gbasaruru
  rationale: Nke a na-egosipụta na akụkọ banyere okwukwe ha apụtala ruo ọtụtụ ebe, ma na-ezere ahịrịokwu Igbo na-adịghị eke nke nsụgharị okwu n’otu n’otu ga-eweta.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: nke mere na ọ dịghị anyị mkpa
  rationale: Nke a na-egosipụta nsonaazụ nke ὥστε na-eweta n’ụzọ Igbo doro anya.
- source_word: λαλεῖν τι
  choice: ikwu ihe ọ bụla
  rationale: Nke a bụ okwu Igbo nkịtị ma ziri ezi maka echiche nke ‘ikwu ihe ọ bụla,’ n’etinyeghị nkwusi ike ọzọ.
theological_decisions:
- issue: Nsụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’ebe a, okwu ahụ na-elekwasị anya ná nzaghachi ndị Tesalonaịka nke ikwere na ịtụkwasị Chineke obi, ọ bụghị n’ịbụ ndị a pụrụ ịtụkwasị obi. ‘Okwukwe’ dabara nke ọma ma na-edobe okwu nkà mmụta okpukpe a maara nke ọma.
- issue: Mmekọrịta okwukwe ahụ na Chineke na πρὸς τὸν θεόν
  choice: okwukwe unu n’ebe Chineke nọ
  alternative: okwukwe unu na Chineke
  rationale: Nhọrọ a na-echekwa echiche ntụziaka dị na πρὸς (‘n’ebe... nọ’) kama idozi ya kpamkpam dị ka okwukwe ‘na’ Chineke; e tinyere nkọwa ala peeji maka ụzọ ọzọ a pụrụ isi ghọta ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke ụda na ntụziaka okwukwe ‘n’ebe Chineke nọ’ ka ha wee dị nso n’usoro na nghọta nke Grik, ebe a họọrọ ‘gbasaruru’ iji mee ka ahịrịokwu ahụ bụrụ Igbo eke.
