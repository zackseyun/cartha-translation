  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: ig
  text: Nke mere na unu ghọrọ ihe nlereanya nye ndị niile kwere ekwe na Masedonia nakwa na Akaịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụkpụrụ” ma ọ bụ “ihe atụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: nke mere na
  rationale: Ọ na-egosi ihe si n’ịnabata okwu ahụ na iṅomi ndị ozi pụta; okwu a na-ada nke ọma n’Igbo ma na-echekwa echiche nke ihe rụpụtara.
- source_word: γενέσθαι
  choice: unu ghọrọ
  rationale: Ọ na-egosi na ndị Tesalonaịka bịara bụrụ ihe nlereanya; iji ngwaa zuru ezu dị mma ma doo anya n’Igbo.
- source_word: ὑμᾶς
  choice: unu
  rationale: Ọ bụ nnọchiaha mmadụ nke abụọ n’ọnụọgụ ọtụtụ, na-ezo aka n’ọgbakọ ndị Tesalonaịka.
- source_word: τύπον
  choice: ihe nlereanya
  rationale: N’ebe a ọ pụtara ihe atụ kwesịrị ka ndị ọzọ gbasoo ma ọ bụ ṅomie. “Ihe nlereanya” bụ okwu Igbo doro anya ma kwekọọ n’echiche ahụ.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: nye ndị niile kwere ekwe
  rationale: Partisipi ahụ na-arụ ọrụ dị ka aha ndị mmadụ; ntụgharị a na-egosi ndị niile nwere okwukwe, ebe “nye” na-egosipụta ndị ihe nlereanya ahụ baara uru.
- source_word: ἐν τῇ Μακεδονίᾳ
  choice: na Masedonia
  rationale: Ọ bụ nkebiokwu na-egosi ebe, ya bụ ógbè Masedonia.
- source_word: καὶ ἐν τῇ Ἀχαΐᾳ
  choice: na Akaịa
  rationale: Ọ na-ejikọta ógbè nke abụọ na nke mbụ; “na” na-arụ ọrụ dị ka ma njikọ ma akara ebe n’Igbo a.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ihe nlereanya” na-echekwa echiche τύπος dịka ihe atụ ndị ọzọ kwesịrị ịgbaso, ebe ndetu ala peeji na-egosi ụzọ ndị ọzọ e nwere ike isi ghọta okwu ahụ.
