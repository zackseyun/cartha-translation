id: 1TH.1.9
reference: 1 Thessalonians 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: ig
  text: N’ihi na ha onwe ha na-akọ banyere anyị ụdị ọbịbịa anyị n’ebe unu nọ siri dị[a], na otu unu si chigharịkwuru Chineke site n’arụsị, iji jeere Chineke dị ndụ na nke eziokwu ozi[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ụdị nnabata anyị nwetara n’etiti unu.” Okwu Grik ahụ pụtara n'ụzọ nkịtị “ụdị ọbịbịa anyị n’ebe unu nọ,” ma ọ na-atụnyekwa aka n’ụdị na mmetụta ọbịbịa Pọl na ndị ibe ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “otu unu si tọghatara n’ebe Chineke nọ site n’arụsị.”
    reason: alternative_reading
  - marker: c
    text: Okwu a bụ “Chineke dị ndụ na nke eziokwu” na-egosi ọdịiche dị n’etiti Chineke na arụsị ndị na-adịghị ndụ; lee Jeremaịa 10:10.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: ha onwe ha
  rationale: Nkwuwa okwu a na-eme ka o doo anya na ndị ahụ n’onwe ha bụ ndị na-akọ akụkọ ahụ, n’enweghị Pọl ịkwali ha.
- source_word: ἀπαγγέλλουσιν
  choice: na-akọ
  rationale: Ọ na-egosi omume na-aga n’ihu nke ịkọsa akụkọ; okwu a bụ nke nkịtị ma doo anya n’Igbo ugbu a.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: otu ọbịbịa anyị bịakwutere unu siri bụrụ
  rationale: Nke a na-echekwa ihe oyiyi nke ‘ịbanye/ọbịbịa’ dị n’asụsụ Grik, ma na-egosikwa ụdị na mmetụta ọbịbịa ahụ n’etiti ha.
- source_word: πῶς ἐπεστρέψατε
  choice: otu unu si ... chigharịkwuru
  rationale: ‘Chigharịkwuru’ na-echekwa ihe atụ nke mmadụ ịtụgharị uche na ndụ ya gaa n’ebe ọzọ, n’etinyeghị okwu nkà mmụta okpukpe karịrị ihe ederede kwuru.
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: si n’ebe arụsị dị chigharịkwuru Chineke
  rationale: Usoro a na-egosipụta ma ebe ha si pụọ—n’ebe arụsị dị—ma ebe ha tụgharịrị gaa—n’ebe Chineke nọ.
- source_word: εἰδώλων
  choice: arụsị
  rationale: ‘Arụsị’ bụ okwu Igbo kpọmkwem na nke ndị mmadụ na-aghọta maka ihe ma ọ bụ chi ndị a na-efe kama Chineke.
- source_word: δουλεύειν
  choice: na-ejere ... ozi
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ijere Chineke ozi n’ikwesị ntụkwasị obi; nsụgharị a bụ ihe sitere n’okwu ndị ohu, ma ọ naghị emesi ịgba ohu ike karịa ka ọnọdụ a chọrọ.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: Chineke dị ndụ, bụrụkwa ezi Chineke
  rationale: Nke a na-ekewapụ Chineke n’arụsị ndị na-adịghị ndụ ma na-abụghị chi n’ezie, n’Igbo dị mfe ma dị ùgwù.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru na mbụ dịka nkọwa ma ọ bụ ihe na-akwado ya.
theological_decisions:
- issue: Ụdị ntụgharị mmadụ pụtara na ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: otu unu si n’ebe arụsị dị chigharịkwuru Chineke
  alternative: otu e si mee ka unu si n’ebe arụsị dị laghachikwuru Chineke
  rationale: E jiri usoro na-egosi na ndị ahụ tụgharịrị mee ihe n’ahịrịokwu bụ isi, dịka ngwaa Grik si dị. Ihe odide ahụ anaghị akọwa n’ebe a otú ọrụ Chineke na nzaghachi mmadụ si jikọta; ya mere, nsụgharị ahụ anaghị edozi esemokwu nkà mmụta okpukpe ahụ n’ụzọ zoro ezo.
- issue: Ike okwu δουλεύειν mgbe a na-ekwu maka Chineke
  choice: na-ejere ... ozi
  alternative: ịbụ ndị ohu Chineke
  rationale: Ngwaa ahụ sitere n’usoro okwu gbasara ohu, ma n’ebe a ọ na-egosi ofufe na nrubeisi zuru oke nye Chineke n’ọnọdụ arụsị. ‘Ijere ozi’ na-eburu isi echiche ahụ n’enweghị ịgbakwunye ịdị ike nke ‘ịgba ohu’ nke ọnọdụ a na-achọghị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ nke ịbịa na nke ịtụgharị, ma zere okwu ụka pụrụ iche. Akara ụkwụokwu niile dị n’ahịrịokwu bụ isi, n’ebe echiche nke ọ bụla metụtara dị.
