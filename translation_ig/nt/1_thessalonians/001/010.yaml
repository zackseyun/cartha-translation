    text: Ma ọ bụ, “onye na-azọpụta anyị pụọ n’iwe ahụ na-abịa.”
    reason: lexical_alternative
  revision_rationale: The revision removes the mildly explanatory “ya bụ,” makes the resurrection clause more natural while preserving divine causation and resurrection from among the dead, and supplies a correctly placed footnote for the audited lexical alternative. It does not define the coming wrath or impose a temporal interpretation on the present participle.
