id: 1TH.1.10
reference: 1 Thessalonians 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: ig
  text: na ichere Ọkpara ya ka o si n’eluigwe bịa, onye o mere ka o bilie site n’etiti ndị nwụrụ anwụ—Jizọs, onye na-anapụta anyị[a] n’iwe ahụ na-abịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-azọpụta anyị pụọ n’iwe ahụ na-abịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμένειν
  choice: ichere ... ka o ... bịa
  rationale: Nke a na-egosipụta ichere nke nwere olileanya na atụmanya, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: υἱὸν αὐτοῦ
  choice: Ọkpara ya
  rationale: Aha a na-echekwa mmekọrịta pụrụ iche nke Nna na Ọkpara n’asụsụ Igbo dị ugwu.
- source_word: ἐκ τῶν οὐρανῶν
  choice: si n’eluigwe
  rationale: Ọ bụ ụzọ Igbo nkịtị si ekwu ebe Kraịst ga-esi bịa; otu mkpụrụ okwu ‘eluigwe’ na-enye echiche ọtụtụ ‘heavens’ nke Grik n’enweghị okwu na-adịghị eke.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: onye o mere ka o si n’etiti ndị nwụrụ anwụ bilie
  rationale: Nke a na-egosipụta ma ọrụ Chineke rụrụ ma echiche ἐκ nke isi n’etiti ndị nwụrụ anwụ pụta.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: A sụgharịrị aha ahụ dịka odide Igbo a na-ejikarị eme ihe.
- source_word: τὸν ῥυόμενον
  choice: onye na-anapụta
  rationale: Nkebiokwu a na-echekwa participle dị ugbu a dịka ihe e ji mara Jizọs, n’agbanyeghị na iwe a kpọrọ aha ka na-abịa.
- source_word: ἐκ τῆς ὀργῆς
  choice: n’iwe ahụ
  rationale: ‘Iwe’ na-echekwa isi okwu ὀργή karịa ịgbasa ya ka ọ bụrụ nanị ‘ikpe’; n’Igbo, ‘ịnapụta ... n’iwe’ bụ usoro eke.
- source_word: τῆς ἐρχομένης
  choice: na-abịa
  rationale: Ọ na-echekwa echiche ihe na-erute ma na-ahapụ ụdị oge ikpeazụ ahụ n’enweghị nkọwa agbakwunyere.
theological_decisions:
- issue: Ụdị ‘iwe ahụ na-abịa’
  choice: E debere ‘iwe ahụ na-abịa’ n’enweghị ịkọwa ya kpọmkwem.
  alternative: ikpe na-abịa; mkpagbu oge ikpeazụ; ikpe ọmụma ikpeazụ
  rationale: Amaokwu ahụ akọwaghị kpọmkwem ma iwe a bụ ikpe ikpeazụ, mkpagbu oge ikpeazụ, ma ọ bụ iwe Chineke n’ụzọ sara mbara; ya mere ntụgharị ahụ anaghị etinye ozizi otu ụka.
- issue: Ike participle ῥυόμενον dị ugbu a
  choice: onye na-anapụta anyị
  alternative: onye ga-anapụta anyị; onye nọ na-anapụta anyị
  rationale: Ụdị Grik ahụ nwere ike igosi Jizọs dịka Onye Nnapụta n’onwe ya, ebe okwu banyere iwe na-abịa na-eme ka ọnọdụ ya lekwasịkwa anya n’ọdịnihu; a naghị amanye naanị otu oge.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E jiri ‘Ọkpara’ chekwaa aha Kraịst pụrụ iche, ma zere nkọwa eskatọlọjị nke otu òtù. Enweghị akara ntụaka ụkwụ n’ederede n’ihi na ntụaka ‘a’ dị na English POB adabaghị n’ebe e tinyere ya; ihe e kwuru na ya bụkwa naanị ụzọ ọzọ e si sụgharịa nkebiokwu ikpeazụ, nke a kọwara n’ime mkpebi okwu.
