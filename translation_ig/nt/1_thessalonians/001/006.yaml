revisions:
- from: Unu onwe unu ghọkwara ndị na-eṅomi anyị na Onyenwe anyị, mgbe unu nabatara okwu ahụ n’etiti ọtụtụ mkpagbu, ya na ọṅụ nke Mmụọ Nsọ[a].
  to: Unu onwe unu ghọkwara ndị na-eṅomi anyị na Onyenwe anyị, site n’ịnabata okwu ahụ n’oké mkpagbu, ya na ọṅụ nke Mmụọ Nsọ[a].
  rationale: The revision corrects the number and force of θλίψει πολλῇ, changing ‘many afflictions’ to ‘great affliction,’ and renders δεξάμενοι as a participle of means. It preserves the Greek ambiguity in χαρᾶς πνεύματος ἁγίου in the main text and retains the explanatory alternative in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:19:11Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the imitation motif, the reception of the proclaimed word, and joy associated with the Holy Spirit. However, πολλά modifies the singular θλίψει: it denotes great/much affliction, not multiple afflictions. The participle δεξάμενοι is better represented as means (''by receiving'') than as the explicitly temporal ''when.'''
  naturalness: The proposed revision retains a dignified, modern Standard Igbo register. 'Site n’ịnabata' naturally expresses the participial relationship, and 'n’oké mkpagbu' is idiomatic and matches the singular Greek noun.
  terminology: '''Ndị na-eṅomi,'' ''Onyenwe anyị,'' ''okwu ahụ,'' ''mkpagbu,'' and ''Mmụọ Nsọ'' are suitable established or clear Standard Igbo choices. ''Ọṅụ nke Mmụọ Nsọ'' appropriately preserves the Greek genitive''s open relation; the footnote supplies the source/causative sense without making it the sole meaning.'
  issues:
  - severity: medium
    issue: ‘n’etiti ọtụtụ mkpagbu’ renders θλίψει πολλῇ as plural ‘many afflictions.’
    rationale: The Greek has a singular noun, θλίψει, qualified by πολλῇ (‘much/great’). ‘N’oké mkpagbu’ preserves both the singular reference and the intensity.
  - severity: low
    issue: ‘mgbe unu nabatara’ makes δεξάμενοι explicitly temporal.
    rationale: The aorist participle most naturally explains the means/circumstance by which they became imitators. ‘Site n’ịnabata’ reflects this relationship without asserting a temporal sequence.
  revised_text: Unu onwe unu ghọkwara ndị na-eṅomi anyị na Onyenwe anyị, site n’ịnabata okwu ahụ n’oké mkpagbu, ya na ọṅụ nke Mmụọ Nsọ[a].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dị ka “ọṅụ sitere n’aka Mmụọ Nsọ,” ya bụ, ọṅụ Mmụọ Nsọ mere ka o pụta.
    reason: lexical_alternative
  revision_rationale: The revision corrects the number and force of θλίψει πολλῇ, changing ‘many afflictions’ to ‘great affliction,’ and renders δεξάμενοι as a participle of means. It preserves the Greek ambiguity in χαρᾶς πνεύματος ἁγίου in the main text and retains the explanatory alternative in the footnote.
