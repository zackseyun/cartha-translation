id: 1TH.1.6
reference: 1 Thessalonians 1:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: ig
  text: Unu onwe unu ghọkwara ndị na-eṅomi anyị na Onyenwe anyị, site n’ịnabata okwu ahụ n’oké mkpagbu, ya na ọṅụ nke Mmụọ Nsọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dị ka “ọṅụ sitere n’aka Mmụọ Nsọ,” ya bụ, ọṅụ Mmụọ Nsọ mere ka o pụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ
  choice: ndị na-eṅomi
  rationale: Nke a na-egosipụta kpọmkwem echiche nke iṅomi ma ọ bụ iwere mmadụ dịka ihe atụ, kama okwu sara mbara dịka ‘ndị na-eso ụzọ.’
- source_word: ἐγενήθητε
  choice: unu ... ghọkwara
  rationale: '‘Ghọrọ’ na-egosi mgbanwe ọnọdụ ahụ: ndị Tesalonaịka ghọrọ ndị na-eṅomi ha.'
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nsọpụrụ e ji kpọọ Jizọs n’ebe a; ‘Onyenwe anyị’ bụ nsụgharị Igbo doro anya ma guzosie ike.
- source_word: δεξάμενοι
  choice: mgbe unu nabatara
  rationale: Ọ na-ejikọta nnabata okwu ahụ na otu ha si ghọọ ndị na-eṅomi. ‘Nabatara’ na-egosikwa nnabata nwere obi ọma, ọ bụghị naanị ịnụ ihe.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: Ọ na-echekwa okwu Pọl ji, ebe ihe a na-ekwu maka ya bụ ozi ọma a kpọsara.
- source_word: ἐν θλίψει πολλῇ
  choice: n’etiti ọtụtụ mkpagbu
  rationale: ‘Mkpagbu’ na-enye echiche nke nrụgide na ahụhụ siri ike, na-enweghị itinye nkọwa pụrụ iche banyere oge ikpeazụ.
- source_word: μετὰ χαρᾶς
  choice: ya na ọṅụ
  rationale: Nke a bụ nsụgharị eke nke nkebiokwu ahụ ma na-egosi na ọṅụ so nnabata okwu ahụ.
- source_word: πνεύματος ἁγίου
  choice: nke Mmụọ Nsọ
  rationale: 'Njikọ ‘nke’ na-echekwa mgbagwoju anya dị na genitive Grik: ọ pụrụ ịbụ ọṅụ sitere n’aka Mmụọ Nsọ ma ọ bụ ọṅụ Mmụọ Nsọ rụpụtara.'
theological_decisions:
- issue: Mmekọrịta genitive dị na ‘χαρᾶς πνεύματος ἁγίου’
  choice: ọṅụ nke Mmụọ Nsọ
  alternative: ọṅụ sitere n’aka Mmụọ Nsọ / ọṅụ Mmụọ Nsọ mere ka o pụta
  rationale: ‘Nke Mmụọ Nsọ’ na-anọ nso n’usoro Grik ma na-echekwa ezigbo mgbagwoju anya ahụ; nkọwa ala peeji na-egosi nghọta nke isi iyi ma ọ bụ onye rụpụtara ọṅụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara asụsụ iṅomi nke Pọl na mgbagwoju anya nke ‘ọṅụ nke Mmụọ Nsọ.’
