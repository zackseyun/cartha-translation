revisions:
- from: n’ihi na oziọma anyị abịaghị unu naanị n’okwu, kama ọ bịakwara n’ike, n’ime Mmụọ Nsọ, na nkwenye siri ike[a], dị nnọọ ka unu maara ụdị ndị anyị gosiri na anyị bụ n’etiti unu maka ọdịmma unu.[b]
  to: n’ihi na oziọma anyị abịaghị n'ebe unu nọ naanị n’okwu, kama ọ bịakwara n’ike, n’ime Mmụọ Nsọ, na mmesi obi ike dị ukwuu[a], dị nnọọ ka unu maara ụdị ndị anyị gosiri na anyị bụ n’etiti unu n’ihi unu.[b]
  rationale: The revision improves idiomatic Standard Igbo and more closely reflects the breadth of the Greek. It retains the contextual sense of οἷοι ἐγενήθημεν as the missionaries’ demonstrated character, while preserving the closer ‘became’ alternative in the footnote. Footnote anchors remain attached to the terms they explain.
