id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: ig
  text: n’ihi na oziọma anyị abịaghị n'ebe unu nọ naanị n’okwu, kama ọ bịakwara n’ike, n’ime Mmụọ Nsọ, na mmesi obi ike dị ukwuu[a], dị nnọọ ka unu maara ụdị ndị anyị gosiri na anyị bụ n’etiti unu n’ihi unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na nkwenye siri ike” ma ọ bụ “na nnukwu ijide n’aka.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ụdị ndị anyị ghọrọ n’etiti unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: oziọma
  rationale: “Oziọma” bụ okwu Igbo a maara nke ọma maka ozi ọma Kraịst n’akwụkwọ Pọl; ọ na-edobekwa nghọta pụrụ iche nke okwu ahụ n’ebe a.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: abịaghị unu
  rationale: N’ebe a, γίνομαι na εἰς na-egosi ọbịbịa oziọma n’ebe ndị Tesalonaịka nọ; ntụgharị a bụ Igbo doro anya ma kwekọọ n’ọnọdụ izisa ozi ahụ.
- source_word: ἐν λόγῳ μόνον
  choice: naanị n’okwu
  rationale: Nke a na-edobe ọdịiche dị n’etiti okwu e kwuru nanị ya na ike na ọrụ Mmụọ Nsọ so ya.
- source_word: ἐν δυνάμει
  choice: n’ike
  rationale: Ọ na-edobe okwu dị mkpirikpi na nkwughachi nke usoro ἐν dị n’asụsụ Grik.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: n’ime Mmụọ Nsọ
  rationale: Nkebiokwu ahụ na-ezo aka na Mmụọ Nsọ, ọ bụghị naanị mmetụta ime mmụọ ma ọ bụ mmụọ mmadụ.
- source_word: πληροφορίᾳ πολλῇ
  choice: na nkwenye siri ike
  rationale: Nke a bụ Igbo dị ndụ maka nkwenye ma ọ bụ ntụkwasị obi zuru ukwuu, ma ọ naghị ekpebi kpọmkwem ma nkwenye ahụ dị n’ime ndị nkwusa, ndị nụrụ ozi ahụ, ma ọ bụ n’ụzọ ozi ahụ si bịa.
- source_word: καθὼς οἴδατε
  choice: dị nnọọ ka unu maara
  rationale: Ọ na-egosi na ihe ndị na-agụ akwụkwọ maara n’onwe ha na-akwado ihe Pọl kwuru.
- source_word: οἷοι ἐγενήθημεν
  choice: ụdị ndị anyị gosiri na anyị bụ
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka àgwà na omume Pọl na ndị ya na ha so, ọ bụghị naanị mgbanwe ha ghọrọ.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Nke a na-egosi ndụ na omume ndị ozi ahụ n’etiti ndị Tesalonaịka.
- source_word: δι’ ὑμᾶς
  choice: maka ọdịmma unu
  rationale: διά na accusative n’ebe a kacha dabara n’echiche nke ihe e mere maka uru ndị na-anụ ozi ahụ.
theological_decisions:
- issue: Ihe “Mmụọ Nsọ” na-ezo aka na ya
  choice: A tụgharịrị ya dị ka Mmụọ Nsọ, onye nke Chineke.
  alternative: mmụọ dị nsọ ma ọ bụ ike ime mmụọ
  rationale: Ojiji Pọl ji πνεῦμα ἅγιον na ọnọdụ a na ọdịiche dị n’etiti okwu nkịtị na ike na-akwado na ọ na-ezo aka na Mmụọ Nsọ.
- issue: Onye nwere πληροφορίᾳ πολλῇ
  choice: E ji “nkwenye siri ike” hapụ onye nkwenye ahụ dị n’ime ya ka ọ ghara ịbụ nke a kapịrị ọnụ.
  alternative: ntụkwasị obi zuru oke nke ndị nkwusa; ma ọ bụ nkwenye ndị natara ozi ahụ
  rationale: Asụsụ Grik ekwughị hoo haa ma nkwenye ahụ bụ nke ndị nkwusa, ndị nụrụ ozi ahụ, ma ọ bụ njirimara nke otú oziọma ahụ si bịa.
- issue: Nghọta οἷοι ἐγενήθημεν
  choice: “ụdị ndị anyị gosiri na anyị bụ” na-akọwa àgwà ndị ozi ahụ pụtara ìhè n’etiti ha.
  alternative: “ụdị ndị anyị ghọrọ”
  rationale: “Gosiri na anyị bụ” bụ Igbo eke n’ọnọdụ a, ma ihe odide ala peeji na-echekwa ntụgharị nke na-esochi γίνομαι nso karị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro ọdịiche ahụ—okwu, ike, Mmụọ Nsọ, na nkwenye—ka ọ pụta ìhè, ma e zere ịkọwa onye nwere nkwenye ahụ karịa ihe Grik kwuru.
