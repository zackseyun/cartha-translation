  terminology: “Onye nkwusa,” “onye ozi,” and “onye ozizi” provide a natural parallel rendering of κῆρυξ, ἀπόστολος, and διδάσκαλος. The revised footnote explains the public-herald sense without substituting a potentially misleading modern occupational term.
