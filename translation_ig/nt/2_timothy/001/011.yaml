  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος καὶ ⸀διδάσκαλος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/011.yaml
  text: for which I was appointed a herald and an apostle and a teacher[a].
translation:
  language: ig
  text: Ọ bụ maka ozi ọma a ka a họpụtara m ịbụ onye nkwusa[a], onye ozi, na onye ozizi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-ekwusa ozi n’ihu ọha.” Okwu Grik a pụtara onye e nyere ọrụ ikwusa ma ọ bụ kpọsa ozi n’ihu ọha.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: maka ozi ọma a
  rationale: Nkebiokwu a na-arụtụ aka n’ozi ọma e kwuru okwu ya n’amaokwu bu ụzọ. Ịkpọ ‘ozi ọma’ aha n’Igbo na-eme ka njikọ ahụ doo anya n’enweghị ịgbanwe ihe ọ na-ekwu.
- source_word: ἐτέθην
  choice: a họpụtara m
  rationale: N’ebe a, τίθημι n’ụdị nnara na-egosi ịhọpụta ma ọ bụ inye mmadụ ọrụ, ọ bụghị naanị idowe ya n’otu ebe.
- source_word: ἐγὼ
  choice: m
  rationale: Nnọchiaha ahụ pụtara ìhè n’asụsụ Grik, ma ụdị Igbo a na-egosi onye a na-ekwu maka ya nke ọma n’enweghị itinye nkwusi ike na-adịghị mkpa.
- source_word: κῆρυξ
  choice: onye nkwusa
  rationale: Okwu a bụ maka onye e nyere ọrụ ikwusa ozi n’ihu ọha. ‘Onye nkwusa’ bụ okwu Igbo doro anya ma dị ugbu a, ma ihe odide ala peeji na-echekwa echiche nke onye mgbasa ozi e nyere ikike.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: N’ebe Pọl na-ekwu banyere onwe ya, okwu a na-arụ ọrụ dị ka aha ọrụ a maara nke onye Kraịst zitere; ‘onyeozi’ bụ nsụgharị Igbo kwesịrị ekwesị.
- source_word: διδάσκαλος
  choice: onye ozizi
  rationale: Nke a bụ okwu Igbo nkịtị na nke doro anya maka onye na-akụzi ihe.
theological_decisions:
- issue: Ma a ga-asụgharị κῆρυξ dịka onye nkwusa n’echiche ụka ma ọ bụ dịka onye mgbasa ozi ọha e nyere ọrụ
  choice: onye nkwusa, tinyere nkọwa ala peeji banyere ọrụ onye mgbasa ozi ọha
  alternative: onye mkpọsa
  rationale: Nhọrọ a na-agụ nke ọma n’Igbo ma na-echekwa isi echiche Grik nke nkwusa e nyere ikike; nkọwa ala peeji na-egbochi ka a ghọta ya naanị dịka ọkwa ụka e mesịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edebe usoro ọrụ atọ dị na Grik, ma na-eme ka ihe εἰς ὃ na-arụtụ aka na ya—ozi ọma dị n’amaokwu bu ụzọ—pụta nke ọma.
