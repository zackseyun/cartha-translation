source:
  edition: SBLGNT
  text: Οἶδας τοῦτο ὅτι ἀπεστράφησάν με πάντες οἱ ἐν τῇ Ἀσίᾳ, ὧν ἐστιν Φύγελος καὶ Ἑρμογένης.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/015.yaml
  text: 'You know this: all those in Asia turned away from me[b][a], among whom are Phygelus and Hermogenes.'
translation:
  language: ig
  text: 'Ị maara nke a: ndị niile nọ n’Eshia[a] wepụrụ onwe ha n’ebe m nọ[b]; Faịgelọs na Hemọgenes sokwa n’ime ha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Eshia” n’ebe a bụ ógbè ọchịchị Rom dị n’ọdịda anyanwụ Eshia Maịnọ, ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “hapụrụ m” / “gbahapụrụ m.” N’ụzọ kpọmkwem, Grik ahụ na-ekwu na ha “chigharịrị n’ebe m nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδας
  choice: Ị maara
  rationale: Οἶδας nwere ike ugbu a nke na-egosi ihe onye ahụ maara; “Ị maara” bụ okwu Igbo doro anya ma bụrụ nke e ji ekwu okwu kwa ụbọchị.
- source_word: τοῦτο ὅτι
  choice: 'nke a:'
  rationale: “Nke a” na-ewebata ọdịnaya na-esochi ya, ebe akara ntụpọ abụọ na-egosipụta njikọ ahụ n’ụzọ Igbo dị mfe.
- source_word: ἀπεστράφησάν με
  choice: gbakụtara m azụ
  rationale: Nhọrọ a na-echekwa onyinyo okwu Grik nke ịtụgharị azụ n’ebe mmadụ nọ, ma na-egosikwa ịkwụsị nkwado ma ọ bụ iguzosi ike n’akụkụ ya.
- source_word: πάντες οἱ ἐν τῇ Ἀσίᾳ
  choice: ndị niile nọ n’Eshia
  rationale: Ọ na-echekwa ike nke πάντες (“niile”) n’etinyeghị nkọwa ga-amachi ya; ihe gbara amaokwu ahụ gburugburu ka na-ekpebi ìgwè a na-ekwu maka ya.
- source_word: Ἀσίᾳ
  choice: Eshia
  rationale: A na-eji aha a maara nke ọma n’Igbo, ebe nkọwa ala na ndọrọ ndọrọ ọchịchị nke oge Rom dị n’okpuru peeji.
- source_word: ὧν ἐστιν
  choice: n’ime ha ka ... nọ
  rationale: Nke a bụ usoro Igbo eke nke na-egosi na ndị a kpọrọ aha so n’ìgwè ahụ.
- source_word: Φύγελος
  choice: Faịgelọs
  rationale: A sụgharịrị ụda aha Grik Φύγελος ka o kwekọọ n’usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: Ἑρμογένης
  choice: Hamọgenes
  rationale: A sụgharịrị ụda aha Grik Ἑρμογένης n’ụzọ ga-adị mfe ịgụ na ịkpọ n’Igbo.
theological_decisions:
- issue: Oke okwu “ndị niile nọ n’Eshia”
  choice: E debere okwu zuru ezu “ndị niile” n’ahịrịokwu ahụ, ma ekweghị na nsụgharị ahụ kọwaa n’onwe ya ma ọ bụ mmadụ niile bi n’ógbè ahụ.
  alternative: Ịgbakwunye na ọ bụ naanị ndị ha na Pọl na-arụkọ ọrụ ma ọ bụ ndị na-akwado ya; ma ọ bụ ime ka ọ bụrụ mmadụ niile n’enweghị oke ọ bụla.
  rationale: πάντες nwere ike ịbụ okwu sara mbara nke ihe gbara ya gburugburu na-amachi. Idebe ya otú ahụ na-echekwa ike okwu Pọl na nghọtahie nwere ike ịdị na ya, kama idozi ya n’usoro ozizi ọ bụla.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Gbakụtara m azụ” na-echekwa onyinyo okwu Grik ma na-ada nke ọma n’Igbo. A haziri akara ụkwụ [a] na [b] n’ebe okwu nke ọ bụla metụtara dị.
