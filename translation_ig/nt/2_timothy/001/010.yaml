    text: Ma ọ bụ, “Jizọs Kraịst.” Okwu Grik ahụ bụ́ Χριστός pụrụ ịbụ aha-ọrụ (“Mesaya”) ma ọ bụ bụrụ akụkụ aha a na-akpọkarị ya (“Kraịst”).
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “anwụghị anwụ.” Okwu Grik ahụ na-emesi ọnọdụ nke ihe na-adịghị ere ure ma ọ bụ emebi emebi ike.
    reason: lexical_alternative
  revision_rationale: Retained the complete verse because it is faithful and natural overall. Revised footnote b only, replacing an unclear expression with idiomatic Standard Igbo that accurately states the emphasis on imperishability and freedom from corruption.
