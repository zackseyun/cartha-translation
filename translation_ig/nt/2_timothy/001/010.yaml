id: 2TI.1.10
reference: 2 Timothy 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: φανερωθεῖσαν δὲ νῦν διὰ τῆς ἐπιφανείας τοῦ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃, καταργήσαντος μὲν τὸν θάνατον φωτίσαντος δὲ ζωὴν καὶ ἀφθαρσίαν διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/010.yaml
  text: but has now been revealed through the appearing of our Savior Jesus the Messiah[a], who indeed abolished death and brought life and incorruptibility to light through the gospel[b],
translation:
  language: ig
  text: ma ugbu a, e meela ka ọ pụta ìhè site n'ọbịbịa nke Onye Nzọpụta anyị, Jizọs bụ́ Mesaya[a], onye kagburu ọnwụ ma mee ka ndụ na enweghị ire ure pụta ìhè site n'oziọma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs Kraịst.” Okwu Grik ahụ bụ́ Χριστός pụrụ ịbụ aha-ọrụ (“Mesaya”) ma ọ bụ bụrụ akụkụ aha a na-akpọkarị ya (“Kraịst”).
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “anwụghị anwụ.” Okwu Grik ahụ na-emesi ọnọdụ nke ihe na-adịghị ere ure ma ọ bụ emebi emebi ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθεῖσαν
  choice: e meela ka ọ pụta ìhè
  rationale: Na-ejigide olu nnara nke Grik ma na-ejikọkwa nke ọma na amara Chineke a kpọtụrụ aha n'amaokwu bu ụzọ.
- source_word: ἐπιφανείας
  choice: ọbịbịa
  rationale: N'ọnọdụ a ọ na-ezo aka n'ọbịbịa Jizọs nke mere ka a hụ ya; okwu a bụ nke doro ndị na-agụ Igbo anya karịa ntụgharị mkpụrụokwu nke pụrụ ịdị arọ.
- source_word: σωτῆρος
  choice: Onye Nzọpụta
  rationale: Ọ bụ aha ọrụ a maara nke ọma n'Igbo, nke na-egosipụta onye na-azọpụta.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mesaya
  rationale: Χριστός ka nwere ike aha-ọrụ ebe a; ‘bụ́’ na-eme ka usoro ahụ bụrụ Igbo eke ma gosi na Mesaya bụ aha-ọrụ, ọ bụghị aha ezinụlọ.
- source_word: καταργήσαντος
  choice: kagburu
  rationale: Na-egosipụta mmeri siri ike ma zuru oke e meriri ọnwụ, n'agbanyeghị na ọ naghị ekpebi n'ụzọ karịrị ihe odide ahụ otú ọnwụ si ka arụ ọrụ n'oge ugbu a.
- source_word: θάνατον
  choice: ọnwụ
  rationale: Ọ bụ ntụgharị kpọmkwem na nke nkịtị.
- source_word: φωτίσαντος
  choice: mee ka ... pụta ìhè
  rationale: Na-egosipụta ime ka ihe a na-amaghị ma ọ bụ nke zoro ezo bụrụ ihe a maara nke ọma.
- source_word: ζωὴν
  choice: ndụ
  rationale: Ọ bụ ntụgharị kpọmkwem nke na-ahapụ ibu nzọpụta na nke ọdịnihu dị n'okwu ahụ ka ọnọdụ ya kọwaa ya.
- source_word: ἀφθαρσίαν
  choice: enweghị ire ure
  rationale: Na-echekwa isi echiche nke ihe na-adịghị emebi ma ọ bụ ree ure, kama ịkpa ya ókè naanị n'echiche nke ịdị ndụ ebighị ebi.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: site n'oziọma
  rationale: ‘Site na’ na-egosipụta ụzọ e si mee ka ihe ndị a pụta ìhè; ‘oziọma’ bụ okwu Igbo a nabatara maka ozi ọma Kraịst.
- source_word: μὲν ... δὲ
  choice: '... ma ...'
  rationale: 'Njikọ ‘ma’ na-ejikọta akụkụ abụọ ahụ n''Igbo eke: ịkagbu ọnwụ na ime ka ndụ na enweghị ire ure pụta ìhè.'
theological_decisions:
- issue: Uru Χριστοῦ dị na Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mesaya
  alternative: Jizọs Kraịst
  rationale: Ebe ọ na-esochi aha-ọrụ ‘Onye Nzọpụta anyị,’ echiche Mesaya ka dị ndụ; ihe odide ala peeji na-edebe ohere nke iji ya dịka aha a na-akpọkarị ya.
- issue: Ike καταργήσαντος n'ihe banyere ọnwụ
  choice: kagburu ọnwụ
  alternative: mere ka ọnwụ ghara ịdị ike
  rationale: ‘Kagburu’ na-echekwa nkwupụta siri ike nke Grik banyere mmeri Jizọs, ma ntụgharị ahụ anaghị agbakwụnye nkọwa banyere oge ma ọ bụ oke mmezu ya.
- issue: Ihe ἀφθαρσίαν pụtara
  choice: enweghị ire ure
  alternative: anwụghị anwụ
  rationale: Nhọrọ bụ isi na-egosipụta enweghị mmebi ma ọ bụ ire ure; ihe odide ala peeji na-edebe ntụgharị a na-ahụkarị nke na-elekwasị anya n'anwụghị anwụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe njikọ ya na amaokwu bu ụzọ, yana usoro abụọ nke ịkagbu ọnwụ na ime ka ndụ na enweghị ire ure pụta ìhè. E tinyere akara ala peeji [a] na [b] kpọmkwem n'akụkụ okwu ha na-akọwa.
