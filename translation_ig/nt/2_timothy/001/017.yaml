  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere akara ogologo ahịrị (—) n'ikpeazụ n'ihi na ahịrịokwu ahụ na-aga n'ihu na amaokwu na-esote.
