  yaml_path: translation/nt/2_timothy/001/017.yaml
  text: but when he was in Rome[a], he searched for me diligently and found me—
translation:
  language: ig
  text: Ma mgbe ọ nọ na Rom[a], o ji uchu chọọ m, wee chọta m—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mgbe ọ bịara Rom.” Okwu Grik γενόμενος, nke ejikọrọ na “na Rom,” pụrụ igosi na ọ bịara Rom ma ọ bụ nanị na ọ nọ ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Njikọ a na-egosi ọdịiche dị n'etiti omume Onesifọrọs na ihere ndị a kpọtụrụ aha n'okwu gbara ya gburugburu; “Ma” bụ ụzọ Igbo dị mfe ma kwekọọ na ya.
- source_word: γενόμενος ἐν Ῥώμῃ
  choice: mgbe ọ nọ na Rom
  rationale: Nkebi a pụrụ ịpụta na ọ bịara Rom ma ọ bụ na ọ nọ n'ebe ahụ. Nsụgharị a na-egosi ọnụnọ ya na Rom ma ghara ikpebi n'ụzọ siri ike na participle ahụ pụtara kpọmkwem ‘ọ bịarutere.’
- source_word: σπουδαίως
  choice: ji uchu
  rationale: Nke a na-egosi mbọ siri ike, nlezianya, na obi e tinyere n'ịchọ onye ahụ; “ji uchu” bụ okwu Igbo nkịtị ma doo anya.
- source_word: ἐζήτησέν με
  choice: chọọ m
  rationale: ζητέω n'ebe a pụtara ịchọ onye; okwu a na-edobe m dị ka onye a na-achọ.
- source_word: καὶ εὗρεν
  choice: wee chọta m
  rationale: “Wee” na-ejikọta nchọta ahụ na ihe sochiri ya, ebe ‘m’ e tinyere ọzọ na-eme ka Igbo doo anya ma na-agụ nke ọma.
