id: 2TI.1.9
reference: 2 Timothy 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦ σώσαντος ἡμᾶς καὶ καλέσαντος κλήσει ἁγίᾳ, οὐ κατὰ τὰ ἔργα ἡμῶν ἀλλὰ κατὰ ἰδίαν πρόθεσιν καὶ χάριν, τὴν δοθεῖσαν ἡμῖν ἐν Χριστῷ Ἰησοῦ πρὸ χρόνων αἰωνίων,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/009.yaml
  text: who saved us and called us with a holy calling[a], not according to our works but according to his own purpose and grace, which was given to us in Messiah Jesus before eternal ages[d][c][b],
translation:
  language: ig
  text: onye zọpụtara anyị ma jiri ọkpụkpọ dị nsọ kpọọ anyị[a], ọ bụghị dịka ọrụ anyị si dị, kama dịka nzube nke onwe ya na amara ya si dị—amara ahụ e nyere anyị n'ime Mesaya Jizọs[b] tupu oge ebighị ebi[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “kpọọ anyị n'ọkpụkpọ dị nsọ,” ma ọ bụ “kpọọ anyị site n'ọkpụkpọ dị nsọ.” Dative Grik ahụ nwere ike ịghọta n'ụzọ karịrị otu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'ime Kraịst Jizọs.” E jiri “Mesaya Jizọs” mee ihe n’ebe a n’ihi na a ghọtara Χριστός dịka aha ọkwa.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “tupu oge niile amalite,” ma ọ bụ n'ụzọ okwu kwa ụbọchị karị, “tupu oge amalite.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σώσαντος
  choice: zọpụtara
  rationale: Ngwaa a na-egosi nzọpụta Chineke; “zọpụtara” bụ okwu Igbo doro anya ma na-edobe ịdị arọ nke okwu ahụ n’echiche Pọl.
- source_word: καλέσαντος
  choice: kpọọ
  rationale: “Kpọọ” na-edobe echiche nke ọkpụkpọ sitere n’aka Chineke ma kwekọọ na participle nke ya na “zọpụtara” nọ n’usoro yiri ibe ya.
- source_word: κλήσει ἁγίᾳ
  choice: jiri ọkpụkpọ dị nsọ
  rationale: Dative Grik ahụ nwere ike igosi ụzọ e si kpọọ mmadụ, ihe a kpọrọ ya ịbanye na ya, ma ọ bụ njikọ ya na ọkpụkpọ ahụ. Nsụgharị a bụ nke eke n’Igbo, ebe nkọwa ndị ọzọ dị n’ala ala peeji.
- source_word: οὐ κατὰ τὰ ἔργα ἡμῶν
  choice: ọ bụghị dịka ọrụ anyị si dị
  rationale: Nke a na-edobe κατά dịka ụkpụrụ ma ọ bụ ntọala, ma na-echekwa “ọrụ” dịka okwu dị mkpa n’akwụkwọ Pọl.
- source_word: ἰδίαν πρόθεσιν
  choice: nzube nke ya
  rationale: “Nzube” na-egosi ebumnuche e kpebiri; “nke ya” na-ezo aka na Chineke nke a kpọtụrụ aha n’ọnọdụ gbara amaokwu a gburugburu.
- source_word: χάριν
  choice: amara ya
  rationale: “Amara” bụ okwu Igbo a na-ejikarị eme ihe maka χάρις n’echiche nke ihu ọma Chineke nke a na-enwetaghị site n’ọrụ.
- source_word: τὴν δοθεῖσαν ἡμῖν
  choice: amara ahụ e nyere anyị
  rationale: Participial phrase nke nwanyị na-ejikọta kpọmkwem na χάριν; ịkpọghachi “amara ahụ” na-eme ka onye ntụaka doo anya n’Igbo.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n'ime Mesaya Jizọs
  rationale: Χριστός ka na-arụ ọrụ dịka aha ọkwa; “Mesaya” na-ebuga ihe aha ọkwa ahụ pụtara kama ịhapụ ya dịka transliteration na-enweghị nkọwa.
- source_word: πρὸ χρόνων αἰωνίων
  choice: tupu oge ebighị ebi
  rationale: Nke a na-edobe okwu Grik pụrụ iche banyere “oge” na “ebighị ebi” n’enweghị ịkọwa ya naanị dịka “tupu oge amalite.”
theological_decisions:
- issue: Ma Χριστός bụ aha ọkwa ka ọ bụ akụkụ aha mmadụ
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a, aha ọkwa Χριστός ka nwere ihe ọ pụtara; “Mesaya” na-egosi ọrụ onye e tere mmanụ, ebe nhọrọ ọzọ bụ ụdị a na-eji eme ihe n’ọgbakọ ụfọdụ.
- issue: Ike dative dị na κλήσει ἁγίᾳ
  choice: jiri ọkpụkpọ dị nsọ kpọọ anyị
  alternative: kpọọ anyị ka anyị bata n'ọkpụkpọ dị nsọ; kpọọ anyị site n'ọkpụkpọ dị nsọ
  rationale: Grik nwere ike ịpụta ụzọ, ebe e duuru ndị a kpọrọ, ma ọ bụ mmekọrịta; ala ala peeji na-echekwa nhọrọ ndị ahụ kama imechi okwu ahụ n’otu nkọwa.
- issue: Ihe τὴν δοθεῖσαν na-ezo aka na ya
  choice: amara ahụ e nyere anyị
  alternative: nzube na amara ahụ e nyere anyị
  rationale: Nkwekọrịta grammatical nke participle nwanyị singular na χάριν na-akwado na ọ na-ezo kpọmkwem n’amara, ọ bụghị n’nzube na amara ọnụ.
- issue: Ihe πρὸ χρόνων αἰωνίων pụtara
  choice: tupu oge ebighị ebi
  alternative: tupu oge amalite
  rationale: Nhọrọ bụ isi na-edobe ụdị okwu Grik na esemokwu dị n’etiti “oge” na “ebighị ebi”; nhọrọ ọzọ bụ idiom Igbo dị mfe ma bụrụ nkọwa karịa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ọkpụkpọ” iji kewaa echiche κλῆσις pụọ na naanị omume “ịkpọ,” ma e mere ka “amara ahụ” pụta ọzọ ka njikọ grammatical doo anya. Ahịrịokwu ahụ bụ akụkụ nke ahịrịokwu malitere n’amaokwu gara aga, ya mere e debere ngwụcha rikoma.
