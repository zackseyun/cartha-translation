- from: 'Nye Timoti, nwa a hụrụ n’anya: ka amara, ebere, na udo si n’aka Chineke Nna na Mesaịa[a] Jizọs, Onyenwe anyị, bịara gị.'
  to: 'Nye Timoti, nwa a hụrụ n’anya: ka amara, ebere na udo sitere n’aka Chineke Nna na Mesaịa[a] Jizọs, Onyenwe anyị, dịrị gị.'
  rationale: The revision preserves every source-text distinction and the established decision to translate Χριστός as “Mesaịa.” It makes the greeting formula more idiomatic in modern Standard Igbo and clarifies the alternative-rendering footnote without adding interpretive content.
