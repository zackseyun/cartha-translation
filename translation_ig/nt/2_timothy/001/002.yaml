id: 2TI.1.2
reference: 2 Timothy 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τιμοθέῳ ἀγαπητῷ τέκνῳ· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/002.yaml
  text: 'To Timothy[a], beloved child: grace, mercy, and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ig
  text: 'Nye Timoti, nwa a hụrụ n’anya: ka amara, ebere na udo sitere n’aka Chineke Nna na Mesaịa[a] Jizọs, Onyenwe anyị, dịrị gị.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst Jizọs.” N’ebe a, a sụgharịrị utu aha Grik Χριστός ka ọ bụrụ “Mesaịa” iji gosi ihe ọ pụtara, kama iji ụdị ọdịnala, “Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τιμοθέῳ
  choice: Nye Timoti
  rationale: Ụdị a na-egosi onye e degaara akwụkwọ ozi ahụ n’Igbo dị mfe ma doo anya.
- source_word: ἀγαπητῷ τέκνῳ
  choice: nwa a hụrụ n’anya
  rationale: Ọ na-echekwa ma mmekọ dịka nke nne/nna na nwa nke τέκνον na mmetụta ịhụnanya dị na ἀγαπητός, n’etinyeghị ‘nwa nwoke’ ebe okwu Grik ahụ n’onwe ya akọwaghị okike.
- source_word: χάρις
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo a na-ejikarị akọwa χάρις n’ozizi na ekele Pọl.
- source_word: ἔλεος
  choice: ebere
  rationale: ‘Ebere’ na-enye kpọmkwem echiche nke obi ebere, ma na-edobe ya iche n’amara na udo.
- source_word: εἰρήνη
  choice: udo
  rationale: ‘Udo’ na-echekwa ma echiche nke ịdị ná mma na nke mmekọrịta e mere ka ọ dịghachi mma.
- source_word: ἀπὸ
  choice: si n’aka
  rationale: N’ebe a, ọ na-egosi Chineke Nna na Mesaịa Jizọs dịka isi iyi nke amara, ebere, na udo.
- source_word: θεοῦ πατρὸς
  choice: Chineke Nna
  rationale: Ọ na-agbasochi Grik nke na-enweghị ‘anyị’ na-akọwa Nna, ma bụrụkwa ụzọ dị nsọ ma dị nkenke n’Igbo.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός bụ utu aha pụtara Onye E Tere Mmanụ; ‘Mesaịa’ na-echekwa ihe utu aha ahụ pụtara kama ime ya naanị aha a sụgharịghị.
- source_word: κυρίου ἡμῶν
  choice: Onyenwe anyị
  rationale: Ọ na-echekwa ikike na ịdị elu dị na κύριος, tinyere nnọchiaha ‘anyị’ nke dị na Grik.
theological_decisions:
- issue: Nsụgharị Χριστοῦ Ἰησοῦ
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka utu aha. ‘Mesaịa’ na-eme ka ihe ọ pụtara pụta ìhè, ebe e debere ụdị ọdịnala ‘Kraịst’ n’okpuru peeji ka onye na-agụ ya mata ya.
- issue: Mmekọrịta Pọl na Timoti n’okwu τέκνῳ
  choice: nwa
  alternative: nwa nwoke
  rationale: τέκνον na-egosi mmekọrịta dịka nke nne/nna na nwa ma ọ bụghị okwu akọwapụtara kpọmkwem dịka ‘nwa nwoke’; ya mere a naghị etinye nkọwa okike karịrị nke isi mmalite.
- issue: Onye bụ isi iyi nke amara, ebere, na udo
  choice: Chineke Nna na Mesaịa Jizọs, Onyenwe anyị
  alternative: Chineke Nna anyị na Mesaịa Jizọs
  rationale: Grik jikọtara Chineke Nna na Kraịst Jizọs n’okwu ἀπό dịka isi iyi, ma ἡμῶν na-akọwa naanị ‘Onyenwe’ n’usoro okwu a; ya mere etinyeghị ‘anyị’ n’akụkụ ‘Nna.’
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ekele ‘ka ... bịara gị’ na-eme ka usoro ekele ahụ bụrụ nke eke n’Igbo, n’agbanyeghị na Grik hapụrụ ngwaa ahụ ka a ghọta ya n’onwe ya. E tinyere akara [a] ozugbo n’azụ ‘Mesaịa,’ bụ okwu ihe odide ala ala peeji ahụ na-akọwa.
