id: 2TI.1.16
reference: 2 Timothy 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δῴη ἔλεος ὁ κύριος τῷ Ὀνησιφόρου οἴκῳ, ὅτι πολλάκις με ἀνέψυξεν, καὶ τὴν ἅλυσίν μου οὐκ ἐπαισχύνθη·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/016.yaml
  text: May the Lord grant mercy to the household of Onesiphorus[a], because he often refreshed me and was not ashamed of my chain.
translation:
  language: ig
  text: Ka Onyenwe anyị nye ezinụlọ Onesifọrus ebere, n’ihi na ọtụtụ mgbe o mere ka m nweta ume ọhụrụ, agbụ m emeghịkwa ya ihere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpọrọ m”; n’ụzọ nkịtị, “agbụ m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη
  choice: Ka ... meere
  rationale: Aorist optative a na-egosi ọchịchọ ma ọ bụ ekpere; usoro “Ka ... meere” na-egosipụta nke a n’Igbo dị ugbu a.
- source_word: ἔλεος
  choice: ebere
  rationale: “Ebere” bụ okwu Igbo a na-ejikarị akọwa amara na ọmịiko Chineke n’ebe onye nọ ná mkpa nọ.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị aha nsọ κύριος nke a na-aghọta nke ọma, ma ọ naghị ekpebi kpọmkwem onye aha ahụ na-ezo aka n’ebe a.
- source_word: τῷ Ὀνησιφόρου οἴκῳ
  choice: ezinaụlọ Onesifọrọs
  rationale: οἶκος n’ebe a na-ezo aka n’ezinụlọ ma ọ bụ ndị niile nọ n’ụlọ ya, ọ bụghị naanị ụlọ dịka ihe owuwu.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara arịrịọ ebere ahụ.
- source_word: πολλάκις
  choice: ọtụtụ mgbe
  rationale: Ọ na-egosi na omume ahụ mere ugboro ugboro.
- source_word: ἀνέψυξεν
  choice: o mere ka m nweta ume ọhụrụ
  rationale: Nke a na-egosipụta inye Pọl izu ike, enyemaka, ma ọ bụ agbamume, ma na-edobe echiche ihe atụ nke inweta ume ọhụrụ.
- source_word: τὴν ἅλυσίν μου
  choice: agbụ m
  rationale: E debere ihe oyiyi pụtara ìhè nke singular ἅλυσις; n’ọnọdụ a ọ pụkwara ịnọchi anya mkpọrọ Pọl.
- source_word: οὐκ ἐπαισχύνθη
  choice: ihere ... ekwughị ya
  rationale: Akpaalaokwu Igbo a na-egosipụta na ọ dịghị eme ya ihere, ma na-edobe ike gbasara ihere n’ihu ọha.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka n’arịrịọ Pọl
  choice: E debere ya dịka “Onyenwe anyị” n’enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya kpọmkwem dịka Chineke Nna ma ọ bụ Onyenwe anyị Jizọs.
  rationale: Grik kwuru naanị ὁ κύριος; nsụgharị ekwesịghị idozi ihe amaokwu ahụ hapụrụ n’enweghị nkọwa kpọmkwem.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jiri “ezinaụlọ” gosi ndị ụlọ Onesifọrọs, ma debe “agbụ” n’ahịrị isi iji chekwaa ihe oyiyi Grik.
