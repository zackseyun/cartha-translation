id: 2TI.1.8
reference: 2 Timothy 1:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ οὖν ἐπαισχυνθῇς τὸ μαρτύριον τοῦ κυρίου ἡμῶν μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ, ἀλλὰ συγκακοπάθησον τῷ εὐαγγελίῳ κατὰ δύναμιν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/008.yaml
  text: Therefore, do not be ashamed of the testimony about our Lord, nor of me, his prisoner, but suffer hardship with the gospel according to the power of God,
translation:
  language: ig
  text: Ya mere, emela ihere maka àmà a na-agba banyere Onyenwe anyị[a], ma ọ bụ maka mụ, onye mkpọrọ ya; kama, sonyere n’ịta ahụhụ maka ozi ọma[b], dị ka ike Chineke si dị[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “àmà nke Onyenwe anyị.” Mkpụrụokwu Grik ahụ nwekwara ike ịpụta nke a, ma n’ebe a o yikarịrị ka ọ bụ àmà a na-agba banyere Onyenwe anyị.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “soro ozi ọma taa ahụhụ.” Ngwaa Grik ahụ nwere echiche nke isonyere ndị ọzọ n’ịta ahụhụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “site n’ike Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν
  choice: Ya mere, ihere emela gị
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; usoro “ihere emela gị” na-enye iwu mgbochi n’Igbo dị mfe ma kwanyere ùgwù.
- source_word: ἐπαισχυνθῇς
  choice: ihere emela gị
  rationale: Nke a na-egosi inwe ihere ma ọ bụ ịla azụ n’ihi ihe mmadụ chere na ọ ga-ewetara ya nkọcha.
- source_word: τὸ μαρτύριον τοῦ κυρίου ἡμῶν
  choice: ama a na-agba banyere Onyenwe anyị
  rationale: “Ama” na-echekwa echiche μαρτύριον, ebe “banyere” na-egosi na Onyenwe anyị bụ onye ama ahụ metụtara. A hapụrụ ụzọ ọzọ nwere ike isi ghọta genitive ahụ n’okpuru ala.
- source_word: μηδὲ ἐμὲ τὸν δέσμιον αὐτοῦ
  choice: ihere emekwala gị maka mụ onwe m, onye mkpọrọ ya
  rationale: Nke a na-ejikọta Pọl dị ka ihe nke abụọ Timoti na-ekwesịghị imere ihere, ma na-echekwa njikọ nke onye mkpọrọ ahụ na Onyenwe anyị.
- source_word: συγκακοπάθησον
  choice: sonyere n’ịta ahụhụ
  rationale: “Sonyere” na-egosipụta akụkụ συν- nke ngwaa ahụ, ya bụ ịbanye n’ahụhụ ahụ na ndị ọzọ, n’ebughị ụzọ kpọọ onye ahụ a ga-eso aha.
- source_word: τῷ εὐαγγελίῳ
  choice: maka ozi ọma
  rationale: Dative Grik ahụ dị nkenke; “maka ozi ọma” bụ ụzọ Igbo sitere n’okike si egosi ihe kpatara ahụhụ ahụ, ebe nkọwa ala na-echekwa ntụgharị dị nso n’usoro Grik.
- source_word: κατὰ δύναμιν θεοῦ
  choice: dị ka ike Chineke si dị
  rationale: Nke a na-echekwa echiche nke κατά dịka ihe kwekọrọ n’ike Chineke, n’emeghị ka ọ bụrụ naanị ụzọ e si nye ike.
theological_decisions:
- issue: Njikọ dị n’etiti “ama” na “Onyenwe anyị”
  choice: ama a na-agba banyere Onyenwe anyị
  alternative: ama nke Onyenwe anyị
  rationale: Ihe gbara amaokwu ahụ gburugburu na-akwado nghọta na ọ bụ ama Ndị Kraịst na-agba banyere Onyenwe anyị; ma ebe genitive Grik ahụ nwekwara ike ịpụta ama sitere n’aka Onyenwe anyị, e debere nke ahụ n’okpuru ala.
- issue: Ihe “onye mkpọrọ ya” pụtara
  choice: onye mkpọrọ ya
  alternative: onye e tinyere n’ụlọ mkpọrọ n’ihi ya
  rationale: Ntụgharị a na-echekwa njikọ kpọmkwem αὐτοῦ na Onyenwe anyị, n’akọwaghị ya karịa otú ihe odide ahụ si kwuo.
- issue: Ọrụ ike Chineke n’ịta ahụhụ
  choice: dị ka ike Chineke si dị
  alternative: site n’ike Chineke
  rationale: Nhọrọ bụ isi na-echekwa ohere nke κατά igosi ụkpụrụ, ókè, ma ọ bụ ike na-enyere aka; ntụgharị ọzọ na-akọwa ya kpọmkwem dịka ihe na-enye mmadụ ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. “Onyenwe anyị,” “ozi ọma,” na “ike Chineke” bụ okwu Ndị Kraịst maara nke ọma; e zere okwu ụka nke otu denominashọn kpọmkwem. Akara [a], [b], na [c] niile dị n’ahịrị amaokwu ahụ ma kwekọọ na nkọwa ala ha.
