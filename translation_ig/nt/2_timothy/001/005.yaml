id: 2TI.1.5
reference: 2 Timothy 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπόμνησιν ⸀λαβὼν τῆς ἐν σοὶ ἀνυποκρίτου πίστεως, ἥτις ἐνῴκησεν πρῶτον ἐν τῇ μάμμῃ σου Λωΐδι καὶ τῇ μητρί σου Εὐνίκῃ, πέπεισμαι δὲ ὅτι καὶ ἐν σοί.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/005.yaml
  text: having been reminded of the sincere faith in you, which first lived in your grandmother Lois and your mother Eunice, I am persuaded that it is also in you.
translation:
  language: ig
  text: Mgbe e chetaara m okwukwe na-enweghị ihu abụọ nke dị n’ime gị, bụ́ nke buru ụzọ biri n’ime nne nne gị Lọịs na nne gị Yunisi, ekwenyesiri m ike na ọ dịkwa n’ime gị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπόμνησιν λαβών
  choice: Mgbe e chetaara m
  rationale: Nke a na-egosipụta na ihe mere ka Pọl cheta bụ ihe si n’èzí bịara ya, ma na-asụkwa Igbo n’ụzọ eke.
- source_word: ἀνυποκρίτου πίστεως
  choice: okwukwe na-enweghị ihu abụọ
  rationale: Ọ na-edobe echiche nke okwukwe na-abụghị nke mmadụ na-eme ka à ga-asị na o nwere ya.
- source_word: ἐνῴκησεν
  choice: biri n’ime
  rationale: Okwu Grik ahụ pụtara ibi ma ọ bụ ido ụlọ n’ime; ‘biri n’ime’ na-echekwa ihe atụ ahụ n’ụzọ doro anya.
- source_word: πέπεισμαι
  choice: ekwenyesikwara m ike
  rationale: Ọ na-egosi nkwenye siri ike nke dị ugbu a, nke sitere n’ihe Pọl kwenyesiri ike banyere Timoti.
theological_decisions:
- issue: Ma okwukwe ahụ ọ̀ bụ otu ihe ahụ dị n’ime mmadụ atọ ahụ
  choice: E jiri otu ‘okwukwe’ ahụ mee isiokwu nke ‘biri’ na ‘dịkwa,’ n’enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya dị ka okwukwe e nyefere site n’ezinụlọ ma ọ bụ okwukwe nke onye ọ bụla n’otu n’otu.
  rationale: Grik na-ekwu na okwukwe ahụ buru ụzọ biri n’ime Lọịs na Yunisi, ma dịkwa n’ime Timoti; ntụgharị ekwesịghị ịgbakwunye ozizi banyere otú e si nyefee ya.
translation_notes:
  register: Asụsụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ihe atụ ‘biri n’ime’ nakwa nkwughachi ‘n’ime’ nke ederede Grik. A họọrọ ‘nne nne’ maka μάμμη, ya bụ nne nne Timoti, n’enweghị ịkọwa ma ọ bụ nne nne ya n’akụkụ nna ya ka ọ bụ n’akụkụ nne ya.
