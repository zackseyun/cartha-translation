  to: Mgbe e chetaara m okwukwe na-enweghị ihu abụọ nke dị n’ime gị, bụ́ nke buru ụzọ biri n’ime nne nne gị Lọịs na nne gị Yunisi, ekwenyesiri m ike na ọ dịkwa n’ime gị.
