id: 2TI.1.1
reference: 2 Timothy 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ κατ’ ἐπαγγελίαν ζωῆς τῆς ἐν Χριστῷ Ἰησοῦ
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the will of God, according to the promise of the life that is in Messiah Jesus,
translation:
  language: ig
  text: Pọl[a], onyeozi Mezaịa Jizọs site n'uche Chineke, n'ikwekọ na nkwa nke ndụ dị n'ime Mezaịa Jizọs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “Kraịst Jizọs” n'ebe abụọ ahụ e kwuru “Mezaịa Jizọs.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pọl
  rationale: Ụdị a bụ ntụgharị aha Παῦλος a na-eji n'Igbo nke oge a.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” na-echekwa echiche banyere onye e zigara ma bụrụkwa okwu Igbo a maara nke ọma maka ọrụ pụrụ iche nke ndịozi.
- source_word: Χριστοῦ Ἰησοῦ / Χριστῷ Ἰησοῦ
  choice: Mezaịa Jizọs
  rationale: Χριστός ka bụ utu aha ebe a; “Mezaịa” na-egosipụta ihe utu aha ahụ pụtara kama ime ya naanị aha. E nyere “Kraịst Jizọs” dị ka nhọrọ n'okpuru peeji.
- source_word: διὰ θελήματος θεοῦ
  choice: site n'ọchịchọ Chineke
  rationale: Nke a na-egosipụta na ọchịchọ Chineke bụ ihe mere Pọl ji bụrụ onyeozi na ikike o ji jee ozi, n'Igbo doro anya ma kwekọọ na διά tinyere genitive.
- source_word: κατ’ ἐπαγγελίαν
  choice: dị ka nkwa ... si dị
  rationale: Usoro Igbo a na-echekwa echiche nke κατά banyere ikwekọ na nkwa ahụ, n'ebughị ụzọ kpebie karịa ihe Greek kwuru banyere kpọmkwem otú nkwa ahụ na ọrụ onyeozi si metụta ibe ha.
- source_word: ζωῆς
  choice: nke ndụ ahụ
  rationale: “Ndụ ahụ” na-egosipụta ndụ a kapịrị ọnụ nke nkebiokwu na-esochi kọwara.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: dị n'ime Mezaịa Jizọs
  rationale: “Dị n'ime” na-echekwa ike mmekọrịta nke ἐν ma hapụkwa echiche banyere ịdị n'otu na Mezaịa ka ọ dị, kama ime ka ọ bụrụ nanị ndụ o nyere.
theological_decisions:
- issue: Otú e si sụgharịa Χριστός
  choice: Mezaịa
  alternative: Kraịst
  rationale: N'ebe a Χριστός na-arụ ọrụ dị ka utu aha, ya mere “Mezaịa” na-eme ka ihe ọ pụtara pụta ìhè. “Kraịst” bụkwa ntụgharị omenala ziri ezi, a hapụkwara ya n'okpuru peeji ka a ghara izochi nhọrọ ntụgharị ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere ahịrịokwu ahụ ka ọ bụrụ mmalite nke ekele akwụkwọ ozi nke na-aga n'ihu, ya mere ọ kwụsịrị na rikoma dị ka isi mmalite ahụ.
