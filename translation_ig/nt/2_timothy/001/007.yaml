base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/007.yaml
  text: For God did not give us a spirit of cowardice[b][a], but of power and love and self-control.
translation:
  language: ig
  text: N’ihi na Chineke enyeghị anyị mmụọ nke obi ụjọ[a], kama nke ike, nke ịhụnanya, na nke njide onwe onye[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụjọ” ma ọ bụ “enweghị obi ike.” Okwu Grik ahụ na-ekwu maka ụjọ ma ọ bụ enweghị obi ike nke na-egosi omume ụjọ, ọ bụghị naanị ụjọ nkịtị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “uche ziri ezi” ma ọ bụ “ịdọ onwe onye aka ná ntị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: N’ihi na ... enyeghị
  rationale: “N’ihi na” na-egosi na amaokwu a na-akọwa ma na-akwado agbamume dị n’amaokwu bu ya ụzọ; “enyeghị” na-eburu ngọnarị ahụ n’ụzọ Igbo si ekwu ya.
- source_word: ἔδωκεν ἡμῖν ὁ θεὸς
  choice: Chineke enyeghị anyị
  rationale: Usoro a bụ Igbo doro anya ma dị ire, na-egosikwa omume gara aga na onye natara onyinye ahụ.
- source_word: πνεῦμα
  choice: mmụọ
  rationale: '“Mmụọ” na-edebe ohere nke ihe okwu Grik ahụ na-ezo aka na ya: ọ pụrụ igosi ụdị mmụọ ma ọ bụ ọnọdụ ime mmadụ Chineke na-enye, n’ebughị ụzọ kpọọ ya kpọmkwem Mmụọ Nsọ.'
- source_word: δειλίας
  choice: ịla azụ n’ụjọ
  rationale: Nkebiokwu a na-egosi ụjọ na-eme ka mmadụ ghara ime ihe kwesịrị ekwesị, nke dị ike karịa ụjọ nkịtị ma na-erute echiche nke omume ụjọ ma ọ bụ enweghị obi ike.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosi ọdịiche siri ike n’etiti ihe Chineke na-enyeghị na ihe ọ na-enye.
- source_word: δυνάμεως
  choice: ike
  rationale: “Ike” bụ okwu Igbo kwụ ọtọ ma dị mma maka ikike ma ọ bụ ume e nyere mmadụ ime ihe.
- source_word: ἀγάπης
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo nke oge a, doro anya maka ἀγάπη.
- source_word: σωφρονισμοῦ
  choice: njide onwe onye
  rationale: Okwu a na-egosi ịchịkwa onwe onye na ịdị uchè n’omume; “njide onwe onye” bụ Igbo dị nkenke ma ghọta nke ọma, ebe a na-edebe ihe ndị ọzọ ọ pụrụ ịpụta n’ala ala peeji.
theological_decisions:
- issue: Ihe πνεῦμα na-ezo aka na ya
  choice: “mmụọ” n’enweghị ịkpọ ya kpọmkwem Mmụọ Nsọ
  alternative: “Mmụọ Nsọ” ma ọ bụ “Mmụọ ahụ”
  rationale: 'πνεῦμα enweghị edemede n’ebe a, ndị genitive na-esokwa ya na-akọwa àgwà ya. Ya mere, nsụgharị ahụ na-edebe mgbagwoju anya dị n’ihe odide Grik: ọ pụrụ ịbụ mmụọ ma ọ bụ ọnọdụ ime mmadụ Chineke na-enye, ma e kwesịghị imechi ụzọ na njikọ ya na ọrụ Mmụọ Nsọ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ịla azụ n’ụjọ” na-ebupụta ike dị na δειλία karịa iji naanị “ụjọ,” ebe “njide onwe onye” na-eme ka echiche σωφρονισμός doo ndị na-agụ akwụkwọ anya.
