translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E debere usoro ahịrịokwu ahụ ka ọ bụrụ akụkụ na-aga n’ihu site n’amaokwu bu ya ụzọ, dịka ọ dị n’asụsụ Grik.
