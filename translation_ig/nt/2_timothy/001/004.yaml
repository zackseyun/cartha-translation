translation:
  language: ig
  text: Ana m agụsi agụụ ike ịhụ gị[a], ebe m na-echeta anya mmiri gị, ka ọṅụ jupụta n’ime m,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ana m achọsi ike ịhụ gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιποθῶν
  choice: Ọ na-agụsi m agụụ ike
  rationale: Nke a na-egosi ọchịchọ ịhụ mmadụ nke siri ike ma nwee mmetụta miri emi, n’asụsụ Igbo nkịtị ma dị ugwu.
- source_word: σε ἰδεῖν
  choice: ịhụ gị
  rationale: Ọ na-egosipụta n'ụzọ kwụ ọtọ na ihe Pọl na-agụ agụụ ya bụ ịhụ Timoti.
- source_word: μεμνημένος
  choice: ebe m na-echeta
  rationale: Nkebi a na-egosi na ncheta ahụ ka dị Pọl n’obi ma na-aga n’ihu n’oge ọ na-agụ agụụ ịhụ Timoti.
- source_word: σου τῶν δακρύων
  choice: anya mmiri gị
  rationale: Nke a bụ nsụgharị kpọmkwem nke na-ekwu maka anya mmiri Timoti, n’enweghị ịkọwa ọnọdụ ahụ karịa ihe isi mmalite kwuru.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a bụ ụzọ Igbo si egosipụta ebumnuche ma ọ bụ ihe a tụrụ anya na ọ ga-esi na ya pụta, na-ahapụghị ntakịrị ohere abụọ ahụ isi mmalite nwere.
- source_word: χαρᾶς πληρωθῶ
  choice: ọṅụ wee ju m obi
  rationale: Nke a bụ akpaalaokwu Igbo dị ndụ maka ịbụ onye ọṅụ jupụtara, ma na-edobe echiche nke πληρόω n’enweghị nsụgharị siri ike na-adịghị eke.
