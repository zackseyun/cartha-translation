source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν ἀναμιμνῄσκω σε ἀναζωπυρεῖν τὸ χάρισμα τοῦ θεοῦ, ὅ ἐστιν ἐν σοὶ διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/006.yaml
  text: For this reason I remind you to rekindle the gift of God that is in you through the laying on of my hands[a].
translation:
  language: ig
  text: N’ihi nke a, ana m echetara gị ka i kpalite onyinye Chineke nke dị n’ime gị ọzọ, site n’ịbịkwasị m gị aka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka i mee ka ọ bụrụ ire ọkụ ọzọ.” Ngwaa Grik ahụ na-enye onyinyo nke ịkpali ọkụ ka ọ nwuo ọzọ nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: N’ihi nke a
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a iji chekwaa njikọ na ihe e kwuru tupu ya.
- source_word: ἀναμιμνῄσκω
  choice: ana m echetara gị
  rationale: Nke a na-egosi ngwaa nke oge dị ugbu a ma na-ada nke ọma n’Igbo.
- source_word: σε ἀναζωπυρεῖν
  choice: ka i mee ka ... nwughachi ọzọ dịka ọkụ
  rationale: Ọ na-echekwa ihe atụ Grik nke ime ka ọkụ na-ada ada nwughachi, na-egosighị na onyinye ahụ akwụsịla kpamkpam.
- source_word: τὸ χάρισμα τοῦ θεοῦ
  choice: onyinye Chineke
  rationale: Ọ na-egosipụta onyinye sitere n’amara Chineke n’enweghị ịgbakwunye nkọwa dịka ‘onyinye ime mmụọ’ nke ederede ahụ ekwughị kpọmkwem.
- source_word: ὅ ἐστιν ἐν σοὶ
  choice: nke dị n’ime gị
  rationale: Ọ na-echekwa echiche na onyinye ahụ nọ ugbu a n’ime Timoti.
- source_word: διὰ τῆς ἐπιθέσεως τῶν χειρῶν μου
  choice: site n’ibikwasị gị aka m
  rationale: ‘Site na’ na-echekwa διά nke na-egosi ụzọ ma ọ bụ ihe e ji mee ya; okwu ahụ na-akọkwa omume ibikwasị aka n’ụzọ Igbo doro anya.
theological_decisions:
- issue: Ụzọ onyinye ahụ si metụta ibikwasị aka Pọl
  choice: site n’ibikwasị gị aka m
  alternative: mgbe m bikwasịrị gị aka
  rationale: Nhọrọ a na-echekwa nkwupụta ederede na onyinye ahụ sitere n’ụzọ e si bikwasị aka Pọl, kama ime ka ọ bụrụ naanị oge ihe ahụ mere ma ọ bụ ịmanye nkọwa sakramentị zuru ezu n’elu amaokwu ahụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugwu ma doo ndị na-agụ akwụkwọ nke oge a anya. E debere ihe atụ ọkụ nke ngwaa Grik ahụ, ebe nkọwa ọzọ dị n’ala peeji na-eme ka onyinyo ahụ dokwuo anya.
