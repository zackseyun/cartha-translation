revisions:
- from: Jidesie ụkpụrụ nke okwu ndị ziri ezi ị nụrụ n’ọnụ m ike, n’okwukwe na ịhụnanya dị na Mesaịa Jizọs.[a][b][c]
  to: Jidesie ụkpụrụ nke okwu ndị ziri ezi nke ị nụrụ n'aka m ike, n’okwukwe[a] na ịhụnanya dị na Mesaịa Jizọs.[c][b]
  rationale: The revision changes only the source-expression to idiomatic Standard Igbo and relocates footnote markers to their proper lexical or syntactic anchors. It leaves the translation’s treatment of the imperative, the sound words, faith and love, and Messiah Jesus intact, and it does not resolve the Greek syntactic ambiguity beyond the stated main-text reading and alternative footnote.
