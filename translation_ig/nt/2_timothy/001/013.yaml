reference: 2 Timothy 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑποτύπωσιν ἔχε ὑγιαινόντων λόγων ὧν παρ’ ἐμοῦ ἤκουσας ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/013.yaml
  text: Hold to the pattern of sound words that you heard from me[c][b][a], in the faith and love that are in Messiah Jesus.
translation:
  language: ig
  text: Jidesie ụkpụrụ nke okwu ndị ziri ezi nke ị nụrụ n'aka m ike, n’okwukwe[a] na ịhụnanya dị na Mesaịa Jizọs.[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ikwesị ntụkwasị obi na ịhụnanya.” Okwu Grik a sụgharịrị “okwukwe” nwekwara ike ịpụta ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Jidesie ụkpụrụ nke okwu ndị ziri ezi nke ị nụrụ n'aka m banyere okwukwe na ịhụnanya dị na Mesaịa Jizọs ike.” Nhazi okwu Grik nwere ike ịkọwa ụzọ Timoti ga-esi jidesie ụkpụrụ ahụ ike, ma ọ bụ ihe okwu ndị ahụ na-ekwu banyere ya.
    reason: alternative_reading
  - marker: c
    text: 'Nsụgharị ọdịnala: “Kraịst Jizọs.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτύπωσιν
  choice: ụkpụrụ
  rationale: “Ụkpụrụ” na-egosi ihe nlereanya ma ọ bụ usoro e kwesịrị ịgbaso, n’emeghị ka okwu Grik a bụrụ naanị “iwu” ma ọ bụ nkọwa zuru ezu.
- source_word: ἔχε
  choice: jidesie ... ike
  rationale: Ọ bụ ezie na isi ihe okwu ahụ bụ “nwee,” iwu a na-akpọ Timoti ka ọ debe ma rapara n’ụkpụrụ ahụ; “jidesie ... ike” na-egosipụta nke a n’Igbo dị ndụ.
- source_word: ὑγιαινόντων λόγων
  choice: okwu ndị ziri ezi
  rationale: ὑγιαίνω na-eji echiche ahụ ike akọwa ihe na-adịghị emerụ emerụ ma bụrụ eziokwu. “Okwu ndị ziri ezi” bụ Igbo nkịtị ma na-edebe λόγοι dịka “okwu,” kama ịgbanwe ya ozugbo ka ọ bụrụ “ozizi.”
- source_word: ὧν παρ’ ἐμοῦ ἤκουσας
  choice: ị nụrụ n’ọnụ m
  rationale: παρά ya na genitive na-egosi ebe okwu ahụ si bịa. “N’ọnụ m” bụ ụzọ Igbo si ekwu okwu mmadụ ji ntị ya nụrụ kpọmkwem n’aka onye ọzọ.
- source_word: ἐν πίστει
  choice: n’okwukwe
  rationale: “Okwukwe” bụ ntụgharị nkịtị nke πίστις, ebe a kwa ọ pụrụ igosi ọnọdụ ma ọ bụ ụzọ Timoti ga-esi jidesie ụkpụrụ ahụ ike. A na-edebe echiche “ikwesị ntụkwasị obi” na “ntụkwasị obi” n’ala ala peeji.
- source_word: καὶ ἀγάπῃ
  choice: na ịhụnanya
  rationale: “Ịhụnanya” na-enye ihe ἀγάπη pụtara n’Igbo doro anya ma bụrụkwa okwu a na-ahụkarị.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: dị na Mesaịa Jizọs
  rationale: Nkebiokwu a na-akọwa okwukwe na ịhụnanya ọnụ. “Dị na” na-edebe njikọ ἐν n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: Χριστῷ Ἰησοῦ
  choice: Mesaịa Jizọs
  rationale: Χριστός ka bụ aha-ọkwa ebe a; “Mesaịa” na-egosipụta echiche nke Onye E Tere Mmanụ. A na-edebe “Kraịst Jizọs,” nke a maara n’ọdịnala, n’ala ala peeji.
theological_decisions:
- issue: Ihe ἐν πίστει καὶ ἀγάπῃ τῇ ἐν Χριστῷ Ἰησοῦ na-akọwa
  choice: A ghọtara ya dị ka ọnọdụ ma ọ bụ ụzọ Timoti ga-esi jidesie ụkpụrụ ahụ ike—n’okwukwe na ịhụnanya nke dị na Mesaịa Jizọs.
  alternative: O nwekwara ike ịkọwa ihe dị n’okwu ndị ahụ, ya bụ, okwu banyere okwukwe na ịhụnanya dị na Mesaịa Jizọs.
  rationale: Nhazi okwu Grik kwere ka a ghọta ya n’ụzọ abụọ. Usoro ndụmọdụ ahụ na-akwado nghọta mbụ, ma ala ala peeji na-edebe nke ọzọ ka a ghara ikpochapụ mgbagwoju anya dị n’ederede.
- issue: Ntughari Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: Ebe ọ bụ aha-ọkwa nke pụtara Onye E Tere Mmanụ, “Mesaịa” na-egosipụta ọrụ ahụ. “Kraịst” bụ ntụgharị ọdịnala, ya mere a kpọrọ ya n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. “Jidesie ... ike” bụ okwu ndụmọdụ siri ike ma bụrụ nke nkịtị; “okwu ndị ziri ezi” na-ezere asụsụ ụka siri ike ma na-anọgide nso na λόγοι. E tinyere akara ala ala peeji [a], [b], na [c] niile n’ederede isi.
