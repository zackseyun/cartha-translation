id: 2TI.1.3
reference: 2 Timothy 1:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Χάριν ἔχω τῷ θεῷ, ᾧ λατρεύω ἀπὸ προγόνων ἐν καθαρᾷ συνειδήσει, ὡς ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν ἐν ταῖς δεήσεσίν μου, νυκτὸς καὶ ἡμέρας
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/003.yaml
  text: I thank God[a], whom I serve as my ancestors did with a clean conscience[c][b], as I constantly remember you in my prayers night and day.
translation:
  language: ig
  text: Ana m ekele Chineke, onye m na-efe n'obi akọ na uche dị ọcha, dịka ndị nna nna m siri fee Ya; dịka m na-echeta gị mgbe niile n'ekpere m, abalị na ehihie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ a sụgharịrị “dịka ndị nna nna m siri fee Ya” nwekwara ike ịpụta, “site n'aka ndị nna nna m” ma ọ bụ “n'usoro ndị nna nna m.” Okwu ahụ na-egosi njikọ na-aga n'ihu na ndị nna nna ya, n'agbanyeghị na e nwere ike ịghọta kpọmkwem otú njikọ ahụ si dị n'ụzọ dị iche iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω τῷ θεῷ
  choice: Ana m ekele Chineke
  rationale: Akpaalaokwu Grik ahụ pụtara ikele onye; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: ᾧ λατρεύω
  choice: onye m ... na-efe
  rationale: “Ife Chineke” nwere ike ịgụnye ma ofufe ma ije ozi nye Chineke, ya mere ọ naghị emechi obosara ihe λατρεύω pụtara.
- source_word: ἀπὸ προγόνων
  choice: dị ka ndị nna nna m si fee ya
  rationale: Nke a na-egosipụta njikọ dị n'etiti ofufe Pọl na nke ndị nna nna ya n'Igbo a na-aghọta nke ọma, ebe e tinyere nsụgharị nkịtị karị na nkọwa ala peeji.
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: ji akọ na uche dị ọcha
  rationale: Akpaokwu a na-egosi ụzọ o si efe Chineke; “akọ na uche dị ọcha” bụ okwu Igbo doro anya maka conscience na-enweghị ikpe ọmụma.
- source_word: ὡς
  choice: ebe
  rationale: “Ebe” na-ejikọta ncheta Pọl na ekele ya dịka ọnọdụ na-eso ya, n'ebughị ụzọ kpebie na ọ pụtara kpọmkwem “n'ihi na” ma ọ bụ naanị “mgbe.”
- source_word: ἀδιάλειπτον ἔχω τὴν περὶ σοῦ μνείαν
  choice: m na-echeta gị mgbe niile
  rationale: Nke a na-enye echiche nke ncheta na-adịghị akwụsị n'Igbo eke, kama ịrapara n'usoro okwu Grik nke ga-ada arọ.
- source_word: ἐν ταῖς δεήσεσίν μου
  choice: n'ekpere m
  rationale: Ọ bụ ezie na δέησις na-emesi arịrịọ ike, “ekpere” bụ okwu Igbo kachasị eke n'ọnọdụ a.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: abalị na ehihie
  rationale: Nke a bụ akpaokwu Igbo dị nkenke nke na-egosi ịdịgide na ugboro ugboro.
theological_decisions:
- issue: Njikọ Pọl na okwukwe ndị nna nna ya n'okwu ἀπὸ προγόνων
  choice: Pọl na-egosi na ife Chineke ya na-aga n'ihu n'usoro nke ndị nna nna ya.
  alternative: “Site n'aka ndị nna nna m,” nke nwere ike igosi mmalite ma ọ bụ ọdịnala e ketara.
  rationale: Okwu Grik ahụ dị nkenke ma nwee ntakịrị mgbagwoju anya. Isi nsụgharị na-egosi njikọ ahụ n'ụzọ eke, ebe nkọwa ala peeji na-echekwa ụdị nsụgharị nkịtị na ohere ndị ọzọ.
- issue: Ihe λατρεύω pụtara
  choice: na-efe
  alternative: na-efe ofufe; na-ejere ozi dị nsọ
  rationale: Okwu Grik ahụ nwere ike ịpụta ije ozi okpukpe ma ọ bụ ofufe a na-enye Chineke. “Na-efe” na Standard Igbo na-echekwa akụkụ abụọ ahụ nke ọma.
- issue: Njikọ ὡς na ekele Pọl
  choice: ebe
  alternative: mgbe; dịka; n'ihi na
  rationale: A họọrọ okwu na-egosi ọnọdụ na-eso ekele ahụ n'emeghị ka njikọ ahụ bụrụ naanị ihe kpatara ya, ebe Grik n'onwe ya nwere ohere nkọwa karịa otu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ “akọ na uche,” “ife Chineke,” na “abalị na ehihie” dịka okwu ndị nkịtị ga-aghọta, ma zere okwu ụka pụrụ iche nke otu okpukpe.
