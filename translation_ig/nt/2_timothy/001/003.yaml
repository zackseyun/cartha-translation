revisions:
- from: Ana m ekele Chineke, onye m ji akọ na uche dị ọcha na-efe[a], dị ka ndị nna nna m si fee ya[b], ebe m na-echeta gị mgbe niile n'ekpere m[c], abalị na ehihie.
  to: Ana m ekele Chineke, onye m na-efe n'obi akọ na uche dị ọcha, dịka ndị nna nna m siri fee Ya; dịka m na-echeta gị mgbe niile n'ekpere m, abalị na ehihie.[a]
  rationale: The revision makes the clean conscience unambiguously describe Paul's manner of serving God, renders ὡς with a less restrictive Igbo connective, and revises the notes so that they preserve lexical alternatives without adding claims not stated by the Greek. Footnote anchors are supplied only for the ancestral phrase in the translation; the other lexical alternatives are retained in the complete footnote set for editorial use but are not required by the running text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:21Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys thanksgiving, service/worship of God, continual remembrance in prayer, and 'night and day.' However, the placement and wording of 'ji akọ na uche dị ọcha' can make the conscience sound like an instrument used to worship rather than the manner in which Paul serves God. 'Ebe' for ὡς is also more clearly circumstantial/causal than the Greek warrants.
  naturalness: The draft is broadly understandable Standard Igbo. Reordering the first clause and using 'dịka' gives a more natural, less interpretively restricted connection. 'Na-efe ofufe' in footnote a is understandable, but 'na-ejere Chineke ozi n'ofufe' states the alternative sense more idiomatically.
  terminology: '''Chineke,'' ''akọ na uche dị ọcha,'' ''ekpere,'' and ''abalị na ehihie'' are suitable modern Standard Igbo terms. The wording about ancestral ''okwukwe'' in footnote b goes beyond the expression itself; the note should retain the source''s broader reference to inherited/ancestral service.'
  issues:
  - severity: medium
    issue: The clean-conscience phrase is syntactically awkwardly attached.
    rationale: In 'onye m ji akọ na uche dị ọcha na-efe,' the instrumental-looking 'ji' may be read as using a clean conscience as a means. Reordering it as a manner phrase after the service expression more clearly reflects ἐν καθαρᾷ συνειδήσει.
  - severity: low
    issue: ‘Ebe’ narrows the force of ὡς.
    rationale: ‘Ebe’ can readily imply 'because' or 'since.' ‘Dịka’ preserves the Greek's looser connective force without deciding it is causal.
  - severity: low
    issue: Footnote b adds ‘faith’ and ‘worship’ as though these are explicit in ἀπὸ προγόνων.
    rationale: The Greek phrase is terse and should be described in terms of continuity with ancestors or ancestral tradition, without specifying more than the context supports.
  revised_text: Ana m ekele Chineke, onye m na-efe n'obi akọ na uche dị ọcha, dịka ndị nna nna m siri fee Ya; dịka m na-echeta gị mgbe niile n'ekpere m, abalị na ehihie.[a]
  revised_footnotes:
  - marker: a
    text: Okwu Grik ahụ a sụgharịrị “dịka ndị nna nna m siri fee Ya” nwekwara ike ịpụta, “site n'aka ndị nna nna m” ma ọ bụ “n'usoro ndị nna nna m.” Okwu ahụ na-egosi njikọ na-aga n'ihu na ndị nna nna ya, n'agbanyeghị na e nwere ike ịghọta kpọmkwem otú njikọ ahụ si dị n'ụzọ dị iche iche.
    reason: lexical_alternative
