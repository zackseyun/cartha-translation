    text: Okwu Grik a sụgharịrị “na-efe” nwekwara ike ịpụta “na-ejere Chineke ozi n'ofufe.”
    reason: lexical_alternative
  - marker: c
    text: 'N''ụzọ nkịtị karị: “ana m enwe ncheta gbasara gị n''ekpere m.”'
    reason: lexical_alternative
