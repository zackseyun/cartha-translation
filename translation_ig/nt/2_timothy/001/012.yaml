id: 2TI.1.12
reference: 2 Timothy 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δι’ ἣν αἰτίαν καὶ ταῦτα πάσχω, ἀλλ’ οὐκ ἐπαισχύνομαι, οἶδα γὰρ ᾧ πεπίστευκα, καὶ πέπεισμαι ὅτι δυνατός ἐστιν τὴν παραθήκην μου φυλάξαι εἰς ἐκείνην τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/012.yaml
  text: For this reason I also suffer these things[a], but I am not ashamed, for I know whom I have believed[c][b], and I am convinced that he is able to guard my deposit until that day.
translation:
  language: ig
  text: Ọ bụkwa n’ihi nke a ka m ji na-ata ahụhụ ihe ndị a. Ma ihere adịghị eme m, n’ihi na amaara m onye m tụkwasịworo obi[a], obi siri m ike na o nwere ike ichekwa nkwụnye m[b] ruo ụbọchị ahụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye m kweere na ya.”
    reason: lexical_alternative
  - marker: b
    text: “Nkwụnye” bụ ihe e tinyere n’aka onye ọzọ ka o chekwaa. O nwere ike ịbụ ihe Pọl nyefere Chineke, ma ọ bụ ihe e nyefere Pọl ka o chekwaa.
    reason: alternative_reading
  - marker: c
    text: Ya bụ, ụbọchị ikpeazụ ahụ nke ikpe Chineke na igosi na ndị nke ya ziri ezi.
    reason: cross_reference
lexical_decisions:
- source_word: δι’ ἣν αἰτίαν
  choice: Ọ bụkwa n’ihi nke a
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi ihe kpatara ya, ma na-ejigide njikọ okwu ahụ na ihe e kwuru tupu ya.
- source_word: ταῦτα πάσχω
  choice: ka m ji na-ata ahụhụ ihe ndị a
  rationale: “Na-ata ahụhụ” na-egosi ahụhụ na-aga n’ihu, ebe “ihe ndị a” na-edobe ihe ngosi ahụ n’ebughị ụzọ kọwaa ụdị ahụhụ ndị ahụ.
- source_word: οὐκ ἐπαισχύνομαι
  choice: ihere adịghị eme m
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ọnọdụ onye na-adịghị eme ihere n’ihi ahụhụ ya.
- source_word: οἶδα
  choice: amaara m
  rationale: Ọ bụ ezie na ọdịdị okwu Grik a bụ nke zuru ezu, ọrụ ya ebe a bụ igosi ihe onye ahụ maara ugbu a.
- source_word: ᾧ πεπίστευκα
  choice: onye m tụkwasịworo obi
  rationale: “Tụkwasị obi” na-enye ihe πιστεύω pụtara n’ebe a nke ọma, ebe “-woro” na-egosi ntụkwasị obi e guzobeworo ma ka dịgide.
- source_word: πέπεισμαι
  choice: obi sikwa m ike
  rationale: Akpaalaokwu Igbo a na-egosi nkwenye siri ike ma guzosie ike, n’ụzọ mmadụ nkịtị na-aghọta.
- source_word: δυνατός ἐστιν
  choice: o nwere ike
  rationale: Nke a na-egosi ikike onye ahụ nwere n’ụzọ doro anya, n’etinyeghị nkọwa ọzọ n’elu ihe Grik kwuru.
- source_word: τὴν παραθήκην μου
  choice: nkwụnye ahụ nke m
  rationale: “Nkwụnye” na-edobe ihe atụ nke ihe e nyere mmadụ ka o chekwaa. Usoro “nke m” anaghị ekpebi n’ahịrị bụ isi ma ọ bụ ihe Pọl nyere onye ọzọ ka o chekwaa, ka ọ bụ ihe e nyere Pọl ka o chekwaa.
- source_word: φυλάξαι
  choice: ichekwa
  rationale: '“Ichekwa” dabara n’ihe a na-eme ihe e tinyere n’aka mmadụ: idebe ya nke ọma ma ghara ikwe ka ọ laa n’iyi.'
- source_word: εἰς ἐκείνην τὴν ἡμέραν
  choice: ruo ụbọchị ahụ
  rationale: Nke a na-edobe echiche oge nke na-ele n’ihu ruo ụbọchị ahụ, n’akọwaghị ya karịa otú ahịrị Grik si mee.
theological_decisions:
- issue: Onye ᾧ na “o” na-ezo aka na ya
  choice: 'A hapụrụ onye ahụ n’enweghị aha kpọmkwem: “onye … o.”'
  alternative: Ịkpọ ya Chineke ma ọ bụ Kraịst Jizọs kpọmkwem.
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi onye Pọl tụkwasịrị obi, ahịrị Grik akpọghị ya aha ebe a. Ya mere, nsụgharị ahụ na-edobe ogo nkọwa nke ederede ahụ.
- issue: Ihe παραθήκη μου pụtara
  choice: E jiri “nkwụnye ahụ nke m” debe ihe atụ ahụ na mgbagwoju anya ya.
  alternative: Ihe Pọl nyefere Chineke—dịka ndụ ya—ma ọ bụ ozi ọma/ozi ije ozi e nyefere Pọl.
  rationale: Ụdị okwu Grik ahụ n’onwe ya anaghị ekpebi ụzọ nkwụnye ahụ si gaa. Ya mere, ahịrị bụ isi anaghị edozi esemokwu nkọwa a n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ akpaalaokwu ndị mmadụ na-eji, dị ka “ihere adịghị eme m” na “obi siri m ike,” ma debe ihe atụ pụrụ iche nke παραθήκη site n’okwu “nkwụnye,” nke nkọwa ala peeji na-akọwa.
