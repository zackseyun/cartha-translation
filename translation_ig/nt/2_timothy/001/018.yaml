id: 2TI.1.18
reference: 2 Timothy 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δῴη αὐτῷ ὁ κύριος εὑρεῖν ἔλεος παρὰ κυρίου ἐν ἐκείνῃ τῇ ἡμέρᾳ— καὶ ὅσα ἐν Ἐφέσῳ διηκόνησεν, βέλτιον σὺ γινώσκεις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/018.yaml
  text: May the Lord grant him to find mercy from the Lord on that day—and you know better how much he served in Ephesus[a][b][c].
translation:
  language: ig
  text: Ka Onyenwe anyị mee ka o nweta ebere n’aka Onyenwe anyị n’ụbọchị ahụ[a][b]—gị onwe gị makwaara nke ọma ọrụ niile o rụrụ n’Efesọs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihu Onyenwe anyị” ma ọ bụ “n’ebe Onyenwe anyị nọ.” Okwu Grik a sụgharịrị “n’aka” nwere ike igosi ebe ebere ahụ si bịa, ma ụfọdụ na-ahụ ya dịka okwu na-emesi ịdị n’ihu Onyenwe anyị ike.
    reason: lexical_alternative
  - marker: b
    text: “Ụbọchị ahụ” bụ ụzọ Agba Ọhụrụ si ekwu ọtụtụ mgbe banyere ụbọchị ikpe Chineke ma ọ bụ ụbọchị ọ ga-akwado ndị nke ya n’ọdịnihu.
    reason: cross_reference
  - marker: c
    text: Ma ọ bụ, “ihe niile o jere ozi” ma ọ bụ “ọrụ niile o rụrụ.” Okwu Grik ahụ na-achịkọta oke ọrụ o rụrụ n’Efesọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη αὐτῷ ... εὑρεῖν ἔλεος
  choice: Ka ... mee ka o nweta ebere
  rationale: Optative δῴη na-egosipụta arịrịọ ma ọ bụ ekpere. Usoro a bụ Igbo nkịtị ma dị ùgwù; ‘nweta ebere’ na-eme ka idiom Grik ‘ịchọta ebere’ doo onye na-agụ taa anya.
- source_word: ὁ κύριος ... παρὰ κυρίου
  choice: Onyenwe anyị ... n’aka Onyenwe anyị
  rationale: A hapụrụ nkwughachi κύριος dịka ọ dị na Grik. ‘N’aka’ na-egosipụta isi iyi nke ebere, ma nkọwa ala peeji na-edebe nghọta ọzọ nke παρά.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: n’ụbọchị ahụ
  rationale: Nke a bụ ntụgharị Igbo ebumpụta ụwa nke na-edebe okwu e ji atụ aka n’ụbọchị ahụ n’enweghị ịgbakwunye nkọwa eskatọlọjị n’ahụ amaokwu.
- source_word: ὅσα ... διηκόνησεν
  choice: ọrụ niile o jere
  rationale: Nkebiokwu a na-achịkọta ịdị ukwuu na ụdị ọrụ Onesifọrọs rụrụ. ‘Ọrụ niile o jere’ bụ Igbo doro anya nke na-ezere ime διακονέω ka ọ bụrụ naanị ọrụ ụka pụrụ iche.
- source_word: βέλτιον σὺ γινώσκεις
  choice: gị onwe gị maara nke ọma
  rationale: βέλτιον nwere ụdị ntụnyere, ma n’ọnọdụ a ọ na-egosi na Timoti maara ihe ndị ahụ nke ọma karịa. Usoro Igbo a bụ nke ebumpụta ụwa ma ọ naghị agbakwunye onye a na-atụnyere ya na ya, ebe Grik ekwughị ya kpọmkwem.
- source_word: ἐν Ἐφέσῳ
  choice: n’Efesọs
  rationale: Nke a bụ ntụgharị ọnọdụ ebe doro anya ma kwekọọ n’usoro aha obodo ahụ n’Igbo.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ e kwuru ugboro abụọ na-ezo aka na ya
  choice: A sụgharịrị ha abụọ dịka ‘Onyenwe anyị’ n’enweghị ikwu ma ha na-ezo aka n’otu onye ahụ ma ọ bụ na Nna na Ọkpara dị iche iche.
  alternative: Nke mbụ nwere ike ịbụ Kraịst, nke abụọ bụrụ Nna; ma ọ bụ ha abụọ nwere ike izo aka na Kraịst.
  rationale: Grik jiri κύριος ugboro abụọ ma o meghị ka ọdịiche onye a na-ekwu maka ya doo anya. Ya mere, ntụgharị ahụ na-edebe mgbagwoju anya nkà mmụta okpukpe ahụ.
- issue: Ihe ‘ụbọchị ahụ’ pụtara
  choice: A hapụrụ ya dịka ‘ụbọchị ahụ.’
  alternative: A pụrụ ịkọwa ya dịka ụbọchị ikpe Chineke ma ọ bụ ụbọchị ikpeazụ.
  rationale: O yikarịrị ka ọ bụ ụbọchị ikpe ma ọ bụ nkwado Chineke n’ọdịnihu, ma amaokwu ahụ n’onwe ya akọwaghị ya karịa nke ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. ‘Onyenwe anyị’ bụ ntụgharị κύριος; ‘ọrụ o jere’ na-egosipụta ọrụ bara uru n’enweghị itinye ya n’otu usoro ụka pụrụ iche. Ihe nrịbama ala peeji [a], [b], na [c] niile dị n’ahụ amaokwu.
