  text: τὴν καλὴν παραθήκην φύλαξον διὰ πνεύματος ἁγίου τοῦ ἐνοικοῦντος ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/001/014.yaml
  text: Guard the good deposit through the Holy Spirit who dwells in us[a][b].
translation:
  language: ig
  text: Chebe ezi ihe ahụ e nyefere gị ka i debe[a], site na Mmụọ Nsọ nke bi n’ime anyị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ezi ihe ahụ e debere n’aka gị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’aka Mmụọ Nsọ nke bi n’ime anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν καλὴν παραθήκην
  choice: ezi ihe ahụ e nyefere gị ka i debe
  rationale: Nkebiokwu a na-egosi ihe bara uru e nyere mmadụ ka ọ na-echekwa. Nsụgharị a na-eme ka ihe atụ nke ihe e nyefere mmadụ doo onye Igbo nke oge a anya, ma ọ naghị ekpebi kpọmkwem ma ihe ahụ bụ oziọma ka ọ bụ ọrụ e nyere Timoti.
- source_word: καλὴν
  choice: ezi
  rationale: N’ebe a, καλός na-akọwa ihe ahụ dị ka ihe ọma ma kwesịkwa ekwesị. “Ezi” bụ okwu Igbo dị mfe ma dị ebube nke na-ezere ịkọwa ya naanị dị ka ihe mara mma ma ọ bụ ihe dị oke ọnụ ahịa.
- source_word: φύλαξον
  choice: Chebe
  rationale: Iwu a chọrọ ka Timoti jiri nlezianya na-eche ihe e nyere ya nche. “Chebe” na-egosi nchedo siri ike karịa naanị “debe.”
- source_word: διὰ πνεύματος ἁγίου
  choice: site na Mmụọ Nsọ
  rationale: διά tinyere genitive nwere ike igosi ụzọ ma ọ bụ onye e ji mee ihe. “Site na Mmụọ Nsọ” na-edobe nghọta abụọ ahụ n’Igbo n’etinyeghị okwu ọzọ dịka “ike” nke na-adịghị n’ederede Grik.
- source_word: τοῦ ἐνοικοῦντος ἐν ἡμῖν
  choice: nke bi n’ime anyị
  rationale: Present participle a na-egosi na Mmụọ Nsọ nọgide na-ebi n’ime ha. “Bi n’ime anyị” bụ Igbo nkịtị ma doo anya, na-enweghị iji okwu nkà mmụta okpukpe pụrụ iche.
- source_word: ἐν ἡμῖν
  choice: n’ime anyị
  rationale: Nke a na-egosipụta kpọmkwem ọnụnọ dị n’ime, ma na-ahapụ “anyị” ka ọ bụrụ otu o siri dị n’isi mmalite n’enweghị imechi ya naanị na Pọl na Timoti ma ọ bụ gbasaa ya n’ụzọ doro anya nye ndị kwere ekwe niile.
theological_decisions:
- issue: Ihe “ezi ihe ahụ e nyefere gị ka i debe” na-ezo aka na ya
  choice: A hapụrụ ya dịka nkebiokwu izugbe nke na-adịghị akpọ ya oziọma ma ọ bụ ọrụ Timoti kpọmkwem.
  alternative: Ọ pụrụ izo aka n’oziọma e nyefere Timoti, ma ọ bụ n’ọrụ ozi e nyere ya.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-atụ aka n’ezi ozi ndịozi, ma okwu Grik ahụ n’onwe ya dị mkpụmkpụ ma bụrụ ihe atụ. Nsụgharị ahụ na-edobe ohere nghọta a kama idozi ya n’ime isi ederede.
- issue: Ndị “anyị” n’okwu “bi n’ime anyị” gụnyere
  choice: E debere nnọchiaha “anyị” n’enweghị ịkọwa oke ya.
  alternative: Ọ pụrụ ịpụta Pọl na Timoti kpọmkwem, ma ọ bụ ndị kwere ekwe n’ozuzu ha.
  rationale: ἡμῖν nwere ike ibido n’ebe Pọl na Timoti nọ ma nwee nghọta sara mbara banyere ọgbakọ ndị kwere ekwe. Nsụgharị ahụ anaghị amanye otu nghọta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. “E nyefere gị ka i debe” na-eme ka echiche παραθήκη doo anya n’asụsụ nkịtị, ebe “site na Mmụọ Nsọ” na-edobe nghọta nke ụzọ ma ọ bụ onye ọrụ n’enweghị itinye echiche na-anọghị n’ederede.
