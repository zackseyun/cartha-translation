  text: ἔχοντες μόρφωσιν εὐσεβείας τὴν δὲ δύναμιν αὐτῆς ἠρνημένοι· καὶ τούτους ἀποτρέπου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/005.yaml
  text: having a form of godliness but denying its power[b][a]; and turn away from these people.
translation:
  language: ig
  text: ndị nwere ọdịdị nke ịsọpụrụ Chineke[a], ma gọnarịrị ike ya; zerekwa ndị dị otú a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ihe yiri ịsọpụrụ Chineke.’ Okwu Grik ahụ nwere ike imesi ọdịdị a na-ahụ anya ike; a họọrọ ‘ọdịdị’ iji chekwaa ọdịiche ya na ‘ike.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘tụgharịa onwe gị pụọ n'ebe ndị dị otú a nọ’ ma ọ bụ ‘nọpụ ndị dị otú a anya.’ Ngwaa Grik ahụ pụtara ịtụgharị onwe onye pụọ n'ebe ha nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: ndị nwere
  rationale: Ọ bụ participle na-akọwa ndị e depụtara n'okwu ndị bu ụzọ; ‘ndị nwere’ bụ Igbo doro anya ma dịkwa eke.
- source_word: μόρφωσιν
  choice: ọdịdị
  rationale: ‘Ọdịdị’ na-edebe echiche nke ụdị a na-ahụ anya ma chekwaa ọdịiche ya na ‘ike’; ọ naghị ekpebi n'ụzọ gabigara isiokwu na ọ bụ naanị aghụghọ.
- source_word: εὐσεβείας
  choice: ịsọpụrụ Chineke
  rationale: N'ebe a εὐσέβεια bụ ndụ nsọpụrụ na nrubeisi chere ihu n'ebe Chineke nọ; okwu a bụ nke ndị Igbo nke oge a ga-aghọta ngwa ngwa.
- source_word: τὴν δὲ δύναμιν αὐτῆς
  choice: ma ... ike ya
  rationale: Nke a na-edebe ntụaka αὐτῆς n'ebe ịsọpụrụ Chineke nọ ma ghara ịkọwa ‘ike’ ahụ nanị dịka ọrụ ebube, mgbanwe omume, ma ọ bụ ọrụ Mmụọ Nsọ.
- source_word: ἠρνημένοι
  choice: ha agọnarị
  rationale: Perfect participle na-egosi ọnọdụ siri ike nke sitere n'ịgọnarị e mere; ‘ha agọnarị’ na-egosipụta ihe e mere nke nsonaazụ ya ka dị.
- source_word: καὶ τούτους ἀποτρέπου
  choice: zerekwara ụdị ndị a
  rationale: Imperative middle ahụ pụtara ịtụgharị onwe onye pụọ n'ebe ha nọ ma ọ bụ izere ha; ‘zerekwa’ bụ iwu doro anya ma dị eke n'Igbo.
theological_decisions:
- issue: Ọdịiche dị n'etiti ọdịdị nsọpụrụ Chineke na ike ya
  choice: ‘ọdịdị nke ịsọpụrụ Chineke ... ike ya’
  alternative: ‘ihe yiri ịsọpụrụ Chineke ... ike ya’
  rationale: Nsụgharị a na-echekwa esemokwu Pọl gosiri n'etiti ihe a na-ahụ anya na ịdị irè ya, n'ebughị ụzọ kọwaa kpọmkwem ihe ‘ike’ ahụ bụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ịsọpụrụ Chineke’ karịa okwu mgbazinye ma ọ bụ okwu ụka pụrụ iche. E tinyere akara [a] n'akụkụ okwu ọ na-akọwa na [b] n'akụkụ iwu izere ndị ahụ.
