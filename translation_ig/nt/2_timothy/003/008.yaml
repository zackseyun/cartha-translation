revisions:
- from: Dị nnọọ ka Janes na Jambres si guzogide Mosis[a], otu ahụkwa ka ndị ikom a si eguzogide eziokwu ahụ—ndị uche ha rụrụ arụ, ndị a na-anabataghị n'ihe banyere okwukwe ahụ.[b]
  to: Dị nnọọ ka Janes na Jambres guzogidere Mosis[a], otu ahụkwa ka ndị ikom a na-emegide eziokwu ahụ—ndị uche ha rụrụ arụ, ndị na-erughị eru n'ihe banyere okwukwe ahụ[b].
  rationale: The revision replaces the insufficiently precise passive expression for ἀδόκιμοι with “ndị na-erughị eru,” retaining the Greek evaluative sense and the reference phrase “n'ihe banyere okwukwe ahụ.” It also attaches footnote b to the term it explains and clarifies footnote a’s paired lexical alternatives. No theological narrowing has been introduced.
