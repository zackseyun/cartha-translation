id: 2TI.3.8
reference: 2 Timothy 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν τρόπον δὲ Ἰάννης καὶ Ἰαμβρῆς ἀντέστησαν Μωϋσεῖ, οὕτως καὶ οὗτοι ἀνθίστανται τῇ ἀληθείᾳ, ἄνθρωποι κατεφθαρμένοι τὸν νοῦν, ἀδόκιμοι περὶ τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/008.yaml
  text: Just as Jannes and Jambres opposed Moses[a], so also these men oppose the truth—men corrupted in mind[b], disqualified regarding the faith.
translation:
  language: ig
  text: Dị nnọọ ka Janes na Jambres guzogidere Mosis[a], otu ahụkwa ka ndị ikom a na-emegide eziokwu ahụ—ndị uche ha rụrụ arụ, ndị na-erughị eru n'ihe banyere okwukwe ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ngwaa ndị a dịka “megidere Mosis” ... “na-emegide eziokwu ahụ.”
    reason: lexical_alternative
  - marker: b
    text: “Okwukwe ahụ” n'ebe a yikarịrị ka ọ na-ezo aka n'okwukwe Ndị Kraịst ma ọ bụ n'ozi ndịozi, ọ bụghị naanị nkwenye ma ọ bụ ntụkwasị obi nke mmadụ.
    reason: cross_reference
lexical_decisions:
- source_word: ὃν τρόπον δὲ
  choice: Dị nnọọ ka ... si
  rationale: Na-ewebata ntụnyere n'ụzọ Igbo dị ire; δὲ bụ njikọ dị nro, ọ dịghịkwa mkpa itinye okwu oge dịka “ugbu a.”
- source_word: Ἰάννης καὶ Ἰαμβρῆς
  choice: Janes na Jambres
  rationale: E degharịrị aha ndị ahụ n'ụdị dabara na mkpọpụta na omenala ide aha n'Igbo.
- source_word: ἀντέστησαν / ἀνθίστανται
  choice: guzogide / si eguzogide
  rationale: “Iguzogide” na-egosi mmegide siri ike ma na-edobe myirịta dị n'etiti ngwaa gara aga na nke dị ugbu a.
- source_word: Μωϋσεῖ
  choice: Mosis
  rationale: Ụdị aha a bụ nke ndị na-agụ Baịbụl Igbo maara nke ọma.
- source_word: οὕτως καὶ οὗτοι
  choice: otu ahụkwa ka ndị ikom a si
  rationale: Na-edobe njikọ ntụnyere ahụ ma na-egosi na οὗτοι na-ezo aka n'òtù ndị ikom a kpọtụrụ n'okwu gbara ya gburugburu.
- source_word: τῇ ἀληθείᾳ
  choice: eziokwu ahụ
  rationale: Na-edobe nkọwa doro anya nke okwu Grik ahụ n'enweghị imechi ya nanị n'otu nkọwa nkà mmụta okpukpe.
- source_word: ἄνθρωποι κατεφθαρμένοι τὸν νοῦν
  choice: ndị uche ha rụrụ arụ
  rationale: Na-egosi ọnọdụ nrụrụ nke uche sitere n'ihe merelarị, n'Igbo dị nkenke ma dị mfe nghọta.
- source_word: ἀδόκιμοι
  choice: ndị a na-anabataghị
  rationale: Okwu ahụ na-egosi ndị dara ule ma bụrụ ndị a na-ahụghị ka ndị kwesịrị nkwado; nsụgharị a na-ezere ime ka ọ bụrụ naanị ntaramahụhụ iwu.
- source_word: περὶ τὴν πίστιν
  choice: n'ihe banyere okwukwe ahụ
  rationale: Na-edobe echiche nke ‘banyere/n'ihe gbasara’ na nkọwa okwu ahụ nke nwere ike ịbụ okwukwe Ndị Kraịst ma ọ bụ ozi ndịozi.
theological_decisions:
- issue: Ihe “eziokwu ahụ” na “okwukwe ahụ” na-ezo aka na ya
  choice: E debere ha dịka “eziokwu ahụ” na “okwukwe ahụ” n'ahịrị bụ isi.
  alternative: Ịkọwa ha ozugbo dịka ozi ọma ndịozi ma ọ bụ, n'akụkụ nke ọzọ, dịka eziokwu n'ozuzu na ntụkwasị obi onwe onye.
  rationale: Ọnọdụ okwu ahụ na-akwado na ha metụtara ozi Ndị Kraịst, ma okwu Grik ahụ ka sara mbara; ya mere nsụgharị ahụ anaghị edozi ihe isi mmalite hapụrụ ka ọ nwee obosara.
- issue: Nkọwa ἀδόκιμοι
  choice: ndị a na-anabataghị
  alternative: ndị erughị eru; ndị dara ule; ndị a jụrụ ajụ
  rationale: Nhọrọ a na-eburu echiche nke enweghị nkwado mgbe e nyochachara ha, ma ọ naghị etinye nkọwa ụka pụrụ iche.
- issue: Ụdị nwoke nke ndị a na-ekwu maka ha
  choice: ndị ikom a
  alternative: ndị a; ndị mmadụ a
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'otu ndị nkuzi ụgha nwoke, ya mere e chekwara nkọwa okike dị n'isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro ntụnyere “Dị nnọọ ka ... otu ahụkwa” chekwaa nhazi Grik; e zere okwu ụka pụrụ iche na nkọwa gafere ihe amaokwu ahụ kwuru.
