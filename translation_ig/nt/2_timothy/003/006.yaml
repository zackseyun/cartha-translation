id: 2TI.3.6
reference: 2 Timothy 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκ τούτων γάρ εἰσιν οἱ ἐνδύνοντες εἰς τὰς οἰκίας καὶ ⸀αἰχμαλωτίζοντες γυναικάρια σεσωρευμένα ἁμαρτίαις, ἀγόμενα ἐπιθυμίαις ποικίλαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/006.yaml
  text: For among these are those who slip into households and capture little women burdened with sins[a], led along by various desires[c][b],
translation:
  language: ig
  text: N’ihi na n’etiti ndị a ka e nwere ndị na-eji aghụghọ abanye n’ezinụlọ ma na-adọta ụmụ nwanyị na-adịghị ike n’agha[a]—ndị mmehie bukwasịrị[b], ndị ọchịchọ dị iche iche na-edu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a pụtara n’ụzọ nkịtị, “ijide dị ka ndị a dọọrọ n’agha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị mmehie juru eju.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị ọchịchọ dị iche iche na-akwagharị ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτων
  choice: ụfọdụ n’ime ndị a
  rationale: Ọ na-egosi na ndị a so n’ìgwè ahụ a kọwara n’amaokwu ndị bu ụzọ, ma ọ bụghị na ọ bụ ha niile.
- source_word: ἐνδύνοντες εἰς τὰς οἰκίας
  choice: na-eji aghụghọ abanye n’ezinụlọ dị iche iche
  rationale: Nke a na-echekwa echiche nke ịbanye nwayọọ nwayọọ ma ọ bụ n’ụzọ aghụghọ, ebe ‘ezinụlọ’ na-agụnye ndị bi n’ụlọ, ọ bụghị naanị ụlọ ahụ n’onwe ya.
- source_word: αἰχμαλωτίζοντες
  choice: na-adọrọ ... n’agha
  rationale: Nkebiokwu a na-echekwa ihe oyiyi nke ijide mmadụ dị ka onye a dọọrọ n’agha, tinyere echiche nke idobe ya n’okpuru ọchịchị onye ọzọ.
- source_word: γυναικάρια
  choice: ụmụ nwaanyị na-adịghị ike
  rationale: Aha a bụ okwu nlelị nke na-ezo aka n’ụfọdụ ụmụ nwaanyị ndị dị mfe imeri n’ọnọdụ a, ọ bụghị ụmụ nwaanyị niile; ntụgharị a na-ezere echiche na ọ bụ ịdị nta n’ahụ ka a na-ekwu.
- source_word: σεσωρευμένα ἁμαρτίαις
  choice: ndị mmehie bukwasịrị ibu arọ
  rationale: Ọ na-egosipụta mmehie gbakọbara nke dị ka ibu e bokwasịrị mmadụ.
- source_word: ἀγόμενα
  choice: na-edukwa ha
  rationale: 'Ọ na-echekwa ụdị nnara nke okwu Grik: ọchịchọ ndị ahụ na-akpali ma na-achịkwa ha.'
- source_word: ἐπιθυμίαις ποικίλαις
  choice: ọchịchọ dị iche iche
  rationale: ‘Ọchịchọ’ bụ okwu sara mbara ma dị mfe nghọta, ebe ‘dị iche iche’ na-egosipụta ποικίλαις nke ọma.
theological_decisions:
- issue: Okwu nlelị γυναικάρια
  choice: ụmụ nwaanyị na-adịghị ike
  alternative: ụmụ obere nwaanyị; ụmụ nwaanyị nzuzu; ụmụ nwaanyị dị mfe iduhie
  rationale: Nke a na-echekwa nkatọ a na-akatọ otu ìgwè ụmụ nwaanyị ndị dị mfe irigbu n’ọnọdụ a, n’emeghị ya ka ọ bụrụ nkwupụta gbasara ụmụ nwaanyị niile.
- issue: Ihe οἰκίας pụtara n’ọnọdụ a
  choice: ezinụlọ dị iche iche
  alternative: ụlọ dị iche iche; ebe obibi dị iche iche
  rationale: Ndị ozizi ụgha na-abanye n’ebe obibi iji metụta ndị nọ n’ime ya; ‘ezinụlọ’ na-egosipụta akụkụ mmekọrịta mmadụ na ibe ya nke ọma.
- issue: Onye a na-akọwa dị ka onye mmehie bukwasịrị ibu na onye ọchịchọ na-edu
  choice: Jikọta nkebiokwu abụọ ahụ na ụmụ nwaanyị ndị ahụ
  alternative: Ịhapụ njikọ ahụ ka ọ bụrụ nke na-edochaghị anya
  rationale: Ụdị nwanyị ọtụtụ nke participle abụọ ahụ, σεσωρευμένα na ἀγόμενα, kwekọrọ na γυναικάρια, ya mere ha na-akọwa ụmụ nwaanyị ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ugwu. E ji ‘ụmụ nwaanyị na-adịghị ike’ gosipụta okwu nlelị na adịghị ike dị n’ọnọdụ ahụ n’emeghị ka ọ bụrụ okwu gbasara ụmụ nwaanyị niile. E tinyere akara edemede iji mee ka ndị participle abụọ na-akọwa ụmụ nwaanyị ahụ doo anya.
