  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ἄρτιος ᾖ ὁ τοῦ θεοῦ ἄνθρωπος, πρὸς πᾶν ἔργον ἀγαθὸν ἐξηρτισμένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/017.yaml
  text: so that the man of God may be complete[b][a], equipped for every good work.
translation:
  language: ig
  text: ka onye nke Chineke[b] wee zuo oke, bụrụkwa onye a kwadebere nke ọma[a] maka ezi ọrụ ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye e mere ka ọ dị njikere n’ụzọ zuru ezu.” Okwu Grik ἐξηρτισμένος pụtara onye a kwadebere ma ọ bụ onye e nyere ihe niile dị ya mkpa.
    reason: lexical_alternative
  - marker: b
    text: “Onye nke Chineke” bụ nkebiokwu na-ekwu banyere otu onye, nke nwere ụdị okwu nwoke n’asụsụ Grik. O yiri ka ọ bụ aha Akwụkwọ Nsọ a maara nke ọma; n’ebe a, ọ pụrụ ịrụtụ aka karịsịa n’onye na-ejere Chineke ozi, ma ihe e kwuru nwekwara ike iru ndị Akwụkwọ Nsọ na-akpụzi.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosi nzube nke ihe e kwuru n’amaokwu nke 16 n’Igbo doro anya ma bụrụkwa nke e ji ekwu okwu ugbu a.
- source_word: ἄρτιος
  choice: zuo oke
  rationale: Ọ na-egosi ịbụ onye ihe dị ya mkpa zuru, onye ruru eru maka ọrụ; ọ pụtaghị na onye ahụ enweghị mmehie.
- source_word: ᾖ
  choice: wee zuo
  rationale: “Wee” so “ka” na-egosipụta ọnọdụ nzube nke ngwaa subjunctive ahụ n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: ὁ τοῦ θεοῦ ἄνθρωπος
  choice: onye nke Chineke
  rationale: Nke a na-echekwa okwu Akwụkwọ Nsọ a maara nke ọma, “onye nke Chineke.” “Onye” dabara na ἄνθρωπος karịa ịsụgharị ya “nwoke,” ebe okwu Grik ahụ abụghị ἀνήρ; nkọwa ala peeji na-echekwa na ọ bụ otu onye na aha okwu ahụ bụ nke nwoke na Grik.
- source_word: πρὸς
  choice: maka
  rationale: N’ebe a ọ na-egosi ihe e ji kwadebe onye ahụ ime—maka ezi ọrụ ọ bụla.
- source_word: πᾶν ἔργον ἀγαθόν
  choice: ezi ọrụ ọ bụla
  rationale: Ọ na-echekwa ike nkesa nke πᾶν na ịdị mma nke ἀγαθόν n’Igbo dị mfe nghọta.
- source_word: ἐξηρτισμένος
  choice: onye a kwadebere nke ọma
  rationale: 'Ọ na-egosipụta perfect passive participle: e meela ka onye ahụ dị njikere ma nwee ihe niile dị mkpa. “Nke ọma” na-ebute echiche nke nkwadebe zuru ezu n’enweghị ikwubiga ihe ókè.'
theological_decisions:
- issue: Okwu ὁ τοῦ θεοῦ ἄνθρωπος nke nwere ụdị nwoke n’asụsụ Grik
  choice: onye nke Chineke
  alternative: nwoke nke Chineke
  rationale: ἄνθρωπος nwere ike ịpụta mmadụ ma ọ bụ onye, ọ bụ ezie na nkebiokwu a dị n’otu onye ma nwee ụdị nwoke na Grik, ma yikarị ka ọ bụ aha Akwụkwọ Nsọ a maara nke ọma nke na-arụtụ aka n’ụzọ mbụ n’ebe onye na-ejere Chineke ozi nọ. “Onye nke Chineke” anaghị eme ka ọ bụrụ naanị nwoke ma ọ bụ gbasaa ya n’enweghị nkọwa; nkọwa ala peeji na-edebe esemokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Usoro “ka ... wee” na-ejikọta amaokwu a na nzube sitere n’amaokwu nke 16. E debere “onye nke Chineke” dị ka aha Akwụkwọ Nsọ, ebe nkọwa ala peeji na-akọwa ọdịdị okwu Grik ahụ n’ebughị ozizi otu ụka.
