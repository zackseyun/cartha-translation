  yaml_path: translation/nt/2_timothy/003/014.yaml
  text: But as for you[a], remain in what you learned and became convinced of, knowing from whom you learned it[b],
translation:
  language: ig
  text: Ma gị onwe gị, nọgide n’ihe ndị ị mụtara ma kwenyesiri ike na ha[b], ebe ị maara ndị ị mụtara ihe ndị a n’aka ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ odide nwere “onye ị mụtara ihe n’aka ya,” n’ụdị otu onye; a na-aghọtakarị onye ahụ dị ka Pọl. Ọgụgụ ọtụtụ e ji mee ihe n’ebe a nwere ike izo aka n’ụzọ sara mbara n’ndị kụziiri Timoti ihe.
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “ihe ndị e mere ka obi sie gị ike banyere ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ma gị onwe gị
  rationale: “Gị onwe gị” na-egosipụta nkwusikwu okwu dị na nnọchiaha σὺ, ebe “Ma” na-egosipụta ọdịiche dị n’etiti Timoti na ndị ọjọọ a kọwara n’amaokwu ndị bu ụzọ.
- source_word: μένε ἐν οἷς
  choice: nọgide n’ihe ndị
  rationale: “Nọgide” na-egosipụta iwu nke na-akpọ Timoti ka ọ ghara ịkwụsị, “n’ihe ndị” na-echekwakwa echiche nke ịnọgide n’ime ihe a kụziiri ya.
- source_word: ἔμαθες
  choice: ị mụtara
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke ndị Igbo nke oge a na-asụ iji gosi ihe Timoti natara n’ọmụmụ n’oge gara aga.
- source_word: ἐπιστώθης
  choice: kwenyesie ike na ha
  rationale: Nhọrọ a na-egosi na ihe ndị ahụ ghọrọ ihe Timoti ji n’aka ma kwenye n’ezie, kama ịkọwa okwu ahụ dịka ọrụ e nyefere ya.
- source_word: εἰδὼς
  choice: ebe ị maara
  rationale: Nke a na-edobe njikọ participle ahụ n’ụzọ na-anaghị ekpebi ma ọ bụ naanị ihe na-eso ya ka ọ bụ kpọmkwem ihe kpatara iwu ahụ.
- source_word: παρὰ τίνων ἔμαθες
  choice: ndị ị mụtara ihe ndị ahụ n’aka ha
  rationale: “N’aka ha” na-egosipụta isi mmalite nke παρά na genitive, ebe “ndị” na-edobe ọgụgụ ọtụtụ nke SBLGNT n’akọwaghị ndị ahụ kpọmkwem.
theological_decisions:
- issue: Ndị παρὰ τίνων na-ezo aka na ha
  choice: E dere ya n’ụdị ọtụtụ, “ndị … n’aka ha,” n’akpọghị ndị ahụ aha.
  alternative: Ụfọdụ odide nwere ụdị otu onye, nke a pụrụ ịghọta dị ka Pọl.
  rationale: SBLGNT nwere ụdị ọtụtụ, amaokwu ahụ ekwughịkwa kpọmkwem ndị ọ bụ. Ya mere, ntụgharị ahụ anaghị amanye echiche na ọ bụ naanị Pọl ma ọ bụ kọwaa ndị nkụzi ahụ n’ụzọ ederede ahụ n’onwe ya na-emeghị.
- issue: Ihe ἐπιστώθης pụtara
  choice: kwenyesie ike na ha
  alternative: e mere ka obi sie gị ike banyere ha
  rationale: N’ebe a, okwu ahụ yiri ka ọ na-ekwu maka nkwenye Timoti nwere n’ihe ọ mụtara. A hapụrụ ụzọ ọzọ na ndetu ala peeji n’ihi na passive ahụ nwekwara ike igosi na e mere ka obi sie ya ike.
translation_notes:
  register: E ji asụsụ Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ma gị onwe gị” na-enye nkwusikwu okwu n’enweghị arọ ochie; “nọgide” na “kwenyesie ike” bụ okwu ndị a na-asụkarị ma na-echekwa ịdị arọ nke ndụmọdụ ahụ.
