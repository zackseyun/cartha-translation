revisions:
- from: Ma ndị ajọ mmadụ na ndị aghụghọ[a] ga na-akawanye njọ[b], na-eduhie ndị ọzọ, ebe a na-eduhiekwa ha onwe ha.
  to: Ma ndị ajọ mmadụ na ndị aghụghọ[a] ga na-akawanye njọ[b], na-eduhie mmadụ ma a na-eduhiekwa ha.
  rationale: The revision retains the draft’s accurate rendering of the verse while making the final clause explicitly passive without implying that the deceivers deceive themselves. It also avoids supplying an explicit object for ‘deceiving.’ Footnote anchors and their lexical purposes are retained.
  reviewer_model: gpt-5.6-terra
