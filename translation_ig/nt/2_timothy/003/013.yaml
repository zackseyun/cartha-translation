id: 2TI.3.13
reference: 2 Timothy 3:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πονηροὶ δὲ ἄνθρωποι καὶ γόητες προκόψουσιν ἐπὶ τὸ χεῖρον, πλανῶντες καὶ πλανώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/013.yaml
  text: But evil people and impostors will go on from bad to worse[b][a], deceiving and being deceived.
translation:
  language: ig
  text: Ma ndị ajọ mmadụ na ndị aghụghọ[a] ga na-akawanye njọ[b], na-eduhie mmadụ ma a na-eduhiekwa ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị na-eme onwe ha ihe ha na-abụghị” ma ọ bụ “ndị nduhie.” Okwu Grik a pụrụ izo aka n’ndị aghụghọ; n’ọnọdụ ụfọdụ, ọ nwekwara ike inwe echiche gbasara anwansi ma ọ bụ ọgwụ aghụghọ.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ okwu si dị kpọmkwem: “ha ga-aga n’ihu ruo n’ihe ka njọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ
  choice: ajọ
  rationale: ‘Ajọ’ na-egosi omume na ọnọdụ rụrụ arụ n'ụzọ doro anya, ọ bụghị nanị ihe na-adịghị mma.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ndị a na Timoti tinyere ndị kwesịrị ntụkwasị obi e kwuru okwu ha tupu nke a.
- source_word: ἄνθρωποι
  choice: mmadụ
  rationale: Ọ bụ okwu na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: γόητες
  choice: ndị aghụghọ
  rationale: Ọ na-enye echiche nke ndị nduhie na-eme onwe ha ihe ha na-abụghị; ọ naghị amanye nkọwa banyere anwansi nke ọnọdụ a na-akwadoghị kpọmkwem.
- source_word: προκόψουσιν ἐπὶ τὸ χεῖρον
  choice: ga na-akawanye njọ
  rationale: Nke a bụ ụzọ Igbo si ekwu nke ọma na ọnọdụ ha ga-aga n’ihu banye n’ihe ka njọ, ebe ọ ka na-echekwa echiche mmegharị dị na okwu Grik.
- source_word: πλανῶντες
  choice: na-eduhie ndị ọzọ
  rationale: Ọ na-egosi omume ha na-aga n’ihu nke ime ka ndị ọzọ hie ụzọ; ‘ndị ọzọ’ na-eme ka ihe onyea nke participle nọ n’ọrụ pụta ìhè n’Igbo.
- source_word: πλανώμενοι
  choice: ebe a na-eduhiekwa ha onwe ha
  rationale: 'Ọ na-echekwa olu nnara nke Grik ma mee ka esemokwu ahụ doo anya: ndị na-eduhie ndị ọzọ bụkwa ndị a na-eduhie.'
theological_decisions:
- issue: Ma ἄνθρωποι ọ na-ezo aka naanị n’ụmụ nwoke
  choice: ndị ... mmadụ
  alternative: ndị nwoke
  rationale: Ụdị Grik bụ masculine plural, ma ihe ọ pụtara ebe a bụ mmadụ niile n’ozuzu; ya mere a naghị egbochi ya n’ebe ụmụ nwoke nọ.
- issue: Ihe γόητες pụtara
  choice: ndị aghụghọ
  alternative: ndị dibịa anwansi / ndị na-eme onwe ha ihe ha na-abụghị
  rationale: Okwu ahụ pụrụ inwe ndò echiche anwansi, ọgwụ aghụghọ, ma ọ bụ nduhie. N’ebe a, isi okwu bụ aghụghọ na nduhie; nsụgharị a anaghị etinye nkwupụta siri ike banyere anwansi nke amaokwu ahụ ekwughị kpọmkwem.
- issue: Mmekọrịta dị n’etiti πλανῶντες na πλανώμενοι
  choice: na-eduhie ndị ọzọ, ebe a na-eduhiekwa ha onwe ha
  alternative: na-eduhie ma na-ehie ụzọ
  rationale: A hapụrụ okwu nke abụọ n’olu nnara iji gosi na ha abụghị naanị ndị nduhie, kama na e nwere nduhie na-emetụtakwa ha; e kpebighị onye ma ọ bụ ihe na-eduhie ha.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri ‘ga na-akawanye njọ’ nye mmegharị na-aga n’ihu nke προκόψουσιν, ma chekwaa olu nnara n’ahịrị ikpeazụ. Akara ntụaka ụkwụ [a] na [b] dị n’ederede isi.
