lexical_decisions:
- source_word: προδόται
  choice: ndị na-arara mmadụ nye
  rationale: Okwu a na-egosi ndị na-enyefe ma ọ bụ na-ere ndị ọzọ n’aka ndị iro n’ụzọ aghụghọ. Nsụgharị a bụ nke doro ndị Igbo taa anya ma na-eburu ịdị njọ nke omume ahụ.
- source_word: προπετεῖς
  choice: ndị na-eme ihe n’echeghị echiche
  rationale: Okwu Grik a na-akọwa ndị na-eji ọkụ ọkụ eme ihe n’ebughị ụzọ tụlee ihe ga-esi na ya pụta. Nke a na-enye echiche nke ịdị ọkụ ọkụ na enweghị akpachapụ anya.
- source_word: τετυφωμένοι
  choice: ndị mpako
  rationale: Perfect passive participle a na-egosi ọnọdụ nke mpako juru mmadụ. ‘Ndị mpako’ bụ okwu Igbo dị mfe ma dịkwa ndụ, ebe nkọwa ala peeji na-echekwa ihe atụ nkịtị nke ịbụ onye e fụlitere elu.
- source_word: φιλήδονοι
  choice: ndị hụrụ ihe ụtọ n’anya
  rationale: Nsụgharị a na-echekwa echiche ngwakọta okwu Grik nke ịhụ ihe ụtọ n’anya, ma na-akwadebe ọdịiche ya na ịhụ Chineke n’anya.
- source_word: μᾶλλον ἢ
  choice: karịa
  rationale: N’usoro a, okwu ndị a na-egosi na a na-ahọrọ otu ihe karịa nke ọzọ. ‘Karịa’ na-egosipụta ntụnyere na mmasị e tinyere n’ebe na-ekwesịghị ekwesị.
- source_word: φιλόθεοι
  choice: ịhụ Chineke n’anya
  rationale: A haziri ya ka o kwekọọ n’ụzọ okwu na ‘ndị hụrụ ihe ụtọ n’anya,’ si otú ahụ chekwaa ntụnyere okwu Grik nke ọma n’Igbo nkịtị.
theological_decisions:
- issue: Ichekwa ntụnyere dị n’etiti φιλήδονοι na φιλόθεοι n’etinyeghị nkọwa ozizi ọzọ
  choice: ndị hụrụ ihe ụtọ n’anya karịa ịhụ Chineke n’anya
  alternative: ndị na-ahụ ihe ụtọ n’anya, ma ha anaghị ahụ Chineke n’anya
  rationale: Nhọrọ a na-echekwa usoro ntụnyere μᾶλλον ἢ na myirịta dị n’okwu abụọ ahụ. Nhọrọ ọzọ ga-eme ka okwu ahụ bụrụ nkwụsị ịhụ Chineke n’anya kpamkpam, ebe Grik nwere ike ilekwasị anya n’ịhọrọ ihe ụtọ karịa Chineke.
- issue: Otu e si asụgharị ihe atụ dị na τετυφωμένοι
  choice: ndị mpako, tinyere nkọwa ala peeji banyere ihe atụ nkịtị
  alternative: ndị e fụlitere elu
  rationale: ‘Ndị mpako’ na-ekwupụta ihe okwu ahụ pụtara n’Igbo eke. Nkọwa ala peeji na-echekwa ihe atụ nke okwu Grik n’emeghị ka isi ederede sie ike nghọta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, sụgharịa usoro àgwà ọjọọ a. E debere usoro ‘ndị…’ iji mee ka ndepụta ahụ nwee otu uda, ma chekwaa ọdịiche dị n’etiti ịhụ ihe ụtọ na ịhụ Chineke n’anya.
