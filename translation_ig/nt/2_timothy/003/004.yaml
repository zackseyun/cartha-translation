  text: ndị na-arara ndị ọzọ nye[a], ndị na-eme ihe n’echeghị echiche[b], ndị mpako[c], ndị hụrụ ihe ụtọ n’anya karịa ka ha hụrụ Chineke n’anya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị sabo.”
