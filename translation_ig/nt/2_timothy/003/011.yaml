id: 2TI.3.11
reference: 2 Timothy 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῖς διωγμοῖς, τοῖς παθήμασιν, οἷά μοι ἐγένετο ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις, οἵους διωγμοὺς ὑπήνεγκα· καὶ ἐκ πάντων με ἐρρύσατο ὁ κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/011.yaml
  text: the persecutions[a], the sufferings, such as happened to me in Antioch, in Iconium, in Lystra—what persecutions I endured[b]; and from them all the Lord rescued me.
translation:
  language: ig
  text: mkpagbu, ahụhụ—ihe ndị dakwasịrị m n’Antiọk, n’Aịkoniọm, na Listra—lee ụdị mkpagbu ndị m tachiri obi![a] Ma Onyenwe anyị napụtara m n’ime ha niile.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpagbu ndị m tachiri obi.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “Onyenwe anyị” na-ezo aka n’Onyenwe anyị Jizọs, ọ bụ ezie na ihe odide Grik kwuru naanị “Onyenwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: διωγμοῖς / διωγμούς
  choice: mkpagbu
  rationale: “Mkpagbu” bụ okwu Igbo doro anya maka mmegbu na nchụso iro mmadụ na-ata n’ihi nkwenye ma ọ bụ ozi ya; ọ dabara n’ihe Pọl na-akọ.
- source_word: παθήμασιν
  choice: ahụhụ
  rationale: “Ahụhụ” na-edobe obosara nke πάθημα, nke na-agụnye ahụmahụ dị iche iche nke ịta ahụhụ, n’ebughị ụzọ kpachie ya n’otu ụdị nsogbu.
- source_word: οἷά μοι ἐγένετο
  choice: ndị dakwasịrị m
  rationale: Nkebi a na-egosi ihe ndị mere Pọl dịka ihe atụ nke mkpagbu na ahụhụ ndị o kwuru; “dakwasịrị m” bụ okwu Igbo e ji akọ ihe siri ike mere mmadụ.
- source_word: ἐν Ἀντιοχείᾳ, ἐν Ἰκονίῳ, ἐν Λύστροις
  choice: n’Antiọk, n’Ikoniọm, na Listra
  rationale: A sụgharịghị aha ebe ndị ahụ kama e dere ha n’ụdị dabara n’usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: οἵους διωγμοὺς
  choice: lee ụdị mkpagbu ndị
  rationale: “Lee ụdị” na-egosipụta ike okwu na àgwà nke οἵους, ma ka na-ahapụ ya ka ọ bụrụ ntụaka n’ụdị ma ọ bụ ịdị ukwuu nke mkpagbu ahụ.
- source_word: ὑπήνεγκα
  choice: m tachiri obi ha
  rationale: “Ịtachi obi” na-egosi iburu ihe siri ike ma nọgide na-eguzosi ike n’okpuru ya, nke dabara na ὑποφέρω ebe a.
- source_word: ἐκ πάντων
  choice: n’ime ha niile
  rationale: “N’ime ha niile” na-edobe echiche nke ịbụ onye a napụtara site n’etiti mkpagbu na ahụhụ ndị ahụ niile.
- source_word: ἐρρύσατο
  choice: napụtara
  rationale: “Napụtara” bụ okwu Igbo nkịtị ma sie ike maka ịzọpụta mmadụ n’ihe ize ndụ, na-enweghị ime ka okwu a bụrụ kpọmkwem okwu banyere nzọpụta mmehie.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ a na-aghọta nke ọma n’Igbo maka κύριος; e tinyeghị aha “Jizọs” n’ahịrịokwu ahụ ebe ọ bụ na isi mmalite kwuru naanị “Onyenwe.”
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya
  choice: E dere naanị “Onyenwe anyị,” n’agbakwụnyeghị “Jizọs.”
  alternative: Onyenwe anyị Jizọs
  rationale: N’akwụkwọ Pọl, aha a yikarịrị ka ọ na-ezo aka n’Onyenwe anyị Jizọs, ma Grik kwuru naanị ὁ κύριος. Ya mere, nsụgharị ahụ echekwala ihe ederede kwuru n’ebughị ụzọ dozie onye ọ bụ n’ahịrịokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere ugwu ma dị mfe nghọta. A haziri nkebi mbụ ka ọ bụrụ ndepụta na-aga n’ihu site n’amaokwu bu ya ụzọ, ma e jiri akara ogologo na mkpu mee ka ike nke οἵους pụta ìhè. A hapụrụ aha ebe dịka ntụgharị-mkpọpụta, ma chekwaa nghọtahie nwere ike ịdị n’onye aha “Onyenwe anyị” na-ezo aka na ya.
