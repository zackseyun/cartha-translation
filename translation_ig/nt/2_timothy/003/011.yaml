  to: mkpagbu, ahụhụ—ihe ndị dakwasịrị m n’Antiọk, n’Aịkoniọm, na Listra—lee ụdị mkpagbu ndị m tachiri obi![a] Ma Onyenwe anyị napụtara m n’ime ha niile.[b]
