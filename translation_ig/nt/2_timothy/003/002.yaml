review_pass:
  verdict: revise
  source_fidelity: Nkebi ahịrịokwu ahụ na-edobe usoro na ọdịnihu nke Grik nke ọma. Otú ọ dị, βλάσφημοι anaghị akọwa kpọmkwem na nkwulu ahụ na-emegide mmadụ ma ọ bụ Chineke n’otu n’otu; itinye “mmadụ ma ọ bụ Chineke” n’ederede bụ isi na-agbakwunye nkọwa nke okwu Grik hapụrụ sara mbara.
  naturalness: Igbo ahụ dị n’usoro ma dị mfe ịghọta. “Ndị nkwulu” dị mkpirikpi, dabara n’uda ndepụta a, ma na-ahapụ obosara okwu ahụ ka nkọwa ala peeji kọwaa ya.
  terminology: “Ndị hụrụ onwe ha n’anya,” “ndị hụrụ ego n’anya,” “ndị na-etu ọnụ,” “ndị mpako,” “ndị na-enupụrụ nne na nna ha isi,” “ndị na-enweghị ekele,” na “ndị na-adịghị asọpụrụ ihe dị nsọ” na-anọchi anya okwu Grik ndị kwekọrọ na ha nke ọma. “Ndị nkwulu” bụ nhọrọ kwesịrị ekwesị maka βλάσφημοι, ebe nkọwa ala peeji na-echekwa nhọrọ “okwu mkparị” na obosara ya.
  issues:
  - severity: medium
    issue: “ndị na-ekwulu mmadụ ma ọ bụ Chineke” na-akọwa ebe nkwulu ahụ gbadoro kpọmkwem karịa ka Grik si kwuo.
    rationale: βλάσφημοι nwere ike ịgụnye nkwulu, ikwu okwu mkparị, ma ọ bụ okwu na-eweda onye ọzọ ala; ihe odide ahụ ekwughị kpọmkwem “mmadụ ma ọ bụ Chineke” n’ebe a. E kwesịrị idobe nkọwa ahụ n’ala peeji, ọ bụghị ime ya akụkụ nke ederede bụ isi.
