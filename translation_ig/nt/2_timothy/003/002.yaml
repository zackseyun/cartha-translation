id: 2TI.3.2
reference: 2 Timothy 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔσονται γὰρ οἱ ἄνθρωποι φίλαυτοι, φιλάργυροι, ἀλαζόνες, ὑπερήφανοι, βλάσφημοι, γονεῦσιν ἀπειθεῖς, ἀχάριστοι, ἀνόσιοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/002.yaml
  text: For people will be lovers of self[a], lovers of money, boastful, arrogant, slanderous, disobedient to parents, ungrateful, unholy,
translation:
  language: ig
  text: N’ihi na ndị mmadụ ga-abụ ndị hụrụ onwe ha n’anya, ndị hụrụ ego n’anya, ndị na-etu ọnụ, ndị mpako, ndị nkwulu[a], ndị na-enupụrụ nne na nna ha isi, ndị na-enweghị ekele, ndị na-adịghị asọpụrụ ihe dị nsọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ekwu okwu mkparị.” Okwu Grik a nwere ike ịpụta okwu na-eweda mmadụ ma ọ bụ Chineke ala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: ga-abụ
  rationale: Na-egosipụta ọdịnihu nke εἰμί n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejigide njikọ nkọwa ya na okwu bu ụzọ.
- source_word: οἱ ἄνθρωποι
  choice: ndị mmadụ
  rationale: Ọ bụ okwu gbasara mmadụ niile n’ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: φίλαυτοι
  choice: ndị hụrụ onwe ha n’anya
  rationale: Na-egosipụta ịhụ onwe onye n’anya n’ụzọ ịchọ ọdịmma onwe ya, ma na-edobe usoro ndepụta ahụ.
- source_word: φιλάργυροι
  choice: ndị hụrụ ego n’anya
  rationale: Na-egosipụta kpọmkwem echiche ịhụ ego n’anya ma kwekọọ n’usoro φίλαυτοι.
- source_word: ἀλαζόνες
  choice: ndị na-etu ọnụ
  rationale: Ọ bụ okwu Igbo doro anya maka ndị na-anya isi ma na-akọwa onwe ha karịa ihe ha bụ.
- source_word: ὑπερήφανοι
  choice: ndị mpako
  rationale: Na-enye echiche omume ọjọọ nke ịdị elu n’obi na nlelị ndị ọzọ.
- source_word: βλάσφημοι
  choice: ndị na-ekwulu mmadụ ma ọ bụ Chineke[a]
  rationale: Okwu Grik ahụ nwere ike ịpụta okwu mkparị ma ọ bụ nkwulu e kwuru megide mmadụ ma ọ bụ Chineke; ntụgharị a na-edobe obosara ihe ọ pụtara.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: ndị na-enupụrụ nne na nna ha isi
  rationale: Akpaalaokwu Igbo a na-egosipụta ịjụ irubere nne na nna isi.
- source_word: ἀχάριστοι
  choice: ndị na-enweghị ekele
  rationale: Ọ bụ ụzọ Igbo dị mfe ma doo anya isi kwuo enweghị obi ekele.
- source_word: ἀνόσιοι
  choice: ndị na-adịghị asọpụrụ ihe dị nsọ
  rationale: Na-egosipụta enweghị nsọpụrụ na nsọpụrụ ofufe nye ihe dị nsọ, na-enweghị ịkọwa ya naanị dị ka omume rụrụ arụ.
theological_decisions:
- issue: Ihe οἱ ἄνθρωποι na-ezo aka na ya
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: Ụdị oke nwoke nke ụtọasụsụ Grik bụ nke na-anọchite mmadụ niile ebe a; ya mere a naghị egbochi ya n’ebe ụmụ nwoke nọ.
- issue: Ihe βλάσφημοι pụtara na ndepụta ajọ omume a
  choice: ndị na-ekwulu mmadụ ma ọ bụ Chineke
  alternative: ndị nkwulu; ndị na-ekwu okwu mkparị
  rationale: Okwu ahụ nwere ike izo aka n’okwu na-eweda mmadụ ma ọ bụ Chineke ala. Ekwesịghị idozi nghọta ahụ n’otu akụkụ naanị.
- issue: Ihe ἀνόσιοι pụtara
  choice: ndị na-adịghị asọpụrụ ihe dị nsọ
  alternative: ndị na-adịghị nsọ; ndị na-adịghị asọpụrụ Chineke
  rationale: Nhọrọ a na-edobe echiche nke enweghị nsọpụrụ maka ihe dị nsọ n’enweghị ime ka okwu ahụ bụrụ naanị okwu gbasara ịdị ọcha ma ọ bụ naanị ịkpọ Chineke aha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E ji usoro “ndị…” ugboro ugboro chekwaa uda ndepụta ajọ omume nke ihe odide Grik.
