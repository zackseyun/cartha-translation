source:
  edition: SBLGNT
  text: ἀλλ’ οὐ προκόψουσιν ἐπὶ πλεῖον, ἡ γὰρ ἄνοια αὐτῶν ἔκδηλος ἔσται πᾶσιν, ὡς καὶ ἡ ἐκείνων ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/009.yaml
  text: But they will not advance any further[a], for their foolishness will be plain to everyone[b], as that of those men also became.
translation:
  language: ig
  text: Ma ha agaghị enwekwu ọganihu, n’ihi na nzuzu ha ga-apụta ìhè n’ihu mmadụ niile, dịka nzuzu ndị ahụ pụtara ìhè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, nzuzu Janes na Jambres, ndị a kpọrọ aha n’amaokwu gara aga.
    reason: cross_reference
lexical_decisions:
- source_word: προκόψουσιν
  choice: ga-aga n’ihu
  rationale: Okwu a na-egosi ịga n’ihu ma ọ bụ imekwu ọganihu. N’ebe a ọ naghị ekwu na ọganihu ahụ dị mma; ọ na-ekwu naanị na ọrụ ndị nkuzi ụgha ahụ agaghị anọgide na-aga n’ihu.
- source_word: ἐπὶ πλεῖον
  choice: karịa nke a
  rationale: Nkebiokwu a pụtara ‘gaa n’ihu karịa’ ma ọ bụ ‘ruo n’ókè ka ukwuu.’ ‘Karịa nke a’ na-adaba n’ụzọ e si ekwu Igbo ma na-egosi na a ga-akwụsị ọganihu ha.
- source_word: ἄνοια
  choice: enweghị uche
  rationale: Ọ na-egosi enweghị nghọta, nzuzu, ma ọ bụ omume na-enweghị ezi uche. ‘Enweghị uche’ bụ okwu doro anya, nke na-echekwa akụkụ ọgụgụ isi na nke omume dị n’okwu Grik ahụ.
- source_word: ἔκδηλος
  choice: ga-apụta ìhè
  rationale: Ọ pụtara ihe ga-edo anya ma ọ bụ bụrụ ihe mmadụ niile pụrụ ịhụ nke ọma. Nkebiokwu a bụ Igbo dị ndụ ma kwanyere ugwu.
- source_word: πᾶσιν
  choice: nye mmadụ niile
  rationale: Nke a na-egosipụta oke sara mbara nke πᾶσιν n’ụzọ doro anya n’Igbo.
- source_word: ὡς καὶ ἡ ἐκείνων ἐγένετο
  choice: dị nnọọ ka nke ndị ahụ pụtakwara ìhè
  rationale: ‘Nke’ na-anọchi anya ‘enweghị uche,’ ebe ‘ndị ahụ’ na-ejigide ntụaka azụ nke ἐκείνων. ‘Pụtakwara ìhè’ na-egosipụta καί ma mee ka ahịrịokwu elliptical ahụ bụrụ nke eke n’Igbo.
theological_decisions:
- issue: Onye ἐκείνων (‘ndị ahụ’) na-ezo aka na ya
  choice: E debere ya dịka ‘ndị ahụ,’ ya bụ, ndị e kwuru okwu ha n’amaokwu gara aga.
  alternative: Ịkpọ aha Jannis na Jambris ozugbo n’ahịrịokwu bụ isi, ma ọ bụ iwere ya dịka ntụaka izugbe nye ndị nkuzi ụgha gara aga.
  rationale: Ọnọdụ okwu dị nso na-ezo aka na Jannis na Jambris na 3:8. Ma ide ‘ndị ahụ’ n’ahịrịokwu bụ isi na-echekwa ụzọ Grik si kwuo ya, ebe nkọwa ala peeji na-eme ka ntụaka ahụ doo anya n’enweghị itinye aha ndị ahụ n’ime ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E jigidere ihe atụ nke ‘ịga n’ihu,’ ma zere ime ka ọ pụta na ọganihu ahụ bụ ihe ọma. E jigidere ntụaka ‘ndị ahụ’ n’ederede, ebe nkọwa ala peeji kọwara njikọ ya na amaokwu 8.
