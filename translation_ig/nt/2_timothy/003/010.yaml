id: 2TI.3.10
reference: 2 Timothy 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σὺ δὲ ⸀παρηκολούθησάς μου τῇ διδασκαλίᾳ, τῇ ἀγωγῇ, τῇ προθέσει, τῇ πίστει, τῇ μακροθυμίᾳ, τῇ ἀγάπῃ, τῇ ὑπομονῇ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/010.yaml
  text: But you have closely followed my teaching[a], conduct, purpose, faith, patience, love, endurance,
translation:
  language: ig
  text: Ma gị onwe gị esorola ozizi m, omume m, nzube m, okwukwe m[a], ndidi m, ịhụnanya m, na ntachi obi m nke ọma,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwesị ntụkwasị obi.” Okwu Grik ahụ nwere ike ịpụta okwukwe ma ọ bụ ikwesị ntụkwasị obi nʼebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ma gị onwe gị
  rationale: “Ma” na-egosi ọdịiche dị nʼetiti Timoti na ndị ọjọọ a kọwara tupu nke a; “gị onwe gị” na-echekwa nkwusi ike dị na Σὺ.
- source_word: παρηκολούθησάς
  choice: esorola nlezianya
  rationale: Nhọrọ a na-egosi ma ịmata ihe Pọl kụziri na otú o si bie ndụ nke ọma, ma iso ya dịka ihe nlereanya.
- source_word: μου
  choice: m
  rationale: E tinyere nnọchiaha nke onye nwe ihe nʼihe niile dị na ndepụta ahụ nʼụzọ Igbo si ekwu ya nke ọma.
- source_word: διδασκαλίᾳ
  choice: ozizi
  rationale: “Ozizi” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe maka ihe mmadụ na-akụzi.
- source_word: ἀγωγῇ
  choice: omume
  rationale: Nʼebe a ἀγωγή pụtara akparamàgwà ma ọ bụ ụzọ ndụ; “omume” dị nkenke ma bụrụ nke ndị mmadụ na-aghọta ngwa ngwa.
- source_word: προθέσει
  choice: nzube
  rationale: “Nzube” na-egosi ebumnuche Pọl kpebisiri ike ịgbaso.
- source_word: πίστει
  choice: okwukwe
  rationale: “Okwukwe” na-echekwa nghọta bụ isi nke πίστις; ebe ọ pụkwara ịpụta ikwesị ntụkwasị obi nʼebe a, e debere nke ahụ nʼokpuru peeji.
- source_word: μακροθυμίᾳ
  choice: ogologo ntachi obi
  rationale: Nkebiokwu a na-egosi ndidi mmadụ na-enwe nʼebe ndị ọzọ nọ, karịchaa mgbe a kpasuru ya iwe, ma na-ekewapụ ya na ὑπομονή.
- source_word: ἀγάπῃ
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo ebumpụta ụwa na nke doro anya maka ἀγάπη.
- source_word: ὑπομονῇ
  choice: ntachi obi m nʼọnwụnwa
  rationale: Mgbakwunye “nʼọnwụnwa” na-eme ka echiche nke ịnọgidesi ike nʼoge ihe isi ike pụta ìhè ma na-egbochi ya ịghọ otu ihe na μακροθυμία.
theological_decisions:
- issue: Ihe πίστις pụtara nʼime ndepụta àgwà Pọl
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi
  rationale: πίστις nwere ike ịpụta ntụkwasị obi mmadụ nwere nʼebe Chineke nọ ma ọ bụ àgwà nke ikwesị ntụkwasị obi. Ihe gbara ya gburugburu anaghị ekpebi naanị otu nʼime ha kpamkpam, ya mere e jiri “okwukwe” mee isi ederede ma chekwaa nke ọzọ nʼokpuru peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji nkwughachi “m” mee ka njikọ nke μου na ihe niile dị na ndepụta doo anya. E kewapụtara μακροθυμία na ὑπομονή site nʼiji “ogologo ntachi obi” na “ntachi obi nʼọnwụnwa.”
