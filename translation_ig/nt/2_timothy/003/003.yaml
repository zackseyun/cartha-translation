  text: ἄστοργοι, ἄσπονδοι, διάβολοι, ἀκρατεῖς, ἀνήμεροι, ἀφιλάγαθοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/003.yaml
  text: without natural affection[a], irreconcilable, slanderous, without self-control, savage, without love for what is good[c][b],
translation:
  language: ig
  text: ndị na-enweghị ịhụnanya e kwesịrị inwe n’ebe ndị ezinụlọ ha nọ, ndị na-adịghị ekwe ka ha na ndị ọzọ kpee udo[a], ndị na-ekwu okwu ọjọọ banyere ndị ọzọ[b], ndị na-enweghị njide onwe ha, ndị obi tara mmiri, ndị na-adịghị ahụ ihe ọma n’anya[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị a na-apụghị ime ka iwe ha dajụọ,” ma ọ bụ “ndị na-emebi nkwekọrịta udo.”
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, okwu Grik διάβολοι pụtara “ndị na-ekwu okwu ọjọọ banyere ndị ọzọ” ma ọ bụ “ndị na-ebo ndị ọzọ ebubo ụgha”; ọ naghị ezo aka n’Ekwensu.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “ndị kpọrọ ihe ọma asị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄστοργοι
  choice: ndị na-enweghị ịhụnanya e kwesịrị inwe n’ebe ndị ezinụlọ ha nọ
  rationale: Okwu a na-egosi enweghị ụdị ịhụnanya a na-atụ anya ya karịsịa n’etiti ndị ezinụlọ ma ọ bụ ndị ikwu; ntụgharị a na-eme ka nkọwa ahụ doo ndị na-agụ Igbo anya.
- source_word: ἄσπονδοι
  choice: ndị na-adịghị ekwe ka e mee ka ha na ndị ọzọ dịrị n’udo
  rationale: Ọ na-akọwa ndị na-ajụ ime udo ma ọ bụ idozi esemokwu. Nke a na-egosipụta ajụjụ ime ka mmekọrịta dịghachi mma karịa nanị imebi nkwekọrịta udo.
- source_word: διάβολοι
  choice: ndị na-ekwutọ mmadụ
  rationale: N’usoro ndepụta omume ọjọọ a, ụdị ọtụtụ nke okwu ahụ na-akọwa ndị na-ebo mmadụ ebubo ụgha ma ọ bụ na-emebi aha ya; ọ naghị ezo aka n’Ekwensu.
- source_word: ἀκρατεῖς
  choice: ndị na-enweghị njide onwe ha
  rationale: Ọ na-egosi enweghị ike ijide ọchịchọ na mkpali onwe onye; okwu Igbo a bụ nke doro anya ma kwekọọ n’asụsụ ugbu a.
- source_word: ἀνήμεροι
  choice: ndị obi tara mmiri
  rationale: Okwu Grik ahụ pụtara ndị na-adịghị nwayọọ, ndị obi ọjọọ ma ọ bụ ndị na-eme ihe ike. ‘Ndị obi tara mmiri’ bụ okwu Igbo dị ndụ ma dị mfe nghọta.
- source_word: ἀφιλάγαθοι
  choice: ndị na-adịghị ahụ ihe ọma n’anya
  rationale: Ngwakọta okwu ahụ pụtara n’ụzọ bụ isi ‘ndị na-adịghị ahụ ihe ọma n’anya.’ Nke a na-echekwa ike nke ngọnarị ahụ n’enweghị ime ka ọ bụrụ ịkpọ ihe ọma asị kpọmkwem.
theological_decisions:
- issue: Ihe διάβολοι pụtara n’usoro ndepụta omume ọjọọ
  choice: ndị na-ekwutọ mmadụ
  alternative: ndị ekwensu; ndị yiri Ekwensu
  rationale: N’ebe a, okwu ahụ bụ ụdị ọtụtụ nke na-arụ ọrụ dị ka nkọwa omume n’etiti omume ọjọọ ndị ọzọ. Ịsụgharị ya dị ka ‘ndị ekwensu’ ga-eme ka ndị na-agụ ya chee na ọ na-ekwu banyere ụdị ndị mmụọ kama omume mmadụ.
- issue: Ike okwu ἀφιλάγαθοι
  choice: ndị na-adịghị ahụ ihe ọma n’anya
  alternative: ndị kpọrọ ihe ọma asị
  rationale: Ụdị okwu Grik ahụ na-egosi enweghị ịhụ ihe ọma n’anya; ọ bụghị iwu na ọ pụtara ịkpọ ya asị n’ike. E debere ntụgharị siri ike karị n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere usoro nkọwa ndị mmadụ n’ụdị yiri ibe ha iji chekwaa ụda ndepụta omume ọjọọ nke Grik. Akara ala ala peeji [a], [b], na [c] pụtara n’isi ederede n’ebe okwu ha metụtara dị.
