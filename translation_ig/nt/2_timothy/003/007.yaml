  text: πάντοτε μανθάνοντα καὶ μηδέποτε εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν δυνάμενα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/007.yaml
  text: always learning and never able to come to the knowledge of the truth[a].
translation:
  language: ig
  text: ndị na-amụta ihe mgbe niile, ma ọ dịghị mgbe ha nwere ike iru n’ịmata eziokwu ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịmata eziokwu ahụ nke ọma.” Okwu Grik a nwekwara ike igosi ịmata eziokwu ahụ n’ụzọ zuru ezu karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Nke a na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro, ma na-edobe ọdịiche ya na μηδέποτε.
- source_word: μανθάνοντα
  choice: ndị na-amụta ihe
  rationale: Ọ bụ participle nke ugbu a na-egosi mmụta na-aga n’ihu; nsụgharị a anaghị ekpebi ma a na-akụziri ha ihe n’usoro ma ọ bụ na ha na-amụ ya n’ụzọ ọzọ.
- source_word: μηδέποτε
  choice: ọ dịghị mgbe
  rationale: Ọ na-enye nkwụsi ike nke ‘ọ dịghị mgbe ọ bụla’ ma na-emegide ‘mgbe niile’ n’ụzọ doro anya.
- source_word: εἰς ἐπίγνωσιν
  choice: n’ịmata
  rationale: Ọ na-egosi iru n’ọnọdụ nke ịmata ihe. Igbo a bụ nke eke, ma nkọwa ala peeji na-echekwa ohere nke nghọta ‘ịmata nke ọma.’
- source_word: ἀληθείας
  choice: eziokwu ahụ
  rationale: Ọ na-adabere na ἐπίγνωσιν. ‘Eziokwu ahụ’ dabara n’otú Pọl si ekwu maka eziokwu a maara nke ọma, ọ bụghị naanị eziokwu n’ozuzu.
- source_word: ἐλθεῖν
  choice: ịbịarute
  rationale: Ọ na-echekwa ihe atụ nke mmadụ na-eru ma ọ bụ na-abịarute n’ebe ihe dị.
- source_word: δυνάμενα
  choice: ha pụrụ
  rationale: Ọ na-egosi ikike. ‘Ha’ na-ezo aka n’ụmụ nwaanyị a kpọtụrụ aha n’amaokwu bu ụzọ, dịka nkwekọrịta feminine plural nke okwu Grik si gosi.
theological_decisions:
- issue: Ihe ἐπίγνωσις pụtara n’ebe a
  choice: ịmata
  alternative: ịmata nke ọma
  rationale: Isi okwu a bụ na, n’agbanyeghị mmụta ha na-amụta mgbe niile, ha apụghị iru n’ezi ịmata eziokwu ahụ. ‘Ịmata’ anaghị eme ka okwu Grik kwuo ihe karịrị ihe a chọrọ, ebe nkọwa ala peeji na-edobe nghọta siri ike karị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro participle ahụ dịka nkebiokwu na-akọwa ụmụ nwaanyị ndị amaokwu bu ụzọ kwuru maka ha; e tinyereghị nkọwa okpukpe pụrụ iche.
