  text: καὶ πάντες δὲ οἱ θέλοντες ⸂ζῆν εὐσεβῶς⸃ ἐν Χριστῷ Ἰησοῦ διωχθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/012.yaml
  text: And indeed[a], all who want to live godly in Messiah Jesus will be persecuted.
translation:
  language: ig
  text: N’ezie, a ga-akpagbu ndị niile chọrọ ibi ndụ n’ụzọ na-asọpụrụ Chineke n’ime Mesaya Jizọs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst Jizọs.”
    reason: alternative_rendering
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: N’eziekwa
  rationale: Okwu a na-ejikọta ahịrịokwu ahụ na ihe bu ya ụzọ ma na-emesikwa nkwupụta ahụ ike; “N’eziekwa” na-egosipụta ma njikọ ahụ ma nkwenye ahụ n’Igbo dị mfe.
- source_word: πάντες οἱ θέλοντες
  choice: ndị niile chọrọ
  rationale: Nke a na-edobe mkpokọta zuru ezu nke πάντες na ọchịchọ nke θέλω n’asụsụ Igbo nkịtị.
- source_word: ζῆν εὐσεβῶς
  choice: ibi ndụ n’ụzọ na-asọpụrụ Chineke
  rationale: εὐσεβῶς na-ekwu maka ibi ndụ n’ụzọ nwere nsọpụrụ na nrubeisi nye Chineke; nsụgharị a bụ nke doro anya ma dịkwa ugbu a karịa okwu nwere ike iyi ihe mgbe ochie.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaya Jizọs
  rationale: ἐν na-egosi ọnọdụ ma ọ bụ njikọ nke ndụ ahụ dị n’ime ya, ebe Χριστός nọ ebe a dịka aha ọkwá, ya bụ Mesaya.
- source_word: διωχθήσονται
  choice: ka a ga-akpagbu
  rationale: Nke a na-edobe ọdịdị ọdịnihu na nke nnara-eme nke ngwaa Grik ahụ, ma na-ekwu kpọmkwem banyere mkpagbu n’ihi okwukwe.
theological_decisions:
- issue: Ịsụgharị Χριστῷ dịka aha ọkwá ma ọ bụ dịka ụdị aha mmadụ
  choice: Mesaya Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a, Χριστός ka nwere nghọta doro anya dịka aha ọkwá nke Onye E Tere Mmanụ; e debere ụdị a na-ahụkarị, “Kraịst Jizọs,” n’okpuru ala ka a ghara izochi ụzọ ọzọ e si asụgharị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “N’ụzọ na-asọpụrụ Chineke” na-akọwa omume ndụ nke εὐσεβῶς n’enweghị itinye nkọwa ụka pụrụ iche.
