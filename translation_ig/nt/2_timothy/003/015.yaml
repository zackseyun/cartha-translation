reference: 2 Timothy 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅτι ἀπὸ βρέφους ⸀ἱερὰ γράμματα οἶδας, τὰ δυνάμενά σε σοφίσαι εἰς σωτηρίαν διὰ πίστεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/015.yaml
  text: and that from infancy you have known the sacred writings[b][a], which are able to make you wise for salvation through faith in Messiah Jesus.
translation:
  language: ig
  text: nakwa na site n’oge ị bụ nwa ọhụrụ, ị maara akwụkwọ ndị dị nsọ[a], ndị nwere ike ime ka i nwee amamihe maka nzọpụta site n’okwukwe dị na Mesaịa Jizọs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Akwụkwọ Nsọ.” N’asụsụ Grik, ọ pụtara kpọmkwem “ihe odide ndị dị nsọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ikwesị ntụkwasị obi nke Mesaịa Jizọs,” ọ bụ ezie na “site n’okwukwe dị na Mesaịa Jizọs” bụ nghọta kacha kwekọọ n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ βρέφους
  choice: site mgbe ị bụ nwa ọhụrụ
  rationale: βρέφος na-ezo aka n’obere nwa, ọbụna nwa ọhụrụ. Nke a na-echekwa ike okwu Grik karịa naanị ‘site n’oge nwata,’ ma na-ada nke ọma n’Igbo.
- source_word: ἱερὰ γράμματα
  choice: ihe odide ndị dị nsọ
  rationale: Nke a na-esochi kpọmkwem echiche ‘ihe e dere nke dị nsọ’ n’asụsụ Grik, n’etinyeghị ozugbo aha teknụzụ e ji akpọ Akwụkwọ Nsọ n’oge e mesịrị.
- source_word: οἶδας
  choice: ị maara
  rationale: Ọ bụ ezie na ọdịdị okwu Grik bụ perfect, οἶδα nwere nghọta nke ọnọdụ dị ugbu a; njikọ ya na ‘site mgbe ị bụ nwa ọhụrụ’ na-egosi ihe ọmụma malitere n’oge ahụ ma ka dị.
- source_word: τὰ δυνάμενά σε σοφίσαι
  choice: ndị nwere ike ime ka i nwee amamihe
  rationale: Nkebi a na-akọwa ihe odide ndị ahụ ma na-echekwa echiche nke inye mmadụ amamihe.
- source_word: εἰς σωτηρίαν
  choice: maka nzọpụta
  rationale: εἰς ebe a na-egosi ebumnuche ma ọ bụ ihe a na-eduga ná ya; ‘maka nzọpụta’ dị mkpirikpi ma doo anya.
- source_word: διὰ πίστεως
  choice: site n’okwukwe
  rationale: N’ebe a πίστις pụtara okwukwe ma ọ bụ ntụkwasị obi; ‘site n’okwukwe’ bụ okwu Igbo kwụ ọtọ ma bụrụ nke a na-aghọta nke ọma.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: na Mesaịa Jizọs
  rationale: Χριστός ka e sụgharịrị dị ka utu aha ‘Mesaịa,’ ebe Ἰησοῦ bụ aha a sụgharịrị n’ụdị Igbo ‘Jizọs.’ Preposition ahụ na-ejikọta okwukwe ahụ na Mesaịa Jizọs.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστός dị ka utu aha ka ọ bụ jiri ụdị aha ọdịnala
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: Χριστός bụ utu aha kwekọrọ na ‘Onye E Tere Mmanụ’ ma ọ bụ ‘Mesaịa.’ Isi ederede na-eme ka uru utu aha ahụ pụta ìhè kama iji naanị ụdị transliteration ọdịnala.
- issue: Ihe πίστεως τῆς ἐν Χριστῷ Ἰησοῦ pụtara
  choice: okwukwe na Mesaịa Jizọs
  alternative: ikwesị ntụkwasị obi nke Mesaịa Jizọs
  rationale: Usoro okwu a na ọnọdụ ya na-akacha egosi okwukwe mmadụ nke dabeere na Mesaịa Jizọs. Otú ọ dị, ebe πίστις nwekwara ike ịpụta ikwesị ntụkwasị obi, e debere nghọta ahụ n’ala peeji kama ikpochapụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. A họọrọ ‘ihe odide ndị dị nsọ’ iji nọgide nso n’okwu Grik, ebe a kọwara ‘Akwụkwọ Nsọ’ n’ala peeji. E debere akara ala peeji [a] na [b] kpọmkwem n’ebe okwu ha na-akọwa dị n’isi ederede.
