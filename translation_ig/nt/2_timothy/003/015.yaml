revisions:
- from: nakwa na site mgbe ị bụ nwa ọhụrụ, ị maara ihe odide ndị dị nsọ[a], ndị nwere ike ime ka i nwee amamihe maka nzọpụta site n’okwukwe na Mesaịa Jizọs.[b]
  to: nakwa na site n’oge ị bụ nwa ọhụrụ, ị maara akwụkwọ ndị dị nsọ[a], ndị nwere ike ime ka i nwee amamihe maka nzọpụta site n’okwukwe dị na Mesaịa Jizọs.[b]
  rationale: The revisions improve idiomatic Standard Igbo and clarify that the faith is related to Messiah Jesus. They retain the source’s infant-time reference, plural sacred writings, purpose/result toward salvation, and the stated main and alternative readings of πίστις.
