  text: Τοῦτο δὲ γίνωσκε ὅτι ἐν ἐσχάταις ἡμέραις ἐνστήσονται καιροὶ χαλεποί·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/001.yaml
  text: 'But know this: in the last days difficult times will come[a].'
translation:
  language: ig
  text: 'Ma mara nke a: n’ụbọchị ndị ikpeazụ, oge siri ike ga-abịa.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “oge dị ize ndụ” ma ọ bụ “oge tara akpụ.” Okwu nkọwa Grik ahụ nwere ike ịpụta oge siri ike, dị ize ndụ, ma ọ bụ nke na-eweta ahụhụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: nke a
  rationale: Nnọchiaha ngosi a na-atụ aka n’ihe ahịrịokwu ὅτι ga-akọwa; “nke a” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji eme ihe kwa ụbọchị.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ntakịrị ntụgharị ma ọ bụ ihe dị iche n’ihe bu ụzọ; “Ma” na-echekwa ntụgharị ahụ n’emebigaghị ya ókè.
- source_word: γίνωσκε
  choice: mara
  rationale: Ọ bụ iwu dị na onye nke abụọ otu, na-akpọ Timoti ka ọ mata ma buru eziokwu a n’uche. “Mara” dị mkpirikpi ma dịkwa eke n’Igbo.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι na-ewebata ihe Timoti kwesịrị ịma. Akara ntụpọ abụọ mgbe “nke a” gasịrị na-enye otu ọrụ ahụ n’Igbo n’ụzọ dị mfe.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: n’ụbọchị ikpeazụ
  rationale: Nke a na-echekwa okwu eskatọlọjị nke Grik n’ụdị a maara nke ọma, n’agbalịghị ịkọwapụta kpọmkwem ókè oge ahụ dị.
- source_word: ἐνστήσονται
  choice: ga-abịa
  rationale: Ụdị ọdịnihu a pụtara na ihe ga-apụta ma ọ bụ bịarute. “Ga-abịa” bụ okwu Igbo doro anya nke dabara n’oge.
- source_word: καιροὶ
  choice: oge ndị
  rationale: καιρός na-ezo aka n’oge ma ọ bụ akụkụ oge nwere àgwà pụrụ iche, ọ bụghị naanị ngagharị elekere. “Oge ndị” na-egosi ọtụtụ oge dị otú ahụ.
- source_word: χαλεποί
  choice: siri ike
  rationale: χαλεπός nwere ike ịpụta ihe tara akpụ, dị ize ndụ, ma ọ bụ na-eweta ahụhụ. “Siri ike” na-enye isi echiche sara mbara n’Igbo nke oge a, ebe nkọwa ala peeji na-echekwa nhọrọ ndị siri ike karị.
theological_decisions:
- issue: Ihe “ụbọchị ikpeazụ” pụtara
  choice: Edobere okwu eskatọlọjị ahụ dị ka “ụbọchị ikpeazụ,” n’agaghị ekpebi na ọ bụ naanị obere oge tupu Kraịst alọghachi.
  alternative: Ịsụgharị ya dị ka oge ikpeazụ kpọmkwem tupu ọgwụgwụ, ma ọ bụ dị ka oge sara mbara nke ụbọchị ikpeazụ maliterela.
  rationale: Okwu Grik nwere ibu nkà mmụta okpukpe ma nwee ike ịgụnye nghọta abụọ ahụ. Nsụgharị ahụ na-ahapụ esemokwu a ka ọ dị, kama itinye usoro eskatọlọjị pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro Igbo eke, ebe ọ na-echekwa ntụgharị “Ma,” iwu “mara,” na okwu eskatọlọjị “ụbọchị ikpeazụ.”
