id: 2TI.3.16
reference: 2 Timothy 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ⸀ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/003/016.yaml
  text: Every Scripture is God-breathed and profitable for teaching[a], for reproof, for correction[c][b], and for training in righteousness.
translation:
  language: ig
  text: Ihe niile e dere n’Akwụkwọ Nsọ sitere n’ume Chineke, bakwaara uru maka izi ihe, maka igosi mmejọ, maka idozi ihe, na maka ọzụzụ n’ezi omume.[c][a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ihe ọ bụla e dere n’Akwụkwọ Nsọ sitere n’ume Chineke, bakwaara uru.” Okwu Grik πᾶσα γραφή nwere ike ịpụta ma “ihe ọ bụla e dere n’Akwụkwọ Nsọ” ma “ihe niile e dere n’Akwụkwọ Nsọ.”'
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “Ihe ọ bụla e dere n’Akwụkwọ Nsọ nke sitere n’ume Chineke bakwaara uru maka izi ihe, maka igosi mmejọ, maka idozi ihe, na maka ọzụzụ n’ezi omume.”'
    reason: alternative_reading
  - marker: c
    text: N’ọnọdụ ụfọdụ, a pụrụ ịsụgharị okwu a sịrị “ezi omume” ka ọ bụrụ “ikpe ziri ezi”; n’ebe a, ọ pụtara nzụlite mmadụ ka ọ na-ebi ndụ kwụ ọtọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα γραφὴ
  choice: Ihe niile e dere n’Akwụkwọ Nsọ
  rationale: N’ebe a, γραφή na-ezo aka n’ihe odide dị nsọ, ọ bụghị ihe odide ọ bụla. Nhọrọ a na-ada nke ọma n’Igbo ma na-enye nghọta mkpokọta nke okwu ahụ; a debere nghọta nkesa, ‘Ihe ọ bụla e dere n’Akwụkwọ Nsọ,’ n’ala peeji.
- source_word: θεόπνευστος
  choice: sitere n’ume Chineke
  rationale: Nke a na-egosipụta ihe mejupụtara okwu Grik ahụ n’ụzọ doro anya—ihe sitere n’ume Chineke—n’etinyeghị ozizi e mesịrị banyere otú mkpali Chineke si arụ ọrụ.
- source_word: ὠφέλιμος
  choice: ọ bakwara uru
  rationale: Nkebiokwu a bụ Igbo nkịtị ma dị ùgwù, na-egosikwa na Akwụkwọ Nsọ bara uru maka ebumnuche ndị a kpọrọ aha.
- source_word: πρὸς διδασκαλίαν
  choice: maka izi ihe
  rationale: Ọ na-ekpuchi omume na ọdịnaya nke nkuzi, na-enweghị ime ka okwu ahụ bụrụ naanị ozizi ụka.
- source_word: ἐλεγμόν
  choice: maka igosi mmadụ ihe ọ na-emejọ
  rationale: Nke a na-egosipụta echiche nke ikpughe mmejọ ma mee ka onye ahụ mata ya; ọ sara mbara karịa naanị ịba mmadụ mba.
- source_word: ἐπανόρθωσιν
  choice: maka imezi ya
  rationale: Ọ na-egosi idozi onye mehiere ma ọ bụ iweghachi ya n’ụzọ ziri ezi, ma na-aga nke ọma na nkebiokwu bu ya ụzọ.
- source_word: παιδείαν τὴν ἐν δικαιοσύνῃ
  choice: maka ịzụ ya ibi ndụ ezi omume
  rationale: παιδεία bụ ọzụzụ na nzụlite na-akpụ akparamàgwà; δικαιοσύνη n’ebe a na-ezo aka n’ibi ndụ ziri ezi. Nsụgharị a bụ nke mmadụ nkịtị ga-aghọta ngwa ngwa.
- source_word: δικαιοσύνῃ
  choice: ezi omume
  rationale: N’ọnọdụ a, okwu ahụ na-elekwasị anya n’ọzụzụ mmadụ ka ọ bie ndụ kwụ ọtọ. ‘Ikpe ziri ezi’ ga-ekwe omume n’ọnọdụ ụfọdụ, ma ọ bụghị ya kacha dabara ebe a.
theological_decisions:
- issue: Mmekọrịta ahịrịokwu dị n’etiti θεόπνευστος na ὠφέλιμος na πᾶσα γραφή
  choice: 'A gụrụ okwu nkọwa abụọ ahụ dị ka ihe a na-ekwu banyere Akwụkwọ Nsọ: ‘Ihe niile e dere n’Akwụkwọ Nsọ sitere n’ume Chineke, ọ bakwara uru.’'
  alternative: ‘Ihe ọ bụla e dere n’Akwụkwọ Nsọ nke sitere n’ume Chineke bakwara uru...’
  rationale: Ọgụgụ nke isi ederede kacha kwekọọ n’usoro okwu ahụ ma na-ewere okwu nkọwa abụọ ahụ n’otu ụzọ. Ma ọgụgụ ọzọ kwekwara omume n’ụtọ asụsụ Grik, ya mere e debere ya n’ala peeji kama iwepụ nghọta ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Akwụkwọ Nsọ’ mee ka o doo anya na γραφή na-ezo aka n’ihe odide dị nsọ. A haziri ndepụta ahụ n’ụzọ na-aga nke ọma n’Igbo, jiri nnọchiaha ‘ya’ jikọta igosi mmejọ, imezi mmadụ, na ịzụ ya.
