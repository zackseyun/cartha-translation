revisions:
- from: Ma ohu Onyenwe anyị ekwesịghị ịbụ onye na-ese okwu, kama ọ ga-adị nwayọọ n’ebe mmadụ niile nọ, bụrụ onye nwere ike izi ihe, na-enwekwa ndidi mgbe e mejọrọ ya.[a]
  to: Ma ohu nke Onyenwe anyị ekwesịghị ịse okwu, kama ọ ghaghị ịdị nwayọọ n'ebe mmadụ niile nọ, bụrụ onye nwere ike izi ihe, onye na-anagide ihe ọjọọ.[a]
  rationale: The revision preserves the Greek syntax and prescriptive force through both sides of the contrast, while retaining the established renderings for δοῦλος, κύριος, and διδακτικός. The footnote remains anchored to ἀνεξίκακον and supplies the accessible explanatory alternative without adding it to the main text.
