id: 2TI.2.24
reference: 2 Timothy 2:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δοῦλον δὲ κυρίου οὐ δεῖ μάχεσθαι, ἀλλὰ ἤπιον εἶναι πρὸς πάντας, διδακτικόν, ἀνεξίκακον,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/024.yaml
  text: And the Lord’s servant must not quarrel[a], but must be gentle toward everyone, able to teach, patient when wronged,
translation:
  language: ig
  text: Ma ohu nke Onyenwe anyị ekwesịghị ịse okwu, kama ọ ghaghị ịdị nwayọọ n'ebe mmadụ niile nọ, bụrụ onye nwere ike izi ihe, onye na-anagide ihe ọjọọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nwere ndidi mgbe e mejọrọ ya.” Okwu Grik a na-egosi onye na-anagide mmerụ, mmejọ, ma ọ bụ ihe ọjọọ n’enweghị mmegwara.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλον
  choice: ohu
  rationale: N'Igbo, “ohu” na-egosipụta onye nọ n'okpuru onye nwe ya ma na-ejere ya ozi. Ọ na-echekwa ịdị arọ nke δοῦλος karịa naanị “onye na-eje ozi,” ebe amaokwu a na-elekwasịkwa anya n'omume onye ahụ. Nkọwa ala peeji na-eme ka nghọta nke okwu ahụ doo anya.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: “Onyenwe anyị” bụ ụzọ Igbo a na-ejikarị nsọpụrụ kpọọ κύριος n'okwu banyere Kraịst, ma genitive ahụ pụtara na ohu ahụ bụ nke Onyenwe anyị.
- source_word: οὐ δεῖ μάχεσθαι
  choice: ekwesịghị ịbụ onye na-ese okwu
  rationale: “Ekwesịghị” na-egosipụta iwu ma ọ bụ ihe a chọrọ n'aka ya; “ịbụ onye na-ese okwu” na-enye μάχεσθαι nghọta nke esemokwu na ọgụ ọnụ n'ọnọdụ a, n'enweghị iwepụ kpamkpam echiche nke omume ọgụ.
- source_word: ἤπιον εἶναι πρὸς πάντας
  choice: ọ ga-adị nwayọọ n’ebe mmadụ niile nọ
  rationale: “Ịdị nwayọọ” na-egosipụta obiọma na ịdị umeala nke ἤπιος, ebe “n'ebe mmadụ niile nọ” na-echekwa obosara nke πρὸς πάντας.
- source_word: διδακτικόν
  choice: onye nwere ike izi ihe
  rationale: Nkebi a pụtara onye ruru eru ma nwee nkà izi ihe, ọ bụghị onye a pụrụ izi ihe.
- source_word: ἀνεξίκακον
  choice: na-enwekwa ndidi mgbe e mejọrọ ya
  rationale: Okwu Grik a na-egosi ịnagide mmerụ ma ọ bụ ihe ọjọọ e mere mmadụ n'enweghị mmegwara; ntụgharị a na-eme ka nke ahụ doo onye na-agụ ya anya.
theological_decisions:
- issue: Ntụgharị δοῦλος n'ọnọdụ ntụziaka banyere ije ozi
  choice: ohu
  alternative: onye na-ejere Onyenwe anyị ozi
  rationale: “Ohu” na-echekwa njikọ nke ịbụ nke Onyenwe anyị na ịnọ n'okpuru ọchịchị ya, ma ihe gbara amaokwu ahụ gburugburu na-emesi omume onye ahụ ike. Nkọwa ala peeji na-egosi na okwu ahụ nwekwara ike ịpụta onye na-eje ozi.
- issue: Ntụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna Ukwu
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ a na-ejikarị eme ihe n'Igbo maka κύριος n'okwu Ndị Kraịst, na-enweghị ịgbakwunye nkọwa okpukpe nke adịghị n'ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edebe ntụnyere dị n'etiti ịlụ ọgụ okwu na ịdị nwayọọ, ma na-akọwa ἀνεξίκακος n'ụzọ doro anya. E tinyere akara [a] n'ederede isi dịka achọrọ.
