  naturalness: 'The opening construction “jiri ịdị nwayọọ na-agbazi” is not idiomatic as a dependent participial continuation in Standard Igbo: it mixes an imperative-like instrumental form with a progressive verb. “na-eji ịdị nwayọọ agbazi” is the natural manner construction and fits the Greek participle in context.'
  terminology: “ịdị nwayọọ,” “nchegharị,” and “eziokwu” are suitable Standard Igbo terms. “Nchegharị” properly preserves μετάνοια without reducing it to an intellectual change alone. The supplied “ya” remains acceptable when its contextual nature is disclosed in the note.
