language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν πραΰτητι παιδεύοντα τοὺς ἀντιδιατιθεμένους, μήποτε ⸀δώῃ αὐτοῖς ὁ θεὸς μετάνοιαν εἰς ἐπίγνωσιν ἀληθείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/025.yaml
  text: correcting those who oppose him with gentleness[a], in case God may grant them repentance leading to the knowledge of the truth[b],
translation:
  language: ig
  text: na-eji ịdị nwayọọ agbazi ndị na-emegide ya[a], ma eleghị anya Chineke ga-enye ha nchegharị nke ga-eduga ha n'ịmata eziokwu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-emegide.” Okwu Grik ekwughị kpọmkwem onye ma ọ bụ ihe ha na-emegide, ma ihe gbara amaokwu ahụ gburugburu na-egosi ohu Onyenwe anyị na nkuzi ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ma eleghị anya Chineke nwere ike inye ha nchegharị.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πραΰτητι
  choice: jiri ịdị nwayọọ
  rationale: Nkebi a na-egosi ụzọ e si eme ihe. Nhọrọ a na-egosi obi dị nro na enweghị iwe ma ọ bụ aka ike, n'Igbo dị ugbu a ma kwanyere ùgwù.
- source_word: παιδεύοντα
  choice: na-agbazi
  rationale: N'ebe a, okwu ahụ pụtara izi ihe nke na-agbazi ndị nọ n'ụzọ na-ezighị ezi, ọ bụghị ịta ha ahụhụ.
- source_word: τοὺς ἀντιδιατιθεμένους
  choice: ndị na-emegide ya
  rationale: Okwu Grik ahụ pụtara ndị na-etinye onwe ha n'ọnọdụ mmegide. ‘Ya’ adịghị n'okwu Grik kpọmkwem, ma ihe gbara amaokwu ahụ gburugburu na-egosi na ha na-emegide ohu Onyenwe anyị na nkuzi ya.
- source_word: μήποτε
  choice: ma eleghị anya
  rationale: Nhọrọ a na-echekwa enweghị nkwenye doro anya dị na μήποτε tinyere subjunctive, n'etinyeghị ihe ga-eme dịka ihe e ji n'aka.
- source_word: δώῃ αὐτοῖς ὁ θεὸς
  choice: Chineke ga-enye ha
  rationale: N'usoro a, δίδωμι pụtara inye ma ọ bụ ime ka mmadụ nweta ihe dịka onyinye; njikọ ya na ‘ma eleghị anya’ na-echekwa ọnọdụ nke subjunctive.
- source_word: μετάνοιαν
  choice: nchegharị
  rationale: ‘Nchegharị’ bụ okwu Igbo a maara nke na-egosi mgbanwe nke uche na ntụgharị ụzọ, ọ bụghị naanị ịgbanwe echiche n'ụzọ ọgụgụ isi.
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: nke ga-eduga ha n'ịmata eziokwu
  rationale: εἰς na-egosi ebumnuche ma ọ bụ ihe ga-esi na nchegharị pụta; ‘ịmata eziokwu’ na-egosi ịbịa n'amamihe na nghọta zuru ezu banyere eziokwu ahụ.
theological_decisions:
- issue: Ọrụ Chineke na nzaghachi mmadụ n'ihe banyere nchegharị
  choice: E kwuru na Chineke nwere ike inye ha nchegharị, n'emebighị ọnọdụ nke μήποτε.
  alternative: Ịsụgharị ya n'ụzọ na-eme ka ọchịchị Chineke bụrụ ihe a kara aka kpamkpam, ma ọ bụ n'ụzọ na-ebelata ọrụ Chineke.
  rationale: Grik kwuru Chineke dịka onye na-enye nchegharị, ma amaokwu a akọwaghị n'ụzọ zuru ezu otú nke a si kwekọọ na ọrụ mmadụ. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ dịka ọ dị.
- issue: Onye ndị ahụ na-emegide
  choice: E tinyere ‘ya’ n'ahịrị isi ma kọwaa ya n'ala ala peeji.
  alternative: ‘ndị na-emegide’ na-enweghị ihe nnọchiaha.
  rationale: Okwu Grik enweghị ihe e kwuru kpọmkwem na ha na-emegide, ma ọnọdụ amaokwu bu ụzọ na-egosi ohu Onyenwe anyị na nkuzi ya. Ihe e tinyere na-eme ka Igbo doo anya n'agbanweghị ihe okwu ahụ na-ekwu n'ụzọ zoro ezo.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma kwanyere ùgwù. E ji ‘nchegharị’ chekwaa ịdị arọ nke μετάνοια, e jikwara ‘ma eleghị anya’ chekwaa enweghị nkwenye doro anya nke μήποτε. Akara ala ala peeji [a] na [b] abụọ pụtara n'ahịrị isi.
