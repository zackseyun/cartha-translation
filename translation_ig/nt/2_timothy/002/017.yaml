base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/017.yaml
  text: and their talk will spread like gangrene[a]. Among them are Hymenaeus and Philetus[b],
translation:
  language: ig
  text: Okwu ha[a] ga-agbasa dị ka gangrin[b]. N’ime ha bụ Haimenaịọs na Failetọs,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ozi ha” ma ọ bụ “ihe ha na-ekwu.”
    reason: lexical_alternative
  - marker: b
    text: Gangrin bụ ọrịa na-eme ka anụ ahụ nwụọ ma ree ure. Akpaalaokwu Grik e jiri ya mee ihe pụtara n'ụzọ nkịtị, “ga-enwe ebe ọ ga-ata nri”; n’ebe a, ọ na-ekwu maka ihe na-agbasa n’ụzọ na-emebi ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: okwu
  rationale: N’ebe a, “okwu” na-ezo aka n’ihe ha na-ekwu ma ọ bụ ozizi ha, ọ bụghị naanị otu mkpụrụokwu. Ọ dabara n’okwu gbara amaokwu a gburugburu banyere okwu efu na ozizi ụgha.
- source_word: αὐτῶν
  choice: ha
  rationale: Ọ bụ nnọchiaha na-egosi na okwu ahụ bụ nke ndị a a kpọtụrụ aha.
- source_word: ὡς γάγγραινα
  choice: dị ka ọnyá rere ure
  rationale: Nkebi a na-atụnyere okwu ha na gangrene, ọrịa na-emebi anụ ahụ ma na-agbasa. “Ọnyá rere ure” bụ okwu Igbo doro ndị nkịtị anya ma na-echekwa ihe atụ nke ọrịa na-emebi ahụ.
- source_word: νομὴν ἕξει
  choice: ga-agbasa
  rationale: N’agbanyeghị na akpaalaokwu Grik ahụ pụtara n’ụzọ nkịtị na ọ “ga-enwe ebe ọ na-aga/ata nri,” ihe ọ pụtara n’ihe atụ a bụ na ọ ga-aga n’ihu na-agbasa n’ụzọ na-emebi ihe.
- source_word: ὧν ἐστιν
  choice: N’ime ha ka ... nọ
  rationale: Usoro a na-egosi na ndị a kpọrọ aha bụ ụfọdụ n’ime ndị ahụ a na-ekwu banyere ha.
- source_word: Ὑμέναιος
  choice: Haimenịọs
  rationale: E depụtara aha Grik a n’ụda dabara n’usoro mkpọpụta Igbo.
- source_word: Φίλητος
  choice: Failetọs
  rationale: E depụtara aha Grik a n’ụda dabara n’usoro mkpọpụta Igbo.
theological_decisions:
- issue: Ike ihe atụ nke ọrịa na-agbasa
  choice: E gosiri okwu ma ọ bụ ozizi ha dị ka ihe na-agbasa ma na-emebi ndị mmadụ.
  alternative: Ịsụgharị akpaalaokwu ahụ n’ụzọ nkịtị dịka “ọ ga-enwe ụzọ ya” n’etinyeghị echiche nke mgbasa.
  rationale: “Ga-agbasa” na-echekwa ịdọ aka ná ntị Pọl banyere mmetụta na-emebi emebi nke ozizi ahụ, ma ọ naghị etinye nkọwa karịrị ihe atụ Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ọnyá rere ure” kama iji naanị aha ọrịa e si n’asụsụ ọzọ webata, ka ihe atụ ahụ doo ndị na-agụ akwụkwọ nkịtị anya; ihe odide ala peeji kọwara kpọmkwem na okwu Grik bụ gangrene.
