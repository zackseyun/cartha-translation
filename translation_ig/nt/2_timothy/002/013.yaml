    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye a pụrụ ịtụkwasị obi.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the source text’s theological and lexical openness while correcting the incomplete footnote and using an unambiguous Igbo verb for ‘deny.’ No interpretation is added concerning whether God's faithfulness entails salvation, judgment, or another specific outcome.
