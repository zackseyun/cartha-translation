base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/013.yaml
  text: If we are faithless[a], he remains faithful[b], for he cannot deny himself.
translation:
  language: ig
  text: Ọ bụrụ na anyị enweghị okwukwe[a], ya onwe ya na-anọgide na-abụ onye kwesịrị ntụkwasị obi[b], n’ihi na ọ pụghị ịgọnahụ onwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụrụ na anyị ekweghị,” ma ọ bụ, “Ọ bụrụ na anyị adịghị eguzosi ike n’ikwesị ntụkwasị obi.” Okwu Grik ahụ nwere ike inwe nke ọ bụla n’ime nkọwa ndị a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye a pụrụ ịtụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπιστοῦμεν
  choice: anyị enweghị okwukwe
  rationale: Nkebi a nwere ike ịpụta na anyị ekweghị ekwe ma ọ bụ na anyị adịghị eguzosi ike n’ikwesị ntụkwasị obi. ‘Enweghị okwukwe’ na-edobe obosara echiche ahụ ma na-akwado ọdịiche ya na πιστός; e tinyere ụzọ ndị ọzọ na nkọwa ala peeji.
- source_word: πιστὸς
  choice: onye kwesịrị ntụkwasị obi
  rationale: Nke a bụ okwu Igbo doro anya ma dị ùgwù maka onye na-eguzosi ike n’eziokwu, onye a pụrụ ịtụkwasị obi. Ọ na-edobe ọdịiche dị n’etiti enweghị okwukwe nke mmadụ na ịdịgide Chineke.
- source_word: μένει
  choice: na-anọgide bụrụ
  rationale: Ọ na-egosi ọnọdụ na-aga n’ihu, ya bụ, na àgwà ya anaghị agbanwe.
- source_word: ἀρνήσασθαι
  choice: ịjụ
  rationale: ‘Ịjụ’ na-egosi ịgọnahụ ma ọ bụ ịsị na onye ahụ abụghị nke ya; n’ọnọdụ a ọ na-enye okwu ahụ ike mmekọrịta na omume o nwere.
- source_word: ἑαυτὸν
  choice: onwe ya
  rationale: Ọ bụ nnọchiaha na-alaghachikwuru ἐκεῖνος, ma na-egosi na ntọala nke ịdịgide ya bụ onye ọ bụ n’onwe ya.
- source_word: οὐ δύναται
  choice: ọ pụghị
  rationale: Nke a na-egosi enweghị ike ime ya, ọ bụghị naanị na ọ chọghị ime ya.
theological_decisions:
- issue: Ihe kwesịrị ntụkwasị obi nke ya pụtara n’ihu enweghị okwukwe mmadụ
  choice: E debere okwu ahụ ka ọ kwuo na ya onwe ya na-anọgide bụrụ onye kwesịrị ntụkwasị obi n’ihi na ọ pụghị ịjụ onwe ya, n’akọwaghị ma nke a na-elekwasị anya n’ịzọpụta, n’imezu nkwa, ma ọ bụ n’ikpe ikpe.
  alternative: A pụrụ ịkọwa ya kpọmkwem dị ka ịnọgide ịzọpụta ndị nke ya n’agbanyeghị adịghị ike ha, ma ọ bụ dị ka ịdị kwesịrị ntụkwasị obi n’okwu ya, tinyere ịdọ aka ná ntị banyere ikpe.
  rationale: Grik ahụ na-ekwusi ike na ya adịghị agbanwe, ma ọ naghị edozi kpọmkwem ihe ga-esi na nke ahụ pụta n’ọnọdụ a. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘ya onwe ya’ mesie ἐκεῖνος ike, ma e zere ịkọwa kpọmkwem ma ịdị kwesịrị ntụkwasị obi ya na-ezo aka n’amara nzọpụta ma ọ bụ n’ikpe.
