  text: Ἐν μεγάλῃ δὲ οἰκίᾳ οὐκ ἔστιν μόνον σκεύη χρυσᾶ καὶ ἀργυρᾶ ἀλλὰ καὶ ξύλινα καὶ ὀστράκινα, καὶ ἃ μὲν εἰς τιμὴν ἃ δὲ εἰς ἀτιμίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/020.yaml
  text: In a large house there are not only gold and silver vessels[a], but also wooden and earthenware ones, and some are for honor[b], but others for dishonor.
translation:
  language: ig
  text: N’ime nnukwu ụlọ, ọ bụghị naanị arịa ọlaedo na ọlaọcha ka e nwere, kamakwa arịa osisi na arịa ụrọ; ụfọdụ bụ maka nsọpụrụ, ndị ọzọ bụkwa maka enweghị nsọpụrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “maka ojiji dị nsọpụrụ ... maka ojiji na-enweghị nsọpụrụ.” N’ụzọ nkịtị, Grik sịrị, “maka nsọpụrụ ... maka enweghị nsọpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν μεγάλῃ δὲ οἰκίᾳ
  choice: Ma n’ime nnukwu ụlọ
  rationale: “Nnukwu ụlọ” na-egosi nha ma ọ bụ ọkwa ụlọ ahụ n'ụzọ Igbo dị mfe. “Ma” na-eburu njikọ δέ dị nro n’enweghị itinye echiche oge nke na-adịghị na Grik.
- source_word: σκεύη
  choice: arịa
  rationale: “Arịa” bụ okwu Igbo sara mbara maka ihe ma ọ bụ ihe e ji etinye ihe ma na-echekwa obosara ihe atụ ahụ karịa okwu ga-akọwa naanị otu ụdị ngwa.
- source_word: χρυσᾶ καὶ ἀργυρᾶ
  choice: ọlaedo na ọlaọcha
  rationale: N’usoro “arịa ọlaedo na ọlaọcha,” okwu ndị a na-egosi ihe e ji mee arịa ndị ahụ n’Igbo nkịtị.
- source_word: ξύλινα καὶ ὀστράκινα
  choice: arịa osisi na nke ụrọ
  rationale: ξύλινα bụ ihe e ji osisi mee; ὀστράκινα bụ ihe e ji ụrọ mee, karịchaa ụrọ a kpọrọ ọkụ. “Nke ụrọ” bụ okwu doro ndị na-agụ akwụkwọ anya, ebe nkọwa ala peeji na-eme ka ihe ahụ zuo oke.
- source_word: καὶ ἃ μὲν ... ἃ δὲ ...
  choice: ụfọdụ ... ma ndị ọzọ ...
  rationale: Usoro a na-egosipụta ọdịiche dị n’etiti ìgwè abụọ; “ụfọdụ ... ma ndị ọzọ ...” na-eburu ọdịiche μέν...δέ nke ọma.
- source_word: εἰς τιμήν
  choice: maka nsọpụrụ
  rationale: “Maka nsọpụrụ” na-edobe aha nkịtị τιμή ma ghara ikpebi na ọ pụtara naanị ụdị ojiji pụrụ iche.
- source_word: εἰς ἀτιμίαν
  choice: maka enweghị nsọpụrụ
  rationale: “Enweghị nsọpụrụ” na-edobe ọdịiche kpọmkwem megide “nsọpụrụ” n’enweghị ịgbanwe ya ka ọ bụrụ naanị “ojiji nkịtị.”
theological_decisions:
- issue: Ma a ga-akọwa τιμή/ἀτιμία dị ka ụdị ojiji arịa ahụ, ka a ga-edobe okwu nsọpụrụ/enweghị nsọpụrụ
  choice: maka nsọpụrụ ... maka enweghị nsọpụrụ
  alternative: maka ojiji a na-asọpụrụ ... maka ojiji a na-adịghị asọpụrụ
  rationale: Grik ji aha nkịtị τιμή na ἀτιμία mee ihe. Idebe ha n’ụdị aha nkịtị na-echekwa nghọtahie nwere ezi ntọala na esemokwu ihe atụ ahụ, karịchaa maka amaokwu na-esote, kama ịkọwa ya ozugbo dị ka naanị ọrụ arịa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri “arịa” chekwaa obosara ihe atụ ụlọ ahụ; e zere okwu ụka pụrụ iche ma ọ bụ ịkọwa ihe atụ ahụ karịa ihe Grik kwuru.
