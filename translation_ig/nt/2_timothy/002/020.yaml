revisions:
- from: Ma n’ime nnukwu ụlọ, ọ bụghị naanị arịa ọlaedo na ọlaọcha dị n’ime ya, kama arịa osisi na nke ụrọ[a] dịkwa n’ime ya; ụfọdụ bụ maka nsọpụrụ, ma ndị ọzọ bụ maka enweghị nsọpụrụ.[b]
  to: N’ime nnukwu ụlọ, ọ bụghị naanị arịa ọlaedo na ọlaọcha ka e nwere, kamakwa arịa osisi na arịa ụrọ; ụfọdụ bụ maka nsọpụrụ, ndị ọzọ bụkwa maka enweghị nsọpụrụ.[a]
  rationale: The revision removes unnecessary repetition of the location, avoids an overly adversative opening, and uses a natural existential construction. It retains the source’s broad metaphor and its deliberately abstract contrast between honor and dishonor. The corrected cultural note accurately explains earthenware. Footnote a is anchored to the honor/dishonor expression; footnote b remains available as an unanchored explanatory cultural note only if the publication system supports unanchored notes, otherwise it should be omitted or anchored to “arịa ụrọ.”
