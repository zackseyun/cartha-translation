  text: Μνημόνευε Ἰησοῦν Χριστὸν ἐγηγερμένον ἐκ νεκρῶν, ἐκ σπέρματος Δαυίδ, κατὰ τὸ εὐαγγέλιόν μου·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/008.yaml
  text: Remember Jesus the Messiah[a], raised from the dead, descended from David[b], according to my gospel.
translation:
  language: ig
  text: Cheta Jizọs bụ́ Mesaya[a], onye e mere ka o bilie site ná ndị nwụrụ anwụ, onye sitere n’agbụrụ Devid[b], dị ka oziọma m si kwuo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Jizọs Kraịst.” A pụrụ ịsụgharị utu aha Grik Χριστός dịka “Kraịst” ma ọ bụ “Mesaya.” N’ebe a, “Mesaya” na-eme ka ihe utu aha ahụ pụtara pụta ìhè, karịsịa n’ihi okwu gbasara agbụrụ Devid.'
    reason: alternative_reading
  - marker: b
    text: 'N’ụzọ okwu nkịtị: “site ná mkpụrụ Devid.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημόνευε
  choice: Na-echeta
  rationale: Ngwaa iwu dị n’ụdị na-aga n’ihu na-akpọ Timoti ka ọ nọgide na-echeta; “Na-echeta” na-egosipụta nke a n’Igbo dị mfe.
- source_word: Ἰησοῦν Χριστόν
  choice: Jizọs bụ́ Mesaya
  rationale: N’ebe a Χριστός bụ utu aha metụtara agbụrụ Devid; “Mesaya” na-eme ka ihe utu aha ahụ pụtara doo anya, ebe “bụ́” na-eme ka okwu ahụ bụrụ Igbo e ji eme ihe n’ụzọ ebumpụta ụwa.
- source_word: ἐγηγερμένον
  choice: onye e mere ka o ... bilie
  rationale: Nke a na-echekwa olu nnara nke okwu Grik ma na-egosi na e mere ka Jizọs bilie; ọ na-egosikwa ọnọdụ na-adịgide adịgide nke perfect participle.
- source_word: ἐκ νεκρῶν
  choice: si ná ndị nwụrụ anwụ
  rationale: Ọ na-edobe echiche Grik nke isi n’etiti ndị nwụrụ anwụ pụta, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἐκ σπέρματος Δαυίδ
  choice: onye si n’agbụrụ Devid pụta
  rationale: N’ebe a σπέρμα na-ekwu maka usoro ọmụmụ. “Si n’agbụrụ Devid pụta” bụ Igbo nkịtị nke na-edobe echiche ahụ n’enweghị ntụgharị okwu nkịtị na-eduhie eduhie.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: dị ka oziọma m si dị
  rationale: Nke a na-edobe κατά dị ka “dị ka / n’ikwekọ na” ma na-ahapụ okwu nnọchiaha “m” dịka ọ dị n’isi mmalite.
theological_decisions:
- issue: Ntugharị Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: Njikọ ya na mbilite n’ọnwụ na agbụrụ Devid na-eme ka ọrụ ya dịka utu aha pụta ìhè. E debere “Kraịst” n’ala peeji dịka ụzọ ọzọ ziri ezi isi dee otu utu aha Grik ahụ.
- issue: Olu nnara nke ἐγηγερμένον
  choice: onye e mere ka o si ná ndị nwụrụ anwụ bilie
  alternative: onye bilitere n’ọnwụ
  rationale: Nhọrọ a na-echekwa olu nnara dị na Grik kama ime ya ka ọ bụrụ naanị ihe Jizọs mere n’onwe ya.
- issue: Ihe “oziọma m” pụtara
  choice: oziọma m
  alternative: oziọma m na-ekwusa
  rationale: E debere nnọchiaha Grik μου n’ụzọ kwụ ọtọ, n’etinyeghị nkọwa na Pọl nwere oziọma dị iche.
translation_notes:
  register: E ji Igbo Ọha kwụrụ ọtọ, nke oge a ma dị ùgwù. “Na-echeta” na-enye iwu na-aga n’ihu; usoro ahịrịokwu ahụ na-edobe akụkụ participle abụọ nke Grik n’enweghị ime ka amaokwu ahụ sie ike nghọta.
