revisions:
- from: Na-echeta Jizọs bụ́ Mesaya[a], onye e mere ka o si ná ndị nwụrụ anwụ bilie, onye si n’agbụrụ Devid pụta[b], dị ka oziọma m si dị.
  to: Cheta Jizọs bụ́ Mesaya[a], onye e mere ka o bilie site ná ndị nwụrụ anwụ, onye sitere n’agbụrụ Devid[b], dị ka oziọma m si kwuo.
  rationale: The revision makes the imperative and the concluding κατά phrase idiomatic in Standard Igbo, while retaining the source’s title, passive resurrection formulation, Davidic-lineage sense, and Paul’s possessive “my gospel.” Footnote anchors and their corresponding explanations are preserved.
  reviewer_model: gpt-5.6-terra
