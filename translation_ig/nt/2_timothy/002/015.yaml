id: 2TI.2.15
reference: 2 Timothy 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σπούδασον σεαυτὸν δόκιμον παραστῆσαι τῷ θεῷ, ἐργάτην ἀνεπαίσχυντον, ὀρθοτομοῦντα τὸν λόγον τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/015.yaml
  text: Be diligent to present yourself approved to God[a], a worker with no need to be ashamed, rightly handling the word of truth.
translation:
  language: ig
  text: Gbalịsie ike igosi onwe gị n’ihu Chineke dịka onye a nabatara, onye ọrụ na-enweghị ihe ga-eme ya ihere, onye na-ejizi okwu nke eziokwu eme ihe n’ụzọ ziri ezi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-akụzi okwu nke eziokwu n’ụzọ ziri ezi”; n’ụzọ nkịtị, “onye na-egbutu okwu nke eziokwu n’ahịrị kwụ ọtọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπούδασον
  choice: Gbalịsie ike
  rationale: Ọ bụ iwu na-akpọ Timoti ka o jiri ịnụ ọkụ n’obi na ịdị uchu mee ihe; okwu a bụ nke mmadụ nkịtị na-aghọta, ma ọ naghị eme ka ike dị n’iwu Grik daa.
- source_word: σεαυτὸν ... παραστῆσαι τῷ θεῷ
  choice: igosi onwe gị n’ihu Chineke
  rationale: Nke a na-egosipụta iweta onwe onye nye Chineke maka nnabata na ọrụ. ‘N’ihu Chineke’ na-ada nke ọma n’Igbo ma na-echekwa echiche nke iguzo n’ihu ya.
- source_word: δόκιμον
  choice: dị ka onye a nwapụtara ma nabata
  rationale: δόκιμος na-egosi onye gafere nnwale wee bụrụ onye a nabatara. Itinye ma nnwale ma nnabata na-eme ka nghọta ahụ pụta ìhè n’Igbo.
- source_word: ἐργάτην
  choice: onye ọrụ
  rationale: Ọ na-echekwa ihe atụ nke onye na-arụ ọrụ n’asụsụ dị ugbu a ma dị mfe nghọta.
- source_word: ἀνεπαίσχυντον
  choice: ihere na-agaghị eme
  rationale: Nke a pụtara onye na-enweghị ihe ga-eme ka ihere mee ya, ọ bụghị naanị onye na-adịghị enwe mmetụta ihere.
- source_word: ὀρθοτομοῦντα
  choice: na-ejizi ... eme ihe n’ụzọ ziri ezi
  rationale: Nhọrọ a sara mbara ma na-egosi ilekọta ma ọ bụ iji ozi ahụ mee ihe nke ọma, n’enweghị imechi ihe ọ pụtara naanị n’ịkụzi ihe. Ihe oyiyi nkịtị nke ‘ịkpụzi ya n’ahịrị kwụ ọtọ’ dị n’ala peeji.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: okwu nke eziokwu
  rationale: Ọ na-echekwa usoro okwu Grik na ụda nkà mmụta okpukpe Pọl, ma bụrụkwa okwu ndị na-agụ Igbo ga-aghọta.
theological_decisions:
- issue: Ihe ὀρθοτομοῦντα pụtara n’ọrụ ozi
  choice: onye na-ejizi okwu nke eziokwu eme ihe n’ụzọ ziri ezi
  alternative: onye na-akụzi okwu nke eziokwu nke ọma; n’ụzọ nkịtị, onye na-akpụzi okwu nke eziokwu n’ahịrị kwụ ọtọ
  rationale: Isi okwu ahụ nwere ike ịgụnye izi ihe nke ọma, ma ngwaa Grik adịghị amachi ya naanị n’ọrụ izi ihe. Nsụgharị bụ isi na-echekwa obosara ya, ebe ala peeji na-edebe ma nkọwa ọrụ ozi ma ihe oyiyi nkịtị nke ngwaa ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Gbalịsie ike’ chekwaa ike nke iwu ahụ; e zere okwu ochie ma ọ bụ okwu ga-eme ka ihe ὀρθοτομοῦντα pụtara bụrụ naanị otu ụdị ọrụ ozi.
