id: 2TI.2.10
reference: 2 Timothy 2:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο πάντα ὑπομένω διὰ τοὺς ἐκλεκτούς, ἵνα καὶ αὐτοὶ σωτηρίας τύχωσιν τῆς ἐν Χριστῷ Ἰησοῦ μετὰ δόξης αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/010.yaml
  text: For this reason I endure everything for the sake of the elect[c][b][a], so that they also may obtain the salvation that is in Messiah Jesus with eternal glory.
translation:
  language: ig
  text: N’ihi nke a, ana m anagide ihe niile n’ihi ndị a họpụtara[a], ka ha onwe ha kwa wee nweta nzọpụta ahụ dị n’ime Mesaya[b] Jizọs, ya na ebube ebighị ebi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị a họọrọ.” Okwu Grik bụ ἐκλεκτούς.
    reason: lexical_alternative
  - marker: b
    text: Nsụgharị ọdịnala bụ “Kraịst Jizọs.”
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụ akụkụ ikpeazụ ya, “nzọpụta ahụ dị n’ime Mesaya Jizọs, tinyere ebube ebighị ebi.”
    reason: previous_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi na ihe e kwuru tupu amaokwu a bụ ihe mere Pọl ji atachi obi; ntụgharị a na-echekwa ike nke ihe kpatara ya.
- source_word: πάντα ὑπομένω
  choice: ana m atachi obi n’ihe niile
  rationale: “Ịtachi obi” na-egosi ịnọgide guzosie ike n’okpuru ahụhụ, ebe “n’ihe niile” na-echekwa echiche zuru ezu nke πάντα.
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: n’ihi ndị a họpụtara
  rationale: διά na accusative ebe a na-egosi ime ihe maka ọdịmma ndị ahụ. “Ndị a họpụtara” na-echekwa asụsụ nhọrọ dị na ἐκλεκτούς n’etinyeghị usoro ozizi pụrụ iche.
- source_word: ἵνα καὶ αὐτοὶ
  choice: ka ha onwe ha kwa wee
  rationale: “Ka ... wee” na-egosi ebumnuche nke ἵνα; “ha onwe ha kwa” na-echekwa ma nkwusi ike nke αὐτοί ma echiche mgbakwunye nke καί.
- source_word: σωτηρίας τύχωσιν
  choice: nweta nzọpụta ahụ
  rationale: τυγχάνω tinyere genitive pụtara inweta ma ọ bụ iru ihe; “nweta” bụ okwu Igbo doro anya nke na-anaghị agbakwunye nkọwa ọzọ.
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: ahụ dị n’ime Mesaya Jizọs
  rationale: Nkebiokwu a na-akọwa nzọpụta ahụ. “Dị n’ime” na-echekwa asụsụ Pọl banyere ịdị n’ime Mesaya, ebe “Mesaya” na-egosipụta Χριστός dị ka utu aha.
- source_word: μετὰ δόξης αἰωνίου
  choice: ya na ebube ebighị ebi
  rationale: μετά na genitive na-egosi ihe na-eso ihe ọzọ. “Ya na” na-echekwa njikọ nzọpụta na ebube ahụ n’enweghị ịkọwa karịa ihe Grik kwuru.
theological_decisions:
- issue: Otú e si atụgharị ἐκλεκτούς
  choice: ndị a họpụtara
  alternative: ndị a họọrọ
  rationale: Okwu Grik ahụ na-egosi ndị a họpụtara ma ọ bụ ndị a họọrọ. E debere asụsụ nhọrọ nke ederede ahụ n’enweghị ịkọwa onye a họpụtara, mgbe a họpụtara ha, ma ọ bụ usoro nhọrọ ahụ.
- issue: Otú e si atụgharị Χριστῷ
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός ka nwere ihe ọ pụtara dị ka utu aha n’ebe a. “Mesaya” na-eme ka ihe okwu Grik ahụ pụtara pụta ìhè; e nyere ụdị ọdịnala “Kraịst” n’ala ala peeji.
- issue: Njikọ μετὰ δόξης αἰωνίου
  choice: ya na ebube ebighị ebi
  alternative: tinyere ebube ebighị ebi
  rationale: E jikọtara ebube ebighị ebi na nzọpụta dịka ihe na-eso ya, ma a hapụrụ mkpụmkpụ okwu Grik ahụ ka ọ ghara ịkọwa n’ụzọ karịrị akarị otú ebube ahụ si metụta nzọpụta.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ugwu ma dị mfe nghọta, mee ntụgharị ahụ. “Ana m atachi obi” bụ usoro okwu nkịtị ma dị arọ; “ka ... wee” na-egosipụta ebumnuche nke ọma. E zere okwu ụka pụrụ iche ma e wezụga okwu isi iyi ahụ n’onwe ya chọrọ, dịka “nzọpụta,” “Mesaya,” na “ebube ebighị ebi.”
