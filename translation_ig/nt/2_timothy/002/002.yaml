revisions:
- from: Ihe ndị ị nụrụ n’aka m ebe ọtụtụ ndị akaebe nọ[a], nyefee ha n’aka ndị ikom kwesịrị ntụkwasị obi[b], ndị ga-enwekwa ike ịkụziri ndị ọzọ ihe.
  to: Ihe ndị ị nụrụ n’aka m n’ihu ọtụtụ ndị akaebe[a], nyefee ha n’aka ndị mmadụ kwesịrị ntụkwasị obi[b], ndị ga-enwe ike ịkụzikwara ndị ọzọ ihe.
  rationale: The revision corrects the source-level over-specification of ἀνθρώποις as male persons while retaining the Greek grammatical information in a precise footnote. It also makes the public-witness sense and the “also” connected with teaching flow naturally in Standard Igbo. The ambiguity of διὰ πολλῶν μαρτύρων remains documented rather than being treated as resolved beyond the evidence.
