id: 2TI.2.2
reference: 2 Timothy 2:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἃ ἤκουσας παρ’ ἐμοῦ διὰ πολλῶν μαρτύρων, ταῦτα παράθου πιστοῖς ἀνθρώποις, οἵτινες ἱκανοὶ ἔσονται καὶ ἑτέρους διδάξαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/002.yaml
  text: And what you heard from me in the presence of many witnesses[a], entrust these things to faithful men[b], who will be competent to teach others also.
translation:
  language: ig
  text: Ihe ndị ị nụrụ n’aka m n’ihu ọtụtụ ndị akaebe[a], nyefee ha n’aka ndị mmadụ kwesịrị ntụkwasị obi[b], ndị ga-enwe ike ịkụzikwara ndị ọzọ ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ebe ọtụtụ ndị akaebe nọ.” Okwu Grik a nwere ike imesi ike na Pọl kụziri ihe ndị a n’ihu ọha, ọtụtụ ndị akaebe nọkwa ya; ọ pụkwara, ọ bụ ezie na o yighị ka ọ bụ ya, ịpụta “site n’aka ọtụtụ ndị akaebe.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ndị mmadụ kwesịrị ntụkwasị obi.” Okwu ahụ e ji mee “ndị mmadụ” dị n’ụdị nwoke n’ụtọ asụsụ Grik, ma ọ pụrụ izo mmadụ n’ozuzu; a pụkwara ịsụgharị ya “ndị kwesịrị ntụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ ἤκουσας παρ’ ἐμοῦ
  choice: Ihe ndị ị nụrụ n’aka m
  rationale: Ọ na-egosi ihe Timoti nụrụ na Pọl bụ onye o si n’aka ya nụ ya, n’ụzọ Igbo doro anya ma dịkwa ebumpụta ụwa.
- source_word: διὰ πολλῶν μαρτύρων
  choice: ebe ọtụtụ ndị akaebe nọ
  rationale: N’ebe a, διά tinyere genitive yikarịrị ka ọ na-egosi ọnọdụ ndị akaebe nọ mgbe Timoti nụrụ ozizi ahụ. Nsụgharị a na-egosi na e mere ya n’ihu ọha ma hapụ nkọwa ndị ọzọ n’ala ala peeji.
- source_word: ταῦτα παράθου
  choice: nyefee ha n’aka
  rationale: Ọ na-egosi inyefe ihe ahụ n’aka ndị ọzọ ka ha lekọta ya ma bufee ya n’ihu, ọ bụghị naanị ịgwa ha ya.
- source_word: πιστοῖς ἀνθρώποις
  choice: ndị ikom kwesịrị ntụkwasị obi
  rationale: “Kwesịrị ntụkwasị obi” na-egosi ndị a pụrụ ịdabere na ha n’ichekwa na izisa ozizi ahụ. “Ndị ikom” na-egosipụta ọdịdị nwoke nke okwu Grik ahụ, ebe ala ala peeji na-akọwa na ọ pụkwara ịnọchite anya mmadụ n’ozuzu.
- source_word: ἱκανοὶ ἔσονται
  choice: ga-enwekwa ike
  rationale: Ọ na-egosi na ha ga-abụ ndị ruru eru ma nwee ikike ịrụ ọrụ ịkụziri ndị ọzọ.
- source_word: ἑτέρους διδάξαι
  choice: ịkụziri ndị ọzọ ihe
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na ha ga-ewepụtakwa ozizi ahụ nye ndị ọzọ.
theological_decisions:
- issue: Ma πιστοῖς ἀνθρώποις ọ na-ekwu naanị banyere ndị nwoke ka ọ bụ banyere ndị kwesịrị ntụkwasị obi n’ozuzu
  choice: ndị ikom kwesịrị ntụkwasị obi
  alternative: ndị mmadụ kwesịrị ntụkwasị obi; ndị kwesịrị ntụkwasị obi
  rationale: Ụdị okwu Grik ahụ bụ nke nwoke n’ụtọ asụsụ, ma ἄνθρωπος nwekwara ike ịnọchite anya mmadụ n’ozuzu. E debere “ndị ikom” n’ahịrịokwu, ma kọwaa ohere nghọta sara mbara n’ala ala peeji ka a ghara idozi ihe ederede ahụ hapụrụ oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nyefee ha n’aka” na-egosipụta ọrụ ilekọta na ibufe ozizi ahụ; “ga-enwekwa ike” na-ezere itinye echiche pụrụ iche banyere nhọpụta ma ọ bụ ọkwa ọchịchị ụka n’ihe odide ahụ.
