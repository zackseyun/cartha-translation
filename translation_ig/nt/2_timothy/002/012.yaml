source:
  edition: SBLGNT
  text: εἰ ὑπομένομεν, καὶ συμβασιλεύσομεν· εἰ ⸀ἀρνησόμεθα, κἀκεῖνος ἀρνήσεται ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/012.yaml
  text: If we endure[a], we will also reign with him; if we deny him, he also will deny us.
translation:
  language: ig
  text: Ọ bụrụ na anyị atachi obi, anyị ga-eso ya chịa; ọ bụrụ na anyị agọnahụ ya[a], ya onwe ya ga-agọnahụkwa anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “jụ ịbụ ndị nke ya”; “ya onwe ya ga-ajụkwa anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομένομεν
  choice: anyị anọgide na-atachi obi
  rationale: Nkebiokwu a na-egosi ịnọgide na-eguzosi ike n'agbanyeghị ule ma ọ bụ ahụhụ. Ọ na-edobe echiche nke ntachi obi na-aga n'ihu nke dị n'okwu Grik.
- source_word: συμβασιλεύσομεν
  choice: anyị na ya ga-achịkwa
  rationale: Ngwaa Grik a pụtara iso onye ọzọ chịa dịka eze. ‘Anyị na ya ga-achịkwa’ bụ okwu Igbo doro anya nke na-egosi ọchịchị a ga-eso Kraịst chịa, ma na-edobe ihe oyiyi nke ọchịchị eze.
- source_word: ἀρνησόμεθα
  choice: anyị agọnahụ ya
  rationale: ‘Agọnahụ’ nwere ike ịpụta ịjụ ịmata mmadụ ma ọ bụ ịjụ ikweta na mmadụ bụ nke gị. E tinyere ‘ya’ dịka onye a na-ekwu maka ya, bụ́ Kraịst, nke ihe gbara amaokwu ahụ gburugburu mere ka o doo anya.
- source_word: κἀκεῖνος
  choice: ya onwe ya ... kwa
  rationale: Nhazi a na-egosi nzaghachi kwekọrọ n'omume e kwuru na mbụ. ‘Ya onwe ya ... kwa’ na-edobe ma nkwusi ike dị n'ἐκεῖνος ma echiche ‘ọ ga-emekwa otu ahụ’ dị na καί.
- source_word: ἀρνήσεται ἡμᾶς
  choice: ga-agọnahụkwa anyị
  rationale: Iji ‘agọnahụ’ ọzọ na-edobe nkwughachi otu ngwaa ahụ na Grik na ike ịdọ aka ná ntị ya.
theological_decisions:
- issue: Ụdị ịdọ aka ná ntị dị na nkebi ọnọdụ nke abụọ
  choice: 'A sụgharịrị ya dịka ịdọ aka ná ntị n''ezie: ‘ọ bụrụ na anyị agọnahụ ya, ya onwe ya ga-agọnahụkwa anyị.’'
  alternative: Ịkọwa ya nanị dịka ịla ụgwọ ọrụ n'iyi, ma ọ bụ dịka ọnọdụ a na-eche n'echiche nke na-agaghị eme eme.
  rationale: Grik kwuru ya ozugbo dịka ọnọdụ na nsonaazụ ya, ma o kpebighị arụmụka banyere ịdapụ n'okwukwe, ịnọgide n'okwukwe, ma ọ bụ ụgwọ ọrụ. Ntụgharị ahụ na-ahapụ ịdị arọ na esemokwu nkà mmụta okpukpe dị n'okwu ahụ ka ha dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Anọgide na-atachi obi’ na-egosi ntachi obi na-adịgide adịgide; ‘anyị na ya ga-achịkwa’ na-ekwu nke ọma banyere iso Kraịst chịa. E debere nkwughachi ‘agọnahụ’ n'akụkụ abụọ iji chekwaa nhazi na ike okwu Grik.
