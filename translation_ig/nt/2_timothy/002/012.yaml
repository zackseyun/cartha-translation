review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents both conditional clauses, the future co-reigning result, the reciprocal force of κἀκεῖνος, and the deliberate repetition of ἀρνέομαι. The pronoun referent is appropriately retained as “ya,” as in the Greek, rather than being interpretively expanded in the verse itself.
  naturalness: “anyị anọgide na-atachi obi” is understandable but somewhat heavier than needed for ὑπομένομεν. “anyị atachi obi” is natural Standard Igbo and retains the conditional sense. “anyị ga-eso ya chịa” is a more idiomatic and specific expression of reigning together than “anyị na ya ga-achịkwa”; it better preserves the royal sense of συμβασιλεύσομεν.
  terminology: “gọnahụ” is an appropriate rendering for ἀρνέομαι and should be repeated in both clauses. The footnote should offer a genuinely concise lexical alternative corresponding to “disown,” without overexplaining or altering the reciprocal wording.
  issues:
  - severity: low
    issue: The endurance phrase is slightly redundant.
    rationale: “Anọgide na-atachi obi” adds continuative nuance beyond the concise Greek verb and is less smooth than “atachi obi” in this conditional saying.
  - severity: low
    issue: The co-reigning expression can be more idiomatic and more explicitly royal.
    rationale: “Chịkwa” can broadly mean govern or control. “Soro ya chịa” naturally conveys reigning with him and preserves the compound verb’s shared royal action.
  - severity: low
    issue: The footnote is overly paraphrastic.
    rationale: “Jụ ikweta na anyị bụ ndị nke ya” expands the alternative substantially. A concise alternative based on “jụ ịbụ ndị nke ya” better serves its lexical purpose.
