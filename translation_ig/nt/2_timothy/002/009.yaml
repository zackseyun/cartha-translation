  to: nke m na-ata ahụhụ n’ihi ya[a], ruo ọbụna n’agbụ, dị ka onye omekome[b]. Ma e kegideghị okwu Chineke agbụ.
  rationale: The revision removes an awkward expansion of “up to chains” while preserving the source’s concrete chain imagery and its deliberate contrast with God’s unbound word. The footnote is expanded to reflect both principal senses of ἐν ᾧ without resolving the ambiguity beyond the text.
