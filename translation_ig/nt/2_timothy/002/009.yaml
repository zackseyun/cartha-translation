id: 2TI.2.9
reference: 2 Timothy 2:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ᾧ κακοπαθῶ μέχρι δεσμῶν ὡς κακοῦργος. ἀλλὰ ὁ λόγος τοῦ θεοῦ οὐ δέδεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/009.yaml
  text: for which I am suffering hardship[a], even to the point of chains, as a criminal[b]. But the word of God is not bound.
translation:
  language: ig
  text: nke m na-ata ahụhụ n’ihi ya[a], ruo ọbụna n’agbụ, dị ka onye omekome[b]. Ma e kegideghị okwu Chineke agbụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ime ya”; okwu a nwekwara ike igosi, “n’ihi ya.” Okwu Grik ahụ yiri ka ọ na-atụ aka n’ozi ọma e kwuru n’amaokwu gara aga.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “dị ka onye na-eme ihe ọjọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: n’ihi ya
  rationale: Nkebi a na-atụ aka n’ozi ọma e kwuru n’amaokwu gara aga, ọ pụkwara igosi ihe kpatara ahụhụ ahụ. ‘N’ihi ya’ bụ Igbo doro anya ma dị ndụ, ebe ndetu na-edobe ụzọ ọzọ e nwere ike isi ghọta ya.
- source_word: κακοπαθῶ
  choice: m na-ata ahụhụ
  rationale: Nke a na-egosi ahụhụ na nsogbu Pọl nọ na ya ugbu a; okwu Igbo a bụ nke a na-aghọta nke ọma ma na-eburu echiche nke ahụhụ na-aga n’ihu.
- source_word: μέχρι δεσμῶν
  choice: ruo n’ókè nke ịbụ onye e ji agbụ kee
  rationale: ‘Ruo n’ókè’ na-egosi oke ahụhụ ahụ ruru, ebe ‘agbụ’ na-edobe ihe oyiyi doro anya nke δεσμά kama ịsụgharị ya naanị dị ka mkpọrọ.
- source_word: ὡς κακοῦργος
  choice: dị ka onye omekome
  rationale: ‘Onye omekome’ dabara n’ọnọdụ ikpe na mkpọrọ, ma ndetu na-edobe nghọta sara mbara nke ‘onye na-eme ihe ọjọọ.’
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche siri ike n’etiti agbụ e kere Pọl na okwu Chineke nke a na-apụghị ike agbụ.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a na-edobe obosara nke λόγος, na-akọwaghị ya naanị dị ka Akwụkwọ Nsọ ma ọ bụ naanị ozi ọma, n’agbanyeghị na gburugburu okwu ahụ na-atụ aka n’ozi a na-ekwusa.
- source_word: οὐ δέδεται
  choice: e kegideghị ... agbụ
  rationale: Ụdị a na-egosi na okwu Chineke anọghị n’ọnọdụ ịbụ ihe e kere agbụ, ma na-edobekwa njikọ ihe oyiyi ya na agbụ Pọl.
theological_decisions:
- issue: Ihe ‘okwu Chineke’ pụtara kpọmkwem
  choice: E sụgharịrị ya ‘okwu Chineke’ n’enweghị ịkọwa ya naanị dị ka Akwụkwọ Nsọ, ozi ọma, ma ọ bụ ozi Chineke n’ozuzu.
  alternative: ‘ozi ọma’ ma ọ bụ ‘Akwụkwọ Nsọ’
  rationale: Gburugburukwa na-egosi karịsịa ozi ọma a na-ekwusa, ma okwu Grik ahụ sara mbara; nsụgharị ahụ na-edobe obosara na esemokwu ahụ.
- issue: Mmekọrịta ἐν ᾧ na ozi ọma nke amaokwu 8
  choice: ‘n’ihi ya,’ nke na-egosi na ozi ọma ahụ bụ ihe kpatara ahụhụ Pọl.
  alternative: ‘n’ime ya’
  rationale: Grik nwere ike igosi ọnọdụ ma ọ bụ ihe kpatara ya. N’Igbo, ‘n’ihi ya’ dabara nke ọma n’ọnọdụ a, ebe ndetu na-ekweta na e nwekwara ike ịghọta ya ‘n’ime ya.’
translation_notes:
  register: Standard Igbo nke oge a, n’ụdị dị ùgwù ma dị mfe nghọta. E ji ‘m na-ata ahụhụ’ mee ka omume na-aga n’ihu pụta ìhè; a hapụrụ ihe oyiyi ‘agbụ’ ugboro abụọ iji chekwaa ọdịiche dị n’etiti agbụ Pọl na nnwere onwe nke okwu Chineke.
