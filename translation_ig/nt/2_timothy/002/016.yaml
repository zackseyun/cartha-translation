  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰς δὲ βεβήλους κενοφωνίας περιΐστασο· ἐπὶ πλεῖον γὰρ προκόψουσιν ἀσεβείας,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/016.yaml
  text: But avoid profane empty talk[a], for they will advance further into ungodliness,
translation:
  language: ig
  text: Ma zere okwu efu na-enweghị nsọpụrụ Chineke[a], n’ihi na ha ga-agawanye n’ihu n’ịghara ịsọpụrụ Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mkparịta ụka efu na-enweghị nsọpụrụ Chineke,” ma ọ bụ “okwu na-enweghị isi na-adịghị nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβήλους
  choice: ndị na-adịghị asọpụrụ Chineke
  rationale: Nke a na-egosipụta ihe na-adịghị nsọ ma ọ bụ na-adịghị enye Chineke nsọpụrụ, kama ịhapụ okwu ahụ ka ọ bụrụ naanị ihe efu.
- source_word: κενοφωνίας
  choice: okwu efu
  rationale: Ọ bụ okwu na-enweghị ezigbo ihe dị n’ime ya ma ọ bụ uru; ‘okwu efu’ bụ Igbo doro anya ma kwekọọ n’echiche nke okwu efu n’ụda na n’ihe ọ na-ekwu.
- source_word: περιΐστασο
  choice: zere
  rationale: Iwu a na-akpọ Timoti ka ọ hapụ ma nọrọ n’ebe dị anya n’okwu ndị ahụ; ‘zere’ bụ okwu Igbo dị mkpirikpi ma sie ike.
- source_word: ἐπὶ πλεῖον
  choice: ga na-abawanye
  rationale: N’usoro ya na προκόψουσιν na ἀσεβείας, nkebi a na-egosi ịga n’ihu ruo n’ókè ka ukwuu.
- source_word: προκόψουσιν
  choice: ga na-abawanye
  rationale: N’agbanyeghị na ngwaa ahụ pụtara ịga n’ihu, ebe a ọ bụ mmepe n’ụzọ ọjọọ; ‘ga na-abawanye’ na-egosi mmụba ahụ nke ọma n’Igbo.
- source_word: ἀσεβείας
  choice: n’ịdịghị asọpụrụ Chineke
  rationale: Nke a na-echekwa ịdị arọ nke omume na-adịghị enye Chineke nsọpụrụ ma ọ bụ na-emegide nsọpụrụ kwesịrị Ya.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị ma ọ bụ ọdịiche megide ndụmọdụ dị n’ihu.
theological_decisions:
- issue: Ma okwu a bụ naanị okwu na-abaghị uru ka ọ bụ okwu na-adịghị nsọpụrụ Chineke
  choice: E debere akụkụ abụọ ahụ dị ka ‘okwu efu ndị na-adịghị asọpụrụ Chineke.’
  alternative: ‘okwu efu’ naanị ya, ma ọ bụ ‘okwu nkwulu’
  rationale: βεβήλους na κενοφωνίας jikọtara echiche nke enweghị isi na nke enweghị nsọpụrụ n’ihe gbasara Chineke. ‘Okwu nkwulu’ ga-adị ike karịa ihe Grik ahụ kwuru kpọmkwem, ebe ‘okwu efu’ naanị ya ga-ebelata ịdị arọ okpukpe nke amaokwu ahụ.
- issue: Onye nnọchiaha zoro ezo dị na προκόψουσιν na-ezo aka n’ebe ndị mmadụ nọ ma ọ bụ n’okwu ahụ
  choice: ‘ndị na-ekwu ha’
  alternative: ‘okwu ndị ahụ’
  rationale: Ngwaa Grik ahụ bụ onye nke atọ n’ọnụọgụ ọtụtụ ma isiokwu ya anọghị n’amaokwu a kpọmkwem; ọ nwere ike ịpụta ndị na-etinye aka n’okwu ahụ. E mere onye a pụta ìhè n’Igbo maka nghọta, ma ihe mgbakwunye ahụ ka na-ejikọta nsonaazụ ahụ na ndị na-ekwu okwu ndị ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu. A họọrọ ‘ịdịghị asọpụrụ Chineke’ kama okwu mbinye ma ọ bụ okwu chọọchị pụrụ iche, iji mee ka echiche okpukpe na omume nke βέβηλος na ἀσέβεια doo ndị nkịtị anya.
