revisions:
- from: Ma zere okwu efu ndị na-adịghị asọpụrụ Chineke[a], n’ihi na ndị na-ekwu ha ga na-abawanye n’ịdịghị asọpụrụ Chineke.
  to: Ma zere okwu efu na-enweghị nsọpụrụ Chineke[a], n’ihi na ha ga-agawanye n’ihu n’ịghara ịsọpụrụ Chineke.
  rationale: The revision removes the interpretive phrase “ndị na-ekwu ha,” thereby preserving the unstated plural subject in the Greek. It also replaces an awkward expression for ἀσέβεια with a natural Igbo construction that retains its sense of increasing irreverence toward God. The footnote remains anchored to the combined description of the speech and offers safe lexical alternatives.
