  text: νόει ⸀ὃ λέγω· ⸀δώσει γάρ σοι ὁ κύριος σύνεσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/007.yaml
  text: Consider what I am saying[b][a], for the Lord will give you understanding in all things.
translation:
  language: ig
  text: Chebara ihe m na-ekwu echiche[a], n’ihi na Onyenwe anyị[b] ga-enye gị nghọta n’ihe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Tụgharịa uche n’ihe m na-ekwu”; ngwaa ahụ nwekwara ike ịpụta “ghọta.”
    reason: lexical_alternative
  - marker: b
    text: Ihe odide Grik akọwaghị onye a kpọrọ “Onyenwe anyị” n’ebe a. Ndị na-akọwa Akwụkwọ Nsọ nwere echiche dị iche banyere ma Onyenwe anyị Jizọs kpọmkwem ka a na-ekwu maka ya, ka ọ bụ Chineke n’ozuzu ya.
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Chebara ... echiche
  rationale: Ngwaa iwu a na-akpọ Timoti ka o jiri uche tụgharịa ihe Pọl na-ekwu; akpaokwu a bụ Igbo nkịtị ma doo anya, ma ọ naghị egbochi echiche nke ‘ịghọta.’
- source_word: ὃ λέγω
  choice: ihe m na-ekwu
  rationale: Nke a na-egosipụta ọdịnaya okwu Pọl n’ụzọ Igbo si ada nke ọma, ma na-echekwa oge ugbu a nke λέγω.
- source_word: δώσει
  choice: ga-enye
  rationale: Oge ọdịnihu nke δίδωμι na-egosi nkwa n’ụzọ kwụ ọtọ.
- source_word: γάρ
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere e ji nye iwu dị n’ahịrịokwu mbụ.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-ejikarị asụgharị κύριος n’ebe a, n’akọwaghị kpọmkwem ma ọ bụ Jizọs Kraịst ka ọ bụ Chineke ka a na-ekwu maka ya.
- source_word: σύνεσιν
  choice: nghọta
  rationale: Ọ na-egosi ikike ịghọta ma ọ bụ ịmata ihe okwu ahụ pụtara.
- source_word: ἐν πᾶσιν
  choice: n’ihe niile
  rationale: Ọ na-echekwa obosara okwu Grik ahụ n’enweghị ime ka ọ bụrụ naanị ihe gbasara ozizi.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ (ὁ κύριος) na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Onyenwe anyị Jizọs; Chineke
  rationale: Ihe odide Grik akọwaghị onye ọ bụ karịa ‘Onyenwe anyị.’ Nsụgharị ahụ na-echekwa ejighị n’aka a kama ikpebi ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Chebara ... echiche’ mee ka iwu ntụgharị uche ahụ daa nke ọma n’Igbo; e chekwara ejighị n’aka gbasara onye ‘Onyenwe anyị’ bụ.
