id: 2TI.2.21
reference: 2 Timothy 2:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν οὖν τις ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων, ἔσται σκεῦος εἰς τιμήν, ἡγιασμένον, ⸀εὔχρηστον τῷ δεσπότῃ, εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/021.yaml
  text: Therefore[a], if anyone cleanses himself from these things, he will be a vessel for honor, sanctified, useful to the Master[b], prepared for every good work.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na onye ọ bụla asachapụ onwe ya pụọ n’ihe ndị a, ọ ga-abụ arịa e ji eme ihe dị ùgwù[a], nke e doro nsọ, nke bara Onyenwe ụlọ uru[b], nke a kwadebere maka ezi ọrụ ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “arịa maka nsọpụrụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Nna ukwu” ma ọ bụ “onye nwe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: Nke a na-egosipụta ma nkwubi okwu οὖν sitere n'okwu ndị bu ụzọ, ma ọnọdụ nke ἐὰν na-ewebata.
- source_word: τις
  choice: onye ọ bụla
  rationale: Okwu a na-ezo aka n'onye ọ bụla n'ozuzu ya, ọ bụghị naanị nwoke.
- source_word: ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων
  choice: asachapụ onwe ya pụọ n’ihe ndị a
  rationale: “Sachapụ” na-egosipụta iwepụ adịghị ọcha nke ọma; “onwe ya” na-echekwa nnọchiaha nlaghachi nke otu onye, ebe “ihe ndị a” na-ahapụ ihe a na-ezo aka na ya dịka ọnọdụ gbara amaokwu ahụ gburugburu si dị.
- source_word: σκεῦος
  choice: arịa
  rationale: “Arịa” dabara n'ihe atụ ụlọ nke malitere n'amaokwu bu ụzọ, karịa okwu ga-eme ka ọ bụrụ naanị ngwa ọrụ.
- source_word: εἰς τιμήν
  choice: e ji eme ihe dị ùgwù
  rationale: Nke a na-eme ka Igbo bụrụ ihe a na-aghọta nke ọma ma na-echekwa ọdịiche dị n'etiti iji arịa eme ihe dị ùgwù na nke ihere.
- source_word: ἡγιασμένον
  choice: nke e doro nsọ
  rationale: Ọ na-egosipụta ọnọdụ sitere n'omume idobe ihe nsọ ma ọ bụ ikewapụ ya maka nzube pụrụ iche.
- source_word: εὔχρηστον τῷ δεσπότῃ
  choice: nke bara Onyenwe ụlọ uru
  rationale: “Bara ... uru” bụ Igbo nkịtị maka ihe kwesịrị iji rụọ ọrụ; “Onyenwe ụlọ” na-echekwa ikike δεσπότης na ihe atụ banyere ụlọ.
- source_word: εἰς πᾶν ἔργον ἀγαθὸν ἡτοιμασμένον
  choice: nke a kwadebere maka ezi ọrụ ọ bụla
  rationale: Nke a na-echekwa obosara πᾶν na okwu a na-ahụkarị banyere ezi ọrụ.
theological_decisions:
- issue: Ihe ἐκκαθάρῃ ἑαυτὸν ἀπὸ τούτων na-ezo aka na ya
  choice: asachapụ onwe ya pụọ n’ihe ndị a
  alternative: wepụ onwe ya n’etiti ndị a
  rationale: Genitive τούτων nwere ike ịlaghachi n'ihe ma ọ bụ ndị a kọwara n'ọnọdụ gbara ya gburugburu. Nsụgharị bụ isi anaghị ekpebi n'ụzọ siri ike na ọ bụ naanị mmadụ ka ọ bụ naanị omume.
- issue: Nkọwa ἡγιασμένον
  choice: nke e doro nsọ
  alternative: nke e mere ka ọ dị nsọ / nke e kewapụrụ iche
  rationale: “E doro nsọ” na-echekwa ma echiche ịdị nsọ ma nke ikewapụ ihe maka Chineke, na-enweghị imechi otu akụkụ nke pụtara karịa ibe ya.
- issue: Onye δεσπότης na-ezo aka na ya n’ihe atụ ụlọ
  choice: Onyenwe ụlọ
  alternative: Nna ukwu / onye nwe ya
  rationale: Okwu ahụ na-egosi onye nwere ikike n'elu ụlọ na arịa ya. “Onyenwe ụlọ” na-eme ka ihe atụ ahụ doo anya ma ghara ịkpọ onye ahụ aha karịa ka Grik si mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu dee ya. A nọgidere n’ihe atụ arịa dị n’ụlọ; a zere okwu ụka pụrụ iche ebe Grik n’onwe ya hapụrụ nkọwa sara mbara.
