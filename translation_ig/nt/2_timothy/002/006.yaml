revisions:
- from: Onye ọrụ ugbo nke na-adọgbu onwe ya n’ọrụ kwesịrị ịbụ onye mbụ ga-eketa ihe ubi.[a]
  to: Onye ọrụ ugbo na-adọgbu onwe ya n’ọrụ kwesịrị ibu ụzọ nweta oke n’ihe ubi.[a]
  rationale: The revision retains the strenuous-work sense of κοπιῶντα, the obligation of δεῖ, and the priority indicated by πρῶτον. «Nweta oke n’ihe ubi» expresses sharing in the crops/produce and avoids the inheritance implication that «iketa» can carry. The footnote preserves a viable, slightly more literal participatory alternative.
  reviewer_model: gpt-5.6-terra
