    text: A pụkwara ịsị, “Onye ọrụ ugbo na-adọgbu onwe ya n’ọrụ kwesịrị ibu ụzọ soro nweta ihe ubi.”
    reason: lexical_alternative
  revision_rationale: The revision retains the strenuous-work sense of κοπιῶντα, the obligation of δεῖ, and the priority indicated by πρῶτον. «Nweta oke n’ihe ubi» expresses sharing in the crops/produce and avoids the inheritance implication that «iketa» can carry. The footnote preserves a viable, slightly more literal participatory alternative.
