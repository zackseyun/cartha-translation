review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands πρῶτον as indicating the farmer’s priority in participation in the produce, rather than merely the temporal order of work. However, «iketa» ordinarily denotes inheriting and can introduce an unwarranted inheritance sense; μεταλαμβάνειν means to partake of or receive a share in.
  naturalness: «Onye ọrụ ugbo» and «na-adọgbu onwe ya n’ọrụ» are clear Standard Igbo. Replacing «ga-eketa» with «ibu ụzọ nweta oke n’ihe ubi» yields a more idiomatic expression of receiving a portion.
  terminology: «Ihe ubi» suitably renders καρποί in this agricultural context. «Oke» accurately conveys the partitive force of μεταλαμβάνειν without importing the semantic domain of inheritance.
  issues:
  - severity: medium
    issue: «ga-eketa» can mean ‘will inherit.’
    rationale: The Greek μεταλαμβάνειν expresses partaking or receiving a share, not inheriting. In this context «iketa» may mislead readers toward inheritance rather than participation in the harvest.
  - severity: low
    issue: The future construction «ga-eketa» is less direct than the Greek infinitive governed by δεῖ.
    rationale: «Kwesịrị ibu ụzọ nweta» naturally expresses the necessity stated by δεῖ while retaining priority through «ibu ụzọ».
  revised_text: Onye ọrụ ugbo na-adọgbu onwe ya n’ọrụ kwesịrị ibu ụzọ nweta oke n’ihe ubi.[a]
  revised_footnotes:
