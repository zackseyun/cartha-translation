  text: τὸν κοπιῶντα γεωργὸν δεῖ πρῶτον τῶν καρπῶν μεταλαμβάνειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/006.yaml
  text: The hardworking farmer must be the first to receive a share of the crops[a].
translation:
  language: ig
  text: Onye ọrụ ugbo na-adọgbu onwe ya n’ọrụ kwesịrị ibu ụzọ nweta oke n’ihe ubi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Onye ọrụ ugbo na-adọgbu onwe ya n’ọrụ kwesịrị ibu ụzọ soro nweta ihe ubi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κοπιῶντα
  choice: nke na-adọgbu onwe ya n’ọrụ
  rationale: Nkebiokwu a na-egosi ịrụsi ọrụ ike na ndọgbu dị na κοπιάω, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: γεωργὸν
  choice: onye ọrụ ugbo
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa onye na-arụ ala.
- source_word: δεῖ
  choice: kwesịrị
  rationale: “Kwesịrị” na-egosi mkpa ma ọ bụ ihe kwesịrị ime, n’enweghị ime ka ahịrịokwu ahụ sie ike karịa ka ilu a chọrọ.
- source_word: πρῶτον
  choice: onye mbụ
  rationale: Nke a jikọtara πρῶτον na iketa ihe ubi, ya bụ, onye ọrụ ugbo ga-ebute ụzọ n’inweta oke ya.
- source_word: τῶν καρπῶν
  choice: ihe ubi
  rationale: N’ọnọdụ ọrụ ugbo a, “ihe ubi” na-ekpuchi mkpụrụ na ihe ndị ọzọ a na-enweta n’ubi karịa ntụgharị nkịtị dịka “mkpụrụ.”
- source_word: μεταλαμβάνειν
  choice: ga-eketa
  rationale: “Iketa” ebe a na-egosi inweta oke ma ọ bụ iso rie uru sitere n’ihe ubi, kwekọọkwa na ngwaa ahụ na genitive partitive.
theological_decisions:
- issue: Ihe πρῶτον (“mbụ”) na-akọwa
  choice: Onye na-adọgbu onwe ya n’ọrụ ugbo kwesịrị ibute ụzọ n’iketa ihe ubi.
  alternative: Onye ọrụ ugbo ga-ebu ụzọ rụọ ọrụ tupu o rie ihe ubi.
  rationale: Usoro okwu na syntax Grik na-ejikọta πρῶτον nke ọma karịa na μεταλαμβάνειν, ya bụ, ibute ụzọ n’inweta oke, ọ bụghị naanị ịrụ ọrụ tupu iri ihe.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. “Na-adọgbu onwe ya n’ọrụ” na-echekwa ike dị na κοπιῶντα; “iketa ihe ubi” na-enye nghọta doro anya banyere inweta oke n’ihe e mepụtara.
