- from: ka uche ha wee lọghachi, ha esikwa n'ọnyà Ekwensu pụta, ebe ọ bụ na o jidere ha na ndụ[b] ka ha mezuo uche ya.[a]
  to: ka ha nwetaghachi uche ha, sikwa n'ọnyà Ekwensu pụta, bụ ndị Ekwensu jideworo dị ndụ[b] ka ha mezuo uche ya.[a]
  rationale: 'The revision preserves the Greek sequence: recovery of clear thinking, escape from the devil’s snare, and the consequent state of having been captured alive for the devil’s will. It removes the added causal force, uses more idiomatic Standard Igbo, and retains both lexical precision and the footnoted ambiguity concerning the referent of ἐκείνου.'
