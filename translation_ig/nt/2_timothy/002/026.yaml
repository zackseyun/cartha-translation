source:
  edition: SBLGNT
  text: καὶ ἀνανήψωσιν ἐκ τῆς τοῦ διαβόλου παγίδος, ἐζωγρημένοι ὑπ’ αὐτοῦ εἰς τὸ ἐκείνου θέλημα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/026.yaml
  text: and they may come to their senses out of the devil’s snare[b][a], having been captured alive by him for his will.
translation:
  language: ig
  text: ka ha nwetaghachi uche ha, sikwa n'ọnyà Ekwensu pụta, bụ ndị Ekwensu jideworo dị ndụ[b] ka ha mezuo uche ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “bụ ndị ọ jidere ka ha mee uche onye ahụ.” Ụfọdụ na-ekwu na “onye ahụ” na-ezo aka na Chineke, ọ bụghị Ekwensu.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị okwu Grik a n'ụzọ sara mbara dịka “dọọrọ n'agha,” ma n'ụzọ kapịrị ọnụ ọ na-egosi ijide mmadụ dị ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνανήψωσιν
  choice: uche ha wee lọghachi
  rationale: Nke a na-egosipụta ịlọghachi n'uche ziri ezi mgbe aghụghọ ma ọ bụ mgbagwoju anya jidere mmadụ; ọ bụ okwu Igbo dị mfe ma kwekọọ na ihe oyiyi nke ịmalite iche echiche nke ọma ọzọ.
- source_word: παγίδος
  choice: ọnyà
  rationale: “Ọnyà” bụ okwu Igbo nkịtị maka ihe e ji ama anụ ma ọ bụ mmadụ, ma na-arụkwa ọrụ nke ọma dị ka ihe atụ nke njide Ekwensu.
- source_word: διαβόλου
  choice: Ekwensu
  rationale: N'ọnọdụ a, διάβολος bụ aha e ji akọwa onye ahụ a maara dị ka Ekwensu, ọ bụghị naanị onye nkwutọ.
- source_word: ἐζωγρημένοι
  choice: o jidere ha na ndụ
  rationale: Nhọrọ a na-edobe ike pụrụ iche nke ζωγρέω, ya bụ ijide onye ma hapụ ya ndụ, ọ bụghị naanị ijide ya n'ozuzu.
- source_word: ὑπ’ αὐτοῦ
  choice: o jidere ha
  rationale: Nnọchiaha ahụ na-ezo n'ụzọ kacha nso na Ekwensu; iji “o” na-eme ka Igbo ahụ bụrụ nke eke n'ekwughachighị aha ahụ.
- source_word: εἰς τὸ ἐκείνου θέλημα
  choice: ka ha mezuo uche ya
  rationale: Nke a na-enye idiom ahụ n'Igbo doro anya, na-egosi ebumnuche njide ahụ. N'ihi na onye “ya” na-ezo aka na ya ka a na-arụrịta ụka, e debere nkọwa ọzọ n'okpuru amaokwu.
theological_decisions:
- issue: Onye ἐκείνου na-ezo aka na ya n'okwu εἰς τὸ ἐκείνου θέλημα
  choice: 'A sụgharịrị ya dịka na ọ na-ezo aka n''Ekwensu: “ka ha mezuo uche ya.”'
  alternative: Ụfọdụ na-ewere “ya” dịka ihe na-ezo aka na Chineke, nke ga-eme ka okwu ahụ pụta na a napụtara ha ka ha mee uche Chineke.
  rationale: Ekwensu bụ onye e kwuru ozugbo tupu nnọchiaha a, ya mere ọ bụ ya ka usoro ụtọasụsụ kacha mfe na-ezo aka. Ma ebe a na-arụrịta ụka banyere onye nnọchiaha ahụ na-anọchi anya ya, e dozighị esemokwu ahụ n'enweghị ihe akaebe; e debere nghọta nke ọzọ n'ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “uche ha wee lọghachi” iji mee ka ihe ἀνανήψωσιν pụtara doo anya n'Igbo; e debere ihe oyiyi ọnyà na njide na ndụ, tinyere mgbagwoju anya banyere onye “uche ya” na-ezo aka na ya.
