  text: τὰς δὲ μωρὰς καὶ ἀπαιδεύτους ζητήσεις παραιτοῦ, εἰδὼς ὅτι γεννῶσι μάχας·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/023.yaml
  text: But refuse foolish and ignorant controversies[b][a], knowing that they produce quarrels.
translation:
  language: ig
  text: Ma zere arụmụka nzuzu na nke na-enweghị nkuzi, ebe ị maara na ha na-amụpụta esemokwu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe e kwuru tupu ya; “Ma” bụ ụzọ Igbo dị mfe ma doo anya isi gosipụta nke a.
- source_word: μωρὰς
  choice: nzuzu
  rationale: Ọ na-edobe echiche nke ihe enweghị ezi uche, n’asụsụ Igbo nke ndị mmadụ na-aghọta nke ọma.
- source_word: ἀπαιδεύτους
  choice: ndị na-esite n’amaghị ihe
  rationale: Okwu Grik ahụ na-ekwu maka enweghị ọzụzụ ma ọ bụ nkuzi. Nkebiokwu a na-egosi na arụmụka ndị ahụ sitere n’amaghị ihe, kama ikwu naanị na ndị mmadụ enweghị ọgụgụ isi.
- source_word: ζητήσεις
  choice: arụmụka
  rationale: Ọ bụ ezie na okwu ahụ pụkwara ịpụta ajụjụ ma ọ bụ nchọgharị, ọnọdụ a na-egosi mkparịta ụka na-akpalite ọgụ; “arụmụka” na-ebute echiche ahụ nke ọma.
- source_word: παραιτοῦ
  choice: zere
  rationale: Iwu a gwara Timoti ka ọ ghara ịbanye n’ihe ndị a ma ọ bụ soro na ha; “zere” bụ iwu doro anya ma bụrụkwa Igbo eke.
- source_word: εἰδὼς
  choice: n’ihi na ị maara
  rationale: Ọ na-eme ka ihe kpatara iwu ahụ doo anya n’Igbo, ma na-edobe echiche nke participle Grik ahụ.
- source_word: γεννῶσι
  choice: na-amụpụta
  rationale: Nke a na-edobe ihe atụ Grik nke ịmụ ma ọ bụ ịmụpụta ihe, ma ka na-ada nke ọma n’Igbo mgbe a na-ekwu maka ihe na-akpata esemokwu.
- source_word: μάχας
  choice: esemokwu
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ọgụ okwu na nghọtahie karịa ọgụ anụ ahụ; “esemokwu” dabara nke ọma.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ihe atụ dị na γεννῶσι site n’okwu “na-amụpụta,” ebe a kọwara ya n’ala peeji. A họọrọ “arụmụka” n’ihi ọnọdụ okwu ahụ, ma e debere ntụgharị ndị ọzọ n’ala peeji ka a ghara imechi obosara अर्थ okwu Grik ahụ.
