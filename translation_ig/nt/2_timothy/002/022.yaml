id: 2TI.2.22
reference: 2 Timothy 2:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰς δὲ νεωτερικὰς ἐπιθυμίας φεῦγε, δίωκε δὲ δικαιοσύνην, πίστιν, ἀγάπην, εἰρήνην μετὰ τῶν ἐπικαλουμένων τὸν κύριον ἐκ καθαρᾶς καρδίας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/022.yaml
  text: But flee youthful desires[a], and pursue righteousness, faith, love, and peace[c][b], together with those who call on the Lord from a pure heart.
translation:
  language: ig
  text: Ma gbaara ọchịchọ ndị e ji mara ndị na-eto eto ọsọ[a]; gbasookwa ezi omume[b], okwukwe[c], ịhụnanya, na udo, gị na ndị ji obi dị ọcha na-akpọku Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “agụụ ndị ntorobịa.” Akpaokwu Grik ahụ nwere ike ịgụnye ụdị ọchịchọ dị iche iche e ji mara oge ntorobịa, ọ bụghị naanị agụụ mmekọahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikpe ziri ezi.” Okwu Grik ahụ nwere ike ịpụta ma ibi ndụ ziri ezi ma ime ihe n'ụzọ ziri ezi n'ebe ndị ọzọ nọ.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “ikwesị ntụkwasị obi.” Okwu Grik ahụ nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi, dabere n'ọnọdụ.
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτερικὰς ἐπιθυμίας
  choice: ọchịchọ ndị e ji mara ndị na-eto eto
  rationale: Nke a na-egosi ọchịchọ ndị a na-ahụkarị n'oge ntorobịa n'ụzọ sara mbara, n'emeghị ka ihe ahụ bụrụ naanị agụụ mmekọahụ.
- source_word: φεῦγε
  choice: gbaara ... ọsọ
  rationale: Ọ na-echekwa ike nke iwu Grik ahụ na ihe oyiyi nke ịgbapụ n'ihe ize ndụ, karịa naanị izere ya.
- source_word: δίωκε
  choice: gbasookwa
  rationale: Ọ na-egosi ịchụso ihe ndị a n'ọrụ na n'esepụghị aka, ma na-emegide nke ọma iwu ahụ bụ ịgbara ọchịchọ ọsọ.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: N'Igbo nkịtị, nke a na-enye echiche nke ibi ndụ ziri ezi n'ụzọ doro anya; ndetu ala peeji na-echekwa akụkụ nke okwu ahụ nke pụtara ikpe ziri ezi.
- source_word: πίστιν
  choice: okwukwe
  rationale: Nke a bụ okwu Igbo a na-ejikarị asụgharị πίστις; ndetu na-egosi na n'usoro àgwà ọma a, ikwesị ntụkwasị obi nwekwara ike ịbụ ihe a na-ekwu.
- source_word: ἀγάπην
  choice: ịhụnanya
  rationale: Ọ bụ nsụgharị Igbo kwụ ọtọ, nke a na-aghọta nke ọma maka ἀγάπη.
- source_word: εἰρήνην
  choice: udo
  rationale: Ọ bụ nsụgharị eke na nke kwụ ọtọ n'usoro àgwà ọma a.
- source_word: μετὰ τῶν ἐπικαλουμένων τὸν κύριον
  choice: gị na ndị ... na-akpọku Onyenwe anyị
  rationale: 'Ọ na-egosi mkpakọrịta nke μετά: Timoti ga-achụso àgwà ndị a ya na ndị ọzọ, ọ bụghị naanị ya.'
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-ejikarị eme ihe maka κύριος n'Agba Ọhụrụ.
- source_word: ἐκ καθαρᾶς καρδίας
  choice: ji obi dị ọcha
  rationale: Ọ bụ okwu Igbo eke nke na-egosi na ọkpụkpọku ahụ si n'ime obi na-adịghị aghụghọ apụta.
theological_decisions:
- issue: Ókè ihe νεωτερικὰς ἐπιθυμίας pụtara
  choice: Ọchịchọ dị iche iche e ji mara oge ntorobịa, ọ bụghị naanị agụụ mmekọahụ
  alternative: Agụụ mmekọahụ karịsịa
  rationale: Akpaokwu Grik ahụ sara mbara, ebe ọnọdụ gbara ya gburugburu na-ekwu maka àgwà na omume n'ozuzu; ya mere, e kwesịghị ime ka ihe ọ pụtara dị warara.
- issue: Nkọwa δικαιοσύνην
  choice: Ezi omume n'ahịrịokwu bụ isi, ya na 'ikpe ziri ezi' na ndetu ala peeji
  alternative: Ikpe ziri ezi
  rationale: N'usoro àgwà ọma a, ezi omume na-ada nke ọma ma na-egosi ibi ndụ ziri ezi; mana okwu Grik ahụ nwekwara akụkụ mmekọrịta mmadụ na ikpe ziri ezi, nke e kwesịrị ichekwa.
- issue: Nkọwa πίστιν n'usoro àgwà ọma
  choice: Okwukwe n'ahịrịokwu bụ isi
  alternative: Ikwesị ntụkwasị obi
  rationale: πίστις nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi. Ọnọdụ a anaghị ekpebi nke ikpeazụ kpamkpam, ya mere a na-edebe ihe ọzọ n'ndetu.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “gbaara ... ọsọ” na “gbasookwa” iji chekwaa ọdịiche siri ike dị n'etiti φεῦγε na δίωκε. E zere okwu ga-eme ka “ọchịchọ ndị ntorobịa” bụrụ naanị okwu banyere mmekọahụ.
