  rationale: The revision removes the added sense of allowing oneself to be bound and replaces “ihe omume” with a natural, semantically broader expression for ordinary-life affairs. It retains the ongoing military-service image, the purpose relation, and the non-specific identity of the person who enlisted the soldier.
