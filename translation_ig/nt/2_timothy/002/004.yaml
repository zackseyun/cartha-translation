  text: οὐδεὶς στρατευόμενος ἐμπλέκεται ταῖς τοῦ βίου πραγματείαις, ἵνα τῷ στρατολογήσαντι ἀρέσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/004.yaml
  text: No one serving as a soldier gets entangled in the affairs of ordinary life[a], so that he may please the one who enlisted him.
translation:
  language: ig
  text: Ọ dịghị onye na-eje ozi dị ka onye agha na-etinye onwe ya n’ihe gbasara ndụ kwa ụbọchị[a], ka o wee masị onye debanyere ya aha n’ọrụ agha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe gbasara ndụ ndị nkịtị.” Okwu Grik ahụ na-egosi ọdịiche dị n’etiti ọrụ agha na ihe gbasara ndụ kwa ụbọchị.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: Ọ dịghị onye
  rationale: Nke a na-egosipụta nkwupụta jụrụ mmadụ niile, ‘ọ dịghị onye,’ n’Igbo doro anya ma ghara ime ka okwu ahụ bụrụ naanị maka nwoke.
- source_word: στρατευόμενος
  choice: na-eje ozi dị ka onye agha
  rationale: Ọ na-egosipụta onye nọ n’ọrụ agha na-aga n’ihu, ma na-edobe ihe atụ agha nke ederede Grik.
- source_word: ἐμπλέκεται
  choice: na-ekwe ka ... kechie ya
  rationale: ‘Kechie ya’ na-edobe onyinyo nke mmadụ ihe ndị ọzọ jidere ma gbochie ya ịrụ ọrụ ya nke ọma; nhazi a dịkwa eke n’Igbo.
- source_word: ταῖς τοῦ βίου πραγματείαις
  choice: ihe omume nke ndụ nkịtị
  rationale: Nke a na-ezo aka n’ihe a na-eme na ọrụ dị iche iche nke ndụ a na-ebi kwa ụbọchị, ma na-edobe ọdịiche ya na ọrụ agha.
- source_word: ἵνα
  choice: ka o wee
  rationale: Ọ na-egosipụta ebumnuche nke ọma n’Igbo.
- source_word: τῷ στρατολογήσαντι
  choice: onye ahụ debanyere ya n’ọrụ agha
  rationale: Nke a na-egosipụta onye kpọbatara ma debanye onye agha ahụ n’ọrụ, n’etinyeghị ọkwa agha nke okwu Grik na-ekwughị.
- source_word: ἀρέσῃ
  choice: masị
  rationale: ‘Masị’ na-egosipụta ebumnuche ịbụ onye onye nyere ya ọrụ nabatara ma nwee mmasị n’ebe ọ nọ, na-enweghị ịgbasa ihe okwu Grik pụtara.
theological_decisions:
- issue: Ókè e kwesịrị idobe ihe atụ agha ahụ
  choice: E debere onye agha, ọrụ agha, na onye debanyere ya n’ọrụ agha dịka ihe atụ ederede ahụ si kwuo.
  alternative: Ịkọwa ya ozugbo dịka ndụ onye na-eje ozi Kraịst na izere ihe ndị na-adọpụ uche.
  rationale: Ederede Grik na-enye ihe atụ agha n’onwe ya; nsụgharị ekwesịghị ibu ụzọ kọwaa kpọmkwem otu a ga-esi tinye ya n’ọrụ ma ọ bụ mee ka esemokwu dị n’etiti ọrụ agha na ndụ nkịtị pụọ.
- issue: Ihe πραγματείαις τοῦ βίου pụtara
  choice: ihe omume nke ndụ nkịtị
  alternative: ọrụ ndị nkịtị na-arụ
  rationale: Nhọrọ bụ isi na-anọ nso n’echiche sara mbara nke ọrụ na ihe gbasara ndụ kwa ụbọchị. Nhọrọ ọzọ na-eme ka ọdịiche dị n’etiti onye agha na onye nkịtị pụta ìhè karịa, ma ọ na-akọwa ihe ahụ ntakịrị karịa okwu Grik.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘kechie ya’ debe onyinyo nke ịdaba n’ihe na-egbochi mmadụ, ebe ‘debanyere ya n’ọrụ agha’ na-akọwa omume στρατολογέω n’enweghị itinye ọkwa agha a na-akpọghị aha.
