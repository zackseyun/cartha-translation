  source_fidelity: The conditional structure, the aorist ‘we died,’ the future ‘we will live,’ and the shared-participation force of the two συν-compounds are conveyed accurately. Supplying ‘na ya’ is justified by the immediate Christological context and does not unnecessarily narrow the future life to one theological timeframe.
  naturalness: The draft is generally clear Standard Igbo. However, ‘Okwu a kwesịrị ntụkwasị obi’ can sound as though the saying is owed loyalty or trust. ‘Okwu a bụ nke a pụrụ ịtụkwasị obi’ is more idiomatic and unambiguously expresses that the saying is reliable.
  terminology: ‘Okwu,’ ‘na ya nwụrụ,’ and ‘na ya ga-adịkwa ndụ’ are suitable, dignified choices. The revised first clause avoids a possible semantic ambiguity while retaining the established formula’s sense.
  issues:
