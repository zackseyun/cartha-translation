  yaml_path: translation/nt/2_timothy/002/011.yaml
  text: 'The saying is trustworthy: for if we died with him[c][b][a], we will also live with him.'
translation:
  language: ig
  text: 'Okwu a bụ nke a pụrụ ịtụkwasị obi[a]: n’ihi na ọ bụrụ na anyị na ya nwụrụ[b], anyị na ya ga-adịkwa ndụ[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Okwu ahụ kwesịrị ntụkwasị obi,” ma ọ bụ “Ihe a e kwuru bụ nke a pụrụ ịdabere na ya.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọ bụrụ na anyị na ya nwụkọrọ”; nganiihu συν- e jikọrọ na ngwaa Grik na-egosi na anyị na Kraịst kekọrịtara n’ọnwụ ahụ.
    reason: lexical_alternative
  - marker: c
    text: Okwu ọdịnihu ahụ, “anyị na ya ga-adịkwa ndụ,” nwere ike izo aka na ndụ mbilite n’ọnwụ anyị na Kraịst ga-enwe, ikere òkè na ndụ ya ugbu a, ma ọ bụ ha abụọ.
    reason: alternative_reading
lexical_decisions:
- source_word: πιστὸς
  choice: kwesịrị ntụkwasị obi
  rationale: Nkebiokwu a na-egosi na ihe e kwuru bụ nke a pụrụ ịdabere na ya. Ọ bụ okwu Igbo doro anya ma dịkwa ugwu, nke na-adịghị eme ka à ga-asị na πιστός ebe a na-ekwu banyere okwukwe mmadụ.
- source_word: ὁ λόγος
  choice: Okwu a
  rationale: N’Akwụkwọ Ozi ndị a, πιστὸς ὁ λόγος bụ usoro e ji webata okwu dị mkpirikpi a pụrụ icheta. “Okwu a” na-egosipụta ọrụ ahụ n’Igbo nke ọma karịa nsụgharị siri ike nke ga-eme ka λόγος bụrụ naanị otu mkpụrụokwu.
- source_word: εἰ γὰρ
  choice: n’ihi na ọ bụrụ na
  rationale: “Ọ bụrụ na” na-echekwa ọnọdụ nke εἰ, ebe “n’ihi na” na-echekwa ọrụ nkọwa nke γάρ n’ime usoro okwu ahụ.
- source_word: συναπεθάνομεν
  choice: anyị na ya nwụrụ
  rationale: Ngwaa a nwere συν-, nke na-egosi ịnwụkọrọ onye ọzọ. “Anyị na ya nwụrụ” bụ Igbo dị nkenke ma doo anya; “ya” na-ezo aka na Kraịst dịka ihe gbara amaokwu ahụ gburugburu si gosi.
- source_word: καὶ
  choice: kwa
  rationale: Mgbakwunye “kwa” dị n’ime “ga-adịkwa” na-egosi njikọ kwekọrọ n’etiti ịnwụkọrọ ya na ịdịkọrọ ya ndụ.
- source_word: συζήσομεν
  choice: anyị na ya ga-adịkwa ndụ
  rationale: Ngwaa ọdịnihu a nwekwara συν-, ya mere nsụgharị ahụ na-egosi ndụ a na Kraịst na-ekekọrịta, ma ọ naghị ekpebi ma ọ bụ naanị ndụ mbilite n’ọnwụ, ndụ a na-ekere òkè na ya ugbu a, ma ọ bụ ha abụọ.
theological_decisions:
- issue: Onye nganiihu συν- n’ime ngwaa abụọ ahụ na-ezo aka na ya
  choice: E tinyere “na ya” n’ime nkebiokwu abụọ ahụ, “ya” na-ezo aka na Kraịst.
  alternative: 'Ịhapụ onye ahụ n’ekwughị ya: “ọ bụrụ na anyị nwụrụ, anyị ga-adịkwa ndụ.”'
  rationale: Ọ bụ ezie na Grik ekwughị onye ahụ iche, συν- na ngwaa abụọ ahụ na-egosi imekọ ihe na onye ọzọ, okwu ndị gbara ya gburugburu na-egosikwa Kraịst. Itinye “na ya” na-eme ka ihe okwu ahụ pụtara doo anya n’Igbo n’etinyeghị ozizi ọhụrụ.
- issue: Oge na ụdị ndụ a na Kraịst ga-adị
  choice: E sụgharịrị ya n’obosara dịka “anyị na ya ga-adịkwa ndụ.”
  alternative: Ịkọwa ya naanị dịka ndụ mbilite n’ọnwụ n’ọdịnihu, ma ọ bụ naanị dịka ikere òkè na ndụ Kraịst ugbu a.
  rationale: Ụdị ọdịnihu συζήσομεν nwere ike ilekwasị anya na ndụ mbilite n’ọnwụ nke ga-abịa, ma okwu ahụ nwekwara ike ibu echiche sara mbara banyere ikere òkè na ndụ Kraịst. Nsụgharị ahụ echekwala obosara na esemokwu nkọwa a kama ikpebi otu naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ugwu. Usoro ahịrịokwu ahụ na-echekwa nhazi nwere ọnọdụ na nzaghachi dị na Grik, ebe “anyị na ya” na-eme ka echiche nke συν- pụta ìhè n’ụzọ Igbo na-asụkarị.
