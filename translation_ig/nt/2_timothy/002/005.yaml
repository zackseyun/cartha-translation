review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the athletic-contest imagery, the conditional structure, the passive bestowal of the victor’s crown, and the sense of νομίμως as conformity to contest rules. However, the second occurrence, “ọ sọghị mpi,” is negative (“he did not compete”) and reverses the force of the Greek positive aorist subjunctive ἀθλήσῃ in the ‘unless’ clause.
  naturalness: Apart from that polarity error, the Standard Igbo is clear and suitably formal. “ịsọ mpi,” “onye na-eme egwuregwu,” and “okpu mmeri” communicate the image naturally. Replacing “sọghị” with “sọọ” makes the conditional clause grammatical and semantically correct.
  terminology: “Okpu mmeri” appropriately conveys the victor’s crown without overinterpreting it. “Dịka iwu egwuregwu si dị” is a clear contextual rendering of νομίμως; the note preserves the more literal legal/proper sense.
  issues:
  - severity: high
    issue: Negative verb form in the final conditional clause
    rationale: “ma ọ bụrụ na ọ sọghị mpi” means ‘unless/if he did not compete’ in context, whereas Greek ἐὰν μὴ νομίμως ἀθλήσῃ means ‘unless he competes according to the rules.’ The negative is supplied by ἐὰν μὴ (‘unless’), not by ἀθλήσῃ itself.
  revised_text: Ọzọkwa, ọ bụrụ na mmadụ asọọ mpi dịka onye na-eme egwuregwu, a naghị ekpu ya okpu mmeri ma ọ bụrụ na ọ sọọ mpi dịka iwu egwuregwu si dị.[a]
