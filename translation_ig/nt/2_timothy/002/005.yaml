  text: And if anyone also competes as an athlete[a], he is not crowned unless he competes according to the rules.
translation:
  language: ig
  text: Ọzọkwa, ọ bụrụ na mmadụ asọọ mpi dịka onye na-eme egwuregwu, a naghị ekpu ya okpu mmeri ma ọ bụrụ na ọ sọọ mpi dịka iwu egwuregwu si dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụzọ iwu kwadoro.” Okwu Grik a nwere ike ịpụta ime ihe n’ụzọ iwu kwadoro; n’ebe a, ọ ga-abụ na ọ na-ekwu maka ịsọ mpi dịka iwu asọmpi si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθλῇ / ἀθλήσῃ
  choice: asọọ mpi dịka onye na-eme egwuregwu / ọ sọghị mpi
  rationale: Okwu Grik a na-ezo aka n’ịsọ mpi n’egwuregwu, ọ bụghị nanị n’ịgbalịsi ike. Nsụgharị a na-eme ka ihe atụ egwuregwu ahụ doo anya ma na-edobe njikọ dị n’etiti ugboro abụọ e ji otu ngwaa ahụ mee ihe.
- source_word: τις
  choice: mmadụ
  rationale: Nnọchiaha a na-anọchi onye ọ bụla n’ozuzu ya. “Mmadụ” bụ ụzọ Igbo nkịtị si egosipụta echiche a n’enweghị ịgbakwụnye nwoke ma ọ bụ nwanyị.
- source_word: στεφανοῦται
  choice: a naghị ekpu ya okpu mmeri
  rationale: Ngwaa ahụ na-ekwu maka ikpu onye meriri okpu ma ọ bụ okpu akwụkwọ e ji akwụ onye mmeri ụgwọ. “Okpu mmeri” na-echekwa ihe atụ ahụ ma mee ka ọ pụta ìhè nye ndị na-agụ Igbo taa.
- source_word: νομίμως
  choice: dịka iwu egwuregwu si dị
  rationale: N’ọnọdụ asọmpi a, okwu ahụ pụtara ime ihe n’ụzọ iwu kwadoro, ya bụ, dịka usoro ma ọ bụ iwu asọmpi si dị. Nhọrọ a na-eme ka ọnọdụ egwuregwu ahụ doo anya, ebe nkọwa ọzọ dị na ndetu ala peeji.
- source_word: καὶ
  choice: Ọzọkwa
  rationale: Ọ na-agbakwụnye ihe atụ ọzọ n’ihe atụ ndị gbara amaokwu a gburugburu.
- source_word: δὲ
  choice: Ọzọkwa
  rationale: Ọ na-egosi ngafe dị nro gaa n’ihe atụ ọzọ; n’Igbo, otu okwu “Ọzọkwa” na-eburu nke ọma ma ike mgbakwunye nke καί ma ngafe nke δέ.
theological_decisions:
- issue: Ihe okpu mmeri ahụ na-anọchi anya ya
  choice: E debere ya dịka ihe atụ nke ikpu onye meriri n’asọmpi okpu, n’akọwaghị kpọmkwem ụgwọ ime mmụọ ọ na-anọchi anya ya.
  alternative: Ịkọwa okpu ahụ kpọmkwem dịka ụgwọ a ga-enweta n’ọdịnihu ma ọ bụ dịka nnabata ọrụ onye ozi.
  rationale: Amaokwu ahụ n’onwe ya ji ihe atụ egwuregwu mesie mkpa ọ dị ịsọ mpi n’ụzọ iwu kwadoro ike, ma ọ kọwaghị ụdị ụgwọ ime mmụọ ahụ kpọmkwem. Ya mere, nsụgharị ahụ anaghị etinye nkọwa ozizi karịrị ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu, dee ya. “Ịsọ mpi” na “onye na-eme egwuregwu” na-eme ka ihe atụ egwuregwu doo anya; “ikpu okpu mmeri” na-echekwa ihe oyiyi Grik nke inye onye meriri okpu. E tinyere akara ndetu [a] ozugbo e kwuchara ahịrịokwu metụtara νομίμως.
