id: 2TI.2.14
reference: 2 Timothy 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα ὑπομίμνῃσκε, διαμαρτυρόμενος ἐνώπιον τοῦ ⸀κυρίου, μὴ λογομαχεῖν, ⸀ἐπ’ οὐδὲν χρήσιμον, ἐπὶ καταστροφῇ τῶν ἀκουόντων.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/014.yaml
  text: Keep reminding them of these things[a], solemnly charging them before the Lord not to quarrel about words[b], which is useful for nothing and leads to the ruin of those who hear.
translation:
  language: ig
  text: Nọgide na-echetara ha ihe ndị a, jiri ịdị uchu dọọ ha aka ná ntị n’ihu Onyenwe anyị ka ha ghara ịlụ ọgụ banyere okwu; nke a abaghị uru ọ bụla, ọ na-edugakwa ná mbibi ndị na-ege ntị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu ahụ bụ “n’ihu Onyenwe anyị” na-egosi na Onyenwe anyị bụ onye akaebe; ihe odide ahụ akọwaghị kpọmkwem ma “Onyenwe anyị” ebe a ọ bụ Onyenwe anyị Jizọs ka ọ bụ Chineke n’ozuzu ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-ezo aka n’ozizi ndị e kwuru tupu nke a ma na-edobe ụdị ọtụtụ nke okwu Grik.
- source_word: ὑπομίμνῃσκε
  choice: Na-echetara ha ... mgbe niile
  rationale: Iwu dị n’ụdị ugbu a na-egosi omume a ga na-eme ugboro ugboro; nkebi a bụ Igbo dị mfe ma doo anya.
- source_word: διαμαρτυρόμενος
  choice: na-adọ ha aka ná ntị nke ukwuu
  rationale: Ọ na-egosipụta ịdọ aka ná ntị ma ọ bụ inye iwu siri ike n’ọnọdụ dị nsọ; okwu a na-ebupụta ịdị arọ nke participle ahụ.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: n’ihu Onyenwe anyị
  rationale: Ọ bụ akpaalaokwu na-egosi na Onyenwe anyị bụ onye akaebe; a hapụrụ onye κύριος kpọmkwem na-ezo aka na ya n’enweghị ịkọwa ya karịa ihe odide ahụ.
- source_word: μὴ λογομαχεῖν
  choice: ka ha ghara ịrụrịta ụka banyere okwu
  rationale: Ọ na-egosi esemokwu na ọgụ ọnụ banyere okwu, ọ bụghị naanị mkparịta ụka nkịtị.
- source_word: ἐπ’ οὐδὲν χρήσιμον
  choice: nke ahụ abaghị uru ọ bụla
  rationale: Ọ na-edobe nkwupụta siri ike na esemokwu okwu ahụ enweghị uru ma ọlị.
- source_word: ἐπὶ καταστροφῇ
  choice: kama ọ na-eduga ná mbibi
  rationale: Ọ na-egosi nsonaazụ na-emerụ ahụ ma na-edobe ịdị njọ nke καταστροφή.
- source_word: τῶν ἀκουόντων
  choice: nke ndị na-anụ ya
  rationale: Ọ na-asụgharị participle ahụ dị ka ndị nọ na-ege esemokwu ahụ ntị n’ụzọ Igbo nkịtị.
theological_decisions:
- issue: Onye κύριος na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Chineke; Onyenwe anyị Jizọs
  rationale: Ihe odide Grik kwuru naanị ‘Onyenwe anyị.’ Nsụgharị ahụ anaghị ekpebi ma ọ bụ Chineke n’ozuzu ya ka ọ bụ Jizọs Kraịst kpọmkwem, ya mere ọ na-echekwa nghọtahie ezi uche dị na ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Onyenwe anyị’ chekwaa aha nsọ na enweghị nkọwa doro anya banyere onye a na-ekwu; e zere okwu ụka pụrụ iche. E tinyere akara ụkwụ niile n’ahịrị isi.
