id: 2TI.2.19
reference: 2 Timothy 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ μέντοι στερεὸς θεμέλιος τοῦ θεοῦ ἕστηκεν, ἔχων τὴν σφραγῖδα ταύτην· Ἔγνω κύριος τοὺς ὄντας αὐτοῦ, καί· Ἀποστήτω ἀπὸ ἀδικίας πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/019.yaml
  text: 'Nevertheless[a], the firm foundation of God stands, having this seal: “The Lord knows those who are his,” and[b], “Let everyone who names the name of the Lord depart from unrighteousness.”'
translation:
  language: ig
  text: 'Otú ọ dị, ntọala siri ike nke Chineke ka guzo, o nwere akara a[a]: “Onyenwe anyị maara ndị bụ nke ya,” na[b], “Ka onye ọ bụla na-akpọ aha Onyenwe anyị wezuga onwe ya n’ajọ omume.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o nwere ihe odide a.” Okwu a sụgharịrị “akara” nwere ike izo aka n’akara e ji amata ihe ma ọ bụ n’ihe e dere n’elu akara e ji emechi ihe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye ọ bụla na-akpọku aha Onyenwe anyị.” Greek kwuru ya n’ụzọ nkịtị dịka “onye na-akpọ aha Onyenwe anyị,” okwu nwere ike ịpụta ịkpọku ya ma ọ bụ ikwupụta na mmadụ na-erubere ya isi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέντοι
  choice: Otú ọ dị
  rationale: Nke a na-egosi ntụgharị okwu siri ike megide ihe e kwuru banyere ozizi ụgha n’amaokwu ndị bu ụzọ.
- source_word: στερεὸς θεμέλιος τοῦ θεοῦ
  choice: ntọala siri ike nke Chineke
  rationale: Ọ na-edobe ihe atụ nke ntọala, ike ya, nakwa genitive ‘nke Chineke’ n’enweghị ịkọwa kpọmkwem ma ọ bụ ihe Chineke nwere, ihe sitere n’aka ya, ma ọ bụ ihe e ji mara ya.
- source_word: ἕστηκεν
  choice: ka guzo
  rationale: '‘Ka guzo’ na-egosi ọnọdụ kwụsiri ike nke perfect Greek: ntọala ahụ guzo, ọ ka na-eguzokwa.'
- source_word: ἔχων τὴν σφραγῖδα ταύτην
  choice: o bukwa akara a
  rationale: ‘Akara’ na-edobe ihe atụ nke σφραγίς dị ka ihe na-egosi onye nwe ihe ma ọ bụ na-akwado izi ezi ya; ndetu ala peeji na-enye echiche nke ihe e dere n’akara ahụ.
- source_word: Ἔγνω κύριος
  choice: Onyenwe anyị maara
  rationale: Ọ bụ ezie na ἔγνω bụ aorist n’ụdị ya, n’okwu e hotara ebe a ọ na-egosi ihe na-adịgide adịgide; ‘maara’ bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: τοὺς ὄντας αὐτοῦ
  choice: ndị bụ nke ya
  rationale: Nke a na-edobe echiche nke ịbụ nke Onyenwe anyị n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: Ἀποστήτω ἀπὸ ἀδικίας
  choice: Ka ... wezuga onwe ya n’ajọ omume
  rationale: Ọ na-egosi iwu ka mmadụ kewapụ onwe ya kpamkpam n’ihe ọjọọ, ma ‘ajọ omume’ na-ekpuchi omume na-ezighị ezi n’ozuzu ya.
- source_word: πᾶς ὁ ὀνομάζων τὸ ὄνομα κυρίου
  choice: onye ọ bụla na-akpọ aha Onyenwe anyị
  rationale: Nke a bụ okwu Igbo doro anya nke na-edobe ‘ịkpọ aha’ dị n’asụsụ Greek, ma hapụkwa ohere maka echiche nke ịkpọku Onyenwe anyị ma ọ bụ ikwupụta na mmadụ bụ nke ya.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya n’okwu abụọ ahụ e dere n’akara
  choice: A sụgharịrị κύριος ugboro abụọ dịka ‘Onyenwe anyị’ n’enweghị ịkọwa ma ọ bụ Nna, Kraịst, ma ọ bụ okwu Akwụkwọ Nsọ nwere nghọta karịrị otu.
  alternative: A pụrụ ịkọwa ya kpọmkwem dịka Chineke Nna, dịka Kraịst, ma ọ bụ mee ka ebe abụọ ahụ na-ezo aka n’ebe dị iche iche.
  rationale: Greek ekwughị ya hoo haa. Ịhapụ ya dịka ‘Onyenwe anyị’ na-edobe nghọta sara mbara na nrụgide nkà mmụta okpukpe dị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke ntọala na akara, ma zere okwu ụka pụrụ iche nke otu denomination. E tinyere akara ndetu [a] n’ebe okwu σφραγίς dị, ebe ọ bụ ya ka ndetu ahụ na-akọwa; [b] so njikọ na-ebute okwu nke abụọ dịka n’usoro e nyere.
