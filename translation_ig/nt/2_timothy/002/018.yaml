- from: ndị kpafuru n’eziokwu[a], na-ekwu na mbilite n’ọnwụ emeelarị[b], ma na-akwatu okwukwe ụfọdụ ndị[c].
  to: ndị si n’eziokwu kpafuo[a], na-ekwu na mbilite n’ọnwụ emeworị[b], ma na-akwatu okwukwe ụfọdụ mmadụ[c].
  rationale: The revision clarifies the Greek relation of deviation from the truth, uses a more idiomatic completed-event form for the claimed resurrection, and makes the possessive sense of ‘the faith of some’ explicit. It preserves the source’s ambiguity about the precise nature of the asserted resurrection and retains the original footnote functions.
