  text: οἵτινες περὶ τὴν ἀλήθειαν ἠστόχησαν, ⸀λέγοντες ἀνάστασιν ἤδη γεγονέναι, καὶ ἀνατρέπουσιν τήν τινων πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/018.yaml
  text: who have gone astray from the truth[a], saying that the resurrection has already happened[e][d][c][b], and are upsetting the faith of some.
translation:
  language: ig
  text: ndị si n’eziokwu kpafuo[a], na-ekwu na mbilite n’ọnwụ emeworị[b], ma na-akwatu okwukwe ụfọdụ mmadụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị na-agahie n’ihe gbasara eziokwu,” ma ọ bụ “ndị si n’eziokwu wezuga onwe ha.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ha na-ekwu na mbilite n’ọnwụ a na-atụ anya ya n’ọdịnihu agafeelarị.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsị, “na-emebi,” “na-akpaghasị,” ma ọ bụ “na-eme ka okwukwe ụfọdụ mmadụ ghara iguzosi ike.” Okwu Grik bụ πίστις, nke nwekwara ike ịpụta “ntụkwasị obi” n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ τὴν ἀλήθειαν ἠστόχησαν
  choice: kpafuru n’eziokwu
  rationale: Nkebiokwu Grik a pụtara na ha ezughị ihe a na-achọ n’ihe gbasara eziokwu, ya bụ, ha esila n’eziokwu pụọ. “Kpafuru n’eziokwu” bụ Igbo doro anya ma na-edobe echiche nke isi n’ụzọ ziri ezi wezuga onwe onye.
- source_word: λέγοντες
  choice: na-ekwu
  rationale: Ọ na-akọwa ihe ha na-ekwu nke gosiri ụzọ ha si kpafuo, n’enweghị ịmanye ma ọ bụ ụzọ e si mee ihe ma ọ bụ naanị ihe mere n’otu oge.
- source_word: ἀνάστασιν
  choice: mbilite n’ọnwụ
  rationale: N’ebe a ọ na-ezo aka na mbilite n’ọnwụ a maara n’ozizi Ndị Kraịst; okwu Igbo a bụ nke nkịtị, doro anya, ma kwesị ekwesị.
- source_word: ἤδη γεγονέναι
  choice: emeelarị
  rationale: Ụdị perfect infinitive na-egosi ihe ndị ahụ kwuru na o mechaala mee ma ka nwekwaa ihe ọ pụtara ugbu a; “emeelarị” na-ebupụta nke a n’ụzọ dị mkpirikpi ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: ἀνατρέπουσιν
  choice: na-akwatu
  rationale: Ngwaa a nwere echiche nke ịkwatu, ime ka ihe ghara iguzosi ike, ma ọ bụ imebi ya. “Na-akwatu” na-edobe ike nke okwu Grik ahụ karịa nanị “na-akpaghasị,” ma ọ naghị ekwu hoo haa na okwukwe ndị ahụ alaalala kpamkpam.
- source_word: τήν τινων πίστιν
  choice: okwukwe ụfọdụ ndị
  rationale: “Okwukwe” bụ ntụgharị Igbo a na-ejikarị eme πίστις n’ọnọdụ a; τινων na-egosi ụfọdụ ndị a na-akpọghị aha, ọ bụghị mmadụ niile.
theological_decisions:
- issue: Ihe okwu ahụ bụ “mbilite n’ọnwụ emeelarị” pụtara
  choice: E depụtara ya dị ka nkwupụta ụgha na mbilite n’ọnwụ emeelarị, n’akọwaghị usoro ozizi ha n’ụzọ sara mbara.
  alternative: Ịkọwa ya kpọmkwem dị ka mbilite ime mmụọ naanị ma ọ bụ ịgọnahụ mbilite anụ ahụ n’ọdịnihu.
  rationale: Amaokwu Grik na-enye ihe ha kwuru, ma ọ naghị akọwa kpọmkwem usoro echiche ha. Ntụgharị ahụ na-edobe esemokwu na enweghị nkọwa zuru ezu dị na isi mmalite.
- issue: Ntụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: “Okwukwe” bụ okwu kwekọrọ n’ọnọdụ ozizi a ma ghara ịkpa ókè n’etiti okwukwe dịka ntụkwasị obi mmadụ na ihe ndị mmadụ kwenyere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ amaokwu ahụ dịka nkebiokwu na-aga n’ihu site n’amaokwu bu ya ụzọ, dịka οἵτινες si arụ ọrụ n’asụsụ Grik. E jighị nkọwa ụka pụrụ iche kọwaa ụdị ozizi ụgha ahụ.
