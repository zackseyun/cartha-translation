  text: ⸀συγκακοπάθησον ὡς καλὸς στρατιώτης ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/003.yaml
  text: Share in suffering as a good soldier of Messiah Jesus[a][b].
translation:
  language: ig
  text: Taa ahụhụ ọnụ dị ka ezi onye agha nke Mesaịa Jizọs[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Soro m taa ahụhụ dị ka ezi onye agha nke Kraịst Jizọs.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Kraịst Jizọs”; e ji “Mesaịa Jizọs” mee ihe n’ebe a n’ihi na Χριστός bụ utu aha.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκακοπάθησον
  choice: Taa ahụhụ ọnụ
  rationale: Ngwaa iwu a na-egosi ịbanye n’ịta ahụhụ ya na onye ọzọ ma ọ bụ ndị ọzọ. “Taa ahụhụ ọnụ” na-echekwa echiche nke σύν- n’etinyeghị “soro m,” nke a na-ekwughị kpọmkwem n’amaokwu a.
- source_word: ὡς
  choice: dị ka
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ntụnyere na otú e kwesịrị isi mee ihe.
- source_word: καλὸς
  choice: ezi
  rationale: N’ebe a ọ na-akọwa onye agha kwesịrị ntụkwasị obi, nke ruru eru ma dị mma; “ezi” bụ okwu Igbo doro anya ma dabara n’usoro okwu a.
- source_word: στρατιώτης
  choice: onye agha
  rationale: Nke a bụ okwu Igbo nkịtị maka soldier, ọ na-echekwakwa ihe atụ Pọl ji mee ihe.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a. “Mesaịa” na-ebute ihe utu aha ahụ pụtara kama ime ya naanị akụkụ aha.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: “Jizọs” bụ ụdị aha Ἰησοῦς a na-ejikarị n’Igbo; njikọ “nke Mesaịa Jizọs” na-egosipụta genitive Grik.
theological_decisions:
- issue: Otú e si sụgharịa Χριστοῦ Ἰησοῦ
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: Akụkụ mbụ bụ utu aha, nke abụọ abụrụ aha mmadụ. “Mesaịa Jizọs” na-echekwa ọdịnaya utu aha Χριστός, ebe “Kraịst Jizọs” bụ ụdị ọdịnala a makwaara nke ọma.
- issue: Onye Timoti ga-eso taa ahụhụ
  choice: 'Ahapụrụ onye ahụ n’emeghị ka ọ pụta ìhè: “taa ahụhụ ọnụ”'
  alternative: “Soro m taa ahụhụ”
  rationale: Prefix σύν- na-egosi iso ibe ya mee ihe, ma amaokwu a ekwughị “m” kpọmkwem. Ya mere, isi ederede anaghị emechi ihe nwere ike ịbụ nghọta sitere n’okirikiri okwu.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma nwee ugwu. “Taa ahụhụ ọnụ” bụ ahịrị dị mkpirikpi nke na-eburu iwu ahụ na echiche iso ndị ọzọ kee ahụhụ, ma ọ naghị etinye onye a na-eso mgbe Grik n’onwe ya na-ekwughị ya.
