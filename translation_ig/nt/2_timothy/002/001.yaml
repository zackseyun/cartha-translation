id: 2TI.2.1
reference: 2 Timothy 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σὺ οὖν, τέκνον μου, ἐνδυναμοῦ ἐν τῇ χάριτι τῇ ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/002/001.yaml
  text: You[a], then, my child, be strengthened in the grace that is in Messiah Jesus[b],
translation:
  language: ig
  text: Ya mere, gị onwe gị, nwa m, nweta ike[a] n’amara dị n’ime Mesaịa Jizọs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ike.” Ụdị ngwaa Grik ahụ nwere ike ịsụgharị nkenke otú a, ma “nweta ike” na-egosipụta nke ọma na ọ bụ ike a na-anata.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Kraịst Jizọs.” A sụgharịrị aha-ọkwa Grik Χριστός dịka “Mesaịa” iji chekwaa ihe ọ pụtara; ọtụtụ nsụgharị na-eji ụdị ọdịnala bụ “Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: Σὺ
  choice: gị onwe gị
  rationale: Aha nnọchiaha ahụ pụtara ìhè na Grik ma nwee nkwusi ike; “gị onwe gị” na-egosipụta nkwusi ike na ọdịiche ahụ n’Igbo nkịtị.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ndụmọdụ a na ihe e kwuru tupu ya, na-egosi nkwubi okwu ma ọ bụ ihe na-esote ya.
- source_word: τέκνον μου
  choice: nwa m
  rationale: τέκνον pụtara nwa n’enweghị ịkọwa nwoke ma ọ bụ nwaanyị, ma na-egosikwa mmekọrịta ịhụnanya Pọl nwere n’ebe Timoti nọ.
- source_word: ἐνδυναμοῦ
  choice: nweta ike
  rationale: Ụdị ngwaa a nwere ike igosi na onye ahụ na-anata ike, ọ bụghị naanị na ọ na-eme onwe ya ka o sie ike. “Nweta ike” bụ ụzọ Igbo doro anya si chekwaa nghọta ahụ.
- source_word: ἐν τῇ χάριτι
  choice: n’amara
  rationale: '“N’” na-echekwa ohere nghọta abụọ dị na ἐν: amara dịka ọnọdụ mmadụ nọ n’ime ya nakwa dịka ụzọ e si enye ya ike.'
- source_word: χάριτι
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa χάρις n’ebe a, ya bụ ihuọma Chineke nke na-enyekwa ike.
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: dị n’ime Mesaịa Jizọs
  rationale: Nkebiokwu a na-akọwa amara ahụ dịka nke dị n’ime Mesaịa Jizọs ma ọ bụ nke e jikọtara ya na ya; nsụgharị ahụ anaghị eme ka otu n’ime nghọta ndị ahụ bụrụ naanị nke ziri ezi.
- source_word: Χριστῷ
  choice: Mesaịa
  rationale: Χριστός bụ aha-ọkwa nke pụtara Onye E Tere Mmanụ; “Mesaịa” na-echekwa ihe aha-ọkwa ahụ pụtara kama ime ya naanị aha mmadụ.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Nke a bụ ụdị aha Ἰησοῦς a na-ejikarị ede n’Igbo.
theological_decisions:
- issue: Ụdị na onye na-enye ike n’okwu ἐνδυναμοῦ
  choice: “nweta ike,” nke na-egosi ike a na-anata
  alternative: “dị ike” ma ọ bụ “mee onwe gị ka i sie ike”
  rationale: Ụdị middle/passive nke iwu a kwekọrọ na nghọta na ike ahụ sitere n’èzí onye ahụ, karịchaa n’ihi na okwu so ya kwuru na ọ bụ n’amara dị n’ime Mesaịa Jizọs.
- issue: Nsụgharị Χριστός
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: “Mesaịa” na-eme ka ihe aha-ọkwa Grik ahụ pụtara—Onye E Tere Mmanụ—pụta ìhè, ebe “Kraịst” bụ ụdị ọdịnala a makwaara nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Gị onwe gị” na-edebe nkwusi ike dị na Σὺ; “nwa m” na-edebe ịhụnanya nke τέκνον μου n’etinyeghị nwoke n’okwu ahụ; “nweta ike” na-asụ Igbo nke ọma ma na-echekwa echiche nke ike a na-anata.
