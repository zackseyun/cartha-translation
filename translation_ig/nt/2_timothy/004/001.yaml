id: 2TI.4.1
reference: 2 Timothy 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃, τοῦ μέλλοντος κρίνειν ζῶντας καὶ νεκρούς, ⸀καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/001.yaml
  text: 'I solemnly charge you before God and Messiah Jesus[a], who is about to judge the living and the dead[b], and by his appearing and his kingdom:'
translation:
  language: ig
  text: 'Ana m enye gị iwu siri ike n’ihu Chineke na Mesaịa Jizọs, onye gaje ikpe ndị dị ndụ na ndị nwụrụ anwụ[a], na n’ihi mpụta ya na alaeze ya[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ga-ekpe ndị dị ndụ na ndị nwụrụ anwụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma eleghị anya, “nakwa mpụta ya na alaeze ya,” ebe a hapụrụ otú okwu ndị a si jikọta na iwu ahụ ka ọ ghara ịpụta ihe nke ọma n’asụsụ Grik.
    reason: alternative_reading
lexical_decisions:
- source_word: Διαμαρτύρομαι
  choice: Ana m enye gị iwu siri ike
  rationale: N’ọnọdụ a Pọl na-enye Timoti ọrụ n’ụzọ dị oke mkpa; ntụgharị a na-egosipụta ike nke ịdọ aka ná ntị na inye iwu, kama ime ya naanị ịgba akaebe. E tinyere “gị” n’ihi na onye a na-agwa okwu doro anya site n’ihe gbara amaokwu ahụ gburugburu.
- source_word: ἐνώπιον
  choice: n’ihu
  rationale: Nke a bụ okwu Igbo dị nkenke ma bụrụkwa nke ebumpụta ụwa maka ịnọ n’ihu ma ọ bụ n’ọhụhụ Chineke.
- source_word: θεοῦ
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị eme ihe maka θεός.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Mesaịa Jizọs
  rationale: Χριστός ka na-arụ ọrụ dị ka utu aha n’ebe a; “Mesaịa” na-echekwa echiche onye e tere mmanụ nke Chineke kwere ná nkwa, kama ime ka okwu ahụ bụrụ naanị aha.
- source_word: τοῦ μέλλοντος κρίνειν
  choice: onye gaje ikpe
  rationale: “Gaje” na-egosipụta ihe na-abịa ime ma na-echekwa ike μέλλω nke ọma karịa ọdịnihu nkịtị, n’enweghị ịkọ kpọmkwem mgbe ikpe ahụ ga-abịa.
- source_word: ζῶντας καὶ νεκρούς
  choice: ndị dị ndụ na ndị nwụrụ anwụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ebumpụta ụwa isi gosi otu abụọ ahụ niile ikpe ahụ metụtara.
- source_word: ἐπιφάνειαν
  choice: mpụta ìhè
  rationale: “Mpụta ìhè” na-egosi ngosipụta a ga-ahụ anya, n’etinyeghị echiche ọzọ dị ka ebube nke okwu Grik ekwughị kpọmkwem.
- source_word: βασιλείαν
  choice: alaeze
  rationale: “Alaeze” bụ ntụgharị Igbo a na-ejikarị eme ihe, ma ọ na-adabara njikọ okwu banyere mpụta ìhè ya na ọchịchị ya.
- source_word: καὶ τὴν ἐπιφάνειαν αὐτοῦ καὶ τὴν βασιλείαν αὐτοῦ
  choice: na sitekwa na mpụta ìhè ya na alaeze ya
  rationale: A ghọtara accusative abụọ ndị a dị ka ihe ndị Pọl ji akwado iwu siri ike ahụ. “Sitekwa na” na-eme ka nghọta ahụ doo anya n’Igbo, ebe e debere nhazi okwu Grik nke nwere ike ịdị ntakịrị karịa kpọmkwem n’ihe odide ala peeji.
theological_decisions:
- issue: Otu e si atụgharị Χριστός dị ka utu aha
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’okwu ikpe dị nsọ a, utu aha ahụ ka nwere echiche Mesaịa ahụ, ya mere “Mesaịa” na-echekwa njikọ ya na onye Chineke kwere ná nkwa.
- issue: Ike μέλλω n’okwu banyere ikpe nke ga-abịa
  choice: onye gaje ikpe
  alternative: onye ga-ekpe
  rationale: “Gaje ikpe” na-echekwa mmetụta nke ihe na-abịa ime n’okwu Grik, ma ọ naghị ekpebi oge kpọmkwem. E nyere ọdịnihu nkịtị dị ka ntụgharị ọzọ n’ihe odide ala peeji.
- issue: Njikọ nke mpụta ìhè na alaeze ya na iwu siri ike ahụ
  choice: na sitekwa na mpụta ìhè ya na alaeze ya
  alternative: nakwa mpụta ìhè ya na alaeze ya
  rationale: Nhazi okwu Grik nwere ike ịbụ ịgbatị ihe e ji enye iwu ahụ ma ọ bụ hapụ njikọ ahụ ka ọ ghara ịpụta ihe nke ọma. Isi ntụgharị na-egosi nghọta mbụ, ebe ihe odide ala peeji na-echekwa nke ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. “Ana m enye gị iwu siri ike” kwekọrọ n’ọnọdụ inye ọrụ dị nsọ; “gaje” na-echekwa esemokwu dị n’etiti ịdị nso na ọdịnihu n’enweghị ịtọ oge; e zere ịgbakwunye “n’ebube” na mpụta ìhè n’ihi na okwu ahụ adịghị kpọmkwem na isi mmalite.
