    reason: alternative_reading
  revision_rationale: The revision retains all of the draft’s central lexical and theological decisions, including the deliberate rendering “Mesaịa Jizọs” and the future/imminence nuance of “gaje ikpe.” It replaces the means-oriented “sitekwa na” with “n’ihi,” which naturally conveys the adopted adjurational reading, and changes “mpụta ìhè” to the non-expansive “mpụta.” The alternative syntactical possibility remains explicitly preserved in footnote b.
