    issue: “onyinye mmanya” understates the sacrificial/libation sense of σπένδομαι.
    rationale: The Greek verb specifically evokes a drink offering poured out in sacrifice. “Àjà mmanya” preserves this imagery without adding interpretation.
  - severity: low
