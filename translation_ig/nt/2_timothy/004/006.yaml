id: 2TI.4.6
reference: 2 Timothy 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγὼ γὰρ ἤδη σπένδομαι, καὶ ὁ καιρὸς τῆς ⸂ἀναλύσεώς μου⸃ ἐφέστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/006.yaml
  text: For I am already being poured out as a drink offering[b][a], and the time of my departure has come.
translation:
  language: ig
  text: N’ihi na a na-awụpụworị m dị ka àjà mmanya[a], oge ọpụpụ m[b] eruola.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a na-awụpụworị m.” Ngwaa Grik ahụ na-eweta n’uche àjà mmanya a na-awụpụ n’oge ịchụ aja.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ntọhapụ” ma ọ bụ “ịtọpụ.” N’ebe a, “ọpụpụ” bụ ụzọ e si ekwu maka ọnwụ.
    reason: alternative_reading
lexical_decisions:
- source_word: σπένδομαι
  choice: a na-awụpụworị m dị ka onyinye mmanya
  rationale: Ngwaa Grik a na-akọwa ịwụpụ mmanya dị ka onyinye n’ọrụ ịchụ aja. Nsụgharị a na-edobe ihe atụ ahụ ma na-eme ka onye Igbo nke oge a ghọta ya nke ọma.
- source_word: ἤδη
  choice: -worị
  rationale: Mgbakwunye “-worị” na-egosi na omume ahụ amalitelarị ma na-aga n’ihu ugbu a.
- source_word: καιρός
  choice: oge
  rationale: “Oge” bụ okwu Igbo doro anya nke na-egosi oge ahụ dị mkpa nke bịarutere n’ọnọdụ a.
- source_word: ἀναλύσεώς
  choice: ọpụpụ
  rationale: Okwu Grik a nwere ike ịpụta ọpụpụ, ntọhapụ, ma ọ bụ ịtọsasị. “Ọpụpụ” na-edobe okwu atụ e ji nwayọọ na-ekwu maka ọnwụ, n’enweghị ịkọwa ya karịa ihe isi mmalite kwuru.
- source_word: ἐφέστηκεν
  choice: eruola
  rationale: “Eruola” na-egosi na oge ahụ abịala ma dị ugbu a, dịka ọdịdị perfect nke ngwaa Grik si pụta.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-edobe njikọ nkọwa amaokwu a na ihe e kwuru n’ihu ya.
theological_decisions:
- issue: Ihe atụ Pọl ji kọwaa ọnwụ ya na-abịaru nso
  choice: E debere ma ihe atụ nke ịwụpụ ya dị ka onyinye mmanya ma okwu nwayọọ bụ “ọpụpụ.”
  alternative: Ịsụgharị ya ozugbo dịka “aga m anwụ ugbu a” ma ọ bụ iwere ya naanị dịka ahụhụ n’ozuzu.
  rationale: Njikọ σπένδομαι na ἀνάλυσις na-atụ aka n’ọnwụ Pọl na-abịaru nso, ma nsụgharị ahụ ekwesịghị ihichapụ ihe atụ abụọ dị n’ihe odide Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. “Onyinye mmanya” na-eme ka ihe atụ ịchụ aja doo anya; “ọpụpụ” na-edobe okwu nwayọọ na nghọta sara mbara nke okwu Grik.
