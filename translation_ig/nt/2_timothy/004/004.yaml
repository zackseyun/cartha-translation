source:
  edition: SBLGNT
  text: καὶ ἀπὸ μὲν τῆς ἀληθείας τὴν ἀκοὴν ἀποστρέψουσιν, ἐπὶ δὲ τοὺς μύθους ἐκτραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/004.yaml
  text: and they will turn away their hearing from the truth[b][a], and turn aside to myths.
translation:
  language: ig
  text: Ha ga-atụgharị ntị ha pụọ n’eziokwu ahụ[a], ma tụgharịa gaa n’akụkọ ifo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “ịnụ ihe” ma ọ bụ “ige ntị”; a pụkwara ịsị, “Ha ga-akwụsị ige eziokwu ahụ ntị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “akụkọ e chepụtara echepụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθείας
  choice: eziokwu ahụ
  rationale: Akara nkọwa dị n’asụsụ Grik na-egosi eziokwu a maara nke ọma n’ọnọdụ a; “eziokwu ahụ” na-echekwa nke ahụ n’emeghị ka okwu ahụ bụrụ naanị “ozi ọma” ma ọ bụ “ozizi ziri ezi.”
- source_word: ἀκοὴν
  choice: ntị
  rationale: N’asụsụ Igbo, “ịgbakụta ... ntị” bụ ụzọ doro anya ma dịkwa ndụ e si egosi na mmadụ kpachaara anya jụ ige ihe ntị. Ihe okwu Grik pụtara kpọmkwem, “ịnụ ihe/ige ntị,” ka e depụtara n’ala peeji.
- source_word: ἀποστρέψουσιν
  choice: ga-agbakụta ... ntị
  rationale: Nhọrọ a na-echekwa ihe atụ nke ịtụgharị ihe n’ebe ọzọ nakwa echiche nke ịjụ ige eziokwu ntị n’amaghịghị ama.
- source_word: μύθους
  choice: akụkọ ifo
  rationale: “Akụkọ ifo” bụ okwu Igbo nkịtị maka akụkọ e chepụtara ma ọ bụ akụkọ na-abụghị eziokwu; ọ dabara na ọdịiche dị n’etiti ya na “eziokwu ahụ.”
- source_word: ἐκτραπήσονται
  choice: tụgharịa gaa
  rationale: Ụdị a na-egosi ntụgharị ụzọ n’enweghị ikpebi ma ọ bụ ha onwe ha mere ya kpamkpam ka ihe ọzọ mere ka ha tụgharịa.
- source_word: ἀπὸ μὲν ... ἐπὶ δὲ
  choice: gbakụta ... ma ... gaa
  rationale: 'Usoro a na-echekwa ọdịiche ntụziaka dị n’asụsụ Grik: isi n’eziokwu tụgharịa, gaa n’akụkọ ifo.'
theological_decisions:
- issue: Ihe “eziokwu ahụ” na-ezo aka na ya n’ọnọdụ a
  choice: eziokwu ahụ
  alternative: ozizi ziri ezi; eziokwu nke ozi ọma
  rationale: Ọnọdụ amaokwu a jikọtara eziokwu ahụ na nkuzi ndịozi, ma okwu Grik ka sara mbara. Nsụgharị ahụ anaghị eme ka ihe ọ pụtara dị warara karịa ka ederede ahụ si dị.
- issue: Onye ma ọ bụ ihe na-akpata ntụgharị gaa n’akụkọ ifo
  choice: tụgharịa gaa
  alternative: a ga-eme ka ha tụgharịa gaa
  rationale: ἐκτραπήσονται pụrụ inwe nghọta etiti ma ọ bụ nke nnara. Igbo a na-asụ n’ụzọ nkịtị na-ahapụ ajụjụ banyere onye kpatara ya ka ọ ghara idozi ihe asụsụ Grik na-edoghị anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. “Ịgbakụta ... ntị” na-enye ahịrịokwu ahụ usoro Igbo sitere n’okike ma na-echekwa ihe atụ nke ntụgharị dị na Grik; “tụgharịa gaa” na-eme ka ọdịiche dị n’etiti isi n’eziokwu pụọ na ịga n’akụkọ ifo pụta ìhè.
