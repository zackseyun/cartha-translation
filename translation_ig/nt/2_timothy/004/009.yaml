  yaml_path: translation/nt/2_timothy/004/009.yaml
  text: Make every effort to come to me quickly[a].
translation:
  language: ig
  text: Gbalịsie ike ịbịakwute m ngwa ngwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jisie ike ịbịakwute m n’oge na-adịghị anya,” ma ọ bụ, “Mee ike gị niile ka ị bịakwute m ngwa ngwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Gbalịsie ike
  rationale: Iwu a na-egosi ịdị uchu na itinye mgbalị siri ike, ọ bụghị naanị ime ihe ọsọ ọsọ. Nhọrọ a na-ekewapụkwa echiche ya na ταχέως.
- source_word: ἐλθεῖν
  choice: ịbịakwute
  rationale: N’ihi πρός με, ngwaa a na-egosi ịbịa n’ebe onye na-ekwu okwu nọ; “ịbịakwute m” bụ okwu Igbo doro anya ma kwekọọ n’usoro ahụ.
- source_word: πρός
  choice: -kwute
  rationale: Mgbe e jikọtara ya na ngwaa “ịbịa,” mgbakwụnye “-kwute” na-egosi ngagharị ruo n’ebe mmadụ nọ n’Igbo nkịtị.
- source_word: με
  choice: m
  rationale: Nnọchiaha onye mbụ, otu onye, nke na-egosi onye a ga-abịakwute.
- source_word: ταχέως
  choice: ngwa ngwa
  rationale: Ọ na-egosi ngwa ngwa ma ọ bụ n’oge na-adịghị anya. “Ngwa ngwa” na-echekwa ịdị ọkụ nke arịrịọ ahụ, n’emeghị ka ọ bụrụ otu ihe ahụ na mgbalị dị na Σπούδασον.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E debere echiche abụọ dị iche n’amaokwu Grik—ịgbalịsi ike (Σπούδασον) na ịdị ngwa (ταχέως)—n’enweghị ijikọta ha.
