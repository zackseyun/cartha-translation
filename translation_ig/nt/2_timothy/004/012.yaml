  edition: SBLGNT
  text: Τυχικὸν δὲ ἀπέστειλα εἰς Ἔφεσον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/012.yaml
  text: But I sent Tychicus to Ephesus[a].
translation:
  language: ig
  text: Ma m zitere Taịkikọs ka ọ gaa Efesọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “M zitekwara Taịkikọs ka ọ gaa Efesọs,” ma ọ bụ, “Ugbu a, m zitere Taịkikọs ka ọ gaa Efesọs.” Okwu Grik bụ δέ nwere ike ịbụ naanị njikọ na-eme ka okwu gaa n’ihu, ma ọ bụ gosi ntakịrị ọdịiche.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τυχικὸν
  choice: Taịkọs
  rationale: Aha mmadụ ka e dere n’ụdị mkpọrọaha; a sụgharịghị ya, kama e dere ya dịka ụda ya si kwekọọ n’usoro odide Igbo.
- source_word: δὲ
  choice: Ma
  rationale: Njikọ a nwere ike igosi ntakịrị ọdịiche ma ọ bụ naanị ịga n’ihu n’okwu. “Ma” na-edobe ohere nke ntakịrị ọdịiche ahụ, ebe ndetu ala na-egosi ụzọ ndị ọzọ.
- source_word: ἀπέστειλα
  choice: ezitere m
  rationale: Ngwaa a bụ aorist active indicative, onye mbụ otu; “ezitere m” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo na onye ahụ zipụrụ Taịkọs.
- source_word: εἰς
  choice: ka ọ gaa
  rationale: N’ihu aha obodo, εἰς na-egosi ebe njem na-aga. N’Igbo, “ka ọ gaa Efesọs” na-ekwupụta ebe e zigara ya n’ụzọ doro anya ma dị ebumpụta ụwa.
- source_word: Ἔφεσον
  choice: Efesọs
  rationale: Aha obodo dị n’ụdị mkpọrọaha mgbe εἰς gasịrị; e dere ya dịka aha a na-asụ n’Igbo.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ezitere m … ka ọ gaa” mee ka echiche iziga mmadụ n’ebe ọ na-aga daa nke ọma n’Igbo, na-enweghị itinye ihe karịrị ihe Grik kwuru.
