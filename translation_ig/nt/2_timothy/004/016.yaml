source:
  edition: SBLGNT
  text: Ἐν τῇ πρώτῃ μου ἀπολογίᾳ οὐδείς μοι ⸀παρεγένετο, ἀλλὰ πάντες με ⸀ἐγκατέλιπον— μὴ αὐτοῖς λογισθείη—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/016.yaml
  text: At my first defense no one stood with me[a], but all deserted me[c][b]. May it not be counted against them.
translation:
  language: ig
  text: N’oge mgbachitere m nke mbụ[a], ọ dịghị onye bịara nọnyere m[b]; kama, ha niile gbahapụrụ m. Ka e ghara ịgụta nke a megide ha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe mbụ e gere ikpe m” ma ọ bụ “mgbe mbụ m zara ebubo n’ụlọikpe.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “ọ dịghị onye bịara ịnọnyere m”; ihe ọ pụtara ebe a bụ na ọ dịghị onye pụtara iji kwado Pọl.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “Ka a ghara ibo ha ebubo maka nke a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολογίᾳ
  choice: gbachitere onwe m
  rationale: N’ọnọdụ ikpe a, okwu a pụtara ịza ebubo ma ọ bụ ịgbachitere onwe onye n’ihu ndị ọchịchị. Nhọrọ a bụ Igbo nkịtị ma na-edobe echiche nke ịgbachitere onwe onye n’ikpe.
- source_word: πρώτῃ
  choice: mbụ
  rationale: Ọ na-egosi oge ma ọ bụ usoro mbụ Pọl ji zaa ebubo; ‘mbụ’ bụ nsụgharị kpọmkwem ma doo anya.
- source_word: οὐδείς μοι παρεγένετο
  choice: ọ dịghị onye bịara nọnyere m
  rationale: παρεγένετο pụtara n'ụzọ nkịtị ‘bịara ịnọ ya na onye’; n’ọnọdụ a, ọ bụ ịpụta n’ụlọikpe iji kwado Pọl. Nsụgharị a na-edobe ma ọbịbịa ahụ ma ịnọnyere ya.
- source_word: ἐγκατέλιπον
  choice: gbahapụrụ m
  rationale: Okwu a na-egosi ịhapụ mmadụ naanị ya n’oge ihe siri ike. ‘Gbahapụrụ m’ bụ okwu Igbo doro anya nke na-egosipụta ịdị arọ nke omume ahụ.
- source_word: μὴ αὐτοῖς λογισθείη
  choice: Ka a ghara ịgụ nke a megide ha
  rationale: Ụdị optative ahụ na-egosipụta ọchịchọ ma ọ bụ ekpere. ‘Ịgụ ... megide ha’ na-edobe ihe atụ nke ịgụ ihe n’akaụntụ mmadụ na nke ikpe, n’etinyeghị nkọwa ozizi ọzọ.
theological_decisions:
- issue: Ụda okwu ikpeazụ Pọl kwuru banyere ndị gbahapụrụ ya
  choice: Ọchịchọ yiri ekpere ka a ghara ịgụ omume ahụ megide ha
  alternative: Ka a ghara ibo ha ebubo maka nke a
  rationale: μὴ ya na aorist passive optative λογισθείη na-egosi ọchịchọ ma ọ bụ ekpere, ọ bụghị naanị nkwupụta. Nke a na-edobe ụda mgbaghara dị n’amaokwu ahụ n’agaghị n’ihu karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọnọdụ ikpe, mwute nke ịbụ onye a gbahapụrụ, na ụda ọchịchọ ma ọ bụ ekpere dị n’okwu ikpeazụ. E tinyere akara nkọwa ala peeji [a], [b], na [c] n’ebe okwu ha na-akọwa dị.
