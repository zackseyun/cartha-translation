  text: Ἔραστος ἔμεινεν ἐν Κορίνθῳ, Τρόφιμον δὲ ⸀ἀπέλιπον ἐν Μιλήτῳ ἀσθενοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/020.yaml
  text: Erastus remained in Corinth[a], but I left Trophimus sick in Miletus.
translation:
  language: ig
  text: Erastọs nọgidere na Kọrịnt, ma ahapụrụ m Trọfimọs na Miletọs mgbe ọ na-arịa ọrịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ma ahapụrụ m Trọfimọs n’azụ na Miletọs mgbe ọ na-arịa ọrịa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔραστος
  choice: Erastọs
  rationale: Aha mmadụ; e dere ya n’ụzọ kwekọrọ na mkpọpụta na usoro ide Igbo.
- source_word: ἔμεινεν
  choice: nọgidere
  rationale: Oge aorist nke μένω na-egosi na Erastọs nọrọ ma ọ bụ nọgidere n’ebe ahụ; “nọgidere” dabara n’akụkọ njem a.
- source_word: ἐν Κορίνθῳ
  choice: na Kọrịnt
  rationale: ἐν na aha obodo na-egosi ebe; “na Kọrịnt” bụ ụzọ doro anya e si kwuo ya n’Igbo.
- source_word: Τρόφιμον
  choice: Trọfimọs
  rationale: Aha mmadụ; e degharịrị ya ka ọ kwekọọ na mkpọpụta Igbo.
- source_word: δὲ
  choice: ma
  rationale: δὲ na-egosi obere ọdịiche dị n’etiti akụkọ abụọ a; “ma” na-echekwa njikọ ahụ n’ụzọ eke.
- source_word: ἀπέλιπον
  choice: ahapụrụ m
  rationale: Ọ bụ aorist onye mbụ otu nke ἀπολείπω; “ahapụrụ m” na-egosi na onye na-ekwu okwu hapụrụ Trọfimọs n’ebe ahụ.
- source_word: ἐν Μιλήτῳ
  choice: na Miletọs
  rationale: Nkebiokwu a na-egosi ebe Trọfimọs nọ mgbe a hapụrụ ya.
- source_word: ἀσθενοῦντα
  choice: mgbe ọ na-arịa ọrịa
  rationale: Present participle a na-akọ ọnọdụ Trọfimọs n’oge a hapụrụ ya; okwu a na-egosi ọrịa karịa adịghị ike nkịtị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro akụkọ njem ahụ na obere ọdịiche δὲ na-egosi.
