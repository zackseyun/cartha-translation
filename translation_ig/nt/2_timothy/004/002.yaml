review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence of imperatives and does not over-specify λόγον. However, “mee ka ndị mmadụ mata mmejọ ha” supplies “ndị mmadụ” where the Greek leaves the recipients implicit, and it is more expansive than needed. The proposed wording retains the corrective force of ἔλεγξον while allowing the implied audience to remain implicit in context.
  naturalness: The overall Standard Igbo is clear and appropriately dignified. “N'oge kwesịrị ekwesị na n'oge na-ekwesịghị ekwesị” is more idiomatic than referring to whether “oge dị mma.” The final prepositional phrase is kept with the imperative series, as in Greek, rather than recast as a separate instruction.
  terminology: '“Kwusaa okwu ahụ,” “baa mba,” “dọọ aka ná ntị,” “gba ume,” “ndidi,” and “izi ihe” are suitable, modern Standard Igbo choices. The first two corrective verbs remain distinct: showing/calling attention to fault versus rebuking. Footnote a is corrected because “mee ya ngwa ngwa” (‘do it quickly’) is not a supported lexical alternative for ἐπίστηθι.'
  issues:
  - severity: medium
    issue: The rendering of ἔλεγξον adds an explicit group, “ndị mmadụ.”
    rationale: The Greek has no stated object. Although an audience is naturally implied, naming “people” is unnecessary expansion. “Gosi ha mmejọ ha” works naturally with the subsequent plural imperatives and is closer to the source’s economy.
  - severity: medium
    issue: Footnote a gives “mee ya ngwa ngwa” as an alternative for ἐπίστηθι.
    rationale: ‘Do it quickly’ introduces haste, which is not the lexical force of the imperative. The alternatives should express readiness, presence, persistence, or urgency in the matter.
  - severity: low
    issue: The temporal pair is rendered as whether the time is ‘good’ or ‘not good.’
    rationale: The Greek concerns opportune versus inopportune circumstances. ‘N'oge kwesịrị ekwesị na n'oge na-ekwesịghị ekwesị’ conveys that contrast more directly in Standard Igbo.
  revised_text: Kwusaa okwu ahụ; dị njikere[a] n'oge kwesịrị ekwesị na n'oge na-ekwesịghị ekwesị[b]; gosi ha mmejọ ha, baarakwa ha mba, gbaakwa ha ume[c], jiri ndidi zuru ezu na izi ihe.
