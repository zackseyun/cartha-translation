id: 2TI.4.2
reference: 2 Timothy 4:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κήρυξον τὸν λόγον, ἐπίστηθι εὐκαίρως ἀκαίρως, ἔλεγξον, ἐπιτίμησον, παρακάλεσον, ἐν πάσῃ μακροθυμίᾳ καὶ διδαχῇ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/002.yaml
  text: Preach the word[a]; be ready in season and out of season; reprove, rebuke, exhort[c][b], with all patience and teaching.
translation:
  language: ig
  text: Kwusaa okwu ahụ; dị njikere[a] n'oge kwesịrị ekwesị na n'oge na-ekwesịghị ekwesị[b]; gosi ha mmejọ ha, baarakwa ha mba, gbaakwa ha ume[c], jiri ndidi zuru ezu na izi ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “nọsie ike n'ọrụ ahụ” ma ọ bụ “nọ njikere.” Iwu Grik a nwere ike ịpụta ịnọ njikere, ịnọ ebe ahụ maka ọrụ, ma ọ bụ iji ịnụ ọkụ n'obi na-aga n'ihu n'ọrụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ma oge ọ̀ dị mma ma ọ bụ na ọ dịghị mma.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “rịọsie ha ike” ma ọ bụ “dụsie ha ọdụ ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κήρυξον
  choice: Kwusaa
  rationale: Ọ bụ iwu ka Timoti kpọsaa ozi ahụ n'ihu ọha; “kwusaa” bụ okwu Igbo doro anya ma dịkwa arọ nke na-egosipụta ọrụ onye na-ekwusa ozi.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: Nke a na-echekwa obosara nke λόγος n'ebughị ụzọ kọwaa ya kpọmkwem dị ka “oziọma” ma ọ bụ “Akwụkwọ Nsọ.”
- source_word: ἐπίστηθι
  choice: dị njikere
  rationale: N'ebe a, iwu a na-egosi ịnọ na njikere maka ime ihe. Nhọrọ a bụ Igbo eke ma kwekọọ na nkebi na-esochi ya banyere oge dị mma na nke na-adịghị mma.
- source_word: εὐκαίρως ἀκαίρως
  choice: mgbe oge dị mma ma mgbe ọ na-adịghị mma
  rationale: Nke a na-egosipụta ime ọrụ ahụ ma ọnọdụ ọ̀ dị mma ma ọ bụ na ọ dịghị mma, ma na-echekwa nguzozi nke okwu Grik abụọ ahụ.
- source_word: ἔλεγξον
  choice: mee ka ndị mmadụ mata mmejọ ha
  rationale: Okwu a na-agụnye ikpughe ihe ọjọọ na ime ka onye mere ya mata ya. Nsụgharị a na-ekewapụkwa ya n'ụzọ doro anya n'iwu siri ike nke na-esote.
- source_word: ἐπιτίμησον
  choice: baara ha mba
  rationale: Nke a na-echekwa ụda siri ike nke ịkatọ ma ọ bụ ịdọ onye mere ihe ọjọọ aka ná ntị.
- source_word: παρακάλεσον
  choice: gbaakwa ha ume
  rationale: Okwu Grik ahụ nwere ike ịpụta ịgba ume ma ọ bụ ịrịọsi ike. N'usoro a, “gba ha ume” na-enye akụkụ nkwado nke na-esochi mgbazi na ịba mba, ebe ndetu na-echekwa nghọta ọzọ.
- source_word: ἐν πάσῃ μακροθυμίᾳ
  choice: jiri ndidi zuru ezu
  rationale: μακροθυμία bụ ndidi na-adịte aka n'ebe ndị mmadụ nọ; “ndidi zuru ezu” na-egosipụta ike nke πάσῃ.
- source_word: καὶ διδαχῇ
  choice: na izi ihe
  rationale: Nke a na-egosi na a ga-eji nkuzi ma ọ bụ ntụziaka mee ọrụ mgbazi na agbamume ndị a.
theological_decisions:
- issue: Ókè ihe “okwu ahụ” pụtara
  choice: E debere ya dị ka “okwu ahụ” n'akwụghị ya kpọmkwem “oziọma” ma ọ bụ “Akwụkwọ Nsọ.”
  alternative: “ozi ahụ,” “oziọma,” ma ọ bụ “Akwụkwọ Nsọ”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu metụtara nkwusa ndị ozi na Akwụkwọ Nsọ, ma λόγος n'onwe ya akọwaghị otu ihe ahụ kpọmkwem n'ebe a. Ya mere, nsụgharị ahụ na-echekwa obosara na mgbagwoju anya dị n'isi mmalite.
- issue: Mmekọrịta “ndidi na izi ihe” na iwu ndị bu ya ụzọ
  choice: E mere ka ha bụrụ ụzọ a ga-esi mee iwu ndị ahụ niile.
  alternative: Ijikọ ha naanị na iwu ikpeazụ, “gba ha ume.”
  rationale: Nhazi okwu Grik na-akwado nghọta na ndidi na izi ihe na-achịkwa usoro ọrụ mgbazi, ịba mba, na agbamume niile, ọ bụ ezie na njikọ ahụ abụghị nke a kọwara ogologo.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E kewara ahịrịokwu ikpeazụ iche ka njikọ “ndidi na izi ihe” na iwu niile doo anya n'Igbo, n'agbanyeghị na Grik ji otu usoro okwu gaa n'ihu. A zere okwu ụka pụrụ iche na nkọwa okpukpe nke isi mmalite ekwughị kpọmkwem.
