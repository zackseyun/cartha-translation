revisions:
- from: Kwusaa okwu ahụ; dị njikere[a] mgbe oge dị mma ma mgbe ọ na-adịghị mma[b]; mee ka ndị mmadụ mata mmejọ ha, baara ha mba, gbaakwa ha ume[c]. Jiri ndidi zuru ezu na izi ihe mee ihe ndị a niile.
  to: Kwusaa okwu ahụ; dị njikere[a] n'oge kwesịrị ekwesị na n'oge na-ekwesịghị ekwesị[b]; gosi ha mmejọ ha, baarakwa ha mba, gbaakwa ha ume[c], jiri ndidi zuru ezu na izi ihe.
  rationale: The revision removes an unnecessary explicit object, uses a more idiomatic rendering of the opportune/inopportune pair, retains the Greek coordination of the final manner phrase, and corrects the unsupported ‘quickly’ alternative in footnote a. No theological interpretation is added.
