    reason: lexical_alternative
  revision_rationale: The revision removes an unnecessary explicit object, uses a more idiomatic rendering of the opportune/inopportune pair, retains the Greek coordination of the final manner phrase, and corrects the unsupported ‘quickly’ alternative in footnote a. No theological interpretation is added.
