revisions:
- from: Gbalịsie ike ịbịa tupu oge oyi eruo. Yubulọs na-ezitere gị ekele; Pudes, Linọs, Klọdia, na ụmụnna niile[a] na-ezitekwara gị ekele.
  to: Gbalịsie ike ịbịa tupu oge oyi eruo. Yubulọs na-ekele gị; Pudes na Lainọs na Klọdia na ụmụnna niile[a] na-ekelekwa gị.
  rationale: The revision retains the source’s urgency, temporal boundary, and single collective greeting while using more idiomatic Standard Igbo. It regularizes personal names to established Igbo biblical usage and corrects the footnote so that it preserves the grammatical masculine form and the contextual possibility of an inclusive referent without deciding the question in the main text.
