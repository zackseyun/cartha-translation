source:
  edition: SBLGNT
  text: Σπούδασον πρὸ χειμῶνος ἐλθεῖν. Ἀσπάζεταί σε Εὔβουλος καὶ Πούδης καὶ Λίνος καὶ Κλαυδία καὶ οἱ ἀδελφοὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/021.yaml
  text: Make every effort to come before winter. Eubulus sends greetings to you[a], and so do Pudens and Linus and Claudia and all the brothers.
translation:
  language: ig
  text: Gbalịsie ike ịbịa tupu oge oyi eruo. Yubulọs na-ekele gị; Pudes na Lainọs na Klọdia na ụmụnna niile[a] na-ekelekwa gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna nwoke na ụmụnna nwanyị niile.” Okwu Grik ahụ ji okwu nwoke n’ọnụọgụ ọtụtụ, “ụmụnna nwoke,” ma n’ebe a ọ pụrụ izo aka n’ìgwè ndị kwere ekwe n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σπούδασον
  choice: Gbalịsie ike
  rationale: Iwu a na-egosi ma ịdị uchu ma ime ihe ngwa ngwa. “Gbalịsie ike” bụ okwu Igbo doro anya nke na-egosipụta mbọ siri ike n’enweghị ime ka ọ bụrụ naanị ndụmọdụ.
- source_word: πρὸ χειμῶνος
  choice: tupu oge oyi eruo
  rationale: πρό ya na genitive na-egosi oge tupu ihe emee. N’Igbo, “tupu oge oyi eruo” na-ada nke ọma ma na-edobe echiche nke ịbịa tupu oge ahụ amalite.
- source_word: ἐλθεῖν
  choice: ịbịa
  rationale: Infinitive a mezuru Σπούδασον ma na-ekwu maka Timoti ịbịakwute Pọl. “Ịbịa” bụ ntụgharị kpọmkwem na nke e ji eme ihe kwa ụbọchị.
- source_word: Ἀσπάζεταί σε
  choice: na-ezitere gị ekele
  rationale: N’akwụkwọ ozi, ἀσπάζομαι na-egosi iziga mmadụ ekele. Okwu a bụ Igbo ebumpụta ụwa ma na-edobe mmetụta mmekọrịta dị na ahịrịokwu ahụ.
- source_word: Εὔβουλος
  choice: Yubulọs
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị ga-adaba n’ụda na mkpụrụedemede Igbo.
- source_word: Πούδης
  choice: Pudes
  rationale: A sụgharịghị aha mmadụ; e depụtara ya ka ọ na-anọchi anya aha Grik ahụ n’ụzọ dị mfe ọgụgụ n’Igbo.
- source_word: Λίνος
  choice: Linọs
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị kwekọrọ n’usoro ụda Igbo.
- source_word: Κλαυδία
  choice: Klọdọia
  rationale: A sụgharịghị aha mmadụ; e depụtara aha ahụ n’ụdị na-agbaso ụda okwu Grik ma dị mfe ọgụgụ n’Igbo.
- source_word: οἱ ἀδελφοὶ πάντες
  choice: ụmụnna niile
  rationale: “Ụmụnna” na-edobe ihe atụ ezinụlọ dị na ἀδελφοί. N’Igbo, okwu ahụ nwere ike ịpụta ụmụnne nwoke kpọmkwem ma ọ bụ ndị otu okwukwe n’ozuzu ha; ya mere e debere nghọta sara mbara dị ka nkọwa ala peeji.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-ezo aka naanị n’ụmụ nwoke ka ọ bụ n’ọgbakọ ndị kwere ekwe n’ozuzu ha
  choice: ụmụnna niile
  alternative: ụmụnna nwoke na ụmụnna nwanyị niile; ndị kwere ekwe niile
  rationale: Akwụkwọ Grik ji aha nwoke n’ọnụọgụ ọtụtụ, ma n’akwụkwọ Ndị Kraịst oge mbụ ọ pụrụ ịgụnye ọgbakọ ndị kwere ekwe dum. “Ụmụnna” na-echekwa okwu ezinụlọ nke isi mmalite ma ghara ikpebi n’ime isi ederede ma ndị inyom hà so; nkọwa ala peeji na-egosi nghọta ahụ ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu mbụ na-egosipụta ịdị ngwa nke iwu ahụ, ebe usoro nke abụọ na-ada ka ekele a na-eziga n’akwụkwọ ozi. E debere ihe nwere ike ịbụ nghọta abụọ nke “ụmụnna” kama idozi ya n’isi ederede.
