language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σὺ δὲ νῆφε ἐν πᾶσιν, κακοπάθησον, ἔργον ποίησον εὐαγγελιστοῦ, τὴν διακονίαν σου πληροφόρησον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/005.yaml
  text: But as for you[a], keep a clear head in all things, endure hardship, do the work of an evangelist[c][b], fully carry out your ministry.
translation:
  language: ig
  text: Ma gị onwe gị[a], nwee uche doro anya n'ihe niile, tachie obi n'ihe isi ike[b], rụọ ọrụ onye na-ekwusa ozi ọma, mezuo ozi gị n'uju[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma gị.” Okwu Grik na-emesi “gị” ike ma na-egosi ọdịiche dị n'etiti Timoti na ndị a kpọtụrụ aha tupu ya. A pụkwara ịsụ ya, “nọgidenụ na nche” ma ọ bụ “jide onwe gị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “hụ ahụhụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mezue ozi gị.” Ngwaa Grik pụtara ime ihe ruo n'uju ma ọ bụ ruo na njedebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Ma gị onwe gị
  rationale: ‘Ma’ na-egosi ọdịiche dị n'etiti Timoti na ndị a kọwara n'amaokwu ndị bu ụzọ, ebe ‘gị onwe gị’ na-echekwa nkwusi ike dị na nnọchiaha σὺ.
- source_word: νῆφε
  choice: nwee uche doro anya
  rationale: N'Agba Ọhụrụ, okwu a na-ezo aka n'ịdị na nche nke uche, ijide onwe, na iguzosi ike mgbe nsogbu dị; nsụgharị a na-ezere ime ka ọ dị ka naanị okwu banyere mmanya.
- source_word: ἐν πᾶσιν
  choice: n'ihe niile
  rationale: Nke a na-echekwa obosara nke okwu Grik ma jikọta ya n'ụzọ ebumpụta ụwa na iwu ka uche doo ya anya.
- source_word: κακοπάθησον
  choice: tachie obi n'ihe isi ike
  rationale: Ọ na-egosi ma ịta ahụhụ ma ịnọgide na-eguzosi ike n'ime ya, ọ bụghị nanị na ihe isi ike mere.
- source_word: ἔργον ποίησον
  choice: rụọ ọrụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi nye iwu ahụ, n'enweghị ịgbakwunye echiche na-adịghị na Grik.
- source_word: εὐαγγελιστοῦ
  choice: onye na-ekwusa ozi ọma
  rationale: Nkọwa a na-egosi kpọmkwem onye ọrụ ya bụ ikwusa ozi ọma ma dịkwa mfe nghọta nye ndị na-agụ Igbo nke oge a.
- source_word: τὴν διακονίαν σου
  choice: ozi ije ozi gị
  rationale: N'ọnọdụ a, διακονία bụ ọrụ e nyere Timoti n'ije ozi ozi ọma; ‘ozi ije ozi’ na-egosi ma ọrụ e nyere ya ma ọdịdị ya dịka ije ozi.
- source_word: πληροφόρησον
  choice: rụọzuo
  rationale: Okwu a na-eburu echiche ime ihe ruo n'uju ma ọ bụ ruo na njedebe; ‘rụọzuo’ na-egosipụta nke a n'ụzọ Igbo dị mkpirikpi ma doo anya.
theological_decisions:
- issue: Ụdị ọrụ Timoti dị na διακονία
  choice: ozi ije ozi gị
  alternative: ije ozi gị; ọrụ ije ozi gị
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ọrụ ozi ọma na ọrụ nlekọta e nyere Timoti. Nhọrọ a na-echekwa echiche ahụ n'ebughị ozizi otu ụka pụrụ iche bata.
- issue: Ihe εὐαγγελιστής pụtara
  choice: onye na-ekwusa ozi ọma
  alternative: onye mgbasa ozi ọma; onye nkwusa ozi ọma
  rationale: A họọrọ nkọwa ọrụ ahụ kama utu aha nwere ike inwe nkọwa ụka pụrụ iche, ka isi okwu Grik—onye na-ekwusa ozi ọma—pụta ìhè.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma dị mfe nghọta. E ji ahịrịokwu iwu ndị dị mkpirikpi chekwaa ike nke ndụmọdụ Pọl. A kọwara εὐαγγελιστής dịka ọrụ onye na-ekwusa ozi ọma iji zere utu aha nwere ike ịdị ka nke otu ụka kpọmkwem; a hapụrụ obosara nke ‘n'ihe niile’ ka ọ dị.
