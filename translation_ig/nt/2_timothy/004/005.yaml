  to: Ma gị onwe gị[a], nwee uche doro anya n'ihe niile, tachie obi n'ihe isi ike[b], rụọ ọrụ onye na-ekwusa ozi ọma, mezuo ozi gị n'uju[c].
  rationale: The revision preserves the source’s contrastive emphasis, imperative sequence, and pastoral register. It replaces the duplicated “ozi ije ozi” with the natural contextual term “ozi,” and renders the final imperative as completing that ministry fully. Footnote a is adjusted to remove an unnatural proposed alternative; anchors remain correctly attached to the relevant expressions.
