source:
  edition: SBLGNT
  text: Ἀλέξανδρος ὁ χαλκεὺς πολλά μοι κακὰ ἐνεδείξατο— ⸀ἀποδώσει αὐτῷ ὁ κύριος κατὰ τὰ ἔργα αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/014.yaml
  text: Alexander the metalworker showed me many evils[c][b][a]; the Lord will repay him according to his works.
translation:
  language: ig
  text: Aleksanda, onye na-arụ ọrụ ọla[a], mere m ọtụtụ ihe ọjọọ[b]. Onyenwe anyị ga-akwụghachi ya dị ka ọrụ ndị o mere si dị.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-arụ ọla kọpa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “gosiri m ọtụtụ ihe ọjọọ.”
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ akwụkwọ aka ochie nwere, “Ka Onyenwe anyị kwụghachi ya dị ka ọrụ ndị o mere si dị.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἀλέξανδρος
  choice: Aleksanda
  rationale: A transliteration of the Greek personal name in a form natural and recognizable in Standard Igbo.
- source_word: ὁ χαλκεὺς
  choice: onye na-arụ ọrụ ọla
  rationale: This identifies Alexander broadly as a metalworker without specifying copper or bronze more narrowly than the Greek context warrants.
- source_word: πολλά μοι κακὰ ἐνεδείξατο
  choice: gosiri m ọtụtụ ihe ọjọọ
  rationale: This stays close to the Greek wording, literally conveying that he ‘showed me many evil things,’ while the more idiomatic sense ‘did me much harm’ is retained in a footnote.
- source_word: ἀποδώσει αὐτῷ
  choice: ga-akwụghachi ya
  rationale: The Igbo future construction preserves the future indicative and the sense of recompense or repayment.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: This is the established, dignified Standard Igbo designation for ‘the Lord’ and preserves the definite personal reference.
- source_word: κατὰ τὰ ἔργα αὐτοῦ
  choice: dị ka ọrụ ya si dị
  rationale: This natural Igbo expression closely preserves recompense according to his works or deeds.
theological_decisions:
- issue: Whether ἀποδώσει is a future declaration or a wish/prayer
  choice: Onyenwe anyị ga-akwụghachi ya
  alternative: Ka Onyenwe anyị kwụghachi ya
  rationale: The SBLGNT main text has the future indicative ἀποδώσει, so the main translation states that the Lord will repay him. The variant wish is preserved in a footnote rather than being silently substituted.
translation_notes:
  register: Standard Igbo; natural, current, and dignified. The main text retains the compact Greek imagery while footnotes provide a more idiomatic rendering and the relevant textual variant.
