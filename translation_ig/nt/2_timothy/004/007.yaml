base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/007.yaml
  text: I have fought the good fight[a], I have finished the race, I have kept the faith.
translation:
  language: ig
  text: Alụọla m ọgụ ọma ahụ, emechaala m ọsọ ahụ, edebela m okwukwe ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “edebela m okwukwe,” ma ọ bụ, “anọgidere m n’ikwesị ntụkwasị obi.” Okwu Grik τὴν πίστιν nwere ike ịpụta “okwukwe ahụ,” ya bụ, okwukwe Ndị Kraịst, ma ọ bụ igosi ikwesị ntụkwasị obi mmadụ nọgidere na ya.
    reason: alternative_reading
lexical_decisions:
- source_word: καλὸν ἀγῶνα
  choice: ezi ọgụ ahụ
  rationale: ἀγών na-egosi ọgụ, mgba, ma ọ bụ asọmpi; “ezi ọgụ” bụ okwu Igbo doro anya ma na-edobe ihe atụ nke ọgụ na ịdị mma nke καλός.
- source_word: ἠγώνισμαι
  choice: Alụọla m
  rationale: Ụdị perfect nke ἀγωνίζομαι na-egosi ihe e merechaala nke nsonaazụ ya ka dị; “Alụọla m” na-edobe echiche ahụ ma kwekọọ n’usoro ahịrịokwu atọ ahụ.
- source_word: δρόμον
  choice: ọsọ ahụ
  rationale: δρόμος nwere ike ịbụ ụzọ ịgba ọsọ ma ọ bụ ọsọ a na-agba; “ọsọ ahụ” bụ ụzọ ebumpụta ụwa isi mee ka ihe atụ egwuregwu ahụ doo ndị Igbo anya.
- source_word: τετέλεκα
  choice: agwụchaala m
  rationale: Perfect nke τελέω pụtara iweta ihe ruo n’isi njedebe ya; “agwụchaala m” na-egosi mmezu zuru ezu nke ka nwere mkpa ugbu a.
- source_word: πίστιν
  choice: okwukwe ahụ
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị sụgharị πίστις. Mkpọaha njirimara Grik ahụ na-akwado “okwukwe ahụ,” ma okwu ahụ ka nwere ike ịgụnye echiche nke ịnọgide bụrụ onye kwesịrị ntụkwasị obi.
- source_word: τετήρηκα
  choice: edebela m
  rationale: τηρέω pụtara idebe, ichekwa, ma ọ bụ ịsọpụrụ ihe; “edebela m” na-ahapụ echiche nke idebe na ichekwa ka ha abụọ dị.
theological_decisions:
- issue: Ihe τὴν πίστιν pụtara
  choice: okwukwe ahụ
  alternative: edebela m okwukwe / anọgidewo m bụrụ onye kwesịrị ntụkwasị obi
  rationale: Mkpọaha njirimara ahụ na gburugburu okwu a na-akwado ịghọta ya dị ka okwukwe Ndị Kraịst Pọl debere. Ma πίστις nwekwara ike igosi ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi, ya mere e debere nghọta ndị ahụ n’ala ala peeji kama idozi esemokwu ahụ kpamkpam.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu atọ na perfect aspect site n’iji “-la/-ala”; e jighị okwu ụka nke otu denomination akọwa ihe karịrị ihe Grik kwuru.
