  text: Ὁ ⸀κύριος μετὰ τοῦ πνεύματός σου. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/022.yaml
  text: The Lord be with your spirit[a]. Grace be with you all.
translation:
  language: ig
  text: Ka Onyenwe anyị nọnyere mmụọ gị.[a] Ka amara nọnyere unu niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, okwu ahụ si n’otu onye gbanwee gaa n’ọtụtụ mmadụ: “mmụọ gị” bụ otu onye, ebe “unu niile” bụ ọtụtụ mmadụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha a na-ejikarị asụgharị κύριος n’Agba Ọhụrụ, ọ dabakwara n’usoro ngọzi mmechi akwụkwọ ozi; ọ naghị agbakwụnye aha “Jizọs” ebe Grik ekwughị ya kpọmkwem.
- source_word: μετὰ
  choice: Ka ... nọnyere
  rationale: Ọ bụ ezie na Grik enweghị ngwaa e dere ede, usoro ngọzi a na-egosi ọchịchọ; “Ka ... nọnyere” na-enye nke ahụ n’Igbo n’etinyeghị echiche ọhụrụ.
- source_word: πνεύματός
  choice: mmụọ
  rationale: “Mmụọ” na-ejigide echiche nke mmụọ mmadụ ebe okwu nnọchiaha “gị” na-arụtụ aka n’ime mmadụ Timoti, ọ bụghị ịkpọ Mmụọ Nsọ aha kpọmkwem.
- source_word: σου
  choice: gị
  rationale: E debere ya n’otu onye dịka Grik si dị, n’ihi na akụkụ mbụ na-agwa Timoti okwu n’onwe ya.
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo kwesịrị ekwesị ma nwee ibu okwu okpukpe nke χάρις nwere n’usoro ngọzi Pọl.
- source_word: ὑμῶν
  choice: unu niile
  rationale: “Unu” na-egosi ọtụtụ mmadụ nke ọma; “niile” na-eme ka mgbanwe site n’otu onye gaa n’ọtụtụ mmadụ pụta ìhè n’Igbo.
theological_decisions:
- issue: Onye okwu “Onyenwe anyị” na-arụtụ aka na ya
  choice: A hapụrụ aha ahụ dịka “Onyenwe anyị,” nke n’usoro mmechi akwụkwọ ozi Pọl na-arụtụkarị aka na Jizọs.
  alternative: Ọ pụrụ ịbụ ntụaka sara mbara nye Chineke.
  rationale: Ọnọdụ akwụkwọ ozi na-akwado ntụaka nye Jizọs, ma nsụgharị ahụ etinyeghị “Jizọs” n’ihi na ihe odide Grik ekwughị ya.
- issue: Mgbanwe ọnụ ọgụgụ n’etiti akụkụ abụọ ahụ
  choice: Akụkụ mbụ na-agwa Timoti otu onye okwu; akụkụ nke abụọ na-agọzi ọtụtụ mmadụ.
  alternative: Ịsụgharị akụkụ abụọ ahụ dịka a ga-asị na ha na-agwa naanị Timoti okwu.
  rationale: Grik ji σου nke otu onye mee ihe na mbụ, ma jiri ὑμῶν nke ọtụtụ mmadụ mee ihe n’ikpeazụ; nsụgharị ahụ na nkọwa ala peeji na-echekwa ọdịiche a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. Usoro “Ka ... nọnyere” na-egosipụta ngọzi ma na-agụkwa nke ọma n’Igbo. E tinyere akara nkọwa ala peeji [a] ozugbo n’ebe mgbanwe ọnụ ọgụgụ mbụ metụtara.
