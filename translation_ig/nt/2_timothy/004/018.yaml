  text: ⸀ῥύσεταί με ὁ κύριος ἀπὸ παντὸς ἔργου πονηροῦ καὶ σώσει εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον· ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/018.yaml
  text: The Lord will rescue me from every evil deed and will bring me safely into his heavenly kingdom[a]. To him be the glory forever and ever[c][b]. Amen.
translation:
  language: ig
  text: Onyenwe anyị ga-anapụta m n’ajọ ọrụ ọ bụla, ọ ga-azọpụtakwa m banye n’alaeze ya nke eluigwe.[a] Ka otuto dịrị ya ruo mgbe ebighị ebi.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ọ ga-azọpụta m ma kpọbata m n’alaeze ya nke eluigwe.”'
    reason: lexical_alternative
  - marker: b
    text: 'N’okwu nkịtị: “ruo ọgbọ nke ọgbọ niile.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥύσεταί
  choice: ga-anapụta
  rationale: ‘Ịnapụta’ na-egosipụta iwepụta mmadụ n’ihe egwu ma ọ bụ n’aka ihe ọjọọ, kwekọrọ n’ọrụ ῥύομαι n’ebe a.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: n’aka ajọ ọrụ niile
  rationale: ‘Ajọ ọrụ’ na-edobe obosara ἔργον na ịdị njọ nke πονηρός; ‘niile’ na-enye echiche nkesa nke παντός n’Igbo dị mfe nghọta.
- source_word: σώσει εἰς
  choice: ọ ga-akpọbatakwa m n’udo
  rationale: Nkebi a na-ejikọta nzọpụta/nchekwa na iru ebe a na-aga. ‘Kpọbata ... n’udo’ bụ Igbo nkịtị nke na-egosipụta ma nchebe ma mbata, n’enweghị ahịrịokwu na-adịghị aga were were dịka ‘zọpụta m banye.’
- source_word: εἰς τὴν βασιλείαν αὐτοῦ τὴν ἐπουράνιον
  choice: n’alaeze ya nke eluigwe
  rationale: ‘N’alaeze’ na-egosipụta mbata n’ime ebe a na-aga nke εἰς, ebe ‘nke eluigwe’ na-asụgharị ἐπουράνιον.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a maara nke ọma maka κύριος n’akwụkwọ nsọ, na-egosipụta ikike na nsọpụrụ.
- source_word: ᾧ ἡ δόξα
  choice: Ka otuto dịrị ya
  rationale: Usoro a bụ nkwupụta ofufe; ‘Ka ... dịrị ya’ na-enye ike nke inye Chineke otuto n’Igbo eke.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: ruo mgbe niile ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya nke na-egosipụta ịdịru mgbe ebighị ebi nke akpaalaokwu Grik ahụ.
- source_word: ἀμήν
  choice: Amen
  rationale: E debere okwu ofufe a n’ụdị a na-ejikarị ya n’Igbo.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nnapụta ugbu a na nzọpụta ikpeazụ
  choice: E kewapụtara nnapụta n’aka ajọ ọrụ na ịkpọbata Pọl n’udo n’alaeze eluigwe, n’enweghị nkwa doro anya na ọ gaghị anwụ n’ahụ.
  alternative: Ịghọta ya dịka nkwa na Onyenwe anyị ga-anapụta Pọl n’ọnwụ anụ ahụ.
  rationale: ῥύσεταί na σώσει εἰς τὴν βασιλείαν na-ejikọta nchebe pụọ n’ihe ọjọọ na njedebe nke iru alaeze eluigwe. Nsụgharị ahụ na-edobe esemokwu a kama ikpebi kpọmkwem ụdị nnapụta anụ ahụ Pọl ga-enweta.
translation_notes:
  register: Standard Igbo dị ugbu a, nwee ugwu ma dị mfe nghọta. E ji ‘kpọbata m n’udo’ mee ka σώσει εἰς bụrụ okwu Igbo na-aga were were, ebe nkọwa ala peeji na-edobe nsụgharị nke na-arapara nso n’usoro Grik.
