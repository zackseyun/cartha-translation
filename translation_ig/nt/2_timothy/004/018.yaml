revisions:
- from: Onyenwe anyị ga-anapụta m n’aka ajọ ọrụ niile, ọ ga-akpọbatakwa m n’udo n’alaeze ya nke eluigwe.[a] Ka otuto dịrị ya ruo mgbe niile ebighị ebi.[b] Amen.
  to: Onyenwe anyị ga-anapụta m n’ajọ ọrụ ọ bụla, ọ ga-azọpụtakwa m banye n’alaeze ya nke eluigwe.[a] Ka otuto dịrị ya ruo mgbe ebighị ebi.[b] Amen.
  rationale: The revision restores the explicit saving language of σώσει while preserving εἰς as entrance into the heavenly kingdom. It also renders παντὸς ἔργου πονηροῦ naturally and accurately as ‘every evil deed/work,’ and corrects the literal doxological footnote. It does not resolve the verse into a promise of escape from physical death.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:26:49Z'
review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. ‘N’aka ajọ ọrụ niile’ is less idiomatic for ἀπὸ παντὸς ἔργου πονηροῦ and can suggest ‘from the hands of evil works’; ‘n’ajọ ọrụ ọ bụla’ directly renders ‘from every evil deed/work.’ More importantly, ‘ọ ga-akpọbatakwa m n’udo’ replaces σώσει (‘will save’) with ‘bring in peace’ and adds ‘peace,’ which is not stated in the Greek. The revision retains both rescue/deliverance and salvation, as well as entrance into the heavenly kingdom.
  naturalness: The revised wording uses standard, modern Igbo. ‘Ga-azọpụtakwa m banye’ is an intelligible serial-verb construction that preserves the Greek salvation-plus-entrance sense without the added concept ‘n’udo.’ ‘Ruo mgbe ebighị ebi’ is the customary natural rendering of the doxological idiom.
  terminology: '‘Onyenwe anyị,’ ‘alaeze ya nke eluigwe,’ ‘otuto,’ and ‘Amen’ are appropriate in Standard Igbo and maintain a reverent biblical register. The literal note is corrected: αἰῶνας τῶν αἰώνων is ‘ages of ages,’ not ‘all generations of all generations.’'
  issues:
  - severity: medium
    issue: The rendering of σώσει εἰς omits ‘will save’ and introduces ‘in peace.’
    rationale: ‘Ọ ga-akpọbatakwa m n’udo’ communicates safe arrival but does not represent σώσει’s salvation language, while ‘n’udo’ has no explicit Greek counterpart.
  - severity: medium
    issue: ‘N’aka ajọ ọrụ niile’ is semantically awkward for ‘from every evil deed.’
    rationale: The idiom n’aka most naturally means ‘from the hand/power of,’ whereas ἔργου πονηροῦ denotes an evil deed/work. ‘N’ajọ ọrụ ọ bụla’ is both natural and closer to the source.
  - severity: low
    issue: The literal footnote for the eternal-age idiom is inaccurate.
    rationale: The source says literally ‘to the ages of ages’; the existing ‘ọgbọ niile nke ọgbọ niile’ changes the singular ‘ages’ construction and is not a clear literal equivalent.
  revised_text: Onyenwe anyị ga-anapụta m n’ajọ ọrụ ọ bụla, ọ ga-azọpụtakwa m banye n’alaeze ya nke eluigwe.[a] Ka otuto dịrị ya ruo mgbe ebighị ebi.[b] Amen.
  revised_footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ọ ga-azọpụta m ma kpọbata m n’alaeze ya nke eluigwe.”'
    reason: lexical_alternative
  - marker: b
    text: 'N’okwu nkịtị: “ruo ọgbọ nke ọgbọ niile.”'
    reason: lexical_alternative
  revision_rationale: The revision restores the explicit saving language of σώσει while preserving εἰς as entrance into the heavenly kingdom. It also renders παντὸς ἔργου πονηροῦ naturally and accurately as ‘every evil deed/work,’ and corrects the literal doxological footnote. It does not resolve the verse into a promise of escape from physical death.
