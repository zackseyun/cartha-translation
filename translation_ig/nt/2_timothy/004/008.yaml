revisions:
- from: Site ugbu a, e debeere m okpueze nke ezi omume[a], nke Onyenweanyị, Onyeikpe ezi omume, ga-enye m n’ụbọchị ahụ—ọ bụghịkwa naanị m, kama ọ ga-enye ya ndị niile hụrụ mpụta ya n’anya.
  to: Site ugbu a gawa, e debeere m okpueze nke ezi omume[a], nke Onyenweanyị, Onyeikpe ezi omume, ga-enye m n’ụbọchị ahụ—ọ bụghịkwa naanị m ka ọ ga-enye ya, kama ọ ga-enyekwa ndị niile hụrụ ọdịpụta ya n’anya.
  rationale: The revision retains the draft’s faithful rendering and its preservation of the ambiguity in “okpueze nke ezi omume.” It improves the temporal idiom, clarifies that the same crown is awarded both to Paul and to all the others named, and uses “ọdịpụta” to reflect the sense of ἐπιφάνεια as appearing or manifestation. The footnote anchor and lexical alternative are retained unchanged.
  reviewer_model: gpt-5.6-terra
