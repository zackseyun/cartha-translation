id: 2TI.4.8
reference: 2 Timothy 4:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λοιπὸν ἀπόκειταί μοι ὁ τῆς δικαιοσύνης στέφανος, ὃν ἀποδώσει μοι ὁ κύριος ἐν ἐκείνῃ τῇ ἡμέρᾳ, ὁ δίκαιος κριτής, οὐ μόνον δὲ ἐμοὶ ἀλλὰ καὶ πᾶσιν τοῖς ἠγαπηκόσι τὴν ἐπιφάνειαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/008.yaml
  text: From now on the crown of righteousness is laid up for me[a], which the Lord, the righteous judge, will award to me on that day—and not only to me, but also to all who have loved his appearing.
translation:
  language: ig
  text: Site ugbu a gawa, e debeere m okpueze nke ezi omume[a], nke Onyenweanyị, Onyeikpe ezi omume, ga-enye m n’ụbọchị ahụ—ọ bụghịkwa naanị m ka ọ ga-enye ya, kama ọ ga-enyekwa ndị niile hụrụ ọdịpụta ya n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okpueze nke ikpe ziri ezi.” Okwu Grik a nwere ike ịpụta “ezi omume” ma ọ bụ, n’ọnọdụ ụfọdụ, “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λοιπὸν
  choice: Site ugbu a
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ihe fọdụrụ na-echere Pọl mgbe ọ gbasịrị ọsọ ya ruo ọgwụgwụ; ‘Site ugbu a’ na-egosipụta oge ahụ n’Igbo nkịtị.
- source_word: ἀπόκειταί
  choice: e debeere m
  rationale: Ngwaa a pụtara na e tinyela ihe n’akụkụ ma debe ya maka mmadụ; ntụgharị a na-echekwa echiche nke ihe a kwadebere ma debe.
- source_word: ὁ τῆς δικαιοσύνης στέφανος
  choice: okpueze nke ezi omume
  rationale: Nke a na-esochi njikọ genitive Grik ahụ n’enweghị ịkọwapụta ma okpueze ahụ bụ ụgwọ ọrụ maka ezi omume, ihe mejupụtara ya bụ ezi omume, ma ọ bụ ihe metụtara ikpe ziri ezi.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: ‘Ezi omume’ bụ ụzọ doro anya na nke a na-anụkarị e si akọwa δικαιοσύνη n’Igbo; a hapụrụ ‘ikpe ziri ezi’ dịka nhọrọ ọzọ n’ala ala peeji.
- source_word: ἀποδώσει
  choice: ga-enye m
  rationale: N’Igbo, ‘ga-enye’ na-egosi na Onyeikpe ga-enye ihe ruru mmadụ, ma zere itinye echiche ntaramahụhụ nke ụfọdụ okwu maka ịkwụghachi nwere ike iweta.
- source_word: κύριος
  choice: Onyenweanyị
  rationale: Aha a na-asụgharị κύριος n’ụzọ ọdịnala ma dị ùgwù; n’ebe a ọ na-arụtụ aka n’Onyenweanyị dịka Onyeikpe n’ụbọchị ikpeazụ.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: n’ụbọchị ahụ
  rationale: Nke a bụ okwu oge dị mma n’Igbo ma na-echekwa ntụaka banyere ụbọchị ikpeazụ.
- source_word: ὁ δίκαιος κριτής
  choice: Onyeikpe ezi omume
  rationale: Nkebi a na-akọwa àgwà Onyenweanyị mgbe ọ na-ekpe ikpe, ma na-echekwa njikọ ya na δικαιοσύνη.
- source_word: πᾶσιν τοῖς ἠγαπηκόσι
  choice: ndị niile hụrụ ... n’anya
  rationale: Ụdị a na-egosi ịhụnanya ha nwere ma nọgide na-enwe, kwekọrọ n’ike perfect participle nke Grik.
- source_word: ἐπιφάνειαν
  choice: mpụta
  rationale: ‘Mpụta’ na-egosi igosipụta onwe ya n’ihu mmadụ, n’enweghị ime ka okwu ahụ bụrụ naanị ‘ọbịbịa.’
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha a na-alaghachi n’ebe Onyenweanyị nọ dịka n’ederede Grik, ma mee ka ahịrịokwu ahụ na-aga nke ọma.
theological_decisions:
- issue: Ihe ‘okpueze nke ezi omume’ pụtara
  choice: E debere njikọ genitive ahụ dịka ‘okpueze nke ezi omume’ n’akọwaghị ya karịa.
  alternative: Okpueze a na-enye n’ihi ezi omume; okpueze nke bụ ezi omume; ma ọ bụ okpueze nke ikpe ziri ezi/nkwado ikpe.
  rationale: Grik nwere ike ibu nke ọ bụla n’ime echiche ndị a; ya mere, ntụgharị ahụ anaghị ekpebi ihe ederede ahụ na-ekpebighị.
- issue: Onye ‘Onyenweanyị’ na-ezo aka na ya
  choice: E debere naanị aha ‘Onyenweanyị’; ihe gbasara ‘mpụta ya’ n’akwụkwọ ndị a na-arụtụ aka na Jizọs Kraịst.
  alternative: Chineke n’ozuzu ya.
  rationale: Ọnọdụ okwu ahụ na-akwado na ọ bụ Kraịst, ma ịgbakwunye ‘Jizọs’ n’ederede bụ ịkọwapụta karịa okwu Grik n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Okpueze’ na-echekwa ihe atụ nke ihe mmeri; ‘mpụta’ na-echekwa ọdịiche dị n’etiti igosipụta onwe ya na naanị ọbịbịa. Akara ala ala peeji [a] dị n’ederede isi.
