revisions:
- from: Mgbe ị na-abịa, wetara m akwa mgbokwasị[a] ahụ m hapụrụ n'aka Kapọs na Troas, tinyekwa akwụkwọ[b] ndị ahụ, karịsịa akwụkwọ akpụkpọ anụ ndị ahụ.
  to: Mgbe ị bịara, wetara m uwe mgbokwasị[a] ahụ m hapụrụ n’aka Kapọs n’obodo Troas, tinyekwa akwụkwọ[b] ndị ahụ, karịsịa akwụkwọ akpụkpọ anụ ndị ahụ.
  rationale: The revision preserves the Greek meaning and its lexical uncertainty while improving Standard Igbo precision. “Mgbe ị bịara” naturally renders the adverbial participle in a request concerning a future visit. The placement “n’aka Kapọs n’obodo Troas” retains both παρά with the dative (‘with/in the care of Carpus’) and the location in Troas. Footnote markers remain anchored to the terms they explain.
