  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸν φαιλόνην, ὃν ⸀ἀπέλιπον ἐν Τρῳάδι παρὰ Κάρπῳ, ἐρχόμενος φέρε, καὶ τὰ βιβλία, μάλιστα τὰς μεμβράνας.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/013.yaml
  text: When you come[a], bring the cloak that I left in Troas with Carpus, and the books[b], especially the parchments.
translation:
  language: ig
  text: Mgbe ị bịara, wetara m uwe mgbokwasị[a] ahụ m hapụrụ n’aka Kapọs n’obodo Troas, tinyekwa akwụkwọ[b] ndị ahụ, karịsịa akwụkwọ akpụkpọ anụ ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ndị na-aghọta okwu a dị ka akpa ma ọ bụ ihe e ji ekpuchi akwụkwọ, ma ihe okwu Grik ahụ na-apụtakarị bụ uwe mgbokwasị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “akwụkwọ mpịakọta”; okwu Grik ahụ nwere ike izo aka n’akwụkwọ mpịakọta e dere ede ma ọ bụ n’ihe ndị yiri ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: φαιλόνην
  choice: akwa mgbokwasị
  rationale: Okwu Grik a na-apụtakarị uwe elu a na-eyikwasị n’ahụ, ya bụ cloak. “Akwa mgbokwasị” bụ okwu Igbo doro anya ma ghara ịkọwa ya dị ka akpa akwụkwọ.
- source_word: ἀπέλιπον
  choice: m hapụrụ
  rationale: Aorist active indicative onye mbụ n’otu; “m hapụrụ” na-enye ihe okwu ahụ pụtara n’ụzọ Igbo nkịtị.
- source_word: παρὰ Κάρπῳ
  choice: n'aka Kapọs
  rationale: παρά na dative ebe a na-egosi na ihe ahụ dị n’aka onye ahụ ma ọ bụ n’ụlọ ya. “N'aka Kapọs” na-egosi na ọ nọ n’elekọta ya n’enweghị ịgbakwụnye nkọwa a na-ejighị n’aka.
- source_word: ἐρχόμενος
  choice: Mgbe ị na-abịa
  rationale: Participle a na-arụ ọrụ oge n’ihe metụtara iwu φέρε; nsụgharị a bụ Igbo eke ma na-edobe njikọ oge ahụ.
- source_word: φέρε
  choice: wetara m
  rationale: Imperative nke φέρω na-arịọ Timoti ka o butere Pọl ihe ndị ahụ. Ịtinye “m” na-eme ka okwu ahụ bụrụ Igbo eke; onye a ga-ewetara ha pụtara ìhè n’ọnọdụ okwu ahụ.
- source_word: τὰ βιβλία
  choice: akwụkwọ ndị ahụ
  rationale: βιβλία nwere ike ịbụ akwụkwọ ma ọ bụ akwụkwọ mpịakọta. “Akwụkwọ” bụ okwu sara mbara nke na-adịghị ekpebi ọdịdị ha, ebe e debere nhọrọ “akwụkwọ mpịakọta” n’okpuru ederede.
- source_word: μάλιστα
  choice: karịsịa
  rationale: Okwu a na-emesi ihe so ya ike; “karịsịa” bụ ụzọ Igbo doro anya e si egosi nke ahụ.
- source_word: τὰς μεμβράνας
  choice: akwụkwọ akpụkpọ anụ ndị ahụ
  rationale: μεμβράνα na-ezo aka n’ihe e ji akpụkpọ anụ a kwadebere ede ihe, ma eleghị anya ihe odide dị n’akpụkpọ anụ. Nsụgharị a na-akọwa ihe ahụ nke ọma n’Igbo ma ghara ikwu na ha bụ akwụkwọ ndetu.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara [a] n’ebe “akwa mgbokwasị” dị na [b] n’ebe “akwụkwọ” dị ka nkọwa ha si metụta okwu ndị ahụ kpọmkwem; nke a na-edozi ntụgharị akara ndị na-adabaghị n’English consultation layer.
