    rationale: “ebe ntị ha na-achọ ịnụ ihe ga-atọ ha ụtọ” explains the implication of the idiom, but κνηθόμενοι τὴν ἀκοήν literally retains the vivid image of itching hearing/ears. The explanatory sense should be kept in the footnote.
  - severity: low
    issue: Term for teachers is potentially ambiguous.
    rationale: “Ndị ozizi” may be read in relation to ‘teachings’; “ndị nkuzi” is the clearer Standard Igbo noun for people who teach.
