id: 2TI.4.3
reference: 2 Timothy 4:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔσται γὰρ καιρὸς ὅτε τῆς ὑγιαινούσης διδασκαλίας οὐκ ἀνέξονται, ἀλλὰ κατὰ τὰς ⸂ἰδίας ἐπιθυμίας⸃ ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους κνηθόμενοι τὴν ἀκοήν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/003.yaml
  text: For the time will come when they will not put up with sound teaching[a], but according to their own desires they will heap up teachers for themselves[b], having itching ears.
translation:
  language: ig
  text: N’ihi na oge ga-abịa mgbe ha na-agaghị anagide ozizi ahụ dị mma[a]; kama, dịka ọchịchọ nke aka ha si dị, ha ga-akpọkọtara onwe ha ndị nkuzi, ebe ntị ha na-agụ ha ọkọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ozizi ahụ ziri ezi,” ma ọ bụ “ozizi ahụ na-enye ahụ ike.”'
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “ntị ha na-agụ ha ọkọ.” Ihe oyiyi a na-egosi agụụ ịnụ naanị ihe ha chọrọ ịnụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρὸς
  choice: oge
  rationale: “Oge” bụ okwu Igbo doro anya maka oge ma ọ bụ ọnọdụ a kara aka nke ga-abịa.
- source_word: τῆς ὑγιαινούσης διδασκαλίας
  choice: ozizi ahụ dị mma
  rationale: Nke a na-egosipụta ihe atụ nke ozizi na-enye ahụ ike, ya bụ ozizi ziri ezi ma baa uru, n’asụsụ Igbo dị mfe nghọta.
- source_word: οὐκ ἀνέξονται
  choice: ha na-agaghị anagide
  rationale: “Ịnagide” na-egosipụta ịtachi obi ma ọ bụ ikwe ka ihe dịrị, kwekọrọ n’ἀνέχομαι.
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας
  choice: dịka ọchịchọ nke aka ha si dị
  rationale: Nke a na-edobe echiche na ọchịchọ nke ha onwe ha bụ ihe na-achị nhọrọ ha, na-enweghị ime ἐπιθυμίαι ka ọ bụrụ naanị agụụ mmekọahụ.
- source_word: ἑαυτοῖς ἐπισωρεύσουσιν διδασκάλους
  choice: ha ga-akwụkọtara onwe ha ọtụtụ ndị ozizi
  rationale: “Kwụkọtara” na-echekwa ihe oyiyi nke ịchịkọta ihe n’ụba; “ọtụtụ” na-eme ka echiche nke ikpokọta n’oke doo anya n’Igbo.
- source_word: κνηθόμενοι τὴν ἀκοήν
  choice: ebe ntị ha na-achọ ịnụ ihe ga-atọ ha ụtọ
  rationale: 'Nke a na-akọwa ilu Grik ahụ n’Igbo eke: agụụ ịnụ ihe masịrị ha. “Ebe” na-echekwa njikọ participle ahụ n’emeghị ka ọ bụrụ naanị ihe kpatara omume ahụ.'
theological_decisions:
- issue: Otú e si sụgharịa διδασκαλία n’akwụkwọ ozi ndị pastọ
  choice: ozizi
  alternative: nkuzi
  rationale: “Ozizi” na-ekpuchi ntụziaka a na-akụzi ma dabara n’okwu gbasara eziokwu okwukwe, na-enweghị itinye ozizi pụrụ iche nke otu ụka.
- issue: Ike nke κνηθόμενοι τὴν ἀκοήν
  choice: ebe ntị ha na-achọ ịnụ ihe ga-atọ ha ụtọ
  alternative: n’ihi na ntị ha na-agụ ha ọkọ
  rationale: Nhọrọ ahụ na-eme ka ilu ahụ ghọta nke ọma n’Igbo ma na-ezere ime participle ahụ ka ọ bụrụ causal n’ụzọ doro anya karịa Grik.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ndị ozizi” mee ihe maka ndị na-akụzi ihe; e kọwara ilu gbasara ntị n’isiokwu ahụ, ma debe nsụgharị nkịtị ya n’ala ala peeji.
