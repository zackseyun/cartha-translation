id: 2TI.4.11
reference: 2 Timothy 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λουκᾶς ἐστιν μόνος μετ’ ἐμοῦ. Μᾶρκον ἀναλαβὼν ἄγε μετὰ σεαυτοῦ, ἔστιν γάρ μοι εὔχρηστος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/011.yaml
  text: Luke alone is with me. Pick up Mark and bring him with you, for he is useful to me for ministry.
translation:
  language: ig
  text: Naanị Luk nọnyere m. Were Mak soro gị bịa, n’ihi na ọ na-abara m uru n’ije ozi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ọrụ.” Okwu Grik ahụ, διακονία, nwekwara ike ịpụta ọrụ n’ụzọ sara mbara, ọ bụ ezie na n’ebe a o yiri ka ọ na-ezo aka n’ọrụ ije ozi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λουκᾶς
  choice: Luk
  rationale: Ụdị e si ede aha Luke n’Igbo n’ụzọ dị mfe ma bụrụkwa nke ndị na-agụ Akwụkwọ Nsọ maara.
- source_word: μόνος
  choice: naanị
  rationale: Ọ na-egosi na Luk bụ naanị onye ya na Pọl nọ n’oge ahụ.
- source_word: μετ’ ἐμοῦ
  choice: nọnyere m
  rationale: Nke a na-egosi iso mmadụ nọrọ, ma ọ bụ ịnọ n’akụkụ ya, n’Igbo dị ndụ.
- source_word: Μᾶρκον
  choice: Mak
  rationale: Ụdị e si ede aha Mark n’Igbo n’ụzọ a maara nke ọma.
- source_word: ἀναλαβὼν
  choice: Kpọrọ Mak
  rationale: Ọ na-egosi ịkpọrọ Mak ma were ya soro n’ụzọ tupu e kpọta ya.
- source_word: ἄγε
  choice: kpọtakwa ya
  rationale: Iwu a pụtara ịkpọta Mak; e tinyere ‘ya’ ka onye a na-ekwu maka ya doo anya n’Igbo.
- source_word: μετὰ σεαυτοῦ
  choice: ka o soro gị bịa
  rationale: Nke a na-egosi na Mak ga-eso Timoti bịa.
- source_word: εὔχρηστος
  choice: ọ na-abara m uru
  rationale: Ọ bụ ụzọ Igbo si ekwu na mmadụ bara uru ma ọ bụ na-enye aka nke ọma, n’enweghị ụda nke ile mmadụ anya dịka ngwa ọrụ.
- source_word: γάρ μοι
  choice: n’ihi na ọ na-abara m uru
  rationale: ‘N’ihi na’ na-eweta ihe kpatara iwu ahụ, ebe ‘m’ na-egosi na uru ahụ metụtara Pọl.
- source_word: εἰς διακονίαν
  choice: n’ije ozi
  rationale: ‘Ije ozi’ dabara n’ọrụ ozi Pọl na-ekwu maka ya, ma ọ naghị eme ka okwu ahụ bụrụ aha ọkwa pụrụ iche.
theological_decisions:
- issue: Ihe διακονία pụtara n’okwu Pọl banyere uru Mak bara
  choice: ije ozi
  alternative: ọrụ enyemaka ma ọ bụ ọrụ n’ozuzu
  rationale: N’ọnọdụ a, okwu ahụ yiri ka ọ na-ezo aka n’ọrụ ozi ha na-arụ. Otú ọ dị, okwu Grik ahụ nwekwara ike ịpụta ọrụ ma ọ bụ enyemaka n’ụzọ sara mbara; e debere nke a n’okpuru peeji ka a ghara imechi nghọta ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nkwusiri ike dị na ‘naanị,’ usoro ịkpọrọ Mak na ịkpọta ya, nakwa ihe kpatara iwu ahụ. Akara nkọwa [a] dị n’isiokwu ahụ dịka achọrọ.
