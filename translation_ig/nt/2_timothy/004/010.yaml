id: 2TI.4.10
reference: 2 Timothy 4:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Δημᾶς γάρ με ⸀ἐγκατέλιπεν ἀγαπήσας τὸν νῦν αἰῶνα, καὶ ἐπορεύθη εἰς Θεσσαλονίκην, Κρήσκης εἰς Γαλατίαν, Τίτος εἰς Δαλματίαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/010.yaml
  text: For Demas deserted me[a], having loved the present age, and went to Thessalonica; Crescens to Galatia, Titus to Dalmatia.
translation:
  language: ig
  text: N’ihi na Demas agbahapụla m, ebe ọ hụrụ oge dị ugbu a[a] n’anya, wee gaa Tesalonaịka; Kresens gara Galetia, Taịtọs agakwa Dalmatia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụwa nke ugbu a.” N’asụsụ Grik, okwu ahụ na-ezo kpọmkwem karị n’oge ma ọ bụ n’ọgbọ dị ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta ihe a na arịrịọ dị n’amaokwu bu ụzọ ma gosi ihe mere Pọl ji rịọ ka Timoti bịa.
- source_word: ἐγκατέλιπεν
  choice: agbahapụla m
  rationale: “Ịgbahapụ” na-egosi na Demas hapụrụ Pọl n’ụzọ dị njọ ma ọ bụ nke na-ekwesịghị ntụkwasị obi, ma ọ naghị ekwu hoo haa na ọ hapụrụ okwukwe.
- source_word: ἀγαπήσας
  choice: ebe ọ hụrụ … n’anya
  rationale: Nhazi a na-edobe njikọ dị n’etiti ịhụ oge dị ugbu a n’anya na ịgbahapụ Pọl, ma ọ naghị eme ka njikọ ahụ bụrụ ihe kpatara ya n’ụzọ siri ike karịa Grik.
- source_word: τὸν νῦν αἰῶνα
  choice: oge dị ugbu a
  rationale: “Oge” na-egosipụta echiche temporal na moral nke αἰών nke ọma karịa okwu ga-apụta naanị ụwa a na-ahụ anya.
- source_word: ἐπορεύθη
  choice: wee gaa
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi kọwaa njem ya n’enweghị ịgbakwunye otú o si gaa.
- source_word: Θεσσαλονίκην
  choice: Tesalonaịka
  rationale: Ụdị mkpọgharị aha obodo a dabara n’usoro mkpụrụokwu Igbo.
- source_word: Κρήσκης
  choice: Kresens
  rationale: Ụdị mkpọgharị aha onye ahụ dabara n’usoro mkpụrụokwu Igbo.
- source_word: Γαλατίαν
  choice: Galeshia
  rationale: Ụdị aha mpaghara ahụ a na-aghọta n’Igbo.
- source_word: Τίτος
  choice: Taịtọs
  rationale: Ụdị mkpọgharị aha onye ahụ dabara n’usoro mkpụrụokwu Igbo.
- source_word: Δαλματίαν
  choice: Dalmatia
  rationale: Ụdị mkpọgharị aha mpaghara ahụ nke na-edobe aha Grik anya.
theological_decisions:
- issue: Ma a ga-asụgharị ọpụpụ Demas dị ka ịhapụ okwukwe kpamkpam, ka ọ bụ ịgbahapụ Pọl
  choice: “agbahapụla m” na-egosi ịdị njọ nke omume ahụ n’ekwughị na Demas hapụrụ okwukwe kpamkpam.
  alternative: Ịsụgharị ya n’ụzọ ga-ekwu kpọmkwem na Demas jụrụ okwukwe.
  rationale: Amaokwu ahụ kwuru kpọmkwem na Demas gbahapụrụ Pọl n’ihi njikọ ya na oge dị ugbu a, ma o kwughị hoo haa na ọ dapụrụ n’okwukwe ruo mgbe ebighị ebi.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ugwu ma dị mfe nghọta. E debere ahịrịokwu mkpirikpi nke na-edepụta ebe ndị ọzọ gara, dịka ọ dị na Grik; “agakwa” na-eme ka ngwaa a na-aghọta anya n’akụkụ ikpeazụ.
