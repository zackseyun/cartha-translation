id: 2TI.4.17
reference: 2 Timothy 4:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ κύριός μοι παρέστη καὶ ἐνεδυνάμωσέν με, ἵνα δι’ ἐμοῦ τὸ κήρυγμα πληροφορηθῇ καὶ ⸀ἀκούσωσιν πάντα τὰ ἔθνη, καὶ ἐρρύσθην ἐκ στόματος λέοντος.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/017.yaml
  text: But the Lord stood by me and strengthened me[a], so that through me the proclamation might be fully accomplished and all the Gentiles might hear[b], and I was rescued from the lion’s mouth.
translation:
  language: ig
  text: Ma Onyenwe anyị guzoro n'akụkụ m ma nye m ike, ka nkwusa ahụ wee rụzuo n'ụzọ zuru ezu site n'aka m, ka mba niile wee nụ ya[a]. A napụtakwara m n'ọnụ ọdụm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị mba ọzọ.” Okwu Grik ἔθνη nwere ike ịpụta “mba” ma ọ bụ “ndị mba ọzọ”; n'ebe a, o yikarịrị ka ọ na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ, bụ́ ndị ga-anụ ozi ọma.
    reason: lexical_alternative
  - marker: b
    text: Okwu ahụ bụ “n'ọnụ ọdụm” nwere ike ịbụ ihe atụ nke a napụtara mmadụ n'oké ihe ize ndụ, kama ịbụ okwu banyere ọdụm nkịtị.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ κύριός
  choice: Ma Onyenwe anyị
  rationale: “Onyenwe anyị” bụ ụzọ Igbo a na-ejikarị asụ κύριος n'ụzọ dị nsọ; “Ma” na-egosi ọdịiche dị n'amaokwu bu ụzọ.
- source_word: μοι παρέστη
  choice: guzoro n'akụkụ m
  rationale: Nke a na-egosi na Onyenwe anyị bịara nyere Pọl aka, ọ bụghị naanị na ọ nọ ya nso n'ebe ahụ.
- source_word: ἐνεδυνάμωσέν με
  choice: nye m ike
  rationale: Ọ bụ okwu Igbo dị mfe ma dị ebube nke na-egosi ime ka mmadụ sie ike ma ọ bụ inye ya ikike.
- source_word: ἵνα δι’ ἐμοῦ
  choice: ka e wee site n'aka m
  rationale: Ọ na-echekwa echiche nzube nke ἵνα na ọrụ onye e ji mee ihe nke διά ya na genitive.
- source_word: τὸ κήρυγμα πληροφορηθῇ
  choice: kwusaa ozi ahụ n'ụzọ zuru ezu
  rationale: Nke a na-ejikọta ihe κήρυγμα bụ—ozi a na-ekwusa—na echiche πληροφορηθῇ nke ime ka nkwusa ahụ ruozuo oke, n'ejighị nkọwa siri ike nke ga-emechi mgbagwoju anya okwu ahụ nwere.
- source_word: πάντα τὰ ἔθνη
  choice: ndị mba ọzọ niile
  rationale: N'ọnọdụ ozi Pọl, okwu a yikarịrị ka ọ na-ezo aka n'ebe ndị na-abụghị ndị Juu nọ; a debere “mba niile” dịka ụzọ ọzọ na ndetu ala.
- source_word: ἐρρύσθην
  choice: A napụtakwara m
  rationale: “Napụta” na-egosi nzọpụta pụọ n'ihe ize ndụ ma kwekọọ n'olu dị nsọ nke amaokwu ahụ.
- source_word: ἐκ στόματος λέοντος
  choice: n'ọnụ ọdụm
  rationale: A hapụrụ ihe oyiyi Grik ahụ n'ụzọ nkịtị ka nsụgharị ghara ikpebi ma ọ bụ ọdụm nkịtị, Nero, Setan, ma ọ bụ ihe atụ nke ihe ize ndụ ọnwụ.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya
  choice: A sụgharịrị ya naanị dịka “Onyenwe anyị.”
  alternative: Jizọs kpọmkwem, ma ọ bụ Chineke n'ozuzu ya
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu nwere ike ime ka a ghọta ya dịka Jizọs Kraịst, ma ederede ahụ akọwaghị ya kpọmkwem; ya mere nsụgharị ahụ echekwala okwu isi mmalite.
- issue: Ihe “n'ọnụ ọdụm” pụtara
  choice: A hapụrụ ya dịka ihe oyiyi nke ịbụ onye a napụtara n'oké ihe ize ndụ.
  alternative: Nero; Setan; ma ọ bụ ọnwụ site n'anụ ọhịa nkịtị
  rationale: Ederede ahụ ekpebighị n'etiti nkọwa ndị a, ya mere a gaghị etinye otu nkọwa n'ime isi ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E jiri “Onyenwe anyị” mee κύριος, ma zere itinye aha onye okwu ahụ na-ezo aka na ya. A tụgharịrị nkebiokwu ogologo Grik ahụ ka ọ bụrụ ahịrịokwu abụọ maka ịdị mfe ọgụgụ, na-echekwakwa njikọ echiche ya. Akara ndetu [a] na [b] pụtara n'isi ederede ma kwekọọ na ndetu ala.
