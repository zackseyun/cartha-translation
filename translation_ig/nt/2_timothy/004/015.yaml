id: 2TI.4.15
reference: 2 Timothy 4:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν καὶ σὺ φυλάσσου, λίαν γὰρ ⸀ἀντέστη τοῖς ἡμετέροις λόγοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/015.yaml
  text: You also must beware of him[a], for he strongly opposed our words.
translation:
  language: ig
  text: Gị kwa, chezie onwe gị n’aka ya, n’ihi na o megidere okwu anyị nke ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ozi anyị” ma ọ bụ “ozizi anyị.” N’asụsụ Grik, ọ bụ “okwu anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’Alexander a kpọrọ aha n’amaokwu bu ụzọ; “ya” bụ ụzọ Igbo si ekwu ya n’enweghị ịkpọghachi aha ahụ.
- source_word: καὶ σὺ
  choice: Gị onwe gị kwesịkwara
  rationale: “Gị onwe gị” na-egosipụta nkwusi ike dị na σὺ, ebe “-kwa” na-echekwa echiche nke καὶ, ya bụ na Timoti ga-akpacharakwa anya dịka Pọl.
- source_word: φυλάσσου
  choice: ịkpachara anya maka ya
  rationale: Iwu dị n’ụdị present middle na-akpọ Timoti ka ọ nọgide na-eche onwe ya nche. Akpaokwu a bụ Igbo eke ma na-ebute ike ịdọ aka ná ntị ahụ.
- source_word: λίαν
  choice: nke ukwuu
  rationale: Akpaokwu a na-eme ka ike nke mmegide ahụ pụta ìhè, kwekọọ na λίαν.
- source_word: ἀντέστη
  choice: o guzogidere
  rationale: “Guzogidere” na-egosipụta mmadụ iguzosi ike megide ihe, ma nọkwa nso n’echiche nkịtị nke ἀνθίστημι.
- source_word: τοῖς ἡμετέροις λόγοις
  choice: okwu anyị
  rationale: Nke a na-anọ nso n’asụsụ Grik ma hapụ ka ihe “okwu” ndị ahụ kpọmkwem pụtara nọgide na-enweghị imechi ya ịbụ naanị ozi ọma, ozizi, ma ọ bụ akaebe n’ụlọikpe.
theological_decisions:
- issue: Ihe “okwu anyị” gbasara
  choice: okwu Pọl na ndị ya kwuru, n’akọwaghị ma ha bụ akaebe, ozi, ma ọ bụ ozizi kpọmkwem
  alternative: akaebe anyị n’ụlọikpe; ozi anyị; ozizi anyị
  rationale: Akpaokwu Grik ahụ akọwaghị ọnọdụ ma ọ bụ ụdị okwu ahụ kpọmkwem. Ya mere, “okwu anyị” na-echekwa obosara na enweghị nkọwa doro anya nke ihe odide mbụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma doo ndị nkịtị anya. E ji “Gị onwe gị” chekwaa nkwusi ike, jiri “ịkpachara anya maka ya” mee ka iwu ahụ daa n’ụzọ Igbo eke.
