  text: Ἄσπασαι Πρίσκαν καὶ Ἀκύλαν καὶ τὸν Ὀνησιφόρου οἶκον.
base_translation:
  language: en
  yaml_path: translation/nt/2_timothy/004/019.yaml
  text: Greet Prisca and Aquila[a], and the household of Onesiphorus.
translation:
  language: ig
  text: Kelee Priska na Akwila[a], na ndị ezinụlọ Onesifọrọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, aha ahụ bụ “Priska”; n’ebe ndị ọzọ, a na-akpọkwa ya “Priskila” (dịka ọmụmaatụ, Ọrụ Ndịozi 18:2, 18, 26).
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄσπασαι
  choice: Kelee
  rationale: Ọ bụ iwu e nyere otu onye ka o zie ekele; “Kelee” bụ ụzọ Igbo dị mfe ma kwekọọ n’ike iwu ahụ, n’etinyeghị mmetụta ọzọ na-adịghị n’okwu Grik.
- source_word: Πρίσκαν
  choice: Priska
  rationale: E depụtara aha ahụ n’ụdị Πρίσκαν n’ebe a; “Priska” bụ ntụgharị mkpụrụedemede ya kpọmkwem karịa iji ụdị aha ọzọ bụ Priskila.
- source_word: Ἀκύλαν
  choice: Akwila
  rationale: Nke a bụ ntụgharị aha Ἀκύλας n’usoro mkpọpụta na odide Igbo.
- source_word: τὸν Ὀνησιφόρου οἶκον
  choice: ndị ezinụlọ Onesifọrọs
  rationale: N’okwu ekele a, οἶκος na-ezo aka n’ìgwè ndị nọ n’ezinụlọ ma ọ bụ n’ụlọ mmadụ, ọ bụghị naanị ụlọ e wuru. “Ndị ezinụlọ” na-egosi ndị a na-ekele n’ụzọ Igbo doro anya, na-amachibidoghị ya naanị n’ụmụnne ọbara.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke dị ugbu a ma dị ùgwù. E ji “ndị ezinụlọ” mee ka o doo anya na ekele ahụ bụ maka mmadụ, ọ bụghị maka ụlọ ahụ n’onwe ya.
