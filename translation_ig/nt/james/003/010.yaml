id: JAS.3.10
reference: James 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: ig
  text: N’otu ọnụ ahụ ka ngọzi na ọbụbụ ọnụ si apụta. Ụmụnna m[a], ihe ndị a ekwesịghị ịdị otu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ụmụnne m ndị nwoke na ndị nwaanyị.” Okwu Grik ahụ pụtara n’ụdị nwoke, ma n’ọnọdụ a o yiri ka Jemis na-agwa ọgbakọ ndị kwere ekwe niile okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: N’otu ọnụ ahụ ka ... si apụta
  rationale: Nke a na-edobe ihe atụ nke otu ọnụ dị ka isi ebe okwu abụọ ahụ si apụta, ma jiri usoro ahịrịokwu Igbo dị mfe ma bụrụkwa nke eke.
- source_word: ἐξέρχεται
  choice: si apụta
  rationale: Ọ na-egosi na ngọzi na ọbụbụ ọnụ na-esi n’ọnụ pụta; usoro a dabara nke ọma n’asụsụ Igbo n’agbanyeghị na ngwaa Grik dị n’otu ọnụọgụ.
- source_word: εὐλογία
  choice: ngọzi
  rationale: “Ngọzi” bụ okwu Igbo doro anya maka okwu e ji agọzi mmadụ, ma na-edobe ọdịiche ya na ọbụbụ ọnụ.
- source_word: κατάρα
  choice: ọbụbụ ọnụ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ikwu okwu ọjọọ e ji akpọku ihe ọjọọ n’ahụ mmadụ, ma kwekọọ na ọnọdụ okwu si n’ọnụ apụta.
- source_word: οὐ χρή
  choice: ekwesịghị
  rationale: “Ekwesịghị” na-egosi na omume a adịghị mma ma ọ bụ adịghị ka o kwesịrị ịdị, n’enweghị ịgbakwunye nkọwa karịrị ihe Grik kwuru.
- source_word: ἀδελφοί μου
  choice: Ụmụnna m
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa maka ndị otu ezinụlọ ma ọ bụ obodo okwukwe; ọ nwere ike ịgụnye nwoke na nwaanyị n’ụzọ dabara ọnọdụ ahụ, ebe ndetu ala na-akọwa ọdịdị okwu Grik.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: ihe ndị a ... ịdị otu a
  rationale: Nke a na-edobe ọtụtụ nke ταῦτα (“ihe ndị a”) na echiche οὕτως (“otu a”), ma na-ada ka Igbo nke oge a.
theological_decisions:
- issue: Okwu ezinụlọ nwere njirimara nwoke n’ἀδελφοί μου
  choice: Ụmụnna m
  alternative: Ụmụnne m nwoke; ụmụnne m ndị nwoke na ndị nwaanyị
  rationale: Ọ bụ ezie na ụdị Grik bụ ọtụtụ nke nwoke, n’ọnọdụ a Jemis yiri ka ọ na-agwa ọgbakọ ndị kwere ekwe niile okwu. “Ụmụnna” na Standard Igbo bụ okwu ezinụlọ zuru mmadụ ọnụ ma ghara ime ka ndị nwaanyị pụọ; ndetu ala na-echekwa ozi gbasara ụdị Grik.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ihe atụ nke otu ọnụ na-emepụta ma ngọzi ma ọbụbụ ọnụ, yana ịkatọ omume ahụ n’ụzọ siri ike ma na-adịghị agbakwunye nkọwa ụka pụrụ iche.
