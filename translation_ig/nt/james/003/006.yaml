id: JAS.3.6
reference: James 3:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: ig
  text: Ire bụ ọkụ. Ire ahụ, bụ ụwa nke ajọ omume, ka e debere n’etiti akụkụ ahụ anyị; ọ na-emetọ ahụ dum[a], na-amụnye wiil nke ọmụmụ[b] ọkụ, ya onwe ya ka Gehena[c] na-amụnyekwa ọkụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ na-eme ka ahụ dum ghara ịdị ọcha,” ma ọ bụ “ọ na-etinye ntụpọ n’ahụ dum.”
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “usoro ndụ” ma ọ bụ “okirikiri ndụ.” N’ụzọ nkịtị: “wiil nke ọmụmụ.”'
    reason: lexical_alternative
  - marker: c
    text: Gehena bụ okwu Grik a na-asụgharịkarị “hel.”
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: ire
  rationale: A họọrọ aha akụkụ ahụ n’ụzọ nkịtị, ebe ọ na-anọchikwa anya okwu mmadụ n’ihe atụ Jemis ji.
- source_word: πῦρ
  choice: ọkụ
  rationale: Nke a na-edobe ihe atụ nke ike ire nwere ibibi ihe.
- source_word: κόσμος τῆς ἀδικίας
  choice: ụwa nke ajọ omume
  rationale: Nke a na-echekwa okwu atụ siri ike nke Grik ma na-egosi obosara nke ihe ọjọọ dị n’ἀδικία, ọ bụghị naanị ikpe na-ezighị ezi.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: n’etiti akụkụ ahụ anyị, ire dị ka
  rationale: Nsụgharị a na-egosi ọnọdụ ire n’etiti akụkụ ahụ ma na-ejikọta ya na nkọwa ‘ụwa nke ajọ omume’ n’Igbo doro anya.
- source_word: σπιλοῦσα ὅλον τὸ σῶμα
  choice: ọ na-emetọ ahụ dum
  rationale: ‘Na-emetọ’ na-eburu echiche ntụpọ na adịghị ọcha nke omume; e debere ihe oyiyi ntụpọ n’okpuru ederede.
- source_word: φλογίζουσα
  choice: na-amụnye ... ọkụ
  rationale: Ọ na-echekwa njikọ doro anya na ihe atụ ọkụ nke amaokwu ahụ.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: ụkwụ okirikiri nke ndụ
  rationale: A na-echekwa ihe oyiyi ‘wheel’ nke τροχός na mgbagwoju anya nke ahịrịokwu ahụ, ma γένεσις ka akọwara ebe a dị ka ndụ nke na-amalite site n’ọmụmụ.
- source_word: φλογιζομένη ὑπὸ τῆς γεέννης
  choice: ebe ọkụ ya onwe ya sikwa na Gehena
  rationale: Ọ na-egosi na ire na-amụnye ihe ọkụ ma ya onwe ya na-enwetakwa ọkụ site n’ebe ọzọ, ya bụ Gehena.
theological_decisions:
- issue: Nsụgharị γέεννα
  choice: Gehena
  alternative: ala mmụọ
  rationale: A hapụrụ aha Grik ahụ n’ụdị Igbo iji chekwaa nkọwa akụkọ ihe mere eme ya ma ghara itinye ozugbo echiche okpukpe sara mbara karịa okwu ahụ.
- issue: Nkọwa τὸν τροχὸν τῆς γενέσεως
  choice: ụkwụ okirikiri nke ndụ
  alternative: usoro ndụ / okirikiri ndụ
  rationale: A họọrọ okwu na-echekwa ihe oyiyi pụrụ iche nke Grik kama idozi ihe okwu ahụ pụtara n’otu ụzọ; nsụgharị ndị na-akọwa ya dị n’okpuru ederede.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ nke ire, ọkụ, ụwa, na ụkwụ okirikiri; a kọwara ahịrịokwu Grik ndị nwere ike ịpụta ihe karịrị otu ụzọ n’okpuru ederede kama idozi ha n’ahịrị isi.
