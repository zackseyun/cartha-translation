revisions:
- from: Ire bụkwa ọkụ. N’etiti akụkụ ahụ anyị, ire dị ka ụwa nke ajọ omume; ọ na-emetọ ahụ dum[a], na-amụnye ụkwụ okirikiri nke ndụ[b] ọkụ, ebe ọkụ ya onwe ya sikwa na Gehena[c].
  to: Ire bụ ọkụ. Ire ahụ, bụ ụwa nke ajọ omume, ka e debere n’etiti akụkụ ahụ anyị; ọ na-emetọ ahụ dum[a], na-amụnye wiil nke ọmụmụ[b] ọkụ, ya onwe ya ka Gehena[c] na-amụnyekwa ọkụ.
  rationale: The revision corrects the erroneous ‘circular leg’ to ‘wheel,’ restores the Greek’s passive statement that Gehenna sets the tongue on fire, and removes the unsupported comparative ‘like.’ It retains the deliberately literal and somewhat striking ‘wiil nke ọmụmụ,’ while providing more idiomatic interpretive alternatives in the footnote. The Gehenna note is corrected to avoid conflating Gehenna with the spirit world.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T06:08:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the verse’s fire imagery, moral-contamination imagery, and Gehenna. However, “ụkwụ okirikiri” means a circular leg/foot, not a wheel, and the final clause changes the passive sense: the tongue itself is being set on fire by Gehenna, rather than merely its fire coming from Gehenna. “Dị ka ụwa” also weakens the appositional/predicative force of κόσμος τῆς ἀδικίας.'
  naturalness: Most of the draft is readable Standard Igbo, but “ụkwụ okirikiri nke ndụ” is unnatural and semantically wrong. The revised wording uses the established, readily understood loanword “wiil” and a direct passive construction for the closing participle.
  terminology: “Ire,” “ọkụ,” “ahụ,” and “Gehena” are appropriate. “Ụwa nke ajọ omume” suitably preserves the vivid κόσμος τῆς ἀδικίας idiom. The Gehenna footnote should not equate the term with “ala mmụọ,” which denotes the spirit world and is not an accurate equivalent of the traditional rendering “hell.”
  issues:
  - severity: high
    issue: “ụkwụ okirikiri” mistranslates τροχός.
    rationale: Ụkwụ means ‘leg/foot,’ whereas τροχός means ‘wheel.’ This produces an incorrect image and must be replaced.
  - severity: high
    issue: The closing clause does not retain the passive force of φλογιζομένη ὑπὸ τῆς γεέννης.
    rationale: “ebe ọkụ ya onwe ya sikwa na Gehena” says that its fire comes from Gehenna. The Greek says that the tongue is itself set on fire by Gehenna.
  - severity: medium
    issue: “ire dị ka ụwa nke ajọ omume” introduces a comparison not expressed by the Greek.
    rationale: The construction presents the tongue as ‘the/a world of unrighteousness,’ not merely as being like one.
  - severity: medium
    issue: Footnote c gives “ala mmụọ” as the customary alternative for Gehenna.
    rationale: “Ala mmụọ” normally refers to the abode/world of spirits and is not an accurate rendering of the conventional English theological alternative ‘hell.’
  revised_text: Ire bụ ọkụ. Ire ahụ, bụ ụwa nke ajọ omume, ka e debere n’etiti akụkụ ahụ anyị; ọ na-emetọ ahụ dum[a], na-amụnye wiil nke ọmụmụ[b] ọkụ, ya onwe ya ka Gehena[c] na-amụnyekwa ọkụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ na-eme ka ahụ dum ghara ịdị ọcha,” ma ọ bụ “ọ na-etinye ntụpọ n’ahụ dum.”
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, “usoro ndụ” ma ọ bụ “okirikiri ndụ.” N’ụzọ nkịtị: “wiil nke ọmụmụ.”'
    reason: lexical_alternative
  - marker: c
    text: Gehena bụ okwu Grik a na-asụgharịkarị “hel.”
    reason: alternative_reading
  revision_rationale: The revision corrects the erroneous ‘circular leg’ to ‘wheel,’ restores the Greek’s passive statement that Gehenna sets the tongue on fire, and removes the unsupported comparative ‘like.’ It retains the deliberately literal and somewhat striking ‘wiil nke ọmụmụ,’ while providing more idiomatic interpretive alternatives in the footnote. The Gehenna note is corrected to avoid conflating Gehenna with the spirit world.
