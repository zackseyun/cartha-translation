id: JAS.3.1
reference: James 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: ig
  text: Ụmụnna m, ka ọtụtụ n’ime unu ghara ịghọ ndị ozizi[a], ebe unu maara na anyị ga-anata ikpe ka ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, “ụmụnna” yiri ka ọ na-ezo aka n’obodo ndị kwere ekwe niile, ụmụnwaanyị sokwa na ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ ... γίνεσθε
  choice: ka ọtụtụ n’ime unu ghara ịghọ
  rationale: Nke a na-egosipụta mmachibido ma ọ bụ ndụmọdụ dị n’ụdị iwu nke μή na γίνεσθε, ma na-edowe echiche nke ịbanye n’ọrụ ahụ (‘ịghọ’), ọ bụghị naanị ịnọ n’ọnọdụ ahụ.
- source_word: διδάσκαλοι
  choice: ndị ozizi
  rationale: ‘Ndị ozizi’ bụ okwu Igbo doro anya maka ndị na-akụzi, ma ọ naghị etinye echiche nke ọkwa ọchịchị ụka pụrụ iche nke okwu Grik ahụ ekwughị.
- source_word: ἀδελφοί μου
  choice: Ụmụnna m
  rationale: ‘Ụmụnna m’ bụ ụzọ ebumpụta ụwa, dị ùgwù, e si akpọ ndị otu okwukwe n’Igbo; n’ọnọdụ a ọ pụrụ ịgụnye ma nwoke ma nwanyị.
- source_word: εἰδότες
  choice: ebe unu maara
  rationale: Nke a na-edowe participle ahụ dịka ọnọdụ ma ọ bụ ihe ndabere nke ndụmọdụ ahụ, na-enweghị ịmanye naanị nkọwa ‘n’ihi na’.
- source_word: μεῖζον κρίμα
  choice: ikpe ka ukwuu
  rationale: Nsụgharị a na-edowe ntụnyere μεῖζον nke ọma ma hapụ κρίμα dịka ‘ikpe,’ kama ime ka ọ bụrụrịrị ‘ikpe ọmụma’ ma ọ bụ ‘mbibi ebighị ebi.’
- source_word: λημψόμεθα
  choice: anyị ga-anata
  rationale: Nke a na-edowe onye mbụ ọtụtụ nke ngwaa ahụ, nke na-egosi na onye dere akwụkwọ ahụ tinyere onwe ya n’etiti ndị ga-aza ajụjụ.
theological_decisions:
- issue: Ndị ἀδελφοί μου na-ezo aka na ha
  choice: ‘Ụmụnna m’ n’isiokwu, tinyere nkọwa na ọ gụnyere ụmụnwaanyị
  alternative: ‘Ụmụnne m ndị nwoke na ndị nwanyị’
  rationale: ‘Ụmụnna’ na Standard Igbo nwere ike ịkpọkọta obodo niile, ebe nkọwa ala peeji na-eme ka oke okwu ahụ doo anya n’enweghị itinye okwu ndị na-adịghị kpọmkwem na Grik n’ahịrị isi.
- issue: Ike κρίμα n’ịdọ ndị ozizi aka ná ntị
  choice: ikpe
  alternative: ikpe ọmụma
  rationale: κρίμα na-ekwu maka ikpe ma ọ bụ mkpebi ikpe, ma amaokwu a n’onwe ya anaghị amanye nkọwa nke ikpe ọmụma ikpeazụ. ‘Ikpe’ na-echekwa ịdọ aka ná ntị na esemokwu nkà mmụta okpukpe dị na ya.
- issue: Ihe μεῖζον pụtara n’ebe a
  choice: ka ukwuu
  alternative: siri ike karị
  rationale: ‘Ka ukwuu’ na-agbasochi comparative Grik ahụ anya ma ghara ikpebi kpọmkwem ma ịdị ukwuu ahụ bụ n’usoro nyocha, n’ịdị njọ, ma ọ bụ n’oke nsonaazụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ nhazi ‘ka ... ghara’ iji mee ka mmachibido ahụ bụrụ nke ebumpụta ụwa n’Igbo; e debere ‘anyị’ iji chekwaa ntinye onye dere akwụkwọ ahụ n’etiti ndị ozizi.
