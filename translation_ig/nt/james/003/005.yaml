  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: ig
  text: Otú ahụkwa, ire bụ obere akụkụ ahụ, ma ọ na-ekwu nnukwu okwu n’etu ọnụ. Lee otú obere ọkụ[a] nwere ike isi gbaa nnukwu ọhịa[b] ọkụ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Lee otú nnukwu ọkụ si agba nnukwu ọhịa ọkụ!” A pụrụ ịghọta usoro okwu Grik ahụ dịka mkpu na-egosi ịdị ukwuu; ma isi ederede na-agbaso echiche nke obere ihe na-akpata nnukwu ihe, nke kwekọrọ na ntụnyere ire dịka obere akụkụ ahụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ “osisi,” “nkụ,” ma ọ bụ “ahịhịa kpọrọ nkụ.” Okwu Grik ahụ pụrụ ịpụta ọhịa, osisi, ma ọ bụ ihe ọkụ pụrụ ịkpọ; “ọhịa” dabara nke ọma n’ihe oyiyi ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: ire
  rationale: A họọrọ okwu nkịtị pụtara “tongue” ka e debe ihe atụ Jemis ji akụkụ ahụ mee, kama ịtụgharị ya ozugbo ka ọ bụrụ “okwu ọnụ.”
- source_word: μικρὸν μέλος
  choice: akụkụ ahụ dị nta
  rationale: Nke a bụ Igbo doro anya ma dị ndụ nke na-egosi na ire bụ obere akụkụ nke ahụ, ma debe njikọ ya na ihe atụ ndị gbara amaokwu a gburugburu.
- source_word: μεγάλα αὐχεῖ
  choice: ọ na-etu ọnụ maka ihe ukwu
  rationale: “Ịtu ọnụ” na-egosi mpako ma ọ bụ nnukwu nkwupụta nke ngwaa αὐχεῖ nwere; “ihe ukwu” na-edebekwa nnukwu ihe nke μεγάλα na-egosi n'enweghị ịkọwapụta ya karịa isi mmalite.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo dị ugbu a nke na-adọta uche onye na-agụ ya gaa n'ihe atụ na-esote.
- source_word: ἡλίκον πῦρ
  choice: otú obere ọkụ
  rationale: N'ọnọdụ a, “obere ọkụ” na-eme ka ntụnyere dị n'etiti obere ire na nnukwu ihe ọ pụrụ ime pụta ìhè. E debere nghọta ọzọ nke okwu Grik ahụ n'ala ala peeji.
- source_word: ἡλίκην ὕλην
  choice: nnukwu ọhịa
  rationale: ὕλη pụrụ ịpụta ọhịa, osisi, ma ọ bụ ihe a pụrụ ịkpọ ọkụ; “nnukwu ọhịa” na-enye ihe oyiyi doro anya ma bụrụkwa Igbo e ji ekwu okwu nke ọma n'ebe a.
- source_word: ἀνάπτει
  choice: si eme ka ... gbaa ọkụ
  rationale: Nkebiokwu a na-egosi nke ọma na obere ọkụ na-amụnye nnukwu ihe, ma na-ada ka Igbo nkịtị na nke doro anya.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke ire dịka akụkụ ahụ na ọdịiche dị n'etiti obere ihe na nnukwu ihe ọ na-akpata; a zere okwu ochie na nkọwa ụka pụrụ iche.
