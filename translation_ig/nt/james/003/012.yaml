  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ịmị mkpụrụ” mee ka ihe osisi na-eme daa nke ọma n'Igbo; e debere ajụjụ nkwupụta nke Grik na enweghị ike dị na nkebi ikpeazụ.
