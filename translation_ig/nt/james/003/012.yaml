  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: ig
  text: Ụmụnna m,[a] osisi fig ò nwere ike ịmị mkpụrụ oliv, ma ọ bụ osisi vaịn amị mkpụrụ fig? Mmiri nnu apụghịkwa ịmịpụta mmiri dị ụtọ.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna m” a pụrụ ịghọta dị ka “ụmụnna m, ma ndị nwoke ma ndị nwanyị.” Okwu Grik ahụ bụ ụdị ọtụtụ nke nwoke, ma a pụrụ iji ya kpọọ ìgwè nwere ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “mmiri dị ụtọ”; n'ebe a ọ pụtara mmiri ọhụrụ, ya bụ, mmiri na-abụghị mmiri nnu.
    reason: lexical_alternative
  - marker: c
    text: 'Nkebi ikpeazụ dị mkpirikpi n''asụsụ Grik. N''ihi ihe atụ isi iyi dị n''amaokwu bu ụzọ, a pụkwara ịghọta ya dị ka: “Isi iyi nnu apụghịkwa ịmịpụta mmiri dị ụtọ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: Ụmụnna m
  rationale: N'Igbo, “ụmụnna m” bụ ụzọ dị ndụ na nke a na-asọpụrụ e si akpọ ndị otu obodo okwukwe; ọ pụkwara ịgụnye ndị nwoke na ndị nwaanyị n'ọnọdụ a.
- source_word: μὴ δύναται
  choice: ò nwere ike
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma; usoro “ò nwere ike...?” na-edobe ụdị ajụjụ nkwupụta ahụ n'Igbo.
- source_word: συκῆ
  choice: osisi fig
  rationale: Okwu Grik ahụ na-ezo aka n'osisi, ọ bụghị naanị mkpụrụ ya; “osisi fig” na-eme ka nke ahụ doo anya.
- source_word: ἐλαίας ποιῆσαι
  choice: ịmị mkpụrụ oliv
  rationale: N'ihe gbasara osisi, ποιέω pụtara ịmị ma ọ bụ ịpụta mkpụrụ; “ịmị mkpụrụ” bụ okwu Igbo e ji ekwu ya n'ụzọ ebumpụta ụwa.
- source_word: ἄμπελος
  choice: osisi vaịn
  rationale: Nhọrọ a na-akọwapụta osisi mkpụrụ vaịn a na-ekwu maka ya ma na-edobe ihe atụ ọrụ ugbo.
- source_word: σῦκα
  choice: mkpụrụ fig
  rationale: Ọ bụ mkpụrụ fig n'ụbara; itinye “mkpụrụ” na-eme ka ọdịiche dị n'etiti osisi na mkpụrụ ya doo anya n'Igbo.
- source_word: οὔτε ἁλυκὸν
  choice: Mmiri nnu apụghịkwa
  rationale: Grik ahụ dị mkpirikpi ma hapụla aha ihe a na-akọwa; “mmiri nnu” na-enye nghọta kacha nso n'etinyeghị “isi iyi” kpọmkwem n'ahịrị bụ isi.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: ịmịpụta mmiri ọma
  rationale: γλυκύς pụtara n'ụzọ nkịtị “ụtọ,” ma n'ihe gbasara mmiri ọ na-emegide mmiri nnu. “Mmiri ọma” bụ okwu Igbo dị mfe maka mmiri na-abụghị nnu, ebe nkọwa ala na-echekwa ntụgharị nkịtị.
