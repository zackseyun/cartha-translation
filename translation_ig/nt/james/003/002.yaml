- from: N’ihi na anyị niile na-asụ ngọngọ n’ọtụtụ ụzọ. Ọ bụrụ na onye ọ bụla adịghị asụ ngọngọ n’okwu[a], onye ahụ bụ nwoke tozuru okè[b][c], onye nwekwara ike iji eriri ọnụ chịkwaa ahụ ya dum.
