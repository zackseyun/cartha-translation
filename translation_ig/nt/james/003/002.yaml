id: JAS.3.2
reference: James 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: ig
  text: N’ihi na anyị niile na-asụ ngọngọ n’ọtụtụ ụzọ. Ọ bụrụ na onye ọ bụla anaghị asụ ngọngọ n’okwu[a], onye ahụ bụ nwoke tozuru okè[b][c], onye nwekwara ike iji eriri ọnụ chịkwaa ahụ dum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ‘n’okwu,’ ya bụ, n’ikwu okwu ma ọ bụ n’ihe mmadụ na-ekwu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya ‘nwoke zuru oke.’ Okwu Grik τέλειος nwere ike ịpụta ‘zuru oke,’ ‘zuru ezu,’ ma ọ bụ ‘tozuru okè’; n’ebe a, o yikarịrị ka ọ na-ekwu maka ntozu okè n’omume, ọ bụghị enweghị mmehie kpamkpam.
    reason: lexical_alternative
  - marker: c
    text: Grik kwuru ‘nwoke’ (ἀνήρ), ma e ji ya mee nkwupụta izugbe nke gbasara onye ọ bụla.
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: n’ọtụtụ ụzọ
  rationale: Ọ bụ ojiji adverb nke na-egosi ọtụtụ akụkụ ma ọ bụ ụzọ mmadụ si ada, ọ bụghị ọtụtụ ihe e ji mee ihe.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ịdọ aka ná ntị bu ya ụzọ site n’inye ihe kpatara ya.
- source_word: πταίομεν / πταίει
  choice: na-asụ ngọngọ / adịghị asụ ngọngọ
  rationale: Nke a na-edobe ihe atụ nke ịsụ ngọngọ ma na-egosikwa ọdịda n’omume.
- source_word: ἅπαντες
  choice: anyị niile
  rationale: Ọ na-edobe nkwusi ike na Jemes tinyere onwe ya n’etiti ndị ọ na-ekwu maka ha.
- source_word: εἴ τις
  choice: Ọ bụrụ na onye ọ bụla
  rationale: Ọ bụ ọnọdụ zuru mmadụ niile ọnụ, ọ bụghị naanị otu onye a maara.
- source_word: ἐν λόγῳ
  choice: n’okwu
  rationale: Ọ na-edobe nkenke nke Grik; ihe ọ pụtara n’ebe a bụ n’ikwu okwu ma ọ bụ n’ihe mmadụ na-ekwu.
- source_word: οὗτος
  choice: onye ahụ
  rationale: Ọ na-edobe ike ngosipụta nke okwu Grik nke na-atụ aka n’onye a kọwara ozugbo.
- source_word: τέλειος
  choice: tozuru okè
  rationale: N’ebe a okwu ahụ na-egosi ntozu oke ma ọ bụ izu oke n’omume, n’enweghị ikwu na onye ahụ enweghị mmehie ọ bụla.
- source_word: ἀνήρ
  choice: nwoke
  rationale: A sụgharịrị aha nwoke dị na Grik kpọmkwem, ma nkebi ‘onye ọ bụla’ na ihe odide ala peeji na-egosi na okwu a bụ nkwupụta izugbe.
- source_word: δυνατὸς
  choice: nwere ike
  rationale: Ọ na-egosi ikike onye ahụ nwere ịchịkwa onwe ya.
- source_word: χαλιναγωγῆσαι
  choice: iji eriri ọnụ chịkwaa
  rationale: Nke a na-edobe ihe atụ nke iji eriri ọnụ edu ma na-achịkwa ịnyịnya, nke Jemes gara n’ihu ịkọwa n’amaokwu ndị na-esote.
- source_word: καὶ
  choice: nwekwara
  rationale: 'Ọ na-egosi mgbakwunye: onye na-achịkwa okwu ya nwekwara ike ịchịkwa ahụ dum.'
theological_decisions:
- issue: Ihe τέλειος pụtara n’ọnọdụ metụtara omume
  choice: tozuru okè
  alternative: zuru oke
  rationale: Okwu a nwere ike ịpụta ‘zuru oke,’ ‘zuru ezu,’ ma ọ bụ ‘tozuru okè.’ N’ebe a, ‘tozuru okè’ na-egosi ntozu n’omume n’etinyeghị echiche na mmadụ enweghị mmehie kpamkpam; ihe odide ala peeji na-edobe nhọrọ ọzọ.
- issue: Ike nnọchite anya nke ἀνήρ
  choice: nwoke, jiri ya mee nkwupụta izugbe
  alternative: onye
  rationale: Grik ji aha nwoke kpọmkwem, ma εἴ τις (‘onye ọ bụla’) gosiri na ụkpụrụ ahụ gbasara onye ọ bụla. Ihe odide ala peeji na-eme ka nke a doo anya n’enweghị ihichapụ ụdị okwu isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ịsụ ngọngọ’ na ‘iji eriri ọnụ chịkwaa’ na-edobe ihe atụ abụọ dị na isi mmalite, ebe ‘tozuru okè’ na-ezere ịkọwa τέλειος dịka enweghị mmehie kpamkpam.
