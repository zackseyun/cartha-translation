    rationale: Although Greek uses substantival adjectives, the referent is what the spring emits. In Igbo, “ihe dị ụtọ na ihe ilu” is semantically vague and is less natural with “na-asọpụta.” Retaining “mmiri” preserves the image without adding meaning.
