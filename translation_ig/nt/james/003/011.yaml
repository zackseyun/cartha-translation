  text: μήτι ἡ πηγὴ ἐκ τῆς αὐτῆς ὀπῆς βρύει τὸ γλυκὺ καὶ τὸ πικρόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/003/011.yaml
  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: ig
  text: Isi iyi ọ̀ na-asọpụta ma mmiri dị ụtọ ma mmiri ilu site n'otu oghere ahụ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụzọ ka nso n''okwu mbụ: “Isi iyi ọ̀ na-asọpụta mmiri dị ụtọ na mmiri ilu site n''otu oghere ahụ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτι
  choice: ọ̀ ...?
  rationale: A na-eji ajụjụ ‘ọ̀ ...?’ mee ajụjụ nkwupụta n'Igbo; ihe gbara ya gburugburu na-egosi na azịza a na-atụ anya ya bụ mba, n'ejighị usoro ga-ada ka ntụgharị siri ike.
- source_word: πηγή
  choice: isi iyi
  rationale: ‘Isi iyi’ bụ okwu Igbo doro anya maka ebe mmiri si apụta n'onwe ya, ma kwekọọ na ihe oyiyi Greek a.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: site n'otu oghere ahụ
  rationale: Nke a na-edobe kpọmkwem echiche nke otu oghere ma ọ bụ ụzọ mmiri si apụta, na-agbanweghị ya ka ọ bụrụ ‘ọnụ’ n'ụzọ ihe atụ.
- source_word: βρύει
  choice: na-asọpụta
  rationale: ‘Na-asọpụta’ na-egosi mmiri na-esi n'isi iyi apụta ma na-aga n'ihu; ọ bụ okwu eke ma doo anya n'Igbo.
- source_word: τὸ γλυκύ
  choice: mmiri dị ụtọ
  rationale: Adjective Greek a na-arụ ọrụ dị ka aha. Ịtinye ‘mmiri’ na-eme ka ihe a na-ekwu doo anya, ebe ‘dị ụtọ’ na-edobe ọdịiche kpọmkwem megide ilu.
- source_word: τὸ πικρόν
  choice: mmiri ilu
  rationale: ‘Mmiri ilu’ na-edobe ihe Greek pụtara kpọmkwem ma guzoro n'ụzọ doro anya megide ‘mmiri dị ụtọ.’
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị mfe ma dị ùgwù. A họọrọ ‘isi iyi’ kama okwu mbinye ‘fọnteịn,’ tinyekwa ‘mmiri’ n'ahịrị bụ isi maka ido anya; ihe odide ala peeji na-egosi usoro dị nso karịa n'ụdị Greek.
