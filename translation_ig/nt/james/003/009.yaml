id: JAS.3.9
reference: James 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: ig
  text: Ọ bụ ya ka anyị ji agọzi Onyenwe na Nna[a], ọ bụkwa ya ka anyị ji abụ ọnụ ụmụ mmadụ[b], ndị e mere n’oyiyi Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “Onyenwe na Nna.” Enwere ike ịghọta okwu ahụ dị ka “Onyenwe, bụ́ Nna,” ma ọ bụ dị ka aha abụọ e ji akpọ Chineke.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị mmadụ”; okwu Grik a na-ezo aka n’ụmụ mmadụ n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: Ọ bụ ya ka anyị ji
  rationale: Nke a na-ezo aka n’ire e kwuru okwu ya n’amaokwu ndị bu ụzọ. Usoro ‘ọ bụ ya ka anyị ji’ na-egosi ngwa e ji eme ihe n’Igbo dị ugbu a ma na-edobe nkwughachi ahụ n’akụkụ abụọ nke amaokwu ahụ.
- source_word: εὐλογοῦμεν
  choice: anyị ji agọzi
  rationale: ‘Ịgọzi’ na-edobe okwu Akwụkwọ Nsọ banyere ngọzi ma kwekọọ n’ebe Chineke bụ onye a na-agọzi.
- source_word: κύριον
  choice: Onyenwe
  rationale: ‘Onyenwe’ na-enye aha nsọpụrụ κύριος n’enweghị ịgbakwụnye nnọchiaha nke na-adịghị n’ihe odide Grik.
- source_word: καὶ πατέρα
  choice: na Nna
  rationale: Nsụgharị a na-edobe njikọ aha abụọ ahụ n’ụzọ dị nso n’ihe odide Grik, n’agbanyeghị na enwere ike ịghọta ya dị ka aha abụọ a na-akpọ otu onye.
- source_word: καταρώμεθα
  choice: anyị ji akọcha
  rationale: ‘Ịkọcha’ bụ okwu Igbo doro anya maka ịkpọ mmadụ ọnụ, ma na-edobe nnukwu ọdịiche dị n’etiti ịgọzi na ịkọcha.
- source_word: ἀνθρώπους
  choice: ụmụ mmadụ
  rationale: Okwu a na-ezo aka n’ụmụ mmadụ niile, ọ bụghị naanị ụmụ nwoke; ‘ụmụ mmadụ’ na-egosipụta nke ahụ n’Igbo nkịtị.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: n’oyiyi Chineke
  rationale: Nke a bụ usoro Igbo dị mfe ma dị ùgwù nke na-edobe njikọ ya na okwu okike banyere oyiyi Chineke.
- source_word: γεγονότας
  choice: ndị e mere
  rationale: N’ọnọdụ a, okwu ahụ na-egosi ọnọdụ mmadụ nwetara site n’okike; ‘e mere’ na-egosipụta nke a ma hapụ onye mere ya ka ihe gbara ya gburugburu mee ka o doo anya.
theological_decisions:
- issue: Ihe ἀνθρώπους na-ezo aka na ya
  choice: ụmụ mmadụ
  alternative: ụmụ nwoke
  rationale: Ihe odide ahụ na-ekwu banyere mmadụ niile e mere n’oyiyi Chineke, ya mere a gaghị egbochi ya n’ebe ụmụ nwoke nọ naanị.
- issue: Mmekọrịta dị n’etiti ‘Onyenwe’ na ‘Nna’
  choice: Onyenwe na Nna
  alternative: Onyenwe, ya bụ Nna
  rationale: Usoro Grik nwere ike ịbụ aha abụọ a na-akpọ otu onye n’ụzọ nkọwa, ma nsụgharị bụ isi anaghị amanye nkọwa ahụ; nkọwa ala peeji na-echekwa ụzọ abụọ e nwere ike isi ghọta ya.
- issue: Asụsụ okike dị na γεγονότας καθ’ ὁμοίωσιν θεοῦ
  choice: ndị e mere n’oyiyi Chineke
  alternative: ndị ghọrọ ndị yiri Chineke
  rationale: ‘E mere n’oyiyi Chineke’ na-egosipụta ntụaka doro anya n’akụkọ okike, ma ọ naghị akọwakwu onye na-eme ihe karịa ihe amaokwu ahụ na gburugburu ya na-egosi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E zere ịgbakwụnye ‘anyị’ n’aha ‘Onyenwe’ n’ihi na nnọchiaha ahụ adịghị n’ihe odide Grik. Nkwughachi ‘ọ bụ ya ka anyị ji … ọ bụkwa ya ka anyị ji’ na-eme ka ọdịiche dị n’etiti ngọzi na nkọcha pụta ìhè.
