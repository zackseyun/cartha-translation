review_pass:
  verdict: revise
  source_fidelity: The clause structure, repeated instrumental reference to the tongue, generic human referent, and creation-language allusion are represented well. However, ‘ịkọcha’ primarily denotes insulting, reviling, or speaking abusively, whereas καταρώμεθα specifically means ‘we curse / call down a curse on.’
  naturalness: The sentence is fluent Standard Igbo. Replacing ‘akọcha’ with ‘abụ ọnụ’ makes the contrast with ‘agọzi’ both more idiomatic in biblical register and semantically exact.
  terminology: ‘Onyenwe na Nna,’ ‘ụmụ mmadụ,’ and ‘e mere n’oyiyi Chineke’ are suitable. The appositional/coordinate ambiguity of κύριον καὶ πατέρα is retained without doctrinal over-resolution. ‘Abụ ọnụ’ is the appropriate term for καταράομαι.
  issues:
  - severity: medium
    issue: ‘anyị ji akọcha’ does not fully render καταρώμεθα.
    rationale: In Standard Igbo, ịkọcha commonly means to revile, abuse, or insult. The Greek verb denotes cursing, so ‘anyị ji abụ ọnụ’ is needed to preserve the verse’s specific lexical and moral contrast with blessing.
  revised_text: Ọ bụ ya ka anyị ji agọzi Onyenwe na Nna[a], ọ bụkwa ya ka anyị ji abụ ọnụ ụmụ mmadụ[b], ndị e mere n’oyiyi Chineke.
