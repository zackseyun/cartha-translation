id: JAS.3.7
reference: James 3:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: ig
  text: N’ihi na a na-azụ ụdị ọ bụla nke anụ ọhịa, nke ụmụ nnụnụ, nke ihe ndị na-akpụ akpụ, na nke anụ ndị bi n’oké osimiri; a zụọlarị ha site n’aka ụmụ mmadụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ọdịdị mmadụ.” Nkebiokwu Grik a nwere ike izo aka n’ụmụ mmadụ n’ozuzu ha, ma ọ bụ n’ọdịdị mmadụ. Isi ederede were ya dị ka ụmụ mmadụ n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: ụdị ... niile
  rationale: N’usoro a nke na-edepụta anụmanụ, φύσις pụtara ụdị ma ọ bụ otu, ọ bụghị naanị ‘agwa ebumpụta ụwa.’ Nhazi a na-egosikwa ike nkesa nke πᾶσα.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na okwu bu ya ụzọ dị ka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: θηρίων
  choice: anụ ọhịa
  rationale: Ọ bụ okwu Igbo doro anya maka anụmanụ ndị a na-ewere dị ka anụ ọhịa, ma na-ezere okwu ochie ma ọ bụ nke na-adịghị eke ọnụ.
- source_word: πετεινῶν
  choice: ụmụ nnụnụ
  rationale: Nke a bụ ụzọ nkịtị na nke doro anya e si ekwu ụdị anụmanụ na-efe efe a n’Igbo.
- source_word: ἑρπετῶν
  choice: ihe ndị na-akpụ akpụ
  rationale: Okwu Grik ahụ sara mbara karịa ‘reptile’ n’echiche sayensị; okwu a na-edobe echiche nke ihe na-arịgharị ma ọ bụ na-akpụ akpụ.
- source_word: ἐναλίων
  choice: anụ ndị bi n’oké osimiri
  rationale: Ọ na-enye echiche sara mbara nke ihe ndị dị n’ime mmiri, karịsịa n’oké osimiri, n’asụsụ Igbo dị mfe nghọta.
- source_word: δαμάζεται
  choice: a na-azụ
  rationale: 'Ụdị ngwaa ugbu a na-egosi omume na-aga n’ihu ma ọ bụ eziokwu a na-ahụkarị: ụmụ mmadụ na-eme ka anụmanụ rubere ha isi.'
- source_word: δεδάμασται
  choice: e zuokwa ha
  rationale: Ụdị zuru oke na-egosi na omume ahụ emeelarị ma nsonaazụ ya ka dị; ‘e zuokwa ha’ na-ekewapụ ya n’ụdị ngwaa ugbu a.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: site n’aka ụmụ mmadụ
  rationale: N’ọnọdụ a, a ghọtara nkebiokwu ahụ dị ka ụmụ mmadụ n’ozuzu ha bụ ndị na-azụ anụmanụ. Nke a bụ okwu Igbo ebumpụta ụwa ma na-edobe ike onye na-eme ihe nke dative ahụ.
theological_decisions:
- issue: Ma τῇ φύσει τῇ ἀνθρωπίνῃ pụtara ụmụ mmadụ n’ozuzu ha ka ọ bụ ọdịdị mmadụ
  choice: Isi ederede sụgharịrị ya dị ka ‘site n’aka ụmụ mmadụ.’
  alternative: ‘site n’ọdịdị mmadụ’
  rationale: Ndepụta ụdị anụmanụ na ngwaa ‘ịzụ’ na-akwado nghọta mkpokọta nke ụmụ mmadụ dịka ndị na-eme ihe. Ma n’ihi na okwu Grik nwere ike ịpụta ‘ọdịdị mmadụ,’ e debere nke ahụ n’ala peeji kama ikpochapụ mgbagwoju anya ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘a na-azụ ... e zuokwa’ gosipụta ọdịiche dị n’etiti ngwaa ugbu a na ngwaa zuru oke, ma e zere ịmanye nkọwa ụka ọ bụla n’ime ederede.
