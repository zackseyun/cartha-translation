revisions:
- from: N’ihi na a na-azụ ụdị anụ ọhịa niile, ma ụmụ nnụnụ, ma ihe ndị na-akpụ akpụ, ma anụ ndị bi n’oké osimiri, e zuokwa ha site n’aka ụmụ mmadụ.[a]
  to: N’ihi na a na-azụ ụdị ọ bụla nke anụ ọhịa, nke ụmụ nnụnụ, nke ihe ndị na-akpụ akpụ, na nke anụ ndị bi n’oké osimiri; a zụọlarị ha site n’aka ụmụ mmadụ.[a]
