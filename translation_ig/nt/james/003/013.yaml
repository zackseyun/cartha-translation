  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: ig
  text: Ònye n’ime unu bụ onye maara ihe, bụrụkwa onye nwere nghọta? Ka o site n’ezi omume ya gosi ọrụ ya n’ịdị nwayọọ nke amamihe.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “n’ịdị nwayọọ nke sitere n’amamihe.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, iwu a dị n’ụdị otu nwoke, ma ọ na-anọchi anya onye ọ bụla dị otú ahụ n’ọgbakọ.
    reason: cultural_note
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: Ònye n’ime unu bụ onye maara ihe, bụrụkwa onye nwere nghọta?
  rationale: Ajụjụ a bụ nke na-akpọ onye n’ọgbakọ ahụ chere na ya nwere amamihe na nghọta ka o gosipụta ha. “Maara ihe” na “nwere nghọta” na-ekwupụta amamihe bara uru na nghọta, ọ bụghị naanị ịmụ ihe.
- source_word: δειξάτω
  choice: Ka o ... gosi
  rationale: Nke a na-edobe ike iwu dị na aorist imperative, onye nke atọ, otu onye, ma na-ada nke ọma n’Igbo.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: site n’ezi omume ya
  rationale: ἀναστροφή na-ezo aka n’omume ma ọ bụ ụzọ mmadụ si ebi ndụ; “ezi omume” bụ okwu Igbo doro anya nke na-egosi ndụ a na-ahụ n’omume.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ọrụ ya
  rationale: “Ọrụ” na-edobe njikọ okwu ἔργα na isiokwu Jemis banyere ọrụ, ma n’ebe a ọ pụtara ihe ọma mmadụ na-eme.
- source_word: ἐν πραΰτητι σοφίας
  choice: jiri ịdị nwayọọ nke amamihe mee ya
  rationale: A hapụrụ njikọ genitive ahụ ka ọ nọgide nwee ohere ịpụta ịdị nwayọọ e ji amamihe mara, ma ọ bụ nke amamihe na-eweta; ntụaka ala peeji na-enye nkọwa ọzọ dị mfe.
theological_decisions:
- issue: Iwu otu onye na ike nnọchiteanya ya
  choice: Ka o ... gosi ọrụ ya
  alternative: Ka onye dị otú ahụ ... gosi ọrụ ya
  rationale: Grik ji ụdị otu onye mee ihe, ma ọ na-anọchi anya nwoke ma ọ bụ nwaanyị ọ bụla nọ n’ọgbakọ nwere àgwà ndị ahụ. Igbo “o/ya” adịghị ekewa nwoke na nwaanyị, ya mere ọ na-edobe ma otu onye ahụ ma ike nnọchiteanya ahụ.
- issue: Njikọ dị n’etiti ịdị nwayọọ na amamihe
  choice: ịdị nwayọọ nke amamihe
  alternative: ịdị nwayọọ nke sitere n’amamihe
  rationale: Genitive σοφίας nwere ike ịkọwa ụdị ịdị nwayọọ a ma ọ bụ isi iyi ya. Isi ederede na-edobe mkpakọrịta okwu ahụ n’enweghị idozi ya oke; ntụaka na-egosi nghọta nke isi iyi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu nke abụọ na-eme ka o doo anya na ọrụ ahụ ga-apụta site n’ezi omume, ma a kpachapụrụ anya ghara imechi nghọta abụọ nwere ike ịdị na πραΰτητι σοφίας.
