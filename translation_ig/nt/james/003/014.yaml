id: JAS.3.14
reference: James 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: ig
  text: Ma ọ bụrụ na unu nwere ekworo dị ilu[a] na ọchịchọ ọdịmma onwe[b] n’obi unu, unu atụla ọnụ ma ghara ikwu okwu ụgha megide eziokwu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịnụ ọkụ n’obi dị ilu” ma ọ bụ “anyaụfụ dị ilu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịsọ mpi” ma ọ bụ “omume na-akpata nkewa.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ikwu okwu ụgha nke na-emegide eziokwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: ekworo dị ilu
  rationale: N’ọnọdụ a, ζῆλος nwere nghọta ọjọọ nke ekworo, ebe πικρόν na-egosi ịdị ilu ya. Nsụgharị a na-edobe ihe atụ Grik ahụ ma na-ada nke ọma n’Igbo.
- source_word: ἐριθείαν
  choice: ọchịchọ ịchọ naanị uru nke onwe
  rationale: Okwu a na-egosi ọchịchọ nke mmadụ iji bulie onwe ya elu, nke na-akpalikwa ịsọ mpi na nkewa. Nkebiokwu a na-eme ka ebumnobi ịchọ ọdịmma onwe doo onye nkịtị anya.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: n’obi unu
  rationale: Ọ bụ ezie na καρδίᾳ dị n’otu ọnụọgụ na Grik, ὑμῶν bụ ọtụtụ; ‘n’obi unu’ bụ ụzọ Igbo si ekwu ya n’enweghị mgbagwoju anya ma na-ahapụ nghọta nkesa ahụ.
- source_word: μὴ κατακαυχᾶσθε
  choice: unu etula ọnụ
  rationale: ‘Ịtụ ọnụ’ bụ okwu Igbo kwụ ọtọ maka ịnya isi ma ọ bụ ito onwe elu; ọ dabara n’ịdọ aka ná ntị banyere mpako sitere n’ekworo.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: ma ghara ikwu okwu ụgha megide eziokwu
  rationale: Nke a na-edobe omume ψεύδεσθε dị ka ikwu ụgha na ike mmegide nke κατά dị ka ‘megide,’ kama ime ka ọ bụrụ naanị enweghị ezi obi.
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: ‘Ma’ na-egosi ọdịiche dị n’etiti ọnọdụ a na amamihe e kọwara tupu ya, ebe ‘ọ bụrụ na’ na-edobe ọnọdụ ahụ.
theological_decisions:
- issue: Ụdị nghọta nke ‘eziokwu’
  choice: eziokwu
  alternative: eziokwu nke ozi ọma; ezi ụzọ amamihe; ikwu ezi okwu
  rationale: ἀλήθεια enweghị nkọwa ọzọ kpọmkwem n’amaokwu a. ‘Eziokwu’ na-ahapụ obosara okwu ahụ, ka ọ ghara ịbụ naanị usoro ozizi pụrụ iche ma ọ bụ naanị eziokwu n’okwu mmadụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ekworo dị ilu’ na ‘ịtụ ọnụ’ maka ịdị nkenke na ịdị eke; a kọwara ἐριθείαν ntakịrị iji mee ka ọchịchọ ịchọ uru onwe na mmetụta nkewa ya pụta ìhè.
