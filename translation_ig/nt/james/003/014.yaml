revisions:
- from: Ma ọ bụrụ na unu nwere ekworo dị ilu[a] na ọchịchọ ịchọ naanị uru nke onwe[b] n’obi unu, unu etula ọnụ ma ghara ikwu okwu ụgha megide eziokwu.[c]
  to: Ma ọ bụrụ na unu nwere ekworo dị ilu[a] na ọchịchọ ọdịmma onwe[b] n’obi unu, unu atụla ọnụ ma ghara ikwu okwu ụgha megide eziokwu.[c]
  rationale: The revision corrects the Standard Igbo negative imperative and replaces a repetitive, somewhat restrictive phrase for ἐριθεία with an idiomatic expression for self-seeking ambition. It preserves the source text’s syntax, contrast, and theological openness.
  reviewer_model: gpt-5.6-terra
