review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional contrast, bitter jealousy, self-seeking motivation, the plural addressees' inward disposition, and the two prohibitions. ‘Eziokwu’ appropriately preserves the breadth of ἀλήθεια. The prohibitive form for κατακαυχᾶσθε needs correction in Standard Igbo.
  naturalness: The wording is generally clear and suitably formal. ‘Ọchịchọ ọdịmma onwe’ is more concise and idiomatic than ‘ọchịchọ ịchọ naanị uru nke onwe,’ while retaining the sense of self-seeking ambition. In Standard Igbo, the negative imperative is ‘unu atụla ọnụ,’ not ‘unu etula ọnụ.’
  terminology: ‘Ekworo dị ilu’ is a sound contextual rendering of ζῆλον πικρόν; the alternatives correctly retain zeal and envy. ‘Ọchịchọ ọdịmma onwe’ naturally conveys ἐριθεία here without reducing it merely to personal profit. ‘Ịtụ ọnụ’ fittingly conveys boastful self-exaltation, and ‘ikwu okwu ụgha megide eziokwu’ retains the adversative force of κατά.
  issues:
  - severity: medium
    issue: The form ‘unu etula ọnụ’ is not the standard negative imperative of ‘ịta ọnụ.’
    rationale: The required Standard Igbo form is ‘unu atụla ọnụ’ (“do not boast”). This is a grammatical correction that does not alter the meaning.
  - severity: low
    issue: ‘Ọchịchọ ịchọ naanị uru nke onwe’ is unnecessarily repetitive and narrowly frames ἐριθεία as seeking profit.
    rationale: ‘Ọchịchọ ọdịmma onwe’ is idiomatic and retains the broader sense of self-seeking ambition, including its socially divisive implication.
  revised_text: Ma ọ bụrụ na unu nwere ekworo dị ilu[a] na ọchịchọ ọdịmma onwe[b] n’obi unu, unu atụla ọnụ ma ghara ikwu okwu ụgha megide eziokwu.[c]
