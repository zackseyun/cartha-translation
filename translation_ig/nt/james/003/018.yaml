  source_fidelity: 'Nsụgharị ahụ na-anọchi anya akụkụ ndị bụ isi nke Grik ahụ nke ọma: καρπὸς δικαιοσύνης dịka “mkpụrụ nke ezi omume,” ἐν εἰρήνῃ dịka “n’udo,” σπείρεται dịka passive “A na-agha,” na τοῖς ποιοῦσιν εἰρήνην dịka “site n’aka ndị na-eme ka udo dịrị.” Ọ naghị ekpebi karịa ka Grik si ekwe banyere njikọ δικαιοσύνης ma ọ bụ ọrụ dative ahụ.'
  naturalness: Igbo ahụ bụ Standard Igbo doro anya, dị nwayọọ, ma dabara n’usoro akwụkwọ nsọ. “Ndị na-eme ka udo dịrị” bụ ụzọ a na-ahụkarị ma na-ada nke ọma iji kọwaa ndị na-arụ ọrụ ime udo.
  terminology: “Ezi omume,” “udo,” na “mkpụrụ” dabara n’ọrụ okwu ndị a n’amaokwu a. “Mkpụrụ” na-echekwa ihe atụ Grik ahụ, ọbụna ma okwu ahụ na-enwekwa ihe ọ pụtara dịka seed n’ọnọdụ ịgha mkpụrụ. Ala peeji a na-enye “ikpe ziri ezi” n’enweghị ịmanye otu nghọta ozizi.
