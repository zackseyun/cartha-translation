  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: ig
  text: A na-agha mkpụrụ nke ezi omume n’udo site n’aka ndị na-eme ka udo dịrị[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mkpụrụ nke ikpe ziri ezi.” Okwu Grik a nwere ike ịgụnye ma ezi omume mmadụ ma ikpe ziri ezi n’etiti ndị mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “maka ndị na-eme ka udo dịrị.” A pụrụ ịghọta dative Grik ahụ n’ụzọ dị iche, ọ bụ ezie na “site n’aka ndị na-eme ka udo dịrị” kacha daba n’ebe a n’ihi na ngwaa ahụ bụ passive.
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: mkpụrụ
  rationale: “Mkpụrụ” na-echekwa ihe atụ nke mkpụrụ a na-agha ma na-ekwe ka a ghọta ya dịka ihe ezi omume na-amịpụta.
- source_word: δὲ
  choice: A
  rationale: N’Igbo, “A” na-ejikọta amaokwu a nwayọọ na ihe bu ya ụzọ n’enweghị ime ka ọdịiche ahụ sie ike karịa ka δέ siri dị.
- source_word: δικαιοσύνης
  choice: nke ezi omume
  rationale: “Ezi omume” bụ okwu Igbo doro anya maka omume ziri ezi; ọ ka na-ahapụ ohere maka echiche nke ikpe ziri ezi, nke e depụtara n’ala peeji.
- source_word: ἐν εἰρήνῃ
  choice: n’udo
  rationale: Nke a na-edobe usoro okwu Grik ma nwee ike igosi ọnọdụ ma ọ bụ ụzọ e si agha mkpụrụ ahụ.
- source_word: σπείρεται
  choice: A na-agha
  rationale: Usoro a bụ passive dị ugbu a n’Igbo ma na-echekwa ihe atụ nke ịgha mkpụrụ.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: site n’aka ndị na-eme ka udo dịrị
  rationale: Nke a na-ewere dative ahụ dịka onye na-eme ihe n’ahịrịokwu passive ahụ, ma na-egosipụta ποιέω + εἰρήνην n’ụzọ Igbo na-ada nke ọma.
theological_decisions:
- issue: Ihe “mkpụrụ nke ezi omume” pụtara
  choice: E debere njikọ genitive ahụ dịka “mkpụrụ nke ezi omume,” ka ọ nwee ike ịpụta ihe omume ziri ezi na-amịpụta ma ọ bụ mkpụrụ nke bụ ezi omume.
  alternative: Owuwe ihe ubi nke bụ ezi omume; ma ọ bụ mkpụrụ na-eweta ezi omume.
  rationale: Grik ekpebighị kpọmkwem ụdị njikọ ahụ; nsụgharị ahụ anaghị akatọ ambiguiti a ma ọ bụ kpebie nkọwa otu ozizi.
- issue: Ọrụ dative τοῖς ποιοῦσιν εἰρήνην
  choice: 'A sụgharịrị ya dịka onye na-eme ihe: “site n’aka ndị na-eme ka udo dịrị.”'
  alternative: “Maka ndị na-eme ka udo dịrị.”
  rationale: N’akụkụ ngwaa passive σπείρεται, nghọta onye na-eme ihe dabara nke ọma, ma dative nke uru ka nwere ike ịdị, ya mere e debere ya n’ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “na-eme ka udo dịrị” kama okwu teknụzụ ma ọ bụ nke otu ụka, ma debe ihe atụ nke ịgha mkpụrụ.
