id: JAS.3.15
reference: James 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: ig
  text: Amamihe a abụghị nke na-esi n’elu arịdata, kama ọ bụ nke ụwa, nke na-abụghị nke mmụọ, nke ndị mmụọ ọjọọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: Amamihe a
  rationale: Ngosipụta a na-arụtụ aka n’amamihe ahụ a kọwara n’okwu ndị bu ụzọ; nsụgharị a kwụ ọtọ ma bụrụkwa Igbo eke.
- source_word: ἄνωθεν
  choice: si n’elu
  rationale: Ọ na-edobe echiche kpọmkwem nke isi n’elu, tinyere nghọta na isi mmalite ya bụ nke Chineke, n’akọwaghị ya karịa ihe odide ahụ kwuru.
- source_word: κατερχομένη
  choice: na-arịdata
  rationale: Ụdị ngwaa na-aga n’ihu na-akọwa amamihe ahụ dị ka ihe na-esi n’elu arịdata; okwu a doro anya ma bụrụ nke a na-eji n’Igbo ugbu a.
- source_word: ἐπίγειος
  choice: nke ụwa
  rationale: Ọ na-edobe ọdịiche dị n’etiti ihe si n’elu na ihe bụ nke ụwa, n’etinyeghị echiche sara mbara nke okwu dịka ‘nke ụwa ọjọọ.’
- source_word: ψυχική
  choice: nke na-abụghị nke mmụọ
  rationale: Ọ na-egosipụta ọdịiche ya na ihe bụ nke mmụọ n’asụsụ ndị mmadụ ga-aghọta, ebe e debere ‘nke ọdịdị mmadụ nkịtị’ dị ka ụzọ ọzọ n’ala ala peeji.
- source_word: δαιμονιώδης
  choice: nke ndị mmụọ ọjọọ
  rationale: Ọ na-egosi n’ụzọ doro anya na ụdị amamihe a metụtara ndị mmụọ ọjọọ, na-ezere okwu Igbo nwere ike ịdị mgbagwoju anya.
theological_decisions:
- issue: Ihe ψυχική pụtara n’ọdịiche dị n’etiti ihe ime mmụọ na ndụ mmadụ nkịtị
  choice: nke na-abụghị nke mmụọ
  alternative: nke ọdịdị mmadụ nkịtị
  rationale: Nhọrọ bụ isi na-egosipụta ụda na-adịghị mma na ọdịiche ya na amamihe si n’elu, ma ọ naghị ekwu hoo haa na ‘mmụọ’ ahụ bụ Mmụọ Nsọ. Ihe e dere n’ala ala peeji na-echekwa ụzọ ọzọ ziri ezi e si aghọta okwu Grik ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro njirimara atọ nke Grik na ọdịiche dị n’etiti ‘si n’elu’ na ‘nke ụwa.’
