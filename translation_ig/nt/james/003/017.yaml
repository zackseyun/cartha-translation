- from: Ma amamihe nke si n’elu bịa bụ, nke mbụ, nke dị ọcha; emesịa, ọ na-achọ udo, dị nwayọọ, dị njikere ige ntị, juputara n’ebere na ezi mkpụrụ, na-adịghị ele mmadụ anya n’ihu[a], na-enweghịkwa ihu abụọ.
  to: Ma amamihe nke si n’elu bịa, nke mbụ, dị ọcha; emesịa, ọ na-ahụ udo n’anya, dị nwayọọ, dị njikere ige ntị, jupụtakwara n’ebere na ezi mkpụrụ, na-adịghị ele mmadụ anya n’ihu[a], na-enweghị ihu abụọ.
  rationale: The revision retains every source-level meaning and the English audit trail’s deliberate ambiguity for ἀδιάκριτος. It regularizes the list in natural Standard Igbo and uses ‘na-ahụ udo n’anya’ to express a peaceable, peace-oriented disposition without reducing it to a merely tranquil state. The footnote continues to document the disputed lexical range without privileging an additional doctrinal interpretation.
