id: JAS.3.17
reference: James 3:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: ig
  text: Ma amamihe nke si n’elu bịa, nke mbụ, dị ọcha; emesịa, ọ na-ahụ udo n’anya, dị nwayọọ, dị njikere ige ntị, jupụtakwara n’ebere na ezi mkpụrụ, na-adịghị ele mmadụ anya n’ihu[a], na-enweghị ihu abụọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-enweghị nkewa” ma ọ bụ “na-enweghị obi abụọ.” Okwu Grik a nwekwara ike ịpụta “na-adịghị eme mmadụ iche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: nke si n’elu bịa
  rationale: Nke a na-edobe ihe atụ gbasara ebe amamihe ahụ si, ma ọ naghị akọwapụta ya karịa okwu Grik ahụ; n’ọnọdụ a, ọ na-emegide amamihe nke ụwa dị na amaokwu 15.
- source_word: σοφία
  choice: amamihe
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa σοφία, ma dabara n’ụdị amamihe a na-akọwa ebe a.
- source_word: πρῶτον μὲν … ἔπειτα
  choice: nke mbụ … emesịa
  rationale: 'Okwu ndị a na-egosi usoro dị n’akwụkwọ Grik: ịdị ọcha bu ụzọ, àgwà ndị ọzọ esoro ya.'
- source_word: ἁγνή
  choice: nke dị ọcha
  rationale: Ọ na-egosi ịdị ọcha n’omume na iguzosi ike n’ezi ihe, n’enweghị ntụpọ ma ọ bụ ngwakọta ihe ọjọọ.
- source_word: εἰρηνική
  choice: ọ na-achọ udo
  rationale: Nke a na-egosi ọchịchọ ime ka udo dị, ọ bụghị naanị ịnọ jụụ.
- source_word: ἐπιεικής
  choice: dị nwayọọ
  rationale: Ọ bụ okwu dị mfe nghọta nke na-egosi ịdị nro na imeso ndị ọzọ ihe n’ụzọ kwesịrị ekwesị, ọ bụ ezie na okwu Grik nwekwara echiche nke ịnagide mmadụ.
- source_word: εὐπειθής
  choice: dị njikere ige ntị
  rationale: Nke a na-egosi onye na-adịghị ekwesi olu ma dị njikere ịnụrụ ma nabata ihe kwesịrị ekwesị, n’enweghị echiche nke ikwere ihe niile n’amaghị ama.
- source_word: μεστὴ ἐλέους
  choice: juputara n’ebere
  rationale: Ọ na-edobe echiche nke ebere bara ụba dị n’okwu Grik.
- source_word: καρπῶν ἀγαθῶν
  choice: ezi mkpụrụ
  rationale: Nke a na-echekwa ihe atụ nke mkpụrụ dịka nsonaazụ ọma a na-ahụ anya, kama ịkọwa ya ozugbo dịka naanị ezi ọrụ.
- source_word: ἀδιάκριτος
  choice: na-adịghị ele mmadụ anya n’ihu
  rationale: N’usoro àgwà a na n’ìhè nke Jemis 2:1–4, nke a na-egosi enweghị mmadụ iche; n’ihi na okwu Grik ahụ nwekwara nkọwa ndị ọzọ, e debere ha n’ihe odide ala peeji.
- source_word: ἀνυπόκριτος
  choice: na-enweghịkwa ihu abụọ
  rationale: Akpaalaokwu Igbo a na-egosi enweghị aghụghọ ma ọ bụ ime ka à ga-asị na mmadụ bụ ihe ọ na-abụghị.
theological_decisions:
- issue: Nkọwa nke ἀδιάκριτος
  choice: na-adịghị ele mmadụ anya n’ihu
  alternative: enweghị nkewa n’obi; ma ọ bụ na-enweghị obi abụọ
  rationale: Okwu a nwere ike ịkọwa enweghị mmadụ iche, enweghị nkewa n’obi, ma ọ bụ enweghị obi abụọ. N’usoro a nke kwuru banyere ebere, ezi mkpụrụ, na enweghị ihu abụọ, nakwa n’ihi okwu Jemis banyere ile mmadụ anya n’ihu, nkọwa mbụ dabara nke ọma; ma e chekwara nghọta ndị ọzọ n’ihe odide ala peeji ka a ghara ikpochapụ nghọta abụọ dị n’asụsụ mbụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta nke Grik, ihe atụ nke “si n’elu” na “mkpụrụ,” na mgbagwoju anya nke ἀδιάκριτος. Akpaalaokwu “ile mmadụ anya n’ihu” na “ihu abụọ” bụ okwu Igbo ndị nkịtị ga-aghọta nke ọma.
