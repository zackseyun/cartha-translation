  to: 'Leekwa ụgbọ mmiri: ọ bụ ezie na ha buru nnọọ ibu, ifufe dị ike na-ebugharị ha, a na-eji nnọọ obere ihe ndu ụgbọ mmiri atụgharị ha gaa ebe onye na-eduzi ha chọrọ.[a]'
