    reason: lexical_alternative
  revision_rationale: The revision removes an unsupported additive, replaces an unclear rudder expression with a comprehensible Standard Igbo term, and keeps the main clause natural while preserving the Greek lexical texture of ὁρμή and βούλεται in a properly anchored footnote.
