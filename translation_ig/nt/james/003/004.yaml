review_pass:
  verdict: revise
  source_fidelity: The draft communicates the contrast between large ships driven by powerful winds and a small rudder that directs them. However, the additive -kwa attached to ‘na-ebugharịkwa’ has no basis in the Greek at that point, and ‘du ụgbọ mmiri’ is not a clear, idiomatic Standard Igbo designation for a rudder. The final expression should also retain the plural reference to the ships.
  naturalness: The revision uses ‘ihe ndu ụgbọ mmiri’ for ‘rudder,’ an intelligible modern Igbo descriptive term, and places the footnote anchor directly after the clause to which it pertains. ‘Ebe onye na-eduzi ha chọrọ’ is natural in the main text; the footnote preserves the Greek’s more marked wording involving the helmsman’s impulse/inclination.
  terminology: ‘Ụgbọ mmiri,’ ‘ifufe dị ike,’ ‘ihe ndu ụgbọ mmiri,’ and ‘onye na-eduzi’ are suitable for the nautical image. No theological terminology is at issue.
  issues:
  - severity: medium
    issue: The word -kwa is added to the wind clause.
    rationale: In ‘ifufe dị ike na-ebugharịkwa ha,’ -kwa adds ‘also’ to the driving action. Greek καί belongs with the introductory ‘Look also at the ships,’ not with the winds.
  - severity: medium
    issue: ‘Du ụgbọ mmiri’ is unclear as a noun for ‘rudder.’
    rationale: A rudder is more clearly expressed as ‘ihe ndu ụgbọ mmiri’; the current wording can be read as an imperative or otherwise feels incomplete.
  - severity: low
    issue: Singular possessive references in the final clause and footnote are imprecise.
    rationale: The antecedent is the plural ‘ụgbọ mmiri’; ‘ha’ avoids ambiguity and maintains consistent reference.
  revised_text: 'Leekwa ụgbọ mmiri: ọ bụ ezie na ha buru nnọọ ibu, ifufe dị ike na-ebugharị ha, a na-eji nnọọ obere ihe ndu ụgbọ mmiri atụgharị ha gaa ebe onye na-eduzi ha chọrọ.[a]'
  revised_footnotes:
