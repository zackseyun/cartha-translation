source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: ig
  text: 'Leekwa ụgbọ mmiri: ọ bụ ezie na ha buru nnọọ ibu, ifufe dị ike na-ebugharị ha, a na-eji nnọọ obere ihe ndu ụgbọ mmiri atụgharị ha gaa ebe onye na-eduzi ha chọrọ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ọchịchọ onye na-eduzi ha chọrọ.” N’asụsụ Grik, ihe e dere n’ụzọ nkịtị bụ, “ebe mkpali nke onye na-eduzi ha chọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: Leekwa ụgbọ mmiri
  rationale: “Leekwa” bụ okwu Igbo dị ndụ e ji adọta uche ma gosipụta ihe atụ ọzọ na-esochi nke amaokwu bu ụzọ.
- source_word: τηλικαῦτα ὄντα
  choice: ọ bụ ezie na ha buru nnọọ ibu
  rationale: Nke a na-egosipụta nnukwu ha ma na-eme ka ọdịiche dị n’etiti ụgbọ ahụ buru ibu na du ya dị obere pụta ìhè.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: ifufe dị ike na-ebugharịkwa ha
  rationale: N’ebe a σκληρῶν na-egosi ike ifufe; usoro a na-edebe echiche na ifufe bụ ihe na-akwọ ụgbọ mmiri ahụ.
- source_word: μετάγεται
  choice: a na-atụgharị ha gaa
  rationale: Okwu a pụtara iduzi ma ọ bụ ịtụgharị ụzọ ụgbọ mmiri; “na-atụgharị ... gaa” dabara n’ọrụ du ụgbọ mmiri.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: a na-eji obere du ụgbọ mmiri
  rationale: “Obere” na-egosipụta nnukwu ọdịiche ahụ n’ụzọ Igbo nkịtị; “du ụgbọ mmiri” kọwara ngwá ọrụ e ji eduzi ụgbọ mmiri n’enweghị mgbagwoju anya.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: ebe onye na-anya ya chọrọ
  rationale: Nke a bụ ntụgharị Igbo doro anya nke ebe uche ma ọ bụ mkpali onye na-eduzi ụgbọ ahụ chọrọ ka ọ gaa, ma edebere usoro Grik nke ọma karị n’ala ala peeji.
theological_decisions:
- issue: Ogo nkịtị nke ahịrịokwu gbasara uche onye na-eduzi ụgbọ
  choice: ebe onye na-anya ya chọrọ
  alternative: ebe ọchịchọ nke onye na-eduzi ya chọrọ
  rationale: Nhọrọ bụ́ isi na-asụ Igbo nke ọma ma na-edebe echiche nke ebumnuche onye na-anya ụgbọ. Ala ala peeji na-echekwa ọdịdị pụrụ iche nke okwu Grik ὁρμή na βούλεται n’enweghị itinye nkọwa okpukpe pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke doro anya ma dị nsọ n’ụda olu, dee ya. “Du ụgbọ mmiri” bụ nkọwa nghọta nke rudder; “onye na-anya ya” bụ okwu ndị mmadụ na-aghọta ngwa ngwa maka onye na-eduzi ụgbọ ahụ.
