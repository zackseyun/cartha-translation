id: JAS.3.16
reference: James 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: ig
  text: N’ihi na ebe ekworo[a] na ọchịchọ ibuli onwe onye elu dị, n’ebe ahụ ka ọgba aghara na omume ọjọọ niile dị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “anyaụfụ.” Okwu Grik ahụ nwekwara ike ịpụta “ịnụ ọkụ n’obi,” ma n’ebe a ihe gbara ya gburugburu gosiri na ọ bụ àgwà ọjọọ.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsị, “ihe ọjọọ ọ bụla” ma ọ bụ “ọrụ ọjọọ ọ bụla.” N’ụzọ nkịtị: “ihe ọ bụla rụrụ arụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: ebe
  rationale: Ọ na-ewebata ọnọdụ n’ụzọ izugbe, ma na-arụkọ ọrụ na ἐκεῖ n’usoro ‘ebe… n’ebe ahụ…’.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: ζῆλος
  choice: ekworo
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’àgwà ọjọọ, dịka ihe gbara ya gburugburu na 3:14–15 gosiri. ‘Ekworo’ bụ okwu Igbo doro anya; ‘anyaụfụ’ ka bụkwa ihe ọzọ ọ pụrụ ịpụta.
- source_word: ἐριθεία
  choice: ọchịchọ ibuli onwe onye elu
  rationale: Nhọrọ a na-egosi ịchọ ọganihu ma ọ bụ ọnọdụ maka uru onwe onye, tinyere esemokwu nke àgwà ahụ na-akpata, n’asụsụ Igbo dị mfe nghọta.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Ọ na-ejikọta kpọmkwem na ‘ebe,’ ma na-echekwa usoro okwu Grik ahụ.
- source_word: ἀκαταστασία
  choice: ọgba aghara
  rationale: Ọ na-egosi enweghị usoro na ọgba aghara n’etiti ndị mmadụ, ọ bụghị naanị mgbagwoju anya nke uche.
- source_word: πᾶν
  choice: niile
  rationale: N’Igbo, itinye ‘niile’ n’azụ aha na-enye echiche nke omume ọjọọ n’ụdị ya niile.
- source_word: φαῦλον
  choice: ọjọọ
  rationale: N’ebe a ọ na-egosi ihe rụrụ arụ n’omume. ‘Ọjọọ’ bụ okwu nkịtị, siri ike ma ghara ịgbakwunye nkọwa na-adịghị na isiokwu ahụ.
- source_word: πρᾶγμα
  choice: omume
  rationale: Ọ bụ ezie na okwu ahụ nwere ike ịbụ ‘ihe’ ma ọ bụ ‘okwu,’ ‘omume’ na-egosi nke ọma ihe ọjọọ a na-eme n’ọnọdụ a.
theological_decisions:
- issue: Ike omume nke ζῆλος n’ọnọdụ a
  choice: A sụgharịrị ya dị ka àgwà ọjọọ, ‘ekworo.’
  alternative: ‘Anyaụfụ’; ma ọ bụ ‘ịnụ ọkụ n’obi’ ma ọ bụrụ na ọ bụ n’echiche na-anọpụ iche ma ọ bụ nke ọma.
  rationale: Jemis 3:14–15 kpọrọ ya ekworo ilu ma jikọta ya na amamihe nke ụwa na nke na-abụghị nke Mmụọ. Ya mere, echiche dị mma nke ‘ịnụ ọkụ n’obi’ adabaghị n’arụmụka ebe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A chekwara usoro ilu nke Grik—‘ebe… n’ebe ahụ…’—ma zere okwu ụka pụrụ iche nke otu denominashọn.
