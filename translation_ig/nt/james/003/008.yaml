  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: ig
  text: Ma ọ dịghị onye n’ime ụmụ mmadụ nwere ike ịzụ ire[a]. Ọ bụ ajọ ihe na-enweghị izu ike[b]; ọ jupụtara na nsi na-egbu egbu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dị mfe karị, “ọ dịghị mmadụ nwere ike ịzụ ire.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ajọ ihe na-adịghị akwụsi ike” ma ọ bụ “ajọ ihe na-enweghị usoro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: ire
  rationale: E debere aha akụkụ ahụ́ ahụ kpọmkwem, n’ihi na Jemis ji ire mee ihe nnọchianya nke okwu mmadụ n’akụkụ Akwụkwọ Nsọ a.
- source_word: οὐδεὶς ... ἀνθρώπων
  choice: ọ dịghị onye n’ime ụmụ mmadụ
  rationale: Nke a na-egosipụta njikọ nkewa dị na Grik—‘ọ dịghị otu onye n’etiti ụmụ mmadụ’—ma bụrụkwa okwu Igbo doro anya.
- source_word: δαμάσαι
  choice: ịzụ
  rationale: ‘Ịzụ’ na-edobe ihe atụ nke ịzụ anụ ọhịa nke dị n’okwu ndị bu ụzọ, kama ịgbanwe ya nanị ka ọ bụrụ ‘ịchịkwa.’
- source_word: ἀκατάστατον
  choice: na-adịghị akwụsi ike
  rationale: Okwu a nwere echiche nke enweghị nkwụsi ike, enweghị izu ike, ma ọ bụ enweghị usoro. Nhọrọ a na-edobe obosara ihe okwu Grik nwere ike ịpụta.
- source_word: κακόν
  choice: ajọ ihe
  rationale: Nke a na-egosipụta ike omume ọjọọ dị na κακόν, ọ bụghị naanị ihe na-emerụ ahụ.
- source_word: μεστὴ ἰοῦ θανατηφόρου
  choice: nsi na-egbu egbu jupụtara na ya
  rationale: Nke a bụ usoro okwu Igbo dị mfe ma doo anya nke na-edobe onyinyo nke nsi nwere ike iweta ọnwụ.
theological_decisions:
- issue: Okwu gbasara mmadụ niile dị na οὐδεὶς ... ἀνθρώπων
  choice: ọ dịghị onye n’ime ụmụ mmadụ
  alternative: ọ dịghị mmadụ pụrụ ịzụ ire
  rationale: Asụsụ Igbo adịghị achọ ịkọwa nwoke ebe okwu Grik bụ maka mmadụ n’ozuzu ya. Nhọrọ a na-edobe ma echiche mmadụ niile ma usoro nkewa nke ahịrịokwu Grik.
- issue: Ike okwu banyere enweghị onye pụrụ ịzụ ire
  choice: pụrụ ịzụ
  alternative: nwere ike ịchịkwa
  rationale: E debeghị nkọwa ga-eme ka okwu a bụrụ nkwupụta banyere otu ozizi pụrụ iche; e chekwara nkwupụta siri ike nke ederede na njikọ ya na ihe atụ nke ịzụ anụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ịzụ ire’ bụ ihe atụ a kpachapụrụ anya debe iji jikọta amaokwu a na okwu banyere ịzụ anụ ndị bu ya ụzọ; nkọwa ala peeji na-enye ụzọ okwu Igbo dị mfe karị.
