id: JAS.3.3
reference: James 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: ig
  text: Ọ bụrụ na anyị etinye ígwè e ji achị ịnyịnya n’ọnụ ha ka ha wee rubere anyị isi,[a] anyị na-eduzikwa ahụ ha dum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe e ji achị ịnyịnya”; ma ihe a na-ekwu kpọmkwem bụ ígwè a na-etinye n’ọnụ ịnyịnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ọ bụrụ na
  rationale: Na-egosipụta ọnọdụ e ji amalite ihe atụ; njikọ δέ dị nro, ya mere a naghị etinye okwu ga-eme ka ọdịiche ahụ sie ike karịa isi mmalite.
- source_word: χαλινοὺς
  choice: ígwè e ji achị ịnyịnya
  rationale: N’ebe a, okwu ahụ na-ezo kpọmkwem aka n’ígwè a na-etinye n’ọnụ ịnyịnya, ọ bụghị eriri na ngwa ahụ niile; nkọwa a doro onye Igbo nke oge a anya.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: anyị etinye ... n’ọnụ ha
  rationale: Na-egosi itinye ihe ahụ n’ọnụ ịnyịnya n’asụsụ Igbo dị ire, na-enweghị ịsụgharị βάλλομεν n’ụzọ siri ike dịka ‘ịtụba.’
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: ka ha wee rubere anyị isi
  rationale: Na-echekwa ebumnuche nke articular infinitive na ihe πείθεσθαι pụtara n’ebe a, ya bụ irubere mmadụ isi.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘kwa’ na ngwaa na-egosipụta njikọ nke echiche abụọ ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ὅλον τὸ σῶμα αὐτῶν μετάγομεν
  choice: anyị na-eduzikwa ahụ ha dum
  rationale: ‘Na-eduzi’ na-egosipụta ịchịkwa ụzọ ngagharị nke ahụ niile; ‘ahụ ha dum’ na-echekwa otu ọnụọgụ σώμα nke a na-eji n’ụzọ nkesa nye ọtụtụ ịnyịnya.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji nkọwa ‘ígwè e ji achị ịnyịnya’ mee ka ihe χαλινός pụtara kpọmkwem doo anya nye ndị na-agụ akwụkwọ n’enweghị okwu teknụzụ na-adịghị ama ama.
