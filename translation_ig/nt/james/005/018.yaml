  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: ig
  text: Ọ kpere ekpere ọzọ, mbara igwe wee nye mmiri ozuzo[a], ala wee pulite mkpụrụ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “eluigwe wee nye mmiri ozuzo.” Okwu Grik a nwere ike ịpụta “eluigwe” ma ọ bụ “mbara igwe”; a họọrọ “mbara igwe” ebe a n’ihi na ihe a na-ekwu bụ ihu igwe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ala wee mee ka mkpụrụ ya pụta,” ma ọ bụ, “ala ahụ wee mịpụta ihe ubi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ọzọ
  rationale: Ọ bụ adverb na-egosi na e mere ihe ahụ ugboro ọzọ; “ọzọ” bụ ụzọ Igbo dị mkpirikpi ma dịkwa eke isi kwuo ya.
- source_word: προσηύξατο
  choice: Ọ kpere ekpere
  rationale: Aorist middle nke προσεύχομαι pụtara nanị na ọ kpere ekpere. E tinyebeghị echiche “n’ike” ma ọ bụ “nke ukwuu,” n’ihi na nke ahụ dị n’amaokwu bu ụzọ, ọ bụghị n’okwu a.
- source_word: ὁ οὐρανὸς
  choice: mbara igwe
  rationale: N’ebe a a na-ekwu maka ihu igwe na mmiri ozuzo, ya mere “mbara igwe” na-enye nghọta ahụ n’Igbo nke ọma. A naghị eji “eluigwe” n’ahịrị bụ isi ka a ghara ime ka onye na-agụ ya chee kpọmkwem banyere ebe obibi Chineke, ma e debere ya dịka ụzọ ọzọ na nkọwa ala peeji.
- source_word: ὑετὸν ἔδωκεν
  choice: nye mmiri ozuzo
  rationale: Nke a na-edobe okwu Grik ahụ nke pụtara n’ụzọ nkịtị “nyere mmiri ozuzo,” n’etinyeghị “Chineke zitere” nke na-adịghị n’ahịrịokwu a.
- source_word: ἡ γῆ
  choice: ala
  rationale: γῆ nwere ike ịpụta ụwa, ala, ma ọ bụ ala ubi. “Ala” bụ okwu Igbo eke nke dabara n’ọnọdụ ihe ọkụkụ ma ka na-anọgide n’usoro yiri “mbara igwe ... ala.”
- source_word: ἐβλάστησεν
  choice: mịpụta
  rationale: βλαστάνω na-egosi ipupụta ma ọ bụ imepụta ihe ọkụkụ. Ya na “mkpụrụ” nọ, “mịpụta” bụ okwu Igbo dị eke nke na-egosi ihe ala mepụtara.
- source_word: τὸν καρπὸν αὐτῆς
  choice: mkpụrụ ya
  rationale: καρπός n’ebe a bụ ihe ala na-amịpụta. “Mkpụrụ ya” na-edobe ihe oyiyi na nhazi nke Grik, ma nwee ike ịgụnye mkpụrụ osisi na ihe ubi n’ozuzu.
theological_decisions:
- issue: Ekpere Ịlaịja na ihe sochiri ya
  choice: E kwuru naanị na mbara igwe nyere mmiri ozuzo, ala wee mịpụta mkpụrụ ya.
  alternative: Ikwu hoo haa na Chineke zitere mmiri ozuzo.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi na nke a bụ nzaghachi Chineke nye ekpere, ma ahịrịokwu Grik n’onwe ya kwuru banyere mbara igwe na ala. Nsụgharị ahụ anaghị etinye nkọwa banyere onye mere ya karịa ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. Njikọ “wee” na-eme ka usoro ihe ndị mere doo anya ma na-ada nke ọma n’Igbo. E debere ihe oyiyi nke mbara igwe na-enye mmiri ozuzo na ala na-amịpụta mkpụrụ, n’etinyeghị nkọwa okpukpe ọzọ.
