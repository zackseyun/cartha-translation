id: JAS.5.3
reference: James 5:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: ig
  text: Ọlaedo unu na ọlaọcha unu ataala nchara[a]; nchara ha ga-abụ ihe akaebe megide unu, ọ ga-erikwa anụ ahụ unu dị ka ọkụ[b]. Unu akwakọbaala akụ n’ụbọchị ndị ikpeazụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “emebiwo.” Ọ bụ ezie na ọlaedo na ọlaọcha adịghị ata nchara n’ụzọ nkịtị, okwu Grik ahụ nwekwara ike ịpụta mmebi ma ọ bụ mgbanwe na-abịakwasị ọla.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Unu akwakọbaala akụ dị ka ọkụ n’ụbọchị ndị ikpeazụ.” Ụfọdụ na-ejikọta “dị ka ọkụ” na nkebiokwu ikpeazụ kama ijikọ ya na “ọ ga-erikwa anụ ahụ unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: ataala nchara
  rationale: Oge perfect na-egosi ọnọdụ dị ugbu a nke sitere n’ihe mere na mbụ. Okwu Igbo a na-edobe ihe atụ amụma ahụ, ọ bụ ezie na ọlaedo anaghị ata nchara n’ụzọ nkịtị.
- source_word: ἰὸς
  choice: nchara
  rationale: N’ebe a okwu ahụ na-ezo aka n’ihe na-emebi ọla ma ọ bụ akara mmebi ya. “Nchara” bụ okwu nkịtị ma doo anya n’Igbo, ma na-edobekwa njikọ okwu dị n’etiti ngwaa na aha ahụ.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: ga-abụ ihe akaebe megide unu
  rationale: 'Nke a na-egosipụta ọnọdụ ikpe: nchara nke akụ ha ga-egosi ikpe megide ha.'
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: ọ ga-erikwa anụ ahụ unu
  rationale: Nsụgharị a na-edobe ihe atụ siri ike nke iri anụ ahụ, kama ime ka ya dị nro site n’iji okwu dịka “ibibi.”
- source_word: σάρκας
  choice: anụ ahụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’anụ ahụ mmadụ n’ihe atụ banyere mbibi na ikpe, ọ bụghị n’ọchịchọ mmehie.
- source_word: ὡς πῦρ
  choice: dị ka ọkụ
  rationale: A jikọtara ya na nkebiokwu bu ya ụzọ, ka nchara ahụ na-eri anụ ahụ ha dị ka ọkụ; nke a bụ njikọ kacha kwekọọ na usoro na echiche ahịrịokwu ahụ.
- source_word: ἐθησαυρίσατε
  choice: akwakọbaala akụ
  rationale: Okwu a na-egosi ịchịkọta ma chekwaa akụ. “Ịkwakọba akụ” na-ebupụta ọdịnaya lexical ahụ n’enweghị ịgbakwunye nkọwa nke ịkpa anyaukwu n’ime ngwaa ahụ n’onwe ya.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: n’ụbọchị ikpeazụ ndị a
  rationale: N’asụsụ Igbo, “ndị a” na-eme ka ojiji ụbọchị ọtụtụ doo anya ma kwekọọ n’echiche nke oge ikpeazụ nke ndị ahụ nọ n’ime ya.
theological_decisions:
- issue: Njikọ ὡς πῦρ n’ime ahịrịokwu ahụ
  choice: 'E jikọtara “dị ka ọkụ” na nkebiokwu bu ya ụzọ: nchara ahụ ga-eri anụ ahụ ha dị ka ọkụ.'
  alternative: 'A pụrụ ijikọ ya na nkebiokwu na-esote: “Unu akwakọbaala akụ dị ka ọkụ n’ụbọchị ikpeazụ.”'
  rationale: Usoro okwu ozugbo na echiche zuru ezu na-akwado njikọ ya na “ga-eri anụ ahụ unu.” Ma ebe njikọ ọzọ nwere akụkọ nsụgharị ma bụrụkwa ihe usoro Grik nwere ike ikwe, e debere ya n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ndị siri ike nke nchara, akaebe, iri anụ ahụ, ọkụ, na ịkwakọba akụ; a kọwakwara mgbagwoju anya nke njikọ “dị ka ọkụ” n’ala ala peeji.
