review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys πλοῦτος (“wealth”), σέσηπεν (“has rotted”), ἱμάτια (“clothes”), and the moth-damage image of σητόβρωτα. However, the enclitic -kwa in “aghọọkwala” adds an additive sense (“also”) not expressed by γέγονεν or by the Greek conjunction καί.
  naturalness: “Ereela ure” is clear and vivid. Recasting the final clause as “aghọọla ihe nla tara” is more idiomatic and avoids the somewhat incomplete-sounding nominal construction “aghọọkwala nke nla tara.”
  terminology: “Akụ na ụba” and “uwe” are suitable Standard Igbo equivalents. “Nla” appropriately represents moths; its unmarked number permits a generic collective sense in context.
  issues:
  - severity: low
    issue: The form “aghọọkwala” contains the additive particle -kwa.
    rationale: The source has γέγονεν (“have become”) without an explicit “also.” The preceding καί simply coordinates the clauses and does not require an additive particle in Igbo.
  - severity: low
    issue: “Nke nla tara” is less natural here as the complement of collective “uwe.”
    rationale: “Ihe nla tara” naturally expresses “things moths have eaten” while retaining the concrete moth-eaten imagery and the resultant-state sense of γέγονεν.
  revised_text: Akụ̀ na ụba unu ereela ure, uwe unu aghọọla ihe nla tara.
