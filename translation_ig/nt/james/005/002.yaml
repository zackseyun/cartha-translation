  text: ὁ πλοῦτος ὑμῶν σέσηπεν, καὶ τὰ ἱμάτια ὑμῶν σητόβρωτα γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/james/005/002.yaml
  text: Your wealth has rotted, and your clothes have become moth-eaten.
translation:
  language: ig
  text: Akụ̀ na ụba unu ereela ure, uwe unu aghọọla ihe nla tara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: akụ̀ na ụba
  rationale: Nkebi okwu a bụ ụzọ Igbo dị ugbu a na nke sara mbara isi kwuo akụ mmadụ chịkọbara; ọ dabara n'ịba mba ndị ọgaranya Jemis na-eme.
- source_word: σέσηπεν
  choice: ereela ure
  rationale: Ụdị perfect a na-egosi ihe rere ure nke ọnọdụ ya ka dị ugbu a. “Ereela ure” na-edobe ma onyinyo ire ure ma nsonaazụ ya.
- source_word: ἱμάτια
  choice: uwe
  rationale: “Uwe” bụ okwu Igbo doro anya ma bụrụkwa nke sara mbara maka ihe mmadụ na-eyi, n'etinyeghị ụdị uwe pụrụ iche na-adịghị n'okwu Grik.
- source_word: σητόβρωτα
  choice: nke nla tara
  rationale: Nke a na-egosipụta kpọmkwem onyinyo uwe ụmụ ahụhụ nla riri, n'okwu Igbo nkịtị ma doo anya.
- source_word: γέγονεν
  choice: aghọọkwala
  rationale: “Aghọọkwala” na-egosipụta mgbanwe rutere n'ọnọdụ ka dị ugbu a, nke kwekọrọ n'ike perfect nke γίνομαι; “-kwa-” na-ejikọta nkebi nke abụọ na nke mbụ.
