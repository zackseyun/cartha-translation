translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere onyinyo ihe onwunwe na-ere ure na uwe nla tara n'ụzọ kpọmkwem, na-enweghị ịgbakwunye nkọwa ozizi.
