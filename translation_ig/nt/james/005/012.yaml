revisions:
- from: Ma nke kachasị mkpa, ụmụnna m,[a] unu aṅụla iyi, ma ọ bụ n’eluigwe, ma ọ bụ n’ala, ma ọ bụkwanụ iyi ọ bụla ọzọ. Kama, ka “Ee” unu bụrụ ee, ka “Mba” unu bụrụ mba, ka unu ghara ịdaba n’okpuru ikpe.[b]
  to: Ma, karịa ihe niile, ụmụnna m,[a] unu ejila eluigwe, ma ọ bụ ala, ma ọ bụ iyi ọ bụla ọzọ ṅụọ iyi. Kama, ka “ee” unu bụrụ ee, ka “mba” unu bụrụ mba, ka unu ghara ịdaba n’okpuru ikpe.[b]
  rationale: The revision uses an idiomatic Igbo instrumental construction (“ejila … ṅụọ iyi”) for swearing by heaven, earth, or another oath, while retaining the source’s comprehensive prohibition. It also improves the opening idiom and corrects the explanatory footnote without narrowing κρίσις or imposing a doctrinal sense.
