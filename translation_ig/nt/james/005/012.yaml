review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition on oath-taking, the heaven/earth/other-oath sequence, the contrasting call to plain truthfulness, and the broad sense of κρίσις as “judgment.” However, “n’eluigwe” and “n’ala” normally mean “in heaven” and “on earth” in Igbo, rather than the instrumental sense “by heaven/by earth” required by the Greek oath formula.
  naturalness: The overall register is clear Standard Igbo, but the oath formula needs an idiomatic instrumental construction. “Karịa ihe niile” is also more direct and natural for Πρὸ πάντων than “nke kachasị mkpa.” The footnote contains the orthographic spacing error “ndịanyị.”
  terminology: “Ịṅụ iyi” appropriately identifies oath-taking rather than profanity. “Ụmụnna m” is a natural community address in Standard Igbo. “Ikpe” properly retains the breadth of κρίσις; “ikpe ọmụma” may be retained as a stronger alternative in the footnote.
  issues:
  - severity: medium
    issue: The phrases “n’eluigwe” and “n’ala” do not clearly express swearing “by” heaven or earth.
    rationale: In ordinary Igbo these locatives mean “in heaven” and “on earth.” Recasting with “iji” expresses the instrumental oath formula without altering the scope of the prohibition.
  - severity: low
    issue: The opening “nke kachasị mkpa” is less idiomatic and slightly more explanatory than needed.
    rationale: “Karịa ihe niile” naturally preserves the emphatic prioritizing force of Πρὸ πάντων.
  - severity: low
    issue: Footnote a has a spacing/orthography error and overstates the Greek wording as explicitly “brothers who are male.”
    rationale: Correct “ndịanyị” to “ndị nwanyị” and describe the grammatical masculine plural without suggesting that the Greek phrase itself contains an added word meaning “male.”
  revised_text: Ma, karịa ihe niile, ụmụnna m,[a] unu ejila eluigwe, ma ọ bụ ala, ma ọ bụ iyi ọ bụla ọzọ ṅụọ iyi. Kama, ka “ee” unu bụrụ ee, ka “mba” unu bụrụ mba, ka unu ghara ịdaba n’okpuru ikpe.[b]
  revised_footnotes:
  - marker: a
    text: Grik ji okwu ọtụtụ nwoke sụpụta “ụmụnna m,” ma o yikarịrị ka ọ na-agwa ndị kwere ekwe niile, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka unu ghara ịdaba n’okpuru ikpe ọmụma.”
    reason: alternative_reading
  revision_rationale: The revision uses an idiomatic Igbo instrumental construction (“ejila … ṅụọ iyi”) for swearing by heaven, earth, or another oath, while retaining the source’s comprehensive prohibition. It also improves the opening idiom and corrects the explanatory footnote without narrowing κρίσις or imposing a doctrinal sense.
