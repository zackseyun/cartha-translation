id: JAS.5.12
reference: James 5:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: ig
  text: Ma, karịa ihe niile, ụmụnna m,[a] unu ejila eluigwe, ma ọ bụ ala, ma ọ bụ iyi ọ bụla ọzọ ṅụọ iyi. Kama, ka “ee” unu bụrụ ee, ka “mba” unu bụrụ mba, ka unu ghara ịdaba n’okpuru ikpe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik ji okwu ọtụtụ nwoke sụpụta “ụmụnna m,” ma o yikarịrị ka ọ na-agwa ndị kwere ekwe niile, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka unu ghara ịdaba n’okpuru ikpe ọmụma.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: nke kachasị mkpa
  rationale: Nkebiokwu a na-egosi ihe e kwesịrị ile dị ka nke kacha mkpa n’ime ndụmọdụ ndị a; nsụgharị a bụ Igbo dị mfe ma na-echekwa ike nkwusiri okwu ahụ.
- source_word: ἀδελφοί μου
  choice: ụmụnna m
  rationale: “Ụmụnna” bụ ụzọ ebumpụta ụwa n’Igbo isi kpọọ ndị otu okwukwe, ma ọ naghị egbochi ụmụanyị dịka okwu Bekee “brothers” nwere ike ime; ihe odide Grik ji aha nwoke ọtụtụ nke nwere ike ịnọchite anya ọgbakọ dum.
- source_word: μὴ ὀμνύετε
  choice: unu aṅụla iyi
  rationale: “Ịṅụ iyi” na-egosi ime iyi, ọ bụghị ikwu okwu rụrụ arụ. Ụdị a na-enye iwu izugbe ka a ghara ime ya.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν
  choice: ma ọ bụ n’eluigwe, ma ọ bụ n’ala
  rationale: N’Igbo, a na-asị mmadụ ṅụrụ iyi “n’” ihe; nhazi a na-echekwa mmachibido iwu abụọ ahụ n’asụsụ na-aga were were.
- source_word: μήτε ἄλλον τινὰ ὅρκον
  choice: ma ọ bụkwanụ iyi ọ bụla ọzọ
  rationale: Nke a na-echekwa oke sara mbara nke τινά na echiche nke iyi ọzọ ọ bụla, na-enweghị ịgbakwụnye ụdị iyi a na-ekwughị.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: Kama, ka “Ee” unu bụrụ ee, ka “Mba” unu bụrụ mba
  rationale: Ọ na-echekwa nkenke na nkwughachi ilu ahụ, ebe “Kama” na-egosi ọdịiche nke δέ n’ụzọ Igbo doro anya.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: ka unu ghara ịdaba n’okpuru ikpe
  rationale: “N’okpuru ikpe” na-anọ nso n’ụdị okwu Grik ὑπὸ κρίσιν, ebe “ịdaba” na-echekwa ihe oyiyi dị na πέσητε.
theological_decisions:
- issue: Ma κρίσις ọ pụtara ikpe n’ozuzu ya ka ọ bụ ikpe ọmụma siri ike
  choice: ikpe
  alternative: ikpe ọmụma
  rationale: κρίσις nwere ike ịpụta ikpe n’echiche sara mbara, ọ dịghịkwa mkpa ka ọ bụrụ ikpe ọmụma ikpeazụ. Isi ederede ya mere echekwala obosara na mgbagwoju anya ahụ; ihe ọzọ dị n’ala peeji.
- issue: Otu e si akọwa ἀδελφοί mgbe a na-agwa ọgbakọ nwere ndị nwoke na ndịanyị
  choice: ụmụnna m
  alternative: ụmụnne m ndị nwoke
  rationale: N’Igbo Standard, “ụmụnna” bụ okwu kwesịrị ekwesị maka ndị otu obodo ma ọ bụ okwukwe, ụmụanyị sokwa na ndị a na-akpọ. Ọ na-eburu ọrụ nnọchianya nke ọtụtụ nwoke Grik n’enweghị ịmachi ndị a na-agwa okwu naanị n’ebe ndị nwoke nọ.
translation_notes:
  register: E ji Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. “Ịṅụ iyi” na-ekewa iyi a na-ekwu maka ya n’ebe a na okwu mkparị. E debere nkwughachi “Ee…ee” na “Mba…mba” iji chekwaa ụda ilu dị mkpirikpi nke Grik.
