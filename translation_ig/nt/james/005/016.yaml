id: JAS.5.16
reference: James 5:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: ig
  text: Ya mere, kwupụtanụ mmehie unu nye ibe unu, kpekwaranụ ekpere maka ibe unu, ka e wee gwọọ unu. Arịrịọ onye ezi omume nwere ike dị ukwuu mgbe ọ na-arụ ọrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị: “Arịrịọ onye ezi omume na-arụpụta ihe nwere ike dị ukwuu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: kwupụtanụ
  rationale: Okwu a na-egosi ikweta ma kwupụta mmehie n’ihu ibe mmadụ. “Kwupụtanụ” na-edobe iwu ahụ na ọdịdị nkwupụta ghe oghe, n’etinyeghị usoro sacrament nke ederede ahụ ekwughị kpọmkwem.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya banyere ekpere, mmehie, na mgbake.
- source_word: ἀλλήλοις / ὑπὲρ ἀλλήλων
  choice: nye ibe unu / ibe unu
  rationale: “Ibe unu” na-egosi na omume abụọ ahụ bụ nke ndị kwere ekwe na-emere ibe ha n’otu n’otu.
- source_word: τὰς ἁμαρτίας
  choice: mmehie unu
  rationale: “Mmehie” bụ ntụgharị kpọmkwem; “unu” na-eme ka njikọ ya na iwu a na-enye ndị a na-agwa doo anya n’Igbo.
- source_word: εὔχεσθε
  choice: na-ekpekwaranụ ... ekpere
  rationale: Nke a bụ iwu ka ha na-ekpere ibe ha ekpere; “-kwara-” na-ejikọta ya nke ọma na iwu mbụ.
- source_word: ὅπως ἰαθῆτε
  choice: ka e wee gwọọ unu
  rationale: Na-edobe ebumnuche ma ọ bụ ihe ga-esi na ya pụta, tinyere passive nke ngwaa ahụ. “Gwọọ” na-ahapụ ụdị ọgwụgwọ ahụ ka ọ saa mbara dịka okwu Grik si dị.
- source_word: πολὺ ἰσχύει
  choice: nwere ike dị ukwuu
  rationale: Na-egosi ike na nrụpụta dị ukwuu n’enweghị ịkọwapụta kpọmkwem ụdị ihe ekpere ahụ ga-arụpụta.
- source_word: δέησις
  choice: Arịrịọ
  rationale: “Arịrịọ” na-egosipụta kpọmkwem ekpere a na-arịọ ihe karịa okwu sara mbara bụ “ekpere.”
- source_word: δικαίου
  choice: onye ezi omume
  rationale: Adjective a na-arụ ọrụ dịka aha mmadụ n’ozuzu; “onye” anaghị amachibido ya n’ebe nwoke nọ.
- source_word: ἐνεργουμένη
  choice: mgbe ọ na-arụ ọrụ
  rationale: Na-edobe participle ahụ na echiche nke arịrịọ na-arụ ọrụ, ma na-ezere ikpebi kpamkpam ma ụdị ya ọ bụ middle ka ọ bụ passive.
theological_decisions:
- issue: Ma amaokwu a ọ na-enye iwu nkwupụta sacrament nye ndị ụkọchukwu, ka ọ bụ nkwupụta mmehie n’etiti ndị kwere ekwe
  choice: nkwupụta mmehie nye ibe unu
  alternative: nkwupụta nke onye ụkọchukwu na-anabata
  rationale: ἀλλήλοις bụ nnọchiaha reciprocity nke na-egosi na ndị a na-agwa okwu ga-eme nke a n’etiti onwe ha. A naghị etinye usoro ụka a na-akpọghị aha n’ederede.
- issue: Oke ọgwụgwọ dị na ἰαθῆτε
  choice: ka e wee gwọọ unu
  alternative: ka ahụ unu naanị wee dị mma; ma ọ bụ ka e gwọọ mkpụrụ obi unu naanị
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-ekwu maka ọrịa anụ ahụ, ma ọ na-ekwukwa maka mmehie. “Gwọọ” na-ahapụ njikọ abụọ ahụ n’enweghị imechi nghọta ya n’otu akụkụ naanị.
- issue: Okike mmadụ na δικαίου
  choice: onye ezi omume
  alternative: nwoke ezi omume
  rationale: Ụdị masculine singular nke Grik bụ nke a na-eji n’ozuzu n’okwu ilu; “onye” na-ebufe ya n’ụzọ ziri ezi ma ghara ime ka ọ bụrụ naanị nwoke.
- issue: Ihe ἐνεργουμένη pụtara
  choice: mgbe ọ na-arụ ọrụ
  alternative: mgbe e mere ka ọ rụọ ọrụ; ma ọ bụ mgbe ọ dị irè
  rationale: Ụdị middle/passive nke participle ahụ nwere nghọta karịrị otu. Isi ederede na-edobe ihe oyiyi nke arịrịọ na-arụ ọrụ, ebe nkọwa ala na-enye ntụgharị nke na-elekwasị anya n’ike ya.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji plural imperative “-nụ” mee ka iwu ndị ahụ doo anya; a zere okwu ụka pụrụ iche na nkọwa ga-amachibido ọgwụgwọ ahụ n’anụ ahụ ma ọ bụ n’ime mmụọ naanị.
