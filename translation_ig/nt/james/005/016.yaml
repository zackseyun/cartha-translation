revisions:
- from: Ya mere, kwupụtanụ mmehie unu nye ibe unu, na-ekpekwaranụ ibe unu ekpere, ka e wee gwọọ unu. Arịrịọ onye ezi omume nwere ike dị ukwuu mgbe ọ na-arụ ọrụ.[a]
  to: Ya mere, kwupụtanụ mmehie unu nye ibe unu, kpekwaranụ ekpere maka ibe unu, ka e wee gwọọ unu. Arịrịọ onye ezi omume nwere ike dị ukwuu mgbe ọ na-arụ ọrụ.[a]
  rationale: The revision changes only the second imperative clause to natural Standard Igbo and makes the intercessory force of ὑπὲρ ἀλλήλων explicit. The reciprocal confession, broad healing language, generic “onye,” and the deliberately noncommittal rendering of ἐνεργουμένη are retained. The footnote anchor remains attached to the final clause it elucidates.
  reviewer_model: gpt-5.6-terra
