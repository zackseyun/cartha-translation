id: JAS.5.14
reference: James 5:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: ig
  text: Ọ̀ dị onye ọ bụla n’etiti unu na-arịa ọrịa[a]? Ka ọ kpọọ ndị okenye ọgbakọ; ka ha kpee ekpere n’elu ya ma tee ya mmanụ[b] n’aha Onyenweanyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị mmalite ahịrịokwu a, “Ọ̀ dị onye ọ bụla n’etiti unu na-adịghị ike?” Okwu Grik ahụ nwere ike ịpụta adịghị ike n’ozuzu ya, ma n’ebe a, o yikarịrị ka ọ na-ekwu maka ọrịa n’ihi ekpere, ite mmanụ, na ọgwụgwọ e kwuru n’amaokwu na-esote.
    reason: lexical_alternative
  - marker: b
    text: Ite mmanụ ahụ nwere ike ịbụ maka ọgwụgwọ, ihe nnọchianya, ma ọ bụ ha abụọ; ederede ahụ akọwaghị kpọmkwem ka a ga-esi aghọta ọrụ ya.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: na-arịa ọrịa
  rationale: N’agbanyeghị na okwu Grik a nwekwara ike ịpụta ịdị adịghị ike, ọnọdụ a—ekpere, ite mmanụ, na ọgwụgwọ e kwuru n’amaokwu na-esote—na-egosi ọrịa anụ ahụ dịka ihe bụ isi.
- source_word: τις ἐν ὑμῖν
  choice: onye ọ bụla n’etiti unu
  rationale: Nke a na-edobe echiche onye ọ bụla n’ime ndị a na-agwa okwu, n’asụsụ Igbo doro anya ma dịkwa eke.
- source_word: προσκαλεσάσθω
  choice: ka ọ kpọọ
  rationale: Na-egosipụta iwu onye nke atọ nke pụtara ka onye ọrịa kpọọ ndị okenye ka ha bịa.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: ndị okenye ọgbakọ
  rationale: N’ebe a, πρεσβύτεροι bụ ndị ndu a ma ama n’ọgbakọ ndị Kraịst, ọ bụghị naanị ndị nwoke merela agadi.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: ka ha kpee ekpere n’elu ya
  rationale: Na-edobe ike iwu ahụ na ihe ἐπί pụtara n’ọnọdụ ekpere a na-ekpe n’elu onye ọrịa.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: tee ya mmanụ
  rationale: Okwu a na-egosi itinye mmanụ n’ahụ onye ahụ, ma ọ naghị ekpebi ma ebumnuche ya ọ bụ ọgwụgwọ, ihe nnọchianya, ma ọ bụ ha abụọ.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: n’aha Onyenweanyị
  rationale: Na-edobe akpaalaokwu Akwụkwọ Nsọ nke igosi na a na-eme ihe ahụ n’aha na ikike nke Onyenweanyị.
theological_decisions:
- issue: Ihe ἀσθενεῖ pụtara n’ebe a
  choice: ịrịa ọrịa bụ isi echiche dị n’ahịrịokwu ahụ
  alternative: ịdị adịghị ike n’ozuzu ya, tinyere adịghị ike ime mmụọ
  rationale: Ọkpụkpọ ndị okenye, ekpere, ite mmanụ, na okwu banyere ibuli onye ahụ n’amaokwu na-esote na-akwado ọrịa anụ ahụ, ma ndetu ahụ na-echekwa obosara okwu Grik ahụ.
- issue: Ọrụ ite mmanụ
  choice: ịsụgharị ya n’ụzọ na-anọpụ iche dịka “tee ya mmanụ”
  alternative: ịkọwa ya kpọmkwem dịka ọgwụgwọ, ihe nnọchianya, ma ọ bụ emume sakrament
  rationale: Ihe odide Grik kwuru omume ahụ, ma ọ kọwaghị kpọmkwem ụzọ mmanụ ahụ si arụ ọrụ; ya mere, a zere itinye ozizi otu ụka n’ime ya.
- issue: Onye a na-ekwu maka ya na nnọchiaha
  choice: iji “onye ọ bụla” na “ọ/ya”
  alternative: ịkọwa onye ahụ dịka nwoke kpọmkwem
  rationale: τις bụ onye a na-akọwaghị, nke gụnyere onye ọ bụla; nnọchiaha Igbo “ọ/ya” na-edobe otu onye n’ụzọ eke na-enweghị ịgbakwunye okike mmadụ nke na-adịghị mkpa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọgbakọ” na-egosi obodo ndị kwere ekwe n’enweghị itinye usoro otu ụka pụrụ iche; “Onyenweanyị” na-edobe aha nsọpụrụ κύριος. E tinyere akara ndetu [a] na [b] n’ahịrịokwu bụ isi.
