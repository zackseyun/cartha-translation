  source_fidelity: 'The main rendering accurately conveys the Greek: illness is appropriately primary for ἀσθενεῖ; the sick person is to call the church elders; they are to pray over him and anoint him with oil in the Lord’s name. “Ndị okenye ọgbakọ,” “n’elu ya,” and “n’aha Onyenweanyị” are suitable Standard Igbo renderings. The plural commands governed by “ka ha” naturally convey the two imperatives.'
  naturalness: The text is clear, modern, and appropriately dignified. Coordinating the elders’ two actions with “ma” is slightly smoother than separating them only with a comma. The cultural footnote is made more idiomatic by referring to what the text does not specifically explain about the anointing.
  terminology: “Ọgbakọ” is an appropriate non-denominational rendering of ἐκκλησία, and “ndị okenye” correctly identifies πρεσβύτεροι as church elders. “Tee ya mmanụ” is natural for ἀλείψαντες αὐτὸν ἐλαίῳ and does not prejudge the oil’s function. “Onyenweanyị” appropriately renders κύριος as a reverential title.
  issues:
