    issue: Footnote anchors are attached to the wrong phrases.
    rationale: Footnote [a] explains the alternative sense of ἀσθενεῖ and must be anchored to “na-arịa ọrịa,” not to “ọgbakọ.” Footnote [b] concerns anointing with oil and must be anchored immediately after “mmanụ,” rather than after “Onyenweanyị.”
