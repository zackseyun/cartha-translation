revisions:
- from: ka ọ mara na onye ọ bụla nke mere ka onye mmehie si n'ụzọ njehie ya lọghachi ga-azọpụta mkpụrụ obi ya n'ọnwụ, kpuchiekwa ọtụtụ mmehie[a][b].
  to: ka ọ mara na onye ọ bụla nke na-eme ka onye mmehie si n'ijehie ụzọ ya laghachi ga-azọpụta mkpụrụ obi ya n'ọnwụ, ma ga-ekpuchi ọtụtụ mmehie[a][b].
  rationale: The revision retains the source text’s generic restorer, its path/error imagery, and the unresolved antecedent of “ya.” It improves Standard Igbo idiom and explicitly represents the two coordinated future verbs without adding theological interpretation.
