reference: James 5:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: ig
  text: ka ọ mara na onye ọ bụla nke na-eme ka onye mmehie si n'ijehie ụzọ ya laghachi ga-azọpụta mkpụrụ obi ya n'ọnwụ, ma ga-ekpuchi ọtụtụ mmehie[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ga-azọpụta ndụ ya n'ọnwụ.” Okwu Grik a pụrụ ịpụta “mkpụrụ obi” ma ọ bụ “ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Nnọchiaha “ya” nwere ike ịrụtụ aka n'onye mmehie e mere ka ọ laghachi; ụfọdụ na-aghọta na ọ na-arụtụ aka n'onye mere ka ọ laghachi.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: ka ọ mara
  rationale: Nke a na-egosipụta iwu dị n'ụdị onye nke atọ otu, n'Igbo dị ugbu a ma dịkwa mfe nghọta.
- source_word: ὁ ἐπιστρέψας
  choice: onye ọ bụla nke mere ka ... lọghachi
  rationale: Ọ na-egosipụta onye ọ bụla nke na-eme ka onye kpafuru akpafu laghachi, na-enweghị iji okwu nwere nkọwa okpukpe pụrụ iche.
- source_word: ἁμαρτωλὸν
  choice: onye mmehie
  rationale: Ọ na-egosipụta ụdị mmadụ a na-ekwu maka ya n'ozuzu, dịka okwu Grik na-enweghị artikụl si dị.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: si n'ụzọ njehie ya
  rationale: ‘Ụzọ’ na-echekwa ihe atụ nke ụzọ ndụ, ebe ‘njehie’ na-egosipụta mmejọ ma ọ bụ ịkpafu dị na πλάνη.
- source_word: σώσει
  choice: ga-azọpụta
  rationale: Ọ na-echekwa ike na mkpa nke σῴζω, kama ime ka ọ bụrụ naanị inyere mmadụ aka pụọ n'ihe ize ndụ.
- source_word: ψυχὴν αὐτοῦ
  choice: mkpụrụ obi ya
  rationale: ‘Mkpụrụ obi’ bụ ntụgharị a na-ahụkarị maka ψυχή ma na-echekwa ịdị arọ nke amaokwu ahụ; ‘ya’ hapụrụ onye nnọchiaha ahụ ka ọ ghara ịkọwapụta onye ọ na-arụtụ aka n'ụzọ ederede Grik na-ekwughị kpọmkwem.
- source_word: ἐκ θανάτου
  choice: n'ọnwụ
  rationale: Ọ na-edobe ‘ọnwụ’ n'ozuzu ya, na-akọwaghị ya dị ka ọnwụ anụ ahụ ma ọ bụ nke mmụọ naanị.
- source_word: καλύψει
  choice: kpuchiekwa
  rationale: Ọ na-echekwa ihe atụ Akwụkwọ Nsọ nke ikpuchi mmehie, ma jikọta ya n'ụzọ Igbo na nkebiokwu bu ya ụzọ.
- source_word: πλῆθος ἁμαρτιῶν
  choice: ọtụtụ mmehie
  rationale: Nke a bụ ụzọ Igbo eke si egosipụta nnukwu ọnụ ọgụgụ mmehie nke πλῆθος na-ekwu maka ya.
theological_decisions:
- issue: Onye αὐτοῦ dị na ψυχὴν αὐτοῦ na-arụtụ aka na ya
  choice: E dere ya dịka ‘mkpụrụ obi ya’ n'akọwaghị onye ‘ya’ bụ n'ahịrị bụ isi.
  alternative: Ọ pụrụ ịbụ mkpụrụ obi onye mmehie a mere ka ọ laghachi, ma ọ bụ mkpụrụ obi onye mere ka ọ laghachi.
  rationale: Usoro okwu Grik nwere ike ikwe ka onye nnọchiaha ahụ rụtụ aka n'onye nke ọ bụla. Ịhapụ ‘ya’ n'ahịrị bụ isi na-edobe mgbagwoju anya ahụ; nkọwa ala peeji na-egosi ụzọ abụọ ahụ.
- issue: Ihe ψυχή na θάνατος pụtara
  choice: mkpụrụ obi ... n'ọnwụ
  alternative: ndụ ... n'ọnwụ
  rationale: Amaokwu ahụ pụrụ ịgụnye ndụ mmadụ, nzọpụta ime mmụọ, ma ọ bụ ha abụọ. A naghị eme ka okwu ahụ kwado naanị otu nkọwa ozizi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ihe atụ ‘ụzọ,’ ‘ịzọpụta,’ na ‘ikpuchi mmehie’ iji chekwaa njikọ na ịdị arọ nke okwu mbụ, ebe ‘ọtụtụ mmehie’ na-enye ụda Igbo eke.
