source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: ig
  text: Bianụ ugbu a, unu ndị ọgaranya! Beenụ akwa, na-etikwa mkpu arịrị[a] n’ihi ahụhụ[b] ndị na-abịakwasị unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-akwa arịrị n’oké olu.” Okwu Grik ahụ na-egosi akwa arịrị a na-anụ nke ọma.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ahụhụ” dịka “ọdachi” ma ọ bụ “nhụsianya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Geenụ ntị ugbu a
  rationale: Nke a bụ okwu e ji akpọ ndị mmadụ òkù n’ike ma ọ bụ malite ịbara ha mba. Nsụgharị a na-enye ike okwu ahụ n’Igbo nkịtị, kama ịsụgharị ya dịka ịkpọ ha ka ha jiri ụkwụ bịa.
- source_word: οἱ πλούσιοι
  choice: unu ndị ọgaranya
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n’ụdị nominative, a na-eji ya ebe a akpọ ndị ọgaranya okwu ozugbo. “Unu” na-eme ka nke a doo anya n’Igbo.
- source_word: κλαύσατε
  choice: Beenụ akwa
  rationale: Ọ bụ iwu ka ha malite ịkwa akwa n’ihu ahụhụ na-abịa; okwu a na-edobe ịdị arọ nke ịdọ aka ná ntị ahụ.
- source_word: ὀλολύζοντες
  choice: na-etikwa mkpu arịrị
  rationale: Okwu a na-egosi ịkwa arịrị n’oké olu, ọ bụghị naanị anya mmiri. Ụdị a na-esochi iwu bụ isi ma na-egosi omume na-aga n’ihu.
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: n’ihi ahụhụ
  rationale: ἐπί na dative na-egosi ihe kpatara ma ọ bụ ihe ndabere nke ịkwa arịrị; “n’ihi” bụ ụzọ Igbo si kwuo ya n’enweghị mgbagwoju anya.
- source_word: ταῖς ἐπερχομέναις
  choice: ndị na-abịakwasị unu
  rationale: Ọ na-akọwa ahụhụ ndị ahụ dịka ihe na-abịa ịdakwasị ndị a na-agwa okwu, ma ọ naghị ekwubiga ngwa ngwa nke ọbịbịa ahụ ókè.
theological_decisions:
- issue: Ndị okwu ahụ bụ “ndị ọgaranya” na ụdị ikpe na-abịanụ
  choice: E debere ya dịka ịbara ndị ọgaranya mba n’ụzọ amụma maka ahụhụ na-abịakwasị ha, n’ekwughị ma ha bụ ndị kwere ekwe ka ha abụghị.
  alternative: Ịkọwa ha kpọmkwem dịka ndị nwe ala na-emegbu ndị ọzọ na-ekweghị ekwe, ma ọ bụ dịka ndị ọgaranya nọ n’ime ọgbakọ Ndị Kraịst.
  rationale: Amaokwu a n’onwe ya kpọrọ naanị “ndị ọgaranya” aha ma kwuo maka ahụhụ na-abịa. Ya mere, nsụgharị ahụ anaghị etinye nkọwa gbasara ọnọdụ okwukwe ha nke ederede a na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. Akara mkpu na-egosipụta ụda ịkpọ òkù na ịbara mba siri ike dị n’ederede Grik; a zere okwu ụka pụrụ iche ma debe mgbagwoju anya banyere ndị a na-agwa okwu.
