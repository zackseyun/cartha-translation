id: JAS.5.10
reference: James 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: ig
  text: Ụmụnna[a], werenụ ndị amụma kwuru okwu n’aha Onyenwe anyị dịka ihe atụ nke ịta ahụhụ na ndidi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” sụgharịrị ἀδελφοί, nke dị n’ụdị ọtụtụ nke nwoke; n’ebe a, o yikarịrị ka Jems na-agwa ọgbakọ ndị kwere ekwe okwu, gụnyere ụmụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: ihe atụ
  rationale: Ọ pụtara ihe nlereanya e kwesịrị iṅomi; “ihe atụ” bụ okwu Igbo doro anya ma kwekọọ n’ike ndụmọdụ dị n’amaokwu a.
- source_word: λάβετε
  choice: werenụ ... dịka
  rationale: Ụdị iwu a pụtara ‘werenụ’; njikọ ya na ‘dịka ihe atụ’ na-egosipụta usoro Greek n’Igbo dị mma.
- source_word: ἀδελφοί
  choice: Ụmụnna
  rationale: “Ụmụnna” bụ okwu nkịtị na nke ugwu maka ịkpọ ndị otu okwukwe okwu; ọ pụkwara ịgụnye ọgbakọ niile, ebe nkọwa ala peeji na-egosi na ụdị Greek bụ ọtụtụ nke nwoke.
- source_word: κακοπαθίας
  choice: ịta ahụhụ
  rationale: Ọ na-egosi ahụhụ ma ọ bụ ihe isi ike mmadụ na-ata; “ịta ahụhụ” bụ Igbo dị mfe ma saa mbara.
- source_word: μακροθυμίας
  choice: inwe ogologo ntachi obi
  rationale: Ọ na-egosi ndidi na-adịte aka n’ọnọdụ siri ike; okwu a na-edobe echiche nke ogologo oge dị na μακροθυμία.
- source_word: τοὺς προφήτας
  choice: ndị amụma
  rationale: Nke a bụ ntụgharị kpọmkwem na nke a na-aghọta nke ọma.
- source_word: ἐλάλησαν
  choice: kwuru okwu
  rationale: Ọ na-edobe nghọta nkịtị nke λαλέω, n’etinyeghị echiche ọzọ dịka ‘kpọsara.’
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: n’aha Onyenwe anyị
  rationale: A na-edobe akpaalaokwu Akwụkwọ Nsọ nke na-egosi nnọchite anya na ikike.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ahụkarị, dị ugwu, isi sụgharị κύριος dịka ‘Lord.’
theological_decisions:
- issue: Ịkpọ ọgbakọ okwu site n’okwu nwoke ἀδελφοί
  choice: Ụmụnna n’isi ederede, tinyere nkọwa na ọ na-elekarị anya n’ọgbakọ ndị kwere ekwe niile
  alternative: Ụmụnna nwoke na ụmụnna nwanyị
  rationale: “Ụmụnna” na-edobe ọdịdị oku ezinụlọ nke okwu ahụ ma na-arụ ọrụ n’Igbo dịka oku nye otu mmadụ; nkọwa ala peeji na-echekwa eziokwu na Greek bụ ụdị ọtụtụ nke nwoke ma kọwaa ohere ọ gụnyere ụmụ nwanyị.
- issue: Mmekọrịta ndị amụma na ὑπόδειγμα
  choice: werenụ ndị amụma ... dịka ihe atụ nke ịta ahụhụ na inwe ogologo ntachi obi
  alternative: werenụ dịka ihe atụ ... ndị amụma
  rationale: Ndị amụma bụ ndị a ga-ewere dịka ihe atụ, ebe aha abụọ sochirinụ na-akọwa ihe ha bụ ihe atụ na ya; usoro a bụ Igbo eke ma na-echekwa njikọ ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ogologo ntachi obi” na-echekwa echiche nke μακροθυμία karịa naanị “ndidi,” ebe “n’aha Onyenwe anyị” na-edobe akpaalaokwu na mgbagwoju nghọta nke isi Greek.
