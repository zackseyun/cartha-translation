id: JAS.5.17
reference: James 5:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: ig
  text: Ịlaịja bụ mmadụ dịka anyị[a]. O kpesiri ekpere ike ka mmiri ghara izo, mmiri ezoghịkwa n’ala ahụ afọ atọ na ọnwa isii.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ịlaịja nwere mmetụta na agụụ ndị yiri nke anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: Ụdị aha onye amụma ahụ a na-ejikarị na Standard Igbo; e degharịrị aha ahụ n’ụda Igbo kama ịsụgharị ihe ọ pụtara.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: Na-egosi na Ịlaịja bụ mmadụ nkịtị; ‘mmadụ’ bụ okwu Igbo doro anya ma kwekọọ n’ebe nwoke a kpọmkwem nọ.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: nwere ụdị ọnọdụ mmadụ anyị nwere
  rationale: Na-echekwa echiche sara mbara nke iso ndị na-agụ akwụkwọ kerịta ọnọdụ na ahụmahụ mmadụ, n’ebughị ụzọ mechie ya naanị n’ọ mmetụta ma ọ bụ agụụ.
- source_word: προσευχῇ προσηύξατο
  choice: O kpere ekpere siri ike
  rationale: Nkwughachi okwu sitere n’otu mgbọrọgwụ na Grik na-emesi ekpere ahụ ike; nsụgharị a bụ Igbo dị mfe ma na-ebute ike e mesiri ya.
- source_word: τοῦ μὴ βρέξαι
  choice: ka mmiri ghara izo
  rationale: Na-egosipụta ọdịnaya ma ọ bụ ebumnuche ekpere ahụ n’ụzọ Igbo sitere n’okike.
- source_word: οὐκ ἔβρεξεν
  choice: mmiri ezoghịkwa
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu na rain did not fall, ma njikọ ‘-kwa’ na-ejikọta nsonaazụ ahụ na ekpere.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ala ahụ
  rationale: ‘Ala’ dabara n’akụkọ ụkọ mmiri ozuzo n’ala ahụ ma zere ịmanye echiche na ọ bụ ụwa dum.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: ruo afọ atọ na ọnwa isii
  rationale: ‘Ruo’ na-egosi ogologo oge ahụ nke ọma n’Igbo nkịtị.
theological_decisions:
- issue: Ihe ὁμοιοπαθὴς pụtara gbasara ịbụ mmadụ nke Ịlaịja
  choice: Ịlaịja kerịtara anyị otu ụdị ọnọdụ mmadụ.
  alternative: Ịlaịja nwere mmetụta ma ọ bụ agụụ ndị yiri nke anyị.
  rationale: Isi okwu ahụ na-agba ndị kwere ekwe ume site n’igosi na onye amụma ahụ bụ mmadụ dịka ha. A hapụrụ okwu ahụ ka ọ saa mbara kama ime ka ọ bụrụ naanị mmetụta obi ma ọ bụ agụụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche Grik, ma e mere nkwughachi ekpere ahụ ka ọ bụrụ okwu Igbo sitere n’okike. Akara nkọwa ala peeji [a] dị n’isi ederede.
