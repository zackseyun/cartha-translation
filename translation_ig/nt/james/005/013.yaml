base_translation:
  language: en
  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: ig
  text: Ọ̀ nwere onye ọ bụla n’etiti unu na-ata ahụhụ? Ya kpee ekpere. Ọ̀ nwere onye ọ bụla obi ya dị mma? Ya bụọ abụ otuto[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ya bụọ abụ ndị dị n’Abụ Ọma”; ngwaa Grik ahụ nwere ike ịpụta ịbụ abụ ndị dị n’Abụ Ọma kpọmkwem, ma ọ bụ, n’ụzọ sara mbara, ịbụ abụ otuto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: na-ata ahụhụ
  rationale: Ngwaa a na-egosi na mmadụ na-agabiga ahụhụ ma ọ bụ ihe isi ike. “Na-ata ahụhụ” bụ okwu Igbo doro anya nke na-ahapụghị ya naanị n’ọrịa ma ọ bụ mkpagbu.
- source_word: τις
  choice: onye ọ bụla
  rationale: Nnọchiaha a na-ekwu maka onye ọ bụla n’otu n’otu n’enweghị ịkpa oke nwoke na nwanyị; “onye ọ bụla” na-eweta nke a n’Igbo nkịtị.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: Nkebiokwu a na-egosi na onye ahụ bụ otu n’ime ndị obodo a na-agwa okwu.
- source_word: προσευχέσθω
  choice: Ya kpee ekpere
  rationale: Nke a na-echekwa iwu ma ọ bụ agbamume dị n’ụdị onye nke atọ, otu onye, n’Igbo dị mfe ma dị ugwu.
- source_word: εὐθυμεῖ
  choice: obi dị mma
  rationale: Okwu Grik a pụtara ịdị n’ezi mmụọ ma ọ bụ inwe obi ike na ọṅụ. “Obi dị mma” bụ ụzọ Igbo sitere n’okike isi kwuo ọnọdụ ahụ, ma ọ naghị eme ka ọ bụrụ naanị ọṅụ na-apụta ìhè.
- source_word: ψαλλέτω
  choice: Ya bụọ abụ otuto
  rationale: N’ebe a, ngwaa ahụ na-egosi iji abụ too Chineke. “Bụọ abụ otuto” na-eme ka nzube ofufe ahụ doo anya, ebe ihe odide ala ala peeji na-echekwa nghọta nke ịbụ abụ ndị dị n’Abụ Ọma.
theological_decisions:
- issue: Iwu ndị dị n’otu onye nke a na-eji agwa onye ọ bụla
  choice: E ji “onye ọ bụla” na “ya” debe okwu ahụ n’otu onye.
  alternative: Iji ọtụtụ mmadụ kwuo ya, dịka “ha kpee ekpere.”
  rationale: Grik nwere nnọchiaha na iwu dị n’otu onye, ma ihe ọ pụtara gbasara nwoke ma nwanyị. Usoro Igbo a na-echekwa ma ịdị n’otu onye ma ịdị gbasara onye ọ bụla.
- issue: Ihe ψαλλέτω pụtara
  choice: bụọ abụ otuto
  alternative: bụọ abụ ndị dị n’Abụ Ọma
  rationale: Okwu ahụ nwere ike ịpụta ịbụ abụ ndị dị n’Abụ Ọma kpọmkwem ma ọ bụ ịbụ abụ otuto n’ụzọ sara mbara. Isi ederede ji nghọta sara mbara nke dabara n’agbamume a, ebe ihe odide ala ala peeji na-echekwa nghọta nke ọzọ n’enweghị itinye iwu ofufe dị warara n’ime amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe ma dị ugwu. Ajụjụ abụọ ahụ na agbamume abụọ ahụ na-echekwa nhazi mkpụmkpụ na ntụnyere dị n’asụsụ Grik. E debere akara ihe odide ala ala peeji [a] n’azụ okwu ọ na-akọwa, ya bụ “abụ otuto.”
