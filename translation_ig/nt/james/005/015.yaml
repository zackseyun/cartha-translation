id: JAS.5.15
reference: James 5:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: ig
  text: Ekpere nke okwukwe[b] ga-azọpụta onye ahụ na-arịa ọrịa[a], Onyenwe anyị ga-emekwa ka o bilie. Ọ bụrụkwa na o mere mmehie[c], a ga-agbaghara ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ga-agwọ” ma ọ bụ “ga-eme ka ahụ dị ya mma”; okwu Grik bụ “ga-azọpụta.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta “ekpere nke okwukwe” dịka ekpere e ji ntụkwasị obi kpee; n'ebe a, o yikarịghị ka ọ pụtara ekpere e ji ikwesị ntụkwasị obi kpee.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “Ọ bụrụgodị na o mere mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ
  choice: ekpere
  rationale: N'ọnọdụ a, ebe ndị okenye na-ekpe ekpere n'isi onye ọrịa, okwu a pụtara ekpere, ọ bụghị nkwa e kwere Chineke.
- source_word: πίστεως
  choice: nke okwukwe
  rationale: Nke a na-edebe ọdịdị genitive nke Grik ma na-egosi ekpere e ji ntụkwasị obi n'ebe Chineke nọ kpee; nkọwa ọzọ dị na ndetu [b].
- source_word: σώσει
  choice: ga-azọpụta
  rationale: Okwu a nwere ike ịpụta ịzọpụta ma ọ bụ ime ka ahụ dị mmadụ mma. ‘Ga-azọpụta’ na-edebe obosara okwu Grik, ebe ọnọdụ amaokwu ahụ na-egosikwa mgbake n'ọrịa.
- source_word: τὸν κάμνοντα
  choice: onye ahụ na-arịa ọrịa
  rationale: Ọ bụ ezie na κάμνω nwekwara ike ịpụta ike ọgwụgwụ ma ọ bụ adịghị ike, ọnọdụ nke ọrịa, ite mmanụ, na ime ka mmadụ bilie na-akwado nghọta nke onye na-arịa ọrịa.
- source_word: ἐγερεῖ
  choice: ga-eme ka o bilie
  rationale: Nke a na-edebe ihe oyiyi nke ‘ịkpọlite’ ma na-ekwe ka a ghọta ya dị ka ime ka onye ọrịa si n'àkwà bilie ma ọ bụ mweghachi sara mbara.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka κύριος n'okwu Agba Ọhụrụ gbasara Chineke.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: Ọ bụrụkwa na o mere mmehie
  rationale: Nke a na-edebe ọnọdụ ahụ dị ka ihe nwere ike ịdị, na-enweghị ikwu na ọrịa niile sitere ná mmehie onye ahụ.
- source_word: ἀφεθήσεται αὐτῷ
  choice: a ga-agbaghara ya
  rationale: Ụdị passive a na-egosi na a ga-agbaghara onye ahụ mmehie ya, na-ahapụghị onye na-eme mgbaghara n'okwu kpọmkwem, dị ka Grik si mee.
theological_decisions:
- issue: Ma a ga-akọwa σώσει naanị dị ka ọgwụgwọ anụ ahụ ka ọ bụ dị ka nzọpụta/mweghachi sara mbara
  choice: E ji ‘ga-azọpụta’ mee ihe n'ahịrị amaokwu, ebe ọnọdụ ọrịa na-eme ka nghọta ọgwụgwọ pụta ìhè.
  alternative: ‘ga-agwọ’ ma ọ bụ ‘ga-eme ka ahụ dị ya mma’
  rationale: Jemis ji σῴζω, okwu sara mbara karịa okwu ọgwụgwọ nkịtị. Nhọrọ a na-edebe ma ọnọdụ mgbake anụ ahụ ma ụda nzọpụta/mweghachi nke okwu ahụ.
- issue: Ma amaokwu ahụ na-ekwe nkwa na ekpere ga-agwọ ọrịa n'ụzọ akpaghị aka mgbe niile
  choice: E debere ngwaa ọdịnihu dịka nkwupụta siri ike nke ederede si dị, na-etinyeghị nkọwa ga-eme ka ọ sie ike karịa ma ọ bụ daa ogbenye karịa Grik.
  alternative: ‘nwere ike ịgwọ’ ma ọ bụ ‘ga-agwọrịrị onye ọrịa ọ bụla mgbe niile’
  rationale: Ntụgharị ahụ ekwesịghị itinye ozizi nke ọgwụgwọ a na-apụghị ịhapụ ma ọ bụ mee ka nkwupụta doro anya nke ederede ghara ịdị ike.
- issue: Ma mmehie bụ ihe na-akpata ọrịa niile
  choice: 'E debere ya dịka ọnọdụ: ‘Ọ bụrụkwa na o mere mmehie.’'
  alternative: Ịsị na ọrịa niile bụ n'ihi mmehie onye ọrịa, ma ọ bụ iwepụ njikọ ọnọdụ ahụ kpamkpam
  rationale: Grik na-egosi mmehie dịka ihe nwere ike ịdị, ọ bụghị dịka ihe ga-adịrịrị. Nke a na-ezere ime ka ọrịa niile bụrụ nsonaazụ mmehie onwe onye.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. A hapụrụ ‘ga-azọpụta’ ka ọ debe obosara okwu Grik, ebe ‘onye ahụ na-arịa ọrịa’ na ọnọdụ gbara ya gburugburu na-eme ka nghọta mgbake anụ ahụ doo anya. E tinyere akara ndetu niile [a], [b], na [c] n'ebe okwu ha na-akọwa dị.
