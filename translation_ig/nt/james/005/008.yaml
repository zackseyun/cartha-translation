source:
  edition: SBLGNT
  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: ig
  text: Unu kwa, nweenụ ndidi; meenụ ka obi unu sie ike, n’ihi na ọbịbịa Onyenwe anyị[a] adịla nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnụnọ Onyenwe anyị.” Okwu Greek a pụrụ ịpụta “ọnụnọ” ma ọ bụ “ọbịbịa”; n’ebe a, ọ na-ezo aka n’ọbịbịa Onyenwe anyị n’oge ọgwụgwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: nweenụ ndidi
  rationale: Iwu a na-agwa ọtụtụ mmadụ ka ha nọgide na-edi ihe isi ike n’enweghị iwe ọsọ ọsọ; “nweenụ ndidi” bụ Igbo doro anya ma kwekọọ n’ihe atụ onye ọrụ ugbo dị n’amaokwu ndị gbara ya gburugburu.
- source_word: καὶ ὑμεῖς
  choice: unu onwe unu kwesịkwara
  rationale: Nke a na-ejikọta ndị a na-agwa okwu na ihe atụ gara aga, ma na-egosikwa nkwusi ike dị na nnọchiaha Greek.
- source_word: στηρίξατε
  choice: meenụ ka ... sie ike
  rationale: Nkebiokwu a na-egosi ime ka ihe guzosie ike ma ọ bụ sie ike; n’Igbo, “meenụ ka obi unu sie ike” na-enye echiche nke obi ike na mkpebi siri ike n’ụzọ sitere n’okike.
- source_word: τὰς καρδίας ὑμῶν
  choice: obi unu
  rationale: A hapụrụ ihe atụ nke “obi,” nke n’ebe a na-ezo aka n’ime mmadụ, obi ike, na uche ya.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara iwu abụọ ahụ, nke “n’ihi na” na-egosipụta nke ọma.
- source_word: ἡ παρουσία
  choice: ọbịbịa
  rationale: N’ihe ndị gbara amaokwu a gburugburu, okwu a na-ezo aka n’ọbịbịa Onyenwe anyị n’ọdịnihu, ọ bụ ezie na ọ pụkwara ịpụta ọnụnọ; e debere ụzọ ọzọ ahụ na nkọwa ala peeji.
- source_word: τοῦ κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị akọwa κύριος n’Igbo, ma dabara n’ebe a ebe a na-ekwu banyere Onyenwe anyị n’ọnọdụ nke njedebe oge.
- source_word: ἤγγικεν
  choice: adịla nso
  rationale: Oge perfect Greek na-egosi na ọ bịarutela n’ọnọdụ ịdị nso; “adịla nso” na-egosipụta ọnọdụ ahụ n’Igbo nke oge a.
theological_decisions:
- issue: Ihe παρουσία pụtara n’okwu banyere njedebe oge na ọbịbịa Onyenwe anyị
  choice: ọbịbịa Onyenwe anyị
  alternative: ọnụnọ Onyenwe anyị
  rationale: Jemis 5:7–8 na-ele anya n’ihe ga-eme n’ọdịnihu ma na-akpọ ndị na-agụ ya ka ha nwee ndidi ruo mgbe Onyenwe anyị bịara. Ya mere “ọbịbịa” kacha dabara n’ọnọdụ a, ma nkọwa ala peeji na-echekwa ohere lexical nke “ọnụnọ.”
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ Akwụkwọ Nsọ nke “obi,” ebe e jiri usoro Igbo sitere n’okike “meenụ ka obi unu sie ike” gosi nkwụsi ike nke ime mmadụ.
