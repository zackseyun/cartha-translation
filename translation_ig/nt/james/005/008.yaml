revisions:
- from: Unu onwe unu kwesịkwara inwe ndidi; meenụ ka obi unu sie ike, n’ihi na ọbịbịa Onyenwe anyị[a] adịla nso.
  to: Unu kwa, nweenụ ndidi; meenụ ka obi unu sie ike, n’ihi na ọbịbịa Onyenwe anyị[a] adịla nso.
  rationale: The revision removes the unrepresented modal force of “kwesịkwara” while retaining the connective and emphasis of καὶ ὑμεῖς through “Unu kwa.” All other principal renderings are retained because they convey the Greek naturally and accurately in Standard Igbo.
  reviewer_model: gpt-5.6-terra
