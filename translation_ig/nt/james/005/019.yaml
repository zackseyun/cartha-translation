  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: ig
  text: Ụmụnne m[a], ọ bụrụ na onye ọ bụla n'etiti unu si n'eziokwu kpafuo[b], mmadụ eweghachite ya[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, okwu Grik a bụ ụdị ọtụtụ nke nwoke, ma a pụkwara iji ya kpọọ ụmụ nwoke na ụmụ nwanyị niile nọ n'ọgbakọ.
