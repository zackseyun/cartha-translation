lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Ụmụnne m
  rationale: “Ụmụnne” bụ okwu ịkpọ ndị otu okwukwe n'Igbo nke na-ada nke ọma ma nwee ike ịgụnye ụmụ nwoke na ụmụ nwanyị; “m” na-echekwa μου.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: ọ bụrụ na onye ọ bụla n'etiti unu
  rationale: Nke a na-echekwa ọnọdụ nke ἐάν, enweghị nkọwa kpọmkwem nke τις, na ọnọdụ ἐν ὑμῖν n'Igbo doro anya.
- source_word: πλανηθῇ
  choice: esite ... kpafuo
  rationale: “Kpafuo” na-egosipụta isi n'ụzọ ziri ezi pụọ ma ọ bụ duhie mmadụ; usoro a na-ada eke n'Igbo ma ghara ikpebi ma ọ bụ onye ọzọ duhiere ya ma ọ bụ na ya onwe ya kpafuru.
- source_word: ἀπὸ τῆς ἀληθείας
  choice: n'eziokwu
  rationale: N'usoro “esite n'eziokwu kpafuo,” “n'eziokwu” na-egosipụta ebe onye ahụ si pụọ, na-enweghị ịkọwa “eziokwu” karịa ihe Grik kwuru.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: onye ọzọ eweghachite ya
  rationale: “Eweghachite ya” na-enye echiche nke ime ka onye kpafuru laghachi; “onye ọzọ” na-anọchi τις nke abụọ ma na-egosi na ọ bụ mmadụ ọzọ mere ihe ahụ.
theological_decisions:
- issue: Ụdị nwoke na adreesị Ἀδελφοί na nnọchiaha αὐτόν
  choice: Jiri “Ụmụnne m” na “ya.”
  alternative: “Ụmụnna m” na okwu nnọchiaha nwoke kpọmkwem
  rationale: Igbo anaghị egosi okike n'otu ụzọ ahụ Grik na Bekee si egosi ya na nnọchiaha onye nke atọ. “Ụmụnne” bụ adreesị nkwanye ùgwù nke ọgbakọ dum, ebe “ya” na-echekwa onye otu ahụ na-enweghị itinye ọdịiche okike Igbo na-enweghị.
- issue: Ọdịdị na nkọwa πλανηθῇ
  choice: “esite n'eziokwu kpafuo”
  alternative: “e duhie ya ka o si n'eziokwu pụọ”
  rationale: Aorist passive subjunctive ahụ nwere ike ịpụta ịbụ onye e duhiere ma ọ bụ ịkpafu. Isi okwu Igbo “kpafuo” na-echekwa esemokwu ahụ nke ọma karịa ntụgharị ga-ekpebi onye kpatara ya.
- issue: Nkọwa ἐπιστρέψῃ
  choice: “eweghachite ya”
  alternative: “eme ka ọ laghachi”
  rationale: Nke a na-echekwa echiche nke ịtụgharị ma ọ bụ ịkpọghachi onye si n'eziokwu pụọ, ma ghara ịgbakwunye usoro okpukpe pụrụ iche.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. Ahịrịokwu ahụ kwụsịrị na rikoma n'ihi na echiche ya na-aga n'ihu n'amaokwu nke 20. E debere akara nkọwa ụkwụ niile n'akụkụ okwu ha metụtara.
