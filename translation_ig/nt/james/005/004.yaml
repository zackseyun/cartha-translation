- from: Lee, ụgwọ ọrụ ndị ọrụ ahụ ghọrọ ubi unu, nke unu jidere akwụghị ha, na-eti mkpu; mkpu ndị ahụ ghọrọ ihe ubi abatala na ntị Onyenwe anyị nke usuu ndị agha.[a]
  to: Lee, ụgwọ ọrụ ndị ọrụ ahụ wepụtara ihe ubi n'ubi unu, nke unu jigidere n'aka ha, na-eti mkpu; mkpu ndị gbutere ihe ubi abatala na ntị Onyenwe anyị nke usuu ndị agha.[a]
  rationale: The revision corrects the false rendering of the two harvest participles and restores the syntax of the second clause. It retains the source’s personification of the withheld wages, the perfect sense of the cries having entered the Lord’s ears, and the translated divine title with a transliterated alternative in the footnote.
