id: JAS.5.4
reference: James 5:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: ig
  text: Lee, ụgwọ ọrụ ndị ọrụ ahụ wepụtara ihe ubi n'ubi unu, nke unu jigidere n'aka ha, na-eti mkpu; mkpu ndị gbutere ihe ubi abatala na ntị Onyenwe anyị nke usuu ndị agha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onyenwe anyị Sabaọt.” Grik ahụ chebere aha Hibru ahụ, Σαβαώθ (Sabaọt), nke ụfọdụ nsụgharị na-ahapụ n'ụdị ntụgharị-olu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Okwu a na-adọta uche ma na-emesi ihe na-esonụ ike; “Lee” bụ okwu Igbo doro anya ma nwee ugwu.
- source_word: μισθὸς
  choice: ụgwọ ọrụ
  rationale: Ọ na-ezo aka n’ụgwọ e ji ndị ọrụ ụgwọ maka ọrụ ha rụrụ.
- source_word: ἐργατῶν
  choice: ndị ọrụ
  rationale: Ọ bụ okwu zuru ezu maka ndị na-arụ ọrụ, dabara n’ọrụ ugbo a na-ekwu maka ya.
- source_word: ἀμησάντων
  choice: ghọrọ
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara igbutu ma chịkọta ihe ubi; “ghọrọ” bụ okwu Igbo nkịtị maka iwe ihe ubi.
- source_word: χώρας
  choice: ubi
  rationale: N’ebe a ọ na-ezo aka n’ala a na-akọ ihe, ya bụ ubi ndị nwe ala ahụ.
- source_word: ἀφυστερημένος ἀφ’ ὑμῶν
  choice: nke unu jidere akwụghị ha
  rationale: Nke a na-egosi na ha kpachaara anya jide ụgwọ ahụ azụ, ma na-edobe ebubo ahụ n’ụzọ doro anya n’Igbo.
- source_word: κράζει
  choice: na-eti mkpu
  rationale: Ọ na-edobe ihe atụ ahụ nke na-eme ka ụgwọ ahụ dị ka onye na-eti mkpu ka e kpee ikpe ziri ezi.
- source_word: βοαὶ
  choice: mkpu
  rationale: Ọ na-egosi mkpu siri ike nke ndị a na-emegbu na-eti maka enyemaka ma ọ bụ ikpe ziri ezi.
- source_word: θερισάντων
  choice: ndị ahụ ghọrọ ihe ubi
  rationale: Ọ na-ezo kpọmkwem aka ná ndị sonyere n’iwe ihe ubi.
- source_word: εἰς τὰ ὦτα
  choice: abatala na ntị
  rationale: Ọ na-edobe ihe oyiyi Semitik nke mkpu na-abanye na ntị Chineke, kama ime ka ọ bụrụ naanị na Chineke nụrụ ya.
- source_word: Κυρίου Σαβαὼθ
  choice: Onyenwe anyị nke usuu ndị agha
  rationale: Ọ na-asụgharị aha nsọ a n’ụzọ na-eme ka ihe ọ pụtara doo onye Igbo anya, ma debe ntụgharị-olu “Sabaọt” na nkọwa ala peeji.
- source_word: εἰσεληλύθασιν
  choice: abatala
  rationale: Ụdị ngwaa zuru oke na-egosi na mkpu ahụ abanyelarị ma mmetụta ya ka dị ugbu a; “abatala” na-egosipụta nke a nke ọma.
theological_decisions:
- issue: Nsụgharị aha nsọ Κυρίου Σαβαὼθ
  choice: Onyenwe anyị nke usuu ndị agha
  alternative: Onyenwe anyị Sabaọt
  rationale: Σαβαώθ bụ aha nsọ sitere n’asụsụ Hibru nke na-ezo aka n’ụsụụ dị iche iche n’okpuru ọchịchị Chineke. Ịsụgharị ya na-eme ka ihe ọ pụtara doo anya, ebe nkọwa ala peeji na-echekwa ụdị ntụgharị-olu ọdịnala.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E debere nkwughachi nke “mkpu” na ihe oyiyi nke ụgwọ ọrụ na-eti mkpu, tinyere okwu ahụ bụ “abatala na ntị,” iji chekwaa ike na ọdịdị nke Grik.
