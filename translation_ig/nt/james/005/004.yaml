review_pass:
  verdict: revise
  source_fidelity: 'The draft mistranslates both agricultural participles: “ghọrọ” means “became,” not “harvested/reaped.” It also produces an ungrammatical and semantically broken phrase, “mkpu ndị ahụ ghọrọ ihe ubi.” The revision restores the two groups of agricultural workers, the withheld wages, their cry, and the completed arrival of the workers’ cries before the Lord.'
  naturalness: The revised Standard Igbo is clear, idiomatic, and maintains the solemn prophetic/judicial register. “Jigidere n'aka ha” naturally conveys withholding what is due from workers, and “abatala na ntị” retains the biblical image.
  terminology: “Ụgwọ ọrụ,” “ndị ọrụ,” “ubi,” “na-eti mkpu,” and “Onyenwe anyị nke usuu ndị agha” are appropriate. The footnote retains “Sabaọt” as the alternative transliterated form of the divine title.
  issues:
  - severity: high
    issue: “ghọrọ” is used for ἀμησάντων and θερισάντων.
    rationale: In Standard Igbo, “ghọrọ” means “became,” whereas both Greek participles refer to workers harvesting/reaping. This reverses the intended action and leaves the verse incoherent.
  - severity: high
    issue: “mkpu ndị ahụ ghọrọ ihe ubi” is ungrammatical and does not represent αἱ βοαὶ τῶν θερισάντων.
    rationale: The Greek means “the cries of those who reaped,” not cries that became a harvest. The possessive relationship and the second reference to harvest workers must be restored.
  - severity: medium
    issue: “nke unu jidere akwụghị ha” is awkward and insufficiently clear as a rendering of wages withheld from the workers.
    rationale: The revised wording explicitly and naturally states that the wages were kept back from the workers, while preserving the direct accusation against “you.”
  revised_text: Lee, ụgwọ ọrụ ndị ọrụ ahụ wepụtara ihe ubi n'ubi unu, nke unu jigidere n'aka ha, na-eti mkpu; mkpu ndị gbutere ihe ubi abatala na ntị Onyenwe anyị nke usuu ndị agha.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Onyenwe anyị Sabaọt.” Grik ahụ chebere aha Hibru ahụ, Σαβαώθ (Sabaọt), nke ụfọdụ nsụgharị na-ahapụ n'ụdị ntụgharị-olu.
    reason: alternative_reading
  revision_rationale: The revision corrects the false rendering of the two harvest participles and restores the syntax of the second clause. It retains the source’s personification of the withheld wages, the perfect sense of the cries having entered the Lord’s ears, and the translated divine title with a transliterated alternative in the footnote.
