  to: Unu ebiela ndụ okomoko n’ụwa[a], meekwa onwe unu ihe ụtọ gabiga ókè[b]. Unu emewo ka obi unu maa abụba n’ụbọchị ogbugbu[c][d].
  rationale: The revision changes only the aspectual form of the second coordinated verb and its corresponding alternative note. It preserves the source’s condemnation, the distinction between luxurious living and excessive self-indulgence, and the unresolved metaphorical force of the day of slaughter.
