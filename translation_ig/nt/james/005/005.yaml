id: JAS.5.5
reference: James 5:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: ig
  text: Unu ebiela ndụ okomoko n’ụwa[a], meekwa onwe unu ihe ụtọ gabiga ókè[b]. Unu emewo ka obi unu maa abụba n’ụbọchị ogbugbu[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu ebiela ndụ ihe ụtọ n’ụwa.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ma bikwa ndụ imeju ọchịchọ nke onwe unu.”
    reason: lexical_alternative
  - marker: c
    text: Ihe atụ a yiri nke anụ ndị a na-eme ka ha maa abụba tupu e gbuo ha; o nwere ike na-egosi ikpe na-abịa.
    reason: cultural_note
  - marker: d
    text: Ma ọ bụ, “maka ụbọchị ogbugbu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: unu ebiela ndụ okomoko
  rationale: Nke a na-egosi ibi ndụ jupụtara n’ụba na ihe ụtọ, ma na-ejigidekwa ụda ịba mba dị n’okwu Grik.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: γῆ nwere ike ịpụta ‘ụwa’ ma ọ bụ ‘ala’; n’ebe a, ‘n’ụwa’ dabara n’ịkatọ ndụ okomoko nke ụwa n’ozuzu ya.
- source_word: ἐσπαταλήσατε
  choice: na-emerekwa onwe unu ihe ụtọ gabiga ókè
  rationale: Nkebiokwu a na-egosi ndụ nke mmadụ na-emeju ọchịchọ onwe ya n’enweghị njide, ma na-eme ka ike okwu ahụ pụta n’Igbo nkịtị.
- source_word: ἐθρέψατε
  choice: unu emewo ka ... maa abụba
  rationale: Ọ bụ ezie na τρέφω nwere ike ịpụta ‘ịzụ’ ma ọ bụ ‘inye nri,’ ihe atụ nke anụ a na-eme ka ọ maa abụba tupu e gbuo ya na-eme ka ‘mee ka ... maa abụba’ bụrụ nhọrọ kacha kwekọọ n’ebe a.
- source_word: τὰς καρδίας ὑμῶν
  choice: obi unu
  rationale: Ịhapụ ‘obi unu’ dịka ọ dị na Grik na-echekwa ihe atụ na echiche Akwụkwọ Nsọ banyere ime mmadụ.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: n’ụbọchị ogbugbu
  rationale: Nke a na-esochi ἐν nke ọma ma na-ahapụ ihe atụ ahụ ka ọ dị nkọ n’ebughị ụzọ kọwaa kpọmkwem onye a ga-egbu ma ọ bụ ụdị ikpe ọ bụ.
theological_decisions:
- issue: Ihe atụ nke ‘ụbọchị ogbugbu’
  choice: E debere ihe atụ nke ogbugbu na-abịa n’akọwaghị ya kpọmkwem dịka ikpe Chineke n’ahịrị bụ isi.
  alternative: Ịsụgharị ya n’ụzọ ga-ekwu hoo haa na ọ bụ ụbọchị ikpe Chineke, ma ọ bụ na ọ na-ezo aka n’ogbugbu ndị aka ha dị ọcha.
  rationale: Okwu ahụ na-egosi ikpe na-abịa n’ike, ma Grik anaghị akọwa onye a na-egbu ma ọ bụ tinye okwu ‘ikpe Chineke’; ya mere nsụgharị ahụ na-echekwa nghọta na esemokwu nkà mmụta okpukpe dị n’ihe atụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ndụ okomoko’ na ‘ihe ụtọ gabiga ókè’ na-ekewa echiche nke ngwaa Grik abụọ ahụ, ebe ‘obi unu maa abụba’ na-echekwa ihe atụ siri ike nke isi mmalite ahụ.
