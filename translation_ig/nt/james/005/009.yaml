review_pass:
  verdict: revise
  source_fidelity: The draft conveys the prohibition against resentful complaint, the reciprocal target, the purpose clause, and the Judge's imminent presence well. However, it renders the plural τῶν θυρῶν as singular “n'ọnụ ụzọ.” A plural expression should be retained where natural in Igbo.
  naturalness: “Unu atamụ ntamu” is not the most natural Standard Igbo negative plural prohibition. “Unu atala ntamu” is idiomatic and clearly functions as a prohibition. The remaining syntax and register are clear and appropriately solemn.
  terminology: “Ụmụnna” suitably renders ἀδελφοί, with the supplied footnote responsibly noting its collective application. “Onyeikpe ahụ” preserves the Greek title without specifying the referent. “Ikpe unu ikpe” appropriately retains the non-specific sense of being judged rather than condemned.
  issues:
  - severity: medium
    issue: The negative imperative “Unu atamụ ntamu” is linguistically awkward in Standard Igbo.
    rationale: For a plural prohibition, “Unu atala ntamu” is the normal, natural construction and preserves the force of μὴ στενάζετε.
  - severity: low
    issue: “n'ọnụ ụzọ” is singular whereas the Greek has plural θυρῶν.
    rationale: The source explicitly has “the doors.” “N'ihu ọnụ ụzọ ndị ahụ” gives a natural plural rendering and also reflects πρό (“before/at”).
  revised_text: Unu atala ntamu megide ibe unu, ụmụnna,[a] ka a ghara ikpe unu ikpe. Lee, Onyeikpe ahụ eguzola n'ihu ọnụ ụzọ ndị ahụ.
  revised_footnotes:
