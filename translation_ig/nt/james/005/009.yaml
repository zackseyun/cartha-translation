id: JAS.5.9
reference: James 5:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: ig
  text: Unu atala ntamu megide ibe unu, ụmụnna,[a] ka a ghara ikpe unu ikpe. Lee, Onyeikpe ahụ eguzola n'ihu ọnụ ụzọ ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” nwere ike ịkpọ ndị kwere ekwe niile ọnụ, ma ndị nwoke ma ndị nwanyị, dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: atamụ ntamu
  rationale: N'ọnọdụ a, ebe okwu ahụ jikọrọ ya na “megide ibe unu,” ọ pụtara mkpesa iwe ma ọ bụ obi ọjọọ e duziri n'ebe ndị ọzọ nọ, ọ bụghị naanị ịsụ ude. “Ịtamụ ntamu” na-egosipụta ike mmekọrịta na ụkpụrụ omume dị n'okwu ahụ.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo a na-ejikarị akpọ ndị otu okwukwe ọnụ; n'ọnọdụ a ọ pụrụ ịgụnye ma ndị nwoke ma ndị nwanyị, n'agbanyeghị na okwu Grik bụ ụdị ọtụtụ nke nwoke.
- source_word: κατ’ ἀλλήλων
  choice: megide ibe unu
  rationale: κατά tinyere genitive na-egosi mmegide ma ọ bụ iwe e duziri n'ebe ibe ha nọ. “Megide ibe unu” na-echekwa ntụziaka na esemokwu mmekọrịta ahụ.
- source_word: κριθῆτε
  choice: a ghara ikpe unu ikpe
  rationale: Ụdị passive subjunctive a na-egosi ka e ghara ikpe ha ikpe. Nsụgharị a anaghị emesi ya ike ruo n'ókè nke “ịma ikpe,” n'ihi na okwu Grik anaghị akọwapụta nsonaazụ ikpe ahụ.
- source_word: κριτὴς
  choice: Onyeikpe ahụ
  rationale: Aha ahụ na-ezo aka n'Onyeikpe nke ikpe ikpeazụ, ma nsụgharị ahụ ahaghị kpọọ kpọmkwem onye ọ bụ karịa ihe Grik kwuru.
- source_word: πρὸ τῶν θυρῶν
  choice: n'ọnụ ụzọ
  rationale: Akpaalaokwu a na-egosi ịdị nso na ịdị njikere ịbịa. Ọ bụ ezie na Grik ji ọtụtụ “ọnụ ụzọ,” Igbo nkịtị na-eji “n'ọnụ ụzọ” kwuo ọnọdụ dị otu a n'ụzọ eke.
- source_word: ἕστηκεν
  choice: eguzola
  rationale: 'Perfect tense ahụ na-egosi ọnọdụ dị ugbu a nke sitere n''omume emechara: Onyeikpe ahụ abịala guzoro, ọ ka na-eguzokwa. “Eguzola” na-egosipụta nke a n''ụzọ dị nkenke ma dị ndụ.'
theological_decisions:
- issue: Onye okwu “Onyeikpe” na-ezo aka na ya
  choice: A hapụrụ ya dịka “Onyeikpe ahụ,” onye bụ Onyeikpe Chineke nke ikpe ikpeazụ, nke n'ọnọdụ akwụkwọ a yikarịrị ka ọ bụ Onyenwe anyị/Kraịst.
  alternative: Chineke n'ozuzu ya dịka Onyeikpe.
  rationale: Asụsụ banyere ikpe dị nso dabara n'olileanya Ndị Kraịst mbụ banyere ọbịbịa Onyenwe anyị. Ịhapụ ya dịka “Onyeikpe ahụ” na-echekwa ike nkà mmụta okpukpe na nghọta abụọ dị na Grik n'etinyeghị nkọwa karịrị isi iyi.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. “Unu atamụ ntamu” bụ iwu na-adịghị mma nke na-ada nke ọma n'Igbo; “Lee” na-echekwa oku siri ike ἰδού. E ji “Onyeikpe” malite na mkpụrụedemede ukwu iji gosi ọrụ pụrụ iche ahụ n'etinyeghị aha onye Grik na-akpọghị.
