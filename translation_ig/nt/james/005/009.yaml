    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural negative imperative with idiomatic Standard Igbo and restores the source text's plural “doors,” while retaining the draft's faithful rendering of the warning, judgment clause, title, and perfect-state imagery.
