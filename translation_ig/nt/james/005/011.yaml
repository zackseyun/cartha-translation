id: JAS.5.11
reference: James 5:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: ig
  text: Lee, anyị na-atụ ndị tachiri obi dịka ndị a gọziri agọzi. Unu anụla banyere ntachi obi Job, hụkwala njedebe Onyenweanyị, n’ihi na Onyenweanyị nwere ọmịiko dị ukwuu, bụrụkwa onye ebere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: Lee
  rationale: Okwu a na-adọta uche onye na-agụ ya n’ihe na-esochi; “Lee” bụ ụzọ Igbo doro anya ma dịkwa ùgwù isi mee nke a.
- source_word: μακαρίζομεν
  choice: anyị na-agụ ... dịka ndị a gọziri agọzi
  rationale: Nke a na-egosi na ndị na-ekwu okwu na-ekwupụta na ndị ahụ nọ n’ọnọdụ ngọzi, kama ịsị na ha onwe ha na-agọzi ha.
- source_word: ὑπομείναντας / ὑπομονήν
  choice: ndị tachiri obi / ntachi obi
  rationale: E ji otu mgbọrọgwụ okwu Igbo mee ka njikọ dị n’etiti ndị tachiri obi na ntachi obi Job pụta ìhè.
- source_word: τὸ τέλος κυρίου
  choice: ihe si n’aka Onyenweanyị pụta n’ikpeazụ
  rationale: Τέλος nwere ike ịpụta njedebe ma ọ bụ nsonaazụ; ntụgharị a na-egosi ihe Onyenweanyị mere ka o pụta n’ikpeazụ n’akụkọ Job, n’enweghị ịgbanwe ya ka ọ bụrụ naanị ‘nzube.’
- source_word: πολύσπλαγχνος
  choice: nwere ọmịiko dị ukwuu
  rationale: Ọ na-egosi ọmịiko miri emi na nke bara ụba.
- source_word: οἰκτίρμων
  choice: onye ebere
  rationale: Nke a na-edobe ọdịiche dị ntakịrị n’etiti ọmịiko miri emi na omume ebere.
theological_decisions:
- issue: Ihe τὸ τέλος κυρίου pụtara
  choice: ihe si n’aka Onyenweanyị pụta n’ikpeazụ
  alternative: nzube Onyenweanyị
  rationale: “Nzube” ga-ekpebi na τέλος pụtara ebumnuche naanị. Nhọrọ e mere na-ahapụ ohere nke ‘njedebe’ ma ọ bụ ‘nsonaazụ’ ma na-eme ka ọrụ Onyenweanyị n’akụkọ Job doo anya.
- issue: Ụdị ngọzi dị na μακαρίζομεν
  choice: anyị na-agụ ... dịka ndị a gọziri agọzi
  alternative: anyị na-agọzi
  rationale: Okwu Grik pụtara ịkpọ ma ọ bụ ịgụ mmadụ dịka onye nọ n’ọnọdụ ngọzi, ọ bụghị na ndị na-ekwu okwu bụ ndị nyere ngọzi ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu na njikọ echiche Grik ebe ọ na-ada nke ọma n’Igbo, ma zere okwu ụka nke otu ngalaba pụrụ iche.
