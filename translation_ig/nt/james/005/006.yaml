  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: ig
  text: Unu mara onye ezi omume ahụ[a] ikpe, unu gbuo ya. Ọ̀ naghị eguzogide unu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye Ezi Omume ahụ.” Ụfọdụ na-ahụ ebe a ihe nwere ike na-ezo aka na Jizọs, bụ́ “Onye Ezi Omume ahụ”; ma ihe ndị gbara amaokwu a gburugburu nwekwara ike igosi onye ezi omume a na-emegbu, onye na-anọchite anya ndị ndị ọgaranya na-emegbu.
    reason: alternative_reading
  - marker: b
    text: 'A pụkwara ịtụgharị ya dịka nkwupụta: “Ọ naghị eguzogide unu.” Ajụjụ a n’asụsụ Grik nwere ike ịbụ ajụjụ e ji ekwusi ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: Unu mara … ikpe
  rationale: Nkebi okwu Igbo a na-egosi ikpe ọmụma ma na-edobe ike okwu ikpe dị na καταδικάζω; oge gara aga kwekọrọ na aorist.
- source_word: ἐφονεύσατε
  choice: unu wee gbuo ya
  rationale: “Gbuo” bụ okwu Igbo doro anya maka iwepụ ndụ mmadụ; n’ọnọdụ ebubo a, ọ na-eburu ibu omume ọjọọ dị na φονεύω, ebe “wee” jikọtara ebubo abụọ ahụ n’ụzọ Igbo si aga nke ọma.
- source_word: τὸν δίκαιον
  choice: onye ezi omume ahụ
  rationale: Adjective nwoke otu nke e ji dị ka aha pụtara onye ziri ezi ma ọ bụ onye ezi omume. “Onye ezi omume ahụ” na-edobe otu onye ahụ n’enweghị ịkọwapụta na ọ bụ Jizọs kpọmkwem.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: Ọ naghị eguzogide unu
  rationale: “Iguzogide” na-enye echiche nke mmadụ ịtọ onwe ya megide ndị ọzọ. E depụtara ya dịka nkwupụta maka Igbo doro anya, ma e debere ụdị ajụjụ Grik n’okpuru peeji.
theological_decisions:
- issue: Onye τὸν δίκαιον na-ezo aka na ya
  choice: Otu onye ezi omume nke na-anọchi anya onye a na-emegbu
  alternative: Aha e ji zoo aka na Jizọs dịka “Onye Ezi Omume”
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu na-akatọ ndị ọgaranya na-emegbu ndị na-enweghị ike. Otu onye ahụ nwere ike ịnọchi anya ndị ezi omume n’ozuzu; otú ọ dị, nkebi okwu ahụ nwekwara ike ime ka onye na-agụ ya cheta Jizọs, ya mere e debere ohere ahụ n’okpuru peeji.
- issue: Ụdị nkebi okwu ikpeazụ
  choice: 'Nkwupụta: “Ọ naghị eguzogide unu.”'
  alternative: 'Ajụjụ: “Ọ̀ naghị eguzogide unu?”'
  rationale: SBLGNT tinyere akara ajụjụ, ma a na-aghọtakarị nkebi ahụ dịka ajụjụ e ji ekwusi ike na onye ezi omume ahụ anaghị eguzogide ha. Nkwupụta ahụ na-eme ka nzube a doo anya n’Igbo, ebe nkọwa ala peeji na-edobe ụdị Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Mara … ikpe,” “onye ezi omume,” na “iguzogide” bụ okwu ndị a na-aghọta nke ọma ma na-edobe ụda ebubo siri ike nke isi mmalite ahụ.
