- from: I kweere na Chineke bụ otu[a]; i mere nke ọma. Ọbụna ndị mmụọ ọjọọ kwere nke ahụ—ha na-amakwa jijiji[b].
  to: Ị kwere na Chineke bụ otu[a]; ị mere nke ọma. Ọbụna ndị mmụọ ọjọọ kwere—ha na-ama jijiji[b].
  rationale: The revision standardizes the explicit second-person pronoun and removes an unnecessary demonstrative from the second verb. It otherwise preserves the draft’s source-faithful wording, rhetorical force, register, footnote markers, and theological neutrality.
