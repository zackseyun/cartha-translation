id: JAS.2.19
reference: James 2:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: ig
  text: Ị kwere na Chineke bụ otu[a]; ị mere nke ọma. Ọbụna ndị mmụọ ọjọọ kwere—ha na-ama jijiji[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e nwere otu Chineke.” Okwu Grik ahụ nwere ike ịpụta n’ụzọ abụọ a; “Chineke bụ otu” na-esochi usoro okwu Grik nso karị, o nwekwara ike ịdị ka nkwughachi nke nkwupụta ndị Juu banyere otu Chineke.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “na-ama jijiji n’egwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: I
  rationale: Nnọchiaha onye nke abụọ otu ọnụ dabara na onye Jemis na-agwa okwu; ọnọdụ ya n'isi ahịrịokwu na-eme ka ọ pụta ìhè n'ụzọ zuru ezu n'Igbo.
- source_word: πιστεύεις
  choice: kweere
  rationale: “Kweere” na-egosi ikweta na okwu a bụ eziokwu, dịka nkebiokwu ὅτι na-esochi ya si gosi, n'etinyeghị echiche nke ntụkwasị obi onwe onye nke na-adịghị n'okwu Grik ebe a.
- source_word: ὅτι
  choice: na
  rationale: “Na” bụ ụzọ Igbo nkịtị si webata ihe mmadụ kwere.
- source_word: εἷς ἐστιν ὁ θεός
  choice: Chineke bụ otu
  rationale: Nke a na-esochi usoro na nkwupụta Grik nso ma na-echekwa nkwupụta banyere ịdị-otu nke Chineke; ọ naghị agbanwe ya ka ọ bụrụ naanị nkwupụta banyere ọnụ ọgụgụ.
- source_word: καλῶς ποιεῖς
  choice: i mere nke ọma
  rationale: Nke a bụ okwu Igbo doro anya maka nkwenye dị mkpirikpi Jemis kwuru tupu ntụnyere ya na ndị mmụọ ọjọọ.
- source_word: καὶ
  choice: Ọbụna
  rationale: 'καί nwere ike ịrụ ọrụ nke ịkwalite ntụnyere ebe a: ọbụna ndị mmụọ ọjọọ sokwa kwere.'
- source_word: τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo a na-aghọta ngwa ngwa maka δαιμόνια ma na-egosi na ha bụ mmụọ ọjọọ, ọ bụghị ndị mmụọ n'ozuzu.
- source_word: πιστεύουσιν
  choice: kwere nke ahụ
  rationale: “Kwere” na-echekwa nkwughachi nke πιστεύω; “nke ahụ” na-eme ka o doo anya n'Igbo na ihe ha kwere bụ nkwupụta ahụ e kwuru n'ihu.
- source_word: φρίσσουσιν
  choice: na-amakwa jijiji
  rationale: Okwu a na-egosi mmeghachi omume egwu nke ahụ; “na-ama jijiji” bụ okwu Igbo dị ndụ ma dị mfe nghọta.
theological_decisions:
- issue: Nsụgharị nkwupụta εἷς ἐστιν ὁ θεός
  choice: Chineke bụ otu
  alternative: E nwere otu Chineke
  rationale: Nhọrọ a na-edobe ọdịdị nkwupụta Grik ma nwee ike ime ka nkwughachi nke nkwupụta ndị Juu banyere otu Chineke daa ụda, na-enweghị ịmanye nkọwa karịrị ihe odide ahụ.
- issue: Ike nke ntụnyere dị n'etiti nkwenye mmadụ na nke ndị mmụọ ọjọọ
  choice: Ọbụna ndị mmụọ ọjọọ kwere nke ahụ—ha na-amakwa jijiji
  alternative: Ndị mmụọ ọjọọ kwerekwa, ha na-ama jijiji
  rationale: '“Ọbụna” na-eme ka ntụnyere ahụ sie ike, ebe akara ogologo na-ekewa nkwenye ha na mmeghachi omume egwu ha. Nke a na-echekwa esemokwu nke amaokwu ahụ: nkwenye nke naanị ikweta eziokwu adịghị egosi n''onwe ya okwukwe na-arụ ọrụ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee nsụgharị ahụ. E chekwara nkwughachi nke “kwere,” ike nke “ọbụna,” na mgbagwoju anya dị n'okwu banyere otu Chineke. Akara ụkwụ [a] na [b] abụọ pụtara n'ahịrịokwu isi.
