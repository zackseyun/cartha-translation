revisions:
- from: Ma ị chọrọ ịmata, gị nwoke na-enweghị uche[a], na okwukwe na-enweghị ọrụ abaghị uru[b]?
  to: Ma ị chọrọ ịmata, gị nwoke efu[a], na okwukwe na-enweghị ọrụ abaghị uru[b]?
  rationale: The revision restores the lexical force of κενέ as “empty/vain” through “nwoke efu,” keeps the Greek singular masculine address, and moves both footnote markers to their proper anchors. It preserves the distinction between ἀργή (“useless,” “inactive,” or “unproductive”) and νεκρά (“dead”), without adding a theological interpretation.
