  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: ig
  text: Ma ị chọrọ ịmata, gị nwoke efu[a], na okwukwe na-enweghị ọrụ abaghị uru[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “nwoke efu.” A pụkwara ịsụgharị ya “nwoke na-enweghị uche” ma ọ bụ “nwoke na-enweghị isi.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “adịghị arụ ọrụ” ma ọ bụ “adịghị amị mkpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: Ma ị chọrọ ịmata
  rationale: “Chọrọ” na-egosipụta ọchịchọ dị na θέλεις, “ịmata” na-asụgharị γνῶναι ozugbo, ebe “Ma” na-ebute ntụgharị uche nke δέ.
- source_word: ὦ ἄνθρωπε κενέ
  choice: gị nwoke na-enweghị uche
  rationale: “Nwoke” na-echekwa otu nwoke a na-akpọ okwu; “na-enweghị uche” na-enye Igbo doro anya maka ihe κενέ pụtara n’ebe a—onye echiche ya tọgbọ chakoo—na-enweghị iji okwu Igbo nwere ike ịpụta na onye ahụ abaghị uru n’onwe ya.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ebute ọdịnaya nke ihe onye ahụ kwesịrị ịmata, dịka ὅτι si arụ ọrụ n’ahịrịokwu a.
- source_word: ἡ πίστις
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị eme ihe maka πίστις, ma ọ naghị etinye nkọwa okpukpe ọzọ n’ime amaokwu ahụ.
- source_word: χωρὶς τῶν ἔργων
  choice: na-enweghị ọrụ
  rationale: Nke a na-egosipụta kpọmkwem echiche nke χωρίς na genitive—ọrụ adịghị eso okwukwe ahụ—ma na-ada ka Igbo ebumpụta ụwa.
- source_word: ἀργή ἐστιν
  choice: abaghị uru
  rationale: N’ebe a ἀργός pụtara ihe na-adịghị arụ ọrụ ma ọ bụ na-adịghị amị mkpụrụ; “abaghị uru” na-ekwupụta ike okwu ahụ n’Igbo doro anya.
theological_decisions:
- issue: Mmekọrịta okwukwe na ọrụ n’arụmụka Jemis
  choice: A kọwara okwukwe na-enweghị ọrụ dị ka nke na-abaghị uru.
  alternative: A pụrụ ịsụgharị ya “adịghị arụ ọrụ” ma ọ bụ “adịghị amị mkpụrụ”; e jighị “nwụrụ anwụ” dochie ya.
  rationale: Okwu Grik ebe a bụ ἀργή, ọ bụghị νεκρά. Nsụgharị a na-echekwa okwu na esemokwu nke amaokwu a n’onwe ya, na-etinyeghị nkọwa otu ụka ma ọ bụ jikọta ya n’amaghị ama na okwu amaokwu ndị gbara ya gburugburu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. Ajụjụ ahụ ka bụ ajụjụ a na-ajụ onye a kpọrọ “nwoke,” ebe akara nkọwa abụọ ahụ pụtara n’ederede isi dịka [a] na [b].
