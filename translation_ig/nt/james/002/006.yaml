    rationale: This wording can imply becoming impoverished and is not a neutral lexical alternative for τὸν πτωχόν. The relevant alternative is the broader collective rendering “ndị ogbenye.”
  - severity: low
    issue: Footnote b uses a repetitive explanation of courts.
    rationale: “Ebe ndị ikpe na-ekpe ikpe” is understandable but stylistically repetitive. A direct statement that the Greek denotes judicial courts is more natural and precise.
