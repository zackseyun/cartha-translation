id: JAS.2.6
reference: James 2:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: ig
  text: Ma unu eledaala onye ogbenye[a] anya. Ọ̀ bụghị ndị ọgaranya na-emegbu unu, ha onwe ha na-adọkpụrụkwa unu gaa n’ụlọikpe[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, n’ụzọ sara mbara, “ndị ogbenye.” Okwu Grik dị n’otu ọnụọgụ; o yikarịrị ka ọ na-ezo aka n’onye ahụ a kpọtụrụ aha n’amaokwu ndị bu ụzọ, ebe ọ na-anọchitekwa anya ndị ogbenye n’ozuzu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ụlọikpe iwu.” Okwu Grik na-ezo aka n’ụlọikpe ndị na-ekpe ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: eledaala ... anya
  rationale: N’Igbo, “ileda mmadụ anya” na-egosi imeso ya n’enweghị nsọpụrụ ma ọ bụ ile ya anya dị ka onye na-abaghị uru. Nke a na-echekwa echiche ihere na nsọpụrụ dị n’okwu Grik.
- source_word: τὸν πτωχόν
  choice: onye ogbenye
  rationale: Ọ bụ otu onye ka okwu Grik na-ekwu maka ya, nke na-echetara onye ogbenye ahụ e kwuru banyere ya n’amaokwu ndị bu ụzọ, ma ọ pụkwara ịnọchite anya ndị ogbenye n’ozuzu.
- source_word: οἱ πλούσιοι
  choice: ndị ọgaranya
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị mfe isi kpọọ ndị nwere akụnụba dịka otu ìgwè.
- source_word: καταδυναστεύουσιν
  choice: na-emegbu
  rationale: “Na-emegbu” na-egosi iji ike ma ọ bụ ọnọdụ dị elu mesoo ndị ọzọ ihe n’ụzọ ọjọọ, nke dabara n’ike okwu Grik.
- source_word: ἕλκουσιν
  choice: na-adọkpụrụ
  rationale: “Na-adọkpụrụ” na-echekwa onyonyo nke ịkpọrọ mmadụ n’ike, kama iji okwu dị nro dịka “na-akpọga.”
- source_word: κριτήρια
  choice: ụlọikpe
  rationale: N’ebe a, okwu Grik na-ezo aka n’ụlọ ikpe iwu; “ụlọikpe” bụ okwu Igbo doro anya na nke a na-ejikarị eme ihe.
- source_word: καὶ αὐτοὶ
  choice: ha onwe ha ... kwa
  rationale: 'Usoro a na-eme ka nkwusiri ike nke okwu Grik pụta ìhè: ndị ọgaranya ahụ bụ kpọmkwem ndị na-adọkpụrụ ha n’ụlọikpe.'
- source_word: οὐχ ... ;
  choice: Ọ̀ bụghị ... ?
  rationale: Ajụjụ a na-atụ anya azịza nkwenye. “Ọ̀ bụghị ...?” na-enye otu mmetụta ahụ n’Igbo.
theological_decisions:
- issue: Ihe onye dị n’otu ọnụọgụ, “onye ogbenye,” na-ezo aka na ya
  choice: Otu onye ogbenye nọchitere anya ọnọdụ ahụ a kọwara n’amaokwu ndị bu ụzọ, ma na-anọchitekwa anya ndị ogbenye n’ozuzu
  alternative: Ịsụgharị ya dịka “ndị ogbenye” n’ozuzu
  rationale: Iji “onye ogbenye” na-echekwa otu ọnụọgụ dị n’asụsụ Grik na njikọ ya na ihe atụ Jems nyere na 2:2–3, n’enweghị igbochi nghọta sara mbara banyere ndị ogbenye.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Eledaala ... anya” na “na-adọkpụrụ” na-echekwa ma echiche enweghị nsọpụrụ ma ike dị na okwu mbụ; ajụjụ “Ọ̀ bụghị ...?” na-echekwa ụdị ajụjụ nkwenye nke Grik.
