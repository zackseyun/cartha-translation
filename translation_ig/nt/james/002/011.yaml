  source_fidelity: The draft correctly preserves the two commandments, the conditional contrast, and the perfect-result force of γέγονας in ‘ị ghọọla.’ ‘Egbula mmadụ’ appropriately renders the prohibition of murder in ordinary Igbo commandment style, without broadening it to killing in general. However, ‘onye ahụ kwuru’ introduces a demonstrative (‘ahụ,’ that) not expressed by the Greek articular participle.
  naturalness: The sentence is generally clear and uses a suitable dignified modern Standard Igbo register. Replacing ‘onye ahụ kwuru’ with the idiomatic reporting form ‘onye sịrị’ is more natural in this context and avoids the unnecessary demonstrative. ‘sịkwara’ naturally carries the additive force of καί.
  terminology: ‘Akwala iko,’ ‘Egbula mmadụ,’ and ‘onye na-emebi iwu’ are understandable Standard Igbo renderings with an appropriate ethical/legal register. No doctrinal expansion is introduced.
