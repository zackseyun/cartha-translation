id: JAS.2.11
reference: James 2:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: ig
  text: N’ihi na onye sịrị, “Akwala iko,” sịkwara, “Egbula mmadụ.” Ma ọ bụrụ na ị naghị akwa iko ma na-egbu mmadụ, ị ghọọla onye na-emebi iwu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: onye ahụ kwuru
  rationale: Nke a na-egosipụta articular participle dị ka onye a maara n’okwu a, na-agbakwụnyeghị ‘Chineke’ nke Grik ekwughị kpọmkwem.
- source_word: Μὴ μοιχεύσῃς
  choice: Akwala iko
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma doo anya isi nye iwu machibidoro ịkwa iko, ma kwekọọ n’ụdị iwu ahụ e hotara.
- source_word: καί
  choice: kwukwara
  rationale: Mgbakwunye ‘-kwara’ na-egosi na otu onye ahụ kwukwara iwu nke abụọ, dịka καί si arụ ọrụ ebe a.
- source_word: Μὴ φονεύσῃς
  choice: Egbula mmadụ
  rationale: N’Igbo, ịgbakwunye ‘mmadụ’ na-eme ka iwu ahụ doo anya dị ka igbu mmadụ, ọ bụghị igbu ihe ọ bụla n’ozuzu.
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-echekwa ntụgharị gaa n’ihe atụ nwere ọnọdụ, tinyere ọdịiche δέ.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: ị naghị akwa iko, ma ị na-egbu mmadụ
  rationale: Ụdị ugbu a na-enye ihe atụ izugbe, ebe ‘ma’ na-echekwa ọdịiche dị n’etiti omume abụọ ahụ.
- source_word: γέγονας
  choice: ị ghọọla
  rationale: 'Ụdị a na-echekwa perfect tense: onye ahụ abanyela n’ọnọdụ ahụ ma nọgide bụrụ onye na-emebi iwu.'
- source_word: παραβάτης νόμου
  choice: onye na-emebi iwu
  rationale: Ọ bụ okwu Igbo eke, dị mfe nghọta, nke na-egosi onye gafere ma ọ bụ mebie ihe iwu nyere n’iwu.
- source_word: νόμου
  choice: iwu
  rationale: N’Igbo, ‘iwu’ anaghị achọ mkpụrụokwu ntụaka dịka article Bekee; ọnọdụ okwu ahụ na-egosi iwu Chineke a na-ekwu maka ya.
theological_decisions:
- issue: Onye kwuru iwu ndị ahụ bụ onye?
  choice: E debere ya dịka ‘onye ahụ kwuru’ n’etinyeghị ‘Chineke’ n’ahịrịokwu ahụ.
  alternative: ‘Chineke onye kwuru’
  rationale: Ọnọdụ okwu na-egosi na ọ bụ Chineke, ma Grik kwuru naanị ‘onye ahụ kwuru’; nsụgharị ahụ anaghị agbakwunye aha a na-ekwughị kpọmkwem.
- issue: Ókè mmebi iwu ahụ ruru n’arụmụka Jemis
  choice: ‘onye na-emebi iwu’
  alternative: ‘onye na-emebi iwu ahụ naanị’
  rationale: A hapụrụ νόμου ka ọ na-ezo aka n’iwu ahụ n’ozuzu ya, kama ime ka ọ bụrụ naanị otu iwu e mebiri.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. E ji ụdị iwu ‘Akwala/Egbula’ nke ndị na-agụ Igbo na-aghọta ngwa ngwa; e zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
