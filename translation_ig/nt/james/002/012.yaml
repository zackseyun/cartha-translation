  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: ig
  text: Kwuonụ okwu n’ụzọ dị otú a, na-akpakwanụ àgwà n’ụzọ dị otú a, dịka ndị a ga-ekpe ikpe site n’iwu nke nnwere onwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως ... οὕτως
  choice: otú ahụ ... otú ahụ
  rationale: Na-echekwa nkwughachi ahụ na echiche nke ime ihe n’ụzọ e kwuru okwu ya, kama ịtụgharị nke mbụ ka ọ bụrụ naanị ‘ya mere.’
- source_word: λαλεῖτε ... ποιεῖτε
  choice: Na-ekwunụ okwu ... na-emekwanụ omume
  rationale: Ụdị iwu a na-agwa ọtụtụ mmadụ okwu doro anya ma na-ada nke ọma n’Igbo ugbu a; ‘-kwa-’ na-ejikọta ikwu okwu na ime omume.
- source_word: μέλλοντες κρίνεσθαι
  choice: ndị a ga-... kpee ikpe
  rationale: Na-egosi ikpe nke na-echere ha n’ọdịnihu n’asụsụ Igbo dị mfe ma ghara ịkọwa oge ya kpọmkwem karịa ihe Grik kwuru.
- source_word: διὰ νόμου ἐλευθερίας
  choice: jiri iwu nke nnwere onwe
  rationale: ‘Jiri’ na-egosipụta ụzọ ma ọ bụ ihe e ji ekpe ikpe, kwekọrọ na διά ya na genitive; ‘nke nnwere onwe’ na-echekwa njikọ genitive ahụ n’enweghị ịkọwa ma iwu ahụ na-enye nnwere onwe ma ọ bụ na ọ bụ iwu e ji mara nnwere onwe.
theological_decisions:
- issue: Ọrụ ‘iwu nke nnwere onwe’ n’ikpe ahụ
  choice: a ga-eji iwu nke nnwere onwe kpee ikpe
  alternative: a ga-ekpe ikpe dịka iwu nke nnwere onwe si dị
  rationale: Nhọrọ a na-echekwa ike nke διά (‘site na/iji’) ma zere ime ka ọ bụrụ naanị ụkpụrụ ntụnyere. Ọ naghịkwa akọwa kpọmkwem ụdị ikpe ahụ ma ọ bụ ndị ga-eme ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ụdị iwu ọtụtụ mmadụ ‘-nụ’ mee ka ndụmọdụ ahụ doo anya, ma e chekwara nkwughachi okwu Grik ahụ.
