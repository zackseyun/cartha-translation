review_pass:
  verdict: revise
  source_fidelity: The draft preserves the repeated οὕτως, the paired present imperatives λαλεῖτε/ποιεῖτε, the future passive sense of μέλλοντες κρίνεσθαι, and the instrumental/mediating force of διά. However, its imperative wording is not fully idiomatic Standard Igbo, and “jiri ... kpee ikpe” is less natural here than “site n’...”.
  naturalness: “Na-ekwunụ okwu” awkwardly combines the progressive na- form with the plural imperative ending. Direct plural imperatives are clearer and more natural. “Mee omume” is also less idiomatic than expressing conduct as “na-akpa àgwà.”
  terminology: “Iwu nke nnwere onwe” accurately retains νόμου ἐλευθερίας without imposing an interpretation of the genitive relationship. “Site n’iwu” appropriately reflects διά and agrees with the English audit trail’s “through the law of freedom.”
  issues:
  - severity: medium
    issue: Imperative form “Na-ekwunụ okwu” is awkward.
    rationale: λαλεῖτε is a plural present imperative. In this exhortation, “Kwuonụ okwu” is the natural direct Igbo imperative; the na- progressive construction with -nụ is stylistically strained.
  - severity: low
    issue: “na-emekwanụ omume” is not the most natural rendering of ποιεῖτε.
    rationale: The sense is to act or conduct oneself. “na-akpakwanụ àgwà” gives a natural Standard Igbo expression while retaining the parallel command and repeated manner.
  - severity: low
    issue: “a ga-eji iwu ... kpee ikpe” is heavier than needed.
    rationale: “A ga-ekpe ikpe site n’iwu ...” naturally expresses the mediating/instrumental sense of διὰ νόμου and avoids an unnecessarily marked word order.
  revised_text: Kwuonụ okwu n’ụzọ dị otú a, na-akpakwanụ àgwà n’ụzọ dị otú a, dịka ndị a ga-ekpe ikpe site n’iwu nke nnwere onwe.
