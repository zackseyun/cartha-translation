- from: ọ bụrụkwa na unu elekwasị onye yi uwe na-egbuke egbuke[a] anya wee sị ya, “Gị, nọdụ ebe a n’ebe dị mma,” ma sị nwoke ogbenye ahụ, “Gị, guzoro ebe ahụ[b], ma ọ bụ nọdụ ala n’okpuru ihe mgbakwasị ụkwụ m,”
