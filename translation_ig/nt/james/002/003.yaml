id: JAS.2.3
reference: James 2:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: ig
  text: ọ bụrụkwa na unu elekwasị onye yi uwe na-egbuke egbuke[a] anya wee sị ya, “Gị, nọdụ ebe a n’ebe dị mma,” ma sị nwoke ogbenye ahụ, “Gị, guzoro, ma ọ bụ nọdụ ebe ahụ n’okpuru ihe mgbakwasị ụkwụ m,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “uwe mara mma” ma ọ bụ “uwe dị ebube.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: unu elekwasị ... anya
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ilebara mmadụ anya n’ụzọ pụrụ iche, ọ bụghị naanị ịhụ ya anya. Nkebi a bụ Igbo nkịtị ma ọ naghị etinye okwu doro anya banyere ịkpa ókè tupu amaokwu ahụ n’onwe ya akọwa omume ahụ.
- source_word: φοροῦντα
  choice: yi
  rationale: “Yi” bụ ụzọ Igbo kachasị mfe ma kpọmkwem isi kwuo na mmadụ nwere uwe n’ahụ.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: uwe na-egbuke egbuke
  rationale: Nhọrọ a na-edobe isi echiche λαμπρός nke ihe na-enwu ma ọ bụ na-egbuke, ma n’ọnọdụ a ọ na-egosikwa uwe mara mma nke na-adọta anya.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: Gị, nọdụ ebe a n’ebe dị mma
  rationale: Ọ na-edobe iwu κάθου na uru ma ọ bụ nsọpụrụ dị n’ebe a na-enye onye ahụ ka ọ nọdụ.
- source_word: τῷ πτωχῷ
  choice: nwoke ogbenye ahụ
  rationale: Okwu Grik ahụ bụ otu onye, bụrụkwa ụdị nwoke; ya mere a hapụrụ nkọwa nwoke ahụ kama ime ya okwu na-enweghị okike.
- source_word: στῆθι
  choice: guzoro
  rationale: Nke a bụ iwu dị mfe ka onye ahụ guzo.
- source_word: ἢ κάθου ἐκεῖ
  choice: ma ọ bụ nọdụ ala ... ebe ahụ
  rationale: Nkebi a na-enye iwu ọzọ ma na-edobe echiche ἐκεῖ nke ebe dị anya; nhazi Igbo na-ejikọta “ebe ahụ” na iwu ndị ahụ n’ụzọ kwekọrọ na ọdịiche dị na ihe odide aka.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: n’okpuru ihe mgbakwasị ụkwụ m
  rationale: A hapụrụ “n’okpuru” dịka ὑπό si dị, n’agbanyeghị na okwu ahụ siri ike n’echiche nkịtị, n’ihi na ọ na-egosi mweda n’ala na enweghị nsọpụrụ a na-enye ogbenye ahụ.
theological_decisions:
- issue: Asụsụ banyere ịkpa ókè n’etiti ndị mmadụ
  choice: A kọwara ilebara onye yi uwe mara mma anya na okwu dị iche iche e kwuru nye ọgaranya na ogbenye, n’etinyeghị okwu nkọwa ozizi n’amaokwu a.
  alternative: Ịsụgharị ya ozugbo dịka “unu mee ya amara pụrụ iche” ma ọ bụ “unu kpaa ókè.”
  rationale: Ihe Jems na-ekwu n’akụkụ a bụ ịkatọ ịkpa ókè, ma amaokwu a n’onwe ya na-egosi omume na okwu e ji mee ya. Nsụgharị ahụ na-ahapụ ka isi ozizi ahụ pụta site n’ihe a kọwara na gburugburu ya.
- issue: Okike mmadụ na πτωχῷ
  choice: nwoke ogbenye ahụ
  alternative: onye ogbenye ahụ
  rationale: Ndị a na-ahụ n’ihe atụ ahụ bụ ndị ọbịa n’otu n’otu, okwu Grik ahụ dịkwa n’otu ma bụrụ ụdị nwoke. Ya mere “nwoke ogbenye ahụ” na-edobe nkọwa dị n’isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ amaokwu ahụ dịka nkebi ahịrịokwu na-aga n’ihu site n’amaokwu bu ya ụzọ. “Ihe mgbakwasị ụkwụ” bụ okwu doro anya maka ὑποπόδιον, ebe “n’okpuru” na-edobe mweda n’ala dị n’okwu Grik.
