id: JAS.2.14
reference: James 2:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: ig
  text: Ụmụnna m,[a] olee uru ọ bara ma ọ bụrụ na mmadụ asị na ya nwere okwukwe,[b] ma ọ nweghị ọrụ? Okwukwe ahụ ò nwere ike ịzọpụta ya?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụmụnna” n’ebe a nwere ike ịgụnye ụmụ nwoke na ụmụ nwanyị nọ n’obodo ndị kwere ekwe; okwu Grik ji ụdị ọtụtụ nke nwoke kpọọ ha ọnụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik πίστις nwekwara ike ịpụta “ntụkwasị obi,” ma n’ebe a “okwukwe” kacha dabara maka ihe mmadụ kwuru na ya nwere.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, “Okwukwe dị otu a ò nwere ike ịzọpụta ya?” Okwu Grik ahụ na-ezo azụ n’okwukwe ahụ e kwuru okwu ya—nke a na-ekwu na e nwere ma nke na-enweghị ọrụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: olee uru ọ bara
  rationale: Ọ bụ ajụjụ e ji ekwu okwu n'ụzọ Igbo dị ndụ, ma na-echekwa echiche nke uru ma ọ bụ abamuru bara n’eziokwu.
- source_word: ἀδελφοί μου
  choice: Ụmụnna m
  rationale: “Ụmụnna” bụ okwu nsọpụrụ a na-ejikarị akpọ ndị otu obodo okwukwe; ọ dabara n’ụdị ịkpọ ndị mmadụ ọnụ nke Grik, nke nwere ike ịgụnye ụmụ nwoke na ụmụ nwanyị.
- source_word: πίστιν
  choice: okwukwe
  rationale: “Okwukwe” dabara n’ebe a maka ihe mmadụ na-ekwu na ya nwere; “ntụkwasị obi” nwekwara ike ịkọwa akụkụ nke okwu Grik ahụ.
- source_word: λέγῃ τις ἔχειν
  choice: ma ọ bụrụ na mmadụ asị na ya nwere
  rationale: Nke a na-anọ nso n’usoro Grik ma ghara ịgbakwunye echiche siri ike nke “ịzọrọ” karịa ihe e dere.
- source_word: ἔργα
  choice: ọrụ
  rationale: “Ọrụ” na-echekwa njikọ okwu dị n’arụmụka Jems banyere okwukwe na ọrụ, kama ime ya naanị “omume ọma.”
- source_word: μὴ ἔχῃ
  choice: ma ọ nweghị
  rationale: Nsụgharị dị mfe ma bụrụ nke ebumpụta ụwa maka enweghị ihe ahụ e kwuru.
- source_word: μὴ δύναται
  choice: ò nwere ike
  rationale: E chekwara ya dịka ajụjụ nkwupụta nke na-atụ anya azịza mba, n’enweghị itinye azịza ahụ kpọmkwem n’ime ederede.
- source_word: ἡ πίστις
  choice: Okwukwe ahụ
  rationale: “Ahụ” na-egosi na okwu ahụ na-alaghachi n’ụdị okwukwe a ka kọwara—okwukwe mmadụ kwuru na ya nwere ma nke na-enweghị ọrụ—ma ọ naghị ekpebi arụmụka nkà mmụta okpukpe karịa okwu Grik.
- source_word: σῶσαι αὐτόν
  choice: ịzọpụta ya
  rationale: “Ịzọpụta” na-echekwa ibu na nghọta okpukpe nke σῴζω n’ebe a, ebe “ya” na-anọchi onye ahụ a kpọtụrụ aha.
theological_decisions:
- issue: Mmekọrịta okwukwe na ọrụ n’ajụjụ nkwupụta a
  choice: A tụgharịrị ἡ πίστις dịka “Okwukwe ahụ,” na-ezo azụ n’okwukwe a na-ekwu na e nwere ma nke na-enweghị ọrụ.
  alternative: “Okwukwe dị otu a” ma ọ bụ “okwukwe” n’ozuzu ya.
  rationale: Nke a na-echekwa nrụtụaka nke mkpụrụokwu Grik nwere article, na nchekasị nkà mmụta okpukpe nke amaokwu ahụ, n’enweghị ikwu na Jems na-ajụ ma okwukwe ọ bụla pụrụ ịzọpụta.
- issue: Ndị a na-akpọ okwu na nnọchiaha onye
  choice: E ji “Ụmụnna m” kpọọ obodo ndị kwere ekwe, ma jiri “ya” maka onye ahụ a na-ekwu maka ya.
  alternative: “Ụmụnne m ndị nwoke na ndị nwanyị” na nnọchiaha gụnyere mmadụ niile.
  rationale: “Ụmụnna” bụ okwu Igbo nwere ike ịrụ ọrụ n’ụzọ nnọchianya maka obodo dum, ebe “ya” anaghị egosi nwoke ma ọ bụ nwanyị n’asụsụ Igbo; nke a na-echekwa nghọta ebe okwu Grik dị n’ụdị nwoke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-anọ nso n’ederede Grik, ma e mere ya ka ọ na-ada nke ọma n’Igbo. E chekwara okwu ndị bụ isi “okwukwe,” “ọrụ,” na “ịzọpụta” n’ihi njikọ ha na arụmụka gbara amaokwu a gburugburu.
