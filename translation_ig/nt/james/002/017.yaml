review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the comparison (οὕτως καί), the conditional clause, works, and the force of νεκρά. However, “bụ nke nwụrụ anwụ” is a less direct and somewhat awkward predicate for “is dead”; it can sound like “is something that died,” rather than the Greek’s direct assertion. The final “n’onwe ya” appropriately retains the sense of faith considered apart from works.
  naturalness: “N’otu aka ahụkwa” is understandable, but “Otú ahụkwa” is the more idiomatic, concise Standard Igbo discourse expression here. A direct predicate, “nwụrụ anwụ,” makes the sentence more natural and forceful.
  terminology: “Okwukwe” is the suitable established rendering of πίστις. “Ọrụ” preserves the broad lexical connection in James’s argument without narrowing it to a particular kind of deed. The lexical-alternative footnote is retained, with smoother Igbo wording.
  issues:
  - severity: low
    issue: The phrase “bụ nke nwụrụ anwụ” is indirect and stylistically awkward.
    rationale: νεκρά ἐστιν is a direct predicate assertion, best rendered directly in Igbo as “nwụrụ anwụ.”
  - severity: low
    issue: “N’otu aka ahụkwa” is less idiomatic than “Otú ahụkwa” in this argumentative comparison.
    rationale: “Otú ahụkwa” naturally expresses οὕτως καί without adding a potentially distracting literal sense of “in the same manner/hand.”
  revised_text: Otú ahụkwa, okwukwe[a], ọ bụrụ na o nweghị ọrụ, nwụrụ anwụ n’onwe ya.
