- from: N’otu aka ahụkwa, okwukwe[a], ọ bụrụ na o nweghị ọrụ, bụ nke nwụrụ anwụ n’onwe ya.
  to: Otú ahụkwa, okwukwe[a], ọ bụrụ na o nweghị ọrụ, nwụrụ anwụ n’onwe ya.
  rationale: The revision preserves every element of the Greek while using more idiomatic Standard Igbo. It retains the deliberate ambiguity and theological restraint of πίστις as “okwukwe,” keeps “ọrụ” broad, and preserves καθ’ ἑαυτήν with “n’onwe ya.”
  reviewer_model: gpt-5.6-terra
