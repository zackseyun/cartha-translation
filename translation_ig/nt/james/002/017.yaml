  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: ig
  text: Otú ahụkwa, okwukwe[a], ọ bụrụ na o nweghị ọrụ, nwụrụ anwụ n’onwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ntụkwasị obi”; “ikwesị ntụkwasị obi” adịghị yikarị ka ọ bụ ihe a na-ekwu ebe a. Okwu Grik ahụ bụ pistis nwere ike ịpụta ihe ndị a, ma “okwukwe” kacha daba n’arụmụka Jemis n’amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: N’otu aka ahụkwa
  rationale: Nke a na-ejikọta okwu a na ihe atụ dị n’amaokwu ndị bu ya ụzọ, ma na-egosikwa myirịta ahụ n’Igbo doro anya.
- source_word: ἡ πίστις
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị sụgharịa πίστις, ọ dịkwa mma n’arụmụka Jemis banyere okwukwe mmadụ na-ekwu na o nwere.
- source_word: ἐὰν μὴ ἔχῃ
  choice: ọ bụrụ na o nweghị
  rationale: Nke a na-egosipụta ọnọdụ e ji ἐὰν μή mee okwu, n’ụzọ dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: ἔργα
  choice: ọrụ
  rationale: “Ọrụ” na-echekwa obosara okwu Grik ahụ na njikọ ya na arụmụka gbara amaokwu a gburugburu, n’akọwaghị ya naanị dị ka otu ụdị omume ọma.
- source_word: νεκρά
  choice: bụ nke nwụrụ anwụ
  rationale: Nke a na-echekwa ihe atụ siri ike nke νεκρά, ma mee ka ahịrịokwu ahụ daa nke ọma n’Igbo.
- source_word: καθ’ ἑαυτήν
  choice: n’onwe ya
  rationale: Nkebiokwu a na-egosi okwukwe e weere naanị ya, nke ọrụ na-adịghị eso ya, n’etinyeghị nkọwa ozizi ọzọ.
theological_decisions:
- issue: Nsụgharị πίστις n’ebe a na-arụrịta ụka banyere okwukwe na ọrụ
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: “Okwukwe” kacha daba n’arụmụka Jemis n’amaokwu a. Ọ na-echekwa esemokwu dị n’etiti okwukwe a na-ekwu n’ọnụ na ọrụ na-eso ya, n’edoziwaghị esemokwu ahụ dịka ozizi otu ụka si dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ “ọrụ” ka ọ bụrụ okwu sara mbara iji chekwaa njikọ okwu na arụmụka Jemis, ma tinye akara ndetu [a] ozugbo n’azụ “okwukwe.”
