revisions:
- from: Unu na-ahụ na ọ bụ site n’ọrụ ka a na-agụ mmadụ[b] n’onye ezi omume[a], ọ bụghịkwa site n’okwukwe[c] naanị.
  to: Unu na-ahụ na ọ bụ site n’ọrụ ka a na-agụ mmadụ[b] dịka onye ezi omume[a], ọ bụghịkwa site n’okwukwe[c] naanị.
  rationale: The revision corrects the grammar and idiom of the rendering for δικαιοῦται by adding dịka, without changing its lexical or theological openness. It retains the source’s direct plural address, works/faith contrast, generic human reference, and exclusivity of μόνον. Footnote anchors remain attached to the relevant terms, and the alternative-reading note preserves rather than resolves the debated nuance of δικαιόω.
