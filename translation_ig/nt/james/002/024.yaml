id: JAS.2.24
reference: James 2:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: ig
  text: Unu na-ahụ na ọ bụ site n’ọrụ ka a na-agụ mmadụ[b] dịka onye ezi omume[a], ọ bụghịkwa site n’okwukwe[c] naanị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a na-egosi na ọ bụ onye ezi omume” ma ọ bụ “a na-egosi na o ziri ezi.” E debere okwu Jemis otú o si dị n’enweghị ikpebi esemokwu nkọwa banyere otú ojiji okwu a si metụta ojiji Pọl ji “ịgụ mmadụ dịka onye ezi omume.”
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, ọ bụ “nwoke” ma ọ bụ “mmadụ”; e ji ya ebe a nọchite anya mmadụ n’ozuzu ya.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị okwu Grik ahụ dịka “ikwesi ntụkwasị obi” ma ọ bụ “ntụkwasị obi,” ọ bụ ezie na “okwukwe” bụ ntụgharị a na-eji ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: Unu na-ahụ
  rationale: Ọ bụ ngwaa dị n’ụdị onye nke abụọ, ọtụtụ mmadụ, nke na-akpọ ndị na-ege ntị ka ha ghọta ihe ihe atụ gara aga gosiri. “Unu na-ahụ” na-echekwa ya dịka nkwupụta, ọ bụghị iwu.
- source_word: ἐξ ἔργων
  choice: site n’ọrụ
  rationale: ἐξ na-egosi isi mmalite ma ọ bụ ihe a dabere na ya; “site n’ọrụ” na-enye nghọta ahụ n’Igbo n’enweghị ịgbakwunye nkọwa.
- source_word: δικαιοῦται
  choice: a na-agụ … n’onye ezi omume
  rationale: 'Nkebiokwu a na-echekwa ibu okwu δικαιόω na esemokwu nkọwa ya: ọ pụrụ ịpụta ịgụ mmadụ n’onye ezi omume, igosi na ọ bụ onye ezi omume, ma ọ bụ ịkwado na ihe o mere ziri ezi.'
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: “Mmadụ” bụ okwu Igbo eke nke na-anọchi mmadụ n’ozuzu ya. Ọ naghị amanye nwoke naanị, ma ọ dabara n’ọrụ nnọchite anya nke okwu Grik ahụ n’ebe a.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ ntụgharị Igbo a na-ahụkarị maka πίστις ma na-echekwa ọdịiche dị n’etiti ọrụ na okwukwe n’arụmụka a.
- source_word: μόνον
  choice: naanị
  rationale: “Naanị” na-esochi “okwukwe” n’usoro Igbo eke ma na-echekwa echiche nke ikewapụ ihe ndị ọzọ.
theological_decisions:
- issue: Ihe δικαιοῦται pụtara n’ihe gbasara ozizi ịgụ mmadụ n’onye ezi omume
  choice: E debere “a na-agụ … n’onye ezi omume” n’ahịrị bụ isi.
  alternative: “a na-egosi na … bụ onye ezi omume” ma ọ bụ “a na-akwado na … ziri ezi”
  rationale: Nke a na-ahapụ okwu Jemis ka o guzo n’enweghị ime ka ọ kwekọọ n’ụzọ a manyere amanye na ojiji Pọl ji δικαιόω. Ihe ndị ọzọ okwu ahụ pụrụ ịpụta dị n’ala peeji.
- issue: ἄνθρωπος dịka okwu nnọchite anya mmadụ n’ozuzu
  choice: A sụgharịrị ya “mmadụ.”
  alternative: “nwoke” ma ọ bụ “onye mmadụ”
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n’ụdị nwoke n’asụsụ Grik, n’ebe a ọ na-anọchi mmadụ n’ozuzu ya. “Mmadụ” na-enye nghọta ahụ n’Igbo n’enweghị ime ka okwu ahụ bụrụ maka nwoke naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ùgwù. Usoro “ọ bụ … ka” na-eme ka ọdịiche dị n’etiti ọrụ na okwukwe pụta ìhè n’ụzọ Igbo eke, ebe “a na-agụ … n’onye ezi omume” na-echekwa okwu nkà mmụta okpukpe na mgbagwoju nkọwa nke isi mmalite ahụ.
