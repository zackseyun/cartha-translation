review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the plural indicative appeal in ὁρᾶτε, the contrast of works with faith alone, and the generic force of ἄνθρωπος. However, the main rendering of δικαιοῦται needs the comparative particle dịka: without it, “a na-agụ mmadụ n’onye ezi omume” is not idiomatic Standard Igbo and can obscure the intended ‘reckon/count as righteous’ sense.'
  naturalness: “Unu na-ahụ” and the overall contrastive construction are natural. Revising “n’onye ezi omume” to “dịka onye ezi omume” makes the central clause grammatical and clear in modern Standard Igbo. The revised notes also make the alternative ‘vindicated’ sense refer unambiguously to the person.
  terminology: “Okwukwe” is an appropriate default for πίστις, and “mmadụ” properly conveys the generic human reference without making the statement male-exclusive. “A na-agụ ... dịka onye ezi omume” retains a recognized formal/theological rendering of δικαιόω while allowing the contextual alternatives in the footnote.
  issues:
  - severity: medium
    issue: The phrase “a na-agụ mmadụ n’onye ezi omume” lacks the needed comparative construction.
    rationale: For the sense ‘a person is counted/reckoned as righteous,’ Standard Igbo requires “a na-agụ mmadụ dịka onye ezi omume.” The existing wording is unnatural and risks being misunderstood.
  - severity: low
    issue: The second alternative in footnote a is not clearly person-directed.
    rationale: “A na-akwado na ọ ziri ezi” may be heard as validating an unspecified action or proposition. “A na-egosi na o ziri ezi” more clearly supplies the personal vindication alternative without settling the interpretive question.
