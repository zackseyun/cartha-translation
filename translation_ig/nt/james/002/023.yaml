id: JAS.2.23
reference: James 2:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: ig
  text: A mezuru ihe Akwụkwọ Nsọ kwuru, sị, “Ebreham kweere Chineke, a gụpụtara ya nke ahụ ka ọ bụrụ ezi omume[a],” a kpọkwara ya enyi Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a gụụrụ ya nke ahụ” ma ọ bụ “a debere ya n’aka ya.” Ngwaa Grik ahụ nwekwara ike ịpụta “gụọ” ma ọ bụ “deba n’aka mmadụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπληρώθη
  choice: e wee mezuo
  rationale: Nke a na-edobe olu nnara nke ngwaa Grik ma na-egosi na okwu Akwụkwọ Nsọ ahụ ruru mmezu ya.
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: ihe e dere n’Akwụkwọ Nsọ, nke na-ekwu
  rationale: Nke a na-egosi na γραφή bụ Akwụkwọ Nsọ, ọ bụghị naanị ihe odide nkịtị, ma na-edobekwa λέγουσα dị ka okwu na-ewebata nhota.
- source_word: Ἐπίστευσεν ... τῷ θεῷ
  choice: Ebreham kwenyere Chineke
  rationale: “Kwenyere Chineke” na-egosi na Ebreham nabatara okwu Chineke dịka eziokwu; ọ naghị agbanwe ya ka ọ bụrụ naanị nkwenye na Chineke dị.
- source_word: ἐλογίσθη αὐτῷ
  choice: e wee gụọ nke ahụ nye ya
  rationale: Okwu a na-edobe echiche nke ịgụ ma ọ bụ ide ihe n’aha mmadụ. “Nke ahụ” na-anọchi anya nkwenye Ebreham n’enweghị itinye nkọwa ozizi ọzọ.
- source_word: εἰς δικαιοσύνην
  choice: dị ka ezi omume
  rationale: “Ezi omume” dabara n’ọnọdụ nhota Jenesis a ma na-edobe echiche δικαιοσύνη n’enweghị ịgbanwe ya ka ọ bụrụ naanị ikpe ziri ezi n’etiti mmadụ.
- source_word: φίλος θεοῦ
  choice: enyi Chineke
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke sitere nso n’okwu Grik maka mmekọrịta ahụ.
- source_word: ἐκλήθη
  choice: a kpọkwara ya
  rationale: 'Nke a na-edobe obosara nke καλέω: a kpọrọ ya aha ahụ ma ọ bụ mara ya dịka onye dị otú ahụ, n’enweghị ịkọwa onye kpọrọ ya.'
theological_decisions:
- issue: Mmekọrịta okwukwe Ebreham na ọrụ ya n’arụmụka Jemis
  choice: Ịhapụ okwu ahụ ka o kwuo na Akwụkwọ Nsọ mezuru, ma ghara itinye nkọwa na-ekewapụ okwukwe n’irube isi ma ọ bụ mee ka ọrụ dochie okwukwe.
  alternative: Ịsụgharị ya n’ụzọ na-eme ka ezi omume bụrụ naanị mkpebi iwu nke na-enweghị njikọ n’omume, ma ọ bụ n’ụzọ na-eme ka ọrụ bụrụ ihe dochiri okwukwe.
  rationale: Amaokwu ahụ jikọtara nkwenye Ebreham na mmezu okwu Akwụkwọ Nsọ. Nsụgharị ahụ kwesịrị idobe esemokwu nkà mmụta okpukpe a kama idozi ya n’aha otu ozizi.
- issue: Nkọwa δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a, “ezi omume” dabara nke ọma na nhota Jenesis na okwu banyere ịgụ ihe nye Ebreham; “ikpe ziri ezi” nwere ike ime ka uche gaa n’ikpe ikpe n’ebe mmadụ nọ karịa ihe amaokwu ahụ na-ekwu.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. “Kwenyere Chineke” na-edobe ọdịiche dị n’etiti ikwere ihe Chineke kwuru na naanị ikwere na Chineke dị. Akara nkọwa ala peeji [a] dị n’akụkụ okwu ọ na-akọwa.
