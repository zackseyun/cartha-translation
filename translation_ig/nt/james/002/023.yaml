revisions:
- from: E wee mezuo ihe e dere n’Akwụkwọ Nsọ, nke na-ekwu, “Ebreham kwenyere Chineke, e wee gụọ nke ahụ nye ya dị ka ezi omume[a],” a kpọkwara ya enyi Chineke.
  to: A mezuru ihe Akwụkwọ Nsọ kwuru, sị, “Ebreham kweere Chineke, a gụpụtara ya nke ahụ ka ọ bụrụ ezi omume[a],” a kpọkwara ya enyi Chineke.
  rationale: The revision clarifies the Greek passive fulfillment formula and replaces a potentially misleading literal rendering of the reckoning clause with natural Standard Igbo. It retains the source’s ambiguity by referring simply to “nke ahụ,” rather than specifying the faith as the grammatical subject, and does not resolve theological questions beyond the verse.
