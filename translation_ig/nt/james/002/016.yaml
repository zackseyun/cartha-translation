review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the hypothetical address, the dismissal formula, the failure to provide bodily necessities, and the rhetorical question. However, “na-ekpo ọkụ” is an indicative/progressive expression (“are keeping warm”), not an appropriate plural imperative corresponding to θερμαίνεσθε. “Rijukwaanụ afọ” is understandable but more explicitly introduces eating than the Greek verb requires.
  naturalness: The sentence is generally clear Standard Igbo, but the quoted imperative needs an imperative form. “Kpoonụ ọkụ, rijụkwanụ afọ” is natural and preserves the practical force without over-specifying how warmth and food are obtained.
  terminology: “Ihe ndị dị mkpa maka ahụ ha” accurately represents τὰ ἐπιτήδεια τοῦ σώματος. “Uru gịnị ka nke ahụ bara?” is an idiomatic rendering of τί ὄφελος. The revised footnote states the passive/middle ambiguity more naturally and accurately.
  issues:
  - severity: medium
    issue: “na-ekpo ọkụ” is not an imperative.
    rationale: θερμαίνεσθε is a plural imperative. In this direct address, Standard Igbo requires an imperative such as “kpoonụ ọkụ,” rather than the progressive form “na-ekpo ọkụ.”
  - severity: low
    issue: “Rijukwaanụ afọ” can imply the specific act of eating.
    rationale: χορτάζεσθε means be filled/satisfied, especially with food, but does not explicitly name eating. “Rijụkwanụ afọ” is slightly less explicit while remaining idiomatic in context.
  revised_text: ma otu onye n’ime unu asị ha, “Gaanụ n’udo; kpoonụ ọkụ, rijụkwanụ afọ,”[a] ma unu enyeghị ha ihe ndị dị mkpa maka ahụ ha, uru gịnị ka nke ahụ bara?
  revised_footnotes:
