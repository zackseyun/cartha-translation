revisions:
- from: ma otu onye n’ime unu asị ha, “Gaanụ n’udo; na-ekpo ọkụ, rijukwaanụ afọ,”[a] ma unu enyeghị ha ihe ndị dị mkpa maka ahụ ha, uru gịnị ka nke ahụ bara?
  to: ma otu onye n’ime unu asị ha, “Gaanụ n’udo; kpoonụ ọkụ, rijụkwanụ afọ,”[a] ma unu enyeghị ha ihe ndị dị mkpa maka ahụ ha, uru gịnị ka nke ahụ bara?
  rationale: The revision replaces a non-imperative progressive verb with a plural imperative and slightly reduces the added specificity of eating. It retains the source’s ambiguity concerning whether the recipients are to obtain warmth and fullness themselves or receive them from others; the alternative passive sense remains in the footnote.
