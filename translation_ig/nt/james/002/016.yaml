id: JAS.2.16
reference: James 2:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: ig
  text: ma otu onye n’ime unu asị ha, “Gaanụ n’udo; kpoonụ ọkụ, rijụkwanụ afọ,”[a] ma unu enyeghị ha ihe ndị dị mkpa maka ahụ ha, uru gịnị ka nke ahụ bara?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karịa, “ka e kpoo unu ọkụ, ka e meekwa ka afọ ju unu.” Ụdị ngwaa Grik ndị a nwere ike ịpụta na a na-emere ha ihe ndị a, ma ọ bụ na ha na-emere onwe ha ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις ... ἐξ ὑμῶν
  choice: ma otu onye n’ime unu asị ha
  rationale: Nke a na-ewebata ihe atụ e chere eche. “Otu onye n’ime unu” na-egosipụta nke ọma na onye ahụ si n’etiti ndị a na-agwa okwu; “ma” na-ebute ọdịiche dị n’etiti mkpa ndị ahụ na naanị okwu e kwuru.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: Gaanụ n’udo
  rationale: Nke a bụ ụzọ e si agọzi ma ọ bụ ezipụ mmadụ; ọ bụkwa okwu Igbo doro anya nke na-echekwa mkparị zoro ezo dị n’okwu ahụ mgbe e nyereghị enyemaka.
- source_word: θερμαίνεσθε
  choice: na-ekpo ọkụ
  rationale: Nhọrọ a na-ada nke ọma n’Igbo ma ghara ikpebi ma ụdị Grik ahụ bụ passive ka ọ bụ middle. Ihe e dere n’ala peeji na-echekwa nsụgharị nkịtị karị.
- source_word: χορτάζεσθε
  choice: rijukwaanụ afọ
  rationale: Ngwaa ahụ na-egosi iju afọ ma ọ bụ inwe afọ ojuju, karịsịa site n’ihe oriri. “Rijukwaanụ afọ” na-eme ka ihe ọ pụtara doo onye Igbo anya n’ọnọdụ a.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: ma unu enyeghị ha
  rationale: “Ma” na-egosipụta ọdịiche dị ike n’etiti okwu ọma ahụ na enweghị omume ga-egbo mkpa ha.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: ihe ndị dị mkpa maka ahụ ha
  rationale: Nke a na-egosipụta ihe ndị ahụ mmadụ chọrọ maka mkpa anụ ahụ, n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: τί ὄφελος;
  choice: uru gịnị ka nke ahụ bara?
  rationale: Ajụjụ a na-ajụ uru ihe ahụ bara n’ezie; ụdị Igbo a bụ nke ebumpụta ụwa ma na-echekwa ike ajụjụ Grik ahụ.
theological_decisions:
- issue: Ụdị olu nke θερμαίνεσθε na χορτάζεσθε
  choice: “na-ekpo ọkụ, rijukwaanụ afọ” nke na-akọwaghị kpọmkwem ma ha ga-eme ya n’onwe ha ka a ga-emere ha ya
  alternative: “ka e mee ka unu kpoo ọkụ, ka e meekwa ka afọ ju unu” ma ọ bụ “meenụ ka ahụ kpoo unu ọkụ, meekwa ka afọ ju unu”
  rationale: Isi okwu Jemis bụ na okwu ọma enweghị uru ma ọ bụrụ na e nyeghị ndị nọ ná mkpa ihe ha chọrọ. Ya mere, nsụgharị ahụ anaghị edozi nghọtahie olu ngwaa Grik n’ụzọ ga-etinye echiche na-adịghị mkpa n’amaokwu ahụ; nkọwa ala peeji na-echekwa ihe ọzọ a pụrụ ịghọta.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ugwu. E debere ọtụtụ okwu onye ahụ n’ọnụ n’ụdị ọtụtụ n’ihi na αὐτοῖς na imperatives ndị ahụ bụ plural. Akara nkọwa [a] dị ozugbo n’isi ederede.
