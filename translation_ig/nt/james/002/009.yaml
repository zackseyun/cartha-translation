base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: ig
  text: Ma ọ bụrụ na unu na-ele mmadụ anya n'ihu[a], unu na-eme mmehie, ma iwu ahụ na-ama unu ikpe[b] dị ka ndị na-emebi iwu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu na-emere mmadụ amara n’ihi onye ọ bụ.” Okwu Grik ahụ pụtara ikpe ma ọ bụ imeso ndị mmadụ omume dabere n'ọkwá ha ma ọ bụ ihe a na-ahụ anya banyere ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “iwu ahụ na-ekpughe mmejọ unu” ma ọ bụ “na-abara unu mba.” Okwu ahụ nwere echiche nke iweta mmejọ n'ìhè ma gosipụta na mmadụ ikpe mara.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “dị ka ndị dara iwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-echekwa ma ọnọdụ nke εἰ ma obere ntụgharị ma ọ bụ ọdịiche nke δέ n'ụzọ Igbo doro anya.
- source_word: προσωπολημπτεῖτε
  choice: unu na-ele mmadụ anya n'ihu
  rationale: Akpaalaokwu Igbo a na-egosi ile mmadụ iche ma ọ bụ imere ya amara n'ihi ọkwá, akụ̀, ma ọ bụ ihe a na-ahụ anya.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: unu na-eme mmehie
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke kwesịrị ekwesị isi kwuo ime ma ọ bụ ịrụ mmehie; ọ na-echekwa omume na-aga n'ihu nke present tense.
- source_word: ἐλεγχόμενοι
  choice: na-amakwa unu ikpe
  rationale: N'ọnọdụ iwu nke amaokwu a, okwu ahụ na-egosi na iwu na-ekpughe mmejọ ma gosipụta onye ahụ dị ka onye ikpe mara. E ji ngwaa nwere isiokwu doro anya mee participle ahụ ka Igbo wee na-aga nke ọma.
- source_word: ὑπὸ τοῦ νόμου
  choice: iwu ahụ
  rationale: A hapụrụ 'iwu' n'enweghị nkọwa dịka 'Iwu Mosis' ma ọ bụ 'iwu Chineke,' ka a ghara imechi ihe Grik hapụrụ sara mbara; 'ahụ' na-egosi iwu a na-ekwu maka ya n'ọnọdụ ahụ.
- source_word: ὡς παραβάται
  choice: dị ka ndị na-emebi iwu
  rationale: Nke a na-enye echiche nke ndị gafere ókè iwu ma ọ bụ ndị dara iwu, n'okwu Igbo ndị mmadụ na-aghọta ngwa ngwa.
theological_decisions:
- issue: Ụdị iwu a kpọrọ νόμος n'arụmụka omume Jemis
  choice: iwu ahụ
  alternative: Iwu Mosis; iwu Chineke
  rationale: Grik na-egosi iwu dịka ụkpụrụ na-ekpughe ile mmadụ anya n'ihu dị ka mmehie, ma ọ naghị akọwa ya kpọmkwem dịka naanị Iwu Mosis ma ọ bụ tinye nkọwa usoro okpukpe ọzọ.
- issue: Mmekọrịta dị n'etiti ime mmehie na ịbụ onye iwu mara ikpe
  choice: 'E jikọtara ha dị ka omume na nsonaazụ ya: ''unu na-eme mmehie, iwu ahụ na-amakwa unu ikpe.'''
  alternative: 'Ịgụ participle ahụ naanị dịka nkọwa oge: ''mgbe iwu ahụ na-ama unu ikpe'''
  rationale: Nhazi a na-echekwa ike participle passive ahụ na ọrụ iwu nke ikpughe ma gosipụta ikpe ọmụma, n'enweghị ịkọwa karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ 'ile mmadụ anya n'ihu' dịka akpaalaokwu nkịtị; a zere okwu ụka pụrụ iche na nkọwa nke ga-eme νόμος ka ọ bụrụ naanị otu usoro iwu.
