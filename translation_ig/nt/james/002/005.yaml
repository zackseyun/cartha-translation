id: JAS.2.5
reference: James 2:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: ig
  text: Geenụ ntị, ụmụnne m ndị m hụrụ n’anya:[a] Ọ̀ bụghị Chineke họpụtara ndị ogbenye n’anya ụwa[b] ka ha bụrụ ndị bara ọgaranya n’okwukwe[c] bụrụkwa ndị nketa nke alaeze ahụ o kwere ndị hụrụ ya n’anya ná nkwa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnne” dị n’ụdị ụtọasụsụ nwoke, ma mgbe e ji ya akpọ ndị kwere ekwe, ọ pụrụ ịgụnye ụmụ nwoke na ụmụ nwaanyị.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ndị ogbenye n’ụkpụrụ ụwa” ma ọ bụ “ndị ụwa na-ele anya dị ka ndị ogbenye.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị “okwukwe” ebe a ka ọ bụrụ “ntụkwasị obi,” ma ọ bụ, nke yikarịrị obere, “ikwesi ntụkwasị obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: Geenụ ntị
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha lebara okwu na-abịa anya; “Geenụ ntị” bụ Igbo doro anya ma dịkwa ndụ.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: ụmụnne m ndị m hụrụ n’anya
  rationale: “Ụmụnne” bụ okwu Igbo nkịtị maka ndị otu ezinụlọ ma ọ bụ ndị otu okwukwe, ọ pụkwara ịgụnye nwoke na nwaanyị; ahịrịokwu so ya na-egosipụta ἀγαπητοί nke ọma.
- source_word: ἐξελέξατο
  choice: họọrọ
  rationale: “Họọrọ” na-egosipụta omume Chineke n’enweghị ịtinye usoro ozizi gbasara nhọpụta nke karịrị ihe amaokwu ahụ kwuru.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: ndị ụwa weere dị ka ndị ogbenye
  rationale: Nke a na-egosipụta dative nke echiche ma ọ bụ ụkpụrụ ụwa, kama ime ka okwu ahụ pụta nanị na ha bi n’ụwa.
- source_word: πλουσίους ἐν πίστει
  choice: ka ha baa ọgaranya n’okwukwe
  rationale: “Baa ọgaranya n’okwukwe” na-echekwa ọdịiche dị n’etiti ịda ogbenye n’ụwa na ịba ọgaranya n’okwukwe; “okwukwe” bụ ntụgharị kacha kwekọọ ebe a.
- source_word: κληρονόμους τῆς βασιλείας
  choice: ndị nketa nke alaeze
  rationale: “Ndị nketa” na-echekwa echiche iwu na nke ezinụlọ dị na κληρονόμοι, ebe “alaeze” bụ okwu kwesịrị ekwesị maka βασιλεία.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: nke alaeze ahụ o kwere ndị hụrụ ya n’anya ná nkwa
  rationale: Nhazi a na-eme ka o doo anya n’Igbo na ọ bụ alaeze ahụ ka Chineke kwere ná nkwa, nakwa na ndị nnata nkwa ahụ bụ ndị hụrụ ya n’anya.
theological_decisions:
- issue: Ịghọta nhọpụta Chineke n’ụzọ karịrị ihe amaokwu ahụ kwuru
  choice: Jiri “họọrọ” naanị, n’enweghị nkọwa ozizi agbakwunyere.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka ozizi akara aka ma ọ bụ nhọpụta ruo nzọpụta pụta ìhè.
  rationale: Isi okwu Jemes ebe a bụ otú Chineke si ele ndị ogbenye anya n’ụzọ dị iche na ịkpa ókè mmadụ; nsụgharị ekwesịghị idozi arụmụka ozizi ndị e mesịrị.
- issue: Ndị ἀδελφοί na-agụnye
  choice: Jiri “ụmụnne m,” nke bụ okwu eke n’Igbo ma nwee ike ịgụnye ọgbakọ dum.
  alternative: “Ụmụnna m” ma ọ bụ ikwu kpọmkwem “ụmụnna m ndị nwoke na ndị nwaanyị.”
  rationale: Ọ bụ ezie na okwu Grik bụ ọtụtụ nke ụdị nwoke, ọ na-arụkarị ọrụ dị ka ịkpọ ọgbakọ ndị kwere ekwe dum; “ụmụnne” na-echekwa mmekọrịta ezinụlọ ahụ n’enweghị ịmanye nwoke naanị.
- issue: Ihe πίστις pụtara n’amaokwu a
  choice: “okwukwe”
  alternative: “ntụkwasị obi” ma ọ bụ, nke yikarịrị obere ebe a, “ikwesị ntụkwasị obi.”
  rationale: N’okwu “ọgaranya n’okwukwe,” ihe a na-elekwasị anya yikarịrị ka ọ bụ okwukwe ma ọ bụ ntụkwasị obi n’ebe Chineke nọ, ọ bụghị àgwà ikwesị ntụkwasị obi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ajụjụ ahụ ka bụ ajụjụ nkwupụta nke na-atụ anya azịza ee. E debere ụda ịhụnanya nke onye dere akwụkwọ ahụ na ọdịiche dị n’etiti ụkpụrụ ụwa na akụnụba nke okwukwe.
