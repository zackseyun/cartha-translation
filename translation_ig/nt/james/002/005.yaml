  to: Geenụ ntị, ụmụnne m ndị m hụrụ n’anya:[a] Ọ̀ bụghị Chineke họpụtara ndị ogbenye n’anya ụwa[b] ka ha bụrụ ndị bara ọgaranya n’okwukwe[c] bụrụkwa ndị nketa nke alaeze ahụ o kwere ndị hụrụ ya n’anya ná nkwa?
