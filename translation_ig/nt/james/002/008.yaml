id: JAS.2.8
reference: James 2:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: ig
  text: Ma ọ bụrụ na unu na-emezu iwu eze[a] dịka Akwụkwọ Nsọ si kwuo, “Ị ga-ahụ onye agbata obi gị n’anya dịka onwe gị,” unu na-eme nke ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “iwu nke eze” ma ọ bụ “iwu nke alaeze.” Okwu Grik a sụgharịrị “eze” pụrụ igosi na iwu ahụ sitere n’aka eze ma ọ bụ na ọ bụ iwu kachasị elu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: Ma ọ bụrụ n’ezie
  rationale: Nke a na-egosi ọnọdụ, tinyekwa ntakịrị ntụgharị ma ọ bụ nkwenye siri ike; okwu Igbo a na-ebute ha abụọ n’ụzọ doro anya.
- source_word: νόμον ... βασιλικὸν
  choice: iwu eze
  rationale: βασιλικός pụtara ihe metụtara eze ma ọ bụ nke eze; “iwu eze” bụ okwu Igbo dị mfe nke na-ahapụghị ajụjụ ma ihe a na-emesi ike bụ isi iyi iwu ahụ ka ọ bụ ọkwa ya.
- source_word: τελεῖτε
  choice: na-emezu
  rationale: τελέω ebe a bụ imezu ma ọ bụ mezuo ihe iwu chọrọ; “na-emezu” na-echekwa nghọta ahụ na omume na-aga n’ihu.
- source_word: κατὰ τὴν γραφήν
  choice: dị ka Akwụkwọ Nsọ si kwuo
  rationale: Nke a na-egosi na omume ahụ kwekọrọ n’ihe otu akụkụ Akwụkwọ Nsọ kwuru, ma bụrụkwa Igbo eke.
- source_word: Ἀγαπήσεις
  choice: Ị ga-ahụ ... n’anya
  rationale: Ọdịdị ọdịnihu ahụ na-arụ ọrụ dịka iwu n’okwu e hotara na Levitikọs 19:18; “Ị ga-ahụ” na-echekwa ụdị iwu ahụ.
- source_word: τὸν πλησίον σου
  choice: onye agbata obi gị
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka onye ọzọ mmadụ kwesịrị ịhụ n’anya n’echiche omume ọma nke amaokwu a.
- source_word: ὡς σεαυτόν
  choice: dịka onwe gị
  rationale: Ọ na-echekwa ntụnyere dị mkpụmkpụ nke Grik n’enweghị ịgbakwụnye okwu na-adịghị na ya.
- source_word: καλῶς ποιεῖτε
  choice: unu na-eme nke ọma
  rationale: Ọ na-egosi nkwado na omume ha ziri ezi, ma na-echekwa oge ugbu a.
theological_decisions:
- issue: Ihe “iwu eze” pụtara
  choice: E debere ya dịka iwu e ji njirimara nke eze kọwaa, n’enweghị ikpebi ma ọ bụ iwu sitere n’aka Eze, iwu kachasị elu, ma ọ bụ iwu metụtara alaeze.
  alternative: “iwu kachasị elu” ma ọ bụ “iwu nke alaeze”
  rationale: βασιλικός nwere ike imetụta isi iyi eze, ọkwa kachasị elu, ma ọ bụ njikọ ya na alaeze. Nsụgharị bụ́ “iwu eze” na-echekwa obosara na esemokwu nkọwa ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụdị iwu nke okwu e hotara, ma zere ịkọwa “iwu eze” n’ụzọ ga-emechi nghọta ndị okwu Grik nwere ike ibu.
