revisions:
- from: Ma ọ bụrụ n’ezie na unu na-emezu iwu eze[a] dị ka Akwụkwọ Nsọ si kwuo, “Ị ga-ahụ onye agbata obi gị n’anya dịka onwe gị,” unu na-eme nke ọma.
  to: Ma ọ bụrụ na unu na-emezu iwu eze[a] dịka Akwụkwọ Nsọ si kwuo, “Ị ga-ahụ onye agbata obi gị n’anya dịka onwe gị,” unu na-eme nke ọma.
  rationale: The revision replaces “Ma ọ bụrụ n’ezie” with “Ma ọ bụrụ na” to avoid importing emphatic ‘indeed/really’ into εἰ μέντοι, while “Ma” retains the contextual qualification. The footnote is refined to preserve the adjective’s lexical range without identifying an unstated specific king. No theological interpretation is imposed.
  reviewer_model: gpt-5.6-terra
