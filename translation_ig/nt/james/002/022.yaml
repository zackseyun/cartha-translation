    issue: Redundancy in “na-arụkọ ọrụ ọnụ.”
    rationale: The verb phrase “rụkọ ọrụ” already means “work together”; adding “ọnụ” is unnecessary in this context. Removing it improves idiomatic Standard Igbo without altering the Greek’s cooperative sense.
