review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys βλέπεις as a direct present-tense rhetorical address, πίστις as “okwukwe,” the cooperative relation expressed by συνήργει, and the passive completion expressed by ἐτελειώθη. The revision removes the redundant “ọrụ ọnụ” while retaining the imperfective sense through “na-arụkọ ọrụ.”
  naturalness: “Na-arụkọ ọrụ ọnụ” is understandable but somewhat redundant in Standard Igbo, since “rụkọ ọrụ” already expresses working together. “Na-arụkọ ọrụ” is smoother and remains clear. The revised sentence also makes the two clauses flow naturally.
  terminology: “Okwukwe” and “ọrụ” appropriately preserve the key terms without imposing a doctrinal explanation. “E mere ka ... zuo oke” suitably renders the passive τελειόω as completion/maturity rather than moral flawlessness.
  issues:
