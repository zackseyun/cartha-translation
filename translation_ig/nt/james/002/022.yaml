source:
  edition: SBLGNT
  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: ig
  text: Ị na-ahụ na okwukwe[a] na ọrụ ya na-arụkọ ọrụ, sitekwa n'ọrụ ndị ahụ ka e mere ka okwukwe ahụ zuo oke[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ikwesị ntụkwasị obi” ma ọ bụ “ntụkwasị obi” n'ọnọdụ “okwukwe” (πίστις).
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “e mere ka okwukwe ahụ bụrụ nke zuru oke” ma ọ bụ “e mere ka o ruo n'uju.” Ngwaa Grik ahụ pụrụ ịpụta ime ka ihe ruo n'ebumnobi ya ma ọ bụ too ruo n'uju.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: Ị na-ahụ
  rationale: Ọ bụ ngwaa dị n'oge ugbu a nke na-agwa otu onye okwu kpọmkwem. Nhọrọ a na-edobe ụzọ Jems si akpọ onye na-agụ ya okwu n'arụmụka ya.
- source_word: πίστις
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị sụgharị πίστις n'ọnọdụ a. Ọ na-edobe isi okwu Jems n'emebighị ya ka ọ bụrụ naanị ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi.
- source_word: συνήργει
  choice: na-arụkọ ọrụ ọnụ
  rationale: Nke a na-egosipụta omume na-aga n'ihu n'oge a na-ekwu maka ya, ma na-edobekwa echiche συνεργέω nke iso ihe ọzọ rụkọọ ọrụ.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: na ọrụ ya
  rationale: “Na” na-egosi njikọ nke okwukwe na ọrụ, ebe “ya” na-edobe nnọchiaha Grik nke na-ezo aka n'ọrụ Ebreham.
- source_word: ἐκ τῶν ἔργων
  choice: sitekwa n'ọrụ ndị ahụ
  rationale: “Site n’” na-egosipụta ọrụ ndị ahụ dịka ụzọ ma ọ bụ ihe sitere na ya mee ka okwukwe ruo n'uju, n'emebighị njikọ okwu Grik.
- source_word: ἐτελειώθη
  choice: e mere ka okwukwe ahụ zuo oke
  rationale: Nke a na-edobe olu nnara nke ngwaa Grik ma na-egosi iru n'uju ma ọ bụ n'ebumnobi ya, na-enweghị ikwu na okwukwe ahụ nwere ntụpọ omume na mbụ.
theological_decisions:
- issue: Mmekọrịta dị n'etiti okwukwe na ọrụ n'arụmụka Jems
  choice: E debere na okwukwe na ọrụ rụkọrọ ọrụ ọnụ, nakwa na site n'ọrụ ka e mere ka okwukwe zuo oke.
  alternative: A pụrụ ịkọwa na ọrụ na-egosi naanị okwukwe n'ihu mmadụ, na ọrụ na-eme ka okwukwe too ruo n'uju, ma ọ bụ na ọrụ bụ ngosipụta dị mkpa nke okwukwe.
  rationale: Grik na-ekwu maka ịrụkọ ọrụ ọnụ na izu oke, ma ọ naghị akọwapụta usoro ozizi niile gbasara ịbụ onye ezi omume. Ya mere, nsụgharị ahụ anaghị etinye nkọwa otu ụka ma ọ bụ otu echiche n'ime amaokwu ahụ.
- issue: Nkọwa πίστις n'ọnọdụ a na-arụrịta ụka banyere ya
  choice: okwukwe
  alternative: ikwesị ntụkwasị obi; ntụkwasị obi
  rationale: “Okwukwe” dabara nke ọma n'arụmụka Jems 2 ma na-ahapụkwa ohere maka ndò nghọta ndị ọzọ dị na πίστις, nke e depụtara n'okpuru amaokwu.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ugwu ma dịkwa mfe nghọta. Ahịrịokwu ahụ na-edobe okwu arụmụka Jems kpọmkwem, na-ezere ịgbakwunye nkọwa nke otu ụka, ma na-etinye akara nkọwa [a] na [b] n'ebe okwu ndị ha na-akọwa dị.
