id: JAS.2.21
reference: James 2:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: ig
  text: Ọ̀ bụghị site n’ọrụ ka a gụrụ Ebraham nna anyị dịka onye ezi omume, mgbe o nyere Aịzik nwa ya dịka àjà n’elu ebe ịchụàjà?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e gosiri na ọ bụ onye ezi omume,” ma ọ bụ “e mere ka o doo anya na ọ bụ onye ezi omume.” Ngwaa Grik ahụ nwere ike ịpụta ịkpọ mmadụ onye ezi omume ma ọ bụ igosi na ọ bụ onye ezi omume, dịka ọnọdụ okwu si dị.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: Ebraham nna anyị
  rationale: “Nna anyị” na-edobe ihe atụ nke mmekọrịta ezinụlọ na njirimara ọgbụgba ndụ dị n’asụsụ Grik; ọ karịrị ịsụgharị ya naanị dịka “nna nna anyị ochie.”
- source_word: ἐξ ἔργων
  choice: site n’ọrụ
  rationale: “Site n’ọrụ” na-egosi na ọrụ bụ ihe ndabere ma ọ bụ ụzọ e si kwuo ihe a, ma ghara ịgbakwunye “ọrụ ọma,” nke na-adịghị kpọmkwem n’ihe odide Grik.
- source_word: ἐδικαιώθη
  choice: a gụrụ ... dịka onye ezi omume
  rationale: Nkebiokwu a bụ ụzọ doro anya e si ekwu banyere ịgụ mmadụ dịka onye ezi omume n’Igbo, ma ihe odide ukwu anaghị ekpebi kpamkpam ma ọ bụ nkwupụta ọnọdụ ya ka ọ bụ ngosipụta na ọ bụ onye ezi omume; ihe odide ala na-edobe nghọta ndị ọzọ.
- source_word: ἀνενέγκας
  choice: mgbe o nyere ... dịka àjà
  rationale: Nke a na-egosipụta ma oge nke participle aorist ahụ ma echiche ịchụ àjà dị na ἀναφέρω n’ọnọdụ a, n’enweghị ikwu na e mezuru igbu Aịzik.
- source_word: θυσιαστήριον
  choice: ebe ịchụàjà
  rationale: Nke a bụ okwu Igbo doro anya na nke a na-ejikarị eme ihe maka ebe a na-achụ àjà.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: Ọ̀ bụghị ... ka a gụrụ ...?
  rationale: Ụdị ajụjụ a bụ nke Igbo dị ndụ ma na-edobe ajụjụ nkwupụta nke Grik, nke na-atụ anya azịza nkwenye.
theological_decisions:
- issue: Ihe ἐδικαιώθη pụtara n’ihe gbasara ọrụ na Jems 2:21
  choice: a gụrụ ... dịka onye ezi omume
  alternative: e gosiri na ọ bụ onye ezi omume; e kwupụtara na ọ bụ onye ezi omume; e mere ka o doo anya na ọ bụ onye ezi omume
  rationale: Nhọrọ dị n’ihe odide ukwu na-edobe njikọ okwu ahụ na isiokwu ịbụ onye ezi omume ma ghara idozi esemokwu nkà mmụta okpukpe ahụ n’ụzọ demonstrative ma ọ bụ forensic naanị. A na-enye nghọta ndị ọzọ n’ihe odide ala.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma dị mfe nghọta. “Ebe ịchụàjà” na “dịka àjà” na-edobe asụsụ ịchụ àjà; “nna anyị” na-edobe mmekọrịta ezinụlọ na nke ọgbụgba ndụ. Akara ụda dị na “Ọ̀” na-enyere onye na-agụ ya aka ịmata na ọ bụ ajụjụ nkwupụta.
