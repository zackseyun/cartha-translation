  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: ig
  text: N’ihi na a ga-ekpe onye na-emeghị ebere ikpe n’enweghị ebere; ebere na-emeri ikpe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ebere na-etu ọnụ megide ikpe.” Ngwaa Grik a nwere ike ịpụta ịnya isi ma ọ bụ ịṅụrị ọṅụ n’elu ma ọ bụ megide ihe ọzọ; n’ebe a, a sụgharịrị ya n’ụzọ Igbo si aga nke ọma dịka “na-emeri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: ikpe
  rationale: “Ikpe” bụ okwu Igbo doro anya maka ikpe ma ọ bụ nyocha nke onyeikpe; ọ na-echekwa otu okwu ahụ n’ebe abụọ dị n’amaokwu a, na-akọwaghị ya karịa ka Grik si kwuo.
- source_word: ἀνέλεος
  choice: agaghị enwe ebere
  rationale: Nkebiokwu a na-egosi na ikpe ahụ bụ nke na-enweghị ebere, ma na-echekwa njikọ okwu ya na ἔλεος (“ebere”). Oge ọdịnihu kwekọrọ n’ịdọ aka ná ntị banyere ikpe na gburugburu amaokwu a.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: n’ebe onye na-emeghị ebere nọ
  rationale: “Ime ebere” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo okwu Grik ahụ pụtara ime ma ọ bụ igosi ebere.
- source_word: κατακαυχᾶται
  choice: na-emeri
  rationale: N’ebe a, “na-emeri” na-enye echiche nke ebere ịnya isi n’elu ma ọ bụ imeri ikpe n’Igbo dị mfe nghọta, ebe nkọwa ala peeji na-echekwa ihe oyiyi okwu nke ịnya isi.
- source_word: ἔλεος
  choice: ebere
  rationale: “Ebere” bụ okwu Igbo a na-ejikarị eme ihe nke na-egosipụta obi ebere na omume ebere, ma na-echekwa nkwughachi okwu ahụ n’amaokwu a.
theological_decisions:
- issue: Ihe nkebi ikpeazụ, κατακαυχᾶται ἔλεος κρίσεως, na-ekwu kpọmkwem
  choice: 'A hapụrụ ya dịka ụkpụrụ sara mbara: “ebere na-emeri ikpe.”'
  alternative: “Ebere na-etu ọnụ megide ikpe.”
  rationale: Okwu Grik ahụ dị nkenke, ọ kọwaghịkwa ma ọ bụ ebere Chineke, ebere na-arụ ọrụ n’oge ikpe, ka ọ bụ ebere ndị kwere ekwe mere ka a na-elekwasị anya. Nsụgharị ahụ ahapụghị esemokwu nkà mmụta okpukpe a ma ọ bụ mee ka ọ bụrụ ozizi banyere inweta nzọpụta site n’ọrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. A họọrọ “ime ebere” na “ikpe” dịka okwu ndị nkịtị ga-aghọta, ma e zere ịgbakwunye nkọwa otu ụka ọ bụla.
