id: JAS.2.18
reference: James 2:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: ig
  text: Ma mmadụ ga-asị, “Gị nwere okwukwe, mụ onwe m nwekwara ọrụ.” Gosi m okwukwe gị[c] n’enweghị ọrụ[a], mụ onwe m ga-esi n’ọrụ m[b] gosi gị okwukwe m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-enweghị ọrụ” ma ọ bụ “nke kewapụrụ n’ọrụ.” Okwu Grik ahụ nwere ike ịpụta “n’enweghị” ma ọ bụ “nke dị iche na.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n’ọrụ m.” Preposition Grik a nwere ike igosi isi iyi ma ọ bụ ụzọ e si eme ihe; “site n’ọrụ m” na-egosi na ọrụ na-eme ka okwukwe pụta ìhè.
    reason: lexical_alternative
  - marker: c
    text: 'Grik: pistis; ọ pụkwara ịpụta “ntụkwasị obi,” ma n’ọnọdụ ụfọdụ, “ikwesị ntụkwasị obi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλλ’
  choice: Ma
  rationale: Ọ na-egosi ntụgharị gaa n’okwu onye nwere ike ịjụ ajụjụ n’arụmụka Jemis; ‘Ma’ bụ ụzọ Igbo dị nkenke ma kwekọọ na ya.
- source_word: ἐρεῖ τις
  choice: mmadụ ga-asị
  rationale: Ọ na-edobe ọdịdị future indicative nke Grik na ụda okwu nke onye a na-eche na ọ ga-aza.
- source_word: πίστιν
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ okwu Igbo a na-ejikarị asụgharị πίστις ma na-ahapụ esemokwu dị n’etiti nkwupụta okwukwe na ọrụ n’enweghị idozi ya n’ụzọ otu ozizi.
- source_word: ἔργα
  choice: ọrụ
  rationale: ‘Ọrụ’ na-edobe okwu bụ isi Jemis ji arụ ụka ma na-ejikọta amaokwu a na akụkụ ndị gbara ya gburugburu.
- source_word: δεῖξόν μοι
  choice: Gosi m
  rationale: Ọ bụ iwu doro anya nke na-achọ ka e mee ka ihe ahụ pụta ìhè; ọ bụkwa Igbo nkịtị ma kwụ ọtọ.
- source_word: χωρὶς τῶν ἔργων
  choice: n’enweghị ọrụ
  rationale: Nke a na-egosipụta echiche nke χωρὶς, ya bụ ihe dị iche ma ọ bụ nke na-enweghị ọrụ, n’ụzọ Igbo na-ada nke ọma.
- source_word: κἀγώ σοι δείξω
  choice: mụ onwe m ga-egosi gị
  rationale: ‘Mụ onwe m’ na-edobe nkwusi ike dị na κἀγώ, ebe ‘ga-egosi gị’ na-edobe future nke Grik.
- source_word: ἐκ τῶν ἔργων μου
  choice: site n’ọrụ m
  rationale: ‘Site n’ọrụ m’ nwere ike igosi ma isi iyi ma ụzọ e si eme ka okwukwe pụta ìhè, dị ka ἐκ nwere ike isi rụọ ọrụ n’ebe a.
theological_decisions:
- issue: Nsụgharị πίστις n’arụmụka gbasara okwukwe na ọrụ
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: ‘Okwukwe’ na-echekwa okwu na esemokwu nke Jemis n’enweghị ịkọwa πίστις ozugbo dị ka omume ikwesị ntụkwasị obi.
- issue: Mmekọrịta dị n’etiti okwukwe na ọrụ n’ahịrịokwu ikpeazụ
  choice: site n’ọrụ m gosi gị okwukwe m
  alternative: gosi gị okwukwe m nke sitere n’ọrụ m
  rationale: Nhọrọ a na-egosi na ọrụ na-eme ka okwukwe hụ anya, ma ọ naghị ekwu na ọrụ bụ isi iyi nke okwukwe; n’otu oge ahụ, ntụaka ala peeji na-echekwa nghọta ‘site na/from’ nke ἐκ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro arụmụka na nkwusi ike nke Grik, ma zere okwu ga-eme ka otu nkọwa ụka bụrụ naanị nkọwa kwere omume.
