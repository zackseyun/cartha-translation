review_pass:
  verdict: revise
  source_fidelity: The rhetorical question, emphatic ‘ha onwe ha,’ the reviling sense of βλασφημοῦσιν, and the deliberately unspecified ‘aha ọma ahụ’ are represented faithfully. The passive construction is also retained. However, ‘a kpọkwasịrị unu’ is less idiomatic and less transparent than the Greek’s ‘called upon/over you’ construction.
  naturalness: ‘Ọ̀ bụghị ha onwe ha na-ekwulu aha ọma ahụ…?’ is clear, modern Standard Igbo. Replacing ‘a kpọkwasịrị unu’ with ‘a kpọrọ n’elu unu’ gives a clearer, more direct rendering of the marked source idiom while retaining its ambiguity.
  terminology: ‘na-ekwulu’ suitably conveys serious reviling of the honorable name without specifying its referent. ‘Aha ọma ahụ’ is appropriately broad; the footnote’s ‘aha dị ùgwù’ is a sound lexical alternative. The baptism/covenant wording remains appropriately tentative.
  issues:
  - severity: low
    issue: The expression ‘a kpọkwasịrị unu’ is not the clearest Standard Igbo equivalent for a name ‘called upon/over’ persons.
    rationale: It can suggest that a name was simply assigned or attached to them, whereas the Greek idiom specifically evokes a name pronounced upon them. ‘a kpọrọ n’elu unu’ preserves the spatial/ritual idiom and the source ambiguity more transparently.
  revised_text: Ọ̀ bụghị ha onwe ha na-ekwulu aha ọma ahụ[a] a kpọrọ n’elu unu?[b]
