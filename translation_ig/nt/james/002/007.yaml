base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: ig
  text: Ọ̀ bụghị ha onwe ha na-ekwulu aha ọma ahụ[a] a kpọrọ n’elu unu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “aha dị ùgwù ahụ” ma ọ bụ “aha ọma na nsọpụrụ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “a kpọrọ n’elu unu”; ọ ga-abụ na nke a bụ aha e ji amata ndị kwere ekwe, ma o nwekwara ike ime ka asụsụ ọgbụgba ndụ ma ọ bụ baptizim bata n’uche.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: Ọ̀ bụghị ha onwe ha
  rationale: Ajụjụ a na-atụ anya azịza nkwenye, ebe “ha onwe ha” na-edobe nkwusi ike dị na αὐτοὶ banyere ndị ahụ a ka kpọtụrụ aha.
- source_word: βλασφημοῦσιν
  choice: na-ekwulu
  rationale: “Ikwulu” na-egosi okwu mkparị na-eweda aha dị nsọ ma ọ bụ dị ùgwù ala; ọ dabara n’ebe a karịa okwu nkịtị maka ikwutọ mmadụ.
- source_word: τὸ καλὸν ὄνομα
  choice: aha ọma ahụ
  rationale: Nke a na-edobe καλόν n’ụzọ sara mbara dị ka ihe ọma, kwesịrị nsọpụrụ, ma ọ bụ dị ùgwù, n’ebughị ụzọ kpebie kpọmkwem onye aha ahụ bụ.
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: a kpọkwasịrị unu
  rationale: Nkebiokwu Igbo a na-egosi na a kpọrọ aha ahụ n’elu ha ma ọ bụ tinye ya n’ahụ ha dị ka ihe e ji amata ha, na-edobekwa olu nnara nke Greek.
theological_decisions:
- issue: Onye “aha ọma ahụ” na-ezo aka na ya
  choice: E debere okwu ahụ n’ụzọ sara mbara dịka aha dị ùgwù e jikọtara ndị kwere ekwe na ya, nke yikarịrị ka ọ bụ aha Jizọs/Onyenwe anyị.
  alternative: Ịsụgharị ya kpọmkwem dịka “aha Kraịst” ma ọ bụ “aha Chineke.”
  rationale: Greek akpọghị Jizọs aha kpọmkwem n’amaokwu a, ọ bụ ezie na Jems 2:1 na-eme ka nghọta banyere Jizọs sie ike. Ya mere, nsụgharị ahụ anaghị edozi ihe ederede hapụrụ ka ọ nwee ntakịrị nghọta dị iche iche.
- issue: Ihe “a kpọkwasịrị unu” nwere ike ịpụta
  choice: Aha e tinyere n’ahụ ndị kwere ekwe ma ọ bụ e ji mata ha.
  alternative: Aha a kpọrọ kpọmkwem n’elu ha n’emume baptizim ma ọ bụ n’usoro ọgbụgba ndụ.
  rationale: Nkebiokwu ahụ nwere ike ime ka baptizim ma ọ bụ asụsụ ọgbụgba ndụ bata n’uche, ma ederede akọwaghị emume kpọmkwem; ya mere e debere ohere nghọta ahụ n’ala ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma doo ndị nkịtị anya. Ejiri “na-ekwulu” debe ịdị arọ nke βλασφημοῦσιν, ebe “a kpọkwasịrị unu” na-enye nkebiokwu ahụ usoro Igbo dị mma n’emebighị ambiguity ya.
