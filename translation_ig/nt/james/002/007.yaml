- from: Ọ̀ bụghị ha onwe ha na-ekwulu aha ọma ahụ[a] a kpọkwasịrị unu?[b]
  to: Ọ̀ bụghị ha onwe ha na-ekwulu aha ọma ahụ[a] a kpọrọ n’elu unu?[b]
  rationale: The revision changes only the final passive phrase, making the Greek ἐπικαλέω + ἐπί idiom more explicit in natural Standard Igbo. It neither identifies the ‘good name’ with a particular referent nor turns the possible baptismal/covenantal resonance into an assertion.
