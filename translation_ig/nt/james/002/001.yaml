id: JAS.2.1
reference: James 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: ig
  text: Ụmụnna m[a], unu ejikọtala okwukwe nke Onyenwe anyị Jizọs bụ Mezaya, Onyenwe ebube, na ile mmadụ anya n’ihu[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ụmụnne m ndị nwoke na ndị nwanyị.” Okwu Grik ahụ bụ nke nwoke n’ụdị ya (“ụmụnna m”), ma n’ebe a ọ na-agwa ọgbakọ ndị kwere ekwe niile okwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “okwukwe n’Onyenwe anyị Jizọs bụ Mezaya.” Njikọ okwu Grik ahụ nwere ike ịghọta n’ụzọ karịrị otu.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ “Onyenwe anyị Jizọs bụ Mezaya dị ebube.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: Ụmụnna m
  rationale: “Ụmụnna” bụ okwu Igbo a na-eji akpọ ndị nwoke dị ka ụmụnne ma nwee ike, n’ọnọdụ dị otú a, ịgụnye ọgbakọ ndị kwere ekwe n’ozuzu ya; nkọwa ala peeji na-eme ka obosara ahụ doo anya.
- source_word: μὴ ... ἔχετε
  choice: unu ejikwala ... na-ejide
  rationale: “Ejikwala” na-enye iwu mgbochi nke dị ugbu a, ebe “na-ejide okwukwe” na-edobe echiche nke ịnọgide na-enwe ma ọ bụ na-agbaso okwukwe.
- source_word: ἐν προσωπολημψίαις
  choice: ile mmadụ anya n’ihu
  rationale: Nke a bụ akpaalaokwu Igbo doro anya maka ime mmadụ amara pụrụ iche ma ọ bụ ikpe mmadụ n’ele mmadụ anya, nke kwekọrọ n’echiche προσωπολημψία.
- source_word: τὴν πίστιν
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo nkịtị na nke kwesịrị ekwesị maka πίστις n’ebe a.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: nke Onyenwe anyị Jizọs bụ Mezaya
  rationale: “Nke” na-edobe njikọ genitive nke Grik n’ahịrị bụ isi kama ịkọwa ya ozugbo naanị dịka okwukwe ‘n’ime’ Jizọs. “Mezaya” na-egosi na Χριστός ka na-arụ ọrụ dịka utu aha.
- source_word: τῆς δόξης
  choice: Onyenwe ebube
  rationale: Nke a na-edobe akpaalaokwu Akwụkwọ Nsọ nke genitive ahụ n’ụzọ dị mkpirikpi ma dị elu, n’agbanyeghị na e nwekwara ike ịghọta ya dịka “Onyenwe anyị dị ebube.”
theological_decisions:
- issue: Njikọ genitive dị na τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: okwukwe nke Onyenwe anyị Jizọs bụ Mezaya
  alternative: okwukwe n’Onyenwe anyị Jizọs bụ Mezaya
  rationale: Nhazi Grik ahụ nwere ike igosi okwukwe e ji kọwaa Onyenwe anyị ma ọ bụ okwukwe a tụkwasịrị n’ime ya. Ahịrị bụ isi na-edobe “nke,” ebe nkọwa [b] na-enye nghọta nke okwukwe n’ime ya.
- issue: Nkọwa τῆς δόξης
  choice: Onyenwe ebube
  alternative: Onyenwe anyị Jizọs bụ Mezaya dị ebube
  rationale: “Onyenwe ebube” na-edobe ike nke okwu ahụ na njikọ ya na Onyenwe anyị; nkọwa ala peeji na-echekwa ụzọ ọzọ e nwere ike isi jikọta ya dịka njirimara “dị ebube.”
- issue: Utu aha Χριστός
  choice: Mezaya
  alternative: Kraịst
  rationale: N’usoro utu aha a, Χριστός nwere ọdịnaya nke onye e tere mmanụ, ya mere “Mezaya” ka ahọrọ karịa ime ya naanị aha nkịtị.
- issue: Ndị Ἀδελφοί na-akpọ
  choice: Ụmụnna m
  alternative: Ụmụnna m ndị nwoke na ndị nwanyị
  rationale: Isi ahịrị na-edobe ọdịdị nwoke nke okwu Grik, ma gburugburu akwụkwọ ozi ahụ na-egosi na ọ na-agwa ọgbakọ ndị kwere ekwe niile okwu; a kọwara nke ahụ na [a].
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Akpaalaokwu “ile mmadụ anya n’ihu” na-eme ka mmehie ịkpa ókè pụta ìhè n’enweghị okwu ochie; “Onyenwe ebube” na-edobe ụda dị elu nke isi mmalite.
