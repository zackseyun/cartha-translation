  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: ig
  text: Ọ bụrụ na nwanna nwoke ma ọ bụ nwanna nwanyị enweghị uwe zuru ezu[a] ma enweghị ihe oriri kwa ụbọchị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gba ọtọ”; okwu Grik ahụ nwere ike ịpụta enweghị uwe kpamkpam, ma n'ebe a, o yikarịrị ka ọ na-ekwu maka enweghị uwe zuru ezu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: Ọ bụrụ na
  rationale: Ọ na-ewebata ọnọdụ a na-atụ anya ya; nke a bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a.
- source_word: ἀδελφὸς ἢ ἀδελφὴ
  choice: nwanna nwoke ma ọ bụ nwanna nwanyị
  rationale: Ọ na-edobe kpọmkwem ọdịiche nwoke na nwanyị dị n'asụsụ Grik, nakwa okwu ezinụlọ Jemis ji maka ndị nọ n'ọgbakọ ndị kwere ekwe.
- source_word: γυμνοὶ
  choice: enweghị uwe ga-ezuru ya
  rationale: N'ọnọdụ a, okwu ahụ nwere ike ịpụta na uwe adịghị ezu, ọ bụghị naanị ịgba ọtọ kpamkpam. Nsụgharị a na-egosi mkpa ahụ n'Igbo nkịtị.
- source_word: ὑπάρχωσιν
  choice: enweghị
  rationale: Ngwaa ahụ na-arụ ọrụ dị ka njikọ n'etiti onye ahụ na ọnọdụ ya; e tinyere ya n'usoro okwu Igbo eke.
- source_word: λειπόμενοι
  choice: ana-akọkwa ya
  rationale: Ọ na-egosi ụkọ na-aga n'ihu. Akpaala okwu Igbo a na-egosi na onye ahụ enweghị ihe dị ya mkpa.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: ihe oriri kwa ụbọchị
  rationale: Ọ na-egosi nri ma ọ bụ ihe na-azụ ahụ nke a chọrọ maka ndụ ụbọchị ruo ụbọchị.
theological_decisions:
- issue: Ókè okwu ἀδελφὸς ἢ ἀδελφὴ n'ime obodo Ndị Kraịst
  choice: E debere ya dịka “nwanna nwoke ma ọ bụ nwanna nwanyị,” nke yikarịrị ka ọ na-ekwu maka onye otu ndị kwere ekwe.
  alternative: Ịsụgharị ya dịka onye ọ bụla nọ ná mkpa.
  rationale: Ọnọdụ okwu Jemis na-eji asụsụ ezinụlọ maka ndị kwere ekwe; nsụgharị ahụ na-edobe okwu ahụ n'enweghị ịgbasa ma ọ bụ imechi ihe ọ pụtara karịa ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere amaokwu ahụ dịka nkebi ọnọdụ na-aga n'ihu ruo n'amaokwu na-esote, ya mere e ji rikoma mechie ya.
