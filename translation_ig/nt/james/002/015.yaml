  verdict: revise
  source_fidelity: The draft correctly renders the conditional opening and the explicit pair “brother or sister,” and it appropriately takes γυμνοί as inadequate clothing rather than necessarily literal nakedness. However, “ana-akọkwa ya” does not convey λειπόμενοι (“lacking/being without”) and changes the meaning of the clause about daily food.
  naturalness: “Ana-akọkwa ya” is not natural Standard Igbo in this context. The revision uses direct, idiomatic expressions for insufficient clothing and lack of daily food, while retaining the comma because the conditional sentence continues in the following verse.
  terminology: “Nwanna nwoke ma ọ bụ nwanna nwanyị” preserves the source’s explicit familial pair. “Uwe zuru ezu” suitably expresses inadequate clothing in context, and “ihe oriri kwa ụbọchị” accurately represents daily food.
  issues:
  - severity: high
    issue: The phrase “ana-akọkwa ya” mistranslates λειπόμενοι τῆς ἐφημέρου τροφῆς.
    rationale: It does not mean that the person lacks food and is not an idiomatic rendering of deprivation in this context. The Greek states that the brother or sister is without daily food.
  - severity: low
    issue: The clothing phrase can be made more concise and natural.
    rationale: “Enweghị uwe zuru ezu” directly expresses being inadequately clothed and avoids the somewhat cumbersome “uwe ga-ezuru ya.”
