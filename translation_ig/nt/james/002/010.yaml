  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: ig
  text: N’ihi na onye ọ bụla na-edebe iwu ahụ dum, ma sụọ ngọngọ n’otu akụkụ ya[a], a mara ya ikpe n’ihe niile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “daa n’otu ihe” ma ọ bụ “mebie otu akụkụ ya.” Grik kwuru n’ụzọ nkịtị, “sụọ ngọngọ n’otu,” jiri ihe atụ nke ịsụ ngọngọ kọwaa ọdịda n’omume.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ ghọọla onye ga-aza ajụjụ n’ihi iwu ahụ dum.” Nkebiokwu a pụtara na imebi otu akụkụ na-eme ka mmadụ bụrụ onye a ga-aza ajụjụ n’ebe iwu ahụ dum dị.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: onye ọ bụla nke
  rationale: Nkebi a na-egosi onye ọ bụla n’enweghị ịkpọ otu onye aha, ma na-echekwa ike nke ụkpụrụ a metụtara mmadụ niile.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka nkọwa ma ọ bụ ihe ndabere ya.
- source_word: ὅλον τὸν νόμον
  choice: iwu ahụ dum
  rationale: Ọ na-egosi iwu ahụ n’ozuzu ya, ọ bụghị naanị otu iwu dị n’ime ya.
- source_word: τηρήσῃ
  choice: na-edebe
  rationale: N’ebe iwu dị, “idebe” pụtara ịgbaso ma rube isi n’ihe iwu chọrọ.
- source_word: πταίσῃ
  choice: sụọ ngọngọ
  rationale: Ọ na-echekwa ihe atụ dị na Grik nke ịsụ ngọngọ, nke e ji akọwa ọdịda n’omume ma ọ bụ imebi iwu.
- source_word: ἐν ἑνί
  choice: n’otu akụkụ ya
  rationale: Ọ na-eme ka o doo anya na okwu a gbasara otu ihe ma ọ bụ otu akụkụ n’ime iwu ahụ, n’agbanyeghị na Grik kwuru nkenke “n’otu.”
- source_word: γέγονεν
  choice: aghọọla
  rationale: 'Ọ na-echekwa ọdịdị perfect nke ngwaa ahụ: ihe ahụ mere emeela ka onye ahụ nọrọ ugbu a n’ọnọdụ ikpe mara.'
- source_word: πάντων
  choice: n’iwu ahụ dum
  rationale: E kwughachiri ihe ọ na-ezo aka na ya n’Igbo ka o doo anya na “ihe niile” bụ iwu ahụ dum.
- source_word: ἔνοχος
  choice: onye ikpe mara
  rationale: Nhọrọ a na-ebute echiche ikpe na ibu ọrụ dị na okwu Grik ahụ, n’asụsụ Igbo doro anya ma dị ugwu.
theological_decisions:
- issue: Oke ikpe ọmụma onye mebiri otu akụkụ iwu nwere n’ebe iwu dum dị
  choice: Ịsụ ngọngọ n’otu akụkụ na-eme ka mmadụ bụrụ onye ikpe mara n’iwu ahụ dum.
  alternative: Ịsụ ngọngọ n’otu akụkụ pụtara na onye ahụ emeela iwu ọ bụla n’otu n’otu, ma mmehie niile hà n’ịdị njọ.
  rationale: πάντων ἔνοχος na-egosi ibu ikpe ma ọ bụ ịza ajụjụ n’ebe ihe niile—ya bụ, iwu ahụ dum—dị. Ọ naghị akọwa na onye ahụ emeela mmebi ọ bụla n’otu n’otu, ma ọ bụ na mmebi niile hà n’ogo ha. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ dịka ederede si hapụ ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Sụọ ngọngọ” na-echekwa ihe atụ Grik; nkọwa ala peeji na-enye ụzọ ndị na-akọwa ọdịda n’omume nke ọma. “Onye ikpe mara n’iwu ahụ dum” na-edobe ụda ikpe nke amaokwu ahụ n’enweghị itinye ozizi otu ụka.
