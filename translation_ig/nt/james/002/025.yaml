review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Rahab, her designation as a prostitute, the human ‘messengers,’ and the two actions of receiving and sending them out by another way. However, “e mere Rehab ... onye ezi omume” normally conveys making her righteous, a causative sense not supplied by the passive ἐδικαιώθη and one that unnecessarily settles the debated nuance.
  naturalness: The sentence is broadly understandable, but “e mere ... onye ezi omume” is less idiomatic for this judicial/evaluative expression. “A gụrụ ... dịka onye ezi omume” is a well-established, natural Standard Igbo rendering that preserves the passive question form. “Ma zipụ ha n’ụzọ ọzọ” is more direct than “zipụ ha ka ha si n’ụzọ ọzọ pụọ.”
  terminology: Use “a gụrụ ... dịka onye ezi omume” for δικαιόω, rather than a causative formulation. “Nwanyị akwụna,” “ndị ozi,” and “n’ọrụ” are appropriate. The note must not define the Greek as ‘making someone righteous,’ since that is not a neutral description of δικαιόω here.
  issues:
  - severity: high
    issue: “e mere Rehab ... onye ezi omume” renders δικαιόω causatively.
    rationale: The Greek passive means ‘was justified’ and does not say that Rahab was made righteous. The present wording introduces a theological/semantic claim absent from the source.
  - severity: medium
    issue: Footnote a describes the Greek as a term commonly rendered ‘ime ka mmadụ bụrụ onye ezi omume.’
    rationale: This repeats and reinforces the same causative interpretation. The note should identify δικαιόω and present alternatives without assigning it a causative definition.
  - severity: low
    issue: “zipụ ha ka ha si n’ụzọ ọzọ pụọ” is unnecessarily indirect.
    rationale: “Zipụ ha n’ụzọ ọzọ” naturally expresses sending them out by a different route while retaining the source meaning.
  revised_text: N’otu aka ahụkwa, ọ̀ bụghị n’ọrụ ka a gụrụ Rehab, nwanyị akwụna, dịka onye ezi omume[a], mgbe ọ nabatara ndị ozi[b] ahụ ma zipụ ha n’ụzọ ọzọ?
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “e gosiri na Rehab bụ onye ezi omume,” ma ọ bụ, “e kwupụtara na Rehab bụ onye ezi omume.” Okwu Grik ahụ bụ δικαιόω, nke a sụgharịrị n’ebe a dịka “a gụrụ ... dịka onye ezi omume”; nsụgharị a anaghị edozi esemokwu banyere kpọmkwem ihe ọ pụtara n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: 'Grik: “ndị ozi.” N’ebe a, ọ na-ekwu maka ndị ikom Rehab nabatara (Jọshụa 2), ọ bụghị ndị mmụọ ozi.'
    reason: cross_reference
  revision_rationale: The revision replaces a causative rendering of δικαιόω with an idiomatic Standard Igbo passive/evaluative expression, retaining the Greek question and leaving its theological nuance open. It also corrects the lexical note and streamlines the final participial action without changing its sense.
