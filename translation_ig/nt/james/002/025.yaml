revisions:
- from: N’otu aka ahụkwa, ọ̀ bụghị site n’ọrụ ka e mere Rehab, nwanyị akwụna, onye ezi omume[a], mgbe ọ nabatara ndị ozi[b] ahụ ma zipụ ha ka ha si n’ụzọ ọzọ pụọ?
  to: N’otu aka ahụkwa, ọ̀ bụghị n’ọrụ ka a gụrụ Rehab, nwanyị akwụna, dịka onye ezi omume[a], mgbe ọ nabatara ndị ozi[b] ahụ ma zipụ ha n’ụzọ ọzọ?
  rationale: The revision replaces a causative rendering of δικαιόω with an idiomatic Standard Igbo passive/evaluative expression, retaining the Greek question and leaving its theological nuance open. It also corrects the lexical note and streamlines the final participial action without changing its sense.
