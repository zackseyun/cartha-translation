source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: ig
  text: N’otu aka ahụkwa, ọ̀ bụghị n’ọrụ ka a gụrụ Rehab, nwanyị akwụna, dịka onye ezi omume[a], mgbe ọ nabatara ndị ozi[b] ahụ ma zipụ ha n’ụzọ ọzọ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “e gosiri na Rehab bụ onye ezi omume,” ma ọ bụ, “e kwupụtara na Rehab bụ onye ezi omume.” Okwu Grik ahụ bụ δικαιόω, nke a sụgharịrị n’ebe a dịka “a gụrụ ... dịka onye ezi omume”; nsụgharị a anaghị edozi esemokwu banyere kpọmkwem ihe ọ pụtara n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: 'Grik: “ndị ozi.” N’ebe a, ọ na-ekwu maka ndị ikom Rehab nabatara (Jọshụa 2), ọ bụghị ndị mmụọ ozi.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: N’otu aka ahụkwa
  rationale: Ọ na-ejikọta Rehab na ihe atụ Ebreham nke bu ya ụzọ ma na-egosi na Rehab bụ ihe atụ ọzọ.
- source_word: Ῥαὰβ
  choice: Rehab
  rationale: E ji nsụpe aha a a na-ejikarị eme ihe n’Igbo.
- source_word: ἡ πόρνη
  choice: nwanyị akwụna
  rationale: Nke a bụ okwu Igbo doro anya, nke oge a, maka nwanyị na-ere mmekọahụ; ọ na-echekwa ịdị arọ nke okwu Grik ahụ.
- source_word: οὐκ ... ἐδικαιώθη
  choice: ọ̀ bụghị ... ka e mere ... onye ezi omume
  rationale: Ụdị a na-echekwa olu nnara na ajụjụ a na-atụ anya nkwenye. Ihe δικαιόω pụtara kpọmkwem n’ebe a ka a hapụrụ ka ọ ghara idozi esemokwu nkà mmụta okpukpe n’ime isi ederede.
- source_word: ἐξ ἔργων
  choice: site n’ọrụ
  rationale: Ọ na-egosi ntọala ma ọ bụ ụzọ ọrụ si metụta okwu Jemis, ma na-adaba n’asụsụ Igbo nkịtị.
- source_word: ὑποδεξαμένη
  choice: mgbe ọ nabatara
  rationale: Ọ na-egosi nnabata ọma nke ndị ahụ, ma na-enye participle Grik ahụ n’ụzọ Igbo dị ire.
- source_word: τοὺς ἀγγέλους
  choice: ndị ozi
  rationale: ἄγγελος nwere ike ịbụ mmụọ ozi ma ọ bụ onye ozi; n’akụkọ Rehab, ndị a bụ mmadụ Jọshụa zitere, ya mere ‘ndị ozi’ na-echekwa okwu ahụ n’enweghị ịkpọ ha mmụọ ozi.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: ma zipụ ha ka ha si n’ụzọ ọzọ pụọ
  rationale: N’ebe a ἐκβάλλω pụtara izipụ, ọ bụghị ịchụpụ n’ike; okwu a na-echekwakwa echiche nke ụzọ dị iche.
theological_decisions:
- issue: Ihe δικαιόω pụtara na Jemis 2:25 n’ihe gbasara okwukwe na ọrụ
  choice: E mere ... onye ezi omume
  alternative: E gosiri na ... bụ onye ezi omume; e kwupụtara na ... bụ onye ezi omume
  rationale: Nsụgharị ahụ anaghị ekpebi ma okwu ahụ bụ nkwupụta ikpe ozugbo ma ọ bụ igosi ezi omume e nwere. Ihe ndị ọzọ o nwere ike ịpụta dị na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ajụjụ nkwenye nke Grik ka echekwara site na “ọ̀ bụghị,” ma a zere okwu ụka pụrụ iche nke ga-amanye otu nkọwa nkà mmụta okpukpe.
