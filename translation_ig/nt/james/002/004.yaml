  verdict: revise
  source_fidelity: 'A chọrọ ndozi n''ihi na nkebiagha -ghị dị n''ederede bụ isi (''unu ekewaghị'') na-eme ka ajụjụ ahụ pụta dịka a ga-asị na ha emeghị nkewa ahụ. Ajụjụ Grik οὐ ... διεκρίθητε bụ ajụjụ nkwenye na-ata ụta: ha kpara ókè n''ezie. “Kpara ókè n’etiti onwe unu” na-egosi nke a nke ọma ma dabara n’ọnọdụ amaokwu 2:1–3.'
  naturalness: “Ọ̀ bụghị na ...?” bụ ụzọ Igbo Izugbe doro anya maka ajụjụ nkwenye a. “Kpara ókè” dịkwuo eke ma kpọmkwem maka ịgwọ ndị mmadụ n’ụzọ dị iche karịa “ekewaghị ndị nọ n’etiti unu iche.” “Ndị ikpe nwere echiche ọjọọ” na-adị mfe nghọta ma na-echekwa njikọ nke κριταὶ na διαλογισμῶν πονηρῶν.
  terminology: “Kpara ókè” na-anọchi διεκρίθητε n’ọnọdụ ile mmadụ anya n’ihu, n’enweghị itinye nkọwa okwukwe. “Ndị ikpe” na-anọchi κριταὶ. “Echiche ọjọọ” na-echekwa διαλογισμοί; ndetu ala na-enye ntụgharị okwu dị nso, “echiche ma ọ bụ ntụgharị uche ọjọọ.”
