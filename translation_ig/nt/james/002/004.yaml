translation:
  language: ig
  text: Ọ̀ bụghị na unu kpara ókè n’etiti onwe unu, wee ghọọ ndị ikpe nwere echiche ọjọọ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ̀ bụghị na unu mere ka e nwee nkewa n’etiti onwe unu?” Ngwaa ahụ nwekwara ike ịpụta “kewaa” ma ọ bụ, n’ebe ndị ọzọ, “inwe obi abụọ”; ma n’ebe a, ihe gbara ya gburugburu na-akwado echiche nke ịkpa ókè n’etiti ndị mmadụ.
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “ndị ikpe nke echiche ma ọ bụ ntụgharị uche ọjọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: unu ekewaghị ndị nọ n’etiti unu iche
  rationale: N’ọnọdụ a, ngwaa ahụ na-ezo aka n’ịkpa ókè n’etiti ndị ọgaranya na ndị ogbenye dịka amaokwu 1–3 gosiri. Nsụgharị a na-eme ka omume ịkpa ókè ahụ doo anya n’Igbo, kama ịsụgharị ya dịka inwe obi abụọ.
- source_word: ἐν ἑαυτοῖς
  choice: ndị nọ n’etiti unu
  rationale: Nzukọ ndị kwere ekwe bụ ọnọdụ okwu a; ya mere, nke a na-egosi ịkpa ókè n’etiti ndị nọ n’obodo ahụ, ọ bụghị nanị nkewa dị n’ime obi mmadụ.
- source_word: ἐγένεσθε
  choice: wee ghọọ
  rationale: 'Nke a na-egosi ihe omume mbụ ahụ rụpụtara: site n’ikewa ndị mmadụ iche, ha ghọrọ ụdị ndị ikpe a kọwara.'
- source_word: κριταὶ
  choice: ndị ikpe
  rationale: Nke a bụ okwu Igbo doro anya nke na-echekwa ike ikpe mmadụ ikpe dị n’okwu Grik.
- source_word: διαλογισμῶν πονηρῶν
  choice: nwere echiche ọjọọ
  rationale: Nke a bụ Igbo e ji eme ihe nke ọma ma na-echekwa echiche nke ntụgharị uche ma ọ bụ atụmatụ ọjọọ, na-ekpebighị ya naanị dịka ebumnobi.
- source_word: οὐ
  choice: Ọ̀ bụ na ... -ghị
  rationale: Ụdị ajụjụ a na-eche azịza nkwenye ma na-echekwa ụda mba na ịba mba dị n’ahịrịokwu Grik.
theological_decisions:
- issue: Ihe διεκρίθητε pụtara n’ihe metụtara ile mmadụ anya n’ihu
  choice: Amaokwu ahụ na-akatọ ịkpa ókè n’etiti ndị nọ n’ọgbakọ ndị kwere ekwe.
  alternative: Amaokwu ahụ na-ekwu maka ịbụ onye obi ya kewara abụọ ma ọ bụ onye nwere obi abụọ.
  rationale: Ihe a kọrọ ozugbo na Jemis 2:1–3 bụ ile ọgaranya anya n’ihu karịa ogbenye. Ya mere, ihe okwu a pụtara ebe a bụ ịkpa ókè, ọ bụghị inwe obi abụọ dịka o nwere ike ịpụta n’ebe ndị ọzọ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ikewa ndị ... iche” iji mee ka ịkpa ókè nke ọnọdụ ahụ pụta ìhè, ebe ndetu ala na-echekwa ụzọ ndị ọzọ a pụrụ isi ghọta okwu Grik. Akara ndetu [a] na [b] dị n’ahịrịokwu bụ isi.
