  rationale: E degharịrị ahịrịokwu ahụ iji wepụ nkwụghachi na-adịghị n’asụsụ mbụ ma weghachi ike ajụjụ nkwenye na ebubo dị na οὐ. “Kpara ókè n’etiti onwe unu” na-enye nkọwa dabara n’ọnọdụ nke ile ọgaranya anya n’ihu karịa ogbenye, ebe ndetu ala na-echekwa ohere okwu ahụ nwere nke ‘nkewa’ n’enweghị ịgbanwe isi ihe amaokwu ahụ. E megharịkwara ndetu ala a ka ọ bụrụ Igbo doro anya ma kwekọọ n’ederede a gbanwere.
