  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: ig
  text: N’ihi na ọ bụrụ na otu nwoke yi mgbaaka ọlaedo na uwe na-egbuke egbuke abata n’ọgbakọ unu[a], otu nwoke ogbenye yi uwe rụrụ arụ abatakwa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “synagogue.” Okwu Grik bụ synagōgē, nke pụtara n'ụzọ nkịtị “synagogue” ma ọ bụ “ọgbakọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: ọgbakọ
  rationale: Ọgbakọ na-egosi nzukọ ndị kwere ekwe n'ụzọ Igbo doro anya, na-enweghị ime ka onye na-agụ ya chee ozugbo banyere ụlọ nzukọ ndị Juu; ihe okwu Grik pụtara n'ụzọ nkịtị ka e debere n'ala peeji.
- source_word: ἀνὴρ
  choice: otu nwoke
  rationale: Okwu Grik ahụ bụ nwoke n’ọnụọgụ otu, ya mere nsụgharị a na-edobe nwoke ahụ kpọmkwem n’ihe atụ ahụ.
- source_word: χρυσοδακτύλιος
  choice: yi mgbaaka ọlaedo
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ nke ebumpụta ụwa isi kọwaa onye e ji ọlaedo chọọ mkpịsị aka ya mma; ọ naghị ekpebi ma ọ bụ naanị otu mgbaaka ka ọ bụ karịa.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: uwe na-egbuke egbuke
  rationale: Nke a na-edobe ihe a na-ahụ anya n’okwu λαμπρός, nke nwekwara ike ịpụta uwe mara mma ma ọ bụ dị oke ọnụ ahịa.
- source_word: πτωχὸς
  choice: onye ogbenye
  rationale: Ọ na-egosi onye dara ogbenye ma debe ọdịiche dị n’etiti ya na nwoke ahụ yiri ihe ndị na-egosi akụnụba.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: uwe ruru unyi
  rationale: Okwu a na-egosi uwe e metọrọ unyi n'ụzọ siri ike; ọ bụghị naanị uwe ochie ma ọ bụ nke adịghị mma.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: abata ... abatakwa
  rationale: Ikwughachi ngwaa ahụ na-edobe nhazi yiri ibe ya nke ahịrịokwu Grik; -kwa na-egosi na onye nke abụọ bịakwara.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta ihe atụ a na ndụmọdụ dị n’amaokwu bu ya ụzọ dịka nkọwa ma ọ bụ ihe akaebe.
theological_decisions:
- issue: Ịsụgharị συναγωγή n’akwụkwọ ozi e degaara ndị Kraịst
  choice: ọgbakọ
  alternative: ụlọ nzukọ ndị Juu
  rationale: Ọgbakọ na-enye nghọta sara mbara nke ndị gbakọtara, n’etinyeghị echiche nzukọ ụka ma ọ bụ ọchịchị ụka nke ederede ahụ ekwughị. E debere ntụgharị nkịtị metụtara ụlọ nzukọ ndị Juu n’ala peeji iji chekwaa asụsụ Ndị Juu na Ndị Kraịst oge mbụ nke okwu ahụ nwere ike igosi.
translation_notes:
  register: Asụsụ Igbo Izugbe, dị mfe ma dị ùgwù. E ji “uwe na-egbuke egbuke” chekwaa onyonyo nke λαμπρός, ebe “uwe ruru unyi” na-edobe ike nke ῥυπαρός. Akara ala peeji [a] dị n’ederede isi.
