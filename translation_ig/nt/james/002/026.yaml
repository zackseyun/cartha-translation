id: JAS.2.26
reference: James 2:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: ig
  text: N’ihi na dịka ahụ na-enweghị mmụọ[a] nwụrụ anwụ, otu ahụkwa ka okwukwe[b] na-enweghị ọrụ nwụrụ anwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ume.” Okwu Grik ahụ nwere ike ịpụta “mmụọ” ma ọ bụ “ume.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ntụkwasị obi” ma ọ bụ “ikwesị ntụkwasị obi.” Okwu Grik ahụ nwekwara ike igosi ịtụkwasị obi ma ọ bụ ikwesị ntụkwasị obi; n’ebe a, e ji “okwukwe,” bụ́ ntụgharị a na-ejikarị eme ihe.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ
  choice: dị nnọọ ka
  rationale: Ọ na-amalite ntụnyere ahụ ma na-eme ka myirịta dị n’etiti akụkụ abụọ ahụ pụta ìhè n’Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejigide njikọ nkọwa nke amaokwu a na arụmụka dị n’amaokwu ndị bu ya ụzọ.
- source_word: σῶμα
  choice: ahụ
  rationale: Nke a bụ okwu Igbo doro anya maka ahụ mmadụ, kwekọrọ n’ihe okwu Grik pụtara n’ebe a.
- source_word: χωρὶς πνεύματος
  choice: na-enweghị mmụọ
  rationale: “Na-enweghị” na-egosipụta χωρὶς nke ọma. “Mmụọ” na-echekwa obosara ihe πνεῦμα pụrụ ịpụta; e debere “ume” dị ka nhọrọ ọzọ n’okpuru amaokwu.
- source_word: νεκρόν / νεκρά
  choice: ihe nwụrụ anwụ
  rationale: A họọrọ otu okwu n’akụkụ abụọ nke ntụnyere ahụ iji chekwaa nkwughachi na ike okwu Jemis.
- source_word: οὕτως καὶ
  choice: otu ahụkwa ka
  rationale: Ọ na-egosi akụkụ nke abụọ kwekọrọ kpọmkwem na nke mbụ, ma bụrụkwa ụzọ Igbo dị mma isi kwuo ntụnyere a.
- source_word: πίστις
  choice: okwukwe
  rationale: “Okwukwe” bụ ntụgharị bụ isi, nke a na-aghọta nke ọma, ma na-echekwa okwu dị mkpa n’arụmụka Jemis n’enweghị ịkọwa ya gabiga ihe odide ahụ.
- source_word: χωρὶς ἔργων
  choice: na-enweghị ọrụ
  rationale: “Ọrụ” na-echekwa njikọ okwu a na arụmụka dum nke Jemis karịa okwu sara mbara dị ka “omume.”
theological_decisions:
- issue: Ihe πνεύματος pụtara n’ihe atụ ahụ
  choice: mmụọ
  alternative: ume
  rationale: “Mmụọ” na-echekwa obosara okwu Grik na echiche nke ihe na-enye ahụ ndụ, ebe “ume” bụkwa ntụgharị kwe omume n’ihe atụ banyere ahụ nwụrụ anwụ. E debere nke ahụ n’okpuru amaokwu kama idozi esemokwu ahụ n’isiokwu bụ isi.
- issue: Otú e si sụgharịa πίστις na Jemis 2:26
  choice: okwukwe
  alternative: ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi
  rationale: “Okwukwe” bụ ntụgharị bụ isi kwesịrị ekwesị n’ebe a. E gosiri ụzọ okwu ahụ nwekwara ike isi pụta n’okpuru amaokwu ka a ghara iwepụ obosara ya ma ọ bụ kpebie esemokwu nkà mmụta okpukpe n’ime ntụgharị ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi “dị nnọọ ka ... otu ahụkwa ka ...” na-echekwa ntụnyere Grik, ebe nkwughachi “ihe nwụrụ anwụ” na-echekwa ike okwu na myirịta dị n’ahịrị abụọ ahụ.
