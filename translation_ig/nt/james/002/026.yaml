review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the explanatory γάρ, the two-part comparison, and the repeated predicate 'dead.' Its renderings of πνεῦμα as 'mmụọ,' πίστις as 'okwukwe,' and ἔργων as 'ọrụ' are sound. In Igbo, 'ọrụ' may be number-neutral, so it adequately represents the Greek plural 'works.'
  naturalness: The predicate phrase 'si bụrụ ihe nwụrụ anwụ' is grammatically understandable but less idiomatic and weakens the direct force of νεκρόν/νεκρά. Standard Igbo naturally predicates 'nwụrụ anwụ' directly of both 'ahụ' and 'okwukwe.' The revised parallel construction is concise, clear, and preserves the rhetorical repetition.
  terminology: 'Key terms are retained consistently: ''mmụọ'' for πνεῦμα, with ''ume'' footnoted; ''okwukwe'' for πίστις, with lexical alternatives footnoted; and ''ọrụ'' for ἔργων. The faithfulness alternative is phrased as ''ikwesị ntụkwasị obi,'' avoiding a doctrinally loaded resolution.'
  issues:
  - severity: medium
    issue: The main text uses 'ihe nwụrụ anwụ' after both subject nouns.
    rationale: This literally introduces 'a dead thing' rather than directly saying that the body and faith are dead. Although comprehensible, it is less natural in modern Standard Igbo and slightly blunts the repeated predicate in Greek. Replacing it with direct 'nwụrụ anwụ' improves idiom without altering meaning.
