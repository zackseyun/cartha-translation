  rationale: The revision replaces the less idiomatic periphrasis 'si bụrụ ihe nwụrụ anwụ' with the direct Standard Igbo predicate 'nwụrụ anwụ.' It retains the source’s explanatory connection, exact analogy, repeated 'dead,' and both footnote anchors and lexical alternatives.
