review_pass:
  verdict: revise
  source_fidelity: The main lexical choices preserve the force of the Greek well, especially “na-egbu ọchụ” for φονεύετε and the distinction between “na-alụ ọgụ” and “na-ebu agha.” However, the repeated adversative “ma” does not reflect the Greek’s simple coordination, and “ihe unu chọrọ” in the final clause makes explicit an object left unstated in Greek.
  naturalness: The draft is generally clear Standard Igbo. Removing unnecessary adversative and additive particles makes the parallel clauses more natural and closer to the source. “Unu enweghị n’ihi na unu anaghị arịọ” is idiomatic in this context, with the omitted object recoverable from the preceding clauses.
  terminology: “Na-achọsi ike,” “na-egbu ọchụ,” “na-enwe anyaụfụ,” “na-alụ ọgụ,” and “na-ebu agha” are suitable, modern Standard Igbo renderings. The footnotes appropriately preserve alternatives and do not impose an interpretation.
  issues:
  - severity: medium
    issue: The two instances of “ma” introduce adversative contrast not expressed by the Greek καί.
    rationale: 'The source coordinates the paired actions and outcomes: “you desire and do not have … you murder and envy and cannot obtain.” Simple juxtaposition/coordination in Igbo better preserves this structure.'
  - severity: low
    issue: The final “ihe unu chọrọ” adds an explicit object absent from the Greek.
    rationale: The desired object is contextually understood, but Greek simply says “you do not have.” Leaving it implicit is both natural in Igbo and more formally faithful.
  - severity: low
    issue: The additive particles in “na-enwekwa anyaụfụ” and “na-ebukwa agha” slightly overmark the coordination.
    rationale: They are not seriously misleading, but plain coordinated verbs reproduce the Greek parallelism more cleanly.
  revised_text: Unu na-achọsi ike, unu enweghị; unu na-egbu ọchụ[b] na-enwe anyaụfụ[c], unu enweghị ike inweta ihe unu chọrọ; unu na-alụ ọgụ na-ebu agha. Unu enweghị n’ihi na unu anaghị arịọ[d].
