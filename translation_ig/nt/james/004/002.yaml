id: JAS.4.2
reference: James 4:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: ig
  text: Unu na-achọsi ike, unu enweghị; unu na-egbu ọchụ[b] na-enwe anyaụfụ[c], unu enweghị ike inweta ihe unu chọrọ; unu na-alụ ọgụ na-ebu agha. Unu enweghị n’ihi na unu anaghị arịọ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “unu na-egbu mmadụ.” Okwu Grik ahụ na-apụtakarị igbu ọchụ karịa igbu n’ozuzu ya. Ụfọdụ na-ewere okwu a dịka ụzọ siri ike e si ekwu okwu, ma nsụgharị ahụ debere ike okwu Grik ahụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “unu na-ekwo ekworo.”
    reason: lexical_alternative
  - marker: d
    text: Ihe ndị gbara amaokwu a gburugburu na-egosi na onye ha kwesịrị ịrịọ bụ Chineke, ma ederede Grik akpọghị ya aha kpọmkwem n’ebe a.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: unu na-achọsi ihe ike
  rationale: Nkebi a na-egosi ọchịchọ siri ike. Ọnọdụ okwu ahụ na-egosi na ọchịchọ ahụ adịghị mma, ma nsụgharị a anaghị eme ka ọ bụrụ naanị agụụ mmekọahụ ma ọ bụ naanị ịchọ ihe onwunwe onye ọzọ.
- source_word: ἔχετε
  choice: unu enweghị ya / unu enweghị ihe unu chọrọ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa mfe isi kwuo na ha enwetaghị ihe ha na-achọ.
- source_word: φονεύετε
  choice: unu na-egbu ọchụ
  rationale: Okwu Grik a na-egosikarị igbu mmadụ n’ụzọ bụ mpụ, ọ bụghị naanị igbu n’ozuzu ya; ya mere e debeere ịdị arọ nke okwu ahụ.
- source_word: ζηλοῦτε
  choice: na-enwekwa anyaụfụ
  rationale: N’ọnọdụ esemokwu a, okwu ahụ nwere echiche ọjọọ nke inwe anyaụfụ karịa ịnụ ọkụ n’obi n’ụzọ dị mma.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: unu enweghị ike inweta ihe unu chọrọ
  rationale: Nke a na-egosi na ha enweghị ike iru ma ọ bụ nweta ihe ọchịchọ ha lekwasịrị anya na ya, ma ọ na-ada nke ọma n’Igbo.
- source_word: μάχεσθε
  choice: unu na-alụ ọgụ
  rationale: Nsụgharị a na-echekwa ike okwu ahụ, nke nwere ike ịgụnye ọgụ ma ọ bụ nnukwu esemokwu.
- source_word: πολεμεῖτε
  choice: na-ebukwa agha
  rationale: Okwu a siri ike karịa μάχεσθε; ‘ibu agha’ na-echekwa nrịgo site n’ọgụ ruo n’agha.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: n’ihi na unu anaghị arịọ
  rationale: διά tinyere infinitive a na-egosi ihe kpatara ya. Onye a na-arịọ bụ Chineke dịka ihe gbara amaokwu a gburugburu si gosi, ma ebe Grik akpọghị ya aha n’ebe a, nsụgharị ahụ hapụrụ ya n’amaghị aha.
theological_decisions:
- issue: Ma a ga-eme ka φονεύετε dị nro site n’ịkọwa ya dịka ihe atụ ma ọ bụ okwu na-adịchaghị ike
  choice: E debere ‘unu na-egbu ọchụ’ n’ahịrị isi.
  alternative: ‘unu na-egbu mmadụ’ ma ọ bụ nkọwa dịka ‘unu na-egbu ọchụ n’obi unu’
  rationale: Okwu Grik ahụ n’onwe ya siri ike. Ma ọ bụ okwu a na-eji eme ka ihe pụta ìhè, ma ọ bụ ihe atụ, bụ okwu nkọwa; e kwesịghị itinye nkọwa ahụ n’ahịrị isi ma mee ka okwu ahụ dị nro.
- issue: Ma a ga-akpọ Chineke aha dịka onye a na-arịọ n’αἰτεῖσθαι
  choice: 'E hapụrụ onye a na-arịọ n’amaghị aha: ‘unu anaghị arịọ.’'
  alternative: ‘unu anaghị arịọ Chineke’
  rationale: Amaokwu gbara ya gburugburu na-egosi na ọ bụ Chineke ka a na-arịọ, ma ederede Grik akpọghị Chineke aha kpọmkwem n’ebe a. Nsụgharị ahụ na-echekwa ihe e kwuru n’ụzọ na-apụtaghị ìhè.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Nkebi ahịrịokwu na akara edemede na-agbaso usoro echiche Grik, ebe ‘na-ebukwa agha’ na-echekwa mmụba ike dị n’etiti μάχεσθε na πολεμεῖτε. E tinyere akara nkọwa ụkwụ [a]–[d] n’ebe okwu nke ọ bụla metụtara dị.
