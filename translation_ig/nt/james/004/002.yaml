revisions:
- from: Unu na-achọsi ihe ike, ma unu enweghị ya[a]; unu na-egbu ọchụ[b], na-enwekwa anyaụfụ[c], ma unu enweghị ike inweta ihe unu chọrọ; unu na-alụ ọgụ, na-ebukwa agha. Unu enweghị ihe unu chọrọ n’ihi na unu anaghị arịọ[d].
  to: Unu na-achọsi ike, unu enweghị; unu na-egbu ọchụ[b] na-enwe anyaụfụ[c], unu enweghị ike inweta ihe unu chọrọ; unu na-alụ ọgụ na-ebu agha. Unu enweghị n’ihi na unu anaghị arịọ[d].
  rationale: The revision removes adversative and extra additive particles that are not present in the Greek, while retaining the source’s emphatic sequence and the deliberate distinction between fighting and waging war. It also removes the explicitly supplied object in the last clause, preserving the Greek’s implicit object. Footnote a is retained as supplied, although its marker is not needed in the revised main text, because it documents the lexical alternative for ἐπιθυμεῖτε; it should be anchored to “na-achọsi ike” in typesetting.
