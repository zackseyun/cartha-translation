id: JAS.4.7
reference: James 4:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: ig
  text: Ya mere, dọnụ onwe unu n’okpuru Chineke.[a] Ma guzogidenụ Ekwensu, ọ ga-agbapụkwa n’ebe unu nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nọọnụ n’okpuru Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: doonụ onwe unu n’okpuru
  rationale: Aorist passive imperative ahụ nwere nghọta reflexive n’ọdụmọdụ a. Nkebi a na-egosi iji aka mmadụ kwenye ịnọ n’okpuru ọchịchị Chineke, ma na-adịkwa mfe nghọta n’Igbo nke oge a.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya ma na-echekwa njikọ echiche ahụ nke ọma.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: Ọ bụ onye a ga-edobe onwe n’okpuru ya; usoro ‘n’okpuru Chineke’ bụ ụzọ Igbo si egosipụta mmeju dative nke ὑποτάσσω n’ụzọ eke.
- source_word: ἀντίστητε
  choice: guzogidenụ
  rationale: Imperative a pụtara iguzogide ma ọ bụ ịkwụsi ike megide onye iro; ‘guzogidenụ’ bụ okwu Igbo doro anya ma sie ike n’ọdụmọdụ a.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ọdịiche dị n’etiti ido onwe n’okpuru Chineke na iguzogide Ekwensu.
- source_word: τῷ διαβόλῳ
  choice: Ekwensu
  rationale: διάβολος nwere article ma na-arụ ọrụ dịka aha onye iro ime mmụọ. ‘Ekwensu’ bụ aha Igbo a maara nke ọma maka onye ahụ.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ na ngwaa na-ejikọta iwu ahụ na ihe a kwere nkwa ga-esi na ya pụta n’ụzọ Igbo dị eke.
- source_word: φεύξεται
  choice: ọ ga-agbapụ
  rationale: Future indicative na-ekwupụta ihe ga-esi n’iguzogide ahụ pụta. ‘Ọ’ na-ezo aka n’Ekwensu, ‘ga-agbapụ’ na-echekwa echiche nke ịgbara ọsọ pụọ.
- source_word: ἀφ’ ὑμῶν
  choice: n’ebe unu nọ
  rationale: Na-egosi ịpụ n’ebe ndị a na-agwa okwu nọ; nke a bụ usoro okwu Igbo eke maka mmegharị pụọ n’ebe mmadụ nọ.
theological_decisions:
- issue: Nsụgharị διάβολος
  choice: Ekwensu dịka onye iro ime mmụọ nwere onwe ya
  alternative: onye nkwutọ, ma ọ bụ ihe ọjọọ a na-ewereghị dịka onye
  rationale: Okwu Grik ahụ nwere article, ihe gbara ya gburugburu na-ekwukwa banyere esemokwu ime mmụọ na omume onye ga-agbapụ. Ya mere, ‘Ekwensu’ na-echekwa nghọta ahụ n’enweghị itinye nkọwa otu ụka pụrụ iche.
- issue: Ụdị ido onwe n’okpuru Chineke
  choice: iwere aka mmadụ dobe onwe ya n’okpuru ọchịchị Chineke
  alternative: ịnọ naanị n’ọnọdụ ịbụ onye e mere ka ọ nọrọ n’okpuru
  rationale: Ọ bụ ezie na ụdị ngwaa Grik bụ passive, n’ọdụmọdụ a ọ nwere ike reflexive. Nsụgharị ahụ na-echekwa oku ka ndị na-anụ ya jiri aka ha kwenye, ebe nkọwa ọzọ dị na ndetu ala.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji imperative plural ‘doonụ’ na ‘guzogidenụ’ kwekọọ na ὑμῶν; e zere okwu teknụzụ na nkọwa ụka pụrụ iche.
