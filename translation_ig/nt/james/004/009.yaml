source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: ig
  text: Nweenụ nhụjuanya[a], kwaanụ uju, kwaakwa ákwá. Ka ọchị unu ghọọ iru uju, ka ọṅụ unu ghọọ ịda mba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nọọnụ ná mwute.” Ngwaa Grik a nwere ike ịpụta ịnọ ná nhụjuanya ma ọ bụ ná mwute.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “obi dara ada.” Okwu Grik a na-egosi ọnọdụ obi dara ada ma ọ bụ nke mwute juru.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: Nweenụ nhụjuanya
  rationale: A họọrọ okwu a iji gosipụta iwu siri ike ka ndị a na-agwa mata nhụsianya na ọnọdụ mwute ha, n’etinyeghị nkọwa ọzọ n’ime amaokwu ahụ.
- source_word: πενθήσατε
  choice: ruo uju
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa arọ isi kwuo iru uju; ọ dabara n’ọnọdụ nchegharị nke amaokwu ndị gbara ya gburugburu.
- source_word: κλαύσατε
  choice: kwaakwa ákwá
  rationale: Ọ na-echekwa ihe omume ịkwa ákwá dị iche n’iru uju, tinyekwa ike n’usoro iwu atọ ahụ.
- source_word: ὁ γέλως ὑμῶν εἰς πένθος μετατραπήτω
  choice: Ka ọchị unu ghọọ iru uju
  rationale: Usoro a na-echekwa ntụgharị ọnọdụ, ọdịdị iwu nke μετατραπήτω, na myirịta dị n’etiti ọchị na iru uju.
- source_word: ἡ χαρὰ εἰς κατήφειαν
  choice: ka ọṅụ unu ghọọ obi ịda mba
  rationale: ‘Obi ịda mba’ na-egosi ọnọdụ mmadụ obi ya dara, ihu ya adaa, nke kwekọrọ na κατήφεια; e bufere ‘unu’ gaa n’ahịrị nke abụọ dịka myirịta Grik si gosi.
theological_decisions:
- issue: Okwu nchegharị na ike mmetụta uche ya
  choice: E debere iwu ndị ahụ dịka òkù siri ike ka mmadụ nwee mwute nke nchegharị.
  alternative: Ime ka ọ bụrụ naanị òkù ka mmadụ kwụsị egwuregwu ma jiri ihe kpọrọ ihe.
  rationale: Jemis 4:6–10 na-ekwu maka iweda onwe mmadụ ala na ịlaghachikwuru Chineke. Ya mere, e kwesịghị ime ka iwu ndị a dị nro ma ọ bụ tinye nkọwa ozizi na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro iwu atọ ahụ na myirịta nke ahịrị abụọ ikpeazụ, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa nke na-edozi ihe ederede hapụrụ ka ọ dị.
