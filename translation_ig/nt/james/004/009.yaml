revisions:
- from: Nweenụ nhụjuanya[a], ruo uju, kwaakwa ákwá. Ka ọchị unu ghọọ iru uju, ka ọṅụ unu ghọọ obi ịda mba[b].
  to: Nweenụ nhụjuanya[a], kwaanụ uju, kwaakwa ákwá. Ka ọchị unu ghọọ iru uju, ka ọṅụ unu ghọọ ịda mba[b].
  rationale: The revision corrects the mourning imperative to idiomatic “kwaanụ uju” and narrows the final term from “obi ịda mba,” which can imply discouraged loss of courage, to “ịda mba,” a closer expression of dejection. The verse’s imperative force, parallelism, and penitential emotional register are retained without adding doctrinal interpretation.
