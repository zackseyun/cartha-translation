    text: 'A pụkwara ịsụgharị ya: “Mmụọ ahụ nke o mere ka ọ biri n’ime anyị na-agụsi agụụ ike n’anyaụfụ.” Okwu Grik ahụ nwere ike izo aka ma n’Mmụọ Nsọ ma na mmụọ mmadụ; “n’ekworo” pụkwara ịpụta “n’anyaụfụ.”'
    reason: alternative_reading
  revision_rationale: The revision more directly follows the Greek rhetorical-question-and-citation structure, uses idiomatic Standard Igbo for “Scripture,” and removes an added object from the verb of intense longing. It retains the deliberately unresolved referent of τὸ πνεῦμα and the jealousy/envy ambiguity in the footnote, without imposing a theological resolution.
