  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: ig
  text: 'Ma ọ bụ na unu chere na Akwụkwọ Nsọ na-ekwu n’efu, sị: “Mmụọ ahụ nke o mere ka ọ biri n’ime anyị na-agụsi agụụ ike n’ekworo”[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Mmụọ ahụ nke o mere ka ọ biri n’ime anyị na-agụsi agụụ ike n’anyaụfụ.” Okwu Grik ahụ nwere ike izo aka ma n’Mmụọ Nsọ ma na mmụọ mmadụ; “n’ekworo” pụkwara ịpụta “n’anyaụfụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: n'efu
  rationale: N'okwu a, ọ na-egosi ikwu okwu na-enweghị isi ma ọ bụ nzube; “n'efu” bụ okwu Igbo dị mfe ma na-edobe ike ajụjụ ahụ.
- source_word: ἡ γραφὴ
  choice: ihe e dere n'Akwụkwọ Nsọ
  rationale: Nke a na-egosi Akwụkwọ Nsọ dị ka ihe e dere nke nwere ikike, ma bụrụkwa okwu ndị mmadụ na-aghọta nke ọma.
- source_word: Πρὸς φθόνον
  choice: n'ekworo
  rationale: “N'ekworo” nwere ike igosi agụụ nke onye chọrọ ka ihe bụrụ nke ya, ma ọ pụkwara ịpụta anyaụfụ; ihe odide ala na-edobe nghọta abụọ ahụ.
- source_word: ἐπιποθεῖ
  choice: na-agụsi ya agụụ ike
  rationale: Nke a na-egosipụta ọchịchọ miri emi na nke siri ike dị na ngwaa Grik ahụ.
- source_word: τὸ πνεῦμα
  choice: Mmụọ ahụ
  rationale: Isi okwu na-ewere ya dị ka Mmụọ Nsọ, ma okwu Grik ahụ nwekwara ike izo aka na mmụọ mmadụ; e debere nke ọzọ n'ihe odide ala.
- source_word: κατῴκισεν
  choice: o mere ka o biri
  rationale: 'Nke a na-edobe ụdị causative nke ngwaa ahụ: ọ bụghị naanị na Mmụọ ahụ bi, kama Chineke mere ka o biri.'
- source_word: ἐν ἡμῖν
  choice: n'ime anyị
  rationale: Nke a na-egosipụta ibi n'ime ndị kwere ekwe karịa naanị ịnọ n'etiti ha.
theological_decisions:
- issue: Ihe τὸ πνεῦμα na-ezo aka na ya
  choice: Mmụọ Nsọ nke Chineke mere ka o biri n'ime ndị kwere ekwe
  alternative: mmụọ mmadụ nke Chineke mere ka o biri n'ime anyị
  rationale: Ụtọasụsụ Grik kwere ka a ghọta ya n'ụzọ abụọ. Isi okwu họọrọ Mmụọ Nsọ n'ihi asụsụ nke ibi n'ime ndị kwere ekwe, ma ihe odide ala na-edobe nghọta nke mmụọ mmadụ.
- issue: Ụdị omume φθόνος na-egosi
  choice: ekworo dịka ọchịchọ siri ike nke nwere ike ịbụ nke ziri ezi
  alternative: anyaụfụ dịka ọchịchọ ọjọọ
  rationale: N'ịghọta isi okwu dịka Mmụọ Nsọ, “ekworo” anaghị amanye echiche nke mmehie n'ebe Chineke nọ. Ma n'ihi na okwu Grik ahụ nwekwara ike ịpụta anyaụfụ, a kọwara nke ahụ n'ihe odide ala.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “Mmụọ” malite n' mkpụrụedemede ukwu n'isi okwu iji gosi nhọrọ nke Mmụọ Nsọ, ebe ihe odide ala na-edobe ezi mgbagwoju anya dị n'asụsụ Grik.
