  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: ig
  text: Kama nke ahụ, unu kwesịrị ịsị[a], “Ọ bụrụ na Onyenwe anyị chọrọ, anyị ga-adị ndụ ma meekwa ihe a ma ọ bụ ihe ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị, “kama unu ịsị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: Kama nke ahụ, unu kwesịrị ịsị
  rationale: Ụdị okwu Grik a pụtara n'ụzọ nkịtị ‘kama unu ịsị.’ Nsụgharị a na-eme ka mgbazi Jems na-enye doo anya n’Igbo dị ugbu a, n’etinyeghị echiche ọhụrụ.
- source_word: Ἐὰν
  choice: Ọ bụrụ na
  rationale: Nke a na-egosi ọnọdụ ihe a na-ekwu dabere na ya; ‘Ọ bụrụ na’ bụ ụzọ Igbo kwesịrị ekwesị isi gosipụta ya.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-ejikarị asụgharị κύριος n’akwụkwọ nsọ. A hapụrụ onye a na-ekwu kpọmkwem banyere ya ka ọ ghara ịkọwa karịa ihe Grik kwuru.
- source_word: θελήσῃ
  choice: achọọ
  rationale: θέλω na-egosi ọchịchọ ma ọ bụ ime uche. ‘Achọọ’ na-edobe ngwaa ahụ n’ụzọ dị mfe ma dịkwa arọ n’ọnọdụ a.
- source_word: καὶ ζήσομεν
  choice: anyị ga-adị ndụ
  rationale: Oge ọdịnihu nke ngwaa ahụ na-egosi na ọbụna ịdị ndụ n’ọdịnihu dabere n’uche Onyenwe anyị.
- source_word: καὶ ποιήσομεν
  choice: anyị ga-emekwa
  rationale: ‘Mee’ bụ ihe kwekọrọ kpọmkwem na ποιέω; ‘-kwa’ na-anọchi καί nke abụọ ma gosi na ma ịdị ndụ ma ime atụmatụ ahụ dabere n’uche Onyenwe anyị.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: ihe a ma ọ bụ ihe ahụ
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo ihe dị iche iche mmadụ nwere ike ịtụ atụmatụ ime, ma na-edobe obosara okwu Grik ahụ.
theological_decisions:
- issue: Onye ‘Onyenwe anyị’ na-ezo aka na ya na ike okwu ahụ banyere uche ya
  choice: Onyenwe anyị
  alternative: Chineke; Onyenwe anyị Jizọs
  rationale: Grik kwuru naanị ὁ κύριος. Ya mere, nsụgharị ahụ anaghị ekpebi ma Jems na-ekwu kpọmkwem banyere Nna ma ọ bụ Jizọs; ọ na-edobe isi okwu ahụ na ndụ na atụmatụ mmadụ dabere n’uche Onyenwe anyị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu, dee ya. E kwughachiri ‘anyị ga-’ iji mee ka ọdịnihu nke ngwaa abụọ ahụ doo anya, ebe ‘-kwa’ na-edobe njikọ καί nke abụọ n’enweghị okwu na-adịghị eke.
