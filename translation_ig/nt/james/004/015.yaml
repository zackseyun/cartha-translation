- from: Kama nke ahụ, unu kwesịrị ịsị[a], “Ọ bụrụ na Onyenwe anyị achọọ, anyị ga-adị ndụ, anyị ga-emekwa ihe a ma ọ bụ ihe ahụ.”
  to: Kama nke ahụ, unu kwesịrị ịsị[a], “Ọ bụrụ na Onyenwe anyị chọrọ, anyị ga-adị ndụ ma meekwa ihe a ma ọ bụ ihe ahụ.”
  rationale: A small idiomatic correction changes “achọọ” to “chọrọ” and smooths the coordination as “ma meekwa.” The rendering continues to express that both living and acting are contingent on the Lord’s will, without specifying the identity of “the Lord” beyond the Greek text. The footnote is retained with more natural Igbo phrasing.
