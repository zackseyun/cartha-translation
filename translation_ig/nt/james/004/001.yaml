revisions:
- from: Olee ebe agha dị iche iche na ọgụ dị iche iche dị n’etiti unu si abịa? Ọ̀ bụghị n’ebe a ka ha si abịa—site n’agụụ ihe ụtọ unu ndị na-ebu agha n’ime akụkụ ahụ unu?[a][b][c]
  to: Olee ebe agha, olee ebe ọgụ dị n’etiti unu si abịa? Ọ̀ bụghị site n’agụụ ihe ụtọ unu ndị na-alụ agha n’ime akụkụ ahụ unu ka ha si abịa?[a][b][c]
  rationale: The revision restores the source text’s repeated interrogative, retains the rhetorical question expecting an affirmative answer, and uses more idiomatic Igbo for the ongoing warfare imagery. It preserves the deliberate movement from communal conflicts ('dị n’etiti unu') to pleasures at war 'n’ime akụkụ ahụ unu,' without resolving the ambiguity into either exclusively social or exclusively inward conflict.
