id: JAS.4.1
reference: James 4:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: ig
  text: Olee ebe agha, olee ebe ọgụ dị n’etiti unu si abịa? Ọ̀ bụghị site n’agụụ ihe ụtọ unu ndị na-alụ agha n’ime akụkụ ahụ unu ka ha si abịa?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “esemokwu ... na arụmụka.” Okwu Grik ndị a bụ okwu agha n’ụzọ nkịtị, ma n’ebe a ha na-ekwu maka esemokwu dị n’ọgbakọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị nkebi nke mbụ dịka “n’ime unu.” Okwu Grik ahụ nwere ike ịpụta esemokwu dị n’etiti ndị a na-agwa okwu ma ọ bụ ọgụ dị n’ime ha. Amaokwu ahụ dum jikọtara esemokwu dị n’èzí na ọchịchọ dị n’ime mmadụ.
    reason: alternative_reading
  - marker: c
    text: “Akụkụ ahụ” bụ nsụgharị nkịtị; ọ nwere ike izo aka n’akụkụ anụ ahụ ma ọ bụ, n’ụzọ sara mbara, n’ọrụ na ikike dị iche iche dị n’ime mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: Olee ebe ... si abịa?
  rationale: Nke a na-egosipụta ajụjụ banyere isi mmalite ma na-edobe ike ajụjụ okwu Grik ahụ.
- source_word: πόλεμοι
  choice: agha dị iche iche
  rationale: “Agha” na-edobe ihe atụ ndị agha Jemis ji mee ka esemokwu siri ike n’ọgbakọ pụta ìhè; “dị iche iche” na-egosipụta ụdị ọtụtụ.
- source_word: μάχαι
  choice: ọgụ dị iche iche
  rationale: “Ọgụ” dị iche na “agha” ma na-edobe njikọ okwu agha abụọ dị na Grik.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: N’ebe mbụ a, okwu ahụ na-ezo n’ụzọ kachasị eke anya n’esemokwu dị n’etiti ndị a na-agwa okwu, ebe amaokwu ahụ ka na-ejikọta ya na ọgụ dị n’ime mmadụ.
- source_word: οὐκ ἐντεῦθεν
  choice: Ọ̀ bụghị n’ebe a ka ha si abịa
  rationale: Na-edobe ajụjụ nkwupụta nke na-atụ anya azịza ee, ma na-atụ aka n’isi mmalite a kọwara ozugbo.
- source_word: ἡδονῶν
  choice: agụụ ihe ụtọ
  rationale: “Ihe ụtọ” na-edobe isi echiche ἡδονή, ebe “agụụ” na-eme ka Igbo doo anya na ihe ụtọ ndị a na-arụ ọrụ dị ka ọchịchọ na-akpali esemokwu.
- source_word: στρατευομένων
  choice: ndị na-ebu agha
  rationale: Na-edobe ihe atụ agha na omume na-aga n’ihu nke participle ahụ.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: n’ime akụkụ ahụ unu
  rationale: Na-edobe ihe atụ gbasara akụkụ ahụ, ma ghara imechi ma ọ na-ekwu kpọmkwem banyere akụkụ anụ ahụ ma ọ bụ ikike dị iche iche dị n’ime mmadụ.
theological_decisions:
- issue: Ma agha na ọgụ ndị e kwuru na mbụ hà bụ naanị ọgụ dị n’ime mmadụ ka hà bụ esemokwu n’ọgbakọ
  choice: A sụgharịrị ἐν ὑμῖν nke mbụ dịka “n’etiti unu,” ma sụgharịa nkebi ikpeazụ dịka “n’ime akụkụ ahụ unu.”
  alternative: A pụrụ ịsụgharị nke mbụ dịka “n’ime unu,” ma ọ bụ mee nke ikpeazụ ka ọ bụrụ “n’ime unu.”
  rationale: Nhọrọ a na-edobe njikọ Jemis mere n’etiti esemokwu a na-ahụ n’etiti ndị mmadụ na ọchịchọ na-alụ ọgụ n’ime ha, n’enweghị ime ka amaokwu ahụ bụrụ naanị okwu gbasara mmekọrịta mmadụ ma ọ bụ naanị ọnọdụ ime mmụọ mmadụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, mee ihe. A hapụrụ ihe atụ agha ahụ ka ọ dị ike. A kọwara ụdị ọtụtụ nke aha Grik site na “dị iche iche,” ma jiri “agụụ ihe ụtọ” mee ka ἡδονῶν bụrụ okwu Igbo eke n’enweghị iwepụ echiche nke ihe ụtọ onwe onye.
