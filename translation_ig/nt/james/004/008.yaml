- from: Bịaruo Chineke nso, ya onwe ya ga-abịarukwa unu nso. Sachaa aka unu, unu ndị mmehie; meekwa ka obi unu dị ọcha, unu ndị obi abụọ.[a]
  to: Bịaruo Chineke nso, ọ ga-abịarukwa unu nso. Sachaa aka unu, unu ndị mmehie; meekwa ka obi unu dị ọcha, unu ndị nwere obi abụọ.[a]
  rationale: The revision removes an unsupported emphatic pronoun, improves the idiomatic vocative and footnote wording, and otherwise preserves the source’s imperative parallelism, moral-purification imagery, and ambiguity concerning the divided inner allegiance denoted by δίψυχοι.
