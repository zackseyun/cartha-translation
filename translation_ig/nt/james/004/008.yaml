id: JAS.4.8
reference: James 4:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: ig
  text: Bịaruo Chineke nso, ọ ga-abịarukwa unu nso. Sachaa aka unu, unu ndị mmehie; meekwa ka obi unu dị ọcha, unu ndị nwere obi abụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “unu ndị nwere mkpụrụobi abụọ.” Okwu a na-akọwa ndị obi ha kewara n'ikwesi ntụkwasị obi ma ọ bụ n'itinye obi ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: Bịaruo ... nso
  rationale: Iwu a dị n'ụdị ọtụtụ mmadụ; okwu a bụ Igbo nkịtị nke na-egosi ịbịaru Chineke nso ma na-edobe echiche mmekọrịta dị n'okwu Grik.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: Ọ bụ ihe nnata nke ngwaa ἐγγίζω; 'Bịaruo Chineke nso' bụ usoro okwu Igbo doro anya.
- source_word: ἐγγιεῖ
  choice: ga-abịarukwa unu nso
  rationale: Oge ọdịnihu, onye nke atọ otu; Chineke bụ onye a na-ekwu maka ya. Ikwughachi 'bịaruo nso' na-edobe myirịta nke ahịrịokwu Grik, ebe '-kwa' na-egosi mmeghachi omume ahụ.
- source_word: καθαρίσατε
  choice: Sachaa
  rationale: Iwu siri ike nke pụtara ime ka ihe dị ọcha. 'Sachaa aka unu' na-edobe ma onyinyo ịsa ahụ ma ike omume ọma nke okwu ahụ.
- source_word: χεῖρας
  choice: aka unu
  rationale: Aka bụ onyinyo ahụ dị na Grik; 'unu' kwesịrị ekwesị n'Igbo n'ihi na a na-agwa ọtụtụ mmadụ okwu, n'enweghị ịkọwa ya naanị dị ka omume mpụga.
- source_word: ἁμαρτωλοί
  choice: unu ndị mmehie
  rationale: Ọkpụkpọ aha ọtụtụ mmadụ nke na-abara ndị a na-agwa mba ozugbo; usoro a bụ Igbo doro anya ma dị ike.
- source_word: ἁγνίσατε
  choice: meekwa ka ... dị ọcha
  rationale: 'A họọrọ usoro a ka ọdịiche dị n''etiti καθαρίσατε na ἁγνίσατε ghara ịla n''iyi: a na-asacha aka, ma a na-eme ka obi dị ọcha.'
- source_word: καρδίας
  choice: obi unu
  rationale: Ọ na-edobe onyinyo obi dịka ime mmadụ, ebumnobi ya, na ntụkwasị obi ya, na-enweghị ịgbanwe ya ka ọ bụrụ nkọwa sara mbara.
- source_word: δίψυχοι
  choice: unu ndị obi abụọ
  rationale: N'Igbo nke oge a, okwu a na-egosi ndị obi ha kewara n'ịkwado ma ọ bụ n'iguzosi ike. Ihe odide ala peeji na-edobe onyinyo Grik pụtara n'ụzọ nkịtị 'mkpụrụobi abụọ.'
theological_decisions:
- issue: Ma a ga-akọwa aka na obi dịka omume mpụga na ebumnobi ime mmụọ
  choice: 'Idowe onyinyo ahụ n''onwe ya: ''aka unu'' na ''obi unu.'''
  alternative: Ịsụgharị ya kpọmkwem dịka omume unu na ebumnobi unu.
  rationale: Asụsụ Jemes nwere ike ijikọ ịdị ọcha nke emume na nke omume. Idowe akụkụ ahụ mmadụ na-ahapụ njikọ na esemokwu ahụ ka ha guzosie ike n'enweghị ịmanye otu nkọwa.
- issue: Nsụgharị δίψυχοι
  choice: unu ndị obi abụọ
  alternative: unu ndị nwere mkpụrụobi abụọ
  rationale: Isi echiche ya bụ ndị ntụkwasị obi ma ọ bụ mkpebi ime ha kewara. Nsụgharị isi na-ada ka Igbo a na-aghọta taa, ebe ihe odide ala peeji na-echekwa onyinyo okwu Grik.
translation_notes:
  register: Standard Igbo; okwu dị ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ mee ihe n'iwu niile. E debere myirịta nke 'ịbịaru nso,' onyinyo aka na obi, na ụda ịba mba nke amaokwu ahụ.
