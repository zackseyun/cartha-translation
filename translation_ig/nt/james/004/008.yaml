review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the sequence and force of the four plural imperatives, the hand/heart imagery, and the direct vocatives. However, “ya onwe ya” adds an emphatic “he himself” not expressed by ἐγγιεῖ. The future verb can refer back to Chineke without that added emphasis.
  naturalness: “Bịaruo Chineke nso” and “Sachaa aka unu” are clear Standard Igbo. “Unu ndị obi abụọ” is understandable, but “unu ndị nwere obi abụọ” is more idiomatic as a direct address. The footnote opening “N'ụzọ okwu na okwu” is not natural Igbo; “N'ụzọ nkịtị” is appropriate.
  terminology: “Chineke,” “ndị mmehie,” “aka,” and “obi” are suitable and preserve the biblical register. “Mee ka obi unu dị ọcha” adequately renders the imperative ἁγνίσατε while retaining a distinction from washing the hands. The footnote should retain the lexical image of “two-souled” while explaining divided loyalty/commitment without narrowing it doctrinally.
  issues:
  - severity: medium
    issue: Added emphasis in the future clause
    rationale: “ya onwe ya ga-abịarukwa” adds emphatic reflexive force (“he himself”) absent from the Greek, whose subject is simply implied from Chineke.
  - severity: low
    issue: Footnote opening is unnatural
    rationale: “N'ụzọ okwu na okwu” is an awkward calque. “N'ụzọ nkịtị” naturally introduces a literal rendering.
  - severity: low
    issue: Vocative for δίψυχοι can be more idiomatic
    rationale: “Unu ndị nwere obi abụọ” is a more natural Standard Igbo direct address, while the footnote preserves the Greek’s vivid ‘two-souled’ imagery.
