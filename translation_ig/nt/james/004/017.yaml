  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: ig
  text: Ya mere[a], onye maara ime ezi ihe ma ọ naghị eme ya, nke ahụ bụụrụ ya mmehie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi ya, onye ọ bụla maara ezi ihe o kwesịrị ime ma ọ naghị eme ya, nke ahụ bụụrụ ya mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότι
  choice: onye maara
  rationale: Nkebi ngwaa a dị na dative singular ma na-arụ ọrụ dị ka aha onye; “onye maara” na-echekwa otu onye a na-ekwu maka ya, ma na-enyekwa ya nghọta zuru ụwa ọnụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; “Ya mere” bụ okwu Igbo doro anya ma dịkwa n’usoro echiche ahụ.
- source_word: καλὸν
  choice: ezi ihe
  rationale: N’ebe a, καλόν pụtara ihe ọma ma ọ bụ ihe ziri ezi n’omume. “Ezi ihe” bụ okwu Igbo sara mbara nke na-adịghị eme ka ihe ahụ bụrụ naanị otu ụdị ọrụ ọma.
- source_word: ποιεῖν
  choice: ime
  rationale: Infinitive a jikọtara ya na καλόν; “ime ezi ihe” bụ ụzọ Igbo nkịtị na nke kpọmkwem isi kwuo ya.
- source_word: μὴ ποιοῦντι
  choice: ma ọ naghị eme ya
  rationale: Ọ na-egosi na onye ahụ anaghị eme ezi ihe ahụ ọ maara. Usoro a na-echekwa ọdịdị izugbe nke okwu ahụ, kama ime ka ọ bụrụ naanị otu ihe mere n’oge gara aga.
- source_word: ἁμαρτία
  choice: mmehie
  rationale: Aha a enweghị article ma nwee ike ịkọwa ụdị ihe omume ahụ bụ. “Mmehie” na-ekwu n’ụzọ kpọmkwem na ịghara ime ezi ihe a maara bụ mmehie.
- source_word: αὐτῷ
  choice: bụụrụ ya
  rationale: Dative a na-egosi onye ihe ahụ bụ mmehie n’ebe ọ nọ. “Bụụrụ ya” bụ usoro Igbo na-edobe ntinye aka nke onye ahụ n’onwe ya.
- source_word: ἐστιν
  choice: nke ahụ bụụrụ
  rationale: “Nke ahụ” na-ezo aka n’ịghara ime ezi ihe a maara, ebe “bụụrụ” na-ejikọta omume ahụ na “mmehie” n’Igbo doro anya.
theological_decisions:
- issue: Ụdị nkwupụta banyere ịghara ime ezi ihe a maara
  choice: Amaokwu ahụ na-ekwu na onye maara ime ezi ihe ma ghara ime ya na-eme mmehie, n’enweghị ịkpa ya ókè n’otu usoro ozizi.
  alternative: A pụrụ ịghọta ya naanị dịka ihe metụtara atụmatụ mpako ndị e kwuru banyere ha ozugbo tupu amaokwu a, ma ọ bụ dịka ụkpụrụ sara mbara banyere mmehie nke ịhapụ ezi ihe a kwesịrị ime.
  rationale: Ọnọdụ ya ozugbo metụtara ime atụmatụ n’mpako, ma okwu Grik ahụ sara mbara ma yie ilu. Nsụgharị ahụ na-echekwa ma njikọ ya na ọnọdụ ahụ ma ịdị sara mbara nke ụkpụrụ ya, na-enweghị itinye ozizi otu ụka n’ime ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ezi ihe” na-echekwa ịdị sara mbara nke καλόν, ebe “nke ahụ” na-eme ka ihe ἐστιν na-ezo aka na ya doo anya n’Igbo n’enweghị ịgbakwunye nkọwa ozizi.
