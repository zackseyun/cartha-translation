id: JAS.4.10
reference: James 4:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: ig
  text: Wedanụ onwe unu ala n’ihu Onyenwe anyị[a], ọ ga-ebulikwa unu elu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe Onyenwe anyị nọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ ga-enye unu nsọpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: Wedanụ onwe unu ala
  rationale: Ụdị iwu a nwere ike inwe nghọta nke ime ihe n’onwe onye n’ọnọdụ a. Nhọrọ a bụ Igbo doro anya nke na-akpọ ndị a na-agwa ka ha jiri aka ha wedata onwe ha, ma kwekọọkwa n’usoro iwu ndị gbara amaokwu a gburugburu.
- source_word: ἐνώπιον
  choice: n’ihu
  rationale: “N’ihu” na-egosipụta ma ịnọ n’ihu onye ma ịnọ n’ebe ọ nọ; ọ bụkwa okwu dị nkenke ma dị mma n’Igbo.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị asụ κύριος dị ka aha nsọpụrụ doro anya, n’ebughị ụzọ kpebie ma ebe a ọ na-ekwu kpọmkwem banyere Chineke ka ọ bụ Jizọs.
- source_word: ὑψώσει
  choice: ọ ga-ebulikwa ... elu
  rationale: Nkebiokwu a na-echekwa ihe atụ nke ibuli mmadụ elu, ya bụ inye ya nsọpụrụ ma ọ bụ ọnọdụ dị elu, ma na-ada nke ọma n’Igbo.
- source_word: ὑμᾶς
  choice: unu
  rationale: “Unu” na-egosipụta nke ọma na onye dere akwụkwọ na-agwa ọtụtụ mmadụ okwu.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya
  choice: E debere ya dị ka “Onyenwe anyị” n’akọwaghị ma ọ bụ Chineke Nna ka ọ bụ Jizọs.
  alternative: “Chineke” ma ọ bụ “Onyenwe anyị Jizọs”
  rationale: κύριος nwere ike izo aka na Chineke ma ọ bụ Jizọs n’akwụkwọ Jemis. Ahịrịokwu a n’onwe ya anaghị amanye onye ntụgharị ịkọwapụta ya karịa otú Grik si kwuo ya.
- issue: Ihe “ibuli elu” pụtara
  choice: E chekwara ihe atụ ahụ dị ka “ọ ga-ebulikwa unu elu.”
  alternative: “ọ ga-enye unu nsọpụrụ”
  rationale: Isi mmalite ahụ ji ὑψόω, nke nwere ihe atụ nke iweli mmadụ n’ọkwa ma ọ bụ n’nsọpụrụ. Ịhapụ ihe atụ ahụ na-echekwa obosara na ike okwu Grik.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu ma dị mfe nghọta. E ji “unu” chekwaa ọtụtụ mmadụ nke okwu Grik na-agwa; e chekwara ihe atụ nke iweda onwe na ibuli elu.
