id: JAS.4.6
reference: James 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: ig
  text: Ma ọ na-enye amara ka ukwuu. N’ihi ya, ọ na-ekwu sị,[a] “Chineke na-emegide ndị mpako, ma ọ na-enye ndị dị umeala n’obi amara.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ihi ya, Akwụkwọ Nsọ na-ekwu sị.” N’asụsụ Grik, a kpọghị kpọmkwem onye bụ isiokwu nke “na-ekwu.”
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: ka ukwuu
  rationale: Na-echekwa ike ntụnyere dị n’okwu Grik ahụ ma na-ada nke ọma mgbe e jikọtara ya na ‘amara.’
- source_word: δίδωσιν χάριν
  choice: na-enye amara
  rationale: Nsụgharị kwụ ọtọ nke ngwaa na ihe ọ na-achị; e megharịrị otu okwu ahụ n’ebe abụọ iji chekwaa nkwughachi e ji mesie echiche ike.
- source_word: διὸ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya n’ụzọ doro anya ma bụrụkwa Igbo nke oge a.
- source_word: λέγει
  choice: e kwuru
  rationale: Isiokwu nke ngwaa ahụ apụtaghị ìhè na Grik. Ụdị a anaghị akpọpụta onye na-ekwu okwu n’ụzọ ihe odide ahụ na-emeghị, ma ọ ka na-ewebata ihe e hotara.
- source_word: ὑπερηφάνοις
  choice: ndị mpako
  rationale: Na-egosipụta aha mmadụ sitere n’adjective ahụ ma na-adabara ọdịiche ya na ndị dị umeala n’obi.
- source_word: ἀντιτάσσεται
  choice: na-emegide
  rationale: Na-egosi mmegide siri ike ma na-ada doro anya n’Igbo nke oge a.
- source_word: ταπεινοῖς
  choice: ndị dị umeala n’obi
  rationale: Na-ebute echiche nke ndị na-adịghị ebuli onwe ha elu, na-enweghị ime ka ọ bụrụ naanị ọnọdụ mmekọrịta mmadụ na ibe ya.
- source_word: δὲ
  choice: Ma
  rationale: Na-echekwa ọdịiche dị ná mmalite amaokwu ahụ nakwa n’etiti akụkụ abụọ nke ihe e hotara.
theological_decisions:
- issue: Isiokwu a na-ekwughị kpọmkwem na λέγει
  choice: N’ihi ya, e kwuru
  alternative: N’ihi ya, ọ na-ekwu; N’ihi ya, Akwụkwọ Nsọ na-ekwu
  rationale: Grik ekwughị kpọmkwem onye bụ isiokwu ngwaa ahụ. Nsụgharị a na-echekwa oghere ahụ kama ikpebi na ọ bụ Chineke ma ọ bụ Akwụkwọ Nsọ kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ndị dị umeala n’obi’ bụ akpaalaokwu Igbo a na-ahụkarị; ‘amara’ na-echekwa okwu nkà mmụta okpukpe ahụ n’enweghị ịgbakwunye nkọwa otu ụka.
