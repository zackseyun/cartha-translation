revisions:
- from: Ma ọ na-enye amara ka ukwuu. N’ihi ya, e kwuru[a] sị, “Chineke na-emegide ndị mpako, ma ọ na-enye ndị dị umeala n’obi amara.”
  to: Ma ọ na-enye amara ka ukwuu. N’ihi ya, ọ na-ekwu sị,[a] “Chineke na-emegide ndị mpako, ma ọ na-enye ndị dị umeala n’obi amara.”
  rationale: The sole revision corrects the citation formula from a past impersonal expression to a present verb with an implicit subject, corresponding more closely to λέγει. The footnote is adjusted so that it explains the ambiguity without presenting the main rendering itself as an alternative.
  reviewer_model: gpt-5.6-terra
