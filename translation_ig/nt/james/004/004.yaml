revisions:
- from: Unu ndị inyom na-akwa iko[a], ọ̀ bụ na unu amaghị na ịbụ enyi ụwa[b] bụ iro megide Chineke[c]? Ya mere, onye ọ bụla chọrọ ịbụ enyi ụwa na-eme onwe ya ka ọ bụrụ onye iro Chineke[d].
  to: Unu ndị inyom na-akwa iko[a], ọ̀ bụ na unu amaghị na mmekọrịta enyi na ụwa[b] bụ iro megide Chineke[c]? Ya mere, onye ọ bụla chọrọ ịbụ enyi ụwa na-aghọ onye iro Chineke[d].
  rationale: The revision corrects the main source-fidelity issue by rendering καθίσταται as “na-aghọ,” rather than adding a reflexive active sense. It also improves the idiomatic expression of φιλία in the first clause. All original footnote anchors are retained, and the revised footnote d now identifies the former, more agentive wording as an alternative rather than presenting the source-nearer wording only in a note.
