id: JAS.4.4
reference: James 4:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: ig
  text: Unu ndị inyom na-akwa iko[a], ọ̀ bụ na unu amaghị na mmekọrịta enyi na ụwa[b] bụ iro megide Chineke[c]? Ya mere, onye ọ bụla chọrọ ịbụ enyi ụwa na-aghọ onye iro Chineke[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O yikarịrị ka “ndị inyom na-akwa iko” bụ ihe atụ nke ndị na-ekwesịghị ntụkwasị obi nye Chineke, dịka asụsụ ọgbụgba ndụ dị n’akwụkwọ ndị amụma.
    reason: lexical_alternative
  - marker: b
    text: “Ụwa” n’ebe a pụtara usoro ọchịchọ na ụkpụrụ mmadụ nke na-emegide Chineke; ọ pụtaghị ihe niile Chineke kere.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “ịnọ n’iro na Chineke.”
    reason: alternative_reading
  - marker: d
    text: A pụkwara ịsụgharị ya, “na-eme onwe ya ka ọ bụrụ onye iro Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: Unu ndị inyom na-akwa iko
  rationale: E debere ụdị oku nke okwu Grik ahụ na nkọwa ya kpọmkwem, bụ́ ụmụ nwanyị na-akwa iko. “Unu” na-eme ka oku ahụ daa nke ọma n’Igbo, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na o yikarịrị ka ọ bụ ihe atụ nke ekwesịghị ntụkwasị obi n’ebe Chineke nọ.
- source_word: οὐκ οἴδατε
  choice: ọ̀ bụ na unu amaghị
  rationale: Nke a na-edobe ajụjụ nkwughachi ahụ n’ụdị Igbo a na-asụ ugbu a, na-atụ anya na ndị a na-agwa kwesịrị ịma azịza ya.
- source_word: φιλία
  choice: ịbụ enyi
  rationale: Nke a bụ ụzọ ebumpụta ụwa e si kwuo mmekọrịta enyi n’Igbo, ọ na-echekwakwa njikọ okwu ahụ na φίλος, “enyi,” nke dị n’ahịrị na-esote.
- source_word: κόσμου
  choice: ụwa
  rationale: A hapụrụ okwu ahụ n’obosara ya dịka Grik si dị, kama ịgbasa ya n’ime ederede ka ọ bụrụ usoro mmadụ nke na-emegide Chineke.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: iro megide Chineke
  rationale: Nke a na-egosi n’ụzọ doro anya na ịbụ enyi ụwa bụ iguzogide Chineke, ma ndetu ala peeji na-echekwa ohere ịghọta ya dịka ịnọ n’ọnọdụ iro n’etiti mmadụ na Chineke.
- source_word: ὃς ἐὰν οὖν
  choice: Ya mere, onye ọ bụla
  rationale: “Ya mere” na-egosi nkwubi okwu οὖν, ebe “onye ọ bụla” na-egosi na okwu ahụ metụtara onye ọbụla dabara n’ọnọdụ a.
- source_word: βουληθῇ
  choice: chọrọ
  rationale: Ọ na-egosi ọchịchọ ma ọ bụ mkpebi mmadụ n’asụsụ Igbo dị mfe ma dị ugbu a.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: ịbụ enyi ụwa
  rationale: A na-edobe okwu “enyi” kpọmkwem na njikọ ya na “ịbụ enyi” dị na nkebi mbụ, n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: onye iro Chineke
  rationale: Nke a na-edobe ihe dị iche n’etiti ịbụ enyi ụwa na ịbụ onye iro Chineke n’ụzọ siri ike ma doo anya.
- source_word: καθίσταται
  choice: na-eme onwe ya ka ọ bụrụ
  rationale: Nke a na-egosi na nhọrọ onye ahụ mere na-etinye ya n’ọnọdụ onye iro Chineke; ndetu na-enye “na-aghọ” dịka nsụgharị ọzọ kwere omume.
theological_decisions:
- issue: Ihe atụ dị na μοιχαλίδες
  choice: E debere “ndị inyom na-akwa iko” n’ederede bụ isi.
  alternative: Unu ndị na-ekwesịghị ntụkwasị obi nye Chineke.
  rationale: O yikarịrị ka Jemis na-eji asụsụ ịkwa iko nke ndị amụma ji akọwa ekwesịghị ntụkwasị obi n’ọgbụgba ndụ. Ma ịgbanwe ya ozugbo ka ọ bụrụ nkọwa ime mmụọ ga-ewepụ nkọ na ụdị nwanyị dị n’okwu Grik ahụ.
- issue: Ihe κόσμος pụtara n’ebe a
  choice: A sụgharịrị ya “ụwa” n’ederede bụ isi.
  alternative: Usoro ụwa nke na-emegide Chineke.
  rationale: N’ebe a, okwu ahụ na-ezo aka n’usoro ọchịchọ na ụkpụrụ mmadụ nke na-emegide Chineke, ọ bụghị ihe niile Chineke kere. Ma okwu Grik n’onwe ya bụ “ụwa,” ya mere e debere ya ma kọwaa ya na ndetu.
- issue: Ụdị genitive dị na ἔχθρα τοῦ θεοῦ
  choice: iro megide Chineke
  alternative: ịnọ n’iro na Chineke
  rationale: Ihe gbara ya gburugburu na-akwado iro a na-eche megide Chineke, ma usoro okwu Grik ahụ nwekwara ike ịkọwa ọnọdụ iro dị n’etiti mmadụ na Chineke. Ndetu na-echekwa ohere ahụ.
- issue: Ike omume mmadụ dị na καθίσταται
  choice: na-eme onwe ya ka ọ bụrụ onye iro Chineke
  alternative: na-aghọ onye iro Chineke
  rationale: Nhọrọ a na-eme ka njikọ dị n’etiti ọchịchọ onye ahụ na ọnọdụ ọ batara pụta ìhè, ma a naghị ekwu na naanị nke a ka ngwaa ahụ nwere ike ịpụta.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ siri ike nke ịkwa iko na okwu sara mbara “ụwa,” ebe ndetu na-enye nkọwa dị mkpa n’enweghị itinye nkọwa okpukpe otu ụka n’ederede.
