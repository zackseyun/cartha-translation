  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: ig
  text: Ọ bụ naanị otu onye bụ Onye na-enye iwu na Onyeikpe—onye ahụ nwere ike ịzọpụta ma bibie. Ma gị onwe gị, onye ka ị bụ, onye na-ekpe onye agbata obi gị ikpe?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: Onye na-enye iwu
  rationale: Na-egosipụta onye na-enye ma na-edobe iwu n'ụzọ doro ndị na-agụ Igbo nke oge a anya, n’enweghị itinye echiche ụka pụrụ iche.
- source_word: κριτής / κρίνων
  choice: Onyeikpe / na-ekpe ... ikpe
  rationale: Na-edobe njikọ okwu dị n’etiti Chineke dịka Onyeikpe na mmadụ na-ekpe onye agbata obi ya ikpe.
- source_word: σῶσαι
  choice: ịzọpụta
  rationale: Okwu Igbo a na-eburu nghọta sara mbara nke nzọpụta dị na ngwaa Grik ahụ.
- source_word: ἀπολέσαι
  choice: ilaa n’iyi
  rationale: Na-echekwa ike okwu Grik ahụ nke pụtara ime ka ihe ma ọ bụ mmadụ laa n’iyi, n’akọwaghị kpọmkwem ụdị mbibi ahụ.
- source_word: πλησίον
  choice: onye agbata obi
  rationale: Nke a bụ nsụgharị Igbo nkịtị nke ‘onye nọ nso’ ma ọ bụ ‘neighbor,’ ma dabara n’ụzọ e si eji okwu ahụ eme ihe n’Akwụkwọ Nsọ.
theological_decisions:
- issue: Njikọ utu aha νομοθέτης καὶ κριτής
  choice: Onye na-enye iwu na Onyeikpe
  alternative: onye na-enye iwu, bụrụkwa Onyeikpe
  rationale: Na-edobe utu aha abụọ ahụ n’otu ahịrị dịka isi mmalite si dị, n’etinyeghị nkọwa ọzọ banyere mmekọrịta ha.
- issue: Ihe ἀπολέσαι na-ezo aka na ya
  choice: laa n’iyi
  alternative: bibie
  rationale: ‘Laa n’iyi’ na-echekwa ohere nghọta okwu ahụ n’enweghị ịkọwapụta ma ọ bụ ibubata ozizi banyere ụdị ikpe ikpeazụ.
- issue: Ụdị ajụjụ σὺ δὲ τίς εἶ, ὁ κρίνων
  choice: Ma gị onwe gị, onye ka ị bụ, gị na-ekpe ... ikpe?
  alternative: Ma onye ka ị bụ iji kpee ... ikpe?
  rationale: Ụdị a na-anọ nso n’usoro Grik ma na-echekwa participle ahụ dịka nkọwa nke onye a na-ajụ ajụjụ, kama ime ya ka ọ bụrụ naanị okwu gbasara ikike.
translation_notes:
  register: Standard Igbo; asụsụ dị ugwu ma dị mfe nghọta. Ejiri ‘naanị otu onye’ mee ka εἷς pụta ìhè, ma chekwaa ajụjụ ikpeazụ dịka ịma aka kpọmkwem nye onye na-agụ ya.
