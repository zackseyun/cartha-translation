- from: Ọ bụ naanị otu onye bụ Onye na-enye iwu na Onyeikpe—onye ahụ nwere ike ịzọpụta ma laa n’iyi. Ma gị onwe gị, onye ka ị bụ, gị na-ekpe onye agbata obi gị ikpe?
  to: Ọ bụ naanị otu onye bụ Onye na-enye iwu na Onyeikpe—onye ahụ nwere ike ịzọpụta ma bibie. Ma gị onwe gị, onye ka ị bụ, onye na-ekpe onye agbata obi gị ikpe?
  rationale: The revision corrects the grammatical direction and active meaning of ἀπολέσαι, changing “laa n’iyi” to “bibie.” It also smooths the final participial description without changing its force or adding an interpretation about authority, judgment, or final punishment.
