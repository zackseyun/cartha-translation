base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: ig
  text: Ma ugbu a, unu na-etu ọnụ n’ime nganga unu[a]. Ịtu ọnụ ọ bụla dị otu a bụ ihe ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “n’ime mpako unu,” “n’ihe unu ji mpako na-azọrọ,” ma ọ bụ “n’okwu nganga unu.” Okwu Grik ahụ nwere ike ịpụta mpako ma ọ bụ nkwuwa okwu efu n’ozuzu ya; n’ebe a, o yikarịrị ka ọ na-arụtụ aka kpọmkwem n’atụmatụ ndị ha ji ntụkwasị obi gabiga ókè mee, ndị a kọwara n’amaokwu ndị bu ụzọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: Ma ugbu a
  rationale: Nke a na-egosipụta ntụgharị okwu na-emegide ọnọdụ umeala n’obi a kọwara n’amaokwu bu ụzọ, ma na-edobekwa echiche oge dị ugbu a.
- source_word: καυχᾶσθε
  choice: unu na-etu ọnụ
  rationale: “Ịtu ọnụ” bụ ụzọ Igbo doro anya ma bụrụkwa nke nkịtị isi kwuo ịnya isi ma ọ bụ ikwu okwu otuto banyere onwe onye.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: n’ime nganga unu
  rationale: “Nganga” na-egosipụta mpako na ntụkwasị obi mmadụ nwere n’onwe ya nke karịrị akarị. Ọ naghị amachi okwu ahụ naanị n’atụmatụ azụmahịa, ya mere ọ na-echekwa obosara na ntakịrị mgbagwoju anya nke okwu Grik ahụ.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: Itu ọnụ niile dị otu ahụ
  rationale: Nke a na-enye echiche izugbe nke πᾶσα na ụdị omume τοιαύτη na-arụtụ aka na ya, ma jikọta ya na ngwaa “na-etu ọnụ” nke dị na nkebi mbụ.
- source_word: πονηρά
  choice: bụ ihe ọjọọ
  rationale: “Ihe ọjọọ” na-egosipụta ikpe omume ọma na ihe ọjọọ nke okwu Grik ahụ, ọ bụghị naanị na ihe ahụ adịghị mma.
theological_decisions:
- issue: Ụdị itu ọnụ a katọrọ
  choice: A katọrọ nganga na ntụkwasị obi mmadụ nwere n’atụmatụ nke aka ya n’enweghị ido onwe ya n’okpuru Onyenweanyị, dịka amaokwu ndị gbara ya gburugburu na-egosi.
  alternative: Iwere ya dị ka ikpe megide ụdị ntụkwasị obi mmadụ niile, ma ọ bụ ime ka ọ bụrụ naanị atụmatụ azụmahịa ka a na-ekwu maka ya.
  rationale: Amaokwu 13–15 na-ekwu maka atụmatụ mmadụ ji obi ike mee maka ọdịnihu. Ma amaokwu a ji okwu sara mbara mechie echiche ahụ; ya mere nsụgharị ahụ anaghị etinye “atụmatụ” n’ahịrị ahụ ma ọ bụ mee ka ikpe ahụ gbasaa karịa ihe ndị gbara ya gburugburu.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ịtu ọnụ” maka okwu abụọ sitere n’otu mgbọrọgwụ Grik, ebe “nganga” na-echekwa echiche mpako n’etinyeghị “atụmatụ” ozugbo n’ahịrị bụ isi.
