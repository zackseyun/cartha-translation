  terminology: “ụmụnna,” “nwanna,” “iwu,” and “onyeikpe” are suitable. “onye na-eme ihe iwu kwuru” accurately conveys ποιητής in accessible Igbo. The footnote on “ụmụnna” should use the more natural inclusive phrase “ụmụnna nwoke na nwanyị,” rather than repeating “ụmụnna.”
