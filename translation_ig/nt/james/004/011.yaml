id: JAS.4.11
reference: James 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: ig
  text: Unu ekwula okwu ọjọọ megide ibe unu,[a] ụmụnna.[b] Onye na-ekwu okwu ọjọọ megide nwanna ya ma ọ bụ na-ekpe nwanna ya ikpe na-ekwu okwu ọjọọ megide iwu, na-ekpe iwu ikpe. Ma ọ bụrụ na ị na-ekpe iwu ikpe, ị bụghị onye na-eme ihe iwu kwuru, kama ị bụ onyeikpe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Unu ekwutọla ibe unu”; ngwaa Grik ahụ nwere ike ịpụta ikwu okwu megide mmadụ n'ụzọ na-emebi aha ya.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ụmụnna” dị n'ụdị ọtụtụ nke nwoke, ma o yikarịrị ka ọ na-agwa ọgbakọ niile okwu—ụmụnna nwoke na nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: ikwụ okwu ọjọọ megide
  rationale: Nkebiokwu a na-egosi ikwu okwu megide mmadụ n'ụzọ nwere ike imebi aha ya, ma ọ naghị eme ka ihe ọ pụtara bụrụ naanị nkwutọ n'usoro iwu. E jikwa otu nkebiokwu ahụ ugboro atọ iji chekwaa njikọ okwu dị na Grik.
- source_word: ἀλλήλων
  choice: ibe unu
  rationale: Nke a bụ ụzọ Igbo si ekwu reciprocal n'ụzọ doro anya ma kwekọọ n'okwu e nyere ọgbakọ.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo ebumpụta ụwa nke na-echekwa ihe atụ ezinụlọ ahụ, ma nwee ike ịgụnye ndị nwoke na ndị nwanyị n'ọgbakọ.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: nwanna ya
  rationale: Nke a na-echekwa otu mgbọrọgwụ okwu ezinụlọ na ἀδελφοί ma na-ada n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ἢ
  choice: ma ọ bụ
  rationale: E sụgharịrị ya dịka conjunction nkewa, ka ikwu okwu megide mmadụ na ikpe ya bụrụ omume abụọ e tinyere n'akụkụ ibe ha.
- source_word: κρίνων / κρίνει / κρίνεις
  choice: ikpe ... ikpe
  rationale: Nhọrọ a na-echekwa nkwugharị nke okwu Grik ma ghara ime ka ọ pụta naanị ikpe mara mmadụ.
- source_word: νόμου / νόμον
  choice: iwu
  rationale: A hapụrụ ihe iwu ahụ na-ezo aka na ya n'obosara dịka ederede ahụ si mee, n'etinyeghị “iwu Mosis,” “iwu eze,” ma ọ bụ nkọwa ọzọ.
- source_word: ποιητὴς
  choice: onye na-eme ihe iwu kwuru
  rationale: Nke a bụ Igbo doro anya ma dị ugbu a nke na-egosipụta onye na-eme ihe iwu chọrọ, ma na-echekwa ọdịiche ya na onyeikpe.
- source_word: κριτής
  choice: onyeikpe
  rationale: “Onyeikpe” bụ aha onye na-ekpe ikpe, wee mee ka ọdịiche dị n'etiti ime iwu na ịnọ dịka onye na-ekpe iwu doo anya.
theological_decisions:
- issue: Ndị ἀδελφοί na-agụnye n'okwu a
  choice: Jiri “ụmụnna” n'ahịrị isi, ma tinye nkọwa n'okpuru.
  alternative: ụmụnna nwoke; ụmụnna nwoke na ụmụnna nwanyị
  rationale: Ụdị Grik bụ masculine plural, ma n'ọnọdụ a o yikarịrị ka ọ na-akpọ ọgbakọ niile. “Ụmụnna” na Standard Igbo nwere ike ịrụ ọrụ n'ụzọ gụnyere mmadụ niile, ebe nkọwa na-eme ka ọdịdị Grik pụta ìhè.
- issue: Ihe “iwu” na-ezo aka na ya
  choice: Sụgharịa ya naanị dịka “iwu.”
  alternative: iwu Mosis; iwu eze; iwu Chineke
  rationale: Akwụkwọ Jemis nwere ike na-ezo aka n'iwu Chineke ọ tụlerela, karịchaa iwu ịhụ onye agbata obi n'anya, ma amaokwu a n'onwe ya akọwaghị ya karịa nke ahụ. Ya mere, nsụgharị ahụ echekwala obosara ya.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” kwupụta iwu e nyere ọtụtụ mmadụ, ma gbanwee gaa “ị” n'ahịrị ikpeazụ dịka Grik si gbanwee gaa onye nke abụọ otu. Nkwugharị nke “okwu ọjọọ megide” na “ikpe” bụ nke a kpachapụrụ anya chekwaa maka usoro arụmụka ahụ.
