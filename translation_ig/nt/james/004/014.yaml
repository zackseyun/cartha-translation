    text: Ma ọ bụ, “anwụrụ mmiri.”
    reason: lexical_alternative
  revision_rationale: The revision removes an added adversative, preserves the rhetorical questions and the metaphor of human transience, and makes the two descriptive actions of the mist parallel and idiomatic in Standard Igbo. No doctrinal interpretation has been added.
