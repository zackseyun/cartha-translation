id: JAS.4.14
reference: James 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: ig
  text: Unu amaghị ihe gbasara echi. Gịnị bụ ndụ unu? N’ihi na unu bụ alụlụ mmiri[a] nke na-apụta nwa oge, emesịa na-apụ n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anwụrụ mmiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίστασθε
  choice: amaghị
  rationale: N’ebe a, okwu ahụ na-egosi na mmadụ enweghị ihe ọmụma banyere ọdịnihu; “amaghị” bụ ụzọ Igbo kacha doo anya ma bụrụkwa nke e ji ekwu okwu kwa ụbọchị.
- source_word: τὸ τῆς αὔριον
  choice: ihe ga-eme echi
  rationale: Nkebi okwu Grik a dị nkenke ma hapụ ụfọdụ okwu n’ime ya; “ihe ga-eme echi” na-egosipụta ihe ọ pụtara n’Igbo ekeghị echiche ọzọ n’elu ya.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: Gịnị bụ ndụ unu?
  rationale: Nke a na-edobe ajụjụ siri ike nke na-ajụ banyere ụdị na ọdịdị ndụ mmadụ, n’ụzọ dị nkenke ma dịkwa ebube n’Igbo.
- source_word: ἀτμὶς
  choice: alụlụ mmiri
  rationale: “Alụlụ mmiri” na-enye onyinyo ihe na-adịchaghị ike, nke na-apụta ma na-apụ ngwa ngwa; ọ dabara na ihe atụ Grik ahụ.
- source_word: πρὸς ὀλίγον
  choice: nwa oge
  rationale: Okwu a na-egosi obere oge; “nwa oge” bụ okwu Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: φαινομένη
  choice: na-apụta
  rationale: “Na-apụta” na-egosi na a na-ahụ alụlụ ahụ ruo obere oge, ma na-edobe mmegharị dị n’onyinyo ahụ.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: emesịa ọ pụọ n’anya
  rationale: Nsụgharị a na-edobe usoro oge ahụ—ọ na-ebu ụzọ pụta, emesịa a naghị ahụ ya ọzọ—n’Igbo doro anya ma dị ndụ.
theological_decisions:
- issue: Ihe atụ banyere mkpụmkpụ na ejighị n’aka nke ndụ mmadụ
  choice: E debere ihe atụ nke alụlụ mmiri dịka okwu na-egosi na ndụ mmadụ na-adị nwa oge, nakwa na mmadụ amaghị ọdịnihu.
  alternative: Ịkọwa ya ozugbo dịka “ndụ unu na-agafe ngwa ngwa.”
  rationale: Idebe ihe atụ ahụ na-echekwa ike edemede na esemokwu nke amaokwu ahụ n’etinyeghị ozizi ọzọ banyere ọnwụ ma ọ bụ ikpe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ùgwù. A hapụrụ ajụjụ “Gịnị bụ ndụ unu?” ka ọ nọgide bụrụ ajụjụ nkwupụta siri ike, e zerekwa ịkọwa ihe atụ ahụ karịa ihe isi mmalite kwuru.
