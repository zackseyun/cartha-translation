revisions:
- from: Unu na-arịọ, ma unu adịghị anata, n’ihi na unu na-arịọ n’ụzọ na-ezighị ezi[a], ka unu wee mefuo ihe unu nwetara n’ihe ụtọ nke onwe unu[b].
  to: Unu na-arịọ ma unu anaghị anata, n’ihi na unu na-arịọ n’ụzọ ọjọọ[a], ka unu wee jiri ya mee ihe ụtọ unu[b].
  rationale: The revision removes an explicit object not stated in the Greek, renders the spending purpose naturally in Igbo with an implicit pronoun, and limits “pleasures” to the source’s possessive wording. The notes preserve legitimate lexical alternatives without making a doctrinal or overly specific interpretive claim.
