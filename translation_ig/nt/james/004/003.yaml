review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the repeated plural address, the causal clause, and the purposive force. However, “ihe unu nwetara” explicitly supplies “what you received,” whereas the Greek leaves the object of δαπανήσητε implicit. This is a small but unnecessary expansion. “Nke onwe unu” also adds a reflexive/self-focused element beyond the possessive “your” in ὑμῶν.
  naturalness: 'The revision uses natural Standard Igbo: “Unu na-arịọ ma unu anaghị anata” and “jiri ya mee ihe ụtọ unu” are clear and idiomatic. It avoids the somewhat cumbersome “ihe ụtọ nke onwe unu.”'
  terminology: “N’ụzọ ọjọọ” suitably renders κακῶς broadly, without reducing it to motives. “Ihe ụtọ unu” represents ἡδοναῖς while allowing the contextual sense of self-indulgent desires to be noted without importing it into the text.
  issues:
  - severity: medium
    issue: The phrase “ihe unu nwetara” is added as the object of “mefuo.”
    rationale: δαπανήσητε has an implicit object, understood from the asking/receiving context, but it does not expressly say “the thing you received.” Retaining the pronoun “ya” preserves the source’s implicitness more closely.
  - severity: low
    issue: “Nke onwe unu” over-specifies the possessive phrase.
    rationale: ἐν ταῖς ἡδοναῖς ὑμῶν means “in/on your pleasures.” The added “of yourselves” can suggest an emphatic reflexive notion not present in the Greek.
  - severity: low
    issue: Footnote b contains interpretive wording beyond a lexical alternative.
    rationale: The phrase “na-achị mmadụ” (“that control a person”) is not required by ἡδονή and may narrow or intensify the semantic range.
  revised_text: Unu na-arịọ ma unu anaghị anata, n’ihi na unu na-arịọ n’ụzọ ọjọọ[a], ka unu wee jiri ya mee ihe ụtọ unu[b].
