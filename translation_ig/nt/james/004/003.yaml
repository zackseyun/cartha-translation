  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: ig
  text: Unu na-arịọ ma unu anaghị anata, n’ihi na unu na-arịọ n’ụzọ ọjọọ[a], ka unu wee jiri ya mee ihe ụtọ unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu ji ebumnobi ọjọọ arịọ,” ma okwu ahụ nwere ike ịpụta “n’ụzọ na-ezighị ezi” n’ozuzu ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n’ime ihe ụtọ unu.” “Ihe ụtọ” nwekwara ike ịpụta ọchịchọ ma ọ bụ agụụ nke afọ ojuju onwe onye.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: Unu na-arịọ
  rationale: Oge ugbu a na onye nke abụọ n’ọnụọgụ ọtụtụ na-egosi omume ịrịọ; “na-arịọ” bụ okwu Igbo doro anya ma kwekọọ na arịrịọ a na-arịọ onye a na-ekwughị aha ya.
- source_word: οὐ λαμβάνετε
  choice: unu adịghị anata
  rationale: “Anata” na-echekwa njikọ dị n’etiti ịrịọ na ịnata, ma nwee ugwu dabara n’amaokwu ahụ.
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara na ha anaghị anata ihe ha rịọrọ.
- source_word: κακῶς
  choice: n’ụzọ na-ezighị ezi
  rationale: Nke a na-echekwa echiche sara mbara nke ime ihe n’ụzọ ọjọọ ma ọ bụ na-ezighị ezi, n’ebughị ụzọ kpebie na okwu ahụ bụ naanị banyere ebumnobi.
- source_word: αἰτεῖσθε
  choice: unu na-arịọ
  rationale: Ikwugharị “na-arịọ” na-echekwa ntụnyere dị na Grik; olu etiti nke ngwaa ahụ achọghị ka a gbakwunye “maka onwe unu” n’ebe a.
- source_word: ἵνα
  choice: ka unu wee
  rationale: Ọ na-egosipụta nzube ha ji arịọ, n’asụsụ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
- source_word: δαπανήσητε
  choice: mefuo ihe unu nwetara
  rationale: “Mefuo” na-enye echiche nke itinye ihe n’ọrụ ruo mgbe ọ gwụrụ. E tinyere “ihe unu nwetara” iji mee ka ihe ngwaa ahụ na-ezo aka na ya doo anya n’Igbo, ebe Grik hapụrụ ya ka a ghọta ya site n’okwu gbara ya gburugburu.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: n’ihe ụtọ nke onwe unu
  rationale: “Ihe ụtọ” na-ejide isi echiche ἡδονή, ebe “nke onwe unu” na-egosi na ihe ndị a bụ ọchịchọ afọ ojuju onwe onye; nkọwa ala peeji na-echekwa ohere ịghọta ya dị ka ọchịchọ ma ọ bụ agụụ na-achị mmadụ.
theological_decisions:
- issue: Ma a ga-akpọpụta Chineke dịka onye ha na-arịọ
  choice: 'A hapụrụ onye a na-arịọghị aha ya: “Unu na-arịọ.”'
  alternative: “Unu na-arịọ Chineke.”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi ekpere, ma Grik akpọpụtaghị “Chineke” n’amaokwu a. Ịhapụ ya otú ahụ na-ezere ịgbakwunye okwu isi mmalite na-enweghị.
- issue: Ma κακῶς ga-abụ naanị okwu gbasara ebumnobi ọjọọ
  choice: “n’ụzọ na-ezighị ezi”
  alternative: “jiri ebumnobi ọjọọ”
  rationale: κακῶς sara mbara karịa ebumnobi naanị; nkebi sochirinụ na-akọwa nzube ọjọọ ha ji arịọ, ya mere e kwesịghị ime ka isi okwu ahụ dị warara.
- issue: Ma δαπανάω ga-asụgharị dịka imefusị ihe n’ụzọ a katọrọ nke ukwuu
  choice: “mefuo”
  alternative: “laa n’iyi” ma ọ bụ “fusịa”
  rationale: Ngwaa ahụ pụtara itinye ihe n’ọrụ ma ọ bụ imefu ya. Ọnọdụ okwu ahụ na-enye ya ụda ọjọọ, ma e kwesịghị ịgbakwunye ike nkatọ karịrị nke okwu Grik n’onwe ya chọrọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. A nọgidere n’ọnụọgụ ọtụtụ site n’iji “unu.” A zere ịkpọpụta Chineke ebe isi mmalite ahụ akpọpụtaghị ya, ma chekwaa obosara nke κακῶς na ἡδοναί site na isi ederede na nkọwa ala peeji.
