  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: ig
  text: Ugbu a, geenụ ntị, unu ndị na-ekwu sị, “Taa ma ọ bụ echi, anyị ga-aga n’obodo a[a], anyị ga-anọ ebe ahụ otu afọ, anyị ga-azụ ahịa, anyị ga-eritekwa uru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ikwu ya n’ụzọ na-adị mfe, “n’obodo dị otu a.” Ma n’asụsụ Grik, e kwuru “obodo a,” jiri okwu ngosi na-atụ aka n’otu obodo kpọmkwem dị n’atụmatụ ndị na-ekwu okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: Geenụ ntị ugbu a
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma kwụ ọtọ isi kpọọ ndị a na-agwa ka ha gee ntị n’ịdọ aka ná ntị; ọ na-echekwa ike nke okwu Grik ahụ.
- source_word: οἱ λέγοντες
  choice: unu ndị na-ekwu
  rationale: Nkebi okwu a na-arụ ọrụ dị ka ịkpọ ndị ahụ James na-agwa okwu ozugbo; “unu” na-eme ka ntụgharị ahụ bụrụ okwu a gwara ha kpọmkwem.
- source_word: Σήμερον ἢ αὔριον
  choice: Taa ma ọ bụ echi
  rationale: ἤ bụ njikọ na-egosi nhọrọ, ya mere “ma ọ bụ” na-echekwa ọdịiche dị n’etiti taa na echi.
- source_word: πορευσόμεθα
  choice: anyị ga-aga
  rationale: N’ebe a, ngwaa ahụ pụtara ịga; ntụgharị a dị mfe ma bụrụkwa Igbo nkịtị.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: n’obodo a
  rationale: τήνδε bụ okwu ngosi na-atụ aka n’otu obodo doro ndị na-ekwu anya; “n’obodo a” na-echekwa ngosipụta ahụ n’Igbo ebumpụta ụwa.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: nọrọ otu afọ n’ebe ahụ
  rationale: ποιέω tinyere oge n’ụdị a bụ akpaala okwu pụtara ịnọ ma ọ bụ iwepụta oge ahụ; “nọrọ otu afọ” na-ebupụta ihe ọ pụtara nke ọma.
- source_word: ἐμπορευσόμεθα
  choice: zụ ahịa
  rationale: Ngwaa a na-egosi ọrụ azụmahịa ma ọ bụ ịzụ ahịa; “zụ ahịa” bụ okwu Igbo a na-aghọta ngwa ngwa.
- source_word: κερδήσομεν
  choice: ritakwa uru
  rationale: N’ọnọdụ azụmahịa a, κερδαίνω na-ezo aka n’uru ego; “rita uru” na-egosipụta nke ahụ nke ọma.
theological_decisions:
- issue: Ụda nke ịba mba a gwara mmadụ ozugbo
  choice: “unu ndị na-ekwu” dị ka okwu a gwara ndị na-eme atụmatụ ahụ ozugbo
  alternative: “ndị na-ekwu” dị ka nkọwa banyere ha n’ụzọ na-abụghị ịkpọ ha ozugbo
  rationale: Articular participle οἱ λέγοντες na-arụ ọrụ vocative n’ebe a. Ịtinye “unu” na-echekwa esemokwu na ike nke ịdọ aka ná ntị James n’enweghị ịgbakwunye echiche otu ụka.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. “Geenụ ntị ugbu a” na-enye okwu mmeghe ahụ ike ịdọ aka ná ntị, ebe usoro ngwaa ndị na-esochi ya na-egosipụta ntụkwasị obi ndị ahịa ahụ nwere n’atụmatụ ha.
