  - severity: low
    issue: Opening word order is slightly stiff.
    rationale: “Ugbu a, geenụ ntị” is a more idiomatic Standard Igbo attention-getter while retaining the rebuking force of Ἄγε νῦν.
  - severity: low
    issue: The footnote’s phrase “n’ụzọ akpaala okwu” is imprecise for its stated alternative.
    rationale: The alternative “obodo dị otu a” is an idiomatic way of expressing a specified but unnamed city; the note should distinguish this from the Greek’s actual demonstrative, “obodo a.”
