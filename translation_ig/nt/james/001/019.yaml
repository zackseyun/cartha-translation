id: JAS.1.19
reference: James 1:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: ig
  text: 'Maranụ nke a[a], ụmụnna m ndị m hụrụ n’anya[b]: ka onye ọ bụla dị ngwa ige ntị, dị nwayọọ ikwu okwu, ghara ịdịkwa na-ewe iwe ọsọ ọsọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Unu maara nke a.” Ụdị ngwaa Grik ahụ nwere ike ịbụ nkwupụta kama ịbụ iwu.
    reason: alternative_reading
  - marker: b
    text: Okwu Grik ahụ pụtara “ụmụnna nwoke” (“brothers”), ma o yikarịrị ka Jemis na-agwa ọgbakọ ndị kwere ekwe niile okwu, ma ndị nwoke ma ndị nwanyị.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴστε
  choice: Marakwanụ nke a
  rationale: Ụdị ngwaa Grik a nwere ike ịbụ iwu (‘marakwanụ’) ma ọ bụ nkwupụta (‘unu maara’). A họọrọ iwu n’ihi na ọ dabara n’usoro ndụmọdụ na iwu ndị na-esochi ya; e tinyere ‘nke a’ ka okwu ahụ bụrụ nke Igbo na-aga were were.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: ụmụnna m ndị m hụrụ n’anya
  rationale: ‘Ụmụnna’ bụ okwu Igbo dị ebube ma bụrụkwa nke a na-aghọta nke ọma maka ndị otu okwukwe; ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị n’enweghị ịgbanwe ebumnuche okwu Grik ahụ.
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: ka onye ọ bụla dị
  rationale: ‘Ka ... dị’ na-egosipụta iwu onye nke atọ, ebe ‘onye ọ bụla’ na-enye ike izugbe nke πᾶς ἄνθρωπος n’Igbo nkịtị. Njikọ δέ dị nro, ya mere e gosighị ya dịka ‘ma’ nke nwere nnukwu mmegide.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: dị ngwa ịnụ ihe
  rationale: Nke a na-edobe ihe oyiyi nke ịdị ngwa n’ịnụ ma na-ada nke ọma n’Igbo; n’ebe a, ‘ịnụ ihe’ gụnyere ịṅa ntị n’ihe a na-ekwu.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: dị nwayọọ ikwu okwu
  rationale: Nke a bụ ntụgharị doro anya ma dị ebube nke echiche ịbụ onye na-adịghị eme ngwa ikwu okwu.
- source_word: βραδὺς εἰς ὀργήν
  choice: dịkwa nwayọọ iwe iwe
  rationale: Nkebiokwu Igbo a na-egosi mmadụ nke iwe na-adịghị abịara ngwa ngwa, na-enweghị ime ka ὀργή bụrụ naanị ọnụma ikpe ma ọ bụ iwe siri ike nke ukwuu.
theological_decisions:
- issue: Ma Ἴστε bụ iwu ka ọ bụ nkwupụta
  choice: 'A tụgharịrị ya dịka iwu: ‘Marakwanụ nke a.’'
  alternative: ‘Unu maara nke a.’
  rationale: Ụdị Grik ahụ n’onwe ya nwere ike ibu nkọwa abụọ ahụ. Usoro ndụmọdụ nke amaokwu ahụ kwadoro iwu, ma e debere nkọwa ọzọ n’ala peeji ka a ghara ikpochapụ mgbagwoju anya dị n’asụsụ mbụ.
- issue: Ndị ἀδελφοί na-ezo aka na ha
  choice: ‘Ụmụnna m’
  alternative: ‘Ụmụnne m ndị nwoke na ndị nwanyị’
  rationale: Ọ bụ ezie na ἀδελφοί bụ ụdị ọtụtụ nke nwoke na Grik, n’akwụkwọ ozi a o yikarịrị ka ọ na-akpọ ọgbakọ ndị kwere ekwe niile. ‘Ụmụnna’ na Standard Igbo na-arụ ọrụ nke ọma dịka okwu mmekọrịta nke nwere ike ịgụnye ha niile.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. E chekwara usoro ndụmọdụ atọ ahụ—ịdị ngwa ịnụ ihe, ịdị nwayọọ ikwu okwu, na ịdị nwayọọ iwe iwe—ka ụda na nhazi nke isi mmalite pụta ìhè.
