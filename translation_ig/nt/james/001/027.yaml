id: JAS.1.27
reference: James 1:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: ig
  text: 'Okpukpe dị ọcha, nke na-adịghị emerụ emerụ n’ihu Chineke, bụ́ Nna, bụ nke a: ilekọta ụmụaka na-enweghị nna na ndị inyom di ha nwụrụ n’ahụhụ ha[a], na idebe onwe onye ka ụwa ghara imetọ ya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịga leta ụmụaka na-enweghị nna na ndị inyom di ha nwụrụ n’ahụhụ ha.” Ngwaa Grik ahụ nwere ike ịgụnye ma ịga leta ha ma ilekọta ha n’omume.
    reason: lexical_alternative
  - marker: b
    text: “Ụwa” n’ebe a na-ezo aka n’usoro omume rụrụ arụ nke na-emegide Chineke, ọ bụghị n’ihe Chineke kere n’onwe ya.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: Okpukpe
  rationale: N’ebe a, okwu ahụ na-ezo aka n’omume ofufe na nsọpụrụ Chineke a na-ahụ anya; “okpukpe” bụ okwu Igbo kwụ ọtọ ma kwekọọ n’isiokwu Jems banyere okwukwe e ji omume egosi.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: nke dị ọcha, nke a na-emerụghịkwa emerụ
  rationale: Nke a na-edobe njikọ nke ịdị ọcha na enweghị mmetọ n’ụzọ doro anya ma dị ebube n’Igbo.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: n’ihu Chineke, bụ́ Nna
  rationale: “N’ihu” na-egosi nyocha ma ọ bụ nnabata n’anya Chineke; “Chineke, bụ́ Nna” na-edobe ohere na θεῷ na πατρὶ na-ekwu maka otu onye ahụ.
- source_word: ἐπισκέπτεσθαι
  choice: ilekọta
  rationale: Ngwaa Grik ahụ pụrụ ịgụnye ịga leta na ilekọta n’omume. N’ọnọdụ a, “ilekọta” na-egosi nlekọta bara uru karịa nanị ịga hụ mmadụ; a kọwara nghọta ọzọ n’okpuru ederede.
- source_word: ὀρφανοὺς
  choice: ụmụ na-enweghị nne na nna
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kọwaa ụmụaka ndị nne na nna ha anọghịzi ma ọ bụ ndị na-enweghị nchebe nne na nna.
- source_word: χήρας
  choice: ụmụanyị di ha nwụrụ
  rationale: Ọ bụ okwu Igbo a na-aghọta nke ọma maka ụmụanyị ndị di ha nwụrụ.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: n’ahụhụ ha
  rationale: “Ahụhụ” na-eburu ịdị arọ nke θλῖψις, nke nwere ike ịpụta mkpagbu, nsogbu, ma ọ bụ ọnọdụ nhụjuanya.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: idebe onwe onye ka ... ghara imetọ ya
  rationale: Usoro a na-eme ka ihe oyiyi nke izere ntụpọ omume pụta ìhè n’Igbo dị ndụ, ma “onwe onye” na-egosipụta iwu metụtara mmadụ niile.
- source_word: ἀπὸ τοῦ κόσμου
  choice: ka ụwa ghara imetọ ya
  rationale: A na-edobe “ụwa” n’ederede kama ịkọwa ya ozugbo dị ka usoro ajọ omume, ebe usoro ahịrịokwu Igbo na-egosi ụwa dị ka ebe mmetọ ahụ si abịa.
theological_decisions:
- issue: Ihe κόσμος (“ụwa”) pụtara n’ọnọdụ nkuzi omume a
  choice: Idowe “ụwa” n’ederede bụ isi, ma kọwaa n’okpuru ederede na ọ na-ezo aka n’usoro omume rụrụ arụ nke na-emegide Chineke.
  alternative: “ajọ omume nke ụwa” ma ọ bụ “usoro ụwa nke ugbu a”
  rationale: Nke a na-edobe okwu na esemokwu echiche dị n’isi mmalite, ma na-ezere ime ka ọ pụta na ihe Chineke kere n’onwe ya bụ ihe ọjọọ.
- issue: Ike izugbe nke ἑαυτόν
  choice: “onwe onye”
  alternative: “onwe ya” nke pụrụ ịdị ka ọ na-ekwu naanị banyere nwoke
  rationale: Ọ bụ ezie na ọdịdị Grik ya bụ otu onye nke okike nwoke, iwu omume a metụtara mmadụ niile; “onwe onye” na-egosi nke ahụ n’Igbo.
- issue: Mmekọrịta θεῷ καὶ πατρὶ
  choice: “Chineke, bụ́ Nna”
  alternative: “Chineke na Nna”
  rationale: Nhazi Grik nwere otu article, ya mere ọ dabara ka e were “Nna” dị ka aha nkọwa nke Chineke, ọ bụghị dị ka onye nke abụọ dị iche.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụda nkuzi na njikọ ihe atụ nke ịdị ọcha na mmetọ, n’enweghị itinye nkọwa otu ụka pụrụ iche.
