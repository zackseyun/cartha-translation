    text: A pụkwara ịsụgharị ya, “ịga leta ụmụaka na-enweghị nna na ndị inyom di ha nwụrụ n’ahụhụ ha.” Ngwaa Grik ahụ nwere ike ịgụnye ma ịga leta ha ma ilekọta ha n’omume.
    reason: lexical_alternative
  - marker: b
    text: “Ụwa” n’ebe a na-ezo aka n’usoro omume rụrụ arụ nke na-emegide Chineke, ọ bụghị n’ihe Chineke kere n’onwe ya.
    reason: cultural_note
  revision_rationale: The revision corrects the overbroad rendering of ὀρφανούς, replaces an unidiomatic repetition with natural Standard Igbo for “undefiled,” and regularizes the expression for widows. It preserves the draft’s faithful handling of practical care, generic self-reference, and the ethically charged but deliberately unexpanded sense of κόσμος.
