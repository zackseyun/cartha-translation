    text: Ma ọ bụ, “ihu ọmụmụ ya.” Nkebi okwu Grik ahụ, n’ụzọ nkịtị, bụ “ihu ọmụmụ ya,” ma ọ na-ekwu maka ihu mmadụ nwere kemgbe a mụrụ ya.
    reason: lexical_alternative
