id: JAS.1.23
reference: James 1:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: ig
  text: N’ihi na ọ bụrụ na onye ọ bụla bụ onye na-anụ okwu ahụ ma ọ bụghị onye na-eme ya, onye ahụ yiri nwoke na-eleru ihu ebumpụta ụwa ya[a] anya n’enyo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihu ọmụmụ ya.” Nkebi okwu Grik ahụ, n’ụzọ nkịtị, bụ “ihu ọmụmụ ya,” ma ọ na-ekwu maka ihu mmadụ nwere kemgbe a mụrụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς
  choice: onye na-anụ
  rationale: Nke a bụ ụzọ Igbo doro anya isi gosipụta aha onye na-ege ma chekwaa njikọ ya na ‘onye na-eme.’
- source_word: λόγου
  choice: okwu ahụ
  rationale: ‘Okwu’ bụ ntụgharị kpọmkwem nke λόγος; ‘ahụ’ na-eme ka ntụaka ya n’okwu a kpọtụrụla n’akụkụ amaokwu a doo anya n’Igbo n’etinyeghị nkọwa okpukpe ọzọ.
- source_word: ποιητής
  choice: onye na-eme ya
  rationale: Nke a na-egosipụta onye na-etinye okwu ahụ n’ọrụ ma na-edobe ọdịiche dị n’etiti ịnụ na ime n’Igbo eke.
- source_word: ἔοικεν
  choice: yiri
  rationale: ‘Yiri’ bụ okwu Igbo dị mfe ma kwekọọ n’echiche nke ntụnyere nwere ọnọdụ ugbu a.
- source_word: ἀνδρὶ
  choice: nwoke
  rationale: ἀνήρ bụ okwu kpọmkwem maka nwoke; ntụgharị a na-echekwa ụdị nwoke nke isi mmalite ahụ.
- source_word: κατανοοῦντι
  choice: na-eleru … anya
  rationale: Akpaalaokwu Igbo a na-egosi ile ihe nke ọma na nlebara anya, ọ bụghị ile ya naanị otu ntabi anya.
- source_word: τὸ πρόσωπον
  choice: ihu
  rationale: ‘Ihu’ bụ ntụgharị kpọmkwem ma kwekọọ n’onyonyo nke enyo.
- source_word: τῆς γενέσεως αὐτοῦ
  choice: ọmụmụ ya
  rationale: A hapụrụ njikọ genitive ahụ n’ụdị dị nso na Grik iji chekwaa okwu pụrụ iche ‘ihu ọmụmụ ya’; ihe odide ala peeji na-enye nghọta Igbo ka eke karịa.
- source_word: ἐν ἐσόπτρῳ
  choice: n’enyo
  rationale: ‘Enyo’ bụ okwu Igbo nke oge a, doro anya maka ihe mmadụ ji ahụ onyinyo ihu ya.
theological_decisions:
- issue: Asụsụ nnọchiteanya nwoke dị na ἀνδρὶ
  choice: nwoke
  alternative: mmadụ
  rationale: Ebe Grik jiri ἀνήρ, nke pụtara nwoke kpọmkwem, a chekwara ụdị nwoke ahụ kama ịgbanwe ya ka ọ bụrụ okwu izugbe; ọnọdụ ntụnyere ahụ ka na-enye ohere ka nkuzi ahụ metụta onye ọ bụla.
- issue: Ihe λόγος na-ezo aka na ya
  choice: okwu ahụ
  alternative: ozi ahụ; okwu Chineke
  rationale: A naghị agbakwụnye ‘Chineke’ ebe ọ na-adịghị na nkebi Grik a. ‘Okwu ahụ’ na-echekwa njikọ ya na amaokwu ndị gbara ya gburugburu n’enweghị imechi nghọta ahụ karịa isi mmalite.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji ‘na-eleru … anya’ mee ka nlebara anya dị na κατανοοῦντι pụta ìhè, ebe e debere ‘ihu ọmụmụ ya’ n’isi ederede iji chekwaa ụdị okwu Grik pụrụ iche ma kọwaa ya n’ala peeji.
