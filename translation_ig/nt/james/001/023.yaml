revisions:
- from: N’ihi na ọ bụrụ na onye ọ bụla bụ onye na-anụ okwu ahụ ma ọ bụghị onye na-eme ya, onye ahụ yiri nwoke na-eleru ihu ọmụmụ ya[a] anya n’enyo,
  to: N’ihi na ọ bụrụ na onye ọ bụla bụ onye na-anụ okwu ahụ ma ọ bụghị onye na-eme ya, onye ahụ yiri nwoke na-eleru ihu ebumpụta ụwa ya[a] anya n’enyo,
  rationale: The revision renders τὸ πρόσωπον τῆς γενέσεως αὐτοῦ as “ihu ebumpụta ụwa ya,” which clearly communicates the Greek idiom’s sense in modern Standard Igbo. The footnote preserves the literal source expression and explains it without adding doctrinal interpretation. All other elements of the draft are retained.
