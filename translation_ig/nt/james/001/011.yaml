id: JAS.1.11
reference: James 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: ig
  text: N’ihi na anyanwụ pụtara ya na okpomọkụ na-ere ọkụ[a], kpọọ ahịhịa nkụ; ifuru ya dapụrụ, ịma mma nke ọdịdị ya lara n’iyi. Otu ahụ kwa ka ọgaranya ga-akpọnwụ n’etiti ihe ndị ọ na-eme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ya na ifufe ọkụ”; okwu Grik καύσων pụrụ izo aka n’okpomọkụ na-ere ọkụ ma ọ bụ n’ifufe ọkụ na-eso ya.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’ime njem ya dị iche iche.” Okwu Grik ahụ pụrụ ịpụta njem, ma ọ bụ, n’echiche sara mbara, usoro ọrụ na nchụso mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: pụtara
  rationale: Okwu a na-egosi ọwụwa anyanwụ; ‘pụtara’ bụ ụzọ Igbo dị mfe ma kwekọọ n’ihe atụ a si akọ.
- source_word: σὺν τῷ καύσωνι
  choice: ji okpomọkụ ya na-achasi ike
  rationale: καύσων pụrụ ịpụta okpomọkụ na-ere ọkụ ma ọ bụ ifufe ọkụ; nsụgharị a dabara n’anya anyanwụ bụ isiokwu ma hapụkwa ụzọ ọzọ na nkọwa ala peeji.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: kpọnwụọ ahịhịa
  rationale: ‘Kpọnwụọ’ na-egosi kpọmkwem ihe okpomọkụ mere ahịhịa ma na-akwadebe ihe atụ nke ọgaranya ga-akpọnwụ.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: ifuru ya adapụ
  rationale: Nke a na-edebe onyinyo nkịtị nke ifuru si n’ahịhịa dapụ.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: ịma mma nke ọdịdị ya
  rationale: ‘Ọdịdị’ na-enye echiche πρόσωπον n’ebe a n’Igbo ebumpụta ụwa karịa ịkpọ ifuru ‘ihu,’ ma ‘ịma mma’ na-anọchi εὐπρέπεια nke ọma.
- source_word: ἀπώλετο
  choice: alakwa n’iyi
  rationale: Nkebiokwu a na-egosi na ịma mma ahụ efuola kpamkpam n’asụsụ Igbo dị ugwu ma doo anya.
- source_word: ὁ πλούσιος
  choice: ọgaranya
  rationale: Aha a na-egosi otu onye bara ọgaranya dịka onye nnọchianya, n’enweghị itinye nkọwa nwoke nke usoro aha Igbo anaghị achọ.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: n’etiti ihe ndị ọ na-eme
  rationale: πορείαις pụrụ ịbụ njem n’ụzọ nkịtị ma ọ bụ usoro ọrụ na nchụso mmadụ; okwu a na-egosipụta echiche sara mbara n’Igbo, ebe nkọwa ala peeji na-echekwa ihe ‘njem.’
- source_word: μαρανθήσεται
  choice: ga-akpọnwụ
  rationale: Nke a na-aga n’ihu n’onyinyo ahịhịa kpọrọ nkụ ma na-edebe nkwupụta ọdịnihu ahụ.
theological_decisions:
- issue: Ntuaka gbasara nwoke ma ọ bụ nwanyị n’okwu ὁ πλούσιος
  choice: ọgaranya
  alternative: nwoke bara ọgaranya
  rationale: Ọ bụ ezie na Grik ji ụdị okwu nwoke otu, Igbo ‘ọgaranya’ bụ aha ebumpụta ụwa maka otu onye ma anaghị agbanwe ihe ịdọ aka ná ntị ahụ ka ọ bụrụ naanị maka ụmụ nwoke.
- issue: Oke nghọta πορείαις n’ịdọ ọgaranya aka ná ntị
  choice: ihe ndị ọ na-eme
  alternative: njem ya
  rationale: A họọrọ echiche sara mbara nke ụzọ ndụ, ọrụ, na nchụso onye ahụ, ma echekwara nghọta nkịtị nke njem na nkọwa ala peeji ka e ghara ikpochapụ mgbagwoju okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A nọgidere n’onyinyo ahịhịa na ifuru na-akpọnwụ, ma tinye akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị nwere ụzọ nghọta ọzọ dị.
