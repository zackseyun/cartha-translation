review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s sequence and central vegetation metaphor, including the future warning to the rich. However, the opening construction makes the sun appear to rise by means of ‘its’ heat, whereas σὺν τῷ καύσωνι means that it rose together with scorching heat (with a possible hot-wind nuance). The verbal forms after this also need clear past-tense wording.
  naturalness: 'Several phrases are understandable but can be made more idiomatic Standard Igbo: ‘ji okpomọkụ ya na-achasi ike pụta’ is awkward, ‘ifuru ya adapụ’ does not clearly carry the Greek aorist sense, and the footnote marker for πορείαις should immediately follow its rendering rather than the sentence-ending punctuation.'
  terminology: ‘Ọgaranya’ is an appropriate natural Igbo representative singular for ὁ πλούσιος. ‘N’ime ihe ndị ọ na-eme’ suitably retains the broad activity/course sense of πορείαις without restricting it to commercial activity or literal travel. ‘Okpomọkụ na-ere ọkụ’ accurately renders καύσων while the note retains the hot-wind alternative.
  issues:
  - severity: medium
    issue: The phrase ‘anyanwụ ji okpomọkụ ya na-achasi ike pụta’ inaccurately/awkwardly construes σὺν τῷ καύσωνι.
    rationale: The Greek says that the sun rose ‘with scorching heat’; it does not specify that the heat is the sun’s own, nor does it naturally present the heat as the means by which it rose.
  - severity: medium
    issue: ‘ifuru ya adapụ’ is not a clear past-tense rendering of ἐξέπεσεν.
    rationale: 'The illustrative chain is expressed with aorist verbs: the sun rose, dried the grass, the flower fell, and its beauty disappeared. ‘dapụrụ’ clearly expresses the required completed event.'
  - severity: low
    issue: The [b] anchor is placed after the final period rather than directly after the rendering of πορείαις.
    rationale: Placing the marker after ‘ihe ndị ọ na-eme’ clearly identifies the lexical item to which the alternative ‘journeys’ refers.
  - severity: low
    issue: The footnote’s literal alternative gives singular ‘njem ya’ despite Greek plural πορείαις.
    rationale: The note should preserve the plural form where feasible, while acknowledging that the expression can idiomatically refer to one’s course of activity.
  revised_text: N’ihi na anyanwụ pụtara ya na okpomọkụ na-ere ọkụ[a], kpọọ ahịhịa nkụ; ifuru ya dapụrụ, ịma mma nke ọdịdị ya lara n’iyi. Otu ahụ kwa ka ọgaranya ga-akpọnwụ n’etiti ihe ndị ọ na-eme[b].
  revised_footnotes:
