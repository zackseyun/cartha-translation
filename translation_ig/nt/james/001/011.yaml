revisions:
- from: N’ihi na anyanwụ ji okpomọkụ ya na-achasi ike[a] pụta, kpọnwụọ ahịhịa; ifuru ya adapụ, ịma mma nke ọdịdị ya alakwa n’iyi. Otu a kwa, ọgaranya ga-akpọnwụ n’etiti ihe ndị ọ na-eme.[b]
  to: N’ihi na anyanwụ pụtara ya na okpomọkụ na-ere ọkụ[a], kpọọ ahịhịa nkụ; ifuru ya dapụrụ, ịma mma nke ọdịdị ya lara n’iyi. Otu ahụ kwa ka ọgaranya ga-akpọnwụ n’etiti ihe ndị ọ na-eme[b].
  rationale: The revision makes the opening syntax faithful to σὺν τῷ καύσωνι, uses unambiguous past-tense verbs throughout the illustrative description, preserves the flower’s outward beauty through ‘ọdịdị,’ and relocates the lexical-alternative anchor to πορείαις. It retains the broad, non-doctrinal sense of the rich person’s ongoing activities and preserves the literal journey sense in the note.
  reviewer_model: gpt-5.6-terra
