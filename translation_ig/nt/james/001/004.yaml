id: JAS.1.4
reference: James 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: ig
  text: Ka ntachi obi rụzuo ọrụ ya n'ụzọ zuru oke[a], ka unu wee bụrụ ndị tozuru oke na ndị zuru ezu, ghara ịdị ụkọ n'ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “rụpụta ọrụ zuru oke.” Okwu Grik ndị e ji mee ihe n'amaokwu a nwere njikọ n'echiche nke iru ọgwụgwụ e bu n'obi na ịbụ onye zuru ezu n'akụkụ niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: ntachi obi
  rationale: N'ọnọdụ ọnwụnwa a na-ekwu maka ya, “ntachi obi” na-egosi ịnọgide na-eguzosi ike ma na-edi ihe siri ike; ọ bụghị nanị ichere nwayọọ.
- source_word: ἔργον τέλειον ἐχέτω
  choice: ka ... rụzuo ọrụ ya n'ụzọ zuru oke
  rationale: Nkebi a bụ iwu ka ntachi obi gaa n'ihu ruo mgbe ọrụ ya mezuru ebumnuche ya. Nsụgharị a bụ Igbo nkịtị ma na-edobe echiche nke ἔργον na τέλειον.
- source_word: ἵνα ἦτε
  choice: ka unu wee bụrụ
  rationale: Nke a na-egosi nzube ma ọ bụ ihe ga-esi na ọrụ ntachi obi pụta.
- source_word: τέλειοι
  choice: ndị tozuru oke
  rationale: Mgbe a na-ekwu maka mmadụ, okwu a nwere ike ịpụta iru ntozu e bu n'obi, na-enweghị ịmanye ya ka ọ pụta enweghị mmehie kpamkpam.
- source_word: ὁλόκληροι
  choice: ndị zuru ezu
  rationale: Okwu a na-emesi izu oke n'akụkụ niile ike ma na-anọgide dị iche ntakịrị na “ndị tozuru oke.”
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: ghara ịdị ụkọ n'ihe ọ bụla
  rationale: 'Nke a na-edobe ike zuru ụwa ọnụ nke ἐν μηδενί: ha agaghị enwe akụkụ ọ bụla ha na-erughị eru na ya.'
- source_word: δὲ
  choice: Ka
  rationale: N'okwu Igbo a, njikọ ahụ pụtara site n'ịga n'ihu n'iwu sitere n'amaokwu bu ụzọ; itinye “ma” nwere ike ime ka ọdịiche ahụ sie ike karịa ka isi Grik chọrọ.
theological_decisions:
- issue: Ihe τέλειοι pụtara n'okwu banyere uto ime mmụọ
  choice: ndị tozuru oke
  alternative: ndị zuru oke
  rationale: “Ndị tozuru oke” na-egosi iru nzube na ntozu ime mmụọ, ma ọ naghị ekpebi esemokwu ahụ dị ka nkwupụta na mmadụ enweghịzi mmehie. E debere “ndị zuru ezu” maka ὁλόκληροι ka ọdịiche okwu abụọ ahụ ghara ifunahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ntachi obi,” “tozuru oke,” na “zuru ezu” bụ okwu ndị nkịtị ga-aghọta, ebe usoro ahịrịokwu ahụ na-edobe iwu na nzube dị n'isi Grik.
