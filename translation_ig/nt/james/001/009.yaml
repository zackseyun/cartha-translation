  text: Καυχάσθω δὲ ὁ ἀδελφὸς ὁ ταπεινὸς ἐν τῷ ὕψει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: ig
  text: Ma ka nwanna ahụ nọ n’ọnọdụ dị ala nya isi n’ihi ịdị elu ya[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ahụ bụ “nwanna nwoke” n’ụdị otu onye; n’ebe a, ọ pụrụ ịnọchite anya onye otu okwukwe, nwoke ma ọ bụ nwanyị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ọnọdụ ya dị elu.” Nke a nwere ike izo aka n’ọkwa nsọpụrụ onye ahụ nwere n’ihu Chineke, ma hapụkwa ohere maka mgbanwe ọnọdụ ugbu a ma ọ bụ n’ọdịnihu.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: ka ... nya isi
  rationale: Nke a na-egosipụta iwu agbamume dị na ụdị ngwaa Grik, ma na-echekwa echiche nke ịnya isi kama ime ka ọ dị nro dịka naanị ịṅụrị ọṅụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche ma ọ bụ ntụgharị gaa n'okwu abụọ na-emegide onwe ha banyere onye nọ n'ọnọdụ dị ala na ọgaranya.
- source_word: ὁ ἀδελφὸς
  choice: nwanna ahụ
  rationale: “Nwanna” bụ okwu Igbo sitere n'okike nke nwere ike ịpụta onye otu okwukwe; ọ naghị amanye okike nwoke n'ụzọ siri ike dịka Grik, ya mere e tinyere nkọwa n'okpuru.
- source_word: ὁ ταπεινὸς
  choice: nọ n'ọnọdụ dị ala
  rationale: Nke a na-echekwa echiche nke ọnọdụ mmekọrịta mmadụ na akụ na ụba dị ala, ma ọ naghị ekpebi ya dịka naanị ịda ogbenye ma ọ bụ ịdị umeala n'obi.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: jiri mbuli e buliri ya
  rationale: Nkebiokwu a na-egosipụta ịdị elu ma ọ bụ nsọpụrụ e nyere ya, ma na-ahapụ ohere ma ọ bụ ọnọdụ ya n'ihu Chineke ugbu a, ma ọ bụ mgbanwe ga-eme n'ọdịnihu.
theological_decisions:
- issue: Ihe “ịdị elu” nke onye nọ n'ọnọdụ dị ala pụtara
  choice: Mbuli ma ọ bụ nsọpụrụ e buliri onye ahụ, n'ebughị ụzọ kpebie ma ọ bụ nke ugbu a, nke mmụọ, ma ọ bụ nke ọdịnihu.
  alternative: ọnọdụ ya dị elu; nsọpụrụ ya n'ihu Chineke; mbuli ya n'ọdịnihu
  rationale: Ọnọdụ okwu ahụ na-egosi mgbanwe ọnọdụ n'etiti onye dị ala na ọgaranya. Nsụgharị ahụ na-echekwa obosara na mgbagwoju echiche a.
- issue: Ụdị okike nke ἀδελφός
  choice: “nwanna ahụ” n'ahịrị okwu, tinyere nkọwa na Grik bụ aha nwoke otu onye ma nwee ike ịnọchite anya onye kwere ekwe.
  alternative: nwanne nwoke ahụ; onye otu okwukwe ahụ
  rationale: “Nwanna” bụ okwu Igbo nkịtị ma dị ùgwù maka onye otu obodo okwukwe, ebe nkọwa na-eme ka ọdịdị Grik pụta ìhè n'enweghị Igbo na-adịghị eke ụwa.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, dị ùgwù ma doo anya. “Nọ n'ọnọdụ dị ala” na-ezere ịkọwa ταπεινός naanị dịka ịda ogbenye ma ọ bụ ịdị umeala n'obi; “mbuli e buliri ya” na-echekwa asụsụ mgbanwe ọnọdụ dị na ὕψος.
