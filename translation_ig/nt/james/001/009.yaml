revisions:
- from: Ma ka nwanna ahụ nọ n'ọnọdụ dị ala jiri mbuli e buliri ya[a][b] nya isi,
  to: Ma ka nwanna ahụ nọ n’ọnọdụ dị ala nya isi n’ihi ịdị elu ya[a][b],
  rationale: The revision removes the added passive formulation and its repetition, rendering the Greek prepositional phrase directly as “n’ihi ịdị elu ya.” This retains the intended ambiguity between honored status, present reversal, and future exaltation. The gender note is reshaped as an explanatory source-language note rather than presenting a misleading Igbo alternative.
