  text: a double-minded man[a], unstable in all his ways.
translation:
  language: ig
  text: Nwoke onye obi ya kewara ekewa, onye na-adịghị eguzosi ike n’ụzọ ya niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνὴρ
  choice: nwoke
  rationale: Okwu Grik a bụ aha nwoke n’ọnụọgụ otu. N’ebe a, ọ na-anọchi anya onye ọ bụla na-arịọ arịrịọ ahụ e kwuru okwu ya n’amaokwu bu ụzọ; ya mere, e debere ọdịdị nwoke nke okwu ahụ n’ahịrị bụ isi, ma kọwaa n’ala peeji na ihe ọ pụtara abụghị naanị ụmụ nwoke.
- source_word: δίψυχος
  choice: obi ya kewara abụọ
  rationale: N’ụzọ nkịtị, okwu Grik a na-enye echiche nke mmadụ nwere ‘mkpụrụ obi abụọ.’ Akpaokwu Igbo a na-egosi nkewa dị n’ime mmadụ na nkwụsi ike ya na-adịghị zuru ezu, n’enweghị ntụgharị siri ike ma ọ bụ nke na-adịghị ada ka Igbo nkịtị.
- source_word: ἀκατάστατος
  choice: onye na-adịghị eguzosi ike
  rationale: Nhọrọ a na-egosi enweghị nkwụsi ike na enweghị ntụkwasị obi n’omume, bụ́ isi echiche okwu Grik ebe a. Ọ naghị eme ka okwu ahụ bụrụ naanị ọgba aghara n’usoro ọha.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: n'ụzọ ya niile
  rationale: ‘Ụzọ’ na-arụ ọrụ nke ọma n’Igbo dịka ihe atụ nke ndụ na omume mmadụ dum, ma na-edobekwa ihe oyiyi dị n’okwu Grik karịa ịsụgharị ya naanị dịka ‘omume.’
theological_decisions:
- issue: Asụsụ nwoke nke na-anọchi anya mmadụ niile
  choice: E debere ‘nwoke’ n’ahịrị bụ isi.
  alternative: ‘onye obi ya kewara abụọ, onye na-adịghị eguzosi ike n'ụzọ ya niile’
  rationale: Grik ji aha nwoke n’ọnụọgụ otu, ma n’ọnọdụ a ọ na-anọchi anya onye ọ bụla nọ n’ọnọdụ ahụ. Nhọrọ a na-echekwa ọdịdị okwu mbụ, ebe nkọwa ala peeji na-eme ka o doo anya na ihe ọ pụtara ejedebeghị naanị n’ebe ụmụ nwoke nọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. Akpaokwu ‘obi ya kewara abụọ’ bụ okwu ebumpụta ụwa nke na-echekwa echiche nkewa dị n’ime mmadụ; ‘n'ụzọ ya niile’ na-echekwa ihe atụ nke ụzọ ndụ dị n’Grik.
