revisions:
- from: nwoke obi ya kewara abụọ[a], onye na-adịghị eguzosi ike n'ụzọ ya niile.
  to: Nwoke onye obi ya kewara ekewa, onye na-adịghị eguzosi ike n’ụzọ ya niile.
  rationale: The revision preserves the masculine singular representative wording of ἀνήρ and the figurative scope of “ụzọ ya niile.” It replaces the less natural “obi ya kewara abụọ” with “obi ya kewara ekewa,” a clearer Standard Igbo expression for δίψυχος, and adds “onye” for natural syntax. The footnote is retained and aligned with the revised wording.
