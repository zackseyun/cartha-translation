  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: ig
  text: Were ya dị ka ọṅụ zuru ezu, ụmụnna m[a], mgbe ọ bụla unu dabara n’ọnwụnwa dị iche iche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna m” dị n’ụdị nwoke, ma o yiri ka ọ na-akpọ ndị kwere ekwe niile okwu—ụmụ nwoke na ụmụ nwanyị.
    reason: alternative_reading
  - marker: b
    text: Okwu Grik a nwere ike ịpụta “ọnwụnwa,” “ule,” ma ọ bụ, n’ọnọdụ ụfọdụ, ihe na-adọta mmadụ ime mmehie. N’ebe a, ọ kacha egosi ihe isi ike si n’èzí nke na-anwale okwukwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: ọṅụ zuru ezu
  rationale: Nkebiokwu a bụ ihe e ji mezue ngwaa ἡγήσασθε. “Ọṅụ zuru ezu” na-egosi ịdị ukwuu na izu oke nke ọṅụ a na-ekwu maka ya, ma ọ naghị eme ka ọ pụta na nsogbu ahụ n’onwe ya bụ ihe na-atọ ụtọ.
- source_word: ἡγήσασθε
  choice: Were ya dị ka
  rationale: Nke a na-enye iwu ka ndị a na-agwa okwu nyochaa ma were ọnọdụ ahụ n’ụzọ ụfọdụ. Ọ bụ Igbo dị ugbu a ma na-edobe ike nke iwu ahụ.
- source_word: ἀδελφοί μου
  choice: ụmụnna m
  rationale: “Ụmụnna m” bụ okwu nkwanye ùgwù a na-ejikarị akpọ ndị otu okwukwe n’Igbo. Ọ nwere ike ịgụnye ndị nwoke na ndị nwanyị, ebe okwu Grik ahụ dị n’ụdị nwoke; nkọwa dị n’ala peeji na-eme ka nke a doo anya.
- source_word: ὅταν
  choice: mgbe ọ bụla
  rationale: Ya na περιπέσητε nke dị na subjunctive, ὅταν na-egosi oge na-abụghị otu oge a kapịrị ọnụ—ya bụ, mgbe ọ bụla ihe ahụ mere.
- source_word: πειρασμοῖς
  choice: ọnwụnwa
  rationale: “Ọnwụnwa” nwere ike ịpụta ihe isi ike nke na-anwale okwukwe, ma n’ọnọdụ ụfọdụ ọ pụkwara ịpụta ihe na-adọta mmadụ ime mmehie. N’ebe a, ihe ndị si n’èzí na-anwale okwukwe ka ihe gbara ya gburugburu na-egosi.
- source_word: περιπέσητε
  choice: unu dabara n’
  rationale: “Dabara n’” na-edobe ihe atụ doro anya nke ngwaa Grik ahụ—ịdaba n’ime ọnọdụ mmadụ na-atụghị anya ya—ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: ποικίλοις
  choice: dị iche iche
  rationale: Nke a na-egosi na ọnwụnwa ndị ahụ nwere ụdị dịgasị iche iche, kwekọrọ n’ọtụtụ ụdị nke ποικίλοις.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-akpọ naanị ndị nwoke, ka ọ na-akpọ ọgbakọ ndị kwere ekwe niile
  choice: Jiri “ụmụnna m” n’ahịrịokwu ahụ ma kọwaa n’ala peeji na o nwere ike ịgụnye ndị nwoke na ndị nwanyị.
  alternative: ụmụnne m, ndị nwoke na ndị nwanyị
  rationale: Ụdị okwu Grik ahụ bụ nke nwoke, ma ụdị ịkpọ mmadụ a n’akwụkwọ ozi na-adịkarị ka ọ na-agwa ọgbakọ dum okwu. “Ụmụnna m” na-edobe olu nke okwu ahụ n’Igbo na-enweghị itinye nkọwa sara mbara n’ahịrịokwu ahụ.
- issue: Ma πειρασμοῖς ọ pụtara ọnwụnwa na-adọta mmadụ ná mmehie, ka ọ bụ ihe isi ike na-anwale okwukwe
  choice: N’ebe a, ghọta ya dị ka ihe isi ike dị iche iche na-anwale okwukwe.
  alternative: ihe na-adọta mmadụ ime mmehie
  rationale: Amaokwu na-esochi na-ekwu maka nnwale nke okwukwe, ebe Jems 1:13 kewapụrụ echiche nke ịbụ onye a na-adọta ime ihe ọjọọ. Ma n’ihi na otu okwu Grik ahụ nwere nghọta abụọ ahụ, e debere nke ọzọ na nkọwa ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro isi echiche Grik—iwu “Were ya…” buru ụzọ—ma jiri “mgbe ọ bụla” gosipụta oge na-abụghị otu ihe omume a kapịrị ọnụ. Akara nkọwa [a] dị n’akụkụ “ụmụnna m,” ebe ọ bụ okwu nkọwa ahụ metụtara; [b] dị n’akụkụ “ọnwụnwa dị iche iche.”
