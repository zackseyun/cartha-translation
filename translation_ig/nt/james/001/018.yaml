revisions:
- from: Ebe ọ bụ na o kpebiri ime ya[a], o ji okwu nke eziokwu mụọ anyị, ka anyị wee bụrụ ụdị mkpụrụ mbụ n’etiti ihe ndị o kere.[b]
  to: N’ihi ọchịchọ nke aka ya[a], o ji okwu nke eziokwu mụọ anyị, ka anyị wee bụrụ ụdị mkpụrụ mbụ[b] n’ime ihe ndị o kere.
  rationale: The revision removes the added and vague “ime ya,” expresses βουληθείς as God’s own volition, and renders the partitive force of τῶν αὐτοῦ κτισμάτων more closely with “n’ime.” It also moves the explanatory footnote marker to the term it explains. No doctrinal interpretation beyond the source is added.
