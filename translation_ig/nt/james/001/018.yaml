  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: ig
  text: N’ihi ọchịchọ nke aka ya[a], o ji okwu nke eziokwu mụọ anyị, ka anyị wee bụrụ ụdị mkpụrụ mbụ[b] n’ime ihe ndị o kere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “N’uche nke aka ya, o ji okwu nke eziokwu mụọ anyị.”'
    reason: alternative_reading
  - marker: b
    text: “Mkpụrụ mbụ” na-echetara akụkụ mbụ nke owuwe ihe ubi a na-ewepụta nye Chineke; n’ebe a, ọ na-akọwa ndị kwere ekwe dịka akụkụ mbụ e doro nsọ n’ime ihe ndị Chineke kere.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: Ebe ọ bụ na o kpebiri ime ya
  rationale: Nkebi ahịrị a na-egosi na uche na mkpebi Chineke butere ihe o mere. Nsụgharị a na-eme ka ihe kpatara omume ahụ pụta ìhè n’Igbo nkịtị, n’etinyeghị ozizi pụrụ iche n’ime ya.
- source_word: ἀπεκύησεν
  choice: o ... mụọ anyị
  rationale: Okwu Grik a na-eji ihe oyiyi ịmụ nwa eme ihe, dịkwa mkpa ka e debe ya n’ihi njikọ ya na Jemis 1:15. ‘Mụọ anyị’ bụ okwu Igbo dị nkenke ma doo anya nke na-edebe ihe oyiyi ahụ.
- source_word: λόγῳ ἀληθείας
  choice: ji okwu nke eziokwu
  rationale: ‘Ji’ na-egosi ụzọ ma ọ bụ ihe e ji mee ihe, dịka dative Grik si arụ ọrụ ebe a. ‘Okwu nke eziokwu’ na-edebe usoro okwu ahụ ma na-enye ohere ka a ghọta ya dịka ozi eziokwu.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: ka anyị wee bụrụ
  rationale: Nke a na-egosi ebumnuche ma ọ bụ nsonaazụ e bu n’obi, n’ụzọ dị mma ma bụrụkwa nke a na-asụkarị n’Igbo.
- source_word: ἀπαρχήν
  choice: mkpụrụ mbụ
  rationale: ‘Mkpụrụ mbụ’ na-edebe ihe atụ nke akụkụ mbụ nke owuwe ihe ubi, nke a na-ewepụta nye Chineke, kama ịgbanwe ya ka ọ bụrụ nkọwa nkịtị.
- source_word: τινα
  choice: ụdị
  rationale: Okwu a na-eme ka ihe atụ ahụ ghara ịdị ka njirimara zuru oke; ‘ụdị’ na-egosipụta echiche ‘a kind of’ n’Igbo ebumpụta ụwa.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: n’etiti ihe ndị o kere
  rationale: Nkebi a na-edebe ọtụtụ ihe κτισμάτων na oke ya sara mbara, na-emeghị ka ọ bụrụ naanị ụmụ mmadụ. ‘N’etiti’ na-eme ka mmekọrịta nke mkpụrụ mbụ na ihe ndị ọzọ e kere eke doo anya n’Igbo.
theological_decisions:
- issue: Mmalite sitere n’aka Chineke n’ịmụ ọhụrụ
  choice: E gosipụtara mkpebi Chineke dịka ihe butere ịmụ anyị, ma a kọwaghị ya site n’usoro ozizi otu ụka.
  alternative: ‘Site n’uche nke aka ya, ọ mụtara anyị’ ma ọ bụ nsụgharị na-akpọ nke a ozugbo ‘ịmụ ọzọ.’
  rationale: Grik na-ebute uche Chineke ụzọ tupu omume ahụ, ma amaokwu ahụ akọwaghị usoro ozizi zuru ezu banyere akara aka ma ọ bụ ịmụ ọzọ.
- issue: Oke ihe κτισμάτων na-ezo aka na ya
  choice: ihe ndị o kere
  alternative: ‘ụmụ mmadụ ndị o kere’ ma ọ bụ ‘ihe niile o kere.’
  rationale: Okwu Grik ahụ sara mbara ma dị n’ụdị ọtụtụ; nsụgharị a anaghị emechi ya ka ọ bụrụ naanị ụmụ mmadụ, ma ọ naghị agbakwụnye ‘niile’ nke na-adịghị n’ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ihe oyiyi ịmụ nwa na mkpụrụ mbụ ka ha dị, ma zere okwu ụka pụrụ iche. E debere akara ndetu [a] na [b] n’ederede bụ isi.
