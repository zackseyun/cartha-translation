id: JAS.1.5
reference: James 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: ig
  text: Ma ọ bụrụ na onye ọ bụla n’ime unu enweghị amamihe, ya rịọ Chineke, onye na-enye mmadụ niile n’ụba, na-enweghịkwa ịkọcha ha[a]; a ga-enyekwa ya amamihe ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-achọtaghị ha mmejọ.”
    reason: lexical_alternative
  - marker: b
    text: Grik ji ụdị onye otu nke nwoke mee ihe n’ụzọ na-anọchi anya onye ọ bụla n’ime unu. Nnọchiaha Igbo “ya” anaghị ekewa nwoke na nwanyị.
    reason: cultural_note
lexical_decisions:
- source_word: Εἰ δέ
  choice: Ma ọ bụrụ na
  rationale: “Ma” na-egosi njikọ na obere mgbanwe sitere n’amaokwu bu ụzọ, n’emeghị ka ọ bụrụ nnukwu esemokwu.
- source_word: τις ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: Nke a na-egosipụta onye ọ bụla n’etiti ndị a na-agwa okwu ma na-edobe okwu ahụ dị ka adreesị kpọmkwem.
- source_word: λείπεται σοφίας
  choice: enweghị amamihe
  rationale: Nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa si kwuo na amamihe kọrọ mmadụ, n’emeghị ka ihe σοφία pụtara dị warara karịa Grik.
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: ya rịọ Chineke
  rationale: Ụdị a na-egosipụta iwu onye nke atọ na arịrịọ a na-arịọ Chineke, ma zere ntụgharị siri ike nke παρά nke na-agaghị ada ka Igbo ebumpụta ụwa.
- source_word: τοῦ διδόντος θεοῦ πᾶσιν
  choice: Chineke, onye na-enye mmadụ niile
  rationale: Ọ na-edobe participle ahụ dịka nkọwa banyere Chineke ma na-ahapụ πᾶσιν n’ogo sara mbara ya.
- source_word: ἁπλῶς
  choice: n’ụba
  rationale: N’ebe a okwu ahụ na-akọwa mmesapụ aka Chineke n’inye ihe; “n’ụba” na-ekwupụta inye n’enweghị aka ntagide.
- source_word: μὴ ὀνειδίζοντος
  choice: na-enweghịkwa ịkọcha ha
  rationale: “Ịkọcha” na-eburu echiche nke ịba mmadụ mba ma ọ bụ ime ya ihere, nke dabara na ὀνειδίζω.
- source_word: δοθήσεται αὐτῷ
  choice: a ga-enyekwa ya amamihe ahụ
  rationale: A na-edobe ọdịdị passive nke nkwa ahụ, ma a kpọghachiri “amamihe” n’aha iji zere ngwakọta nnọchiaha na Igbo.
theological_decisions:
- issue: Nnọchiaha onye otu nke na-anọchi anya mmadụ ọ bụla
  choice: onye ọ bụla ... ya
  alternative: onye ahụ ... ya
  rationale: Grik ji onye otu mee ihe n’ụzọ na-anọchi anya onye ọ bụla. Igbo “ya” anaghị egosi nwoke ma ọ bụ nwanyị, ya mere ọ na-edobe onye otu ahụ na-enweghị ịtinye okike na-adịghị apụta n’usoro nnọchiaha Igbo.
- issue: Ihe ἁπλῶς pụtara banyere inye Chineke
  choice: n’ụba
  alternative: n’obi na-enweghị nkewa; n’enweghị ihe ọzọ n’obi
  rationale: N’ọnọdụ arịrịọ maka amamihe, echiche kacha kwesị ekwesị bụ na Chineke na-enye n’ụzọ mmesapụ aka. A naghị etinye echiche gbasara akụnụba ma ọ bụ nkwa ihe onwunwe n’ime ya.
- issue: Nkwa dị na δοθήσεται
  choice: a ga-enyekwa ya amamihe ahụ
  alternative: ọ ga-enwetakwa amamihe ahụ
  rationale: A họọrọ passive iji debe otú Grik si lekwasị anya n’ihe a ga-enye, n’agbanyeghị na o doro anya site n’ahịrịokwu ahụ na Chineke bụ onye na-enye ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. “N’ụba” na-enye echiche nke mmesapụ aka n’ụzọ ebumpụta ụwa; “ịkọcha” na-edobe echiche nke ịba mmadụ mba ma ọ bụ ime ya ihere. E tinyere akara nkọwa ala peeji [a] n’ebe okwu ὀνειδίζω dị, ebe [b] nọ na ngwụcha nkwa gbasara onye otu ahụ.
