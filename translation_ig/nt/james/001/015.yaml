revisions:
- from: Mgbe ahụ, ọchịchọ ọjọọ, mgbe ọ tụụrụ ime, na-amụpụta mmehie; mmehie ahụkwa, mgbe o tozuru oke[a], na-amụpụta ọnwụ.
  to: Mgbe ahụ, ọchịchọ, mgbe ọ tụụrụ ime, na-amụ mmehie; mmehie ahụkwa, mgbe o tozuru oke[a], na-amụ ọnwụ.
  rationale: The revision removes the added qualifier "ọjọọ" so that ἐπιθυμία remains "ọchịchọ," as in the source, without denying its negative contextual role. It also uses the direct birth verb "na-amụ" in both clauses to preserve the tightly sustained conception-and-birth metaphor. The maturity/completion footnote remains correctly anchored after "oke."
