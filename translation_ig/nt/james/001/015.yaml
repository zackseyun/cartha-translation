id: JAS.1.15
reference: James 1:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: ig
  text: Mgbe ahụ, ọchịchọ, mgbe ọ tụụrụ ime, na-amụ mmehie; mmehie ahụkwa, mgbe o tozuru oke[a], na-amụ ọnwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe e mezuru ya,” ma ọ bụ “mgbe o ruru ntozu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Mgbe ahụ
  rationale: Na-egosi usoro ihe na-aga n’ihu site n’ọnwụnwa ruo n’ọnwụ, n’Igbo dị mfe ma doo anya.
- source_word: ἐπιθυμία
  choice: ọchịchọ ọjọọ
  rationale: “Ọchịchọ” naanị nwere ike ịbụ nke ọma ma ọ bụ nke ọjọọ n’Igbo; ihe gbara okwu a gburugburu na-egosi ọchịchọ na-adọ mmadụ baa ná mmehie. Nke a adịghị eme ka ọ bụrụ naanị agụụ mmekọahụ.
- source_word: συλλαβοῦσα
  choice: mgbe ọ tụụrụ ime
  rationale: Na-echekwa ihe atụ nke ịtụrụ ime ma na-egosi na ịtụrụ ime buru ụzọ tupu ịmụpụta mmehie.
- source_word: τίκτει
  choice: na-amụpụta
  rationale: Na-echekwa ihe atụ nke ịmụ nwa, ma na-ada nke ọma mgbe ihe a na-ekwu banyere ya bụ mmehie.
- source_word: ἁμαρτίαν
  choice: mmehie
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka omume ọjọọ megide uche Chineke.
- source_word: δὲ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” n’“mmehie ahụkwa” na-aga n’ihu n’usoro ahụ n’enweghị ime ka ọ bụrụ nnukwu ọdịiche.
- source_word: ἀποτελεσθεῖσα
  choice: mgbe o tozuru oke
  rationale: Na-egosi mmezu ma ọ bụ iru ntozu n’ime ihe atụ nke ndụ na uto, ma na-ahapụkwa nkọwa nkịtị “mgbe e mezuru ya” n’ala ala peeji.
- source_word: ἀποκύει
  choice: na-amụpụta
  rationale: Na-echekwa otu ihe atụ ahụ nke ịmụ nwa; ikwughachi okwu ahụ n’Igbo na-eme ka njikọ dị n’etiti ọchịchọ, mmehie, na ọnwụ pụta ìhè.
- source_word: θάνατον
  choice: ọnwụ
  rationale: Nsụgharị kwụ ọtọ nke na-adịghị ekpebi ma ọ bụ ọnwụ anụ ahụ, nke mmụọ, ka ọ bụ nke ebighị ebi.
theological_decisions:
- issue: Ihe atụ nke jikọtara ọchịchọ, mmehie, na ọnwụ
  choice: 'E chekwara ihe atụ nke ịtụrụ ime na ịmụpụta: ọchịchọ ọjọọ tụụrụ ime ma mụọpụta mmehie, mmehie amụpụtakwa ọnwụ.'
  alternative: Ịsị naanị na ọchịchọ na-eduga ná mmehie, mmehie edugakwa n’ọnwụ.
  rationale: Ịgbanwe ya ka ọ bụrụ naanị usoro ihe na-akpata ibe ya ga-eme ka ike na ọdịdị ihe atụ Grik ahụ daa.
- issue: Ihe θάνατος pụtara
  choice: ọnwụ
  alternative: ọnwụ nke mmụọ; ọnwụ ebighị ebi; ọnwụ anụ ahụ
  rationale: Akwụkwọ Grik akọwaghị ụdị ọnwụ ọ bụ; ya mere nsụgharị ahụ ekwesịghị ịgbakwunye nkọwa ozizi nke ederede ahụ ekwughị.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ọchịchọ ọjọọ” mee ka ihe okwu ahụ pụtara n’ọnọdụ a doo anya n’enweghị ime ka ọ bụrụ naanị agụụ mmekọahụ. E chekwara ihe atụ nke ịtụrụ ime na ịmụ nwa. Akara ala ala peeji [a] dị n’ederede isi.
