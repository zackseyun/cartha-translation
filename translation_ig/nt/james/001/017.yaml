revisions:
- from: Ezi ihe ọ bụla a na-enye na onyinye ọ bụla zuru oke si n’elu bịa[a], na-esite n’aka Nna nke ìhè dị iche iche abịada; n’ebe ọ nọ, mgbanwe ma ọ bụ onyinyo nke ntụgharị adịghị.[b]
  to: Onyinye ọma ọ bụla na onyinye zuru oke ọ bụla si n’elu, na-abịadata site n’aka Nna nke ìhè. N’ebe ọ nọ, mgbanwe ma ọ bụ onyinyo nke ntụgharị adịghị.[b]
  rationale: The revision uses an idiomatic concrete-gift expression for δόσις, removes the unsupported ‘different/diverse’ sense from the plural ‘lights,’ and moves footnote b to the difficult final Greek phrase that it actually discusses. The two sentences are a natural Igbo presentation of the Greek participial construction and do not alter the meaning.
