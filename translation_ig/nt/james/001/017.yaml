  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: ig
  text: Onyinye ọma ọ bụla na onyinye zuru oke ọ bụla si n’elu, na-abịadata site n’aka Nna nke ìhè. N’ebe ọ nọ, mgbanwe ma ọ bụ onyinyo nke ntụgharị adịghị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'A pụkwara ịsụgharị okwu ikpeazụ ahụ: “onyinyo sitere na ntụgharị” ma ọ bụ “onyinyo na-agbanwegharị.” O yiri ka ọ na-ezo aka n’onyinyo na-agbanwe mgbe ihe ndị na-enye ìhè n’eluigwe na-agagharị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: Ezi ihe ọ bụla a na-enye
  rationale: δόσις pụrụ ịpụta omume inye ihe ma ọ bụ ihe e nyere. Nsụgharị a na-anọgide n’etiti nghọta abụọ ahụ n’ụzọ Igbo dị mfe, ma na-edobe ike nkesa nke Πᾶσα.
- source_word: πᾶν δώρημα τέλειον
  choice: onyinye ọ bụla zuru oke
  rationale: δώρημα na-elekwasị anya n’ihe e nyere; “onyinye” bụ okwu Igbo doro anya ma dịkwa ebube. “Zuru oke” na-egosi ihe mezuru ma dị mma n’ụzọ zuru ezu.
- source_word: ἄνωθέν ἐστιν
  choice: si n’elu bịa
  rationale: Nke a na-egosipụta isi mmalite dị n’elu ma na-ada nke ọma n’Igbo mgbe okwu na-esochi ya bụ καταβαῖνον.
- source_word: καταβαῖνον
  choice: na-esite ... abịada
  rationale: A na-edobe echiche nke ihe na-abịadata site n’elu nakwa omume na-aga n’ihu.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: n’aka Nna nke ìhè dị iche iche
  rationale: A hapụrụ ihe atụ ahụ dịka ihe atụ, n’enweghị ịkọwa “ìhè” ozugbo dị ka kpakpando na ihe ndị ọzọ dị n’eluigwe.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: n’ebe ọ nọ, mgbanwe ... adịghị
  rationale: Nke a na-eburu ọdịdị okwu ịdị adị nke οὐκ ἔνι ma zere ịgbanwe ya ka ọ bụrụ nkọwa ozizi sara mbara.
- source_word: τροπῆς ἀποσκίασμα
  choice: onyinyo nke ntụgharị
  rationale: A na-edobe ihe oyiyi siri ike ma nwee nghọta abụọ nke Grik, kama ịkọwa kpọmkwem ihe na-atụgharị ma ọ bụ ihe kpatara onyinyo ahụ.
theological_decisions:
- issue: Ihe atụ “Nna nke ìhè” na enweghị mgbanwe n’ebe Chineke nọ
  choice: Edobere “Nna nke ìhè dị iche iche” na okwu banyere enweghị mgbanwe ma ọ bụ onyinyo ntụgharị.
  alternative: Ịkọwa “ìhè” n’ahịrị bụ isi dịka anyanwụ, ọnwa na kpakpando, ma ọ bụ ịsụgharị njedebe naanị dịka “onye na-adịghị agbanwe agbanwe.”
  rationale: Grik na-eji ọdịiche dị n’etiti Nna na ìhè ndị na-agbanwe ọnọdụ ma ọ bụ onyinyo ha arụ ọrụ. Nsụgharị ahụ na-echekwa ihe atụ na esemokwu nkà mmụta okpukpe ahụ n’enweghị itinye nkọwa otu ụka.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ ndị bụ isi nke Grik, ma jiri “dị iche iche” mee ka “ìhè” ghara ịdị ka otu ìhè naanị. Akara nkọwa ala [a] na [b] pụtara n’ahịrị bụ isi.
