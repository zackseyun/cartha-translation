id: JAS.1.22
reference: James 1:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: ig
  text: Ma bụrụnụ ndị na-eme ihe okwu ahụ kwuru, unu abụkwala naanị ndị na-anụ ya, na-eduhie onwe unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-aghọgbu onwe unu,” ma ọ bụ, “na-eji echiche na-ezighị ezi eme ka onwe unu hie ụzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γίνεσθε
  choice: bụrụnụ
  rationale: Ngwaa iwu a dị n’ọnụọgụ ọtụtụ ma na-akpọ ndị a na-agwa ka nke a bụrụ omume ndụ ha na-aga n’ihu; “bụrụnụ” na-edobe ike iwu ahụ n’Igbo nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe e kwuru tupu ya; “Ma” dabara n’ọnọdụ a.
- source_word: ποιηταὶ
  choice: ndị na-eme ihe ... kwuru
  rationale: N’Igbo, nke a na-ekwupụta echiche nke ndị na-etinye ihe ha nụrụ n’ọrụ n’ụzọ doro anya ma dịkwa eke karịa ịsị “ndị na-eme okwu.”
- source_word: λόγου
  choice: okwu ahụ
  rationale: “Okwu ahụ” na-edobe njikọ ya na okwu e kwuru na Jems 1:21, na-enweghị ime ka ọ bụrụ naanị ozi nkịtị ma ọ bụ ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: ἀκροαταὶ μόνον
  choice: naanị ndị na-anụ ya
  rationale: Nke a na-edobe ma echiche ịnụ ihe ma ike nke μόνον, ma meekwa ka ọdịiche dị n’etiti ịnụ na ime pụta ìhè.
- source_word: παραλογιζόμενοι
  choice: na-eduhie
  rationale: “Na-eduhie” na-egosi aghụghọ a na-eme onwe onye; nkọwa ụkwụ na-echekwa echiche pụrụ iche nke iji ntụgharị uche na-ezighị ezi mee ka onwe onye hie ụzọ.
- source_word: ἑαυτούς
  choice: onwe unu
  rationale: Nke a bụ nnọchiaha nlaghachi azụ maka ọtụtụ ndị, ma bụrụkwa ụzọ Igbo si ekwu ya nke ọma.
theological_decisions:
- issue: Ihe λόγος pụtara na Jems 1:22
  choice: “okwu ahụ,” ya bụ okwu a nabatara nke a kpọtụrụ aha n’amaokwu dị nso
  alternative: “ozi ahụ” ma ọ bụ “nkuzi ahụ”
  rationale: Nhọrọ a na-edobe njikọ ya na “okwu a kụnyere” na 1:21 na ịdị arọ nke okwu ahụ n’Akwụkwọ Nsọ, na-enweghị ịkọwa ya n’ụzọ dị warara karịa ihe odide ahụ.
- issue: Ike iwu Γίνεσθε
  choice: ọkpụkpọ ka ha nọgide na-abụ ndị na-eme ihe okwu ahụ kwuru
  alternative: “ghọọnụ,” nke pụrụ ilekwasị anya n’ịmalite ịbụ ndị na-eme ya
  rationale: Ụdị iwu dị ugbu a na-akwado omume na-aga n’ihu; “bụrụnụ” na-enye nke a n’ụzọ dị mma n’Igbo.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dịkwa mfe nghọta. E kwughị “ndị na-eme okwu ahụ” n’ihi na ọ naghị ada nke ọma n’Igbo; “ndị na-eme ihe okwu ahụ kwuru” na-eme ka ihe ποιηταὶ λόγου pụtara doo anya n’etinyeghị echiche okpukpe ọzọ.
