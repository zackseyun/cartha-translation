  terminology: “Okwu ahụ” appropriately retains the contextual and biblical resonance of λόγος. “Na-eduhie onwe unu” is an acceptable rendering of παραλογιζόμενοι ἑαυτούς; the footnote responsibly preserves the nuance of deception through faulty reasoning.
