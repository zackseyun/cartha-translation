  source_fidelity: 'The rendering accurately preserves the imperative contrast: believers are to be doers of the word rather than hearers only, with the concluding participle expressing self-deception. “Ndị na-eme ihe okwu ahụ kwuru” is a clear, idiomatic Igbo unpacking of ποιηταὶ λόγου and does not add a theological interpretation.'
