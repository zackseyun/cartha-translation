id: JAS.1.10
reference: James 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: ig
  text: ma onye ọgaranya n’ọnọdụ e wedara ya ala[a], n’ihi na ọ ga-agabiga dị ka ifuru ahịhịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, were ngwaa a hapụrụ site n’amaokwu nke 9 tinye ya: “ma ka onye ọgaranya nyaa isi n’ọnọdụ e wedara ya ala.”'
    reason: alternative_reading
  - marker: b
    text: “Ifuru ahịhịa” bụ nsụgharị kwụ ọtọ nke oyiyi Grik, nke na-emesi otú onye ọgaranya si agabiga ngwa ngwa dịka ifuru ahịhịa ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: ma ọgaranya
  rationale: “Ma” na-egosi njikọ na ọdịiche dị n’etiti onye nọ n’ọnọdụ dị ala n’amaokwu nke 9 na ọgaranya ebe “ọgaranya” na-arụ ọrụ dị ka aha onye.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: n’ọnọdụ e wedara ya ala
  rationale: Nkebi a na-egosi iweda ọgaranya ala ma ọ bụ ọnọdụ ya dara ala; ọ naghị akọwa naanị àgwà ịdị umeala n’obi.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Nke a na-edobe ihe kpatara okwu ahụ n’ụzọ doro anya ma kwekọọ n’ọrụ njikọ Grik.
- source_word: ὡς ἄνθος χόρτου
  choice: dị ka ifuru ahịhịa
  rationale: Nsụgharị a na-edobe oyiyi Grik nke ifuru ahịhịa na-egosi ịdịteghị aka, n’etinyeghị “ubi” nke na-adịghị n’ederede a.
- source_word: παρελεύσεται
  choice: ọ ga-agafe
  rationale: Okwu a na-egosi na ndụ na ọkwá ọgaranya ga-agabiga; ọ na-edobe oyiyi nke ihe na-adịghị adịgide.
theological_decisions:
- issue: Ngwaa a hapụrụ n’amaokwu a ma a ghọta ya site n’amaokwu nke 9
  choice: E tinyebeghị ngwaa “nyaa isi” n’ahịrị bụ isi; a hapụrụ nkebiokwu ahụ dịka o si dị n’isi mmalite.
  alternative: “ma ka ọgaranya nyaa isi n’ọnọdụ e wedara ya ala”
  rationale: Asụsụ Grik na-adabere n’iwu dị n’amaokwu nke 9. Ịhapụ ngwaa ahụ na-echekwa usoro isi mmalite, ebe nkọwa ala peeji na-eme ka njikọ ya doo anya.
- issue: Ihe “iweda ọgaranya ala” pụtara
  choice: Ọ na-ezo aka n’ịda ọnọdụ ọgaranya na ịdịteghị aka nke akụ na ndụ ya.
  alternative: Ọ na-ezo naanị n’àgwà ime mmụọ nke ịdị umeala n’obi.
  rationale: Ihe kpatara e nyere—na ọ ga-agafe dịka ifuru ahịhịa—na-akwado echiche nke iweda ọnọdụ ya ala na ịdịteghị aka, kama ịbụ naanị àgwà ọma nke ịdị umeala n’obi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ nkebiokwu nke na-enweghị ngwaa zuru ezu iji chekwaa ndabere ya n’amaokwu bu ya ụzọ; nkọwa [a] na-eme ka ihe a ghọta. “Ifuru ahịhịa” na-echekwa oyiyi Akwụkwọ Nsọ n’enweghị nkọwa agbakwunyere.
