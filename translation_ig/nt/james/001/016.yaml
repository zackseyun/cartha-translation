- from: Unu ekwela ka e duhie unu, ụmụnna m[a] ndị m hụrụ n’anya.
  to: Unu ekwela ka e duhie unu, ndị m hụrụ n’anya, ụmụnna m[a].
  rationale: 'The revision retains the draft’s faithful prohibition and passive sense while placing the affectionate address first: “ndị m hụrụ n’anya” directly represents ἀδελφοί μου ἀγαπητοί in a clear, idiomatic Igbo vocative construction. The footnote preserves the collective, potentially mixed-gender referent without introducing a structurally misleading alternative expression.'
