  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: ig
  text: Unu ekwela ka e duhie unu, ndị m hụrụ n’anya, ụmụnna m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” pụrụ ịkpọ ndị kwere ekwe niile ọnụ, gụnyere ụmụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Unu ekwela
  rationale: N’usoro a, μή na ngwaa iwu nke oge dị ugbu a na-enye iwu mgbochi. “Unu ekwela” bụ ụzọ Igbo dị ndụ si kwupụta mgbochi ahụ n’enweghị ịgbakwunye echiche na ha aghaghị ịkwụsị ihe ha na-eme ugbu a.
- source_word: πλανᾶσθε
  choice: ka e duhie unu
  rationale: Ụdị ngwaa a nwere ike ịbụ passive ma ọ bụ middle, ma n’ebe a ọ kachasị egosi ịnabata echiche ụgha ma ọ bụ ịbụ onye e duhiere. “Ka e duhie unu” na-edobe isi echiche passive ahụ ma dịkwa mfe nghọta n’Igbo.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu Igbo kwesịrị ekwesị maka ndị a na-akpọ n’otu okwukwe dịka ndị otu ezinụlọ. Ọ na-edobe ihe oyiyi nke nwanne dị n’okwu Grik, ebe nkọwa ala peeji na-eme ka o doo anya na ndị inyom so ná ndị a na-agwa okwu.
- source_word: μου
  choice: m
  rationale: “M” na-egosi njikọ onye nwe ihe dịka μου ma na-eme ka okwu ahụ bụrụ nke mmekọrịta chiri anya.
- source_word: ἀγαπητοί
  choice: ndị m hụrụ n’anya
  rationale: Nkebi a na-ebuga ịhụnanya dị ọkụ nke ἀγαπητοί n’Igbo nkịtị, dị ùgwù, ma na-enweghị ime ka okwu ahụ daa ogbenye.
theological_decisions:
- issue: Okwu a kpọrọ ndị otu ọgbakọ nke nwere ọdịdị nwoke na Grik
  choice: Jiri “ụmụnna” n’ahịrị bụ isi ma kọwaa n’ala peeji na ọ pụrụ ịgụnye ụmụ nwoke na ụmụ nwanyị.
  alternative: “ụmụnna nwoke na ụmụnna nwanyị”
  rationale: ἀδελφοί bụ ọtụtụ nke nwoke n’usoro asụsụ Grik, ma a na-ejikarị ya akpọ ndị kwere ekwe niile dịka otu ezinụlọ, gụnyere ụmụ nwanyị. Nhọrọ a na-edobe ọdịdị okwu mmalite ma ghara ime ka ndị ọ na-ezo aka na ha bụrụ naanị ụmụ nwoke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. “Unu ekwela ka e duhie unu” bụ iwu doro anya ma na-edobe echiche passive nke isi mmalite; “ndị m hụrụ n’anya” na-egosipụta olu ịhụnanya nke onye dere akwụkwọ ahụ.
