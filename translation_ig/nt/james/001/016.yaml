review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition and the passive sense of πλανᾶσθε. However, placing m (“my”) directly after ụmụnna makes it modify “brothers/siblings” before the following affectionate qualifier, whereas Greek μου modifies ἀγαπητοί (“beloved”). Reordering can represent the source structure and idiomatic Igbo more clearly.
  naturalness: “Unu ekwela ka e duhie unu” is natural Standard Igbo. “Ndị m hụrụ n’anya, ụmụnna m” is a more natural, direct vocative sequence than “ụmụnna m ndị m hụrụ n’anya.”
  terminology: “ụmụnna” suitably renders ἀδελφοί as a family-like address among believers. “ndị m hụrụ n’anya” appropriately renders ἀγαπητοί. The inclusive-reference footnote is useful, but its alternative should not add m after “ụmụnna nwanyị,” since Greek μου belongs with “beloved,” not separately with “brothers.”
  issues:
  - severity: low
    issue: Placement and scope of “m” (“my”)
    rationale: In “ụmụnna m ndị m hụrụ n’anya,” the first m can imply a possessive attached to ụmụnna, while Greek has one μου modifying ἀγαπητοί. A reordered vocative avoids this ambiguity and reads more smoothly.
  - severity: low
    issue: Footnote alternative adds an extra possessive association
    rationale: “ụmụnna nwoke na ụmụnna nwanyị m” places m only with “sisters” in Igbo surface grammar and does not reflect the Greek phrase’s single affectionate possessive. The footnote can simply explain that ụmụnna may address all believers, including women.
  revised_text: Unu ekwela ka e duhie unu, ndị m hụrụ n’anya, ụmụnna m[a].
  revised_footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” pụrụ ịkpọ ndị kwere ekwe niile ọnụ, gụnyere ụmụ nwanyị.
    reason: lexical_alternative
  revision_rationale: 'The revision retains the draft’s faithful prohibition and passive sense while placing the affectionate address first: “ndị m hụrụ n’anya” directly represents ἀδελφοί μου ἀγαπητοί in a clear, idiomatic Igbo vocative construction. The footnote preserves the collective, potentially mixed-gender referent without introducing a structurally misleading alternative expression.'
