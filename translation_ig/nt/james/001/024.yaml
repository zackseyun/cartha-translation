id: JAS.1.24
reference: James 1:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: ig
  text: N’ihi na ọ lere onwe ya anya wee pụọ, ozugbo ahụkwa o chefuru ụdị onye ọ bụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “otú ọ dị.” Okwu Grik ahụ na-ezo aka n’ụdị onye ọ bụ ma ọ bụ otú ọ dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: lere onwe ya anya
  rationale: N’ọnọdụ ihe atụ nke enyo, okwu a pụtara ile ma ọ bụ tụlee nke ọma. Nkebiokwu a bụ nke Igbo na-ada nke ọma ma na-egosi na ọ hụrụ onwe ya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ntụnyere ahụ.
- source_word: ἑαυτὸν
  choice: onwe ya
  rationale: Nke a na-edobe nnọchiaha nlaghachi nke Grik n’ebughị okwu ‘ihu’ bata n’amaokwu a.
- source_word: ἀπελήλυθεν
  choice: wee pụọ
  rationale: Ọ bụ ezie na ụdị ngwaa Grik bụ perfect, n’usoro akụkọ a Igbo ji ‘wee pụọ’ kwupụta ihe omume sochiri ile anya n’ụzọ doro anya.
- source_word: εὐθέως
  choice: ozugbo ahụkwa
  rationale: Nke a na-egosi na nchefu ahụ mere n’enweghị oge ọ bụla, ma ‘-kwa’ na-ejikọta ya na usoro ngwaa ndị bu ya ụzọ.
- source_word: ἐπελάθετο
  choice: o chefuru
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kpọmkwem si ekwu na mmadụ akwụsịla icheta ihe.
- source_word: ὁποῖος ἦν
  choice: ụdị onye ọ bụ
  rationale: ‘Ụdị onye’ na-echekwa echiche nke àgwà ma ọ bụ ụdị onye, ọ bụghị nanị onye ọ bụ n’aha; ọ na-ezerekwa ime ka ihe atụ ahụ bụrụ naanị maka nwoke.
theological_decisions:
- issue: Nkọwa nwoke nke na-anọchi mmadụ niile n’ihe atụ enyo
  choice: ụdị onye ọ bụ
  alternative: ụdị nwoke ọ bụ
  rationale: Ọ bụ ezie na okwu Grik dị n’ụdị nwoke otu, ihe atụ ahụ na-anọchi onye ọ bụla. ‘Onye’ na Igbo na-egosipụta ebumnuche izugbe ahụ n’etinyeghị oke nwoke na nwanyị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. E ji usoro ngwaa dị mfe mee ka ihe atụ ahụ doo ndị na-agụ akwụkwọ nkịtị anya, ebe a ka na-echekwa njikọ nkọwa na echiche nke ụdị ma ọ bụ àgwà mmadụ.
