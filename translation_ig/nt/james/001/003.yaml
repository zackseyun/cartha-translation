  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: ig
  text: n’ihi na unu maara na nnwale nke okwukwe unu na-arụpụta ntachi obi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ezi ịdị adị nke okwukwe unu e gosipụtara.” Okwu Grik ahụ nwere ike ịpụta ma usoro nnwale ma àgwà e gosipụtara site na nnwale.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịnọgidesi ike” ma ọ bụ “ịnọgide na-atachi obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: n’ihi na unu maara
  rationale: Nkebi-okwu a na-adabere n’iwu dị n’amaokwu nke 2 ma na-enye ihe kpatara ya; ntụgharị a na-egosi nke ahụ n’Igbo dị mfe.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ihe ndị na-agụ akwụkwọ maara; “na” bụ ụzọ nkịtị e si ejikọta ya n’Igbo.
- source_word: τὸ δοκίμιον
  choice: nnwale a na-anwale
  rationale: δοκίμιον nwere ike ịpụta usoro nnwale ma ọ bụ ezi ịdị nke nnwale gosipụtara. Isi ederede họọrọ usoro nnwale, ma ndetu [a] chekwara nghọta nke ọzọ.
- source_word: ὑμῶν τῆς πίστεως
  choice: okwukwe unu
  rationale: N’ebe a, πίστις bụ okwukwe nke ndị a na-agwa okwu, nke a na-anwale.
- source_word: κατεργάζεται
  choice: na-arụpụta
  rationale: Ngwaa a na-egosi na nnwale ahụ na-eweta ihe ga-esi na ya pụta.
- source_word: ὑπομονήν
  choice: ntachi obi
  rationale: Ọ na-egosi ịnọgidesi ike ma tachie obi n’okpuru ihe isi ike; okwu Igbo a bụ nke a na-aghọta nke ọma.
theological_decisions:
- issue: Ntụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’okwukwe ndị na-agụ akwụkwọ nke na-agafe nnwale. “Okwukwe” bụ okwu doro anya ma ọ naghị etinye nkọwa ozizi pụrụ iche.
- issue: Ma δοκίμιον ọ bụ usoro nnwale ka ọ bụ àgwà nnwale gosipụtara
  choice: usoro nnwale
  alternative: ezi ịdị nke okwukwe unu nke nnwale gosipụtara
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu banyere ọnwụnwa dị iche iche, ya mere usoro nnwale dabara nke ọma; agbanyeghị, e debere nghọta nke nsonaazụ nnwale na ndetu [a].
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “nnwale a na-anwale” mee ka njikọ dị n’etiti δοκίμιον na okwukwe pụta ìhè, ebe e chekwara nghọta ọzọ na ndetu.
