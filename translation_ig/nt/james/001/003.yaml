  naturalness: Replacing the repeated phrase with 'nnwale nke okwukwe unu' is idiomatic, clear Standard Igbo and preserves the intended genitive relationship.
  terminology: '''okwukwe'' is appropriate for πίστις in this context, and ''ntachi obi'' is an established, natural rendering for ὑπομονή. The alternative in footnote a is adjusted to state the ''proved genuineness'' sense without unnatural wording.'
