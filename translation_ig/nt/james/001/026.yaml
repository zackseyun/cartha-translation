revisions:
- from: Ọ bụrụ na onye ọ bụla echee na ya bụ onye na-agbasosi okpukpe ike[a], ma ọ naghị eji eriri ọnụ achịkwa ire ya[b], kama ọ na-aghọgbu obi ya, okpukpe onye ahụ abaghị uru[c].
  to: Ọ bụrụ na onye ọ bụla eche na ya bụ onye na-ekpe okpukpe[a], ma ọ naghị ekedo ire ya[b], kama ọ na-aghọgbu obi ya, okpukpe onye ahụ bụ ihe efu[c].
  rationale: The revision replaces an intensified, less idiomatic description of a religious person with a natural expression that fits θρησκός, and it renders the participle χαλιναγωγῶν idiomatically while retaining its bridle metaphor in a properly anchored footnote. No theological interpretation has been added.
