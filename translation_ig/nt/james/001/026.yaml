id: JAS.1.26
reference: James 1:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: ig
  text: Ọ bụrụ na onye ọ bụla eche na ya bụ onye na-ekpe okpukpe[a], ma ọ naghị ekedo ire ya[b], kama ọ na-aghọgbu obi ya, okpukpe onye ahụ bụ ihe efu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o yiri ka ọ bụ onye na-ekpe okpukpe.”
    reason: lexical_alternative
  - marker: b
    text: Grik ji okwu pụtara “iji ihe nkedo ọnụ achịkwa” mee ihe; ọ na-echekwa onyinyo ihe e ji achịkwa anụmanụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “abaghị uru” ma ọ bụ “enweghị isi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: echee
  rationale: “Echee” na-egosi otú onye ahụ si ele onwe ya anya; ọ naghị ekpebi ma ọ bụ naanị otú ndị ọzọ si ahụ ya.
- source_word: θρησκὸς
  choice: onye na-agbasosi okpukpe ike
  rationale: Nke a na-egosi onye na-ewere onwe ya dị ka onye na-eme ihe okpukpe chọrọ, n’enweghị itinye echiche otu ụka ma ọ bụ ozizi pụrụ iche n’ime okwu ahụ.
- source_word: χαλιναγωγῶν
  choice: jiri eriri ọnụ achịkwa
  rationale: A hapụrụ onyinyo eriri e ji achịkwa anụmanụ, kama iji naanị okwu sara mbara dịka “chịkwaa”; nke a na-echekwakwa njikọ ya na Jemis 3:2–3.
- source_word: γλῶσσαν αὐτοῦ
  choice: ire ya
  rationale: Nsụgharị a na-edobe akụkụ ahụ e kwuru kpọmkwem na Grik na onyinyo okwu gbasara ịchịkwa ihe mmadụ na-ekwu.
- source_word: ἀπατῶν
  choice: na-aghọgbu
  rationale: “Na-aghọgbu” na-enye echiche doro anya nke ime ka obi mmadụ kwenye n’ihe na-abụghị eziokwu.
- source_word: καρδίαν αὐτοῦ
  choice: obi ya
  rationale: A hapụrụ “obi” dịka ihe odide Grik si kwuo, ebe ọ na-anọchi anya ime mmadụ na nghọta onwe ya.
- source_word: τούτου
  choice: onye ahụ
  rationale: “Onye ahụ” na-echekwa ike mkpịsị aka nke okwu Grik ahụ, na-atụ aka kpọmkwem n’ụdị onye a kọwara.
- source_word: μάταιος
  choice: abaghị uru
  rationale: Nke a na-egosi na okpukpe dị otu a bụ ihe efu ma ọ naghị arụpụta ihe kwesịrị ya, n’asụsụ Igbo dị mfe nghọta.
- source_word: ἡ θρησκεία
  choice: okpukpe
  rationale: “Okpukpe” bụ okwu kwụ ọtọ ma na-edobe njikọ echiche ya na θρησκός, ebe ihe gbara amaokwu ahụ gburugburu na-egosi omume na nrube isi okpukpe.
theological_decisions:
- issue: Ntụaka nwoke nke e ji anọchi anya mmadụ niile
  choice: onye ọ bụla … ya … onye ahụ
  alternative: iji mkpụrụ okwu nwoke kpọmkwem dịka “nwoke ọ bụla” ma ọ bụ “ọ” n’ụzọ ga-eme ka ọ dị ka ọ bụ naanị nwoke
  rationale: Grik ji ụdị nwoke otu onye mee ntụaka zuru mmadụ niile. Igbo na-eji “onye ọ bụla” na “ya” mee nke a n’enweghị ime ka amaokwu ahụ bụrụ naanị maka ụmụ nwoke.
- issue: Ihe θρησκεία/θρησκός pụtara
  choice: onye na-agbasosi okpukpe ike / okpukpe
  alternative: onye nsọpụrụ Chineke / ofufe Chineke; ma ọ bụ onye otu okpukpe
  rationale: Nhọrọ a na-echekwa nkatọ e mere banyere omume okpukpe onye na-ekwu na ya na-agbasosi ya ike, ma ọ naghị etinye aha Chineke n’ebe Grik na-etinyeghị ya, ọ naghịkwa eme ka okwu ahụ bụrụ naanị ịbụ onye otu okpukpe.
- issue: Onyinyo ịchịkwa ire dịka iji eriri ọnụ achịkwa anụmanụ
  choice: jiri eriri ọnụ achịkwa ire ya
  alternative: chịkwaa okwu ya
  rationale: Nhọrọ a na-echekwa ihe atụ Grik na njikọ ya na nkuzi banyere ire na Jemis isi nke atọ, ma ka na-enye onye na-agụ Igbo ihe ọ ga-aghọta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “na ya” kama “na ọ” ka o doo anya na nke a bụ echiche onye ahụ banyere onwe ya. E debere “ire,” “obi,” na onyinyo “eriri ọnụ” iji chekwaa okwu na ihe atụ ndị dị na Grik.
