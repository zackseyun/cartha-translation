id: JAS.1.13
reference: James 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: ig
  text: Ka onye ọ bụla a na-anwa ọnwụnwa ghara ịsị, “Ọ bụ Chineke na-anwa m ọnwụnwa,” n’ihi na ihe ọjọọ apụghị ịnwa Chineke ọnwụnwa,[a] ya onwe ya adịghịkwa anwa onye ọ bụla ọnwụnwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ dabara n’okwu Grik nso karị: “n’ihi na Chineke adịghị ekwe ka ihe ọjọọ nwaa ya ọnwụnwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: Ka onye ọ bụla ... ghara ịsị
  rationale: Nke a na-egosipụta mmachibido iwu nke onye nke atọ n’Igbo dị ugbu a ma dịkwa mfe nghọta.
- source_word: πειραζόμενος
  choice: a na-anwa ọnwụnwa
  rationale: Ọnọdụ a na-ekwu maka ịrata mmadụ ime ihe ọjọọ, ọ bụghị nnwale n’ozuzu ya; usoro a na-echekwakwa olu nnabata nke participle ahụ.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: Ọ bụ Chineke na-anwa m ọnwụnwa
  rationale: Nke a na-egosi Chineke dịka isi mmalite ma ọ bụ onye na-eme omume ahụ, dịka ἀπό si arụ ọrụ n’ahịrịokwu a.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: ihe ọjọọ apụghị ịnwa Chineke ọnwụnwa
  rationale: Nke a bụ Igbo e ji eme ihe nke na-egosi na Chineke adịghị ekwe omume ka ihe ọjọọ rata ya, ebe nkọwa ala peeji na-echekwa ọdịdị okwu Grik ahụ nke siri ike.
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: ya onwe ya adịghịkwa anwa onye ọ bụla ọnwụnwa
  rationale: “Ya onwe ya” na-echekwa nkwusiri ike nke αὐτός, ebe “onye ọ bụla” n’usoro njụ a na-enye echiche οὐδένα.
theological_decisions:
- issue: Uche okwu πειράζω n’amaokwu a
  choice: Jiri “ịnwa ọnwụnwa” n’ebe niile.
  alternative: Jiri “ịnwale” n’otu ebe ma ọ bụ n’ebe niile.
  rationale: Ihe gbara amaokwu a gburugburu bụ ọchịchọ ọjọọ na mmehie; ya mere okwu a bụ ịrata mmadụ ime ihe ọjọọ, ọ bụghị ụdị nnwale ndị ọzọ Akwụkwọ Nsọ nwere ike ikwu na Chineke na-enye.
- issue: Uche nke ἀπείραστός ἐστιν κακῶν
  choice: “Ihe ọjọọ apụghị ịnwa Chineke ọnwụnwa.”
  alternative: “Chineke bụ onye ihe ọjọọ na-apụghị ịnwa ọnwụnwa” ma ọ bụ “Chineke enweghị ahụmahụ n’ihe ọjọọ.”
  rationale: Nhọrọ a kwekọrọ nke ọma na nkebi sochirinụ, nke na-ekwu na Chineke n’onwe ya adịghị anwa onye ọ bụla ọnwụnwa, ma ọ naghị ewebata echiche na ihe ọjọọ nwere ike ịrata Chineke.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ịnwa ọnwụnwa” kewapụ echiche ịrata mmadụ ime ihe ọjọọ n’echiche sara mbara nke “ịnwale.”
