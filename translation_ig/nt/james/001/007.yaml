id: JAS.1.7
reference: James 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου
base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: ig
  text: N’ihi na nwoke ahụ ekwesịghị iche na ọ ga-anata ihe ọ bụla n’aka Onyenwe anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ahụ.” Okwu Grik dị n’ụdị nwoke, otu onye (“nwoke ahụ”), ma ọ na-anọchite anya onye na-enwe obi abụọ a kọwara n’amaokwu bu ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: N’ihi na ... ekwesịghị
  rationale: “N’ihi na” na-egosi na amaokwu a na-akọwa ihe mere onye ahụ na-enwe obi abụọ ekwesịghị ịtụ anya inweta ihe; “ekwesịghị” na-enye mmachibido iwu ahụ n’ụzọ Igbo nke oge a.
- source_word: οἰέσθω
  choice: iche
  rationale: Ngwaa a pụtara iche ma ọ bụ were ya na ihe dị otú ahụ ga-eme. “Iche” bụ okwu Igbo doro anya ma dabara n’ịdọ aka ná ntị a.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: nwoke ahụ
  rationale: Okwu Grik ahụ dị n’ụdị nwoke, otu onye, ma na-ezo aka n’onye na-enwe obi abụọ a kọwara n’amaokwu bu ụzọ. “Nwoke ahụ” na-echekwa ụdị okwu isi mmalite ahụ.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ebute ọdịnaya nke ihe nwoke ahụ ekwesịghị iche, dịka njikọ okwu ahụ si arụ ọrụ n’Igbo.
- source_word: λήμψεταί
  choice: ọ ga-anata
  rationale: Ụdị ọdịnihu nke λαμβάνω na-egosi ihe a ga-anata. “Ịnata” dabara nke ọma mgbe a na-ekwu banyere ihe si n’aka Onyenwe anyị abịa.
- source_word: τι
  choice: ihe ọ bụla
  rationale: N’ọnọdụ a na-agọnahụ ihe, “ihe ọ bụla” na-egosi na ọ dịghị otu ihe onye ahụ kwesịrị iche na ọ ga-anata.
- source_word: παρὰ τοῦ κυρίου
  choice: n’aka Onyenwe anyị
  rationale: παρά tinyere genitive na-egosi isi ebe ihe si abịa; “n’aka” na-egosipụta nke a n’Igbo. “Onyenwe anyị” na-echekwa aha nsọpụrụ κύριος n’akọwaghị onye ọ bụ karịa ka ederede ahụ kwuru.
theological_decisions:
- issue: Onye “Onyenwe anyị” (τοῦ κυρίου) na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Chineke; Onyenwe anyị Chineke
  rationale: Ederede Grik ji κύριος naanị ya, n’enweghị nkọwa ọzọ. Ịsụgharị ya “Onyenwe anyị” na-echekwa okwu na nghọta sara mbara nke ederede ahụ kama ịkọwapụta onye ọ bụ karịa ka amaokwu ahụ mere.
- issue: Ụdị okike nke ὁ ἄνθρωπος ἐκεῖνος
  choice: nwoke ahụ
  alternative: onye ahụ
  rationale: Okwu Grik dị n’ụdị nwoke, otu onye, ọ bụkwa onye nnọchianya nke onye ọ bụla na-enwe obi abụọ. Isi ederede na-echekwa ụdị nwoke ahụ, ebe ihe odide ala ala na-akọwa ọrụ nnọchianya ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ekwesịghị iche” na-eburu ike mmachibido iwu ahụ n’enweghị ụda okwu ochie; “n’aka Onyenwe anyị” bụ ụzọ Igbo e ji egosi isi ebe ihe si abịa.
