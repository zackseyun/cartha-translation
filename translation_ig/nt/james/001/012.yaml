    reason: cultural_note
  revision_rationale: The revision corrects the final promise clause, which requires a clear and idiomatic Igbo construction. It also uses “nnwale” for the contextually prominent sense of πειρασμός, without eliminating the alternative temptation sense from the footnote. “Mgbe a nwalere ya ma chọpụta na o ruru eru” communicates δόκιμος γενόμενος as being tested and found approved, without specifying the examiner. The source’s ambiguity concerning the identity of the implied promiser and the force of “okpueze nke ndụ” remains intact.
