revisions:
- from: Ngọzi na-adịrị nwoke ahụ nke ji ntachi obi nagide ọnwụnwa[a], n’ihi na mgbe a nwalere ya, o wee bụrụ onye a nabatara, ọ ga-anata okpueze nke ndụ[b], nke o kwere ndị hụrụ ya n’anya na nkwa.
  to: Ngọzi na-adịrị nwoke ahụ nke ji ntachi obi na-anagide nnwale[a], n’ihi na mgbe a nwalere ya ma chọpụta na o ruru eru, ọ ga-anata okpueze nke ndụ[b], nke o kwere na nkwa nye ndị hụrụ ya n’anya.
  rationale: The revision corrects the final promise clause, which requires a clear and idiomatic Igbo construction. It also uses “nnwale” for the contextually prominent sense of πειρασμός, without eliminating the alternative temptation sense from the footnote. “Mgbe a nwalere ya ma chọpụta na o ruru eru” communicates δόκιμος γενόμενος as being tested and found approved, without specifying the examiner. The source’s ambiguity concerning the identity of the implied promiser and the force of “okpueze nke ndụ” remains intact.
  reviewer_model: gpt-5.6-terra
