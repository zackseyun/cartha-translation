    text: A pụkwara ịsụgharị ya “ọnwụnwa” ma ọ bụ “ule.” Okwu Grik ahụ nwere ike ịgụnye ma nnwale ma ọnwụnwa nke ime mmehie, ma n’ebe a ihe gbara ya gburugburu na-emesi ike ịnagide nnwale.
    reason: lexical_alternative
