id: JAS.1.12
reference: James 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: ig
  text: Ngọzi na-adịrị nwoke ahụ nke ji ntachi obi na-anagide nnwale[a], n’ihi na mgbe a nwalere ya ma chọpụta na o ruru eru, ọ ga-anata okpueze nke ndụ[b], nke o kwere na nkwa nye ndị hụrụ ya n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọnwụnwa” ma ọ bụ “ule.” Okwu Grik ahụ nwere ike ịgụnye ma nnwale ma ọnwụnwa nke ime mmehie, ma n’ebe a ihe gbara ya gburugburu na-emesi ike ịnagide nnwale.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “okpueze” nwere ike ịpụta okpueze akwụkwọ ma ọ bụ ahịhịa a na-enye onye meriri n’asọmpi, ọ bụghị naanị okpueze eze.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosipụta ike nke okwu ngọzi ahụ n'ụzọ dị ugwu ma doo anya, kama ime ya naanị ‘obi ụtọ.’
- source_word: ἀνὴρ
  choice: nwoke ahụ
  rationale: Ọ na-edebe ụdị nwoke otu onye nke Grik; n’ebe a, nwoke ahụ na-anọchite anya onye ọ bụla nọ n’ọnọdụ a.
- source_word: ὑπομένει
  choice: ji ntachi obi nagide
  rationale: Ọ na-egosipụta ma ịnọgide n’okpuru nrụgide ma iguzosi ike, ọ bụghị nanị ịta ahụhụ n’enweghị nkwụsi ike.
- source_word: πειρασμόν
  choice: ọnwụnwa
  rationale: Okwu Igbo a nwere ike ịgụnye nnwale siri ike nakwa ọnwụnwa nke na-adọta mmadụ ime ihe ọjọọ; ihe gbara amaokwu a gburugburu na-elekwasị anya n’ịnagide nnwale.
- source_word: δόκιμος γενόμενος
  choice: mgbe a nwalere ya, o wee bụrụ onye a nabatara
  rationale: Nke a na-egosipụta usoro nke ịgafe nnwale wee pụta dịka onye egosiri na o kwesịrị nnabata, n’enweghị ikwu kpọmkwem onye mere nnwale ahụ.
- source_word: λήμψεται
  choice: ọ ga-anata
  rationale: Ọ bụ ntụgharị nkịtị ma doo anya nke ọdịnihu λαμβάνω n’ọnọdụ onyinye e kwere ná nkwa.
- source_word: στέφανον
  choice: okpueze
  rationale: ‘Okpueze’ bụ okwu a maara nke ọma; nkọwa ala peeji na-eme ka o doo anya na ọ pụrụ ịbụ okpueze mmeri, ọ bụghị naanị okpueze eze.
- source_word: τῆς ζωῆς
  choice: nke ndụ
  rationale: Ọ na-edebe njikọ genitive nke Grik n’enweghị ikpebi ma ndụ ahụ bụ ihe okpueze ahụ bụ, ihe ọ na-enye, ma ọ bụ ụgwọ ọrụ metụtara ndụ.
- source_word: ἐπηγγείλατο
  choice: o kwere … na nkwa
  rationale: Ọ na-enye aorist ahụ dịka ihe e kwere ná nkwa; isiokwu nnọchiaha ahụ ka bụ nke nwoke otu onye dịka n’asụsụ Grik.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: ndị hụrụ ya n’anya
  rationale: Ọ na-egosipụta ịhụnanya na-aga n’ihu nke e ji mara ndị ahụ n’ụzọ Igbo dị mfe ma bụrụkwa nke okike.
theological_decisions:
- issue: Ihe πειρασμός pụtara na Jemis 1:12
  choice: ọnwụnwa, nke ebe a na-emesi ike dịka nnwale siri ike
  alternative: nnwale; ọnwụnwa nke ime mmehie
  rationale: Okwu Grik ahụ nwere ike iburu echiche abụọ ahụ. Ntachi obi, nnwale, na nnabata dị n’amaokwu a na-akwado echiche nke ule ma ọ bụ nsogbu a na-atachi obi na ya, ma e kwesịghị ihichapụ ohere nke ‘ọnwụnwa.’
- issue: Onye bụ isiokwu nke ἐπηγγείλατο
  choice: edebere ya dịka ‘o’
  alternative: ịkọwapụta ya dịka ‘Chineke’ ma ọ bụ ‘Onyenwe anyị’
  rationale: Grik kwuru naanị ‘o kwere’; ọ bụ ezie na ihe gbara ya gburugburu na-eduga n’ebe Chineke nọ, itinye aha kpọmkwem ga-eme ka ihe e zoro n’asụsụ mmalite doo anya karịa ka ederede ahụ mere.
- issue: Njikọ τὸν στέφανον τῆς ζωῆς
  choice: okpueze nke ndụ
  alternative: okpueze ahụ bụ ndụ; okpueze na-enye ndụ
  rationale: Ntụgharị nkịtị a na-echekwa ihe mgbagwoju anya nke genitive ahụ ma ghara ikpebi otu nkọwa nkà mmụta okpukpe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe ụdị ngọzi nke mmalite, nwoke otu onye nke Grik, na ihe ndị ederede ahụ hapụrụ n’enweghị nkọwa zuru ezu. E tinyere akara nkọwa [a] na [b] n’ebe okwu ha metụtara dị.
