id: JAS.1.6
reference: James 1:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: ig
  text: Ma ka o jiri okwukwe[a] rịọ, n’enweghị obi abụọ ọ bụla, n’ihi na onye nwere obi abụọ dị ka ebili mmiri nke oké osimiri, nke ifufe na-ebugharị ma na-akwagharị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “jiri ntụkwasị obi.” Okwu Grik πίστεις, nke a sụgharịrị “okwukwe,” nwekwara ike igosi ịdabere n’ebe Chineke nọ n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: ka ọ rịọ
  rationale: Ngwaa a bụ iwu onye nke atọ n’oge na-aga n’ihu. “Ka ọ rịọ” na-egosipụta ndụmọdụ siri ike, ma na-ejikọkwa ya na ịrịọ Chineke amamihe n’amaokwu bu ụzọ.
- source_word: δὲ
  choice: Ma
  rationale: 'Ọ na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche: Chineke na-enye, ma onye na-arịọ kwesịrị ịrịọ n’okwukwe.'
- source_word: ἐν πίστει
  choice: jiri okwukwe
  rationale: N’Igbo, “jiri okwukwe rịọ” bụ ụzọ doro anya ma dị ndụ isi kwuo na okwukwe bụ ọnọdụ ma ọ bụ ụzọ e si arịọ. Ọ na-edobe echiche nke ịdabere na Chineke.
- source_word: μηδὲν διακρινόμενος
  choice: n’enweghị obi abụọ ọ bụla
  rationale: N’ebe a διακρινόμενος na-egosi obi abụọ ma ọ bụ obi na-awagharị awagharị. Nkebi a na-edobe ike nke μηδέν, ya bụ, enweghị obi abụọ ọ bụla.
- source_word: ὁ γὰρ διακρινόμενος
  choice: n’ihi na onye nwere obi abụọ
  rationale: E ji “onye” mee ka okwu ahụ gbasaa ruo onye ọ bụla, dịka participle Grik ahụ si arụ ọrụ, na-enweghị ịtinye nwoke kpọmkwem n’ebe isi mmalite ahụ na-emeghị otú ahụ.
- source_word: κλύδωνι θαλάσσης
  choice: ebili mmiri nke oké osimiri
  rationale: κλύδων na-ezo aka n’ebili mmiri ma ọ bụ mmiri na-akpa ike. Nhọrọ a doro ndị na-agụ Igbo anya ma na-edobe ihe atụ nke oké osimiri.
- source_word: ἀνεμιζομένῳ καὶ ῥιπιζομένῳ
  choice: nke ifufe na-ebugharị ma na-akwagharị
  rationale: Okwu abụọ a na-egosi na ifufe na-achịgharị ebili mmiri ahụ, na-eme ka ọ ghara ịnọ otu ebe. “Na-ebugharị ma na-akwagharị” na-edobe omume abụọ ahụ n’asụsụ Igbo nkịtị.
theological_decisions:
- issue: Ihe πίστει pụtara n’ọnọdụ nke arịrịọ a
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: “Okwukwe” na-edobe okwu bụ isi nke Agba Ọhụrụ ma kwekọọ na nkọwa banyere ịdabere na Chineke. E tinyere “ntụkwasị obi” n’ala peeji iji gosi ụda okwu ahụ nwere n’ọnọdụ a n’enweghị ịmanye otu nkọwa naanị.
- issue: Ihe διακρινόμενος pụtara
  choice: onye nwere obi abụọ
  alternative: onye obi ya na-awagharị awagharị
  rationale: N’ọnọdụ a, ihe atụ nke ebili mmiri na-akwado echiche nke obi abụọ na enweghị nkwụsi ike. “Obi abụọ” bụkwa okwu Igbo nkịtị nke na-ahapụ echiche nke ịla azụ ma ọ bụ ịma jijiji n’obi ka ọ dị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ihe atụ oké osimiri nke Grik, ma zere okwu ochie ma ọ bụ nkọwa nke otu ụka pụrụ iche.
