id: JAS.1.20
reference: James 1:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: ig
  text: N’ihi na iwe mmadụ adịghị arụpụta ezi omume nke Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: iwe mmadụ
  rationale: Ọ na-egosipụta iwe nke mmadụ n’ụzọ doro anya ma dịkwa nfe nghọta, n’enweghị ime ka ἀνήρ bụrụ naanị nwoke ebe okwu a na-ekwu maka mmadụ n’ozuzu ya.
- source_word: δικαιοσύνην θεοῦ
  choice: ezi omume nke Chineke
  rationale: Ọ na-echekwa njikọ genitive dị n’asụsụ Grik, nke nwere ike ịpụta ezi omume sitere n’aka Chineke, nke bụ nke Chineke, ma ọ bụ nke kwekọrọ n’uche ya, n’enweghị idozi mgbagwoju anya ahụ n’otu ụzọ naanị.
- source_word: οὐκ ἐργάζεται
  choice: adịghị arụpụta
  rationale: N’ebe a, ἐργάζεται na-egosi ime ka ihe pụta ma ọ bụ iweta ya; ‘adịghị arụpụta’ na-enye echiche ahụ n’Igbo eke.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe kpatara ndụmọdụ dị n’amaokwu bu ya ụzọ.
theological_decisions:
- issue: Ihe ‘δικαιοσύνην θεοῦ’ pụtara
  choice: ezi omume nke Chineke
  alternative: ihe ziri ezi n’anya Chineke
  rationale: Nhọrọ a na-edobe obosara na mgbagwoju anya nke okwu Grik kama ịkọwa ya naanị dị ka omume mmadụ nke Chineke nabatara.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A na-eji ahịrịokwu dị mkpirikpi nke na-echekwa usoro echiche na njikọ nke ederede Grik.
