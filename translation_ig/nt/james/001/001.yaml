id: JAS.1.1
reference: James 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: ig
  text: 'Jemis, ohu[b] nke Chineke na nke Onyenwe anyị Jizọs bụ Mesaya[a], na-edegara ebo iri na abụọ nọ ná Mgbasa[c] akwụkwọ: Ekele dịrị unu.


    [a] A pụkwara ịtụgharị ya dịka, “Jizọs Kraịst.” Okwu Grik bụ Χριστός (Khristós) nwere ike ịpụta “Mesaya,” ma ọ bụ bụrụ aha-ọkwá a na-akpọ “Kraịst.”


    [b] A pụkwara ịtụgharị ya dịka, “onye na-ejere ozi.” Okwu Grik bụ δοῦλος (doúlos) na-egosi onye bụ nke nna ukwu; e ji “ohu” mee ihe ebe a iji chekwaa echiche siri ike ahụ.


    [c] “Mgbasa” bụ aha e ji akọwa mgbasa ndị Juu bi n’èzí ala Izrel. N’ebe a, e nwere echiche dị iche banyere kpọmkwem ndị “ebo iri na abụọ” ahụ na-ekwu maka ha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya dịka, “Jizọs Kraịst.” Okwu Grik bụ Χριστός (Khristós) nwere ike ịpụta “Mesaya,” ma ọ bụ bụrụ aha-ọkwá a na-akpọ “Kraịst.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịtụgharị ya dịka, “onye na-ejere ozi.” Okwu Grik bụ δοῦλος (doúlos) na-egosi onye bụ nke nna ukwu; e ji “ohu” mee ihe ebe a iji chekwaa echiche siri ike ahụ.
    reason: lexical_alternative
  - marker: c
    text: “Mgbasa” bụ aha e ji akọwa mgbasa ndị Juu bi n’èzí ala Izrel. N’ebe a, e nwere echiche dị iche banyere kpọmkwem ndị “ebo iri na abụọ” ahụ na-ekwu maka ha.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: Jemis
  rationale: Aha a na-ejikarị amata onye dere akwụkwọ a n’omenala nsụgharị Agba Ọhụrụ n’Igbo; ọ bụ ezie na ụdị Grik ahụ kwekọrọ n’aha Jekọb n’akụkọ ihe mere eme.
- source_word: θεοῦ
  choice: nke Chineke
  rationale: Ọ na-egosi onye nwe ohu ahụ n’ụzọ dị mfe, n’enweghị ịgbatị ihe ederede kwuru.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Ọ bụ aha-ọkwá e ji egosi ikike Jizọs ma bụrụkwa ụzọ a maara nke ọma e si asụ κύριος n’Igbo Ndị Kraịst.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  rationale: “Mesaya” na-echekwa ihe Χριστός pụtara dịka aha-ọkwá, ebe “bụ” na-eme ka okwu ahụ daa nke ọma n’Igbo.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-echekwa echiche siri ike nke ịbụ onye nwe mmadụ na nrubeisi zuru ezu, kama ime ka okwu ahụ bụrụ naanị onye na-ejere ozi.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: ebo iri na abụọ
  rationale: Ọ na-echekwa okwu ọgbụgba ndụ metụtara ebo Izrel iri na abụọ ma bụrụkwa okwu doro anya n’Igbo.
- source_word: διασπορᾷ
  choice: Mgbasa
  rationale: E ji ya dịka aha pụrụ iche maka ọnọdụ ndị Juu gbasasịrị n’èzí ala Izrel; nkọwa ala peeji na-eme ka ọ doo anya.
- source_word: χαίρειν
  choice: Ekele dịrị unu
  rationale: Nke a bụ usoro ekele e ji amalite akwụkwọ ozi; ịsụ ya dịka “ṅụrịanụ” ga-atụfu ọrụ ilu ahụ n’ebe a.
theological_decisions:
- issue: Nsụgharị Χριστοῦ n’okwu mmeghe
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a Χριστός ka na-arụ ọrụ dịka aha-ọkwá nke Onye Chineke tere mmanụ; e tinyere “Kraịst” n’ala peeji dịka ụzọ ọzọ ziri ezi.
- issue: Nsụgharị δοῦλος n’otú Jemis si kọwaa onwe ya
  choice: ohu
  alternative: onye na-ejere ozi
  rationale: “Ohu” na-echekwa echiche nke ịbụ nke Chineke na Onyenwe anyị Jizọs kpamkpam, ebe ụzọ ọzọ dị nro pụtara n’ala peeji.
- issue: Ndị “ebo iri na abụọ” bụ
  choice: E debere okwu ọgbụgba ndụ ahụ n’enweghị ịkọwa kpọmkwem ma ọ bụ naanị ndị Juu ka ọ na-ekwu ma ọ bụ ndị kwere ekwe n’ụzọ ihe atụ
  alternative: ịsụ ya dịka ndị Kraịst niile ma ọ bụ naanị ndị Juu bi ná mba ọzọ
  rationale: Ihe odide Grik n’onwe ya hapụrụ ohere n’otú a ga-esi ghọta ndị a na-agwa okwu; nsụgharị ahụ anaghị ekpebi esemokwu ahụ n’ime ahịrịokwu.
translation_notes:
  register: E ji Igbo Izugbe dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu “na-edegara ... akwụkwọ” na-eme ka dative nke onye a na-ezigara leta doo anya n’Igbo, ebe “Ekele dịrị unu” na-enye usoro mmeghe akwụkwọ ozi n’ụzọ eke. E ji mkpụrụedemede ukwu dee “Mgbasa” iji gosi na ọ bụ okwu pụrụ iche, ma tinye nkọwa ala peeji ka ndị na-agụ akwụkwọ ghọta ya.
