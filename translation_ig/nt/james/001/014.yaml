base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: ig
  text: Ma ọchịchọ nke aka ya na-anwa onye ọ bụla, na-adọkpụrụ ya pụọ ma na-arata ya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “agụụ nke aka ya” ma ọ bụ “ọchịchọ ọjọọ nke aka ya.” Okwu Grik ahụ nwere ike ịpụta ọchịchọ siri ike n’ozuzu ya; ọ bụghị naanị agụụ mmekọahụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu abụọ a na-enye ihe oyiyi nke ịdọpụta anụ pụọ na iji ihe oriri rata ya n’ọnyà, dịka azụ e ji nri nọ n’ụ̀dọ̀ rata.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: Nke a na-egosipụta na okwu ahụ metụtara onye n’otu n’otu, ma bụrụkwa ụzọ e si ekwu ya nke ọma n’Igbo.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi obere ọdịiche dị n’etiti amaokwu a na okwu bu ya ụzọ, nke kwuru na Chineke adịghị anwa onye ọ bụla.
- source_word: πειράζεται
  choice: a na-anwa
  rationale: N’ebe a, okwu Grik ahụ pụtara ịrata mmadụ ime mmehie, ọ bụghị nanị ịnwale ma ọ bụ inyocha ya.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: mgbe ọchịchọ nke aka ya
  rationale: Nhazi a na-egosi na ọchịchọ onye ahụ n’onwe ya bụ ihe na-akpata ọnwụnwa ahụ. “Nke aka ya” na-emesi ibu ọrụ nke onye ahụ ike.
- source_word: ἐπιθυμίας
  choice: ọchịchọ
  rationale: “Ọchịchọ” sara mbara nke ọma iji gosi agụụ siri ike nke nwere ike iduga ná mmehie, n’enweghị ime ka ọ bụrụ naanị agụụ mmekọahụ.
- source_word: ἐξελκόμενος
  choice: na-adọkpụrụ ya pụọ
  rationale: 'Nke a na-echekwa ihe oyiyi dị n’okwu Grik ahụ: a na-adọta ma ọ bụ na-adọkpụrụ mmadụ pụọ n’ebe ọ nọ.'
- source_word: καὶ δελεαζόμενος
  choice: ma na-arata ya
  rationale: “Na-arata” na-enye echiche nke iji ihe na-adọrọ mmasị rata anụ ma ọ bụ azụ banye n’ọnyà, ma ọ ka bụ okwu Igbo dị mfe ma doo anya.
theological_decisions:
- issue: Ebe ọnwụnwa si abịa n’ihe metụtara Chineke
  choice: Amaokwu ahụ kwuru na ọchịchọ nke onye ahụ n’onwe ya na-anwa ya, ọ bụghị Chineke.
  alternative: Ịsụgharị ya dị ka nanị ule sitere n’ọnọdụ ndị dị n’èzí.
  rationale: Amaokwu nke 13 kwuru na Chineke adịghị anwa onye ọ bụla, ebe amaokwu a na-akọwa ọchịchọ nke onye ahụ dị ka ihe na-akpata ọnwụnwa ahụ. Nsụgharị ahụ anaghị agbakwunye nkọwa banyere ihe ndị ọzọ nwere ike ịkpata ya.
- issue: Otu e si gosipụta onye nọchiri anya mmadụ niile
  choice: E ji “onye ọ bụla” na nnọchiaha “ya” mee ka okwu ahụ bụrụ maka onye n’otu n’otu.
  alternative: Iji okwu ọtụtụ mmadụ mee ya.
  rationale: Asụsụ Grik ji otu onye mee ihe n’ụzọ metụtara mmadụ niile. Igbo “ya” anaghị akọwa nwoke ma ọ bụ nwaanyị, ma ọ na-echekwa otu onye nke ahịrịokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ọdịiche ya na amaokwu bu ya ụzọ, ibu ọrụ nke onye n’otu n’otu, na ihe oyiyi abụọ nke ịdọkpụrụ pụọ na ịrata n’ọnyà.
