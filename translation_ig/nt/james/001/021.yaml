id: JAS.1.21
reference: James 1:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: ig
  text: Ya mere, wepụnụ ihe rụrụ arụ niile na ịba ụba nke ajọ omume[a], jirinụ obi dị nwayọọ[b] nabatanụ okwu ahụ a kụnyere[c], nke pụrụ ịzọpụta mkpụrụ obi unu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “oke ihe ọjọọ” ma ọ bụ “ajọ omume juru eju.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’ịdị nwayọọ” ma ọ bụ “n’ịdị umeala n’obi.”
    reason: lexical_alternative
  - marker: c
    text: 'A pụkwara ịsị, “okwu ahụ e kere n’ime mmadụ”; nsụgharị ọdịnala: “okwu ahụ a nyadoro.”'
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịsị, “ndụ unu” ma ọ bụ “unu onwe unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu ma ọ bụ ihe a na-adọta site n'okwu ndị bu ya ụzọ.
- source_word: ἀποθέμενοι
  choice: mgbe unu wepụsịrị
  rationale: Na-edobe ụdị participle nke Grik ma na-egosi omume metụtara iwu bụ́ ‘nabatanu,’ n'Igbo doro anya.
- source_word: πᾶσαν ῥυπαρίαν
  choice: ihe rụrụ arụ niile
  rationale: Na-echekwa echiche doro anya nke unyi omume na ihe na-adịghị ọcha, n'asụsụ ndị mmadụ na-aghọta.
- source_word: περισσείαν κακίας
  choice: oke ajọ omume
  rationale: ‘Oke’ na-egosi ịba ụba ma ọ bụ ihe gafere ókè; ‘ajọ omume’ na-enye echiche sara mbara nke κακία n'ebe a.
- source_word: ἐν πραΰτητι
  choice: jirinụ obi dị nwayọọ
  rationale: Na-egosi ịdị nwayọọ, ịdị umeala n'obi, na njikere ịnabata nkuzi, n'okwu Igbo e ji eme ihe ugbu a.
- source_word: δέξασθε
  choice: nabatanu
  rationale: Na-edobe iwu kpọmkwem nke Grik na echiche nke iji ọchịchọ nabata ihe.
- source_word: τὸν ἔμφυτον λόγον
  choice: okwu ahụ a kụnyere n'ime unu
  rationale: Na-echekwa ihe atụ nke ịkụ mkpụrụ nakwa echiche na okwu ahụ dịzi n'ime ndị na-anụ ya, n'emeghị ka usoro e si kụnye ya bụrụ nke a kọwara karịa isi mmalite.
- source_word: τὸν δυνάμενον σῶσαι
  choice: nke pụrụ ịzọpụta
  rationale: Na-ekwu na okwu ahụ nwere ike ịzọpụta, dịka participle nke Grik si kwuo, n'etinyeghị nkọwa ọzọ banyere usoro nzọpụta.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: mkpụrụ obi unu
  rationale: Na-edobe okwu ọdịnala na ịdị arọ nke okwu nzọpụta, ma ihe odide ala peeji na-egosi na ψυχή nwekwara ike ịpụta ndụ ma ọ bụ mmadụ n'onwe ya.
theological_decisions:
- issue: Ihe τὰς ψυχὰς ὑμῶν pụtara n'okwu gbasara nzọpụta
  choice: mkpụrụ obi unu
  alternative: ndụ unu; unu onwe unu
  rationale: Nhọrọ a na-edobe ịdị arọ nke okwu nzọpụta na ọdịnala ntụgharị, ma anaghị ekwu na ψυχή apụghị ịpụta ndụ ma ọ bụ mmadụ dum.
- issue: Echiche dị na τὸν ἔμφυτον λόγον
  choice: okwu ahụ a kụnyere n'ime unu
  alternative: okwu ahụ dị n'ime unu site n'ọmụmụ; okwu ahụ a nyadoro n'ime unu
  rationale: ‘A kụnyere’ na-echekwa ihe atụ nke ihe a tinyere ka o too, ma hapụkwara oghe ma okwu ahụ bụ nke Chineke tinyere ma ọ bụ okwu gbanyerela mkpọrọgwụ n'ime ndị na-anụ ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Ihe rụrụ arụ,’ ‘oke ajọ omume,’ na ‘obi dị nwayọọ’ na-edobe ịdị ike nke ndụmọdụ ahụ n'ejighị okwu ụka otu okpukpe pụrụ iche. Akara ihe odide ala peeji [a] ruo [d] niile dị n'ederede n'akụkụ okwu ha na-akọwa.
