id: JAS.1.25
reference: James 1:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: ig
  text: Ma onye ahụ nke lere anya nke ọma n’iwu zuru oke[a], ya bụ, iwu nke nnwere onwe, ma nọgide na ya—ọ bụghị onye na-anụ ihe ma na-echefu[b], kama ọ bụ onye na-eme ọrụ[c]—onye ahụ ga-abụ onye a gọziri agọzi n’ihe ọ na-eme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “iwu zuru oke nke nnwere onwe.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọ bụghị onye na-anụ ihe nke nchefu.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “onye na-eme ọrụ” ma ọ bụ “onye na-eme omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: leruru anya nke ọma n’ime
  rationale: Nke a na-egosi ilebanye anya nke ọma, ọ bụghị ile anya nkịtị; ọ na-edobekwa echiche nke ịkpọda onwe mmadụ lee ihe anya.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: iwu zuru oke, ya bụ iwu nke nnwere onwe
  rationale: E jidere nhazi nkọwa nke Grik, ebe ‘iwu nke nnwere onwe’ na-akọwa ‘iwu zuru oke,’ n’enweghị ịkọwapụta ozizi nke ahịrịokwu ahụ agaghị ekpebi.
- source_word: παραμείνας
  choice: nọgide na ya
  rationale: Ọ na-egosi ịnọgide na ihe ahụ mgbe niile, ọ bụghị naanị ile ya anya otu ugboro.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: ọ bụghị onye na-anụ ihe ma chefuo ya
  rationale: Nke a bụ Igbo doro anya ma kwekọọ n’echiche nkịtị nke ahịrịokwu Grik, nke pụtara onye na-anụ ma na-echefu.
- source_word: ποιητὴς ἔργου
  choice: onye na-eme ihe a chọrọ
  rationale: Grik kwuru n’ụzọ nkịtị ‘onye na-eme ọrụ/omume.’ Nsụgharị a na-ada nke ọma n’Igbo ma na-echekwa ọdịiche dị n’etiti ịnụ ihe na ime ya.
- source_word: μακάριος
  choice: onye a gọziri agọzi
  rationale: Nke a na-echekwa ịdị arọ nke okwu ahụ n’ihe gbasara ngọzi Chineke karịa naanị inwe obi ụtọ.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: n’ihe ọ na-eme
  rationale: Ọ bụ okwu Igbo dị ndụ nke na-echekwa njikọ ya na ‘onye na-eme ihe.’
- source_word: ὁ ... οὗτος
  choice: onye ahụ ... onye ahụ
  rationale: Ọ na-echekwa otu onye nnọchianya nke Grik ma ghara ime ka okwu ahụ bụrụ naanị maka nwoke.
theological_decisions:
- issue: Ihe ‘iwu nke nnwere onwe’ pụtara
  choice: E debere ya dịka ‘iwu nke nnwere onwe.’
  alternative: ‘iwu nke na-enye nnwere onwe’ ma ọ bụ ịkọwa ya dịka ozi ọma ma ọ bụ iwu omume
  rationale: Grik anaghị amanye otu nkọwa ozizi pụrụ iche; idebe ahịrịokwu ahụ na-echekwa obosara na esemokwu nkọwa ya.
- issue: Nwoke otu onye e ji anọchi anya mmadụ niile
  choice: ‘onye ahụ’
  alternative: ‘nwoke ahụ’
  rationale: N’ebe a, ụdị nwoke otu onye na Grik na-anọchi anya onye ọ bụla, ọ bụghị naanị nwoke.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ya bụ’ mee ka njikọ nkọwa dị n’etiti iwu zuru oke na iwu nke nnwere onwe doo anya, na-enweghị idozi ihe okwu ahụ pụtara n’ụzọ ozizi.
