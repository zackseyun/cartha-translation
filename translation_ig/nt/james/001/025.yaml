revisions:
- from: Ma onye ahụ nke leruru anya nke ọma n’ime iwu zuru oke[a], ya bụ iwu nke nnwere onwe, ma nọgide na ya—ọ bụghị onye na-anụ ihe ma chefuo ya[b], kama ọ bụ onye na-eme ihe a chọrọ[c]—onye ahụ ga-abụ onye a gọziri agọzi n’ihe ọ na-eme.
  to: Ma onye ahụ nke lere anya nke ọma n’iwu zuru oke[a], ya bụ, iwu nke nnwere onwe, ma nọgide na ya—ọ bụghị onye na-anụ ihe ma na-echefu[b], kama ọ bụ onye na-eme ọrụ[c]—onye ahụ ga-abụ onye a gọziri agọzi n’ihe ọ na-eme.
  rationale: The revision replaces the interpretively expanded “onye na-eme ihe a chọrọ” with “onye na-eme ọrụ,” preserving the explicit Greek contrast between hearing and doing work/deed. It also makes the expression for looking intently more idiomatic and removes an unnecessary explicit object from “na-echefu,” while retaining the passage’s meaning, register, and theological ambiguity.
