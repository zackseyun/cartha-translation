  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: ig
  text: Ọ sịrị ha, “Gịnị mere obi adịghị unu jụụ, gịnịkwa mere obi abụọ[a] ji apụta n’ime obi unu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “echiche” ma ọ bụ “ntụgharị uche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Gịnị mere
  rationale: N’agbanyeghị na τί pụtara ‘gịnị’ n’ụdị nkịtị, n’usoro okwu a ọ na-ajụ ihe kpatara ọnọdụ ha; ‘Gịnị mere’ bụ Igbo doro anya ma kwekọọ na ya.
- source_word: τεταραγμένοι
  choice: obi ji na-enye unu nsogbu
  rationale: Perfect passive participle a na-egosi ọnọdụ ọgba aghara dị n’ime ha nke ka dị ugbu a. Akpaalaokwu Igbo a na-egosipụta nchekasị na mgbagwoju anya ahụ n'ụzọ ebumpụta ụwa.
- source_word: διαλογισμοὶ
  choice: obi abụọ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’echiche na ajụjụ ndị na-eme ka ha ghara ikwere ihe ha hụrụ. ‘Obi abụọ’ na-egosipụta ntụgharị uche na-enweghị nkwenye a, ebe ndetu na-echekwa nkọwa ndị ọzọ okwu Grik ahụ pụrụ inwe.
- source_word: ἀναβαίνουσιν
  choice: ji apụta
  rationale: Ọ bụ ezie na ngwaa ahụ pụtara n’ụzọ nkịtị ‘ịrị elu,’ ebe a ọ na-ekwu n’ụzọ atụ maka echiche na-ebili n’ime mmadụ; ‘apụta’ bụ okwu Igbo dị mfe ma bụrụkwa ihe e bu n’obi.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: n’ime obi unu
  rationale: Grik ji καρδίᾳ n’otu ọnụọgụ ya na ὑμῶν nke ọtụtụ. Igbo ‘obi unu’ na-arụkwa ọrụ nkesa a n'ụzọ ebumpụta ụwa, na-emetụta onye ọ bụla n’ime ha.
- source_word: καρδία
  choice: obi
  rationale: ‘Obi’ na-echekwa echiche Akwụkwọ Nsọ banyere ime mmadụ dịka ebe echiche, mmetụta, na mkpebi si apụta; ‘uche’ naanị ya ga-eme ka nghọta ahụ dị warara.
theological_decisions:
- issue: Okwu gbasara ime mmadụ, καρδία
  choice: obi
  alternative: uche; ime mmadụ
  rationale: Amaokwu ahụ na-etinye ntụgharị uche n’obi, dịka nghọta Akwụkwọ Nsọ si ahụ obi dịka ebe echiche na mmetụta nọ. Ide ‘obi’ na-echekwa obosara echiche ahụ n’enweghị ime ya naanị ihe gbasara mmetụta ma ọ bụ uche.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘obi ji na-enye unu nsogbu’ mee ka ọnọdụ τεταραγμένοι daa nke ọma n’Igbo; nkwughachi ‘obi’ dị n’amaokwu ahụ na-esokwa ọdịdị okwu Igbo ma na-echekwa njikọ dị n’etiti nsogbu ime ha, obi abụọ, na obi dịka ebe echiche.
