reference: Luke 24:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: ig
  text: Lee aka m abụọ na ụkwụ m abụọ[a], ka unu mata na ọ bụ mụ onwe m. Metụnụ m aka[b], hụnụ, n’ihi na mmụọ[c] enweghị anụ ahụ na ọkpụkpụ dịka unu na-ahụ na m nwere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị, “n’ihi na ọ bụ mụ onwe m.” Okwu Grik ahụ na-ekwusi ike: “Ọ bụ mụ onwe m.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “jirinụ aka nyochaa m” ma ọ bụ “metụnụ m.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mọ.” Okwu Grik bụ “mmụọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: Lee ... leekwanụ
  rationale: Okwu iwu a na-akpọ ndị na-ege ntị ka ha nyochaa ya anya ozugbo. “Lee” na “leekwanụ” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ abụọ ahụ.
- source_word: χεῖράς ... πόδας
  choice: aka m abụọ ... ụkwụ m abụọ
  rationale: A tụgharịrị akụkụ ahụ ndị a ozugbo; itinye “abụọ” na-eme ka okwu ahụ bụrụ Igbo eke ma ghara ịgbanwe ihe Grik pụtara.
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: ka unu mata na ọ bụ mụ onwe m
  rationale: Nke a na-egosipụta ihe ha kwesịrị ịmata site n’ile aka na ụkwụ ya. “Mụ onwe m” na-echekwa nkwusi ike nke ἐγώ ... αὐτός n’enweghị ịgbakwunye nkọwa nkà mmụta okpukpe.
- source_word: ψηλαφήσατέ
  choice: Metụnụ m aka
  rationale: Ngwaa ahụ pụtara imetụ ma ọ bụ iji aka nyochaa. Nsụgharị a bụ Igbo a na-asụ ugbu a ma na-egosi nyocha anụ ahụ.
- source_word: πνεῦμα
  choice: mmụọ
  rationale: “Mmụọ” bụ ihe kwekọrọ ozugbo na πνεῦμα ma na-echekwa ohere okwu Grik nwere, karịa ịhọrọ okwu pụrụ iche dịka “mọ.”
- source_word: σάρκα καὶ ὀστέα
  choice: anụ ahụ na ọkpụkpụ
  rationale: N’ebe a σάρξ na-ekwu maka ahụ nkịtị. “Anụ ahụ na ọkpụkpụ” na-echekwa ihe atụ ahụ n’ụzọ doro anya.
- source_word: θεωρεῖτε
  choice: unu na-ahụ
  rationale: Ọ bụ ịhụ ma ọ bụ ilebara anya nke ọma; “unu na-ahụ” bụ okwu Igbo eke n’ọnọdụ a.
- source_word: ἔχοντα
  choice: na m nwere
  rationale: A gbanwere participle Grik ka ọ bụrụ nkebiokwu Igbo zuru ezu, nke na-echekwa njikọ ya na Jizọs.
theological_decisions:
- issue: Ezi ịdị n’ahụ nke Jizọs mgbe o si n’ọnwụ bilie
  choice: E debere okwu banyere imetụ ya aka na inwe anụ ahụ na ọkpụkpụ n'ụzọ doro anya.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka ọdịiche dị n’etiti ahụ na mmụọ ghara ịpụta nke ọma.
  rationale: Ihe odide Grik na-ekwusi ike n’ihe ndị mmadụ pụrụ ịhụ na imetụ aka. Nsụgharị ahụ na-echekwa nkwupụta a n’enweghị ịgbakwunye nkọwa ụka ọ bụla.
- issue: Ọrụ nke ὅτι n’ahịrịokwu mbụ
  choice: “ka unu mata na” dị ka ọdịnaya nke ihe ile ahụ ga-eme ka ha mata.
  alternative: “n’ihi na ọ bụ mụ onwe m,” nke ga-ewere ὅτι dị ka ihe kpatara iwu ahụ.
  rationale: Grik nwere ike ikwe ka e nwee nghọta abụọ, ma n’ọnọdụ a ọdịnaya nke ihe ha ga-amata dabara nke ọma. Ihe e dere n’akwụkwọ ala na-echekwa ụzọ ọzọ ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ mee iwu ndị ahụ (“unu”), ma e zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
