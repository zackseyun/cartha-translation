review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the principal bodily-verification sense: the plural imperatives, hands and feet, emphatic personal identification, touching, and the contrast between spirit and flesh and bones. “Ka unu mata na” is an acceptable idiomatic way to express the recognition prompted by seeing, though it is slightly more explicit than the Greek content clause. The second ἴδετε is better represented by “hụnụ” than “leekwanụ,” which can suggest looking again rather than seeing/observing.'
  naturalness: The revised wording is natural Standard Igbo, direct, and suitably dignified. “Mmụọ enweghị anụ ahụ na ọkpụkpụ” is more idiomatic than “mmụọ adịghị enwe …” in this general statement.
  terminology: “Mmụọ,” “anụ ahụ,” and “ọkpụkpụ” appropriately render πνεῦμα, σάρξ, and ὀστέα in this concrete context. “Mụ onwe m” adequately conveys the emphatic ἐγώ εἰμι αὐτός without importing theological interpretation.
  issues:
  - severity: medium
    issue: Footnote b is anchored after the second visual imperative rather than after “Metụnụ m aka.”
    rationale: Its content gives alternatives for ψηλαφήσατέ (“Touch me”), not for ἴδετε (“see”). The anchor must be moved to the touch expression.
  - severity: low
    issue: “Leekwanụ” is less precise for the second ἴδετε.
    rationale: The connective -kwa and the form can carry a sense such as “look also/again”; “hụnụ” naturally conveys the requested visual confirmation in this context.
  - severity: low
    issue: “adịghị enwe” is somewhat less idiomatic in this generic assertion.
    rationale: “Enweghị” gives a more natural Standard Igbo expression for a spirit’s lack of flesh and bones.
  revised_text: Lee aka m abụọ na ụkwụ m abụọ[a], ka unu mata na ọ bụ mụ onwe m. Metụnụ m aka[b], hụnụ, n’ihi na mmụọ[c] enweghị anụ ahụ na ọkpụkpụ dịka unu na-ahụ na m nwere.
