translation:
  language: ig
  text: Ha wee nye ya otu iberibe azụ a ṅara n'ọkụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ndị e dere mgbe e mesịrị tinyere, “na otu ebe mmanụ aṅụ.”
    reason: textual_variant
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ha wee
  rationale: οἱ na-arụ ọrụ dị ka nnọchiaha ‘ha,’ na-ezo aka ná ndị na-eso ụzọ gbakọtara; δέ bụ njikọ dị nro. ‘Ha wee’ na-enye usoro akụkọ dị mma n'Igbo n'emeghị ka ọ bụrụ mmegide siri ike.
- source_word: ἐπέδωκαν
  choice: nye
  rationale: Aorist active indicative nke ἐπιδίδωμι pụtara inye ma ọ bụ nyefee. ‘Nye’ bụ okwu Igbo nkịtị ma doo anya n'ọnọdụ a.
- source_word: αὐτῷ
  choice: ya
  rationale: Dative indirect object na-egosi onye e nyere ihe ahụ; n'Igbo, ‘nye ya’ bụ usoro okwu ebumpụta ụwa.
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: otu iberibe azụ a ṅara n'ọkụ
  rationale: μέρος bụ isi okwu nke pụtara ‘iberibe’ ma ọ bụ ‘òkè’; ἰχθύος ὀπτοῦ na-akọwa na iberibe ahụ bụ nke azụ e siri site n'ịṅara ya n'ọkụ.
- source_word: ὀπτοῦ
  choice: a ṅara n'ọkụ
  rationale: ὀπτός na-egosi nri e siri site n'ịṅara ma ọ bụ ịkpọ ya ọkụ. ‘A ṅara n'ọkụ’ bụ okwu Igbo doro anya nke na-edobe ụzọ esi kwadebe azụ ahụ.
theological_decisions:
- issue: Ụdị ederede Luk 24:42
  choice: 'A sụgharịrị naanị ederede SBLGNT: ‘otu iberibe azụ a ṅara n''ọkụ.’'
  alternative: Ụfọdụ ihe odide ndị e dere mgbe e mesịrị tinyere ‘na otu iberibe ụgbụ mmanụ aṅụ.’
  rationale: Ederede Grik e nyere kwụsịrị na μέρος, o nweghị okwu gbasara ụgbụ mmanụ aṅụ. Ya mere, isi ederede na-agbaso SBLGNT, ebe ndetu ala na-egosi ụdị ederede ogologo ahụ maka nghọta zuru oke.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee nsọpụrụ. ‘Ha wee’ na-eme ka usoro akụkọ na-aga nke ọma; ‘azụ a ṅara n'ọkụ’ bụ nkọwa ebumpụta ụwa nke azụ e roasted/broiled.
