source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ⸂εἷς ὀνόματι⸃ Κλεοπᾶς εἶπεν πρὸς αὐτόν· Σὺ μόνος παροικεῖς Ἰερουσαλὴμ καὶ οὐκ ἔγνως τὰ γενόμενα ἐν αὐτῇ ἐν ταῖς ἡμέραις ταύταις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: ig
  text: Mgbe ahụ, otu onye n’ime ha, onye aha ya bụ Kliopas, zara ya sị, “Ọ bụ naanị gị bụ onye ọbịa na Jerusalem, onye na-amaghị ihe ndị mere n’ebe ahụ n’ụbọchị ndị a?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụ naanị gị na-anọ na Jerusalem dịka onye ọbịa, onye na-amaghị ihe ndị mere n’ebe ahụ n’ụbọchị ndị a?” Ngwaa Grik ahụ nwere echiche nke ibi ma ọ bụ ịnọ n’ebe ahụ dịka onye si n’èzí ma ọ bụ onye bi nwa oge.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Mgbe ahụ ... zara
  rationale: A tụgharịrị δέ dị ka njikọ akụkọ dị nro, “Mgbe ahụ,” ebe “zara” na-egosipụta ἀποκριθείς n’ụzọ Igbo na-asụkarị.
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: otu onye n’ime ha, onye aha ya bụ Kliopas
  rationale: “N’ime ha” sitere n’ọnọdụ okwu ahụ, ebe εἷς na-ezo aka n’otu n’ime ndị na-eso ụzọ abụọ ahụ; ὀνόματι na-egosi aha onye ahụ.
- source_word: εἶπεν πρὸς αὐτόν
  choice: sị ... ya
  rationale: Njikọ “zara ya sị” bụ ụzọ Igbo sitere n’okike isi webata okwu a kpọrọ kpọmkwem, ma na-edobe onye nnọchi anya nke Grik kama itinye aha Jizọs.
- source_word: Σὺ μόνος
  choice: Ọ bụ naanị gị
  rationale: Nke a na-edobe ike exclusivity nke μόνος ma na-eme ajụjụ ahụ ka ọ daa nke ọma n’Igbo.
- source_word: παροικεῖς
  choice: bụ onye ọbịa na
  rationale: “Onye ọbịa” na-egosi onye nọ n’obodo ahụ dị ka onye si n’èzí ma ọ bụ onye na-anọ nwa oge, ọ bụghị naanị onye bịara leta otu ụbọchị.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Aha obodo a bụ ụdị a maara nke ọma n’Igbo.
- source_word: οὐκ ἔγνως
  choice: na-amaghị
  rationale: Ọ bụ ezie na ngwaa Grik bụ aorist, ajụjụ ahụ na-elekwasị anya n’ọnọdụ onye ahụ ugbu a—na ọ maghị ihe ndị mere ọhụrụ.
- source_word: τὰ γενόμενα
  choice: ihe ndị mere
  rationale: Nke a na-egosipụta participle e jiri dị ka aha, na-enweghị ịgbakwunye nkọwa gbasara ụdị ihe omume ndị ahụ.
- source_word: ἐν αὐτῇ
  choice: n’ebe ahụ
  rationale: Ọ na-ezo aka na Jerusalem; “n’ebe ahụ” bụ Igbo sitere n’okike karịa “n’ime ya” mgbe a na-ekwu maka obodo.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: n’ụbọchị ndị a
  rationale: Nke a dị nso n’okwu Grik ma na-ezo aka n’ụbọchị ole na ole gara aga ruo n’oge ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Onye ọbịa” na-edobe echiche nke παροικεῖς, ebe nkọwa ala peeji na-echekwa echiche sara mbara nke ịnọ ma ọ bụ ibi dị ka onye si n’èzí.
