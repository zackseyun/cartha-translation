    issue: Potentially ambiguous relative-clause attachment
    rationale: In ‘onye ọbịa na Jerusalem nke na-amaghị,’ ‘nke’ follows the place name and may briefly be read as modifying Jerusalem. ‘..., onye na-amaghị ...’ is more natural and unambiguous without changing the meaning.
