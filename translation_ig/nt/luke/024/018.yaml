  verdict: revise
  source_fidelity: The draft accurately represents the mild narrative connective, Cleopas’s name, the emphatic ‘you alone,’ Jerusalem, the recent events, and the rhetorical question. ‘Onye ọbịa’ is a defensible contextual rendering of παροικεῖς, while the footnote appropriately preserves its fuller sense of residing as an outsider or temporary resident.
  naturalness: The sentence is generally clear Standard Igbo, but the relative clause introduced by ‘nke’ immediately after ‘Jerusalem’ can momentarily attach ambiguously to the city. Repeating ‘onye’ after a comma makes it unmistakable that the clause describes the visitor. The footnote benefits from the same adjustment.
  terminology: ‘Kliopas,’ ‘Jerusalem,’ and ‘onye ọbịa’ are suitable. No theological terminology is at issue.
