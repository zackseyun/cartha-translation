  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: ig
  text: Ma e jidere anya ha ka ha ghara ịmata ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e gbochiri anya ha ka ha ghara ịmata ya,” ma ọ bụ “e mere ka ha ghara ịmata ya.” Asụsụ Grik ekwughị onye jidere ma ọ bụ gbochiri ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: 'Njikọ a na-egosi obere ntụgharị ma ọ bụ ọdịiche n’akụkọ ahụ: Jizọs nọ ha nso, ma ha amataghị ya.'
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: anya ha
  rationale: Nke a na-edobe ihe oyiyi anụ ahụ dị n’asụsụ Grik ma bụrụkwa ụzọ Igbo nkịtị si ekwu ya.
- source_word: ἐκρατοῦντο
  choice: e gbochiri
  rationale: Okwu a na-egosi na e jidere ma ọ bụ gbochie ha n’ụzọ ụfọdụ. Mkpụrụokwu Igbo a na-edobe olu nnara ahụ ma ghara ịkpọ onye mere ya aha.
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: ịmata
  rationale: N’ebe a, ἐπιγινώσκω pụtara ịmata onye ahụ, ọ bụghị naanị inwe ihe ọmụma banyere ya. Njikọ ya na ‘e gbochiri’ na-egosi ihe a gbochiri ha ime.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka ihe e kwesịrị ịmata.
theological_decisions:
- issue: Ma a ga-akpọ onye gbochiri ha ịmata Jizọs aha
  choice: 'A hapụrụ onye mere ya n’ekwughị, sị: ‘e gbochiri anya ha ịmata ya.’'
  alternative: Ịsị ‘Chineke gbochiri anya ha’ ma ọ bụ ịtụgharị ya naanị ka ‘ha enweghị ike ịmata ya.’
  rationale: Asụsụ Grik ji olu nnara ma ọ kpọghị onye mere ihe ahụ aha. Nsụgharị a anaghị ekpebi na Chineke bụ onye mere ya, ọ naghịkwa ewepụ echiche na ihe dị n’èzí gbochiri ha.
translation_notes:
  register: Standard Igbo; okwu dị mfe, nke oge a, ma nwee ugwu. E debere ‘anya ha’ iji chekwaa ihe oyiyi doro anya nke Grik, e jikwa ahịrịokwu na-adịghị akpọ onye mere ihe ahụ aha chekwaa mgbagwoju anya dị na isi mmalite.
