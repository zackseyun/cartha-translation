revisions:
- from: Ma e gbochiri anya ha ịmata ya[a].
  to: Ma e jidere anya ha ka ha ghara ịmata ya[a].
  rationale: The revision supplies the natural Igbo result clause “ka ha ghara,” preserves the passive and its unstated agent, and uses “e jidere” to represent the restraining sense of the Greek verb. The alternative renderings remain in the footnote without resolving who caused their failure to recognize him.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the concrete subject “anya ha,” the passive construction with no named agent, and the sense of recognition rather than general knowledge. However, “e gbochiri anya ha ịmata ya” is syntactically compressed and does not express the Greek infinitival result as clearly as Standard Igbo normally does.
  naturalness: Adding “ka ha ghara” makes the result/complement explicit and produces a more natural, immediately clear Standard Igbo sentence. “E jidere anya ha” is a close, idiomatic rendering of the passive ἐκρατοῦντο (“were held/restrained”).
  terminology: “Ịmata ya” is appropriate here for recognizing Jesus. No theological agent is supplied. The footnote preserves legitimate alternatives and explicitly notes that Greek does not identify the agent.
  issues:
  - severity: medium
    issue: The main clause omits an explicit result construction after “e gbochiri.”
    rationale: In this context, Standard Igbo is clearer with “ka ha ghara ịmata ya,” corresponding to the Greek τοῦ μὴ ἐπιγνῶναι (“so that they would not recognize him” / “from recognizing him”).
  - severity: low
    issue: “E jidere” better reflects the lexical image of κρατέω than the draft’s main wording “e gbochiri.”
    rationale: κρατέω in the passive denotes being held or restrained. “E jidere anya ha” retains this image while leaving the agent unstated.
  revised_text: Ma e jidere anya ha ka ha ghara ịmata ya[a].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e gbochiri anya ha ka ha ghara ịmata ya,” ma ọ bụ “e mere ka ha ghara ịmata ya.” Asụsụ Grik ekwughị onye jidere ma ọ bụ gbochiri ha.
    reason: lexical_alternative
  revision_rationale: The revision supplies the natural Igbo result clause “ka ha ghara,” preserves the passive and its unstated agent, and uses “e jidere” to represent the restraining sense of the Greek verb. The alternative renderings remain in the footnote without resolving who caused their failure to recognize him.
