  verdict: revise
  source_fidelity: 'The draft accurately conveys the command to remain in the city and preserves the clothing metaphor. However, “e ji ike si n’elu yikwasị unu” reverses the Greek construction: it says, in effect, that power is used as the means of clothing them, whereas δύναμιν is what they are clothed with. The revision restores this relationship.'
  naturalness: The revised passive construction, “e yikwasịrị unu ike si n’elu,” is natural, clear Standard Igbo and retains the metaphor without unnecessary explanation.
  terminology: “nkwa Nna m kwere” appropriately renders “the promise of my Father” without identifying the promise beyond the verse. “ike si n’elu” faithfully retains the source’s open wording and register.
  issues:
  - severity: medium
    issue: The phrase “e ji ike si n’elu yikwasị unu” makes power the instrument used to clothe the disciples.
    rationale: Greek ἐνδύσησθε … δύναμιν means that the disciples are to be clothed with power. Removing “ji” makes “ike si n’elu” the thing placed upon them, preserving both grammar and imagery.
  revised_text: Ma lee, ana m ezitere unu nkwa Nna m kwere. Ma unu onwe unu, nọrọnụ n’obodo ahụ ruo mgbe e yikwasịrị unu ike si n’elu.
