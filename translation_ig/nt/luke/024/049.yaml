id: LUK.24.49
reference: Luke 24:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: ig
  text: Ma lee, ana m ezitere unu nkwa Nna m kwere. Ma unu onwe unu, nọrọnụ n’obodo ahụ ruo mgbe e yikwasịrị unu ike si n’elu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: Ma lee
  rationale: Na-adọta uche onye na-agụ ya n’ụzọ dị ndụ ma kwekọọ n’ọrụ okwu Grik ahụ.
- source_word: ἐξαποστέλλω
  choice: ana m ezitere
  rationale: Oge ugbu a na-egosi ihe Jizọs na-aga ime n’ezie; ‘ezitere’ na-edobe echiche nke iziga ihe bịakwasị ndị na-eso ụzọ.
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: nkwa Nna m kwere
  rationale: N’Igbo, nke a na-eme ka o doo anya na ‘nkwa’ bụ ihe Nna kwere, n’enweghị ịkọwa ya karịa ihe amaokwu ahụ kwuru.
- source_word: καθίσατε ἐν τῇ πόλει
  choice: nọrọnụ n’obodo ahụ
  rationale: καθίσατε pụtara ịnọgide ma ọ bụ ichere n’otu ebe; ‘nọrọnụ’ bụ Igbo nkịtị ma kwesị ekwesị. Mkpụrụokwu ahụ na-ezo aka n’obodo a maara n’okwu gbara ya gburugburu.
- source_word: ἐνδύσησθε
  choice: e ji ... yikwasị unu
  rationale: Na-echekwa ihe atụ nke iyi uwe kama ịgbanwe ya gaa naanị n’echiche nke ‘ịnata.’
- source_word: ἐξ ὕψους δύναμιν
  choice: ike si n’elu
  rationale: Na-edobe ma okwu ‘ike’ ma ebe o si bịa, n’enweghị ịgbakwunye nkọwa pụrụ iche.
theological_decisions:
- issue: Ihe ‘nkwa Nna’ na ‘ike si n’elu’ na-ezo aka na ya
  choice: E debere okwu abụọ ahụ dịka ihe atụ na nkọwa nke amaokwu ahụ n’onwe ya si dị.
  alternative: Ịkpọ ya kpọmkwem ‘Mmụọ Nsọ.’
  rationale: Ọ bụ ezie na okwu gbara ya gburugburu na Akwụkwọ Ọrụ Ndịozi na-enye aka ịmata ihe a na-ekwu, amaokwu a ejighị aha ahụ kpọmkwem; ya mere, a zere itinye nkọwa ahụ n’ime isi ederede.
- issue: Oge nke ἐξαποστέλλω
  choice: ana m ezitere
  alternative: aga m ezitere
  rationale: A nọgidere na ọdịdị oge ugbu a nke Grik, nke nwere ike igosi ihe na-abịanụ dị ka ihe a na-emezu n’ụzọ doro anya, kama idozi ya naanị dịka ọdịnihu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ‘unu onwe unu’ nye ὑμεῖς δέ ntakịrị nkwusi ike, ma e zere okwu ochie ma ọ bụ nkọwa ụka pụrụ iche.
