  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: ig
  text: Ọ sịrị ha, “Gịnị bụ okwu ndị a unu na-akparịta n’etiti onwe unu ka unu na-aga?”[a] Ha wee kwụsị[b], ihu ha na-egosi mwute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnị bụ ihe ndị a unu na-atụle n’etiti onwe unu ka unu na-aga?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ha wee guzo otu ebe, ihu ha adaa mba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: Ọ sịrị
  rationale: Nke a na-edobe ngwaa nkịtị λέγω dị ka ‘sị’ kama ịkọwa ya kpọmkwem dị ka ‘jụọ,’ ọ bụ ezie na ihe o kwuru bụ ajụjụ.
- source_word: δὲ
  choice: wee
  rationale: δὲ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu; ‘wee’ bụ ụzọ Igbo sitere n’okike isi jikọta omume a na ihe bu ya ụzọ.
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: Gịnị bụ okwu ndị a
  rationale: ‘Okwu’ na-egosipụta λόγοι n’ụzọ doro anya, ebe ‘ndị a’ na-atụ aka ná mkparịta ụka Jizọs nụrụ.
- source_word: ἀντιβάλλετε
  choice: unu na-akparịta
  rationale: ‘Na-akparịta’ na-egosi na ha na-atụgharị okwu azụ na ihu n’etiti onwe ha, n’enweghị ịmanye echiche na ha na-ese okwu.
- source_word: πρὸς ἀλλήλους
  choice: n’etiti onwe unu
  rationale: Nkebi a na-egosi omume na-aga n’etiti mmadụ abụọ ahụ; okwu Igbo a na-eme ka mmekọrịta ahụ doo anya.
- source_word: περιπατοῦντες
  choice: ka unu na-aga
  rationale: Nke a na-egosi na mkparịta ụka ahụ na njem ha mere n’otu oge, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἐστάθησαν
  choice: Ha wee kwụsị
  rationale: N’ebe a, ụdị ἵστημι a pụtara na ha bịara kwụsị ịga; ‘kwụsị’ na-ebupụta mmegharị akụkọ ahụ nke ọma.
- source_word: σκυθρωποί
  choice: ihu ha na-egosi mwute
  rationale: σκυθρωποί na-akọwa ọdịdị ihu dara mba ma ọ bụ nke mwute; nsụgharị a na-edobe akụkụ a na-ahụ anya nke okwu ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘na-akparịta’ maka mkparịta ụka na-aga azụ na ihu, ebe e zere okwu nwere ike ịpụta na ha na-ese okwu. A kọwara σκυθρωποί site n’ọdịdị ihu iji chekwaa ihe okwu Grik ahụ na-egosi.
