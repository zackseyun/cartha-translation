id: LUK.24.21
reference: Luke 24:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: ig
  text: Ma anyị nọ na-atụ anya na ọ bụ ya bụ onye ahụ na-aga ịgbapụta Izrel.[a][b] Ma e wezụga ihe ndị a niile, taa bụzi ụbọchị nke atọ kemgbe ihe ndị a mere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na ọ bụ ya bụ onye ahụ ga-agbapụta Izrel.” Grik ji ngwaa oge ugbu a (“ọ bụ”) mee ihe n’ime ihe ha nọ na-atụ anya n’oge gara aga.
    reason: alternative_reading
  - marker: b
    text: “Ịgbapụta Izrel” nwere ike izo aka n’ozuzu ya n’ntọhapụ a tụrụ anya n’aka Mesaya; ihe odide ahụ akọwaghị ma ndị na-ekwu okwu bu n’obi ntọhapụ ọchịchị, nzọpụta ime mmụọ, ma ọ bụ ha abụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Ma anyị
  rationale: δέ na-egosi ọdịiche n’ihe a kọrọ tupu ya, ebe ἡμεῖς na-emesi ‘anyị’ ike; ‘Ma anyị’ na-egosipụta ha abụọ n’Igbo dị mfe.
- source_word: ἠλπίζομεν
  choice: anyị nọ na-atụ anya
  rationale: Ụdị imperfect na-egosi olileanya gara n’ihu n’oge gara aga, nke ihe mere mechara daa mba.
- source_word: ὅτι αὐτός ἐστιν
  choice: na ọ bụ ya
  rationale: Nke a na-edobe present ἐστιν dị n’ime ihe ha nọ na-atụ anya, kama ịgbanwe ya kpamkpam ka ọ bụrụ oge gara aga.
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: onye ahụ na-aga ịgbapụta
  rationale: ‘Na-aga’ na-egosipụta ihe a tụrụ anya na ọ ga-eme, ebe ‘ịgbapụta’ na-echekwa echiche nke ntọhapụ na mgbapụta.
- source_word: τὸν Ἰσραήλ
  choice: Izrel
  rationale: Ọ na-ezo aka n’Izrel dịka ndị mmadụ n’ozuzu ha, dịka isiokwu Grik si kwuo ya kpọmkwem.
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: Ma e wezụga ihe ndị a niile
  rationale: Nkebi a na-agbakwụnye ihe ọzọ na-akụda mmụọ n’ihe niile e kwuburu, n’ụzọ Igbo na-ada nke ọma.
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: taa bụzi ụbọchị nke atọ
  rationale: ἄγει bụ akpaala okwu gbasara oge eruola; ‘bụzi’ na-egosi na oge eruola n’ụbọchị nke atọ.
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: kemgbe ihe ndị a mere
  rationale: ‘Kemgbe’ na-egosi ebe a malitere ịgụ oge nke ọma na Igbo.
theological_decisions:
- issue: Ihe ‘ịgbapụta Izrel’ pụtara n’olileanya Mesaya
  choice: Edebere ‘ịgbapụta Izrel’ n’enweghị ịkọwa ụdị mgbapụta ahụ.
  alternative: Ịnapụta Izrel n’aka ọchịchị ndọrọ ndọrọ ọchịchị; ma ọ bụ ịzọpụta Izrel n’ụzọ ime mmụọ.
  rationale: Ihe odide ahụ ekwughị ma ọ bụ naanị ntọhapụ ndọrọ ndọrọ ọchịchị, nzọpụta ime mmụọ, ma ọ bụ ha abụọ; ntụgharị ahụ na-echekwa oghere na esemokwu echiche ahụ.
- issue: Oge nke ἐστιν mgbe ἠλπίζομεν gasịrị
  choice: ‘na ọ bụ ya ... na-aga ịgbapụta’
  alternative: ‘na ọ bụ ya bụ onye ahụ gaara agbapụta Izrel’ ma ọ bụ ‘na ọ bụ ya bụ onye ahụ chọrọ ịgbapụta Izrel.’
  rationale: Nhọrọ a na-echekwa present dị na Grik n’ime ọdịnaya olileanya ha gara aga, ma gburugburu okwu ahụ ka na-egosi na ha adaala mba.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. E ji ‘nọ na-atụ anya’ chekwaa omume gara n’ihu, ‘bụzi’ gosipụta oge eruola, ma hapụ ‘ịgbapụta Izrel’ ka ọ ghara ịkọwa ihe odide ahụ karịa ka o kwuru.
