- from: Ha na-akparịta ụka banyere ihe ndị a niile mere.[a]
  to: Ha nọ na-akparịta ụka banyere ihe niile ndị a mere.[a]
  rationale: The revision makes the Greek imperfect’s past ongoing sense explicit with “nọ na-” and slightly improves the ordering of the event phrase. It retains the natural reciprocal force of “akparịta ụka,” the comprehensive force of πάντων, and the completed-event meaning of συμβεβηκότων without introducing interpretive detail.
