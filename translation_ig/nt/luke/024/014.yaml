  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: ig
  text: Ha nọ na-akparịta ụka banyere ihe niile ndị a mere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ha nọ na-akparịta ụka banyere ihe omume niile ndị a weere ọnọdụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na-
  rationale: N'usoro akụkọ Igbo, njikọ a na-aga n'ihu nke ọma site n'iji usoro ngwaa jikọrọ ihe omume ahụ na nke bu ya ụzọ, kama ịgbakwunye nkọwa oge na-adịghị na Greek.
- source_word: αὐτοὶ
  choice: Ha
  rationale: Nnọchiaha Greek pụtara ìhè, ma ike nkwusi ya adịghị ukwuu ebe a; “Ha” bụ ụzọ Igbo si kwuo ya n'ụzọ ebumpụta ụwa.
- source_word: ὡμίλουν
  choice: na-akparịta ụka
  rationale: Ụdị imperfect na-egosi omume gara aga nke nọ na-aga n'ihu. “Na-akparịta ụka” na-egosi mkparịta ụka mmadụ na ibe ya, ọ bụghị okwu e kwuru n'ihu ọha.
- source_word: πρὸς ἀλλήλους
  choice: na-akparịta ụka
  rationale: Echiche nke ime ihe n'etiti ibe ha dịrịlarị n'okwu Igbo “akparịta ụka,” ya mere ịgbakwunye “n'etiti onwe ha” ga-adị arọ ma bụrụkwa ikwughachi ihe.
- source_word: περὶ
  choice: banyere
  rationale: “Banyere” na-ewebata isiokwu mkparịta ụka n'ụzọ doro anya ma kwekọọ n'Igbo Standard.
- source_word: πάντων
  choice: niile
  rationale: “Niile” na-egosi mkpokọta ihe niile a na-ekwu maka ha.
- source_word: τῶν συμβεβηκότων τούτων
  choice: ihe ndị a niile mere
  rationale: Nkebi a na-egosi ihe ndị mere eme nke ka dị mkpa n'oge akụkọ ahụ. Igbo na-ekwu ya nke ọma site na “ihe ndị a ... mere,” n'enweghị okwu ochie ma ọ bụ nkọwa agbakwunyere.
