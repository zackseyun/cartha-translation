  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθησαν τῶν ῥημάτων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/008.yaml
  text: And they remembered his words,[a]
translation:
  language: ig
  text: Ha wee cheta okwu ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu ndị o kwuru” ma ọ bụ “ihe ndị o kwuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: N'usoro akụkọ a, “wee” na-ejikọta omume a na ihe ndị bu ya ụzọ n'ụzọ e ji akọ akụkọ n'Igbo, n'etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: ἐμνήσθησαν
  choice: cheta
  rationale: Okwu a bụ aorist nke na-arụ ọrụ dị ka active n'ebe a; “cheta” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu banyere icheta ihe e kwuru.
- source_word: τῶν ῥημάτων
  choice: okwu
  rationale: “Okwu” nwere ike ịpụta okwu ndị e kwuru, okwu ọnụ, ma ọ bụ ihe mmadụ kwuru; ọ na-edobe obosara ihe ῥημάτων pụtara n'ebe a.
- source_word: αὐτοῦ
  choice: ya
  rationale: “Ya” na-edobe nnọchiaha genitive nke Grik kama itinye aha Jizọs kpọmkwem, ebe ihe gbara amaokwu ahụ gburugburu na-eme ka onye a na-ekwu maka ya doo anya.
theological_decisions: []
translation_notes:
  register: 'Asụsụ Igbo Izugbe dị mfe, nke ugwu dị na ya, ma na-ada nke ọma n''akụkọ: “Ha wee cheta okwu ya.” Akara nkọwa ala peeji [a] dị n''ederede isi dịka achọrọ.'
