id: LUK.24.10
reference: Luke 24:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: ig
  text: Ụmụ nwanyị ahụ bụ Meri onye Magdala, Joana, Meri nne Jemis[a], na ụmụ nwanyị ndị ọzọ so ha; ha na-agwa ndịozi ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''asụsụ Grik, n''ụzọ nkịtị: “Meri nke Jemis.” O yikarịrị ka ọ pụtara “Meri nne Jemis,” ma ọ nwekwara ike ịpụta “Meri nwunye Jemis.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: Ụmụ nwanyị ahụ bụ
  rationale: Ọ na-ewebata aha ụmụ nwanyị ndị a kpọtụrụ okwu n'amaokwu ndị bu ụzọ. E tinyere ‘ụmụ nwanyị ahụ’ ka Igbo doo anya ma ghara iji njikọ δέ mee ka usoro oge sie ike karịa ka Grik kwuru.
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: Meri onye Magdala
  rationale: Nke a na-egosi na Meri bụ onye obodo Magdala, n'usoro aha nke na-ada nke ọma n'Igbo.
- source_word: Ἰωάννα
  choice: Joana
  rationale: Nsụgharị mkpụrụokwu nke aha Grik n'ụdị a na-aghọta nke ọma n'Igbo.
- source_word: Μαρία ἡ Ἰακώβου
  choice: Meri nne Jemis[a]
  rationale: Grik kwuru naanị ‘Meri nke Jemis,’ ma n'usoro ịkpọ aha dị otú a, ‘nne Jemis’ yiri ka ọ bụ nghọta kacha kwe omume. Akara nkọwa na-echekwa nghọta ọzọ.
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: ụmụ nwanyị ndị ọzọ ha na ha nọ
  rationale: Ụdị nwanyị nke ọtụtụ na Grik na-egosi na ndị ọzọ a bụ ụmụ nwanyị; e mere aha ahụ ka ọ pụta ìhè n'Igbo.
- source_word: ἔλεγον
  choice: ha nọkwa na-akọrọ
  rationale: Ụdị imperfect na-egosi omume na-aga n'ihu ma ọ bụ a na-eme ugboro ugboro; ‘nọ na-akọrọ’ na-echekwa akụkụ ahụ.
- source_word: πρὸς τοὺς ἀποστόλους
  choice: ndịozi
  rationale: ‘Ndịozi’ bụ okwu Igbo a maara nke ọma maka ndị Jizọs zipụrụ, ma dabara n'ebe a.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-echekwa ụdị ọtụtụ nke ihe omume na ozi ụmụ nwanyị ahụ kọrọ.
theological_decisions:
- issue: Mmekọrịta dị na Μαρία ἡ Ἰακώβου
  choice: Meri nne Jemis
  alternative: Meri nke Jemis; ma ọ bụ Meri nwunye Jemis
  rationale: Grik hapụrụ ụdị mmekọrịta ahụ n'ekwughị ya hoo haa. ‘Nne Jemis’ bụ nghọta kacha kwe omume n'usoro aha ndị dị n'Oziọma, ma nkọwa ala peeji na-echekwa na ‘nwunye Jemis’ nwekwara ike ịbụ ihe e bu n'obi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu abụọ e ji semicolon kewaa iji gosipụta nkebi abụọ nke Grik, ebe ‘nọ na-akọrọ’ na-echekwa omume na-aga n'ihu.
