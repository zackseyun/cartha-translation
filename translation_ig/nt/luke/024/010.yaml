- from: Ụmụ nwanyị ahụ bụ Meri onye Magdala, Joana, Meri nne Jemis[a], na ụmụ nwanyị ndị ọzọ ha na ha nọ; ha nọkwa na-akọrọ ndịozi ihe ndị a.
  to: Ụmụ nwanyị ahụ bụ Meri onye Magdala, Joana, Meri nne Jemis[a], na ụmụ nwanyị ndị ọzọ so ha; ha na-agwa ndịozi ihe ndị a.
  rationale: The revision removes the unsupported additive nuance of “-kwa,” improves the idiom for “the other women with them,” and retains the source’s imperfect verbal aspect through “ha na-agwa.” The footnote continues to preserve the relationship left implicit by the Greek genitive.
