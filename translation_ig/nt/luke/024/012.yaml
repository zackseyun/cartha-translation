source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: ig
  text: Ma Pita biliri gba ọsọ gaa n’ili ahụ. Mgbe ọ hulatara leba anya n’ime ya, ọ hụrụ naanị akwa linin ndị ahụ. O wee gaa n’ebe nke ya,[a] na-atụ n’anya maka ihe merenụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, sị: “gakwuru onwe ya.” Nkebi okwu a nwere ike ịpụta na ọ laghachiri n’ebe nke ya, ma ọ bụ na ọ pụrụ na-atụgharị uche n’onwe ya.'
    reason: Ichekwa nghọta abụọ a na-atụle banyere πρὸς αὑτόν, n’enweghị ikwu n’ahịrị isi na nke ọ bụla bụ naanị ihe ọ pụtara.
  - marker: b
    text: Ụfọdụ ihe odide ochie enweghị amaokwu a dum.
    reason: Igosipụta nnukwu ọdịiche dị n’ihe odide aka nke akara mbipụta SBLGNT na-egosi.
lexical_decisions:
- source_word: μνημεῖον
  choice: ili ahụ
  rationale: N’ebe a okwu ahụ na-ezo aka n’ili e liri Jizọs; “ili” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: παρακύψας
  choice: mgbe o hulatara lee anya n’ime ya
  rationale: Nke a na-egosi omume mmadụ hulatara ma leba anya n’ime oghere ili ahụ.
- source_word: ὀθόνια
  choice: akwa linin ndị ahụ
  rationale: Ọ bụ akwa e ji kechie ozu, ọ bụghị uwe; “akwa linin” na-edobe ụdị ihe okwu Grik ahụ na-akọwa.
- source_word: βλέπει
  choice: ọ hụkwara
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’etiti akụkọ gara aga, Igbo akụkọ nkịtị na-eji oge gara aga ebe a; “-kwara” na-ejikọta nchọpụta ahụ na usoro omume ndị bu ya ụzọ.
- source_word: θαυμάζων
  choice: na-atụ n’anya
  rationale: Nke a na-egosi ịtụ n’anya na mgbagwoju uche, n’enweghị ịgbakwunye na Pita ekwerela ma ọ bụ ghọtala ihe merenụ.
theological_decisions:
- issue: Ihe πρὸς αὑτόν pụtara
  choice: laghachi n’ebe nke ya
  alternative: pụọ, na-eche n’onwe ya
  rationale: Nkebi okwu ahụ nwere ike ịpụta ịlaghachi n’ebe nke ya ma ọ bụ ịtụgharị uche n’onwe ya. E debere nghọta gbasara ebe ọ gara n’ahịrị isi, ma kọwaa nghọta ọzọ n’ala peeji.
- issue: Mgbanwe oge na βλέπει
  choice: ọ hụkwara
  alternative: ọ na-ahụ
  rationale: E ji oge ugbu a n’akụkọ Grik mee ka ihe ahụ pụta ìhè, ma n’Igbo “ọ na-ahụ” nwere ike ịdị ka omume na-aga n’ihu. Oge gara aga na-ebupụta ihe omume ahụ nke ọma n’enweghị mgbanwe n’ihe ọ pụtara.
translation_notes:
  register: E ji Standard Igbo dị mfe, nke ugwu na nke ndị mmadụ na-asụ taa. Ahịrịokwu ndị ahụ dị mkpụmkpụ ka ọsọ Pita na usoro nchọpụta ya pụta ìhè; a zere okwu ga-egosi na ọ ghọtala mbilite n’ọnwụ ozugbo.
