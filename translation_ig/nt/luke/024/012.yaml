review_pass:
  verdict: revise
  source_fidelity: The draft conveys Peter's rising, running to the tomb, stooping to look, seeing the linen cloths alone, and marveling. However, the wording for the final destination is somewhat awkward, and the first footnote inaccurately presents an interpretive paraphrase as the Greek wording. The revised text retains the ambiguity of πρὸς ἑαυτόν/αὑτόν without implying that Peter understood the event.
  naturalness: “Gba ọsọ gaa” is more idiomatic Standard Igbo for running to a destination than the compressed “gbaga.” “Lelee anya n’ime” is adjusted to the more natural “leba anya n’ime.” The final clause is streamlined while retaining its sense.
  terminology: “Ili,” “akwa linin,” and “na-atụ n’anya” are suitable and clear. “Akwa linin” appropriately represents ὀθόνια as linen burial cloths rather than ordinary clothing.
  issues:
  - severity: medium
    issue: The first footnote's purported Greek quotation is not a literal representation of πρὸς αὑτόν.
    rationale: “gaa n’ebe onwe ya nọ” imports the motion verb and a location-based interpretation. The Greek phrase is literally closer to “to himself,” and its contextual sense is disputed.
  - severity: low
    issue: “gbaga” and “hulatara lee anya” are less natural in this narrative context.
    rationale: “Gba ọsọ gaa” and “hulatara leba anya” are clearer, idiomatic Standard Igbo forms.
  - severity: low
    issue: “pụọ, laghachi n’ebe nke ya” is stylistically redundant and somewhat stiff.
    rationale: A single motion expression better represents ἀπῆλθεν while preserving the possible destination sense through an anchored note.
  revised_text: Ma Pita biliri gba ọsọ gaa n’ili ahụ. Mgbe ọ hulatara leba anya n’ime ya, ọ hụrụ naanị akwa linin ndị ahụ. O wee gaa n’ebe nke ya,[a] na-atụ n’anya maka ihe merenụ.[b]
