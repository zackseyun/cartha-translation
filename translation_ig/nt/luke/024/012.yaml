revisions:
- from: Ma Pita biliri, gbaga n’ili ahụ. Mgbe o hulatara lee anya n’ime ya, ọ hụkwara naanị akwa linin ndị ahụ. O wee pụọ, laghachi n’ebe nke ya,[a] na-atụ n’anya n’ime onwe ya banyere ihe ahụ mere.[b]
  to: Ma Pita biliri gba ọsọ gaa n’ili ahụ. Mgbe ọ hulatara leba anya n’ime ya, ọ hụrụ naanị akwa linin ndị ahụ. O wee gaa n’ebe nke ya,[a] na-atụ n’anya maka ihe merenụ.[b]
  rationale: E degharịrị okwu ndị na-adịghị ada nke ọma n’Igbo ma dozie nkọwa ala peeji a ka ọ ghara ịkpọ paraphrase nkọwa Grik kpọmkwem. E debere ihe source kwuru banyere akwa linin naanị ya, ịtụ n’anya Pita, na amaghị kpọmkwem ihe πρὸς αὑτόν pụtara.
