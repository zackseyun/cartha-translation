id: LUK.24.51
reference: Luke 24:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: ig
  text: O wee mee na, mgbe ọ na-agọzi ha, ọ kewapụrụ n'ebe ha nọ, e wee bulie ya gaa n’eluigwe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ ihe odide aka ochie enweghị okwu ndị a: “e wee bulie ya gaa n’eluigwe.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Ọ bụ usoro Luk ji akọwa na ihe ọzọ mere; nsụgharị a bụ Igbo dị ugbu a ma na-ejigide ọrụ ya dị ka okwu mmeghe nke ihe omume.
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: mgbe ọ nọ na-agọzi ha
  rationale: Ọ na-egosi na ịgọzi ha nọ na-aga n’ihu n’otu oge ahụ ọ hapụrụ ha.
- source_word: εὐλογεῖν
  choice: na-agọzi
  rationale: ‘Ịgọzi’ bụ okwu Igbo doro anya maka ikwu ma ọ bụ inye ngọzi.
- source_word: διέστη ἀπ’ αὐτῶν
  choice: ọ hapụrụ ha
  rationale: Ọ na-egosi na o kewapụrụ onwe ya n’ebe ha nọ; okwu a dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἀνεφέρετο
  choice: e wee bulie ya
  rationale: Nke a na-echekwa ụdị nnara-eme nke ngwaa Grik, na-akọwaghị onye mere ya.
- source_word: εἰς τὸν οὐρανόν
  choice: gaa n’eluigwe
  rationale: N’ọnọdụ a, οὐρανός na-ezo aka n’eluigwe, ọ bụghị naanị mbara igwe a na-ahụ anya.
theological_decisions:
- issue: 'Nkebi a kara akara: καὶ ἀνεφέρετο εἰς τὸν οὐρανόν'
  choice: Etinyere ya n’ahụ amaokwu ahụ, tinyekwa nkọwa ala peeji banyere ọdịiche dị n’ihe odide aka ochie.
  alternative: Ịhapụ ‘e wee bulie ya gaa n’eluigwe.’
  rationale: SBLGNT tinyere nkebi ahụ n’akara nkuku iji gosi na ihe odide aka ochie ekwekọghị. Ya mere, a sụgharịrị ya n’ahụ amaokwu ma mee ka onye na-agụ mara ọdịiche ahụ n’ala peeji, kama ikpebi okwu a na nzuzo.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘O wee ruo na’ chekwaa usoro akụkọ Luk, jiri ‘mgbe ọ nọ na-agọzi ha’ gosipụta omume na-aga n’ihu, ma zere ịkpọ aha onye buliri Jizọs ebe Grik ekwughị ya kpọmkwem.
