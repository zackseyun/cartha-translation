  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: ig
  text: O wee sị ha, “Ó, unu ndị na-enweghị nghọta, ndị obi ha na-adịghị ngwa ikwere ihe niile ndị amụma kwuru!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: O wee sị ha
  rationale: Ọ bụ ụzọ Igbo dị n’usoro akụkọ si egosipụta njikọ καί na okwu Jizọs gwara ha, n’etinyeghị nkwusi ike na αὐτός nke okwu Grik ahụ na-achọghị ebe a.
- source_word: Ὦ ἀνόητοι
  choice: Unu ndị na-enweghị nghọta
  rationale: Nke a na-egosi enweghị nghọta dị na ἀνόητοι karịa ịkpọ ha ndị ajọ omume; ‘unu ndị’ na-echekwa ụdị ịkpọ ndị ahụ ihu n’ihu.
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: ndị obi ha dịkwa arọ
  rationale: Nke a na-echekwa ihe atụ nke ‘obi’ dị ka ime mmadụ dum, ma jiri okwu Igbo eke ekwu ịdị nwayọọ ma ọ bụ enweghị njikere ịnabata ihe.
- source_word: τοῦ πιστεύειν
  choice: ikwere
  rationale: Infinitive Igbo a na-ejikọta nke ọma na ‘obi ha dị arọ’ ma chekwaa echiche nke ịtụkwasị okwu ndị amụma obi.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: ihe niile
  rationale: Ọ na-echekwa oke zuru ezu nke πᾶσιν n’ụzọ Igbo doro anya ma dị mfe.
- source_word: ἐλάλησαν
  choice: kwuru
  rationale: ‘Kwuru’ bụ okwu Igbo sara mbara ma kwekọọ na prophetic speech; a hapụrụ ọdịiche oge perfect nke Bekee n’ihi na aorist Grik bụ isi mmalite.
- source_word: οἱ προφῆται
  choice: ndị amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ndị amụma Akwụkwọ Nsọ.
theological_decisions:
- issue: Ụdị mba Jizọs baara ha
  choice: Mba ahụ metụtara ma enweghị nghọta ma obi na-adịghị njikere ikwere ihe ndị amụma kwuru.
  alternative: Ịghọta ya naanị dị ka ikpe omume, ma ọ bụ naanị dị ka enweghị ọgụgụ isi.
  rationale: ἀνόητοι na βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν jikọtara nghọta na nkwenye. Nsụgharị ahụ na-echekwa ha abụọ site n’iji ‘enweghị nghọta,’ ‘obi,’ na ‘ikwere.’
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ ‘obi’ kama ịkọwa ya nanị dị ka uche, ka mgbagwoju echiche na ịdị omimi nke okwu mbụ ghara ifunahụ.
