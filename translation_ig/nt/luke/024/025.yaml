  to: O wee sị ha, “Ó, unu ndị na-enweghị nghọta, ndị obi ha na-adịghị ngwa ikwere ihe niile ndị amụma kwuru!”
  rationale: The sole revision replaces an ambiguous idiom with a natural Standard Igbo expression that explicitly conveys slowness in believing, without reducing "heart" to intellect or altering the scope of the prophets' testimony. The vocative interjection "Ó" represents Greek Ὦ.
