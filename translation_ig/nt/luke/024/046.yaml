id: LUK.24.46
reference: Luke 24:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: ig
  text: 'O wee sị ha, “Otú a ka e dere ya: Mesaịa[a] ga-ata ahụhụ, sikwa n’ọnwụ[b] bilie n’ụbọchị nke atọ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kraịst.” Okwu Grik bụ Χριστός pụtara “Onye e tere mmanụ.”
    reason: alternative_reading
  - marker: b
    text: 'N’ụzọ dabara nnọọ n’okwu Grik: “si n’etiti ndị nwụrụ anwụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: e dere ya
  rationale: Nke a bụ usoro okwu a na-eji ewebata ihe Akwụkwọ Nsọ kwuru; ọ na-egosikwa na ihe e dere ka dị irè.
- source_word: παθεῖν
  choice: ga-ata ahụhụ
  rationale: Infinitive a na-akọwa ihe e dere. ‘Ga-ata ahụhụ’ na-enye echiche ahụ n’Igbo nke ọma n’etinyeghị okwu nrụgide dịka ‘aghaghị’ nke na-adịghị n’ahịrịokwu Grik a.
- source_word: τὸν χριστόν
  choice: Mesaya
  rationale: Χριστός bụ aha ọkwa n’ebe a, ya mere ‘Mesaya’ na-echekwa njikọ ya na Onye Akwụkwọ Nsọ kwuru na a ga-ete mmanụ.
- source_word: ἀναστῆναι
  choice: bilie
  rationale: Ngwaa Grik dị n’olu na-eme ihe, ọ bụghị n’olu a na-eme ihe n’ahụ; ‘bilie’ na-echekwa nke ahụ.
- source_word: ἐκ νεκρῶν
  choice: si n’ọnwụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-aghọta nke ọma iji kwuo mbilite n’ọnwụ; nkọwa ala peeji na-edebe ọdịdị okwu Grik nke pụtara isi n’etiti ndị nwụrụ anwụ pụta.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: n’ụbọchị nke atọ
  rationale: Dative a na-egosi oge; nke a bụ ụzọ Igbo e si ekwu ya n'ụzọ ebumpụta ụwa.
- source_word: οὕτως
  choice: Otú a
  rationale: Ọ na-ejikọta ihe na-esote ya na otu ihe ahụ si dị n’ihe e dere.
- source_word: ὅτι
  choice: ':'
  rationale: Akara ntụpọ abụọ na-ewebata ọdịnaya nke ihe e dere n’ụzọ doro anya ma dị ire n’Igbo.
theological_decisions:
- issue: Otú e si asụgharị Χριστός n’ụchịkọta okwu gbasara ahụhụ na mbilite n’ọnwụ
  choice: Mesaya
  alternative: Kraịst
  rationale: Okwu ahụ bụ aha ọkwa ebe a, ọ bụghị naanị aha onye; ‘Mesaya’ na-edebe echiche Onye ahụ e tere mmanụ n’akụkọ na olileanya Akwụkwọ Nsọ.
- issue: Olu ngwaa mbilite n’ọnwụ ἀναστῆναι
  choice: bilie
  alternative: ka e mee ka o si n’ọnwụ bilie
  rationale: Ụdị Grik bụ infinitive nke olu na-eme ihe. Nsụgharị bụ isi anaghị agbanwe ya ka ọ bụrụ olu a na-eme ihe n’ahụ, ọ bụ ezie na akụkụ Akwụkwọ Nsọ ndị ọzọ na-ekwu na Chineke mere ka Jizọs si n’ọnwụ bilie.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. ‘O wee sị ha’ dabara n’usoro akụkọ; ‘ga-ata ahụhụ’ na-enye ọdịnaya ihe e dere n’enweghị itinye echiche ‘aghaghị’ na-adịghị kpọmkwem na clause ahụ.
