  verdict: revise
  source_fidelity: The verse text accurately conveys the evaluative force of ἐφάνησαν ἐνώπιον αὐτῶν (“seemed to them”), the comparison ὡσεὶ λῆρος, and the imperfect disbelief expressed by ἠπίστουν. “Ụmụ nwanyị ahụ” correctly makes explicit the feminine-plural referent of αὐταῖς from the immediate context.
  naturalness: “Okwu ndị a dị ha ka okwu nzuzu, ha ekweghịkwa ụmụ nwanyị ahụ” is clear, idiomatic modern Standard Igbo and maintains the narrative register.
  terminology: “Okwu nzuzu” is a suitable rendering for λῆρος in the main text. The existing footnote’s final expression, “ihe na-adịghị aghọta aghọta,” can suggest something merely not understood, whereas λῆρος denotes talk regarded as senseless, absurd, or empty. The alternative describing a speaker as “na-ekwu n’amaghị onwe ya” is also more personal and specific than the Greek requires.
