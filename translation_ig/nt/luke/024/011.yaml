  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: ig
  text: Okwu ndị a dị ha ka okwu nzuzu[a], ha ekweghịkwa ụmụ nwanyị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ka akụkọ efu” ma ọ bụ “ka okwu enweghị isi.” Okwu Grik bụ λῆρος na-ezo aka n’okwu e weere dị ka nke enweghị isi, nke nzuzu, ma ọ bụ nke efu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν ἐνώπιον αὐτῶν
  choice: dị ha ka
  rationale: N’usoro a, ngwaa ahụ na-egosi otú ha si were okwu ahụ, ọ bụghị ihe anya hụrụ. “Dị ha ka” bụ ụzọ Igbo si egosipụta echiche ahụ n'ụzọ doro anya.
- source_word: ὡσεὶ λῆρος
  choice: ka okwu nzuzu
  rationale: “Okwu nzuzu” na-egosi okwu e weere dị ka ihe na-enweghị isi ma ọ bụ ihe na-abaghị uru, ebe “ka” na-edobe ntụnyere dị na ὡσεὶ.
- source_word: τὰ ῥήματα ταῦτα
  choice: okwu ndị a
  rationale: Nke a na-asụgharị nkebiokwu Grik ahụ ozugbo ma ka na-ada nke ọma n’Igbo.
- source_word: ἠπίστουν
  choice: ha ekweghịkwa
  rationale: Nke a na-egosi na ha anabataghị ihe a gwara ha dị ka eziokwu, n’etinyeghị echiche siri ike karịa nke ngwaa Grik ahụ, dị ka ịsị na ha kpachaara anya jụ ikwere.
- source_word: αὐταῖς
  choice: ụmụ nwanyị ahụ
  rationale: Nnọchiaha ahụ bụ nke ọtụtụ ụmụ nwanyị ma na-ezo aka n’ụmụ nwanyị a kpọtụrụ aha n’amaokwu ndị bu ụzọ. Ịkpọ ha “ụmụ nwanyị ahụ” na-eme ka onye a na-ezo aka doo anya n’Igbo.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ùgwù. Ahịrịokwu ahụ debere nlele nke ndị gere akụkọ ahụ, na-enweghị ịsị na akụkọ ụmụ nwanyị ahụ bụ n’ezie okwu nzuzu.
