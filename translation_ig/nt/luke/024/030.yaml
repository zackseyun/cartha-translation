revisions:
- from: O wee ruo na mgbe ya na ha nọdụrụ ala iri nri[a], o weere achịcha ahụ, gọzie ya, nyawaa ya, wee malite ikesara ha ya[b].
  to: Ọ mere na, mgbe ya na ha nọdụrụ ala iri nri[a], o weere achịcha ahụ, gọzie ya, nyawaa ya, wee malite ikesara ha achịcha ahụ[b].
  rationale: The revision replaces an unnatural narrative-transition calque with natural Standard Igbo, clarifies the cultural footnote while preserving the distinction between ordinary sitting in the main text and ancient reclining in the Greek, and repeats the noun at the end for clarity. It retains the source sequence and the cautious inceptive rendering of the imperfect without adding eucharistic interpretation.
