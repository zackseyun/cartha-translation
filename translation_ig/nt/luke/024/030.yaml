id: LUK.24.30
reference: Luke 24:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: ig
  text: Ọ mere na, mgbe ya na ha nọdụrụ ala iri nri[a], o weere achịcha ahụ, gọzie ya, nyawaa ya, wee malite ikesara ha achịcha ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ya na ha makpuru n’oche nri.” Okwu Grik ahụ na-ekwu kpọmkwem banyere ịmakpu n’oche nri, dị ka omenala iri nri n’oge ahụ si dị.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “wee na-ekesara ha achịcha ahụ.” Imperfect Grik nwere ike imesi omume na-aga n’ihu ike; “malite ikesara” na-egosi mmalite omume ahụ n’ebe a n’akụkọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Nke a na-edobe usoro okwu Luk ji ewebata ihe mere ọzọ n’akụkọ, ma ọ naghị ada ka okwu Igbo ochie nke ukwuu.
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: mgbe ya na ha nọdụrụ ala iri nri[a]
  rationale: Akụkụokwu a na-egosi oge ihe ahụ mere. N’omenala oge ahụ, ndị mmadụ na-adabere ma ọ bụ na-edina n’akụkụ ebe nri; a họọrọ okwu Igbo a na-aghọta ngwa ngwa, tinyekwa nkọwa omenala n’ala peeji.
- source_word: λαβὼν τὸν ἄρτον
  choice: o weere achịcha ahụ
  rationale: A gbanwere participle ahụ ka ọ bụrụ ngwaa zuru ezu n’Igbo, ma debe usoro omume ahụ na ntụaka ya n’achịcha dị n’ihu ha.
- source_word: εὐλόγησεν
  choice: gọzie ya
  rationale: Nke a na-egosi na o kwuru ngọzi n’elu achịcha ahụ, n’enweghị ịgbakwunye nkọwa sakrament nke amaokwu ahụ ekwughị kpọmkwem.
- source_word: κλάσας
  choice: nyawaa ya
  rationale: Okwu a na-egosi ịnyawa achịcha ahụ tupu ikesara ha ya; usoro ngwaa Igbo na-eme ka usoro omume ahụ doo anya.
- source_word: ἐπεδίδου
  choice: wee malite ikesara ha ya[b]
  rationale: Imperfect Grik nwere ike igosi omume na-aga n’ihu ma ọ bụ mmalite ya. ‘Malite ikesara’ dabara n’oge akụkọ a, ebe nkesa ahụ ka na-amalite.
theological_decisions:
- issue: Omume ndị a nwere ike ime ka a cheta Nri Anyasị Onyenweanyị ma ọ bụ nkọwa sakrament
  choice: E ji okwu nri nkịtị kọwaa omume Jizọs n’emeghị ka ọ bụrụ emume sakrament kpọmkwem.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka njikọ ya na Nri Anyasị Onyenweanyị pụta ìhè karịa.
  rationale: Usoro ‘weere… gọzie… nyawaa… kesara’ nwere ike ịkpọlite echiche gbasara nri ndị ọzọ Jizọs mere, ma amaokwu a n’onwe ya anaghị akpọ ya emume sakrament. Ya mere, nsụgharị ahụ na-edobe okwu na omume ndị ahụ n’enweghị ịkwado nkọwa otu ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. ‘Nọdụrụ ala iri nri’ bụ okwu ndị nkịtị ga-aghọta ngwa ngwa, ebe nkọwa ala peeji na-echekwa nkọwa omenala dị n’okwu Grik. E zere okwu pụrụ iche nke otu ụka.
