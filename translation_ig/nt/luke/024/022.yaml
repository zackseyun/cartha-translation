  verdict: revise
  source_fidelity: 'A correction is needed for the main verb: “tụkwara anyị n’anya” is not the natural past expression for ἐξέστησαν. “tụrụkwa anyị n’anya” accurately conveys that the women greatly astonished the speakers, while the enclitic -kwa preserves the additive force of καί. “mgbe ha gara n’ili ahụ n’isi ụtụtụ” naturally represents the participial description together with movement toward the tomb.'
  naturalness: The revised wording is idiomatic, contemporary Standard Igbo. “Tụrụ anyị n’anya” is the established expression for causing astonishment. The temporal clause avoids an awkward loose coordination while retaining the Greek participle’s attendant circumstance.
  terminology: “ụmụ nwanyị,” “ili,” and “n’isi ụtụtụ” are appropriate Standard Igbo choices. The rendering neither resolves the disciples’ response into belief nor imposes a doctrinal reading.
  issues:
