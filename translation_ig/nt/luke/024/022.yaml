  rationale: The revision corrects the idiomatic Igbo past form for ‘astonished us,’ explicitly retains the additive nuance with -kwa, and makes the participial temporal circumstance natural in Igbo. It preserves the source’s open-ended response to the women’s report and the verse-final comma.
