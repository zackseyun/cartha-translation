    issue: The form “tụkwara anyị n’anya” is unnatural/incorrect in this context.
    rationale: The normal past construction of tụọ mmadụ n’anya is “tụrụ mmadụ n’anya.” Using “tụrụkwa” also expresses the additive nuance of καί.
  - severity: low
    issue: Footnote a contains the unnatural alternative “mere ka anyị jusie anya.”
    rationale: “ju anyị anya” is idiomatic Standard Igbo; the revised note supplies this natural alternative and retains the possible sense of bewilderment.
