  text: ἀλλὰ καὶ γυναῖκές τινες ἐξ ἡμῶν ἐξέστησαν ἡμᾶς, γενόμεναι ⸀ὀρθριναὶ ἐπὶ τὸ μνημεῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: ig
  text: Ma ụfọdụ ụmụ nwanyị so n’etiti anyị tụrụkwa anyị n’anya[a], mgbe ha gara n’ili ahụ n’isi ụtụtụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ju anyị anya,” ma ọ bụ, “mee ka anyị nwee mgbagwoju anya.” Ngwaa Grik ahụ pụrụ igosi oké ihe ijuanya ma ọ bụ mgbagwoju anya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mgbe chi bọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Ma
  rationale: N’ọnọdụ a, “Ma” na-ejikọta okwu a na ndakpọ olileanya e kwuru tupu ya ma na-ewetakwa ihe ọhụrụ na-atụghị anya ya; echiche mgbakwunye ahụ pụtara nke ọma site n’ahịrịokwu dum.
- source_word: γυναῖκές τινες
  choice: ụfọdụ ụmụ nwanyị
  rationale: Nke a bụ Standard Igbo dị mfe ma na-edobe enweghị nkọwa kpọmkwem nke τινες.
- source_word: ἐξ ἡμῶν
  choice: so n’etiti anyị
  rationale: Ọ na-egosi na ụmụ nwanyị ahụ so n’òtù ndị na-eso ụzọ, ọ bụghị naanị na ha si n’ebe ndị na-ekwu okwu nọ bịa.
- source_word: ἐξέστησαν ἡμᾶς
  choice: tụkwara anyị n’anya
  rationale: Nkebiokwu a na-egosi oke ihe ijuanya n’enweghị mkpebi ma ọ̀ bụ nkwenye ma ọ bụ mgbagwoju anya kpatara ya.
- source_word: γενόμεναι
  choice: ha gara
  rationale: N’ijikọ ya na ὀρθριναὶ na ἐπὶ τὸ μνημεῖον, Igbo chọrọ ngwaa ngagharị doro anya iji kwuo na ha bịaruru ili ahụ n’oge.
- source_word: ὀρθριναὶ
  choice: n’isi ụtụtụ
  rationale: Ọ bụ okwu Igbo sitere n’okike nke na-egosi oge dị nnọọ ụtụtụ; ihe ọzọ pụrụ ịbụ “mgbe chi bọrọ.”
- source_word: ἐπὶ τὸ μνημεῖον
  choice: n’ili ahụ
  rationale: N’agbanyeghị na ἐπί na accusative pụrụ igosi ngagharị ruo ebe ahụ, ngwaa “gara” ebunyelarị echiche ahụ; “ili ahụ” dabara n’ọnọdụ olili Jizọs.
theological_decisions:
- issue: Ike na nghọta nke ἐξέστησαν n’akụkọ banyere mbilite n’ọnwụ
  choice: tụkwara anyị n’anya
  alternative: mere ka anyị nwee mgbagwoju anya
  rationale: Nhọrọ a na-edobe oke mmeghachi omume ndị na-eso ụzọ ma ọ naghị ekwu tupu oge eruo ma ha kwenyere n’ozi ụmụ nwanyị ahụ ma ọ bụ jụ ya.
translation_notes:
  register: Asụsụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ụfọdụ ụmụ nwanyị so n’etiti anyị” mee ka njikọ ha na ndị na-eso ụzọ doo anya. E debere kọma n’ọgwụgwụ n’ihi na amaokwu a na-aga n’ihu n’amaokwu na-esote.
