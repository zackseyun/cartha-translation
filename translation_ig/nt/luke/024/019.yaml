source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: ig
  text: Ọ sịrị ha, “Olee ihe ndị ahụ?” Ha wee sị ya, “Ihe ndị metụtara Jizọs onye Nazaret[a], onye bụ nwoke, bụrụkwa onye amụma[b], dị ike n’ọrụ na n’okwu n’ihu Chineke na mmadụ niile.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Jizọs onye si Nazaret.” Grik kwuru, “Jizọs onye Nazaret.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye ghọrọ nwoke, onye amụma.” N'ebe a, ngwaa Grik ahụ nwere ike ịpụta “bụ” n’ụzọ a na-asụkarị, ọ bụ ezie na n'ụzọ nkịtị ọ nwere ike ịpụta “ghọrọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: Olee ihe ndị ahụ?
  rationale: Ajụjụ a dị n'ụdị ọtụtụ n'asụsụ Grik; ‘ihe ndị ahụ’ na-echekwa ntụaka ya n'ihe ndị a ka kwurula ma na-ada nke ọma n'Igbo.
- source_word: Τὰ περὶ Ἰησοῦ
  choice: Ihe ndị metụtara Jizọs
  rationale: Nke a na-anọgide nso na ‘ihe ndị gbasara Jizọs’ n'etinyeghị kpọmkwem na ọ bụ ihe mere ya, nke Grik ekwughị n'ụzọ doro anya.
- source_word: Ναζαρηνοῦ
  choice: onye Nazaret
  rationale: Ọ bụ aha nkọwa na-egosi onye si Nazaret; ‘onye Nazaret’ bụ ụzọ Igbo dị nkenke ma doo anya isi gosipụta ya.
- source_word: ἐγένετο
  choice: ghọrọ
  rationale: ‘Ghọrọ’ na-echekwa ike ngwaa γίνομαι nke pụtara ịghọ ma ọ bụ ịpụta dị ka ihe; e tinyere nkọwa ala peeji maka ‘bụ’ nke na-ada mfe karịa n'okwu a.
- source_word: ἀνὴρ προφήτης
  choice: nwoke, onye amụma
  rationale: 'Nke a na-echekwa aha abụọ ahụ n''usoro nkwụnye nkọwa: ọ bụ nwoke, bụrụkwa onye amụma, kama iwepụ ἀνήρ.'
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: dị ike n’ọrụ na n’okwu
  rationale: Ọ na-echekwa njikọ ‘ọrụ na okwu’ ma na-ada nke ọma n'Igbo Akwụkwọ Nsọ nke oge a.
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: n’ihu Chineke na mmadụ niile
  rationale: ‘N’ihu’ na-egosipụta ịbụ n'anya ma ọ bụ n'ihu Chineke na ndị mmadụ; ‘mmadụ niile’ na-enye λαός n'ụzọ Igbo a na-aghọta nke ọma n'ebe a.
theological_decisions:
- issue: Ịsụgharị ἀνὴρ mgbe a na-ekwu maka Jizọs
  choice: nwoke, onye amụma
  alternative: onye amụma
  rationale: Grik kpọrọ ἀνήρ aha n'ụzọ doro anya. Ide ‘nwoke’ na-echekwa nkọwa ndị na-ekwu okwu nyere Jizọs n'ọnọdụ a, n'enweghị ịgbakwunye ma ọ bụ ibelata nkwupụta banyere onye Kraịst bụ.
- issue: Ike ngwaa ἐγένετο
  choice: ghọrọ
  alternative: bụ
  rationale: ‘Ghọrọ’ na-anọ nso n'ụdị Grik, ma ‘bụ’ nwere ike ịbụ nsụgharị Igbo dị mfe n'ọnọdụ a. E debere nhọrọ abụọ ahụ n'enweghị idozi esemokwu ahụ nwayọọ nwayọọ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ajụjụ na azịza ahụ, njikọ ‘ọrụ na okwu,’ na nkọwa abụọ ‘nwoke, onye amụma.’ Ihe nrịba ama ala peeji [a] na [b] dị n'ahịrịokwu bụ isi.
