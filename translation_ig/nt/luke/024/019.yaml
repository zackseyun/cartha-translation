revisions:
- from: Ọ sịrị ha, “Olee ihe ndị ahụ?” Ha wee sị ya, “Ihe ndị metụtara Jizọs onye Nazaret[a], onye ghọrọ nwoke, onye amụma dị ike n’ọrụ na n’okwu n’ihu Chineke na mmadụ niile.[b]”
  to: Ọ sịrị ha, “Olee ihe ndị ahụ?” Ha wee sị ya, “Ihe ndị metụtara Jizọs onye Nazaret[a], onye bụ nwoke, bụrụkwa onye amụma[b], dị ike n’ọrụ na n’okwu n’ihu Chineke na mmadụ niile.”
  rationale: The revision avoids an unwarranted implication that Jesus changed into a man, while retaining the Greek’s explicit references to a man and a prophet. It also places the explanatory footnote marker at the relevant description.
