id: LUK.24.33
reference: Luke 24:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: ig
  text: Ha biliri n’oge ahụ kpọmkwem, wee laghachi na Jerusalem ma hụ mmadụ iri na otu ahụ na ndị ha na ha nọ ka ha zukọtara[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka ha gbakọtara.” Okwu Gris na-egosi na mgbe a hụrụ ha, ha adịlarị n’ọnọdụ ịbụ ndị zukọtara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: Ha biliri
  rationale: Ọ bụ aorist participle nke ἀνίστημι, na-egosi ihe ha mere tupu ha alaghachi; “biliri” na-enye omume ahụ n'ụzọ doro anya ma dịkwa eke n’Igbo.
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: n’oge ahụ kpọmkwem
  rationale: Nkebiokwu a na-ejikọta omume ahụ na kpọmkwem oge ahụ ma mesie ngwa ngwa ya ike, n’enweghị ịgbanwe ya ka ọ bụrụ naanị “ozugbo.”
- source_word: ὑπέστρεψαν
  choice: laghachi
  rationale: N’akụkọ njem a, ὑποστρέφω pụtara ịlaghachi n’ebe ha si bịa.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: E debere aha obodo ahụ n’ụdị ntụgharị mkpụrụokwu a na-ahụkarị.
- source_word: εὗρον
  choice: hụkwa
  rationale: N’ebe a εὑρίσκω pụtara na mgbe ha rutere, ha hụrụ ndị ahụ; “hụkwa” bụ okwu Igbo dị mfe ma kwekọọ n’usoro akụkọ ahụ.
- source_word: ἠθροισμένους
  choice: ka ha zukọtara ọnụ
  rationale: 'Perfect passive participle a na-akọwa ọnọdụ ndị ahụ nọ na ya mgbe a hụrụ ha: ha adịlarị n’otu ebe dịka ndị zukọtara ọnụ.'
- source_word: τοὺς ἕνδεκα
  choice: mmadụ iri na otu ahụ
  rationale: Nke a na-edobe ọnụ ọgụgụ na nkọwa ndị Gris n’etinyeghị okwu “ndịozi,” nke adịghị n’ederede ahụ.
- source_word: τοὺς σὺν αὐτοῖς
  choice: ndị ha na ha nọ
  rationale: Nkebiokwu a na-ezo aka ná ndị ọzọ nọnyere mmadụ iri na otu ahụ, n’etinyeghị nkọwa ọzọ ederede ahụ na-enyeghị.
theological_decisions:
- issue: Ojiji “mmadụ iri na otu ahụ” dịka aha otu ahụ, n’agbanyeghị onye ọ bụla nọ ebe ahụ n’ezie
  choice: E debere “mmadụ iri na otu ahụ” dịka nkọwa otu ahụ.
  alternative: “ndịozi iri na otu ahụ” ma ọ bụ “ndị na-eso ụzọ fọdụrụ”
  rationale: Gris kwuru τοὺς ἕνδεκα kpọmkwem. Ịghara ịgbakwunye “ndịozi” ma ọ bụ gbanwee ya ka ọ bụrụ “ndị fọdụrụ” na-echekwa okwu Luk ma zere ime ka akụkọ ndị ọzọ kwekọọ n’ụzọ ederede a na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọpụrụ ma dị mfe nghọta. A haziri “ka ha zukọtara ọnụ” ka ọ kọwaa ma mmadụ iri na otu ahụ ma ndị ha na ha nọ, dịka usoro okwu Gris si dị.
