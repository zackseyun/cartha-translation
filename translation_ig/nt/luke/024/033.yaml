    text: A pụkwara ịsị, “ka ha gbakọtara.” Okwu Gris na-egosi na mgbe a hụrụ ha, ha adịlarị n’ọnọdụ ịbụ ndị zukọtara.
    reason: lexical_alternative
  revision_rationale: The revision removes the additive particle in "hụkwa," which has no basis in the Greek, and uses straightforward coordinated narrative verbs. It also removes the redundant "ọnụ" while retaining the sense that the Eleven and those with them were already gathered when found. No theological or interpretive expansion has been introduced.
