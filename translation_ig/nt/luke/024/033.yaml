revisions:
- from: Ha biliri n’oge ahụ kpọmkwem, laghachi na Jerusalem, hụkwa mmadụ iri na otu ahụ na ndị ha na ha nọ ka ha zukọtara ọnụ[a],
  to: Ha biliri n’oge ahụ kpọmkwem, wee laghachi na Jerusalem ma hụ mmadụ iri na otu ahụ na ndị ha na ha nọ ka ha zukọtara[a].
  rationale: The revision removes the additive particle in "hụkwa," which has no basis in the Greek, and uses straightforward coordinated narrative verbs. It also removes the redundant "ọnụ" while retaining the sense that the Eleven and those with them were already gathered when found. No theological or interpretive expansion has been introduced.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:37:00Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the sequence of rising, returning to Jerusalem, and finding both the Eleven and the others with them already gathered. However, "hụkwa" adds an unwarranted additive sense ('also found/saw'), which is not expressed by εὗρον.
  naturalness: The sentence is generally intelligible Standard Igbo, but replacing "hụkwa" with "hụrụ" yields a more natural narrative sequence. "Ka ha zukọtara" adequately expresses the resultant gathered state without the slightly redundant "ọnụ."
  terminology: '"mmadụ iri na otu ahụ" correctly avoids adding ''apostles'' and can retain the conventional group designation in context. "ndị ha na ha nọ" appropriately represents those accompanying the Eleven. Jerusalem is retained as the established name.'
  issues:
  - severity: medium
    issue: The connective -kwa in "hụkwa" is additive.
    rationale: εὗρον simply states that they found the gathered group; it does not mark this action as additional. "Hụrụ" is the direct and unmarked rendering.
  - severity: low
    issue: '"zukọtara ọnụ" is somewhat pleonastic.'
    rationale: '"Zukọta" already conveys coming/gathering together. Removing "ọnụ" is more economical while preserving the perfect participle''s gathered-state sense.'
  revised_text: Ha biliri n’oge ahụ kpọmkwem, wee laghachi na Jerusalem ma hụ mmadụ iri na otu ahụ na ndị ha na ha nọ ka ha zukọtara[a].
  revised_footnotes:
