id: LUK.24.9
reference: Luke 24:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: ig
  text: Mgbe ha si n’ili ahụ lọta, ha kọọrọ ndị iri na otu ahụ na ndị ọzọ niile ihe ndị a niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Mgbe ha ... lọta
  rationale: Nkebiokwu a na-egosi na ụmụ nwanyị ahụ si n’ili ahụ lọta tupu ha akọwa ihe ha hụrụ; usoro ‘Mgbe ha ... lọta’ bụ Igbo dị mfe ma na-edobe njikọ participle ahụ na ngwaa bụ isi.
- source_word: μνημείου
  choice: ili ahụ
  rationale: N’akụkọ mbilite n’ọnwụ a, μνημεῖον bụ ebe e liri Jizọs; ‘ili’ bụ okwu Igbo nkịtị ma doo anya maka tomb.
- source_word: ἀπήγγειλαν
  choice: kọọrọ
  rationale: ‘Kọọrọ’ na-egosi izigara ndị a kpọrọ aha ozi ma ọ bụ ịgwa ha ihe mere, n’enweghị ime ka ọ bụrụ nkwusa n’ihu ọha.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nke a na-edobe ma demonstrative ταῦτα (‘ndị a’) ma ike zuru ezu nke πάντα (‘niile’).
- source_word: τοῖς ἕνδεκα
  choice: ndị iri na otu ahụ
  rationale: A hapụrụ aha otu ahụ dị ka Grik si kwuo ya, n’etinyeghị ‘ndịozi,’ nke na-adịghị n’ederede ahụ.
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: ndị ọzọ niile
  rationale: Nke a na-ekewapụ ndị iri na otu ahụ na ndị ọzọ fọdụrụ, ma na-edobe echiche πᾶσιν nke gụnyere ha niile.
theological_decisions:
- issue: Onye feminine plural participle na plural verb na-ezo aka na ya
  choice: E jiri ‘ha’ zoo aka n’ụmụ nwanyị ndị gara n’ili, dị ka amaokwu ndị bu ụzọ si gosi.
  alternative: Ịkpọ ha kpọmkwem ‘ụmụ nwanyị ahụ.’
  rationale: Ụdị ụtọasụsụ Grik bụ feminine plural, ma Igbo pronoun ‘ha’ anaghị egosi gender. Ebe isiokwu ndị bu ụzọ mere ka ndị a bụ ụmụ nwanyị doo anya, ịgbakwunye aha ahụ n’amaokwu a adịghị mkpa.
- issue: Aha e ji mara ìgwè ndịozi ahụ
  choice: ndị iri na otu ahụ
  alternative: ndịozi iri na otu ahụ
  rationale: Grik kwuru naanị ‘ndị iri na otu’; ịgbakwunye ‘ndịozi’ ga-eme ka ihe a na-aghọta pụta ìhè, ma ọ ga-etinye aha na-adịghị n’ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. A họọrọ usoro ahịrịokwu eke n’Igbo, ma e debere nghọta, ọdịiche, na ike okwu ndị dị na Grik.
