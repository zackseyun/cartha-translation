  naturalness: “Ha onwe ha na-akọkwa” is more natural and economical Standard Igbo for the imperfect narrative action than “Ha onwe ha nọkwa na-akọ.” The revised final phrase also keeps the sentence parallel with the Greek prepositional phrase.
  terminology: “mata ya” appropriately represents recognition/being made known without settling the passive’s theological implications. “Ịnyawa achịcha ahụ” is suitable contemporary Standard Igbo for the breaking of the specific bread in the meal scene.
