  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐξηγοῦντο τὰ ἐν τῇ ὁδῷ καὶ ὡς ἐγνώσθη αὐτοῖς ἐν τῇ κλάσει τοῦ ἄρτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: ig
  text: Ha onwe ha na-akọkwa ihe ndị mere n’ụzọ, na otú e si mee ka ha mata ya[a] n’ịnyawa achịcha ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otú ha si mata ya.” Grik ji ngwaa passive mee ihe; nke a nwere ike imesi ma na ha matara ya, ma na e mere ka ha mata ya ike.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “mgbe a na-anyawa achịcha.” Okwu Grik nwere ike izo aka n’ịnyawa achịcha n’ozuzu ya, ma “achịcha ahụ” dabara n’otu nri ahụ a kọrọ banyere ya n’amaokwu ndị bu ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: Ha onwe ha
  rationale: Nnọchiaha ahụ pụtara ìhè ma na-emesi ndị na-eso ụzọ abụọ ahụ ike dị ka ndị ji ọnụ ha na-akọ akụkọ nke ha.
- source_word: ἐξηγοῦντο
  choice: nọkwa na-akọ
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu; okwu a na-egosi na ha nọ na-akọghachi ihe ndị ahụ, ọ bụghị na ha na-enye nkọwa iwu ma ọ bụ nkuzi pụrụ iche.
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: ihe ndị mere n’ụzọ
  rationale: Asụsụ Grik hapụrụ ngwaa ahụ n’ime echiche; itinye “mere” na-eme ka Igbo bụrụ nke doro anya ma bụrụkwa nke e ji ekwu okwu n’ụzọ nkịtị, n’enweghị ịgbakwụnye nkọwa ọhụrụ.
- source_word: ὡς
  choice: otú
  rationale: Ọ na-ewebata ụzọ ma ọ bụ ọnọdụ e si mata ya, ma dabara n’asụsụ Igbo eke.
- source_word: ἐγνώσθη
  choice: e si mee ka ha mata ya
  rationale: Nhọrọ a na-edobe ọdịdị passive site n’ịhapụ onye mere ka ha mata ya n’aha, ma na-asụkwa Igbo n’ụzọ kwụ ọtọ. Ọ na-echekwa esemokwu dị n’etiti ha ịmata ya na ime ka a mata ya nye ha.
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: mgbe a na-anyawa achịcha ahụ
  rationale: 'Nke a bụ ụzọ Igbo eke isi gosipụta ọnọdụ ahụ: n’oge a na-anyawa achịcha ahụ. “Achịcha ahụ” na-egosi nri ahụ a kpọtụrụ aha n’akụkọ dị nso.'
theological_decisions:
- issue: Ma ἐγνώσθη ọ̀ bụ naanị na ndị na-eso ụzọ ahụ matara Jizọs, ka ọ̀ na-egosi na e mere ka ha mata ya
  choice: e si mee ka ha mata ya
  alternative: otú ha si mata ya
  rationale: Ụdị passive nke Grik na ọnọdụ Luk 24:31 na-ahapụ ma omume ịmata ya nke ndị ahụ ma enyemaka sitere n’èzí ka ha nwee ike ịmata ya. Nsụgharị a anaghị ekpebi onye mere ya ma ọ bụ tinye ozizi pụrụ iche n’amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nọkwa na-akọ” na-egosi omume na-aga n’ihu; “ịnyawa achịcha” bụ okwu nkịtị maka ikewa achịcha n’oge nri. Akara nkọwa ala ala [a] na [b] dị n’ebe okwu ha na-akọwa nọ.
