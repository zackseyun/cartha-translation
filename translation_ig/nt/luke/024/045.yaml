  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε διήνοιξεν αὐτῶν τὸν νοῦν τοῦ συνιέναι τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/045.yaml
  text: Then he opened their minds to understand the Scriptures[b][a],
translation:
  language: ig
  text: Mgbe ahụ, o meghere uche ha[a] ka ha ghọta Akwụkwọ Nsọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nghọta ha” n’ọnọdụ “uche ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “iji ghọta Akwụkwọ Nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe sochiri ihe ọzọ n’akụkọ ahụ; “Mgbe ahụ” bụ ụzọ doro anya ma dịkwa nkenke isi kwuo ya n’Igbo.
- source_word: διήνοιξεν
  choice: o meghere
  rationale: Nke a na-edobe ihe atụ doro anya dị n’okwu Grik nke pụtara imeghe nke ọma, n’ebugharịghị ya naanị n’echiche nke “o mere ka ha nwee ike.”
- source_word: αὐτῶν τὸν νοῦν
  choice: uche ha
  rationale: νοῦς bụ ikike mmadụ ji aghọta ma na-aghọta ihe. “Uche ha” bụ okwu Igbo ebumpụta ụwa nke ka na-edobe uche ahụ dị ka ihe e meghere.
- source_word: τοῦ συνιέναι
  choice: ka ha ghọta
  rationale: Nkebi a nwere ike igosi ebumnuche ma ọ bụ ihe si n’omume ahụ pụta. “Ka ha ghọta” na-ekwupụta ya n’Igbo dị mfe n’enweghị nkọwa agbakwunyere.
- source_word: τὰς γραφάς
  choice: Akwụkwọ Nsọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ihe odide nsọ nke Izrel. “Akwụkwọ Nsọ” bụ okwu Igbo a na-aghọta nke ọma maka ihe odide ndị ahụ.
theological_decisions:
- issue: Ụdị ihe Jizọs mere mgbe o meghere uche ha
  choice: E debere okwu kpọmkwem, “o meghere uche ha,” n’etinyeghị nkọwa ozizi ọzọ.
  alternative: “O mere ka ha nwee ike ịghọta” ma ọ bụ “o kọwaara ha Akwụkwọ Nsọ.”
  rationale: Okwu Grik kwuru kpọmkwem na o meghere uche ha ka ha ghọta Akwụkwọ Nsọ. Nsụgharị a na-edobe nkwupụta ahụ na esemokwu echiche dị n’ime ya, n’ebelataghị ya ka ọ bụrụ nanị ịkọwa ihe ma ọ bụ ịtinye ozizi e mechara hazie.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ihe atụ nke “imeghe uche,” ma na-eji “ka ha ghọta” mee ka njikọ ebumnuche ma ọ bụ nsonaazụ dị n’okwu Grik pụta n’ụzọ Igbo si ekwu okwu.
