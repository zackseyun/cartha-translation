id: LUK.24.6
reference: Luke 24:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: ig
  text: Ọ nọghị ebe a, kama a kpọlitela ya n’ọnwụ.[a] Chetanụ otú o si gwa unu okwu mgbe ọ ka nọ na Galili,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ biliela n’ọnwụ.” Ngwaa Grik dị n’olu nnara (“a kpọlitela ya”), ọ bụ ezie na a pụkwara ikwu ihe ahụ merenụ n’Igbo dịka “ọ biliela n’ọnwụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Ọ nọghị ebe a
  rationale: Asụsụ Grik ekwughị onye a na-ekwu maka ya kpọmkwem, ma ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jizọs. Igbo chọrọ nnọchiaha “Ọ” ka okwu doo anya ma na-ada nke ọma; “ebe a” na-egosipụta ọnọdụ ὧδε.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosipụta ọdịiche siri ike n’etiti na ọ nọghị ebe a na na a kpọlitela ya n’ọnwụ.
- source_word: ἠγέρθη
  choice: a kpọlitela ya n’ọnwụ
  rationale: 'Ụdị “a kpọlitela ya” na-echekwa olu nnara nke ngwaa Grik ma hapụ onye mere omume ahụ ka ọ bụrụ ihe a ghọtara, dịka isi mmalite ahụ si mee. “N’ọnwụ” na-eme ka ihe a na-ekwu doo anya n’Igbo: ọ bụ mbilite n’ọnwụ, ọ bụghị naanị ịkpọte onye na-ehi ụra.'
- source_word: μνήσθητε
  choice: Chetanụ
  rationale: Nke a bụ iwu a na-enye ọtụtụ mmadụ, ya mere “Chetanụ” bụ okwu Igbo dị mkpirikpi, doro anya, ma sie ike dịka iwu Grik ahụ.
- source_word: ὡς
  choice: otú
  rationale: N’ebe a ὡς na-ewebata ụzọ ma ọ bụ ọnọdụ nke okwu Jizọs kwuru; “otú” na-eme nke a n’Igbo nke ọma n’ahịrịokwu “otú o si...”
- source_word: ἐλάλησεν ὑμῖν
  choice: o si gwa unu okwu
  rationale: “Gwa unu okwu” na-echekwa echiche nke ikwu okwu nye ha, na-agbanweghị ya ka ọ bụrụ nanị izisa ozi pụrụ iche.
- source_word: ἔτι ὢν
  choice: mgbe ọ ka nọ
  rationale: “Ka” na-echekwa echiche nke ἔτι, ya bụ na nke a mere mgbe ọ ka nọ n’ebe ahụ; a tụgharịrị participle ahụ dịka nkebiokwu oge nke na-ada nke ọma n’Igbo.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: na Galili
  rationale: Nke a bụ ntụgharị ọnọdụ kwụ ọtọ, ebe “Galili” bụ nsụgharị ụda aha ebe ahụ a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Nsụgharị ngwaa mbilite n’ọnwụ ἠγέρθη
  choice: a kpọlitela ya n’ọnwụ
  alternative: ọ biliela n’ọnwụ
  rationale: Isi okwu ahụ dị n’olu nnara, ya mere “a kpọlitela ya” na-echekwa ọdịdị ahụ na echiche nke omume Chineke a na-aghọta n’ime ya, n’agbanyeghị na Grik akpọghị onye mere ya aha. Nhọrọ “ọ biliela” bụ Igbo dị mma ma na-egosipụta otu ihe mere, mana ọ na-agbanwe olu nnara ahụ gaa n’ụdị ngwaa na-enweghị onye ọzọ na-eme omume ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. “A kpọlitela ya n’ọnwụ” na-echekwa olu nnara nke Grik, ebe “Chetanụ” na-egosi nke ọma na a na-agwa ọtụtụ ndị okwu.
