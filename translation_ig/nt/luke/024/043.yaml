  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: ig
  text: O were ya rie ya n’ihu ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: Njikọ akụkọ a na-egosi ihe sochiri omume dị n’amaokwu bu ụzọ, n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: λαβὼν
  choice: wee ya
  rationale: Ụdị ngwaa a na-egosi omume iburu ihe ahụ tupu iri ya. E tinyere “ya” dịka ihe a na-ekwu maka ya, nke sitere n’amaokwu bu ụzọ.
- source_word: ἐνώπιον αὐτῶν
  choice: n’ihu ha
  rationale: Nke a na-egosi na o mere ihe ahụ ebe ha nọ na-ahụ ya; ọ bụ okwu Igbo dị mfe ma kwụsie ike.
- source_word: ἔφαγεν
  choice: rie ya
  rationale: Ngwaa a na-akọ omume iri ahụ dịka ihe mezuru; “ya” na-ezo aka n’iberibe azụ e kwuru okwu ya n’amaokwu bu ụzọ.
theological_decisions:
- issue: Ma a ga-akọwapụta ihe a na-ekwu na a natara ma rie
  choice: E tinyere “ya” n’ebe abụọ ahụ
  alternative: O wee, rie n’ihu ha.
  rationale: Asụsụ Grik ekwughị ihe ahụ ọzọ n’amaokwu a, n’ihi na a pụrụ ịghọta ya site n’amaokwu bu ụzọ. Igbo eke chọrọ ka “ya” pụta ìhè ebe a; nke a anaghị atụkwasị echiche ọhụrụ, kama ọ na-eme ka omume ahụ doo anya ma debe ihe akaebe na Jizọs riri nri n’ihu ha.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe, dị ugwu, ma bụrụkwa nke ndị na-agụ akwụkwọ taa ga-aghọta. “O wee” na-eme ka usoro akụkọ ahụ bụrụ nke eke; “n’ihu ha” na-echekwa echiche na ha hụrụ omume ahụ anya.
