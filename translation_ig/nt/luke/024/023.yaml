revisions:
- from: Ma mgbe ha na-ahụghị ahụ ya[a], ha bịara kwuo na ha hụkwara ọhụụ nke ndị mmụọ ozi[b], ndị na-ekwu na ọ dị ndụ.
  to: Ha, mgbe ha ahụghị ahụ ya[a], bịara kwuo na ha hụrụkwa ọhụụ nke ndị mmụọ ozi[b], ndị na-ekwu na ọ dị ndụ.
  rationale: The revision removes the unsupported adversative ‘Ma,’ uses a more precise natural rendering of the aorist participle, and repairs the incomplete footnote b. It preserves the Greek’s report structure, the added force of καί in ‘hụrụkwa,’ and the most natural reference of ‘ndị na-ekwu’ to the angels, while retaining the less likely alternative in footnote a.
