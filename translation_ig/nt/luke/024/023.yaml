  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: ig
  text: Ha, mgbe ha ahụghị ahụ ya[a], bịara kwuo na ha hụrụkwa ọhụụ nke ndị mmụọ ozi[b], ndị na-ekwu na ọ dị ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ o yikarịghị: “Ha, mgbe ha ahụghị ahụ ya, bịara kwuo na ha hụrụ ọhụụ nke ndị mmụọ ozi nakwa na ọ dị ndụ,” ma ọ bụrụ na a na-ewere okwu ahụ bụ “ndị na-ekwu” dịka ndị inyom, ọ bụghị ndị mmụọ ozi.'
    reason: alternative_reading
  - marker: b
    text: 'Ma ọ bụ: “bịara na-ekwu na ha hụrụkwa ọhụụ nke ndị mmụọ ozi.”'
    reason: previous_rendering
lexical_decisions:
- source_word: μὴ εὑροῦσαι
  choice: mgbe ha na-ahụghị
  rationale: A sụgharịrị aorist participle nwanyị ọtụtụ dịka nkebi oge n’Igbo eke; ọ na-edobe nkwuma μή n’enweghị ntụgharị siri ike.
- source_word: τὸ σῶμα αὐτοῦ
  choice: ahụ ya
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ahụ Jizọs n’ihe gbasara ili na mbilite n’ọnwụ.
- source_word: ἦλθον λέγουσαι
  choice: ha bịara kwuo
  rationale: Ọ na-edobe isi echiche nke ‘ha bịara na-ekwu,’ ma jiri usoro ngwaa abụọ nke na-ada nke ọma n’Igbo.
- source_word: καὶ
  choice: kwa
  rationale: ‘Kwa’ na-egosi na akụkọ banyere ọhụụ ahụ bụ ihe agbakwunyere n’ahụ ahụ a na-ahụghị; ọ pụrụ ibu echiche ‘ọzọkwa/ọbụna’ n’enweghị imebiga ya ókè.
- source_word: ὀπτασίαν ἀγγέλων
  choice: ọhụụ nke ndị mmụọ ozi
  rationale: ‘Ọhụụ’ na-egosi ihe a hụrụ n’ụzọ pụrụ iche, ebe ‘nke ndị mmụọ ozi’ na-edobe genitive nke Grik n’enweghị ịkọwa ma ọ bụ ịgbasa ya karịa isi mmalite.
- source_word: ἑωρακέναι
  choice: ha hụrụ
  rationale: Perfect infinitive dị n’okwu a kọrọ; n’Igbo, oge na usoro akụkọ ahụ na-eme ka ngwaa a dị mfe bụrụ nke eke ma doo anya.
- source_word: οἳ λέγουσιν
  choice: ndị na-ekwu
  rationale: Relative clause a na-ejikọta ya n’ụzọ kacha eke na ‘ndị mmụọ ozi,’ ma a na-edobe present tense nke λέγουσιν.
- source_word: αὐτὸν ζῆν
  choice: na ọ dị ndụ
  rationale: Nke a bụ ụzọ Igbo nke oge a si ekwu ‘that he is alive,’ na-edobe nkwupụta ndụ ya n’enweghị mgbakwunye nkọwa ozizi.
theological_decisions:
- issue: Ihe οἳ λέγουσιν na-ezo aka na ya
  choice: 'A na-ewere ya na ọ na-ezo aka ná ndị mmụọ ozi: ‘ndị na-ekwu na ọ dị ndụ.’'
  alternative: 'O nwere ike, ma o yikarịghị, izo aka ná ndị inyom: ha bịara na-ekwu na ha hụrụ ọhụụ ndị mmụọ ozi nakwa na ha na-ekwu na ọ dị ndụ.'
  rationale: ἀγγέλων bụ antecedent kachasị nso, ọ bụkwa masculine plural dịka οἳ; ihe ndị gbara amaokwu ahụ gburugburu na-akwado na ndị mmụọ ozi bụ ndị kwupụtara na Jizọs dị ndụ. E debere ụzọ ọzọ n’ala peeji ka a ghara izochi ambiguiti ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ahụ ya,’ ‘ọhụụ,’ na ‘ọ dị ndụ’ bụ okwu nkịtị ma ziri ezi; e zere okwu ụka pụrụ iche. Akara ala peeji [a] na [b] dị n’ahịrị isi.
