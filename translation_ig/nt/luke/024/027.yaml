  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: ig
  text: O bidoro n’Akwụkwọ Mosis na n’akwụkwọ ndị amụma niile[b], wee kọwaara ha[a] n’Akwụkwọ Nsọ niile ihe ndị metụtara ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ kọwara ha” ma ọ bụ “ọ kọwaara ha nke ọma.” Ngwaa Grik ahụ nwere ike ịpụta ịkọwa ma ọ bụ ịtụgharị ihe n’ụzọ zuru ezu.
    reason: lexical_alternative
  - marker: b
    text: “Akwụkwọ Mosis na akwụkwọ ndị amụma niile” na-arụtụ aka n’ihe odide Akwụkwọ Nsọ e jikọtara na Mosis na n’akwụkwọ ndị amụma.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: Mgbe ọ malitere site n’ihe Mosis dere
  rationale: Ọ na-egosi ebe nkọwa ahụ malitere. Ịgbakwunye “ihe ... dere” na-eme ka o doo onye Igbo nke oge a anya na a na-ekwu maka akụkụ Akwụkwọ Nsọ e jikọtara na Mosis, ọ bụghị naanị banyere Mosis dị ka mmadụ.
- source_word: πάντων τῶν προφητῶν
  choice: ihe ndị amụma niile dere
  rationale: N’akụkụ “Mosis,” okwu a na-arụtụ aka n’akwụkwọ amụma dị ka ngalaba Akwụkwọ Nsọ; nsụgharị a na-eme ka echiche akwụkwọ ahụ pụta ìhè n’Igbo.
- source_word: διερμήνευσεν
  choice: ọ kọwaara ha
  rationale: Ngwaa Grik ahụ pụtara ịkọwa ma ọ bụ ịsụgharị ihe n’ụzọ ga-eme ka ihe ọ pụtara doo anya. “Kọwaara” bụ okwu Igbo sitere n’okike, dịkwa mfe nghọta, ma ndetu ala na-echekwa obosara lexical ahụ.
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: n’ime Akwụkwọ Nsọ niile
  rationale: γραφή n’ebe a na-arụtụ aka n’ihe odide dị nsọ. “Akwụkwọ Nsọ” bụ okwu Igbo a maara nke ọma, ebe “niile” na-echekwa πάσαις.
- source_word: τὰ περὶ ἑαυτοῦ
  choice: ihe ndị e dere banyere ya
  rationale: Ọ na-echekwa obosara nke okwu Grik ahụ banyere ihe metụtara Jizọs, n’agbanyeghị ma ha bụ amụma, ihe atụ, ma ọ bụ isiokwu ndị ọzọ; ọ naghị akpọchi ya n’otu ụdị nkọwa.
theological_decisions:
- issue: Oke nkọwa Jizọs nyere site n’Akwụkwọ Nsọ
  choice: A sụgharịrị ya dị ka ihe ndị e dere banyere ya n’ime Akwụkwọ Nsọ niile, na-akọwaghị otu ụdị mmekọrịta kpọmkwem.
  alternative: Ịsụgharị ya dị ka naanị amụma ndị kwuru kpọmkwem banyere Mesaya, ma ọ bụ ikwu na amaokwu ọ bụla n’Akwụkwọ Nsọ na-ekwu banyere ya.
  rationale: Okwu Grik ahụ sara mbara. Ọ na-egosi na Jizọs kọwara ihe ndị metụtara ya n’akụkụ Akwụkwọ Nsọ niile, ma ọ naghị ekpebi na ha niile bụ naanị amụma kpọmkwem ma ọ bụ na amaokwu ọ bụla n’onwe ya na-ekwu banyere ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, n’ụdị dị ùgwù ma dị mfe nghọta. E zere ahịrịokwu siri ike nke na-eṅomi usoro Grik n’ụzọ na-adịghị eke eke. E tinyere akara ndetu [a] na [b] ozugbo n’ebe okwu ha na-akọwa dị.
