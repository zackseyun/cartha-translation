  text: λέγοντας ὅτι ⸂ὄντως ἠγέρθη ὁ κύριος⸃ καὶ ὤφθη Σίμωνι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/034.yaml
  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: ig
  text: na-ekwu, sị, “N’ezie, a kpọlitela Onyenwe anyị, ọ pụtakwara Saịmọn ihu!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντας
  choice: na-ekwu
  rationale: Ọ bụ participle dị n’oge ugbu a, nke jikọrọ okwu a na ahịrịokwu buru ibu dị n’amaokwu gara aga. ‘na-ekwu’ na-edobe njikọ ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: ὅτι
  choice: akara mmeghe okwu kpọmkwem
  rationale: N’ebe a ὅτι na-ewebata ihe a na-ekwu kpọmkwem; akara nhota na-egosipụta nke a n’Igbo nke ọma karịa ịtinye ‘na’ ọzọ.
- source_word: ὄντως
  choice: n’ezie
  rationale: Ọ na-emesi ike na akụkọ mbilite n’ọnwụ ahụ bụ eziokwu; ‘n’ezie’ bụ okwu Igbo doro anya ma dị nsọpụrụ.
- source_word: ἠγέρθη
  choice: A kpọlitela
  rationale: Aorist passive nke ἐγείρω. ‘A kpọlitela’ na-edobe olu nnara nke Grik ma na-egosikwa na ihe ahụ mere, nsonaazụ ya ka dịkwa ugbu a.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Ọ bụ utu aha e ji akpọ Jizọs n’ebe a. ‘Onyenwe anyị’ na-edobe ibu na nsọpụrụ nke κύριος n’Igbo nkịtị nke Akwụkwọ Nsọ.
- source_word: καὶ
  choice: -kwaghị
  rationale: Mgbakwunye ‘-kwa’ na ngwaa nke abụọ na-ejikọta mbilite n’ọnwụ na mpụta ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ὤφθη
  choice: ọ pụtara n’ihu
  rationale: Ọ bụ aorist passive n’ụdị ya, ma a na-eji ya eme ihe n’echiche idiomatic nke ‘pụtara/mee ka a hụ ya’ n’akụkọ banyere mpụta mgbe mbilite n’ọnwụ gasịrị. ‘pụtara n’ihu’ na-ada nke ọma n’Igbo ma ghara ime ka ọ bụrụ nanị na mmadụ hụrụ ya n’amaghị ama.
- source_word: Σίμωνι
  choice: Saịmọn
  rationale: A sụgharịghị aha mmadụ a; e dere ya dịka ụda ya si dị n’Igbo. Isi mmalite kwuru naanị Saịmọn, ọ bụghị ‘Saịmọn Pita.’
theological_decisions:
- issue: Olu ngwaa mbilite n’ọnwụ
  choice: A kpọlitela
  alternative: o bilitela; a kpọlitere ya
  rationale: Grik ji olu nnara mee ihe. Nhọrọ a na-edobe nke ahụ ma ghara ikpebi n’ime nsụgharị ihe isi mmalite hapụrụ n’ụdị ahụ.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: N’ọnọdụ a ọ bụ utu aha Kraịst maka Jizọs. ‘Onyenwe anyị’ na-edobe ibu okpukpe na nsọpụrụ ya n’enweghị ime ka ọ bụrụ naanị onyeisi mmadụ.
- issue: Ụdị mpụta nke ὤφθη
  choice: ọ pụtara n’ihu Saịmọn
  alternative: Saịmọn hụrụ ya; e mere ka Saịmọn hụ ya
  rationale: Nhọrọ a na-edobe echiche nke Jizọs igosipụta onwe ya nye Saịmọn ma ghara ịtụgharị ya ka ọ bụrụ ịhụ mmadụ n’amaghị ama.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dị nsọpụrụ. Ahịrịokwu a ka bụ akụkụ nke ahịrịokwu malitere n’amaokwu 33, ya mere ‘na-ekwu’ na-edobe njikọ participle ahụ. Akara [a] dị n’isiokwu ma kwekọọ na nkọwa ala peeji.
