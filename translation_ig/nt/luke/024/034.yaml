revisions:
- from: na-ekwu[a], “A kpọlitela Onyenwe anyị n’ezie, ọ pụtakwara n’ihu Saịmọn!”
  to: na-ekwu, sị, “N’ezie, a kpọlitela Onyenwe anyị, ọ pụtakwara Saịmọn ihu!”
  rationale: The revision retains the source’s passive resurrection verb and its emphatic affirmation, while using the standard Igbo idiom “pụrụ Saịmọn ihu” for an appearance to Simon. “Na-ekwu, sị,” improves the natural introduction of the direct quotation. The footnote anchor and its content remain aligned with the main-text rendering.
