review_pass:
  verdict: revise
  source_fidelity: 'The core resurrection affirmation is accurately conveyed: “A kpọlitela” appropriately preserves the Greek passive force of ἠγέρθη, while “n’ezie” reflects ὄντως. “Onyenwe anyị” is an established reverential Igbo rendering of ὁ κύριος. The appearance clause should more directly mark Simon as the recipient of the appearance, rather than merely the location before whom it occurred.'
  naturalness: The participial continuation is clear, but “na-ekwu, sị,” is more idiomatic Igbo for introducing direct speech. “Ọ pụtakwara Saịmọn ihu” is the natural idiom for appearing to Simon; “ọ pụtakwara n’ihu Saịmọn” can be understood as appearing in front of him, but is less direct and less idiomatic in this context.
  terminology: “Onyenwe anyị,” “A kpọlitela,” and “Saịmọn” are suitable Standard Igbo biblical terminology. The footnote correctly identifies the active/passive alternatives without imposing a theological conclusion.
  issues:
  - severity: medium
    issue: The appearance phrase is less idiomatic and can weaken the dative sense of appearance to Simon.
    rationale: ὤφθη Σίμωνι means that the risen Lord appeared to Simon. In Standard Igbo, “pụrụ mmadụ ihu” directly expresses this; “pụta n’ihu mmadụ” more literally suggests appearing before someone.
  - severity: low
    issue: Direct speech is introduced without the usual Igbo quotative verb.
    rationale: Adding “sị” after “na-ekwu” makes the direct quotation flow naturally while retaining the dependent participial connection to the preceding verse.
  revised_text: na-ekwu, sị, “N’ezie, a kpọlitela Onyenwe anyị, ọ pụtakwara Saịmọn ihu!”
