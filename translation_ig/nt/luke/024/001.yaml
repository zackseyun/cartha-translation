source:
  edition: SBLGNT
  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: ig
  text: Ma n’ụbọchị mbụ nke izu[a], mgbe chi na-abọ nnọọ, ha bịara n’ili ahụ, na-eweta ihe ndị na-esi ísì ụtọ ha kwadebere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ mkpụrụokwu karịa, “nke mbụ n’ime ụbọchị izu ike.” Nke a bụ akpaalaokwu pụtara ụbọchị mbụ nke izu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Ma n’ụbọchị mbụ nke izu
  rationale: Nkebiokwu a bụ akpaalaokwu ndị Juu na Grik Koine ji egosi ụbọchị mbụ nke izu. Nsụgharị a na-enye ihe ọ pụtara n’Igbo doro anya, kama ịsụgharị ya n’ụzọ mkpụrụokwu nke nwere ike ịgbagwoju onye na-agụ ya anya.
- source_word: ὄρθρου βαθέως
  choice: mgbe chi na-abọ nnọọ
  rationale: Okwu βαθέως na-emesi ὄρθρου ike, ya bụ, n’isi ụtụtụ mgbe chi ka na-abọ. Nkebiokwu Igbo a bụ nke e ji eme ihe n’ụzọ ebumpụta ụwa ma na-echekwa nkwusi ike dị n’isi mmalite ahụ.
- source_word: ἐπὶ τὸ μνῆμα
  choice: n’ili ahụ
  rationale: N’ihi na ọ na-eso ngwaa ngagharị, ἐπί na-egosi ebe ha na-aga. ‘Ili ahụ’ bụ okwu Igbo doro anya maka ebe e liri Jizọs.
- source_word: ἦλθον
  choice: ha bịara
  rationale: Aorist a na-akọ na ha bịarutere ebe ahụ; ‘ha bịara’ na-aga nke ọma n’akụkọ Igbo ma na-echekwa echiche nke Greek.
- source_word: φέρουσαι
  choice: na-eweta
  rationale: Participle a na-egosi ihe ha nọ na-eme n’otu oge ahụ ha bịara. ‘Na-eweta’ na-ejikọta omume abụọ ahụ nke ọma n’Igbo.
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: ihe ndị na-esi ísì ụtọ ha kwadebere
  rationale: ἀρώματα bụ ihe ndị na-esi ísì ụtọ e ji akwadebe ozu maka olili. Nhazi a na-ada nke ọma n’Igbo ma na-edobe relative clause nke isi mmalite ahụ.
theological_decisions:
- issue: Akpaalaokwu oge τῇ μιᾷ τῶν σαββάτων n’akụkọ mbilite n’ọnwụ
  choice: n’ụbọchị mbụ nke izu
  alternative: n’ụbọchị mbụ nke ụbọchị izu ike dị iche iche
  rationale: A họọrọ ihe akpaalaokwu ahụ na-apụta n’asụsụ ahụ, ọ bụghị nsụgharị mkpụrụokwu nke nwere ike ịmepụta nkọwa kalenda ma ọ bụ ozizi pụrụ iche nke Greek achọghị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Mgbe chi na-abọ nnọọ’ na-enye nkwusi ike nke ὄρθρου βαθέως n’ụzọ na-ada nke ọma n’Igbo; ‘ihe ndị na-esi ísì ụtọ’ na-akọwa ngwa olili ahụ n’enweghị itinye nkọwa ozizi ọzọ.
