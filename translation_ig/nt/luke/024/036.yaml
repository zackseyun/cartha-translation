id: LUK.24.36
reference: Luke 24:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτῶν λαλούντων ⸀αὐτὸς ἔστη ἐν μέσῳ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/036.yaml
  text: While they were saying these things[a], he himself stood among them.
translation:
  language: ig
  text: Mgbe ha ka na-ekwu ihe ndị a[a], ya onwe ya guzoro n’etiti ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie tinyere, “o wee sị ha, ‘Udo dịrị unu.’”
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha ngosi a dị n'ụdị ọtụtụ ma na-ezo aka n'ihe ndị a ka kọrọ; “ihe ndị a” na-echekwa ụdị ọtụtụ ahụ na njikọ ya na okwu gara aga.
- source_word: δὲ ... αὐτῶν λαλούντων
  choice: Mgbe ha ka na-ekwu
  rationale: Usoro genitive absolute nke participle dị ugbu a na-egosi na okwu ahụ ka na-aga n’ihu mgbe ihe ọzọ mere; “mgbe ... ka na-” na-egosipụta oge na ịdịgide nke omume ahụ n’Igbo eke.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Nnọchiaha ahụ nwere nkwusi ike; “ya onwe ya” na-echekwa nkwusi ike na ọ bụ Jizọs n’onwe ya bịara guzo n’etiti ha.
- source_word: ἔστη
  choice: guzoro
  rationale: Okwu a pụtara iguzo ma ọ bụ iwere ọnọdụ iguzo. “Guzoro” bụ ntụgharị kwụ ọtọ nke na-adịghị etinye echiche “pụtara” ma ọ bụ ngagharị ọzọ na-adịghị n'okwu Grik.
- source_word: ἐν μέσῳ αὐτῶν
  choice: n’etiti ha
  rationale: Nke a bụ ụzọ Igbo dị mma ma doo anya isi kwuo na ọ nọ n'etiti ìgwè ahụ.
theological_decisions:
- issue: Ma a ga-etinye ogologo ọgụgụ ahụ, “o wee sị ha, ‘Udo dịrị unu.’”
  choice: E tinyeghị ya n’ahịrịokwu bụ isi, dịka ederede SBLGNT e nyere si dị.
  alternative: 'Tinye: “o wee sị ha, ‘Udo dịrị unu.’”'
  rationale: Ederede Grik e nyere kwụsịrị na “n’etiti ha” ma o nweghị ekele ahụ. Ya mere, ntụgharị a na-agbaso isi mmalite ahụ, ma na-edebe ọgụgụ ọzọ dị mkpa n'okpuru ala kama ijikọta ya n'ahịrịokwu bụ isi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. “Mgbe ha ka na-ekwu” na-enye genitive absolute n'ụzọ eke, ebe “ya onwe ya” na-echekwa nkwusi ike dị na αὐτός.
