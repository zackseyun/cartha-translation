source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: ig
  text: Ha kpọọrọ ya isiala[a], wee laghachi na Jerusalem n’ọṅụ dị ukwuu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ odide anaghị agụnye okwu ndị a: “kpọọrọ ya isiala.”'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: N’usoro akụkọ Igbo, “wee” na-ejikọta omume ahụ na ihe bu ya ụzọ n’ụzọ dị mfe ma na-egosi ihe sochiri ya, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: αὐτοὶ
  choice: Ha
  rationale: Nnọchiaha ahụ pụtara ìhè na Grik. “Ha” bụ ụzọ Igbo nkịtị na nke doro anya si egosi ndị ahụ n’enweghị imesi okwu ike gabiga ókè.
- source_word: προσκυνήσαντες αὐτόν
  choice: kpọrọ ya isiala
  rationale: Nkebi a na-egosi omume mere tupu ha alaghachi. “Ịkpọ isiala” nwere ike ịpụta ife ofufe ma ọ bụ ịkpọrọ onye isi ala/ịsọpụrụ ya, ya mere ọ na-echekwa obosara ihe προσκυνέω pụrụ ịpụta n’ebe a.
- source_word: ὑπέστρεψαν
  choice: laghachi
  rationale: “Laghachi” bụ okwu Igbo dị mfe ma kpọmkwem maka ịga azụ n’ebe mmadụ si bịa.
- source_word: εἰς Ἰερουσαλήμ
  choice: na Jeruselem
  rationale: “Na Jeruselem” bụ ụzọ Igbo sitere n’okike si akọ ebe ha laghachiri.
- source_word: μετὰ χαρᾶς μεγάλης
  choice: n’ọṅụ dị ukwuu
  rationale: Nhọrọ a na-echekwa ma aha χαρά (“ọṅụ”) ma ike adjective μεγάλη (“dị ukwuu”) n’Igbo doro anya.
theological_decisions:
- issue: Ihe προσκυνέω pụtara mgbe a na-ekwu maka Jizọs bilitere n’ọnwụ
  choice: kpọrọ ya isiala
  alternative: fee ya ofufe
  rationale: “Kpọrọ ya isiala” na-egosipụta omume nsọpụrụ miri emi ma hapụkwa esemokwu okwu ahụ nwere n’etiti ịkpọ isiala, inye nsọpụrụ, na ife ofufe. Ọ naghị ebelata ịdị mkpa nke ọnọdụ ahụ, ma ọ naghịkwa ekpebi naanị otu nghọta nke okwu Grik ahụ n’isiokwu bụ isi.
- issue: 'Nkebi ederede a na-ejighị n’aka: [προσκυνήσαντες αὐτόν]'
  choice: E tinyere ya n’isiokwu ma tinye akara nkọwa [a]
  alternative: Ịhapụ nkebi ahụ kpamkpam
  rationale: SBLGNT nyere nkebi ahụ ma jiri akara gosi na ihe akaebe odide dị iche. Ya mere, e debere ya n’isiokwu, ma nkọwa ala peeji kọwara na ụfọdụ odide ochie enweghị ya.
translation_notes:
  register: Asụsụ bụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “kpọrọ ya isiala” chekwaa obosara okwu Grik προσκυνέω; ọ pụrụ igosi ife ofufe ma ọ bụ inye nsọpụrụ site n’ịkpọ isiala. Akara [a] dị n’isiokwu n’ebe nkebi ederede a na-ejighị n’aka nọ.
