  to: Mgbe ahụ, o duuru ha pụọ ruo Betani[a], wee welie aka ya abụọ elu gọzie ha.
  rationale: The revision preserves every element of the Greek while using the non-contrastive narrative connector “wee” and the more natural phrase “welie aka ya abụọ elu.” The note has been recast to present viable Igbo alternatives for the somewhat full directional expression ἕως πρὸς Βηθανίαν, without resolving its nuance more narrowly than the source permits.
