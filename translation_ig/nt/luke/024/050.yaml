id: LUK.24.50
reference: Luke 24:50
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐξήγαγεν δὲ αὐτοὺς ⸀ἕως ⸀πρὸς Βηθανίαν, καὶ ἐπάρας τὰς χεῖρας αὐτοῦ εὐλόγησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: ig
  text: Mgbe ahụ, o duuru ha pụọ ruo Betani[a], wee welie aka ya abụọ elu gọzie ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ruo n’ebe Betani dị” ma ọ bụ “ruo nso Betani.” Okwu Grik ahụ na-ekwu n’ụzọ zuru ezu, “ruo n’ebe Betani dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: o duuru ha pụọ
  rationale: Nke a na-egosipụta ma idu ha ma ntụgharị nganiihu ἐξ-, ya bụ, ịpụ n’otu ebe; ọ bụkwa okwu Igbo doro anya.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a δέ na-akwalite akụkọ gaa n’ihu, ọ naghị egosi nnukwu mmegide.
- source_word: ἕως πρὸς Βηθανίαν
  choice: ruo Betani
  rationale: Nke a na-egosipụta ókè njem ahụ n’ụzọ Igbo dị mfe, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ nke okwu Grik ahụ.
- source_word: Βηθανίαν
  choice: Betani
  rationale: Nke a bụ ntụgharị aha obodo ahụ n’usoro mkpọpụta na odide Igbo.
- source_word: ἐπάρας τὰς χεῖρας αὐτοῦ
  choice: welie aka ya abụọ
  rationale: Nke a na-egosipụta omume ibuli aka tupu ngọzi ahụ; “aka ya abụọ” na-echekwa plural τὰς χεῖρας n’ụzọ doro anya.
- source_word: εὐλόγησεν αὐτούς
  choice: gọzie ha
  rationale: Nke a bụ okwu Igbo e ji ekwu inye mmadụ ngọzi, na-enweghị ịgbakwunye usoro emume okpukpe na-adịghị n’ederede.
theological_decisions:
- issue: Ụdị omume Jizọs mere mgbe ọ gọziri ndị na-eso ụzọ ya
  choice: gọzie ha
  alternative: kwuo okwu ngọzi n’isi ha
  rationale: A hapụrụ okwu ahụ ka ọ bụrụ omume ngọzi dị mfe dịka ederede si kwuo, n’etinyeghị nkọwa ụka ma ọ bụ nke ndị nchụàjà n’ime ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Mgbe ahụ” maka mmegharị akụkọ, “duuru ha pụọ” maka ntụgharị ụzọ, na “welie aka ya abụọ” iji mee ka aka abụọ dị n’ederede Grik pụta ìhè.
