id: LUK.24.28
reference: Luke 24:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: ig
  text: Ha bịaruru nso n’obodo nta ahụ ha na-aga[a], ma ya onwe ya mere ka à ga-asị na ọ na-aga n’ihu karịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o mere ka à ga-asị na ọ ga-aga n’ihu karịa,” ma ọ bụ “o mere ka ọ na-aga n’ihu karịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: ha bịaruru nso
  rationale: Nkebi a na-egosi na ha rutere nso n’ebe ahụ, ma ọ bụghị na ha abanyelarị n’ime ya; ọ bụkwa okwu Igbo doro anya nke na-echekwa echiche ngagharị ahụ.
- source_word: κώμην
  choice: obodo nta
  rationale: κώμη na-ezokarị aka n’obodo pere mpe karịa nnukwu obodo; “obodo nta” bụ okwu Igbo nkịtị ma kwekọọ n’ogo ebe ahụ.
- source_word: οὗ ἐπορεύοντο
  choice: ahụ ha na-aga
  rationale: Ọ na-egosi ebe njem ha na-aga, ebe imperfect na-egosikwa njem na-aga n’ihu. Usoro a bụ Igbo ebumpụta ụwa.
- source_word: προσεποιήσατο
  choice: o mere ka à ga-asị
  rationale: Nke a na-egosi na o nyere ha echiche na ọ ga-aga n’ihu, n’etinyeghị ozugbo ebubo aghụghọ nke okwu dịka “o mere ka à ga-asị” nwere ike izere karịa “o mere onwe ya ka ọ bụ ụgha.”
- source_word: πορρώτερον
  choice: n’ihu karịa
  rationale: N’ọnọdụ njem a, okwu a pụtara ịga ebe dị anya karịa ma ọ bụ ịga n’ihu karịa obodo ahụ.
- source_word: πορεύεσθαι
  choice: ọ na-aga
  rationale: Infinitive a bụ ihe e gosipụtara dịka omume ọ na-achọ ime; “ọ na-aga” dabara n’usoro Igbo “o mere ka à ga-asị na...”
theological_decisions:
- issue: Otú e si asụgharị προσεποιήσατο gbasara omume Jizọs
  choice: o mere ka à ga-asị na ọ na-aga n’ihu karịa
  alternative: o mere onwe ya ka onye na-aga n’ihu karịa; o mere ka ha chee na ọ na-aga n’ihu karịa
  rationale: Nhọrọ a na-echekwa esemokwu dị n’akụkọ ahụ—na o nyere ọdịdị nke ịga n’ihu—ma ọ naghị ekpebi na omume ahụ bụ aghụghọ n’echiche omume ọma.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. “Obodo nta” na “bịaruru nso” bụ okwu ndị mmadụ na-aghọta ngwa ngwa; “o mere ka à ga-asị” na-echekwa nghọta Greek ahụ n’enweghị ịkọwa ya karịa ihe ederede kwuru.
