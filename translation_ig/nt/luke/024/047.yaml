revisions:
- from: ka e wee kwusaa n’aha ya nye mba niile nchegharị maka mgbaghara mmehie[b][a], malite na Jerusalem.
  to: ka e kwusaa nchegharị na mgbaghara mmehie n’aha ya nye mba niile[b][a], malite na Jerusalem.
  rationale: The revision follows the explicit καί (“na”) in the Greek main text, avoiding a decision about the exact theological or syntactic relation between repentance and forgiveness. It retains the alternative linked reading in a note, preserves the universal reference of πάντα τὰ ἔθνη, and makes the proclamation clause more idiomatic and semantically neutral in Standard Igbo.
