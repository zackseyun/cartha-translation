    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “nye ndị mba ọzọ niile.” N’ọnọdụ ụfọdụ, okwu Grik ahụ nwekwara ike ịpụta “ndị mba ọzọ.”
    reason: lexical_alternative
