id: LUK.24.47
reference: Luke 24:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: ig
  text: ka e kwusaa nchegharị na mgbaghara mmehie n’aha ya nye mba niile[b][a], malite na Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nchegharị maka mgbaghara mmehie”; a pụrụ ịghọta ihe abụọ ahụ a kpọrọ aha n’asụsụ Grik dịka ozi nwere njikọ chiri anya.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “nye ndị mba ọzọ niile.” N’ọnọdụ ụfọdụ, okwu Grik ahụ nwekwara ike ịpụta “ndị mba ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: ka e wee kwusaa
  rationale: Na-egosipụta infinitive passive nke na-adabere n’ihe e kwuru banyere mmezu Akwụkwọ Nsọ, ma na-edobe echiche nke ikwupụta ozi n’ihu ọha.
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: n’aha ya
  rationale: Nke a bụ akpaalaokwu Igbo doro anya nke na-egosipụta ikike na ntọala dị n’onye ahụ, ya bụ Jizọs.
- source_word: μετάνοιαν
  choice: nchegharị
  rationale: Okwu Igbo a na-egosi ịgbanwe obi na ụzọ mmadụ ma laghachikwute Chineke; ọ dabara n’ụdị aha nke okwu Grik ahụ.
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: maka mgbaghara mmehie
  rationale: Ọ na-ejikọta nchegharị na mgbaghara mmehie n’ụzọ sitere n’usoro ahịrịokwu ahụ, ma ọ naghị akọwa usoro ozizi karịrị ihe ederede kwuru.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: nye mba niile
  rationale: Na-edobe oke ozi ahụ ruo mba niile; ‘mba’ nwekwara ike ịgụnye ndị mba ọzọ dabere n’ọnọdụ.
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: malite na Jerusalem
  rationale: Na-egosipụta Jerusalem dịka ebe mbido nkwusa ahụ n’Igbo nkịtị ma doo anya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nchegharị na mgbaghara mmehie
  choice: nchegharị maka mgbaghara mmehie
  alternative: nchegharị na mgbaghara mmehie
  rationale: Okwu Grik nwere ike ijikọ ha dịka ihe abụọ a na-ekwusa, ma ọ pụkwara igosi njikọ chiri anya n’etiti nchegharị na mgbaghara. Isi ederede na-edobe njikọ ahụ, ebe nkọwa ala peeji na-echekwa ọgụgụ ọzọ.
- issue: Ihe ἔθνη pụtara
  choice: mba niile
  alternative: ndị mba ọzọ niile
  rationale: ‘Mba niile’ na-echekwa oke zuru ụwa ọnụ nke ozi ahụ ma ghara imechi okwu ahụ nanị n’ebe ndị na-abụghị ndị Juu nọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro na nkwekọrịta nke Grik ebe ọ na-ada ka Igbo nkịtị.
