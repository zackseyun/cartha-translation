id: LUK.24.7
reference: Luke 24:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: ig
  text: na-asị na, “Nwa nke Mmadụ aghaghị ka e nyefee ya n’aka ndị mmehie, ka a kpọgide ya n’obe, ka o bilie n’ụbọchị nke atọ[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka e rara ya nye n’aka ndị mmehie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “bilie.” Ngwaa Grik ahụ na-ekwu na ọ ga-ebili n’onwe ya, ọ bụghị na a ga-akpọlite ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: na-asị na
  rationale: Ọ bụ participle nke na-aga n’ihu n’okwu amaokwu bu ụzọ; nsụgharị a na-ejigide njikọ ahụ kama ime ya ngwaa zuru ezu ọhụrụ.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a bụ aha a na-amata nke ọma n’Oziọma, ọ na-echekwakwa njikọ ya na ojiji Akwụkwọ Nsọ ndị ọzọ.
- source_word: ὅτι δεῖ
  choice: A ghaghị
  rationale: Ọ na-egosi mkpa dị n’atụmatụ Chineke, ọ bụghị naanị amụma banyere ihe ga-eme.
- source_word: παραδοθῆναι
  choice: inyefe
  rationale: Ọ pụtara inyefe mmadụ n’aka ma ọ bụ n’ike ndị ọzọ; ọ karịrị naanị nrara Judas nyeere Jizọs.
- source_word: εἰς χεῖρας
  choice: n’aka
  rationale: Akpaalaokwu Igbo a na-egosi inyefe mmadụ n’ike ma ọ bụ n’okpuru ọchịchị ndị ọzọ, ma na-echekwa ihe oyiyi nke Grik.
- source_word: ἀνθρώπων ἁμαρτωλῶν
  choice: ndị ikom mmehie
  rationale: Grik ahụ bụ masculine plural, ọnọdụ akụkọ ahụ na-ezo aka n’ebe ndị ikom jidere ma gbuo Jizọs nọ.
- source_word: σταυρωθῆναι
  choice: kpọgidekwa ya n’obe
  rationale: Nke a bụ ụzọ Igbo doro anya ma zie ezi isi kwuo ọnwụ site n’ịkpọgide n’obe.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: n’ụbọchị nke atọ
  rationale: Ọ na-enye dative nke oge n’ụzọ Igbo eke, na-agbakwụghị ihe na-adịghị na isiokwu.
- source_word: ἀναστῆναι
  choice: ya ebilikwa
  rationale: Grik bụ active infinitive; nsụgharị a na-echekwa na ọ bụ ya biliri, ọ bụghị passive ‘a kpọlitere ya.’
theological_decisions:
- issue: Ike nke δεῖ n’amụma banyere ahụhụ Jizọs
  choice: A ghaghị, nke na-egosi mkpa dị n’atụmatụ Chineke
  alternative: ọ ga-eme, dịka naanị amụma banyere ọdịnihu
  rationale: N’akwụkwọ Luk, δεῖ na-egosikarị ihe ga-emerịrị iji mezuo atụmatụ nzọpụta Chineke; ‘A ghaghị’ na-echekwa ịdị arọ ahụ n’akọwaghị ya karịa ederede.
- issue: Ịsụgharị ἀνθρώπων ἁμαρτωλῶν n’ụzọ na-egosi okike
  choice: ndị ikom mmehie
  alternative: ndị mmehie; ụmụ mmadụ mmehie
  rationale: Ụdị Grik bụ masculine plural, ndị a na-ekwu maka ha n’ọnọdụ a bụ ndị ikom tinyere aka n’ijide na ịkpọgide Jizọs n’obe.
- issue: Voice nke ἀναστῆναι
  choice: ya ebilikwa
  alternative: a kpọlitekwa ya
  rationale: Ụdị ngwaa Grik ebe a bụ active, ya mere e kwesịghị ịgbanwe ya ka ọ bụrụ passive, n’agbanyeghị na passive bụ ezi echiche n’amaokwu ndị ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Nwa nke Mmadụ’ chekwaa aha Oziọma ahụ; e ji usoro okwu a na-asụkarị ‘kpọgide ya n’obe’ mee ka okwu ahụ doo anya. Akara nkọwa ala peeji [a] na [b] dị n’ederede isi.
