review_pass:
  verdict: revise
  source_fidelity: Mkpa dị na δεῖ, ntinye n’aka ndị mmehie, ịkpọgide n’obe, na mbilite n’ụbọchị nke atọ ka e chekwabara. Otú ọ dị, ederede mbụ anaghị akọwapụta nke ọma voice passive nke παραδοθῆναι na σταυρωθῆναι, ebe ọ na-ekwu “inyefe” na “kpọgidekwa ya” n’enweghị “e/a” passive kwesịrị ekwesị.
  naturalness: “Ndị ikom mmehie” adịghị ada n’Igbo Standard nke ọma; “ndị mmehie” bụ okwu eke ma na-anọchi anya ἀνθρώπων ἁμαρτωλῶν n’enweghị ịgbakwunye nkọwa na-adịghị mkpa. Usoro “Nwa nke Mmadụ aghaghị ka e…” na-eme ka usoro infinitive atọ ahụ bụrụ Igbo doro anya.
  terminology: “Nwa nke Mmadụ,” “ndị mmehie,” “kpọgide n’obe,” na “bilie” kwekọrọ na register Akwụkwọ Nsọ Igbo ma na-echekwa active nke ἀναστῆναι. Nkọwa ala b agbanweela okwu asụsụ Bekee “active/passive” ka ọ bụrụ nkọwa Igbo doro anya.
  issues:
  - severity: medium
    issue: Voice passive adịghị doo anya na “inyefe” na “kpọgidekwa ya n’obe.”
    rationale: παραδοθῆναι na σταυρωθῆναι bụ infinitive passive abụọ. “Ka e nyefee ya” na “ka a kpọgide ya” na-egosi na ndị ọzọ ga-eme omume ndị a n’ahụ Nwa nke Mmadụ.
  - severity: medium
    issue: “ndị ikom mmehie” bụ collocation na-adịghị eke.
    rationale: N’agbanyeghị na ἀνθρώπων dị masculine plural n’ụdị ụtọasụsụ, “ndị mmehie” bụ nsụgharị Igbo nkịtị, ziri ezi n’ọnọdụ a, nke na-adịghị akpata nkwughachi na-adịghị eke.
  - severity: low
    issue: Nkọwa ala a anaghị enye alternative ahụ n’usoro passive zuru ezu.
    rationale: E degharịrị ya ka ọ na-atụpụta “ka e nyefee ya,” nke kwekọrọ na infinitive passive Gris.
