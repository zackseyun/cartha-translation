id: LUK.24.15
reference: Luke 24:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ὁμιλεῖν αὐτοὺς καὶ συζητεῖν καὶ ⸀αὐτὸς Ἰησοῦς ἐγγίσας συνεπορεύετο αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/015.yaml
  text: And it happened that while they were talking and discussing[b][a], Jesus himself came near and was going with them.
translation:
  language: ig
  text: O wee mee na, mgbe ha na-akparịta ụka ma na-atụlekọrịta[a], Jizọs n'onwe ya bịara ha nso ma soro ha na-aga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-arụrịta ụka”; okwu Grik ahụ nwere ike igosi mkparịta ụka siri ike karị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “bịara ha nso wee soro ha gaa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Ọ bụ usoro akụkọ Luk ji akwagharị akụkọ gaa n'ihe ọzọ mere; nsụgharị a bụ Igbo dị ugbu a ma na-edobe echiche nke ihe mere.
- source_word: ἐν τῷ ὁμιλεῖν
  choice: mgbe ha na-akparịta ụka
  rationale: Ụdị infinitive nwere ἐν na-egosi oge, ya bụ ‘mgbe/as’; ‘na-akparịta ụka’ na-egosi mkparịta ụka nkịtị n'ụzọ doro anya.
- source_word: συζητεῖν
  choice: na-atụle okwu ahụ
  rationale: Okwu Grik a nwere ike ịbụ ịtụle okwu ọnụ ma ọ bụ arụmụka siri ike. ‘Na-atụle okwu ahụ’ na-edobe nkọwa sara mbara n'etinyeghị iro na-adịghị n'amaokwu ahụ kpọmkwem.
- source_word: αὐτὸς Ἰησοῦς
  choice: Jizọs n'onwe ya
  rationale: αὐτός na-emesi onye ahụ ike; ‘n'onwe ya’ na-edobe nkwusi ike ahụ.
- source_word: ἐγγίσας
  choice: bịaruru ha nso
  rationale: Ọ na-egosi na Jizọs rutere nso n'ebe ha nọ tupu ma ọ bụ mgbe ọ malitere iso ha aga.
- source_word: συνεπορεύετο
  choice: soro ha na-aga
  rationale: Imperfect na-egosi omume na-aga n'ihu; ‘soro ha na-aga’ bụ Igbo nkịtị nke na-egosi na ọ nọgidere na-eso ha n'ụzọ.
- source_word: καὶ ... καὶ ... καὶ
  choice: ma ... , ...
  rationale: A haziri njikọ ndị ahụ ka ha daa nke ọma n'Igbo, ma usoro ihe omume na njikọ nke mkparịta ụka abụọ ahụ ka dị.
theological_decisions:
- issue: Nkwusi ike n'aha onye bịaruru ha nso
  choice: Jizọs n'onwe ya
  alternative: Jizọs
  rationale: Ihe odide ahụ na-eji αὐτός emesi ike na ọ bụ Jizọs n'onwe ya bịaruru ha nso; e debere nkwusi ike ụtọasụsụ a n'etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘O wee ruo na’ mee ka ụda akụkọ Luk pụta, ma zere asụsụ ochie gabigara ókè. Akara ntụaka ụkwụ [a] na [b] dị n'ahịrị isi.
