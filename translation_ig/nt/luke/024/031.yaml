id: LUK.24.31
reference: Luke 24:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: ig
  text: Mgbe ahụ, e meghere anya ha, ha wee mata ya; o wee ghọọ onye ha na-adịghị ahụ anya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o wee pụọ n’ebe ha nọ,” ma ọ bụ, “o wee pụọ n’anya ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: e meghere
  rationale: Oge gara aga n'ụdị nnara nke διανοίγω; ọ na-echekwa echiche na e mere ka nghọta ha meghee, ọ bụghị na ha ji aka ha mee ya.
- source_word: οἱ ὀφθαλμοὶ
  choice: anya ha
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo genitive αὐτῶν na isiokwu οἱ ὀφθαλμοί.
- source_word: ἐπέγνωσαν
  choice: mata
  rationale: N'ọnọdụ akụkọ Emaus, okwu a pụtara ịmata onye ha na-amatabeghị onye ọ bụ.
- source_word: ἄφαντος
  choice: onye ha na-apụghị ịhụ anya
  rationale: Ọ na-egosi na a naghị ahụ ya anya, na-akọwaghị kpọmkwem otú nke ahụ siri mee.
- source_word: ἐγένετο ἀπ’ αὐτῶν
  choice: o wee ghọọ onye ha na-apụghị ịhụ anya
  rationale: Ntụgharị a na-echekwa echiche mmekọrịta nke ἀπ’ αὐτῶν—ha enweghịzi ike ịhụ ya—ma zere Igbo na-adịghị aga nke ọma ma e soro okwu Grik n'usoro nkịtị.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N'ebe a δέ na-ebuga akụkọ n'ihe mere sochirinụ; “Mgbe ahụ” bụ Igbo doro anya ma dị larịị.
theological_decisions:
- issue: Ụdị otu Jizọs si kwụsị ịbụ onye ha na-ahụ anya
  choice: o wee ghọọ onye ha na-apụghị ịhụ anya
  alternative: o wee pụọ n'anya ha
  rationale: ἄφαντος na ἐγένετο na-ekwu kpọmkwem na ọ ghọrọ onye a naghị ahụ anya. Nhọrọ a na-ahapụ ihe omimi nke ihe mere, n'akọwaghị ma ọ bụ mwepụ n'otu ntabi anya ma ọ bụ usoro ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. Ejiri usoro “ha wee…; o wee…” mee ka mmegharị akụkọ doo anya, ma debe ihe edemede Grik na-akọwaghị kpọmkwem banyere otú Jizọs siri kwụsị ịbụ onye ha na-ahụ anya.
