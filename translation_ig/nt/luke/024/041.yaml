  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: ig
  text: Ma mgbe ha ka na-ekweghị n’ihi ọṅụ, na-atụkwa n’anya[a], ọ sịrị ha, “Ùnụ nwere ihe oriri ọ bụla n’ebe a?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ha ka na-ekweghị n’ihi ọṅụ, ha na-enwekwa ihe ijuanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ
  choice: Ma mgbe ha ka
  rationale: “Ka” na-egosi na ọnọdụ ahụ gara n’ihu, ebe “ma” na-ejikọta okwu a nwayọọ na ihe bu ya ụzọ; “mgbe” na-eme ka nkebi participle ahụ daa nke ọma n’Igbo.
- source_word: ἀπιστούντων
  choice: na-ekweghị
  rationale: Ọdịdị participle nke ugbu a na-egosi omume na-aga n’ihu. “Ka na-ekweghị” na-echekwa nke a n’enweghị ime ka ọ bụrụ ekweghị ekwe siri ike ma ọ bụ nke na-adịgide adịgide.
- source_word: ἀπὸ τῆς χαρᾶς
  choice: n’ihi ọṅụ
  rationale: 'ἀπό n’ebe a na-egosi ihe kpatara ọnọdụ ahụ. “N’ihi ọṅụ” na-egosipụta ihe mgbagwoju anya dị n’okwu ahụ: oke ọṅụ ha so mee ka o siere ha ike ikwere.'
- source_word: θαυμαζόντων
  choice: na-atụkwa n’anya
  rationale: Nkebi a na-egosi na ịtụ n’anya ahụ na-aga n’ihu n’otu oge ahụ ha ka na-ekweghị; “-kwa” na-ejikọta omume abụọ ahụ.
- source_word: Ἔχετέ
  choice: Ùnụ nwere
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi jụọ ma ndị a nwere ihe ahụ ugbu a.
- source_word: τι
  choice: ọ bụla
  rationale: N’ajụjụ a, τι nwere echiche nke ihe ọ bụla a pụrụ inwe, nke “ọ bụla” na-egosipụta nke ọma.
- source_word: βρώσιμον
  choice: ihe oriri
  rationale: βρώσιμον pụtara ihe kwesịrị iri ma ọ bụ ihe a pụrụ iri. “Ihe oriri” bụ okwu Igbo dị mfe ma kwekọọ n’ajụjụ ahụ.
- source_word: ἐνθάδε
  choice: n’ebe a
  rationale: Ọ na-egosi ebe ihe ahụ dị; “n’ebe a” bụ ntụgharị Igbo nkịtị na kpọmkwem.
theological_decisions:
- issue: Ụdị mmeghachi omume ndị na-eso ụzọ n’ebe Jizọs ahụ e mere ka o si n’ọnwụ bilie nọ
  choice: E chekwara okwu na-egosi na ha ka na-ekweghị n’ihi oke ọṅụ, ma na-atụkwa n’anya.
  alternative: Ịsụgharị ya nanị dị ka obi abụọ ma ọ bụ ekweghị ekwe na-enweghị igosi na ọṅụ so kpatara ya.
  rationale: Okwu Grik na-ejikọta ekweghị ha, ọṅụ ha, na ịtụ n’anya ha. Ya mere, ntụgharị ahụ echekwaghị mmeghachi omume a dị mgbagwoju anya kama idozi ya ka ọ bụrụ nanị ekweghị ekwe siri ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Usoro “ka na-” na-echekwa omume na-aga n’ihu, ebe “n’ihi ọṅụ” na-ahapụ esemokwu mmetụta uche dị n’amaokwu ahụ ka ọ dị.
