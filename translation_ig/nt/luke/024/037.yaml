revisions:
- from: Ma ọ wụrụ ha akpata oyi, egwu wee jide ha; ha chere na ha na-ahụ mmụọ[a].
  to: Ma ha tururu akpata oyi ma tụọ egwu, wee chee na ha na-ahụ mmụọ[a].
  rationale: The revision gives the disciples directly as the experiencers of both sudden alarm and fear, maintains the sequence of reactions, and retains “mmụọ” for πνεῦμα. The footnote preserves the contextually possible sense “ghost” without narrowing the main text beyond the Greek.
  reviewer_model: gpt-5.6-terra
