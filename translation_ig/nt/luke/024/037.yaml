id: LUK.24.37
reference: Luke 24:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: ig
  text: Ma ha tururu akpata oyi ma tụọ egwu, wee chee na ha na-ahụ mmụọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ onye nwụrụ anwụ.” Okwu Grik bụ πνεῦμα, nke pụtara “mmụọ” n’ụzọ nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: ọ wụrụ ha akpata oyi
  rationale: Nkebi okwu a na-egosi na ihe ahụ mere ka ha maa jijiji na mberede; ọ na-egosipụta akpata oyi ahụ n’enweghị ikwughachi okwu e ji sụgharịa egwu sochirinụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị dị nro site n’ọdịdị Jizọs gaa n’otú ndị na-eso ụzọ si meghachi omume.
- source_word: ἔμφοβοι γενόμενοι
  choice: egwu wee jide ha
  rationale: Nke a na-egosi na ha banyere n’ọnọdụ egwu, dịka γενόμενοι si egosi mgbanwe ọnọdụ.
- source_word: ἐδόκουν
  choice: ha chere
  rationale: Ọ na-egosi echiche ma ọ bụ nkwenye ha nwere n’oge ahụ, n’asụsụ Igbo dị mfe ma bụrụkwa nke okike.
- source_word: πνεῦμα
  choice: mmụọ
  rationale: ‘Mmụọ’ bụ okwu Igbo kacha nso na πνεῦμα ma na-edobe ohere nke nghọta ya dịka mmụọ na-enweghị ahụ, n’enweghị itinye echiche ọdịnala ndị ọzọ n’ime ya.
- source_word: θεωρεῖν
  choice: na ha na-ahụ
  rationale: Usoro ‘na-ahụ’ na-egosipụta omume ịhụ nke na-aga n’ihu, dịka infinitive nke oge ugbu a si dị.
theological_decisions:
- issue: Nsụgharị πνεῦμα n’akụkọ banyere ọdịdị Jizọs mgbe o si n’ọnwụ bilie
  choice: mmụọ
  alternative: mụọ onye nwụrụ anwụ
  rationale: '‘Mmụọ’ dị nso n’okwu Grik ma na-edobe esemokwu dị n’akụkọ ahụ: ndị na-eso ụzọ chere na ha na-ahụ ihe na-enweghị anụ ahụ, ma amaokwu ndị na-esochi ga-eme ka ihe ahụ doo anya. Nsụgharị ahụ anaghị eburu ụzọ dozie esemokwu ahụ.'
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. Nkebi abụọ mbụ na-edobe usoro mmeghachi omume dị na Grik: akpata oyi na mberede, emesịa egwu jide ha.'
