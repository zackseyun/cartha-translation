review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the main sense well: sudden alarm, fear, their supposition, and πνεῦμα as “mmụọ.” However, “ọ wụrụ ha akpata oyi” uses an impersonal construction with no expressed referent and is less direct than the Greek participle describing the disciples themselves. “Egwu wee jide ha” is understandable but less closely reflects their entering a state of fear.'
  naturalness: The existing wording is generally intelligible Standard Igbo, but “ha tururu akpata oyi ma tụọ egwu” is more natural, concise, and directly attributes both reactions to the disciples.
  terminology: “Mmụọ” is the appropriate primary rendering of πνεῦμα and preserves the narrative’s ambiguity without importing a specific folk concept. The footnote’s “mmụọ onye nwụrụ anwụ” is a suitable contextual alternative for “ghost.”
  issues:
  - severity: medium
    issue: The opening expression is syntactically impersonal and has an unexpressed referent.
    rationale: “Ọ wụrụ ha akpata oyi” literally frames the event as something that shocked them, whereas πτοηθέντες directly characterizes the disciples as being startled. A personal construction is clearer and closer to the source.
  - severity: low
    issue: The fear phrase does not express the ingressive transition as directly as it could.
    rationale: “Egwu wee jide ha” is idiomatic, but “tụọ egwu” more economically presents their becoming afraid, corresponding to ἔμφοβοι γενόμενοι.
  revised_text: Ma ha tururu akpata oyi ma tụọ egwu, wee chee na ha na-ahụ mmụọ[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ onye nwụrụ anwụ.” Okwu Grik bụ πνεῦμα, nke pụtara “mmụọ” n’ụzọ nkịtị.
    reason: lexical_alternative
  revision_rationale: The revision gives the disciples directly as the experiencers of both sudden alarm and fear, maintains the sequence of reactions, and retains “mmụọ” for πνεῦμα. The footnote preserves the contextually possible sense “ghost” without narrowing the main text beyond the Greek.
