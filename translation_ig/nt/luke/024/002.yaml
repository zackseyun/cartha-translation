review_pass:
  verdict: revise
  source_fidelity: The draft correctly supplies the plural subject and preserves the passive, resultant-state sense of ἀποκεκυλισμένον. However, “a kwapụla” ordinarily means ‘has been cleared/swept away’ and does not adequately convey the rolling inherent in ἀποκυλίω. “Ọnụ ili” is a plausible contextual clarification but is more specific than the Greek, which says simply ‘from the tomb.’
  naturalness: The sentence is generally natural Standard Igbo. Replacing the verb with “a tụgharịrịla ... pụọ n’ili ahụ” gives a more faithful and still idiomatic expression for the stone having been rolled away.
  terminology: “Nkume” and “ili” are appropriate, clear terms for λίθος and μνημεῖον. The revision retains the unnamed passive agent and adds no theological interpretation.
  issues:
  - severity: medium
    issue: “a kwapụla” does not express that the stone was rolled away.
    rationale: The perfect passive participle ἀποκεκυλισμένον derives from a verb meaning ‘roll away.’ A term for clearing or sweeping away weakens this concrete motion.
  - severity: low
    issue: “site n’ọnụ ili ahụ” adds ‘entrance/mouth’ beyond the source wording.
    rationale: Although the context concerns a tomb entrance, ἀπὸ τοῦ μνημείου states only that the stone was away from the tomb. “pụọ n’ili ahụ” stays closer to the Greek without sacrificing naturalness.
  revised_text: Ha wee hụ na a tụgharịrịla nkume ahụ pụọ n’ili ahụ.
