source:
  edition: SBLGNT
  text: εὗρον δὲ τὸν λίθον ἀποκεκυλισμένον ἀπὸ τοῦ μνημείου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/002.yaml
  text: And they found the stone rolled away from the tomb,
translation:
  language: ig
  text: Ha wee hụ na a tụgharịrịla nkume ahụ pụọ n’ili ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: ha wee hụ
  rationale: Ngwaa a bụ aorist active indicative, onye nke atọ n'ọtụtụ; isiokwu ya a na-ekwughị kpọmkwem bụ ụmụ nwanyị ndị a kpọrọ aha n'amaokwu bu ụzọ. “Ha wee hụ” na-enye Igbo dị n'usoro akụkọ ma na-edobe ihe okwu ahụ pụtara.
- source_word: δὲ
  choice: wee
  rationale: N'ebe a δέ bụ njikọ dị nro nke na-aga n'ihu n'akụkọ, ọ bụghị nnukwu mmegide. “Wee” bụ ụzọ ebumpụta ụwa e si jikọta ihe omume ndị gara n'usoro n'Igbo.
- source_word: τὸν λίθον
  choice: nkume ahụ
  rationale: N'ọnọdụ olili a, λίθος bụ nkume e ji mechie ọnụ ili; “nkume ahụ” bụ okwu doro anya ma na-ezo aka n'otu nkume ahụ a kpọtụrụ aha n'akụkọ.
- source_word: ἀποκεκυλισμένον
  choice: a kwapụla
  rationale: Perfect passive participle a na-egosi na e mere ihe ahụ nakwa na ọnọdụ ihe e mere ka dị. “A kwapụla” na-edobe olu nnara na nsonaazụ ahụ, na-akọwaghị onye mere ya.
- source_word: ἀπὸ τοῦ μνημείου
  choice: site n'ọnụ ili ahụ
  rationale: μνημεῖον n'akụkọ olili bụ ili, ebe ἀπό na-egosi na e wepụrụ nkume ahụ n'ebe ọ nọ. Ịsị “ọnụ ili” na-eme ka ọnọdụ nkume mmechi ahụ doo anya n'Igbo, dịka ihe gbara ya gburugburu na-egosi.
theological_decisions:
- issue: Isiokwu ngwaa ahụ ekwughị kpọmkwem na Grik
  choice: Ha wee hụ
  alternative: E wee hụ
  rationale: Ụdị ọtụtụ nke ngwaa Grik na-ezo azụ n'ebe ụmụ nwanyị ndị amaokwu bu ụzọ nọ. Itinye “Ha” bụ ihe ụtọasụsụ na nghọta Igbo chọrọ n'ebe a, ọ naghị agbakwunye nkọwa nkà mmụta okpukpe.
- issue: Onye kwapụrụ nkume ahụ
  choice: a kwapụla nkume ahụ
  alternative: mmadụ akwapụla nkume ahụ
  rationale: Grik jiri passive nke na-akpọghị onye mere ihe ahụ aha. Nsụgharị ahụ na-edobe enweghị nkọwa a kama ịsị na ọ bụ Chineke, mmụọ ozi, ma ọ bụ mmadụ mere ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. Ejiri usoro akụkọ “wee” mee ka amaokwu ahụ na-aga n'ihu n'ụzọ ebumpụta ụwa; enweghị akara nkọwa ala peeji n'ihi na ọ dịghị nke achọrọ.
