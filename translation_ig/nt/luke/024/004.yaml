  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: ig
  text: O wee mee na, mgbe ha nọ na-enwe mgbagwoju anya banyere ihe a, lee, ndị ikom abụọ yi uwe na-egbu maramara[a] guzoro n'akụkụ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “n’uwe na-amụke dịka àmụ̀mà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Nke a na-egosipụta usoro Luk ji ewebata ihe ọhụrụ mere n’akụkọ, ma ọ naghị ada ka okwu ochie ma ọ bụ nke siri ike.
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: mgbe ihe a nọ na-agbagwoju ha anya
  rationale: Ụdị okwu Grik a na-egosi oge ihe mere; ἀπορέω pụtara na ha amaghị ihe ha ga-eche ma ọ bụ na ihe ahụ gbagwojuru ha anya, ọ bụghị nanị na ha nọ na-eche banyere ya.
- source_word: περὶ τούτου
  choice: ihe a
  rationale: Ọ na-ezo aka n’ihe a kọwara n’amaokwu ndị bu ụzọ; itinye ya n’usoro ‘ihe a nọ na-agbagwoju ha anya’ bụ Igbo ebumpụta ụwa.
- source_word: ἰδοὺ
  choice: lee
  rationale: ‘Lee’ na-adọta uche onye na-agụ ya gaa n’ihe bịara na mberede ma na-echekwa ike okwu akụkọ ahụ.
- source_word: ἄνδρες δύο
  choice: ndị ikom abụọ
  rationale: ἀνήρ bụ ‘nwoke’ ma ọ bụ ‘ikom’ n’ebe a. Amaokwu ahụ n’onwe ya kọwara ha dị ka ndị ikom abụọ, ọ bụghị kpọmkwem dị ka ndị mmụọ ozi.
- source_word: ἐπέστησαν αὐταῖς
  choice: guzoro n'akụkụ ha
  rationale: Nhọrọ a na-echekwa echiche nke ịbịaru nso ma guzoro ha nso, n’etinyeghị nkọwa ọzọ dị ka ‘pụtara n’ihu ha.’
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: yi uwe na-egbu maramara
  rationale: Nke a bụ Igbo doro anya ma dịrị ndị mmadụ mfe, na-egosikwa ìhè uwe ahụ na-enwu; ihe oyiyi nke àmụ̀mà dị n’okwu Grik ka e debere n’ala ala peeji.
theological_decisions:
- issue: Ndị bụ mmadụ abụọ ahụ
  choice: ndị ikom abụọ
  alternative: ndị mmụọ ozi abụọ
  rationale: Ọ bụ ezie na amaokwu ndị gbara ya gburugburu na-egosi na ha bụ ndị ozi si n’eluigwe, amaokwu a kpọrọ ha ‘ndị ikom abụọ.’ Nsụgharị ahụ na-edebe otú akụkọ Grik si gosi ha n’ebe a ma ghara ibubata nkọwa sitere n’amaokwu ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. ‘O wee ruo na’ na-echekwa usoro akụkọ Luk; ‘lee’ na-eme ka mgbanwe ahụ pụta ìhè. E tinyere akara [a] ozugbo n’azụ okwu uwe nke nkọwa ala ala peeji na-akọwa.
