  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: ig
  text: Unu bụ ndị akaebe nke ihe ndị a[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu bụ ndị akaebe banyere ihe ndị a.” Nnọchiaha nrụtụ aka dị n’asụsụ Grik na-ezo aka n’ihe ndị Jizọs ka kwuru banyere ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: Unu
  rationale: Nnọchiaha onye nke abụọ n’ụbara pụtara ìhè na Grik maka imesi isiokwu ahụ ike. “Unu” bụ ụzọ doro anya ma bụrụkwa nke ebumpụta ụwa isi kwuo ya n’Igbo.
- source_word: ἐστε
  choice: bụ
  rationale: Nke a bụ ngwaa “ịbụ” n’ụdị ugbu a; “bụ” na-egosipụta ya n’ụzọ kwesịrị ekwesị n’Igbo.
- source_word: μάρτυρες
  choice: ndị akaebe
  rationale: N’ebe a, okwu ahụ pụtara ndị na-agba akaebe banyere ihe ha hụrụ ma nụ. “Ndị akaebe” na-ezere itinye n’amaokwu a echiche e mesịrị nke ịnwụ n’ihi okwukwe.
- source_word: τούτων
  choice: banyere ihe ndị a
  rationale: Nnọchiaha nrụtụ aka a dị n’ụbara ma na-ezo azụ n’ihe ndị Jizọs ka kwuru—ahụhụ ya, mbilite n’ọnwụ ya, na ozi a ga-ekwusa. “Ihe ndị a” na-eme ka ihe ọ na-ezo aka na ya doo anya n’Igbo, ebe “banyere” na-egosi ihe akaebe ha metụtara.
theological_decisions:
- issue: Ihe ọrụ ndị na-eso ụzọ dị ka μάρτυρες pụtara
  choice: Amaokwu ahụ na-akpọ ndị na-eso ụzọ ndị ga-agba akaebe banyere ihe ndị a kọrọ.
  alternative: A pụrụ ịgụ okwu ahụ site n’echiche e mesịrị nke jikọtara ịgba akaebe na ịnwụ n’ihi okwukwe.
  rationale: N’ọnọdụ okwu a, ihe bụ isi bụ ịgba akaebe banyere ahụhụ Jizọs, mbilite n’ọnwụ ya, na ozi a ga-ekwusa. Ya mere, nsụgharị ahụ anaghị ebubata n’amaokwu a nkọwa pụrụ iche nke okwu ahụ nwetara mgbe e mesịrị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. “Ndị akaebe” bụ okwu a na-ahụkarị ma dabara n’ọnọdụ ịgba akaebe; “ihe ndị a” na-eme ka nrụtụ aka Grik doo anya n’enweghị ịkọwa ihe karịrị ihe gbara amaokwu ahụ gburugburu.
