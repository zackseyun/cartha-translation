revisions:
- from: Unu bụ ndị akaebe banyere ihe ndị a[a].
  to: Unu bụ ndị akaebe nke ihe ndị a[a].
  rationale: The revision uses the more direct Igbo genitive-style relation “ndị akaebe nke ihe ndị a,” retaining the Greek sense that the disciples are witnesses of the events just described. The footnote preserves “banyere” as a viable idiomatic alternative and corrects the ambiguous “ndị a” to “ihe ndị a.”
  reviewer_model: gpt-5.6-terra
