source:
  edition: SBLGNT
  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: ig
  text: na otú ndị isi nchụàjà anyị na ndị ọchịchị anyị si nyefee ya ka a maa ya ikpe ọnwụ, nakwa kpọgide ya n’obe[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka e kpee ya ikpe ọnwụ” ma ọ bụ “ka a maa ya ikpe nke ga-ewetara ya ọnwụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “mee ka e kpọgide ya n’obe,” iji mee ka o doo anya na ọ bụ ndị isi ahụ kpatara ogbugbu ahụ, ọ bụ ezie na ndị ọchịchị Rom bụ ndị rụrụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: na otú ... si
  rationale: Ụdị a na-ejikọta okwu a na ihe e kwuru n’amaokwu bu ụzọ ma na-egosikwa na a na-akọ otú ihe ahụ si mee.
- source_word: παρέδωκαν
  choice: nyefee ya
  rationale: “Nyefee” na-egosipụta inyefe Jizọs n’aka ndị ọchịchị maka ikpe, n’etinyeghị echiche dị warara nke ‘ịrara mmadụ nye.’
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị nọ n’isi òtù ndị nchụàjà, ọ bụghị ikwu na e nwere ọtụtụ nnukwu onye nchụàjà n’otu oge.
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: ndị ọchịchị anyị
  rationale: Ọ na-echekwa echiche nke ndị nwere ikike ịchị na okwu ahụ bụ ‘anyị,’ nke na-egosi njikọ ndị na-ekwu okwu na ndị Juu.
- source_word: εἰς κρίμα θανάτου
  choice: ka a maa ya ikpe ọnwụ
  rationale: Nke a bụ Igbo dị ndụ ma doo anya nke na-echekwa echiche ikpe ma ọ bụ mkpebi ikpe nke na-eduga n’ọnwụ.
- source_word: ἐσταύρωσαν
  choice: kpọgide ya n’obe
  rationale: A hapụrụ ngwaa ahụ n’ụdị kpọmkwem dịka Grik si kwuo ya, ka ibu ọrụ ndị isi ahụ ghara ịda mba, ọ bụ ezie na ndị Rom bụ ndị rụrụ ogbugbu ahụ.
theological_decisions:
- issue: Onye e kwuru na ọ kpatara ọnwụ Jizọs
  choice: “kpọgide ya n’obe” na-ekwu kpọmkwem na ndị isi ahụ mere ya
  alternative: “mee ka a kpọgide ya n’obe”
  rationale: Grik ji ngwaa nọ n’olu ọrụ mee ka ndị isi nchụàjà na ndị ọchịchị bụrụ ndị mere ihe ahụ. Nsụgharị kpọmkwem na-echekwa ibu ọrụ e nyere ha n’akụkọ ahụ n’agbanyeghị na ndị Rom rụrụ ogbugbu ahụ n’onwe ha.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. “Ndị isi nchụàjà” na “ndị ọchịchị anyị” dabara n’ọnọdụ okpukpe na ikpe. Akara nkọwa [a] na [b] dị n’ederede isi dịka achọrọ.
