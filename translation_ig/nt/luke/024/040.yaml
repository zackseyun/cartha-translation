id: LUK.24.40
reference: Luke 24:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂[καὶ τοῦτο εἰπὼν ⸀ἔδειξεν αὐτοῖς τὰς χεῖρας καὶ τοὺς πόδας.]⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/040.yaml
  text: And after saying this[a], he showed them his hands and his feet.
translation:
  language: ig
  text: Mgbe o kwusịrị nke a,[a] o gosiri ha aka ya na ụkwụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide anaghị enwe ahịrịokwu a.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Mgbe
  rationale: N'ịjikọta ya na participle εἰπών, a sụgharịrị njikọ ahụ n'ụzọ Igbo si egosi na ihe mbụ mere tupu isi ngwaa, kama itinye “na” nke ga-ada arọ.
- source_word: τοῦτο εἰπὼν
  choice: o kwuchara nke a
  rationale: Ụdị a na-egosi n'ụzọ doro anya na okwuchara ihe ahụ tupu o gosi ha aka na ụkwụ ya.
- source_word: ἔδειξεν
  choice: o gosiri
  rationale: “Gosiri” bụ okwu Igbo nkịtị na nke ziri ezi maka ime ka mmadụ hụ ihe anya.
- source_word: αὐτοῖς
  choice: ha
  rationale: “Ha” na-arụ ọrụ dịka nnara ihe n'ụzọ Igbo kwesịrị ekwesị mgbe “gosiri” gasịrị.
- source_word: τὰς χεῖρας
  choice: aka ya
  rationale: Ọ bụ ezie na Grik ji isiokwu, Igbo na-eji nnọchiaha nwe-egosi mee ka o doo anya na aka ndị ahụ bụ nke Jizọs.
- source_word: τοὺς πόδας
  choice: ụkwụ ya
  rationale: “Ụkwụ ya” bụ ntụgharị ebumpụta ụwa nke na-egosi na ọ bụ ụkwụ Jizọs n'onwe ya.
theological_decisions:
- issue: Ọnọdụ amaokwu ahụ n'ihe akaebe ederede
  choice: Itinye ahịrịokwu ahụ n'isi ederede ma tinye nkọwa ala peeji banyere ọdịiche ederede
  alternative: Ụfọdụ ihe odide ochie enweghị ahịrịokwu a.
  rationale: SBLGNT tinyere amaokwu ahụ dum n'ime braket iji gosi na e nwere nnukwu obi abụọ gbasara ma ọ dị n'ederede mbụ. Ebe isi mmalite e nyere nwere ya, a sụgharịrị ya n'isi ederede ma debeghị ọdịiche ahụ n'ọchịchịrị.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. A họọrọ usoro “Mgbe o kwuchara...” ka usoro ihe omume doo anya ma ghara ịdị ka ntụgharị okwu n'okwu.
