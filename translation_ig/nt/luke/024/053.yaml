  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: ig
  text: Ha nọkwa n'ụlọ nsọ mgbe niile, na-agọzi Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eto Chineke.” Ngwaa Grik ahụ bụ “ịgọzi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ha nọkwa
  rationale: Ngwaa mgbakwunye “-kwa” na-ejikọta amaokwu a na akụkọ bu ya ụzọ n'ụzọ Igbo na-adị ire, na-agbakwụnyeghị nkọwa ọhụrụ.
- source_word: ἦσαν
  choice: Ha nọ
  rationale: Oge imperfect na-egosi ọnọdụ gara n'ihu; “ha nọ” na “mgbe niile” jikọtara ọnụ na-egosipụta nke a nke ọma.
- source_word: διὰ παντός
  choice: mgbe niile
  rationale: Akpaalaokwu Grik a pụtara ịdị na-eme ihe mgbe niile ma ọ bụ mgbe nile; nke a bụ okwu Igbo doro anya ma dị mfe nghọta.
- source_word: ἱερῷ
  choice: ụlọ nsọ
  rationale: ἱερόν na-ezo aka n'ogige na akụkụ niile nke ụlọ nsọ, ọ bụghị naanị ebe nsọ dị n'ime; “ụlọ nsọ” bụ aha Igbo a na-ahụkarị maka ogige ahụ dum.
- source_word: εὐλογοῦντες
  choice: na-agọzi
  rationale: Nke a na-edobe isi okwu εὐλογέω, “ịgọzi” ma ọ bụ “ikwu okwu ọma banyere,” ebe ọ ka na-enye ohere ka a ghọta ya dịka ito Chineke.
- source_word: θεόν
  choice: Chineke
  rationale: Ọ bụ onye a na-agọzi; “Chineke” bụ ntụgharị Igbo kwụ ọtọ.
theological_decisions:
- issue: Asụsụ ofufe dị na εὐλογοῦντες τὸν θεόν
  choice: na-agọzi Chineke
  alternative: na-eto Chineke
  rationale: “Na-agọzi Chineke” na-edobe ụdị okwu Grik εὐλογέω kama ịgbanwe ya ozugbo ka ọ bụrụ okwu izugbe maka ito. E tinyere “na-eto Chineke” n'ala ala peeji dịka ntụgharị ọzọ kwesịrị ekwesị n'ọnọdụ a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe mmechi akụkọ ahụ n'ụzọ mkpirikpi ma na-echekwa akpaalaokwu ofufe nke Grik.
