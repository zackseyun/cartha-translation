  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: ig
  text: Ma lee, n’ụbọchị ahụ kpọmkwem, mmadụ abụọ n’ime ha na-aga otu obodo nta dị stadia iri isii[a] site na Jerusalem, nke aha ya bụ Emmaus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Stadion bụ otu ihe e ji atụ ogologo ụzọ n’oge ochie; stadia iri isii dị ihe dị ka maịl asaa, ya bụ kilomita iri na otu.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Ma lee
  rationale: Na-edobe akara Luk ji aga n’ihu n’akụkọ ma na-adọta uche onye na-agụ ya n’ụzọ Igbo doro anya.
- source_word: δύο ἐξ αὐτῶν
  choice: mmadụ abụọ n’ime ha
  rationale: Na-egosi na mmadụ abụọ ahụ si n’otu ìgwè e kwuru okwu banyere ya, n’ebughị ụzọ kọwaa ìgwè ahụ karịa ihe Grik kwuru.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: n’ụbọchị ahụ kpọmkwem
  rationale: 'Okwu “kpọmkwem” na-ebute nkwusi ike dị na ahịrịokwu Grik: ọ bụ n’ụbọchị ahụ n’onwe ya.'
- source_word: ἦσαν πορευόμενοι
  choice: na-aga
  rationale: Na-egosi njem ka ọ na-aga n’ihu n’oge ahụ, dị ka usoro imperfect periphrastic nke Grik si dị.
- source_word: εἰς κώμην
  choice: otu obodo nta
  rationale: “Obodo nta” na-akọwa κώμη nke ọma ma dịkwa mfe nghọta n’Igbo ugbu a.
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: dị stadia iri isii site na Jerusalem
  rationale: Na-edobe ihe atụ anya ochie nke ederede mbụ; nkọwa ya n’ihe atụ anya nke oge a dị n’okpuru peeji.
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: nke aha ya bụ Emmaus
  rationale: Nsụgharị a na-edobe usoro aha doro anya nke Grik ma na-ada nke ọma n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù dee ya. E debeghị usoro Grik nke ga-eme ka okwu sie ike n’Igbo, ma e chekwara nkwusi ike, mmegharị akụkọ, na ihe atụ anya nke omenala mbụ.
