id: LUK.24.44
reference: Luke 24:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: ig
  text: 'Mgbe ahụ, ọ sịrị ha, “Ihe ndị a bụ okwu m gwara unu mgbe m ka nọnyere unu: na ihe niile e dere[a] banyere m[c] n’Iwu Mosis na n’Akwụkwọ Ndị Amụma na n’Abụ Ọma[b] ga-emezurịrị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe niile ahụ e dere.”
    reason: lexical_alternative
  - marker: b
    text: “Iwu Mosis na Akwụkwọ Ndị Amụma na Abụ Ọma” nwere ike ịbụ aha ngalaba ndị bụ isi nke Akwụkwọ Nsọ Izrel. “Abụ Ọma” nwere ike ịpụta akwụkwọ Abụ Ọma kpọmkwem, ma ọ bụ nọchite anya ngalaba sara mbara nke Akwụkwọ Ndị E Dere.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “nke metụtara m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: Mgbe ahụ, ọ sịrị ha
  rationale: δέ bụ njikọ dị nro na-aga n’ihu n’akụkọ; “Mgbe ahụ” na-enye Igbo dị eke, ebe “ọ sịrị ha” na-egosipụta okwu e duziri ndị ahụ.
- source_word: Οὗτοι οἱ λόγοι μου
  choice: Ihe ndị a bụ okwu m
  rationale: Nke a na-edobe ngosipụta Οὗτοι na λόγοι dị ka “okwu,” n’ụzọ doro anya ma bụrụ Igbo a na-asụ ugbu a.
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: m gwara unu
  rationale: N’Igbo, “ịgwa mmadụ okwu” ma ọ bụ naanị “ịgwa mmadụ” bụ ụzọ eke isi kwuo λαλέω πρὸς; ebe a “m gwara unu” na-ezere nkwughachi “okwu” ma na-edobe ihe ọ pụtara.
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: mgbe m ka nọnyere unu
  rationale: “mgbe” na-egosipụta ọrụ oge nke participle ahụ, “ka” na-anọchi ἔτι, “nọnyere unu” pedigide σύν.
- source_word: ὅτι δεῖ πληρωθῆναι
  choice: na ... ga-emezurịrị
  rationale: “ga-emezurịrị” na-ejikọta mmezu na mkpa siri ike nke δεῖ, na-enweghị ịkọwa usoro nke mmezu ahụ karịa ihe amaokwu kwuru.
- source_word: πάντα τὰ γεγραμμένα
  choice: ihe niile e dere
  rationale: Ọ na-edobe ike zuru ụwa ọnụ nke πάντα ma sụgharịa participle passive dị ka Igbo dị mfe ma doo anya.
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: n’Iwu Mosis na n’Akwụkwọ Ndị Amụma na n’Abụ Ọma
  rationale: E ji aha ndị a dịka ngalaba Akwụkwọ Nsọ. Ịsị “Akwụkwọ Ndị Amụma” na-eme ka nghọta doo onye Igbo anya, ebe “Abụ Ọma” bụ aha a maara nke ọma maka Psalms.
- source_word: περὶ ἐμοῦ
  choice: banyere m
  rationale: Nke a bụ ụzọ Igbo dị ugbu a ma zie ezi isi gosipụta περί na genitive, na-ahapụkwa “nke metụtara m” dịka ụzọ ọzọ.
theological_decisions:
- issue: Ike nke δεῖ na mkpa mmezu Akwụkwọ Nsọ
  choice: ga-emezurịrị
  alternative: aghaghị imezu; kwesị imezu
  rationale: Nhọrọ a na-edobe mkpa siri ike, nke a na-aghọta dịka mkpa sitere n’atụmatụ Chineke, ma ọ naghị etinye nkọwa ọzọ banyere otú amụma si emezu.
- issue: Ihe “Iwu Mosis na Ndị Amụma na Abụ Ọma” na-ezo aka na ya
  choice: Aha ngalaba Akwụkwọ Nsọ ka edobere n’ahịrị isi, tinyekwa nkọwa nke ohere abụọ n’ala ala peeji.
  alternative: Ịkọwa “Abụ Ọma” ozugbo dịka Akwụkwọ Ndị E Dere
  rationale: Okwu Grik nwere ike igosi ngalaba atọ nke Akwụkwọ Nsọ Izrel, ma ψαλμοῖς nwekwara ike ịbụ naanị akwụkwọ Abụ Ọma. Nkọwa ala ala peeji na-edobe ihe abụọ ahụ n’emeghị ka otu bụrụ nke doro anya karịa ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara ụda naanị ebe ọdịiche mkpụrụokwu chọrọ ya. A haziri akara ala ala peeji ka onye na-agụ ya hụ [a] n’akụkụ “ihe niile e dere,” [c] n’akụkụ “banyere m,” na [b] mgbe aha ngalaba Akwụkwọ Nsọ gasịrị.
