  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: ig
  text: Mgbe ụjọ tụrụ ha, ha hulatara ihu ha n’ala; ha wee sị ha, “Gịnị mere unu ji achọ Onye ahụ dị ndụ n’etiti ndị nwụrụ anwụ?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị, “Gịnị ka unu na-achọ Onye ahụ dị ndụ so ndị nwụrụ anwụ?” N’ebe a, ajụjụ ahụ pụtara, “Gịnị mere unu ji achọ Onye ahụ dị ndụ n’etiti ndị nwụrụ anwụ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: Mgbe ụjọ jidere ha
  rationale: Nke a na-egosipụta ọnọdụ ụjọ siri ike nke malitere tupu okwu bụ isi, n’Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: ha hulatara ihu ha n’ala
  rationale: Ọ na-echekwa ihe omume ahụ a pụrụ ịhụ anya—ịhulata ihu ruo n’ala—ma na-ada nke ọma n’Igbo.
- source_word: εἶπαν πρὸς αὐτάς
  choice: Ndị ikom ahụ wee sị ha
  rationale: Ọ bụ ezie na Grik ji nnọchiaha mee isiokwu, amaokwu bu ụzọ na-egosi na ndị na-ekwu okwu bụ ndị ikom abụọ; ịkpọpụta ya na-ewepụ mgbagwoju anya nke nnọchiaha ọtụtụ n’Igbo n’ebughị nkọwa ozizi ọzọ bata.
- source_word: Τί ζητεῖτε
  choice: Gịnị mere unu ji achọ
  rationale: τί pụtara n'ụzọ nkịtị ‘gịnị,’ ma n’ajụjụ a ọ na-ajụ ihe kpatara ọchụchọ ahụ; ụdị a bụ Igbo eke ma na-echekwa ebumnuche ajụjụ ahụ.
- source_word: τὸν ζῶντα
  choice: Onye ahụ dị ndụ
  rationale: Ọ na-echekwa ụdị onye otu nke participle ahụ ma gosipụta ọdịiche ya na ndị nwụrụ anwụ n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: μετὰ τῶν νεκρῶν
  choice: n’etiti ndị nwụrụ anwụ
  rationale: μετά na genitive nwere ike ịbụ ‘na/so’ ma ọ bụ ‘n’etiti’; n’ọnọdụ a, ‘n’etiti’ bụ okwu Igbo kacha doo anya ma kwekọọ na ihe a na-ekwu.
theological_decisions:
- issue: Ihe mbilite n’ọnwụ τὸν ζῶντα na-egosi
  choice: Onye ahụ dị ndụ
  alternative: Onye dị ndụ
  rationale: Nhọrọ ahụ na-egosi Jizọs dịka onye dị ndụ n’ọdịiche na ndị nwụrụ anwụ, ma ọ naghị etinye nkọwa doro anya karịa ihe Grik kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara usoro participle ahụ gaa n’ahịrịokwu abụọ maka ịdị eke n’Igbo; ‘wee’ na-egosi na okwu ndị ikom ahụ sochiri mmeghachi omume ụmụ nwanyị ahụ.
