revisions:
- from: Mgbe ụjọ jidere ha, ha hulatara ihu ha n’ala. Ndị ikom ahụ wee sị ha, “Gịnị mere unu ji achọ Onye ahụ dị ndụ n’etiti ndị nwụrụ anwụ?[a]”
  to: Mgbe ụjọ tụrụ ha, ha hulatara ihu ha n’ala; ha wee sị ha, “Gịnị mere unu ji achọ Onye ahụ dị ndụ n’etiti ndị nwụrụ anwụ?[a]”
  rationale: The revision uses a more idiomatic expression for fear, retains the source pronoun for the speakers rather than naming them, and repairs the footnote so that it represents the literal ‘what’ wording of τί without treating ‘ji’ (‘by means of’) as part of the Greek expression. The main translation continues to give the contextually natural ‘why’ sense.
  reviewer_model: gpt-5.6-terra
