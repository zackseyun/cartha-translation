review_pass:
  verdict: revise
  source_fidelity: 'The principal rendering accurately conveys fear, the lowering of the women’s faces to the ground, the question’s idiomatic force (‘Why?’), the singular personal sense of τὸν ζῶντα, and the contrast with the dead. However, the main text explicitly supplies ‘Ndị ikom ahụ’ (‘those men’) where this verse has only the pronoun ‘they.’ Though the antecedent is clear from the preceding context, retaining the pronoun better reflects the source wording. The footnote’s proposed literal alternative is not a sound Igbo rendering of τί ζητεῖτε: ‘Gịnị ka unu ji achọ’ means roughly ‘What are you using to seek?’ rather than ‘What are you seeking?’'
  naturalness: ‘Mgbe ụjọ tụrụ ha’ is a more usual modern Standard Igbo expression for becoming afraid. ‘Hulatara ihu ha n’ala’ is clear and natural in this narrative register. The question ‘Gịnị mere unu ji achọ ... n’etiti ndị nwụrụ anwụ?’ is idiomatic and accurately communicates the contextual force of the Greek.
  terminology: ‘Onye ahụ dị ndụ’ appropriately maintains the singular, personal substantival participle without adding doctrinal explanation. ‘N’etiti ndị nwụrụ anwụ’ naturally conveys the contextual sense of μετὰ τῶν νεκρῶν. No theological terminology requires alteration.
  issues:
  - severity: low
    issue: The main text expands the Greek pronoun εἶπαν (‘they said’) to ‘Ndị ikom ahụ’ (‘those men’).
    rationale: The preceding context identifies the speakers, but the verse itself uses a pronoun. Keeping ‘ha wee sị ha’ preserves the source’s level of explicitness and avoids an unnecessary contextual expansion.
  - severity: medium
    issue: The footnote’s alleged literal rendering uses ‘Gịnị ka unu ji achọ,’ which does not express the Greek wording correctly in Igbo.
    rationale: In Standard Igbo, ‘ji’ means ‘use/by means of’ in this construction. The note should instead identify the literal ‘what’ force of τί and state that the context gives the question a ‘why’ sense.
  revised_text: Mgbe ụjọ tụrụ ha, ha hulatara ihu ha n’ala; ha wee sị ha, “Gịnị mere unu ji achọ Onye ahụ dị ndụ n’etiti ndị nwụrụ anwụ?[a]”
  revised_footnotes:
