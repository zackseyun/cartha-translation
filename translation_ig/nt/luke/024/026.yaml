id: LUK.24.26
reference: Luke 24:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχὶ ταῦτα ἔδει παθεῖν τὸν χριστὸν καὶ εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: ig
  text: Ọ̀ bụ na ọ dịghị mkpa ka Mesaịa ahụ taa ahụhụ ihe ndị a ma banye n’ebube ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Kraịst ahụ.” N’ebe a, a sụgharịrị utu aha Grik Χριστός dịka “Mesaịa” iji chekwaa ihe ọ pụtara n’ọnọdụ a nke mmezu Akwụkwọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ
  choice: Ọ̀ bụ na ọ dịghị
  rationale: Nke a na-egosipụta ajụjụ na-atụ anya azịza nkwenye, ma na-ada nke ọma n’Igbo.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-arụtụ aka n’ahụhụ ndị a ka na-ekwu maka ha, ma na-edobe ike nke okwu nrụtụ aka ahụ.
- source_word: ἔδει
  choice: mkpa
  rationale: Nkebiokwu “ọ dịghị mkpa ka” na-egosipụta na ihe ahụ dị mkpa dịka atụmatụ Chineke na mmezu Akwụkwọ Nsọ si dị, n’etinyeghị nkọwa karịrị ihe Grik kwuru.
- source_word: παθεῖν
  choice: taa ahụhụ
  rationale: Nke a bụ ụzọ doro anya, bụrụkwa nke a na-asụkarị n’Igbo maka ịnagide ahụhụ.
- source_word: τὸν χριστὸν
  choice: Mesaịa ahụ
  rationale: Χριστός bụ utu aha pụtara Onye E Tere Mmanụ; “Mesaịa” na-edobe ihe ọ pụtara n’ọnọdụ a nke mmezu Akwụkwọ Nsọ.
- source_word: καὶ
  choice: ma
  rationale: Ọ na-ejikọta omume abụọ ahụ n’enweghị ịgbakwunye echiche “mgbe ahụ,” nke adịghị kpọmkwem n’ihe Grik kwuru.
- source_word: εἰσελθεῖν εἰς τὴν δόξαν αὐτοῦ
  choice: banye n’ebube ya
  rationale: Nke a na-edobe echiche nke ịbanye n’ọnọdụ ma ọ bụ n’ókè ebube ahụ, tinyere nnọchiaha nke na-egosi na ebube ahụ bụ nke ya.
- source_word: δόξαν
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo kwesịrị ekwesị maka δόξα n’ọnọdụ mbilite n’ọnwụ na ibuli elu a.
- source_word: αὐτοῦ
  choice: ya
  rationale: A sụgharịrị nnọchiaha ahụ ozugbo, n’agbasaghị ya site na nkọwa ọzọ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ bụ utu aha nke jikọrọ ya na nkwa na mmezu Akwụkwọ Nsọ; “Mesaịa” na-eme ka ihe utu aha ahụ pụtara pụta ìhè.
- issue: Ike ἔδει nwere
  choice: ọ dịghị mkpa ka
  alternative: ọ̀ bụghị na ... aghaghị
  rationale: Nhọrọ a na-egosipụta ịdị mkpa sitere n’atụmatụ Chineke na mmezu Akwụkwọ Nsọ, ma ọ naghị akọwa ya dị ka naanị mmanye ma ọ bụ ihe a na-apụghị izere ezere.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke nwere ugwu ma dị mfe nghọta. Ajụjụ ahụ ka bụ ajụjụ nkwughachi na-atụ anya nkwenye; e chekwara njikọ dị n’etiti ahụhụ Mesaịa na ịbanye n’ebube ya n’enweghị ịgbakwunye usoro oge nke okwu Grik na-ekwughị.
