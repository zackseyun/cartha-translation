  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: ig
  text: Ha sịrị ibe ha, “Ọ̀ bụghị na obi anyị[a] nọ na-ere ọkụ n’ime anyị mgbe ọ na-agwa anyị okwu n’ụzọ[b], mgbe ọ na-emegheere anyị Akwụkwọ Nsọ[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ji ‘obi’ n’otu ọnụọgụ; n’asụsụ ụfọdụ, a pụrụ ịsụgharị ya dịka ‘obi anyị’ n’ọtụtụ ọnụọgụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘mgbe anyị na-aga n’ụzọ.’
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, ‘imegheere anyị Akwụkwọ Nsọ,’ ya bụ, ime ka ihe ọ pụtara doo ha anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: sị ibe ha
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ dị mfe na ha gwara ibe ha okwu.
- source_word: Οὐχὶ
  choice: ọ̀ naghị
  rationale: Ọ na-ebute ajụjụ a na-atụ anya na azịza ya ga-abụ ee, ma na-edobe ike ajụjụ ahụ.
- source_word: ἡ καρδία ἡμῶν
  choice: obi anyị
  rationale: Nke Grik ji ‘obi’ n’otu ọnụọgụ; ‘obi anyị’ bụkwa okwu Igbo dị mma nke nwere ike igosi ahụmahụ ha abụọ nwere.
- source_word: καιομένη
  choice: ere ọkụ
  rationale: Ọ na-edobe ihe atụ nke ọkụ n’obi, n’enweghị ịkọwa ya nanị dị ka mkpali mmụọ, nghọta, ma ọ bụ mmetụta obi.
- source_word: ἐν ἡμῖν
  choice: n’ime anyị
  rationale: Ọ na-egosi na ihe a mere n’ime ha ma na-esochi okwu Grik nke ọma.
- source_word: ἐλάλει
  choice: ọ nọ na-agwa anyị okwu
  rationale: Ụdị a na-egosi omume gara n’ihu ruo oge ụfọdụ, dịka imperfect Grik si eme.
- source_word: ἐν τῇ ὁδῷ
  choice: n’ụzọ
  rationale: Ọ bụ okwu Igbo eke maka ‘n’ụzọ/on the road’ n’akụkọ njem a.
- source_word: διήνοιγεν
  choice: ọ nọ na-emeghe
  rationale: Ọ na-edobe ihe atụ Grik nke ‘imeghe’ ma na-egosikwa omume na-aga n’ihu.
- source_word: τὰς γραφάς
  choice: Akwụkwọ Nsọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ihe odide nsọ ndị a na-ekwu maka ha.
theological_decisions:
- issue: Ihe atụ nke obi na-ere ọkụ
  choice: Edobere ‘obi anyị ... ere ọkụ n’ime anyị.’
  alternative: ‘Obi anyị jupụtara n’ọṅụ’ ma ọ bụ ‘anyị ghọtara nke ọma.’
  rationale: Amaokwu ahụ ekwughị kpọmkwem ma ọkụ ahụ ọ bụ mmetụta, nghọta, ma ọ bụ ọrụ ime mmụọ; idebe ihe atụ ahụ na-echekwa nghọtahie ziri ezi na ịdị omimi nke okwu ahụ.
- issue: Ihe atụ nke imeghe Akwụkwọ Nsọ
  choice: Edobere ‘na-emeghe Akwụkwọ Nsọ nye anyị.’
  alternative: ‘na-akọwara anyị ihe Akwụkwọ Nsọ pụtara.’
  rationale: Nke ọzọ na-eme ka ihe ọ pụtara doo anya, ma ọ ga-ewepụ ihe atụ nke okwu Grik; ihe odide bụ isi debere ihe atụ ahụ, ebe nkọwa ala peeji na-akọwa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E debere ajụjụ nzaghachi, omume ndị na-aga n’ihu, na ihe atụ abụọ dị n’asụsụ Grik.
