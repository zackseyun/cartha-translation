review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the earnest request, the invitation to remain, and Jesus’ entering to stay with them. However, “chi na-aga ijide” is less precise and can evoke nightfall rather than the approach of evening, while the paired “ehihie agbadawokwa” makes the temporal expression somewhat awkward. A clearer rendering should retain the two linked Greek ideas: evening is near and the day has already declined.'
  naturalness: “Nọnyere anyị” and “ha rịọsiri ya ike” are natural Standard Igbo. “Mgbede na-eru nso” is more idiomatic and immediately clear in this context than “chi na-aga ijide.” “Ụbọchị agbadaworị” retains the declining-day image in concise, natural narrative Igbo.
  terminology: No theological terminology or proper names occur. The revised wording preserves the hospitality and temporal-register sense without introducing interpretive material.
  issues:
  - severity: medium
    issue: The expression “chi na-aga ijide” is not the clearest equivalent for πρὸς ἑσπέραν ἐστίν.
    rationale: It may be understood as night approaching or falling, whereas the Greek specifically says that it is toward evening. “Mgbede na-eru nso” is direct, idiomatic, and preserves the approach nuance.
  - severity: low
    issue: The temporal wording is stylistically uneven, and footnote b is anchored after the closing quotation rather than at the phrase it explains.
    rationale: Using “ụbọchị agbadaworị” gives a smoother equivalent for κέκλικεν ἤδη ἡ ἡμέρα. Placing the note marker directly after that phrase makes its scope clear.
