  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: ig
  text: 'Ma ha rịọsiri ya ike[a], sị: “Nọnyere anyị, n’ihi na mgbede na-eru nso, ụbọchị agbadaworị.”[b] O wee banye ka ya na ha nọrọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha siri ọnwụ na-arịọ ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụbọchị agwụla nnọọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: ha rịọsiri ya ike
  rationale: Okwu a n’ụdị middle na-egosi arịrịọ siri ike na nnọgidesi ike, ọ bụghị ịmanye ya n’ike anụ ahụ.
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: Nọnyere anyị
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dị ndụ e si arịọ mmadụ ka ọ ghara ịla, kama ka ya na ndị ahụ nọrọ.
- source_word: ὅτι πρὸς ἑσπέραν ἐστὶν
  choice: n’ihi na chi na-aga ijide
  rationale: Akpaalaokwu Igbo a na-egosi na mgbede na-eru nso, na-echekwa echiche nke πρὸς ἑσπέραν karịa ikwu na chi ejidela.
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: ehihie agbadawokwa
  rationale: Nke a na-echekwa onyinyo nke ụbọchị na-agbada ma na-egosi site na perfect ahụ na ọ malitelarị ịgwụ.
- source_word: εἰσῆλθεν
  choice: O wee banye
  rationale: Ọ bụ okwu akụkọ Igbo sitere n’okike nke na-anọchi anya ịbanye n’ụlọ ma na-edobe njikọ καὶ.
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: ka ya na ha nọrọ
  rationale: “Ka” na-egosi nzube nke ịbanye ya, ebe “ya na ha nọrọ” na-echekwa echiche nke ịnọkọ ọnụ.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “chi na-aga ijide” mee ka okwu gbasara mgbede na-eru nso bụrụ nke sitere n’okike n’Igbo; e jikwa “ehihie agbadawokwa” chekwaa ihe atụ nke ụbọchị na-agbada.
