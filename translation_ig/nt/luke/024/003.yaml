  edition: SBLGNT
  text: ⸂εἰσελθοῦσαι δὲ⸃ οὐχ εὗρον τὸ ⸀σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/003.yaml
  text: But when they entered[a], they did not find the body.
translation:
  language: ig
  text: Ma mgbe ha banyere, ha ahụghị ozu ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka na-agụ, “ozu Onyenwe anyị Jizọs.”
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: mgbe ha banyere n’ime ya
  rationale: Aorist participle nke dị n'ụdị nwanyị ọtụtụ na-ezo aka n'ụmụ nwanyị ahụ. A sụgharịrị ya dị ka nkebiokwu oge n'Igbo dị mfe; “n’ime ya” na-eme ka o doo anya na ha banyere n’ili ahụ dịka ihe gbara amaokwu a gburugburu si gosi.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-akwalite akụkọ ahụ n'ihu ma na-egosikwa ntakịrị ihe megidere ihe a tụrụ anya ya; “Ma” dabara n'ọnọdụ a.
- source_word: οὐχ εὗρον
  choice: ha ahụghị
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi si kwuo ngwaa aorist e jụrụ ajụ nke pụtara na ha achọtaghị ihe ahụ.
- source_word: τὸ σῶμα
  choice: ozu ahụ
  rationale: N'ọnọdụ olili, “ozu” bụ okwu Igbo ebumpụta ụwa maka ahụ onye nwụrụ anwụ. Ọ naghị agbakwunye onye nwe ozu ahụ, nke ederede Greek a na-ekwughị kpọmkwem.
theological_decisions:
- issue: Ma a ga-akọwapụta onye nwe ozu ahụ
  choice: ozu ahụ
  alternative: ozu Onyenwe anyị Jizọs
  rationale: Ederede SBLGNT e nyere nwere naanị τὸ σῶμα, “ozu ahụ.” Ya mere, isi ederede anaghị etinye nkọwa dị ogologo nke ụfọdụ akwụkwọ aka nwere; a debere ya n'ala ala peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E ji “ozu” mee ka ọnọdụ ili doo anya n'ụzọ ndị na-agụ Igbo ga-aghọta ozugbo; e ji akara nkọwa [a] tinye n'isi ederede.
