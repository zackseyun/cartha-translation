review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the temporal participle, the negated finding, and the unexpanded referent “the body.” However, “n’ime ya” (“into it/inside it”) supplies an object not expressed in the Greek; the tomb is recoverable from context but should not be inserted into this compact verse. The textual-variant footnote belongs with “ozu ahụ,” the term affected by the variant, rather than with the verb of entering.
  naturalness: “Ma mgbe ha banyere, ha ahụghị ozu ahụ” is natural, clear Standard Igbo narrative prose. “Ozu” is an appropriate contextual rendering of σώμα in this burial account.
  terminology: “Ozu ahụ” appropriately conveys the deceased body in context without adding the longer manuscript reading to the main text. The footnote retains “Onyenwe anyị Jizọs” only as a textual variant.
  issues:
  - severity: medium
    issue: The phrase “n’ime ya” adds an unexpressed object to the Greek participle.
    rationale: εἰσελθοῦσαι means “having entered/when they entered” without specifying “into it.” Although the tomb is explicit in the preceding context, the supplied object is unnecessary and exceeds the wording of this verse.
  - severity: low
    issue: Footnote anchor is attached to “ya” rather than to the body phrase.
    rationale: The variant expands τὸ σῶμα, not the location or action of entering. Moving the marker to “ozu ahụ” makes the anchor semantically accurate.
  revised_text: Ma mgbe ha banyere, ha ahụghị ozu ahụ[a].
