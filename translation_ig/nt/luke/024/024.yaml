review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the movement to the tomb, the correspondence with the women’s report, and the contrast that the visitors did not see Jesus. However, “ndị ha na anyị nọ” reverses the required reciprocal construction and is not a sound rendering of “those with us.”
  naturalness: The verse is otherwise clear, contemporary Standard Igbo, and appropriately restrained in register. Changing the companion phrase to “ndị anyị na ha nọ” makes it grammatical and natural.
  terminology: “Ili,” “ndị inyom,” and the pronoun “ya” are suitable. The revision retains “hụ ... na ọ dị” as an idiomatic way to express finding the tomb’s condition as reported, without adding details from other accounts.
  issues:
  - severity: medium
    issue: The phrase “ndị ha na anyị nọ” is structurally reversed.
    rationale: For “some of those with us,” Standard Igbo requires “ndị anyị na ha nọ” (“those with whom we were”). The draft wording does not naturally identify the speaker’s companions and can be read incorrectly.
  revised_text: Ụfọdụ n’ime ndị anyị na ha nọ gara n’ili ahụ, hụkwa na ọ dị nnọọ ka ndị inyom ahụ kwuru; ma ha ahụghị ya.
  revised_footnotes: []
  revision_rationale: 'Only the reciprocal companion expression is corrected. The remainder faithfully preserves the Greek narrative: some companions went to the tomb, found its condition as the women reported, but did not see him.'
