  to: Ụfọdụ n’ime ndị anyị na ha nọ gara n’ili ahụ, hụkwa na ọ dị nnọọ ka ndị inyom ahụ kwuru; ma ha ahụghị ya.
  rationale: 'Only the reciprocal companion expression is corrected. The remainder faithfully preserves the Greek narrative: some companions went to the tomb, found its condition as the women reported, but did not see him.'
