  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: ig
  text: Ụfọdụ n’ime ndị anyị na ha nọ gara n’ili ahụ, hụkwa na ọ dị nnọọ ka ndị inyom ahụ kwuru; ma ha ahụghị ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: gara
  rationale: Ngwaa a na-akọ njem ha gara n’ebe ili ahụ dị. “Gara” bụ okwu Igbo dị mfe ma kwekọọ n’akụkọ a, n’etinyeghị uche pụrụ iche n’ịhapụ ebe ha nọ.
- source_word: τινες τῶν σὺν ἡμῖν
  choice: Ụfọdụ n’ime ndị ha na anyị nọ
  rationale: Nke a na-egosi ụfọdụ ndị so n’ìgwè ndị nọnyere ndị na-ekwu okwu. Ọ na-edobe ọdịdị na mpụtara okwu Grik n’Igbo a na-aghọta nke ọma.
- source_word: ἐπὶ τὸ μνημεῖον
  choice: n’ili ahụ
  rationale: N’akụkọ a, μνημεῖον bụ ebe e liri Jizọs. “Ili ahụ” bụ okwu Igbo nkịtị na nke doro anya maka ebe ahụ.
- source_word: εὗρον
  choice: hụkwa na
  rationale: Ọ bụ ezie na εὗρον pụtara “chọtara” ma ọ bụ “hụrụ,” n’usoro okwu Igbo a, “hụkwa na ọ dị” na-ekwupụta nke ọma na ha chọpụtara ọnọdụ ili ahụ otú e si kọọrọ ha.
- source_word: οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: ọ dị nnọọ ka ndị inyom ahụ kwuru
  rationale: “Nnọọ ka” na-egosi nkwekọrịta zuru oke n’etiti ihe ha hụrụ na ihe ndị inyom kwuru. Akụkụ καί anaghị achọ ka a sụgharịa ya iche ebe a, n’ihi na njikọ “hụkwa” na ntụnyere ahụ emeela ka usoro ahụ doo anya n’Igbo.
- source_word: αὐτὸν
  choice: ya
  rationale: Aha nnọchi a na-ezo aka na Jizọs. Idebe “ya” na-asọpụrụ njikọ okwu Grik ma ghara ịgbakwụnye aha na-adịghị na amaokwu ahụ.
- source_word: δὲ
  choice: ma
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ịhụ na ọnọdụ ili ahụ dị ka ndị inyom kwuru na enweghị ịhụ Jizọs n’onwe ya.
- source_word: οὐκ εἶδον
  choice: ha ahụghị
  rationale: Ngwaa ahụ bụ “ịhụ,” ọ bụghị “ịchọta.” Nsụgharị a na-edobe mpụtara ya kpọmkwem na isiokwu ya bụ otu ìgwè ahụ gara n’ili.
theological_decisions:
- issue: Okwu akụkọ mbilite n’ọnwụ
  choice: Amaokwu ahụ na-ekwu na ndị gara n’ili ahụ hụrụ ọnọdụ ya dị ka ndị inyom kwuru, ma ha ahụghị Jizọs n’onwe ya.
  alternative: Ịkọwa ihe kpọmkwem ha hụrụ n’ili ma ọ bụ ime ka akụkọ a kwekọọ n’ụzọ doro anya na akụkọ ndị ọzọ.
  rationale: Nsụgharị ahụ na-edobe ọdịiche nke Grik n’etiti nkwenye banyere ọnọdụ ili ahụ na enweghị ịhụ Jizọs, n’ebughị nkọwa sitere n’akụkọ ndị ọzọ bata.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, sụgharịa ya. “Ndị inyom” bụ okwu kwesịrị ekwesị n’akwụkwọ nsọ; “ili ahụ” na “gara” bụ okwu nkịtị ndị na-agụ akwụkwọ n’ozuzu ga-aghọta.
