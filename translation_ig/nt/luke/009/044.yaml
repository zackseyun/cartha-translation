id: LUK.9.44
reference: Luke 9:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: ig
  text: “Unu onwe unu, tinyenụ okwu ndị a na ntị unu, n’ihi na a na-aga inyefe[a] Nwa nke Mmadụ n’aka ndị mmadụ.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịrara nye.” Okwu Grik ahụ nwere ike ịpụta “inyefe,” “itinye n’aka,” ma ọ bụ, n’ọnọdụ ụfọdụ, “ịrara nye.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ndị mmadụ” nwere ọdịdị oke nwoke n’ụtọ asụsụ, ma ọ pụkwara ịpụta ụmụ mmadụ n’ozuzu ha n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: Unu onwe unu, tinyenụ ... na ntị unu
  rationale: “Tinyenụ ... na ntị unu” na-edobe ihe atụ doro anya nke Grik banyere itinye okwu na ntị, ya bụ ịnụrụ ya nke ọma ma jidesie ya ike. “Unu onwe unu” na-egosipụta nkwusi ike dị na nnọchiaha ὑμεῖς.
- source_word: τοὺς λόγους τούτους
  choice: okwu ndị a
  rationale: Nke a na-ezo aka kpọmkwem n’ihe Jizọs na-achọ ikwu; “okwu ndị a” bụ nsụgharị dị mfe ma kwụ ọtọ.
- source_word: ὁ γὰρ
  choice: n’ihi na
  rationale: γάρ na-enye ihe kpatara iwu ahụ e nyere ha ka ha gee ntị nke ọma.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Aha a na-edobe usoro okwu na nghọta sara mbara nke aha Jizọs ji akpọ onwe ya, tinyere njikọ ya na Daniel 7.
- source_word: μέλλει
  choice: a na-aga
  rationale: N’ebe a μέλλω na-egosi ihe na-abịaru nso ime; usoro a na-egosipụta nke ahụ n’Igbo n’etinyeghị echiche siri ike banyere akara aka.
- source_word: παραδίδοσθαι
  choice: inyefe
  rationale: “Inyefe” na-edobe echiche sara mbara nke itinye mmadụ n’aka ma ọ bụ n’ike ndị ọzọ, n’emeghị ka okwu ahụ bụrụ naanị nrara Judas nye Jizọs.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: n’aka ndị mmadụ
  rationale: Nke a na-edobe akpaalaokwu banyere ịbanye n’aka ma ọ bụ n’ike ndị ọzọ. “Ndị mmadụ” bụ ụzọ ebumpụta ụwa e si sụgharịa ἀνθρώπων n’Igbo ebe a.
theological_decisions:
- issue: Nsụgharị aha ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: “Nwa nke Mmadụ” na-edobe aha ọdịnala ahụ, nghọta ya na-adịghị warara, na njikọ ya na Daniel 7 n’enweghị nkọwa agbakwunyere.
- issue: Ogologo nghọta nke παραδίδοσθαι
  choice: inyefe
  alternative: ịrara nye
  rationale: “Inyefe” nwere ike ịgụnye nrara nye, ma ọ naghị eme ka amụma ahụ bụrụ naanị ihe Judas mere; ọ na-edobe echiche nke inyefe Jizọs n’ike mmadụ.
- issue: Nghọta nke ἀνθρώπων
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: Ọ bụ ezie na ọdịdị okwu Grik ahụ bụ nke oke nwoke n’ụtọ asụsụ, ἄνθρωπος nwere ike ịpụta mmadụ n’ozuzu ya. N’Igbo, “ndị mmadụ” na-edobe nghọta sara mbara na ọdịiche dị n’etiti Nwa nke Mmadụ na ndị ga-anata ya n’aka ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ ihe atụ “tinye ... na ntị” ka ike okwu Jizọs ghara ịla n’iyi, ebe usoro “a na-aga inyefe” na-egosipụta ma ịdị nso nke ihe ahụ ma passive nke isi mmalite ahụ n’ụzọ Igbo na-anabata.
