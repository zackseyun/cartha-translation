id: LUK.9.48
reference: Luke 9:48
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: ig
  text: Ọ sịrị ha, “Onye ọ bụla nabatara[a] nwata a n’aha m[b] nabatara m; onye ọ bụla nabatara m nabatara onye zitere m. N’ihi na onye kasị nta n’etiti unu niile—onye a bụ onye ukwu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ‘nabatara’ dịka ‘kpọbatara’ ma ọ bụ ‘nakweere’ n’ebe niile okwu a pụtara n’amaokwu a; ngwaa Grik ahụ pụrụ igosi ịnabata ma ọ bụ ịkpọbata mmadụ.
    reason: lexical_alternative
  - marker: b
    text: ‘N’aha m’ nwekwara ike ịpụta ‘na ndabere nke aha m’ ma ọ bụ ‘n’ihi aha m’; ọ na-egosi nnabata e mere n’ihe metụtara ikike Jizọs na ikwesị ntụkwasị obi nye ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: nabatara
  rationale: ‘Ịnabata’ nwere ike ịpụta ịnabata mmadụ nke ọma, ịkpọbata ya, ma ọ bụ ịnakwere ya. Ikwughachi otu ngwaa ahụ na-echekwa njikọ e ji otu okwu ahụ mee ugboro atọ n’asụsụ Grik.
- source_word: παιδίον
  choice: nwata
  rationale: ‘Nwata’ bụ okwu Igbo doro anya ma kwekọọ n’echiche bụ isi nke παιδίον, n’agbanyeghị na ọnọdụ amaokwu ahụ pụrụ igosi na ọ bụ obere nwa.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: n’aha m
  rationale: Nkebiokwu a na-echekwa njikọ dị n’etiti nnabata ahụ na aha, ikike, na nnọchiteanya Jizọs, n’akọwaghị ya n’otu ụzọ naanị.
- source_word: τὸν ἀποστείλαντά με
  choice: onye zitere m
  rationale: Nke a na-asụgharị participle ahụ dịka onye a na-ekwu maka ya, ma ọ naghị etinye ‘Nna’ ma ọ bụ ‘Chineke’ n’ebe ederede Grik na-akpọghị aha ahụ kpọmkwem.
- source_word: μικρότερος
  choice: onye dịkarịsịrị nta
  rationale: Nhọrọ a na-egosi onye a na-ewere dị ala ma ọ bụ dị nta n’etiti ndị ọzọ, na-enweghị ime ka okwu ahụ bụrụ naanị banyere afọ ndụ ma ọ bụ ịdị nta n’ahụ.
- source_word: ἐν πᾶσιν ὑμῖν
  choice: n’etiti unu niile
  rationale: Nke a na-egosi ọnọdụ onye ahụ n’ime ìgwè ndị a na-agwa okwu n’ụzọ Igbo dị mfe nghọta.
- source_word: οὗτός ἐστιν μέγας
  choice: onye a bụ onye ukwu
  rationale: ‘Onye a’ na-echekwa nkwusi ike nke οὗτος, ebe ‘onye ukwu’ na-egosi ịdị ukwuu n’ọnọdụ ma ọ bụ uru, ọ bụghị naanị ibu anụ ahụ.
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: Onye ọ bụla ... onye ọ bụla
  rationale: Usoro a na-egosipụta ọnọdụ zuru ụwa ọnụ nke relative clause na ἄν n’Igbo nkịtị.
- source_word: καὶ εἶπεν αὐτοῖς
  choice: Ọ sịrị ha
  rationale: Nke a bụ mmalite akụkọ dị nkenke ma dị eke n’Igbo; a hapụrụ njikọ καί ka usoro okwu Igbo ghara ịdị arọ.
theological_decisions:
- issue: Onye ‘onye zitere m’ na-ezo aka na ya
  choice: E chekwara ntụaka zoro ezo nke na-ezo aka ná Nna/Chineke, n’akpọghị ya aha karịa ka Grik siri mee.
  alternative: ‘Nna nke zitere m’ ma ọ bụ ‘Chineke onye zitere m.’
  rationale: Ederede Grik ji participle nwere article mee ihe kama ịkpọ Nna aha kpọmkwem; ntụgharị ahụ kwesịrị ichekwa nkwupụta banyere onye zitere Jizọs n’etinyeghị nkọwa ọzọ.
- issue: Ihe ịnabata nwata ‘n’aha m’ pụtara
  choice: E gosipụtara nnabata ahụ dịka nke e mere n’ihe metụtara aha, ikike, ma ọ bụ nnọchiteanya Jizọs.
  alternative: ‘N’ihi na nwata ahụ bụ nke m’ ma ọ bụ ‘n’ihi m.’
  rationale: ‘N’aha m’ na-echekwa obosara nke nkebiokwu Grik ma ghara imechi ya n’otu nkọwa naanị.
- issue: Mgbagwoju anya dị n’etiti ịdị nta na ịdị ukwuu
  choice: 'E chekwara ntụgharị ọnọdụ ahụ: onye dịkarịsịrị nta n’etiti ndị na-eso ụzọ bụ onye ukwu.'
  alternative: ‘Onye kacha bụrụ nwata n’etiti unu niile bụ onye ukwu.’
  rationale: μικρότερος n’ọnọdụ a yikarịrị ka ọ na-ekwu banyere ịdị ala n’ọkwa, ọ bụghị naanị ịbụ onye kacha nta n’afọ; ntụgharị ahụ anaghị eme ka mgbagwoju okwu Jizọs dị nro.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu, mee ihe. A kwughachiri ‘nabatara’ iji chekwaa usoro na njikọ dị n’ederede Grik. Akara ogologo ahụ na-eme ka nkwusi ike nke ‘onye a’ na ntụgharị dị n’etiti ịdị nta na ịdị ukwuu pụta ìhè.
