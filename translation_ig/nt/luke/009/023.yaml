source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: ig
  text: Ọ nọkwa na-agwa mmadụ niile, sị, “Ọ bụrụ na onye ọ bụla[a] chọrọ ịbịa n’azụ m, ka ọ jụ onwe ya, buru obe ya kwa ụbọchị, sorokwa m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e ji “onye ọ bụla” na ụdị okwu nke otu onye n’ozuzu: “ọ bụrụ na onye ọ bụla ... ka ọ ... onwe ya.” N’Igbo, ụdị okwu a nwere ike ịgụnye nwoke ma ọ bụ nwaanyị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: Ọ nọkwa na-agwa
  rationale: Ụdị ngwaa imperfect na-egosi okwu ọ nọ na-ekwu n’oge ahụ ma ọ bụ nke ọ na-ekwughachi; “ọ nọkwa na-agwa” na-echekwa echiche ahụ n’Igbo nkịtị.
- source_word: πρὸς πάντας
  choice: mmadụ niile
  rationale: Nke a na-egosi na okwu ahụ metụtara ndị niile nọ ebe ahụ, ọ bụghị nanị ndị na-eso ụzọ ole na ole.
- source_word: Εἴ τις θέλει
  choice: Ọ bụrụ na onye ọ bụla chọrọ
  rationale: “Onye ọ bụla” na-egosipụta τις dị ka onye a na-akpọghị aha n’otu mkpụrụ okwu; “chọrọ” na-enye θέλει n’asụsụ Igbo dị mfe ma kwekọọ na echiche nke ịdị njikere.
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: ịbịa n’azụ m
  rationale: Nke a na-echekwa ihe atụ gbasara ịbịa n’azụ Jizọs, kama ịtụgharị ya ozugbo ka ọ bụrụ “iso,” ebe ngwaa “iso” pụtara ọzọ n’ọgwụgwụ amaokwu ahụ.
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: ka ọ jụ onwe ya
  rationale: “Ka ọ” na-enye iwu nke onye nke atọ, ebe “jụ onwe ya” na-echekwa ma ngwaa ịjụ ma nnọchiaha nke na-alaghachikwuru onye ahụ.
- source_word: ἀράτω
  choice: buru
  rationale: N’Igbo, “buru obe ya” na-ejikọta echiche ibuli ihe na ibu ya n’ụzọ dabara adaba n’okwu a.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: obe ya
  rationale: “Obe” bụ okwu kpọmkwem maka σταυρός; “ya” na-echekwa ihe nnọchiaha nwe ahụ na-egosi.
- source_word: καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Nke a na-egosipụta nke ọma na ihe ahụ ga na-eme ụbọchị niile n’usoro, bụ́ ihe pụrụ iche Luk kwusiri ike.
- source_word: ἀκολουθείτω μοι
  choice: sorokwa m
  rationale: Nke a na-enye iwu nke ikpeazụ n’ụzọ Igbo dị nkenke ma dị ndụ; “-kwa” jikọtara ya na iwu ndị bu ya ụzọ.
theological_decisions:
- issue: Ihe “obe” pụtara n’okwu gbasara ịbụ onye na-eso ụzọ
  choice: E debere okwu ahụ kpọmkwem dị ka “obe.”
  alternative: ibu ya; ahụhụ ya; ihe ọ ga-achụ n’àjà
  rationale: σταυρός bụ aha ihe a na-akpọ obe. Ọ bụ ezie na o nwere ihe ọ na-anọchi anya n’ebe ịbụ onye na-eso ụzọ nọ, nsụgharị ekwesịghị ịkọwa ya naanị dị ka ahụhụ, ibu arọ, ma ọ bụ àjà.
- issue: Otu mkpụrụ okwu n’ozuzu na ἀρνησάσθω ... ἀράτω ... ἀκολουθείτω
  choice: E ji “onye ọ bụla ... ka ọ ... onwe ya ... ya” chekwaa otu mkpụrụ okwu n’ozuzu.
  alternative: ndị chọrọ ... ka ha jụ onwe ha ... buru obe ha
  rationale: Grik malitere n’otu onye a na-akpọghị aha ma gaa n’ihu n’otu mkpụrụ okwu. Igbo na-echekwa nke a n’ụzọ na-adịghị akọwa onye ahụ dị ka nwoke ma ọ bụ nwaanyị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro iwu atọ na ihe atụ “ịbịa n’azụ m,” ma zere ịkọwa “obe” n’ụzọ ga-emechi nghọta sara mbara nke okwu ahụ.
