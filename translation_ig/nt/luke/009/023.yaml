  naturalness: The verse is fluent Standard Igbo and maintains a suitable dignified biblical register. The progression “ka ọ jụ onwe ya, buru obe ya kwa ụbọchị, sorokwa m” is clear and idiomatic.
  terminology: “Obe” appropriately preserves “cross,” without reducing it to suffering or burden. “Onye ọ bụla” is gender-inclusive in normal Igbo use while preserving the source’s generic singular. The footnote’s present phrase “otu mkpụrụ okwu n’ozuzu” is imprecise and may misleadingly suggest that Greek uses one word rather than singular grammatical forms across the clause.
