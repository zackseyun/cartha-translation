  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: ig
  text: Mgbe ahụ, arụmụka bilitere n’etiti ha banyere onye n’ime ha pụrụ ịbụ onye kasị ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “echiche batara n’ime ha,” ma ọ bụ, “mkparịta ụka bilitere n’etiti ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν
  choice: bilitere
  rationale: Ọ bụ ezie na okwu Grik a pụtara n'ụzọ nkịtị ‘batara,’ ‘bilitere’ bụ ụzọ Igbo si ekwu nke ọma na arụmụka malitere n’etiti mmadụ.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ dị nro nke na-akwalite akụkọ ahụ n’ihu; ‘Mgbe ahụ’ dabara n’asụsụ Igbo a na-agụ nke ọma.
- source_word: διαλογισμὸς
  choice: arụmụka
  rationale: Okwu ahụ pụrụ ịpụta echiche mmadụ na-atụgharị n’obi, mkparịta ụka, ma ọ bụ esemokwu. N’ebe a, ajụjụ asọmpi banyere onye ka ukwuu na-akwado ‘arụmụka,’ ma e debere ihe ndị ọzọ ọ pụrụ ịpụta na ndetu ala peeji.
- source_word: ἐν αὐτοῖς
  choice: n’etiti ha
  rationale: N’agbanyeghị na ọdịdị okwu ya bụ ‘n’ime ha,’ ihe a na-ekwu banyere ìgwè mmadụ na-ada nke ọma n’Igbo dị ka ‘n’etiti ha.’
- source_word: τὸ τίς ἂν εἴη
  choice: banyere onye ... pụrụ ịbụ
  rationale: Nke a na-egosi isiokwu arụmụka ahụ, ebe ‘pụrụ ịbụ’ na-echekwa echiche nke ihe a na-atụ anya ma ọ bụ nke nwere ike ịdị n’ime ἄν na optative.
- source_word: μείζων
  choice: onye kasị ukwuu
  rationale: Ọ bụ comparative n’asụsụ Grik, ya bụ ‘onye ka ukwuu,’ ma n’ajụjụ banyere ọkwa n’ime ìgwè, Igbo na-eji superlative ‘onye kasị ukwuu’ ekwupụta uche ahụ n'ụzọ doro anya.
- source_word: αὐτῶν
  choice: n’ime ha
  rationale: Nke a na-akọwa ìgwè a na-atụnyere ndị nọ na ya; ‘n’ime ha’ bụ okwu Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Ụdị ihe mere n’etiti ndị na-eso ụzọ
  choice: arụmụka
  alternative: echiche ma ọ bụ mkparịta ụka
  rationale: Ajụjụ banyere onye ga-abụ onye kasị ukwuu nwere ọdịdị asọmpi, ya mere ‘arụmụka’ na-egosipụta esemokwu ahụ n’enweghị ime ka ihe odide kwuo karịa ihe Grik kwuru. Ndetu ala peeji na-echekwa nghọta ndị ọzọ okwu ahụ nwere ike inwe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. Ahịrịokwu ahụ na-agbaso usoro akụkọ nkịtị, na ndetu ala peeji na-echekwa ambiguiti nke διαλογισμός na ἐν αὐτοῖς.
