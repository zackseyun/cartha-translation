  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: ig
  text: Ma ha anabataghị ya[a], n’ihi na ihu ya chere Jeruselem ihu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha anabataghị ya nke ọma” ma ọ bụ “ha ejighị ọbịa nabata ya.” Ngwaa ahụ nwere ike ịpụta ịnabata, ịnakwere, ma ọ bụ ile mmadụ ọbịa; n’ebe a, ọ pụrụ igosi na ha jụrụ ile ya ọbịa.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ihu ya na-aga Jeruselem.” Nke a bụ akpaalaokwu na-egosi na ntụziaka ya kpọmkwem bụ Jeruselem, ma ọ pụkwara igosi mkpebi siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: anabataghị
  rationale: Ngwaa Igbo bụ “ịnabata” nwere ike ịpụta ịnabata mmadụ, ịnabata ya nke ọma, ma ọ bụ ikwe ka ọ bata. N’ọnọdụ njem a, ọ na-egosi na ha jụrụ ile ọbịa ma ọ bụ inye ya nnabata.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: ihu ya
  rationale: “Ihu ya” na-edobe ihe oyiyi doro anya nke πρόσωπον ma kwe ka usoro okwu a na-egosi ebe o kpebiri ihu gaa.
- source_word: ἦν πορευόμενον
  choice: chere ụzọ
  rationale: N’ijikọta ya na “ihu ya,” okwu a na-egosi ntụziaka njem na ebumnobi. “Chere ụzọ” bụ Igbo dị mfe ma dịkwa nsọpụrụ nke na-edobe ihe oyiyi ihu tụkwasịrị otu ebe, na-enweghị itinye nkọwa okpukpe ọzọ.
- source_word: εἰς Ἰερουσαλήμ
  choice: Jeruselem
  rationale: Aha a bụ ụdị a na-ejikarị eme ihe n’Igbo; “ụzọ Jeruselem” na-egosi ntụziaka ọ na-aga.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Okwu a na-egosi ihe mere ha ji jụ ịnabata ya; “n’ihi na” bụ njikọ ihe kpatara ihe nke doro anya n’Igbo.
theological_decisions:
- issue: Ike akpaalaokwu dị na “ihu ya ... Jeruselem”
  choice: E debere “ihu ya” ma sụgharịa ntụziaka ya dịka “chere ụzọ Jeruselem.”
  alternative: A pụrụ ịsụgharị ya n’ụzọ dị mfe dịka “ọ nọ na-aga Jeruselem,” ma ọ bụ n’ụzọ na-emesi mkpebi ike dịka “o kpebisiri ike ịga Jeruselem.”
  rationale: Nhọrọ a na-echekwa ihe oyiyi na nrụgide dị n’asụsụ Grik—ma ntụziaka njem ma mkpebi—na-enweghị ime ka naanị otu n’ime ha bụrụ nkọwa zuru ezu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị nsọpụrụ. “Anabataghị” dabara n’ọnọdụ ile ọbịa, ebe “ihu ya chere ụzọ” na-edobe ihe oyiyi nke isi mmalite n’enweghị asụsụ ochie ma ọ bụ nkọwa otu ụka.
