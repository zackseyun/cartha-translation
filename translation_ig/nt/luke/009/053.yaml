- from: Ma ha anabataghị ya[a], n’ihi na ihu ya chere ụzọ Jeruselem[b].
  to: Ma ha anabataghị ya[a], n’ihi na ihu ya chere Jeruselem ihu[b].
  rationale: The revision replaces the non-idiomatic “chere ụzọ Jeruselem” with “chere Jeruselem ihu.” This preserves the Greek’s vivid reference to Jesus’ ‘face’ while conveying his orientation toward Jerusalem in natural Igbo. The text does not force the possible implication of resolve into the main line; that nuance remains appropriately noted in the footnote.
