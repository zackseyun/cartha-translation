id: LUK.9.9
reference: Luke 9:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: ig
  text: Ma Herọd kwuru, “Jọn ka m gbupụrụ isi; ma ònye bụ onye a m na-anụ ihe ndị dị otu a banyere ya?” Ọ nọgidere na-achọ ịhụ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ nọ na-achọ ịhụ ya.” Imperfect Grik nwere ike igosi omume na-aga n'ihu ma ọ bụ nke na-eme ugboro ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-ejikọta okwu a na ihe bu ya ụzọ ma na-egosikwa ntakịrị ọdịiche n'okwu Herọd.
- source_word: Ἡρῴδης
  choice: Herọd
  rationale: E dere aha onye ahụ n'ụdị ntụgharị mkpụrụokwu a na-ejikarị n'Igbo.
- source_word: Ἰωάννην
  choice: Jọn
  rationale: E dere aha onye ahụ n'ụdị a maara nke ọma n'Igbo.
- source_word: ἐγὼ
  choice: ka m
  rationale: Usoro “Jọn ka m...” na-echekwa nkwusi ike dị n'aha nnọchi onwe ahụ pụtara ìhè n'asụsụ Grik.
- source_word: ἀπεκεφάλισα
  choice: gbupụrụ isi
  rationale: Ngwaa ahụ pụtara kpọmkwem igbu mmadụ site n'ịgbupụ ya isi; e zere itinye nkọwa oge ọzọ na-adịghị na Grik.
- source_word: τίς ... ἐστιν οὗτος
  choice: ònye bụ onye a
  rationale: Ọ na-echekwa ajụjụ Herọd na ụzọ o si na-ekwu maka onye ọ na-amaghị nke ọma, n'etinyeghị nkọwa ọzọ.
- source_word: περὶ οὗ
  choice: banyere ya
  rationale: Nke a bụ ụzọ ebumpụta ụwa Igbo si egosi onye okwu ndị a metụtara.
- source_word: ἀκούω
  choice: m na-anụ
  rationale: Ọ na-egosipụta ihe Herọd na-anụ ugbu a ma na-ada nke ọma n'Igbo.
- source_word: τοιαῦτα
  choice: ihe ndị dị otu a
  rationale: Ọ na-edobe okwu ahụ n'obosara ya n'akọwaghị ya dị ka akụkọ ma ọ bụ ọrụ ebube kpọmkwem.
- source_word: ἐζήτει
  choice: Ọ nọgidere na-achọ
  rationale: Ọ na-egosipụta omume na-aga n'ihu ma ọ bụ na-eme ugboro ugboro nke imperfect Grik nwere ike ịpụta.
- source_word: ἰδεῖν αὐτόν
  choice: ịhụ ya
  rationale: Ọ bụ ntụgharị kwụ ọtọ nke ọchịchọ ịhụ onye ahụ, n'agbanweghị ya ka ọ bụrụ 'izute ya.'
theological_decisions:
- issue: Okwu Herọd banyere Jọn na ọchịchọ ya ịhụ Jizọs
  choice: E gosipụtara ya dị ka nkwupụta, ajụjụ, na ọchịchọ ịhụ ya n'etinyeghị ihe ọzọ.
  alternative: Ịkọwapụta na Herọd chere ma ọ bụ tụrụ egwu na Jọn esilila n'ọnwụ bilie.
  rationale: Amaokwu a n'onwe ya ekwughị kpọmkwem na Herọd chere na Jọn ebiliela n'ọnwụ; ya mere, ntụgharị ahụ na-edobe njide onwe nke ederede na mgbagwoju anya ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwanyere ugwu ma dị mfe nghọta. Usoro “Jọn ka m gbupụrụ isi” na-enye ἐγὼ nkwusi ike n'ụzọ ebumpụta ụwa. E tinyere akara [a] n'akụkụ okwu ἐζήτει nke ihe odide ala ala peeji ahụ na-akọwa.
