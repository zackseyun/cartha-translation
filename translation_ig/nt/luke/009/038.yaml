source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: ig
  text: Ma, lee! Otu nwoke sitere n’ìgwè mmadụ ahụ tiri mkpu, sị, “Onye nkuzi, ana m arịọ gị, biko, lekwasị nwa m nwoke anya, n’ihi na ọ bụ naanị otu nwa m nwere.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ bụ naanị nwa nwoke m.” N’ụzọ nkịtị, okwu Grik ahụ na-ekwu na ọ bụ “naanị otu” nye ya. Ebe a kpọọlarị ya nwa nwoke, ntụgharị abụọ ahụ kwe omume.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Na-echekwa ọrụ okwu a dị ka ihe na-adọta uche n’akụkọ Luk, n’asụsụ Igbo dị ugbu a ma dịkwa ugwu.
- source_word: ἀνὴρ
  choice: otu nwoke
  rationale: Na-egosipụta kpọmkwem na onye ahụ bụ nwoke, dịka okwu Grik si dị.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: nọ n’etiti ìgwè mmadụ
  rationale: Nke a na-egosi n'ụzọ Igbo kwụ ọtọ na nwoke ahụ bụ otu onye n’ime ìgwè mmadụ ahụ.
- source_word: ἐβόησεν
  choice: tiri mkpu
  rationale: Na-ezipụta olu ike na arịrịọ ngwa ngwa nke okwu Grik ahụ nwere.
- source_word: λέγων
  choice: sị
  rationale: Ụzọ dị mfe ma bụrụkwa nke ebumpụta ụwa n’Igbo isi jikọta mkpu ahụ na okwu nwoke ahụ kwuru.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ bụ ntụgharị kpọmkwem nke aha a, na-enweghị ịgbakwụnye echiche nke ịbụ onye nwe mmadụ.
- source_word: δέομαί σου
  choice: ana m arịọ gị, biko
  rationale: Na-egosipụta arịrịọ siri ike na nke sitere n’obi, ọ bụghị nanị ịrịọ ihe n’ụzọ nkịtị.
- source_word: ἐπιβλέψαι ἐπὶ
  choice: lekwasị ... anya
  rationale: Na-egosipụta ilebara onye ahụ anya nke ọma, ọ bụghị naanị ile ya anya otu ntabi anya.
- source_word: τὸν υἱόν μου
  choice: nwa m nwoke
  rationale: Na-echekwa ma njikọ ezinụlọ ahụ ma okike nwoke nke υἱός.
- source_word: μονογενής μοί ἐστιν
  choice: ọ bụ naanị otu nwa m nwere
  rationale: Na-egosipụta na ọ bụ naanị otu nwa nwoke ahụ nwere, ma na-ahapụ nkọwa ọzọ kwere omume—‘naanị nwa nwoke m’—n’ala ala peeji.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E ji “Ma lee” chekwaa akara akụkọ Luk nke na-adọta uche; e jikwa “lekwasị ... anya” gosi nlebara anya miri emi karịa ile anya nkịtị.
