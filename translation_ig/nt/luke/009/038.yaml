  to: Ma, lee! Otu nwoke sitere n’ìgwè mmadụ ahụ tiri mkpu, sị, “Onye nkuzi, ana m arịọ gị, biko, lekwasị nwa m nwoke anya, n’ihi na ọ bụ naanị otu nwa m nwere.[a]”
