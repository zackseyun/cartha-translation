revisions:
- from: Ma Jizọs sịrị, “Ọ dịghị onye tinyeworo aka n’ọgụ ala[a], ma na-ele anya n’azụ, kwesịrị ekwesị[b] maka alaeze Chineke.”
  to: Ma Jizọs sịrị, “Ọ dịghị onye tinyeworo aka ya n’elu ngwá ịkọ ala[a] ma na-ele anya n’azụ dabara adaba[b] maka alaeze Chineke.”
  rationale: The revision makes the plow image explicit, improves idiomatic Standard Igbo, and corrects the footnote wording. It retains the source's aorist-plus-present-participle contrast (“has put” / “looks”) and leaves εὔθετος as general suitability for God's kingdom, without imposing a conclusion about salvation.
  reviewer_model: gpt-5.6-terra
