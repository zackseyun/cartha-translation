  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: ig
  text: Ma Jizọs sịrị, “Ọ dịghị onye tinyeworo aka ya n’elu ngwá ịkọ ala[a] ma na-ele anya n’azụ dabara adaba[b] maka alaeze Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye tinyeworo aka ya n’elu ọgụ ala.” Ihe atụ a bụ nke onye malitere ịkọ ala ma mesịa tụgharịa uche ya lee anya n’azụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “kwesịrị ekwesị” ma ọ bụ “bara uru” maka alaeze Chineke.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Ọ dịghị onye
  rationale: Nke a na-egosi onye ọ bụla n’enweghị ịkpa oke; ọ bụkwa ụzọ Igbo nkịtị si egosipụta nkwupụta zuru ụwa ọnụ nke na-ajụ mmadụ niile.
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: tinyeworo aka n’ọgụ ala
  rationale: Oge ngwaa a na-egosi na onye ahụ amalitela ọrụ ịkọ ala. Nsụgharị a na-edobe ihe atụ ọrụ ugbo nke okwu Grik ahụ.
- source_word: ἄροτρον
  choice: ọgụ ala
  rationale: Ọ bụ ngwa e ji akọ ala. Ịkpọ ya “ọgụ ala” na-eme ka ihe a na-ekwu doo ndị na-agụ Igbo anya ma debe onyinyo ọrụ ugbo ahụ.
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: na-ele anya n’azụ
  rationale: Ọ na-egosi omume na-aga n’ihu ma ọ bụ nke a na-emekarị, ma debe ma ihe oyiyi nkịtị ahụ ma echiche nke obi kewara ekewa.
- source_word: εὔθετός
  choice: kwesịrị ekwesị
  rationale: Okwu a pụtara ịbụ onye dabara adaba ma ọ bụ ruru eru maka otu nzube. “Kwesịrị ekwesị” na-ezere ime ka ọ bụrụ nkwupụta kpọmkwem banyere nzọpụta ikpeazụ.
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: maka alaeze Chineke
  rationale: N’akụkụ εὔθετος, dative a na-egosi ihe mmadụ kwesịrị ekwesị maka ya. “Alaeze Chineke” bụ okwu Igbo doro anya ma bụrụkwa ụzọ a na-ejikarị asụ βασιλεία τοῦ θεοῦ.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi obere ọdịiche ma ọ bụ mgbanwe n’okwu; “Ma” dabara n’azịza Jizọs nye okwu gara aga.
theological_decisions:
- issue: Ihe εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦ pụtara
  choice: E gosipụtara ya dị ka ịbụ onye kwesịrị ekwesị maka alaeze Chineke, na-akọwaghị kpọmkwem ma ọ bụ okwu banyere nzọpụta ikpeazụ.
  alternative: A pụrụ ịsụ ya “erughị eru ịbanye n’alaeze” ma ọ bụ “abaghị uru n’ozi alaeze.”
  rationale: Ihe atụ ịkọ ala na-emesi nrubeisi na-enweghị ileghachi anya ike. Okwu Grik εὔθετος na-ekwu maka ịdị mma ma ọ bụ ịdị adaba maka nzube; ya mere nsụgharị ahụ na-edobe ịdọ aka ná ntị ahụ n’ike n’etinyeghị nkọwa ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù, dee ya. E debere ihe atụ ọrụ ugbo na mgbagwoju anya dị n’okwu “kwesịrị ekwesị,” n’enweghị itinye nkọwa ụka pụrụ iche.
