review_pass:
  verdict: revise
  source_fidelity: The sequence of suffering, rejection by the three named groups, killing, and resurrection on the third day is retained. However, “si n’ọnwụ” and the enclitic “-kwa” add elements not expressed by ἐγερθῆναι or the coordination, and should be omitted. The opening imperfect “na-asị” does not match the aorist participle well; “wee sị” gives a natural linked narrative rendering.
  naturalness: The revision uses idiomatic Standard Igbo while retaining the elevated biblical register. “Ka e kpọlite ya n’ụbọchị nke atọ” is clear and sufficiently expresses the Greek passive without an unnecessary expansion.
  terminology: “Nwa nke Mmadụ,” “ndị okenye,” “ndị isi nchụàjà,” and “ndị odeakwụkwọ” appropriately preserve the established Gospel designations. “Ka e kpọlite ya” preserves the passive resurrection expression.
  issues:
  - severity: medium
    issue: The translation adds “si n’ọnwụ” and “-kwa” to the resurrection clause.
    rationale: The Greek says simply “to be raised” and does not explicitly include “from death” or “also.” Resurrection context may imply the former, but optimal equivalence should not state it in the text when it is absent from the source.
  - severity: low
    issue: “na-asị” is imperfect/progressive in aspect.
    rationale: εἰπὼν is an aorist participle. “Wee sị” is a natural Igbo narrative linkage that better reflects a completed utterance introducing the quotation.
  - severity: low
    issue: Footnote [a] uses “Ọ ga-abụrịrị,” which primarily conveys certainty rather than the necessity expressed by Δεῖ.
    rationale: “Aghaghị” more directly conveys the proposed alternative, “must,” without reducing divine necessity to mere probability.
  revised_text: wee sị[a], “Ọ dị mkpa ka Nwa nke Mmadụ taa ọtụtụ ahụhụ, ka ndị okenye, ndị isi nchụàjà na ndị odeakwụkwọ jụ ya, ka e gbuo ya, ka e kpọlite ya n’ụbọchị nke atọ[b].”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Nwa nke Mmadụ aghaghị ịta ọtụtụ ahụhụ …”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik, okwu a dị n’ụdị passive: “ka e kpọlite ya”; a pụkwara ịtụgharị ya, “ka o bilie.”'
    reason: alternative_reading
  revision_rationale: The revision removes unexpressed additions in the resurrection clause, uses a more suitable narrative rendering for the aorist participle, and corrects the lexical alternative for Δεῖ. It retains the Greek passive in both the main text and the explanatory footnote, without naming an agent or imposing a theological interpretation.
