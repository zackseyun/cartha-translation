revisions:
- from: na-asị[a], “Ọ dị mkpa ka Nwa nke Mmadụ taa ọtụtụ ahụhụ, ka ndị okenye, ndị isi nchụàjà na ndị odeakwụkwọ jụ ya, ka e gbuo ya, ka e si n’ọnwụ kpọlitekwa ya n’ụbọchị nke atọ[b].”
  to: wee sị[a], “Ọ dị mkpa ka Nwa nke Mmadụ taa ọtụtụ ahụhụ, ka ndị okenye, ndị isi nchụàjà na ndị odeakwụkwọ jụ ya, ka e gbuo ya, ka e kpọlite ya n’ụbọchị nke atọ[b].”
  rationale: The revision removes unexpressed additions in the resurrection clause, uses a more suitable narrative rendering for the aorist participle, and corrects the lexical alternative for Δεῖ. It retains the Greek passive in both the main text and the explanatory footnote, without naming an agent or imposing a theological interpretation.
