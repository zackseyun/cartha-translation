id: LUK.9.22
reference: Luke 9:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: ig
  text: wee sị[a], “Ọ dị mkpa ka Nwa nke Mmadụ taa ọtụtụ ahụhụ, ka ndị okenye, ndị isi nchụàjà na ndị odeakwụkwọ jụ ya, ka e gbuo ya, ka e kpọlite ya n’ụbọchị nke atọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Nwa nke Mmadụ aghaghị ịta ọtụtụ ahụhụ …”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik, okwu a dị n’ụdị passive: “ka e kpọlite ya”; a pụkwara ịtụgharị ya, “ka o bilie.”'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰπὼν
  choice: na-asị
  rationale: Ọ bụ participle aorist nke λέγω, nke na-ejikọta okwu a na ihe bu ya ụzọ. “Na-asị” na-echekwa njikọ ahụ n’Igbo n’enweghị ime ya ahịrịokwu ọhụrụ.
- source_word: Δεῖ
  choice: Ọ dị mkpa ka
  rationale: Nke a na-egosipụta ịdị mkpa dị n’atụmatụ Chineke, ọ bụghị naanị ihe kwesịrị ekwesị ime. Ọ na-echekwakwa usoro impersonal nke Grik n’ụzọ Igbo na-aghọta nke ọma.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Aha a na-echekwa ọdịdị aha ahụ na njikọ ya na ojiji ya n’Akwụkwọ Nsọ, kama ịkọwa ya n’ụzọ ga-eme ka ihe ọ pụtara dị warara.
- source_word: πολλὰ παθεῖν
  choice: taa ọtụtụ ahụhụ
  rationale: Nke a na-egosi ọtụtụ ụdị ahụhụ nke πολλὰ na-ezo aka na ha, ma bụrụkwa okwu Igbo dị mfe ma dị ebube.
- source_word: ἀποδοκιμασθῆναι
  choice: jụ ya
  rationale: Ngwaa passive a na-egosi na ndị isi ahụ agaghị anabata ya mgbe ha nyochachara ya. N’usoro Igbo, ịkpọ ndị mere ihe ahụ aha ma sị “jụ ya” doro anya ma bụrụ ihe e ji asụsụ eme.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: ndị okenye, ndị isi nchụàjà na ndị odeakwụkwọ
  rationale: ἀπό na passive na-egosi ndị mere omume ahụ. Aha atọ a na-echekwa otu ndị ọchịchị na ndị ọkachamara n’iwu e kwuru kpọmkwem.
- source_word: πρεσβυτέρων
  choice: ndị okenye
  rationale: Ọ na-ezo aka n’otu ndị okenye ndị Juu a ma ama dịka ndị ndu.
- source_word: ἀρχιερέων
  choice: ndị isi nchụàjà
  rationale: Plural a na-ezo aka n’òtù ndị nọ n’isi ọrụ nchụàjà, ọ bụghị ọtụtụ nnukwu onye nchụàjà na-achị n’otu oge.
- source_word: γραμματέων
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ aha otu ahụ n’ụzọ kwụ ọtọ ma na-echekwa ọdịiche dị n’etiti ha na nkọwa sara mbara dịka ndị nkuzi iwu.
- source_word: ἀποκτανθῆναι
  choice: ka e gbuo ya
  rationale: Ọ na-echekwa passive infinitive ahụ n’ụzọ Igbo doro anya, n’agbanyeghị na onye ga-egbu ya ekwughị kpọmkwem.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: n’ụbọchị nke atọ
  rationale: Nke a bụ ntụgharị Igbo nkịtị nke temporal dative ma na-echekwa usoro ụbọchị ahụ kpọmkwem.
- source_word: ἐγερθῆναι
  choice: ka e si n’ọnwụ kpọlitekwa ya
  rationale: “Kpọlite ya” na-echekwa passive nke Grik na-enweghị ịkpọ Chineke aha dịka onye mere ya. “Si n’ọnwụ” na-eme ka ojiji resurrection nke ngwaa ahụ doo anya n’Igbo; “-kwa” na-aga n’ihu n’usoro ihe ndị ahụ.
theological_decisions:
- issue: Ụdị passive nke ngwaa mbilite n’ọnwụ
  choice: ka e si n’ọnwụ kpọlitekwa ya
  alternative: ka o biliekwa n’ọnwụ
  rationale: Grik ji passive infinitive ἐγερθῆναι. Nhọrọ a na-echekwa na e mere ihe ahụ nye Nwa nke Mmadụ, ma ọ naghị etinye aha onye mere ya ebe amaokwu ahụ ekwughị ya.
- issue: Ike nke Δεῖ
  choice: Ọ dị mkpa ka
  alternative: Nwa nke Mmadụ aghaghị
  rationale: Usoro a na-echekwa ọdịdị impersonal nke Grik na echiche nke ịdị mkpa dị n’atụmatụ Chineke, na-enweghị ịkọwa ihe kpatara ịdị mkpa ahụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara aha Akwụkwọ Nsọ “Nwa nke Mmadụ,” aha òtù ndị isi atọ, usoro nke ihe ga-eme, na passive nke ọnwụ na mbilite n’ọnwụ. Akara nkọwa ala [b] dị n’akụkụ okwu mbilite n’ọnwụ nke ọ na-akọwa.
