  text: Ἐγένετο ⸀δὲ τῇ ἑξῆς ἡμέρᾳ κατελθόντων αὐτῶν ἀπὸ τοῦ ὄρους συνήντησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: ig
  text: N’ụbọchị sochirinụ[a], mgbe ha si n’ugwu ahụ rịdata, nnukwu ìgwè mmadụ zutere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’echi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: E gosipụtaghị ya iche n’okwu Igbo
  rationale: N’ebe a, akpaokwu ahụ bụ ụzọ e si aga n’ihu n’akụkọ, ọ bụghị okwu na-egosi ‘ugbu a’ kpọmkwem. Igbo dị ire anaghị achọ ka a sụgharịa ya iche.
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche nke ‘n’ụbọchị sochirinụ.’
- source_word: κατελθόντων αὐτῶν
  choice: mgbe ha ... rịdata
  rationale: Ọ na-edobe ọnọdụ gbara isi omume ahụ gburugburu ma na-egosi na ha si n’elu gbadata.
- source_word: ἀπὸ τοῦ ὄρους
  choice: si n’ugwu ahụ
  rationale: ‘Ugwu’ bụ okwu Igbo kwesịrị ekwesị maka ὄρος; ‘ahụ’ na-arụtụ aka n’ugwu a kpọtụrụla n’akụkọ ahụ.
- source_word: συνήντησεν αὐτῷ
  choice: zutere ya
  rationale: Nke a bụ nsụgharị kwụ ọtọ ma dị ndụ nke omume izute mmadụ.
- source_word: ὄχλος πολύς
  choice: nnukwu ìgwè mmadụ
  rationale: Ọ na-egosi ìgwè mmadụ buru ibu n’asụsụ Igbo doro anya.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E ji ‘N’echi ya’ mee ka okwu ahụ bụrụ nke nkịtị n’Igbo, ebe nkọwa ala peeji na-edobe nsụgharị ọzọ dabara nke ọma.
