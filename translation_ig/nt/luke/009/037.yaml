    issue: The main temporal phrase “N’echi ya” is potentially deictic/ambiguous.
    rationale: While it can be used for a succeeding day in context, it commonly means “tomorrow.” The Greek explicitly refers to the day following the preceding event. “N’ụbọchị sochirinụ” communicates this narrative reference directly and also matches the retained English audit trail.
  revised_text: N’ụbọchị sochirinụ[a], mgbe ha si n’ugwu ahụ rịdata, nnukwu ìgwè mmadụ zutere ya.
