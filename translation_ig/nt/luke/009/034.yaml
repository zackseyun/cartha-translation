  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: ig
  text: Mgbe ọ ka na-ekwu ihe ndị a, otu igwe ojii pụtara wee malite ikpuchi ha[a]; ụjọ tụkwara ha mgbe ha banyere n'ime igwe ojii ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “otu igwe ojii pụtara wee kpuchie ha.” Okwu Grik ahụ nwere ike ịkọwa omume ahụ n''ụzọ dị mfe, n''ekwughị hoo haa na ọ malitere.'
    reason: lexical_alternative
  - marker: b
    text: Igwe ojii a nwere ike ime ka a cheta ebe ndị dị n'Agba Ochie nke igwe ojii gosipụtara ọnụnọ Chineke, ma amaokwu a ekwughị nke ahụ hoo haa.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Na-edobe ụdị ọtụtụ nke okwu Grik ahụ ma na-ezo aka n'okwu Pita kwuru tupu nke a.
- source_word: αὐτοῦ λέγοντος
  choice: mgbe ọ ka na-ekwu
  rationale: Na-egosipụta na omume ikwu okwu ka na-aga n'ihu mgbe ihe ọzọ mere.
- source_word: ἐγένετο νεφέλη
  choice: otu igwe ojii pụtara
  rationale: Ọ bụ okwu Igbo doro anya nke na-egosi mpụta igwe ojii ahụ n'ebughị ụzọ kọwaa ebe o si bịa.
- source_word: ἐπεσκίαζεν
  choice: wee malite ikpuchi
  rationale: Na-egosipụta omume na-amalite ma na-aga n'ihu nke imperfect; ‘ikpuchi’ bụ okwu ndị mmadụ na-aghọta nke ọma maka igwe ojii nke gbara ha gburugburu.
- source_word: ἐφοβήθησαν
  choice: ụjọ tụkwara ha
  rationale: Ọ bụ ụzọ Igbo dị ndụ ma dị mfe isi kwuo na ha malitere ịtụ egwu.
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: mgbe ha banyere
  rationale: Na-enye nghọta oge nke articular infinitive ma na-edobe ‘ha’ dị ka ndị banyere.
- source_word: εἰς τὴν νεφέλην
  choice: n'ime igwe ojii ahụ
  rationale: Na-edobe echiche mmegharị banye n'ime igwe ojii, ọ bụghị naanị ịnọ n'okpuru ya.
theological_decisions:
- issue: Ụdị igwe ojii ahụ na ihe mkpuchi ya pụtara
  choice: A kọwara naanị na igwe ojii pụtara wee malite ikpuchi ha.
  alternative: Ịkpọ ya igwe ojii nke ebube ma ọ bụ ọnụnọ Chineke.
  rationale: Ọnọdụ ahụ nwere ike icheta ebe Agba Ochie kwuru banyere ngosipụta ọnụnọ Chineke, ma amaokwu a n'onwe ya ekwughị nke ahụ hoo haa; ya mere, ntụgharị ahụ anaghị etinye nkọwa ozizi n'ime isiokwu.
- issue: Ndị okwu ‘ha’ na-ezo aka na ha mgbe ha banyere n'igwe ojii
  choice: E debere ya n'ụzọ sara mbara dịka ‘ha’.
  alternative: Ịkọwapụta ndị ha bụ n'ime isiokwu.
  rationale: Asụsụ Grik ji nnọchiaha nke nwere ike ịchọ ka onye na-agụ ya ghọta ndị a na-ekwu maka ha site n'ọnọdụ gbara amaokwu ahụ gburugburu; ntụgharị anaghị edozi nghọtahie ahụ n'ike.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. ‘Mgbe ọ ka na-ekwu’ na-edobe omume na-aga n'ihu; ‘ụjọ tụkwara ha’ bụ okwu Igbo nkịtị ma dị ndụ. E debere ihe omimi nke igwe ojii ahụ n'akọwaghị ya dịka ọnụnọ Chineke n'ime isiokwu.
