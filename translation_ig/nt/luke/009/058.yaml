id: LUK.9.58
reference: Luke 9:58
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ig
  text: Jizọs wee sị ya, “Nkịta ọhịa nwere ọgba ha[a], ụmụ nnụnụ nke eluigwe[b] nwekwara akwụ ha, ma Nwa nke Mmadụ[c] enweghị ebe ọ ga-atọgbọ isi ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “olulu ha.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ụmụ nnụnụ nke eluigwe”; n’ebe a, “eluigwe” pụtara mbara igwe.
    reason: lexical_alternative
  - marker: c
    text: “Nwa nke Mmadụ” bụ aha Jizọs ji akpọ onwe ya; ọ pụkwara ịdị na-echetara Daniel 7:13–14.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: nkịta ọhịa
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa fox; ọ na-edobe aha anụmanụ ahụ kama ime ka ọ bụrụ naanị anụ ọhịa n’ozuzu.
- source_word: φωλεοὺς
  choice: ọgba ha
  rationale: “Ọgba” na-egosi ebe anụ ọhịa na-ebi ma ọ bụ na-ezo; itinye “ha” na-eme ka okwu ahụ daa nke ọma n’Igbo.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ụmụ nnụnụ nke eluigwe
  rationale: Nke a na-anọ nso n’usoro okwu Grik, ma “eluigwe” n’ebe a pụtara mbara igwe ebe nnụnụ na-efe.
- source_word: κατασκηνώσεις
  choice: akwụ ha
  rationale: N’agbanyeghị na okwu Grik ahụ nwere echiche sara mbara nke ebe obibi ma ọ bụ ebe izu ike, “akwụ” bụ okwu Igbo kacha dabara n’ihe gbasara nnụnụ.
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A tụgharịrị aha Jizọs ji akpọ onwe ya n’ụzọ doro anya ma debe ọdịdị genitive nke okwu Grik na nkwughachi o nwere ike inwe na Daniel 7:13–14.
- source_word: ποῦ
  choice: ebe
  rationale: Mgbe e jikọtara ya na “enweghị,” ọ na-enye echiche Grik nke na ọ nweghị ebe ọ bụla.
- source_word: κλίνῃ τὴν κεφαλὴν
  choice: ọ ga-atọgbọ isi ya
  rationale: Nke a na-edobe ihe oyiyi pụtara ìhè nke ịtọgbọ isi iji zuru ike, ma bụrụkwa okwu dị mma ma kwanyere ugwu n’Igbo.
- source_word: δὲ
  choice: ma
  rationale: “Ma” na-egosi ọdịiche dị n’etiti anụmanụ ndị nwere ebe obibi na Nwa nke Mmadụ nke na-enweghị ya.
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: Jizọs wee sị ya
  rationale: Nke a bụ usoro akụkọ dị ndụ ma bụrụkwa ntụgharị kwesịrị ntụkwasị obi nke na-egosi na Jizọs gwara nwoke ahụ okwu.
theological_decisions:
- issue: Otú e si sụgharịa aha Jizọs ji akpọ onwe ya, υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: “Nwa nke Mmadụ” na-edobe ọdịdị aha ahụ a maara nke ọma na mgbagwoju echiche ya, gụnyere nkwughachi o nwere ike inwe na Daniel, kama ịkọwa ya n’ụzọ ga-ekpebi ihe ọ pụtara naanị otu ụzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa ùgwù. Ahịrịokwu ahụ na-edobe ọdịiche siri ike dị n’ederede Grik n’etiti ebe obibi ụmụ anụmanụ na enweghị ebe Nwa nke Mmadụ ga-atọgbọ isi ya.
