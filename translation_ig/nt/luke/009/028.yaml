    issue: The two main actions are joined only by a comma.
    rationale: Adding the sequential connector “wee” improves natural Igbo narrative flow without adding meaning.
  - severity: low
    issue: The purpose infinitive is rendered as a bare noun phrase, “ikpe ekpere.”
    rationale: “Ka o kpee ekpere” more clearly and idiomatically conveys the Greek purpose infinitive προσεύξασθαι.
  - severity: low
    issue: 'Footnote a’s alternative wording is somewhat awkward: “mgbe ihe ndị a o kwuru gasịrị.”'
    rationale: Using the passive expression “mgbe ihe ndị a e kwuru gasịrị” is smoother and avoids an unnecessarily explicit subject.
