source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: ig
  text: Ihe dị ka ụbọchị asatọ[b] mgbe okwu ndị a gasịrị,[a] ọ kpọọrọ Pita, Jọn na Jemis wee rịgoro n’ugwu ka o kpee ekpere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ihe ndị a e kwuru gasịrị.” Okwu Grik λόγους nwere ike ịpụta “okwu” ma ọ bụ “ihe e kwuru” n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ “ihe dị ka ụbọchị asatọ”; ὡσεὶ na-egosi na oge ahụ bụ atụmatụ, ọ bụghị ọnụ ọgụgụ kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: (egosighị ya iche n’okwu Igbo)
  rationale: N’ebe a, nkebiokwu a na-arụkarị ọrụ dị ka njikọ na-akwalite akụkọ n’ihu. Usoro ahịrịokwu Igbo na-egosi mgbanwe ahụ nke ọma n’etinyeghị okwu dịka “ugbu a,” nke na-adịghị n’isi mmalite Grik.
- source_word: μετὰ τοὺς λόγους τούτους
  choice: mgbe okwu ndị a gasịrị
  rationale: “Okwu ndị a” na-ezo aka n’ihe Jizọs kwuru tupu nke a. Ọ na-edobe λόγους n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ nke ọma.
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: ihe dị ka ụbọchị asatọ
  rationale: “Ihe dị ka” na-edobe echiche ὡσεὶ nke na-egosi na oge ahụ bụ nke a tụrụ atụ, ọ bụghị kpọmkwem ụbọchị asatọ.
- source_word: παραλαβὼν
  choice: ọ kpọọrọ
  rationale: “Kpọọrọ” na-egosi na ọ kpọọrọ mmadụ ka ha soro ya, ma na-atụgharị participle ahụ n’ụzọ dabara adaba n’usoro okwu Igbo.
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Pita, Jọn na Jemis
  rationale: E dere aha ndị ahụ n’ụdị a maara nke ọma n’Igbo; iji rikoma na “na” mee ndepụta ahụ ka ọ bụrụ Igbo dị larịị.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: rịgoro n’ugwu
  rationale: “Rịgoro” na-edobe mmegharị ịrị elu ahụ, ebe “n’ugwu” na-egosi ebe ọ gara n’Igbo nkịtị.
- source_word: προσεύξασθαι
  choice: ikpe ekpere
  rationale: Infinitive a na-egosi nzube ọ jiri rịgoro; “ikpe ekpere” bụ ụzọ Igbo doro anya na nke a na-ejikarị ekwu ya.
theological_decisions:
- issue: Oge a tụrụ atụ ma e jiri ya tụnyere akụkọ ndị yiri ya
  choice: ihe dị ka ụbọchị asatọ
  alternative: ụbọchị asatọ kpọmkwem
  rationale: ὡσεὶ na-egosi atụmatụ oge. Nsụgharị ahụ anaghị eme ka oge ahụ bụrụ kpọmkwem ma ọ bụ gbalịa ime ka ọ kwekọọ n’akụkọ Oziọma ndị ọzọ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị nsọ ma dịkwa mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ Igbo nke ọma, ma na-edobe atụmatụ oge, nzube nke ịrị ugwu, na njikọ ya na okwu ndị bu ụzọ.
