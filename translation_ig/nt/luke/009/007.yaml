  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: ig
  text: Herọd, onye tetrak, nụrụ ihe niile na-eme, o gbagwojuru ya anya n’ihi na ụfọdụ mmadụ na-ekwu na a kpọlitere Jọn n’ọnwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jọn esitela n’ọnwụ bilie.” Ngwaa Grik ahụ dị n’olu nnara; n’ụzọ nkịtị, “a kpọlitere Jọn.” Tetrak bụ aha ọkwa ọchịchị; okwu ahụ pụtara na mbụ “onye na-achị otu ụzọ n’ime ụzọ anọ.”
    reason: lexical_alternative; historical_title
lexical_decisions:
- source_word: Ἤκουσεν
  choice: nụrụ
  rationale: N’ebe a, ngwaa ahụ pụtara na akụkọ banyere ihe ndị ahụ ruru Herọd ntị; ihe na-esochi ya, “ihe niile na-eme,” na-eme ka nke a doo anya n’Igbo.
- source_word: δὲ
  choice: egosighị ya iche n’Igbo
  rationale: δέ bụ njikọ akụkọ dị nro nke na-ebuga akụkọ n’ihu. Ịmalite ahịrịokwu ahụ ozugbo na “Herọd” bụ ụzọ Igbo si ekwu ya nke ọma n’etinyeghị nghọtahie nke “ma” dị ka nnukwu mmegide.
- source_word: ὁ τετραάρχης
  choice: onye ọchịchị tetrak
  rationale: E debere aha ọkwa ọchịchị Gris a ka a ghara ime Herọd “eze” ma ọ bụ mee ka ọ bụrụ naanị onye ọchịchị n’ozuzu. Ihe odide ala peeji kọwara ọkwa ahụ maka ndị na-agụ ya.
- source_word: τὰ γινόμενα πάντα
  choice: ihe niile na-eme
  rationale: Nke a bụ okwu Igbo dị mfe ma na-egosi na ihe ndị a nọ na-aga n’ihu.
- source_word: διηπόρει
  choice: Ihe a gbagwojuru ya anya
  rationale: Nkebiokwu a na-egosi na Herọd nọ n’ọnọdụ mgbagwoju anya na enweghị ihe ọ ga-ekpebi, ma ọ bụ okwu Igbo a na-eji kwa ụbọchị nke ka nwere ugwu kwesịrị ekwesị.
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: n’ihi na ụfọdụ ndị na-ekwu
  rationale: Ọ na-egosi ihe kpatara mgbagwoju anya Herọd ma na-edobe na ọ bụ ụfọdụ mmadụ, ọ bụghị mmadụ niile, na-ekwupụta akụkọ ahụ. Ịgbanwe passive Gris gaa n’ụdị a bụ ụzọ Igbo kachasị eke na-enweghị ịgbanwe isi okwu ya.
- source_word: ἠγέρθη
  choice: a kpọlitela
  rationale: 'Ụdị a na-edobe olu nnara-eme nke ngwaa Gris: e mere ka Jọn bilie, kama ịsụgharị ya ozugbo dị ka o ji aka ya bilie.'
- source_word: ἐκ νεκρῶν
  choice: n’ọnwụ
  rationale: “Ịkpọlite mmadụ n’ọnwụ” bụ okwu Igbo eke maka ịkpọlite onye nwụrụ anwụ, ma ọ na-eburu echiche Gris nke isi n’etiti ndị nwụrụ anwụ pụta.
theological_decisions:
- issue: Okwu mbilite n’ọnwụ n’akụkọ a kọrọ banyere Jọn
  choice: a kpọlitela Jọn n’ọnwụ
  alternative: Jọn esitela n’ọnwụ bilie
  rationale: Ngwaa Gris dị n’olu nnara-eme. Isi nsụgharị ahụ na-edobe nke ahụ ma ghara ịgbanwe ya ka ọ bụrụ naanị ngwaa onye ahụ mere n’onwe ya; ihe odide ala peeji na-egosi ụzọ ọzọ a pụrụ isi kwuo ya.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke doro anya ma nwee ugwu. E kewara ahịrịokwu Gris ahụ ụzọ abụọ ka ọ na-asọ nke ọma n’Igbo, ma e chekwara mmekọrịta ihe kpatara ya. E debere “tetrak” dịka aha ọkwa akụkọ ihe mere eme ma kọwaa ya n’ala peeji.
