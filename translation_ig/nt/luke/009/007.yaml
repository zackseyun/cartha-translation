revisions:
- from: Herọd, onye ọchịchị tetrak[a], nụrụ ihe niile na-eme. Ihe a gbagwojuru ya anya, n’ihi na ụfọdụ ndị na-ekwu na a kpọlitela Jọn n’ọnwụ[b].
  to: Herọd, onye tetrak, nụrụ ihe niile na-eme, o gbagwojuru ya anya n’ihi na ụfọdụ mmadụ na-ekwu na a kpọlitere Jọn n’ọnwụ.[a]
  rationale: The revision keeps the Greek narrative and causal relationship in one sentence, uses an aorist-like passive Igbo form for John’s raising, and preserves the historical title without overstating its administrative implications. The title explanation is consolidated into the remaining footnote because the corrected text has only one appropriate anchor; the resurrection alternative and passive explanation remain available at the clause they explain.
