id: LUK.9.25
reference: Luke 9:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: ig
  text: N’ihi na, gịnị ka ọ ga-abara mmadụ uru ma ọ bụrụ na o rite ụwa dum, ma tụfuo onwe ya ma ọ bụ daba na mfu nke onwe ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta “onwe ya” dịka “ndụ ya” ma ọ bụ “mkpụrụ obi ya.” N’asụsụ Grik, ihe e dere kpọmkwem bụ “onwe ya”; e jighị okwu a na-ejikarị eme ihe maka “ndụ” ma ọ bụ “mkpụrụ obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: N’ihi na, uru gịnị ka ... ga-erite
  rationale: Ọ na-ejigide ajụjụ nkọwa nke τί na ọrụ njikọ nke γάρ, ma kwuo echiche nke uru n’Igbo dị ugbu a.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: N’ebe a, okwu Grik a na-anọchi anya mmadụ ọ bụla; “mmadụ” bụkwa okwu Igbo ebumpụta ụwa nke na-ejigide obosara ahụ.
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: ma ọ bụrụ na o rite ụwa niile
  rationale: A tụgharịrị participle ahụ dịka ọnọdụ a na-eche n’echiche; “ụwa niile” na-ejigide obosara nke κόσμον ὅλον.
- source_word: ἑαυτόν
  choice: onwe ya
  rationale: Ọ bụ nnọchiaha ntụgharị aka, ọ bụghị okwu Grik a na-ejikarị akọwa mkpụrụ obi ma ọ bụ ndụ; ya mere “onwe ya” kacha nso n’ihe ederede kwuru.
- source_word: ἀπολέσας
  choice: tụfuo
  rationale: “Tụfuo” na-egosi mmadụ ịla n’iyi ma ọ bụ ịbụ ihe furu efu, n’emeghị ka otu nkọwa ozizi bụrụ naanị ihe okwu ahụ pụtara.
- source_word: ἢ ζημιωθείς
  choice: ma ọ bụ bụrụ onye e mebiri ihe n’ihe banyere onwe ya
  rationale: Ọ na-echekwa “ma ọ bụ” nakwa ụdị nnabata omume nke participle ahụ; nkebiokwu ahụ na-egosi ịnata mfu ma ghara ime ka ọ bụrụ otu ihe kpọmkwem na “tụfuo.”
theological_decisions:
- issue: Ihe ἑαυτόν pụtara banyere ọdịnihu mmadụ
  choice: onwe ya
  alternative: ndụ ya; mkpụrụ obi ya
  rationale: Ihe odide Grik ji nnọchiaha ntụgharị aka mee ihe, ọ bụghị ψυχή. “Onwe ya” na-echekwa obosara na esemokwu nke okwu ahụ n’enweghị iweta nkọwa banyere mkpụrụ obi naanị.
- issue: Mmekọrịta dị n’etiti ἀπολέσας na ζημιωθείς
  choice: tụfuo ... ma ọ bụ bụrụ onye e mebiri ihe n’ihe banyere onwe ya
  alternative: tụfuo ma ọ bụ laa n’iyi
  rationale: A hapụrụ ha dịka echiche abụọ ejikọtara site na “ma ọ bụ,” kama ijikọta ha n’otu nkọwa ma ọ bụ kpochapụ ọdịiche dị n’etiti ifunahụ na ịnata mfu.
translation_notes:
  register: Standard Igbo; asụsụ dị ùgwù ma dị mfe nghọta. A họọrọ “mmadụ” dịka okwu nnọchi anya mmadụ ọ bụla. E tinyere akara nkọwa [a] ozugbo n’akụkụ nkebiokwu ọ na-akọwa.
