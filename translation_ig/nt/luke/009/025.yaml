    text: A pụkwara ịghọta “onwe ya” dịka “ndụ ya” ma ọ bụ “mkpụrụ obi ya.” N’asụsụ Grik, ihe e dere kpọmkwem bụ “onwe ya”; e jighị okwu a na-ejikarị eme ihe maka “ndụ” ma ọ bụ “mkpụrụ obi.”
    reason: lexical_alternative
