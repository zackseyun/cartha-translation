  text: And they did so[a], and had them all sit down.
translation:
  language: ig
  text: Ha wee mee otú ahụ[a], mee ka mmadụ niile nọdụ ala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịsụgharị ya kpọmkwem karịa dịka, “Ha wee mee otú ahụ, mee ka mmadụ niile nọdụ ala,” ma ọ bụ, “mee ka mmadụ niile dina ala.” Ngwaa Grik ahụ na-ekwu maka ịhazi ndị mmadụ maka iri nri, mgbe ụfọdụ n’ọnọdụ ịdina ala.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ha wee
  rationale: Ngwakọta a na-ejikọta ihe a na ntụziaka dị n'amaokwu bu ya ụzọ ma na-egosi usoro akụkọ n'Igbo nkịtị.
- source_word: ἐποίησαν οὕτως
  choice: mee otú ahụ
  rationale: Nkebiokwu a na-ezo aka n'iwu Jizọs nyere n'amaokwu bu ụzọ; ‘otú ahụ’ na-echekwa echiche nke ime ihe n'ụzọ ahụ.
- source_word: καὶ
  choice: mee ka
  rationale: Ọ na-ejikọta omume nke abụọ na nke mbụ n'usoro akụkọ dị mfe, ebe ‘ka’ na-enyere aka igosipụta ọdịdị causative nke ngwaa na-esote.
- source_word: κατέκλιναν
  choice: mee ka ... nọdụ ala
  rationale: Ngwaa Grik a pụtara ime ka ndị mmadụ nọdụ ma ọ bụ dabere ala maka iri nri. Nsụgharị a bụ Igbo nke oge a, doo anya, ma na-echekwa echiche causative.
- source_word: ἅπαντας
  choice: mmadụ niile
  rationale: Ọ na-egosi na ọ dịghị onye a hapụrụ; ‘mmadụ niile’ bụ okwu Igbo doro anya n'ọnọdụ a.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị mfe ma dị ùgwù. E ji ‘nọdụ ala’ mee ka omume iri nri ahụ doo onye Igbo nke oge a anya, ebe nkọwa ala peeji na-echekwa echiche nke ịdabere ala dị na omenala iri nri oge ahụ.
