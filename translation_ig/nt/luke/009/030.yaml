id: LUK.9.30
reference: Luke 9:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες δύο συνελάλουν αὐτῷ, οἵτινες ἦσαν Μωϋσῆς καὶ Ἠλίας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: ig
  text: Ma lee, ndị ikom abụọ nọ na-ekwurịta okwu na ya; ha bụ Mozis na Ịlaịja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ okwu Igbo doro anya nke na-adọta uche ma na-echekwa ịdị ndụ na mberede nke akara akụkọ Luk.
- source_word: ἄνδρες δύο
  choice: ndị ikom abụọ
  rationale: Ọ na-egosi mmadụ abụọ bụ nwoke, ya mere “ndị ikom abụọ” bụ nsụgharị ziri ezi ma bụrụkwa nke ndị Igbo na-aghọta ngwa ngwa.
- source_word: συνελάλουν
  choice: nọ na-ekwurịta okwu
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu; “nọ na-ekwurịta okwu” na-echekwa echiche ahụ nke mkparịta ụka na-aga n’ihu.
- source_word: αὐτῷ
  choice: na ya
  rationale: N’ihi ngwaa συλλαλέω, dative a na-egosi onye ha na ya na-akparịta ụka, ọ bụghị nanị onye a na-agwa okwu.
- source_word: οἵτινες
  choice: ha bụ
  rationale: N’Igbo, ịga n’ihu site n’ikwu “ha bụ” na-eme ka njirimara ndị ikom abụọ ahụ doo anya ma bụrụ okwu ebumpụta ụwa, n’enweghị ịgbakwụnye ike pụrụ iche na nnọchiaha ahụ.
- source_word: Μωϋσῆς
  choice: Mozis
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: Nke a bụ ụdị aha onye amụma ahụ a na-ejikarị eme ihe n’Igbo, ma kwekọọ na aha Hibru a maara nke ọma.
theological_decisions:
- issue: Njirimara ndị mmadụ abụọ ahụ n’oge mgbanwe ahụ
  choice: E kwuru hoo haa na ndị ikom abụọ ahụ bụ Mozis na Ịlaịja.
  alternative: Ịgbakwụnye nkọwa banyere ihe Mozis na Ịlaịja nọchiri anya ya.
  rationale: Amaokwu ahụ na-enye nanị njirimara ha kpọmkwem; nsụgharị ahụ etinyeghị nkọwa banyere ihe nnọchianya ma ọ bụ ihe ga-eme n’ọdịnihu nke ederede ahụ na-ekwughị.
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a, dị ùgwù ma dị mfe nghọta. “Ma lee” na-echekwa akara nlebara anya nke καὶ ἰδοὺ, ebe “nọ na-ekwurịta okwu” na-egosi omume na-aga n’ihu.
