review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the connective response, the pronoun 'to him,' the plural prohibition, and the generalizing force of ὃς γάρ. However, 'nọnyere unu' means 'is with you' and does not adequately render ὑπὲρ ὑμῶν ('is for you/in support of you').
  naturalness: The wording is clear, modern Standard Igbo. 'Unu egbochila ya' is a natural plural prohibition, and 'na-akwado unu' is a natural expression for being for or supporting someone.
  terminology: Jizọs is standard. Replacing 'nọnyere unu' with 'na-akwado unu' preserves the intended antithesis with 'na-adịghị emegide unu' without adding interpretation.
  issues:
  - severity: medium
    issue: The phrase 'nọnyere unu' weakens the sense of ὑπὲρ ὑμῶν.
    rationale: '''Nọnyere unu'' primarily means ''is with you,'' whereas the Greek states that the person is ''for you,'' that is, aligned with or supportive of you. ''Na-akwado unu'' conveys this more accurately in Igbo.'
  - severity: low
    issue: The lexical-alternative footnote should be anchored to the prohibition rather than to 'ya' ('to him').
    rationale: The note concerns κωλύετε ('do not stop/prevent'), not the pronoun in πρὸς αὐτόν. Placing the marker after 'egbochila ya' gives it a clear, appropriate anchor.
  revised_text: Ma Jizọs sịrị ya, “Unu egbochila ya[a], n’ihi na onye ọ bụla na-adịghị emegide unu na-akwado unu.”
  revised_footnotes:
