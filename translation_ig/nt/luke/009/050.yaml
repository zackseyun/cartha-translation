  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: ig
  text: Ma Jizọs sịrị ya, “Unu egbochila ya[a], n’ihi na onye ọ bụla na-adịghị emegide unu na-akwado unu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu akwụsịla ya” ma ọ bụ “Unu amachibidola ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Ma ... sịrị
  rationale: δέ bụ njikọ dị nro nke nwere ike igosi ntakịrị mmegide; “Ma” dabara n’azịza Jizọs nye ihe e kwuru n’amaokwu bu ụzọ, n’etinyeghị mmegide karịrị nke Grik kwuru.
- source_word: πρὸς αὐτόν
  choice: sịrị ya
  rationale: “Ya” na-ezo aka n’onye kwuru okwu ozugbo tupu nke a. Nke a na-edobe nnọchiaha dị na Grik kama itinye aha Jọn n’ime ederede.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ odide aha ahụ a na-ejikarị eme ihe n’Igbo Standard.
- source_word: Μὴ κωλύετε
  choice: Unu egbochila ya
  rationale: κωλύω pụtara igbochi, igbochigharị, ma ọ bụ machibido. N’ọnọdụ a, ndị na-eso ụzọ nwara igbochi nwoke ahụ ime ihe; “Unu egbochila ya” na-enye iwu ahụ n’Igbo doro anya ma na-egosikwa na ndị a na-agwa okwu karịrị otu.
- source_word: ὃς γὰρ
  choice: n’ihi na onye ọ bụla
  rationale: γάρ na-enye ihe kpatara iwu ahụ, ebe ὃς nwere ike ikwupụta ụkpụrụ sara mbara. “Onye ọ bụla” na-echekwa ike izugbe ahụ.
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: na-adịghị emegide unu
  rationale: κατά ya na genitive na-egosi mmegide. “Emegide unu” bụ ụzọ ebumpụta ụwa isi kwuo ya ma na-echekwa ὑμῶν dị n’ụdị ọtụtụ.
- source_word: ὑπὲρ ὑμῶν
  choice: nọnyere unu
  rationale: ὑπέρ n’ebe a na-egosi nkwado ma ọ bụ ịnọ n’akụkụ mmadụ. “Nọnyere unu” bụ Igbo dị mfe ma na-echekwa ọdịiche dị n’etiti imegide unu na ịnọ n’akụkụ unu.
theological_decisions:
- issue: Ogologo ihe okwu Jizọs pụtara
  choice: E ji “onye ọ bụla” mee ya ka ọ bụrụ ụkpụrụ izugbe nke metụtakwara nwoke ahụ a na-ekwu banyere ya.
  alternative: “Onye na-adịghị emegide unu nọnyere unu,” nke nwere ike ilekwasị anya karị n’otu onye ahụ.
  rationale: Nnọchiaha ὃς nwere ike izo aka n’onye ahụ ozugbo ma nweekwa ike ikwupụta ụkpụrụ sara mbara. “Onye ọ bụla” na-echekwa akụkụ sara mbara ahụ n’etinyeghị ozizi ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Standard nke oge a, dị mfe ma dị ùgwù. E ji “unu” mee ka ọtụtụ mmadụ a na-agwa okwu pụta ìhè. Enweghị akara nkọwa ala peeji n’ederede n’ihi na nkọwa Bekee e nyere maka [a] metụtara Μὴ κωλύετε, ọ bụghị “sịrị ya”; ntụgharị Igbo “Unu egbochila ya” na-enye isi okwu ahụ nke ọma n’enweghị mkpa itinye nhọrọ ndị fọrọ nke nta ka ha bụrụ otu ihe.
