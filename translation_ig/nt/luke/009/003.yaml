  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: ig
  text: Ọ sịrị ha, “Unu ewerela ihe ọ bụla maka njem—ma mkpara, ma akpa ndị njem[a], ma achịcha, ma ego[b]; unu enwekwala uwe tunik abụọ n’otu n’otu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, akpa e ji ebu ihe ndị a chọrọ n’ụzọ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọlaọcha”; n’ebe a ọ pụtara ego.
    reason: lexical_alternative
  - marker: c
    text: Okwu Grik ahụ pụtara uwe tunik abụọ maka onye ọ bụla, ma ọ bụ uwe tunik abụọ n’otu n’otu. Uwe tunik bụ ụdị uwe ndị mmadụ na-eyi n’oge ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: Unu ewerela ihe ọ bụla maka njem ahụ
  rationale: Nke a na-egosipụta iwu a machibidoro ha iburu ihe ọ bụla maka njem, n’Igbo doro anya ma dịkwa nso n’echiche Grik.
- source_word: ῥάβδον
  choice: mkpara
  rationale: N’ọnọdụ njem a, mkpara bụ osisi onye njem ji aga ije; okwu a bụ nke ndị Igbo na-aghọta nke ọma.
- source_word: πήραν
  choice: akpa ndị njem
  rationale: πήρα bụ akpa e ji ebu ihe oriri na ihe ndị ọzọ a chọrọ n’ụzọ; nkọwa a na-eme ka ụdị akpa ahụ doo anya.
- source_word: ἄρτον
  choice: achịcha
  rationale: A hapụrụ ihe a kpọrọ kpọmkwem n’Grik kama ịgbasa ya ka ọ bụrụ nri n’ozuzu.
- source_word: ἀργύριον
  choice: ego
  rationale: Ọ bụ ezie na okwu Grik pụtara ọlaọcha n'ụzọ nkịtị, n’ebe a ọ na-arụ ọrụ dị ka ego.
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: unu enwekwala uwe ime abụọ n’otu n’otu
  rationale: “N’otu n’otu” na-echekwa ike nkesa nke ἀνά, ya bụ, uwe abụọ maka onye ọ bụla.
- source_word: χιτῶνας
  choice: uwe ime
  rationale: χιτών bụ uwe a na-eyi n’ime ma ọ bụ uwe na-emetụ ahụ, ọ bụghị uwe elu nke oge a; “uwe ime” na-enye nkọwa akụkọ ihe mere eme n’ụzọ a pụrụ ịghọta.
