source:
  edition: SBLGNT
  text: καὶ ἐδεήθην τῶν μαθητῶν σου ἵνα ἐκβάλωσιν αὐτό, καὶ οὐκ ἠδυνήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: ig
  text: M rịọkwara ndị na-eso ụzọ gị ka ha chụpụ ya[a], ma ha enweghị ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nnọchiaha “ya” nwekwara ike izo aka n’ahụ nwata ahụ kama n’mmụọ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: Arịọkwara m
  rationale: Ngwaa a na-egosi arịrịọ siri ike. N'ọnọdụ a, “rịọ” na-enye Igbo dị ugbu a ma dịkwa nsọpụrụ; ihe gbara amaokwu ahụ gburugburu na-egosi ịdị ngwa nke arịrịọ nna ahụ.
- source_word: μαθητῶν σου
  choice: ndị na-eso ụzọ gị
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị na-amụta ihe n'aka onye nkuzi ma na-eso ya.
- source_word: ἵνα ἐκβάλωσιν
  choice: ka ha chụpụ
  rationale: “Ka ha chụpụ” na-egosipụta nzube nke arịrịọ ahụ ma kwekọọ n'okwu a na-eji maka ịchụ mmụọ ọjọọ.
- source_word: αὐτό
  choice: ya
  rationale: Nnọchiaha Igbo “ya” anaghị egosi okike, ya mere ọ na-anọgide nso n'okwu Grik ma ghara ikpebi kpamkpam ma ihe a na-ekwu banyere ya ọ̀ bụ mmụọ ahụ ka ọ̀ bụ nwata ahụ.
- source_word: οὐκ ἠδυνήθησαν
  choice: ha enweghị ike
  rationale: Nke a na-egosipụta enweghị ikike ma ọ bụ ike ime ihe ahụ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
theological_decisions:
- issue: Ihe αὐτό na-ezo aka na ya n'ọnọdụ ịchụ mmụọ ọjọọ
  choice: E ji “ya” mee ihe n'ahịrị bụ isi, a na-ewerekwa mmụọ ahụ dịka ihe o yikarịrị ka okwu ahụ na-ezo aka na ya.
  alternative: O nwekwara ike izo aka n'ahụ nwata ahụ.
  rationale: N'okwu banyere ịchụ mmụọ ọjọọ, ἐκβάλλω na-ejikarị mmụọ ọjọọ dịka ihe a na-achụpụ, ma nnọchiaha neuter ahụ kwekọkwara na πνεῦμα n'okwu gbara ya gburugburu. Otú ọ dị, “ya” n'Igbo nwere ike izo aka n'ahụ mmụọ ahụ ma ọ bụ nwata ahụ, ya mere e debere ụzọ nghọta nke ọzọ na nkọwa ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dịkwa nsọpụrụ. E tinyere “-kwara” iji jikọta okwu a na akụkọ gara n'ihu, dịka καί si eme na Grik. Nnọchiaha “ya” na-echekwa mgbagwoju anya dị n'ihe αὐτό na-ezo aka na ya; nkọwa ala peeji na-eme ka ụzọ nghọta nke ọzọ pụta ìhè.
