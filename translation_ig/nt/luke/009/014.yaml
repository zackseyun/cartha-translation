- from: N’ihi na ndị ikom nọ n’ebe ahụ dị ihe dị ka puku ise[a]. Ọ gwaziri ndị na-eso ụzọ ya, sị, “Meenụ ka ha nọdụ ala iri nri[b] n’ìgwè n’ìgwè, ihe dị ka mmadụ iri ise n’ìgwè nke ọ bụla.”
  to: N’ihi na ndị ikom nọ n’ebe ahụ dị ihe dị ka puku ise[a]. Ọ gwaziri ndị na-eso ụzọ ya, sị, “Meenụ ka ha nọdụ ala n’ìgwè n’ìgwè, ihe dị ka mmadụ iri ise n’ìgwè nke ọ bụla.”
  rationale: A wepụrụ 'iri nri' n’ederede isi ka a ghara itinye omume nke okwu Grik ahụ ekwughị kpọmkwem. E degharịkwara ihe odide ala peeji b ka ọ ghara iji 'daba ala,' nke na-adịghị egosi ịdina ala maka nri nke ọma, ma ka ọ nọgide na-akọwa ntụgharị kpọmkwem nke κατακλίνω.
