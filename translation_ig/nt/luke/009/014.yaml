  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: ig
  text: N’ihi na ndị ikom nọ n’ebe ahụ dị ihe dị ka puku ise[a]. Ọ gwaziri ndị na-eso ụzọ ya, sị, “Meenụ ka ha nọdụ ala n’ìgwè n’ìgwè, ihe dị ka mmadụ iri ise n’ìgwè nke ọ bụla.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a bụ “ndị ikom,” ya bụ, ndị nwoke toro eto, ọ bụghị ìgwè mmadụ ahụ niile; ọnụ ọgụgụ a agụnyeghị ụmụ nwanyị na ụmụaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: ihe dị ka
  rationale: Ọ na-egosi na ọnụ ọgụgụ ahụ abụghị kpọmkwem; nke a bụ ụzọ Igbo nkịtị si ekwu ‘about,’ ma dabara n’ebe abụọ okwu ahụ pụtara.
- source_word: ἄνδρες
  choice: ndị ikom
  rationale: Okwu Grik a na-akọwa ndị nwoke toro eto kpọmkwem, ọ bụghị mmadụ niile n’ozuzu.
- source_word: πεντακισχίλιοι
  choice: puku ise
  rationale: Nke a bụ ntụgharị doro anya nke ọnụ ọgụgụ ahụ.
- source_word: Κατακλίνατε
  choice: Meenụ ka ha nọdụ ala iri nri
  rationale: Ngwaa ahụ pụtara ime ka ndị mmadụ dabere ma ọ bụ nọdụ n’usoro iri nri; n’Igbo nke oge a, nkebiokwu a na-eme ka ọnọdụ iri nri ahụ doo anya n’enweghị okwu na-adịghị eke.
- source_word: κλισίας
  choice: n’ìgwè n’ìgwè
  rationale: Ọtụtụ aha a na-egosi ìgwè ndị e kewara ma hazie; ikwugharị ‘ìgwè’ bụ ụzọ Igbo sitere n’okike isi gosi nkewa ahụ.
- source_word: ἀνὰ πεντήκοντα
  choice: ihe dị ka mmadụ iri ise n’ìgwè nke ọ bụla
  rationale: ἀνά na ọnụ ọgụgụ na-egosi nkesa; ‘n’ìgwè nke ọ bụla’ na-eme ka echiche ahụ pụta ìhè.
- source_word: γὰρ ... δὲ
  choice: N’ihi na ... Ọ gwaziri
  rationale: ‘N’ihi na’ na-edobe ọrụ nkọwa nke γάρ, ebe ‘gwaziri’ na-enye δέ njikọ akụkọ dị mfe ma bụrụkwa nke Igbo sitere n’okike.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: A na-edobe nnọchiaha nwe ihe αὐτοῦ (‘ya’) nke dị kpọmkwem n’asụsụ Grik.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘nọdụ ala iri nri’ kama ntụgharị nkịtị nke nwere ike ime ka onye na-agụ ya chee nanị banyere ịdina ala; ihe odide ala peeji na-edobe nkọwa kpọmkwem nke ngwaa Grik. Akara ụda olu dị na ‘ìgwè’ na-enyere aka ịmata okwu ahụ nke ọma.
