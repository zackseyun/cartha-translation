    text: A pụkwara ịsị, “Meenụ ka ha dinara ala.” Ngwaa Grik ahụ na-egosi ime ka mmadụ nọdụ ma ọ bụ dinara ala maka nri.
    reason: lexical_alternative
  revision_rationale: A wepụrụ 'iri nri' n’ederede isi ka a ghara itinye omume nke okwu Grik ahụ ekwughị kpọmkwem. E degharịkwara ihe odide ala peeji b ka ọ ghara iji 'daba ala,' nke na-adịghị egosi ịdina ala maka nri nke ọma, ma ka ọ nọgide na-akọwa ntụgharị kpọmkwem nke κατακλίνω.
