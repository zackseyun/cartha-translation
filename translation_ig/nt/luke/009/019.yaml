revisions:
- from: Ha zara, sị, “Jọn Onye Na-eme Baptizim”; ndị ọzọ sị, “Ịlaịja”; ndị ọzọkwa sị na otu onye n’ime ndị amụma oge ochie ebilitela.[a]
  to: 'Ha zara, sị: “Jọn Onye Na-eme Baptizim; ndị ọzọ na-ekwu na ọ bụ Ịlaịja; ndị ọzọkwa na-ekwu na otu n’ime ndị amụma oge ochie ebilitela.”[a]'
  rationale: The revision improves Igbo punctuation and list syntax without changing the source’s threefold report. It preserves the ambiguity of ἀνέστη and retains the reference to a prophet from ancient times. The footnote is recast as a genuine idiomatic lexical alternative and remains anchored to the final clause.
  reviewer_model: gpt-5.6-terra
