  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: ig
  text: 'Ha zara, sị: “Jọn Onye Na-eme Baptizim; ndị ọzọ na-ekwu na ọ bụ Ịlaịja; ndị ọzọkwa na-ekwu na otu n’ime ndị amụma oge ochie ebilitela.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu onye amụma site n’oge gboo ebilitela.” Okwu Grik ahụ nwekwara ike ịghọta n’ụzọ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: Ha zara, sị
  rationale: Nke a na-egosipụta ma ‘ịza’ ma ‘ikwu’ dị n’usoro Grik ahụ, ma na-anọgidekwa bụrụ okwu Igbo na-aga were were.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Jọn Onye Na-eme Baptizim
  rationale: Aha a na-akọwa Jọn site n’ọrụ e ji mara ya, dịka βαπτιστής si mee, n’asụsụ Igbo doro anya.
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: ndị ọzọ sị ... ndị ọzọkwa sị
  rationale: Ntughari a na-edobe usoro ugboro abụọ nke ndị ọzọ na echiche dị iche iche ha kwuru, ma mee ka ndepụta ahụ bụrụ Igbo ebumpụta ụwa.
- source_word: Ἠλίαν
  choice: Ịlaịja
  rationale: Nke a bụ ụdị aha onye amụma ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: ὅτι
  choice: sị na
  rationale: Ọ na-ewebata ihe ìgwè nke atọ kwuru n'ụzọ Igbo doro anya.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: otu onye n’ime ndị amụma oge ochie
  rationale: Nke a na-edobe njirimara na-edochaghị anya nke τις ma na-egosi n’Igbo ebumpụta ụwa na a na-ekwu maka otu onye n’etiti ndị amụma nke oge gara aga.
- source_word: ἀνέστη
  choice: ebilitela
  rationale: ‘Ebilitela’ na-edobe echiche nke ibili ma ọ bụ ịpụta ọzọ, gụnyere ụda nwere ike izo aka n’mbilite n’ọnwụ, n’ebughị ụzọ kọwaa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ma a ga-akọwa ἀνέστη hoo haa dịka mbilite n’ọnwụ
  choice: ebilitela
  alternative: esiwo n’ọnwụ bilie; apụtala ọzọ
  rationale: '‘Ebilitela’ na-echekwa mgbagwoju echiche nke okwu ahụ: ọ pụrụ ịpụta ibili ma nwee ụda mbilite n’ọnwụ, ma ọ naghị amanye nkọwa ahụ n’amaokwu ahụ.'
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro azịza atọ ahụ na ọdịiche dị n’etiti ha, ma zere okwu ga-amanye nkọwa banyere mbilite n’ọnwụ.
