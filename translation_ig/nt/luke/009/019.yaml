    reason: lexical_alternative
  revision_rationale: The revision improves Igbo punctuation and list syntax without changing the source’s threefold report. It preserves the ambiguity of ἀνέστη and retains the reference to a prophet from ancient times. The footnote is recast as a genuine idiomatic lexical alternative and remains anchored to the final clause.
