source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: ig
  text: Ma Jizọs zara sị, “Ọgbọ na-ekweghị ekwe na nke gbagọrọ agbagọ! Ruo ole mgbe ka m ga-anọnyere unu ma nagide unu? Kpọta nwa gị ebe a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ
  choice: ọgbọ
  rationale: Ọ na-ezo aka n'ìgwè mmadụ nke oge ahụ, ma na-edowe ike nke okwu Grik ahụ n'ekwughị kpọmkwem ndị Juu ma ọ bụ ndị na-eso ụzọ naanị.
- source_word: ἄπιστος
  choice: na-ekweghị ekwe
  rationale: Nke a na-egosipụta enweghị okwukwe ma ọ bụ ntụkwasị obi, dịka okwu Grik ahụ siri dị.
- source_word: διεστραμμένη
  choice: ndị gbagọrọ agbagọ
  rationale: Ọ na-edowe ihe atụ nke ihe e mere ka ọ gbagọọ, nke n'ebe a na-akọwa omume na echiche rụrụ arụ, n'agbanyeghị na ọ bụghị naanị okwu gbasara omume mmekọahụ.
- source_word: ἀνέξομαι
  choice: na-anagide
  rationale: Ọ na-egosi idi mmadụ ma ọ bụ iburu omume ya n'obi ruo oge ụfọdụ.
- source_word: προσάγαγε ὧδε
  choice: Kpọta ... ebe a
  rationale: Nsụgharị a bụ iwu doro anya ma bụrụkwa ụzọ Igbo nkịtị si kwuo ka e mee ka mmadụ bịaruo onye na-ekwu okwu nso.
theological_decisions:
- issue: Ndị okwu ịba mba ahụ na-emetụta
  choice: Ejighị nkọwa mee ka “ọgbọ” bụrụ naanị ndị na-eso ụzọ, naanị nna nwa ahụ, ma ọ bụ naanị ìgwè mmadụ ahụ.
  alternative: Ịkpọ otu ìgwè kpọmkwem dị ka ndị na-eso ụzọ ma ọ bụ ndị Juu.
  rationale: Okwu Grik γενεὰ sara mbara, ebe amaokwu ahụ n'onwe ya anaghị ekpebi otu ìgwè naanị; nke a na-echekwa nghọtahie ziri ezi dị na isi mmalite.
- issue: Ụdị enweghị okwukwe
  choice: “na-ekweghị ekwe”
  alternative: “ndị na-enweghị ntụkwasị obi”
  rationale: Nhọrọ ahụ na-edowe isi echiche nke ἄπιστος n'ọnọdụ a n'ebughị nkọwa ụka pụrụ iche banye na ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Akara mkpu na-enyere aka igosipụta ike nke Ὦ na ịba mba ahụ, ebe ajụjụ na iwu ikpeazụ na-anọgide n'ụdị okwu Jizọs kwuru.
