revisions:
- from: Ma ndị niile na-anabataghị unu[a], mgbe unu na-apụ n’obodo ahụ[b], kụpụnụ uzuzu dị n’ụkwụ unu ka ọ bụrụ ihe akaebe megide ha.
  to: Ma ndị ọ bụla na-adịghị anabata unu[a], mgbe unu na-apụ n’obodo ahụ[b], kụpụnụ uzuzu dị n’ụkwụ unu ka ọ bụrụ ihe akaebe megide ha.
  rationale: The revision changes only “ndị niile” to “ndị ọ bụla” in order to retain the indefinite, generalizing sense of ὅσοι ἂν. It also makes the second footnote's lexical referent explicit and supplies the stated alternative. The symbolic action remains a witness against the rejecters, without adding a claim about final judgment.
