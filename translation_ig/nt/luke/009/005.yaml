id: LUK.9.5
reference: Luke 9:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: ig
  text: Ma ndị ọ bụla na-adịghị anabata unu[a], mgbe unu na-apụ n’obodo ahụ[b], kụpụnụ uzuzu dị n’ụkwụ unu ka ọ bụrụ ihe akaebe megide ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ọ bụla na-adịghị ele unu ọbịa.” Ngwaa Grik ahụ nwere ike ịgụnye ma ịnabata ndị ozi ahụ ma ile ha ọbịa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “obodo ukwu ahụ.” Okwu Grik πόλις nwere ike ịpụta obodo nta ma ọ bụ obodo ukwu, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται
  choice: ndị niile na-anabataghị
  rationale: “Ndị niile” na-egosipụta echiche izugbe nke ὅσοι ἂν, ebe “na-anabataghị” na-eburu ma ịnabata ndị ozi ma ile ha ọbịa.
- source_word: ὑμᾶς
  choice: unu
  rationale: “Unu” bụ nnọchiaha onye nke abụọ ọtụtụ, na-ezo aka n’ebe ndị na-eso ụzọ ahụ nọ.
- source_word: ἐξερχόμενοι
  choice: mgbe unu na-apụ
  rationale: Nke a na-egosipụta na ịpụ ha na omume e nyere n’iwu na-eme n’otu oge, ma na-ada nke ọma n’Igbo.
- source_word: ἀπὸ τῆς πόλεως ἐκείνης
  choice: n’obodo ahụ
  rationale: “Obodo” nwere ike ịpụta ebe obibi nke nta ma ọ bụ nke ukwu, ya mere ọ na-echekwa obosara ihe πόλις pụrụ ịpụta; “ahụ” na-anọchi ἐκείνης.
- source_word: τὸν κονιορτὸν
  choice: uzuzu
  rationale: “Uzuzu” bụ okwu Igbo doro anya maka ntụ ntụ dị mfe nke na-arapara n’ụkwụ ma ọ bụ na-efe efe n’ala.
- source_word: ἀπὸ τῶν ποδῶν ὑμῶν
  choice: dị n’ụkwụ unu
  rationale: Nke a na-egosi ebe uzuzu ahụ dị tupu a kụpụ ya, ma bụrụkwa okwu Igbo dị nfe nghọta.
- source_word: ἀποτινάσσετε
  choice: kụpụnụ
  rationale: “Kụpụnụ” na-egosipụta iwu ka ha maa ụkwụ ha ma wepụ uzuzu ahụ, na-echekwa onyonyo nke omume ahụ.
- source_word: εἰς μαρτύριον
  choice: ka ọ bụrụ ihe akaebe
  rationale: 'Nkebiokwu a na-egosipụta nzube ma ọ bụ ihe omume ahụ ga-arụ: ọ ga-abụ ihe akaebe.'
- source_word: ἐπ’ αὐτούς
  choice: megide ha
  rationale: N’ọnọdụ a, “megide ha” na-echekwa ike ịdọ aka ná ntị na ikpe dị n’ọrụ ihe akaebe ahụ, kama ime ya ka ọ bụrụ naanị ihe ịrịba ama na-enweghị akụkụ ikpe.
theological_decisions:
- issue: Ike omume ịkụpụ uzuzu n’ụkwụ nwere dị ka ihe nnọchianya
  choice: A sụgharịrị ya dị ka ihe akaebe megide ndị jụrụ ndị ozi ahụ.
  alternative: Ihe ịrịba ama nkịtị nye ha, ma ọ bụ nkwupụta doro anya na ikpe ikpeazụ adakwasịla ha.
  rationale: εἰς μαρτύριον ἐπ’ αὐτούς nwere ike ịdọ aka ná ntị na nke ikpe, ma amaokwu ahụ akọwaghị ya dị ka nkwupụta ikpe ikpeazụ. Nsụgharị ahụ na-echekwa esemokwu a n’ebughị ihe ọzọ bata.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Unu” na “kụpụnụ” na-egosipụta ọtụtụ mmadụ. “Obodo” na-echekwa obosara πόλις n’enweghị ịmanye ma obodo nta ma obodo ukwu.
