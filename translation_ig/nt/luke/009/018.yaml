id: LUK.9.18
reference: Luke 9:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: ig
  text: O wee bụrụ na mgbe ọ na-ekpe ekpere naanị ya[a], ndị na-eso ụzọ ya nọnyere ya. Ọ jụrụ ha, sị, “Ònye ka ìgwè mmadụ na-ekwu na m bụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na nzuzo” ma ọ bụ “n’ebe dịpụrụ adịpụ.” Okwu Grik a pụrụ igosi ịnọ iche, ọ bụghị na ọ dịghị onye ọ bụla nọ ya nso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Ọ bụ usoro Luk ji akwalite akụkọ gaa n’ihu; nsụgharị a bụ Igbo dị ugbu a ma ka na-egosi ọrụ ya dị ka njikọ akụkọ.
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: mgbe ọ ... na-ekpe ekpere
  rationale: Usoro infinitive nke nwere ἐν na-egosi ihe na-eme n’otu oge; ‘mgbe ọ ... na-ekpe ekpere’ na-enye echiche ahụ n’Igbo nkịtị.
- source_word: κατὰ μόνας
  choice: naanị ya
  rationale: Nkebiokwu ahụ nwere ike ịpụta ịnọ naanị mmadụ ma ọ bụ ịnọ n’ebe zoro ezo; ‘naanị ya’ na-edobe isi echiche ahụ, ebe nkọwa ala peeji na-egosi ụzọ ọzọ.
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: ndị na-eso ụzọ ya nọnyere ya
  rationale: ‘Nọnyere ya’ na-edobe mmekọrịta dị mfe nke okwu Grik ahụ n’emeghị ka a kọwaa ma ha nọ nso ma ọ bụ sonyere ya n’ekpere.
- source_word: ἐπηρώτησεν αὐτοὺς λέγων
  choice: Ọ jụrụ ha, sị
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke kwesịrị nsọpụrụ si webata ajụjụ, ma na-ebunye ma ngwaa ajụjụ ma participle λέγων.
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: Ìgwè mmadụ na-ekwu na m bụ onye?
  rationale: Nhazi a bụ ajụjụ Igbo ebumpụta ụwa ma na-edobe ‘ìgwè mmadụ’ dị ka isiokwu na njirimara Jizọs dị ka ihe a na-ajụ.
- source_word: οἱ ὄχλοι
  choice: ìgwè mmadụ
  rationale: Ọ na-egosi ọtụtụ mmadụ ma ọ bụ igwe mmadụ, ọ bụghị naanị okwu sara mbara bụ́ ‘ndị mmadụ.’
theological_decisions:
- issue: Esemokwu a na-ahụ anya n’etiti Jizọs ịnọ ‘naanị ya’ na ndị na-eso ụzọ ya ịnọnyere ya
  choice: 'E debere nkebiokwu abụọ ahụ n’ụzọ kwụ ọtọ: ọ nọ naanị ya na-ekpe ekpere, ndị na-eso ụzọ ya nọnyekwa ya.'
  alternative: Ịsụgharị κατὰ μόνας naanị dị ka ‘na nzuzo’ ma ọ bụ ịgbakwunye na ndị na-eso ụzọ nọ nso iji dozie esemokwu ahụ.
  rationale: Grik ahụ na-ahapụ nghọta siri ike ma ọ bụ ọnọdụ nke ịnọ iche n’ekpere n’agbanyeghị ọnụnọ ndị na-eso ụzọ. Nsụgharị ahụ anaghị etinye nkọwa na-adịghị n’ederede iji dozie ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ùgwù. ‘O wee ruo na’ na-echekwa ụda akụkọ Luk n’enweghị asụsụ ochie gabiga ókè; e debere ajụjụ ahụ n’usoro Igbo ebumpụta ụwa.
