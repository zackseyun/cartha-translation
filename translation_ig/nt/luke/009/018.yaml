- from: O wee ruo na mgbe ọ nọ naanị ya[a] na-ekpe ekpere, ndị na-eso ụzọ ya nọnyere ya. Ọ jụrụ ha, sị, “Ìgwè mmadụ na-ekwu na m bụ onye?”
  to: O wee bụrụ na mgbe ọ na-ekpe ekpere naanị ya[a], ndị na-eso ụzọ ya nọnyere ya. Ọ jụrụ ha, sị, “Ònye ka ìgwè mmadụ na-ekwu na m bụ?”
  rationale: 'The revision replaces an unidiomatic narrative formula, improves the natural Igbo question structure, and refines the lexical footnote. It retains the source’s ambiguity: Jesus is described as praying alone/privately while the disciples are also said to be with him; no harmonizing explanation has been added.'
