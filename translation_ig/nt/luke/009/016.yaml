revisions:
- from: Mgbe ahụ, o weere ogbe achịcha ise ahụ na azụ abụọ ahụ, welie anya ya lee eluigwe, gọzie ha[a], nyawaa ha, na-enyezikwa ndị na-eso ụzọ ya ka ha dobe ha n'ihu ìgwè mmadụ ahụ.
  to: Mgbe ahụ, o weere ogbe achịcha ise ahụ na azụ abụọ ahụ, leliri anya elu n’eluigwe, gọzie ha[a], nyawaa ha, ma nọgide na-enye ndị na-eso ụzọ ya ka ha dobe ha n’ihu ìgwè mmadụ ahụ.
  rationale: The revision removes an unsupported additive nuance, represents the imperfect ἐδίδου as ongoing giving, and refines the lexical footnote so that Luke’s wording remains primary while acknowledging the traditional alternative without harmonizing the accounts.
