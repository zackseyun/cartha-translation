id: LUK.9.16
reference: Luke 9:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: ig
  text: Mgbe ahụ, o weere ogbe achịcha ise ahụ na azụ abụọ ahụ, leliri anya elu n’eluigwe, gọzie ha[a], nyawaa ha, ma nọgide na-enye ndị na-eso ụzọ ya ka ha dobe ha n’ihu ìgwè mmadụ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ nsụgharị sụgharịara ya, “o keleere Chineke maka ha.” Ma ngwaa Grik e ji mee ihe n’ebe a pụtara “gọzie”; ụfọdụ akụkọ ndị yiri nke a ji okwu pụtara “inye ekele.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: o weere
  rationale: Aorist participle ahụ na-egosi omume mere tupu ngwaa ndị bụ isi; Igbo nkịtị na-eji usoro ngwaa a akọwa ya nke ọma.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: Ọ na-egosi nzọụkwụ ọzọ n'akụkọ ahụ n'ụzọ dị nro.
- source_word: ἄρτους
  choice: ogbe achịcha
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'ogbe achịcha ndị a pụrụ ịgụ ọnụ, ọ bụghị achịcha n'ozuzu ya.
- source_word: ἰχθύας
  choice: azụ
  rationale: N'Igbo, ‘azụ’ nwere ike ịbụ otu ma ọ bụ ọtụtụ dịka ọnụọgụ so ya si gosi.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: welie anya ya lee eluigwe
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ si kwuo na o leliri anya elu n'ebe eluigwe dị.
- source_word: οὐρανὸν
  choice: eluigwe
  rationale: N'ọnọdụ ekpere na ngọzi a, ‘eluigwe’ na-egosipụta ihe okwu ahụ pụtara karịa ‘mbara igwe.’
- source_word: εὐλόγησεν αὐτοὺς
  choice: gọzie ha
  rationale: Nke a na-agbaso ngwaa Grik nke pụtara ‘gọzie’ na nnọchiaha ọtụtụ nke na-ezo aka n'ogbe achịcha na azụ ahụ.
- source_word: κατέκλασεν
  choice: nyawaa ha
  rationale: ‘Nyawaa’ na-egosi ịgbaji ma kewaa nri ahụ maka ikesa ya; ‘ha’ na-eme ka ihe a na-ekwu maka ya doo anya.
- source_word: ἐδίδου
  choice: na-enyezikwa
  rationale: Ụdị imperfect Grik na-egosi omume nke gara n'ihu ma ọ bụ e mere ugboro ugboro; ọdịdị ‘na-enye’ na-echekwa nke a.
- source_word: μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-aghọta ngwa ngwa maka ndị na-amụ ma na-eso Jizọs; ‘ya’ na-eme ka onye ha na-eso doo anya n'okwu Igbo.
- source_word: παραθεῖναι
  choice: ka ha dobe ha n'ihu
  rationale: Nke a na-echekwa nzube infinitive ahụ nakwa echiche nkịtị nke idobe nri n'ihu ndị mmadụ, kama ịsụgharị ya naanị dịka ‘ijere ozi.’
- source_word: ὄχλῳ
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ okwu Igbo nkịtị maka ọtụtụ mmadụ gbakọtara n'otu ebe, ma ọ dabara n'ọnọdụ a.
theological_decisions:
- issue: Ihe οὐρανός pụtara n'ọnọdụ ekpere
  choice: eluigwe
  alternative: mbara igwe
  rationale: Ileli anya elu so ngọzi a na-egosi ntụgharị uche n'ebe Chineke nọ; ‘eluigwe’ na-echekwa akụkụ nsọ nke okwu ahụ n'etinyeghị ozizi ọzọ.
- issue: Nsụgharị εὐλόγησεν
  choice: gọzie ha
  alternative: keleere Chineke maka ha
  rationale: Ngwaa Grik e ji mee ihe bụ ‘gọzie,’ ọ bụghị ngwaa a na-ejikarị ekwu ‘inye ekele.’ Nsụgharị a na-echekwa okwu Luk họọrọ ma ghara ime ka ya na akụkọ ndị yiri ya bụrụ otu n'amaghị ama.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ngwaa na-aga were were—‘weere,’ ‘welie,’ ‘gọzie,’ ‘nyawaa,’ ‘na-enyezikwa’—na-eme ka akụkọ ahụ bụrụ nke okike n'Igbo ma chekwaa omume na-aga n'ihu nke ἐδίδου.
