- from: Ma mgbe ìgwè mmadụ ahụ matara nke a, ha sooro ya. Ọ nabatara ha nke ọma, na-agwa ha okwu banyere alaeze Chineke, na-agwọkwa ndị chọrọ ọgwụgwọ[a].
  to: Ma mgbe ìgwè mmadụ ahụ matara nke a, ha sooro ya. Ọ nabatara ha nke ọma, na-agwa ha okwu banyere alaeze Chineke, na-agwọkwa ndị chọrọ ka a gwọọ ha[a].
  rationale: The revision changes only the final expression to distinguish need from mere desire while preserving the Greek sense and the ongoing healing action. The footnote anchor and lexical alternative remain appropriately attached to θεραπείας.
  reviewer_model: gpt-5.6-terra
