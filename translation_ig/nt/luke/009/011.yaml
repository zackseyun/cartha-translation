    text: Ma ọ bụ, “ndị chọrọ nlekọta.” Okwu Grik θεραπεία pụrụ ịpụta “ọgwụgwọ” ma ọ bụ “nlekọta.”
    reason: lexical_alternative
  revision_rationale: The revision changes only the final expression to distinguish need from mere desire while preserving the Greek sense and the ongoing healing action. The footnote anchor and lexical alternative remain appropriately attached to θεραπείας.
