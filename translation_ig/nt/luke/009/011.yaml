source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: ig
  text: Ma mgbe ìgwè mmadụ ahụ matara nke a, ha sooro ya. Ọ nabatara ha nke ọma, na-agwa ha okwu banyere alaeze Chineke, na-agwọkwa ndị chọrọ ka a gwọọ ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị chọrọ nlekọta.” Okwu Grik θεραπεία pụrụ ịpụta “ọgwụgwọ” ma ọ bụ “nlekọta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Ma ... ìgwè mmadụ ahụ
  rationale: “Ma” na-egosi ntughari dị nro nke δέ; “ìgwè mmadụ” bụ ụzọ Igbo si ekwu ọtụtụ mmadụ gbakọrọ ọnụ n'ụzọ sitere n'okike, ọ bụ ezie na ὄχλοι dị n'ụdị ọtụtụ.
- source_word: γνόντες
  choice: mgbe ... matara nke a
  rationale: Nkebiokwu oge a na-egosipụta aorist participle ahụ n'Igbo doro anya, ma hapụ ihe ha matara ka ọ dabere n'ihe a kọrọ n'amaokwu ndị bu ụzọ.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ha sooro ya
  rationale: Nke a bụ okwu Igbo nkịtị maka iso mmadụ gaa, ma ọ naghị emesi echiche ịbụ ndị na-eso ụzọ ike karịa ihe Grik kwuru.
- source_word: ἀποδεξάμενος αὐτούς
  choice: Ọ nabatara ha nke ọma
  rationale: “Nabatara ... nke ọma” na-egosipụta nnabata obiọma dị na ἀποδέχομαι karịa nanị ịkpọbata mmadụ.
- source_word: ἐλάλει αὐτοῖς
  choice: na-agwa ha okwu
  rationale: Ụdị “na-” na-egosipụta omume gara n'ihu nke imperfect ἐλάλει.
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: banyere alaeze Chineke
  rationale: Nke a na-edobe okwu Baịbụl a maara nke ọma ma na-egosipụta βασιλεία τοῦ θεοῦ n'ụzọ doro anya.
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: ndị chọrọ ọgwụgwọ[a]
  rationale: “Ndị chọrọ ọgwụgwọ” bụ Igbo sitere n'okike maka ndị nwere mkpa θεραπεία; ihe odide ala peeji na-edobe ohere na okwu ahụ nwekwara ike ịpụta nlekọta.
- source_word: ἰᾶτο
  choice: na-agwọkwa
  rationale: Ụdị omume na-aga n'ihu na-egosipụta imperfect ἰᾶτο, ebe “-kwa” jikọtara ya na ọrụ ikwu okwu ahụ.
theological_decisions:
- issue: Nsụgharị βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  alternative: ọchịchị Chineke
  rationale: “Alaeze Chineke” bụ okwu Baịbụl Igbo a maara nke ọma ma na-edobe njikọ ya na ojiji Oziọma; “ọchịchị Chineke” pụrụ ime ka akụkụ nke ịchị achị pụta ìhè, ma ọ ga-emechi ntakịrị ohere nghọta dị n'okwu βασιλεία.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ùgwù. E jiri usoro “na-” chekwaa omume ndị gara n'ihu, a zerekwa okwu ụka nke otu nzukọ pụrụ iche.
