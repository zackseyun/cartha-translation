id: LUK.9.42
reference: Luke 9:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: ig
  text: Ma mgbe ọ ka na-abịaru nso, mmụọ ọjọọ ahụ tụdara ya n’ala, mee ka ahụ ya maa jijiji nke ukwuu. Ma Jizọs baara mmụọ ahụ na-adịghị ọcha mba, gwọọ nwata nwoke ahụ, nyeghachiri ya nna ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “weghachiri ya nye nna ya.”
    reason: ἀποδίδωμι nwere ike ịpụta ‘inyeghachi’ ma ọ bụ ‘iweghachi.’ Ihe abụọ ahụ na-egosi na Jizọs nyefere nwata ahụ, onye a gwọrọla, azụ n’aka nna ya.
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: Ma mgbe ọ ka na-abịaru nso
  rationale: E ji ‘ka na-’ gosipụta omume na-aga n’ihu nke ἔτι na present participle, ebe ‘Ma’ na-egosipụta mgbanwe dị nro nke δέ n’akụkọ ahụ. ‘Ịbịaru nso’ echekwala ngagharị ahụ n’akọwaghị karịa ihe Grik kwuru.
- source_word: ἔρρηξεν αὐτὸν
  choice: tụdara ya n’ala
  rationale: N’ebe a ῥήγνυμι na-egosi iji ike tụda mmadụ; okwu a bụ Igbo nkịtị, doo anya, ma kwekọọ n’ọnọdụ ahụ.
- source_word: τὸ δαιμόνιον
  choice: mmụọ ọjọọ ahụ
  rationale: N’Igbo nkịtị, ‘mmụọ ọjọọ’ na-ekwupụta onye mmụọ ọjọọ nke ederede Grik gosiri, n’enweghị ime ka ọ bụrụ naanị ọrịa ma ọ bụ ike na-enweghị onye.
- source_word: συνεσπάραξεν
  choice: mee ka ahụ ya maa jijiji nke ukwuu
  rationale: Ngwaa ahụ na-egosi ịma jijiji ma ọ bụ ịtụgharị ahụ n’ike. Nsụgharị a bụ nke ndị na-agụ Igbo taa ga-aghọta nke ọma, na-enweghị itinye nkọwa ahụike na-adịghị n’ederede.
- source_word: ἐπετίμησεν
  choice: baara ... mba
  rationale: ‘Ịbara mba’ na-egosipụta okwu ikike siri ike Jizọs kwuru megide mmụọ ahụ, bụkwa ụzọ Igbo sitere n’okike si kwuo rebuke.
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: mmụọ ahụ na-adịghị ọcha
  rationale: Nke a na-echekwa kpọmkwem echiche ἀκάθαρτος nke adịghị ọcha, ma na-ejikọta mmụọ ahụ na ‘mmụọ ọjọọ’ e kwuru na mbụ.
- source_word: ἰάσατο
  choice: gwọọ
  rationale: ‘Ịgwọ’ bụ okwu Igbo doro anya maka ἰάομαι n’akụkọ ọgwụgwọ, ma na-echekwa akụkụ ọgwụgwọ nke ihe Jizọs mere.
- source_word: τὸν παῖδα
  choice: nwata nwoke ahụ
  rationale: παῖς nwere ọtụtụ nghọta; ebe a, ọnọdụ ahụ na-egosi nwata nwoke. Nhọrọ a kpọmkwem ma ọ naghị etinye okwu ‘nwa ya nwoke’ n’ebe Grik kwuru naanị παῖς.
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: nyeghachikwa ya nna ya
  rationale: ‘Inyeghachi’ na-ejide echiche nke iweghachi mmadụ nye onye o si n’aka ya bịa, ma bụrụkwa okwu Igbo sitere n’okike n’ọnọdụ a.
theological_decisions:
- issue: Asụsụ e ji kọwaa mmekpa ahụ nke mmụọ ọjọọ
  choice: A sụgharịrị δαιμόνιον na πνεῦμα ἀκάθαρτον dị ka ‘mmụọ ọjọọ’ na ‘mmụọ na-adịghị ọcha,’ bụ okwu na-egosi onye mmụọ.
  alternative: Ịsụgharị ha dị ka naanị ‘ike ọjọọ’ ma ọ bụ ọnọdụ uche/ahụike.
  rationale: Ederede Grik na-egosi onye mmụọ nke mere ihe ma Jizọs baara ya mba. N’otu oge ahụ, okwu ἰάσατο na-ekwu na Jizọs gwọrọ nwata ahụ; ya mere, nsụgharị ahụ na-echekwa ma nchụpụ mmụọ ma ọgwụgwọ, n’ejikọtaghị otu n’ime ha n’ime ibe ya.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E tinyere akara nkọwa ụkwụ [a] ozugbo n’akụkụ okwu ọ na-akọwa, n’ihi na nkọwa ahụ metụtara ἀπέδωκεν, ọ bụghị προσερχομένου.
