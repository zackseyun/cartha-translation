  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: ig
  text: Otu olu si n'ígwé ojii ahụ[a] pụta, na-asị, “Onye a bụ Ọkpara m, Onye A Họpụtara; geenụ ya ntị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka na-agụ, “Ọkpara m, Onye m hụrụ n’anya,” kama “Ọkpara m, Onye A Họpụtara.”
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: Otu olu ... pụta
  rationale: Nke a na-egosipụta na a nụrụ olu ahụ n'oge ahụ n'Igbo dị mfe, kama ịsụgharị akpaalaokwu Grik ahụ n'ụzọ siri ike dịka ‘olu bịara dịrị.’
- source_word: ἐκ τῆς νεφέλης
  choice: si n'ígwé ojii ahụ ... pụta
  rationale: ‘Si ... pụta’ na-egosipụta isi mmalite olu ahụ nke ọma; ‘igwé ojii ahụ’ na-ezo aka n'ígwé ojii a kpọtụrụla n'akụkọ ahụ.
- source_word: λέγουσα
  choice: na-asị
  rationale: Ọ na-ewebata okwu olu ahụ kwuru n'ụzọ nkịtị na nke na-aga were were n'akụkọ Igbo.
- source_word: Οὗτός ἐστιν
  choice: Onye a bụ
  rationale: N'ihi na ihe a na-atụ aka na ya bụ mmadụ, ‘Onye a bụ’ bụ Igbo nkịtị nke na-echekwa ike ngosipụta na njirimara nke okwu Grik ahụ.
- source_word: ὁ υἱός μου
  choice: Ọkpara m
  rationale: ‘Ọkpara m’ bụ aha nsọpụrụ Kraịst a maara nke ọma n'Igbo ma na-egosipụta mmekọrịta Nna na Ọkpara n'okwu a.
- source_word: ὁ ἐκλελεγμένος
  choice: Onye ahụ a họọrọ
  rationale: Perfect passive participle nke ἐκλέγομαι pụtara onye a họọrọ. ‘Onye ahụ a họọrọ’ na-echekwa passive na njirimara aha ahụ, na-etinyeghị ‘m’ nke ugboro abụọ na-adịghị n'okwu Grik.
- source_word: αὐτοῦ ἀκούετε
  choice: geenụ ya ntị
  rationale: Nke a bụ iwu e nyere ọtụtụ mmadụ ka ha ṅaa ntị ma rubere okwu ya isi; ọ karịrị nanị ịnụ ụda.
theological_decisions:
- issue: Ụdị okwu dị iche iche na-akọwa Ọkpara n'olu sitere n'igwé ojii
  choice: A sụgharịrị ἐκλελεγμένος dịka ‘Onye ahụ a họọrọ.’
  alternative: Ụfọdụ akwụkwọ aka nwere ἀγαπητός, nke a pụrụ ịsụgharị ‘Ọkpara m m hụrụ n'anya.’
  rationale: Ederede SBLGNT enyere nwere ἐκλελεγμένος, ya mere isi ederede na-echekwa okwu Luk a kama ime ka ọ yie okwu a maara nke ọma n'akụkọ ndị ọzọ. Ihe odide ọzọ dị na nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma doo ndị nkịtị anya. E ji ‘igwé ojii’ mee ihe maka νεφέλη, ‘geenụ ya ntị’ wee nye iwu ahụ ike ige ntị na irube isi. Akara nkọwa [a] dị n'isi ederede.
