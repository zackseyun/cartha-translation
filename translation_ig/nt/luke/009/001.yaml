id: LUK.9.1
reference: Luke 9:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: ig
  text: Ọ kpọkọtara mmadụ iri na abụọ ahụ[a], wee nye ha ike na ikike ịchị mmụọ ọjọọ niile[b] na ịgwọ ọrịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ọ kpọkọtara mmadụ iri na abụọ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mmụọ ọjọọ ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: Mgbe ọ kpọkọtara
  rationale: Nkebi a bụ aorist middle participle nke na-akọ ihe mere tupu ngwaa bụ isi. “Mgbe ọ kpọkọtara” bụ Igbo doro anya ma na-egosipụta συν- dị ka ịkpọkọta ha n’otu ebe.
- source_word: δὲ
  choice: (a hapụrụ ya n’enweghị okwu njikọ pụrụ iche)
  rationale: δὲ bụ njikọ akụkọ dị nro n’ebe a. N’Igbo, ịmalite ahịrịokwu na “Mgbe” na-eme ka akụkọ gaa n’ihu nke ọma n’etinyeghị echiche mmegide na-adịghị na Greek.
- source_word: τοὺς δώδεκα
  choice: mmadụ iri na abụọ ahụ
  rationale: Greek kwuru naanị “ndị iri na abụọ ahụ,” ọ kpọghị ha ndị na-eso ụzọ ma ọ bụ ndịozi. “Mmadụ iri na abụọ ahụ” na-eme ka Igbo bụrụ nke eke ma ghara itinye aha ọzọ na-adịghị n’isi mmalite.
- source_word: ἔδωκεν
  choice: o nyere ha
  rationale: Nke a bụ nsụgharị kwụ ọtọ ma dị mfe nke δίδωμι, ma nnọchiaha na-egosi na Jizọs bụ onye mere ihe ahụ dịka ihe gbara amaokwu a gburugburu si dị.
- source_word: δύναμιν
  choice: ike
  rationale: “Ike” na-egosi ikike ime ihe ma ọ bụ ume dị irè, nke dabara n’ọrụ pụrụ iche a na-enye ha.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” na-egosi ikike e nyere mmadụ ma ọ bụ ikike iwu o nwere. Nke a na-edobe ọdịiche dị n’etiti δύναμις na ἐξουσία.
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: ịchị ndị mmụọ ọjọọ niile
  rationale: ἐπί tinyere accusative na-egosi ịbụ onye nwere ikike n’elu ha. “Ịchị” na-egosipụta ọchịchị ahụ n’Igbo eke, ebe “ndị mmụọ ọjọọ niile” na-anọchi plural Greek.
- source_word: δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka demons; a gbanweghị ya ka ọ bụrụ “mmụọ na-adịghị ọcha,” n’ihi na nke ahụ abụghị okwu Greek e ji mee ihe n’ebe a.
- source_word: νόσους
  choice: ọrịa
  rationale: “Ọrịa” bụ okwu Igbo sara mbara ma dị eke maka ụdị ọrịa dị iche iche; Igbo anaghị achọ plural morphology n’ebe a.
- source_word: θεραπεύειν
  choice: ịgwọ
  rationale: Infinitive a na-egosi ọrụ ha ga-enwe ike ime. “Ịgwọ ọrịa” bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ya.
theological_decisions:
- issue: Ọdịiche dị n’etiti δύναμις na ἐξουσία
  choice: “ike na ikike”
  alternative: iji otu okwu sụgharịa ha abụọ
  rationale: 'E debe okwu abụọ ahụ iche: nke mbụ na-egosi ike ime ihe, nke abụọ egosikwa ikike e nyere mmadụ ime ya. Nke a na-ezere ime ka echiche abụọ dị n’isi mmalite ghọọ otu.'
- issue: Ndị a kpọrọ τοὺς δώδεκα
  choice: “mmadụ iri na abụọ ahụ” n’etinyeghị “ndị na-eso ụzọ” ma ọ bụ “ndịozi”
  alternative: “ndị na-eso ụzọ iri na abụọ ahụ” ma ọ bụ “ndịozi iri na abụọ ahụ”
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-eme ka a mata ndị ha bụ, Greek n’onwe ya kpọrọ ha naanị “ndị iri na abụọ ahụ.” Nsụgharị ahụ anaghị etinye aha ọrụ na-adịghị n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-asọpụta n’usoro Igbo eke, ma ọ na-edobe okwu abụọ dị iche—“ike” na “ikike”—yana enweghị mgbakwunye “ndị na-eso ụzọ” ma ọ bụ “ndịozi.”
