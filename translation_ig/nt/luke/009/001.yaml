    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mmụọ ọjọọ ọ bụla.”
    reason: lexical_alternative
  revision_rationale: The revision represents the participial opening as an antecedent action without making ‘when’ the sole reading in the main text. It retains the source’s distinction between power and authority, the unexpanded reference to the Twelve, and the scope of authority over demons alongside healing diseases. Footnote a is corrected to provide a genuine temporal alternative.
