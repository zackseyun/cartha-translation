revisions:
- from: Mgbe ọ kpọkọtara mmadụ iri na abụọ ahụ[a], o nyere ha ike na ikike ịchị ndị mmụọ ọjọọ niile[b] na ịgwọ ọrịa.
  to: Ọ kpọkọtara mmadụ iri na abụọ ahụ[a], wee nye ha ike na ikike ịchị mmụọ ọjọọ niile[b] na ịgwọ ọrịa.
  rationale: The revision represents the participial opening as an antecedent action without making ‘when’ the sole reading in the main text. It retains the source’s distinction between power and authority, the unexpanded reference to the Twelve, and the scope of authority over demons alongside healing diseases. Footnote a is corrected to provide a genuine temporal alternative.
