  source_fidelity: '«Ma ọ baara ha mba ma nye ha iwu ka ha ghara ịgwa onye ọ bụla ihe a» faithfully represents the Greek sequence and force: ἐπιτιμήσας is conveyed by «baara ha mba», παρήγγειλεν by «nye ha iwu», and the prohibition μηδενὶ λέγειν τοῦτο by «ka ha ghara ịgwa onye ọ bụla ihe a». The participial relationship is expressed naturally through coordinated finite verbs without loss of meaning.'
