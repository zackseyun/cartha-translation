  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: ig
  text: Ma ọ baara ha mba ma nye ha iwu ka ha ghara ịgwa onye ọ bụla ihe a,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma ọ dọrọ ha aka ná ntị siri ike ma nye ha iwu ka ha ghara ịgwa onye ọ bụla ihe a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: baara ha mba
  rationale: Okwu a na-egosi ịbara mmadụ mba ma ọ bụ ịdọ ya aka ná ntị n'ụzọ siri ike. “Baara ha mba” na-echekwa ike dị n'okwu Grik ahụ, ọ bụ ezie na ihe gbara ya gburugburu nwere ike ime ka a ghọta ya dị ka ịdọ aka ná ntị siri ike.
- source_word: παρήγγειλεν
  choice: nye ha iwu
  rationale: Ngwaa a pụtara inye ntụziaka sitere n'aka onye nwere ikike. “Nye ha iwu” bụ Igbo doro anya ma na-egosipụta ịdị ike nke iwu ahụ.
- source_word: μηδενὶ
  choice: onye ọ bụla
  rationale: Mgbe e jikọtara ya na “ka ha ghara,” okwu a na-enye echiche nke ịghara ịgwa onye ọbụla.
- source_word: λέγειν
  choice: ịgwa
  rationale: N'usoro a, e nwere onye a na-agwa na ihe a na-ekwu; ya mere “ịgwa” bụ okwu Igbo sitere n'okike karịa nanị “ikwu.”
- source_word: τοῦτο
  choice: ihe a
  rationale: “Ihe a” na-echekwa ntụaka nke okwu ngosi Grik ahụ n'ebughị ụzọ kọwaa ya dị ka nkwupụta Pita.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosipụta obere ọdịiche dị n'etiti nkwupụta gara aga na mmeghachi omume Jizọs.
theological_decisions:
- issue: Ike nke mmachibido Jizọs nyere mgbe Pita kwupụtara onye ọ bụ
  choice: Mmachibido siri ike ka ha ghara ikwusara onye ọ bụla ihe a n'oge ahụ
  alternative: Ịdọ ha aka ná ntị n'ụzọ dịtụ nro ka ha ghara ịkọ ya
  rationale: Njikọ ἐπιτιμήσας na παρήγγειλεν na-egosi ihe karịrị arịrịọ nkịtị. Nsụgharị ahụ na-echekwa esemokwu dị na akụkọ ahụ n'etinyeghị ozizi gbasara ihe mere Jizọs ji machibido ha.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “baara ha mba” iji chekwaa ịdị nkọ nke ἐπιτιμήσας; ihe odide ala peeji na-edekọ nghọta ọzọ bụ “dọrọ ha aka ná ntị siri ike.”
