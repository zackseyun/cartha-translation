id: LUK.9.29
reference: Luke 9:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: ig
  text: Mgbe ọ nọ na-ekpe ekpere, ọdịdị ihu ya wee dị iche[a], uwe ya wee chawa ọcha, na-egbu maramara dị ka àmụ̀mà.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘ọdịdị ihu ya gbanwere.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘uwe ya na-acha ọcha ma na-egbuke egbuke’; okwu Grik ahụ na-enye echiche nke ìhè na-egbu dị ka àmụ̀mà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: Mgbe ọ nọ na-ekpe ekpere
  rationale: Usoro okwu Luk a na-egosi na ihe ahụ mere n’oge Jizọs nọ na-ekpe ekpere. Nsụgharị a na-enye echiche oge ahụ n’Igbo doro anya, na-etinyeghị okwu siri ike dịka ‘o wee ruo na.’
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: ọdịdị ihu ya
  rationale: εἶδος na-ekwu maka ihe anya hụrụ, πρόσωπον pụtakwara ‘ihu.’ ‘Ọdịdị ihu ya’ bụ Igbo nkịtị ma kwụsie ike n’ihe odide Grik kwuru.
- source_word: ἕτερον
  choice: wee dị iche
  rationale: ἕτερον pụtara ‘ọzọ’ ma ọ bụ ‘dị iche.’ Nhọrọ a na-egosi mgbanwe a hụrụ anya n’enweghị ịgbakwụnye na ihu ya ‘nwụrụ’ ma ọ bụ ‘na-enwu,’ nke Luk ekwughị ebe a.
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: uwe ya
  rationale: ἱματισμός bụ uwe ma ọ bụ ihe mmadụ yi. ‘Uwe ya’ bụ okwu Igbo dị mfe, nke oge a, ma dabara n’akụkọ ahụ.
- source_word: λευκὸς
  choice: chawa ọcha
  rationale: λευκός pụtara ‘ọcha.’ ‘Chawa ọcha’ na-egosi ọnọdụ uwe ahụ ghọrọ n’oge mgbanwe ahụ, ebe nkebi okwu na-esote na-akọwa ìhè ya.
- source_word: ἐξαστράπτων
  choice: na-egbu maramara dị ka àmụ̀mà
  rationale: Okwu a sitere n’echiche àmụ̀mà na-egbu ma na-egbuke egbuke. Nsụgharị a na-echekwa onyonyo ahụ nke ọma karịa nanị ịsị ‘na-enwu.’
theological_decisions:
- issue: Nkọwa mgbanwe a hụrụ n’ahụ Jizọs
  choice: E gosiri na ọdịdị ihu ya dị iche, n’enweghị ịsị na ihu ya na-enwu.
  alternative: ‘Ọdịdị ihu ya gbanwere’ ma ọ bụ ‘ihu ya na-enwu.’
  rationale: Luk kọwara mgbanwe a hụrụ anya, ma okwu ya dị nwayọọ karịa nke ụfọdụ akụkọ Oziọma ndị ọzọ. Nsụgharị ahụ ekwesịghị itinye okwu sitere n’akụkọ ndị yiri ya ma ọ bụ kọwaa ụdị mgbanwe ahụ karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Wee’ na-eme ka usoro ihe ndị mere n’akụkọ ahụ gaa were were; e zeere okwu ụka pụrụ iche na ijikọta okwu Luk na nke Oziọma ndị ọzọ.
