  source_fidelity: The translation retains Luke’s temporal setting (‘Mgbe ọ nọ na-ekpe ekpere’), the visible alteration of the appearance of Jesus’ face, and the description of his clothing as white with lightning-like brilliance. It does not import Matthew’s stronger wording that his face shone.
  naturalness: The wording is clear, idiomatic Standard Igbo, and appropriately elevated for narrative scripture. ‘Ọdịdị ihu ya wee dị iche’ naturally conveys a changed visible appearance, while ‘na-egbu maramara dị ka àmụ̀mà’ effectively communicates the vivid flashing quality.
  terminology: ‘Ọdịdị ihu,’ ‘uwe,’ ‘ọcha,’ and ‘àmúmà’ are suitable modern Standard Igbo choices. The footnotes supply legitimate lexical alternatives without imposing an interpretation.
