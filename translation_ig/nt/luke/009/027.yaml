  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: ig
  text: 'Ma ana m agwa unu eziokwu: ụfọdụ n’ime ndị guzo n’ebe a agaghị atọ ọnwụ ụtọ ma ọlị[a] ruo mgbe ha ga-ahụ alaeze Chineke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ịtọ ọnwụ ụtọ” pụtara ịnwụ, ya bụ, ịnwụ anwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: Ma ana m agwa unu eziokwu
  rationale: “Ma” na-egosipụta δέ dị ka njikọ okwu, ebe “ana m agwa unu eziokwu” na-enye ἀληθῶς n’Igbo dị mfe, kpọmkwem, ma dịkwa ebube.
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: ụfọdụ n’ime ndị guzo n’ebe a
  rationale: Nke a na-edobe echiche nkewa dị na genitive partitive (“ụfọdụ n’ime”) ma na-enye αὐτοῦ ἑστηκότων n’ụzọ Igbo nkịtị dị ka ndị nọ n’ebe ahụ guzo.
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: agaghị edetụ ọnwụ ire ma ọlị
  rationale: “Agaghị ... ma ọlị” na-egosipụta nkwusi ike dị na οὐ μή. “Edetụ ọnwụ ire” na-echekwa ihe atụ nke γεύομαι kama ịgbanwe ya ozugbo ka ọ bụrụ naanị “ịnwụ.”
- source_word: ἕως ἂν ἴδωσιν
  choice: ruo mgbe ha ga-ahụ
  rationale: Nke a bụ ụzọ Igbo dị n’usoro e si ekwu okwu nke na-egosipụta oke oge na ihe a na-atụ anya ya n’ọdịnihu.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: “Alaeze Chineke” bụ okwu a maara nke ọma n’Igbo, ma ọ na-ahapụ ohere sara mbara nke βασιλεία—ọchịchị Chineke na mpaghara ọchịchị ya—n’ebughị nkọwa otu akụkụ n’ime isiokwu ahụ.
theological_decisions:
- issue: Ihe “ịhụ alaeze Chineke” na-ezo aka na ya n’akụkụ a
  choice: E debere okwu ahụ dịka ọ dị, n’enweghị nkọwa agbakwunyere.
  alternative: Ịkọwa ya kpọmkwem dị ka mgbanwe ọdịdị Jizọs, mbilite n’ọnwụ na nrigo ya, mbibi Jerusalem, ma ọ bụ mgbasa nke nzukọ ndị kwere ekwe.
  rationale: Okwu Grik ahụ ekwughị kpọmkwem otu ihe a na-ezo aka na ya. Ịhapụ ya n’enweghị mgbasawanye na-echekwa nghọta dị iche iche nwere ike ịdị ma zere itinye otu usoro nkọwa banyere ihe ndị ga-eme n’ọdịnihu n’ime nsụgharị ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. A hapụrụ ihe atụ “idetụ ọnwụ ire” n’isiokwu ahụ iji chekwaa okwu Grik, ma kọwaa ya n’okpuru peeji. E tinyere akara [a] kpọmkwem n’ebe okwu a pụtara.
