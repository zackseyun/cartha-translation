review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the return of the apostles, their report to Jesus, his taking them, withdrawal apart from the crowds, and destination at Bethsaida. The phrase order, however, leaves the infinitive-like sequence "kpọrọ ha soro ya, pụọ iche" syntactically loose and can momentarily obscure that Jesus withdrew with the apostles.
  naturalness: '"O wee kpọrọ ha soro ya pụọ iche gaa ..." is a more natural, tightly connected Standard Igbo expression: it clearly says that he took them along and withdrew apart with them. "Pụọ iche" appropriately conveys κατ’ ἰδίαν without suggesting that Jesus was literally alone.'
  terminology: '"Ndị ozi ahụ" is an acceptable Standard Igbo rendering of οἱ ἀπόστολοι in this mission context. "Betsaida" is a suitable Igbo transliteration. The footnote should offer a genuine lexical alternative rather than the less idiomatic "gaa n’ebe naanị ha nọ."'
  issues:
  - severity: low
    issue: The verbal connection in "kpọrọ ha soro ya, pụọ iche" is loose.
    rationale: The Greek participle παραλαβών makes clear that Jesus took the apostles with him as he withdrew. Joining "soro ya" directly to "pụọ iche" removes a minor ambiguity in the Igbo syntax.
  - severity: low
    issue: The footnote’s alternative wording is not idiomatic and is more spatially specific than the Greek.
    rationale: '"Gaa n’ebe naanị ha nọ" can imply a particular place occupied exclusively by them. κατ’ ἰδίαν means apart, privately, or in private; "na nzuzo" is a direct and natural alternative.'
  revised_text: Mgbe ndị ozi ahụ lọghachiri, ha kọọrọ ya ihe niile ha mere. O wee kpọrọ ha soro ya pụọ iche[a] gaa n’obodo a na-akpọ Betsaida.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na nzuzo.” Nke a pụtara na ha wezugara onwe ha n’ebe ìgwè mmadụ nọ; ọ pụtaghị na Jizọs nọ naanị ya.
    reason: lexical_alternative
  revision_rationale: A small syntactic revision links the apostles’ accompanying Jesus directly with his withdrawal, preserving the Greek participial relationship and the sense of withdrawal apart from the crowds. The footnote is revised to give an idiomatic lexical alternative and to retain the needed clarification that Jesus was not alone.
