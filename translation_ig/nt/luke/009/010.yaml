id: LUK.9.10
reference: Luke 9:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: ig
  text: Mgbe ndị ozi ahụ lọghachiri, ha kọọrọ ya ihe niile ha mere. O wee kpọrọ ha soro ya pụọ iche[a] gaa n’obodo a na-akpọ Betsaida.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na nzuzo.” Nke a pụtara na ha wezugara onwe ha n’ebe ìgwè mmadụ nọ; ọ pụtaghị na Jizọs nọ naanị ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Mgbe ... lọghachiri
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu oge iji gosi na ha buru ụzọ lọghachi tupu ha akọọrọ ya ihe ha mere.
- source_word: οἱ ἀπόστολοι
  choice: ndị ozi ahụ
  rationale: N’ebe a ọ bụ aha a na-akpọ ndị Jizọs zipụrụ n’ozi; ‘ndị ozi’ bụ okwu Igbo doro anya nke na-egosipụta ịbụ ndị e zitere.
- source_word: διηγήσαντο αὐτῷ
  choice: ha kọọrọ ya
  rationale: ‘Kọọrọ’ na-egosi ịgwa Jizọs akụkọ ma ọ bụ nkọwa banyere ọrụ ha, n’enweghị itinye echiche nke akụkọ iwu ma ọ bụ akụkọ gọọmenti.
- source_word: ὅσα ἐποίησαν
  choice: ihe niile ha mere
  rationale: ὅσα na-ezo aka n’ihe nile ha mere; ntụgharị a bụ nke sitere n’okwu Grik ma dịkwa mma n’Igbo.
- source_word: παραλαβὼν αὐτούς
  choice: O wee kpọrọ ha soro ya
  rationale: Nke a na-egosi na Jizọs kpọọrọ ha dịka ndị ga-eso ya, ọ bụghị nanị na ọ kpọọrọ ha ihe.
- source_word: ὑπεχώρησεν
  choice: pụọ
  rationale: N’ime njikọ ‘pụọ iche,’ okwu a na-egosi ịhapụ ebe ọhaneze ma ọ bụ ìgwè mmadụ nọ, n’enweghị echiche siri ike nke ịgba ọsọ ma ọ bụ ịla azụ n’ụjọ.
- source_word: κατ’ ἰδίαν
  choice: iche
  rationale: ‘Pụọ iche’ na-egosi ịpụ n’ebe ìgwè mmadụ nọ gaa n’ebe nzuzo karịa, ma ọ naghị ekwu na Jizọs nọ nanị ya ebe ọ kpọọrọ ndị ozi ahụ.
- source_word: πόλιν καλουμένην Βηθσαϊδά
  choice: n’otu obodo a na-akpọ Betsaida
  rationale: πόλις nwere ike ịbụ obodo ukwu ma ọ bụ nta; ‘obodo’ anaghị ekpebi oke ya. E degharịrị aha ebe ahụ n’ụdị a na-agụ nke ọma n’Igbo.
theological_decisions:
- issue: Ihe κατ’ ἰδίαν pụtara ebe ndị ozi ahụ so Jizọs
  choice: pụọ iche
  alternative: gaa naanị ya; gaa na nzuzo
  rationale: Ebe amaokwu ahụ kwuru hoo haa na Jizọs kpọọrọ ndị ozi ahụ, ntụgharị ekwesịghị ime ka ọ dị ka ọ nọ naanị ya. ‘Pụọ iche’ na-echekwa echiche nke ikewapụ onwe ha n’ebe ìgwè mmadụ nọ n’enweghị ịgbakwunye na ihe ahụ bụ ihe nzuzo.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. ‘Pụọ iche’ bụ ahịrịokwu nkịtị nke na-echekwa ma echiche nke ịpụ n’ebe ọhaneze nọ ma eziokwu ahụ na ndị ozi ahụ so Jizọs.
