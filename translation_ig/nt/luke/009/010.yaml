revisions:
- from: Mgbe ndị ozi ahụ lọghachiri, ha kọọrọ ya ihe niile ha mere. O wee kpọrọ ha soro ya, pụọ iche[a] gaa n’otu obodo a na-akpọ Betsaida.
  to: Mgbe ndị ozi ahụ lọghachiri, ha kọọrọ ya ihe niile ha mere. O wee kpọrọ ha soro ya pụọ iche[a] gaa n’obodo a na-akpọ Betsaida.
  rationale: A small syntactic revision links the apostles’ accompanying Jesus directly with his withdrawal, preserving the Greek participial relationship and the sense of withdrawal apart from the crowds. The footnote is revised to give an idiomatic lexical alternative and to retain the needed clarification that Jesus was not alone.
  reviewer_model: gpt-5.6-terra
