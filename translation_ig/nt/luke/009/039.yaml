review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains πνεῦμα as “mmụọ,” the sudden cry, the difficulty of departure, and the severe harm done during departure. However, “n’ọnụ” (“from his mouth”) is not stated in the Greek μετὰ ἀφροῦ (“with foaming”), and “nke ukwuu” somewhat heightens the convulsing beyond the source’s wording. The revised wording retains the bodily-affliction sense without adding a location for the foam.
  naturalness: The revised text uses clear, modern Standard Igbo. “Ọ na-afụ ụfụfụ” is a natural way to express foaming without the added explicit phrase “from his mouth.”
  terminology: “Mmụọ” properly preserves the Greek’s nonspecific πνεῦμα in the main text. The footnote’s first alternative, “mmụọ ọjọọ,” is appropriate; “mmụọ ọjọọ nke na-achị mmadụ” is more interpretive and is best replaced with the simpler alternative “demon,” while making clear that neither is the wording of this verse.
  issues:
  - severity: medium
    issue: The phrase “ụfụfụ ana-apụkwa ya n’ọnụ” adds “from his mouth.”
    rationale: The Greek says only that the convulsing occurs μετὰ ἀφροῦ, “with foaming.” Although foaming at the mouth may be inferred clinically, the location is not expressed and should not be supplied in an optimal-equivalence rendering.
  - severity: low
    issue: “na-eme ka ahụ ya maa jijiji nke ukwuu” adds an explicit intensifier.
    rationale: σπαράσσει denotes violent convulsing, but “nke ukwuu” is not required to communicate this and slightly expands the wording.
  - severity: low
    issue: The footnote’s second alternative is unnecessarily paraphrastic.
    rationale: “mmụọ ọjọọ nke na-achị mmadụ” adds an explanatory description rather than offering the direct alternative “demon.”
  revised_text: Lee, mmụọ na-ejide ya, ọ na-etikwa mkpu na mberede. Mmụọ ahụ na-eme ka ahụ ya maa jijiji, ọ na-afụkwa ụfụfụ. O siiri mmụọ ahụ ike ịhapụ ya, ma mgbe ọ na-apụ, ọ na-emerụ ya ahụ nke ukwuu.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “mmụọ ọjọọ” ma ọ bụ “demon”; n’ebe a, Grik kwuru naanị “mmụọ.”
    reason: alternative_reading
  revision_rationale: 'The revision removes the unexpressed detail that the foam comes from the mouth, avoids a separate added intensifier for the convulsing, and preserves the Greek sequence: the spirit seizes him; he suddenly cries out; the spirit convulses him with foaming; it leaves only with difficulty while harming him severely. The footnote continues to distinguish the Greek’s lexical wording from contextually plausible but more specific alternatives.'
