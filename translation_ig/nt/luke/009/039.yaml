id: LUK.9.39
reference: Luke 9:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: ig
  text: Lee, mmụọ na-ejide ya, ọ na-etikwa mkpu na mberede. Mmụọ ahụ na-eme ka ahụ ya maa jijiji, ọ na-afụkwa ụfụfụ. O siiri mmụọ ahụ ike ịhapụ ya, ma mgbe ọ na-apụ, ọ na-emerụ ya ahụ nke ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mmụọ ọjọọ” ma ọ bụ “demon”; n’ebe a, Grik kwuru naanị “mmụọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu eji adọta uche onye na-ege ntị; “Lee” na-echekwa ịdị ndụ nke akụkọ nna ahụ n’Igbo dị mfe ma dị ùgwù.
- source_word: πνεῦμα
  choice: mmụọ
  rationale: Grik kwuru naanị “mmụọ,” n’etinyeghị okwu pụtara “ọjọọ” ma ọ bụ kpọọ ya “mmụọ ọjọọ”; ya mere a hapụrụ obosara okwu ahụ dịka ọ dị.
- source_word: λαμβάνει
  choice: na-ejide ya
  rationale: N’ebe a, okwu ahụ na-egosi ijide mmadụ n’ike ma chịkwaa ya; “na-ejide ya” bụ Igbo doro anya nke na-adịghị etinye nkọwa karịrị isi mmalite.
- source_word: ἐξαίφνης
  choice: na mberede
  rationale: Nke a na-egosi na ihe ahụ na-amalite na-atụghị anya ya.
- source_word: κράζει
  choice: ọ na-eti mkpu
  rationale: A nọgidere na-ahapụ nwata ahụ dịka onye ngwaa a na-ekwu maka ya, kama ịkọwa n’isi ederede na mmụọ ahụ bụ onye mere ka o tie mkpu.
- source_word: σπαράσσει
  choice: na-eme ka ahụ ya maa jijiji nke ukwuu
  rationale: N’ọnọdụ a, okwu ahụ na-akọ mmegharị ahụ siri ike yiri ọdụdọ; ntụgharị a na-eme ka mmetụta anụahụ doo onye Igbo nke oge a anya.
- source_word: μετὰ ἀφροῦ
  choice: ụfụfụ ana-apụkwa ya n’ọnụ
  rationale: Nke a na-egosi ụfụfụ na-eso ọdụdọ ahụ; ịkpọ “ọnụ” aha bụ nkọwa ebumpụta ụwa n’Igbo banyere ebe ụfụfụ ahụ si apụta.
- source_word: μόγις
  choice: ọ na-esiri ... ike
  rationale: Okwu ahụ nwere ike igosi na ịpụ na-adị ụkọ ma ọ bụ na-esiri ike; ntụgharị a na-echekwa echiche nke ịpụ n’ụzọ siri ike n’Igbo nkịtị.
- source_word: ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: ịhapụ ya ... mgbe ọ na-apụ
  rationale: “Ịhapụ ya” na “ọ na-apụ” na-egosipụta nke ọma na mmụọ ahụ na-ahapụ nwata ahụ.
- source_word: συντρῖβον αὐτόν
  choice: ọ na-emerụkwa ya ahụ nke ukwuu
  rationale: Okwu Grik ahụ na-egosi mmebi siri ike, ma ọ bụghị iwu na ọ pụtara ịzọpịa mmadụ n’ụzọ nkịtị; nke a na-echekwa ike ya n’Igbo doro anya.
theological_decisions:
- issue: Ma a ga-akpọ πνεῦμα ‘mmụọ ọjọọ’ ma ọ bụ ‘mmụọ’ n’isi ederede
  choice: mmụọ
  alternative: mmụọ ọjọọ; mmụọ ọjọọ nke na-achị mmadụ
  rationale: Ọ bụ ezie na gburugburu akụkọ ahụ na-egosi mmụọ na-emegide mmadụ, amaokwu a n’onwe ya kwuru naanị πνεῦμα. Ya mere, a naghị eme ka okwu ahụ bụrụ nke akọwapụtara karịa Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere okwu ụka pụrụ iche na nkọwa ahụike ma ọ bụ mmụọ karịrị ihe amaokwu Grik kwuru. E debere akara nkọwa ala ala [a] n’isi ederede.
