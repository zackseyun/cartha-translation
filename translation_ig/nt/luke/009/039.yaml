revisions:
- from: Lee, mmụọ na-ejide ya; na mberede, ọ na-eti mkpu. Mmụọ ahụ na-eme ka ahụ ya maa jijiji nke ukwuu, ụfụfụ ana-apụkwa ya n’ọnụ. Ọ na-esiri mmụọ ahụ ike ịhapụ ya, ọ na-emerụkwa ya ahụ nke ukwuu mgbe ọ na-apụ.[a]
  to: Lee, mmụọ na-ejide ya, ọ na-etikwa mkpu na mberede. Mmụọ ahụ na-eme ka ahụ ya maa jijiji, ọ na-afụkwa ụfụfụ. O siiri mmụọ ahụ ike ịhapụ ya, ma mgbe ọ na-apụ, ọ na-emerụ ya ahụ nke ukwuu.[a]
  rationale: 'The revision removes the unexpressed detail that the foam comes from the mouth, avoids a separate added intensifier for the convulsing, and preserves the Greek sequence: the spirit seizes him; he suddenly cries out; the spirit convulses him with foaming; it leaves only with difficulty while harming him severely. The footnote continues to distinguish the Greek’s lexical wording from contextually plausible but more specific alternatives.'
  reviewer_model: gpt-5.6-terra
