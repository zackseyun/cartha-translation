  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: ig
  text: ndị ụfọdụ kwuru na Ịlaịja apụtala, ndị ọzọ kwukwara na otu onye amụma oge ochie ebiliela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “otu onye n’ime ndị amụma oge ochie ebiliela.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: ndị ụfọdụkwa kwuru ... ndị ọzọkwa kwuru
  rationale: N’asụsụ Grik, ahịrịokwu a hapụrụ ngwaa e ji kọọ ihe ndị mmadụ na-ekwu n’amaokwu bu ya ụzọ. Itinye “kwuru” ugboro abụọ na-eme ka Igbo doo anya ma na-echekwa echiche nke akụkọ sitere n’aka ìgwè abụọ.
- source_word: δὲ ... δὲ
  choice: -kwa ... -kwa
  rationale: Mgbakwunye “-kwa” na-egosi na ndị a bụ echiche ndị ọzọ a na-agbakwụnye n’usoro ahụ, na-emeghị ka ọdịiche dị n’etiti ha sie ike karịa nke Grik.
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: Nke a bụ ụdị aha onye amụma Elijah a na-ejikarị eme ihe n’Igbo.
- source_word: ἐφάνη
  choice: apụtala
  rationale: Okwu a pụtara na ọ pụtara ma ọ bụ ghọọ onye a hụrụ anya. “Apụtala” dị mfe ma dị iche na okwu mbilite e ji mee ihe n’ahịrịokwu na-esote.
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: otu onye amụma oge ochie
  rationale: Nke a na-egosi onye amụma a na-akọwaghị aha ya, bụ́ onye nke oge gara aga. Ọ bụ Igbo ebumpụta ụwa ma ọ naghị ekpebi karịa ka Grik si kwuo ma genitive ahụ ọ̀ pụtara kpọmkwem ‘n’etiti ndị amụma oge ochie.’
- source_word: ἀνέστη
  choice: ebiliela
  rationale: “Ebiliela” na-echekwa asụsụ mbilite nke ἀνέστη. N’ọnọdụ a, ọ na-egosi isi n’ọnwụ bilie n’etinyeghị okwu “n’ọnwụ” nke na-adịghị n’ahịrị Grik n’onwe ya.
theological_decisions:
- issue: Ihe ndị mmadụ kwuru banyere onye amụma oge ochie
  choice: ebiliela
  alternative: esiwo n’ọnwụ bilie; alọghachiela
  rationale: Nhọrọ a na-echekwa okwu mbilite dị na Grik na nkwenye ndị mmadụ na-akọ, ma ọ naghị akwado nkwenye ahụ ma ọ bụ gbanwee ya ka ọ bụrụ naanị ‘ịlọghachi.’
- issue: Njikọ onye amụma ahụ na ndị oge ochie
  choice: otu onye amụma oge ochie
  alternative: otu onye n’ime ndị amụma oge ochie
  rationale: Isi ederede na-anọ nso n’usoro προφήτης τις τῶν ἀρχαίων ma na-ahapụ obere mgbagwoju anya genitive ahụ; a na-enye nghọta ‘otu onye n’ime’ n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A gbakwụnyere “kwuru” iji mezue ahịrịokwu elliptical nke Grik n’ụzọ Igbo si ekwu okwu; “-kwa” na-ejigide usoro echiche ndị a na-agbakwụnye.
