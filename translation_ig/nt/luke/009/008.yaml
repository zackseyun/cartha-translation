- from: ndị ụfọdụkwa kwuru na Ịlaịja apụtala, ndị ọzọkwa kwuru na otu onye amụma oge ochie ebiliela.[a]
  to: ndị ụfọdụ kwuru na Ịlaịja apụtala, ndị ọzọ kwukwara na otu onye amụma oge ochie ebiliela.[a]
  rationale: The revision is limited to idiomatic placement of the additive particle. It preserves the explicit Igbo reporting verbs needed to complete the Greek ellipsis, retains the source's indefinite unnamed prophet, and leaves the possible partitive nuance in the footnote.
