  rationale: The revision retains every major element of the Greek while restoring αὐτοῖς in idiomatic Igbo. It also places the ambiguity note at the word it explains and simplifies the lexical alternative so it addresses κλασμάτων alone. The dash appropriately presents the twelve baskets as the collected total.
