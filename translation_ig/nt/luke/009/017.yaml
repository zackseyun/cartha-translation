  text: καὶ ἔφαγον καὶ ἐχορτάσθησαν πάντες, καὶ ἤρθη τὸ περισσεῦσαν αὐτοῖς κλασμάτων κόφινοι δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/017.yaml
  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: ig
  text: Ha niile riri, afọ jukwara ha; e wee chịkọta iberibe ndị fọdụrụ ha[b]—nkata iri na abụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mpekere.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu a pụtara kpọmkwem “ha” ma nwee ike igosi ihe fọdụrụ nye ha ma ọ bụ mgbe ha richara.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἔφαγον
  choice: riri
  rationale: Aorist a na-akọ ihe mere n’ụzọ dị mfe; “riri” bụ okwu Igbo nkịtị kwesịrị ekwesị.
- source_word: ἐχορτάσθησαν
  choice: rijukwa afọ
  rationale: Nke a na-egosi na ha riri ruo mgbe afọ juru ha, n’Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: πάντες
  choice: Ha niile
  rationale: Ọ na-edobe nkwusi ike nke Grik na onye ọ bụla nọ ebe ahụ riri.
- source_word: ἤρθη
  choice: e wee chịkọta
  rationale: N’ọnọdụ a, passive nke αἴρω na-ezo aka n’ịchịkọta ihe fọdụrụ; usoro a bụ Igbo ebumpụta ụwa ma ọ naghị akpọ onye mere ya aha.
- source_word: τὸ περισσεῦσαν
  choice: ndị fọdụrụ
  rationale: Ọ na-egosi ihe ndị fọdụrụ mgbe mmadụ niile risịrị, ma jikọta ya n’ụzọ ebumpụta ụwa na “iberibe.”
- source_word: αὐτοῖς
  choice: hapụrụ n’ahịrịokwu bụ isi
  rationale: Dative a nwere nghọta na-adịghị doo anya nke ọma. N’Igbo, ịtinye “maka ha” ma ọ bụ “site n’aka ha” ga-amanye otu nkọwa; ihe gbara ya gburugburu egosilarị na ihe ndị a fọdụrụ mgbe ha risịrị.
- source_word: κλασμάτων
  choice: iberibe
  rationale: “Iberibe” na-egosi akụkụ nri a gbajiri agbaji ma bụrụ okwu doro anya nye ndị na-agụ Igbo ugbu a.
- source_word: κόφινοι δώδεκα
  choice: nkata iri na abụọ
  rationale: Nke a bụ ntụgharị doro anya na nke nkịtị; ịkọwa ihe e ji kpaa nkata ahụ adịghị mkpa n’ahịrịokwu bụ isi.
theological_decisions:
- issue: Mmekọrịta αὐτοῖς na ahịrịokwu ahụ
  choice: A naghị amanye “maka ha” ma ọ bụ “site n’aka ha” n’ahịrịokwu bụ isi.
  alternative: “e wee chịkọtara ha” ma ọ bụ “ha wee chịkọta”
  rationale: Grik αὐτοῖς nwere ike ịpụta mmekọrịta dị iche iche n’ebe a, ma nsụgharị ndị ọzọ ga-eme ka otu nghọta yie ihe e kwuru kpọmkwem. Ịhapụ ya n’ụdị Igbo a na-echekwa isi ozi na-enweghị idozi ihe Grik hapụrụ ntakịrị n’ọchịchịrị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ejiri “rijukwa afọ” mee ka echiche nke iri ruo n’afọ ojuju pụta ìhè; ejiri passive na-enweghị onye kpọmkwem, “e wee chịkọta,” chekwaa usoro akụkọ Grik.
