  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: ig
  text: Ma ha aghọtaghị okwu a[a], e zoro ya n’anya ha ka ha ghara ịmata ya[b], ha na-atụkwa egwu ịjụ ya banyere okwu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ihe e kwuru,” “nkwupụta,” ma ọ bụ “ihe” maka okwu Grik ῥῆμα.
    reason: lexical_alternative
  - marker: b
    text: Asụsụ Grik kwuru, “e zoro ya n’ebe ha nọ,” ma ọ kpọghị onye zoro ya aha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: ha aghọtaghị
  rationale: N’ebe a, ngwaa ahụ na-egosi na ha amataghị ihe okwu Jizọs pụtara; ‘aghọtaghị’ bụ Igbo doro anya ma kwekọọ n’ihe a na-ekwu.
- source_word: ῥῆμα
  choice: okwu
  rationale: N’ebe a, ῥῆμα bụ okwu Jizọs kwuru kpọmkwem. ‘Okwu’ bụ ntụgharị Igbo dị nkenke ma bụrụkwa nke sitere n’ọnụ, ọ bụ ezie na ọ pụkwara ịpụta okwu ma ọ bụ ihe e kwuru.
- source_word: παρακεκαλυμμένον
  choice: e zokwara ya
  rationale: Nke a na-edobe ụdị okwu nnara nke Grik ma gosipụta ọnọdụ nke izochiri ihe ahụ, n’akpọghị onye zoro ya aha.
- source_word: ἀπ’ αὐτῶν
  choice: n’ebe ha nọ
  rationale: Nkebiokwu a na-egosi na e mere ka okwu ahụ ghara ịdị ha n’aka ịghọta; ntụgharị a bụ Igbo ebumpụta ụwa maka ihe e zoro mmadụ.
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: ka ha ghara ịghọta ihe ọ pụtara
  rationale: αἰσθάνομαι na-ekwu maka ịghọta ma ọ bụ ịmata ihe nke ọma. Nkebiokwu Igbo a na-eme ka ihe a na-ekwu doo anya, n’agbanyeghị na ọ dị ezigbo nso n’echiche ngwaa mbụ.
- source_word: ἐφοβοῦντο
  choice: ha tụkwara egwu
  rationale: Nke a bụ ụzọ Igbo dị ugbu a ma dị mfe isi kwuo na egwu nọgidere na-adị ha.
- source_word: ἐρωτῆσαι
  choice: ịjụ
  rationale: ‘Ịjụ’ bụ okwu Igbo kwesịrị ekwesị maka ịrịọ Jizọs ka ọ kọwakwuo ihe o kwuru.
theological_decisions:
- issue: Onye mere ka e zoo okwu ahụ
  choice: 'E debere okwu ahụ n’ụdị nnara: ‘e zokwara ya n’ebe ha nọ,’ n’akpọghị onye zoro ya aha.'
  alternative: Chineke zoro ya n’ebe ha nọ; ma ọ bụ na okwu ahụ nọgidere bụrụ ihe ha na-apụghị ịghọta n’enweghị onye a kpọrọ aha.
  rationale: Ụdị okwu nnara nke Grik anaghị akpọ onye mere izochi ahụ aha. Ịhapụ ya otu a na-echekwa nghọtahie na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ n’etinyeghị nkọwa ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘okwu’ maka ῥῆμα, ma ụdị nnara ahụ ka edobere iji ghara ịkọwa onye mere izochi ahụ.
