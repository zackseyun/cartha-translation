- from: Mgbe olu ahụ dara, a hụrụ Jizọs naanị ya.[a] Ha gbara nkịtị, ha agwaghịkwa onye ọ bụla n’ụbọchị ndị ahụ ihe ọ bụla banyere ihe ndị ha hụrụ.
  to: Mgbe olu ahụ dara, a hụrụ Jizọs naanị ya.[a] Ha gbara nkịtị, ha agwaghị onye ọ bụla n’ụbọchị ndị ahụ ihe ọ bụla n'ime ihe ndị ha hụrụ.
  rationale: The revision preserves the draft’s strong, source-faithful handling of the temporal clause and of Jesus’ solitary presence. It corrects only the final partitive expression and removes an unnecessary additive enclitic, yielding a more exact and natural Standard Igbo rendering.
