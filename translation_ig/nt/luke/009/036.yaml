  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: ig
  text: Mgbe olu ahụ dara, a hụrụ Jizọs naanị ya.[a] Ha gbara nkịtị, ha agwaghị onye ọ bụla n’ụbọchị ndị ahụ ihe ọ bụla n'ime ihe ndị ha hụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Naanị Jizọs fọdụrụ,” ma ọ bụ, “Ọ bụ naanị Jizọs ka a hụrụ.” Ihe Grik kwuru kpọmkwem bụ, “A hụrụ Jizọs naanị ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνὴν
  choice: Mgbe olu ahụ dara
  rationale: Nkebiokwu nwere infinitive na ἐν na-egosi oge, ya bụ ‘mgbe’ ma ọ bụ ‘ka.’ N’Igbo, ‘olu dara’ bụ ụzọ ebumpụta ụwa e si ekwu na a nụrụ olu, n’enweghị ịgbakwụnye na olu ahụ akwụsịla.
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: a hụrụ Jizọs naanị ya
  rationale: Nke a na-edobe ọdịdị passive nke εὑρέθη na nkọwa dị nwayọọ nke μόνος, n’etinyeghị nkọwa ọzọ banyere ihe mere Mozis na Ịlaịja.
- source_word: ἐσίγησαν
  choice: Ha gbara nkịtị
  rationale: ‘Ịgba nkịtị’ bụ okwu Igbo doro anya ma bụrụ nke ebumpụta ụwa maka ịnọ jụụ ma ghara ikwu ihe.
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: ha agwaghịkwa onye ọ bụla
  rationale: ‘Ịgwa onye’ na-ebuga echiche ἀπαγγέλλω n’asụsụ Igbo nkịtị ma na-edobe nkwụsi ike nke οὐδενί.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: n’ụbọchị ndị ahụ
  rationale: Nke a bụ ntụgharị oge kpọmkwem, nke doro anya ma dịkwa mma n’Igbo.
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: ihe ọ bụla banyere ihe ndị ha hụrụ
  rationale: Nke a na-edobe ike nke nkwuwa okwu na-adịghị mma n’ahịrịokwu ahụ nakwa njikọ ya na ihe ndị ha ji anya ha hụ.
theological_decisions:
- issue: Ihe akụkọ ahụ na-egosi site n’ịnọ naanị Jizọs mgbe olu eluigwe dara
  choice: A kọwara ya naanị dịka ‘a hụrụ Jizọs naanị ya.’
  alternative: ‘Naanị Jizọs fọdụrụ’ ma ọ bụ ‘ọ bụ naanị Jizọs ka a hụrụ.’
  rationale: Ihe odide ahụ na-akọ ọnọdụ ha hụrụ, ma ọ naghị akọwa ihe mmụta okpukpe sitere na ya. Ya mere, ntụgharị ahụ anaghị etinye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ndị ahụ na-agbaso usoro akụkọ Grik n’enweghị itinye nkọwa ụka ma ọ bụ nke otu okwukwe.
