  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị ozi’ kewaa ndị ozi mmadụ na ‘ndị mmụọ ozi’; e jikwa usoro ‘wee gaa banye’ mee ka akụkọ ahụ na-aga were were.
