  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: ig
  text: O zipụrụ ndị ozi ka ha buru ya ụzọ[a]. Ha wee gaa banye n’otu obodo nta nke ndị Sameria[b] ịkwadebeere ya ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “n’ihu ya.” Akpaalaokwu Grik ahụ kwuru “n’ihu ihu ya.”'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụ ya: “otu obodo nta ndị Sameria.” Grik kwuru n’ụzọ nkịtị, “otu obodo nta nke ndị Sameria.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: zipụkwara
  rationale: Oge ngwaa a na-akọ ihe mere n’oge gara aga; ‘zipụkwara’ na-ejikọta amaokwu a na akụkọ bu ya ụzọ ma na-egosipụta iziga ndị ozi.
- source_word: ἀγγέλους
  choice: ndị ozi
  rationale: N’ọnọdụ akụkọ a, okwu ahụ na-ezo aka n’ụmụ mmadụ e zigara ozi, ọ bụghị ndị mmụọ ozi.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: ka ha buru ya ụzọ
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na ha gara n’ihu ya; ọ na-enye isi akpaalaokwu Grik nke pụtara n’ụzọ nkịtị ‘n’ihu ihu ya.’
- source_word: πορευθέντες
  choice: Ha wee gaa
  rationale: A na-egosipụta omume participle ahụ dị ka ihe mere tupu ha abanye, n’ụzọ akụkọ Igbo na-aga were were.
- source_word: εἰσῆλθον
  choice: banye
  rationale: ‘Banye’ na-egosipụta ịbanye n’ime obodo nta ahụ nkenke ma doo anya.
- source_word: κώμην
  choice: obodo nta
  rationale: κώμη na-ezokarị aka n’obodo pere mpe karịa nnukwu obodo.
- source_word: Σαμαριτῶν
  choice: nke ndị Sameria
  rationale: Nke a na-edobe ụdị genitive plural nke Grik, ya bụ obodo nta nke ndị Sameria bi na ya ma ọ bụ nke ha.
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: ịkwadebere ya ihe
  rationale: Ọ na-egosipụta nzube ha ji gaa; ‘ihe’ na-eme ka okwu ahụ doo anya n’Igbo n’enweghị ịkọ kpọmkwem ihe a kwadebere, dịka Grik hapụrụ ya n’amaghị ama.
