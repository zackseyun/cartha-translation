  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị onye ọzọ, “Soro m.” Ma onye ahụ sịrị, “Onyenweanyị, kwe ka m buru ụzọ gaa lie nna m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịhazi ya otú a: “Onyenweanyị, kwe ka m gaa buru ụzọ lie nna m.”'
    reason: Usoro okwu Grik ἀπελθόντι πρῶτον nwere ike ịpụta n’Igbo n’usoro abụọ a na-enweghị ịgbanwe arịrịọ ahụ ka ọ gaa lie nna ya tupu ya esoro Jizọs.
lexical_decisions:
- source_word: ἕτερον
  choice: onye ọzọ
  rationale: Nke a na-egosi onye ọzọ dị iche n’ime akụkọ ahụ n’enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: Ἀκολούθει μοι
  choice: Soro m
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ na nke sitere n’okike isi nye iwu ka mmadụ soro onye ọzọ; ọ naghị amanye echiche ‘na-aga n’ihu iso’ nke ahịrịokwu ahụ ekwughị hoo haa.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Aha a na-echekwa ma nkwanye ùgwù dị n’okwu onye ahụ ma ibu echiche okpukpe nke κύριος mgbe a na-akpọ Jizọs aha.
- source_word: ἐπίτρεψόν μοι
  choice: kwe ka m
  rationale: Nke a bụ arịrịọ ikike n’Igbo dị mfe ma dị ùgwù.
- source_word: ἀπελθόντι πρῶτον
  choice: buru ụzọ gaa
  rationale: 'Ọ na-echekwa usoro omume ahụ: ịga bụ ihe ọ chọrọ ibu ụzọ mee tupu ili nna ya.'
- source_word: θάψαι τὸν πατέρα μου
  choice: lie nna m
  rationale: Nke a bụ ntụgharị doro anya, kpọmkwem nke ‘ili nna m.’
theological_decisions:
- issue: Otú e si sụgharị κύριος mgbe a na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna ukwu; Nwe m
  rationale: ‘Onyenwe anyị’ na-echekwa mgbagwoju anya dị n’etiti okwu nkwanye ùgwù na aha nwere ibu echiche banyere onye Jizọs bụ, kama ime ka ọ bụrụ naanị aha nkwanye ùgwù nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. ‘Mgbe ahụ’ na-eme ka njikọ akụkọ δέ pụta n’ụzọ sitere n’okike; ‘onye ahụ’ na-eme ka onye kwuru okwu doo anya n’Igbo. E zere ịkọwa ma nna ya anwụọlarị ma ọ bụ na okwu ahụ na-ezo aka n’ọrụ ezinụlọ n’ọdịnihu, n’ihi na isi mmalite ahụ anaghị edozi nke ahụ.
