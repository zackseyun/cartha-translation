  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: ig
  text: Ma Jizọs maara echiche dị n’obi ha[a], jidere otu nwata, mee ka ọ guzo n’akụkụ ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, Grik sịrị, “echiche nke obi ha”; “obi” dị n’ọnụọgụ otu, ma “ha” dị n’ọnụọgụ ọtụtụ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’akụkụ onwe ya,” ya bụ, n’akụkụ Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: maara
  rationale: N’ebe a, participle a na-egosi ịma ma ọ bụ ịghọta ihe dị n’ime mmadụ; “maara” bụ okwu Igbo doro anya nke na-akọ ihe amaara n’akọwaghị otú Jizọs si mara ya.
- source_word: διαλογισμὸν
  choice: echiche
  rationale: “Echiche” na-ekpuchi echiche na ntụgharị uche dị n’ime ha, ma ọ naghị eme ka okwu ahụ bụrụ naanị esemokwu a na-ekwu n’ọnụ.
- source_word: τῆς καρδίας αὐτῶν
  choice: dị n’obi ha
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dị mma isi kwuo echiche dị n’ime mmadụ. “Obi” anaghị egosi ọdịiche ọnụọgụ n’ụzọ siri ike n’ebe a, ya mere nkọwa ala peeji na-echekwa ọdịdị Grik nke ji “obi” n’ọnụọgụ otu na “ha” n’ọnụọgụ ọtụtụ.
- source_word: ἐπιλαβόμενος
  choice: jidere
  rationale: “Jidere” na-echekwa ihe omume doro anya nke ijide nwata, ma ọ bụkwa okwu Igbo sitere n’okike karịa nsụgharị dị larịị dịka naanị “kpọrọ.”
- source_word: παιδίον
  choice: otu nwata
  rationale: “Nwata” bụ okwu Igbo zuru oke maka παιδίον; “otu” na-eme ka ihe a na-akọ pụta nke ọma n’enweghị itinye nkwusi ike na-adịghị na isiokwu Grik.
- source_word: ἔστησεν
  choice: mee ka o guzo
  rationale: Nke a na-echekwa echiche causative nke ἵστημι—ime ka nwata ahụ guzo—ma na-ada ka Igbo eke.
- source_word: παρ’ ἑαυτῷ
  choice: n’akụkụ onwe ya
  rationale: “Onwe ya” na-egosi nke ọma na nwata ahụ guzoro n’akụkụ Jizọs, ma na-echekwa reflexive dị na Grik.
theological_decisions:
- issue: Otú Jizọs si mara echiche dị n’ime ha
  choice: E kwuru naanị na Jizọs maara echiche dị n’obi ha.
  alternative: Ịkọwa ya kpọmkwem dị ka ọmụma Chineke zuru oke ma ọ bụ nghọta mmadụ pụrụ iche.
  rationale: Amaokwu ahụ na-ekwusi ike na Jizọs maara echiche ha, ma ọ kọwaghị ụzọ o si mara ya; nsụgharị ahụ anaghị etinye nkọwa nkà mmụta okpukpe nke ederede ahụ ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka ọ gụọ nke ọma n’Igbo, na-agbanweghị usoro ihe omume. “O” anaghị egosi nwoke ma ọ bụ nwaanyị, nke dabara na παιδίον nke na-akọwaghị okike nwata ahụ.
