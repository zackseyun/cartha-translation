review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal sense of the verse, including the contrast between heavy sleep and wakefulness, Jesus’ glory, and the two men with him. However, “Ụra nọ na-anyịgbu” means that sleep was troubling or tormenting them and does not naturally retain the Greek image of being weighed down by sleep. The phrase identifying Peter’s companions and the final relative clause also need smoother, more precise Standard Igbo.
  naturalness: “Ụra dị Pita na ndị so ya arọ” is a natural, concise way to express that they were heavily burdened with sleep. “Ndị ikom abụọ ahụ guzo n'akụkụ ya” is clearer and more idiomatic than the draft’s relative-clause construction.
  terminology: “Ebube ya” appropriately renders δόξα and retains the biblical register. “Ndị ikom abụọ ahụ” accurately renders τοὺς δύο ἄνδρας. The footnote retains the lexical uncertainty of διαγρηγορήσαντες without asserting an unwarranted interpretation.
  issues:
  - severity: medium
    issue: “Ụra nọ na-anyịgbu Pita na ndị ya na ya nọ” is not an idiomatic or sufficiently close rendering of βεβαρημένοι ὕπνῳ.
    rationale: “Na-anyịgbu” commonly conveys afflicting, vexing, or tormenting. The Greek depicts a continuing state of being burdened/heavy with sleep. “Ụra dị ... arọ” preserves that image naturally.
  - severity: low
    issue: “ndị ya na ya nọ” is awkward and potentially ambiguous.
    rationale: It can be read as ‘his people who were with him.’ “Ndị so ya” naturally identifies Peter’s companions in this context.
  - severity: low
    issue: “ndị ikom abụọ ahụ ha na ya guzo” is syntactically awkward.
    rationale: A direct predicate, “ndị ikom abụọ ahụ guzo n'akụkụ ya,” is natural Standard Igbo and clearly conveys their standing with him.
  revised_text: Ma ụra dị Pita na ndị so ya arọ; ma mgbe ha mụrụ anya nke ọma[a], ha hụrụ ebube ya na ndị ikom abụọ ahụ guzo n'akụkụ ya.
  revised_footnotes:
