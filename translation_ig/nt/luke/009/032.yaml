    reason: lexical_alternative
  revision_rationale: The revision replaces a non-idiomatic expression for being weighed down with sleep with a natural Igbo equivalent, clarifies that the others are Peter’s companions, and smooths the description of the two men. It preserves the source’s contrastive structure, the cautious sense of the rare participle, and the theological-register term “ebube.”
