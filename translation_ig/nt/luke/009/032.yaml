  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: ig
  text: Ma ụra dị Pita na ndị so ya arọ; ma mgbe ha mụrụ anya nke ọma[a], ha hụrụ ebube ya na ndị ikom abụọ ahụ guzo n'akụkụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ha tetara,” ma ọ bụ, “ozugbo ha mụrụ anya nke ọma.” Ngwaa Grik a adịghị apụta ọtụtụ mgbe; o nwere ike igosi na ha bịara mụrụ anya nke ọma, kama igosi na ha nọgidere na-amụ anya n'oge ahụ niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: Ụra nọ na-anyịgbu ha
  rationale: Nke a na-egosi na ụra dị ha arọ ma na-emeri ha, ọ bụghị nanị na ụra na-atụ ha.
- source_word: διαγρηγορήσαντες
  choice: mgbe ha mụrụ anya nke ọma
  rationale: N'ọnọdụ a, ngwaa Grik a na-adịghị apụtakarị yiri ka ọ na-ekwu na ha bịara mụrụ anya nke ọma mgbe ụra nọ na-anyịgbu ha; ihe e dere n'okpuru peeji na-echekwa nghọta ndị ọzọ o nwere ike inwe.
- source_word: δόξαν
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo a na-ejikarị sụgharịa δόξα, ma ọ na-echekwa mkpa okwu ahụ nwere n'akụkọ a karịa okwu ga-egosi naanị ịma mma anya.
- source_word: τοὺς δύο ἄνδρας
  choice: ndị ikom abụọ ahụ
  rationale: Nke a na-egosi mmadụ abụọ ndị nwoke toro eto, bụ́ Mosis na Ịlaịja dịka amaokwu ndị gbara ya gburugburu si gosi.
- source_word: συνεστῶτας αὐτῷ
  choice: ha na ya guzo
  rationale: Nke a na-echekwa echiche nke ndị ikom ahụ guzo n'ebe ahụ ha na Jizọs, ma bụrụkwa okwu Igbo dị mfe nghọta.
- source_word: δὲ
  choice: ma
  rationale: δὲ nke abụọ na-egosi ọdịiche dị n'etiti ịdị arọ n'ụra na ịhụ ihe ahụ mgbe ha mụrụ anya; a hapụrụ nke mbụ n'enweghị okwu pụrụ iche n'ihi na ọ bụ naanị njikọ akụkọ dị nro.
theological_decisions:
- issue: Ụzọ e si sụgharịa δόξα n'akụkọ mgbanwe ọdịdị Jizọs
  choice: ebube ya
  alternative: ịma mma ya dị ukwuu; ịdị ebube ya
  rationale: “Ebube ya” na-echekwa njikọ okwu a na okwu Akwụkwọ Nsọ ndị ọzọ, n'akwụghị kpọmkwem ụdị ma ọ bụ isi iyi ebube ahụ karịa ihe amaokwu Grik kwuru.
- issue: Nghọta nke διαγρηγορήσαντες
  choice: mgbe ha mụrụ anya nke ọma
  alternative: mgbe ha tetara; ebe ha nọgidere na-amụ anya
  rationale: Nhọrọ a kwekọrọ na ntụnyere ya na ụra nke nọ na-anyịgbu ha, ma ihe e dere n'okpuru peeji na-echekwa ejighị n'aka nke ngwaa Grik a na-adịghị apụtakarị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ihe atụ nke ụra na-anyịgbu ha, ọdịiche nke “ma,” na okwu Akwụkwọ Nsọ bụ “ebube,” n'etinyeghị nkọwa ụka pụrụ iche.
