- from: Ụra nọ na-anyịgbu Pita na ndị ya na ya nọ; ma mgbe ha mụrụ anya nke ọma[a], ha hụrụ ebube ya na ndị ikom abụọ ahụ ha na ya guzo.
  to: Ma ụra dị Pita na ndị so ya arọ; ma mgbe ha mụrụ anya nke ọma[a], ha hụrụ ebube ya na ndị ikom abụọ ahụ guzo n'akụkụ ya.
  rationale: The revision replaces a non-idiomatic expression for being weighed down with sleep with a natural Igbo equivalent, clarifies that the others are Peter’s companions, and smooths the description of the two men. It preserves the source’s contrastive structure, the cautious sense of the rare participle, and the theological-register term “ebube.”
