review_pass:
  verdict: approve
  source_fidelity: 'Nsụgharị ahụ na-edobe ihe bụ isi dị na Grik nke ọma: participle oge (‘Mgbe ... hụrụ’), ndị na-eso ụzọ abụọ a kpọrọ aha, ajụjụ a jụrụ Onyenwe anyị, ọkụ si n’eluigwe ịgbadata, na ikpochapụ ha. ‘Nye ọkụ iwu ka o ... gbadata’ na-egosi nke ọma ike/arịrịọ dị n’εἴπωμεν n’usoro a, ọbụna ma λέγω n’onwe ya bụ ‘ikwu.’ ‘Nke a’ na-akọwa ihe participle ahụ na-ezo aka na ya n’etinyeghị ihe ọhụrụ dị mkpa.'
  naturalness: Igbo a dị mfe, eke, ma nwee ụda kwesịrị ekwesị maka akụkọ Akwụkwọ Nsọ nke oge a. ‘Mgbe ndị na-eso ụzọ ya, Jemis na Jọn, hụrụ nke a’ na ‘ị̀ chọrọ ka anyị nye ọkụ iwu...’ bụ usoro nghọta doro anya. ‘Rechapụ ha’ dabara na ọkụ na echiche ἀναλῶσαι.
  terminology: ‘Onyenwe anyị’ bụ aha nkwanye ùgwù kwesịrị ekwesị maka Κύριε. Aha ‘Jemis’ na ‘Jọn’ na-adaba na usoro aha Akwụkwọ Nsọ Igbo. ‘Ọkụ,’ ‘eluigwe,’ na ‘rechapụ’ na-echekwa onyinyo na ịdị arọ nke okwu Grik ahụ.
