id: LUK.9.54
reference: Luke 9:54
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: ig
  text: Mgbe ndị na-eso ụzọ ya, Jemis na Jọn, hụrụ nke a, ha sịrị, “Onyenwe anyị, ị̀ chọrọ ka anyị nye ọkụ iwu ka o si n’eluigwe gbadata rechapụ ha?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Mgbe ... hụrụ nke a
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge n’Igbo. E tinyere ‘nke a’ iji mee ka ihe ha hụrụ doo anya site n’ihe mere n’amaokwu bu ụzọ.
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: ndị na-eso ụzọ ya, Jemis na Jọn
  rationale: Nkebiokwu a na-akọwa ndị na-eso ụzọ ndị a kpọrọ aha; ‘ya’ na-eme ka njikọ ha na Jizọs doo anya n’Igbo.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nkwanye ùgwù a na-eji akpọ Jizọs ma kwekọọ na κύριε.
- source_word: θέλεις
  choice: ị̀ chọrọ
  rationale: Ọ na-egosi ọchịchọ ma ọ bụ nkwenye Jizọs nke ndị na-eso ụzọ na-arịọ.
- source_word: εἴπωμεν
  choice: ka anyị nye ... iwu
  rationale: Ọ bụ ezie na ngwaa ahụ bụ λέγω, njikọ ya na infinitive ebe a na-egosi okwu e nyere ka ihe mee; ‘nye iwu’ bụ Igbo dị ndụ ma na-egosipụta ike okwu ahụ n’enweghị nkọwa ọzọ.
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: ọkụ ... ka o si n’eluigwe gbadata
  rationale: Nke a na-edobe onyinyo ọkụ nke si n’eluigwe na-agbadata ma na-ada nke ọma n’Igbo.
- source_word: ἀναλῶσαι
  choice: rechapụ
  rationale: Ọ na-edobe echiche ọkụ nke na-erepịa kpamkpam; ọ dị kpọmkwem karịa okwu sara mbara dịka ‘bibie.’
- source_word: αὐτούς
  choice: ha
  rationale: Ọ na-ezo aka n’ụmụ mmadụ nọ n’obodo Sameria ndị jụrụ ịnabata Jizọs.
theological_decisions:
- issue: Ihe ἰδόντες na-ezo aka na ya
  choice: E tinyere ‘nke a,’ nke na-ezo aka n’ajụjụ ndị Sameria jụrụ Jizọs n’amaokwu bu ụzọ.
  alternative: ‘Mgbe Jemis na Jọn hụrụ’ ma ọ bụ ‘Ka ha na-ahụ’
  rationale: Asụsụ Grik ekwughị ihe a hụrụ kpọmkwem, ma ‘nke a’ na-eme ka njikọ akụkọ ahụ doo anya n’Igbo n’etinyeghị echiche ọhụrụ.
- issue: Ike dị n’atụmatụ ndị na-eso ụzọ
  choice: ‘nye ọkụ iwu ka o ... gbadata’
  alternative: ‘kpọdata ọkụ site n’eluigwe’ ma ọ bụ ‘gwa ọkụ ka o gbadata’
  rationale: λέγω pụtara ikwu, ma n’usoro a ọ na-arụ ọrụ dị ka okwu ikike nke ga-eme ka ọkụ gbadata. Nsụgharị a bụ nke eke n’Igbo ma ghara ikwu na ike ahụ sitere n’aka ha n’onwe ha.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jiri ‘rechapụ’ debe ihe atụ ọkụ dị na ἀναλῶσαι. Enweghị akara nkọwa ala peeji n’ihi na nsụgharị bụ isi na-egosipụta ma okwu ahụ na ike ya nke ọma.
