  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: ig
  text: Ọ sịrị ha, “Ma unu onwe unu, ònye ka unu na-asị na m bụ?” Pita zara, “Mesaịa nke Chineke[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst nke Chineke.”'
    reason: Ụzọ ọzọ e si asụgharị aha-ọkwa Χριστός.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: unu onwe unu
  rationale: Nnọchiaha Grik a pụtara ìhè ma nwee nkwusi ike; ‘unu onwe unu’ na-egosipụta ọdịiche dị n’etiti echiche ndị ọzọ na ihe ndị na-eso ụzọ ahụ onwe ha na-ekwu.
- source_word: τίνα με λέγετε εἶναι
  choice: ònye ka unu na-asị na m bụ?
  rationale: Nke a bụ usoro ajụjụ doro anya ma bụrụkwa Igbo ebumpụta ụwa maka okwu Grik nke nwere λέγετε na infinitive εἶναι.
- source_word: ἀποκριθεὶς εἶπεν
  choice: zara
  rationale: Ijikọ participle na ngwaa so ya n’otu ngwaa ‘zara’ na-enye Igbo dị ire n’enweghị ịhapụ ihe okwu ahụ pụtara.
- source_word: Χριστός
  choice: Mezaịa
  rationale: N’ebe a, okwu ahụ bụ aha-ọkwa nke Onye Chineke họpụtara ma tee mmanụ, ọ bụghị aha mmadụ nkịtị. ‘Mezaịa’ na-egosipụta ọrụ ya n’usoro olileanya Izrel, ebe e debere ‘Kraịst’ dị ka ụzọ ọzọ na nkọwa ala peeji.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: Nke a na-edobe njikọ genitive ahụ n’ụzọ kwụ ọtọ ma ghara ikpebi karịa ihe Grik kwuru kpọmkwem.
- source_word: δέ
  choice: Ọ / Ma
  rationale: δέ nke mbụ bụ njikọ akụkọ a na-ekwesịghị ịtụgharị n’ụzọ siri ike, ebe nke abụọ na-egosi ọdịiche; ya mere ‘Ma’ dabara n’ajụjụ ahụ.
theological_decisions:
- issue: Otú e si sụgharịa Χριστός n’okwu nkwupụta Pita
  choice: Mezaịa
  alternative: Kraịst
  rationale: Χριστός bụ aha-ọkwa ebe a, ya mere e ji ‘Mezaịa’ gosi Onye ahụ e tere mmanụ nke Izrel nọ na-atụ anya ya. ‘Kraịst’ bụkwa ntụgharị ọdịnala a na-anabata, nke e debere na nkọwa ala peeji ka a ghara izochi ụzọ ọzọ e si akpọ aha-ọkwa ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Unu onwe unu’ na-edobe nkwusi ike dị na Ὑμεῖς, ebe usoro ajụjụ ‘ònye ka unu na-asị na m bụ?’ na-ada ka Igbo ebumpụta ụwa.
