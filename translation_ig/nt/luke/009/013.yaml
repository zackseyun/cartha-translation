id: LUK.9.13
reference: Luke 9:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Unu onwe unu[a] nye ha ihe ha ga-eri.” Ha wee sị, “Anyị enweghị ihe karịrị ogbe achịcha ise na azụ abụọ—ọ gwụla ma anyị onwe anyị gaa zụta mmadụ ndị a niile[b] nri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Unu nye ha ihe ha ga-eri.” Nnọchiaha Grik e kwuru hoo haa na-emesi “unu” ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “mmadụ ndị a niile” dịka “ìgwè mmadụ a niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε ... ὑμεῖς ... φαγεῖν
  choice: Unu onwe unu nye ha ihe ha ga-eri
  rationale: E tinyere nnọchiaha ὑμεῖς n'ụzọ pụtara ìhè iji mesie ndị a na-agwa okwu ike; “unu onwe unu” na-ebupụta nkwusi ike ahụ. Usoro “nye ha ihe ha ga-eri” bụ Igbo doro anya ma kwekọọ n'ọrụ infinitive φαγεῖν.
- source_word: πλεῖον ἢ
  choice: Ọ dịghị ihe karịrị
  rationale: 'N''ime ahịrịokwu a jụrụ ajụ, okwu ndị a na-egosi oke ihe ha nwere: ihe ha nwere akarịghị nke a kpọrọ aha.'
- source_word: ἄρτοι πέντε
  choice: ogbe achịcha ise
  rationale: ἄρτοι na-ezo aka n'ogbe achịcha ndị a pụrụ ịgụta ọnụ, ọ bụghị naanị achịcha dị ka aha mkpokọta.
- source_word: ἰχθύες δύο
  choice: azụ abụọ
  rationale: Nke a bụ ntụgharị kpọmkwem na nke e ji eme ihe n'Igbo maka azụ abụọ.
- source_word: εἰ μήτι
  choice: ọ gwụla ma
  rationale: Nkebiokwu a na-ewebata ihe nwere ike ịbụ naanị ụzọ ọzọ, ma ka na-ahapụ ntakịrị ụda ajụjụ ma ọ bụ enweghị ntụkwasị obi dị n'okwu Grik.
- source_word: πορευθέντες ... ἀγοράσωμεν
  choice: anyị onwe anyị agaa zụtara
  rationale: Participle na subjunctive ahụ jikọtara omume ịga na ịzụta. “Agaa zụtara” bụ usoro Igbo dị n'okike, ebe “anyị onwe anyị” na-egosipụta nnọchiaha ἡμεῖς e kwuru hoo haa.
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: ndị a niile
  rationale: λαός ebe a bụ ìgwè mmadụ ahụ dum. “Ndị a niile” na-echekwa ma mkpokọta ahụ ma ihe ngosi τοῦτον n'Igbo na-aga were were.
- source_word: βρώματα
  choice: nri
  rationale: Ọ bụ ihe oriri; aha mkpokọta “nri” bụ okwu Igbo kacha dị n'okike n'ọnọdụ a.
theological_decisions:
- issue: Ụda iwu Jizọs na azịza ndị na-eso ụzọ ya
  choice: E gosipụtara iwu ahụ n'ụzọ kwụ ọtọ, tinyekwa nkwusi ike dị na ὑμεῖς, ma etinyeghị iwe, ịkwa emo, ma ọ bụ mba ụta ọzọ.
  alternative: Ịsụgharị ya n'ụda siri ike karị dị ka mba ụta, ma ọ bụ ime ka azịza ndị na-eso ụzọ ya daa ka iwe juru ha.
  rationale: Ihe odide Grik nwere iwu doro anya na nkwusi ike na “unu,” ma ọ naghị akọwa kpọmkwem na onye kwuru okwu were iwe ma ọ bụ na-akwa emo.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji “unu onwe unu” na “anyị onwe anyị” chekwaa nkwusi ike nke nnọchiaha Grik ndị e kwuru hoo haa; e zere ịgbakwụnye mmetụta uche ma ọ bụ nkọwa okwukwe na-adịghị n'ihe odide ahụ.
