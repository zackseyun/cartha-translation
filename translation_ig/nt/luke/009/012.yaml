revisions:
- from: Ụbọchị ahụ malitere ịda, ndị iri na abụọ ahụ bịakwutere ya sị ya, “Zilaga ìgwè mmadụ a, ka ha gaa n’obodo nta na ime obodo ndị gbara ebe a gburugburu, chọta ebe ha ga-anọ, nwetakwa ihe oriri[b], n’ihi na anyị nọ n’ebe tọgbọrọ n’efu[a].”
  to: Ụbọchị ahụ malitere ịda, ndị iri na abụọ ahụ bịakwutere ya sị ya, “Zilaga ìgwè mmadụ a, ka ha gaa n’obodo nta na n’ime ime obodo ndị gbara anyị gburugburu, chọta ebe ha ga-anọ, nwetakwa ihe oriri[b], n’ihi na anyị nọ n’ebe a nke tọgbọrọ n’efu[a].”
