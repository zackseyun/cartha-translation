translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị iri na abụọ ahụ” mee ka aha otu ndị ahụ dịrị dịka ọ dị n’isi mmalite, ma zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
