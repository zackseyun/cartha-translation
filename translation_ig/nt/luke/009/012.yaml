id: LUK.9.12
reference: Luke 9:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: ig
  text: Ụbọchị ahụ malitere ịda, ndị iri na abụọ ahụ bịakwutere ya sị ya, “Zilaga ìgwè mmadụ a, ka ha gaa n’obodo nta na n’ime ime obodo ndị gbara anyị gburugburu, chọta ebe ha ga-anọ, nwetakwa ihe oriri[b], n’ihi na anyị nọ n’ebe a nke tọgbọrọ n’efu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ebe mmadụ na-adịghị ebi.” Okwu Grik ἔρημος nwere ike ịpụta ebe mmadụ na-adịghị ebi ma ọ bụ ebe mmadụ ole na ole bi.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “chọta nri.” Okwu Grik ἐπισιτισμός na-ezo aka n’ihe oriri ma ọ bụ nri e ji akwado njem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: Ụbọchị ahụ malitere ịda
  rationale: Nke a na-edobe ihe atụ dị na κλίνειν, bụ́ na ụbọchị na-ada ka ọ na-eru ná mgbede, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: ndị iri na abụọ ahụ bịakwutere ya
  rationale: “Bịakwutere ya” na-egosi nke ọma na ha bịaruru Jizọs nso; “ndị iri na abụọ ahụ” na-edobe aha otu ahụ n’enweghị ịgbakwunye okwu na-adịghị na isi mmalite.
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: Zilaga ìgwè mmadụ a
  rationale: N’ebe a ἀπολύω pụtara ịchụpụ ma ọ bụ izilaga ndị mmadụ ka ha pụọ; “zilaga” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: ἵνα πορευθέντες
  choice: ka ha gaa
  rationale: Nke a na-egosipụta nzube nke ἵνα na omume nke participle ahụ n’ụzọ Igbo na-asụkarị.
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: n’obodo nta na ime obodo ndị gbara ebe a gburugburu
  rationale: “Obodo nta” na-anọchi κώμας, “ime obodo” na-egosipụta nghọta sara mbara nke ἀγρούς dịka ala ma ọ bụ ebe ndị mmadụ bi n’ime obodo, “ndị gbara ebe a gburugburu” na-edobekwa κύκλῳ.
- source_word: καταλύσωσιν
  choice: chọta ebe ha ga-anọ
  rationale: N’ọnọdụ a καταλύω na-ezo aka n’inweta ebe obibi nwa oge. Okwu a bụ nke nkịtị ma ghara ịkọwapụta ma hà ga-arahụ ụra n’ebe ahụ.
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: nwetakwa ihe oriri
  rationale: ἐπισιτισμός bụ nri ma ọ bụ ihe e ji akwado nri. “Ihe oriri” na-ebute isi echiche ya n’Igbo n’enweghị ịgbasa ya karịa ihe odide ahụ.
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: n’ihi na anyị nọ n’ebe a, n’ebe tọgbọrọ n’efu
  rationale: “Ebe tọgbọrọ n’efu” na-egosi ebe mmadụ na-adịghị ebi nke ọma ma ọ bụ ebe ihe enyemaka na-adịghị, n’ebughị echiche nkà mmụta okpukpe banyere ọzara banye n’amaokwu ahụ; “n’ebe a” na-edobe ὧδε.
