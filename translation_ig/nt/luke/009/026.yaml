revisions:
- from: N’ihi na onye ọ bụla ihere m na okwu m na-eme, Nwa nke Mmadụ ga-emekwa onye ahụ ihere mgbe ọ ga-abịa n’ebube nke ya, na nke Nna, na nke ndị mmụọ ozi dị nsọ.[a]
  to: N’ihi na onye ọ bụla na-enwe ihere maka m na okwu m, Nwa nke Mmadụ ga-enwekwa ihere maka onye ahụ mgbe ọ ga-abịa n’ebube nke ya, na nke Nna, na nke ndị mmụọ ozi dị nsọ.[a]
  rationale: The revision removes an avoidable ambiguity in “ime mmadụ ihere” by using “na-enwe ihere maka,” which clearly denotes being ashamed of. Repeating the expression in the second clause preserves the Greek’s deliberate reciprocity without suggesting that the Son of Man humiliates the person. The glory sequence and footnote anchor are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the generalizing warning, the title “Nwa nke Mmadụ,” the future coming, and the coordinated glory of the Son of Man, the Father, and the holy angels. However, its two uses of “ime mmadụ ihere” are potentially read in current Igbo as causing someone shame or humiliating them, rather than being ashamed of them. This reverses or obscures the reciprocal sense of ἐπαισχύνομαι.
  naturalness: The fronted construction “onye ọ bụla ihere m na okwu m na-eme” is literary and potentially unclear in contemporary Standard Igbo. “Na-enwe ihere maka …” expresses the intended state plainly and permits the reciprocal wording to remain evident.
  terminology: “Nwa nke Mmadụ,” “ebube,” “Nna,” and “ndị mmụọ ozi dị nsọ” are appropriate Standard Igbo theological and biblical terms. The supplied alternative footnote remains a valid clarification of the scope supplied from the single preposition ἐν.
  issues:
  - severity: high
    issue: “ga-emekwa onye ahụ ihere” can mean “will shame/humiliate that person.”
    rationale: The Greek ἐπαισχυνθήσεται means that the Son of Man will be ashamed of the person, not that he will inflict shame on that person. A clearer stative expression is needed in both clauses.
  - severity: medium
    issue: The initial wording is opaque in modern Standard Igbo.
    rationale: Replacing the marked fronted idiom with “na-enwe ihere maka m na okwu m” gives a direct contemporary expression for being ashamed of someone and their words.
  revised_text: N’ihi na onye ọ bụla na-enwe ihere maka m na okwu m, Nwa nke Mmadụ ga-enwekwa ihere maka onye ahụ mgbe ọ ga-abịa n’ebube nke ya, na nke Nna, na nke ndị mmụọ ozi dị nsọ.[a]
  revised_footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “mgbe ọ ga-abịa n’ebube nke ya, na n’ebube nke Nna, na nke ndị mmụọ ozi dị nsọ.”'
    reason: lexical_alternative
  revision_rationale: The revision removes an avoidable ambiguity in “ime mmadụ ihere” by using “na-enwe ihere maka,” which clearly denotes being ashamed of. Repeating the expression in the second clause preserves the Greek’s deliberate reciprocity without suggesting that the Son of Man humiliates the person. The glory sequence and footnote anchor are retained.
