id: LUK.9.26
reference: Luke 9:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: ig
  text: N’ihi na onye ọ bụla na-enwe ihere maka m na okwu m, Nwa nke Mmadụ ga-enwekwa ihere maka onye ahụ mgbe ọ ga-abịa n’ebube nke ya, na nke Nna, na nke ndị mmụọ ozi dị nsọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “mgbe ọ ga-abịa n’ebube nke ya, na n’ebube nke Nna, na nke ndị mmụọ ozi dị nsọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: N’ihi na onye ọ bụla
  rationale: γάρ na-enye ihe kpatara okwu bu ụzọ, ebe ὃς ... ἄν na-eme ka ịdọ aka ná ntị a gbasaa ruo n’onye ọ bụla.
- source_word: ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους
  choice: ihere m na okwu m na-eme
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kwuo ịbụ onye ihe ma ọ bụ mmadụ na-eme ihere; “okwu m” na-edobe λόγους n’ụzọ kwụ ọtọ.
- source_word: τοῦτον
  choice: onye ahụ
  rationale: Ọ na-ezo aka kpọmkwem n’“onye ọ bụla” ahụ, ma bụrụkwa okwu Igbo ebumpụta ụwa karịa ịmanye nnọchiaha nwoke ebe ihe a metụtara mmadụ niile.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Na-edobe aha a Jizọs ji akọwa onwe ya na njikọ ya na ihe odide ndị ọzọ, karịchaa ndabere dị na Daniel.
- source_word: ἐπαισχυνθήσεται
  choice: ga-emekwa onye ahụ ihere
  rationale: Ikwughachi “ihere” na-echekwa nzaghachi kwekọrọ ekwekọ dị n’etiti ngwaa abụọ ahụ; “-kwa” na-eme ka mmeghachi omume ahụ doo anya.
- source_word: ὅταν ἔλθῃ
  choice: mgbe ọ ga-abịa
  rationale: ὅταν tinyere aorist subjunctive na-egosi oge ga-abịa; ụdị a bụ Igbo doro anya ma dị ebumpụta ụwa.
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: n’ebube nke ya, na nke Nna, na nke ndị mmụọ ozi dị nsọ
  rationale: Na-edobe ebube nke Nwa nke Mmadụ, nke Nna, na nke ndị mmụọ ozi dị nsọ n’otu usoro, na-agbakwụnye “nke” dịka ụtọasụsụ Igbo chọrọ.
- source_word: τῶν ἁγίων ἀγγέλων
  choice: ndị mmụọ ozi dị nsọ
  rationale: Nke a na-asụgharị ma aha ahụ ma njirimara ịdị nsọ ha n’Igbo doro anya.
theological_decisions:
- issue: Nnọchiaha nwoke n’usoro okwu gbasara onye ọ bụla
  choice: onye ahụ
  alternative: ya / nwoke ahụ
  rationale: Ọ bụ ezie na Grik ji ụdị nwoke otu mee ihe, ọ na-anọchi anya onye ọ bụla. “Onye ahụ” na-echekwa otu onye na ntụaka kpọmkwem n’enweghị ime ka ịdọ aka ná ntị ahụ yie ihe metụtara naanị ụmụ nwoke.
- issue: Ebube metụtara Nwa nke Mmadụ, Nna, na ndị mmụọ ozi dị nsọ
  choice: n’ebube nke ya, na nke Nna, na nke ndị mmụọ ozi dị nsọ
  alternative: n’ebube nke ya, nakwa n’ebube nke Nna na nke ndị mmụọ ozi dị nsọ
  rationale: Nhọrọ a anaghị ekpebi karịa Grik ma “ebube” a ga-aghọta dịka otu ebube e jikọrọ ọnụ ma ọ bụ ebube e kwuru gbasara ndị a n’usoro; ọ na-echekwa ịdị ukwuu na esemokwu dị n’okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “onye ahụ” zere ntụgharị nwoke kpọmkwem nke nwere ike ime ka ihe gbasara mmadụ niile yie nke ụmụ nwoke naanị. Akara ntụaka [a] dị n’isiokwu ma na-akọwa ụzọ ọzọ e si aghọta njikọ nke ἐν na δόξῃ.
