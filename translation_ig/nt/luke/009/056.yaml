  edition: SBLGNT
  text: ⸀καὶ ἐπορεύθησαν εἰς ἑτέραν κώμην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/056.yaml
  text: And they went on to another village[a].
translation:
  language: ig
  text: Ha wee gaa n’obodo nta ọzọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “obodo nta dị iche.” Okwu Grik ahụ nwere ike imesi ike na ọ bụ obodo nta dị iche, ọ bụghị nanị obodo nta ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: N’akụkọ a, “wee” na-ejikọta ihe omume a na nke bu ya ụzọ n’ụzọ Igbo dị mfe, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: ἐπορεύθησαν
  choice: gaa
  rationale: Okwu a pụtara ịga ma ọ bụ ịkwaga ebe ọzọ; “gaa” bụ okwu Igbo nkịtị ma doo anya n’ebe a.
- source_word: εἰς
  choice: n’
  rationale: Mgbe e jikọtara ya na ngwaa “gaa,” “n’” na-egosi ebe ha na-aga n’ụzọ Igbo sitere n’okike.
- source_word: ἑτέραν
  choice: ọzọ
  rationale: “Ọzọ” na-enye isi echiche nke ebe ọzọ, ma okwu Grik nwekwara ike imesi ịdị iche nke obodo ahụ ike; e debere nke ahụ n’okpuru peeji.
- source_word: κώμην
  choice: obodo nta
  rationale: κώμη bụ obere obodo, ọ bụghị nnukwu obodo; “obodo nta” na-egosipụta ọdịiche ahụ nke ọma.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe, nke oge a, ma kwanyere ederede ùgwù. E ji “wee” mee njikọ akụkọ ka ọ daa nke ọma n’Igbo, a hapụkwara nghọtahie nwere ike ịdị na ἑτέραν n’okpuru peeji.
