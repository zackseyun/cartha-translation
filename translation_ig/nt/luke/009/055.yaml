translation:
  language: ig
  text: Ma ọ tụgharịrị baara ha mba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide e mesịrị na-agbakwụnye, “wee sị, ‘Unu amaghị ụdị mmụọ unu nwere; n’ihi na Nwa nke Mmadụ abịaghị ibibi ndụ ndị mmadụ, kama ọ bịara ịzọpụta ha.’”
