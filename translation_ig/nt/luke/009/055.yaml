lexical_decisions:
- source_word: στραφεὶς
  choice: ọ tụgharịrị
  rationale: Nkebi-ngwaa aorist a na-egosi na Jizọs tụgharịrị chee ndị na-eso ụzọ ya ihu tupu ọ gwa ha okwu; “ọ tụgharịrị” bụ Igbo nkịtị nke na-edobe usoro omume ahụ.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi obere ọdịiche n’etiti arịrịọ ndị na-eso ụzọ ahụ na mmeghachi omume Jizọs; “Ma” dabara nke ọma n’akụkọ Igbo.
- source_word: ἐπετίμησεν
  choice: baara ... mba
  rationale: ἐπιτιμάω pụtara ịkatọ ma ọ bụ ịdọ mmadụ aka ná ntị n’ike. Akpaalaokwu “ịbara mmadụ mba” na-enye echiche nke ịkatọ ha n’okwu n’ụzọ doro anya.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha dative plural a na-ezo aka n’ebe ndị ahụ ọ na-agwa okwu nọ; n’usoro Igbo, “baara ha mba” bụ ụzọ ebumpụta ụwa isi kwuo ya.
theological_decisions:
- issue: Mgbakwunye ogologo dị n’ụfọdụ ihe odide e mesịrị
  choice: 'A sụgharịrị naanị ọgụgụ SBLGNT dị mkpirikpi: “Ma ọ tụgharịrị baara ha mba.”'
  alternative: “Ma ọ tụgharịrị baara ha mba, sị, ‘Unu amaghị ụdị mmụọ unu bụ; n’ihi na Nwa nke Mmadụ abịaghị ibibi ndụ ndị mmadụ, kama ọ bịara ịzọpụta ha.’”
  rationale: Ihe odide Grik e nyere nwere naanị ọgụgụ dị mkpirikpi. E kwesịghị itinye okwu ndị ọzọ dị n’ụfọdụ ihe odide e mesịrị n’ahụ isi, ma n’ihi na ọtụtụ ndị maara ọgụgụ ogologo ahụ, e debere ya n’okpuru peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. “Baara ha mba” bụ akpaalaokwu nkịtị ma sie ike nke ọma maka ịkatọ mmadụ n’okwu. E tinyere akara [a] ozugbo n’ahụ isi.
