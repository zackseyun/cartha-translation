id: LUK.9.33
reference: Luke 9:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: ig
  text: 'Mgbe ha na-apụ n''ebe ọ nọ, Pita sịrị Jizọs, “Onye ndu, ọ dị mma ka anyị nọrọ n''ebe a. Ka anyị rụọ ụlọ ntu atọ[a]: otu maka gị, otu maka Mosis, na otu maka Ịlaịja”—n’amaghị ihe ọ na-ekwu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụlọikwuu,” “ebe obibi nwa oge,” ma ọ bụ, n’ọtụtụ nsụgharị ọdịnala, “ụlọ nta.” Okwu Grik ahụ, skēnai, na-ezo aka n’ebe obibi nwa oge; o nwekwara ike ịkpọta echiche Ememme Ụlọikwuu nke Akwụkwọ Nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: Mgbe ha na-ahapụ ya
  rationale: Akpaokwu Grik a na-egosi ihe mere n'otu oge ahụ, ebe nnọchiaha ‘ha’ na-ezo aka na Mosis na Ịlaịja. Nsụgharị a bụ Igbo e ji eme ihe taa ma na-edobe echiche nke ikewapụ onwe ha n'ebe Jizọs nọ.
- source_word: Ἐπιστάτα
  choice: Nna anyị ukwu
  rationale: Ọ bụ aha nkwanye ùgwù Luk ji akọwa Jizọs dịka onye nwere ikike. ‘Nna anyị ukwu’ na-egosi nkwanye ùgwù na ikike ahụ n'Igbo, ma ọ naghị eme ka okwu ahụ bụrụ naanị ‘Onye ozizi.’
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: ọ dị mma ka anyị nọrọ n'ebe a
  rationale: Nke a na-edobe echiche nkịtị nke καλόν ma na-ada nke ọma n'Igbo.
- source_word: ποιήσωμεν
  choice: Ka anyị wuo
  rationale: Ụdị ngwaa a bụ ndụmọdụ Pita nyere ka ha mee ihe ọnụ. ‘Ka anyị wuo’ bụ okwu Igbo doro anya maka ime ebe obibi ndị a, n'agbanyeghị na ποιέω n'onwe ya pụtara ‘ime.’
- source_word: σκηνὰς
  choice: ụlọ ntakịrị atọ[a]
  rationale: σκηνή na-ezo aka n'ebe obibi a na-arụ nwa oge. ‘Ụlọ ntakịrị’ na-enye onye Igbo oge a echiche doro anya nke ihe nchebe a rụrụ nwa oge, ebe nkọwa ala peeji na-edobe nhọrọ ndị ọzọ na njikọ ememme nwere ike ịdị.
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: Ma ọ maghị ihe ọ na-ekwu
  rationale: Nke a na-egosi na Pita aghọtaghị ihe okwu ya pụtara n'oge ọ na-ekwu ya, ma na-edobe oge ugbu a nke λέγει n'ụzọ Igbo si ekwu ya.
theological_decisions:
- issue: Otú e si asụgharị σκηνάς n'akụkọ mgbanwe ọdịdị Jizọs, ebe o nwere ike ịkpọta echiche Ememme Ụlọ Nta
  choice: ụlọ ntakịrị
  alternative: ụlọikwuu; ebe obibi nwa oge; ụlọ ntu
  rationale: Amaokwu ahụ ekwughị hoo haa na Pita na-ekwu maka Ememme Ụlọ Nta ma ọ bụ ụlọikwuu nsọ. Ya mere, isi ederede ji okwu na-anọpụ iche nke na-egosi ebe obibi a rụrụ nwa oge, ebe nkọwa ala peeji na-echekwa njikọ Akwụkwọ Nsọ ahụ nwere ike ịdị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ usoro okwu na-asọ mfe n'ọnụ ndị nkịtị, ma e tinyere akara nkọwa [a] ozugbo n'akụkụ okwu ọ na-akọwa.
