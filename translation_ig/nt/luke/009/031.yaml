  source_fidelity: 'The draft accurately represents the Greek: the plural subject refers to Moses and Elijah; “pụtara n''ebube” conveys their appearing in glory; “na-ekwu banyere” retains the ongoing speech; and “ọpụpụ ya ... ọ na-aga imezu na Jerusalem” preserves both ἔξοδος and the prospective sense of ἤμελλεν πληροῦν. “Imezu” appropriately reflects πληροῦν (“fulfill”) without narrowing the event to death alone.'
