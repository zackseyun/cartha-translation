id: LUK.9.31
reference: Luke 9:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: ig
  text: Ha pụtara n'ebube, na-ekwu banyere ọpụpụ ya[a], nke ọ na-aga imezu na Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'asụsụ Grik, okwu a bụ “ọpụpụ.” N'ebe a, ọ na-ezo aka n'ọnwụ Jizọs na ihe ga-eso ya na Jerusalem; okwu ahụ nwekwara ike ime ka a cheta Ọpụpụ Izrel.
    reason: Iji chekwaa ma kọwaa nghọta sara mbara na ụda Ọpụpụ dị n'okwu ἔξοδος n'enweghị imechi ya n'otu nkọwa naanị.
lexical_decisions:
- source_word: ἐν δόξῃ
  choice: n'ebube
  rationale: Nke a na-enye echiche nke ịdị n'ọnọdụ ebube ma na-eji okwu Igbo doro anya ma dị ùgwù.
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: ọpụpụ ya
  rationale: “Ọpụpụ” na-edobe okwu ihe atụ nke Grik, nke na-ezo aka n'ọnwụ na nlaghachi Jizọs ma nwee ike ime ka a cheta Ọpụpụ Izrel, kama ịkọwa ya naanị dịka “ọnwụ.”
- source_word: ἤμελλεν πληροῦν
  choice: nke ọ na-aga imezu
  rationale: “Na-aga” na-egosi ihe dị nso ime, ebe “imezu” na-edobe echiche πληροῦν nke ime ka ihe ruo n'uju, ọ bụghị naanị imecha ọrụ nkịtị.
theological_decisions:
- issue: Ihe “ọpụpụ ya” pụtara
  choice: E debere ya dịka “ọpụpụ ya,” ya na nkọwa ala peeji.
  alternative: “Ọnwụ ya” ma ọ bụ “ọnwụ na mbilite n'ọnwụ ya.”
  rationale: Okwu Grik ἔξοδος nwere obosara echiche nke “ọpụpụ/departure,” ma n'akụkọ a ọ na-ezo aka n'ihe ga-eme Jizọs na Jerusalem. Ịsị naanị “ọnwụ” ga-emechi nghọta ahụ nke ukwuu; ịgbakwunye mbilite n'ọnwụ n'ime isiokwu ga-ekwu karịa ihe amaokwu ahụ kwuru kpọmkwem.
- issue: Ike okwu πληροῦν
  choice: imezu
  alternative: ịrụcha
  rationale: “Imezu” na-echekwa echiche nke mmezu dị n'okwu Grik na n'usoro njem Jizọs gaa Jerusalem, n'ebughị echiche ozizi ọzọ abata.
translation_notes:
  register: Standard Igbo dị mfe, nke oge a, ma nwee ùgwù. E ji “ọpụpụ” chekwaa ihe atụ na mgbagwoju nghọta nke asụsụ mbụ; usoro ahịrịokwu ahụ dị mkpụmkpụ ma kwekọọ n'okwu ndị mmadụ na-aghọta.
