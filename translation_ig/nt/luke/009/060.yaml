  terminology: ‘Ndị nwụrụ anwụ,’ ‘lie,’ ‘kwusaa,’ and ‘alaeze Chineke’ are suitable biblical Standard Igbo terms. The main text rightly retains the identical expression for both occurrences of νεκρούς rather than inserting an interpretation.
