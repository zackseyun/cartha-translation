  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: ig
  text: Ma ọ sịrị ya[a], “Hapụ ndị nwụrụ anwụ ka ha lie ndị nwụrụ anwụ nke ha; ma gị onwe gị, gaa kwusaa alaeze Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ndị nwụrụ anwụ” nke mbụ nwere ike ịbụ ihe atụ nke ndị nwụrụ anwụ n’ime mmụọ, ebe nke abụọ na-ekwu maka ndị nwụrụ n’anụ ahụ. Grik ji otu okwu ahụ mee ihe n’ebe abụọ ahụ, ntụgharị a wee chekwaa mmetụta ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: Hapụ
  rationale: Ọ bụ iwu siri ike nke na-agwa onye ahụ ka ọ hapụ ọrụ ahụ; “Hapụ” na-egosipụta nke a n'ụzọ dị nkenke ma doo anya.
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: ndị nwụrụ anwụ ... ndị nwụrụ anwụ nke ha
  rationale: E chekwara otu okwu ahụ ugboro abụọ dịka Grik si mee, ka ilu ahụ dị egwu na nghọta abụọ dị na ya ghara ịla n’iyi.
- source_word: θάψαι
  choice: ka ha lie
  rationale: Nke a na-egosipụta ihe e nyere “ndị nwụrụ anwụ” ohere ime, ma bụrụkwa Igbo nkịtị na-aga nke ọma n’ahịrịokwu a.
- source_word: ἑαυτῶν
  choice: nke ha
  rationale: Okwu a na-echekwa ike nke nnọchiaha ntụgharị ahụ, ya bụ, ndị nwụrụ anwụ bụ nke ha onwe ha.
- source_word: ἀπελθὼν
  choice: gaa
  rationale: Ọ bụ participle aorist nke na-ebute iwu bụ isi. N’Igbo, “gaa kwusaa” na-egosipụta usoro omume ahụ n'ụzọ eke karịa ntụgharị okwu n’otu n’otu.
- source_word: διάγγελλε
  choice: kwusaa
  rationale: Okwu a na-egosi ikwupụta ozi n’ihu ọha ma gbasaa ya; “kwusaa” bụ okwu Igbo kwesịrị ekwesị n’ọnọdụ ozi banyere alaeze Chineke.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Akwụkwọ Nsọ a maara nke ọma, ma na-egosikwa ọchịchị Chineke n’enweghị ịgbakwunye nkọwa pụrụ iche.
theological_decisions:
- issue: Ihe “ndị nwụrụ anwụ” pụtara n’ebe mbụ na nke abụọ
  choice: E ji “ndị nwụrụ anwụ” mee ihe n’ebe abụọ ahụ n’enweghị ịkọwa nke mbụ dịka ọnwụ ime mmụọ n’ahịrịokwu bụ isi.
  alternative: Hapụ ndị nwụrụ anwụ n’ime mmụọ ka ha lie ndị nwụrụ anwụ nke ha.
  rationale: Okwu Jizọs bụ ilu siri ike nke nwere nghọta abụọ. O yikarịrị ka nke mbụ na-ekwu maka ndị na-adịghị aza Chineke, ebe nke abụọ na-ekwu maka ndị nwụrụ n’anụ ahụ; ma Grik ji otu okwu ahụ mee ihe n’ebe abụọ ahụ. Ya mere, ntụgharị a na-echekwa esemokwu na nghọta abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị nsọ ma dị mfe nghọta. “Ma gị onwe gị” na-egosipụta nkwusi ike dị na σὺ δέ, ebe “gaa kwusaa” na-ada nke ọma n’Igbo ma chekwaa usoro na ebumnobi nke ἀπελθὼν διάγγελλε.
