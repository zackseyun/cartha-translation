id: LUK.9.51
reference: Luke 9:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: ig
  text: Mgbe ụbọchị a ga-ebuli ya elu[a] na-erucha, o kpebisiri ike[b] ịga Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụbọchị nrigo ya n’eluigwe.” Grik kwuru n’ụzọ nkịtị banyere “ịbụ onye a na-ebuli elu.”
    reason: alternative_reading
  - marker: b
    text: Grik kwuru n’ụzọ nkịtị, “o mere ka ihu ya kwụsie ike,” akpaalaokwu na-egosi mkpebi siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: o wee
  rationale: Nke a bụ usoro Luk ji ebugharị akụkọ gaa n’ihe ọzọ. “O wee” na-egosipụta njikọ na mmegharị akụkọ ahụ n’Igbo nkịtị, n’etinyeghị okwu oge dịka “ugbu a” nke na-adịghị na Grik.
- source_word: ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας
  choice: Mgbe ụbọchị ... na-erucha
  rationale: “Mgbe” na-egosipụta ọrụ oge nke ἐν τῷ, ebe “na-erucha” na-edobe echiche nke oge ahụ nọ n’usoro iru n’uju ma ọ bụ mmezu.
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: a ga-eji bulie ya elu
  rationale: Nke a na-edobe isi echiche nke ἀνάλημψις, ya bụ ịbụ onye a na-ebuli elu, n’akọwaghị ya naanị dị ka nrigo ya n’eluigwe. Ya mere, ọ na-ahapụ obosara na esemokwu dị n’okwu Grik ahụ.
- source_word: καὶ αὐτὸς
  choice: o wee
  rationale: Onye nnọchiaha ahụ na-emesi onye ahụ ike, ma ikwughachi “ya onwe ya” ga-ada arọ n’Igbo ebe a. Mkpebi siri ike e kwuru n’ahịrịokwu na-eburu isi nkwusi ike ahụ.
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: kpebisie ike
  rationale: 'N’Igbo nke oge a, nke a na-enye ihe akpaalaokwu Semitik ahụ pụtara n’ụzọ doro anya: o mere mkpebi siri ike. A na-edobe ọdịdị okwu mbụ ahụ n’ihe odide ala peeji.'
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: ịga Jerusalem
  rationale: Nke a na-enye nzube nke infinitive ahụ na ebe njem ahụ na-aga n’ụzọ dị nkenke ma bụrụ Igbo nkịtị.
theological_decisions:
- issue: Oke ihe ἀναλήμψεως αὐτοῦ na-ezo aka na ya
  choice: a ga-eji bulie ya elu
  alternative: nrigo ya n’eluigwe; ọpụpụ ya
  rationale: Okwu Grik ahụ pụtara n’ụzọ bụ isi ịbụ onye a na-ebuli elu. Nsụgharị sara mbara a anaghị ekpebi na ọ na-ezo naanị n’oge nrigo n’eluigwe, kama ọ na-ahapụ ohere ka njem Jizọs site n’ọnwụ, mbilite n’ọnwụ, ruo n’ebuli ya elu bụrụ ihe a na-ahụkọ ọnụ.
- issue: Ike akpaalaokwu τὸ πρόσωπον ἐστήρισεν
  choice: kpebisie ike
  alternative: o mere ka ihu ya kwụsie ike
  rationale: Nsụgharị isi na-ebute mkpebi siri ike nke akpaalaokwu ahụ pụtara n’Igbo doro anya, n’etinyeghị nkọwa ozizi ọzọ. Ihe odide ala peeji na-egosi oyiyi ihu dị n’okwu mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-erucha” iji gosi na oge ahụ nọ n’usoro iru mmezu; “kpebisie ike” na-eme ka akpaalaokwu Grik doo onye Igbo anya, ebe ihe odide ala peeji na-echekwa oyiyi okwu mbụ.
