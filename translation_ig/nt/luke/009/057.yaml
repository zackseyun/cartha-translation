  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: ig
  text: Ka ha na-aga n'ụzọ, otu onye sịrị ya, “Aga m eso gị ebe ọ bụla ị na-aga[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ ka nso n'okwu Grik, “ebe ọ bụla ị ga-aga” ma ọ bụ “ebe ọ bụla ị ga-apụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: Ka ha na-aga
  rationale: Nkebi okwu a na-egosi na ihe ahụ mere n'otu oge ahụ ha nọ na-aga; nsụgharị a bụ Igbo nkịtị ma na-echekwa echiche nke njem na-aga n'ihu.
- source_word: ἐν τῇ ὁδῷ
  choice: n'ụzọ
  rationale: Nke a na-egosi ụzọ ha nọ na ya n'ụzọ doro anya, ma ọ ka na-ahapụkwa ụda njem dị n'akwụkwọ Luk.
- source_word: εἶπέν τις
  choice: otu onye sịrị
  rationale: τις bụ onye a na-akọwaghị kpọmkwem. ‘Otu onye’ anaghị agbakwụnye na onye ahụ bụ nwoke, ebe Grik ekwughị nke ahụ n'amaokwu a.
- source_word: πρὸς αὐτόν
  choice: ya
  rationale: N'usoro ‘sịrị ya,’ nke a bụ ụzọ Igbo si ekwu okwu n'ụzọ ebumpụta ụwa mgbe a na-agwa mmadụ okwu.
- source_word: Ἀκολουθήσω σοι
  choice: Aga m eso gị
  rationale: Nke a na-egosi mkpebi onye ahụ maka ọdịnihu, ma ‘iso’ na-echekwa ma iso mmadụ n'ụzọ nkịtị ma echiche nke ịbụ onye na-eso ụzọ.
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: ebe ọ bụla ị na-aga
  rationale: ‘Ebe ọ bụla’ na-echekwa echiche nke ọnọdụ a na-akọwaghị ókè; ‘ị na-aga’ bụ Igbo dị mfe ma kwekọọ n'ọnọdụ a, ebe ndetu ala na-egosi ntụgharị ndị ka nso n'okwu Grik.
theological_decisions:
- issue: Ihe ἀκολουθέω pụtara banyere ịbụ onye na-eso ụzọ
  choice: Aga m eso gị
  alternative: Aga m abụ onye na-eso ụzọ gị
  rationale: ‘Iso gị’ na-echekwa ma mmegharị nkịtị ma ihe ọ pụtara banyere ịbụ onye na-eso ụzọ, n'etinyeghị nkọwa okpukpe karịrị ihe okwu Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee nsụgharị ahụ. E zere ịkpọ onye ahụ nwoke n'ihi na isi mmalite Grik akọwaghị okike ya. E debere akara ndetu [a] ozugbo n'akụkụ okwu ndetu ahụ na-akọwa.
