review_pass:
  verdict: revise
  source_fidelity: The main text accurately represents the genitive absolute ('Ka ha na-aga'), the indefinite subject ('otu onye'), the future commitment ('Aga m eso gị'), and the unrestricted destination expressed by ὅπου ἐὰν ἀπέρχῃ. It does not add a gender to τις. The present-form wording 'ebe ọ bụla ị na-aga' is idiomatic Igbo and adequately conveys the Greek indefinite 'wherever you go' in context.
  naturalness: The verse is clear, natural Standard Igbo, and its narrative register is appropriate. 'Sịrị ya' is idiomatic for speaking to someone, and 'iso gị' naturally carries both the physical and discipleship senses without overexplaining either.
  terminology: '''Iso'' is the appropriate established Igbo term for ἀκολουθέω here. No doctrinal expansion has been introduced. The footnote needs revision: ''ị pụrụ ịga'' ordinarily means ''you are able/can go,'' which introduces an ability sense not present in the Greek ἐάν construction.'
  issues:
  - severity: low
    issue: The first alternative in footnote [a] uses 'ị pụrụ ịga.'
    rationale: In contemporary Standard Igbo this normally expresses ability ('you can/are able to go'), rather than the indefinite or contingent force of ὅπου ἐὰν ἀπέρχῃ. Replace it with a future/indefinite formulation such as 'ị ga-aga.'
  revised_text: Ka ha na-aga n'ụzọ, otu onye sịrị ya, “Aga m eso gị ebe ọ bụla ị na-aga[a].”
  revised_footnotes:
