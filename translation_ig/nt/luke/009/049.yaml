  to: Jọn wee zaa sị, “Nna Ukwu, anyị hụrụ otu onye ka ọ na-achụpụ mmụọ ọjọọ n’aha gị, anyị wee gbalịa igbochi ya, n’ihi na ọ naghị eso anyị aga.[a]”
  rationale: E megharịrị naanị idiom “n’aha gị” ka ọ soro ἐν τῷ ὀνόματί σου nke ọma, ma dozie “mmụọ ọjọọ” ka ọ bụrụ okwu Igbo nkịtị. A chekwabara imperfect ahụ n’“anyị wee gbalịa igbochi ya,” nakwa ihe μεθ’ ἡμῶν pụtara n’“ọ naghị eso anyị aga.” Ihe odide ala na-echekwa ụzọ ọzọ a pụrụ isi ghọta ya n’enweghị ikpebi na nwoke ahụ jụrụ iso Jizọs.
