  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: ig
  text: Jọn wee zaa sị, “Nna Ukwu, anyị hụrụ otu onye ka ọ na-achụpụ mmụọ ọjọọ n’aha gị, anyị wee gbalịa igbochi ya, n’ihi na ọ naghị eso anyị aga.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ọ naghị eso anyị.” N’asụsụ Grik, okwu ahụ kpọmkwem bụ “ọ naghị eso anyị aga,” nke pụrụ imesi ike na onye ahụ esoghị n’ìgwè ndị na-eso ụzọ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ Ἰωάννης εἶπεν
  choice: Jọn wee zaa sị
  rationale: “Wee” na-arụ ọrụ dị ka njikọ akụkọ δέ, ebe “zaa sị” na-egosipụta nke ọma na Jọn kwuru okwu dịka nzaghachi.
- source_word: Ἐπιστάτα
  choice: Nna Ukwu
  rationale: N'akwụkwọ Luk, okwu a bụ aha ndị na-eso ụzọ ji akpọ Jizọs nke na-egosi ịbụ onyeisi na onye nwere ikike. “Nna Ukwu” bụ okwu Igbo dị ùgwù ma ghara ime ka ọ bụrụ nanị “Onye Ozizi.”
- source_word: εἴδομέν τινα
  choice: anyị hụrụ otu onye
  rationale: “Otu onye” na-edobe enweghị nkọwa kpọmkwem dị na τινα ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: ἐν τῷ ὀνόματί σου
  choice: na-eji aha gị
  rationale: Nke a na-egosi ime ihe site n’aha Jizọs na ikike aha ahụ, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: ἐκβάλλοντα δαιμόνια
  choice: achụpụ ndị mmụọ ọjọọ
  rationale: “Ịchụpụ ndị mmụọ ọjọọ” bụ ụzọ Igbo doro anya na nke a maara nke ọma isi kọwaa ịchụ mmụọ ọjọọ pụọ.
- source_word: ἐκωλύομεν
  choice: anyị wee gbalịa igbochi ya
  rationale: “Gbalịa igbochi” na-egosipụta omume a na-eme ma ọ bụ nke a nwara ime, kwekọọ na imperfect ἐκωλύομεν, n’enweghị ikwu hoo haa na ha kwụsịrị ya kpamkpam.
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: n’ihi na ọ naghị eso anyị aga
  rationale: “Eso anyị aga” na-edobe μετά, ya bụ iso ha nọ n’otu, kama ime ka okwu ahụ bụrụ nanị na onye ahụ anaghị eso ha dịka ndịisi ya.
theological_decisions:
- issue: Ihe nwere ike ịpụta ụzọ abụọ n’ihe ndị na-eso ụzọ ji mee mkpesa
  choice: ọ naghị eso anyị aga
  alternative: ọ naghị eso anyị
  rationale: “Eso anyị aga” na-echekwa echiche μεθ’ ἡμῶν, “soro anyị,” nke nwere ike igosi na onye ahụ esoghị n’ìgwè ndị na-eso ụzọ. Ọ naghị ekpebi n’enweghị ihe akaebe na onye ahụ jụrụ iso Jizọs n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ okwu gbasara onye ahụ esoghị “anyị” ka ọ nwee esemokwu na nghọta dị n’asụsụ Grik, n’enweghị ịkọwa ya dịka ịjụ Jizọs.
