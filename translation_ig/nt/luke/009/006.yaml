  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: ig
  text: Ha wee pụọ, na-agagharị n’obodo nta dị iche iche[a], na-ekwusa ozi ọma[b] ma na-agwọ ọrịa n’ebe niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “site n’otu obodo nta ruo n’obodo nta ọzọ.” Okwu Grik ahụ pụrụ igosi na ha na-agagharị n’obodo nta ndị ahụ n’otu n’otu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “na-ezisa ozi ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: ha pụtara gaa
  rationale: Nkebi a na-egosi na ha si ebe ha nọ pụọ malite njem ahụ; ‘pụtara gaa’ bụ okwu Igbo doro anya ma kwekọọ n’usoro akụkọ.
- source_word: δὲ
  choice: Ya mere
  rationale: δὲ na-aga n’ihu n’akụkọ ma na-ejikọ ihe ha mere na ozi Jizọs nyere ha n’amaokwu bu ụzọ.
- source_word: διήρχοντο
  choice: gaa site n’otu ... ruo n’... ọzọ
  rationale: Ụdị imperfect na-egosi njem na-aga n’ihu site n’ebe ruo n’ebe; usoro Igbo a na-egosipụta mmegharị ahụ n’ụzọ eke.
- source_word: κατὰ τὰς κώμας
  choice: site n’otu obodo nta ruo n’obodo nta ọzọ
  rationale: κατά ya na accusative nwere nghọta distributive ebe a, ya bụ, ha na-agagharị n’obodo nta dị iche iche.
- source_word: εὐαγγελιζόμενοι
  choice: na-ekwusa ozi ọma
  rationale: Nke a na-egosi ikwupụta ozi ọma n’ihu ọha; okwu a bụ nke doro ndị Igbo taa anya ma ghara ịgbakwunye nkọwa nkà mmụta okpukpe na-adịghị n’amaokwu ahụ.
- source_word: θεραπεύοντες
  choice: na-agwọkwa ndị ọrịa
  rationale: θεραπεύω n’ebe a na-ekwu maka ime ka ndị na-arịa ọrịa dịrị mma; itinye ‘ndị ọrịa’ na-eme ka Igbo ahụ zuo oke ma bụrụ nke eke.
- source_word: πανταχοῦ
  choice: n’ebe niile
  rationale: Ọ na-emesi ike na ozi na ọgwụgwọ ha ruru ebe niile ha gara.
theological_decisions:
- issue: Uche εὐαγγελιζόμενοι nwere n’ozi ndị na-eso ụzọ
  choice: na-ekwusa ozi ọma
  alternative: na-ekwusa oziọma
  rationale: ‘Na-ekwusa ozi ọma’ na-echekwa omume ikwupụta ozi ọma ahụ n’ụzọ ndị mmadụ na-aghọta, na-enweghị ịmanye nkọwa pụrụ iche sitere n’òtù ụka ọ bụla.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘obodo nta’ sụgharịa κώμη, e jikwa usoro ‘site n’otu ... ruo n’... ọzọ’ mee ka nghọta distributive nke Grik pụta ìhè.
