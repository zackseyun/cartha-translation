revisions:
- from: Ya mere, ha pụtara gaa site n’otu obodo nta ruo n’obodo nta ọzọ[a], na-ekwusa ozi ọma[b], na-agwọkwa ndị ọrịa n’ebe niile.
  to: Ha wee pụọ, na-agagharị n’obodo nta dị iche iche[a], na-ekwusa ozi ọma[b] ma na-agwọ ọrịa n’ebe niile.
  rationale: The revision uses a mild narrative connector for δέ, replaces an awkward departure expression with idiomatic Standard Igbo, represents the imperfect/distributive travel naturally, and removes an object supplied beyond the Greek. The footnote set retains the viable distributive alternative and replaces a mere spelling variant with a genuine lexical alternative.
  reviewer_model: gpt-5.6-terra
