source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: ig
  text: N’ihi na onye ọ bụla chọrọ ịzọpụta ndụ ya ga-atụfu ya[a]; ma onye ọ bụla tụfuru ndụ ya n’ihi m ga-azọpụta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi ya” ma ọ bụ “onwe ya”; okwu Grik ahụ nwere ike ịpụta ndụ, mkpụrụ obi, ma ọ bụ onwe onye, dabere n’ọnọdụ okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: N’ihi na onye ọ bụla chọrọ
  rationale: ὃς ... ἂν na subjunctive na-egosi ọnọdụ izugbe, ya mere ‘onye ọ bụla’; γάρ jikọtara okwu a n’ụzọ nkọwa na nke bu ya ụzọ, ebe θέλῃ pụtara ‘chọrọ.’
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: ndụ ya
  rationale: ψυχή nwere ike ịpụta ndụ, mkpụrụobi, ma ọ bụ onwe onye. N’ọnọdụ a, esemokwu dị n’etiti ichekwa na ịtụfu ndụ n’ihi iso Jizọs mere ka ‘ndụ ya’ bụrụ okwu kacha doo anya, ma e debere nghọta ndị ọzọ n’ala peeji.
- source_word: σῶσαι / σώσει
  choice: ịzọpụta / ga-azọpụta
  rationale: E ji otu mgbọrọgwụ Igbo mee ebe abụọ ahụ iji chekwaa njikọ okwu na mgbagwoju anya e ji kwuo na Grik.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ga-atụfu / tụfuru
  rationale: ‘Ịtụfu’ na-egosi mfu karịa imebi onwe onye, ma na-echekwa nhazi yiri ibe ya nke akụkụ abụọ ahụ.
- source_word: ἕνεκεν ἐμοῦ
  choice: n’ihi m
  rationale: Nkebiokwu a na-egosi ihe kpatara ya ma ọ bụ ebumnobi ya; ‘n’ihi m’ bụ Igbo nkịtị nke na-edebe Jizọs dị ka isi ihe gbasara iso ụzọ ya.
- source_word: οὗτος
  choice: onye ahụ (egosighi ya iche n’ahịrị)
  rationale: οὗτος na-emesi onye ahụ akọwara ike, ma n’Igbo, ikwughachi ‘onye ahụ’ ga-adị arọ; isiokwu nke ‘ga-azọpụta ya’ na-enye otu ntụaka ahụ n’ụzọ eke.
theological_decisions:
- issue: Ihe ψυχή pụtara n’okwu mgbagwoju anya Jizọs
  choice: ndụ
  alternative: mkpụrụobi; onwe onye
  rationale: Ọnọdụ gbara ya gburugburu na-ekwu maka ịjụ onwe onye na ịtụfu ndụ n’ihi Jizọs. ‘Ndụ’ na-enye nghọta ahụ ozugbo n’enweghị ịkpa ya ókè ka ọ bụrụ naanị akụkụ mmadụ a na-akpọ mkpụrụobi; ala peeji na-echekwa obosara okwu Grik ahụ.
- issue: Ntụaka nwoke otu onye e ji anọchi mmadụ niile
  choice: onye ọ bụla ... ndụ ya
  alternative: ndị ọ bụla ... ndụ ha
  rationale: Grik ji otu onye n'ụdị nwoke kwuo ihe gbasara mmadụ ọ bụla. Igbo ‘onye ọ bụla ... ya’ na-echekwa otu ọnụọgụ ahụ ma na-arụ ọrụ dịka ntụaka mmadụ niile.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E debere njikọ nkọwa ‘N’ihi na,’ ọdịiche ‘ma,’ na nhazi yiri ibe ya nke ‘ịzọpụta/ịtụfu.’ Akara ala peeji [a] pụtara n’ahịrị isi.
