id: LUK.9.2
reference: Luke 9:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: ig
  text: O wee zipụ ha ka ha kwusaa alaeze Chineke[a] ma gwọọ ndị ọrịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọchịchị Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: zipụ ha
  rationale: “Zipụ” na-egosipụta iziga mmadụ ka ọ gaa rụọ ọrụ e nyere ya, ma dabara n'okwu a nke inye ndị ahụ ozi.
- source_word: κηρύσσειν
  choice: kwusaa
  rationale: “Kwusaa” pụtara ime ka ozi mara n'ihu ọha, wee chekwaa ike nke ngwaa Grik ahụ n'asụsụ Igbo dị ugbu a.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Baịbụl a maara nke ọma n'Igbo, ọ na-echekwakwa obosara echiche nke ma ọchịchị Chineke ma mpaghara ọ na-achị.
- source_word: ἰᾶσθαι
  choice: gwọọ
  rationale: “Gwọọ” bụ okwu Igbo nkịtị na nke doro anya maka ime ka onye ọrịa gbakee.
- source_word: τοὺς ἀσθενεῖς
  choice: ndị ọrịa
  rationale: Ọ bụ ezie na ἀσθενής nwekwara ike ịpụta ndị na-adịghị ike, njikọ ya na “ịgwọ” na-egosi na ndị na-arịa ọrịa ka a na-ekwu maka ha ebe a.
theological_decisions:
- issue: Ihe βασιλεία τοῦ θεοῦ pụtara
  choice: alaeze Chineke
  alternative: ọchịchị Chineke
  rationale: “Alaeze Chineke” na-echekwaba echiche sara mbara nke okwu ahụ, ebe “ọchịchị Chineke” na-eme ka akụkụ nke ịchị achị pụta ìhè karịa. E debere nke ọzọ n'ala ala peeji ka ambiguïtị okwu Grik ahụ ghara ifu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E ji “O wee” mee ka njikọ καὶ na akụkọ gara n'ihu pụta n'ụzọ ebumpụta ụwa; e zere okwu ụka pụrụ iche n'ịsụgharị κηρύσσειν.
