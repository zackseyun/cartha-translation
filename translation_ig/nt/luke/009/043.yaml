  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: ig
  text: 'Ha niile juru nnọọ anya n’ihi ịdị ukwuu nke Chineke.[a] Ma mgbe mmadụ niile nọ na-atụ n’anya n’ihi ihe niile ọ na-eme, ọ gwara ndị na-eso ụzọ ya, sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ịdị ebube nke Chineke.” Okwu Grik μεγαλειότης pụtara ịdị ukwuu, ịdị ebube, ma ọ bụ ịdị ukwu pụtara ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: jukwara ... anya
  rationale: Akpaalaokwu Igbo a na-egosi oke ịtụ n’anya n’ụzọ doro anya ma bụrụkwa nke ndị mmadụ na-asụkarị.
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: Ịdị ukwuu nke Chineke
  rationale: “Ịdị ukwuu” na-eburu echiche nke μεγαλειότης—ịdị ukwu, ịdị ebube, ma ọ bụ ịdị ukwuu pụtara ìhè—n’enweghị ịgbakwụnye nkọwa okpukpe na-adịghị n’ederede.
- source_word: Πάντων δὲ θαυμαζόντων
  choice: Ma mgbe mmadụ niile nọ na-atụ n’anya
  rationale: E ji nkebiokwu oge sụgharịa genitive absolute ahụ. “Na-atụ n’anya” na-edobe ọdịiche dị n’etiti θαυμάζω na okwu siri ike karị, ἐκπλήσσομαι, dị na nkebiokwu mbụ.
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: n’ihi ihe niile ọ nọ na-eme
  rationale: “N’ihi” na-egosi ihe kpatara ịtụ n’anya, ebe “ọ nọ na-eme” na-edobe omume na-aga n’ihu nke imperfect ἐποίει.
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ọ gwara ndị na-eso ụzọ ya, sị
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si webata okwu onye kwuru, ma “ndị na-eso ụzọ ya” na-asụgharị μαθητὰς αὐτοῦ nke ọma.
theological_decisions:
- issue: Onye nnọchiaha “ọ” na οἷς ἐποίει na εἶπεν na-ezo aka na ya
  choice: E debere “ọ” ka ọ na-ezo aka na Jizọs dịka onye na-eme ihe na onye na-ekwu okwu n’akụkọ ahụ.
  alternative: A pụrụ imesi ọrụ Chineke ike n’ihi okwu bu ya ụzọ, “ịdị ukwuu nke Chineke.”
  rationale: Ọdịnaya akụkọ ahụ na-egosi Jizọs dịka onye na-eme ihe na onye na-agwa ndị na-eso ụzọ ya okwu. N’agbanyeghị nke ahụ, amaokwu ahụ na-akpọ ihe pụtara ìhè “ịdị ukwuu nke Chineke,” ya mere nsụgharị ahụ anaghị agwakọta Jizọs na Chineke ma ọ bụ kpochapụ njikọ dị n’etiti ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee nsụgharị ahụ. E tinyere akara ntụaka [a] ozugbo n’akụkụ okwu ọ na-akọwa.
