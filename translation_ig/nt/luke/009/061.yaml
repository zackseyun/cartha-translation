source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: ig
  text: Onye ọzọ kwukwara, “Aga m eso gị, Onyenwe anyị, ma buru ụzọ kwe ka m gaa sị ndị nọ n’ụlọ m ka ha nọdụ nke ọma[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka m gaa sị ndị nọ n’ụlọ m nke ọma mgbe m na-apụ.” Okwu Grik ahụ pụtara ịsị ndị mmadụ nke ọma mgbe mmadụ na-apụ; “ndị nọ n’ụlọ m” pụrụ ịgụnye ndị nọ n’ụlọ ya ma ọ bụ ndị nke ụlọ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: Onye ọzọ kwukwara
  rationale: Nke a na-ejikọta okwu onye a na ndị kwuru okwu tupu ya ma na-egosi na ọ bụ onye ọzọ ọzọ sonyere; “kwukwara” na-eburu ma njikọ ma echiche nke mgbakwunye n’Igbo ebumpụta ụwa.
- source_word: Ἀκολουθήσω σοι
  choice: Aga m eso gị
  rationale: Ụdị ọdịnihu a na-egosi mkpebi onye ahụ kwuru na o nwere; nsụgharị a doro anya ma bụrụkwa okwu Igbo a na-asụ ugbu a.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Aha a na-echekwa ma nkwanye ùgwù dị n’ịkpọ Jizọs okwu ma ibu nkà mmụta okpukpe nke κύριος, n’etinyeghị ya naanị n’ọkwa “nna ukwu” ma ọ bụ “nna m.”
- source_word: πρῶτον δὲ ἐπίτρεψόν μοι
  choice: ma buru ụzọ kwe ka m
  rationale: “Buru ụzọ” na-egosi ihe a chọrọ ime tupu iso Jizọs, ebe “kwe ka m” na-enye arịrịọ maka ikike n’Igbo dị mfe ma dị ugwu.
- source_word: ἀποτάξασθαι
  choice: gaa sị … ka ha nọdụ nke ọma
  rationale: N’ọnọdụ a, ngwaa a pụtara ịla mmadụ n’udo ma ọ bụ ịsị ya ka ọ nọdụ nke ọma. Nke a bụ ụzọ Igbo ebumpụta ụwa si ekwu okwu onye na-apụ apụ.
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: ndị nọ n’ụlọ m
  rationale: Nkebiokwu Grik ahụ na-ezo aka n’ebe ndị ahụ nọ ma ọ bụ njikọ ha na ụlọ onye na-ekwu okwu. Nsụgharị a na-edebe okwu “ụlọ” n’ebughị ụzọ kpebie na ọ pụtara naanị ndị ikwu ya.
theological_decisions:
- issue: Nsụgharị κύριε mgbe a na-akpọ Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna ukwu; nna m
  rationale: “Onyenwe anyị” na-echekwa ohere na okwu ahụ bụ ma okwu nkwanye ùgwù ma nkwupụta nwere ibu karịrị nke ahụ. Ịsụgharị ya naanị “nna m” ga-eme ka ibu a belata, ebe “Nna ukwu” nwere ike ime ka ọ bụrụ naanị aha onyeisi.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu ma dị mfe nghọta mee ihe. “Sị … ka ha nọdụ nke ọma” bụ okwu Igbo nkịtị onye na-apụ ji asị ndị ọ na-ahapụ ka ha nọrọ n’udo; ọ na-enye echiche ἀποτάξασθαι n’ụzọ ebumpụta ụwa. E debere “ndị nọ n’ụlọ m” ka a ghara ịkọwa ndị ahụ kpọmkwem dị ka naanị ezinụlọ ma ọ bụ ndị niile mejupụtara household.
