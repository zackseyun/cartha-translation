  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: ig
  text: ìhè maka mkpughe nye ndị mba ọzọ[a], na ebube nke ndị gị, bụ́ Izrel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ìhè maka mkpughe nye mba dị iche iche.” Okwu Grik ahụ nwere ike ịpụta mba n’ozuzu, ma n’ebe a o yikarịrị ka ọ na-ekwu maka ndị mba ọzọ n’ihi ọdịiche dị n’etiti ha na Izrel.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ìhè
  rationale: “Ìhè” bụ ntụgharị Igbo doro anya ma kwekọọ n’oyiyi abụ ahụ; Igbo achọghị mkpụrụokwu na-egosi “otu” ebe a.
- source_word: εἰς ἀποκάλυψιν
  choice: nke ga-ekpughere
  rationale: 'Nkebi a na-egosipụta nzube ma ọ bụ ihe ìhè ahụ ga-arụpụta: ime ka ihe pụta ìhè nye ndị mba ọzọ. Usoro ngwaa a bụ nke Igbo nkịtị ma na-echekwa echiche nke mkpughe.'
- source_word: ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ihi na a kpọrọ Izrel iche n’ahịrị na-esote, “ndị mba ọzọ” na-egosi ndị na-abụghị ndị Juu n’ụzọ ndị na-agụ Igbo ga-aghọta; ihe odide ala na-echekwa ntụgharị sara mbara, “mba dị iche iche.”
- source_word: καὶ
  choice: na
  rationale: 'Njikọ a na-ejikọta akụkụ abụọ yiri ibe ha: ìhè maka mkpughe na ebube nke Izrel.'
- source_word: δόξαν
  choice: ebube
  rationale: “Ebube” na-echekwa echiche nke nsọpụrụ na ịdị ebube dị n’okwu Grik ahụ.
- source_word: λαοῦ σου Ἰσραήλ
  choice: ndị gị, bụ́ Izrel
  rationale: Nke a na-egosi n'ụzọ Igbo dị mma na Izrel bụ ndị nke Chineke, ma na-echekwa njirimara apposition dị n'okwu Grik.
theological_decisions:
- issue: Ihe ἐθνῶν pụtara ma e jiri ya tụnyere Izrel
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: Ọnọdụ okwu ahụ na-ekewapụ ἐθνῶν na “ndị gị, bụ́ Izrel,” ya mere ọ na-elekwasị anya n’ebe ndị na-abụghị Izrel nọ. Ma ebe okwu Grik ahụ nwekwara ike ịpụta mba n’ozuzu, a hapụrụ nke ahụ n’ihe odide ala.
- issue: Mmekọrịta dị n'etiti φῶς na εἰς ἀποκάλυψιν
  choice: ìhè nke ga-ekpughere
  alternative: ìhè maka mkpughe nye
  rationale: Usoro ahọpụtara na-egosi nzube/ọrụ nke ìhè ahụ n’Igbo ekeghị eke, n’agbanyeghị na okwu Grik ahụ n’onwe ya nwere ike ịgụ dịka aha nkịtị “maka mkpughe.”
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro “nke ga-ekpughere” mee ka ahịrị abụ ahụ bụrụ Igbo ebumpụta ụwa, ebe ihe odide ala na-echekwa nghọtahie kwe omume nke ἐθνῶν.
