review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly makes the Gentiles the object of the revealing action ("ìhè nke ga-ekpughere ndị mba ọzọ," ‘a light that will reveal the Gentiles’). In Greek, εἰς ἀποκάλυψιν ἐθνῶν denotes revelation/disclosure directed to the Gentiles. The revised wording retains the purpose/result relation and its intended recipients.
  naturalness: “Ìhè maka mkpughe nye ndị mba ọzọ” is clear, idiomatic Standard Igbo in a formal biblical register and preserves the balanced nominal parallelism with “ebube nke ndị gị, bụ́ Izrel.”
  terminology: “Ìhè,” “mkpughe,” and “ebube” appropriately render φῶς, ἀποκάλυψις, and δόξα. “Ndị mba ọzọ” suitably conveys ἐθνῶν in this Israel/Gentiles contrast; the footnote preserves “mba dị iche iche” as the broader lexical alternative.
  issues:
  - severity: high
    issue: The main clause reverses the semantic direction of revelation.
    rationale: “Nke ga-ekpughere ndị mba ọzọ” naturally means that the light will disclose or reveal the Gentiles. The genitive ἐθνῶν with ἀποκάλυψιν instead identifies the Gentiles as those to whom revelation comes.
  revised_text: ìhè maka mkpughe nye ndị mba ọzọ[a], na ebube nke ndị gị, bụ́ Izrel.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ìhè maka mkpughe nye mba dị iche iche.” Okwu Grik ahụ nwere ike ịpụta mba n’ozuzu, ma n’ebe a o yikarịrị ka ọ na-ekwu maka ndị mba ọzọ n’ihi ọdịiche dị n’etiti ha na Izrel.
    reason: lexical_alternative
  revision_rationale: Replaced the relative verbal construction with the nominal phrase “maka mkpughe nye” so that revelation is given to the Gentiles rather than the Gentiles being revealed. The appositional identification of Israel as God’s people and the lexical-alternative footnote are retained.
