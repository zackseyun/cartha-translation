id: LUK.2.13
reference: Luke 2:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: ig
  text: 'Na mberede, e nwere oke ìgwè usuu ndị agha nke eluigwe[a] ya na mmụọ ozi ahụ, na-eto Chineke ma na-asị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oke ìgwè ndị agha eluigwe” ma ọ bụ “oke ìgwè usuu ndị eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαίφνης
  choice: Na mberede
  rationale: Ọ na-egosi na ihe ahụ mere na-atụghị anya ya ma na-echekwa mmetụta ijuanya dị n'akụkọ ahụ.
- source_word: ἐγένετο
  choice: bịara nọnyere
  rationale: N'usoro okwu a, ọ na-ewebata ịdị adị ma ọ bụ ọbịbịa nke ìgwè ahụ; okwu a bụ Igbo ebumpụta ụwa ma ọ naghị ekwu hoo haa na ha pụtara n'anya.
- source_word: σὺν τῷ ἀγγέλῳ
  choice: nọnyere mmụọ ozi ahụ
  rationale: Ọ na-egosi iso mmụọ ozi ahụ nọ, dịka σύν na dative si pụta.
- source_word: πλῆθος
  choice: ọtụtụ
  rationale: Ọ na-egosi ọnụ ọgụgụ buru ibu n'ụzọ doro anya ma dị mfe nghọta n'Igbo oge a.
- source_word: στρατιᾶς οὐρανίου
  choice: ndị agha nke eluigwe
  rationale: Ọ na-echekwa ma echiche nke usuu ndị a haziri ahazi ma njikọ ha na eluigwe, n'ejighị okwu ga-eme ka a ghọta ha naanị dịka ndị na-alụ ọgụ.
- source_word: αἰνούντων
  choice: na-eto
  rationale: Ọ na-egosi omume otuto nke ìgwè ahụ na-aga n'ihu n'oge ahụ.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Nke a bụ ihe αἰνούντων na-emetụta kpọmkwem, ọ bụkwa okwu Igbo a na-ejikarị eme ihe.
- source_word: λεγόντων
  choice: na-asị
  rationale: Ọ na-ejikọta omume nke abụọ na otuto ahụ ma na-ewebata okwu ha ga-ekwu n'amaokwu na-esote.
theological_decisions:
- issue: Nsụgharị στρατιᾶς οὐρανίου
  choice: ndị agha nke eluigwe
  alternative: ụsụụ ndị eluigwe
  rationale: Nhọrọ a na-echekwa ihe atụ ndị agha dị n'okwu Grik ahụ nakwa na ha bụ ndị nke eluigwe, ma ọ naghị agbanwe ihe ha na-eme ebe a—ịto Chineke—ka ọ bụrụ ọgụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. Nhazi ahịrịokwu ahụ na-aga were were n'Igbo, ebe akara kọlụm na-akwadebe okwu a ga-ekwu n'amaokwu na-esote.
