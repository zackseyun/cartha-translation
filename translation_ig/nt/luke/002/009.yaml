  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: ig
  text: Otu mmụọ ozi nke Onyenwe anyị bịara kwụrụ ha nso[a], ebube Onyenwe anyị wee nwuo gburugburu ha, oke egwu wee jide ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “bịara n’ebe ha nọ,” “pụtara ha n’ihu,” ma ọ bụ “guzoro ha nso.” Ngwaa Grik a nwere ike igosi mmadụ ịbịa guzo onye ọzọ nso, ma n’ọnọdụ ụfọdụ ọ na-egosikwa ọbịbịa na mberede.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ ji ngwaa “ịtụ egwu” na aha sitere n’otu mgbọrọgwụ, sị, n’ụzọ nkịtị, “ha tụrụ egwu ukwu.” Nke a na-emesi oké ụjọ ha ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: otu mmụọ ozi nke Onyenwe anyị
  rationale: N'ọnọdụ akụkọ a, ἄγγελος pụtara mmụọ ozi, ọ bụghị naanị onye ozi. Ebe aha ahụ na-enweghị mkpụrụokwu na-egosi onye a maara ama, “otu” na-egosi na ọ bụ otu mmụọ ozi, ọ bụghị “mmụọ ozi ahụ.” A sụgharịrị κύριος dị ka “Onyenwe anyị,” nke bụ okwu Igbo a na-ejikarị maka aha nsọpụrụ a.
- source_word: ἐπέστη αὐτοῖς
  choice: bịara guzo n'akụkụ ha na mberede
  rationale: Ngwaa ἐφίστημι nwere ike ịpụta ịbịaru mmadụ nso, iguzo n'akụkụ ya, ma ọ bụ ịpụta n'ihu ya na mberede. Nsụgharị a na-edobe echiche nke iguzo nso na nke ọbịbịa mberede n'Igbo doro anya.
- source_word: δόξα κυρίου
  choice: ebube Onyenwe anyị
  rationale: “Ebube” na-eburu echiche δόξα nke ịdị ukwuu Chineke na ìhè na-egbukepụ egbukepụ, na-enweghị ime ka okwu ahụ bụrụ naanị ìhè nkịtị.
- source_word: περιέλαμψεν αὐτούς
  choice: nwupụta ìhè gburugburu ha
  rationale: περιλάμπω na-egosi ìhè nke na-enwu mmadụ gburugburu ma kpuchie ebe ọ nọ. Okwu a bụ nke nkịtị ma doo anya n'Igbo ugbu a.
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: oke egwu wee jide ha
  rationale: Nke a bụ usoro Grik nke na-eji ngwaa na aha sitere n'otu mgbọrọgwụ mesie oke ụjọ ike. “Oke egwu jidere ha” na-ebute ike okwu ahụ n'Igbo eke, kama ikwughachi “egwu” n'ụzọ na-adịghị atọ ụtọ.
theological_decisions:
- issue: Nsụgharị κύριος n'ahịrịokwu abụọ nke genitive
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: N'ebe a, κύριος na-ezo aka n'ebe Chineke nọ. “Onyenwe anyị” na-edobe ịdị nsọ na ibu okwu ahụ n'ojiji Akwụkwọ Nsọ Igbo, ebe “Nna ukwu” nwere ike ịdị ka aha onye ọchịchị mmadụ.
- issue: 'Ụdị ἄγγελος κυρίου: onye a maara ama ka ọ bụ otu n''ime ndị mmụọ ozi'
  choice: otu mmụọ ozi nke Onyenwe anyị
  alternative: mmụọ ozi ahụ nke Onyenwe anyị
  rationale: Ebe ἄγγελος na-enweghị article n'okwu Grik a, a naghị eme ka ọ bụrụ “mmụọ ozi ahụ” pụrụ iche. “Otu” na-echekwa nkọwa indefinite ahụ na-enweghị itinye ozizi pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro akụkọ Grik, ma jiri akpaalaokwu Igbo “oke egwu jidere ha” mee ka nkwusi ike nke okwu ikpeazụ pụta nke ọma. E tinyere akara nkọwa ala peeji [a] n'akụkụ okwu ἐπέστη, ma tinye [b] n'akụkụ akpaalaokwu egwu nke nkọwa ya metụtara.
