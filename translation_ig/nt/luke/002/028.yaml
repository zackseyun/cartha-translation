base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: ig
  text: 'O wee kuru ya n’aka ya abụọ, gọzie Chineke, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδέξατο
  choice: kuru
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ịnabata nwata ahụ n’aka; ‘kuru’ na-egosi omume ahụ n’Igbo n’ụzọ ebumpụta ụwa, ebe ahịrịokwu na-esochi ya kọwara na ọ bụ n’aka ya abụọ.
- source_word: αὐτό
  choice: ya
  rationale: Ọ bụ nwa ọhụrụ ahụ, bụ Jizọs, ka nnọchiaha a na-ezo aka; ‘ya’ dabara adaba n’Igbo ma zere ịtụgharị ụdị okike ụtọasụsụ Grik n’ụzọ na-eduhie eduhie.
- source_word: εἰς τὰς ἀγκάλας
  choice: n’aka ya abụọ
  rationale: ἀγκάλας na-ezo aka n’aka mmadụ ji amakụ ma ọ bụ buru nwa. ‘N’aka ya abụọ’ bụ okwu Igbo doro anya ma dịkwa ebumpụta ụwa n’ọnọdụ a.
- source_word: εὐλόγησεν τὸν θεόν
  choice: gọzie Chineke
  rationale: Nke a na-edobe isi okwu εὐλογέω, ‘ịgọzi,’ mgbe Chineke bụ onye a na-agọzi, kama ịgbanwe ya naanị ka ọ bụrụ ‘too Chineke.’
- source_word: καὶ εἶπεν
  choice: sị,
  rationale: ‘Sị’ bụ ụzọ Igbo dị mkpirikpi ma dị ebumpụta ụwa isi webata okwu onye ahụ kwuru.
- source_word: αὐτός
  choice: O
  rationale: Nnọchiaha ahụ na-aga n’ihu n’ịkọ akụkọ ma nwee obere nkwusi ike; n’Igbo, ‘O’ zuru ezu ebe ‘ya onwe ya’ ga-eme ka nkwusi ike ahụ sie ike karịa nke Grik.
theological_decisions:
- issue: Ihe nnọchiaha neuter αὐτό na-ezo aka na ya
  choice: A tụgharịrị ya ‘ya,’ na-ezo aka n’onwe Jizọs bụ nwa ọhụrụ.
  alternative: Ịgbaso ụdị neuter nke ụtọasụsụ Grik n’ụzọ kpọmkwem.
  rationale: Ụdị nnọchiaha Grik kwekọrọ n’ụdị okwu e ji kpọọ nwa, ma onye ọ na-ezo aka na ya bụ Jizọs. ‘Ya’ bụ nnọchiaha Igbo kwesịrị ekwesị ma ọ naghị atụkwasị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, mee ntụgharị ahụ. ‘Kuru ya n’aka ya abụọ’ na-enye echiche nke iburu nwa ahụ n’aka n’enweghị ịgbakwunye ihe na-adịghị na isi mmalite.
