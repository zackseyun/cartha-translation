    text: Ma ọ bụ, “O wee nabata ya.” Ngwaa Grik ahụ nwere ike ịpụta “ịnabata” ma ọ bụ “ịkpọbata”; ma okwu na-esochi ya, “n’aka ya abụọ,” na-egosi na ọ nabatara nwa ahụ n’aka ya, ya mere “kuru” dabara nke ọma n’ọnọdụ a.
    reason: lexical_alternative
