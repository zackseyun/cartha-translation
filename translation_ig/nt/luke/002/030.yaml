  source_fidelity: The main rendering accurately preserves the causal ὅτι, the explicit embodied subject “my eyes,” and τὸ σωτήριόν σου as “your salvation,” without turning the neuter salvation term into the personal title “Savior.”
  naturalness: “n’ihi na anya m ahụla nzọpụta gị” is natural, clear Standard Igbo and has an appropriately dignified register. The existing footnote’s final phrase, “nọ n'ihu Simiọn n'ime Jizọs,” is awkward and can misleadingly suggest a spatial sense.
  terminology: “nzọpụta gị” is the appropriate rendering for σωτήριόν σου. “Onye Nzọpụta gị” should remain explicitly marked as an interpretive alternative rather than the main text.
  issues:
