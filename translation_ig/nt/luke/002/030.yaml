  text: ὅτι εἶδον οἱ ὀφθαλμοί μου τὸ σωτήριόν σου
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/030.yaml
  text: because my eyes have seen your salvation[a]
translation:
  language: ig
  text: n’ihi na anya m ahụla nzọpụta gị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye Nzọpụta gị.” N’asụsụ Grik, e dere “nzọpụta gị”; ma n’akụkụ a, nzọpụta Chineke pụtara ìhè n’ime Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: N'ebe a, okwu a na-egosi ihe mere Simiọn ji kwuo na Chineke nwere ike ịhapụ ya ka ọ laa n'udo; ya mere, “n’ihi na” na-egosipụta njikọ ahụ nke ọma n'Igbo.
- source_word: εἶδον
  choice: ahụla
  rationale: Ọ bụ ezie na ngwaa Grik a bụ aorist, “ahụla” na Igbo na-egosi omume mezuru nke ihe ọ pụtara ka dị ugbu a, dịka nzaghachi Simiọn ozugbo ọ hụrụ nwa ahụ.
- source_word: οἱ ὀφθαλμοί μου
  choice: anya m
  rationale: E debeere ihe oyiyi doro anya dị na Grik, bụ́ “anya m,” kama ịgbanwe ya naanị ka ọ bụrụ “mụ,” n'ihi na okwu a dịkwa ebumpụta ụwa n'Igbo.
- source_word: τὸ σωτήριόν σου
  choice: nzọpụta gị
  rationale: σωτήριον na-ezo aka na nzọpụta ma ọ bụ nnapụta, ọ bụghị kpọmkwem aha onye bụ́ “Onye Nzọpụta.” “Nzọpụta gị” na-edobe okwu Grik ma na-ahapụ ka ndị na-agụ ya ghọta site n'ihe gbara ya gburugburu na nzọpụta Chineke bịara n'ime Jizọs.
theological_decisions:
- issue: Ma a ga-asụgharị τὸ σωτήριόν σου dịka “nzọpụta gị” ka a ga-asụgharị ya dịka onye, “Onye Nzọpụta gị,” n'ihi na nwa bụ́ Mesaya nọ n'ebe ahụ.
  choice: nzọpụta gị
  alternative: Onye Nzọpụta gị
  rationale: 'Grik ji σωτήριον, nke na-apụtakarị nzọpụta ma ọ bụ nnapụta, ọ bụghị σωτήρ, bụ́ okwu a na-eji akpọ “Onye Nzọpụta.” Nhọrọ a na-edobe esemokwu bara uru dị n''okwu ahụ: ihe anya Simiọn hụrụ bụ nzọpụta Chineke nke pụtara ìhè n''ime nwa ahụ.'
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. A hapụrụ “anya m” dịka okwu ihe oyiyi nke isi mmalite ahụ, ma jiri “nzọpụta gị” chekwaa ụdị okwu Grik na nghọta ime mmụọ ya.
