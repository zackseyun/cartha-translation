  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: ig
  text: Mmụọ Nsọ ekpughewooro ya na ọ gaghị ahụ ọnwụ tupu ọ hụ Mesaịa nke Onyenwe anyị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka ntụgharị ọdịnala si kwuo, “Kraịst nke Onyenwe anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: emeworị ka ọ mata
  rationale: N’ọnọdụ a, okwu Grik a na-egosi na e nyere ya ozi sitere n’aka Chineke. Nkebi a bụ Igbo dị mfe ma doo anya, ọ naghịkwa eme ka okwu ahụ bụrụ naanị ịdọ aka ná ntị.
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: Mmụọ Nsọ emeworịkwa ka ọ mata
  rationale: E mere Mmụọ Nsọ onye na-eme ihe n’ahịrịokwu Igbo ahụ, si otú ahụ chekwaa ọrụ onye nke ὑπό ya na genitive na-egosi.
- source_word: μὴ ἰδεῖν θάνατον
  choice: ọ gaghị ahụ ọnwụ
  rationale: Nke a na-echekwa ihe atụ dị n’okwu Grik, ‘ịhụ ọnwụ,’ kama ịkọwa ya naanị dịka ‘ịnwụ.’ Okwu ahụ ka nwekwara nghọta n’Igbo.
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: tupu ọ hụ
  rationale: 'Nke a na-egosi usoro ihe abụọ ahụ nke ọma: ọ gaghị ahụ ọnwụ tupu ọhụhụ Mesaịa ahụ emee.'
- source_word: τὸν χριστὸν κυρίου
  choice: Mesaịa nke Onyenwe anyị
  rationale: Χριστός bụ aha ọkwa n’ebe a, ya mere ‘Mesaịa’ na-echekwa echiche nke Onye E Tere Mmanụ ahụ; ‘nke Onyenwe anyị’ na-egosipụta njikọ genitive ahụ n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: ‘Onyenwe anyị’ bụ ụzọ Igbo a na-ejikarị asọpụrụ Chineke ma na-asụgharị κύριος n’ọnọdụ dị otu a.
theological_decisions:
- issue: Otu e si asụgharị Χριστός mgbe ọ bụ aha ọkwa Mesaịa
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’τὸν χριστὸν κυρίου, Χριστός na-arụ ọrụ dịka aha ọkwa, ọ bụghị dịka aha mmadụ. Isi ederede jiri ‘Mesaịa,’ ebe e debere ụdị ọdịnala ‘Kraịst’ n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. A gbanwere passive Grik ka Mmụọ Nsọ bụrụ subject kpọmkwem, nke bụ ụzọ Igbo sitere n’okike isi kwuo otu ihe ahụ. E chekwara ihe atụ ‘ịhụ ọnwụ’ na nghọta Mesaịa ahụ.
