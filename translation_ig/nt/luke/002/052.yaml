id: LUK.2.52
reference: Luke 2:52
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: ig
  text: Jizọs nọgidere na-eto n’amamihe, n’ogo[a], na n’ihu ọma n’ebe Chineke na ụmụ mmadụ[b] nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’afọ ndụ” ma ọ bụ “na ntozu.” Okwu Grik ἡλικία nwekwara ike ịpụta ihe ndị a.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a pụtara ụmụ mmadụ n’ozuzu ha.
    reason: lexical_clarification
lexical_decisions:
- source_word: προέκοπτεν
  choice: nọgidere na-eto
  rationale: Ngwaa a dị n’ụdị imperfect, nke na-egosi uto na-aga n’ihu ruo oge ụfọdụ; ‘nọgidere na-eto’ na-egosipụta nke a n’Igbo dị mfe ma kwekọọ n’echiche nke inwe ọganihu.
- source_word: σοφίᾳ
  choice: n’amamihe
  rationale: ‘Amamihe’ bụ okwu Igbo nkịtị maka nghọta na ezi ikike ịmata ihe, ma dabara n’ebe a.
- source_word: ἡλικίᾳ
  choice: n’ogo
  rationale: Ἡλικία nwere ike ịpụta ogo ahụ, afọ ndụ, ma ọ bụ ntozu. ‘Ogo’ na-egosi uto a na-ahụ anya, ebe e debere nghọtahie okwu ahụ na nkọwa ala peeji.
- source_word: χάριτι
  choice: ihu ọma
  rationale: N’usoro okwu a, χάρις pụtara ihu ọma ma ọ bụ nnabata n’ebe Chineke na mmadụ nọ, ọ bụghị naanị ‘amara’ dịka okwu nkà mmụta okpukpe.
- source_word: παρὰ θεῷ
  choice: n’ebe Chineke ... nọ
  rationale: Παρά tinyere dative na-egosi mmekọrịta ma ọ bụ otú mmadụ dị n’anya onye ọzọ; usoro Igbo a na-ekwupụta ya n'ụzọ ebumpụta ụwa.
- source_word: ἀνθρώποις
  choice: ụmụ mmadụ
  rationale: Ụdị ọtụtụ nke ἄνθρωπος na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke; ‘ụmụ mmadụ’ na-egosipụta obosara ahụ nke ọma.
theological_decisions:
- issue: Ezi uto Jizọs dịka mmadụ na mmekọrịta ya na nkwupụta banyere ọdịdị ya
  choice: 'A sụgharịrị amaokwu ahụ n’enweghị ime ka okwu banyere uto Jizọs dị nro: ọ nọgidere na-eto n’amamihe, n’ogo, nakwa n’ihu ọma.'
  alternative: Ịgbanwe okwu ahụ ka ọ ghara iyi na Jizọs nwere ezi uto dịka mmadụ.
  rationale: Grik kwuru hoo haa na Jizọs na-enwe ọganihu. Nsụgharị ahụ na-echekwa eziokwu banyere ọdịdị mmadụ ya na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ, kama idozi ya site n’ịgbanwe ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Nọgidere na-eto’ na-egosi omume na-aga n’ihu; ‘na-enwekwukwa ihu ọma’ na-eme ka njikọ nke χάριτι doo anya n’Igbo. E tinyere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
