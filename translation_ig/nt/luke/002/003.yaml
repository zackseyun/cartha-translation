  to: Mmadụ niile na-agakwa ka e debanye aha ha, onye ọ bụla n’obodo nke ya.[a]
  rationale: 'The revision removes the unexpressed detail “in a book” and uses the natural administrative expression “ka e debanye aha ha.” It also streamlines the imperfect narrative movement to “na-agakwa.” The destination remains distributive: each person went to his or her own city. The gender-form note is retained and its anchor is placed at the relevant expression.'
