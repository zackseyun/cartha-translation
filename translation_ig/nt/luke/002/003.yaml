  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπορεύοντο πάντες ἀπογράφεσθαι, ἕκαστος εἰς τὴν ⸀ἑαυτοῦ πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: ig
  text: Mmadụ niile na-agakwa ka e debanye aha ha, onye ọ bụla n’obodo nke ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, “onye ọ bụla” na “nke ya” dị n’otu onye ma dịkwa n’ụdị nwoke: “onye ọ bụla ... obodo nke ya.” N’Igbo, “ya” anaghị egosi ma onye ahụ ọ bụ nwoke ma ọ bụ nwaanyị.'
    reason: source_form
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: nọkwa na-aga
  rationale: Ụdị imperfect nke ngwaa ahụ na-egosi njem nọ na-aga n’ihu n’akụkọ ahụ; “nọkwa na-aga” na-egosipụta nke a n’Igbo nkịtị.
- source_word: πάντες
  choice: Mmadụ niile
  rationale: Nke a na-enye echiche nke “niile” n’ụzọ doro anya ma bụrụkwa okwu Igbo a na-asụkarị.
- source_word: ἀπογράφεσθαι
  choice: ka e deba aha ha n’akwụkwọ
  rationale: Okwu a na-ezo aka n’idebanye mmadụ n’akwụkwọ ọchịchị, karịchaa n’ihe gbasara ọnụ ọgụgụ mmadụ; nsụgharị a doro ndị na-agụ akwụkwọ taa anya.
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: Ọ na-egosi na ihe a metụtara mmadụ n’otu n’otu, dị ka okwu Grik ahụ si mee.
- source_word: ἑαυτοῦ
  choice: nke ya
  rationale: Ọ na-echekwa echiche nke ihe bụ nke onye ahụ n’onwe ya. Nnọchiaha Igbo “ya” anaghị ekewa nwoke na nwaanyị, ọ bụ ezie na okwu Grik dị n’ụdị nwoke otu onye.
- source_word: πόλιν
  choice: obodo
  rationale: “Obodo” bụ okwu Igbo sara mbara ma dabara adaba maka πόλις, nke nwere ike ịpụta obodo ukwu ma ọ bụ obodo nta dabere n’ọnọdụ.
theological_decisions:
- issue: Ụdị nwoke otu onye dị na ἕκαστος ... ἑαυτοῦ
  choice: onye ọ bụla ... nke ya
  alternative: nwoke ọ bụla ... obodo nke ya
  rationale: Grik ji ụdị nwoke otu onye mee ihe, ma “ya” bụ nnọchiaha otu onye sitere n’okike n’Igbo, nke na-adịghị akọwa nwoke ma ọ bụ nwaanyị. Ịsị “nwoke ọ bụla” ga-etinye mmachi nwoke nke ihe gbara amaokwu ahụ gburugburu na-achọghị.
- issue: Ihe ἀπογράφεσθαι pụtara n’ọnọdụ a
  choice: ka e deba aha ha n’akwụkwọ
  alternative: ka a gụọ ha n’ọnụ ọgụgụ mmadụ
  rationale: Ngwaa ahụ na-elekwasị anya n’idebanye aha n’akwụkwọ ọchịchị. Nsụgharị ọzọ nwere ike ime ka ọ dị ka naanị ịgụ mmadụ ọnụ, ya mere e debere echiche sara mbara nke ndebanye aha.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. “Nọkwa na-aga” na-echekwa mmegharị na-aga n’ihu, ebe “deba aha ... n’akwụkwọ” na-enye ọnọdụ ọchịchị ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na amaokwu ahụ.
