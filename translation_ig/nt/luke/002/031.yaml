lexical_decisions:
- source_word: ὃ
  choice: nke
  rationale: Nnọchiaha njikọ a na-alaghachi n’‘nzọpụta’ dị n’amaokwu bu ụzọ; ‘nke’ bụ ụzọ Igbo nkịtị si jikọta ya na ihe e kwuru tupu ya.
- source_word: ἡτοίμασας
  choice: ị kwadebere
  rationale: Ngwaa a na-agwa Chineke okwu ozugbo ma na-egosi ihe o mere; ‘ị kwadebere’ bụ okwu doro anya ma kwesịkwa ekwesị n’Igbo.
- source_word: κατὰ πρόσωπον
  choice: n’ihu
  rationale: Akpaalaokwu Grik a na-egosi ihe e debere n’ihu ma ọ bụ n’anya ndị ọzọ ka ọ pụta ìhè; ‘n’ihu’ na-edobe ma echiche ọnụnọ ma nke ọhaneze.
- source_word: πάντων τῶν λαῶν
  choice: agbụrụ niile
  rationale: Ụdị ọtụtụ nke λαῶν na-ezo aka n’ìgwè dị iche iche nke ndị mmadụ. ‘Agbụrụ niile’ na-echekwa ọtụtụ ahụ n’etinyeghị nkọwa amaokwu na-esote tupu oge ya.
theological_decisions:
- issue: Oke na nghọta nke λαῶν n’ihe gbasara amaokwu na-esote
  choice: agbụrụ niile
  alternative: mba niile; mmadụ niile
  rationale: ‘Agbụrụ niile’ na-echekwa ụdị ọtụtụ dị n’asụsụ Grik ma hapụ amaokwu 32 ka ọ kọwaa ndị mba ọzọ na Izrel. ‘Mba niile’ nwere ike ime ka okwu ahụ bụrụ naanị mba, ebe ‘mmadụ niile’ na-ekpuchi ụdị ọtụtụ nke ìgwè dị iche iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘N’ihu’ bụ akpaalaokwu Igbo nkịtị nke na-ezere ntụgharị siri ike dịka ‘n’ihu ihu,’ ebe ‘agbụrụ niile’ na-echekwa echiche nke ọtụtụ peoples.
