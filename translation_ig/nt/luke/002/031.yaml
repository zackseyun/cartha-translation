  text: nke ị kwadebere n’ihu agbụrụ niile[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihu mmadụ niile”; akpaalaokwu Grik a nwere ike ịpụta ihe e debere n’ihu ọha ka mmadụ niile hụ ya.
