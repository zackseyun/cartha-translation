id: LUK.2.10
reference: Luke 2:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: ig
  text: Mmụọ ozi ahụ wee sị ha, “Unu atụla egwu, n’ihi na, lee, ana m akọrọ unu ozi ọma banyere ọṅụ dị ukwuu nke ga-adịrị ndị mmadụ niile.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka mmadụ niile.” N’asụsụ Grik, ihe e dere n’ụzọ nkịtị bụ “maka mmadụ ahụ niile”; n’akwụkwọ Luk, okwu a na-enwekarị echiche nke otu ndị a maara ama, dịka akụkọ gbara ya gburugburu si dị.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: Mmụọ ozi ahụ
  rationale: Mkpọaha ahụ e ji mee ka okwu doo anya na-atụ aka n’otu mmụọ ozi ahụ a kpọtụrụla aha n’akụkọ dị n’ihu amaokwu a.
- source_word: Μὴ φοβεῖσθε
  choice: Unu atụla egwu
  rationale: Nke a bụ ụzọ Igbo nkịtị, doro anya, si nye ọtụtụ mmadụ iwu ka ha ghara ịtụ egwu.
- source_word: ἰδοὺ
  choice: leenụ
  rationale: “Leenụ” na-adọta uche ndị na-ege ntị ma na-echekwa nkwusi okwu na ịdị nsọ nke okwu Grik a.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere ndị ọzụzụ atụrụ ekwesịghị iji tụọ egwu.
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: ana m ewetara unu ozi ọma
  rationale: Ọ na-enye nghọta bụ ịkọrọ ha ozi ọma n’asụsụ Igbo dị ndụ, ma na-echekwa ὑμῖν, ya bụ “unu.”
- source_word: χαρὰν μεγάλην
  choice: ọṅụ dị ukwuu
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma dịkwa mma maka ogo ọṅụ okwu Grik ahụ na-egosi.
- source_word: ἥτις ἔσται
  choice: nke ga-eweta
  rationale: N’Igbo, ikwu na ozi ọma ahụ “ga-eweta” ọṅụ na-eme ka njikọ ahụ bụrụ ihe e ji asụsụ eme kwa ụbọchị ghọta, n’agbanyeghị na Grik kwuru n’ụzọ nkịtị na ọṅụ ahụ “ga-abụ.”
- source_word: παντὶ τῷ λαῷ
  choice: nye ndị ahụ niile
  rationale: “Ndị ahụ” na-echekwa ịdị kpọmkwem nke τῷ λαῷ, ebe “niile” na-egosipụta παντί; ọ naghị ekpebi n’ime isiokwu ahụ ma okwu a ọ pụtara otu ndị a maara ama ka ọ bụ mmadụ niile.
theological_decisions:
- issue: Oke ndị παντὶ τῷ λαῷ na-ezo aka na ha
  choice: nye ndị ahụ niile
  alternative: nye mmadụ niile
  rationale: E nwere nnọchiaha doro anya n’ihu λαός n’asụsụ Grik, nke nwere ike izo aka n’otu ndị kpọmkwem, ma eleghị anya Izrel n’akụkọ a. Nsụgharị a na-edobe ihe ahụ n’enweghị ịgbasa ya ozugbo ka ọ bụrụ mmadụ niile; nkọwa ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, dee ya. “Leenụ” na-echekwa ụda nkwusi okwu; “ndị ahụ niile” tinyere nkọwa ala peeji na-edobe ihe Grik ahụ nwere ike ịpụta ụzọ abụọ.
