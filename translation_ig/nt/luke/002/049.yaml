  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: ig
  text: Ọ sịrị ha, “Gịnị mere unu ji achọ m? Ọ bụ na unu amaghị na m aghaghị ịnọ n’ụlọ Nna m[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na m aghaghị ịnọ n’ihe ndị metụtara Nna m.” Akpaokwu Grik ahụ ekwughị kpọmkwem ihe a na-ekwu, ya mere ọ pụrụ izo aka ma n’ụlọ Nna m ma n’ihe ndị metụtara Nna m.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: Gịnị mere
  rationale: Akpaokwu Grik a na-ajụ ihe kpatara ihe; “Gịnị mere” bụ ụzọ Igbo nkịtị na nke doro anya si kwuo ya.
- source_word: ἐζητεῖτέ
  choice: unu ji achọ m
  rationale: ζητέω n’ebe a pụtara ịchọ onye furu efu; “ịchọ” dabara n’ọnọdụ nne na nna ya nọ na-achọ ya.
- source_word: οὐκ ᾔδειτε
  choice: Ọ bụ na unu amaghị
  rationale: Nke a na-edobe ajụjụ nkwughachi ahụ na echiche nke ịma ma ọ bụ ịmata ihe.
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: n’ụlọ Nna m
  rationale: Akpaokwu Grik ahụ hapụrụ aha ihe a na-ekwu n’ezoghị ọnụ. Ebe a hụrụ Jizọs n’ụlọ nsọ na-akwado “n’ụlọ Nna m,” ma e debere echiche ọzọ gbasara ihe ndị metụtara Nna ya n’ala peeji.
- source_word: δεῖ
  choice: aghaghị
  rationale: δεῖ na-egosi mkpa siri ike ma ọ bụ ihe dị mkpa ka o mee; “aghaghị” na-ebute ịdị arọ ahụ n’Igbo.
- source_word: εἶναί με
  choice: m ... ịnọ
  rationale: Ụdị infinitive Grik a na isiokwu ya na-asụgharị nke ọma n’Igbo dịka “m aghaghị ịnọ.”
- source_word: πατρός μου
  choice: Nna m
  rationale: N’ọnọdụ ụlọ nsọ a, okwu Jizọs na-ezo aka n’ebe Chineke bụ Nna ya nọ; mkpụrụedemede ukwu na “Nna” na-eme ka ntụaka ahụ doo anya n’enweghị mgbakwunye nkọwa n’ahịrịokwu ahụ.
theological_decisions:
- issue: Akpaokwu a na-emezughị emezu, ἐν τοῖς τοῦ πατρός μου
  choice: n’ụlọ Nna m
  alternative: n’ihe ndị metụtara Nna m / n’ihe ndị nke Nna m
  rationale: Ọnọdụ akụkọ ahụ—ịhụ Jizọs n’ụlọ nsọ—na-akwado “ụlọ Nna m.” Ma Grik ahụ nwekwara ike ịpụta ihe ma ọ bụ ọrụ ndị metụtara Nna ya, ya mere e debere nghọta ahụ n’ala peeji kama iwepụ mgbagwoju anya dị n’asụsụ mbụ.
- issue: Onye “Nna m” na-ezo aka na ya
  choice: Chineke dịka Nna Jizọs
  alternative: Josef dịka nna ya n’ụwa
  rationale: Ọnọdụ ụlọ nsọ na ọdịiche dị n’etiti ajụjụ nne na nna ya na azịza Jizọs na-egosi na ọ na-ekwu maka Chineke. Nsụgharị ahụ na-edobe okwu Jizọs n’onwe ya n’enweghị ịgbakwunye nkọwa ozizi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Gịnị mere,” “ịchọ,” na “Ọ bụ na unu amaghị” bụ okwu ndị mmadụ na-aghọta ngwa ngwa; “aghaghị” na-edobe echiche nke mkpa siri ike dị na δεῖ.
