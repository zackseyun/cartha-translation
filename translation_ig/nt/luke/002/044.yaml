id: LUK.2.44
reference: Luke 2:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: ig
  text: Ma ebe ha chere na ọ nọ n’etiti ìgwè ndị ha na ha so eme njem[a], ha gara njem otu ụbọchị, wee malite ịchọ ya n’etiti ndị ikwu ha na ndị ha maara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ìgwè ndị njem,” ya bụ, ọtụtụ ndị na-emekọ njem ọnụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị akụkụ ikpeazụ a, “ha nọkwa na-achọ ya,” iji mesie ike na ọchịchọ ahụ gara n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: ebe ha chere na
  rationale: Na-egosi ihe Meri na Josef were dị ka eziokwu n’oge ahụ, ma na-ahapụ ohere na echiche ahụ ezighị ezi.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere ntụgharị ma ọ bụ ọdịiche n’akụkọ ahụ mgbe ha hapụrụ n’amaghị na Jizọs anọghị n’ìgwè ahụ.
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: ọ nọ n’etiti ìgwè ndị ha na ha so eme njem
  rationale: Na-akọwa συνοδία n’Igbo nkịtị dị ka ìgwè mmadụ na-emekọ njem, n’enweghị itinye echiche pụrụ iche nke na-adịghị na okwu Grik.
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: ha gara njem otu ụbọchị
  rationale: Nke a na-ebupụta akpaalaokwu Grik nke pụtara ogologo njem a na-eme n’otu ụbọchị.
- source_word: ἀνεζήτουν
  choice: wee malite ịchọ ya
  rationale: Na-egosi mmalite nke ọchịchọ ahụ n’akụkọ, ebe ọdịdị imperfect nwekwara ike imesi ọchịchọ na-aga n’ihu ike.
- source_word: συγγενεῦσιν
  choice: ndị ikwu ha
  rationale: Okwu a gụnyere ndị ezinụlọ na ndị agbụrụ nso n’ụzọ sara mbara.
- source_word: γνωστοῖς
  choice: ndị ha maara
  rationale: Na-egosi ndị ha na ha maara, ma ọ bụghị iwu na ha bụ ezigbo ndị enyi ha.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị mfe, nke ugwu na nke ndị nkịtị nke oge a ga-aghọta. A kọwara συνοδία n’ụzọ eke kama iji okwu mbinye pụrụ ịdị mgbagwoju anya. E debere ihe imperfect ἀνεζήτουν nwere ike ịpụta na nkọwa ala peeji.
