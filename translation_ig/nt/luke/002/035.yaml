source:
  edition: SBLGNT
  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: ig
  text: mma agha ga-agafekwa mkpụrụ obi gị n’onwe ya[b][a], ka e wee kpughee echiche dị n’ime obi ọtụtụ mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-amapu.” Ngwaa Grik pụtara n’ụzọ nkịtị “ga-agafe,” ebe oyiyi mma agha na-egosi ịmapụ.
    reason: lexical_alternative
  - marker: b
    text: A na-aghọtakarị “mma agha” a dị ka ihe atụ nke nnukwu ihe mgbu Meri ga-enwe.
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: mkpụrụ obi gị onwe gị
  rationale: Nnọchiaha na okwu nkwusi ike ahụ na-emesi Meri ike n’onwe ya; ‘gị onwe gị’ na-echekwa nkwusi ike a n’Igbo nkịtị.
- source_word: ψυχή
  choice: mkpụrụ obi
  rationale: N’ebe a ọ na-ezo aka n’ime mmadụ, ebe mmadụ na-enwe oke ihe mgbu, ọ bụghị naanị ndụ anụ ahụ.
- source_word: διελεύσεται
  choice: ga-esikwa ... gafee
  rationale: Nke a na-edobe isi ihe ngwaa Grik pụtara, bụ́ ‘ịgafe n’ime,’ n’agbanyeghị na oyiyi mma agha na-egosi ịmapụ.
- source_word: ῥομφαία
  choice: mma agha
  rationale: Ọ bụ nnukwu ngwa agha dị egwu; ‘mma agha’ bụ okwu Igbo doro anya ma kwekọọ n’oyiyi ahụ.
- source_word: ὅπως ἂν
  choice: ka e wee
  rationale: Ọ na-egosi nzube ma ọ bụ ihe ga-esi n’ihe ahụ pụta, n’ụzọ na-adịghị ekpebi nke abụọ n’ike.
- source_word: ἀποκαλυφθῶσιν
  choice: kpughee
  rationale: Nrụpụta ‘ka e wee kpughee’ na-echekwa ọdịdị nnara nke ngwaa ahụ na echiche nke ime ka ihe zoro ezo pụta ìhè.
- source_word: ἐκ πολλῶν καρδιῶν
  choice: dị n’obi ọtụtụ mmadụ
  rationale: Ọ na-egosi na echiche ndị ahụ sitere n’ime obi ọtụtụ ndị; nsụgharị a bụ Igbo eke ma doo anya.
- source_word: διαλογισμοί
  choice: echiche
  rationale: Okwu a nwere ike ịpụta echiche, ntụgharị uche, ma ọ bụ atụmatụ dị n’ime; ‘echiche’ na-ahapụ obosara ahụ ka ọnọdụ okwu kọwaa ya.
theological_decisions:
- issue: Onye a na-agwa okwu na ihe amụma banyere mma agha pụtara
  choice: E debere ya dịka okwu a gwara Meri ozugbo, nke na-ebu amụma banyere nnukwu ihe mgbu nke ya, ma akọwaghị kpọmkwem otú ọ ga-esi mezuo.
  alternative: Ịkọwa mma agha ahụ kpọmkwem dịka iru újú Meri n’obe Jizọs, ma ọ bụ dịka mgbu sitere na nkewa ozi Jizọs ga-eweta.
  rationale: Grik na-agwa Meri okwu kpọmkwem ma na-emesi ya ike, ma ihe oyiyi ‘mma agha’ anaghị akọwa kpọmkwem ihe mere eme ga-eme ka ọ taa ahụhụ. Ya mere, nsụgharị ahụ na-echekwa esemokwu na oghere nkọwa dị n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Ọha dị ugbu a, nke dị ugwu ma dị mfe nghọta. Usoro ‘ga-esikwa n’ime ... gafee’ na-echekwa ihe ngwaa Grik pụtara n’ụzọ nkịtị; ‘echiche dị n’obi ọtụtụ mmadụ’ na-ada nke ọma n’Igbo ma na-egosi isi mmalite dị n’ime obi.
