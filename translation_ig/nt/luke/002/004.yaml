id: LUK.2.4
reference: Luke 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: ig
  text: Josef kwa si n’obodo Nazaret dị na Galili rịgoro gaa Judia, gaa n’obodo Devid nke a na-akpọ Betlehem, n’ihi na o si n’ụlọ na n’usoro nna nna Devid.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụlọ na n’agbụrụ Devid.” Grik ji okwu abụọ metụtara ezinaụlọ na usoro nna nna mee ihe, iji mesie ike na Josef sitere n’usoro ọmụmụ Devid.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέβη
  choice: rịgoro gaa
  rationale: Ọ na-echekwa echiche Grik nke ịrịgo ebe dị elu mgbe a na-aga Judia, kama ịsụgharị ya naanị dịka ‘gara.’
- source_word: δὲ καὶ
  choice: kwa
  rationale: ‘Kwa’ bụ njikọ dị mfe nke na-egosi na Josef sokwa mee njem ahụ, na-enweghị ime ka usoro oge sie ike karịa ka Grik si kwuo.
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ
  choice: si n’obodo Nazaret dị na Galili
  rationale: Nhazi a bụ Igbo eke ma na-echekwa ma mpaghara Galili ma obodo Nazaret dịka ebe Josef si pụọ.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: gaa Judia
  rationale: ‘Judia’ bụ aha mpaghara ahụ n’oge ahụ, ọ bụghị naanị ala ebo Juda.
- source_word: πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: n’obodo Devid nke a na-akpọ Betlehem
  rationale: Ọ na-echekwa nkọwa Grik nke jikọtara Betlehem na Devid.
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: n’ihi na o si
  rationale: Nkebiokwu a na-egosi ihe kpatara njem ahụ; Igbo a na-akọwa ya n’ụzọ doro anya ma dị ire.
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: si n’ụlọ na agbụrụ Devid
  rationale: ‘Ụlọ’ na-echekwa echiche usoro eze ma ọ bụ ezinụlọ Devid, ebe ‘agbụrụ’ na-egosi usoro nna nna; e jikọtaghị okwu abụọ ahụ ka ha ghọọ otu.
theological_decisions:
- issue: Okwu abụọ banyere usoro ọmụmụ Devid
  choice: si n’ụlọ na agbụrụ Devid
  alternative: n’ụlọ na usoro ọmụmụ Devid
  rationale: Nsụgharị ahụ na-echekwa ọdịiche dị n’etiti οἶκος na πατριά ma na-emesi njikọ Josef na usoro Devid ike, n’etinyeghị nkwubi okwu ozizi nke amaokwu ahụ n’onwe ya na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A haziri mmalite ahịrịokwu ahụ n’ụzọ Igbo eke, ma e chekwara echiche ịrịgo, aha mpaghara ahụ, na okwu abụọ gbasara usoro Devid.
