  rationale: The revision removes the unwarranted adversative “Ma” while preserving the plain narrative statement that Jesus’ parents did not understand what he said. “Okwu ahụ” retains the lexical breadth of ῥῆμα, and the revised note gives idiomatic Igbo alternatives without resolving the term more narrowly than the Greek does.
