  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: ig
  text: Ha aghọtaghị okwu ahụ ọ gwara ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe o kwuru,” “okwu ahụ e kwuru,” ma ọ bụ “okwu ahụ metụtara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: N’ebe a, njikọ a na-egosi ọdịiche dị n’etiti ihe Jizọs kwuru na nzaghachi ha; “Ma” na-eme ka usoro akụkọ ahụ doo anya n’Igbo n’etinyeghị nkọwa ọzọ.
- source_word: αὐτοὶ
  choice: ha
  rationale: Ọ na-ezo aka n’ebe nne na nna Jizọs nọ n’okwu gbara amaokwu a gburugburu. Igbo achọghị ịgbakwunye “onwe ha” ebe a ma ọ bụrụ na a chọghị imesi ya ike pụrụ iche.
- source_word: οὐ συνῆκαν
  choice: aghọtaghị
  rationale: Nke a na-enye kpọmkwem echiche nke enweghị nghọta, n’emeghị ya ka ọ bụrụ na ha ghọtara naanị obere ma ọ bụ na ha jụrụ okwu ahụ.
- source_word: τὸ ῥῆμα
  choice: okwu ahụ
  rationale: “Okwu ahụ” bụ ụzọ Igbo dị mfe ma dị ebube isi zoo aka n’ihe Jizọs kwuru; ọ na-echekwakwa ohere ῥῆμα nwere ịpụta okwu, ihe e kwuru, ma ọ bụ okwu metụtara otu ihe.
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: ọ gwara ha
  rationale: Nke a bụ Igbo eke maka okwu mmadụ kwuru nye ndị ọzọ, ma na-ejigide njikọ ya na “okwu ahụ.”
theological_decisions:
- issue: Otú akụkọ si kọwaa nzaghachi nne na nna Jizọs
  choice: E kwuru n'ụzọ doro anya na ha aghọtaghị okwu Jizọs.
  alternative: Ha aghọtachaghị ya nke ọma; ma ọ bụ, ha anabataghị ya.
  rationale: Grik kwuru enweghị nghọta, ọ bụghị nghọta ezughị ezu ma ọ bụ ịjụ okwu ahụ. Nsụgharị ahụ na-ahapụ esemokwu dị n’akụkọ banyere onye Jizọs bụ na ozi ya ka ọ dị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. A họọrọ “ọ gwara ha” kama ntụgharị siri ike dịka “ọ kwụrụ ha okwu,” n’ihi na ọ bụ usoro okwu Igbo ka eke.
