id: LUK.2.17
reference: Luke 2:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: ig
  text: Mgbe ha hụrụ ya, ha mere ka a mara ozi[a] ahụ a gwara ha banyere nwata a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ozi ahụ a gwara ha banyere nwata a” dịka “okwu ahụ a gwara ha banyere nwata a” ma ọ bụ “ihe e kwuru nye ha banyere nwata a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Mgbe ha hụchara ya
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ngwaa bụ isi. ‘Mgbe ha hụchara ya’ na-egosi usoro ihe ndị ahụ n’Igbo dị mfe nghọta; ‘ya’ bụ ihe e tinyere dịka ihe ngwaa ahụ na-emetụta, ebe ihe gbara amaokwu a gburugburu na-ezo aka n’ịhụ nwata ahụ.
- source_word: δὲ
  choice: —
  rationale: A naghị atụgharị δέ iche n’ebe a, n’ihi na njikọ oge dị na ‘Mgbe’ na-aga n’ihu na akụkọ ahụ n’ụzọ Igbo na-anụkarị, ebe δέ bụ naanị njikọ dị nro, ọ bụghị ntụnyere siri ike.
- source_word: ἐγνώρισαν
  choice: ha mere ka a mara
  rationale: Nke a na-edobe echiche γνωρίζω nke ime ka ihe mata ma ọ bụ ime ka a mara, n’etinyeghị echiche nke nkwusa n’usoro ọchịchị ma ọ bụ okpukpe.
- source_word: περὶ τοῦ ῥήματος
  choice: ozi ahụ
  rationale: N’ebe a ῥῆμα na-ezo aka n’ihe a gwara ndị ọzụzụ atụrụ banyere nwata ahụ. ‘Ozi’ bụ okwu Igbo doro anya ma kwekọọ na ihe e kwuru, ebe nkọwa ala peeji na-edobe ụzọ ndị ọzọ dịka ‘okwu’ na ‘ihe e kwuru.’
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: a gwara ha
  rationale: Nke a na-egosi na ọ bụ ha ka e bu ụzọ gwa okwu ahụ, ma na-edobe ọdịdị nnara nke participle Grik n’ụzọ Igbo kwesịrị ekwesị.
- source_word: περὶ τοῦ παιδίου τούτου
  choice: banyere nwata a
  rationale: ‘Nwata a’ bụ nsụgharị nkịtị ma dị mfe nghọta nke παιδίον τοῦτο, na-agbakwụghị nkọwa ọzọ gbasara onye nwata ahụ bụ.
theological_decisions:
- issue: Otú e si asụgharị ῥῆμα n’ihe gbasara ozi mmụọ ozi ahụ
  choice: ozi
  alternative: okwu; ihe e kwuru
  rationale: ‘Ozi’ na-egosi ọdịnaya nke ihe a gwara ndị ọzụzụ atụrụ banyere nwata ahụ n’Igbo nke oge a. Nkọwa ala peeji na-echekwa obosara okwu Grik ahụ, ka a ghara ime ka naanị otu nghọta bụrụ iwu.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro ihe mere: ha buru ụzọ hụ ya, mesịa mee ka a mara ihe a gwara ha. E tinyere akara [a] ozugbo n’akụkụ ‘ozi,’ bụ okwu nkọwa ala peeji ahụ na-akọwa.'
