  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: ig
  text: N’ógbè ahụ kwa, e nwere ndị ọzụzụ atụrụ nọ n’èzí n’ọhịa[a], na-eche ìgwè atụrụ ha nche n’oge nche nke abalị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-ebi n’èzí” ma ọ bụ “na-anọ n’èzí n’ọhịa.” Ngwaa Grik ahụ na-egosi na ndị ọzụzụ atụrụ ahụ nọ n’èzí n’ọhịa n’abalị.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-eche oge nche nke abalị n’elu ìgwè atụrụ ha.” Ọtụtụ “oge nche” ahụ pụrụ igosi na ha na-ekesa ọrụ nche n’akụkụ dị iche iche nke abalị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: ahụkwa
  rationale: Mgbakwunye -kwa na-ejikọta amaokwu a na akụkọ bu ya ụzọ n’ụzọ e ji ekwu Igbo nke ọma, na-enweghị itinye nkọwa ọhụrụ.
- source_word: ποιμένες
  choice: ndị ọzụzụ atụrụ
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-elekọta atụrụ, ma zere okwu sara mbara nke nwere ike ịgụnye ụdị anụ ụlọ ndị ọzọ.
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: n’otu mpaghara ahụ
  rationale: χώρα ebe a na-ezo aka n’ógbè ma ọ bụ mpaghara dị nso a kpọtụrụla; ‘mpaghara’ bụ okwu Igbo nke oge a, doro anya ma ghara ime ka ebe ahụ yie mba dum.
- source_word: ἀγραυλοῦντες
  choice: nọ n’ọhịa n’abalị
  rationale: Ngwaa ahụ na-egosi ịnọ ma ọ bụ ịrahụ n’èzí n’ọhịa n’abalị. Nsụgharị a na-edobe ọnọdụ ndị ọzụzụ atụrụ ahụ n’ụzọ dị mfe ma bụrụkwa nke okike n’Igbo.
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: na-eche ... nche n’oge nche dị iche iche nke abalị
  rationale: Nkebi okwu sitere n’otu mgbọrọgwụ pụtara iche nche n’oge nche nke abalị, ma ọtụtụ ‘oge nche’ nwere ike igosi na a na-ekesa nche ahụ n’akụkụ dị iche iche nke abalị.
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: ìgwè atụrụ ha
  rationale: ποίμνη bụ ìgwè anụ ndị a na-azụ, n’ebe a ìgwè atụrụ ha na-elekọta; ‘ìgwè atụrụ ha’ na-edobe echiche mkpokọta ahụ.
- source_word: ἦσαν
  choice: e nwere
  rationale: Nke a na-egosipụta ojiji existential nke εἰμί ma na-ewebata ndị ọhụrụ n’akụkọ ahụ n’Igbo nkịtị.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘mpaghara’ kama okwu nwere ike ịpụta mba dum, ma debe echiche nke ịnọ n’èzí n’abalị na nke oge nche dị iche iche. Akara ụkwụ [a] na [b] dị n’ebe nkebi okwu ha na-akọwa nọ.
