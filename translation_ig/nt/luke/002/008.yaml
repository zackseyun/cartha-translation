revisions:
- from: N’otu mpaghara ahụkwa, e nwere ndị ọzụzụ atụrụ nọ n’ọhịa n’abalị[a], na-eche ìgwè atụrụ ha nche n’oge nche dị iche iche nke abalị.[b]
  to: N’ógbè ahụ kwa, e nwere ndị ọzụzụ atụrụ nọ n’èzí n’ọhịa[a], na-eche ìgwè atụrụ ha nche n’oge nche nke abalị.[b]
  rationale: The revision makes the open-air sense of ἀγραυλοῦντες explicit, maintains the Greek’s narrative connection and existential introduction, and avoids presenting a particular shift system as certain while retaining it as a possible implication in the footnote.
