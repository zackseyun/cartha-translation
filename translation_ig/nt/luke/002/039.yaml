- from: Mgbe ha mechara ihe niile dị ka iwu Onyenwe anyị si dị[a], ha laghachiri Galili, gaa n’obodo nke ha[b], bụ Nazaret.
  to: Mgbe ha mechara ihe niile dịka iwu Onyenweanyị siri dị[a], ha laghachiri na Galili, n’obodo nke ha, bụ Nazaret[b].
  rationale: The revision retains the source text’s temporal and travel structure, improves idiomatic Standard Igbo, and corrects the footnote’s overly specific definition of πόλις. It does not add theological interpretation or resolve any ambiguity beyond what the Greek supports.
