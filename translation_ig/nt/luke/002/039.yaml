id: LUK.2.39
reference: Luke 2:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: ig
  text: Mgbe ha mechara ihe niile dịka iwu Onyenweanyị siri dị[a], ha laghachiri na Galili, n’obodo nke ha, bụ Nazaret[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe niile iwu Onyenweanyị chọrọ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “obodo”; a sụgharịrị ya “obodo” n’ihi na Nazaret bụ obere obodo.
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: Mgbe
  rationale: N’usoro oge a, ὡς na-egosi mgbe ha mechara ihe ndị ahụ tupu ha alaghachi; “Mgbe” bụ okwu Igbo doro anya nke na-adịghị ekwusi ike na ọ bụ ozugbo.
- source_word: ἐτέλεσαν
  choice: ha mechara
  rationale: τελέω ebe a pụtara ime ihe ndị a chọrọ ruo n’isi; “mechara” na-egosi mmezu omume ndị ahụ n’enweghị itinye echiche pụrụ iche banyere mmezu amụma.
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: ihe niile dị ka iwu Onyenwe anyị si dị
  rationale: Nsụgharị a na-anọ nso n’usoro Grik ma na-egosi ihe niile kwekọrọ n’iwu ahụ; nkọwa ọzọ nwere ike ịbụ ihe niile iwu ahụ chọrọ.
- source_word: νόμον κυρίου
  choice: iwu Onyenwe anyị
  rationale: Nke a na-echekwa ụdị okwu Akwụkwọ Nsọ ma na-egosi iwu sitere n’aka Chineke.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: κύριος ebe a na-ezo aka na Chineke; “Onyenwe anyị” bụ nsụgharị Igbo a na-ejikarị eme ihe ma ghara itinye aha Chineke nke na-adịghị n’ihe odide Grik.
- source_word: ἐπέστρεψαν
  choice: ha laghachiri
  rationale: N’ọnọdụ njem a, okwu ahụ pụtara ịlaghachi n’ebe ha si.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: Galili
  rationale: Aha ebe ahụ bụ njedebe njem ha; “laghachiri Galili” bụ ụzọ Igbo dị mfe ma bụrụ nke okike.
- source_word: εἰς πόλιν ἑαυτῶν
  choice: gaa n’obodo nke ha
  rationale: πόλις nwere ike ịbụ obodo ukwu ma ọ bụ obere obodo; “obodo” adịghị ekwubiga nha Nazaret ókè, ebe “nke ha” na-echekwa nkwusi ike nke ἑαυτῶν.
- source_word: Ναζαρέθ
  choice: Nazaret
  rationale: Nke a bụ ndegharị aha ebe ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya n’okwu “iwu Onyenwe anyị”
  choice: Ọ na-ezo aka na Chineke, onye iwu ahụ sitere n’aka ya dịka e dere ya n’Akwụkwọ Nsọ.
  alternative: Enweghị nkọwa ọzọ dị mkpa n’ọnọdụ a.
  rationale: Nke a bụ usoro okwu ndị Juu na nke Akwụkwọ Nsọ a na-ahụkarị. Nsụgharị ahụ na-egosi nrubeisi ezinụlọ ahụ n’etinyeghị ozizi ọzọ na-adịghị n’ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro akụkọ nke Grik, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ e nwere ike isi ghọta okwu ndị bụ isi.
