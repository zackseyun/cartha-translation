id: LUK.2.46
reference: Luke 2:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: ig
  text: O wee mee na, mgbe ụbọchị atọ gasịrị, ha hụrụ ya n’ogige ụlọ nsọ[a], ka ọ nọ ọdụ n’etiti ndị ozizi, na-ege ha ntị ma na-ajụ ha ajụjụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ἱερόν na-ezo aka n’ogige ma ọ bụ mpaghara ụlọ nsọ dum, ọ bụghị kpọmkwem n’ime ebe nsọ ahụ.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-ajụ ha ọnụ,” nke nwere ike igosi ịjụ ha ajụjụ n’ụzọ siri ike karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Ọ bụ usoro Luk ji ewebata ihe mere n’akụkọ; nsụgharị a na-ada nke ọma n’Igbo ma ghara iji okwu ochie na-adịghị mfe nghọta.
- source_word: μετὰ ἡμέρας τρεῖς
  choice: mgbe ụbọchị atọ gasịrị
  rationale: Ọ na-egosi oge sochiri ụbọchị atọ, ma na-edokwa usoro okwu Grik ahụ n’ụzọ Igbo dị mma.
- source_word: εὗρον
  choice: ha hụrụ
  rationale: Nke a bụ okwu nkịtị na nke ziri ezi maka ịchọta onye a na-achọ.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ime ogige ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ogige na mpaghara ụlọnsọ ukwu dum, ọ bụghị kpọmkwem ime ebe nsọ ahụ; ịkpọ ogige aha na-eme ka ọdịiche ahụ doo anya n’Igbo.
- source_word: καθεζόμενον
  choice: ka ọ nọ ọdụ
  rationale: Ọ na-egosi ọnọdụ Jizọs nọ na ya mgbe ha hụrụ ya, n’asụsụ Igbo dị ndụ ma dị mfe.
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: n’etiti ndị ozizi
  rationale: Nke a na-egosipụta na ọ nọ n’etiti ndị na-akụzi, n’etinyeghị ‘iwu’ nke Grik ahụ ekwughị kpọmkwem.
- source_word: ἀκούοντα αὐτῶν
  choice: na-ege ha ntị
  rationale: Ọ na-egosi ige ntị nke ọma, ọ bụghị naanị ịnụ ụda olu ha.
- source_word: ἐπερωτῶντα αὐτούς
  choice: na-ajụkwa ha ajụjụ
  rationale: Ọ na-egosipụta mkparịta ụka na ịjụ ajụjụ n’enweghị echiche na ọ na-alụso ha ọgụ ma ọ bụ na-anwale ha.
theological_decisions:
- issue: Ụdị mmekọrịta Jizọs na ndị ozizi ahụ
  choice: na-ege ha ntị ma na-ajụkwa ha ajụjụ
  alternative: na-ajụ ha ọnụ
  rationale: Nhọrọ a na-egosi ma ịdị umeala n’obi nke ige ntị ma ikere òkè n’amamihe, n’emeghị ka okwu Grik ahụ bụrụ esemokwu ma ọ bụ nyocha siri ike nke ọ naghị amanye.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ụlọnsọ ukwu’ na ‘ndị ozizi’ bụ okwu ndị nkịtị ga-aghọta; e mere ka ogige ụlọnsọ pụta ìhè iji chekwaa nkọwa ἱερόν.
