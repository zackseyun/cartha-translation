revisions:
- from: Ndị niile nụrụ ya jukwara n’anya banyere ihe ndị ọzụzụ atụrụ gwara ha.[a]
  to: Ndị niile nụrụ ya jukwara n’anya n’ihi ihe ndị ọzụzụ atụrụ ahụ gwara ha.[a]
  rationale: The revision replaces an awkward prepositional collocation with idiomatic Standard Igbo, preserves the Greek’s open-ended description of amazement, and supplies a complete natural alternative in the footnote. The meaning, referents, and narrative linkage remain unchanged.
  reviewer_model: gpt-5.6-terra
