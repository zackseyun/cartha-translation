source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἀκούσαντες ἐθαύμασαν περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: ig
  text: Ndị niile nụrụ ya jukwara n’anya n’ihi ihe ndị ọzụzụ atụrụ ahụ gwara ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ tụrụ ha n’anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: jukwara
  rationale: Akara njikọ a na-ejikọta amaokwu ahụ na akụkọ bu ya ụzọ; “-kwara” na-enye njikọ a n’Igbo n’ụzọ sitere n’okwu.
- source_word: πάντες οἱ ἀκούσαντες
  choice: Ndị niile nụrụ ya
  rationale: Nkebi a bụ participle e ji dị ka aha, ya bụ, “ndị niile nụrụ.” E tinyere “ya” dịka ihe a nụrụ nke a ghọtara site n’ọnọdụ akụkọ ahụ.
- source_word: ἐθαύμασαν
  choice: jukwara n’anya
  rationale: “Iju anya” bụ okwu Igbo dị ugbu a nke na-egosi ihe ijuanya ma ọ bụ oke nju anya, n’emeghị ka o doo anya ma nzaghachi ahụ bụ okwukwe ma ọ bụ enweghị okwukwe.
- source_word: περὶ τῶν λαληθέντων
  choice: banyere ihe ... gwara
  rationale: “Banyere” na-echekwa ọrụ περί na genitive dịka ihe okwu ahụ metụtara; “ihe ... gwara” na-egosi ọdịnaya e kwuru n’ụzọ Igbo na-ada nke ọma.
- source_word: ὑπὸ τῶν ποιμένων
  choice: ndị ọzụzụ atụrụ gwara
  rationale: Ọ bụ ezie na Grik ji passive na-egosi ndị mere ihe ahụ, Igbo active a na-ada nke ọma ma na-echekwa ndị ọzụzụ atụrụ dịka ndị kwuru okwu ahụ.
- source_word: πρὸς αὐτούς
  choice: ha
  rationale: “Ha” na-echekwa nnọchiaha Grik, nke o yikarịrị ka ọ na-ezo aka n’ebe ndị nụrụ okwu ahụ nọ, n’etinyeghị nkọwa ọzọ na-adịghị na ederede.
theological_decisions:
- issue: Ụdị nzaghachi ἐθαύμασαν na-akọwa
  choice: A sụgharịrị ya dịka iju anya, n’ekwughị na ọ bụ okwukwe nzọpụta ma ọ bụ ekweghị ekwe.
  alternative: Ịkọwa ya dịka nzaghachi okwukwe, ma ọ bụ dịka naanị ọchịchọ ịmata ihe.
  rationale: θαυμάζω na-akọwa mmeghachi omume nke iju anya. Ederede ahụ anaghị ekpebi ihe ijuanya ahụ mechara bụrụ, ya mere nsụgharị ahụ hapụrụ oghere ahụ dịka ọ dị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri active mee passive Grik ka okwu ahụ daa nke ọma n’Igbo, ma echekwara ọdịnaya na ndị mere omume ahụ.
