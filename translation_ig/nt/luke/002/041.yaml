id: LUK.2.41
reference: Luke 2:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: ig
  text: Nne na nna ya na-aga Jerusalem kwa afọ n’oge Emume Ngabiga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: na-aga
  rationale: Ụdị imperfect a na-egosi omume ha na-eme ugboro ugboro n'oge gara aga; “na-aga ... kwa afọ” na-egosipụta nke a nke ọma n'Igbo.
- source_word: γονεῖς
  choice: ndị mụrụ ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo “nne na nna ya,” ma na-edobe okwu ezinụlọ nkịtị nke Grik ji mee ihe.
- source_word: κατ’ ἔτος
  choice: kwa afọ
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka omume na-eme n'afọ ọ bụla, ma na-edobe echiche nkesa nke κατά na accusative.
- source_word: Ἰερουσαλήμ
  choice: Jeruselem
  rationale: E jiri ụdị aha obodo a maara nke ọma n'Igbo mee ihe.
- source_word: τῇ ἑορτῇ
  choice: maka Emume
  rationale: N'ọnọdụ njem a, dative ahụ na-egosi ihe mere ha ji gaa ma ọ bụ emume ha gara ime; “maka Emume” na-egosi nzube ahụ n'ụzọ doro anya.
- source_word: τοῦ πάσχα
  choice: Ngabiga
  rationale: “Ngabiga” bụ aha Igbo a na-ejikarị maka emume ndị Juu a kpọrọ πάσχα.
theological_decisions:
- issue: Aha e ji kpọọ ndị ezinụlọ Jizọs
  choice: ndị mụrụ ya
  alternative: nne ya na nna ya
  rationale: Grik kwuru “ndị mụrụ ya” n'echiche nne na nna, n'emeghị nkọwa ozizi ọzọ. Nsụgharị a na-edobe ihe akụkọ ahụ kwuru n'ụzọ nkịtị, na-enweghị ịgbakwunye ma ọ bụ ịgọnahụ ihe Luk kwuru ebe ọzọ banyere ịtụrụ ime Jizọs.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “na-aga ... kwa afọ” iji mee ka omume a na-eme ugboro ugboro pụta ìhè n'ụzọ okike.
