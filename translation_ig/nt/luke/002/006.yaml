revisions:
- from: Mgbe ha nọ n’ebe ahụ, ụbọchị ndị ahụ zuru maka ya ịmụ nwa.[a]
  to: Mgbe ha nọ n’ebe ahụ, ụbọchị ọmụmụ nwa ya ruru.[a]
  rationale: The revision replaces an unnatural and potentially misleading literal rendering with the normal Standard Igbo idiom for the time of childbirth arriving. The footnote preserves the more source-shaped alternative, including the Greek image of ‘the days’ being completed. The temporal connection and the restrained fulfillment nuance are retained without imposing a theological conclusion.
  reviewer_model: gpt-5.6-terra
