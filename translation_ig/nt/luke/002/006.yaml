review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal setting ('while they were there') and the arrival of the time for Mary's delivery. However, 'ụbọchị ndị ahụ zuru maka ya ịmụ nwa' can mean that the days were sufficient for her to give birth, rather than that the days reached completion. The revised wording expresses the Greek idiom naturally in Standard Igbo without adding theological interpretation.
  naturalness: ‘Ụbọchị ndị ahụ zuru maka ya ịmụ nwa’ is not idiomatic in this context. ‘Ụbọchị ọmụmụ nwa ya ruru’ is a natural Standard Igbo expression for the completion of pregnancy/the arrival of delivery.
  terminology: ‘Ịmụ nwa’ and ‘ọmụmụ nwa’ are appropriate, clear, and suitably dignified. The revision retains the source sense of completed pregnancy while avoiding an overly literal construction that is unnatural in Igbo.
  issues:
  - severity: medium
    issue: The predicate ‘zuru maka’ is semantically and idiomatically unsuitable for completed pregnancy.
    rationale: In Igbo, ‘zuru maka’ commonly conveys sufficiency (‘enough for’), whereas ἐπλήσθησαν here states that the days came to completion. A delivery-time idiom is needed.
  revised_text: Mgbe ha nọ n’ebe ahụ, ụbọchị ọmụmụ nwa ya ruru.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ụbọchị ndị ahụ mezuru ka ọ mụọ nwa.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural and potentially misleading literal rendering with the normal Standard Igbo idiom for the time of childbirth arriving. The footnote preserves the more source-shaped alternative, including the Greek image of ‘the days’ being completed. The temporal connection and the restrained fulfillment nuance are retained without imposing a theological conclusion.
