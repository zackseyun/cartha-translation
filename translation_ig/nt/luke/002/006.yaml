  text: ἐγένετο δὲ ἐν τῷ εἶναι αὐτοὺς ἐκεῖ ἐπλήσθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: ig
  text: Mgbe ha nọ n’ebe ahụ, ụbọchị ọmụmụ nwa ya ruru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụbọchị ndị ahụ mezuru ka ọ mụọ nwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: Mgbe
  rationale: N’ebe a, usoro okwu a na-akwalite akụkọ gaa n’ihu ma jikọta ya na ọnọdụ oge sochirinụ; n’Igbo, ‘Mgbe’ na-eweta njikọ ahụ n’ụzọ eke n’enweghị ntụgharị siri ike dịka ‘o wee ruo na.’
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: ha nọ n’ebe ahụ
  rationale: Usoro infinitive a na ἐν na-egosi ihe na-eme n’otu oge; ‘ha nọ n’ebe ahụ’ bụ Igbo doro anya ma bụrụ nke eke.
- source_word: ἐπλήσθησαν
  choice: zuru
  rationale: ‘Zuru’ na-egosi na ụbọchị ahụ erutela n’uju ma ọ bụ na oge ahụ emezuola, na-enweghị ịgbakwunye nkọwa banyere nzube Chineke nke amaokwu ahụ na-ekwughị kpọmkwem.
- source_word: αἱ ἡμέραι
  choice: ụbọchị ndị ahụ
  rationale: A hapụrụ ihe oyiyi Grik nke ‘ụbọchị’ kama ime ka ọ bụrụ naanị ‘oge,’ iji nọgide nso n’usoro okwu Luk ma mee ka Igbo ghọta ya.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: maka ya ịmụ nwa
  rationale: Nke a na-edobe ike ngwaa τίκτω ma kwuo n’Igbo doro anya na oge ịmụ nwa erutela.
theological_decisions:
- issue: Ma okwu ἐπλήσθησαν αἱ ἡμέραι ọ̀ na-egosi naanị njedebe afọ ime ka ọ bụkwa oge Chineke kara aka
  choice: ụbọchị ndị ahụ zuru
  alternative: oge ịmụ nwa ya eruola
  rationale: Nhọrọ a na-echekwa okwu Luk banyere ụbọchị iru n’uju, ma ọ naghị ekwupụta ozizi banyere ndokwa Chineke karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ịmụ nwa’ mee ka okwu ahụ bụrụ nke ndị nkịtị na-aghọta ozugbo, ebe ‘ụbọchị ndị ahụ zuru’ na-echekwa ụda na ihe oyiyi nke isi mmalite Grik.
