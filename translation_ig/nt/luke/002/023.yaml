  terminology: “Iwu Onyenwe anyị” is an appropriate rendering of νόμῳ κυρίου, and “Onyenwe anyị” consistently renders κύριος. The central holiness term is retained in the main text rather than replaced by the explanatory “onye e doro iche.” Footnote a supplies a clear idiomatic alternative, while footnote b accurately explains the firstborn/consecration sense and provides the relevant Exodus references.
