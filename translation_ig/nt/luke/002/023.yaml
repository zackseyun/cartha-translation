id: LUK.2.23
reference: Luke 2:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: ig
  text: 'dị ka e dere n’Iwu Onyenwe anyị, sị: “Nwa nwoke ọ bụla nke meghere akpa nwa[a] ka a ga-akpọ onye dị nsọ nye Onyenwe anyị.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nwa nwoke ọ bụla nke bu ụzọ pụta n’akpa nwa.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, a na-ewere nwa nwoke mbụ dị ka onye dị nsọ, ma ọ bụ onye e doro iche, nye Onyenwe anyị. Tulee Ọpụpụ 13:2, 12.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: dị ka e dere
  rationale: Ọ bụ ụzọ Igbo doro anya ma dịkwa ùgwù isi gosi usoro e ji kpọpụta ihe e dere n’Akwụkwọ Nsọ, ma na-edobe echiche nke ihe e dere nke ka dị ire.
- source_word: ἐν νόμῳ κυρίου
  choice: n’Iwu Onyenwe anyị
  rationale: “Iwu” na-ezo aka n’Iwu Chineke e dere, ebe “Onyenwe anyị” na-asụgharị κύριος n’ụzọ Igbo a na-aghọta nke ọma.
- source_word: ὅτι
  choice: 'sị:'
  rationale: N’Igbo, “sị” na akara ntụpọ abụọ na-ewebata kpọmkwem ihe e dere n’ụzọ dị mma karịa iji “na” kee ahịrịokwu a.
- source_word: Πᾶν ἄρσεν
  choice: Nwa nwoke ọ bụla
  rationale: “Nwa nwoke” na-eme ka okwu ahụ doo anya n’ọnọdụ a nke na-ekwu banyere nwa ọhụrụ nwoke, ebe “ọ bụla” na-edobe ike nke πᾶν.
- source_word: διανοῖγον μήτραν
  choice: nke meghere akpa nwa
  rationale: Nke a na-edobe okwu atụ e ji kwuo banyere nwa nwoke mbụ si n’akpa nwa pụta, n’enweghị itinye “ọkpara” kpọmkwem n’ahịrịokwu bụ isi.
- source_word: ἅγιον τῷ κυρίῳ
  choice: onye dị nsọ nye Onyenwe anyị
  rationale: A hapụrụ okwu ịdị nsọ n’ụzọ pụtara ìhè kama iji naanị okwu nkọwa dịka “onye e doro iche,” ma “nye Onyenwe anyị” na-egosi mmekọrịta nke nraranye ahụ.
- source_word: κληθήσεται
  choice: ka a ga-akpọ
  rationale: Nke a na-edobe ọdịdị ọdịnihu na nke nnara nke ngwaa Grik, ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Otu e si asụgharị κύριος n’okwu e hotara n’Iwu Izrel
  choice: Onyenwe anyị
  alternative: ONYENWE ANYỊ
  rationale: Ebe isiokwu a bụ ederede Grik nke ji κύριος, a sụgharịrị ya “Onyenwe anyị”; e tinyeghị mkpụrụedemede ukwu niile nke ga-egosi kpọmkwem ọdịdị aha Chineke n’asụsụ Hibru.
- issue: Ịdị nsọ ma ọ bụ ịbụ onye e doro iche
  choice: onye dị nsọ nye Onyenwe anyị
  alternative: onye e doro iche nye Onyenwe anyị
  rationale: ἅγιον pụtara “dị nsọ.” Nhọrọ bụ isi na-echekwa okwu banyere ịdị nsọ, ebe nkọwa ala peeji na-akọwa echiche nke ịbụ onye e doro iche nye Chineke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa ùgwù. E debere ụda nke okwu e hotara n’Iwu ahụ n’enweghị asụsụ ochie ma ọ bụ nkọwa ụka pụrụ iche.
