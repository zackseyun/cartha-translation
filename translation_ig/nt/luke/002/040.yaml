  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: ig
  text: Nwatakịrị ahụ nọ na-eto, na-adịwanye ike, na-ejupụta n’amamihe[b]; ihu ọma Chineke dịkwasịrị ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “amara Chineke dịkwasịrị ya.”
    reason: lexical_alternative
  - marker: b
    text: Ihe odide ụfọdụ oge ochie anaghị agụnye, “na-ejupụta n’amamihe.”
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: Nwatakịrị ahụ
  rationale: “Nwatakịrị” na-egosi nwata nke ọma n’ọnọdụ akụkọ a; “ahụ” na-eme ka ntụaka ahụ doo anya. A hapụrụ δέ ka usoro ahịrịokwu Igbo gosipụta njikọ akụkọ ahụ n’enweghị njikọ okwu na-adịghị mkpa.
- source_word: ηὔξανεν
  choice: nọ na-eto
  rationale: Ọdịdị imperfect na-egosi uto na-aga n’ihu; “nọ na-eto” na-enye echiche ahụ n’Igbo nkịtị.
- source_word: ἐκραταιοῦτο
  choice: na-adịwanye ike
  rationale: Nke a na-egosi na ike ya nọ na-abawanye n’usoro oge, kwekọrọ n’omume na-aga n’ihu nke ngwaa Grik ahụ.
- source_word: πληρούμενον σοφίᾳ
  choice: na-ejupụtakwa n’amamihe
  rationale: Nkebi participle ahụ na-akọ ihe nọ na-eso uto nwata ahụ aga; “n’amamihe” na-egosi ihe o jupụtara na ya.
- source_word: χάρις θεοῦ
  choice: ihu ọma Chineke
  rationale: N’ebe a χάρις na-egosi ihu ọma ma ọ bụ obi ebere Chineke dị n’ebe nwata ahụ nọ. “Ihu ọma” bụ okwu doro ndị na-agụ Igbo nke oge a anya; “amara” ka bụ ntụgharị ọzọ ziri ezi.
- source_word: ἦν ἐπ’ αὐτό
  choice: dịkwa n’ahụ ya
  rationale: Nkebi a na-egosi na ihu ọma Chineke nọkwasịrị ya; okwu Igbo a na-edobe ihe oyiyi nke ἐπί n’ụzọ dị mfe ma dị ugwu.
theological_decisions:
- issue: Ntughari χάρις θεοῦ n’akụkọ banyere uto Jizọs
  choice: ihu ọma Chineke
  alternative: amara Chineke
  rationale: “Ihu ọma” na-egosi nkwado na obi ọma Chineke n’ebe nwata ahụ nọ n’enweghị ịkọwa karịa ihe ederede kwuru. “Amara” bụkwa ntụgharị ọdịnala na nke kwekọrọ n’ụzọ okwu Grik ahụ si nwee ọtụtụ nghọta, ya mere e debere ya n’okpuru peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma dị ugwu. Usoro “nọ na-eto, na-adịwanye ike, na-ejupụtakwa” na-echekwa echiche omume na-aga n’ihu dị na ngwaa imperfect na participle nke Grik.
