revisions:
- from: Ma lee, otu nwoke nọ na Jeruselem, aha ya bụ Simiọn. Nwoke a bụ onye ezi omume, bụrụkwa onye na-asọpụrụ Chineke. Ọ nọ na-echere nkasi obi Izrel[a], Mmụọ Nsọ dịkwa n’ahụ ya[b].
  to: Ma, lee, otu nwoke nọ na Jeruselem, aha ya bụ Simiọn. Nwoke a bụ onye ezi omume, bụrụkwa onye na-asọpụrụ Chineke. Ọ nọ na-echere nkasi obi Izrel[a], Mmụọ Nsọ nọkwasịrị ya[b].
  rationale: The text is revised only to correct an inaccurate lexical alternative and to render the Spirit’s being ‘upon’ Simeon more faithfully and idiomatically. The footnote preserves the grammatical possibility of an indefinite ‘holy spirit’ without displacing Luke’s contextual reference to the Holy Spirit.
