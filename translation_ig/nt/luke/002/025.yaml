id: LUK.2.25
reference: Luke 2:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: ig
  text: Ma, lee, otu nwoke nọ na Jeruselem, aha ya bụ Simiọn. Nwoke a bụ onye ezi omume, bụrụkwa onye na-asọpụrụ Chineke. Ọ nọ na-echere nkasi obi Izrel[a], Mmụọ Nsọ nọkwasịrị ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka nkasi na mgbake Chineke kwere Izrel na nkwa. Okwu a na-ezo aka na nkasi obi na mgbake sitere n’aka Chineke nke Izrel nọ na-atụ anya ya.
    reason: lexical_alternative
  - marker: b
    text: O nwekwara ike ịbụ, “mmụọ dị nsọ nọkwasịrị ya,” ma n’usoro akụkọ Luk, o yikarịrị ka ọ na-ezo aka na Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” na-echekwa akara okwu Luk ji adọta uche onye na-agụ ma webata onye dị mkpa n’akụkọ ahụ.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: Ebe onye a bụ Simiọn, nwoke a kpọrọ aha, “otu nwoke” bụ nsụgharị doro anya ma kwekọọ n’okike onye a na-ekwu maka ya.
- source_word: ᾧ ὄνομα Συμεών
  choice: aha ya bụ Simiọn
  rationale: Nke a bụ ụzọ Igbo e ji ekwu okwu a n’enweghị ịhapụ ọrụ ya nke ịkọwa onye ahụ.
- source_word: δίκαιος
  choice: onye ezi omume
  rationale: Ọ na-egosi ịdị mma n’omume na ibi ndụ ziri ezi n’ihu Chineke, ma na-echekwa obosara ihe okwu Grik pụtara.
- source_word: εὐλαβής
  choice: onye na-asọpụrụ Chineke
  rationale: N’ebe a okwu ahụ na-akọwa nsọpụrụ na ịkpachapụ anya mmadụ nwere n’ofufe Chineke; nsụgharị a bụ Igbo doro anya ma dị ndụ.
- source_word: προσδεχόμενος
  choice: ọ nọ na-echere
  rationale: Ọ na-egosi nchekwube na-aga n’ihu, ọ bụghị nanị ichere ihe n’enweghị olileanya.
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: nkasi obi Izrel
  rationale: “Nkasi obi” na-echekwa echiche nke nkasi obi Chineke kwere ná nkwa, tinyere mgbake na nzọpụta ndị Izrel na-atụ anya ya.
- source_word: πνεῦμα ἅγιον
  choice: Mmụọ Nsọ
  rationale: Ọ bụ ezie na enweghị mkpụrụokwu na-egosi kpọmkwem “the” n’asụsụ Grik, etu Luk si eji okwu a na amaokwu ndị na-esote na-egosi na ọ na-ekwu maka Mmụọ Nsọ.
- source_word: ἐπ’ αὐτόν
  choice: dịkwa n’ahụ ya
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ si gosipụta na Mmụọ Nsọ nọkwasịrị ya ma nọnyere ya, na-enweghị ịgbakwụnye nkọwa na-adịghị n’ederede.
theological_decisions:
- issue: Onye πνεῦμα ἅγιον na-ezo aka na ya
  choice: Mmụọ Nsọ dịkwa n’ahụ ya
  alternative: mmụọ dị nsọ dị n’ahụ ya
  rationale: N’usoro okwu Luk, karịchaa n’amaokwu 26–27, nke a kacha bụrụ izo aka na Mmụọ Nsọ. Ihe edeturu n’ala na-echekwa ohere ụtọasụsụ nke nsụgharị ọzọ n’enweghị ime ka ọ bụrụ isi ederede.
- issue: Ihe παράκλησις τοῦ Ἰσραήλ pụtara
  choice: nkasi obi Izrel
  alternative: ntụrụndụ Izrel; mgbake Izrel
  rationale: “Nkasi obi” na-echekwa okwu oyiyi nke nkwa Chineke nyere ndị ya, ma hapụ obosara echiche ahụ—nkasi obi, mgbake na nzọpụta—ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E kewara ahịrịokwu ahụ ụzọ atọ iji mee ka ọ na-aga nke ọma n’Igbo, ma e chekwara njikọ echiche niile dị n’asụsụ Grik. E debere akara ihe edeturu [a] n’ebe “nkasi obi Izrel” dị na [b] n’ebe “Mmụọ Nsọ” dị, ka ha kwekọọ n’ihe ihe edeturu ndị ahụ na-akọwa.
