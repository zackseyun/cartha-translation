base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: ig
  text: ka ya na Meri, onye e kwere Josef nkwa ịlụ[a], debanye aha, ebe Meri dị ime[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye Josef na ya kwere nkwa ịlụ.” Nkwa a bụ nkwa alụmdi na nwunye e guzobere n’ụzọ iwu na omenala, nke siri ike karịa nkwa ịlụ dịka ọtụtụ mmadụ si aghọta ya taa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye bu nwa n’afọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: ka e dekọọ aha ya
  rationale: 'N''ọnọdụ ndekọ ọnụ ọgụgụ a, okwu a na-egosi nzube njem Josef: ka ndị ọchịchị dekọọ aha ya. Ụdị a bụ Igbo doro anya ma na-edebe echiche nke ndebanye aha.'
- source_word: σὺν Μαριὰμ
  choice: ya na Meri
  rationale: A sụgharịrị σὺν n'echiche iso mmadụ, ebe Μαριὰμ bụ Meri dịka ọdịnala aha Igbo si dị.
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: nwanyị ahụ e kwere ya nkwa ịlụ
  rationale: Nke a na-egosi nkwa alụmdi na nwunye siri ike n'iwu na n'obodo, ma ọ naghị akpọ Meri nwunye ya n'ahịrịokwu a.
- source_word: οὔσῃ ἐγκύῳ
  choice: onye dị ime
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke oge a isi kọwaa ọnọdụ Meri n'oge ahụ.
theological_decisions:
- issue: Ọnọdụ mmekọrịta Meri na Josef
  choice: nwanyị ahụ e kwere ya nkwa ịlụ
  alternative: onye ya na ya kwere nkwa ịlụ; nwunye ya
  rationale: μνηστεύομαι na-egosi nkwa alụmdi na nwunye e guzobere n'ụzọ iwu na omenala. Ịsị naanị na ha kwere nkwa ịlụ nwere ike ịdịtụ mfe karịa ike okwu Grik ahụ, ebe ịkpọ ya nwunye Josef ga-etinye ihe ahịrịokwu a ekwughị kpọmkwem.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ n'ụzọ na-egosi na Meri so Josef gaa maka ndebanye aha, na-enweghị ime ka Grik kwuo karịa ihe o kwuru.
