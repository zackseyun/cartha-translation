  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ ⸀Μαρία πάντα συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: ig
  text: Ma Meri nọ na-echekwa okwu ndị a niile nke ọma[a], na-atụgharị uche banyere ha n’obi ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-edebe ihe ndị a niile”; echiche ya bụ iji nlezianya chekwaa ha.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a nwekwara echiche nke “ịchịkọta ha ọnụ n’uche” ma ọ bụ “ịtụle ha ọnụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche dị n’etiti mmeghachi omume ndị ọzụzụ atụrụ na nke Meri, ma ọ bụ ntụgharị n’akụkọ; “Ma” na-arụ ọrụ abụọ ahụ nke ọma n’Igbo.
- source_word: Μαρία
  choice: Meri
  rationale: Nke a bụ ụdị aha Μαρία a na-ejikarị eme ihe n’Igbo.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: okwu ndị a niile
  rationale: ῥήματα n’ebe a na-ezo aka n’ihe ndị ọzụzụ atụrụ kwuru na ozi ha kọrọ. “Okwu” na-edobe njikọ ya na ihe e kwuru, ebe “niile” na-egosi πάντα.
- source_word: συνετήρει
  choice: nọ na-echekwa ... nke ọma
  rationale: Ọdịdị imperfect na-egosi omume na-aga n’ihu. “Ichekwa nke ọma” na-egosikwa na Meri ji nlezianya debe okwu ndị ahụ, ọ bụghị nanị na o chetara ha.
- source_word: συμβάλλουσα
  choice: na-atụgharị uche banyere ha
  rationale: Nkebi a na-egosi na Meri nọ na-achịkọta ihe ndị ahụ n’uche, na-atụle ha, ma na-achọ ịhụ otú ha si kwekọọ. “Na-atụgharị uche” bụ okwu Igbo doro anya nke na-edobe echiche miri emi ahụ n’enweghị ikwu na ọ ghọtachara ihe niile.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: n’obi ya
  rationale: Nke a na-edobe ihe atụ nke asụsụ Grik banyere echiche na ntụgharị uche dị n’ime mmadụ, ma bụrụkwa okwu eke na nke a maara nke ọma n’Igbo.
theological_decisions:
- issue: Ụdị mmeghachi omume Meri
  choice: Meri ji nlezianya na-echekwa ozi ahụ ma na-atụgharị uche banyere ya.
  alternative: Meri chetara ihe ndị ahụ nanị, ma ọ bụ na ọ ghọtachara ihe niile n’oge ahụ.
  rationale: Amaokwu ahụ na-egosi nchekwa na ntụgharị uche na-aga n’ihu, ma ọ naghị ekwu na Meri ghọtachara ihe niile. Nsụgharị ahụ na-ahapụ esemokwu a ka ọ dị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nọ na-echekwa” na-egosi omume na-aga n’ihu, ebe “n’obi ya” na-edobe ihe atụ dị n’asụsụ mbụ.
