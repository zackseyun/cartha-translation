base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: ig
  text: Ọ soro ha gbadaa wee bịaruo Nazaret. Ọ nọgidekwara na-erubere ha isi[a]. Nne ya na-edobe okwu ndị a niile n’obi ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ nọgidere n’okpuru ha.” Okwu Grik a na-egosi ido onwe onye n’okpuru ma ọ bụ nrubeisi na-aga n’ihu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ihe ndị a niile” ma ọ bụ “okwu ndị a niile e kwuru.” Okwu Grik bụ ῥήματα nwere ike ịpụta okwu e kwuru, okwu ọnụ, ma ọ bụ ihe ndị a kọrọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη μετ’ αὐτῶν
  choice: Ọ soro ha gbadaa
  rationale: “Gbadaa” na-echekwa echiche nke njem si n’ebe dị elu gbadata, ebe “soro ha” na-egosi n'ụzọ nkịtị na ọ bụ ha ka ya na ha gara.
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: wee bịaruo Nazaret
  rationale: “Bịaruo” bụ okwu Igbo dị mfe ma doo anya maka iru ebe njem ahụ na-aga.
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: Ọ nọgidekwara na-erubere ha isi
  rationale: Ụdị ngwaa Grik a na-egosi omume na-adịgide adịgide. “Nọgide na-erubere ha isi” na-ekwupụta nrubeisi Jizọs nye Meri na Josef n’ụzọ Igbo dị ndụ ma ghara ime ka ọ bụrụ nanị ọnọdụ na-adịghị arụ ọrụ.
- source_word: διετήρει
  choice: debere
  rationale: “Debere” na-egosi ichekwa ihe n’uche; ahịrịokwu “n’obi ya” na-eme ka echiche nke icheta na ịtụgharị uche pụta ìhè n’enweghị ịgbakwunye nkọwa n’ime ederede.
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: okwu ndị a niile
  rationale: “Okwu” na-anọ nso n’ụzọ ῥήματα si ezo aka n’ihe e kwuru, ebe nkọwa ala peeji na-echekwa ohere ọ pụtara ihe ndị mere ma ọ bụ ihe ndị a kọrọ.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: n’obi ya
  rationale: Nke a bụ akpaalaokwu Igbo doro anya maka ichekwa ihe n’ime mmadụ na ịtụgharị uche banyere ya.
theological_decisions:
- issue: Otú e si kọwaa mmekọrịta Jizọs na nne na nna ya n’ụwa
  choice: Ọ nọgidekwara na-erubere ha isi
  alternative: Ọ nọgidere n’okpuru ha
  rationale: Ederede Grik na-ekwu hoo haa na Jizọs nọgidere na-edo onwe ya n’okpuru Meri na Josef n’oge a. Nsụgharị a na-echekwa nrubeisi ahụ na-adịgide adịgide, n’enweghị ibelata onye ọ bụ ma ọ bụ itinye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, mee ihe. “Ọ nọgidekwara na-erubere ha isi” na-eme ka omume ahụ na-aga n’ihu pụta ìhè; “debere … n’obi ya” na-echekwa akpaalaokwu Akwụkwọ Nsọ n’ụzọ ndị na-agụ Igbo ga-aghọta.
