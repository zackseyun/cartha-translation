  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: ig
  text: Ha wee bịa ngwa ngwa, chọta Meri na Josef na nwa ọhụrụ ahụ ka ọ dina n’ebe a na-adọba nri anụ ụlọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe e ji enye anụ ụlọ nri.” Okwu Grik φάτνη nwere ike ịpụta ebe a na-adọba nri anụ ụlọ ma ọ bụ ihe e ji enye ha nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: bịa
  rationale: N’usoro akụkọ a, ngwaa a na-egosi na ha bịarutere ebe mmụọ ozi gwara ha banyere ya; “bịa” bụ okwu Igbo dị mfe ma kwekọọ na mmegharị ahụ.
- source_word: σπεύσαντες
  choice: jiri ọsọ
  rationale: Nke a na-egosi otú ha si bịa—ha mere ngwa ngwa n’ihi ịdị ọkụ n’obi—ma bụrụkwa okwu Igbo e ji ekwu ya n’ụzọ nkịtị.
- source_word: ἀνεῦραν
  choice: hụ
  rationale: Ngwaa Grik a pụtara ịchọta ihe mgbe a chọchara ya. N’Igbo, “hụ” na-ekwupụta n’ụzọ dị mma na ọchịchọ ha gara nke ọma, ebe ihe gbara amaokwu ahụ gburugburu na-eme ka echiche nke ịchọ pụta ìhè.
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: Meri na Josef
  rationale: E dere aha ndị a dịka a na-akpọkarị ha n’Igbo; njikọ τε ... καί pụtara site n’iji “na” jikọta ha.
- source_word: τὸ βρέφος
  choice: nwa ọhụrụ ahụ
  rationale: βρέφος ebe a bụ nwa a mụrụ ọhụrụ. “Nwa ọhụrụ” doro ndị na-agụ Igbo anya ma kwekọọ n’ihe gbasara ọmụmụ Jizọs n’akụkọ a.
- source_word: κείμενον
  choice: ka o dina
  rationale: Okwu a na-akọ ọnọdụ nwa ahụ, ọ bụghị omume mmadụ ịtọgbọ ya; “ka o dina” na-echekwa echiche ahụ.
- source_word: ἐν τῇ φάτνῃ
  choice: n’ebe a na-adọba nri anụ ụlọ
  rationale: φάτνη nwere ike ịbụ ebe ma ọ bụ ihe a na-etinye nri anụ ụlọ. Nsụgharị a bụ nke doro anya nye onye Igbo nke oge a ma ghara ịgbakwunye nkọwa na-adịghị n’isi mmalite.
- source_word: καὶ ... καὶ ... καὶ
  choice: wee ... na ... hụkwa
  rationale: Usoro njikọ a na-echekwa mgbakwunye dị mfe nke akụkọ Grik ahụ, ma na-eme ya n’ụzọ na-aga were were n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ngwa ngwa ndị ọzụzụ atụrụ mere na ọnọdụ nwa ahụ n’ụzọ kwekọrọ n’usoro akụkọ Grik. E bugara akara nkọwa ala peeji [a] n’akụkụ okwu φάτνη ọ na-akọwa.
