revisions:
- from: Ha wee jiri ọsọ bịa, hụ Meri na Josef, hụkwa nwa ọhụrụ ahụ ka o dina n’ebe a na-adọba nri anụ ụlọ.[a]
  to: Ha wee bịa ngwa ngwa, chọta Meri na Josef na nwa ọhụrụ ahụ ka ọ dina n’ebe a na-adọba nri anụ ụlọ.[a]
  rationale: Replaced “hụ” with “chọta” to render ἀνεῦραν faithfully, and made Mary, Joseph, and the baby the coordinated objects of that single finding action. The wording for haste and the stative description of the baby lying in the φάτνη are retained in natural Standard Igbo. The lexical-alternative footnote remains anchored to φάτνη and preserves the source word’s range.
