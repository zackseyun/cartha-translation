  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: ig
  text: Otuto dịrị Chineke n’ebe kachasị elu, udo dịkwa n’ụwa n’etiti ndị ọ na-enwe mmasị n’ebe ha nọ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti ndị nọ n’ihu ọma ya.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere, “udo dịkwa n’ụwa, ihu ọma n’etiti ụmụ mmadụ.”
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: Otuto
  rationale: N’ebe a, okwu ahụ bụ mkpu a na-eji enye Chineke otuto; “Otuto dịrị Chineke” bụ okwu Igbo doro anya ma dịkwa ugwu.
- source_word: ἐν ὑψίστοις
  choice: n’ebe kachasị elu
  rationale: Nke a na-egosi ebe kachasị elu nke eluigwe, ma na-edobe ọdịiche ya na “n’ụwa.”
- source_word: θεῷ
  choice: dịrị Chineke
  rationale: Ụdị a na-egosipụta na ọ bụ Chineke ka a na-enye otuto, dịka dative Grik ahụ si arụ ọrụ.
- source_word: ἐπὶ γῆς
  choice: n’ụwa
  rationale: Ntụgharị a bụ nke nkịtị ma doo anya, ọ na-emegidekwa “n’ebe kachasị elu.”
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” na-eburu nghọta sara mbara nke okwu ahụ n’akụkụ Akwụkwọ Nsọ.
- source_word: ἐν ἀνθρώποις
  choice: n’etiti ndị
  rationale: ἀνθρώποις na-ekwu maka ụmụ mmadụ n’ozuzu; “ndị” bụ ụzọ Igbo eke si zere ime ka okwu ahụ bụrụ naanị ụmụ nwoke.
- source_word: εὐδοκίας
  choice: ihe ha dị ya mma
  rationale: Genitive ahụ na-akọwa ndị ahụ dịka ndị dị Chineke mma. Ntụgharị a bụ Igbo eke, ebe nnọchiaha “ya” na-eme ka onye nwe ihu ọma ahụ pụta ìhè site n’ọnọdụ okwu, n’agbanyeghị na ọ bụghị okwu kwụụrụ onwe ya na Grik.
theological_decisions:
- issue: Ihe genitive εὐδοκίας pụtara n’ozi ndị mmụọ ozi
  choice: Udo dị n’etiti ndị dị Chineke mma.
  alternative: “Udo dịrị mmadụ, ihu ọma dịkwa” dịka ụfọdụ akwụkwọ aka ochie nwere nominative εὐδοκία.
  rationale: SBLGNT họọrọ εὐδοκίας, nke jikọtara udo na ndị bụ ihe na-atọ Chineke ụtọ ma ọ bụ ndị nọ n’ihu ọma ya. A naghị eji nke a tinye usoro ozizi pụrụ iche; ọ bụ naanị idebe ike ụtọasụsụ nke ederede a họọrọ.
translation_notes:
  register: E jiri Standard Igbo nke oge a, nke dị mfe nghọta ma dị ugwu. A họọrọ “ndị” maka ụmụ mmadụ n’ozuzu, ebe Igbo anaghị achọ ihe ndetu pụrụ iche iji gosi na okwu ahụ gụnyere nwoke na nwanyị.
