  to: E nwekwara otu onye amụma nwanyị aha ya bụ Ana, nwa Fanuel, onye si n’ebo Asha. Ọ merela agadi nke ukwuu[a]. Ya na di ya biri afọ asaa kemgbe ọ lụrụ di[b],
