id: LUK.2.36
reference: Luke 2:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: ig
  text: E nwekwara otu onye amụma nwanyị aha ya bụ Ana, nwa Fanuel, onye si n’ebo Asha. Ọ merela agadi nke ukwuu[a]. Ya na di ya biri afọ asaa kemgbe ọ lụrụ di[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ akpaalaokwu nke pụtara na mmadụ merela agadi; n’ụzọ nkịtị, ọ na-ekwu na ọ “gagoro n’ihu n’ọtụtụ ụbọchị.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ya na di ya biri afọ asaa site n’amaghị nwoke ya.” Nke a na-egosi na a gụrụ afọ asaa ahụ malite n’oge ọ lụrụ di.
    reason: lexical_alternative
lexical_decisions:
- source_word: προφῆτις
  choice: onye amụma nwanyị
  rationale: Aha Grik a bụ nke nwanyị kpọmkwem; ntụgharị a na-egosi n'ụzọ doro anya na Ana bụ nwanyị onye amụma.
- source_word: θυγάτηρ Φανουήλ
  choice: nwa Fanuel
  rationale: N’Igbo, “nwa Fanuel” bụ ụzọ ebumpụta ụwa isi kwuo njikọ nna na nwa n’ebe a, ebe ihe gbara ya gburugburu na-egosi na ọ bụ nwaanyị.
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: onye si n’ebo Asha
  rationale: “Si n’ebo” na-egosipụta mmalite na njikọ ebo nke ἐκ na-enye.
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: Ọ merela agadi nke ukwuu
  rationale: Nke a na-enye echiche ilu Grik ahụ n’Igbo dị ugbu a ma dị mfe nghọta; nkọwa okwu-okwu ya dị n’okpuru ala.
- source_word: ζήσασα μετὰ ἀνδρὸς
  choice: Ya na di ya biri
  rationale: N’ọnọdụ a, ἀνήρ pụtara di, ọ bụghị naanị nwoke ya na ya bi; “di ya” bụ okwu Igbo kwesịrị ekwesị ma ghara ime ka alụmdi na nwunye ahụ doo anya karịa ihe odide ahụ.
- source_word: ἔτη ἑπτὰ
  choice: afọ asaa
  rationale: Nke a bụ ntụgharị kpọmkwem nke ogologo oge ahụ.
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: malite n’oge ọ kwụsịrị ịbụ nwa agbọghọ na-amaghị nwoke
  rationale: Nke a na-eme ka okwu Grik ahụ bụrụ Igbo a na-aghọta, na-egosi na a na-agụ afọ asaa ahụ malite n’oge alụmdi na nwunye mere ka oge amaghị nwoke ya kwụsị, n’ejighị nkọwa oge ọzọ tinye.
theological_decisions:
- issue: Ọkwa Ana dịka προφῆτις
  choice: A kpọrọ Ana onye amụma nwanyị n’echiche Akwụkwọ Nsọ nkịtị.
  alternative: Iwere okwu ahụ dịka naanị aha nsọpụrụ ma ọ bụ ịkpọ ya naanị nwanyị ji ofufe kpọrọ ihe.
  rationale: Okwu Grik ahụ bụ aha nkịtị maka onye amụma n’ụdị nwanyị; ya mere, e kwesịghị ime ka ọrụ ahụ daa mbà.
- issue: Nkọwa banyere ịka nká Ana
  choice: E tinyere echiche ilu ahụ n’Igbo dịka “Ọ merela agadi nke ukwuu,” ma debe ọdịdị okwu Grik n’okpuru ala.
  alternative: Ịsụgharị ya okwu-okwu dịka “ọ gaworị n’ihu n’ọtụtụ ụbọchị,” ma ọ bụ itinye ọnụ ọgụgụ afọ nke amaokwu na-esote.
  rationale: Ụdị Igbo a na-enye ihe ilu Grik pụtara n’enweghị ịgbakwunye ọnụ ọgụgụ afọ nke amaokwu a na-ekwughị.
- issue: Mmalite afọ asaa nke alụmdi na nwunye
  choice: Afọ asaa ahụ malitere mgbe ọnọdụ ya dịka nwa agbọghọ na-amaghị nwoke kwụsịrị.
  alternative: Ịhapụ “site n’amaghị nwoke ya” n’ụdị nwere ike iyi ka ọ ka bụ nwa agbọghọ na-amaghị nwoke mgbe ya na di ya bi.
  rationale: Nke a bụ nghọta ebumpụta ụwa nke ἀπὸ τῆς παρθενίας αὐτῆς n’ọnọdụ alụmdi na nwunye, ma e debere ntụgharị dị nso n’okwu Grik n’okpuru ala.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Onye amụma nwanyị” na-echekwa akara okike dị n’okwu Grik; “merela agadi nke ukwuu” na-enye akpaalaokwu ahụ n’Igbo ebumpụta ụwa. Akara [a] na [b] dị n’ebe okwu nke ọ bụla ha na-akọwa dị.
