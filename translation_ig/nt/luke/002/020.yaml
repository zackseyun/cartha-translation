base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: ig
  text: Ndị na-azụ atụrụ wee laghachi[a], na-enye Chineke ebube ma na-eto ya maka ihe niile ha nụrụ ma hụ[b], dị nnọọ ka a gwara ha[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wee laa azụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi ihe niile ha nụrụ ma hụ.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “dị nnọọ ka e kwuru ha okwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: wee laghachi
  rationale: Ngwaa a na-egosi na ha si n’ebe ha gara lọghachi n’ebe ma ọ bụ n’ọrụ ha nọbu. “Laghachi” bụ okwu Igbo doro anya ma dịkwa ugbu a.
- source_word: οἱ ποιμένες
  choice: ndị ọzụzụ atụrụ
  rationale: Nke a bụ aha Igbo a na-ejikarị akọwa ndị na-elekọta atụrụ, bụ́ ndị a kpọtụrụ aha na mbụ n’akụkọ a.
- source_word: δοξάζοντες
  choice: na-enye Chineke ebube
  rationale: Nkebi a na-egosi ihe ha nọ na-eme mgbe ha na-alaghachi. “Inye Chineke ebube” na-echekwa echiche nke δοξάζω ma mee ka ọ dị iche ntakịrị n’αἰνέω.
- source_word: αἰνοῦντες
  choice: ma na-eto ya
  rationale: “Ịto” bụ okwu Igbo kwesịrị ekwesị maka ikwupụta otuto. E debere ya iche n’“inye ebube” ka a ghara ijikọta ngwaa abụọ ahụ ka ha bụrụ otu.
- source_word: τὸν θεὸν
  choice: Chineke ... ya
  rationale: Chineke bụ onye ngwaa abụọ ahụ metụtara; nnọchiaha “ya” na-eme ka ahịrịokwu ahụ bụrụ nke Igbo na-asụ nke ọma n’enweghị mgbanwe ihe ọ pụtara.
- source_word: ἐπὶ πᾶσιν οἷς
  choice: n’ihi ihe niile
  rationale: N’ebe a, ἐπί na-egosi ihe kpatara ma ọ bụ ihe mere ha ji enye Chineke ebube na otuto. “N’ihi” na-egosipụta njikọ ahụ nke ọma.
- source_word: ἤκουσαν καὶ εἶδον
  choice: ha nụrụ ma hụ
  rationale: Oge gara aga dị mfe bụ ụzọ Igbo ebumpụta ụwa si kọọ ihe ndị mere tupu ha alaghachi, na-enweghị ịmanye ọdịiche oge ngwaa Grik na-achọghị.
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: dị nnọọ ka a gwara ha
  rationale: Nke a na-echekwa “dị ka” nke καθώς na ụdị nnara nke ἐλαλήθη, ma hapụ onye gwara ha okwu n’amaghị aha dịka Grik si mee.
theological_decisions:
- issue: Ma a ga-akpọ ndị mmụọ ozi aha dịka ndị gwara ndị ọzụzụ atụrụ ihe ahụ
  choice: dị nnọọ ka a gwara ha
  alternative: dị nnọọ ka mmụọ ozi ahụ gwara ha
  rationale: Ọ bụ ezie na ihe gbara amaokwu a gburugburu na-egosi ozi mmụọ ozi ahụ, nkebi Grik a akpọghị onye kwuru okwu aha. Nsụgharị ahụ na-echekwa ụdị nnara ahụ ma ghara ịgbakwunye onye na-eme ihe.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. Nhazi “na-enye ... ma na-eto” na-egosi omume abụọ na-aga n’ihu n’oge ha na-alaghachi. E debere ụdị nnara n’ahịrị ikpeazụ ka onye kwuru okwu ghara ịbụ onye a kpọnyere aha n’enweghị ihe odide Grik kwuru.
