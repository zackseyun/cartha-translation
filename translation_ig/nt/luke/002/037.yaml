  to: Ọ bụkwa nwanyị di ya nwụrụ ruo afọ iri asatọ na anọ[a]. Ọ dịghị mgbe ọ na-apụ n’ogige ụlọnsọ ukwu[b], na-efe Chineke n’ibu ọnụ na ekpere arịrịọ[c] n’abalị na ehihie.
