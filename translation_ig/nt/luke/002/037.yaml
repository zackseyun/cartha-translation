id: LUK.2.37
reference: Luke 2:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: ig
  text: Ọ bụkwa nwanyị di ya nwụrụ ruo afọ iri asatọ na anọ[a]. Ọ dịghị mgbe ọ na-apụ n’ogige ụlọnsọ ukwu[b], na-efe Chineke n’ibu ọnụ na ekpere arịrịọ[c] n’abalị na ehihie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ nọkwara dịka nwanyị di ya nwụrụ afọ iri asatọ na anọ.” Okwu Grik ahụ nwere ike ịpụta ma afọ ndụ Ana ma ogologo oge ọ nọ dịka nwanyị di ya nwụrụ.
    reason: alternative_reading
  - marker: b
    text: Okwu Grik a na-ekwu maka ogige na mpaghara ụlọnsọ ukwu dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “arịrịọsi arịrịọ ike” ma ọ bụ “ịkpọku arịrịọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: nwanyị di ya nwụrụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa ugwu si ekwu nwanyị onye di ya nwụrụ.
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: ruo mgbe ọ gbara afọ iri asatọ na anọ
  rationale: Ọ na-enye nghọta bụ isi na okwu ahụ na-ekwu afọ ndụ Ana, ma ndetu ala na-echekwa nghọta ọzọ nke asụsụ Grik nwere ike inwe.
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: ọ naghị ahapụ ogige ụlọnsọ ukwu
  rationale: Oge ngwaa Grik na-egosi omume ọ na-eme mgbe niile; ‘ogige ụlọnsọ ukwu’ na-egosikwa na ἱερόν bụ mpaghara ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime.
- source_word: νηστείαις
  choice: site n’ibu ọnụ
  rationale: Nkebi a na-egosi ụzọ o si efe Chineke; n’Igbo, ‘ibu ọnụ’ na-ada nke ọma ma nwee ike ịpụta omume a na-eme ugboro ugboro n’ọnọdụ a.
- source_word: δεήσεσιν
  choice: ịrịọ arịrịọ
  rationale: Nke a na-echekwa ike δέησις dị ka ekpere nke ịrịọsi ike ma ọ bụ arịrịọ, karịa okwu sara mbara naanị bụ ‘ekpere.’
- source_word: λατρεύουσα
  choice: ọ na-efe Chineke
  rationale: N’ọnọdụ okpukpe a, ngwaa ahụ na-ekwu ozi ofufe e nyere Chineke; ịkpọ Chineke aha na-eme ka Igbo doo anya n’enweghị ịgbakwunye ozizi pụrụ iche.
- source_word: νύκτα καὶ ἡμέραν
  choice: ehihie na abalị
  rationale: Nke a bụ akpaalaokwu Igbo nkịtị maka omume a na-aga n’ihu mgbe niile, ọ bụ ezie na ọ gbanwere usoro okwu Grik iji mee ka ọ bụrụ Igbo sitere n’ọnụ.
theological_decisions:
- issue: Ma okwu ahụ na-ekwu afọ ndụ Ana ka ọ bụ ogologo oge ọ nọ dịka nwanyị di ya nwụrụ
  choice: Isiokwu bụ isi kwuru na Ana gbara afọ iri asatọ na anọ.
  alternative: O nwere ike ịpụta na ọ nọrọ afọ iri asatọ na anọ dịka nwanyị di ya nwụrụ.
  rationale: Nhazi okwu Grik dị mkpirikpi ma nwee ike ịkwado nghọta abụọ ahụ; isiokwu họọrọ nghọta afọ ndụ maka ịdị mfe, ma ndetu ala chekwara mgbagwoju anya ahụ kama idozi ya kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ogige ụlọnsọ ukwu’ iji doo ọdịiche dị n’etiti ἱερόν na ebe nsọ dị n’ime anya. E debere akara ndetu niile n’ahịrịokwu n’ebe okwu ha na-akọwa dị.
