  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: ig
  text: N’ihi na taa, a mụụrụ unu Onye Nzọpụta n’obodo Devid, onye bụ Mesaya, Onyenwe anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya n’ụzọ ọdịnala, “Kraịst Onyenwe anyị.” Utu aha Grik ndị ahụ bụ χριστὸς κύριος, ya bụ, “Mesaya” na “Onyenwe”; a na-aghọtakarị ha ọnụ dị ka “Mesaya, Onyenwe anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ozi mmụọ ozi kwuru tupu ya, na-egosi ihe mere e ji kpọọ ozi ahụ ozi ọma.
- source_word: ἐτέχθη
  choice: a mụụrụ
  rationale: Ụdị a na-egosi ọmụmụ ahụ dị ka ihe mere eme, ma jikọta ya nke ọma na ὑμῖν, ‘unu.’
- source_word: ὑμῖν
  choice: unu
  rationale: N’usoro ‘a mụụrụ unu,’ ọ na-egosi na ọmụmụ ahụ bụ maka uru ndị na-anụ ozi ahụ.
- source_word: σήμερον
  choice: taa
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-asụ ugbu a maka oge ahụ kpọmkwem.
- source_word: σωτὴρ
  choice: Onye Nzọpụta
  rationale: Ọ na-egosipụta onye na-azọpụta ma na-echekwa ịdị arọ nke aha a n’akụkọ banyere Mesaya.
- source_word: ὅς ἐστιν
  choice: onye bụ
  rationale: Ọ na-ejikọta ‘Onye Nzọpụta’ na aha abụọ na-akọwa onye ọ bụ.
- source_word: χριστὸς
  choice: Mesaya
  rationale: N’ebe a, okwu ahụ bụ utu aha eze ahụ Chineke tere mmanụ, ọ bụghị naanị aha mmadụ.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a maara nke ọma isi kpọọ ‘Lord,’ na-echekwa echiche nke ọchịchị na ịdị elu ya.
- source_word: ἐν πόλει Δαυίδ
  choice: n’obodo Devid
  rationale: Ọ na-echekwa usoro na njikọ eze sitere n’agbụrụ Devid, ebe a na-ezo aka na Betlehem.
theological_decisions:
- issue: Nsụgharị χριστὸς κύριος
  choice: Mesaya Onyenwe anyị
  alternative: Kraịst Onyenwe anyị; Mesaya nke Onyenwe anyị
  rationale: Okwu Grik ahụ tinyere utu aha abụọ, ‘Mesaya’ na ‘Onyenwe,’ n’otu ọnọdụ iji kọwaa Onye Nzọpụta. Nsụgharị a anaghị eme χριστός ka ọ bụrụ naanị aha mmadụ, ma ọ naghị agbanwe okwu ahụ gaa n’echiche ‘Mesaya nke Onyenwe anyị,’ nke bụ nkọwa ọzọ e nwere ike ịtụle.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ ‘a mụụrụ unu’ ka uru ọmụmụ ahụ bara ndị na-anụ ozi pụta ìhè. E debere ‘Mesaya Onyenwe anyị’ na-enweghị ịgbakwunye njikọ nke nwere ike idozi nghọta okwu Grik ahụ n’otu ụzọ naanị.
