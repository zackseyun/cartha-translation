  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: ig
  text: O mere n’ụbọchị ndị ahụ na iwu si n’aka Siza Ọgọstọs pụta ka e debanye aha ndị mmadụ niile bi n’ụwa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ụwa Rom dum,” ma ọ bụ “alaeze ukwu ahụ dum.” Okwu Grik a na-arụtụkarị aka n’ụwa mmadụ bi na ya dịka e si aghọta ya n’okpuru ọchịchị Rom.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο
  choice: O wee ruo
  rationale: Usoro akụkọ Igbo a na-egosi na ihe ọhụrụ mere ma na-aga n’ihu n’akụkọ ahụ, n’enweghị ụda Igbo ochie ma ọ bụ nke siri ike.
- source_word: δὲ
  choice: wee
  rationale: E tinyere ike njikọ na ịga n’ihu nke akụkọ ahụ n’okwu ‘wee’; ọ naghị etinye echiche nke ‘ugbu a’ nke na-adịghị n’isi mmalite Grik.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: n’ụbọchị ndị ahụ
  rationale: Nke a bụ ntụgharị doro anya ma bụrụkwa okwu oge a na-ejikarị n’Igbo.
- source_word: ἐξῆλθεν
  choice: pụta
  rationale: Ọ na-echekwa echiche na iwu ahụ sitere n’aka onye ọchịchị wee ruo ndị mmadụ.
- source_word: δόγμα
  choice: iwu
  rationale: N’ebe a ọ bụ iwu ọchịchị eze ukwu nyere; ‘iwu’ bụ okwu Igbo nkịtị, doro anya, ma kwesịkwa ekwesị n’usoro a.
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: si n’aka Siza Ọgọstọs
  rationale: Ọ na-egosi kpọmkwem ebe iwu ahụ si bịa, dịka παρά tinyere genitive si egosi.
- source_word: ἀπογράφεσθαι
  choice: ka e deba aha
  rationale: Ọ na-egosi idebanye ndị mmadụ n’akwụkwọ ọchịchị n’etinyeghị n’amaokwu a nkọwa pụrụ iche banyere ụtụ isi ma ọ bụ ịgụ ọnụ ọgụgụ.
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: ndị niile bi n’ụwa
  rationale: Nke a na-enye n’Igbo nkịtị echiche nke ụwa mmadụ bi na ya, ma ihe odide ala ala peeji na-echekwa ohere na okwu ahụ na-arụtụ aka n’ụwa Rom ma ọ bụ alaeze ukwu ahụ.
theological_decisions:
- issue: Oke ihe πᾶσαν τὴν οἰκουμένην pụtara
  choice: ndị niile bi n’ụwa
  alternative: ụwa Rom dum; alaeze ukwu ahụ dum
  rationale: Isi okwu a bụ nke akụkọ ihe mere eme na nkọwa mkpụrụokwu, ọ bụghị nkwupụta ozizi. Ahịrị bụ isi na-echekwa nghọta sara mbara nke okwu Grik ahụ, ebe ihe odide ala ala peeji na-egosi nghọta ya n’ọnọdụ ọchịchị Rom.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘O wee ruo’ dịka usoro akụkọ nkịtị; ‘deba aha’ na-ezere ịkọwa ọrụ ahụ kpọmkwem dịka ịtụ ụtụ isi mgbe amaokwu a n’onwe ya ekwughị nke ahụ.
