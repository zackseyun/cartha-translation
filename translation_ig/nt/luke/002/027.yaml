revisions:
- from: Ọ bịakwara n’ime Mmụọ Nsọ baa n’ụlọnsọ ukwu[a]. Mgbe nne na nna nwata ahụ, bụ Jizọs, kpọbatara ya ka ha meere ya ihe dịka omenala Iwu ahụ si dị[b],
  to: Ọ bịakwara n’ụlọ nsọ n’ime Mmụọ Nsọ[a]. Mgbe nne na nna kpọbatara nwata ahụ, bụ Jizọs, ka ha mee ihe a na-emekarị n’Iwu ahụ banyere ya[b],
  rationale: The revision preserves the Greek sequence and its unfinished sentence structure while using idiomatic Standard Igbo. It keeps the contextual reference to the Holy Spirit, translates γονεῖς plainly as “nne na nna,” and makes explicit that the parents’ intended action was the customary action under the law concerning Jesus. The footnote anchor for “ụlọ nsọ” was removed because it did not support a supplied footnote; the remaining anchors correspond to complete footnotes.
