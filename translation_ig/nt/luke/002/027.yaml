id: LUK.2.27
reference: Luke 2:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: ig
  text: Ọ bịakwara n’ụlọ nsọ n’ime Mmụọ Nsọ[a]. Mgbe nne na nna kpọbatara nwata ahụ, bụ Jizọs, ka ha mee ihe a na-emekarị n’Iwu ahụ banyere ya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “site na Mmụọ Nsọ.” Okwu Grik ahụ nwere ike igosi nke ọ bụla n’ime ụzọ abụọ a; “n’ime Mmụọ Nsọ” na-edobe usoro okwu Grik ahụ ma kwekọọ na otú Luk si ekwukarị maka Mmụọ Nsọ n’akụkụ a.
    reason: lexical_alternative
  - marker: b
    text: 'Grik: “nne na nna ahụ.” Luk ji okwu ezinụlọ nkịtị kọwaa Meri na Josef n’ọrụ ha nke ilekọta Jizọs.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: n’ime Mmụọ Nsọ
  rationale: Nke a na-edobe nhazi okwu Grik ahụ, ‘n’ime Mmụọ,’ ma ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Mmụọ Nsọ ka a na-ekwu maka ya, ọ bụghị nanị mmụọ ma ọ bụ mmetụta Simiọn.
- source_word: ἱερόν
  choice: ụlọnsọ ukwu
  rationale: Okwu Grik a na-ezo aka n’ogige na akụkụ niile nke ụlọnsọ ahụ, ọ bụghị naanị ebe nsọ dị n’ime ya. ‘Ụlọnsọ ukwu’ bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe.
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: Mgbe ... kpọbatara
  rationale: Nkebi okwu Grik a na-egosi oge ihe mere; nsụgharị a na-egosipụta nke ahụ n’Igbo dị larịị.
- source_word: γονεῖς
  choice: nne na nna
  rationale: Nke a bụ ihe okwu Grik ahụ pụtara kpọmkwem n’asụsụ ezinụlọ nkịtị. Ọ na-akọwa Meri na Josef dịka ndị na-elekọta Jizọs n’ezinụlọ, n’enweghị ịgbakwunye ma ọ bụ iwepụ ihe metụtara ọmụmụ ya.
- source_word: παιδίον Ἰησοῦν
  choice: nwata ahụ, bụ Jizọs
  rationale: παιδίον na-ezo aka n’ebe a n’ebe nwa ọhụrụ ma ọ bụ nwata nọ; usoro a na-eme ka aha Jizọs na nkọwa ya daa nke ọma n’Igbo.
- source_word: τοῦ ποιῆσαι αὐτοὺς ... περὶ αὐτοῦ
  choice: ka ha meere ya ihe
  rationale: ‘Ha’ bụ nne na nna ahụ, ebe ‘ya’ bụ Jizọs. Nhazi a na-egosi nzube ha n'ụzọ Igbo dị mfe ma debe ndị okwu nnọchiaha ahụ iche.
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: dịka omenala Iwu ahụ si dị
  rationale: εἰθισμένον bụ ihe a na-emebu dịka omenala ma ọ bụ ihe iwu chọrọ. Nsụgharị a na-edobe ma echiche omenala ahụ ma njikọ ya na Iwu ahụ.
theological_decisions:
- issue: Ihe ‘Mmụọ’ na-ezo aka na ya n’omume Simiọn
  choice: Mmụọ Nsọ
  alternative: mmụọ ma ọ bụ mkpali nke Simiọn n’onwe ya
  rationale: Luk 2:25–27 kwuru banyere Mmụọ Nsọ ugboro ugboro, ya mere ihe gbara amaokwu ahụ gburugburu na-akwado na πνεῦμα bụ Mmụọ Nsọ. ‘N’ime’ ka na-edobe ụdị okwu Grik ahụ kama ịkọwa ya naanị dịka ‘site n’ike.’
- issue: Ịkpọ Meri na Josef ‘nne na nna’
  choice: Tụgharịa γονεῖς dịka ‘nne na nna’
  alternative: ndị na-elekọta ya; Josef na Meri
  rationale: Nke a bụ okwu ezinụlọ nkịtị Luk ji mee ihe. A gaghị eme ka ọ gharazie ike iji zere nghọtahie, ma ọ bụ tinye nkọwa na-adịghị n’odide Grik; ọ naghị agọnahụ ọmụmụ Jizọs site n’amaghị nwoke.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. ‘Ụlọnsọ ukwu’ na-ekwupụta ἱερόν n’enweghị ime ka ọ bụrụ naanị ebe nsọ dị n’ime ụlọ ahụ. E debere nkwụsị rịkọm n’ọgwụgwụ n’ihi na amaokwu ahụ na-aga n’ihu n’ahịrịokwu na-esonụ.
