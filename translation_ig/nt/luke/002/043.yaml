id: LUK.2.43
reference: Luke 2:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: ig
  text: Mgbe ha mezuru ụbọchị ndị ahụ, ka ha na-alaghachi, Jizọs, bụ́ nwata nwoke ahụ, nọgidere[a] na Jerusalem; nne na nna ya[b] amaghị nke a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọrọ n’azụ.”
    reason: lexical_alternative
  - marker: b
    text: Grik kwuru, “nne na nna ya.” Okwu ezinụlọ nkịtị Luk ji mee ihe ebe a anaghị agọnarị na e tụụrụ ime Jizọs n’amaghị nwoke, dị ka Luk kwuburu n’Oziọma a.
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: Mgbe ha mezuru ụbọchị ndị ahụ
  rationale: Nke a na-egosi na ụbọchị ndị a kpọtụrụ aha agwụla tupu ihe bụ isi n’akụkọ ahụ emee, ma ọ naghị atụkwasị nkọwa na-adịghị na Grik.
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: ka ha na-alaghachi
  rationale: Ụdị a na-egosi ihe na-aga n’ihu n’otu oge ahụ Jizọs nọgidere na Jerusalem.
- source_word: ὑπέμεινεν
  choice: nọgidere
  rationale: N’ebe a okwu ahụ pụtara ịnọgide n’ebe ahụ mgbe ndị ọzọ na-apụ; ‘nọrọ n’azụ’ bụkwa ụzọ ziri ezi isi kwuo ya.
- source_word: ὁ παῖς
  choice: nwata nwoke ahụ
  rationale: Ebe amaokwu ndị gbara ya gburugburu kwuru na Jizọs dị afọ iri na abụọ, ‘nwata nwoke’ dabara n’afọ ndụ ya ma na-ezere ihe ‘ohu’ nwekwara ike ịpụta n’ọnọdụ ndị ọzọ.
- source_word: ἐν Ἰερουσαλήμ
  choice: na Jerusalem
  rationale: Nke a bụ ntụgharị nkịtị nke okwu na-egosi ebe ihe mere.
- source_word: οὐκ ἔγνωσαν
  choice: amaghị nke a
  rationale: ‘Nke a’ na-eme ka Igbo doo anya na ha amaghị na Jizọs nọgidere na Jerusalem, n’agbanyeghị na Grik ekwughị ihe e ji mezue ngwaa ahụ kpọmkwem.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: nne na nna ya
  rationale: Nke a bụ ụzọ Igbo si ekwu ‘ndị mụrụ ya’ ma ọ bụ ‘parents’ n’asụsụ nkịtị, ọ na-echekwakwa okwu ezinụlọ Luk ji mee ihe.
theological_decisions:
- issue: Ịkpọ Meri na Josef οἱ γονεῖς αὐτοῦ
  choice: nne na nna ya
  alternative: ndị mụrụ ya
  rationale: Grik kpọrọ ha ‘nne na nna ya’ n’asụsụ ezinụlọ nkịtị. A hapụrụ okwu ahụ otú ahụ n’enweghị ịgbanwe ya iji dozie esemokwu o nwere ike iyi ka ọ na-eweta na akụkọ Luk banyere ịtụrụ ime Jizọs site n’ike Mmụọ Nsọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-egosi na nlọghachi ha na ịnọgide Jizọs mere n’otu oge; e debere okwu Luk banyere ‘nne na nna ya’ n’enweghị ime ka esemokwu nkà mmụta okpukpe ahụ laa n’iyi.
