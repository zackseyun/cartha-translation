  text: καὶ μὴ ⸀εὑρόντες ὑπέστρεψαν εἰς Ἰερουσαλὴμ ⸀ἀναζητοῦντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: ig
  text: Mgbe ha achọtaghị ya, ha laghachiri Jerusalem, na-achọ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: Njikọ a na-aga n'ihu n'akụkọ ahụ; “Ma” na-adabara nke ọma ebe amaokwu a na-egosi ihe ha mere mgbe ha achọtaghị ya.
- source_word: μὴ εὑρόντες
  choice: mgbe ha na-achọtaghị ya
  rationale: Nke a na-eme ka participle aorist ahụ bụrụ nkebiokwu ọnọdụ/oge doro anya n'Igbo, n'ebughị ụzọ kpebie ya karịa ihe Grik kwuru.
- source_word: ὑπέστρεψαν
  choice: ha laghachiri
  rationale: “Laghachiri” bụ okwu Igbo ebumpụta ụwa nke pụtara ịlaghachi ebe mmadụ si bịa.
- source_word: εἰς Ἰερουσαλὴμ
  choice: na Jerusalem
  rationale: N'Igbo, “laghachiri na Jerusalem” bụ ụzọ nkịtị isi kwuo ịlaghachi n'obodo ahụ.
- source_word: ἀναζητοῦντες
  choice: na-achọ ya
  rationale: Ọ na-egosi nchọgharị na-aga n'ihu mgbe ha laghachiri; okwu a doro anya ma dị mfe nghọta.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs.
