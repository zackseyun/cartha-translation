revisions:
- from: Ma mgbe ha na-achọtaghị ya[a], ha laghachiri na Jerusalem na-achọ ya.
  to: Mgbe ha achọtaghị ya, ha laghachiri Jerusalem, na-achọ ya.
  rationale: The revision restores the source distinction between not finding Jesus (μὴ εὑρόντες) and searching for him (ἀναζητοῦντες), removes the unsupported contrastive connective, and retains the concise narrative register and circumstantial/temporal ambiguity of the Greek participle.
