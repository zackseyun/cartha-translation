revisions:
- from: Simiọn gọziri ha, sị Meri nne ya, “Lee, e mere ka onye a bụrụ ihe ga-eme ka ọtụtụ ndị n’Izrel daa, meekwa ka ọtụtụ bilie, bụrụkwa ihe ịrịba ama nke ndị mmadụ ga-ekwu okwu megide ya.[a]”
  to: Simiọn gọziri ha, sị Meri, nne ya, “Lee, e debere onye a maka ọdịda na ibilite nke ọtụtụ ndị n’Izrel, nakwa maka ihe ịrịba ama a ga-ekwu okwu megide ya.[a]”
  rationale: 'E mezigharịrị ahịrịokwu ahụ iji soro nhazi na obosara Grik nke ọma: κεῖται εἰς ka e ji “e debere ... maka” sụgharịa, ebe a naghị akpọ onye debere ya aha; πτῶσιν καὶ ἀνάστασιν πολλῶν ka e ji “ọdịda na ibilite nke ọtụtụ” sụgharịa, nke na-adịghị ekpebi ma otu ndị ahụ ka a na-ekwu maka ha; a sụgharịkwara σημεῖον ἀντιλεγόμενον n’ụzọ na-echekwa mmetọ ọnụ/okwu dị na ἀντιλέγω. Akara ụkwụ [a] ka edobere n’ebe kwekọrọ na English audit trail.'
