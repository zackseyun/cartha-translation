  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: ig
  text: Simiọn gọziri ha, sị Meri, nne ya, “Lee, e debere onye a maka ọdịda na ibilite nke ọtụtụ ndị n’Izrel, nakwa maka ihe ịrịba ama a ga-ekwu okwu megide ya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ịrịba ama a na-emegide.”
    reason: Na-enye nsụgharị dị nkenke nke participle ἀντιλεγόμενον; isi nsụgharị na-echekwa echiche nke ikwu okwu megide ihe ịrịba ama ahụ.
lexical_decisions:
- source_word: εὐλόγησεν
  choice: gọziri
  rationale: Okwu Igbo a na-ekwukarị n'ụzọ doro anya maka ịrịọ ma ọ bụ ikwupụta ngọzi n'isi mmadụ.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Na-adọta uche onye na-ege ntị n'ụzọ ebumpụta ụwa ma dịkwa nsọpụrụ.
- source_word: κεῖται εἰς
  choice: e mere ka ... bụrụ ihe ga-eme ka
  rationale: N'ebe a, κεῖται na-egosi ọrụ ma ọ bụ ọnọdụ e kenyere onye a; nsụgharị a na-ezere ịkọwapụta kpọmkwem onye mere nhọpụta ahụ, dịka Grik si hapụ ya.
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: daa, meekwa ka ọtụtụ bilie
  rationale: Na-echekwa ihe abụọ ahụ na-emegiderịta onwe ha—ọdịda na ibili—na-enweghị ikpebi ma otu ndị ahụ ka a na-ekwu maka ha.
- source_word: σημεῖον ἀντιλεγόμενον
  choice: ihe ịrịba ama nke ndị mmadụ ga-ekwu okwu megide ya
  rationale: Na-egosipụta ihe ịrịba ama a na-emegide site n'okwu ma ọ bụ nkwupụta, nke kwekọrọ na ἀντιλέγω.
theological_decisions:
- issue: Ma ‘ọtụtụ’ ahụ bụ otu ìgwè ga-ada ma biliekwa, ka ọ bụ ìgwè dị iche iche
  choice: ka ọtụtụ ndị ... daa, meekwa ka ọtụtụ bilie
  alternative: ka ọtụtụ ndị ahụ daa ma biliekwa
  rationale: Grik nwere πολλῶν naanị otu ugboro ma nwee ike ịgụnye nghọta abụọ ahụ; ikwughachi ‘ọtụtụ’ n'Igbo na-eme ka ahịrịokwu dị mfe nghọta ma ghara ikpebi na ha bụ otu ndị ahụ.
- issue: Ihe κεῖται na-egosi—nhọpụta Chineke ma ọ bụ nanị ọnọdụ/ọrụ
  choice: e mere ka onye a bụrụ ihe ga-eme ka
  alternative: a họpụtara onye a
  rationale: Nhọrọ a na-egosi na e debere ya maka ọrụ a, ma ọ naghị etinye onye mere ya n'okwu ebe Grik akpọghị ya aha.
- issue: Ihe ‘ibilite’ pụtara
  choice: bilie
  alternative: kpọlite n'ọnwụ
  rationale: ἀνάστασις nwere ike ịpụta ibili ma ọ bụ mbilite n'ọnwụ; ebe a, ‘bilie’ na-echekwa obosara na esemokwu nke okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Simiọn” na “Meri” mee aha ndị ahụ n'ụdị a na-ahụkarị n'Igbo. A zere okwu ụka pụrụ iche na nkọwa ga-emechi nghọta Grik nwere ike ịnabata.
