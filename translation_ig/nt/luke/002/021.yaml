  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: ig
  text: Mgbe ụbọchị asatọ zuru maka ibi ya úgwù[a], a kpọrọ ya Jizọs[b], bú aha mmụọ ozi ahụ kwuru ka a kpọọ ya tupu a tụrụ ime ya n’afọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ụbọchị asatọ ahụ zuru.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e nyere ya aha Jizọs.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, n’afọ Meri.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: Mgbe ụbọchị asatọ zuru
  rationale: Nke a na-egosipụta echiche mmezu dị n’okwu Grik ma na-ada ka Igbo nkịtị.
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: maka ibi ya úgwù
  rationale: Akpaalaokwu Igbo a na-egosi ihe e bu n’obi ime ya, dịka infinitive nwere τοῦ si mee na Grik.
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: a kpọrọ ya Jizọs
  rationale: Nke a bụ ụzọ doro anya ma bụrụ nke e ji asụ Igbo maka inye mmadụ aha, ma ọ ka na-edobe olu nnara nke Grik.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Jizọs bụ ntụgharị-ụda aha a nke a maara nke ọma n’Igbo Agba Ọhụrụ.
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: bú aha mmụọ ozi ahụ kwuru ka a kpọọ ya
  rationale: Nke a na-edobe ihe participle κληθέν na-ekwu banyere ịkpọ aha, ma na-ezere usoro okwu na-adịghị eke n’Igbo.
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν
  choice: tupu a tụrụ ime ya
  rationale: ‘Ịtụ ime’ na-egosi kpọmkwem ịtụrụ nwa n’ime afọ n’ọnọdụ a, n’enweghị itinye nkọwa nkà mmụta okpukpe ọzọ.
- source_word: ἐν τῇ κοιλίᾳ
  choice: n’afọ
  rationale: N’ọnọdụ a, ‘afọ’ bụ okwu Igbo nkịtị maka akpa nwa, ihe κοιλία na-ezo aka na ya.
theological_decisions:
- issue: Nkebiokwu banyere ịtụ ime Jizọs na ihe ọ pụtara n’ihe gbasara Kraịst
  choice: tupu a tụrụ ime ya n’afọ
  alternative: tupu ịtụ ime ya n’afọ
  rationale: A sụgharịrị ihe mere eme nke ịtụ ime ya n’ụzọ kwụ ọtọ, n’etinyeghị okwu nkà mmụta okpukpe nke okwu Grik n’onwe ya na-achọghị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro okwu ahụ na-agbaso ihe Grik pụtara n’ụzọ nso, ma na-eji akpaalaokwu Igbo eke eme ihe ebe ntụgharị mkpụrụokwu n’otu n’otu ga-ada arọ.
