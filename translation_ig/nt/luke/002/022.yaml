    text: Ụfọdụ ihe odide na-agụ, “ụbọchị ịdị ọcha ya,” kama “ụbọchị ịdị ọcha ha.”
    reason: textual_variant
  revision_rationale: The revision uses the natural ritual noun phrase “ụbọchị ịdị ọcha ha,” retains the plural pronoun required by the SBLGNT text, and makes the journey clause idiomatic in Standard Igbo. The footnote now states the singular alternative precisely while leaving the textual ambiguity unresolved in the main text.
