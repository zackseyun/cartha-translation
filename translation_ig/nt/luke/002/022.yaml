source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: ig
  text: Mgbe ụbọchị ịdị ọcha ha mezuru, dịka iwu Mosis si dị,[a] ha kpọgara ya Jerusalem ka ha chee ya n’ihu Onyenwe anyị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “ụbọchị ịdị ọcha ya,” kama “ụbọchị ịdị ọcha ha.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: mezuru
  rationale: N’ebe a, okwu a na-egosi na oge a kara aka eruola n’isi njedebe ya; “mezuru” bụ okwu Igbo doro anya ma na-edobe echiche ahụ.
- source_word: καθαρισμοῦ
  choice: ime ka ha dị ọcha
  rationale: N’ọnọdụ a, ọ na-ezo aka n’usoro ịdị ọcha nke emume dịka Iwu Mosis si dị mgbe amụsịrị nwa. Nkebiokwu a na-eme ka ihe ọ pụtara doo ndị na-agụ Igbo anya.
- source_word: αὐτῶν
  choice: ha
  rationale: Ihe odide Grik e nyere nwere nnọchiaha ọtụtụ αὐτῶν, ya mere isi ederede na-edobe ọtụtụ ahụ kama ịgbanwe ya ka ọ bụrụ otu onye.
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: dị ka iwu Mosis si dị
  rationale: Nke a na-egosi ime ihe n’ikwekọ n’ihe Iwu Mosis chọrọ, n’asụsụ Igbo dị mfe ma kwụ ọtọ.
- source_word: ἀνήγαγον
  choice: ha kpọrọ ya rịgoro
  rationale: “Rịgoro” na-edobe echiche nke ịrịgo Jeruselem, ebe “kpọrọ ya” na-egosi na ha buuru nwa ahụ gaa.
- source_word: Ἱεροσόλυμα
  choice: Jeruselem
  rationale: Nke a bụ ụdị aha obodo ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: παραστῆσαι
  choice: ka ha chee ya n’ihu
  rationale: N’ọnọdụ iwu na ofufe a, okwu ahụ pụtara iweta ma ọ bụ iche mmadụ n’ihu Chineke; ntụgharị a bụ nke ebumpụta ụwa n’Igbo.
- source_word: κυρίῳ
  choice: Onyenwe anyị
  rationale: N’ebe a κύριος na-ezo aka n’ebe Chineke nọ n’ụzọ nsọpụrụ na nke ọgbụgba ndụ; “Onyenwe anyị” bụ ntụgharị Igbo kwụsiri ike.
theological_decisions:
- issue: Ọnụọgụ nnọchiaha n’okwu gbasara ịdị ọcha
  choice: 'Idowe ọtụtụ: “ime ka ha dị ọcha” n’isi ederede'
  alternative: “ime ka ọ dị ọcha” (na-ezo aka n’ebe Meri nọ)
  rationale: SBLGNT e nyere gụrụ αὐτῶν, “ha.” Ọ bụ ezie na ụfọdụ ihe odide nwere nnọchiaha otu nwanyị ma Iwu Ndị Livaị na-elekwasị anya n’ebe nne nọ, e kwesịghị idozi esemokwu ahụ na nzuzo; a na-edowe ọtụtụ n’isi ederede ma tinye nke ọzọ n’ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A na-edobe ụda iwu na ofufe nke amaokwu ahụ, tinyere mgbagwoju anya dị na nnọchiaha ọtụtụ.
