  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: ig
  text: Nna ya na nne ya nọ na-eju anya n’ihe ndị a na-ekwu banyere ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “nna ya.” N’akụkọ a, nke a na-ezo aka na Josef dịka nna ya n’usoro ezinụlọ na iwu; ụfọdụ ntụgharị na-asị “Josef na nne ya” iji gbochie nghọtahie n’ihi akụkọ Luk kwuru na mbụ banyere ịtụrụ Jizọs site n’amaghị nwoke.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: nna ya
  rationale: Nke a na-asụgharị okwu Grik ahụ kpọmkwem dịka e dere ya, kama iji “Josef” dochie ya. N’akụkọ a, ọ na-ezo aka na Josef dịka nna n’usoro ezinụlọ na iwu.
- source_word: μήτηρ
  choice: nne ya
  rationale: Nke a bụ ntụgharị nkịtị na nke doro anya nke μήτηρ, ma ya na “nna ya” na-etolite otu ụzọ okwu ezinụlọ.
- source_word: θαυμάζοντες
  choice: nọ na-atụkwa ... n’anya
  rationale: ἦν tinyere participle na-egosi omume na-aga n’ihu n’oge gara aga. “Nọ na-atụkwa ... n’anya” na-egosipụta ma oge ahụ ma mmetụta ijuanya.
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: ihe ndị a na-ekwu
  rationale: 'Ọ na-echekwa participle passive na plural: ihe ndị a nọ na-ekwu, ọ bụghị naanị echiche e chịkọtara n’otu okwu.'
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: Nke a bụ Igbo dị ugbu a ma kwekọọ n’ụzọ nkịtị na περί ya na genitive.
theological_decisions:
- issue: Ịkpọ Josef “nna ya” n’ebe akụkọ ahụ kwadoro ịtụrụ Jizọs site n’amaghị nwoke
  choice: E debere okwu ederede ahụ dịka “nna ya,” ma kọwaa nghọta ezinụlọ/iwu ya n’ala ala peeji.
  alternative: “Josef na nne ya” ma ọ bụ “nna ya, ya bụ Josef n’usoro iwu na mmekọrịta mmadụ”
  rationale: Isi mmalite Grik kwuru “nna ya.” Luk nwere ike iji okwu ezinụlọ nkịtị a kpọọ Josef nna Jizọs n’emebighị akụkọ ya gara aga banyere ịtụrụ Jizọs site n’amaghị nwoke. Ịgbanwe ya ka ọ bụrụ “Josef” ga-edozi esemokwu ederede ahụ n’ụzọ isi mmalite ahụ n’onwe ya na-emeghị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “nọ na-atụkwa ... n’anya” iji gosipụta omume ijuanya na-aga n’ihu; “ihe ndị a na-ekwu” na-echekwa plural na passive nke Grik.
