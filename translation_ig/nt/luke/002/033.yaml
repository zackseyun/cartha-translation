  verdict: revise
  source_fidelity: The draft correctly retains the Greek wording “his father and mother,” preserves the ongoing past force of ἦν + θαυμάζοντες, and renders the plural passive expression ἐπὶ τοῖς λαλουμένοις as “ihe ndị a na-ekwu.” The proposed revision corrects the Igbo syntactic handling of ‘marveling at.’
  naturalness: '“Nna ya na nne ya nọ na-atụkwa ihe ndị a na-ekwu banyere ya n’anya” is not idiomatic in this sense: in the relevant Igbo construction, the matter spoken of is what ‘surprises’ a person, rather than the persons being the grammatical subject of that verb. “Nọ na-eju anya n’ihe ndị a na-ekwu banyere ya” is natural Standard Igbo and retains the continuing sense.'
  terminology: “Nna ya,” “nne ya,” and “Josef” are appropriate. The footnote responsibly explains the narrative/legal-family reference without replacing the Greek wording or imposing a doctrinal resolution on the translation.
