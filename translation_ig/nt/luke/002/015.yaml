- from: O wee ruo na, mgbe ndị mmụọ ozi si n’ebe ha nọ pụọ gaa n’eluigwe, ndị ọzụzụ atụrụ sịrị ibe ha, “Ka anyị gaa ugbu a ruo Betlehem[a], hụ ihe a merenụ[b], nke Onyenwe anyị mere ka anyị mara.”
  to: O wee mee na, mgbe ndị mmụọ ozi hapụrụ ha gaa n’eluigwe, ndị ọzụzụ atụrụ sịrị ibe ha, “Ka anyị gaa ugbu a ruo Betlehem[a], hụ ihe a merenụ[b], nke Onyenwe anyị mere ka anyị mara.”
