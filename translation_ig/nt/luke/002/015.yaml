id: LUK.2.15
reference: Luke 2:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: ig
  text: O wee mee na, mgbe ndị mmụọ ozi hapụrụ ha gaa n’eluigwe, ndị ọzụzụ atụrụ sịrị ibe ha, “Ka anyị gaa ugbu a ruo Betlehem[a], hụ ihe a merenụ[b], nke Onyenwe anyị mere ka anyị mara.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “gaa Betlehem.” N’okwu Grik, ἕως pụtara n’ụzọ nkịtị “ruo” ma ọ bụ “ruo n’ebe.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ihe a” ma ọ bụ “okwu a.” Okwu Grik ῥῆμα nwere ike ịpụta “okwu,” “ihe/metụta ihe,” ma ọ bụ “ihe mere eme”; n’ebe a ọ na-ezo aka n’ihe ahụ mere.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Ọ bụ usoro Luk ji ewebata ihe mere n’akụkọ. Nsụgharị a na-edobe ọrụ ya n’akụkọ ma na-ada ka Igbo dị ùgwù nke ndị mmadụ taa ga-aghọta.
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανόν
  choice: si n’ebe ha nọ pụọ gaa n’eluigwe
  rationale: Nke a na-egosi ma isi n’ebe ndị ọzụzụ atụrụ nọ pụọ ma ịga n’eluigwe, n’etinyeghị echiche ọzọ na-adịghị n’ederede Grik.
- source_word: οἱ ἄγγελοι
  choice: ndị mmụọ ozi
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị ozi si n’aka Chineke.
- source_word: οἱ ποιμένες
  choice: ndị ọzụzụ atụrụ
  rationale: Ọ bụ nsụgharị doro anya ma bụrụ nke ndị na-agụ Igbo maara.
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: sịrị ibe ha
  rationale: Ọ na-ewebata okwu ha kwuru n’ụzọ Igbo sitere n’okike; imperfect Grik anaghị achọ ka e mee ka ịdịte aka pụta ìhè n’ebe a.
- source_word: Διέλθωμεν δὴ
  choice: Ka anyị gaa ugbu a
  rationale: “Ka anyị gaa” na-egosipụta agbamume dị na subjunctive, ebe “ugbu a” na-ebute ngwa ngwa ma ọ bụ nkwusi ike nke δὴ.
- source_word: ἕως Βηθλέεμ
  choice: ruo Betlehem
  rationale: “Ruo” na-edobe echiche nkịtị nke ἕως, ya bụ ịga ruo ebe ahụ, ma ọ ka bụ Igbo sitere n’okike.
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: ihe a merenụ
  rationale: N’ebe a, ῥῆμα na-ezo aka n’ihe ahụ ndị mmụọ ozi kwuru banyere ya, nke mere eme. “Ihe a merenụ” na-enye nghọta ahụ n’Igbo dị mfe, ebe nkọwa ala peeji na-edobe obosara okwu Grik ahụ.
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: nke Onyenwe anyị mere ka anyị mara
  rationale: “Mere ka anyị mara” na-egosipụta ἐγνώρισεν nke ọma n’emeghị ya ka ọ bụrụ okwu pụrụ iche banyere mkpughe; “Onyenwe anyị” na-edobe aha κύριος.
theological_decisions:
- issue: Onye “Onyenwe anyị” (ὁ κύριος) na-ezo aka na ya
  choice: E debere ya dịka “Onyenwe anyị,” ebe Chineke bụ isi iyi nke ozi ndị mmụọ ozi mere ka ndị ọzụzụ atụrụ mara.
  alternative: A pụrụ ịghọta ya n’ụzọ sara mbara dịka Onyenwe eluigwe, n’akọwaghị ma e mesiri Chineke Nna ike ma ọ bụ ma aha ahụ ọ na-emetụtakwa Mesaya a mụrụ ọhụrụ n’ụzọ akụkọ Luk si aga.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na Chineke bụ onye mere ka ha mara ya, ma nsụgharị ahụ anaghị etinye nkọwa ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “O wee ruo na” na-enye ụtọ akụkọ Akwụkwọ Nsọ n’enweghị okwu ochie siri ike; “sịrị ibe ha” na okwu ha kwuru na-aga nke ọma n’Igbo nkịtị. E debere “Onyenwe anyị” n’enweghị ịkọwapụta onye ahụ karịa ka ederede Grik mere.
