base_translation:
  language: en
  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: ig
  text: Mgbe ọ gbara afọ iri na abụọ, mgbe ha na-arịgo[a] dịka omenala ememme ahụ[b] si dị,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ha rịgoro.” Ma akụkụ okwu Grik a nwere ike igosi omume na-aga n'ihu; ọ bụ ya mere e ji sụgharị ya “mgbe ha na-arịgo.”
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ Ememme Ngabiga, dịka amaokwu bu ụzọ kwuru.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: ọ gbara afọ iri na abụọ
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na mmadụ eruola ma ọ bụ nọ n'afọ ndụ a kapịrị ọnụ; onye a na-ekwu maka ya bụ Jizọs dịka amaokwu ndị bu ụzọ si gosi.
- source_word: ἀναβαινόντων
  choice: ka ha na-arịgo
  rationale: Okwu a pụtara ‘ịrịgo,’ ọ bụkwa okwu a na-ejikarị maka ịga Jerusalem. ‘Na-arịgo’ debere echiche nke ihe na-aga n'ihu n'oge ahụ, na-etinyeghị ‘Jerusalem’ nke a na-ekwughachighị n'amaokwu a.
- source_word: αὐτῶν
  choice: ha
  rationale: Nnọchiaha a na-ezo aka n'òtù ezinụlọ ahụ, karịsịa nne na nna ya n'okwu gbara ya gburugburu; ‘ha’ anaghị akọwapụta ihe Grik na-akọwaghị kpọmkwem.
- source_word: κατὰ τὸ ἔθος
  choice: dịka omenala ... si dị
  rationale: Nkebiokwu Igbo a na-egosi na omume ha kwekọrọ n'usoro a na-eme mgbe niile, ma na-ada nke ọma n'Igbo oge a.
- source_word: τῆς ἑορτῆς
  choice: ememme ahụ
  rationale: ἑορτή bụ ememme okpukpe. Nkọwa aha ‘ahụ’ na-egosi ememme a kpọtụrụ aha n'amaokwu bu ụzọ, ya bụ Ememme Ngabiga.
- source_word: καὶ ὅτε
  choice: Mgbe
  rationale: ‘Mgbe’ webatara nkebiokwu oge n'ụzọ Igbo ebumpụta ụwa. Njikọ καί bụ ihe na-aga n'ihu n'akụkọ ahụ, ma ọ dịghị mkpa iji ‘na’ malite ahịrịokwu Igbo a.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere usoro ahịrịokwu ahụ ka ọ bụrụ nkebiokwu na-aga n'ihu ruo n'amaokwu na-esote, dịka ọ dị na Grik. A kpọghị Jerusalem aha n'ahịrịokwu bụ isi n'ihi na amaokwu a ekwughị ya ọzọ.
