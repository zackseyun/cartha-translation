id: LUK.2.29
reference: Luke 2:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: ig
  text: “Ugbu a, Onyenwe m, ị na-ahapụ ohu gị, dịka okwu gị si dị, ka ọ laa n’udo.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νῦν
  choice: Ugbu a
  rationale: Ọ na-egosi na ihe ahụ Simiọn nọ na-atụ anya ya mezuru n’oge a.
- source_word: ἀπολύεις
  choice: ị na-ahapụ ... ka ọ laa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo ịtọ mmadụ ka ọ laa ma ọ bụ ịhapụ ya; ọ naghị ekwu ọnwụ kpọmkwem.
- source_word: τὸν δοῦλόν σου
  choice: ohu gị
  rationale: “Ohu” na-egosi onye nọ n’okpuru ikike onye nwe ya, ma kwekọọ nke ọma na otú Simiọn si kpọọ Chineke “Onye nwe m.”
- source_word: δέσποτα
  choice: Onye nwe m
  rationale: Ọ na-echekwa echiche nke onye nwe ohu ma ọ bụ onye nwere ikike, ma bụrụkwa okwu a pụrụ iji kpọọ mmadụ ozugbo n’Igbo.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: dị ka okwu gị si dị
  rationale: Ọ na-egosi na ihe a na-eme kwekọrọ n’okwu ma ọ bụ nkwa Chineke kwuru.
- source_word: ἐν εἰρήνῃ
  choice: n’udo
  rationale: Ọ bụ ntụgharị dị nkenke nke na-echekwa ụda Akwụkwọ Nsọ na echiche nke ịla n’udo.
theological_decisions:
- issue: Ma a ga-akọwa okwu Simiọn dị ka ọnwụ kpọmkwem
  choice: E chekwara ihe atụ nke ịhapụ ya ka ọ laa, n’ekwughị ọnwụ kpọmkwem n’ahịrịokwu ahụ.
  alternative: Ugbu a, ị na-ahapụ ohu gị ka ọ nwụọ n’udo.
  rationale: Ọnọdụ okwu ahụ na-atụ aka n’ọnwụ Simiọn, ma ἀπολύω n’onwe ya pụtara ịhapụ, ịtọhapụ, ma ọ bụ izipụ ka mmadụ laa; ya mere, ịghara itinye “ọnwụ” n’ahịrịokwu ahụ na-echekwa nghọta sara mbara na ihe atụ dị n’asụsụ Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. Nhazi ahịrịokwu ahụ bụ nke ebumpụta ụwa n’Igbo, ebe “Onye nwe m” na “ohu gị” na-echekwa njikọ nke onye nwe na ohu dị n’asụsụ Grik.
