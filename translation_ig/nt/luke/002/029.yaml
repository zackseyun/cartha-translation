- from: “Ugbu a, Onye nwe m, ị na-ahapụ ohu gị[a] ka ọ laa n’udo[b], dị ka okwu gị si dị.”
  to: “Ugbu a, Onyenwe m, ị na-ahapụ ohu gị, dịka okwu gị si dị, ka ọ laa n’udo.”
  rationale: Only safe stylistic and orthographic adjustments are needed. “Onyenwe m” is a natural Standard Igbo vocative for “Master,” while “ohu gị” keeps the Greek possessive explicit. Reordering the clause makes “according to your word” modify the act of dismissal/release, as in the Greek, while retaining the non-explicit reference to death.
