source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: ig
  text: 'na ịchụ aja dịka e kwuru n’Iwu Onyenweanyị: nduru abụọ ma ọ bụ ụmụ kpalakwukwu abụọ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dịka e kwuworo n’Iwu Onyenweanyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: ịchụ aja
  rationale: N’ọnọdụ a, infinitive ahụ na-egosi nzube. Ọ bụ ezie na δίδωμι pụtara ‘inye,’ okwu Igbo a na-ejikarị maka iweta ma ọ bụ inye Chineke aja bụ ‘ịchụ aja,’ nke na-egosipụta echiche sacrificial ahụ nke ọma.
- source_word: κατὰ τὸ εἰρημένον
  choice: dịka e kwuru
  rationale: Perfect passive participle ahụ na-ezo aka n’ihe e kwuworo nke ka dị ka okwu e dere n’Iwu. ‘Dịka e kwuru’ na-edobe echiche nke ikwu okwu ma ghara ịgbakwunye nkọwa dịka ‘dịka e nyere n’iwu.’
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: n’Iwu Onyenwe anyị
  rationale: νόμος ebe a bụ Iwu Chineke dịka Akwụkwọ Nsọ si kwuo ya; ‘Onyenwe anyị’ bụ nsụgharị Igbo a na-aghọta nke ọma maka κύριος n’usoro okwu a.
- source_word: ζεῦγος τρυγόνων
  choice: nduru abụọ
  rationale: ζεῦγος pụtara ihe abụọ jikọrọ ọnụ. Igbo na-ekwukarị nke a n’ụzọ eke dịka ‘abụọ.’ ‘Nduru’ bụ aha a na-ejikarị maka ụdị dove a, ebe asụsụ Igbo nkịtị anaghị enwekarị aha pụrụ iche doro anya maka turtledove.
- source_word: δύο νοσσοὺς περιστερῶν
  choice: ụmụ kpalakwukwu abụọ
  rationale: νοσσός na-egosi ụmụ nnụnụ, περιστερά na-egosikwa pigeon/dove. ‘Ụmụ kpalakwukwu abụọ’ na-edobe ma ụdị nnụnụ ahụ ma ịdị obere ha.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu gbasara Iwu Chineke
  choice: Onyenwe anyị
  alternative: Onyenwe; Dinwenụ
  rationale: Ebe a κύριος na-ezo aka na Chineke, onye Iwu ahụ bụ nke ya. ‘Onyenwe anyị’ bụ okwu Igbo dị ugwu ma bụrụkwa nke ndị nkịtị ghọtara, na-enweghị ịmanye nkọwa pụrụ iche banyere aha Chineke.
- issue: Oge nke κατὰ τὸ εἰρημένον
  choice: dịka e kwuru
  alternative: dịka e kwuworo
  rationale: Perfect participle nwere ike ime ka a sụgharịa ya ‘dịka e kwuworo,’ ma n’usoro okwu gbasara ihe Akwụkwọ Nsọ kwuru nke ka dị ire, ‘dịka e kwuru’ bụ Igbo eke ma na-echekwa esemokwu oge ahụ n’enweghị nkọwa ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘ịchụ aja’ mee ihe dịka okwu Igbo nkịtị maka sacrificial offering. E tinyere akara [a] n’isiokwu ahụ dịka achọrọ.
