  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: ig
  text: Mgbe ha hụrụ ya, ha wee juo anya, nne ya wee sị ya, “Nwa, gịnị mere i ji mee anyị otu a? Lee, nna gị na m anọwo na-achọ gị n’oke mwute.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’oké nchegbu” ma ọ bụ “n’ime nnukwu nhụjuanya”; participle Grik ahụ na-egosi mwute na nhụjuanya mmetụta uche ha nwere mgbe ha na-achọ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Mgbe ha hụrụ ya
  rationale: A tụgharịrị participle aorist ahụ dị ka nkebiokwu oge iji gosi usoro ihe ndị mere n’Igbo nkịtị.
- source_word: ἐξεπλάγησαν
  choice: o juru ha anya
  rationale: Nkebiokwu Igbo a na-egosi nnukwu ihe ijuanya n’asụsụ doro anya ma dịkwa eke.
- source_word: Τέκνον
  choice: Nwa m
  rationale: Nke a bụ ụzọ nne si akpọ nwa ya n’Igbo n’ụzọ ịhụnanya; ‘m’ na-eme ka okwu kpọmkwem ahụ dị eke n’Igbo, ọ bụghị ịgbakwunye ozizi ọhụrụ.
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: gịnị mere i ji mee anyị ihe dị otu a?
  rationale: Ụdị ajụjụ a na-enye echiche ‘n’ihi gịnị’ n’Igbo nkịtị ma na-echekwa mkpesa banyere ihe o mere ha.
- source_word: ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ na-adọrọ uche onye a na-agwa okwu n’ụzọ siri ike ma na-adịghị ochie.
- source_word: ὁ πατήρ σου
  choice: nna gị
  rationale: A hapụrụ okwu Grik ahụ dịka ọ dị, n’etinyeghị nkọwa dịka ‘nna gị n’ụwa.’
- source_word: ὀδυνώμενοι
  choice: n’obi mgbu
  rationale: Nke a na-egosi mgbu na nhụjuanya mmetụta uche ha nwere mgbe ha na-achọ ya, karịa nanị nchegbu nkịtị.
- source_word: ἐζητοῦμέν σε
  choice: anọwo na-achọ gị
  rationale: Ụdị a na-egosi ọchịchọ gara n’ihu ruo mgbe ha chọtara ya, kwekọrọ na imperfect Grik ahụ.
theological_decisions:
- issue: Ịkpọ Josef ‘nna gị’ n’ihe metụtara ịbụ Ọkpara Chineke
  choice: nna gị
  alternative: nna gị n’ụwa
  rationale: Okwu Grik ahụ kwuru nanị ‘nna gị.’ Ịgbakwunye ‘n’ụwa’ ga-akọwa ihe ederede ahụ kama ịsụgharị ya. Nsụgharị a na-echekwa esemokwu dị n’akụkọ ahụ, nke amaokwu na-esote ga-eme ka o doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Nwa m’ bụ okwu nne na nwa ya na-adị eke; ‘anọwo na-achọ gị n’obi mgbu’ na-echekwa ma ogologo oge ọchịchọ ahụ gara n’ihu ma nhụjuanya mmetụta uche dị na ὀδυνώμενοι.
