revisions:
- from: Mgbe ha hụrụ ya, o juru ha anya. Nne ya wee sị ya, “Nwa m, gịnị mere i ji mee anyị ihe dị otu a? Lee, nna gị na m anọwo na-achọ gị n’obi mgbu.[a]”
  to: Mgbe ha hụrụ ya, ha wee juo anya, nne ya wee sị ya, “Nwa, gịnị mere i ji mee anyị otu a? Lee, nna gị na m anọwo na-achọ gị n’oke mwute.[a]”
  rationale: The revision removes the added possessive from the vocative, uses a direct plural expression for their astonishment, and replaces the less idiomatic “n’obi mgbu” with “n’oke mwute,” which better communicates the Greek participle’s emotional distress. The footnote is adjusted to offer semantically suitable alternatives while retaining its anchor and purpose.
