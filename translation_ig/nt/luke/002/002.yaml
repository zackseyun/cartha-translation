  text: (⸀αὕτη ἀπογραφὴ πρώτη ἐγένετο ἡγεμονεύοντος τῆς Συρίας Κυρηνίου·)
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/002.yaml
  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: ig
  text: Ndebanye aha a bụ nke mbụ e mere mgbe Kwiriniọs na-achị Siria[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndebanye aha a mere tupu Kwiriniọs achị Siria.” Ụfọdụ na-aghọta πρώτη n’ebe a dị ka ntụnyere oge.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ọgụgụ ndị mmadụ” n’ọnọdụ “ndebanye aha.” Okwu Grik ahụ pụtara idebanye ndị mmadụ n’akwụkwọ gọọmenti, nke a na-ejikọtakarị ya na ụtụ isi.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: a
  rationale: Okwu ngosi a na-arụtụ aka ná ndebanye aha a kpọtụrụ aha n’amaokwu nke bu ụzọ.
- source_word: ἀπογραφὴ
  choice: ndebanye aha
  rationale: Ọ na-egosi idebanye ndị mmadụ n’akwụkwọ n’ụzọ ọchịchị, nke nwere ike ịdị maka ịgụ ọnụ ọgụgụ mmadụ ma ọ bụ ụtụ isi; ‘ndebanye aha’ anaghị akpọchi ihe ọ pụtara n’otu nzube naanị.
- source_word: πρώτη
  choice: na nke mbụ
  rationale: Nke a na-edebe nghọta nkịtị nke okwu ahụ dị ka ordinal, ‘mbụ,’ ma hapụ nghọta a na-arụrịta ụka banyere ya n’okpuru peeji.
- source_word: ἐγένετο
  choice: mere
  rationale: N’Igbo nkịtị, ‘mere’ na-egosi na ihe ahụ weere ọnọdụ.
- source_word: ἡγεμονεύοντος
  choice: mgbe ... na-achị
  rationale: Ọ na-edebe ọnọdụ oge nke genitive absolute ma ghara ịmanye aha ọkwa ọchịchị a kapịrị ọnụ nke ngwaa Grik ahụ ekwughị kpọmkwem.
- source_word: τῆς Συρίας
  choice: Siria
  rationale: Aha mpaghara ahụ n’ụdị a na-aghọta nke ọma n’Igbo.
- source_word: Κυρηνίου
  choice: Kwiriniọs
  rationale: Ntugharị ụda aha Grik Κυρήνιος kwekọrọ n’usoro mkpụrụedemede Igbo.
theological_decisions:
- issue: Nkọwa πρώτη n’ahịrịokwu a na-arụrịta ụka banyere akụkọ ihe mere eme ya
  choice: E tinyere ‘na nke mbụ’ n’ahịrịokwu bụ isi.
  alternative: ‘Ndebanye aha a mere tupu Kwiriniọs amalite ịchị Siria.’
  rationale: Ihe mbụ na nke kacha mfe okwu Grik ahụ pụtara bụ ‘mbụ.’ E debere nghọta ‘tupu’ n’okpuru peeji ka a ghara idozi n’enweghị mkpa ihe edemede Grik na akụkọ ihe mere eme hapụrụ ka a na-arụrịta ụka banyere ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Mgbe ... na-achị’ bụ ụzọ nkịtị e si kwuo ọnọdụ oge ahụ; a zere ịkpọ Kwiriniọs ‘gọvanọ’ n’ihi na ngwaa Grik ahụ n’onwe ya anaghị amanye aha ọkwa ahụ.
