id: LUK.2.7
reference: Luke 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: ig
  text: Ọzọkwa, ọ mụrụ nwa mbụ ya nwoke, kechie ya n’ákwà[a], dina ya n’ebe a na-etinye nri anụ ụlọ[b], n’ihi na ọ dịghị ohere maka ha n’ọnụ ụlọ ndị ọbịa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “o kechiri ya n’ákwà e ji ekekọta ụmụ ọhụrụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ebe nri anụ ụlọ” ma ọ bụ “ebe a na-enye anụ ụlọ nri.” Okwu Grik ahụ na-ekwu maka ebe ma ọ bụ ihe a na-etinye nri anụ ụlọ.
    reason: lexical_alternative
  - marker: c
    text: N’ọdịnala, “ụlọ ndị njem.” Okwu Grik κατάλυμα nwere ike ịpụta ọnụ ụlọ ndị ọbịa ma ọ bụ ebe obibi; Luk ji okwu ọzọ mee ihe maka ụlọ ndị njem na Luk 10:34.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: Ọ mụrụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ekwu na nwanyị mụrụ nwa; ọ na-egosipụta ọmụmụ nwa n’enweghị asụsụ ochie ma ọ bụ nkọwa agbakwunyere.
- source_word: πρωτότοκον
  choice: ọkpara ya
  rationale: “Ọkpara” na-egosi nwa nwoke mbụ a mụrụ, ya bụ usoro ọmụmụ a na-ekwu maka ya n’akụkọ a, n’etinyeghị nkọwa mmụta okpukpe ọzọ.
- source_word: ἐσπαργάνωσεν
  choice: O were ákwà kechie ya
  rationale: Okwu a na-egosi iji ákwà kechie nwa ọhụrụ. Nkebiokwu a bụ Igbo doro anya ma dị ugbu a.
- source_word: ἀνέκλινεν
  choice: tọgbọ ya
  rationale: N’ebe a, ngwaa ahụ pụtara idobe nwa ahụ ka o dina; “tọgbọ ya” bụ okwu Igbo e ji ekwu nke a n’ụzọ ebumpụta ụwa.
- source_word: φάτνῃ
  choice: ihe e ji enye anụ ụlọ nri
  rationale: Nkọwa a na-eme ka o doo onye na-agụ ya anya na ọ bụ ebe ma ọ bụ ihe a na-etinye nri anụmanụ, kama iji okwu ọdịnala nke ọtụtụ ndị nwere ike ghara ịghọta nke ọma.
- source_word: τόπος
  choice: ohere
  rationale: N’ọnọdụ a, τόπος na-ekwu maka ohere dịnụ ha ga-anọ, ya mere “ohere” na-enye echiche ahụ n’Igbo nkịtị.
- source_word: καταλύματι
  choice: ọnụ ụlọ ndị ọbịa
  rationale: κατάλυμα nwere ike ịpụta ọnụ ụlọ e doziri maka ndị ọbịa ma ọ bụ ebe obibi. Luk ji okwu ọzọ, πανδοχεῖον, mee ihe maka ụlọ ndị njem na Luk 10:34, ebe o ji κατάλυμα mee ihe maka ọnụ ụlọ ndị ọbịa na Luk 22:11.
theological_decisions:
- issue: Ma a ga-asụgharị καταλύματι dị ka ụlọ ndị njem ọdịnala ka ọ bụ ọnụ ụlọ e doziri maka ndị ọbịa n’ụlọ
  choice: ọnụ ụlọ ndị ọbịa
  alternative: ụlọ ndị njem; ebe obibi
  rationale: Okwu Grik ahụ anaghị amanye echiche nke ụlọ ahịa ebe ndị njem na-akwụ ụgwọ. Ojiji Luk ji okwu ahụ mee ihe na-akwado “ọnụ ụlọ ndị ọbịa,” ma ndetu na-echekwa nhọrọ ọdịnala n’ihi mkpa ọ bara n’otú e si aghọta akụkọ ọmụmụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. A họọrọ nkebiokwu nkọwa doro anya maka φάτνη, ma debe okwu ndị ọzọ a pụrụ iji na ndetu ala peeji. Akara ndetu [a], [b], na [c] niile dị n’ebe okwu ha na-akọwa pụtara n’amaokwu ahụ.
