revisions:
- from: Ọ mụrụ nwa ya nwoke, bú ọkpara ya. O were ákwà kechie ya[a], tọgbọ ya n’ihe e ji enye anụ ụlọ nri[b], n’ihi na ohere adịghịịrị ha n’ọnụ ụlọ ndị ọbịa[c].
  to: Ọzọkwa, ọ mụrụ nwa mbụ ya nwoke, kechie ya n’ákwà[a], dina ya n’ebe a na-etinye nri anụ ụlọ[b], n’ihi na ọ dịghị ohere maka ha n’ọnụ ụlọ ndị ọbịa[c].
  rationale: 'E megharịrị amaokwu ahụ naanị n’ebe ndị dị mkpa: e tinyeghachiri καὶ mbụ, e jiri “nwa mbụ ya nwoke” zere nkọwa omenala ọzọ nwere ike iso “ọkpara,” ma kọwaa φάτνη dịka ebe a na-etinye nri anụ ụlọ kama ngwa e ji enye nri. A debere “ọnụ ụlọ ndị ọbịa” maka κατάλυμα, tinyere ndetu na-egosi nhọrọ ọdịnala n’enweghị ịmanye ya.'
