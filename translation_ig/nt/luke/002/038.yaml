id: LUK.2.38
reference: Luke 2:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: ig
  text: N’oge ahụ kpọmkwem[a], ọ bịarutere, wee na-ekele Chineke[b] ma na-agwa ndị niile na-atụ anya mgbapụta Jerusalem okwu banyere ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’otu oge ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-eto Chineke”; ngwaa Greek ahụ nwere ike ịpụta ito Chineke ma ọ bụ ikele ya.
    reason: lexical_alternative
  - marker: c
    text: N’usoro akụkọ a, “ya” yikarịrị ka ọ na-ezo aka na nwa ahụ bụ Jizọs, ọ bụ ezie na Chineke bụ onye a kpọrọ aha kacha nso tupu nnọchiaha ahụ na Greek.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: N’oge ahụ kpọmkwem
  rationale: Nkebiokwu a na-egosi kpọmkwem oge ihe ahụ mere; “kpọmkwem” na-eme ka nkwusi ike dị na αὐτῇ pụta n’Igbo dị mfe ma doo anya.
- source_word: ἐπιστᾶσα
  choice: ọ bịarutere
  rationale: N’ebe a, participle a na-akọ na Ana bịarutere n’ebe ihe ahụ na-eme, n’ebughị ụzọ kọwaa otu o si bịaruo ma ọ bụ kpọmkwem ebe o guzoro.
- source_word: ἀνθωμολογεῖτο
  choice: na-ekele Chineke
  rationale: Imperfect a nwere ike igosi otuto ma ọ bụ ekele a na-enye Chineke. “Na-ekele Chineke” bụ okwu Igbo e ji eme ihe ugbu a, ma ọ naghị amanye echiche na ihe ahụ malitere kpọmkwem n’oge ahụ.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: Dative Greek na-esonyere ngwaa ekele ahụ; n’Igbo, “ikele Chineke” bụ usoro okwu ebumpụta ụwa, ya mere ọ dịghị mkpa itinye preposition ọzọ.
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: na-agwakwa … okwu banyere ya
  rationale: Usoro a na-egosi omume na-aga n’ihu ma debe nnọchiaha “ya,” nke na-adịghị ekpebi onye ọ na-ezo aka na ya karịa Greek.
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: ndị niile nọ na-atụ anya
  rationale: “Ịtụ anya” na-egosipụta nchere nwere olileanya nke προσδέχομαι n’akụkọ Luk.
- source_word: λύτρωσιν
  choice: mgbapụta
  rationale: “Mgbapụta” na-eburu echiche nke ịtọhapụ na nzọpụta dị na λύτρωσις, n’emeghị ka ọ bụrụ naanị ntọhapụ ndọrọ ndọrọ ọchịchị ma ọ bụ naanị ihe ime mmụọ.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Onye αὐτοῦ (“ya”) na-ezo aka na ya
  choice: E debere nnọchiaha ahụ dịka “ya”; n’usoro akụkọ ahụ, o yikarịrị ka ọ na-ezo aka n’ebe nwa ahụ bụ Jizọs nọ.
  alternative: E nwere ike ịghọta ya dịka ihe na-ezo aka n’ebe Chineke nọ, ebe ọ bụ aha kacha nso tupu nnọchiaha ahụ na Greek.
  rationale: Idobe “ya” na-echekwa enweghị mkpebi doro anya nke Greek ma ghara itinye aha nkọwa n’ime amaokwu ahụ.
- issue: Ihe “mgbapụta Jerusalem” pụtara
  choice: E debere ya dịka “mgbapụta Jerusalem” n’enweghị mgbasa nkọwa ọzọ.
  alternative: A pụrụ ịsụgharị ya “ntọhapụ Jerusalem” ma ọ bụ kọwaa ya dịka nzọpụta Chineke ga-ewetara ndị ya.
  rationale: Nkebiokwu ahụ nwere ike ịgụnye nzọpụta Chineke, ntọhapụ, na olileanya ọdịnihu nke ndị ya; nsụgharị ahụ ekwesịghị imechi ya n’otu nkọwa okpukpe ma ọ bụ ndọrọ ndọrọ ọchịchị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-aga nke ọma n’Igbo, ebe a na-edobe omume abụọ ahụ—ikele Chineke na ịgwa ndị mmadụ okwu—dịka omume na-aga n’ihu. Nnọchiaha “ya” na-edobe mgbagwoju anya dị na Greek.
