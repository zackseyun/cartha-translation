  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: ig
  text: Ndị niile na-ege ya ntị juru n’anya n’ihi nghọta ya na azịza ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O tụrụ ha n’anya.” Ngwaa Grik ahụ pụrụ igosi oke ijuanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: jukwara n’anya
  rationale: 'Ụdị ngwaa a na-egosi na ihe ahụ nọ na-aga n’ihu: ndị na-ege ya ntị juru nnọọ anya. “Juru n’anya” bụ okwu Igbo doro anya ma bụrụkwa nke e ji ekwu oke iju anya n''ụzọ nkịtị.'
- source_word: δὲ
  choice: -kwara
  rationale: δέ bụ njikọ dị nro n’akụkọ a. Mgbakwunye “-kwara” jikọtara amaokwu a na ihe gara aga n'ụzọ Igbo si ada nke ọma, n’enweghị nghọtahie nke mmegide.
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: Ndị niile nụrụ ihe ọ na-ekwu
  rationale: Nke a na-echekwa oke πάντες (“ndị niile”) ma na-enye participle ἀκούοντες n’Igbo dị mfe. “Ihe ọ na-ekwu” na-eme ka o doo anya na ha nụrụ okwu Jizọs, ọ bụghị nanị ụda olu ya.
- source_word: ἐπὶ
  choice: maka
  rationale: ἐπί tinyere dative na-egosi ihe kpatara iju anya ha. “Maka” na-egosipụta ntọala ma ọ bụ ihe kpatara mmeghachi omume ahụ n’Igbo nkịtị.
- source_word: συνέσει
  choice: nghọta
  rationale: “Nghọta” na-enye echiche nke ịghọta ihe nke ọma na inwe amamihe n’okwu, n’etinyeghị echiche pụrụ iche nke ọgụgụ isi a mụrụ mmadụ na ya.
- source_word: ἀποκρίσεσιν
  choice: azịza
  rationale: “Azịza” dabara na ọnọdụ mkparịta ụka ahụ, ebe Jizọs na-ajụ ma na-aza ajụjụ.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs; “ya” bụ ụdị nnwe kwesịrị ekwesị n’Igbo na nkebi abụọ ahụ.
