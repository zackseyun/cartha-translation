  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: ig
  text: 'Nke a ga-abụrụ unu ihe ịrịba ama: unu ga-ahụ nwa ọhụrụ e ji akwa kechie, nke dina n’ime ihe e ji enye anụmanụ nri.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e ji akwa e ji ekekọta ụmụ ọhụrụ kechie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ime ebe a na-etinye nri anụmanụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nkebi okwu a bụ ụzọ Igbo a na-aghọta nke ọma isi kwuo ihe e nyere dị ka akara e ji amata onye ahụ; ọ naghị akọwa ya gabiga ókè dị ka ihe àmà ebube.
- source_word: εὑρήσετε
  choice: unu ga-ahụ
  rationale: Nʼọnọdụ a, εὑρίσκω pụtara na ndị ọzụzụ atụrụ ga-achọta ma hụ nwa ahụ; “ga-ahụ” bụ okwu Igbo dị mfe ma kwekọọ nʼamụma ahụ.
- source_word: βρέφος
  choice: nwa ọhụrụ
  rationale: βρέφος na-ezo aka nʼebe nwa dị nnọọ nta nọ; “nwa ọhụrụ” doro ndị na-agụ Igbo anya ma dabara nʼakụkọ ọmụmụ a.
- source_word: ἐσπαργανωμένον
  choice: e ji akwa kechie
  rationale: Nke a na-egosi omume iji akwa kechie nwa nta, nʼenweghị iji okwu ọdịnala na-esiri onye nkịtị nghọta.
- source_word: κείμενον
  choice: ka o dina
  rationale: Nke a na-egosipụta ọnọdụ nwa ahụ nọ na ya, ọ bụghị nanị omume mmadụ tọgbọrọ ya nʼebe ahụ.
- source_word: φάτνῃ
  choice: nʼebe a na-etinye nri anụmanụ
  rationale: φάτνη bụ ebe ma ọ bụ igbe a na-etinye nri anụmanụ. Nsụgharị a na-eme ka ihe ahụ doo onye Igbo nke oge a anya, ebe ihe odide ala na-echekwa okwu ọzọ dị mkpirikpi.
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: Nke a ga-abụrụ unu ihe ịrịba ama
  rationale: Asụsụ Grik hapụrụ ngwaa njikọ nʼụzọ a na-ahụkarị. Iji “ga-abụrụ” na Igbo na-egosi nke ọma na ihe na-esote bụ akara e nyere ndị ọzụzụ atụrụ.
theological_decisions:
- issue: Ụdị ihe ịrịba ama e nyere ndị ọzụzụ atụrụ
  choice: A sụgharịrị ya dị ka ihe e ji amata nwa ahụ, nʼakọwaghị ya kpọmkwem dị ka ihe ebube.
  alternative: A pụkwara ịghọta ihe ịrịba ama ahụ dị ka nkwenye Chineke nke nwere nghọta okpukpe sara mbara.
  rationale: Amaokwu ahụ lekwasịrị anya nʼotú ha ga-esi mata nwa ahụ site nʼọnọdụ pụrụ iche ha ga-ahụ ya. Nsụgharị ahụ na-ahapụ nghọta ime mmụọ sara mbara ka ọ dị nʼime okwu ahụ, kama ịkọwa ya nʼime ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ugwu. “Ihe ịrịba ama” na-echekwa okwu Baịbụl a maara nke ọma; nkọwa φάτνη nʼederede bụ nke doro anya nye onye nkịtị, ebe ihe odide ala na-enye nkọwa nkịtị karị. E tinyere akara [a] na [b] nʼebe ha metụtara na isi ederede.
