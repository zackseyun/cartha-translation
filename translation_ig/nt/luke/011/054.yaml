translation:
  language: ig
  text: na-echere ya n’ebe zoro ezo[a], ka ha nwụde ihe n’ọnụ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-echere ya na nzuzo” ma ọ bụ “na-echere ya ka ha mata ya n’ọnyà.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ka ha nwụde ihe n’ọnụ ya,” ya bụ, ka ha jide okwu ụfọdụ o kwuru ma jiri ya mata ya n’ọnyà.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: na-echere ya n’ụzọ aghụghọ
  rationale: Nkebi a na-egosi na ha nọ na-eche ya n’ebumnobi ọjọọ iji mata ya n’ọnyà. Nsụgharị a bụ Igbo a na-aghọta nke ọma ma na-echekwa echiche nke izo echere onye.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs; ‘ya’ na-echekwa otú Grik si jiri nnọchiaha mee ya n’enweghị ịgbakwunye aha ahụ.
- source_word: θηρεῦσαί
  choice: ka ha wee nwụde
  rationale: Okwu a sitere n’echiche ịchụ nta ma ọ bụ ịnwụde anụ. ‘Nwụde’ na-echekwa ihe atụ ahụ ma kwekọọ n’ebumnobi ha nke ịchọta okwu ha ga-eji megide ya.
- source_word: τι
  choice: ihe
  rationale: ‘Ihe’ na-enye nghọta nke ihe ọ bụla n’ime okwu ya nke ha pụrụ ijide, n’enweghị ịkọwapụta ya karịa ka Grik mere.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: ihe ga-esi ya n’ọnụ pụta
  rationale: Nke a na-echekwa oyiyi ọnụ dị n’asụsụ Grik ma na-ada ka Igbo eke maka okwu mmadụ ga-ekwu.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ abụọ dị na Grik—izo echere onye na ịnwụde ihe si n’ọnụ ya—ma mee ka ha daa n’ụzọ eke n’Igbo.
