id: LUK.11.35
reference: Luke 11:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: ig
  text: Ya mere, lezie anya ka ìhè dị n'ime gị ghara ịbụ ọchịchịrị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Gbaa mbọ hụ na ìhè dị n''ime gị abụghị ọchịchịrị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκόπει
  choice: lezie anya
  rationale: Okwu iwu dị n'ụdị ugbu a na-akpọ otu onye ka ọ nọgide na-akpachara anya; “lezie anya” bụ Igbo nkịtị nke na-echekwa ike ịdọ aka ná ntị ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe e si n'ozizi bu ụzọ banyere anya na ìhè nweta.
- source_word: μὴ
  choice: ka ... ghara
  rationale: Mgbe ọ na-eso okwu iwu, ọ na-egosi ịdọ aka ná ntị ka ihe a na-achọghị ghara ịdị; usoro a bụ nke sitere n'okike n'Igbo.
- source_word: τὸ φῶς
  choice: ìhè
  rationale: Ọ na-echekwa ihe atụ nke ìhè n'ebughị ụzọ kọwaa ya dị ka nghọta, akọ na uche, ma ọ bụ ọnọdụ ime mmụọ.
- source_word: τὸ ἐν σοὶ
  choice: dị n'ime gị
  rationale: Ọ na-asụgharị echiche nke ihe dị n'ime onye ahụ n'ụzọ doro anya ma ghara imechi obosara ihe atụ ahụ.
- source_word: σκότος
  choice: ọchịchịrị
  rationale: Ọ na-echekwa ntụnyere dị n'etiti ìhè na ọchịchịrị na ike omume na nke ime mmụọ nke ihe atụ ahụ.
- source_word: ἐστίν
  choice: ịbụ
  rationale: N'ime usoro Igbo “ka ... ghara ịbụ,” infinitive a na-arụ ọrụ copula nke Grik n'ụzọ sitere n'okike.
theological_decisions:
- issue: Ihe atụ nke “ìhè” na “ọchịchịrị”
  choice: E debere ihe atụ ahụ n'ederede bụ isi n'akatọwaghị ya ka ọ bụrụ naanị akọ na uche, nghọta, ma ọ bụ ọnọdụ ime mmụọ.
  alternative: “nghọta dị n'ime gị,” “ìhè ime gị,” ma ọ bụ “akọ na uche gị”
  rationale: Okwu Jizọs nwere obosara na esemokwu ihe atụ nke jikọrọ nghọta mmadụ na ọnọdụ ime ya; ịkọwapụta ya karịa nke a ga-etinye nkọwa na-adịghị n'okwu Grik.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Lezie anya” na-enye ịdọ aka ná ntị sitere n'okike; e debere ihe atụ ìhè/ọchịchịrị na mgbagwoju anya ya.
