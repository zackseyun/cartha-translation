source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δέ τις τῶν νομικῶν λέγει αὐτῷ· Διδάσκαλε, ταῦτα λέγων καὶ ἡμᾶς ὑβρίζεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: ig
  text: Mgbe ahụ, otu onye n’ime ndị ọkachamara n’Iwu zara ya sị, “Onye Ozizi, mgbe ị na-ekwu ihe ndị a, ị na-akparịkwa anyị.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: Mgbe ahụ ... zara
  rationale: Nke a na-egosi nzaghachi na-aga n’ihu n’akụkọ ahụ, n’ụzọ Igbo na-ada nke ọma, n’ebughị echiche nke nnukwu mmegide n’ime δέ.
- source_word: τις τῶν νομικῶν
  choice: otu onye n’ime ndị ọkachamara n’Iwu
  rationale: νομικός n’ebe a bụ onye maara Iwu ndị Juu nke ọma, ọ bụghị ọka iwu n’ọrụ ikpe nke oge a. Mkpụrụedemede ukwu n’‘Iwu’ na-egosi Iwu Mozis.
- source_word: λέγει αὐτῷ
  choice: zara ya sị
  rationale: Ọ bụ ezie na λέγει bụ historical present, ịtụgharị ya n’oge gara aga dabara n’akụkọ Igbo; ‘sị’ na-ewebata okwu onye ahụ kpọmkwem.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Nke a na-egosipụta aha a kpọrọ Jizọs dịka onye na-akụzi, na-enweghị ihe mgbagwoju anya nke okwu nwere ike ịpụta ‘nna ukwu.’
- source_word: ταῦτα λέγων
  choice: mgbe ị na-ekwu ihe ndị a
  rationale: 'Nke a na-echekwa njikọ oge nke participle ahụ: okwu Jizọs na-ekwu bụ ihe onye ahụ weere dịka mkparị.'
- source_word: καὶ ἡμᾶς
  choice: anyị ... kwa
  rationale: '‘Kwa’ na-echekwa ike mgbakwunye nke καί: okwu ahụ metụtakwara ndị ọkachamara n’Iwu.'
- source_word: ὑβρίζεις
  choice: ị na-akparị
  rationale: ‘Ịkparị’ na-egosi ikwu okwu na-eweda mmadụ ala ma ọ bụ na-egosi enweghị nsọpụrụ, nke dabara na ὑβρίζω karịa naanị ime ka iwe wee mmadụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị ọkachamara n’Iwu’ zere nghọtahie na ha bụ ndị ọka iwu nke ụlọikpe oge a. E tinyeghị nkọwa ụka ma ọ bụ ozizi otu okpukpe.
