  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ καὶ ⸀αἰτήσει ᾠόν, ⸀ἐπιδώσει αὐτῷ σκορπίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: ig
  text: Ma ọ bụ, ọ bụrụ na ọ rịọ àkwá, ọ̀ ga-enye ya akpị?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Ma ọ bụ, ọ bụrụ na
  rationale: Ọ na-ewebata ihe atụ ọzọ n’usoro ajụjụ ndị a; nsụgharị a bụ Igbo doro anya ma debe njikọ nkewa ahụ n’etinyeghị καί n’ụzọ gabigara ókè.
- source_word: αἰτήσει
  choice: ọ rịọ ya
  rationale: Ọ bụ ngwaa ọdịnihu e ji mee ahịrịokwu yiri nke ọnọdụ n’ajụjụ nkwupụta; n’Igbo, ‘ọ bụrụ na ọ rịọ ya’ na-egosi nke ọma na nwa ahụ na-arịọ nna ya ihe.
- source_word: ᾠόν
  choice: akwa
  rationale: Nke a bụ okwu Igbo nkịtị na nke ziri ezi maka àkwá.
- source_word: ἐπιδώσει
  choice: ọ̀ ga-enye
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara inye mmadụ ihe ọ rịọrọ; ‘ga-enye’ na-ebute ajụjụ nkwupụta ahụ n’Igbo dị mma.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a bụ onye a na-enye ihe; usoro ‘nye ya’ bụ ụzọ nkịtị e si kwuo ya n’Igbo.
- source_word: σκορπίον
  choice: akpị
  rationale: Ọ bụ aha Igbo a na-ejikarị maka scorpion, ma na-edobe ọdịiche doro anya dị n’etiti akwa na anụmanụ na-emerụ emerụ.
theological_decisions:
- issue: Ike ajụjụ nkwupụta dị n’ihe atụ nna na nwa
  choice: E depụtara ya dị ka ajụjụ nkwupụta kwụ ọtọ, n’etinyeghị nkọwa ọzọ.
  alternative: Ịgbakwunye okwu pụtara ‘kama akwa ahụ’ iji mee ka ọdịiche ahụ pụta ìhè karị.
  rationale: Asụsụ Grik hapụrụ echiche ‘kama nke ahụ’ ka onye na-agụ ya ghọta ya. Igbo a na-edobe ụzọ ahụ ma ghara ịkọwakwu isi okwu banyere ịdị mma nke Nna.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘rịọ ya akwa’ mee ka onye a na-arịọ na ihe a na-arịọ doo anya; akara ụda dị na ‘ọ̀’ na-egosi ajụjụ ee/mba.
