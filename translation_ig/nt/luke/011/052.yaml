  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: ig
  text: Ahụhụ ga-adịrị unu, ndị ọkachamara n’Iwu[a], n’ihi na unu wepụrụ mkpịsị ugodi nke ihe ọmụma[b]. Unu onwe unu abanyeghị, unu gbochikwara ndị na-abanye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ndị maara Iwu ndị Juu nke ọma; ọ bụghị ndị ọka iwu obodo nke oge a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mkpịsị ugodi na-eduba n’ihe ọmụma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: Ahụhụ dịrị unu
  rationale: Na-egosipụta nkwupụta ikpe siri ike nke ndị amụma, kama ịbụ naanị mkpu mwute.
- source_word: νομικοῖς
  choice: ndị ọkachamara n’Iwu
  rationale: Na-akọwa ndị maara Iwu ndị Juu nke ọma, ọ bụghị ndị ọka iwu obodo nke oge a; e ji mkpụrụedemede ukwu dee “Iwu” iji gosi Iwu Mozis.
- source_word: ἤρατε
  choice: wepụrụ
  rationale: Na-egosipụta iwepụ ihe ma napụ ndị ọzọ ohere, dịka αἴρω si pụta n’ebe a.
- source_word: κλεῖδα τῆς γνώσεως
  choice: mkpịsị ugodi nke ihe ọmụma
  rationale: Na-edobe ihe atụ nke mkpịsị ugodi na usoro genitive Grik n’enweghị ịkọwa kpọmkwem ihe ọmụma ahụ.
- source_word: αὐτοὶ
  choice: unu onwe unu
  rationale: Na-echekwa nkwusi ike na ọdịiche dị na nnọchiaha Grik.
- source_word: οὐκ εἰσήλθατε
  choice: abanyeghị
  rationale: Na-edobe ihe atụ banyere ịbanye ma ghara ịgbakwunye ebe a na-abanye.
- source_word: τοὺς εἰσερχομένους
  choice: ndị na-abanye
  rationale: Na-egosipụta omume na-aga n’ihu nke participle ahụ n’enweghị ịgbakwunye echiche nke “ịgbalị.”
- source_word: ἐκωλύσατε
  choice: gbochikwara
  rationale: Na-egosi na ha tinyere ihe mgbochi, ma ọ dịghị ekwu karịa isi mmalite ahụ na ha kwụsịrị ya kpamkpam.
theological_decisions:
- issue: Ihe “ịbanye” na “mkpịsị ugodi nke ihe ọmụma” na-anọchi anya ya
  choice: E debere ihe atụ nke ohere na ịbanye, n’agwaghị na isi okwu bụ alaeze Chineke ma ọ bụ ezi ihe ọmụma banyere Chineke.
  alternative: Ịkọwa ya dị ka ịbanye n’alaeze Chineke, ma ọ bụ ịbanye n’ezi ihe ọmụma banyere Chineke.
  rationale: Grik ahụ akpọghị kpọmkwem ebe a na-abanye. Ịhapụ ihe atụ ahụ otú ahụ na-echekwa nghọta sara mbara na esemokwu nkà mmụta okpukpe nke amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. A họọrọ “ndị ọkachamara n’Iwu” iji zere nghọtahie sitere n’okwu ndị ọka iwu nke oge a. A hapụrụ ihe atụ banyere mkpịsị ugodi na ịbanye n’enweghị nkọwa ụka pụrụ iche.
