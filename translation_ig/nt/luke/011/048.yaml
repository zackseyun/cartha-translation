id: LUK.11.48
reference: Luke 11:48
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: ig
  text: Ya mere, unu bụ ndị akaebe, unu na-akwadokwa omume ndị nna nna unu; n’ihi na ha gburu ha, ma unu na-ewuru ha ili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, unu na-ewuru ndị amụma ahụ ili, dịka e kwuru n’amaokwu bu nke a ụzọ.
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Jizọs wepụtara site n’ihe o kwuru n’amaokwu bu nke a ụzọ, ma bụrụkwa okwu Igbo dị mfe ma kwụ ọtọ.
- source_word: μάρτυρές ἐστε
  choice: unu bụ ndị akaebe
  rationale: Nke a na-echekwa usoro aha nke Grik ma na-egosi na omume ha mere ka ha bụrụ ndị na-agba akaebe megide onwe ha.
- source_word: συνευδοκεῖτε
  choice: unu na-akwadokwa
  rationale: ‘Na-akwado’ na-egosi nkwenye na omume ndị ahụ, ọ bụghị nanị ịmata na e mere ha; ‘-kwa’ na-eburu echiche ‘and/also’ dị na καί.
- source_word: τοῖς ἔργοις
  choice: omume
  rationale: N’ọnọdụ a, ‘omume’ na-ezo aka n’ihe ọjọọ ndị nna nna ha mere, ma na-ada eke karịa ‘ọrụ’ n’Igbo.
- source_word: τῶν πατέρων ὑμῶν
  choice: ndị nna nna unu
  rationale: N’ebe a πατέρες na-ezo aka n’ọgbọ ndị gara aga, ya mere ‘ndị nna nna unu’ na-enye echiche ndị nna ochie ma na-echekwa njikọ ezinụlọ dị n’okwu ahụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere e ji bo ha ebubo ahụ, dịka njikọ echiche dị na Grik.
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς
  choice: ha gburu ha
  rationale: A hapụrụ nnọchiaha abụọ ahụ dịka ha dị na Grik; ndị e kwuru okwu ha n’amaokwu gara aga na-eme ka onye nke ọ bụla na-anọchi anya doo anya.
- source_word: ὑμεῖς δὲ
  choice: ma unu
  rationale: Ọ na-echekwa ọdịiche siri ike dị n’etiti ihe ndị nna nna ha mere na ihe ndị na-ege Jizọs ntị na-eme.
- source_word: οἰκοδομεῖτε
  choice: unu na-ewuru ha ili
  rationale: Ngwaa Grik pụtara ‘unu na-ewu,’ ma ihe a na-ewu—ili ndị amụma—sitere n’amaokwu 47. Itinye ya n’Igbo na-eme ka ahịrịokwu zuo oke ma doo anya n’enweghị ịgbanwe echiche ya.
theological_decisions:
- issue: Ma a ga-etinye ihe οἰκοδομεῖτε na-ezo aka na ya, nke a na-ekwughị ọzọ n’amaokwu a
  choice: E tinyere ya dịka ‘unu na-ewuru ha ili,’ ebe nnọchiaha ‘ha’ ka na-ezo aka n’otu ndị ahụ e gburu.
  alternative: ‘ma unu na-ewu,’ nke ga-agbasochi mkpụmkpụ okwu Grik anya ma hapụ ihe a na-ewu ka onye na-agụ ya nweta ya site n’amaokwu 47.
  rationale: Ọ bụ ezie na Grik hapụrụ ihe ngwaa ahụ na-achị n’ime amaokwu a, amaokwu 47 kwuru ‘ili ndị amụma’ n’ụzọ doro anya. N’Igbo, ‘ma unu na-ewu’ naanị ya ga-ada ka ahịrịokwu a na-emechabeghị; itinye ‘ha ili’ na-eme ka njikọ ahụ bụrụ nke eke ma ghara itinye ozizi ọhụrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị nna nna unu’ maka ndị nna ochie, ‘omume’ maka omume e ji mmadụ ikpe, na ‘na-akwado’ iji gosi nkwenye omume. E debere ọdịiche dị n’etiti ‘ha’ na ‘unu’ nke ọma.
