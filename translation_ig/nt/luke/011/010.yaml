  rationale: Only the final Igbo verbal form has been corrected. The revised ‘a ga-emegheerekwa onye na-akụ aka’ naturally expresses a future passive action directed to the knocker, while continuing to leave the opened object unspecified. The footnote preserves the contextual ‘door’ alternative without placing it in the main translation.
