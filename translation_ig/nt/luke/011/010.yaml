id: LUK.11.10
reference: Luke 11:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ig
  text: N’ihi na onye ọ bụla na-arịọ na-anata; onye na-achọkwa na-achọta; a ga-emegheerekwa onye na-akụ aka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ doro anya karị site n’ihe gbara amaokwu a gburugburu, “a ga-emeghe ọnụ ụzọ nye onye na-akụ aka.” Asụsụ Grik ekwughị kpọmkwem ihe a ga-emeghe.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: onye ọ bụla
  rationale: Ọ na-egosi onye nile n’otu n’otu, ma bụrụkwa ụzọ Igbo nkịtị na nke doro anya isi chekwaa oke zuru ụwa ọnụ nke okwu ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-echekwa ọrụ njikọ nke okwu a, nke na-akọwa ihe mere agbamume dị n’amaokwu bu ụzọ ji bụrụ eziokwu.
- source_word: ὁ αἰτῶν
  choice: onye na-arịọ
  rationale: Ọ na-egosi onye a maara site n’omume ịrịọ, ma na-anọgide na-adị mfe ma bụrụ Igbo nke oge a.
- source_word: λαμβάνει
  choice: na-anata
  rationale: Ọ dabara n’ọnọdụ nke ịrịọ na ịnata ma nwee ugwu karịa okwu mkparịta ụka dịka ‘na-enweta.’
- source_word: ὁ ζητῶν
  choice: onye na-achọ
  rationale: Ọ na-echekwa omume a na-ekwu n’ozuzu ya, nke onye ahụ na-eme, n’enweghị ịgbakwụnye ihe ọ na-achọ.
- source_word: εὑρίσκει
  choice: na-achọta
  rationale: Nke a bụ ihe kwekọrọ kpọmkwem ma bụrụkwa okwu Igbo dị mfe maka akụkụ nke abụọ nke usoro okwu atọ ahụ.
- source_word: τῷ κρούοντι
  choice: onye na-akụ aka
  rationale: Ọ bụ ụzọ Igbo e si ekwu ịkụ aka n’ọnụ ụzọ; njikọ ya na ‘a ga-emeghere’ na-echekwa ọrụ dative nke Grik n’ụzọ ebumpụta ụwa.
- source_word: ἀνοιγήσεται
  choice: a ga-emeghere
  rationale: Ụdị a na-echekwa ọdịdị ọdịnihu nke ngwaa nnara ahụ, ma ọ dịghị akpọpụta ihe a ga-emeghe, dịka Grik si hapụ ya n’ekwughị ya.
theological_decisions:
- issue: Oke na ike nke nkwa ahụ metụtara onye ọ bụla
  choice: E depụtara ya dịka ụkpụrụ zuru ụwa ọnụ n’etinyeghị ọnọdụ ndị ọzọ.
  alternative: Ịkọwa ya dịka naanị okwu agbamume e ji ikwubiga okwu ókè, ma ọ bụ ịgbakwụnye ‘onye ọ bụla na-arịọ n’ụzọ ziri ezi.’
  rationale: Grik na-ekwu okwu ahụ n’enweghị mmachi n’ọnọdụ agbamume banyere ekpere. Nsụgharị ahụ kwesịrị ichekwa ike na esemokwu nkà mmụta okpukpe dị na ya, kama itinye ọnọdụ amaokwu ahụ n’onwe ya na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. Usoro akụkụ atọ ahụ ka doro anya site n’iji semicolon kewaa ha; ‘-kwa’ na-egosikwa njikọ na ịdị nhata nke akụkụ ndị ahụ. A zere asụsụ ụka pụrụ iche na nkọwa ndị na-etinye mmachi na nkwa ahụ.
