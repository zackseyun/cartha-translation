review_pass:
  verdict: revise
  source_fidelity: The threefold universal construction, explanatory ‘N’ihi na,’ present-generic actions, and the future passive in the final clause are all represented faithfully. The final clause appropriately avoids supplying ‘door’ in the main text, as the Greek leaves the thing opened unstated.
  naturalness: The verse is clear, contemporary Standard Igbo and retains the balanced proverbial rhythm. However, the future passive/benefactive form should be spelled and formed ‘a ga-emegheere,’ not ‘a ga-emeghere.’
  terminology: ‘ịrịọ/ịnara,’ ‘ịchọ/ịchọta,’ and ‘ịkụ aka’ are suitable natural equivalents. The footnote correctly identifies that ‘ọnụ ụzọ’ is a contextual clarification rather than an expressed Greek object.
  issues:
  - severity: medium
    issue: The final verb is written ‘a ga-emegherekwa.’
    rationale: For ‘will be opened to/for,’ Standard Igbo requires the form ‘a ga-emegheere’ (with -ere marking the beneficiary/recipient). This also better represents the Greek dative τῷ κρούοντι together with the passive ἀνοιγήσεται.
  revised_text: N’ihi na onye ọ bụla na-arịọ na-anata; onye na-achọkwa na-achọta; a ga-emegheerekwa onye na-akụ aka.[a]
