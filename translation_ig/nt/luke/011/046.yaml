  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: ig
  text: Ma ọ sịrị, “Ahụhụ ga-adịrị unu kwa, ndị ọkachamara n’Iwu[a], n’ihi na unu na-ebukwasị ndị mmadụ ibu ndị na-esiri ike iburu, ma unu onwe unu anaghị eji otu n’ime mkpịsị aka unu emetụ ibu ndị ahụ aka.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị maara Iwu nke ọma.” Okwu Grik a na-ezo aka ná ndị ọkachamara n’Iwu ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “unu anaghị etinye ọbụna otu mkpịsị aka n’ibu ndị ahụ.” Okwu a na-emesi ike na ha anaghị eme mgbalị ọbụla inyere ndị ọzọ aka n’ihe ha na-amanye ha ime.
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: ndị ọkachamara n’Iwu
  rationale: N’ebe a, okwu Grik ahụ na-ezo aka ná ndị maara Iwu Mozis nke ọma, ọ bụghị ndị ọka iwu obodo nke oge a. Nsụgharị a na-eme ka ndị a bụ doo anya n’Igbo.
- source_word: οὐαί
  choice: Ahụhụ dịkwara unu
  rationale: Nke a na-echekwa ike okwu amụma nke na-ama ikpe, ebe ‘dịkwara’ na-egosipụta Καὶ ὑμῖν, ya bụ na ịdọ aka ná ntị ahụ gbasakwara ìgwè a.
- source_word: φορτίζετε ... φορτία
  choice: unu na-ebukwasị ... ibu
  rationale: ‘Ibukwasị ... ibu’ na-echekwa ihe atụ doro anya nke ndị na-etinye ibu n’ahụ́ ndị ọzọ, ma na-ekwughachi otu mgbọrọgwụ echiche ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ἀνθρώπους
  choice: ndị mmadụ
  rationale: Okwu a gbasara mmadụ n’ozuzu ya, ọ bụghị naanị ụmụ nwoke.
- source_word: δυσβάστακτα
  choice: ndị siri ike ibu
  rationale: Nke a pụtara ibu ndị na-esiri mmadụ ike iburu; ọ naghị ekwubiga ya ókè dị ka a ga-asị na ọ gaghị ekwe omume iburu ha ma ọlị.
- source_word: αὐτοὶ
  choice: unu onwe unu
  rationale: Nke a na-egosipụta nkwusi okwu dị na Grik ma mee ka ọdịiche dị n’etiti ndị na-ebukwasị ibu na ndị a na-ebukwasị ya pụta ìhè.
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν
  choice: ọbụna otu n’ime mkpịsị aka unu
  rationale: Nke a na-echekwa nkọwa nkewa dị na Grik ma na-egosi na ha anaghị eme ọbụna mgbalị pere mpe.
- source_word: προσψαύετε
  choice: emetụ ... aka
  rationale: Ngwaa a pụtara imetụ ihe aka. A hapụrụ ihe atụ ahụ n’ahịrịokwu bụ́ isi kama ịkọwa kpọmkwem na ọ pụtara na ha anaghị enyere aka.
theological_decisions:
- issue: Ndị νομικοί bụ ndị dị aṅaa?
  choice: ndị ọkachamara n’Iwu
  alternative: ndị ọka iwu; ndị odeakwụkwọ Iwu
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ndị a bụ ndị ọkachamara n’Iwu ndị Juu. ‘Ndị ọka iwu’ nwere ike ime ka onye na-agụ ya chee banyere ndị ọka iwu ụlọikpe nke oge a, ebe ‘ndị odeakwụkwọ Iwu’ ga-eme ka νομικοί na γραμματεῖς bụrụ otu n’enweghị ihe akaebe zuru ezu.
- issue: Ihe nkebi ikpeazụ pụtara
  choice: 'E chekwara ihe atụ ahụ: ha anaghị eji ọbụna otu mkpịsị aka emetụ ibu ndị ahụ aka.'
  alternative: Ha anaghị enyere ndị mmadụ aka iburu ibu ndị ahụ ma ọlị.
  rationale: Grik kwuru banyere imetụ ibu aka n’ụzọ nkịtị. Nsụgharị ahụ echekwala ihe atụ a na nghọtahie ya—na ha anaghị eme mgbalị ọbụla inyere aka—n’enweghị ịgbakwunye nkọwa ahụ n’ahịrịokwu bụ́ isi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘Iwu’ jiri mkpụrụedemede ukwu gosi Iwu Mozis n’ọnọdụ a. E chekwara ihe atụ banyere ibu na mkpịsị aka, tinyere nkwusi okwu ‘unu onwe unu.’
