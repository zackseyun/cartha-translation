review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the addressee as specialists in the Law, the repeated burden metaphor, the emphatic contrast 'unu onwe unu,' and the image of not touching the burdens with a finger. 'Ahụhụ dịkwara unu,' however, reads more like a statement that suffering is also theirs than the Greek prophetic pronouncement οὐαί; 'Ahụhụ ga-adịrị unu' more clearly carries the judgment-saying force.
  naturalness: The wording is generally clear Standard Igbo. 'Ibu ndị na-esiri ike iburu' is more idiomatic than the compressed 'ibu ndị siri ike ibu,' while retaining the deliberately repeated burden/carry imagery.
  terminology: ‘ndị ọkachamara n’Iwu’ appropriately avoids the misleading modern-civil sense of ‘ndị ọka iwu’ and identifies νόμικοι in this context. Capitalized ‘Iwu’ is suitable for the Mosaic Law. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: The rendering of οὐαί is insufficiently prophetic in force.
    rationale: ‘Ahụhụ dịkwara unu’ can be heard as a descriptive assertion. The Greek is a woe-pronouncement, for which ‘Ahụhụ ga-adịrị unu’ is the established and clearer Igbo expression.
  - severity: low
    issue: The phrase for burdens difficult to bear is somewhat compressed.
    rationale: ‘Ibu ndị siri ike ibu’ is understandable, but ‘ibu ndị na-esiri ike iburu’ is smoother contemporary Standard Igbo and precisely conveys δυσβάστακτα without implying absolute impossibility.
  revised_text: Ma ọ sịrị, “Ahụhụ ga-adịrị unu kwa, ndị ọkachamara n’Iwu[a], n’ihi na unu na-ebukwasị ndị mmadụ ibu ndị na-esiri ike iburu, ma unu onwe unu anaghị eji otu n’ime mkpịsị aka unu emetụ ibu ndị ahụ aka.[b]”
  revised_footnotes:
