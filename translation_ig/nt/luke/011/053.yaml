  text: ⸂Κἀκεῖθεν ἐξελθόντος αὐτοῦ⸃ ἤρξαντο οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι δεινῶς ἐνέχειν καὶ ἀποστοματίζειν αὐτὸν περὶ πλειόνων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: ig
  text: Mgbe o si n’ebe ahụ pụọ, ndị odeakwụkwọ na ndị Farisii malitere ịkpagide ya nke ukwuu na ịmanye ya ka o kwuo[a] banyere ọtụtụ ihe,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ịjụ ya ajụjụ n’uju” ma ọ bụ “ime ka ọ zaa n’enweghị nkwadebe.” Ngwaa Grik a dị ụkọ, o yikwara ka ọ na-egosi ịgbalịsi ike dọpụta azịza n’ọnụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: Mgbe o si n’ebe ahụ pụọ
  rationale: Nkebiokwu genitive absolute a na-egosi ihe mere tupu ngwaa bụ isi, ma na-edobekwa echiche nke isi n’ebe ahụ pụọ.
- source_word: οἱ γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị ọkachamara n’iwu na ndị na-ede akwụkwọ n’ọnọdụ Oziọma a, n’agbanyeghị na ọrụ ha karịrị ide ihe nkịtị.
- source_word: οἱ Φαρισαῖοι
  choice: ndị Farisii
  rationale: A sụgharịghị aha òtù ahụ; e dere ya dịka ụda ya si dị n’Igbo.
- source_word: δεινῶς ἐνέχειν
  choice: ịkpagide ya nke ukwuu
  rationale: Ọ na-egosi nrụgide siri ike na omume iro megide ya, n’asụsụ Igbo doro anya ma dị ndụ.
- source_word: ἀποστοματίζειν
  choice: ịmanye ya ka o kwuo okwu
  rationale: Ngwaa Grik a dị ụkọ ma nwee echiche nke iji ike ajụjụ ma ọ bụ mkpali dọpụta okwu n’ọnụ mmadụ; nhọrọ a na-echekwa omume iro ahụ n’ebughị ụzọ kpebie kpọmkwem usoro ha ji mee ya.
- source_word: περὶ πλειόνων
  choice: banyere ọtụtụ ihe
  rationale: N’ebe a, ọ na-ezo aka n’ọtụtụ isiokwu ma ọ bụ okwu dị iche iche, ọ bụghị naanị ihe ndị ka ukwuu n’ọnụọgụ.
