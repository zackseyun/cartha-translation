revisions:
- from: Nye anyị kwa ụbọchị achịcha anyị chọrọ maka ụbọchị ahụ.[a]
  to: Nye anyị kwa ụbọchị achịcha anyị dị anyị mkpa[a].
  rationale: The revision removes the unwarranted “ụbọchị ahụ,” uses natural Standard Igbo for necessary provision, retains Luke’s explicit “kwa ụbọchị,” and places the footnote marker directly on the contested rendering of ἐπιούσιον. The note presents alternatives without deciding a sacramental or metaphysical interpretation.
