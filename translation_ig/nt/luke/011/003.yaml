  yaml_path: translation/nt/luke/011/003.yaml
  text: Give us each day our daily bread[a].
translation:
  language: ig
  text: Nye anyị kwa ụbọchị achịcha anyị dị anyị mkpa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “achịcha nke ụbọchị ọ bụla,” “achịcha maka ụbọchị na-abịa,” ma ọ bụ “achịcha dị anyị mkpa iji dị ndụ”; ma, n''ụzọ na-adịkarịghị ka ọ bụ ya ebe a, “achịcha karịrị nke nkịtị.” Okwu nkọwa Grik a dị ụkọ, ihe ọ pụtara na-arụkwa ụka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: anyị achịcha
  rationale: Aha Grik a pụtara kpọmkwem ‘achịcha’; n'ekpere a, ọ nwekwara ike ịnọchite anya nri bụ isi. Idebe ‘achịcha’ na-echekwa ihe oyiyi okwu ahụ na ọdịnala amaokwu a.
- source_word: ἡμῶν
  choice: anyị
  rationale: Ọ bụ nnọchiaha nke na-egosi na achịcha ahụ bụ nke ‘anyị.’ N'usoro Igbo, a na-etinye ya n'azụ ‘achịcha.’
- source_word: ἐπιούσιον
  choice: anyị chọrọ maka ụbọchị ahụ
  rationale: Okwu nkọwa a dị ụkọ, ihe ọ pụtara na-esikwa ike ikpebi. Nsụgharị a na-egosi ihe dị mkpa maka ụbọchị ahụ n'ụzọ Igbo dị ndụ, ma ihe ndị ọzọ o nwere ike ịpụta ka edere n'okpuru amaokwu.
- source_word: δίδου
  choice: Nye
  rationale: Ọ bụ iwu dị ugbu a nke nwere ike ịpụta inye ihe mgbe niile. ‘Kwa ụbọchị’ na-egosi nke ọma na arịrịọ a na-aga n'ihu.
- source_word: ἡμῖν
  choice: anyị
  rationale: Ọ bụ onye a na-enye ihe ahụ, ya bụ ‘anyị.’
- source_word: τὸ καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Nkebi okwu a na-emesi inye ihe ụbọchị niile ike. ‘Kwa ụbọchị’ bụ ụzọ Igbo doro anya ma bụrụkwa nke nkịtị isi kwuo ya.
theological_decisions:
- issue: Ihe ἐπιούσιον pụtara n'Ekpere Onyenwe anyị
  choice: anyị chọrọ maka ụbọchị ahụ
  alternative: nke ụbọchị ọ bụla; maka ụbọchị na-abịa; dị mkpa iji dị ndụ; karịrị ihe nkịtị
  rationale: Okwu ahụ nwere ọtụtụ nghọta a na-arụrịta ụka banyere ha. N'akwụkwọ Luk, τὸ καθ’ ἡμέραν na-akwado nghọta metụtara mkpa a na-egbo kwa ụbọchị. Isi amaokwu ahụ anaghị amanye nghọta sakrament ma ọ bụ nke ihe karịrị ụwa nkịtị; nkọwa ala peeji na-echekwa nghọta ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee nsọpụrụ, dee ya. Usoro ‘anyị achịcha’ na-agbaso ụtọ asụsụ Igbo; ‘kwa ụbọchị’ na-echekwa nkwughachi omume dị na Luk, ebe nkọwa ala peeji na-echekwa mgbagwoju anya nke ἐπιούσιον.
