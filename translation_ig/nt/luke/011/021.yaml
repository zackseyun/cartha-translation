  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: ig
  text: Mgbe nwoke ahụ dị ike, onye ji ngwa agha zuru ezu, na-eche ogige nke aka ya[a] nche, ihe ndị o nwere na-adị n’udo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọ ya” ma ọ bụ “ebe obibi ya”; okwu Grik ahụ pụrụ izo aka n’ogige ma ọ bụ n’ụlọ na mpaghara ya.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “na-adị n’udo”; n’ebe a ọ pụtara na ihe ndị ahụ nọ jụụ, n’enweghị nsogbu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Mgbe
  rationale: Ọ na-ewebata ọnọdụ a na-ekwu n’ozuzu ya; “Mgbe” bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu okwu n’ụdị ilu a.
- source_word: ὁ ἰσχυρός
  choice: nwoke ahụ dị ike
  rationale: Adjective a e ji dịka aha na-ezo aka n’otu nwoke siri ike; nsụgharị a na-echekwa nwoke otu onye dị na Grik ma ghara ịkọwa ya ozugbo dịka Setan.
- source_word: καθωπλισμένος
  choice: onye ji ngwa agha niile
  rationale: Perfect participle ahụ na-egosi onye akwadebere nke ọma ma nọ n’ọnọdụ ijikere agha; okwu a na-enye echiche nke ịbụ onye zuru ezu n’ihe agha.
- source_word: φυλάσσῃ
  choice: na-eche ... nche
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo ichebe ma ọ bụ ilekọta ebe ka ihe ghara ịbanye ma ọ bụ pụọ.
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: ogige nke aka ya
  rationale: αὐλή nwere ike ịbụ ogige gbara ụlọ gburugburu, ma nwekwara ike ịgụnye ụlọ ma ọ bụ ebe obibi ahụ dum. “Ogige” na-anọ nso n’echiche bụ isi, ebe “nke aka ya” na-egosipụta ἑαυτοῦ.
- source_word: ἐν εἰρήνῃ
  choice: na-anọ n’udo
  rationale: Nke a na-echekwa okwu udo dị na Grik kama ịgbanwe ya kpamkpam ka ọ bụrụ naanị “nọ ná nchebe”; n’ọnọdụ a, ọ pụtara na ihe ndị ahụ adịghị enwe nsogbu.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ihe onwunwe ya
  rationale: Ọ na-ezo aka n’ihe niile o nwere; “ihe onwunwe” bụ okwu Igbo doro anya ma sara mbara.
theological_decisions:
- issue: Ihe ihe atụ banyere nwoke ahụ dị ike na-ezo aka na ya
  choice: E debere ihe atụ ahụ dịka ọ dị, n’akpọghị nwoke ahụ Setan n’amaokwu a.
  alternative: Ịsụgharị ya n’ụzọ ga-akpọ nwoke ahụ dị ike Setan ozugbo.
  rationale: Amaokwu a n’onwe ya na-enye ihe oyiyi; amaokwu ndị gbara ya gburugburu ka ha na-enyere onye na-agụ ya aka ịghọta onye ihe atụ ahụ na-ezo aka na ya.
- issue: Udo ma ọ bụ nchebe nke ihe onwunwe
  choice: “na-anọ n’udo”
  alternative: “nọ ná nchebe”
  rationale: 'Nhọrọ a na-echekwa ahịrịokwu Grik ἐν εἰρήνῃ na esemokwu ya: n’ebe a, udo na-enye echiche nke ịdị jụụ na enweghị onye na-emebi ihe.'
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “ogige” mee ihe maka αὐλή, ma a naghị ebubata echiche nke nnukwu ụlọ eze n’amaokwu ahụ. Akara ntụaka [a] dị na ngwụcha ahịrịokwu ebe ọ na-akọwa “na-anọ n’udo.”
