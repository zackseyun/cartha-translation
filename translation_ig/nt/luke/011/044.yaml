source:
  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: ig
  text: Ahụhụ ga-adịrị unu, n’ihi na unu dị ka ili ndị a na-enweghị akara, ma ndị mmadụ na-eje ije n’elu ha amaghịkwa ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Ahụhụ ga-adịrị unu
  rationale: Na-egosipụta ịdọ aka ná ntị siri ike na ikpe dị n’okwu Grik, n’asụsụ Igbo dị ugbu a ma dịkwa nsọpụrụ.
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: ili ndị a na-apụghị ịhụ ama
  rationale: ἄδηλα pụtara ihe na-apụtaghị ìhè ma ọ bụ nke a na-amaghị; okwu a na-egosi ili na-enweghị ihe ga-eme ka ndị na-agafe mara na ọ bụ ili.
- source_word: οἱ ἄνθρωποι
  choice: ndị mmadụ
  rationale: Ọ bụ okwu izugbe maka ụmụ mmadụ, ọ bụghị naanị ụmụ nwoke.
- source_word: οἱ περιπατοῦντες ἐπάνω
  choice: na-eje ije n’elu ha
  rationale: Na-edobe ihe oyiyi doro anya nke ndị mmadụ na-aga n’elu ili ndị ahụ.
- source_word: οὐκ οἴδασιν
  choice: n’amaghị ya
  rationale: Na-egosipụta na ndị na-agafe amaghị na ihe ha na-aga n’elu ya bụ ili.
theological_decisions:
- issue: Mmetọ metụtara ịga n’elu ili n’amaghị ama
  choice: E debere ihe oyiyi ili a na-apụghị ịhụ ama n’enweghị nkọwa agbakwunyere n’amaokwu ahụ.
  alternative: Ịkọwa kpọmkwem na ndị Farisii na-emerụ ndị ọzọ n’amaghị ama.
  rationale: Isi mmalite ahụ na-enye ntụnyere ahụ n’onwe ya, ma ọ naghị akọwa ihe ọ pụtara kpọmkwem n’amaokwu a; ịhapụ ya otu a na-echekwa ike na mgbagwoju anya nke okwu Jizọs.
translation_notes:
  register: Standard Igbo nke dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ “ndị mmadụ” kama okwu ga-apụta naanị ụmụ nwoke, n’ihi na Grik bụ okwu izugbe. E zere itinye nkọwa omenala ma ọ bụ nke ụka n’ime ederede amaokwu ahụ.
