review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the woe pronouncement, the comparison with tombs, people walking over them, and their lack of knowledge. However, “ili ndị a na-apụghị ịhụ ama” is not a clear or idiomatic rendering of τὰ μνημεῖα τὰ ἄδηλα; it can suggest tombs whose identifying mark cannot be seen rather than tombs that are unmarked/unrecognizable.
  naturalness: “Ili ndị a na-enweghị akara” is direct, natural Standard Igbo for “unmarked tombs.” Recasting the final clause with an explicit finite verb improves flow and makes the people’s ignorance clear.
  terminology: “Ahụhụ ga-adịrị unu” suitably renders οὐαὶ ὑμῖν in a solemn warning register. “Ndị mmadụ” properly retains the generic force of οἱ ἄνθρωποι; no male-only sense should be introduced.
  issues:
  - severity: medium
    issue: Ambiguous and non-idiomatic rendering of “unmarked tombs”
    rationale: “Ndị a na-apụghị ịhụ ama” is structurally awkward and may mean that a mark is not visible, rather than that the tombs lack a recognizable marker. “Ndị a na-enweghị akara” more faithfully and naturally expresses the stated comparison.
  - severity: low
    issue: Final clause is elliptical
    rationale: “n’amaghị ya” is understandable, but “amaghịkwa ya” after the finite verb “na-eje ije” is smoother and clearly predicates ignorance of the tombs’ true nature.
  revised_text: Ahụhụ ga-adịrị unu, n’ihi na unu dị ka ili ndị a na-enweghị akara, ma ndị mmadụ na-eje ije n’elu ha amaghịkwa ya.
