id: LUK.11.24
reference: Luke 11:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: ig
  text: Mgbe mmụọ na-adịghị ọcha si n’ime mmadụ ahụ pụta, ọ na-agafe n’ebe mmiri na-adịghị[a], na-achọ izu ike; ma ọ chọtaghị izu ike, ọ na-ekwu, “Aga m alaghachi n’ụlọ m, bụ ebe m siri pụta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ebe kpọrọ nkụ.” Grik kwuru kpọmkwem ebe mmiri na-adịghị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: Mgbe
  rationale: Ọ na-egosi ọnọdụ metụtara oge n’ụzọ dabara adaba n’Igbo, ma na-ahapụ okwu ahụ ka ọ bụrụ ihe atụ zuru ezu.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: mmụọ na-adịghị ọcha
  rationale: Nke a na-echekwa echiche nke mmụọ ọjọọ e ji adịghị ọcha mara, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: si n’ime mmadụ ahụ pụta
  rationale: Nke a bụ ụzọ Igbo si ekwu nke ọma na mmụọ hapụrụ onye ọ nọ n’ime ya; “mmadụ ahụ” na-echekwa isiokwu mmadụ nke ἀνθρώπου na article ya n’enweghị ịmanye na ọ bụ nwoke.
- source_word: διέρχεται
  choice: ọ na-agagharị
  rationale: Ọ na-egosi mmegharị ya site n’otu ebe ruo ebe ọzọ ka ọ na-achọ izu ike.
- source_word: δι’ ἀνύδρων τόπων
  choice: n’ebe mmiri na-adịghị
  rationale: Ọ na-asụgharị ἀνύδρων kpọmkwem dị ka ebe na-enweghị mmiri ma na-echekwa ihe oyiyi nke ebe tọgbọrọ n’efu.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: na-achọ izu ike
  rationale: Ọ na-echekwa participle ahụ na ebumnuche ọchịchọ izu ike n’asụsụ Igbo dị mfe.
- source_word: καὶ μὴ εὑρίσκον
  choice: Mgbe ọ na-achọtaghị ya
  rationale: “Ya” na-ezo aka n’izu ike; nhazi a bụ nke eke n’Igbo ma na-echekwa usoro ihe mere.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: Present tense a na-echekwa ịdị ndụ nke historical present dị na Grik.
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: Aga m alaghachi n’ụlọ m
  rationale: Ọ na-echekwa mkpebi future ahụ na ihe atụ doro anya nke “ụlọ.”
- source_word: ὅθεν ἐξῆλθον
  choice: nke m si na ya pụta
  rationale: Ọ na-echekwa relative construction ahụ ma na-emegharị echiche nke ịpụta dị na mmalite amaokwu ahụ.
theological_decisions:
- issue: Ihe “mmụọ na-adịghị ọcha” na-ezo aka na ya
  choice: E gosipụtara ya dị ka mmụọ nwere ike ime ihe, ịchọ ihe, na ikwu okwu.
  alternative: Ịsụgharị ya naanị dị ka ihe atụ nke nlọghachi n’omume ọjọọ ma ọ bụ dị ka ike na-enweghị uche.
  rationale: Usoro okwu Grik na-enye mmụọ ahụ omume nke onye nwere uche; nsụgharị ahụ ekwesịghị iwepụ nke a ma ọ bụ kpebie karịa ihe ederede kwuru.
- issue: Nkọwa nke ἀνθρώπου
  choice: mmadụ ahụ
  alternative: nwoke ahụ
  rationale: N’ebe a ἄνθρωπος na-ezo aka n’otu mmadụ e ji mee ihe atụ, ọ bụghị kpọmkwem nwoke n’ụzọ lexical; “mmadụ ahụ” na-echekwa singular na article ahụ n’enweghị ịgbakwunye okike nwoke.
- issue: Ihe “ụlọ m” pụtara
  choice: E debere ihe atụ ahụ kpọmkwem dị ka “ụlọ m.”
  alternative: Ịkọwa ya n’ime amaokwu ahụ dị ka ahụ mmadụ ma ọ bụ ndụ mmadụ.
  rationale: οἶκος bụ “ụlọ,” ebe onye ọ na-anọchi anya ya pụtara site n’ọnọdụ amaokwu ahụ; nsụgharị ekwesịghị imechi nghọta ihe atụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ “mmụọ na-adịghị ọcha” maka ịdị nso n’usoro okwu Grik, “n’ebe mmiri na-adịghị” maka ihe oyiyi lexical ya, na “mmadụ ahụ” maka nkọwa generic nke ἄνθρωπος. E tinyere akara nkọwa ala ala [a] ozugbo n’akụkụ okwu ọ na-akọwa.
