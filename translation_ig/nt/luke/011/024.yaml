revisions:
- from: Mgbe mmụọ na-adịghị ọcha si n’ime mmadụ ahụ pụta, ọ na-agagharị n’ebe mmiri na-adịghị[a], na-achọ izu ike. Mgbe ọ na-achọtaghị ya, ọ na-ekwu, “Aga m alaghachi n’ụlọ m nke m si na ya pụta.”
  to: Mgbe mmụọ na-adịghị ọcha si n’ime mmadụ ahụ pụta, ọ na-agafe n’ebe mmiri na-adịghị[a], na-achọ izu ike; ma ọ chọtaghị izu ike, ọ na-ekwu, “Aga m alaghachi n’ụlọ m, bụ ebe m siri pụta.”
  rationale: The revision preserves the general temporal condition, the personal agency of the unclean spirit, and the concrete house imagery. It uses a more precise Standard Igbo movement verb for διέρχεται, retains the plural/local sense of waterless places, and makes the unfulfilled search for rest explicit without adding interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the unclean spirit, its departure from the representative human subject, its search for rest, and its resolve to return. However, “ọ na-agagharị n’ebe mmiri na-adịghị” can suggest wandering about rather than passing through waterless places, and “Mgbe ọ na-achọtaghị ya” unnecessarily recasts the coordinated participle as a separate temporal clause.
  naturalness: The register is clear Standard Igbo. “Ọ na-agafe n’ebe mmiri na-adịghị” is more direct and natural for movement through such places. Repeating “izu ike” removes an ambiguous pronoun and makes the clause flow naturally.
  terminology: “Mmụọ na-adịghị ọcha,” “izu ike,” and “ụlọ m” appropriately preserve the source terminology and imagery without doctrinal expansion. “Mmadụ ahụ” is appropriate for generic ἄνθρωπος in Igbo; it should not be narrowed to nwoke.
  issues:
  - severity: low
    issue: Movement verb is imprecise
    rationale: “Na-agagharị” primarily conveys wandering/roaming, whereas διέρχεται means passing through. “Na-agafe” better retains the directional sense.
  - severity: low
    issue: Clause linkage slightly shifts the Greek construction
    rationale: The Greek has “and, not finding [rest], it says.” Rendering this as “ma ọ chọtaghị izu ike, ọ na-ekwu” preserves coordination and sequence more closely than a new “Mgbe” clause.
  revised_text: Mgbe mmụọ na-adịghị ọcha si n’ime mmadụ ahụ pụta, ọ na-agafe n’ebe mmiri na-adịghị[a], na-achọ izu ike; ma ọ chọtaghị izu ike, ọ na-ekwu, “Aga m alaghachi n’ụlọ m, bụ ebe m siri pụta.”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ebe kpọrọ nkụ.” Grik kwuru kpọmkwem ebe mmiri na-adịghị.
    reason: lexical_alternative
  revision_rationale: The revision preserves the general temporal condition, the personal agency of the unclean spirit, and the concrete house imagery. It uses a more precise Standard Igbo movement verb for διέρχεται, retains the plural/local sense of waterless places, and makes the unfulfilled search for rest explicit without adding interpretation.
