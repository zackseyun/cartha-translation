  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ig
  text: Onye na-adịghị n'akụkụ m na-emegide m,[a] onye na-adịghị esoro m achịkọta na-achụsasị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye ọ bụla na-adịghị n'akụkụ m na-emegide m, onye ọ bụla na-adịghị esoro m achịkọta na-achụsasị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: Onye na-anọghịnyere
  rationale: Nkebiokwu a na-ezo aka n’ụzọ izugbe n’onye e ji enweghị ịdịnyere Jizọs mara; “onye na-anọghịnyere” bụ Igbo doro anya ma na-edobe ike nke participle e ji mere aha.
- source_word: μετ’ ἐμοῦ
  choice: m
  rationale: E jikọtara ya na “na-anọghịnyere” ka ọ bụrụ “na-anọghịnyere m,” nke na-egosi mkpakọrịta na nkwado n’ụzọ Igbo si ada nke ọma.
- source_word: κατ’ ἐμοῦ
  choice: na-emegide m
  rationale: Nke a na-egosipụta mmegide kpọmkwem ma na-edobe ọdịiche siri ike dị n’etiti ịdịnyere Jizọs na imegide ya.
- source_word: συνάγων
  choice: achịkọta ihe
  rationale: “Ịchịkọta” na-edobe ihe atụ nke iweta ihe ọnụ; itinye “ihe” na-eme ka ahịrịokwu ahụ zuo oke ma doo anya n’Igbo n’enweghị ịkọwapụta ihe a na-achịkọta.
- source_word: σκορπίζει
  choice: na-achụsasị ya
  rationale: “Ịchụsasị” bụ okwu doro anya nke na-emegide “ịchịkọta”; nnọchiaha “ya” na-ezo n’ozuzu aka n’ihe a na-achịkọta n’etinyeghị nkọwa na-adịghị na Greek.
- source_word: καὶ
  choice: onye na-adịghịkwa
  rationale: Mgbakwunye “-kwa” jikọtara ahịrịokwu abụọ yiri ibe ha n’ụzọ Igbo dị ebumpụta ụwa ma na-edobe καὶ.
theological_decisions:
- issue: Ike okwu Jizọs banyere enweghị ọnọdụ etiti n’ebe ọ nọ
  choice: 'E debere ọdịiche ahụ n’enweghị ime ka ọ dị nro: onye na-anọghịnyere Jizọs na-emegide ya.'
  alternative: Ịsụgharị ya dị ka nanị enweghị nkwado, ma ọ bụ igbochi okwu ahụ naanị n’ihe banyere ịchụ mmụọ ọjọọ.
  rationale: Ụdị Greek ahụ bụ okwu zuru oke ma kwụ ọtọ. Nsụgharị a na-edobe esemokwu nkà mmụta okpukpe ahụ n’etinyeghị nkọwa otu ụka ma ọ bụ ozizi e mechara wulite.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro ahịrịokwu abụọ yiri ibe ha chekwaa nkwughachi na ọdịiche dị na Greek; akara [a] pụtara n’ederede bụ isi.
