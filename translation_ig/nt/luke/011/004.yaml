- from: Gbagharakwa anyị mmehie anyị, n’ihi na anyị onwe anyị kwa[c] na-agbaghara onye ọ bụla ji anyị ụgwọ[a]. Ewebatala anyị n’ọnwụnwa[b].
  to: Gbaghara anyị mmehie anyị, n’ihi na anyị onwe anyị na-agbaghara onye ọ bụla ji anyị ụgwọ[a]. Ewebatala anyị n’ọnwụnwa[b].
  rationale: Removed the unsupported explicit ‘kwa’ from the grounding clause, while preserving the emphatic ‘anyị onwe anyị.’ Removed the now-unanchored previous-rendering note. Narrowed the final footnote to lexical alternatives actually supported by πειρασμός, without introducing the additional idea of suffering.
