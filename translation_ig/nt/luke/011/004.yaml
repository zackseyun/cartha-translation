  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: ig
  text: Gbaghara anyị mmehie anyị, n’ihi na anyị onwe anyị na-agbaghara onye ọ bụla ji anyị ụgwọ[a]. Ewebatala anyị n’ọnwụnwa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘onye ọ bụla ji anyị ihe.’ Grik ji okwu metụtara ụgwọ n’ebe a, ọ bụ ezie na akụkụ mbụ kwuru ‘mmehie.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘nnwale’ ma ọ bụ ‘ule.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: gbaghara
  rationale: N’ọnọdụ ekpere a, ἀφίημι pụtara ịgbaghara. ‘Gbaghara’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị arịọ mgbaghara.
- source_word: τὰς ἁμαρτίας
  choice: mmehie
  rationale: Grik kwuru kpọmkwem ‘mmehie,’ ọ bụghị ‘ụgwọ,’ n’akụkụ mbụ a.
- source_word: καὶ γὰρ αὐτοὶ
  choice: n’ihi na anyị onwe anyị kwa
  rationale: ‘N’ihi na’ na-egosi ihe mere e ji rịọ arịrịọ ahụ; ‘anyị onwe anyị’ na-echekwa nkwusi ike nke αὐτοὶ, ebe ‘kwa’ na-egosi echiche nke ‘anyị onwe anyị kwa.’
- source_word: ἀφίομεν
  choice: na-agbaghara
  rationale: Ụdị ngwaa na-egosi omume na-aga n’ihu. Iji ‘gbaghara’ ọzọ na-echekwa njikọ ya na ἄφες.
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: onye ọ bụla ji anyị ụgwọ
  rationale: Nke a bụ ụzọ Igbo e si ekwu nke ọma na mmadụ ji onye ọzọ ụgwọ; ọ na-echekwakwa okwu gbasara ụgwọ dị na Grik kama ime ka ọ bụrụ naanị ‘onye mejọrọ anyị.’
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: Ewebatala anyị n’ọnwụnwa
  rationale: ‘Ewebatala’ na-egosipụta echiche εἰσφέρω nke iweta ma ọ bụ ịkpọbata n’ime ihe. ‘Ọnwụnwa’ bụ okwu Igbo a na-aghọta nke ọma maka πειρασμός n’ebe a, ebe ihe ọ pụkwara ịpụta dị ka ‘nnwale’ dị n’ala peeji.
theological_decisions:
- issue: Ihe arịrịọ ikpeazụ banyere πειρασμός pụtara
  choice: Ewebatala anyị n’ọnwụnwa
  alternative: Ewebatala anyị na nnwale
  rationale: Nsụgharị ahụ na-edebe otú Grik siri kwuo arịrịọ ahụ n’ebughị ụzọ kọwaa ma ọ bụ belata esemokwu nkà mmụta okpukpe banyere mmekọrịta Chineke na ọnwụnwa. Ala peeji na-edebe ihe ọzọ πειρασμός pụrụ ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dịkwa mfe nghọta, dee ya. ‘Gbagharakwa’ na ‘Ewebatala’ dabara n’olu ekpere a na-agwa Chineke okwu ozugbo. E chekwara ọdịiche dị n’etiti ‘mmehie’ n’akụkụ mbụ na okwu gbasara ‘ụgwọ’ n’akụkụ nke abụọ.
