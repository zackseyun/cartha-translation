id: LUK.11.30
reference: Luke 11:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: ig
  text: N’ihi na dịka Jona ghọrọ ihe ịrịba ama nye ndị Ninive, otu ahụkwa ka Nwa nke Mmadụ ga-abụrụ ọgbọ a ihe ịrịba ama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e kwughachighị “ihe ịrịba ama” n’akụkụ nke abụọ; a ghọtara ya site na ntụnyere e ji Jona mee.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: N’ihi na, dịka
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ, ebe “dịka” na-echekwa ntụnyere nke καθώς n’Igbo dị mma.
- source_word: ἐγένετο
  choice: ghọrọ
  rationale: “Ghọrọ” na-egosipụta na Jona bịara rụọ ọrụ dị ka ihe ịrịba ama, kama naanị ikwu na ọ bụ ya.
- source_word: Ἰωνᾶς
  choice: Jona
  rationale: Nke a bụ odide aha a a na-ejikarị eme ihe n’Igbo.
- source_word: τοῖς Νινευίταις
  choice: nye ndị Ninive
  rationale: '“Nye” na-egosipụta njikọ dative ahụ: Jona bụụrụ ndị Ninive ihe ịrịba ama.'
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Ọ na-echekwa echiche nke ihe na-egosi ma na-ekpughe ihe, dịka σημεῖον si arụ ọrụ n’akwụkwọ Luk.
- source_word: οὕτως ... καὶ
  choice: otu ahụkwa ka
  rationale: Nkebiokwu a na-egosipụta ntụnyere na mgbakwunye dị na οὕτως na καί n’Igbo nkịtị.
- source_word: ἔσται
  choice: ga-abụ
  rationale: Nke a bụ nsụgharị kpọmkwem nke ọdịnihu εἰμί; a hapụrụ ihe a na-ekwu na ọ ga-abụ ka a ghọta ya site na ahịrịokwu mbụ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Ọ na-echekwa okwu ahụ dị ka aha pụrụ iche ma na-ahapụkwa njikọ ya na ihe odide ndị ọzọ na nghọta Mesaya n’enweghị ịkọwa ya karịa isi mmalite.
- source_word: τῇ γενεᾷ ταύτῃ
  choice: nye ọgbọ a
  rationale: “Ọgbọ” na-echekwa okwu γενεά na ụda amụma ya; “nye” na-egosipụta dative nke ntụaka.
theological_decisions:
- issue: Ihe e kwuru na-adịghị apụta ìhè n’ahịrịokwu nke abụọ
  choice: “Nwa nke Mmadụ ga-abụ nye ọgbọ a,” na-ahapụ “ihe ịrịba ama” ka ntụnyere ahụ mee ka a ghọta ya.
  alternative: “Nwa nke Mmadụ ga-abụrụ ọgbọ a ihe ịrịba ama.”
  rationale: Ihe odide Grik ekwughachighị σημεῖον n’ahịrịokwu nke abụọ. Nsụgharị bụ isi na-echekwa nhazi na mgbagwoju anya ahụ; nkọwa ala peeji na-eme ka ihe ntụnyere ahụ pụtara doo anya.
- issue: Ihe “Nwa nke Mmadụ” pụtara
  choice: E debere aha ahụ dịka “Nwa nke Mmadụ” n’enweghị mgbasawanye nkọwa.
  alternative: “Onye ahụ bụ mmadụ” ma ọ bụ nkọwa ọzọ na-akọwa ya
  rationale: Nkebiokwu ahụ bụ ma okwu nkịtị ma aha pụrụ iche n’Oziọma ndị ahụ; idebe ya otu a na-echekwa esemokwu nkọwa na njikọ ya na ihe odide ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ihe ịrịba ama” maka σημεῖον, “ọgbọ” maka γενεά, ma debe aha pụrụ iche “Nwa nke Mmadụ.”
