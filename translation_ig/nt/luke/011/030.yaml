revisions:
- from: N’ihi na, dịka Jona ghọrọ ihe ịrịba ama nye ndị Ninive, otu ahụkwa ka Nwa nke Mmadụ ga-abụ nye ọgbọ a.[a]
  to: N’ihi na dịka Jona ghọrọ ihe ịrịba ama nye ndị Ninive, otu ahụkwa ka Nwa nke Mmadụ ga-abụrụ ọgbọ a ihe ịrịba ama.[a]
  rationale: The revision supplies “ihe ịrịba ama” in the second clause because it is plainly implied by the Greek comparison and is needed for idiomatic, complete Standard Igbo. The footnote preserves awareness that σημεῖον is not repeated in the Greek text. No doctrinal interpretation has been introduced.
  reviewer_model: gpt-5.6-terra
