review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the comparison, Jonah's becoming a sign, the Ninevites, the future reference to the Son of Man, and this generation. The Greek leaves the predicate in the second clause implicit, but the parallel clearly supplies “a sign.”
  naturalness: The main clause “Nwa nke Mmadụ ga-abụ nye ọgbọ a” is an overly literal ellipsis that sounds incomplete in natural Standard Igbo. Supplying the understood predicate produces a clear, idiomatic sentence without materially adding to the Greek.
  terminology: “Jona,” “ndị Ninive,” “ihe ịrịba ama,” “Nwa nke Mmadụ,” and “ọgbọ a” are appropriate Standard Igbo renderings. “Nwa nke Mmadụ” properly preserves the title without interpretive expansion.
  issues:
  - severity: medium
    issue: The second clause has a dangling predicate in Igbo.
    rationale: Although Greek permits the predicate “a sign” to be understood from the preceding clause, bare “ga-abụ nye ọgbọ a” is not a natural or complete Igbo expression. The implied predicate should be supplied in the translation, with a footnote noting its omission in Greek.
  revised_text: N’ihi na dịka Jona ghọrọ ihe ịrịba ama nye ndị Ninive, otu ahụkwa ka Nwa nke Mmadụ ga-abụrụ ọgbọ a ihe ịrịba ama.[a]
