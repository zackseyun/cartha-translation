  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ig
  text: 'Mụ onwe m na-agwa unu, sị: Rịọnụ, a ga-enye unu; chọọnụ, unu ga-achọta; kụọnụ aka, a ga-emeghere unu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Present imperatives Grik ndị a nwekwara ike igosi omume na-aga n’ihu: “Nọgidenụ na-arịọ ... nọgidenụ na-achọ ... nọgidenụ na-akụ aka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: Mụ onwe m na-agwakwa unu, sị
  rationale: “Na-agwakwa” na-egosipụta njikọ καί na okwu ndị bu ụzọ, ebe “mụ onwe m” na-ebute nkwusi ike dị na ἐγώ n’Igbo eke.
- source_word: αἰτεῖτε
  choice: Na-arịọnụ
  rationale: “Ịrịọ” bụ okwu Igbo doro anya maka ịrịọ ihe; usoro “na-...nụ” nwere ike igosipụta omume a na-eme ugboro ugboro ma ọ bụ na-aga n’ihu, dịka present imperative Grik nwere ike isi pụta.
- source_word: δοθήσεται ὑμῖν
  choice: a ga-enye unu
  rationale: Nke a na-edobe ọdịdị passive nke Grik ma hapụ onye ga-enye ya n’ezoghị ọnụ, dịka isi mmalite ahụ mere.
- source_word: ζητεῖτε
  choice: na-achọọnụ
  rationale: “Ịchọ” na-eburu ma ịchọ ihe nkịtị ma ịchọ n’ụzọ ihe atụ, otú ζητέω si dị ebe a.
- source_word: εὑρήσετε
  choice: unu ga-achọta
  rationale: Ọ na-asụgharị future active ahụ ozugbo ma na-edobe nkwa nke dị n’usoro ahịrịokwu atọ ahụ.
- source_word: κρούετε
  choice: na-akụ aka
  rationale: Nke a bụ okwu Igbo e ji ekwu ịkụ aka n’ọnụ ụzọ, na-edobe ihe atụ ahụ n’enweghị mgbakwunye.
- source_word: ἀνοιγήσεται ὑμῖν
  choice: a ga-emeghere unu
  rationale: “Meghere unu” na-egosipụta na a ga-emeghe ihe ahụ maka unu, ma na-ahapụ “ọnụ ụzọ” nke a ghọtara site n’ịkụ aka ka a ghara ikwu ya n’ezoghị na Grik.
theological_decisions:
- issue: Ụdị omume present imperatives αἰτεῖτε, ζητεῖτε, κρούετε
  choice: E ji usoro Igbo “na-arịọnụ ... na-achọọnụ ... na-akụ aka” gosipụta iwu ndị nwere ike ịpụta omume na-aga n’ihu.
  alternative: “Rịọnụ ... chọọnụ ... kụọ aka” dịka iwu otu ugboro na-enweghị igosipụta ịdịgide.
  rationale: Present imperative Grik nwere ike ibu echiche nke ịga n’ihu ma ọ bụ ime ugboro ugboro, ma ọ bụghị iwu na ọ ga-adị otú ahụ mgbe niile. Usoro a bụ nke e ji enye iwu n’Igbo eke ma na-eme ka ịdịgide dị mfe ịghọta; nkọwa ala peeji na-echekwa nhọrọ nke iwu ndị dị mfe.
- issue: Onye na-enye ma na-emeghe
  choice: 'A hapụrụ onye na-eme omume ahụ n’ezoghị ọnụ: “a ga-enye ... a ga-emeghere.”'
  alternative: Ikwu hoo haa na Chineke ga-enye ma ọ bụ meghee.
  rationale: Future passives ndị Grik nwere ike ime ka onye na-eme ya bụrụ Chineke, mana amaokwu ahụ akpọghị ya aha. Ịhapụ ya n’ezoghị ọnụ na-echekwa ụdị okwu na esemokwu nkọwa nke isi mmalite.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu atọ na ọdịdị passive nke Grik. A zere ịkpọ Chineke aha n’ebe Grik hapụrụ onye na-eme ihe ahụ n’ezoghị ọnụ.
