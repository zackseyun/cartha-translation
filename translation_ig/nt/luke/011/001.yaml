id: LUK.11.1
reference: Luke 11:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: ig
  text: O wee bụrụ na, mgbe ọ nọ n’otu ebe na-ekpe ekpere, mgbe ọ kwụsịrị, otu n’ime ndị na-eso ụzọ ya sịrị ya, “Onyenwe anyị, kuziere anyị ikpe ekpere, dị nnọọ ka Jọn kuzikwara ndị na-eso ụzọ ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: O wee ruo na
  rationale: Nke a bụ ụzọ ebumpụta akụkọ n’Igbo nke na-egosipụta usoro akụkọ Luk n’enweghị iji okwu ochie ma ọ bụ nke siri ike nghọta.
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: mgbe ọ nọ na-ekpe ekpere
  rationale: “Nọ na-ekpe” na-egosipụta na ekpere ahụ ka na-aga n’ihu, dịka nhazi okwu Grik si gosi.
- source_word: ἐν τόπῳ τινὶ
  choice: n’otu ebe
  rationale: Ọ na-edobe ebe ahụ ka nke a na-akọwaghị kpọmkwem, ma bụrụkwa okwu Igbo nkịtị na nke doro anya.
- source_word: ὡς ἐπαύσατο
  choice: mgbe ọ kwụsịrị
  rationale: Nke a na-asụgharị ἐπαύσατο kpọmkwem dịka ịkwụsị, kama ịkọwa ya karịa dịka imecha ekpere.
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: otu n’ime ndị na-eso ụzọ ya
  rationale: Nke a na-egosipụta nhazi partitive nke Grik n’ụzọ Igbo sitere n’okike.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nkwanye ugwu e ji akpọ κύριος, ma na-edobekwa obosara ihe aha ahụ pụrụ ịpụta mgbe a na-akpọ Jizọs.
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: kuziere anyị ikpe ekpere
  rationale: Ọ na-edobe infinitive ahụ n’enweghị ịgbakwunye “otu anyị ga-esi,” nke ga-akọwa okwu Grik karịa ka o kwuru.
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: dị nnọọ ka Jọn kuzikwara ndị na-eso ụzọ ya
  rationale: “Dị nnọọ ka” na-egosipụta ntụnyere καθώς, “-kwara” na-ebukwa echiche καί nke pụtara “kwa.”
theological_decisions:
- issue: Nsụgharị κύριος mgbe onye na-eso ụzọ na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: “Onyenwe anyị” na-echekwa ma nkwanye ugwu ma mkpa aha ahụ nwere n’Agba Ọhụrụ, n’enweghị ime ka ọ bụrụ naanị aha onye nkuzi ma ọ bụ ịkọwapụta oke ihe onye kwuru bu n’obi.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro akụkọ na mmegharị omume dị n’Grik, ma zere ụdị okwu ochie ma ọ bụ nsụgharị siri ike nke ukwuu.
