  to: Ka ìgwè mmadụ na-ezukọ, ọ malitere ikwu sị, “Ọgbọ a bụ ọgbọ ọjọọ. Ọ na-achọ ihe ịrịba ama, ma a gaghị enye ya ihe ịrịba ama ọ bụla ma e wezụga ihe ịrịba ama Jona.[a]”
