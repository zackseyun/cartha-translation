id: LUK.11.29
reference: Luke 11:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: ig
  text: Ka ìgwè mmadụ na-ezukọ, ọ malitere ikwu sị, “Ọgbọ a bụ ọgbọ ọjọọ. Ọ na-achọ ihe ịrịba ama, ma a gaghị enye ya ihe ịrịba ama ọ bụla ma e wezụga ihe ịrịba ama Jona.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a, “ihe ịrịba ama Jona,” nwere ike izo aka na Jona n’onwe ya dịka ihe ịrịba ama n’ọrụ ozi amụma ya. Akụkụ ndị yiri nke a n’Oziọma ndị ọzọ nwekwara ike igosi njikọ ihe atụ ya na ọnwụ na mbilite n’ọnwụ Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: na-abịakọtakwu ọnụ
  rationale: Okwu a na-egosi na ìgwè mmadụ nọ na-agbakọta, na-abawanyekwa n’ọnụ ọgụgụ, n’otu oge ahụ Jizọs malitere ikwu okwu. Nhọrọ a bụ Igbo nkịtị ma na-edobe echiche nke omume na-aga n’ihu.
- source_word: ἤρξατο λέγειν
  choice: ọ malitere ikwu sị
  rationale: Nke a na-edobe ike nke usoro Grik nke na-egosi mmalite ikwu okwu, ma na-ada nke ọma n’Igbo.
- source_word: γενεά
  choice: ọgbọ
  rationale: “Ọgbọ” bụ okwu Igbo doro anya maka ndị bi n’otu oge, ma na-edobe ma echiche nke oge ha ma ikpe e ji omume ha mara.
- source_word: πονηρά
  choice: ọjọọ
  rationale: “Ọjọọ” na-ekwupụta ikpe gbasara omume n’ụzọ kwụ ọtọ ma dị mfe nghọta, n’emeghị ka okwu ahụ dị nro.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nhọrọ a na-edobe echiche nke ihe na-egosi ma ọ bụ na-akwado eziokwu, n’etinyeghị okwu “ọrụ ebube” ebe Grik ekwughị ya kpọmkwem.
- source_word: ζητεῖ
  choice: na-achọ
  rationale: Nke a bụ nsụgharị kpọmkwem nke ngwaa ahụ. Ọnọdụ okwu ahụ n’onwe ya na-egosi na ọchịchọ ahụ adịghị mma, ya mere ọ dịghị mkpa ịgbakwunye echiche “na-amanye ka e nye ya.”
- source_word: δοθήσεται
  choice: a gaghị enye ya
  rationale: Usoro a na-egosipụta ọdịnihu nke ngwaa nnara n’Igbo dị ugbu a ma doo anya.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N’ahịrịokwu a jụrụ ihe niile ọzọ, okwu a na-egosi otu ihe naanị a hapụrụ n’ime njụ ahụ.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: ihe ịrịba ama Jona
  rationale: A hapụrụ njikọ aha a ka ọ saa mbara dịka ọ dị na Grik, ka nsụgharị ghara ikpebi n’isi ma ọ bụ ihe ịrịba ama Jona nyere, Jona n’onwe ya dịka ihe ịrịba ama, ma ọ bụ njikọ ihe atụ ọzọ.
theological_decisions:
- issue: Ike ikpe Jizọs mara “ọgbọ a”
  choice: A sụgharịrị ya dịka ikpe gbasara omume nke ndị ọgbọ Jizọs n’ozuzu ha, n’emeghị ka okwu ahụ dị nro.
  alternative: Ime ka ọ na-ezo aka naanị n’ebe ụfọdụ ndị na-emegide Jizọs nọ.
  rationale: Nkwughachi “ọgbọ a bụ ọgbọ ọjọọ” na-enye ikpe ahụ ike ma na-egosi ndị otu oge ahụ n’ụzọ sara mbara; nsụgharị ahụ agbasaghị ma ọ bụ ebelataghị ndị okwu Grik na-ezo aka na ha.
- issue: Ihe “ihe ịrịba ama Jona” pụtara
  choice: E debere njikọ ahụ dịka “ihe ịrịba ama Jona,” ma kọwaa ohere ndị dị na nkọwa ala peeji.
  alternative: Ịkọwa ya kpọmkwem dịka ozi nkwusa Jona, ma ọ bụ dịka ọnwụ na mbilite n’ọnwụ Jizọs.
  rationale: Ọnọdụ okwu dị nso na Luk na-enye nkọwa ya, ebe akụkụ ndị yiri ya n’Oziọma ndị ọzọ nwere ike ịkpọlite njikọ ihe atụ ọzọ. Isi ederede ekwesịghị idozi ihe Grik hapụrụ ka ọ saa mbara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ka … na-” na-egosi omume na-aga n’ihu n’otu oge ahụ; e zere okwu ụka pụrụ iche na nkọwa nke otu ụka.
