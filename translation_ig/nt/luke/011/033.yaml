  verdict: revise
  source_fidelity: 'Isi nsụgharị ahụ na-ejigide ọdịiche ndị bụ isi: oriọna a mụnyere, ebe zoro ezo, ihe e ji atụ ihe a na-etinye n’elu oriọna, ihe ndọba oriọna, na nzube ka ndị na-abata hụ ìhè ahụ. Otú ọ dị, njikọ “na-amụnye ... tinye ya” anaghị egosipụta nke ọma na omume ịmụnye eburula ụzọ mee (ἅψας) tupu itinye ya.'
  naturalness: Ahịrịokwu ahụ chọrọ mmezi obere ka ngwaa ya kwekọọ n’Igbo eke. “Mgbe ọ mụnyesịrị oriọna, ọ na-etinye ya” na-egosi nke ọma usoro omume ahụ ma na-adịkwa mma n’Igbo Standard.
  terminology: “Oriọna,” “ebe zoro ezo,” “nkata,” na “ihe ndọba oriọna” dabara n’ọnọdụ a. “Ìhè ahụ” na-asụgharị τὸ φέγγος n’enweghị itinye nnọchiaha “ya” nke na-adịghị n’asụsụ Grik.
  issues:
