revisions:
- from: Ọ dịghị onye na-amụnye oriọna, tinye ya n’ebe zoro ezo[a] ma ọ bụ n’okpuru nkata[b]. Kama, ọ na-edowe ya n’elu ihe ndọba oriọna, ka ndị na-abata wee hụ ìhè ya.
  to: Ọ dịghị onye, mgbe ọ mụnyesịrị oriọna, na-etinye ya n’ebe zoro ezo[a] ma ọ bụ n’okpuru nkata[b]; kama, ọ na-etinye ya n’elu ihe ndọba oriọna, ka ndị na-abata wee hụ ìhè ahụ.
  rationale: E megharịrị usoro ngwaa iji gosipụta na a mụnyela oriọna tupu e tinye ya, dịka participle Grik ἅψας si dị. E dochiri “ìhè ya” anya na “ìhè ahụ” ka ọ soro okwu Grik ahụ nso. A hazikwara okwu ala peeji mbụ ntakịrị ka “ụlọ okpuru ala” bụrụ Igbo Standard eke karịa.
