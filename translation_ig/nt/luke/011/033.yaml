id: LUK.11.33
reference: Luke 11:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: ig
  text: Ọ dịghị onye, mgbe ọ mụnyesịrị oriọna, na-etinye ya n’ebe zoro ezo[a] ma ọ bụ n’okpuru nkata[b]; kama, ọ na-etinye ya n’elu ihe ndọba oriọna, ka ndị na-abata wee hụ ìhè ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “n’ụlọ dị n’okpuru ala” ma ọ bụ “n’ebe nzuzo.” Okwu Grik κρύπτη nwere ike ịpụta ebe zoro ezo, gụnyere ebe nkwakọba ihe dị n’okpuru ala.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik μόδιος bụ arịa e ji atụ ihe akọrọ; n’ọdịnala, a na-asụgharị ya “nkata e ji atụ ihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Ọ dịghị onye
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi kwuo nkwụsi ike zuru ụwa ọnụ nke nnọchiaha Grik a.
- source_word: λύχνον
  choice: oriọna
  rationale: Ọ na-ezo aka n’oriọna mmanụ a na-ebuga ebuga, ọ bụghị kandụl kpọmkwem.
- source_word: ἅψας
  choice: na-amụnye
  rationale: N’usoro okwu Igbo a, omume ịmụnye oriọna na-ebute itinye ya ebe; ihe nke a pụtara ka doro anya n’agbanyeghị na e ji usoro ngwaa Igbo eke ya.
- source_word: εἰς κρύπτην
  choice: n’ebe zoro ezo
  rationale: Ọ na-echekwa isi echiche nke izochi oriọna n’akọwaghị kpọmkwem ụdị ụlọ ma ọ bụ ebe ahụ.
- source_word: τίθησιν
  choice: tinye ya / na-edowe ya
  rationale: Ngwaa ndị a bụ okwu Igbo nkịtị maka idọba ihe n’otu ebe; mgbanwe ntakịrị a na-eme ka ahịrịokwu ahụ daa nke ọma.
- source_word: ὑπὸ τὸν μόδιον
  choice: n’okpuru nkata
  rationale: Nkata na-enye onye na-agụ ugbu a onyonyo doro anya nke ihe e ji kpuchie oriọna; nkọwa ala peeji na-echekwa ọrụ ya dị ka ihe e ji atụ ihe.
- source_word: ἐπὶ τὴν λυχνίαν
  choice: n’elu ihe ndọba oriọna
  rationale: Nke a na-akọwa kpọmkwem ihe a na-adọba oriọna n’elu ya n’Igbo dị mfe ma bụrụkwa ihe kwesịrị nsọpụrụ.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosipụta nzube nke ọma n’Igbo.
- source_word: οἱ εἰσπορευόμενοι
  choice: ndị na-abata
  rationale: Ọ na-echekwa echiche nke ndị na-abanye n’ebe ahụ n’ụzọ dị mkpirikpi ma bụrụkwa Igbo eke.
- source_word: τὸ φέγγος
  choice: ìhè ya
  rationale: “Ìhè” bụ okwu Igbo kacha eke n’onyonyo oriọna a; “ya” na-eme ka njikọ ya na oriọna doo anya.
- source_word: βλέπωσιν
  choice: wee hụ
  rationale: Mgbe ọ gbasoro “ka,” ọ na-egosipụta nzube e bu n’obi dịka subjunctive Grik ahụ si eme.
theological_decisions:
- issue: Ihe κρύπτη pụtara
  choice: ebe zoro ezo n’ozuzu ya
  alternative: ụlọ okpuru ala ma ọ bụ ụlọ nkwakọba ihe
  rationale: Isi ilu ahụ bụ na mmadụ anaghị ezobe ìhè; nsụgharị sara mbara na-echekwa okwu ahụ n’emeghị ka otu ụdị ụlọ bụrụ naanị ihe o nwere ike ịpụta.
- issue: Otú e si sụgharịa μόδιος
  choice: nkata n’ahịrịokwu bụ isi, tinyere nkọwa banyere ihe e ji atụ ihe
  alternative: ihe e ji atụ ọka ma ọ bụ nkata e ji atụ ihe
  rationale: Nke a na-eme ka onyonyo ahụ dị mfe nghọta, ma nkọwa ala peeji na-echekwa ọdịdị na ọrụ ihe Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee nsọpụrụ mee ihe. E tinyere akara [a] n’ebe “ebe zoro ezo” dị na [b] n’ebe “nkata” dị ka nkọwa ha si kwekọọ, kama iso ọnọdụ akara ndị na-ekwekọghị na English consultation layer.
