    issue: Usoro ngwaa “Ọ dịghị onye na-amụnye oriọna, tinye ya ...” adịghị eke nke ọma.
    rationale: ἅψας bụ participle aorist nke na-egosi na ịmụnye oriọna emeela tupu omume bụ isi, τίθησιν, ya bụ itinye ya. A ghaghị ime ka mmekọrịta a pụta ìhè n’Igbo.
  - severity: low
    issue: “Ìhè ya” na-agbakwunye njikọ nnọchiaha nke ederede Grik ekwughị kpọmkwem.
    rationale: τὸ φέγγος bụ “ìhè ahụ.” Ọ bụ ezie na “ìhè ya” anaghị agbanwe echiche n’ụzọ dị ukwuu, “ìhè ahụ” na-adị nso karịa na okwu mbụ.
