id: LUK.11.13
reference: Luke 11:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na unu, ebe unu bụ ndị ọjọọ, maara otú e si enye ụmụ unu ezi onyinye, olee otú Nna nke si n’eluigwe ga-aka nke ukwuu inye ndị na-arịọ ya Mmụọ Nsọ!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: ebe unu bụ ndị ọjọọ
  rationale: Nke a na-edobe nkọwa ọnọdụ omume mmadụ dị na participle Grik, ma na-ada ka Igbo nkịtị n'ime ahịrịokwu nwere ọnọdụ.
- source_word: οἴδατε ... διδόναι
  choice: maara otú e si enye
  rationale: Ngwakọta ngwaa a na-egosi ịma otú e si eme ihe, ọ bụghị naanị inwe ihe ọmụma n'uche.
- source_word: δόματα ἀγαθὰ
  choice: ezi onyinye
  rationale: ‘Onyinye’ na-edobe kpọmkwem echiche δόματα dị ka ihe a na-enye, karịa okwu sara mbara dịka ‘ezi ihe.’
- source_word: τέκνοις ὑμῶν
  choice: ụmụ unu
  rationale: Nke a bụ okwu Igbo dị mfe ma kwekọọ n'ọnọdụ ezinụlọ.
- source_word: πόσῳ μᾶλλον
  choice: karịa nke ukwuu
  rationale: Ọ na-egosipụta arụmụka sitere n'ihe nta gaa n'ihe ka ukwuu n'ụzọ doro anya n'Igbo.
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: Nna ahụ nke si n'eluigwe
  rationale: Nke a na-echekwa ἐξ, ‘si,’ ma ghara itinye ‘unu’ nke na-adịghị n'ihe odide Grik ma ọ bụ mee ka ya na Matiu 7:11 yie.
- source_word: πνεῦμα ἅγιον
  choice: Mmụọ Nsọ
  rationale: N'ọnọdụ Luk a, okwu ahụ na-ezo aka na Mmụọ Chineke; ụdị aha a bụkwa nke doro ndị na-agụ Igbo anya.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: ndị na-arịọ ya
  rationale: Nke a na-edobe participle ugbu a dị ka otu ndị na-arịọ, ma na-echekwa nnọchiaha αὐτόν, ‘ya.’
theological_decisions:
- issue: Onye πνεῦμα ἅγιον na-ezo aka na ya
  choice: Mmụọ Nsọ, ya bụ Mmụọ Chineke
  alternative: mmụọ dị nsọ n'ozuzu
  rationale: Ọ bụ ezie na enweghị article n'okwu Grik ahụ, ọnọdụ a n'akwụkwọ Luk na-egosi na onyinye Nna na-enye bụ Mmụọ Chineke.
- issue: Mmekọrịta ya na Matiu 7:11
  choice: 'Idobe okwu Luk pụrụ iche: ‘Nna ahụ nke si n''eluigwe’ na ‘Mmụọ Nsọ’'
  alternative: Ime ka ọ bụrụ ‘Nna unu nke eluigwe’ ma ọ bụ ‘ezi ihe’ dịka Matiu
  rationale: A ghaghị ịsụgharị ihe odide Luk n'onwe ya, ghara ime ka ọ kwekọọ n'okwu Matiu ma tufuo ọdịiche dị n'etiti Oziọma abụọ ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji ‘unu’ gosipụta plural ὑμεῖς; e jighị nkọwa ụka pụrụ iche. Enweghị akara nkọwa ụkwụ n'ahịrịokwu n'ihi na nkọwa Bekee [a] na [b] adabaghị kpọmkwem n'ebe akara ha dị, ebe nsụgharị Igbo a edobelarị ọdịiche Luk n'ụzọ doro anya.
