id: LUK.11.42
reference: Luke 11:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: ig
  text: Ma ahụhụ dịrị unu ndị Farisii! N’ihi na unu na-enye otu ụzọ n’ụzọ iri nke mint, na rue, na ụdị akwụkwọ nri niile, ma unu na-agabiga ikpe ziri ezi na ịhụnanya Chineke. Ihe ndị a ka unu kwesịrị ime, n’elegharaghịkwa ihe ndị ọzọ anya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: ahụhụ dịrị unu
  rationale: Na-ebute mkpu amụma nke ịdọ aka ná ntị na ikpe, n’asụsụ Igbo dị ùgwù ma doo anya.
- source_word: ἀποδεκατοῦτε
  choice: unu na-enye otu ụzọ n’ụzọ iri
  rationale: Na-akọwa omume inye tithe n'ụzọ ndị na-agụ Igbo taa ga-aghọta ozugbo.
- source_word: ἡδύοσμον
  choice: mint
  rationale: Aha osisi a abụghị nke nwere aha Igbo Standard a ma ama; ide aha a nabatara n’asụsụ mba ọzọ na-ezere ịkọwa ya n'ụzọ na-ezighị ezi.
- source_word: πήγανον
  choice: rue
  rationale: E debere aha osisi ahụ dịka aha a na-amata, ebe ọ bụ na enweghị aha Igbo Standard doro anya nke ga-ekwekọ kpọmkwem.
- source_word: πᾶν λάχανον
  choice: ụdị akwụkwọ nri niile
  rationale: λάχανον n’ebe a na-ezo aka n’osisi ma ọ bụ akwụkwọ nri a na-akọ; ‘ụdị ... niile’ na-egosipụta πᾶν n’ụzọ ebumpụta ụwa.
- source_word: παρέρχεσθε
  choice: unu na-agabiga
  rationale: Na-edobe onyonyo nke ‘ịgafe n’akụkụ/ịhapụ gafee’ kama ịtụgharị ya naanị ka ‘ileghara anya,’ dịka isi mmalite na consultation layer si kwado.
- source_word: κρίσιν
  choice: ikpe ziri ezi
  rationale: N’okwu omume a, κρίσις na-egosi ikpe ziri ezi/justice, ọ bụghị naanị ikpe ụlọikpe.
- source_word: ἀγάπην τοῦ θεοῦ
  choice: ịhụnanya Chineke
  rationale: Na-edobe njikọ genitive nke Grik n’enweghị ikpebi ma ọ bụ ịhụ Chineke n’anya, ịhụnanya sitere n’aka Chineke, ma ọ bụ ịhụnanya nke Chineke.
- source_word: μὴ παρεῖναι
  choice: n’elegharaghịkwa ... anya
  rationale: N’ahịrị ikpeazụ, okwu a pụtara ịghara ịhapụ ma ọ bụ ileghara ihe ahụ anya; ntụgharị a bụ Igbo dị mfe ma kwesị ntụkwasị obi.
theological_decisions:
- issue: Njikọ dị na ‘ịhụnanya Chineke’ (ἀγάπη τοῦ θεοῦ)
  choice: E debere ya dịka ‘ịhụnanya Chineke.’
  alternative: ‘ịhụ Chineke n’anya’ ma ọ bụ ‘ịhụnanya Chineke nwere n’ebe mmadụ nọ’
  rationale: Genitive Grik nwere ike ibu karịa otu nghọta; ederede anaghị amanye ka a họrọ naanị otu.
- issue: Mmekọrịta dị n’etiti ikpe ziri ezi, ịhụnanya, na inye otu ụzọ n’ụzọ iri
  choice: Jizọs kwuru na ha kwesịrị ime ihe ndị mbụ ma ghara ileghara ndị ọzọ anya.
  alternative: Ịkọwa amaokwu ahụ dịka ịkagbu inye otu ụzọ n’ụzọ iri
  rationale: ταῦτα ... κἀκεῖνα na-akwado ime otu ìgwè ọrụ n’elegharaghị nke ọzọ anya; a naghị etinye nkwenkwe ụka ọzọ n’elu okwu ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ mee ka okwu a na-agwa ọtụtụ ndị pụta ìhè. A hapụrụ aha osisi ‘mint’ na ‘rue’ n’ụdị a na-amata n’ihi enweghị aha Igbo Standard doro anya.
