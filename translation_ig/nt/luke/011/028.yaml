  source_fidelity: 'The rendering faithfully reflects the Greek: “Ma ọ sịrị” appropriately carries αὐτὸς δὲ εἶπεν; “Ee, kama” preserves the affirming yet redirecting force of Μενοῦν; “ndị na-anụ okwu Chineke ma na-edebe ya” accurately represents the two coordinated present participles and their shared object. The statement of blessedness is retained without adding a doctrinal resolution to Jesus’ response.'
