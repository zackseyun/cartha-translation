  terminology: “Okwu Chineke” is an established and appropriately broad rendering of τὸν λόγον τοῦ θεοῦ. “Ndị a gọziri agọzi” suitably maintains the religious and covenantal register of μακάριοι. The footnote responsibly identifies the semantic range of Μενοῦν and does not force either a total rejection or a mere additive reading.
