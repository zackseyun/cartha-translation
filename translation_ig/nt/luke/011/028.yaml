id: LUK.11.28
reference: Luke 11:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: ig
  text: Ma ọ sịrị, “Ee, kama[a], ndị na-anụ okwu Chineke ma na-edebe ya bụ ndị a gọziri agọzi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ezie, ndị a gọziri agọzi bụ …” ma ọ bụ “Ee, kama nke ka mkpa, ndị a gọziri agọzi bụ …” Okwu Grik ahụ nwere ike ịkwado ihe e kwuru ma n’otu oge ahụ tụgharịa ihe a na-emesi ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: Ee, kama
  rationale: Nkebiokwu a na-akwado ihe e kwuru ma na-atụgharị isi ihe a na-emesi ike. “Ee, kama” na-echekwa ma nkwenye ahụ ma ntụgharị uche ahụ, n’emeghị ka okwu Jizọs daa ka ọ na-ajụ okwu nwanyị ahụ kpamkpam.
- source_word: μακάριοι
  choice: ndị a gọziri agọzi
  rationale: Nke a na-echekwa ịdị arọ nke okwu ngọzi n’okwu Jizọs, kama ịkọwa ya naanị dị ka obi ụtọ ma ọ bụ inwe chi ọma.
- source_word: οἱ ἀκούοντες
  choice: ndị na-anụ
  rationale: Ọ bụ okwu Igbo doro anya ma dịkwa eke maka ìgwè ndị e ji ịnụ okwu ahụ mara; usoro ngwaa ugbu a na-egosikwa omume na-aga n’ihu.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụ nke a na-aghọta nke ọma isi kọwaa ozi ma ọ bụ mkpughe sitere n’aka Chineke, n’emechighị obosara λόγος.
- source_word: φυλάσσοντες
  choice: na-edebe ya
  rationale: “Na-edebe” nwere ike ịgụnye ichekwa okwu ahụ, ịrapara na ya, na ime ya; ya mere ọ naghị eme ka ihe okwu Grik pụtara bụrụ naanị irube isi n’iwu.
- source_word: αὐτὸς δὲ εἶπεν
  choice: Ma ọ sịrị
  rationale: “Ma” na-egosipụta obere ọdịiche na okwu gara aga, ebe “ọ sịrị” na-anọ nso na εἶπεν n’enweghị nkọwa agbakwunyere.
theological_decisions:
- issue: Ike nzaghachi Jizọs nye ngọzi nwanyị ahụ kwuru
  choice: Jizọs kwetara ma tụgharịa isi ihe ahụ gaa n’ezi ngọzi nke ịnụ okwu Chineke na idebe ya.
  alternative: Ịsụgharị ya dị ka ịjụ okwu nwanyị ahụ kpamkpam, ma ọ bụ dị ka ịgbakwunye ngọzi ọzọ n’enweghị mmezi ọ bụla.
  rationale: Μενοῦν nwere ike ịkwado okwu gara aga ma n’otu oge ahụ mezie ma ọ bụ bulie isi ihe ọzọ elu. “Ee, kama” na-echekwa esemokwu a n’enweghị ikwu na Jizọs jụrụ ngọzi nne ya ma ọ bụ na o mere naanị mgbakwunye.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “ndị … bụ ndị a gọziri agọzi” na-eme ka ụdị nkwupụta ngọzi ahụ pụta ìhè, ebe “na-anụ … ma na-edebe” na-echekwa myirịta nke participle abụọ dị na Grik.
