  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ig
  text: Ma ọ bụrụ na m ji Beelzebul achụpụ ndị mmụọ ọjọọ, ọ̀ bụ site n’aka onye ka ụmụ unu ji achụpụ ha?[a] N’ihi nke a, ha onwe ha ga-abụ ndị ikpe unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ̀ bụ site n’ihe dị aṅaa?” ma ọ bụ “ọ̀ bụ site n’ike dị aṅaa ka ụmụ unu ji achụpụ ha?”
    reason: lexical_alternative
  - marker: b
    text: 'Nnọchiaha Grik αὐτοί nwere nkwusiri ike; ya mere, “ha onwe ha.” A pụkwara ịsị ya n’enweghị nkwusiri ike ahụ: “ha ga-abụ ndị ikpe unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: “Ma” na-egosi ntakịrị mmegide dị na δέ ma na-aga n’ihu n’arụmụka Jizọs.
- source_word: ἐγὼ
  choice: m
  rationale: Nnọchiaha ahụ pụtara ìhè n’asụsụ Grik; usoro Igbo “ọ bụrụ na m...” na-edobe onye Jizọs na-ekwu maka ya n’ụzọ doro anya.
- source_word: ἐν Βεελζεβοὺλ
  choice: ji Beelzebul
  rationale: N’ebe a ἐν na-egosi onye e ji mee ihe ma ọ bụ ike e ji arụ ọrụ. “Ji” bụ ụzọ Igbo dị nkenke ma dị mma isi gosi nke a n’etinyeghị okwu nkọwa “ike nke” na-adịghị n’ederede Grik.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: achụpụ ndị mmụọ ọjọọ
  rationale: “Ịchụpụ” na-enye echiche ἐκβάλλω n’ihe gbasara ịchụ mmụọ ọjọọ, ebe “ndị mmụọ ọjọọ” na-akọwa τὰ δαιμόνια dị ka mmụọ nwere onwe ha, ọ bụghị naanị mmetụta ọjọọ.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: ụmụ unu
  rationale: A hapụrụ okwu ahụ n’ụdị nkịtị ya kama ịkọwa ya ozugbo dị ka “ndị na-eso unu” ma ọ bụ “ndị na-eso ụzọ unu,” ka nghọta nwere ike ịdị iche ghara imechi.
- source_word: ἐν τίνι
  choice: site n’aka onye
  rationale: Ajụjụ a na-ajụ onye bụ isi iyi ma ọ bụ onye e ji achụpụ ha. “Site n’aka onye” na-edobe ntụaka onwe-onye nke kwekọrọ na ntụnyere Beelzebul, ebe ndetu na-echekwa nghọta ndị ọzọ nwere ike ịdị.
- source_word: ἐκβάλλουσιν
  choice: ji achụpụ ha
  rationale: E jigharịrị “achụpụ” iji kwekọọ na ἐκβάλλω dị na nkebi mbụ; “ha” na-ezo aka n’ụzọ ebumpụta ụwa n’ebe ndị mmụọ ọjọọ nọ.
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Nkebi a na-egosi ihe mmechi sitere n’ajụjụ Jizọs jụrụ.
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: ọ bụ ha onwe ha ga-abụ ndị ikpe unu
  rationale: “Ha onwe ha” na-ebupụta nkwusiri ike dị na αὐτοί; “ndị ikpe unu” na-edobe predicate ahụ n’enweghị mgbakwunye nkọwa.
theological_decisions:
- issue: Ndị bụ “ụmụ unu”
  choice: E debere “ụmụ unu” n’ederede bụ isi.
  alternative: “Ndị na-eso unu,” “ndị na-eso ụzọ unu,” ma ọ bụ “ndị Juu ibe unu.”
  rationale: Ọ bụ ezie na okwu ahụ nwere ike izo aka n’ebe ndị na-achụ mmụọ ọjọọ nọ bụ ndị ha na ndị Jizọs na-agwa nwere mmekọrịta, Grik kwuru kpọmkwem “ụmụ unu.” Ịhapụ ya otu a na-echekwa nghọta na esemokwu dị n’ederede kama ikpebi onye ha bụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “ịchụpụ ndị mmụọ ọjọọ” dịka okwu doro anya n’ihe gbasara ịchụ mmụọ; e dekwara aha Beelzebul dịka ntụgharị mkpụrụokwu aha Grik.
