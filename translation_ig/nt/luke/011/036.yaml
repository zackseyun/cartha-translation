review_pass:
  verdict: revise
  source_fidelity: The draft preserves the conditional structure, the repeated totality of ‘whole,’ the body/light imagery, the absence of a dark part, and the lamp comparison. A small recasting of the opening places ‘body’ directly as the subject of ‘full of light,’ more closely reflecting τὸ σῶμά σου ὅλον φωτεινόν.
  naturalness: The revised wording is fluent, modern Standard Igbo. ‘Ahụ gị dum jupụtara n’ìhè’ is clearer and more idiomatic than beginning with ‘ìhè jupụtara n’ahụ gị dum.’
  terminology: '‘ahụ,’ ‘ìhè,’ ‘ọchịchịrị,’ and ‘oriọna’ appropriately preserve the source imagery without doctrinal paraphrase. The footnote requires correction: ‘amụma ọkụ’ means ‘prophecy of fire,’ not ‘flash’ or ‘lightning.’ ‘Mgbukepụ’ supplies the intended lexical alternative.'
  issues:
  - severity: medium
    issue: The footnote uses ‘amụma ọkụ’ as an alternative for ἀστραπή.
    rationale: In Standard Igbo, ‘amụma’ means prophecy, so ‘amụma ọkụ’ does not convey a flash or lightning and misstates the lexical alternative. Replace it with ‘mgbukepụ’ (flash) while retaining ‘nchapụta’ (brightness/shining).
  - severity: low
    issue: The initial clause foregrounds ‘light’ rather than making ‘your whole body’ the explicitly described entity.
    rationale: The current wording is understandable, but ‘ọ bụrụ na ahụ gị dum jupụtara n’ìhè’ follows the Greek predication more directly and reads more naturally in Igbo.
  revised_text: Ya mere, ọ bụrụ na ahụ gị dum jupụtara n’ìhè, ma ọ nweghị akụkụ ọ bụla gbara ọchịchịrị, ahụ gị dum ga-ejupụta n’ìhè, dịka mgbe oriọna ji nchapụta ya enye gị ìhè.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘dịka mgbe oriọna ji mgbukepụ ya enye gị ìhè.’ Okwu Grik ahụ nwere ike ịpụta mgbukepụ ma ọ bụ nchapụta; n’ebe a, o yikarịrị ka ọ na-ezo aka n’ìhè oriọna na-enwu, ọ bụghị àmụ̀mà nkịtị.
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s bodily/light metaphor, conditional logic, and lexical ambiguity around ἀστραπή. It improves the directness of the opening predicate and corrects a substantively erroneous Igbo footnote term, without adding theological interpretation.
