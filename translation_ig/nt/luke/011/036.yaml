- from: Ya mere, ọ bụrụ na ìhè jupụtara n’ahụ gị dum, ọ dịghịkwa akụkụ ya gbara ọchịchịrị, ahụ gị dum ga-ejupụta n’ìhè, dịka mgbe oriọna ji nchapụta ya enye gị ìhè.[a]
  to: Ya mere, ọ bụrụ na ahụ gị dum jupụtara n’ìhè, ma ọ nweghị akụkụ ọ bụla gbara ọchịchịrị, ahụ gị dum ga-ejupụta n’ìhè, dịka mgbe oriọna ji nchapụta ya enye gị ìhè.[a]
  rationale: The revision retains the source’s bodily/light metaphor, conditional logic, and lexical ambiguity around ἀστραπή. It improves the directness of the opening predicate and corrects a substantively erroneous Igbo footnote term, without adding theological interpretation.
