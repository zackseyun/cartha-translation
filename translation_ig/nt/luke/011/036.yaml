id: LUK.11.36
reference: Luke 11:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na ahụ gị dum jupụtara n’ìhè, ma ọ nweghị akụkụ ọ bụla gbara ọchịchịrị, ahụ gị dum ga-ejupụta n’ìhè, dịka mgbe oriọna ji nchapụta ya enye gị ìhè.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘dịka mgbe oriọna ji mgbukepụ ya enye gị ìhè.’ Okwu Grik ahụ nwere ike ịpụta mgbukepụ ma ọ bụ nchapụta; n’ebe a, o yikarịrị ka ọ na-ezo aka n’ìhè oriọna na-enwu, ọ bụghị àmụ̀mà nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: ahụ
  rationale: Nke a bụ okwu nkịtị maka ‘ahụ’; idowe ya na-echekwa ihe atụ Jizọs ji ahụ, anya, na ìhè mee, kama ịkọwa ya ozugbo dịka ọnọdụ ime mmụọ.
- source_word: ὅλον
  choice: dum
  rationale: ‘Dum’ na-egosipụta echiche nke ihe niile, ma na-arụ ọrụ nke ọma n’ebe okwu a pụtara ugboro abụọ.
- source_word: φωτεινόν
  choice: ìhè jupụtara na ya / ga-ejupụta n’ìhè
  rationale: Nkebi okwu a bụ Igbo eke nke na-egosipụta ịdị n’ìhè n’ụzọ doro anya ma debe ọdịiche ya na akụkụ gbara ọchịchịrị.
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: ọ dịghịkwa akụkụ ya gbara ọchịchịrị
  rationale: Nke a na-echekwa ihe oyiyi doro anya nke akụkụ ọ bụla na-enweghị ọchịchịrị, ma bụrụkwa ahịrịokwu Igbo na-aga were were.
- source_word: ἔσται
  choice: ga-ejupụta
  rationale: A na-egosipụta ọdịnihu nke ἔσται site na ‘ga-’; tinyere nkọwa ìhè, ọ na-eme ka okwu ahụ bụrụ Igbo eke.
- source_word: ὡς ὅταν
  choice: dịka mgbe
  rationale: Nke a na-echekwa njikọ ntụnyere na oge dị n’asụsụ Grik.
- source_word: λύχνος
  choice: oriọna
  rationale: Okwu a na-ezo aka n’oriọna a na-amụnye, ọ bụghị ìhè dịka echiche nkịtị ma ọ bụ ebe a na-adọba oriọna.
- source_word: τῇ ἀστραπῇ
  choice: ji nchapụta ya
  rationale: ἀστραπή nwere ike ịbụ amụma ọkụ ma ọ bụ nchapụta; ebe oriọna bụ isiokwu ebe a, ‘nchapụta ya’ na-enye nghọta kacha kwekọọ n’ọnọdụ ahụ n’enweghị iwepụ ụzọ ọzọ okwu ahụ pụrụ isi pụta.
- source_word: φωτίζῃ σε
  choice: enye gị ìhè
  rationale: Nke a na-egosipụta omume inye mmadụ ìhè ma debe ‘gị’ dịka onye ihe ahụ metụtara.
theological_decisions:
- issue: Ihe atụ nke ‘ahụ’ na ‘ìhè’ n’okwu Jizọs
  choice: Idowe ihe oyiyi ahụ, akụkụ, ọchịchịrị, oriọna, na ìhè dịka ha dị.
  alternative: Ịsụgharị ‘ahụ’ dịka mmadụ dum, ndụ ime, ma ọ bụ ọnọdụ ime mmụọ.
  rationale: Ọnọdụ okwu ahụ jikọtara ya na anya dịka oriọna nke ahụ. Ịkọwa ihe atụ ahụ dịka nkwupụta kpọmkwem banyere mkpụrụ obi ma ọ bụ omume ọma ga-emechi nghọta okwu ahụ karịa ka isi mmalite si mee.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E debere usoro ihe atụ ahụ n’enweghị ịgbakwunye nkọwa ụka pụrụ iche. E tinyere ‘Ya mere’ maka οὖν, ma jiri ‘ọ bụrụ na’ debe ọnọdụ εἰ.
