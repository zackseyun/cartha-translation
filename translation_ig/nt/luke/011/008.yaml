id: LUK.11.8
reference: Luke 11:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: ig
  text: Ana m agwa unu, ọ bụrụgodị na ọ gaghị ebili nye ya ihe ọ bụla n’ihi na ọ bụ enyi ya, ma n’ihi nnọgidesi ike ya n’enweghị ihere[a], ọ ga-ebili nye ya ihe niile dị ya mkpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ihi obi ike ya,” “n’ihi akparamàgwà na-enweghị ihere ya,” ma ọ bụ, n’ụzọ dabara nnọọ n’okwu mbụ, “n’ihi enweghị ihere ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo nkịtị ma kwụ ọtọ e si webata okwu Jizọs ma chekwaa ịgwa ọtụtụ mmadụ okwu.
- source_word: εἰ καὶ οὐ δώσει αὐτῷ
  choice: ọ bụrụgodị na ọ gaghị ... nye ya
  rationale: “Ọ bụrụgodị” na-echekwa ọdịdị nkwenye nwere ọnọdụ nke εἰ καί, kama ime ya ka ọ bụrụ nkwupụta doro anya kpamkpam.
- source_word: ἀναστὰς
  choice: ebili
  rationale: N’ọnọdụ ụlọ n’abalị a, okwu ahụ pụtara isi n’ihe ndina bilie; “ebili” bụ okwu Igbo dị mfe ma dabara adaba.
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: n’ihi na ọ bụ enyi ya
  rationale: Ntụgharị a na-echekwa mmekọrịta onwe onye nke φίλον αὐτοῦ kama ịgbanwe ya ka ọ bụrụ naanị echiche izugbe banyere ọbụbụenyi.
- source_word: διά γε
  choice: ma n’ihi
  rationale: “Ma” na-egosi mgbanwe siri ike site n’ihe ọbụbụenyi na-emeghị gaa n’ihe kpaliri ya ime ihe.
- source_word: ἀναίδειαν
  choice: nnọgidesi ike ya nke ihere na-adịghị eme ya
  rationale: ἀναίδεια nwere isi echiche nke enweghị ihere ma ọ bụ enweghị mgbachi n’ihu ihe ndị mmadụ na-ele anya dị ka ihe kwesịrị ekwesị. Okwu a na-ejikọta isi lexical ahụ na nnọgidesi ike nke ọnọdụ a na-egosi, n’enweghị ime ka ọ bụrụ naanị omume ọma.
- source_word: ἐγερθεὶς
  choice: ọ ga-ebili
  rationale: Ọ bụ ezie na ngwaa Grik a dị iche na ἀνίστημι, n’ọnọdụ a ha abụọ na-ezo aka n’isi n’ihe ndina bilie.
- source_word: δώσει αὐτῷ
  choice: nye ya
  rationale: Nke a bụ nhazi okwu Igbo e ji egosi onye a na-enye ihe n'ụzọ eke.
- source_word: ὅσων χρῄζει
  choice: ihe niile ọ chọrọ
  rationale: Nke a na-egosi oke ihe ndị dị ya mkpa n’ụzọ Igbo doro anya ma na-aga were were.
- source_word: implied object after first δώσει
  choice: ihe
  rationale: E tinyere “ihe” ka ahịrịokwu Igbo zuo oke; ihe a na-enye pụtara ìhè site n’ọnọdụ na site n’ụzọ e si mechie amaokwu ahụ.
theological_decisions:
- issue: Ihe ἀναίδεια pụtara n’ilu a
  choice: Nnọgidesi ike nke ihere na-adịghị eme onye na-arịọ arịrịọ
  alternative: obi ike; enweghị nsọpụrụ; enweghị ihere
  rationale: A hapụrụ ọnụ ọnụ okwu ahụ dị n’etiti “enweghị ihere” na nnọgidesi ike n’ịchọ ihe. Ntụgharị ahụ anaghị ekwu na omume rụrụ arụ bụ ihe a na-eto, ma ọ naghịkwa ehichapụ nkọcha dị n’okwu Grik ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ọ bụrụgodị” chekwaa ụdị ọnọdụ nwere nkwenye; e jighị nkọwa okpukpe pụrụ iche mechie nghọta ἀναίδεια.
