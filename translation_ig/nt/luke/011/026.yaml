- from: Mgbe ahụ, ọ na-aga, kpọrọkwa mmụọ asaa ndị ọzọ dị njọ karịa ya[a][b] ka ha soro ya. Ha abata, biri n’ebe ahụ; ọnọdụ nwoke ahụ n’ikpeazụ wee dị njọ karịa ka ọ dị na mbụ[c].
  to: Mgbe ahụ, ọ na-aga, na-akpọrọkwa mmụọ[a][b] asaa ndị ọzọ dị njọ karịa ya ka ha soro ya. Ha abata, biri n’ebe ahụ; ọnọdụ nwoke ahụ n’ikpeazụ wee dị njọ karịa ka ọ dị na mbụ[c].
