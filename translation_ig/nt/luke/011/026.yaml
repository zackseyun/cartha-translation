id: LUK.11.26
reference: Luke 11:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: ig
  text: Mgbe ahụ, ọ na-aga, na-akpọrọkwa mmụọ[a][b] asaa ndị ọzọ dị njọ karịa ya ka ha soro ya. Ha abata, biri n’ebe ahụ; ọnọdụ nwoke ahụ n’ikpeazụ wee dị njọ karịa ka ọ dị na mbụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “dị ajọ omume karịa ya.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ “mmụọ”; o kwughị kpọmkwem “ndị mmụọ ọjọọ” ma ọ bụ “ndị mmụọ na-adịghị ọcha” n’amaokwu a, ọ bụ ezie na ihe gbara ya gburugburu na-egosi na ha bụ mmụọ iro.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “Ọnọdụ ikpeazụ nke nwoke ahụ wee dị njọ karịa nke mbụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe na-esote n’usoro akụkọ ahụ n’Igbo doro anya.
- source_word: πορεύεται καὶ παραλαμβάνει
  choice: ọ na-aga, kpọrọkwa ... ka ha soro ya
  rationale: Nke a na-egosipụta ma ịga ya ma ịkpọrọ ndị ọzọ soro ya, bụ́ isi echiche nke παραλαμβάνει.
- source_word: ἕτερα πνεύματα
  choice: mmụọ ... ndị ọzọ
  rationale: E debere naanị ‘mmụọ’ dị ka Grik si kwuo, tinyeghị ‘ndị mmụọ ọjọọ’ ma ọ bụ ‘ndị mmụọ na-adịghị ọcha’ n’amaokwu a.
- source_word: πονηρότερα ἑαυτοῦ ἑπτά
  choice: asaa ... dị njọ karịa ya
  rationale: E chekwara ọnụọgụ asaa na ntụnyere nke na-ekwu na mmụọ ndị ahụ dị njọ karịa mmụọ ahụ lọghachiri.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Ha abata, biri n’ebe ahụ
  rationale: Ụdị a na-agụ nke ọma n’Igbo ma na-egosi na mbata ha bu ụzọ tupu ibi ha n’ebe ahụ.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: ọnọdụ nwoke ahụ n’ikpeazụ
  rationale: Nke a bụ ụzọ Igbo nke oge a si akọwa ọnọdụ ikpeazụ mmadụ n’enweghị ịgbakwunye nkọwa okpukpe.
- source_word: χείρονα τῶν πρώτων
  choice: dị njọ karịa ka ọ dị na mbụ
  rationale: Na-echekwa ntụnyere doro anya dị n’etiti ọnọdụ ikpeazụ na ọnọdụ mbụ.
theological_decisions:
- issue: Ma a ga-akpọ πνεύματα ‘ndị mmụọ ọjọọ’ ma ọ bụ ‘ndị mmụọ na-adịghị ọcha’
  choice: mmụọ
  alternative: ndị mmụọ ọjọọ; ndị mmụọ na-adịghị ọcha
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi na ha bụ mmụọ iro, amaokwu a n’onwe ya kwuru naanị ‘mmụọ’; ya mere, e tinyeghị okwu na-anọghị na Grik.
- issue: Nsụgharị ἀνθρώπου
  choice: nwoke ahụ
  alternative: onye ahụ
  rationale: Ihe atụ ahụ na-ekwu banyere otu nwoke a kpọtụrụ aha, ya mere ‘nwoke ahụ’ na-edobe nkọwa nwoke dị n’okwu Grik.
- issue: Ndakọrịta ọnụ ọgụgụ n’etiti εἰσελθόντα na κατοικεῖ
  choice: Ha abata, biri
  alternative: Mgbe ha batara, ọ biri n’ebe ahụ
  rationale: εἰσελθόντα bụ ọtụtụ, ebe κατοικεῖ dị n’otu; a họọrọ ọtụtụ n’Igbo n’ihi na ọ na-agbaso ‘mmụọ asaa ndị ọzọ’ ma na-enye nghọta ebumpụta ụwa, n’enweghị ikpebi karịa ihe ndị gbara ya gburugburu na-enye ohere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dị mfe nghọta. A họọrọ ahịrịokwu na-asọ nke ọma n’okwu ọnụ, ma e debere ntụnyere, usoro ihe omume, na nkọwa ‘mmụọ’ n’enweghị itinye okwu ụka pụrụ iche.
