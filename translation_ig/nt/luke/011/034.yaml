id: LUK.11.34
reference: Luke 11:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: ig
  text: Oriọna nke ahụ gị bụ anya gị. Mgbe anya gị dị mma[a], ahụ gị dum na-ejupụtakwa n’ìhè; ma mgbe anya gị dị njọ[b], ahụ gị na-adịkwa ọchịchịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ọcha,” “zuru oke,” ma ọ bụ dịka nsụgharị ọdịnala si kwuo, “bụ otu.” Okwu Grik ahụ nwere ike igosi ihe na-enweghị nkewa ma ọ bụ ihe zuru oke; n’ebe a, ọ na-akọwa anya n’ụzọ na-emegide anya “dị njọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọjọọ.” Okwu Grik ahụ nwere ike ịpụta “njọ” ma ọ bụ “ọjọọ”; n’ebe a, o nwere ike ịrụtụ aka ma n’anya na-adịghị arụ ọrụ nke ọma ma n’ụzọ ịhụ ihe nke omume ọjọọ gbagọrọ agbagọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: oriọna
  rationale: Ọ na-ezo aka n’ihe a na-amụnye ọkụ, ọ bụghị ìhè n’onwe ya; “oriọna” na-echekwa ihe atụ ahụ nke ọma.
- source_word: σῶμα
  choice: ahụ
  rationale: Nke a bụ okwu Igbo nkịtị maka ahụ mmadụ, bụ́ nke e ji mee ihe atụ banyere otú mmadụ si ahụ ihe na ọnọdụ ime ya.
- source_word: ὀφθαλμός
  choice: anya
  rationale: A hapụrụ ya dịka akụkụ ahụ nkịtị, n’ihi na ihe atụ ahụ sitere n’anya ruo n’ọhụhụ ime mmụọ na omume.
- source_word: ἁπλοῦς
  choice: dị mma
  rationale: N’ebe a, okwu ahụ na-akọwa anya na-arụ ọrụ nke ọma ma na-emegide anya “dị njọ.” “Dị mma” bụ asụsụ Igbo doro anya ma ghara iwepụ echiche gbasara ịdị ọcha ma ọ bụ enweghị nkewa kpamkpam.
- source_word: φωτεινόν
  choice: na-ejupụta n’ìhè
  rationale: Nke a na-egosipụta ọnọdụ nke ịbụ ihe ìhè juputara na ya, ma na-echekwa ihe oyiyi ìhè ahụ.
- source_word: πονηρός
  choice: dị njọ
  rationale: Okwu Grik ahụ nwere ike ịpụta ihe na-adịghị mma ma ọ bụ ihe ọjọọ n’omume. “Dị njọ” na-ahapụ ma echiche anya na-adịghị arụ ọrụ nke ọma ma echiche ọhụhụ ime nke gbagọrọ agbagọ.
- source_word: σκοτεινόν
  choice: na-agba ọchịchịrị
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa isi kọwaa ihe gbara ọchịchịrị, ma na-edobe mmegide dị n’etiti ìhè na ọchịchịrị.
theological_decisions:
- issue: Ihe ἁπλοῦς pụtara mgbe ọ na-akọwa anya
  choice: dị mma
  alternative: dị ọcha; zuru oke; bụ otu
  rationale: Ihe atụ dị nso na-ekwu banyere anya dịka oriọna nke ahụ na ihe ọ na-eme ka ahụ bụrụ. “Dị mma” na-eme ka onye na-agụ ya ghọta anya na-arụ ọrụ nke ọma, ma ihe odide ala peeji na-echekwa echiche ndị ọzọ nke okwu Grik ahụ kama idozi esemokwu ahụ n’otu ụzọ.
- issue: Ma πονηρός ọ pụtara naanị ntụpọ anụ ahụ ka ọ bụ ihe ọjọọ n’omume
  choice: dị njọ
  alternative: ọjọọ
  rationale: “Dị njọ” dabara n’anya na-adịghị mma ma ka nwekwaa ike ibu echiche omume ọjọọ. Nke a na-echekwa ụbara nghọta nke okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. Ahịrịokwu abụọ ahụ na-edobe ihe atụ oriọna, anya, ahụ, ìhè na ọchịchịrị, yana nhazi yiri ibe ya nke akụkụ abụọ ahụ.
