  edition: SBLGNT
  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: ig
  text: Ndị nzuzu! Ọ̀ bụghị onye mere ihe dị n’èzí ka o mekwara ihe dị n’ime?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “akụkụ mpụta ... akụkụ ime.” N’ọnọdụ okwu a, okwu ndị a pụrụ izo aka n’akụkụ mpụta na akụkụ ime nke arịa ahụ, nakwa, n’ụzọ sara mbara, n’akụkụ ndụ mmadụ a na-ahụ anya na nke ime.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: Ndị nzuzu
  rationale: Ọ bụ okwu nkọ na-akpọ ọtụtụ mmadụ aha ozugbo; nhọrọ a na-edobe ike nke mba ahụ n’Igbo nkịtị ma doo anya.
- source_word: οὐχ ... ἐποίησεν;
  choice: Ọ̀ bụghị ... mere ...?
  rationale: Ajụjụ nwere mkpụrụ okwu nkw否 a na-atụ anya azịza nkwenye; usoro a bụ Igbo ebumpụta ụwa nke na-edobe ike ajụjụ ahụ.
- source_word: ὁ ποιήσας
  choice: onye mere
  rationale: Na-anọchi articular aorist participle n'ụzọ doro anya, n’etinyeghị ‘Chineke’ nke na-adịghị kpọmkwem na Grik.
- source_word: τὸ ἔξωθεν
  choice: ihe dị n’èzí
  rationale: 'Na-edobe obosara okwu ahụ: ọ pụrụ ịpụta akụkụ mpụta nke arịa n’ọnọdụ a nakwa ndụ mmadụ a na-ahụ anya.'
- source_word: τὸ ἔσωθεν
  choice: ihe dị n’ime ya
  rationale: Na-eme ka ntụnyere ya na ihe dị n’èzí doo anya, ma na-ahapụ ma ihe dị n’ime arịa ma ndụ ime mmụọ/mmetụta mmadụ ka ha bụrụ nghọta kwe omume.
- source_word: καὶ
  choice: kwa
  rationale: '‘Kwa’ na-egosipụta echiche nke ‘ọzọkwa/also’: onye mere nke dị n’èzí mere nke dị n’ime ya kwa.'
theological_decisions:
- issue: Onye a na-ekwu maka ya n’okwu ‘onye mere’
  choice: Edebere ya dịka ‘onye mere,’ nke na-enye ohere ịghọta Chineke Onye Okike n’etinyeghị aha ya kpọmkwem.
  alternative: Ịsị ‘Chineke, onye mere’ ma ọ bụ ịkọwa ya naanị dịka onye rụrụ iko/arịa.
  rationale: Grik ekwughị ‘Chineke’ kpọmkwem. Nsụgharị a na-edobe ma onyonyo arịa nke gbara amaokwu ahụ gburugburu ma ntụaka sara mbara banyere Onye Okike, n’ebughị ụzọ kpebie otu naanị.
- issue: Ihe ‘n’èzí’ na ‘n’ime’ na-ezo aka na ya
  choice: Edebere asụsụ nwere ike ịgụnye akụkụ arịa na akụkụ ndụ mmadụ.
  alternative: Ịkọwa okwu ndị ahụ naanị dịka ịdị ọcha mpụta na ịdị ọcha ime mmadụ.
  rationale: Ọnọdụ ozugbo na-ekwu maka iko na efere, ma mba ahụ gbasakwara omume mpụta na ọnọdụ ime mmadụ. E kwesịghị imechi ambiguity a n’ahịrị isi.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Edebere mba ahụ ka ọ dị nkọ, ajụjụ rhetorical ahụ ka ọ na-atụ anya nkwenye, na ambiguity nke ihe dị n’èzí/ihe dị n’ime n’enweghị mgbakwunye ozizi otu ụka.
