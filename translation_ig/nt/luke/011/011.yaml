revisions:
- from: Ọ bụ nna ole n’etiti unu ka nwa ya ga-arịọ azụ, ya enye ya agwọ kama azụ?
  to: Olee nna n’etiti unu nke, ọ bụrụ na nwa ya arịọ ya azụ, ga-enye ya agwọ kama azụ?
  rationale: 'The revision retains the rhetorical question and every concrete element of the Greek while supplying clear Standard Igbo syntax: the son asks his father for a fish, and the father is queried as to whether he would give the son a snake instead. The conditional phrasing is a natural Igbo way to express the generic hypothetical force of the Greek question.'
  reviewer_model: gpt-5.6-terra
