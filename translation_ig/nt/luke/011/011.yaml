  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: ig
  text: Olee nna n’etiti unu nke, ọ bụrụ na nwa ya arịọ ya azụ, ga-enye ya agwọ kama azụ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: Ọ bụ nna ole n’etiti unu
  rationale: Nke a na-egosipụta ajụjụ nkwupụta Grik ahụ n’ụzọ Igbo na-ada nke ọma, na-ajụ nna dị n’etiti ndị na-ege ntị nke ga-eme ihe ahụ.
- source_word: αἰτήσει
  choice: ga-arịọ
  rationale: Oge ọdịnihu dị na Grik ka e chekwara, ebe ihe a na-arịọ na-esochi ngwaa ahụ kpọmkwem n’ụzọ Igbo nkịtị.
- source_word: ὁ υἱὸς
  choice: nwa ya
  rationale: N’ọnọdụ a, okwu ahụ na-egosi mmekọrịta nwa na nna; ‘nwa ya’ na-eme ka nke a doo anya n’Igbo n’etinyeghị echiche ọhụrụ.
- source_word: ἰχθύν / ἰχθύος
  choice: azụ / azụ
  rationale: E ji otu okwu ahụ mee ihe ugboro abụọ dịka Grik si mee, ka ihe atụ ahụ na ntụnyere ya ghara ịgbanwe.
- source_word: ἀντὶ
  choice: kama
  rationale: ‘Kama’ na-egosi inye otu ihe n’ọnọdụ ihe ọzọ n’ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: ὄφιν
  choice: agwọ
  rationale: ‘Agwọ’ bụ okwu Igbo zuru oke maka ὄφις ebe a, na-enweghị itinye ụdị agwọ pụrụ iche ma ọ bụ ihe atụ ime mmụọ na-adịghị n’amaokwu ahụ.
- source_word: αὐτῷ ἐπιδώσει
  choice: ya enye ya
  rationale: Nke a na-egosi na nna ahụ ga-enye nwa ya ihe ahụ, ma na-edebe usoro ajụjụ nkwupụta nke na-ada nke ọma n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu, sụgharịa ya. A hapụrụ ihe odide ala peeji Bekee banyere ‘snake/serpent’ n’ihi na ‘agwọ’ na-ekpuchi nkọwa abụọ ahụ n’Igbo; ịmepụta okwu ọzọ ga-etinye ọdịiche na-adịghị na isi mmalite Grik.
