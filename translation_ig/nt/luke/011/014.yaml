revisions:
- from: Jizọs nọ na-achụpụ mmụọ ọjọọ nke mere ka mmadụ ghara ikwu okwu.[a] Mgbe mmụọ ọjọọ ahụ pụchara, onye ahụ na-apụghị ikwu okwu kwuru okwu, ìgwè mmadụ ahụ wee juputa n’anya.
  to: Jizọs nọ na-achụpụ mmụọ ọjọọ nke na-eme ka onye ahụ ghara ikwu okwu.[a] Mgbe mmụọ ọjọọ ahụ pụchara, onye ahụ na-enweghị ike ikwu okwu kwuru okwu, ndị mmadụ ahụ tụrụ n’anya.
  rationale: The revision keeps the Greek narrative progression, including the ongoing imperfect action (“nọ na-achụpụ”) and the completed departure before the man spoke. It makes the effect of the demon specific to the person in the narrative, retains the plural sense of “crowds,” and uses idiomatic Standard Igbo for their astonishment. The footnote continues to preserve the lexical ambiguity of κωφός without claiming that the demon itself is deaf or mute.
  reviewer_model: gpt-5.6-terra
