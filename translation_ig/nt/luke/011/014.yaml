reference: Luke 11:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: ig
  text: Jizọs nọ na-achụpụ mmụọ ọjọọ nke na-eme ka onye ahụ ghara ikwu okwu.[a] Mgbe mmụọ ọjọọ ahụ pụchara, onye ahụ na-enweghị ike ikwu okwu kwuru okwu, ndị mmadụ ahụ tụrụ n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke na-eme ka onye ahụ ghara ịnụ ihe.” Okwu Greek a nwere ike ịpụta “onye ntị chiri” ma ọ bụ “onye na-enweghị ike ikwu okwu”; ma n’ebe a, enweghị ike ikwu okwu dabara nke ọma n’ihi na onye ahụ kwuru okwu mgbe mmụọ ọjọọ ahụ pụchara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: nọ na-achụpụ
  rationale: Ngwakọta imperfect a na-egosi omume nọ na-aga n’ihu n’oge gara aga; “nọ na-achụpụ” na-egosipụta nke a n’Igbo nkịtị.
- source_word: δαιμόνιον
  choice: mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke ndị mmadụ na-ejikarị akọwa mmụọ na-eme ihe ọjọọ; ọ naghị etinye “mmụọ na-adịghị ọcha,” okwu na-adịghị n’amaokwu a.
- source_word: κωφόν
  choice: nke mere ka mmadụ ghara ikwu okwu
  rationale: κωφός nwere ike ịpụta onye ntị chiri ma ọ bụ onye ogbi. N’ebe a, ikwu okwu nke onye ahụ kwuru mgbe mmụọ ahụ pụchara na-egosi na enweghị ike ikwu okwu bụ ihe a na-elekwasị anya; nhazi a na-emekwa ka njikọ adjective ahụ na δαιμόνιον doo anya n’Igbo.
- source_word: ἐγένετο δὲ ... ἐξελθόντος
  choice: Mgbe mmụọ ọjọọ ahụ pụchara
  rationale: 'Nke a na-egosipụta usoro oge: ọpụpụ mmụọ ahụ zuru ezu tupu onye ahụ ekwuo okwu, n’enweghị itinye okwu na-adịghị mkpa.'
- source_word: ἐλάλησεν
  choice: kwuru okwu
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke λαλέω; ọ naghị agbakwunye echiche “malitere ikwu okwu,” nke Greek ekwughị kpọmkwem.
- source_word: ὁ κωφός
  choice: onye ahụ na-apụghị ikwu okwu
  rationale: Substantival adjective a na-ezo aka n’onye ahụ arịa ahụ metụtara. Nhọrọ a bụ nke okike n’Igbo ma zere itinye nwoke ma ọ bụ nwaanyị ebe Greek adjective ahụ n’onwe ya anaghị achọ ka e mee otú ahụ n’asụsụ Igbo.
- source_word: ἐθαύμασαν
  choice: juputa n’anya
  rationale: Akpaalaokwu Igbo a na-egosipụta oke ihe ijuanya na ịtụnanya nke ἐθαύμασαν.
- source_word: οἱ ὄχλοι
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ ezie na Greek ji plural, Igbo na-ejikarị aha nchịkọta “ìgwè mmadụ” kwuo ọtụtụ ndị gbakọrọ ọnụ n’ụzọ okike.
theological_decisions:
- issue: Ụdị nsogbu ahụ na asụsụ ịchụpụ mmụọ
  choice: A kọwara ya dị ka ezigbo mmụọ ọjọọ Jizọs na-achụpụ, nke ọpụpụ ya sochiri mgbake nke ikwu okwu.
  alternative: Iji naanị okwu na-akọwa ihe a hụrụ anya, ma ọ bụ izere ịkpọ ya mmụọ ọjọọ.
  rationale: Greek kpọrọ ya δαιμόνιον ma kwuo na ọ pụtara; ya mere ntụgharị ahụ kwesịrị idowe nkwupụta karịrị ihe okike nke ederede ahụ n’enweghị ibelata ma ọ bụ ịgbakwụnye ya.
- issue: Mmekọrịta κωφόν na δαιμόνιον
  choice: A sụgharịrị ya dịka mmụọ ọjọọ nke mere ka mmadụ ghara ikwu okwu.
  alternative: “mmụọ ọjọọ ogbi,” nke nwere ike ịdị ka mmụọ ahụ n’onwe ya enweghị ike ikwu okwu.
  rationale: N’ụtọasụsụ Greek, κωφόν na-akọwa δαιμόνιον, ma ihe mere n’akụkọ ahụ na-egosi na mmetụta ya bụ ime ka onye ahụ ghara ikwu okwu. Nhazi Igbo a na-echekwa echiche ahụ ma zere nghọtahie.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E ji “Jizọs” mee ka onye nọchiri anya ya doo anya n’Igbo, ebe Greek ji naanị “ọ.” A zere okwu ochie ma ọ bụ nke nwere ike iweda onye nwere nkwarụ ala.
