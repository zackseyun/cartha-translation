  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: ig
  text: Ma ndị ọzọ, iji nwalee ya, nọ na-achọ n’aka ya ihe ịrịba ama sitere n’eluigwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ịrịba ama nke eluigwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: ndị ọzọ
  rationale: Ọ na-egosi ìgwè ọzọ dị iche na ndị kwuru okwu n’amaokwu bu ụzọ; ‘ndị ọzọ’ bụ Igbo doro anya ma kwekọọ n’ihe odide Grik.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche n’etiti omume ìgwè a na nke ndị a kpọtụrụ aha tupu ha.
- source_word: πειράζοντες
  choice: iji nwalee ya
  rationale: N’ebe a, okwu ahụ pụtara ịnwale Jizọs ma ọ bụ itinye ya n’ule, ọ bụghị nanị ịrafu ya ime mmehie. Nkebiokwu a na-egosikwa ebumnobi ọjọọ ha n’ụzọ dị mfe nghọta.
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nke a na-edobe okwu Grik n’enweghị ịgbakwụnye na ọ bụ ọrụ ebube, ọ bụ ezie na gburugburu akụkọ ahụ na-egosi na ọ bụ ihe pụrụ iche ka ha na-achọ.
- source_word: ἐξ οὐρανοῦ
  choice: sitere n’eluigwe
  rationale: Ọ na-egosi na ebe ma ọ bụ isi mmalite nke ihe ịrịba ama ahụ bụ eluigwe, ma hapụkwa ihe okwu ahụ pụtara ka ọ ghara ịdị warara.
- source_word: ἐζήτουν
  choice: nọ na-achọ
  rationale: Ụdị imperfect nke ngwaa Grik na-egosi omume na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro; ‘nọ na-achọ’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: παρ’ αὐτοῦ
  choice: n’aka ya
  rationale: Nke a na-egosi na ọ bụ Jizọs ka ha na-achọ ihe ịrịba ama ahụ n’aka ya, ma na-ezere nkwughachi na-adịghị ụtọ n’Igbo.
theological_decisions:
- issue: Ụdị ihe ịrịba ama ha rịọrọ
  choice: ihe ịrịba ama sitere n’eluigwe
  alternative: ihe ịrịba ama nke eluigwe
  rationale: Nhọrọ bụ isi na-egosi kpọmkwem na ihe ịrịba ama ahụ ga-esi n’eluigwe bịa, ma ọ naghị akọwa karịa ihe Grik kwuru ma ọ bụ kpebie otú a ga-esi ghọta nkwado sitere n’eluigwe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Nọ na-achọ’ na-echekwa omume na-aga n’ihu nke imperfect, ebe ‘iji nwalee ya’ na-egosipụta ebumnobi nke participle n’enweghị itinye nkọwa ụka pụrụ iche.
