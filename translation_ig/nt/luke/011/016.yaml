  source_fidelity: 'The translation accurately represents all elements of the Greek: “ndị ọzọ” for ἕτεροι, the mild contrast “Ma” for δέ, hostile testing in “iji nwalee ya,” the ongoing sense of ἐζήτουν in “nọ na-achọ,” and both sources/relations in “n’aka ya” (παρ’ αὐτοῦ) and “sitere n’eluigwe” (ἐξ οὐρανοῦ). It does not over-specify the nature of the sign.'
