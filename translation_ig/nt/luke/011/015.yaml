  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: ig
  text: Ma ụfọdụ n’ime ha kwuru, “Ọ bụ site n’aka Beelzebul[a], onye na-achị ndị mmụọ ọjọọ, ka ọ na-achụpụ ndị mmụọ ọjọọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beelzebub: ụdị aha ọdịnala a maara nke ọma; e ji “Beelzebul” mee ihe n’ebe a dịka ọ dị n’ederede Grik.'
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Ma ụfọdụ n’ime ha
  rationale: “Ụfọdụ n’ime ha” na-edobe echiche nke otu akụkụ a na-akọwaghị aha n’etiti ìgwè ahụ; “Ma” na-egosipụta ọdịiche dị n’etiti okwu ha na mmeghachi omume dị n’amaokwu ndị gbara ya gburugburu.
- source_word: εἶπον
  choice: kwuru
  rationale: Oge aorist na-akọ okwu ahụ dịka ihe mere otu ugboro; “kwuru” bụ ụzọ Igbo doro anya ma bụrụkwa nke nkịtị.
- source_word: Ἐν Βεελζεβοὺλ
  choice: site n’aka Beelzebul
  rationale: N’ebe a, ἐν tinyere aha onye na-egosi onye e si n’aka ya ma ọ bụ n’ike ya mee ihe. “Site n’aka” na-ekwupụta ebubo ahụ n’Igbo eke, na-enweghị ịkọwapụta karịa ihe Grik kwuru.
- source_word: Βεελζεβοὺλ
  choice: Beelzebul
  rationale: Nke a na-edegharị ụdị aha dị n’ihe odide Grik, ebe a na-edebe ụdị ọdịnala “Beelzebub” n’okpuru peeji.
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: onye na-achị ndị mmụọ ọjọọ
  rationale: “Onye na-achị” na-egosi ikike ἄρχων nwere n’ụzọ doro anya nye ndị na-agụ Igbo taa, ma ghara itinye nkọwa ndị ọzọ banyere usoro ọchịchị ndị mmụọ ọjọọ.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: ka o ji achụpụ ndị mmụọ ọjọọ
  rationale: “Ịchụpụ” na-ebute echiche nke ịchụ ndị mmụọ ọjọọ ka ha pụọ, ma usoro “ka o ji” jikọtara omume ahụ na onye e kwuru na ọ bụ site n’aka ya ka e si mee ya.
theological_decisions:
- issue: Ụdị aha Βεελζεβούλ
  choice: Beelzebul
  alternative: Beelzebub
  rationale: Aha dị n’isi ederede na-agbaso ụdị Grik kpọmkwem. A na-edebe “Beelzebub,” nke ọtụtụ mmadụ maara site n’ọdịnala, n’okpuru peeji kama iji ya dochie ihe odide Grik.
- issue: Ntụgharị ἄρχων
  choice: onye na-achị ndị mmụọ ọjọọ
  alternative: onyeisi ndị mmụọ ọjọọ
  rationale: “Onye na-achị” na-egosi ọrụ na ikike onye ahụ n’ụzọ zuru oke, ma ọ naghị akpọbata nkọwa pụrụ iche banyere ọkwa dị iche iche n’etiti ndị mmụọ ọjọọ.
- issue: Nkọwa ἐν dịka ụzọ ma ọ bụ ikike e ji mee ihe
  choice: site n’aka Beelzebul
  alternative: n’ike Beelzebul
  rationale: “Site n’aka” na-echekwa ohere nghọta nke onye e si n’aka ya mee ihe na nke ike e ji mee ya; ọ naghị eme ka “ike” bụrụ okwu pụtara ìhè ebe okwu ahụ adịghị kpọmkwem na Grik.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ mmegharị okwu “ndị mmụọ ọjọọ” ugboro abụọ dịka ọ dị n’usoro Grik, ebe ọ na-eme ka onye na-achị ha na ndị a na-achụpụ pụta ìhè.
