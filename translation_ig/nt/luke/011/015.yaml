revisions:
- from: Ma ụfọdụ n’ime ha kwuru, “Ọ bụ site n’aka Beelzebul[a], onye na-achị ndị mmụọ ọjọọ, ka o ji achụpụ ndị mmụọ ọjọọ.”
  to: Ma ụfọdụ n’ime ha kwuru, “Ọ bụ site n’aka Beelzebul[a], onye na-achị ndị mmụọ ọjọọ, ka ọ na-achụpụ ndị mmụọ ọjọọ.”
  rationale: The revision preserves every element of the Greek accusation and its ambiguity concerning agency/instrumentality, while removing an unnecessary 'ji' construction and representing the present-tense verb naturally in Standard Igbo. The name and alternative-form footnote remain intact, with only a stylistic correction to the footnote wording.
  reviewer_model: gpt-5.6-terra
