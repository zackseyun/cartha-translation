  verdict: revise
  source_fidelity: The draft accurately conveys the causal clause, the indefinite possessive sense ('otu enyi m'), arrival after travel, and the speaker's lack. However, 'ka o rie' explicitly adds the purpose of eating, whereas ὃ παραθήσω αὐτῷ says only 'what I may set/place before him.' Also, 'edobere ya' can naturally mean reserve/save something for him rather than set it before him.
  naturalness: The wording is generally clear Standard Igbo. 'm ga-edobe n’ihu ya' is more idiomatic and precisely expresses the hospitality action in this context.
  terminology: No theological terminology is involved. 'si njem' is a sound idiomatic rendering of ἐξ ὁδοῦ; the footnote appropriately preserves the literal road/way wording.
  issues:
  - severity: medium
    issue: Added phrase 'ka o rie'
    rationale: This makes eating explicit although the Greek leaves the object/action at 'set before him.' Hospitality and food are contextual implications, but should not be added in an optimal-equivalence translation.
  - severity: medium
    issue: '''edobere ya'' is semantically less precise'
    rationale: Without 'n’ihu,' it may mean 'keep/reserve for him.' παραθήσω in this setting calls for putting something before the guest.
