id: LUK.11.6
reference: Luke 11:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπειδὴ φίλος ⸀μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: ig
  text: n’ihi na otu enyi m si njem bịakwute m,[a] enweghịkwa m ihe m ga-edobe n’ihu ya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “si n’ụzọ bịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere onye ahụ ji rịọ arịrịọ; nke a bụ ụzọ Igbo ebumpụta ụwa si egosi ihe kpatara ihe.
- source_word: φίλος μου
  choice: otu enyi m
  rationale: Nke a na-echekwa nghọta nke enyi a na-akọwaghị kpọmkwem, ma na-ada nke ọma n’Igbo.
- source_word: παρεγένετο
  choice: bịakwute m
  rationale: Ọ na-egosi na enyi ahụ abịarutela ebe onye na-ekwu okwu nọ ma ka nọ ya ugbu a.
- source_word: ἐξ ὁδοῦ
  choice: si njem
  rationale: Ọ bụ nsụgharị Igbo doro anya nke akpaalaokwu ahụ, nke pụtara na ọ si njem bịa; nkọwa nkịtị ka dị n’ala peeji.
- source_word: πρός με
  choice: bịakwute m
  rationale: E tinyere echiche nke ije ‘n’ebe m nọ’ n’ime ngwaa Igbo a n’enweghị ịgbakwunye ụlọ ma ọ bụ nleta nke isiokwu Grik ekwughị kpọmkwem.
- source_word: οὐκ ἔχω
  choice: enweghị m ihe
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma doo anya isi kwuo na onye ahụ enweghị ihe ọ bụla.
- source_word: ὃ παραθήσω αὐτῷ
  choice: ihe m ga-edobere ya ka o rie
  rationale: Ọ na-echekwa ihe oyiyi nke idobere ọbịa nri, ebe ‘ka o rie’ na-eme ka ihe e bu n’obi doo ndị na-agụ Igbo anya n’enweghị ịkọwa ụdị nri.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “otu enyi m” chekwaa ọdịdị na-akọwaghị enyi ahụ kpọmkwem; e jikwa “si njem” mee ka akpaalaokwu Grik doo anya, ebe ala peeji na-echekwa nsụgharị nkịtị.
