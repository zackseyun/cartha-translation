id: LUK.11.49
reference: Luke 11:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: ig
  text: N’ihi nke a, Amamihe Chineke kwukwara[a], “M ga-ezigara ha ndị amụma na ndịozi; ha ga-egbu ma kpagbuo ụfọdụ n’ime ha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “amamihe nke Chineke.” A pụrụ ịghọta okwu a dịka ime ka amamihe Chineke bụrụ onye na-ekwu okwu, dịka mkpebi amamihe Chineke, ma ọ bụ dịka ụzọ Jizọs si ezo aka n’onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ bụ ụzọ Igbo dị mfe ma doo anya isi gosi ihe kpatara okwu a, na-ejigide njikọ ya na ebubo dị n’amaokwu ndị bu ya ụzọ.
- source_word: καὶ
  choice: kwukwara
  rationale: Mgbakwunye -kwara na ngwaa na-egosipụta ike mgbakwunye nke καὶ n’ụzọ Igbo na-ada nke ọma.
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: Amamihe Chineke
  rationale: Nke a na-ejigide njikọ dị n’etiti amamihe na Chineke, ma ọ naghị ekpebi ma ọ bụ njirimara e nyere amamihe, mkpebi amamihe Chineke, ka ọ bụ ụzọ Jizọs si ezo aka n’onwe ya.
- source_word: εἶπεν
  choice: kwuru
  rationale: Ọ bụ ntụgharị nkịtị, na-enweghị itinye nkọwa ọzọ; e jikọtara ya na -kwara iji gosipụta καὶ.
- source_word: Ἀποστελῶ
  choice: M ga-ezigara
  rationale: Ụdị ọdịnihu a na-egosipụta iziga ndị mmadụ gaa n’ebe ndị a kpọrọ aha nọ; ‘-zigara ha’ bụ Igbo nkịtị maka izigara mmadụ ihe ma ọ bụ mmadụ.
- source_word: εἰς αὐτούς
  choice: ha
  rationale: A na-etinye nnara ‘ha’ n’ime ngwaa ‘e-zigara ha,’ nke na-egosipụta ‘to them’ n’ụzọ Igbo kwesịrị ekwesị.
- source_word: προφήτας
  choice: ndị amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-ekwuchitere Chineke.
- source_word: ἀποστόλους
  choice: ndịozi
  rationale: ‘Ndịozi’ na-ejigide echiche nke ndị e zigara n’ọrụ pụrụ iche, ma na-arụkwa ọrụ dị ka aha a maara nke ọma n’ọdịnala Ndị Kraịst.
- source_word: ἐξ αὐτῶν
  choice: ụfọdụ n’ime ha
  rationale: 'Nke a na-egosipụta partitive sense nke okwu Grik ahụ: ọ bụ ụfọdụ n’etiti ndị e zigara, ọ bụghị na ọ bụ ha niile.'
- source_word: ἀποκτενοῦσιν
  choice: ha ga-egbu
  rationale: Ọ bụ ntụgharị doro anya na kpọmkwem nke ngwaa ọdịnihu ahụ.
- source_word: διώξουσιν
  choice: kpagbuo
  rationale: N’ọnọdụ iro a, ‘kpagbuo’ na-egosipụta mkpagbu, ọ bụghị nanị ịchụ mmadụ ọsọ.
theological_decisions:
- issue: Ihe ‘Amamihe Chineke’ pụtara
  choice: E debere ya dịka ‘Amamihe Chineke’ n’akọwaghị ya kpọmkwem dịka Jizọs, Akwụkwọ Nsọ, ma ọ bụ onye dị iche.
  alternative: A pụrụ ịghọta ya dịka ime ka amamihe Chineke bụrụ onye na-ekwu okwu, dịka mkpebi amamihe Chineke, ma ọ bụ dịka ụzọ Jizọs si ezo aka n’onwe ya.
  rationale: Okwu Grik ahụ nwere ike ịnabata nghọta ndị a dị iche iche. Ntụgharị ahụ na-edebe mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na ya kama ikpebi otu nkọwa.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘ndịozi’ mee ihe maka aha/ọrụ pụrụ iche nke ἀπόστολοι, ebe e debere ‘Amamihe Chineke’ n’ụzọ na-adịghị amanye otu nkọwa nkà mmụta okpukpe.
