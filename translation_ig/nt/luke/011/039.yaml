  to: Ma Onyenwe anyị sịrị ya, “Ugbu a, unu ndị Farisii na-asacha mpụga nke iko na efere, ma ime unu jupụtara n’ịpụnara mmadụ ihe[a] na ajọ omume.”
  rationale: A small idiomatic revision replaces ‘ihu mpụga’ with ‘mpụga nke’ for the outer parts of the cup and dish. No change is made to the meaning, the metaphor of inner corruption, the source’s moral force, or the footnote anchor and lexical alternatives.
