id: LUK.11.39
reference: Luke 11:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: ig
  text: Ma Onyenwe anyị sịrị ya, “Ugbu a, unu ndị Farisii na-asacha mpụga nke iko na efere, ma ime unu jupụtara n’ịpụnara mmadụ ihe[a] na ajọ omume.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyaukwu,” “ohi,” ma ọ bụ “ịnapụ mmadụ ihe n’ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Aha a bụ ụzọ Igbo a na-ejikarị asụgharị κύριος dị ka utu aha nke Jizọs n’Agba Ọhụrụ, ọ bụghị naanị okwu nkwanye ùgwù.
- source_word: Νῦν
  choice: Ugbu a
  rationale: Na-edobe ya dị ka okwu mmalite nke na-eme ka mba Jizọs baara ha sie ike.
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: unu ndị Farisii
  rationale: Na-egosipụta nkwusie ike dị na nnọchiaha ahụ tinyere aha otu ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: τὸ ἔξωθεν
  choice: ihu mpụga
  rationale: Na-egosi akụkụ dị n’èzí nke iko na efere n’ụzọ doro anya ma kwekọọ n’onyonyo ahụ.
- source_word: ποτηρίου
  choice: iko
  rationale: Ọ bụ okwu Igbo nkịtị na kpọmkwem maka ποτήριον n’ebe a.
- source_word: πίνακος
  choice: efere
  rationale: Okwu a na-aghọta ngwa ngwa ma nwee ike ịpụta efere ma ọ bụ nnukwu efere e ji enye nri.
- source_word: καθαρίζετε
  choice: na-asacha
  rationale: Na-egosi omume ha na-eme, ma dabara n’ịsacha ihe ndị e ji eri ma ọ bụ aṅụ ihe.
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: ma ime unu
  rationale: Na-edobe ihe atụ nke ọdịiche dị n’etiti mpụga na ime, na-akọwaghị ya dịka obi ma ọ bụ uche.
- source_word: γέμει
  choice: jupụtara na
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi kwuo na ihe dị n’ime juputara n’ihe ndị a kpọrọ aha.
- source_word: ἁρπαγῆς
  choice: ịpụnara mmadụ ihe
  rationale: Na-ebute echiche bụ isi nke ịnara ihe n’ike ma ọ bụ n’ụzọ mmegbu; ọ na-edobe ihe ἁρπαγή pụtara nke ọma karịa ịsụgharị ya naanị dịka anyaukwu.
- source_word: πονηρίας
  choice: ajọ omume
  rationale: Na-egosipụta ajọ ọnọdụ omume n’ụzọ doro anya, dị arọ, ma dị mfe nghọta n’Igbo ugbu a.
theological_decisions:
- issue: Ihe “ime” na-ezo aka na ya n’ihe atụ ahụ
  choice: E debere ya dịka “ime unu.”
  alternative: “obi unu” ma ọ bụ “mmadụ ime unu”
  rationale: Grik ahụ na-eme ka mpụga a na-asacha na ime rụrụ arụ guzogide ibe ha. Ịkpọ ya “obi” ga-akọwa karịa ihe ederede kwuru.
- issue: Ụdị omume ἁρπαγή na-egosi
  choice: “ịpụnara mmadụ ihe” n’ahịrị bụ isi
  alternative: “anyaukwu,” “ohi,” ma ọ bụ “ịnapụ mmadụ ihe n’ike”
  rationale: Aha Grik ahụ nwere ike ịpụta ịnapụ ihe, ohi, ihe a kwakọrọ, ma ọ bụ ọchịchọ irite ihe n’ụzọ mmegbu. Nsụgharị bụ isi na-edobe akụkụ mmegbu ahụ, ebe ndetu ala na-echekwa ohere “anyaukwu.”
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ, ma dị ùgwù. E debere ntụnyere mpụga na ime, ma zere ịkọwa “ime” dịka obi. Akara ndetu [a] so kpọmkwem n’okwu ọ na-akọwa.
