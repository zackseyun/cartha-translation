    issue: The phrase ‘ihu mpụga iko na efere’ is slightly awkward.
    rationale: For the Greek τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος, Standard Igbo more naturally says ‘mpụga nke iko na efere.’ This retains the exterior/interior contrast exactly and improves fluency.
