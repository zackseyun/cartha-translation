review_pass:
  verdict: revise
  source_fidelity: The draft faithfully retains the direct address, the contrast between exterior washing and inner corruption, and the metaphorical ‘inside’ (τὸ ἔσωθεν ὑμῶν). ‘Ịpụnara mmadụ ihe’ gives the concrete, exploitative sense of ἁρπαγή well; the footnote appropriately preserves the broader lexical possibilities, including ‘anyaukwu,’ reflected in the English audit trail.
  naturalness: ‘Ihu mpụga iko na efere’ is understandable, but ‘mpụga nke iko na efere’ is more idiomatic Standard Igbo for the exterior of the vessels and does not introduce the somewhat unnecessary ‘face/surface’ wording ‘ihu.’ The remaining phrasing is clear, modern, and suitably grave.
  terminology: ‘Onyenwe anyị,’ ‘ndị Farisii,’ ‘iko,’ ‘efere,’ ‘ime unu,’ and ‘ajọ omume’ are appropriate. The revised wording preserves the source’s metaphor without replacing it interpretively with ‘obi.’
  issues:
