  source_fidelity: 'Isi ederede ahụ na-esochi Grik nke ọma: ọ na-echekwa ntụgharị δέ, ọnọdụ oge nke ἐπὰν, comparative substantival ahụ n’enweghị ịgbakwunye “nwoke,” ihe oyiyi nke ịbịakwasị na imeri, panoplia zuru ezu, ntụkwasị obi n’ime ya, na ikesa nkwata. “Ngwa agha ya niile” na-anọchi πανοπλία nke ọma n’ọdịnaya a.'
  naturalness: Ahịrịokwu ahụ bụ Standard Igbo dị mfe ịgụ ma dabara n’usoro akụkọ ihe atụ. “Bịakwasịrị ya,” “na-anapụ ya,” na “na-ekesakwa” bụ okwu nkịtị ma na-echekwa ike ihe oyiyi ahụ.
  terminology: “Onye ka ya ike,” “ngwa agha ya niile,” na “ihe nkwata ya” dabara nke ọma. Otú ọ dị, nkọwa ala peeji a maka νικήσῃ ekwesịghị iji “kagbuo ya,” nke na-apụtakarị ịkagbu ma ọ bụ ime ka ihe ghara ịdị irè, ọ bụghị imeri mmadụ. “Merie ya n’agha” na-agbakwụnye agha n’ụzọ siri ike karịa ngwaa Grik n’onwe ya. E degharịkwara nkọwa nke nkwata ka ọ ghara ịkọwa ya naanị dị ka ihe a kwakọrọ n’agha.
  issues:
