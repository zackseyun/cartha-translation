    rationale: “Kagbuo” anaghị anọchi νικάω n’ebe a; ọ na-enwekarị echiche ịkagbu iwu, nkwekọrịta, ma ọ bụ ihe omume. “Merie” ma ọ bụ “gbaa ya ọsọ/meri ya” ka kwesịrị ekwesị.
  - severity: low
    issue: Nkọwa ala peeji [a] na [c] na-ejikọta nhọrọ ndị ọzọ kpọmkwem na “agha.”
    rationale: Ihe oyiyi amaokwu ahụ bụ nke esemokwu na ngwa agha, ma νικάω na σκῦλα anaghị achọ ka ntụgharị ma ọ bụ nkọwa ala peeji kwuo agha n’ụzọ doro anya. E kwesịghị ime ka nkọwa ahụ dị warara karịa Grik.
