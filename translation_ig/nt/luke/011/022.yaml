source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: ig
  text: Ma mgbe onye ka ya ike bịakwasịrị ya ma merie ya[a], ọ na-anapụ ya ngwa agha ya niile[b] nke ọ tụkwasịrị obi na ya, na-ekesakwa ihe nkwata ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “merie ya” ma ọ bụ “gbaa ya ọsọ.”
    reason: lexical_alternative
  - marker: b
    text: “Ngwa agha ya niile” bụ ntụgharị okwu Grik nke pụtara ngwa agha zuru ezu onye agha na-eji.
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, ihe e weere n’aka onye e meriri; a pụkwara ịsị, “ihe e nwetara n’imeri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: Ma mgbe
  rationale: “Ma” na-egosi ntụgharị dị n’etiti ọnọdụ a na nke amaokwu bu ya ụzọ, ebe “mgbe” na-eweta ọnọdụ oge n’ụzọ Igbo nkịtị.
- source_word: ἰσχυρότερος αὐτοῦ
  choice: onye ka ya ike
  rationale: Nke a na-asụgharị comparative substantival ahụ n’enweghị itinye “nwoke,” nke na-adịghị n’ahịrịokwu Grik a.
- source_word: ἐπελθὼν
  choice: bịakwasịrị ya
  rationale: Okwu a na-egosi ịbịakwute mmadụ n’ụzọ mwakpo ma ọ bụ esemokwu, ma ọ naghị akọwapụta ụdị mwakpo ahụ karịa ihe Grik kwuru.
- source_word: νικήσῃ αὐτόν
  choice: merie ya
  rationale: “Imeri” bụ okwu Igbo doro anya nke nwere ike ịpụta imeri, ịkagbu, ma ọ bụ imeri n’agha dịka ọnọdụ a si dị.
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: ngwa agha ya niile
  rationale: πανοπλία bụ ngwa agha zuru ezu; “ya niile” na-echekwa echiche nke izu oke ahụ n’asụsụ a na-aghọta ngwa ngwa.
- source_word: αἴρει
  choice: ọ na-anapụ ya
  rationale: Nke a na-egosi na onye ka ike na-ewepụ ngwa agha ahụ n’aka onye e meriri, dịka ọnọdụ ahụ chọrọ.
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: nke ọ tụkwasịrị obi na ya
  rationale: Nke a na-echekwa echiche nke ntụkwasị obi siri ike o nwere n’ebe ngwa agha ya dị.
- source_word: τὰ σκῦλα αὐτοῦ
  choice: ihe nkwata ya
  rationale: “Ihe nkwata” na-egosi ihe e weere n’aka onye e meriri; nnọchiaha “ya” na-echekwa mkpirikpi na obere mgbagwoju anya nke Grik.
- source_word: διαδίδωσιν
  choice: na-ekesakwa
  rationale: Ngwaa a pụtara ikesa ma ọ bụ ike ihe n’etiti ndị ọzọ; “na-ekesakwa” na-ejikọta omume a na ịnapụ ngwa agha ahụ.
theological_decisions:
- issue: Ma a ga-akpọ onye ka ike ahụ “nwoke” n’ụzọ doro anya.
  choice: onye ka ya ike
  alternative: nwoke ka ya ike
  rationale: Grik ji adjective comparative dị ka aha, ma o tinyeghị okwu “nwoke” n’amaokwu a. Nsụgharị ahụ anaghị agbakwunye njirimara nke ihe gbara ya gburugburu ga-enye onye na-agụ ya.
- issue: Otu a ga-esi kọwaa νικάω n’ọnọdụ esemokwu a.
  choice: merie ya
  alternative: kagbuo ya; merie ya n’agha
  rationale: “Merie ya” na-echekwa obosara ihe νικάω pụtara ma ghara ịmanye nkọwa nkà mmụta okpukpe banyere onye ndị nọ n’ihe atụ ahụ nọchiri anya ya.
- issue: Onye okwu “ya” na τὰ σκῦλα αὐτοῦ na-ezo aka na ya.
  choice: Chekwaa ya dịka “ihe nkwata ya.”
  alternative: ihe onye ka ike kwakọrọ n’aka ya
  rationale: Grik nwere nnọchiaha nke ihe gbara ya gburugburu na-eme ka a ghọta, ma ụdị mkpirikpi ya ka nwere ntakịrị ohere n’usoro okwu. Isi ederede echekwala nke ahụ, ebe nkọwa ala peeji na-akọwa ihe “nkwata” pụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-ejigide ihe atụ agha, ntụgharị site n’amaokwu bu ya ụzọ, na nnọchiaha ndị dị na Grik n’etinyeghị nkọwa ụka pụrụ iche.
