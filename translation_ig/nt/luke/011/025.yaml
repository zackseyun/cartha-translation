  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: ig
  text: Mgbe ọ bịarutere, ọ na-ahụ ya ka a zara ya azà ma hazie ya n’usoro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a zara ya azà ma chọọ ya mma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὸν
  choice: Mgbe ọ bịarutere
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebi oge n’Igbo. “Ọ bịarutere” na-ezo aka n’ọbịbịa mmụọ na-adịghị ọcha ahụ ọzọ dịka amaokwu bu ụzọ si kọwaa, n’enweghị ịgbakwunye nkọwa na-adịghị na ahịrịokwu a.
- source_word: εὑρίσκει
  choice: ọ na-ahụ
  rationale: Oge ugbu a nke ngwaa Grik na-enye akụkọ ahụ ndụ. “Ọ na-ahụ” na-edobe mmetụta ahụ ma na-eji nnọchiaha “ọ,” nke bụ ụzọ Igbo si ezo aka n’mmụọ n’ụzọ nkịtị.
- source_word: σεσαρωμένον
  choice: a zara ya azà
  rationale: Perfect passive participle na-egosi na e zachala ebe ahụ, ọnọdụ ahụ ka dịkwa. Nkebi Igbo a na-egosi omume izacha na nsonaazụ ya n’ụzọ doro anya.
- source_word: κεκοσμημένον
  choice: dozie ya nke ọma
  rationale: N’ihe gbasara ụlọ, κοσμέω nwere ike ịpụta ịhazi ma ọ bụ idowe ihe n’usoro. “Dozie ya nke ọma” bụ okwu Igbo nke oge a ma dị mfe nghọta, ebe “chọọ ya mma” ka edobere dị ka nhọrọ ọzọ n’ala ala peeji.
theological_decisions:
- issue: Ihe nnọchiaha e zoro ezo na-ezo aka na ya
  choice: ọ na-ahụ ya
  alternative: ọ na-ahụ ụlọ ahụ
  rationale: Grik akpọghị “ụlọ” aha n’amaokwu a, ọ bụ ezie na amaokwu ndị gbara ya gburugburu mere ka o doo anya. “Ya” na-edobe mkpụmkpụ na ntakịrị ihe a na-ekwughị kpọmkwem dị n’akwụkwọ mbụ.
- issue: Otu e si ezo aka na mmụọ na-adịghị ọcha
  choice: ọ
  alternative: ya dị ka ihe na-enweghị mmadụ
  rationale: Igbo na-eji “ọ” ezo aka n’mmụọ n’ụzọ nkịtị; nke a anaghị etinye ozizi ọhụrụ ma ọ bụ kpebie karịa ihe ọnọdụ okwu ahụ kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro ngwaa abụọ nke Grik—izacha na idozi—ma hapụ “ụlọ” ka ọ bụrụ ihe a ghọtara site n’amaokwu ndị gbara ya gburugburu.
