revisions:
- from: Mgbe ọ bịarutere, ọ na-ahụ ya ka a zara ya azà ma dozie ya nke ọma.[a]
  to: Mgbe ọ bịarutere, ọ na-ahụ ya ka a zara ya azà ma hazie ya n’usoro.[a]
  rationale: The revision preserves the temporal participle, vivid present, implicit object, and completed passive state of the Greek. It replaces the potentially broader “dozie ya nke ọma” with “hazie ya n’usoro,” which directly reflects the contextual 'put in order' sense of κεκοσμημένον without adding an intensifier. The alternative footnote preserves the valid 'adorned' sense.
  reviewer_model: gpt-5.6-terra
