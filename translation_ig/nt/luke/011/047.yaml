    reason: lexical_alternative
  - marker: b
    text: Okwu a sụgharịịrị kpọmkwem ịbụ “ndị nna unu”; n’ebe a, ọ pụrụ ịpụta ndị nna ochie unu ma ọ bụ ndị gara aga n’agbụrụ unu.
    reason: lexical_alternative
