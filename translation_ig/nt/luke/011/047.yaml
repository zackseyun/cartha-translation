id: LUK.11.47
reference: Luke 11:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: ig
  text: Ahụhụ dịrị unu, n’ihi na unu na-ewu ili ndị amụma[a], ma ndị nna ochie unu[b] gburu ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ili ncheta” ma ọ bụ “ihe ncheta n’ebe ili.” Okwu Grik ahụ nwere ike ịpụta ili ma ọ bụ ihe ncheta e wuru n’ebe e liri mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu a sụgharịịrị kpọmkwem ịbụ “ndị nna unu”; n’ebe a, ọ pụrụ ịpụta ndị nna ochie unu ma ọ bụ ndị gara aga n’agbụrụ unu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: Ahụhụ dịrị unu
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị arọ e si kwupụta amamikpe amụma a na-adọ mmadụ aka ná ntị banyere ya, ọ bụghị naanị mwute.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-egosi ihe kpatara nkwupụta ahụ n'ụzọ doro anya.
- source_word: οἰκοδομεῖτε
  choice: unu na-ewuru
  rationale: Na-egosipụta omume dị ugbu a ma ọ bụ omume ha na-eme, n’Igbo nkịtị.
- source_word: τὰ μνημεῖα
  choice: ili ncheta
  rationale: Na-ejikọta echiche ili na ihe ncheta nke okwu Grik ahụ nwere ike ịpụta, ma na-anọgide bụrụ okwu ndị nkịtị ga-aghọta.
- source_word: τῶν προφητῶν
  choice: ndị amụma
  rationale: Na-egosi na ili ncheta ndị ahụ bụ nke ndị amụma ma ọ bụ nke e wuru iji cheta ha.
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: ma ndị nna nna unu
  rationale: “Ma” na-echekwa ntakịrị ntụgharị ma ọ bụ esemokwu δέ nwere ebe a; “ndị nna nna” na-egosi ndị gara aga n’agbụrụ ha nke ọma.
- source_word: ἀπέκτειναν αὐτούς
  choice: gburu ha
  rationale: Nsụgharị kwụ ọtọ, eke, nke na-adịghị etinye nkọwa iwu karịrị ihe okwu Grik kwuru.
theological_decisions:
- issue: Ma a ga-akọwapụta ihu abụọ ma ọ bụ iso ndị nna nna ha nwee ikpe n’ihi iwu ili ndị amụma ha gburu
  choice: 'E debere okwu abụọ ahụ n’akụkụ ibe ha: ha na-ewuru ndị amụma ili ncheta, ma ndị nna nna ha gburu ndị amụma ahụ.'
  alternative: Ịsị na ha si otú ahụ gbaa akaebe megide ndị nna nna ha, ma ọ bụ na ha kwadoro omume ha.
  rationale: Amaokwu a na-egosi esemokwu ahụ n’enweghị ịkọwa nkwubi okwu ya n’uju; amaokwu na-esochi ya na-eme ka ihe ọ pụtara pụta ìhè. Ya mere, nsụgharị ahụ echekwaghị esemokwu nkà mmụta okpukpe ahụ kama idozi ya n’ime amaokwu a.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E jiri “Ahụhụ dịrị unu” chekwaa ike nke nkwupụta amamikpe amụma; e jikwa “ili ncheta” mee ka echiche funerary na memorial nke μνημεῖα pụta ìhè. Akara nkọwa ala peeji [a] na [b] dị n’isiokwu ahụ.
