revisions:
- from: Ahụhụ dịrị unu, n’ihi na unu na-ewuru ndị amụma ili ncheta[a], ma ndị nna nna unu[b] gburu ha.
  to: Ahụhụ dịrị unu, n’ihi na unu na-ewu ili ndị amụma[a], ma ndị nna ochie unu[b] gburu ha.
  rationale: The revision retains the verse’s concise juxtaposition and the adversative force of δέ, without importing the following verse’s inference. It uses the primary funerary sense of μνημεῖα in the text and keeps the broader memorial sense in a note. It also replaces the less natural ancestral expression with Standard Igbo 'ndị nna ochie.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the prophetic denunciation (οὐαὶ ὑμῖν), causal ὅτι, present-tense building, the prophets, the adversative δέ ('ma'), and the killing of the prophets. However, τὰ μνημεῖα is best represented in the main text by the unmarked, primary sense 'ili' ('tombs'), with its memorial-monument nuance retained in a note rather than built into the main wording.
  naturalness: '''Ndị nna nna'' can be understood, but ''ndị nna ochie'' is the more natural Standard Igbo expression for ancestral forebears in this context. ''Unu na-ewu ili ndị amụma'' is also more direct and idiomatic than ''unu na-ewuru ndị amụma ili ncheta.'''
  terminology: '''Ahụhụ dịrị unu'' suitably carries the formal prophetic force of οὐαί. ''Ndị amụma'' and ''gburu ha'' are accurate. The revision uses ''ndị nna ochie'' for contextual ''fathers/ancestors'' without making a doctrinal claim.'
  issues:
  - severity: low
    issue: The main rendering 'ili ncheta' combines two possible senses of μνημεῖα.
    rationale: The Greek can denote tombs or grave monuments. Since 'ili' is the clearest primary sense here, the memorial nuance is better preserved as a footnoted alternative.
  - severity: low
    issue: '''Ndị nna nna'' is less idiomatic than ''ndị nna ochie'' for ancestral forebears.'
    rationale: The context concerns the forebears who killed the prophets, not specifically biological fathers or grandfathers. 'Ndị nna ochie' is standard, natural Igbo for this sense.
  revised_text: Ahụhụ dịrị unu, n’ihi na unu na-ewu ili ndị amụma[a], ma ndị nna ochie unu[b] gburu ha.
  revised_footnotes:
