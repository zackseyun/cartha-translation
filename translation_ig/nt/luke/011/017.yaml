  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: ig
  text: Ma ya onwe ya maara echiche ha, sịrị ha, “Alaeze ọ bụla nke kewara megide onwe ya na-ala n’iyi, ụlọ na-adakwasịkwa ụlọ ọzọ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ezinụlọ na-adakwasị ezinụlọ ọzọ.” Okwu Grik bụ οἶκος nwere ike ịpụta ụlọ a rụrụ arụ ma ọ bụ ezinụlọ/ndị otu ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: ebe ọ maara
  rationale: Nke a na-egosi na ọ maara ihe dị ha n’obi, ma na-ejigide njikọ participle ahụ na ngwaa bụ́ isi n’ụzọ Igbo na-ada nke ọma.
- source_word: διανοήματα
  choice: echiche
  rationale: “Echiche” na-ekwupụta ihe ha na-atụgharị n’uche n’etinyeghị ebumnobi ọjọọ n’ihe odide ahụ karịa ka Grik si kwuo.
- source_word: Πᾶσα βασιλεία
  choice: Alaeze ọ bụla
  rationale: Nke a na-ejigide ike nkesa nke πᾶσα ma mee ka okwu ahụ bụrụ ilu metụtara alaeze niile.
- source_word: ἐφ’ ἑαυτὴν
  choice: megide onwe ya
  rationale: N’ebe a, ahịrịokwu ahụ na-egosi esemokwu dị n’ime alaeze ahụ, ọ bụghị naanị nkewa nkịtị.
- source_word: διαμερισθεῖσα
  choice: nke kewara
  rationale: Nke a na-egosi na e kewala alaeze ahụ n’ime onwe ya ma kwekọọ na ọdịdị participle nke Grik.
- source_word: ἐρημοῦται
  choice: na-ala n’iyi
  rationale: Nke a na-egosi mbibi na ịghọ ebe tọgbọrọ n’enweghị ịgbanwe okwu ahụ ka ọ bụrụ naanị ‘ịda.’
- source_word: οἶκος ἐπὶ οἶκον
  choice: ụlọ na-adakwasị ụlọ ibe ya
  rationale: Nke a na-edobe ihe atụ pụtara ìhè nke ụlọ na-adakwasị ụlọ ọzọ, ma okwu “ibe ya” na-eme ka ahịrịokwu ahụ doo anya n’Igbo.
- source_word: πίπτει
  choice: na-adakwasị
  rationale: Ngwaa a na-edobe echiche nke ịda n’elu ụlọ ọzọ ma na-ejigide ụdị okwu ilu dị ugbu a.
theological_decisions:
- issue: Ihe οἶκος pụtara n’ahịrị nke abụọ nke ilu ahụ
  choice: E jiri “ụlọ” mee ihe n’isi ederede.
  alternative: “ezinụlọ” ma ọ bụ “ndị otu ụlọ”
  rationale: οἶκος nwere ike ịpụta ụlọ a rụrụ arụ ma ọ bụ ndị bi n’otu ụlọ. Iji “ụlọ” n’isi ederede na-edobe ihe atụ Grik ahụ, ebe nkọwa ala peeji na-echekwa nghọta gbasara ezinụlọ n’enweghị idozi mgbagwoju anya ahụ n’otu ụzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. A haziri ahịrịokwu ahụ dịka ilu, ma e debere mgbagwoju anya dị na οἶκος n’ime nkọwa ala peeji.
