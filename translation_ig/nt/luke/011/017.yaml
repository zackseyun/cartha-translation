    text: A pụkwara ịsụgharị ya, “ezinụlọ na-adakwasị ezinụlọ ọzọ.” Okwu Grik bụ οἶκος nwere ike ịpụta ụlọ a rụrụ arụ ma ọ bụ ezinụlọ/ndị otu ụlọ.
    reason: lexical_alternative
  revision_rationale: The revision represents the emphatic αὐτός with 'ya onwe ya,' removes the potentially causal force of 'ebe,' and replaces the added reciprocal expression 'ibe ya' with 'ọzọ.' It preserves the present-tense proverbial form, the ruin implied by ἐρημοῦται, and the unresolved physical-house/household ambiguity of οἶκος.
