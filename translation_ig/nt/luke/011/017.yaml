revisions:
- from: Ma ebe ọ maara echiche ha, ọ sịrị ha, “Alaeze ọ bụla nke kewara megide onwe ya na-ala n’iyi, ụlọ na-adakwasịkwa ụlọ ibe ya.[a]”
  to: Ma ya onwe ya maara echiche ha, sịrị ha, “Alaeze ọ bụla nke kewara megide onwe ya na-ala n’iyi, ụlọ na-adakwasịkwa ụlọ ọzọ.[a]”
  rationale: The revision represents the emphatic αὐτός with 'ya onwe ya,' removes the potentially causal force of 'ebe,' and replaces the added reciprocal expression 'ibe ya' with 'ọzọ.' It preserves the present-tense proverbial form, the ruin implied by ἐρημοῦται, and the unresolved physical-house/household ambiguity of οἶκος.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the saying''s central sense well: Jesus knows their inner thoughts; a self-opposed kingdom is ruined; and the compressed οἶκος image is retained. However, αὐτός (''he himself'') is not represented, and ''ụlọ ibe ya'' adds a reciprocal/possessive nuance not explicit in οἶκος ἐπὶ οἶκον.'
  naturalness: The Igbo is generally clear and appropriately proverbial. 'Ma ebe ọ maara' can imply a causal sense ('because/since he knew') more strongly than the Greek participle. 'Ma ya onwe ya maara echiche ha, sịrị ha' is natural, concise, and avoids that implication.
  terminology: '''echiche,'' ''alaeze,'' ''megide onwe ya,'' and ''na-ala n’iyi'' are suitable Standard Igbo renderings. ''ụlọ'' appropriately preserves the lexical ambiguity of οἶκος; the footnote can retain ''ezinụlọ'' as an alternative.'
  issues:
  - severity: medium
    issue: αὐτός is omitted.
    rationale: 'The emphatic subject pronoun in αὐτὸς δέ should be represented where naturally possible: ''Ma ya onwe ya...''.'
  - severity: low
    issue: The opening 'Ma ebe ọ maara' may sound causative.
    rationale: Greek εἰδὼς is an attendant/circumstantial participle ('knowing'), not expressly 'because he knew.' A finite Igbo coordination is more neutral.
  - severity: low
    issue: '''ụlọ ibe ya'' adds an explicit reciprocal/possessive relationship.'
    rationale: The Greek says literally 'house upon house falls' and does not contain a possessive equivalent to 'each other's.' 'ụlọ ọzọ' keeps the generic contrast without supplying reciprocity.
  revised_text: Ma ya onwe ya maara echiche ha, sịrị ha, “Alaeze ọ bụla nke kewara megide onwe ya na-ala n’iyi, ụlọ na-adakwasịkwa ụlọ ọzọ.[a]”
  revised_footnotes:
