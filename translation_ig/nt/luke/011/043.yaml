id: LUK.11.43
reference: Luke 11:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: ig
  text: Ahụhụ dịrị unu, ndị Farisii, n’ihi na unu hụrụ oche ndị isi[a] n’ụlọ nzukọ na ka a na-ekele unu n’ámá ahịa[b] n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “oche ndị kacha mma” ma ọ bụ “ebe ndị a na-enye nsọpụrụ.”
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ ekele a na-ekele mmadụ n’ihu ọha iji gosi ya nsọpụrụ na mmata.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ
  choice: Ahụhụ dịrị unu
  rationale: Nke a na-edobe ike okwu amụma nke ịkatọ na ịkpọsa ahụhụ; ọ bụghị naanị okwu mwute dị nro.
- source_word: ὑμῖν τοῖς Φαρισαίοις
  choice: unu, ndị Farisii
  rationale: Ọ na-edobe ịgwa ndị Farisii okwu ihu na ihu n’ụzọ Igbo na-ada nke ọma.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara mkpọsa ahụhụ ahụ n’ụzọ doro anya.
- source_word: ἀγαπᾶτε
  choice: unu hụrụ … n’anya
  rationale: Ọ na-edobe okwu ịhụ n’anya, ma n’ebe a ọ pụtara inwe nnukwu mmasị n’ọkwá na nsọpụrụ.
- source_word: πρωτοκαθεδρίαν
  choice: oche ndị isi
  rationale: Ọ na-ezo aka n’oche ndị e ji enye ndị nwere ọkwá ma ọ bụ nsọpụrụ pụrụ iche, ọ bụghị naanị oche ndị dị n’ihu.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: n’ụlọ nzukọ
  rationale: “Ụlọ nzukọ” bụ okwu Igbo doro anya maka ebe ndị Juu na-ezukọ maka ofufe; asụsụ Igbo achọghị akara ọtụtụ mgbe ihe gbara okwu ahụ gburugburu egosila ya.
- source_word: ἀσπασμοὺς
  choice: ka a na-ekele unu
  rationale: Ụdị ngwaa a na-ada nke ọma n’Igbo ma na-egosi na ha na-achọ ka ndị mmadụ na-ekele ma na-amata ha n’ihu ọha.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: n’ámá ahịa
  rationale: Ọ na-edobe echiche nke ebe ahịa ọha, bụ́ ebe ndị mmadụ na-ezukọ ma na-ahụ ibe ha.
theological_decisions:
- issue: Ụdị ịkatọ Jizọs kwuru
  choice: Mkpọsa ahụhụ dịka nke ndị amụma megide ịhụ nsọpụrụ ọha n’anya
  alternative: Nkatọ nkịtị banyere agwa ọjọọ n’etiti mmadụ na ibe ya
  rationale: οὐαί na ihe kpatara ya na-egosi ikpe omume na nke mmụọ siri ike, ọ bụghị naanị ntụziaka banyere omume ọma n’ihu ọha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere nhazi okwu ịhụ ihe abụọ ahụ n’anya, ma gbanwee “ekele” ka ọ bụrụ “ka a na-ekele unu” ka ọ daa nke ọma n’Igbo ma ghara ịtụfu echiche nke nsọpụrụ ọha.
