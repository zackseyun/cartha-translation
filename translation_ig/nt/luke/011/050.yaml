id: LUK.11.50
reference: Luke 11:50
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: ig
  text: ka e wee kpọọ ọgbọ a ka ọ zaa maka ọbara ndị amụma niile[a], bụ́ nke a wụfuru kemgbe e tọrọ ntọala ụwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka a wee chọọ ọbara ndị amụma niile n’aka ọgbọ a.” Ngwaa Grik ahụ nwere echiche ịkpọ mmadụ ka ọ zaa ajụjụ maka mwụfu ọbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-egosi nzube ma ọ bụ ihe si n’okwu bu ya ụzọ pụta; nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’ike okwu ahụ.
- source_word: ἐκζητηθῇ
  choice: kpọọ ọgbọ a ka ọ zaa maka
  rationale: N’ebe a, ngwaa ahụ nwere echiche ikpe na ịkpọ mmadụ ka ọ zaa ajụjụ maka mwụfu ọbara. Nsụgharị a na-eme ka echiche ahụ doo anya n’Igbo n’ebughị nkọwa ozizi ọzọ bata.
- source_word: τὸ αἷμα
  choice: ọbara
  rationale: E debere okwu nkịtị Grik ahụ; n’ọnọdụ a, ọ na-anọchi anya mwụfu ọbara na ikpe ọmụma metụtara ya.
- source_word: πάντων τῶν προφητῶν
  choice: ndị amụma niile
  rationale: “Niile” na-echekwa oke zuru ezu nke ebubo ahụ.
- source_word: τὸ ἐκκεχυμένον
  choice: bụ́ nke a wụfuru
  rationale: Nke a na-akọwa “ọbara” ma na-eji njikọ Igbo a na-ejikarị eme ihe banyere mwụfu ọbara.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: kemgbe e tọrọ ntọala ụwa
  rationale: Ọ na-echekwa ihe oyiyi nke “ntọala ụwa” ma bụrụkwa okwu Igbo doro anya na nke dị ùgwù.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ọgbọ a
  rationale: E tinyere ya dị ka ndị a na-akpọ ka ha zaa ajụjụ, nke na-egosipụta onye a na-achọ ịnata azịza n’aka ya n’usoro passive nke Grik.
theological_decisions:
- issue: Ụdị ịza ajụjụ maka ọbara ndị amụma
  choice: A sụgharịrị ya dị ka ịkpọ ọgbọ a ka ọ zaa maka mwụfu ọbara ahụ.
  alternative: A pụrụ ịsụgharị ya n’ụzọ nkịtị karịa dị ka ịchọ ma ọ bụ ịnara ọbara ahụ n’aka ọgbọ a.
  rationale: ἐκζητέω n’okwu metụtara ọbara nwere ike ikpe na ịza ajụjụ. Nsụgharị ahụ na-echekwa ike ikpe ahụ, ma ọ naghị akọwapụta otú ọgbọ a si eketa ikpe ọmụma nke ndị gara aga karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Kpọọ … ka ọ zaa maka” na-enye echiche ikpe nke ngwaa Grik n’Igbo eke; e debekwara ihe oyiyi “ọbara” na “ntọala ụwa.”
