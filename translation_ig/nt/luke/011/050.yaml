  source_fidelity: The translation accurately conveys the telic clause and the judicial-accountability force of ἐκζητηθῇ. “kpọọ ọgbọ a ka ọ zaa maka” is an idiomatic Igbo restructuring of the Greek passive, while retaining that this generation is held to account concerning the prophets’ blood. “Ọbara,” “ndị amụma niile,” and “kemgbe e tọrọ ntọala ụwa” preserve the source’s scope and imagery.
  naturalness: The wording is natural, clear Standard Igbo with an appropriately dignified biblical register. The relative expression “bụ́ nke a wụfuru” clearly modifies “ọbara.”
  terminology: 'Key terms are rendered consistently and suitably: “ndị amụma,” “ọbara,” “ọgbọ a,” and “ntọala ụwa.” The footnote responsibly signals a more literal alternative without forcing a theological interpretation.'
