  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: ig
  text: Onye ahụ nke nọ n’ime wee zaa sị, “Enyekwala m nsogbu.[a] E mechiela ọnụ ụzọ ugbua.[b] Ụmụ m na m dina n’àkwà.[c] Enweghị m ike ibili nye gị ihe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Akpatakwala m nsogbu,” ma ọ bụ, “Anọkwala na-enye m nsogbu.” Akpaalaokwu Grik ahụ pụtara n’ụzọ nkịtị “inye nsogbu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “Ọnụ ụzọ emechiela ugbua.” Ngwaa Grik ahụ nwere ike imesi ma omume e mezuru ike (“e mechiela”) ma ọ bụ ọnọdụ si na ya pụta (“emechiela”).
    reason: lexical_alternative
  - marker: c
    text: “Dina n’àkwà” na-ekwu maka ebe ezinụlọ na-ehi ụra ọnụ n’ụlọ; ọ naghị ekwu maka mmekọrịta di na nwunye.
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν
  choice: Onye ahụ nọ n’ime ụlọ
  rationale: “Onye ahụ” na-edobe ntụaka demonstrative nke κἀκεῖνος, ebe “nọ n’ime ụlọ” na-egosi na nzaghachi ahụ si n’ime bịa n’asụsụ Igbo doro anya.
- source_word: ἀποκριθεὶς εἴπῃ
  choice: wee zaa sị
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si ejikọta omume abụọ ahụ—ịza na ikwu—n’akụkọ.
- source_word: Μή μοι κόπους πάρεχε
  choice: Enyekwala m nsogbu
  rationale: Ọ bụ akpaalaokwu Igbo kwekọrọ n’echiche nke ịkpatara mmadụ nsogbu ma ọ bụ inye ya nsogbu, ma ọ naghị atụgharị okwu Grik ahụ n’ụzọ siri ike nke na-agaghị ada mma.
- source_word: ἤδη ἡ θύρα κέκλεισται
  choice: E mechiela ụzọ ugbu a
  rationale: “E mechiela” na-egosi omume e mezuru nke nsonaazụ ya ka dị, ebe “ugbu a” na-ebupụta echiche ἤδη n’ụzọ Igbo na-adị ire.
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: ụmụ mụ na ha dina n’otu ebe
  rationale: Nke a na-egosi na nna ahụ na ụmụ ya nọ n’otu ebe a na-ehi ụra, ma na-ezere nghọta na-ezighị ezi nke okwu metụtara mmekọahụ.
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: Enweghị m ike ibili nye gị ihe
  rationale: Ọ na-edobe enweghị ike e kwuru na Grik na usoro omume ahụ—ibili tupu inye ihe. “Ihe” na-eme ka ihe nnara e hapụrụ n’ọnọdụ okwu pụta nke ọma n’Igbo.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ụzọ” maka ọnụ ụzọ/door dịka ojiji Igbo ebumpụta ụwa; a zere “akpọchiela” n’ihi na κλείω apụtaghị kpọmkwem na e ji mkpọchi kpọchie ya.
