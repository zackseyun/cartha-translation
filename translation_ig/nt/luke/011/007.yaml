revisions:
- from: Onye ahụ nọ n’ime ụlọ wee zaa sị, “Enyekwala m nsogbu.[a] E mechiela ụzọ ugbu a,[b] ụmụ mụ na ha dina n’otu ebe.[c] Enweghị m ike ibili nye gị ihe.”
  to: Onye ahụ nke nọ n’ime wee zaa sị, “Enyekwala m nsogbu.[a] E mechiela ọnụ ụzọ ugbua.[b] Ụmụ m na m dina n’àkwà.[c] Enweghị m ike ibili nye gị ihe.”
  rationale: The revision corrects the unclear children-and-sleeping clause, makes the door reference unambiguous, and renders ἤδη more precisely. It retains the draft’s polite narrative register, the idiomatic refusal, and the necessary supplied object “ihe” in the final Igbo clause, where the Greek object is contextually implicit.
