  text: Ἐν δὲ τῷ λαλῆσαι ⸀ἐρωτᾷ αὐτὸν ⸀Φαρισαῖος ὅπως ἀριστήσῃ παρ’ αὐτῷ· εἰσελθὼν δὲ ἀνέπεσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: ig
  text: Mgbe ọ ka na-ekwu okwu, otu onye Farisii rịọrọ ya ka ọ soro ya rie nri[a]. Ọ banyere, dina n'ebe a na-eri nri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “rie nri ụtụtụ” ma ọ bụ “rie nri n’oge ụtụtụ.” Ngwaa Grik ahụ nwere ike izo aka na nri a na-eri n’isi ụtụtụ, ma n’ebe a ọ na-ekwu n’ozuzu banyere iri nri.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ọ dina n’ebe e debere nri, dịka omenala iri nri n’oge ahụ si dị.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: Mgbe ọ ka na-ekwu okwu
  rationale: Usoro ἐν tinyere infinitive nwere edemede na-egosi na ihe abụọ na-eme n'otu oge; “mgbe ọ ka na-ekwu okwu” na-egosi nke a n'Igbo nkịtị.
- source_word: ἐρωτᾷ
  choice: rịọrọ ya
  rationale: Okwu a pụtara ịrịọ ma ọ bụ ịjụ. Ọ bụ ihe e ji ugbu a kọọ akụkọ n'asụsụ Grik, ma oge gara aga bụ ụzọ Igbo si akọ akụkọ a nke ọma; echiche ọkpụkpọ òkù pụtara site n'okwu ndị na-esochi ya.
- source_word: Φαρισαῖος
  choice: otu onye Farisii
  rationale: Nke a bụ aha otu okpukpe ahụ a na-ejikarị n'Igbo; “otu onye” na-egosi na ọ bụ onye na-akọwaghị aha ya.
- source_word: ὅπως ἀριστήσῃ
  choice: ka ọ bịa soro ya rie nri
  rationale: ἀριστάω nwere ike izo aka na nri ụtụtụ ma ọ bụ nri ehihie, ma “rie nri” anaghị ekpebi oge nri ahụ n'enweghị ihe akaebe zuru ezu.
- source_word: παρ’ αὐτῷ
  choice: soro ya
  rationale: Nke a na-edobe echiche nkịtị nke “ya na ya” ma ghara ịgbakwunye hoo haa na nri ahụ mere n'ụlọ onye Farisii.
- source_word: εἰσελθὼν
  choice: ọ banyere
  rationale: Participụl a na-egosi ihe mere tupu ngwaa bụ isi; “ọ banyere” bụ Igbo doro anya ma dịkwa mfe.
- source_word: ἀνέπεσεν
  choice: daberekwa n'akụkụ tebụl iri nri
  rationale: Ngwaa ahụ na-ezo aka n'ịdabere n'akụkụ ebe iri nri dịka omenala oge ahụ si dị, ọ bụghị nanị ịnọdụ ala; nsụgharị a na-echekwa ọnọdụ ahụ ma mee ka amaokwu ahụ doo anya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ oge nri ahụ n'enweghị nkọwa kpọmkwem, a hapụkwara παρ’ αὐτῷ dịka “soro ya” kama ikwu hoo haa na ọ bụ n'ụlọ ya.
