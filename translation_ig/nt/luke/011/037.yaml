  to: Mgbe ọ ka na-ekwu okwu, otu onye Farisii rịọrọ ya ka ọ soro ya rie nri[a]. Ọ banyere, dina n'ebe a na-eri nri[b].
  rationale: The revision removes the added resultative sense of “Ya mere,” replaces the less natural phrase for reclining with an idiomatic expression that retains the ancient meal posture, and makes minor footnote wording improvements. It does not add a house location, specify the time of day, or alter the historical setting.
