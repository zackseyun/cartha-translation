id: LUK.11.31
reference: Luke 11:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ig
  text: Eze nwanyị nke Ndịda ga-ebili n’ime ikpe ahụ, ya na ndị ikom nke ọgbọ a, ma ga-ama ha ikpe[a], n’ihi na o si na nsọtụ ụwa bịa ịnụ amamihe Solomọn. Ma, lee[b], ihe karịrị Solomọn nọ n’ebe a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, eze nwanyị a na-amakarị dịka Eze Nwanyị Sheba (lee 1 Ndị Eze 10:1–13; 2 Ihe E Mere 9:1–12).
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “onye karịrị Solomọn.” Okwu Grik ahụ dị n’ụdị neuter; n’ụzọ nkịtị, ọ bụ “ihe karịrị Solomọn.” Nke a nwere ike imesi ihe karịrị nanị ntụnyere mmadụ abụọ ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: Eze nwanyị nke Ndịda
  rationale: Ọ na-edobe usoro okwu Grik, ‘eze nwanyị nke Ndịda,’ n’etinyeghị aha eze nwanyị Sheba ozugbo n’ahịrịokwu.
- source_word: ἐγερθήσεται ἐν τῇ κρίσει
  choice: ga-eso ... bilie n’oge ikpe ahụ
  rationale: ‘Bilie’ na-edobe ihe oyiyi nke ibili n’ihu ikpe nakwa ndumodu banyere mbilite n’ọnwụ, ma ọ naghị akọwa ya karịa ihe Grik kwuru.
- source_word: μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης
  choice: ga-eso ndị ikom nke ọgbọ a
  rationale: ‘Ndị ikom’ na-egosipụta kpọmkwem ụdị nwoke nke ἀνδρῶν, ebe ‘ọgbọ a’ na-ezo aka n’ọgbọ ahụ Jizọs na-agwa okwu.
- source_word: κατακρινεῖ αὐτούς
  choice: maa ha ikpe
  rationale: N’Igbo, ‘ịma mmadụ ikpe’ na-egosi ikpe amamikpe, ọ bụghị nanị inyocha okwu ikpe.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: si na nsọtụ ụwa
  rationale: Nke a bụ akpaala okwu doro anya maka ebe dị nnọọ anya ma na-edobe obosara nke γῆς.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: ịnụ amamihe Solomọn
  rationale: Ọ na-edobe ebumnuche ọbịbịa ya na amamihe Solomọn dịka ihe ọ bịara ịnụ.
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: ‘Lee’ bụ okwu Igbo dị ebube ma kwekọọ n’ịkpọ uche ndị na-ege ntị gaa n’okwu kacha mkpa na-esote.
- source_word: πλεῖον Σολομῶνος
  choice: ihe karịrị Solomọn
  rationale: ‘Ihe’ na-edobe ụdị neuter nke πλεῖον, kama ịgbanwe ya ka ọ bụrụ naanị ‘onye karịrị Solomọn.’
- source_word: ὧδε
  choice: nọ n’ebe a
  rationale: Ọ bụ ụzọ Igbo nkịtị ma doo anya isi kwuo na ihe ahụ dị ugbu a n’ebe ahụ.
theological_decisions:
- issue: Ma a ga-akpọ eze nwanyị ahụ Eze Nwanyị Sheba n’ahịrịokwu bụ isi
  choice: Eze nwanyị nke Ndịda
  alternative: Eze Nwanyị Sheba
  rationale: Agba Ochie na-egosi nke ọma onye a na-ekwu maka ya, ma okwu Grik n’onwe ya kwuru ‘eze nwanyị nke Ndịda.’ Ihe odide bụ isi na-edobe okwu ahụ, ebe nkọwa ala peeji na-egosi njikọ ya na Sheba.
- issue: Ma πλεῖον Σολομῶνος ga-abụ ‘onye karịrị Solomọn’
  choice: ihe karịrị Solomọn
  alternative: onye karịrị Solomọn
  rationale: Adjective Grik ahụ bụ neuter. ‘Ihe karịrị’ na-edobe ohere na okwu ahụ na-ezo aka n’ihe karịrị naanị ntụnyere mmadụ na mmadụ—ma n’otu oge ọ naghị egbochi ka onye na-agụ ya ghọta na Jizọs nọ n’etiti ihe a na-ekwu.
- issue: Ma ἐγερθήσεται ga-akọwa mbilite n’ọnwụ kpọmkwem
  choice: ga-eso ... bilie n’oge ikpe ahụ
  alternative: a ga-akpọlite ya n’ọnwụ n’oge ikpe ahụ
  rationale: Ọnọdụ ikpe ikpeazụ nwere ike ime ka e chee banyere mbilite n’ọnwụ, ma ngwaa ahụ nwekwara ike ịpụta ibili ma ọ bụ ịpụta dịka onye akaebe n’ikpe. Nsụgharị ahụ na-edobe ma ihe oyiyi ikpe ma ndumodu eskatọlọjị ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Eze nwanyị,’ ‘ọgbọ,’ ‘n’oge ikpe ahụ,’ na ‘Ma lee’ na-edobe ụda siri ike nke okwu ahụ n’enweghị okwu ụka pụrụ iche. Akara nkọwa [a] na [b] dị n’ahịrịokwu bụ isi.
