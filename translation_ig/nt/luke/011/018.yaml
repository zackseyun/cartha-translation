    reason: alternative_reading
  revision_rationale: Only the verbal form describing Satan’s internal division has been adjusted, from “ekewa” to “ekewaa,” to preserve the passive/resultative sense of the Greek while maintaining natural Standard Igbo. The wording of the accusation and the existing footnote are retained.
