id: LUK.11.18
reference: Luke 11:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: ig
  text: Ma ọ bụrụkwa na Setan ekewaa megide onwe ya, olee otú alaeze ya ga-esi guzo? N’ihi na unu na-ekwu na m na-eji Beelzebul[a] achụpụ ndị mmụọ ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, aha a bụ Beelzebul; ụfọdụ ọdịnala nsụgharị na-eji Beelzebub.
    reason: alternative_reading
lexical_decisions:
- source_word: Σατανᾶς
  choice: Setan
  rationale: E degharịrị aha ahụ n’ụdị a maara nke ọma n’Igbo kama ịsụgharị ya dị ka okwu nkịtị.
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: ekewa megide onwe ya
  rationale: Nke a na-edobe echiche nke nkewa dị n’ime na nke akụkụ ya na-emegide ibe ha, n’enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: πῶς σταθήσεται
  choice: olee otú ... ga-esi guzo
  rationale: Ọ na-edobe ihe atụ nke alaeze ‘iguzo,’ ya bụ ịdịgide ma ghara ịda, nakwa ike ajụjụ ahụ.
- source_word: βασιλεία
  choice: alaeze
  rationale: ‘Alaeze’ bụ okwu doro anya ma bụrụ nke a na-ejikarị akọwa ọchịchị ma ọ bụ ókè ọchịchị n’ọnọdụ a.
- source_word: ἐν Βεελζεβοὺλ
  choice: na-eji Beelzebul
  rationale: N’ebe a ἐν na-egosi onye e kwuru na Jizọs ji ya arụ ọrụ ahụ. Nsụgharị a bụ Igbo e ji eme ihe ma zere ịgbakwụnye okwu ‘ike’ nke na-anọghị kpọmkwem na Grik.
- source_word: ἐκβάλλειν
  choice: achụpụ
  rationale: ‘Ịchụpụ’ na-egosipụta nke ọma omume iwepụ ndị mmụọ ọjọọ.
- source_word: τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo doro ndị na-agụ akwụkwọ anya maka ihe ndị a na-akpọ demons, ma dabara n’ọnọdụ ịchụpụ mmụọ.
theological_decisions:
- issue: Ụdị ebubo ndị na-emegide Jizọs boro ya
  choice: A sụgharịrị ya na ha kwuru na Jizọs na-eji Beelzebul achụpụ ndị mmụọ ọjọọ.
  alternative: Na Jizọs na-achụpụ ndị mmụọ ọjọọ site n’ike Beelzebul.
  rationale: Nhọrọ a na-egosi ọrụ Beelzebul n’ebubo ahụ ma ghara ịgbakwụnye ‘ike’ ma ọ bụ nkọwa nkà mmụta okpukpe karịrị ihe Grik kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke alaeze ‘iguzo’ na esemokwu dị n’echiche nke Setan ikewa megide onwe ya.
