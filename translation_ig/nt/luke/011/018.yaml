- from: Ma ọ bụrụkwa na Setan ekewa megide onwe ya, olee otú alaeze ya ga-esi guzo? N’ihi na unu na-ekwu na m na-eji Beelzebul[a] achụpụ ndị mmụọ ọjọọ.
  to: Ma ọ bụrụkwa na Setan ekewaa megide onwe ya, olee otú alaeze ya ga-esi guzo? N’ihi na unu na-ekwu na m na-eji Beelzebul[a] achụpụ ndị mmụọ ọjọọ.
  rationale: Only the verbal form describing Satan’s internal division has been adjusted, from “ekewa” to “ekewaa,” to preserve the passive/resultative sense of the Greek while maintaining natural Standard Igbo. The wording of the accusation and the existing footnote are retained.
