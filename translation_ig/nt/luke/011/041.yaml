  to: Kama, nyenụ ihe ndị dị n’ime dịka onyinye ebere[a]; ma lee, ihe niile dị ọcha nye unu.
  rationale: The revision changes only the rendering of ἐλεημοσύνην, replacing an unclear expression with a natural Standard Igbo phrase for alms. It preserves the source’s difficult wording “ihe ndị dị n’ime,” the English audit trail’s alternative reading, and the ritual-purity register of the final clause.
