id: LUK.11.41
reference: Luke 11:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: ig
  text: Kama, nyenụ ihe ndị dị n’ime dịka onyinye ebere[a]; ma lee, ihe niile dị ọcha nye unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nyenụ ihe unu nwere dịka onyinye ebere.” Okwu Grik a nwere ike izo aka ma n’ihe dị n’ime ma ọ bụ n’ihe mmadụ nwere n’aka.
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: Kama
  rationale: Ọ na-egosi mmezi nke dị iche n’ihe e kwuru banyere ịsacha akụkụ dị n’èzí; “Kama” na-eweta ntụgharị ahụ n’ụzọ doro anya.
- source_word: τὰ ἐνόντα
  choice: ihe ndị dị n’ime
  rationale: Nke a na-ejigide ọdịdị okwu Grik na njikọ ya na ọdịiche dị n’etiti ihe dị n’èzí na ihe dị n’ime na amaokwu 39, ma ọ naghị emechi ụzọ nghọta ọzọ banyere ihe mmadụ nwere.
- source_word: δότε
  choice: nyenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ ndị; “nyenụ” bụ okwu Igbo nkịtị ma kpọmkwem maka omume inye.
- source_word: ἐλεημοσύνην
  choice: ka ọ bụrụ ebere
  rationale: N’ebe a, aha Grik ahụ na-ezo aka n’inye ndị nọ ná mkpa ihe n’ọrụ ebere. Nkebiokwu a na-eme ka ihe a na-enye bụrụ onyinye ebere, n’agbanyeghị na ọ bụghị kpọmkwem aha onye a na-enye ya ka e kwuru.
- source_word: ἰδοὺ
  choice: ma lee
  rationale: Ọ na-adọta uche gaa n’ihe si na ya pụta ma na-echekwa ike okwu ahụ.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-egosipụta nghọta zuru ezu nke neuter plural Grik n’Igbo eke.
- source_word: καθαρὰ
  choice: dị ọcha
  rationale: Ọ na-echekwa njikọ ya na okwu banyere ịdị ọcha na ịsacha arịa n’amaokwu ndị bu ụzọ.
- source_word: ὑμῖν
  choice: nye unu
  rationale: Ọ na-egosi na ihe niile dị ọcha n’ihe gbasara ndị a na-agwa okwu; ọ bụkwa ụzọ Igbo dị mkpirikpi ma kwekọọ na dative Grik.
theological_decisions:
- issue: Nghọta τὰ ἐνόντα n’ihe gbasara ịdị ọcha na inye onyinye ebere
  choice: “ihe ndị dị n’ime,” nke na-ebute nghọta gbasara ime mmadụ
  alternative: “ihe unu nwere,” nke na-ezo aka n’ihe onwunwe mmadụ nwere n’aka
  rationale: Ọnọdụ okwu ozugbo na-atụnyere akụkụ dị n’èzí na nke dị n’ime iko na efere (Luk 11:39), ya mere isiokwu bụ́ “ihe ndị dị n’ime” na-echekwa ike ịdọ aka ná ntị banyere ime mmadụ. Ma ebe okwu Grik ahụ nwekwara ike ịpụta ihe mmadụ nwere n’aka, e debere nghọta ahụ n’okpuru ala ka a ghara idozi mgbagwoju anya ahụ n’ike.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E ji “ihe ndị dị n’ime” chekwaa nkwughachi nke okwu banyere ime na mpụta; e tinyere akara [a] ozugbo n’isiokwu metụtara nkọwa ọzọ.
