id: LUK.11.20
reference: Luke 11:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ig
  text: Ma ọ bụrụ na m ji mkpịsị aka Chineke[a] achụpụ ndị mmụọ ọjọọ, mgbe ahụ alaeze Chineke abịakwasịla unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site na mkpịsị aka Chineke.” Okwu a na-egosi ike Chineke na-arụ ọrụ kpọmkwem, ma na-echetakwa Ọpụpụ 8:19.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “erutela unu,” ma ọ bụ, “achụkwutela unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: ji mkpịsị aka Chineke
  rationale: “Ji” na-egosi ihe e ji arụ ọrụ ma na-edobe ihe atụ doro anya nke “mkpịsị aka Chineke,” nke na-egosi ike Chineke na-arụ ọrụ kpọmkwem.
- source_word: ἐκβάλλω
  choice: achụpụ
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ịchụ ndị mmụọ ọjọọ ka ha pụọ.
- source_word: τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ ụzọ ndị Igbo na-aghọta nke ọma isi kpọọ mmụọ ndị na-emegide Chineke; a naghị agbanwe ya ka ọ bụrụ okwu Grik ọzọ pụtara “mmụọ na-adịghị ọcha.”
- source_word: ἄρα
  choice: mgbe ahụ
  rationale: 'Ọ na-egosi nkwubi okwu sitere n''okwu ọnọdụ ahụ: ọ bụrụ na nke mbụ bụ eziokwu, nke a so ya.'
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: abịakwasịla unu
  rationale: Ọ na-edobe echiche nke alaeze ahụ erutela ndị na-ege ntị n'ụzọ dị irè na nke mereworị, ma ghara ikpebi ma okwu ahụ ò nwere ụda ikpe.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Ọ bụ okwu Igbo a maara nke ọma nke na-edobe ma echiche ebe ọchịchị dị ma echiche ọchịchị Chineke n'onwe ya.
theological_decisions:
- issue: Ihe “mkpịsị aka Chineke” pụtara
  choice: E debere ya dịka ihe atụ nke ike Chineke na ọrụ ya kpọmkwem.
  alternative: Ịkọwa ya kpọmkwem dịka Mmụọ Nsọ n'ihi Matiu 12:28.
  rationale: Luk ji ihe oyiyi a dee okwu ya; nsụgharị ahụ ekwesịghị iji okwu Matiu dochie ya ma ọ bụ mechie ihe ọ pụrụ ịpụta.
- issue: Ike okwu “alaeze Chineke abịakwasịla unu” nwere
  choice: Ọ na-ekwupụta na alaeze Chineke erutela ndị ahụ ugbu a n'ọrụ Jizọs.
  alternative: Iwere ya naanị dịka ihe ga-eme n'ọdịnihu, ma ọ bụ naanị dịka ikpe bịakwasịrị ha.
  rationale: Ụdị ngwaa Grik na ọnọdụ okwu ahụ na-egosi mbata nke mereworị; ma a hapụrụ obosara okwu ahụ n'Igbo n'enweghị ịmanye usoro nkà mmụta okpukpe pụrụ iche.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere ihe atụ ahụ na nkwupụta banyere mbata alaeze Chineke n'enweghị itinye nkọwa otu ụka ma ọ bụ otu onye n'ime amaokwu ahụ.
