  text: ὁ δὲ Φαρισαῖος ἰδὼν ἐθαύμασεν ὅτι οὐ πρῶτον ἐβαπτίσθη πρὸ τοῦ ἀρίστου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: ig
  text: Ma onye Farisii ahụ, mgbe ọ hụrụ nke a, o juru ya anya na Jizọs ebughị ụzọ saa onwe ya[a] tupu nri ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “emeghị emume ịsa ahụ nke ịdị ọcha tupu nri ahụ.” Ngwaa Grik a bụkwa nke a na-ejikarị ekwu “ime baptizim,” ma n'ebe a ọ na-ekwu maka ịsa ahụ dịka omenala ndị Farisii si edebe ịdị ọcha.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma mgbe
  rationale: Ọ na-egosi ntakịrị mgbanwe ma jikọta ihe onye Farisii mere mgbe ọ hụrụ omume Jizọs.
- source_word: Φαρισαῖος
  choice: onye Farisii ahụ
  rationale: Nke a bụ aha otu ahụ n'Igbo, ebe “ahụ” na-egosipụta artikụl Grik ma na-atụ aka n'onye Farisii a kpọtụrụ aha n'amaokwu gara aga.
- source_word: ἰδὼν
  choice: hụrụ nke a
  rationale: Ọ na-egosi ihe mere tupu isi ngwaa; “nke a” na-anọchi ihe ọ hụrụ site n'ọnọdụ okwu ahụ.
- source_word: ἐθαύμασεν
  choice: o juru ya anya
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi oke ihe ijuanya onye Farisii ahụ nwere.
- source_word: οὐ πρῶτον
  choice: ebughị ụzọ
  rationale: Ọ na-egosi na, dịka atụmanya ya si dị, ịsa ahụ kwesịrị ibu ụzọ mee tupu iri nri.
- source_word: ἐβαπτίσθη
  choice: saa ahụ
  rationale: N'ọnọdụ a, ngwaa ahụ na-ekwu maka ịsa ahụ dịka omenala ịdị ọcha tupu nri, ọ bụghị baptizim Ndị Kraịst; nkọwa ụkwụ na-echekwa njikọ okwu ahụ na baptizim.
- source_word: πρὸ τοῦ ἀρίστου
  choice: tupu nri ahụ
  rationale: Ọ na-echekwa echiche nke nri ahụ n'ebughị ụzọ kpebie ma ọ bụ nri ụtụtụ ma ọ bụ nri ehihie.
theological_decisions:
- issue: Ihe ἐβαπτίσθη pụtara n'ọnọdụ nri ndị Farisii
  choice: ịsa ahụ dịka omenala ịdị ọcha tupu nri
  alternative: ime baptizim ma ọ bụ imikpu onwe ya
  rationale: Ọnọdụ okwu ahụ gbasara omenala ndị Farisii nke ịdị ọcha tupu iri nri, ọ bụghị emume baptizim Ndị Kraịst. Nkọwa ụkwụ na-edobe obosara okwu Grik ahụ n'ebughị ozizi ọzọ bata.
- issue: Onye e zoro aka na ya n'ime ἐβαπτίσθη
  choice: Jizọs
  alternative: ịhapụ nnọchiaha ahụ n'enweghị aha
  rationale: Ụdị ngwaa Grik ahụ bụ onye nke atọ otu, onye a na-ekwu maka ya bụ Jizọs site n'amaokwu gara aga. Iji aha ya mee ihe na-eme ka Igbo doo anya n'enweghị mgbanwe ihe amaokwu ahụ pụtara.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. “Saa ahụ” na-ada n'ụzọ ebumpụta ụwa, ebe nkọwa ụkwụ na-akọwa na ọ bụ ịsa ahụ nke omenala ịdị ọcha.
