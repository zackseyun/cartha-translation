revisions:
- from: Ma mgbe onye Farisii ahụ hụrụ nke a, o juru ya anya na Jizọs ebughị ụzọ saa ahụ[a] tupu nri ahụ.
  to: Ma onye Farisii ahụ, mgbe ọ hụrụ nke a, o juru ya anya na Jizọs ebughị ụzọ saa onwe ya[a] tupu nri ahụ.
  rationale: The revision retains every essential element of the Greek and the English audit trail while using 'saa onwe ya' for a clearer, contextually appropriate expression of ritual washing. The wording does not specify whether hands or the whole body were washed, since the verse itself does not do so. The footnote anchor is moved to cover the complete expression to which the lexical note applies.
  reviewer_model: gpt-5.6-terra
