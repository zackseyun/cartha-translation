id: LUK.11.32
reference: Luke 11:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: ig
  text: Ndị ikom Ninive ga-esoro ọgbọ a bilie n’ime ikpe ahụ, ha ga-ama ya ikpe; n’ihi na ha chegharịrị n’ihi nkwusa Jona. Ma lee, ihe karịrị Jona nọ n’ebe a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye karịrị Jona nọ n’ebe a,” ma ọ bụ “ihe karịa Jona nọ n’ebe a.” Okwu Grik ahụ dị n’ụdị neuter (“ihe ka ukwuu” ma ọ bụ “ihe karịa”), nke nwere ike izo aka n’ụzọ sara mbara n’ihe ka ukwuu dị ugbu a n’ime Jizọs na ozi ya, ọ bụghị naanị n’ịtụnyere otu onye na onye ọzọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Ndị ikom Nineve
  rationale: ἄνδρες bụ ọtụtụ nke na-ezo aka kpọmkwem n’ụmụ nwoke; “ndị ikom Nineve” na-echekwa nkọwa ahụ ma bụrụ Igbo doro anya.
- source_word: ἀναστήσονται
  choice: ga-esoro ... bilie
  rationale: “Bilie” na-echekwa ihe oyiyi nke ἀνίστημι n’ọnọdụ ikpe ikpeazụ, n’akọwaghị ya karịa ederede dịka “a ga-akpọlite ha n’ọnwụ.”
- source_word: ἐν τῇ κρίσει
  choice: n’oge ikpe ahụ
  rationale: Nke a na-egosi ọnọdụ ma ọ bụ oge ikpe ikpeazụ n’Igbo dị ndụ ma na-edebe κρίσις dịka ikpe, ọ bụghị naanị amamikpe.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ga-esoro ọgbọ a
  rationale: “Soro” na-egosipụta mmekọrịta μετά nke genitive—ha na ọgbọ a ga-anọkọ n’oge ikpe.
- source_word: κατακρινοῦσιν αὐτήν
  choice: ha ga-amakwa ya ikpe
  rationale: “Ịma ikpe” na-enye ike nke κατακρίνω, ya bụ ikpe onye ikpe mara; “ya” na-ezo aka n’ọgbọ a.
- source_word: μετενόησαν
  choice: ha chegharịrị
  rationale: “Chegharịa” bụ okwu Igbo a na-ejikarị egosi ntụgharị uche na omume n’ụzọ kwekọrọ na μετανοέω n’ọnọdụ amụma a.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: mgbe ha nụrụ nkwusa Jona
  rationale: Nke a na-eme ka nzaghachi ha nye nkwusa Jona pụta ìhè n’Igbo ebumpụta ụwa, n’etinyeghị ihe karịrị mmekọrịta εἰς na-egosi n’ebe a.
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: “Lee” bụ akara okwu siri ike nke na-adọta uche dịka ἰδού; “Ma” na-ebute ntụnyere ahụ nke ọma.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: ihe karịrị Jona nọ n’ebe a
  rationale: “Ihe” na-echekwa ụdị neuter nke πλεῖον ma hapụ ohere ka okwu ahụ gụnye ma onye Jizọs bụ ma eziokwu ka ukwuu dị n’ọrụ ya, kama ịgbanwe ya ozugbo ka ọ bụrụ “onye karịrị Jona.”
theological_decisions:
- issue: Ihe πλεῖον Ἰωνᾶ na-ezo aka na ya na ike okwu ahụ
  choice: ihe karịrị Jona nọ n’ebe a
  alternative: onye karịrị Jona nọ n’ebe a; ihe dị ukwuu karịa Jona nọ n’ebe a
  rationale: 'πλεῖον bụ neuter singular. Ịsụgharị ya “ihe karịrị Jona” na-echekwa mgbagwoju anya ziri ezi nke Grik: Jizọs doro anya na ọ nọ n’uche, ma okwu ahụ nwekwara ike ịgụnye eziokwu na ọrụ ka ukwuu bịara n’ime ya.'
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E debere “ndị ikom” maka ntụaka nwoke kpọmkwem, “chegharịrị” maka ike ime mmụọ na omume nke μετανοέω, na “ihe karịrị Jona” iji chekwaa ụdị neuter na esemokwu nkà mmụta okpukpe nke isi mmalite.
