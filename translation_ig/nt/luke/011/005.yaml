review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical question, future-oriented setup, midnight timing, request to lend, and three loaves. However, “gaa n’ụlọ enyi ya” specifies the friend’s house, whereas πρὸς αὐτόν means simply “go to him”; the source does not explicitly name a house.
  naturalness: “Gakwuuru ya” is a natural Standard Igbo expression for going to a person and avoids the unsupported locational specification. The rest of the wording is clear and suitably dignified for the passage.
  terminology: “Enyi,” “binye m,” and “ogbe achịcha atọ” suitably render φίλε, χρῆσόν μοι, and τρεῖς ἄρτους. “Enyi m” is a natural vocative and preserves the direct address.
  issues:
  - severity: medium
    issue: “gaa n’ụlọ enyi ya” adds “to the friend’s house.”
    rationale: The Greek πορεύσεται πρὸς αὐτόν states that the person goes to his friend, without specifying the friend’s house. “Gakwuuru ya” retains the source’s scope and is idiomatic Igbo.
  - severity: low
    issue: The footnote’s alternative likewise adds “n’ụlọ ya.”
    rationale: The alternative should not retain an added location absent from the Greek.
