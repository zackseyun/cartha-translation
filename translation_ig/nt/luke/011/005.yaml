source:
  edition: SBLGNT
  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: ig
  text: O wee sị ha[a], “Ònye n’ime unu ga-enwe enyi, gakwuuru ya n’etiti abalị, sị ya, ‘Enyi m, binye m ogbe achịcha atọ,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ònye n’ime unu nwere enyi, gakwuuru ya n’etiti abalị…” Asụsụ Grik ji ụdị oge ọdịnihu mee ajụjụ nkwusiri ike a; n’Igbo, a pụkwara iji oge ugbu a kwuo ya n’ụzọ eke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἐξ ὑμῶν
  choice: Ònye n’ime unu
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ajụ ajụjụ nkwusiri ike a gwara ndị na-ege ntị ozugbo.
- source_word: ἕξει
  choice: ga-enwe
  rationale: E debere ọdịdị oge ọdịnihu nke Grik, ọ bụ ezie na n’ụdị ajụjụ a ọ na-arụ ọrụ dịka ọnọdụ a na-arịọ ndị na-ege ntị ka ha tụlee.
- source_word: φίλον / Φίλε
  choice: enyi / Enyi m
  rationale: “Enyi” bụ okwu Igbo nkịtị maka φίλος. N’ịkpọ mmadụ oku ozugbo, “Enyi m” bụ ụzọ Igbo eke si ekwu ya ma na-echekwa nkwughachi okwu ahụ.
- source_word: πορεύσεται πρὸς αὐτόν
  choice: gaa n’ụlọ enyi ya
  rationale: N’ọnọdụ a, ịgakwuru enyi n’etiti abalị pụtara ịga ebe ọ nọ; “gaa n’ụlọ enyi ya” na-eme ka Igbo bụrụ nke eke ma ghara ịgbanwe ihe omume ahụ.
- source_word: μεσονυκτίου
  choice: n’etiti abalị
  rationale: Nke a na-enye oge ahụ kpọmkwem ma bụrụkwa okwu Igbo a na-aghọta ngwa ngwa.
- source_word: εἴπῃ αὐτῷ
  choice: sị ya
  rationale: “Sị ya” bụ ntụgharị Igbo dị mfe ma kwekọọ na λέγω n’usoro ajụjụ ahụ.
- source_word: χρῆσόν μοι
  choice: binye m
  rationale: Ọ na-egosi arịrịọ ka e nye ya ihe dị ka nke a ga-akwụghachi ma ọ bụ dochie, kama naanị inye ya n’efu.
- source_word: τρεῖς ἄρτους
  choice: ogbe achịcha atọ
  rationale: “Ogbe achịcha” na-egosi achịcha zuru ezu dịka ἄρτος si dị, ọ bụghị naanị iberibe achịcha.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ajụjụ nkwusiri ike na ọdịdị ọdịnihu nke Grik, ma tinye nkọwa ala peeji maka ntụgharị oge ugbu a nke nwekwara ike ịdị eke.
