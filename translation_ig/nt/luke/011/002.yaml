review_pass:
  verdict: approve
  source_fidelity: 'The Igbo follows the SBLGNT closely: it retains the plural address, translates the general temporal condition and imperative appropriately, preserves the shorter vocative “Nna” without adding “anyị,” and renders both petitionary imperatives without expanding their meaning.'
  naturalness: The wording is clear, idiomatic Standard Igbo, with a suitably reverent but contemporary prayer register. “Mgbe unu na-ekpe ekpere, sịnụ” and “Ka alaeze gị bịa” are especially natural. “Ka e doo aha gị nsọ” is a well-established and intelligible passive-petition form.
  terminology: “Nna,” “aha gị,” and “alaeze gị” are sound choices. “Alaeze” appropriately retains the semantic breadth of βασιλεία. The rendering “ka e doo aha gị nsọ” faithfully communicates the hallowing petition without imposing a doctrinal explanation in the text.
