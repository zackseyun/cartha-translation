id: LUK.11.2
reference: Luke 11:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: ig
  text: O wee sị ha, “Mgbe unu na-ekpe ekpere, sịnụ, ‘Nna[a], ka e doo aha gị nsọ[b]. Ka alaeze gị bịa.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ọdịnala nsụgharị na-agụ “Nna anyị,” n’ihi mmetụta nke amaokwu yiri ya na Matiu 6:9; ma ihe odide Grik ebe a nwere naanị “Nna.”
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka a na-ewere aha gị dị ka ihe dị nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν
  choice: Mgbe
  rationale: Ọ na-egosi ọnọdụ oge nke na-emekarị; “mgbe” bụ ụzọ Igbo dị mfe ma kwekọọ n’ọnọdụ a.
- source_word: προσεύχησθε
  choice: unu na-ekpe ekpere
  rationale: Ọ na-egosi omume ndị a na-agwa nwere ike ime ugboro ugboro; usoro a bụ Igbo nkịtị ma doo anya.
- source_word: λέγετε
  choice: sịnụ
  rationale: Ọ bụ iwu a na-enye ọtụtụ mmadụ; “sịnụ” na-egosipụta nke a n’ụzọ Igbo kpọmkwem.
- source_word: Πάτερ
  choice: Nna
  rationale: Ihe odide Grik nwere naanị “Nna,” ọ bụghị “Nna anyị”; e zere ime ka ya na Matiu 6:9 bụrụ otu.
- source_word: ἁγιασθήτω
  choice: ka e doo ... nsọ
  rationale: 'Nke a na-edobe ụdị arịrịọ na echiche passive nke okwu Grik: ka e were aha Chineke dị ka ihe dị nsọ, ọ bụghị na aha ya enweghị ịdị nsọ ugbu a.'
- source_word: τὸ ὄνομά σου
  choice: aha gị
  rationale: A hapụrụ okwu ihe atụ ahụ dịka ọ dị na Grik; ọ gụnyere onye Chineke bụ, nsọpụrụ ya, na otú e si mara ya, n’agbanyeghị na akọwaghị ihe ndị a n’amaokwu ahụ.
- source_word: ἐλθέτω
  choice: ka ... bịa
  rationale: Usoro “ka ... bịa” na-egosipụta arịrịọ ma na-edobe ike nke imperative Grik n’Igbo dị mma.
- source_word: ἡ βασιλεία σου
  choice: alaeze gị
  rationale: “Alaeze” bụ okwu a maara nke ọma ma nwee ike ibu ma ọchịchị Chineke na ebe ma ọ bụ ọnọdụ ọchịchị ya pụtara ìhè; ọ naghị emechi obosara βασιλεία n’otu nkọwa.
theological_decisions:
- issue: Ịkpọ Chineke “Nna” n’etinyeghị “anyị”
  choice: Nna
  alternative: Nna anyị
  rationale: SBLGNT e nyere nwere Πάτερ naanị. Nsụgharị ahụ na-agbaso ihe odide a kama ime ka ya na Matiu 6:9 ma ọ bụ ọdịnala ekpere e mesịrị bụrụ otu.
- issue: Nsụgharị ἁγιασθήτω τὸ ὄνομά σου
  choice: ka e doo aha gị nsọ
  alternative: ka a na-ewere aha gị dị ka ihe dị nsọ
  rationale: Nhọrọ a na-edobe arịrịọ na ụdị passive, ma ghara ikwu na aha Chineke aghaghị isi n’ọnọdụ adịghị nsọ ghọọ nke nsọ.
- issue: Ihe βασιλεία pụtara
  choice: alaeze gị
  alternative: ọchịchị gị
  rationale: “Alaeze” na-edobe ohere nke ma ọchịchị Chineke na mmezu ya nke a na-atụ anya ya, kama ịkọwa okwu ahụ naanị dị ka omume ịchị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu. “Unu” na “sịnụ” na-egosipụta nke ọma na a na-agwa ọtụtụ mmadụ. E debere usoro ekpere ahụ nkenke dịka Grik si dị, ma zere okwu ochie ma ọ bụ nkọwa ụka pụrụ iche.
