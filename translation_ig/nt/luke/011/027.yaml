review_pass:
  verdict: revise
  source_fidelity: 'Ntughari a na-edobe nke ọma isi okwu ahụ: otu nwanyị sitere n’ìgwè mmadụ kpọlitere olu ya ma kpọọ akpa nwa na ara nne Jizọs ndị a gọziri agọzi. Otú ọ dị, «Mgbe» naanị ya ahapụla Ἐγένετο δὲ, nke bụ ntụgharị akụkọ dị na mbido amaokwu ahụ. E tinyela ya n’ụzọ Igbo na-adịghị arọ: «O wee bụrụ...»'
  naturalness: «O wee bụrụ, mgbe ọ na-ekwu ihe ndị a» bụ usoro akụkọ Igbo a na-ahụkarị ma na-edobe omume na-aga n’ihu. «Ìgwè mmadụ» na «weliri olu ya elu» dị mma karịa «igwe mmadụ» na «welie olu ya» n’ebe a. «Ara ndị ị ṅụrụ» na-egosi n’Igbo nkịtị na nwa ahụ ṅụrụ ara ndị ahụ, kwekọọ kpọmkwem na ἐθήλασας.
  terminology: «Ngọzi dịrị» na-edobe uru nkwupụta μακαρία n’enweghị ịgbakwunye nkọwa okpukpe. «Akpa nwa ... buuru gị» na-edobe ihe βᾰστάσασα pụtara n’ọnọdụ ime; nkọwa ala peeji banyere «mụụrụ gị» na-enye nhọrọ «bore» n’enweghị ịgbanwe isi ederede.
  issues:
  - severity: medium
    issue: A hapụrụ Ἐγένετο δὲ n’ederede isi.
    rationale: «Mgbe» na-atụgharị naanị ἐν τῷ λέγειν. Ọ naghị anọchi akara mgbanwe akụkọ «And/Now it happened». «O wee bụrụ» na-eweghachi ya n’ụzọ Igbo nkịtị.
  - severity: low
    issue: «Ara ndị nyere gị mmiri ara» na-eme ka ara bụrụ ndị na-eme omume, ebe Grik na-ekwu kpọmkwem banyere ara ndị Jizọs ṅụrụ.
    rationale: «Ara ndị ị ṅụrụ» bụ Igbo eke ma na-anọchi οὓς ἐθήλασας kpọmkwem.
  revised_text: O wee bụrụ, mgbe ọ na-ekwu ihe ndị a, otu nwanyị si n’etiti ìgwè mmadụ weliri olu ya elu gwa ya, sị, “Ngọzi dịrị akpa nwa buuru gị,[a] na ara ndị ị ṅụrụ.”
