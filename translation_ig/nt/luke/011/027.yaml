  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: ig
  text: O wee bụrụ, mgbe ọ na-ekwu ihe ndị a, otu nwanyị si n’etiti ìgwè mmadụ weliri olu ya elu gwa ya, sị, “Ngọzi dịrị akpa nwa buuru gị,[a] na ara ndị ị ṅụrụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mụụrụ gị.” Okwu Grik a pụrụ ịpụta iburu nwa n’afọ ma ọ bụ ịmụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Mgbe
  rationale: N'Igbo nke oge a, usoro ‘Mgbe ...’ na-ejikọta ihe omume ahụ nke ọma n'akụkọ ma zere ntụgharị siri ike ma ọ bụ nke ochie nke usoro akụkọ Grik.
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: ọ nọ na-ekwu ihe ndị a
  rationale: ‘Nọ na-ekwu’ na-egosi na okwu ahụ ka na-aga n'ihu, dịka articular infinitive nwere ἐν si egosi; ‘ihe ndị a’ na-edobe demonstrative ahụ.
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: otu nwaanyị ... welie olu ya
  rationale: Nke a bụ akpaalaokwu Igbo doro anya maka ikwu okwu n'olu dara ụda; ‘otu nwaanyị’ na-egosipụta τις n'ụzọ nkịtị.
- source_word: ἐκ τοῦ ὄχλου
  choice: si n’etiti igwe mmadụ
  rationale: Ọ na-egosi na nwaanyị ahụ bụ onye nọ n'ime ìgwè ahụ ma si n'ebe ahụ kwuo okwu.
- source_word: Μακαρία
  choice: Ngọzi dịrị
  rationale: Ọ na-edobe echiche nke ịbụ onye a gọziri agọzi ma ọ bụ onye nọ n'ọnọdụ ọma, karịa nanị inwe obi ụtọ.
- source_word: ἡ κοιλία
  choice: akpa nwa
  rationale: N'ọnọdụ gbasara nne na ime, ‘akpa nwa’ bụ okwu Igbo ziri ezi ma doo anya karịa ‘afọ.’
- source_word: ἡ βαστάσασά σε
  choice: buuru gị
  rationale: Ọ na-edobe echiche βαστάζω nke iburu nwa n'afọ, ma na-ahapụkwa njikọ ya na ịmụ nwa ka nkọwa ala peeji kọwaa.
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: ara ndị nyere gị mmiri ara
  rationale: Nke a bụ Igbo nkịtị, dị ùgwù, ma doo anya maka ara nke nwa ṅụrụ; ọ na-edobe ihe oyiyi nne nke Grik n'enweghị ntụgharị siri ike.
theological_decisions:
- issue: Ntụgharị μακαρία n'okwu e ji asọpụrụ nne Jizọs
  choice: Ngọzi dịrị akpa nwa buuru gị, na ara ndị nyere gị mmiri ara.
  alternative: Obi ụtọ dịrị akpa nwa...; Akpa nwa ... bụ nke a gọziri agọzi.
  rationale: ‘Ngọzi dịrị’ na-edobe ike nkwanye ùgwù nke μακαρία, ma ọ dịghị ebelata ma ọ bụ gbakwunye ihe ọmụmụ banyere Meri karịa ihe ederede ahụ kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A tụgharịrị usoro mmalite akụkọ ahụ n'ụzọ Igbo nkịtị kama idobe akpaalaokwu Grik n'ụdị siri ike. E tinyere akara [a] n'ederede isi dịka achọrọ.
