- from: Mgbe ọ nọ na-ekwu ihe ndị a, otu nwaanyị si n’etiti igwe mmadụ welie olu ya gwa ya, sị, “Ngọzi dịrị akpa nwa buuru gị,[a] na ara ndị nyere gị mmiri ara.”
  to: O wee bụrụ, mgbe ọ na-ekwu ihe ndị a, otu nwanyị si n’etiti ìgwè mmadụ weliri olu ya elu gwa ya, sị, “Ngọzi dịrị akpa nwa buuru gị,[a] na ara ndị ị ṅụrụ.”
  rationale: A weghachiri ntụgharị akụkọ Ἐγένετο δὲ, a haziri ụfọdụ okwu ka ha bụrụ Standard Igbo nke eke, ma edobere ihe oyiyi nne na nkọwa leksịkalụ nke Grik. Enweghị mgbanwe n’ihe amaokwu ahụ pụtara.
