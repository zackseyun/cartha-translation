id: LUK.11.51
reference: Luke 11:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: ig
  text: site n'ọbara Ebel ruo n'ọbara Zekaraya[b], onye lara n'iyi n'etiti ebe ịchụ àjà na ụlọ ahụ[a]. Ee, ana m agwa unu, a ga-achọ ọbara ahụ n'aka ọgbọ a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘n'etiti ebe ịchụ àjà na ụlọ nsọ’; n'ụzọ nkịtị, Grik sịrị, ‘n'etiti ebe ịchụ àjà na ụlọ ahụ.’
    reason: lexical_alternative
  - marker: b
    text: Ndị mmadụ na-arụrịta ụka banyere Zekaraya a kpọrọ aha n'ebe a. O nwere ike ịbụ Zekaraya nwa Jehoyada (2 Ihe E Mere 24:20–22) ma ọ bụ Zekaraya nwa Berekaya.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ
  choice: site n'ọbara Ebel
  rationale: Nke a na-edobe njikọ ἀπό na αἷμα, ma na-ada nke ọma n'Igbo; ‘ọbara Ebel’ nwekwara ike ibu echiche nke mwụfu ọbara na ikpe metụtara ya.
- source_word: ἕως αἵματος Ζαχαρίου
  choice: ruo n'ọbara Zekaraya
  rationale: ‘Site ... ruo ...’ na-edobe usoro okwu na oke a na-egosi n'asụsụ Grik.
- source_word: τοῦ ἀπολομένου
  choice: onye lara n'iyi
  rationale: Nke a na-egosi ọnwụ Zekaraya n'ebughị ụzọ kọwaa kpọmkwem onye mere ya, dịka participle Grik ahụ si hapụ onye mere ihe ahụ n'ekwughị ya.
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: n'etiti ebe ịchụ àjà na ụlọ ahụ
  rationale: ‘Ụlọ ahụ’ na-edobe isi okwu οἶκος (‘ụlọ’), ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ụlọ dị n'ụlọ nsọ ka a na-ekwu maka ya.
- source_word: ναί
  choice: Ee
  rationale: Ọ bụ nkwenye siri ike nke dabara n'okwu ikpe a Jizọs na-ekwupụta.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ bụ ụzọ Igbo dị ugbu a, nke doro anya ma dịkwa nso n'ihe Grik ahụ kwuru.
- source_word: ἐκζητηθήσεται
  choice: a ga-achọ ya
  rationale: Ụdị a na-edobe olu nnara nke Grik ma na-egosi na a ga-achọ ịza ajụjụ ma ọ bụ ịkwụ ụgwọ maka ọbara ahụ, n'ekwughị onye ga-achọ ya.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: n'aka ọgbọ a
  rationale: N'okwu Igbo, ‘ịchọ ihe n'aka’ na-egosi onye a ga-achọ ka ọ zaa ajụjụ; ‘ọgbọ a’ na-edobe γενεὰ αὕτη n'enweghị ịgbasa ma ọ bụ ibelata ndị a na-ekwu maka ha.
theological_decisions:
- issue: Onye Zekaraya a bụ na oke ikpe Jizọs kwuru
  choice: A hapụrụ aha Zekaraya n'enweghị ịkọwa onye ọ bụ kpọmkwem; a hapụkwara ‘ọgbọ a’ ka ọ na-ezo aka n'ọgbọ Jizọs na-agwa okwu.
  alternative: Ịkọwa ya dịka Zekaraya nwa Jehoyada, Zekaraya nwa Berekaya, ma ọ bụ dịka onye nnọchianya ndị amụma e gburu.
  rationale: Amaokwu Grik a enyeghị nkọwa ọzọ banyere Zekaraya. Ya mere, nsụgharị ahụ ekwesịghị idozi esemokwu akụkọ ihe mere eme ma ọ bụ itinye usoro ozizi n'okwu ‘ọgbọ a’.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ‘site ... ruo ...’, olu nnara nke ἐκζητηθήσεται, na mgbagwoju anya banyere onye Zekaraya ahụ bụ. E tinyere akara [b] n'aha Zekaraya na [a] n'okwu ‘ụlọ ahụ’ ka akara ọ bụla kwekọọ kpọmkwem na nkọwa ala peeji ya.
