- from: site n'ọbara Ebel ruo n'ọbara Zekaraya[b], onye lara n'iyi n'etiti ebe ịchụ àjà na ụlọ ahụ[a]. Ee, ana m agwa unu, a ga-achọ ya n'aka ọgbọ a.
  to: site n'ọbara Ebel ruo n'ọbara Zekaraya[b], onye lara n'iyi n'etiti ebe ịchụ àjà na ụlọ ahụ[a]. Ee, ana m agwa unu, a ga-achọ ọbara ahụ n'aka ọgbọ a.
