review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the source's rhetorical range ('site ... ruo ...'), the unspecified identity of Zechariah, the literal 'house,' and the passive judicial force of ἐκζητηθήσεται. However, 'a ga-achọ ya' leaves the referent excessively unclear in Igbo and can sound like a simple search rather than a reckoning for shed blood.
  naturalness: The wording is generally fluent, dignified Standard Igbo. Making the object explicit in the final clause gives the judicial idiom a clearer and more natural context without identifying the implied agent.
  terminology: ‘ọbara,’ ‘ebe ịchụ àjà,’ ‘ụlọ ahụ,’ ‘ọgbọ a,’ Ebel, and Zekaraya are appropriate. ‘Onye lara n’iyi’ suitably retains the Greek's non-specific description of his death.
  issues:
  - severity: medium
    issue: The pronoun ‘ya’ in ‘a ga-achọ ya n'aka ọgbọ a’ has an unclear antecedent and weakens the intended sense of bloodguilt being exacted.
    rationale: ἐκζητηθήσεται refers in context to the blood/bloodguilt just enumerated. Explicitly referring to ‘ọbara ahụ’ is a safe contextual clarification and retains the passive, without adding an agent or resolving the historical question.
  revised_text: site n'ọbara Ebel ruo n'ọbara Zekaraya[b], onye lara n'iyi n'etiti ebe ịchụ àjà na ụlọ ahụ[a]. Ee, ana m agwa unu, a ga-achọ ọbara ahụ n'aka ọgbọ a.
