  text: ὁ δὲ Πιλᾶτος εἶπεν πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους· Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: ig
  text: Mgbe ahụ, Paịlet gwara ndị isi nchụaja na ìgwè mmadụ ahụ, “Ahụghị m ihe ndabere ọ bụla iji bo nwoke a ebubo.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ahụghị m mmejọ ọ bụla n’ime nwoke a.” Okwu Grik αἴτιον nwere ike ịpụta “ihe kpatara ebubo” ma ọ bụ “mmejọ”; n’ebe a, ọ na-ekwu maka enweghị ndabere ziri ezi iji bo ya ebubo.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: Njikọ dị nro a na-aga n’ihu n’akụkọ; “Mgbe ahụ” na-egosi usoro ihe mere n’ụzọ Igbo dị mma, n’agbanyeghị na a pụkwara ịsụgharị ya “Ma” ma ọ bụ “Ọzọkwa” n’ọnọdụ ndị ọzọ.
- source_word: Πιλᾶτος
  choice: Paịlet
  rationale: E dere aha onye ahụ n’ụdị ntụgharị mkpụrụokwu a na-ejikarị eme ihe n’Igbo.
- source_word: εἶπεν πρὸς
  choice: gwara
  rationale: “Gwara” bụ ụzọ Igbo sitere n’okike isi kwuo na mmadụ kwuru okwu kpọmkwem nye ndị ọzọ.
- source_word: ἀρχιερεῖς
  choice: ndịisi nchụaja
  rationale: Ọ na-ezo aka n’òtù ndị ndú nchụaja, ọ bụghị ọtụtụ ndị ji naanị otu ọkwa onyeisi nchụaja n’otu oge.
- source_word: ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: Nhọrọ a na-egosipụta ọtụtụ ìgwè mmadụ dị na Greek ma na-ada nke ọma n’Igbo; “ahụ” na-ezo aka n’ìgwè ndị nọ n’ebe ahụ.
- source_word: Οὐδὲν εὑρίσκω
  choice: Ahụghị m ihe ọ bụla
  rationale: Nke a na-eburu nkwupụta Paịlet n’oge ahụ n’ụzọ Igbo sitere n’okike ma debe ike nke nkwụpụ zuru ezu.
- source_word: αἴτιον
  choice: ihe ... a ga-eji bo ... ebubo
  rationale: N’ọnọdụ ikpe a, okwu ahụ pụtara ihe ndabere ziri ezi maka ebubo, ọ bụghị naanị ntụpọ omume n’ozuzu.
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: bo nwoke a ebubo
  rationale: Ọ bụ ezie na ἐν pụtara n’ụzọ nkịtị “n’ime,” okwu ikpe a na-achọ n’Igbo ka e kwuo “bo nwoke a ebubo.” “Nwoke a” na-edebe otu onye nwoke ahụ a na-ekwu maka ya.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma doo ndị nkịtị anya. A họọrọ usoro okwu ikpe sitere n’okike kama ịgbaso “ἐν” n’ụzọ mkpụrụokwu n’ihi na nke ahụ ga-ada ihe ọhụrụ ma ghara ịkọwa echiche ikpe ahụ nke ọma.
