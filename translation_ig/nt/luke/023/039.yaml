  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: ig
  text: Otu n’ime ndị omekome ahụ a kpọgidere nọ na-ekwulu ya, na-asị, “Ọ̀ bụghị gị bụ Mesaịa ahụ[a]? Zọpụta onwe gị na anyị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Kraịst ahụ.” Grik: ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: Otu
  rationale: δέ na-egosi ntakịrị mmegharị ma ọ bụ ọdịiche n’akụkọ ahụ; n’Igbo, ahapụghị ya ka amaokwu ahụ malite n’ụzọ eke n’etinyeghị njikọ siri ike karịa nke Grik.
- source_word: τῶν κρεμασθέντων κακούργων
  choice: n’ime ndị omekome ahụ a kpọgidere n’elu obe
  rationale: κακούργων bụ ndị omekome. κρεμασθέντων pụtara ndị a kwụgidere; n’ọnọdụ ọnwụ n’obe a, ‘a kpọgidere n’elu obe’ na-eme ka ihe a na-ekwu doo onye Igbo anya n’enweghị mgbanwe n’ihe omume ahụ.
- source_word: ἐβλασφήμει
  choice: nọ na-ekwulu
  rationale: N’ebe a, okwu ahụ na-egosi okwu mkparị a na-agwa Jizọs. Usoro ‘nọ na-’ na-egosipụta omume na-aga n’ihu nke imperfect Grik.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha ihe a na-eme ihe na-ezo aka na Jizọs.
- source_word: λέγων
  choice: na-asị
  rationale: Ụzọ akụkọ Igbo si webata okwu onye kwuru n’ụzọ eke.
- source_word: Οὐχὶ σὺ εἶ
  choice: Ọ̀ bụghị gị bụ
  rationale: Na-echekwa ajụjụ ịkwa emo nke na-atụ anya nkwenye, n’egbochighị ihe mgbagwoju anya dị n’olu onye ahụ.
- source_word: ὁ χριστός
  choice: Mesaịa ahụ
  rationale: Χριστός na-arụ ọrụ dị ka utu aha n’ebe a; ‘Mesaịa’ na-echekwa ihe utu aha ahụ pụtara na ndabere ndị Juu.
- source_word: σῶσον
  choice: Zọpụta
  rationale: Na-egosi napụta mmadụ n’ọnwụ dị nso ma na-echekwa njikọ okwu ahụ na echiche nzọpụta sara mbara.
- source_word: σεαυτὸν καὶ ἡμᾶς
  choice: onwe gị na anyị
  rationale: Nsụgharị kwụ ọtọ ma dị eke nke ihe abụọ e nyere iwu ka a zọpụta.
theological_decisions:
- issue: Nsụgharị Χριστός dị ka utu aha
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ajụjụ ịkwa emo a, Χριστός bụ utu aha, ọ bụghị aha onwe onye; ‘Mesaịa’ na-eme ka ihe ọ pụtara na ọnọdụ ndị Juu pụta ìhè.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘ndị omekome’ mee ka κακούργοι doo anya, ebe usoro ‘nọ na-ekwulu’ na-echekwa omume na-aga n’ihu.
