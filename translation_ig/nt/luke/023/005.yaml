  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: ig
  text: Ma ha nọgidere na-ekwusi ike, na-asị, “Ọ na-akpali ndị mmadụ[a] site n’ịkụzi ihe n’ala Judia dum[b], malite na Galili ruo ebe a[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ na-akpalite ndị mmadụ.” Okwu Grik ahụ nwere ike ịpụta ịkpọlite ma ọ bụ ịkpali ndị mmadụ n’ụzọ nwere ike ịkpata ọgba aghara.
    reason: lexical_alternative
  - marker: b
    text: “Judia” nwere ike ịpụta ógbè Judia kpọmkwem, ma n’ọnọdụ ụfọdụ ọ pụkwara izo aka n’ala ndị Juu n’ụzọ sara mbara. N’ebe a, ebubo ahụ na-emesi otú ọrụ ya si gbasaa ike.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ruo kpọmkwem n’ebe a.” Okwu ahụ na-egosi mgbasa site na Galili ruo ebe ha nọ n’ihu Paịlet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: nọgidere na-ekwusi ya ike
  rationale: Oge imperfect na-egosi na ha gara n’ihu na-ekwusi ebubo ahụ ike; nsụgharị a na-egosipụta ma ịdịgide ya ma nrụgide dị n’okwu ha.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-ewebata kpọmkwem ihe ha nọ na-ekwusi ike, ma na-edobe ụdị participle ahụ n’Igbo dị mfe.
- source_word: Ἀνασείει
  choice: na-akpali
  rationale: Okwu ahụ pụtara ịkpọlite ma ọ bụ ịkpalite ndị mmadụ, karịsịa n’ụzọ nwere ike ịkpata ọgba aghara. “Na-akpali” na-edobe ihe atụ na ebubo ahụ n’enweghị ịkọwa ya kpọmkwem dị ka nnupụisi ndọrọ ndọrọ ọchịchị.
- source_word: τὸν λαὸν
  choice: ndị mmadụ
  rationale: N’ebe a, λαός na-ezo aka n’ọha mmadụ n’ozuzu, ọ bụghị naanị otu ìgwè mmadụ gbakọrọ n’otu ebe.
- source_word: διδάσκων
  choice: site n’ịkụzi ihe
  rationale: N’usoro ebubo a, participle ahụ nwere ike igosi ụzọ e si kwuo na ọ na-akpali ndị mmadụ; “site n’ịkụzi ihe” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: n’ala Judia dum
  rationale: Κατά na genitive na-egosi mgbasa n’ebe niile n’ógbè ahụ; okwu a na-egosipụta oke ọrụ ahụ a na-ebo ya ebubo.
- source_word: Ἰουδαίας
  choice: Judia
  rationale: E ji ụdị aha ógbè a a maara nke ọma n’Igbo mee ihe, ma e debeghị n’ime ya mkpebi na ọ bụ naanị ógbè ndịda ka a na-ekwu maka ya.
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: malite na Galili
  rationale: Ἀπό na-egosi ebe mmalite; okwu Igbo a na-edobe Galili dị ka ebe a sịrị na ọrụ ahụ siri malite.
- source_word: ἕως ὧδε
  choice: ruo ebe a
  rationale: Ọ na-egosi na ihe ahụ si Galili gbasaa ruo ebe ha nọ ugbu a n’ihu Paịlet.
theological_decisions:
- issue: Ụdị ebubo e boro Jizọs
  choice: A sụgharịrị ya dịka “na-akpali ndị mmadụ,” n’enweghị ịkpọ ya kpọmkwem nnupụisi ndọrọ ndọrọ ọchịchị.
  alternative: “na-akpalite ndị mmadụ” ma ọ bụ “na-akpali ndị mmadụ ịgba ọgba aghara”
  rationale: Ἀνασείει nwere echiche nke ịkpọlite ma ọ bụ ịkpali n’ụzọ na-akpaghasị, ma okwu ahụ n’onwe ya akọwaghị otu mpụ ndọrọ ndọrọ ọchịchị kpọmkwem. Nsụgharị ahụ na-edobe ebubo siri ike na nghọta abụọ dị n’okwu Grik.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. “Nọgidere na-ekwusi ya ike” na-egosipụta nrụgide na ịdịgide ebubo ahụ; “na-akpali” na-edobe nghọta sara mbara nke okwu Grik, ebe ihe odide ala ala peeji na-akọwa echiche ọgba aghara dị na ya.
