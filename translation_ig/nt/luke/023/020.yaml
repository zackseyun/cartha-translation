- from: Ma Paịlet kpọkuru ha okwu ọzọ[a], n’ihi na ọ chọrọ ịhapụ Jizọs.
  to: Ma Paịlet gwara ha okwu ọzọ[a], na-achọ ịhapụ Jizọs ka ọ laa.
  rationale: The revision replaces the causal connector with an Igbo participial expression corresponding to θέλων, while retaining Pilate’s intention to release Jesus. It also uses a more idiomatic rendering of προσεφώνησεν. The footnote remains anchored to the verb phrase and gives the viable alternative represented by the prior wording.
