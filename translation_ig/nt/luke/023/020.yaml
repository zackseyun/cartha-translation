  text: πάλιν ⸀δὲ ὁ Πιλᾶτος ⸀προσεφώνησεν, θέλων ἀπολῦσαι τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: ig
  text: Ma Paịlet gwara ha okwu ọzọ[a], na-achọ ịhapụ Jizọs ka ọ laa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kpọkuru ha okwu ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-egosi na Paịlet mere otu ihe ahụ ọzọ; “ọzọ” bụ ụzọ Igbo nkịtị si egosipụta nkwughachi a.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere ntụgharị megide mkpu ìgwè mmadụ dị n’okwu gbara amaokwu a gburugburu.
- source_word: Πιλᾶτος
  choice: Paịlet
  rationale: Ụdị aha a bụ nke a na-ejikarị ede Pilate n’Igbo.
- source_word: προσεφώνησεν
  choice: kpọkuru ha okwu
  rationale: Na-egosi na ọ gwara ndị nọ ebe ahụ okwu n’ihu ọha; ọ naghị amanye echiche siri ike karịa nke ngwaa Grik ahụ.
- source_word: θέλων
  choice: n’ihi na ọ chọrọ
  rationale: Na-eme ka ebumnuche Paịlet doo anya n’Igbo dị ugbu a, ma na-echekwa njikọ nke participle ahụ na ngwaa isi.
- source_word: ἀπολῦσαι
  choice: ịhapụ
  rationale: Dabara n’ọnọdụ ikpe na njide, ya bụ ịtọ onye e jidere n’efu.
- source_word: τὸν Ἰησοῦν
  choice: Jizọs
  rationale: Ụdị aha Jizọs a na-ejikarị n’Igbo; edemede Grik ahụ adịghị mkpa n’ihu aha mmadụ n’Igbo.
theological_decisions: []
translation_notes:
  register: Igbo ọkọlọtọ, nke dị mfe ma dị ùgwù. E tinyere “ha” dị ka ihe ngwaa ahụ metụtara site n’ọnọdụ akụkọ ahụ, ebe προσφωνέω pụtara ịkpọku ma ọ bụ ịgwa mmadụ okwu.
