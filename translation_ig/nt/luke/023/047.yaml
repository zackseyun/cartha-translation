    text: Ma ọ bụ, “onye aka ya dị ọcha,” ma ọ bụ “onye ziri ezi.” Okwu Grik a nwere ike ịpụta onye ezi omume ma ọ bụ onye na-enweghị ikpe n’ọnọdụ a.
    reason: lexical_alternative
  revision_rationale: The revision preserves the source's ambiguity in δίκαιος while correcting the footnote's inaccurate and unnatural alternatives. It also makes the designation for the centurion more natural in Standard Igbo without weakening its historical specificity.
