- from: Mgbe onyeisi ndị agha narị ahụ hụrụ ihe mere, o nyere Chineke otuto, sị, “N’ezie, nwoke a bụ onye ezi omume[a].”
  to: Mgbe onyeisi agha narị ahụ hụrụ ihe mere, o nyere Chineke otuto, sị, “N’ezie, nwoke a bụ onye ezi omume[a].”
  rationale: The revision preserves the source's ambiguity in δίκαιος while correcting the footnote's inaccurate and unnatural alternatives. It also makes the designation for the centurion more natural in Standard Igbo without weakening its historical specificity.
