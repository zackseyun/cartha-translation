  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: ig
  text: Mgbe onyeisi agha narị ahụ hụrụ ihe mere, o nyere Chineke otuto, sị, “N’ezie, nwoke a bụ onye ezi omume[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye aka ya dị ọcha,” ma ọ bụ “onye ziri ezi.” Okwu Grik a nwere ike ịpụta onye ezi omume ma ọ bụ onye na-enweghị ikpe n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Mgbe ... hụrụ
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu oge n’Igbo iji gosi na ịhụ ihe ahụ butere omume nke sochiri ya.
- source_word: δὲ
  choice: —
  rationale: δὲ bụ njikọ akụkọ dị nro; ịhapụ ya n’ebe a na-eme ka Igbo dị ire n’enweghị ime ka ọ bụrụ ihe na-emegide ihe bu ụzọ.
- source_word: ἑκατοντάρχης
  choice: onyeisi ndị agha narị
  rationale: Nke a na-akọwa ọkwa onyeisi agha Rom nke na-achị ihe dị ka ndị agha narị, n’asụsụ Igbo doro anya.
- source_word: τὸ γενόμενον
  choice: ihe mere
  rationale: Nkebiokwu a na-ezo aka n’ihe onyeisi agha ahụ hụrụ ka ọ mere; “ihe mere” bụ okwu Igbo dị mfe ma kwekọọ n’isi mmalite.
- source_word: ἐδόξαζεν
  choice: nyere Chineke otuto
  rationale: Nke a na-egosipụta inye Chineke ebube ma ọ bụ otuto n’Igbo nkịtị. Imperfect ahụ ekwesịghị ịgbatị ka ọ bụrụ “malitere inye” ebe ọnọdụ a anaghị achọ ya.
- source_word: λέγων
  choice: sị
  rationale: “Sị” na-ewebata kpọmkwem ihe o kwuru n’ụzọ Igbo dị ire.
- source_word: Ὄντως
  choice: N’ezie
  rationale: Ọ na-egosipụta nkwenye siri ike nke adverb Grik ahụ.
- source_word: ὁ ἄνθρωπος οὗτος
  choice: nwoke a
  rationale: N’ebe a ἄνθρωπος na-ezo aka n’ebe Jizọs nọ dị ka nwoke kpọmkwem.
- source_word: δίκαιος
  choice: onye ezi omume
  rationale: Nhọrọ a na-echekwa echiche banyere ịdị ezi omume, ebe ọ na-ahapụkwa “onye aka ya dị ọcha” dị ka ihe okwu ahụ nwere ike ịpụta n’ọnọdụ ikpe.
- source_word: ἦν
  choice: bụ
  rationale: Copula Igbo “bụ” na-enye echiche gara aga site n’ọnọdụ akụkọ ahụ, n’enweghị ụdị mgbanwe tense pụrụ iche.
theological_decisions:
- issue: Ihe δίκαιος pụtara n’okwu onyeisi agha ahụ
  choice: onye ezi omume
  alternative: onye aka ya dị ọcha; onye ikpe ziri ezi
  rationale: “Onye ezi omume” na-echekwa ịdị arọ nke okwu ahụ n’ihe gbasara omume na okwukwe, ma ihe gbara ikpe Jizọs gburugburu na-eme ka “onye aka ya dị ọcha” bụrụkwa nghọta kwesịrị ekwesị. E debere nhọrọ ndị ahụ n’ala peeji kama ikpebi otu n’ime ha naanị.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji “onyeisi ndị agha narị” kọwaa ọkwa Rom ahụ n’enweghị iji okwu Bekee; e tinyere akara ala peeji ozugbo n’ebe “onye ezi omume” dị, bụ́ okwu ọ na-akọwa.
