  text: εἱστήκεισαν δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς εὐτόνως κατηγοροῦντες αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: ig
  text: Ndị isi nchụàjà na ndị odeakwụkwọ Iwu guzoro n'ebe ahụ, na-ebo ya ebubo nke ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ebo ya ebubo n'ụzọ kpụ ọkụ n'ọnụ” / “na-ebo ya ebubo nke ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: guzoro n'ebe ahụ
  rationale: Ọdịdị ngwaa a na-egosi na ha nọ n'ebe ahụ ka ha guzo; okwu a bụ Igbo nkịtị ma na-edobe ọrụ ya nke ịkọwa ọnọdụ ahụ.
- source_word: δὲ
  choice: (ejighị okwu njikọ pụrụ iche sụgharịa ya)
  rationale: δέ bụ njikọ dị nro na-aga n'ihu n'akụkọ ahụ. N'Igbo, ịmalite ahịrịokwu ozugbo na-eme ka okwu ahụ bụrụ nke eke, n'enweghị ịgbakwunye ọdịiche siri ike nke na-adịghị na Grik.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a na-ezo aka n'ógbè ndị ndú nchụàjà, ọ bụghị na ọtụtụ mmadụ ji otu ọkwa onyeisi nchụàjà n'otu oge.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ Iwu
  rationale: Nke a na-egosi ndị ọkachamara na-ede ma na-akọwa Iwu n'akụkọ Oziọma, ma na-anọgide nso n'echiche 'ndị odeakwụkwọ' karịa nsụgharị na-akọwa ya karịa ihe Grik kwuru.
- source_word: εὐτόνως
  choice: n'ike
  rationale: Adverb a na-egosi ike na ịdị ọkụ nke omume ahụ; 'n'ike' bụ okwu Igbo doro anya nke na-egosipụta ebubo siri ike.
- source_word: κατηγοροῦντες
  choice: na-ebo ... ebubo
  rationale: Ụdị participle dị ugbu a na-egosi omume na-aga n'ihu ka ha guzoro; akpaalaokwu Igbo a na-enye echiche iwu na nke akụkọ nke 'ịkatọ/ibo ebubo' nke ọma.
- source_word: αὐτοῦ
  choice: ya
  rationale: Genitive a so κατηγορέω pụtara onye a na-ebo ebubo; 'ya' dabara n'akpaalaokwu Igbo 'ibo ya ebubo'.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọnọdụ ha guzo na omume ebubo na-aga n'ihu, na-enweghị itinye nkọwa ụka pụrụ iche.
