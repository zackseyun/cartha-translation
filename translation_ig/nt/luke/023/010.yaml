    text: Ma ọ bụ, “na-ebo ya ebubo n'ụzọ kpụ ọkụ n'ọnụ” / “na-ebo ya ebubo nke ọma.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the scene-setting force of εἱστήκεισαν and the ongoing participial action while rendering εὐτόνως as emphatic intensity rather than physical force. The revised footnote supplies alternatives that stay within the Greek semantic range.
