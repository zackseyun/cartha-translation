revisions:
- from: Ndị isi nchụàjà na ndị odeakwụkwọ Iwu guzoro n'ebe ahụ, na-ebo ya ebubo n'ike.[a]
  to: Ndị isi nchụàjà na ndị odeakwụkwọ Iwu guzoro n'ebe ahụ, na-ebo ya ebubo nke ukwuu.[a]
  rationale: The revision preserves the scene-setting force of εἱστήκεισαν and the ongoing participial action while rendering εὐτόνως as emphatic intensity rather than physical force. The revised footnote supplies alternatives that stay within the Greek semantic range.
