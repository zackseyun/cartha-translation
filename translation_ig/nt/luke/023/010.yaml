review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the chief priests, scribes, their presence while standing, and their ongoing accusations against him. However, n'ike can suggest acting by force or compulsion, rather than the emphatic intensity expressed by εὐτόνως.
  naturalness: The sentence is generally clear, idiomatic Standard Igbo, and has an appropriate narrative register. Replacing n'ike with nke ukwuu gives a more direct and natural expression of emphatic accusation in this context.
  terminology: Ndị isi nchụàjà appropriately renders ἀρχιερεῖς, and ndị odeakwụkwọ Iwu is an established, intelligible contextual rendering of γραμματεῖς. The accusation construction na-ebo ya ebubo accurately reflects κατηγοροῦντες αὐτοῦ.
  issues:
  - severity: medium
    issue: The phrase na-ebo ya ebubo n'ike is semantically imprecise for εὐτόνως.
    rationale: In Igbo, n'ike readily evokes doing something forcibly or through coercion. The Greek adverb describes the vigorous, intense manner of their accusations, not necessarily use of force. Nnukwu emphasis is more clearly conveyed by nke ukwuu.
  - severity: low
    issue: The footnote alternative n'ụzọ dị egwu is potentially misleading.
    rationale: It can mean “in a frightening/terrible way,” which does not directly express the forceful intensity of εὐτόνως. A lexical alternative should retain the sense of vigorous or fierce accusation.
  revised_text: Ndị isi nchụàjà na ndị odeakwụkwọ Iwu guzoro n'ebe ahụ, na-ebo ya ebubo nke ukwuu.[a]
  revised_footnotes:
