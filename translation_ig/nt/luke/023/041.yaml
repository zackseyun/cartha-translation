revisions:
- from: Ma anyị onwe anyị na-ata ahụhụ a n'ụzọ ziri ezi, n'ihi na anyị na-anata ihe omume anyị kwesịrị inweta; ma nwoke a emeghị ihe ọ bụla na-ezighị ezi.
  to: Anyị kwa na-ata ahụhụ n'ụzọ ziri ezi, n'ihi na anyị na-anata ihe kwesịrị ekwesị maka ihe anyị mere; ma nwoke a emeghị ihe ọ bụla na-ezighị ezi.
  rationale: The revision corrects the central semantic and idiomatic problem in the clause about receiving what is due for their actions. It retains the present sense of ἀπολαμβάνομεν, the judicial/deserved sense of δικαίως, the demonstrative force of οὗτος, and the restrained statement that Jesus did nothing wrong. No footnotes are necessary in Igbo for this verse.
