id: LUK.23.41
reference: Luke 23:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: ig
  text: Anyị kwa na-ata ahụhụ n'ụzọ ziri ezi, n'ihi na anyị na-anata ihe kwesịrị ekwesị maka ihe anyị mere; ma nwoke a emeghị ihe ọ bụla na-ezighị ezi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαίως
  choice: n'ụzọ ziri ezi
  rationale: Nke a na-egosi na ntaramahụhụ ha na-anata kwekọrọ n'ihe ha mere, ma na-echekwa echiche ikpe ziri ezi dị n'okwu Grik ahụ.
- source_word: ἄξια
  choice: ihe omume anyị kwesịrị inweta
  rationale: Mgbe e jikọtara ya na ἀπολαμβάνομεν, ọ na-egosi ihe kwesịrị ha n'ihi omume ha; ntụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: ὧν ἐπράξαμεν
  choice: omume anyị
  rationale: Nke a na-achịkọta ihe ha mere nke mere ka ntaramahụhụ ahụ ruo ha, n'ụzọ dị mfe nghọta n'Igbo.
- source_word: ἀπολαμβάνομεν
  choice: anyị na-anata
  rationale: Ọ na-echekwa ụdị oge ugbu a, ya bụ na ha nọ ugbu a na-anata ihe si n'omume ha pụta.
- source_word: οὗτος
  choice: nwoke a
  rationale: Ọ na-echekwa ike okwu nrụtụ aka ahụ ma na-eme ka o doo anya na onye ahụ na-ekwu banyere Jizọs.
- source_word: οὐδὲν ἄτοπον
  choice: ihe ọ bụla na-ezighị ezi
  rationale: Nke a bụ okwu Igbo doro anya maka ihe na-adịghị mma ma ọ bụ ihe na-ekwesịghị ekwesị, na-etinyeghị nkọwa iwu karịrị ihe okwu Grik kwuru.
- source_word: ἔπραξεν
  choice: emeghị
  rationale: Ụdị a dabara nke ọma na nkwupụta Igbo banyere ihe onye ahụ na-emebeghị ruo oge ahụ.
theological_decisions:
- issue: Okwu onye omekome banyere ịdị ọcha Jizọs n'okwu ikpe a
  choice: ma nwoke a emeghị ihe ọ bụla na-ezighị ezi
  alternative: ma onye a emeghị ihe ọ bụla na-ekwesịghị ekwesị
  rationale: Nke a na-ekwupụta àmà ahụ n'ụzọ doro anya n'ime ọnọdụ ikpe ahụ, ma ọ naghị ebubata nkwubi okwu ozizi karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu nkịtị nke na-echekwa ọdịiche dị n'etiti ikpe ziri ezi e nyere ndị omekome na nkwupụta na Jizọs emeghị ihe na-ezighị ezi.
