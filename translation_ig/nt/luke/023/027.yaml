  text: Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ καὶ γυναικῶν ⸀αἳ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/027.yaml
  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: ig
  text: Oké ìgwè mmadụ sooro ya, tinyere ụmụ nwanyị ndị na-akụ onwe ha n’obi ma na-akwa arịrị n’ihi ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: sooro
  rationale: Oge imperfect na-egosi omume na-aga n’ihu n’akụkọ ahụ; ụdị ngwaa a bụ ụzọ Igbo nkịtị si akọ ya nke ọma n’ahịrịokwu a.
- source_word: δὲ
  choice: akọwaghị ya iche
  rationale: Ọ na-ejikọta akụkọ na-aga n’ihu, ma Igbo achọghị njikọ pụrụ iche ebe a.
- source_word: αὐτῷ
  choice: ya
  rationale: Ya bụ Jizọs ka igwe mmadụ ahụ na-eso.
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: Oké ìgwè mmadụ
  rationale: Nke a na-enye echiche nke nnukwu ìgwè mejupụtara ndị mmadụ n’ụzọ doro anya ma bụrụ Igbo ebumpụta ụwa.
- source_word: καὶ γυναικῶν
  choice: n’ime ha, e nwekwara ụmụ nwanyị
  rationale: Nke a na-egosi ụmụ nwanyị dị ka ndị so n’ìgwè ahụ, ma kwadebe njikọ kpọmkwem nke nnọchiaha nwanyị na-esote.
- source_word: αἳ
  choice: ndị
  rationale: Njikọ a na-ezo kpọmkwem n’ebe ụmụ nwanyị ahụ nọ.
- source_word: ἐκόπτοντο
  choice: na-akụ aka n’obi ha
  rationale: N’ọnọdụ iru uju, ngwaa a na-ezo aka n’omume iti obi dịka ihe ịrịba ama nke mwute; nsụgharị a na-eme ka omenala ahụ doo onye na-agụ anya.
- source_word: ἐθρήνουν
  choice: na-eruru ya uju
  rationale: Ọ na-egosi ịkwa arịrị na iru uju n’ihi onye ahụ; okwu Igbo a bụ nke a na-aghọta nke ọma.
- source_word: αὐτόν
  choice: ya
  rationale: Ọ bụ Jizọs bụ onye ụmụ nwanyị ahụ na-eruru uju.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ụmụ nwanyị ahụ kpọmkwem dịka ndị na-akụ aka n’obi ha ma na-eru uju, dịka nnọchiaha nwanyị ọtụtụ n’asụsụ Grik si gosi.
