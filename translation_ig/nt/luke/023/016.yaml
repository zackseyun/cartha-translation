  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: ig
  text: N’ihi ya, mgbe m tachara ya ahụhụ[a], aga m atọhapụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe m dọchara ya aka ná ntị” ma ọ bụ “mgbe m tachara ya ahụhụ.” Okwu Grik ahụ nwere ike ịpụta ịdọ mmadụ aka ná ntị ma ọ bụ inye ya ntaramahụhụ iji dozie ya. Ụfọdụ na-aghọta ya n’ebe a kpọmkwem dịka ịpịa ya ụtarị, ma okwu Grik ahụ n’onwe ya sara mbara karịa nke ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: mgbe m nyechara ya ntaramahụhụ
  rationale: N’ọnọdụ ikpe a, ngwaa a na-egosi inye ntaramahụhụ. A sụgharịrị participle a dị ka ihe ga-ebu ụzọ mee tupu a hapụ ya, ma e kwughị kpọmkwem na ọ bụ ịpịa ihe n’ihi na okwu Grik ahụ sara mbara.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu Pilato sitere n’ihe o kwuru tupu nke a.
- source_word: αὐτόν
  choice: ya
  rationale: Nnochiaha a na-ezo aka na Jizọs.
- source_word: ἀπολύσω
  choice: aga m ahapụ ya ka ọ laa
  rationale: N’ọnọdụ iwu na njide, okwu a pụtara ịtọhapụ onye e jidere; nkebiokwu Igbo a na-egosipụta nke ahụ n’ụzọ doro anya ma bụrụkwa nke e ji eme ihe.
theological_decisions:
- issue: Ókè ihe παιδεύω pụtara n’atụmatụ Pilato
  choice: Inye ya ntaramahụhụ n’echiche ikpe na iwu
  alternative: Ịdọ ya aka ná ntị ma ọ bụ ịpịa ya ihe
  rationale: Ọnọdụ ikpe ahụ chọrọ ihe ntaramahụhụ tupu ntọhapụ, ma okwu Grik ahụ n’onwe ya akọwaghị kpọmkwem ụdị ntaramahụhụ ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ntaramahụhụ” chekwaa echiche ikpe dị na gburugburu amaokwu ahụ n’etinyeghị ụdị ntaramahụhụ a na-akọwaghị n’akwụkwọ Grik.
