revisions:
- from: Nwoke a ekwenyeghị n’atụmatụ ha na ihe ha mere. O si Arimatia, obodo ndị Juu, bụrụkwa onye nọ na-atụ anya alaeze Chineke.
  to: Nwoke a ekwenyeghị n’atụmatụ ha na ihe ha mere—ọ bụ onye si Arimatia, obodo ndị Juu, ma na-atụ anya alaeze Chineke.
  rationale: The revision only regularizes the Igbo syntax of the final clause. It keeps Joseph’s refusal to consent distinct from any specific voting procedure, retains Arimathea as a city of the Jews, and expresses the continuing expectation of God’s kingdom.
  reviewer_model: gpt-5.6-terra
