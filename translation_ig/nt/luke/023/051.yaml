id: LUK.23.51
reference: Luke 23:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: ig
  text: Nwoke a ekwenyeghị n’atụmatụ ha na ihe ha mere—ọ bụ onye si Arimatia, obodo ndị Juu, ma na-atụ anya alaeze Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: ekwenyeghị
  rationale: Ọ na-egosi na Josef ajụghị naanị itinye aka, kama na o kweghị n’ihe ha kpebiri; ngwakọta ya na ἦν na-egosi ọnọdụ nkwenyeghị nke malitere tupu mgbe ahụ.
- source_word: βουλῇ
  choice: atụmatụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’uche ma ọ bụ atụmatụ ndị isi ahụ kpebiri, ọ bụghị kansụl dị ka otu ọchịchị.
- source_word: πράξει
  choice: ihe ha mere
  rationale: Nke a na-ekewapụ ihe ha mezuru n’omume n’atụmatụ ha; ọ bụ okwu Igbo doro anya ma dị mfe nghọta.
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: O si Arimatia, obodo ndị Juu
  rationale: Ọ na-edebe nhazi nkọwa nke Grik ma ghara ịkọwa 'ndị Juu' kpọmkwem dị ka agbụrụ ma ọ bụ mpaghara karịa ihe isi mmalite kwuru.
- source_word: προσεδέχετο
  choice: nọ na-atụ anya
  rationale: Ọ na-egosi ọnọdụ na-aga n’ihu nke ichere n’olileanya, dị ka imperfect Grik si egosi.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma ma na-echekwa ịdị arọ na nghọta sara mbara nke okwu ahụ n’Oziọma Luk.
- source_word: οὗτος
  choice: Nwoke a
  rationale: Ọ na-eweghachi Josef e kwuru n’amaokwu gara aga n’ụzọ nwere ntakịrị nkwusi ike, karịa iji naanị nnọchiaha.
theological_decisions:
- issue: Ụdị ụzọ Josef si kewapụ onwe ya n’atụmatụ na omume ndị isi ahụ banyere ọnwụ Jizọs
  choice: E kwuru na o kwenyeghị n’atụmatụ ha na ihe ha mere, n’etinyeghị nkọwa banyere usoro ịtụ vootu.
  alternative: O kwenyeghị ná mkpebi ha na omume ha; ma ọ bụ, o tụghị vootu kwado ha.
  rationale: Grik na-egosi nkwenyeghị ya n’ihe ha zubere na ihe ha mere, ma ọ naghị akọwa kpọmkwem ma e nwere ịtụ vootu ma ọ bụ otú usoro nzukọ ahụ siri gaa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ ahịrịokwu abụọ iji mee ka usoro amaokwu ahụ doo anya n’Igbo, ebe a ka debere njikọ dị n’etiti ebe Josef si na atụmanya ya banyere alaeze Chineke.
