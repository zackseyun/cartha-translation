source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: ig
  text: Mgbe ha na-eduru ya pụọ, ha jidere otu onye Saịrini, aha ya bụ Saịmọn, onye si n'ime obodo[a] na-abịa. Ha bukwasịrị ya obe ahụ ka o buru ya n'azụ Jizọs.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye si n'ubi na-abịa.” Okwu Grik ahụ nwere ike ịpụta otu ubi kpọmkwem ma ọ bụ ime obodo dị n'èzí obodo ukwu n'ozuzu.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-aghọta “obe ahụ” n'ebe a kpọmkwem dịka “osisi gafere n'obe ahụ,” ma ihe odide Grik kwuru naanị “obe ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: na-akpụpụ ya
  rationale: Nke a na-egosi na ha na-eduru Jizọs pụọ dịka onye nọ n'okpuru ikike ha, ma bụrụkwa okwu Igbo dị ndụ n'ọnọdụ a.
- source_word: ἐπιλαβόμενοι
  choice: ha jidere
  rationale: Okwu a na-egosi ijide mmadụ n'ike, ọ bụghị nanị imetụ ya aka.
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: otu nwoke onye Saịrini aha ya bụ Saịmọn
  rationale: Nke a na-ewebata onye a na-amaghịbu ma na-egosikwa njikọ ya na obodo Saịrini n'ụzọ doro anya nye ndị na-agụ Igbo.
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: onye si n'ime ime obodo na-abịa
  rationale: ἀγρός nwere ike ịbụ ubi kpọmkwem ma ọ bụ ime obodo n'ozuzu; nhọrọ a dabara n'echiche nke mmadụ na-abata site n'èzí obodo ma na-edebe mgbagwoju anya ahụ na nkọwa ala peeji.
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: Ha bukwasịrị ya obe ahụ
  rationale: “Bukwasịrị” na-egosi na ha tinyere ibu ahụ n'ahụ ya ka ọ buru ya.
- source_word: τὸν σταυρὸν
  choice: obe ahụ
  rationale: σταυρός pụtara obe; a naghị akọwa ya n'ụzọ karịrị ihe Grik kwuru dịka osisi obe kwụ ọtọ.
- source_word: φέρειν
  choice: ka o buru ya
  rationale: “Ibu” bụ okwu Igbo nkịtị maka iburu ibu n'ahụ.
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: n'azụ Jizọs
  rationale: Nke a na-edebe echiche ọnọdụ ebe Saịmọn nọ n'azụ Jizọs n'usoro njem ahụ.
theological_decisions:
- issue: Ma a ga-akọwa σταυρός dịka obe dum ka ọ bụ osisi obe nke a na-adọkpụ n'akụkụ
  choice: obe ahụ
  alternative: osisi obe ahụ
  rationale: Ihe odide Grik kwuru naanị σταυρός, ya bụ “obe”; ịsị “osisi obe” ga-etinye nkọwa akụkọ ihe mere eme nke amaokwu ahụ n'onwe ya ekwughị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. A họọrọ usoro ahịrịokwu dị mfe nghọta; e debere ma echiche ime obodo/ubi ma obe/osisi obe n'enweghị ịmanye otu nkọwa.
