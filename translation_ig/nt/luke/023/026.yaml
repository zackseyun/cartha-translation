    text: Ma ọ bụ, “onye si n'ubi na-abịa.” Okwu Grik ahụ nwere ike ịpụta otu ubi kpọmkwem ma ọ bụ ime obodo dị n'èzí obodo ukwu n'ozuzu.
    reason: lexical_alternative
