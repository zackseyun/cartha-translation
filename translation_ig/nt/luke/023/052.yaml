  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/052.yaml
  text: This man went to Pilate and asked for the body of Jesus.
translation:
  language: ig
  text: Nwoke a gakwuuru Paịlet rịọrọ ka e nye ya ahụ Jizọs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: Nwoke a
  rationale: Ngosipụta a na-arụtụ aka azụ n'ebe Josef onye Arịmatịa nọ n'amaokwu bu ụzọ; “Nwoke a” na-edowe ike nrụtụaka ahụ ma na-ada nke ọma n'Igbo.
- source_word: προσελθὼν
  choice: gakwuuru
  rationale: Nkebi a na-egosi ihe o mere tupu arịrịọ ahụ; “gakwuuru” bụ ụzọ Igbo doro anya ma dịkwa n'okike isi kwuo na ọ gara bịakwute Paịlet.
- source_word: τῷ Πιλάτῳ
  choice: Paịlet
  rationale: Dative a na-egosi onye ọ gakwuuru. Aha “Paịlet” zuru ezu n'ihi na a matalarị onye a na-ekwu maka ya n'akụkọ ahụ.
- source_word: ᾐτήσατο
  choice: rịọ ya ka o nye ya
  rationale: Ngwaa ahụ pụtara ịrịọ ka e nye mmadụ ihe. Nhazi a bụ Igbo eke nke na-eme ka onye a rịọrọ na ihe a rịọrọ doo anya, n'agbanyeghị na nnọchiaha “ya” na-adabere n'ọnọdụ akụkọ ahụ.
- source_word: τὸ σῶμα
  choice: ahụ
  rationale: “Ahụ” bụ ntụgharị kpọmkwem na nke dị ùgwù maka σῶμα; “ozu” ga-akọwapụta ọnwụ ahụ n'ụzọ siri ike karịa okwu Grik n'onwe ya.
- source_word: τοῦ Ἰησοῦ
  choice: Jizọs
  rationale: N'Igbo, “ahụ Jizọs” na-egosi njikọ genitive a n'ụzọ dị mfe ma bụrụkwa okwu nkịtị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe, dị ùgwù, ma na-agbaso usoro akụkọ. E tinyebeghị ihe nkọwa okpukpe na-adịghị na isi mmalite.
