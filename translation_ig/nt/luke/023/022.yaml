  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: ig
  text: Ọ sịrị ha nke ugboro atọ, sị, “Gịnị mere? Olee ihe ọjọọ nwoke a mere?[a] Ahụghị m n’ime ya ihe ọ bụla ga-eme ka a maa ya ikpe ọnwụ.[b] Ya mere, mgbe m nyechara ya ntaramahụhụ,[c] aga m atọhapụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Gịnị bụ ihe ọjọọ nwoke a mere?” Τί nwere ike ịbụ mkpesa ma ọ bụ ajụjụ dị mkpirikpi nke na-ebute ajụjụ zuru ezu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ọ bụla kpatara ọnwụ,” “ihe ọ bụla kwesịrị ọnwụ,” ma ọ bụ “ihe ndabere ọ bụla maka ikpe ọnwụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “mgbe m tachara ya ahụhụ”; ọ pụkwara ịpụta kpọmkwem, “mgbe m pịachara ya ụtarị.” Okwu Grik παιδεύσας na-egosi ntaramahụhụ e nyere maka ịdọ aka ná ntị ma ọ bụ mmezi, ma okwu ahụ n’onwe ya ekwughị ụdị ntaramahụhụ ahụ kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: nke ugboro atọ
  rationale: Nke a na-egosi na ọ na-ekwu otu ihe ahụ ugboro nke atọ, ma na-ada nke ọma n'Igbo ọkọlọtọ.
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: Gịnị mere? Olee ihe ọjọọ nwoke a mere?
  rationale: “Gịnị mere?” na-echekwa mkpesa dị mkpirikpi nke Τί γὰρ, ebe ajụjụ nke na-esote na-egosipụta κακόν nke ọma dị ka “ihe ọjọọ.”
- source_word: οὐδὲν αἴτιον θανάτου
  choice: ihe ọ bụla kwesịrị ọnwụ
  rationale: N'ọnọdụ ikpe a, okwu a na-egosi na e nweghị ebubo ma ọ bụ ihe ndabere ga-eme ka a maa ya ikpe ọnwụ. Nsụgharị a doro ndị na-agụ Igbo anya ma ghara ịgbasa ihe odide ahụ gabiga ókè.
- source_word: εὗρον ἐν αὐτῷ
  choice: Ahụghị m n’ime ya
  rationale: Ụdị nkwụghachi a bụ ụzọ Igbo si ekwu “achọtaghị m n'ime ya,” ma na-echekwa echiche nke nyocha Pilat rụrụ na mkpebi ya ugbu a.
- source_word: παιδεύσας
  choice: mgbe m nyechara ya ntaramahụhụ
  rationale: N'ọnọdụ a, παιδεύω pụtara inye ntaramahụhụ ma ọ bụ ịta ahụhụ dịka mmezi. Okwu a anaghị ekpebi kpọmkwem ụdị ntaramahụhụ ahụ, ya mere a naghị akọwa ya ozugbo dị ka ịpịa ihe.
- source_word: ἀπολύσω
  choice: aga m ahapụ ya
  rationale: N'ọnọdụ ikpe, nke a pụtara ịhapụ onye e jidere ka ọ laa. Okwu Igbo a bụ nke okike ma doo anya.
theological_decisions:
- issue: Ụdị ihe Pilat chọrọ ime n'okwu παιδεύσας
  choice: Nye ya ntaramahụhụ n'ozuzu, n'ekwughị kpọmkwem ụdị ya.
  alternative: Taa ya ahụhụ; pịa ya ihe.
  rationale: 'Amaokwu ahụ na-echekwa esemokwu dị n''okwu Pilat: ọ sịrị na Jizọs ekwesịghị ọnwụ, ma ọ ka chọrọ inye ya ntaramahụhụ. Okwu Grik ahụ nwere ike ịgụnye ụdị ntaramahụhụ dị iche iche, ya mere isi ederede anaghị eme ka ọ bụrụ naanị ịpịa ihe.'
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. “O wee gwa” dabara n'usoro akụkọ; “ihe kwesịrị ọnwụ” na-eburu ọnọdụ ikpe; a hapụrụ kpọmkwem ụdị ntaramahụhụ ahụ ka ọ bụrụ ihe a na-akọwa n'ala ala peeji.
