  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ha na-eme ihe ndị a mgbe nkụ ka dị mmiri[a][b], gịnị ga-eme mgbe ọ kpọrọ nkụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime nkụ ka dị mmiri ... n’ime nkụ kpọrọ nkụ.” Okwu Grik ahụ na-edobe ihe atụ a n’ụzọ kpọmkwem karịa.
    reason: lexical_alternative
  - marker: b
    text: 'Ihe atụ a yiri ka ọ na-esi n’ihe na-erughị njọ aga n’ihe ka njọ: ọ bụrụ na a na-eme ihe dị otu a n’ihe gbasara nkụ ka dị mmiri, gịnị ga-eme n’ihe gbasara nkụ kpọrọ nkụ? Ederede ahụ akọwaghị kpọmkwem ndị ihe abụọ ahụ nọchiri anya ha.'
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara ịdọ aka ná ntị dị n’amaokwu bu ụzọ, ma na-edobe ike njikọ nke okwu Grik ahụ.
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: mgbe nkụ ka dị ndụ
  rationale: Nke a na-edobe ihe atụ osisi/nkụ nke okwu Grik, ma jiri ụzọ Igbo si akọwa nkụ a ka na-egbutebeghị ogologo oge, nke mmiri ya na-agwụbeghị.
- source_word: ὑγρῷ
  choice: ka dị ndụ
  rationale: N’ọdịiche ya na ξηρός, okwu a na-egosi nkụ ọhụrụ nke mmiri ka dị n’ime ya; ‘ka dị ndụ’ bụ okwu Igbo a na-aghọta nke ọma maka nkụ dị otú ahụ.
- source_word: ξύλῳ
  choice: nkụ
  rationale: N’ebe a ξύλον na-arụ ọrụ dị ka ihe a pụrụ ịkpọ nkụ, ọ bụghị kpọmkwem otu osisi guzo; ‘nkụ’ na-eme ka ọdịiche dị n’etiti nke mmiri dị na ya na nke kpọrọ nkụ pụta ìhè.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: A na-edobe ọtụtụ nke okwu ngosi Grik, nke na-ezo n’ozuzu ya aka n’ihe ndị a na-eme ugbu a.
- source_word: ποιοῦσιν
  choice: ha na-eme
  rationale: Nke a na-edobe onye na-eme ihe ahụ ka ọ ghara ịkọwapụta kpọmkwem, dịka isiokwu nke ngwaa Grik ahụ si dị.
- source_word: ἐν τῷ ξηρῷ
  choice: mgbe ọ kpọrọ nkụ
  rationale: Ọ na-emegharị ọdịiche nke ahịrịokwu mbụ n’Igbo dị mfe ma doo anya, ebe ‘ọ’ na-alaghachi na ‘nkụ.’
- source_word: τί γένηται
  choice: gịnị ga-eme
  rationale: Ajụjụ a na-atụ anya ihe ga-esi na ya pụta; ‘gịnị ga-eme’ na-ebute ike ajụjụ ahụ n’Igbo nke oge a.
theological_decisions:
- issue: Ihe atụ nke nkụ dị ndụ na nkụ kpọrọ nkụ
  choice: E debere ihe atụ ahụ n’ahịrịokwu bụ isi n’enweghị ịkọwa kpọmkwem ndị ihe abụọ ahụ nọchiri anya ha.
  alternative: Ịkọwa Jizọs dịka nkụ dị ndụ na Jerusalem ma ọ bụ ndị ya dịka nkụ kpọrọ nkụ; ma ọ bụ ịkọwa ya naanị dịka ilu si n’ihe nta gaa n’ihe ka njọ.
  rationale: Okwu ahụ yiri ka ọ na-aga site n’ihe na-erughị njọ gaa n’ihe ka njọ, ma ndị ‘nkụ dị ndụ’ na ‘nkụ kpọrọ nkụ’ na-anọchite anya ha abụghị ihe ederede ahụ kọwara hoo haa. Ịhapụ ihe atụ ahụ dịka ọ dị na-echekwa nghọta dị iche iche na esemokwu nkà mmụta okpukpe dị n’ime ya.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. ‘Nkụ ka dị ndụ’ na ‘nkụ kpọrọ nkụ’ na-edobe ihe atụ mbụ ahụ n’enweghị ịtinye nkọwa ụka ọ bụla. E tinyere akara ndetu ala peeji [a] na [b] ozugbo n’ebe ihe atụ ahụ pụtara.
