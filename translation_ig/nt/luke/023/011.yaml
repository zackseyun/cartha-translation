  rationale: E doziri isiokwu nke ngwaa “yikwasịrị” ka ọ bụrụ Herọd n’otu mmadụ, dị ka participle Grik si dị. E mekwara ka ihe odide ala ala ghara ịkọwa uwe ahụ dịka ụdị uwe pụrụ iche. Ihe ndị ọzọ ka edobere n’ihi na ha na-esochi isi mmalite nke ọma ma bụrụ Igbo eke.
