  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: ig
  text: Ma Herọd kwa, ya na ndị agha ya, ledara ya anya ma kwaa ya emo. O yikwasịrị ya uwe mara mma[a], zighachikwa ya na Paịlet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu uwe dị ebube”; λαμπράν nwekwara ike ịpụta “nke na-enwu gbaa.” O yikwara ka uwe ahụ so n’ụzọ Herọd si kwaa Jizọs emo, dị ka à ga-asị na ọ na-enye ya nsọpụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: ledara ya anya
  rationale: Nkebiokwu a na-egosi ile mmadụ anya dị ka onye na-abaghị uru, ya bụ imeso ya nlelị; ọ bụkwa okwu Igbo dị mfe ma kwekọọ na mmechuihu e mere ya n'ihu ọha.
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: ya na ndị agha ya
  rationale: “Ndị agha” bụ ụzọ doro anya, nke oge a, isi kọwaa ndị agha so Herọd mee ihe ahụ.
- source_word: ἐμπαίξας
  choice: kwaa ya emo
  rationale: Nkebiokwu Igbo a na-egosipụta ịkwa mmadụ emo ma dabara n'akwụkwọ banyere ahụhụ Jizọs.
- source_word: περιβαλὼν
  choice: Ha yikwasịrị ya
  rationale: “Yikwasịrị” na-egosi na e tinyere uwe ahụ n'ahụ ya; iji “ha” eme isiokwu na-eme ka Igbo bụrụ nke eke ma na-ezo aka na Herọd na ndị agha ya.
- source_word: ἐσθῆτα λαμπρὰν
  choice: uwe mara mma
  rationale: Nke a na-edobe obosara pụtara uwe na-enwu gbaa ma ọ bụ nke dị ebube/mara mma, n'ekwughị kpọmkwem na ọ bụ otu uwe mwụda eze.
- source_word: ἀνέπεμψεν
  choice: zighachikwa ya
  rationale: N'ọnọdụ ikpe a, okwu ahụ pụtara izighachi Jizọs n'aka onye ọchịchị o si n'aka ya bịa.
- source_word: τῷ Πιλάτῳ
  choice: na Paịlet
  rationale: “Paịlet” bụ nsụgharị ụda aha Πιλᾶτος n'Igbo; “na” dabara n'omume izighachi mmadụ n'aka onye ọzọ.
theological_decisions:
- issue: Ihe uwe ahụ pụtara n'ịkwa Jizọs emo
  choice: E kwuru naanị “uwe mara mma,” nke na-ahapụ ohere maka ebube a na-eme ka à ga-asị na e nyere ya, ma nke bụkwa akụkụ ịkwa emo.
  alternative: Ịkpọ ya kpọmkwem uwe mwụda eze, ma ọ bụ ịkọwa ya dị ka ihe na-egosi ara ma ọ bụ egwuregwu efu.
  rationale: Amaokwu ahụ gosiri nlelị na ịkwa emo, ma Grik ekwughị kpọmkwem ụdị uwe ahụ ma ọ bụ ihe nnọchianya ya; ya mere, nsụgharị ahụ anaghị etinye nkọwa karịrị ihe isi mmalite kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “ledara ya anya” na “kwaa ya emo” maka usoro omume doro anya; a hapụrụ ụdị uwe ahụ ka ọ ghara ịkọwa ihe Grik na-ekwughị.
