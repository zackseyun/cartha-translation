review_pass:
  verdict: revise
  source_fidelity: 'A na-asụgharị isi okwu ndị bụ isi nke ọma: “ledara ya anya” na “kwaa ya emo” na-egosi ἐξουθενήσας na ἐμπαίξας; “ndị agha ya” na-anọchi στράτευμα; “zighachi” na-edobe echiche ἀνέπεμψεν nke iziga onye a laghachi n’aka Paịlet. Otú ọ dị, ngwaa Grik ndị a bụ nke otu onye ma Herọd bụ isiokwu ha, ọbụna mgbe e tinyere “ya na ndị agha ya.” “Ha yikwasịrị” na-agbanwe isiokwu ahụ n’enweghị akara doro anya; e kwesịrị idobe Herọd dịka isiokwu n’usoro Igbo.'
  naturalness: Ntụgharị ahụ dị mfe, dị ugwu, ma bụrụkwa Igbo ọkọlọtọ a na-ahụkarị. Iji “Herọd ... yikwasịrị ... zighachiri” na-eme ka njikọ nke ahịrịokwu ahụ na-aga nke ọma ma kwekọọ n’usoro isiokwu Grik. “Uwe mara mma” bụ okwu eke ma na-ahapụ nkọwa “na-enwu gbaa/dị ebube” ghe oghe.
  terminology: Aha “Herọd” na “Paịlet” dabara. “Ledara ya anya” na “kwaa ya emo” dị mma maka nlelị na ịkwa emo. A gbanwere ihe odide ala ala ka ọ ghara ịkpọ ụdị uwe a “uwe mwụda,” nke nwere ike ịkọwa ụdị uwe karịrị ihe ἐσθῆτα kwuru; “otu uwe dị ebube” na-edobe na ọ bụ uwe/garment n’otu n’enweghị nkọwa karịrị akarị.
  issues:
  - severity: medium
    issue: “Ha yikwasịrị ya” na-eji isiokwu ọtụtụ mmadụ n’ebe περιβαλών dị n’otu mmadụ.
    rationale: N’asụsụ Grik, ἐξουθενήσας, ἐμπαίξας, na περιβαλών bụ participle nke otu nwoke ma na-ezo aka na ὁ Ἡρῴδης. “Ya na ndị agha ya” na-akọ ndị so ya, ma ọ naghị eme ka ndị agha bụrụ isiokwu ngwaa ahụ. Idozi ya na “Herọd ... yikwasịrị ya” na-edobe nhazi na nkọwa isi mmalite.
  - severity: low
    issue: Ihe odide ala ala kwuru “uwe mwụda mara mma” dịka ihe ọzọ nwere ike ịbụ.
    rationale: Grik ἐσθής pụtara uwe/garment, ma ọ dịghị akọwa kpọmkwem ụdị uwe dịka uwe mwụda. Ihe odide ala ala a gbanwere ka o nye “otu uwe dị ebube” kama, ma ka na-edobe nhọrọ “na-enwu gbaa.”
  revised_text: Ma Herọd kwa, ya na ndị agha ya, ledara ya anya ma kwaa ya emo. O yikwasịrị ya uwe mara mma[a], zighachikwa ya na Paịlet.
