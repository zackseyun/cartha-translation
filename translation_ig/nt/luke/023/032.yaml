  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: ig
  text: A nọ na-edukwa mmadụ abụọ ọzọ, bụ ndị omekome[a], soro ya, ka e gbuo ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu a “ndị na-eme ajọ omume” ma ọ bụ “ndị mere ihe ọjọọ.” Okwu Grik ahụ na-ezo aka ná ndị mere ihe ọjọọ, ndị a mara ikpe n’ihi mpụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ka e nye ha ntaramahụhụ ọnwụ.” Okwu Grik ahụ kwuru “ka e gbuo ha”; ọ kọwaghị ụzọ e si egbu ha n’amaokwu a, ọ bụ ezie na ihe gbara ya gburugburu na-egosi ịkpọgide n’obe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: A na-edukwa
  rationale: Ụdị imperfect passive na-egosi omume na-aga n’ihu n’oge gara aga; usoro a na-egosipụta na a nọ na-eduga ha.
- source_word: δὲ καὶ
  choice: -kwa
  rationale: N’ebe a, δέ bụ njikọ dị nro n’akụkọ, καί na-egosikwa na ndị ọzọ sokwa; mgbakwunye -kwa na-enye echiche ahụ n’Igbo n’enweghị ime ka ọ bụrụ nnukwu ọdịiche.
- source_word: ἕτεροι ... δύο
  choice: ndị ọzọ abụọ
  rationale: Nke a na-egosi mmadụ abụọ ọzọ e wezụga Jizọs, ma bụrụkwa usoro okwu Igbo doro anya.
- source_word: κακοῦργοι
  choice: ndị omekome
  rationale: Okwu a na-ezo aka ná ndị mere ajọ omume ma nọ n’okpuru ikpe mpụ; “ndị omekome” bụ okwu Igbo nke oge a, doro anya, ma dabara n’ọnọdụ ikpe.
- source_word: σὺν αὐτῷ
  choice: ha na ya
  rationale: Nke a na-echekwa echiche nke iso ya gaa; itinye “ha” na-eme ka ahịrịokwu ahụ dị mfe nghọta n’Igbo.
- source_word: ἀναιρεθῆναι
  choice: ka e gbuo ha
  rationale: Okwu Grik ahụ pụtara ime ka mmadụ nwụọ n’ọnọdụ a, ma ọ kpọghị kpọmkwem ụzọ e si egbu ya; “ka e gbuo ha” na-echekwa obosara ahụ.
theological_decisions:
- issue: Ma a ga-asụgharị ἀναιρεθῆναι kpọmkwem dị ka ịkpọgide n’obe
  choice: ka e gbuo ha
  alternative: ka a kpọgide ha n’obe
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi ịkpọgide n’obe, ngwaa Grik n’onwe ya pụtara igbu ma ọ bụ ime ka mmadụ nwụọ, ọ bụghị kpọmkwem ịkpọgide n’obe. Nsụgharị ahụ anaghị etinye ihe karịrị ihe okwu ahụ kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “A na-edukwa” chekwaa omume na-aga n’ihu, ma jiri “ndị omekome” maka asụsụ doro anya nke ọnọdụ ikpe. Akara ntụaka [a] na [b] dị n’ederede isi ma kwekọọ na nkọwa ala peeji.
