review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies two others as criminals, preserves the accompaniment with Jesus, and does not over-specify the manner of death. However, “A na-edukwa” normally reads as present or habitual in Standard Igbo and does not adequately carry the narrative imperfect past of Ἤγοντο. “A nọ na-edukwa” naturally conveys an action in progress in past narrative.
  naturalness: The sequence “..., ha na ya, ...” is awkward and the pronoun “ha” is unnecessary. Using “soro ya” idiomatically expresses accompaniment. “mmadụ abụọ ọzọ” is a natural way to state “two others” without introducing a gender not stated by the Greek.
  terminology: “ndị omekome” is an apt modern equivalent for κακοῦργοι in this judicial context. “ka e gbuo ha” appropriately retains the broad sense of ἀναιρεθῆναι without importing crucifixion. Footnote a has been made grammatically clear and its first alternative made more idiomatic.
  issues:
  - severity: medium
    issue: Past imperfect is not clear in “A na-edukwa.”
    rationale: In Standard Igbo, “A na-...” commonly has present or habitual force. The Greek imperfect narrates an ongoing past action; “A nọ na-edukwa” is a safe, idiomatic way to represent that.
  - severity: low
    issue: “ha na ya” is clumsy in this construction.
    rationale: The subject has already been stated and “soro ya” naturally means that they were accompanying/being led along with him.
  - severity: low
    issue: Footnote a contains an awkward expression, “ndị mere ihe ọjọọ ma mara ha ikpe mpụ.”
    rationale: The wording has an unclear subject-object relationship. “ndị a mara ikpe n’ihi mpụ” clearly states criminal condemnation without adding a specific offense.
  revised_text: A nọ na-edukwa mmadụ abụọ ọzọ, bụ ndị omekome[a], soro ya, ka e gbuo ha[b].
