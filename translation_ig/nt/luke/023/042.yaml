  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: ig
  text: O wee sị, “Jizọs, cheta m mgbe ị ga-abịa n’alaeze gị[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide aka na-agụ, “mgbe ị ga-abanye n’alaeze gị”; SBLGNT na-agụ, “mgbe ị ga-abịa n’alaeze gị.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: O wee
  rationale: Na-ejikọta akụkọ ahụ n'ụzọ Igbo si aga were gosi ihe sochiri, n'etinyeghị nkọwa ọzọ.
- source_word: ἔλεγεν
  choice: sị
  rationale: Ọ bụ ezie na imperfect nwere ike ịpụta omume na-aga n'ihu, ‘sị’ bụ ụzọ Igbo nkịtị si webata otu okwu kpọmkwem n'akụkọ.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Ụdị mkpọrọ aha a na-ejikarị na Standard Igbo maka vocative nke aha ahụ.
- source_word: μνήσθητί μου
  choice: cheta m
  rationale: Na-edobe arịrịọ ahụ n'ụzọ dị mfe; o nwere ike ịgụnye ime ihe ọma n'ihi onye ahụ, ma a naghị etinye echiche ahụ n'ụzọ karịrị isiokwu Grik.
- source_word: ὅταν ἔλθῃς
  choice: mgbe ị ga-abịa
  rationale: Na-egosi ọbịbịa a na-atụ anya n'ọdịnihu n'ụzọ Igbo doro anya ma dị ndụ.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: n’alaeze gị
  rationale: Na-agbaso ἐν nke SBLGNT n'ụzọ nkịtị ma na-ahapụ ma echiche ịnọ n'alaeze ma nke ịbịa n'ike ọchịchị ka ha ghara imechi.
theological_decisions:
- issue: Ihe arịrịọ ahụ pụtara banyere ọbịbịa Jizọs na alaeze ya
  choice: A sụgharịrị ya dị ka arịrịọ ka Jizọs cheta ya mgbe ọ ga-abịa n’alaeze ya, n'akwaghị oge ma ọ bụ usoro ihe ga-eme karịa ihe amaokwu ahụ kwuru.
  alternative: Mgbe Jizọs ga-abịa were ike eze ya, ma ọ bụ mgbe ọ ga-abanye n’alaeze ya.
  rationale: Amaokwu ahụ na-ejikọta Jizọs na alaeze a na-atụ anya, ma ọ kọwaghị usoro nkà mmụta banyere ọgwụgwụ ụwa; nsụgharị ahụ na-edobe nghọtahie ahụ ghe oghe.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. ‘O wee sị’ bụ usoro akụkọ nkịtị; ‘alaeze’ na-edobe ma mpaghara eze na ọchịchị eze n'enweghị ịmanye otu nkọwa.
