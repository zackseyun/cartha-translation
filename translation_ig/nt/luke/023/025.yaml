base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: ig
  text: O wee hapụ nwoke ahụ e tinyere n’ụlọ mkpọrọ n’ihi nnupụisi na igbu mmadụ[a], onye ha na-achọ ka a hapụ; ma o nyefere Jizọs ka ọchịchọ ha si dị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ okwu Grik siri sie ike karị: “e tụbara n’ụlọ mkpọrọ.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “ka ha mee ihe ha chọrọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: ọ hapụrụ
  rationale: N’ọnọdụ a, ἀπολύω pụtara ịhapụ onye mkpọrọ ka ọ nwere onwe ya; “ọ hapụrụ” bụ okwu Igbo doro anya ma kwekọọ n’ọrụ ikpe na njide.
- source_word: διὰ στάσιν καὶ φόνον
  choice: n’ihi nnupụisi na igbu mmadụ
  rationale: διά na accusative na-egosi ihe kpatara e ji tụọ ya mkpọrọ. στάσις ebe a bụ nnupụisi megide ọchịchị, ọ bụghị naanị esemokwu.
- source_word: βεβλημένον εἰς φυλακήν
  choice: e tinyere n’ụlọ mkpọrọ
  rationale: Nke a na-egosi na a tụọla ya mkpọrọ ma ọ ka nọ n’ọnọdụ ahụ. Igbo nkịtị na-ekwu “itinye n’ụlọ mkpọrọ”; nkọwa ala peeji na-echekwa ike nke βάλλω, nke pụtara n’ụzọ nkịtị ‘ịtụba.’
- source_word: ὃν ᾐτοῦντο
  choice: bụ́ onye ha nọ na-arịọ ka a hapụ ya
  rationale: Imperfect ᾐτοῦντο na-egosi arịrịọ na-aga n’ihu. E tinyere “ka a hapụ ya” iji mee ka ihe ha na-arịọ doo anya n’Igbo, dịka ọnọdụ amaokwu ahụ si gosi.
- source_word: παρέδωκεν
  choice: o nyefere Jizọs n’aka ha
  rationale: παραδίδωμι pụtara inyefe mmadụ n’aka ndị ọzọ ma ọ bụ n’okpuru ikike ha; okwu a na-echekwa echiche nke nnyefe ikpe.
- source_word: τῷ θελήματι αὐτῶν
  choice: ka ha mee ihe ha chọrọ
  rationale: Nke a bụ ụzọ Igbo dị ndụ isi kwuo ‘nye ya n’uche/ọchịchọ ha,’ ma na-echekwa echiche nke θέλημα dịka ihe ha chọrọ ime.
- source_word: δὲ ... δὲ
  choice: Ya mere ... ma
  rationale: δὲ mbụ na-aga n’ihu n’akụkọ ahụ, ebe nke abụọ na-egosi ọdịiche dị n’etiti ịhapụ nwoke ahụ na inyefe Jizọs.
theological_decisions:
- issue: Ọdịiche dị n’etiti onye nnupụisi a hapụrụ na Jizọs e nyefere
  choice: E mere ka ọdịiche akụkọ ahụ pụta ìhè, ma etinyeghị nkọwa banyere mgbapụta ma ọ bụ na nwoke ahụ nọchiri anya Jizọs.
  alternative: Ịgbakwunye okwu dịka “n’ọnọdụ Jizọs” ma ọ bụ ịkọwa nke a dịka nnọchi aja.
  rationale: Amaokwu ahụ na-akọ ihe Paịlet mere na ihe ndị mmadụ chọrọ; ọ naghị ekwu kpọmkwem ozizi gbasara nnọchi ma ọ bụ mgbapụta.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ “Jizọs” dịka ụdị aha a na-ahụkarị n’Igbo. E ji “bụ́” mee ka njikọ relative doo anya; e zere okwu ụka pụrụ iche na nkọwa ozizi agbakwunyere.
