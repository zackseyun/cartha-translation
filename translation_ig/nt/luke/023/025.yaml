revisions:
- from: Ya mere, ọ hapụrụ nwoke ahụ e tinyere n’ụlọ mkpọrọ n’ihi nnupụisi na igbu mmadụ[a], bụ́ onye ha nọ na-arịọ ka a hapụ ya; ma o nyefere Jizọs n’aka ha ka ha mee ihe ha chọrọ[b].
  to: O wee hapụ nwoke ahụ e tinyere n’ụlọ mkpọrọ n’ihi nnupụisi na igbu mmadụ[a], onye ha na-achọ ka a hapụ; ma o nyefere Jizọs ka ọchịchọ ha si dị[b].
  rationale: E dochiri njikọ nsonaazụ “Ya mere” anya site n’“O wee,” nke kwekọrọ nke ọma na δέ. E gbanwere “ka ha mee ihe ha chọrọ” n’ederede ka ọ bụrụ “ka ọchịchọ ha si dị” iji gosipụta θέλημα (“ọchịchọ, uche”) n’ụzọ dị nso karị na Grik, ebe a na-edobe ụzọ ọzọ dị mfe n’ala peeji. E debere “onye ha na-achọ ka a hapụ” n’ihi na Igbo chọrọ ka e kwuo ihe arịrịọ ahụ bụ n’ụzọ doro anya, ebe ọnọdụ amaokwu ahụ na-enye ya.
