  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: ig
  text: Jizọs wee tie mkpu n’oké olu sị, “Nna, ana m enyefe[a] mmụọ m n’aka gị.”[b] Mgbe o kwusịrị nke a, ọ kupụrụ ume ikpeazụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ana m etinye mmụọ m n’aka gị ka i lekọta ya.” Ngwaa ahụ nwere ike ịpụta inyefe ihe n’aka onye ọzọ ka ọ na-elekọta ya.
    reason: lexical_alternative
  - marker: b
    text: 'Okwu a na-akpọghachi okwu dị n’Abụ Ọma 31:5 na nsụgharị Grik nke Abụ Ọma ahụ: “Ana m enyefe mmụọ m n’aka gị.”'
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsị, “ọ nwụrụ.” N’ụzọ nkịtị, ngwaa Grik ahụ na-ezo aka n’ikupụ ume.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: tie mkpu n’oké olu
  rationale: Nkebiokwu a na-egosi na Jizọs kpọpụtara okwu ahụ n’olu dara ụda. “Tie mkpu n’oké olu” bụ Igbo doro anya nke na-echekwa ike na ịdị elu nke olu ahụ.
- source_word: Πάτερ
  choice: Nna
  rationale: Ọ bụ okwu a na-akpọ onye ihu na ihu; Grik etinyeghị “m,” ya mere a gbakwụnyeghị “Nna m.”
- source_word: εἰς χεῖράς σου
  choice: n’aka gị
  rationale: Ọ bụ ezie na Grik ji “aka” n’ụdị ọtụtụ, “n’aka gị” bụ akpaalaokwu Igbo ebumpụta ụwa maka itinye ihe nlekọta na ikike mmadụ; ọ ka na-echekwa ihe oyiyi nke Abụ Ọma 31:5.
- source_word: παρατίθεμαι
  choice: ana m enyefe
  rationale: Okwu Grik a pụtara itinye ihe n’aka onye ọzọ ka ọ lekọta ya. Ụdị ugbu a na-egosi omume Jizọs ji aka ya na-eme n’okwu ahụ.
- source_word: τὸ πνεῦμά μου
  choice: mmụọ m
  rationale: “Mmụọ m” na-echekwa ohere nghọta nke πνεῦμα n’ebe a karịa ime ka ọ bụrụ naanị ume anụ ahụ, n’ihi na Jizọs na-agwa Nna okwu ma na-enyefe onwe ya n’aka ya.
- source_word: τοῦτο δὲ εἰπών
  choice: Mgbe o kwusịrị nke a
  rationale: Nke a na-egosi na okwu ahụ buru ụzọ mee tupu omume nke ngwaa isi, ma ọ bụkwa Igbo dị mfe ma doo anya.
- source_word: ἐξέπνευσεν
  choice: ọ kupụrụ ume ikpeazụ
  rationale: Nsụgharị a na-echekwa ihe oyiyi nke ikupụ ume nke dị na ngwaa Grik, ma na-eme ka o doo anya na ọ nwụrụ.
theological_decisions:
- issue: Otú e si sụgharịa πνεῦμά μου n’okwu ikpeazụ Jizọs
  choice: mmụọ m
  alternative: ume m
  rationale: Ọnọdụ ekpere ahụ na omume Jizọs nke ịtụkwasị onwe ya n’aka Nna na-akwado “mmụọ m,” ma nsụgharị ahụ anaghị akọwa n’ụzọ karịrị ihe amaokwu ahụ kwuru.
- issue: Ike na oge nke παρατίθεμαι
  choice: ana m enyefe
  alternative: m na-etinye n’aka gị ka i lekọta
  rationale: Ụdị ugbu a na olu etiti nke Grik na-egosi nkwupụta Jizọs ji uche ya na-eme n’oge ahụ. “Ana m enyefe” bụ Igbo dị nkenke nke na-echekwa ebumnobi ahụ.
- issue: Ihe ἐξέπνευσεν pụtara
  choice: ọ kupụrụ ume ikpeazụ
  alternative: ọ nwụrụ
  rationale: Nhọrọ a na-egosi ọnwụ ya n’enweghị mgbagwoju anya, ma ọ na-echekwa njikọ ngwaa Grik ahụ na ikupụ ume.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “n’aka gị” dịka akpaalaokwu Igbo ebumpụta ụwa kama ịmanye ụdị ọtụtụ nke “aka” dị na Grik. Akara nkọwa ala ala [a], [b], na [c] niile dị n’ebe kwesịrị ekwesị n’ederede isi.
