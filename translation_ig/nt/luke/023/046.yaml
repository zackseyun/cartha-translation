  verdict: revise
  source_fidelity: 'Ederede isi na-anọchi anya ihe Grik ahụ n''ụzọ ziri ezi: “tie mkpu n’oké olu” na-egosi φωνήσας φωνῇ μεγάλῃ; “Nna” anaghị atụkwasị possessive na-adịghị na Grik; “mmụọ m” na-echekwa πνεῦμά μου; “M mgbe o kwusịrị...” na-egosi omume bu ụzọ; “ọ kupụrụ ume ikpeazụ” na-egosi ἐξέπνευσεν n’ụzọ doro anya. “N’aka gị” bụ akpaalaokwu Igbo sitere n’okike, ọbụna ebe Grik ji ọtụtụ ‘aka.’'
  naturalness: Igbo ederede isi bụ Standard Igbo dị mma, dị ùgwù, ma dịkwa mfe ịgụ. “Ana m enyefe” dabara n’okwu nkwupụta a, ọ bụ ezie na ọ nwere ntakịrị ụda omume na-aga n’ihu; nke a anaghị agbanwe ihe pụtara.
  terminology: 'Aha “Jizọs,” okwu ịkpọ “Nna,” na okwu dị mkpa “mmụọ” dị mma. Ọ dị mkpa idozi nkọwa ala b: amaokwu a anaghị ekwughachi naanị ‘echiche’ nke Abụ Ọma; ọ na-akpọghachi okwu ya, kpọmkwem n’ụdị Grik nke Abụ Ọma. “N’Akwụkwọ Nsọ Grik” nwekwara ike ịda ka ọ na-ekwu maka korpus dum kama nsụgharị Grik nke Abụ Ọma ahụ.'
