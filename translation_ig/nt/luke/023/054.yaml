  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: ig
  text: Ọ bụ ụbọchị Nkwadebe, ụbọchị izu ike ahụ na-amalitekwa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “ụbọchị izu ike ahụ na-abọ.” Ngwaa Grik ahụ pụrụ ịpụta “na-abọ” ma ọ bụ “na-amalite”; n'ebe a, ọ na-ekwu banyere mmalite ụbọchị izu ike n'uhuruchi.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρασκευῆς
  choice: ụbọchị Nkwadebe
  rationale: Nke a na-edobe echiche okwu Grik ahụ banyere ụbọchị a na-akwadebe ihe tupu ụbọchị izu ike, kama iji naanị ‘Fraịdee,’ nke bụ nkọwa dabere n'ọnọdụ.
- source_word: σάββατον
  choice: ụbọchị izu ike ahụ
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke ndị Igbo taa na-aghọta maka Sabbath kwa izu; ‘ahụ’ na-egosi na ọ bụ ụbọchị a maara nke ọma n'ọnọdụ akụkọ a.
- source_word: ἐπέφωσκεν
  choice: amalitewokwa
  rationale: Ọ bụ ezie na ngwaa Grik ahụ pụrụ ịpụta ‘na-abọ,’ n'ebe a ọ na-ekwu banyere mmalite ụbọchị izu ike n'uhuruchi. Nsụgharị a na-ezere ime ka onye na-agụ ya chee na ọ bụ ụtụtụ.
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: Ọ bụ ụbọchị Nkwadebe
  rationale: Nkebiokwu a bụ Igbo ebumpụta ụwa ma na-echekwa aha ụbọchị ahụ na ọrụ ya.
- source_word: καὶ
  choice: Ọ bụ …, … -kwokwa
  rationale: E gosipụtara njikọ nke nkebiokwu abụọ ahụ n'ụzọ dabara n'asụsụ Igbo, na-enweghị ịmanye ka ‘na’ pụta ugboro abụọ.
theological_decisions:
- issue: Ihe ἐπέφωσκεν pụtara banyere mgbe ụbọchị izu ike malitere
  choice: Ụbọchị izu ike ahụ na-amalite n'uhuruchi.
  alternative: Ụbọchị izu ike ahụ na-abọ.
  rationale: N'usoro ndị Juu si agụ ụbọchị, ụbọchị ọhụrụ na-amalite n'uhuruchi. ‘Amalitewokwa’ na-enye echiche ahụ n'ụzọ doro anya, ebe ihe okwu Grik ahụ pụtara n'ụzọ nkịtị dị n'ihe odide ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E jiri ‘ụbọchị izu ike’ mee ka okwu ahụ ghọta ozugbo, ebe ‘ụbọchị Nkwadebe’ na-echekwa aha ụbọchị ahụ na echiche isi mmalite ya.
