  yaml_path: translation/nt/luke/023/021.yaml
  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: ig
  text: Ma ha nọgidere na-eti mkpu, na-asị, “Kpọgide ya n’obe! Kpọgide ya n’obe!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ doro anya karị, “Gbuo ya site n’ịkpọgide ya n’obe! Gbuo ya site n’ịkpọgide ya n’obe!”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ma ha
  rationale: “Ha” na-ezo aka n’ìgwè mmadụ e kwuru okwu ha n’amaokwu ndị bu ụzọ; “Ma” na-egosi ọdịiche dị nro n’etiti arịrịọ ha na okwu Paịlet kwuru tupu nke a.
- source_word: ἐπεφώνουν
  choice: nọgidere na-eti mkpu
  rationale: Oge imperfect na-egosi omume gara n’ihu ma ọ bụ nke e mere ugboro ugboro; “na-eti mkpu” na-egosikwa na ha kpọrọ ya n’olu dara ụda.
- source_word: λέγοντες
  choice: na-asị
  rationale: Nke a bụ participle na-eme n’otu oge ahụ ha na-eti mkpu, ma na-ewebata kpọmkwem ihe ha kwuru.
- source_word: Σταύρου σταύρου
  choice: Kpọgide ya n’obe! Kpọgide ya n’obe!
  rationale: σταυρόω pụtara igbu mmadụ site n’ịkpọgide ya n’obe. Ikwughachi iwu ahụ na-echekwa ngwa ngwa na nkwụsi ike dị n’okwu ìgwè mmadụ; itinye “ya” n’ahịrịokwu abụọ ahụ bụ usoro Igbo doro anya ma dị eke.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a bụ onye a chọrọ ka e mee ihe ahụ, ya bụ Jizọs; “ya” bụ ntụgharị kpọmkwem na nke eke n’Igbo.
theological_decisions:
- issue: Otú e si sụgharịa arịrịọ igbu mmadụ σταύρου
  choice: Kpọgide ya n’obe
  alternative: Gbuo ya n’elu obe
  rationale: “Kpọgide ya n’obe” na-egosi kpọmkwem ụdị ntaramahụhụ σταυρόω pụtara, n’etinyeghị nkọwa nkà mmụta okpukpe ọzọ. Nhọrọ nke ọzọ na-akọwa ihe ahụ nke ọma, ma ọ bụghị usoro okwu kacha nso na ngwaa Grik.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke iwu ahụ iji chekwaa ike na nkwụsi ike nke mkpu ìgwè mmadụ.
