review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the threefold image and the force of μακάριαι. However, “akpa nwa ndị na-atụrụbeghị ime” means wombs that have never become pregnant, whereas αἱ κοιλίαι αἳ οὐκ ἐγέννησαν refers to wombs that have not borne/given birth. This needs correction.
  naturalness: The sentence is generally clear Standard Igbo. “Akpanwa” is the more usual single-word form, and “na-enweghị ike ịmụ nwa” naturally expresses “barren” without stigmatizing wording.
  terminology: “Lee” suitably renders ἰδού, and “Ngọzi na-adịrị” appropriately conveys the beatitude without making a general theological claim. The maternal image is retained in “ara ndị na-enyeghị nwa ara.”
  issues:
  - severity: medium
    issue: The womb clause renders non-pregnancy rather than non-birth.
    rationale: Greek οὐκ ἐγέννησαν is “did not give birth/bear,” not “did not become pregnant.” The distinction matters because the verse deliberately lists barren women, wombs that did not bear, and breasts that did not nurse.
  revised_text: N’ihi na, lee, ụbọchị na-abịa mgbe ndị mmadụ ga-asị, ‘Ngọzi na-adịrị ụmụ nwanyị ndị na-enweghị ike ịmụ nwa, na akpanwa ndị na-amụtabeghị nwa, na ara ndị na-enyeghị nwa ara.’
  revised_footnotes: []
  revision_rationale: The revision corrects the womb clause to express failure to bear a child rather than failure to conceive, while preserving the source’s parallel three-part imagery, solemn register, and non-doctrinal force.
