id: LUK.23.29
reference: Luke 23:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: ig
  text: N’ihi na, lee, ụbọchị na-abịa mgbe ndị mmadụ ga-asị, ‘Ngọzi na-adịrị ụmụ nwanyị ndị na-enweghị ike ịmụ nwa, na akpanwa ndị na-amụtabeghị nwa, na ara ndị na-enyeghị nwa ara.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: Ọ bụ okwu na-akpọ onye na-ege ntị ka o lebara ihe dị mkpa anya; ‘lee’ bụ ụzọ Igbo dị nkenke ma dịkwa ebube isi kwuo ya.
- source_word: αἱ στεῖραι
  choice: ụmụ nwanyị ndị na-amụghị nwa
  rationale: Nke a na-egosi ụmụ nwanyị na-enweghị ike ịmụ nwa n'ụzọ doro anya, na-ezere okwu nwere ike ịdị ka mkparị.
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: akpa nwa ndị na-atụrụbeghị ime
  rationale: A sụgharịrị κοιλίαι dị ka ‘akpa nwa’; okwu ahụ na-ezo aka n’akpa nwa ndị na-ebubeghị nwa, ebe a jiri okwu Igbo a na-aghọta ngwa ngwa mee ka ihe e bu n’obi pụta.
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: ara ndị na-enyeghị nwa mmiri ara
  rationale: ἔθρεψαν n’ebe a pụtara ịzụ nwa site n’inye ya ara; nsụgharị a na-eme ka ihe ahụ doo anya n’Igbo nkịtị.
theological_decisions:
- issue: Ihe a kpọrọ ‘ngọzi’ n’etiti ikpe na-abịa
  choice: E debere ‘Ngọzi na-adịrị’ dịka nkwupụta ndị mmadụ ga-ekwu.
  alternative: ‘Obi ụtọ na-adịrị’ ma ọ bụ ịkọwa na amụghị nwa ka mma.
  rationale: Μακάριαι nwere ike ịpụta ndị a na-ewere dị ka ndị ngọzi na-adịrị; ederede ahụ na-atụgharị atụmanya nkịtị n’ihi oke ahụhụ na-abịa. Nsụgharị ahụ anaghị eme ka nke a bụrụ ozizi zuru ụwa ọnụ banyere ịmụ nwa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ihe oyiyi atọ nke Grik—ụmụ nwanyị, akpa nwa, na ara—na ike ịdọ aka ná ntị nke ‘lee.’
