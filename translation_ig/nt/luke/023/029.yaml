  to: N’ihi na, lee, ụbọchị na-abịa mgbe ndị mmadụ ga-asị, ‘Ngọzi na-adịrị ụmụ nwanyị ndị na-enweghị ike ịmụ nwa, na akpanwa ndị na-amụtabeghị nwa, na ara ndị na-enyeghị nwa ara.’
