  rationale: The revision clarifies the legal/custodial release denoted by ἀπολύειν while retaining the source text’s ambiguity concerning the basis of Pilate’s necessity. The footnote is revised only for precision and natural contemporary reference to manuscript copyists; its textual-critical claims and cautious assessment remain unchanged.
