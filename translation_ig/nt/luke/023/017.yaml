  yaml_path: translation/nt/luke/023/017.yaml
  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: ig
  text: Ọ dịkwa ya mkpa ịtọhapụrụ ha otu onye n'oge Emume ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a dum adịghị n’ụfọdụ n’ime ihe odide Grik ndị kacha ochie, gụnyere Papyrus 75 nke narị afọ nke atọ na Codex Vaticanus nke narị afọ nke anọ, nakwa n’ụfọdụ nsụgharị Kọptik oge mbụ. Ọ dị n’ihe odide ndị ọzọ dị mkpa ma ochie, dịka Codex Sinaiticus nke narị afọ nke anọ, n’ọdịnala Latịn, nakwa n’ọtụtụ ihe odide Bizantịn ndị e dere mgbe e mesịrị. O yiri ka ndị na-edegharị ihe odide gbakwụnyere ya iji mee ka akụkọ Luk kwekọọ n’omenala ịhapụ onye mkpọrọ e kwuru na Matiu 27:15 na Mak 15:6. Ụfọdụ ihe odide debere ahịrịokwu a mgbe amaokwu 18 gasịrị.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην ... εἶχεν
  choice: Ọ dịkwa ya mkpa
  rationale: Akpaalaokwu Grik a pụtara na ọ nọ n'okpuru mkpa ma ọ bụ ibu ọrụ ime ihe ahụ. Nsụgharị a bụ Igbo nkịtị, ma ọ naghị ekpebi ma mkpa ahụ sitere n'iwu, n'omenala, ma ọ bụ ná nrụgide.
- source_word: ἀπολύειν
  choice: ịhapụụrụ
  rationale: N'ọnọdụ ikpe na njide, okwu a pụtara ịtọhapụ onye e jidere. Mgbakwunye -ụrụ na-egosipụta na ọ bụ maka ha ka a hapụrụ onye ahụ.
- source_word: κατὰ ἑορτήν
  choice: n'oge Emume ahụ
  rationale: N'ebe a, ἑορτή na-ezo aka n'emume okpukpe a maara n'akụkọ ahụ, ya bụ Emume Ngabiga. 'Emume' bụ okwu Igbo doro anya ma dị ugbu a; 'ahụ' na-egosi emume ahụ a maara.
- source_word: ἕνα
  choice: otu onye
  rationale: Ọ bụ ezie na Grik kwuru naanị 'otu,' ọnọdụ ahụ na-egosi otu onye a ga-ahapụ, ya mere e mere onye ahụ ka ọ pụta ìhè n'Igbo.
- source_word: δέ
  choice: dịkwa
  rationale: E gosipụtara njikọ dị nro nke δέ site na '-kwa' kama itinye okwu oge dịka 'ugbu a,' nke na-adịghị na isi mmalite.
theological_decisions:
- issue: Ụdị mkpa Pailat nọ n'okpuru ya
  choice: E ji 'ọ dị ya mkpa' hapụ isi mmalite ka ọ ghara ikwu kpọmkwem ma ọ bụ iwu, omenala, ma ọ bụ nrụgide.
  alternative: Ọ bụ iwu na ọ ga-ahapụụrụ ha otu onye.
  rationale: ἀνάγκην ἔχειν na-egosi mkpa ma ọ bụ ibu ọrụ, ma amaokwu ahụ n'onwe ya akọwaghị ebe ibu ọrụ ahụ si bịa. Ịsị 'ọ bụ iwu' ga-eme ka ihe a na-amaghị doo anya karịa Grik.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. 'Emume' malitere n' mkpụrụedemede ukwu n'ihi na ọnọdụ a na-ezo aka n'Emume Ngabiga a kapịrị ọnụ. E debere akara nkọwa [a] ozugbo n'azụ amaokwu ahụ.
