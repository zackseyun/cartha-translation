review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents ἀνάγκην ... εἶχεν as an unspecified necessity or obligation, retains the mild connective force of δέ, and conveys the distributive sense of ἕνα ... αὐτοῖς. However, ịhapụụrụ can also mean simply ‘leave for’; ịtọhapụrụ more clearly communicates ἀπολύειν in its custodial/legal sense, ‘release.’
  naturalness: The sentence is otherwise natural Standard Igbo. Replacing ịhapụụrụ with ịtọhapụrụ makes the intended judicial action immediately clear without making the wording cumbersome.
  terminology: ‘Mkpa’ appropriately preserves the source’s non-specific necessity/obligation and does not assert that this was a statutory requirement. ‘Emume ahụ’ is suitable in the immediate Passover setting. The textual-critical note is substantively sound; ‘ndị na-edegharị ihe odide’ avoids the potentially misleading modern sense of ‘secretaries’ for scribes.
  issues:
  - severity: medium
    issue: The verb ịhapụụrụ is semantically broad in this context.
    rationale: Although it can mean ‘release,’ it may also be understood as ‘leave [someone] for them.’ The Greek ἀπολύειν refers to release from custody; ịtọhapụrụ expresses that sense more explicitly.
  - severity: low
    issue: The footnote calls scribes ndị odeakwụkwọ.
    rationale: In contemporary Igbo this can readily denote secretaries. ‘Ndị na-edegharị ihe odide’ more precisely identifies copyists in a manuscript-transmission context.
