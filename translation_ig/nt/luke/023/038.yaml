base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: ig
  text: 'E nwekwara ihe e dere[a] n’elu ya[b], sị: “Onye a bụ Eze ndị Juu.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “akara,” “ọkwa,” ma ọ bụ “ebubo e dere ede.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “n’ebe dị n’elu ya.”
    reason: lexical_alternative
  - marker: c
    text: 'N’asụsụ Grik, ihe e dere kpọmkwem bụ: “Eze ndị Juu—onye a.”'
    reason: lexical_alternative
  - marker: d
    text: N’ọnọdụ ụfọdụ, a pụrụ ịsụgharị “ndị Juu” ka ọ bụrụ “ndị Judia”; ma n’aha a e dere n’oge a kpọgidere Jizọs n’obe, “ndị Juu” bụ ntụgharị ọdịnala nke dabara n’ọnọdụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: ihe e dere
  rationale: Nke a bụ okwu Igbo doro anya ma dị mfe nghọta maka ihe odide e tinyere n’obe ahụ; ọ naghị ekpebi n’isi ederede ma ọ bụ naanị akara ngosi ka ọ bụ ebubo iwu.
- source_word: ἐπ’ αὐτῷ
  choice: n’elu ya
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na ihe odide ahụ dị n’ebe dị elu karịa Jizọs; ‘n’elu ya’ bụ ụzọ Igbo nkịtị si kwuo ya.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: Onye a bụ Eze ndị Juu
  rationale: Asụsụ Grik enweghị ngwaa e dere n’ahịrịokwu a, ma Igbo chọrọ ‘bụ’ ka okwu doo anya. ‘Onye a’ na-echekwa nrụtụ aka siri ike dị na οὗτος.
- source_word: Ἰουδαίων
  choice: ndị Juu
  rationale: N’aha ndọrọ ndọrọ ọchịchị na agbụrụ e dere n’elu obe, ‘Eze ndị Juu’ bụ ntụgharị a maara nke ọma ma kwekọọ n’ọnọdụ a karịa ‘ndị Judia.’
- source_word: δὲ καὶ
  choice: E nwekwara
  rationale: Nke a na-egosi na onye dere akụkọ ahụ na-agbakwụnye nkọwa ọzọ, n’ụzọ dị larịị ma bụrụ Igbo eke.
theological_decisions:
- issue: Ụdị na nzube ihe odide ahụ dị n’obe
  choice: A kọwara ya nanị dị ka ihe e dere nke na-akpọ Jizọs ‘Eze ndị Juu,’ n’etinyeghị nkọwa banyere ịkwa emo, ebubo iwu, ma ọ bụ nkwupụta Mesaya.
  alternative: Ịkpọ ya kpọmkwem ebubo iwu, ma ọ bụ ịgbakwunye na ọ bụ okwu ịkwa emo ma ọ bụ nkwupụta Mesaya.
  rationale: Amaokwu Grik ahụ na-akọ naanị na ihe odide ahụ dị na ihe o kwuru. Ya mere, ntụgharị ahụ na-ahapụ esemokwu na nghọta nkà mmụta okpukpe dị n’akụkọ ahụ ka ọ dị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. ‘Ihe e dere’ bụ okwu nkịtị karịa okwu nka siri ike, ebe ‘Onye a bụ Eze ndị Juu’ na-enye ahịrịokwu Grik na-enweghị ngwaa n’ụdị Igbo doro anya ma na-echekwa nrụtụ aka οὗτος.
