  text: Πιλᾶτος δὲ συγκαλεσάμενος τοὺς ἀρχιερεῖς καὶ τοὺς ἄρχοντας καὶ τὸν λαὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: ig
  text: Ma Paịlet kpọkọtara ndị isi nchụàjà, ndị ọchịchị na ndị mmadụ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Paịlet
  rationale: Ọ bụ nsụgharị mkpụrụokwu nke aha onye ahụ n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị dị nro n’akụkọ ahụ ma na-eweghachi uche n’ihe Paịlet mere.
- source_word: συγκαλεσάμενος
  choice: kpọkọtara
  rationale: Ngwaa a na-egosi na Paịlet kpọrọ ìgwè ndị a ka ha zukọta. Iji ngwaa zuru ezu mee ya otú a bụ Igbo ebumpụta ụwa, ebe usoro ihe omume ya ka doro anya site n’ihe gbara amaokwu ahụ gburugburu.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Ọ na-ezo aka ná ndị nọ n’ọkwa ọchịchị kachasị elu n’etiti ndị nchụàjà, ọ bụghị ọtụtụ ndị ji otu ọkwa nke nnukwu onye nchụàjà.
- source_word: ἄρχοντας
  choice: ndị ọchịchị
  rationale: Nhọrọ a na-egosipụta ndị ndu nwere ikike ọchịchị, dịka okwu Grik ahụ si pụta n’ebe a.
- source_word: λαὸν
  choice: ndị mmadụ
  rationale: Ọ na-echekwa echiche nke ndị obodo n’ozuzu ya, n’emeghị ka ọ bụrụ naanị ìgwè mmadụ gbakọrọ n’otu ebe.
