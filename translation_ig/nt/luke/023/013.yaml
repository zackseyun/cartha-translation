translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị mfe nghọta ma dịkwa ugwu. Ahịrịokwu ahụ na-ejedebe na kọma n’ihi na echiche ya na-aga n’ihu n’amaokwu na-esonụ.
