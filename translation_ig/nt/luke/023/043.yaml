revisions:
- from: Ọ sịrị ya,[a] “N’ezie, ana m agwa gị, taa ka gị na m ga-anọ na paradaịs.”
  to: Ọ sịrị ya, “N’ezie, ana m agwa gị, taa[a] ka ị ga-anọnyere m na paradaịs.”
  rationale: The revision uses the idiomatic relational verb phrase “ị ga-anọnyere m” for “you will be with me,” and places “taa” in a natural focus construction that clearly represents the preferred reading. The alternative punctuation-dependent reading remains available in a footnote, with an anchor placed directly on the disputed adverb. No doctrinal conclusion beyond the wording and placement of the adverb is introduced.
