  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: ig
  text: Ọ sịrị ya, “N’ezie, ana m agwa gị, taa[a] ka ị ga-anọnyere m na paradaịs.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, ọ bụ ezie na o yighị ka ọ bụ ya: “N’ezie, ana m agwa gị taa, ị ga-anọnyere m na paradaịs.” Ihe odide Grik oge mbụ enweghị akara edemede; nghọta a na-ejikọta “taa” na “ana m agwa gị,” kama ijikọta ya na “ị ga-anọnyere m.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: N’ezie
  rationale: N’okwu Jizọs, ọ bụ nkwenye siri ike nke na-ebute nkwupụta nwere ikike; “N’ezie” na-egosipụta nke a n’Igbo nkịtị ma dị ùgwù.
- source_word: σοι λέγω
  choice: ana m agwa gị
  rationale: Nke a bụ ụzọ Igbo dị ugbu a si ekwu usoro okwu a n’ụzọ doro anya ma bụrụkwa nke sitere nso n’asụsụ Grik.
- source_word: σήμερον
  choice: taa
  rationale: A na-ejikọta ya n’isi ederede na “ga-anọ,” n’ihi na nke ahụ bụ nghọta kacha pụta ìhè n’usoro okwu Grik; a debere nghọta ọzọ n’ala peeji.
- source_word: μετ’ ἐμοῦ
  choice: gị na m
  rationale: Nke a bụ ụzọ Igbo kacha eke si gosipụta ịdị “mụ na gị,” ma chekwaa echiche nke iso Jizọs nọrọ.
- source_word: ἔσῃ
  choice: ga-anọ
  rationale: Ọdịnihu nke εἰμί pụtara ịdị ma ọ bụ ịnọ; “ga-anọ” dabara nke ọma n’ebe a ma bụrụ Igbo eke.
- source_word: παραδείσῳ
  choice: paradaịs
  rationale: “Paradaịs” bụ okwu a maara nke ọma n’Igbo maka ebe ngọzi a na-ekwu maka ya n’ọnọdụ a, n’enweghị itinye nkọwa karịrị ihe ederede kwuru.
theological_decisions:
- issue: Ebe σήμερον (“taa”) dabere n’okwu a, ebe akara edemede na-emetụta nghọta ya na ozizi banyere ọnọdụ mmadụ mgbe ọnwụ gasịrị
  choice: Ijikọ “taa” na “gị na m ga-anọ na paradaịs”
  alternative: Ijikọ “taa” na “ana m agwa gị”
  rationale: Ihe odide Grik mbụ enweghị akara edemede nke oge a. N’usoro okwu na ojiji Grik Koine, nghọta kacha pụta ìhè bụ na “taa” na-akọwa mgbe onye ahụ ga-anọnyere Jizọs. Ebe ọ bụ na nghọta nke ọzọ ga-ekwe omume ma nwee mmetụta n’ụzọ e si aghọta ozizi, a hapụrụ ya n’ala peeji kama izochi ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke doro anya ma dị ùgwù. A họọrọ “gị na m ga-anọ” kama nsụgharị siri ike dịka “ị ga-adịnyere m,” n’ihi na ọ bụ usoro okwu Igbo ka eke ma na-echekwa ihe okwu Grik pụtara. Akara ala peeji [a] dị n’isi ederede ma na-edekọ mgbagwoju anya sitere n’enweghị akara edemede n’ihe odide mbụ.
