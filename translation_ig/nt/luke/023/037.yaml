  edition: SBLGNT
  text: καὶ λέγοντες· Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/037.yaml
  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: ig
  text: na-ekwu sị, “Ọ bụrụ na ị bụ Eze ndị Juu[a], zọpụta onwe gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Eze ndị Judia.” Okwu Grik Ἰουδαίων nwere ike ịpụta ndị Juu ma ọ bụ ndị Judia, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  choice: na-asịkwa
  rationale: Ọ na-ejikọta okwu a na omume ndị agha e kwuru banyere ha n’amaokwu bu ụzọ, ma na-edobe λέγοντες dị ka okwu na-egosi ihe ha nọ na-ekwu n’etinyeghị ‘ịkwa emo’ n’ime ngwaa ahụ n’onwe ya.
- source_word: Εἰ σὺ εἶ
  choice: Ọ bụrụ na ị bụ
  rationale: Ọ na-edobe ụdị ịma aka nke okwu ahụ na nkwusi ike dị n’aha nnọchiaha σὺ n’ụzọ Igbo dị mma.
- source_word: ὁ βασιλεὺς
  choice: Eze
  rationale: N’Igbo, ‘Eze’ na-arụ ọrụ dị ka aha ọkwa eze doro anya n’ahịrịokwu a; ọ dịghị mkpa itinye okwu ọzọ iji nọchite anya edemede Grik ὁ.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N’akụkọ ahụhụ Jizọs, nke a bụ aha e ji kwuo ebubo ndọrọ ndọrọ ọchịchị na ọchịchị Mesaya megide ya. ‘Ndị Juu’ bụ ntụgharị doro ndị na-agụ Igbo anya, ebe a na-edobe ‘ndị Judia’ n’ala peeji dị ka ihe ọzọ okwu Grik ahụ pụrụ ịpụta.
- source_word: σῶσον σεαυτόν
  choice: zọpụta onwe gị
  rationale: Ọ na-egosi iwu a gwara otu onye ma na-edobe njikọ ngwaa σῴζω na echiche ‘ịzọpụta’ n’akwụkwọ Luk.
theological_decisions:
- issue: Otú e si tụgharịa aha ọchịchị βασιλεὺς τῶν Ἰουδαίων
  choice: Eze ndị Juu
  alternative: Eze ndị Judia
  rationale: Nkebiokwu a bụ aha jupụtara n’ironi n’oge a kpọgidere Jizọs n’obe, ma metụta ebubo e boro ya na eziokwu banyere ịbụ eze ya. ‘Ndị Juu’ dabara n’ọnọdụ a, ma ala peeji na-edobe nghọta mpaghara nke ‘ndị Judia’ n’ihi na Ἰουδαίων pụrụ inwe ma echiche agbụrụ ma nke mpaghara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ịkwa emo ahụ ka ọnọdụ akụkọ gosipụta ya kama ịgbakwunye ya na ngwaa λέγοντες.
