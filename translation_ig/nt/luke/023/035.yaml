id: LUK.23.35
reference: Luke 23:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: ig
  text: Ndị mmadụ guzoro na-ekiri. Ma ndị isi nọkwa na-akwa ya emo[a], na-asị, “Ọ zọpụtara ndị ọzọ; ka ọ zọpụta onwe ya, ma ọ bụrụ na onye a bụ Mesaya nke Chineke, Onye A Họpụtara.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst nke Chineke, Onye A Họpụtara.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἱστήκει
  choice: guzoro
  rationale: Ọ na-egosi ọnọdụ ndị mmadụ nọ na ya n'oge ahụ; “guzoro” bụ okwu Igbo doro anya ma dịkwa mfe.
- source_word: θεωρῶν
  choice: na-ekiri
  rationale: Ọ na-egosi na ha nọgidere na-ele ihe ahụ na-eme; “na-ekiri” na-eburu echiche omume na-aga n'ihu.
- source_word: ἐξεμυκτήριζον
  choice: na-akwa ya emo
  rationale: Ngwaa ahụ pụtara ịkwa mmadụ emo n'ụzọ nlelị; okwu a bụ Igbo nkịtị ma na-egosi mmechuihu dị n'okwu ndị isi ahụ.
- source_word: ἄρχοντες
  choice: ndị isi
  rationale: N'ọnọdụ a ọ na-ezo aka n ndị nwere ọchịchị ma ọ bụ ndị ndu; “ndị isi” bụ okwu sara mbara, eke, ma dabara n'ọnọdụ ahụ.
- source_word: Ἄλλους ἔσωσεν
  choice: Ọ zọpụtara ndị ọzọ
  rationale: “Zọpụtara” na-eburu isi echiche σῴζω nke ịnapụta ma na-enye ohere idobe nkwughachi ya n'ahịrịokwu na-esote.
- source_word: σωσάτω ἑαυτόν
  choice: ya zọpụta onwe ya
  rationale: Ụdị a na-egosi iwu ịma aka dị n'okwu Grik ahụ, ma na-edobe nkwughachi nke “zọpụtara/zọpụta.”
- source_word: εἰ οὗτός ἐστιν
  choice: ma ọ bụrụ na onye a bụ
  rationale: “Onye a” na-edobe ike ngosipụta nke οὗτός, tinyere ụda nlelị ọ pụrụ inwe n'ọnọdụ a.
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: Mesaya nke Chineke
  rationale: Χριστός bụ aha-ọkwa ebe a; “Mesaya” na-egosi Onye Chineke tere mmanụ, ebe “nke Chineke” na-edobe njikọ genitive ahụ n'ụzọ doro anya.
- source_word: ὁ ἐκλεκτός
  choice: Onye A Họpụtara
  rationale: Ọ bụ aha-ọkwa nke na-egosi onye Chineke họpụtara; mkpụrụedemede ukwu na-eme ka ọrụ aha-ọkwa ya pụta ìhè n'enweghị ịgbakwụnye nkọwa ozizi.
theological_decisions:
- issue: Nsụgharị Χριστός dị ka aha-ọkwa
  choice: Mesaya
  alternative: Kraịst
  rationale: N'okwu a, Χριστός bụ aha-ọkwa Mesaya, ọ bụghị naanị aha mmadụ; “Mesaya” na-eme ka ihe aha-ọkwa ahụ pụtara doo anya.
- issue: Ike aha-ọkwa ὁ ἐκλεκτός
  choice: Onye A Họpụtara
  alternative: Onye Ahọpụtara
  rationale: A hapụrụ ya dị ka aha-ọkwa nke nwere ibu mmụọ na nke Mesaya, n'enweghị ịkọwa onye họpụtara ya karịa ka njikọ okwu ahụ na Chineke si egosi.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E debere usoro ịkwa emo na nkwughachi “zọpụtara/zọpụta,” tinyere aha-ọkwa “Mesaya” na “Onye A Họpụtara.”
