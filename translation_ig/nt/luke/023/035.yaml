revisions:
- from: Ndị mmadụ guzoro na-ekiri. Ma ndị isi nọkwa na-akwa ya emo[a], na-asị, “Ọ zọpụtara ndị ọzọ; ya zọpụta onwe ya, ma ọ bụrụ na onye a bụ Mesaya nke Chineke, Onye A Họpụtara.”
  to: Ndị mmadụ guzoro na-ekiri. Ma ndị isi nọkwa na-akwa ya emo[a], na-asị, “Ọ zọpụtara ndị ọzọ; ka ọ zọpụta onwe ya, ma ọ bụrụ na onye a bụ Mesaya nke Chineke, Onye A Họpụtara.”
  rationale: The revision makes the imperative taunt idiomatic in Standard Igbo while preserving its force and the deliberate repetition of “zọpụta.” The footnote is revised to record the viable title alternative “Kraịst,” corresponding to the audit trail’s “Christ of God,” rather than explaining a lexical nuance already clear in the main text.
  reviewer_model: gpt-5.6-terra
