review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the scene-setting posture and observation, the rulers’ derision, the repeated save-wording, the demonstrative “onye a,” and the two messianic titles. “Ndị isi” is an acceptable contextually broad rendering of ἄρχοντες.
  naturalness: “Ya zọpụta onwe ya” is understandable, but “ka ọ zọpụta onwe ya” is the more natural Standard Igbo way to express the taunting permissive/imperatival challenge, “let him save himself.”
  terminology: “Mesaya nke Chineke” appropriately renders ὁ χριστὸς τοῦ θεοῦ, and “Onye A Họpụtara” suitably retains the titular force of ὁ ἐκλεκτός. The supplied footnote about mockery is not needed for source fidelity; a title alternative better reflects the English audit trail.
  issues:
  - severity: medium
    issue: The jussive challenge is rendered as “ya zọpụta onwe ya.”
    rationale: Although intelligible, this is less idiomatic in contemporary Standard Igbo than “ka ọ zọpụta onwe ya,” which clearly carries the taunting “let him save himself” force of σωσάτω.
  - severity: low
    issue: The existing footnote gives a redundant nuance for “na-akwa ya emo” rather than documenting the relevant alternative rendering of the titles.
    rationale: The text itself already communicates mockery. Replacing it with an alternative-title footnote aligns the Igbo note with the English audit trail without adding interpretation.
  revised_text: Ndị mmadụ guzoro na-ekiri. Ma ndị isi nọkwa na-akwa ya emo[a], na-asị, “Ọ zọpụtara ndị ọzọ; ka ọ zọpụta onwe ya, ma ọ bụrụ na onye a bụ Mesaya nke Chineke, Onye A Họpụtara.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst nke Chineke, Onye A Họpụtara.”
    reason: alternative_reading
  revision_rationale: The revision makes the imperative taunt idiomatic in Standard Igbo while preserving its force and the deliberate repetition of “zọpụta.” The footnote is revised to record the viable title alternative “Kraịst,” corresponding to the audit trail’s “Christ of God,” rather than explaining a lexical nuance already clear in the main text.
