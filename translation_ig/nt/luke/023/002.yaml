id: LUK.23.2
reference: Luke 23:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: ig
  text: Ha wee malite ibo ya ebubo, sị, “Anyị chọpụtara na nwoke a na-eduhie mba anyị[a], na-egbochi anyị ịkwụ Siza ụtụ isi[b], na-ekwukwa na ya onwe ya bụ Mesaịa[c], bụrụkwa eze.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-akpaghasị mba anyị” ma ọ bụ “na-eme ka mba anyị kpafuo.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a na-ekwu maka ụtụ isi ma ọ bụ ụtụ a na-akwụ onye ọchịchị Rom.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “na-ekwu na ya onwe ya bụ Kraịst, bụrụkwa eze.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: Ha wee malite ibo ya ebubo
  rationale: Nke a na-echekwa echiche mmalite dị na ἤρξαντο na ọnọdụ ikpe dị na κατηγορεῖν; ‘ibo ya ebubo’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ikpe.
- source_word: Τοῦτον εὕραμεν
  choice: Anyị chọpụtara na nwoke a
  rationale: ‘Nwoke a’ na-egosipụta ntụaka deictic nke Τοῦτον n’ụzọ ebumpụta ụwa, ebe ‘chọpụtara’ na-eburu nkwupụta ha na ha achọpụtala ihe e boro ya.
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: na-eduhie mba anyị
  rationale: ‘Na-eduhie’ na-ejide echiche nke ime ka ndị mmadụ kpafuo n’etinyeghị kpọmkwem ebubo nnupụisi nke okwu Grik ahụ n’onwe ya ekwughị hoo haa; ‘mba anyị’ dabara na ọnọdụ ndọrọ ndọrọ ọchịchị nke ἔθνος.
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: na-egbochi anyị ịkwụ Siza ụtụ isi
  rationale: ‘Na-egbochi’ na-egosipụta κωλύοντα, ebe ‘anyị’ na-eme ka onye e kwuru na a na-egbochi ya doo anya n’Igbo. ‘Ịkwụ Siza ụtụ isi’ bụ ụzọ Igbo nke oge a si ekwu φόρους Καίσαρι διδόναι.
- source_word: λέγοντα αὑτὸν
  choice: na-ekwukwa na ya onwe ya
  rationale: ‘Ya onwe ya’ na-echekwa nkwusi ike dị na nnọchiaha reflexive αὑτόν, ebe ‘na-ekwukwa’ na-ejikọta ebubo nke atọ n’usoro ahụ.
- source_word: χριστὸν βασιλέα εἶναι
  choice: bụ Mesaịa, bụrụkwa eze
  rationale: ‘Mesaịa’ na-ewere χριστός dị ka aha ọkwa nke onye e tere mmanụ, ebe ‘bụrụkwa eze’ na-edebe βασιλέα dịka ihe ọzọ a na-ekwu banyere ya n’ebughị ụzọ jikọta ha ka ha bụrụ otu aha ọkwa e kpebisiri ike.
theological_decisions:
- issue: Otu a ga-esi sụgharịa χριστόν n’ebubo ndọrọ ndọrọ ọchịchị a
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a χριστός na-arụ ọrụ dịka aha ọkwa nke onye e tere mmanụ, ọ bụghị dịka aha mmadụ nkịtị. ‘Mesaịa’ na-echekwa ndabere ndị Juu na echiche ọchịchị-eze dị n’ebubo ahụ.
- issue: Mmekọrịta dị n’etiti χριστόν na βασιλέα
  choice: Mesaịa, bụrụkwa eze
  alternative: Mesaịa bụ́ eze
  rationale: Nhọrọ a na-edebe ihe abụọ e kwuru banyere ya—Mesaịa na eze—n’enweghị ịtụgharị ha ka ha bụrụ otu aha ọkwa siri ike ma ọ bụ idozi ihe mgbagwoju anya nke usoro Grik karịa ka ederede ahụ mere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa ugwu, dee ya. Ahịrịokwu ahụ na-ejigide usoro ebubo atọ nke Grik, nkwusi ike dị na ‘ya onwe ya,’ na esemokwu dị n’etiti aha ọkwa Mesaịa na ọrụ eze.
