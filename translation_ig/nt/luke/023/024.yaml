  text: And Pilate decided that their demand should be granted[a].
translation:
  language: ig
  text: Pilati wee kpebie na a ga-eme ihe ha rịọrọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ iwu karị: “Pilati wee maa ikpe ka e mee arịrịọ ha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: Njikọ akụkọ a na-egosi ihe sochiri ihe ndị mere tupu ya, n’enweghị ịgbakwụnye nkọwa oge karịrị nke Grik kwuru.
- source_word: Πιλᾶτος
  choice: Pilati
  rationale: Aha a gbasoro nsụgharị aha a na-ejikarị eme ihe n’Igbo.
- source_word: ἐπέκρινεν
  choice: kpebie
  rationale: N’ebe a, okwu ahụ pụtara ime mkpebi ikpe. ‘Kpebie’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ikpe ahụ.
- source_word: γενέσθαι
  choice: na a ga-eme
  rationale: Infinitive a na-egosi na ihe a rịọrọ ga-emezu; ntụgharị a bụ Igbo sitere n’okike ma ghara ịkọwapụta karịa ihe okwu Grik kwuru.
- source_word: τὸ αἴτημα
  choice: ihe ha rịọrọ
  rationale: αἴτημα nwere ike ịbụ arịrịọ ma ọ bụ ihe a na-achọsi ike. ‘Ihe ha rịọrọ’ na-edobe obosara ihe okwu ahụ pụtara, ebe ọnọdụ gbara ya gburugburu ka na-egosi nrụgide ha.
- source_word: αὐτῶν
  choice: ha
  rationale: Ọ na-ezo aka n’arịrịọ ndị ahụ na-ebo Jizọs ebubo na ìgwè mmadụ ahụ rịọrọ.
theological_decisions:
- issue: Ụdị mkpebi ikpe Pilati mere
  choice: Pilati wee kpebie na a ga-eme ihe ha rịọrọ
  alternative: Pilati wee maa ikpe na a ga-emezu arịrịọ ha
  rationale: Nhọrọ a na-egosi na Pilati nyere nkwado ikpe ka ihe ha rịọrọ mee, ma ọ naghị eme ka ọ bụrụ naanị ikpe ntaramahụhụ ma ọ bụ tinye nkọwa ozizi na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. Ahịrịokwu ahụ dị mfe nghọta nye ndị nkịtị, ebe ndetu ala peeji na-echekwa ụda iwu nke ἐπέκρινεν na ụdị ntụgharị nkịtị karị.
