  source_fidelity: Isi ahịrịokwu ahụ na-egosipụta nke ọma ἐπέκρινεν dị ka mkpebi Pilati na γενέσθαι dị ka ime ihe a rịọrọ. “Ihe ha rịọrọ” na-edobe obosara αἴτημα, n’enweghị ịgbakwunye na ọ bụ naanị “arịrịọ” ma ọ bụ “nrụgide.”
  naturalness: “Pilati wee kpebie na a ga-eme ihe ha rịọrọ” bụ Igbo ọkọlọtọ doro anya ma na-agụ nke ọma. Otú ọ dị, nkebi “n’ụzọ iwu na ikpe siri ike karị” dị na ndetu ala peeji adịghị ada n’ụzọ okike; “siri ike” pụtara strict/hard karịa formal.
  terminology: Aha “Pilati” na okwu “kpebie” dabara adaba. N’ndetu ọzọ, “maa ikpe” na-echekwa ụda mkpebi ụlọikpe nke ἐπέκρινεν; “n’ụzọ iwu karị” bụ ụzọ doro anya isi kọwaa na ntụgharị ahụ dịkwuo n’ụdị iwu.
