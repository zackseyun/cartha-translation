  terminology: “Josef,” “kansụl,” and “onye ezi omume” are appropriate Standard Igbo choices. “Onye ezi omume” suitably renders δίκαιος in this moral-religious characterization. The footnote’s alternative “onye ziri ezi” appropriately reflects the possible ‘just/upright’ sense.
