source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: ig
  text: Ma lee, otu nwoke aha ya bụ Josef, onye so na kansụl, nwoke dị mma, bụrụkwa onye ezi omume[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwoke dị mma, bụrụkwa onye ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Ma lee
  rationale: Nke a na-edobe okwu Luk ji adọta uche onye na-agụ ya, n’asụsụ Igbo dị mfe ma kwụ ọtọ.
- source_word: ἀνὴρ
  choice: otu nwoke / nwoke
  rationale: Okwu a na-ezo aka n’otu nwoke toro eto. E debekwara nkwughachi nke ἀνήρ iji chekwaa nkwusi ike dị n’ederede Grik.
- source_word: ὀνόματι Ἰωσὴφ
  choice: aha ya bụ Josef
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi webata aha mmadụ.
- source_word: βουλευτὴς ὑπάρχων
  choice: onye so na kansụl
  rationale: βουλευτής pụtara onye bụ otu n’ime ndị kansụl; nsụgharị a bụ nke ndị na-agụ Igbo nke oge a ga-aghọta ngwa ngwa, n’enweghị ịkọwapụta karịa ihe isi mmalite kwuru.
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: nwoke ọma na onye ezi omume
  rationale: “Ọma” na-egosipụta ἀγαθός, ebe “onye ezi omume” na-egosipụta ịdị uchu na izi ezi nke δίκαιος, ma na-edobe nkọwa banyere àgwà Josef.
theological_decisions:
- issue: Nsụgharị δίκαιος n’ịkọwa àgwà Josef
  choice: onye ezi omume
  alternative: onye ziri ezi
  rationale: δίκαιος nwere ike ịpụta onye omume ya kwụ ọtọ ma ọ bụ onye ziri ezi n’ihe metụtara ikpe. “Onye ezi omume” na-egosipụta nkọwa sara mbara banyere àgwà ya n’ebe Chineke na mmadụ nọ, n’emeghị ka okwu ahụ bụrụ ozizi teknịkal.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere “Ma lee” dị ka ihe na-adọta uche, debekwaara ahịrị ahụ akara ogologo n’ọgwụgwụ n’ihi na echiche ya gara n’ihu n’amaokwu na-esonụ.
