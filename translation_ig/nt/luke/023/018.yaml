revisions:
- from: Ma ha niile tiri mkpu n’otu olu[a], na-asị, “Wepụ nwoke a, hapụkwara anyị Barabas!”
  to: Ma ha niile tiri mkpu ọnụ, na-asị, “Wepụ nwoke a, ma tọhapụ anyị Barabas!”
  rationale: The revision replaces “n’otu olu” with “ọnụ” to retain the collective force of παμπληθεί without implying more than the Greek says. It also uses “tọhapụ” to make the requested release from custody explicit in idiomatic Igbo, while “ma” reflects the contrastive δέ without adding interpretive force.
  reviewer_model: gpt-5.6-terra
