  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: ig
  text: Ma ha niile tiri mkpu ọnụ, na-asị, “Wepụ nwoke a, ma tọhapụ anyị Barabas!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: tiri mkpu
  rationale: Ngwaa a na-egosi iti mkpu ike; “tiri mkpu” bụ okwu Igbo doro anya ma na-echekwa ike dị n’okwu Grik.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a, δέ na-egosi mgbanwe nwere ọdịiche n’ihe a kọrọ tupu ya; “Ma” na-egosipụta nke a nke ọma.
- source_word: παμπληθεὶ
  choice: ha niile ... n’otu olu
  rationale: Okwu a na-egosi na ìgwè ahụ dum jikọrọ aka n’otu nzaghachi. “Ha niile ... n’otu olu” bụ Igbo e ji eme ihe nke na-echekwa ịdị n’otu ha, n’agbanyeghị na “n’otu olu” dị ntakịrị nkọwa karịa Grik.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-ewebata ihe ha tiri mkpu; “na-asị” na-arụ ọrụ ahụ n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: Αἶρε
  choice: Wepụ
  rationale: Iwu a pụtara iwepụ onye ahụ n’ihu ha. “Wepụ” dị nkenke, sie ike, ma hapụ ka ọnọdụ gbara ya gburugburu gosi ihe ha chọrọ ka e mee ya.
- source_word: τοῦτον
  choice: nwoke a
  rationale: Nnọchiaha ngosi a na-arụtụ aka n’ebe Jizọs nọ. “Nwoke a” bụ Igbo doro anya ma na-echekwa ike nke nrụtụ aka ahụ.
- source_word: ἀπόλυσον
  choice: hapụkwara
  rationale: N’ọnọdụ ikpe a, okwu ahụ pụtara ịtọhapụ onye nọ n’agbụ ma ọ bụ n’ụlọ mkpọrọ. “Hapụ” bụ okwu Igbo dị mfe ma kwekọọ na ọnọdụ ahụ; “-kwara” na-egosi ọdịiche dị n’etiti iwepụ Jizọs na ịhapụ Barabas.
- source_word: ἡμῖν
  choice: anyị
  rationale: Ọ na-egosi ndị a ga-abara ntọhapụ ahụ uru; n’usoro okwu Igbo “hapụkwara anyị Barabas,” “anyị” na-arụ ọrụ a n’ụzọ ebumpụta ụwa.
- source_word: τὸν Βαραββᾶν
  choice: Barabas
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị mkpụrụokwu kwekọrọ n’usoro ịkpọ aha n’Igbo.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ike nke mkpu ìgwè mmadụ ahụ na iwu abụọ ha nyere, n’enweghị itinye n’ime ederede na ha chọrọ ka e gbuo Jizọs, ọ bụ ezie na ọnọdụ akụkọ ahụ nwere ike igosi ya.
