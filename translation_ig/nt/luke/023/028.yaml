revisions:
- from: Ma Jizọs tụgharịrị chee ha ihu[a] wee sị, “Ụmụ ada Jeruselem, unu akwala m ákwá; kama, bekwaanụ ákwá n’ihi onwe unu na ụmụ unu.”
  to: Ma Jizọs tụgharịrị n'ebe ha nọ, sị, “Ụmụ ada Jeruselem, unu akwala m ákwá; kama, kwaanụ ákwá n'ihi onwe unu na ụmụ unu.”
  rationale: The revision improves idiomatic Standard Igbo syntax and imperative usage without altering the source text’s participial action, address, contrast, or scope. The footnote continues to identify “Ụmụ nwanyị Jeruselem” as a legitimate contextual alternative while preserving the literal main-text rendering.
