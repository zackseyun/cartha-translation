  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: ig
  text: Ma Jizọs tụgharịrị n'ebe ha nọ, sị, “Ụmụ ada Jeruselem, unu akwala m ákwá; kama, kwaanụ ákwá n'ihi onwe unu na ụmụ unu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: Ma Jizọs tụgharịrị chee ha ihu
  rationale: A tụgharịrị aorist participle ahụ n’usoro omume Igbo dị mfe ma doo anya. “Chee ha ihu” na-egosi ntụgharị ahụ Jizọs tụgharịrị n’ebe ụmụ nwanyị ahụ nọ, ebe “Ma” na-ebute mgbanwe dị nro n’akụkọ ahụ.
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: Ụmụ ada Jeruselem
  rationale: Nke a na-edobe okwu ezinụlọ na ụda amụma dị na Grik, kama ime ka ọ bụrụ naanị “Ụmụ nwanyị Jeruselem.”
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: unu akwala m ákwá
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka ịkwa ákwá n’ihi mmadụ, ma ọ naghị ekpebi ma iwu ahụ pụtara ka ha kwụsị ihe ha maliterela ma ọ bụ ka ha ghara ime ya.
- source_word: πλὴν ἐφ’ ἑαυτὰς κλαίετε
  choice: kama, bekwaanụ ákwá n’ihi onwe unu
  rationale: '“Kama” na-egosi ntụgharị mmezi ahụ: ọ bụghị ịkwa Jizọs ákwá, kama ịkwa ákwá n’ihi onwe ha. “Bekwaanụ ákwá” bụ iwu doro anya ma dabara n’Igbo ugbu a.'
- source_word: καὶ ἐπὶ τὰ τέκνα ὑμῶν
  choice: na ụmụ unu
  rationale: “Ụmụ unu” bụ ntụgharị dị mfe na nke kwesịrị ekwesị nke τέκνα ὑμῶν n’ọnọdụ ezinụlọ a.
theological_decisions:
- issue: Otu e si tụgharịa Θυγατέρες Ἰερουσαλήμ
  choice: Ụmụ ada Jeruselem
  alternative: Ụmụ nwanyị Jeruselem
  rationale: “Ụmụ ada” na-edobe ihe okwu Grik kwuru kpọmkwem nakwa ụda okwu amụma Akwụkwọ Nsọ, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere “Ụmụ ada Jeruselem” iji chekwaa ụda amụma na ihe oyiyi ezinụlọ dị n’isi mmalite ahụ; akara ụda dị na “ákwá” na-enyere aka igbochi mgbagwoju anya.
