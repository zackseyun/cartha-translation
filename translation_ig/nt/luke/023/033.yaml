    issue: The phrase “kpọgidekwa ndị omekome ahụ” leaves the cross phrase expressed only with Jesus.
    rationale: The Greek has one verb governing both Jesus and the criminals, so ellipsis is possible; nevertheless, in Igbo, repeating “n’obe” makes it fully clear that the same crucifixion action applies to both coordinated objects.
