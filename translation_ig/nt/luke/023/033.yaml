  source_fidelity: The draft accurately represents the arrival, the place designation Κρανίον as “Okpokoro Isi,” crucifixion, and the distribution of the two κακοῦργοι. A small revision makes the second coordinated crucifixion explicit in Igbo, rather than leaving “n’obe” to be supplied from the first clause.
  naturalness: The register is clear, modern Standard Igbo. Repeating “n’obe” with the criminals improves parallelism and prevents the coordinated verb from sounding like a less specific action.
  terminology: “Okpokoro Isi” appropriately translates Κρανίον, “ndị omekome” preserves the broad sense of κακούργοι, and “kpọgidere ... n’obe” is an established, comprehensible rendering of ἐσταύρωσαν. No doctrinally loaded wording has been introduced.
