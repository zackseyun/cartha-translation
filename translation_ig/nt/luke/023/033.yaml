  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: ig
  text: 'Mgbe ha bịarutere n’ebe a na-akpọ Okpokoro Isi[a], n’ebe ahụ ka ha kpọgidere ya n’obe, kpọgidekwa ndị omekome abụọ ahụ n’obe: otu n’aka nri, nke ọzọ n’aka ekpe.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị ‘Okpokoro Isi’ bụ Κρανίον, nke pụtara kpọmkwem ‘okpokoro isi.’ A pụkwara ịsụgharị ya, ‘ebe a na-akpọ Okpokoro Isi ahụ.’
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ okwu Grik si dị kpọmkwem: ‘otu site n’aka nri, otu sitekwa n’aka ekpe.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: ha bịarutere n’ebe
  rationale: N’akụkọ a, ‘bịarutere n’ebe’ na-egosi ma ngagharị ruo ebe ahụ ma ọ bụ iru ebe ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: τὸν καλούμενον Κρανίον
  choice: ebe a na-akpọ Okpokoro Isi
  rationale: Κρανίον pụtara ‘okpokoro isi.’ Ịsụgharị ihe aha ebe ahụ pụtara na-echekwa ọdịnaya okwu Grik kama idegharị ụda ya naanị.
- source_word: ἐσταύρωσαν
  choice: kpọgidere ya n’obe
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa igbu mmadụ n’obe; ọ na-enye ihe σταυρόω pụtara n’enweghị ịgbakwụnye nkọwa banyere usoro e si mee ya.
- source_word: κακούργους
  choice: ndị omekome
  rationale: ‘Ndị omekome’ bụ okwu Igbo sara mbara maka ndị na-eme ihe ọjọọ ma ọ bụ ndị mere mpụ; ọ naghị eme ka okwu Luk bụrụ kpọmkwem ‘ndị ohi’ ma ọ bụ ‘ndị nnupụisi.’
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: otu n’aka nri, nke ọzọ n’aka ekpe
  rationale: Nke a na-ekesa mmadụ abụọ ahụ n’ọnọdụ ha n’ụzọ Igbo dị nkenke, na-agbakwụnyeghị ‘ya,’ nke a na-aghọta site n’ihe gbara okwu ahụ gburugburu ma na-adịghị n’ederede Grik kpọmkwem.
theological_decisions:
- issue: Nsụgharị Κρανίον dị ka aha ebe
  choice: Okpokoro Isi
  alternative: Kranion; ebe a na-akpọ Okpokoro Isi ahụ
  rationale: Aha a sitere n’okwu nkịtị nke pụtara ‘okpokoro isi.’ Ịsụgharị ya na-echekwa ihe ọ pụtara ma zere ibubata ụdị aha ọdịnala sitere n’akụkụ ndị ọzọ.
- issue: Nkọwa ndị ikom abụọ a kpọgidere n’obe ya na Jizọs
  choice: ndị omekome
  alternative: ndị mere mpụ; ndị ajọ omume; ndị ohi
  rationale: κακοῦργοι sara mbara karịa ‘ndị ohi’ ma ọ bụ ‘ndị nnupụisi.’ ‘Ndị omekome’ na-echekwa obosara okwu Luk ma na-ezere ime ka okwu ya kwekọọ n’ụzọ a manyere ya na okwu Oziọma ndị ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Ndị omekome’ na ‘kpọgidere ya n’obe’ bụ okwu ndị nkịtị ga-aghọta, ebe ahịrịokwu ahụ ka na-agbasochi usoro na nkọwa ederede Grik anya.
