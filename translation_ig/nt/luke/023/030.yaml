  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: ig
  text: Mgbe ahụ, ha ga-amalite ịgwa ugwu ukwu[a], sị, ‘Dakwasịnụ anyị,’ ma gwa ugwu nta[b], sị, ‘Kpuchienụ anyị.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a na-ekwughachi okwu amụma banyere ikpe, karịsịa nke dị na Hosia 10:8.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “Zonụ anyị.” Okwu Grik ahụ pụtara n'ụzọ nkịtị “kpuchie,” ma n’ebe a ọ nwekwara echiche nke izobe anyị pụọ n’ikpe na-abịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Na-egosi ihe ga-esochi ihe ndị a kọwara n'amaokwu ndị bu ụzọ, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: ἄρξονται λέγειν
  choice: ha ga-amalite ịsị
  rationale: Na-echekwa echiche nke ịmalite ime ihe dị na ἄρξονται, ebe ịsị na-ewebata okwu a kpọrọ kpọmkwem.
- source_word: τοῖς ὄρεσιν
  choice: ugwu ukwu
  rationale: A họọrọ ‘ugwu ukwu’ iji kewapụ ὄρεσιν n'ụzọ doro anya na βουνοῖς, nke a sụgharịrị ‘ugwu nta.’
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Dakwasịnụ anyị
  rationale: Na-egosipụta iwu e nyere ọtụtụ ugwu ka ha daa n'elu ndị na-ekwu okwu; ‘dakwasị’ bụ okwu Igbo ebumpụta ụwa maka ịda n'elu mmadụ ma kpuchie ma ọ bụ gwepịa ya.
- source_word: τοῖς βουνοῖς
  choice: ugwu nta
  rationale: βουνός na-ezo aka n'ugwu nta; nsụgharị a na-echekwa ọdịiche ya na ὄρος.
- source_word: Καλύψατε ἡμᾶς
  choice: Kpuchienụ anyị
  rationale: Na-echekwa isi nghọta nkịtị nke καλύπτω, ‘ikpuchi,’ n'ebughị ụzọ kọwaa ya naanị dị ka izobe.
theological_decisions:
- issue: Asụsụ amụma banyere ikpe na-abịa
  choice: Idowe arịrịọ nkịtị a na-arịọ ugwu ukwu na ugwu nta n'akwụkwọ bụ isi.
  alternative: Ịkọwa ya ozugbo dị ka arịrịọ ka e zoo ha pụọ n'ikpe na-abịa.
  rationale: Okwu ahụ na-emegharị ihe oyiyi amụma dị na Hosia 10:8. Ịhapụ ihe oyiyi ahụ otú ọ dị na-echekwa ike na esemokwu nke okwu ahụ n'etinyeghị nkọwa ozizi n'ime amaokwu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ nke iwu, ‘Dakwasịnụ’ na ‘Kpuchienụ,’ mee ka o kwekọọ n'aha ọtụtụ dị na Grik. E debere ọdịiche dị n'etiti ὄρεσιν na βουνοῖς dịka ‘ugwu ukwu’ na ‘ugwu nta.’
