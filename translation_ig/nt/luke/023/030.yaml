review_pass:
  verdict: revise
  source_fidelity: The draft faithfully retains the temporal sequence, the ingressive future sense ('ha ga-amalite'), the direct address to mountains and hills, and the literal imperatives to fall and cover. The mountain/hill distinction is appropriately maintained as 'ugwu ukwu' and 'ugwu nta.'
  naturalness: The main text can be made more idiomatic and syntactically clear in Standard Igbo by using 'ịgwa ... sị' for speaking to the mountains/hills. The first footnote's 'na-emegharị asụsụ amụma' is less natural than 'na-ekwughachi okwu amụma.'
  terminology: '''Dakwasịnụ anyị'' and ''Kpuchienụ anyị'' are suitable plural imperatives and preserve the concrete prophetic imagery. ''Hosia'' is a standard Igbo biblical name. The lexical note''s alternative ''Zonụ anyị'' is appropriate, but its explanation should refer consistently to ''anyị'' rather than third-person ''ha.'''
  issues:
  - severity: low
    issue: The construction 'ịsị ugwu ukwu ... sịkwa ugwu nta' is somewhat awkward.
    rationale: Although understandable, 'ịgwa ugwu ukwu, sị ...; ịgwa ugwu nta, sị ...' is a clearer and more natural way in Standard Igbo to introduce direct speech addressed to two groups.
  - severity: low
    issue: Footnote a uses an unnatural expression for an intertextual echo.
    rationale: '''Na-emegharị asụsụ amụma'' can suggest translating prophetic language rather than echoing it. ''Na-ekwughachi okwu amụma'' directly conveys the intended allusion.'
  - severity: low
    issue: Footnote b shifts from first-person wording to third-person explanation.
    rationale: The note glosses 'Zonụ anyị' but then says 'izobe ha.' Using 'izobe anyị' maintains the voice and reference of the quotation.
