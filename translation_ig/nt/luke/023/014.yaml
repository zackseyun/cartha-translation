  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: ig
  text: Ọ sịrị ha, “Unu kpọtaara m nwoke a dị ka onye na-eduhie ndị mmadụ[a]. Lee, mgbe m nyochachara ya n’ihu unu, ahụghị m n’ime nwoke a ihe ndabere ọ bụla maka ebubo unu na-ebo ya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-eme ka ndị mmadụ chigharịa.” Ngwaa Grik a nwere ike ịpụta ime ka mmadụ chigharịa ma ọ bụ iduhie ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ahụghị m n’ime nwoke a ihe ndabere ọ bụla n’ihe ndị unu na-ebo ya ebubo.”
    reason: alternative_reading
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: Unu kpọtaara m
  rationale: Nke a na-egosi omume ha mezuru nke ịkpọtara Jizọs n’ihu Paịlet, ma na-edobe okwu ahụ kpọmkwem nye ha.
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: nwoke a
  rationale: ἄνθρωπος n’ebe a na-ekwu maka otu nwoke kpọmkwem; ‘nwoke a’ bụ Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: dị ka onye na-eduhie ndị mmadụ
  rationale: ἀποστρέφω nwere ike ịpụta ime ka mmadụ chigharịa ma ọ bụ iduhie ya. N’ọnọdụ ebubo a, ‘na-eduhie ndị mmadụ’ na-ekwupụta ebubo ahụ n’enweghị ịgbakwunye echiche siri ike nke ịkpalite nnupụisi.
- source_word: ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo dị ugbu a nke na-akpọ uche ndị na-ege ntị gaa n’ihe Paịlet na-achọ ikwusi ike.
- source_word: ἐνώπιον ὑμῶν
  choice: n’ihu unu
  rationale: Nke a na-egosi na nyocha ahụ mere ebe ha nọ ma ha hụ ya.
- source_word: ἀνακρίνας
  choice: mgbe m nyochachara ya
  rationale: N’ọnọdụ ikpe, ἀνακρίνω pụtara inyocha ma ọ bụ ịjụ ajụjụ n’ụzọ iwu; ‘nyochachara ya’ na-edobe echiche sara mbara ahụ.
- source_word: οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον
  choice: ahụghị m ihe ọ bụla n’ahụ nwoke a nke ga-abụ ihe ndabere
  rationale: Nsụgharị a na-edobe okwu ahụ dịka nchọpụta ikpe na enweghị ihe ga-akwado ebubo, kama ime ya ka ọ bụrụ nkwupụta zuru ụwa ọnụ banyere omume nwoke ahụ.
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: maka ebubo unu na-ebo ya
  rationale: Nke a na-edobe ụda okwu ụlọikpe nke κατηγορέω ma na-ada ka Igbo nkịtị.
theological_decisions:
- issue: Ụdị nkwupụta Paịlet
  choice: E gosiri ya dịka nchọpụta ikpe na ọ dịghị ihe ndabere maka ebubo ha.
  alternative: ‘Ahụghị m ikpe ọ bụla n’ahụ nwoke a n’ihe ndị unu na-ebo ya ebubo.’
  rationale: Okwu Grik ndị metụtara nyocha, ihe kpatara ikpe, na ebubo na-etinye amaokwu a n’ọnọdụ ụlọikpe. Nsụgharị bụ isi anaghị eme nkwupụta Paịlet ka ọ bụrụ mkpebi sara mbara banyere ịdị ọcha Jizọs n’ụzọ niile.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Lee’ na-edobe ike nke ἰδού n’enweghị okwu ochie; okwu ndị metụtara ebubo na nyocha na-edobe ọnọdụ ụlọikpe.
