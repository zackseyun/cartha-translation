review_pass:
  verdict: revise
  source_fidelity: Isi nsụgharị ahụ na-egosipụta nke ọma ebubo ahụ (ἀποστρέφοντα τὸν λαόν), nyocha Paịlet mere n’ihu ndị na-ebo ebubo, na nkwupụta ya na ọ hụghị ihe ndabere iwu maka ebubo ndị ahụ. Otú ọ dị, «ihe ọ bụla n’ahụ nwoke a nke ga-abụ ihe ndabere» adịghị edo anya nke ọma n’Igbo; «n’ime nwoke a ihe ndabere ọ bụla» na-egosipụta ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον n’ụzọ ziri ezi ma dị mfe. Ihe odide ala b jiri «ikpe» mee ihe n’ụzọ na-adịghị akọwapụta αἴτιον nke ọma, ebe okwu ahụ bụ banyere ihe ndabere/guilt maka ebubo, ọ bụghị ikpe ụlọikpe n’onwe ya.
  naturalness: «Unu kpọtaara m», «Lee», na «mgbe m nyochachara ya n’ihu unu» bụ Standard Igbo dị mma ma kwekọọ na ụda ụlọikpe. A hazigharịrị naanị akụkụ ikpeazụ ka ọ bụrụ Igbo na-asọpụta nke ọma.
  terminology: E debere «ebubo», «nyochaa», na «ihe ndabere» iji chekwaa usoro iwu dị n’asụsụ Grik. «Ndụhie ndị mmadụ» adịghị agbakwunye ebubo nnupụisi nke na-adịghị kpọmkwem n’okwu a.
  issues:
  - severity: medium
    issue: Nkebi okwu «ihe ọ bụla n’ahụ nwoke a nke ga-abụ ihe ndabere maka ebubo» nwere nhazi na-adịghị eke nke ọma.
    rationale: Ọ pụrụ ime ka mmekọrịta dị n’etiti nwoke ahụ, ihe ndabere, na ebubo ghara ido anya. «Ahụghị m n’ime nwoke a ihe ndabere ọ bụla maka ebubo...» na-ekwu nke a n’ụzọ doro anya, na-enweghị ịgbanwe ihe amaokwu ahụ pụtara.
  - severity: medium
    issue: 'Ihe odide ala b: «ahụghị m ikpe ọ bụla n’ahụ nwoke a» anaghị anọchi anya αἴτιον nke ọma.'
    rationale: «Ikpe» nwere ike ịpụta ikpe ụlọikpe ma ọ bụ mkpebi; αἴτιον n’ebe a bụ ihe ndabere iwu ma ọ bụ ihe ga-egosi mmejọ n’ihe a na-ebo ya.
