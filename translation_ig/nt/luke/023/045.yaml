  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂τοῦ ἡλίου ἐκλιπόντος⸃, ἐσχίσθη ⸀δὲ τὸ καταπέτασμα τοῦ ναοῦ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: ig
  text: Mgbe anyanwụ gbara ọchịchịrị[a], ákwà mgbochi[b] nke ụlọ nsọ wee dọwaa n’etiti[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ìhè anyanwụ kwụsịrị.” Ụfọdụ na-asụgharị ya kpọmkwem karị, “mgbe eklips mere n’anyanwụ,” ma nke ahụ na-akọwa ihe karịrị ihe okwu Grik ahụ chọrọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ákwà nkewa nke ụlọ nsọ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “wee dọwaa gbadaa n’etiti,” ma ọ bụ, “wee dọwaa ụzọ abụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: Mgbe anyanwụ gbara ọchịchịrị
  rationale: Nkebiokwu a na-edobe participle Grik ahụ dị ka ọnọdụ mere n’otu oge ahụ. “Gbara ọchịchịrị” bụ Igbo doro anya nke na-egosi na ìhè anyanwụ dara, n’agbanyeghị na ἐκλείπω nwekwara ike ịpụta ịda mba, ịkwụsị, ma ọ bụ ịla n’iyi; ọ naghị ekwu kpọmkwem na ọ bụ eklips.
- source_word: ἐσχίσθη
  choice: wee dọwaa
  rationale: “Dọwaa” bụ okwu Igbo a na-ejikarị ekwu na ákwà gbawara ma ọ bụ kewaa n’ihi ndọka, ya mere ọ dabara nke ọma n’ihe a na-ekwu banyere ákwà mgbochi.
- source_word: δὲ
  choice: wee
  rationale: δὲ bụ njikọ dị nro n’ebe a. “Wee” na-ejikọta ihe abụọ ahụ n’ụzọ Igbo dị mma n’etinyeghị echiche nke mmegide siri ike.
- source_word: τὸ καταπέτασμα
  choice: ákwà mgbochi
  rationale: Okwu a na-ezo aka n’ákwà e ji kewaa ebe n’ụlọ nsọ. “Ákwà mgbochi” bụ okwu Igbo nke oge a, doro anya, ma dị mfe nghọta; a kọwara ụzọ ọzọ n’okpuru.
- source_word: τοῦ ναοῦ
  choice: nke ụlọ nsọ
  rationale: ναός n’ebe a na-ezo aka n’ụlọ nsọ, karịsịa ebe nsọ dị n’ime ya. “Ụlọ nsọ” bụ nsụgharị Igbo a maara nke ọma ma dịkwa mfe nghọta.
- source_word: μέσον
  choice: n’etiti
  rationale: Nke a na-esochi okwu Grik ahụ anya site n’igosipụta ebe ndọka ahụ dị, na-ekwughị hoo haa karịa ihe e dere na ákwà ahụ ghọrọ iberibe abụọ.
theological_decisions:
- issue: Ihe ἐκλιπόντος pụtara mgbe ọ na-ekwu banyere anyanwụ
  choice: A sụgharịrị ya n’ụzọ na-abụghị nkọwa sayensị, “anyanwụ gbara ọchịchịrị.”
  alternative: “Ìhè anyanwụ kwụsịrị” ma ọ bụ “eklips mere n’anyanwụ.”
  rationale: Okwu Grik ahụ nwere ike igosi na anyanwụ dara mba ma ọ bụ kwụsị inye ìhè, ma ọ naghị amanye ka a kọwaa ihe ahụ dị ka eklips. Nsụgharị a na-edobe ihe omume ahụ n’enweghị ịgbakwụnye ihe kpatara ya.
- issue: Nsụgharị καταπέτασμα
  choice: A sụgharịrị ya “ákwà mgbochi.”
  alternative: “ákwà nkewa.”
  rationale: “Ákwà mgbochi” na-egosi ákwà pụrụ iche dị n’ụlọ nsọ n’asụsụ Igbo dị mfe ma dị ùgwù, n’etinyeghị nkọwa okpukpe nke okwu Grik ahụ n’onwe ya na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. Nhazi “Mgbe …, … wee …” na-enye nkebiokwu participle Grik ahụ ọdịdị Igbo nkịtị, ebe okwu ndị dị n’okpuru na-echekwa ụzọ ndị ọzọ e nwere ike isi ghọta okwu ndị bụ isi.
