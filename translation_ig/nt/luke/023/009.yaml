  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọ nọgidere na-ajụ’ na-egosipụta omume na-aga n'ihu, ebe ‘ogologo oge’ na nkọwa ala peeji na-echekwa obosara nke ἐν λόγοις ἱκανοῖς.
