  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: ig
  text: Ọ nọ na-ajụ ya ọtụtụ okwu[a], ma ọ zaghị ya ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ọtụtụ ajụjụ” ma ọ bụ “n’ogologo okwu.” Nkebiokwu Grik ahụ na-egosi na ọ jụrụ ya ọtụtụ okwu ma ọ bụ jụọ ya ajụjụ ruo ogologo oge.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: ọ nọgidere na-ajụ ya ajụjụ
  rationale: Ụdị imperfect na-egosi omume gara n'ihu ma ọ bụ nke e mere ugboro ugboro; ‘nọgidere na-ajụ’ na-eme ka nke a pụta ìhè n'Igbo.
- source_word: δὲ
  choice: Ya mere … ma
  rationale: δὲ nke mbụ bụ njikọ akụkọ dị nro, ebe nke abụọ na-egosi ọdịiche dị n'etiti ajụjụ Herọd na ịgbachi nkịtị Jizọs.
- source_word: ἐν λόγοις ἱκανοῖς
  choice: ogologo oge
  rationale: Nkebiokwu Grik ahụ na-emesi ogologo na ụbara okwu n'ajụjụ ahụ ike. N'Igbo, ‘ogologo oge’ na-enye nghọta ebumpụta ụwa banyere ajụjụ gara n'ihu, ebe nkọwa ala peeji na-edobe ihe okwu Grik ahụ pụtara n'ụzọ nkịtị.
- source_word: λόγοις
  choice: ajụjụ … oge
  rationale: N'ọnọdụ a, λόγοις so na nkebiokwu na-ekwu banyere ọtụtụ okwu e ji na-ajụ ajụjụ, ọ bụghị naanị mkpụrụokwu ndị kewara ekewa.
- source_word: ἱκανοῖς
  choice: ogologo
  rationale: N'ebe a, ἱκανός na-egosi ụbara ma ọ bụ oke; ‘ogologo’ na nkebiokwu ‘ogologo oge’ na-egosi ajụjụ dị ukwuu ma dịte aka.
- source_word: αὐτὸς
  choice: ọ
  rationale: Nnochiaha ahụ na-atụgharị uche gaa n'ebe Jizọs nọ; ọdịiche ahụ apụtala nke ọma site na ‘ma ọ’ n'Igbo, n'enweghị ịgbakwunye ‘ya onwe ya’ nke ga-adị arọ.
- source_word: οὐδὲν
  choice: ihe ọ bụla
  rationale: ‘Ọ zaghị ya ihe ọ bụla’ bụ ụzọ doro anya ma bụrụkwa nke ebumpụta ụwa isi kwupụta na ọ nyeghị azịza ọbụla.
- source_word: ἀπεκρίνατο
  choice: zaghị
  rationale: Nke a bụ ntụgharị Igbo nkịtị na nke dabara adaba maka ‘zara’ n'ụdị njụ.
- source_word: αὐτῷ
  choice: ya
  rationale: N'Igbo, ‘zara ya’ na-egosi onye a na-azara n'ụzọ dị nkenke ma doo anya.
