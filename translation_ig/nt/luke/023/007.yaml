  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: ig
  text: Mgbe ọ matara na Jizọs nọ n’okpuru ikike ọchịchị Herọd[a], o zigara Herọd Jizọs, onye ya onwe ya nọkwa na Jerusalem n’ụbọchị ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’okpuru ikike Herọd.” Okwu Grik ahụ nwere ike izo aka n’ókèala Herọd na-achị ma ọ bụ n’ikike iwu o nwere n’ebe ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: Mgbe ọ matara
  rationale: Nkebi a na-egosi ihe mere tupu ngwaa bụ́ isi; nsụgharị a na-enye ya n’ụzọ Igbo dị mfe ma bụrụkwa nke okike.
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: Jizọs nọ n’okpuru ikike ọchịchị Herọd
  rationale: N’ebe a, ἐξουσία na-ezo aka n’ókè ọchịchị na ikike ikpe nke Herọd. Ịkpọ Jizọs aha na-ewepụ mgbagwoju anya nke nnọchiaha abụọ n’Igbo n’emebighị ihe ederede pụtara.
- source_word: ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην
  choice: o zigara ya Herọd
  rationale: N’agbanyeghị na ngwaa ahụ nwere ike inwe nghọta nke inyefe onye ma ọ bụ okwu ikpe n’aka onye ọchịchị ọzọ, ‘zigara’ bụ okwu Igbo doro anya nke dabara n’ọnọdụ a.
- source_word: ὄντα καὶ αὐτὸν
  choice: onye ya onwe ya nọkwa
  rationale: Nke a na-echekwa njikọ ya na Herọd nakwa nkwusi ike dị na καὶ αὐτόν.
- source_word: ἐν Ἱεροσολύμοις
  choice: na Jerusalem
  rationale: Nke a bụ aha ebe ahụ a na-ejikarị eme ihe na Standard Igbo.
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: n’ụbọchị ndị ahụ
  rationale: Ọ bụ ụzọ Igbo dị okike isi gosi oge akụkọ ahụ na-ezo aka na ya.
theological_decisions:
- issue: Nghọta ndọrọ ndọrọ ọchịchị na nke iwu nke ἐξουσία n’ihe gbasara Herọd
  choice: ikike ọchịchị
  alternative: ikike; ókè ọchịchị
  rationale: Ọnọdụ akụkọ a bụ nke ikpe na ọchịchị. ‘Ikike ọchịchị’ na-egosi ikike Herọd nwere ịchị ma kpee ndị si n’ókèala ya ikpe, n’etinyeghị nghọta nkà mmụta okpukpe n’ebe a.
translation_notes:
  register: Asụsụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘ikike ọchịchị’ dochie okwu teknụzụ siri ike, ebe nkọwa ala peeji na-echekwa nghọta nke ókèala na ikike iwu.
