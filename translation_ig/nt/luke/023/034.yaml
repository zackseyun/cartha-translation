  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: ig
  text: Ma Jizọs nọ na-ekwu[a], “Nna, gbaghara ha, n’ihi na ha amaghị ihe ha na-eme.” Mgbe ha na-ekewa uwe ya, ha fere nza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ aka ochie enweghị okwu ndị a: “Nna, gbaghara ha, n’ihi na ha amaghị ihe ha na-eme.”'
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: nọ na-ekwu
  rationale: Oge imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwughachi; ‘nọ na-ekwu’ na-echekwa akụkụ a karịa ‘kwuru.’
- source_word: Πάτερ
  choice: Nna
  rationale: Ọ bụ okwu a na-akpọ onye ihu na ihu; ‘Nna’ bụ Igbo ebumpụta ụwa, ọ naghịkwa atụkwasị ‘nke m’ nke na-adịghị na Grik.
- source_word: ἄφες
  choice: gbaghara
  rationale: N’arịrịọ a na-arịọ Chineke banyere ndị mejọrọ mmadụ, ‘gbaghara’ na-enye nghọta ἀφίημι n’ụzọ doro anya ma dịkwa mma n’Igbo.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha Grik ahụ akọwaghị kpọmkwem ndị ọ na-ekwu maka ha; ‘ha’ na-echekwa enweghị nkọwa ahụ.
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: n’ihi na ha amaghị ihe ha na-eme
  rationale: ‘Amaghị’ na-enye echiche nke οἶδα kpọmkwem, na-enweghị ịgbasa ya ka ọ bụrụ enweghị nghọta.
- source_word: διαμεριζόμενοι
  choice: kee … n’etiti onwe ha
  rationale: Nke a na-egosi na ha kewara uwe Jizọs ka onye ọ bụla nweta òkè; okwu a bụ Igbo doro anya ma na-asọ asọ.
- source_word: ἱμάτια
  choice: uwe
  rationale: ‘Uwe’ bụ okwu Igbo nkịtị ma dị ùgwù nke na-ezo aka n’ihe ndị mmadụ na-eyi.
- source_word: ἔβαλον κλήρους
  choice: fee nza
  rationale: ‘Ịfe nza’ bụ ụzọ Igbo a na-ahụkarị isi kwuo omume e ji nza ekpebi onye ga-enweta ihe.
- source_word: δὲ
  choice: Ma / wee
  rationale: ‘Ma’ na-egosi ntụgharị dị nro n’ahịrịokwu mbụ; ‘wee’ na-aga n’ihu n’akụkọ ahụ n’ụzọ Igbo ebumpụta ụwa.
theological_decisions:
- issue: Izi ezi nke okwu ahụ, “Nna, gbaghara ha, n’ihi na ha amaghị ihe ha na-eme”
  choice: Etinyere okwu ahụ n’isi ederede
  alternative: Ụfọdụ akwụkwọ aka ochie enweghị okwu ahụ
  rationale: SBLGNT tinyere okwu ahụ n’isi ederede ma jiri akara gosi na akaebe akwụkwọ dị iche. Ya mere, nsụgharị ahụ debere ya n’isi ederede ma kọwaa ọdịiche ahụ n’okpuru peeji, na-ekpebighị esemokwu akaebe ahụ n’ezoghị ọnụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Jizọs’ na ‘Nna’ mee ihe n’ụdị a maara nke ọma; ahịrịokwu ahụ na-echekwa omume na-aga n’ihu nke imperfect nakwa enweghị nkọwa kpọmkwem banyere ndị ‘ha’ bụ.
