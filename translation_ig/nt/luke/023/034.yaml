    issue: The phrase “n’etiti onwe ha” adds an explicit reflexive/distributive detail absent from the Greek, and the sequential “wee” weakens the participial relation between dividing the garments and casting lots.
    rationale: The Greek states that, while dividing his garments, they cast lots. A temporal/concurrent Igbo construction preserves this relationship without the extra reflexive wording.
