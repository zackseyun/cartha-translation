revisions:
- from: O budatara ya, kechie ya n’ákwà linin, tinye ya n’ili a wapụtara n’oké nkume[a], ebe a na-edobebeghị onye ọ bụla ruo mgbe ahụ.[b]
  to: Mgbe o budatara ya, o kechiri ya n’ákwà linin, tinye ya n’ili a wapụtara n’oké nkume[a], ebe e debeghị onye ọ bụla tupu ahụ.[b]
  rationale: The revision retains every action and qualification in the Greek while making the temporal relation explicit and the final burial-tomb clause idiomatic in modern Standard Igbo. The alternatives now accurately correspond to the relevant source expressions and retain the ambiguity-free lexical range without adding theological or harmonizing material.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:40Z'
review_pass:
  verdict: revise
  source_fidelity: 'The main sequence and burial details are retained: taking him down, wrapping him in linen, placing him in a rock-cut tomb, and its prior non-use. The final clause is better rendered with an explicit past passive construction, since the draft''s progressive-style wording ("a na-edobebeghị") is less precise for κείμενος in this context.'
  naturalness: The revision uses natural Standard Igbo sequencing ("Mgbe o budatara ya") and a clearer idiom for a tomb in which no one had previously been placed. It avoids the awkward implication that people are ordinarily "stored" in a tomb.
  terminology: '"Ákwà linin," "ili," and "oké nkume" are suitable, accessible equivalents. "E debeghị onye ọ bụla" is contextually a burial placement and preserves the source''s restrained wording without importing additional ritual detail.'
  issues:
  - severity: medium
    issue: The phrase "ebe a na-edobebeghị onye ọ bụla ruo mgbe ahụ" is not the most natural or exact expression for the Greek final clause.
    rationale: The Greek says that no one had yet been laid there. The progressive/passive-looking "a na-edobebeghị" is awkward and may suggest storage rather than prior placement in the tomb. "ebe e debeghị onye ọ bụla tupu ahụ" is idiomatic and reflects the completed prior non-use.
  - severity: low
    issue: 'Footnote b''s proposed alternative has an unnatural quantifier and tense: "ebe onye ọ bụla na-edinatụbeghị."'
    rationale: This can sound as though it concerns every individual rather than no individual. "ebe o nweghị onye dinatụrụla" clearly conveys the alternative, "where no one had ever lain."
  - severity: low
    issue: Footnote a's alternative "ili a wara awa" is less clear and may not specifically convey a rock-cut tomb.
    rationale: A direct alternative such as "ili a pịrị n'oké nkume" more clearly represents λαξευτός while remaining natural Igbo.
  revised_text: Mgbe o budatara ya, o kechiri ya n’ákwà linin, tinye ya n’ili a wapụtara n’oké nkume[a], ebe e debeghị onye ọ bụla tupu ahụ.[b]
