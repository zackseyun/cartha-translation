id: LUK.23.53
reference: Luke 23:53
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: ig
  text: Mgbe o budatara ya, o kechiri ya n’ákwà linin, tinye ya n’ili a wapụtara n’oké nkume[a], ebe e debeghị onye ọ bụla tupu ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ili a pịrị n’oké nkume,” ma ọ bụ, “n’ili a wapụtara n’ime nkume.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ebe o nweghị onye dinatụrụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: O budatara ya
  rationale: Nkebi a na-egosi na o bu ụzọ budata ozu Jizọs tupu o kechie ma debe ya; Igbo a bụ okwu doro anya ma dịkwa eke.
- source_word: ἐνετύλιξεν
  choice: kechie ya
  rationale: Ọ pụtara iji ákwà kechie ihe; a gbakwụnyeghị nkọwa olili ọzọ nke Grik na-ekwughị.
- source_word: σινδόνι
  choice: n’ákwà linin
  rationale: σινδών bụ ákwà linin, karịsịa ákwà e nwere ike iji n’olili; okwu a na-akọwa ihe e ji kechie ya n’enweghị ịkọwa ya gabiga isi mmalite.
- source_word: ἔθηκεν
  choice: tinye ya
  rationale: τίθημι n’ebe a bụ itinye ma ọ bụ idobe ozu n’ili; ‘tinye ya’ bụ Igbo nkịtị, doro anya.
- source_word: μνήματι
  choice: n’ili
  rationale: μνῆμα bụ ebe a na-eli mmadụ; ‘ili’ bụ okwu Igbo dị mfe ma kwekọọ n’ọnọdụ a.
- source_word: λαξευτῷ
  choice: a wapụtara n’oké nkume
  rationale: Ọ na-akọwa ili e ji ịwa ma ọ bụ ịkpụ nkume mee; ntụgharị a na-egosi na ili ahụ dị n’oké nkume.
- source_word: οὗ
  choice: ebe
  rationale: Ọ na-ezo aka n’ili ahụ ma na-amalite nkebi na-akọwa ya; ‘ebe’ bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: οὐδεὶς οὔπω κείμενος
  choice: ebe a na-edobebeghị onye ọ bụla ruo mgbe ahụ
  rationale: Okwu a na-egosi na e tinyebeghị onye ọ bụla n’ili ahụ tupu oge ahụ, ma na-edobe echiche οὔπω, ‘ọ bụghị ruo mgbe ahụ.’
theological_decisions:
- issue: Nkọwa olili na ụdị ili ahụ
  choice: Josef tinyere Jizọs n’ili a wapụtara n’oké nkume, nke a na-ejibeghị lie onye ọ bụla ruo mgbe ahụ.
  alternative: Josef tinyere Jizọs n’ili a wara awa, ebe onye ọ bụla na-edina mgbe ọ bụla.
  rationale: Amaokwu ahụ na-akọ ihe mere n’olili. A hapụrụ nkọwa ahụ dịka isi mmalite si kwuo ya, n’etinyeghị ihe sitere n’akụkọ ndị ọzọ ma ọ bụ nkọwa okwukwe ọzọ.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro omume dị na Grik: ibudata ya, ikechi ya, na itinye ya n’ili. E tinyere akara ndetu [a] n’akụkụ nkọwa ili ahụ na [b] n’akụkụ nkebi ikpeazụ ka ha kwekọọ n’ihe ndetu ha.'
