  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: ig
  text: Ma Herọd ahụghịkwa ya ikpe, n’ihi na o zighachiri ya n’ebe anyị nọ. Lee, ọ dịghị ihe ọ bụla o mere nke kwesịrị ọnwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ma ọbụna Herọd ahụghịkwa ya ikpe, n’ihi na o zighachiri ya n’ebe anyị nọ; lee, ọ dịghị ihe ọ bụla o mere nke kwesịrị ọnwụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: Ma Herọd ahụghịkwa ikpe dịrị ya
  rationale: Okwu Grik a hapụrụ ngwaa n’ihi na a ghọtara ya site n’okwu Paịlet kwuru tupu nke a. Ịtinye ‘ahụghị ikpe dịrị ya’ na-eme ka Igbo doo anya ma na-echekwa echiche ahụ na Herọd achọpụtaghịkwa mmehie kwesịrị ntaramahụhụ.
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: n’ihi na o zighachiri ya n’ebe anyị nọ
  rationale: ἀνέπεμψεν n’ọnọdụ akụkọ a pụtara izighachi onye ahụ azụ. ‘N’ihi na’ na-egosi ọrụ nkọwa nke γὰρ, ebe ‘n’ebe anyị nọ’ na-asụgharị πρὸς ἡμᾶς n’ụzọ Igbo si ada nke ọma.
- source_word: καὶ ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo dị mkpụmkpụ, dị ugwu, nke na-adọta uche onye na-ege ntị n’ihe Paịlet na-ekwubi.
- source_word: οὐδὲν ἄξιον θανάτου
  choice: ọ dịghị ihe ọ bụla ... nke kwesịrị ọnwụ
  rationale: 'Nhọrọ a na-echekwa ike okwu ikpe ahụ: ọ dịghị omume ọ bụla ruru ntaramahụhụ ọnwụ.'
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: o mere
  rationale: N’ebe a αὐτῷ na-arụ ọrụ igosi onye mere ihe ahụ. Igbo ‘o mere’ na-egosi n’enweghị mgbagwoju anya na okwu ahụ bụ banyere omume e boro Jizọs ebubo, ọ bụghị ihe e mere ya.
theological_decisions:
- issue: Ihe αὐτῷ pụtara mgbe ọ so πεπραγμένον
  choice: 'onye mere ihe ahụ: ‘o mere’'
  alternative: 'ihe a chọpụtara banyere ya: ‘a hụrụ n’ime ya’'
  rationale: N’ọnọdụ ikpe a, Paịlet na-ekwu na Jizọs emeghị ihe kwesịrị ọnwụ. Nhọrọ a na-ezipụta ikpe ahụ nke ọma n’Igbo ma ọ naghị eme ka ọ bụrụ ihe e mere Jizọs.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị ugwu, dee ya. ‘Lee’ na-echekwa ịdị ngwa nke ἰδού n’enweghị iji okwu ochie; ahịrịokwu ahụ ka nwere ụda nkwupụta ikpe Paịlet.
