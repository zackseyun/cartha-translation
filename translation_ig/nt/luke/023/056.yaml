- from: Mgbe ha laghachiri[a], ha kwadebere ihe na-esi ísì ụtọ na mmanụ ndị na-esi ísì ụtọ[b]. N’ụbọchị Izu Ike, ha zuru ike dị ka iwu ahụ si dị.
  to: Mgbe ha laghachisịrị[a], ha kwadebere ihe na-esi ísì ụtọ na mmanụ otite[b]. N’ụbọchị Izu Ike, ha zuru ike dị ka iwu ahụ si dị.
