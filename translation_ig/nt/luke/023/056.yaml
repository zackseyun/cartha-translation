  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: ig
  text: Mgbe ha laghachisịrị[a], ha kwadebere ihe na-esi ísì ụtọ na mmanụ otite[b]. N’ụbọchị Izu Ike, ha zuru ike dị ka iwu ahụ si dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ka ha laghachisịrị.” Okwu Grik ahụ na-egosi na ha buru ụzọ laghachi tupu ha akwadebe ihe ndị ahụ.
    reason: lexical_alternative
  - marker: b
    text: “Mmanụ otite” nwekwara ike ịpụta ude na-esi ísì ụtọ ma ọ bụ mmanụ na-esi ísì ụtọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: Mgbe ha laghachiri
  rationale: Nkebi a na-egosi na ụmụ nwanyị ahụ buru ụzọ laghachi tupu ha akwadebe ihe ndị ahụ; ntụgharị a bụ Igbo nkịtị ma doo usoro omume anya.
- source_word: δὲ
  choice: (egosipụtaghị ya iche)
  rationale: N'ebe a δέ na-aga n'ihu n'akụkọ ahụ n'ụzọ dị nro; usoro ahịrịokwu Igbo na-ebute ọganihu ahụ nke ọma n'enweghị okwu njikọ ọzọ.
- source_word: ἡτοίμασαν
  choice: ha kwadebere
  rationale: Nke a na-enye echiche nke ime ka ihe dị njikere n'ụzọ doro anya ma bụrụkwa asụsụ Igbo a na-eji ugbu a.
- source_word: ἀρώματα
  choice: ihe na-esi ísì ụtọ
  rationale: N'ọnọdụ olili ozu, okwu a na-ezo aka n'ihe ndị na-esi ísì ụtọ e ji akwadebe ozu; okwu Igbo a sara mbara ma kwekọọ n'ihe Grik kwuru.
- source_word: μύρα
  choice: mmanụ ndị na-esi ísì ụtọ
  rationale: μύρα bụ mmanụ ma ọ bụ ude e tinyere ihe na-esi ísì ụtọ; 'mmanụ ndị na-esi ísì ụtọ' na-ekewapụ ya n'ụzọ doro anya na ἀρώματα.
- source_word: τὸ μὲν σάββατον
  choice: N’ụbọchị Izu Ike
  rationale: Nke a bụ ụzọ Igbo sitere n'okike isi gosipụta oge ahụ. E gosipụtaghị μέν iche n'ihi na ọrụ ya n'ebe a dị nro ma na-atụ anya ihe na-esote.
- source_word: ἡσύχασαν
  choice: ha zuru ike
  rationale: N'ọnọdụ Izu Ike, ngwaa a pụtara ịkwụsị ọrụ ma zuru ike.
- source_word: κατὰ τὴν ἐντολήν
  choice: dị ka iwu ahụ si dị
  rationale: Nke a na-echekwa otu iwu a kpọrọ aha n'okwu Grik ma gosipụta na omume ha kwekọrọ na ya.
theological_decisions:
- issue: Ihe 'iwu ahụ' na-ezo aka na ya
  choice: E debere ya dịka 'iwu ahụ' n'ahịrị bụ isi.
  alternative: Ịkọwa ya n'ahịrị bụ isi dịka iwu Mozis banyere Izu Ike.
  rationale: Ọnọdụ okwu na-egosi iwu Tora banyere idebe Izu Ike, ma ihe odide ahụ n'onwe ya kwuru naanị 'iwu ahụ.' Ya mere, ntụgharị ahụ echekwaghị nkọwa ahụ n'ime ahịrị bụ isi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri 'Izu Ike' mee Sabbath n'ụzọ a maara nke ọma, ma zere itinye nkọwa okpukpe karịrị ihe ederede kwuru.
