  text: εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ ⸀αὐτῷ ⸀μακρόθεν, καὶ γυναῖκες αἱ ⸀συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: ig
  text: Ma ndị niile maara ya[a] na ụmụ nwanyị ndị soro ya site na Galili nọ na-eguzo n'ebe dị anya, na-ele ihe ndị a anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị niile ya na ha maara onwe ha.” Okwu Grik bụ γνωστοί nwere ike ịpụta ndị mmadụ a maara, ya bụ, ndị ya na ha maara onwe ha ma ọ bụ ndị ya na ha na-akpakọrịta.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: nọ na-eguzo
  rationale: Nke a na-egosi na ha nọgidere n’ọnọdụ iguzo n’oge ahụ, kama igosi naanị otu omume mere ngwa ngwa.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere mgbanwe ma ọ bụ ọdịiche n’etiti ihe a na ihe ndị e kwuru ozugbo tupu ya.
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: ndị niile maara ya
  rationale: Nke a bụ okwu Igbo doro anya nke na-anaghị eme ka a ghọta na naanị ezigbo ndị enyi ya ka a na-ekwu maka ha; e debere ụzọ ọzọ e nwere ike isi ghọta Grik ahụ n’ala ala peeji.
- source_word: μακρόθεν
  choice: n’ebe dị anya
  rationale: Ọ na-egosi anya dị n’etiti ndị ahụ na ebe ihe ndị a na-eme, ma bụrụkwa okwu a na-eji n’Igbo ugbu a.
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ
  choice: ụmụ nwanyị ndị soro ya
  rationale: Nkebi okwu a na-akọwa otu ụmụ nwanyị a maara n’akụkọ ahụ bụ ndị sonyere Jizọs n’ụzọ ya.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: site na Galili
  rationale: Ọ na-egosi ebe ha si malite iso ya.
- source_word: ὁρῶσαι ταῦτα
  choice: na-ele ihe ndị a anya
  rationale: Nke a na-egosi na ha nọ na-ahụ ma na-ekiri ihe ndị ahụ ka ha na-eme, ma na-edobekwa ụdị ọtụtụ nke ταῦτα.
