translation_notes:
  register: Asụsụ a bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “tinyere” jikọta ìgwè abụọ ahụ n’ụzọ doro anya, ebe “nọ na-eguzo” na “na-ele” na-echekwa ọnọdụ na omume na-aga n’ihu n’ebe ahụ.
