- from: Ndị agha ahụ bịakwara ya nso, na-akwa ya emo ma na-enye ya mmanya gbara ụka.[a]
  to: Ndị agha ahụ kwa kwara ya emo, na-abịakwute ya nso ma na-enye ya mmanya gbara ụka.[a]
  rationale: 'The revision preserves all three elements of the Greek: the soldiers’ added participation in mocking Jesus, their coming near, and their offering him ὄξος. It does not infer whether the offering was merciful or deliberately cruel beyond its setting within the mockery. The revised footnote provides a clear lexical alternative and retains the distinction between sour wine as a drink and modern assumptions about vinegar.'
