  text: ⸀ἐνέπαιξαν δὲ αὐτῷ καὶ οἱ στρατιῶται προσερχόμενοι, ⸀ὄξος προσφέροντες αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: ig
  text: Ndị agha ahụ kwa kwara ya emo, na-abịakwute ya nso ma na-enye ya mmanya gbara ụka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “viniga.” Okwu Grik ὄξος na-ezo aka na mmanya gbara ụka, ihe ọṅụṅụ dị ọnụ ala a na-aṅụkarị; a na-asụgharịkarị ya “viniga” n’ụfọdụ nsụgharị ọdịnala.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: na-akwa ya emo
  rationale: Nkebiokwu a bụ ụzọ Igbo doro anya ma dịkwa ugwu isi kọwaa ịkwa mmadụ emo n’ụzọ mkparị; ọ na-egosi omume iro dị na ἐμπαίζω.
- source_word: δὲ ... καὶ οἱ στρατιῶται
  choice: Ndị agha ahụ ... kwa
  rationale: “Kwa” na-egosi na ndị agha sonyekwara ná ndị na-akwa Jizọs emo, ma na-eme ka akụkọ ahụ gaa n’ihu n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnochiaha nnara a na-ezo aka na Jizọs; “ya” bụ nsụgharị Igbo kwesịrị ekwesị.
- source_word: οἱ στρατιῶται
  choice: Ndị agha ahụ
  rationale: “Ndị agha” bụ okwu Igbo a na-ejikarị eme ihe maka στρατιῶται; “ahụ” na-egosi otu ndị agha nọ n’ebe ahụ n’akụkọ a.
- source_word: προσερχόμενοι
  choice: bịakwara ya nso
  rationale: Nke a na-echekwa echiche nke ịbịaru Jizọs nso, ma na-ada ka Igbo nkịtị karịa nsụgharị siri ike nke usoro participle Grik.
- source_word: ὄξος
  choice: mmanya gbara ụka
  rationale: ὄξος bụ mmanya dị ọnụ ala nke gbara ụka, ọ bụghị nanị mmanya ogbugba a na-eji esi nri dịka ndị na-agụ akwụkwọ taa nwere ike ịghọta “vinegar.”
- source_word: προσφέροντες
  choice: na-enye ya
  rationale: “Na-enye ya” na-egosi na ha wetara ihe ọṅụṅụ ahụ nye Jizọs ka ọ ṅụọ, n’enweghị ịgbakwụnye ebumnuche ebere ma ọ bụ obi ọjọọ karịa ihe ederede kwuru.
theological_decisions:
- issue: Ụdị ebumnuche ndị agha ji nye Jizọs ὄξος
  choice: 'A kọwara omume ahụ n’ụzọ na-anọpụ iche n’etiti ọnọdụ ịkwa emo: ha nyere ya mmanya gbara ụka.'
  alternative: Ịkọwa ya kpọmkwem dị ka obere ebere, ma ọ bụ dị ka omume ịta ya ahụhụ na ịkwa ya emo naanị.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi ịkwa emo, ma amaokwu ahụ akọwaghị kpọmkwem ebumnuche ha ji nye ya ihe ọṅụṅụ ahụ. Ya mere, nsụgharị ahụ anaghị ekpebi ihe ederede hapụrụ ghe oghe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. A haziri participles Grik ka ha bụrụ usoro omume ebumpụta ụwa n’Igbo, ma e debere akara nkọwa ala peeji [a] ozugbo n’azụ okwu ọ na-akọwa.
