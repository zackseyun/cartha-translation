review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the women’s Galilean association with Jesus, their following of the burial party, their seeing the tomb, and their observing the manner in which his body was laid. However, “n’ime ya” (“in it”) adds a locative detail not explicitly stated in this verse, though it is contextually inferable. The source’s implicit object of “followed” may be supplied from the narrative context as “ha” without identifying it more narrowly than the text does.
  naturalness: “Ụmụanyị” should be written as the standard two-word form “Ụmụ nwanyị.” The revised sentence uses a smoother modern Igbo sequence and avoids the slightly overloaded “sokwara ha gaa.”
  terminology: “Ili” for μνημεῖον and “ozu ya” for σῶμα αὐτοῦ in this burial context are appropriate, natural, and suitably dignified. “Tọgbọ” is also appropriate for the laying of the body.
  issues:
  - severity: medium
    issue: Nonstandard word division in “Ụmụanyị.”
    rationale: Standard Igbo orthography writes this expression as “Ụmụ nwanyị.”
  - severity: low
    issue: The phrase “n’ime ya” is an addition.
    rationale: The Greek says that the women saw the tomb and how his body was laid, but does not explicitly say “in it” in this verse. The addition is inferable from context but unnecessary.
  - severity: low
    issue: “sokwara ha gaa” is less direct than necessary.
    rationale: The additive -kwara is not required to represent δέ, which can be left unexpressed in idiomatic Igbo. “Soro ha gaa” clearly preserves the contextual, unstated object of κατακολουθήσασαι.
  revised_text: Ụmụ nwanyị ndị ha na ya si Galili bịa soro ha gaa, wee hụ ili ahụ na otú e si tọgbọ ozu ya.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị soro ya si Galili bịa.”
    reason: lexical_alternative
  revision_rationale: The revision standardizes orthography, retains the source’s narrative sequence, preserves the contextually implicit object of “followed” without over-specifying it, and removes the added phrase “n’ime ya.” The footnote gives the viable alternative phrasing for the women’s accompanying Jesus from Galilee.
