revisions:
- from: Ụmụanyị ndị si na Galili soro ya bịa sokwara ha gaa, hụ ili ahụ na otú e si tọgbọ ozu ya n’ime ya.[a]
  to: Ụmụ nwanyị ndị ha na ya si Galili bịa soro ha gaa, wee hụ ili ahụ na otú e si tọgbọ ozu ya.[a]
  rationale: The revision standardizes orthography, retains the source’s narrative sequence, preserves the contextually implicit object of “followed” without over-specifying it, and removes the added phrase “n’ime ya.” The footnote gives the viable alternative phrasing for the women’s accompanying Jesus from Galilee.
  reviewer_model: gpt-5.6-terra
