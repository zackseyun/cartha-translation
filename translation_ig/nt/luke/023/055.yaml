source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: ig
  text: Ụmụ nwanyị ndị ha na ya si Galili bịa soro ha gaa, wee hụ ili ahụ na otú e si tọgbọ ozu ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị soro ya si Galili bịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: sokwara ha gaa
  rationale: Okwu a bụ participle aorist nke na-egosi na ụmụanyị ahụ sochiri ndị buru ozu Jizọs gaa. Ịsị “sokwara ha gaa” na-eme ka onye a na-eso doo anya site n’ihe gbara amaokwu ahụ gburugburu, ma na-edebe usoro omume ahụ n’Igbo dị ndụ.
- source_word: δέ
  choice: -kwara
  rationale: δέ bụ njikọ akụkọ dị nro. Kama itinye okwu oge dịka “ugbu a,” mgbakwunye “-kwara” na ngwaa na-egosi njikọ na ịga n’ihu nke akụkọ ahụ n’ụzọ Igbo si ekwu ya.
- source_word: αἱ γυναῖκες
  choice: Ụmụanyị ndị
  rationale: Nkọwa a na-ezo aka n’otu ụmụanyị a maara ama n’akụkọ ahụ; “Ụmụanyị ndị” na-edebe article na relative clause n’ụzọ Igbo nkịtị.
- source_word: αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: ndị si na Galili soro ya bịa
  rationale: 'Nke a na-egosi omume mere tupu oge a: ha si Galili bịa, ha na ya sokwa. Nhazi a na-edebe ebe ha siri bịa na mmekọrịta ha na Jizọs n’asụsụ Igbo doro anya.'
- source_word: ἐθεάσαντο
  choice: hụ
  rationale: θεάομαι nwere ike ịpụta ilebara ihe anya nke ọma, ma “hụ” bụ okwu Igbo kachasị eke ebe ihe ndị ha hụrụ—ili na otu e si tọgbọ ozu—kọwara n’otu ahịrịokwu ahụ.
- source_word: τὸ μνημεῖον
  choice: ili ahụ
  rationale: N’ọnọdụ olili mmadụ, “ili” bụ okwu Igbo ziri ezi ma bụrụkwa nke ndị mmadụ na-aghọta ngwa ngwa; “ahụ” na-egosi ili a kapịrị ọnụ.
- source_word: ὡς ἐτέθη
  choice: otú e si tọgbọ
  rationale: ὡς na-egosi etu e si mee ihe, ebe passive ἐτέθη pụtara na e debere ozu ahụ. “Otú e si tọgbọ” bụ okwu dị ùgwù ma kwekọọ n’ọnọdụ olili.
- source_word: τὸ σῶμα αὐτοῦ
  choice: ozu ya
  rationale: Ọ bụ ezie na σῶμα bụ “ahụ,” n’ọnọdụ a Jizọs anwụọla ma a na-eli ya; “ozu ya” bụ okwu Igbo kpọmkwem na nke eke maka ahụ onye nwụrụ anwụ.
theological_decisions:
- issue: Usoro participle κατακολουθήσασαι na ngwaa bụ isi ἐθεάσαντο
  choice: 'E gosipụtara ha dịka omume sochiri ibe ha: “sokwara ha gaa, hụ”'
  alternative: “Mgbe ha sochara ... ha hụrụ”
  rationale: Nke a bụ mkpebi gbasara usoro asụsụ, ọ bụghị nkwenkwe. Ọ na-edebe na ụmụanyị ahụ buru ụzọ soro gaa, mesịa hụ ili ahụ na otú e si debe ozu ahụ.
- issue: Onye ụmụanyị ahụ sochiri na κατακολουθήσασαι
  choice: “sokwara ha gaa,” ya bụ ndị gara idobe ozu ahụ dịka ọnọdụ akụkọ si gosi
  alternative: Ịhapụ ihe nnọchiaha wee sị naanị “soro gaa”
  rationale: Greek hapụrụ object nke “soro” ka ọnọdụ akụkọ kọwaa ya. Igbo chọrọkarị object n’ebe a ka okwu ghara ịda ogbi; “ha” na-ezo aka n’ìgwè ndị na-aga ili, ọ bụghị na Jizọs ji ụkwụ aga.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere itinye “Ugbu a” maka δέ, ebe ọ bụghị okwu oge doro anya; kama nke ahụ, “-kwara” na-egosi njikọ akụkọ. Akara nkọwa ala ala [a] dị n’ederede bụ isi dịka achọrọ.
