source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: ig
  text: Ìgwè mmadụ niile ahụ gbakọtara ka ha kirie ihe a[a], mgbe ha hụrụ ihe ndị mere, ha nọ na-alaghachi, na-akụ aka n’obi ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka ikiri ihe a.”
    reason: lexical_alternative
  - marker: b
    text: Ịkụ aka n’obi bụ ihe e ji egosi mwute, iru újú, ma ọ bụ akpata oyi n’ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: gbakọtara
  rationale: Ọ na-egosi na ndị ahụ bịara zukọta n’ebe ihe ahụ mere; okwu a dị mfe ma na-edobe echiche nke ịgbakọta ọnụ.
- source_word: ὄχλοι
  choice: ìgwè mmadụ niile
  rationale: “Ìgwè mmadụ” bụ ụzọ Igbo si ekwu ọtụtụ mmadụ gbakọrọ ọnụ; “niile” na-anọchi πάντες ma na-eme ka ahịrịokwu ahụ bụrụ nke eke.
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: ikiri ihe ngosi a
  rationale: Nke a na-egosi na ha bịara ịhụ ihe a na-ele n’ihu ọha. Ihe ọzọ nwere ike ịbụ “ikiri ihe a,” nke e debere n’ala peeji n’ihi obosara ihe θεωρία pụrụ ịpụta.
- source_word: θεωρήσαντες
  choice: mgbe ha hụrụ
  rationale: Ọ na-egosi na ịhụ ihe ndị ahụ mere tupu omume bụ isi nke ịlaghachi, ma ọ bụkwa okwu Igbo doro anya.
- source_word: τὰ γενόμενα
  choice: ihe ndị mere
  rationale: Nke a bụ ntụgharị Igbo dị nkenke ma kwekọọ n’echiche nke ihe ndị ahụ mere.
- source_word: τύπτοντες τὰ στήθη
  choice: na-akụ aka n’obi ha
  rationale: Ọ na-edobe mmegharị ahụ a kọwara n’asụsụ Grik, n’ụzọ ndị Igbo nke oge a ga-aghọta, na-akọwaghị kpọmkwem ihe dị n’obi ha.
- source_word: ὑπέστρεφον
  choice: nọ na-alaghachi
  rationale: Ụdị a na-egosipụta omume na-aga n’ihu ma ọ bụ nke ìgwè dị iche iche nọ na-eme, dịka imperfect Grik si gosi.
theological_decisions:
- issue: Ihe mmegharị ìgwè mmadụ ahụ pụtara n’ime mmụọ ha
  choice: 'E debere naanị mmegharị ahụ: “na-akụ aka n’obi ha.”'
  alternative: Ịsị kpọmkwem na ha chegharịrị, ma ọ bụ na ọ bụ naanị mwute ma ọ bụ ụjọ jidere ha.
  rationale: Asụsụ Grik kọwara ihe ha mere, ma ọ kọwaghị kpọmkwem ma ọ bụ nchegharị, obi amamikpe, mwute, ma ọ bụ ụjọ. Ya mere, ntụgharị ahụ anaghị ekpebi ihe ederede hapụrụ ghe oghe.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “nọ na-alaghachi” chekwaa ọdịdị omume na-aga n’ihu nke imperfect, ma zere ịkọwa mmegharị ahụ dịka nchegharị n’onwe ya.
