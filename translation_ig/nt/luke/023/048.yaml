  rationale: The revision replaces “ihe ngosi” with a neutral expression for the public sight, preserving the contextual force of θεωρία without suggesting a staged performance. It retains the antecedent sense of seeing what happened, the imperfective return, and the non-interpretive rendering of the crowd's chest-beating gesture.
