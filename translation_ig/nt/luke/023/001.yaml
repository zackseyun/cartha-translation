review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the rising and leading of Jesus, but “nzukọ ha niile” is structurally ambiguous in Igbo (it can mean ‘all their meetings’) and “gaa n’ihu Paịlet” narrows the movement-to-a-person expression into the judicial idea of appearing before him. The Greek says that their entire multitude rose and led him to Pilate.
  naturalness: The revised wording is idiomatic Standard Igbo and keeps the compact narrative sequence. “Ìgwè mmadụ ha dum” clearly denotes the whole gathered crowd.
  terminology: “Paịlet” is an appropriate Standard Igbo form of the name. “Ìgwè mmadụ” renders πλῆθος without assigning the group a more formal institutional status than the Greek supports.
  issues:
  - severity: medium
    issue: “nzukọ ha niile” is ambiguous
    rationale: In ordinary Igbo it may be understood as ‘all their meetings,’ rather than as the total gathered body of people. πλῆθος is better conveyed here by “ìgwè mmadụ.”
  - severity: medium
    issue: “gaa n’ihu Paịlet” is more interpretive than the source
    rationale: Although fitting the legal context, it expresses appearing before Pilate. ἐπὶ τὸν Πιλᾶτον after a motion verb more directly indicates taking him to Pilate; “gaa n’ebe Paịlet nọ” preserves that sense without adding the courtroom nuance.
  revised_text: Ìgwè mmadụ ha dum biliri duru ya gaa n’ebe Paịlet nọ.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “nzukọ ha dum.”
    reason: lexical_alternative
