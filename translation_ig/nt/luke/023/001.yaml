  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: ig
  text: Ìgwè mmadụ ha dum biliri duru ya gaa n’ebe Paịlet nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nzukọ ha dum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe ahụ
  rationale: N’akụkọ a, njikọ a na-ebute ihe omume sochirinụ; “Mgbe ahụ” na-asụ Igbo nke ọma ma na-egosi usoro ihe mere n’etinyeghị nkọwa ọzọ.
- source_word: ἀναστὰν
  choice: biliri
  rationale: Okwu a bụ participle aorist nke ἀνίστημι, na-egosi omume mere tupu isi ngwaa; “biliri” na-edobe usoro ahụ n’Igbo nkịtị.
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: nzukọ ha niile
  rationale: πλῆθος pụtara ìgwè ma ọ bụ ndị gbakọtara ọnụ. N’ọnọdụ ikpe a, “nzukọ” na-egosi ahụ ndị ahụ gbakọtara n’enweghị ịkpọ ha ụlọọrụ ọchịchị kpọmkwem; ἅπαν na αὐτῶν pụtara “ha niile.”
- source_word: ἤγαγον
  choice: duru
  rationale: Aorist nke ἄγω pụtara idu ma ọ bụ ibuga; “duru” na-egosi na ha kpọọrọ Jizọs gaa ebe ahụ.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a bụ ihe ngwaa metụtara, na-ezo aka na Jizọs.
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: gaa n’ihu Paịlet
  rationale: ἐπί na accusative mgbe ngwaa mmegharị gasịrị na-egosi ịga n’ebe mmadụ nọ. “N’ihu Paịlet” na-asụ Igbo nke ọma n’ọnọdụ ikpe ahụ, ọ bụ ezie na ọ na-eme ka echiche nke ịpụta n’ihu ya pụta ìhè.
- source_word: Πιλᾶτον
  choice: Paịlet
  rationale: E dere aha onye ahụ dịka ụda ya si daba n’usoro mkpọpụta na odide Igbo.
theological_decisions:
- issue: Otú e si akọwa ndị niile gbakọtara n’ọnọdụ ikpe a
  choice: nzukọ ha niile
  alternative: ìgwè ha niile
  rationale: “Nzukọ” dabara na ndị ahụ ka ha gbakọrọ maka ikpe, ma ọ naghị ekwu hoo haa na ọ bụ aha ụlọọrụ iwu pụrụ iche. Ihe odide ala peeji na-edobe ụzọ ọzọ πλῆθος nwere ike isi pụta.
translation_notes:
  register: 'Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro omume abụọ ahụ: ha biliri, mesịa duru ya gaa n’ihu Paịlet.'
