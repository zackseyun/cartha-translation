revisions:
- from: Mgbe ahụ, nzukọ ha niile biliri duru ya gaa n’ihu Paịlet.[a]
  to: Ìgwè mmadụ ha dum biliri duru ya gaa n’ebe Paịlet nọ.[a]
  rationale: The revision replaces an ambiguous collective noun with a clear rendering of πλῆθος and renders the directional phrase without importing the additional notion of formal appearance before a judge. It retains the totality expressed by ἅπαν and αὐτῶν, the preceding action of rising, and the standard Igbo form of Pilate’s name.
  reviewer_model: gpt-5.6-terra
