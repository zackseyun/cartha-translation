id: LUK.23.44
reference: Luke 23:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: ig
  text: Ọ bụworị ihe dị ka awa nke isii[a], ọchịchịrị wee kpuchie ala ahụ dum[b] ruo awa nke itoolu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, site n’ihe dị ka etiti ehihie ruo ihe dị ka elekere atọ nke ehihie.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “ụwa dum.” Okwu Grik bụ γῆ nwere ike ịpụta “ala” ma ọ bụ “ụwa.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἤδη
  choice: ọ bụworị
  rationale: Ọ na-egosi na oge ahụ eruworị n’usoro akụkọ ahụ; nke a bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya.
- source_word: ὡσεὶ
  choice: ihe dị ka
  rationale: Ọ na-echekwa echiche nke oge a na-atụghị kpọmkwem.
- source_word: ὥρα ἕκτη
  choice: awa nke isii
  rationale: Ọ na-echekwa usoro ịgụ awa dị n’asụsụ mbụ; nkọwa ala peeji na-akọwa ya n’oge a na-eji ugbu a.
- source_word: σκότος
  choice: ọchịchịrị
  rationale: Nke a bụ okwu Igbo nkịtị, doro anya, nke kwekọrọ n’aha Grik ahụ.
- source_word: ἐγένετο
  choice: wee kpuchie
  rationale: N’usoro okwu Igbo, ‘ọchịchịrị wee kpuchie’ na-egosi na ọchịchịrị bịara gbasaa n’elu ebe ahụ, n’enweghị ịgbakwụnye nkọwa pụrụ iche.
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: ala ahụ dum
  rationale: γῆ nwere ike ịpụta ala ma ọ bụ ụwa. ‘Ala ahụ dum’ na-ezere ikpebi na ọ bụ ụwa niile, ebe nkọwa ala peeji na-echekwa nhọrọ nke ọzọ.
- source_word: ἕως ὥρας ἐνάτης
  choice: ruo awa nke itoolu
  rationale: Ọ na-echekwa otu e si gụọ oge n’asụsụ mbụ ma kwekọọ na ‘awa nke isii.’
theological_decisions:
- issue: Ókè ebe γῆ na-ezo aka n’ihe banyere ọchịchịrị ahụ
  choice: ala ahụ dum
  alternative: ụwa dum
  rationale: Okwu Grik ahụ nwere ike izo aka n’otu mpaghara ala ma ọ bụ n’ụwa dum. Isiokwu ahụ ji nhọrọ na-adịghị amanye nghọta zuru ụwa ọnụ, ma nkọwa ala peeji na-echekwa nghọta sara mbara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. E chekwara usoro awa nke asụsụ mbụ n’isiokwu, ma kọwaa ya n’ala peeji ka ndị na-agụ ya ghọta ya nke ọma.
