id: LUK.23.3
reference: Luke 23:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: ig
  text: Pilat wee jụọ ya sị, “Ị bụ Eze ndị Juu[a]?” Ọ zara ya sị, “Ọ bụ gị kwuru ya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Judia.” Okwu Grik a nwere ike ịpụta ndị Juu ma ọ bụ ndị Judia, dabere n’ọnọdụ okwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Gị kwuru ya,” ma ọ bụ, “Ee, ọ dị ka i kwuru.” Azịza Grik ahụ dị mkpirikpi, a pụkwara ịghọta ya dịka nkwenye a kpaara ókè.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: wee
  rationale: N’ebe a, δέ na-aga n’ihu n’akụkọ ahụ n’enweghị nnukwu mmegide; “wee” na-egosi usoro ihe mere n’Igbo nke ọma.
- source_word: ἠρώτησεν αὐτὸν λέγων
  choice: jụọ ya sị
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma dị mkpirikpi si egosipụta ajụjụ sochiri okwu kpọmkwem, ma na-eburu ma ἠρώτησεν ma λέγων.
- source_word: βασιλεὺς
  choice: Eze
  rationale: βασιλεύς pụtara eze n’ụzọ doro anya; “onye ọchịchị” ga-eme ka ebubo banyere ịbụ eze ghara ịdị ike dịka o siri dị na Grik.
- source_word: τῶν Ἰουδαίων
  choice: ndị Juu
  rationale: N’ebe a, “Eze ndị Juu” bụ aha ebubo ndọrọ ndọrọ ọchịchị na okpukpe a maara nke ọma. Ma n’ihi na Ἰουδαῖοι nwekwara ike ịpụta ndị Judia, e debere nke ahụ n’okpuru peeji.
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: Ọ zara ya sị
  rationale: Ụdị a bụ Igbo nkịtị ma na-echekwa ma echiche nke ịza mmadụ ma nke ikwu okwu.
- source_word: Σὺ λέγεις
  choice: Ọ bụ gị kwuru ya
  rationale: Azịza a na-etinye okwu ahụ n’ọnụ Pilat ma ọ naghị agọnahụ ya kpamkpam. Ọ na-echekwa mkpụmkpụ na ihe a na-akọwaghị hoo haa dị n’Grik karịa ịsụgharị ya dịka “Ee.”
theological_decisions:
- issue: Ike na nzube azịza Jizọs, Σὺ λέγεις
  choice: “Ọ bụ gị kwuru ya,” dịka nkwenye a kpaara ókè nke na-edowe okwu ahụ dịka nke Pilat.
  alternative: “Ee, ọ dị ka i kwuru,” dịka nkwenye zuru oke; ma ọ bụ “Gị kwuru ya,” dịka ikewapụ onwe ya karịa.
  rationale: Grik ahụ dị mkpirikpi, ọ pụkwara ịbụ nkwenye a kpaara ókè. Nsụgharị isi anaghị eme ka ọ bụrụ “Ee” doro anya, ọ naghịkwa eme ya ka ọ bụrụ ịjụ aha ahụ; ya mere ọ na-echekwa esemokwu okwu na nke nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Jụọ ya sị” na “zara ya sị” bụ usoro okwu Igbo sitere n’okike; “Ọ bụ gị kwuru ya” na-echekwa azịza ahụ dịka nke na-adịghị ekwu “Ee” hoo haa.
