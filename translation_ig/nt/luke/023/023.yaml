  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: ig
  text: Ma ha nọgidere na-ekwusi ike n’olu dara ụda[a], na-arịọ ka a kpọgide ya n’obe, olu ha wee merie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpu ha wee merie.” N’asụsụ Grik, a kwughachiri okwu a sụgharịrị “olu” na nkejiokwu abụọ ahụ; n’ebe a, a pụkwara ịsụgharị ya “mkpu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέκειντο
  choice: nọgidere na-ekwusi ike
  rationale: Oge ngwaa ahụ na-egosi nrụgide na-ekweghị akwụsị; okwu a na-egosipụta ịnọgide na-ekwusi ike, ọ bụghị naanị otu arịrịọ.
- source_word: φωναῖς μεγάλαις
  choice: n’olu dara ụda
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche nke ikwu okwu ma ọ bụ iti mkpu n’olu siri ike.
- source_word: αἰτούμενοι
  choice: na-arịọ
  rationale: Nke a na-edobe isi ihe αἰτέω pụtara, ebe okwu ndị gbara ya gburugburu na-egosipụtaworị nrụgide na ịdị ike nke arịrịọ ahụ.
- source_word: αὐτὸν σταυρωθῆναι
  choice: ka a kpọgide ya n’obe
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si gosipụta ihe ha rịọrọ, ma na-edobekwa ụdị nnara-eme nke ngwaa Grik ahụ.
- source_word: κατίσχυον
  choice: wee merie
  rationale: Ọ na-egosi na olu ha nwetara aka n’elu ma merie n’ihe a na-ekpebi; “wee merie” na-asụ nke a n’Igbo doro anya.
- source_word: αἱ φωναὶ αὐτῶν
  choice: olu ha
  rationale: Idowe “olu” na nkejiokwu abụọ ahụ na-echekwa nkwughachi nke φωνή dị n’asụsụ Grik.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A họọrọ “nọgidere na-ekwusi ike” iji gosipụta omume na-aga n’ihu, ma debeghachi “olu” ugboro abụọ dịka ederede Grik si mee.
