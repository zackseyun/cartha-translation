    text: Ma ọ bụ, “mkpu ha wee merie.” N’asụsụ Grik, a kwughachiri okwu a sụgharịrị “olu” na nkejiokwu abụọ ahụ; n’ebe a, a pụkwara ịsụgharị ya “mkpu.”
    reason: lexical_alternative
  revision_rationale: A gbanwere naanị ihe odide ala peeji iji wepụ okwu na-adịghị ekwe n’ụzọ ebumpụta ụwa n’Igbo. Ihe odide ọhụrụ ahụ na-enye nhọrọ sụgharịrọ nke ọma, na-echekwa nkwughachi okwu Grik φωνή, ma anaghị agbanwe ihe amaokwu ahụ pụtara.
