id: LUK.23.12
reference: Luke 23:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: ig
  text: N’ụbọchị ahụ kpọmkwem, Herọd na Paịlet ghọrọ enyi[a], n’ihi na tupu mgbe ahụ, iro dịrị n’etiti ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “malitere imeso ibe ha omume enyi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha abụọ bụbu ndị iro.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: ghọrọ
  rationale: Okwu a na-egosi mgbanwe mere n’ọnọdụ mmekọrịta ha; “ghọrọ” na-egosipụta ya nke ọma n’Igbo.
- source_word: φίλοι
  choice: enyi
  rationale: Dị ka aha e ji kọwaa ọnọdụ ọhụrụ ha, “enyi” bụ nsụgharị doro anya ma bụrụkwa nke nkịtị; ọ naghị ekpebi ma nke a ọ̀ bụ ezigbo ọbụbụenyi miri emi ka ọ̀ bụ naanị mmekọrịta ndọrọ ndọrọ ọchịchị.
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: Herọd na Paịlet
  rationale: Nchịkọta aha abụọ ahụ na-egosi ndị abụọ sonyere n’otu mgbanwe mmekọrịta ahụ; Igbo anaghị achọ ka a gbakwunye “ha abụọ” ebe a.
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: N’ụbọchị ahụ kpọmkwem
  rationale: “Kpọmkwem” na-echekwa nkwusi ike dị n’okwu Grik ahụ—ọ bụ n’ụbọchị ahụ n’onwe ya.
- source_word: μετ’ ἀλλήλων
  choice: ghọrọ enyi
  rationale: N’Igbo, ịsị na mmadụ abụọ “ghọrọ enyi” na-egosi mmekọrịta ha na ibe ha n’enweghị ikwughachi “n’etiti onwe ha,” nke ga-ada arọ.
- source_word: προϋπῆρχον
  choice: tupu mgbe ahụ
  rationale: Nkebi a na-egosi ọnọdụ iro nke dịlarị ma na-aga n’ihu tupu mgbanwe e mere n’ụbọchị ahụ.
- source_word: ἐν ἔχθρᾳ
  choice: iro dịrị
  rationale: “Iro” na-echekwa ụdị aha ἔχθρα ma na-egosipụta mmegide ma ọ bụ enweghị mmekọrịta ọma.
- source_word: ὄντες πρὸς αὑτούς
  choice: n’etiti ha
  rationale: Nke a na-egosipụta na iro ahụ bụ nke ha abụọ nwere megide ibe ha, n’Igbo dị nkenke ma kwe nghọta.
theological_decisions:
- issue: Ụdị mgbanwe mmekọrịta dị n’etiti Herọd na Paịlet
  choice: Ha “ghọrọ enyi,” dị ka okwu Grik φίλοι si kwuo.
  alternative: Ha “malitere imeso ibe ha omume enyi.”
  rationale: Amaokwu ahụ na-akọ mgbanwe mmekọrịta ha ma ọ kọwaghị ma ọ bụ ezigbo ọbụbụenyi miri emi ka ọ bụ njikọ ndọrọ ndọrọ ọchịchị. Isi okwu na ndetu ala peeji na-echekwa ohere abụọ ahụ.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke oge a, dị mfe ma dị ùgwù. E debere nkwusi ike nke ἐν αὐτῇ τῇ ἡμέρᾳ site n’okwu “ụbọchị ahụ kpọmkwem,” ma zere ịkọwapụta ụdị ọbụbụenyi ha karịa ihe ederede Grik kwuru.
