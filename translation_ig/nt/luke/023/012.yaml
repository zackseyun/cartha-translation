  source_fidelity: The translation accurately conveys the aorist relational change (ἐγένοντο φίλοι), the emphatic temporal phrase ('N’ụbọchị ahụ kpọmkwem'), and the prior mutual hostility. 'Ghọrọ enyi' naturally expresses that the two men became friends, without asserting a deeper or more enduring alliance than the Greek specifies. 'Iro dịrị n’etiti ha' preserves the reciprocal force of πρὸς ἑαυτούς in idiomatic Igbo.
  naturalness: The wording is clear, modern Standard Igbo, and appropriately restrained in register. The fronted time phrase is natural and retains the Greek emphasis. The sentence is concise without omitting any material sense.
