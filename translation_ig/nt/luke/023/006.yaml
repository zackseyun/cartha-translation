  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: ig
  text: Ma mgbe Paịlet nụrụ nke a, ọ jụrụ ma nwoke ahụ ọ̀ bụ onye Galili.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: Paịlet
  rationale: Ọ bụ nsụgharị ụda aha onye ahụ n'ụdị a na-ahụkarị ma dị mfe ịgụ n'Igbo.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe n'akụkọ ahụ; “Ma” dabara na nzaghachi Paịlet nye ihe ọ nụrụ.
- source_word: ἀκούσας
  choice: mgbe ... nụrụ nke a
  rationale: Nke a na-enye aorist participle ahụ n'Igbo eke. E tinyere “nke a” site n'ihe gbara amaokwu ahụ gburugburu, ebe Grik hapụrụ ihe a nụrụ n'ekwughị ya kpọmkwem.
- source_word: ἐπηρώτησεν
  choice: ọ jụrụ
  rationale: Nke a bụ okwu Igbo nkịtị na nke doro anya maka ịjụ ma ọ bụ ịmata ihe.
- source_word: εἰ
  choice: ma
  rationale: “Ma” na-ewebata ajụjụ a kọrọ n'ụzọ eke n'Igbo.
- source_word: ὁ ἄνθρωπος
  choice: nwoke ahụ
  rationale: Ọ na-echekwa ntụaka doro anya nke article Grik n'ejighị aha Jizọs dochie okwu isi mmalite.
- source_word: Γαλιλαῖός
  choice: onye Galili
  rationale: Ọ na-egosi onye sitere na mpaghara Galili ma ọ bụ onye e ji Galili mara, kwekọọ na adjective Grik.
- source_word: ἐστιν
  choice: ọ̀ bụ
  rationale: Igbo anaghị achọ ịgbanwe copula a gaa n'oge gara aga n'ajụjụ a kọrọ; ụdị a na-echekwa present Grik ma na-ada eke.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ajụjụ a kọrọ n'ụzọ Igbo eke, ma e chekwaghị akara ụkwụ Bekee n'ihi na ihe ọ kọwara bụ naanị ụdị okwu Bekee, ọ bụghị ọdịiche dị na isi mmalite Grik.
