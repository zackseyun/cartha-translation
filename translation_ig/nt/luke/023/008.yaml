  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: ig
  text: Mgbe Herọd hụrụ Jizọs, ọ ṅụrịrị ọṅụ nke ukwuu, n’ihi na ọ dịla anya ọ chọrọ ịhụ ya, ebe ọ bụ na ọ nọ na-anụ akụkọ banyere ya[a]. Ọ nọkwa na-atụ anya ịhụ otu ihe ịrịba ama Jizọs ga-eme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ọ bụ na ọ nụrụ akụkọ banyere ya.” Okwu Grik ahụ nwere ike ịsụgharị n’ụzọ dị mfe otú a, ma infinitive dị n’ụdị ugbu a pụrụ igosi na ọ na-anụ akụkọ ugboro ugboro ma ọ bụ n’oge na-aga n’ihu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “otu ọrụ ebube.” Okwu Grik bụ “ihe ịrịba ama” (σημεῖον); ọ pụrụ izo aka n’omume dị ebube e lere anya dị ka ihe nwere ihe ọ pụtara ma ọ bụ na-egosi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρη λίαν
  choice: ọ ṅụrịrị ọṅụ nke ukwuu
  rationale: Nke a na-edobe omume nke ‘ịṅụrị ọṅụ’ na ike okwu λίαν, ma bụrụkwa Igbo doro anya ma dị ùgwù.
- source_word: ἐξ ἱκανῶν χρόνων
  choice: ọ dịla anya
  rationale: Akpaokwu a na-egosi ogologo oge, na-enweghị ikwu kpọmkwem na ọ bụ ọtụtụ afọ.
- source_word: θέλων ἰδεῖν αὐτόν
  choice: ọ chọrọ ịhụ ya
  rationale: θέλω pụtara ịchọ ma ọ bụ inwe ọchịchọ; nsụgharị a bụ Igbo nkịtị ma na-edobe ihe Herọd nọ na-achọ ogologo oge.
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: ebe ọ bụ na ọ nọ na-anụ akụkọ banyere ya
  rationale: διά na infinitive na-egosi ihe kpatara ya; ọdịdị present nke ἀκούειν nwekwara ike igosi na akụkọ ahụ na-erute ya ugboro ugboro ma ọ bụ na-aga n’ihu.
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: ọ nọkwa na-atụ anya ịhụ ... otu ihe ịrịba ama
  rationale: ‘Na-atụ anya’ na-egosipụta olileanya ma ọ bụ atụmanya dị na ἐλπίζω; ‘ihe ịrịba ama’ na-edobe nghọta sara mbara nke σημεῖον kama ime ya naanị ‘ọrụ ebube.’
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: ka ọ na-eme
  rationale: Usoro a na-egosi na Herọd chọrọ ịhụ ihe ịrịba ama ahụ ka Jizọs na-eme ya, ma na-asụ ya n’ụzọ Igbo dị ụtọ.
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: Mgbe Herọd hụrụ Jizọs
  rationale: Aorist participle a na-arụ ọrụ oge n’ebe a, ya mere ‘Mgbe ... hụrụ’ na-eme ka njikọ ya na isi ngwaa doo anya.
theological_decisions:
- issue: Ihe σημεῖον pụtara
  choice: ihe ịrịba ama
  alternative: ọrụ ebube
  rationale: ‘Ihe ịrịba ama’ na-echekwa okwu Grik nke nwere ike ịbụ ọrụ dị ebube a na-ele anya dị ka ihe nwere ihe ọ na-egosi; ọ naghị emechi nghọta ahụ naanị n’ọrụ ebube.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ùgwù. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọtụtụ nkebi ihe kpatara ya ghara ime ka ọ sie onye na-agụ ya ike, ma njikọ echiche nke Grik ka dị.
