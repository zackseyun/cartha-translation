  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: ig
  text: Ma onye nke ọzọ zara ya, baara ya mba, sị, “Ọ bụ na ọbụna gị adịghị atụ egwu Chineke, ebe ọ bụ na ị nọkwa n’okpuru otu ikpe ahụ[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’otu ikpe ọmụma ahụ,” ma ọ bụ “n’okpuru otu ntaramahụhụ ahụ.” Okwu Grik κρίμα nwere ike ịpụta ikpe, mkpebi ikpe, ma ọ bụ ntaramahụhụ e kpebiri; n’ebe a, ọ na-ekwu banyere otu mkpebi ntaramahụhụ ahụ metụtara ha abụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: Ma onye nke ọzọ zara ya
  rationale: “Ma” gosiri ọdịiche dị nro nke δέ; “onye nke ọzọ” kewapụtara onye omekome nke abụọ n’onye mbụ, ebe “zara ya” bụ ụzọ Igbo si ekwu ἀποκριθείς n’akụkọ.
- source_word: ἐπιτιμῶν αὐτῷ ἔφη
  choice: baara ya mba, sị
  rationale: “Baara ya mba” na-echekwa ike nke ἐπιτιμάω, “sị” abụrụkwa ụzọ e si ebido okwu kpọmkwem n’Igbo; usoro a na-egosi na ọ zara ya site n’ịbara ya mba.
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: Ọ bụ na ọbụna gị adịghị atụ egwu Chineke
  rationale: “Ọ bụ na ... adịghị” na-enye ajụjụ nkwutọ ahụ n’Igbo, “ọbụna gị” na-echekwa nkwusi ike nke οὐδέ na σὺ, “ịtụ egwu Chineke” echekwaghị okwu na ibu echiche okpukpe nke φοβεῖσθαι τὸν θεόν.
- source_word: ὅτι
  choice: ebe ọ bụ na
  rationale: N’ebe a ὅτι na-enye ihe mere e ji baa ya mba; “ebe ọ bụ na” na-egosi njikọ ihe kpatara ya nke ọma n’Igbo.
- source_word: ἐν τῷ αὐτῷ κρίματι εἶ
  choice: otu ikpe ahụ dịkwa gị n’ahụ́
  rationale: N’ọnọdụ ịkpọgide n’obe a, κρίμα na-ezo aka n’ikpe ma ọ bụ ntaramahụhụ iwu nke ha abụọ nọ n’okpuru ya. Akpaalaokwu “ikpe dị mmadụ n’ahụ́” na-ada n’ụzọ Igbo dị ndụ, “dịkwa” egosikwa na otu ikpe ahụ metụtara onye a dịka o metụtara onye nke ọzọ.
theological_decisions:
- issue: Ihe “ịtụ egwu Chineke” pụtara n’ajụjụ nkwutọ a
  choice: ịtụ egwu Chineke
  alternative: ịsọpụrụ Chineke / inwe nsọpụrụ nye Chineke
  rationale: A hapụrụ akpaalaokwu Baịbụl ahụ n’ụdị ya siri ike, n’ebughị ya gaa naanị n’echiche nsọpụrụ ma ọ bụ tinye nkọwa ozizi karịrị ihe ederede kwuru.
- issue: Ogologo echiche κρίμα
  choice: ikpe
  alternative: ikpe ọmụma / ntaramahụhụ e kpebiri
  rationale: “Ikpe” nwere ike ibu echiche nke ikpe, mkpebi ikpe, na ntaramahụhụ sitere n’ikpe; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ otu ọnọdụ ntaramahụhụ ọnwụ ka ha nọ na ya, ma a naghị emechi okwu Grik ahụ n’otu nkọwa naanị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma doo ndị nkịtị anya. Ahịrịokwu ahụ na-echekwa ajụjụ nkwutọ, nkwusi ike dị na “ọbụna gị,” na ntakịrị obosara ihe κρίμα nwere ike ịpụta.
