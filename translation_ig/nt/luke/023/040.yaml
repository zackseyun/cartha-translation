revisions:
- from: Ma onye nke ọzọ zara ya, baara ya mba, sị, “Ọ bụ na ọbụna gị adịghị atụ egwu Chineke, ebe ọ bụ na otu ikpe ahụ dịkwa gị n’ahụ́[a]?”
  to: Ma onye nke ọzọ zara ya, baara ya mba, sị, “Ọ bụ na ọbụna gị adịghị atụ egwu Chineke, ebe ọ bụ na ị nọkwa n’okpuru otu ikpe ahụ[a]?”
  rationale: The revision replaces an opaque construction with a clear Standard Igbo expression for being under the same legal sentence. It retains the source’s rhetorical rebuke, emphasis (‘ọbụna gị’), and the lexical breadth of κρίμα through a restrained footnote.
