base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: ig
  text: onye a tụbara n’ụlọ mkpọrọ n’ihi otu nnupụisi mere n’obodo ahụ[a], nakwa n’ihi igbu ọchụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọgba aghara” ma ọ bụ “mbilite.” Okwu Grik στάσις nwere ike ịpụta nnupụisi, ọgba aghara, ma ọ bụ mbilite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: onye a
  rationale: N'okwu gbara ya gburugburu, nnọchiaha a na-ezo aka kpọmkwem na Barabas; “onye a” na-eme ka njikọ ahụ doo anya n'Igbo.
- source_word: διὰ
  choice: n'ihi
  rationale: Ya na okwu dị n'ọnọdụ accusative ebe a, ọ na-egosi ihe kpatara e ji tụba ya n'ụlọ mkpọrọ.
- source_word: στάσιν
  choice: nnupụisi
  rationale: Ọ na-egosi ọgba aghara ma ọ bụ nnupụisi megide ọchịchị; “nnupụisi” bụ okwu Igbo doro anya ma na-eburu echiche ndọrọ ndọrọ ọchịchị ahụ.
- source_word: τινὰ
  choice: otu
  rationale: “Otu” na-egosi na ọ bụ nnupụisi a na-akọghị kpọmkwem, ma ọ dịghị arọ dịka nsụgharị nkịtị “otu ... ụfọdụ.”
- source_word: γενομένην ἐν τῇ πόλει
  choice: nke mere n'obodo ahụ
  rationale: Nkebi a na-egosi na nnupụisi ahụ mere n'obodo ahụ; a kpọghị obodo ahụ Jerusalem n'ihi na Grik ekwughị ya kpọmkwem.
- source_word: φόνον
  choice: igbu ọchụ
  rationale: Ọ pụtara igbu mmadụ n'ụzọ mpụ, ọ bụghị naanị ọnwụ ma ọ bụ igbu mmadụ n'ozuzu.
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: a tụbara n'ụlọ mkpọrọ
  rationale: Nke a na-echekwa ike dị na βάλλω ma bụrụkwa ụzọ Igbo dị mma isi kwuo na e tinyere mmadụ n'ụlọ mkpọrọ.
