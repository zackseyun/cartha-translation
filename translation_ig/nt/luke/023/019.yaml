translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E debere nhazi ahịrịokwu ahụ ka o kwe omume n''Igbo, ma echekwabara ihe abụọ kpatara mkpọrọ ahụ: nnupụisi na igbu ọchụ.'
