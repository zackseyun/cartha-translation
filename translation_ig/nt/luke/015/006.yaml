  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: ig
  text: Mgbe ọ batara n’ụlọ[a], ọ kpọkọtara ndị enyi ya na ndị agbata obi ya, sị ha, “Soronụ m ṅụrịa ọṅụ[b], n’ihi na achọtala m atụrụ m ahụ furu efu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ Igbo ka mma, “Mgbe ọ lọtara.” Grik kwuru kpọmkwem, “mgbe ọ batara n’ụlọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Kekọrịtanụ m ọṅụ.” Okwu Grik bụ iwu ka mmadụ soro onye ọzọ ṅụrịa ọṅụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “atụrụ m furu efu.” Grik kwuru kpọmkwem, “atụrụ m, nke furu efu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: Mgbe ọ batara n’ụlọ
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge n’Igbo. “Batara n’ụlọ” na-echekwa echiche ịbanye n’ụlọ ma na-ada nke ọma n’Igbo.
- source_word: συγκαλεῖ
  choice: ọ kpọkọtara
  rationale: “Kpọkọtara” na-egosi ịkpọ ọtụtụ mmadụ ka ha zukọta, kwekọọ na συγκαλεῖ, ma bụrụ okwu Igbo dị mfe nghọta.
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: ndị enyi ya na ndị agbata obi ya
  rationale: Ndị a bụ ntụgharị ziri ezi na nke a na-ejikarị eme ihe maka φίλους na γείτονας n’ọnọdụ mmekọrịta mmadụ.
- source_word: λέγων αὐτοῖς
  choice: sị ha
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma dị ndụ isi jikọta ịkpọkọta ha na okwu onye ahụ kwuru.
- source_word: Συγχάρητέ μοι
  choice: Soronụ m ṅụrịa ọṅụ
  rationale: Nke a na-echekwa iwu ka ndị ọzọ sonyere onye ahụ n’ọṅụ ya, kama igosi naanị na ha ga-enwe ọṅụ n’onwe ha.
- source_word: ὅτι εὗρον
  choice: n’ihi na achọtala m
  rationale: “N’ihi na” na-egosi ihe kpatara iwu ahụ; “achọtala m” na-egosikwa omume e mechara nke nsonaazụ ya ka dị ugbu a.
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: atụrụ m ahụ furu efu
  rationale: 'Nke a na-echekwa usoro echiche Grik: “atụrụ m, nke ahụ furu efu,” ma na-ada nke ọma n’Igbo.'
theological_decisions:
- issue: Ihe atụ banyere ịchọta ihe furu efu
  choice: atụrụ m ahụ furu efu
  alternative: atụrụ m furu efu
  rationale: E debere ihe oyiyi atụrụ ahụ n’onwe ya, tinyeghị nkọwa banyere ndị mmehie ma ọ bụ nzọpụta n’amaokwu a. “Ahụ furu efu” na-echekwakwa ike nke article + participle dị na Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. “Soronụ m ṅụrịa ọṅụ” na-eme ka echiche nke ọṅụ a na-ekekọrịta pụta ìhè; e zere okwu ụka pụrụ iche ma ọ bụ nkọwa nkà mmụta okpukpe etinyere n’ihe atụ ahụ.
