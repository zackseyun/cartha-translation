    issue: Footnote b is not idiomatic Standard Igbo.
    rationale: “Kwekọọnụ m mee emume ọṅụ” does not naturally express sharing someone’s joy. “Kekọrịtanụ m ọṅụ” is a clear idiomatic alternative that retains the communal sense of συγχαίρω.
  - severity: low
    issue: Footnote c inaccurately labels an awkward Igbo phrase as literal.
    rationale: “Nke ahụ furu efu” is not the appropriate relative construction here. “Nke furu efu” adequately reflects “the one that was lost”; the main text remains natural.
  - severity: low
    issue: Footnote a adds a possessive not expressed in the Greek alternative.
    rationale: The idiomatic alternative “Mgbe ọ lọtara” means “when he comes home” without supplying “ụlọ ya.”
