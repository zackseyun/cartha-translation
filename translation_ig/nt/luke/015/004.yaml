  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: ig
  text: Kedu nwoke n’ime unu nke nwere otu narị atụrụ, ma otu n’ime ha efuo, ọ̀ gaghị ahapụ iri itoolu na itoolu ahụ n’ala ghe oghe[a], gaa chọọ nke furu efu ruo mgbe ọ chọtara ya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ọzara.” Okwu Grik a nwere ike ịpụta ala ghe oghe, ebe ịta nri, ma ọ bụ ebe tọgbọrọ n’efu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: Kedu nwoke n’ime unu
  rationale: Nke a na-edobe nwoke dị ka ihe atụ n’otu mkpụrụ okwu, dịka Grik si dị, ma na-eme ka ajụjụ nkwupụta ahụ daa nke ọma n’Igbo.
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: nwere otu narị atụrụ
  rationale: Nsụgharị doro anya ma bụrụkwa usoro okwu Igbo a na-asụ ugbu a.
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: ma otu n’ime ha efuo
  rationale: Ọ na-egosi na otu atụrụ n’ime otu narị ahụ abụrụla nke furu efu, n’etinyeghị echiche na onye nwe ya kpachaara anya tufuo ya.
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: nke na-agaghị ahapụ iri itoolu na itoolu ndị ọzọ
  rationale: Ụdị ajụjụ na-adịghị mma na-atụ anya azịza ee, dịka usoro Grik si dị; ‘ndị ọzọ’ na-eme ka ihe a na-ekwu maka ya doo anya n’Igbo.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ala ghe oghe
  rationale: Ọ na-anọchi anya ala na-enweghị ọtụtụ ụlọ ma ọ bụ ihe ubi, nke nwere ike ịbụ ebe ịta nri; nkọwa ala ịkpa ma ọ bụ ọzara ka dị na ndetu ala peeji.
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: gaa chọọ nke ahụ furu efu
  rationale: ‘Gaa chọọ’ na-egosi ma ịga n’azụ atụrụ ahụ ma ebumnuche ịchọta ya; ‘nke ahụ furu efu’ na-edobe participle ahụ dị ka aha.
- source_word: ἕως εὕρῃ αὐτό
  choice: ruo mgbe ọ chọtara ya
  rationale: Ọ bụ ntụgharị Igbo ebumpụta ụwa nke nkebi oge ahụ, ebe ‘ya’ na-ezo aka n’atụrụ ahụ furu efu.
theological_decisions:
- issue: Asụsụ nwoke e ji mee ihe atụ n’ajụjụ ilu
  choice: Jide ‘nwoke’ n’ederede bụ isi
  alternative: mmadụ
  rationale: ἄνθρωπος bụ otu mkpụrụ okwu nwere ụdị nwoke n’ajụjụ ihe atụ a. ‘Nwoke’ na-edobe ụdị ahụ n’enweghị ikwu na ihe atụ ahụ metụtara naanị ụmụ nwoke.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ ma dị ugwu. E debere ajụjụ nkwupụta nke na-atụ anya azịza ee, tinyekwa akara ndetu [a] ozugbo n’ebe okwu nwere nghọta karịrị otu dị.
