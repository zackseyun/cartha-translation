id: LUK.15.22
reference: Luke 15:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: ig
  text: Ma nna ahụ gwara ndị ohu ya[a] sị, “Ngwa ngwa, wepụtanụ uwe mwụda kachasị mma[b], yikwasịnụ ya. Tinye ya mgbanaka[c] n’aka, tinyekwa akpụkpọ ụkwụ n’ụkwụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-eje ozi.” Okwu Grik bụ doulous, nke na-ezo aka ná ndị ohu, ya bụ, ndị nọ n’ọnọdụ ohu n’ezinụlọ.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “uwe mwụda mbụ”; n’ebe a, o yikarịrị ka ọ pụtara uwe mwụda kachasị mma ma ọ bụ kachasị elu.
    reason: lexical_alternative
  - marker: c
    text: Grik kwuru naanị “mgbanaka.” Ụfọdụ na-aghọta ya dị ka mgbanaka akara nke na-egosi na e weghachiri ya n’ọnọdụ ya, ma ihe odide ahụ ekwughị nke ahụ kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλους
  choice: ndị ohu
  rationale: Okwu a na-egosi ndị nọ n’ohu ma na-eje ozi n’ezinụlọ; ‘ndị ohu’ na-echekwa ọnọdụ mmekọrịta mmadụ nke Grik ahụ kwuru karịa naanị ‘ndị na-eje ozi.’
- source_word: Ταχὺ
  choice: Ngwa ngwa
  rationale: Ọ na-egosi iwu ka e mee ihe ozugbo ma na-ebute ngwa ngwa nna ahụ chọrọ.
- source_word: ἐξενέγκατε
  choice: wepụtanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha wepụta ihe n’ime ụlọ ma ọ bụ n’ebe e debere ya.
- source_word: στολὴν τὴν πρώτην
  choice: uwe mwụda kachasị mma
  rationale: N’ebe a, πρώτην nwere ike ịpụta uwe kachasị elu ma ọ bụ kachasị mma, ọ bụghị nanị nke mbụ n’usoro.
- source_word: ἐνδύσατε αὐτόν
  choice: yikwasị ya
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ doro anya na ha ga-eyikwasị ya uwe ahụ.
- source_word: δακτύλιον
  choice: mgbanaka
  rationale: Grik kwuru naanị mgbanaka, ọ kọwaghị ya kpọmkwem dị ka mgbanaka akara.
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: n’aka
  rationale: Nke a bụ usoro okwu Igbo kwesịrị ekwesị maka iyikwasị mmadụ ihe ịchọ mma n’aka.
- source_word: ὑποδήματα
  choice: akpụkpọ ụkwụ
  rationale: Ọ bụ okwu Igbo nkịtị ma doo anya maka ihe a na-eyi n’ụkwụ; n’ọdịnala oge ahụ, o nwere ike ịbụ ụdị akpụkpọ ụkwụ mepere emepe.
- source_word: εἰς τοὺς πόδας
  choice: n’ụkwụ
  rationale: Nke a na-enye ihe Grik ahụ pụtara n’usoro okwu Igbo dị mma.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntughari dị nro site n’okwu nwa ahụ gaa n’ihe nna ahụ nyere iwu ka e mee.
theological_decisions:
- issue: Ma a ga-asụgharị δούλους dị ka ndị ohu ka ọ bụ ndị na-eje ozi
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: ‘Ndị ohu’ na-echekwa ọnọdụ ndị ahụ n’usoro mmekọrịta mmadụ n’oge ahụ, n’etinyeghị nkọwa ozizi ọzọ n’akụkọ ahụ.
- issue: Ma πρώτην n’ahịrịokwu στολὴν τὴν πρώτην pụtara nke mbụ n’usoro ka ọ bụ nke kachasị mma
  choice: uwe mwụda kachasị mma
  alternative: uwe mwụda mbụ
  rationale: N’ọnọdụ a, okwu ahụ yiri ka ọ na-egosi uwe kachasị elu ma ọ bụ kachasị mma; ntụgharị a na-enye nghọta ahụ ma hapụkwa ntụgharị nkịtị na ndetu ala peeji.
- issue: Ma a ga-eme δακτύλιον ka ọ bụrụ mgbanaka akara
  choice: mgbanaka
  alternative: mgbanaka akara
  rationale: Ihe odide Grik akọwaghị ụdị mgbanaka ahụ. Ya mere, a hapụrụ echiche banyere akara ọkwá ma ọ bụ ikike ka ọ ghara ịbanye n’isiokwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. ‘Uwe mwụda’ na-egosi uwe ogologo ahụ n’enweghị ịmanye okwu ihe ochie; ‘akpụkpọ ụkwụ’ bụ okwu ndị mmadụ na-aghọta nke ọma. E debere iwu niile n’ụdị ọtụtụ mmadụ n’ihi na nna ahụ na-agwa ọtụtụ ndị ohu okwu.
