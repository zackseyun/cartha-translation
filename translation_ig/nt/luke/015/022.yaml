revisions:
- from: Ma nna ahụ gwara ndị ohu ya[a] sị, “Ngwa ngwa, wepụtanụ uwe mwụda kachasị mma[b], yikwasị ya; yikwasịkwa ya mgbanaka[c] n’aka na akpụkpọ ụkwụ n’ụkwụ.”
  to: Ma nna ahụ gwara ndị ohu ya[a] sị, “Ngwa ngwa, wepụtanụ uwe mwụda kachasị mma[b], yikwasịnụ ya. Tinye ya mgbanaka[c] n’aka, tinyekwa akpụkpọ ụkwụ n’ụkwụ ya.”
  rationale: The revision distinguishes the Greek clothing command (ἐνδύσατε) from the subsequent command to give/place the ring and footwear (δότε), while retaining the source’s sequence, plurality of the imperatives, and interpretive restraint. Footnote a is adjusted to avoid implying literal chains.
