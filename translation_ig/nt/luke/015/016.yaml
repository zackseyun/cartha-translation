- from: Ọ chọsiri ike iji mkpụrụ karọb ndị ezi na-eri[a] mejupụta afọ ya, ma ọ dịghị onye na-enye ya ihe ọ bụla.
  to: Ọ na-achọsi ike iji akpa mkpụrụ karọb ndị ezi na-eri[a] mejupụta afọ ya, ọ dịghịkwa onye na-enye ya ihe ọ bụla.
  rationale: The revision retains the draft’s sense while making the continuing force of the two Greek imperfect verbs clearer, specifying that the food was carob pods, and avoiding an unnecessary adversative conjunction. The footnote is retained with a more direct and natural alternative.
