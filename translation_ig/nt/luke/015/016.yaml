  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: ig
  text: Ọ na-achọsi ike iji akpa mkpụrụ karọb ndị ezi na-eri[a] mejupụta afọ ya, ọ dịghịkwa onye na-enye ya ihe ọ bụla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “akpa mkpụrụ”; okwu Grik a na-ezo kpọmkwem n’akpa mkpụrụ osisi karọb, nke a na-ejikarị enye anụmanụ nri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: Ọ chọsiri ike
  rationale: Oge ngwaa Grik na-egosi ọchịchọ siri ike nke na-aga n’ihu; okwu a na-egosipụta agụụ ahụ n’Igbo nkịtị n’etinyeghị ihe karịrị ihe dị na amaokwu ahụ.
- source_word: γεμίσαι
  choice: mejupụta
  rationale: Nke a na-echekwa ihe oyiyi doro anya nke imeju afọ kama ịkọwa ya naanị dị ka ime ka agụụ kwụsị.
- source_word: τὴν κοιλίαν αὐτοῦ
  choice: afọ ya
  rationale: N’ebe a κοιλία na-ezo aka n’afọ dịka akụkụ ahụ ebe agụụ na-emetụta; ‘afọ ya’ bụ okwu Igbo doro anya ma bụrụkwa nke e ji eme ihe kwa ụbọchị.
- source_word: ἀπὸ τῶν κερατίων
  choice: iji mkpụrụ karọb
  rationale: ἀπό na nkebi a na-egosi ihe ọ chọrọ iji mejupụta afọ ya. ‘Iji’ na-ada nke ọma n’Igbo ma na-echekwa njikọ ahụ; ‘mkpụrụ karọb’ na-akọwapụta ụdị nri anụmanụ ahụ.
- source_word: κερατίων
  choice: mkpụrụ karọb
  rationale: Okwu Grik ahụ na-ezo kpọmkwem n’akpa mkpụrụ osisi karọb, nke a na-enyekarị anụmanụ dịka nri. E tinyere nkọwa ọzọ n’ala peeji n’ihi na karọb nwere ike ghara ịbụ ihe ọtụtụ ndị na-agụ Igbo maara.
- source_word: οἱ χοῖροι
  choice: ezi
  rationale: ‘Ezi’ bụ okwu Igbo nkịtị, nke oge a, maka pigs.
- source_word: ἤσθιον
  choice: na-eri
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu n’oge ahụ; ‘na-eri’ na-egosipụta nke a nke ọma.
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: ọ dịghị onye na-enye ya ihe ọ bụla
  rationale: ‘Na-enye’ na-egosipụta imperfect nke na-akọwa enweghị enyemaka na-aga n’ihu, ebe ‘ihe ọ bụla’ na-eme ka ihe a hapụrụ n’ụzọ Grik doo anya n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu nke na-ada nke ọma n’Igbo ma chekwaa ọchịchọ siri ike, ihe oyiyi nke imeju afọ, na omume na-aga n’ihu dị n’ụdị imperfect Grik. Akara ala peeji [a] pụtara n’isi ederede dịka achọrọ.
