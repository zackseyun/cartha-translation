  text: ὁ δὲ εἶπεν αὐτῷ ὅτι Ὁ ἀδελφός σου ἥκει, καὶ ἔθυσεν ὁ πατήρ σου τὸν μόσχον τὸν σιτευτόν, ὅτι ὑγιαίνοντα αὐτὸν ἀπέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: ig
  text: Ọ sịrị ya, “Nwanne gị abịala, nna gị egbuola nwa ehi ahụ a zụrụ ka ọ maa abụba, n’ihi na ọ nataghachiri ya ka ahụ́ dị ya mma.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’udo, ahụ́ dịkwa ya mma.” Okwu Grik bụ ὑγιαίνοντα pụtara na ahụ́ dị mmadụ mma; n’ọnọdụ a, ọ nwekwara ike igosi na ọ lọtara n’udo, ahụ́ dịkwa ya mma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: abịala
  rationale: Okwu a na-egosi na ọ bịarutela ma nọkwa ugbu a; ‘abịala’ na-egosipụta nke a n’Igbo dị mfe.
- source_word: ἔθυσεν
  choice: egbukwaala
  rationale: N’ebe a, ọ bụ igbu anụ maka oriri emume, ọ bụghị ịchụ àjà n’usoro ofufe; ya mere ‘egbukwaala’ zere itinye echiche àjà na-adịghị mkpa.
- source_word: μόσχον τὸν σιτευτόν
  choice: nwa ehi ahụ e mere ka ọ maa abụba
  rationale: Nke a na-egosi nwa ehi a zụlitere ma mee ka ọ maa abụba, nke e debere maka nnukwu oriri.
- source_word: ὑγιαίνοντα
  choice: n’udo, ahụ́ dịkwa ya mma
  rationale: Okwu Grik ahụ nwere ike ịpụta na ahụ́ dị mmadụ mma ma ọ bụ na ọ lọtara n’enweghị mmerụ; ntụgharị a na-eburu obosara ihe ọ pụtara n’ọnọdụ a.
- source_word: ἀπέλαβεν
  choice: nataghachiri ya
  rationale: ‘Nataghachiri’ na-echekwa echiche nke ịnata onye ahụ ọzọ mgbe ọ nọpụrụla.
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: Ọ sịrị ya,
  rationale: δέ bụ njikọ dị nro, ebe ὅτι na-ebute okwu e kwuru kpọmkwem; usoro a bụ Igbo ebumpụta ụwa.
