- from: Ọ sịrị ya, “Nwanne gị abịala, nna gị egbukwaala nwa ehi ahụ e mere ka ọ maa abụba, n’ihi na ọ nataghachiri ya n’udo, ahụ́ dịkwa ya mma.[a]”
  to: Ọ sịrị ya, “Nwanne gị abịala, nna gị egbuola nwa ehi ahụ a zụrụ ka ọ maa abụba, n’ihi na ọ nataghachiri ya ka ahụ́ dị ya mma.[a]”
