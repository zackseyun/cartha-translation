translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere okwu nna ahụ dị ka omume nnabata na oriri emume, na-etinyeghị echiche ịchụ àjà n’usoro okpukpe.
