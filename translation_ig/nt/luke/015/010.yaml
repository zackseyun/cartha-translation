revisions:
- from: 'N’otu aka ahụ[a], ana m agwa unu: ọṅụ na-adị n’ihu ndị mmụọ ozi nke Chineke n’ihi otu onye mmehie nke chegharịrị.'
  to: Otu a kwa[a], ana m asị unu, ọṅụ na-adị n’ihu ndị mmụọ ozi nke Chineke n’ihi otu onye mmehie na-echegharị.
  rationale: The revision corrects the aspect of μετανοοῦντι by using the present-progressive relative expression 'na-echegharị.' It also adopts more idiomatic Standard Igbo wording for οὕτως and λέγω ὑμῖν. The impersonal expression for the joy and its location before God’s angels is retained, preserving the Greek ambiguity about who is rejoicing.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the impersonal location of the joy ('n’ihu ndị mmụọ ozi nke Chineke') and does not make the angels the explicit rejoicers. However, 'chegharịrị' is perfective ('repented/has repented'), whereas μετανοοῦντι is a present participle describing a sinner who is repenting. The revision preserves this aspect with 'na-echegharị.'
  naturalness: '''Otu a kwa'' is a more concise, natural Standard Igbo discourse transition for οὕτως in this parabolic application than the somewhat calqued ''N’otu aka ahụ.'' ''Ana m asị unu'' is also an idiomatic biblical-register equivalent of λέγω ὑμῖν.'
  terminology: '''ndị mmụọ ozi nke Chineke,'' ''onye mmehie,'' and ''na-echegharị'' are clear, established, and suitably dignified Standard Igbo biblical terms. The rendering avoids defining repentance beyond what the verse states.'
  issues:
  - severity: medium
    issue: Perfective aspect in 'nke chegharịrị'
    rationale: The Greek present participle μετανοοῦντι portrays the sinner as repenting. The perfective Igbo form 'chegharịrị' can instead suggest a completed prior repentance. 'na-echegharị' more closely preserves the source aspect without doctrinal expansion.
  - severity: low
    issue: Discourse formula is somewhat literal
    rationale: '''N’otu aka ahụ'' is understandable, but ''Otu a kwa'' is more idiomatic in Standard Igbo for the συνέquential/analogical οὕτως here.'
  revised_text: Otu a kwa[a], ana m asị unu, ọṅụ na-adị n’ihu ndị mmụọ ozi nke Chineke n’ihi otu onye mmehie na-echegharị.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Otu a” ma ọ bụ “Ya mere.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the aspect of μετανοοῦντι by using the present-progressive relative expression 'na-echegharị.' It also adopts more idiomatic Standard Igbo wording for οὕτως and λέγω ὑμῖν. The impersonal expression for the joy and its location before God’s angels is retained, preserving the Greek ambiguity about who is rejoicing.
