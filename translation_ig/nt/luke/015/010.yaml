id: LUK.15.10
reference: Luke 15:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: ig
  text: Otu a kwa[a], ana m asị unu, ọṅụ na-adị n’ihu ndị mmụọ ozi nke Chineke n’ihi otu onye mmehie na-echegharị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Otu a” ma ọ bụ “Ya mere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: N’otu aka ahụ
  rationale: Ọ na-ejikọta okwu a na ilu bu ya ụzọ dị ka ntụnyere na itinye ihe a kọrọ n’ọrụ; okwu Igbo a bụ nke eke ma doo anya.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ bụ usoro okwu e ji ekwusi ihe ike ma gwa ọtụtụ ndị okwu kpọmkwem; nke a bụ Igbo dị ugbu a ma dị mfe nghọta.
- source_word: γίνεται χαρά
  choice: ọṅụ na-adị
  rationale: γίνομαι ebe a na-egosi na ọṅụ na-apụta ma ọ bụ na-adị; nsụgharị a na-ezere okwu siri ike ma na-echekwa nghọta ahụ.
- source_word: ἐνώπιον
  choice: n’ihu
  rationale: Ọ na-egosi ihe na-eme n’ebe mmadụ nọ ma ọ bụ n’ihu ya, n’ebughị ụzọ kwuo onye kpọmkwem na-aṅụrị ọṅụ.
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: ndị mmụọ ozi nke Chineke
  rationale: Ọ na-echekwa usoro genitive nke Grik ma bụrụkwa okwu Baịbụl doro ndị na-agụ Igbo anya.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: n’ihi otu onye mmehie
  rationale: ἐπί na dative ebe a na-egosi ihe kpatara ma ọ bụ ihe butere ọṅụ ahụ; “n’ihi” bụ okwu Igbo eke maka njikọ a.
- source_word: μετανοοῦντι
  choice: nke chegharịrị
  rationale: Participụl ahụ na-akọwa onye mmehie ahụ dịka onye na-echegharị. “Chegharịrị” bụ okwu Igbo Baịbụl a na-aghọta nke ọma, na-enweghị ịgbasa nkọwa nkà mmụta okpukpe ya.
theological_decisions:
- issue: Ihe okwu nchegharị pụtara
  choice: nke chegharịrị
  alternative: nke gbanwere obi ya; nke na-alọghachi azụ
  rationale: Amaokwu a na-ekwu maka nchegharị ma ọ naghị akọwa nkọwa ya n’uju. “Chegharịrị” na-echekwa obosara echiche ahụ n’etinyeghị nkọwa otu ụka.
- issue: Ebe ọṅụ ahụ dị na onye na-aṅụrị ya
  choice: ọṅụ na-adị n’ihu ndị mmụọ ozi nke Chineke
  alternative: ndị mmụọ ozi nke Chineke na-aṅụrị ọṅụ; ọṅụ na-adị n’etiti ndị mmụọ ozi nke Chineke
  rationale: Grik kwuru na ọṅụ na-adị “n’ihu” ndị mmụọ ozi, ma ọ naghị ekwu hoo haa na ọ bụ ha onwe ha na-aṅụrị ọṅụ. Nsụgharị a na-echekwa nghọta ahụ na-edoghị anya.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “ndị mmụọ ozi” mee ka ἄγγελοι doo anya, ma debe “n’ihu” iji ghara ikpebi onye kpọmkwem na-aṅụrị ọṅụ.
