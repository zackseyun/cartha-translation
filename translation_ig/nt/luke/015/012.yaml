translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A zere itinye ‘nwa nwoke’ n’ahịrị mbụ n’ihi na Grik kwuru naanị ‘onye nke nta,’ ebe e debere ihe βίον pụtara n’ụzọ na-egosi ma ihe onwunwe ma ihe e ji ebi ndụ.
