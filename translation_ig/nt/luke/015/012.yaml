revisions:
- from: Nke nta n’ime ha wee sị nna ya, “Nna, nye m òkè ihe onwunwe nke ruru m[a].” Ya mere, o kewara ihe o ji ebi ndụ n’etiti ha[b].
  to: Onye nke nta n’ime ha sịrị nna ya, “Nna m, nye m òkè ihe onwunwe nke ruru m[a].” Nna ahụ wee kee ihe o ji ebi ndụ n’etiti ha[b].
  rationale: The revision corrects the unnatural personal reference at the opening, makes the narrative linkage correspond more closely to Greek δέ, and improves the clarity and idiomatic quality of both lexical footnotes. It preserves the Greek’s ambiguity by not inserting “son” into the verse text.
  reviewer_model: gpt-5.6-terra
