source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: ig
  text: Onye nke nta n’ime ha sịrị nna ya, “Nna m, nye m òkè ihe onwunwe nke ruru m[a].” Nna ahụ wee kee ihe o ji ebi ndụ n’etiti ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “akụkụ ihe onwunwe nke bụ nke m” ma ọ bụ “òkè ruuru m.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu ahụ bụ “ndụ” ma ọ bụ “ihe e ji ebi ndụ” (βίον); n’ebe a ọ na-ezo aka n’ihe onwunwe nna ahụ, ya bụ, ihe ndị o ji ebi ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: νεώτερος
  choice: Nke nta n’ime ha
  rationale: 'Adjective ntụnyere a na-arụ ọrụ dị ka aha: ‘onye nke nta.’ Ọ naghị ekwu ‘nwa nwoke’ kpọmkwem n’amaokwu a, ya mere nsụgharị a na-edobe ụdị Grik ma ka na-adaba n’ihe gbara ya gburugburu.'
- source_word: δός μοι
  choice: nye m
  rationale: Nke a bụ arịrịọ ma ọ bụ iwu a gwara nna ya ozugbo; ‘nye m’ bụ Igbo dị mfe ma kwekọọ na Grik.
- source_word: τὸ ἐπιβάλλον μέρος
  choice: òkè ... nke ruru m
  rationale: ἐπιβάλλον na-egosi òkè dabara mmadụ ma ọ bụ nke ruuru ya. ‘Nke ruru m’ na-egosipụta echiche ahụ n’Igbo ekeghị aka.
- source_word: οὐσία
  choice: ihe onwunwe
  rationale: N’ọnọdụ nketa a, οὐσία pụtara akụ ma ọ bụ ihe mmadụ nwere; ‘ihe onwunwe’ bụ okwu Igbo doro anya ma sara mbara.
- source_word: διεῖλεν
  choice: o kewara
  rationale: Ngwaa ahụ pụtara ikewa ma ọ bụ ikesara; ‘o kewara’ na-edobe omume ahụ kpọmkwem.
- source_word: αὐτοῖς
  choice: n’etiti ha
  rationale: Ọ bụ ezie na Grik pụtara n’ụzọ nkịtị ‘nye ha,’ ihe a na-ekwu bụ ikewa ihe ahụ n’etiti ụmụ abụọ ahụ; ‘n’etiti ha’ bụ Igbo dabara adaba.
- source_word: βίον
  choice: ihe o ji ebi ndụ
  rationale: βίος nwere ike ịpụta ihe mmadụ ji akwalite ndụ ya, ihe o nwere, ma ọ bụ akụ ya. N’ebe a ọ na-ezo aka n’ihe nna ahụ nwere nke o ji ebi ndụ; nsụgharị a na-edobe obosara na ịdị arọ nke okwu ahụ.
