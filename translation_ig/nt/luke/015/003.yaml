  text: εἶπεν δὲ πρὸς αὐτοὺς τὴν παραβολὴν ταύτην λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/003.yaml
  text: 'So he told them this parable[a], saying:'
translation:
  language: ig
  text: 'Ọ gwara ha ilu a, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: ọ gwara
  rationale: Ngwaa a bụ aorist nke λέγω. N’ihi na ihe ọ gwara ha bụ ilu, “ọ gwara ha” bụ ụzọ Igbo si ekwu ya nke ọma ma na-echekwa omume ikwu okwu ahụ.
- source_word: δὲ
  choice: Ya mere
  rationale: δέ bụ njikọ dị nro. N’ebe a, “Ya mere” na-ejikọta okwu Jizọs na ntamu ndị e kwuru banyere ya n’amaokwu ndị bu ụzọ, n’enweghị ime ka ọ bụrụ nnukwu mgbagha.
- source_word: πρὸς αὐτοὺς
  choice: ha
  rationale: πρός tinyere accusative na-egosi ndị a na-agwa okwu. N’Igbo, “ọ gwara ha” na-egosipụta nke a n’ụzọ eke.
- source_word: τὴν παραβολὴν ταύτην
  choice: ilu a
  rationale: παραβολή n’Oziọma ndị a na-ejikarị ya akọwa ilu e ji ihe atụ akụzi ihe; “ilu” bụ okwu Igbo doro anya ma bụrụ nke a maara nke ọma. ταύτην pụtara “a.”
- source_word: λέγων
  choice: 'sị:'
  rationale: Participul a na-ewebata ihe e kwuru. “sị:” bụ ụzọ Igbo dị nkenke ma bụrụkwa nke eke isi webata okwu ga-esochi.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. A haziri ahịrịokwu ahụ n’usoro Igbo eke, ebe a tụgharịrị λέγων dị ka “sị:” iji webata ilu na-esochi.
