id: LUK.15.30
reference: Luke 15:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: ig
  text: Ma mgbe nwa gị nwoke a—onye ya na ndị inyom na-agba akwụna ripịara akụ gị[a]—bịara, i gburu nwa ehi ahụ e mere ka ọ maa abụba maka ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe i ji ebi ndụ.” Ngwaa Grik ahụ siri ike; ihe ọ pụtara kpọmkwem bụ “ripịa.” Aha ahụ nwekwara ike ịpụta ihe e ji ebi ndụ, ihe onwunwe, ma ọ bụ akụ mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Ma mgbe
  rationale: “Ma” na-egosipụta ntakịrị ntụgharị ma ọ bụ mmegide dị na δέ, ebe “mgbe” na-egosipụta oge dị na ὅτε.
- source_word: ὁ υἱός σου οὗτος
  choice: nwa gị nwoke a
  rationale: Nke a na-edobe ike οὗτος (“a”) na ụzọ okwu ahụ si egosi na nwanne nke okenye na-anwa ịdọpụ onwe ya n’ebe nwanne ya nọ, kama ịkpọ ya “nwanne m.”
- source_word: ὁ καταφαγών
  choice: onye ... ripịara
  rationale: “Ripịara” na-edobe ihe atụ siri ike nke κατεσθίω, nke pụtara iri ihe gwụchaa ma ọ bụ iripịa ya, kama ime ka okwu ahụ dị nro site n’ịsị naanị “mefusịrị.”
- source_word: σου τὸν βίον
  choice: ihe i ji ebi ndụ
  rationale: N’ebe a βίος na-ezo aka n’ihe mmadụ nwere ma ọ bụ ihe o ji akwado ndụ ya, ọ bụghị ndụ anụ ahụ n’onwe ya.
- source_word: μετὰ πορνῶν
  choice: ya na ndị inyom na-agba akwụna
  rationale: Nke a na-akọwa πόρναι n’ụzọ doro anya, nke oge a, na-enweghị ime ka ebubo nwanne nke okenye dị nro.
- source_word: ἦλθεν
  choice: bịara
  rationale: Okwu Grik ahụ pụtara naanị “bịara.” Ọ bụ ezie na ihe ndị gbara amaokwu ahụ gburugburu na-egosi nlọghachi, a naghị etinye “lọghachiri” n’ime okwu ahụ.
- source_word: ἔθυσας
  choice: i gburu
  rationale: N’ebe a θύω bụ igbu anụ maka oriri ememme; “gburu” bụ okwu Igbo doro anya nke na-adịghị etinye echiche àjà okpukpe na-adịghị n’amaokwu ahụ.
- source_word: τὸν σιτευτὸν μόσχον
  choice: nwa ehi ahụ a zụlitere ka ọ maa abụba
  rationale: Nke a na-egosi nwa ehi e ji nri pụrụ iche zụọ maka oriri ememme, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: αὐτῷ
  choice: maka ya
  rationale: Dative a na-egosi onye e mere ihe ahụ maka uru ya ma ọ bụ iji sọpụrụ ya.
theological_decisions:
- issue: Ma a ga-egosi ebubo nwanne nke okenye dịka eziokwu onye na-akọ akụkọ kwadoro, ka ọ bụ dịka okwu ebubo ya
  choice: E debere ebubo ahụ kpọmkwem dịka o si kwuo ya, n’etinyeghị okwu ga-akwado ma ọ bụ gọnahụ ya.
  alternative: Ịsị “onye e kwuru na ọ ripịara...” ma ọ bụ ịkọwa ya dịka “onye mefusịrị ihe gị n’omume rụrụ arụ.”
  rationale: Grik ahụ na-enye nke a dịka ebubo nwanne nke okenye, ọ bụghị dịka nkọwa onye na-akọ akụkọ kwadoro. Nsụgharị kpọmkwem na-edobe esemokwu akụkọ ahụ n’enweghị idozi ya n’ụzọ onye ntụgharị uche.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. Akara ogologo okwu gbara nkọwa banyere nwa ahụ gburugburu na-enyere onye na-agụ ya aka iso usoro ahịrịokwu Grik ahụ n’enweghị mgbagwoju anya; okwu “nwa gị nwoke a” na-edobe ụda nlelị na ịdọpụ onwe onye dị n’okwu onye nke okenye.
