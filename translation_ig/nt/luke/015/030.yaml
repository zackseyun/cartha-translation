- from: Ma mgbe nwa gị nwoke a—onye ya na ndị inyom na-agba akwụna ripịara ihe i ji ebi ndụ[a]—bịara, i gburu nwa ehi ahụ a zụlitere ka ọ maa abụba maka ya.
  to: Ma mgbe nwa gị nwoke a—onye ya na ndị inyom na-agba akwụna ripịara akụ gị[a]—bịara, i gburu nwa ehi ahụ e mere ka ọ maa abụba maka ya.
  rationale: The revision uses “akụ gị” for the property/estate sense of βίος in this context, while the footnote retains “ihe i ji ebi ndụ” and the noun’s broader range. It also makes the description of the calf more natural in Standard Igbo. The older brother's accusation remains direct speech and is not presented as narrator-confirmed information.
