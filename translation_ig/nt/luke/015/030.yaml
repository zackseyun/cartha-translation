review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the temporal contrast, the older brother''s distancing expression (“this son of yours”), the forceful consumption metaphor, the unqualified accusation involving prostitutes, the simple “came,” and the beneficiary sense of “for him.” A small lexical refinement is advisable: βίος here most directly denotes the father''s possessions/estate, while the current “ihe i ji ebi ndụ” can sound primarily like ongoing livelihood or income.'
  naturalness: The sentence is generally clear Standard Igbo. “Akụ gị” is more idiomatic and concise in this context, and “e mere ka ọ maa abụba” naturally expresses a calf deliberately fattened for a feast.
  terminology: “Nwa gị nwoke a” appropriately conveys the Greek’s emphatic, alienating “this son of yours.” “Ndị inyom na-agba akwụna” is direct contemporary language for πόρναι. “Ripịara” preserves the vivid metaphor without converting the accusation into a neutral statement that he merely squandered money.
  issues:
  - severity: low
    issue: The main rendering of βίος is somewhat narrow and less idiomatic in context.
    rationale: “Ihe i ji ebi ndụ” can mean one's means of subsistence, but in this complaint βίος refers especially to the father's assets/property that the son consumed. “Akụ gị” communicates this naturally; the footnote can preserve the broader lexical range.
  - severity: low
    issue: The phrase for the fattened calf can be made more idiomatic.
    rationale: “Nwa ehi ahụ e mere ka ọ maa abụba” directly conveys that the calf was intentionally fattened, without suggesting only that it was raised with the eventual aim of becoming fat.
  revised_text: Ma mgbe nwa gị nwoke a—onye ya na ndị inyom na-agba akwụna ripịara akụ gị[a]—bịara, i gburu nwa ehi ahụ e mere ka ọ maa abụba maka ya.
