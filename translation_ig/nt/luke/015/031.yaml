  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: ig
  text: Ma ọ sịrị ya, “Nwa m,[a] gị na m nọ mgbe niile, ihe niile m nwere bụkwa nke gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Nwa.” Okwu Grik pụtara “nwa,” ọ bụkwa okwu ezinụlọ e ji ịhụnanya akpọ mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Nwa m
  rationale: N’Igbo, “Nwa m” bụ okwu nne ma ọ bụ nna ji ịhụnanya akpọ nwa ya. Ọ na-egosipụta ịdị nro nke τέκνον n'ụzọ sitere n’okike n’Igbo. Ọ bụ ezie na “m” na-egosi onwunwe n’ụdị okwu, ọ bụ akụkụ dị mkpa nke akpọmokwu Igbo a, ọ dịghịkwa eme ka okwu Grik bụrụ “nwa nwoke.”
- source_word: πάντοτε
  choice: mgbe niile
  rationale: “Mgbe niile” bụ ụzọ Igbo doro anya ma bụrụ nke a na-ejikarị asụ πάντοτε, ya bụ, “oge niile” ma ọ bụ “mgbe nile.”
- source_word: μετ’ ἐμοῦ
  choice: gị na m nọ
  rationale: Nhazi okwu “gị na m nọ” na-asụ association nke μετά na genitive n’Igbo dị mfe ma sitere n’okike.
- source_word: πάντα τὰ ἐμὰ
  choice: ihe niile m nwere
  rationale: Nke a na-ekpuchi ihe nna ahụ niile n’ozuzu ya ma na-ada nke ọma n’Igbo karịa ntụgharị siri ike dịka “ihe m niile.”
- source_word: σά ἐστιν
  choice: bụkwa nke gị
  rationale: “Bụ nke gị” na-edobe echiche sara mbara nke σά ἐστιν—na ihe ndị ahụ bụ nke ya—na-akọwaghị kpọmkwem ma ọ bụ ikike iwu, ihe nketa, ma ọ bụ mmekọrịta ka e bu n’obi.
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Ma ọ sịrị ya
  rationale: δέ nwere ike igosi ntakịrị ntụgharị ma ọ bụ ịga n’ihu n’akụkọ. “Ma” dabara ebe a n’ihi na azịza nna ahụ na-esochi mkpesa nwa nwoke nke okenye ma nwee obere ọdịiche na ya.
theological_decisions:
- issue: Okwu ịhụnanya nna ji kpọọ nwa ya
  choice: Nwa m
  alternative: Nwa nwoke m
  rationale: τέκνον pụtara “nwa” ma na-emesi mmekọrịta na ịdị nro ike; ọ bụghị okwu akọwapụtara nwoke dịka υἱός. “Nwa m” bụ akpọmokwu Igbo sitere n’okike ma na-ezere ime ka okike nwoke pụta ìhè karịa ka okwu Grik mere.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Nwa m” mee ka ịhụnanya dị n’okwu nna ahụ daa nke ọma n’Igbo, ebe nkọwa ala peeji na-egosi na okwu Grik enweghị nnọchiaha onwunwe kpọmkwem.
