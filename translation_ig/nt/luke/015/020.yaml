  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: ig
  text: O wee bilie gaa n’ebe nna ya nọ. Ma mgbe ọ ka nọ ebe dị anya, nna ya hụrụ ya, ọmịiko wee metụ ya n’obi; ọ gbaara ọsọ, wee makụọ ya n’olu, susuo ya ọnụ nke ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa Grik a nwere ike igosi ịhụnanya siri ike; ọ pụkwara ịpụta na ọ susuru ya ọnụ ugboro ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: o wee bilie
  rationale: Na-egosi ihe nwa ahụ kpebisiri ike ime tupu ọ gaa n’ebe nna ya nọ, ma na-edobekwa usoro akụkọ ahụ.
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: gaa n’ebe nna ya nọ
  rationale: N’Igbo, ‘gaa n’ebe nna ya nọ’ bụ ụzọ doro anya ma bụrụkwa nke e ji asụ okwu kwa ụbọchị iji gosi na ọ bịakwutere nna ya.
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: mgbe ọ ka nọ ebe dị anya
  rationale: Na-egosi ọnọdụ mere n’otu oge ahụ n’enweghị ịkọwa kpọmkwem otú ebe ahụ siri dị anya.
- source_word: ἐσπλαγχνίσθη
  choice: ọmịiko wee metụ ya n’obi
  rationale: Na-egosipụta ọmịiko miri emi nke sitere n’ime mmadụ, ọ bụghị nanị echiche dị jụụ.
- source_word: δραμὼν
  choice: ọ gbaara ọsọ
  rationale: Nsụgharị kwụ ọtọ ma dị ndụ nke omume nna ahụ.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: makụọ ya n’olu
  rationale: Ọ bụ akpaala okwu Igbo doro anya nke na-echekwa ihe oyiyi nke ịdabere n’olu ya n’ịmakụ, n’enweghị mgbakwunye nkọwa na-adịghị na Grik.
- source_word: κατεφίλησεν
  choice: susukwaa ya ọnụ nke ukwuu
  rationale: Na-echekwa ịhụnanya na ike dị n’omume ahụ, ma hapụ ajụjụ ma ọ bụ otu susuo ọnụ siri ike ka ọ bụ ugboro ugboro n’ihe odide ala peeji.
theological_decisions:
- issue: Otú e si egosi ọmịiko nna ahụ n’ilu ahụ
  choice: Iji okwu mmetụta uche doro anya kọwaa nzaghachi nna ahụ, n’emeghị ka nkọwa ihe nnọchianya bụrụ akụkụ nke amaokwu ahụ.
  alternative: Ibelata mmetụta uche ahụ, ma ọ bụ ịgbakwunye n’amaokwu ahụ na nna ahụ na-anọchi anya Chineke.
  rationale: Ngwaa ndị Grik na-egosi ọmịiko na omume nna ahụ n’ụzọ siri ike. Nsụgharị ahụ kwesịrị ichekwa ike a ma ghara itinye ozizi karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘wee’ jikọta omume ndị na-aga n’usoro, ebe ‘ọmịiko wee metụ ya n’obi’ na-eburu ike mmetụta nke isi mmalite ahụ. Ihe odide ala peeji na-echekwa nghọta abụọ nwere ike ịdị na καταφιλέω.
