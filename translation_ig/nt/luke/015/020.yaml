    issue: Verb form in the final clause
    rationale: “Susukwaa ya ọnụ” is morphologically/idiomatically unsuitable in this narrative context. It should be revised to “susuo ya ọnụ nke ukwuu.”
  - severity: low
    issue: Footnote wording
    rationale: The footnote is substantively accurate, but “nwere ike igosi” is slightly more direct and natural than “a pụrụ igosi” for a lexical possibility.
