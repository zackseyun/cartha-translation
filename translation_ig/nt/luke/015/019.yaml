source:
  edition: SBLGNT
  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: ig
  text: Erughịzi m eru ka a kpọọ m nwa nwoke gị; mee m ka m bụrụ otu n’ime ndị ọrụ gị i goro ọrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “otu n’ime ndị odibo gị i goro ọrụ” ma ọ bụ “otu n’ime ndị ọrụ gị a na-akwụ ụgwọ.” Okwu Grik ahụ na-ekwu maka ndị ọrụ a na-akwụ ụgwọ, ọ bụghị ndị ohu bi n’ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: Erughịzikwa m eru
  rationale: Ngwakọta ‘-zị-’ na-egosi na ọnọdụ ahụ adịkwaghị otú ọ dị na mbụ; okwu a na-aga nke ọma na ‘eru’ iji kwupụta οὐκέτι na ἄξιος n’Igbo nkịtị.
- source_word: ἄξιος
  choice: eru
  rationale: ‘Iru eru’ na-egosi ịbụ onye kwesịrị ọnọdụ ma ọ bụ nsọpụrụ a na-ekwu maka ya, ma na-edobe akụkụ mmekọrịta mmadụ na nsọpụrụ dị n’amaokwu ahụ.
- source_word: κληθῆναι
  choice: ka a kpọọ m
  rationale: Nke a na-edobe ụdị nnara-eme nke okwu Grik ma nwee ike ịpụta ma ịkpọ aha ma ile mmadụ anya dị ka onye nwere ọnọdụ ahụ.
- source_word: υἱός
  choice: nwa
  rationale: N’Igbo, ‘nwa gị’ bụ ụzọ okike e si ekwu nwa nwoke n’ọnọdụ a; onye a na-ekwu maka ya bụ nwa nwoke nke nna ahụ, dịka akụkọ ilu ahụ gosiri.
- source_word: ποίησόν
  choice: Mee m ka m bụrụ
  rationale: Nke a na-edobe arịrịọ iwu ahụ ka nna mee ka ọ banye n’ọnọdụ ọhụrụ, kama ịsụgharị ya nanị dị ka otu a ga-esi mesoo ya.
- source_word: ὡς
  choice: ka m bụrụ otu n’ime
  rationale: N’Igbo, usoro a na-ekwupụta arịrịọ ka e tinye ya n’ọkwa yiri nke otu n’ime ndị ahụ; ọ na-ada nke ọma karịa ntụgharị okwu n’otu n’otu.
- source_word: ἕνα τῶν μισθίων σου
  choice: otu n’ime ndị ọrụ gị i goro ọrụ
  rationale: ‘Ndị ọrụ i goro ọrụ’ na-eme ka o doo anya na ndị a bụ ndị a goro ma na-akwụ ụgwọ, ọ bụghị ndị ohu bi n’ụlọ.
theological_decisions:
- issue: Okwu gbasara ọnọdụ nwa ahụ n’arịrịọ ya
  choice: Edobere ‘eru’ na ‘nwa gị’ n’emeghị ka ike okwu banyere ịbụ nwa na nsọpụrụ ya belata.
  alternative: E kwesịghịzikwa ịkpọ m nwa gị.
  rationale: Okwu Grik na-ekwu maka echiche nwa ahụ na ya erughịzi eru ịnọ n’ọnọdụ nwa. Nsụgharị a na-edobe mmekọrịta nna na nwa na akụkụ nsọpụrụ ya, n’etinyeghị nkọwa ozizi ọzọ n’ime ya.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E ji ‘ndị ọrụ gị i goro ọrụ’ kewapụ ndị ọrụ ụgwọ n’ebe ndị ohu ụlọ nọ; e tinyere akara nkọwa ala ala [a] n’ebe okwu ahụ dị.
