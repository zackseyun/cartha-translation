id: LUK.15.8
reference: Luke 15:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: ig
  text: Ma ọ bụ, olee nwanyị nwere drakma iri[a], ọ bụrụ na otu efuo ya, ọ̀ gaghị amụnye oriọna, za ụlọ ahụ, ma jiri nlezianya[b] chọọ ya ruo mgbe ọ chọtara ya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Drakma bụ mkpụrụ ego ọlaọcha ndị Gris.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “jiri uchu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Ma ọ bụ
  rationale: Ọ na-ejikọta ihe atụ a na nke bu ya ụzọ ma na-edobe ike njikọ nke okwu Grik ahụ.
- source_word: τίς γυνὴ
  choice: olee nwanyị
  rationale: Nke a bụ ụzọ Igbo dị ndụ si webata ajụjụ a na-ajụ n’atụghị anya azịza megidere ihe a na-ekwu; etinyeghị ‘n’etiti unu’ n’ihi na ọ dịghị n’ederede Grik.
- source_word: δραχμὰς ... δραχμὴν
  choice: mkpụrụ ego drakma ... mkpụrụ ego drakma
  rationale: E debere aha mkpụrụ ego ahụ kpọmkwem iji chekwaa ọnọdụ akụkọ ihe mere eme, ma jiri ‘mkpụrụ ego’ mee ka onye na-agụ ya ghọta ụdị ihe ọ bụ.
- source_word: ἐὰν ἀπολέσῃ
  choice: ọ bụrụ na ... efuo ya
  rationale: Usoro a na-egosi ọnọdụ nwere ike ime n’ozuzu ya. ‘Efuo ya’ bụ ụzọ Igbo sitere n’okike isi kwuo na nwanyị ahụ tufuru mkpụrụ ego ahụ.
- source_word: οὐχὶ
  choice: na-agaghị ...?
  rationale: Ọ na-edobe ajụjụ nkwupụta nke na-atụ anya azịza ee.
- source_word: ἅπτει λύχνον
  choice: amụnye oriọna
  rationale: Nke a na-egosi ịgbanye ọkụ oriọna n’asụsụ Igbo doro anya nke oge a.
- source_word: σαροῖ τὴν οἰκίαν
  choice: zachaa ụlọ ahụ
  rationale: ‘Zachaa’ na-egosi ihicha ụlọ ahụ nke ọma site n’ịza ya, kwekọọkwa n’ihe nwanyị ahụ na-eme n’ịchọ mkpụrụ ego ahụ.
- source_word: ζητεῖ ἐπιμελῶς
  choice: jiri nlezianya chọọ ya
  rationale: Nke a na-egosipụta ọchịchọ e ji nlezianya na ịdị uchu mee, na-enweghị ime ka otu nkọwa karịa ibe ya bụrụ naanị ihe okwu ahụ pụtara.
- source_word: ἕως οὗ εὕρῃ
  choice: ruo mgbe ọ chọtara ya
  rationale: Ọ na-egosi njedebe nke ọchịchọ ahụ; ‘ya’ na-ezo aka n’otu mkpụrụ ego ahụ furu efu.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù dee ya. Ajụjụ ahụ ka bụ ajụjụ nkwupụta na-atụ anya azịza ee. E tinyere akara nkọwa [a] n’ebe ‘drakma’ dị na akara [b] n’ebe okwu ọzọ ‘jiri uchu’ metụtara, ka akara ndị ahụ kwekọọ n’ezie na nkọwa ha.
