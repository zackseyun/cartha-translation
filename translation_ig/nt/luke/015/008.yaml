review_pass:
  verdict: revise
  source_fidelity: The draft conveys the rhetorical question, ten drachmas, loss of one, lighting a lamp, sweeping, diligent searching, and finding it. However, “zachaa” can add a completed/thorough-cleaning sense beyond σαροῖ (“sweep”); the simple verb “za” is a closer rendering. “Ọ̀ gaghị …?” more directly marks the Greek rhetorical question than “na-agaghị …?”.
  naturalness: The revised wording is natural Standard Igbo and retains the public, dignified register. It avoids an unnecessarily intensified sense in the action of sweeping.
  terminology: “Drakma” appropriately preserves δραχμή, and the cultural note correctly identifies it as a Greek silver coin. “Oriọna,” “ụlọ,” and “jiri nlezianya” are suitable modern equivalents. The lexical-alternative footnote is anchored to the phrase it qualifies.
  issues:
  - severity: low
    issue: “zachaa ụlọ ahụ” is more intensive than the source verb.
    rationale: Σαροῖ simply means “sweeps.” “Za ụlọ ahụ” accurately expresses this action without adding the nuance of sweeping/cleaning completely.
  - severity: low
    issue: Rhetorical-question form can be clearer.
    rationale: The particle in “ọ̀ gaghị amụnye …?” explicitly and naturally signals the expected-positive rhetorical question expressed by οὐχί.
  revised_text: Ma ọ bụ, olee nwanyị nwere drakma iri[a], ọ bụrụ na otu efuo ya, ọ̀ gaghị amụnye oriọna, za ụlọ ahụ, ma jiri nlezianya[b] chọọ ya ruo mgbe ọ chọtara ya?
  revised_footnotes:
