  to: Ma ọ bụ, olee nwanyị nwere drakma iri[a], ọ bụrụ na otu efuo ya, ọ̀ gaghị amụnye oriọna, za ụlọ ahụ, ma jiri nlezianya[b] chọọ ya ruo mgbe ọ chọtara ya?
  rationale: The revision uses the unmarked verb “za” for “sweep,” preserving the source’s simple domestic action, and uses “ọ̀ gaghị …?” for an idiomatic Igbo rhetorical question. The drachma term and both footnotes are retained; footnote b remains attached to “jiri nlezianya,” the expression for ἐπιμελῶς.
