  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: ig
  text: Ma nwa ahụ sịrị ya, “Nna, emehiela m megide eluigwe[a] na n’ihu gị. Ekwesịkwaghị m ka a kpọọ m nwa gị.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ “megide eluigwe.” “Eluigwe” bụ ụzọ nkwanye ùgwù e si zoro aka na Chineke; ụfọdụ nsụgharị na-akọwa ya dịka “megide Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide aka ochie na-aga n’ihu n’okwu nwa ahụ site n’okwu pụtara, “Were m dịka otu n’ime ndị ọrụ e goro ego gị,” dịka ọ dị n’amaokwu 19. Ederede SBLGNT kwụsịrị ahịrịokwu ahụ na “nwa gị.”
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ ὁ υἱὸς αὐτῷ
  choice: Ma nwa ahụ sịrị ya
  rationale: “Ma” na-egosipụta njikọ δέ dị nro na ntụgharị akụkọ ahụ; “nwa ahụ” na “ya” na-echekwa usoro okwu Grik n’Igbo doro anya.
- source_word: Πάτερ
  choice: Nna
  rationale: Nke a bụ ịkpọ nna okwu ozugbo, n’etinyeghị “nna m,” ebe Grik ekwughị okwu nnọchiaha ahụ.
- source_word: ἥμαρτον
  choice: emeela m mmehie
  rationale: Nke a bụ nkwupụta mmehie e mere nke ka nwere mkpa ugbu a, ma bụrụkwa ụzọ doro anya ndị Igbo nke oge a si ekwu ya.
- source_word: εἰς τὸν οὐρανὸν
  choice: megide eluigwe
  rationale: A hapụrụ okwu atụ a dị ka ọ dị na Grik kama ịkọwa ya ozugbo dịka “megide Chineke,” ka e wee chekwaa ụzọ nkwanye ùgwù e si kwuo ya.
- source_word: καὶ ἐνώπιόν σου
  choice: na n’ihu gị
  rationale: Nke a na-echekwa echiche nkịtị nke ἐνώπιον, ya bụ ịnọ n’ihu ma ọ bụ n’ọhụhụ mmadụ, n’agbanyeghị na n’ọnọdụ a ọ na-egosikwa mmejọ e mere onye ahụ.
- source_word: οὐκέτι εἰμὶ ἄξιος
  choice: Erughịzi m eru
  rationale: Nkebiokwu Igbo a na-egosipụta na onye ahụ ahụghịzi onwe ya dịka onye kwesịrị ọnọdụ ma ọ bụ nsọpụrụ ahụ.
- source_word: κληθῆναι υἱός σου
  choice: ka a kpọọ m nwa gị
  rationale: A na-echekwa olu nnara nke κληθῆναι na mmekọrịta ezinụlọ dị n’okwu “nwa gị.”
theological_decisions:
- issue: Ihe “eluigwe” pụtara na nkwupụta mmehie a
  choice: Ịsụgharị ya kpọmkwem dịka “megide eluigwe,” ma kọwaa n’ala peeji na ọ bụ ụzọ nkwanye ùgwù e si zoro aka na Chineke.
  alternative: Ịsụgharị ya n’ụzọ nkọwa dịka “megide Chineke.”
  rationale: Ihe odide Grik kwuru “eluigwe.” Idebe ya n’ahịrị bụ isi na-echekwa okwu atụ ahụ na nghọtahie ya n’ebughị ụzọ kpebie ya n’ime nsụgharị.
- issue: Ebe okwu nwa ahụ kwụsịrị n’amaokwu a
  choice: Ịkwụsị okwu ya na “nwa gị,” dịka SBLGNT si dị.
  alternative: Ịgbakwunye “Were m dịka otu n’ime ndị ọrụ ụgwọ gị,” dịka ụfọdụ ihe odide aka ochie si nwee ya.
  rationale: Isi mmalite e nyere kwụsịrị ahịrịokwu ahụ na “nwa gị.” A kọwara ọdịiche ederede ahụ n’ala peeji kama itinye ya n’ahịrị bụ isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Emeela m mmehie” doro anya karịa naanị “emehiela m,” ebe “Erughịzi m eru” na-egosipụta ihere na enweghị ntozu nwa ahụ n’enweghị mgbakwunye ozizi pụrụ iche.
