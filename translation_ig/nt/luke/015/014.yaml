id: LUK.15.14
reference: Luke 15:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: ig
  text: Ma mgbe o mefusịrị ihe niile o nwere, oké ụnwụ dara n’ala ahụ dum[a], ya onwe ya wee malite ịnọ ná mkpa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na mpaghara ahụ dum.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “wee malite inwe ụkọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: mgbe o mefusịrị ihe niile o nwere
  rationale: A sụgharịrị genitive absolute ahụ dị ka ahịrịokwu oge. “Mefusịrị” na-egosi na o tinyela ihe niile o nwere n’imefu, n’etinyeghị n’amaokwu a n’onwe ya ikpe siri ike nke dị na “imefusị n’efu.”
- source_word: δέ
  choice: Ma
  rationale: “Ma” na-egosi ntụgharị akụkọ ahụ site n’ọnọdụ o nwere ihe gaa n’ọnọdụ nsogbu.
- source_word: ἐγένετο
  choice: dara
  rationale: N’Igbo, a na-ekwukarị na ụnwụ “dara”; nke a na-egosi mmalite ihe ahụ n’ụzọ doro anya ma bụrụkwa okwu ndị mmadụ na-eji.
- source_word: λιμὸς ἰσχυρά
  choice: oké ụnwụ
  rationale: “Oké” na-egosi ike na ịdị njọ nke ụnwụ ahụ, dịka ἰσχυρά si mee ka λιμός sie ike.
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: n’ala ahụ dum
  rationale: κατά na accusative ebe a nwere ike igosi na ihe ahụ gbasara ebe ahụ niile. “Ala ahụ dum” na-edobe echiche ahụ n’Igbo dị mfe ma dị ebube.
- source_word: καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι
  choice: ya onwe ya wee malite ịnọ ná mkpa
  rationale: “Ya onwe ya” na-edobe nkwusi ike nke αὐτός; “wee malite” na-egosi mmalite ọnọdụ ahụ, ebe “ịnọ ná mkpa” na-egosi enweghị ihe ndị dị mkpa.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, sụgharịa amaokwu ahụ. E debere usoro akụkọ na nkwusi ike dị na Greek, ma zere ịgbakwunye ikpe omume nke ngwaa δαπανάω n’onwe ya na-achọghị.
