translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A zere “ọkpara” n’ihi na πρεσβύτερος pụtara onye tọrọ ibe ya, ọ bụghị iwu na ọ pụtara nwa mbụ.
