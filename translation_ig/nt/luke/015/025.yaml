  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: ig
  text: Nwa ya nwoke nke okenye nọ n’ubi; ka ọ na-abịa ma bịaruo ụlọ ahụ nso, ọ nụrụ ụda egwu na ịgba egwu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụda ngwa egwu na ìgwè ndị na-agba egwu.” Okwu Grik abụọ a nwekwara ike izo aka kpọmkwem n’egwu e ji ngwa egwu akpọ na ndị na-agba egwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: nọ
  rationale: δέ na-egosi ngafe n’akụkọ ebe a; a hapụrụ ya n’enweghị njikọ pụrụ iche ka e wee ghara ime ka ọ dị ka mmegide siri ike.
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: nwa ya nwoke nke tọrọ nwanne ya
  rationale: Nke a na-egosi na ọ bụ nwa nwoke nke okenye n’etiti ụmụnne ahụ, ma ọ naghị ekwu kpọmkwem na ọ bụ ọkpara dịka okwu Grik ahụ na-ekwughị.
- source_word: ἐν ἀγρῷ
  choice: nọ n’ubi
  rationale: “Ubi” bụ okwu Igbo nkịtị maka ala a na-akọ ihe, dabara na ἀγρός n’ebe a.
- source_word: ὡς ἐρχόμενος
  choice: ka ọ na-abịa
  rationale: Nke a na-echekwa echiche nke mmegharị ahụ ka ọ na-aga n’ihu, n’etinyeghị echiche “ịlọta” nke na-adịghị kpọmkwem n’okwu Grik.
- source_word: ἤγγισεν τῇ οἰκίᾳ
  choice: mgbe ọ bịaruru ụlọ nso
  rationale: Ọ na-egosi na ọ bịara nso n’ụlọ, ọ bụghị na ọ banyelarị n’ime ya.
- source_word: ἤκουσεν
  choice: ọ nụrụ
  rationale: Nke a bụ nsụgharị kwụ ọtọ nke ngwaa akụkọ a, n’etinyeghị echiche na ọ malitere ịnụ.
- source_word: συμφωνίας
  choice: egwu
  rationale: “Egwu” bụ okwu sara mbara ma dị mfe nghọta maka ụda egwu n’ebe a; ihe ọzọ nwere ike ịbụ ụda ngwa egwu.
- source_word: χορῶν
  choice: ịgba egwu
  rationale: N’ọnọdụ a, “ịgba egwu” na-aga nke ọma na “egwu,” ma okwu Grik ahụ nwekwara ike izo aka n’ìgwè ndị na-agba egwu.
