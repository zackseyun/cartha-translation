  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: ig
  text: Ma iwe were ya, ọ chọghị ịbanye.[a] Ma nna ya pụtara, wee nọgide na-arịọ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ chọghị ịbanye” ma ọ bụ “ọ jụrụ ịbanye.”
    reason: lexical_alternative
  - marker: b
    text: Ngwaa a a sụgharịrị “nọgide na-arịọ” nwekwara ike ịpụta “na-agba ume” ma ọ bụ “na-arịọsi ike”; ọdịdị imperfect ya na-egosi arịrịọ na-aga n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: iwe were ya
  rationale: Nkebi okwu a na-egosi na iwe malitere ijide ya, n’asụsụ Igbo dị mfe ma dị ugwu, n’etinyeghị ike gabigara ókè dịka ‘ọ were oké iwe.’
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ọṅụ a na-eme n’ime ụlọ na iwe nwa nwoke nke okenye.
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: ọ chọghịkwa ịbanye
  rationale: Nke a na-echekwa echiche nke enweghị ọchịchọ ịbanye, n’ekwughị hoo haa na ọ jụrụ kpamkpam, ọ bụ ezie na nke ahụ ga-ekwe omume n’ọnọdụ a.
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: Ya mere, nna ya
  rationale: δὲ nke abụọ na-ebute ihe nna ya mere dịka nzaghachi nye iwe na enweghị ọchịchọ nwa ya ịbanye.
- source_word: ἐξελθὼν
  choice: pụtara bịa
  rationale: Ọ na-egosi na nna ahụ si n’ime ụlọ pụta bịakwute nwa ya nọ n’èzí.
- source_word: παρεκάλει
  choice: nọgide na-arịọ ya
  rationale: παρακαλέω n’ụdị imperfect na-egosi arịrịọ siri ike nke gara n’ihu; ‘nọgide na-arịọ’ na-eme ka akụkụ a pụta ìhè n’Igbo nkịtị.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ebe nwa nwoke nke okenye nọ.
theological_decisions:
- issue: Ụda arịrịọ nna ahụ n’ilu ahụ
  choice: nọgide na-arịọ ya
  alternative: rịọ ya; gbaa ya ume
  rationale: Nhọrọ a na-echekwa ịdị uchu na ịdịgide nke arịrịọ nna ahụ na-enweghị itinye nkọwa ozizi ọzọ n’ihe odide ahụ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugbu a, dị mfe nghọta ma dị ugwu. E ji ‘pụtara bịa’ mee ka mmegharị nna ahụ site n’ime ụlọ ruo n’ebe nwa ya nọ doo anya. Ihe odide bụ isi tinyere akara ndetu ala ala [a] na [b].
