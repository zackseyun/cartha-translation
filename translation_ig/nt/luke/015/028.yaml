- from: Ma iwe were ya, ọ chọghịkwa ịbanye.[a] Ya mere, nna ya pụtara bịa nọgide na-arịọ ya.[b]
  to: Ma iwe were ya, ọ chọghị ịbanye.[a] Ma nna ya pụtara, wee nọgide na-arịọ ya.[b]
  rationale: The revision preserves the Greek narrative contrast in both clauses, removes an unnecessarily causal connector and a redundant movement expression, and supplies a complete footnote for the imperfect force and lexical range of παρακαλέω. It does not add the inferred content of the father's request or impose theological interpretation.
