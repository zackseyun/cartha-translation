source:
  edition: SBLGNT
  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: ig
  text: Ya mere, ọ gara jikọta onwe ya na otu n’ime ụmụ amaala mba ahụ[a], onye ahụ wee ziga ya n’ubi ya ka ọ zụọ ezi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “sonyere” ma ọ bụ “rapara.” Okwu Grik ahụ na-egosi ijikọta onwe mmadụ na onye ọzọ nke ọma, ọbụna n’ụzọ na-egosi ịdabere n’ebe onye ahụ nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: ọ gara
  rationale: Na-egosi njem ahụ n'ụzọ dị mfe ma kwekọọ n'ọrụ participle a n'ahịrịokwu ahụ.
- source_word: ἐκολλήθη
  choice: rapara n’ahụ́
  rationale: Na-echekwa echiche nke ịrapara mmadụ nso na ịdabere n'ebe ọ nọ, karịa naanị iso ya sonyere.
- source_word: ἑνὶ τῶν πολιτῶν
  choice: otu n’ime ụmụ amaala
  rationale: “Nwa amaala” na-egosi onye bụ onye obodo ahụ, kwekọọ na πολίτης.
- source_word: τῆς χώρας ἐκείνης
  choice: obodo ahụ
  rationale: N'okwu a, “obodo ahụ” bụ Igbo nkịtị maka ala ma ọ bụ mba ahụ a kpọtụrụla aha.
- source_word: ἔπεμψεν
  choice: onye ahụ wee ziga ya
  rationale: Ịkpọghachi “onye ahụ” na-eme ka o doo anya na nwa amaala ahụ bụ onye zitere ya, na-enweghị ịgbakwunye echiche ọzọ.
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: n’ubi ya
  rationale: “Ubi” nwere ike ịkọwa ala ọrụ ugbo; Igbo anaghị achọkarị ịka akara ọtụtụ ebe a.
- source_word: βόσκειν
  choice: ka ọ na-azụ
  rationale: “Ịzụ” bụ okwu Igbo dị mma maka ilekọta na inye anụ ụlọ nri n'ọnọdụ a.
- source_word: χοίρους
  choice: ezi
  rationale: “Ezi” bụ okwu Igbo nkịtị na nke oge a maka pigs.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. A họọrọ “rapara n’ahụ́” iji chekwaa ike okwu Grik ahụ; e tinyere nkọwa ala peeji n’ihi na nkebiokwu a nwekwara ike ịpụta isonyere mmadụ ma ọ bụ ịdabere n’ebe ọ nọ.
