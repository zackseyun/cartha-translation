revisions:
- from: Ya mere, ọ gara rapara n’ahụ́ otu n’ime ụmụ amaala obodo ahụ[a], onye ahụ wee ziga ya n’ubi ya ka ọ na-azụ ezi.
  to: Ya mere, ọ gara jikọta onwe ya na otu n’ime ụmụ amaala mba ahụ[a], onye ahụ wee ziga ya n’ubi ya ka ọ zụọ ezi.
  rationale: The revised text replaces an overly literal, bodily expression with an idiomatic rendering that preserves the Greek sense of self-attachment. It also clarifies that the location is a country rather than a town, while retaining the original sequence, agent, and purpose clause. The footnote continues to mark the relevant lexical alternatives and dependent nuance.
