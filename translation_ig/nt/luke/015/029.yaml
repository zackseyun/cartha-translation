revisions:
- from: Ma ọ zara nna ya sị, “Lee, kemgbe ọtụtụ afọ ndị a, ana m agba gị ohu[a], ọ dịghịkwa mgbe m mebiri iwu gị; ma ọ dịghị mgbe ọ bụla i nyere m ọbụna otu nwa ewu ka mụ na ndị enyi m ṅụrịa ọṅụ.”
  to: Ma ọ zara nna ya sị, “Lee, afọ ndị a niile ka m na-ejere gị ozi, ọ dịghịkwa mgbe m mebiri iwu gị; ma ọ dịghị mgbe i nyere m ọbụna otu nwa ewu ka mụ na ndị enyi m ṅụrịa ọṅụ.”
  rationale: The revision uses clear, modern Standard Igbo while retaining the elder son’s resentful complaint. It renders δουλεύω with the normal equivalent “ejere ... ozi” and preserves its possible stronger subordinate/slave-like nuance in a non-doctrinal lexical footnote. The verse’s meaning and ambiguity are unchanged.
