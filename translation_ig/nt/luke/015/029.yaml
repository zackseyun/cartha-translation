id: LUK.15.29
reference: Luke 15:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: ig
  text: Ma ọ zara nna ya sị, “Lee, afọ ndị a niile ka m na-ejere gị ozi, ọ dịghịkwa mgbe m mebiri iwu gị; ma ọ dịghị mgbe i nyere m ọbụna otu nwa ewu ka mụ na ndị enyi m ṅụrịa ọṅụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: zara ... sị
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu a n'ụzọ dị mma ma doo anya; ọ na-echekwa ma nzaghachi ahụ ma okwu o kwuru.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche ma mesie mkpesa ahụ ike; “Lee” bụ Igbo dị ugbu a ma dịkwa ugwu.
- source_word: τοσαῦτα ἔτη
  choice: kemgbe ọtụtụ afọ ndị a
  rationale: Ọ na-egosi ogologo oge ruo ugbu a, dị ka okwu Grik ahụ si dị.
- source_word: δουλεύω σοι
  choice: ana m agba gị ohu
  rationale: δουλεύω sitere n'òtù okwu gbasara ịbụ ohu ma ọ bụ ije ozi n'okpuru onye ọzọ. N'ọnụ nwa nwoke nke okenye, okwu a na-egosipụta iwe na echiche ya na ọ na-arụ ọrụ dị ka ohu, ọ bụghị nanị ije ozi nwayọọ.
- source_word: ἐντολήν σου παρῆλθον
  choice: mebiri iwu gị
  rationale: N'ebe a παρέρχομαι pụtara imegide ma ọ bụ ịghara irubere iwu isi; “mebiri iwu gị” bụ okwu Igbo doro anya ma dị nkenke.
- source_word: ἔδωκας ἔριφον
  choice: nyere m ọbụna otu nwa ewu
  rationale: ἔριφος bụ nwa ewu. “Ọbụna otu” na-eme ka mkpesa ya na ihe ahụ dị ntakịrị pụta ìhè n'ụzọ Igbo si ekwu ya.
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: ka mụ na ndị enyi m ṅụrịa ọṅụ
  rationale: Ọ na-echekwa ebumnuche ahụ na echiche nke ịnụ ụtọ emume ọnụ n'ọnọdụ oriri a.
theological_decisions:
- issue: Ike okwu δουλεύω n'okwu nwa nwoke nke okenye
  choice: ana m agba gị ohu
  alternative: ana m ejere gị ozi
  rationale: Nsụgharị a anaghị ekwu na ọ bụ ohu n'ụzọ iwu kwadoro; ọ na-echekwa otú o si were ọnọdụ ya n'obi na iwe dị n'okwu ya. Ihe ọzọ dị nro ka edere n'ala peeji ka a ghara izochi obosara ihe okwu Grik ahụ pụrụ ịpụta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu, ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ụda mkpesa siri ike nke nwa nwoke ahụ n'enweghị itinye nkọwa okpukpe pụrụ iche.
