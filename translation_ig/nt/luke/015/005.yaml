review_pass:
  verdict: revise
  source_fidelity: The draft correctly supplies the implicit object ('ya') from the immediate context, renders the placement on the shepherd’s shoulders, and retains the accompanying joy of χαίρων. The Greek plural ὤμους does not require the explicit numeral abụọ in idiomatic Igbo; the possessive expression ubu ya naturally denotes the shepherd’s shoulders in this context.
  naturalness: The main line is generally clear, but n’ubu ya abụọ is less natural than n’ubu ya and makes the phrasing unnecessarily explicit. The existing footnote is awkwardly formed; a simpler relative clause is standard and clear.
  terminology: Atụrụ, ubu, and aṅụrị ọṅụ are suitable Standard Igbo choices. Ebukwasị appropriately conveys placing/carrying the sheep onto the shoulders.
  issues:
  - severity: low
    issue: The explicit abụọ after ubu is unnecessary and somewhat stiff.
    rationale: Igbo idiom normally uses ubu ya for carrying something on one’s shoulders; the contextual bodily pair adequately represents the Greek plural without an unnatural numeral.
  - severity: medium
    issue: The footnote wording n’amaokwu bu nke a ụzọ is unidiomatic.
    rationale: It should be recast as n’amaokwu bu ụzọ, with a clear relative expression identifying the sheep discussed there.
  revised_text: Mgbe ọ chọtara ya[a], ọ na-ebukwasị ya n’ubu ya, na-aṅụrị ọṅụ.
