  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὑρὼν ἐπιτίθησιν ἐπὶ τοὺς ὤμους ⸀αὐτοῦ χαίρων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/005.yaml
  text: And when he has found it[a], he lays it on his shoulders, rejoicing.
translation:
  language: ig
  text: Mgbe ọ chọtara ya[a], ọ na-ebukwasị ya n’ubu ya, na-aṅụrị ọṅụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, atụrụ ahụ furu efu e kwuru okwu banyere ya n’amaokwu bu ụzọ.
    reason: cross_reference
lexical_decisions:
- source_word: εὑρὼν
  choice: Mgbe ọ chọtara ya
  rationale: A tụgharịrị participle aorist ahụ ka ọ bụrụ nkebiokwu oge n’Igbo, nke na-egosi na ịchọta atụrụ ahụ buru ụzọ mee. E tinyere ‘ya’ n’ihi na ihe a chọtara doro anya site n’okwu gbara ya gburugburu.
- source_word: ἐπιτίθησιν
  choice: ọ na-ebukwasị ya
  rationale: ‘Ibukwasị’ na-egosi omume ibuli ihe ma dọba ya n’elu ubu, ma kwekọọ n’usoro ἐπί tinyere accusative. ‘Na-’ na-echekwa ọdịdị present nke ngwaa Grik.
- source_word: ἐπὶ τοὺς ὤμους
  choice: n’ubu ya abụọ
  rationale: Nke a na-egosi mmegharị na idọba atụrụ ahụ n’elu ubu onye ọzụzụ atụrụ, ma ‘abụọ’ na-eme ka plural ὤμους pụta ìhè n’Igbo eke.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnochiaha genitive a na-ezo aka n’ubu onye ọzụzụ atụrụ, ọ bụghị nke atụrụ ahụ.
- source_word: χαίρων
  choice: na-aṅụrị ọṅụ
  rationale: Nkebiokwu participle a na-egosi ọṅụ na-eso omume ibukwasị atụrụ ahụ; ntụgharị a na-echekwa ya dịka omume na-aga n’otu oge, kama ime ya naanị adverb.
theological_decisions:
- issue: Itinye ihe e chọtara dịka direct object
  choice: E tinyere ‘ya’ mgbe ‘ọ chọtara’ gasịrị, na-ezo aka n’atụrụ ahụ furu efu.
  alternative: Mgbe ọ chọtara, ọ na-ebukwasị n’ubu ya abụọ, na-aṅụrị ọṅụ.
  rationale: Grik hapụrụ object ahụ n’ime nghọta n’ihi na ihe gbara okwu ahụ gburugburu mere ka ọ doo anya. Igbo chọrọ ‘ya’ ebe a maka nghọta doro anya; nke a adịghị agbakwunye nkọwa okwukwe ọhụrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị nsọpụrụ. ‘Na-ebukwasị’ bụ okwu eke maka idọba ibu n’elu ubu; ‘n’ubu ya abụọ’ na-echekwa plural nke Grik. Akara ntụaka [a] dị n’ahịrị isi ma kwekọọ na nkọwa ala peeji.
