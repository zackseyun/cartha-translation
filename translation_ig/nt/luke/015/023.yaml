source:
  edition: SBLGNT
  text: καὶ ⸀φέρετε τὸν μόσχον τὸν σιτευτόν, θύσατε, καὶ φαγόντες εὐφρανθῶμεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: ig
  text: Wetanụ nwa ehi ahụ a zụpụtara ka o maa abụba[a], gbuonụ ya, ka anyị rie ma mee emume,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “chụọ ya n’àjà”; ngwaa Grik a nwere ike ịpụta igbu anụ, ma n’ọnọdụ ụfọdụ ọ na-enwekwa echiche ịchụ àjà.
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: Kpọtaranụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. “Kpọtaranụ” na-egosi iweta ihe ahụ n’ebe onye na-ekwu nọ n’Igbo dị ndụ, n’agbanyeghị na echiche “n’ebe a” adịghị mkpa ikwupụta iche.
- source_word: μόσχον τὸν σιτευτόν
  choice: nwa ehi ahụ a zụnyere ka o maa abụba
  rationale: μόσχος bụ nwa ehi, ebe σιτευτός na-egosi anụmanụ e nyere nri pụrụ iche ka ọ maa abụba maka oge dị mkpa. Nkebi a doro ndị na-agụ Igbo anya ma chekwaa echiche oriri emume.
- source_word: θύσατε
  choice: gbuo ya
  rationale: θύω nwere ike ịpụta igbu anụ maka iri ma ọ bụ ịchụ ya n’àjà. N’ọnọdụ oriri ezinụlọ a, “gbuo ya” bụ okwu Igbo nkịtị nke na-adịghị etinye echiche àjà n’amaokwu ahụ n’ike.
- source_word: φαγόντες
  choice: ka anyị rie
  rationale: Ọ bụ participle aorist nke pụtara n’ụzọ nkịtị ‘mgbe anyị richara,’ ma ya na εὐφρανθῶμεν na-arụkọ ọrụ dị ka òkù ka ha rie ma mee emume. Nhazi a bụ Igbo eke ma na-echekwa usoro omume ahụ.
- source_word: εὐφρανθῶμεν
  choice: mee emume
  rationale: Subjunctive nke onye mbụ ọtụtụ na-akpọ ndị nọ ebe ahụ ka ha sonye. “Mee emume” dabara n’oriri a ma na-egosi ọṅụ a na-emekọ ọnụ.
- source_word: καὶ ... καὶ
  choice: ma
  rationale: Njikọ “ma” jikọtara iri na ime emume n’Igbo eke, ma chekwaa mmegharị nke iwu na òkù dị na Grik.
theological_decisions:
- issue: Echiche àjà nwere ike ịdị na θύσατε
  choice: 'A sụgharịrị ya dịka igbu anụ maka oriri: “gbuo ya.”'
  alternative: “chụọ ya n’àjà”
  rationale: Ọ bụ ezie na θύω nwere ike inwe echiche ịchụ àjà, ọnọdụ akụkọ a na-elekwasị anya n’ịkwadebe anụ maka oriri ọṅụ ezinụlọ. “Chụọ ya n’àjà” nwere ike itinye nkọwa ofufe nke amaokwu ahụ ekwughị hoo haa. Ihe odide ala ala peeji na-echekwa ohere okwu Grik ahụ nwere.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ụdị iwu ọtụtụ mmadụ “Kpọtaranụ” mee ka ọnụ ọgụgụ dị na Grik pụta ìhè; a zere okwu ụka pụrụ iche ma chekwaa ohere abụọ dị na θύσατε site n’ihe odide ala ala peeji.
