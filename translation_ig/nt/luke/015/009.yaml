review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the recovered coin, the gathering of the woman’s friends and neighbors, the invitation to share her joy, and the lost drachma. However, the Greek main verb συγκαλεῖ is a vivid present (‘she calls together’); the completed past form ‘ọ kpọkọrọ’ removes that discourse feature without a compelling Igbo necessity.
  naturalness: Most of the verse is clear, idiomatic Standard Igbo. ‘Ụmụ nwanyị ndị enyi ya’ is understandable but is less natural than a relative formulation that explicitly identifies the friends as women. The direct invitation ‘Soronụ m ṅụrịa ọṅụ’ is natural and appropriately plural.
  terminology: ‘Drakma’ correctly preserves δραχμή, and the cultural footnote is accurate and suitably restrained. No theological terminology is at issue.
  issues:
  - severity: low
    issue: The main verb is rendered as completed past (‘ọ kpọkọrọ’) rather than the source’s vivid present.
    rationale: συγκαλεῖ is present indicative in a narrative context. Standard Igbo can retain the ongoing/vivid sense with ‘ọ na-akpọkọta,’ while the preceding ‘Mgbe ọ chọtara ya’ clearly supplies the sequence.
  - severity: low
    issue: ‘Ụmụ nwanyị ndị enyi ya’ has marked word order.
    rationale: ‘Ndị enyi ya bụ ụmụ nwanyị’ is clearer, more natural Standard Igbo, and retains the feminine reference of φίλας without implying a specialized relationship sense.
  revised_text: Mgbe ọ chọtara ya, ọ na-akpọkọta ndị enyi ya bụ ụmụ nwanyị na ndị agbata obi ya, sị ha, “Soronụ m ṅụrịa ọṅụ, n’ihi na achọtala m drakma[a] ahụ m tụfuru.”
  revised_footnotes:
