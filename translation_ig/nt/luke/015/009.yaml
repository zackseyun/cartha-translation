id: LUK.15.9
reference: Luke 15:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: ig
  text: Mgbe ọ chọtara ya, ọ na-akpọkọta ndị enyi ya bụ ụmụ nwanyị na ndị agbata obi ya, sị ha, “Soronụ m ṅụrịa ọṅụ, n’ihi na achọtala m drakma[a] ahụ m tụfuru.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Drakma bụ mkpụrụ ego ọlaọcha ndị Grik; n’ọtụtụ ọnọdụ, uru ya dị ihe dịka ụgwọ ọrụ otu ụbọchị nke onye ọrụ.
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: Mgbe ọ chọtara ya
  rationale: A sụgharịrị participle aorist nke na-ezo aka n’ebe nwanyị ahụ nọ dịka nkebi oge n’Igbo dị mfe; “ya” na-ezo aka na mkpụrụ ego ahụ nke amaokwu ndị gbara ya gburugburu kọwara.
- source_word: συγκαλεῖ
  choice: ọ kpọkọrọ
  rationale: “Kpọkọrọ” na-egosi ịkpọ ọtụtụ ndị ka ha zukọta. Ọ bụ ezie na Grik ji present akụkọ, past tense a na-eme ka usoro akụkọ ahụ daa nke ọma n’Igbo n’enweghị ịgbanwe ihe omume ahụ.
- source_word: φίλας
  choice: ụmụ nwanyị ndị enyi ya
  rationale: Ụdị okwu Grik ahụ bụ feminine plural; nsụgharị a na-eme ka o doo anya na ndị enyi a bụ ụmụ nwanyị ma na-anọgide bụrụ Igbo a na-aghọta ngwa ngwa.
- source_word: γείτονας
  choice: ndị agbata obi ya
  rationale: Nke a bụ okwu Igbo nkịtị maka ndị bi nso; a naghị amanye okike nwanyị n’ebe okwu Grik a n’onwe ya na-adịghị ekpebi ya n’ụdị ahụ.
- source_word: λέγουσα
  choice: sị ha
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma dị ndụ isi webata okwu nwanyị ahụ kwuru kpọmkwem.
- source_word: Συγχάρητέ μοι
  choice: Soronụ m ṅụrịa ọṅụ
  rationale: Ọ na-echekwa iwu plural ahụ na echiche nke iso onye ọzọ kerịta ọṅụ, kama ịsụgharị ya naanị dịka ime emume.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara o ji kpọọ ha ka ha soro ya ṅụrịa ọṅụ.
- source_word: εὗρον
  choice: achọtala m
  rationale: Perfect a na-ejikarị n’Igbo na-egosi nchọpụta e mezuru nke nsonaazụ ya ka dị ugbu a; ọ dabara n’okwu ọṅụ nwanyị ahụ kwuru.
- source_word: δραχμὴν
  choice: drakma
  rationale: E debere aha mkpụrụ ego Grik ahụ kpọmkwem, ebe nkọwa ala peeji na-akọwa uru na ụdị ya.
- source_word: ἣν ἀπώλεσα
  choice: ahụ m tụfuru
  rationale: Nkebi a na-akọwapụta drakma kpọmkwem ahụ ma na-egosi na nwanyị ahụ bụ onye tụfuru ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ụmụ nwanyị ndị enyi ya” na-echekwa nkọwa feminine nke φίλας; “Soronụ m ṅụrịa ọṅụ” na-egosipụta ọṅụ a na-ekerịta. Akara nkọwa [a] dị n’akụkụ “drakma,” okwu nkọwa ahụ na-akọwa kpọmkwem.
