- from: Ma o kwesịrị ka anyị mee oriri ma ṅụrịa ọṅụ[a], n’ihi na nwanne gị a nwụrụ anwụ ma dịkwa ndụ ọzọ[b]; o furu efu, ma a chọtala ya[c].
  to: Ma ọ dị mkpa ka e mee oriri ma ṅụrịa ọṅụ[a], n’ihi na nwanne gị a nwụrụ anwụ ma dịkwa ndụ ọzọ[b]; o furu efu, ma a chọtala ya[c].
  rationale: The revision removes the added first-person plural subject and uses an idiomatic impersonal Igbo construction, matching the ambiguity of ἔδει. It also makes “ọ dị mkpa” the main rendering, with “ọ kwesịrị” retained as the stated lexical alternative. All other wording and footnote anchors are retained because they accurately convey the Greek and read naturally in Standard Igbo.
