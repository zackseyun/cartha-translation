id: LUK.15.32
reference: Luke 15:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: ig
  text: Ma ọ dị mkpa ka e mee oriri ma ṅụrịa ọṅụ[a], n’ihi na nwanne gị a nwụrụ anwụ ma dịkwa ndụ ọzọ[b]; o furu efu, ma a chọtala ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ kwesịrị ka e mee oriri ma ṅụrịa ọṅụ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “dịrị ndụ” ma ọ bụ “bịara dịrị ndụ”; n’ilu a, o yikarịrị ka okwu ahụ na-egosi mweghachi.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a chọtara ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: mee oriri
  rationale: N’ọnọdụ oriri dị n’ilu a, ‘mee oriri’ na-egosi ọṅụ emume nke okwu Grik a pụtara, ma na-ada ka Igbo nkịtị karịa ntụgharị siri ike.
- source_word: χαρῆναι
  choice: ṅụrịa ọṅụ
  rationale: Nke a na-edobe okwu nke abụọ gbasara ọṅụ, kama ijikọta ya na εὐφρανθῆναι ka ha bụrụ naanị otu echiche.
- source_word: ἔδει
  choice: o kwesịrị ka anyị
  rationale: ἔδει na-egosi ihe ọnọdụ na omume ziri ezi chọrọ. ‘O kwesịrị’ na-edobe ma echiche nke ịdị mkpa ma nke ịdị mma; ‘anyị’ bụ onye a ghọtara site n’ọnọdụ okwu, ọ bụ ezie na Grik ekwughị onye ahụ kpọmkwem.
- source_word: ὁ ἀδελφός σου οὗτος
  choice: nwanne gị a
  rationale: Usoro a bụ Igbo ebumpụta ụwa, ma ọ na-edobe ma nnọchiaha nwe ‘gị’ ma okwu ngosi οὗτος.
- source_word: νεκρὸς ἦν
  choice: nwụrụ anwụ
  rationale: A hapụrụ ihe oyiyi ọnwụ dịka ọ dị na Grik, na-akọwaghị ya n’ime ederede dịka nkewa ma ọ bụ mweghachi.
- source_word: ἔζησεν
  choice: dịkwa ndụ ọzọ
  rationale: Nke a na-edobe ọdịiche ọnwụ na ndụ, ebe ‘ọzọ’ na-egosi nlọghachi e gosipụtara n’ilu ahụ, ọ bụ ezie na ngwaa Grik n’onwe ya pụtara ‘dịrị ndụ.’
- source_word: ἀπολωλὼς
  choice: furu efu
  rationale: Nke a bụ ụzọ Igbo a na-ahụkarị isi kwuo ọnọdụ nke ịbụ onye furu efu, na-enweghị ime ka ọ bụrụ ‘bibiri.’
- source_word: εὑρέθη
  choice: a chọtala ya
  rationale: Nke a na-egosi na a chọtara ya nakwa na nsonaazụ ahụ ka dị ugbu a; ọ na-edobekwa olu nnara nke Grik n’ụzọ Igbo na-ada nke ọma.
theological_decisions:
- issue: Ma a ga-akọwa ἔζησεν ozugbo dịka mweghachi ime mmụọ ma ọ bụ mmekọrịta
  choice: dịkwa ndụ ọzọ
  alternative: lọghachikwara n’ọnọdụ ọma / e weghachikwara ya
  rationale: A hapụrụ okwu ọnwụ na ndụ nke ilu ahụ n’ụdị ihe oyiyi ya, ka ntụgharị ghara ikpebi kpọmkwem ụdị mweghachi a na-ekwu maka ya ma ọ bụ mee ya ozizi kpọmkwem banyere mbilite n’ọnwụ anụ ahụ.
- issue: 'Ike ἔδει: mkpa ma ọ bụ ihe dabara adaba'
  choice: o kwesịrị
  alternative: ọ dị mkpa
  rationale: ‘O kwesịrị’ na-egosi ibu ọrụ omume na ihe dabara n’ọnọdụ ahụ, ma ihe ọzọ nwekwara ike ịbụ ‘ọ dị mkpa’; e debere ọdịiche ahụ na ndetu ala.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nwanne gị a’ mee ka ncheta nna ahụ banyere mmekọrịta ha pụta ìhè. E debere nhata okwu abụọ gbasara ọṅụ na ọdịiche ọnwụ/ndụ, ifu efu/ịchọta.
