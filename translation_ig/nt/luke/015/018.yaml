revisions:
- from: Aga m ebili gaa nna m, sị ya, ‘Nna, emehiela m megide eluigwe[a] na n’ihu gị[b].’
  to: Aga m ebili, gakwuru nna m, asị ya, ‘Nna, emehiela m megide eluigwe[a] na n’ihu gị[b].’
  rationale: The revision makes the movement and coordinated speech idiomatic in Standard Igbo while preserving the source’s action sequence and its deliberate distinction between sinning “against heaven” and being “before” the father. Footnote a is corrected to explain the reverential reference accurately; no interpretive substitution is made in the main text.
