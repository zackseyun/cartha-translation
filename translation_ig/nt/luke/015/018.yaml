  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: ig
  text: Aga m ebili, gakwuru nna m, asị ya, ‘Nna, emehiela m megide eluigwe[a] na n’ihu gị[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “megide Chineke”; “eluigwe” n’ebe a nwere ike ịbụ ụzọ nkwanye ùgwù e si ezo aka na Chineke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’anya gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: Aga m ebili
  rationale: Aorist participle a na-egosi ihe mbụ nwa ahụ kpebiri ime tupu ọ gaa. Ịsụ ya dị ka ngwaa ọdịnihu e jikọtara na nke na-esote—“Aga m ebili gaa”—bụ Igbo eke ma na-edobe usoro omume ahụ.
- source_word: πορεύσομαι
  choice: gaa
  rationale: Ngwaa ọdịnihu a na-egosi ịga ebe nna ya nọ. “Gaa” bụ okwu Igbo doro anya ma ghara ịtinye echiche ọzọ dịka ogologo njem.
- source_word: πρὸς τὸν πατέρα μου
  choice: gaa nna m
  rationale: πρός na accusative na-egosi ije ruo ma ọ bụ n’ebe mmadụ nọ. N’Igbo, “gaa nna m” na-egosi n'ụzọ eke na ọ ga-alaghachikwuru nna ya.
- source_word: ἐρῶ αὐτῷ
  choice: sị ya
  rationale: Future nke λέγω tinyere indirect object pụtara ikwu okwu nye ya. “Sị ya” bụ usoro Igbo dị nkenke ma kwekọọ n’okwu kpọmkwem na-esote.
- source_word: Πάτερ
  choice: Nna
  rationale: Nke a bụ vocative e ji akpọ nna ya kpọmkwem. “Nna” na-edobe adreesị ahụ n’etinyeghị possessive na-adịghị n’ebe a.
- source_word: ἥμαρτον
  choice: emehiela m
  rationale: Aorist a bụ nkwupụta mmehie e mere nke ka metụtara ọnọdụ ugbu a. “Emehiela m” bụ ụzọ Igbo eke e si kwupụta na onye ahụ emehiela.
- source_word: εἰς τὸν οὐρανὸν
  choice: megide eluigwe
  rationale: E debere “eluigwe” dịka okwu Gris si dị, n’ihi na ọ nwere ike ịbụ ụzọ nkwanye ùgwù e si zere ịkpọ Chineke aha kpọmkwem. Nke a na-echekwa ihe oyiyi na nghọta abụọ dị n’isi mmalite.
- source_word: ἐνώπιόν σου
  choice: n’ihu gị
  rationale: ἐνώπιον na genitive pụtara n’ihu ma ọ bụ n’anya mmadụ. “N’ihu gị” na-edobe okwu dị iche na “megide eluigwe” kama ime ka ha abụọ bụrụ naanị “megide.”
theological_decisions:
- issue: Ma a ga-asụgharị “eluigwe” n’isiokwu bụ isi dịka “Chineke”
  choice: 'E debere “eluigwe”: “emehiela m megide eluigwe.”'
  alternative: “Emehiela m megide Chineke.”
  rationale: Ọ bụ ezie na “eluigwe” nwere ike ịbụ ụzọ nkwanye ùgwù e si na-ezo aka n’ebe Chineke nọ, ihe odide Gris kwuru οὐρανός (“eluigwe”). Idebe ya na-echekwa okwu isi mmalite na esemokwu nkọwa ya; ihe odide ala peeji na-akọwa ụzọ ọzọ.
- issue: Ma ἐνώπιόν σου ọ pụtara kpọmkwem “megide gị”
  choice: “n’ihu gị”
  alternative: “megide gị”
  rationale: Okwu Gris pụtara “n’ihu gị” ma ọ bụ “n’anya gị.” Ịsụgharị ya “megide gị” ga-eme ka ọ yie εἰς nke bu ya ụzọ ma wepụ ọdịiche okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee nsọpụrụ. “Aga m ebili gaa” na “sị ya” na-eme ka ahịrịokwu ahụ na-aga nke ọma n’Igbo. E tinyere akara ihe odide ala peeji n’akụkụ okwu ha na-akọwa, ya bụ “eluigwe[a]” na “n’ihu gị[b].”
