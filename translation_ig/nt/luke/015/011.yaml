id: LUK.15.11
reference: Luke 15:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν δέ· Ἄνθρωπός τις εἶχεν δύο υἱούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/011.yaml
  text: Then he said[a], “A certain man had two sons.”
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị, “Otu nwoke nwere ụmụ nwoke abụọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: ọ sịrị
  rationale: Aorist nke λέγω na-ewebata akụkụ ọzọ nke okwu Jizọs; “ọ sịrị” bụ ụzọ Igbo dị mfe ma bụrụkwa nke kwesịrị ekwesị isi kwuo ya.
- source_word: δέ
  choice: Mgbe ahụ
  rationale: δέ bụ njikọ dị nro nke na-egosi na okwu ahụ na-aga n’ihu ma ọ bụ na-agbanwe gaa n’akụkụ ọzọ; “Mgbe ahụ” na-eme ka usoro okwu doo anya n’Igbo n’etinyeghị echiche nke esemokwu.
- source_word: Ἄνθρωπός τις
  choice: Otu nwoke
  rationale: τις na-eme ka onye ahụ bụrụ onye a na-akpọtụghị aha, ebe ἄνθρωπος n’ebe a na-ezo aka n nwoke, nna ụmụ nwoke abụọ. “Otu nwoke” bụ ụzọ Igbo ebumpụta ụwa si chekwaa echiche ahụ.
- source_word: εἶχεν
  choice: nwere
  rationale: Imperfect nke ἔχω na-akọ ọnọdụ e ji malite ilu ahụ. N’Igbo, “nwere” na-egosipụta ọnọdụ ahụ n’ụzọ nkịtị.
- source_word: δύο
  choice: abụọ
  rationale: Ọ bụ ọnụ ọgụgụ abụọ kpọmkwem.
- source_word: υἱούς
  choice: ụmụ nwoke
  rationale: υἱούς pụtara ụmụ ndị nwoke kpọmkwem, ọ bụghị naanị ụmụ n’ozuzu; nke a na-echekwa nkọwa ezinụlọ dị mkpa n’ilu ahụ.
theological_decisions:
- issue: Ma Ἄνθρωπός τις ọ bụ okwu izugbe ka ọ na-akọwapụta otu onye a na-akpọghị aha
  choice: Otu nwoke
  alternative: Nwoke
  rationale: “Otu nwoke” na-egosipụta ike okwu τις nke na-ewebata otu onye a na-akpọghị aha, n’etinyeghị nkọwa ihe atụ ma ọ bụ ozizi ọzọ na-adịghị n’ihe odide ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji “Mgbe ahụ” mee ka mgbanwe nke δέ pụta ìhè, ebe “Otu nwoke” na-anọchi Ἄνθρωπός τις n’ụzọ Igbo nkịtị; ya mere, ọ dịghị mkpa itinye nkọwa ala peeji.
