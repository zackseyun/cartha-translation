source:
  edition: SBLGNT
  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: ig
  text: Ma ndị Farisii ma ndị odeakwụkwọ nọ na-atamu ntamu, na-asị, “Nwoke a na-anabata[a] ndị mmehie, ma na-esokwa ha eri nri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-anara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγόγγυζον
  choice: nọ na-atamu ntamu
  rationale: Ụdị ngwaa imperfect na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro; “nọ na-atamu ntamu” na-echekwa echiche nke mkpesa a na-ekwu n’olu dị ala.
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: Ma ndị Farisii ma ndị odeakwụkwọ
  rationale: Usoro “ma … ma …” na-egosipụta ike njikọ τε … καί nke gụnyere ìgwè abụọ ahụ. “Ndị odeakwụkwọ” bụ aha a maara nke ọma maka γραμματεῖς n’akụkọ Oziọma.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-egosi okwu ha na-ekwu n’otu oge ahụ ha nọ na-atamu ntamu, ma mee ka ahịrịokwu ahụ daa nke ọma n’Igbo.
- source_word: Οὗτος
  choice: Nwoke a
  rationale: “Nwoke a” na-echekwa ụda ngosi nke nwere ike igosi nlelị ma ọ bụ ịwepụ onwe ha n’ebe Jizọs nọ, karịa ịsị naanị “ọ.”
- source_word: ἁμαρτωλοὺς
  choice: ndị mmehie
  rationale: Nke a bụ ntụgharị nkịtị ma doo anya nke adjective e ji dị ka aha, ma na-echekwa ọnọdụ mmadụ na nke okpukpe dị n’ebubo ahụ.
- source_word: προσδέχεται
  choice: na-anabata
  rationale: “Na-anabata” na-egosi ịnabata mmadụ nke ọma ma ọ bụ ile ya ọbịa, n’enweghị itinye echiche ọzọ na-adịghị n’ederede.
- source_word: συνεσθίει αὐτοῖς
  choice: sorokwa ha na-eri nri
  rationale: Nke a na-egosi iso ha rie nri, ya bụ mmekọrịta ha na ya na tebụl, n’ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
theological_decisions:
- issue: Ike ebubo dị n’iso ndị mmehie na-akpakọrịta ma na-eri nri
  choice: 'E gosipụtara ebubo ahụ ozugbo: ọ na-anabata ndị mmehie ma soro ha na-eri nri.'
  alternative: Nwoke a na-anara ndị mmehie ma na-eso ha eri nri.
  rationale: Edebere ihe na-akpasu ndị Farisii na ndị odeakwụkwọ iwe—ịnabata ndị ha kpọrọ ndị mmehie na iso ha rie nri—n’enweghị ime ka ọ dị nro ma ọ bụ ịgbakwunye nkọwa ozizi.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nọ na-atamu ntamu” na-egosi omume na-aga n’ihu; “ma … ma …” na-eme ka ìgwè abụọ ahụ pụta ìhè. E debere akara nkọwa [a] n’ebe okwu προσδέχεται dị, n’ihi na nkọwa ọzọ ahụ metụtara “na-anabata/na-anara,” ọ bụghị ngwaa διεγόγγυζον.
