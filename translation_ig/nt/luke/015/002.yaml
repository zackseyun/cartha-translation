  to: Ma ndị Farisii ma ndị odeakwụkwọ nọ na-atamu ntamu, na-asị, “Nwoke a na-anabata[a] ndị mmehie, ma na-esokwa ha eri nri.”
  rationale: 'A small syntactic revision makes the coordinated present actions idiomatic and parallel in Standard Igbo: he welcomes sinners and eats with them. No change is made to the source meaning, social force, register, names, or footnote anchor.'
