id: LUK.15.24
reference: Luke 15:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: ig
  text: n’ihi na nwa m nwoke a nwụrụ anwụ, ma ọ dịghachi ndụ[a]; o furu efu, ma a chọtala ya[b]. Ha wee malite ime ememme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ lọghachiri ná ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a chọtara ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe nna ahụ ji kọwaa ihe mere ha ji eme ememme; nke a bụ njikọ na-egosi ihe kpatara ya n’Igbo nkịtị.
- source_word: οὗτος ὁ υἱός μου
  choice: nwa m nwoke a
  rationale: Ọ na-echekwa nkwusi ike dị na οὗτος ma na-ada ka Igbo e ji eme ihe ugbu a.
- source_word: νεκρὸς ἦν
  choice: nwụrụ anwụ
  rationale: Ọ na-edowe okwu ọnwụ ahụ n’ike ya, n’agbanyeghị na n’ilu a ọ na-arụ ọrụ dịka ihe atụ maka nkewapụ.
- source_word: ἀνέζησεν
  choice: dịghachiri ndụ
  rationale: Ọ na-egosi ịlaghachi ná ndụ ọzọ ma kwekọọ nke ọma na okwu bu ya ụzọ, ‘nwụrụ anwụ.’
- source_word: ἦν ἀπολωλὼς
  choice: o furu efu
  rationale: Ọ na-echekwa isiokwu nke ihe furu efu na ihe a chọtara nke jupụtara n’isiakwụkwọ a, na-enweghị ịgbakwunye nkọwa ọzọ.
- source_word: εὑρέθη
  choice: a chọtala ya
  rationale: Ụdị a na-echekwa passive nke Grik ma ghara ịkpọ onye chọtara ya aha; perfect Igbo na-egosikwa ọnọdụ ya ugbu a.
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: Ha wee malite ime ememme
  rationale: ‘Malite’ na-echekwa ingressive aspect, ebe ‘ime ememme’ dabara n’ọnọdụ oriri na ọṅụṅụ ahụ ma bụrụ okwu doro ndị na-agụ akwụkwọ ugbu a anya.
theological_decisions:
- issue: Ike ihe atụ dị n’okwu ‘nwụrụ anwụ’ na ‘dịghachiri ndụ’
  choice: Idowe okwu ndụ na ọnwụ ahụ dịka ederede si kwuo ya, na-akọwaghị ya n’ime amaokwu ahụ.
  alternative: Ịsụgharị ya dịka ‘ọ dị ka onye nwụrụ anwụ ma lọghachikwara n’ọnọdụ ime mmụọ ma ọ bụ mmekọrịta.’
  rationale: N’agbanyeghị na okwu nna ahụ bụ ihe atụ maka nlọghachi nwa ya site ná nkewapụ, ederede ahụ kpachaara anya jiri okwu ọnwụ na ndụ siri ike. Idowe ha na-echekwa mgbagwoju na ibu nkà mmụta okpukpe dị n’amaokwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nwa m nwoke a’ chekwaa nkwusi ike nke demonstrative ahụ; e ji ‘ime ememme’ gosipụta ọṅụ nke oriri ahụ n’asụsụ nkịtị.
