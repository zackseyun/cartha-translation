translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị ọrụ ... goro’ kewapụ ndị ọrụ ụgwọ n’ebe ndị ohu nọ; e debekwara ‘achịcha’ dịka ihe okwu Grik kpọrọ kpọmkwem.
