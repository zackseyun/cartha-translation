  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: ig
  text: Ma mgbe ọ matara onwe ya[a], ọ sịrị, “Ole ndị ọrụ nna m goro nwere achịcha karịrị ihe ga-ezuru ha[b], ma mụ onwe m ana m anwụ n’agụụ n’ebe a[c]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe uche ya lọghachiri ya.” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị, “mgbe ọ bịakwutere onwe ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nwere achịcha fọdụrụ afọdụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “agụụ na-egbu m n’ebe a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: mgbe uche ya lọghachiri ya
  rationale: Ọ bụ akpaala okwu Igbo na-egosi na mmadụ malitere iche echiche nke ọma ma ghọta ọnọdụ ya; ọ na-eburu echiche nke ‘ịlọghachikwute onwe ya’ n’enweghị ntụgharị okwu siri ike nghọta.
- source_word: ἔφη
  choice: ọ sịrị
  rationale: Oge aorist dị na akụkọ a dabara n’ụdị okwu gara aga dị mfe n’Igbo.
- source_word: μίσθιοι
  choice: ndị ọrụ ... goro
  rationale: Nke a na-egosi ndị na-arụ ọrụ maka ụgwọ, ọ bụghị ndị ohu bi n’ezinụlọ.
- source_word: περισσεύονται ἄρτων
  choice: nwere achịcha karịrị ihe ga-ezuru ha
  rationale: Ọ na-egosi na achịcha ha nwere bara ụba ruo n’ókè nke na ihe fọdụrụ ga-adị.
- source_word: ἄρτων
  choice: achịcha
  rationale: E debere ihe kpọmkwem okwu Grik kwuru kama ịgbasa ya ka ọ bụrụ naanị ‘nri.’
- source_word: λιμῷ
  choice: agụụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’agụụ siri ike ma ọ bụ ịnwụ n’agụụ, ọ bụghị naanị ọnọdụ ụnwụ n’ala.
- source_word: ὧδε
  choice: n’ebe a
  rationale: Ọ na-eme ka ọdịiche dị n’etiti ọnọdụ ya ugbu a na ọnọdụ ndị ọrụ nna ya pụta ìhè.
- source_word: ἀπόλλυμαι
  choice: na-egbu m
  rationale: Akpaala okwu ‘agụụ na-egbu m’ bụ Igbo nkịtị ma sie ike nke na-egosi na ọ nọ n’ọnọdụ ịla n’iyi ma ọ bụ ịnwụ n’agụụ.
