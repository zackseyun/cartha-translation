  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: ig
  text: Mgbe ụbọchị ole na ole gachara[a], nwa ya nke nta chịkọtara ihe niile o nwere, ọ gara n’ala dị anya. N’ebe ahụ, o mefusịrị ihe onwunwe ya[b], n’ibi ndụ mmefusị[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ọtụtụ ụbọchị na-agafebeghị.” Nke a na-agbasochi usoro okwu Grik anya karịa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “akụ ya” ma ọ bụ “ala ya.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ibi ndụ n’ụzọ aghara aghara.” Ihe odide a ekwughị mmehie ụfọdụ kpọmkwem; ọ na-ekwu maka ụdị ndụ mmefusị.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: Mgbe ụbọchị ole na ole gachara
  rationale: Ọ bụ ụzọ Igbo dị mma isi kwuo na ọtụtụ ụbọchị agafebeghị; ihe odide ala ala peeji na-egosi usoro okwu Grik nke pụtara kpọmkwem ‘mgbe ụbọchị na-adịchaghị ọtụtụ gachara.’
- source_word: συναγαγὼν πάντα
  choice: chịkọtara ihe niile o nwere
  rationale: ‘Chịkọtara’ na-echekwa echiche nke ịchịkọta ihe ọnụ, ebe ‘o nwere’ na-eme ka ihe πάντα na-ezo aka na ya doo anya n’ọnọdụ a n’ebughị ụzọ kwuo kpọmkwem na ọ rere ha.
- source_word: ὁ νεώτερος υἱός
  choice: nwa ya nke nta
  rationale: Nke a bụ okwu Igbo nkịtị maka nwa nke bụ nwata karịa n’etiti ụmụ abụọ ahụ; nnọchiaha ‘ya’ na-ejikọta ya na nna ahụ n’akụkọ ahụ.
- source_word: ἀπεδήμησεν
  choice: gaa
  rationale: N’ihi na ‘n’ala dị anya’ na-esochi ya, ‘gaa’ na-enye echiche njem ahụ n’ụzọ dị mfe ma zere ikwughachi ‘pụọ gaa.’
- source_word: εἰς χώραν μακράν
  choice: n’ala dị anya
  rationale: ‘Ala’ na-anọchi χώρα n’ụzọ sara mbara ma kwekọọ n’akụkọ ahụ; ‘dị anya’ na-echekwa μακράν.
- source_word: διεσκόρπισεν
  choice: mefusịrị
  rationale: N’ebe akụ nọ, ngwaa ahụ pụtara imefusị ma ọ bụ ịla n’iyi ihe mmadụ nwere, ọ bụghị nanị ịgbasa ya n’ụzọ nkịtị.
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: akụ ya
  rationale: ‘Akụ’ nwere ike ịgụnye ihe onwunwe na ego niile o nwere, n’etinyeghị nkọwa karịrị nke οὐσία kwuru.
- source_word: ζῶν ἀσώτως
  choice: site n’ibi ndụ n’akpachapụghị anya
  rationale: Nke a na-egosi ụdị ndụ mere o ji mefusịa akụ ya, ma ọ naghị etinye mmehie pụrụ iche nke amaokwu ahụ na-ekwughị.
theological_decisions:
- issue: Ihe ζῶν ἀσώτως pụtara
  choice: ibi ndụ n’akpachapụghị anya
  alternative: ibi ndụ rụrụ arụ
  rationale: A họọrọ okwu sara mbara nke na-echekwa echiche ndụ enweghị njide onwe onye na imefusị ihe, n’ebughị ụzọ mee ka ọ bụrụ mmehie mmekọahụ ma ọ bụ ụdị mmehie ọzọ kpọmkwem.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ maka ịdị mfe n’ịgụ, ebe njikọ na usoro ihe mere ka dịrị. Akara okwu ala ala peeji niile [a], [b], na [c] dị n’ahịrịokwu bụ isi.
