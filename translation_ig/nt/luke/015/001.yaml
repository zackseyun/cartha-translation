id: LUK.15.1
reference: Luke 15:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸂αὐτῷ ἐγγίζοντες⸃ πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/001.yaml
  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: ig
  text: Ndị ọna ụtụ isi niile na ndị mmehie nọ na-abịaru ya nso ka ha gee ya ntị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-abịa ya nso.” Okwu Grik e ji mee ihe na-egosi omume na-aga n’ihu ma ọ bụ nke na-eme ugboro ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: nọ na-
  rationale: Ihe owuwu a na-edobe ọnọdụ ahụ n’oge gara aga ma na-egosi omume na-aga n’ihu; Igbo ‘nọ na-’ na-egosipụta nke a n'ụzọ ebumpụta ụwa, ebe a na-ahapụghị δέ ka ọ ghọọ okwu oge na-adịghị n'akwụkwọ Grik.
- source_word: αὐτῷ ἐγγίζοντες
  choice: na-abịaru ya nso
  rationale: Nke a na-echekwa echiche ịbịaru onye nso, nakwa omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro nke owuwu Ἦσαν + participle na-egosi.
- source_word: πάντες
  choice: niile
  rationale: ‘Niile’ na-emesi obosara nke ìgwè abụọ ahụ ike ma soro aha ndị ahụ n'ụzọ Igbo kwesịrị ekwesị.
- source_word: οἱ τελῶναι
  choice: ndị ọna ụtụ isi
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-anakọta ụtụ isi, n'enweghị ịgbakwunye nkọwa banyere usoro ọchịchị Rom.
- source_word: οἱ ἁμαρτωλοὶ
  choice: ndị mmehie
  rationale: Nke a na-edebe aha ìgwè ahụ kpọmkwem, n’ebughị ụzọ kọwaa ha dịka ndị a jụrụ ajụ ma ọ bụ ndị ajọ omume a ma ama.
- source_word: ἀκούειν αὐτοῦ
  choice: ka ha gee ya ntị
  rationale: ‘Ka’ na-egosi nzube infinitive ahụ; ‘gee ya ntị’ na-egosipụta ige onye na-ekwu okwu ntị n'ụzọ Igbo dị ndụ ma doo anya.
theological_decisions:
- issue: Mmetụta mmekọrịta mmadụ na okpukpe dị n’okwu ‘ndị ọna ụtụ isi na ndị mmehie’
  choice: E debere ìgwè abụọ ahụ dịka e si kpọọ ha n’akwụkwọ Grik.
  alternative: ndị ọna ụtụ isi na ndị ọzọ ọha mmadụ jụrụ ajụ; ndị ọna ụtụ isi na ndị mmehie a ma ama
  rationale: Ịgbasa nkọwa ahụ ga-etinye nkọwa mmekọrịta mmadụ ma ọ bụ omume nke ihe odide ahụ ekwughị kpọmkwem. Nsụgharị a na-echekwa esemokwu akụkọ na nkà mmụta okpukpe dị n’ebe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Na-abịaru ya nso’ na-echekwa ntakịrị ịdị iche nke okwu Grik, ebe nkọwa ala peeji na-enye ụdị okwu a na-ejikarị ekwu kwa ụbọchị.
