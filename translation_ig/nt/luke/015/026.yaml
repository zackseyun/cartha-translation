  text: And calling one of the servants[a], he asked what these things might be.
translation:
  language: ig
  text: Ọ kpọrọ otu n’ime ndị ohu ahụ ka ọ bịakwute ya, wee jụọ ya ihe ihe ndị a pụrụ ịbụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe nke a nwere ike ịpụta.” N’asụsụ Grik, a sịrị n’ụzọ nkịtị, “ihe ihe ndị a pụrụ ịbụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Ọ kpọrọ ... ka ọ bịakwute ya
  rationale: Nke a na-egosi na ọ kpọrọ onye ahụ ka ọ bịakwute ya tupu ọ jụọ ya ajụjụ, dịka participle aorist middle si dị.
- source_word: παίδων
  choice: ndị ohu
  rationale: Ọ bụ ezie na παῖς nwekwara ike ịpụta nwa, ọnọdụ ụlọ a na-egosi ndị na-eje ozi; ya mere ‘ndị ohu’ bụ ihe dabara adaba ma ghara iduhie onye na-agụ ya.
- source_word: ἐπυνθάνετο
  choice: jụọ ya
  rationale: Nke a bụ okwu Igbo dị mfe ma bụrụkwa nke e ji eme nchọnchọ site n’ịjụ ajụjụ. Imperfect Grik ahụ adịghị mkpa ka a kọwaa ya n'ụzọ pụrụ iche n’ebe a.
- source_word: τί ἂν εἴη ταῦτα
  choice: ihe ihe ndị a pụrụ ịbụ
  rationale: Nke a na-edobe ọtụtụ ihe dị na ταῦτα na echiche nke enweghị nkwubi okwu doro anya dị na ἂν εἴη, kama ịkọwa ya ozugbo dịka ‘ihe nke a pụtara.’
