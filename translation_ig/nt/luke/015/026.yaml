translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. A họọrọ ‘ndị ohu’ dịka okwu ụlọ dabara na ọnọdụ akụkọ ahụ; e debekwara usoro ịkpọ onye ahụ ka ọ bịakwute ya tupu ajụjụ ahụ.
