id: LUK.15.7
reference: Luke 15:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: ig
  text: Ana m agwa unu na, n’otu aka ahụ[a], ọṅụ ga-adị n’eluigwe maka otu onye mmehie na-echegharị karịa maka ndị ezi omume iri itoolu na itoolu[b] ndị na-enweghị mkpa nchegharị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “otu a” ma ọ bụ “ya mere.” Okwu a na-ejikọta ọṅụ dị n’eluigwe na isi ihe dị n’ilu bu ụzọ.
    reason: lexical_alternative
  - marker: b
    text: Ihe odide ahụ kwuru “ndị ezi omume.” N’ọnọdụ okwu a, a pụrụ ịghọta ya dịka ndị ezi omume n’ezie ma ọ bụ dịka okwu e ji mee ihe n’ụzọ ịkwa emo; nsụgharị ahụ ekpebighị nke ọ bụ.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ana m agwa unu
  rationale: Ọ bụ ụzọ Igbo dị ndụ na nke kwụ ọtọ isi chekwaa okwu Jizọs gwara ndị na-ege ya ntị.
- source_word: οὕτως
  choice: n’otu aka ahụ
  rationale: Ọ na-ejikọta ọṅụ dị n’eluigwe na isi ihe dị n’ilu bu ụzọ.
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: a ga-enwe ọṅụ n’eluigwe
  rationale: Ọ na-echekwa ọdịnihu nke ἔσται na ebe ἐν τῷ οὐρανῷ na-egosi, ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: n’ihi otu onye mmehie
  rationale: N’ebe a ἐπί na-egosi onye ma ọ bụ ihe kpatara ọṅụ ahụ; ‘n’ihi’ na-egosipụta nke ahụ n’ụzọ doro anya.
- source_word: μετανοοῦντι
  choice: na-echegharị
  rationale: Ụdị ngwaa na-aga n’ihu na-echekwa present participle ma na-egosi onye mmehie ahụ dị ka onye na-echegharị.
- source_word: ἢ
  choice: karịa
  rationale: N’usoro ntụnyere a, ἢ na-ewebata ihe e ji atụnyere nke mbụ; ‘karịa’ bụ ụzọ Igbo sitere n’okike isi gosipụta ya.
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: ndị ezi omume iri itoolu na itoolu
  rationale: δικαίοις bụ adjective e ji mee aha mmadụ; ‘ndị ezi omume’ na-echekwa okwu ahụ n’akọwaghị ma ọ bụ ezi omume n’ezie ka ọ bụ okwu e ji mee ihe n’ụzọ ịkwa emo.
- source_word: οἵτινες οὐ χρείαν ἔχουσιν μετανοίας
  choice: ndị na-enweghị mkpa nchegharị
  rationale: Ọ na-echekwa nkọwa nke ndị ahụ na aha μετανοίας n’ụzọ Igbo doro anya ma dị mkpirikpi.
theological_decisions:
- issue: Ma ‘ndị ezi omume’ bụ ndị ezi omume n’ezie ka ọ bụ ndị na-ewere onwe ha dị ka ndị ezi omume
  choice: E debere okwu ahụ dịka ‘ndị ezi omume’ n’akwaghị ya akara dịka okwu ịkwa emo.
  alternative: ‘ndị chere na ha bụ ndị ezi omume’
  rationale: Grik kwuru δικαίοις n’enweghị akara pụtara ìhè na ọ bụ okwu ịkwa emo. Nsụgharị ahụ kwesịrị ịhapụ esemokwu nkọwa a ka ọ dị.
- issue: Onye na-enwe ọṅụ n’eluigwe
  choice: E kwuru naanị na ‘a ga-enwe ọṅụ n’eluigwe.’
  alternative: ‘Chineke ga-aṅụrị ọṅụ’ ma ọ bụ ‘ndị mmụọ ozi ga-aṅụrị ọṅụ’
  rationale: Amaokwu a kpọrọ ebe ọṅụ ahụ dị, ma ọ kpọghị kpọmkwem onye na-aṅụrị ọṅụ; ya mere, e tinyeghị onye Grik na-akpọghị aha.
- issue: Ụdị nchegharị a na-ekwu maka ya
  choice: ‘na-echegharị’
  alternative: ‘gbanwere obi ya’
  rationale: ‘Na-echegharị’ bụ okwu Igbo a na-aghọta nke ọma nke na-echekwa ihe okpukpe na omume nke μετανοέω n’enweghị ime ka ọ bụrụ naanị mgbanwe echiche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ana m agwa unu,’ ‘a ga-enwe ọṅụ,’ na ‘na-echegharị’ bụ usoro okwu sitere n’okike; e zere okwu ụka nke otu òtù pụrụ iche.
