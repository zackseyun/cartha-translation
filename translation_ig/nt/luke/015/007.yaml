review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Greek future assertion, the locative ‘in heaven,’ the single sinner characterized by present repentance, the comparative contrast, and the unqualified designation ‘righteous.’ It appropriately does not identify the rejoicing subject or settle whether ‘righteous’ is ironic.
  naturalness: ‘A ga-enwe ọṅụ ... n’ihi ... karịa n’ihi ...’ is understandable, but the comparative is more idiomatic and immediately clear in Standard Igbo when joy is stated as being ‘maka’ one group ‘karịa maka’ the other. ‘N’otu aka ahụ’ is retained as a natural equivalent of οὕτως.
  terminology: ‘Onye mmehie na-echegharị’ and ‘nchegharị’ consistently render μετανοέω/μετάνοια in clear, non-sectarian Standard Igbo. ‘Ndị ezi omume’ correctly preserves δίκαιοι without importing an interpretive qualification.
  issues:
  - severity: low
    issue: Comparative phrasing is slightly awkward
    rationale: The sequence ‘n’ihi ... karịa n’ihi ...’ can be understood, but ‘maka ... karịa maka ...’ is a smoother Standard Igbo expression of the Greek comparison while retaining the same meaning.
  revised_text: Ana m agwa unu na, n’otu aka ahụ[a], ọṅụ ga-adị n’eluigwe maka otu onye mmehie na-echegharị karịa maka ndị ezi omume iri itoolu na itoolu[b] ndị na-enweghị mkpa nchegharị.
