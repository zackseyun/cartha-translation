id: LUK.8.47
reference: Luke 8:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: ig
  text: Ma mgbe nwanyị ahụ hụrụ na ihe o mere ezoghị ezo[a], ọ bịara ka ọ na-ama jijiji, wee daa n’ala n’ihu ya[b], ma n’ihu mmadụ niile kọọrọ ha ihe mere o ji metụ ya aka na otú e si gwọọ ya ozugbo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na a matala ihe o mere,” ma ọ bụ, “na ihe o mere anọgideghị na nzuzo.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “daa n’ala n’ụkwụ ya.” Grik ahụ kwuru “daa n’ihu ya,” ma o kwughị ụkwụ ya kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: mgbe ... hụrụ
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge iji mee ka Igbo bụrụ nke e bu pụta ụwa ma chekwaa usoro akụkọ ahụ.
- source_word: οὐκ ἔλαθεν
  choice: ihe o mere ezoghị ezo
  rationale: Nke a na-egosi na nwanyị ahụ ghọtara na ihe o mere anọgideghị na nzuzo, na-enweghị ịkọ kpọmkwem onye hụrụ ya.
- source_word: τρέμουσα
  choice: ka ọ na-ama jijiji
  rationale: Nke a na-echekwa ma ọnọdụ ahụ ya ma mmetụta uche ya, kama ịkọwa ya naanị dị ka egwu.
- source_word: προσπεσοῦσα αὐτῷ
  choice: daa n’ala n’ihu ya
  rationale: Ọ na-egosi omume ịda n’ihu Jizọs n’arịrịọ ma ọ bụ nsọpụrụ, na-agbakwụnyeghị ‘n’ụkwụ ya,’ nke Grik ekwughị kpọmkwem.
- source_word: δι’ ἣν αἰτίαν
  choice: ihe mere
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke e bu pụta ụwa isi kwuo ihe kpatara omume ahụ.
- source_word: ἥψατο αὐτοῦ
  choice: o ji metụ ya aka
  rationale: ἅπτομαι na genitive pụtara imetụ mmadụ aka; ntụgharị a chekwara ihe ahụ n’ụzọ doro anya.
- source_word: ἀπήγγειλεν
  choice: kọọrọ
  rationale: N’okwu a, ngwaa ahụ pụtara ịkọ ma ọ bụ ime ka ihe mara n’ihu ọha; ‘kọọrọ’ bụ Igbo eke na nghọta.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: mmadụ niile
  rationale: N’ọnọdụ akụkọ a, nke a na-egosi ndị niile nọ ebe ahụ ma chekwaa ọdịdị ọha nke nkwupụta ahụ.
- source_word: ὡς ἰάθη
  choice: otú e si gwọọ ya
  rationale: Nke a na-echekwa ὡς dị ka ‘otú,’ ma jiri usoro passive Igbo na-adịghị akpọ onye mere ọgwụgwọ ahụ aha.
- source_word: παραχρῆμα
  choice: ozugbo
  rationale: ‘Ozugbo’ na-enye echiche nke ọgwụgwọ mere n’otu ntabi anya dịka adverb Grik ahụ si kwuo.
theological_decisions:
- issue: Ụdị nkwupụta nwanyị ahụ n’ihu ọha
  choice: A kọwara naanị na ọ dara n’ala n’ihu ya ma kọọrọ mmadụ niile ihe mere.
  alternative: Ịsị kpọmkwem na o chegharịrị ma ọ bụ fee ya ofufe.
  rationale: Amaokwu Grik ahụ ekwughị nchegharị ma ọ bụ ofufe kpọmkwem. Ọnọdụ ahụ nwere ike igosi nsọpụrụ ma ọ bụ arịrịọ, ma ntụgharị ahụ ekwesịghị itinye nkọwa okpukpe karịrị ihe e dere.
- issue: Onye gwọrọ nwanyị ahụ
  choice: otú e si gwọọ ya
  alternative: otú Jizọs si gwọọ ya
  rationale: Passive ἰάθη ekwughị onye mere ọgwụgwọ ahụ kpọmkwem n’ahịrịokwu a; a hapụrụ ya otú ahụ iji chekwaa usoro isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ ‘daa n’ala n’ihu ya’ kama okwu siri ike ma ọ bụ nke ga-akọwa omume ahụ kpọmkwem dị ka ofufe.
