review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the woman’s realization that her act had not remained concealed, her trembling approach, her falling before Jesus, her public explanation of why she touched him, and her immediate healing. However, the public setting expressed by ἐνώπιον παντὸς τοῦ λαοῦ is better represented explicitly as ‘before all the people’ rather than merely ‘telling everyone.’
  naturalness: The wording is generally clear Standard Igbo. Recasting the sequence of participial actions with ‘wee’ makes the narrative flow more natural and avoids the somewhat abrupt bare coordination ‘ọ bịara ... daa.’
  terminology: ‘metụ ya aka,’ ‘na-ama jijiji,’ and ‘ozugbo’ are appropriate modern Standard Igbo renderings. The passive, agent-unspecified wording ‘e si gwọọ ya’ appropriately avoids supplying an explicit healer not stated in this clause.
  issues:
  - severity: low
    issue: ‘kọọrọ mmadụ niile’ does not explicitly express the locative/public sense of ἐνώπιον παντὸς τοῦ λαοῦ.
    rationale: It can mean that she told every person, whereas the Greek emphasizes that she made her explanation in the presence of all the gathered people. ‘N’ihu mmadụ niile’ preserves this emphasis.
  - severity: low
    issue: The action sequence ‘ọ bịara ka ọ na-ama jijiji, daa n’ala’ is slightly uneven in modern narrative Igbo.
    rationale: Using ‘wee daa’ clearly links the subsequent falling action while retaining the Greek sequence.
  revised_text: Ma mgbe nwanyị ahụ hụrụ na ihe o mere ezoghị ezo[a], ọ bịara ka ọ na-ama jijiji, wee daa n’ala n’ihu ya[b], ma n’ihu mmadụ niile kọọrọ ha ihe mere o ji metụ ya aka na otú e si gwọọ ya ozugbo.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “na a matala ihe o mere,” ma ọ bụ, “na ihe o mere anọgideghị na nzuzo.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “daa n’ala n’ụkwụ ya.” Grik ahụ kwuru “daa n’ihu ya,” ma o kwughị ụkwụ ya kpọmkwem.
    reason: lexical_alternative
  revision_rationale: The revision makes the public-before-the-people element explicit and smooths the connected narrative actions. It retains the source’s ambiguity about the healer and does not add repentance, worship, or other theological interpretation.
