revisions:
- from: Ma mgbe nwanyị ahụ hụrụ na ihe o mere ezoghị ezo[a], ọ bịara ka ọ na-ama jijiji, daa n’ala n’ihu ya[b], ma kọọrọ mmadụ niile ihe mere o ji metụ ya aka na otú e si gwọọ ya ozugbo.
  to: Ma mgbe nwanyị ahụ hụrụ na ihe o mere ezoghị ezo[a], ọ bịara ka ọ na-ama jijiji, wee daa n’ala n’ihu ya[b], ma n’ihu mmadụ niile kọọrọ ha ihe mere o ji metụ ya aka na otú e si gwọọ ya ozugbo.
  rationale: The revision makes the public-before-the-people element explicit and smooths the connected narrative actions. It retains the source’s ambiguity about the healer and does not add repentance, worship, or other theological interpretation.
