- from: Ma Jizọs sịrị, “O nwere onye metụrụ m aka, n’ihi na amaara m na ike esiwo n’ime m pụọ.”
  to: Ma Jizọs sịrị, “Otu onye metụrụ m aka, n’ihi na amatara m na ike esitela n’ime m pụọ.”
  rationale: 'The revision makes two limited linguistic adjustments: it uses a more direct indefinite expression for τις and changes the knowledge verb to a completed past form that better corresponds to ἔγνων. It retains the broad term “ike,” the completed departure of the power, and the source’s ambiguity about how Jesus knew.'
