  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: ig
  text: Ma Jizọs sịrị, “Otu onye metụrụ m aka, n’ihi na amatara m na ike esitela n’ime m pụọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: O nwere onye metụrụ m aka
  rationale: Na-egosipụta onye a na-akpọghị aha (τις) na omume imetụ Jizọs aka n’ụzọ doro anya ma bụrụ Igbo nkịtị.
- source_word: ἔγνων
  choice: amaara m
  rationale: Aorist nke γινώσκω ebe a pụtara ịmata ma ọ bụ ịghọta ihe mere; “amaara m” na-edobe okwu siri ike nke isi mmalite karịa “achọpụtara m” ma ọ bụ “ahụrụ m.”
- source_word: δύναμιν
  choice: ike
  rationale: “Ike” bụ okwu Igbo zuru oke maka δύναμις n’ọnọdụ a, nke na-ezo aka n’ike ọgwụgwọ si n’aka Jizọs.
- source_word: ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: esiwo n’ime m pụọ
  rationale: Perfect participle na-egosi na ike ahụ apụworị, ebe ἀπ’ ἐμοῦ na-egosi na ọ si n’aka/ime Jizọs; ntụgharị a bụ nke okike n’Igbo ma na-edobe ọnọdụ omume ahụ rụpụtara.
theological_decisions:
- issue: Ụdị ihe ọmụma Jizọs kwuru na ya nwere
  choice: amaara m
  alternative: achọpụtara m / aghọtara m
  rationale: 'A hapụrụ okwu ahụ n’ogo nkwupụta isi mmalite: Jizọs maara na ike apụla n’ime ya. A kọwaghị otú o si mara ya, ka a ghara itinye nkọwa banyere ọdịdị ọmụma ya nke amaokwu ahụ ekwughị.'
- issue: Ike si n’ime Jizọs pụọ
  choice: ike esiwo n’ime m pụọ
  alternative: ike ọgwụgwọ esiwo n’ime m pụta
  rationale: Isi mmalite kwuru naanị δύναμις (“ike”), ọ kpọghị ya kpọmkwem “ike ọgwụgwọ.” Ya mere, e debere okwu sara mbara ahụ ka ọnọdụ akụkọ kọwaa ụdị ike ahụ.
translation_notes:
  register: Asụsụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ma” na-eburu δέ, ebe usoro “esiwo … pụọ” na-egosipụta omume mezuru nke ka nwere nsonaazụ. Enweghị akara nkọwa ala peeji n’ihi na ọdịiche ederede ma ọ bụ nghọta chọrọ nkọwa pụrụ iche adịghị n’amaokwu a.
