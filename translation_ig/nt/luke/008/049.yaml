  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: ig
  text: Mgbe ọ ka nọ na-ekwu okwu, otu onye si n’aka onyeisi ụlọ nzukọ[a] bịara, sị, “Nwa gị nwanyị anwụọla; enyela onye ozizi nsogbu ọzọ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu onye si n’ebe onyeisi ụlọ nzukọ nọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “enyekwala onye ozizi nsogbu ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Mgbe ọ ka nọ na-ekwu okwu
  rationale: Nke a na-egosi na ihe abụọ ahụ mere n’otu oge, ma na-echekwa ike nke ἔτι, ‘ka nọ.’
- source_word: ἔρχεταί τις
  choice: otu onye ... bịara
  rationale: τις bụ onye a na-akpọghị aha; a sụgharịrị historic present dị ka oge gara aga ka akụkọ Igbo wee na-aga nke ọma.
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: si n’aka onyeisi ụlọ nzukọ
  rationale: παρά na genitive na-egosi ebe ozi ahụ si; ‘onyeisi ụlọ nzukọ’ na-akọwa ọrụ ἀρχισυνάγωγος n’asụsụ Igbo nke oge a, ebe ‘si n’aka’ anaghị atụkwasị ‘ụlọ’ nke na-adịghị n’ihe odide Grik.
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  choice: Nwa gị nwanyị anwụọla
  rationale: Ụdị perfect nke Τέθνηκεν na-egosi ọnwụ mere nke ọnọdụ ya ka dị; ‘anwụọla’ na-eburu ma ihe mere ma nsonaazụ ya.
- source_word: μηκέτι σκύλλε
  choice: enyela ... nsogbu ọzọ
  rationale: Nke a bụ iwu ka a kwụsị inye nsogbu site ugbu a gaa n’ihu; okwu ahụ bụ nke a na-aghọta ngwa ngwa ma na-edobe ịdị arọ nke ozi ahụ.
- source_word: τὸν διδάσκαλον
  choice: onye ozizi
  rationale: Nke a bụ ihe διδάσκαλος pụtara n’ụzọ nkịtị, n’enweghị ibuli ya gaa n’aha nsọ ma ọ bụ nkwupụta nkà mmụta okpukpe nke amaokwu ahụ ekwughị.
theological_decisions:
- issue: Aha ọrụ ἀρχισυνάγωγος nke metụtara Jaịrọs
  choice: onyeisi ụlọ nzukọ
  alternative: onye na-achị ụlọ nzukọ
  rationale: Ọ bụ aha ọrụ n’ụlọ nzukọ, ọ bụghị ọkwa ụka nke oge e mesịrị; nsụgharị a doro ndị na-agụ Igbo anya.
- issue: Otú e si sụgharịa διδάσκαλος
  choice: onye ozizi
  alternative: nna ukwu
  rationale: Ihe odide Grik ji aha nkịtị maka onye na-akụzi; nhọrọ a anaghị ewebata nghọta Kraịst dị elu nke okwu a n’onwe ya ekwughị, ma ọ dịghịkwa emegide ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Si n’aka’ na-egosi isi iyi nke onye ahụ ma ọ bụ ozi ahụ n’enweghị itinye okwu ‘ụlọ’ na-adịghị na Grik; ‘onye ozizi’ ka e dere dị ka aha ọrụ nkịtị.
