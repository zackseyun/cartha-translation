id: LUK.8.3
reference: Luke 8:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: ig
  text: na Joana[a], nwunye Kuza, onye na-elekọta ihe onwunwe Herọd, na Susana, na ọtụtụ ụmụ nwanyị ndị ọzọ, bụ́ ndị ji ihe ha nwere na-ejere ha ozi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide aka ochie gụrụ “ya” kama “ha.”
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n'ihe onwunwe ha” ma ọ bụ “site n'akụ ha nwere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: nwunye Kuza
  rationale: N'ọnọdụ a, γυνή so aha Joana ma aha nwoke dị na genitive na-esochi ya; ya mere ọ pụtara n'ụzọ kacha kwekọọ na ‘nwunye Kuza.’
- source_word: ἐπιτρόπου Ἡρῴδου
  choice: onye na-elekọta ihe onwunwe Herọd
  rationale: ἐπίτροπος bụ onye e nyere ọrụ ilekọta ihe ma ọ bụ akụ onye ọzọ; nkọwa a doro ndị na-agụ Igbo anya ma kwekọọ n'ọnọdụ ụlọeze Herọd.
- source_word: ἕτεραι πολλαί
  choice: ọtụtụ ụmụ nwanyị ndị ọzọ
  rationale: Ụdị feminine plural na-ezo aka n'ụmụ nwanyị ndị a kpọrọ aha; ikwupụta ‘ụmụ nwanyị’ na-eme ka ntụaka ahụ doo anya n'Igbo.
- source_word: διηκόνουν
  choice: na-ejere ... ozi
  rationale: Nke a na-edobe echiche sara mbara nke διακονέω, bụ́ ijere mmadụ ozi, na-etinyeghị ya n'ọkwa ọrụ ụka pụrụ iche.
- source_word: αὐτοῖς
  choice: ha
  rationale: A gbasoro plural αὐτοῖς dị na SBLGNT, nke na-ezo n'ụzọ kwesịrị ekwesị na Jizọs na ndị ya na ha nọ.
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: ji ihe ha nwere
  rationale: Nkebiokwu a na-egosi na ha ji akụ, ihe onwunwe, ma ọ bụ ego ha nwere akwado ozi ahụ; nsụgharị a bụ nke okike ma doo anya n'Igbo.
theological_decisions:
- issue: Onye αὐτοῖς na-ezo aka na ya
  choice: 'plural: ha na-ejere Jizọs na ndị ya na ha nọ ozi'
  alternative: 'singular: ha na-ejere ya, bụ́ Jizọs, ozi'
  rationale: SBLGNT e nyere nwere αὐτοῖς n'ụdị plural. A hapụrụ ọdịiche akaebe ederede ahụ ka ihe odide ala peeji kọwaa ya kama ịgbanwe isi ihe odide gaa na singular.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E mere ka ụmụ nwanyị bụrụ ndị na-eme omume ahụ n'ụzọ doro anya, ma edobere plural nke isi iyi na obosara ihe okwu διακονέω pụtara.
