  text: Καὶ κατέπλευσαν εἰς τὴν χώραν τῶν ⸀Γερασηνῶν, ἥτις ἐστὶν ἀντιπέρα τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: ig
  text: 'Ha wee jiri ụgbọ mmiri rute n’ógbè ndị Gerasa[a], nke dị n’ofe Galili.


    [a] Ụfọdụ ihe odide aka ochie na akụkọ yiri nke a n’Oziọma ndị ọzọ nwere “ndị Gadara” ma ọ bụ “ndị Gergesa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide aka ochie na akụkọ yiri nke a n’Oziọma ndị ọzọ nwere “ndị Gadara” ma ọ bụ “ndị Gergesa.”
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: jiri ụgbọ mmiri rute
  rationale: Okwu a na-egosi iji mmiri gaa ebe ma rute ebe ahụ. Nhọrọ a na-eme ka ụzọ njem na ọbịbịa doo anya n’Igbo, na-etinyeghị ntụziaka ala nke ọnọdụ a na-achọghị ka e mesie ike.
- source_word: χώραν
  choice: ógbè
  rationale: “Ógbè” na-egosi mpaghara ma ọ bụ ala gbara obodo gburugburu, na-enweghị echiche nke mba nke oge a.
- source_word: Γερασηνῶν
  choice: ndị Gerasa
  rationale: Nke a bụ aha ndị bi na Gerasa ma ọ bụ ndị e ji Gerasa mara; e debere aha ahụ dịka aha mmadụ na ebe, kama ịtụgharị ihe ọ pụtara.
- source_word: ἥτις
  choice: nke
  rationale: “Nke” na-ewebata nkebiokwu na-akọwakwu ógbè ahụ n’ụzọ dị mkpirikpi ma kwekọọ n’Igbo.
- source_word: ἀντιπέρα
  choice: dị n’ofe
  rationale: Nkebiokwu a na-egosi ebe dị n’akụkụ nke ọzọ, n’ofe mmiri site na Galili; “dị n’ofe” bụ okwu Igbo dị mfe ma bụrụkwa nke ziri ezi.
- source_word: Γαλιλαίας
  choice: Galili
  rationale: “Galili” bụ ụdị aha ebe a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Ọdịiche aha ebe n’ihe odide na n’akụkọ Oziọma ndị kwekọrọ
  choice: ndị Gerasa
  alternative: ndị Gadara; ndị Gergesa
  rationale: Isi ihe odide SBLGNT nwere Γερασηνῶν, ya mere isi ederede soro “ndị Gerasa.” E tinyere aha ndị ọzọ n’okpuru peeji iji gosi ọdịiche dị n’ihe odide n’enweghị ime ka akụkọ ndị ahụ bụrụ otu n’amaghị ama.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Jiri ụgbọ mmiri rute” na-ada nke ọma n’Igbo ma na-echekwa echiche njem n’elu mmiri na ọbịbịa; “dị n’ofe Galili” na-enye nkọwa ọnọdụ ala n’enweghị ịgbatị ahịrịokwu.
