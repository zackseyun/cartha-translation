  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: ig
  text: Ma mkpụrụ ahụ dara n’ala ọma—ndị a bụ ndị nụrụ okwu ahụ n’ezi obi na obi ọma, na-ejidesi ya ike, ma jiri ntachi obi na-amị mkpụrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’obi ziri ezi ma dị mma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... ἐν τῇ καλῇ γῇ
  choice: nke ahụ dị n’ala ọma
  rationale: Akụkụ Grik a hapụrụ ihe a na-ekwu maka ya n’ezoghị ọnụ, ebe ihe atụ ahụ na-egosi na ọ bụ mkpụrụ ahụ ka a na-ekwu. Igbo nwere ike idebe ụdị mkpirikpi a n’enweghị mgbagwoju anya, ya mere a hapụghị ‘mkpụrụ’ ka nkọwa ghara ịkarị isi mmalite.
- source_word: καλῇ γῇ
  choice: ala ọma
  rationale: N’ọnọdụ ọrụ ugbo a, γῆ bụ ala a na-akụ ihe; ‘ala ọma’ bụ okwu Igbo doro anya ma na-edobe ọdịiche dị n’etiti ụdị ala ndị ahụ.
- source_word: οὗτοί εἰσιν οἵτινες
  choice: bụ ndị
  rationale: ‘Bụ ndị’ na-egosipụta nke ọma na Jizọs na-akọwa ndị ihe ahụ nọchiri anya, ma ọ bụkwa usoro okwu Igbo dị mfe ma bụrụ nke ebumpụta ụwa.
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: ji ezi obi dị mma
  rationale: ‘Ezi obi dị mma’ na-egosi àgwà ime mmadụ nke ọma ma na-edobe otuto abụọ dị n’okwu Grik. Ọ naghị amachi ‘obi’ naanị n’ikwu eziokwu, ma ọ bụ kpebie otú obi dị otú ahụ si malite.
- source_word: ἀκούσαντες τὸν λόγον
  choice: nụrụ okwu ahụ
  rationale: Okwu a na-egosi na ịnụ okwu ahụ buru ụzọ mee tupu ijidesi ya ike na ịmị mkpụrụ. ‘Okwu ahụ’ na-ezo aka n’ozi e kwuburu maka ya n’ihe atụ ahụ.
- source_word: κατέχουσιν
  choice: jidesie ya ike
  rationale: ‘Jidesie ya ike’ na-egosi idebe okwu ahụ nke ọma na ịghara ịhapụ ya, karịa nanị inwe ya.
- source_word: καρποφοροῦσιν
  choice: na-amị mkpụrụ
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo ịmị mkpụrụ, ma ọ na-edobe ma ihe oyiyi ọrụ ugbo ma ihe ọ pụtara n’ụzọ atụ.
- source_word: ἐν ὑπομονῇ
  choice: jiri ntachi obi
  rationale: ὑπομονή na-egosi nkwụsi ike na ịnọgide n’agbanyeghị ihe isi ike. ‘Ntachi obi’ bụ okwu Igbo a na-aghọta nke ọma maka àgwà a.
theological_decisions:
- issue: Nkọwa omume nke obi na-anabata okwu ahụ
  choice: ji ezi obi dị mma
  alternative: ji obi ziri ezi ma dị mma
  rationale: Nsụgharị ahụ na-edobe otuto abụọ e nyere ọnọdụ ime ndị na-anụ okwu ahụ, ma ọ naghị etinye ozizi banyere ma ịdị mma ahụ ò sitere n’ọmụmụ mmadụ, n’ịmụ ọzọ, ma ọ bụ n’uru mmadụ rụtara.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ na-agbaso okwu Igbo ebumpụta ụwa, ebe a na-edobe ihe oyiyi nke ala na ịmị mkpụrụ, yana mgbagwoju okwu ziri ezi nke isi mmalite.
