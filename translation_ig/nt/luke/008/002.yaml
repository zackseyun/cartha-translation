revisions:
- from: 'na ụfọdụ ụmụ nwanyị a gwọrọla n’aka mmụọ ọjọọ na ọrịa dị iche iche: Meri, onye a na-akpọ Magdalin, onye mmụọ ọjọọ asaa si n’ime ya pụtaala,'
  to: 'na ụfọdụ ụmụ nwanyị ndị a napụtarala n’aka mmụọ ọjọọ, ndị a gwọworokwa ọrịa: Meri, onye a na-akpọ Magdalin, bụ onye ndị mmụọ ọjọọ asaa si n’ime ya pụọlarị,'
  rationale: The revision preserves the source’s pluperfect sense with -rala/-worola and its distinction between evil spirits and illnesses, while using idiomatic Igbo constructions suited to each. It also preserves the designation “called Magdalene” and the statement that seven demons had already departed from Mary. No footnote is necessary, since the English alternatives do not represent a material ambiguity requiring an Igbo note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:37:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the indefinite group of women, the prior completed state of healing, the distinction between evil spirits and illnesses, Mary’s identifying designation, and the seven demons’ prior departure. However, “a gwọrọla n’aka mmụọ ọjọọ na ọrịa” makes the instrumental/rescue expression n’aka govern illnesses as well, which is not idiomatic or precise Igbo. The final clause also needs a clearer antecedent construction for Mary.
  naturalness: 'The revised wording uses natural Standard Igbo: being delivered from evil spirits is expressed with “a napụtarala n’aka,” while healing from illnesses is expressed separately with “a gwọworola ọrịa.” “bụ onye” makes the relative clause concerning Mary unambiguous.'
  terminology: “Mmụọ ọjọọ” appropriately renders πνευμάτων πονηρῶν. “Ndị mmụọ ọjọọ asaa” retains the personal demonic sense of δαιμόνια and avoids reducing it to illness. “Magdalin” is retained as an established Igbo form of Magdalene.
  issues:
  - severity: medium
    issue: The phrase “a gwọrọla n’aka mmụọ ọjọọ na ọrịa dị iche iche” attaches n’aka (“from the hand/power of”) to both evil spirits and illnesses.
    rationale: In Standard Igbo, n’aka naturally expresses deliverance from the power of personal agents, but it is awkward with ọrịa. The Greek coordinates two distinct sources/afflictions; the Igbo should express deliverance from spirits and healing from illnesses separately.
  - severity: low
    issue: “Meri, onye a na-akpọ Magdalin, onye mmụọ ọjọọ asaa si n’ime ya pụtaala” is repetitive and leaves the relationship of the final relative clause less smooth.
    rationale: Using “bụ onye” after the identifying designation gives a clear, natural link to Mary while preserving the Greek sense.
  revised_text: 'na ụfọdụ ụmụ nwanyị ndị a napụtarala n’aka mmụọ ọjọọ, ndị a gwọworokwa ọrịa: Meri, onye a na-akpọ Magdalin, bụ onye ndị mmụọ ọjọọ asaa si n’ime ya pụọlarị,'
  revised_footnotes: []
  revision_rationale: The revision preserves the source’s pluperfect sense with -rala/-worola and its distinction between evil spirits and illnesses, while using idiomatic Igbo constructions suited to each. It also preserves the designation “called Magdalene” and the statement that seven demons had already departed from Mary. No footnote is necessary, since the English alternatives do not represent a material ambiguity requiring an Igbo note.
