id: LUK.8.2
reference: Luke 8:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: ig
  text: 'na ụfọdụ ụmụ nwanyị ndị a napụtarala n’aka mmụọ ọjọọ, ndị a gwọworokwa ọrịa: Meri, onye a na-akpọ Magdalin, bụ onye ndị mmụọ ọjọọ asaa si n’ime ya pụọlarị,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: ụfọdụ ụmụ nwanyị
  rationale: τινες na-egosi otu akụkụ a na-akọwaghị kpọmkwem; ‘ụfọdụ ụmụ nwanyị’ bụ Igbo nkịtị ma doo anya.
- source_word: τεθεραπευμέναι
  choice: a gwọrọla
  rationale: Ụdị perfect passive ya na ἦσαν na-egosi ọgwụgwọ mere tupu mgbe ahụ nke nsonaazụ ya ka dị; ‘a gwọrọla’ na-eburu echiche ahụ.
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: n’aka mmụọ ọjọọ
  rationale: N’Igbo, ‘ịgwọ mmadụ n’aka’ ihe na-ekwupụta nnapụta pụọ n’ike ma ọ bụ nsogbu ya n’ụzọ sitere n’okike; ‘mmụọ ọjọọ’ na-asụgharị πνεύματα πονηρά ozugbo.
- source_word: καὶ ἀσθενειῶν
  choice: na ọrịa dị iche iche
  rationale: ἀσθένειαι ebe a bụ ọrịa ma ọ bụ adịghị ike anụ ahụ; ‘ọrịa dị iche iche’ na-egosi plural ahụ n’Igbo doro anya.
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: onye a na-akpọ Magdalin
  rationale: Nke a na-edebe ọrụ participle ahụ dịka aha e ji amata Meri, n’asụsụ Igbo dị mfe ma kwụ ọtọ.
- source_word: ἀφ’ ἧς
  choice: onye ... si n’ime ya
  rationale: Nhazi a bụ ụzọ Igbo sitere n’okike isi gosi isi mmalite ma ọ bụ nkewapụ nke ἀπό na-egosi, karịsịa mgbe ihe si n’ime mmadụ pụta.
- source_word: δαιμόνια ἑπτὰ
  choice: mmụọ ọjọọ asaa
  rationale: ‘Mmụọ ọjọọ’ bụ okwu Igbo ndị nkịtị ghọtara maka ndị mmụọ ọjọọ; ọnụọgụ asaa ka e debere n’enweghị mgbanwe.
- source_word: ἐξεληλύθει
  choice: pụtaala
  rationale: Pluperfect ahụ na-egosi na ha apụworị tupu ọnọdụ akụkọ a; ‘pụtaala’ na njikọ ahịrịokwu ahụ na-ekwupụta ihe ahụ merela ma nsonaazụ ya ka dị.
theological_decisions:
- issue: Okwu gbasara ahụhụ sitere n’aka ndị mmụọ ọjọọ
  choice: E debere mmụọ ọjọọ na ọrịa dịka ụdị ahụhụ abụọ e kwuru iche.
  alternative: Ịkọwa okwu ndị mmụọ ahụ naanị dịka ihe atụ nke ọrịa uche ma ọ bụ ọrịa anụ ahụ.
  rationale: Grik ahụ kewara πνεύματα πονηρά na δαιμόνια n’otu akụkụ, na ἀσθένειαι n’akụkụ ọzọ. Nsụgharị ahụ echekwala ọdịiche a n’etinyeghị nkọwa okwukwe ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Magdalin’ mee aha njirimara Meri nke Magdala. Enweghị akara nkọwa ala peeji n’ihi na ụzọ ndị ọzọ e nyere n’English anaghị eweta ọdịiche bara uru nke chọrọ nkọwa na Igbo.
