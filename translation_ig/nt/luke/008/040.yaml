  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: ig
  text: 'Mgbe Jizọs lọghachiri, ìgwè mmadụ ahụ nabatara ya[a], n’ihi na ha niile nọ na-eche ya.[b]


    [a] Ma ọ bụ, “ìgwè mmadụ ahụ natara ya.” Okwu Grik ahụ nwere ike ịpụta ịnata mmadụ ma ọ bụ iji ihu ọma nabata ya; n’ebe a, ọ na-egosi nnabata ọma.


    [b] Ma ọ bụ, “n’ihi na ha niile nọ na-atụ anya ọbịbịa ya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ìgwè mmadụ ahụ natara ya.” Okwu Grik ahụ nwere ike ịpụta ịnata mmadụ ma ọ bụ iji ihu ọma nabata ya; n’ebe a, ọ na-egosi nnabata ọma.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi na ha niile nọ na-atụ anya ọbịbịa ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν
  choice: Mgbe ... lọghachiri
  rationale: Usoro ἐν tinyere infinitive nwere article na-egosi oge; “Mgbe ... lọghachiri” bụ okwu Igbo doro anya ma kwekọọ na mmegharị akụkọ ahụ. A naghị atụgharị δέ iche n’ebe a ka ahịrịokwu ghara ịdị arọ.
- source_word: ὑποστρέφειν
  choice: lọghachiri
  rationale: Ọ na-egosi ịlaghachi ma ọ bụ ịbịa azụ; “lọghachiri” bụ okwu Igbo nkịtị ma dabara n’ihe omume a.
- source_word: ἀπεδέξατο
  choice: nabatara ya
  rationale: N’ebe a, ngwaa ahụ na-egosi ịnata mmadụ n’ụzọ dị mma. “Nabatara ya” na-enye echiche nnabata ahụ n’enweghị ịgbakwụnye na ha ji ọṅụ mee ya.
- source_word: ὁ ὄχλος
  choice: ìgwè mmadụ ahụ
  rationale: Nke a na-egosi ọtụtụ mmadụ gbakọrọ ọnụ; “ìgwè mmadụ ahụ” bụ nsụgharị Igbo doro anya ma dị ugbu a.
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: n’ihi na ha niile nọ na-eche ya
  rationale: γάρ na-enye ihe mere ha ji nabata ya, ebe usoro ngwaa ahụ na-egosi na nchere ahụ nọ na-aga n’ihu. “Ha niile” na-edebe nkwusi ike dị na πάντες.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: E ji ụdị aha a a na-ejikarị ede aha Jizọs n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị mfe, nke ugwu ya dịkwa mma. Ahịrịokwu ahụ na-agụ nke ọma nye ndị na-agụ Igbo taa, ma ọ na-edebe echiche oge, ihe kpatara nnabata ahụ, na nkwusi ike na mmadụ niile nọ na-eche Jizọs.
