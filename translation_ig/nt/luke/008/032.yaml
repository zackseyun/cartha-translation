  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: ig
  text: E nwere otu nnukwu ìgwè ezì na-ata nri n'ebe ahụ n'ugwu ahụ[a]. Ha rịọrọ ya nke ukwuu ka o kwe ka ha baa n'ime ezì ndị ahụ[b], o wee kwe ka ha baa n'ime ezì ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ná mkpọda ugwu ahụ.”
    reason: lexical_alternative
  - marker: b
    text: “Ha” na-ezo aka ná ndị mmụọ ọjọọ, ma ọ bụ ndị mmụọ na-adịghị ọcha, ndị a kpọtụrụ aha n'amaokwu ndị gbara nke a gburugburu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: otu nnukwu ìgwè ezì
  rationale: “Ìgwè ezì” bụ ụzọ Igbo doro anya si egosi otu ìgwè anụmanụ ndị a; “nnukwu” na-egosi na ha dị ọtụtụ, dị ka ἱκανῶν si pụta n'ọnọdụ a.
- source_word: βοσκομένη
  choice: na-ata nri
  rationale: Nke a na-akọ ihe ìgwè ezì ahụ nọ na-eme, n'ụzọ Igbo nkịtị ma doo anya.
- source_word: ἐν τῷ ὄρει
  choice: n'ugwu ahụ
  rationale: Nke a na-esochi ὄρος anya nke ọma, n'ebughị ụzọ kpebie na ọ bụ kpọmkwem ná mkpọda ugwu.
- source_word: παρεκάλεσαν
  choice: rịọrọ ya nke ukwuu
  rationale: Nkebiokwu a na-egosi arịrịọ siri ike karịa nanị “rịọ,” ma bụrụkwa Igbo nkịtị.
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: kwe ka / kwe
  rationale: Iji otu ngwaa n'arịrịọ na n'azịza ahụ na-echekwa njikọ dị n'etiti ụdị abụọ nke ngwaa Grik.
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: baa n'ime ezì ndị ahụ
  rationale: Nke a na-egosipụta ma echiche ịbanye n'ime ha ma okwu nrụtụ aka ἐκείνους n'ụzọ doro anya.
- source_word: δὲ / καὶ
  choice: E nwere …; … o wee
  rationale: A sụgharịghị δὲ dịka okwu oge na-adịghị na isi mmalite; usoro ahịrịokwu na “o wee” na-eburu njikọ akụkọ ahụ n'Igbo eke.
theological_decisions:
- issue: Onye “ha” na-ezo aka na ya n'okwu “Ha rịọrọ ya”
  choice: A hapụrụ ya dịka “Ha,” dịka ngwaa Grik nke nọ n'ụdị ọtụtụ si mee.
  alternative: “Ndị mmụọ ọjọọ ahụ rịọrọ ya”
  rationale: Ọnọdụ amaokwu ndị gbara ya gburugburu na-egosi na ọ bụ ndị mmụọ ọjọọ/mmụọ na-adịghị ọcha, ma amaokwu a n'onwe ya ekwughị aha ha ọzọ. Ịhapụ “Ha” na-echekwa nhịahụ nke isi mmalite.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ezì” na “ìgwè” kama okwu ochie ma ọ bụ okwu mpaghara; a hapụrụ isiokwu ọtụtụ “Ha” dịka o siri dị na Grik, ebe nkọwa dị n'okpuru na-eme ka onye ọ na-ezo aka na ya doo anya.
