review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the herd, its feeding on the mountain, the urgent request, entry into the pigs, and Jesus' granting of permission. The plural subject remains appropriately implicit, as in the Greek and its context.
  naturalness: Most wording is clear Standard Igbo. However, “o wee kwe ha” is not as natural or as explicit as the preceding request construction. Repeating “kwe ka ha baa n'ime ezì ndị ahụ” gives an idiomatic, unambiguous completion of the Greek's ellipted final clause.
  terminology: “Ìgwè ezì,” “na-ata nri,” “ugwu,” and “ndị mmụọ ọjọọ / ndị mmụọ na-adịghị ọcha” are suitable contemporary Standard Igbo choices. The footnote preserves the contextual identification without making it part of the verse's explicit subject.
  issues:
  - severity: low
    issue: The final clause “o wee kwe ha” is stylistically incomplete/less idiomatic in this context.
    rationale: Although understandable, Igbo naturally expresses granting this particular request with “kwe ka ...” followed by the requested action. The Greek permits ellipsis, but explicit repetition is safer and clearer in the target language.
  revised_text: E nwere otu nnukwu ìgwè ezì na-ata nri n'ebe ahụ n'ugwu ahụ[a]. Ha rịọrọ ya nke ukwuu ka o kwe ka ha baa n'ime ezì ndị ahụ[b], o wee kwe ka ha baa n'ime ezì ndị ahụ.
