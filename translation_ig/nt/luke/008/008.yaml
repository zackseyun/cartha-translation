revisions:
- from: Mkpụrụ ọzọ dakwara n’ala ọma[a]; mgbe o pulitere, ọ mịrị mkpụrụ okpukpu otu narị[b]. Mgbe ọ na-ekwu ihe ndị a, o weliri olu kwuo, “Onye nwere ntị ịnụ ihe[c], ya nụrụ.”
  to: Mkpụrụ ọzọ dakwara n’ala ọma[a]; mgbe o tochara, ọ mịrị mkpụrụ okpukpu otu narị[b]. Mgbe ọ na-ekwu ihe ndị a, o weliri olu kwuo, “Onye nwere ntị ịnụ ihe[c], ya nụrụ.”
  rationale: The revision replaces the overly specific growth term with “mgbe o tochara,” which better reflects the aorist participle φυέν and its prior sequence to yielding fruit. It also replaces the inaccurate footnote b with a clear, faithful alternative expression for “a hundredfold.” No theological or interpretive change is made.
