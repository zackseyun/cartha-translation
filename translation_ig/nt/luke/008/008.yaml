id: LUK.8.8
reference: Luke 8:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: ig
  text: Mkpụrụ ọzọ dakwara n’ala ọma[a]; mgbe o tochara, ọ mịrị mkpụrụ okpukpu otu narị[b]. Mgbe ọ na-ekwu ihe ndị a, o weliri olu kwuo, “Onye nwere ntị ịnụ ihe[c], ya nụrụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ezi ala.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ mịrị mkpụrụ ruru okpukpu otu narị.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Onye ọ bụla nwere ntị ịnụ ihe, ya nụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: Mkpụrụ ọzọ
  rationale: Ụdị nnọchiaha a na-ezo aka ná mkpụrụ ọzọ n’usoro ilu ahụ; itinye ‘mkpụrụ’ n’Igbo na-eme ka ihe ọ na-ezo aka na ya doo anya n’enweghị mgbanwe n’echiche.
- source_word: γῆν τὴν ἀγαθήν
  choice: n’ala ọma
  rationale: N’ilu ọrụ ugbo a, ‘ala ọma’ na-egosi ala kwesịrị ekwesị mkpụrụ ga-eto na ya, ma bụrụkwa okwu Igbo dị mfe ma bụrụ ihe a na-ejikarị eme ihe.
- source_word: φυὲν
  choice: mgbe o pulitere
  rationale: Nke a na-egosi na mkpụrụ ahụ buru ụzọ puo ma too tupu ya amịa mkpụrụ, ma na-asụkwa nke ọma n’Igbo.
- source_word: ἐποίησεν καρπὸν
  choice: ọ mịrị mkpụrụ
  rationale: ‘Ịmị mkpụrụ’ bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na ihe ọkụkụ rụpụtara mkpụrụ.
- source_word: ἑκατονταπλασίονα
  choice: okpukpu otu narị
  rationale: Nke a na-edobe echiche nke mkpụrụ ruru ugboro otu narị karịa nke a kụrụ.
- source_word: ταῦτα λέγων
  choice: Mgbe ọ na-ekwu ihe ndị a
  rationale: Ọ na-egosi na ikwu ihe ndị ahụ na iweli olu mere n’otu oge, dịka participle dị na Grik si dị.
- source_word: ἐφώνει
  choice: o weliri olu kwuo
  rationale: Nke a na-egosi okwu e kwuru n’olu dara ụda ma sie ike, n’enweghị ikwubiga ụda okwu ahụ ókè.
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: Onye nwere ntị ịnụ ihe
  rationale: ‘Onye’ na-edobe onye otu ahụ nke na-anọchi anya mmadụ ọ bụla, n’enweghị ime ka okwu ahụ bụrụ naanị maka nwoke.
- source_word: ἀκουέτω
  choice: ya nụrụ
  rationale: Nke a na-edobe iwu onye nke atọ, otu onye, nke na-akpọ onye ahụ òkù ka ọ nụ ma ṅaa ntị.
theological_decisions:
- issue: Asụsụ na-anọchi anya mmadụ niile n’okwu agbamume Jizọs
  choice: Onye nwere ntị ịnụ ihe
  alternative: Nwoke nwere ntị ịnụ ihe
  rationale: Articular participle Grik na-anọchi anya onye ọ bụla, ọ bụghị nwoke kpọmkwem; ‘onye’ na-edobe otu onye ahụ ma ghara itinye nkọwa gbasara okike mmadụ nke isi mmalite na-ekwughị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ usoro ilu ọrụ ugbo ahụ na agbamume ikpeazụ ka ha nwee ike na ihe omimi ha nwere n’isi mmalite, n’etinyeghị nkọwa ụka ọ bụla.
