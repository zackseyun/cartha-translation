review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the sequence of another seed falling in good soil, growing, yielding a hundredfold, and Jesus’ emphatic concluding exhortation. However, “mgbe o pulitere” is narrower than φυέν: it specifically foregrounds sprouting, whereas the Greek denotes having grown. “Mgbe o tochara” more directly preserves the completed growth before the yield.'
  naturalness: The prose is clear, idiomatic Standard Igbo, and the solemn direct address is natural. “O weliri olu kwuo” suitably conveys the public, emphatic sense of ἐφώνει.
  terminology: “Ala ọma,” “mịrị mkpụrụ,” and “Onye nwere ntị ịnụ ihe” are suitable, comprehensible renderings. The existing note b is not a sound literal explanation of ἑκατονταπλασίονα and should be replaced with an accurate alternative phrasing.
  issues:
  - severity: low
    issue: “mgbe o pulitere” renders growth as sprouting.
    rationale: φυέν refers to having grown; sprouting is one stage of growth but is more specific than the Greek. “Mgbe o tochara” retains the temporal sequence without narrowing the image.
  - severity: medium
    issue: Footnote b gives an inaccurate/unnatural purported literal rendering.
    rationale: “ọ mịrị mkpụrụ otu narị n’otu” does not clearly express “a hundredfold” in Igbo. An alternative such as “ọ mịrị mkpụrụ ruru okpukpu otu narị” accurately states the abundant yield.
  revised_text: Mkpụrụ ọzọ dakwara n’ala ọma[a]; mgbe o tochara, ọ mịrị mkpụrụ okpukpu otu narị[b]. Mgbe ọ na-ekwu ihe ndị a, o weliri olu kwuo, “Onye nwere ntị ịnụ ihe[c], ya nụrụ.”
