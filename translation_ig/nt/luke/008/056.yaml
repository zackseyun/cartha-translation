  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: ig
  text: O juru ndị mụrụ ya anya nke ukwuu[a]; ma ọ nyere ha iwu[b] ka ha ghara ịgwa onye ọ bụla ihe merenụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha tụrụ nnọọ n'anya” ma ọ bụ “o gbara ha gharịị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “nyere ha ntụziaka” ma ọ bụ “nyere ha iwu siri ike.”
    reason: lexical_alternative
  - marker: c
    text: N'ụzọ nkịtị, “ihe ahụ nke merela” ma ọ bụ “ihe omume ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: ju anya nke ukwuu
  rationale: N'ọnọdụ a, ngwaa ahụ na-egosi na ihe merenụ juru ha anya nke ukwuu. Okwu a bụ Igbo nkịtị ma na-edobe ịdị ike nke mmeghachi omume ahụ.
- source_word: γονεῖς
  choice: nne na nna
  rationale: Nke a bụ ụzọ Igbo kacha doo anya ma bụrụkwa nke e ji ekwu ndị mụrụ nwa.
- source_word: παρήγγειλεν
  choice: gwara ha hoo haa
  rationale: Nke a na-egosi na ọ bụghị naanị aro ka o nyere ha, kama na ọ nyere ha ntụziaka siri ike, n'ebughị ụzọ mee ka ụda okwu ahụ sie ike karịa isi mmalite.
- source_word: μηδενὶ
  choice: onye ọ bụla ... ghara
  rationale: Ụdị a bụ ụzọ ebumpụta ụwa e si kwuo mmachibido zuru ezu n'Igbo.
- source_word: εἰπεῖν
  choice: ịgwa
  rationale: Ebe e nwere onye a ga-agwa ihe ahụ, ‘ịgwa’ dabara karịa ‘ikwu’ n'Igbo.
- source_word: τὸ γεγονός
  choice: ihe ahụ merenụ
  rationale: Nke a na-egosi ihe ahụ mezuru ma na-edobe ntụaka kpọmkwem nye ihe omume ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche dị n'etiti oke iju anya ndị mụrụ ya na ntụziaka Jizọs nyere ha.
theological_decisions:
- issue: Ihe a na-akpọ nzuzo banyere Mesaịa / ókè ntụziaka Jizọs ruru
  choice: A sụgharịrị ya dị ka ntụziaka ka ha ghara ịgwa onye ọ bụla ihe merenụ.
  alternative: Ịkọwa ya dị ka iwu nzuzo ọha siri ike metụtara isiokwu nzuzo Mesaịa, ma ọ bụ dịka ntụziaka nwa oge e nyere naanị ụfọdụ mmadụ.
  rationale: Amaokwu ahụ ekwughị ihe kpatara iwu ahụ ma ọ bụ ogologo oge ọ ga-adị; ya mere nsụgharị ahụ etinyeghị nkọwa nkà mmụta okpukpe na-adịghị n'ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. ‘Nne na nna’ dị eke karịa okwu mkpokọta maka ndị mụrụ nwa; ‘gwara ha hoo haa’ na-edobe ike ntụziaka ahụ n'emeghị ka ọ bụrụ okwu ike gabigara ókè.
