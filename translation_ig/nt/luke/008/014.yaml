revisions:
- from: Ma mkpụrụ ahụ nke dara n’etiti ogwu—ndị a bụ ndị nụrụ okwu ahụ; ma ka ha na-aga n’ihu, nchegbu[a], akụ na ụba, na ihe ụtọ nke ndụ na-akpagbu ha, ha adịghịkwa amị mkpụrụ ruo mgbe ọ chara nke ọma.[b]
  to: Ma mkpụrụ ahụ nke dara n’etiti ogwu—ndị a bụ ndị nụrụ okwu ahụ; ma ka ha na-aga n’ihu, nchegbu[a], akụ na ụba, na ihe ụtọ nke ndụ na-akpagbu ha, ha anaghịkwa amị mkpụrụ ruo ntozu oke.[b]
  rationale: The revision clarifies the mature-fruit clause while retaining the agricultural metaphor and the Greek ambiguity about the hearers’ ultimate spiritual state. It also makes the first footnote’s alternative phrasing natural and grammatically complete in Standard Igbo.
