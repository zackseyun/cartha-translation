id: LUK.8.14
reference: Luke 8:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: ig
  text: Ma mkpụrụ ahụ nke dara n’etiti ogwu—ndị a bụ ndị nụrụ okwu ahụ; ma ka ha na-aga n’ihu, nchegbu[a], akụ na ụba, na ihe ụtọ nke ndụ na-akpagbu ha, ha anaghịkwa amị mkpụrụ ruo ntozu oke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ihe na-enye ha nsogbu n’obi” ma ọ bụ “ihe ndị ha na-echegbu onwe ha banyere ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ha anaghị amị mkpụrụ chara acha” ma ọ bụ “ha anaghị eme ka mkpụrụ ruo ntozu oke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... πεσόν
  choice: mkpụrụ ahụ nke dara
  rationale: Ọ bụ ezie na okwu Grik ahụ ekwughị ‘mkpụrụ’ ọzọ n’amaokwu a, ọ na-ezo aka ná mkpụrụ e kwuru okwu ya n’ilu ahụ. Ịkpọ ya ‘mkpụrụ ahụ’ na-eme ka Igbo doo anya ma ghara ịgbanwe ihe ọ na-ezo aka na ya.
- source_word: ἀκάνθας
  choice: ogwu
  rationale: ‘Ogwu’ bụ okwu Igbo dị nkenke ma bụrụkwa nke a na-aghọta nke ọma maka osisi ogwu ndị gbara mkpụrụ ahụ gburugburu.
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: ndị a bụ ndị nụrụ okwu ahụ
  rationale: ‘Ndị nụrụ’ na-egosipụta omume ahụ e mere; agbakwunyere ‘okwu ahụ’ dị ka ihe a ghọtara site n’ilu ahụ iji mee ka ahịrịokwu Igbo zuo oke ma doo anya.
- source_word: ὑπὸ μεριμνῶν
  choice: nchegbu
  rationale: ‘Nchegbu’ gụnyere echiche nke ihe na-enye mmadụ nsogbu n’obi ma ọ bụ na-eme ka ọ na-echegbu onwe ya.
- source_word: πλούτου
  choice: akụ na ụba
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo akụnụba ma ọ bụ nnukwu ihe onwunwe.
- source_word: ἡδονῶν τοῦ βίου
  choice: ihe ụtọ nke ndụ
  rationale: Nke a na-echekwa ọtụtụ ihe ụtọ ndị a na-ekwu maka ha ma na-egosi na ha bụ ihe ụtọ nke ndụ mmadụ n’ụwa.
- source_word: πορευόμενοι
  choice: ka ha na-aga n’ihu
  rationale: Okwu a na-egosi usoro na-aga n’ihu. Nsụgharị a bụ Igbo nkịtị, ma ọ naghị amanye ya ka ọ bụrụ nanị njem nkịtị ma ọ bụ nkọwa zuru ezu banyere ndụ mmadụ.
- source_word: συμπνίγονται
  choice: na-akpagbu ha
  rationale: ‘Na-akpagbu ha’ na-egosi na ihe ndị ahụ na-anyịgbu ma na-egbochi uto ha, na-ejigide isi ihe dị n’onyonyo osisi ahụ n’ụzọ ndị na-agụ Igbo ga-aghọta.
- source_word: οὐ τελεσφοροῦσιν
  choice: ha adịghịkwa amị mkpụrụ ruo mgbe ọ chara nke ọma
  rationale: Nke a na-echekwa ma onyonyo nke ịmị mkpụrụ ma echiche nke mkpụrụ ahụ erughị ntozu oke.
theological_decisions:
- issue: Ụdị ọdịda nke ndị nụrụ okwu n’ala ogwu
  choice: E chekwara onyonyo nke ịbụ ndị a na-akpagbu na nke enweghị mkpụrụ chara nke ọma, n’enweghị ikpebi ọnọdụ ime mmụọ ikpeazụ ha.
  alternative: Ịkọwa ha kpọmkwem dị ka ndị a na-amụbeghị ọzọ, ndị kwere ekwe ma ghọọ ndị na-adịghị amị mkpụrụ, ma ọ bụ ndị dapụrụ n’okwukwe.
  rationale: Amaokwu ahụ na-akọ ihe nchegbu, akụ na ụba, na ihe ụtọ nke ndụ mere ha, ma ọ naghị edozi n’onwe ya arụmụka gbasara nzọpụta, nnọgidesi ike, ma ọ bụ ịdapụ n’okwukwe.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro ihe atọ—nchegbu, akụ na ụba, na ihe ụtọ nke ndụ—nakwa onyonyo ọrụ ugbo nke ogwu na mkpụrụ na-etozughị oke.
