id: LUK.8.25
reference: Luke 8:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị ha, “Olee ebe okwukwe unu dị[a]?” Ụjọ jidere ha, o jukwara ha anya. Ha wee na-asị ibe ha, “Ònyezi ka onye a bụ, ebe ọ bụ na ọ na-enye ọbụna ifufe na mmiri iwu, ha ana-eruberekwa ya isi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Olee ebe ntụkwasị obi unu dị?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: Olee ebe ... dị
  rationale: Nke a na-edobe ajụjụ banyere ebe ma ọ bụ ịdị adị nke okwukwe ha, kama ịkọwa ya n'ụzọ sara mbara dị ka, ‘Gịnị mere unu enweghị okwukwe?’
- source_word: πίστις
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ okwu Igbo a na-ejikarị akọwa πίστις; n’ebe a ọ gụnyekwara echiche nke ịtụkwasị Jizọs obi n’etiti ihe ize ndụ.
- source_word: φοβηθέντες
  choice: Ụjọ jidere ha
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma doo anya isi gosipụta na ha tụrụ egwu tupu e kwuo na ihe ahụ juru ha anya.
- source_word: ἐθαύμασαν
  choice: o jukwara ha anya
  rationale: Ọ na-egosipụta ịtụnanya na oke ihe ijuanya nke θαυμάζω n’Igbo nkịtị ma dị ùgwù.
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: Ònyezi ka onye a bụ
  rationale: Mgbakwunye ‘-zi’ na-egosipụta ike nkwubi okwu na ịtụnanya dị na ἄρα.
- source_word: ἐπιτάσσει
  choice: ọ na-enye ... iwu
  rationale: Nke a na-asụgharị echiche nke inye iwu kpọmkwem, na-enweghị ibubata ‘ịbara mba’ sitere n’amaokwu gara aga.
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: ifufe dị iche iche na mmiri
  rationale: Ọ na-edobe ọtụtụ nke ‘ifufe’ na okwu kpọmkwem ‘mmiri,’ kama iji ‘ebili mmiri’ ma ọ bụ ‘oké osimiri’ dochie ya.
- source_word: ὑπακούουσιν αὐτῷ
  choice: ha ana-eruberekwa ya isi
  rationale: ‘Irubere isi’ na-egosi nrubeisi ma dabara n’otú e si kọwaa ihe ndị e kere eke dị ka ndị na-anụ iwu.
theological_decisions:
- issue: πίστις nwere ike ịpụta okwukwe ma ọ bụ ịtụkwasị obi n’ọnọdụ a
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: ‘Okwukwe’ na-edobe okwu sara mbara nke πίστις ma kwe ka nkọwa nke ịtụkwasị Jizọs obi n’ihe ize ndụ dịgide; e debere ụzọ ọzọ na nkọwa ala peeji.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Ònyezi’ gosipụta ike ἄρα; e debere ‘ifufe’ n’ụdị ọtụtụ na ‘mmiri’ dịka Greek si kwuo.
