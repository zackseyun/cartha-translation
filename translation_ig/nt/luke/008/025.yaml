- from: Mgbe ahụ, ọ sịrị ha, “Olee ebe okwukwe unu dị[a]?” Ụjọ jidere ha, o jukwara ha anya. Ha wee na-asị ibe ha, “Ònyezi ka onye a bụ, ebe ọ bụ na ọ na-enye ọbụna ifufe dị iche iche na mmiri iwu, ha ana-eruberekwa ya isi?”
  to: Mgbe ahụ, ọ sịrị ha, “Olee ebe okwukwe unu dị[a]?” Ụjọ jidere ha, o jukwara ha anya. Ha wee na-asị ibe ha, “Ònyezi ka onye a bụ, ebe ọ bụ na ọ na-enye ọbụna ifufe na mmiri iwu, ha ana-eruberekwa ya isi?”
  rationale: A single safe lexical correction changes “ifufe dị iche iche” to “ifufe.” This retains the Greek plural/generic reference without adding the idea that the winds were different or varied. The remainder faithfully reflects the source and is natural Standard Igbo.
