id: LUK.8.24
reference: Luke 8:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: ig
  text: Ha bịakwutere ya wee kpọtee ya, na-asị, “Nna ukwu, Nna ukwu, anyị na-ala n’iyi!” Mgbe a kpọtesịrị ya, ọ baara ifufe na ebili mmiri mba; ha kwụsịrị, mmiri ahụ wee dị jụụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: Ha bịakwutere ya
  rationale: Na-egosi na ha bịaruru Jizọs nso tupu ha akpọtee ya, n’enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: διήγειραν
  choice: kpọtee ya
  rationale: Okwu Igbo a na-adị mfe ma doo anya maka ime ka onye na-ehi ụra teta.
- source_word: Ἐπιστάτα
  choice: Nna ukwu
  rationale: Aha nkwanye ùgwù a na-egosi ikike onye a na-akpọ, ma ọ naghị eme ka okwu ahụ bụrụ naanị ‘onye nkụzi.’
- source_word: ἀπολλύμεθα
  choice: anyị na-ala n’iyi
  rationale: Na-echekwa ihe ize ndụ na-aga n’ihu na atụmanya ọnwụ dị nso.
- source_word: διεγερθεὶς
  choice: Mgbe o tetara
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi gosi usoro omume participle ahụ, n’ekpebighị ma o tetara n’onwe ya ma ọ bụ n’ihi na ha kpọtere ya.
- source_word: ἐπετίμησεν
  choice: ọ baara ... mba
  rationale: Na-egosi okwu ike e ji gbochie ma chịkwaa ifufe na mmiri, dịka ngwaa Grik si dị.
- source_word: ἀνέμῳ
  choice: ifufe
  rationale: Nke a bụ ihe okwu Grik ahụ pụtara kpọmkwem, n’enweghị ịgbasa ya ka ọ bụrụ ‘ifufe oké ifufe.’
- source_word: κλύδωνι τοῦ ὕδατος
  choice: ebili mmiri
  rationale: ‘Ebili mmiri’ bụ okwu Igbo doro anya maka mgbali na mkpọtụ mmiri κλύδων na-egosi; ọ na-echekwa onyonyo ebili mmiri n’asụsụ nkịtị.
- source_word: ἐπαύσαντο
  choice: ha kwụsịrị
  rationale: Nnọchiaha ọtụtụ na-ezo aka n’ifufe na ebili mmiri ọnụ, kwekọrọ na ngwaa ọtụtụ nke Grik.
- source_word: ἐγένετο γαλήνη
  choice: ebe ahụ wee daa jụụ
  rationale: Ụzọ Igbo sitere n’okike isi kwuo na ọnọdụ jụụ malitere mgbe ifufe na ebili mmiri kwụsịrị.
theological_decisions:
- issue: Nsụgharị aha Ἐπιστάτα e ji kpọọ Jizọs
  choice: Nna ukwu
  alternative: Onye nkụzi; Ọchịagha
  rationale: ‘Nna ukwu’ na-echekwa nkwanye ùgwù na ikike dị n’aha Luk ji eme ihe, n’emeghị ka ọ bụrụ naanị ọrụ izi ihe ma ọ bụ tinye okwu agha siri ike.
- issue: Otu e si gosi ikike Jizọs n’ebe ihe e kere eke nọ na ἐπετίμησεν
  choice: ọ baara ... mba
  alternative: ọ nyere ... iwu; ọ gwara ... okwu
  rationale: Nhọrọ a na-echekwa ike ngwaa ahụ na-egosi na Jizọs ji ikike gbochie ifufe na ebili mmiri, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Nna ukwu’ mee aha nkwanye ùgwù ugboro abụọ dịka isi mmalite si dị. E nweghị ihe odide ala peeji n’ihi na ihe odide isi mmalite na ihe akaebe lexical achọghị ka a kaa otu ebe akara; ihe odide ala peeji Bekee e nyere adabaghị na akara [a] dị n’ahịrị ya.
