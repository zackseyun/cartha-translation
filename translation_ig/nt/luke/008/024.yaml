review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the approach, the repeated address, imminent peril, Jesus' authoritative rebuke, and the cessation of the wind and water disturbance. However, “Mgbe o tetara” reads as though Jesus woke on his own, whereas the passive participle διεγερθείς naturally refers back to the disciples' waking him. “Ebe ahụ wee daa jụụ” shifts the result from a calm on the water/storm to the surrounding place becoming quiet.
  naturalness: The main sentence is understandable Standard Igbo, but “Ha bịakwutere ya, kpọtee ya” is smoother with wee to mark the attendant action. “Mmiri ahụ wee dị jụụ” is a natural, precise way to express the resulting calm in this setting.
  terminology: “Nna ukwu” is an appropriate respectful rendering of Ἐπιστάτα and its repetition is rightly retained. “Baara ... mba” suitably conveys ἐπετίμησεν. “Ebili mmiri” is a natural Igbo expression for the water's surge and is retained without forcing an overly technical equivalent.
  issues:
  - severity: medium
    issue: “Mgbe o tetara” does not retain the passive/causative implication of διεγερθείς.
    rationale: In context the disciples have just awakened Jesus. “Mgbe a kpọtesịrị ya” naturally maintains that connection without adding a claim about the precise mechanics of awakening.
  - severity: medium
    issue: “Ebe ahụ wee daa jụụ” makes the location, rather than the storm/water, become quiet.
    rationale: ἐγένετο γαλήνη describes the resulting calm. Referring to the water preserves the immediate referent and avoids an unnecessary shift in meaning.
  - severity: low
    issue: The first two actions are joined only by a comma.
    rationale: Adding “wee” gives the normal Igbo sequential connection and more clearly represents the participle followed by the main verb.
  revised_text: Ha bịakwutere ya wee kpọtee ya, na-asị, “Nna ukwu, Nna ukwu, anyị na-ala n’iyi!” Mgbe a kpọtesịrị ya, ọ baara ifufe na ebili mmiri mba; ha kwụsịrị, mmiri ahụ wee dị jụụ.
