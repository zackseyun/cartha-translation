- from: Ha bịakwutere ya, kpọtee ya, na-asị, “Nna ukwu, Nna ukwu, anyị na-ala n’iyi!” Mgbe o tetara, ọ baara ifufe na ebili mmiri mba; ha kwụsịrị, ebe ahụ wee daa jụụ.
  to: Ha bịakwutere ya wee kpọtee ya, na-asị, “Nna ukwu, Nna ukwu, anyị na-ala n’iyi!” Mgbe a kpọtesịrị ya, ọ baara ifufe na ebili mmiri mba; ha kwụsịrị, mmiri ahụ wee dị jụụ.
  rationale: 'The revision makes only safe, source-driven adjustments: it marks the disciples'' waking of Jesus, restores the calm specifically to the water/storm context, and improves the sequential phrasing. It retains the draft''s established title and authoritative rebuke terminology. No footnote is needed, since the English lexical-alternative note has no necessary corresponding ambiguity in this Igbo rendering.'
