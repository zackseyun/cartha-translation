    text: Ma ọ bụ, “ndị ikwu gị,” ma ọ bụrụ na a ghọta okwu Grik ahụ n’ụzọ sara mbara n’ọnọdụ a; ihe ọ na-apụtakarị bụ “ụmụnne nwoke.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unidiomatic explicit masculine modifier while retaining the ordinary meaning of ἀδελφοί through the natural Igbo term “ụmụnne.” The footnote preserves the possible broader contextual sense (“relatives”) and states the ordinary lexical sense without imposing an interpretation of Jesus’s family relationships. All other elements of the source are retained.
