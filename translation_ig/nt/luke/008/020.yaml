review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the passive report, the mother, the family members outside, their standing, and their desire to see Jesus. The explicit addition “ndị nwoke” is not required by the Greek in an Igbo rendering and is awkwardly attached to “ụmụnne.” Greek ἀδελφοί should remain “ụmụnne gị,” with the lexical alternative retained in a note.
  naturalness: “Nne gị na ụmụnne gị ndị nwoke” is not idiomatic Standard Igbo. “Nne gị na ụmụnne gị” is natural, clear in this family setting, and maintains the appropriate narrative register. “A gwara ya sị” naturally introduces the reported speech.
  terminology: Use “ụmụnne” for ἀδελφοί. Igbo does not need an unnatural masculine expansion here; the note may identify “ndị ikwu” as a contextual broader alternative without resolving family-relationship debates.
  issues:
  - severity: medium
    issue: The phrase “ụmụnne gị ndị nwoke” is stylistically unnatural and over-specifies grammatical masculinity in an unidiomatic way.
    rationale: While ἀδελφοί is masculine plural and ordinarily means “brothers,” Standard Igbo “ụmụnne” is the normal family-term equivalent. Adding “ndị nwoke” after it produces an awkward construction and is not necessary to preserve source fidelity.
  revised_text: A gwara ya sị, “Nne gị na ụmụnne gị[a] guzo n’èzí, na-achọ ịhụ gị.”
  revised_footnotes:
