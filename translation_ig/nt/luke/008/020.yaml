revisions:
- from: A gwara ya, “Nne gị na ụmụnne gị ndị nwoke[a] guzo n’èzí, na-achọ ịhụ gị.”
  to: A gwara ya sị, “Nne gị na ụmụnne gị[a] guzo n’èzí, na-achọ ịhụ gị.”
  rationale: The revision removes the unidiomatic explicit masculine modifier while retaining the ordinary meaning of ἀδελφοί through the natural Igbo term “ụmụnne.” The footnote preserves the possible broader contextual sense (“relatives”) and states the ordinary lexical sense without imposing an interpretation of Jesus’s family relationships. All other elements of the source are retained.
  reviewer_model: gpt-5.6-terra
