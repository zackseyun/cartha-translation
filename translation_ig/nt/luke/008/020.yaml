  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: ig
  text: A gwara ya sị, “Nne gị na ụmụnne gị[a] guzo n’èzí, na-achọ ịhụ gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikwu gị,” ma ọ bụrụ na a ghọta okwu Grik ahụ n’ụzọ sara mbara n’ọnọdụ a; ihe ọ na-apụtakarị bụ “ụmụnne nwoke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: A gwara ya
  rationale: 'Ụdị a na-egosi na e mere ihe ahụ n’ahụ onye a na-ekwu maka ya, ma na-asụkwa nke ọma n’Igbo: mmadụ wetara Jizọs ozi ahụ.'
- source_word: δὲ
  choice: A
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ ahụ; nhazi ahịrịokwu Igbo anaghị achọ ka a sụgharịa ya iche dịka ‘ma’ ma ọ bụ ‘mgbe ahụ.’
- source_word: αὐτῷ
  choice: ya
  rationale: ‘Ya’ na-egosi onye a gwara ozi ahụ kpọmkwem.
- source_word: μήτηρ
  choice: Nne
  rationale: ‘Nne’ bụ okwu Igbo nkịtị, dị ùgwù, nke kwekọrọ kpọmkwem na μήτηρ.
- source_word: ἀδελφοί
  choice: ụmụnne gị ndị nwoke
  rationale: Okwu Grik ahụ bụ ọtụtụ nke nwoke, ọ na-apụtakarị ụmụnne nwoke. Nsụgharị a na-edobe nkọwa nwoke dị n’isiokwu ahụ n’etinyeghị echiche okpukpe ọzọ.
- source_word: ἑστήκασιν
  choice: guzo
  rationale: Perfect a nwere mmetụta ọnọdụ dị ugbu a; ‘guzo’ n’ahịrịokwu a na-egosi na ha nọ n’èzí na-eche.
- source_word: ἔξω
  choice: n’èzí
  rationale: Nke a bụ ntụgharị oghere kpọmkwem, n’agbakwụnyeghị ụlọ ma ọ bụ ebe ọzọ nke ederede ahụ na-ekwughị.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: ‘Ịhụ’ na-edobe isi ihe ὁράω pụtara, kama ịgbasa ya ka ọ bụrụ izute ma ọ bụ ịgwa okwu.
- source_word: θέλοντες
  choice: na-achọ
  rationale: ‘Na-achọ ịhụ gị’ na-egosi ọchịchọ ha nwere n’oge ha guzo n’èzí, dị ka participle nke Grik si mee.
theological_decisions:
- issue: Ihe ‘ụmụnne nwoke’ pụtara n’ihe gbasara ezinụlọ Jizọs
  choice: A sụgharịrị ἀδελφοί dịka ‘ụmụnne gị ndị nwoke’ n’agbasaghị nkọwa ya.
  alternative: ndị ikwu gị
  rationale: Amaokwu a ji okwu Grik nke na-apụtakarị ‘ụmụnne nwoke.’ Ebe ọ bụ na amaokwu ahụ n’onwe ya anaghị edozi arụmụka banyere ụdị mmekọrịta ezinụlọ ha na Jizọs nwere, nsụgharị ahụ anaghị ebubata nkọwa otu ozizi pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, doro anya ma dị ùgwù. Ahịrịokwu ahụ na-asụ nke ọma n’ọnụ ma na-edobe passive nke akụkọ ahụ, ọnọdụ ha nọ na ya, na ọchịchọ ha ịhụ Jizọs.
