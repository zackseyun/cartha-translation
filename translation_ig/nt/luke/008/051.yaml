id: LUK.8.51
reference: Luke 8:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: ig
  text: Mgbe ọ batara n'ụlọ ahụ, o kweghị ka onye ọ bụla soro ya banye, ma e wezụga Pita na Jọn na Jemis, na nna nwa agbọghọ ahụ[a] na nne ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwata ahụ.” Okwu Grik ahụ nwere ike ịpụta “nwata” n'ozuzu, ma ihe gbara amaokwu a gburugburu na-egosi na nwata ahụ bụ nwa agbọghọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν ... εἰς τὴν οἰκίαν
  choice: Mgbe ọ batara n'ụlọ ahụ
  rationale: Nkebi a na-egosi oge ihe mere; “mgbe” na “batara” na-enye Igbo dị ndụ ma na-edobe echiche nke ịbata n'ime ụlọ.
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: o kweghị ka ... banye
  rationale: N'ebe a ἀφίημι pụtara ikwe ma ọ bụ inye ikike; usoro a bụ ụzọ Igbo nkịtị si ekwu ya.
- source_word: τινα σὺν αὐτῷ
  choice: onye ọ bụla soro ya
  rationale: N'ihi na okwu a dị n'ahịrịokwu nkwusioru, τινα nwere echiche nke “onye ọ bụla”; “soro ya” na-ejikọta ya n'ụzọ doro anya na omume ịbanye.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N'usoro a, ọ na-egosi ndị a hapụrụ n'iwu ahụ, ọ bụghị ọnọdụ nke “ọ bụrụ na ọ bụghị.”
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: Pita na Jọn na Jemis
  rationale: A sụgharịrị aha ndị ahụ n'ụdị a maara nke ọma n'Igbo, ma debe kwa njikọ “na” ugboro ugboro dịka n'asụsụ Grik.
- source_word: τῆς παιδὸς
  choice: nwa agbọghọ ahụ
  rationale: παῖς nwere ike ịpụta nwata n'ozuzu, ma ihe gbara amaokwu a gburugburu kọwara ya dị ka nwa nwanyị Jairọs.
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: nna ... na nne ya
  rationale: Nke a na-edobe ịkpọ nna na nne iche iche kama ịchịkọta ha naanị dịka nne na nna.
theological_decisions:
- issue: Ma a ga-asụgharị παῖς dịka nwa agbọghọ ma ọ bụ nwata
  choice: nna nwa agbọghọ ahụ na nne ya
  alternative: nna nwata ahụ na nne ya
  rationale: Okwu Grik ahụ sara mbara, ma akụkọ dị nso kwuru hoo haa na ọ bụ nwa nwanyị Jairọs. A na-edobe nhọrọ sara mbara n'ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ugwu. E ji “o kweghị ka … banye” mee ka ahịrịokwu ahụ bụrụ nke mmadụ na-asụ n'ụzọ nkịtị, ma e debeghị ihe ọ bụla nke otu ụka pụrụ iche.
