review_pass:
  verdict: revise
  source_fidelity: The main rendering accurately conveys the indefinite day, Jesus’ boarding a boat with his disciples, the hortatory proposal to cross to the lake’s other side, and their departure. “Ha wee kwapụ” is a viable concise contextual rendering of the nautical departure. The current footnote, however, includes “Ha wee pụọ n’ụgbọ mmiri,” which means that they got out of the boat and thus reverses the source sense.
  naturalness: The prose is clear, modern Standard Igbo, with an appropriate narrative register. “N’otu ụbọchị n’ime ụbọchị ndị ahụ” is a slightly smoother word order for the temporal phrase.
  terminology: “Ndị na-eso ụzọ,” “ụgbọ mmiri,” and “ọdọ mmiri” are suitable Standard Igbo terms. No theological terminology is at issue.
  issues:
  - severity: high
    issue: The second alternative in footnote [a] says “Ha wee pụọ n’ụgbọ mmiri.”
    rationale: In ordinary Igbo this means “They got out of the boat,” whereas ἀνήχθησαν, in this nautical context, means that they put out/set sail. The footnote therefore supplies an opposite and misleading lexical alternative.
  revised_text: N’otu ụbọchị n’ime ụbọchị ndị ahụ, ọ banyere n’ụgbọ mmiri, ndị na-eso ụzọ ya sokwa ya. Ọ sịrị ha, “Ka anyị gafee n’akụkụ nke ọzọ nke ọdọ mmiri.” Ha wee kwapụ.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ha wee malite njem n’ụgbọ mmiri,” ma ọ bụ, “Ha wee malite ịkwọ ụgbọ mmiri.”
    reason: lexical_alternative
  revision_rationale: The translation text needs only a minor word-order smoothing. Footnote [a] is corrected so that both alternatives describe beginning a journey by boat rather than leaving the boat, preserving the nautical sense of ἀνήχθησαν.
