  to: N’otu ụbọchị n’ime ụbọchị ndị ahụ, ọ banyere n’ụgbọ mmiri, ndị na-eso ụzọ ya sokwa ya. Ọ sịrị ha, “Ka anyị gafee n’akụkụ nke ọzọ nke ọdọ mmiri.” Ha wee kwapụ.[a]
