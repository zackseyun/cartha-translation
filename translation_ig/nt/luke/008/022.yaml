source:
  edition: SBLGNT
  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: ig
  text: N’otu ụbọchị n’ime ụbọchị ndị ahụ, ọ banyere n’ụgbọ mmiri, ndị na-eso ụzọ ya sokwa ya. Ọ sịrị ha, “Ka anyị gafee n’akụkụ nke ọzọ nke ọdọ mmiri.” Ha wee kwapụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ha wee malite njem n’ụgbọ mmiri,” ma ọ bụ, “Ha wee malite ịkwọ ụgbọ mmiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Otu ụbọchị n’ime ụbọchị ndị ahụ
  rationale: A naghị atụgharị okwu mmeghe ahụ n’ụzọ ochie; a jikọtara ya na nkebi oge na-esote ka akụkọ ahụ malite n’Igbo dị larịị, ebe njikọ δέ dị mfe na-adị n’usoro akụkọ.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: Otu ụbọchị n’ime ụbọchị ndị ahụ
  rationale: Nke a na-echekwa echiche nke otu ụbọchị a na-akọwaghị kpọmkwem n’ime oge ndị a maara site n’ihe gbara ya gburugburu.
- source_word: ἐνέβη εἰς πλοῖον
  choice: ọ banyere n’ụgbọ mmiri
  rationale: “Banyere n’ụgbọ mmiri” bụ okwu Igbo doro anya maka ịbanye n’ime ụgbọ ahụ; πλοῖον enweghị article, ya mere e tinyeghị ihe na-egosi otu ụgbọ a kapịrị ọnụ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya sokwa ya
  rationale: Nke a na-egosi na ndị na-eso ụzọ ahụ sonyeere ya n’ụgbọ mmiri, dị ka nhazi okwu Grik si pụta.
- source_word: Διέλθωμεν
  choice: Ka anyị gafee
  rationale: “Ka anyị” na-egosipụta hortatory subjunctive nke onye mbụ ọtụtụ, “gafee” na-echekwa echiche ịgafe.
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: n’akụkụ nke ọzọ nke ọdọ mmiri
  rationale: Nke a na-echekwa ma “akụkụ nke ọzọ” ma genitive “nke ọdọ mmiri”; λίμνη bụ ọdọ mmiri, ọ bụghị oke osimiri.
- source_word: ἀνήχθησαν
  choice: Ha wee kwapụ
  rationale: N’okwu gbasara njem mmiri, ngwaa a pụtara ịhapụ ebe e si banye ma malite njem; “kwapụ” bụ Igbo nkịtị, ebe nkọwa ndị ọzọ ka e debere n’ala peeji.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E kewara ogologo ahịrịokwu Grik ahụ n’ahịrịokwu Igbo dị mkpụmkpụ iji mee ka ọ gụọ nke ọma, n’enweghị ịgbanwe usoro ihe mere. Akara ala peeji [a] dị n’isiokwu ahụ ma na-akọwa obosara ihe ἀνήχθησαν nwere ike ịpụta.
