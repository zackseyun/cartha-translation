  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: ig
  text: Mgbe ndị na-elekọta anụ ụlọ ahụ hụrụ ihe merenụ[a], ha gbara ọsọ gaa kọọ ya n’obodo nakwa n’ógbè ime obodo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ihe mere.’
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, ‘n’ubi’; n’ebe a, ọ na-ezo aka n’ógbè ime obodo ndị gbara obodo ahụ gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: Mgbe ... hụrụ
  rationale: A tụgharịrị participle aorist ahụ dị ka nkebiokwu oge n’Igbo, ka njikọ ya na omume ndị sochirinụ pụta ìhè n’asụsụ e ji eme ihe kwa ụbọchị.
- source_word: οἱ βόσκοντες
  choice: ndị na-azụ anụ ụlọ ahụ
  rationale: Participial noun a na-ezo aka ná ndị na-elekọta ìgwè anụmanụ ahụ. N’agbanyeghị na ihe gbara amaokwu a gburugburu na-egosi na ha bụ ezi, okwu Grik n’onwe ya ekwughị aha anụmanụ ahụ n’amaokwu a; ya mere ntụgharị a na-edobe ihe ahụ n’ozuzu ya ma na-ezere ‘ndị ọzụzụ atụrụ,’ nke ga-eduhie.
- source_word: τὸ γεγονός
  choice: ihe merenụ
  rationale: Perfect participle e ji mee noun na-egosi ihe mezuru eme; ‘ihe merenụ’ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo ya.
- source_word: ἔφυγον
  choice: ha gbara ọsọ
  rationale: Okwu a pụtara ịgbapụ ma ọ bụ ịgba ọsọ pụọ. ‘Ha gbara ọsọ’ dabara n’akụkọ a, n’etinyeghị echiche nke ịlanarị nke ‘gbapụta’ nwere ike ibute.
- source_word: ἀπήγγειλαν
  choice: gaa kọọ ya
  rationale: Okwu a pụtara ịkọ ma ọ bụ iweta ozi. ‘Gaa kọọ ya’ na-eme ka ntụziaka εἰς na ihe a na-akọ nke doro anya site n’ihe gbara ya gburugburu pụta n’Igbo ebumpụta ụwa.
- source_word: εἰς τὴν πόλιν
  choice: n’obodo
  rationale: N’agbanyeghị na εἰς na-egosikarị ntụziaka ‘gaa/ba n’ime,’ mgbe e jikọtara ya na ịkọ akụkọ, ‘n’obodo’ na-egosi ebe ha gara gbasaa ozi ahụ n’Igbo ọma.
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: nakwa n’ime ime obodo
  rationale: ἀγροί pụtara n'ụzọ nkịtị ‘ubi,’ ma n’ebe a ọ na-emegide ‘obodo’ ma na-ezo aka n’ógbè ndị gbara obodo ahụ gburugburu. ‘Ime ime obodo’ na-eme ka ọdịiche ala ahụ doo anya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ntụgharị ahụ. Ahịrịokwu ahụ na-edobe usoro akụkọ Grik—ịhụ ihe merenụ, ịgbapụ, na ịkọ akụkọ—ma na-eji usoro okwu Igbo ebumpụta ụwa.
