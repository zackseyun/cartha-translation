  to: Mgbe ndị na-elekọta anụ ụlọ ahụ hụrụ ihe merenụ[a], ha gbara ọsọ gaa kọọ ya n’obodo nakwa n’ógbè ime obodo[b].
  rationale: 'The revision corrects the inaccurate alternative in footnote a and smooths the expression for the rural districts. It preserves the Greek sequence and scope: the animal tenders saw the event, fled, and reported it in the city and rural areas.'
