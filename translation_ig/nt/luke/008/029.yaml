  source_fidelity: A chọrọ imezi akụkụ abụọ dị mkpa. πολλοῖς ... χρόνοις na-ekwu ogologo oge karịa ugboro ole; ya mere “Ruo ogologo oge” ka dabara nke ọma, ebe ndetu nwere ike ichekwa nghọta ọzọ. Ọzọkwa, ἠλαύνετο na-egosi na mmụọ ọjọọ ahụ na-amanye nwoke ahụ ịga, ọ bụghị naanị na ọ ‘na-achụbakwa’ ya.
  naturalness: Ederede ahụ ghọtara nke ọma, ma “Jizọs enyela ... iwu” na “a na-eji ... kee ya” nwere ike ime ka usoro ahụ bụrụ nke Igbo dị ugbu a ma doo anya karịa. “na-achụ ya gaa” na-egosi mmegharị a manyere n’ụzọ eke.
  terminology: “mmụọ ahụ na-adịghị ọcha” na “mmụọ ọjọọ ahụ” bụ okwu kwesịrị ekwesị maka πνεῦμα ἀκάθαρτον na δαιμόνιον. “agbụ na nkpọ ụkwụ” na-echekwa ọdịiche dị n’etiti ἁλύσεις na πέδαις.
