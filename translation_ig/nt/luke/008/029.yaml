id: LUK.8.29
reference: Luke 8:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: ig
  text: N’ihi na Jizọs enyeworị mmụọ ahụ na-adịghị ọcha iwu ka o si n’ime nwoke ahụ pụta. Ruo ogologo oge[a], mmụọ ahụ ejidewo ya n’ike. A na-eji agbụ na nkpọ ụkwụ eke ya, na-echekwa ya nche; ma mgbe ọ na-adọkasị ihe e ji kee ya, mmụọ ọjọọ ahụ na-amanye ya ịga n’ebe ndị mmadụ na-adịghị ebi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọtụtụ mgbe”; okwu Grik ahụ nwekwara ike ịpụta ihe mere ugboro ugboro, ma n’ebe a ọ na-egosikarị ogologo oge.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ọzara.” N’asụsụ Grik, okwu a dị n’ọnụọgụ ọtụtụ, ya bụ, “ebe tọgbọrọ n’efu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: enyela ... iwu
  rationale: Ụdị zuru-oke n'oge gara aga na-egosi na iwu Jizọs nyere bụ ihe mere tupu nzaghachi mmụọ ahụ, dịka γάρ si kọwaa ndabere akụkọ ahụ.
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: mmụọ ahụ na-adịghị ọcha
  rationale: Nke a na-echekwa okwu NT banyere adịghị ọcha n’enweghị ime ka ọ bụrụ naanị ọrịa uche ma ọ bụ ihe atụ.
- source_word: ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου
  choice: ka o si n’ime nwoke ahụ pụta
  rationale: Ọ bụ Igbo doro anya maka mmụọ ịhapụ onye, ma na-echekwa echiche mmegharị sitere n’ime onye ahụ pụọ.
- source_word: πολλοῖς γὰρ χρόνοις
  choice: Ọtụtụ mgbe
  rationale: Ọnụọgụ ọtụtụ na ọnọdụ okwu ahụ na-akwado ihe na-eme ugboro ugboro; ndetu na-echekwa ohere nke ogologo oge.
- source_word: συνηρπάκει
  choice: na-ejide ya n’ike
  rationale: Na-egosi njide ike na nchịkwa ime ihe ike dị n’okwu Grik ahụ.
- source_word: ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις
  choice: a na-eji agbụ na nkpọ ụkwụ kee ya
  rationale: Na-egosi omume a na-eme ugboro ugboro ma kewaa agbụ n’ozuzu ya na ihe e ji ekpochi ụkwụ.
- source_word: φυλασσόμενος
  choice: ma na-eche ya nche
  rationale: Na-akọwa na ndị mmadụ nọ na-ele ya anya mgbe e kere ya.
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: ọ na-adọkasị ihe e ji kee ya
  rationale: Na-eji okwu sara mbara maka δεσμά ma na-egosi imebi ha n’ike, n’enweghị ikwughachi naanị ‘agbụ.’
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: mmụọ ọjọọ ahụ na-achụbakwa ya
  rationale: Na-echekwa mmanye na omume na-eme ugboro ugboro; usoro Igbo nke na-eme mmụọ ọjọọ ahụ onye na-eme ihe dị eke karịa passive siri ike.
- source_word: εἰς τὰς ἐρήμους
  choice: n’ebe ndị mmadụ na-ebighị
  rationale: Na-echekwa plural na echiche nke ebe ndị mmadụ na-ebighị, n’enweghị ịkọwa ya dịka otu ụdị ala kpọmkwem.
theological_decisions:
- issue: Okwu banyere mmụọ ọjọọ
  choice: mmụọ ahụ na-adịghị ọcha / mmụọ ọjọọ ahụ
  alternative: mmụọ rụrụ arụ / ajọ mmụọ
  rationale: A tụgharịrị ἀκάθαρτον πνεῦμα na δαιμόνιον dị ka ndị na-eme ihe n’onwe ha n’akụkọ ahụ, n’enweghị ime ka ha bụrụ naanị ọrịa ma ọ bụ ihe atụ.
- issue: Onye na-achụ nwoke ahụ
  choice: mmụọ ọjọọ ahụ na-achụbakwa ya
  alternative: a na-achụ ya site n’aka mmụọ ọjọọ ahụ
  rationale: Active Igbo na-egosipụta otu onye ọrụ ahụ nke passive Grik kwuru ma na-agụ nke ọma; ọ naghị agbanwe ọrụ mmụọ ọjọọ ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘nkpọ ụkwụ’ mee ka ọdịiche dị n’etiti ἁλύσεις na πέδαι pụta; e zere okwu ụka pụrụ iche na nkọwa na-eme ka mmụọ ọjọọ bụrụ naanị ihe atụ.
