  to: N’ihi na Jizọs enyeworị mmụọ ahụ na-adịghị ọcha iwu ka o si n’ime nwoke ahụ pụta. Ruo ogologo oge[a], mmụọ ahụ ejidewo ya n’ike. A na-eji agbụ na nkpọ ụkwụ eke ya, na-echekwa ya nche; ma mgbe ọ na-adọkasị ihe e ji kee ya, mmụọ ọjọọ ahụ na-amanye ya ịga n’ebe ndị mmadụ na-adịghị ebi[b].
