    issue: Nkebiokwu gbasara mpaghara ndị Gerasin agbasaghị nke ọma.
    rationale: “n’ógbè ndị Gerasin na gburugburu ya” pụrụ ịgụ dịka ógbè ahụ na mpaghara ọzọ gbara ya gburugburu, ebe τῆς περιχώρου τῶν Γερασηνῶν pụtara ógbè gbara gburugburu nke ndị Gerasin.
  - severity: low
