  to: Ìgwè mmadụ niile nke si n’ógbè ndị Gerasin gbara gburugburu rịọrọ ya ka o si n’ebe ha nọ pụọ, n’ihi na oké egwu jidere ha[a]. Ma ya onwe ya banyere n’ụgbọ mmiri laghachi.
  rationale: E degharịrị nkọwa mpaghara ahụ ka o gosipụta na ọ bụ ógbè gbara gburugburu nke ndị Gerasin, ọ bụghị ógbè ndị Gerasin tinyere gburugburu ya. A gbanwere “Ya mere” ka e wee ghara igosi na ịbanye Jizọs n’ụgbọ mmiri bụ nsonaazụ Grik kwupụtara. Ihe ndị ọzọ na-echekwa ike na mgbagwoju anya nke Grik.
