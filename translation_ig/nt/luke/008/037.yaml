source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: ig
  text: Ìgwè mmadụ niile nke si n’ógbè ndị Gerasin gbara gburugburu rịọrọ ya ka o si n’ebe ha nọ pụọ, n’ihi na oké egwu jidere ha[a]. Ma ya onwe ya banyere n’ụgbọ mmiri laghachi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “oké egwu rikpuru ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησεν
  choice: rịọrọ
  rationale: “Rịọrọ” na-egosi ịrịọ mmadụ ka o mee ihe, ma ọ naghị etinye ike karịrị nke ἐρωτάω nwere n’ebe a.
- source_word: ἅπαν τὸ πλῆθος
  choice: ìgwè mmadụ niile
  rationale: Nke a na-echekwa echiche nke ìgwè ahụ dum n’asụsụ Igbo dị mfe nghọta.
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: sitere n’ógbè ndị Gerasin na gburugburu ya
  rationale: Nke a na-egosi na ìgwè ahụ sitere n’ala ndị Gerasin na mpaghara gbara ya gburugburu, ma na-edobe aha ebe ahụ dịka ọ dị n’ihe odide Grik e nyere.
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: ka o si n’ebe ha nọ pụọ
  rationale: Nkebiokwu a na-egosipụta nke ọma arịrịọ ka Jizọs hapụ ebe ha nọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: φόβῳ μεγάλῳ
  choice: oké egwu
  rationale: “Oké egwu” bụ ụzọ dị nkenke ma kwekọọ n’Igbo isi kwuo φόβῳ μεγάλῳ.
- source_word: συνείχοντο
  choice: jidere ha
  rationale: “Jidere ha” na-echekwa ihe atụ nke ịbụ ihe jichiri ma ọ bụ makwasịrị mmadụ ike, dịka συνέχω si pụta n’ebe a.
- source_word: ἐμβὰς εἰς πλοῖον
  choice: ọ banyere n’ụgbọ mmiri
  rationale: Nke a bụ nsụgharị doro anya na nke e ji eme ihe kwa ụbọchị maka ịbanye n’ụgbọ mmiri; ọ naghị etinye ụgbọ mmiri a kapịrị ọnụ ebe Grik na-enweghị akara njirimara.
- source_word: ὑπέστρεψεν
  choice: wee laghachi
  rationale: “Laghachi” na-enye echiche nke ịga azụ n’enweghị ịgbakwụnye ebe ọ laghachiri.
theological_decisions:
- issue: Ihe mere ndị Gerasin ji tụọ egwu ma rịọ Jizọs ka ọ pụọ
  choice: E kwuru naanị na oké egwu jidere ha.
  alternative: Ịkọwa egwu ahụ kpọmkwem dịka nsọpụrụ maka ike Chineke, iwe n’ihi mfu akụ na ụba, ma ọ bụ ụjọ mgbanwe n’obodo.
  rationale: Amaokwu ahụ akọwaghị ụdị egwu ahụ ma ọ bụ ihe ha bu n’obi; ya mere, nsụgharị ahụ ahapụghị mgbagwoju anya ahụ ma ghara itinye nkọwa ozizi n’ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ Grik n’enweghị ịkọwa ihe amaokwu ahụ ekwughị; e debere “ndị Gerasin” dịka aha ndị bi n’ógbè ahụ.
