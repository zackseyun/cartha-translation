id: LUK.8.35
reference: Luke 8:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: ig
  text: Ha wee pụọ ka ha hụ ihe mere, bịakwutekwa Jizọs. Ha hụrụ nwoke ahụ ndị mmụọ ọjọọ si n’ime ya pụta[b] ka ọ nọ ọdụ n’akụkụ ụkwụ Jizọs, yi uwe, uche ya dịkwa mma[a]. Egwu wee tụọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nwere ezi uche.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ ihe odide Grik nwere ngwaa n’ụdị ọtụtụ (“ndị mmụọ ọjọọ ahụ pụtara”); ederede e bipụtara nwere ngwaa n’ụdị otu ya na isiokwu dị n’ụdị ọtụtụ, ma ihe ọ pụtara agbanweghị. A naghị ahụ ọdịiche a n’ụdị ngwaa Igbo.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον δὲ ἰδεῖν
  choice: Ha wee pụọ ka ha hụ
  rationale: “Pụọ” na-egosi na ha si n’obodo ma ọ bụ ebe ha nọ gawa ịhụ ihe ahụ; “ka ha hụ” na-egosi nzube nke ọpụpụ ha.
- source_word: τὸ γεγονός
  choice: ihe mere
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo ihe ahụ mezuru nke ha gara ile anya.
- source_word: ἦλθον πρὸς τὸν Ἰησοῦν
  choice: bịakwutekwa Jizọs
  rationale: “Bịakwute” na-egosi ngagharị ha bịara n’ebe Jizọs nọ, ebe “-kwa” jikọtara ihe omume a na nke bu ya ụzọ.
- source_word: τὸν ἄνθρωπον
  choice: nwoke ahụ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na onye a bụ nwoke a kpọtụrụla aha.
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: ndị mmụọ ọjọọ si n’ime ya pụta
  rationale: Nke a na-edobe echiche nke ndị mmụọ ọjọọ hapụrụ nwoke ahụ, n’agbanyeghị na ngwaa Igbo anaghị egosi ọdịiche dị n’etiti otu na ọtụtụ.
- source_word: δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Okwu a bụ nke ndị Igbo nkịtị na-aghọta nke ọma maka ndị mmụọ ajọ omume, ma ọ naghị eme ka akụkọ nchụpụ mmụọ ahụ ghọọ naanị ọrịa.
- source_word: καθήμενον ... παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: ka ọ nọ ọdụ n’ụkwụ Jizọs
  rationale: Nke a na-egosi ọnọdụ nwoke ahụ mgbe ha hụrụ ya na ebe ọ nọ nso Jizọs, n’Igbo na-aga were were.
- source_word: ἱματισμένον
  choice: yi uwe
  rationale: Nke a na-egosi mgbanwe dị n’ọnọdụ ya ma e jiri ya tụnyere ịgba ọtọ ya na mbụ.
- source_word: σωφρονοῦντα
  choice: uche ya dịkwa mma
  rationale: Nke a na-egosi na ezi uche na njide onwe onye alaghachila ya, n’enweghị itinye okwu ọgwụgwọ uche nke oge a n’ime ederede ahụ.
- source_word: ἐφοβήθησαν
  choice: Egwu wee tụọ ha
  rationale: Nke a bụ akpaalaokwu Igbo dị ndụ ma doo anya maka egwu jidere ha.
theological_decisions:
- issue: Otu e si akọwa δαιμόνια n’akụkọ nchụpụ mmụọ
  choice: ndị mmụọ ọjọọ
  alternative: ndị mmụọ ọjọọ na-akpa mmadụ arụ
  rationale: Nhọrọ ahụ na-edobe ndị mmụọ ahụ dị ka ndị dị adị n’akụkọ ahụ, na-emeghị ka ha bụrụ naanị ihe atụ ma ọ bụ ọrịa.
- issue: Ihe σωφρονοῦντα pụtara mgbe ndị mmụọ ọjọọ pụtachara
  choice: uche ya dịkwa mma
  alternative: nwere ezi uche
  rationale: Nhọrọ a na-egosi na nwoke ahụ alaghachila n’ọnọdụ ezi uche na njide onwe ya, ma ọ naghị etinye nkọwa sayensị ma ọ bụ ozizi ọzọ na-adịghị n’ederede.
- issue: Ọnọdụ nwoke ahụ n’ụkwụ Jizọs
  choice: nọ ọdụ n’ụkwụ Jizọs
  alternative: nọ ọdụ n’akụkụ ụkwụ Jizọs
  rationale: A hapụrụ okwu ahụ ka ọ gosipụta ebe ọ nọ n’enweghị ikwu hoo haa na ọ bụ ọnọdụ onye na-eso ụzọ, ọ bụ ezie na ihe dị otú ahụ nwere ike ịdị n’azụ okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu Grik ahụ ụzọ atọ ka ọ daa nke ọma n’Igbo, ma usoro ihe omume na njikọ ha ka echekwara. E debere akara nkọwa [b] n’akụkụ nkebi ọ metụtara na [a] n’akụkụ okwu σωφρονοῦντα, kama ịhapụ ha n’ebe nwere ike iduhie onye na-agụ ya.
