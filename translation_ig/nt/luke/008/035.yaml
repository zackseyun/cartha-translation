  naturalness: 'A small revision improves idiomatic clarity: “n’ụkwụ Jizọs” can sound less precise in Standard Igbo for a location beside someone''s feet. “n’akụkụ ụkwụ Jizọs” naturally expresses the locative force of παρά while retaining no added implication of discipleship.'
  terminology: “ndị mmụọ ọjọọ” is an appropriate, comprehensible rendering of δαιμόνια. “uche ya dịkwa mma” naturally renders σωφρονοῦντα in this context. “Jizọs” and the remaining terminology are consistent with Standard Igbo usage.
