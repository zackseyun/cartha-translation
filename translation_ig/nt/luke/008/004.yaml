id: LUK.8.4
reference: Luke 8:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: ig
  text: Mgbe nnukwu ìgwè mmadụ nọ na-ezukọta, ndị si n’obodo dị iche iche na-abịakwute ya, o ji ilu kwuo okwu:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “o kwuru okwu n’ilu.” Okwu Grik διὰ παραβολῆς nwere ike ịpụta ihe o ji kwuo okwu ma ọ bụ ụzọ o si kwuo ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: nọ na-ezukọta
  rationale: Nkebi a bụ genitive absolute ma na-egosi ihe na-aga n’ihu; ‘nọ na-ezukọta’ na-egosi ìgwè mmadụ na-agbakọta n’ụzọ Igbo dị ndụ.
- source_word: δὲ
  choice: Mgbe
  rationale: N’ahịrịokwu a, njikọ oge nke genitive absolute na-eburu aga n’ihu akụkọ ahụ nke ọma; usoro ‘Mgbe ...’ bụ ụzọ Igbo nkịtị isi jikọta ọnọdụ ahụ na ihe Jizọs mere.
- source_word: ὄχλου πολλοῦ
  choice: nnukwu ìgwè mmadụ
  rationale: ‘Nnukwu’ na-egosi πολλοῦ, ‘ìgwè mmadụ’ na-egosikwa ὄχλος n’Igbo doro anya.
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: ndị si n’obodo dị iche iche na-abịa
  rationale: κατὰ πόλιν nwere echiche nkesa—ndị si n’obodo n’obodo; ‘obodo dị iche iche’ na-ewepụta echiche ahụ n’Igbo eke.
- source_word: πρὸς αὐτόν
  choice: na-abịakwute ya
  rationale: Ngwaa ‘ịbịakwute’ na-egosi ngagharị ruo n’ebe ọ nọ, kwekọrọ na πρός tinyere accusative.
- source_word: εἶπεν
  choice: kwuo okwu
  rationale: ‘Kwuo okwu’ na-adabara nkebi na-esochi ya nke na-akọ ụzọ o si kwuo ya.
- source_word: διὰ παραβολῆς
  choice: ji ilu kwuo okwu
  rationale: διά tinyere genitive nwere ike igosi ihe e ji mee ihe ma ọ bụ ụzọ e si mee ya; ‘ji ilu’ na-egosi ụzọ/ngwaọrụ ahụ n’Igbo nkịtị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. E ji ‘ilu’ sụgharịa παραβολή n’ụzọ ndị nkịtị ga-aghọta; e deberekwa mgbagwoju anya dị n’etiti ụzọ/ngwaọrụ n’ihe odide na nkọwa ala peeji.
