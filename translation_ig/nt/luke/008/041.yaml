  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: ig
  text: Ma lee, otu nwoke aha ya bụ Jairọs bịara; ọ bụ onyeisi ụlọ nzukọ. Ọ dara n’ụkwụ Jizọs, na-arịọ ya ka ọ bata n’ụlọ ya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Na-egosipụta ihe a chọrọ ka onye na-agụ ya lebara anya; ọ dabara na usoro akụkọ dị ùgwù n’Igbo.
- source_word: ἄρχων τῆς συναγωγῆς
  choice: onyeisi ụlọ nzukọ ndị Juu
  rationale: Na-egosipụta na Jairọs bụ onye ndu n’ụlọ nzukọ, ma kọwaa ụdị ụlọ nzukọ ahụ nke ọma nye ndị Igbo taa.
- source_word: πεσὼν παρὰ τοὺς πόδας
  choice: Ọ dara n’ala n’akụkụ ụkwụ
  rationale: Na-edobe ma omume nke ịda n’ala ma παρὰ, nke pụtara ịnọ n’akụkụ ma ọ bụ n’ihu ụkwụ.
- source_word: παρεκάλει
  choice: na-arịọ
  rationale: Ụdị ngwaa a na-egosi arịrịọ siri ike nke na-aga n’ihu n’ọnọdụ a.
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: ka ọ bata n’ụlọ ya
  rationale: Nsụgharị Igbo dị nkenke ma kwekọọ n’ihe odide Grik kwuru banyere ịbanye n’ụlọ Jairọs.
theological_decisions:
- issue: Ọkwa Jairọs n’ụlọ nzukọ
  choice: onyeisi ụlọ nzukọ ndị Juu
  alternative: onye na-achị ụlọ nzukọ ndị Juu
  rationale: “Onyeisi” na-egosi ọrụ ndu n’enweghị ịkọwapụta kpọmkwem ụdị ikike ya karịa ihe okwu Grik kwuru.
- issue: Ọnọdụ Jairọs n’ụkwụ Jizọs
  choice: n’akụkụ ụkwụ Jizọs
  alternative: n’ụkwụ Jizọs
  rationale: Nhọrọ a na-edobe nkọwa παρὰ ma zere ime ka ahịrịokwu ahụ kwuo kpọmkwem na ọ dakwasịrị ụkwụ ya.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma doo anya nye ndị nkịtị. E ji “Jairọs” na “Jizọs” mee transliteration aha ndị ahụ; ahịrịokwu ahụ na-ejedebe na kọma n’ihi na amaokwu na-esonụ na-aga n’ihu n’otu ahịrịokwu Grik ahụ.
