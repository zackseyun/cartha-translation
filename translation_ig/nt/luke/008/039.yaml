id: LUK.8.39
reference: Luke 8:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: ig
  text: “Laghachi n’ụlọ gị, kọọkwa ihe niile Chineke meere gị.” Ọ wee pụọ, na-ekwusa n’obodo ahụ dum ihe niile Jizọs meere ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: Laghachi
  rationale: Ọ bụ iwu ka nwoke ahụ laghachi n’ebe o si bịa; “laghachi” bụ okwu Igbo doro anya ma kwekọọ n’echiche ὑποστρέφω.
- source_word: εἰς τὸν οἶκόν σου
  choice: n’ụlọ gị
  rationale: “Ụlọ” nwere ike ịpụta ụlọ mmadụ ma ọ bụ ebe obibi ya, ya mere ọ na-eburu obosara echiche οἶκος n’Igbo eke.
- source_word: διηγοῦ
  choice: kọọkwa
  rationale: “Kọọ” na-egosi ịkọ ihe mere, nke kwekọrọ na διηγέομαι; “-kwa” jikọtara iwu a na iwu ịlaghachi.
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: ihe niile Chineke meere gị
  rationale: ὅσα na-ezo aka n’ihe niile e mere. Nsụgharị a adịghị atụkwasị okwu pụtara “ihe ukwu” nke na-adịghị n’ederede Grik.
- source_word: ἀπῆλθεν
  choice: Ọ wee pụọ
  rationale: “Pụọ” na-egosi na ọ hapụrụ ebe ahụ; “wee” na-eme ka usoro akụkọ ahụ bụrụ Igbo eke.
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: n’obodo ahụ dum
  rationale: Nke a na-egosi na nkwusa ahụ gbasara akụkụ niile nke obodo ahụ.
- source_word: κηρύσσων
  choice: na-ekwusa
  rationale: “Na-ekwusa” na-eburu echiche nke ikwupụta ozi n’ihu ọha, nke siri ike karịa nanị ịkọrọ mmadụ okwu.
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: ihe niile Jizọs meere ya
  rationale: Nhọrọ a na-edobe myirịta okwu dị n’etiti ihe Chineke mere na ihe Jizọs mere, n’enweghị nkọwa agbakwunyere.
theological_decisions:
- issue: Myirịta dị n’etiti “Chineke” n’iwu Jizọs na “Jizọs” n’ihe nwoke ahụ kwusara
  choice: 'E debere okwu abụọ ahụ dịka ha dị: “Chineke meere gị” na “Jizọs meere ya.”'
  alternative: Ime ka ahịrịokwu abụọ ahụ jiri naanị “Chineke” ma ọ bụ naanị “Jizọs,” ma ọ bụ ịgbakwunye nkọwa na-ekwu na ha bụ otu onye a na-ekwu maka ya.
  rationale: Ederede Luk tinyere “Chineke” na “Jizọs” n’ọnọdụ yiri ibe ha n’enweghị nkọwa ọzọ. Nsụgharị ahụ na-edobe ike na esemokwu nkà mmụta okpukpe a kama idozi ya n’aha onye na-agụ ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. “N’ụlọ gị” bụ okwu eke nke nwere ike ịpụta ụlọ ma ọ bụ ebe obibi, ebe “na-ekwusa” na-egosi nkwupụta n’ihu ọha.
