id: LUK.8.10
reference: Luke 8:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: ig
  text: Ọ sịrị, “E nyela unu ịmata ihe omimi[a] nke alaeze Chineke; ma ndị ọzọ na-anata ya n’ilu[c], ka ha na-ahụ, ma ha ghara ịhụ, na-anụkwa, ma ha ghara ịghọta.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “ihe nzuzo.” Okwu Grik a na-ekwu maka eziokwu nke alaeze Chineke e zoro ezo n’ebe ụfọdụ nọ ma kpughee nye ndị ọzọ.
    reason: lexical_alternative
  - marker: b
    text: Okwu a, “ka ha na-ahụ, ma ha ghara ịhụ, na-anụkwa, ma ha ghara ịghọta,” na-emegharị Aịzaya 6:9–10. A pụrụ ịghọta ya dịka nzube ikpe Chineke, ihe ikpe ahụ rụpụtara, ma ọ bụ ha abụọ.
    reason: cross_reference
  - marker: c
    text: 'N’ụzọ na-esochi usoro Grik nso karị: “ma nye ndị ọzọ n’ilu.”'
    reason: previous_rendering
lexical_decisions:
- source_word: δέδοται
  choice: E nyela
  rationale: 'Nke a na-egosipụta perfect passive: ihe e nyere ha n’oge gara aga ka dịịrị ha ugbu a, ma ahapụrụ onye nyere ya n’ezoghị aha dịka Grik si mee.'
- source_word: γνῶναι
  choice: ịmata
  rationale: “Ịmata” bụ ntụgharị kpọmkwem nke γινώσκω ma na-edobe ọdịiche ya na συνιῶσιν (“ịghọta”) nke dị n’ọgwụgwụ amaokwu ahụ.
- source_word: μυστήρια
  choice: ihe omimi
  rationale: “Ihe omimi” bụ okwu Igbo doro anya ma kwesị ekwesị maka eziokwu Chineke zoro ezo nke ọ na-ekpughe; ọ karịrị echiche nke nanị ozi nzuzo.
- source_word: βασιλείας τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Okwu a bụ ntụgharị Igbo a maara nke ọma, ma nwee ike ịgụnye ma ọchịchị Chineke ma ebe ọchịchị ya ruru.
- source_word: τοῖς δὲ λοιποῖς
  choice: ma nye ndị ọzọ
  rationale: “Ndị ọzọ” na-ezo aka n’ụfọdụ ndị fọdụrụ, n’etinyeghị okwu “ndị nọ n’èzí” nke sitere n’akụkụ ọzọ yiri nke a.
- source_word: ἐν παραβολαῖς
  choice: ọ bụ n’ilu
  rationale: A gbakwụnyere “ọ bụ” iji mee ka nkebi ahịrịokwu Grik nke hapụrụ ngwaa ghara ịdị mkpirikpi ma sie ike n’Igbo, ebe “n’ilu” na-edobe ụzọ e si enye ha nkuzi ahụ.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” na-edobe ohere nke nzube, ihe si na ya pụta, ma ọ bụ ha abụọ, n’enweghị idozi esemokwu ahụ n’otu ụzọ.
- source_word: βλέποντες μὴ βλέπωσιν
  choice: ka ha na-ahụ ma ghara ịhụ
  rationale: A hapụrụ mmegharị nke otu ngwaa ahụ iji chekwaa ụda na mgbagwoju anya nke ntụaka Aịzaya, kama ịkọwa nke abụọ ozugbo dịka “ịghọta ihe ha hụrụ.”
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: na-anụkwa ma ghara ịghọta
  rationale: Nke a na-ekewa ịnụ ihe na ịghọta ya nke ọma, dịka okwu Grik abụọ ahụ si dị.
theological_decisions:
- issue: Ike nke nkebiokwu ἵνα n’ụda Aịzaya 6:9–10
  choice: ka ha na-ahụ ma ghara ịhụ, na-anụkwa ma ghara ịghọta
  alternative: nke mere na ha na-ahụ ma ha adịghị ahụ, na-anụkwa ma ha adịghị aghọta
  rationale: “Ka” anaghị eme ka okwu ahụ bụrụ naanị nzube Chineke ma ọ bụ naanị ihe ikpe ya rụpụtara; ọ na-ahapụ esemokwu nke dị na Grik na ntụaka Aịzaya ka ọ dị.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ nrụgide dị n’etiti ịhụ na enweghị ịhụ, nakwa n’etiti nzube na ihe si na ya pụta; a kọwaghị ya n’ụzọ ga-akwado ozizi otu ụka.
