id: LUK.8.30
reference: Luke 8:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: ig
  text: Mgbe ahụ, Jizọs jụrụ ya, “Gịnị bụ aha gị?” Ọ zara, “Lijiọn,”[a] n’ihi na ọtụtụ ndị mmụọ ọjọọ abanyela n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lijiọn” bụ okwu e si na Latịn nweta, nke na-akpọ nnukwu usuu ndị agha Rom; n’ebe a, ọ na-egosi na ọtụtụ ndị mmụọ ọjọọ nọ n’ime nwoke ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: jụrụ
  rationale: Ngwaa a na-ewebata ajụjụ a jụrụ kpọmkwem; “jụrụ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-eji kwa ụbọchị.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-eme ka akụkọ gaa n’ihu. “Mgbe ahụ” na-egosi usoro ihe mere n’enweghị itinye nkwusi ike karịrị nke Grik.
- source_word: Τί σοι ὄνομά ἐστιν
  choice: Gịnị bụ aha gị?
  rationale: Nke a bụ ụzọ Igbo si ajụ ajụjụ ahụ n’ụzọ ebumpụta ụwa, ma ọ na-edobe ihe okwu Grik pụtara.
- source_word: Λεγιών
  choice: Lijiọn
  rationale: A sụgharịghị aha a dị ka nkọwa; e dere ya ka ụda ya kwekọọ n’usoro mkpụrụedemede na mkpọpụta Igbo. Ihe ọ na-ezo aka na ya dị n’ala Rom ka akọwara n’ala peeji.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Okwu a na-enye ihe kpatara aha ahụ ji bụrụ “Lijiọn”; “n’ihi na” na-egosipụta njikọ ihe kpatara ya nke ọma.
- source_word: εἰσῆλθεν
  choice: abanyela
  rationale: Ụdị a na-egosi na nbanye ndị mmụọ ọjọọ ahụ emeela tupu a kpọọ aha “Lijiọn,” ma ọ naghị atụkwasị ihe ọzọ na nkwupụta Grik.
- source_word: δαιμόνια πολλὰ
  choice: ọtụtụ ndị mmụọ ọjọọ
  rationale: Nke a na-edobe ma echiche banyere ihe ndị mmụọ ọjọọ bụ ma ọnụ ọgụgụ ha dị ukwuu, n’asụsụ Igbo doro anya.
- source_word: εἰς αὐτόν
  choice: n’ime ya
  rationale: “N’ime ya” na-edobe ntụziaka nke εἰς, ya bụ na ndị mmụọ ọjọọ banyere n’ime nwoke ahụ.
theological_decisions:
- issue: Nsụgharị δαιμόνια n’akụkọ banyere ndị mmụọ ọjọọ batara mmadụ
  choice: ndị mmụọ ọjọọ
  alternative: mmụọ ọjọọ
  rationale: “Ndị mmụọ ọjọọ” na-egosi nke ọma na amaokwu ahụ na-ekwu banyere ọtụtụ ihe ime mmụọ nwere ajọ omume, ma ọ naghị eme ka nkwupụta Grik dị nro.
- issue: Oge εἰσῆλθεν mere ma e jiri ya tụnyere azịza “Lijiọn”
  choice: abanyela
  alternative: banyeere
  rationale: “Abanyela” na-eme ka o doo anya na nbanye ahụ bu ụzọ mee tupu nkọwa aha ahụ, dịka njikọ okwu dị n’amaokwu ahụ si egosi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ “Ọ zara” kama nsụgharị kpọmkwem “ọ sịrị” n’ihi na okwu ahụ bụ azịza nye ajụjụ Jizọs; nke a anaghị agbanwe ihe Grik pụtara.
