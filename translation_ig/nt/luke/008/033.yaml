review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the sequence: the demons leave the man, enter the pigs, and the herd rushes down into the lake and drowns. However, “mkpọda ugwu” specifies a mountain, whereas κρημνός denotes a steep slope, bank, or precipice and does not itself identify a mountain.'
  naturalness: The wording is generally natural Standard Igbo. “Mmiri wee rie ha” is an idiomatic and comprehensible way to express drowning in this context. Adding “wee” before “banye” makes the coordinated action sequence especially clear.
  terminology: “Ndị mmụọ ọjọọ” appropriately renders δαιμόνια, preserving the distinction from “mmụọ na-adịghị ọcha.” “ọdọ mmiri” correctly renders λίμνη. The topographical expression should avoid the added element “ugwu” (mountain).
  issues:
  - severity: medium
    issue: “mkpọda ugwu ahụ” adds “mountain.”
    rationale: The Greek κρημνός conveys a precipitous descent/slope or cliff, but does not state that it is a mountain. “mkpọda ahụ” preserves the required steep descent without this added geographical specification.
  - severity: low
    issue: The footnote alternatives likewise introduce “ugwu.”
    rationale: “ọnụ ugwu” and “elu ugwu” add mountain imagery not required by the Greek. The note should describe the lexical range as a steep slope or precipice without that addition.
  revised_text: Mgbe ahụ, ndị mmụọ ọjọọ ahụ si n’ime nwoke ahụ pụta, wee banye n’ime ezi ndị ahụ. Ìgwè ezi ahụ wee jiri ọsọ gbadaa ná mkpọda ahụ[a], daba n’ọdọ mmiri, mmiri wee rie ha.
  revised_footnotes:
