    text: A pụkwara ịsụgharị ya, “gbadaa n’akụkụ nkume dị nkpoda ahụ” ma ọ bụ “gbadaa n’ebe dị nkpoda ahụ”; okwu Grik ahụ na-egosi mkpọda dị nkpoda.
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported specification that the descent was on a mountain, while retaining the Greek sense of a steep downward course. It also revises the footnote consistently and makes the consecutive action “entered” explicit with “wee.”
