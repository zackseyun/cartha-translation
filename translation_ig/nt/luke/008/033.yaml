  to: Mgbe ahụ, ndị mmụọ ọjọọ ahụ si n’ime nwoke ahụ pụta, wee banye n’ime ezi ndị ahụ. Ìgwè ezi ahụ wee jiri ọsọ gbadaa ná mkpọda ahụ[a], daba n’ọdọ mmiri, mmiri wee rie ha.
