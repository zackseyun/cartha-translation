id: LUK.8.33
reference: Luke 8:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: ig
  text: Mgbe ahụ, ndị mmụọ ọjọọ ahụ si n’ime nwoke ahụ pụta, wee banye n’ime ezi ndị ahụ. Ìgwè ezi ahụ wee jiri ọsọ gbadaa ná mkpọda ahụ[a], daba n’ọdọ mmiri, mmiri wee rie ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gbadaa n’akụkụ nkume dị nkpoda ahụ” ma ọ bụ “gbadaa n’ebe dị nkpoda ahụ”; okwu Grik ahụ na-egosi mkpọda dị nkpoda.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα
  choice: si n’ime ... pụta
  rationale: Aorist participle ahụ na-egosi ihe mere tupu isi ngwaa; ntụgharị a na-egosi usoro omume ahụ n’Igbo doro anya ma ghara ịdị arọ.
- source_word: τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka δαιμόνια, ma ọ naghị edochi ya n’okwu ọzọ sara mbara dịka ‘mmụọ na-adịghị ọcha.’
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: si n’ime nwoke ahụ
  rationale: Ọ na-ezo aka kpọmkwem n’ahụ nwoke ahụ a kpọtụrụla aha, ọ bụghị mmadụ n’ozuzu.
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: banye n’ime ezi ndị ahụ
  rationale: Ọ na-egosi ngagharị banye n’ime anụmanụ ndị ahụ n’Igbo nkịtị ma doo anya.
- source_word: ἡ ἀγέλη
  choice: ìgwè ezi ahụ
  rationale: ‘Ìgwè ezi’ bụ ụzọ doro anya isi kwuo otu ìgwè anụmanụ ndị a.
- source_word: ὥρμησεν
  choice: jiri ọsọ
  rationale: Ọ na-egosi ngagharị mberede na nke siri ike n’enweghị ịgbakwụnye ihe kpatara ya.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: gbadaa ná mkpọda ugwu ahụ
  rationale: Nke a na-echekwa echiche nke ngagharị gbadata n’ebe kpọdara akpọda, na-enweghị ịmanye echiche na ọ bụ ọnụ ọnụ ugwu kwụ ọtọ kpamkpam.
- source_word: εἰς τὴν λίμνην
  choice: daba n’ọdọ mmiri
  rationale: λίμνη pụtara ọdọ mmiri; ‘daba’ na-egosi ngagharị ha banye na ya n’ụzọ sitere n’ọsọ ahụ.
- source_word: ἀπεπνίγη
  choice: mmiri wee rie ha
  rationale: Nke a bụ akpaala okwu Igbo dị ndụ ma doo anya nke pụtara na ha riri mmiri nwụọ.
theological_decisions:
- issue: Otu e si sụgharịa δαιμόνια n’akụkọ a
  choice: ndị mmụọ ọjọọ
  alternative: ndị mmụọ na-adịghị ọcha
  rationale: Amaokwu a ji δαιμόνια, ya mere a họọrọ okwu na-anọchi anya ya kpọmkwem kama iji okwu ọzọ yiri ya nke Agba Ọhụrụ na-eji n’ebe ndị ọzọ.
- issue: Oke nkọwa a ga-etinye na κρημνός
  choice: mkpọda ugwu
  alternative: ọnụ ọnụ ugwu / elu ugwu kpọdara akpọda
  rationale: Okwu Grik ahụ na-egosi ebe siri ike agbadata, ma ọ naghị amanye ka a ghọta ya dịka nkume kwụ ọtọ kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mmiri wee rie ha’ bụ akpaala okwu Igbo a na-ahụkarị maka iri mmiri nwụọ; e debere ìgwè ezi ahụ dịka ọtụtụ anụmanụ n’ahịrịokwu ikpeazụ ka okwu ahụ daa nke ọma n’Igbo.
