id: LUK.8.13
reference: Luke 8:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: ig
  text: Ndị ahụ nọ n’elu nkume bụ ndị, mgbe ha nụrụ okwu ahụ, ji ọṅụ nabata ya. Ma ndị a enweghị mgbọrọgwụ; ha na-ekwere naanị nwa oge, ma n’oge ule, ha na-ahapụ okwukwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: dị n’elu nkume
  rationale: Nke a na-edobe ihe atụ nke nkume dịka Grik si kwuo ya, n’enweghị ịgbasa ya ka ọ bụrụ ‘ala okwute.’
- source_word: ἀκούσωσιν
  choice: mgbe ha nụrụ
  rationale: 'Ụdị a bụ Igbo nkịtị maka ihe na-eme mgbe ọ bụla: ozugbo ha nụrụ ozi ahụ.'
- source_word: μετὰ χαρᾶς
  choice: ji ọṅụ
  rationale: Ọ na-egosipụta n'ụzọ dị mfe na nke eke ọṅụ ha ji nabata okwu ahụ.
- source_word: δέχονται τὸν λόγον
  choice: nabata okwu ahụ
  rationale: ‘Nabata’ dabara na δέχομαι, ebe ‘okwu ahụ’ na-edobe akpaalaokwu Akwụkwọ Nsọ ma na-ezo aka n’ozi a kwusara.
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: enweghị mgbọrọgwụ
  rationale: A hapụrụ mgbọrọgwụ n’ọnụọgụ otu dịka Grik, ma debe ihe atụ ahụ nkenke.
- source_word: πρὸς καιρὸν
  choice: ruo nwa oge
  rationale: Nke a na-egosi oge dị mkpirikpi ma ọ bụ okwukwe na-adịghị adịgide.
- source_word: πιστεύουσιν
  choice: ha na-ekwere
  rationale: Nke a bụ ntụgharị kpọmkwem na nke na-anọpụ iche; ọ naghị ekpebi ụdị okwukwe ha nwere n’ụzọ ozizi.
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: n’oge a na-anwale ha
  rationale: ‘Anwale’ na-eburu echiche sara mbara nke ule ma ọ bụ ọnwụnwa, ma kwado nhazi oge dị na Grik.
- source_word: ἀφίστανται
  choice: ha na-adapụ
  rationale: Nke a na-egosi na ha si n’ihe ha kwere na mbụ pụọ, n’enweghị iji okwu nkà mmụta okpukpe siri ike ma ọ bụ ịgbakwunye ihe Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Ma πιστεύουσιν ọ̀ pụtara ezi okwukwe nzọpụta ka ọ bụ nkwenye elu ọnụ
  choice: ha na-ekwere
  alternative: ha yiri ka ha kwere; ha nwere ezi okwukwe ma mesịa dapụ; ha kwere naanị n’elu ọnụ
  rationale: Amaokwu ahụ kwuru na ha na-ekwere ruo nwa oge ma mesịa dapụ, ma ọ naghị edozi esemokwu ozizi gbasara ntachi obi n’okwukwe, ndapụ n’okwukwe, ma ọ bụ ụdị okwukwe ahụ.
- issue: Ihe πειρασμός pụtara n’ebe a
  choice: oge a na-anwale ha
  alternative: oge ọnwụnwa; mgbe ule ma ọ bụ mkpagbu bịara
  rationale: Okwu Grik ahụ nwere ike ịpụta ule, nsogbu, ma ọ bụ ọnwụnwa. Isiokwu ahụ na-ahapụ ohere ndị a, ya mere e ji okwu sara mbara mee isi ederede ma debe ndị ọzọ n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-edobe ihe atụ nke nkume na mgbọrọgwụ, nakwa esemokwu dị n’etiti ‘ikwere ruo nwa oge’ na ‘ịdapụ,’ n’enweghị ịmanye nkọwa otu ụka.
