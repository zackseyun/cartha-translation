revisions:
- from: Ma ndị ahụ dị n’elu nkume bụ ndị, mgbe ha nụrụ okwu ahụ, ji ọṅụ nabata ya. Ma ndị a enweghị mgbọrọgwụ; ha na-ekwere ruo nwa oge, ma n’oge a na-anwale ha[a], ha na-adapụ.
  to: Ndị ahụ nọ n’elu nkume bụ ndị, mgbe ha nụrụ okwu ahụ, ji ọṅụ nabata ya. Ma ndị a enweghị mgbọrọgwụ; ha na-ekwere naanị nwa oge, ma n’oge ule, ha na-ahapụ okwukwe.
  rationale: The revision makes the final verb’s contextual sense clear in natural Igbo, while retaining the source’s neutral statement that they believe only temporarily and later depart. It also renders πειρασμός with the broad term “ule” and preserves lexical alternatives in the footnote. The footnote anchor remains [a] after “ule.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:25:26Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the principal clauses and preserves the verse’s theological restraint. However, “ha na-adapụ” can suggest merely falling rather than withdrawing from prior belief, while ἀφίστανται in this context denotes departure/defection. “n’oge a na-anwale ha” is a possible contextual interpretation, but “n’oge ule” more directly retains the Greek’s concise, broad genitive expression.
  naturalness: The revised wording uses clear Standard Igbo and keeps the parabolic imagery compact. “Ha na-ahapụ okwukwe” communicates the contextual force naturally and unambiguously; “ha na-ekwere naanị nwa oge” idiomatically expresses the limited duration.
  terminology: “Okwu ahụ,” “ọṅụ,” “mgbọrọgwụ,” and “okwukwe” are suitable biblical-register Igbo terms. “Ule” retains πειρασμός broadly, while the footnote preserves “ọnwụnwa” and a fuller alternative.
  issues:
  - severity: medium
    issue: “ha na-adapụ” is semantically too open in this context.
    rationale: Although it can be understood figuratively, it may primarily evoke physical falling. The Greek ἀφίστανται here means that they withdraw or turn away after believing; the revision states this contextual referent without resolving theological debates about the quality of their belief.
  - severity: low
    issue: “n’oge a na-anwale ha” makes the testing explicitly directed at them.
    rationale: This is compatible with the context, but ἐν καιρῷ πειρασμοῦ is more tersely and broadly “in a time of testing/trial.” “n’oge ule” better preserves that breadth.
  revised_text: Ndị ahụ nọ n’elu nkume bụ ndị, mgbe ha nụrụ okwu ahụ, ji ọṅụ nabata ya. Ma ndị a enweghị mgbọrọgwụ; ha na-ekwere naanị nwa oge, ma n’oge ule, ha na-ahapụ okwukwe.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’oge ọnwụnwa” ma ọ bụ “mgbe ule bịara.” Okwu Grik ahụ nwere ike ịpụta ule, nnwale, ma ọ bụ ọnwụnwa, dịka ọnọdụ ya si dị.
    reason: lexical_alternative
  revision_rationale: The revision makes the final verb’s contextual sense clear in natural Igbo, while retaining the source’s neutral statement that they believe only temporarily and later depart. It also renders πειρασμός with the broad term “ule” and preserves lexical alternatives in the footnote. The footnote anchor remains [a] after “ule.”
