  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: ig
  text: Mmụọ ya laghachiri[a], o wee bilie ozugbo; Jizọs wee nye iwu ka e nye ya ihe ọ ga-eri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ume ya laghachiri.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: lọghachi
  rationale: Ọ na-egosi na ihe ahụ laghachiri n’ebe ọ nọbu; n’ebe a, ọ bụ mweghachi ndụ nwa agbọghọ ahụ.
- source_word: τὸ πνεῦμα αὐτῆς
  choice: Mụọ ya
  rationale: “Mụọ” na-echekwa nghọta bụ isi nke πνεῦμα n’akụkọ mbilite n’ọnwụ a, ma a pụkwara ịghọta okwu Grik ahụ dịka ume ndụ.
- source_word: ἀνέστη
  choice: o wee bilie
  rationale: Nke a bụ okwu Igbo doro anya ma kwesịkwa ekwesị maka omume ya nke ibili ozugbo ndụ laghachiri.
- source_word: παραχρῆμα
  choice: ozugbo
  rationale: Ọ na-egosipụta na o nweghị oge gafere tupu nwa agbọghọ ahụ ebilie.
- source_word: διέταξεν
  choice: nye iwu
  rationale: Ọ na-echekwa ikike dị na διατάσσω ma na-ada nke ọma n’Igbo mgbe a na-enye ntụziaka doro anya.
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: ka e nye ya ihe ọ ga-eri
  rationale: Nke a na-egosipụta ma δοθῆναι (“ka e nye”) ma φαγεῖν (“iri”), n’ụzọ Igbo nkịtị ma doo anya.
theological_decisions:
- issue: Ihe πνεῦμα pụtara n’ọnọdụ mweghachi onye nwụrụ anwụ na ndụ
  choice: Mụọ ya wee lọghachi
  alternative: Ume ya wee lọghachi
  rationale: “Mụọ” na-echekwa obosara na ibu nkà mmụta okpukpe nke πνεῦμα n’akụkọ a, na-enweghị ime ka ọ bụrụ naanị iku ume; e debere “ume” n’ala ala peeji dịka nghọta ọzọ okwu ahụ nwere ike ibu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E jiri “wee” jikọta usoro omume atọ dị n’ahịrịokwu Grik ahụ. A kpọrọ Jizọs aha n’ahịrịokwu ikpeazụ iji mee ka onye nyere iwu doo anya n’Igbo, ebe onye nnọchi aha Grik ahụ na-ezo aka n’ebe ọ nọ na akụkọ gbara amaokwu a gburugburu.
