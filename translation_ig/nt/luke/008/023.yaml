  to: Ka ha na-aga n’ụgbọ mmiri, ụra wee buru ya. Oké ifufe wee rịdata n’ọdọ mmiri ahụ, mmiri wee na-ejupụta n’ụgbọ ha, ha nọkwa n’ihe ize ndụ.
