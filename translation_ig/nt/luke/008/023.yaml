source:
  edition: SBLGNT
  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: ig
  text: Ka ha na-aga n’ụgbọ mmiri, ụra wee buru ya. Oké ifufe wee rịdata n’ọdọ mmiri ahụ, mmiri wee na-ejupụta n’ụgbọ ha, ha nọkwa n’ihe ize ndụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: Ka ha nọ na-aga n’ụgbọ mmiri
  rationale: Nkebiokwu a na-egosi ihe na-aga n’ihu n’otu oge ahụ; ntụgharị a na-ada nke ọma n’Igbo ma na-egosi na ha nọ n’ime njem ụgbọ mmiri.
- source_word: ἀφύπνωσεν
  choice: ụra wee buru ya
  rationale: Nke a na-egosi na ọ malitere ihi ụra, ọ bụghị nanị ọnọdụ nke ịnọ n’ụra; ọ bụkwa ụzọ Igbo nkịtị si ekwu ya.
- source_word: κατέβη
  choice: si n’elu daa
  rationale: Nhọrọ a na-echekwa onyonyo nke ifufe ahụ isi n’elu rịdata, dịka ngwaa Grik si kwuo.
- source_word: λαῖλαψ ἀνέμου
  choice: Oké ifufe
  rationale: Ọ na-egosi ajọ ifufe siri ike n’asụsụ Igbo doro anya ma bụrụ nke mmadụ niile na-aghọta.
- source_word: εἰς τὴν λίμνην
  choice: n’elu ọdọ mmiri ahụ
  rationale: Ọ bụ ụzọ Igbo kwekọrọ n’okike si akọwa ifufe nke rịdatara metụta ọdọ mmiri ahụ, n’agbanyeghị na εἰς nwere echiche nkịtị nke ‘banye n’ime.’
- source_word: συνεπληροῦντο
  choice: mmiri nọ na-ejupụta ụgbọ ha
  rationale: Ụdị ọtụtụ na Grik nwere ike ịpụta na ihe nọ na-ejupụta ha; n’ọnọdụ akụkọ a, ụgbọ mmiri juputara na mmiri bụ ihe e bu n’uche. A na-etinye nkọwa ọzọ n’okpuru iji ghara izochi ọdịdị okwu Grik.
- source_word: ἐκινδύνευον
  choice: ha nọkwa n’ihe ize ndụ
  rationale: Ọ na-echekwa echiche nke ọnọdụ ihe ize ndụ na-aga n’ihu, ma na-ada nke ọma n’Igbo ugbu a.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ okwu ndị mmadụ na-eji kwa ụbọchị n’enweghị ịhapụ onyonyo na usoro ihe omume dị n’akwụkwọ Grik.
