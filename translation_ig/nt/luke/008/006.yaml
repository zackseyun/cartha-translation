  text: καὶ ἕτερον ⸀κατέπεσεν ἐπὶ τὴν πέτραν, καὶ φυὲν ἐξηράνθη διὰ τὸ μὴ ἔχειν ἰκμάδα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: ig
  text: Mkpụrụ ọzọ dakwara n’elu nkume[a]; mgbe o pulitere, ọ kpọnwụrụ n’ihi na o nweghị mmiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘n’elu oké nkume.’ N’asụsụ Grik, ‘nkume’ dị n’otu ọnụọgụ, na-edobe onyinyo mkpụrụ dara n’elu nkume, ọ bụghị n’ala jupụtara na nkume.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: Mkpụrụ ọzọ
  rationale: Ọ bụ okwu nnọchiaha e ji na-anọchi mkpụrụ ọzọ n’usoro ilu ahụ; itinye ‘mkpụrụ’ n’Igbo na-eme ka ihe a na-ekwu doo anya n’enweghị ịgbanwe echiche ya.
- source_word: κατέπεσεν
  choice: dakwara
  rationale: Na-egosi na mkpụrụ ahụ dara, ebe ‘-kwara’ na-ejikọta nke a na mkpụrụ ndị ọzọ e kwuru n’usoro ahụ.
- source_word: ἐπὶ τὴν πέτραν
  choice: n’elu nkume
  rationale: Na-edobe πέτρα dị ka otu ‘nkume,’ kama ịgbasa ya ka ọ bụrụ ala jupụtara na nkume.
- source_word: φυὲν
  choice: mgbe o pulitere
  rationale: 'Na-enye participle ahụ nghọta oge: mkpụrụ ahụ buru ụzọ pulite tupu o kpọnwụọ.'
- source_word: ἐξηράνθη
  choice: ọ kpọnwụọ
  rationale: Ọ bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na ihe ọkụkụ akpọnwụla.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: n’ihi na o nweghị
  rationale: Na-edobe ihe kpatara ya nke διά tinyere infinitive nwere article na-egosi.
- source_word: ἰκμάδα
  choice: mmiri
  rationale: N’ọnọdụ ihe ọkụkụ, ‘mmiri’ bụ okwu doro ndị na-agụ akwụkwọ anya maka mmiri dị mkpa ka ihe pulitere ghara ịkpọ nkụ; ọ naghị akọwa ya dịka ‘sap,’ nke ga-adị warara karịa okwu Grik.
