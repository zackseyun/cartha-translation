  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: ig
  text: Ha nọ na-achị ya ọchị, n’ihi na ha maara na ọ nwụọla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: nọ na-achị ya ọchị
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu n’oge ahụ; ‘nọ na-achị ... ọchị’ na-egosikwa na ọ bụ ịkwa emo, ọ bụghị nanị ịchị ọchị.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha genitive a bụ onye a na-achị ọchị; n’Igbo, a na-etinye ya n’etiti akpaalaokwu ‘ịchị mmadụ ọchị.’
- source_word: εἰδότες
  choice: n’ihi na ha maara
  rationale: Ọ bụ participle nke na-enye ihe kpatara omume ha; nkebiokwu a na-eme ka mmekọrịta nke ihe kpatara ya doo anya n’Igbo nkịtị.
- source_word: ὅτι
  choice: na
  rationale: 'Ọ na-ewebata ọdịnaya nke ihe ha maara: na ọ nwụọla.'
- source_word: ἀπέθανεν
  choice: ọ nwụọla
  rationale: Aorist a na-ekwu maka ọnwụ dịka ihe mezuru; ‘nwụọla’ na-egosi na ọnwụ ahụ emeela tupu mmeghachi omume ha.
theological_decisions:
- issue: Ma a ga-akpọpụta nwa agbọghọ ahụ aha n’ebe Grik nwere naanị ngwaa onye nke atọ otu
  choice: ọ nwụọla
  alternative: nwatakịrị ahụ anwụọla
  rationale: Ihe gbara amaokwu ahụ gburugburu na-eme ka onye a na-ekwu maka ya doo anya. Iji ‘ọ’ na-edobe nkenke nke isi mmalite ma ghara itinye aha ọhụrụ n’ederede.
translation_notes:
  register: Igbo Ọkọlọtọ nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. ‘Ịchị mmadụ ọchị’ bụ akpaalaokwu ebumpụta ụwa maka ịkwa mmadụ emo; usoro ‘nọ na-’ na-egosipụta omume na-aga n’ihu.
