  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: ig
  text: n’ihi na o nwere naanị otu nwa nwanyị[a], onye dị ihe dị ka afọ iri na abụọ, ọ nọkwa na-anwụ anwụ. Ma ka Jizọs na-aga, ìgwè mmadụ ahụ na-akwagide ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwa nwanyị naanị ya.”
    reason: lexical_alternative
  - marker: c
    text: Ngwaa Grik ahụ nwere ike ịpụta na ìgwè mmadụ ahụ na-akpagide ya nke ukwuu, nke na ọ fọrọ obere ka ha zọpịa ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: naanị otu nwa nwanyị
  rationale: N'ebe a okwu ahụ pụtara nwa nwanyị ya naanị ya, ọ bụghị echiche pụrụ iche gbasara ịmụ nwa; ntụgharị a na-egosipụta ịdị naanị otu nke ọma n'Igbo.
- source_word: ὡς ἐτῶν δώδεκα
  choice: ihe dị ka afọ iri na abụọ
  rationale: ὡς n'ihu ọnụ ọgụgụ na-egosi na afọ ahụ bụ nke e mere atụmatụ, ọ bụghị ọnụ ọgụgụ a kapịrị ọnụ.
- source_word: ἀπέθνῃσκεν
  choice: ọ nọkwa na-anwụ anwụ
  rationale: Ụdị imperfect na-egosi ọnọdụ ọnwụ na-aga n'ihu, ọ bụghị na ọ nwụọlarị.
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: Ma ka Jizọs na-aga
  rationale: Articular infinitive ahụ na-egosi ihe na-eme n'otu oge ahụ. E jiri aha Jizọs mee ka onye a na-ekwu maka ya doo anya n'Igbo, n'agbanyeghị na Grik ji nnọchiaha.
- source_word: οἱ ὄχλοι
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ ezie na Grik ji plural, okwu mkpokọta a bụ ụzọ Igbo sitere n'okike isi kọwaa ọtụtụ mmadụ gbakọrọ ọnụ n'ebe ahụ.
- source_word: συνέπνιγον
  choice: na-akwagide ya n’akụkụ niile
  rationale: Nke a na-egosi mkpakọ siri ike nke ìgwè mmadụ ahụ n'ụzọ doro anya, ma ọ naghị ekwubiga okwu ókè dị ka ịsị na ha na-akpagbu ume ya n'ezie.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ejikọta amaokwu a na arịrịọ Jairọs dị n'amaokwu gara aga ma na-akọwa ihe mere arịrịọ ahụ ji dị ngwa.
- source_word: αὐτῷ
  choice: o nwere
  rationale: Dative jikọtara na ἦν na-egosi inwe ihe; “o nwere” bụ ntụgharị Igbo sitere n'okike.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere njikọ ihe kpatara ya, afọ e mere atụmatụ, na omume ọnwụ na-aga n'ihu. A haziri akara nkọwa ụkwụ ka ha soro okwu ha na-akọwa ozugbo.
