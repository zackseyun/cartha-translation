- from: Ma mgbe ọ hụrụ Jizọs, o tiri mkpu, daa n’ala n’ihu ya, were oké olu sị, “Gịnị ka mụ na gị nwekọrọ, Jizọs, Ọkpara Chineke Onye Kachasị Elu?[a] Ana m arịọ gị, emekpala m ahụ.”
  to: Ma mgbe ọ hụrụ Jizọs, o tiri mkpu, o dara n’ala n’ihu ya, were oké olu sị, “Gịnị ka mụ na gị nwekọrọ, Jizọs, Ọkpara Chineke Kasị Elu?[a] Ana m arịọ gị, emekpala m ahụhụ.”
  rationale: The revision repairs the narrative grammar, renders the divine title with the clear established expression 'Chineke Kasị Elu,' and makes the request not to torment him adequately explicit. It retains the source’s twofold vocal emphasis ('tiri mkpu' and 'were oké olu'), the ambiguity of the idiom, and the original footnote anchor.
