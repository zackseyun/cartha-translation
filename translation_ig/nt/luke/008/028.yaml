id: LUK.8.28
reference: Luke 8:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: ig
  text: Ma mgbe ọ hụrụ Jizọs, o tiri mkpu, o dara n’ala n’ihu ya, were oké olu sị, “Gịnị ka mụ na gị nwekọrọ, Jizọs, Ọkpara Chineke Kasị Elu?[a] Ana m arịọ gị, emekpala m ahụhụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị, “Gịnị dị n’etiti mụ na gị?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: mgbe ọ hụrụ
  rationale: Aorist participle ahụ na-egosi ọnọdụ mere tupu ngwaa ndị bụ isi; nkebi a bụ Igbo dị mfe ma na-edobe nghọta oge ya.
- source_word: ἀνακράξας
  choice: o tiri mkpu
  rationale: Okwu a na-egosi iti mkpu ike; ntụgharị a bụ nke nkịtị ma ghara ijikọta ya na φωνῇ μεγάλῃ nke sochiri.
- source_word: προσέπεσεν αὐτῷ
  choice: daa n’ala n’ihu ya
  rationale: Nke a na-egosi mmadụ ịda n’ihu onye ọzọ n’ọnọdụ nrubeisi ma ọ bụ oke ahụhụ; ọ naghị agbakwụnye kpọmkwem na ọ dara n’ụkwụ ya.
- source_word: φωνῇ μεγάλῃ
  choice: were oké olu
  rationale: Nke a na-edobe nkọwa doro anya banyere olu siri ike ma bụrụkwa okwu Igbo e ji akọ akụkọ n'ụzọ eke.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Gịnị ka mụ na gị nwekọrọ
  rationale: Akpaalaokwu a na-egosi ịjụ mmekọrịta ma ọ bụ itinye aka; ntụgharị ahụ na-edobe ọdịdị ajụjụ na esemokwu dị na Grik n’enweghị ịkọwa ya gabiga ókè.
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: Ọkpara Chineke Onye Kachasị Elu
  rationale: Nke a na-edobe aha nsọpụrụ ahụ na nkwupụta banyere onye Jizọs bụ, n’enweghị ịgbakwunye nkọwa ozizi.
- source_word: δέομαί σου
  choice: Ana m arịọ gị
  rationale: Ọ na-egosi arịrịọ siri ike; n’Igbo, usoro a bụ nke eke, kpọmkwem, ma dịkwa nsọpụrụ.
- source_word: μή με βασανίσῃς
  choice: emekpala m ahụ
  rationale: βασανίζω nwere ike ịpụta inye ahụhụ dị ukwuu; okwu Igbo a na-egosi mmekpa ahụ siri ike n’enweghị ime ka ọ bụrụ naanị ahụhụ anụ ahụ.
theological_decisions:
- issue: Otú e si tụgharị nkwupụta mmụọ ọjọọ banyere onye Jizọs bụ
  choice: Jizọs, Ọkpara Chineke Onye Kachasị Elu
  alternative: Jizọs, Ọkpara nke Chineke Kachasị Elu
  rationale: Nhọrọ ahụ na-edobe ike christological nke okwu Grik ahụ ma ghara ịgbasa ya ka ọ bụrụ usoro nkwupụta okwukwe e dere mgbe e mesịrị.
- issue: Ihe akpaalaokwu Τί ἐμοὶ καὶ σοί pụtara
  choice: Gịnị ka mụ na gị nwekọrọ
  alternative: Gịnị ka ị chọrọ ime m?
  rationale: Nhọrọ a na-echekwa nghọta nke ịjụ mmekọrịta ma ọ bụ itinye aka, ma ghara ikpebi naanị otu nzube pụrụ ịdị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ nkwughachi dị n’etiti “tiri mkpu” na “were oké olu” n’ihi na ha abụọ dị na isi mmalite Grik. E tinyere akara ndetu ala peeji [a] ozugbo n’ebe akpaalaokwu ahụ metụtara.
