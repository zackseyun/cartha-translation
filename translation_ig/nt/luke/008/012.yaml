id: LUK.8.12
reference: Luke 8:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: ig
  text: Ndị nọ n'akụkụ ụzọ ahụ bụ ndị nụrụla okwu ahụ. Mgbe ahụ Ekwensu na-abịa wepụ okwu ahụ[a] n'obi ha, ka ha ghara ikwere ma bụrụ ndị a zọpụtara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Okwu ahụ” n'ebe a bụ ozi Chineke e kwusara n'ilu a.
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: n'akụkụ ụzọ ahụ
  rationale: Nke a na-egosipụta ọnọdụ mkpụrụ ahụ n'akụkụ ụzọ, dịka παρά tinyere accusative si dị, ma bụrụkwa Igbo a na-asụ n'ụzọ dị mfe.
- source_word: ἀκούσαντες
  choice: ndị nụrụla okwu ahụ
  rationale: Ụdị ‘nụrụla’ na-egosi ndị a kọwara dịka ndị nụwororị ozi ahụ; itinye ‘okwu ahụ’ na-eme ka ihe ha nụrụ doo anya site n'ihe gbara amaokwu ahụ gburugburu.
- source_word: εἶτα
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe mere n'usoro na-esote.
- source_word: ὁ διάβολος
  choice: Ekwensu
  rationale: N'okwu a, ọ bụ aha onye ajọ mmụọ ahụ, ọ bụghị naanị nkọwa nke onye nkwutọ.
- source_word: αἴρει
  choice: wepụ
  rationale: Ọ na-enye echiche iwepụ ma ọ bụ iburu okwu ahụ pụọ, na-agbakwụghị echiche nke ime ihe n'ike nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: τὸν λόγον
  choice: okwu ahụ
  rationale: Ọ na-edobe akpaalaokwu Akwụkwọ Nsọ, ebe ihe gbara ya gburugburu na-egosi na ọ bụ ozi Chineke e kwusara.
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: n'obi ha
  rationale: ‘Obi’ na-edobe echiche Akwụkwọ Nsọ banyere ebe echiche, ọchịchọ, na nzaghachi mmadụ si apụta; ‘ha’ na-egosipụta plural nke Grik.
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: ka ha ghara ikwere, e wee zọpụta ha
  rationale: Nke a na-edobe ebumnuche ma ọ bụ ihe omume Ekwensu na-achọ ka o pụta, ma na-egosi ikwere na nzọpụta n'usoro okwu ahụ n'enweghị ịkọwa mmekọrịta ha karịa ihe Grik kwuru.
- source_word: πιστεύσαντες
  choice: ikwere
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị atụgharị πιστεύω n'ọnọdụ metụtara okwukwe.
- source_word: σωθῶσιν
  choice: e wee zọpụta ha
  rationale: Ụdị a na-edobe passive nke Grik ma na-egosi nzọpụta n'echiche mgbapụta zuru ezu, ọ bụghị naanị ịnapụta mmadụ n'ihe ize ndụ oge ahụ.
theological_decisions:
- issue: Mmekọrịta dị n'etiti ikwere na nzọpụta
  choice: ka ha ghara ikwere, e wee zọpụta ha
  alternative: ka ha ghara ikwere ma bụrụ ndị a zọpụtara
  rationale: Nsụgharị a na-edobe usoro nke participle πιστεύσαντες na passive σωθῶσιν, ma ọ naghị etinye ozizi otu ụka banyere kpọmkwem otú okwukwe na nzọpụta si metụta.
- issue: Ebumnuche ma ọ bụ nsonaazụ dị na ἵνα μή
  choice: ka ha ghara
  alternative: nke mere na ha agaghị
  rationale: ‘Ka ha ghara’ na-egosipụta ebumnuche Ekwensu nke ọma, ebe nkọwa ala peeji na-ekweta na ἵνα μή nwekwara ike ịgụnye ndò nke nsonaazụ n'okwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A họọrọ ‘Ekwensu,’ ‘obi,’ na ‘zọpụta’ dịka okwu Akwụkwọ Nsọ ndị mmadụ maara, ma zere okwu ochie ma ọ bụ nkọwa nke otu ụka pụrụ iche.
