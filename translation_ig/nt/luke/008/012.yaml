revisions:
- from: Ndị nọ n'akụkụ ụzọ ahụ bụ ndị nụrụla okwu ahụ. Mgbe ahụ Ekwensu na-abịa, wepụ okwu ahụ[a] n'obi ha, ka ha ghara ikwere, e wee zọpụta ha.[b]
  to: Ndị nọ n'akụkụ ụzọ ahụ bụ ndị nụrụla okwu ahụ. Mgbe ahụ Ekwensu na-abịa wepụ okwu ahụ[a] n'obi ha, ka ha ghara ikwere ma bụrụ ndị a zọpụtara.
  rationale: The revision corrects the non-idiomatic verb sequence, preserves the Greek present action and purposive clause, and retains established biblical terminology. The unsupported purpose/result footnote is removed; no doctrinal interpretation is added.
