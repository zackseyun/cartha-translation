review_pass:
  verdict: revise
  source_fidelity: The draft conveys the verse’s principal meaning, including the plural “hearts” and the purpose clause. However, “na-abịa, wepụ” combines an imperfective verb with an imperative-form verb and does not render the present δράση of αἴρει naturally. The explanatory object “okwu ahụ” with “nụrụla” is contextually permissible, though not explicit in the Greek participle.
  naturalness: “Ekwensu na-abịa, wepụ okwu ahụ” is not idiomatic Standard Igbo. “Ekwensu na-abịa wepụ okwu ahụ” is natural and expresses the sequential present action. “Ka ha ghara ikwere ma bụrụ ndị a zọpụtara” avoids the awkward impersonal sequence “e wee zọpụta ha” while retaining the passive sense of σωθῶσιν.
  terminology: “Ekwensu,” “okwu ahụ,” “obi ha,” “ikwere,” and “ndị a zọpụtara” are established, comprehensible biblical terms in Standard Igbo. The existing footnote claiming that ἵνα μή may express either purpose or result is unnecessary here and may blur the clause’s clear purposive force.
  issues:
  - severity: medium
    issue: Verb form after “na-abịa”
    rationale: 'The form “wepụ” is imperative in ordinary Standard Igbo usage. The Greek has the present indicative αἴρει (“takes away”), and the Igbo sequence should use the infinitival/complement form: “na-abịa wepụ.”'
  - severity: low
    issue: Final-clause footnote overstates ambiguity
    rationale: 'In this construction ἵνα μή straightforwardly expresses the devil’s purpose: preventing belief and salvation. The proposed alternative is not needed for lexical fidelity and introduces an avoidable purpose/result ambiguity.'
  revised_text: Ndị nọ n'akụkụ ụzọ ahụ bụ ndị nụrụla okwu ahụ. Mgbe ahụ Ekwensu na-abịa wepụ okwu ahụ[a] n'obi ha, ka ha ghara ikwere ma bụrụ ndị a zọpụtara.
  revised_footnotes:
  - marker: a
    text: “Okwu ahụ” n'ebe a bụ ozi Chineke e kwusara n'ilu a.
    reason: cross_reference
  revision_rationale: The revision corrects the non-idiomatic verb sequence, preserves the Greek present action and purposive clause, and retains established biblical terminology. The unsupported purpose/result footnote is removed; no doctrinal interpretation is added.
