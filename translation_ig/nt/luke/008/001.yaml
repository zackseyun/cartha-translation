id: LUK.8.1
reference: Luke 8:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: ig
  text: Mgbe nke a gasịrị, o wee na-agagharị site n’otu obodo ukwu gaa n’obodo ukwu ọzọ, sitekwa n’otu obodo nta gaa n’obodo nta ọzọ,[a] na-ekwusa ma na-ezisa ozi ọma banyere alaeze Chineke.[b] Ndị Iri na Abụọ sokwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “n’obodo ukwu dị iche iche na n’obodo nta dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọchịchị Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: Mgbe obere oge gasịrị, o wee
  rationale: Nke a na-egosi na ihe a mere n’usoro akụkọ obere oge ka ihe ndị bu ya ụzọ gasịrị. “O wee” na-edobe usoro ịkọ akụkọ ahụ n’ụzọ Igbo dị mma n’enweghị okwu ochie ma ọ bụ nke siri ike.
- source_word: διώδευεν
  choice: na-agagharị
  rationale: Ụdị imperfect ahụ na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; “na-agagharị” na-egosipụta njem ya n’ebe dị iche iche.
- source_word: κατὰ πόλιν καὶ κώμην
  choice: site n’otu obodo ukwu gaa n’obodo ukwu ọzọ, sitekwa n’otu obodo nta gaa n’obodo nta ọzọ
  rationale: κατά tinyere aha ndị a n’otu n’otu nwere echiche nkesa, ya bụ, ịga n’otu ebe ruo n’ebe ọzọ. Nsụgharị a na-eme ka omume a na-eme ugboro ugboro pụta ìhè.
- source_word: κηρύσσων
  choice: na-ekwusa
  rationale: “Na-ekwusa” na-egosi nkwupụta a na-eme n’ihu ọha, na-emeghị ka okwu ahụ bụrụ naanị ikwusa ozi n’ụlọ nzukọ.
- source_word: εὐαγγελιζόμενος
  choice: na-ezisa ozi ọma
  rationale: Nhọrọ a na-edobe ọdịiche dị n’etiti εὐαγγελίζομαι na κηρύσσω ma na-egosipụta echiche nke izisa ozi ọma.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: banyere alaeze Chineke
  rationale: “Alaeze Chineke” bụ okwu sara mbara nke nwere ike ịgụnye ma ọchịchị Chineke ma ebe ọchịchị ya ruru; “banyere” na-eme ka ahịrịokwu Igbo na-aga nke ọma.
- source_word: οἱ δώδεκα
  choice: Ndị Iri na Abụọ
  rationale: Nke a na-edobe aha e ji amata ìgwè ahụ n’etinyeghị “ndị na-eso ụzọ” ma ọ bụ “ndị ozi,” okwu ndị Grik na-ekwughị ebe a.
- source_word: σὺν αὐτῷ
  choice: sokwa ya
  rationale: “Sokwa ya” na-egosi na Ndị Iri na Abụọ nọnyere ya ma soro ya na njem ahụ.
theological_decisions:
- issue: Nsụgharị βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  alternative: ọchịchị Chineke
  rationale: “Alaeze Chineke” na-edobe obosara ihe βασιλεία nwere ike ịpụta, ma mpaghara ọchịchị ma omume Chineke ji achị, n’ebughị ụzọ mechie ihe ọ pụtara n’otu akụkụ naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ usoro “site n’otu … gaa n’ọzọ” iji mee ka nkesa na omume ugboro ugboro nke κατά pụta ìhè; e debere “Ndị Iri na Abụọ” dịka aha ìgwè ahụ.
