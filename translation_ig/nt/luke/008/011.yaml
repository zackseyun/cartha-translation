  text: Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: ig
  text: 'Ma nke a bụ ilu ahụ: mkpụrụ ahụ bụ okwu Chineke[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ihe ilu ahụ pụtara bụ nke a.” N’ụzọ nkịtị, Grik kwuru, “Nke a bụ ilu ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν
  choice: bụ
  rationale: Ngwaa njikọ a na-ewebata nkọwa Jizọs n'ụzọ kwụ ọtọ; ‘bụ’ na-edobe usoro Grik karịa ịsị ‘pụtara.’
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi ntakịrị ntụgharị site n’ilu ahụ gaa na nkọwa ya; ‘Ma’ na-egosi mgbanwe ahụ n’Igbo n’enweghị ime ya ka ọ bụrụ usoro oge.
- source_word: αὕτη ἡ παραβολή
  choice: ilu ahụ bụ nke a
  rationale: Nke a na-edobe ihe Grik kwuru n’ụzọ dị nso—‘ilu ahụ bụ nke a’—kama itinye okwu nkọwa ‘ihe ilu ahụ pụtara’ n’ahịrịokwu bụ isi.
- source_word: ὁ σπόρος
  choice: mkpụrụ ahụ
  rationale: ‘Mkpụrụ’ bụ okwu Igbo doro anya maka mkpụrụ a na-akụ; ihe ngosi ‘ahụ’ kwekọrọ na definite article ma na-ezo aka ná mkpụrụ dị n’ilu ahụ.
- source_word: ὁ λόγος
  choice: okwu
  rationale: ‘Okwu’ na-eburu ma echiche nke okwu e kwuru ma nke ozi e nyere, ma na-edobekwa ụda Akwụkwọ Nsọ nke λόγος.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: N’usoro Igbo, ‘okwu Chineke’ na-egosipụta genitive ‘okwu nke Chineke’ n’ụzọ eke ma dị nkenke.
theological_decisions:
- issue: Ma a ga-asụgharị παραβολή naanị dịka ‘ilu’ ka a ga-agbakwunye ‘ihe ilu ahụ pụtara.’
  choice: ilu ahụ bụ nke a
  alternative: ihe ilu ahụ pụtara bụ nke a
  rationale: Ọ bụ ezie na gburugburu okwu ahụ na-egosi na Jizọs na-akọwa ilu ahụ, Grik n’onwe ya kwuru n’ụzọ nkịtị ‘ilu ahụ bụ nke a.’ Nsụgharị bụ isi na-edobe okwu ahụ na ntakịrị mgbagwoju ya; ihe ọzọ dị n’ala ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji ‘ilu’ mee παραβολή, ‘mkpụrụ’ mee σπόρος, na ‘okwu Chineke’ mee λόγος τοῦ θεοῦ. Akara ntụaka [a] dị n’ahịrịokwu bụ isi dịka achọrọ.
