  to: Ha niile nọ na-akwa ákwá ma na-eruru ya újú. Ma ọ sịrị, “Unu akwụsịla ịkwa ákwá, n’ihi na ọ nwụghị anwụ, kama ọ na-ehi ụra[a].”
