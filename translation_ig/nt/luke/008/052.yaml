review_pass:
  verdict: revise
  source_fidelity: The main text accurately retains the imperfect, ongoing mourning ('nọ na-akwa ákwá'), the universal subject, the paired actions of weeping and lamenting, the prohibitive command, the causal clause, and Jesus’ unqualified contrast between death and sleep. 'Na-eruru ya újú' naturally conveys lamenting/mourning for her without importing the possible accompanying gesture of self-beating. The footnote, however, goes beyond the verse by specifying that Jesus was about to restore the girl to life.
  naturalness: The wording is clear, idiomatic Standard Igbo, and appropriately solemn. 'Unu akwụsịla ịkwa ákwá' fits the ongoing action in context, and 'ọ nwụghị anwụ, kama ọ na-ehi ụra' preserves the narrative’s striking formulation naturally.
  terminology: 'Key terms are well handled: ''ịkwa ákwá'' and ''iru újú'' distinguish weeping from mourning; ''ihi ụra'' preserves the Greek sleep imagery. The note should describe the figurative usage without supplying a narrative-theological explanation as though it were part of this verse.'
  issues:
  - severity: medium
    issue: The footnote says that Jesus uses sleep imagery because he is going to restore the girl to life.
    rationale: That explanatory causal claim is not expressed in Luke 8:52. Although the wider narrative reports her restoration, the translation note should preserve the verse’s metaphorical tension rather than explain or predetermine its meaning.
  revised_text: Ha niile nọ na-akwa ákwá ma na-eruru ya újú. Ma ọ sịrị, “Unu akwụsịla ịkwa ákwá, n’ihi na ọ nwụghị anwụ, kama ọ na-ehi ụra[a].”
  revised_footnotes:
