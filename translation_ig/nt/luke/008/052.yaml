  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: ig
  text: Ha niile nọ na-akwa ákwá ma na-eruru ya újú. Ma ọ sịrị, “Unu akwụsịla ịkwa ákwá, n’ihi na ọ nwụghị anwụ, kama ọ na-ehi ụra[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọ nọ n’ụra.” N’ebe a, okwu ‘ihi ụra’ bụ ihe atụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: nọ na-akwa ákwá
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu; ‘nọ na-akwa ákwá’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: πάντες
  choice: Ha niile
  rationale: Nke a na-edobe echiche na ndị niile nọ ebe ahụ so na-akwa ákwá.
- source_word: ἐκόπτοντο αὐτήν
  choice: na-eruru ya újú
  rationale: N’ọnọdụ iru újú, κόπτομαι na-ezo aka n’ịkwa arịrị na omume iru újú; okwu a na-enye nghọta ahụ n’enweghị ịgbakwụnye na ha na-eti onwe ha ihe.
- source_word: Μὴ κλαίετε
  choice: Unu akwụsịla ịkwa ákwá
  rationale: Present imperative tinyere μή nwere ike ịkpọ ndị mmadụ ka ha kwụsị omume ha na-eme ugbu a; ebe ha nọ na-akwa ákwá, ntụgharị a doro anya ma bụrụ nke e ji eme ihe n’Igbo.
- source_word: οὐ γὰρ
  choice: n’ihi na ... nwụghị
  rationale: γάρ na-enye ihe kpatara iwu ahụ; ‘n’ihi na’ na-egosipụta njikọ nkọwa a nke ọma.
- source_word: ἀπέθανεν
  choice: ọ nwụghị anwụ
  rationale: Nke a na-edobe nkwupụta Jizọs dị ka ịgọnahụ na ọnwụ mere, n’asụsụ Igbo sitere n’okike.
- source_word: καθεύδει
  choice: ọ na-ehi ụra
  rationale: Present tense na ihe oyiyi nke ihi ụra ka e debere n’ụdị ngwaa, kama ịkọwa ya dị ka ọnọdụ naanị.
theological_decisions:
- issue: Okwu Jizọs na nwa agbọghọ ahụ ‘anwụghị anwụ, kama ọ na-ehi ụra’
  choice: E debere okwu ahụ kpọmkwem dịka Jizọs kwuru ya, tinyere ihe oyiyi nke ihi ụra.
  alternative: ‘Ọ bụghị na ọ nwụrụ kpamkpam’ ma ọ bụ ‘ọ dị ka onye nwụrụ anwụ ma ọ na-ehi ụra n’ezie.’
  rationale: Isi mmalite ahụ na-ahapụ esemokwu dị n’etiti ọnwụ a hụrụ anya na nkọwa Jizọs banyere ihi ụra. Tụgharị ya n’enweghị ịkọwa ihe ọ pụtara n’ime amaokwu ahụ na-echekwa nghọta na esemokwu nkà mmụta okpukpe ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘iru újú’ gosipụta akwa arịrị n’enweghị ịmanye echiche nke iti onwe onye ihe; akara ụda dị na ‘ákwá’ na ‘újú’ na-enyere aka izere mgbagwoju anya.
