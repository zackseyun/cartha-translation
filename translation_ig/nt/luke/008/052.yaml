    text: A pụkwara ịsị, “ọ nọ n’ụra.” N’ebe a, okwu ‘ihi ụra’ bụ ihe atụ.
    reason: lexical_alternative
  revision_rationale: Only the footnote is revised. It retains the legitimate lexical alternative while identifying the sleep expression as figurative, without adding an explanation about the anticipated restoration that is not stated in the verse itself.
