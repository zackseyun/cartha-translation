  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: ig
  text: Ndị hụrụ ihe ahụ kọọrọ ha otú a zọpụtara nwoke ahụ mmụọ ọjọọ ji.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otú a gwọrọ nwoke ahụ,” ma ọ bụ, “otú a napụtara nwoke ahụ.” Ngwaa Grik ahụ nwere ike ịpụta ịzọpụta, ịgwọ ọrịa, ma ọ bụ ịnapụta, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: kọọrọ
  rationale: Ngwaa a pụtara ịkọ ma ọ bụ izigara ndị ọzọ akụkọ. “Kọọrọ ha” dabara n’ọnọdụ ebe ndị ji anya ha hụ ihe merenụ na-agwa ndị ọzọ ya, ma bụrụkwa Igbo dị mfe ma kwanyere ugwu.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu, ọ bụghị ihe na-egosi nnukwu mmegide. “Wee” na-eme ka usoro akụkọ ahụ gaa nke ọma n’Igbo.
- source_word: οἱ ἰδόντες
  choice: Ndị hụrụ ihe ahụ
  rationale: Nkebi a na-ezo aka ná ndị ji anya ha hụ ihe merenụ. “Ihe ahụ” na-ejikọta ya na ihe ndị e kwuru n’amaokwu ndị bu ụzọ n’ebughị nkọwa ọzọ abụghị nke dị n’isi mmalite.
- source_word: πῶς
  choice: otú
  rationale: “Otú” na-egosi ụzọ ma ọ bụ ọnọdụ ihe ahụ si mee, ma na-echekwa ihe πῶς pụtara n’ebe a.
- source_word: ἐσώθη
  choice: e si zọpụta
  rationale: σῴζω nwere ike ịpụta ịzọpụta, ịgwọ ọrịa, ma ọ bụ ịnapụta n’aka ihe ọjọọ. “Zọpụta” na-echekwa obosara ihe okwu Grik ahụ pụrụ ịpụta, ebe ndetu ala na-egosi nhọrọ ndị dabara n’ọnọdụ a.
- source_word: ὁ δαιμονισθείς
  choice: nwoke ahụ mmụọ ọjọọ ji
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-aghọta nke ọma isi kwuo na nwoke ahụ nọ n’okpuru ike mmụọ ọjọọ. Ọ na-ezere okwu teknụzụ siri ike ma na-echekwa ntụaka ahụ gbasara nwoke ahụ.
theological_decisions:
- issue: Ihe ἐσώθη (σῴζω) pụtara n’akụkọ nchụpụ mmụọ ọjọọ na mgbake
  choice: e si zọpụta
  alternative: e si gwọọ; e si napụta
  rationale: Okwu Grik ahụ nwere ike ịpụta nzọpụta, ọgwụgwọ, ma ọ bụ nnapụta. Ide “zọpụta” n’ahịrị bụ isi na-echekwa obosara ya na njikọ ya na echiche nzọpụta, ma ndetu ala na-egosi na “gwọọ” na “napụta” kwekọkwara n’ọnọdụ a. Nke a anaghị amanye amaokwu ahụ ikwu naanị maka ọgwụgwọ anụ ahụ ma ọ bụ naanị maka nzọpụta ime mmụọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma kwanyere ugwu. Usoro “mmụọ ọjọọ ji” bụ akpaalaokwu Igbo a na-aghọta nke ọma maka ịnọ n’okpuru ike mmụọ ọjọọ; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa otu okpukpe mee ya.
