review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. The draft’s “na-agọnahụ ya” is ambiguous and most naturally risks meaning that everyone was denying Jesus, rather than denying that they had touched him. The present action of both crowd verbs is also better represented with present-progressive wording. “Nna anyị ukwu” adds the possessive “anyị” (“our”), which is absent from Ἐπιστάτα and can carry a paternal/religious sense not required by the source.
  naturalness: The revised wording is idiomatic Standard Igbo and makes the implied object of the denial clear without undue expansion. “Ìgwè mmadụ ahụ na-agba gị gburugburu ma na-akwagide gị” is natural, preserves the two related crowd actions, and avoids treating the surrounding as a completed past event.
  terminology: “Onye Nkụzi” is a clear and established respectful form of address in Standard Igbo for Ἐπιστάτα in this narrative setting. It does not introduce κύριος (“Lord”) or the added possessive/paternal nuance of “Nna anyị ukwu.”
  issues:
  - severity: medium
    issue: Ambiguous object in “Mgbè mmadụ niile nọ na-agọnahụ ya.”
    rationale: The Greek participle means that all were denying the implied claim/action in response to Jesus’ question. In Igbo, “agọnahụ ya” can be heard as denying him (Jesus). “Na-ekwu na ha emetụghị ya aka” states the contextual object clearly and retains the ongoing sense.
  - severity: medium
    issue: “Nna anyị ukwu” adds “anyị” and shifts the address.
    rationale: Ἐπιστάτα is vocative singular without a possessive pronoun. “Nna anyị ukwu” literally includes “our” and may suggest a paternal or religious title beyond the source. “Onye Nkụzi” is a natural respectful address and is the safer rendering.
  - severity: low
    issue: “gbachibidoro gị gburugburu” is perfect/completed while συνέχουσιν is present.
    rationale: The Greek describes what the crowds are currently doing. A present construction better preserves the immediate narrative scene.
  revised_text: Jizọs wee sị, “Ònye bụ onye metụrụ m aka?” Mgbe ha niile na-ekwu na ha emetụghị ya aka, Pita sịrị, “Onye Nkụzi, ìgwè mmadụ ahụ na-agba gị gburugburu ma na-akwagide gị[a].”
  revised_footnotes:
