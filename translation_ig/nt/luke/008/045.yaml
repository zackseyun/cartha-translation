revisions:
- from: Jizọs wee sị, “Ònye bụ onye metụrụ m aka?” Mgbe mmadụ niile nọ na-agọnahụ ya, Pita sịrị, “Nna anyị ukwu, ìgwè mmadụ ahụ gbachibidoro gị gburugburu, na-akwagidekwa gị[a].”
  to: Jizọs wee sị, “Ònye bụ onye metụrụ m aka?” Mgbe ha niile na-ekwu na ha emetụghị ya aka, Pita sịrị, “Onye Nkụzi, ìgwè mmadụ ahụ na-agba gị gburugburu ma na-akwagide gị[a].”
  rationale: The revision clarifies that everyone denied touching Jesus, preserves the present force of the crowd’s surrounding and pressing, and replaces an expanded paternal/possessive title with a natural respectful rendering of Ἐπιστάτα. The footnote remains anchored to the paired crowd verbs and supplies a viable alternative for the enclosing nuance of συνέχουσιν.
