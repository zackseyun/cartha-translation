  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: ig
  text: Jizọs wee sị, “Ònye bụ onye metụrụ m aka?” Mgbe ha niile na-ekwu na ha emetụghị ya aka, Pita sịrị, “Onye Nkụzi, ìgwè mmadụ ahụ na-agba gị gburugburu ma na-akwagide gị[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ìgwè mmadụ ahụ na-akpachi gị gburugburu ma na-akwagide gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁψάμενός
  choice: metụrụ m aka
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ doro anya na mmadụ metụrụ onye ọzọ ahụ́; ọ dabara n'ihe nwaanyị ahụ mere n'akụkọ a.
- source_word: ἀρνουμένων δὲ πάντων
  choice: Mgbe mmadụ niile nọ na-agọnahụ ya
  rationale: “Nọ na-agọnahụ” na-egosi omume na-aga n'ihu nke participle dị na Grik; “ya” na-ezo aka n'ịmetụ Jizọs aka.
- source_word: Ἐπιστάτα
  choice: Nna anyị ukwu
  rationale: Ọ bụ okwu nkwanye ùgwù nye onye nwere ikike. Nhọrọ a na-egosi ikike Jizọs n'etinyeghị aha “Onyenwe anyị,” ebe Grik ejighị κύριος.
- source_word: ὄχλοι
  choice: ìgwè mmadụ ahụ
  rationale: Igbo na-ejikarị aha mkpokọta a ekwu maka ọtụtụ ndị gbara otu onye gburugburu; ọ na-ada nke ọma karịa ịmanye ọtụtụ n'ụdị okwu Grik.
- source_word: συνέχουσίν
  choice: gbachibidoro gị gburugburu
  rationale: Nke a na-echekwa echiche nke ndị mmadụ gbara Jizọs gburugburu nke na ọ nweghị ohere ịgafe.
- source_word: ἀποθλίβουσιν
  choice: na-akwagidekwa gị
  rationale: Ọ na-egosi nrụgide ahụ́ nke igwe mmadụ n'ekwubigaghị ya ókè dị ka “na-egwepịa gị.”
theological_decisions:
- issue: Nsụgharị aha a kpọrọ Jizọs, Ἐπιστάτα
  choice: Nna anyị ukwu
  alternative: Onye Nkụzi; Onyenwe anyị
  rationale: Ἐπιστάτα na-egosi nkwanye ùgwù na nnabata ikike, ma ọ bụghị κύριος. Ya mere, a zere “Onyenwe anyị,” nke nwere ike itinye aha Kraịst siri ike karịa okwu Grik ebe a; “Onye Nkụzi” kwa ga-eme ka ihe okwu ahụ pụtara bụrụ naanị ọrụ izi ihe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Wee sị” na-eme ka usoro akụkọ ahụ na-aga nke ọma; “nọ na-agọnahụ” na-echekwa omume na-aga n'ihu. E debere akara nkọwa ala ala [a] ozugbo n'akụkụ ahịrịokwu ọ na-akọwa.
