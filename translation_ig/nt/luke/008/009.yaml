  text: Ἐπηρώτων δὲ αὐτὸν οἱ μαθηταὶ ⸀αὐτοῦ τίς ⸂αὕτη εἴη ἡ παραβολή⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/009.yaml
  text: Then his disciples asked him what this parable meant[a].
translation:
  language: ig
  text: Mgbe ahụ, ndị na-eso ụzọ ya jụrụ ya ihe ilu a pụtara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kwekọrọ nnọọ n’okwu Grik, “ihe ilu a pụrụ ịbụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτων
  choice: jụrụ
  rationale: Okwu-ngwaa a nọ n’oge imperfect, nke nwere ike igosi ajụjụ gara n’ihu ma ọ bụ nke e jụrụ ugboro; n’Igbo, “jụrụ” bụ ụzọ nkịtị ma doo anya isi kwuo ya n’akụkọ gara aga.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: δὲ bụ njikọ dị nro; “Mgbe ahụ” na-egosi usoro akụkọ n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ahụkarị maka μαθηταί ma na-echekwa echiche nke ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: ihe ilu a pụtara
  rationale: Ọ bụ ezie na Grik ahụ n’ụzọ nkịtị na-ajụ ihe ilu a ‘ga-abụ,’ ihe ajụjụ ahụ chọrọ bụ nkọwa ihe ilu ahụ; “ihe ilu a pụtara” na-ekwupụta nke ahụ n’Igbo dị mfe.
- source_word: παραβολή
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo a na-ejikarị akọwa παραβολή n’akụkọ Oziọma, ma dabara n’ebe a dịka akụkọ atụ nwere ihe ọ na-akụzi.
- source_word: εἴη
  choice: pụtara
  rationale: Optative a dị n’ajụjụ e kwuru n’ụzọ na-apụtachaghị kpọmkwem mgbe okwu-ngwaa isi nọ n’oge gara aga; “pụtara” na-enye ebumnuche ajụjụ ahụ n’Igbo eke.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E debere “ilu” dịka okwu Oziọma a maara nke ọma, ebe ihe odide bụ isi na-enye nkọwa ebumnuche ajụjụ ahụ; ndetu ala peeji na-echekwa ụdị okwu Grik nke na-edochaghị anya karịa.
