revisions:
- from: 'Nwoke ahụ ndị mmụọ ọjọọ si n’ime ya pụta nọ na-arịọsi ya ike ka ya na ya nọrọ; ma Jizọs zipụrụ ya, sị:'
  to: 'Nwoke ahụ ndị mmụọ ọjọọ si n’ime ya pụta na-arịọ Jizọs arịrịọ ike ka ya na Jizọs nọrọ; ma Jizọs zipụrụ ya, sị:'
  rationale: The revision retains the source’s imperfect, earnest entreaty and its plural demons, while resolving the potentially confusing pronouns by identifying Jesus in the request. No footnote is needed, since the clarification is supplied by the immediate narrative context and does not interpret a disputed reading.
  reviewer_model: gpt-5.6-terra
