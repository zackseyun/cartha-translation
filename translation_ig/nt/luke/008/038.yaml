id: LUK.8.38
reference: Luke 8:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: ig
  text: 'Nwoke ahụ ndị mmụọ ọjọọ si n’ime ya pụta na-arịọ Jizọs arịrịọ ike ka ya na Jizọs nọrọ; ma Jizọs zipụrụ ya, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: nọ na-arịọsi ya ike
  rationale: Ngwaa imperfect a na-egosi arịrịọ siri ike nke na-aga n’ihu ma ọ bụ nke a na-ekwughachi; “nọ na-arịọsi ya ike” na-egosipụta ma ịdịgide arịrịọ ahụ ma ịdị uchu ya n’Igbo nkịtị.
- source_word: ὁ ἀνὴρ
  choice: Nwoke ahụ
  rationale: ἀνήρ na-ezo aka kpọmkwem n’ nwoke ahụ a kpọtụrụla aha na akụkọ ahụ; “Nwoke ahụ” bụ ntụgharị doro anya ma kwekọọ na okike onye ahụ.
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ si n’ime ya pụta
  rationale: Nkebi a na-egosi na ndị mmụọ ọjọọ apụtalarị n’ime nwoke ahụ tupu arịrịọ ya; nhazi Igbo a bụ nke eke ma chekwaa echiche ịchụpụ mmụọ.
- source_word: τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị mmụọ ọjọọ dị ka ihe ndị nwere onwe ha, ọ naghị eme ka nkwupụta karịrị akarị nke akụkụ ahụ daa mbà.
- source_word: εἶναι σὺν αὐτῷ
  choice: ka ya na ya nọrọ
  rationale: Nke a na-edebe nghọta bụ́ ịnọnyere ya n’enweghị ịgbakwunye na ọ ga-eso ya gaa ebe niile ma ọ bụ nọrọ ruo oge a kapịrị ọnụ.
- source_word: ἀπέλυσεν αὐτόν
  choice: Jizọs zipụrụ ya
  rationale: Nushi nke okwu Igbo chọrọ ka onye mere ihe ahụ doo anya n’ebe nnọchiaha abụọ nwere ike ịkpata mgbagwoju anya; itinye “Jizọs” na-eme ka ntụziaka okwu doo anya n’agbanyeghị na aha ahụ sitere n’akụkọ gbara amaokwu a gburugburu.
- source_word: λέγων
  choice: 'sị:'
  rationale: “sị:” bụ ụzọ Igbo dị nkenke ma dị eke isi webata okwu onye ahụ ga-ekwu ozugbo.
theological_decisions:
- issue: Nkọwa nke τὰ δαιμόνια n’akụkọ ịchụpụ mmụọ
  choice: ndị mmụọ ọjọọ
  alternative: mmụọ ọjọọ
  rationale: Ụdị ọtụtụ nke Grik na-egosi ọtụtụ ndị mmụọ ọjọọ; “ndị mmụọ ọjọọ” na-echekwa ọnụ ọgụgụ ahụ na ngosipụta ha dị ka ndị na-eme ihe n’akụkọ ahụ.
- issue: Onye zitere nwoke ahụ
  choice: A kọwara onye ahụ dị ka Jizọs
  alternative: “ọ zipụrụ ya,” nke ga-edebe nnọchiaha Grik n’ụzọ kpọmkwem
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi Jizọs n’enweghị mgbagha. N’Igbo, ọtụtụ “ya/ọ” n’otu ahịrịokwu nwere ike ime ka onye zitere onye ọzọ ghara ido anya; aha ahụ na-eme ka ihe ederede pụtara doo anya n’enweghị mgbanwe n’ihe gbasara nkà mmụta okpukpe.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. A họọrọ “nọ na-arịọsi ya ike” iji gosipụta imperfect na ịdị uchu nke arịrịọ ahụ. E tinyere “Jizọs” kama nnọchiaha n’ahịrịokwu ikpeazụ iji zere mgbagwoju anya nke ọtụtụ “ya,” ebe njirimara ya doro anya n’ihe gbara amaokwu ahụ gburugburu.
