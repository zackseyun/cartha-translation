  to: Mgbe ọ rịdara n’ala[a], otu nwoke si n’obodo ahụ, onye nwere ndị mmụọ ọjọọ, zutere ya. Kemgbe ogologo oge, ọ dịghị eyi uwe, ọ dịghịkwa anọ n’ụlọ, kama ọ na-anọ n’etiti ili.
