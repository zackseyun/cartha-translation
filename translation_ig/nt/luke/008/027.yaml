id: LUK.8.27
reference: Luke 8:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: ig
  text: Mgbe ọ rịdara n’ala[a], otu nwoke si n’obodo ahụ, onye nwere ndị mmụọ ọjọọ, zutere ya. Kemgbe ogologo oge, ọ dịghị eyi uwe, ọ dịghịkwa anọ n’ụlọ, kama ọ na-anọ n’etiti ili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Mgbe ọ rutere n’ala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι ... αὐτῷ ἐπὶ τὴν γῆν
  choice: Mgbe ọ rịpụtara n’elu ala[a]
  rationale: Nkebi participle a na-egosi oge ihe mere, ebe ἐπὶ τὴν γῆν pụtara ịpụta n’elu ala. “Rịpụtara n’elu ala” dabara n’ọnọdụ ọ na-esi n’ụgbọ mmiri pụta ma ghara ịkọwapụta “ụsọ mmiri” karịa ihe Grik kwuru.
- source_word: ὑπήντησεν
  choice: zutere ya
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ n’omume izute mmadụ n’akụkọ a.
- source_word: ἀνήρ τις
  choice: otu nwoke
  rationale: “Otu nwoke” na-egosi ma nwoke n’ezie ma ụdị enweghị nkọwa kpọmkwem nke τις, n’Igbo dị ugbu a ma dịkwa mfe nghọta.
- source_word: ἐκ τῆς πόλεως
  choice: si n’obodo ahụ
  rationale: Ọ na-egosi ebe nwoke ahụ si ma ọ bụ obodo ya na ya nwere njikọ; definite article dị na Grik ka e gosiri site na “ahụ.”
- source_word: ἔχων δαιμόνια
  choice: onye nwere ndị mmụọ ọjọọ
  rationale: Nke a na-anọ nso n’okwu Grik nkịtị, “onye nwere ndị demon,” kama itinye echiche “ndị mmụọ ọjọọ jidere ya” n’ahịrị isi.
- source_word: χρόνῳ ἱκανῷ
  choice: Ruo ogologo oge
  rationale: Ọ na-egosi oge buru ibu n’asụsụ Igbo e ji eme ihe kwa ụbọchị, na-enweghị ụda siri ike ma ọ bụ nke ochie.
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: o yighị uwe ọ bụla
  rationale: Ọ bụ ntụgharị Igbo ebumpụta ụwa nke ịghara iyi uwe; “ọ bụla” na-eme ka enweghị uwe doo anya.
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: ọ naghịkwa anọ n’ụlọ
  rationale: Imperfect ahụ na-egosi omume ọ na-emekarị; “anọ” anaghị ekpebi na ọ bụ ebe obibi na-adịgide adịgide.
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: kama ọ na-anọ n’etiti ili ndị nwụrụ anwụ
  rationale: “N’etiti” dabara n’ọtụtụ ili e kwuru; mgbakwunye nkọwa “ndị nwụrụ anwụ” na-eme ka “ili” ghara ịdị mgbagwoju anya nye ndị na-agụ Igbo.
theological_decisions:
- issue: Otú e si tụgharịa δαιμόνια n’ọnọdụ a
  choice: ndị mmụọ ọjọọ
  alternative: ndị mmụọ na-adịghị ọcha
  rationale: Okwu Grik bụ δαιμόνια kpọmkwem, ọ bụghị πνεύματα ἀκάθαρτα. “Ndị mmụọ ọjọọ” bụ okwu Igbo a na-aghọta nke ọma maka demons ma na-edobe ọdịiche ahụ.
- issue: Ma a ga-atụgharị ἔχων δαιμόνια dị ka njide zuru ezu
  choice: onye nwere ndị mmụọ ọjọọ
  alternative: ndị mmụọ ọjọọ jidere ya
  rationale: Ahịrị Grik kwuru n’ụzọ nkịtị na nwoke ahụ “nwere” ndị mmụọ ọjọọ. Nhọrọ isi na-echekwa usoro ahụ ma ghara idozi n’ime ya ụdị ma ọ bụ ogo ọchịchị ha n’ahụ ya.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “otu nwoke” dochie nsụgharị siri ike nke “a certain man,” ma debe usoro akụkọ ahụ n’ụzọ ebumpụta ụwa. Akara nkọwa ala ala [a] dị n’ahịrị isi.
