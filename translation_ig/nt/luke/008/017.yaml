id: LUK.8.17
reference: Luke 8:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: ig
  text: N’ihi na ọ dịghị ihe e zoro ezo nke na-agaghị apụta ìhè; ọ dịghịkwa ihe nzuzo nke a na-agaghị amata, nke na-agaghị apụtakwa ìhè.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρυπτὸν
  choice: ihe e zoro ezo
  rationale: Nkebiokwu a na-egosi ihe ezoro ma ọ bụ zoo, ma na-ada nke ọma n’Igbo ndị mmadụ na-asụ ugbu a.
- source_word: φανερὸν
  choice: pụta ìhè
  rationale: N’ebe a, ọ na-emegide ihe e zoro ezo ma na-egosi na ihe ahụ ga-apụta nke ọma n’ihu mmadụ.
- source_word: γενήσεται
  choice: a na-agaghị eme ka ọ
  rationale: 'N’usoro ahịrịokwu ahụ dum, nke a na-echekwa echiche mgbanwe ọnọdụ: ihe zoro ezo ga-aghọ ihe pụtara ìhè.'
- source_word: ἀπόκρυφον
  choice: ihe e kpuchiri ekpuchi
  rationale: Nke a na-edobe obere ọdịiche okwu dị n’etiti ya na κρυπτόν, ma ka na-egosi ihe e mere ka ndị ọzọ ghara ịmata.
- source_word: οὐ μὴ γνωσθῇ
  choice: a na-agaghị amata
  rationale: N’ime usoro njụ siri ike nke ahịrịokwu Greek, nke a na-egosi na ọ dịghị ihe nzuzo ga-anọgide bụrụ ihe a na-amaghị.
- source_word: εἰς φανερὸν ἔλθῃ
  choice: mee ka ọ pụta n’ìhè
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo na a ga-ekpughe ihe ma mee ka mmadụ hụ ma ọ bụ mara ya.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dị ka ihe kpatara ya ma ọ bụ nkọwa ya.
theological_decisions:
- issue: Ókè okwu banyere ikpughe ihe
  choice: E debere ya dị ka ụkpụrụ sara mbara na ihe e zoro ezo ma ọ bụ kpuchie ga-emecha pụta ìhè.
  alternative: Ịkọwa ya naanị dị ka ikpughe ihe n’ikpe ikpeazụ, ma ọ bụ naanị dị ka mkpughe ozizi Jizọs n’ọnọdụ a.
  rationale: Amaokwu ahụ n’onwe ya ekwughị kpọmkwem mgbe ma ọ bụ n’ụzọ dị aṅaa nke a ga-eme; ya mere nsụgharị ahụ anaghị amachi ihe ọ pụtara n’otu nkọwa.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E ji ahịrịokwu abụọ yiri ibe ha chekwaa myirịta nke Greek, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa okpukpe agbakwunyere.
