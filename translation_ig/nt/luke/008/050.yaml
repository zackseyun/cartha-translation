  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: ig
  text: Ma mgbe Jizọs nụrụ nke a, ọ zara ya, sị, “Atụla egwu; naanị kwere[a], a ga-azọpụta ya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “naanị nwee okwukwe,” ma ọ bụ, “naanị tụkwasị obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a ga-agwọ ya,” ma ọ bụ, “ahụ ga-adị ya mma.” Ngwaa Grik a nwere ike ịpụta ịzọpụta, ịnapụta, ma ọ bụ ịgwọ; n’akụkọ a, ọ nwere ike izo n’ịgwọ ọrịa ma ọ bụ iweghachi ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: mgbe ... nụrụ nke a
  rationale: Ọ na-egosi ihe mere tupu Jizọs azaa. ‘Nke a’ na-eme ka ihe a nụrụ, nke amaara site n'amaokwu ndị gbara ya gburugburu, doo anya n'Igbo n'enweghị ịgbatị ihe odide ahụ.
- source_word: ἀπεκρίθη αὐτῷ
  choice: ọ zara ya
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dịkwa mfe isi kwuo na Jizọs zara nwoke ahụ.
- source_word: Μὴ φοβοῦ
  choice: Atụla egwu
  rationale: Nke a bụ iwu na-egbochi ụjọ, ma bụrụkwa okwu Igbo sitere n'okike nke na-edobe ịdị arọ nke ihe Jizọs kwuru.
- source_word: μόνον
  choice: naanị
  rationale: Ọ na-amachi iwu sochirinụ, na-egosi na ihe a chọrọ bụ ikwere.
- source_word: πίστευσον
  choice: kwere
  rationale: Nke a bụ ngwaa Igbo kachasị nso na ‘ikwere’; ihe ndị ọzọ dịka ‘nwee okwukwe’ na ‘tụkwasị obi’ dị na nkọwa ala peeji iji chekwaa echiche nke ntụkwasị obi.
- source_word: σωθήσεται
  choice: a ga-azọpụta ya
  rationale: Nke a na-echekwa obosara ihe σῴζω pụtara—ịzọpụta, ịnapụta, ma ọ bụ ịgwọ—na-enweghị imechi ya naanị n'ịgwọ ọrịa. Ụdị ndị dabara kpọmkwem n'ọnọdụ a dị na nkọwa ala peeji.
theological_decisions:
- issue: Otú e si sụgharị πιστεύω n'iwu Jizọs
  choice: kwere
  alternative: nwee okwukwe; tụkwasị obi
  rationale: ‘Kwere’ bụ ntụgharị ngwaa ahụ kwụ ọtọ. N'ihi na o nwekwara echiche nke ịdabere na mmadụ na ntụkwasị obi, e debere ụdị ndị ahụ na nkọwa ala peeji kama ịhọrọ naanị otu echiche ma mechie ndị ọzọ.
- issue: Otú e si sụgharị σωθήσεται n'ọnọdụ metụtara ịgwọ ọrịa na iweghachi ndụ
  choice: a ga-azọpụta ya
  alternative: a ga-agwọ ya; ahụ ga-adị ya mma
  rationale: ‘A ga-azọpụta ya’ na-edobe njikọ okwu ahụ na nzọpụta ma na-echekwa obosara ihe ngwaa Grik pụtara. N'ọnọdụ akụkọ a, ịgwọ ya na ime ka ahụ dị ya mma bụkwa nghọta kwesịrị ekwesị; ya mere, e tinyere ha na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, dee amaokwu ahụ. E debere ‘a ga-azọpụta ya’ iji chekwaa obosara okwu Grik, ebe nkọwa ala peeji na-akọwa nghọta metụtara ọgwụgwọ. A dọbara akara nkọwa [a] n'akụkụ ‘kwere’ na [b] n'akụkụ ‘a ga-azọpụta ya’ ka ha kwekọọ n'ihe nkọwa nke ọ bụla na-akọwa.
