  verdict: revise
  source_fidelity: 'Isi ederede na-atụgharị akụkụ Grik ndị bụ isi nke ọma: ἀκούσας/ἀπεκρίθη αὐτῷ, Μὴ φοβοῦ, μόνον πίστευσον, na σωθήσεται. ‘A ga-azọpụta ya’ na-edobe ụda sara mbara nke σωθήσεται, ebe ‘ya’ na-edobe onye nwanyị e zoro aka na ya n’enweghị ịgbakwunye aha. Otú ọ dị, nkọwa ala peeji [b] na-ekwu na ọnọdụ ahụ bụ ‘ọnwụ dị nso,’ ma na akụkọ ozugbo e kwuola na nwa agbọghọ ahụ anwụọla (Luk 8:49).'
