id: LUK.8.54
reference: Luke 8:54
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: ig
  text: Ma ya onwe ya jidere aka ya, kpọọ ya oku[a], sị, “Nwa, bilie.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nwa agbọghọ, bilie.” Okwu Grik ahụ bụ παῖς nwere ike ịpụta “nwa” ma ọ bụ, n’ọnọdụ a, “nwa agbọghọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: Ma ya onwe ya
  rationale: ‘Ma’ na-egosi ntụgharị dị nro n’akụkọ ahụ, ebe ‘ya onwe ya’ na-echekwa ntakịrị nkwusi ike dị na αὐτός n’ụzọ Igbo na-ada nke ọma.
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: jidere ya n’aka
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo na o jidere aka ya, na-echekwa omume anụ ahụ ahụ n’enweghị echiche siri ike nke ‘ịnapụ’ ma ọ bụ ‘ijide n’ike.’
- source_word: ἐφώνησεν λέγων
  choice: wee kpọọ ya oku, sị
  rationale: ‘Kpọọ ya oku’ na-egosi na o ji olu kpọkuo ya; ‘sị’ na-ewebata okwu kpọmkwem n’ụzọ Igbo dị ndụ ma ghara ịmegharị okwu n’enweghị mkpa.
- source_word: Ἡ παῖς
  choice: Nwa m
  rationale: παῖς nwere ike ịpụta ‘nwa’ ma ọ bụ, n’ọnọdụ a, ‘nwa agbọghọ.’ ‘Nwa m’ bụ okwu ịhụnanya na nkwanye ugwu a na-eji akpọ nwata n’Igbo, ma ọ naghị ebubata okwu ‘obere’ nke adịghị n’amaokwu a.
- source_word: ἔγειρε
  choice: bilie
  rationale: ‘Bilie’ bụ iwu doro anya ma dị ugbu a nke nwere ike ịpụta isi n’ọnọdụ dina ala bilie; ọ dabara n’iweghachi nwa ahụ na ndụ ma ghara ịkọwa ụzọ ọrụ ebube ahụ karịa ihe Grik kwuru.
theological_decisions:
- issue: Okwu Jizọs ji kpọọ nwa ahụ
  choice: Nwa m
  alternative: Nwa agbọghọ
  rationale: παῖς sara mbara karịa naanị ‘nwa agbọghọ,’ ọ bụ ezie na ebe a okwu ahụ na-ezo aka n’ada Jairọs. Isi ederede na-eji ‘Nwa m’ echekwa ịdị nro na obosara okwu ahụ; ihe odide ala peeji na-egosi ihe ọzọ dabara n’ọnọdụ ahụ.
- issue: Iwu e nyere nwa ahụ
  choice: bilie
  alternative: kulie
  rationale: ‘Bilie’ bụ okwu Igbo nkịtị, doro anya, ma nwee ugwu kwesịrị ekwesị. Ọ na-echekwa iwu ahụ n’enweghị ịgbakwunye nkọwa banyere mbilite n’ọnwụ nke okwu ahụ n’onwe ya ekwughị kpọmkwem.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji usoro ‘jidere ya n’aka’ na ‘sị’ mee ka amaokwu ahụ daa ka Igbo nkịtị, ebe ‘Nwa m, bilie’ na-echekwa ịdị nro na ike nke okwu ahụ.
