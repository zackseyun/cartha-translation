revisions:
- from: Ma ya onwe ya jidere ya n’aka, wee kpọọ ya oku[a], sị, “Nwa m, bilie.”
  to: Ma ya onwe ya jidere aka ya, kpọọ ya oku[a], sị, “Nwa, bilie.”
  rationale: The revision removes the added possessive in the address, expresses the hand-taking action more directly, and aligns the note’s alternative command with ἔγειρε. It preserves the narrative turn, the emphasis of αὐτός, and the lexical ambiguity of παῖς without importing a theological or interpretive nuance.
  reviewer_model: gpt-5.6-terra
