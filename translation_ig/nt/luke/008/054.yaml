    text: A pụkwara ịsụgharị ya, “Nwa agbọghọ, bilie.” Okwu Grik ahụ bụ παῖς nwere ike ịpụta “nwa” ma ọ bụ, n’ọnọdụ a, “nwa agbọghọ.”
    reason: lexical_alternative
  revision_rationale: The revision removes the added possessive in the address, expresses the hand-taking action more directly, and aligns the note’s alternative command with ἔγειρε. It preserves the narrative turn, the emphasis of αὐτός, and the lexical ambiguity of παῖς without importing a theological or interpretive nuance.
