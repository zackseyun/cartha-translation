  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Μήτηρ μου καὶ ἀδελφοί μου οὗτοί εἰσιν οἱ τὸν λόγον τοῦ θεοῦ ἀκούοντες καὶ ⸀ποιοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: ig
  text: Ma ọ zara ha sị, “Nne m na ụmụnne m ndị nwoke[a] bụ ndị na-anụ okwu Chineke ma na-eme ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnne m.” Okwu Grik ahụ pụtara “ụmụnne nwoke m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: ọ zara ha sị
  rationale: Nke a na-edobe njikọ okwu abụọ ahụ, ‘zara’ na ‘sị,’ n’ụzọ na-aga were were n’Igbo, ma na-egosikwa ndị ọ na-agwa okwu.
- source_word: Μήτηρ μου
  choice: Nne m
  rationale: Ntụgharị kwụ ọtọ nke aha otu onye na nnọchiaha nke onye nwe ya.
- source_word: ἀδελφοί μου
  choice: ụmụnne m[a]
  rationale: ‘Ụmụnne’ bụ okwu Igbo dị mma maka ndị otu nne ma ọ bụ nna ma ọ bụ ndị e jikọrọ dịka ezinụlọ. E tinyere nkọwa ala peeji iji gosi na okwu Grik ahụ dị n’ụdị nwoke ọtụtụ.
- source_word: οὗτοί εἰσιν οἱ
  choice: bụ ndị
  rationale: Nke a jikọtara ihe ngosi na nkebi participle ahụ n’ụzọ doro anya ma bụrụkwa Igbo eke, n’enweghị nkwughachi na-adịghị mkpa.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Nke a na-edobe echiche λόγος dịka okwu ma ọ bụ ozi sitere n’aka Chineke, tinyere ụda okpukpe nke okwu ahụ.
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: na-anụ ... ma na-eme ya
  rationale: Ụdị ‘na-’ na-egosi omume e ji amata ndị ahụ mgbe niile; ‘na-eme ya’ nọ nso na ποιέω karịa ntụgharị na-akọwa ya dịka ‘na-erubere ya isi.’
theological_decisions:
- issue: Ókè ezinụlọ Jizọs kọwara ọhụrụ
  choice: Okwu ahụ na-akpọ ndị na-anụ okwu Chineke ma na-eme ya nne na ụmụnne Jizọs, n’ekwughị na ọ jụrụ ezinụlọ ya nke anụ ahụ.
  alternative: Ịkọwa ya dịka Jizọs jụrụ nne ya na ụmụnne ya nke anụ ahụ kpamkpam.
  rationale: Amaokwu ahụ na-agbasapụ echiche ezinụlọ dabere n’ịnabata okwu Chineke na ime ya, ma ọ naghị ekwu kpọmkwem na Jizọs kagburu mmekọrịta ezinụlọ ya.
- issue: Ma ἀδελφοί na-ezo naanị aka n’ụmụ nwoke
  choice: E jiri ‘ụmụnne’ n’isiokwu, ma kọwaa ụdị nwoke nke Grik n’ala peeji.
  alternative: ‘ụmụnne m ndị nwoke’
  rationale: Grik ahụ bụ aha nwoke ọtụtụ ma na-akpọghachi uche n’ụmụnne nwoke Jizọs; ma n’Igbo, ‘ụmụnne’ bụ okwu ezinụlọ eke, ebe ‘ụmụnne ndị nwoke’ nwere ike ime ka e kwuo ihe karịrị ihe amaokwu ahụ chọrọ n’ihe gbasara ndị okwu a metụtara.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-aga were were n’Igbo, ma ọ ka na-edobe njikọ ‘zara ... sị,’ okwu ‘okwu Chineke,’ na omume abụọ yiri ibe ha: ịnụ na ime.'
