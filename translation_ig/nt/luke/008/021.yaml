revisions:
- from: Ma ọ zara ha sị, “Nne m na ụmụnne m[a] bụ ndị na-anụ okwu Chineke ma na-eme ya.”
  to: Ma ọ zara ha sị, “Nne m na ụmụnne m ndị nwoke[a] bụ ndị na-anụ okwu Chineke ma na-eme ya.”
  rationale: The revision preserves the Greek masculine plural ἀδελφοί in the main text while retaining an idiomatic broader Igbo alternative in a footnote. No interpretation is imposed concerning the gender composition of those to whom Jesus' saying may apply.
  reviewer_model: gpt-5.6-terra
