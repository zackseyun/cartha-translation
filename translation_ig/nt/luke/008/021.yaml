review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the answer-saying formula, the addressees, God's word, and the paired ongoing actions of hearing and doing. However, ἀδελφοί is explicitly masculine plural ('brothers'), and the unqualified Igbo ụmụnne normally leaves that feature unspecified.
  naturalness: The sentence is fluent, modern Standard Igbo. Adding ndị nwoke after ụmụnne is a modest but natural clarification in this context and avoids losing the source's masculine wording.
  terminology: Nne m, okwu Chineke, na-anụ, and na-eme ya are appropriate and consistent. The revised footnote gives the inclusive Igbo alternative as an alternative rendering rather than making an interpretive claim about the scope of Jesus' saying.
  issues:
  - severity: medium
    issue: The main text renders ἀδελφοί μου as ụmụnne m without retaining its masculine lexical sense.
    rationale: Although ụmụnne is natural Igbo and may be contextually adequate, the Greek specifically says 'my brothers.' Since the verse deliberately names 'mother and brothers,' the masculine term should be represented in the main text where it can be done naturally.
  - severity: low
    issue: The footnote's wording is interpretive and awkwardly phrased.
    rationale: “ihe okwu Jizọs kwuru metụtara” is not idiomatic as written, and whether the application includes women is an inference about the saying rather than a lexical alternative. The note should instead identify ụmụnne m as a possible broader Igbo rendering.
  revised_text: Ma ọ zara ha sị, “Nne m na ụmụnne m ndị nwoke[a] bụ ndị na-anụ okwu Chineke ma na-eme ya.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnne m.” Okwu Grik ahụ pụtara “ụmụnne nwoke m.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek masculine plural ἀδελφοί in the main text while retaining an idiomatic broader Igbo alternative in a footnote. No interpretation is imposed concerning the gender composition of those to whom Jesus' saying may apply.
