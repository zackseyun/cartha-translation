  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: ig
  text: Ma ọ sịrị ya, “Nwa m nwanyị, okwukwe gị azọpụtala gị[a]; laa n’udo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “okwukwe gị emeela ka ahụ dị gị mma,” ma ọ bụ, “okwukwe gị agwọọla gị.” Ngwaa Grik ahụ pụrụ ịpụta ọgwụgwọ nakwa nzọpụta.
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: Nwa m nwanyị
  rationale: Ọ bụ okwu a na-akpọ nwanyị dịka nwa nwanyị; itinye ‘m’ na-eme ka olu ịhụnanya na mmekọrịta dị na okwu Jizọs pụta nke ọma n’Igbo, n’enweghị ịgbanwe ya ka ọ bụrụ naanị ‘ezigbo nwanyị.’
- source_word: πίστις
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ okwu Igbo a na-ejikarị asụgharị πίστις; n’ebe a ọ na-egosi ntụkwasị obi nwanyị ahụ nwere n’ebe Jizọs nọ.
- source_word: σέσωκέν
  choice: azọpụtala
  rationale: ‘Azọpụtala’ na-echekwa nghọta sara mbara nke σῴζω—ịzọpụta ma ọ bụ ime ka ahụ dị mma—ebe ihe gbara amaokwu ahụ gburugburu gosikwara ọgwụgwọ anụ ahụ. E debere nghọta ndị dị warara n’ihe e dere n’ala peeji.
- source_word: πορεύου
  choice: laa
  rationale: '‘Laa’ bụ iwu dị mfe ma bụrụkwa nke sitere n’ọnọdụ a: ka nwanyị ahụ pụọ gaa n’ụzọ ya.'
- source_word: εἰς εἰρήνην
  choice: n’udo
  rationale: ‘Laa n’udo’ bụ ụzọ Igbo si ekwu okwu a n’ụzọ ebumpụta ụwa, na-egosi na ọ na-apụ n’okpuru ngọzi na ọnọdụ udo.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi ntughari dị nro na ọdịiche dị n’etiti ụjọ nwanyị ahụ na okwu nkasi obi Jizọs.
theological_decisions:
- issue: Oke nghọta σῴζω n’ọnọdụ ọgwụgwọ
  choice: A sụgharịrị ya n’isi amaokwu dịka ‘azọpụtala gị.’
  alternative: ‘emela ka ahụ dị gị mma’ ma ọ bụ ‘agwọọla gị.’
  rationale: Akụkọ a metụtara ọgwụgwọ anụ ahụ, ma σῴζω nwere ike ibu nghọta sara mbara karịa naanị ọgwụgwọ. ‘Azọpụtala’ na-echekwa esemokwu na ịdị omimi ahụ; ihe e dere n’ala peeji kọwara nghọta ọgwụgwọ ahụ kpọmkwem.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. ‘Nwa m nwanyị’ na-ebute olu dị nro nke okwu ahụ; ‘laa n’udo’ bụ akpaalaokwu Igbo ebumpụta ụwa. E tinyere akara ihe e dere n’ala peeji [a] ozugbo n’ebe okwu nwere nghọta ọzọ dị.
