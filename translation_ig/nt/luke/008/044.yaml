  source_fidelity: 'The draft accurately conveys the approach from behind, the touch, the immediate result, and the cessation of her bleeding. However, the phrase for κράσπεδον is accompanied by a misleading alternative: “ọnụ a dụchara” means a frayed edge rather than the lexical possibilities ‘hem/border/fringe/tassel.’'
  naturalness: The wording is generally natural Standard Igbo. “O si n’azụ bịakwute ya” more directly expresses the Greek construction προσελθοῦσα ὄπισθεν (‘having come up from behind’) than “Ọ bịakwutere ya n’azụ.”
  terminology: “Ọnụ uwe ya” is an appropriately broad main-text rendering for κράσπεδον. The note should preserve the viable narrower senses, especially a garment hem/border and a tassel/fringe, without implying that the verse itself settles the Jewish-garment nuance.
