id: LUK.8.44
reference: Luke 8:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: ig
  text: O si n’azụ bịakwute ya, metụ ọnụ uwe ya aka[a], ozugbo ahụkwa ọbara na-agba ya kwụsịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okirikiri uwe ya” ma ọ bụ “eriri dị n’ọnụ uwe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: Ọ bịakwutere ya n’azụ
  rationale: Nke a na-egosi na nwanyị ahụ si n’azụ bịaruo Jizọs nso tupu o metụ ya aka, n’Igbo dị mfe ma kwekọọ n’usoro omume Grik.
- source_word: ἥψατο
  choice: metụ ... aka
  rationale: Nkebiokwu Igbo a na-egosi imetụ ihe aka n’etinyeghị echiche siri ike nke ijide ya.
- source_word: τοῦ κρασπέδου
  choice: ọnụ
  rationale: “Ọnụ uwe” bụ okwu Igbo a na-aghọta nke ọma maka nsọtụ ma ọ bụ akụkụ dị n’akụkụ uwe, ma ọ naghị ekpebi ma ihe ahụ bụ naanị nsọtụ, ọnụ a dụchara, ma ọ bụ eriri ịchọ mma.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: uwe ya
  rationale: “Uwe” bụ okwu sara mbara ma dị mma n’Igbo maka ἱμάτιον, na-enweghị ịkọwapụta ụdị uwe karịa ihe odide Grik kwuru.
- source_word: παραχρῆμα
  choice: ozugbo ahụkwa
  rationale: Nke a na-echekwa echiche na ihe ahụ mere n’otu ntabi anya ma na-ejikọta ya n’ụzọ nkịtị na ihe bu ya ụzọ.
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: ọbara na-agba ya kwụsịrị
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo na ọbara ahụ nọgidere na-agba ya wee kwụsị, n’enweghị ịgbakwunye nkọwa ahụike na-adịghị n’ihe odide.
theological_decisions:
- issue: Ma κράσπεδον ọ bụ naanị nsọtụ uwe ka ọ bụ eriri dị n’ọnụ uwe ndị Juu
  choice: ọnụ uwe ya
  alternative: ọnụ a dụchara ma ọ bụ eriri dị n’ọnụ uwe ya
  rationale: Okwu Grik ahụ nwere ike ịpụta nsọtụ, ọnụ uwe, ma ọ bụ eriri dị n’ọnụ uwe. Amaokwu a n’onwe ya adịghị amanye ka a kọwaa ya kpọmkwem dị ka eriri iwu ndị Juu kwuru maka ya; ya mere isi ederede na-edobe okwu sara mbara, ebe nkọwa ala peeji na-echekwa nhọrọ ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. Ahịrịokwu ahụ na-edobe usoro akụkọ ahụ, mberede nke ọgwụgwọ ahụ, na nghọtahie kwesịrị ekwesị dị na κράσπεδον.
