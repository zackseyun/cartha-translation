  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: ig
  text: Mkpụrụ ọzọ dara n’etiti ogwu[a]; ogwu ndị ahụ toro ọnụ na ya, wee kpagbuo ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti osisi ogwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ogwu ndị ahụ, ebe ha na ya toro ọnụ, kpagburu ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: Mkpụrụ ọzọ
  rationale: Ọ bụ adjective neuter singular e ji mee noun; ihe gbara ya gburugburu na-egosi na ọ na-ezo aka ná mkpụrụ. Ịtinye “mkpụrụ” na-eme ka Igbo doo anya.
- source_word: ἔπεσεν
  choice: dara
  rationale: Nke a na-egosipụta omume akụkọ ahụ n’ụzọ dị mfe ma kwekọọ na πίπτω.
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: n’etiti ogwu
  rationale: Ọ na-echekwa echiche nke ịdị n’etiti osisi ogwu, ma bụrụkwa okwu Igbo dị mfe nghọta.
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: ogwu / ogwu ndị ahụ
  rationale: ἄκανθα na-ezo aka n’osisi ndị nwere ogwu. “Ogwu” na-edobe ihe atụ ọrụ ugbo ahụ n’asụsụ Igbo dị mkpirikpi ma bụrụ nke a maara.
- source_word: συμφυεῖσαι
  choice: sokwa ya too
  rationale: Nke a na-egosi na ogwu na mkpụrụ ahụ toro ọnụ ma ọ bụ n’otu oge, dịka participle συμφυεῖσαι si kwuo.
- source_word: ἀπέπνιξαν
  choice: kpagbuo
  rationale: “Kpagbuo” na-enye echiche nke igbochi ihe ito ma ọ bụ iku ume ruo mgbe ọ na-adịghị amị mkpụrụ, nke kwekọrọ n’ihe atụ a.
- source_word: αὐτό
  choice: ya
  rationale: Nnọchiaha a na-ezo aka ná mkpụrụ ahụ e kwurula ná mmalite ahịrịokwu ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “sokwa ya too” iji mee ka uto ọnụ nke συμφυεῖσαι pụta ìhè, ebe “kpagbuo” na-edobe ike nke ihe atụ ahụ.
