  to: Ha nọkwa na-arịọsi ya ike ka ọ ghara inye ha iwu ka ha gaa n’ime abis ahụ[a].
  rationale: The revision retains the source’s ongoing, urgent request (“nọkwa na-arịọsi ... ike”), authoritative command (“inye ... iwu”), and movement into the specified destination. “Abis” is preferable to “olulu ahụ miri emi” because it preserves the lexical range and contextual supernatural sense of ἄβυσσος without adding the image of a pit. The note gives the transparent alternative “omimi ahụ” and cautiously explains the contextual sense.
