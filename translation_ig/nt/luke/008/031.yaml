  text: καὶ ⸀παρεκάλουν αὐτὸν ἵνα μὴ ἐπιτάξῃ αὐτοῖς εἰς τὴν ἄβυσσον ἀπελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: ig
  text: Ha nọkwa na-arịọsi ya ike ka ọ ghara inye ha iwu ka ha gaa n’ime abis ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “omimi ahụ.” Okwu Grik a pụrụ ịpụta ebe dị omimi nke ukwuu; n’ebe a, o yikarịrị ka ọ na-ezo aka n’ebe a na-akpọchi ndị mmụọ ọjọọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: Ha nọkwa na-arịọ ya arịrịọ
  rationale: Ụdị imperfect na-egosi arịrịọ na-aga n’ihu; okwu a na-egosikwa arịrịọ siri ike nke ndị mmụọ ọjọọ na-arịọ Jizọs.
- source_word: ἐπιτάξῃ
  choice: inye ha iwu
  rationale: Nke a na-egosi iwu e nyere n’ike, ma na-echekwa echiche banyere ikike Jizọs.
- source_word: ἄβυσσον
  choice: olulu ahụ miri emi
  rationale: N’ebe a, okwu Grik ahụ na-ezo aka n’ebe miri emi karịsịa nke a pụrụ iji kpọchie ndị mmụọ ọjọọ; nsụgharị a na-edebe ihe oyiyi nke omimi n’ebughị nkọwa karịrị ihe Luk kwuru.
- source_word: ἀπελθεῖν
  choice: baa
  rationale: N’ihi na ebe ha ga-aga sochiri ngwaa ahụ, ‘baa’ na-egosi mmegharị ịbanye n’ebe ahụ n’ụzọ Igbo dị ire.
- source_word: ἵνα μὴ
  choice: ka ọ ghara
  rationale: Nke a na-egosi ọdịnaya nke arịrịọ ahụ n’ụzọ Igbo dị mma.
- source_word: αὐτοῖς
  choice: ha
  rationale: ‘Ha’ bụ ndị mmụọ ọjọọ a ga-enye iwu, dịka dative Grik ahụ si egosi.
theological_decisions:
- issue: Ihe ἄβυσσος pụtara n’ọnọdụ metụtara ndị mmụọ ọjọọ
  choice: olulu ahụ miri emi dị ka ebe a pụrụ iji kpọchie ma ọ bụ kpee ndị mmụọ ọjọọ ikpe
  alternative: mmiri ma ọ bụ omimi n’echiche sara mbara
  rationale: Ọnọdụ ahụ na-ekwu banyere ndị mmụọ ọjọọ na-atụ egwu iwu Jizọs. ‘Olulu ahụ miri emi’ na-echekwa akụkụ ime mmụọ nke okwu ahụ n’akọwaghị n’ahịrị amaokwu ahụ kpọmkwem ihe niile banyere ebe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Na-arịọ ya arịrịọ’ na-egosi arịrịọ siri ike na-aga n’ihu; ‘olulu ahụ miri emi’ na-eme ka ihe ἄβυσσος pụtara doo onye nkịtị anya, ebe nkọwa ala peeji na-echekwa nhọrọ ‘omimi ahụ.’
