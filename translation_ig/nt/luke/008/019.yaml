source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: ig
  text: Mgbe ahụ, nne ya na ụmụnne ya ndị nwoke[b] bịakwutere ya, ma ha enweghị ike izute ya[a] n’ihi igwe mmadụ ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “iru ya nso” ma ọ bụ “ịbịakwute ya.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ “ụmụnne.” Ụfọdụ na-aghọta okwu a n’ụzọ sara mbara dịka “ndị ikwu,” ma ihe odide ahụ n’onwe ya kwuru “ụmụnne.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: Mgbe ahụ, ... bịakwutere ya
  rationale: Nkebi a na-egosi na akụkọ ahụ gara n’ihu nakwa na ndị ezinụlọ Jizọs bịara ebe ọ nọ; “bịakwutere ya” na-egosipụta ije ha bịara n’ebe ọ nọ n’enweghị ịgbakwụnye ebumnuche a na-ekwughị.
- source_word: ἡ μήτηρ
  choice: nne ya
  rationale: Nke a bụ okwu nkịtị maka nne; “ya” na-eme ka mmekọrịta ahụ doo anya n’Igbo.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ụmụnne ya ndị nwoke
  rationale: ἀδελφοί bụ ọtụtụ nke nwoke. “Ụmụnne ya ndị nwoke” na-egosipụta nke ahụ nke ọma, ebe “ụmụnne ya” naanị ya nwere ike ịgụnye ụmụanyị n’Igbo.
- source_word: οὐκ ἠδύναντο
  choice: ha enweghị ike
  rationale: Nke a na-egosipụta enweghị ike ime ihe ahụ n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: συντυχεῖν αὐτῷ
  choice: iru ya nso
  rationale: N’ọnọdụ ebe igwe mmadụ gbochiri ha, okwu a na-egosi na ha enweghị ike ịbịaru ya ma ọ bụ izute ya; “iru ya nso” na-edebe isi echiche ahụ n’enweghị ime ka ọ bụrụ nzukọ e mere atụmatụ.
- source_word: διὰ τὸν ὄχλον
  choice: n’ihi igwe mmadụ ahụ
  rationale: διά ya na accusative na-egosi ihe kpatara ya; ntụgharị a bụ Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
theological_decisions:
- issue: Ihe “ụmụnne ya ndị nwoke” pụtara kpọmkwem
  choice: A tụgharịrị ἀδελφοί dịka “ụmụnne ya ndị nwoke,” n’enweghị ikwu kpọmkwem ụdị mmekọrịta ezinụlọ ha na ya.
  alternative: ndị ikwu ya
  rationale: Ihe odide Grik n’onwe ya kwuru “ụmụnne ndị nwoke.” Ọ kọwaghị ma ha bụ ụmụnne ya site n’otu nne ma ọ bụ nna, ụmụnne e jikọtara n’ezinụlọ, ka hà bụ ndị ikwu ọzọ; ya mere, ntụgharị ekwesịghị idozi arụmụka nkà mmụta okpukpe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. E debere usoro akụkọ ahụ n’ụzọ ebumpụta ụwa, ma e zere itinye nkọwa ụka banyere ụdị mmekọrịta Jizọs na ụmụnne ya.
