- from: Mgbe ahụ, nne ya na ụmụnne ya ndị nwoke bịakwutere ya, ma ha enweghị ike iru ya nso[a] n’ihi igwe mmadụ ahụ.[b]
  to: Mgbe ahụ, nne ya na ụmụnne ya ndị nwoke[b] bịakwutere ya, ma ha enweghị ike izute ya[a] n’ihi igwe mmadụ ahụ.
  rationale: The revision preserves the Greek meaning and ambiguity while correcting the footnote-anchor placement. It uses “izute ya” for συντυχεῖν, which naturally conveys being unable to get to or meet Jesus because of the crowd. No doctrinal conclusion about the identity of the brothers is added.
