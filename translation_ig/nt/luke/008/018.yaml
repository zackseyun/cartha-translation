  terminology: “Lezienụ anya n’otú unu si ege ntị” is an apt modern rendering of βλέπετε ... πῶς ἀκούετε. “Anapụ” accurately expresses deprivation/removal without adding theological interpretation. No doctrinal terminology requires adjustment.
