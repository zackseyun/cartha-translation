id: LUK.8.18
reference: Luke 8:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: ig
  text: N’ihi ya, lezienụ anya n’otú unu si ege ntị. N’ihi na onye ọ bụla nwere, a ga-enyekwu ya; ma onye ọ bụla na-enweghị, ọbụna ihe o chere na o nwere[a] ka a ga-anapụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọbụna ihe o yiri ka o nwere, a ga-anapụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπετε
  choice: lezienụ anya
  rationale: N’ebe a, ngwaa a bụ iwu ka ndị na-ege ntị kpachara anya, ọ bụghị nanị ka ha jiri anya hụ ihe.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Jizọs kwuru tupu nke a banyere ịnụ okwu na ịnabata ya.
- source_word: πῶς ἀκούετε
  choice: n’otú unu si ege ntị
  rationale: Okwu a na-elekwasị anya n’ụzọ mmadụ si ege ntị ma na-anabata ihe ọ nụrụ, ọ bụghị naanị n’ịnụ ụda.
- source_word: ὃς ἂν ... ἔχῃ
  choice: onye ọ bụla nwere
  rationale: Nke a na-egosipụta ọnọdụ zuru ụwa ọnụ nke metụtara onye ọ bụla, ma na-edobe ọdịdị ilu nke okwu ahụ.
- source_word: δοθήσεται αὐτῷ
  choice: a ga-enyekwu ya
  rationale: Ọ bụ ezie na Grik ekwughị kpọmkwem ihe a ga-enye, echiche nke mmụba dị n’usoro ahịrịokwu ahụ; ‘-nyekwu’ na-eme ka nke a doo anya n’Igbo.
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: onye ọ bụla na-enweghị
  rationale: Ọ dabara na nkebi nke mbụ ma na-echekwa mmegide dị n’etiti onye nwere na onye na-enweghị.
- source_word: ὃ δοκεῖ ἔχειν
  choice: ihe o chere na o nwere
  rationale: δοκέω nwere ike ịpụta ‘iche’ ma ọ bụ ‘iyi ka.’ Nhọrọ a na-egosi ihe mmadụ kwenyere na ya nwere, ebe e debere nkọwa ọzọ n’ala peeji.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: a ga-anapụ ya
  rationale: N’ebe a, αἴρω pụtara iwepụ ihe n’aka mmadụ; ‘anapụ’ bụ okwu Igbo doro anya ma sie ike nke na-egosi mwepụ ahụ.
- source_word: αὐτῷ / αὐτοῦ
  choice: ya / ya
  rationale: Igbo ‘ya’ adịghị egosi nwoke ma ọ bụ nwaanyị, ma ọ na-echekwa otu onye nke okwu Grik ji mee ihe n’ụzọ metụtara onye ọ bụla.
theological_decisions:
- issue: Ihe ilu ahụ banyere onye nwere na onye na-enweghị pụtara
  choice: A sụgharịrị ya n’enweghị itinye ozizi pụrụ iche banyere akara aka, ịrụ ọrụ iji nweta ihu ọma, ma ọ bụ akụnụba; a hapụrụ ya n’ọnọdụ ya nke ikwe ka mmadụ nabata okwu Jizọs.
  alternative: A pụrụ ịghọta ya dịka ụkpụrụ sara mbara banyere nnabata ime mmụọ, ma ọ bụ dịka ilu izugbe banyere ilekọta ihe e nyere mmadụ.
  rationale: Amaokwu ahụ n’onwe ya na-ekwu ụkpụrụ yiri ihe mgbagwoju anya nke jikọtara ya na ige ntị. Nsụgharị ahụ na-echekwa esemokwu echiche ahụ n’akọwaghị ya dịka otu usoro nkà mmụta okpukpe kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ụdị ọtụtụ mmadụ ‘unu’ kwekọrọ na iwu βλέπετε/ἀκούετε, ebe ‘onye ọ bụla … ya’ na-echekwa otu onye e ji kwuo ilu ahụ. E debere akara [a] ozugbo n’akụkụ okwu ọ na-akọwa.
