review_pass:
  verdict: revise
  source_fidelity: The draft preserves the central contrast and purpose clause well. However, σκεῦος is specifically a vessel/container here, so the unqualified “ihe” is too broad; κλίνη is a bed, best rendered naturally as “akwa”; and λυχνία is a lampstand, for which a more direct Igbo expression is preferable.
  naturalness: The sentence is generally clear Standard Igbo. “Jiri arịa kpuchie ya,” “n'okpuru akwa,” and “n'elu ihe nkwụnye oriọna” are more idiomatic and precise in this context.
  terminology: “Oriọna” and “ìhè” are appropriate. “Arịa” retains the ordinary sense of σκεῦος without over-specifying its form. “Ihe nkwụnye oriọna” adequately conveys a lampstand rather than merely any place where a lamp may be put.
  issues:
  - severity: medium
    issue: “ihe” for σκεύει is overly indefinite.
    rationale: The Greek denotes a vessel or container; “arịa” supplies that semantic content while retaining the source's lack of further specification.
  - severity: low
    issue: “ihe ndina” is less direct than the ordinary Igbo term for a bed.
    rationale: κλίνη refers to a bed in this saying; “akwa” is the natural modern rendering.
  - severity: low
    issue: “ihe e ji adọba oriọna” is an awkward and less precise rendering of λυχνία.
    rationale: A lampstand is specifically a support for a lamp; “ihe nkwụnye oriọna” conveys this more directly.
  revised_text: Ọ dịghị onye, mgbe ọ mụnyesịrị oriọna, na-eji arịa ekpuchi ya ma ọ bụ tinye ya n'okpuru akwa; kama ọ na-etinye ya n'elu ihe nkwụnye oriọna, ka ndị na-abata wee hụ ìhè ahụ.
