reference: Luke 8:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: ig
  text: Ọ dịghị onye, mgbe ọ mụnyesịrị oriọna, na-eji arịa ekpuchi ya ma ọ bụ tinye ya n'okpuru akwa; kama ọ na-etinye ya n'elu ihe nkwụnye oriọna, ka ndị na-abata wee hụ ìhè ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: oriọna
  rationale: “Oriọna” bụ okwu Igbo nkịtị ma doo anya maka obere ihe e ji enye ìhè n'ụlọ.
- source_word: σκεύει
  choice: ihe
  rationale: Okwu Grik a sara mbara, pụtakwa ihe ma ọ bụ arịa. “Ihe” na-echekwa obosara ahụ ma zere ịkpọ ụdị arịa a na-akọwaghị.
- source_word: κλίνης
  choice: ihe ndina
  rationale: N'ọnọdụ a, ọ na-ezo aka n'ihe mmadụ na-edina n'elu ya; “ihe ndina” bụ okwu doro anya n'Igbo nke oge a.
- source_word: λυχνίας
  choice: ihe e ji adọba oriọna
  rationale: Nkebiokwu a na-akọwa ihe a na-adọba oriọna n'elu ya n'ụzọ ndị na-agụ Igbo ga-aghọta, n'etinyeghị ọdịdị pụrụ iche nke ihe ahụ.
- source_word: τὸ φῶς
  choice: ìhè ahụ
  rationale: “Ìhè ahụ” na-egosipụta artịkọl Grik ma na-ezo kpọmkwem n'ìhè oriọna ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ δέ ka njikọ echiche dị nro n'enweghị ịmalite amaokwu ahụ na okwu oge dịka “ugbu a,” ebe ọ bụ na ọ bụghị okwu oge n'ebe a. E chekwara usoro ebumnuche nke ἵνα site na “ka ... wee.”
