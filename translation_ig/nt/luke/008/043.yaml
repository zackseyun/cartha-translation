translation:
  language: ig
  text: Otu nwanyị nwere ọbara ọgbụgba kemgbe afọ iri na abụọ[a]. O mefuru ihe niile o ji ebi ndụ n’aka ndị dọkịta[c][b], ma ọ dịghị onye nwere ike ịgwọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “nwaanyị ọbara na-agba,” ma ọ bụ, “nwaanyị nwere ọpụpụ ọbara.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ βίος n’ebe a pụtara akụ ya ma ọ bụ ihe o ji ebi ndụ, ọ bụghị ndụ anụ ahụ ya.
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ akwụkwọ aka ochie na-ahapụ okwu ahụ banyere na o mefuru ihe niile o ji ebi ndụ n’aka ndị dọkịta. Ihe odide SBLGNT na-agụnye okwu ahụ, ma e tinyela ya n’akara mgbodo iji gosi na e nwere mgbagha ederede.
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: Otu nwaanyị nọkwa ebe ahụ
  rationale: A kọwara participle ahụ n’ụzọ Igbo na-aga were were dị ka ndabere akụkọ; “-kwa” na-ejigide καί nke na-ejikọta ya na ihe gara aga.
- source_word: ἐν ῥύσει αἵματος
  choice: onye ọbara nọ na-agba
  rationale: Nke a na-egosi ọbara na-aga n’ihu ịgba n’enweghị itinye nkọwa ọrịa karịrị ihe Grik kwuru.
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: kemgbe afọ iri na abụọ
  rationale: “Kemgbe” na-egosi ogologo oge ọnọdụ ahụ gara n’ihu ruo n’oge akụkọ a.
- source_word: ἰατροῖς προσαναλώσασα
  choice: O mefuru ... n’aka ndị dọkịta
  rationale: “Mefuru” na-egosi na o ji ihe ndị ahụ niile gwụ, ebe “n’aka ndị dọkịta” na-egosi ndị e tinyere ego ahụ n’ọrụ ha.
- source_word: ὅλον τὸν βίον
  choice: ihe niile o ji ebi ndụ
  rationale: βίος n’ebe a pụtara akụ ma ọ bụ ihe e ji akwalite ndụ, ọ bụghị ndụ anụ ahụ ya.
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: ma ọ dịghị onye nwere ike ịgwọ ya
  rationale: Nke a bụ ụzọ Igbo doro anya isi kwuo enweghị onye pụrụ ime ka ahụ dị ya mma, ma na-ejigide echiche passive nke ịbụ onye a gwọrọ n’ụzọ ebumpụta ụwa n’Igbo.
theological_decisions:
- issue: Ma ahịrịokwu ahụ ọ na-ebo ndị dọkịta ebubo kpọmkwem
  choice: E kwughị na ndị dọkịta ahụ dara iwu ma ọ bụ mejọrọ ya; naanị na ọ dịghị onye nwere ike ịgwọ ya.
  alternative: Ikwu hoo haa na ndị dọkịta niile nwara ma daa.
  rationale: SBLGNT kwuru na o mefuru ihe o ji ebi ndụ n’aka ndị dọkịta nakwa na ọ dịghị onye nwere ike ịgwọ ya, ma ọ naghị agbakwụnye nkọwa ikpe megide ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ndị dọkịta” bụ okwu ndị mmadụ na-aghọta ngwa ngwa; ahịrịokwu abụọ ahụ na-eme ka ogologo usoro Grik doo anya n’Igbo n’enweghị ịgbanwe ọdịnaya ya.
