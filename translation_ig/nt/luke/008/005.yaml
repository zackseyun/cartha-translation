  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: ig
  text: Onye na-agha mkpụrụ pụrụ ịgha mkpụrụ ya. Mgbe ọ na-agha ya, ụfọdụ dara n'akụkụ ụzọ; a zọkwara ya n'okpuru ụkwụ, nnụnụ nke mbara igwe wee rie ya kpamkpam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν
  choice: pụrụ
  rationale: Aorist ἐξέρχομαι na-egosi na ọ gara pụọ; “pụrụ” bụ ụzọ Igbo dị nkenke ma bụrụkwa nke a na-asụ ugbu a.
- source_word: ὁ σπείρων
  choice: onye na-agha mkpụrụ
  rationale: Articular participle na-arụ ọrụ dị ka aha mmadụ. Nkebi a bụ nke doro onye Igbo anya ma na-ezere aha ọrụ nke nwere ike ịdị arọ.
- source_word: τοῦ σπεῖραι
  choice: ịgha mkpụrụ
  rationale: Genitive articular infinitive na-egosi nzube mgbe ọ soro ngwaa ngagharị; infinitive Igbo a na-egosipụta nzube ahụ nke ọma.
- source_word: τὸν σπόρον αὐτοῦ
  choice: mkpụrụ ya
  rationale: σπόρος bụ mkpụrụ a na-agha; “mkpụrụ ya” na-edobe okwu onye nwe ya n'enweghị mgbakwunye na-adịghị na isiokwu Grik.
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Mgbe ọ na-agha ya
  rationale: ἐν tinyere articular infinitive na-egosi omume na-eme n'otu oge; “mgbe ... na-” bụ usoro Igbo ebumpụta ụwa maka nke a.
- source_word: ὃ μὲν
  choice: ụfọdụ
  rationale: Neuter singular a na-ezo aka n'otu akụkụ nke mkpụrụ n'ụzọ nkesa; “ụfọdụ” na-eweta nghọta ahụ n'Igbo ma kwadebe nkewa ndị na-esochi n'ilu ahụ.
- source_word: ἔπεσεν παρὰ τὴν ὁδόν
  choice: dara n'akụkụ ụzọ
  rationale: παρά na accusative ebe a na-egosi ebe dị n'akụkụ ụzọ, ọ bụghị n'etiti ụzọ; ntụgharị a doro anya ma dị ugbu a.
- source_word: κατεπατήθη
  choice: a zọtọkwara ya ụkwụ
  rationale: Passive nke καταπατέω pụtara ịzọda ihe n'okpuru ụkwụ. Usoro a bụ Igbo nkịtị ma na-edobe olu passive na onye mere ya a kpọghị aha.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: nnụnụ ndị dị na mbara igwe
  rationale: πετεινά bụ nnụnụ, οὐρανός ebe a bụ mbara elu ha na-efe. “Mbara igwe” na-edobe ihe oyiyi ahụ n'ụzọ ndị na-agụ Igbo ga-aghọta, n'ebughị ya gaa n'echiche pụrụ iche banyere eluigwe.
- source_word: κατέφαγεν αὐτό
  choice: rie ya kpamkpam
  rationale: κατεσθίω na-enye echiche iri ihe gwụchaa. “Rie ya kpamkpam” na-egosipụta ike ngwaa ahụ n'Igbo dị mfe.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E debere usoro ilu ahụ na nkwughachi “ịgha mkpụrụ,” ma zere okwu ochie ma ọ bụ nkọwa ụka a gbakwụnyere.
