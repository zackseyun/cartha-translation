review_pass:
  verdict: revise
  source_fidelity: The causal/inferential opening, perfect passive sense ('have been forgiven'), causal ὅτι, and the love/little-love parallel are retained. The final passive expression should more directly convey the Greek quantitative adverbial ('is forgiven little') rather than make 'ihe nta' sound like a particular minor matter.
  naturalness: 'The draft is clear Standard Igbo. Replacing ''ihe nta'' with ''ntakịrị'' gives a more idiomatic and semantically precise proverbial parallel: ''onye a gbaghaara ntakịrị ... na-ahụ n’anya ntakịrị.'''
  terminology: '''mmehie,'' ''gbaghara,'' and ''ịhụ n’anya'' are appropriate, natural biblical-register terms. The footnote preserves the source ambiguity without making its alternative reading the main text.'
  issues:
  - severity: medium
    issue: The phrase 'onye a gbaghaara ihe nta' can mean that a small thing was forgiven, rather than that the person is forgiven only a little.
    rationale: ὀλίγον is a quantitative adverbial with ἀφίεται. 'Onye a gbaghaara ntakịrị' more closely preserves this sense and better matches the following 'na-ahụ n’anya ntakịrị.'
  revised_text: N’ihi nke a, ana m agwa gị,[a] na a gbagharala ọtụtụ mmehie ya, n’ihi na ọ hụrụ n’anya nke ukwuu. Ma onye a gbaghaara ntakịrị na-ahụ n’anya ntakịrị.
