id: LUK.7.47
reference: Luke 7:47
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: ig
  text: N’ihi nke a, ana m agwa gị,[a] na a gbagharala ọtụtụ mmehie ya, n’ihi na ọ hụrụ n’anya nke ukwuu. Ma onye a gbaghaara ntakịrị na-ahụ n’anya ntakịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ya mere ọ hụrụ n’anya nke ukwuu.” Enwere ike ịghọta njikọ okwu Grik ahụ n’ụzọ na-egosi na ịhụnanya ya bụ ihe akaebe na a gbagharala ya, ọ bụghị ihe kpatara e ji gbaghara ya.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: N’ihi nke a
  rationale: Ọ bụ njikọ na-egosi ihe kpatara ya ma ọ bụ nkwubi okwu; nsụgharị a bụ Igbo eke ma na-echekwa ike njikọ ahụ.
- source_word: ἀφέωνται
  choice: a gbagharala
  rationale: Oge perfect passive na-egosi omume e mechara nke nsonaazụ ya ka dị ugbu a; ‘a gbagharala’ na-egosipụta nke a nke ọma.
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: ọtụtụ mmehie ya
  rationale: Nke a bụ usoro Igbo doro anya ma bụrụkwa nke eke maka ‘mmehie ya ndị dị ọtụtụ.’
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-echekwa njikọ causal dị n’asụsụ Grik, n’emeghị ka esemokwu dị n’etiti ihe amaokwu a kwuru na ihe gbara ya gburugburu laa n’iyi.
- source_word: ἠγάπησεν πολύ
  choice: ọ hụrụ n’anya nke ukwuu
  rationale: Ọ na-eji okwu Igbo nkịtị maka ịhụnanya ma na-egosi ogo ya nke ukwuu.
- source_word: ᾧ δὲ ὀλίγον ἀφίεται
  choice: Ma onye a gbaghaara ihe nta
  rationale: Ọ na-echekwa generic singular na ntụnyere nke ‘ntakịrị’ n’enweghị itinye nwoke kpọmkwem ebe Grik achọghị ya.
- source_word: ὀλίγον ἀγαπᾷ
  choice: na-ahụ n’anya ntakịrị
  rationale: Ọ na-echekwa myirịta na mkpụmkpụ ilu dị n’ahịrịokwu ikpeazụ.
theological_decisions:
- issue: Ma ὅτι (‘n’ihi na’) ọ na-ekwu na ịhụnanya nwanyị ahụ bụ ihe o ji nweta mgbaghara
  choice: E debere ‘n’ihi na,’ ma hapụ mmekọrịta dị n’etiti mgbaghara na ịhụnanya ka okwu Grik si gosi ya n’ụzọ mkpirikpi.
  alternative: Ịsụgharị ya dịka ‘ya mere ọ hụrụ n’anya nke ukwuu,’ nke ga-eme ka ịhụnanya ya pụta ìhè dịka ihe akaebe ma ọ bụ nsonaazụ mgbaghara.
  rationale: Ilu ahụ na amaokwu 50 na-akwado nghọta na mgbaghara na-ebute ịhụnanya, ma ὅτι n’amaokwu a nwere ike ịda ka ihe kpatara ya. Nsụgharị bụ isi na-echekwa njikọ Grik na esemokwu nkà mmụta okpukpe ahụ; nkọwa ala peeji na-egosi nghọta ọzọ ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘A gbagharala’ na-egosipụta omume e mechara nke ọnọdụ ya ka dị; ‘onye’ na-ezere ịtinye okike nwoke n’ebe Grik bụ okwu zuru mmadụ ọnụ.
