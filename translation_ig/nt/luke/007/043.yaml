source:
  edition: SBLGNT
  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: ig
  text: Saịmọn zara, sị, “Echere m[a] na ọ bụ onye ahụ ọ gbaghaara ụgwọ ka ukwuu[b].” Ọ sịrị ya, “I kpebiri n'ụzọ ziri ezi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ana m eche” ma ọ bụ “Dị ka m chere”; okwu Grik ahụ na-egosi nkwubi okwu e ji nwayọọ na obi abụọ nta kwuo.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye ahụ ọ kagburu ụgwọ ka ukwuu”; ngwaa Grik ahụ nwekwara ike ịpụta iji amara hapụ mmadụ ụgwọ o ji.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: zara, sị
  rationale: Ngwakọta participle na ngwaa a na-egosi na Saịmọn nyere nzaghachi; ‘zara, sị’ bụ ụzọ Igbo si ekwu ya nke ọma ma na-edobe ma nzaghachi ahụ ma okwu o kwuru.
- source_word: Ὑπολαμβάνω
  choice: Echere m
  rationale: N'ebe a, okwu ahụ na-egosi nkwubi okwu e ji nwayọọ kwuo, ọ bụghị nkwenye siri ike. ‘Echere m’ na-edobe obi abụọ nta dị n'azịza Saịmọn.
- source_word: ᾧ τὸ πλεῖον
  choice: onye ahụ ọ ... ihe ka ukwuu
  rationale: Nke a na-egosi onye e mere ihe ahụ n'uru ya na ọnụ ọgụgụ ka ukwuu; usoro Igbo a bụ nke sitere n'okike ma na-edobe ntụnyere ahụ.
- source_word: ἐχαρίσατο
  choice: gbaghara
  rationale: N'ihe atụ a banyere ụgwọ, ngwaa a pụtara ịhapụ mmadụ ụgwọ ya n'amara. ‘Gbaghara’ na-ejikọ mgbaghara ụgwọ ahụ na isiokwu mgbaghara dị n'akụkụ amaokwu a, ebe nkọwa ọzọ dị n'ala peeji na-eme ka ihe gbasara ụgwọ pụta ìhè.
- source_word: Ὀρθῶς
  choice: n'ụzọ ziri ezi
  rationale: Nke a na-egosi na mkpebi Saịmọn bụ nke ziri ezi.
- source_word: ἔκρινας
  choice: I kpebiri
  rationale: Ngwaa a na-ezo aka na ntule ma ọ bụ ikpe Saịmọn mere ugbu a. ‘I kpebiri’ bụ Igbo doro anya ma dị mfe nghọta n'ọnọdụ a.
theological_decisions:
- issue: Ụdị mgbaghara e kwuru n'ihe atụ ahụ
  choice: Jiri ‘gbaghara’ n'ahịrị bụ isi, ma kọwaa mgbaghara ụgwọ n'ala peeji.
  alternative: ‘kagburu ya ụgwọ ka ukwuu’ ma ọ bụ ‘hapụrụ ya ụgwọ ka ukwuu’
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ihe atụ banyere ndị ji ụgwọ, ma akụkụ buru ibu nke akụkọ ahụ na-ekwu banyere mgbaghara mmehie. Nhọrọ a na-edobe njikọ abụọ ahụ n'emeghị ka otu n'ime ha wepụ nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu, dee ya. A hapụrụ ụda obi abụọ nta dị n'okwu Saịmọn, ma jiri nkọwa ala peeji chekwaa ihe onyonyo nke ịkagbu ụgwọ.
