  rationale: 'The revision clarifies the ellipted object of the Greek verb as a debt, as required by the immediately preceding parable, while retaining “gbaghara” to preserve the lexical and thematic connection with forgiveness. Footnote anchors remain correctly placed: a marks Simon’s tentative expression, and b marks the debt-remission phrase.'
