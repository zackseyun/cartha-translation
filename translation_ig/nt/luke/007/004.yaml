  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: ig
  text: Mgbe ha bịakwutere Jizọs, ha ji ịnụ ọkụ n’obi rịọ ya, na-asị, “O ruru eru ka i meere ya ihe a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: mgbe ha bịakwutere
  rationale: Nkebi participle a na-egosi na ha bịara n'ebe Jizọs nọ; ‘mgbe ha bịakwutere’ na-egosipụta nke ọma ma mbata ahụ ma njikọ oge ya na arịrịọ ha.
- source_word: παρεκάλουν
  choice: ha rịọrọ ya
  rationale: παρακαλέω n'ebe a bụ ịrịọ mmadụ arịrịọ siri ike ma nwee nkwanye ùgwù. ‘Rịọrọ’ bụ okwu Igbo doro anya ma kwekọọ n'ọnọdụ ahụ.
- source_word: σπουδαίως
  choice: nke ukwuu
  rationale: Adverb a na-egosi ịdị uchu na ịdị omimi nke arịrịọ ahụ. ‘Rịọrọ ya nke ukwuu’ bụ usoro okwu Igbo dị ndụ nke na-egosi ike arịrịọ ahụ n'emeghị ka ọ bụrụ ịmanye ya.
- source_word: Ἄξιός
  choice: o kwesịrị
  rationale: ἄξιος pụtara onye ruru eru ma ọ bụ onye kwesiri inweta ihe. N'usoro ahịrịokwu Igbo a, ‘o kwesịrị ka’ na-eburu echiche na nwoke ahụ ruru eru ka e meere ya ihe ahụ.
- source_word: ᾧ
  choice: ya
  rationale: Relative pronoun dative a na-arụtụ aka n'ọchịagha ahụ; ‘ya’ na-eme ka onye a ga-emere ihe doo anya n'Igbo.
- source_word: παρέξῃ
  choice: i meere
  rationale: παρέχω nwere ike ịbụ inye, ime, ma ọ bụ imepụta ihe maka mmadụ. N'ebe a ihe a na-arịọ bụ omume Jizọs ga-emere nwoke ahụ, ya mere ‘i meere ya’ bụ ntụgharị eke ma ziri ezi.
- source_word: τοῦτο
  choice: ihe a
  rationale: Demonstrative a na-arụtụ aka n'ihe a rịọrọ Jizọs ka o mee n'amaokwu ndị gbara ya gburugburu. ‘Ihe a’ na-edebe ntụaka ahụ n'emeghị nkọwa ọzọ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, dee ya. A họọrọ ‘rịọrọ ya nke ukwuu’ iji chekwaa nkwanye ùgwù na ike dị na arịrịọ ahụ. Ahịrịokwu ikpeazụ na-edebe echiche nke ịdị ‘worthy/deserving’ n'ụzọ Igbo eke, n'enweghị itinye nkọwa okpukpe ọzọ.
