- from: Mgbe ha bịakwutere Jizọs, ha rịọrọ ya nke ukwuu, na-asị, “O kwesịrị ka i meere ya ihe a.”
  to: Mgbe ha bịakwutere Jizọs, ha ji ịnụ ọkụ n’obi rịọ ya, na-asị, “O ruru eru ka i meere ya ihe a.”
  rationale: The revision makes the centurion’s stated worthiness explicit and uses an idiomatic expression for the earnestness of the appeal, while retaining the source’s ambiguity about the precise requested act (“ihe a”).
