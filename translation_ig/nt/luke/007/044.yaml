  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: ig
  text: Mgbe ọ tụgharịrị chee nwanyị ahụ ihu, ọ sịrị Saịmọn, “Ị na-ahụ nwanyị a? Abatara m n’ụlọ gị; i nyeghị m mmiri maka ụkwụ m[a], ma nwanyị a ji anya mmiri ya mee ka ụkwụ m dee mmiri, jirikwa ntutu isi ya hichaa ha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nke na-esochikwu okwu Grik anya, “i nyeghị m mmiri n’elu ụkwụ m.” Ihe a na-ekwu bụ omenala nke inye onye ọbịa mmiri maka ịsa ụkwụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: Mgbe ọ tụgharịrị chee nwanyị ahụ ihu
  rationale: Nke a na-egosi na Jizọs tụgharịrị n’ebe nwanyị ahụ nọ tupu o kwuo okwu; ọ bụkwa ụzọ Igbo dị ndụ si ekwu mmegharị ahụ.
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: Ị na-ahụ nwanyị a?
  rationale: Ọ na-edobe ajụjụ kpọmkwem ahụ na ike ngosipụta nke ταύτην, ‘nwanyị a.’
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: Abatara m n’ụlọ gị
  rationale: ‘Abatara m’ bụ okwu Igbo ebumpụta ụwa maka ịbanye n’ụlọ onye, ma ‘ụlọ’ kwekọrọ na οἰκία.
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: i nyeghị m mmiri maka ụkwụ m
  rationale: Ọ na-edobe ihe ederede ahụ kwuru kpọmkwem—inye mmiri—n’ebughị ụzọ tinye ngwaa ‘ịsa’; ‘maka ụkwụ m’ na-akọwa nzube mmiri ahụ n’Igbo dị mfe.
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: ji anya mmiri ya mee ka ụkwụ m dee mmiri
  rationale: βρέχω pụtara ime ka ihe dee mmiri. Usoro a na-egosi anya mmiri dị ka ihe e ji mee ya ma na-ada nke ọma n’Igbo.
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: jirịkwa ntutu isi ya hichaa ha
  rationale: ‘Ntutu isi’ na-akọwa θρίξ nke ọma n’ọnọdụ a; ‘ha’ laghachiri n’ụkwụ abụọ ahụ, ebe ‘hichaa’ na-egosipụta omume ἐκμάσσω.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E debere ọdịiche dị n’etiti ihe Saịmọn na-emeghị na ihe nwanyị ahụ mere, ma etinyeghị nkọwa okpukpe na-adịghị n’ederede Grik.
