  verdict: approve
  source_fidelity: 'Ntụgharị asụsụ a na-anọchite akụkụ niile dị na Grik nke ọma: ntụgharị Jizọs chee nwanyị ahụ ihu, ajụjụ a jụrụ Saịmọn, mbata n’ụlọ ya, mmiri a na-enyeghị maka ụkwụ, na ọdịiche dị n’etiti anya mmiri na ntutu isi nwanyị ahụ. Oge gara aga dị na «abatara m», «nyeghị», «mee ka ... dee mmiri», na «hichaa» dabara nke ọma na usoro akụkọ ahụ.'
  naturalness: Igbo ahụ bụ Igbo Izugbe a na-asụ n’oge a, doo anya, ma na-agụ nke ọma. «Mee ka ụkwụ m dee mmiri» bụ ụzọ a ghọtara nke ọma isi sụgharị βρέχω n’ebughị ihe karịrị ihe ederede kwuru.
  terminology: Aha «Saịmọn», «nwanyị», «anya mmiri», «ụkwụ», na «ntutu isi» dabara adaba. Nkọwa ala peeji ahụ na-edobe ụzọ ntụgharị ọzọ («n’elu ụkwụ m») ma kọwaa omenala dị n’azụ nkebiokwu ahụ n’etinyeghị ozizi ma ọ bụ nkọwa na-enweghị isi n’ederede.
