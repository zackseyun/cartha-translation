  rationale: The revision corrects the required Standard Igbo second-person pronoun and improves the verbal idiom for the woman’s uninterrupted action. It keeps the demonstrative contrast, temporal scope, plural-foot sense naturally expressed in Igbo, and the Greek verb’s possible affectionate or iterative nuance in a footnote rather than imposing it in the main text.
