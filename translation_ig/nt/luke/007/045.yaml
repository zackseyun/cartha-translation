  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: ig
  text: Ị nyeghị m nsusu ọnụ[a]; ma nwanyị a, kemgbe m batara, ọ kwụsịbeghị ịsụ ụkwụ m ọnụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nsusu ọnụ ekele.” Nsusu ọnụ bụ ihe a na-emekarị n’oge ahụ iji kelee mmadụ ma ọ bụ nabata ọbịa.
    reason: cultural_note
  - marker: b
    text: 'Okwu Grik a pụrụ ịpụta isusu ọnụ n’ụzọ ịhụnanya ma ọ bụ ugboro ugboro: “ọ kwụsịbeghị iji nsusu ọnụ kpuchie ụkwụ m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά
  choice: nsusu ọnụ
  rationale: This is the standard, natural Igbo noun for a kiss. The hospitality function is real in context but is not made explicit in the Greek noun, so it remains in a footnote.
- source_word: μοι
  choice: m
  rationale: The Igbo object pronoun naturally marks the recipient in “I nyeghị m,” corresponding to the Greek dative indirect object.
- source_word: ἔδωκας
  choice: nyeghị
  rationale: The verb literally means “gave.” Igbo likewise speaks naturally of giving someone a kiss, so the source idiom can be retained.
- source_word: αὕτη δὲ
  choice: ma nwanyị a
  rationale: “Nwanyị a” makes the demonstrative referent clear and preserves the pointed contrast with Simon; “ma” expresses the adversative force.
- source_word: ἀφ’ ἧς
  choice: kemgbe
  rationale: “Kemgbe” naturally expresses an action continuing from a stated past time until the present.
- source_word: εἰσῆλθον
  choice: m batara
  rationale: “Batara” is a natural contextual rendering of entering or coming into the house.
- source_word: οὐ διέλιπεν
  choice: akwụsịbeghị
  rationale: The Igbo perfect-negative form clearly conveys that she began earlier and has continued without stopping.
- source_word: καταφιλοῦσά
  choice: isusu … ọnụ
  rationale: This is the ordinary Igbo expression for kissing. The prefixed Greek verb may suggest affectionate or repeated kisses, but that nuance is best preserved in a lexical footnote rather than overstated in the main text.
- source_word: μου τοὺς πόδας
  choice: ụkwụ m
  rationale: Igbo normally uses “ụkwụ” without overt number marking here; the possessive construction naturally means “my feet” in this context.
theological_decisions:
- issue: Hospitality custom implied by the kiss
  choice: State simply that Simon gave Jesus no kiss, with the custom explained in a footnote.
  alternative: Expand the main text to “I nyeghị m nsusu ọnụ e ji ekele ọbịa.”
  rationale: The contrast concerns neglected hospitality and the woman’s devotion, but the Greek names the act without explaining the custom. Keeping the explanation in a note avoids importing interpretation into the main text.
- issue: Force of καταφιλέω
  choice: Use the normal Igbo expression for kissing and note its possible affectionate or repeated force.
  alternative: Render explicitly as “iji nsusu ọnụ kpuchie ụkwụ m” or “isusu ụkwụ m ọnụ ugboro ugboro.”
  rationale: The intensified verb can imply repeated or affectionate kissing, but the exact degree of intensity is not fully determinate. The main text remains natural while the footnote preserves the lexical nuance.
translation_notes:
  register: Standard Igbo in a natural, dignified, contemporary register. The wording preserves the direct contrast and the continuing aspect of the woman’s action without adding a denominational interpretation.
