id: LUK.7.31
reference: Luke 7:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: ig
  text: “Ya mere, gịnị ka m ga-eji tụnyere ndị mmadụ nke ọgbọ a? Gịnịkwa ka ha yiri?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: gịnị ka m ga-eji tụnyere
  rationale: Ọ bụ ụzọ Igbo doro anya ma kwekọọ n’ajụjụ Grik nke na-achọ ihe a ga-eji mee ntụnyere.
- source_word: τοὺς ἀνθρώπους
  choice: ndị
  rationale: N'ebe a, ἄνθρωποι na-ezo aka n'ìgwè mmadụ n'ozuzu, ọ bụghị nanị ụmụ nwoke; “ndị” bụ okwu Igbo eke nke na-edebe nghọta ahụ.
- source_word: τῆς γενεᾶς ταύτης
  choice: oge a
  rationale: N'okwu a, γενεά na-ezo aka n'ụmụ mmadụ bi n'oge ahụ; “ndị oge a” na-enye echiche ahụ n'Igbo nkịtị n'enweghị ịkpọchi ya n'ọgbọ ọmụmụ kpọmkwem.
- source_word: τίνι εἰσὶν ὅμοιοι
  choice: Gịnịkwa ka ha yiri?
  rationale: Ntụgharị a na-edebe ajụjụ nke abụọ na njikọ καί (“kwa”) n'ụzọ dị mkpirikpi ma bụrụ Igbo eke.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu ma ọ bụ ntụgharị sitere n'ihe e kwuru tupu ya.
theological_decisions:
- issue: Ma τοὺς ἀνθρώπους ga-abụ “ụmụ nwoke” ka ọ bụ “ndị mmadụ”
  choice: ndị
  alternative: ụmụ nwoke
  rationale: Okwu Grik ἄνθρωποι nwere ike ịgụnye mmadụ niile, ebe ọnọdụ amaokwu ahụ anaghị egosi na ọ bụ naanị nwoke ka a na-ekwu maka ya.
- issue: Uzo e si ghọta γενεά
  choice: oge a
  alternative: ọgbọ a
  rationale: “Oge a” na-egosi ndị Jizọs na-agwa okwu n'oge ahụ ma na-ezere nghọta dị warara nke usoro ọmụmụ; “ọgbọ a” ka bụ ntụgharị nwere ike ịdị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ajụjụ abụọ nke Grik, ebe e meziri ahịrịokwu ka ọ daa nke ọma n'Igbo.
