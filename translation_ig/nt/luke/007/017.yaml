  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: ig
  text: Akụkọ a banyere ya wee gbasaa n’ala Judia niile na n’ógbè niile gbara ya gburugburu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ozi a banyere ya” ma ọ bụ “Okwu a banyere ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: wee gbasaa
  rationale: N’ebe a, ngwaa ahụ na-akọ otú akụkọ si pụta gaa ruo ebe dị iche iche. “Gbasaa” bụ ụzọ Igbo sitere n’okike ekwupụta mgbasa akụkọ, ma “wee” na-egosi usoro ihe mere na akụkọ ahụ.
- source_word: ὁ λόγος οὗτος
  choice: Akụkọ a
  rationale: N’ọnọdụ akụkọ a, λόγος pụtara akụkọ ma ọ bụ ozi a na-akọ banyere ihe Jizọs mere, ọ bụghị naanị otu okwu e kwuru.
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: n’ala Judia niile
  rationale: Nhọrọ a na-egosi na akụkọ ahụ gbasara n’ebe niile n’ime Judia, n’asụsụ Igbo dị mfe ma doo anya.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: 'Nke a na-edobe ihe περί na genitive pụtara kpọmkwem: akụkọ ahụ metụtara onye ahụ, ya bụ Jizọs.'
- source_word: πάσῃ τῇ περιχώρῳ
  choice: n’ógbè niile gbara ya gburugburu
  rationale: περίχωρος bụ mpaghara gbara Judia gburugburu; ntụgharị a doro onye Igbo nke oge a anya ma na-edobe ịdị obosara nke πάσῃ.
- source_word: καὶ ... καὶ
  choice: na ... niile
  rationale: Njikọ “na” na-ejikọta Judia na mpaghara ndị gbara ya gburugburu ma na-echekwa ike nchịkọta nke καί ugboro abụọ n’ụzọ Igbo sitere n’okike.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe, dị ùgwù, ma kwekọọ n’ụzọ ndị mmadụ si ekwu maka akụkọ na-agbasa. E debere aha ebe ahụ dịka “Judia.”
