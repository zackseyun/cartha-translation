translation_notes:
  register: Asụsụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “onye na-agbazinye ego” kama okwu mgbazinye nwere ike ịpụta onye na-anakọta ụgwọ naanị. Akara nkọwa [a] pụtara ozugbo n'akụkụ “dinarị ise.”
