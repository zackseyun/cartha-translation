  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: ig
  text: “Ndị mmadụ abụọ ji otu onye na-agbazinye ego ụgwọ. Otu ji ya dinarị narị ise[a], nke ọzọ jikwa ya dinarị iri ise.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dinarị bụ mkpụrụ ego ọlaọcha ndị Rom ji eme ihe; a na-ewerekarị otu dinarị dị ka ụgwọ ọrụ onye ọrụ maka ihe dị ka otu ụbọchị.
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: mmadụ abụọ ji ... ụgwọ
  rationale: Nke a na-egosi n'ụzọ Igbo nkịtị mmadụ ndị nwere ụgwọ ha ji onye ọzọ, ma zere okwu siri ike ma ọ bụ nke na-adịghị adịkarị n'ọnụ ndị mmadụ.
- source_word: δανιστῇ τινι
  choice: otu onye na-agbazinye ego
  rationale: δανιστής bụ onye na-agbazinye ego kpọmkwem; “otu onye” na-egosipụta τινι dịka onye a na-akọghị aha ya ma bụrụ onye pụrụ iche n'akụkọ ahụ.
- source_word: ὤφειλεν
  choice: ji ya ... ụgwọ
  rationale: Nkebiokwu a bụ ụzọ Igbo doro anya na nke eke isi kwuo na mmadụ ji onye ọzọ ego, kwekọọkwa na ọnọdụ ụgwọ ahụ n'akụkọ.
- source_word: δηνάρια
  choice: dinarị
  rationale: A hapụrụ aha mkpụrụ ego oge ahụ ka e wee chekwaa ihe akụkọ ihe mere eme na-ekwu maka ya; nkọwa ya dị n'okpuru amaokwu.
- source_word: πεντακόσια
  choice: narị ... ise
  rationale: Nke a bụ ụzọ Standard Igbo si ekwu 500, ebe “dinarị” nọ n'etiti ọnụọgụ ahụ n'ụzọ na-ada nke ọma.
- source_word: ἕτερος
  choice: nke ọzọ
  rationale: Nke a na-emepụta ọdịiche eke n'etiti “otu” na onye nke abụọ.
- source_word: πεντήκοντα
  choice: iri ise
  rationale: Nke a bụ ntụgharị kpọmkwem nke 50; a naghị ekwughachi “dinarị” n'ihi na a ghọtara ya site n'ahịrịokwu bu ụzọ.
