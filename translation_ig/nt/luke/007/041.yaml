    text: Dinarị bụ mkpụrụ ego ọlaọcha ndị Rom ji eme ihe; a na-ewerekarị otu dinarị dị ka ụgwọ ọrụ onye ọrụ maka ihe dị ka otu ụbọchị.
    reason: cultural_note
  revision_rationale: The revision restores the second debtor’s indebtedness, explicitly retains the monetary unit for the second amount, and uses a natural paired Igbo construction while preserving the source’s indefinite ‘a certain moneylender’ and historical coin designation.
