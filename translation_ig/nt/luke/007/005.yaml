base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: ig
  text: N’ihi na ọ hụrụ mba anyị n’anya, ọ bụkwa ya onwe ya wuru[a] ụlọ nzukọ ahụ maka anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o mere ka a wuoro anyị ụlọ nzukọ ahụ.” N’asụsụ Grik, ihe e kwuru kpọmkwem bụ “wuru”; nke a nwere ike ịpụta na o wuru ya n’onwe ya, ma ọ bụ na ọ kwadoro ya ma kwụọ ụgwọ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: hụrụ … n’anya
  rationale: Nke a bụ ụzọ Igbo nkịtị, siri ike ma doo anya e si akọwa ịhụnanya, ma ọ naghị eme ka nkwanye ùgwù ndị okenye ahụ nyere ya dị mfe karịa nke Grik.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara arịrịọ ndị okenye ndị Juu kwuru n’amaokwu bu ụzọ.
- source_word: τὸ ἔθνος ἡμῶν
  choice: mba anyị
  rationale: N’ebe a, ndị na-ekwu okwu na-ezo aka n’ọha ndị Juu nke ha dị ka otu agbụrụ na mba; “mba anyị” na-edobe echiche mkpokọta ahụ.
- source_word: τὴν συναγωγήν
  choice: ụlọ nzukọ ahụ
  rationale: Okwu a na-ezo aka n’ụlọ nzukọ ndị Juu a maara n’obodo ahụ. “Ahụ” na-egosipụta mkpụrụ okwu njirimara dị na Grik n’enweghị ịgbakwụnye “anyị,” nke na-adịghị n’ihe odide ahụ.
- source_word: αὐτός
  choice: ọ bụkwa ya onwe ya
  rationale: Nke a na-edobe nkwusiri ike dị na nnọchiaha Grik ahụ, na-egosi na ọ bụ onyeisi agha ahụ n’onwe ya mere ma ọ bụ kwado ka e mee ọrụ ahụ.
- source_word: ᾠκοδόμησεν
  choice: wuru
  rationale: Aorist ahụ na-ekwu ihe mere n’oge gara aga n’ụzọ dị mfe. “Wuru” na-edobe okwu Grik n’enweghị ikpebi ma ọ rụrụ ọrụ ahụ n’onwe ya ma ọ bụ kwụọ ụgwọ ka e wuo ya.
- source_word: ἡμῖν
  choice: maka anyị
  rationale: Dative a na-egosi ndị ritere uru n’ihe ahụ; “maka anyị” bụ ụzọ Igbo ebumpụta ụwa si kwuo ya.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ nghọta abụọ nke “wuru” ka ihe odide Grik si hapụ ya, ma kọwaa ha n’ala ala peeji.
