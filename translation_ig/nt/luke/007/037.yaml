source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: ig
  text: Ma lee, otu nwanyị nọ n’obodo ahụ, onye bụ onye mmehie[a], matara na ọ na-eri nri n’ụlọ onye Farisii ka ọ dina n’akụkụ tebụl[b], wee weta otu ite alabasta nke mmanụ na-esi ísì ụtọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik kwuru naanị “onye mmehie”; ọ kọwaghị ụdị mmehie nwanyị ahụ mere.
    reason: lexical_alternative
  - marker: b
    text: 'Ya bụ, ọ na-eri nri n’ọnọdụ omenala oge ahụ: ndị ọbịa na-edina n’akụkụ tebụl.'
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “otu ite alabasta nke mmanụ na-esi ísì ụtọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Na-edobe ọrụ okwu a dị ka ihe na-adọta uche ma na-ewebata ihe ijuanya n’akụkọ ahụ.
- source_word: γυνὴ
  choice: otu nwanyị
  rationale: N’ebe a ọ pụtara nwanyị, ọ bụghị nwunye; “otu” na-ewebata onye ọhụrụ n’akụkọ ahụ n’ụzọ Igbo si ada nke ọma.
- source_word: ἥτις ἦν ἐν τῇ πόλει
  choice: bi n’obodo ahụ
  rationale: Nke a na-egosi na ọ nọ ma ọ bụ biri n’obodo ahụ n’Igbo doro anya, n’agbanyeghị na Grik ekwughị kpọmkwem na o si ebe ahụ.
- source_word: ἁμαρτωλός
  choice: onye bụ onye mmehie
  rationale: Na-edobe ụdị aha Grik ahụ ma zere ịkọwa ụdị mmehie nwanyị ahụ mere.
- source_word: ἐπιγνοῦσα
  choice: matara
  rationale: Na-egosi na nwanyị ahụ nwetara ozi a tupu omume bụ isi nke iweta karama ahụ.
- source_word: κατάκειται
  choice: na-eri nri ka o dinara
  rationale: Na-ejikọta ihe omume iri nri na omenala oge ahụ nke ịdina n’akụkụ tebụl, ka onye na-agụ ya ghara iche na ọ bụ naanị izu ike.
- source_word: οἰκίᾳ τοῦ Φαρισαίου
  choice: n’ụlọ onye Farisii
  rationale: Ọ bụ usoro Igbo ebumpụta ụwa nke na-edobe onye nwe ụlọ ahụ na njirimara ya.
- source_word: κομίσασα
  choice: wee weta
  rationale: Na-enye isi echiche nke iburu ihe bịa ma na-ejikọta ya nke ọma na usoro akụkọ Igbo.
- source_word: ἀλάβαστρον μύρου
  choice: otu karama alabasta nke ihe na-esi ísì ụtọ
  rationale: Na-edobe ụdị ma ọ bụ ihe e ji mee ite ahụ, ma na-akọwa μύρον n’asụsụ Igbo ndị mmadụ na-aghọta.
theological_decisions:
- issue: Nkọwa omume nwanyị ahụ
  choice: onye bụ onye mmehie
  alternative: nwanyị rụrụ arụ; akwụna
  rationale: Grik kpọrọ ya onye mmehie ma ekwughị ụdị mmehie ya. Ya mere, nsụgharị ahụ anaghị etinye echiche ọdịnala na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere ihe na-adọta uche “Ma lee,” njirimara nwanyị ahụ dị ka onye mmehie n’enweghị ịkọwapụta mmehie ya, na nkọwa omenala nke iri nri ka mmadụ dinara.
