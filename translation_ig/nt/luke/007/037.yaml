  to: Ma lee, otu nwanyị nọ n’obodo ahụ, onye bụ onye mmehie[a], matara na ọ na-eri nri n’ụlọ onye Farisii ka ọ dina n’akụkụ tebụl[b], wee weta otu ite alabasta nke mmanụ na-esi ísì ụtọ[c].
  rationale: The revised text removes the unwarranted implication that the woman lived in the city, uses a less culturally specific term for the alabaster vessel, and relocates the cultural footnote to the reclining-at-table expression. It retains the source’s ambiguity regarding the woman’s sin and preserves the formal but accessible narrative register.
