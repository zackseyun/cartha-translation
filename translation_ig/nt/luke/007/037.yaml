review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the woman’s unspecified designation as ἁμαρτωλός and the meal-setting sense of κατάκειται. However, “bi n’obodo ahụ” specifies residence, whereas ἐν τῇ πόλει states only that she was in the city. “Karama” can imply a modern bottle; “ite alabasta” more safely represents the alabaster container.
  naturalness: The revision uses idiomatic Standard Igbo while making the reclining-meal construction clearer. Moving the cultural-note marker to the reclining phrase also gives it an unambiguous anchor.
  terminology: “Onye bụ onye mmehie” appropriately avoids identifying the woman’s particular sin. “Onye Farisii” and “mmanụ na-esi ísì ụtọ” are suitable, clear renderings. “Ite alabasta” is more materially neutral than “karama alabasta.”
  issues:
  - severity: medium
    issue: “bi n’obodo ahụ” renders ἥτις ἦν ἐν τῇ πόλει too specifically.
    rationale: The Greek says she was “in the city,” without explicitly saying she lived there or was from there. “nọ n’obodo ahụ” preserves this limitation.
  - severity: low
    issue: “karama alabasta” is potentially anachronistically specific.
    rationale: ἀλάβαστρον denotes an alabaster container/flask. “Ite alabasta” is a safer general Igbo term for the vessel.
  - severity: low
    issue: Footnote b is anchored after “onye Farisii,” rather than at the phrase describing reclining.
    rationale: The note explains κατάκειται, not the Pharisee or his house; placing it after “n’akụkụ tebụl” clarifies its referent.
  revised_text: Ma lee, otu nwanyị nọ n’obodo ahụ, onye bụ onye mmehie[a], matara na ọ na-eri nri n’ụlọ onye Farisii ka ọ dina n’akụkụ tebụl[b], wee weta otu ite alabasta nke mmanụ na-esi ísì ụtọ[c].
