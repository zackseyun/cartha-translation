    rationale: ‘Izi’ nwere ike ịpụta izipu mmadụ; ebe a, passive ahụ pụtara na a na-ekwusara ndị ogbenye ozi ọma. Nkọwa ahụ kwesịrị ịkọwa nke a kpọmkwem.
