  verdict: revise
  source_fidelity: 'Ihe odide bụ isi na-asụgharị ndepụta Grik ahụ n’ụzọ kwesịrị ntụkwasị obi: iwu ‘Gaanụ kọọrọ,’ ihe ha hụrụ na nụrụ, na usoro okwu ndị na-egosi ọrụ mgbake. A na-edobe onye na-eme ihe n’amaghị aha n’ebe Grik ji passive. Otú ọ dị, nkọwa ala peeji a banyere ἀναβλέπουσιν na-ekwu ‘ịhụ ụzọ ọzọ,’ nke na-eme ka ‘ịhụ ọzọ/regain sight’ yie ihe ngwaa ahụ pụtara n’ozuzu ya. Ihe ọzọ ngwaa ahụ pụrụ ịpụta bụ ‘ile elu,’ ọ bụghị ‘ịhụ ụzọ ọzọ’; n’amaokwu a, ihe gbara ya gburugburu na-akwado ‘inweta ịhụ ụzọ.’'
  naturalness: Igbo nke amaokwu ahụ bụ Standard Igbo doro anya ma na-agụ nke ọma. ‘Ndị ìsì na-ahụ ụzọ,’ ‘ndị ngwụrọ na-eje ije,’ na ‘a na-ekwusara ndị ogbenye ozi ọma’ bụ okwu ndị e ji eme ihe nke ọma. ‘Ọ zara ha sị’ dị n’usoro asụsụ nkịtị.
  terminology: ‘Dị ọcha’ na-echekwa akụkụ ritual/nhicha dị na καθαρίζονται karịa okwu ọgwụgwọ naanị ya. ‘Ndị ntị chiri’ dabara κωφοί n’ihi ἀκούουσιν. ‘Ozi ọma’ dabara εὐαγγελίζονται, ebe ‘a na-ekwusara’ na-edobe ntụziaka passive. A gbanwere nkọwa b ka ọ ghara iji okwu na-adịghị edo anya ‘a na-ezisa’ kọwaa passive ahụ.
