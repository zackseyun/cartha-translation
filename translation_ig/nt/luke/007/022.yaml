source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: ig
  text: 'Ọ zara ha sị, “Gaanụ kọọrọ Jọn ihe unu hụrụ na ihe unu nụrụ: ndị ìsì na-ahụ ụzọ[a], ndị ngwụrọ na-eje ije, a na-eme ka ndị ekpenta dị ọcha, ndị ntị chiri na-anụ ihe, a na-eme ka ndị nwụrụ anwụ bilie, a na-ekwusara ndị ogbenye ozi ọma[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa Grik ahụ pụrụ ịpụta ‘ile elu’; ma n’ebe a, ọ pụtara inweta ike ịhụ ụzọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị ogbenye bụ ndị a na-ekwusara ozi ọma.” N’asụsụ Grik, ngwaa ahụ dị na passive.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ọ zara ha sị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ugbu a isi gosi na okwu Jizọs bụ nzaghachi nye ha, n’enweghị ntụgharị siri ike dịka ‘mgbe ọ zaghachara.’
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: Gaanụ kọọrọ
  rationale: 'Participul ahụ na-eso iwu ahụ, ya mere iwu abụọ a jikọtara ọnụ na Igbo na-ada nke ọma: ‘Gaanụ kọọrọ.’ ‘Kọọrọ’ na-egosi izighachi akụkọ banyere ihe ha hụrụ ma nụ.'
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: ihe unu hụrụ na ihe unu nụrụ
  rationale: Ọ na-edobe ma ịhụ ma ịnụ dịka ihe ndị ozi ahụ ji aka ha mata.
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: ndị ìsì na-ahụ ụzọ
  rationale: Nke a bụ okwu Igbo ebumpụta ụwa maka inweta ike ịhụ ụzọ; e tinyere nkọwa ala peeji iji chekwaa ohere na ngwaa Grik nwekwara ike ịpụta ịhụ ụzọ ọzọ.
- source_word: χωλοὶ περιπατοῦσιν
  choice: ndị ngwụrọ na-eje ije
  rationale: Ọ bụ ntụgharị doro anya nke na-eji okwu Igbo a na-aghọta nke ọma maka ndị na-enweghị ike ije nke ọma.
- source_word: λεπροὶ καθαρίζονται
  choice: a na-eme ka ndị ekpenta dị ọcha
  rationale: ‘Dị ọcha’ na-echekwa echiche καθαρίζω nke gụnyere ịdị ọcha, ọ bụghị naanị ọgwụgwọ ọrịa; usoro ‘a na-eme ka’ na-edobekwa onye mere ya n’amaghị aha.
- source_word: κωφοὶ ἀκούουσιν
  choice: ndị ntị chiri na-anụ ihe
  rationale: N’ihi na ngwaa bụ ‘ịnụ,’ κωφοί pụtara ndị ntị chiri ebe a, ọ bụghị ndị ogbi.
- source_word: νεκροὶ ἐγείρονται
  choice: a na-eme ka ndị nwụrụ anwụ bilie
  rationale: Usoro a na-edobe passive nke Grik ma ghara ịkpọ onye na-eme ka ha bilie aha.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: a na-ekwusara ndị ogbenye ozi ọma
  rationale: Nke a na-edobe mmetụta passive nke Grik—ndị ogbenye bụ ndị a na-ezitere ozi ọma—ma na-eji okwu Igbo doro anya kama okwu ụka siri ike.
theological_decisions:
- issue: Ndepụta ọrụ ndị a dịka ihe àmà banyere onye Jizọs bụ na ozi ya
  choice: E depụtara ọrụ ndị ahụ kpọmkwem dịka ihe ndị a hụrụ ma nụ, n’etinyeghị nkọwa Mesaya n’ahịrịokwu ahụ.
  alternative: Ịgbakwunye okwu na-ekwu hoo haa na ihe ndị a bụ mmezu amụma Aịzaya.
  rationale: Amaokwu ahụ n’onwe ya na-enye ọrụ ndị a dịka akụkọ a ga-ezigara Jọn. Okwu ndị yiri nke Aịzaya ka dị na ntụgharị ahụ, ma a naghị etinye nkwubi okwu nke amaokwu ahụ ekwughị kpọmkwem.
- issue: Onye na-eme ihe ndị e kwuru na passive
  choice: 'E ji usoro Igbo na-ahapụghị onye na-eme ihe ahụ aha: ‘a na-eme ka…’ na ‘a na-ekwusara…’'
  alternative: Ịsị ‘Chineke na-eme ka ndị nwụrụ anwụ bilie’ ma ọ bụ ‘M na-ekwusara ndị ogbenye ozi ọma.’
  rationale: Grik akpọghị onye na-eme ihe ndị a aha. Ịhapụ ya otu ahụ na-echekwa njide onwe nke ederede ma ghara itinye nkọwa mmụta okpukpe n’ime ntụgharị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ ‘Ọ zara ha sị’ na ‘Gaanụ kọọrọ’ maka asụsụ na-aga were were. E debere usoro passive ebe ọ dị mkpa, ma zere ịkpọ onye na-eme ihe aha mgbe Grik akpọghị ya. E tinyere akara nkọwa [a] n’akụkụ okwu banyere ndị ìsì na [b] n’akụkụ okwu banyere ndị ogbenye, ebe nkọwa ndị ahụ metụtara kpọmkwem.
