  to: Nwa nke Mmadụ abịala, na-eri ma na-aṅụ, unu na-asịkwa, “Lee nwoke a! Onye iribiga nri ókè na onye aṅụrụma,[a] nakwa enyi ndị ọnaụtụ na ndị mmehie!”
