  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: ig
  text: Nwa nke Mmadụ abịala, na-eri ma na-aṅụ, unu na-asịkwa, “Lee nwoke a! Onye iribiga nri ókè na onye aṅụrụma,[a] nakwa enyi ndị ọnaụtụ na ndị mmehie!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ kpọmkwem, “Lee nwoke a! Onye iribiga nri ókè na onye na-aṅụ mmanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: abịala
  rationale: Ụdị ngwaa perfect a na-egosi na ọ bịala, ọ nọkwa ugbu a; “abịala” na-ebupụta nke a n’Igbo nke ọma.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa aha Jizọs ji akpọ onwe ya na njikọ Akwụkwọ Nsọ aha ahụ nwere, n’enweghị ịkọwa ya n’ụzọ ga-ewepụ nghọta ndị ọzọ ọ pụrụ inwe.
- source_word: ἐσθίων καὶ πίνων
  choice: na-eri ihe ma na-aṅụ ihe ọṅụṅụ
  rationale: Ọ na-egosi ihe ọ na-eme mgbe ọ bịara. E kwughị kpọmkwem na nkebi a na ihe ọ na-aṅụ bụ mmanya, ya mere a hapụrụ ya n’ụzọ sara mbara dịka Grik ahụ.
- source_word: λέγετε
  choice: unu na-asịkwa
  rationale: Nke a na-enye present indicative ahụ dịka okwu a na-ekwu ugboro ugboro ma ọ bụ n’oge ahụ, ma “-kwa” na-ejikọta ya na ntụnyere dị n’okwu gbara ya gburugburu.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo dị ugbu a nke na-echekwa ike nke mkpu na ịtụ aka dị na Ἰδοὺ.
- source_word: ἄνθρωπος
  choice: nwoke a
  rationale: A kpọpụtara “nwoke” dịka Grik siri kwuo, ebe “a” na-eme ka mkpu “Lee nwoke a!” daa nke ọma n’Igbo.
- source_word: φάγος
  choice: onye oké oriri
  rationale: Nke a na-egosi onye na-eri ihe gabiga ókè ma na-echekwa ụdị nkọcha siri ike dị n’okwu ahụ.
- source_word: οἰνοπότης
  choice: onye aṅụrụma
  rationale: Nke a bụ ụzọ Igbo dị ndụ si kwuo ebubo mkparị banyere onye na-aṅụ mmanya gabiga ókè; nkọwa ala peeji na-edebe nsụgharị ka mkpụrụokwu si dị nso.
- source_word: φίλος
  choice: enyi
  rationale: “Enyi” bụ nsụgharị kwụ ọtọ ma dị mfe, ebe “nakwa” na-ejikọta ya na ebubo ndị bu ya ụzọ.
- source_word: τελωνῶν
  choice: ndị ọna ụtụ isi
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-anakọta ụtụ isi n’aha ọchịchị.
- source_word: ἁμαρτωλῶν
  choice: ndị mmehie
  rationale: Nke a na-echekwa aha mmekọrịta mmadụ na okpukpe ndị mmegide Jizọs jiri kpọọ ìgwè ahụ.
theological_decisions:
- issue: Nsụgharị aha ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: “Nwa nke Mmadụ” na-echekwa ọdịdị aha ahụ, nkwughachi ya n’Akụkụ Akwụkwọ Nsọ ndị ọzọ, na nghọta Kraịst banyere ya, n’emeghị ka otu nkọwa mechie nghọta ndị ọzọ.
- issue: Ike ebubo ndị a boro Jizọs
  choice: onye oké oriri na onye aṅụrụma
  alternative: onye oké oriri na onye na-aṅụ mmanya
  rationale: Ihe a bụ nkwutọ ndị iro kwuru, ọ bụghị ikpe onye dere akwụkwọ kwadoro. Nsụgharị bụ isi na-echekwa ịdị nkọ nke ebubo ahụ; nkọwa ala peeji na-enye ụzọ dị nso karị n’usoro mkpụrụokwu Grik.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ “iri ihe na ịṅụ ihe ọṅụṅụ” ka ọ bụrụ okwu sara mbara dịka isi mmalite Grik si dị, ma e mere okwu ebubo ahụ ka ọ nọgide bụrụ mkparị siri ike. Akara nkọwa ala peeji [a] pụtara n’ebe okwu ọ na-akọwa dị.
