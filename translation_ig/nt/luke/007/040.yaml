review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the full sense of the Greek: Jesus addresses Simon, states that he has something to say to him, and Simon invites him to speak. The explicit pronoun in “kwuo ya” is a permissible idiomatic expansion of the implied object of εἰπέ.'
  naturalness: “Onye Ozizi” is understandable but is not the most idiomatic Standard Igbo designation for a teacher in direct address. “Onye nkuzi” is clearer and more natural. Naming Simon in the reply removes an avoidable ambiguity caused by “Ọ sịrị,” since the preceding clause also has Jesus as its subject.
  terminology: Use “Onye nkuzi” for διδάσκαλε, preserving its ordinary sense of “Teacher.” “Nna-ukwu” may be retained in the lexical-alternative footnote for “Master,” without making that stronger title the main translation.
  issues:
  - severity: low
    issue: “Onye Ozizi” is less idiomatic than “Onye nkuzi.”
    rationale: For a person who teaches, Standard Igbo normally uses “onye nkuzi”; “ozizi” more directly denotes teaching/instruction.
  - severity: low
    issue: The subject of “Ọ sịrị” can momentarily be read as Jesus.
    rationale: The Greek identifies Simon as the speaker by context and article; repeating “Saịmọn” in Igbo makes the dialogue attribution immediately clear.
