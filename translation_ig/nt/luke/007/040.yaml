  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: ig
  text: Jizọs zara ya sị, “Saịmọn, enwere m ihe m chọrọ ịgwa gị.” Saịmọn sịrị, “Onye nkuzi, kwuo ya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna-ukwu, kwuo okwu.” Okwu Grik Διδάσκαλε pụtara kpọmkwem “Onye nkuzi,” ebe εἰπέ pụtara nanị “kwuo” ma ọ bụ “kwuo okwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν πρὸς αὐτόν
  choice: wee zaa ya sị
  rationale: Nke a na-egosipụta usoro okwu Grik bụ́ ‘zara … sị’ n’ụzọ dị nkenke ma dịkwa mma n’Igbo akụkọ.
- source_word: Σίμων
  choice: Saịmọn
  rationale: A sụgharịghị aha mmadụ; e dere ya ka ụda aha Grik si dị n’Igbo.
- source_word: ἔχω σοί τι εἰπεῖν
  choice: enwere m ihe m ga-agwa gị
  rationale: Nke a na-egosipụta σοί (‘gị’) nke ọma ma na-asụkwa okwu ahụ n’Igbo nkịtị na nke doro anya.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: διδάσκαλος pụtara onye na-akụzi ihe; ‘Onye Ozizi’ na-edobe ihe okwu ahụ pụtara n’etinyeghị echiche ike ọchịchị nke na-adịghị mkpa ebe a.
- source_word: εἰπέ
  choice: kwuo ya
  rationale: Iwu ahụ bụ ka Jizọs kwuo ihe o kwuru na ya nwere ịgwa Saịmọn. ‘Ya’ na-eme ka okwu ahụ bụrụ Igbo eke, ọ bụ ezie na e kwughị ihe nnọchiaha ahụ kpọmkwem na Grik.
- source_word: φησίν
  choice: Ọ sịrị
  rationale: Ọ bụ ezie na Grik ji oge ugbu a nke akụkọ, oge gara aga bụ ụzọ Igbo si akọ akụkọ a nke ọma.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu, mee ihe. A hapụrụ usoro mkparịta ụka ahụ ka ọ dị nkenke dịka ọ dị na Grik.
