review_pass:
  verdict: revise
  source_fidelity: The main clause accurately represents one Pharisee’s ongoing invitation, Jesus’ entry into the Pharisee’s house, and his reclining for the meal. The sentence should retain the narrative connection between the invitation and the subsequent actions. Footnote a’s proposed alternative is not sufficiently clear in Igbo, and footnote b adds “a large meal,” which is not stated by κατεκλίθη or required by the context.
  naturalness: “Otu onye n’ime ndị Farisii nọ na-arịọ ya ka o soro ya rie nri” is natural Standard Igbo. “Ọ dinara n’akụkụ tebụl iri nri” is understandable and appropriately conveys reclining at a meal; linking the clauses with a comma better reflects the Greek narrative flow.
  terminology: “Ndị Farisii” is the established Igbo form for Pharisees. “Rie nri” appropriately renders eating a meal. The cultural note should explain reclining without characterizing the meal as “nnukwu nri.”
  issues:
  - severity: medium
    issue: Footnote a has unclear participant reference.
    rationale: “ka ya na ya rie nri” can sound reflexive or leave the two referents unclear. The Greek means that Jesus should eat with the Pharisee; “ka o soro ya rie nri” expresses this clearly.
  - severity: medium
    issue: Footnote b introduces an unsupported description of the meal.
    rationale: “nnukwu nri” (“a large meal”) is not present in the Greek. κατεκλίθη refers to the customary reclining posture for a meal, not necessarily to the size or special status of the meal.
  - severity: low
    issue: The full stop weakens the explicit narrative continuation marked by καί.
    rationale: A comma keeps the invitation, entry, and reclining within the connected sequence expressed in the source.
  revised_text: Otu onye n’ime ndị Farisii nọ na-arịọ ya ka o soro ya rie nri[a], mgbe ọ banyere n’ụlọ onye Farisii ahụ, ọ dinara n’akụkụ tebụl iri nri[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’usoro okwu Grik, “na-arịọ ya ka o soro ya rie nri.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, dịka omenala iri nri n’oge ahụ si dị, ọ dinara n’akụkụ tebụl kama ịnọdụ ala kwụ ọtọ.
    reason: cultural_note
  revision_rationale: 'The revision preserves the imperfect sense of Ἠρώτα, the purpose of ἵνα φάγῃ μετ’ αὐτοῦ, the prior entry expressed by εἰσελθών, and the meal-reclining sense of κατεκλίθη. It also corrects both footnotes: the lexical alternative now has clear referents, and the cultural note no longer adds that the meal was large.'
