  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: ig
  text: Otu onye n’ime ndị Farisii nọ na-arịọ ya ka o soro ya rie nri[a], mgbe ọ banyere n’ụlọ onye Farisii ahụ, ọ dinara n’akụkụ tebụl iri nri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dabara nnọọ n’usoro okwu Grik, “na-arịọ ya ka o soro ya rie nri.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, dịka omenala iri nri n’oge ahụ si dị, ọ dinara n’akụkụ tebụl kama ịnọdụ ala kwụ ọtọ.
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: nọ na-arịọ
  rationale: Ụdị imperfect na-egosi omume gara n’ihu n’oge gara aga. “Nọ na-arịọ” na-echekwa akụkụ a, ebe ihe a ọ na-eme n’ọnọdụ a bụ ịkpọ ya òkù.
- source_word: δέ
  choice: e gosighị ya n’okwu pụrụ iche
  rationale: Ọ bụ njikọ dị nro na-aga n’ihu n’akụkọ ahụ. Igbo anaghị achọ okwu mmalite pụrụ iche ebe a; ịhapụ ya na-eme ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa n’enweghị itinye echiche nke oge ma ọ bụ nke ọdịiche na-adịghị na isi mmalite.
- source_word: τις τῶν Φαρισαίων
  choice: otu onye n’ime ndị Farisii
  rationale: Nke a na-egosipụta partitive genitive nke ọma ma bụrụkwa ụzọ Igbo doro anya si kwuo “one of the Pharisees.”
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: ka o soro ya rie nri
  rationale: Nke a na-egosipụta nzube nke ἵνα na subjunctive n’Igbo ebumpụta ụwa, ma na-echekwa echiche nke irikọ nri ọnụ.
- source_word: εἰσελθὼν
  choice: mgbe ọ banyere
  rationale: Aorist participle na-egosi na nbata ahụ buru ụzọ mee tupu omume bụ isi; “mgbe ọ banyere” na-egosipụta usoro ahụ nke ọma.
- source_word: οἶκον
  choice: ụlọ
  rationale: “Ụlọ” bụ okwu Igbo kwụ ọtọ maka ebe obibi onye Farisii ahụ.
- source_word: κατεκλίθη
  choice: ọ dinara n’akụkụ tebụl iri nri
  rationale: Okwu ahụ na-ezo aka n’ịdinara n’akụkụ tebụl dịka omenala iri nri n’oge ahụ, ọ bụghị ịnọdụ ala kwụ ọtọ. Nsụgharị a na-echekwa ọnọdụ ahụ, ebe nkọwa ala na-enyere onye na-agụ akwụkwọ aka ịghọta omenala ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Nọ na-arịọ” na-echekwa omume na-aga n’ihu nke imperfect, ebe “ọ dinara n’akụkụ tebụl” na-egosipụta ọnọdụ iri nri nke narị afọ mbụ n’emeghị ka ọ bụrụ omenala Igbo nke oge a.
