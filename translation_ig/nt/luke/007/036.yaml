revisions:
- from: Otu onye n’ime ndị Farisii nọ na-arịọ ya ka o soro ya rie nri[a]. Mgbe ọ banyere n’ụlọ onye Farisii ahụ, ọ dinara n’akụkụ tebụl iri nri[b].
  to: Otu onye n’ime ndị Farisii nọ na-arịọ ya ka o soro ya rie nri[a], mgbe ọ banyere n’ụlọ onye Farisii ahụ, ọ dinara n’akụkụ tebụl iri nri[b].
  rationale: 'The revision preserves the imperfect sense of Ἠρώτα, the purpose of ἵνα φάγῃ μετ’ αὐτοῦ, the prior entry expressed by εἰσελθών, and the meal-reclining sense of κατεκλίθη. It also corrects both footnotes: the lexical alternative now has clear referents, and the cultural note no longer adds that the meal was large.'
