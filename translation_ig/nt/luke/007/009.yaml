id: LUK.7.9
reference: Luke 7:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: ig
  text: Mgbe Jizọs nụrụ ihe ndị a, nwoke ahụ tụrụ ya n’anya. O wee chigharịa gwa igwe mmadụ ahụ na-eso ya, sị, “Ana m agwa unu, ọbụna n’Izrel ahụbeghị m okwukwe dị otú a[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “okwukwe dị ukwuu dị otú a.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ntụkwasị obi”; okwu Grik a bụkwa otu okwu ahụ a na-asụgharịkarị “okwukwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: Mgbe Jizọs nụrụ ihe ndị a
  rationale: Aorist participle ἀκούσας expresses the circumstance preceding the main verb; “Mgbe ... nụrụ” is natural Igbo and preserves the temporal relation. The mild transition δέ is left implicit.
- source_word: ἐθαύμασεν αὐτόν
  choice: ihe banyere nwoke ahụ juru ya anya
  rationale: This idiomatic Igbo wording makes Jesus the experiencer of wonder and the man its object, avoiding the misleading sense that Jesus startled the man.
- source_word: στραφεὶς
  choice: O wee chigharịa
  rationale: “Chigharịa” naturally conveys turning around, while “wee” carries the narrative sequence without overtranslating the participle.
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: igwe mmadụ ahụ na-eso ya
  rationale: 'The progressive relative construction preserves the present participle’s ongoing sense: the crowd was following Jesus.'
- source_word: Λέγω ὑμῖν
  choice: Ana m agwa unu
  rationale: A current, direct Igbo discourse formula that retains the present force and plural address.
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: ọbụna n’Izrel ... ahụbeghị m
  rationale: The combination of “ọbụna” and the negative verb reproduces οὐδέ, while “n’Izrel” preserves the source’s concise locative expression without specifying either land or people more narrowly.
- source_word: τοσαύτην πίστιν
  choice: okwukwe dị otu a
  rationale: “Okwukwe” is the standard Igbo rendering of πίστις here, and “dị otu a” conveys the remarkable degree or quality expressed by τοσαύτην without unnecessarily expanding it.
- source_word: εὗρον
  choice: ahụbeghị m
  rationale: The experiential negative perfect in Igbo naturally conveys that Jesus had not encountered or found such faith up to that point.
theological_decisions:
- issue: Rendering of πίστις
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: The context concerns the centurion’s believing confidence in Jesus’ authority. “Okwukwe” preserves the established theological term without excluding the relational nuance of trust, which is retained in a footnote.
- issue: Referent of ἐν τῷ Ἰσραήλ
  choice: n’Izrel
  alternative: n’etiti ndị Izrel
  rationale: The compact locative wording preserves the Greek ambiguity between Israel as sphere and Israel as the people, rather than silently narrowing it.
translation_notes:
  register: Standard Igbo, natural and dignified narrative style. The wording avoids archaic syntax, keeps the direct speech vivid, and places both supplied footnote markers on the phrase they clarify.
