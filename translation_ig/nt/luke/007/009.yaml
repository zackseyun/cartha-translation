- from: Mgbe Jizọs nụrụ ihe ndị a, ihe banyere nwoke ahụ juru ya anya. O wee chigharịa gwa igwe mmadụ ahụ na-eso ya, sị, “Ana m agwa unu, ọbụna n’Izrel ahụbeghị m okwukwe dị otu a[a][b].”
  to: Mgbe Jizọs nụrụ ihe ndị a, nwoke ahụ tụrụ ya n’anya. O wee chigharịa gwa igwe mmadụ ahụ na-eso ya, sị, “Ana m agwa unu, ọbụna n’Izrel ahụbeghị m okwukwe dị otú a[a][b].”
