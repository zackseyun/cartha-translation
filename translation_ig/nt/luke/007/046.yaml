id: LUK.7.46
reference: Luke 7:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: ig
  text: I teghị mmanụ n’isi m, ma nwanyị a tere mmanụ na-esi ísì ụtọ n’ụkwụ m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλαίῳ
  choice: mmanụ
  rationale: Ọ bụ dative nke ihe e ji mee ihe, sitere na ἔλαιον. “Mmanụ” bụ okwu Igbo doro anya ma kwekọọ n’ebe a; ịkpọ ya kpọmkwem mmanụ oliv adịghị mkpa n’amaokwu a.
- source_word: ἤλειψας / ἤλειψεν
  choice: teghị / tere
  rationale: ἀλείφω pụtara ite ma ọ bụ itinye mmanụ ma ọ bụ ude n’ahụ. “Ite” bụ okwu Igbo e ji ekwu omume ahụ n'ụzọ nkịtị, ma ọ naghị ebubata echiche emume ido mmadụ nsọ nke okwu dị ka “ite mmadụ mmanụ” nwere ike ịkpata.
- source_word: τὴν κεφαλήν μου
  choice: n’isi m
  rationale: Nke a na-asụgharị ihe a na-eme ya na nnọchiaha onye nwe ya n'ụzọ Igbo dị mma ma bụrụkwa nke ziri ezi.
- source_word: αὕτη δὲ
  choice: ma nwanyị a
  rationale: “Nwanyị a” na-egosipụta ike ntụaka nke αὕτη, ebe “ma” na-edobe ọdịiche dị n’etiti ihe onye a na-agwa okwu emeghị na ihe nwanyị ahụ mere.
- source_word: μύρῳ
  choice: mmanụ na-esi ísì ụtọ
  rationale: μύρον bụ mmanụ ma ọ bụ ude na-esi ísì ụtọ. Nhọrọ a doro ndị na-agụ Igbo anya, na-egosikwa ọdịiche ya na mmanụ nkịtị e kwuru na nkebi mbụ.
- source_word: τοὺς πόδας μου
  choice: n’ụkwụ m
  rationale: Nke a bụ nsụgharị nkịtị na nke na-ada nke ọma n’Igbo maka ihe a tere mmanụ, tinyere nnọchiaha onye nwe ya.
theological_decisions:
- issue: Ọdịiche nke nsọpụrụ n’omume ile ọbịa dị n’okwu ịba mba Jizọs
  choice: E ji okwu nkịtị bụ “tere” kọwaa omume ahụ, ka ọdịiche dị n’etiti ileghara ọbịa anya na nsọpụrụ pụrụ iche nwanyị ahụ nyere pụta ìhè.
  alternative: Iji okwu nwere ụda emume ido nsọ, dị ka “tere m mmanụ” n’ụzọ nwere ike ime ka ndị na-agụ ya ghọta ya dị ka emume nchụaja ma ọ bụ nchịkọta eze.
  rationale: Ihe gbara amaokwu a gburugburu na-atụnyere ihe Saimọn na-emeghị dị ka onye nabatara ọbịa na ihe nwanyị ahụ mere iji sọpụrụ Jizọs. Nsụgharị ahụ ekwesịghị ịgbakwunye nkọwa sacrament ma ọ bụ nke Kraịst nke ederede ahụ n’onwe ya anaghị ekwupụta kpọmkwem.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E jiri “mmanụ na-esi ísì ụtọ” mee ka μύρον doo anya n’enweghị mkpa ndetu ala peeji; okwu ahụ na-edobekwa ọdịiche ya na ἔλαιον.
