  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: ig
  text: 'Onye a bụ onye e dere banyere ya, sị: “Lee, ana m ezipụ onye ozi m[a] n’ihu gị[b]; ọ bụ ya ga-akwadebe ụzọ gị n’ihu gị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “onye ozi” dịka “mmụọ ozi,” ma n’ebe a ọ na-ezo aka na Jọn, onye ozi bụ mmadụ.
    reason: lexical_alternative
  - marker: b
    text: N’okwu Grik, nke a pụtara n’ụzọ nkịtị, “n’ihu ihu gị”; “n’ihu gị” bụ ụzọ Igbo si ekwu ya nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: Onye a
  rationale: Na-ezo aka n’ebe Jọn nọ n’ụzọ doro anya ma bụrụkwa okwu Igbo e ji ekwu banyere mmadụ.
- source_word: περὶ οὗ γέγραπται
  choice: onye e dere banyere ya
  rationale: Na-echekwa usoro e ji kpọtụrụ ihe e dere n’Akwụkwọ Nsọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Na-echekwa oku ka onye na-ege ntị ṅaa ntị na ụda dị elu nke amụma ahụ.
- source_word: ἀποστέλλω
  choice: ana m ezipụ
  rationale: Na-egosipụta omume dị ugbu a nke okwu amụma ahụ n’ụzọ doro anya ma dị ndụ.
- source_word: ἄγγελόν
  choice: onye ozi
  rationale: Okwu Grik ahụ nwere ike ịpụta onye ozi ma ọ bụ mmụọ ozi; ebe a ọ na-ezo aka na Jọn, onye bụ mmadụ e zitere ozi.
- source_word: πρὸ προσώπου σου
  choice: n’ihu gị
  rationale: Ọ bụ okwu Igbo nkịtị nke na-echekwa echiche nke ịnọ n’ihu mmadụ, ma okwu ‘ihu’ dịkwa n’ime ya dịka ọ dị n’onyinyo Grik.
- source_word: κατασκευάσει
  choice: ga-akwadebe
  rationale: Na-egosipụta ime ka ihe dị njikere, ma na-echekwa oge ọdịnihu nke ngwaa Grik.
- source_word: τὴν ὁδόν σου
  choice: ụzọ gị
  rationale: ‘Ụzọ’ na-arụ ọrụ nke ọma ma maka ụzọ a na-aga ma maka ihe atụ amụma dị n’amaokwu a.
- source_word: ἔμπροσθέν σου
  choice: n’ihu gị
  rationale: Na-echekwa nkwughachi nke echiche ‘n’ihu gị’ dị n’isi mmalite ahụ kama ihichapụ ya n’ihi ịdị mfe.
theological_decisions:
- issue: Itinye okwu amụma ahụ n’ọrụ nye Jọn n’ihe gbasara Jizọs
  choice: E debere nnọchiaha onye nke abụọ—‘gị’ na ‘ụzọ gị’—n’enweghị nkọwa agbakwunyere.
  alternative: Ịgbasa ya site n’ịkpọ onye ụzọ ahụ bụ nke ya ‘Onyenwe anyị’ ma ọ bụ ‘Mezaịa’ kpọmkwem.
  rationale: Ihe odide Grik n’onwe ya hapụrụ okwu ahụ n’ụdị nnọchiaha. Idebe ya otú ahụ na-echekwa ike na esemokwu nkà mmụta okpukpe dị na ntinye Jizọs tinyere okwu ahụ, n’enweghị ịgbakwunye nkọwa.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu kwesịrị okwu Akwụkwọ Nsọ. E chekwara nkwughachi ‘n’ihu gị’ nke dị n’isi mmalite, ebe e ji akara nkọwa kọwaa isi ihe abụọ nwere nhọrọ ntụgharị.
