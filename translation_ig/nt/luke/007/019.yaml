  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: ig
  text: O zigara Onyenwe anyị ozi, sị, “Ị̀ bụ Onye Na-abịa,[a] ka anyị ga-atụ anya onye ọzọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye ahụ na-abịa.” Okwu Grik ahụ nwere ike ịbụ nkọwa banyere onye na-abịa, ma n'ebe a o yikarịrị ka ọ na-arụ ọrụ dịka aha e ji amata Mesaya ahụ a na-atụ anya ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεμψεν
  choice: O zigara ozi
  rationale: Ngwaa ahụ na-egosi iziga mmadụ ma ọ bụ ndị a kpọtụrụ aha n'amaokwu bu ụzọ; ‘zigara ozi’ na-eme ka Igbo bụrụ nke zuru oke n'ebughị onye e zigara n'ime amaokwu a.
- source_word: πρὸς τὸν κύριον
  choice: ka a gwa Onyenwe anyị
  rationale: πρός na-egosi onye ozi ahụ gara n'ebe ọ nọ; n'Igbo, ‘ka a gwa’ na-ejikọta nke a n'ụzọ eke na λέγων, ebe ‘Onyenwe anyị’ na-echekwa ịdị arọ nke κύριος dịka aha e ji akpọ Jizọs.
- source_word: λέγων
  choice: sị
  rationale: Nke a na-ebute kpọmkwem ihe ozi ahụ kwuru n'ụzọ Igbo dị mfe ma bụrụ nke eke.
- source_word: Σὺ εἶ
  choice: Ị̀ bụ
  rationale: A tụgharịrị ya dịka ajụjụ kpọmkwem, dịka usoro okwu na gburugburu ya chọrọ.
- source_word: ὁ ἐρχόμενος
  choice: Onye ahụ nke na-abịa abịa
  rationale: Nke a na-echekwa participle nke nọ ugbu a na ọrụ ya dịka aha onye a na-atụ anya ya, n'etinyeghị nkọwa Mesaya kpọmkwem n'ime ederede.
- source_word: ἢ ἄλλον προσδοκῶμεν
  choice: ka anyị ga na-atụ anya onye ọzọ?
  rationale: ‘Na-atụ anya’ na-egosi atụmanya na-aga n'ihu; ‘onye ọzọ’ na-anọchi ἄλλον n'ụzọ doro anya.
theological_decisions:
- issue: Iji κύριος dịka aha e ji akpọ Jizọs
  choice: Onyenwe anyị
  alternative: nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma nsọpụrụ okwu ahụ nwere ma ịdị arọ ya n'akụkọ Luk; ‘nna ukwu’ nwere ike ime ka ihe okwu ahụ pụtara dị warara.
- issue: Ma ὁ ἐρχόμενος bụ aha Mesaya ka ọ bụ naanị nkọwa
  choice: Onye ahụ nke na-abịa abịa
  alternative: Onye Na-abịa Abịa; onye ahụ nke ga-abịa
  rationale: Nhọrọ a na-eme ka ọrụ ya dịka aha onye pụrụ iche pụta ìhè, ma na-echekwa ụdị participle na enweghị ịkpọ ‘Mesaya’ kpọmkwem. Ihe odide ahụ ka na-ahapụ ntakịrị oghere n'etiti aha pụrụ iche na nkọwa.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘zigara ozi ka a gwa’ mee ka njikọ nke ἔπεμψεν, πρὸς, na λέγων daa nke ọma n'Igbo, n'agbanyeghị na Grik hapụrụ ihe e zigara n'amaghị aha n'amaokwu a.
