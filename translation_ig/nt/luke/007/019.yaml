  verdict: revise
  source_fidelity: Ederede a na-echekwa ajụjụ abụọ ahụ na okwu ἄλλον nke ọma, ma “zigara ozi ka a gwa” na-agbanwe nhazi ahụ ntakịrị site n’itinye echiche nke ‘ka a gwa.’ Ọzọkwa, “na-abịa abịa” abụghị ụzọ Igbo Izugbe kacha eke isi sụgharị ὁ ἐρχόμενος, ma nwee ike ịpụta omume a na-eme ugboro ugboro karịa aha/okwu a na-atụ anya ya.
  naturalness: “O zigara Onyenwe anyị ozi” bụ Igbo doro anya ma dị mfe, na-enweghị itinye onye e zitere nke Grik hapụrụ ka ọnọdụ amaokwu ndị bu ụzọ gosi. “Onye Na-abịa” na-adị eke dịka aha e ji amata onye ahụ; “ka anyị ga-atụ anya” na-egosi ajụjụ banyere atụmanya n’ọdịnihu nke ọma karịa “ga na-atụ anya.”
  terminology: “Onyenwe anyị” bụ ntụgharị kwesịrị ekwesị maka κύριον n’ebe a. “Onye Na-abịa” na-echekwa ike okwu ahụ dịka aha nwere ike ịdị mkpa, ma footnote na-echekwa ohere a gụrụ ya dịka naanị nkọwa.
