  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: ig
  text: Mgbe ndị ikom ahụ bịakwutere ya, ha sịrị, “Jọn onye na-eme baptizim zitere anyị ka anyị bịakwute gị, sị, ‘Ọ bụ gị ka bụ Onye ahụ ga-abịa,[a] ka anyị ga-atụ anya onye ọzọ?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye Na-abịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτὸν
  choice: Mgbe ndị ikom ahụ bịakwutere ya
  rationale: E ji ‘bịakwutere ya’ gosipụta ọbịbịa na ịbịaru ya nso n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: οἱ ἄνδρες
  choice: ndị ikom ahụ
  rationale: ἀνήρ na-ezo aka kpọmkwem n’ụmụ nwoke ndị ozi ahụ, ya mere a hapụghị nkọwa nwoke dị na isi mmalite.
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: Jọn Onye Na-eme Baptizim
  rationale: Nke a bụ aha ọrụ doro anya, nke ndị na-agụ Igbo ga-aghọta, ma ọ naghị etinye nkọwa ụka pụrụ iche.
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: zitere anyị ka anyị bịakwute gị sị
  rationale: Nke a na-ejikọta iziga ha, ebe ha gara, na ozi ọnụ ha wetara n’ụzọ Igbo dị mfe ma na-echekwa usoro echiche Grik.
- source_word: ὁ ἐρχόμενος
  choice: onye ahụ nke ga-abịa
  rationale: Nke a na-echekwa nkọwa nke onye a na-atụ anya ọbịbịa ya, tinyere ike ya dị ka aha e ji amata onye pụrụ iche, n’enweghị ịkpọ ya aha nkọwa okpukpe ọzọ.
- source_word: ἄλλον προσδοκῶμεν
  choice: ka ànyị kwesịrị ịtụ anya onye ọzọ
  rationale: ‘Ịtụ anya’ na-egosipụta προσδοκάω nke ọma; ‘kwesịrị’ na-eme ka ajụjụ mkpebi dị na ụdị ngwaa ahụ doo anya n’Igbo.
theological_decisions:
- issue: Ike Mesaya dị na ὁ ἐρχόμενος
  choice: onye ahụ nke ga-abịa
  alternative: Onye Na-abịa Abịa
  rationale: Nhọrọ bụ isi na-edobe okwu ahụ ka ọ bụrụ nkọwa pụrụ iche nke onye a na-atụ anya ya, ma ọ naghị akọwapụta hoo haa na ọ bụ Mesaya ma ọ bụ tinye ihe na-adịghị n’ederede. Ihe ọzọ dị n’ala peeji na-egosipụta otú e nwere ike isi were ya dị ka aha nsọpụrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ajụjụ ahụ n’ụdị okwu ndị ozi ahụ kwuru ozugbo, ma e zere okwu ụka pụrụ iche.
