revisions:
- from: Mgbe ndị ikom ahụ bịakwutere ya, ha sịrị, “Jọn Onye Na-eme Baptizim zitere anyị ka anyị bịakwute gị sị, ‘Ọ bụ gị bụ onye ahụ nke ga-abịa,[a] ka ànyị kwesịrị ịtụ anya onye ọzọ?’”
  to: Mgbe ndị ikom ahụ bịakwutere ya, ha sịrị, “Jọn onye na-eme baptizim zitere anyị ka anyị bịakwute gị, sị, ‘Ọ bụ gị ka bụ Onye ahụ ga-abịa,[a] ka anyị ga-atụ anya onye ọzọ?’”
  rationale: The revision keeps the source’s narrative sequence and emphatic question, improves idiomatic Standard Igbo, and replaces an inaccurate footnote alternative with a faithful participial alternative. Capitalization in the main text may signal the expression’s recognized referential force in context without resolving its identity beyond the wording of the question.
