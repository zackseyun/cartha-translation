    text: Ma ọ bụ, “Onye Na-abịa.”
    reason: lexical_alternative
  revision_rationale: The revision keeps the source’s narrative sequence and emphatic question, improves idiomatic Standard Igbo, and replaces an inaccurate footnote alternative with a faithful participial alternative. Capitalization in the main text may signal the expression’s recognized referential force in context without resolving its identity beyond the wording of the question.
