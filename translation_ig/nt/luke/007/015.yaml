  text: καὶ ἀνεκάθισεν ὁ νεκρὸς καὶ ἤρξατο λαλεῖν, καὶ ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: ig
  text: Onye ahụ nwụrụ anwụ wee bilie nọdụ ala, malite ikwu okwu; Jizọs wee nye ya n'aka nne ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Jizọs wee nyeghachi ya n'aka nne ya,” ma ọ bụ, “Jizọs wee kpọghachitere nne ya ya.” N'asụsụ Grik, e ji naanị ngwaa pụtara “nye” mee ihe; ọnọdụ akụkọ ahụ na-egosi na a na-enyeghachi ya nne ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: bilie nọdụ ala
  rationale: Okwu a na-egosi na onye dina ala weliri onwe ya nọdụ ala; ntụgharị a bụ Igbo doro anya ma ghara ịsị na o biliri guzoro ọtọ.
- source_word: ὁ νεκρός
  choice: onye ahụ nwụrụ anwụ
  rationale: Nke a na-edobe ntụaka ahụ nye nwoke ahụ nwụrụ na mbụ, n'asụsụ Igbo dị ùgwù ma bụrụkwa nke nkịtị karịa ịkpọ ya ozu.
- source_word: ἤρξατο λαλεῖν
  choice: malite ikwu okwu
  rationale: Nke a na-egosipụta kpọmkwem mmalite nke ikwu okwu, ma dabara n'ụdị akụkọ Igbo.
- source_word: λαλεῖν
  choice: ikwu okwu
  rationale: Nhọrọ a bụ okwu Igbo nkịtị, doro anya, ma nwee ndebanye kwesịrị ekwesị maka akụkọ Akwụkwọ Nsọ.
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: Jizọs wee nye ya nne ya
  rationale: Dị ka Grik si kwuo, e jidere ngwaa ahụ n'echiche nkịtị nke 'inye,' n'etinyeghị 'nyeghachi' n'ahịrị bụ isi. E jiri 'Jizọs' mee isiokwu ahụ ka ntụaka nnọchiaha doo anya n'Igbo, ebe amaokwu ndị gbara ya gburugburu mere ka onye na-eme ihe ahụ doo anya.
theological_decisions:
- issue: Ma a ga-eme ka o doo anya na Jizọs nyeghachiri nwa ahụ nne ya site n'iji 'nyeghachi'
  choice: Debe okwu dị mfe, 'nye ya nne ya'
  alternative: Jizọs wee nyeghachi ya nne ya
  rationale: Ọnọdụ akụkọ ahụ na-egosi n'ezie na e weghachiri nwa ahụ nye nne ya, ma Grik ji δίδωμι, 'nye,' n'enweghị okwu ọzọ pụtara 'ọzọ' ma ọ bụ 'laghachi.' Ya mere, ahịrị bụ isi na-edobe okwu ahụ dị mfe, ebe nkọwa ala peeji na-egosi nghọta ọzọ kwere omume.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A họọrọ usoro akụkọ 'wee' iji mee ka omume ndị ahụ soro ibe ha nke ọma. E zere okwu pụrụ iche nke otu ụka ma ọ bụ nkọwa okpukpe a gbakwụnyere n'ederede.
