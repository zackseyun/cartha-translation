id: LUK.7.25
reference: Luke 7:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: ig
  text: Ma gịnị ka unu pụrụ ịhụ? Nwoke yi uwe ndị dị nro?[a] Lee, ndị na-eyi uwe ndị mara mma ma na-ebi ndụ okomoko nọ n’obí ndị eze.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe ndị dị nro ma dị mma.” Okwu ahụ na-ekwu maka uwe dị nro, nke a na-ejikọta na ndụ okomoko, ọ bụghị adịghị ike n’omume.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ogige ndị eze.” Okwu Grik ahụ na-ezo aka n’ebe ndị eze bi ma ọ bụ n’ụlọikpe ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-aga n’ihu n’ajụjụ Jizọs ji atụgharị uche, ma na-egosi ọdịiche.
- source_word: ἐξήλθατε ἰδεῖν
  choice: ka unu pụrụ ịhụ
  rationale: Na-egosipụta aorist na infinitive nke nzube n’ụzọ ajụjụ na-ada nke ọma n’Igbo.
- source_word: ἄνθρωπον
  choice: Nwoke
  rationale: Ọ na-ekwu maka otu nwoke, ya bụ Jọn, ọ bụghị mmadụ n’ozuzu.
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: yi uwe ndị dị nro
  rationale: Na-edobe onyinyo nkịtị nke uwe dị nro ma dị oke ọnụ, n’enweghị ịtụgharị ya ka ọ bụrụ adịghị ike n’omume.
- source_word: ἰδοὺ
  choice: Lee
  rationale: Okwu Igbo doro anya nke na-adọta uche onye na-ege ntị n’ihe na-esote.
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: na-eyi uwe ndị mara mma
  rationale: Na-ekwupụta uwe mara ebube ma dị oke ọnụ n’asụsụ Igbo nke oge a.
- source_word: τρυφῇ ὑπάρχοντες
  choice: na-ebi ndụ okomoko
  rationale: N’Igbo, nke a na-egosi ọnọdụ ibi ndụ n’ụba na ihe ụtọ nke ọma karịa nsụgharị aha nkịtị.
- source_word: ἐν τοῖς βασιλείοις
  choice: n’obí ndị eze
  rationale: Na-edobe ihe gbasara ebe obibi ma ọ bụ ogige ndị eze, tinyere echiche plural nke okwu Grik.
theological_decisions:
- issue: Ihe μαλακοῖς pụtara n’ebe a
  choice: Uwe dị nro, mara mma, nke e ji ndụ okomoko mara
  alternative: Uwe na-egosi ịbụ onye na-adịghị ike ma ọ bụ omume e lere anya dị ka nke nwanyị
  rationale: Ọnọdụ okwu ahụ na-atụnyere ndụ siri ike n’ọzara na ndụ okomoko n’obí eze; ọ bụghị ikpe gbasara àgwà nwoke ma ọ bụ omume ọma.
- issue: Ebe βασιλείοις na-ezo aka na ya
  choice: Obí ndị eze
  alternative: Ogige ndị eze
  rationale: Okwu Grik ahụ nwere ike ịpụta ebe obibi eze ma ọ bụ ọnọdụ ụlọikpe eze; “obí ndị eze” bụ okwu Igbo doro anya ma na-edobe echiche bụ isi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “unu” chekwaa plural nke onye a na-agwa okwu. E debere usoro ajụjụ nkwupụta na ọdịiche dị n’etiti ọzara na ndụ obí eze.
