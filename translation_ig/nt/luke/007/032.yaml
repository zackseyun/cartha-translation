- from: Ha dị ka ụmụaka ndị nọ ọdụ n'ámá ahịa, na-akpọ ibe ha òkù[a], na-asị, ‘Anyị kpọụrụ unu ọjà, ma unu eteghị egwu; anyị bụrụụrụ unu abụ akwa[b], ma unu akwaụghị ákwá.’
  to: Ha dị ka ụmụaka ndị nọ ọdụ n'ámá ahịa, na-akpọ ibe ha[a], na-asị, ‘Anyị kpọọrọ unu ọjà, ma unu agbaghị egwu; anyị bụrụụrụ unu abụ akwa[b], ma unu akwaụghị ákwá.’
  rationale: The revision removes the invitation sense introduced by “òkù” and replaces the ambiguous dance expression with the direct Standard Igbo idiom “agbaghị egwu.” No theological interpretation is added, and both lexical-alternative footnotes remain correctly anchored.
