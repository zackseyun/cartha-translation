id: LUK.7.32
reference: Luke 7:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: ig
  text: Ha dị ka ụmụaka ndị nọ ọdụ n'ámá ahịa, na-akpọ ibe ha[a], na-asị, ‘Anyị kpọọrọ unu ọjà, ma unu agbaghị egwu; anyị bụrụụrụ unu abụ akwa[b], ma unu akwaụghị ákwá.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-etiku ibe ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “abụ iru uju” ma ọ bụ “abụ olili.” Okwu Grik ahụ nwere ike ịpụta ịbụ abụ akwa, karịchaa abụ a na-abụ n'oge iru uju ma ọ bụ olili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: Ha dị ka
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si webata ntụnyere ahụ.
- source_word: παιδίοις
  choice: ụmụaka
  rationale: Ọ na-ezo aka n'usoro sara mbara n'ebe ụmụaka nọ, n'ekwughị kpọmkwem afọ ha ma ọ bụ ma ha bụ nwoke ka ha bụ nwanyị.
- source_word: ἐν ἀγορᾷ
  choice: n'ámá ahịa
  rationale: Nke a na-egosi ebe ọha na-ezukọ ma na-azụ ahịa, dịka ἀγορά si pụta n'ọnọdụ a.
- source_word: καθημένοις
  choice: ndị nọ ọdụ
  rationale: Ọ na-edobe ọnọdụ ụmụaka ahụ n'ụzọ dị mfe ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: na-akpọ ibe ha òkù
  rationale: Ọ na-echekwa echiche nke ịkpọrịta ibe ha n'olu, tinyere nghọta mmeghachi omume nke ἀλλήλοις.
- source_word: ἃ λέγει
  choice: na-asị
  rationale: Nke a bụ usoro Igbo dị ụtọ nke na-ewebata okwu ụmụaka ahụ n'agbanyeghị ọdịdị mkpokọta dị n'okwu Grik.
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: Anyị kpọụrụ unu ọjà
  rationale: αὐλέω na-ekwu kpọmkwem maka ịkpọ ọjà ma ọ bụ ụdị opi; ‘kpọụrụ unu ọjà’ na-eme ka ngwa egwu ahụ doo anya.
- source_word: οὐκ ὠρχήσασθε
  choice: unu eteghị egwu
  rationale: ‘Ịte egwu’ bụ ụzọ Igbo ebumpụta ụwa si kwuo ịgba egwu, ma na-echekwa omume a na-ahụ anya n'ihe atụ ahụ.
- source_word: ἐθρηνήσαμεν
  choice: anyị bụrụụrụ unu abụ akwa
  rationale: Ọ na-echekwa echiche nke ịbụ abụ iru uju ma ọ bụ abụ olili, nakwa ọdịiche ya na ịkpọ ọjà.
- source_word: οὐκ ἐκλαύσατε
  choice: unu akwaụghị ákwá
  rationale: Ọ na-asụgharị κλαίω dịka ịkwa ákwá n'ụzọ doro anya ma dị nsọpụrụ.
theological_decisions:
- issue: Ichekwa ike ihe atụ nke omume abụọ dị iche n'etinyeghị nkọwa banyere ihe Jizọs bu n'uche n'amaokwu a
  choice: 'E jiri okwu omume a na-ahụ anya: ‘kpọụrụ unu ọjà,’ ‘eteghị egwu,’ ‘bụrụụrụ unu abụ akwa,’ na ‘akwaụghị ákwá.’'
  alternative: Iji okwu nkọwa dịka ‘anyị mere emume’ na ‘anyị ruru uju.’
  rationale: Amaokwu ahụ n'onwe ya na-enye ihe atụ, ọ naghị akọwa ngwa ya ebe a. Okwu ndị a họọrọ na-echekwa onyonyo ahụ na nrụgide nkà mmụta okpukpe ya n'ebughị nkọwa bata.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. E debere usoro ihe atụ na mmeghachi omume ụmụaka ahụ n'ụzọ dị nkenke; akara ụda olu ole na ole na-enyere aka ịmata okwu ndị nwere ike ịgbagwoju anya.
