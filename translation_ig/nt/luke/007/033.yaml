id: LUK.7.33
reference: Luke 7:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: ig
  text: N’ihi na Jọn Onye Na-eme Baptizim abịala, ọ naghị eri achịcha, ọ naghịkwa aṅụ mmanya, unu na-asịkwa, “O nwere mmụọ ọjọọ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ okwu Igbo si adịkarị, “Mmụọ ọjọọ ejidela ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: abịala
  rationale: Ụdị ngwaa zuru oke a na-egosi na Jọn bịara, ọbịbịa ya ka nwekwara mkpa n’okwu a; “abịala” na-echekwa echiche ahụ n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Jọn Onye Na-eme Baptizim
  rationale: Aha a na-eme ka ọrụ Jọn pụta ìhè n’enweghị ime ya aha otu ụka.
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: ọ naghị eri achịcha, ọ naghịkwa aṅụ mmanya
  rationale: A hapụrụ ἄρτον dịka “achịcha” kama ime ka ọ bụrụ nri niile, ma e jiri usoro Igbo doro anya gosi ụzọ ndụ Jọn nke ịjụ onwe ya ihe.
- source_word: λέγετε
  choice: unu na-asịkwa
  rationale: Oge ugbu a na-egosi ihe ndị a na-agwa na-emekarị ma ọ bụ na-ekwu mgbe niile.
- source_word: Δαιμόνιον ἔχει
  choice: O nwere mmụọ ọjọọ
  rationale: Nke a na-agbasochi usoro okwu Grik ahụ anya ma na-echekwa ike ebubo ahụ; e tinyeghị okwu dị iche “mmụọ na-adịghị ọcha” n’ebe δαιμόνιον dị.
theological_decisions:
- issue: Otú e si sụgharịa δαιμόνιον n’ebubo e boro Jọn
  choice: mmụọ ọjọọ
  alternative: mmụọ na-adịghị ọcha
  rationale: δαιμόνιον pụtara mmụọ ọjọọ n’ebe a. “Mmụọ na-adịghị ọcha” bụ okwu nwere njikọ n’echiche, ma ọ bụghị okwu Grik e ji mee ihe n’amaokwu a.
- issue: Otú e si ghọta Δαιμόνιον ἔχει
  choice: O nwere mmụọ ọjọọ
  alternative: Mmụọ ọjọọ ejidela ya
  rationale: Isi ederede na-echekwa okwu Grik kpọmkwem nke na-asị na o nwere mmụọ ọjọọ, ebe ụzọ ọzọ dị n’okpuru ala na-enye okwu Igbo a na-ejikarị akọwa ọnọdụ ahụ n’enweghị iwepụ ọdịiche ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee ihe. “Jọn Onye Na-eme Baptizim” na-akọwa ọrụ ya nke ọma n’enweghị ịkpọ aha otu okpukpe. E debere “achịcha” na “mmanya” dịka ihe ndị ederede Grik kpọrọ kpọmkwem.
