id: LUK.7.10
reference: Luke 7:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: ig
  text: Mgbe ndị e zigara laghachiri n’ụlọ ahụ, ha hụrụ na ahụ́ dị ohu ahụ[a] mma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye na-eje ozi.” Okwu Grik bụ doulos, nke nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi,” dịka ọnọdụ okwu siri dị.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: Mgbe ... laghachiri
  rationale: Aorist participle a na-arụ ọrụ oge; usoro a na-egosi na nlọghachi ahụ mere tupu ha achọpụta ọnọdụ ohu ahụ, ma ọ na-ada nke ọma n’Igbo.
- source_word: εἰς τὸν οἶκον
  choice: n’ụlọ ahụ
  rationale: εἰς na-egosi ije ruo ma ọ bụ banye n’ebe ahụ. “N’ụlọ ahụ” bụ ụzọ Igbo si ekwu nke a n’ụzọ eke n’okwu akụkọ, n’enweghị ịkọwa ya dị ka ụlọ nke ha onwe ha.
- source_word: οἱ πεμφθέντες
  choice: ndị e zigara
  rationale: Nke a na-echekwa olu nnara nke participle πέμπω ma ghara ịtinye aha nkọwa dịka “ndị ozi.”
- source_word: εὗρον
  choice: ha hụrụ
  rationale: N’akụkọ a, “ha hụrụ” bụ nsụgharị Igbo doro anya ma dịkwa eke nke εὑρίσκω.
- source_word: τὸν δοῦλον
  choice: ohu ahụ
  rationale: δοῦλος ebe a na-egosi onye nọ n’okpuru ikike onyeisi agha ahụ ma bụrụkwa ohu ya. “Ohu” na-echekwa ọnọdụ mmekọrịta mmadụ a karịa okwu sara mbara maka onye na-eje ozi.
- source_word: ὑγιαίνοντα
  choice: na ahụ́ dị ... mma
  rationale: ὑγιαίνω pụtara ịdị mma n’ahụ́ ma ọ bụ ịdị n’ezi ahụ́ ike. Nkebiokwu Igbo a bụ nke eke, ọ naghịkwa etinye okwu siri ike karị bụ “a gwọọla ya,” ọ bụ ezie na ọnọdụ akụkọ ahụ na-egosi mgbake.
theological_decisions:
- issue: Nsụgharị δοῦλος n’akụkọ ọgwụgwọ a
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Ọnọdụ onye ahụ n’okpuru ikike onyeisi agha ka dị mkpa n’akụkọ a, δοῦλος adịghịkwa egosi naanị onye e goro ọrụ. Ya mere, “ohu” na-echekwa ihe okwu Grik ahụ pụtara n’usoro mmekọrịta mmadụ, ebe ndetu ala na-edobe nsụgharị sara mbara nke a na-ejikarị eme ihe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A haziri participle Grik ka ọ bụrụ nkebiokwu oge “Mgbe ...,” e jikwa akpaalaokwu “ahụ́ dị ... mma” mee ka ὑγιαίνοντα daa nke ọma n’Igbo. E tinyere akara ndetu [a] ozugbo n’azụ okwu “ohu ahụ,” nke ọ na-akọwa.
