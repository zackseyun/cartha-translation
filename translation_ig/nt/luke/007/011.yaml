  to: O wee bụrụ na n’echi ya, ọ gara n’obodo a na-akpọ Nain. Ndị na-eso ụzọ ya na nnukwu ìgwè mmadụ sokwa ya na-aga.
  rationale: The revision replaces an unclear opening with a natural Igbo narrative formula while retaining the temporal reference and event-introducing force. It also corrects the transliteration of Ναΐν to Nain. The footnote is retained and expressed more idiomatically, without implying that the variant has the same precise temporal sense as “the next day.”
