reference: Luke 7:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἑξῆς ⸀ἐπορεύθη εἰς πόλιν καλουμένην Ναΐν, καὶ συνεπορεύοντο αὐτῷ οἱ μαθηταὶ ⸀αὐτοῦ καὶ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: ig
  text: O wee bụrụ na n’echi ya, ọ gara n’obodo a na-akpọ Nain. Ndị na-eso ụzọ ya na nnukwu ìgwè mmadụ sokwa ya na-aga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo
  rationale: Nke a bụ ụzọ Igbo si akọwa usoro akụkọ ọhụrụ n'ụzọ ebumpụta ụwa, ma na-echekwa ọrụ okwu Luk ji webata ihe merenụ.
- source_word: ἐν τῷ ἑξῆς
  choice: n’echi ya
  rationale: N’ebe a, ahịrịokwu ahụ na-ezo aka n’ụbọchị sochirinụ; nsụgharị a dị nkenke ma doo ndị na-agụ Igbo anya.
- source_word: ἐπορεύθη
  choice: ọ gara
  rationale: Ọ bụ nsụgharị Igbo dị mfe ma kwekọọ n’echiche πορεύομαι nke ịga ma ọ bụ ime njem.
- source_word: εἰς πόλιν
  choice: n’otu obodo
  rationale: Obodo bụ okwu Igbo nkịtị nke nwere ike ịkọwa obere obodo dịka Nein; “n’otu” na-eme ka ntinye obodo ahụ n’akụkọ doo anya.
- source_word: καλουμένην Ναΐν
  choice: a na-akpọ Nein
  rationale: Nke a na-egosipụta participle καλουμένην n’ụzọ Igbo ebumpụta ụwa, ma na-ede aha ebe ahụ dịka “Nein.”
- source_word: συνεπορεύοντο
  choice: sokwa ya na-aga
  rationale: Ụdị a na-echekwa ma echiche iso ya ma ọnọdụ njem na-aga n’ihu nke imperfect ahụ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya a na-ejikarị akọwa μαθηταί n’Oziọma ndị ahụ.
- source_word: ὄχλος πολύς
  choice: nnukwu ìgwè mmadụ
  rationale: Ọ na-egosipụta ìgwè mmadụ buru ibu n’asụsụ Igbo doro anya ma dị ugbu a.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. E chekwara usoro akụkọ Luk na echiche njem na-aga n’ihu, n’enweghị ịgbakwunye nkọwa okpukpe na-adịghị na isi mmalite.
