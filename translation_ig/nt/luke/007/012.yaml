id: LUK.7.12
reference: Luke 7:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: ig
  text: Mgbe ọ bịaruru nso n’ọnụ ụzọ ámá obodo ahụ, lee, a na-ebupụ nwoke nwụrụ anwụ, onye bụ naanị nwa nwoke nne ya nwere[a]. Nne ya bụ nwanyị di ya nwụrụ, otu ìgwè mmadụ buru ibu sitere n’obodo ahụ nọnyere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “naanị otu nwa nwoke nne ya nwere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: Mgbe ọ bịaruru nso
  rationale: Nke a na-egosi oge ihe ahụ mere na ịbịaru nso, ma na-eme ka akụkọ ahụ gaa n’ihu n’ụzọ Igbo na-adị mfe nghọta.
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: n’ọnụ ụzọ ámá obodo ahụ
  rationale: “Ọnụ ụzọ ámá” bụ okwu Igbo doro anya maka nnukwu ụzọ e si abanye n’obodo e wusiri ike.
- source_word: καὶ ἰδοὺ
  choice: lee
  rationale: “Lee” na-adọta uche onye na-agụ ya gaa n’ihe mberede pụtara n’akụkọ ahụ, dị ka ἰδού si eme.
- source_word: ἐξεκομίζετο
  choice: a na-ebupụ
  rationale: Ụdị ngwaa a na-egosi ihe a nọ na-eme n’oge ahụ; “a na-ebupụ” dabara n’ọnọdụ ndị na-ebu ozu apụ n’obodo.
- source_word: τεθνηκώς
  choice: otu nwoke nwụrụ anwụ
  rationale: Nke a na-egosi onye nọ n’ọnọdụ ọnwụ; “nwoke” kwekọrọ n’okwu na-esochi ya nke kọwara ya dị ka nwa nwoke.
- source_word: μονογενὴς υἱός
  choice: naanị otu nwa nwoke nne ya nwere
  rationale: Nke a na-egosi na ọ bụ nwa nwoke pụrụ iche n’ihi na nne ya enweghị nwa ọzọ dị ka ya; e tinyere nkọwa ala peeji iji chekwaa ohere na okwu ahụ nwere ike ịpụta na ọ bụ naanị otu nwa ọ mụrụ.
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: nne ya bụkwa nwanyị di ya nwụrụ
  rationale: Ikwughachi “nne ya” na-eme ka onye a na-ekwu maka ya doo anya n’Igbo ma na-echekwa mwute dị n’akụkọ ahụ.
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: Ọtụtụ ndị obodo ahụ
  rationale: ἱκανός ebe a na-egosi ọnụ ọgụgụ bara ụba; “ọtụtụ ndị” bụ okwu Igbo nkịtị ma ghara ikwubiga oke.
- source_word: ἦν σὺν αὐτῇ
  choice: sokwa ya
  rationale: Nke a na-egosi na ìgwè mmadụ ahụ so nwanyị ahụ na-aga n’usoro olili ozu.
theological_decisions:
- issue: Ihe μονογενής pụtara n’ebe a na-abụghị okwu banyere Kraịst
  choice: naanị otu nwa nwoke nne ya nwere
  alternative: otu nwa ọ mụrụ naanị ya, bụ́ nwoke
  rationale: N’ebe a, μονογενής na-akọwa mmekọrịta nwa ahụ na nne ya, ọ bụghị aha nkà mmụta okpukpe. Isi nsụgharị na-asụ Igbo n’ụzọ dị mfe, ebe nkọwa ala peeji na-echekwa echiche siri ike karị na ọ bụ naanị otu nwa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E kewara ahịrịokwu Grik ogologo ahụ ka akụkọ ahụ doo anya n’Igbo, n’emebighị usoro ihe mere ma ọ bụ mwute dị n’ọnọdụ ahụ. E debere akara [a] n’ebe μονογενὴς υἱός dị, n’ihi na ọ bụ okwu nkọwa ala peeji ahụ metụtara.
