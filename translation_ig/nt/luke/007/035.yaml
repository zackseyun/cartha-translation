  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: ig
  text: Ma amamihe ka ụmụ ya niile gosiri na o ziri ezi.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụmụ ya niile akwadoro na amamihe ziri ezi,” ma ọ bụ “ụmụ ya niile gosiri na amamihe bụ eziokwu.”
    reason: lexical_alternative
  - marker: b
    text: “Ụmụ” bụ ihe atụ maka ndị nzaghachi ha ma ọ bụ ụzọ ndụ ha na-egosi na amamihe ziri ezi.
    reason: lexical_alternative
  - marker: c
    text: Na Matiu 11:19, e dere, “ọrụ ya egosila na amamihe ziri ezi.”
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: N'ebe a, καί na-egosi ntakịrị ọdịiche megide ọjụjụ na enweghị nkwekọ nke ọgbọ ahụ; “Ma” na-egosipụta nke a n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ἐδικαιώθη
  choice: egosila na ... ziri ezi
  rationale: Ụdị a na-enye echiche nke ime ka o doo anya ma ọ bụ ịgba akaebe na amamihe ziri ezi, ọ bụghị echiche pụrụ iche nke ịgụ mmadụ n'onye ezi omume. Ọ na-ekwukwa ihe passive ahụ n'ụzọ Igbo doro anya.
- source_word: σοφία
  choice: amamihe
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa σοφία; a na-edobe ya dị ka ihe e mere ka ọ bụrụ onye n'ilu a.
- source_word: ἀπὸ πάντων
  choice: ụmụ ya niile
  rationale: 'A na-egosipụta onye ma ọ bụ ihe si n''aka ya pụta ihe akaebe ahụ site n''usoro okwu Igbo: ụmụ ya niile bụ ndị na-egosi na ọ ziri ezi.'
- source_word: τέκνων
  choice: ụmụ
  rationale: A na-edobe ihe oyiyi kpọmkwem nke τέκνα, kama ịkọwa ya n'ahịrị bụ isi dị ka ọrụ, mkpụrụ, ma ọ bụ ndị na-eso ụzọ.
- source_word: αὐτῆς
  choice: ya
  rationale: “Ya” bụ nnọchiaha Igbo ebumpụta ụwa nke na-ezo aka n'amamihe e mere ka ọ bụrụ onye, na-enweghị ịmanye okike ụtọasụsụ Grik n'Igbo.
theological_decisions:
- issue: Ihe “ụmụ amamihe” pụtara
  choice: E debere ya n'ụzọ nkịtị dịka “ụmụ ya,” ka ọ bụrụ ihe atụ maka ndị ndụ ha ma ọ bụ nzaghachi ha na-agba amamihe akaebe.
  alternative: Ịsụgharị ya dịka “ọrụ ya,” “mkpụrụ ya,” ma ọ bụ “ndị na-eso ya.”
  rationale: Ihe odide Luk bụ τέκνων, “ụmụ.” Idebe ihe atụ a na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe nke okwu ahụ, kama idozi ya n'ime nkọwa otu ụzọ.
- issue: Uche nke ἐδικαιώθη
  choice: “egosila na ... ziri ezi,” nke pụtara na a kwadoro amamihe n'ihu ọha dịka ihe ziri ezi.
  alternative: “a gụrụ amamihe n'onye ezi omume” ma ọ bụ “a mere amamihe onye ezi omume.”
  rationale: N'ọnọdụ a, okwu ahụ abụghị ozizi banyere ịgụ onye mmehie n'onye ezi omume, kama ọ bụ igosi ma ọ bụ ikweta na amamihe ziri ezi.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro “egosila na ... ziri ezi” iji mee ka echiche passive nke nkwado pụta ìhè n'ụzọ Igbo ebumpụta ụwa; e debere “ụmụ” iji chekwaa ihe atụ nke Grik.
