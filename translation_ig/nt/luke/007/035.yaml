revisions:
- from: Ma ụmụ ya niile egosila na amamihe ziri ezi.[a][b][c]
  to: Ma amamihe ka ụmụ ya niile gosiri na o ziri ezi.[a][b][c]
  rationale: The revision keeps τέκνα literally as “ụmụ,” retains πάντων as “niile,” and preserves the personification of wisdom. Fronting “amamihe” with the focus construction “... ka ... gosiri” more closely reflects the Greek passive clause’s focus on wisdom being shown right, while remaining natural in modern Standard Igbo. Footnote a is clarified so that its alternatives preserve the agents specified by ἀπὸ πάντων τῶν τέκνων αὐτῆς.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:58Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the key lexemes “amamihe,” “ụmụ,” “niile,” and the metaphorical possessive “ya.” However, its active construction makes the children the overt subject, whereas Greek foregrounds wisdom as the subject of a passive verb. A revision can retain natural Igbo while better reflecting that focus.
  naturalness: “Egosila na amamihe ziri ezi” is understandable Standard Igbo. Recasting the clause with “amamihe” first is smoother in this context and keeps the saying’s personified image in focus.
  terminology: “Amamihe” and “ụmụ ya” are appropriate. “Ziri ezi” suitably conveys the contextual sense of δικαιόω as being shown right, without importing a forensic sense.
  issues:
  - severity: medium
    issue: The main clause reverses the source’s information structure and obscures the passive focus on wisdom.
    rationale: ἐδικαιώθη ἡ σοφία places “wisdom” as the grammatical subject and presents it as vindicated. “Ụmụ ya niile egosila ...” is semantically close, but foregrounds the children instead. “Amamihe ka ụmụ ya niile gosiri na o ziri ezi” more closely represents the source emphasis in idiomatic Igbo.
  - severity: low
    issue: Footnote a’s proposed alternatives are grammatically incomplete or unclear without an expressed agent.
    rationale: “Akwadola na amamihe ziri ezi” and “egosila na amamihe bụ eziokwu” can leave the relevant subject unexpressed. The alternatives should explicitly retain “ụmụ ya niile” or use a clearly impersonal construction.
  revised_text: Ma amamihe ka ụmụ ya niile gosiri na o ziri ezi.[a][b][c]
