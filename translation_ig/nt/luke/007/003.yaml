id: LUK.7.3
reference: Luke 7:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: ig
  text: Mgbe ọ nụrụ banyere Jizọs, o zigara ndị okenye ndị Juu ka ha gakwuru ya, na-arịọ ya ka ọ bịa zọpụta ohu ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-ejere ya ozi.” Okwu Grik bụ doulos, nke nwere ike ịpụta onye na-ejere ozi ma ọ bụ ohu, dabere n’ọnọdụ; ebe a, “ohu” na-egosipụta ọnọdụ ịbụ ohu nke onye ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Mgbe ọ nụrụ
  rationale: Nkebi a na-egosi ihe mere tupu ngwaa bụ isi; ‘Mgbe ọ nụrụ’ bụ Igbo doro anya ma na-edobe echiche oge dị na participle aorist ahụ.
- source_word: δὲ
  choice: —
  rationale: δὲ bụ njikọ dị nro n’ebe a; usoro ahịrịokwu Igbo na-egosi njikọ ahụ nke ọma n’enweghị okwu ọzọ.
- source_word: περὶ τοῦ Ἰησοῦ
  choice: banyere Jizọs
  rationale: περί na genitive pụtara ‘banyere’; ‘Jizọs’ bụ nsụgharị aha ahụ a na-ejikarị eme ihe n’Igbo Izugbe.
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: o zigara ... ka ha gakwuru ya
  rationale: Nke a na-egosi na o zipụrụ ndị a kpọrọ aha ka ha gakwuru Jizọs, n’ụzọ dị mma ma bụrụkwa nke ndị Igbo na-asụkarị.
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: ụfọdụ ndị okenye ndị Juu
  rationale: πρεσβύτεροι ebe a bụ ndị ndu a na-akwanyere ùgwù n’obodo ndị Juu, ọ bụghị naanị ndị merela agadi. ‘Ụfọdụ’ dabara n’ihi na aha Grik ahụ enweghị article ma ọ pụtaghị ndị okenye niile.
- source_word: ἐρωτῶν αὐτὸν
  choice: na-arịọ ya
  rationale: Participle ahụ na-egosi arịrịọ onyeisi agha ahụ mere site n’iziga ndị okenye; ‘na-arịọ ya’ na-edobe arịrịọ ahụ n’ụzọ dị mfe.
- source_word: ὅπως ἐλθὼν
  choice: ka ọ bịa
  rationale: ὅπως na subjunctive na-egosi ihe arịrịọ ahụ chọrọ, ebe ἐλθών na-enye echiche nke ịbịa; ‘ka ọ bịa’ bụ ọdịdị Igbo nkịtị.
- source_word: διασώσῃ
  choice: zọpụta
  rationale: διασῴζω nwere ike ịpụta ịzọpụta, ịnapụta, ichebe, ma ọ bụ ime ka onye ọrịa dị mma. ‘Zọpụta’ na-edobe obosara okwu Grik ahụ n’agbanyeghị na ọnọdụ a metụtara ọrịa.
- source_word: τὸν δοῦλον αὐτοῦ
  choice: ohu ya
  rationale: δοῦλος ebe a na-ezo aka n’onye nọ n’okpuru ikike onyeisi agha ahụ dị ka ohu. ‘Ohu’ na-edobe ọnọdụ agbụ ahụ nke ọma karịa naanị onye na-eje ozi; ụzọ ọzọ dị na ndetu.
theological_decisions:
- issue: Otu e si asụgharị δοῦλος n’akụkọ gbasara onye nọ n’ụlọ onyeisi agha
  choice: ohu
  alternative: onye na-ejere ya ozi
  rationale: Ọnọdụ mmekọrịta mmadụ na ibe ya dị n’oge ahụ gụnyere ịbụ onye nwe ohu, ya mere ‘ohu’ na-egosipụta ọnọdụ agbụ nke δοῦλος. Ma ebe okwu ahụ nwekwara ike ilekwasị anya n’ozi onye ahụ na-arụ, e debere ‘onye na-ejere ya ozi’ na ndetu kama iwepụ nghọta ọzọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu mee ihe. Ahịrịokwu ahụ na-edobe usoro isi mmalite ahụ, ma na-eji ‘ka ha gakwuru ya’ mee ka iziga ndị okenye ahụ doo anya. E tinyere akara ndetu [a] ozugbo n’akụkụ ‘ohu ya,’ bụ okwu ndetu ahụ na-akọwa.
