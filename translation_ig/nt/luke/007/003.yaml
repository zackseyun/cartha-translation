revisions:
- from: Mgbe ọ nụrụ banyere Jizọs, o zigara ụfọdụ ndị okenye ndị Juu ka ha gakwuru ya, na-arịọ ya ka ọ bịa zọpụta ohu ya.[a]
  to: Mgbe ọ nụrụ banyere Jizọs, o zigara ndị okenye ndị Juu ka ha gakwuru ya, na-arịọ ya ka ọ bịa zọpụta ohu ya.[a]
  rationale: Removed the unsupported ‘ụfọdụ’ to preserve the source’s unqualified plural reference. Revised the footnote wording for natural Standard Igbo and a clearer account of the bonded status denoted by ‘ohu,’ while retaining the alternative contextual rendering.
  reviewer_model: gpt-5.6-terra
