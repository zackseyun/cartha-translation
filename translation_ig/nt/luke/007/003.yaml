review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal participle, the sending of elders to Jesus, the request that he come, and διασώσῃ with the suitably broad ‘zọpụta.’ However, ‘ụfọdụ’ (‘some’) adds an indefiniteness not expressed by the Greek plural and should be removed.
  naturalness: The verse is clear, idiomatic Standard Igbo. ‘O zigara ndị okenye ndị Juu ka ha gakwuru ya’ is natural and makes the direction of the sending clear. The footnote’s ‘ọnọdụ agbụ’ is not natural or precise Igbo for the social status in view.
  terminology: ‘Ohu’ appropriately represents δοῦλος in this household setting, while the footnote preserves the viable contextual alternative ‘onye na-ejere ya ozi.’ ‘Ndị okenye ndị Juu’ suitably denotes recognized Jewish elders rather than merely elderly people.
  issues:
  - severity: medium
    issue: ‘Ụfọdụ’ has been added before ‘ndị okenye ndị Juu.’
    rationale: πρεσβυτέρους is an anarthrous plural, but Greek anarthrous plurals do not by themselves require ‘some.’ The addition is unnecessary and slightly narrows/specifies the reference beyond the source.
  - severity: low
    issue: The footnote describes δοῦλος using ‘ọnọdụ agbụ.’
    rationale: This expression is awkward and does not clearly express slavery/bonded status in modern Standard Igbo. ‘Ọnọdụ ịbụ ohu’ is direct, natural, and accurate.
  revised_text: Mgbe ọ nụrụ banyere Jizọs, o zigara ndị okenye ndị Juu ka ha gakwuru ya, na-arịọ ya ka ọ bịa zọpụta ohu ya.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-ejere ya ozi.” Okwu Grik bụ doulos, nke nwere ike ịpụta onye na-ejere ozi ma ọ bụ ohu, dabere n’ọnọdụ; ebe a, “ohu” na-egosipụta ọnọdụ ịbụ ohu nke onye ahụ.
    reason: alternative_reading
  revision_rationale: Removed the unsupported ‘ụfọdụ’ to preserve the source’s unqualified plural reference. Revised the footnote wording for natural Standard Igbo and a clearer account of the bonded status denoted by ‘ohu,’ while retaining the alternative contextual rendering.
