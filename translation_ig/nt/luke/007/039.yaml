id: LUK.7.39
reference: Luke 7:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: ig
  text: Mgbe onye Farisii ahụ kpọrọ ya òkù hụrụ ihe a, o kwuru n’obi ya, “A sị na nwoke a bụ onye amụma, ọ gaara ama onye nwanyị a na-emetụ ya aka bụ, nakwa ụdị nwanyị ọ bụ[a], n’ihi na ọ bụ onye mmehie[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nwanyị a bụ na ụdị onye ọ bụ.” Okwu Grik ahụ na-emesi ma onye nwanyị ahụ bụ ma ụdị agwa ma ọ bụ aha e ji mara ya ike.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na ọ bụ onye mmehie.” Enwere ike ịghọta nkebiokwu a dịka ihe nwoke ahụ gaara ama, ma ọ bụ dịka ihe kpatara e ji kwuo ụdị nwanyị ọ bụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: Mgbe ... hụrụ ihe a
  rationale: Aorist participle ahụ na-egosi ọnọdụ oge nke okwu bụ isi; ‘mgbe ... hụrụ ihe a’ bụ Igbo sitere n’okike. ‘Ihe a’ na-ezo aka n’ihe nwanyị ahụ mere n’amaokwu ndị bu ụzọ.
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: onye Farisii ahụ kpọrọ ya òkù
  rationale: N’ọnọdụ oriri a, καλέω pụtara ịkpọ mmadụ òkù, ọ bụghị naanị ịkpọ ya aha ma ọ bụ ịkpọku ya.
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: o kwuru n’obi ya
  rationale: Nke a na-egosi okwu mmadụ kwuru n’ime onwe ya; Igbo a dị nkenke ma bụrụ nke sitere n’okike.
- source_word: Οὗτος
  choice: nwoke a
  rationale: Demonstrative ahụ na-ezo aka na Jizọs ma nwee ụda nke iwepụ onwe ya n’ebe ọ nọ; ‘nwoke a’ na-edowe ụda ahụ.
- source_word: εἰ ἦν προφήτης ... ἐγίνωσκεν ἂν
  choice: A sị na ... bụ onye amụma, ọ gaara ama
  rationale: Ụdị ‘A sị na ... ọ gaara ...’ na-egosipụta ọnọdụ onye Farisii ahụ weere na ọ bụghị eziokwu.
- source_word: τίς καὶ ποταπὴ
  choice: onye ... bụ na ụdị nwanyị ọ bụ
  rationale: 'A na-edowe ajụjụ abụọ ahụ: onye nwanyị ahụ bụ na ụdị agwa ma ọ bụ aha o nwere n’etiti mmadụ.'
- source_word: ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ
  choice: nwanyị a nọ na-emetụ ya aka
  rationale: ‘Nọ na-emetụ’ na-egosi na mmetụ ahụ ka na-aga n’ihu n’oge ahụ.
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: n’ihi na ọ bụ onye mmehie
  rationale: A họọrọ nghọta nke ὅτι dịka ihe kpatara ikpe onye Farisii ahụ, ebe nkọwa ala peeji na-edowe nghọta ọzọ nwere ike ịdị.
theological_decisions:
- issue: Ike nke ọnọdụ onye Farisii ahụ kwuru banyere ịbụ onye amụma
  choice: A sị na nwoke a bụ onye amụma, ọ gaara ama ...
  alternative: Ọ bụrụ na nwoke a bụ onye amụma, ọ ga-ama ...
  rationale: εἰ ἦν ... ἐγίνωσκεν ἂν na-egosi na onye Farisii ahụ chere na ọnọdụ ahụ abụghị eziokwu. Nsụgharị a na-edowe obi abụọ ya n’akụkọ ahụ n’enweghị ikwenye na ikpe ya.
- issue: Ọrụ ὅτι n’ahịrịokwu ikpeazụ
  choice: n’ihi na ọ bụ onye mmehie
  alternative: na ọ bụ onye mmehie
  rationale: ὅτι nwere ike igosi ihe kpatara okwu ahụ ma ọ bụ ọdịnaya nke ihe ọ gaara ama. Isi ederede họọrọ nghọta nke ihe kpatara ya, ma nkọwa [b] na-edowe ụzọ nke ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma doo ndị nkịtị anya. ‘Onye Farisii,’ ‘onye amụma,’ na ‘onye mmehie’ bụ okwu Akwụkwọ Nsọ a na-aghọta nke ọma. E zere okwu ụka pụrụ iche, ma e debeghị mgbagwoju anya nke ὅτι n’enweghị nkọwa.
