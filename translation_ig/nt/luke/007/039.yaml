- from: Mgbe onye Farisii ahụ kpọrọ ya òkù hụrụ ihe a, o kwuru n’obi ya, “A sị na nwoke a bụ onye amụma, ọ gaara ama onye nwanyị a nọ na-emetụ ya aka bụ na ụdị nwanyị ọ bụ[a], n’ihi na ọ bụ onye mmehie[b].”
  to: Mgbe onye Farisii ahụ kpọrọ ya òkù hụrụ ihe a, o kwuru n’obi ya, “A sị na nwoke a bụ onye amụma, ọ gaara ama onye nwanyị a na-emetụ ya aka bụ, nakwa ụdị nwanyị ọ bụ[a], n’ihi na ọ bụ onye mmehie[b].”
