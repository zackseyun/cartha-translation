id: LUK.7.8
reference: Luke 7:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ig
  text: N’ihi na mụ onwe m bụkwa mmadụ e debere n’okpuru ikike, enwekwara m ndị agha nọ n’okpuru m. Ana m asị onye a, ‘Gaa,’ ọ na-aga; asịkwa m onye ọzọ, ‘Bịa,’ ọ na-abịa; asịkwa m ohu m[a], ‘Mee nke a,’ ọ na-emekwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ohu m” dịka “onye na-ejere m ozi.” Okwu Grik bụ doulos; ọ na-egosikarị ohu, ya bụ, onye nọ n’ọnọdụ ịdabere n’aka onye nwe ya, ma n’ọnọdụ ụfọdụ a pụrụ ịsụgharị ya n’ụzọ sara mbara dịka “onye na-ejere ozi.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ ἐγὼ
  choice: N’ihi na mụ onwe m bụkwa
  rationale: Nkebi a na-enye ihe kpatara okwu onyeisi ndị agha ahụ. “Mụ onwe m” na “bụkwa” na-echekwa nkwusiri ike dị na ἐγώ na καί.
- source_word: ἄνθρωπός εἰμι
  choice: bụkwa onye
  rationale: N’Igbo, “bụ onye” bụ ụzọ eke e si ekwu banyere mmadụ n’ọnọdụ a; ọ naghị etinye nkọwa ọzọ na-adịghị na Grik.
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: onye e debere n’okpuru ikike
  rationale: Nke a na-echekwa ụdị nnabata nke τασσόμενος na usoro ọchịchị ma ọ bụ iwu agha nke okwu ahụ na-egosi.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: enwekwara m ndị agha nọ n’okpuru m
  rationale: Ọ na-echekwa echiche nke ndị agha nọ n’okpuru ọchịchị ya n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: λέγω τούτῳ
  choice: Ana m asị onye a
  rationale: “Onye a” na-echekwa ike ngosi nke τούτῳ, kama ime ya naanị “otu onye.”
- source_word: Πορεύθητι ... πορεύεται
  choice: ‘Gaa,’ ọ gaa
  rationale: Nsụgharị a dị mkpirikpi ma na-echekwa usoro iwu na nrubeisi dị na Grik.
- source_word: ἄλλῳ· Ἔρχου ... ἔρχεται
  choice: onye ọzọ, ‘Bịa,’ ọ bịa
  rationale: Ọ na-echekwa myirịta nke ahịrịokwu abụọ ahụ na-enweghị ịgbakwunye “ebe a,” nke na-adịghị mkpa.
- source_word: τῷ δούλῳ μου
  choice: ohu m
  rationale: δοῦλος na-egosi onye nọ n’ọnọdụ ịbụ ihe onye ọzọ nwe ma ọ bụ onye e kere agbụ. N’ebe a, ọnọdụ ịnọ n’okpuru ikike bụ akụkụ dị mkpa nke ihe atụ ahụ, ya mere “ohu” ka “onye na-eje ozi” siri ike n’ịchekwa eziokwu mmekọrịta mmadụ nke okwu Grik ahụ.
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: ‘Mee nke a,’ o mee ya
  rationale: Nke a na-echekwa iwu ahụ na ihe na-esochi ya ozugbo, ma “ya” na-eme ka okwu ahụ daa nke ọma n’Igbo.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ihe atụ onyeisi ndị agha
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Amaokwu a anaghị akwado ịgba ohu dị ka ozizi; kama, ọ na-eji usoro ikike nke oge ahụ eme ihe atụ. “Ohu” na-echekwa ọnọdụ agbụ ma ọ bụ ịbụ ihe onye nwe ya nwere nke δοῦλος nwere ike ịpụta, ebe “onye na-eje ozi” bụ nhọrọ sara mbara karị. E debere nhọrọ ahụ na nkọwa ala peeji ka e wee ghara ikpuchi mgbagwoju okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwara usoro nkwughachi nke iwu na nrubeisi dị na isi mmalite ahụ. E tinyere akara nkọwa [a] ozugbo n’akụkụ “ohu m” nke ọ na-akọwa.
