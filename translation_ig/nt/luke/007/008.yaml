revisions:
- from: N’ihi na mụ onwe m bụkwa onye e debere n’okpuru ikike, enwekwara m ndị agha nọ n’okpuru m. Ana m asị onye a, ‘Gaa,’ ọ gaa; asịkwa m onye ọzọ, ‘Bịa,’ ọ bịa; asịkwa m ohu m, ‘Mee nke a,’ o mee ya.[a]
  to: N’ihi na mụ onwe m bụkwa mmadụ e debere n’okpuru ikike, enwekwara m ndị agha nọ n’okpuru m. Ana m asị onye a, ‘Gaa,’ ọ na-aga; asịkwa m onye ọzọ, ‘Bịa,’ ọ na-abịa; asịkwa m ohu m[a], ‘Mee nke a,’ ọ na-emekwa ya.
  rationale: The revision preserves the source’s explanatory force, emphatic “I too,” passive placement under authority, and repeated command-response pattern. It improves direct lexical representation of ἄνθρωπος, uses natural habitual forms for the Greek present responses, and relocates and refines the δοῦλος footnote without resolving its contextual semantic range beyond the evidence.
