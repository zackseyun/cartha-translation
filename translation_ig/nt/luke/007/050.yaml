base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: ig
  text: O wee sị nwanyị ahụ, “Okwukwe gị[a] azọpụtala gị[b]; laa n’udo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi gị”; o yikarịghị ebe a, “ikwesị ntụkwasị obi gị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “emela ka ahụ dị gị mma.” Okwu Grik ahụ pụrụ ịpụta “ịzọpụta,” “ịnapụta,” ma ọ bụ “ime ka ahụ dị mma”; ma ebe a, ihe ndị gbara ya gburugburu na-elekwasị anya ná mgbaghara na nzọpụta.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: ọ sị
  rationale: Aorist λέγω na-egosi okwu o kwuru ozugbo; ‘ọ sị’ bụ Igbo doro anya ma kwekọọ na isi mmalite.
- source_word: δὲ
  choice: O wee
  rationale: δέ na-aga n’ihu n’akụkọ ahụ; ‘O wee’ na-egosipụta njikọ akụkọ n’Igbo n’enweghị itinye esemokwu na-adịghị na ya.
- source_word: πρὸς τὴν γυναῖκα
  choice: nwanyị ahụ
  rationale: γυνή ebe a bụ nwanyị nọ n’ihe a na-akọ, ọ bụghị nwunye; ‘nwanyị ahụ’ na-eme ka onye a na-ekwu maka ya doo anya.
- source_word: Ἡ πίστις σου
  choice: Okwukwe gị
  rationale: πίστις ebe a na-ezo aka ná ntụkwasị obi nwanyị ahụ nwere n’ebe Jizọs nọ; ‘okwukwe’ bụ okwu Igbo a na-ejikarị eme ihe ma na-edobe obosara echiche ahụ.
- source_word: σέσωκέν σε
  choice: azọpụtala gị
  rationale: Perfect σῴζω na-egosi ihe emeworo nke nsonaazụ ya ka dị; ‘azọpụtala gị’ dabara n’ọnọdụ mgbaghara na nzọpụta nke akụkụ a.
- source_word: πορεύου
  choice: laa
  rationale: Imperative πορεύου bụ iwu ka ọ pụọ gawa; ‘laa’ bụ ụzọ Igbo ebumpụta ụwa si kwuo ya n’ọnọdụ a.
- source_word: εἰς εἰρήνην
  choice: n’udo
  rationale: Ọ bụ ezie na εἰς pụtara ‘banye n’ime’ n’ụzọ nkịtị, πορεύου εἰς εἰρήνην bụ akpaala okwu nke ‘laa n’udo’ na-anọchi anya ya nke ọma n’Igbo.
theological_decisions:
- issue: Ihe σῴζω pụtara n’ihe gbasara mgbaghara na nzọpụta
  choice: azọpụtala gị
  alternative: emela ka ahụ dị gị mma
  rationale: Ihe ndị gbara amaokwu ahụ gburugburu lekwasịrị anya ná mgbaghara mmehie na nzaghachi okwukwe nwanyị ahụ, ya mere ‘azọpụtala gị’ na-edobe ibu okwu ahụ. Agbanyeghị, a na-edobe ihe ọzọ σῴζω pụrụ ịpụta ná nkọwa ala peeji.
- issue: Ihe πίστις pụtara ebe a
  choice: okwukwe gị
  alternative: ntụkwasị obi gị; ikwesị ntụkwasị obi gị
  rationale: N’ọnọdụ a, πίστις yikarịrị ka ọ bụ ntụkwasị obi o nwere n’ebe Jizọs nọ. ‘Okwukwe’ na-edobe okwu nkà mmụta okpukpe a na-ahụkarị, ebe nkọwa ala peeji na-egosi ụzọ ndị ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ejiri ‘O wee’ mee ka akụkọ na-aga n’ihu nke ọma, ma jiri ‘laa n’udo’ mee ka akpaala okwu Grik bụrụ Igbo ebumpụta ụwa. E tinyere naanị akara ala peeji [a] nke kwekọrọ na σῴζω; ihe ọzọ πίστις pụrụ ịpụta ka edekọtara na mkpebi okwu n’ihi na data Bekee nyere akara ala peeji na-adabaghị n’usoro.
