  text: καὶ ἤρξαντο οἱ συνανακείμενοι λέγειν ἐν ἑαυτοῖς· Τίς οὗτός ἐστιν ὃς καὶ ἁμαρτίας ἀφίησιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: ig
  text: Ndị ha na ya nọ na-eri nri wee malite ikwu n’etiti onwe ha sị, “Ònye bụ onye a, onye ọbụna na-agbaghara mmehie?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο
  choice: wee malite
  rationale: Ọ na-egosi mmalite nke ihe ha mere; ‘wee malite’ bụ ụzọ Igbo dị mfe ma dị ndụ isi chekwaa ike a.
- source_word: οἱ συνανακείμενοι
  choice: Ndị ha na ya nọ na-eri nri
  rationale: Nke a na-egosi ndị ha na Jizọs nọ n'otu nri. Kama ịsụgharị kpọmkwem omenala oge ahụ nke ịdina n'akụkụ tebụl, okwu a na-enye onye Igbo nke oge a ọnọdụ nri ahụ n'ụzọ doro anya.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: ịgwa ibe ha
  rationale: N'ihi na ndị e kwuru okwu ha karịrị otu, nke a dabara n'echiche nke mkparịta ụka n'etiti ndị ọbịa, ma ihe odide Grik nwekwara ike ịpụta iche okwu ahụ n'ime onwe ha; e debere nke ahụ n'ala ala peeji.
- source_word: Τίς οὗτός ἐστιν
  choice: Ònye bụ onye a
  rationale: Ọ na-echekwa ajụjụ ahụ n'ọnọdụ ya dị mkpụmkpụ, n'etinyeghị nkọwa ọzọ dịka ‘nwoke.’
- source_word: καὶ
  choice: na-...kwa
  rationale: 'Mgbakwụnye ‘-kwa’ na-egosipụta ihe ijuanya dị na καί ebe a: ọ bụghị naanị ihe ọzọ, kama na onye a ‘ọbụna’ na-agbaghara mmehie.'
- source_word: ἁμαρτίας ἀφίησιν
  choice: na-agbaghara mmehie
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu maka ịgbaghara mmehie, ya mere ọ na-echekwa mkpa okpukpe nke okwu ahụ.
theological_decisions:
- issue: Ihe ajụjụ ndị ọbịa na-egosi banyere ikike Jizọs ịgbaghara mmehie
  choice: 'E debere ya dịka ajụjụ jupụtara n''ịtụnanya: “Ònye bụ onye a, onye na-agbagharakwa mmehie?”'
  alternative: Ịgbakwunye nkọwa na-ekwu kpọmkwem onye Jizọs bụ ma ọ bụ ebe ikike ya si bịa.
  rationale: Amaokwu ahụ na-akpalite ajụjụ gbasara onye Jizọs bụ, ma ọ naghị aza ya ozugbo. Ya mere, nsụgharị ahụ echekwala esemokwu na ihe omimi nke ederede ahụ n'etinyeghị nkọwa ozizi.
translation_notes:
  register: Standard Igbo dị ugbu a, nke e dere n'ụzọ dị ùgwù ma dị mfe nghọta. A họọrọ ‘nọ na-eri nri’ kama nkọwa kpọmkwem banyere ịdina n'akụkụ tebụl, ka ọnọdụ ahụ doo onye na-agụ nke oge a anya n'ebughị nkọwa omenala dị arọ n'ime amaokwu.
