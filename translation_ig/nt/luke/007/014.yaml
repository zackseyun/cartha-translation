revisions:
- from: Ọ bịaruru nso metụ ihe ndina e ji ebu ozu ahụ aka[a]. Ndị bu ya guzoro otu ebe. O wee sị, “Nwa okorobịa, ana m asị gị, bilie!”
  to: Ọ bịaruru nso, metụ ihe ndina e ji ebu ozu ahụ aka[a]; ndị na-ebu ya wee guzoro otu ebe. Ọ sịrị, “Nwa okorobịa, ana m asị gị, bilie!”
  rationale: The revision makes the action sequence and the identity of the bearers more explicit in natural Standard Igbo, without adding meaning. It retains the source’s historically specific but lexically flexible reference to a funeral bier and preserves the direct, solemn imperative “bilie.”
