review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence and all principal Greek elements: Jesus approaches, touches the σορός, its bearers stop, and directly commands the young man to rise. The rendering of σορός as an open funeral carrying-bed rather than necessarily a closed coffin is appropriately preserved in the note.'
  naturalness: The opening needs a clearer Igbo narrative connection after the approach, and “Ndị bu ya” is less explicit and slightly less natural than “Ndị na-ebu ya” for the bearers. The revised wording keeps a dignified, modern Standard Igbo register.
  terminology: “Ihe ndina e ji ebu ozu” is a defensible functional rendering of σορός. “Nwa okorobịa,” “ana m asị gị,” and “bilie” are accurate and suitably solemn. The footnote is revised to avoid the potentially misleading description “osisi” and to state the historical object more clearly.
  issues:
  - severity: low
    issue: The sequence in the opening clause is somewhat compressed.
    rationale: “Ọ bịaruru nso metụ ...” can be understood, but punctuation and an explicit narrative linker make the participial sequence clearer and more idiomatic.
  - severity: low
    issue: “Ndị bu ya” leaves the role of the people carrying the bier less explicit.
    rationale: The Greek participle βαστάζοντες identifies them as the bearers; “Ndị na-ebu ya” naturally retains that identification.
  - severity: low
    issue: The footnote’s reference to “osisi” is overly narrow.
    rationale: σορός denotes the funeral bier/carrying frame, not specifically a wooden object; the note should preserve that lexical breadth.
  revised_text: Ọ bịaruru nso, metụ ihe ndina e ji ebu ozu ahụ aka[a]; ndị na-ebu ya wee guzoro otu ebe. Ọ sịrị, “Nwa okorobịa, ana m asị gị, bilie!”
