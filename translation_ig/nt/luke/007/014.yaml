id: LUK.7.14
reference: Luke 7:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: ig
  text: Ọ bịaruru nso, metụ ihe ndina e ji ebu ozu ahụ aka[a]; ndị na-ebu ya wee guzoro otu ebe. Ọ sịrị, “Nwa okorobịa, ana m asị gị, bilie!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “igbe ozu” ma ọ bụ “ihe e ji ebu ozu aga ili.” Okwu Grik a na-ezo aka n’ihe ndina ma ọ bụ ihe e ji ebu ozu n’usoro olili, ọ bụghịkarị igbe ozu mechiri emechi.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: Ọ bịaruru nso
  rationale: Nke a na-egosi na Jizọs bịarutere nso tupu o metụ ihe e ji ebu ozu aka, ma na-edobe usoro omume dị na participle aorist ahụ n’Igbo ebumpụta ụwa.
- source_word: ἥψατο
  choice: metụ ... aka
  rationale: Nkebiokwu Igbo a pụtara imetụ ihe aka, na-enweghị ịgbakwunye echiche nke ijidesi ya ike.
- source_word: σοροῦ
  choice: ihe ndina e ji ebu ozu ahụ
  rationale: σορός n’ọnọdụ a bụ ihe ndina ma ọ bụ osisi a na-ebukwasị ozu n’usoro olili, ọ bụghị n’ezie igbe ozu mechiri emechi.
- source_word: οἱ δὲ βαστάζοντες
  choice: Ndị bu ya
  rationale: Nke a bụ nsụgharị Igbo doro anya nke ‘ndị na-ebu ya’; nnọchiaha ‘ya’ na-ezo aka n’ihe e ji ebu ozu.
- source_word: ἔστησαν
  choice: guzoro otu ebe
  rationale: Ọ na-egosi ma na ha kwụsịrị ije ma na ha nọgidere n’ebe ahụ.
- source_word: Νεανίσκε
  choice: Nwa okorobịa
  rationale: Ọ bụ okwu a na-akpọ nwoke na-eto eto ihu, nke dabara n’asụsụ Igbo ugbu a.
- source_word: σοὶ λέγω
  choice: ana m asị gị
  rationale: Ọ na-edobe nnọchiaha e mesiri ike na okwu ahụ Jizọs gwara ya kpọmkwem.
- source_word: ἐγέρθητι
  choice: bilie
  rationale: ‘Bilie’ bụ iwu Igbo dị ebumpụta ụwa nke nwere ike ịpụta isi n’ọnọdụ dina ebili, ma n’akụkọ a ọ na-ejigide ike iwu e nyere onye nwụrụ anwụ n’ebughị ụzọ kọwaa nkà mmụta okpukpe ya.
theological_decisions:
- issue: Ụda na nghọta nke iwu Jizọs nyere onye nwụrụ anwụ
  choice: bilie
  alternative: ka e mee ka i bilie
  rationale: Ụdị Grik ahụ nwere ike ịdị n’ụdị passive, ma n’iwu a ọ na-arụ ọrụ dị ka iwu kpọmkwem ka nwa okorobịa ahụ bilie. ‘Bilie’ bụ nke ebumpụta ụwa, dị ùgwù, ma hapụkwara akụkọ ahụ ka o gosipụta ikike ọrụ ebube ahụ n’enweghị nkọwa agbakwunyere.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji okwu ndị ndị nkịtị ga-aghọta mee ihe, ebe nkọwa ala olili oge ahụ dị mkpa ka e debere ya n’ala ala peeji.
