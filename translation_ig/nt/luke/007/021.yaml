source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: ig
  text: N'oge ahụ[a], ọ gwọrọ ọtụtụ mmadụ n'ọrịa, n'ahụhụ siri ike[b], na n'aka mmụọ ọjọọ; o jikwa amara nye ọtụtụ ndị ìsì ịhụ anya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “N'oge ahụ kpọmkwem.” Okwu Grik ahụ pụrụ imesi ike na ihe a mere ozugbo n'oge ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ihe otiti” ma ọ bụ “ọrịa otiti.” Okwu Grik ahụ pụtara ụtarị n'ụzọ nkịtị, ma n'ebe a ọ pụrụ ịzo aka n'ahụhụ ma ọ bụ ọrịa siri ike.
    reason: lexical_alternative
  - marker: c
    text: 'N''ụzọ dị nnọọ nso n''okwu Grik: “o ji amara nye ọtụtụ ndị ìsì ịhụ anya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: N'oge ahụ
  rationale: Nke a na-edobe nkọwa oge Luk nyere ma na-ada nke ọma n'Igbo. A pụrụ ịgụ okwu Grik ahụ dị ka ihe na-emesi ike na ọ bụ n'otu oge ahụ kpọmkwem.
- source_word: ἐθεράπευσεν πολλοὺς ἀπὸ νόσων
  choice: ọ gwọrọ ọtụtụ ndị n'ọrịa dị iche iche
  rationale: “Gwọrọ” na-egosipụta θεραπεύω nke ọma n'okwu gbasara ọgwụgwọ. “N'ọrịa dị iche iche” na-egosipụta na a napụtara ha n'ọrịa, ma na-eme ka ahịrịokwu ahụ bụrụ Igbo dị mfe nghọta.
- source_word: μαστίγων
  choice: ahụhụ siri ike
  rationale: Ọ bụ ezie na okwu ahụ pụrụ ịpụta ụtarị n'ụzọ nkịtị, n'ebe a ọ na-ezo aka n'ihe na-eti mmadụ ahụ dịka nnukwu ọrịa ma ọ bụ ahụhụ siri ike.
- source_word: πνευμάτων πονηρῶν
  choice: mmụọ ọjọọ
  rationale: πνευμάτων πονηρῶν pụtara kpọmkwem mmụọ ndị ọjọọ, ọ bụghị naanị ọrịa ma ọ bụ ọnọdụ uche.
- source_word: τυφλοῖς πολλοῖς
  choice: ọtụtụ ndị ìsì
  rationale: Nke a na-agụnye ndị mmadụ n'ozuzu ha, n'etinyeghị nwoke naanị ebe Grik anaghị amanye nke ahụ.
- source_word: ἐχαρίσατο βλέπειν
  choice: o mekwara ọtụtụ ndị ìsì amara ka ha hụ ụzọ
  rationale: “Meere ... amara” na-edobe echiche nke inye ihe n'amara dị na χαρίζομαι, ebe “ka ha hụ ụzọ” na-egosipụta infinitive βλέπειν n'Igbo nkịtị.
theological_decisions:
- issue: Ụdị ọrụ Jizọs mere n'ebe ndị nọ n'okpuru mmụọ ọjọọ nọ
  choice: E debere “mmụọ ọjọọ” dịka ndị mmụọ n'ezie, Jizọs napụtara ndị mmadụ n'aka ha.
  alternative: Ịkọwa mmụọ ọjọọ dịka naanị ihe atụ nke ọrịa anụ ahụ ma ọ bụ nke uche.
  rationale: Okwu Grik ahụ bụ aha doro anya maka mmụọ ọjọọ. Nsụgharị ahụ anaghị ebelata ya ka ọ bụrụ naanị ọrịa, ma ọ naghị agbakwụnye nkọwa ozizi na-adịghị n'amaokwu ahụ.
- issue: Amara dị na ἐχαρίσατο
  choice: “o mekwara ... amara ka ha hụ ụzọ”
  alternative: “o mere ka ha hụ ụzọ”
  rationale: Nhọrọ a na-echekwa echiche na ịhụ ụzọ bụ ihe e nyere ha n'amara, na-enweghị ịkọwa n'ụzọ ọzọ ihe amaokwu ahụ ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “N'aka mmụọ ọjọọ” na-ada nke ọma n'Igbo ma na-egosipụta echiche ἀπό nke ịbụ onye a napụtara n'okpuru ike ha. Akara edemede semicolon kewara omume ọgwụgwọ ahụ na inye ndị ìsì ịhụ ụzọ n'enweghị ime ka ha bụrụ akụkọ abụọ na-enweghị njikọ.
