  to: Egwu wee jide ha niile, ha wee na-enye Chineke otuto, na-asị, “Otu nnukwu onye amụma ebilitela n’etiti anyị,[a] na Chineke eletala ndị ya.”[b][c]
  rationale: E mezigharịrị nleta Chineke ka ọ bụrụ “eletala ndị ya,” nke na-adaba n’ọrụ ἐπεσκέψατο ma na-ezere mgbakwunye echiche dị na “abịalakwa.” A gbakwụnyere “na” n’ime nkwupụta ahụ iji gosipụta njikọ καὶ ὅτι n’enweghị ikewa okwu ahụ n’akara nhota abụọ. E mekwara obere mmezi n’usoro ahịrịokwu na n’ụzọ e si dee ndetu c ka Standard Igbo bụrụ nke eke ma doo anya.
