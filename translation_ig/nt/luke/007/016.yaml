id: LUK.7.16
reference: Luke 7:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: ig
  text: Egwu wee jide ha niile, ha wee na-enye Chineke otuto, na-asị, “Otu nnukwu onye amụma ebilitela n’etiti anyị,[a] na Chineke eletala ndị ya.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu a, “e bulitela n’etiti anyị,” nke na-eme ka o doo anya karị na Chineke mere ka onye amụma ahụ bilie.
    reason: lexical_alternative
  - marker: b
    text: “Eletala” bụ okwu Akwụkwọ Nsọ nke na-egosi na Chineke abịakwutewo ndị ya iji lebara ha anya ma nyere ha aka.
    reason: cultural_note
  - marker: c
    text: 'E nwekwara ike ịkpọpụta ya dịka okwu abụọ: “Otu nnukwu onye amụma ebilitela n’etiti anyị,” nakwa, “Chineke eletala ndị ya.”'
    reason: textual_punctuation_note
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: Egwu wee jide ha niile
  rationale: Nke a bụ akpaalaokwu Igbo dị mfe ma doo anya nke na-edobe egwu dịka ihe mere ha niile n’ike. A họrọghị ‘ịtụnanya’ ka e wee ghara iwepụ mgbagwoju dị n’etiti egwu na nsọpụrụ.
- source_word: δὲ
  choice: wee
  rationale: ‘Wee’ jikọtara ihe a na akụkọ gara aga n’ụzọ dị nro ma kwekọọ na ọrụ δέ n’ebe a.
- source_word: ἐδόξαζον τὸν θεὸν
  choice: ha nọkwa na-enye Chineke otuto
  rationale: ‘Na-enye Chineke otuto’ na-edobe echiche δοξάζω, ebe ‘nọkwa na-’ na-egosipụta omume na-aga n’ihu nke imperfect ἐδόξαζον.
- source_word: λέγοντες
  choice: na-asị
  rationale: Nke a na-ewebata okwu ha ji enye Chineke otuto n’Igbo dị eke.
- source_word: Προφήτης μέγας
  choice: Otu nnukwu onye amụma
  rationale: Nke a bụ ntụgharị doro anya ma bụrụkwa ụzọ ndị Igbo taa si ekwu ya.
- source_word: ἠγέρθη
  choice: ebiliteela
  rationale: ‘Ebilitela’ bụ okwu eke nke pụrụ ịpụta na onye amụma apụtawo n’etiti ha, ma ọ naghị emechi ohere na Chineke bụ onye mere ka o bilie.
- source_word: ἐν ἡμῖν
  choice: n’etiti anyị
  rationale: Nke a na-egosipụta ọnọdụ ya n’ime obodo ha n’ụzọ doro anya.
- source_word: Ἐπεσκέψατο
  choice: abịalakwa leta
  rationale: ‘Abịa leta’ na-edobe okwu nleta nke Akwụkwọ Nsọ na echiche nke Chineke bịara lebara ndị ya anya, n’etinyeghị nkọwa dịka ‘zọpụta’ ma ọ bụ ‘nyere aka’ n’ime isiokwu.
- source_word: τὸν λαὸν αὐτοῦ
  choice: ndị ya
  rationale: Nke a bụ Igbo dị nkenke ma na-edobe echiche nke ndị ahụ bụ ndị Chineke.
theological_decisions:
- issue: Ihe φόβος pụtara mgbe ọrụ ebube gasịrị
  choice: egwu
  alternative: ụjọ jupụtara n’ịtụnanya; nsọpụrụ dị egwu
  rationale: ‘Egwu’ na-anọgide nso n’okwu Grik ma na-ahapụ onye na-agụ ya ka ọ ghọta site n’ọnọdụ ahụ ma ọ bụ egwu nsọpụrụ; a naghị edozi mgbagwoju ahụ n’amaghị ama.
- issue: Ihe ἠγέρθη pụtara gbasara onye amụma
  choice: ebiliteela
  alternative: e bulitela
  rationale: Isiokwu na-eji okwu Igbo eke nke na-ekwe ka a ghọta na onye amụma apụtawo; ndetu na-echekwa ụzọ passive nke pụrụ ime ka ọrụ Chineke pụta ìhè.
- issue: Ihe Ἐπεσκέψατο pụtara mgbe Chineke bụ onye na-eme ihe
  choice: abịalakwa leta ndị ya
  alternative: abịala nyere ndị ya aka; elebarala ndị ya anya
  rationale: Okwu ‘leta’ na-echekwa akpaalaokwu Akwụkwọ Nsọ banyere Chineke ịbịakwute ndị ya n’ilekọta ha, n’emeghị ka ọ bụrụ naanị otu nkọwa.
- issue: Ma ὅτι ... καὶ ὅτι ... bụ otu okwu ma ọ bụ okwu abụọ yiri ibe ha
  choice: otu okwu e jikọtara ọnụ n’otu akara nhota
  alternative: okwu abụọ e tinyere n’akara nhota dị iche iche
  rationale: Grik nwere njikọ nke ahịrịokwu abụọ ahụ, ma akara edemede adịghị n’ihe odide mbụ. Isiokwu jikọtara ha ka Igbo wee na-aga nke ọma; ndetu na-echekwa ụzọ ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọsọ akụkọ, omume otuto na-aga n’ihu, na asụsụ Akwụkwọ Nsọ banyere Chineke ileta ndị ya. A zere okwu ụka pụrụ iche na nkọwa nke ga-emechi mgbagwoju dị n’akwụkwọ Grik.
