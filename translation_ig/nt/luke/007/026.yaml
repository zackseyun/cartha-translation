review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the adversative question sequence, the plural address, the elliptical “A prophet?”, the affirmation, and the restrained comparison. However, “unu pụrụ ịhụ” means “you can see” rather than the aorist action “you went/went out to see,” so it does not represent ἐξήλθατε.
  naturalness: “Gịnị ka unu gara pụọ ịhụ?” is understandable and naturally conveys going out for the purpose of seeing. The remaining wording is clear Standard Igbo and maintains the rhetorical cadence.
  terminology: “Onye amụma” is the appropriate standard term for προφήτης. “Onye karịrị onye amụma” appropriately conveys the comparison without defining what makes him greater. The footnote should not paraphrase the expression as “not merely being a prophet,” since that adds an interpretive nuance not stated directly in the Greek.
  issues:
  - severity: high
    issue: The rendering of ἐξήλθατε is inaccurate.
    rationale: “Unu pụrụ” expresses ability (“you can”), not completed past motion (“you went out”). The verb of motion must be restored.
  - severity: medium
    issue: The footnote’s proposed alternative is interpretive.
    rationale: “Ọ karịrị ịbụ naanị onye amụma” introduces “only,” which is not explicit in περισσότερον προφήτου. A lexical alternative should retain the simple comparison.
  revised_text: Ma gịnị ka unu gara pụọ ịhụ? Onye amụma? Ee, ana m agwa unu, ọ bụkwa onye karịrị onye amụma.[a]
