base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ig
  text: Ma gịnị ka unu gara pụọ ịhụ? Onye amụma? Ee, ana m agwa unu, ọ bụkwa onye karịrị onye amụma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ihe karịrị onye amụma.” Okwu ntụnyere Grik ahụ na-ekwu na ọ karịrị onye amụma; “onye karịrị onye amụma” bụ ụzọ Igbo dị eke isi kwuo ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị na ihe dị iche n’ajụjụ nkwughachi bu ya ụzọ; “Ma” bụ njikọ Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: τί
  choice: gịnị
  rationale: Ọ bụ ihe ajụjụ ahụ na-achọ ka a hụrụ, ọ bụghị ihe mere ha ji pụọ.
- source_word: ἐξήλθατε
  choice: unu pụrụ
  rationale: Oge gara aga na onye nke abụọ ọtụtụ; “pụọ” na-egosi isi n’ebe ha nọ gaa n’ọzara, dịka ọnọdụ amaokwu ahụ si dị.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Infinitive a na-egosi nzube ha ji pụọ; “ịhụ” bụ okwu Igbo nkịtị ma doo anya.
- source_word: προφήτην
  choice: Onye amụma
  rationale: 'Aha nkịtị a na-eji naanị ya dị ka ajụjụ nkwughachi: “Onye amụma?”'
- source_word: ναί
  choice: Ee
  rationale: Azịza nkwenye siri ike ma dị kpọmkwem.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ bụ ụzọ Igbo dị ndụ ma kwesị ntụkwasị obi isi kwuo usoro okwu a Jizọs na-ejikarị.
- source_word: καὶ
  choice: ọ bụkwa
  rationale: “-kwa” na-edobe njikọ na mgbakwunye nke καὶ, ebe “ọ bụ” na-eme ka ahịrịokwu ahụ zuo oke n’Igbo.
- source_word: περισσότερον προφήτου
  choice: onye karịrị onye amụma
  rationale: Nke a bụ ụzọ Igbo kacha eke isi kwupụta na onye ahụ abụghị naanị onye amụma, n’agbanyeghị na okwu Grik ahụ ji ụdị etiti kwuo ntụnyere ahụ.
theological_decisions:
- issue: Ọkwa na njirimara Jọn Onye Na-eme Baptizim n’okwu Jizọs
  choice: A sụgharịrị ya dị ka “onye karịrị onye amụma,” n’akọwaghị kpọmkwem n’amaokwu a ihe mere o ji karịrị onye amụma.
  alternative: Ịkpọ ya onye amụma kasị ukwuu ma ọ bụ ịkọwa ya ozugbo dị ka onye ozi nke oge ikpeazụ.
  rationale: Amaokwu ahụ n’onwe ya na-ekwu naanị ntụnyere ahụ; ihe gbara ya gburugburu ga-akọwa ya, ya mere e kwesịghị itinye nkọwa ozizi ọzọ n’ime amaokwu a.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma nwee ugwu. “Unu” na-edobe adreesị ọtụtụ nke Grik; usoro ajụjụ nkwughachi ahụ ka e debere iji chekwaa ike okwu Jizọs.
