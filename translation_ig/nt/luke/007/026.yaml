revisions:
- from: Ma gịnị ka unu pụrụ ịhụ? Onye amụma? Ee, ana m agwa unu, ọ bụkwa onye karịrị onye amụma.[a]
  to: Ma gịnị ka unu gara pụọ ịhụ? Onye amụma? Ee, ana m agwa unu, ọ bụkwa onye karịrị onye amụma.[a]
  rationale: The revision restores the past outward movement expressed by ἐξήλθατε while retaining the purpose infinitive “ịhụ.” It also replaces the footnote’s interpretive “naanị” paraphrase with a comparison that preserves the Greek expression’s ambiguity and force.
  reviewer_model: gpt-5.6-terra
