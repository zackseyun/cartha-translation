  yaml_path: translation/nt/luke/007/018.yaml
  text: And his disciples reported all these things to John[a]. And John, calling two certain ones of his disciples[b],
translation:
  language: ig
  text: Ndị na-eso ụzọ Jọn kọọrọ ya ihe ndị a niile. Jọn wee kpọọ mmadụ abụọ n’ime ndị na-eso ụzọ ya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ahịrịokwu Grik a gara n’ihu n’amaokwu na-esonụ; rịkọma a na-egosi na echiche ahụ akwụsịbeghị.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: kọọrọ
  rationale: Ngwaa a pụtara izi mmadụ akụkọ ma ọ bụ ịkọrọ ya ihe mere; “kọọrọ” bụ okwu Igbo dị mfe ma dabara n’akụkọ a.
- source_word: Ἰωάννῃ
  choice: Jọn
  rationale: Ọ bụ onye a na-agwa ihe n’ụdị dative. E tinyere aha Jọn n’ahịrịokwu mbụ iji mee ka onye nnọchi aha “ya” doo anya n’Igbo.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Ndị na-eso ụzọ Jọn
  rationale: “Ndị na-eso ụzọ” na-egosi mmekọrịta nke ndị na-amụta ihe n’aka onye nkuzi ma na-eso ya; ikwughachi Jọn ebe a na-ewepụ mgbagwoju anya nke “ya” n’Igbo.
- source_word: περὶ πάντων τούτων
  choice: ihe ndị a niile
  rationale: Nke a na-echekwa ma mkpokọta πάντων ma ntụaka τούτων n’ụzọ Igbo sitere n’okike.
- source_word: προσκαλεσάμενος
  choice: kpọọ
  rationale: Ọ na-egosi na Jọn kpọrọ ndị ahụ ka ha bịakwute ya; “kpọọ” na-enye echiche ahụ n’ụzọ dị nkenke ma bụrụ nke nkịtị.
- source_word: δύο τινὰς
  choice: mmadụ abụọ
  rationale: τινάς na-egosi mmadụ abụọ a họpụtara n’otu ahụ n’enweghị ịkọwa ndị ha bụ. “Mmadụ abụọ n’ime” na-eburu nuance ahụ n’Igbo na-enweghị okwu siri ike.
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: n’ime ndị na-eso ụzọ ya
  rationale: '“N’ime” na-egosipụta genitive partitive nke ọma: a họpụtara mmadụ abụọ site n’etiti ìgwè ndị na-eso ụzọ ya.'
- source_word: ὁ Ἰωάννης
  choice: Jọn
  rationale: Aha ahụ bụ isiokwu e kwughachiri n’asụsụ Grik; e debere ya n’Igbo iji gosi nke ọma onye kpọrọ mmadụ abụọ ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E haziri nkebiokwu mbụ ka onye “ya” na-ezo aka na ya doo anya. E chekwara ọdịdị ahịrịokwu na-agwụbeghị site n’itinye akara nkọwa [a] mgbe rikoma gasịrị.
