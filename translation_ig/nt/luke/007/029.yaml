  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: ig
  text: Mgbe ndị mmadụ niile, tinyere ndị na-anakọta ụtụ isi, nụrụ nke a, ha kwetara na Chineke ziri ezi[a], ebe e mere ha baptizim nke Jọn.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị karịa, “ha gụrụ Chineke dịka onye ziri ezi.” Ihe ọ pụtara bụ na ha kwetara na Chineke nọ n’ụzọ ziri ezi.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịghọta nkebiokwu a dịka ihe na-egosi ihe kpatara ya: “n’ihi na e mere ha baptizim nke Jọn.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: ndị mmadụ niile
  rationale: Nke a na-egosipụta otu ìgwè mmadụ n’ozuzu ya n’Igbo dị mfe ma doo anya.
- source_word: ἀκούσας
  choice: mgbe ... nụrụ nke a
  rationale: A sụgharịrị participle a dị ka ihe na-egosi oge; “nke a” na-anọchi ihe ha nụrụ site n’ihe gbara amaokwu ahụ gburugburu.
- source_word: οἱ τελῶναι
  choice: ndị ọna ụtụ isi
  rationale: Nke a bụ okwu Igbo nke oge a, nke ndị nkịtị ga-aghọta maka ndị na-anakọta ụtụ isi.
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: ha kwetara na Chineke ziri ezi
  rationale: N’ebe a, δικαιόω apụtaghị na ha mere Chineke ka ọ bụrụ onye ezi omume, kama na ha kwupụtara ma kweta na Chineke nọ n’ụzọ ziri ezi.
- source_word: βαπτισθέντες
  choice: ebe ha bụ ndị e mere baptizim
  rationale: Nhazi a na-edobe participle ahụ dị ka ọnọdụ ma ọ bụ ihe ndabere, n’etinyeghị ihe kpatara ya n’ime isi okwu n’amanyeghị ya.
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: baptizim Jọn
  rationale: Nke a bụ ụzọ dị mkpirikpi ma bụrụkwa nke doro anya isi kwuo baptizim Jọn nyere ma ọ bụ nke metụtara ozi ya.
theological_decisions:
- issue: Ihe ἐδικαίωσαν τὸν θεόν pụtara
  choice: Ha kwetara na Chineke ziri ezi.
  alternative: Ha kwupụtara na Chineke bụ onye ezi omume.
  rationale: Nhọrọ ahụ na-egosi na ndị mmadụ nabatara na Chineke nọ n’ụzọ ziri ezi; ọ naghị egosi na mmadụ mere ka Chineke bụrụ onye ezi omume.
- issue: Ọrụ participle βαπτισθέντες
  choice: 'E debere ya dị ka ọnọdụ ma ọ bụ ihe ndabere: “ebe ha bụ ndị e mere baptizim Jọn.”'
  alternative: 'A pụrụ ịghọta ya dịka ihe kpatara ya: “n’ihi na e mere ha baptizim Jọn.”'
  rationale: Ụdị Grik ahụ nwere ike iburu echiche nke ihe kpatara ya, ma ọ naghị amanye nghọta ahụ; ya mere, isi ederede na-edobe mgbagwoju anya ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. A họọrọ okwu ndị nkịtị ga-aghọta, ma e debere nhịahụ nke okwu ikpe gbasara Chineke na nghọta abụọ participle ahụ nwere.
