  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: ig
  text: Onye na-adịghị asụ ngọngọ n’ihi m ka a gọziri agọzi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-adịghị ewe m iwe,” ma ọ bụ, “onye na-adịghị adapụ n’ihi m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: onye a gọziri agọzi
  rationale: Nke a na-echekwa ibu okpukpe na amara Chineke dị n'okwu μακάριος karịa ịsị nanị na onye ahụ nwere obi ụtọ ma ọ bụ na ihe ọma dakwasịrị ya.
- source_word: ὃς ἐὰν μὴ
  choice: onye ọ bụla nke na-agaghị
  rationale: Ọ na-egosipụta njikọ nnọchiaha na ọnọdụ izugbe n'Igbo dị ugbu a, n'enweghị okwu ochie ma ọ bụ mgbagwoju anya.
- source_word: σκανδαλισθῇ
  choice: asụ ngọngọ
  rationale: 'Ihe oyiyi nke ịsụ ngọngọ na-echekwa ịdị obosara nke ngwaa Grik ahụ: mmadụ nwere ike iwe iwe ma ọ bụ jụ Jizọs ruo n''ókè nke ịdapụ; a naghị eme ka ọ bụrụ nanị mwute n''obi.'
- source_word: ἐν ἐμοί
  choice: n'ihi m
  rationale: N'okwu a, ἐν ἐμοί na-egosi na Jizọs bụ ihe ga-eme ka mmadụ sụọ ngọngọ; “n'ihi m” bụ Igbo doro anya ma kwekọọ n'echiche ahụ.
theological_decisions:
- issue: Ibelata ma ọ bụ ịkọwa kpamkpam ihe ịsụ ngọngọ n'ihi Jizọs pụtara
  choice: E debere ihe oyiyi “asụ ngọngọ” ma tinye ụzọ okwu ndị ọzọ n'ala peeji.
  alternative: “iwe m iwe” ma ọ bụ “dapụ n'okwukwe n'ihi m”
  rationale: Okwu Grik ahụ nwere ike ịgụnye iwe n'ihi Jizọs nke na-eduga n'ịsụ ngọngọ, ma amaokwu ahụ akọwaghị kpọmkwem na ọ bụ naanị iwe mmetụta uche ma ọ bụ ịhapụ okwukwe. Nsụgharị a na-echekwa esemokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. E ji “asụ ngọngọ” chekwaa ihe oyiyi nke ederede mbụ, ebe nkọwa ala peeji na-egosi obosara echiche ya.
