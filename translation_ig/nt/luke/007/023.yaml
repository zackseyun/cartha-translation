- from: Onye a gọziri agọzi bụ onye ọ bụla nke na-agaghị asụ ngọngọ n'ihi m.[a]
  to: Onye na-adịghị asụ ngọngọ n’ihi m ka a gọziri agọzi.[a]
  rationale: The revision gives the beatitude a natural Standard Igbo form, preserves its general conditional sense, and retains the Greek stumbling metaphor. The footnote offers the senses of taking offense and falling away while avoiding the unsupported addition of “okwukwe.”
