review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents μακάριος, the generalizing relative construction, the stumbling image of σκανδαλισθῇ, and the causal/occasional sense of ἐν ἐμοί. However, the future-negative form “na-agaghị” is less suitable than a general present form for this beatitude, and the main clause is unnecessarily repetitive.
  naturalness: “Onye a gọziri agọzi bụ onye ọ bụla...” is awkward and tautological in Standard Igbo. “Onye na-adịghị asụ ngọngọ n’ihi m ka a gọziri agọzi” is idiomatic, dignified, and retains the representative singular force.
  terminology: “A gọziri agọzi” suitably conveys μακάριος in this saying. “Asụ ngọngọ” preserves the source image without deciding whether the resulting failure is offense, rejection, or apostasy. The prior footnote’s “adapụ n’okwukwe” adds “faith,” which is not stated in the Greek; it should be broadened.
  issues:
  - severity: medium
    issue: Awkward and repetitive beatitude construction
    rationale: “Onye a gọziri agọzi bụ onye ọ bụla” duplicates the noun phrase and is not natural modern Standard Igbo.
  - severity: low
    issue: Future form weakens the general-present formulation
    rationale: The Greek ὃς ἐὰν μὴ σκανδαλισθῇ expresses a general condition. Igbo “na-adịghị” conveys this naturally without implying a specifically future event.
  - severity: medium
    issue: Footnote over-specifies falling away ‘from faith’
    rationale: σκανδαλισθῇ can include falling away, but the verse does not explicitly say “faith/okwukwe.” The alternative should not add that object.
  revised_text: Onye na-adịghị asụ ngọngọ n’ihi m ka a gọziri agọzi.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-adịghị ewe m iwe,” ma ọ bụ, “onye na-adịghị adapụ n’ihi m.”
    reason: lexical_alternative
  revision_rationale: The revision gives the beatitude a natural Standard Igbo form, preserves its general conditional sense, and retains the Greek stumbling metaphor. The footnote offers the senses of taking offense and falling away while avoiding the unsupported addition of “okwukwe.”
