  source_fidelity: 'Nsụgharị ahụ na-edobe usoro na isi omume ndị dị na Greek: nwanyị ahụ guzoro n’azụ Jizọs n’akụkụ ụkwụ ya, na-akwa ákwá; ọ malitere iji anya mmiri ya mee ka ụkwụ ya dee mmiri, jiri ntutu isi ya hichaa ha, na-esusu ụkwụ ya ọnụ, ma na-ete ha μύρον. A naghị atụfu ἤρξατο (‘malite’) ma ọ bụ ọdịdị omume na-aga n’ihu nke imperfect ndị dị na ἐξέμασσεν, κατεφίλει, na ἤλειφεν.'
  naturalness: Igbo ahụ bụ Standard Igbo doro anya ma dị n’usoro eke. “N’azụ ya n’akụkụ ụkwụ ya,” “na-akwa ákwá,” “mee ka ụkwụ ya dee mmiri,” na “na-esusu ụkwụ ya ọnụ” na-akọwa ọnọdụ na omume ahụ n’enweghị okwu na-adịghị eke. Nkọwa ugboro ugboro adịghị etinye ihe karịrị isi ederede.
  terminology: “Mmanụ na-esi ísì ụtọ” bụ nsụgharị dị mma ma ghọta ngwa ngwa maka μύρῳ, ebe nkọwa ụkwụ b na-echekwa nhọrọ “ude na-esi ísì ụtọ.” “Na-ete” na “ehicha” dabara n’ọrụ ἀλείφω na ἐκμάσσω n’amaokwu a. Akara [a] na-ezo kpọmkwem n’isusu ọnụ, [b] n’ihe e tere; ha dabara nke ọma na nkọwa ụkwụ ha.
