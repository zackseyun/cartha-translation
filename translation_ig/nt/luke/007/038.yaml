id: LUK.7.38
reference: Luke 7:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: ig
  text: O wee guzo n’azụ ya n’akụkụ ụkwụ ya, na-akwa ákwá, malite iji anya mmiri ya mee ka ụkwụ ya dee mmiri. Ọ nọkwa na-eji ntutu isi ya ehicha ụkwụ ya, na-esusu ụkwụ ya ọnụ[a], ma na-ete ha mmanụ na-esi ísì ụtọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-esusu ụkwụ ya ọnụ ugboro ugboro”; ngwaa Greek ahụ siri ike, imperfect ya na-egosikwa omume a na-eme ugboro ugboro.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ude na-esi ísì ụtọ”; okwu Greek ahụ na-ezo aka ná mmanụ ma ọ bụ ude e tinyere ihe na-esi ísì ụtọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: O wee guzo
  rationale: Aorist participle na-akọwa ihe o mere ka ihe ndị ọzọ na-esote wee mee; usoro a bụ Igbo sitere n’okike ma na-edebe ike nke ịtọ ọnọdụ ahụ.
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: n’azụ ya n’akụkụ ụkwụ ya
  rationale: Nke a na-edebe ma ὀπίσω, ‘n’azụ,’ ma παρά + accusative, nke na-egosi na ọ nọ nso n’ụkwụ ya; ọ dabara n’ọnọdụ iri nri mgbe mmadụ dina n’akụkụ tebụl.
- source_word: κλαίουσα
  choice: na-akwa ákwá
  rationale: Na-egosi ịkwa ákwá na-aga n’ihu, dịka participle nke Greek si mee.
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: malite iji anya mmiri ya mee ka ụkwụ ya dee mmiri
  rationale: ‘Malite’ na-edebe ἤρξατο, ebe ‘mee ka ... dee mmiri’ na-enye βρέχειν n'ụzọ doro anya n’Igbo n’enweghị ikwubiga ihe ókè.
- source_word: ἐξέμασσεν
  choice: Ọ nọkwa na-eji ... ehicha
  rationale: Ụdị a na-egosi omume na-aga n’ihu dịka imperfect Greek si dị; ‘ehicha’ anaghị ekpebi ma ihe ahụ kpọrọ nkụ kpamkpam.
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: na-eji ntutu isi ya
  rationale: ‘Ntutu isi ya’ bụ okwu Igbo sitere n’okike ma na-edebe ntụaka doro anya nke Greek banyere ntutu dị n’isi ya.
- source_word: κατεφίλει
  choice: na-esusu ụkwụ ya ọnụ
  rationale: Ọdịdị na-aga n’ihu na compound verb na-akwado omume ugboro ugboro; isi ederede anaghị agbakwụnye nkọwa dịka ‘n’ike’ ma ọ bụ ‘n’ịhụnanya.’
- source_word: ἤλειφεν
  choice: na-ete ha
  rationale: ‘Na-ete’ bụ okwu Igbo doro anya maka itinye mmanụ n’ahụ, ma na-edebe imperfect nke omume na-aga n’ihu.
- source_word: τῷ μύρῳ
  choice: mmanụ na-esi ísì ụtọ
  rationale: μύρον bụ mmanụ ma ọ bụ ude e tinyere ihe na-esi ísì ụtọ; nsụgharị a bụ nke ndị Igbo nke oge a ga-aghọta ngwa ngwa.
theological_decisions:
- issue: Omume nwanyị ahụ n’ebe ụkwụ Jizọs nọ
  choice: E debere omume anụ ahụ niile kpọmkwem na mmetụta siri ike nke akụkọ ahụ n’enweghị ịgbakwunye nkọwa ofufe.
  alternative: Ịsụgharị ya n’ụzọ na-ebelata isusu ọnụ ugboro ugboro, ma ọ bụ ịgbakwunye okwu dịka ‘iji gosi nsọpụrụ ya.’
  rationale: Greek na-akọwa omume ndị ahụ n'ụzọ pụtara ìhè ma jupụta na mmetụta; nsụgharị ekwesịghị ime ka ha dị nro ma ọ bụ tinye nkọwa nkà mmụta okpukpe na-adịghị n’amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro ngwaa na-aga n’ihu gosipụta imperfect Greek, ma zere okwu ụka pụrụ iche. E tinyere akara [a] n’ebe isusu ọnụ dị na [b] n’ebe mmanụ na-esi ísì ụtọ dị ka nkọwa ụkwụ ha si metụta okwu ndị ahụ.
