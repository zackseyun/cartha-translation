id: LUK.7.6
reference: Luke 7:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: ig
  text: Jizọs soro ha na-aga. Ma mgbe ọ nọworị nso n’ụlọ ahụ, onyeisi agha narị ahụ zipụrụ ndị enyi ka ha gwa ya sị, “Onyenwe anyị[a], enyela onwe gị nsogbu, n’ihi na ekwesịghị m[b] ka ị bata n’okpuru elu ụlọ m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nna ukwu.” Okwu Grik bụ “Onyenwe anyị” (κύριε); ọ pụrụ ịbụ okwu nkwanye ùgwù, ọ pụkwara igosi na ọ matara ikike Jizọs.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “erughị m eru” ma ọ bụ “etozughị m.” Okwu Grik ahụ pụrụ ịpụta ịdị eru, ịdị tozuru, ma ọ bụ ịbụ onye kwesịrị ekwesị; n’ebe a ọ na-egosi umeala onyeisi agha ahụ n’ihu Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο σὺν αὐτοῖς
  choice: sooro ha na-aga
  rationale: Ọdịdị ngwaa imperfect na-egosi njem Jizọs na-aga n’ihu, ebe nkebi a na-egosikwa na ndị ahụ so ya.
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: mgbe ọ nọworị nso n’ụlọ ahụ
  rationale: Nke a na-enye oge ihe mere n’Igbo eke; ‘nso’ na-ebute echiche Grik nke na ọ nọghịzi ebe dị anya n’ụlọ ahụ.
- source_word: ὁ ἑκατοντάρχης
  choice: onyeisi ndị agha narị ahụ
  rationale: Nke a na-akọwa ọkwa agha Rom n'ụzọ onye Igbo nke oge a ga-aghọta, n’etinyeghị aha ọkwa sitere n’asụsụ ọzọ.
- source_word: ἔπεμψεν φίλους
  choice: zipụrụ ndị enyi ya
  rationale: Ọ na-egosi n'ụzọ doro anya na ndị e zipụrụ bụ ndị enyi onyeisi ndị agha ahụ.
- source_word: μὴ σκύλλου
  choice: enyela onwe gị nsogbu
  rationale: Nke a bụ ụzọ Igbo eke si egosipụta arịrịọ nkwanye ùgwù ka mmadụ ghara ịta onwe ya ahụhụ ma ọ bụ nye onwe ya nsogbu.
- source_word: ἱκανός εἰμι
  choice: erughị m eru
  rationale: Nkebi a nwere ike ịpụta ịbụ onye kwesịrị ekwesị ma ọ bụ onye tozuru; n’ebe a ọ na-egosipụta umeala onyeisi ndị agha ahụ.
- source_word: ὑπὸ τὴν στέγην μου
  choice: n’okpuru elu ụlọ m
  rationale: Nke a na-echekwa onyinyo Grik nke ịbata n’okpuru ụlọ mmadụ, kama ịgbanwe ya naanị ka ọ bụrụ ‘n’ụlọ m.’
theological_decisions:
- issue: Nsụgharị κύριε mgbe a na-akpọ Jizọs okwu kpọmkwem
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa aha nsọpụrụ ahụ na ohere na ọ na-egosi ịmata ikike Jizọs; ihe gbara ya gburugburu anaghị amanye anyị ikwu na nke a bụ nkwupụta okwukwe zuru ezu banyere onye Jizọs bụ.
- issue: Ihe ἱκανός εἰμι pụtara n’okwu onyeisi ndị agha ahụ
  choice: erughị m eru
  alternative: etozughị m
  rationale: Nhọrọ a na-egosipụta umeala na mmetụta nke ịbụ onye na-ekwesịghị ka Jizọs bata n’ụlọ ya, ma ihe odide Grik nwekwara ike ịmetụta ntozu ma ọ bụ ịdị mma maka ihe ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. ‘Onyeisi ndị agha narị’ na-akọwa ọkwa Rom n’enweghị okwu teknụzụ a gbazitere; ‘n’okpuru elu ụlọ m’ na-echekwa onyinyo nke isi mmalite.
