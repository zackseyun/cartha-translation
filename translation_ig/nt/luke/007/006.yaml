    reason: lexical_alternative
  revision_rationale: The revision removes the added inferential “Ya mere,” retains the imperfect sense with “soro ha na-aga,” and replaces an awkward expression of unworthiness with idiomatic “ekwesịghị m.” It also corrects and tightens the lexical explanation in footnote b while preserving the source’s semantic range and the traditional roof image.
