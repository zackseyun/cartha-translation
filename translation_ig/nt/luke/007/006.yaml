revisions:
- from: Ya mere, Jizọs sooro ha na-aga. Ma mgbe ọ nọworị nso n’ụlọ ahụ, onyeisi ndị agha narị ahụ zipụrụ ndị enyi ya ka ha sị ya, “Onyenwe anyị[a], enyela onwe gị nsogbu, n’ihi na erughị m eru[b] ka ị bata n’okpuru elu ụlọ m.”
  to: Jizọs soro ha na-aga. Ma mgbe ọ nọworị nso n’ụlọ ahụ, onyeisi agha narị ahụ zipụrụ ndị enyi ka ha gwa ya sị, “Onyenwe anyị[a], enyela onwe gị nsogbu, n’ihi na ekwesịghị m[b] ka ị bata n’okpuru elu ụlọ m.”
  rationale: The revision removes the added inferential “Ya mere,” retains the imperfect sense with “soro ha na-aga,” and replaces an awkward expression of unworthiness with idiomatic “ekwesịghị m.” It also corrects and tightens the lexical explanation in footnote b while preserving the source’s semantic range and the traditional roof image.
  reviewer_model: gpt-5.6-terra
