source:
  edition: SBLGNT
  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: ig
  text: N’ihi ya, echeghịdị m na m ruru eru ịbịakwute gị. Ma kwuo okwu, ka a gwọọ ohu m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwata m” ma ọ bụ “nwa m.” Okwu Grik a nwere ike ịpụta nwa, nwata, ma ọ bụ ohu, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe e kwuru tupu nke a, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: οὐδὲ
  choice: echeghịdị m
  rationale: 'Mgbakwunye -dị na-eme ka ngọnarị ahụ sie ike: o cheghị ọbụna na ya ruru eru.'
- source_word: ἐμαυτὸν ἠξίωσα
  choice: echeghị m na m ruru eru
  rationale: Na-egosipụta echiche nke ile onwe onye anya dị ka onye kwesịrị ekwesị ma ọ bụ onye ruru eru.
- source_word: πρὸς σὲ ἐλθεῖν
  choice: ịbịakwute gị
  rationale: Ọ bụ ụzọ Igbo doro anya si egosi ịbịa n’ebe mmadụ nọ.
- source_word: ἀλλὰ
  choice: Ma
  rationale: Na-ewebata arịrịọ nke dị iche n’ihe e kwuru tupu ya.
- source_word: εἰπὲ λόγῳ
  choice: kwuo naanị otu okwu
  rationale: Na-egosi na naanị okwu Jizọs kwuru zuru ime ihe ahụ; ‘naanị’ na-eme ka idiom ahụ doo anya n’Igbo n’agbanyeghị na ọ bụghị okwu dị iche n’asụsụ Grik.
- source_word: ἰαθήτω
  choice: ka a gwọọkwa
  rationale: Na-echekwa ike nke iwu/arịrịọ dị na aorist passive imperative, onye nke atọ, kama ịgbanwe ya ka ọ bụrụ naanị amụma ọdịnihu.
- source_word: ὁ παῖς μου
  choice: ohu m
  rationale: N’akụkọ onyeisi ndị agha a, mmekọrịta nke ikike na ọnọdụ ezinụlọ ya kwadoro ‘ohu’; a na-edebe nghọta ndị ọzọ n’okpuru peeji.
theological_decisions:
- issue: Ntụgharị παῖς n’akụkọ onyeisi ndị agha
  choice: ohu m
  alternative: nwata m; nwa m
  rationale: παῖς nwere ike ịpụta nwa, nwata, ma ọ bụ ohu. Ọnọdụ akụkọ ahụ na-egosi onye nọ n’okpuru ikike onyeisi ndị agha, ya mere ‘ohu m’ kacha doo anya; ihe ndị ọzọ okwu ahụ nwere ike ịpụta ka edere n’okpuru peeji iji ghara iwepụ mgbagwoju okwu mbụ ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ịbịakwute’ na ‘ruru eru’ mee ka ahịrịokwu ahụ bụrụ nke eke, ebe usoro ‘ka a gwọọkwa’ na-echekwa arịrịọ/iwu nke ngwaa Grik.
