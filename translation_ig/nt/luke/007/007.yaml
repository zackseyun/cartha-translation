revisions:
- from: N’ihi ya, echeghịdị m na m ruru eru ịbịakwute gị. Ma kwuo naanị otu okwu, ka a gwọọkwa ohu m.[a]
  to: N’ihi ya, echeghịdị m na m ruru eru ịbịakwute gị. Ma kwuo okwu, ka a gwọọ ohu m.[a]
  rationale: 'The revision removes two additions not expressed in the Greek: the restrictive «naanị» and the additive «-kwa». It retains the draft’s accurate, natural rendering of the centurion’s humility, request, passive imperative, and the contextually appropriate «ohu m», with the semantic range of παῖς preserved in the footnote.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inference (διό), intensified self-assessment (οὐδὲ ... ἠξίωσα), approach to Jesus, and the third-person passive imperative requesting healing. However, «naanị» (“only”) adds an explicit restrictive element not stated in εἰπὲ λόγῳ, and the enclitic «-kwa» (“also”) in «a gwọọkwa» adds material absent from ἰαθήτω.
  naturalness: The wording is generally natural Standard Igbo. «Kwuo okwu» is a clear, idiomatic rendering of the Greek request without adding the restrictive nuance of “only one word.” «Ka a gwọọ ohu m» is natural and preserves the passive request.
  terminology: «Ohu m» is contextually suitable for ὁ παῖς μου in this centurion account. The footnote appropriately retains the lexical alternatives “nwata m” and “nwa m.”
  issues:
  - severity: medium
    issue: «naanị otu okwu» adds a restrictive emphasis.
    rationale: The Greek has εἰπὲ λόγῳ, literally an instrumental expression, “speak/say a word.” Though English idiom may use “say the word,” the explicit Igbo «naanị» (“only”) is not represented by a Greek word and should not be added in an optimal-equivalence translation.
  - severity: low
    issue: «a gwọọkwa» includes «-kwa» (“also”).
    rationale: The Greek imperative ἰαθήτω asks that the servant be healed but contains no additive “also.” Removing -kwa preserves the source sense more precisely.
  revised_text: N’ihi ya, echeghịdị m na m ruru eru ịbịakwute gị. Ma kwuo okwu, ka a gwọọ ohu m.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “nwata m” ma ọ bụ “nwa m.” Okwu Grik a nwere ike ịpụta nwa, nwata, ma ọ bụ ohu, dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
  revision_rationale: 'The revision removes two additions not expressed in the Greek: the restrictive «naanị» and the additive «-kwa». It retains the draft’s accurate, natural rendering of the centurion’s humility, request, passive imperative, and the contextually appropriate «ohu m», with the semantic range of παῖς preserved in the footnote.'
