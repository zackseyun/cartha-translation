review_pass:
  verdict: revise
  source_fidelity: The draft retains the principal contrast and does not interpret the unspecified basis of ‘greater.’ However, adding ‘niile’ (‘all’) to the idiom is not represented in the Greek, and the final comparative is clearer and more idiomatic when expressed with ‘karịa ya n’ịdị ukwuu.’
  naturalness: ‘N’etiti ndị nwanyị mụrụ’ is the established, natural Igbo biblical-style idiom. ‘Ndị niile nwanyị mụrụ’ is less natural and introduces an unnecessary universal modifier. The revised comparative constructions read smoothly in modern Standard Igbo.
  terminology: ‘Jọn,’ ‘alaeze Chineke,’ and ‘onye kasị nta’ are suitable Standard Igbo biblical terminology. The wording preserves the paradox without defining what kind of greatness is meant.
  issues:
  - severity: medium
    issue: The translation adds ‘niile’ in ‘ndị niile nwanyị mụrụ.’
    rationale: The Greek idiom ἐν γεννητοῖς γυναικῶν means ‘among those born of women’ and has no equivalent of ‘all.’ Omitting ‘niile’ more closely follows the source and yields a more idiomatic Igbo expression.
  - severity: low
    issue: Footnote c does not accurately frame the Greek expression in its context.
    rationale: The note’s contrast between ‘onye kasị nta’ and ‘onye dị nta karịa’ is not a useful lexical alternative here and omits the phrase ‘n’alaeze Chineke.’ A contextual alternative should identify the substantival comparative as ‘the one who is least in the kingdom of God.’
  revised_text: Ana m agwa unu[a], n’etiti ndị nwanyị mụrụ[b], ọ dịghị onye karịrị Jọn n’ịdị ukwuu; ma onye kasị nta n’alaeze Chineke[c] karịrị ya n’ịdị ukwuu.
