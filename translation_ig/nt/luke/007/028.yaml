id: LUK.7.28
reference: Luke 7:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: ig
  text: Ana m agwa unu[a], n’etiti ndị nwanyị mụrụ[b], ọ dịghị onye karịrị Jọn n’ịdị ukwuu; ma onye kasị nta n’alaeze Chineke[c] karịrị ya n’ịdị ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kwekọrọ nnọọ n’okwu Grik, “Ana m asị unu.”
    reason: lexical_alternative
  - marker: b
    text: Okwu ahụ bụ “ndị nwanyị mụrụ” bụ akpaalaokwu na-ezo aka n’ụmụ mmadụ n’ozuzu ha.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “onye bụ onye kasị nta n’alaeze Chineke.” Okwu Grik ahụ nwere ike iji nkebiokwu metụtara aha kọwaa ya n’ụzọ doro anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ana m agwa unu
  rationale: Ọ bụ ụzọ e si ekwu okwu ozugbo n’Igbo nke na-egosi na Jizọs na-agwa ndị na-ege ya ntị okwu; ọ na-edebekwa ike nke okwu Grik dị ugbu a.
- source_word: μείζων
  choice: ka ... ukwuu
  rationale: Usoro ntụnyere a na-edebe echiche nke ịdị ukwuu n’ebughị ụzọ kọwaa ma ọ bụ ugwu, ọnọdụ, ikike, ma ọ bụ ihe ọzọ ka a na-atụnyere.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: n’etiti ndị niile nwanyị mụrụ
  rationale: Nke a na-edebe ọdịdị akpaalaokwu sitere na isi mmalite ma na-aghọta ya n’Igbo dị ka mmadụ niile a mụrụ n’ụwa.
- source_word: Ἰωάννου
  choice: Jọn
  rationale: Aha a sụgharịrị n’ụdị a maara nke ọma n’Igbo.
- source_word: οὐδείς ἐστιν
  choice: ọ dịghị onye
  rationale: Nke a bụ ụzọ Igbo doro anya na nke nkịtị si kwuo nkwupụta na ọ dịghị onye dị otú ahụ.
- source_word: ὁ δὲ μικρότερος
  choice: ma onye kasị nta
  rationale: Mkpọaha na comparative Grik na-arụ ọrụ dị ka aha mmadụ. ‘Onye kasị nta’ bụ ụzọ Igbo doro anya isi gosi onye nọ n’ọnọdụ kacha ala n’otu a, ebe ‘ma’ na-egosi ntụgharị dị n’ahịrịokwu ahụ.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: n’alaeze Chineke
  rationale: Nke a bụ okwu Akwụkwọ Nsọ a maara nke ọma n’Igbo, ma ọ na-edebe echiche nke ịnọ n’ime alaeze Chineke.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ka ya ukwuu
  rationale: Usoro a na-egosi nke ọma na e ji onye ahụ tụnyere Jọn, n’agbanyeghị na ọ naghị akọwa ụdị ịdị ukwuu a na-ekwu maka ya.
theological_decisions:
- issue: Ihe ntụnyere dị n’etiti Jọn na ‘onye kasị nta’ n’alaeze Chineke pụtara
  choice: E debere ntụnyere ahụ dịka okwu siri ike ma juputara n’ihe omimi, n’akọwaghị ihe ‘ịdị ukwuu’ gbadoro ụkwụ na ya.
  alternative: A pụrụ ịkọwa ya dị ka nnukwu ihe ùgwù ndị nọ n’alaeze nwere, ịdị elu n’omume ma ọ bụ n’ime mmụọ, ma ọ bụ ọnọdụ n’usoro akụkọ nzọpụta.
  rationale: Grik kwuru naanị na onye ahụ ‘ka ya ukwuu’; ọ kọwaghị ma nke a bụ ọnọdụ, ihe ùgwù, àgwà ime mmụọ, ma ọ bụ ihe ọzọ. Ya mere, nsụgharị ahụ anaghị etinye nkọwa otu ụka ma ọ bụ otu onye n’ime okwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta mee ihe. A hapụrụ akpaalaokwu ‘ndị niile nwanyị mụrụ’ ka njikọ ya na isi mmalite ghara ifu, ma kọwaa ya n’ala ala peeji. A hapụkwara ihe ‘ịdị ukwuu’ pụtara n’enweghị nkọwa okpukpe agbakwunyere.
