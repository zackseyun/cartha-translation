revisions:
- from: Ana m agwa unu[a], n’etiti ndị niile nwanyị mụrụ[b], ọ dịghị onye ka Jọn ukwuu; ma onye kasị nta[c] n’alaeze Chineke ka ya ukwuu.
  to: Ana m agwa unu[a], n’etiti ndị nwanyị mụrụ[b], ọ dịghị onye karịrị Jọn n’ịdị ukwuu; ma onye kasị nta n’alaeze Chineke[c] karịrị ya n’ịdị ukwuu.
  rationale: The revision removes the unsupported ‘niile,’ uses the natural Igbo idiom ‘ndị nwanyị mụrụ,’ and makes both comparisons explicit without specifying the nature of the greatness. Footnote c is revised to reflect the contextual syntactic alternative supplied by the Greek expression.
  reviewer_model: gpt-5.6-terra
