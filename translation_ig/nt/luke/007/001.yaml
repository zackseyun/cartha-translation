id: LUK.7.1
reference: Luke 7:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: ig
  text: Mgbe o mechara ikwu okwu ya niile ka ndị mmadụ na-anụ, ọ banyere na Kapanọm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: Mgbe
  rationale: N'ebe a, okwu ahụ na-egosi oge ihe mere, ọ bụghị ihe kpatara ya; “Mgbe” na-egosi usoro akụkọ ahụ nke ọma.
- source_word: ἐπλήρωσεν
  choice: o kwuchara
  rationale: N'okwu njikọ a ya na ῥήματα, ihe ọ pụtara bụ imecha ikwu okwu. “O kwuchara” bụ Igbo doro anya ma na-egosi na nke a mere tupu ọ banye Kapanọm.
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: okwu ya niile
  rationale: Nke a na-esochi okwu Grik ahụ nso ma na-ezo aka n'ihe niile Jizọs kwuru n'ozizi gara aga.
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: ka ndị mmadụ na-anụ
  rationale: Nke a na-enye n'Igbo eke echiche nke ikwu okwu n'ebe ndị mmadụ nọ ka ha nụ, n'ebughị ụzọ sụgharịa akpaalaokwu Grik ahụ n'ụzọ siri ike.
- source_word: λαοῦ
  choice: ndị mmadụ
  rationale: Ọ na-echekwa echiche nke ndị mmadụ n'ozuzu, n'emeghị ka ha bụrụ naanị ìgwè mmadụ kpọmkwem.
- source_word: εἰσῆλθεν
  choice: ọ banyere
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma kwekọọ na ngwaa Grik nke pụtara ịbanye n'ime ebe.
- source_word: Καφαρναούμ
  choice: Kapanọm
  rationale: Ụdị aha obodo a a na-eji n'Igbo, nke dị mfe ọgụgụ ma dabara n'usoro mkpọpụta Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “ka ndị mmadụ na-anụ” mee ka akpaalaokwu Grik pụta n'ụzọ eke, ebe “okwu ya niile” na-echekwa nso okwu mmalite.
