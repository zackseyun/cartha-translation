  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị ya, “A gbagharala gị mmehie gị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “A gbagharala mmehie gị.” Ụdị perfect passive n’asụsụ Grik pụrụ imesi omume e mezuru ike, tinyere nsonaazụ ya nke ka dị ugbu a.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Aorist nke λέγω pụtara n'ụzọ kwụ ọtọ na ọ sịrị; nke a bụkwa okwu Igbo dị mfe ma kwekọọ n'okwu a kpọrọ kpọmkwem.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: δέ bụ njikọ dị nro na-akwalite akụkọ n'ihu; ‘Mgbe ahụ’ na-enye usoro akụkọ ahụ n'Igbo n'emeghị ka ọ bụrụ nnukwu mmegide.
- source_word: αὐτῇ
  choice: ya
  rationale: N'usoro ‘ọ sịrị ya,’ ‘ya’ na-egosi nwanyị ahụ a gwara okwu n'ụzọ Igbo na-adịkarị.
- source_word: Ἀφέωνταί
  choice: A gbagharala
  rationale: Ụdị perfect passive nke ἀφίημι na-egosi ihe e mezuru nke nsonaazụ ya ka dị. ‘A gbagharala’ na-egosipụta mmezu ahụ na ọnọdụ mgbaghara nke na-adịgide.
- source_word: σου
  choice: gị
  rationale: N'okwu Igbo ‘mmehie gị,’ ‘gị’ bụ nnọchiaha nwe nke onye nke abụọ.
- source_word: αἱ ἁμαρτίαι
  choice: mmehie
  rationale: ‘Mmehie’ bụ okwu Igbo kwesịrị ekwesị maka ἁμαρτίαι n'ọnọdụ mmejọ mmadụ n'ihu Chineke; nnọchiaha nwe ahụ emeela ka aha ahụ doo anya.
theological_decisions:
- issue: Ike perfect passive Ἀφέωνταί n'okwu nkwupụta mgbaghara
  choice: A gbagharala gị mmehie gị.
  alternative: Mmehie gị bụ ihe a gbagharala.
  rationale: Nhọrọ a na-edobe ma ihe e mezuru ma nsonaazụ ya nke ka dị, n'etinyeghị nkọwa ọzọ banyere oge ma ọ bụ onye mere mgbaghara. Ọ na-ahapụ ịdị arọ na mgbagwoju anya nke passive ahụ ka ha dị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke dị ugwu ma dị mfe nghọta. E jiri ‘A gbagharala’ chekwaa perfect passive ahụ n'ụzọ na-ada nke ọma n'Igbo, ebe e tinyere ụzọ ọzọ n'ala ala peeji iji gosipụta ọnọdụ na-adịgide.
