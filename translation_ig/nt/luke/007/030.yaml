  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: ig
  text: Ma ndị Farisii na ndị ọkachamara n’Iwu jụrụ nzube Chineke maka onwe ha[a], n’ịbụ ndị ọ na-emebeghị baptizim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndụmọdụ Chineke megide onwe ha,” ma ọ bụ “atụmatụ Chineke banyere ha.”
    reason: alternative_reading
  - marker: b
    text: Ya bụ, Jọn Onye Na-eme Baptizim.
    reason: cross_reference
lexical_decisions:
- source_word: νομικοὶ
  choice: ndị ọkachamara n’Iwu
  rationale: Okwu a na-ezo aka ná ndị maara Iwu Mosis nke ọma. Nhọrọ a doro ndị na-agụ Igbo anya ma zere ịkpọ ha ndị ọka iwu nke oge a ma ọ bụ ndị odeakwụkwọ.
- source_word: βουλὴν
  choice: nzube
  rationale: “Nzube” na-egosi ebumnuche ma ọ bụ atụmatụ Chineke n’asụsụ Igbo dị ugbu a, n’enweghị ịkọwa ya dị ka naanị ndụmọdụ.
- source_word: ἠθέτησαν
  choice: jụrụ
  rationale: “Jụrụ” na-egosi na ha anabataghị ma wezuga nzube ahụ; ọ bụ okwu dị mfe ma kwụ ọtọ.
- source_word: εἰς ἑαυτούς
  choice: maka onwe ha
  rationale: Nhọrọ a na-egosi na nzube Chineke metụtara ha onwe ha, ma hapụkwa ohere maka nghọta ọzọ e depụtara n’ala peeji.
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: ebe ha na-anabataghị baptizim n’aka ya
  rationale: 'Nke a na-asụpụta ihe participle passive ahụ pụtara n’Igbo nkịtị: ha enwetaghị baptizim o mere. “Ebe” anaghị ekwusi ike ókè ma okwu ahụ na-egosi ihe kpatara ya, ọnọdụ ya, ma ọ bụ ihe so ya mee.'
- source_word: αὐτοῦ
  choice: ya
  rationale: A hapụrụ nnọchiaha ahụ dịka ọ dị na Grik; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jọn Onye Na-eme Baptizim.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ọdịiche dị n’etiti omume ndị a na nke ndị a kpọrọ aha n’amaokwu bu ụzọ.
theological_decisions:
- issue: Ihe βουλή Chineke pụtara n’ihe metụtara ndị Farisii na ndị ọkachamara n’Iwu
  choice: nzube Chineke maka onwe ha
  alternative: ndụmọdụ Chineke megide onwe ha; atụmatụ Chineke banyere ha
  rationale: Nsụgharị a na-egosi na ha jụrụ ihe Chineke zubere banyere ha, ma ọ naghị edozi esemokwu nkà mmụta okpukpe banyere otú nzube Chineke si metụta nzaghachi mmadụ.
translation_notes:
  register: E ji Standard Igbo nke dị ùgwù ma dị mfe nghọta mee ihe. E dere “Iwu” na mkpụrụedemede ukwu iji gosi Iwu Mosis. E debere akara ala peeji [a] n’akụkụ ahịrịokwu nwere nghọta dị iche iche, tinyeekwa [b] n’akụkụ nnọchiaha ọ na-akọwa.
