revisions:
- from: Ma ndị Farisii na ndị ọkachamara n’Iwu jụrụ nzube Chineke maka onwe ha[a], ebe ha na-anabataghị baptizim n’aka ya[b].
  to: Ma ndị Farisii na ndị ọkachamara n’Iwu jụrụ nzube Chineke maka onwe ha[a], n’ịbụ ndị ọ na-emebeghị baptizim[b].
  rationale: Only the participial clause is revised. The new wording represents the Greek aorist passive (‘not having been baptized by him’) rather than an ongoing refusal to accept baptism. It does not force the participle into a fully explicit causal clause.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:36:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'The principal clause accurately represents the contrast, the Pharisees, the legal experts, God''s purpose, and the personal reference of εἰς ἑαυτούς. The final clause in the draft, however, uses an imperfective active expression (''ha na-anabataghị baptizim'') that means they were not accepting baptism. The Greek has an aorist passive participle: they had not been baptized by John. The revision restores the completed passive sense while retaining the circumstantial, non-explicitly-causal relationship.'
  naturalness: ‘Ndị ọkachamara n’Iwu’ and ‘nzube Chineke maka onwe ha’ are clear, dignified Standard Igbo. ‘N’ịbụ ndị ọ na-emebeghị baptizim’ is an idiomatic enough formal biblical construction and correctly locates John as the agent.
  terminology: ‘Ndị Farisii,’ ‘Iwu,’ ‘nzube,’ and ‘baptizim’ are suitable. The footnote’s identification of the pronoun as Jọn Onye Na-eme Baptizim is appropriate. The alternative renderings retain the disputed nuance without requiring a theological conclusion.
  issues:
  - severity: medium
    issue: The rendering of μὴ βαπτισθέντες ὑπ’ αὐτοῦ is aspectually and syntactically inaccurate.
    rationale: ‘Ebe ha na-anabataghị baptizim n’aka ya’ is ongoing/imperfective and presents baptism as something they did not accept. μὴ βαπτισθέντες is passive and aorist, referring to their not having been baptized by him. A passive completed construction is needed.
  revised_text: Ma ndị Farisii na ndị ọkachamara n’Iwu jụrụ nzube Chineke maka onwe ha[a], n’ịbụ ndị ọ na-emebeghị baptizim[b].
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndụmọdụ Chineke megide onwe ha,” ma ọ bụ “atụmatụ Chineke banyere ha.”
    reason: alternative_reading
  - marker: b
    text: Ya bụ, Jọn Onye Na-eme Baptizim.
    reason: cross_reference
  revision_rationale: Only the participial clause is revised. The new wording represents the Greek aorist passive (‘not having been baptized by him’) rather than an ongoing refusal to accept baptism. It does not force the participle into a fully explicit causal clause.
