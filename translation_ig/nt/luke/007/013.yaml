source:
  edition: SBLGNT
  text: καὶ ἰδὼν αὐτὴν ὁ κύριος ἐσπλαγχνίσθη ἐπ’ αὐτῇ καὶ εἶπεν αὐτῇ· Μὴ κλαῖε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/013.yaml
  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: ig
  text: Mgbe Onyenwe anyị hụrụ ya, obi ebere mere ya n’ebe ọ nọ, ọ sị ya, “Akwala ákwá.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Kwụsị ịkwa ákwá.” Okwu Grik ahụ nwere ike ịpụta ma iwu izugbe ka ọ ghara ịkwa ákwá, ma ọ bụ iwu ka ọ kwụsị ịkwa ákwá ọ na-akwa ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Mgbe ... hụrụ
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; nkebiokwu oge a bụ Igbo ebumpụta ụwa ma na-echekwa usoro ihe omume ahụ.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: N’akụkọ Luk, okwu a bụ utu aha e ji akpọ Jizọs. “Onyenwe anyị” na-echekwa ịdị elu nke utu aha ahụ kama ime ya naanị “nna ukwu.”
- source_word: ἐσπλαγχνίσθη
  choice: ọmịiko miri emi mere ya
  rationale: Okwu Grik a na-egosi ọmịiko siri ike nke na-emetụ mmadụ n’ime obi; ntụgharị a na-echekwa ịdị omimi nke mmetụta ahụ n’Igbo doro anya.
- source_word: ἐπ’ αὐτῇ
  choice: n’ebe ọ nọ
  rationale: Ya na ngwaa a, ἐπί tinyere dative na-egosi onye ọmịiko ahụ chere ihu; “n’ebe ọ nọ” bụ ụzọ Igbo si egosipụta nke a n’enweghị mgbagwoju anya.
- source_word: εἶπεν αὐτῇ
  choice: ọ sị ya
  rationale: Nke a bụ ntụgharị Igbo dị nkenke ma bụrụ nke ebumpụta ụwa maka “ọ gwara ya/ọ sị ya,” na-agbasoghị ihe karịrị λέγω.
- source_word: Μὴ κλαῖε
  choice: Akwala ákwá
  rationale: Nke a na-echekwa isi ihe κλαίω pụtara, ma ọ naghị ekpebi n’ike ma iwu ahụ bụ nke izugbe ka ọ bụ ka ọ kwụsị ịkwa ákwá ọ na-akwa ugbu a.
theological_decisions:
- issue: Ntugharị κύριος dị ka utu aha Jizọs
  choice: Onyenwe anyị
  alternative: nna ukwu
  rationale: “Onyenwe anyị” na-echekwa otu Luk si bulie Jizọs elu site n’utu aha a, ma ọ naghị etinye nkọwa ozizi ọzọ n’ihe odide ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro akụkọ Grik n’ụzọ ebumpụta ụwa, ma na-ahapụ nghọtahie ziri ezi dị n’ụdị iwu Μὴ κλαῖε ka ọ dị.
