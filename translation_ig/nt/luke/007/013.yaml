- from: Mgbe Onyenwe anyị hụrụ ya, ọmịiko miri emi mere ya n’ebe ọ nọ, ọ sị ya, “Akwala ákwá.”[a]
  to: Mgbe Onyenwe anyị hụrụ ya, obi ebere mere ya n’ebe ọ nọ, ọ sị ya, “Akwala ákwá.”[a]
  rationale: The revision replaces a somewhat unnatural expression for compassion with an idiomatic Standard Igbo formulation while retaining the source’s focus on the woman and preserving the Greek imperative’s unresolved general-versus-current-action nuance. No doctrinal expansion is introduced.
