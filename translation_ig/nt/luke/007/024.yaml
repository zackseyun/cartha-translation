- from: 'Mgbe ndị ozi Jọn lawara, ọ malitere ịgwa ìgwè mmadụ okwu banyere Jọn, sị: “Gịnị ka unu pụrụ gaa n’ọzara ile anya[a]? Ọ̀ bụ ahịhịa amị nke ifufe na-efufegharị?”'
  to: 'Mgbe ndị ozi Jọn lawara, ọ malitere ịgwa ìgwè mmadụ okwu banyere Jọn, sị: “Gịnị ka unu gara n’ọzara ile anya[a]? Ọ̀ bụ ahịhịa amị nke ifufe na-eme ka ọ na-ama jijiji?”'
