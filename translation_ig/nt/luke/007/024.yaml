id: LUK.7.24
reference: Luke 7:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: ig
  text: 'Mgbe ndị ozi Jọn lawara, ọ malitere ịgwa ìgwè mmadụ okwu banyere Jọn, sị: “Gịnị ka unu gara n’ọzara ile anya[a]? Ọ̀ bụ ahịhịa amị nke ifufe na-eme ka ọ na-ama jijiji?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ịhụ” ma ọ bụ “ịhụ nke ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: Mgbe ... lawara
  rationale: 'Nkebi a dị na genitive absolute na-egosi oge: ndị ozi ahụ buru ụzọ lawa tupu Jizọs amalite ikwu okwu.'
- source_word: ἀγγέλων
  choice: ndị ozi
  rationale: N’ebe a okwu ahụ pụtara ndị mmadụ Jọn zitere, ọ bụghị ndị mmụọ ozi si n’eluigwe.
- source_word: Ἰωάννου
  choice: Jọn
  rationale: Aha a na-egosi ma onye zitere ndị ozi ahụ ma onye Jizọs kwuru banyere ya.
- source_word: ἤρξατο λέγειν
  choice: ọ malitere ịgwa ... okwu
  rationale: Nke a na-echekwa echiche nke ịmalite okwu ma na-ada n’ụzọ Igbo nkịtị mgbe a na-agwa ìgwè mmadụ okwu.
- source_word: πρὸς τοὺς ὄχλους
  choice: ịgwa ìgwè mmadụ okwu
  rationale: Ọ na-egosi ndị Jizọs tụgharịrị gwa okwu; aha Grik ahụ dị n’ọnụọgụ ọtụtụ, ebe Igbo ‘ìgwè mmadụ’ na-anọchi ọtụtụ ndị n’ụzọ ebumpụta ụwa.
- source_word: περὶ Ἰωάννου
  choice: banyere Jọn
  rationale: Nke a bụ ụzọ Igbo doro anya si kwuo na Jọn bụ isiokwu okwu ahụ.
- source_word: Τί ἐξήλθατε
  choice: Gịnị ka unu pụrụ gaa
  rationale: Ajụjụ τί na-ajụ ihe ha gara ịhụ, ọ bụghị nanị ihe mere ha ji gaa; ‘pụrụ gaa’ na-egosi ịpụ gaa ebe ahụ.
- source_word: εἰς τὴν ἔρημον
  choice: n’ọzara
  rationale: ‘Ọzara’ na-egosi ebe mmadụ na-ebighị nke ukwuu nke metụtara ozi Jọn, na-enweghị ịmanye echiche nke ala aja nkịtị.
- source_word: θεάσασθαι
  choice: ile anya
  rationale: Ngwaa ahụ nwere echiche nke ile ihe anya nke ọma; a debere ụzọ ndị ọzọ nwere ike isi ghọta ya na ndetu ala peeji.
- source_word: κάλαμον
  choice: ahịhịa amị
  rationale: Nke a na-akọwa osisi amị ahụ n'ụzọ onye Igbo nkịtị ga-aghọta ma na-echekwa ihe atụ nke ihe na-adị mfe ifufe ibugharị.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: nke ifufe na-efufegharị
  rationale: Okwu a na-enye onyinyo amị ifufe na-eme ka ọ na-agagharị n’otu akụkụ gaa n’ọzọ, ma na-echekwa ike nke ajụjụ ahụ.
theological_decisions:
- issue: Ihe atụ dị n’ajụjụ banyere Jọn
  choice: 'E debere onyinyo nkịtị ahụ: “Ọ̀ bụ ahịhịa amị nke ifufe na-efufegharị?”'
  alternative: Ịkọwa ya ozugbo dị ka nwoke na-adịghị eguzosi ike ma ọ bụ onye na-agbanwe obi ugboro ugboro.
  rationale: Ihe odide ahụ n’onwe ya nyere ihe atụ ahụ ma hapụ ndị na-ege ntị ka ha ghọta ihe ọ pụtara. Ịghara ịkọwa ya n’ime amaokwu na-echekwa nghọta na nrụgide nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ajụjụ nkwugharị na ihe atụ nke amị n’enweghị itinye nkọwa otu ụka ma ọ bụ ịkọwapụta ihe odide ahụ karịa ihe Grik kwuru.
