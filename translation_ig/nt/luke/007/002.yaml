id: LUK.7.2
reference: Luke 7:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: ig
  text: Otu ohu nke otu onyeisi ndị agha na-achị otu narị ndị agha na-arịa ọrịa; ọ fọrọ nke nta ka ọ nwụọ, onyeisi ahụ jikwa ya kpọrọ ihe nke ukwuu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: nke otu onyeisi ndị agha na-achị otu narị ndị agha
  rationale: Nke a na-egosi na ohu ahụ bụ nke otu onyeisi agha a na-akpọghị aha, ma na-akọwakwa ọrụ ἑκατοντάρχης n'ụzọ onye Igbo nke oge a ga-aghọta.
- source_word: δέ
  choice: (a sụgharịghị ya iche)
  rationale: δέ bụ njikọ akụkọ dị nro. N’amaokwu a, itinye “ma” nwere ike iweta echiche nke mmegide nke na-adịghị n’asụsụ Grik; usoro akụkọ Igbo na-eburu njikọ ahụ nke ọma n’enweghị okwu pụrụ iche.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-echekwa mmekọrịta nke ịbụ onye nọ n’okpuru ikike ma bụrụkwa ihe onwunwe nke onyeisi agha ahụ, nke δοῦλος na-egosi n’ọnọdụ a.
- source_word: κακῶς ἔχων
  choice: na-arịa ọrịa
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji ekwu na mmadụ nọ n’ọnọdụ ọrịa.
- source_word: ἤμελλεν τελευτᾶν
  choice: ọ nọkwa n’ọnụ ọnwụ
  rationale: Akpaalaokwu Igbo a na-egosi na ọnwụ ya dị nso, dịka μέλλω tinyere τελευτᾶν si egosi.
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: Onyeisi ndị agha ahụ jikwa ya kpọrọ ihe nke ukwuu
  rationale: Nke a na-egosi ịdị oke ọnụ ahịa na nsọpụrụ ohu ahụ nwere n’anya onyeisi agha ahụ, n’etinyeghị echiche mmetụta ịhụnanya nke okwu Grik na-ekwughị kpọmkwem.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ọnọdụ ịgba ohu n’ezinụlọ
  choice: ohu
  alternative: onye na-eje ozi
  rationale: N’ọnọdụ mmekọrịta nke narị afọ mbụ a, δοῦλος gụnyere ịdị n’okpuru ikike onye nwe ya. “Ohu” na-echekwa akụkụ ahụ; e debere “onye na-eje ozi” n’ala peeji dịka ụzọ ọzọ e nwere ike isi ghọta okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ugwu. E kewara ahịrịokwu Grik ahụ ụzọ abụọ ka ọ bụrụ Igbo a na-agụ nke ọma, ma e chekwara na ọrịa ahụ na ọnwụ dị nso nakwa na onyeisi agha ahụ ji ohu ya kpọrọ ihe.
