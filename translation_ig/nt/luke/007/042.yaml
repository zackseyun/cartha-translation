  text: μὴ ⸀ἐχόντων αὐτῶν ἀποδοῦναι ἀμφοτέροις ἐχαρίσατο. τίς οὖν ⸀αὐτῶν πλεῖον ⸂ἀγαπήσει αὐτόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: ig
  text: Ebe ọ bụ na ha enweghị ihe ha ga-eji kwụọ ụgwọ, o ji amara gbaghara ha abụọ[a]. Ya mere, ònye n’ime ha ga-ahụ ya n’anya karịa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ kagburu ụgwọ ha abụọ.” Okwu Grik ahụ nwere ike ịpụta inye n’efu ma ọ bụ ịgbaghara ụgwọ mmadụ ji.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: Ebe ọ bụ na ha enweghị ihe ha ga-eji kwụọ ụgwọ ahụ
  rationale: 'Nkebiokwu a na-egosi ọnọdụ na ihe kpatara ya: ha enweghị ike ma ọ bụ ihe ha ga-eji kwụghachi ụgwọ. Nsụgharị a bụ Igbo dị mfe ma doo anya n’ọnọdụ ụgwọ ego.'
- source_word: ἀμφοτέροις
  choice: ha abụọ
  rationale: Ọ na-ezo aka kpọmkwem n’ebe ndị ji ụgwọ abụọ ahụ nọ.
- source_word: ἐχαρίσατο
  choice: o ji amara gbaghara
  rationale: Okwu Grik a nwere echiche nke inye n’efu, imere amara, ma ọ bụ ịhapụ ihe mmadụ ji n’ụgwọ. ‘Ji amara gbaghara’ na-edobe ma echiche amara ma echiche mgbaghara ụgwọ n’akụkọ a.
- source_word: τίς οὖν αὐτῶν
  choice: Ya mere, ònye n’ime ha
  rationale: ‘Ya mere’ na-egosi nkwubi okwu ajụjụ ahụ sitere n’ihe e kwuru tupu ya.
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: ga-ahụ ya n’anya karịa
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta ịhụ mmadụ n’anya karịa onye ọzọ, ma na-edobe ọdịdị ọdịnihu nke ngwaa Grik.
theological_decisions:
- issue: Otú e si sụgharịa χαρίζομαι n’ilu gbasara ụgwọ na mgbaghara
  choice: o ji amara gbaghara ha abụọ
  alternative: ọ kagburu ụgwọ ha abụọ
  rationale: Ọnọdụ ahụ bụ nke ụgwọ ego, ma okwu Grik ahụ nwekwara echiche nke imere amara na ịgbaghara. Isi nsụgharị ahụ na-edobe akụkụ abụọ a; nkọwa ala peeji na-enye nsụgharị ego kpọmkwem karịa n’enweghị ịkwụsị nghọta ahụ n’otu ụzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ịkwụ ụgwọ ahụ’ dabara n’ọnọdụ ndị ji ụgwọ, ebe ‘iji amara gbaghara’ na-echekwa obosara echiche nke okwu Grik.
