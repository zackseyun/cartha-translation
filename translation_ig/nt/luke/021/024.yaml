reference: Luke 21:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: ig
  text: Ha ga-ada n’ọnụ mma agha, a ga-akpọrọkwa ha gaa n’etiti mba niile dị ka ndị a dọtara n’agha.[a] Jerusalem ga-adịkwa n’okpuru ịzọ ụkwụ nke mba[b] ruo mgbe oge mba ga-ezu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gaa n’etiti ndị mba ọzọ niile,” ya bụ, ndị na-abụghị ndị Juu. Okwu Grik ἔθνη nwere ike ịpụta “mba” ma ọ bụ “ndị mba ọzọ,” dabere n’ọnọdụ okwu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Jerusalem ga-adị n’okpuru ịzọ ụkwụ nke ndị mba ọzọ.”
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya, “ruo mgbe oge ndị mba ọzọ ga-ezu.”
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: Ha ga-ada
  rationale: “Ịda” na ọnọdụ agha na-egosi ịnwụ n’agha, ma ọ naghị akọwafe ihe okwu Grik kwuru.
- source_word: στόματι μαχαίρης
  choice: n’ọnụ mma agha
  rationale: Nke a na-edobe ihe atụ doro anya nke okwu Grik, “ọnụ mma agha,” nke pụtara akụkụ mma agha na-egbu mmadụ.
- source_word: αἰχμαλωτισθήσονται
  choice: a ga-adọrọkwa ha n’agha
  rationale: Ọ na-egosi na a ga-ejide ha dị ka ndị mkpọrọ agha ma kpọpụ ha, ma na-edobekwa ọdịdị passive nke okwu Grik.
- source_word: εἰς τὰ ἔθνη πάντα
  choice: gaa n’etiti mba niile
  rationale: “Gaa n’etiti” na-egosi mmegharị ruo n’etiti mba dị iche iche; “mba” na-edobekwa obosara ihe ἔθνη nwere ike ịpụta.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Aha obodo a a na-ejikarị eme ihe n’Igbo.
- source_word: πατουμένη ὑπὸ ἐθνῶν
  choice: Mba dị iche iche ga-azọda Jerusalem ụkwụ
  rationale: Nhazi a bụ Igbo sitere n’okike, na-edobe ihe atụ nke ịzọda obodo ụkwụ nakwa echiche nke mmegbu na ọchịchị ndị ọzọ.
- source_word: ἄχρι οὗ
  choice: ruo mgbe
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi njedebe oge nke njikọ Grik a na-egosi.
- source_word: πληρωθῶσιν
  choice: ga-ezu
  rationale: “Ga-ezu” nwere ike ịpụta na oge ahụ ga-eru oke ya ma ọ bụ mezuo, n’emeghị ka otu nkọwa gbasara ọgwụgwụ ụwa bụrụ iwu.
- source_word: καιροὶ ἐθνῶν
  choice: oge ndị e nyere mba dị iche iche
  rationale: καιροί bụ oge pụrụ iche ma ọ bụ oge a kara aka, ọ bụghị naanị ogologo oge. “Ndị e nyere” na-eme ka echiche ahụ doo anya n’Igbo ma hapụ onye nyere ha na kpọmkwem ihe oge ahụ bụ n’ebughị ụzọ kọwaa ya.
theological_decisions:
- issue: Ihe ἔθνη pụtara n’amaokwu a
  choice: mba / mba dị iche iche
  alternative: ndị mba ọzọ, ya bụ, ndị na-abụghị ndị Juu
  rationale: Otu okwu Grik ahụ pụtara ugboro atọ. Iji “mba” eme ihe n’ebe atọ ahụ na-edobe njikọ okwu ahụ ma ghara ikpebi ma ihe e mesiri ike bụ mba ndọrọ ndọrọ ọchịchị ka ọ bụ ndị na-abụghị ndị Juu. E tinyere nkọwa nke ọzọ n’ala ala peeji.
- issue: Ihe καιροὶ ἐθνῶν pụtara
  choice: oge ndị e nyere mba dị iche iche ga-ezu
  alternative: oge ndị mba ọzọ ga-emezu
  rationale: Nsụgharị a na-egosi na oge ahụ nwere oke, ma ọ naghị etinye usoro nkọwa ọ bụla pụrụ iche banyere ihe ga-eme n’ọgwụgwụ ụwa.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta, dee ya. E debere ihe atụ “ọnụ mma agha” na “ịzọda ụkwụ,” ma hazie ahịrịokwu ndị ahụ ka ha bụrụ okwu Igbo sitere n’okike. A kọwara ọdịiche dị n’etiti “mba” na “ndị mba ọzọ” n’ala ala peeji iji chekwaa mgbagwoju anya dị n’okwu Grik.
