revisions:
- from: Ha ga-ada n’ọnụ mma agha, a ga-adọrọkwa ha n’agha gaa n’etiti mba niile.[a] Mba dị iche iche ga-azọda Jerusalem ụkwụ[b] ruo mgbe oge ndị e nyere mba dị iche iche ga-ezu.[c]
  to: Ha ga-ada n’ọnụ mma agha, a ga-akpọrọkwa ha gaa n’etiti mba niile dị ka ndị a dọtara n’agha.[a] Jerusalem ga-adịkwa n’okpuru ịzọ ụkwụ nke mba[b] ruo mgbe oge mba ga-ezu.[c]
  rationale: The revision clarifies that the people are carried away as captives, preserves the ongoing future sense of Jerusalem’s trampling, removes the additional idea that the nations’ times were “given” to them, and represents ἔθνη consistently as “mba.” No theological timetable is implied.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:31Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the verse’s sequence and core imagery. However, “a ga-adọrọkwa ha n’agha” does not clearly express being taken away as captives, and “oge ndị e nyere mba dị iche iche” adds an unstated notion of times being given to the nations. The revision renders the passive captivity and the genitive phrase more directly while retaining its interpretive openness.
  naturalness: “A ga-akpọrọ ha gaa dị ka ndị a dọtara n’agha” is clear, idiomatic Standard Igbo for deportation as captives. “Jerusalem ga-adịkwa n’okpuru ịzọ ụkwụ nke mba” naturally conveys the continuing future state expressed by the Greek periphrastic construction.
  terminology: “Mba” is used consistently for ἔθνη in the text. The footnotes retain “ndị mba ọzọ” as a contextual alternative without making that interpretation primary. “Oge mba” maintains the source’s compact and somewhat open genitive relation.
  issues:
  - severity: medium
    issue: The phrase “a ga-adọrọkwa ha n’agha gaa” is ambiguous.
    rationale: It can be heard as dragging them in a war rather than taking them away as prisoners/captives. The passive αἰχμαλωτισθήσονται includes captivity and removal.
  - severity: medium
    issue: “oge ndị e nyere mba dị iche iche” introduces “given to.”
    rationale: καὶροὶ ἐθνῶν says literally “times of the nations”; while καιροί may imply appointed times, the Greek does not state that these times were given to the nations. The added wording narrows the phrase unnecessarily.
  - severity: low
    issue: The three occurrences of ἔθνη are not represented with fully consistent wording.
    rationale: The draft alternates between “mba,” “mba dị iche iche,” and a longer possessive expression. Using “mba” throughout better preserves the repeated Greek term and its ambiguity.
  revised_text: Ha ga-ada n’ọnụ mma agha, a ga-akpọrọkwa ha gaa n’etiti mba niile dị ka ndị a dọtara n’agha.[a] Jerusalem ga-adịkwa n’okpuru ịzọ ụkwụ nke mba[b] ruo mgbe oge mba ga-ezu.[c]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gaa n’etiti ndị mba ọzọ niile,” ya bụ, ndị na-abụghị ndị Juu. Okwu Grik ἔθνη nwere ike ịpụta “mba” ma ọ bụ “ndị mba ọzọ,” dabere n’ọnọdụ okwu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Jerusalem ga-adị n’okpuru ịzọ ụkwụ nke ndị mba ọzọ.”
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya, “ruo mgbe oge ndị mba ọzọ ga-ezu.”
    reason: alternative_reading
  revision_rationale: The revision clarifies that the people are carried away as captives, preserves the ongoing future sense of Jerusalem’s trampling, removes the additional idea that the nations’ times were “given” to them, and represents ἔθνη consistently as “mba.” No theological timetable is implied.
