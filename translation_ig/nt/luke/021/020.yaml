  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: ig
  text: Ma mgbe unu hụrụ ka ndị agha na-agba Jerusalem gburugburu[a], maranụ mgbe ahụ na mbibi Jerusalem abịaruola nso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Jerusalem ka ogige ndị agha gbara gburugburu.” Okwu Grik ahụ nwere ike ịpụta ogige ndị agha ma ọ bụ ndị agha mara ụlọikwuu; n’ebe a, ọ na-ezo aka n’ìgwè ndị agha nọchibidoro Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: “Mbibi” na-echetara asụsụ ndị amụma ji ekwu banyere ikpe; tụlee okwu yiri nke a na Matiu 24:15 na Mak 13:14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi ihe a ga-ahụ n’ọdịnihu, ebe “Ma” na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’ihe a na-ekwu.
- source_word: ἴδητε
  choice: unu hụrụ
  rationale: Ọ bụ okwu e nyere ọtụtụ ndị; ụdị a bụ ụzọ Igbo nkịtị si ekwu ọnọdụ ga-eme n’ọdịnihu.
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: ndị agha ka ha gbara ... gburugburu
  rationale: Nke a na-egosi Jerusalem nọ n’etiti ndị agha gbara ya gburugburu. στρατόπεδον nwere ike ịpụta ogige agha ma ọ bụ ndị agha nọ n’ogige; n’ebe a, ihe a na-ekwu bụ ndị agha nọchibidoro obodo ahụ.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: E debere aha obodo ahụ n’ụdị a maara nke ọma n’Igbo.
- source_word: τότε γνῶτε
  choice: maranụ mgbe ahụ
  rationale: “Maranụ” na-edobe ike iwu nke γνῶτε, “mgbe ahụ” ana-edobekwa usoro oge nke τότε.
- source_word: ἤγγικεν
  choice: eruola nso
  rationale: Nke a na-egosi na ihe ahụ abịaruola nso ma nọkwa nso ugbu a, dịka perfect tense Grik si egosi.
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: ịtọgbọrọ n’efu nke Jerusalem
  rationale: Nhọrọ a na-edobe echiche nke ime ka obodo ghọọ ebe tọgbọrọ n’efu, ma ọ naghị akọwa ya nanị dị ka mbibi ma ọ bụ tinye usoro nkọwa gbasara ihe ndị ga-eme n’ọgwụgwụ ụwa.
theological_decisions:
- issue: Ihe mbibi Jerusalem na-abịanụ pụtara
  choice: A sụgharịrị ἐρήμωσις dịka “ịtọgbọrọ n’efu” n’enweghị ịkọwapụta usoro nkọwa ọzọ.
  alternative: Ịsụgharị ya dịka “mbibi,” ma ọ bụ ijikọ ya kpọmkwem n’ahịrịokwu ahụ na “ihe arụ nke na-eme ka ebe tọgbọrọ n’efu.”
  rationale: Amaokwu a n’onwe ya kwuru na ịtọgbọrọ Jerusalem n’efu na-eru nso mgbe ndị agha gbara ya gburugburu. Nhọrọ a na-edobe ụda amụma banyere ikpe Chineke n’etinyeghị nkọwa nke amaokwu ahụ na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma nwee nsọpụrụ. “Unu” na-egosi na a na-agwa ọtụtụ ndị okwu; “maranụ” na-edobe iwu ahụ n’ụzọ eke. E kwughachiri “Jerusalem” kama iji nnọchiaha na-edochaghị anya, ka ahịrịokwu ahụ doo ndị na-agụ ya anya.
