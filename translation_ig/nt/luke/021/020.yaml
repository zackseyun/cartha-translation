    reason: lexical_alternative
  - marker: b
    text: “Mbibi” na-echetara asụsụ ndị amụma ji ekwu banyere ikpe; tụlee okwu yiri nke a na Matiu 24:15 na Mak 13:14.
    reason: cross_reference
