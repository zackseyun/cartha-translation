revisions:
- from: Ma mgbe unu hụrụ ndị agha ka ha gbara Jerusalem gburugburu[a], maranụ mgbe ahụ na ịtọgbọrọ n’efu nke Jerusalem[b] eruola nso.
  to: Ma mgbe unu hụrụ ka ndị agha na-agba Jerusalem gburugburu[a], maranụ mgbe ahụ na mbibi Jerusalem abịaruola nso.[b]
  rationale: 'The revised wording retains all the source’s principal features: a future contingency (“mgbe”), Jerusalem being surrounded by military forces, the plural imperative (“maranụ”), and the perfect-result sense of ἤγγικεν (“abịaruola nso”). It also makes the Igbo idiomatic and preserves the source’s restrained reference to Jerusalem’s coming devastation without imposing a particular interpretive scheme.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the future sign, the imperative to recognize it, and the perfect sense that Jerusalem’s devastation has drawn near. However, “ndị agha ka ha gbara Jerusalem gburugburu” is syntactically cumbersome and does not clearly retain the participle’s ongoing ‘being surrounded’ sense. “Ịtọgbọrọ n’efu nke Jerusalem” is intelligible but is not idiomatic Standard Igbo for ἐρήμωσις in this context.
  naturalness: Revision uses a natural progressive construction for the siege scene and the more idiomatic noun “mbibi” for the city’s impending devastation. The wording remains suitably formal and clear for Scripture.
  terminology: “Mbibi” accurately represents ἐρήμωσις here without importing an eschatological interpretation. The footnote retains the prophetic resonance and identifies the lexical possibility that στρατόπεδα denotes military camps/encampments.
  issues:
  - severity: medium
    issue: Awkward and less precise rendering of κυκλουμένην
    rationale: “Ndị agha ka ha gbara Jerusalem gburugburu” is awkward in Standard Igbo and sounds more like a completed action. “Ka ndị agha na-agba Jerusalem gburugburu” naturally expresses Jerusalem in the process of being surrounded.
  - severity: medium
    issue: Unnatural rendering of ἐρήμωσις
    rationale: “Ịtọgbọrọ n’efu nke Jerusalem” is structurally possible but unnatural as the designation of a city’s devastation. “Mbibi Jerusalem” is idiomatic and faithfully conveys the approaching devastation, while the note can preserve the prophetic resonance.
  - severity: low
    issue: Footnote b has unnatural phrasing
    rationale: “Na-emegharị asụsụ” is not the most natural way to express an echo/allusion in Igbo. “Na-echetara asụsụ ndị amụma” is clearer and does not assert more than the source warrants.
  revised_text: Ma mgbe unu hụrụ ka ndị agha na-agba Jerusalem gburugburu[a], maranụ mgbe ahụ na mbibi Jerusalem abịaruola nso.[b]
  revised_footnotes:
