id: LUK.21.23
reference: Luke 21:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: ig
  text: Ahụhụ ga-adịrị ndị inyom dị ime na ndị inyom na-enye ụmụ ọhụrụ ara n’ụbọchị ndị ahụ! N’ihi na oke mkpagbu ga-adakwasị ala ahụ[a], ọnụma ga-adakwasịkwa ndị mmadụ a[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụwa.” Okwu Grik γῆ nwere ike ịpụta “ala” ma ọ bụ “ụwa”; a họọrọ “ala ahụ” n’ihi na okwu ndị gbara ya gburugburu lekwasịrị anya ná Jerusalem na Judia.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọnụma ga-adịkwara ndị mmadụ a” ma ọ bụ “ọnụma ga-adị n’ahụ ndị mmadụ a.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: Ahụhụ ga-adịrị
  rationale: Na-enye mkpu amụma nke iru újú na ikpe n’Igbo dị ugbu a, n’enweghị ime ka ọ bụrụ naanị mwute dị nro.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: ndị inyom dị ime
  rationale: Ọ bụ ụzọ Igbo nkịtị ma doo anya isi kwuo ndị bu nwa n’afọ.
- source_word: ταῖς θηλαζούσαις
  choice: ndị na-enye ụmụ ọhụrụ ara
  rationale: Na-eme ka ihe ngwaa ahụ na-ezo aka na ya pụta ìhè, ma na-echekwa echiche banyere ndị nne na-enye nwa ara.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: n’ụbọchị ndị ahụ
  rationale: Nsụgharị oge dị mfe, eke, ma dịkwa nso n’usoro Grik.
- source_word: ἀνάγκη μεγάλη
  choice: oke mkpagbu
  rationale: N’ọnọdụ ọdachi a, okwu ahụ pụtara nhụjuanya ma ọ bụ nsogbu siri ike karịa naanị mkpa.
- source_word: ἐπὶ τῆς γῆς
  choice: ga-adakwasị ala ahụ
  rationale: ‘Ala ahụ’ dabara n’ọnọdụ gbara Jerusalem na Judia gburugburu; ngwaa ‘ga-adakwasị’ na-egosikwa ike nke ἐπί n’Igbo eke.
- source_word: ὀργὴ
  choice: ọnụma
  rationale: Na-echekwa ịdị arọ nke iwe ikpe na-abịa n’etinyeghị ‘nke Chineke,’ nke na-adịghị n’amaokwu Grik.
- source_word: τῷ λαῷ τούτῳ
  choice: ga-adakwasịkwa ndị a
  rationale: Na-egosi ndị ọnụma ahụ metụtara ma na-echekwa ike nke okwu nrụtụaka τούτῳ; ‘ndị a’ bụ Igbo eke maka otu ndị a na-ekwu maka ha.
theological_decisions:
- issue: Ihe γῆ na ‘ndị a’ na-ezo aka na ya na ókè ya
  choice: ‘Ala ahụ’ na-egosi n’ụzọ bụ isi ala Judia/Izrel n’ọnọdụ okwu banyere Jerusalem.
  alternative: ‘Ụwa’ nke ga-egosi mmadụ niile ma ọ bụ ụwa dum.
  rationale: Ihe ndị gbara amaokwu a gburugburu lekwasịrị anya ná Jerusalem, Judia, na ndị bi n’ebe ahụ. A na-edebe ihe ọzọ okwu Grik nwere ike ịpụta n’ihe odide ala peeji.
- issue: Ụdị ὀργή
  choice: A sụgharịrị ya ‘ọnụma’ n’etinyeghị onye nwe ọnụma ahụ.
  alternative: ‘Ọnụma Chineke’ ma ọ bụ ‘ikpe.’
  rationale: Ọ bụ ezie na ọnọdụ ahụ nwere ike igosi ọnụma Chineke, Grik ekwughị kpọmkwem ‘Chineke’; ya mere, nsụgharị ahụ echekwala esemokwu nkà mmụta okpukpe ahụ.
- issue: Dative τῷ λαῷ τούτῳ
  choice: ‘ga-adakwasịkwa ndị a,’ nke na-egosi na ọnụma ahụ na-emetụta ha.
  alternative: ‘ọnụma maka ndị a’ ma ọ bụ ‘ọnụma n’ahụ ndị a.’
  rationale: Dative ahụ nwere ike igosi ndị ihe ahụ metụtara; e jiri usoro Igbo eke mee ya, ma debe ụzọ nsụgharị ndị ọzọ n’ihe odide ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Ahụhụ ga-adịrị’ na-edobe ụda mkpu amụma; ‘oke mkpagbu’ na-egosi ịdị njọ nke ọdachi ahụ. E tinyeghị ‘Chineke’ dị ka onye nwe ọnụma ahụ n’ihi na isi mmalite Grik ekwughị ya kpọmkwem.
