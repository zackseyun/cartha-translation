review_pass:
  verdict: revise
  source_fidelity: The draft conveys the emphatic assertion, the plural addressees, the widow's poverty, the demonstrative force, and the comparative claim. However, the word order in “nwaanyị ogbenye a di ya nwụrụ” is structurally awkward and can initially be read as a sequence of separate assertions rather than as the single noun phrase “this poor widow.”
  naturalness: A clearer, natural Standard Igbo construction is “nwaanyị a di ya nwụrụ, bụ ogbenye,” which identifies her as a widow and preserves her poverty without ambiguity. Adding a comma after “unu” also improves spoken and written flow.
  terminology: “N’ezie,” “ana m agwa unu,” “nwaanyị di ya nwụrụ,” “ogbenye,” and “tinyere” are suitable modern Standard Igbo choices. The footnote should use a more idiomatic explanation and preserve the literal “cast/throw in” alternative.
  issues:
