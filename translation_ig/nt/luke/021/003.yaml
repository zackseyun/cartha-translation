  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: ig
  text: O wee sị, “N’ezie, ana m agwa unu na nwaanyị a di ya nwụrụ, bụ ogbenye, tinyere karịa ha niile.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “tụbara n’ime karịa ha niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀληθῶς
  choice: N’ezie
  rationale: Ọ na-egosi nkwupụta siri ike na nke a pụrụ ịtụkwasị obi, ma bụrụkwa okwu Igbo nke oge a na-ada nke ọma n’ọnụ Jizọs.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ na-echekwa onye na-ekwu okwu, ndị a na-agwa okwu n’ụdị ọtụtụ, na ike nkwupụta ahụ n’Igbo nkịtị.
- source_word: χήρα
  choice: nwaanyị ... di ya nwụrụ
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke ndị Igbo na-ejikarị akọwa nwaanyị di ya nwụrụ.
- source_word: πτωχή
  choice: ogbenye
  rationale: Ọ na-egosi ịda ogbenye n’enweghị ịgbakwunye ogo ịda ogbenye nke okwu Grik ahụ n’onwe ya akọwaghị kpọmkwem.
- source_word: αὕτη
  choice: a
  rationale: Ọ na-echekwa ike okwu ngosi ahụ, na-atụ aka kpọmkwem n’ebe nwaanyị ahụ nọ.
- source_word: πλεῖον
  choice: karịa
  rationale: Ọ na-enye ntụnyere nke okwu Grik ahụ n’ụzọ dị mkpirikpi ma kwekọọ n’Igbo.
- source_word: πάντων
  choice: ha niile
  rationale: Ọ na-ezo aka ná ndị ọzọ niile tinyere ihe n’ebe a na-edebe onyinye, ma hapụ ụdị ntụnyere ahụ ka ọ dị n’amaokwu ahụ.
- source_word: ἔβαλεν
  choice: tinyere
  rationale: N’ọnọdụ inye onyinye n’ụlọ nsọ, ‘tinyere’ bụ okwu Igbo doro anya na nke eke; nkọwa ala peeji na-echekwa echiche nkịtị nke ịtụba ihe n’ime.
theological_decisions:
- issue: Ntụnyere onyinye nwaanyị ahụ di ya nwụrụ na nke ndị ọzọ
  choice: “tinyere karịa ha niile”
  alternative: “tinyere karịa onye ọ bụla n’ime ha”
  rationale: πλεῖον πάντων nwere ike ịdị ka ntụnyere megide ndị ahụ niile. Nsụgharị a echekwaghị nkọwa amaokwu na-esote banyere ihe mere onyinye ya ji karịa, kama ọ hapụrụ nkwupụta Jizọs ka ọ kwụrụ onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “nwaanyị ogbenye a di ya nwụrụ” iji mee ka χήρα, πτωχή, na αὕτη pụta ìhè n’enweghị ịgbakwunye nkọwa na-adịghị n’amaokwu ahụ.
