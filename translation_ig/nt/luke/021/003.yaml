    issue: Awkward noun-phrase structure for “this poor widow”
    rationale: “nwaanyị ogbenye a di ya nwụrụ” is not the clearest Standard Igbo ordering for the combined attributes of widowhood, poverty, and demonstrative reference. Recasting it avoids syntactic ambiguity while retaining every source element.
  - severity: low
    issue: Footnote wording is unnecessarily cumbersome
    rationale: “n’ụzọ dabara n’okwu mbụ ahụ kpọmkwem karị” is less idiomatic than a simple literal-rendering label. A concise wording better serves a lexical-alternative footnote.
