  rationale: The revision retains the Greek sequence of emphatic declaration, direct address, identification of the particular poor widow, and her quantitatively greater contribution. It improves the Igbo syntax by expressing “widow” as “nwaanyị a di ya nwụrụ” and poverty as a nonrestrictive descriptive phrase, without adding the following verse’s explanation about proportion or sacrifice. The footnote continues to document the literal force of ἔβαλεν.
