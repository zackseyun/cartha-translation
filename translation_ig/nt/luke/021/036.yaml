revisions:
- from: Ma na-anọrịnụ na nche mgbe niile, na-ekpekwa ekpere ka unu nwee ike ịgbanahụ ihe ndị a niile na-aga ime[b], na iguzo n’ihu Nwa nke Mmadụ.[c][a]
  to: Ma, nọgidenụ na nche mgbe niile, na-ekpe ekpere ka unu nwee ike[a] ịgbanahụ ihe ndị a niile na-aga ime[b] ma guzo n’ihu Nwa nke Mmadụ.[c]
  rationale: The revision retains the source meaning and the intended theological restraint. It improves modern Standard Igbo idiom, coordinates “escape” and “stand” explicitly, repairs footnote placement, and supplies the full scope of the textual variant without changing the passage’s meaning.
