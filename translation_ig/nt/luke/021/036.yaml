  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: ig
  text: Ma, nọgidenụ na nche mgbe niile, na-ekpe ekpere ka unu nwee ike[a] ịgbanahụ ihe ndị a niile na-aga ime[b] ma guzo n’ihu Nwa nke Mmadụ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie na-agụ, “ka e were unu dị ka ndị kwesịrị ekwesị ịgbanahụ ihe ndị a niile ma guzo n’ihu Nwa nke Mmadụ,” kama, “ka unu nwee ike ịgbanahụ ihe ndị a niile ma guzo n’ihu Nwa nke Mmadụ.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “ihe ndị a niile gaje ime.”
    reason: lexical_alternative
  - marker: c
    text: Okwu bụ “iguzo n’ihu Nwa nke Mmadụ” pụrụ ịpụta iguzo dịka onye a nabatara ma ọ bụ onye a kwadoro n’ihu ya, ma Grik ekwughị nke a hoo haa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: na-anọrịnụ na nche
  rationale: Iwu a na-akpọ ndị na-ege ntị ka ha nọgide na-amụ anya ma na-elezi anya. Nkebi a bụ Igbo dị mfe ma debe ihe atụ nke ịnọ na nche.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ọdịiche ma ọ bụ ntụgharị site n’ịdọ aka ná ntị dị n’amaokwu bu ụzọ.
- source_word: ἐν παντὶ καιρῷ
  choice: mgbe niile
  rationale: Nke a bụ ụzọ Igbo si ekwu echiche nke ime ihe n’oge nile n’enweghị nkwụsị.
- source_word: δεόμενοι
  choice: na-ekpekwa ekpere
  rationale: Participle a na-ekwu maka ịrịọ arịrịọ n’ekpere; ntụgharị a na-egosipụta omume na-aga n’ihu ya na ịnọ na nche.
- source_word: ἵνα κατισχύσητε
  choice: ka unu nwee ike
  rationale: κατισχύω pụtara inwe ike zuru ezu ma ọ bụ imeri. Nhọrọ a na-ejikọta nke ọma na infinitive ‘ịgbanahụ’ ma ghara ịtụgharị ya dịka ịbụ ndị e weere na ha kwesiri ekwesi.
- source_word: ἐκφυγεῖν
  choice: ịgbanahụ
  rationale: Ọ na-egosi ịpụ n’ihe egwu ma ọ bụ izere ya; ‘ịgbanahụ’ bụ okwu Igbo doro anya n’ebe a.
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: ihe ndị a niile na-aga ime
  rationale: μέλλω na infinitive nwere ike igosi ihe na-abịa ma ọ bụ ihe fọrọ nke nta ka o mee. ‘Na-aga ime’ na-edebe futurity ahụ n’Igbo eke.
- source_word: σταθῆναι
  choice: iguzo
  rationale: A hapụrụ ihe oyiyi nke iguzo n’ihu onye ọzọ n’ụzọ kpọmkwem, n’etinyeghị echiche nnabata ma ọ bụ ikpe ziri ezi nke Grik na-ekwughị hoo haa.
- source_word: ἔμπροσθεν
  choice: n’ihu
  rationale: Ọ bụ okwu mmekọrịta ebe dị mfe, nke kwekọrọ na ‘before’ ma bụrụkwa Igbo eke.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edebe aha pụrụ iche ahụ na ndabere Semitic ya, dịka a na-eji ya n’Oziọma ndị ahụ.
theological_decisions:
- issue: Ihe κατισχύσητε pụtara n’ihe gbasara ntachi obi n’oge ikpeazụ
  choice: ka unu nwee ike
  alternative: ka e were unu na ndị kwesiri ekwesi
  rationale: SBLGNT nwere κατισχύσητε, nke na-ekwu maka ike ma ọ bụ imeri, ọ bụghị ịdị kwesiri ekwesi. E debere ọgụgụ ọzọ a maara nke ọma n’ala ala peeji kama itinye ya n’ahịrị bụ isi.
- issue: Ike okwu σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: iguzo n’ihu Nwa nke Mmadụ
  alternative: iguzo dịka ndị a nabatara n’ihu Nwa nke Mmadụ
  rationale: Ọ pụrụ ịgụnye echiche nke ịbụ onye a kwadoro n’ikpe ikpeazụ, ma Grik ekwughị nke ahụ hoo haa. Ya mere, ntụgharị ahụ na-edebe ihe oyiyi na mgbagwoju anya ya.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ ‘unu’ n’ihi na iwu Grik bụ plural. E debere ihe oyiyi nke ịmụ anya na iguzo n’ihu Nwa nke Mmadụ, ma e zere itinye nkọwa okpukpe nke ederede ahụ na-ekwughị kpọmkwem.
