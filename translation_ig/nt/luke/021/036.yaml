    rationale: 'Placing each marker beside its relevant expression makes the audit trail clear: the variant after “ka unu nwee ike,” the lexical alternative after “na-aga ime,” and the interpretive note after “Nwa nke Mmadụ.”'
  - severity: low
    issue: “na-anọrịnụ na nche” is less idiomatic as an imperative of ongoing vigilance.
    rationale: “Nọgidenụ na nche” naturally expresses the continuing command while retaining the alertness image.
