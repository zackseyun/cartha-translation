  naturalness: “Nọgidenụ na nche” is more natural Standard Igbo for the continuing imperative than “na-anọrịnụ na nche.” “Na-ekpe ekpere” is sufficient and avoids the added connective emphasis of -kwa. “...ịgbanahụ ... ma guzo...” is a clear, idiomatic rendering of the coordinated Greek infinitives.
  terminology: “Nwa nke Mmadụ” appropriately preserves the established Gospel title. “N’ihu” accurately renders ἔμπροσθεν. The proposed wording does not make explicit any implied acceptance or vindication in standing before the Son of Man.
