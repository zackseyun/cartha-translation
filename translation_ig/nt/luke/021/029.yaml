  text: Καὶ εἶπεν παραβολὴν αὐτοῖς· Ἴδετε τὴν συκῆν καὶ πάντα τὰ δένδρα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/029.yaml
  text: 'And he told them a parable: “Look at the fig tree and all the trees[a].'
translation:
  language: ig
  text: 'O wee gwa ha otu ilu, sị: “Leenụ osisi fig na osisi niile.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “Hụnụ osisi fig na osisi niile.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: O wee
  rationale: Nke a na-ejikọta okwu a na akụkọ bu ya ụzọ n'ụzọ dị mma n'Igbo, na-enweghị itinye nkọwa ọzọ na-adịghị na Grik.
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: gwa ha ilu
  rationale: N'Igbo, ‘ịgwa mmadụ ilu’ bụ ụzọ dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo na ọ kọọrọ ha παραβολή; ọ na-edobe ma ndị a gwara okwu ma ụdị ozizi ahụ.
- source_word: παραβολὴν
  choice: ilu
  rationale: ‘Ilu’ bụ okwu Igbo a na-ejikarị akọwa akụkọ ma ọ bụ ntụnyere e ji akụzi eziokwu, ma dabara n'iji παραβολή eme ihe n'Oziọma.
- source_word: Ἴδετε
  choice: Leenụ
  rationale: Ụdị iwu a na-agwa ọtụtụ mmadụ ka ha tụgharịa uche ha lee ihe a kpọrọ aha; ‘Leenụ’ na-egosipụta nke a nke ọma.
- source_word: τὴν συκῆν
  choice: osisi fig
  rationale: Okwu Grik ahụ na-ezo aka n'osisi ahụ, ọ bụghị naanị mkpụrụ ya; ‘osisi fig’ doro anya n'Igbo.
- source_word: πάντα τὰ δένδρα
  choice: osisi niile
  rationale: Nke a na-asụgharị ọtụtụ okwu Grik ahụ kpọmkwem n'etinyeghị ‘ndị ọzọ,’ nke na-adịghị n'ihe odide ahụ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu dee ya. ‘Leenụ’ na-egosi iwu e nyere ọtụtụ ndị; e debere okwu ‘osisi niile’ n'enweghị ịgbakwunye ‘ndị ọzọ.’
