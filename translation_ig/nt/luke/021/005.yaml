  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: ig
  text: 'Ka ụfọdụ ndị mmadụ na-ekwu banyere ụlọ nsọ ahụ[a], na e ji nkume ndị mara mma na onyinye ndị a raara nye Chineke[b] chọọ ya mma, ọ sịrị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ ἱερόν na-ezo aka n’ụlọ nsọ na ogige ya niile, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “onyinye ndị e doro nsọ.” Okwu Grik ahụ na-ezo aka n’onyinye ndị a raara nye Chineke, ndị e gosiri n’ụlọ nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: Mgbe ụfọdụ ndị mmadụ na-ekwu
  rationale: Nkebiokwu a na-egosi ihe na-aga n’ihu n’otu oge ahụ; “Mgbe … na-ekwu” na-eweta nke a n’Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: τοῦ ἱεροῦ
  choice: ụlọ nsọ ahụ
  rationale: ἱερόν na-ezo aka n’ogige na akụkụ niile nke ụlọ nsọ, ọ bụghị naanị ebe nsọ dị n’ime ya. “Ụlọ nsọ ahụ” bụ okwu Igbo a na-aghọta ngwa ngwa, ebe nkọwa ala ala dị n’ihe e dere n’ala peeji.
- source_word: λίθοις καλοῖς
  choice: nkume ndị mara mma
  rationale: Nke a na-echekwa echiche καλοῖς banyere ịma mma na ịdị ebube nke nkume ndị ahụ n’asụsụ Igbo nkịtị.
- source_word: ἀναθήμασιν
  choice: onyinye ndị a raara nye Chineke
  rationale: Okwu ahụ pụtara onyinye ndị a raara nye Chineke ma gosi n’ụlọ nsọ. Nsụgharị a doro onye Igbo nke oge a anya karịa okwu nka pụrụ ịdị omimi.
- source_word: κεκόσμηται
  choice: e ji … chọọ ya mma
  rationale: Perfect passive na-egosi na a chọọla ụlọ nsọ ahụ mma, ihe ịchọ mma ahụ ka dịkwa n’elu ya. Nhazi a na-enye echiche ahụ n’Igbo n’enweghị asụsụ siri ike.
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Ngwaa Grik ahụ anaghị akpọ Jizọs aha n’ebe a. “Ọ sịrị” na-echekwa usoro akụkọ ahụ ma ghara itinye aha na-adịghị n’ederede.
