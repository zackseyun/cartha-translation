id: LUK.21.34
reference: Luke 21:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: ig
  text: Ma kpacharanụ onwe unu anya, ka oké oriri na ọṅụṅụ[a], ịṅụbiga mmanya ókè, na nchegbu nke ndụ ghara ime ka obi unu dị arọ, ka ụbọchị ahụ ghara ịbịakwasị unu na mberede.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ahụhụ na-esochi ịṅụbiga mmanya ókè”; okwu Grik ahụ nwekwara ike izo aka n’oké oriri na ọṅụṅụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ... ἑαυτοῖς
  choice: leenụ onwe unu anya
  rationale: Nke a bụ ịdọ aka ná ntị ka ndị na-ege ntị mụrụ anya ma kpachara onwe ha anya; okwu Igbo a bụ nke a na-aghọta nke ọma ma na-echekwa ike nke iwu ahụ.
- source_word: μήποτε
  choice: ka ... ghara
  rationale: Usoro a na-egosi ihe a na-adọ aka ná ntị ka ọ ghara ime, n'ụzọ dabara n'usoro okwu Igbo.
- source_word: βαρηθῶσιν ... αἱ καρδίαι
  choice: ime ka obi unu dị arọ
  rationale: Ọ na-echekwa ihe atụ Grik nke obi ibu arọ, nke metụtara uche na ndụ ime mmụọ, ọ bụghị mmetụta obi naanị.
- source_word: κραιπάλῃ
  choice: iri na ịṅụbiga mmanya ókè
  rationale: Okwu Grik a nwere ike ịpụta oriri na ịṅụbiga mmanya ókè ma ọ bụ ahụhụ na-esochi ya; nsụgharị a na-ekpuchi echiche nke ndụ oriri gabigara ókè n'enweghị imechi ihe ọ pụtara n'otu akụkụ.
- source_word: μέθῃ
  choice: ịṅụbiga mmanya ókè
  rationale: Nke a na-egosi ọnọdụ ịṅụ mmanya ruo n'ókè mmadụ na-enweghịzi njide onwe ya; ọ bụ okwu doro anya nye ndị na-agụ Igbo taa.
- source_word: μερίμναις βιωτικαῖς
  choice: nchegbu nke ndụ
  rationale: Ọ na-egosi nchegbu ndị metụtara ndụ kwa ụbọchị n'enweghị ịgbakwụnye echiche na ihe niile nke ụwa bụ ihe ọjọọ.
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: abịakwasịkwa unu na mberede
  rationale: Ọ na-echekwa echiche nke ụbọchị ahụ ịbịaru mmadụ n'elu ya n'ụzọ na-atụghị anya ya.
- source_word: ἡ ἡμέρα ἐκείνη
  choice: ụbọchị ahụ
  rationale: A hapụrụ okwu ahụ dịka Grik si kwuo ya, n'ebughị ụzọ tinye nkọwa dịka ‘ụbọchị ikpe.’
theological_decisions:
- issue: Ihe ‘ụbọchị ahụ’ na-ezo aka na ya
  choice: ụbọchị ahụ
  alternative: ụbọchị ikpe ahụ
  rationale: Ọnọdụ okwu ahụ na-egosi ụbọchị ikpeazụ dị mkpa n'ozizi Jizọs, ma nsụgharị ahụ echekwara okwu ederede n'onwe ya ma ghara ịgbakwunye aha ozizi nke Grik ekwughị kpọmkwem.
translation_notes:
  register: E jiri Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. A họọrọ ‘leenụ onwe unu anya’ maka ịdọ aka ná ntị siri ike, ma chekwaa ihe atụ nke ‘obi ... dị arọ.’
