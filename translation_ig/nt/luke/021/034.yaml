revisions:
- from: Ma leenụ onwe unu anya, ka iri na ịṅụbiga mmanya ókè[a], ịṅụbiga mmanya ókè, na nchegbu nke ndụ ghara ime ka obi unu dị arọ, ụbọchị ahụ abịakwasịkwa unu na mberede.
  to: Ma kpacharanụ onwe unu anya, ka oké oriri na ọṅụṅụ[a], ịṅụbiga mmanya ókè, na nchegbu nke ndụ ghara ime ka obi unu dị arọ, ka ụbọchị ahụ ghara ịbịakwasị unu na mberede.
  rationale: The revision distinguishes the two alcohol-related Greek nouns without overdetermining κραιπάλη, retains its lexical ambiguity in the footnote, and supplies an explicit Igbo preventive construction for the sudden arrival of that day. It otherwise preserves the draft’s faithful and suitably formal-modern wording.
