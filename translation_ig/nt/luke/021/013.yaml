id: LUK.21.13
reference: Luke 21:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: ig
  text: Nke a ga-ewetara unu ohere ịgba akaebe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nke a ga-eme ka unu gbaa akaebe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβήσεται
  choice: ga-abụrụ
  rationale: Ngwaa a n’ebe a na-egosi ihe ga-esi n’ihe ndị ahụ pụta, ọ bụghị nanị na ihe ga-eme; “ga-abụrụ” na-ejikọta n’ụzọ ebumpụta ụwa na “ihe akaebe.”
- source_word: ὑμῖν
  choice: unu
  rationale: Dative a na-egosi ihe ga-esi n’ọnọdụ ahụ pụta nye ndị na-eso ụzọ; n’usoro Igbo a, “ga-abụrụ unu” na-egosipụta ya nke ọma.
- source_word: εἰς
  choice: ihe
  rationale: N’ahịrịokwu “ga-abụrụ unu ihe akaebe,” usoro ahụ na-egosipụta ọrụ ma ọ bụ nsonaazụ εἰς n’Igbo n’enweghị ntụgharị nkịtị nke “banye n’ime.”
- source_word: μαρτύριον
  choice: ihe akaebe
  rationale: “Ihe akaebe” nwere ike ịpụta akaebe a na-agba ma ọ bụ ihe na-egosi eziokwu, ya mere ọ na-echekwa obosara okwu Grik ahụ na ọnọdụ ikpe n’ihu ndị ọchịchị.
theological_decisions:
- issue: Ihe mkpagbu ndị na-eso ụzọ n’ihu ndị ọchịchị ga-arụpụta
  choice: E kwughị kpọmkwem ma ọ bụ ohere ha ga-eji gbaa akaebe, ma ọ bụ ihe akaebe nke ọnọdụ ahụ n’onwe ya.
  alternative: Ịsị kpọmkwem na nke a ga-enye ha ohere ịgba akaebe banyere Jizọs.
  rationale: μαρτύριον nwere ike izo aka n’ịgba akaebe ma ọ bụ n’ihe akaebe. Isi ederede na-ahapụ obosara ahụ, ebe nkọwa ala peeji na-egosi nghọta nke ohere ịgba akaebe nke gbara ya gburugburu n’akụkọ Luk.
translation_notes:
  register: Standard Igbo dị mfe, ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. “Nke a” na-ezo aka n’ihe Jizọs kwuru tupu amaokwu a; “ihe akaebe” na-echekwa ma ụda iwu ma echiche nke ịgba akaebe.
