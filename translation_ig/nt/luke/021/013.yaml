revisions:
- from: Nke a ga-abụrụ unu ihe akaebe[a].
  to: Nke a ga-ewetara unu ohere ịgba akaebe[a].
  rationale: 'The revision renders the resultant function of ἀποβήσεται εἰς μαρτύριον in natural Standard Igbo: the events will provide an occasion for the disciples to bear testimony. It avoids treating μαρτύριον primarily as impersonal evidence, while the alternative preserves a more direct expression of the result without over-specifying the testimony’s content.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:21Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the future outcome and the reference to the disciples, but “ihe akaebe” most readily means evidence/proof in modern Igbo. It can make the predicted events themselves into evidence, rather than expressing the disciples’ bearing of testimony, which is the more likely sense of μαρτύριον in this hearing-and-persecution context.
  naturalness: “Nke a ga-abụrụ unu ihe akaebe” is grammatical, but it is less natural and less contextually precise than an expression using “ịgba akaebe” for bearing testimony. “Nke a ga-ewetara unu ohere ịgba akaebe” is clear, idiomatic Standard Igbo.
  terminology: Use “ịgba akaebe” for μαρτύριον here. It retains the public/judicial sense of testimony without specifying its content or imposing an evangelistic interpretation. “Ohere” makes explicit the contextual force of the outcome—an occasion to testify—while the footnote supplies a closer causal rendering.
  issues:
  - severity: medium
    issue: “ihe akaebe” can mean evidence rather than testimony borne by the disciples.
    rationale: In this context, μαρτύριον most naturally refers to the disciples’ witness before authorities. The proposed wording can be understood as saying that the events constitute proof, which aligns too closely with the less likely ‘evidence against opponents’ reading.
  revised_text: Nke a ga-ewetara unu ohere ịgba akaebe[a].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Nke a ga-eme ka unu gbaa akaebe.”
    reason: lexical_alternative
  revision_rationale: 'The revision renders the resultant function of ἀποβήσεται εἰς μαρτύριον in natural Standard Igbo: the events will provide an occasion for the disciples to bear testimony. It avoids treating μαρτύριον primarily as impersonal evidence, while the alternative preserves a more direct expression of the result without over-specifying the testimony’s content.'
