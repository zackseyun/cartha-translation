source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: ig
  text: A ga-enwekwa ihe ịrịba ama n’anyanwụ, n’ọnwa, nakwa na kpakpando[a]; n’elu ụwa, mba dị iche iche ga-anọ ná mkpagbu, n’ịbụ ndị gbagwojuru anya n’ihi ụzụ oké osimiri na ebili mmiri ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime anyanwụ na ọnwa na kpakpando.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “n’ụda oké osimiri na n’ọgba aghara ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: Nke a bụ okwu Igbo doro anya ma saa mbara maka ihe ndị na-egosi ma ọ bụ na-ebu ozi, n’ebughị ụzọ kọwaa ha dị ka ọdachi ma ọ bụ ihe atụ.
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: n’anyanwụ, n’ọnwa, nakwa na kpakpando
  rationale: Ọ na-edobe usoro ihe atọ dị n’asụsụ Grik ma na-ada nke ọma n’Igbo.
- source_word: συνοχὴ ἐθνῶν
  choice: mba dị iche iche ga-anọ ná mkpagbu
  rationale: “Mkpagbu” na-egosi ọnọdụ nrụgide na nhụjuanya; “mba dị iche iche” na-ezo aka n’ụmụ mmadụ nke mba ụwa, ọ bụghị naanị ndị mba ọzọ n’ụzọ okpukpe.
- source_word: ἐν ἀπορίᾳ
  choice: na n'ọgba aghara
  rationale: Nkebiokwu a na-egosi na ha agaghị ama ihe ha ga-eme ma ọ bụ ụzọ mgbapụ, n’asụsụ Igbo a na-aghọta ngwa ngwa.
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: n’ihi ụzụ oké osimiri na ebili mmiri ya
  rationale: “Ụzụ” na-egosipụta ụda dị ike, ebe “ebili mmiri ya” na-eme ka ọgba aghara ma ọ bụ ntụgharị nke osimiri pụta ìhè n’Igbo nkịtị.
theological_decisions:
- issue: Ụdị ihe ịrịba ama ndị ga-apụta n’eluigwe
  choice: A sụgharịrị ha ozugbo dị ka ihe ịrịba ama n’anyanwụ, n’ọnwa, na kpakpando, n’enweghị nkọwa ọzọ.
  alternative: Ịkọwa ha dị ka mgbanwe nkịtị n’ihe ndị dị na mbara igwe, ma ọ bụ dị ka ihe atụ nke ọchịchị na ndọrọ ndọrọ ọchịchị.
  rationale: Amaokwu ahụ n’onwe ya ekpebighị ma ihe ndị a hà bụ ihe ga-eme n’anya nkịtị, ihe atụ, ka ọ bụ ha abụọ; ya mere nsụgharị ahụ na-ahapụ esemokwu ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. A họọrọ usoro ahịrịokwu na okwu ndị mmadụ na-eji, ma debe ọdịdị amụma nke amaokwu ahụ na enweghị nkọwa banyere ma ihe ndị ahụ hà bụ ihe nkịtị ma ọ bụ ihe atụ.
