  text: ⸀θέτε οὖν ⸂ἐν ταῖς καρδίαις⸃ ὑμῶν μὴ προμελετᾶν ἀπολογηθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/014.yaml
  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: ig
  text: Ya mere, kpebisienụ n’obi unu ka unu ghara ibu ụzọ kwadebe ihe unu ga-ekwu iji chebe onwe unu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu ghara ibu ụzọ tụgharịa uche n’otú unu ga-esi chebe onwe unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέτε
  choice: kpebisienụ ike
  rationale: N’iwu a, τίθημι na nkebiokwu banyere obi pụtara ime mkpebi siri ike n’ime mmadụ; ‘kpebisienụ ike’ na-egosipụta nke a n’Igbo doro anya.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe e si n’okwu ndị bu ụzọ kwubie, ma na-ejikọta ahịrịokwu a na ihe gbara ya gburugburu.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: n’obi unu
  rationale: Nke a na-edobe akpaalaokwu Grik banyere obi dịka ebe mkpebi na ebumnobi mmadụ dị; ‘unu’ na-egosikwa na a na-agwa ọtụtụ mmadụ okwu.
- source_word: μὴ
  choice: na unu agaghị
  rationale: N’usoro Igbo a, a na-egosipụta ihe a kpebiri na a gaghị eme ya, kama ịtụgharị μὴ dịka iwu ọzọ dị iche.
- source_word: προμελετᾶν
  choice: akwadebe okwu unu tupu oge eruo
  rationale: Ngwaa ahụ nwere echiche nke ichepụta ma ọ bụ ịmụgharị ihe a ga-ekwu tupu oge eruo. Nkebiokwu a bụ Igbo ebumpụta ụwa ma na-ezere nghọta na-ezighị ezi.
- source_word: ἀπολογηθῆναι
  choice: iji zara ọnụ unu
  rationale: N’ọnọdụ ikpe ma ọ bụ ebubo, akpaalaokwu Igbo a pụtara ikwu okwu iji chebe onwe; ọ na-edobe echiche nke ịza ebubo n’agbanyeghị na ọ bụghị ntụgharị mkpụrụokwu n’otu n’otu.
theological_decisions:
- issue: Ma iwu a ọ machibidoro nkwadebe niile ma ọ bụ nkwadebe okwu nchebe tupu mkpagbu ahụ
  choice: E jikọtara nkwadebe ahụ kpọmkwem na okwu a ga-eji zara ọnụ onwe.
  alternative: Ịsị naanị ‘unu akwadebela tupu oge eruo’ nke nwere ike iyi ka ọ machibidoro ụdị nkwadebe niile.
  rationale: προμελετᾶν na-adabere na ἀπολογηθῆναι; ihe a na-ekwu bụ ịkwadebe tupu oge eruo otú a ga-esi zaa ebubo, ọ bụghị iwu zuru ụwa ọnụ megide nkwadebe ọ bụla.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Kpebisienụ ike n’obi unu’ na-edobe akpaalaokwu na ike iwu Grik; ‘zara ọnụ unu’ bụ akpaalaokwu Igbo a na-aghọta nke ọma n’ọnọdụ ebubo ma ọ bụ ikpe.
