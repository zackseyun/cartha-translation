review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential οὖν, the imperative call to an inward resolve, and the restriction to advance preparation for a defense. However, “na unu agaghị” can sound chiefly like a future prediction rather than the intended resolved prohibition, and “iji zara ọnụ unu” is less direct and idiomatic here than an explicit expression of self-defense.
  naturalness: “Kpebisienụ ike n’obi unu” is understandable, but “kpebisienụ n’obi unu ka unu ghara …” more naturally expresses the Greek imperative plus negative infinitive. “Ibu ụzọ kwadebe ihe unu ga-ekwu iji chebe onwe unu” is clear, modern Standard Igbo.
  terminology: “Chebe onwe unu” accurately renders the legal/formal-defense sense of ἀπολογηθῆναι without importing a denominational interpretation. “Ibu ụzọ kwadebe” adequately represents προμελετᾶν; the footnote preserves the nuance of thinking through or rehearsing in advance.
  issues:
  - severity: medium
    issue: The negative dependent clause is phrased as “na unu agaghị akwadebe.”
    rationale: Although intelligible, this may be read as a statement about what will not happen. A purpose/content clause with “ka unu ghara …” more clearly conveys the commanded resolve not to prepare beforehand.
  - severity: medium
    issue: “iji zara ọnụ unu” is semantically and syntactically less clear than necessary.
    rationale: The Greek refers specifically to making one’s defense. “Iji chebe onwe unu” expresses this directly and naturally in Standard Igbo.
  revised_text: Ya mere, kpebisienụ n’obi unu ka unu ghara ibu ụzọ kwadebe ihe unu ga-ekwu iji chebe onwe unu[a],
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu ghara ibu ụzọ tụgharịa uche n’otú unu ga-esi chebe onwe unu.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s imperative, inward-resolve idiom, and legal-defense focus while using a more natural Igbo construction for the negative infinitival clause. It does not broaden the saying into a prohibition of all preparation.
