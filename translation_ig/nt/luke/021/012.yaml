id: LUK.21.12
reference: Luke 21:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: ig
  text: Ma tupu ihe ndị a niile emee, ha ga-ebikwasị unu aka[a], kpagbuo unu, nyefee unu n’ụlọ nzukọ ndị Juu na n’ụlọ mkpọrọ; a ga-edurukwa unu n’ihu ndị eze na ndị gọvanọ n’ihi aha m[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ ọzọ, “ha ga-ejide unu.” Okwu Grik kwuru kpọmkwem “ha ga-ebikwasị unu aka,” nke bụ akpaalaokwu maka ijide mmadụ n’ụzọ iro ma ọ bụ imeso ya ihe ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “n’ihi aha m” dịka “maka aha m,” ma ọ bụ, n’ụzọ na-akọwa ihe ọ pụtara, “n’ihi m.” Ihe e dere n’amaokwu ahụ na-echekwa okwu Akwụkwọ Nsọ nke jikọtara aha Jizọs na onye ọ bụ nakwa ikike ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: Ma tupu ihe ndị a niile emee
  rationale: “Tupu” na-egosi na ihe a ga-ebu ụzọ mee; “niile” na-anọchi πάντων. E tinyere “emee” iji mee ka okwu ahụ zuo oke ma daa nke ọma n’Igbo.
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: ha ga-ebikwasị unu aka
  rationale: Nke a na-echekwa oyiyi okwu Grik nke pụtara itinye aka n’ahụ mmadụ n’ụzọ iro, ijide ya, ma ọ bụ mesoo ya ihe ike. Ihe ndị gbara ya gburugburu na-eme ka o doo anya na ọ bụghị ịbịkwasị aka maka ngọzi.
- source_word: διώξουσιν
  choice: kpagbuo unu
  rationale: “Kpagbuo” na-egosi mkpagbu a na-akpagbu ndị na-eso ụzọ n’ihi njikọ ha na Jizọs, ọ bụghị nanị ịchụ ha ọsọ.
- source_word: παραδιδόντες
  choice: nyefee unu
  rationale: 'Ọ na-egosi ụzọ mkpagbu ahụ ga-esi mee: inyefe ha n’aka ụlọ ikpe ma ọ bụ ndị nwere ikike imegide ha.'
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: n’ụlọ nzukọ ndị Juu na n’ụlọ mkpọrọ
  rationale: “Ụlọ nzukọ ndị Juu” bụ okwu ndị mmadụ na-aghọta maka synagogue; a hapụrụ njikọ ya na usoro ikpe ma ọ bụ ndị isi ụlọ nzukọ ka ọnọdụ okwu ahụ gosi ya. “Ụlọ mkpọrọ” na-anọchi φυλακάς n'ụzọ doro anya.
- source_word: ἀπαγομένους
  choice: a ga-edurukwa unu
  rationale: 'Nke a na-echekwa ụdị nnara-eme nke participle Grik: ọ bụ ndị ọzọ ga-eduru “unu.” “-kwa” na-ejikọta ihe a na usoro mkpagbu ndị bu ya ụzọ.'
- source_word: ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: n’ihu ndị eze na ndị gọvanọ
  rationale: “N’ihu” na-egosi ịkpọpụta ha n’ihu ndị ọchịchị maka ikpe; “ndị gọvanọ” na-akọwa ἡγεμόνας dị ka ndị ọchịchị obodo ma ọ bụ ógbè.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: n’ihi aha m
  rationale: A na-echekwa okwu Akwụkwọ Nsọ “aha m,” nke na-ezo aka n’onwe Jizọs, ikike ya, na nkwupụta ndị na-eso ụzọ na-ekwupụta banyere ya, n’akọwaghị ya n’ụzọ ga-eme ka ihe ọ pụtara dị warara.
theological_decisions:
- issue: Ihe “aha m” pụtara n’ọnọdụ mkpagbu a
  choice: n’ihi aha m
  alternative: n’ihi m; n’ihi na unu bụ ndị nke m
  rationale: Idebe “aha m” na-echekwa ịdị arọ nke okwu ahụ n’Akwụkwọ Nsọ na njikọ dị n’etiti aha Jizọs, onye ọ bụ, na ikike ya, n’etinyeghị nkọwa otu okpukpe pụrụ iche.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E chekwara usoro ihe omume nke Grik na ụdị nnara-eme dị na ἀπαγομένους. E ji “ụlọ nzukọ ndị Juu” mee ka “synagogue” doo ndị na-agụ akwụkwọ nkịtị anya, ma e tinyeghị nkọwa gbasara usoro ikpe n’ime amaokwu ahụ.
