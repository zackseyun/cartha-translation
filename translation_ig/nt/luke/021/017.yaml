review_pass:
  verdict: revise
  source_fidelity: 'The draft reverses the grammatical role of πάντων: in Greek, ὑπὸ πάντων means the agents (''by all/everyone''), whereas Igbo ''unu niile'' makes ''all of you'' the people hated. The future passive sense itself is otherwise conveyed adequately.'
  naturalness: ‘Mmadụ niile ga-akpọ unu asị’ is clear, idiomatic Standard Igbo, and preserves the compact public-hostility sense of the verse.
  terminology: ‘Aha m’ faithfully retains τὸ ὄνομά μου and its biblical breadth. The footnote should not present the identical main-text wording as an alternative; it can give ‘n’ihi m’ as an interpretive alternative while explaining the retained literal expression.
  issues:
  - severity: high
    issue: ‘unu niile’ incorrectly renders ὑπὸ πάντων.
    rationale: The phrase means that all people are the agents of hatred, not that every member of the addressed group will be hated. This changes the source syntax and emphasis.
  - severity: low
    issue: The footnote lists ‘n’ihi aha m,’ which is already the main-text rendering, as an alternative.
    rationale: Removing the duplicate makes the note structurally and informationally clear without altering meaning.
  revised_text: Mmadụ niile ga-akpọ unu asị n’ihi aha m[a].
  revised_footnotes:
