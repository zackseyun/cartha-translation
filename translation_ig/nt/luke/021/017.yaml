revisions:
- from: A ga-akpọ unu niile asị n’ihi aha m[a].
  to: Mmadụ niile ga-akpọ unu asị n’ihi aha m[a].
  rationale: The revision renders ὑπὸ πάντων with ‘Mmadụ niile’ as the agent of ‘ga-akpọ ... asị,’ while retaining the plural object ‘unu.’ It preserves the future sense, the passive meaning in idiomatic Igbo, the causal force of n’ihi, and the literal theological expression ‘aha m.’
  reviewer_model: gpt-5.6-terra
