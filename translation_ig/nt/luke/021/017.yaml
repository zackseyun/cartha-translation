  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: ig
  text: Mmadụ niile ga-akpọ unu asị n’ihi aha m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi m.” Okwu ahụ bụ “aha m” pụrụ izo aka n’onye Jizọs bụ, ikike ya, na nkwupụta nrubeisi nye ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: A ga-akpọ unu … asị
  rationale: Ngwakọta ọdịnihu ἔσεσθε na participle passive μισούμενοι na-egosi ihe a ga-eme ndị a na-agwa okwu. Usoro Igbo a bụ ụzọ doro anya ma bụrụkwa nke e ji ekwu na a ga-akpọ ha asị.
- source_word: ὑπὸ πάντων
  choice: unu niile
  rationale: ὑπό tinyere genitive na-egosi ndị na-eme omume ahụ, πάντων pụtakwara ‘mmadụ niile.’ N’usoro passive a nke Igbo, ‘unu niile’ na-edobe ịdị nkenke na ike nke okwu Grik ahụ.
- source_word: διὰ
  choice: n’ihi
  rationale: διά tinyere accusative na-egosi ihe kpatara ya; ‘n’ihi’ bụ okwu Igbo nkịtị ma doo anya maka ‘because of/on account of.’
- source_word: τὸ ὄνομά μου
  choice: aha m
  rationale: 'Nke a na-asụgharị okwu Grik ahụ kpọmkwem ma na-edobe obosara ihe ‘aha’ nwere ike ịpụta: onye Jizọs bụ, ikike ya, na nkwupụta nrubeisi nye ya.'
theological_decisions:
- issue: Ihe ‘aha m’ pụtara n’ọnọdụ mkpagbu ndị na-eso ụzọ
  choice: E debere okwu ahụ dịka ‘aha m.’
  alternative: n’ihi m; n’ihi na unu bụ ndị nke m
  rationale: Grik kwuru kpọmkwem ‘aha m.’ Idebe ya otú ahụ anaghị emechi nghọta ya naanị n’otu akụkụ, kama ọ na-echekwa njikọ ya na onye Jizọs bụ, ikike ya, na ikwupụta nrubeisi nye ya.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma dịkwa ugwu. Ahịrịokwu ahụ dị nkenke dịka Grik; e debere ‘aha m’ n’isiokwu, ma tinye nkọwa ya n’ala ala peeji.
