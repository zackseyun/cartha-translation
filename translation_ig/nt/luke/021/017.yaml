    text: Ma ọ bụ, “n’ihi m.” Okwu ahụ bụ “aha m” pụrụ izo aka n’onye Jizọs bụ, ikike ya, na nkwupụta nrubeisi nye ya.
    reason: lexical_alternative
  revision_rationale: The revision renders ὑπὸ πάντων with ‘Mmadụ niile’ as the agent of ‘ga-akpọ ... asị,’ while retaining the plural object ‘unu.’ It preserves the future sense, the passive meaning in idiomatic Igbo, the causal force of n’ihi, and the literal theological expression ‘aha m.’
