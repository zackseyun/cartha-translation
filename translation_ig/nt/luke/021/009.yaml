    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị nso n’usoro okwu Greek: “ma ọgwụgwụ adịghị ozugbo.”'
    reason: alternative_reading
  revision_rationale: The revision removes the limiting qualifier from the command not to fear, preserving the force of μὴ πτοηθῆτε. It also replaces an unsuitable lexical alternative in footnote a while retaining the broad sense of disorder or unrest. The explicit future wording “agaghị abịa ozugbo” remains a natural Igbo rendering of the Greek verbless clause without imposing a particular eschatological scheme.
