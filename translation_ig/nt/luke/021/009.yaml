  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: ig
  text: Ma mgbe unu nụrụ akụkọ agha na ọgba aghara[a], unu atụla ụjọ; n’ihi na ihe ndị a aghaghị ibu ụzọ mee, ma ọgwụgwụ agaghị abịa ozugbo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọgbaghara,” “mkpata ọgba aghara,” ma ọ bụ “enweghị usoro.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ dị nso n’usoro okwu Greek: “ma ọgwụgwụ adịghị ozugbo.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ma mgbe
  rationale: “Mgbe” na-egosi oge ihe a ga-eme n’ọdịnihu, ebe “ma” na-ejikọta okwu a na ịdọ aka ná ntị gara aga n’enweghị ime ka ntụnyere ahụ sie ike karịa Greek.
- source_word: ἀκούσητε
  choice: unu nụrụ akụkọ
  rationale: N’ọnọdụ a, ọ pụtara ịnụ banyere ihe ndị na-eme, ọ bụghị naanị ịnụ ụda; “nụrụ akụkọ” bụ okwu Igbo doro anya ma bụrụkwa nke e ji ekwu ịnụ banyere agha.
- source_word: πολέμους
  choice: agha
  rationale: Nke a na-egosi ọgụ dị iche iche; n’Igbo, “agha” nwere ike ịrụ ọrụ dị ka aha mkpokọta n’enweghị akara ọtụtụ.
- source_word: ἀκαταστασίας
  choice: ọgba aghara
  rationale: “Ọgba aghara” na-ekpuchi enweghị udo, ọgbaọrụ na mmegharị ọha ma ọ bụ ọchịchị n’enweghị imechi ihe ọ pụtara naanị n’ime nnupụisi.
- source_word: μὴ πτοηθῆτε
  choice: unu atụla ụjọ nke ukwuu
  rationale: Nke a na-egosi ịtụ egwu nke na-akpata ụjọ ma ọ bụ ịma jijiji; mgbakwunye “nke ukwuu” na-ebupụta ike okwu Greek n’Igbo eke.
- source_word: δεῖ γὰρ
  choice: n’ihi na ... aghaghị
  rationale: “N’ihi na” na-enye nkọwa kpatara iwu ahụ, ebe “aghaghị” na-echekwa echiche nke mkpa ma ọ bụ ihe ga-emerịrị.
- source_word: ταῦτα γενέσθαι πρῶτον
  choice: ihe ndị a aghaghị ibu ụzọ mee
  rationale: “Ibu ụzọ mee” na-egosi usoro oge nke πρῶτον n'ụzọ Igbo dị mfe ma doo anya.
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: ma ọgwụgwụ agaghị abịa ozugbo
  rationale: Ọ bụ ezie na nkebi Greek enweghị ngwaa doro anya, Igbo chọrọ ka e mee ka mmekọrịta ahụ pụta ìhè. “Agaghị abịa ozugbo” na-echekwa isi oge nke εὐθέως n’enweghị ịkọwa ụdị ọgwụgwụ ahụ.
theological_decisions:
- issue: Oge ọgwụgwụ ga-abịa
  choice: Agha na ọgba aghara ga-ebu ụzọ mee, ma ọgwụgwụ agaghị abịa ozugbo.
  alternative: Ihe ndị a bụ ihe ndị na-eme tupu ọgwụgwụ, ma ha abụghị ọgwụgwụ ahụ n’onwe ya.
  rationale: Nsụgharị ahụ na-echekwa ịdọ aka ná ntị Jizọs megide iche na ọgba aghara pụtara na ọgwụgwụ eruola ozugbo, ma ọ naghị etinye usoro ozizi pụrụ iche banyere oge ọgwụgwụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. “Unu” na-egosi na a na-agwa ọtụtụ mmadụ okwu. E zere okwu ụka pụrụ iche na nkọwa nke otu usoro ozizi banyere ọgwụgwụ.
