revisions:
- from: Ma mgbe unu nụrụ akụkọ agha na ọgba aghara[a], unu atụla ụjọ nke ukwuu; n’ihi na ihe ndị a aghaghị ibu ụzọ mee, ma ọgwụgwụ agaghị abịa ozugbo.[b]
  to: Ma mgbe unu nụrụ akụkọ agha na ọgba aghara[a], unu atụla ụjọ; n’ihi na ihe ndị a aghaghị ibu ụzọ mee, ma ọgwụgwụ agaghị abịa ozugbo.[b]
  rationale: The revision removes the limiting qualifier from the command not to fear, preserving the force of μὴ πτοηθῆτε. It also replaces an unsuitable lexical alternative in footnote a while retaining the broad sense of disorder or unrest. The explicit future wording “agaghị abịa ozugbo” remains a natural Igbo rendering of the Greek verbless clause without imposing a particular eschatological scheme.
