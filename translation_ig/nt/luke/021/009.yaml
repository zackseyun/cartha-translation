review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the future temporal clause, reports of wars and social disorder, the necessity that these events occur first, and the warning that the end is not immediate. However, “unu atụla ụjọ nke ukwuu” literally prohibits being afraid “too much,” which can imply that a lesser degree of fear is permitted; μὴ πτοηθῆτε gives an unqualified prohibition.
  naturalness: The wording is generally clear Standard Igbo. “Unu atụla ụjọ” is more idiomatic and semantically exact than the qualified expression. “Nụrụ akụkọ agha” naturally expresses hearing reports of wars.
  terminology: “Ọgba aghara” is an appropriate broad rendering of ἀκαταστασίας. The proposed footnote alternative “ọgbaọrụ” is not a suitable lexical alternative in this context and should be removed. “Ọgwụgwụ” appropriately preserves the Greek’s unspecific eschatological term.
  issues:
  - severity: medium
    issue: The phrase “nke ukwuu” qualifies the prohibition against fear.
    rationale: It changes “do not be terrified/alarmed” into “do not be too afraid,” weakening the imperative and potentially allowing an amount of fear that the source does not express.
  - severity: low
    issue: Footnote a includes “ọgbaọrụ” as an alternative for ἀκαταστασίας.
    rationale: This is not an appropriate Standard Igbo equivalent for public or social disorder and may mislead readers.
  revised_text: Ma mgbe unu nụrụ akụkọ agha na ọgba aghara[a], unu atụla ụjọ; n’ihi na ihe ndị a aghaghị ibu ụzọ mee, ma ọgwụgwụ agaghị abịa ozugbo.[b]
