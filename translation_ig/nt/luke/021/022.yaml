  to: N’ihi na ụbọchị ndị a bụ ụbọchị ịbọ ọbọ[a], ka ihe niile e dere wee mezuo[b].
  rationale: The main translation is retained because it is faithful and natural. Footnote b is revised to give a direct formal alternative for the Greek articular infinitive, preserving its purpose/result range without changing the sentence’s syntactic focus or adding an agent.
