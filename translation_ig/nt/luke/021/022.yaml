id: LUK.21.22
reference: Luke 21:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἡμέραι ἐκδικήσεως αὗταί εἰσιν τοῦ πλησθῆναι πάντα τὰ γεγραμμένα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: ig
  text: N’ihi na ụbọchị ndị a bụ ụbọchị ịbọ ọbọ[a], ka ihe niile e dere wee mezuo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụbọchị nkwụghachi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “maka imezu ihe niile e dere.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-enye ihe kpatara ịdọ aka ná ntị dị n’okwu bu ụzọ; “N’ihi na” na-egosipụta ike nke njikọ ahụ n’ụzọ doro anya n’Igbo.
- source_word: ἡμέραι ἐκδικήσεως
  choice: ụbọchị ịbọ ọbọ
  rationale: E debere “ụbọchị” dịka aha ọtụtụ, ebe “ịbọ ọbọ” na-egosipụta nkwụghachi ikpe siri ike dị na ἐκδίκησις, n’ejighị okwu sara mbara nke ga-eme ka ike ya daa.
- source_word: αὗταί εἰσιν
  choice: ụbọchị ndị a bụ
  rationale: Nhazi a bụ nke Igbo kwesịrị ekwesị ma na-echekwa nkwusi ike nke αὗταί, “ndị a.”
- source_word: τοῦ πλησθῆναι
  choice: ka ... wee mezuo
  rationale: Ọ na-echekwa nghọta nwere ike ịbụ ebumnuche ma ọ bụ nsonaazụ, n’emeghị ka otu n’ime ha bụrụ naanị ihe owuwu ahụ pụtara.
- source_word: πάντα τὰ γεγραμμένα
  choice: ihe niile e dere
  rationale: Ọ na-egosipụta ihe niile edeworo n’enweghị ịkọwapụta ya kpọmkwem dịka “Akwụkwọ Nsọ,” ebe Grik hapụrụ ihe a na-ekwu banyere ya n’obosara.
theological_decisions:
- issue: Ụdị ἐκδικήσεως n’amụma Jizọs
  choice: ịbọ ọbọ
  alternative: nkwụghachi; ntaramahụhụ; ikpe ziri ezi
  rationale: “Ịbọ ọbọ” na-echekwa ịdị arọ nke nkwụghachi ikpe ahụ. Ihe gbara amaokwu ahụ gburugburu na njikọ ya na ihe e dere na-egosi ikpe, ma nsụgharị ahụ etinyeghị okwu “Chineke” ebe ọ na-adịghị n’ahịrịokwu Grik.
- issue: Ike nke τοῦ tinyere infinitive
  choice: ka ihe niile e dere wee mezuo
  alternative: n’ihi imezu ihe niile e dere
  rationale: Nhọrọ a na-ahapụ oghere dị n’etiti ebumnuche na nsonaazụ, dịka ihe owuwu Grik nwere ike isi kwuo ha abụọ.
translation_notes:
  register: Standard Igbo, n’ụdị okwu dị ùgwù ma doo ndị nkịtị anya. E ji “ịbọ ọbọ” chekwaa ike okwu ikpe ahụ, ebe nkọwa ala peeji na-enye “nkwụghachi” dịka ụzọ ọzọ; e zere ịgbakwunye onye na-eme ikpe ma ọ bụ ịkpọ ihe e dere “Akwụkwọ Nsọ” kpọmkwem.
