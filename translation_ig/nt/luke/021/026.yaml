source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: ig
  text: Ike ga-agwụ ndị mmadụ n’ihi ụjọ na n’ihi atụmanya ihe ndị na-abịakwasị ụwa mmadụ bi na ya[a]; n’ihi na ike nke eluigwe ga-ama jijiji[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụwa” ma ọ bụ “ala”; n’asụsụ Grik, “ụwa mmadụ bi na ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ike nke eluigwe” ma ọ bụ “ike ndị dị n’eluigwe.” Nkebiokwu ahụ nwere ike izo aka n’ike dị iche iche nke mbara igwe ma ọ bụ nke eluigwe n’ozuzu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων ἀνθρώπων
  choice: ike na-agwụ ndị mmadụ
  rationale: Nkebiokwu a na-egosi na ụjọ na-eme ka ndị mmadụ daa mba ma ọ bụ tụbọ; nsụgharị a bụ Igbo nkịtị nke na-ejigide ma mmetụta nke ahụ ma nke obi, n’enweghị ịkọwa ya nanị dị ka ọnwụ.
- source_word: ἀπὸ φόβου
  choice: n’ihi ụjọ
  rationale: ἀπό na genitive na-egosi ihe kpatara ọnọdụ ahụ; ‘n’ihi ụjọ’ na-egosipụta nke a nke ọma n’Igbo.
- source_word: προσδοκίας τῶν ἐπερχομένων
  choice: ihe ha na-atụ anya na ha ga-adakwasị
  rationale: A na-edobe echiche nke ichere ihe na-abịa n’etinyeghị okwu pụtara ‘amụma ọjọọ’ nke ọma karịa ihe Grik kwuru; gburugburu okwu ahụ na-egosi na atụmanya ahụ jupụtara n’ụjọ.
- source_word: τῇ οἰκουμένῃ
  choice: ụwa mmadụ bi na ya
  rationale: Nke a na-ejigide ọdịiche οἰκουμένη nwere dịka ụwa ndị mmadụ bi na ya, ọ bụghị naanị ala nkịtị.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: ike dị iche iche nke eluigwe
  rationale: Nsụgharị a na-anọ nso na Grik ma na-ahapụ ka okwu ahụ nwee ike izo aka n’ike eluigwe, ihe ndị dị na mbara igwe, ma ọ bụ usoro ike nke eluigwe.
- source_word: σαλευθήσονται
  choice: a ga-eme ka ... maa jijiji
  rationale: Ọ na-egosipụta future passive nke Grik ma na-echekwa ihe oyiyi nke ọgba aghara dị ukwuu n’eluigwe.
theological_decisions:
- issue: Ihe ‘ike dị iche iche nke eluigwe’ pụtara n’okwu amụma banyere ọgwụgwụ oge
  choice: E debere okwu sara mbara ‘ike dị iche iche nke eluigwe.’
  alternative: ihe ndị na-enye ìhè na mbara igwe; ndị mmụọ nwere ike n’eluigwe
  rationale: Grik ekpebighị ma ọ bụ ihe ndị dị na mbara igwe, ndị mmụọ, ma ọ bụ ike na usoro eluigwe n’ozuzu. Ya mere, nsụgharị ahụ ekwesịghị imechi nghọta ahụ n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere nkebiokwu kpatara ihe n’usoro Igbo nkịtị, ma e chekwara ihe oyiyi apọkalịptik na nghọta sara mbara nke okwu Grik.
