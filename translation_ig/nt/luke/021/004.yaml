  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: ig
  text: N’ihi na ndị a niile tinyere n’onyinye[a] site n’ihe ha nwere n’ụba; ma nwanyị a, site n’ụkọ ya[b], tinyere ihe niile o ji ebi ndụ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onyinye a na-enye n’ụlọ nsọ.” Okwu Grik ahụ pụtara “onyinye,” ma n’ebe a ọ na-ezo aka n’onyinye ndị mmadụ na-enye n’ụlọ nsọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “site n’ịda ogbenye ya” ma ọ bụ “site ná mkpa ya.”
    reason: lexical_alternative
  - marker: c
    text: Nke a pụtara ihe niile o nwere iji kwado ndụ ya, ọ bụghị ndụ ya dum n’echiche nke ịdị adị ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: N’ihi na ndị a niile
  rationale: “N’ihi na” na-echekwa njikọ nkọwa nke γάρ na amaokwu bu ụzọ, ebe “ndị a niile” na-asụgharị πάντες οὗτοι n’ụzọ doro anya ma bụrụ Igbo nkịtị.
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: site n’ihe ha nwere n’ụba
  rationale: Nke a na-egosi ihe ha nwere karịa mkpa ha, ma na-edobe ọdịiche dị n’etiti ụba ha na ụkọ nwanyị ahụ.
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: tinyere n’onyinye
  rationale: “Tinyere” na-echekwa echiche nke itinye ego, ebe “onyinye” na-anọgide nso na δῶρα ma dabara n’ọnọdụ onyinye a na-enye n’ụlọ nsọ.
- source_word: αὕτη δὲ
  choice: ma nwanyị a
  rationale: “Ma” na-egosi ọdịiche nke δέ; ịkpọ ya “nwanyị a” na-eme ka onye a na-ekwu banyere ya doo anya n’Igbo.
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: site n’ụkọ ya
  rationale: “Ụkọ” na-egosi enweghị ihe zuru ezu ma na-echekwa ọdịiche okwu ahụ na “ụba,” n’enweghị ịgbatị ihe ederede kwuru.
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: ihe niile o ji ebi ndụ
  rationale: N’ebe a βίος bụ ihe mmadụ ji akwado ndụ ya, ọ bụghị ndụ ya dum dị ka ịdị adị; okwu Igbo a na-eme ka nke ahụ doo anya.
- source_word: ἔβαλεν
  choice: tinyere
  rationale: Okwu a na-egosi omume doro anya nke itinye ego ahụ ma kwekọọ na ἔβαλον e ji kọwaa omume ndị ọzọ.
theological_decisions:
- issue: Ihe βίος pụtara n’onyinye nwanyị di ya nwụrụ
  choice: ihe niile o ji ebi ndụ
  alternative: ndụ ya niile
  rationale: Ọnọdụ a bụ maka ego na ihe e ji akwado ndụ. Nsụgharị a na-egbochi nghọtahie na nwanyị ahụ nyere ndụ ya n’onwe ya, ma na-edobe ịdị arọ nke na o nyere ihe niile o nwere iji dị ndụ.
- issue: Ihe τὰ δῶρα na-ezo aka na ya
  choice: onyinye
  alternative: onyinye a na-enye n’ụlọ nsọ; ebe a na-edebe onyinye
  rationale: δῶρα pụtara “onyinye.” Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi na ọ bụ onyinye ụlọ nsọ, ma isi amaokwu ahụ anaghị akpọ kpọmkwem ebe nchekwa ego ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke nwere nsọpụrụ ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-edobe ọdịiche dị n’etiti “ụba” na “ụkọ,” ma na-eji “ihe niile o ji ebi ndụ” kọwaa βίος n’enweghị mgbagwoju anya.
