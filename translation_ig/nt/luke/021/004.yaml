  source_fidelity: 'Isi ederede na-anọchite anya ihe Grik kwuru nke ọma: “ndị a niile” na-edobe πάντες οὗτοι; “site n’ihe ha nwere n’ụba” na “site n’ụkọ ya” na-echekwa ọdịiche περισσεύοντος/ὑστερήματος; “ihe niile o ji ebi ndụ” na-akọwa πάντα τὸν βίον ὃν εἶχεν n’ụzọ ziri ezi dị ka ihe e ji akwado ndụ, ọ bụghị ndụ mmadụ n’onwe ya. “Tinyere n’onyinye” dabara n’ọnọdụ itinye onyinye, n’agbanyeghị na δῶρα bụ ọtụtụ n’asụsụ Grik.'
