  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅταν προβάλωσιν ἤδη, βλέποντες ἀφ’ ἑαυτῶν γινώσκετε ὅτι ἤδη ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/030.yaml
  text: when they already put forth leaves[a], seeing for yourselves, you know that summer is already near.
translation:
  language: ig
  text: Mgbe ha apụtala akwụkwọ[a], site n’onwe unu, mgbe unu hụrụ nke a, unu maara na ọkọchị adịlarị nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ kpọmkwem karị, “mgbe ha apụtala ihe ọhụrụ.” Okwu Grik ahụ ekwughị “akwụkwọ” kpọmkwem, ma ihe a na-ekwu banyere osisi na-egosi na ọ bụ akwụkwọ osisi ka a na-ekwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Mgbe
  rationale: Ọ na-ewebata oge ihe a ga-eme; “mgbe” bụ ụzọ Igbo dị mfe ma kwekọọ n’ilu ihe atụ a.
- source_word: προβάλωσιν
  choice: ha pupụtarala akwụkwọ
  rationale: Ngwaa ahụ pụtara iwepụta ihe ọhụrụ. N’ọnọdụ okwu gbasara osisi dị n’amaokwu bu ụzọ, akwụkwọ osisi bụ ihe a na-atụ anya ya, ọ bụ ezie na okwu Grik ahụ ekwughị “akwụkwọ” kpọmkwem.
- source_word: ἤδη
  choice: -la / adịlarị
  rationale: 'E gosipụtara ἤδη ugboro abụọ: mmeju “-la” na “pupụtarala” na-egosi na opupụta ahụ amalitelarị, ebe “adịlarị” na-egosi na ọkọchị abịaworị nso.'
- source_word: βλέποντες
  choice: na-ahụ ya
  rationale: Nke a na-egosi na ihe ha ji mara oge ahụ bụ ihe ha ji anya ha hụ; ntụgharị a na-aga were were n’Igbo.
- source_word: ἀφ’ ἑαυτῶν
  choice: unu onwe unu
  rationale: Ọ na-egosi na ha ji ihe ha hụrụ n’onwe ha mata ya, n’enweghị onye ọzọ kọwaara ha.
- source_word: γινώσκετε
  choice: ma mara
  rationale: “Mara” na-enye echiche nke ịmata ihe site n’ihe a hụrụ, ma na-edobe okwu ahụ mfe.
- source_word: ἐγγὺς
  choice: nso
  rationale: Ọ na-egosi ịdị nso n’oge, nke dabara n’ọkọchị a na-ekwu maka ya.
- source_word: θέρος
  choice: ọkọchị
  rationale: “Ọkọchị” bụ okwu Igbo a na-ejikarị akọwa oge okpomọkụ/summer n’ọnọdụ a.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nkwugharị echiche “ugbua/alarị” dị n’okwu Grik site na “pupụtarala” na “adịlarị,” ma tinyekwa nkọwa ala peeji iji gosi na “akwụkwọ” sitere n’ọnọdụ okwu, ọ bụghị okwu e dere kpọmkwem na Grik.
