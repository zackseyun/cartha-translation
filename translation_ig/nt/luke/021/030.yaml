revisions:
- from: Mgbe ha pupụtarala akwụkwọ[a], unu onwe unu na-ahụ ya ma mara na ọkọchị adịlarị nso.
  to: Mgbe ha apụtala akwụkwọ[a], site n’onwe unu, mgbe unu hụrụ nke a, unu maara na ọkọchị adịlarị nso.
  rationale: The revision retains the two temporal markers expressed by “apụtala” and “adịlarị,” preserves the implied—rather than explicit—reference to leaves, and renders the Greek observational idiom clearly as recognition arising from one’s own seeing. It also avoids an unclear pronoun and improves Standard Igbo flow.
  reviewer_model: gpt-5.6-terra
