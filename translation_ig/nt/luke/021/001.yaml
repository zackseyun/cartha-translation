  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: ig
  text: O wee weliri anya ya elu ma hụ ndị ọgaranya ka ha na-etinye onyinye ha[a] n’ebe nchekwa akụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “onyinye ha” dịka “ihe ha na-enye.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “ebe nchekwa akụ” pụrụ ịpụta mpaghara ụlọ akụ dị n’ụlọ nsọ ma ọ bụ igbe ndị a na-atụnye onyinye n’ime ha.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: o leliri anya elu
  rationale: Nke a na-egosipụta omume mmadụ iweli anya ya elu n’ụzọ doro anya ma kwekọọ n’asụsụ Igbo nkịtị.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: δὲ bụ njikọ dị nro; “Mgbe ahụ” na-egosi otú akụkọ ahụ si aga n’ihu n’enweghị ime ka ọ bụrụ ọdịiche siri ike.
- source_word: εἶδεν
  choice: hụ
  rationale: “Hụ” bụ nsụgharị kwụ ọtọ nke omume ịhụ ihe, n’etinyeghị echiche ọzọ dịka ilebara anya pụrụ iche.
- source_word: τοὺς βάλλοντας
  choice: ka ha na-etinye
  rationale: Ọ bụ ezie na βάλλω nwere ike ịpụta ịtụba, “na-etinye” bụ okwu Igbo eke n’ọnọdụ inye onyinye, ma usoro “hụ ... ka ha na-” na-egosipụta participle ahụ nke ọma.
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: n’ebe a na-edebe onyinye
  rationale: γaζοφυλάκιον nwere ike ịbụ mpaghara ebe a na-edebe akụ onyinye ma ọ bụ ihe nnata onyinye; okwu a na-edobe obosara ihe ọ pụtara n’enweghị ịkọwapụta otu naanị.
- source_word: τὰ δῶρα αὐτῶν
  choice: onyinye ha
  rationale: “Onyinye” na-egosipụta δῶρα n’ụzọ eke ma nwee ike ịgụnye ihe e nyere Chineke ma ọ bụ ego e tinyere.
- source_word: πλουσίους
  choice: ndị ọgaranya
  rationale: Adjective Grik a na-arụ ọrụ dịka aha ndị mmadụ; “ndị ọgaranya” bụ ụzọ Igbo doro anya ma dị nkenke isi kwuo ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E tinyere akara ntụaka ụkwụ [a][b] ozugbo n’akụkụ okwu ha na-akọwa. A hapụrụ mgbagwoju anya dị na γαζοφυλάκιον ka ọ dị site n’iji okwu sara mbara na nkọwa ụkwụ.
