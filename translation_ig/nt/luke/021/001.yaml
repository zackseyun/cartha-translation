revisions:
- from: Mgbe ahụ, o leliri anya elu, hụ ndị ọgaranya ka ha na-etinye onyinye ha n’ebe a na-edebe onyinye[a][b].
  to: O wee weliri anya ya elu ma hụ ndị ọgaranya ka ha na-etinye onyinye ha[a] n’ebe nchekwa akụ[b].
  rationale: The revision improves idiomatic Standard Igbo syntax, gives γαζοφυλάκιον a treasury-oriented main-text rendering without deciding whether it denotes an area or receptacles, removes an unwarranted explicit reference to worshiping God from the lexical note, and aligns each footnote anchor with the expression it explains.
