    reason: cultural_note
  revision_rationale: The revision improves idiomatic Standard Igbo syntax, gives γαζοφυλάκιον a treasury-oriented main-text rendering without deciding whether it denotes an area or receptacles, removes an unwarranted explicit reference to worshiping God from the lexical note, and aligns each footnote anchor with the expression it explains.
