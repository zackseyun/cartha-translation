id: LUK.21.10
reference: Luke 21:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị ha, “Mba ga-ebili[a] megide mba, alaeze ga-ebilikwa megide alaeze.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-ebilite.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi oge ma jikọta okwu a na ihe ndị bu ya ụzọ n’akụkọ ahụ.
- source_word: ἔλεγεν
  choice: ọ sịrị
  rationale: Ọ bụ ụzọ Igbo dị mma isi webata okwu mmadụ kwuru; ọ naghị amanye echiche nke ikwughachi okwu ugboro ugboro nke imperfect nwere ike ịpụta.
- source_word: αὐτοῖς
  choice: ha
  rationale: N’usoro ‘ọ sịrị ha,’ ‘ha’ na-arụ ọrụ dị ka onye a gwara okwu, nke kwekọrọ na dative Grik.
- source_word: Ἐγερθήσεται
  choice: ga-ebili
  rationale: N’usoro okwu esemokwu a, ‘ga-ebili’ na-egosi ibili megide onye ọzọ n’enweghị itinye onye mpụga mere ka ọ bilie.
- source_word: ἔθνος
  choice: mba
  rationale: N’ebe a ọ na-ezo aka n’otu ndị ma ọ bụ obodo dị ka ike ndọrọ ndọrọ ọchịchị, ya mere ‘mba’ dabara na myirịta ya na ‘alaeze.’
- source_word: ἐπ’ ἔθνος
  choice: megide mba
  rationale: ἐπί tinyere accusative n’usoro okwu a na-egosi mmegide; ‘megide’ na-enye echiche ahụ nke ọma n’Igbo.
- source_word: βασιλεία
  choice: alaeze
  rationale: N’ebe a ọ pụtara alaeze ma ọ bụ mpaghara ọchịchị, ọ bụghị naanị ikike eze n’echiche nkịtị.
- source_word: ἐπὶ βασιλείαν
  choice: megide alaeze
  rationale: Dị ka nkebi okwu mbụ, ọ na-egosi mmegide n’etiti alaeze.
theological_decisions:
- issue: Usoro okwu banyere ọgba aghara nke oge ikpeazụ
  choice: A sụgharịrị ya dịka amụma doro anya na mba na alaeze ga-ebili megide ibe ha, n’etinyeghị usoro nkọwa pụrụ iche banyere oge ikpeazụ.
  alternative: Ịkọwa ya naanị dịka ihe metụtara ọdịda Jerusalem, ma ọ bụ dịka usoro oge zuru ezu nke ọgwụgwụ ụwa.
  rationale: Amaokwu ahụ n’onwe ya na-ekwu naanị na mba na alaeze ga-ebili megide ibe ha; ntụgharị asụsụ kwesịrị ịhapụ arụmụka sara mbara banyere oge ikpeazụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. ‘Mba’ na ‘alaeze’ na-edobe myirịta ndọrọ ndọrọ ọchịchị dị n’asụsụ Grik, ebe ‘megide’ na-egosipụta mmegide n’enweghị ịgbakwunye okwu dịka ‘agha’ nke na-adịghị n’amaokwu ahụ.
