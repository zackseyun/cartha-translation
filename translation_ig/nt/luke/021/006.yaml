  - severity: medium
    issue: “Ihe ndị a unu na-ele anya” is not the most natural Standard Igbo expression here.
    rationale: With a specified object, “ile anya” normally takes a complement such as “na ha.” “Ihe ndị a unu na-ahụ” is natural in the main text and adequately renders θεωρεῖτε; the more deliberate observational nuance can be supplied by a lexical footnote.
