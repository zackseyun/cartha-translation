  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: ig
  text: Banyere ihe ndị a unu na-ahụ[a]—ụbọchị ga-abịa mgbe a na-agaghị ahapụ otu nkume n’elu ibe ya nke a na-agaghị akwatu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ihe ndị a unu na-ele anya na ha.” Okwu Grik ahụ nwere ike ịpụta ịhụ ihe n’ozuzu, ma ọ bụ ile ya anya nke ọma.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “a gaghị ahapụ nkume n’elu nkume nke a na-agaghị akwatu”; nke a bụ ụzọ okwu na-egosi mbibi zuru ezu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: Ma ihe ndị a unu na-ele anya
  rationale: E tinyere Ταῦτα n’ihu iji mesie ihe ndị a na-ekwu banyere ha ike. “Unu na-ele anya” na-egosipụta omume na-aga n’ihu na echiche nke ileru anya nke θεωρεῖτε nwere.
- source_word: ἐλεύσονται ἡμέραι
  choice: ụbọchị ga-abịa
  rationale: Nke a bụ ụzọ okwu a na-ejikarị ekwu maka ihe ga-eme n’ọdịnihu; ọ na-edobekwa ọdịdị future nke Grik.
- source_word: ἐν αἷς
  choice: mgbe
  rationale: Ọ bụ nkebiokwu na-egosi oge; “mgbe” bụ ụzọ Igbo kachasị eke ma doo anya isi kwuo ya.
- source_word: οὐκ ἀφεθήσεται
  choice: a na-agaghị ahapụ
  rationale: Passive future nke ἀφίημι n’ebe a pụtara na ihe agaghị anọgide n’ọnọdụ ya; “a na-agaghị ahapụ” na-edobe olu passive na echiche nke demolition.
- source_word: λίθος ἐπὶ λίθῳ
  choice: otu nkume n’elu ibe ya
  rationale: Nke a bụ ụzọ okwu na-egosi mbibi zuru ezu. “Otu nkume n’elu ibe ya” bụ Igbo doro anya ma kwekọọ na onyinyo ụlọ e wuru nkume n’elu nkume.
- source_word: ὃς οὐ καταλυθήσεται
  choice: nke a na-agaghị akwatu
  rationale: καταλύω n’ọnọdụ a na-ekwu maka ịkwatu ma ọ bụ ịgbasa ihe owuwu. “Akwatu” bụ okwu Igbo dị ndụ, dị mfe, ma dabara n’ihe owuwu.
theological_decisions:
- issue: Oke na ike amụma Jizọs banyere ihe owuwu ụlọ nsọ
  choice: E gosipụtara ya dịka amụma doro anya banyere ịkwatu ihe owuwu ahụ kpamkpam.
  alternative: Ịkọwa ya nanị dịka ihe atụ nke ikpe, ma ọ bụ ijikọ ya ozugbo na usoro nkà mmụta banyere ọgwụgwụ ụwa.
  rationale: Grik ahụ na-ekwu kpọmkwem banyere ihe ndị a na-ahụ anya na nkume ndị a ga-akwatu. Nsụgharị ahụ na-edobe ihe ahụ o kwuru n’enweghị ịgbakwunye usoro ozizi nke amaokwu ahụ ekwughị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Unu” na-egosipụta onye nke abụọ n’ụbara dị na θεωρεῖτε. Ejighị okwu ụka pụrụ iche ma ọ bụ nkọwa eschatological agbakwunyere.
