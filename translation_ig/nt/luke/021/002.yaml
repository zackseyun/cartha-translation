  text: And he saw a poor widow putting in two small copper coins there,[a]
translation:
  language: ig
  text: Ọ hụkwara otu nwanyị di ya nwụrụ, bụ ogbenye, ka ọ na-etinye mkpụrụ ego ọla kọpa abụọ dị nnọọ nta n’ebe ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “lepta abụọ,” ya bụ, mkpụrụ ego ọla kọpa abụọ dị nnọọ nta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: Ọ hụrụ
  rationale: Oge aorist nke ὁράω na-akọ omume ahụ n'ụzọ dị mfe; “ọ hụrụ” bụ nsụgharị Igbo kwụ ọtọ ma kwekọọ n’usoro akụkọ.
- source_word: δέ
  choice: -kwara
  rationale: δέ bụ njikọ dị nro n’ebe a. Mgbakwunye “-kwara” na-ejikọta ahịrịokwu ahụ na ihe bu ya ụzọ n'ụzọ Igbo na-adịghị emesi ọdịiche ike.
- source_word: τινα
  choice: otu
  rationale: τις na-egosi onye a na-akọwaghị kpọmkwem. “Otu” na-egosipụta nke a n’Igbo eke karịa ịsị “otu onye kpọmkwem.”
- source_word: χήραν
  choice: nwanyị di ya nwụrụ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke a na-ejikarị akọwa χήρα, nwanyị di ya nwụrụ.
- source_word: πενιχρὰν
  choice: bú ogbenye
  rationale: πενιχρός na-egosi onye ihe ji aka n’ụzọ akụ na ụba. “Ogbenye” bụ okwu Igbo nkịtị ma ghara ime ka ọnọdụ ya sie ike karịa ihe okwu Grik kwuru.
- source_word: βάλλουσαν
  choice: ka ọ na-etinye
  rationale: Ọ bụ ezie na βάλλω pụrụ ịpụta ịtụba, n’ọnọdụ itinye ego n’ebe a na-edebe onyinye, “na-etinye” bụ okwu Igbo eke ma na-egosi omume ahụ nke ọma.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: ἐκεῖ bụ adverb na-egosi ebe; “n’ebe ahụ” na-ezo aka n’ebe e kwuru n’amaokwu bu ụzọ na-enweghị ịgbakwunye nkọwa ọzọ.
- source_word: λεπτὰ δύο
  choice: mkpụrụ ego ọla kọpa abụọ dị nnọọ nta
  rationale: λεπτά bụ mkpụrụ ego ọla kọpa ndị ọnụ ahịa ha pere nnọọ mpe. Nsụgharị a na-eme ka ụdị ego ahụ na ịdị nta ya doo onye na-agụ taa anya, ebe nkọwa ala peeji na-echekwa aha Grik.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. A họọrọ “nwanyị di ya nwụrụ” kama okwu nwere ike ịdị ochie ma ọ bụ ghara ido mmadụ niile anya. Akara ntụaka [a] dị n’ahịrịokwu ahụ, nkọwa ya echekwakwa aha mkpụrụ ego Grik.
