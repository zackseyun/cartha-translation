  text: ἐν τῇ ὑπομονῇ ὑμῶν ⸀κτήσασθε τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/019.yaml
  text: By your endurance you will gain your lives[a][b].
translation:
  language: ig
  text: Site n’ịta chi obi unu, nwetanu ndụ unu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “mkpụrụ obi unu”; okwu Grik ahụ nwere ike ịpụta “ndụ,” “onwe,” ma ọ bụ “mkpụrụ obi,” dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: ntachi obi
  rationale: “Ntachi obi” na-egosi ịnọgidesi ike n’okpuru ahụhụ na mkpagbu, ọ bụghị naanị ichere nwayọọ.
- source_word: κτήσασθε
  choice: unu ga-enweta
  rationale: N’agbanyeghị na ụdị okwu Grik a dị ka iwu, ihe ọ pụtara n’ọnọdụ a nwekwara ike igosi ihe ga-esi na ntachi obi pụta. “Unu ga-enweta” na-eme ka nsonaazụ ahụ doo anya n’Igbo; e debere ụdị iwu ahụ n’okpuru peeji.
- source_word: ψυχὰς
  choice: ndụ unu
  rationale: N’ebe a, ψυχή nwere ike ịpụta ndụ, mmadụ n’onwe ya, ma ọ bụ mkpụrụ obi. “Ndụ unu” dabara n’okwu gbasara mkpagbu, ọnwụ, na nzọpụta ikpeazụ, ma ọ naghị amachi okwu ahụ nanị n’akụkụ mmadụ a na-apụghị ịhụ anya.
- source_word: ἐν
  choice: site ná
  rationale: N’ebe a ἐν na-egosi ụzọ ma ọ bụ ihe e ji enweta nsonaazụ. “Site ná” bụ ụzọ Igbo doro anya ma dịkwa ụtọ isi kwuo ya.
theological_decisions:
- issue: Ihe ψυχή pụtara n’okwu gbasara mkpagbu na ọgwụgwụ oge
  choice: ndụ unu
  alternative: mkpụrụ obi unu; onwe unu
  rationale: “Ndụ unu” na-edobe echiche sara mbara nke okwu Grik ahụ ma zere ikwu na ọ bụ naanị akụkụ mmadụ a na-apụghị ịhụ anya ka a na-ekwu maka ya. Ọ na-ahapụkwa esemokwu dị n’etiti ihe ize ndụ anụ ahụ na nchekwa ikpeazụ ka ọ dị.
- issue: Ma κτήσασθε bụ iwu ka ọ bụ okwu na-egosi nsonaazụ ga-abịa
  choice: unu ga-enweta
  alternative: nwetanu
  rationale: Isi ederede na-ekwupụta nsonaazụ nke ntachi obi n’Igbo dị ugbu a, ebe ihe odide ala peeji na-echekwa ụdị iwu nke ngwaa Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ntachi obi” bụ okwu ndị nkịtị maara nke na-egosi ịtachi obi n’ule; “ndụ unu” na-echekwa echiche zuru mmadụ ọnụ n’ebughị ụzọ kpebie nkà mmụta banyere ahụ na mkpụrụ obi.
