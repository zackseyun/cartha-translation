  to: Site n’ịta chi obi unu, nwetanu ndụ unu[b].
  rationale: The revision changes the finite verb to the plural imperative “nwetanu,” matching κτήσασθε in the SBLGNT. It retains “Site n’ịta chi obi unu” for the instrumental sense of ἐν τῇ ὑπομονῇ ὑμῶν and “ndụ unu” for the broad contextual sense of ψυχάς. Footnote a is removed because the imperative is not merely a footnoted alternative in the stated source; the lexical alternative footnote is retained and its wording is made consistent with the possessive phrase.
