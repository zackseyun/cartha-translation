review_pass:
  verdict: revise
  source_fidelity: The SBLGNT text reads κτήσασθε, an aorist middle imperative. The draft’s future “unu ga-enweta” changes the clause into a prediction and is not supported by the stated source text. The instrumental rendering of ἐν and the contextual rendering of ψυχάς as “ndụ unu” are sound.
  naturalness: “Site n’ịta chi obi unu, nwetanu ndụ unu” is natural, clear Standard Igbo and retains the concise, exhortative force of the Greek. “Ntachi obi” is a well-established expression for steadfast endurance under hardship.
  terminology: “Ntachi obi” appropriately renders ὑπομονή. “Ndụ unu” responsibly conveys ψυχάς in this persecution context without forcing a body-versus-soul distinction. The lexical note may retain “mkpụrụ obi” and “onwe” as alternatives.
  issues:
  - severity: high
    issue: 'The main verb is translated as a future: “unu ga-enweta.”'
    rationale: κτήσασθε in the supplied SBLGNT text is an imperative, not a future. The target text should preserve its exhortative command rather than adopt the English audit trail’s interpretive future-like rendering.
  - severity: medium
    issue: Footnote a treats the imperative as merely a formal or textual alternative.
    rationale: For the supplied source text, the imperative is the reading to translate, not an optional alternative. Retaining that note would incorrectly imply that the future rendering is primary in the Greek.
  revised_text: Site n’ịta chi obi unu, nwetanu ndụ unu[b].
  revised_footnotes:
