    text: Ma ọ bụ, “mkpụrụ obi unu”; okwu Grik ahụ nwere ike ịpụta “ndụ,” “onwe,” ma ọ bụ “mkpụrụ obi,” dabere n’ọnọdụ e ji ya mee ihe.
    reason: lexical_alternative
  revision_rationale: The revision changes the finite verb to the plural imperative “nwetanu,” matching κτήσασθε in the SBLGNT. It retains “Site n’ịta chi obi unu” for the instrumental sense of ἐν τῇ ὑπομονῇ ὑμῶν and “ndụ unu” for the broad contextual sense of ψυχάς. Footnote a is removed because the imperative is not merely a footnoted alternative in the stated source; the lexical alternative footnote is retained and its wording is made consistent with the possessive phrase.
