  verdict: revise
  source_fidelity: The draft conveys the temporal genitive absolute, the two plural imperatives, the causal clause, and the approaching sense of ἐγγίζει. However, “mgbe ihe ndị a malitere ime” can read as a completed past event rather than the onset of the anticipated events; “bidoro ime” is clearer in this future-oriented setting.
  naturalness: “Gbatịanụ onwe unu kwụ ọtọ” is understandable but syntactically heavy and less idiomatic as an imperative. “Gbatịanụ onwe unu” naturally expresses straightening oneself up. “Welienụ isi unu elu” is natural, though the final “elu” is not necessary; retaining it preserves the image without harm.
  terminology: “Mgbapụta” is an appropriate Standard Igbo rendering of ἀπολύτρωσις and retains the source term’s breadth. The explanatory wording “ndị nke Jizọs” in footnote c is not natural Standard Igbo; “ndị na-eso ụzọ Jizọs” is clear, while the verse itself rightly does not add that identification.
  issues:
  - severity: medium
    issue: The opening temporal clause uses “malitere.”
    rationale: In this context it can be heard as simple past (“when these things began to happen”) rather than the beginning of events still anticipated. “Bidoro” more naturally marks the onset in a prospective temporal clause.
  - severity: medium
