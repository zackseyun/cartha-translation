    rationale: “Gbatịanụ onwe unu kwụ ọtọ” combines expressions in a way that is less natural than “Gbatịanụ onwe unu,” which adequately renders ἀνακύψατε without adding a second imperative-like element.
  - severity: low
    issue: Footnote c contains an unnatural possessive expression.
    rationale: “Ndị nke Jizọs” is not idiomatic here. “Ndị na-eso ụzọ Jizọs” supplies a natural equivalent for the audit trail’s explanatory phrase.
