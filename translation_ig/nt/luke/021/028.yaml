  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: ig
  text: Ma mgbe ihe ndị a bidoro ime[a], gbatịanụ onwe unu, weliekwanụ isi unu elu[b], n’ihi na mgbapụta unu na-eru nso[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ihe ndị a na-amalite ime.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “lelienụ anya elu ma welienụ isi unu elu.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị “mgbapụta” dị ka “nnapụta”; n’ebe a, ọ na-atụ aka ná nnapụta ikpeazụ nke ndị na-eso ụzọ Jizọs, nke na-eru nso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων ... τούτων γίνεσθαι
  choice: mgbe ihe ndị a malitere ime
  rationale: Nkebiokwu a na-egosi oge ihe ndị ahụ ga-amalite ime. Nsụgharị a na-echekwa ma echiche nke ‘ịmalite’ ma nke ‘ime/ịpụta’ n’Igbo doro anya.
- source_word: δέ
  choice: Ma
  rationale: ‘Ma’ na-egosi obere mgbanwe na ọdịiche dị n’etiti ahụhụ ndị a kọwara tupu ya na agbamume na-esote.
- source_word: ἀνακύψατε
  choice: gbatịanụ onwe unu kwụ ọtọ
  rationale: Okwu Grik a nwere ike ịpụta ịgbatị onwe mmadụ mgbe o hulatara. Nsụgharị a na-echekwa ihe ahụ mmadụ ji ahụ mee nakwa echiche nke inwe obi ike.
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: weliekwanụ isi unu elu
  rationale: Nke a na-echekwa oyiyi dị n’ederede Grik nke ibuli isi, nke na-egosi olileanya na obi ike.
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara ndị na-eso ụzọ ji kwesị ime ihe e nyere ha n’iwu.
- source_word: ἐγγίζει
  choice: na-eru nso
  rationale: Ụdị ngwaa a na-egosi na ihe ahụ nọ n’ịbịaru nso, ọ bụghị naanị na ọ dị nso n’ọnọdụ na-adịghị agbanwe agbanwe.
- source_word: ἀπολύτρωσις
  choice: mgbapụta
  rationale: ‘Mgbapụta’ bụ okwu Igbo nke na-echekwa echiche sara mbara nke ntọhapụ na nzọpụta, n’emeghị ka ọ bụrụ naanị ịnapụta mmadụ n’otu nsogbu.
theological_decisions:
- issue: Ihe ‘mgbapụta unu’ pụtara n’okwu banyere ihe ndị ga-eme n’ọdịnihu
  choice: E debere ya dị ka ‘mgbapụta unu,’ nke n’ọnọdụ a na-atụ aka ná mgbapụta ikpeazụ nke ndị na-eso Jizọs na-eru nso.
  alternative: Ịsụgharị ya naanị dị ka nnapụta ha n’otu nsogbu akụkọ ihe mere eme, ma ọ bụ ime ka ọ bụrụ naanị ọnọdụ ime mmụọ na-enweghị ihe gbasara ọdịnihu.
  rationale: Ọnọdụ okwu ahụ na-ele anya n’ihe ga-eme n’ọdịnihu na mmezu ikpeazụ. ‘Mgbapụta’ na-echekwa ịdị omimi nke okwu ahụ n’akọwaghị kpọmkwem ụzọ mgbapụta ahụ ga-esi mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere oyiyi ahụ nke ịgbatị onwe na ibuli isi iji gosipụta obi ike na olileanya, ma e zere ịgbakwunye nkọwa okpukpe nke ederede ahụ n’onwe ya na-ekwughị.
