  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: ig
  text: Mgbe ahụ, ha ga-ahụ Nwa nke Mmadụ ka ọ na-abịa n’ime igwe ojii, n’ike na ebube dị ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’elu igwe ojii.” Okwu Grik ahụ ji “n’ime igwe ojii,” ebe aha ahụ dị n’otu ọgụgụ; ma ihe oyiyi a na-eme ka a cheta Daniel 7 na akụkụ Akwụkwọ Nsọ ndị yiri ya, bụ́ ebe e kwuru banyere Nwa nke Mmadụ na ọbịbịa ya na igwe ojii.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: ha ga-ahụ
  rationale: Okwu a na-egosi ịhụ anya n’ọdịnihu; “ha ga-ahụ” bụ ụzọ Igbo dị mfe ma kwekọọ kpọmkwem n’echiche ahụ.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-edobe aha pụrụ iche ahụ na njikọ ya na Daniel 7, n’enweghị ibelata ya ka ọ bụrụ naanị nkọwa banyere mmadụ.
- source_word: ἐρχόμενον
  choice: ka ọ na-abịa
  rationale: Ụdị a na-egosi omume a na-ahụ ka ọ na-aga n’ihu, ma bụrụkwa okwu Igbo ebumpụta ụwa n’ọnọdụ a.
- source_word: ἐν νεφέλῃ
  choice: n’ime igwe ojii
  rationale: 'Ọ na-agbaso ἐν na aha dị n’otu n’otu: “n’ime otu igwe ojii,” kama ịgbanwe ya ka ọ bụrụ igwe ojii dị ọtụtụ.'
- source_word: μετὰ δυνάμεως
  choice: jiri ike
  rationale: N’ebe a μετά na-egosi ihe so onye ahụ n’ọbịbịa ya; “jiri ike” na-enye nke a n’Igbo doro anya ma dị ndụ.
- source_word: δόξης πολλῆς
  choice: ebube dị ukwuu
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma dị ugwu nke na-egosi ịdị ukwuu nke ebube ahụ.
theological_decisions:
- issue: Nsụgharị aha Kraịst τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: “Nwa nke Mmadụ” na-echekwa aha a maara nke ọma na ụda Daniel 7, n’etinyeghị nkọwa ozizi ọzọ n’ime ederede.
- issue: Ihe oyiyi igwe ojii na njikọ ya na Daniel 7
  choice: n’ime igwe ojii
  alternative: n’elu igwe ojii
  rationale: Nhọrọ a na-agbaso okwu Luk, nke ji aha dị n’otu n’otu na ἐν, kama ime ka ya kwekọọ n’ụzọ okwu akụkụ Akwụkwọ Nsọ ndị ọzọ si dị.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị mfe nghọta ma dị ugwu. E debere aha “Nwa nke Mmadụ” na ihe oyiyi igwe ojii n’ụzọ na-echekwa njikọ ederede ahụ na Daniel 7.
