revisions:
- from: Mgbe ahụ, ha ga-ahụ Nwa nke Mmadụ ka ọ na-abịa n’ime igwe ojii, jiri ike na ebube dị ukwuu.[a]
  to: Mgbe ahụ, ha ga-ahụ Nwa nke Mmadụ ka ọ na-abịa n’ime igwe ojii, n’ike na ebube dị ukwuu.[a]
  rationale: The revision preserves the Greek singular ἐν νεφέλῃ and the traditional titular expression while making the rendering of μετὰ δυνάμεως more natural and semantically precise in Igbo. The footnote is corrected to explain singular grammatical number accurately and to retain the Danielic allusion without overstating or changing Luke’s wording.
