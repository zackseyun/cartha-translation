  terminology: '“Ọnyà” is appropriate for παγίς. The current wording of footnote a is not natural or accurate: “e ji esi anụ” means using something to cook meat, not a trap for catching an animal. Footnote b can also preserve the resident/dweller sense more precisely in its alternative wording.'
