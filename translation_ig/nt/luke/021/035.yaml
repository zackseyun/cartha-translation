  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: ig
  text: dị ka ọnyà[a]. N’ihi na ọ ga-abịakwasị ndị niile bi n’elu ụwa dum[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ka ọnyà e ji ejide anụmanụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị niile bi n’elu ala dum.” Okwu Grik a pụkwara ịpụta “ala dum,” ọ bụ ezie na “ụwa dum” kacha dabara n’oke okwu a ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: dị ka ọnyà
  rationale: “Ọnyà” bụ okwu Igbo doro anya nke na-egosi ihe e ji ejide mmadụ ma ọ bụ anụmanụ na mberede, ma na-echekwa ike nke ihe atụ Grik ahụ.
- source_word: ἐπεισελεύσεται
  choice: ọ ga-abịakwasị
  rationale: Ngwaa a na-egosi ihe na-abịakwasị ma ọ bụ na-erute mmadụ na mberede. “Ọ” na-ezo aka n’ụbọchị ahụ a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-enye ihe kpatara ịdọ aka ná ntị dị n’okwu bu ụzọ.
- source_word: ἐπὶ πάντας
  choice: ndị niile
  rationale: E tinyere echiche ἐπί n’ime ngwaa “abịakwasị,” ebe “ndị niile” na-echekwa oke πάντας.
- source_word: τοὺς καθημένους
  choice: ndị niile bi
  rationale: Ọ bụ ezie na κάθημαι nwere ike ịpụta “ịnọdụ,” n’akpaalaokwu a ọ na-ezo aka ná ndị bi ma ọ bụ ndị nọ n’ụwa.
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: n’elu ụwa dum
  rationale: Nke a na-asụgharị akpaalaokwu pụtara n’elu ma ọ bụ n’elu ihu ụwa n’Igbo dị mfe ma dị ebube; “ụwa dum” na-egosipụta oke πάσης.
theological_decisions:
- issue: Oke ihe γῆ na-ezo aka na ya n’ịdọ aka ná ntị banyere ọgwụgwụ oge
  choice: ụwa dum
  alternative: ala ahụ dum
  rationale: γῆ nwere ike ịpụta “ala” ma ọ bụ “ụwa,” ma njikọ ya na “ndị niile bi n’elu” n’ebe a na-akwado nghọta zuru ụwa ọnụ, n’agbanyeghị na e debere ihe ọzọ ọ pụrụ ịpụta n’ala ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A hapụrụ mmalite iberibe ahịrịokwu ahụ ka o jikọọ na amaokwu bu ụzọ, dịka o si dị na isi mmalite Grik. E zere nsụgharị nkịtị nke “ndị nọ ọdụ” n’ihi na ọ gaghị ekwupụta akpaalaokwu ahụ nke ọma n’Igbo.
