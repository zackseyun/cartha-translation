id: LUK.21.11
reference: Luke 21:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: ig
  text: Oke ala ọma jijiji ga-adị, ụnwụ nri na ọrịa na-efe efe[a] ga-adịkwa n’ebe dị iche iche; ihe ndị na-emenye ụjọ na nnukwu ihe ịrịba ama[b] si n’eluigwe[c] ga-adịkwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ajọ ọrịa.” Okwu Grik λοιμοί na-ezo aka na ọrịa ọjọọ na-efe efe ma ọ bụ ntiwapụ ọrịa.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ihe ngosi dị egwu,” karịsịa n’okwu metụtara ihe ndị ga-eme n’ọdịnihu.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “na mbara igwe.” Okwu Grik οὐρανός nwere ike ịpụta eluigwe ma ọ bụ mbara igwe a na-ahụ anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί τε μεγάλοι
  choice: oke ala ọma jijiji
  rationale: “Ala ọma jijiji” bụ okwu Igbo a na-ejikarị akọwa σεισμός; “oke” na-egosi ịdị ukwuu ma ọ bụ ịdị njọ nke μεγαλοι n’ụzọ doro anya.
- source_word: κατὰ τόπους
  choice: n’ebe dị iche iche
  rationale: Nke a na-egosi na ihe ndị ahụ ga-eme n’ọtụtụ ebe, ọ bụghị naanị n’otu ebe.
- source_word: λιμοὶ
  choice: ụnwụ nri
  rationale: Okwu a pụtara ụkọ nri siri ike nke na-eweta agụụ, ya mere “ụnwụ nri” ka “ụkọ nri” nkịtị sie ike ma kwekọọ n’isi mmalite.
- source_word: λοιμοὶ
  choice: ọrịa na-efe efe
  rationale: Nke a bụ okwu Igbo doro anya maka ọrịa na-agbasa n’etiti ọtụtụ mmadụ; ọ na-egosipụta echiche nke ọrịa ọjọọ ma ọ bụ ntiwapụ ọrịa.
- source_word: φόβητρά
  choice: ihe ndị na-emenye ụjọ
  rationale: Ụdị ọtụtụ a na-ekwu maka ihe ma ọ bụ ihe omume ndị na-akpata nnukwu egwu; ntụgharị a bụ nke okike ma ghara ịkọwa kpọmkwem ụdị ihe ndị ahụ.
- source_word: σημεῖα
  choice: ihe ịrịba ama
  rationale: Nke a bụ ntụgharị sara mbara ma guzosie ike nke σημεῖα; ọ na-ahapụkwa ohere maka echiche nke ihe ịrịba ama dị egwu n’okwu amụma.
- source_word: ἀπ’ οὐρανοῦ
  choice: si n’eluigwe
  rationale: “Eluigwe” na-echekwa ma ụda okpukpe nke okwu ahụ ma ohere ọ nwere ịpụta mbara igwe; ihe odide ahụ akọwaghị kpọmkwem nke ọ bụ.
- source_word: ἔσονται / ἔσται
  choice: ga-adị
  rationale: Nke a na-egosipụta ụdị ọdịnihu nke εἰμί n’ụzọ Igbo dị mfe ma dabara n’usoro ihe ndị a ga-abịa.
theological_decisions:
- issue: Ihe οὐρανός pụtara n’okwu amụma a
  choice: si n’eluigwe
  alternative: si na mbara igwe
  rationale: “Eluigwe” na-echekwa njikọ okwu ahụ nwere ike inwe na Chineke, ma ihe odide Grik nwekwara ike na-ekwu maka mbara igwe a na-ahụ anya. Ihe odide isi na ndetu ala na-echekwa esemokwu a kama idozi ya n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. E chekwara usoro ndepụta na ụda egwu nke amaokwu Grik ahụ, ma zere okwu ochie ma ọ bụ nkọwa na-akwado otu ozizi pụrụ iche.
