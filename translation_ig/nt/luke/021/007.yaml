  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: ig
  text: Ha wee jụọ ya, sị, “Onye nkuzi, mgbe olezi ka ihe ndị a ga-eme? Gịnịkwa bụ ihe ịrịba ama mgbe ihe ndị a na-achọ ime?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnịkwa bụ ihe ịrịba ama mgbe ihe ndị a na-aga ime?” Okwu Grik ahụ nwere ike ịpụta n’ụzọ sara mbara karịa “na-achọ ime.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: Ha wee jụọ ya
  rationale: Ọ na-akọ otu ihe mere n’oge gara aga; ‘jụọ’ bụ okwu Igbo doro anya ma kwekọọ n’ajụjụ a kpọmkwem.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a, δέ na-aga n’ihu n’akụkọ ahụ n’enweghị nkwusi ike na mmegide; ‘wee’ na-eme ka usoro okwu Igbo gaa were were.
- source_word: λέγοντες
  choice: sị
  rationale: ‘Sị’ bụ ụzọ Igbo nkịtị na nke dị nkenke e si webata okwu onye kwuru, ma ọ na-anọchi participle λέγοντες nke ọma.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ pụtara onye na-akụzi; nhọrọ a na-ezere itinye echiche ikike ka ukwuu nke okwu dịka ‘Nna Ukwu’ nwere ike ibute.
- source_word: πότε οὖν
  choice: ole mgbe
  rationale: ‘Ole mgbe’ na-ajụ kpọmkwem banyere oge. Njikọ ya na ihe e kwuru tupu ya pụtara ìhè site n’usoro ajụjụ ahụ, ya mere ọ dịghị mkpa ịtinye okwu Igbo na-adịghị aga were were maka οὖν.
- source_word: ταῦτα ἔσται
  choice: ihe ndị a ga-eme
  rationale: Ọ bụ ụzọ Igbo ebumpụta ụwa isi kwuo na ihe ndị a ga-abịa na mmezu, kama ntụgharị nkịtị na-adịghị aga were were dịka ‘ga-adị.’
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ihe na-egosi na ihe dị mkpa ga-eme ma ọ bụ na-abịa.
- source_word: ὅταν
  choice: mgbe
  rationale: Ọ na-ewebata ọnọdụ oge nke na-ele anya n’ọdịnihu; ‘mgbe’ bụ ntụgharị Igbo doro anya.
- source_word: μέλλῃ
  choice: na-achọ ime
  rationale: Ọ na-echekwa echiche na ihe ndị ahụ na-abịaru nso ime, ma hapụkwa ohere maka nghọta sara mbara nke μέλλω.
- source_word: γίνεσθαι
  choice: ime
  rationale: N’ọnọdụ a, γίνομαι na-ekwu maka ihe omume na-ewere ọnọdụ; ‘ime’ bụ okwu Igbo dị mfe ma kwekọọ na ya.
theological_decisions:
- issue: Okwu banyere ihe ndị ga-eme n’ọdịnihu na nghọta oge ha
  choice: E chekwara arịrịọ maka ‘ihe ịrịba ama,’ ma sụgharịa μέλλῃ dịka ‘na-achọ ime.’
  alternative: A pụrụ ịsụgharị ya dịka ‘ga-eme’ ma ọ bụ ‘na-aga ime.’
  rationale: ‘Na-achọ ime’ na-edobe echiche nke ihe na-abịaru nso nke dị na μέλλῃ, ma ọ naghị ekpebi kpọmkwem ma ihe ndị ahụ ọ̀ ga-eme ozugbo ma ọ bụ mgbe ogologo oge gasịrị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ha wee jụọ ya, sị’ bụ usoro okwu Igbo ebumpụta ụwa; ‘Onye Ozizi’ na ‘ihe ịrịba ama’ na-edobe isi okwu Grik n’enweghị itinye nkọwa otu ụka.
