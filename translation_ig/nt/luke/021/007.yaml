    text: Ma ọ bụ, “Gịnịkwa bụ ihe ịrịba ama mgbe ihe ndị a na-aga ime?” Okwu Grik ahụ nwere ike ịpụta n’ụzọ sara mbara karịa “na-achọ ime.”
    reason: lexical_alternative
  revision_rationale: The revision makes the temporal question idiomatic, represents οὖν with the natural particle «-zi», and removes the unnecessary future copula from the question about the sign. It retains «na-achọ ime» for μέλλῃ so that the Greek sense of impending occurrence is preserved without imposing a particular interpretation of the timing.
