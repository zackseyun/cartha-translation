review_pass:
  verdict: revise
  source_fidelity: The addition “n’aka ndị iro” (“into the hands of enemies”) is not stated in the Greek. Although hostile opponents may be inferred from the context, the source leaves the recipient of the handing-over unspecified. The remaining clauses accurately convey the future passive, the ascensive “even,” the kinship list, and “some of you.”
  naturalness: The revised wording is fluent Standard Igbo. Commas clarify the coordinated kinship list, and “ga-enyefe unu” naturally expresses being handed over without adding an unstated recipient.
  terminology: “Ndị mụrụ unu,” “ụmụnne unu ndị nwoke,” “ndị ikwu unu,” and “ndị enyi unu” are appropriate modern Igbo equivalents. The footnote preserves the possible inclusive force of the Greek masculine plural without altering the main-text rendering.
  issues:
  - severity: medium
    issue: The phrase “n’aka ndị iro” is an unsupported addition.
    rationale: παραδοθήσεσθε specifies that the disciples will be handed over by the named family members and friends, but it does not identify those to whom they will be handed over. Adding “enemies” narrows and expands the source unnecessarily.
  - severity: low
    issue: The footnote’s phrase “ọtụtụ nke nwoke” is not idiomatic Standard Igbo.
    rationale: “Ọtụtụ okwu nwoke” more naturally expresses a masculine plural form in this explanatory context.
  revised_text: Ma ọbụna ndị mụrụ unu, ụmụnne unu ndị nwoke[a], ndị ikwu unu, na ndị enyi unu ga-enyefe unu; ha ga-egbu ụfọdụ n’ime unu.
