id: LUK.21.16
reference: Luke 21:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: ig
  text: Ma ọbụna ndị mụrụ unu, ụmụnne unu ndị nwoke[a], ndị ikwu unu, na ndị enyi unu ga-enyefe unu; ha ga-egbu ụfọdụ n’ime unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnne unu, ma ndị nwoke ma ndị nwanyị,” ebe ọ bụ na ọtụtụ okwu nwoke n’asụsụ Grik nwere ike mgbe ụfọdụ ịgụnye ụmụnne nwoke na ụmụnne nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: ga-enyefe unu n’aka ndị iro
  rationale: Ụdị ngwaa ọdịnihu a na-anabata omume pụtara na a ga-enyefe ha n’aka ndị ga-emegide ha. Ịgbakwunye “n’aka ndị iro” na-eme ka echiche nke inyefe mmadụ n’aka ndị na-achọ imerụ ya doo anya n’Igbo, n’agbanyeghị na ndị na-enyefe ha bụ ndị ezinụlọ na ndị enyi.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ntakịrị ọdịiche dị n’etiti nkwa e nyere n’amaokwu bu ụzọ na ahụhụ a na-akọ ugbu a.
- source_word: καὶ
  choice: ọbụna
  rationale: 'Na-emesi ihe a na-atụghị anya ya ike: ọ bụghị naanị ndị ọzọ, kama ọbụna ndị ha na ha kacha dịrị nso ga-enyefe ha.'
- source_word: γονέων
  choice: ndị mụrụ unu
  rationale: Ọ bụ ụzọ Igbo nkịtị ma doo anya isi kwuo nne na nna ọnụ.
- source_word: ἀδελφῶν
  choice: ụmụnne unu ndị nwoke
  rationale: Na-edobe ụdị ọtụtụ nke nwoke dị na Grik, ma na-enye nkọwa ọzọ n’ala peeji n’ihi na okwu ahụ nwekwara ike ịgụnye ụmụnne nwanyị n’ọnọdụ ụfọdụ.
- source_word: συγγενῶν
  choice: ndị ikwu unu
  rationale: Na-ekpuchi ndị ezinụlọ na ndị otu agbụrụ mmadụ n’ụzọ dị mfe ma bụrụ Igbo nke oge a.
- source_word: φίλων
  choice: ndị enyi unu
  rationale: Ọ bụ ntụgharị kwụ ọtọ na nke nkịtị nke φίλων.
- source_word: θανατώσουσιν
  choice: ha ga-egbukwa
  rationale: Na-egosi ime ka mmadụ nwụọ n’ụzọ a kpachapụrụ anya, n’enweghị ịkọwa kpọmkwem ụzọ e si gbuo ya.
- source_word: ἐξ ὑμῶν
  choice: ụfọdụ n’ime unu
  rationale: 'Na-enye ihe akpaalaokwu Grik ahụ pụtara n’Igbo nkịtị: ọ bụghị ha niile, kama ụfọdụ ndị nọ n’etiti ha.'
theological_decisions:
- issue: Oke ihe ἀδελφῶν na-agụnye n’usoro aha ndị ikwu
  choice: ụmụnne unu ndị nwoke
  alternative: ụmụnne unu, ma ndị nwoke ma ndị nwanyị
  rationale: Isi ederede na-edobe ụdị nwoke nke okwu Grik ahụ kama ime ya ka ọ ghara igosi okike. N’agbanyeghị nke ahụ, n’usoro okwu gbasara ndị ikwu, ọtụtụ nke nwoke nwere ike mgbe ụfọdụ ịgụnye ụmụnne nwoke na ụmụnne nwanyị; ya mere, e debere ohere ahụ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A haziri ndepụta ndị na-eme ihe ahụ ka ọ na-aga nke ọma n’Igbo, ma e debere nkwusiri ike nke “ọbụna” na ọdịiche nke “Ma.”
