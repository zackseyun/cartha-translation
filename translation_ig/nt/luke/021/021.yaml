  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: ig
  text: Mgbe ahụ, ka ndị nọ na Judia gbaga n’ugwu; ka ndị nọ n’etiti ya[a] pụọ; ka ndị nọ n’ime ime obodo ghara ịbanye n’ime ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nnọchiaha “ya” ugboro abụọ n’amaokwu a na-ezo aka na Jerusalem. N’asụsụ Grik, nnọchiaha ndị ahụ bụ nke ụdị nwanyị, dịka a na-ekwu maka obodo Jerusalem.
    reason: Iji mee ka ebe nnọchiaha ahụ na-ezo aka doo anya ma chekwaa ụdị nwanyị nke nnọchiaha Grik.
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe ga-esochi ihe ịrịba ama ndị a kpọrọ aha n’amaokwu bu ụzọ.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ndị nọ na Judia
  rationale: Ọ na-ezo aka n’ebe ndị ahụ nọ, n’asụsụ Igbo doro anya ma bụrụkwa nke e ji eme ihe taa.
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: ka ... gbaga n’ugwu
  rationale: “Gbaga” na-egosi ịgba ọsọ gaa ebe mgbaba, ebe usoro “ka ...” na-eburu ike nke iwu onye nke atọ dị na Grik.
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: ndị nọ n’etiti ya
  rationale: E debere nnọchiaha “ya” kama itinye aha Jerusalem n’ime amaokwu ahụ; ihe gbara amaokwu ahụ gburugburu na-akọwa onye a na-ezo aka na ya.
- source_word: ἐκχωρείτωσαν
  choice: ka ... pụọ
  rationale: “Pụọ” bụ okwu Igbo nkịtị ma sie ike nke pụtara isi n’ebe ahụ laa, n’enweghị nkọwa agbakwunyere na-adịghị n’isi mmalite.
- source_word: οἱ ἐν ταῖς χώραις
  choice: ndị nọ n’ala ime obodo
  rationale: Nhọrọ a na-egosi ala ndị dị n’èzí obodo ahụ, ọ bụghị ubi a kọrọ akọ kpọmkwem.
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: ka ... ghara ịbanye n’ime ya
  rationale: Ọ na-echekwa iwu mgbochi dị na Grik, tinyere echiche nke ịbanye n’ime ebe ahụ.
theological_decisions:
- issue: Ihe αὐτῆς na αὐτήν na-ezo aka na ya
  choice: E ji “ya” mee ihe n’ahịrịokwu, ma kọwaa na ndetu ala peeji na ọ na-ezo aka na Jerusalem.
  alternative: Ikwughachi “Jerusalem” ma ọ bụ “obodo ahụ” n’ahịrịokwu.
  rationale: Amaokwu 20 mere Jerusalem ka ọ bụrụ ebe okwu a na-aga n’ihu na-ekwu maka ya. Edeghị aha ahụ ọzọ n’amaokwu 21, ya mere “ya” na-echekwa njikọ na ntakịrị mgbagwoju anya nke isi mmalite n’enweghị ịmanye nkọwa ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro iwu atọ yiri ibe ha—“ka ... gbaga,” “ka ... pụọ,” na “ka ... ghara ịbanye”—chekwaa ngwangwa na nhazi okwu Grik.
