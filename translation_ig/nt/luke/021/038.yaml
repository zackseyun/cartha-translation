reference: Luke 21:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: ig
  text: Ndị mmadụ niile na-abịakwute ya n’isi ụtụtụ n’ogige ụlọnsọ ukwu[a] ka ha gee ya ntị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ogige ụlọnsọ ukwu” na-ezo aka n’ụlọ nsọ dum na ogige ya, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: Ndị mmadụ niile
  rationale: Nke a na-egosi ndị mmadụ n’ozuzu ha n’ụzọ a na-asụkarị n’Igbo, n’ebughị n’uche na ọ ga-abụrịrị onye ọ bụla n’otu n’otu.
- source_word: ὤρθριζεν
  choice: na-abịakwute ... n’isi ụtụtụ
  rationale: Ụdị imperfect na-egosi omume ha na-eme ugboro ugboro; ‘n’isi ụtụtụ’ na-echekwa echiche nke ibili ma ọ bụ ịbịa n’oge.
- source_word: πρὸς αὐτόν
  choice: na-abịakwute ya
  rationale: Nke a na-egosi ije bịakwute Jizọs ma na-edobe nnọchiaha dị na isi mmalite.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ogige ụlọnsọ ukwu
  rationale: ἱερόν na-ezo aka n’ụlọ nsọ dum na ogige ya, ọ bụghị kpọmkwem ebe nsọ dị n’ime; ‘ogige ụlọnsọ ukwu’ na-eme ka nke a doo anya n’Igbo.
- source_word: ἀκούειν αὐτοῦ
  choice: ka ha gee ya ntị
  rationale: Infinitive a na-egosi ebumnuche ha ji abịa; ‘gee ya ntị’ bụ ụzọ Igbo si egosi ịnụrụ onye na nlebara anya.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ugwu. E ji usoro ‘na-abịakwute’ gosipụta omume a na-eme ugboro ugboro.
