id: LUK.21.33
reference: Luke 21:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ig
  text: Eluigwe na ụwa ga-agabiga, ma okwu m agaghị agabiga ma ọlị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “okwu m agaghị agabiga mgbe ọ bụla.” N’asụsụ Grik, e ji ngọnarị e mesiri ike (οὐ μή) mee ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: Eluigwe
  rationale: N’ebe a, okwu a jikọrọ ya na ‘ụwa’ iji gosi ihe niile e kere eke n’eluigwe na n’ụwa; ya mere ‘Eluigwe’ dabara karịa ‘mbara igwe’ nkịtị.
- source_word: ἡ γῆ
  choice: ụwa
  rationale: N’usoro okwu ‘Eluigwe na ụwa,’ γῆ pụtara ụwa dum, ọ bụghị otu ala ma ọ bụ obodo.
- source_word: παρελεύσονται
  choice: ga-agabiga
  rationale: Okwu a na-egosi na ihe ndị a ga-akwụsị ịdị otú ha dị. ‘Ga-agabiga’ na-edobe ọdịdị okwu ahụ na nkwekọrịta dị n’etiti akụkụ abụọ nke amaokwu ahụ.
- source_word: δὲ
  choice: ma
  rationale: ‘Ma’ na-egosi ọdịiche siri ike dị n’etiti ihe eluigwe na ụwa ga-eme na ihe okwu Jizọs na-agaghị eme.
- source_word: οἱ λόγοι μου
  choice: okwu m
  rationale: Nke a na-ezo aka n’okwu Jizọs kwuru; ‘okwu m’ bụ ntụgharị kpọmkwem, dịkwa mfe nghọta n’Igbo.
- source_word: οὐ μὴ
  choice: agaghị … ma ọlị
  rationale: οὐ μή bụ ngọnarị e mesiri ike. Usoro Igbo ‘agaghị … ma ọlị’ na-egosipụta ike ahụ n’asụsụ dị ndụ ma doo anya.
theological_decisions:
- issue: Ike nkwupụta Jizọs banyere ịdịgide nke okwu ya
  choice: ‘okwu m agaghị agabiga ma ọlị’
  alternative: ‘okwu m agaghị agabiga mgbe ọ bụla’
  rationale: A hapụghị οὐ μή ka ọ bụrụ naanị ngọnarị nkịtị. ‘Ma ọlị’ na-edobe nkwusi ike zuru oke nke Grik n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. E debere nkwughachi ‘ga-agabiga/agaghị agabiga’ iji chekwaa nhazi na ọdịiche siri ike dị n’amaokwu Grik.
