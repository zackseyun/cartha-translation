source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: ig
  text: Otú ahụ ka unu kwa, mgbe unu hụrụ ihe ndị a na-eme[a], maranụ na alaeze Chineke[b] dị nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị a na-ewere ọnọdụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọchịchị Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: N’otu aka ahụ, unu onwe unu
  rationale: Nke a na-egosi na Jizọs na-etinye ihe atụ ahụ ọ ka kwuru n’ọrụ nye ndị na-ege ya ntị. ‘Unu onwe unu’ na-egosipụta nkwusi ike dị n’aha nnọchi ὑμεῖς nke e dere kpọmkwem.
- source_word: ὅταν ἴδητε
  choice: mgbe unu hụrụ
  rationale: Ọ na-egosi ọnọdụ a na-atụ anya ya n’ọdịnihu; okwu a bụ nke doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ταῦτα γινόμενα
  choice: ihe ndị a ka ha na-eme
  rationale: Ọ na-ezo aka n’ihe ịrịba ama ndị a kọwara tupu amaokwu a, ma na-egosikwa na ihe ndị ahụ na-eme n’ezie. E debere ụzọ ọzọ e nwere ike isi kwuo ya n’ala peeji.
- source_word: γινώσκετε
  choice: maranụ
  rationale: Ụdị iwu a na-agwa ndị na-eso ụzọ ka ha mata ihe ihe ịrịba ama ndị ahụ pụtara; ‘maranụ’ na-enye iwu ahụ n’ụzọ dị mfe ma kwụ ọtọ.
- source_word: ἐγγύς ἐστιν
  choice: dị nso
  rationale: Nke a na-edobe echiche nke ịdị nso n’oge ma ọ bụ n’ọnọdụ, n’etinyeghị nkọwa karịrị ihe ederede ahụ kwuru.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Igbo a maara nke ọma nke na-edobe ma echiche alaeze ma echiche ọchịchị Chineke, n’emeghị ka ihe ọ pụtara dị warara.
theological_decisions:
- issue: Ihe ‘alaeze Chineke’ pụtara n’ihe gbasara oge ikpeazụ
  choice: A hapụrụ ya dịka ‘alaeze Chineke.’
  alternative: ‘ọchịchị Chineke’ ma ọ bụ ịkọwa ya dịka mmezu ikpeazụ nke ọchịchị Chineke
  rationale: Amaokwu ahụ jikọtara ịdị nso nke alaeze Chineke na ihe ịrịba ama ndị e kwuru, ma ọ kọwaghị ma ọ bụ ngosipụta ya, mmezu ya zuru oke, ma ọ bụ nkwado ọchịchị Chineke ka e bu n’obi kpọmkwem. Nsụgharị a na-edobe ohere ndị ahụ n’emeghị mkpebi n’esemokwu gbasara oge ikpeazụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Unu onwe unu’ na-eburu nkwusi ike nke ὑμεῖς, ebe ‘alaeze Chineke’ na-edobe okwu Akwụkwọ Nsọ a maara nke ọma na nghọta ya sara mbara.
