revisions:
- from: N’otu aka ahụ, unu onwe unu, mgbe unu hụrụ ihe ndị a ka ha na-eme[a], maranụ na alaeze Chineke[b] dị nso.
  to: Otú ahụ ka unu kwa, mgbe unu hụrụ ihe ndị a na-eme[a], maranụ na alaeze Chineke[b] dị nso.
  rationale: The revision corrects the idiom for ongoing events, smooths the comparative application, and retains the imperative, future-contingent setting, nearness language, and the broad biblical term “alaeze Chineke.” Footnote anchors remain attached to the relevant expressions.
