review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the central sense accurately: the disciples are to recognize, on seeing the stated events occurring, that God''s kingdom is near. However, “ihe ndị a ka ha na-eme” is not an idiomatic or accurate way to express ταῦτα γινόμενα; it can suggest that the things themselves are performing an action. “Ihe ndị a na-eme” naturally means “these things are happening.” “Unu kwa” retains the inclusive/applicative force of καὶ ὑμεῖς without adding the somewhat heavy reflexive emphasis of “unu onwe unu.”'
  naturalness: The revision uses clear, contemporary Standard Igbo. “Otú ahụ ka unu kwa” is a more natural application of the preceding comparison than the draft's “N’otu aka ahụ, unu onwe unu,” and “ihe ndị a na-eme” is idiomatic.
  terminology: “Alaeze Chineke” is an established, suitably broad rendering of ἡ βασιλεία τοῦ θεοῦ. It preserves the source phrase without resolving its eschatological implications. The alternative “ọchịchị Chineke” is appropriately retained as a lexical alternative.
  issues:
  - severity: medium
    issue: The phrase “ihe ndị a ka ha na-eme” is unidiomatic and may misconstrue the participial construction.
    rationale: ταῦτα γινόμενα means “these things happening/taking place.” In Standard Igbo, “ihe ndị a na-eme” expresses this directly; inserting “ka ha” makes the events sound as though they are agents doing something.
  - severity: low
    issue: “Unu onwe unu” overstates the explicit pronoun and sounds cumbersome in this clause.
    rationale: The explicit ὑμεῖς has emphasis, but καὶ also carries “also/likewise.” “Unu kwa” represents the application to the hearers naturally without introducing stronger reflexive force than the Greek requires.
  revised_text: Otú ahụ ka unu kwa, mgbe unu hụrụ ihe ndị a na-eme[a], maranụ na alaeze Chineke[b] dị nso.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị a na-ewere ọnọdụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọchịchị Chineke.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the idiom for ongoing events, smooths the comparative application, and retains the imperative, future-contingent setting, nearness language, and the broad biblical term “alaeze Chineke.” Footnote anchors remain attached to the relevant expressions.
