  to: Ma ọ sịrị, “Kpacharanụ anya ka a ghara iduhie unu. N’ihi na ọtụtụ mmadụ ga-abịa n’aha m, na-asị, ‘Ọ bụ m,’ nakwa, ‘Oge ahụ adịla nso.’ Unu esokwala ha.”
