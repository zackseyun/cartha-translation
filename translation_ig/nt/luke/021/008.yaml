  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: ig
  text: Ma ọ sịrị, “Kpacharanụ anya ka a ghara iduhie unu. N’ihi na ọtụtụ mmadụ ga-abịa n’aha m, na-asị, ‘Ọ bụ m,’ nakwa, ‘Oge ahụ adịla nso.’ Unu esokwala ha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: Kpacharanụ anya ka a ghara iduhie unu
  rationale: Nkebi a na-enye ịdọ aka ná ntị ka ndị na-ege ntị mụrụ anya, ka ndị ọzọ ghara iduhie ha. Ọ na-egosikwa ụdị okwu passive dị n’asụsụ Grik.
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: ga-abịa n’aha m
  rationale: Nke a na-edobe okwu banyere ndị ga-eji aha Jizọs ma ọ bụ kwuo na ha nwere ikike ya bịa, n’ebughị nkọwa karịrị ihe isi mmalite kwuru.
- source_word: Ἐγώ εἰμι
  choice: Ọ bụ m
  rationale: N’Igbo, nke a bụ ụzọ ebumpụta ụwa isi kwuo nkwupụta njirimara, ‘I am he/the one,’ ma ọ naghị etinye okwu ‘Mesaya’ nke na-adịghị n’ihe odide Grik.
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: Oge ahụ eruola nso
  rationale: ‘Oge ahụ’ na-egosi oge pụrụ iche a na-ekwu banyere ya, ebe ‘eruola nso’ na-edobe mmetụta perfect tense nke ihe bịaruru nso ma ka dị nso ugbu a.
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: Unu esokwala ha
  rationale: Nke a bụ okwu Igbo doro anya nke na-amachibido iso ndị nduhie ahụ ma ọ bụ ịghọ ndị na-eso ụzọ ha.
theological_decisions:
- issue: Otu e si sụgharịta Ἐγώ εἰμι n’okwu ndị na-azọrọ ihe na-abụghị eziokwu
  choice: Ọ bụ m
  alternative: Abụ m; Ọ bụ m bụ Mesaya
  rationale: ‘Ọ bụ m’ na-egosi na onye ahụ na-azọrọ na ya bụ onye a na-atụ anya ya, ma ọ naghị ekpebi hoo haa na okwu e zoro aka na ya bụ ‘Mesaya.’ Ihe ọzọ okwu ahụ nwere ike ịpụta ka echekwara n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ụdị plural ‘unu’ n’ihi na Jizọs na-agwa ọtụtụ ndị okwu. E debere mgbagwoju anya dị na nkwupụta ‘Ἐγώ εἰμι’ kama ịkọwa ya hoo haa dịka ‘Abụ m Mesaya.’
