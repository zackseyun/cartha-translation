source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: ig
  text: 'N’ezie, ana m asị unu: ọgbọ a[a] agaghị agabiga ma ọlị ruo mgbe ihe niile[b] ga-eme[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ndị mmadụ a” ma ọ bụ “oge a.” A pụrụ ịghọta okwu Grik ahụ n’ụzọ karịrị otu, ọ bụ ezie na “ọgbọ” bụ ntụgharị ya kacha kwụ ọtọ.
    reason: alternative_reading
  - marker: b
    text: Ụfọdụ ntụgharị sụgharịrị ya “ihe ndị a niile,” na-ewere “ndị a” site n’ihe ndị gbara amaokwu a gburugburu; ma Grik dị ebe a kwuru naanị “ihe niile.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ga-ewere ọnọdụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’ezie
  rationale: Ọ na-ewebata nkwupụta siri ike nke nwere ikike. “N’ezie” bụ Igbo doro anya ma bụrụkwa nke a na-asụ n’ụzọ ebumpụta ụwa.
- source_word: λέγω ὑμῖν
  choice: ana m asị unu
  rationale: Nke a na-edobe usoro okwu Grik ahụ ma na-ada nke ọma n’Igbo ugbu a.
- source_word: οὐ μὴ παρέλθῃ
  choice: agaghị agabiga ma ọlị
  rationale: οὐ μή na aorist subjunctive bụ nkwụsi ike siri ike na ihe ahụ agaghị eme. “Ma ọlị” na-egosipụta ike nkwụsi ike a.
- source_word: ἡ γενεὰ αὕτη
  choice: ọgbọ a
  rationale: “Ọgbọ a” bụ ntụgharị kacha nso na nke kachasị mfe maka γενεὰ αὕτη, ebe a hapụrụ ajụjụ banyere kpọmkwem ndị ọ na-ezo aka na ha ka ọ ghara idozi esemokwu nkọwa n’ime isiokwu ahụ.
- source_word: ἕως ἂν
  choice: ruo mgbe
  rationale: Ọ bụ njikọ oge ebumpụta ụwa n’Igbo, na-egosi ókè oge ihe e kwuru tupu ya ga-erute.
- source_word: πάντα
  choice: ihe niile
  rationale: Grik ahụ kwuru “ihe niile” n’enweghị okwu pụtara “ndị a”; ya mere a tụkwasịghị “ndị a” n’isiokwu.
- source_word: γένηται
  choice: ga-eme
  rationale: N’ebe a γίνομαι pụtara ime ma ọ bụ ịbịa n’eziokwu. “Ga-eme” bụ okwu Igbo dị mfe, ebumpụta ụwa, nke na-adịghị atụkwasị echiche siri ike nke “imezu” n’ihe odide ahụ.
theological_decisions:
- issue: Ihe “ọgbọ a” pụtara n’okwu gbasara ihe ndị ga-eme n’ọdịnihu
  choice: E tinyere ya dịka “ọgbọ a” n’isiokwu, n’ebughị ụzọ kpebie kpọmkwem ndị ọ na-ezo aka na ha.
  alternative: “ndị a,” “oge a,” ma ọ bụ ọgbọ ga-ahụ ihe ịrịba ama ndị ahụ
  rationale: Okwu Grik ahụ n’onwe ya pụtara “ọgbọ a” n’ụzọ kwụ ọtọ, ma a na-arụrịta ụka banyere ihe ọ na-ezo aka na ya. Ntụgharị a na-echekwa esemokwu nkọwa ahụ kama idozi ya n’isiokwu.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ana m asị unu” kama okwu ochie ma ọ bụ nke siri ike; “ma ọlị” na-eme ka nkwụsi ike nke οὐ μή pụta ìhè. E debere akara nkọwa ụkwụ n’akụkụ okwu nke ọ bụla ha na-akọwa.
