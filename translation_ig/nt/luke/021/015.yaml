id: LUK.21.15
reference: Luke 21:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: ig
  text: N’ihi na m ga-enye unu okwu na amamihe nke ndị niile na-emegide unu na-agaghị enwe ike iguzogide ma ọ bụ ịgbagha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: okwu
  rationale: Ọ bụ ezie na ihe okwu Grik pụtara kpọmkwem bụ “ọnụ,” n’ebe a ọ na-anọchi anya okwu e nyere ndị na-eso ụzọ ikwu. “Okwu” na-eme ka echiche ahụ doo onye Igbo nke oge a anya n’enweghị ịgbanwe ọrụ ya n’ahịrịokwu ahụ.
- source_word: σοφίαν
  choice: amamihe
  rationale: “Amamihe” bụ okwu Igbo kwesịrị ekwesị maka σοφία ma na-echekwa ọdịiche dị n’etiti ihe ha ga-ekwu na nghọta ga-eduzi okwu ha.
- source_word: ἀντιστῆναι
  choice: iguzogide
  rationale: “Iguzogide” na-egosipụta echiche nke ịkwụ megide okwu ma ọ bụ onye na-ekwu ya.
- source_word: ἀντειπεῖν
  choice: ịgbagha
  rationale: “Ịgbagha” na-egosipụta nzaghachi nke na-emegide ma ọ bụ na-agọnahụ ihe e kwuru, ma na-edobe ya iche na “iguzogide.”
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: ndị niile na-emegide unu
  rationale: Nke a bụ ntụgharị doro anya na nke ebumpụta ụwa nke na-echekwa ma echiche mmegide ma ἅπαντες, “niile.”
theological_decisions:
- issue: Onye na-enye okwu na amamihe
  choice: E debere “m” dịka isiokwu kpọmkwem n’okwu Jizọs.
  alternative: Ikwu n’ozuzu na Chineke ga-enye ha okwu.
  rationale: ἐγώ pụtara “m,” ya bụ Jizọs onye na-ekwu okwu n’akụkụ a; ekwesịghị ịgbanwe onye e kwuru na ọ ga-enye ha ihe ndị a.
- issue: Oke nke nkwa ahụ
  choice: “Agaghị enwe ike iguzogide ma ọ bụ ịgbagha” na-echekwa nkwupụta abụọ ahụ n’enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya dị ka nkwa na ndị iro agaghị emerili ha n’ụzọ ọ bụla.
  rationale: Amaokwu ahụ lekwasịrị anya n’okwu na amamihe a ga-enye ha na enweghị ike nke ndị iro iguzogide ma ọ bụ ịgbagha ha; ntụgharị ahụ ekwesịghị ịgbasa nkwa ahụ gafee ihe ederede kwuru.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “okwu” kama ntụgharị nkịtị “ọnụ” n’ihi na nke ahụ bụ ụzọ ebumpụta ụwa Igbo si akọwa ike ikwu okwu e nyere mmadụ n’ọnọdụ a. E chekwara njikọ “ma ọ bụ” dị n’ihe odide Grik.
