  verdict: approve
  source_fidelity: Ntụgharị ahụ na-edobe ἐγώ γάρ (“N’ihi na m”), δώσω ὑμῖν (“m ga-enye unu”), na nkwa banyere okwu na amamihe. “Okwu” bụ ntụgharị metonimik kwesịrị ekwesị nke στόμα n’ọnọdụ a, ebe okwu ahụ pụtara ike ma ọ bụ ihe a ga-ekwu; ọ dabakwara na ụzọ ntụgharị Bekee POB si sụgharịa ya. A chekwara akụkụ abụọ ἀντιστῆναι ἢ ἀντειπεῖν dịka “iguzogide ma ọ bụ ịgbagha,” nakwa ἅπαντες dịka “ndị niile.”
  naturalness: Ahịrịokwu a bụ Standard Igbo doro anya, dị mma maka agụmagụ Akwụkwọ Nsọ nke oge a. Njikọ “nke ndị niile na-emegide unu na-agaghị enwe ike…” na-ezo n’azụ n’ụzọ ziri ezi n’ebe “okwu na amamihe” dị.
  terminology: “Amamihe,” “iguzogide,” “ịgbagha,” na “ndị niile na-emegide unu” bụ nhọrọ ziri ezi ma dabara n’akwụkwọ. Enweghị okwu nkà mmụta okpukpe ma ọ bụ aha chọrọ mgbanwe.
