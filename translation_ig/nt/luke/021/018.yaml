  text: And not a hair from your head will perish[a].
translation:
  language: ig
  text: Ọ dịghịkwa otu ntutu isi unu ga-ala n’iyi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ kpọmkwem karịa, “Ọ dịghịkwa otu ntutu isi unu ga-ala n’iyi ma ọlị.” Asụsụ Grik ji njụ abụọ eme ka nkwenye a sie ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: E tinyere njikọ a n’okwu “dịghịkwa” ka ọ nọgide na-ejikọta amaokwu a na ihe bu ya ụzọ, n’enweghị ịgbakwunye echiche nke mmegide.
- source_word: θρὶξ
  choice: otu ntutu isi
  rationale: Aha otu ihe a na-egosi ọbụna otu ntutu; ya na “ọ dịghị” jikọrọ ọnụ, ọ na-enye echiche nke na ọ dịghị nke ọ bụla ga-ala n’iyi.
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: isi unu
  rationale: N’Igbo, “otu ntutu isi unu” bụ ụzọ ebumpụta ụwa isi kwuo ntutu si n’isi ndị a na-agwa okwu, na-enweghị ntụgharị okwu siri ike dịka “site n’isi unu.”
- source_word: οὐ μὴ
  choice: Ọ dịghị ... ga-
  rationale: Nhazi a na-enye nkwupụta jụrụ ajụ siri ike ma doo anya n’Igbo, kwekọrọ na nkwusi ike nke οὐ μή na Grik.
- source_word: ἀπόληται
  choice: ala n’iyi
  rationale: “Ịla n’iyi” na-eburu echiche nke ịla n’iyi ma ọ bụ ịla n’iyi kpamkpam, ma ọ naghị amanye nkọwa na ọ bụ nanị mbibi anụ ahụ.
theological_decisions:
- issue: Esemokwu a na-ahụ anya n’etiti nkwa a na amụma dị nso banyere mkpagbu na ọnwụ
  choice: E debere okwu ahụ dịka nkwenye ilu siri ike na ọ dịghị ọbụna otu ntutu ga-ala n’iyi.
  alternative: Ịkọwa ya n’ime amaokwu ahụ dịka nkwa na ọ dịghị mmerụ anụ ahụ ọ bụla ga-eru ndị na-eso ụzọ.
  rationale: Ihe ndị gbara amaokwu a gburugburu na-ekwu na a ga-akpagbu ndị na-eso ụzọ, ọbụnakwa gbuo ụfọdụ. Ya mere, ntụgharị ahụ na-edebe nkwusi ike na esemokwu dị n’okwu ahụ, kama idozi ya site n’ịgbakwunye nkọwa ozizi n’ime amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị nsọ n’ụzọ kwesịrị ekwesị. Nhazi “Ọ dịghịkwa otu...” bụ nke ndị mmadụ na-aghọta ngwa ngwa ma na-echekwa njikọ, otu ntutu ahụ, na nkwusi ike nke njụ Grik.
