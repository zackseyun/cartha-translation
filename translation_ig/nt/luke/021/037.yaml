reference: Luke 21:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: ig
  text: N’ehihie, ọ na-ezi ihe n’ụlọ nsọ[a], ma n’abalị, ọ na-apụ gaa nọrọ abalị[b] n’ugwu a na-akpọ Ugwu Oliv.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ ἱερόν, nke pụtara ogige ụlọ nsọ ahụ dum, ọ bụghị naanị ebe nsọ dị n’ime ụlọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “nọrọ ebe ahụ n’abalị”; okwu Grik ahụ nwekwara ike ịpụta ịnọ abalị n’èzí.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: ọ na-ezi ihe
  rationale: Ụdị ‘na-’ na Igbo na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; nke a dabara n’omume Jizọs na-emekarị n’oge ahụ.
- source_word: τὰς ἡμέρας
  choice: N’ehihie
  rationale: Nke a bụ ụzọ Igbo dị mfe ma doo anya isi gosi oge ehihie, ma chekwaa ọdịiche dị n’etiti ehihie na abalị.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọ nsọ
  rationale: ‘Ụlọ nsọ’ bụ okwu ndị Igbo maara maka ụlọ nsọ dị na Jerusalem; ihe odide ala peeji na-akọwa na ἱερόν pụtara ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
- source_word: τὰς δὲ νύκτας
  choice: ma n’abalị
  rationale: ‘Ma’ na-egosi ọdịiche δέ wetara, ebe ‘n’abalị’ bụ okwu Igbo ebumpụta ụwa maka omume abalị a na-eme ugboro ugboro.
- source_word: ἐξερχόμενος
  choice: ọ na-apụ gaa
  rationale: Nke a na-egosi na ọ na-esi n’ebe ahụ pụọ mgbe niile, gaa n’ebe ọzọ.
- source_word: ηὐλίζετο
  choice: nọrọ abalị
  rationale: Nkebiokwu a na-egosi ịnọ n’otu ebe ruo abalị gafee, n’etinyeghị n’ihe odide isi echiche a na-ejighị n’aka banyere ma ọ nọ n’èzí kpọmkwem.
- source_word: εἰς τὸ ὄρος
  choice: n’ugwu
  rationale: Ọ bụ ezie na εἰς na-egosikarị ebe a na-aga, n’ebe a ọ na-akọwa ebe ọ gara nọrọ abalị; ‘n’ugwu’ bụ Igbo dị mma maka ọnọdụ ahụ.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: a na-akpọ Ugwu Oliv
  rationale: Nke a sụgharịrị aha ebe ahụ n’ụzọ ndị na-agụ Igbo ga-aghọta, ma chekwaa usoro okwu Grik nke na-ekwu na ọ bụ ugwu a na-akpọ aha ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. E jiri usoro ‘ọ na-’ gosipụta omume ọ na-emekarị, ma debe ọdịiche doro anya n’etiti ehihie na abalị.
