id: LUK.5.5
reference: Luke 5:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: ig
  text: Saịmọn wee zaa sị[a], “Nna Ukwu, anyị dọgburu onwe anyị n’ọrụ abalị dum ma anyị ejideghị ihe ọ bụla; ma n’ihi okwu gị[b], aga m eweda ụgbụ ndị ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu ya n’ụzọ nkịtị bụ “Saịmọn zara, sị.”
    reason: Akpaokwu Grik ahụ ji participle na ngwaa ‘sị’; ntụgharị isi na-eji usoro Igbo ebumpụta ụwa.
  - marker: b
    text: A pụkwara ịsụgharị ya “dabere n’okwu gị” ma ọ bụ “n’ihi na i kwuru ya.”
    reason: Akụkụ Grik ἐπὶ τῷ ῥήματί σου nwere ike igosi ihe e ji mee ihe ma ọ bụ ihe kpatara ime ya.
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: wee zaa sị
  rationale: Nke a bụ ụzọ Igbo si akọwa n'ụzọ ebumpụta ụwa akpaokwu Grik nke pụtara ‘ọ zara, sị,’ na-enweghị ime ka asụsụ sie ike.
- source_word: Ἐπιστάτα
  choice: Nna Ukwu
  rationale: Aha a na-egosi onye isi nwere ikike, ma ọ bụghị κύριος (‘Onyenwe anyị’). ‘Nna Ukwu’ na-egosipụta nkwanye ùgwù na ikike n’Igbo n’etinyeghị ihe aha ọzọ pụtara n’ime ya.
- source_word: δι’ ὅλης νυκτός
  choice: abalị dum
  rationale: Ọ na-egosi na ọrụ ahụ gara n’ihu n’ime abalị ahụ niile; nke a bụ okwu Igbo doro anya ma dị mfe.
- source_word: κοπιάσαντες
  choice: anyị dọgburu onwe anyị n’ọrụ
  rationale: Ngwaa Grik ahụ na-emesi ike na ha rụrụ ọrụ siri ike ruo n’ókè ike gwụrụ ha; akpaokwu Igbo a na-ebupụta ịdị arọ nke mbọ ahụ.
- source_word: οὐδὲν ἐλάβομεν
  choice: anyị ejideghị ihe ọ bụla
  rationale: N’ọnọdụ ịkụ azụ, λαμβάνω pụtara ijide azụ; ‘ihe ọ bụla’ na-edebe okwu ahụ n’ozuzu dịka Grik si dị, ebe ihe a na-ekwu maka ya doro anya site n’ọnọdụ ahụ.
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: ma n’ihi okwu gị
  rationale: ἐπί ya na dative ebe a na-egosi ihe e ji mee ihe ma ọ bụ ihe kpatara ime ya. ‘N’ihi okwu gị’ bụ Igbo ebumpụta ụwa, ma ndetu ala na-echekwa ohere ịghọta ya dịka ‘dabere n’okwu gị.’
- source_word: χαλάσω
  choice: aga m eweda
  rationale: Ọ na-ezo aka n’iweda ụgbụ n’ime mmiri; ọdịnihu onye mbụ otu ka e chekwara.
- source_word: τὰ δίκτυα
  choice: ụgbụ ndị ahụ
  rationale: E chekwara ọtụtụ nke okwu Grik ahụ. ‘Ndị ahụ’ na-egosi ụgbụ a maara site n’ọnọdụ ahụ.
theological_decisions:
- issue: Ntughari aha Jizọs bụ Ἐπιστάτα
  choice: Nna Ukwu
  alternative: Onyenwe anyị
  rationale: Isi mmalite ji ἐπιστάτης, ọ bụghị κύριος. Ya mere, a họọrọ aha na-egosi nkwanye ùgwù na ikike n’ebughị ụzọ tinye ibu nkà mmụta okpukpe nke ‘Onyenwe anyị’ nwere ike ibu.
- issue: Ihe ἐπὶ τῷ ῥήματί σου pụtara
  choice: n’ihi okwu gị
  alternative: dabere n’okwu gị
  rationale: Akụkụ Grik ahụ nwere ike igosi ihe mere Saịmọn ji mee ihe ahụ ma ọ bụ ihe ọ dabere na ya. E debere nghọta ọzọ na ndetu ala ka a ghara ikpochapụ mgbagwoju anya ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. E ji ‘dọgburu onwe anyị n’ọrụ’ mee ka mbọ siri ike nke κοπιάσαντες pụta ìhè. A zere ‘Onyenwe anyị’ n’ihi na okwu Grik ebe a abụghị κύριος.
