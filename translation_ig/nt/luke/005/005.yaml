  source_fidelity: 'The translation accurately represents the Greek: Simon''s reply, the respectful title Ἐπιστάτα as “Nna Ukwu,” strenuous all-night labor, the failure to catch anything, Simon''s action on the basis of Jesus'' word, the future promise, and the plural “nets” are all retained. “N’ihi okwu gị” appropriately conveys the basis/cause nuance of ἐπὶ τῷ ῥήματί σου without introducing doctrinal interpretation.'
