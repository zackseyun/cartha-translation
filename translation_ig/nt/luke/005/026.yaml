- from: Ihe ijuanya jidere ha niile, ha nọkwa na-enye Chineke otuto. Egwu jukwara ha, ha na-asị, “Anyị ahụla ihe ndị pụrụ iche taa.”[a]
  to: Ihe ijuanya jidere ha niile, ha nọkwa na-enye Chineke otuto. Egwu jukwara ha, ha na-asị, “Anyị ahụla ihe ndị na-adịghị ahụkebe taa.”[a]
  rationale: Only the rendering of παράδοξα and its supporting note have been adjusted. The revision avoids the potentially weaker sense “special” while retaining the source’s open sense of extraordinary, remarkable, or unexpected events.
