  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: ig
  text: Ihe ijuanya jidere ha niile, ha nọkwa na-enye Chineke otuto. Egwu jukwara ha, ha na-asị, “Anyị ahụla ihe ndị na-adịghị ahụkebe taa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe ndị dị ịrịba ama” ma ọ bụ “ihe ndị dị iche na nke a na-ahụkarị”; okwu Grik ahụ na-ekwu maka ihe ndị karịrị ihe mmadụ na-atụ anya ya n’ọnọdụ nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: ihe ijuanya
  rationale: N’ebe a, okwu ahụ na-egosi oke ijuanya jidere ìgwè mmadụ, ọ bụghị ọnọdụ ime mmụọ a na-akpọ ecstasy.
- source_word: ἔλαβεν ἅπαντας
  choice: jidere ha niile
  rationale: Nke a na-echekwa ike dị n’ilu Grik nke pụtara na ijuanya ahụ jidere onye ọ bụla.
- source_word: ἐδόξαζον
  choice: ha nọkwa na-enye Chineke otuto
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu; ‘na-enye ... otuto’ bụkwa ụzọ Igbo dị n’usoro e si asụ ya maka δοξάζω.
- source_word: θεόν
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo a na-ejikarị eme ihe maka θεός n’ebe a.
- source_word: ἐπλήσθησαν φόβου
  choice: Egwu jukwara ha
  rationale: Nke a na-asụ Igbo nke ọma ma na-echekwa ‘egwu’ n’ụzọ doro anya, n’ebelataghị ya ka ọ bụrụ naanị nsọpụrụ ma ọ bụ oke mmasị.
- source_word: λέγοντες
  choice: ha na-asị
  rationale: Nke a na-egosi omume ha na-eme mgbe ahụ ma na-ebute okwu ha kwuru n’ụzọ eke.
- source_word: Εἴδομεν
  choice: Anyị ahụla
  rationale: Ụdị a na-egosi na ihe ha hụrụ ka nwere mmetụta ozugbo n’oge ha na-ekwu okwu.
- source_word: παράδοξα
  choice: ihe ndị pụrụ iche
  rationale: Ọ na-egosi ihe ndị karịrị ihe a na-atụ anya ịhụ n’ọnọdụ nkịtị, n’enweghị echiche ọjọọ okwu dịka ‘ihe ndị dị ịtụnanya’ nwere ike iweta n’ọnọdụ ụfọdụ.
- source_word: σήμερον
  choice: taa
  rationale: Nke a bụ ntụgharị oge doro anya nke na-echekwa ịdị nso nke ihe ahụ mere.
theological_decisions:
- issue: Ihe φόβος pụtara mgbe ndị mmadụ hụrụ ọrụ Chineke
  choice: egwu
  alternative: oke nsọpụrụ / ụjọ jupụtara n’ịsọpụrụ Chineke
  rationale: ‘Egwu’ na-echekwa nghọtahie na esemokwu mmetụta dị n’ederede—ma ụjọ ma nsọpụrụ n’ihu ọrụ Chineke—n’akọwaghị ya naanị dị ka ‘awe.’
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ahịrịokwu abụọ mee ka usoro okwu ahụ bụrụ nke eke n’Igbo, ebe a ka chekwara usoro omume na-aga n’ihu na mmetụta nke egwu.
