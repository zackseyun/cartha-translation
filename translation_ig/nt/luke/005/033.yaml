  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: ig
  text: Ha wee sị ya, “Ndị na-eso ụzọ Jọn na-ebukarị ọnụ ma na-ekpe ekpere arịrịọ; otu ahụkwa ka ndị nke ndị Farisii[a] na-eme, ma ndị nke gị[b] na-eri ihe ma na-aṅụ ihe ọṅụṅụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-eso ụzọ ndị Farisii.” N’asụsụ Grik, ọ bụ naanị “ndị nke ndị Farisii”; a na-aghọta “ndị na-eso ụzọ” site n’ahịrịokwu bu ya ụzọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-eso ụzọ gị.” N’asụsụ Grik, ọ bụ naanị “ndị nke gị”; a na-aghọta “ndị na-eso ụzọ” site n’ihe gbara okwu ahụ gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: Ha wee sị ya
  rationale: ‘Wee’ na-egosi njikọ dị nro nke δέ n’akụkọ ahụ, n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: μαθηταὶ Ἰωάννου
  choice: Ndị na-eso ụzọ Jọn
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ndị μαθηταί metụtara Jọn.
- source_word: νηστεύουσιν πυκνά
  choice: na-ebukarị ọnụ
  rationale: ‘Na-ebu ọnụ’ na-enye νηστεύω, ebe ‘-karị’ na-egosi ugboro ugboro nke πυκνά.
- source_word: δεήσεις ποιοῦνται
  choice: na-ekpe ekpere arịrịọ
  rationale: Nke a na-echekwa ụdị aha δεήσεις na echiche ekpere a na-arịọsi ike, kama ime ya naanị ‘na-ekpe ekpere.’
- source_word: ὁμοίως καὶ
  choice: otu ahụkwa
  rationale: Ọ na-egosipụta ma myirịta nke ὁμοίως ma mgbakwunye nke καί n’Igbo eke.
- source_word: οἱ τῶν Φαρισαίων
  choice: ndị Farisii
  rationale: Okwu Grik hapụrụ ‘ndị na-eso ụzọ’ n’echiche; Igbo a na-echekwa nhapụ ahụ ma na-eme ka okwu ahụ gaa were were.
- source_word: οἱ δὲ σοὶ
  choice: ma ndị nke gị
  rationale: Ọ na-echekwa mkpụmkpụ na nhapụ dị na Grik, ebe ihe gbara ya gburugburu na-egosi na ọ bụ ndị na-eso ụzọ ya.
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: na-eri ihe ma na-aṅụ ihe ọṅụṅụ
  rationale: Oge ugbu a na-egosi omume a na-emekarị; ụdị Igbo a bụ nke eke ma doo anya.
theological_decisions:
- issue: Ma a ga-etinye ‘ndị na-eso ụzọ’ n’ahịrịokwu banyere ndị Farisii na ndị nke Jizọs
  choice: 'E debere nhapụ okwu ahụ n’isi ederede: ‘ndị Farisii’ na ‘ndị nke gị.’'
  alternative: ‘ndị na-eso ụzọ ndị Farisii’ na ‘ndị na-eso ụzọ gị’
  rationale: Grik ekwughachighị μαθηταί n’ebe abụọ ahụ. Idobe nhapụ ahụ na-egosi usoro isi mmalite, ma ihe gbara okwu ahụ gburugburu ka na-eme ka ihe ọ pụtara doo anya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nhapụ abụọ nke Grik n’isi ederede, ma kọwaa ha n’okpuru peeji.
