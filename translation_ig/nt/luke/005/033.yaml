  to: Ha wee sị ya, “Ndị na-eso ụzọ Jọn na-ebukarị ọnụ ma na-ekpe ekpere arịrịọ; otu ahụkwa ka ndị nke ndị Farisii[a] na-eme, ma ndị nke gị[b] na-eri ihe ma na-aṅụ ihe ọṅụṅụ.”
  rationale: E dochiri «ndị Farisii» anya na «ndị nke ndị Farisii» ka ntụgharị ahụ ghara ịsị na ndị Farisii n’onwe ha bụ ndị na-ebu ọnụ ma na-ekpe ekpere n’ebe Grik na-ezo, site n’ellipsisi, aka n’ndị na-eso ụzọ ha. A hapụrụ «ndị nke gị» ka mkpirisi okwu nke isi mmalite dịgide, ma a dozie nkọwa ala peeji ka ọ bụrụ Standard Igbo na-aga were were.
