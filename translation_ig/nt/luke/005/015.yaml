  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: ig
  text: Ma akụkọ banyere ya na-agbasawanye karị[a], ọtụtụ ìgwè mmadụ na-abịakọta ka ha nụ, ma ka a gwọọ ha ọrịa ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwu banyere ya” ma ọ bụ “ozi banyere ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο
  choice: nọ na-agbasawanye
  rationale: Ụdị imperfect na-egosi na akụkọ ahụ nọgidere na-agbasa; okwu a bụ Igbo dị mfe ma na-egosipụta omume na-aga n’ihu.
- source_word: μᾶλλον
  choice: karịa
  rationale: 'Ọ na-echekwa ike ntụnyere ahụ: akụkọ ahụ gbasara karịa ka ọ gbasaworo na mbụ.'
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: akụkọ banyere ya
  rationale: N’ebe a λόγος pụtara akụkọ ma ọ bụ ozi a na-akọ banyere Jizọs, ọ bụghị aha nkà mmụta okpukpe pụrụ iche.
- source_word: συνήρχοντο
  choice: na-ezukọkwa
  rationale: Ọ na-egosi nzukọ ndị mmadụ nke na-aga n’ihu ma ọ bụ na-eme ugboro ugboro, dịka imperfect Greek si dị.
- source_word: ὄχλοι πολλοὶ
  choice: ọtụtụ igwe mmadụ
  rationale: Ọ na-echekwa echiche nke ìgwè mmadụ dị ọtụtụ n’asụsụ Igbo a na-aghọta nke ọma.
- source_word: ἀκούειν
  choice: ka ha nụrụ okwu ya
  rationale: Greek hapụrụ ihe ha ga-anụ n’ime nghọta okwu; ịgbakwunye ‘okwu ya’ n’Igbo na-eme ka ebumnuche ahụ doo anya n’enweghị ịgbanwe ihe akụkọ ahụ pụtara.
- source_word: θεραπεύεσθαι
  choice: ka a gwọọkwa ha
  rationale: 'Ọ na-echekwa passive infinitive: ha bụ ndị a na-agwọ, ọ bụghị ndị na-agwọ onwe ha.'
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: ọrịa ha
  rationale: N’ọnọdụ ọgwụgwọ a, ἀσθένεια na-ezo aka n’ọrịa anụ ahụ; usoro ‘gwọọ ha ọrịa ha’ bụ Igbo eke ma doo anya.
theological_decisions:
- issue: Ụdị ọgwụgwọ a na-ekwu maka ya
  choice: Jiri okwu doro anya banyere ịgwọ ọrịa anụ ahụ.
  alternative: Jiri okwu sara mbara dịka ime ka ha zuo oke, nke pụrụ ịgụnye mgbake ime mmụọ.
  rationale: Akụkọ gbara amaokwu a gburugburu na-ekwu maka ndị bịara ịnụ na ka a gwọọ ha ọrịa; amaokwu ahụ ekwughị kpọmkwem maka ọgwụgwọ ime mmụọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro na-aga n’ihu mee ihe iji gosipụta imperfect Greek, ma zere okwu ụka pụrụ iche na-adịghị n’isi mmalite.
