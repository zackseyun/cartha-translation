revisions:
- from: Ndị odeakwụkwọ na ndị Farisii wee malite ịtụgharị uche, na-asị, “Ònye bụ onye a nke na-ekwu okwu nkwulu? Ònye pụrụ ịgbaghara mmehie ma e wezụga naanị Chineke?”
  to: Ndị odeakwụkwọ Iwu na ndị Farisii wee malite ịtụgharị uche, na-asị, “Ònye bụ onye a nke na-ekwu okwu nkwulu? Ònye pụrụ ịgbaghara mmehie ma e wezụga Chineke naanị ya?”
  rationale: The revision clarifies the historically specific sense of γραμματεῖς and smooths the exception idiom. It retains the source’s deliberative ambiguity, the plural-force accusation of blasphemous speech, and the speakers’ unsoftened claim that God alone can forgive sins.
