source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: ig
  text: Ndị odeakwụkwọ Iwu na ndị Farisii wee malite ịtụgharị uche, na-asị, “Ònye bụ onye a nke na-ekwu okwu nkwulu? Ònye pụrụ ịgbaghara mmehie ma e wezụga Chineke naanị ya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: wee malite ịtụgharị uche
  rationale: “Malite” na-egosipụta ἤρξαντο, ebe “ịtụgharị uche” na-eburu echiche nke ịtụle okwu n’obi ma ọ bụ n’etiti onwe ha n’enweghị ikpebi na ọ bụ naanị echiche nzuzo ma ọ bụ mkparịta ụka ọnụ.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ndị ọkachamara n’Iwu n’akụkọ Oziọma, ma na-anọgide nso n’usoro okwu Grik.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: A sụgharịghị aha òtù ahụ; e dere ya n’ụdị a maara nke ọma n’Igbo.
- source_word: λαλεῖ βλασφημίας
  choice: na-ekwu okwu nkwulu
  rationale: “Okwu nkwulu” na-enye Igbo dị mfe ma dị ùgwù maka ebubo nke ikwu okwu na-akparị Chineke; ụdị “okwu” nwekwara ike ịgụnye ọtụtụ okwu dịka plural Grik si dị.
- source_word: ἁμαρτίας ἀφεῖναι
  choice: ịgbaghara mmehie
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwupụta ịhapụ mmadụ mmehie ya.
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: ma e wezụga naanị Chineke
  rationale: Nke a na-edobe ma echiche nke mwepu dị na εἰ μή ma nkwusi ike nke μόνος.
- source_word: Τίς ἐστιν οὗτος
  choice: Ònye bụ onye a
  rationale: Ọ naghị atụkwasị “nwoke” nke na-adịghị na Grik; ọ na-echekwakwa ụda ajụjụ na-adịghị mma nke ndị na-ekwu okwu.
theological_decisions:
- issue: Ihe ikike Jizọs ịgbaghara mmehie na-egosi
  choice: 'E debere ebubo ahụ kpọmkwem: naanị Chineke pụrụ ịgbaghara mmehie.'
  alternative: Ịkọwa n’ụzọ ga-eme ka nkwupụta ahụ ghara ịdị nnọọ ike, ma ọ bụ ịgbakwụnye nkwubi okwu banyere onye Jizọs bụ.
  rationale: Amaokwu ahụ na-enye echiche ndị odeakwụkwọ na ndị Farisii, ma hapụ esemokwu nkà mmụta okpukpe ahụ ka akụkọ Luk gaa n’ihu kọwaa ya; ntụgharị ahụ ekwesịghị idozi ya site n’ịgbakwụnye ihe na-adịghị n’ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu sitere n’okwu ọnụ nkịtị, ma e chekwara ụda ajụjụ abụọ na esemokwu dị n’amaokwu ahụ.
