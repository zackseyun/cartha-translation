source:
  edition: SBLGNT
  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: ig
  text: Ha wee jiri aka gosi ndị ha na ha na-arụkọ ọrụ nọ n’ụgbọ mmiri nke ọzọ ka ha bịa nyere ha aka[a]. Ha wee bịa, mejupụta ụgbọ mmiri abụọ ahụ, nke mere na ụgbọ mmiri ndị ahụ malitere imikpu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ha bịa sonyere ha n’ọrụ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nke mere na ụgbọ mmiri ndị ahụ na-emikpu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: mee ... ihe aka
  rationale: Okwu a na-egosi iji mmegharị ahụ ma ọ bụ aka zie ndị nọ n’ebe dịtụ anya ozi; ‘mee ... ihe aka’ bụ Igbo nkịtị dabara n’ọnọdụ ụgbọ mmiri.
- source_word: μετόχοις
  choice: ndị ha na ha na-arụkọ ọrụ
  rationale: N’ọnọdụ a, ọ na-ezo aka n’ụmụazụ azụ ibe ha ma ọ bụ ndị ha na ha jikọrọ aka n’ọrụ, ọ bụghị naanị ndị enyi.
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: ndị nọ n’ụgbọ mmiri nke ọzọ
  rationale: Nke a na-ekewa ụgbọ mmiri ahụ na nke ha nọ n’ime ya n’ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe.
- source_word: τοῦ ἐλθόντας
  choice: ka ha bịa
  rationale: Ihe owuwu a na-egosi ebumnuche nke ihe aka ahụ.
- source_word: συλλαβέσθαι αὐτοῖς
  choice: nyere ha aka
  rationale: N’ebe a, ngwaa ahụ pụtara isonyere ha n’ọrụ ahụ iji nyere ha aka; nsụgharị a bụ ihe doro anya ma dịkwa eke n’Igbo.
- source_word: ἔπλησαν
  choice: ejupụtakwa
  rationale: Ọ na-echekwa oyiyi nke ime ka ụgbọ mmiri abụọ ahụ jupụta; ihe jupụtara ha—azụ—pụtara ìhè site n’okwu ndị gbara ya gburugburu.
- source_word: ἀμφότερα τὰ πλοῖα
  choice: ụgbọ mmiri abụọ ahụ
  rationale: Ọ na-egosipụta kpọmkwem na ọ bụ ụgbọ mmiri abụọ ahụ niile.
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: nke mere na ha malitere imikpu
  rationale: Ọ na-egosi nsonaazụ na-aga n’ihu n’ebughị ụzọ kwuo na ụgbọ mmiri ndị ahụ mikpuru kpamkpam.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ndị ha na ha na-arụkọ ọrụ’ na-ezere okwu azụmahịa siri ike ma na-echekwa echiche nke ndị mmekọ n’ọrụ ịkụ azụ. Akara ntụaka [a] na [b] dị n’ahịrịokwu ebe ha kwesịrị ịdị.
