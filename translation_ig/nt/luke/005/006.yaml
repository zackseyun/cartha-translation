  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: ig
  text: Mgbe ha mere nke a, ha ji ụgbụ ha gbaa nnukwu ìgwè azụ gburugburu[a], ụgbụ ha wee na-adọka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ha jidere ọtụtụ azụ.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “gbachie gburugburu” ma ọ bụ “mechie,” na-egosi na ụgbụ ahụ gbara azụ ndị ahụ gburugburu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ụgbụ ha nọ na-amalite ịdọka.” Ụdị ngwaa Grik ahụ na-egosi na ịdọka ahụ ka na-aga n’ihu, ọ bụghị na ụgbụ ndị ahụ adọkala kpamkpam.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: Mgbe ha mere nke a
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebi oge n’Igbo dị mfe ma doo anya, na-egosi na ha buru ụzọ mee ihe Jizọs kwuru tupu ihe sochirinụ emee.
- source_word: συνέκλεισαν
  choice: ha mechibidoro ... n’ụgbụ ha
  rationale: Nhọrọ a na-echekwa onyonyo nke imechi azụ gburugburu n’ụgbụ kama iji naanị okwu pụtara ‘jide,’ nke ga-eme ka nkọwa ahụ dị warara.
- source_word: πλῆθος ἰχθύων πολύ
  choice: nnukwu ìgwè azụ
  rationale: Okwu a na-egosi nnukwu ọnụọgụ azụ ma na-echekwa nkwusi ike dị na πλῆθος na πολύ n’Igbo e ji eme ihe ugbu a.
- source_word: διερρήσσετο
  choice: wee na-adọka
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu, ya mere ‘na-adọka’ anaghị ekwu na ụgbụ ndị ahụ adọkala kpamkpam.
- source_word: τὰ δίκτυα αὐτῶν
  choice: ụgbụ ha
  rationale: N’Igbo, ‘ụgbụ’ nwere ike igosi otu ma ọ bụ ọtụtụ site n’ọnọdụ okwu; ihe gbara ya gburugburu na-egosi na ọ bụ ụgbụ ndị ha nwere.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee nsọpụrụ. E ji ‘mechibidoro ... n’ụgbụ’ chekwaa ihe oyiyi nke συνέκλεισαν, ma jiri ‘na-adọka’ gosipụta omume imperfect na-aga n’ihu. Akara ntụaka [a] na [b] dị n’ederede isi.
