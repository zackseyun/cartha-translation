  source_fidelity: The temporal rendering “Mgbe ha mere nke a” faithfully represents ποιήσαντες. “Nnukwu ìgwè azụ” adequately conveys πλῆθος ἰχθύων πολύ, and “na-adọka” preserves the imperfect’s unfolding action. However, “ha mechibidoro ... n’ụgbụ ha” is not the clearest or most idiomatic Igbo expression for συνέκλεισαν; it can suggest simply shutting fish inside nets rather than surrounding/enclosing them with the nets.
  naturalness: The sentence is generally comprehensible, but “ji ụgbụ ha gbaa ... gburugburu” is more natural Standard Igbo for the action of enclosing a mass of fish in a net. The revised wording retains the Greek image without importing an interpretation beyond it.
  terminology: “Ụgbụ” is the appropriate term for fishing nets, and the possessive “ụgbụ ha” naturally represents the Greek plural in Igbo, whose nouns are not ordinarily morphologically marked for number. No theological terminology is involved.
