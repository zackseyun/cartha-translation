translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-aga were were, ebe nkọwa ụlọ na ihe ndina dị na ndetu ala iji ghara ibubiga ederede isi ibu.
