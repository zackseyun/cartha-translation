id: LUK.5.19
reference: Luke 5:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: ig
  text: Ma ebe ha na-ahụghị ụzọ ha ga-esi kpọbata ya n’ihi ìgwè mmadụ[a], ha rịgoro n’elu ụlọ, wee si na taịl elu ụlọ[b] wedata ya, ya na ute ya[c], n’etiti ebe ahụ, n’ihu Jizọs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe ha na-ahụghị otú ha ga-esi kpọbata ya n’ihi ìgwè mmadụ.” Okwu Grik ahụ nwere ike ịrụtụ aka n’ụzọ e si eme ya ma ọ bụ n’ụzọ e si abanye.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ha wedatara ya site na taịl ndị e ji kpuchie elu ụlọ. Okwu Luk ji mee ihe na-ekwu kpọmkwem banyere taịl elu ụlọ.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “ya na obere ihe ndina ya” ma ọ bụ “ya na ihe e ji buru ya.” Okwu Grik ahụ na-ezo aka n’obere ihe ndina ma ọ bụ ute e ji edina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: ụzọ ha ga-esi webata ya
  rationale: Nkebi a na-egosi ụzọ ma ọ bụ otú ha ga-esi kpọbata nwoke ahụ. Nhọrọ a bụ Igbo nkịtị ma na-echekwa obosara okwu Grik ahụ.
- source_word: διὰ τὸν ὄχλον
  choice: n’ihi ìgwè mmadụ
  rationale: διά na accusative ebe a na-egosi ihe kpatara nsogbu ahụ, ọ bụghị ịgafe n’etiti ìgwè mmadụ.
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: ha rịgoro n’elu ụlọ
  rationale: Nke a na-egosi ịrịgo ruo n’elu ụlọ n’asụsụ Igbo doro anya ma dị ugbu a.
- source_word: διὰ τῶν κεράμων
  choice: si n’etiti taịl elu ụlọ
  rationale: κέραμοι bụ taịl e ji kpuchie elu ụlọ; ‘si n’etiti’ na-egosi na ha meghere ụzọ site na ha.
- source_word: καθῆκαν
  choice: wedata
  rationale: Okwu a pụtara iweda ihe ma ọ bụ mmadụ site n’elu gaa n’ala.
- source_word: σὺν τῷ κλινιδίῳ
  choice: na ute ya
  rationale: κλινίδιον bụ obere ihe e ji edina ma ọ bụ buru onye ọrịa. ‘Ute’ bụ okwu Igbo dị mfe nke na-ezere ịkọwa ya dị ka ngwa ọgwụ ọgbara ọhụrụ.
- source_word: εἰς τὸ μέσον
  choice: n’etiti mmadụ
  rationale: ‘N’etiti mmadụ’ na-eme ka ebe a tụbara ya doo anya n’Igbo, ya bụ n’etiti ndị gbakọtara.
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: kpọmkwem n’ihu Jizọs
  rationale: Nke a na-egosi ọnọdụ ya n’ebe Jizọs nọ n'ụzọ doro anya.
