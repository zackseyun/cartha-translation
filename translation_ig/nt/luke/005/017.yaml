revisions:
- from: Otu ụbọchị, mgbe ọ na-akụzi ihe, ndị Farisii na ndị na-akụzi Iwu ahụ nọ ọdụ n'ebe ahụ. Ha si n’obodo nta niile dị na Galili na Judia, nakwa na Jerusalem, bịa. Ike Onyenwe anyị dịkwa n’ebe ahụ ka o wee gwọọ ndị ọrịa.[a]
  to: O wee bụrụ otu ụbọchị, mgbe ọ na-akụzi ihe, ndị Farisii na ndị na-akụzi Iwu nọ ọdụ n'ebe ahụ. Ha sitere n'obodo nta ọ bụla dị na Galili na Judia, nakwa site na Jerusalem bịa. Ike nke Onyenwe anyị dịkwa n'ebe ahụ ka Jizọs wee gwọọ.[a]
  rationale: E wepụrụ “ndị ọrịa,” bụ ihe a gbakwụnyere na-enweghị nkwado n’ederede e nyere, ma mee ka Jizọs bụrụ onye αὐτόν na-ezo aka na ya n’ụzọ doro anya. A dozikwara footnote ka ọ kọwaa n’eziokwu ọgụgụ ndị ọzọ “ha,” ma kwalite nkwupụta ebe ndị Farisii na ndị na-akụzi Iwu siri bịa.
