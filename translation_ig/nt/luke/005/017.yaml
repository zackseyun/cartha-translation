id: LUK.5.17
reference: Luke 5:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: ig
  text: O wee bụrụ otu ụbọchị, mgbe ọ na-akụzi ihe, ndị Farisii na ndị na-akụzi Iwu nọ ọdụ n'ebe ahụ. Ha sitere n'obodo nta ọ bụla dị na Galili na Judia, nakwa site na Jerusalem bịa. Ike nke Onyenwe anyị dịkwa n'ebe ahụ ka Jizọs wee gwọọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ochie gụrụ, “ka ọ gwọọ ha,” kama “ka Jizọs wee gwọọ.”
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: Otu ụbọchị
  rationale: Nke a na-egosipụta usoro Luk ji ewebata ihe mere n’ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa, n’enweghị okwu ochie na-adịghị mkpa.
- source_word: αὐτὸς ἦν διδάσκων
  choice: mgbe ọ na-akụzi ihe
  rationale: Ọ na-egosipụta omume na-aga n’ihu; αὐτός adịghị mkpa ka a mesie ya ike dịka ‘ya onwe ya’ n’ebe a.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: Nke a bụ aha a na-ejikarị amata òtù ndị Juu a n’Igbo.
- source_word: νομοδιδάσκαλοι
  choice: ndị na-akụzi Iwu ahụ
  rationale: Ọ na-egosipụta ndị na-akụzi Iwu Mosis n'ụzọ doro anya, n’enweghị ịgbakwunye echiche na ha bụ nanị ndị ọkachamara.
- source_word: ἐκ πάσης κώμης
  choice: si n’obodo nta niile
  rationale: ‘Obodo nta’ na-egosipụta κώμη dịka ebe obibi nta karịa obodo ukwu, ebe ‘niile’ na-echekwa echiche nkesa nke πάσης.
- source_word: δύναμις κυρίου
  choice: Ike Onyenwe anyị
  rationale: Ọ na-echekwa ịdị arọ nke okwu banyere ike Chineke na-arụ ọrụ, ma jiri aha Igbo a na-ejikarị asụgharị κύριος.
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: dịkwa n’ebe ahụ ka o wee gwọọ ndị ọrịa
  rationale: Ọ na-egosipụta nzube nke infinitive ahụ ma were αὐτόν dịka isiokwu nke omume ịgwọ ọrịa, ya bụ Jizọs. ‘Ndị ọrịa’ bụ ihe a ghọtara site n’omume ahụ, ọ bụghị ntụgharị nke αὐτόν.
theological_decisions:
- issue: Onye κύριος na-ezo aka na ya n’okwu δύναμις κυρίου
  choice: Onyenwe anyị
  alternative: Nna Ukwu / onye nwe ya
  rationale: N’ebe a okwu ahụ nwere ụda nke aha Chineke ma na-ekwu maka ike Chineke na-arụ ọrụ n’ozi ọgwụgwọ Jizọs; ntụgharị ahụ anaghị akọwapụta karịa ihe ederede kwuru.
- issue: Ike nke ahịrịokwu εἰς τὸ ἰᾶσθαι αὐτόν
  choice: Ike Onyenwe anyị dị ka Jizọs wee gwọọ ndị ọrịa
  alternative: Ike Onyenwe anyị dị ịgwọ ha / ike Onyenwe anyị nọnyere ya maka ọgwụgwọ
  rationale: Ederede SBLGNT e nyere nwere αὐτόν, nke a pụrụ ịghọta dịka isiokwu accusative nke infinitive. Ya mere, e mere ka Jizọs bụrụ onye na-agwọ ọrịa, ma e debeghị ọgụgụ plural ‘ha’ n’ederede bụ isi.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ogologo ahịrịokwu Grik ahụ ka ọ bụrụ ahịrịokwu atọ maka nghọta doro anya, ma echekwara usoro akụkọ na njikọ echiche ya.
