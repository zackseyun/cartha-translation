  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: ig
  text: Ozugbo ahụ, o biliri n’ihu ha, weliri ihe ahụ ọ nọ na-edina n’elu ya, wee laa n’ụlọ ya, na-enye Chineke otuto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ute ọ nọ na-edina n’elu ya” (n’ụzọ nkịtị, “ihe ahụ ọ nọ na-edina n’elu ya”).
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: Ozugbo ahụ
  rationale: Nke a na-egosi na ihe ahụ mere n’egbughị oge ma na-edobe nkwusi ike Luk tinyere n’ọgwụgwọ ahụ mere ozugbo.
- source_word: ἀναστὰς
  choice: o biliri ọtọ
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ participle, usoro ngwaa ndị a n’Igbo na-ada nke ọma ma na-edobe usoro ihe ndị mere.
- source_word: ἐνώπιον αὐτῶν
  choice: n’ihu ha
  rationale: Nke a na-egosi na o biliri ebe ha nọ na-ahụ ya, n’etinyeghị nkọwa karịrị ihe dị n’ọrụ Grik.
- source_word: ἄρας
  choice: bulie
  rationale: N’ebe a αἴρω pụtara ibuli ihe ahụ o dina n’elu ya iji buru ya laa; ‘bulie’ bụ okwu Igbo doro anya ma kwekọọ n’omume ahụ.
- source_word: ἐφ’ ὃ κατέκειτο
  choice: ihe ahụ ọ nọ na-edina n’elu ya
  rationale: Nke a na-edobe usoro okwu Grik, nke na-akpọghị ihe ahụ ute ma ọ bụ akwa kpọmkwem.
- source_word: κατέκειτο
  choice: ọ nọ na-edina
  rationale: Ụdị a na-egosi ọnọdụ ya gara n’ihu tupu a gwọọ ya, dị ka imperfect Grik si egosi.
- source_word: ἀπῆλθεν
  choice: wee laa
  rationale: ‘Laa’ na-egosi ịpụ ebe ahụ gaa ebe obibi ya, n’ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: n’ụlọ ya
  rationale: ‘Ụlọ ya’ bụ nsụgharị kpọmkwem na nke sitere n’okwu οἶκος n’akụkọ a.
- source_word: δοξάζων τὸν θεόν
  choice: na-enye Chineke otuto
  rationale: Nke a na-echekwa echiche nke inye Chineke ebube na nsọpụrụ, ghara ime ka ọ bụrụ naanị otuto e kwuru n’ọnụ.
theological_decisions:
- issue: Ma a ga-akpọ ihe nwoke ahụ buru ‘ute’ ma ọ bụ ‘akwa’ n’ahịrịokwu bụ isi
  choice: E ji ‘ihe ahụ ọ nọ na-edina n’elu ya’ mee ihe n’ahịrịokwu bụ isi.
  alternative: ‘ute ọ nọ na-edina n’elu ya’ ma ọ bụ ‘akwa ọ nọ na-edina n’elu ya’
  rationale: Grik n’amaokwu a enweghị aha kpọmkwem maka ihe ahụ, kama ọ sịrị ‘ihe ahụ ọ dina n’elu ya.’ Nsụgharị a na-echekwa enweghị nkọwa kpọmkwem ahụ; nkọwa ala peeji na-enye nhọrọ doro anya karị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu ahụ bụ nke akụkọ a na-akọ n’ụzọ eke; e chekwara enweghị nkọwa kpọmkwem banyere ihe nwoke ahụ dina n’elu ya.
