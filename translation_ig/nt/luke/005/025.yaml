    reason: lexical_alternative
  revision_rationale: The revision changes the ambiguous verb form “bulie” to the completed past form “weliri,” matching the man’s actual taking up of the object. It also removes the redundant “ọtọ.” The relative expression remains nonspecific, preserving the Greek wording and the English POB audit decision, while the footnote offers “ute” only as an alternative.
