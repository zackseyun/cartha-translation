  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: ig
  text: Mgbe ha butere ụgbọ mmiri ndị ahụ n’ala[a], ha hapụrụ ihe niile[b], ha soro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha butere ụgbọ mmiri ndị ahụ ruo n’ala.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha hapụrụ ihe nile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταγαγόντες
  choice: Mgbe ha butere
  rationale: Aorist participle ahụ na-egosi ihe mere tupu omume ndị sochirinụ. “Mgbe ha butere” bụ usoro Igbo doro anya nke na-echekwa njikọ oge ahụ n’etinyeghị nkọwa ọzọ.
- source_word: τὰ πλοῖα
  choice: ụgbọ mmiri ndị ahụ
  rationale: N’ọnọdụ ịkụ azụ n’Ọdọ Mmiri Galili, “ụgbọ mmiri” bụ okwu Igbo kwesịrị ekwesị ma ghara ime ka ha dị ka nnukwu ụgbọ mmiri oke osimiri.
- source_word: ἐπὶ τὴν γῆν
  choice: n’elu ala
  rationale: Nke a na-agbasochi ihe Grik pụtara, ya bụ ibute ụgbọ mmiri ndị ahụ n’ala, ma ọ naghị eme ka γῆ bụrụ naanị ikpere mmiri.
- source_word: ἀφέντες
  choice: ha hapụrụ
  rationale: N’ebe a ἀφίημι pụtara ịhapụ ihe n’azụ. Iji ngwaa zuru ezu mee ya n’Igbo na-eme ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa ma na-echekwa usoro omume ahụ.
- source_word: πάντα
  choice: ihe niile
  rationale: Ụdị neuter plural a na-egosi mkpokọta zuru ezu. “Ihe niile” na-egosipụta oke okwu ahụ n’enweghị ịkọwapụta kpọmkwem ihe ndị ahụ bụ.
- source_word: ἠκολούθησαν αὐτῷ
  choice: soro ya
  rationale: “Soro ya” na-echekwa ma omume iso Jizọs gaa ma nghọta metụtara ịbụ ndị na-eso ụzọ, n’etinyeghị nkọwa na-adịghị n’ederede.
theological_decisions:
- issue: Oke ihe πάντα na-ezo aka na ya
  choice: ha hapụrụ ihe niile
  alternative: ha hapụrụ ihe nile ha nwere
  rationale: Ederede ahụ na-ekwu n’ụzọ zuru ezu na ha hapụrụ “ihe niile,” ma ọ kọwaghị na nke a bụ ịhapụ ihe onwunwe ha niile ruo mgbe ebighị ebi. Nsụgharị a na-echekwa ike okwu ahụ na esemokwu nkọwa ya.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. Usoro ahịrịokwu ahụ na-aga nke ọma n’Igbo ma na-echekwa usoro omume atọ dị na Grik: ibute ụgbọ mmiri n’ala, ịhapụ ihe niile, na iso ya.'
