  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: ig
  text: Ọ dịghịkwa onye na-etinye mmanya ọhụrụ n’ime akpa akpụkpọ anụ ochie[a]. Ma ọ bụghị ya, mmanya ọhụrụ ahụ ga-adọwa akpa akpụkpọ anụ ndị ahụ; mmanya ahụ ga-awụpụkwa[b], akpa akpụkpọ anụ ndị ahụ ga-alakwa n’iyi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ okwu Grik si kwuo ya kpọmkwem: “akpụkpọ ochie.” Ihe a na-ekwu bụ akpa e ji akpụkpọ anụ mee maka idobe mmanya.'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “a ga-awụpụ ya.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “a ga-emebi ha” ma ọ bụ “ha ga-ala n’iyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: na-etinye
  rationale: Ọ na-egosi itinye ihe n’ime ihe ọzọ n’ụzọ zuru ezu, na-enweghị ịgbakwụnye echiche ‘ịwụnye’ nke ngwaa Grik ahụ ekwughị kpọmkwem.
- source_word: οἶνον νέον
  choice: mmanya ọhụrụ
  rationale: Nke a bụ okwu doro anya ma kwekọọ n’ọnọdụ mmanya ka na-agba ụka.
- source_word: ἀσκοὺς παλαιούς
  choice: akpa akpụkpọ ochie
  rationale: ἀσκός bụ akpa e ji akpụkpọ anụ mee maka idobe mmiri dịka mmanya; okwu a na-eme ka ihe a na-ekwu doo onye Igbo nke oge a anya.
- source_word: εἰ δὲ μήγε
  choice: Ma ọ bụghị ya
  rationale: Ọ na-ewebata ihe ga-esi n’itinye mmanya ọhụrụ n’akpa ochie pụta, ma na-ada nke ọma n’Igbo.
- source_word: ῥήξει
  choice: ga-adọwa
  rationale: Ọ na-egosi na mmanya ọhụrụ ahụ ga-eme ka akpa akpụkpọ ahụ gbawaa ma dọwaa.
- source_word: ἐκχυθήσεται
  choice: ga-awụpụkwa
  rationale: Ụdị passive nke Grik na-ekwu na mmanya ahụ ga-esi n’akpa ndị dọwara awụpụ; nsụgharị a bụ nke ebumpụta ụwa n’Igbo.
- source_word: ἀπολοῦνται
  choice: alaakwa n’iyi
  rationale: Maka akpa, okwu a na-egosi na ha ga-emebi ma gharazi ịba uru, ma ọ naghị amanye echiche nke ikpochapụ ha kpamkpam.
- source_word: καὶ αὐτός
  choice: mmanya ahụ
  rationale: Ịkpọghachi ‘mmanya ahụ’ na-eme ka onye nnọchiaha Grik nke na-ezo aka na mmanya ọhụrụ doo anya n’Igbo.
- source_word: οὐδεὶς
  choice: Ọ dịghịkwa onye
  rationale: Nke a na-echekwa njikọ καί (‘kwa’) yana ụda ilu nke okwu ahụ.
theological_decisions: []
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ‘akpa akpụkpọ’ kama okwu a pụrụ ịghọta dịka akpa nkịtị, iji mee ka omenala akpa mmanya e ji akpụkpọ anụ mee doo anya. E debere usoro ihe ga-esi na ya pụta: akpa ndị ahụ ga-adọwa, mmanya awụpụ, akpa ahụkwa ala n’iyi.'
