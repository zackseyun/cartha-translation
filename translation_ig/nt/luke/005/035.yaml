revisions:
- from: Ma ụbọchị ga-abịa, mgbe a ga-ewepụkwa nwoke na-alụ nwaanyị ahụ n’ebe ha nọ; mgbe ahụ ka ha ga-ebu ọnụ n’ụbọchị ndị ahụ.[a]
  to: Ma ụbọchị ga-abịa, mgbe a ga-anapụ ha nwoke na-alụ nwaanyị ahụ, mgbe ahụ ka ha ga-ebu ọnụ n’ụbọchị ndị ahụ.[a]
  rationale: Removed the unsupported additive “-kwa” and replaced the less direct locative phrase with “a ga-anapụ ha,” which naturally conveys that the bridegroom is taken away from the companions. The revision retains the Greek passive, its forceful nuance, the temporal sequence, and the repeated reference to the future days.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future saying, the passive/forceful removal of the bridegroom, the ensuing fasting, and the repeated reference to days. However, the enclitic “-kwa” (‘also’) has been added to the rendering of ἀπαρθῇ even though the Greek has no corresponding additive element. “N’ebe ha nọ” is understandable but less direct for ἀπ’ αὐτῶν (‘from them’).
  naturalness: The sentence is generally clear Standard Igbo. “A ga-anapụ ha…” is a more idiomatic and direct way to express that the bridegroom is taken away from them, while retaining the passive and the sense of deprivation. The revised punctuation follows the source’s linked future clauses without making the sequence overly abrupt.
  terminology: “Nwoke na-alụ nwaanyị ahụ” adequately conveys the wedding-image term νυμφίος in accessible modern Igbo. “Ibu ọnụ” is the established term for religious fasting. The footnote is revised to remove the unsupported additive “-kwa” and to give a natural alternative.
  issues:
  - severity: medium
    issue: Unsupported additive “-kwa” in “a ga-ewepụkwa.”
    rationale: Kwa means ‘also/too’ and is not represented by any word or construction in the Greek text. It should be removed.
  - severity: low
    issue: “N’ebe ha nọ” is an indirect rendering of ἀπ’ αὐτῶν.
    rationale: The Greek specifies separation ‘from them.’ “A ga-anapụ ha…” expresses this relation more directly and naturally in Igbo while maintaining the passive, forceful sense.
  revised_text: Ma ụbọchị ga-abịa, mgbe a ga-anapụ ha nwoke na-alụ nwaanyị ahụ, mgbe ahụ ka ha ga-ebu ọnụ n’ụbọchị ndị ahụ.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a ga-ewepụ ya n’ebe ha nọ.” Ngwaa Grik na-egosi na a ga-ewepụ nwoke na-alụ nwaanyị ahụ, ọ bụghị naanị na ọ ga-apụ n’onwe ya.
    reason: lexical_alternative
  revision_rationale: Removed the unsupported additive “-kwa” and replaced the less direct locative phrase with “a ga-anapụ ha,” which naturally conveys that the bridegroom is taken away from the companions. The revision retains the Greek passive, its forceful nuance, the temporal sequence, and the repeated reference to the future days.
