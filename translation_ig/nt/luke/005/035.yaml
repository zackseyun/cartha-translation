id: LUK.5.35
reference: Luke 5:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: ig
  text: Ma ụbọchị ga-abịa, mgbe a ga-anapụ ha nwoke na-alụ nwaanyị ahụ, mgbe ahụ ka ha ga-ebu ọnụ n’ụbọchị ndị ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a ga-ewepụ ya n’ebe ha nọ.” Ngwaa Grik na-egosi na a ga-ewepụ nwoke na-alụ nwaanyị ahụ, ọ bụghị naanị na ọ ga-apụ n’onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: ụbọchị ga-abịa
  rationale: Nke a na-edobe akpaalaokwu Grik nke na-ekwu kpọmkwem na ‘ụbọchị ga-abịa,’ ma ọ bụkwa okwu Igbo doro anya banyere oge dị n’ihu.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi obere ntụgharị megide ọnọdụ dị ugbu a nke a kọwara n’amaokwu ndị bu ụzọ.
- source_word: ὅταν
  choice: mgbe
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ihe ga-eme n’ọdịnihu; ‘mgbe’ bụ ụzọ Igbo sitere n’okike si kwuo ya.
- source_word: ἀπαρθῇ
  choice: a ga-ewepụkwa
  rationale: A na-edobe ụdị nnara-eme nke Grik na echiche na ndị ọzọ ga-ewepụ ya, ọ bụghị naanị na ọ ga-apụ n’onwe ya.
- source_word: ἀπ’ αὐτῶν
  choice: n’ebe ha nọ
  rationale: Nke a na-egosi nkewapụ nwoke ahụ n’ebe ndị ya na ha nọ nọ, n’ụzọ Igbo dị mfe nghọta.
- source_word: ὁ νυμφίος
  choice: nwoke na-alụ nwaanyị ahụ
  rationale: Nke a bụ okwu Igbo nkịtị na nke doro anya maka nwoke nọ n’emume alụmdi na nwunye, ma na-edobe ihe atụ agbamakwụkwọ ahụ.
- source_word: τότε
  choice: mgbe ahụ ka
  rationale: Ọ na-egosi na ibu ọnụ ga-esochi oge e wepụrụ nwoke ahụ ma na-enye ahịrịokwu ahụ nkwusi ike sitere n’okike n’Igbo.
- source_word: νηστεύσουσιν
  choice: ha ga-ebu ọnụ
  rationale: ‘Ibu ọnụ’ bụ okwu Igbo a na-ejikarị akọwa ịhapụ iri nri n’ihi omume okpukpe.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: n’ụbọchị ndị ahụ
  rationale: A hapụrụ nkwughachi nke ‘ụbọchị’ dịka ọ dị na Grik n’ihi na ọ na-emesi oge ahụ ike.
theological_decisions:
- issue: Ma a ga-eme ka ἀπαρθῇ bụrụ naanị na nwoke ahụ ga-apụ n’onwe ya
  choice: A ga-ewepụkwa nwoke na-alụ nwaanyị ahụ n’ebe ha nọ
  alternative: Nwoke na-alụ nwaanyị ahụ ga-ahapụ ha
  rationale: Ụdị nnara-eme na ike okwu Grik na-egosi na a ga-ewepụ ya. Nke a na-edobe ndọrọndọrọ na ihe ọjọọ a na-atụ anya ya n’okwu Jizọs n’akọwaghị ya karịa ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ntụgharị okwu nke amaokwu ahụ, ụdị nnara-eme, na nkwughachi ‘ụbọchị’ nke dị na Grik. E tinyere akara nkọwa [a] n’isi ederede.
