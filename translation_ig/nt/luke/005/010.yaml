revisions:
- from: N’otu aka ahụkwa, Jemis na Jọn, ụmụ Zebedi, ndị ha na Saịmọn bụ ndị mmekọ, tụrụkwa egwu. Jizọs wee sị Saịmọn, “Atụla egwu; site ugbu a gaa n’ihu, ị ga na-ejide ndị mmadụ na ndụ.”[a][b]
  to: N’otu aka ahụ kwa, Jems na Jọn, ụmụ Zebedi, ndị bụ ndị mmekọ Saịmọn. Jizọs wee sị Saịmọn, “Atụla egwu; site ugbu a gaa n’ihu, ị ga na-ejide ndị mmadụ dị ndụ.”[a][b]
  rationale: The revision removes material not present in the source verse, clarifies that James and John were Simon’s partners, and retains the Greek verb ζωγρῶν’s distinctive ‘taking/catching alive’ sense. The sentence break after “Saịmọn” follows the source’s two clauses. Footnotes are retained and their wording is lightly regularized for natural Standard Igbo.
