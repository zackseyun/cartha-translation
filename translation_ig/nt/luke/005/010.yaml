id: LUK.5.10
reference: Luke 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: ig
  text: N’otu aka ahụ kwa, Jems na Jọn, ụmụ Zebedi, ndị bụ ndị mmekọ Saịmọn. Jizọs wee sị Saịmọn, “Atụla egwu; site ugbu a gaa n’ihu, ị ga na-ejide ndị mmadụ dị ndụ.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ị ga na-ejide ụmụ mmadụ dị ndụ.” Okwu Grik a pụtara ijide ma ọ bụ nweta mmadụ ka ọ dị ndụ.
    reason: lexical_alternative
  - marker: b
    text: Tụlee Matiu 4:19 na Mak 1:17, ebe Jizọs kwuru, “Aga m eme unu ndị ọkụ azụ mmadụ.” Ụzọ Luk siri kwuo ya ebe a dị iche.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: N’otu aka ahụkwa
  rationale: Na-egosipụta ma ntụnyere ma mgbakwunye, na-ejikọta Jemis na Jọn na ihe e kwuru banyere ndị ọzọ n’amaokwu bu ụzọ.
- source_word: υἱοὺς Ζεβεδαίου
  choice: ụmụ Zebedi
  rationale: N’Igbo, “ụmụ Zebedi” bụ ụzọ dị nkenke ma bụrụkwa nke ebumpụta ụwa isi gosi na ha bụ ụmụ nwoke Zebedi n’ọnọdụ a.
- source_word: κοινωνοὶ
  choice: ndị mmekọ
  rationale: Ọ dabara n’ọnọdụ ọrụ ịkụ azụ, ebe okwu ahụ na-egosi ndị ha na Saịmọn jikọrọ aka n’ọrụ, ọ bụghị naanị ndị enyi.
- source_word: Μὴ φοβοῦ
  choice: Atụla egwu
  rationale: Nke a bụ okwu nkasi obi dị mfe, dị ugbu a, ma kwekọọ na iwu Grik ahụ.
- source_word: ἀπὸ τοῦ νῦν
  choice: site ugbu a gaa n’ihu
  rationale: Na-egosi mgbanwe doro anya nke malitere n’oge ahụ ma na-aga n’ihu.
- source_word: ἀνθρώπους
  choice: ndị mmadụ
  rationale: Okwu Grik ahụ na-ezo aka n’ụmụ mmadụ n’ozuzu ha, ọ bụghị naanị ụmụ nwoke.
- source_word: ζωγρῶν
  choice: na-ejide ndị mmadụ na ndụ
  rationale: Na-echekwa echiche pụrụ iche nke ζωγρέω, ya bụ ijide mmadụ ka ọ dị ndụ, ma ghara ime ka okwu Luk bụrụ otu ihe na “ndị ọkụ azụ mmadụ” n’akwụkwọ Matiu na Mak.
theological_decisions:
- issue: Ihe atụ dị na ζωγρέω n’oku Jizọs kpọrọ Saịmọn
  choice: ị ga na-ejide ndị mmadụ na ndụ
  alternative: ị ga na-ejide ndị mmadụ; ị ga-abụ onye ọkụ azụ mmadụ
  rationale: Luk jiri ngwaa pụtara ijide ma ọ bụ nweta mmadụ ka ọ dị ndụ. Nsụgharị a na-echekwa ọdịiche ahụ, kama ime ka ọ daba n’okwu ama ama dị na Matiu 4:19 na Mak 1:17.
- issue: Ụdị okike nke ἀνθρώπους
  choice: ndị mmadụ
  alternative: ndị nwoke; ụmụ mmadụ
  rationale: N’ebe a, okwu ahụ gụnyere mmadụ niile; ya mere, “ndị mmadụ” na-enye echiche e bu n’obi n’enweghị ime ka ọ bụrụ naanị ụmụ nwoke.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “N’otu aka ahụkwa” jikọta ahịrịokwu a na mmeghachi omume e kwuru n’amaokwu 9, ebe e tinyere “tụrụkwa egwu” iji mezue ahịrịokwu ahụ n’Igbo dịka njikọ Grik si arụ ọrụ gafee ókè amaokwu.
