  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: ig
  text: Ndị Farisii na ndị odeakwụkwọ ha nọ na-atamu ntamu nye ndị na-eso ụzọ ya[a], na-asị, “Gịnị mere unu ji eso ndị ọnaụtụ na ndị mmehie eri ihe ma na-aṅụ ihe ọṅụṅụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-eme mkpesa n'olu dị ala.” Okwu Grik ahụ nwere ike ịpụta mkpesa a na-atamu atamu, ọ bụghị naanị ịjụ ihe n'ihu ọha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: nọ na-atamu ntamu
  rationale: Na-egosipụta imperfect dị ka omume na-aga n'ihu, ma na-echekwa echiche nke mkpesa e ji olu dị ala na-eme.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Ọ bụ aha otu ndị ahụ n'akụkọ ihe mere eme, kama ịkọwa naanị ọrụ ha dị ka ndị nkụzi iwu.
- source_word: αὐτῶν
  choice: ha
  rationale: 'E jikọtara ya na ndị odeakwụkwọ dịka ụtọasụsụ Grik si dị: “ndị odeakwụkwọ ha.”'
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: megide ndị na-eso ụzọ ya
  rationale: N'ọnọdụ mkpesa a, πρὸς na-egosi ndị a tụkwasịrị mkpesa ahụ ihu; “megide” na-eburu ụda mmegide ahụ, ọ bụ ezie na okwu ahụ ka bụ nke a gwara ndị na-eso ụzọ.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Ụzọ Igbo nkịtị na nke doro anya isi jụọ ihe kpatara ihe.
- source_word: τελωνῶν
  choice: ndị ọnaụtụ
  rationale: Okwu Igbo a na-ahụkarị maka ndị na-anakọta ụtụ isi, ma na-echekwa aha otu ahụ n'ọnọdụ Oziọma.
- source_word: ἁμαρτωλῶν
  choice: ndị mmehie
  rationale: Nsụgharị kpọmkwem nke na-echekwa otú ndị na-ekwu okwu si kewaa otu ahụ n'akụkụ omume na mmekọrịta mmadụ.
- source_word: ἐσθίετε καὶ πίνετε
  choice: unu ji ... eri ihe ma na-aṅụ ihe ọṅụṅụ
  rationale: Na-echekwa omume abụọ ahụ n'ụzọ Igbo dị ndụ ma gosipụta omume a na-eme ha ajụjụ banyere ya.
- source_word: καὶ
  choice: —
  rationale: Njikọ ahụ pụtara n'usoro akụkọ Igbo site na ịga n'ihu ozugbo n'amaokwu a; itinye “Ma” nwere ike igosi mmegide karịa ihe Grik kwuru.
theological_decisions:
- issue: Mmetụta mmekọrịta mmadụ na okpukpe nke iso “ndị ọnaụtụ na ndị mmehie” rie ma ṅụọ
  choice: E chekwara ebubo ahụ n'okwu ya doro anya n'enweghị ịgbakwunye nkọwa banyere adịghị ọcha n'emume ma ọ bụ ikpe omume.
  alternative: Ịkọwapụta ya dịka imebi iwu ịdị ọcha ma ọ bụ dịka nkwado mmehie.
  rationale: Amaokwu ahụ n'onwe ya kwuru naanị ụdị ndị ahụ na iso ha eri ma na-aṅụ; nsụgharị ekwesịghị ikpebi kpọmkwem ihe ndabere nke mkpesa ahụ karịa ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke kwesịrị ekwesị ma dị mfe nghọta. “Atamu ntamu” na-eburu ụda γογγύζω; “ndị odeakwụkwọ” na-echekwa aha otu akụkọ ihe mere eme. Akara ntụaka [a] dị n'ahịrị amaokwu ahụ.
