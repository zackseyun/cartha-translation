source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: ig
  text: Ma mgbe Saịmọn Pita hụrụ ihe ahụ, ọ dara n’ikpere Jizọs, sị, “Pụọ n’ebe m nọ, n’ihi na abụ m onye mmehie, Onyenwe.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν
  choice: mgbe ... hụrụ ihe ahụ
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu oge ka ọ daa nke ọma n’Igbo; “ihe ahụ” na-ezo aka n’ọtụtụ azụ e jidere n’ụzọ ọrụ ebube.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntughari akụkọ nwere obere ọdịiche n’etiti ọrụ ebube ahụ na mmeghachi omume Pita.
- source_word: Σίμων Πέτρος
  choice: Saịmọn Pita
  rationale: E debere aha abụọ ahụ dịka ha dị n’asụsụ Grik.
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: ọ dara n’ikpere Jizọs
  rationale: Nke a na-egosipụta mmegharị ahụ Pita na ebe ọ dara n’ụzọ Igbo doro anya ma dị ndụ.
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: Hapụ m
  rationale: Ọ bụ arịrịọ siri ike ka Jizọs kewapụ onwe ya n’ebe Pita nọ; “Hapụ m” bụ okwu Igbo dị ugbu a ma kwekọọ n’ọnọdụ ahụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara arịrịọ Pita.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: nwoke mmehie
  rationale: A nọgidere na okwu nwoke kpọmkwem nke ἀνήρ, ebe “nwoke mmehie” na-egosi na Pita na-ekwupụta ọnọdụ mmehie ya.
- source_word: κύριε
  choice: Onyenwe m
  rationale: Ọ na-echekwa nkwanye ùgwù na ịdị omimi nwere ike ịdị n’otú Pita si akpọ Jizọs, n’ebughị ụzọ kpebie oke nghọta Pita nwere n’oge ahụ.
theological_decisions:
- issue: Otú e si sụgharịa κύριε mgbe Pita na-agwa Jizọs okwu
  choice: Onyenwe m
  alternative: Nna anyị ukwu; Nwoke ukwu
  rationale: “Onyenwe m” na-echekwa ma nkwanye ùgwù ma ohere nke nghọta miri emi banyere ikike Jizọs. “Nwoke ukwu” ga-eme ka ihe okwu ahụ pụtara belata, ebe “Nna anyị ukwu” adịghị adaba nke ọma dịka okwu Pita ji kpọọ ya n’onwe ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-ada nke ọma n’ọnụ ndị Igbo, ma debe nkọwa nwoke kpọmkwem na ἀνήρ na esemokwu dị na κύριε.
