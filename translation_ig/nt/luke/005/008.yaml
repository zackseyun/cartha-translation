revisions:
- from: Ma mgbe Saịmọn Pita hụrụ ihe ahụ, ọ dara n’ikpere Jizọs, sị, “Hapụ m, n’ihi na abụ m nwoke mmehie, Onyenwe m.”
  to: Ma mgbe Saịmọn Pita hụrụ ihe ahụ, ọ dara n’ikpere Jizọs, sị, “Pụọ n’ebe m nọ, n’ihi na abụ m onye mmehie, Onyenwe.”
  rationale: The revision corrects the direction of Simon Peter’s plea, replaces an unnatural calque with idiomatic Standard Igbo, and avoids introducing an unexpressed possessive into Jesus’ title. It otherwise preserves the draft’s faithful narrative structure and register.
  reviewer_model: gpt-5.6-terra
