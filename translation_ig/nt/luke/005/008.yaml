review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains Simon Peter’s two names, the implied object of seeing, the temporal sense of the participle, the fall at Jesus’s knees, the causal clause, and the respectful rendering of κύριε. However, “Hapụ m” naturally means “leave me/abandon me” and does not clearly express Jesus’ departure from Peter. “nwoke mmehie” is an unnatural Igbo calque for ἀνὴρ ἁμαρτωλός. The possessive in “Onyenwe m” is not present in κύριε.
  naturalness: The revised wording uses idiomatic Standard Igbo. “Pụọ n’ebe m nọ” clearly communicates the requested separation, and “onye mmehie” is the normal natural expression for a sinful person/sinner. The source’s masculine reference is already clear because Simon Peter is the first-person speaker; it need not be reproduced through the unidiomatic phrase “nwoke mmehie.”
  terminology: “Onyenwe” retains the reverential ‘Lord’ sense of κύριε without adding the possessive ‘my.’ No doctrinal conclusion beyond the Greek’s respectful and potentially weighty address is imposed.
  issues:
  - severity: medium
    issue: “Hapụ m” is ambiguous and can mean “leave me” or “abandon me.”
    rationale: Ἔξελθε ἀπ’ ἐμοῦ specifically asks Jesus to go away from Peter. “Pụọ n’ebe m nọ” conveys that direction plainly.
  - severity: medium
    issue: “nwoke mmehie” is not natural Standard Igbo.
    rationale: It is a literal structural imitation rather than an idiomatic description. “onye mmehie” accurately conveys Simon Peter’s confession while the male referent remains explicit in context.
  - severity: low
    issue: “Onyenwe m” adds a possessive absent from the Greek.
    rationale: κύριε is vocative without μου. “Onyenwe” preserves the address without adding ‘my.’
  revised_text: Ma mgbe Saịmọn Pita hụrụ ihe ahụ, ọ dara n’ikpere Jizọs, sị, “Pụọ n’ebe m nọ, n’ihi na abụ m onye mmehie, Onyenwe.”
  revised_footnotes: []
  revision_rationale: The revision corrects the direction of Simon Peter’s plea, replaces an unnatural calque with idiomatic Standard Igbo, and avoids introducing an unexpressed possessive into Jesus’ title. It otherwise preserves the draft’s faithful narrative structure and register.
