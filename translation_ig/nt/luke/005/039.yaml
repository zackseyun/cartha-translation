  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: ig
  text: Ọ dịghịkwa onye, mgbe ọ ṅụsịrị mmanya ochie, na-achọ nke ọhụrụ, n’ihi na ọ na-ekwu, “Nke ochie dị mma.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide ochie na-agụ, “Nke ochie ka mma.”
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: Ọ dịghịkwa onye
  rationale: Nke a na-egosi onye ọ bụla n’ụzọ izugbe ma na-edobe njikọ καί (“kwa”) dị na mmalite amaokwu ahụ.
- source_word: πιὼν
  choice: ṅụrụ
  rationale: Aorist participle ahụ na-egosi omume mere tupu ọchịchọ ahụ; n’Igbo, usoro okwu a na-egosi nke ahụ n'ụzọ ebumpụta ụwa.
- source_word: παλαιὸν
  choice: mmanya ochie
  rationale: Ọ bụ ezie na okwu Grik kwuru naanị “ochie,” ihe gbara ya gburugburu na-egosi na ọ bụ mmanya; itinye “mmanya” na-eme ka Igbo doo anya.
- source_word: θέλει
  choice: na-achọ
  rationale: N’ebe a θέλει pụtara ọchịchọ ma ọ bụ mmasị mmadụ nwere, ya mere “na-achọ” bụ okwu Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: νέον
  choice: nke ọhụrụ
  rationale: Adjective ahụ nọchiri anya “mmanya ọhụrụ.” “Nke ọhụrụ” na-edobe mkpụmkpụ okwu Grik ma mee ka ihe a na-ekwu doo anya site n’ihe gbara ya gburugburu.
- source_word: λέγει γάρ
  choice: n’ihi na ọ na-ekwu
  rationale: Nke a na-edobe ọrụ γάρ nke inye ihe kpatara okwu bu ya ụzọ ma na-ebute okwu e kwuru kpọmkwem.
- source_word: Ὁ παλαιὸς
  choice: Nke ochie
  rationale: A hapụrụ “mmanya” ka ọ bụrụ ihe a ghọtara n’onwe ya, dịka ọ dị n’asụsụ Grik, ma okwu ahụ ka doro anya n’ọnọdụ ya.
- source_word: χρηστός
  choice: dị mma
  rationale: χρηστός n’ebe a pụtara ihe dị mma ma ọ bụ na-atọ ụtọ; “dị mma” bụ ntụgharị sara mbara nke na-adịghị etinye echiche ntụnyere nke “ka mma.”
theological_decisions:
- issue: Ụzọ e si tụgharị χρηστός n’ilu banyere mmanya ochie na nke ọhụrụ
  choice: dị mma
  alternative: ka mma
  rationale: Ihe odide SBLGNT nwere χρηστός, nke pụtara “dị mma” ma ọ bụ “na-atọ ụtọ,” ọ bụghị okwu ntụnyere “ka mma.” Ya mere, e debere “dị mma” n’ahịrị bụ isi, ebe a kọwara ọdịiche a maara nke ọma n’okpuru peeji kama ịmanye ya n’ihe odide.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. A na-eji “mmanya” mee ka ihe παλαιόν na-ekwu pụta ìhè, ma a na-edobe ellipsis ahụ n’ụdị “nke ọhụrụ” na “nke ochie.”
