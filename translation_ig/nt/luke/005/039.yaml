- from: Ọ dịghịkwa onye ṅụrụ mmanya ochie na-achọ nke ọhụrụ, n’ihi na ọ na-ekwu, “Nke ochie dị mma.”[a]
  to: Ọ dịghịkwa onye, mgbe ọ ṅụsịrị mmanya ochie, na-achọ nke ọhụrụ, n’ihi na ọ na-ekwu, “Nke ochie dị mma.”[a]
  rationale: The revision supplies an idiomatic temporal construction for the Greek aorist participle while retaining the generic present sense of θέλει, the explanatory force of γάρ, and the non-comparative meaning of χρηστός. The footnote remains anchored to the final evaluative expression, where the variant occurs.
