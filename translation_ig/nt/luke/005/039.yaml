review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the negated generic subject, the preference verb, the explanatory γάρ clause, and χρηστός as “dị mma,” without importing the comparative reading. However, bare “ṅụrụ” does not clearly convey the aorist participle’s prior temporal force (“after/having drunk”).
  naturalness: The wording is generally clear Standard Igbo. Adding “mgbe ọ ṅụsịrị” makes the sequence of drinking old wine before declining new wine explicit and idiomatic.
  terminology: “Mmanya ochie,” “nke ọhụrụ,” and “Nke ochie dị mma” appropriately retain the wine context while preserving the Greek ellipses in the latter expressions. The textual-variant footnote correctly distinguishes “ka mma” from the SBLGNT reading.
  issues:
  - severity: medium
    issue: The participle πιὼν is rendered only as “ṅụrụ.”
    rationale: In this construction, πιὼν denotes an action completed before the main verb. “Mgbe ọ ṅụsịrị” explicitly and naturally preserves that temporal relationship in Igbo.
  revised_text: Ọ dịghịkwa onye, mgbe ọ ṅụsịrị mmanya ochie, na-achọ nke ọhụrụ, n’ihi na ọ na-ekwu, “Nke ochie dị mma.”[a]
