  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị, ọ pụrụ wee hụ otu onye na-anakọta ụtụ, aha ya bụ Livaị, ka ọ nọ ọdụ n’ebe a na-anakọta ụtụ[a], wee sị ya, “Soro m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ụlọ nta a na-anakọta ụtụ,” “n’ebe a na-anakọta ụgwọ ụzọ,” ma ọ bụ “n’ọdụ kọstọm.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-edobe ọtụtụ nke ταῦτα ma na-enye ntụgharị akụkọ dị n’Igbo nke ọma.
- source_word: ἐξῆλθεν
  choice: ọ pụrụ
  rationale: Ọ na-egosipụta mmegharị pụta nke ngwaa Grik ahụ n'ụzọ dị mkpirikpi ma doo anya.
- source_word: ἐθεάσατο
  choice: hụ
  rationale: “Hụ” bụ okwu Igbo dị mfe ma kwekọọ na ọnọdụ a; ngwaa Grik ahụ nwekwara ike ịpụta ilebara mmadụ anya nke ọma.
- source_word: τελώνην
  choice: onye ọna ụtụ
  rationale: Nke a bụ okwu Igbo doro anya maka onye ọrụ ya bụ ịnakọta ụtụ.
- source_word: ὀνόματι Λευὶν
  choice: aha ya bụ Livaị
  rationale: Ọ bụ usoro okwu Igbo ebumpụta ụwa nke na-egosipụta aha onye ahụ n’enweghị mgbakwunye nkọwa.
- source_word: καθήμενον
  choice: ka ọ nọ ọdụ
  rationale: Nke a na-edobe ọnọdụ Levi nọ na ya mgbe Jizọs hụrụ ya.
- source_word: ἐπὶ τὸ τελώνιον
  choice: n’ebe a na-anakọta ụtụ
  rationale: τελώνιον bụ ebe a na-anakọta ụtụ ma ọ bụ ụgwọ ụzọ; ntụgharị a doro ndị na-agụ Igbo anya ma ghara ikwubi kpọmkwem ụdị ebe ahụ.
- source_word: Ἀκολούθει μοι
  choice: Soro m
  rationale: Ọ bụ iwu kpọmkwem ma dị nkenke, nke na-edobe ma ihe okwu ahụ pụtara n’ụzọ nkịtị ma ike ọkpụkpọ ahụ.
theological_decisions:
- issue: Ike iwu Jizọs dị ka ọkpụkpọ ịbụ onye na-eso ụzọ ya
  choice: Soro m
  alternative: Bụrụ onye na-eso ụzọ m
  rationale: E debere okwu iwu ahụ n’onwe ya n’enweghị ịgbasa ya ka ọ bụrụ nkọwa ozizi; ọnọdụ akụkọ ahụ na-egosi na ọ bụ ọkpụkpọ ịbụ onye na-eso ụzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji ahịrịokwu dị mfe nke ndị nkịtị ga-aghọta, ma e zere okwu ụka pụrụ iche. A haziri ihe odide ala peeji ka o kwekọọ n’ebe akara [a] dị n’amaokwu ahụ.
