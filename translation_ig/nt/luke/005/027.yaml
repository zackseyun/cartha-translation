  to: Mgbe ihe ndị a gasịrị, ọ pụrụ wee hụ otu onye na-anakọta ụtụ, aha ya bụ Livaị, ka ọ nọ ọdụ n’ebe a na-anakọta ụtụ[a], wee sị ya, “Soro m.”
