review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the narrative sequence, Levi’s name and seated position, the tax-collection setting, and Jesus’ direct imperative. A small syntactic revision makes the two completed actions ('went out' and 'saw') explicit and fluent in Standard Igbo.
  naturalness: “Ọ pụrụ, hụ” is understandable, but “ọ pụrụ wee hụ” is more natural and unambiguous as a narrative sequence. “Onye na-anakọta ụtụ” is the more current, transparent Standard Igbo expression for a tax collector than “onye ọna ụtụ.”
  terminology: “Livaị,” “ụtụ,” “ebe a na-anakọta ụtụ,” and “Soro m” are appropriate. “Soro m” preserves the concise force of Ἀκολούθει μοι without doctrinal expansion.
  issues:
  - severity: low
    issue: Serial narrative verbs need a connective
    rationale: Adding “wee” between “pụrụ” and “hụ” gives a natural Igbo rendering of the Greek coordinated verbs without altering their sequence.
  - severity: medium
    issue: Tax collector terminology is awkward
    rationale: “Onye ọna ụtụ” is less idiomatic and may be unclear. “Onye na-anakọta ụtụ” clearly denotes the person who collects taxes and retains the source sense.
