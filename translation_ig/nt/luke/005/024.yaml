revisions:
- from: Ma ka unu wee mara na Nwa nke Mmadụ[a] nwere ikike n’ụwa ịgbaghara mmehie—ọ sịrị nwoke ahụ mkpọnwụ ji, “Ana m asị gị, bilie, bulie ute gị[b], laa n’ụlọ gị.”
  to: Ma ka unu wee mara na Nwa nke Mmadụ[a] nwere ikike n’ụwa ịgbaghara mmehie—ọ gwara nwoke ahụ ọrịa mkpọnwụ ji, “Ana m asị gị, bilie, bulie ute gị[b], laa n’ụlọ gị.”
  rationale: E meziewo naanị okwu na-adịghị ada nke ọma n’Igbo maka onye ahụ ọrịa mkpọnwụ ji, tinyere nkọwa ala nke na-ekwu n’ụzọ ezighị ezi na e debeela Grik ahụ. Ndozigharị ndị a anaghị agbanwe ihe amaokwu ahụ pụtara, ma ha na-eme ka Igbo ahụ bụrụ nke ziri ezi, nke eke, na nke kwekọrọ n’isi Grik.
