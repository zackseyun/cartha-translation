  verdict: revise
  source_fidelity: 'Isi ntụgharị ahụ na-esochi Grik nke ọma: ἵνα δὲ, ikike (ἐξουσία), n’ụwa, ịgbaghara mmehie, na iwu atọ ahụ e chekwawo. Otú ọ dị, “nwoke ahụ mkpọnwụ ji” ezughị oke n’usoro Igbo; a chọrọ “nwoke ahụ ọrịa mkpọnwụ ji” ka ọ pụta kpọmkwem ma bụrụ asụsụ ziri ezi.'
  naturalness: Ewezuga nkebiokwu banyere nwoke ahụ kpọnwụrụ akpọnwụ, ahịrịokwu ahụ dị mfe nghọta ma dabara n’Igbo Izugbe nke oge a. “Ọ gwara” na “bilie, bulie ute gị, laa n’ụlọ gị” na-ada eke ma na-echekwa nkwanye ùgwù nke okwu ahụ.
  terminology: “Nwa nke Mmadụ,” “ikike,” na “ịgbaghara mmehie” bụ nhọrọ kwesịrị ekwesị. Ihe odide ala a chọrọ mmezi n’ihi na “A hapụrụ aha Grik ahụ” na-ekwu n’ụzọ na-adịghị ziri ezi na e debeela aha ahụ n’asụsụ Grik, ebe a sụgharịala ya n’Igbo. A gbanwekwara nhọrọ ọzọ ka ọ ghara igosi nkọwa christological karịrị ihe ederede ahụ kwuru.
