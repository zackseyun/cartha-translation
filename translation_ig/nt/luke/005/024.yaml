id: LUK.5.24
reference: Luke 5:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: ig
  text: Ma ka unu wee mara na Nwa nke Mmadụ[a] nwere ikike n’ụwa ịgbaghara mmehie—ọ gwara nwoke ahụ ọrịa mkpọnwụ ji, “Ana m asị gị, bilie, bulie ute gị[b], laa n’ụlọ gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye mmadụ.” E chebewo aha ahụ “Nwa nke Mmadụ” n’ihi na ọ bụ aha Jizọs ji akọwa onwe ya ma nwee njikọ dị mkpa n’Akwụkwọ Nsọ, karịsịa Dáníel 7.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “obere akwa gị.” Okwu Grik κλινίδιον na-ezo aka n’obere akwa, ihe ndina dị mfe, ma ọ bụ ute.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: Ma ka
  rationale: “Ma” na-egosi ntughari dị nro, ebe “ka” na-ewebata ebumnuche nke okwu ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: εἰδῆτε
  choice: unu wee mara
  rationale: Nke a na-egosi ịmata ihe nke ọma ma ọ bụ inwe nkwenye doro anya; “unu wee mara” dabara n’usoro ahịrịokwu ebumnuche a.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A hapụrụ ya dịka aha Jizọs ji akọwa onwe ya, ka njikọ ya na ihe oyiyi dị na Daniel 7 na nghọta sara mbara nke aha ahụ ghara ifu.
- source_word: ἐξουσίαν ἔχει
  choice: nwere ikike
  rationale: “Ikike” na-egosi ikike ziri ezi ime ihe, ọ bụghị naanị ike anụahụ; nke a bụ isi okwu n’arụmụka banyere ịgbaghara mmehie.
- source_word: ἐπὶ τῆς γῆς
  choice: n’ụwa
  rationale: Nke a bụ ntụgharị kpọmkwem ma dịkwa eke nke okwu ebe a, n’enweghị ịgbakwụnye nkọwa na-adịghị n’ihe odide ahụ.
- source_word: ἀφιέναι ἁμαρτίας
  choice: ịgbaghara mmehie
  rationale: N’ebe a ἀφίημι pụtara ịhapụ ma ọ bụ ịgbaghara mmehie; okwu Igbo a bụ nke doro anya ma bụrụ nke a na-ejikarị eme ihe.
- source_word: τῷ παραλελυμένῳ
  choice: nwoke ahụ mkpọnwụ ji
  rationale: Nke a bụ ụzọ Igbo dị mfe ma na-akwanyere onye ahụ ùgwù iji kọwaa nwoke ahụ ahụ mkpọnwụ ji.
- source_word: Σοὶ λέγω
  choice: Ana m asị gị
  rationale: Ọ na-echekwa nkwusi ike na okwu Jizọs gwara onye ahụ ozugbo.
- source_word: ἔγειρε
  choice: bilie
  rationale: Iwu a dị nkenke, kwụ ọtọ, ma na-akpọ onye ahụ ka o mee ihe ozugbo.
- source_word: ἄρας
  choice: bulie
  rationale: Ọ na-egosi ibuli ihe ahụ ka e were ya pụọ, dịka αἴρω si pụta n’ebe a.
- source_word: κλινίδιόν σου
  choice: ute gị
  rationale: κλινίδιον na-ezo aka n’obere ihe e ji edina dịka ute ma ọ bụ obere akwa; “ute” dabara n’ọnọdụ a ma bụrụkwa okwu ndị mmadụ na-aghọta ngwa ngwa.
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: laa n’ụlọ gị
  rationale: “Laa” na-egosi ịga ebe a kpọrọ aha, ebe “n’ụlọ gị” na-echekwa ebe njem ahụ na-aga.
theological_decisions:
- issue: Otú e si tụgharịa ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye Bụ Mmadụ
  rationale: Aha “Nwa nke Mmadụ” na-echekwa aha Jizọs ji akọwa onwe ya, njikọ ya na Daniel 7, na nghọta abụọ nwere ike iso ya, kama ịkọwa ya n’otu ụzọ naanị.
- issue: Ihe ἐξουσία pụtara n’ihe gbasara ịgbaghara mmehie
  choice: ikike
  alternative: ike
  rationale: Ihe a na-ekwu bụ ikike Jizọs nwere n’ụzọ ziri ezi ịgbaghara mmehie, ọ bụghị nanị ike o nwere ịrụ ọrụ ebube.
- issue: Ihe ἐπὶ τῆς γῆς na-ezo aka na ya
  choice: n’ụwa
  alternative: n’ala ụwa
  rationale: A hapụrụ okwu ahụ n’ụdị dị mfe nke na-adịghị amanye otu nkọwa banyere ókè ma ọ bụ mpaghara ikike ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-ada ka okwu ọnụ sitere n’ọnụ Jizọs, ma e chekwara aha nkà mmụta okpukpe “Nwa nke Mmadụ” na okwu “ikike” n’enweghị ịgbakwụnye nkọwa ụka pụrụ iche.
