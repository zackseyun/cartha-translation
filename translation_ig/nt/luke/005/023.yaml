source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: ig
  text: '“Olee nke ka mfe: ikwu, ‘A gbagharala gị mmehie gị,’[a] ka ọ bụ ikwu, ‘Bilie, jee ije’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A gbaghara gị mmehie gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: Olee nke ka mfe
  rationale: Nke a na-egosipụta ajụjụ ntụnyere n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: εἰπεῖν
  choice: ikwu
  rationale: Ngwaa a na-ewebata okwu abụọ a na-atụnyere; “ikwu” bụ nsụgharị Igbo kacha kwekọọ n’ebe a.
- source_word: Ἀφέωνταί
  choice: A gbagharala
  rationale: N’ebe a ἀφίημι pụtara ịgbaghara mmehie. Ụdị a na-egosi ihe e mechaala nke nsonaazụ ya ka dị ugbu a, n’ebughị ibu nkọwa okpukpe ọzọ.
- source_word: σοι
  choice: gị
  rationale: Ọ na-egosi onye a na-agwa okwu ozugbo, ma dabara n’usoro okwu Igbo.
- source_word: αἱ ἁμαρτίαι σου
  choice: mmehie gị
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi isi gosipụta ihe onye ahụ nwere.
- source_word: ἢ
  choice: ka ọ bụ
  rationale: Nke a na-ekewa nhọrọ abụọ a na-atụnyere n’ajụjụ Igbo.
- source_word: Ἔγειρε
  choice: Bilie
  rationale: Ọ bụ iwu a nyere nwoke ahụ ka o si n’ọnọdụ ya bilie; “Bilie” dị nkenke, doo anya, ma nwee ugwu.
- source_word: καὶ περιπάτει
  choice: jegharịa
  rationale: N’ebe a περιπατέω na-ekwu maka ije n’ezie. “Jegharịa” na-egosi ikike ịga ije mgbe o biliri.
theological_decisions:
- issue: Igosipụta nkwupụta mgbaghara n’etinyeghị nkọwa ozizi ọzọ n’ụdị perfect/passive Grik
  choice: A gbagharala gị mmehie gị
  alternative: A gbaghara gị mmehie gị
  rationale: Nhọrọ a na-echekwa echiche nke omume e mechaala nke ọnọdụ ya ka dị, ma hapụ onye mere mgbaghara ahụ n’ụzọ passive dị ka Grik si mee.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ugwu ma dị mfe nghọta. E debere usoro ajụjụ ntụnyere ahụ na nkwupụta passive nke mgbaghara n’enweghị itinye nkọwa otu ụka.
