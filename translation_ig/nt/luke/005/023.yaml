  naturalness: “Olee nke ka mfe” and “Bilie” are natural Standard Igbo. Replacing “jegharịa” with “jee ije” gives the command a more natural, direct form in this healing context.
  terminology: “Mmehie” and “gbaghara” are established, appropriate biblical and modern Igbo terms. The passive/agent-unspecified formulation preserves the Greek’s restraint regarding the forgiving agent.
