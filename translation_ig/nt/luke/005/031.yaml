  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: ig
  text: Jizọs zara ha sị, “Ndị ahụ dị mma anaghị achọ dọkịta, kama ndị ọrịa na-achọ ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: Jizọs zara ha sị
  rationale: Ngwakọta participle na ngwaa okwu a bụ usoro akụkọ Grik a na-ejikarị webata nzaghachi. ‘Zara ha sị’ na-egosi ma nzaghachi ahụ ma okwu so ya n’Igbo ekeghị eke.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Ọ bụghị ... ka dọkịta dị mkpa
  rationale: Usoro a na-egosipụta echiche nke ‘enweghị mkpa’ n’Igbo dị mfe ma na-edobe ọdịiche dị n’etiti ìgwè abụọ ahụ.
- source_word: οἱ ὑγιαίνοντες
  choice: ndị ahụ́ siri ike
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị nọ n’ọnọdụ ezi ahụ ike, kwekọrọ na participle nke na-akọwa otu ìgwè mmadụ.
- source_word: ἰατροῦ
  choice: dọkịta
  rationale: ‘Dọkịta’ bụ okwu Standard Igbo nke oge a, ndị mmadụ na-aghọta ngwa ngwa, maka onye na-agwọ ọrịa.
- source_word: οἱ κακῶς ἔχοντες
  choice: ndị ọrịa
  rationale: Akpaalaokwu Grik ahụ pụtara ndị na-arịa ọrịa; ‘ndị ọrịa’ na-enye ihe ọ pụtara n’Igbo n'ụzọ doro anya ma dị nkenke.
theological_decisions: []
translation_notes:
  register: Asụsụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụda ilu na ọdịiche siri ike dị n’etiti ndị ahụ́ siri ike na ndị ọrịa; ọ dịghị nkọwa ụka agbakwunyere.
