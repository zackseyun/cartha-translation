revisions:
- from: Jizọs zara ha sị, “Ọ bụghị ndị ahụ́ siri ike ka dọkịta dị mkpa, kama ọ bụ ndị ọrịa.”
  to: Jizọs zara ha sị, “Ndị ahụ dị mma anaghị achọ dọkịta, kama ndị ọrịa na-achọ ya.”
  rationale: The revision replaces ‘strong’ with the standard health-oriented expression ‘ndị ahụ dị mma’ and makes the needed physician explicit for both sides of the contrast. It retains the natural Igbo speech introduction and the concise proverbial register of the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Jesus’ response, the contrast, and the idiomatic sense of οἱ κακῶς ἔχοντες as sick people. However, “ndị ahụ́ siri ike” primarily denotes strong people rather than people who are well/healthy, and the construction “ka dọkịta dị mkpa” shifts the Greek’s explicit idea that these people need a physician. A direct subject-based expression of need is clearer and more faithful.
  naturalness: “Jizọs zara ha sị” is natural Standard Igbo narrative style. “Ndị ahụ dị mma anaghị achọ dọkịta, kama ndị ọrịa na-achọ ya” is idiomatic, clear, and preserves the proverbial contrast without relying on an awkward impersonal construction.
  terminology: “Dọkịta” is appropriate modern Standard Igbo for ἰατρός. “Ndị ahụ dị mma” accurately conveys those who are healthy/well; “ndị ọrịa” naturally conveys those who are sick. No theological terminology requires adjustment.
  issues:
  - severity: medium
    issue: “ndị ahụ́ siri ike” renders the healthy as “the strong.”
    rationale: ὑγιαίνοντες refers to people who are well or healthy. Although strength can overlap with health, “siri ike” ordinarily foregrounds strength and can obscure the medical contrast.
  - severity: medium
    issue: “ka dọkịta dị mkpa” uses an impersonal ‘doctor is necessary’ construction.
    rationale: The source says that the healthy do not have need of a physician, in contrast to the sick. Expressing that the respective groups do or do not need a doctor preserves the source relation more plainly in Igbo.
  revised_text: Jizọs zara ha sị, “Ndị ahụ dị mma anaghị achọ dọkịta, kama ndị ọrịa na-achọ ya.”
  revised_footnotes: []
