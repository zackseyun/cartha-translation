review_pass:
  verdict: revise
  source_fidelity: The draft conveys Levi's hosting of a great meal for Jesus at Levi's house and the presence of many tax collectors and others. However, “ndị ọzọ ha na ha” is structurally unclear because it lacks the relative linker, and “nọ na-eri nri” omits the source's specific portrayal of the guests as reclining at the meal. A clear, idiomatic expression can retain that detail while the note explains the ancient dining posture.
  naturalness: “Livaị meere ya nnukwu oriri n’ụlọ nke ya” is natural Standard Igbo. The revised second clause uses a relative construction and a clear locative predicate, avoiding the ambiguous repetition “ha na ha.”
  terminology: “Nnukwu oriri” appropriately renders δοχὴν μεγάλην, and “ndị ọnaụtụ” is an established, clear rendering for τελῶναι. “Dinara n’oche iri nri” represents reclining for a meal without specifying details absent from the Greek.
  issues:
  - severity: medium
    issue: The phrase “ndị ọzọ ha na ha nọ na-eri nri” lacks a relative connector and is grammatically/structurally unclear.
    rationale: The Greek οἳ introduces a relative clause describing the tax collectors and others. Adding “ndị” before “ha na ha” supplies a natural Igbo relative construction.
  - severity: medium
    issue: “Nọ na-eri nri” reduces κατακείμενοι to merely eating.
    rationale: The participle specifically depicts diners reclining. The main text should retain this narrative detail, with a cultural footnote to prevent misunderstanding.
  revised_text: Livaị meere ya nnukwu oriri n’ụlọ nke ya; e nwekwara ọtụtụ ndị ọnaụtụ na ndị ọzọ, ndị ha na ha dinara n’oche iri nri[a].
  revised_footnotes:
