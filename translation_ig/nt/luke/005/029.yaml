  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: ig
  text: Livaị meere ya nnukwu oriri n’ụlọ nke ya; e nwekwara ọtụtụ ndị ọnaụtụ na ndị ọzọ, ndị ha na ha dinara n’oche iri nri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a pụtara na ha dinara n’oche iri nri, dị ka omenala iri nri n’oriri ndị pụrụ iche n’oge ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: nnukwu oriri
  rationale: Nke a na-egosi nnukwu oriri a kwadebere maka ndị ọbịa, n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: αὐτῷ
  choice: meere ya
  rationale: Aha nnọchiaha a na-ezo aka na Jizọs n’ihe gbara amaokwu ahụ gburugburu; idowe ya dịka aha nnọchiaha na-agbaso njikọ okwu Grik.
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: n’ụlọ nke ya
  rationale: Nke a na-egosi hoo haa na ụlọ ahụ bụ nke Livaị, ma na-ezere mgbagwoju anya nke aha nnọchiaha abụọ dị nso.
- source_word: ὄχλος πολὺς τελωνῶν
  choice: ọtụtụ ndị ọnaụtụ
  rationale: N’ebe a ὄχλος πολὺς na-egosi ọnụ ọgụgụ buru ibu; Igbo eke anaghị achọ ka a sụgharịa ya dịka ‘ìgwè mmadụ buru ibu’ mgbe a kpọrọ ụdị ndị ahụ ozugbo.
- source_word: τελωνῶν
  choice: ndị ọnaụtụ
  rationale: Ọ bụ okwu Igbo doro anya a na-ejikarị akọwa ndị na-anakọta ụtụ isi.
- source_word: ἄλλων
  choice: ndị ọzọ
  rationale: Ọ na-edowe etu Grik si hapụ njirimara ndị ọzọ ahụ n’akọwaghị ya.
- source_word: μετ’ αὐτῶν
  choice: ha na ha
  rationale: Aha nnọchiaha ahụ bụ ọtụtụ na Grik, ya mere nsụgharị ahụ na-edowe ‘ha’ kama ịgbanwe ya ka ọ bụrụ otu onye.
- source_word: κατακείμενοι
  choice: nọ na-eri nri
  rationale: Nke a na-ekwupụta ihe ọnọdụ ahụ pụtara n’Igbo eke. Ihe gbasara ịdabere n’akụkụ mgbe a na-eri nri bụ omenala oge ahụ, ya mere a kọwara ya n’ala peeji.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu eke karịa ịmanye n’Igbo nkọwa ọnọdụ iri nri nke ụwa Mediterenian oge ochie; e debere nkọwa omenala ahụ n’ala peeji.
