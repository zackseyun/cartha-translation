source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: ig
  text: 'Ọ nọkwa na-agwa ha ilu a: “Ọ dịghị onye na-adọkapụ mpempe akwa n’uwe ọhụrụ wee tinye ya n’uwe ochie.[a] Ma ọ bụghị ya, ọ ga-adọka uwe ọhụrụ ahụ, mpempe akwa ahụ si n’uwe ọhụrụ agaghịkwa ekwekọ n’uwe ochie ahụ.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-esochi usoro Grik anya karị: “Ọ dịghị onye, mgbe ọ dọkapụsịrị mpempe akwa n’uwe ọhụrụ, na-etinye ya n’uwe ochie.” Okwu Grik ahụ ji ngwaa nkebiokwu nke pụtara “mgbe ọ dọkapụsịrị” tupu ngwaa bụ isi.'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “agaghị ekwekọ” dịka “agaghị adaba” ma ọ bụ “agaghị aga nke ọma na ya.” Okwu Grik ahụ na-ekwu maka enweghị nkwekọ ma ọ bụ enweghị ịdị mma nke mpempe akwa ahụ na uwe ochie ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: Ọ na-agwakwa
  rationale: Na-egosipụta imperfect nke okwu ahụ dị ka ihe ọ nọ na-ekwu, ma tinyekwa echiche nke καί (‘kwa’).
- source_word: παραβολὴν
  choice: ilu
  rationale: ‘Ilu’ bụ okwu Igbo a na-aghọta nke ọma maka ntụnyere e ji akụzi ihe; ọ dabara n’ụdị okwu Jizọs kwuru ebe a.
- source_word: ἐπίβλημα
  choice: ihe e ji akwachie akwa
  rationale: Na-akọwa mpempe akwa a na-etinye n’uwe mebiri emebi n’ụzọ doro onye Igbo nke oge a anya.
- source_word: ἀπὸ ἱματίου καινοῦ σχίσας
  choice: na-adọkapụ ... n’uwe ọhụrụ
  rationale: Na-echekwa echiche nke iwepụ mpempe ahụ site n’ịdọka uwe ọhụrụ, ma jiri usoro okwu Igbo dị ndụ.
- source_word: ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν
  choice: tinye ya n’uwe ochie
  rationale: Na-asụgharị echiche bụ isi nke ịtụkwasị ya n’elu uwe ochie, n’etinyeghị nkọwa na a dụnyere ya nke Grik ekwughị kpọmkwem.
- source_word: εἰ δὲ μήγε
  choice: Ọ bụrụ na o mee otú ahụ
  rationale: Na-egosipụta n’ụzọ ebumpụta ụwa n’Igbo ihe ọjọọ ga-esi n’omume ahụ pụta.
- source_word: καὶ τὸ καινὸν σχίσει
  choice: ọ ga-adọka uwe ọhụrụ ahụ
  rationale: Na-echekwa ngwaa active na onye a na-ekwu maka ya dị ka onye na-emebi uwe ọhụrụ site n’ịdọkapụ ihe na ya.
- source_word: οὐ συμφωνήσει
  choice: agaghịkwa adaba
  rationale: ‘Adaba’ nwere ike ịgụnye enweghị nkwekọ, enweghị ịdị mma, ma ọ bụ enweghị ịdị n’otu n’etiti ihe nkwachie ahụ na uwe ochie, na-enweghị ikpebi otu echiche naanị.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. E ji ‘ilu’ mee παραβολή, e zere ịgbakwunye na a dụnyere ihe nkwachie ahụ, ma chekwaa obosara echiche nke συμφωνέω site n’okwu ‘adaba.’
