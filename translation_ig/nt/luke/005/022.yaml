source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: ig
  text: Ma Jizọs matara echiche ha, zara ha sị, “Gịnị mere unu ji na-atụgharị uche n’ime obi unu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: matara
  rationale: Okwu a na-egosi na Jizọs ghọtara nke ọma ihe dị ha n’uche; “matara” bụ okwu Igbo doro anya nke na-akọ eziokwu ahụ n’agbanyeghị otú o si mata ya.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi obere ntụgharị ma ọ bụ ọdịiche n’akụkọ ahụ mgbe Jizọs zara echiche nzuzo ha.
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: echiche ha
  rationale: N’ebe a, aha ahụ pụtara echiche na ntụgharị uche dị n’ime ha; “echiche ha” bụ Igbo nkịtị ma doo anya.
- source_word: ἀποκριθεὶς εἶπεν
  choice: zara ha sị
  rationale: Nke a na-edobe ma echiche nke ịza ma nke ikwu okwu, n’ụzọ dị mma ma bụrụkwa nke a na-anụkarị n’Igbo.
- source_word: Τί
  choice: Gịnị mere
  rationale: Ọ bụ ezie na τί bụ “gịnị” n’ụdị ya, n’ajụjụ a ọ na-ajụ ihe kpatara ntụgharị uche ha; ya mere “Gịnị mere” bụ Igbo ebumpụta ụwa.
- source_word: διαλογίζεσθε
  choice: ji na-atụgharị uche
  rationale: Oge ugbu a na-egosi omume echiche na-aga n’ihu; “na-atụgharị uche” na-echekwa echiche nke ịtụle ihe n’ime onwe mmadụ.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: n’ime obi unu
  rationale: “Obi” n’asụsụ Akwụkwọ Nsọ na-anọchi anya ime mmadụ, gụnyere echiche na uche; nsụgharị a na-echekwa ihe atụ mbụ ahụ.
theological_decisions:
- issue: Ụdị ụzọ Jizọs si mara echiche dị n’ime ndị ọzọ
  choice: E kwuru naanị na Jizọs matara echiche ha, n’enweghị nkọwa banyere ụzọ o si mata ya.
  alternative: Ịsị na ọ matara ya n’ụzọ karịrị nke mmadụ, ma ọ bụ na ọ bụ naanị ihe ọ tụrụ aro.
  rationale: Amaokwu ahụ na-ekwu hoo haa na Jizọs maara echiche ha, ma ọ naghị akọwa ụzọ ihe ọmụma ahụ si bịa. Nsụgharị ahụ ekwesịghị ịgbakwunye ma ọ bụ ibelata ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dịkwa mfe nghọta. “Na-atụgharị uche n’ime obi unu” na-echekwa okwu ihe atụ nke Grik ma bụrụkwa okwu ndị na-agụ Igbo ga-aghọta.
