id: LUK.5.32
reference: Luke 5:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: ig
  text: Abịaghị m ịkpọ ndị ezi omume, kama ndị mmehie ka ha chegharịa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịkpọ ndị mmehie ka ha bata na nchegharị.” Nkebiokwu Grik εἰς μετάνοιαν na-egosi ebumnuche ma ọ bụ ihe a na-achọ iru.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Abịaghị m
  rationale: Oge perfect nke ἔρχομαι na-egosi ọbịbịa nke metụtara nzube Jizọs ugbu a; n'Igbo, “Abịaghị m” bụ ụzọ ebumpụta ụwa isi kwuo na ọ bụghị nke a ka ọ bịara ime.
- source_word: καλέσαι
  choice: ịkpọ
  rationale: “Ịkpọ” na-echekwa echiche sara mbara nke ịkpọ mmadụ, na-amanyeghị ya ịbụ naanị ịkpọ òkù ma ọ bụ inye iwu.
- source_word: δικαίους
  choice: ndị ezi omume
  rationale: Nke a na-asụgharị adjective e ji mee noun n'ụzọ kwụ ọtọ, ma hapụ ajụjụ ahụ ghe oghe ma hà bụ ndị ezi omume n'ezie ka ọ bụ ndị a na-ele anya dị otú ahụ.
- source_word: ἁμαρτωλοὺς
  choice: ndị mmehie
  rationale: “Ndị mmehie” bụ okwu Igbo doro anya ma guzosie ike maka ndị a na-akọwa dịka sinners n'ọnọdụ a.
- source_word: εἰς μετάνοιαν
  choice: ka ha chegharịa
  rationale: εἰς na μετάνοιαν na-egosi ebumnuche ma ọ bụ ihe ịkpọ ahụ na-eduga na ya. “Ka ha chegharịa” bụ Igbo dị mfe ma doo anya, ọ bụ ezie na ọ gbanwere noun Grik ka ọ bụrụ verb.
theological_decisions:
- issue: Ma a ga-akọwa “ndị ezi omume” dịka ndị chere na ha bụ ndị ezi omume ma ọ bụ ndị mmadụ na-ewere dị ka ndị ezi omume
  choice: E debere okwu ahụ dịka “ndị ezi omume” n'enweghị nkọwa agbakwunyere.
  alternative: ndị chere na ha bụ ndị ezi omume; ndị a na-ewere dịka ndị ezi omume
  rationale: Amaokwu Grik n'onwe ya ekwughị nkọwa ndị ahụ. Ịhapụ ọdịiche dị n'etiti “ndị ezi omume” na “ndị mmehie” dịka ọ dị na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ka ha chegharịa” maka ọdịdị Igbo ebumpụta ụwa; ndetu ala na-echekwa noun na echiche ebumnuche dị na Grik.
