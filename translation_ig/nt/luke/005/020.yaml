base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: ig
  text: Mgbe ọ hụrụ okwukwe ha[a], ọ sịrị, “Nwoke[b], agbagharala gị mmehie gị[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụkwasị obi ha.” Okwu Grik bụ “okwukwe.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “Mmadụ.” N’ebe a, a na-agwa otu nwoke okwu.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “agbagharala mmehie gị.” Ụdị perfect passive nke Grik nwere ike imesi ọnọdụ dị ugbu a nke sitere n’ihe e merechaala ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Mgbe ọ hụrụ
  rationale: Nkebi a sitere na aorist participle; ‘Mgbe ọ hụrụ’ na-egosi njikọ oge ahụ n’ụzọ Igbo dị mfe ma ghara ịkọwa usoro ihe ndị ahụ karịa ihe Grik kwuru.
- source_word: πίστιν
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ okwu Igbo a na-ejikarị akọwa πίστις. N’ebe a, ọ pụtara ntụkwasị obi ha gosipụtara, ọ bụghị isi ihe gbasara ikwesị ntụkwasị obi.
- source_word: αὐτῶν
  choice: ha
  rationale: Aha nnọchi ọtụtụ mmadụ dị na Grik ka e debere, n’ebughị ụzọ kpebie ma ọ na-ezo aka n’ebe nwoke ahụ nọ naanị ya site n’ọnọchite anya, ma ọ bụ n’ebe ya na ndị butere ya nọ.
- source_word: Ἄνθρωπε
  choice: Nwoke
  rationale: Ọ bụ okwu a kpọrọ nwoke ahụ kpọmkwem. ‘Nwoke’ na-echekwa njirimara nwoke ahụ ma ghara itinye mmetụta enyi nke okwu Grik na-ekwughị.
- source_word: ἀφέωνταί
  choice: a gbagharala
  rationale: Ụdị perfect passive nke Grik na-egosi na mgbaghara ahụ emezuola, ọnọdụ si na ya pụta ka dịkwa. Ụdị Igbo a na-enye echiche ahụ n’ụzọ ebumpụta ụwa ma hapụ onye mere ihe ahụ n’aha, dịka passive Grik si eme.
- source_word: ἁμαρτίαι
  choice: mmehie
  rationale: ‘Mmehie’ bụ ntụgharị ziri ezi, doro anya, nke na-echekwa ihe okwu ahụ pụtara n’omume na n’okwukwe.
- source_word: σοι ... σου
  choice: gị ... gị
  rationale: 'E debere ma dative σοι ma genitive σου: mgbaghara ahụ metụtara ‘gị,’ mmehie ndị ahụ bụkwa ‘mmehie gị.’ Nke a bụkwa usoro a pụrụ ịghọta nke ọma n’Igbo.'
theological_decisions:
- issue: Ndị okwu ‘okwukwe ha’ na-ezo aka na ha
  choice: E debere aha nnọchi ọtụtụ mmadụ ‘ha’ n’akwụkwọ bụ isi.
  alternative: A pụrụ ịghọta ya dịka okwukwe ndị bu nwoke ahụ, ma ọ bụ okwukwe nwoke ahụ na ndị ya na ha nọ ọnụ.
  rationale: Grik ekpebighị kpọmkwem ndị niile so ná ‘ha’; ntụgharị ahụ ekwesịghị imechi nghọta ọ bụla ederede ahụ hapụrụ oghe.
- issue: Ike na oge dị n’okwu mgbaghara ahụ
  choice: ‘A gbagharala gị mmehie gị’ na-ekwupụta na mgbaghara ahụ emezuola nakwa na ọnọdụ ya ka dị.
  alternative: A pụrụ ịghọta ya dịka nkwupụta na-eme ka mgbaghara ahụ dị irè ozugbo, ma ọ bụ dịka nkwupụta na-ekwupụta mgbaghara e nyewororị.
  rationale: Perfect passive Grik na-ekwupụta eziokwu nke mgbaghara ahụ, ma ọ naghị edozi n’ụzọ doro anya nkọwa nkà mmụta okpukpe banyere kpọmkwem mgbe ma ọ bụ otú o si mee.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mgbe ọ hụrụ’ na-eme ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa; ‘Nwoke’ bụ ịkpọ nwoke ahụ okwu n’ụzọ kwụ ọtọ ma na-adịghị aka ike; ‘a gbagharala’ na-echekwa ụzọ passive na ọnọdụ sitere n’ihe e mezuru.
