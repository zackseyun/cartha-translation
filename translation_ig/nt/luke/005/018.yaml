  - severity: medium
    issue: Added detail in 'na-achọ ụzọ ha ga-esi'
    rationale: ἐζήτουν governs the infinitives 'to bring him in and to place him'; it conveys an ongoing attempt, but does not explicitly say they were seeking a way.
