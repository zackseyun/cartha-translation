  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: ig
  text: Ma lee, ndị ikom na-ebu otu nwoke kpọnwụrụ akpọnwụ n’elu ihe ndina[a], ha na-achọkwa ibubata ya ma dọba ya n’ihu ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’elu akwa e ji ebu mmadụ” ma ọ bụ “n’elu ihe ndina yiri sofa.” Okwu Grik bụ κλίνη nwere ike ịpụta ihe ndina ma ọ bụ akwa yiri ya.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, n’ihu Jizọs.
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu a na-eji adọta uche onye na-agụ ma mee ka ihe a na-akọ pụta ìhè; “Lee” bụ ụzọ Igbo doro anya ma dịkwa nsọpụrụ isi gosi nke a.
- source_word: ἄνδρες
  choice: ụfọdụ ndị ikom
  rationale: ἀνήρ na-ezo kpọmkwem aka n’ụmụ nwoke toro eto; “ụfọdụ ndị ikom” na-ada nke ọma n’Igbo ma ghara ime ka a ghọta ya dị ka mmadụ niile.
- source_word: φέροντες
  choice: nọ na-ebu
  rationale: Na-egosi omume na-aga n’ihu dị ka participle nke oge ugbu a si mee n’akụkọ ahụ.
- source_word: ἐπὶ κλίνης
  choice: n’elu ihe ndina
  rationale: κλίνη nwere ike ịbụ ihe ndina, akwa e ji ebu mmadụ, ma ọ bụ ihe yiri sofa; “ihe ndina” bụ okwu sara mbara nke na-anaghị akọwapụta karịa isi mmalite.
- source_word: ἄνθρωπον
  choice: otu nwoke
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’otu nwoke; nsụgharị a bụ nke eke ma doo anya.
- source_word: παραλελυμένος
  choice: ahụ ya kpọnwụrụ akpọnwụ
  rationale: Na-egosi ọnọdụ na-adịgide n’ihi mkpọnwụ ma na-eji okwu ndị nkịtị na-aghọta n’Igbo.
- source_word: ἐζήτουν
  choice: nọkwa na-achọ ụzọ
  rationale: Imperfect ahụ na-egosi mgbalị na-aga n’ihu; okwu a na-egosi na ha nọ na-agbalị ime ihe ahụ.
- source_word: εἰσενεγκεῖν
  choice: ha ga-esi buru ya bata
  rationale: εἰσφέρω pụtara ibubata; “buru ya bata” dabara n’ebe a n’ihi na ha na-ebu nwoke ahụ.
- source_word: θεῖναι
  choice: dọba ya
  rationale: Na-egosi idowe ma ọ bụ ịtọ mmadụ n’otu ebe, na-enweghị ịkọwapụta ọnọdụ ahụ ya karịa ihe Grik kwuru.
- source_word: ἐνώπιον αὐτοῦ
  choice: n’ihu ya
  rationale: Na-edobe nnọchiaha dị na Grik kama itinye aha Jizọs kpọmkwem n’ahịrịokwu ahụ.
theological_decisions:
- issue: Onye αὐτοῦ ikpeazụ na-ezo aka na ya
  choice: n’ihu ya
  alternative: n’ihu Jizọs
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Jizọs ka a na-ekwu, ma Grik ji nnọchiaha mee ihe. Nsụgharị ahụ debere nnọchiaha ahụ ma jiri nkọwa ụkwụ mee ka onye ọ bụ doo anya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa nsọpụrụ, mee ihe. E debere ịdị ndụ nke ἰδού site na “Lee,” tinyekwa akara nkọwa ụkwụ n’ebe ha kwesịrị ịdị n’ahịrịokwu ahụ.
