  naturalness: The revised wording uses natural contemporary Standard Igbo while retaining the narrative attention marker and the imperfect sense of ongoing effort.
  terminology: '''ndị ikom'' accurately represents adult males; ''nwoke kpọnwụrụ akpọnwụ'' is a clear, respectful rendering of the paralytic’s condition. ''ihe ndina'' appropriately preserves the breadth of κλίνη. The pronoun is retained in the verse, with the contextual referent clarified only in the footnote.'
