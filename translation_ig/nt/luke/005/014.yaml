id: LUK.5.14
reference: Luke 5:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: ig
  text: O wee nye ya iwu ka ọ ghara ịgwa onye ọ bụla, kama, “Gaa gosi onye nchụaja onwe gị, nyekwa onyinye maka ime ka ị dị ọcha, dị ka Mosis nyere n’iwu[b], ka ọ bụrụ ihe akaebe nye ha[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọ bụrụ ihe akaebe nye ha.” Nkebiokwu a nwere ike izo aka n’akaebe nye ndị nchụaja ma ọ bụ ndị ọzọ; ụfọdụ na-aghọta ya dịka ihe akaebe megide ha.
    reason: alternative_reading
  - marker: b
    text: Lee Levitikọs 14 maka onyinye Mosis nyere n’iwu banyere ime ka onye nwere ekpenta dị ọcha.
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: nyere ya iwu
  rationale: Na-egosi ntụziaka nwere ikike n'ụzọ doro anya, n’etinyeghị ike ọzọ na-adịghị n’okwu Grik.
- source_word: μηδενὶ εἰπεῖν
  choice: ka ọ ghara ịgwa onye ọ bụla
  rationale: Nke a bụ Igbo nkịtị ma doo anya nke na-echekwa mmachibido ahụ.
- source_word: ἀπελθὼν
  choice: Gaa
  rationale: Imperative a na-asụ n’Igbo n'ụzọ eke na-egosi na ịga ahụ ga-ebute igosi onye nchụaja onwe ya.
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: gosi onye nchụaja onwe gị
  rationale: Nsụgharị kwụ ọtọ nke iwu ahụ na nnọchiaha nlọghachi, ma bụrụkwa Igbo a pụrụ ịghọta.
- source_word: προσένεγκε
  choice: nyekwa onyinye
  rationale: N’ọnọdụ ịchụ àjà nke iwu Mosis, ‘nye onyinye’ na-ekwupụta ihe achọrọ n’enweghị ịkọwa ụdị àjà karịa ihe amaokwu ahụ kwuru.
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: maka ime ka ị dị ọcha
  rationale: Na-egosi ebumnuche onyinye ahụ ma jiri okwu ndị nkịtị ghọta maka ịdị ọcha dịka iwu okpukpe si dị.
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: dị ka Mosis nyere n’iwu
  rationale: Na-echekwa ntụaka doro anya n’iwu Mosis.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ka ọ bụrụ ihe akaebe nye ha
  rationale: Na-echekwa αὐτοῖς dịka ‘nye ha’ n’akọwaghị ndị ọ na-ezo aka na ha, ma hapụkwa ike okwu μαρτύριον ghe oghe.
theological_decisions:
- issue: Ndị αὐτοῖς (‘ha’) na-ezo aka na ha na ike εἰς μαρτύριον
  choice: ihe akaebe nye ha
  alternative: ihe akaebe megide ha; ihe akaebe nye ndị nchụaja; ihe akaebe nye ndị mmadụ
  rationale: Grik akpọghị ndị ‘ha’ bụ aha, ma o dokwaghị anya ma akaebe ahụ ọ bụ nke ga-abara ha uru ma ọ bụ nke ga-emegide ha. Ya mere, nsụgharị ahụ na-echekwa mgbagwoju anya ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Onye nchụaja’ na-egosi priest n’ọnọdụ iwu Mosis; ‘ihe akaebe nye ha’ na-echekwa mgbagwoju anya nke Grik. Akara ụkwụ ala [a] na [b] dị n’ederede isi.
