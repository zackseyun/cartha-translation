  to: Ọ banyere n’otu n’ime ụgbọ mmiri ndị ahụ, nke Saịmọn nwere, rịọ ya ka ọ kwapụ ụgbọ mmiri ahụ ntakịrị site n’ala.[a] Ọ nọdụ ala, si n’ụgbọ mmiri ahụ na-akụziri ìgwè mmadụ ndị ahụ ihe.
