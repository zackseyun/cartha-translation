  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: ig
  text: Ọ banyere n’otu n’ime ụgbọ mmiri ndị ahụ, nke Saịmọn nwere, rịọ ya ka ọ kwapụ ụgbọ mmiri ahụ ntakịrị site n’ala.[a] Ọ nọdụ ala, si n’ụgbọ mmiri ahụ na-akụziri ìgwè mmadụ ndị ahụ ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ikpere mmiri.” N’asụsụ Grik, ihe e kwuru n’ụzọ nkịtị bụ “site n’ala,” nke na-egosi ọdịiche dị n’etiti ụgbọ mmiri ahụ na ala kpọrọ nkụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: Ọ banyere
  rationale: Ngwaa a na-egosi na Jizọs bu ụzọ banye n’ụgbọ mmiri tupu ọ rịọ Saịmọn ihe; nsụgharị a dị mfe ma na-echekwa usoro ihe ndị mere.
- source_word: πλοίων / πλοίου
  choice: ụgbọ mmiri / ụgbọ mmiri ahụ
  rationale: N’ebe a, πλοῖον bụ ụgbọ ndị ọkụ azụ na-eji n’ọdọ mmiri. ‘Ụgbọ mmiri’ bụ okwu Igbo a na-aghọta nke ọma maka ụdị ụgbọ a.
- source_word: ὃ ἦν Σίμωνος
  choice: nke bụ nke Saịmọn
  rationale: Nke a na-egosipụta n’ụzọ doro anya na otu ụgbọ mmiri ahụ bụ nke Saịmọn.
- source_word: ἠρώτησεν
  choice: rịọ ya
  rationale: ἐρωτάω n’ebe a pụtara ịrịọ mmadụ ka o mee ihe, ọ bụghị naanị ịjụ ajụjụ.
- source_word: ἐπαναγαγεῖν
  choice: ka ọ kwapụ ụgbọ mmiri ahụ
  rationale: N’ọnọdụ ụgbọ mmiri, okwu a pụtara ime ka ụgbọ ahụ pụọ n’akụkụ ala banye ntakịrị n’ime mmiri. E kwughachiri ‘ụgbọ mmiri ahụ’ ka ihe a ga-akwapụ doo anya n’Igbo.
- source_word: ἀπὸ τῆς γῆς
  choice: site n’ala
  rationale: Nke a na-echekwa okwu nkịtị Grik, ‘ala,’ na ọdịiche dị n’etiti ala kpọrọ nkụ na ụgbọ ahụ nọ na mmiri; ‘ikpere mmiri’ ka e depụtara dị ka nhọrọ ọzọ n’okpuru peeji.
- source_word: ὀλίγον
  choice: ntakịrị
  rationale: Ọ na-egosi obere ogologo ebe ụgbọ ahụ ga-esi n’ala pụọ.
- source_word: καθίσας
  choice: Mgbe ọ nọdụrụ ala
  rationale: Nke a na-egosi na ọ nọdụrụ ala tupu ma ọ bụ ka ọ malitere izi ìgwè mmadụ ahụ ihe.
- source_word: ἐδίδασκεν
  choice: na-akụziri
  rationale: Ụdị ngwaa Grik na-egosi omume nọ na-aga n’ihu; usoro ‘na-akụziri’ na-echekwa nke ahụ n’Igbo.
- source_word: τοὺς ὄχλους
  choice: ìgwè mmadụ ahụ
  rationale: ‘Ìgwè mmadụ’ bụ ụzọ Igbo dị ugbu a na nke kwesịrị nsọpụrụ isi kwuo maka ọtụtụ ndị gbakọtara, n’enweghị okwu ochie na-adịghị adịcha mfe nghọta.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị mfe nghọta ma dị ùgwù mee nsụgharị ahụ. A họọrọ usoro ahịrịokwu sitere n’okike Igbo, ma e chekwara omume na-aga n’ihu nke ἐδίδασκεν na okwu nkịtị ‘ala’ nke γῆ.
