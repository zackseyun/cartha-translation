revisions:
- from: Ọ sịrị ha, “Unu enweghị ike ime ka ndị ọbịa agbamakwụkwọ[a] buo ọnụ mgbe nwoke na-alụ nwaanyị ahụ ka ha nọ, ka unu nwere ike?”
  to: Ọ sịrị ha, “Unu pụrụ ime ka ndị ọbịa agbamakwụkwọ[a] buo ọnụ mgbe nwoke na-alụ nwanyị nọnyere ha?”
  rationale: The revision makes explicit that the bridegroom is with the guests, smooths the rhetorical question into natural Standard Igbo, and retains both the causative sense (‘ime ka’) and the wedding imagery without theological expansion.
  reviewer_model: gpt-5.6-terra
