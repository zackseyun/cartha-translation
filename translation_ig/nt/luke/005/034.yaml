source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: ig
  text: Ọ sịrị ha, “Unu pụrụ ime ka ndị ọbịa agbamakwụkwọ[a] buo ọnụ mgbe nwoke na-alụ nwanyị nọnyere ha?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ụmụ nke ụlọ agbamakwụkwọ”; ọ bụ akpaalaokwu maka ndị na-eso nwoke na-alụ nwanyị n’emume agbamakwụkwọ, ya bụ, ndị ọbịa agbamakwụkwọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: Unu enweghị ike ... ka unu nwere ike?
  rationale: 'Ajụjụ e ji μή na ụdị ngwaa na-egosi ihe mere eme na-atụ anya azịza na-adịghị mma. Nsụgharị a chekwara ike ajụjụ ahụ: ihe a agaghị ekwe omume n’ọnọdụ ahụ.'
- source_word: υἱοὺς τοῦ νυμφῶνος
  choice: ndị ọbịa agbamakwụkwọ
  rationale: Nke a bụ akpaalaokwu pụtara ndị ha na nwoke na-alụ nwaanyị na-eme emume agbamakwụkwọ, ọ bụghị ụmụ nwoke nke otu ọnụ ụlọ n’ụzọ nkịtị. ‘Ndị ọbịa agbamakwụkwọ’ bụ Igbo doro anya ma dị ugbu a.
- source_word: νυμφίος
  choice: nwoke na-alụ nwaanyị ahụ
  rationale: Nke a na-echekwa ihe atụ banyere nwoke bụ onye a na-agba alụmdi na nwunye, n’asụsụ Igbo ndị mmadụ na-aghọta nke ọma.
- source_word: μετ’ αὐτῶν ἐστιν
  choice: ka ha nọ
  rationale: N’usoro ‘mgbe ... ka ha nọ,’ okwu a na-egosi na nwoke ahụ nọnyere ndị ọbịa ahụ, n’enweghị mgbakwunye nkọwa.
- source_word: ποιῆσαι νηστεῦσαι
  choice: ime ka ... buo ọnụ
  rationale: ‘Ime ka’ chekwara echiche causative nke ποιῆσαι, ebe ‘ibụ ọnụ’ bụ okwu Igbo a na-ejikarị maka ịhapụ iri nri n’ihi ofufe.
theological_decisions:
- issue: Ihe atụ nke na-egosi Jizọs dịka nwoke na-alụ nwaanyị
  choice: E debere ihe oyiyi ‘nwoke na-alụ nwaanyị’ n’enweghị ịkọwa onye ọ na-anọchi anya ya n’ahịrịokwu ahụ.
  alternative: Ịgbasa okwu ahụ ka o kwuo hoo haa na Jizọs na-akpọ onwe ya nwoke na-alụ nwaanyị.
  rationale: Amaokwu ahụ n’onwe ya na-enye ihe atụ ahụ ma na-ahapụ ka onye na-agụ ya ghọta ihe ọ pụtara. Nsụgharị ekwesịghị itinye nkọwa nkà mmụta okpukpe n’ime isi okwu.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. E chekwara ụdị ajụjụ na-atụ anya azịza ‘mba,’ yana ihe causative dị n’original.
