review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the causative force of ποιῆσαι νηστεῦσαι (‘ime ka ... buo ọnụ’) and identifies the wedding-company idiom appropriately. However, ‘mgbe nwoke na-alụ nwaanyị ahụ ka ha nọ’ does not clearly say that the bridegroom is with the guests; it can be read simply as ‘while they are there,’ and its syntax is awkward. The redundant negative statement plus tag question is also less natural than a single Igbo rhetorical question.
  naturalness: A direct rhetorical question, ‘Unu pụrụ ... ?’, is natural Standard Igbo and, in this context, preserves the negative answer expected by μή. ‘Nọnyere ha’ explicitly and idiomatically conveys μετ’ αὐτῶν ἐστιν.
  terminology: ‘Ndị ọbịa agbamakwụkwọ’ is a clear contextual rendering of υἱοὺς τοῦ νυμφῶνος. ‘Nwoke na-alụ nwanyị’ preserves the bridegroom image without interpretively identifying him. ‘Ibụ ọnụ’ remains the standard term for fasting.
  issues:
  - severity: medium
    issue: The phrase ‘mgbe nwoke na-alụ nwaanyị ahụ ka ha nọ’ inadequately renders μετ’ αὐτῶν ἐστιν.
    rationale: The Greek specifies that the bridegroom is present with the wedding guests. Replacing ‘ka ha nọ’ with ‘nọnyere ha’ expresses this relationship directly.
  - severity: low
    issue: The double-negative rhetorical construction is awkward in Igbo.
    rationale: ‘Unu enweghị ike ... , ka unu nwere ike?’ is understandable, but ‘Unu pụrụ ... ?’ is more idiomatic and retains the question’s expected negative answer from the Greek μή.
  revised_text: Ọ sịrị ha, “Unu pụrụ ime ka ndị ọbịa agbamakwụkwọ[a] buo ọnụ mgbe nwoke na-alụ nwanyị nọnyere ha?”
  revised_footnotes:
