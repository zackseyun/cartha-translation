review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the temporal clause, the singular command to Simon followed by the plural command concerning the nets, and the setting of deep water. However, “gbutuo azụ” is not a safe equivalent for εἰς ἄγραν (“for a catch”) and may suggest cutting fish rather than making a catch.
  naturalness: “Mgbe o kwụsịrị ikwu okwu” is more idiomatic and directly reflects ceasing to speak. “Kwọpụ gaa n’ebe mmiri dị omimi” clearly expresses putting the boat out toward deep water. “ka unu nweta azụ” is natural Igbo for the intended result of lowering the nets.
  terminology: Saịmọn is an appropriate Standard Igbo form. “ụgbụ” accurately renders fishing nets. The revised wording retains the source’s singular/plural shift without adding doctrinal interpretation.
  issues:
  - severity: medium
    issue: The phrase “ka unu wee gbutuo azụ” is semantically unsuitable.
    rationale: ἄγρα means a catch/haul, especially of fish. In Standard Igbo, “gbutuo azụ” can be understood as cutting fish and does not naturally convey catching them.
  - severity: low
    issue: “kwusịrị okwu” is less precise and idiomatic here than “kwụsịrị ikwu okwu.”
    rationale: ἐπαύσατο λαλῶν means that he ceased/finished speaking; the revision explicitly retains the ongoing activity of speaking.
  - severity: low
    issue: “gaa na mmiri miri emi” is somewhat awkward for movement out from shore.
    rationale: “gaa n’ebe mmiri dị omimi” naturally expresses going out toward the deep-water area intended by εἰς τὸ βάθος.
  revised_text: Mgbe o kwụsịrị ikwu okwu, ọ sịrị Saịmọn, “Kwọpụ gaa n’ebe mmiri dị omimi[a], unu ewetu ụgbụ unu ka unu nweta azụ.”
  revised_footnotes:
