revisions:
- from: Mgbe o kwusịrị okwu, ọ sịrị Saịmọn, “Kwọpụ gaa na mmiri miri emi[a], unu ewetu ụgbụ unu ka unu wee gbutuo azụ.”
  to: Mgbe o kwụsịrị ikwu okwu, ọ sịrị Saịmọn, “Kwọpụ gaa n’ebe mmiri dị omimi[a], unu ewetu ụgbụ unu ka unu nweta azụ.”
  rationale: The revision corrects the rendering of the purpose phrase “for a catch,” improves idiomatic Standard Igbo, and preserves the Greek’s singular command to Simon (“Kwọpụ”) followed by the plural command to Simon and his companions (“unu ewetu”). The footnote remains correctly anchored and accurately explains the lexical alternative.
