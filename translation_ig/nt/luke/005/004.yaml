  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: ig
  text: Mgbe o kwụsịrị ikwu okwu, ọ sịrị Saịmọn, “Kwọpụ gaa n’ebe mmiri dị omimi[a], unu ewetu ụgbụ unu ka unu nweta azụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “gaa n’ime omimi.” N’asụsụ Grik, ihe e dere kpọmkwem bụ “n’ime omimi,” nke na-ezo aka n’ebe mmiri dị omimi n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: Mgbe o kwusịrị okwu
  rationale: Nkebiokwu a na-egosi na ihe Jizọs na-emezi malitere mgbe o mechara ikwu okwu; nsụgharị a bụ Igbo e ji eme ihe ma debe usoro oge ahụ.
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: ọ sịrị Saịmọn
  rationale: Nke a na-asụgharị okwu mmeghe ahụ n'ụzọ kwụ ọtọ ma dị mma n'Igbo.
- source_word: Ἐπανάγαγε
  choice: Kwọpụ gaa
  rationale: N'ọnọdụ a, okwu ahụ pụtara isi n'akụkụ mmiri kwọpụ ụgbọ mmiri gaa n'ihu. Igbo a na-eme ka ọnọdụ ụgbọ mmiri doo anya n'etinyeghị ‘oké osimiri,’ ebe ihe a mere n'ọdọ mmiri.
- source_word: εἰς τὸ βάθος
  choice: na mmiri miri emi
  rationale: βάθος pụtara ‘omimi,’ ma n'ebe a ọ na-ekwu maka ebe mmiri dị omimi; nsụgharị a doro onye na-agụ akwụkwọ anya ma debe echiche ahụ.
- source_word: χαλάσατε τὰ δίκτυα ὑμῶν
  choice: unu ewetu ụgbụ unu
  rationale: Ụdị ọtụtụ nke iwu ahụ na nnọchiaha ahụ ka e debere site n'iji ‘unu’; ‘wetu’ dabara n'iwetu ụgbụ site n'ụgbọ mmiri.
- source_word: εἰς ἄγραν
  choice: ka unu wee gbutuo azụ
  rationale: N'ebe ịkụ azụ nọ, ἄγρα bụ azụ a chọrọ ijide. Nsụgharị a na-egosi nzube nke iwetu ụgbụ n'Igbo nkịtị.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu, mee ihe. E debere mgbanwe dị n'okwu Grik site n'iwu onye otu (‘Kwọpụ’) gaa n'iwu ọtụtụ mmadụ (‘unu ewetu’), nke na-egosi na a gwara Saịmọn nke mbụ, mesịa gwa ndị nọnyere ya niile.
