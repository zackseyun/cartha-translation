id: LUK.5.1
reference: Luke 5:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: ig
  text: O mere na, mgbe ìgwè mmadụ ahụ na-amagide ya ma na-ege okwu Chineke ntị[a], ọ nọ na-eguzo n’akụkụ ọdọ mmiri Genesaret[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ìgwè mmadụ ahụ na-amagide ya ma na-anụ okwu Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Genesaret bụ ọdọ mmiri a na-akpọkwa Oké Osimiri Galili.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: O wee ruo na
  rationale: Nke a bụ usoro Luk ji ewebata ihe omume. Nsụgharị a na-anọchi anya ọrụ akụkọ nke Ἐγένετο na njikọ dị nro nke δέ, n’enweghị itinye okwu oge na-adịghị na Grik.
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: mgbe ... nọ na-amịgide ... ma na-ege ... ntị
  rationale: Usoro ἐν τῷ ya na infinitive na-egosi ihe na-eme n’otu oge; e debere omume abụọ ahụ iche dịka Grik si mee.
- source_word: ὄχλον
  choice: ìgwè mmadụ ahụ
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ọtụtụ mmadụ gbakọrọ ọnụ.
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: nọ na-amịgide ya
  rationale: Na-egosi na ìgwè ahụ na-abịaru ya nso nke ukwuu ma na-etinye ya n’etiti nrụgide mmadụ, ọ bụghị naanị na ha gbara ya gburugburu.
- source_word: ἀκούειν
  choice: na-ege ... ntị
  rationale: Na-egosi ige ntị nke ọma na nke nwere ebumnuche, karịa naanị ịnụ ụda.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  rationale: Na-echekwa ịdị arọ na obosara nke ahịrịokwu Grik, ma na-ada n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: ya onwe ya guzo
  rationale: Na-echekwa αὐτός nke na-atụgharị uche n’ebe Jizọs nọ, tinyere ọnọdụ guzo nke na-aga n’ihu; okwu gbara ya gburugburu na-eme ka oge gara aga doo anya.
- source_word: παρὰ τὴν λίμνην
  choice: n’akụkụ Ọdọ Mmiri
  rationale: Na-egosi ọnọdụ ya n’akụkụ mmiri ahụ n’Igbo doro anya.
- source_word: Γεννησαρέτ
  choice: Genesaret
  rationale: A sụgharịghị aha ahụ ka ọ bụrụ aha ọzọ; e dere ya dịka ụda aha Grik si kwekọọ n’Igbo.
theological_decisions:
- issue: Nsụgharị τὸν λόγον τοῦ θεοῦ
  choice: okwu Chineke
  alternative: ozi Chineke
  rationale: “Okwu Chineke” na-echekwa ma echiche nke ozi a na-ekwusa ma obosara nkà mmụta okpukpe na njikọ ya na akụkụ Akwụkwọ Nsọ ndị ọzọ.
- issue: Otu e si mesoo Γεννησαρέτ
  choice: Genesaret
  alternative: Oké Osimiri Galili
  rationale: Grik kpọrọ ọdọ ahụ Genesaret. Ịgbanwe ya ka ọ bụrụ Oké Osimiri Galili n’ahịrị bụ ịtinye nkọwa njirimara na-anọghị kpọmkwem n’okwu amaokwu ahụ.
- issue: Ike αὐτός n’ahịrịokwu ahụ
  choice: ya onwe ya
  alternative: ọ
  rationale: A hapụrụ ntakịrị ike nke αὐτός ka ọdịiche dị n’etiti ìgwè mmadụ ahụ na onye guzo n’akụkụ ọdọ mmiri pụta ìhè, n’enweghị ịgbakwunye nkọwa ozizi.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. E ji “Ọdọ Mmiri” kọwaa λίμνη n’ụzọ ziri ezi, ebe e debere aha Genesaret n’ahịrị ma tinye aha ọzọ a maara ya na nkọwa ala peeji.
