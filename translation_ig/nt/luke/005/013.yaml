  to: O setịpụtara aka ya, metụ ya aka, sị, “Achọrọ m; dị ọcha.” Ozugbo ahụ, ọrịa ekpenta[a] ahụ hapụrụ ya.
  rationale: The revision adds necessary punctuation and uses “setịpụtara” for a clear, natural rendering of extending the hand. It retains the draft’s accurate rendering of the command and the traditional term for λέπρα, while refining the footnote so that it explains the ancient term’s broader range more naturally and without unnecessary overstatement.
