id: LUK.5.13
reference: Luke 5:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: ig
  text: O setịpụtara aka ya, metụ ya aka, sị, “Achọrọ m; dị ọcha.” Ozugbo ahụ, ọrịa ekpenta[a] ahụ hapụrụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n'ụzọ sara mbara dịka “ọrịa akpụkpọ.” N’iji okwu Grik λέπρα eme ihe n’Akwụkwọ Nsọ, ọ pụrụ ịpụta ụdị ọrịa akpụkpọ dị iche iche, ọ bụghị naanị ọrịa ekpenta nke a maara taa.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: setịrị aka ya
  rationale: Nke a na-egosipụta omume ịgbatị aka n'ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: ἥψατο αὐτοῦ
  choice: metụ ya aka
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ imetụ mmadụ aka, ma na-edobe mkpa omume Jizọs nke imetụ nwoke ahụ aka.
- source_word: Θέλω
  choice: Achọrọ m
  rationale: N'ọnọdụ a, okwu Grik ahụ na-egosi na o kwere ime ya ma chọọ ime ya, ọ bụghị naanị ihe ga-eme n'ọdịnihu.
- source_word: καθαρίσθητι
  choice: dị ọcha
  rationale: Nke a na-edobe echiche ịdị ọcha nke okwu Grik ahụ, nke gụnyere ahụ ike na ịdị ọcha n'usoro okpukpe, kama iji naanị okwu pụtara ‘gwọọ.’
- source_word: εὐθέως
  choice: Ozugbo ahụ
  rationale: Ọ bụ okwu Igbo doro anya nke na-egosi na ihe ahụ mere n'egbughị oge.
- source_word: λέπρα
  choice: ọrịa ekpenta
  rationale: Nke a bụ aha ndị na-agụ Igbo maara nke ọma n'akụkọ ndị a; ihe odide ala peeji na-akọwa na okwu Grik ahụ nwere ike ịgụnye ọrịa akpụkpọ ndị ọzọ.
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: hapụrụ ya
  rationale: Nke a bụ okwu Igbo dị mfe ma kwekọọ n'echiche na ọrịa ahụ wepụrụ onwe ya n'ahụ nwoke ahụ.
theological_decisions:
- issue: Otú e si sụgharịta καθαρίσθητι n'ịgwọ onye nwere ọrịa ekpenta
  choice: dị ọcha
  alternative: gwọọ; ka e mee ka ị dị ọcha
  rationale: “Dị ọcha” na-echekwa echiche ịdị ọcha nke karịrị naanị ọgwụgwọ anụ ahụ ma na-agụnyekwa ọnọdụ onye ahụ n'obodo na n'usoro okpukpe. Ọ bụkwa Igbo dị nkenke ma kwekọọ n'iwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugwu, dị mfe nghọta, ma bụrụkwa nke ndị mmadụ na-asụ ugbu a. Ahịrịokwu ahụ na-edobe usoro omume nke Grik n'ụzọ na-aga nke ọma n'Igbo, ebe akara ala peeji dị n'akụkụ okwu ọ na-akọwa.
