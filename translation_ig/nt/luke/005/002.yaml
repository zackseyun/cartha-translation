translation_notes:
  register: Asụsụ Igbo Standard dị ugbu a, dị ugwu ma dị mfe nghọta. E zere okwu teknụzụ dịka “rịdata n'ụgbọ” na nkọwa karịrị isi mmalite dịka ikwu na e kegidere ụgbọ ndị ahụ n'ọdụ.
