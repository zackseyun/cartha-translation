  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: ig
  text: Ọ hụkwara ụgbọ mmiri abụọ dị n’akụkụ ọdọ mmiri ahụ, ma ndị ọkụ azụ esiwo n’ụgbọ ndị ahụ pụta, na-asa ụgbụ ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: Ọ hụkwara
  rationale: Oge aorist nke ὁράω na-akọ ihe mere n'usoro akụkọ; “hụkwara” na-ejikọta ya na amaokwu bu ụzọ ma na-asụ Igbo nke ọma.
- source_word: δύο πλοῖα
  choice: ụgbọ mmiri abụọ
  rationale: N'ọnọdụ ịkụ azụ n'ọdọ mmiri, “ụgbọ mmiri” bụ okwu Igbo nkịtị ma kwekọọ na πλοῖα n'enweghị ime ka ha bụrụ nnukwu ụgbọ.
- source_word: ἑστῶτα
  choice: ka ha kwụsịrị
  rationale: Perfect participle na-egosi ụgbọ ndị ahụ nọ n'otu ebe. “Kwụsịrị” na-adị eke karịa ịsị na ụgbọ mmiri “guzoro,” ma ọ naghị agbakwunye na e kegidere ha.
- source_word: παρὰ τὴν λίμνην
  choice: n'akụkụ ọdọ mmiri ahụ
  rationale: παρά na accusative ebe a na-egosi ọnọdụ n'akụkụ ihe; λίμνη bụ “ọdọ mmiri,” ọ bụghị “oké osimiri.”
- source_word: οἱ δὲ ἁλιεῖς
  choice: ma ndị ọkụ azụ
  rationale: “Ma” na-echekwa obere ọdịiche ma ọ bụ mgbanwe ọnọdụ nke δέ, ebe “ndị ọkụ azụ” bụ aha ọrụ doro anya.
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: esiwo n'ime ha pụta
  rationale: Aorist participle na-egosi na ha buru ụzọ pụta n'ụgbọ ndị ahụ tupu ọrụ ịsa ụgbụ na-aga n'ihu; “esiwo ... pụta” na-egosipụta usoro ahụ n'Igbo eke.
- source_word: ἔπλυνον
  choice: na-asa
  rationale: Imperfect na-egosi ọrụ na-aga n'ihu n'oge ahụ; ụdị “na-asa” na-echekwa akụkụ a.
- source_word: τὰ δίκτυα
  choice: ụgbụ ha
  rationale: δίκτυα bụ “ụgbụ.” Agbanyeghị na Greek kwuru article kama possessive, Igbo chọrọkarị “ha” ebe a iji mee ka onye nwe ụgbụ pụta ìhè n'ụzọ eke, n'enweghị ịgbanwe echiche.
