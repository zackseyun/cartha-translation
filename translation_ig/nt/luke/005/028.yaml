- from: Ọ hapụrụ ihe niile[a], bilie soro ya.
  to: Ọ hapụrụ ihe niile[a], biliri soro ya.
  rationale: The revision changes only “bilie” to “biliri” to give the required past narrative sense. The footnote is adjusted to a natural Standard Igbo anterior expression. The translation continues to state that Levi left everything, without specifying the duration or implications of that renunciation.
