  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: ig
  text: Ọ hapụrụ ihe niile[a], biliri soro ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ọ hapụsịrị ihe niile, o biliri soro ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ọ
  rationale: N'Igbo, njikọ nke amaokwu a na nke bu ya ụzọ pụtara nke ọma n'enweghị ịmalite ya na “Na”; nnọchiaha ahụ na-eme ka akụkọ gaa n'ihu n'ụzọ eke.
- source_word: καταλιπὼν
  choice: hapụrụ
  rationale: Aorist participle a na-egosi omume e mere tupu omume isi; “hapụrụ” na-egosi mkpebi siri ike n'etinyeghị echiche karịrị “gbahapụrụ.”
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-edobe nghọta zuru ezu nke neuter plural πάντα n'Igbo dị mfe ma kwe nghọta.
- source_word: ἀναστὰς
  choice: bilie
  rationale: N'akụkọ a, ἀνίστημι pụtara ibili iji mee ihe; “bilie” bụ okwu Igbo dị nkenke ma kwekọọ n'usoro omume ndị gara aga.
- source_word: ἠκολούθει
  choice: soro
  rationale: Imperfect ahụ nwere ike igosi omume na-aga n'ihu, ma n'ebe a Igbo simple past “soro” na-egosi nke ọma mmalite na ịga n'ihu nke iso Jizọs n'ekwughị ihe ederede ahụ n'ụzọ gabigara ókè.
- source_word: αὐτῷ
  choice: ya
  rationale: A na-edobe nnọchiaha Greek ahụ; ihe gbara amaokwu ahụ gburugburu na-egosi na ọ na-ezo aka na Jizọs.
theological_decisions:
- issue: Ókè ihe Livay hapụrụ mgbe ọ ghọrọ onye na-eso ụzọ
  choice: Ederede ahụ kwuru na ọ hapụrụ “ihe niile” soro Jizọs, ma ọ kọwaghị ma nke a ọ bụ ịhapụ ihe onwunwe ya niile ruo mgbe ebighị ebi.
  alternative: Ịsị na ọ hapụrụ naanị ọrụ ya nwa oge, ma ọ bụ na ọ jụụrụ ihe onwunwe niile kpamkpam ruo mgbe ebighị ebi.
  rationale: Nsụgharị ahụ na-edobe okwu zuru ezu πάντα (“ihe niile”) na mkpebi siri ike nke nzaghachi ya, ma ọ naghị etinye ozizi gbasara ihe onwunwe ma ọ bụ ọrụ nke amaokwu ahụ na-ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro ngwaa ndị gara aga mee ka omume ndị a—ịhapụ ihe niile, ibili, na iso ya—pụta n'ụzọ eke; akara [a] dị n'ederede isi.
