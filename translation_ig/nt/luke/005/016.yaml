  rationale: The revision restores the withdrawal sense of ὑποχωρέω, preserves the customary past aspect of the Greek imperfect construction, and keeps ἐν ταῖς ἐρήμοις broad as solitary or uninhabited places. The footnote has been adjusted to give a genuine more-literal alternative without changing the verse's meaning.
