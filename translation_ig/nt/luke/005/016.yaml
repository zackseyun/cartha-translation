  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ἦν ὑποχωρῶν ἐν ταῖς ἐρήμοις καὶ προσευχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/016.yaml
  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: ig
  text: Ma ya onwe ya na-ewepụkarị onwe ya gaa n'ebe ndị mmadụ na-adịghị, na-ekpekwa ekpere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ma ya onwe ya nọ na-ewepụ onwe ya n'ebe ndị mmadụ na-adịghị, na-ekpekwa ekpere.” N'asụsụ Grik, e ji imperfect nke ngwaa “ịbụ” na participle abụọ mee ihe; nke a na-egosi omume na-aga n'ihu ma ọ bụ nke a na-eme ugboro ugboro n'oge gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Nnọchiaha ahụ pụtara ìhè n'asụsụ Grik ma nwee ntakịrị nkwusi ike; “ya onwe ya” na-echekwa nke a n'Igbo n'ụzọ ebumpụta ụwa.
- source_word: δὲ
  choice: Ma
  rationale: 'Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n''akụkọ ahụ: n''agbanyeghị mgbasa nke akụkọ banyere ya, ọ na-apụkarị ikpe ekpere.'
- source_word: ἦν ὑποχωρῶν
  choice: na-agakarị
  rationale: Ngwakọta imperfect nke εἰμί na participle na-egosi omume a na-eme ugboro ugboro ma ọ bụ nke bụ omenala n'oge gara aga; “na-agakarị” na-egosipụta nke a nke ọma n'Igbo.
- source_word: ἐν ταῖς ἐρήμοις
  choice: n'ebe ndị mmadụ na-adịghị
  rationale: Ụdị ọtụtụ nke ἔρημος na-ekwu maka ebe ndị mmadụ na-ebighị ma ọ bụ ebe dịpụrụ adịpụ, ọ bụghị naanị ọzara nwere otu ọdịdị ala; okwu a na-edobe ἐν dị ka “n'ebe.”
- source_word: καὶ
  choice: na-…kwa
  rationale: Ọ na-ejikọta omume abụọ ahụ; ngwakọta “na-…kwa” bụ ụzọ Igbo si egosi njikọ a n'ụzọ dị larịị.
- source_word: προσευχόμενος
  choice: na-ekpekwa ekpere
  rationale: Participle a na-akọwa omume ikpe ekpere nke na-aga n'otu oge na ịpụ n'ebe ndị mmadụ nọ, ma bụrụkwa omume a na-eme ugboro ugboro.
theological_decisions:
- issue: Ụdị oge na ugboro omume Jizọs
  choice: Amaokwu ahụ na-egosi na ịpụ n'ebe ndị mmadụ na-adịghị na ikpe ekpere bụ ihe ọ na-eme ugboro ugboro.
  alternative: Amaokwu ahụ nwere ike ịkọ naanị otu oge kpọmkwem ọ pụrụ gaa ikpe ekpere.
  rationale: ἦν ya na participle abụọ dị ugbu a na-egosikarị omume na-aga n'ihu ma ọ bụ nke a na-eme dịka omenala n'oge gara aga. Nsụgharị ahụ na-echekwa nghọta ụtọasụsụ a n'etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. “N'ebe ndị mmadụ na-adịghị” na-ezere ime ἔρημος ka ọ bụrụ naanị “ọzara,” ma na-echekwa echiche nke ebe mmadụ na-adịghị ma ọ bụ ebe dịpụrụ adịpụ.
