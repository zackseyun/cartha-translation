  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: θάμβος γὰρ περιέσχεν αὐτὸν καὶ πάντας τοὺς σὺν αὐτῷ ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων ⸀ὧν συνέλαβον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/009.yaml
  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: ig
  text: N’ihi na oke ihe ijuanya jidere ya na ndị niile ha na ya nọ n’ihi mgbute azụ ahụ ha jidere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi azụ ndị ha jidere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: oke ihe ijuanya
  rationale: Okwu a na-egosi ijuanya dị ukwuu nke bịara na mberede; nkebi a bụ asụsụ Igbo doro anya ma na-egosipụta ike mmetụta ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na omume Saimọn n’amaokwu bu ya ụzọ site n’inye ihe kpatara ya.
- source_word: περιέσχεν
  choice: jidere
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara na ijuanya rikpuru ma ọ bụ jide mmadụ; “jidere” na-enye okwu Igbo e ji akọ mmetụta siri ike nke dakwasịrị mmadụ.
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: ndị niile ha na ya nọ
  rationale: Ọ na-edobe mkpokọta nke πάντας ma na-ezo aka n’ụmụnna ọrụ nọnyere Saimọn.
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: n’ihi ọtụtụ azụ
  rationale: ἐπί na-egosi ihe kpatara ijuanya ahụ, ebe ἄγρα n’ebe a bụ azụ e jidere; “ọtụtụ azụ” na-akọ ihe ahụ n’Igbo nkịtị ma zere nkwughachi na-adịghị ụtọ.
- source_word: ὧν συνέλαβον
  choice: ndị ha jidere
  rationale: Nnochiaha ahụ na-alaghachi n’azụ, ebe ngwaa ahụ bụ ọtụtụ mmadụ; nsụgharị a na-edobe na ha niile sonyere n’ijide azụ ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara njikọ nkọwa nke γὰρ na ike mmetụta dị na θάμβος περιέσχεν, n’enweghị ịgbakwunye nkọwa ụka ọ bụla.
