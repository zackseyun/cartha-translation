review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the explanatory γάρ, the overwhelming astonishment, Simon and all his companions, and the plural action of catching. However, “ọtụtụ azụ” means “many fish” and replaces ἄγρα (“catch/haul”) with a statement of quantity; abundance is inferable from the context but is not stated by this verse’s wording.
  naturalness: “Oke ihe ijuanya jidere ya” and “ndị niile ha na ya nọ” are natural, clear Standard Igbo. “Mgbute azụ” naturally expresses a catch or haul of fish in this context.
  terminology: Use “mgbute azụ” for ἄγρα in order to retain the event/result of catching rather than introducing “many.” The footnote is revised so that it supplies a real lexical alternative rather than largely repeating the main text.
  issues:
  - severity: medium
    issue: “ọtụtụ azụ” renders the catch as a quantity of fish.
    rationale: The Greek says “the catch of fish,” not explicitly “many fish.” The surrounding narrative describes abundance, but the translation should not import that detail into this clause.
  - severity: low
    issue: The existing footnote does not function as a meaningful alternative to the main wording.
    rationale: Its wording mostly repeats “azụ ndị ha jidere” and does not clarify an alternative rendering of ἄγρα.
  revised_text: N’ihi na oke ihe ijuanya jidere ya na ndị niile ha na ya nọ n’ihi mgbute azụ ahụ ha jidere.[a]
  revised_footnotes:
