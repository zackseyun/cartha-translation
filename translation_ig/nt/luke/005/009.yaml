revisions:
- from: N’ihi na oke ihe ijuanya jidere ya na ndị niile ha na ya nọ n’ihi ọtụtụ azụ ndị ha jidere.[a]
  to: N’ihi na oke ihe ijuanya jidere ya na ndị niile ha na ya nọ n’ihi mgbute azụ ahụ ha jidere.[a]
  rationale: The revision replaces “ọtụtụ azụ” with “mgbute azụ” to represent ἄγρα as the catch/haul itself, while retaining the relative clause that identifies the fish caught by the group. No theological interpretation is introduced.
