review_pass:
  verdict: revise
  source_fidelity: The adversative “Kama,”, the directional phrase “n’ime,” and “akpa akpụkpọ” accurately convey ἀλλὰ, εἰς, and ἀσκούς. However, “a ga-etinye” normally states a future/passive event (“will be put”) and does not adequately express the necessity inherent in βλητέον. “A ghaghị itinye” clearly conveys the required impersonal necessity.
  naturalness: The revised wording is natural, clear Standard Igbo. “Akpa akpụkpọ” is an understandable designation for skin containers and is appropriate in this concise saying.
  terminology: “Mmanya ọhụrụ” accurately represents οἶνον νέον. Using “ọhụrụ” for the wineskins is idiomatic Igbo; the footnote appropriately preserves the lexical distinction between νέος and καινός without forcing an unnatural distinction into the main text.
  issues:
  - severity: medium
    issue: The rendering of βλητέον as “a ga-etinye” is insufficiently necessitative.
    rationale: βλητέον is an impersonal verbal adjective expressing what must or ought to be done, not merely what will occur. “A ghaghị itinye” preserves this force.
  revised_text: Kama, a ghaghị itinye mmanya ọhụrụ n’ime akpa akpụkpọ ọhụrụ.[a]
