  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: ig
  text: Kama, a ghaghị itinye mmanya ọhụrụ n’ime akpa akpụkpọ ọhụrụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “akpa akpụkpọ dị ọhụrụ ma dị mma.” N’asụsụ Grik, e ji okwu nkọwa abụọ dị iche mee ihe: νέος (“ọhụrụ,” karịsịa n’ihe gbasara oge) maka mmanya, na καινός (“ọhụrụ” ma ọ bụ “dị ọhụrụ ma dị mma,” karịsịa n’ihe gbasara ụdị ma ọ bụ ọnọdụ) maka akpa akpụkpọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: Njikọ a na-egosi ọdịiche dị n’etiti ihe na-ekwesịghị ekwesị e kwuru n’amaokwu bu ụzọ na ihe kwesịrị ime ebe a.
- source_word: οἶνον νέον
  choice: mmanya ọhụrụ
  rationale: νέον na-akọwa οἶνον ozugbo; “mmanya ọhụrụ” bụ okwu Igbo doro anya maka mmanya e mere ọhụrụ.
- source_word: εἰς
  choice: n’ime
  rationale: Ọ na-egosi itinye ihe banye n’ime ihe e ji echekwa ya.
- source_word: ἀσκοὺς
  choice: akpa akpụkpọ
  rationale: ἀσκός bụ akpa e ji akpụkpọ anụ mee maka idebe mmiri dịka mmanya; okwu a na-eme ka ihe ọdịnala ahụ doo onye na-agụ taa anya.
- source_word: καινοὺς
  choice: ọhụrụ
  rationale: N’Igbo nkịtị, “ọhụrụ” bụ ụzọ kachasị eke isi kọwaa akpa ndị dị ọhụrụ ma dị mma maka mmanya ọhụrụ. Ihe dị iche n’etiti νέος na καινός siri ike igosipụta n’ahịrị ahụ n’enweghị okwu na-adịghị eke, ya mere a kọwara ya n’okpuru.
- source_word: βλητέον
  choice: a ga-etinye
  rationale: Ụdị okwu a na-egosi ihe dị mkpa ma ọ bụ ihe a kwesịrị ime; “a ga-etinye” na-egosipụta iwu dị mkpa ahụ n’ụzọ Igbo dị mma.
theological_decisions:
- issue: Ọdịiche dị n’etiti νέος na καινός n’otu ahịrịokwu
  choice: Jiri “ọhụrụ” maka ha abụọ n’ahịrịokwu, ma kọwaa ọdịiche okwu Grik n’okpuru.
  alternative: Jiri “ọhụrụ” maka mmanya, jiri okwu dịka “dị ọhụrụ ma dị mma” maka akpa akpụkpọ.
  rationale: Asụsụ Igbo nkịtị enweghị ụzọ dị mkpirikpi ma dị eke nke na-ekewa echiche νέος, nke na-elekwasịkarị anya n’oge, na καινός, nke nwere ike ilekwasị anya n’ọnọdụ ma ọ bụ ịdị ọhụrụ. Ime ka ha abụọ bụrụ “ọhụrụ” na-eme ka ahịrịokwu dịrị eke, ebe nkọwa ala na-echekwa ọdịiche dị n’isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “akpa akpụkpọ” kọwaa akpa e ji akpụkpọ anụ mee n’enweghị ịdabere n’okwu mgbaziri amaghị ama; nkọwa ala na-echekwa ọdịiche okwu Grik.
