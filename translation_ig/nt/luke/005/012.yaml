revisions:
- from: O wee ruo na mgbe ọ nọ n’otu n’ime obodo ndị ahụ, lee, otu nwoke ekpenta juru n’ahụ́[a] nọ ebe ahụ. Mgbe ọ hụrụ Jizọs, ọ dara kpudo ihu ya n’ala, rịọsie ya ike, sị, “Onyenwe anyị, ọ bụrụ na ị chọrọ, ị pụrụ ime ka m dị ọcha[b].”
  to: O wee mee na mgbe ọ nọ n’otu n’ime obodo ndị ahụ, lee, e nwere otu nwoke ekpenta juru n’ahụ́[a]. Mgbe ọ hụrụ Jizọs, ọ dara kpudo ihu n’ala ma rịọsiri ya ike, sị, “Onyenwe anyị, ọ bụrụ na ị chọrọ, i nwere ike ime ka m dị ọcha[b].”
  rationale: 'The revisions correct two grammatical/idiomatic problems and streamline the scene introduction while preserving every significant source element: temporal setting, ἰδού’s vivid presentation, the severity denoted by πλήρης λέπρας, prostration, earnest petition, the conditional expression of Jesus’ willingness, ability, and cleansing language. Footnote anchors remain attached to the relevant expressions, and the notes preserve the broader ancient sense of λέπρα and καθαρίζω.'
