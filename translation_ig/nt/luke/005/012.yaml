id: LUK.5.12
reference: Luke 5:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: ig
  text: O wee mee na mgbe ọ nọ n’otu n’ime obodo ndị ahụ, lee, e nwere otu nwoke ekpenta juru n’ahụ́[a]. Mgbe ọ hụrụ Jizọs, ọ dara kpudo ihu n’ala ma rịọsiri ya ike, sị, “Onyenwe anyị, ọ bụrụ na ị chọrọ, i nwere ike ime ka m dị ọcha[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ekpenta kpuchiri ahụ́ ya.” Grik sịrị na “ekpenta juru” ya, iji gosi otú ọrịa ya siri dị njọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mee ka m dị ọcha.” Okwu a pụrụ izo aka n’ịgwọ ọrịa nakwa n’ime ka mmadụ dị ọcha n’ihe gbasara emume okpukpe na mmekọrịta ya na ọha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo
  rationale: Na-egosipụta usoro Luk si ewebata ihe omume n’ụzọ Igbo dị mma ma dịkwa ugwu.
- source_word: ἐν τῷ εἶναι αὐτὸν
  choice: mgbe ọ nọ
  rationale: Na-atụgharị infinitive nwere article dị ka nkebiokwu oge n’Igbo nkịtị.
- source_word: μιᾷ τῶν πόλεων
  choice: n’otu n’ime obodo ndị ahụ
  rationale: “Obodo” anaghị amanye echiche nke nnukwu obodo, ma na-adabara πόλις n’ọnọdụ a.
- source_word: ἰδοὺ
  choice: lee
  rationale: Na-echekwa akara okwu nke na-adọta uche ma na-eme ka ihe ahụ pụta ìhè na mberede.
- source_word: πλήρης λέπρας
  choice: ekpenta juru n’ahụ́
  rationale: Na-echekwa okwu ike πλήρης, na-egosi na ọrịa ahụ siri ike ma gbasaa n’ahụ́ ya.
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: ọ dara kpudo ihu ya n’ala
  rationale: Na-egosi ọnọdụ ahụ́ nke ịdị umeala n’obi na arịrịọ siri ike n’Igbo doro anya.
- source_word: ἐδεήθη αὐτοῦ
  choice: rịọsie ya ike
  rationale: Na-ebute ịdị ngwa na ịdị omimi nke arịrịọ ahụ karịa nanị “rịọ ya.”
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ nsụgharị Igbo a na-anabata maka κύριος, na-echekwa nsọpụrụ na ohere nghọta Kraịst metụtara aha ahụ.
- source_word: ἐὰν θέλῃς
  choice: ọ bụrụ na ị chọrọ
  rationale: Na-egosipụta uche ma ọ bụ ọchịchọ Jizọs n’Igbo eke, n’ebughị ụzọ kpebie ihe karịrị ihe Grik kwuru.
- source_word: δύνασαί με καθαρίσαι
  choice: ị pụrụ ime ka m dị ọcha
  rationale: Na-echekwa ma ikike Jizọs ma asụsụ ịdị ọcha, nke nwere akụkụ ahụ ike, emume okpukpe, na mmekọrịta mmadụ.
theological_decisions:
- issue: Nkọwa λέπρα na καθαρίζω n’akụkọ ọgwụgwọ
  choice: Jiri “ekpenta” na “ime ka m dị ọcha.”
  alternative: Jiri “ọrịa akpụkpọ ahụ́” na “gwọọ m.”
  rationale: Asụsụ Grik na-ekwu banyere ọrịa ma na-ejikwa okwu ịdị ọcha nke pụrụ ịgụnye nlọghachi n’emume na n’etiti ọha. Nsụgharị a echekwala akụkụ ndị ahụ n’enweghị ikwu na λέπρα bụ kpọmkwem ọrịa Hansen nke oge a.
- issue: Ntụgharị κύριος mgbe nwoke ahụ na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu; Nwe m
  rationale: “Onyenwe anyị” na-echekwa nkwanye ùgwù na ụda nwere ike ibu ihe gbasara onye Jizọs bụ, ma ọ naghị amanye ka ọnọdụ a naanị ya kwuo ihe niile banyere nghọta nwoke ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “lee” chekwaa ịdị ndụ nke akụkọ ahụ; e zere okwu ochie gabigara ókè. Akara ụda dị mkpa dị na “ahụ́” iji doo ihe ọ pụtara anya.
