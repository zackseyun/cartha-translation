source:
  edition: SBLGNT
  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: ig
  text: Ma n’ihi na nwanyị di ya nwụrụ a na-enye m nsogbu mgbe niile, aga m ekpe ikpe ya n’ụzọ ziri ezi[a], ka ọ ghara ime ka ike gwụ m site n’ịna-abịakwute m mgbe niile[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “aga m akwado ikpe ya.” N’ọnọdụ ụfọdụ, ngwaa Grik a nwekwara ike ịpụta, “aga m abọ ọbọ maka ya,” ma n’ebe a ọ na-ekwu maka inye ya ikpe ziri ezi n’iwu.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “kụọ m n’okpuru anya”; dịka akpaalaokwu, “mee ka ike gwụ m” ma ọ bụ “mee ka m daa mba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον
  choice: Ma n’ihi na ... nọgidere na-enye m nsogbu
  rationale: διά na nkebi ahịrịokwu infinitive nwere isi ihe kpatara ihe, ebe γε na-agbakwụnye nkwusi ike. ‘Nọgidere na-enye m nsogbu’ na-egosipụta omume na-aga n’ihu nke παρέχειν ma na-ada nke ọma n’Igbo.
- source_word: τὴν χήραν ταύτην
  choice: anyịanyị di ya nwụrụ a
  rationale: A hapụrụ aha nwanyị ahụ n’ụzọ doro anya, n’ihi na ọnọdụ adịghị ike ya dị mkpa n’ilu ahụ.
- source_word: ἐκδικήσω αὐτήν
  choice: aga m ekpe ikpe ziri ezi nye ya
  rationale: N’ọnọdụ ikpe iwu a, ngwaa ahụ pụtara inye ya ikpe ziri ezi ma ọ bụ ịkwado ikpe ya, ọ bụghị ịbọ ọbọ n’onwe onye.
- source_word: ἵνα μὴ
  choice: ka ọ ghara
  rationale: Nke a na-egosipụta ebumnuche onyeikpe ahụ n’Igbo eke.
- source_word: εἰς τέλος ἐρχομένη
  choice: ịnọgide na-abịakwute m
  rationale: Nsụgharị a na-egosipụta ọbịbịa a na-eme ugboro ugboro ma na-aga n’ihu, n’enweghị ịkọwa εἰς τέλος dị ka njedebe ikpeazụ.
- source_word: ὑπωπιάζῃ με
  choice: mee ka ike gwụ m
  rationale: Ọ bụ okwu nwere oyiyi nke ịkụ mmadụ n’okpuru anya, ma n’ebe a ọ na-egosi ime ka mmadụ daa mba ma ọ bụ gwụ ya ike site n’ịna-enye ya nsogbu ugboro ugboro.
theological_decisions:
- issue: Ihe ἐκδικήσω pụtara n’ilu banyere ikpe ziri ezi na ekpere
  choice: aga m ekpe ikpe ziri ezi nye ya
  alternative: aga m abọ ọbọ maka ya; aga m akwado ikpe ya
  rationale: Ihe a na-ekwu bụ idozi ikpe nwanyị ahụ n’ụlọikpe. Nsụgharị a na-echekwa njikọ ya na ikpe ziri ezi n’amaokwu ndị gbara ya gburugburu, n’etinyeghị echiche nke ịbọ ọbọ n’onwe onye.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Nwanyị di ya nwụrụ’ na-edobe ọnọdụ mmekọrịta mmadụ nke χήρα; ‘mee ka ike gwụ m’ na-ebuga ike akpaalaokwu Grik n’enweghị ime ka ọ bụrụ iyi egwu anụ ahụ.
