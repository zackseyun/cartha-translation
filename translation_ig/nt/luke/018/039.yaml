reference: Luke 18:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ig
  text: Ndị na-aga n’ihu na-abara ya mba ka o mechie ọnụ; ma ọ nọgidere na-eti mkpu karịa nnọọ, sị, “Nwa Devid, meere m ebere!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: Ndị na-aga n’ihu
  rationale: Nkebi okwu a bụ participle e ji dị ka aha, ọ na-egosikwa ndị nọ n’ihu n’ìgwè ahụ, n’etinyeghị echiche na ha bụ ndị ndu.
- source_word: ἐπετίμων
  choice: baara ya mba
  rationale: Okwu Igbo a na-egosi ịbara mmadụ mba n’ike; ọdịdị imperfect nke Grik kwekọrọ n’omume na-aga n’ihu n’akụkọ a.
- source_word: ἵνα σιγήσῃ
  choice: ka ọ gbachie nkịtị
  rationale: Ọ na-egosi ebumnuche ha—ime ka ọ kwụsị ikwu ma ọ bụ iti mkpu—n’asụsụ Igbo doro anya.
- source_word: αὐτὸς δὲ
  choice: ma ya onwe ya
  rationale: Ọ na-edowe nrụgide na mmegide dị n’etiti ihe ìgwè ahụ chọrọ na ihe nwoke ahụ mere.
- source_word: πολλῷ μᾶλλον
  choice: ike karịa
  rationale: N’ọnọdụ a, ọ na-egosi na iti mkpu ya bịara sie ike karịa; ntụgharị a bụ nke e ji eme ihe n’Igbo ma ghara ịgbakwunye echiche ọzọ.
- source_word: ἔκραζεν
  choice: nọgidere na-etisi mkpu
  rationale: Ọ na-egosipụta imperfect dịka omume gara n’ihu ma ọ bụ e mere ugboro ugboro, ma chekwaa ike nke κράζω.
- source_word: Υἱὲ Δαυίδ
  choice: Nwa Devid
  rationale: A sụgharịrị aha nsọpụrụ Devid na-egosi Mesaya, ebe a hapụrụ aha Devid n’ụdị Igbo a maara.
- source_word: ἐλέησόν με
  choice: meere m ebere
  rationale: Nke a bụ arịrịọ Igbo doro anya ma dị ùgwù nke na-echekwa ngwa ngwa na ịdị omimi nke arịrịọ ahụ.
theological_decisions:
- issue: Ihe aha Υἱὲ Δαυίδ pụtara banyere Mesaya
  choice: Nwa Devid
  alternative: Iwere ya naanị dịka okwu nsọpụrụ nkịtị
  rationale: N’akụkọ Luk, aha a nwere ihe ọ pụtara banyere eze sitere n’agbụrụ Devid na Mesaya; ntụgharị kpọmkwem na-echekwa nke ahụ n’enweghị nkọwa agbakwunyere.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, doro anya ma dị ùgwù. E ji “gbachie nkịtị” na “nọgidere na-etisi mkpu” mee ka ebumnuche na omume na-aga n’ihu pụta ìhè.
