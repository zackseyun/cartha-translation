  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: ig
  text: onye ga-anata n’ezie ọtụtụ okpukpu karịa n’oge a, nakwa ndụ ebighị ebi n’ọgbọ na-abịa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχὶ μὴ
  choice: ga-anata n’ezie
  rationale: Ngwakọta okwu mgbagha a na-eme ka nkwa ahụ sie ike. N’Igbo, ‘ga-anata n’ezie’ na-egosipụta ntụkwasị obi siri ike ahụ n’enweghị mgbagha abụọ na-adịghị ada ka okwu Igbo nkịtị.
- source_word: ἀπολάβῃ
  choice: anata
  rationale: N’ebe a, okwu ahụ pụtara ịnata ụgwọ ọrụ ma ọ bụ ihe e nyereghachi; ‘anata’ dabara n’okwu Igbo dị mfe ma kwe ka amaokwu ndị gbara ya gburugburu gosipụta echiche nke nkwụghachi.
- source_word: πολλαπλασίονα
  choice: ihe dị ọtụtụ okpukpu karịa
  rationale: Nke a na-egosipụta ihe a mụbara ọtụtụ ugboro, ma zere okwu ochie ma ọ bụ nke siri ike nghọta.
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: n’oge a
  rationale: καιρός na-ezo aka n’oge ma ọ bụ mgbe pụrụ iche; ‘n’oge a’ na-edobe ọdịiche ya na ọgbọ nke na-abịa.
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: n’ọgbọ nke na-abịa
  rationale: Nsụgharị a na-edobe ọdịdị nkebiokwu Grik na echiche banyere ọgbọ dị ugbu a na ọgbọ nke ga-abịa.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa ụzọ a na-ejikarị ekwupụta ndụ na-adịgide adịgide nke oge ikpeazụ.
- source_word: ὃς
  choice: onye
  rationale: ‘Onye’ na-ejikọta amaokwu a na onye a kọwara n’amaokwu bu ya ụzọ, dịka nnọchiaha njikọ Grik si eme.
theological_decisions:
- issue: Nkọwa banyere αἰῶνι τῷ ἐρχομένῳ
  choice: n’ọgbọ nke na-abịa
  alternative: n’ọgbọ na-abịa
  rationale: A hapụrụ ọdịiche dị n’etiti oge ugbu a na usoro ụwa nke ga-abịa ka ọ dị, kama ime ya naanị okwu gbasara ọdịnihu n’ozuzu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. ‘N’ezie’ na-eburu ike nkwenye dị na οὐχὶ μὴ, ebe ‘ọgbọ nke na-abịa’ na-echekwa echiche ọgbọ abụọ nke nkebiokwu Grik.
