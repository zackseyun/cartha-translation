source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: ig
  text: Ọ̀ bụ na Chineke agaghị ekpe ikpe ziri ezi maka ndị ọ họpụtara[a]—ndị na-eti ya mkpu ehihie na abalị? Ọ̀ ga-anọgide ogologo oge tupu o kpee ha ikpe ziri ezi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ọ bụ ezie na ọ na-enwere ha ndidi,” ma ọ bụ, “ọ̀ na-enwere ha ndidi?” Akụkụ okwu Grik a nwere ike izo aka n''inwe ogologo ndidi kama igbu oge.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: ekpe ... ikpe ziri ezi
  rationale: N'ọnọdụ akụkọ onyeikpe na-adịghị ekpe ikpe ziri ezi, okwu a pụtara inye ndị a na-emegbu ikpe ziri ezi ma ọ bụ ịkwado ha, ọ bụghị ịbọ ọbọ onwe onye.
- source_word: ἐκλεκτῶν
  choice: ndị ọ họpụtara
  rationale: Adjective a na-arụ ọrụ dị ka aha; ntụgharị a doro ndị na-agụ akwụkwọ taa anya ma ghara itinye nkọwa pụrụ iche nke otu ụka.
- source_word: βοώντων
  choice: ndị na-etiku ya
  rationale: Ọ na-egosi arịrịọ siri ike a na-arịọ ugboro ugboro; “na-etiku” na-egosipụta ike arịrịọ ahụ n'ụzọ Igbo sitere n'okike.
- source_word: ἡμέρας καὶ νυκτός
  choice: ehihie na abalị
  rationale: Nke a na-edobe okwu oge ahụ n'ụzọ Igbo a na-aghọta nke ọma, na-egosikwa na arịrịọ ahụ na-aga n'ihu.
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: Ọ̀ ga-anọgide na-egbu oge imere ha ihe?
  rationale: Akụkụ Grik a siri ike ma nwee ike ịpụta ndidi ma ọ bụ igbu oge. N'ìhè amaokwu na-esote, isi ederede na-egosi ajụjụ banyere igbu oge ime ihe, ma e debere nghọta nke ndidi n'ala peeji.
- source_word: οὐ μὴ ποιήσῃ
  choice: Ọ̀ bụ na ... agaghị ekpe
  rationale: οὐ μή na aorist subjunctive na-eme ka ajụjụ ahụ sie ike ma na-atụ anya azịza ee; usoro ajụjụ Igbo a na-eburu ike ahụ nke ọma.
- source_word: θεὸς
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo ọkọlọtọ; article ahụ na-egosi onye isiokwu ahụ bụ, ọ chọghị mgbasawanye ọzọ.
theological_decisions:
- issue: Ihe μακροθυμεῖ ἐπ’ αὐτοῖς pụtara gbasara àgwà Chineke na omume ya
  choice: 'Isi ederede na-akọwa ya dị ka ajụjụ banyere igbu oge Chineke ime ihe: “Ọ̀ ga-anọgide na-egbu oge imere ha ihe?”'
  alternative: A pụkwara ịghọta ya dị ka “ọ bụ ezie na ọ na-enwere ha ndidi” ma ọ bụ “ọ̀ na-enwere ha ndidi?”
  rationale: Grik ahụ nwere ike ilekwasị anya n'ogologo ndidi, ma ihe gbara ya gburugburu, karịchaa amaokwu 8, na-emesi ikpe ziri ezi Chineke ga-eme ngwa ngwa ike. A hapụrụ esemokwu nkọwa ahụ n'enweghị idozi ya kpamkpam site n'itinye nghọta ọzọ n'ala peeji.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugwu na nke dịịrị ndị nkịtị mfe ịghọta. “Ekpe ... ikpe ziri ezi” na-edobe ọnọdụ ụlọikpe nke ilu ahụ; “ndị ọ họpụtara” na-ezere okwu ụka pụrụ iche. Akara [a] dị n'isi ederede ma kwekọọ n'ala peeji.
