revisions:
- from: Ma Jizọs kpọrọ ha ka ha bịakwute ya, sị, “Kwerenụ ka ụmụaka bịakwute m, unu egbochikwala ha, n’ihi na alaeze Chineke bụ nke ndị dị otu a.[a]”
  to: Ma Jizọs kpọrọ ha ka ha bịakwute ya, sị, “Hapụnụ ụmụaka ka ha bịakwute m, unu egbochila ha, n’ihi na alaeze Chineke bụ nke ndị dị otu a.[a]”
  rationale: Replaced only ‘Kwerenụ ka’ with ‘Hapụnụ ... ka,’ which faithfully conveys the permissive imperative Ἄφετε in natural Standard Igbo. The wording continues to preserve the source’s direct command, plural addressees, and the open-ended reference to people ‘such as these.’
  reviewer_model: gpt-5.6-terra
