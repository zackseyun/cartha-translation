review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Jesus’ calling the children to himself, the plural commands, the prohibition against hindering them, and the genitive expression identifying God’s kingdom with ‘such as these.’ However, ‘Kwerenụ ka’ ordinarily conveys agreeing/believing rather than permitting, and is not a safe rendering of Ἄφετε in this command.
  naturalness: ‘Hapụnụ ụmụaka ka ha bịakwute m’ is the clear, idiomatic Standard Igbo way to say ‘Let/allow the children to come to me.’ The remainder is natural, suitably dignified, and readily understood.
  terminology: ‘Jizọs,’ ‘ụmụaka,’ ‘alaeze Chineke,’ and ‘ndị dị otu a’ are appropriate Standard Igbo renderings. ‘Ndị dị otu a’ properly retains the representative breadth of τοιούτων without defining the intended childlike quality.
  issues:
  - severity: medium
    issue: ‘Kwerenụ ka ụmụaka’ does not naturally mean ‘Allow/let the children.’
    rationale: Ἄφετε is an imperative of permission/allowance. In Standard Igbo, ‘kwerenụ’ primarily concerns believing or agreeing; ‘Hapụnụ ... ka’ directly and naturally expresses the required permission.
  revised_text: Ma Jizọs kpọrọ ha ka ha bịakwute ya, sị, “Hapụnụ ụmụaka ka ha bịakwute m, unu egbochila ha, n’ihi na alaeze Chineke bụ nke ndị dị otu a.[a]”
  revised_footnotes:
