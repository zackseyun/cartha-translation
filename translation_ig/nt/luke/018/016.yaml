id: LUK.18.16
reference: Luke 18:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ig
  text: Ma Jizọs kpọrọ ha ka ha bịakwute ya, sị, “Hapụnụ ụmụaka ka ha bịakwute m, unu egbochila ha, n’ihi na alaeze Chineke bụ nke ndị dị otu a.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ soro okwu Grik nso karị, “n’ihi na ọ bụ nke ndị dị otu a ka alaeze Chineke bụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: kpọrọ ha ka ha bịakwute ya
  rationale: Nke a na-egosipụta ngwaa dị n’olu etiti nke pụtara ịkpọ mmadụ ka ọ bịakwute onye na-akpọ ya, ma na-edowe nnọchiaha αὐτά dị ka ‘ha.’
- source_word: Ἄφετε τὰ παιδία
  choice: Kwerenụ ka ụmụaka
  rationale: ‘Kwerenụ ka’ bụ iwu doro anya ma bụrụkwa ụzọ Igbo nke oge a si ekwu ikwe ka mmadụ mee ihe; ‘ụmụaka’ na-asụgharị παιδία n’etinyeghị nkọwa afọ nke okwu ahụ ekwughị hoo haa.
- source_word: ἔρχεσθαι πρός με
  choice: bịakwute m
  rationale: Ọ na-egosi ije bịaruo Jizọs nso n’ụzọ Igbo dị mfe ma bụrụkwa nke nkịtị.
- source_word: μὴ κωλύετε αὐτά
  choice: unu egbochikwala ha
  rationale: ‘Egbochikwala’ na-eburu echiche nke igbochi, imechi ụzọ, ma ọ bụ ime ka ha ghara ịbịa, n’akọwaghị ma ihe mgbochi ahụ amalitela ma ọ bụ na ọ malitebeghị.
- source_word: τῶν ... τοιούτων
  choice: ndị dị otu a
  rationale: Nkebiokwu a na-ezo aka n’ụmụaka nọ ebe ahụ ma nwee ike ịgụnye ndị ọzọ yiri ha; ọ naghị ekpebi kpọmkwem àgwà e ji atụnyere ha.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ ụzọ Standard Igbo si akọwa echiche ọchịchị ma ọ bụ alaeze nke Chineke, na-enweghị ịgbakwụnye nkọwa okwukwe na-adịghị n’amaokwu ahụ.
- source_word: τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: n’ihi na alaeze Chineke bụ nke ndị dị otu a
  rationale: Nhazi a bụ Igbo dị mfe ma na-egosipụta njikọ nke alaeze Chineke na ndị dị otu a, ebe ntụaka ala peeji na-edowe usoro okwu Grik nke dị nso karị.
theological_decisions:
- issue: Ókè ndị τῶν τοιούτων na-ezo aka na ha
  choice: ‘ndị dị otu a’ na-ahapụ okwu ahụ ka ọ gụnye ụmụaka ahụ na ndị ọzọ yiri ha
  alternative: Ịsụgharị ya dị ka ọ na-ezo naanị n’ụmụaka ahụ e wetara
  rationale: Τοιοῦτος na-egosikarị otu ìgwè ndị ihe atụ ndị nọ ebe ahụ nọchitere anya. Nsụgharị ahụ anaghị akọwapụta ihe kpọmkwem mere mmadụ ji dị ka nwatakịrị, n’ihi na amaokwu ahụ n’onwe ya akọwaghị ya.
- issue: Mmekọrịta alaeze Chineke na ‘ndị dị otu a’
  choice: ‘bụ nke ndị dị otu a’
  alternative: ‘bụ maka ndị dị otu a’
  rationale: ‘Bụ nke’ na-edowe echiche njikọ ma ọ bụ ịbụ nke dị n’usoro Grik, na-enweghị ime ka ọ bụrụ naanị na e nyere ha alaeze ahụ ma ọ bụ na ọ bụ naanị maka uru ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Unu’ dabara n’iwu e nyere ọtụtụ ndị; ahịrịokwu ahụ na-edowe nkwughachi ‘bịakwute’ dị n’isi mmalite na n’okwu Jizọs, dịka isi mmalite Grik si mee.
