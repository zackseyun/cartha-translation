  text: Εἶπεν δὲ ⸀ὁ Πέτρος· Ἰδοὺ ἡμεῖς ⸂ἀφέντες τὰ ἴδια⸃ ἠκολουθήσαμέν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: ig
  text: Pita wee sị, “Lee, anyị ahapụla ihe ndị bụ nke anyị[a] wee soro gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ihe ndị anyị nwere.” Okwu Grik a sara mbara; ọ kọwaghị kpọmkwem ihe Pita na ndị ọzọ hapụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: Pita wee sị
  rationale: “Wee sị” naturally marks narrative continuation in Standard Igbo while retaining the straightforward sense of “Peter said.”
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” is a natural modern Igbo attention-getter and preserves the force of ἰδού without archaic diction.
- source_word: ἡμεῖς
  choice: anyị
  rationale: The explicit first-person plural pronoun is retained; its emphasis is supported by “Lee” and the sentence context.
- source_word: ἀφέντες τὰ ἴδια
  choice: anyị ahapụla ihe ndị bụ nke anyị
  rationale: This keeps τὰ ἴδια broad rather than restricting it to property, houses, or family. The perfect-like Igbo form “ahapụla” naturally presents the prior leaving as relevant to Peter’s present claim.
- source_word: ἠκολουθήσαμέν σοι
  choice: wee soro gị
  rationale: “Soro gị” is the ordinary Igbo expression for following someone and can naturally carry the discipleship sense here; “wee” connects it idiomatically to the preceding act.
theological_decisions: []
translation_notes:
  register: Standard Igbo; natural, dignified narrative style. The broad wording “ihe ndị bụ nke anyị” intentionally preserves the openness of τὰ ἴδια, while the footnote gives a more idiomatic possessive alternative without making it the sole meaning.
