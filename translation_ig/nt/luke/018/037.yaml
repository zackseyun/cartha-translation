  text: ἀπήγγειλαν δὲ αὐτῷ ὅτι Ἰησοῦς ὁ Ναζωραῖος παρέρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/037.yaml
  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: ig
  text: Ha wee gwa ya, sị, “Jizọs onye Nazaret[a] na-agafe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Jizọs onye si Nazaret na-agafe.” N’asụsụ Grik, ọ bụ “Jizọs onye Nazaret,” nke na-echekwa aha njirimara ahụ n’ụzọ dị nso karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: Ha wee gwa
  rationale: Ngwaa a pụtara ịkọrọ mmadụ ma ọ bụ ịgwa ya ihe. N’akụkọ a, “gwa” bụ okwu Igbo dị mfe ma bụrụkwa nke e ji ekwu okwu kwa ụbọchị; “wee” na-egosi na ihe a sochiri ihe mere tupu ya.
- source_word: δὲ
  choice: wee
  rationale: N’ebe a, δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu, ọ bụghị ihe na-egosi nnukwu mmegide. “Wee” dabara n’usoro akụkọ Igbo.
- source_word: αὐτῷ
  choice: ya
  rationale: Dative a na-egosi onye a gwara okwu; “gwa ya” bụ usoro okwu Igbo kwesịrị ekwesị.
- source_word: ὅτι
  choice: sị, “…”
  rationale: ὅτι na-ebute ihe e kwuru. Igbo na-ejikarị “sị” ebute okwu a kpọrọ kpọmkwem, nke na-enye otu ọdịnaya ahụ n’ụzọ ebumpụta ụwa.
- source_word: Ἰησοῦς
  choice: Jizọs
  rationale: Nke a bụ ide aha Ἰησοῦς n’ụdị a na-ejikarị ede ya n’Igbo.
- source_word: ὁ Ναζωραῖος
  choice: onye Nazaret
  rationale: Nkebi a bụ aha njirimara na-ejikọta Jizọs na Nazaret. “Onye Nazaret” bụ Igbo doro anya ma dịkwa n’okike, ebe nkọwa ụkwụ na-echekwa na Grik ji ụdị aha njirimara “onye Nazaret” mee ihe kama ikwu kpọmkwem “onye si Nazaret.”
- source_word: παρέρχεται
  choice: na-agafe
  rationale: Present tense a na-egosi ihe na-eme ugbu a ka Jizọs na-agafe ebe ahụ. “Na-agafe” na-echekwa omume na-aga n’ihu na ịdị ngwa nke ọnọdụ ahụ.
theological_decisions:
- issue: Otú e si sụgharịa aha njirimara Ναζωραῖος nke Jizọs
  choice: onye Nazaret
  alternative: onye si Nazaret
  rationale: Nke a bụ njirimara metụtara ebe, ọ bụghị aha nkà mmụta okpukpe a ga-agbasawanye. Nhọrọ ahụ na-agbaso ọdịdị Grik ma bụrụkwa Igbo a na-aghọta nke ọma; nkọwa ụkwụ na-enye ụdị ọzọ kwe omume n’enweghị ịgbakwunye ozizi na-adịghị n’ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ugwu ma dị mfe nghọta. E ji usoro akụkọ “Ha wee gwa ya, sị” mee ka ahịrịokwu ahụ bụrụ nke ebumpụta ụwa n’Igbo, ma debe akara nkọwa ụkwụ [a] ozugbo n’akụkụ okwu ọ na-akọwa.
