id: LUK.18.35
reference: Luke 18:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: ig
  text: Mgbe ọ na-eru Jeriko nso[a], otu nwoke kpuru ìsì[b] nọ ọdụ n'akụkụ ụzọ na-arịọ arịrịọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe ọ na-abịaru Jeriko nso.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị naanị, “nwoke kpuru ìsì”; okwu Grik τις na-agbakwụnye ntakịrị echiche nke “otu onye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Mgbe
  rationale: A naghị atụgharị akpaalaokwu akụkọ a dịka ‘o wee ruo’ n’ebe a, n’ihi na ọrụ ya bụ ijikọ ihe omume; ahịrịokwu oge nke na-esochi ya na-eme ka njikọ ahụ doo anya n’Igbo eke.
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: Mgbe ọ na-eru Jeriko nso
  rationale: ‘Mgbe … na-’ na-egosi na ihe abụọ na-eme n’otu oge, ebe ‘na-eru … nso’ na-echekwa echiche nke ịbịaru obodo ahụ nso.
- source_word: τυφλός τις
  choice: otu nwoke kpuru ìsì
  rationale: ‘Otu’ na-egosipụta ntakịrị nghọta nke τις, ya bụ otu onye a na-akọwabeghị kpọmkwem, ma okwu ahụ ka na-ada ka Igbo nkịtị.
- source_word: ἐκάθητο
  choice: nọ ọdụ
  rationale: Nke a na-egosi ọnọdụ na-aga n’ihu n’oge gara aga, dịka imperfect Grik si eme n’ịtọ ọnọdụ akụkọ.
- source_word: παρὰ τὴν ὁδὸν
  choice: n'akụkụ ụzọ
  rationale: Nke a na-egosi na nwoke ahụ nọ n’akụkụ ụzọ, ọ bụghị n’etiti ya, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἐπαιτῶν
  choice: na-arịọ arịrịọ
  rationale: Nke a na-akọ ọrụ ọ na-eme n’oge ahụ dịka onye na-arịọ ihe n’aka ndị na-agafe, na-enweghị ịgbakwunye na ọ bụ ego kpọmkwem.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, doro anya ma nwee ugwu, dee ya. ‘Na-arịọ arịrịọ’ bụ okwu nkịtị maka ịrịọ ihe ebere, ebe a zere ịkọwa ihe ọ na-arịọ dịka ego n’ihi na isi mmalite ekwughị ya kpọmkwem.
