revisions:
- from: Ma onye ọna ụtụ isi ahụ guzoro n'ebe dị anya. Ọ chọghị ọbụna iweli anya ya lee eluigwe, kama ọ nọgidere na-akụ aka n'obi ya, na-asị, “Chineke, meere m onye mmehie a ebere.[a]”
  to: Ma onye na-anakọta ụtụ isi ahụ guzoro n'ebe dị anya. Ọ chọghị ọbụna iweli anya ya lee eluigwe, kama ọ nọgidere na-akụ aka n'obi ya, na-asị, “Chineke, meere m ebere, m bụ onye mmehie.[a]”
  rationale: The revision replaces an unnatural designation for a tax collector, removes the unwarranted demonstrative force of “a” from the sinner's confession, and refines the lexical footnote. It retains the source's imperfect aspect (“ọ nọgidere na-akụ”), volitional nuance (“Ọ chọghị ọbụna”), and the accessible main-text plea for mercy.
