    text: A pụkwara ịsụgharị ya, “mee ka iwe gị dajụọ n'ebe m nọ.” Ngwaa Grik a na okwu ndị metụtara ya nwere njikọ na asụsụ gbasara mkpuchi mmehie na ime ka e nwee ebere.
    reason: lexical_alternative
