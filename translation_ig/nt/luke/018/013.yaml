reference: Luke 18:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: ig
  text: Ma onye na-anakọta ụtụ isi ahụ guzoro n'ebe dị anya. Ọ chọghị ọbụna iweli anya ya lee eluigwe, kama ọ nọgidere na-akụ aka n'obi ya, na-asị, “Chineke, meere m ebere, m bụ onye mmehie.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mee ka iwe gị dajụọ n'ebe m nọ.” Ngwaa Grik a na okwu ndị metụtara ya nwere njikọ na asụsụ gbasara mkpuchi mmehie na ime ka e nwee ebere.
    reason: lexical_alternative
lexical_decisions:
- source_word: τελώνης
  choice: onye ọna ụtụ isi
  rationale: Nke a bụ ụzọ doro anya, nke dị ugbu a, e si akọwa onye na-anakọta ụtụ; ọ na-ezere okwu ochie ma na-edobe ọrụ onye ahụ n'ụzọ ndị na-agụ akwụkwọ ga-aghọta.
- source_word: μακρόθεν
  choice: n'ebe dị anya
  rationale: Ọ na-edobe anya ebe onye ahụ guzoro n'ụzọ Igbo na-ada nke ọma, na-enweghị itinye nkọwa ọzọ n'ihe odide ahụ.
- source_word: ἑστὼς
  choice: guzoro
  rationale: Ọ na-egosi ọnọdụ ahụ ya n'ụzọ dị mfe ma kwekọọ n'ụdị participle Grik ahụ.
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: Ọ chọghị ọbụna
  rationale: Nke a na-egosi na ọ bụ ọchịchọ ma ọ bụ nkwenye ya ka a na-ekwu maka ya, ọ bụghị na o nweghị ike ime ya.
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: iweli anya ya lee eluigwe
  rationale: Nke a bụ okwu Igbo dị ndụ nke na-edobe omume iweli anya na ntụziaka ya gaa n'eluigwe.
- source_word: ἔτυπτε
  choice: ọ nọgidere na-akụ
  rationale: “Nọgidere” na-eme ka omume a na-eme ugboro ugboro ma ọ bụ na-aga n'ihu, nke imperfect Grik ahụ na-egosi, pụta ìhè.
- source_word: τὸ στῆθος αὐτοῦ
  choice: aka n'obi ya
  rationale: “Ịkụ aka n'obi” bụ ụzọ Igbo nkịtị e si akọwa ịkụ obi ma ọ bụ igbe obi mmadụ n'ihi mwute na nchegharị.
- source_word: ἱλάσθητί μοι
  choice: meere m ... ebere
  rationale: Nke a bụ arịrịọ Igbo doro anya maka ebere Chineke. Ihe okwu Grik ahụ na-egosi banyere ime ka iwe dajụọ ma ọ bụ mkpuchi mmehie ka e debere na nkọwa ala peeji.
- source_word: τῷ ἁμαρτωλῷ
  choice: onye mmehie a
  rationale: “Onye mmehie a” na-edobe nkwuwa okwu nke article Grik ahụ ma mee ka o doo anya na onye ahụ na-arụtụ aka n'onwe ya, kama ime ka ọ bụrụ naanị otu onye mmehie n'etiti ọtụtụ.
theological_decisions:
- issue: Otu a ga-esi sụgharịa ἱλάσθητί μοι n'arịrịọ a na-arịọ Chineke
  choice: meere m ... ebere
  alternative: mee ka iwe gị dajụọ n'ebe m nọ; kpuchie mmehie m
  rationale: Isi odide ahụ ji okwu ndị mmadụ na-aghọta ozugbo kwuo arịrịọ maka ebere, ma nkọwa ala peeji na-echekwa njikọ okwu Grik ahụ na echiche mkpuchi mmehie na ime ka iwe dajụọ. Nke a anaghị amanye otu nkọwa ozizi n'elu okwu ahụ.
- issue: Ike nkwuwa okwu dị na τῷ ἁμαρτωλῷ
  choice: onye mmehie a
  alternative: onye mmehie
  rationale: Nhọrọ a na-echekwa article na nkwuwa okwu onye ahụ ji eweda onwe ya ala, na-egosikwa na ọ na-arụtụ aka n'onwe ya, n'agbanyeghị na Igbo anaghị eji article eme ihe otu Grik si eji ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ ka ọ na-agụ nke ọma n'Igbo. E tinyere akara [a] kpọmkwem n'akụkụ “ebere,” ebe okwu ἱλάσθητί metụtara ya; nke a na-edozi ọnọdụ akara ahụ ka ọ kwekọọ na isi okwu nkọwa ala peeji.
