id: LUK.18.14
reference: Luke 18:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: ig
  text: Ana m agwa unu, nwoke a gbadatara n'ụlọ ya ebe a gụrụ ya n'onye ezi omume, kama onye nke ọzọ;[a] n'ihi na onye ọ bụla na-ebuli onwe ya elu ka a ga-eweda ala, ma onye na-eweda onwe ya ala ka a ga-ebuli elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ebe a gụrụ ya n'onye ezi omume karịa onye nke ọzọ”; okwu ahụ na-atụnyere nwoke a na onye nke ọzọ bịara fee ofufe.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: dị ka onye Chineke kwụrụ n'onye ezi omume
  rationale: Nke a na-egosipụta ikpe ọma Chineke na-enye, tinyere ọnọdụ nke sitere n'omume ahụ mezuru, n'asụsụ Igbo doro anya; ịkpọ Chineke aha na-eme ka passive nke Grik ghara ịdị arọ n'Igbo, ma ọ naghị agbanwe onye a na-aghọta na ọ bụ ya mere ya n'akụkọ a.
- source_word: παρ’ ἐκεῖνον
  choice: ọ bụghị onye nke ọzọ
  rationale: N'ọnọdụ a, παρά na accusative na-egosi ọdịiche ma ọ bụ ntụnyere n'etiti onye ọna ụtụ na onye Farisii. Nhọrọ a na-egosipụta ọdịiche ahụ n'Igbo eke, ebe nkọwa ala peeji na-edobe ụzọ ntụgharị ọzọ nwere ike ịdị.
- source_word: κατέβη
  choice: laghachiri
  rationale: Ọ bụ ezie na okwu Grik pụtara n'ụzọ nkịtị 'rịdata,' n'Igbo nke oge a 'laghachiri' na-asụ nke ọma maka ịpụ n'ụlọ nsọ laa n'ụlọ. Ọnọdụ ahụ ka na-enye echiche njem ahụ.
- source_word: οἶκον αὐτοῦ
  choice: n'ụlọ ya
  rationale: Nke a bụ ntụgharị Igbo kpọmkwem ma bụrụkwa nke eke maka 'ụlọ ya' ma ọ bụ ebe obibi ya.
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: onye ọ bụla na-ebuli onwe ya elu
  rationale: Ọ na-edobe ụkpụrụ izugbe, ihe oyiyi nke ibuli elu, na reflexive nke Grik n'Igbo doro anya.
- source_word: ταπεινωθήσεται
  choice: ka a ga-eweda ala
  rationale: Usoro a na-edobe passive na onye na-eme ihe ahụ n'ezoghị ọnụ, dịka Grik si mee, ma na-eji okwu Igbo a na-ahụkarị.
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: ma onye na-eweda onwe ya ala
  rationale: Ọ na-edobe ọdịiche δέ na nhazi yiri nkebiokwu nke mbụ.
- source_word: ὑψωθήσεται
  choice: ka a ga-ebuli elu
  rationale: Ọ na-edobe passive na ntụgharị megidere 'eweda ala,' n'ekwughị onye na-eme ihe ahụ kpọmkwem.
- source_word: ὅτι
  choice: n'ihi na
  rationale: Nke a na-egosi ihe kpatara ikpe ahụ e kwuru n'ihu, dịka njikọ causal nke Grik.
- source_word: οὗτος
  choice: nwoke a
  rationale: Ọ na-ezo aka n'ụzọ doro anya n'onye ọna ụtụ, ma na-edobe ọdịiche ya na nwoke nke ọzọ.
theological_decisions:
- issue: Ihe δικαιόω pụtara na mmechi ilu a
  choice: Ikpe ọma Chineke nke na-agụ onye ahụ n'onye ezi omume
  alternative: Ịkwado ya ma ọ bụ igosi na ihe o kwuru ziri ezi n'echiche ọha mmadụ
  rationale: Ọnọdụ ahụ bụ mmadụ abụọ bịara n'ihu Chineke, otu na-atụkwasị ezi omume nke onwe ya obi, nke ọzọ na-arịọ ebere. Ya mere, okwu ahụ na-egosi mkpebi ọma Chineke, ma ntụgharị ahụ anaghị ebubata usoro nkà mmụta okpukpe zuru ezu nke amaokwu ahụ n'onwe ya na-akọwaghị.
- issue: Passive ndị dị na ταπεινωθήσεται na ὑψωθήσεται
  choice: Hapụ onye na-eme omume ahụ n'ezoghị ọnụ site n'iji 'a ga-'
  alternative: Kwuo kpọmkwem na Chineke ga-eweda ma ọ bụ bulie onye ahụ elu
  rationale: Grik ekwughị onye na-eme ihe ahụ, ọ bụ ezie na ọnọdụ ahụ nwere ike ime ka onye na-agụ ghọta Chineke. Ịhapụ ya n'ezoghị ọnụ na-echekwa njọgharị na nrụgide nkà mmụta okpukpe nke ederede ahụ.
- issue: Asụsụ nwoke n'ụkpụrụ izugbe
  choice: Jiri 'onye ọ bụla' na 'onwe ya' dịka usoro Igbo eke nke gụnyere mmadụ niile
  alternative: Tinye kpọmkwem 'nwoke ọ bụla'
  rationale: Participles Grik bụ masculine singular ma na-arụ ọrụ n'ụzọ nnọchiteanya. Igbo 'onye ọ bụla' na-edobe singular na reflexive ma na-ekwupụta ụkpụrụ izugbe n'ụzọ eke, na-enweghị ịgbanwe onye a na-ekwu maka ya ka ọ bụrụ plural.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E ji nhazi yiri ibe ya—'ebuli onwe ya elu / eweda ala' na 'eweda onwe ya ala / ebuli elu'—chekwaa ike ilu ahụ. A họọrọ 'laghachiri' kama ntụgharị nkịtị 'rịdata' iji mee ka ahịrịokwu bụrụ Igbo eke; a na-edobe isi njem ahụ n'ọnọdụ akụkọ ahụ.
