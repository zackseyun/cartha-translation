id: LUK.18.38
reference: Luke 18:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐβόησεν λέγων· Ἰησοῦ υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/038.yaml
  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: ig
  text: O wee tie mkpu, sị, “Jizọs, Nwa Devid,[a] meere m ebere!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nwa Devid” bụ aha Mesaịa, nke na-echetara eze sitere n’ezinụlọ Devid ahụ e kwere ná nkwa; a pụkwara ịghọta ya n’ụzọ sara mbara dịka “onye sitere n’agbụrụ Devid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: tie mkpu
  rationale: Ngwaa a na-egosi iti mkpu n’olu dara ụda. “Tie mkpu” na-egosipụta ma ụda olu ahụ ma mkpa arịrịọ ahụ dị.
- source_word: λέγων
  choice: sị
  rationale: N’akụkọ Igbo, “sị” bụ ụzọ ebumpụta ụwa isi webata okwu onye kwuru, ma na-ebufe ọrụ participle Grik ahụ nke ọma.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Nke a bụ aha a na-akpọ kpọmkwem; e ji ụdị aha a na-ejikarị eme ihe n’Igbo sụgharịa ya.
- source_word: υἱὲ Δαυίδ
  choice: Nwa Devid
  rationale: “Nwa Devid” na-edobe aha nsọpụrụ nke eze Mesaịa ahụ, kama ịkọwa ya nanị dịka onye sitere n’agbụrụ Devid.
- source_word: ἐλέησόν με
  choice: meere m ebere
  rationale: Nke a bụ arịrịọ kpọmkwem ka e mee onye ahụ ebere; okwu Igbo a bụ nke ebumpụta ụwa, dị ùgwù, ma na-edobe ịdị ngwa nke arịrịọ ahụ.
theological_decisions:
- issue: Ike Mesaịa dị n’aha υἱὲ Δαυίδ
  choice: A sụgharịrị ya dịka aha nsọpụrụ “Nwa Devid.”
  alternative: “Onye sitere n’agbụrụ Devid.”
  rationale: N’akụkọ Luk, okwu a na-arụ ọrụ dịka aha eze ahụ e kwere ná nkwa, bụ́ Mesaịa. “Nwa Devid” na-edobe ụda Akwụkwọ Nsọ na ịdị arọ nke aha ahụ n’etinyeghị nkọwa ọzọ n’ime amaokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. “O wee tie mkpu” dabara n’usoro akụkọ, ebe “meere m ebere” na-edobe arịrịọ siri ike nke ihe odide Grik.
