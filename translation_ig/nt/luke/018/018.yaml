source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: ig
  text: Otu onye ọchịchị jụrụ ya, sị, “Ezi Onye Ozizi, gịnị ka m ga-eme ka m wee keta ndụ ebighị ebi?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ ka nso n'okwu Grik, “Gịnị ka m mechara mee, ka m ga-eketa ndụ ebighị ebi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: jụrụ
  rationale: “Jụrụ” bụ okwu Igbo nkịtị ma doo anya maka ịjụ mmadụ ajụjụ; ọ naghị etinye usoro ọchịchị ma ọ bụ ịdị arọ na-adịghị na Grik.
- source_word: τις ἄρχων
  choice: otu onye ọchịchị
  rationale: “Otu” na-egosipụta onye a na-akọwaghị kpọmkwem, ebe “onye ọchịchị” na-edobe echiche nke onye nwere ikike ma ghara ịkọwa ọkwa ya karịa ihe ederede kwuru.
- source_word: λέγων
  choice: sị
  rationale: N'Igbo akụkọ, “jụrụ ya, sị” na-ebupụta participle ahụ n'ụzọ dị nkenke ma bụrụkwa okwu e ji eme ihe ugbu a.
- source_word: Διδάσκαλε ἀγαθέ
  choice: Ezi Onye Ozizi
  rationale: “Onye Ozizi” na-egosipụta ọrụ onye na-akụzi, ebe “Ezi” na-edobe okwu ἀγαθέ nke Jizọs ga-atụle n'amaokwu na-esote.
- source_word: τί ποιήσας
  choice: gịnị ka m ga-eme
  rationale: Nke a bụ Igbo doro anya maka ajụjụ banyere ihe onye ahụ ga-eme, ma ọ naghị akwado echiche ya dị ka ozizi nke onye na-ede akwụkwọ.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ okwu Igbo a maara nke ọma nke na-egosipụta ndụ na-adị ruo mgbe ebighị ebi n'ụzọ ziri ezi ma dị mfe nghọta.
- source_word: κληρονομήσω
  choice: keta
  rationale: “Keta” na-edobe ihe atụ nke ihe nketa dị na κληρονομήσω, kama iji okwu sara mbara dịka “nweta.”
theological_decisions:
- issue: Ajụjụ nzọpụta ahụ na ihe mmadụ na-eme
  choice: gịnị ka m ga-eme ka m wee keta ndụ ebighị ebi?
  alternative: gịnị ka m ga-eme, wee keta ndụ ebighị ebi?
  rationale: Nsụgharị ahụ na-edobe ụzọ onye ọchịchị si tinye ajụjụ ya n'ihe ọ ga-eme, ma ọ naghị ekwu na Luk kwadoro usoro echiche ahụ. Ọ na-ahapụ nrụgide nke nkà mmụta okpukpe ka amaokwu ndị na-esote zaa ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Onye ọchịchị” na-ahapụ ụdị ọkwa onye ahụ ghe oghe; “Ezi Onye Ozizi” na-edobe okwu Jizọs ga-azaghachi ozugbo.
