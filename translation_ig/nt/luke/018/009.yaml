source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: ig
  text: Ọ gwakwara ụfọdụ ndị tụkwasịrị onwe ha obi na ha bụ ndị ezi omume, na-elelịkwa ndị ọzọ, ilu a:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eleda ndị ọzọ anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: Ọ ... gwara
  rationale: Ebe ihe e kwuru bụ ilu, ‘gwara ... ilu’ bụ ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa ma na-edobe echiche nke ikwu ma ọ bụ ịkọ.
- source_word: δὲ
  choice: -kwara
  rationale: δὲ bụ njikọ dị nro na-aga n’ihu n’akụkọ; a jikọtara ya na -kwara tinyere καὶ ka ahịrịokwu ahụ daa nke ọma n’Igbo.
- source_word: καὶ
  choice: -kwara
  rationale: -kwara na-egosi echiche mgbakwunye nke καὶ, ya bụ na Jizọs kwukwara nkuzi ọzọ.
- source_word: πρός τινας
  choice: ụfọdụ ndị
  rationale: Ọ na-akọwa ndị a gwara okwu ahụ; nhazi Igbo ‘gwara ụfọdụ ndị ... ilu a’ doro anya ma bụrụ nke ebumpụta ụwa.
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: ndị tụkwasịrị onwe ha obi
  rationale: Nke a na-egosipụta ọnọdụ obi ike siri ike nke participle perfect ahụ na ntụkwasị obi ha tinyere n’onwe ha.
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: na ha bụ ndị ezi omume
  rationale: ‘Ndị ezi omume’ na-edobe okwu okpukpe na omume nke δίκαιοι, n’enweghị itinye nkọwa nkatọ n’okwu ahụ n’onwe ya.
- source_word: ἐξουθενοῦντας
  choice: na-elelị
  rationale: ‘Ilelị’ pụtara ile mmadụ anya dị ka onye na-abaghị uru ma ọ bụ onye dị ala, ya mere ọ na-eburu ike nke ἐξουθενέω n’ụzọ dị mkpirikpi ma doo anya.
- source_word: τοὺς λοιπούς
  choice: ndị ọzọ
  rationale: ‘Ndị ọzọ’ bụ ntụgharị Igbo ebumpụta ụwa maka ndị fọdụrụ ma ọ bụ mmadụ ndị ọzọ niile e jiri ha tụnyere.
- source_word: τὴν παραβολὴν ταύτην
  choice: ilu a
  rationale: ‘Ilu’ bụ okwu Igbo a na-ejikarị akọwa παραβολή n’ụdị nkuzi Jizọs, ebe ‘a’ na-edobe demonstrative ταύτην.
theological_decisions:
- issue: Ịsụgharị δίκαιοι n’ebe a na-akatọ ntụkwasị obi mmadụ nwere n’ezi omume nke onwe ya
  choice: ndị ezi omume
  alternative: ndị nọ n’ụzọ ziri ezi
  rationale: Asụsụ Grik jiri okwu nkịtị maka ‘ndị ezi omume,’ ọ bụghị okwu mkparị. Ya mere, ntụgharị a na-edobe mkpụrụokwu nkà mmụta okpukpe ahụ ma hapụkwa ọnọdụ amaokwu ahụ ka ọ gosipụta nkatọ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nhazi ahịrịokwu ka ọ bụrụ nke Igbo ebumpụta ụwa, ma e chekwabara echiche mgbakwunye, ntụkwasị obi n’onwe, na nlelị ndị ọzọ dị n’asụsụ Grik.
