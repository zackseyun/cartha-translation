- from: Ọ gwakwara ụfọdụ ndị tụkwasịrị onwe ha obi na ha bụ ndị ezi omume, ma na-elelị ndị ọzọ, ilu a:[a]
  to: Ọ gwakwara ụfọdụ ndị tụkwasịrị onwe ha obi na ha bụ ndị ezi omume, na-elelịkwa ndị ọzọ, ilu a:[a]
  rationale: The revision changes only the connective force before ‘na-elelị,’ replacing an adversative-sounding construction with an additive one that reflects the Greek coordination. The footnote is adjusted to match the revised syntactic form while preserving the lexical alternative.
