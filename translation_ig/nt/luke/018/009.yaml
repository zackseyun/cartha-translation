review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys Jesus’ telling of this parable, the addressed group, their settled self-confidence that they are righteous, and their contempt for others. The conjunction before the final participial idea should be additive rather than contrastive: Greek καί coordinates the two characteristics and does not introduce a ‘but’ contrast.'
  naturalness: The sentence is clear and uses standard, modern Igbo. Recasting ‘ma na-elelị’ as ‘na-elelịkwa’ makes the coordination more idiomatic and avoids an unintended adversative nuance.
  terminology: ‘Ndị ezi omume’ appropriately retains the religious-moral sense of δίκαιοι without adding ‘self-righteous.’ ‘Ilu a’ is the established and natural Igbo term for παραβολή. ‘Ilelị’ and the footnoted ‘ileda ... anya’ suitably represent ἐξουθενέω.
  issues:
  - severity: low
    issue: ‘ma na-elelị’ can imply contrast.
    rationale: The Greek has καὶ (‘and’) joining the self-confident assessment and contempt for others. ‘Na-elelịkwa’ preserves this additive relation more precisely.
  revised_text: Ọ gwakwara ụfọdụ ndị tụkwasịrị onwe ha obi na ha bụ ndị ezi omume, na-elelịkwa ndị ọzọ, ilu a:[a]
