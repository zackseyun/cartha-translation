  text: ὁ δὲ ἀκούσας ταῦτα περίλυπος ⸀ἐγενήθη, ἦν γὰρ πλούσιος σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/023.yaml
  text: But when he heard these things[a], he became very sorrowful, for he was extremely rich.
translation:
  language: ig
  text: Ma mgbe ọ nụrụ ihe ndị a[a], o wee nwee oké mwute, n’ihi na ọ bara ọgaranya nke ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘o wee nwee mwute miri emi.’ Okwu Grik ahụ na-egosi mwute ma ọ bụ nchekasị siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: mgbe ọ nụrụ
  rationale: Aorist participle ahụ nwere ọrụ nke oge n’ebe a; nkebi a na-egosi na mwute ya bịara mgbe ọ nụsịrị okwu Jizọs.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nnọchiaha ngosi nke ọtụtụ ihe na-ezo aka n’ihe ndị Jizọs kwuru tupu nke a.
- source_word: περίλυπος
  choice: oké mwute
  rationale: Okwu ahụ na-egosi mwute ma ọ bụ nchekasị siri ike; ‘oké mwute’ bụ Igbo doro anya ma na-edobe ịdị arọ nke mmetụta ahụ.
- source_word: ἐγενήθη
  choice: o wee nwee
  rationale: γίνομαι na-egosi ịbanye n’ọnọdụ ọhụrụ; ‘o wee nwee oké mwute’ na-egosipụta mgbanwe ahụ n’ụzọ Igbo si ada nke ọma.
- source_word: πλούσιος
  choice: ọ bara ọgaranya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo na mmadụ nwere akụnụba.
- source_word: σφόδρα
  choice: nke ukwuu
  rationale: Nkebi a na-eme ka ogo akụnụba ya sie ike, kwekọọ n’ike okwu Grik ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị ma ọ bụ ọdịiche dị n’etiti ihe Jizọs kwuru na mmeghachi omume nwoke ahụ.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara oké mwute ya n’ụzọ Igbo doro anya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘o wee nwee oké mwute’ iji dobe echiche nke ịbanye n’ọnọdụ mwute, ebe ‘ọ bara ọgaranya nke ukwuu’ na-ebuga ike nke σφόδρα n’ụzọ ebumpụta ụwa.
