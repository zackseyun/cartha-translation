  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: ig
  text: Mgbe Jizọs hụrụ ya, ọ sịrị, “Lee ka o si esiri ndị nwere akụ na ụba ike ịbanye n’alaeze Chineke!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς
  choice: Mgbe Jizọs hụrụ ya
  rationale: A sụgharịrị aorist participle Ἰδὼν dị ka nkebiokwu oge n’Igbo ka ahịrịokwu ahụ bụrụ nke mmadụ na-aghọta ngwa ngwa; δέ bụ njikọ dị nro, nke usoro okwu Igbo a na-egosipụta n’enweghị ịgbakwunye okwu njikọ na-adịghị mkpa.
- source_word: Πῶς δυσκόλως
  choice: Lee ka o si ... ike
  rationale: Nke a na-egosipụta mkpu banyere ogo ihe isi ike, ọ bụghị ajụjụ nkịtị; usoro a bụ Igbo eke ma na-edobe ike okwu Grik.
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: ndị nwere akụ na ụba
  rationale: χρήματα nwere ike ịpụta ego, ihe onwunwe, ma ọ bụ akụ na ụba. ‘Akụ na ụba’ na-edobe obosara echiche ahụ karịa ‘ego’ naanị, ma na-ezere ime ya naanị aha otu klas mmadụ.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται
  choice: ịbanye n’alaeze Chineke
  rationale: Nke a na-edobe echiche mmegharị ‘ịbanye n’ime’ na okwu Baịbụl a maara nke ọma, ‘alaeze Chineke,’ n’Igbo dị mfe ma kwụ ọtọ.
theological_decisions:
- issue: Ike okwu Jizọs banyere ndị nwere akụ na ụba na alaeze Chineke
  choice: O kwuru na ọ na-esiri ha ike ịbanye
  alternative: Ikwu na ọ gaghị ekwe omume ma ọlị ka onye nwere akụ na ụba banye
  rationale: δυσκόλως na-egosi ihe isi ike, ọ bụghị n’onwe ya enweghị ike ime eme. Nsụgharị ahụ anaghị eme ka okwu amaokwu a sie ike karịa ihe Grik kwuru, ma na-ahapụ nkọwa ndị na-esote ka ha guzoro n’ọnọdụ ha.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Jizọs’ na ‘alaeze Chineke’ mee ihe dịka ụdị okwu Baịbụl Igbo a na-amata. Enweghị akara nkọwa ala peeji n’ihi na enweghị nkọwa dị mkpa e tinyere na mbipụta a.
