  verdict: approve
  source_fidelity: Nsụgharị ahụ na-anọchite anya Ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς n’ụzọ ziri ezi site na nkebiokwu oge, “Mgbe Jizọs hụrụ ya,” ma na-ezo aka n’ụlọọrụ “ya” n’ụzọ kwesịrị ekwesị. “Lee ka o si esiri … ike” na-edobe mkpu ogo nke Πῶς δυσκόλως, ọ bụghị ajụjụ nkịtị. “Ndị nwere akụ na ụba” na-ekpuchi χρήματα n’obosara ya, ebe “ịbanye n’alaeze Chineke” na-egosipụta εἰς… εἰσπορεύονται nke ọma. Ọ naghị eme ka ‘ihe isi ike’ ghọọ ‘ihe na-agaghị ekwe omume.’
  naturalness: Igbo ahụ bụ Standard Igbo dị eke, doro anya, ma nwee ndekọ Baịbụl kwesịrị ekwesị. Usoro “Lee ka o si esiri ndị nwere akụ na ụba ike…” bụ ụzọ Igbo nkịtị e si egosi nrụgide na ịdị ukwuu nke ihe isi ike. Ịhapụ njikọ dị nro δέ n’enweghị okwu Igbo pụrụ iche anaghị emebi usoro akụkọ.
  terminology: “Jizọs,” “akụ na ụba,” na “alaeze Chineke” bụ okwu kwụ ọtọ ma dabara na ndekọ Baịbụl Igbo. “Akụ na ụba” ka mma karịa “ego” naanị n’ihi na χρήματα nwere ike ịgụnye ihe onwunwe na akụ.
