base_translation:
  language: en
  yaml_path: translation/nt/luke/018/021.yaml
  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: ig
  text: Ma ọ sịrị[a], “Edebewo m ihe ndị a niile kemgbe m bụ nwata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ga-eme ka ihe gbara ya gburugburu pụta ìhè karị, “iwu ndị a niile.” N’asụsụ Grik, ihe e dere bụ naanị “ihe ndị a niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Ma ọ sịrị
  rationale: δέ bụ njikọ dị nro; “Ma” na-egosi nzaghachi ya n’usoro mkparịta ụka ahụ n’enweghị ime ka ọdịiche ahụ sie ike karịa ihe Grik kwuru.
- source_word: Ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nke a na-asụgharị okwu Grik ahụ kpọmkwem n’etinyeghị “iwu,” bụ́ nke a ghọtara site n’ihe ndị bu ụzọ mana a kpọghị aha n’amaokwu a.
- source_word: ἐφύλαξα
  choice: Edebewo m
  rationale: φυλάσσω n’ebe a pụtara idebe ma ọ bụ irube isi n’iwu. Ụdị “Edebewo m” na-egosi na onye ahụ na-ekwu na o mere nke a ruo n’oge ọ na-ekwu okwu.
- source_word: ἐκ νεότητος μου
  choice: kemgbe m bụ nwata
  rationale: Akpaokwu a na-egosi ebe oge ahụ malitere. Nke a bụ ụzọ Igbo nkịtị na nke doro anya si kwuo na omume ahụ malitere n’oge ntorobịa ya wee ruo ugbu a.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee nsụgharị ahụ. E chekwara ihe Grik na-ekwughị kpọmkwem site n’ịhapụ “iwu” n’ala peeji kama itinye ya n’ahịrịokwu bụ isi.
