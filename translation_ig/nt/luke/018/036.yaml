  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: ig
  text: Mgbe ọ nụrụ ka ìgwè mmadụ na-agafe, ọ nọ na-ajụ ihe a bụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ihe a pụrụ ịbụ.” Ngwaa ahụ dị n’oge imperfect nwere ike igosi na ọ nọgidere na-ajụ ajụjụ, ebe ụdị ngwaa optative dị n’ajụjụ a kọrọ akọrọ nwekwara ike igosi ntakịrị ejighị n’aka.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: Mgbe ọ nụrụ
  rationale: Nkebiokwu oge a na-egosi ọnọdụ nke aorist participle n'Igbo n'ụzọ doro anya ma dịkwa n'okike.
- source_word: δὲ
  choice: (egosighi ya iche)
  rationale: δὲ bụ njikọ akụkọ dị nro; usoro ahịrịokwu Igbo na-aga nke ọma n'enweghị itinye ‘ma’ ma ọ bụ ‘wee’ nke nwere ike ịgbakwunye ọdịiche ma ọ bụ usoro siri ike.
- source_word: ὄχλου
  choice: ìgwè mmadụ
  rationale: Aha a na-enweghị article na-ezo aka n'ìgwè mmadụ a na-anụ ka ha na-agafe.
- source_word: διαπορευομένου
  choice: na-agafe
  rationale: Ụdị na-aga n'ihu kwekọrọ na present participle ma na-egosi mmegharị ìgwè mmadụ ahụ.
- source_word: ἐπυνθάνετο
  choice: ọ nọ na-ajụ
  rationale: Nke a na-echekwa akụkụ na-aga n'ihu ma ọ bụ ugboro ugboro nke imperfect ahụ, na-enweghị ikpebi na ọ bụ naanị mmalite omume ahụ.
- source_word: τί εἴη τοῦτο
  choice: ihe nke a bụ
  rationale: Nke a na-edobe ajụjụ na-apụtaghị ìhè nso n'okwu Grik; footnote na-egosi na optative ahụ nwekwara ike inye obere echiche nke ejighị n'aka.
