translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ọ nọ na-ajụ’ chekwaa imperfect n'ụzọ eke; e zere ịtụgharị τί εἴη τοῦτο dị ka ‘ihe nke a pụtara,’ n'ihi na nke ahụ nwere ike ịkọwa karịa okwu Grik n'onwe ya.
