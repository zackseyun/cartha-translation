lexical_decisions:
- source_word: σταθεὶς
  choice: kwụsịrị
  rationale: N'ebe a, participle a nke ἵστημι na-egosi na Jizọs kwụsịrị ịga n'ihu; “kwụsịrị” bụ okwu Igbo doro anya ma dịkwa eke.
- source_word: δὲ
  choice: Ya mere
  rationale: δέ bụ njikọ akụkọ na-adịghị egosi nnukwu mmegide; “Ya mere” na-ejikọta ihe a na ihe mere tupu ya n'ụzọ dị eke.
- source_word: ἐκέλευσεν
  choice: nye iwu
  rationale: κελεύω pụtara inye iwu; okwu a na-echekwa ike na ikike dị n'ihe Jizọs kwuru.
- source_word: ἀχθῆναι
  choice: ka a kpọta ya
  rationale: Infinitive passive nke ἄγω na-egosi na ndị ọzọ ga-akpọta nwoke ahụ; “kpọta” sara mbara ma kwekọọ n'ọnọdụ ahụ.
- source_word: πρὸς αὐτόν
  choice: bịakwute ya
  rationale: πρός na accusative na-egosi mmegharị bịaruo Jizọs nso; “bịakwute ya” bụ Igbo dị eke.
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: Mgbe ọ bịaruru nso
  rationale: Genitive absolute a nwere nghọta oge; onye a na-ekwu maka ya bụ nwoke ahụ e kwuru okwu ya.
- source_word: ἐπηρώτησεν
  choice: jụrụ ya sị
  rationale: ἐπερωτάω pụtara ịjụ; “jụrụ ya sị” na-eduga n'ajụjụ nke na-esochi amaokwu a n'ụzọ Igbo kwesịrị ekwesị.
- source_word: ὁ Ἰησοῦς
  choice: Jizọs
  rationale: E ji usoro nsụgharị aha a na-ejikarị na Standard Igbo dee aha ahụ.
