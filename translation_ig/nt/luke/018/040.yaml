  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “guzoro otu ebe.” Okwu Grik ahụ na-egosi na Jizọs kwụsịrị ịga n'ihu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ka a duru ya bịakwute ya.” Ngwaa Grik ahụ nwere ike ịpụta iduru mmadụ ma ọ bụ ịkpọta ya; “kpọta” dabara n’ọnọdụ a nke ọma.
