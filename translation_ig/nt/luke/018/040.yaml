review_pass:
  verdict: revise
  source_fidelity: 'Ihe odide ahụ na-atụgharị isi ihe Grik nke ọma: Jizọs kwụsịrị, o nyere iwu ka a kpọta nwoke ahụ, ma jụọ ya ajụjụ mgbe ọ bịarutere nso. Otú ọ dị, “Ya mere” na-enye δέ echiche nke nsonaazụ siri ike karịa ka o kwesịrị, ebe δέ bụ naanị njikọ akụkọ dị nro. Ọzọkwa, ebe akara nkọwa ala abụọ ahụ dị ugbu a anaghị adaba na okwu ndị nkọwa ndị ahụ na-akọwa.'
  naturalness: “Jizọs kwụsịrị wee nye iwu ka a kpọta ya bịakwute ya” bụ Standard Igbo doro anya ma dị eke. “Ọ jụrụ ya ajụjụ” na-arụ ọrụ nke ọma dịka mmeghe maka ajụjụ na-eso n’amaokwu ọzọ.
