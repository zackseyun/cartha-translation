    text: N’akụkọ ndị yiri nke a, e jikọtara mmetụ Jizọs na ịgọzi ụmụ ahụ na ịbịkwasị ha aka (lee Mat. 19:13; Mak 10:13, 16).
    reason: cross_reference
  revision_rationale: The revision preserves the Greek’s unspecified plural subject and avoids an added additive nuance, while retaining the ongoing sense naturally in Igbo. It also keeps the referent of the final pronoun available through the anchored footnote and improves the idiom in the cross-reference note.
