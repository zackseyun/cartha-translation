revisions:
- from: Ndị mmadụ nọkwa na-akpọtara ya ọbụna ụmụ ọhụrụ ka o metụ ha aka[a]. Ma mgbe ndị na-eso ụzọ hụrụ nke a[c], ha baara ndị ahụ mba[b].
  to: Ha na-akpọtara ya ọbụna ụmụ ọhụrụ ka o metụ ha aka[a]. Ma mgbe ndị na-eso ụzọ hụrụ nke a[c], ha baara ha mba[b].
  rationale: The revision preserves the Greek’s unspecified plural subject and avoids an added additive nuance, while retaining the ongoing sense naturally in Igbo. It also keeps the referent of the final pronoun available through the anchored footnote and improves the idiom in the cross-reference note.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:50Z'
review_pass:
  verdict: revise
  source_fidelity: The main clause should not specify “Ndị mmadụ” (‘people’), since the Greek leaves the agents as an unexpressed third-person plural. The draft’s “nọkwa” also introduces an ‘also’ nuance not securely represented by the source. The purpose clause, the temporal participle, and the rebuke directed at those bringing the infants are otherwise faithful.
  naturalness: “Ha na-akpọtara ya ọbụna ụmụ ọhụrụ” is natural, contemporary Standard Igbo and adequately conveys the imperfect narrative action without adding a specific subject. “Ha baara ha mba” is natural and retains the Greek pronoun; the footnote identifies its contextual referent.
  terminology: “Ụmụ ọhụrụ” appropriately renders βρέφη in this context, and “o metụ ha aka” faithfully renders the restrained wording of ἅπτηται without importing blessing. In footnote c, “ịbịkwasị ha aka” is the more idiomatic infinitival form for laying hands on them.
  issues:
  - severity: medium
    issue: The explicit subject “Ndị mmadụ” is added.
    rationale: Προσέφερον has an unexpressed plural subject. Although people bringing children are contextually likely, the translation should retain the source’s non-specific pronoun rather than identify them.
  - severity: low
    issue: “nọkwa” adds a nonessential ‘also’ nuance.
    rationale: The emphasis of καὶ is already represented by “ọbụna.” “Kwa” is not needed to render δὲ and can make the clause sound as though it continues an explicit list.
  - severity: low
    issue: Footnote c uses a less idiomatic form for ‘laying hands on them.’
    rationale: “Ịbịkwasị ha aka” is the standard infinitival expression in this construction.
  revised_text: Ha na-akpọtara ya ọbụna ụmụ ọhụrụ ka o metụ ha aka[a]. Ma mgbe ndị na-eso ụzọ hụrụ nke a[c], ha baara ha mba[b].
  revised_footnotes:
