  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: ig
  text: Ha na-akpọtara ya ọbụna ụmụ ọhụrụ ka o metụ ha aka[a]. Ma mgbe ndị na-eso ụzọ hụrụ nke a[c], ha baara ha mba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ụmụ aka.” Okwu Grik a na-ezo aka n’ụmụ dị nnọọ obere.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ndị na-akpọtara Jizọs ụmụ ọhụrụ ahụ.
    reason: lexical_alternative
  - marker: c
    text: N’akụkọ ndị yiri nke a, e jikọtara mmetụ Jizọs na ịgọzi ụmụ ahụ na ịbịkwasị ha aka (lee Mat. 19:13; Mak 10:13, 16).
    reason: cross_reference
lexical_decisions:
- source_word: Προσέφερον
  choice: nọkwa na-akpọtara
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro; “nọ na-akpọtara” na-egosipụta nke a n’Igbo dị mfe nghọta.
- source_word: δὲ
  choice: Ma
  rationale: δὲ nke abụọ na-egosi mgbanwe nke akụkọ nwere ntakịrị ọdịiche; “Ma” dabara nke ọma ebe a. E tinyebeghị okwu njikọ pụrụ iche na mmalite, ebe Igbo anaghị achọ ya iji mee ka akụkọ gaa nke ọma.
- source_word: καὶ
  choice: ọbụna
  rationale: N’ebe a καὶ nwere ike inye nkwusi ike; “ọbụna” na-egosi na a na-akpọtara ya ụmụ dị nnọọ obere.
- source_word: τὰ βρέφη
  choice: ụmụ ọhụrụ
  rationale: βρέφη na-ezo aka n’ụmụ dị nnọọ obere, ya bụ ụmụ aka ma ọ bụ ụmụ ọhụrụ; okwu a na-edobe nkọwa ahụ n’Igbo a na-asụ ugbu a.
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: ka o metụ ha aka
  rationale: ἵνα na-egosi ebumnuche, ebe ἅπτηται pụtara imetụ aka. Nsụgharị a etinyeghị “ịgọzi” n’ahịrịokwu ahụ, n’ihi na okwu Grik ahụ n’onwe ya kwuru naanị imetụ aka.
- source_word: ἰδόντες
  choice: mgbe ... hụrụ nke a
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge iji mee ka Igbo doo anya ma na-aga were were.
- source_word: οἱ μαθηταὶ
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ ntụgharị nkịtị nke “the disciples”; e tinyeghị “ya” n’ihi na possessive adịghị n’okwu Grik.
- source_word: ἐπετίμων αὐτοῖς
  choice: ha baara ndị ahụ mba
  rationale: ἐπιτιμάω bụ ịbara mba ma ọ bụ ịkatọ nke ọma. “Ndị ahụ” na-eme ka onye nnọchiaha doo anya n’Igbo, ebe ihe ọ na-ezo aka na ya ka akọwara n’ala ala peeji.
theological_decisions:
- issue: Ụdị ihe Jizọs ga-eme ụmụ ọhụrụ ahụ
  choice: o metụ ha aka
  alternative: ọ gọzie ha; ọ bikwasị ha aka
  rationale: ἅπτηται pụtara “imetụ aka.” Ọ bụ ezie na akụkọ ndị yiri nke a jikọtara mmetụ ahụ na ngọzi na ibikwasị aka, e debere okwu Luk n’ahịrịokwu bụ isi ka a ghara itinye nkọwa karịrị ihe isi mmalite kwuru.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. “Nọkwa na-akpọtara” na-echekwa omume na-aga n’ihu nke imperfect, ebe “baara ... mba” na-edobe ike nke ἐπιτιμάω n’enweghị okwu siri ike gabiga ókè. A hapụrụ mmetụ Jizọs dị ka “imetụ aka” iji chekwaa okwu na nghọta sara mbara nke isi mmalite.
