  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπαν δὲ οἱ ἀκούσαντες· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: ig
  text: Mgbe ahụ, ndị nụrụ ya sịrị, “Ònyezi ka a pụrụ ịzọpụta?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: sịrị
  rationale: Aorist indicative na-akọ ihe mere n’oge gara aga n’ụzọ dị mfe; “sịrị” bụ okwu Igbo nkịtị dabara adaba.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: δέ na-egosi ngafe n’akụkọ; “Mgbe ahụ” na-eme ka usoro akụkọ gaa n’ihu n’Igbo eke.
- source_word: οἱ ἀκούσαντες
  choice: ndị nụrụ ya
  rationale: Participial noun phrase a na-ezo aka ná ndị nụrụ okwu Jizọs kwuru tupu nke a; “ya” na-eweghachi okwu ahụ site n’ọnọdụ gbara amaokwu ahụ gburugburu.
- source_word: Καὶ τίς
  choice: Ònyezi
  rationale: N’ebe a καί na-enye ajụjụ ahụ mmetụta nke ịtụnanya na nke ịga n’ihu n’ihe a na-ekwu. Mgbakwunye “-zi” n’Igbo na-egosipụta nke a n’ụzọ eke n’enweghị ịkọwa onye pụrụ ịzọpụta.
- source_word: δύναται
  choice: a pụrụ
  rationale: Okwu a na-egosi ikike ma ọ bụ ohere. Usoro “a pụrụ” na-arụ ọrụ nke ọma na passive infinitive so ya.
- source_word: σωθῆναι
  choice: ịzọpụta
  rationale: N’usoro “a pụrụ ịzọpụta,” ihe e kwuru bụ na mmadụ nwere ike ịnata nzọpụta. Ọnọdụ gbara ya gburugburu metụtara ịbanye n’alaeze Chineke, ya mere ọ bụ nzọpụta, ọ bụghị naanị nnapụta n’ihe ize ndụ anụ ahụ.
theological_decisions:
- issue: Ihe σωθῆναι pụtara n’ebe a
  choice: ịzọpụta n’echiche nke nzọpụta
  alternative: ịnapụta mmadụ n’ihe ize ndụ nkịtị
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ịbanye n’alaeze Chineke na ihe isi ike dịịrị ọgaranya; ya mere, nzọpụta bụ isi echiche okwu ahụ, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. “Ònyezi” na-eburu mmetụta ajụjụ tụrụ ndị nụrụ okwu ahụ n’anya, ebe “a pụrụ ịzọpụta” na-echekwa ụdị nnara omume dị na σωθῆναι.
