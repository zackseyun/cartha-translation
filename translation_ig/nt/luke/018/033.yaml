id: LUK.18.33
reference: Luke 18:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν, καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: ig
  text: Mgbe ha pịachara ya ụtarị, ha ga-egbu ya, ma n’ụbọchị nke atọ, ọ ga-ebili.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-akpọlite ya.” N’asụsụ Grik, okwu ahụ pụtara kpọmkwem, “ọ ga-ebili.”
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: Mgbe ha pịachara ya ihe
  rationale: Nkebiokwu a na-egosi ihe ha ga-ebu ụzọ mee tupu ha egbuo ya. ‘Pịa ya ihe’ bụ okwu Igbo doro anya nke na-egosi iti mmadụ ahụhụ n’ụzọ siri ike, n’enweghị iji okwu ochie ma ọ bụ ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: ἀποκτενοῦσιν
  choice: ha ga-egbu ya
  rationale: Nke a na-enye kpọmkwem ihe ngwaa ọdịnihu ahụ pụtara, ma ọ naghị agbakwụnye echiche pụrụ iche nke ‘igbu ọchụ’ nke okwu Grik ahụ n’onwe ya ekwughị.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs/Nwa nke Mmadụ dịka amaokwu ndị gbara ya gburugburu si gosi.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: n’ụbọchị nke atọ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si egosi oge ahụ, n’enweghị ịgbakwụnye ‘mgbe nke a gasịrị,’ nke na-anọghị kpọmkwem na isi mmalite.
- source_word: ἀναστήσεται
  choice: ọ ga-ebili
  rationale: Ụdị ngwaa Grik a bụ ọdịnihu etiti ma na-arụ ọrụ dịka ngwaa na-enweghị nnara ebe a. ‘Ọ ga-ebili’ na-agbasochi ọdịdị isi mmalite anya karịa ime ya ka ọ bụrụ olu nnara.
theological_decisions:
- issue: Okwu e ji kọwaa mbilite n’ọnwụ
  choice: ọ ga-ebili
  alternative: a ga-eme ka o si n’ọnwụ bilie
  rationale: ‘Ọ ga-ebili’ bụ nsụgharị kacha nso n’ụdị Grik nke dị ebe a. Nhọrọ nke ọzọ kwekọrọ n’ozizi dị n’akụkụ Akwụkwọ Nsọ ndị ọzọ, ma ọ ga-eme ka ihe dị ebe a bụrụ olu nnara ma si otú ahụ kọwaa ihe Grik hapụrụ n’ụdị etiti.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. Ahịrịokwu ahụ na-edobe usoro ihe omume dị na Grik ma na-ezere okwu ụka pụrụ iche. Akara nkọwa ala peeji [a] dị n’isi ederede ozugbo n’azụ okwu ọ na-akọwa.
