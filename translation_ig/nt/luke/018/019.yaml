  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: ig
  text: Ma Jizọs sịrị ya, “Gịnị mere i ji akpọ m onye ọma? Ọ dịghị onye dị mma ma e wezụga naanị Chineke.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi obere mgbanwe ma ọ bụ mmeghachi omume dị n’okwu Jizọs n’ebe okwu nwoke ahụ dị, n’enweghị ịgbakwunye nkọwa.
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: Jizọs sịrị
  rationale: Nke a na-asụgharị λέγω n'ụzọ kwụ ọtọ dịka ‘sịrị’; ebe ọnọdụ ahụ bụ nzaghachi, okwu Grik ahụ n’onwe ya anaghị achọ ka a sụgharịa ya ‘zara.’
- source_word: αὐτῷ
  choice: ya
  rationale: A hapụrụ nnọchiaha ahụ dịka ọ dị n’asụsụ Grik, kama itinye ‘nwoke ahụ,’ nke ga-abụ nkọwa agbakwunyere.
- source_word: Τί
  choice: Gịnị mere
  rationale: N’ajụjụ a, τί na-arụ ọrụ dịka ajụjụ ihe kpatara ihe; ‘Gịnị mere’ bụ ụzọ Igbo dị ndụ si kwuo ya.
- source_word: με λέγεις ἀγαθόν
  choice: i ji akpọ m onye ọma
  rationale: Nke a na-echekwa kpọmkwem omume nke ‘ịkpọ’ mmadụ ihe, ma jiri ‘onye ọma’ mee ka predicate adjective ahụ daa nke ọma n’Igbo.
- source_word: ἀγαθόν / ἀγαθὸς
  choice: onye ọma / dị mma
  rationale: 'E ji mgbọrọgwụ echiche ọma mee ihe n’ebe abụọ ahụ n’ụzọ dabara n’usoro Igbo: ‘onye ọma’ mgbe a kpọrọ mmadụ aha, na ‘dị mma’ n’okwu nkwupụta. E tinyeghị ‘n’omume’ ka a ghara ịkọwa okwu ahụ karịa isi mmalite.'
- source_word: οὐδεὶς
  choice: Ọ dịghị onye
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke nkịtị isi kwupụta ngọnarị zuru ụwa ọnụ banyere mmadụ niile.
- source_word: εἰ μὴ εἷς
  choice: ma e wezụga naanị otu onye
  rationale: Nke a na-echekwa usoro iwepụ onye ọzọ na nkwupụta ahụ nakwa nkwusi ike dị na εἷς, ma na-ada nke ọma n’Igbo.
- source_word: ὁ θεός
  choice: Chineke
  rationale: ‘Chineke’ bụ aha Igbo a na-ejikarị akọwa God n’ụzọ doro anya; ọ chọghị mkpọaha ọzọ n’ebe a.
theological_decisions:
- issue: Ihe ajụjụ Jizọs nwere ike ịpụta banyere onye Kraịst bụ
  choice: E chekwara ajụjụ Jizọs n’enweghị ịkọwa ya dịka ịgọnahụ ịdị mma ya ma ọ bụ dịka nkwupụta doro anya ozugbo na ya bụ Chineke.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi na Jizọs na-agọnahụ na ọ bụ onye ọma kpamkpam, ma ọ bụ n’ụzọ ga-eme ka ọ bụrụ na ọ na-ekwupụta chi ya ozugbo.
  rationale: Okwu Grik na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị; nsụgharị ahụ ekwesịghị idozi ihe amaokwu ahụ n’onwe ya na-ekwughị hoo haa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu na-ada ka okwu mmadụ na-ekwu n’ezie, ebe a na-echekwa ịdị nkenke na esemokwu dị n’isi mmalite.
