base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: ig
  text: Ndị ikom abụọ rịgoro n'ụlọ nsọ ikpe ekpere[a]; otu bụ onye Farisii, nke ọzọ bụ onye ọnaụtụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ ἱερόν, nke na-ezo aka n’ogige ụlọ nsọ dum, ọ bụghị kpọmkwem ebe nsọ dị n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: Ndị ikom abụọ
  rationale: Ọ bụ ezie na ἄνθρωποι pụrụ ịpụta ndị mmadụ n'ozuzu, nkọwa ndị na-esochi ya na-egosi na ndị a bụ ụmụ nwoke abụọ; “ndị ikom abụọ” na-egosipụta nke a n'ụzọ doro anya.
- source_word: ἀνέβησαν
  choice: rigooro
  rationale: Okwu a pụtara ịrịgo ma ọ bụ ịga elu. “Rigooro” na-echekwa echiche nke ịrịgo Jerusalem na ụlọ nsọ, ma bụrụkwa Igbo dị mfe nghọta.
- source_word: εἰς τὸ ἱερὸν
  choice: n'ụlọ nsọ
  rationale: ἱερόν na-ezo aka n'ogige na gburugburu ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime. “Ụlọ nsọ” bụ okwu Igbo a maara nke ọma; nkọwa ala peeji na-edobe izi ezi ya.
- source_word: προσεύξασθαι
  choice: ikpe ekpere
  rationale: Infinitive a na-egosi nzube ha jiri gaa; “ikpe ekpere” bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ya.
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: otu ... nke ọzọ
  rationale: Nke a na-echekwa ọdịiche dị n'etiti mmadụ mbụ na onye nke abụọ n'ụzọ Igbo na-ada nke ọma.
- source_word: Φαρισαῖος
  choice: onye Farisii
  rationale: Nke a bụ aha otu okpukpe ndị Juu, e dekwara ya n'ụdị a na-aghọta n'Igbo.
- source_word: τελώνης
  choice: onye ọna ụtụ
  rationale: τελώνης bụ onye na-anakọta ụtụ isi ma ọ bụ ụgwọ ụzọ; “onye ọna ụtụ” bụ okwu Igbo dị ugbu a ma doo anya karịa okwu ochie.
theological_decisions:
- issue: Ịkọwa ἱερόν n'ụzọ dị iche na ναός
  choice: ụlọ nsọ, tinyere nkọwa ala peeji
  alternative: ogige ụlọ nsọ
  rationale: Ihe a na-ekwu bụ gburugburu ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime. Isi ederede ji okwu a maara nke ọma, ebe nkọwa ala peeji na-egosi oke ihe okwu Grik ahụ pụtara.
- issue: Ụdị okike e ji sụgharịa ἄνθρωποι
  choice: ndị ikom
  alternative: ndị mmadụ
  rationale: Ọ bụ ezie na okwu Grik ahụ pụrụ ịgụnye mmadụ n'ozuzu, ihe gbara ya gburugburu na-akọwa mmadụ abụọ ndị nwoke; ya mere nsụgharị ahụ ekwesịghị ime ka okike ha ghara ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Rigooro” na-echekwa ntụgharị elu dị na ἀνέβησαν; “onye ọna ụtụ” na-ezere okwu ochie ma ọ bụ nke nwere nghọtahie. Akara nkọwa [a] dị ozugbo n'isi ederede.
