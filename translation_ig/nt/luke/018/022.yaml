source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ig
  text: 'Mgbe Jizọs nụrụ nke a, ọ sịrị ya, “Otu ihe ka dị gị ụkọ[a]: ree ihe niile i nwere, kesaa ego ya nye ndị ogbenye; ị ga-enwekwa akụ n’eluigwe[b]. Bịa, soro m.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Otu ihe ka kọrọ gị.” N’ụzọ okwu Grik si kwụ, ihe ọ pụtara kpọmkwem bụ, “Otu ihe ka dị gị ụkọ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’eluigwe ndị ahụ” ma ọ bụ “n’eluigwe” n’ụdị ọtụtụ. Okwu Grik a dị n’ụdị ọtụtụ, ma n’Igbo a na-ejikarị “eluigwe” otu okwu ekwu echiche a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ
  choice: Mgbe Jizọs nụrụ nke a
  rationale: A sụgharịrị participle aorist ahụ dị ka nkebiokwu oge n’Igbo; “nke a” na-ezo aka n’ihe nwoke ahụ kwuru n’amaokwu bu ụzọ.
- source_word: Ἔτι ἕν σοι λείπει
  choice: Otu ihe ka dị gị ụkọ
  rationale: Nke a na-edobe echiche na otu ihe ka na-adịghị ya, ma bụrụkwa okwu Igbo doro anya nke na-adịghị agbanwe isiokwu Grik ahụ ka ọ bụrụ nkọwa ozizi.
- source_word: πάντα ὅσα ἔχεις
  choice: ihe niile i nwere
  rationale: Ọ bụ ụzọ Igbo nkịtị ma zuru ezu isi gosipụta ike mkpokọta nke πάντα ὅσα.
- source_word: πώλησον
  choice: ree
  rationale: Iwu dị nkenke ma kwụ ọtọ, kwekọrọ n’aorist imperative nke na-akpọ ya ka o mee ihe ahụ n’ezie.
- source_word: διάδος πτωχοῖς
  choice: kesaara ndị ogbenye
  rationale: “Kesaara” na-echekwa echiche nke ikesa ma ọ bụ inyefe ihe n’etiti ọtụtụ ndị, ọ bụghị naanị inye otu onyinye; ihe a ga-ekesa ka doro anya site n’iwu bu ya ụzọ.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: ị ga-enwekwa akụ n’eluigwe
  rationale: “Akụ” na-enye echiche nke θησαυρός, ebe “n’eluigwe” bụ okwu Igbo nkịtị maka ebe eluigwe n’agbanyeghị na Grik jiri ụdị ọtụtụ.
- source_word: δεῦρο
  choice: Bịa
  rationale: Ọ na-edobe ọkpụkpọ Jizọs ka nwoke ahụ bịakwute ya n’ụzọ dị nkenke ma bụrụkwa nke okike n’Igbo.
- source_word: ἀκολούθει μοι
  choice: soro m
  rationale: Iwu a dị mfe na nke okike n’Igbo, ma ọnọdụ ya na-eme ka echiche nke iso Jizọs na-aga n’ihu pụta ìhè n’enweghị ịgbakwunye okwu na-adịghị na Grik.
theological_decisions:
- issue: Mmetụta ọkpụkpọ a nwere n’ịhapụ ihe onwunwe na ịbụ onye na-eso ụzọ
  choice: E debere ya dị ka iwu Jizọs nyere nwoke a kpọmkwem ka o ree ihe niile o nwere, kesaara ndị ogbenye, wee soro ya.
  alternative: Ịkọwa ya ma ọ bụ dị ka iwu zuru ụwa ọnụ ka ndị niile kwere ekwe ree ihe niile ha nwere, ma ọ bụ dị ka ihe atụ efu nke na-achọghị ihe omume akụ na ụba n’ezie.
  rationale: Grik na-enye nwoke a iwu doro anya, ma mechie ya n’ọkpụkpọ “soro m.” Nsụgharị ahụ na-edobe ma ịdị ike nke iwu ahụ ma oke nke ihe amaokwu ahụ kwuru, n’enweghị idozi esemokwu ozizi ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ndị ahụ dị nkenke iji chekwaa ike iwu Jizọs. E zere okwu ụka pụrụ iche na nkọwa ga-eme ka iwu ahụ bụrụ naanị ihe atụ ma ọ bụ iwu zuru ụwa ọnụ karịa ihe amaokwu ahụ kwuru.
