review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the narrative connector, the indirect object, πίστις as “okwukwe,” and the perfect σέσωκέν as “azọpụtala,” preserving the source verb’s healing-and-salvation breadth. However, “Nwetaghachi ịhụ ụzọ” is less idiomatic as a direct healing command and explicitly suggests recovery of a previously possessed ability. Ἀνάβλεψον can carry that nuance in this context, but the main text need not impose it.
  naturalness: “Jizọs wee sị ya” and “okwukwe gị azọpụtala gị” are natural Standard Igbo. “Hụ ụzọ ọzọ” is a more direct, established, and natural command in this healing context than “Nwetaghachi ịhụ ụzọ.”
  terminology: “Okwukwe” and “azọpụtala” are appropriate. The latter appropriately retains σῴζω’s wider sense, while the footnote gives the bodily-healing alternatives. The footnote for Ἀνάβλεψον should identify “Hụ ụzọ ọzọ” as the main contextual rendering and retain a non-recovery alternative, rather than presenting the main wording as merely an alternative.
  issues:
  - severity: medium
    issue: The rendering of Ἀνάβλεψον is somewhat awkward and over-specifies regaining sight.
    rationale: “Nwetaghachi” naturally entails getting something back. Although “see again” is lexically possible, the Greek command in this context can be rendered without making prior sight explicit. “Hụ ụzọ ọzọ” is more idiomatic and direct in Standard Igbo.
  - severity: low
    issue: Footnote a does not align cleanly with the revised lexical relationship.
    rationale: Once “Hụ ụzọ ọzọ” is used in the main text, the footnote should offer “Nweta ọhụ ụzọ” as an alternative that does not foreground recovery, while explaining the Greek’s contextual healing sense.
  revised_text: Jizọs wee sị ya, “Hụ ụzọ ọzọ[a]; okwukwe gị azọpụtala gị[b].”
