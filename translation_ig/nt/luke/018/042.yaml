  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: ig
  text: Jizọs wee sị ya, “Hụ ụzọ ọzọ[a]; okwukwe gị azọpụtala gị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Nweta ọhụ ụzọ.” N’ọnọdụ ọgwụgwọ, iwu Grik a nwere ike ịpụta ka mmadụ hụ ụzọ ọzọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “okwukwe gị agwọọla gị” ma ọ bụ “okwukwe gị emewo ka ahụ dị gị mma.” Ngwaa Grik a nwere ike izo aka n’ọgwụgwọ nakwa na nzọpụta.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: Ọ na-ejikọta ihe omume a na akụkọ bu ya ụzọ n’ụzọ e si akọ akụkọ n’Igbo, n’etinyeghị nkọwa ọzọ.
- source_word: εἶπεν αὐτῷ
  choice: sị ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ekwu okwu kpọmkwem, nke na-edobe onye a gwara okwu.
- source_word: Ἀνάβλεψον
  choice: Nwetaghachi ịhụ ụzọ
  rationale: N’ọnọdụ ọgwụgwọ onye ìsì a, okwu Grik a pụtara ịhụ ụzọ ma ọ bụ ịhụ ụzọ ọzọ, ọ bụghị naanị ile anya elu.
- source_word: πίστις
  choice: okwukwe
  rationale: N’ebe a, ọ na-egosi ntụkwasị obi nwoke ahụ nwere n’ebe Jizọs nọ; “okwukwe” bụ okwu Igbo a maara nke ọma ma na-edobe ịdị arọ nke okwu ahụ.
- source_word: σέσωκέν
  choice: azọpụtala
  rationale: Okwu Grik ahụ nwere ike ịpụta ịzọpụta ma ọ bụ ịgwọ ọrịa. “Azọpụtala” na-edobe ma ọgwụgwọ anụ ahụ ma ohere nke nzọpụta sara mbara n’akwụkwọ Luk.
theological_decisions:
- issue: Ókè ihe σῴζω pụtara n’akụkọ ọgwụgwọ a
  choice: azọpụtala
  alternative: agwọọla / emewo ka ahụ dị gị mma
  rationale: Ọnọdụ akụkọ a metụtara ọgwụgwọ anya, ma ngwaa ahụ nwekwara nghọta nke nzọpụta. Nsụgharị bụ isi ekwesịghị imechi otu n’ime nghọta abụọ ahụ; ya mere e debere “azọpụtala,” ma kọwaa nghọta ọgwụgwọ na ndetu ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị mfe ma dị ùgwù. “Jizọs wee sị ya” na-aga nke ọma n’usoro akụkọ Igbo; “azọpụtala” na-edobe mgbagwoju nghọta dị n’etiti ọgwụgwọ na nzọpụta.
