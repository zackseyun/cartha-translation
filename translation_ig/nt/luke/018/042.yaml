- from: Jizọs wee sị ya, “Nwetaghachi ịhụ ụzọ[a]; okwukwe gị azọpụtala gị[b].”
  to: Jizọs wee sị ya, “Hụ ụzọ ọzọ[a]; okwukwe gị azọpụtala gị[b].”
  rationale: The revision replaces an awkward imperative that can unnecessarily imply prior possession of sight with the more natural Standard Igbo healing command “Hụ ụzọ ọzọ.” It retains “azọpụtala” for σέσωκέν, preserving the original’s deliberate overlap of physical healing and salvation, and adjusts footnote a to reflect the revised main-text choice.
