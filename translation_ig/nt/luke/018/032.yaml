  text: παραδοθήσεται γὰρ τοῖς ἔθνεσιν καὶ ἐμπαιχθήσεται καὶ ὑβρισθήσεται καὶ ἐμπτυσθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/032.yaml
  text: For he will be handed over to the Gentiles and will be mocked and insulted and spit on[b][a],
translation:
  language: ig
  text: N’ihi na a ga-enyefe ya n’aka ndị mba ọzọ[a], a ga-akwa ya emo, a ga-akparị ya[b], a ga-agbụkwa ya ọnụ mmiri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.” N’ebe a, ihe ọ pụtara kpọmkwem bụ ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mesoo ya n’ụzọ ihere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδοθήσεται
  choice: a ga-enyefe ya n’aka
  rationale: Ọ na-echekwa ọdịdị nnara nke ngwaa Grik ma gosipụta inyefe mmadụ n’aka ndị ọzọ, n’etinyeghị echiche kpọmkwem nke ‘ịrara mmadụ nye.’
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N’ebe a okwu ahụ na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ, ọ bụghị naanị mba dị iche iche n’ozuzu.
- source_word: ἐμπαιχθήσεται
  choice: a ga-akwa ya emo
  rationale: Nke a bụ okwu Igbo doro anya ma dị arọ maka ime mmadụ ihe ọchị n’ụzọ mkparị.
- source_word: ὑβρισθήσεται
  choice: kparịa ya
  rationale: Ọ na-egosipụta mkparị na iweda mmadụ ala; nkọwa sara mbara nke imeso ya n’ụzọ ihere ka edebere n’ala peeji.
- source_word: ἐμπτυσθήσεται
  choice: gbụọkwa ya ọnụ mmiri
  rationale: Nke a na-akọwa omume ahụ kpọmkwem n’Igbo eke ma chekwaa ihere na nlelị dị na ya.
theological_decisions:
- issue: Onye ngwaa nnara ndị a na-ezo aka na ya
  choice: E tinyere nnọchiaha ‘ya,’ nke na-ezo aka n’ebe Nwa nke Mmadụ nọ n’amaokwu bu ụzọ.
  alternative: Ịhapụ onye a na-ekwu maka ya n’ebughị nnọchiaha
  rationale: Ọ bụ ezie na amaokwu Grik a ekwughị isiokwu ahụ ọzọ, ihe gbara ya gburugburu mere ka o doo anya; nnọchiaha ahụ dị mkpa ka Igbo bụrụ nke eke ma ọ naghị etinye ozizi ọhụrụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa ùgwù. Usoro ‘a ga-’ na-echekwa ngwaa nnara ndị Grik n’ụzọ Igbo na-anabata nke ọma; njikọ ikpeazụ ‘-kwa’ na-eme ka ndepụta omume ndị ahụ na-aga were were.
