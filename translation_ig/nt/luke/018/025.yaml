  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: ig
  text: N’ihi na ọ dịrị kamel mfe karị isi n’anya agịga gafee karịa ka ọ dịrị nwoke bara ọgaranya ịbanye n’alaeze Chineke[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-akọwapụta ya kpọmkwem karị, “isi n’oghere agịga gafee.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ atụpụtala nkọwa ndị dị ka ọnụ ụzọ dị warara a na-akpọ “anya agịga,” ma ọ bụ na okwu ahụ pụtara “eriri” kama “kamel”; ma ihe odide Grik n’ebe a bụ “kamel.”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: ọ dịrị ... mfe karị
  rationale: 'Nke a na-egosipụta ntụnyere nke okwu Grik ahụ n’ụzọ Igbo na-asụkarị: ‘ọ dịrị ... mfe karị.’'
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-edobe ọrụ nkọwa na njikọ okwu a na amaokwu ndị bu ya ụzọ.
- source_word: κάμηλον
  choice: kamel
  rationale: Ihe okwu Grik κάμηλος pụtara n’ụzọ nkịtị bụ ‘kamel’; e nweghị ihe akaebe n’ihe odide a ga-eji dochie ya ‘eriri.’
- source_word: διὰ τρήματος βελόνης
  choice: isi n’anya agịga gafee
  rationale: ‘Anya agịga’ bụ ụzọ Igbo doro anya ma bụrụkwa nke a maara nke ọma isi kwuo oghere agịga; ‘gafee’ na-egosipụta mmegharị site n’ime oghere ahụ.
- source_word: εἰσελθεῖν
  choice: ịbanye
  rationale: N’ebe nke abụọ, ‘ịbanye’ na-enye kpọmkwem echiche nke ịga n’ime alaeze; n’ebe nke mbụ, usoro Igbo ‘isi ... gafee’ ka eke karịa ma na-edobe otu echiche ahụ.
- source_word: πλούσιον
  choice: nwoke bara ọgaranya
  rationale: Okwu Grik bụ nkọwa nwoke n’ọnụọgụ otu e ji mee aha; nsụgharị a na-edobe ma nwoke ahụ ma ọnọdụ akụ na ụba ya.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ịbanye n’alaeze Chineke
  rationale: ‘Alaeze Chineke’ bụ okwu Akwụkwọ Nsọ doro anya, ebe ‘ịbanye n’...’ na-eburu echiche ntụziaka nke εἰς n’ụzọ Igbo nkịtị.
theological_decisions:
- issue: Nkọwa nke ihe atụ kamel na anya agịga
  choice: 'Edobere ihe atụ ahụ kpọmkwem: kamel isi n’anya agịga gafee.'
  alternative: Ịkọwa ‘anya agịga’ dị ka aha ọnụ ụzọ dị warara, ma ọ bụ ịgụ ‘eriri’ kama ‘kamel.’
  rationale: Ihe odide Grik e nyere nwere κάμηλον, ‘kamel,’ ma na-eji ihe atụ siri ike nke na-egosi ihe na-agaghị ekwe omume ma ọ bụ ihe tara nnọọ akpụ. E kwesịghị ibubata nkọwa ndị mechara pụta n’ime isi amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-edobe ike nke ihe atụ ahụ n’enweghị ime ka ọ dị nro ma ọ bụ tinye nkọwa otu ụka n’ime ya.
