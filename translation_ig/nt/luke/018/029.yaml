id: LUK.18.29
reference: Luke 18:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ⸂γυναῖκα ἢ ἀδελφοὺς ἢ γονεῖς⸃ ἢ τέκνα ἕνεκεν τῆς βασιλείας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/029.yaml
  text: And he said to them, “Truly I say to you, there is no one who has left a house or wife or brothers or parents or children for the sake of the kingdom of God,”
translation:
  language: ig
  text: Ọ sịrị ha, “N’ezie, ana m asị unu, ọ dịghị onye ọ bụla hapụrụ ụlọ ma ọ bụ nwunye ma ọ bụ ụmụnne nwoke ma ọ bụ nne na nna ma ọ bụ ụmụ ya n’ihi alaeze Chineke,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν
  choice: N’ezie
  rationale: Na-ebute nkwupụta siri ike Jizọs na-eme n’asụsụ Igbo dị ugbu a ma dịkwa ugwu.
- source_word: ἀφῆκεν
  choice: hapụrụ
  rationale: Na-egosipụta ịhapụ ihe ma ọ bụ mmadụ n’ụzọ doro anya, n’enweghị ịkọwa ma ọ bụ ịgbakwunye ihe kpatara ya.
- source_word: οἰκίαν
  choice: ụlọ
  rationale: 'Ọ bụ okwu Igbo nkịtị nke na-edobe ohere ihe okwu Grik pụtara: ụlọ obibi ma ọ bụ ezinụlọ/ezinaụlọ nke ụlọ ahụ nọchiri anya ya.'
- source_word: ἀδελφούς
  choice: ụmụnne nwoke
  rationale: Na-egosipụta ụdị ọtụtụ nke okwu Grik ἀδελφός n’ebe a n'ụzọ kpọmkwem, ma na-ekewapụ ya na ụmụnne nwanyị.
- source_word: γονεῖς
  choice: nne na nna
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo ndị mụrụ mmadụ.
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: n’ihi alaeze Chineke
  rationale: Na-edobe mmekọrịta nke ihe kpatara ya ma na-eji okwu Igbo a na-ahụkarị maka ọchịchị/alaeze Chineke.
theological_decisions:
- issue: Ihe ‘ịhapụ’ nwunye na ezinụlọ pụtara
  choice: E debere okwu ahụ dịka ‘hapụrụ’ n’enweghị nkọwa ọzọ.
  alternative: Ịsụgharị ya dịka ịgbahapụ kpamkpam, ịgba alụkwaghịm, ma ọ bụ ịpụ nwa oge maka ozi.
  rationale: Amaokwu a anaghị akọwa ụdị ma ọ bụ ogologo oge nke ịhapụ ahụ; ntụgharị ekwesịghị idozi mgbagwoju anya ahụ n’ụzọ nke ederede n’onwe ya na-emeghị.
- issue: ‘Alaeze Chineke’ dịka ihe mere e ji hapụ ihe
  choice: n’ihi alaeze Chineke
  alternative: maka ọrụ alaeze Chineke
  rationale: Ederede Grik kwuru banyere alaeze Chineke n’onwe ya, ọ bụghị kpọmkwem ‘ọrụ’ ya; ya mere, agbakwụnyeghị echiche ahụ.
translation_notes:
  register: Asụsụ Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. E debere usoro ndepụta na nkwupụta siri ike nke amaokwu Grik. Akara rịkọm n’ikpeazụ na-egosi na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esote.
