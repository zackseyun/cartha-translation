id: LUK.18.1
reference: Luke 18:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: ig
  text: Ọ nọ na-agwa ha otu ilu banyere mkpa ọ dị ka ha na-ekpe ekpere mgbe niile ma ghara ịda mbà.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “iji gosi na ha kwesịrị ikpe ekpere mgbe niile ma ghara ịda mbà.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ọ nọ na-agwa
  rationale: Ụdị ngwaa imperfect na-egosi omume gara aga nke na-aga n’ihu ma ọ bụ nke na-emeghe ọnọdụ akụkọ ahụ; ‘nọ na-agwa’ na-echekwa akụkụ a nke ọma.
- source_word: δὲ
  choice: —
  rationale: Nke a bụ njikọ dị nro. A naghị etinye okwu njikọ pụrụ iche n’ebe a, n’ihi na Igbo na-aga were were n’enweghị ya, ọ dịghịkwa mkpa ịgbakwunye echiche oge dịka ‘ugbu a.’
- source_word: παραβολὴν
  choice: otu ilu
  rationale: ‘Ilu’ bụ okwu Igbo a na-aghọta nke ọma maka akụkọ ntụnyere Jizọs ji akụzi ihe; ‘otu’ na-egosipụta akara enweghị nkọwa dị n’asụsụ Grik.
- source_word: αὐτοῖς
  choice: ha
  rationale: Ọ bụ ndị Jizọs na-agwa okwu ka nnọchiaha a na-ezo aka.
- source_word: πρὸς τὸ δεῖν
  choice: banyere mkpa ọ dị ka
  rationale: Nke a na-egosipụta ma isiokwu ilu ahụ ma ịdị mkpa dị na δεῖν, n’Igbo dị ugbu a ma dịkwa mfe nghọta.
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Nke a na-enye echiche nke ịnọgide na-ekpe ekpere, n’enweghị ime ka ọ pụta na mmadụ ga na-ekwu ekpere n’akwụsịghị akwụsị.
- source_word: προσεύχεσθαι
  choice: na-ekpe ekpere
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ‘to pray.’
- source_word: μὴ ἐγκακεῖν
  choice: ghara ịda mbà
  rationale: ‘Ịda mbà’ na-egosipụta ịkwụsị inwe obi ike ma ọ bụ ịda mba n’ihi nkụda mmụọ, nke dabara n’ọnọdụ ekpere a na-ekwusi ike na ya.
theological_decisions:
- issue: Ike iwu dị n’ozizi Jizọs banyere ịnọgide n’ekpere
  choice: mkpa ọ dị ka ha na-ekpe ekpere mgbe niile
  alternative: ha kwesịrị ikpe ekpere mgbe niile
  rationale: δεῖν na-egosi ịdị mkpa ma ọ bụ ihe mmadụ kwesịrị ime. Nsụgharị bụ isi na-echekwa ike ahụ ma ọ naghị etinye ozizi pụrụ iche banyere otú ekpere si arụ ọrụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere ihe ama alaụda naanị n’ebe ọ na-enyere nghọta, dịka ‘mbà.’
