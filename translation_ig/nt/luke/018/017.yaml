review_pass:
  verdict: revise
  source_fidelity: 'Isi ederede na-esochi Grik nke ọma: «N’eziokwu, ana m agwa unu» na-anọchi ἀμὴν λέγω ὑμῖν; «onye ọ bụla» na-egosi ὃς ἂν; «agaghị ... ma ọlị» na-ebute nkwusi ike nke οὐ μή; «na ya» na-atụ aka n’alaeze. E debere ntụnyere ὡς παιδίον n’enweghị itinye nkọwa okpukpe pụrụ iche.'
  naturalness: Ederede isi ahụ bụ Igbo ọkọlọtọ, dị mfe nghọta, ma dabara n’ụdị okwu dị ùgwù. Otú ọ dị, ahịrịokwu ụkwụ ederede nke dị ugbu a adịghị etinye «dị ka nwatakịrị» n’ebe kwesịrị ekwesị n’ime ndepụta àgwà, ma nhọrọ a kpọrọ ‘nsụgharị ọzọ’ na-emegharị kpọmkwem okwu dị n’ederede isi.
  terminology: «Alaeze Chineke», «ịnabata», na «nwatakịrị» bụ okwu dabara adaba ma na-echekwa obosara nke βασιλεία, δέχομαι, na παιδίον. A naghị edozi ihe kpọmkwem ntụnyere nwatakịrị ahụ pụtara.
