  to: N’eziokwu, ana m agwa unu[a], onye ọ bụla na-anabataghị alaeze Chineke dị ka nwatakịrị agaghị abanye na ya ma ọlị.
  rationale: 'A hapụrụ ederede isi dịka ọ dị n’ihi na ọ bụ ntụgharị kwesịrị ntụkwasị obi ma bụrụkwa Igbo eke. A doziri naanị ụkwụ ederede: e nyere nhọrọ dị iche n’ezie («ka nwatakịrị») ma hazie nkọwa ya ka ọ ghara ikwu na ọ bụ naanị ‘ịdabere’ ka ntụnyere ahụ metụtara. Nke a na-echekwa amaghị ama nke Grik.'
