  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ig
  text: N’eziokwu, ana m agwa unu[a], onye ọ bụla na-anabataghị alaeze Chineke dị ka nwatakịrị agaghị abanye na ya ma ọlị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka nwatakịrị.” Okwu ahụ nwere ike imesi ike n’ịdị njikere ịnabata ihe, ntụkwasị obi, ịdị umeala n’obi, ma ọ bụ ịdabere n’ebe onye ọzọ nọ—àgwà a pụrụ ịhụ n’ime nwatakịrị; Grik akọwaghị kpọmkwem àgwà ọ na-ekwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: N’eziokwu
  rationale: N’okwu mmeghe Jizọs, nke a na-egosipụta nkwenye siri ike nke ἀμὴν n’Igbo nkịtị ma dị ùgwù, n’etinyeghị mkpụrụokwu a sụgharịghị.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo dị ndụ si ekwu okwu a a na-agwa ọtụtụ mmadụ ozugbo.
- source_word: ὃς ἂν
  choice: onye ọ bụla
  rationale: Ọ na-egosipụta ọnọdụ izugbe na-emetụta onye ọbụla, dịka njikọ nnọchiaha na ἄν si dị.
- source_word: μὴ δέξηται
  choice: na-anabataghị
  rationale: ‘Ịnabata’ na-ejigide echiche nke ịnata ma kweta, n’enweghị ịkọwa ihe atụ ahụ karịa ihe Grik kwuru.
- source_word: βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ ntụgharị Igbo doro anya ma bụrụkwa nke a maara nke ọma; ọ naghị amanye nkọwa ‘ọchịchị’ kama ọ na-echekwa obosara βασιλεία.
- source_word: ὡς παιδίον
  choice: dị ka nwatakịrị
  rationale: Ọ na-echekwa ntụnyere ahụ n’enweghị ikpebi ma àgwà a na-ekwu bụ ịdị umeala n’obi, ntụkwasị obi, ndabere, ma ọ bụ ịdị njikere ịnabata.
- source_word: οὐ μὴ εἰσέλθῃ
  choice: agaghị abanye ... ma ọlị
  rationale: ‘Agaghị ... ma ọlị’ na-egosipụta ngọnarị siri ike nke οὐ μή tinyere aorist subjunctive n’Igbo e ji eme ihe ugbu a.
- source_word: εἰς αὐτήν
  choice: na ya
  rationale: Nnọchiaha ahụ na-alaghachi n’alaeze Chineke; ‘banye na ya’ bụ usoro Igbo eke.
theological_decisions:
- issue: Ihe ‘ịnabata alaeze Chineke dị ka nwatakịrị’ pụtara
  choice: E debere ihe atụ ahụ n’ụdị sara mbara, n’akọwaghị kpọmkwem àgwà nwatakịrị a na-ekwu.
  alternative: Ịnabata ya n’ịdị umeala n’obi dịka nwatakịrị; ịnabata ya na ntụkwasị obi dịka nwatakịrị; ma ọ bụ ịnabata ya dịka onye bụ nwatakịrị.
  rationale: Grik kwuru ntụnyere ahụ ma ọ kọwaghị kpọmkwem ma isi ihe bụ ịdị umeala n’obi, ntụkwasị obi, ndabere, ma ọ bụ ịdị njikere ịnabata. Ya mere, ntụgharị ahụ ekwesịghị idozi esemokwu nkọwa a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ chekwaa na Jizọs na-agwa ọtụtụ mmadụ okwu; e zere okwu ụka pụrụ iche na nkọwa ga-emechi nghọta nke ihe atụ ahụ.
