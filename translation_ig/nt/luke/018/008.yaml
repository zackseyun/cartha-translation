  source_fidelity: 'The central sense is accurately conveyed: God will give justice to his chosen ones swiftly, followed by the Son of Man''s searching question about faith. The judicial force of ἐκδίκησις, the temporal force of ἐν τάχει, and the title “Nwa nke Mmadụ” are retained.'
  naturalness: The current placement of “n’ezie” after “okwukwe” is potentially read as modifying the noun (“true/genuine faith”) rather than the rhetorical question (“will he really find...?”). Moving it before “okwukwe” makes the intended force natural and unambiguous in Standard Igbo.
  terminology: “ikpe ziri ezi,” “Nwa nke Mmadụ,” and “okwukwe” are appropriate. The footnotes preserve the significant lexical alternatives without imposing a doctrinal conclusion.
