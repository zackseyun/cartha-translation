  to: Ana m agwa unu na ọ ga-emere ha ikpe ziri ezi ngwa ngwa.[a] Ma mgbe Nwa nke Mmadụ ga-abịa, ọ̀ ga-ahụ n’ezie okwukwe n’elu ụwa?[b]
  rationale: A single safe syntactic revision relocates “n’ezie” so that it expresses the rhetorical and searching nuance of ἆρα (“really/indeed”) rather than suggesting that τὴν πίστιν means specifically “genuine faith.” The rest of the draft is faithful, idiomatic Standard Igbo and retains the required alternatives in the footnotes.
