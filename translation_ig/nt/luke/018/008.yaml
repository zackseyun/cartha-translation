    rationale: In “ọ̀ ga-ahụ okwukwe n’ezie,” n’ezie can naturally qualify okwukwe, yielding “true faith.” Greek ἆρα qualifies the entire reflective question, not πίστις specifically. “ọ̀ ga-ahụ n’ezie okwukwe” better represents its scope.
