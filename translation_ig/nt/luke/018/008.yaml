id: LUK.18.8
reference: Luke 18:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: ig
  text: Ana m agwa unu na ọ ga-emere ha ikpe ziri ezi ngwa ngwa.[a] Ma mgbe Nwa nke Mmadụ ga-abịa, ọ̀ ga-ahụ n’ezie okwukwe n’elu ụwa?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ ga-akwado ha n’ikpe,” ma ọ bụ, “ọ ga-eme ka ha nweta ikpe ziri ezi.” Okwu Grik a nwere ike ịpụta ịkwado mmadụ n’ikpe ma ọ bụ imere ya ikpe ziri ezi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ntụkwasị obi” ma ọ bụ “ikwesị ntụkwasị obi.” Okwu Grik a nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi; isi ederede ji okwu sara mbara bụ “okwukwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: ọ ga-emere ha ikpe ziri ezi
  rationale: Nkebiokwu a na-ekwu maka ime ka ndị a na-emegbu nweta ikpe ziri ezi ma ọ bụ ịkwado ha n’ikpe. N’ọnọdụ ilu nwanyị ahụ di ya nwụrụ, nsụgharị a na-egosi ihe gbasara ikpe n’enweghị ime ka ọ pụta nanị dị ka ịbọ ọbọ.
- source_word: ἐν τάχει
  choice: ngwa ngwa
  rationale: Nke a na-egosi ime ihe ọsọ ọsọ ma ọ bụ n’egbughị oge, n’enweghị ịkọwa ya dị ka oge kpọmkwem ihe ahụ ga-eme.
- source_word: πλὴν
  choice: Ma
  rationale: Ọ na-egosi ntụgharị siri ike site ná nkwa banyere ikpe ziri ezi gaa n’ajụjụ na-enyocha okwukwe. ‘Ma’ bụ okwu Igbo doro anya ma dịkwa mma n’ọnọdụ a.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Aha a na-echekwa ụzọ Jizọs si akpọ onwe ya na njikọ ya na Daniel 7.
- source_word: ἐλθὼν
  choice: mgbe ... ga-abịa
  rationale: A sụgharịrị participle ahụ dị ka nkebiokwu oge, nke bụ ụzọ ebumpụta ụwa e si egosi njikọ ya na ngwaa bụ isi n’Igbo.
- source_word: ἆρα
  choice: n’ezie
  rationale: Okwu a na-eme ka ajụjụ ahụ bụrụ nke na-achọ echiche miri emi ma na-enyocha ọnọdụ ahụ; ‘n’ezie’ na-ebupụta ike ahụ n’Igbo.
- source_word: τὴν πίστιν
  choice: okwukwe
  rationale: ‘Okwukwe’ na-echekwa obosara πίστις n’enweghị ịmachi ya nanị n’ịtụkwasị obi ma ọ bụ ikwesị ntụkwasị obi.
- source_word: ἐπὶ τῆς γῆς
  choice: n’elu ụwa
  rationale: Nke a na-egosi ụwa dum n’ụzọ kwekọrọ n’ọnọdụ okwu banyere ọbịbịa Nwa nke Mmadụ.
theological_decisions:
- issue: πίστις nwere ike ịpụta okwukwe, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Isi ederede ji okwu sara mbara bụ ‘okwukwe,’ ebe ihe ndị ọzọ okwu Grik ahụ nwere ike ịpụta dị n’ala ala peeji ka a ghara idozi esemokwu nkọwa ahụ n’ụzọ otu ozizi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ajụjụ ikpeazụ ka ọ bụrụ ajụjụ na-enyocha obi, ma jiri ‘n’ezie’ gosipụta ike ἆρα. Ihe nrịbama ala ala peeji [a] na [b] pụtara n’isi ederede.
