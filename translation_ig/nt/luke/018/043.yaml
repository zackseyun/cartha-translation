id: LUK.18.43
reference: Luke 18:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: ig
  text: Ozugbo ahụ, ọ hụrụ ụzọ[a], ọ nọkwa na-eso ya[b], na-enye Chineke otuto. Ndị mmadụ niile, mgbe ha hụrụ nke a, tokwara Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “hụ ụzọ ọzọ” ma ọ bụ “nwetaghachi ikike ịhụ ụzọ.” Ngwaa Grik a pụrụ ịpụta na mmadụ nwetaghachiri ikike ịhụ ihe.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “o soro ya.” Ụdị ngwaa Grik ahụ nwere ike imesi ike na ọ nọgidere na-eso ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: ozugbo
  rationale: “Ozugbo” na-egosi na ihe ahụ mere n’egbughị oge, ma bụrụkwa okwu Igbo a na-eji eme ihe n’ụzọ ebumpụta ụwa.
- source_word: ἀνέβλεψεν
  choice: hụ ụzọ
  rationale: N’ọnọdụ ọgwụgwọ onye ìsì, “hụ ụzọ” bụ ụzọ Igbo doro anya ma dị mfe isi kwuo na e nyere ya ikike ịhụ ihe; ihe odide ala peeji na-edobe ohere nke nghọta bụ ‘hụ ụzọ ọzọ.’
- source_word: ἠκολούθει
  choice: ọ nọkwa na-eso ya
  rationale: Ụdị ngwaa imperfect na-egosi omume na-aga n’ihu; “ọ nọkwa na-eso ya” na-edobe nke a karịa naanị “o soro ya.”
- source_word: δοξάζων
  choice: na-enye Chineke otuto
  rationale: Nke a na-egosi omume ya na-eme n’otu oge ahụ ọ na-eso Jizọs, ma na-edobekwa echiche nke inye Chineke ebube ma ọ bụ otuto.
- source_word: λαός
  choice: ndị mmadụ niile
  rationale: N’ebe a λαός na-ezo aka n’ìgwè ndị nọ ebe ahụ. “Ndị mmadụ niile” bụ okwu Igbo doro anya ma dị ugbu a.
- source_word: ἰδὼν
  choice: mgbe ... hụrụ nke a
  rationale: “Nke a” na-ezo aka n’ihe ha hụrụ ka o mere n’akụkọ ahụ, ma usoro a na-eme ka ahịrịokwu ahụ bụrụ Igbo ebumpụta ụwa.
- source_word: ἔδωκεν αἶνον
  choice: ha tokwara Chineke
  rationale: Ọ bụ ezie na okwu Grik pụtara n’ụzọ nkịtị ‘nyere otuto,’ “too Chineke” bụ ụzọ Igbo kachasị ebumpụta ụwa isi kwuo ya; “-kwara” na-edobe njikọ καί.
- source_word: θεός / θεῷ
  choice: Chineke
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme ihe, e dekwara ya ugboro abụọ dịka e mere n’isi mmalite.
theological_decisions:
- issue: Ụdị omume onye ahụ mgbe ọ hụsịrị ụzọ
  choice: ọ nọkwa na-eso ya, na-enye Chineke otuto
  alternative: o soro ya, na-enye Chineke otuto
  rationale: Nhọrọ ahụ na-egosi na iso ya bụ omume na-aga n’ihu dịka imperfect ἠκολούθει si dị, n’agbakwụnyeghị nkọwa ozizi ọzọ.
- issue: Otu mkpokọta πᾶς ὁ λαός si arụ ọrụ na ahịrịokwu ahụ
  choice: mgbe ndị mmadụ niile hụrụ nke a, ha tokwara Chineke
  alternative: ndị ahụ niile, ebe ha hụrụ, nyere Chineke otuto
  rationale: Asụsụ Igbo na-eji ụdị ọtụtụ eme ihe maka ìgwè mmadụ, nke na-eme ka okwu ahụ doo anya n’agbanweghị ihe ọ pụtara.
translation_notes:
  register: E ji Standard Igbo nke dị mfe, dị ugwu, ma bụrụkwa nke ndị na-agụ akwụkwọ taa ga-aghọta. E debere ọdịiche dị n’etiti “na-enye Chineke otuto” (δοξάζων) na “too Chineke” (ἔδωκεν αἶνον), tinyekwa ihe nrịbama ala peeji n’ebe okwu ha na-akọwa dị.
