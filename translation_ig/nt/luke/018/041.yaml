  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: ig
  text: “Gịnị ka ị chọrọ ka m meere gị?” Ọ wee sị, “Onyenweanyị[a], ka m hụ ụzọ ọzọ.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Nna ukwu”; okwu Grik bụ κύριε nwere ike ịbụ okwu nkwanye ùgwù a na-akpọ mmadụ, ọ bụ ezie na “Onyenweanyị” bụ nsụgharị a na-ejikarị maka κύριος.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka m nwetaghachi anya m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Gịnị
  rationale: Ọ bụ nnọchiaha ajụjụ na-ajụ kpọmkwem ihe nwoke ahụ chọrọ; ọ pụtaghị ‘gụnị mere’ n’ebe a.
- source_word: σοι
  choice: meere gị
  rationale: Dative a na-egosi onye ihe a ga-abara uru; ‘meere gị’ bụ ụzọ Igbo si ekwu ya n’ụzọ doro anya ma dịkwa mfe.
- source_word: θέλεις
  choice: ị chọrọ
  rationale: Ọ na-egosi ọchịchọ mmadụ, ‘ị chọrọ’ bụkwa okwu Igbo nkịtị na nke dabara n’ajụjụ a.
- source_word: ποιήσω
  choice: ka m meere
  rationale: Subjunctive a na-eso θέλεις; nhazi ‘ị chọrọ ka m meere gị’ na-enye echiche Grik ahụ n’Igbo sitere n’okike.
- source_word: ὁ δὲ εἶπεν
  choice: Ọ wee sị
  rationale: δέ ebe a na-aga n’ihu n’akụkọ kama igosi nnukwu mmegide; ‘wee’ na-eme ka akụkọ ahụ na-aga were were.
- source_word: Κύριε
  choice: Onyenweanyị
  rationale: Nke a na-edobe nsụgharị a na-ejikarị maka κύριος ma na-ahapụ ma nkwanye ùgwù ma nghọta miri emi banyere onye Jizọs bụ ka ha dị, n’ebughị ụzọ kpebie naanị otu.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-ewebata ihe onye ahụ na-arịọ n’ụzọ dị mkpirikpi ma bụrụkwa Igbo sitere n’okike.
- source_word: ἀναβλέψω
  choice: ka m hụkwa ụzọ
  rationale: N’akụkọ ọgwụgwọ a, okwu ahụ pụtara ịhụ ụzọ ọzọ ma ọ bụ inwetaghachi ikike ịhụ ụzọ; ‘hụkwa ụzọ’ na-egosipụta nke a n’ụzọ dị mfe.
theological_decisions:
- issue: Nsụgharị κύριος mgbe a na-akpọ Jizọs okwu kpọmkwem
  choice: Onyenweanyị
  alternative: Nna ukwu
  rationale: ‘Onyenweanyị’ na-edobe okwu a na-ejikarị maka κύριος, ya na ohere nghọta Kraịst dị n’okwu ahụ. Ihe ọzọ nwekwara ike ịbụ naanị okwu nkwanye ùgwù, ya mere e debere ya n’ala ala peeji kama imechi nghọta ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. Ajụjụ ahụ na azịza ya ka bụ mkparịta ụka kpọmkwem, a hapụkwara nghọta abụọ dị na κύριε na ἀναβλέψω site n’ala ala peeji.
