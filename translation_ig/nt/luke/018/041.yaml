    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ka m nwetaghachi anya m.”
    reason: lexical_alternative
  revision_rationale: The revision changes only the rendering of ἀναβλέψω and its lexical alternative. “Hụ ụzọ ọzọ” naturally means seeing again/regaining sight in this context, while retaining the concise request form and the source’s ambiguity regarding the degree of recognition expressed by κύριε.
