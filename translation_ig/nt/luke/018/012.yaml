  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: ig
  text: Ana m ebu ọnụ ugboro abụọ n’izu[a]; ana m akwụ otu ụzọ n’ụzọ iri n’ihe niile m na-enweta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ugboro abụọ nke Sabat”; nke a bụ akpaalaokwu pụtara “ugboro abụọ n’izu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: Ana m ebu ọnụ
  rationale: Ngwaa dị n’oge ugbu a na-akọ omume onye ahụ na-eme mgbe niile; “ibu ọnụ” bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu fasting.
- source_word: δὶς
  choice: ugboro abụọ
  rationale: Nke a na-enye kpọmkwem echiche adverb ahụ, ya bụ ime ihe ugboro abụọ.
- source_word: τοῦ σαββάτου
  choice: n’izu
  rationale: Ọ bụ akpaalaokwu Grik nke na-ezo aka n’otu okirikiri izu, ọ bụghị ikwu na a na-ebu ọnụ n’ụbọchị izu ike n’onwe ya.
- source_word: ἀποδεκατῶ
  choice: ana m enye otu ụzọ n’ụzọ iri
  rationale: Nke a kọwara kpọmkwem omume inye otu ụzọ n’ụzọ iri, ma doo onye Igbo nke oge a anya karịa iji okwu agbaziri agbaziri.
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ na-egosi ihe niile n’ozuzu ha n’enweghị nke a hapụrụ.
- source_word: ὅσα
  choice: nke ihe niile
  rationale: Nhazi a jikọtara okwu mmekọrịta ahụ n’ụzọ Igbo na-asụkarị, ka ọ kpachie ihe ndị a na-enye otu ụzọ n’ụzọ iri n’ime ha.
- source_word: κτῶμαι
  choice: m na-enweta
  rationale: Ngwaa a pụtara ihe mmadụ na-enwetara onwe ya ma ọ bụ na-akpata; “na-enweta” na-echekwa echiche ahụ n’asụsụ Igbo dị mfe ma ghara ime ya ka ọ bụrụ naanị ihe mmadụ nwere ugbu a.
theological_decisions:
- issue: Ihe τοῦ σαββάτου pụtara n’okwu banyere ugboro ole a na-ebu ọnụ
  choice: 'echiche oge nke akpaalaokwu ahụ: “n’izu”'
  alternative: nsụgharị nkịtị, “nke ụbọchị izu ike”
  rationale: N’ebe a, okwu ahụ na-egosi ugboro ole omume ahụ na-eme n’ime izu, ọ bụghị ozizi gbasara idebe ụbọchị izu ike. Nsụgharị “n’izu” na-egbochi nghọtahie na onye ahụ na-ebu ọnụ kpọmkwem n’ụbọchị izu ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ yiri ibe ha n’usoro iji chekwaa ụda nke nkwupụta onye na-ekwu okwu.
