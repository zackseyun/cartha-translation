  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: ig
  text: Onyenwe anyị wee sị, “Geenụ ntị n’ihe onye ikpe ahụ na-adịghị ezi omume na-ekwu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν
  choice: sị
  rationale: Oge aorist nke λέγω bụ okwu mmeghe n’akụkọ; “sị” bụ ụzọ Igbo nkịtị na nke doro anya isi webata okwu kpọmkwem.
- source_word: δὲ
  choice: wee
  rationale: δὲ na-aga n’ihu n’akụkọ. “Wee” na-egosi njikọ ahụ n’Igbo n’enweghị ịkọwa ya dị ka oge kpọmkwem.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: N’ebe a, κύριος na-ezo aka na Jizọs ma nwee ibu aha nsọ; “Onyenwe anyị” na-edobe nke ahụ karịa “nna ukwu.”
- source_word: Ἀκούσατε
  choice: Geenụ
  rationale: Aorist imperative a na-akpọ ndị na-ege ntị ka ha gee ntị nke ọma; “Geenụ” na-edobe iwu ahụ ma kwekọọ n’ọnụọgụ ọtụtụ.
- source_word: τί
  choice: ihe
  rationale: τί na-ewebata ọdịnaya nke okwu onye ikpe ahụ; “ihe ... na-ekwu” bụ Igbo ebumpụta ụwa.
- source_word: ὁ κριτὴς
  choice: onye ikpe ahụ
  rationale: “Onye ikpe” bụ aha ọrụ dabara adaba, ebe “ahụ” na-egosi na ọ bụ onye a kpọtụrụla aha n’ilu ahụ.
- source_word: τῆς ἀδικίας
  choice: na-adịghị eme ihe ziri ezi
  rationale: Genitive a bụ nke àgwà, n'ụzọ nkịtị “onye ikpe nke ajọ omume/ikpe na-ezighị ezi.” Nkebiokwu a na-egosi àgwà omume ya n’Igbo doro anya ma ghara ime ka ọ bụrụ naanị njehie iwu.
- source_word: λέγει
  choice: na-ekwu
  rationale: Present tense ahụ na-enye okwu ahụ ịdị ugbu a; “na-ekwu” na-edobe nke a n’Igbo.
theological_decisions:
- issue: Nsụgharị κύριος mgbe ọ na-ezo aka na Jizọs
  choice: Onyenwe anyị
  alternative: nna ukwu
  rationale: “Onyenwe anyị” na-edobe ibu aha a nwere n’akụkọ Luk na-enweghị itinye nkọwa ozizi ọzọ.
- issue: Àgwà onye ikpe ahụ na τῆς ἀδικίας
  choice: onye ikpe ahụ na-adịghị eme ihe ziri ezi
  alternative: onye ikpe na-ezighị ezi
  rationale: Nhọrọ bụ isi na-egosipụta àgwà omume sara mbara nke ἀδικία; nhọrọ ọzọ nwere ike ịdị ka ọ na-ekwu naanị na mkpebi ikpe ya ezighị ezi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “Geenụ” maka iwu e nyere ọtụtụ ndị, “onye ikpe ahụ” maka ntụaka azụ n’ilu ahụ, na nkebiokwu àgwà iji mee ka genitive τῆς ἀδικίας pụta ìhè n’enweghị ịgbakwunye ozizi.
