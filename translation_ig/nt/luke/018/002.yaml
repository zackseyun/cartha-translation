base_translation:
  language: en
  yaml_path: translation/nt/luke/018/002.yaml
  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: ig
  text: na-asị, “O nwere otu onye ọka ikpe n’otu obodo, onye na-adịghị atụ egwu Chineke, na-adịghịkwa asọpụrụ mmadụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle nke ugbu a nke jikọtara amaokwu a na nke bu ya ụzọ ma webata okwu ilu ahụ; ‘na-asị’ na-edobe njikọ ahụ n’ụzọ Igbo si ekwu ya.
- source_word: Κριτής τις
  choice: otu onye ọka ikpe
  rationale: τις na-egosi onye a kpọghị aha; ‘otu onye ọka ikpe’ bụ ụzọ doro anya ma bụrụ nke e ji akọ akụkọ n’Igbo.
- source_word: ἦν
  choice: O nwere
  rationale: N’ebe a, ἦν na-ewebata onye ọhụrụ n’akụkọ; ‘O nwere’ bụ usoro Igbo ebumpụta ụwa maka nke a.
- source_word: ἔν τινι πόλει
  choice: n’otu obodo
  rationale: τινι na-ahapụ obodo ahụ n’amaghị aha; ‘n’otu obodo’ na-edobe enweghị nkọwa a n’Igbo dị mfe.
- source_word: τὸν θεὸν
  choice: Chineke
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ebe Chineke nọ, ọ bụghị otu chi n’etiti chi dị iche iche.
- source_word: μὴ φοβούμενος
  choice: na-adịghị atụ egwu
  rationale: Participle a na-akọ àgwà onye ọka ikpe ahụ mgbe niile; ‘na-adịghị atụ egwu’ na-edobe echiche egwu na nsọpụrụ dị n’okwu Grik.
- source_word: ἄνθρωπον
  choice: mmadụ
  rationale: ἄνθρωπον bụ otu aha e ji anọchi anya mmadụ n’ozuzu ya ma mee ka ọ dị iche na Chineke; ‘mmadụ’ na-edobe otu aha ahụ n’Igbo ma ghara ime ka ọ bụrụ naanị nwoke.
- source_word: μὴ ἐντρεπόμενος
  choice: na-anaghị asọpụrụ
  rationale: N’ọnọdụ a, ἐντρέπομαι pụtara igosi mmadụ nsọpụrụ ma ọ bụ ilebara ya anya; ‘na-anaghị asọpụrụ’ dabara na ntụnyere ya na ịtụ egwu Chineke.
theological_decisions:
- issue: Otu aha ἄνθρωπον e ji anọchi anya mmadụ n’ozuzu ya, nke e mere ka ọ dị iche na Chineke
  choice: mmadụ
  alternative: onye ọ bụla / ndị mmadụ
  rationale: ‘Mmadụ’ bụ otu aha n’Igbo nke nwere ike ịgụnye mmadụ niile, ya mere ọ na-edobe ọdịdị otu aha nke Grik na ntụnyere ‘Chineke—mmadụ’ n’enweghị ịkọwa ya dị ka nwoke naanị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. E ji usoro akụkọ ‘O nwere otu…’ mee ka amaokwu ahụ bụrụ nke nkịtị n’ọnụ onye Igbo, ebe ‘Chineke—mmadụ’ na-echekwa ntụnyere dị n’isi mmalite.
