translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka usoro ịdị adị na omume a na-eme ugboro ugboro daa nke ọma n’Igbo.
