  to: N’obodo ahụ, e nwekwara otu nwanyị di ya nwụrụ. Ọ na-abịakwute ya ugboro ugboro, na-asị, “Kpeere m ikpe ziri ezi megide onye na-emegide m.”[a]
  rationale: The revision retains the repeated action, the legal setting, and the source’s concise plea, while removing an Igbo role ambiguity introduced by “n’aka.” The footnote remains anchored to the plea and explains that the verb concerns legal redress or vindication rather than necessarily personal retaliation.
