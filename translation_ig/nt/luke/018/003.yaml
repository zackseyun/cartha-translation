  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: ig
  text: N’obodo ahụ, e nwekwara otu nwanyị di ya nwụrụ. Ọ na-abịakwute ya ugboro ugboro, na-asị, “Kpeere m ikpe ziri ezi megide onye na-emegide m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Gosi na m ziri ezi megide onye na-emegide m,” ma ọ bụ, “Nye m ikpe ziri ezi megide onye mụ na ya na-ese okwu.” Ngwaa Grik a nwere ike ịpụta inye mmadụ ikpe ziri ezi ma ọ bụ igosi na ọ ziri ezi n’ikpe; ọ pụtaghị ịbọ ọbọ nke onwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: nwanyị di ya nwụrụ
  rationale: Nke a bụ ụzọ doro anya, kwesị ekwesị, ndị Igbo nke oge a na-ejikarị ekwu banyere nwanyị di ya nwụrụ.
- source_word: δὲ
  choice: kwara
  rationale: Ọ na-ejikọta akụkọ a na ihe bu ya ụzọ n’enweghị ịmanye echiche nke mmegide na-adịghị mkpa.
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: N’obodo ahụ, e nwekwara
  rationale: Usoro a na-egosipụta ịdị adị nke nwanyị ahụ n’obodo ahụ n’Igbo dị ire ma debe njikọ akụkọ ahụ.
- source_word: ἤρχετο πρὸς αὐτόν
  choice: Ọ na-abịakwute ya ugboro ugboro
  rationale: Imperfect ἤρχετο na-egosi omume a na-emegharị emegharị; ‘ugboro ugboro’ na-eme ka nnọgidesi ike ya pụta ìhè.
- source_word: λέγουσα
  choice: na-asị
  rationale: Ọ na-egosi okwu nwanyị ahụ na-ekwu mgbe ọ na-abịakwute onye ikpe ahụ.
- source_word: Ἐκδίκησόν με
  choice: Mee ka m nweta ikpe ziri ezi
  rationale: N’ọnọdụ ikpe a, ngwaa ahụ na-arịọ ka e nye ya ikpe ziri ezi ma ọ bụ kwado na ihe o kwuru ziri ezi, ọ bụghị ka a bọọrọ ya ọbọ.
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: n’aka onye na-emegide m
  rationale: ἀντίδικος bụ onye ọzọ na ya nọ n’esemokwu iwu; okwu a na-anọgide nghọta ma ghara ịkpọ onye ahụ ‘onye iro’ n’ụzọ sara mbara karịa ihe Grik kwuru.
