review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the widow, the city setting, and the imperfect sense of her repeated approaches. However, “n’aka onye na-emegide m” can naturally identify the adversary as the party from whom she would receive justice, whereas the Greek legal plea seeks redress/vindication in the case against that adversary.
  naturalness: The narrative is clear and natural Standard Igbo. “Kpeere m ikpe ziri ezi megide ...” is a more direct and idiomatic legal plea than the causative wording “Mee ka m nweta ... n’aka ...”.
  terminology: “Nwanyị di ya nwụrụ,” “onye na-emegide m,” and “ikpe ziri ezi” appropriately retain the social and legal senses of χήρα, ἀντίδικος, and ἐκδίκησόν με. The note preserves the judicial/vindicatory range without importing retaliatory revenge.
  issues:
  - severity: medium
    issue: The phrase “Mee ka m nweta ikpe ziri ezi n’aka onye na-emegide m” leaves the adversary’s role ambiguous.
    rationale: In idiomatic Igbo, nweta ... n’aka mmadụ commonly means receiving something from that person. This can obscure that the judge is being asked to act against the legal opponent. Recasting the request as a judicial plea with “megide” makes the relationship explicit.
  revised_text: N’obodo ahụ, e nwekwara otu nwanyị di ya nwụrụ. Ọ na-abịakwute ya ugboro ugboro, na-asị, “Kpeere m ikpe ziri ezi megide onye na-emegide m.”[a]
