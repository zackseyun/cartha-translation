  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: ig
  text: Ma ọ sịrị, “Ihe ndị mmadụ na-apụghị ime, Chineke pụrụ ime ha.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδύνατα
  choice: ihe ndị mmadụ na-apụghị ime
  rationale: Nkọwa a na-egosipụta adjective neuter plural e ji dị ka aha, ma mee ka okwu ahụ bụrụ Igbo nkịtị ma doo anya; njikọ ya na ‘ndị mmadụ’ na-egosipụta ebe enweghị ike ahụ dị.
- source_word: παρὰ ἀνθρώποις
  choice: ndị mmadụ na-apụghị ime
  rationale: παρά ya na dative na-egosi ọnọdụ ma ọ bụ akụkụ mmadụ. N’Igbo, ịsị ‘ndị mmadụ na-apụghị ime’ na-enye otu echiche ahụ n'ụzọ e ji asụ asụsụ ugbu a.
- source_word: δυνατὰ
  choice: pụrụ ime
  rationale: Nke a bụ okwu na-emegide ἀδύνατα. ‘Pụrụ ime’ na-egosipụta na ihe ahụ ga-ekwe omume ma na-ada nke ọma n’Igbo.
- source_word: παρὰ τῷ θεῷ
  choice: Chineke pụrụ ime ha
  rationale: παρά ya na dative na-egosi ihe ga-ekwe omume n’akụkụ Chineke. Usoro a bụ Igbo ebumpụta ụwa ma chekwaa ọdịiche dị n’etiti enweghị ike mmadụ na ike Chineke.
- source_word: ὁ δὲ εἶπεν
  choice: Ma ọ sịrị
  rationale: δέ nwere ike igosi ntakịrị mmegide ma ọ bụ ngafe n’akụkọ. ‘Ma ọ sịrị’ dabara na nzaghachi Jizọs nye okwu bu ya ụzọ.
theological_decisions:
- issue: Oke ihe Chineke pụrụ ime
  choice: Amaokwu a na-ekwu na Chineke pụrụ ime ihe ndị mmadụ na-apụghị ime, n’ọnọdụ mkparịta ụka banyere nzọpụta.
  alternative: Ịghọta ya dị ka nkwupụta nkà ihe ọmụma gbasara ihe ọ bụla a pụrụ iche n’echiche.
  rationale: Asụsụ Grik na-eme ka enweghị ike mmadụ dị iche na ike Chineke, karịsịa n’ọnọdụ onye bara ọgaranya ịbanye n’alaeze Chineke. Nsụgharị ahụ anaghị etinye nkọwa nkà ihe ọmụma nke gafere ihe ederede kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu ebumpụta ụwa kama ịsụgharị παρά + dative n’ụzọ siri ike dịka ‘n’ebe ndị mmadụ nọ’ na ‘n’ebe Chineke nọ.’
