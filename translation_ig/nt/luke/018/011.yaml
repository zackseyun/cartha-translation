id: LUK.18.11
reference: Luke 18:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: ig
  text: 'Onye Farisii ahụ[a] guzoro iche, na-ekpe ekpere ihe ndị a: ‘Chineke, ana m ekele gị na anaghị m adị ka ndị mmadụ ndị ọzọ—ndị na-anapụ mmadụ ihe n’ike, ndị ajọ omume, ndị na-akwa iko—ma ọ bụdị ka onye na-atụ ụtụ a.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘Onye Farisii ahụ guzoro, na-ekpegara onwe ya ekpere ihe ndị a.’ Nkebiokwu Grik πρὸς ἑαυτόν nwere ike ịpụta na o guzoro iche, ma ọ bụ na ọ na-ekpegara onwe ya ekpere. Ụfọdụ na-ahụ nghọta nke abụọ a dịka ekpere na-agbasi ike n’onwe ya karịa n’ebe Chineke nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: guzoro
  rationale: Okwu a na-egosi ọnọdụ ya mgbe ọ na-ekpe ekpere; ‘guzoro’ bụ Igbo doro anya ma dịkwa n’usoro akụkọ.
- source_word: πρὸς ἑαυτὸν
  choice: iche
  rationale: ‘Guzoro iche’ na-enye nghọta gbasara ebe ọ nọ n’enweghị imechi ụzọ nghọta ọzọ na ekpere ahụ pụrụ ịbụ nke ọ na-agwa onwe ya; e debere nghọta ọzọ ahụ n’okpuru peeji.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Nke a na-ezo kpọmkwem n’ihe dị n’ekpere sochirinụ ma na-edobe ọtụtụ nke okwu Grik ahụ.
- source_word: προσηύχετο
  choice: na-ekpe ekpere
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu n’akụkọ ahụ; ‘na-ekpe ekpere’ na-egosipụta nke a n’Igbo.
- source_word: εὐχαριστῶ σοι
  choice: ana m ekele gị
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke a na-ejikarị asụ ‘I thank you.’
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: ka mmadụ ndị ọzọ
  rationale: Nke a na-egosi na ọ na-ekewa onwe ya n’ebe ndị mmadụ ndị ọzọ nọ, n’asụsụ Igbo nkịtị ma ghara ime ka okwu ahụ bụrụ naanị maka ndị nwoke.
- source_word: ἅρπαγες
  choice: ndị na-anapụ mmadụ ihe n’ike
  rationale: Nkebiokwu a na-ekpuchi echiche nke iji anyaukwu ma ọ bụ ike were ihe mmadụ, nke nwere ike ịgụnye ịpụnara mmadụ ihe na mmegbu.
- source_word: ἄδικοι
  choice: ndị ajọ omume
  rationale: Nke a na-egosipụta akụkụ omume na okpukpe nke ἄδικοι karịa okwu ga-apụta naanị ikpe na-ezighị ezi.
- source_word: μοιχοί
  choice: ndị na-akwa iko
  rationale: Nke a bụ okwu Igbo doro anya maka ndị na-eme ịkwa iko di ma ọ bụ nwunye.
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: ma ọ bụdị ka onye ọna ụtụ a
  rationale: ‘Ọ bụdị’ na-egosi ịdị elu nke nlelị dị na ἢ καί, ebe ‘onye ọna ụtụ’ bụ aha Igbo a na-aghọta nke ọma maka τελώνης.
theological_decisions:
- issue: Ihe πρὸς ἑαυτόν pụtara n’ekpere Onye Farisii ahụ
  choice: 'E tinyere nghọta gbasara ebe ọ nọ n’ahịrị isi: ‘guzoro iche.’'
  alternative: ‘Mgbe o guzoro, ọ na-ekpegara onwe ya ekpere ihe ndị a.’
  rationale: Nkebiokwu Grik ahụ nwere ike ịpụta na o guzoro iche, ma ọ bụ na ekpere ya bụ nke ọ na-agwa onwe ya n’ụzọ nwere ntakịrị ịkwa emo. Ahịrị isi anaghị amanye nghọta nke abụọ, ma nkọwa ala peeji na-echekwa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere nhazi ekpere ahụ na ndepụta omume ọjọọ ya, ma chekwaa mgbagwoju anya dị na πρὸς ἑαυτόν site na akara [a] na nkọwa ala peeji.
