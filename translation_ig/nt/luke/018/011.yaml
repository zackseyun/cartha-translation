- from: 'Onye Farisii ahụ[a] guzoro iche, na-ekpe ekpere ihe ndị a: ‘Chineke, ana m ekele gị na adịghị m ka mmadụ ndị ọzọ—ndị na-anapụ mmadụ ihe n’ike, ndị ajọ omume, ndị na-akwa iko—ma ọ bụdị ka onye ọna ụtụ a.’'
  to: 'Onye Farisii ahụ[a] guzoro iche, na-ekpe ekpere ihe ndị a: ‘Chineke, ana m ekele gị na anaghị m adị ka ndị mmadụ ndị ọzọ—ndị na-anapụ mmadụ ihe n’ike, ndị ajọ omume, ndị na-akwa iko—ma ọ bụdị ka onye na-atụ ụtụ a.’'
  rationale: The revision retains the source’s grammatical and semantic ambiguity while improving Standard Igbo idiom. It makes the ‘rest of the people’ contrast explicit, uses a clearer term for the tax collector, and reframes the footnote so that its ironic implication remains a possible interpretation rather than an imposed reading.
