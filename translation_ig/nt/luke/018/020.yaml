  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: ig
  text: 'Ị maara iwu ndị ahụ: Akwala iko,[a] Egbula mmadụ, Ezulala ohi, Agbala akaebe ụgha, Sọpụrụ nna gị na nne gị.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụdị ọdịnala karị: “I gaghị akwa iko ... I gaghị egbu mmadụ ... I gaghị ezu ohi ... I gaghị agba akaebe ụgha.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: iwu ndị ahụ
  rationale: N'ebe a, ἐντολή na-ezo aka n'iwu ndị a maara nke ọma n'Iwu Iri ahụ; “iwu ndị ahụ” na-egosi na ọ bụ iwu a kpọtụrụ aha ma na-edobe ụda iwu nke okwu Grik.
- source_word: οἶδας
  choice: Ị maara
  rationale: Ọ bụ ezie na οἶδα dị n'ụdị perfect, ọ na-enwe nghọta nke oge ugbu a na Grik Koine; “Ị maara” bụ Igbo nkịtị ma doo anya.
- source_word: Μὴ μοιχεύσῃς
  choice: Akwala iko
  rationale: Nke a bụ ụzọ Igbo doro anya na nke e ji asụ iwu megide ịkwa iko; ọ na-edobe kpọmkwem ọdịnaya omume nke μοιχεύω.
- source_word: Μὴ φονεύσῃς
  choice: egbula mmadụ
  rationale: φονεύω na-ezo aka n'igbu mmadụ n'ụzọ mmehie, ọ bụghị n'ụdị igbu ihe niile; itinye “mmadụ” na-eme ka nke ahụ doo anya n'Igbo.
- source_word: Μὴ κλέψῃς
  choice: ezula ohi
  rationale: “Izu ohi” bụ okwu Igbo nkịtị kwekọrọ kpọmkwem na κλέπτω.
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: agbaala akaebe ụgha
  rationale: Nkebi a na-edobe ihe oyiyi na ụda iwu nke ψευδομαρτυρέω, ya bụ ịgba akaebe na-abụghị eziokwu, ma na-echekwa njikọ ya na Iwu Iri ahụ.
- source_word: Τίμα
  choice: sọpụrụ
  rationale: “Sọpụrụ” na-egosi nsọpụrụ omume na nke mmekọrịta ezinụlọ τιμάω chọrọ n'ebe a, ọ bụghị naanị inwe mmetụta nkwanye ùgwù.
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: nna gị na nne gị
  rationale: Nke a kpọrọ nne na nna abụọ aha kpọmkwem ma jiri usoro okwu Igbo ebumpụta ụwa.
theological_decisions:
- issue: Ụdị e ji kwuo mmachibido iwu nke Iwu Iri ahụ
  choice: 'Jiri ụdị iwu Igbo nke oge a: “Akwala ... egbula ... ezula ... agbaala ...”'
  alternative: Jiri ụdị ọdịnala nke pụtara “I gaghị ...”
  rationale: Okwu Grik ji prohibitive aorist subjunctive mee ihe. Ụdị iwu ndị a na Igbo na-enye mmachibido ahụ n'ụzọ doro anya ma dị ugbu a, na-agbanweghị ọdịnaya ma ọ bụ ike nke iwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji usoro mmachibido iwu “-la” mee ka iwu ndị a daa n'ụzọ ebumpụta ụwa n'Igbo, ma e debere ụda na njikọ ha na Iwu Iri ahụ.
