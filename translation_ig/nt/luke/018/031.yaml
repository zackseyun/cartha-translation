  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: ig
  text: Mgbe ahụ, ọ kpọọrọ mmadụ iri na abụọ ahụ iche, sị ha, “Lee, anyị na-arịgo Jerusalem, a ga-emezu ihe niile e dere site n’aka ndị amụma banyere Nwa nke Mmadụ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe niile ndị amụma dere maka Nwa nke Mmadụ.” Usoro okwu Grik ahụ nwekwara ike ịpụta n’ụzọ nkịtị karị, “nye Nwa nke Mmadụ,” ma o yikarịrị ka ebe a ọ na-ekwu banyere ihe ndị amụma dere gbasara ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: ọ kpọọrọ ... iche
  rationale: Nke a na-egosi na Jizọs kpọọrọ mmadụ iri na abụọ ahụ ka ọ gwa ha okwu iche. Ọ na-eburu echiche dị n’ọnọdụ akụkọ ahụ n’enweghị iji okwu siri ike.
- source_word: τοὺς δώδεκα
  choice: mmadụ iri na abụọ ahụ
  rationale: Asụsụ Grik kwuru naanị ‘iri na abụọ ahụ’; nsụgharị a anaghị atụkwasị ‘ndị na-eso ụzọ’ ma ọ bụ ‘ndị ozi,’ nke na-agaghị adị kpọmkwem n’ederede a.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ ụzọ Igbo dị ndụ ma dị nsọ e si adọta uche onye na-ege ntị, n’enweghị ụda ochie gabiga ókè.
- source_word: ἀναβαίνομεν
  choice: anyị na-arịgo
  rationale: Ọ na-echekwa ma mmegharị a na-eme ugbu a ma echiche nke ịrịgoro Jerusalem.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ a na-ejikarị eme ihe n’Igbo oge a.
- source_word: τελεσθήσεται
  choice: a ga-emezukwa
  rationale: Ọdịdị ngwaa ọdịnihu a na-egosi na ihe e dere ga-eru mmezu ya. ‘Ga-emezu’ dabara nke ọma n’okwu banyere mmezu amụma.
- source_word: πάντα τὰ γεγραμμένα
  choice: ihe niile e dere
  rationale: Ọ na-echekwa echiche nke ihe niile n’ozuzu ya na nke ihe ahụ ka dị n’akwụkwọ.
- source_word: διὰ τῶν προφητῶν
  choice: site n’ọnụ ndị amụma
  rationale: Nke a bụ akpaalaokwu Igbo doro anya nke na-egosi na ozi ahụ bịara site n’aka ndị amụma, ma ọ naghị ekwu na ha bụ isi mmalite ikpeazụ nke ozi ahụ.
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: banyere Nwa nke Mmadụ
  rationale: ‘Banyere’ na-egosi na ihe ndị amụma dere metụtara ya. A ka debere aha nsọpụrụ ahụ n’ụdị ya iji chekwaa njikọ ya na akụkụ Akwụkwọ Nsọ ndị ọzọ.
theological_decisions:
- issue: Nsụgharị aha ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: ‘Nwa nke Mmadụ’ na-echekwa ọdịdị aha ahụ na njikọ ya nwere ike inwe na Daniel, kama ịgbanwe ya ka ọ bụrụ naanị okwu izugbe banyere mmadụ.
- issue: Ihe dative τῷ υἱῷ τοῦ ἀνθρώπου pụtara
  choice: banyere Nwa nke Mmadụ
  alternative: maka Nwa nke Mmadụ / nye Nwa nke Mmadụ
  rationale: N’usoro ahịrịokwu a, o yikarịrị ka ọ na-egosi onye ihe e dere metụtara. Ma ebe usoro Grik ahụ nwekwara ike ibu echiche ‘maka’ ma ọ bụ ‘nye,’ e debere nke ahụ n’ala ala peeji kama ikpochapụ mgbagwoju anya ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu, dee ya. ‘Lee’ na ‘site n’ọnụ ndị amụma’ na-echekwa ụda Akwụkwọ Nsọ n’enweghị ime ka asụsụ bụrụ nke ochie ma ọ bụ nke otu ụka pụrụ iche.
