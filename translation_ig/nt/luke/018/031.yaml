revisions:
- from: Mgbe ahụ, ọ kpọọrọ mmadụ iri na abụọ ahụ iche, sị ha, “Lee, anyị na-arịgo Jerusalem, a ga-emezukwa ihe niile e dere site n’ọnụ ndị amụma banyere Nwa nke Mmadụ.[a]”
  to: Mgbe ahụ, ọ kpọọrọ mmadụ iri na abụọ ahụ iche, sị ha, “Lee, anyị na-arịgo Jerusalem, a ga-emezu ihe niile e dere site n’aka ndị amụma banyere Nwa nke Mmadụ.[a]”
  rationale: The revision removes the unsupported additive force in “-kwa” and aligns the prophetic phrase more closely with the source’s written-through-the-prophets construction. It retains the draft’s accurate handling of the Son of Man title and preserves the disputed dative nuance in the footnote.
  reviewer_model: gpt-5.6-terra
