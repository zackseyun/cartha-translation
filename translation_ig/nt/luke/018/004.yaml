base_translation:
  language: en
  yaml_path: translation/nt/luke/018/004.yaml
  text: And for a time he was unwilling[a], but afterward he said to himself, ‘Even though I do not fear God nor respect anyone,
translation:
  language: ig
  text: Ruo oge ụfọdụ, ọ chọghị ime ya. Ma mgbe e mesịrị, ọ sịrị onwe ya, “Ọ bụ ezie na anaghị m atụ egwu Chineke, anaghịkwa m asọpụrụ mmadụ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “anaghịkwa m asọpụrụ onye ọ bụla.” N’asụsụ Grik, e ji okwu dị n’ọnụọgụ otu maka “mmadụ” mee ihe n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελεν
  choice: ọ chọghị ime ya
  rationale: Okwu a na-egosi na ọ chọghị ime ihe ahụ ruo oge ụfọdụ. ‘Ime ya’ na-eme ka Igbo bụrụ nke eke, ebe ‘ya’ na-ezo aka n’ihe a rịọrọ ya n’akụkọ ahụ, n’agbanyeghị na Grik ekwughị ihe a ga-eme kpọmkwem n’amaokwu a.
- source_word: ἐπὶ χρόνον
  choice: ruo oge ụfọdụ
  rationale: Nke a na-egosi oge na-adịru nwa oge n’akọwaghị ogologo ya kpọmkwem.
- source_word: μετὰ ταῦτα δὲ
  choice: Ma mgbe e mesịrị
  rationale: Ọ na-egosi ma mgbanwe n’omume ya ma ihe mere n’oge sochirinụ.
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: ọ sịrị onwe ya
  rationale: Nke a na-echekwa echiche nke okwu mmadụ kwuru n’ime onwe ya, ma bụrụkwa Igbo dị mfe nghọta.
- source_word: Εἰ καὶ
  choice: Ọ bụ ezie na
  rationale: N’ebe a, nkebiokwu ahụ na-egosi nkwenye megidere ihe ga-esochi, ọ bụghị ọnọdụ a na-ejighị n’aka.
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: anaghị m atụ egwu Chineke
  rationale: Nke a na-echekwa okwu doro anya nke Grik na usoro okwu Akwụkwọ Nsọ banyere ịtụ egwu Chineke, n’edoziwaghị ya naanị ka ọ bụrụ nsọpụrụ.
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: anaghịkwa m asọpụrụ mmadụ
  rationale: ‘Asọpụrụ’ na-egosipụta enweghị nkwanye ùgwù ma ọ bụ ilebara mmadụ anya. ‘Mmadụ’ na-echekwa aha dị n’ọnụọgụ otu nke e ji mee ihe n’ozuzu na Grik.
theological_decisions:
- issue: ἄνθρωπον dị n’ọnụọgụ otu ma e ji ya mee ihe n’ozuzu
  choice: mmadụ
  alternative: onye ọ bụla
  rationale: ‘Mmadụ’ bụ okwu Igbo eke nke nwere ike ịpụta otu mmadụ ma ọ bụ mmadụ n’ozuzu. Ọ na-echekwa ọdịdị okwu Grik n’ebugharịghị ihe ọ pụtara gaa n’otu nwoke kpọmkwem.
- issue: φοβοῦμαι n’ihe gbasara Chineke
  choice: atụ egwu Chineke
  alternative: asọpụrụ Chineke nke ukwuu
  rationale: ‘Ịtụ egwu Chineke’ na-echekwa ma ụjọ ma nkwanye ugwu nwere ike ịdị n’okwu Grik, kama idozi ihe ọ pụtara naanị n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa olu ikpe nke onye ọkaikpe na-ekwu n’onwe ya. E tinyere ‘ime ya’ iji mee ka ahịrịokwu ahụ bụrụ Igbo eke; ọ naghị akọwapụta ihe ọhụrụ karịa omume a rịọrọ ya nke dị na gburugburu amaokwu ahụ.
