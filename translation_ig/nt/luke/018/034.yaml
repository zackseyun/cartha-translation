id: LUK.18.34
reference: Luke 18:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: ig
  text: Ma ha aghọtaghị ihe ndị a niile ma ọlị; e zoro ha okwu a ezo,[a] ha amaghịkwa ihe ndị a na-ekwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụdị passive dị n’asụsụ Grik anaghị ekwu onye ma ọ bụ ihe zoro okwu a.
    reason: alternative_reading
lexical_decisions:
- source_word: συνῆκαν
  choice: aghọtaghị
  rationale: Ngwaa a na-egosi na ha aghọtaghị ihe Jizọs kwuru n’uche; ‘aghọtaghị’ bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: οὐδὲν τούτων
  choice: ihe ndị a niile ... ma ọlị
  rationale: Nke a na-ezo aka n’ihe dị iche iche e kwuru tupu amaokwu a ma na-ekwusi ike na ọ dịghị nke ha ghọtara.
- source_word: τὸ ῥῆμα τοῦτο
  choice: okwu a
  rationale: ‘Okwu a’ nwere ike ịpụta okwu e kwuru ma ọ bụ ozi dị n’ime ya, ya mere ọ na-edobe obosara ihe ῥῆμα nwere ike ịpụta.
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: zoro ha ezo
  rationale: Nke a na-egosi ọnọdụ nke izochiri ha ihe ahụ, ma ọ naghị akpọ onye ma ọ bụ ihe mere ka o zoo ha ezo.
- source_word: ἐγίνωσκον
  choice: amaghịkwa
  rationale: ‘Amaghị’ na-edobe ọdịiche okwu dị n’etiti γινώσκω na συνίημι nke e sụgharịrị ‘aghọtaghị,’ n’agbanyeghị na ebe a ọ pụtara na ha amataghị ihe okwu ahụ pụtara.
- source_word: τὰ λεγόμενα
  choice: ihe ndị a na-ekwu
  rationale: Nke a na-edobe ntụgharị okwu dị ugbu a nke participle ahụ ma na-ada ka Igbo nkịtị.
theological_decisions:
- issue: Ihe kpatara ndị na-eso ụzọ ji ghara ịghọta
  choice: Edobere ụzọ okwu nke na-ekwughị onye ma ọ bụ ihe zoro okwu ahụ n’ebe ha nọ.
  alternative: Ịsị kpọmkwem na Chineke zoro ya, ma ọ bụ na ọ bụ naanị mgbagwoju anya dị n’uche ha.
  rationale: Ụdị passive Grik ahụ akpọghị onye mere ya; ịhapụ onye mere ya n’ekwughị okwu na-echekwa nghọtahie na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro atọ nke amaokwu ahụ ji kọwaa enweghị nghọta, tinyere ọdịiche dị n’etiti ‘aghọtaghị’ na ‘amaghị.’
