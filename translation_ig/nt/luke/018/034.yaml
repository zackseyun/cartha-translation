review_pass:
  verdict: revise
  source_fidelity: The threefold portrayal of the disciples’ incomprehension is retained, as are the distinct senses of συνῆκαν ('aghọtaghị') and ἐγίνωσκον ('amaghị'). However, 'okwu a zoro ha ezo' grammatically makes 'okwu a' the subject of 'zoro' and can suggest that the saying hid them, rather than that it was hidden from them. The Greek is a perfect passive and requires an unambiguously passive/agent-unspecified Igbo construction.
  naturalness: The revision uses the natural impersonal passive construction 'e zoro ha okwu a ezo.' It is clear, idiomatic Standard Igbo, and leaves the concealing agent unstated.
  terminology: '''Okwu a'' appropriately renders τὸ ῥῆμα τοῦτο in this context. ''Ihe ndị a na-ekwu'' naturally preserves the ongoing/passive sense of τὰ λεγόμενα. The footnote is revised because the former alternative is now the main text.'
  issues:
  - severity: medium
    issue: The clause 'okwu a zoro ha ezo' does not clearly express the Greek passive.
    rationale: In Igbo syntax, this wording assigns 'okwu a' as the subject of 'zoro'; it does not reliably mean 'this saying was hidden from them.' 'E zoro ha okwu a ezo' clearly conveys concealment from them while not identifying an agent.
  revised_text: Ma ha aghọtaghị ihe ndị a niile ma ọlị; e zoro ha okwu a ezo,[a] ha amaghịkwa ihe ndị a na-ekwu.
