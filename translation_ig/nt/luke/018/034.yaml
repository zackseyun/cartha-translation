  rationale: The sole revision corrects the passive sense of κεκρυμμένον ἀπ’ αὐτῶν. The impersonal 'e zoro' preserves the source’s unstated agent and does not resolve the theological ambiguity. The footnote now explains that feature rather than offering the revised main-text wording as an alternative.
