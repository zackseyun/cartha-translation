  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: ig
  text: Ọ sịkwara onye a, ‘Gị kwa, bụrụ onye na-achị obodo ise.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘nwee ikike n’elu obodo ise,’ ma ọ bụ ‘ka e tinye gị n’ọrụ ịchị obodo ise.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ καὶ τούτῳ
  choice: Ọ gwakwara onye nke a
  rationale: Nke a na-egosi njikọ dị nro n’akụkọ ahụ, ma chekwaa τούτῳ dị ka ngosipụta ‘onye nke a’ na καί dị ka ‘-kwara.’
- source_word: Καὶ σὺ
  choice: Gị onwe gị kwa
  rationale: Nkwupụta a na-emesi onye a na-agwa okwu ike ma na-egosi na o sokwa onye e kwuru okwu ya na mbụ.
- source_word: ἐπάνω γίνου
  choice: na-achị
  rationale: N’iwu a, γίνου na ἐπάνω na-egosi itinye mmadụ n’ọkwá nke inwe ikike n’elu ihe; ‘na-achị’ bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi kwuo ya.
- source_word: πέντε πόλεων
  choice: obodo ise
  rationale: πόλις pụtara obodo ma ọ bụ obodo ukwu; ‘obodo’ bụ okwu Igbo nkịtị nke na-anaghị amanye oke obodo a na-ekwu.
