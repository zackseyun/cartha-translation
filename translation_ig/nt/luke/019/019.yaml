translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. E jiri ‘na-achị’ mee ka echiche nke ọkwá na ikike doo anya n’enweghị ịgbakwụnye nkọwa okpukpe pụrụ iche.
