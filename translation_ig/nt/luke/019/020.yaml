  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: ig
  text: Onye nke ọzọ bịara, sị, “Onyenwe m, lee, mina gị a, nke m na-edobe n’ime akwa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ákwà aka.” Okwu Grik bụ σουδάριον, ya bụ obere ákwà a na-ejikarị ehicha ihu ma ọ bụ ọsụsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: onye nke ọzọ
  rationale: Nke a na-egosi onye ọzọ fọdụrụ n’etiti ndị ohu ahụ, ma na-edobe ọdịiche dị n’etiti ya na ndị bịara na mbụ.
- source_word: ἦλθεν λέγων
  choice: bịara sị
  rationale: Nke a bụ ụzọ Igbo si ekwu ya nke ọma, na-egosikwa ma ọbịbịa ya ma mmalite okwu ya n’usoro akụkọ ahụ.
- source_word: Κύριε
  choice: Onyenwe m
  rationale: Ọ bụ okwu nkwanye ùgwù onye ohu ji akpọ onye nwe ya n’ilu ahụ; ọ na-edobekwa ohere maka ụda sara mbara nke κύριος n’akụkọ ahụ.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ okwu Igbo doro anya e ji adọta uche mmadụ n’ihe a na-egosi ya.
- source_word: ἡ μνᾶ σου
  choice: mina gị
  rationale: “Mina” na-edobe aha ego ochie ahụ n’enweghị iji ego nke oge a dochie ya n’ụzọ nwere ike iduhie onye na-agụ.
- source_word: ἣν εἶχον ἀποκειμένην
  choice: nke m debere
  rationale: “M debere” na-egosi na o tinyere ego ahụ iche ma nọgide na-echekwa ya, dịka njikọ εἶχον na ἀποκειμένην si egosi.
- source_word: ἐν σουδαρίῳ
  choice: n’ime akwa
  rationale: “Akwa” na-enye ihe okwu Grik ahụ pụtara n’ozuzu ya n’enweghị ịkọwa ya kpọmkwem karịa ihe ederede kwuru; nkọwa ala peeji na-egosi ụdị akwa a na-ejikarị eme ihe.
theological_decisions:
- issue: Nsụgharị κύριος mgbe onye ohu na-agwa onye nwe ya okwu n’ilu
  choice: Onyenwe m
  alternative: Nna m ukwu
  rationale: N’ọnọdụ a, okwu ahụ bụ aha nkwanye ùgwù nye onye nwe ohu ahụ. “Onyenwe m” dabara n’Igbo ma na-ahapụkwa nghọta sara mbara nke okwu ahụ n’enweghị ịmanye nkọwa ozizi ọ bụla.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu dee ya. E debere “mina” dịka aha ego oge ochie, ma tinyekwa nkọwa maka ụdị akwa ahụ n’ala peeji.
