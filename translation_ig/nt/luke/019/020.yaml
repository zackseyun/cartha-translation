  to: Onye nke ọzọ bịara, sị, “Onyenwe m, lee, mina gị a, nke m na-edobe n’ime akwa[a].”
  rationale: The revision preserves the Greek imperfect-periphrastic sense of ongoing storage, while retaining the draft’s faithful choices for the servant’s address, the ancient monetary unit, and the deliberately general term for the cloth. The footnote is lightly adjusted for idiomatic Standard Igbo and continues to preserve the lexical alternative.
