  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: ig
  text: Mgbe ahụ, onye nke mbụ bịara sị, “Onyenwe m,[a] mina gị wetaala mina iri ọzọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna m ukwu.” Okwu Grik bụ κύριε pụrụ ịbụ okwu nkwanye ùgwù e ji akpọ onye ka mmadụ elu, ọ bụghị naanị “Onyenwe m.”
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο
  choice: bịara
  rationale: Ngwaa a pụtara ịbịa ma ọ bụ iru ebe; “bịara” dabara n’usoro akụkọ a nke ohu na-abịakwute onye nwe ya.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-eme ka akụkọ gaa n’ihu n’usoro oge; “Mgbe ahụ” na-egosi usoro ahụ nke ọma n’Igbo.
- source_word: ὁ πρῶτος
  choice: onye nke mbụ
  rationale: Nke a na-ezo aka n’onye mbụ bịara n’usoro ndị ohu ahụ.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo si ekwu nke ọma na onye ahụ bịara ma kwuo okwu n’otu oge ahụ.
- source_word: Κύριε
  choice: Onyenwe m
  rationale: Ọ bụ okwu nkwanye ùgwù e ji akpọ onye nwere ikike. “Onyenwe m” na-edobe echiche bụ́ “Lord,” ma nkọwa ala peeji na-egosi na “Nna m ukwu” kwekwara omume n’ilu a.
- source_word: ἡ μνᾶ σου
  choice: mina gị
  rationale: E debere aha ego oge ochie ahụ dị ka “mina,” ebe “gị” na-egosi na ego ahụ bụ nke onye nwe ohu ahụ.
- source_word: δέκα προσηργάσατο μνᾶς
  choice: eritala mina iri ọzọ
  rationale: προσεργάζομαι na-egosi uru e nwetara site n’ọrụ, tinyere echiche nke ihe a gbakwunyere. “Eritala mina iri ọzọ” na-eme ka o doo anya na mina mbụ ahụ wetara mina iri ọzọ.
theological_decisions:
- issue: Otú e si sụgharịa κύριος mgbe ohu na-agwa onye nwe ya okwu n’ilu
  choice: Onyenwe m
  alternative: Nna m ukwu
  rationale: N’ọnọdụ a, okwu ahụ pụrụ ịbụ naanị aha nkwanye ùgwù e ji akpọ onye ka mmadụ elu, ọ bụghị nkwupụta kpọmkwem banyere Kraịst. A họọrọ “Onyenwe m” iji debe okwu bụ “Lord,” ma e debere “Nna m ukwu” n’ala peeji dị ka ntụgharị dabara n’ọnọdụ ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E debere “mina” dị ka aha ego oge ahụ kama iji ego nke oge a dochie ya.
