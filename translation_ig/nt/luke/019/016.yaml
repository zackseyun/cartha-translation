- from: Mgbe ahụ, onye nke mbụ bịara sị, “Onyenwe m,[a] mina gị eritala mina iri ọzọ.”
  to: Mgbe ahụ, onye nke mbụ bịara sị, “Onyenwe m,[a] mina gị wetaala mina iri ọzọ.”
  rationale: The revision replaces an unclear profit expression with a natural Standard Igbo construction that preserves the source’s sense that the original mina yielded ten additional minas. The footnote is recast to state the alternative contextual sense of κύριε clearly, without imposing a theological reading.
