  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: ig
  text: N’ihi na egwu gị tụrụ m, n’ihi na ị bụ nwoke na-achọ nnọọ ihe[a]. Ị na-ewere ihe ị na-edobeghị[b], na-aghọtakwa ihe ị na-akụghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya dịka “nwoke siri ike” ma ọ bụ “nwoke na-adịghị ebere.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ kpọmkwem: “ị na-ewere ihe ị na-edobeghị.” A pụkwara ịsụgharị ya dịka “ị na-ewere ihe ị na-etinyeghị” ma ọ bụ, n’ụzọ na-akọwa ihe karịa, “ị na-anakọta ihe ị na-edebeghị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: m na-atụ gị egwu
  rationale: Ụdị imperfect na-egosi ọnọdụ egwu nke nọgidere n’oge gara aga; Igbo a na-aghọta ya nke ọma n’akụkọ ahụ.
- source_word: γάρ
  choice: n’ihi na
  rationale: Ọ na-ejikọta okwu a dịka ihe kpatara okwu bu ya ụzọ.
- source_word: αὐστηρὸς
  choice: aka ike
  rationale: Ọ na-egosi onye siri ike, na-achọ ihe n’ụzọ na-adịghị ebelata ebubo ohu ahụ.
- source_word: αἴρεις
  choice: ị na-ewere
  rationale: Ọ na-edobe nghọta sara mbara nke ‘iburu/iw取’ n’enweghị itinye nkọwa azụmahịa a na-ekwughị kpọmkwem.
- source_word: ὃ οὐκ ἔθηκας
  choice: ihe ị na-etinyeghị ala
  rationale: Ọ na-edobe ihe oyiyi kpọmkwem nke τίθημι, ‘itinye’ ma ọ bụ ‘idowe,’ kama ịkọwa ya kpọmkwem dịka itinye ego n’ụlọ akụ.
- source_word: θερίζεις
  choice: na-ewepụtakwa ihe ubi
  rationale: Nke a bụ okwu Igbo dị ndụ maka iwe ihe ubi ma na-edobe ihe oyiyi ọrụ ugbo.
- source_word: ὃ οὐκ ἔσπειρας
  choice: ihe ị na-akụghị
  rationale: ‘Ịkụ’ bụ ụzọ Igbo nkịtị si kwuo ịgha mkpụrụ, ma na-edobe njikọ ya na iwe ihe ubi.
- source_word: ἄνθρωπος
  choice: nwoke
  rationale: Ọ na-ezo aka n’otu nwoke a kapịrị ọnụ n’ilu ahụ, ọ bụghị mmadụ niile n’ozuzu.
theological_decisions:
- issue: Ma a ga-eme ka nkọwa ohu ahụ banyere nna ya ukwu dị nro iji chebe onyinyo onye ukwu ahụ
  choice: E debere ebubo ohu ahụ n’ike ya dịka ‘nwoke aka ike.’
  alternative: Ịsụgharị ya naanị dịka ‘nwoke siri ike’ ma ọ bụ ‘onye na-achọ nnọọ ihe.’
  rationale: Okwu a bụ nkọwa na ebubo ohu ahụ. Nsụgharị ekwesịghị ikpebi n’ime amaokwu a ma ebubo ahụ ọ bụ eziokwu zuru oke banyere nna ya ukwu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. E debere ntụnyere ọrụ ugbo na ebubo ohu ahụ, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa azụmahịa siri karịa ihe Grik kwuru.
