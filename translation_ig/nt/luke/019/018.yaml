  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: ig
  text: Onye nke abụọ bịakwara, sị, ‘Mina gị, onyenwe m, amụtala mina ise.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: onye nke abụọ
  rationale: Nke a na-egosi onye na-esote ohu mbụ n’usoro akụkọ ahụ.
- source_word: Ἡ μνᾶ σου
  choice: otu mina gị
  rationale: E debere ‘mina’ dị ka aha ego oge ahụ; ‘otu’ na-eme ka ọdịiche dị n’etiti mina mbụ ahụ na mina ise o mụtara doo anya n’Igbo.
- source_word: κύριε
  choice: Onyenwe m
  rationale: Ọ bụ okwu onye ohu ji nkwanye ùgwù kpọọ nna ya ukwu; n’ebe a ọ bụ ịkpọ onye a na-agwa okwu, ọ bụghị aha Chineke n’onwe ya.
- source_word: ἐποίησεν πέντε μνᾶς
  choice: amụtala mina ise
  rationale: N’ọnọdụ azụmahịa nke ilu ahụ, ngwaa ahụ pụtara na ego ahụ enwetala ma ọ bụ rụpụtala uru ruru mina ise.
theological_decisions:
- issue: Ihe ‘κύριε’ na-ezo aka na ya
  choice: Onyenwe m
  alternative: Nna m ukwu
  rationale: A họọrọ okwu nkwanye ùgwù dabara n’okwu ohu na-agwa onye nwe ya, na-enweghị ime ka ọ bụrụ nkwupụta doro anya banyere Chi Kraịst n’amaokwu a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma nwee ugwu. A hapụrụ ‘mina’ ka ọ bụrụ aha ego akụkọ ihe mere eme, kama ịgbanwe ya gaa n’ego nke oge a.
