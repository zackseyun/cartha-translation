id: LUK.19.34
reference: Luke 19:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: ig
  text: Ha wee sị[a], “Onyenwe anyị chọrọ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nna ukwu chọrọ ya,” ma ọ bụrụ na κύριος pụtara onye nwe ịnyịnya ibu nta ahụ kama ịbụ aha nsọpụrụ e ji akpọ Jizọs.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ha wee
  rationale: δέ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ; ‘wee’ na-eme ka usoro akụkọ ahụ bụrụ nke Igbo nkịtị, ebe ‘ha’ na-anọchi ndị ahụ e kwuru okwu ha tupu nke a.
- source_word: εἶπαν
  choice: sị
  rationale: Aorist nke λέγω pụtara nanị ‘sị’; ọ dịghị mkpa ịgbakwụnye echiche ‘zara’ nke ngwaa ahụ ekwughị kpọmkwem.
- source_word: ὅτι
  choice: akara mmeghe na mmechi okwu kpọmkwem
  rationale: ὅτι na-ebute okwu kpọmkwem n’ebe a; akara nhota na-egosipụta ọrụ ya n’ụzọ Igbo na-agụ nke ọma.
- source_word: Ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị akpọ κύριος dị ka aha nsọpụrụ nke Jizọs. N’agbanyeghị nke ahụ, κύριος nwekwara ike ịpụta ‘nna ukwu,’ ya mere e debere ihe ọzọ ahụ n’ala peeji.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnochiaha genitiv a na-ezo aka n’ịnyịnya ibu nta ahụ e kwuru okwu ya; n’Igbo, ‘ya’ na-enye ihe okwu ahụ pụtara n’enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: χρείαν ἔχει
  choice: chọrọ ya
  rationale: Ọ bụ ezie na akpaokwu Grik ahụ bụ n’ụzọ nkịtị ‘nwere mkpa,’ ‘chọrọ ya’ bụ ụzọ Igbo doro anya ma bụrụkwa nke nkịtị isi kwuo na mmadụ nwere mkpa ihe ahụ.
theological_decisions:
- issue: Onye κύριος na-ezo aka n’azịza ndị na-eso ụzọ ahụ
  choice: A sụgharịrị ya ‘Onyenwe anyị,’ nke n’akụkọ a na-ezo aka na Jizọs.
  alternative: ‘Nna ukwu,’ nke pụrụ izo aka n’onye nwe ịnyịnya ibu nta ahụ.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na nke a bụ azịza Jizọs nyere ndị na-eso ụzọ ya ka ha kwuo, Luk na-ejikwa κύριος akpọ Jizọs ọtụtụ mgbe. Ma ebe okwu ahụ nwekwara ike ịpụta ‘nna ukwu’ ma ọ bụ ‘onye nwe ihe,’ a hapụrụ ohere ahụ n’ala peeji kama imechi ya kpamkpam.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. ‘Ha wee sị’ na-agbaso usoro akụkọ Igbo nke ọma; ‘Onyenwe anyị’ na-echekwa aha nsọpụrụ ahụ, ebe nkọwa ala peeji na-echekwa nghọta ọzọ okwu Grik ahụ nwere.
