  source_fidelity: The translation accurately represents οἱ δὲ εἶπαν as the continuing narrative response, and ‘chọrọ ya’ naturally conveys χρείαν ἔχει with the colt as the referent of αὐτοῦ. ‘Onyenwe anyị’ is the established reverential Igbo biblical rendering for ‘the Lord’ in this context. The footnote appropriately records the viable ‘master/owner’ sense of κύριος without forcing it into the main text.
  naturalness: ‘Ha wee sị’ is fluent, standard narrative Igbo, and the quoted response is concise and idiomatic. The register is suitably respectful without being archaic or obscure.
  terminology: ‘Onyenwe anyị’ is appropriate for κύριος as a title for Jesus in the main text. ‘Nna ukwu’ in the note is a natural alternative for the master/owner sense. The note correctly identifies the referential distinction and does not impose a doctrinal conclusion.
