  terminology: «Ohu» kwesịrị ekwesị maka δοῦλος n’ọnọdụ ilu a. «Ikpe ikpe» na «kụrụ» dabara nke ọma. E dochiela ngwaa nke abụọ ka e chekwaa njikọ ihe ubi dị n’etiti θερίζων na ἔσπειρα.
