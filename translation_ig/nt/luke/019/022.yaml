source:
  edition: SBLGNT
  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: ig
  text: Ọ sịrị ya, “Site n’ọnụ gị[a] ka m ga-ekpe gị ikpe, gị ohu ọjọọ[b]. Ị maara na m bụ nwoke siri ike, onye na-ewere ihe m na-edoghị[c], na-aghọtakwa ihe m na-akụghị[d]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụ okwu gị onwe gị ka m ga-eji kpee gị ikpe.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ δοῦλος, nke nwere ike ịpụta ohu ma ọ bụ onye na-ejere nna ukwu ozi; ebe a, ọnọdụ ịnọ n’okpuru nna ukwu pụtara ìhè.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya, “ihe m na-etinyeghị.”
    reason: lexical_alternative
  - marker: d
    text: N’ụzọ nkịtị, Grik sịrị “ihe m na-akụghị,” ọ bụghị “ebe m na-akụghị.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: Site n’ọnụ gị
  rationale: Nke a na-edobe akpaalaokwu Grik nke na-egosi na okwu ohu ahụ n’onwe ya ga-abụ ihe e ji kpee ya ikpe; ọ bụkwa okwu Igbo doro anya.
- source_word: κρίνω
  choice: ka m ga-ekpe gị ikpe
  rationale: Ọ na-egosipụta ọdịnihu dị n’ụdị ngwaa Grik ma ghara ime ka okwu ahụ pụta kpọmkwem dị ka ‘ịma ikpe ọnwụ’ ma ọ bụ ‘ịkatọ,’ bụ́ ndị dị warara karịa κρίνω.
- source_word: πονηρὲ δοῦλε
  choice: gị ohu ọjọọ
  rationale: ‘Ọjọọ’ na-egosipụta ịta ụta n’omume, ebe ‘ohu’ na-echekwa ọnọdụ onye nọ n’okpuru nna ukwu nke δοῦλος pụtara n’ilu a.
- source_word: αὐστηρός
  choice: aka ike
  rationale: ‘Nwoke aka ike’ bụ ụzọ Igbo dị ndụ si akọwa onye siri ike ma na-emeso ndị ọzọ n’ụzọ na-adịghị nro, na-enweghị okwu mgbe ochie.
- source_word: αἴρων ὃ οὐκ ἔθηκα
  choice: onye na-ewere ihe m na-edoghị
  rationale: Nsụgharị a na-echekwa nkebi sara mbara ‘na-ewere ihe’ na ihe oyiyi ‘ịdọba/idebe ihe,’ n’ebughị ụzọ kpebie na ọ bụ naanị nkwụnye ego ka a na-ekwu.
- source_word: θερίζων ὃ οὐκ ἔσπειρα
  choice: na-ewekwa ihe m na-akụghị
  rationale: Ọ na-edobe njikọ ọrụ ugbo dị n’etiti ịgha mkpụrụ na iwe ihe, ma na-asụgharị nnọchiaha ὃ dị ka ‘ihe,’ ọ bụghị ‘ebe.’
theological_decisions:
- issue: Ma okwu nna ukwu banyere ịbụ onye aka ike bụ nkwenye nke onye na-akọ akụkọ, ka ọ bụ iji okwu ohu ahụ megide ya
  choice: 'E debere ya kpọmkwem n’ụdị ajụjụ nna ukwu kwuru: ‘Ị maara na m bụ nwoke aka ike...?’'
  alternative: ‘Ebe ị sịrị na m bụ nwoke aka ike...’ ma ọ bụ ‘Ọ bụrụ na ị maara na m bụ nwoke aka ike...’
  rationale: Grik anaghị etinye ‘ị sịrị’ ma ọ bụ ‘ọ bụrụ na’; idebe usoro ya na-ahapụ nghọta okwu ahụ dị ka ịjụ ajụjụ n’ụzọ nkwughachi okwu ohu ahụ, n’ebughị nkọwa banyere àgwà nna ukwu ahụ banye n’amaokwu.
- issue: Nsụgharị δοῦλος n’ọnọdụ nna ukwu na ohu
  choice: ohu
  alternative: onye na-eje ozi
  rationale: N’ilu a, mmekọrịta ọchịchị na ịnọ n’okpuru nna ukwu pụtara ìhè. ‘Ohu’ na-echekwa ịdị arọ nke δοῦλος karịa okwu sara mbara maka onye na-eje ozi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘n’ọnụ gị,’ ‘ikpe ikpe,’ ‘ohu ọjọọ,’ na ‘nwoke aka ike’ ka okwu ahụ nwee ụda siri ike nke nna ukwu na-agwa onye nọ n’okpuru ya okwu. E chekwara ajụjụ nkwughachi dị na ngwụcha amaokwu ahụ na-enweghị itinye nkọwa okpukpe na-adịghị na Grik.
