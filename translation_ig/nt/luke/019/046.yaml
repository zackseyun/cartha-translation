    reason: lexical_alternative
  - marker: b
    text: “Ọgba ndị ohi” na-ekwughachi Jeremaịa 7:11. A pụkwara ịsụgharị “ndị ohi” dịka “ndị na-apụnara mmadụ ihe” ma ọ bụ “ndị na-awakpo mmadụ n’ụzọ.”
    reason: cross_reference
