  to: na-asị ha, “E dere, sị, ‘Ụlọ m[a] ga-abụkwa ụlọ ekpere,’ ma unu emeela ya ọgba ndị ohi[b].”
  rationale: The sole revision removes the added phrase “n’Akwụkwọ Nsọ” so that the Igbo follows Γέγραπται more directly while preserving the conventional scriptural-citation register. The wording, quotation structure, names, theological language, and both valid footnote anchors are retained.
