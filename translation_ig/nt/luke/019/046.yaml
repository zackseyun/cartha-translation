id: LUK.19.46
reference: Luke 19:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: ig
  text: na-asị ha, “E dere, sị, ‘Ụlọ m[a] ga-abụkwa ụlọ ekpere,’ ma unu emeela ya ọgba ndị ohi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ụlọ nsọ m.” Asụsụ Grik kwuru “Ụlọ m,” na-ekwughachi Aịzaya 56:7.
    reason: lexical_alternative
  - marker: b
    text: “Ọgba ndị ohi” na-ekwughachi Jeremaịa 7:11. A pụkwara ịsụgharị “ndị ohi” dịka “ndị na-apụnara mmadụ ihe” ma ọ bụ “ndị na-awakpo mmadụ n’ụzọ.”
    reason: cross_reference
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: na-asị ha
  rationale: Nke a na-edobe ụdị participle dị n’asụsụ Grik ma na-ejikọta okwu a na ihe a kọrọ n’amaokwu bu ya ụzọ.
- source_word: Γέγραπται
  choice: E dere ya n’Akwụkwọ Nsọ
  rationale: Nke a bụ ụzọ Igbo doro anya isi gosipụta usoro okwu a na-eji webata ihe e dere n’Akwụkwọ Nsọ dịka okwu nwere ikike.
- source_word: Καὶ ἔσται
  choice: ga-abụkwa
  rationale: “Ga-abụ” na-egosipụta ọdịnihu, ebe “-kwa” na-echekwa njikọ καί dị ná mmalite nke ihe e hotara.
- source_word: ὁ οἶκός μου
  choice: Ụlọ m
  rationale: οἶκος pụtara “ụlọ” kpọmkwem. Ọ bụ ezie na ebe a ọ na-ezo aka n’ụlọ nsọ, “Ụlọ m” na-echekwa njikọ ya na Aịzaya 56:7.
- source_word: οἶκος προσευχῆς
  choice: ụlọ ekpere
  rationale: Nke a bụ okwu Igbo dị mfe ma kwekọọ n’usoro genitive nke Grik.
- source_word: ὑμεῖς δὲ
  choice: ma unu
  rationale: “Ma” na-egosipụta ọdịiche siri ike, ebe “unu” na-echekwa nkwusi ike dị na pronoun Grik.
- source_word: ἐποιήσατε
  choice: emeela
  rationale: Ụdị perfect Igbo a na-egosipụta ihe ha mere na ọnọdụ nke si na ya pụta ugbu a.
- source_word: σπήλαιον
  choice: ọgba
  rationale: “Ọgba” bụ ntụgharị kpọmkwem ma dabara n’onyonyo nke ebe ndị ohi na-ezo, dịka Jeremaịa 7:11 si kwuo.
- source_word: λῃστῶν
  choice: ndị ohi
  rationale: Okwu Grik ahụ nwere ike ịpụta ndị na-apụnara mmadụ ihe ma ọ bụ ndị omempụ na-awakpo mmadụ; “ndị ohi” bụ okwu Igbo sara mbara nke na-adịghị etinye nkọwa ndọrọ ndọrọ ọchịchị n’amaghị ama.
theological_decisions:
- issue: Ịsụgharị ebe obibi Chineke dịka “ụlọ” ma ọ bụ “ụlọ nsọ”
  choice: Ụlọ m ... ụlọ ekpere
  alternative: Ụlọ nsọ m ... ụlọ ekpere
  rationale: Ihe odide Grik ji οἶκος, “ụlọ,” mee ihe. Ichekwa “ụlọ” na-edobe okwu amụma ahụ na njikọ ya na Aịzaya 56:7 n’enweghị ịkọwa ya karịa ka isi mmalite si mee.
- issue: Udi ndị a kpọrọ λῃσταί
  choice: ndị ohi
  alternative: ndị na-apụnara mmadụ ihe / ndị na-awakpo mmadụ n’ụzọ
  rationale: “Ndị ohi” na-echekwa nnukwu obosara okwu ahụ ma na-ezere ime ka ọ bụrụ okwu pụrụ iche banyere ndị nnupụisi ma ọ bụ otu ndọrọ ndọrọ ọchịchị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ “Ụlọ m” dịka onyonyo Akwụkwọ Nsọ si dị, ma jiri “ọgba ndị ohi” chekwaa ike nke nkatọ amụma ahụ.
