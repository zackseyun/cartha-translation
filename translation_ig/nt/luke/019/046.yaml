review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast, the completed action, and the prophetic image of a robbers’ den. However, “n’Akwụkwọ Nsọ” adds an explicit object not stated in Γέγραπται (“It is written”). The formula clearly introduces Scripture in context, but the source wording can be retained more closely and naturally in Igbo without that addition.
  naturalness: “na-asị ha” is a natural participial continuation in Standard Igbo. “E dere, sị” is an idiomatic and suitably elevated scriptural-introduction formula. “Ụlọ m ga-abụkwa ụlọ ekpere” is natural, and -kwa reasonably represents the initial conjunction in the cited wording without making the quotation cumbersome.
  terminology: “Ụlọ m,” “ụlọ ekpere,” and “ọgba ndị ohi” are appropriate, recognizable Standard Igbo renderings. “Ndị ohi” retains the broad sense of λῃστῶν and avoids narrowing it to a particular kind of bandit or insurgent. The footnotes appropriately identify the temple referent and the Isaiah/Jeremiah echoes.
  issues:
  - severity: low
    issue: The phrase “n’Akwụkwọ Nsọ” is not explicit in the Greek text.
    rationale: Γέγραπται is literally a passive formula, “It is written.” Although it functions as a Scripture citation, adding “in Scripture” is interpretive and is unnecessary for clear Igbo. “E dere, sị” preserves the source more closely.
  revised_text: na-asị ha, “E dere, sị, ‘Ụlọ m[a] ga-abụkwa ụlọ ekpere,’ ma unu emeela ya ọgba ndị ohi[b].”
