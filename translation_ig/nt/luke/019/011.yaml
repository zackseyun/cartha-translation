  to: Ka ha na-anụ ihe ndị a, ọ gara n’ihu kọọrọ ha otu ilu, n’ihi na ọ nọ nso na Jerusalem, nakwa n’ihi na ha chere na alaeze Chineke na-aga ịpụta ìhè ozugbo.[a]
  rationale: 'The verse text requires no change: it is faithful and natural. The footnote has been revised to provide a grammatical, idiomatic alternative that reflects the semantic range of ἀναφαίνεσθαι (‘become visible,’ ‘become manifest’) while preserving the original text’s ambiguity about the form of the kingdom’s manifestation.'
