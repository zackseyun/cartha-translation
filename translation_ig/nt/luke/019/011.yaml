id: LUK.19.11
reference: Luke 19:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: ig
  text: Ka ha na-anụ ihe ndị a, ọ gara n’ihu kọọrọ ha otu ilu, n’ihi na ọ nọ nso na Jerusalem, nakwa n’ihi na ha chere na alaeze Chineke na-aga ịpụta ìhè ozugbo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “alaeze Chineke ga-egosi onwe ya ozugbo.” Ngwaa Grik ahụ nwere ike igosi ịghọ ihe a na-ahụ anya ma ọ bụ ịpụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: Ka ha na-anụ ihe ndị a
  rationale: Nkebiokwu a na-egosi na ịnụ ihe ndị ahụ ka na-aga n’ihu mgbe Jizọs malitere ịkọ ilu ahụ.
- source_word: προσθεὶς εἶπεν
  choice: ọ gara n’ihu kọọrọ ha
  rationale: Nke a na-egosi na o tinyere okwu ọzọ n’ihe ọ nọ na-ekwu, ma na-ada ka Igbo nkịtị karịa nsụgharị mkpụrụokwu n’otu n’otu.
- source_word: παραβολὴν
  choice: otu ilu
  rationale: “Ilu” bụ okwu Igbo doro anya maka ụdị akụkọ nkuzi a, “otu” na-egosikwa na ọ bụ otu ilu.
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: n’ihi na ọ nọ nso na Jerusalem
  rationale: Ọ na-edobe ihe kpatara ya ma mee ka o doo anya na onye nọ nso Jerusalem bụ Jizọs.
- source_word: δοκεῖν αὐτοὺς
  choice: ha chere
  rationale: “Ha chere” na-egosi echiche ma ọ bụ atụmanya ha, n’emeghị ka o yie na ihe ahụ bụ eziokwu doro anya.
- source_word: παραχρῆμα
  choice: ozugbo
  rationale: “Ozugbo” na-egosipụta echiche nke ihe ga-eme n’egbughị oge.
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: na-aga ịpụta ìhè
  rationale: “Na-aga” na-egosi na ha lere ihe ahụ anya dị ka ihe na-eru nso, ebe “ịpụta ìhè” na-echekwa echiche nke ịghọ ihe a na-ahụ anya ma ọ bụ nke e mere ka ọ pụta ìhè.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ nsụgharị Igbo doro anya ma guzosie ike nke na-echekwa njikọ ya na ebe ndị ọzọ n’Oziọma Luk.
theological_decisions:
- issue: Ụdị ngosipụta alaeze Chineke ndị mmadụ tụrụ anya ya
  choice: A sụgharịrị ya dị ka “alaeze Chineke na-aga ịpụta ìhè ozugbo.”
  alternative: Ịkọwa ya kpọmkwem dị ka iguzobe ọchịchị ndọrọ ndọrọ ọchịchị ma ọ bụ mmezu ikpeazụ nke alaeze ahụ.
  rationale: Amaokwu ahụ na-ekwu na ha tụrụ anya ngosipụta ya n’egbughị oge, ma ọ kọwaghị ụdị ngosipụta ahụ; ya mere nsụgharị ahụ anaghị etinye nkọwa ozizi na-adịghị n’ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, sụgharịa ya. E debere usoro ihe abụọ kpatara Jizọs ji kọọ ilu ahụ, ma zere ịkọwa ụdị alaeze ahụ karịa ihe ederede Grik kwuru.
