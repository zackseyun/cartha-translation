    reason: lexical_alternative
  revision_rationale: The revision removes a minor unnecessary specification, improves idiomatic Standard Igbo, and preserves the source’s civic-political and royal language. The temporal/spatial ambiguity of sending the delegation “after him” is retained as n’azụ ya.
