  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: ig
  text: Ma ụmụ amaala ya kpọrọ ya asị, ha wee zipụ otu ndị nnọchiteanya[a] n’azụ ya, na-asị, “Anyị achọghị ka nwoke a chịa anyị dịka eze.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “òtù ndị e zigara n’ozi ọchịchị.” Okwu Grik ahụ na-ezo aka n’otu ndị nnọchiteanya e zigara n’ozi gọọmenti.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: ụmụ amaala obodo ya
  rationale: Nke a na-echekwa echiche nke ndị so n’otu obodo ndọrọ ndọrọ ọchịchị; ọ naghị akpọ ha ndị ọ na-achị tupu ha ajụ ịbụ ndị ọchịchị ya.
- source_word: ἐμίσουν
  choice: kpọrọ ya asị
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ịkpọ mmadụ asị; ọ dabara n’imperfect Grik nke na-egosi ọnọdụ iro ha nọgidere nwee.
- source_word: ἀπέστειλαν πρεσβείαν
  choice: zipụ otu ndị nnọchiteanya[a]
  rationale: Ọ na-egosi na e zigara otu ndị na-anọchi anya obodo n’ozi pụrụ iche, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: ὀπίσω αὐτοῦ
  choice: n’azụ ya
  rationale: Ọ na-echekwa echiche na e zigara ha iso ya mgbe ọ lawara, na-enweghị ịgbakwunye nkọwa na-adịghị n’ederede.
- source_word: Οὐ θέλομεν
  choice: Anyị achọghị
  rationale: Nke a na-egosi ọchịchọ na mkpebi ha jụrụ ya n’ụzọ doro anya ma bụrụ Igbo e ji eme ihe kwa ụbọchị.
- source_word: τοῦτον
  choice: nwoke a
  rationale: Ọ na-echekwa ụda nke ịtụ aka n’ebe ọ nọ n’ụzọ dịtụ anya ma ọ bụ nke nlelị, n’enweghị ime ka okwu ahụ sie ike karịa Grik.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: bụrụ eze na-achị anyị
  rationale: Nke a na-echekwa kpọmkwem echiche ọchịchị eze dị na βασιλεύω, kama ime ya naanị ọchịchị n’ozuzu.
theological_decisions:
- issue: Echiche ọchịchị eze dị n’ilu ahụ
  choice: bụrụ eze na-achị anyị
  alternative: na-achị anyị
  rationale: Ịkpọ ya eze na-echekwa ihe oyiyi ọchịchị eze nke ederede Grik. A naghị akọwa onye eze ahụ nọchiri anya ya, ka esemokwu na ilu ahụ wee dịgide dịka ederede si kwuo.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere asụsụ ndọrọ ndọrọ ọchịchị na nke ọchịchị eze n’ụzọ doro anya. E tinyere akara nkọwa ala peeji [a] n’akụkụ okwu ọ na-akọwa, πρεσβείαν.
