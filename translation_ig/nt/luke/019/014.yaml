- from: Ma ụmụ amaala obodo ya kpọrọ ya asị, ha wee zipụ otu ndị nnọchiteanya[a] n’azụ ya, na-asị, “Anyị achọghị ka nwoke a bụrụ eze na-achị anyị.”
  to: Ma ụmụ amaala ya kpọrọ ya asị, ha wee zipụ otu ndị nnọchiteanya[a] n’azụ ya, na-asị, “Anyị achọghị ka nwoke a chịa anyị dịka eze.”
  rationale: The revision removes a minor unnecessary specification, improves idiomatic Standard Igbo, and preserves the source’s civic-political and royal language. The temporal/spatial ambiguity of sending the delegation “after him” is retained as n’azụ ya.
