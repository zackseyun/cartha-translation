source:
  edition: SBLGNT
  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: ig
  text: Ya mere, ọ gbara ọsọ gaa n’ihu, rịgoro n’elu osisi sikamọ[a] ka o wee hụ ya, n’ihi na ọ ga-esi n’ụzọ ahụ gafee.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ziri ezi karị, “osisi fig sikamọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προδραμὼν … εἰς τὸ ἔμπροσθεν
  choice: ọ gbara ọsọ gaa n’ihu
  rationale: Nke a na-egosi ma ịgba ọsọ ma iru n’ihu ụzọ, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: ἀνέβη ἐπὶ
  choice: rịgoro n’elu
  rationale: ‘Rịgoro n’elu’ na-egosi omume ịrị osisi n’ụzọ doro anya ma bụrụ okwu Igbo nkịtị.
- source_word: συκομορέαν
  choice: osisi sikamọ
  rationale: Aha a a na-asụgharị n’ụzọ a maara nke ọma, ebe nkọwa ala peeji na-echekwa aha osisi ahụ nke ziri ezi karị.
- source_word: ἵνα ἴδῃ αὐτόν
  choice: ka o wee hụ ya
  rationale: Nkebiokwu a na-echekwa ebumnuche nke ἵνα tinyere ngwaa n’ọnọdụ subjunctive n’Igbo dị mfe ma dị ndụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere Zakiọs ji rịgoro osisi ahụ.
- source_word: ἐκείνης
  choice: n’ebe ahụ
  rationale: Okwu Grik a na-ezo aka n’ụzọ ma ọ bụ ebe a ghọtara site n’ihe gbara ya gburugburu; ‘n’ebe ahụ’ anaghị agbakwụnye aha kpọmkwem na-adịghị na ederede.
- source_word: ἤμελλεν διέρχεσθαι
  choice: ọ ga-esi … gafee
  rationale: Nke a na-egosi ihe a na-atụ anya na ọ ga-eme n’oge dị nnọọ nso ma na-ada nke ọma n’akụkọ Igbo.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nnọchiaha ndị dị na Grik kama ịkpọ aha Jizọs n’ebe ederede ahụ na-akpọghị ya aha, ka a ghara idozi ihe ederede hapụrụ n’ọnọdụ ntụaka.
