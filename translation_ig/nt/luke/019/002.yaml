  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: ig
  text: Ma lee[a], otu nwoke a na-akpọ Zakaịọs; ọ bụ onyeisi ndị ọnaụtụ, bụrụkwa ọgaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Lee.” Okwu Grik a bụ akara e ji adọta uche onye na-agụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Nke a na-edobe akara okwu Luk ji adọta uche onye na-agụ ma na-eme ka akụkọ ahụ dị ndụ; ‘lee’ bụ ụzọ Igbo dị ugbu a si kwuo ya n'ụzọ ebumpụta ụwa.
- source_word: ἀνὴρ
  choice: otu nwoke
  rationale: Aha ahụ na-ezo aka kpọmkwem n’otu nwoke; ‘otu nwoke’ na-egosipụta ma okike ya ma na ọ bụ onye akụkọ ahụ na-ewebata ọhụrụ.
- source_word: ὀνόματι καλούμενος
  choice: a na-akpọ
  rationale: Nkebi okwu Grik a pụtara onye a na-akpọ otu aha. ‘A na-akpọ Zakiọs’ bụ okwu Igbo doro anya ma na-edobe echiche καλούμενος n’enweghị nkwugharị siri ike.
- source_word: Ζακχαῖος
  choice: Zakiọs
  rationale: E depụtara aha onye ahụ dịka ụda ya si kwekọọ n’usoro mkpụrụokwu na ịkpọ aha n’Igbo.
- source_word: αὐτὸς ἦν
  choice: ọ bụ
  rationale: Nnochiaha ahụ na-amaliteghachi okwu banyere nwoke ahụ ma nwee obere nkwusi ike; ‘ọ bụ’ na-egosipụta ya n’ụzọ Igbo ebumpụta ụwa n’ebughị nkwusi ike gabiga ókè.
- source_word: ἀρχιτελώνης
  choice: onyeisi ndị ọnaụtụ
  rationale: Ngwakọta okwu ahụ na-egosi onye nwere ọkwa isi n’etiti ndị na-anakọta ụtụ. Nhọrọ a na-edobe echiche ọchịchị ma bụrụ okwu ndị Igbo nke oge a ga-aghọta.
- source_word: αὐτὸς πλούσιος
  choice: bụrụkwa ọgaranya
  rationale: πλούσιος pụtara onye nwere nnukwu akụ. ‘Ọgaranya’ bụ okwu Igbo kpọmkwem, ebe ‘-kwa’ na-edobe njikọ na obere nkwusi ike nke καὶ αὐτός.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro iwebata onye ahụ na nkọwa abụọ gbasara ọrụ ya na akụnụba ya, n’etinyeghị ‘ọ nọ n’ebe ahụ,’ nke na-adịghị n’ederede Grik.
