source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: ig
  text: Mgbe ọ laghachiri mgbe ọ natachara alaeze ahụ, o nyere iwu ka a kpọọ ndị ohu[a] ndị a, bụ ndị o nyere ego ahụ, ka ha bịakwute ya, ka ọ mara ihe ha ritere n’azụmahịa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị na-ejere ya ozi.” Okwu Grik ahụ, doulous, nwere ike ịpụta ndị ohu ma ọ bụ ndị na-eje ozi, dabere n’ọnọdụ ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “azụmahịa ha mere,” ma ọ bụ “uru ha nwetara.” Ngwaa Grik ahụ na-ezo aka n’ịzụ ahịa nakwa n’ihe si na ya pụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: Mgbe
  rationale: Usoro akụkọ a jikọtara ya na nkebi oge sochirinụ n’ụzọ Igbo sitere n’okike; ịsụgharị ya iche dịka ‘o wee ruo’ ga-adị arọ ma ghara itinye ihe ọhụrụ.
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: Mgbe ọ laghachiri
  rationale: Articular infinitive nwere ἐν na-egosi oge; ‘Mgbe ọ laghachiri’ bụ Igbo doro anya ma kwekọọ na ya.
- source_word: λαβόντα τὴν βασιλείαν
  choice: ebe ọ nataworị alaeze ahụ
  rationale: Nke a na-egosi na ịnata alaeze ahụ buru ụzọ mee tupu iwu ahụ; ‘nataworị’ na-echekwa mmekọrịta oge ahụ.
- source_word: βασιλείαν
  choice: alaeze ahụ
  rationale: ‘Alaeze’ bụ okwu Igbo a maara nke ọma, ma n’akụkọ a ọ pụtara ọchịchị ma ọ bụ ikike eze e nyere nwoke ahụ.
- source_word: φωνηθῆναι αὐτῷ
  choice: ka a kpọtara ya
  rationale: Na ọnọdụ a φωνέω pụtara ịkpọ ndị ahụ ka ha bịakwute ya; ‘kpọtara ya’ na-egosi summons ahụ n’Igbo nkịtị.
- source_word: δούλους
  choice: ndị ohu
  rationale: ‘Ndị ohu’ na-echekwa ọnọdụ ndị nọ n’okpuru ikike nwoke ahụ karịa ‘ndị na-ejere ya ozi,’ nke nwere ike izochi ọnọdụ agbụ ha.
- source_word: δεδώκει
  choice: o nyere
  rationale: Ihe omume ahụ mere tupu nlọghachi ya; usoro na ‘nataworị’ na ọnọdụ akụkọ ahụ na-eme ka oge gara aga doo anya n’enweghị ahịrịokwu arọ.
- source_word: ἀργύριον
  choice: ego ahụ
  rationale: N’agbanyeghị na okwu ahụ nwere ike ịpụta ọlaọcha, ebe a ọ na-ezo aka n’ego e nyere ha; amaokwu a akpọghị kpọmkwem nkeji mina.
- source_word: ἵνα γνοῖ
  choice: ka ọ mara
  rationale: Nke a na-echekwa ebumnuche nke ἵνα na ngwaa ‘ịmata’ n’ụzọ dị mfe.
- source_word: τί
  choice: ihe
  rationale: ‘Ihe’ na-ahapụ ajụjụ ahụ sara mbara dịka Grik, kama ịkọwapụta ya naanị dịka ‘ole.’
- source_word: διεπραγματεύσαντο
  choice: ha ritere site n’ịzụ ahịa
  rationale: Nkebi a na-ejikọta ọrụ azụmahịa na ihe si na ya pụta, nke dabara n’ọnọdụ akụkọ ahụ.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ọnọdụ akụ na ụba nke ilu a
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: Nwoke ahụ nwere ikike siri ike n’ebe ha nọ ma nyefee ha akụ ya; ‘ndị ohu’ na-egosipụta mmekọrịta mmadụ nke ederede ahụ n’enweghị itinye nkọwa okpukpe ọzọ.
- issue: Ihe βασιλεία pụtara n’ebe a
  choice: alaeze ahụ
  alternative: ikike ịbụ eze
  rationale: ‘Alaeze’ na-anọgide nso n’okwu Grik ma nwee ike ibu echiche ọchịchị eze; ihe ọzọ na-eme ka naanị otu nuance pụta ìhè.
- issue: Ma διεπραγματεύσαντο ọ na-elekwasị anya n’ọrụ azụmahịa ka ọ bụ uru
  choice: ihe ha ritere site n’ịzụ ahịa
  alternative: azụmahịa ha mere
  rationale: Nhọrọ a na-echekwa ma ọrụ azụmahịa ahụ ma ihe si na ya pụta, n’agbanyeghị na ngwaa ahụ n’onwe ya nwere ike ikwe ka e mesie otu n’ime ha ike.
translation_notes:
  register: Standard Igbo dị ugbu a, nwee ugwu ma dị mfe nghọta. E ji ‘ndị ohu’ gosipụta ọnọdụ mmekọrịta mmadụ nke δοῦλος, ebe nkọwa ala ala peeji na-edebe ‘ndị na-ejere ya ozi’ dịka ezigbo nhọrọ ọzọ. Ahịrịokwu ahụ zere usoro ochie dịka ‘o wee ruo’ iji mee ka akụkọ ahụ na-aga nke ọma.
