    text: A pụkwara ịsụgharị ya, “ndị na-ejere ya ozi.” Okwu Grik ahụ, doulous, nwere ike ịpụta ndị ohu ma ọ bụ ndị na-eje ozi, dabere n’ọnọdụ ya.
    reason: lexical_alternative
