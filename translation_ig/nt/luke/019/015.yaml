- from: Mgbe ọ laghachiri, ebe ọ nataworị alaeze ahụ, o nyere iwu ka a kpọtara ya ndị ohu[a] ahụ o nyere ego ahụ, ka ọ mara ihe ha ritere site n’ịzụ ahịa.[b]
  to: Mgbe ọ laghachiri mgbe ọ natachara alaeze ahụ, o nyere iwu ka a kpọọ ndị ohu[a] ndị a, bụ ndị o nyere ego ahụ, ka ha bịakwute ya, ka ọ mara ihe ha ritere n’azụmahịa.[b]
  rationale: The revision replaces the inaccurate “a kpọtara ya” with a natural summons construction, “a kpọọ ... ka ha bịakwute ya,” retaining both the passive command and movement to the master. It also uses “mgbe ọ natachara” to state the antecedent receipt of the kingdom more directly. No theological or interpretive expansion has been introduced.
