review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the return after receiving the kingdom, the prior giving of the money, the purpose clause, and the commercial-result sense of διεπραγματεύσαντο. However, “ka a kpọtara ya ndị ohu” means that the slaves were brought to him and does not naturally express the Greek passive summons φωνηθῆναι αὐτῷ (“to be called/summoned to him”).
  naturalness: Most wording is clear Standard Igbo, but “a kpọtara ya ndị ohu” is syntactically and idiomatically unsuitable here. “Ka a kpọọ ... ka ha bịakwute ya” naturally conveys a summons without adding material meaning.
  terminology: “Ndị ohu” is an appropriate rendering of δούλους in this parabolic setting. “Alaeze ahụ,” “ego ahụ,” and “ihe ha ritere n’azụmahịa” are suitable and preserve the broad commercial sense without narrowing it to a specified amount.
  issues:
  - severity: medium
    issue: The rendering of φωνηθῆναι αὐτῷ as “ka a kpọtara ya ndị ohu” is inaccurate/unnatural.
    rationale: φωνηθῆναι means to be called or summoned. The draft wording uses kpọtara (“bring”) and has an awkward object arrangement; it obscures that the master ordered the slaves to be summoned to his presence.
  - severity: low
    issue: “Ebe ọ nataworị alaeze ahụ” is less direct as the temporal relation of λαβόντα.
    rationale: “Mgbe ọ natachara alaeze ahụ” clearly and naturally states that receiving the kingdom preceded his return, while preserving the Greek temporal sequence.
  revised_text: Mgbe ọ laghachiri mgbe ọ natachara alaeze ahụ, o nyere iwu ka a kpọọ ndị ohu[a] ndị a, bụ ndị o nyere ego ahụ, ka ha bịakwute ya, ka ọ mara ihe ha ritere n’azụmahịa.[b]
  revised_footnotes:
