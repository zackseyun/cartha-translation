  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: ig
  text: Ma ha enweghị ike ịchọpụta ihe ha ga-eme, n’ihi na ndị mmadụ niile nọ na-ege ya ntị nke ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị karị, “ndị mmadụ niile nọ na-adabere n’ebe ọ nọ, na-ege ntị.” Akpaalaokwu Grik a na-egosi na ha ji oké mmasị na nlebara anya zuru ezu na-ege Jizọs ntị.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: Ha enweghịkwa ike ịchọpụta
  rationale: Ngwaa imperfect nke e ji nkw否 mee na-egosi na ha nọgidere na-enweghị ike ịchọta ụzọ ha ga-esi mee ihe; ntụgharị a na-egosipụta ọnọdụ ahụ n’Igbo dị mfe ma doo anya.
- source_word: τὸ τί ποιήσωσιν
  choice: ihe ha ga-eme
  rationale: Nke a na-egosipụta ajụjụ ha na-atụle banyere ụzọ omume ha ga-ahọrọ, n’enweghị ịgbakwụnye echiche na ha ‘kwesịrị’ ime otu ihe.
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: n’ihi na ndị mmadụ niile
  rationale: ‘N’ihi na’ na-egosipụta ihe kpatara na ha enweghị ike ime mkpebi, ebe ‘ndị mmadụ niile’ na-echekwa ịdị n’uju nke ἅπας.
- source_word: ἐξεκρέματο αὐτοῦ ἀκούων
  choice: nọ na-ege ya ntị nke ukwuu
  rationale: Akpaalaokwu Grik ahụ pụtara ige Jizọs ntị nke ọma, n’obi niile na n’oké mmasị. Igbo a na-enye ihe akpaalaokwu ahụ pụtara n’ụzọ ndị mmadụ ga-aghọta, ebe nkọwa ala peeji na-echekwa ihe oyiyi okwu Grik ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. A tụgharịrị akpaalaokwu Grik n’ụzọ na-egosi ihe ọ pụtara, ma debe ihe oyiyi okwu mbụ n’ala peeji.
