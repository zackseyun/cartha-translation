review_pass:
  verdict: revise
  source_fidelity: The draft preserves the event sequence and correctly identifies the colt as a donkey's colt from the immediate context. However, “kpọtaara ya Jizọs” does not clearly express πρὸς (“to”) and can suggest bringing it for Jesus rather than bringing it to him. The final causative action is better rendered directly as placing Jesus on the colt.
  naturalness: “Ha kpọtara ya nye Jizọs” is clear, standard modern Igbo. “Uwe mwụda” is too specific and can evoke a skirt or gown rather than the Greek’s general outer garments; “uwe ha” is natural and sufficiently faithful. “Ha kpọkwasịrị Jizọs n’elu ya” is concise and idiomatic.
  terminology: Jizọs and “nwa ịnyịnya ibu” are appropriate Standard Igbo forms. The retained contextual note appropriately explains that πῶλος itself is a young animal, while the context identifies it as a donkey’s colt.
  issues:
  - severity: medium
    issue: The phrase “kpọtaara ya Jizọs” does not explicitly convey bringing the colt to Jesus.
    rationale: πρὸς τὸν Ἰησοῦν denotes movement toward Jesus. Adding “nye” makes the recipient/destination unambiguous without adding meaning.
  - severity: medium
    issue: “Uwe mwụda” is overly narrow for ἱμάτια.
    rationale: ἱμάτια denotes garments, especially outer garments/cloaks; “uwe mwụda” may specify a type of clothing not present in the Greek.
  - severity: low
    issue: “Ha mere ka Jizọs nọkwasị n’elu ya” is less direct than the source action.
    rationale: ἐπεβίβασαν means they caused Jesus to mount/set him on the colt. “Ha kpọkwasịrị Jizọs n’elu ya” naturally conveys this direct causative placement.
  revised_text: Ha kpọtara ya nye Jizọs[a]. Mgbe ha tụkwasịrị uwe ha n’elu nwa ịnyịnya ibu ahụ[b], ha kpọkwasịrị Jizọs n’elu ya.
  revised_footnotes:
  - marker: a
    text: ‘Ya’ na-ezo aka na nwa ịnyịnya ibu ahụ. N’asụsụ Grik, nnọchiaha ahụ bụ nke ụdị nwoke n’usoro ụtọasụsụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a pụtara nwa anụmanụ; ihe ndị gbara amaokwu a gburugburu na-egosi na ọ bụ nwa ịnyịnya ibu.
    reason: contextual_clarification
  revision_rationale: The revision explicitly renders movement to Jesus, avoids unnecessarily specifying the type of garments, and uses a direct, natural Igbo expression for setting Jesus on the colt. It retains the contextual identification of the colt and preserves the footnote anchors.
