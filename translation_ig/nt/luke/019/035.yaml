  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: ig
  text: Ha kpọtara ya nye Jizọs[a]. Mgbe ha tụkwasịrị uwe ha n’elu nwa ịnyịnya ibu ahụ[b], ha kpọkwasịrị Jizọs n’elu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘Ya’ na-ezo aka na nwa ịnyịnya ibu ahụ. N’asụsụ Grik, nnọchiaha ahụ bụ nke ụdị nwoke n’usoro ụtọasụsụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a pụtara nwa anụmanụ; ihe ndị gbara amaokwu a gburugburu na-egosi na ọ bụ nwa ịnyịnya ibu.
    reason: contextual_clarification
lexical_decisions:
- source_word: ἤγαγον
  choice: kpọtaara
  rationale: Ngwaa a na-egosi na ha kpọtara nwa anụmanụ ahụ bịakwute Jizọs; ‘kpọtaara’ bụ okwu Igbo doro anya ma kwekọọ n’ebe a.
- source_word: αὐτὸν
  choice: ya
  rationale: ‘Ya’ na-ezo aka n’anụmanụ ahụ a kpọtụrụ aha n’amaokwu bu ụzọ. N’Igbo, nnọchiaha a anaghị egosi ma ihe a na-ekwu maka ya ọ̀ bụ nwoke ma ọ bụ ihe/anụmanụ.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: Jizọs
  rationale: N’usoro ‘kpọtaara ya Jizọs,’ aha Jizọs na-egosi onye a kpọtaara anụmanụ ahụ, nke na-enye echiche ngagharị προς n’Igbo nkịtị.
- source_word: ἐπιρίψαντες
  choice: Mgbe ha tụkwasịrị
  rationale: Aorist participle a mere tupu isi ngwaa; ‘Mgbe ha tụkwasịrị’ na-egosi usoro ihe omume ahụ nke ọma.
- source_word: αὐτῶν τὰ ἱμάτια
  choice: uwe mwụda ha
  rationale: ἱμάτια bụ uwe elu a na-eyi n’èzí; ‘uwe mwụda’ na-enye nkọwa doro anya karịa naanị ‘uwe.’
- source_word: ἐπὶ τὸν πῶλον
  choice: n’elu nwa ịnyịnya ibu ahụ
  rationale: ἐπί na-egosi itinye uwe n’elu anụmanụ ahụ, ebe okwu gbara amaokwu a gburugburu na-egosi na πῶλος bụ nwa ịnyịnya ibu.
- source_word: ἐπεβίβασαν
  choice: ha mere ka ... nọkwasị n’elu ya
  rationale: Ntụgharị a na-echekwa echiche causative nke ngwaa ahụ—ha mere ka Jizọs rịgoro ma nọrọ n’elu anụmanụ ahụ—n’enweghị ịgbakwunye otú ha si mee ya.
- source_word: τὸν Ἰησοῦν
  choice: Jizọs
  rationale: Nke a bụ nsụgharị aha Ἰησοῦς a na-ejikarị eme ihe n’Igbo Standard.
