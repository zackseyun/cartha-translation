revisions:
- from: Ha kpọtaara ya Jizọs[a]. Mgbe ha tụkwasịrị uwe mwụda ha n’elu nwa ịnyịnya ibu ahụ[b], ha mere ka Jizọs nọkwasị n’elu ya.
  to: Ha kpọtara ya nye Jizọs[a]. Mgbe ha tụkwasịrị uwe ha n’elu nwa ịnyịnya ibu ahụ[b], ha kpọkwasịrị Jizọs n’elu ya.
  rationale: The revision explicitly renders movement to Jesus, avoids unnecessarily specifying the type of garments, and uses a direct, natural Igbo expression for setting Jesus on the colt. It retains the contextual identification of the colt and preserves the footnote anchors.
  reviewer_model: gpt-5.6-terra
