revisions:
- from: Ma ndị iro m ndị a, bụ́ ndị na-achọghị ka m chịa ha dịka eze, kpọtaranụ ha ebe a, gbuokwa ha n'ihu m.
  to: Ma ndị iro m ndị a, bụ ndị na-achọghị ka m chịa ha dịka eze, kpọtaranụ ha ebe a, gbusienụ ha n’ihu m.
  rationale: The revision retains the parable’s direct, severe command and all of the Greek clause structure while using a stronger Igbo verb for the intensified killing verb κατασφάξατε. No footnote is required, since the revised wording is unambiguous and does not introduce an interpretive claim.
