  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: ig
  text: Ma ndị iro m ndị a, bụ ndị na-achọghị ka m chịa ha dịka eze, kpọtaranụ ha ebe a, gbusienụ ha n’ihu m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Ma
  rationale: N'ebe a, okwu a na-egosi mgbanwe siri ike gaa n'ihe ikpeazụ onye ahụ a mụrụ n'ezinụlọ ukwu nyere n'iwu; “Ma” na-egosipụta ntụgharị ahụ n'Igbo n'ụzọ dị nkenke ma dịkwa eke.
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: ndị iro m ndị a
  rationale: “Ndị iro” bụ okwu Igbo doro anya maka ndị na-emegide mmadụ, ebe “ndị a” na-echekwa nrụsi aka nke τούτους.
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς
  choice: bụ́ ndị na-achọghị ka m chịa ha dịka eze
  rationale: Nkebiokwu a na-echekwa echiche nke enweghị ọchịchọ ma kọwaa βασιλεύω dị ka ịchị dịka eze, na-emeghị ka ọ bụrụ naanị ịnọ n'ọkwa eze.
- source_word: ἀγάγετε ὧδε
  choice: kpọtaranụ ha ebe a
  rationale: “Kpọtaranụ” bụ iwu dị n'ọtụtụ nke na-egosipụta iweta ndị ahụ n'ebe onye na-ekwu okwu nọ; ọ dabara n'usoro okwu Igbo.
- source_word: κατασφάξατε
  choice: gbuo ha
  rationale: “Gbuo” na-enye iwu ọnwụ ahụ n'ụzọ doro anya ma kwụ ọtọ. N'agbanyeghị na κατασφάζω nwere ike ịdị ike karịa okwu izugbe maka igbu, okwu Igbo ndị nwere nkọwa nke igbu anụ nwere ike ime ka a ghọta ihe na-abụghị ebumnuche nke akụkụ a.
- source_word: ἔμπροσθέν μου
  choice: n'ihu m
  rationale: “N'ihu m” na-echekwa ma echiche nke ebe ha nọ ma nke ime ihe ahụ n'ọdịdị onye na-ekwu okwu, n'asụsụ Igbo dị eke.
theological_decisions:
- issue: Onye na-ekwu okwu n'ime ilu ahụ
  choice: E sụgharịrị iwu onye ahụ dị n'ime ilu ahụ ozugbo, na-enweghị ime ka ime ihe ike ya dị nro ma ọ bụ kwuo na ọ bụ iwu Jizọs nyere ozugbo n'èzí ilu ahụ.
  alternative: Itinye okwu nkọwa ga-eme ka iwu ahụ pụọ iche nke ukwuu dịka naanị ihe atụ ilu.
  rationale: Grik gosiri onye a mụrụ n'ezinụlọ ukwu ka ọ na-ekwu n'ime ilu ahụ. Nsụgharị kwesịrị idobe ike akụkọ ahụ na esemokwu nkà mmụta okpukpe dị na ya, na-etinyeghị nkwubi okwu nke ederede ahụ ekwughị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụda iwu siri ike nke amaokwu ahụ, ma zere okwu ochie ma ọ bụ okwu nwere nkọwa okpukpe agbakwunyere.
