base_translation:
  language: en
  yaml_path: translation/nt/luke/019/001.yaml
  text: And he entered and was passing through Jericho[a].
translation:
  language: ig
  text: O wee banye na Jeriko, na-agafe n’ime ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-agbasochi usoro okwu Grik anya karị: “Ọ banyesịrị, ọ nọ na-agafe Jeriko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: O wee
  rationale: Njikọ akụkọ a na-egosi ihe omume sochiri nke gara aga n'ụzọ Igbo dị n'okike, n'etinyeghị nkọwa ọzọ.
- source_word: εἰσελθὼν
  choice: banye
  rationale: Participul aorist a na-egosi omume nke bịara tupu ma jikọtakwa ya na isi ngwaa; usoro ‘O wee banye ... na-agafe’ na-edobe usoro ahụ n'Igbo dị mfe.
- source_word: διήρχετο
  choice: na-agafe n’ime ya
  rationale: Ụdị imperfect na-egosi omume na-aga n'ihu; ‘na-agafe’ na-echekwa akụkụ a, ebe ‘n’ime ya’ na-egosi ịgafe obodo ahụ.
- source_word: τὴν Ἰεριχώ
  choice: Jeriko
  rationale: Aha obodo ahụ ka e dere n'ụdị a na-ahụkarị n'Igbo; ‘ya’ na nkebi sochirinụ na-ezo aka na Jeriko.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji ‘na-agafe’ chekwaa omume na-aga n’ihu nke imperfect, ma zere ime ka amaokwu ahụ kwuo na ọ gafesịrị obodo ahụ kpamkpam.
