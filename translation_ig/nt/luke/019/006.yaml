  edition: SBLGNT
  text: καὶ σπεύσας κατέβη, καὶ ὑπεδέξατο αὐτὸν χαίρων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/006.yaml
  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: ig
  text: O wee gbadata ngwa ngwa, jiri ọṅụ nabata ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O wee gbadata ngwa ngwa, were ọṅụ nabata ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεύσας
  choice: mee ngwa ngwa
  rationale: Nkebi ngwaa a na-egosi na o mere ihe ahụ ozugbo, nakwa na ọ dị njikere ime ya. “Mee ngwa ngwa” bụ okwu Igbo dị mfe ma na-adị ugbu a.
- source_word: κατέβη
  choice: rịdata
  rationale: Ngwaa a na-egosi ngagharị si n’elu gbadata; n’ọnọdụ a, “rịdata” dabara n’ihi na Zakịọs nọ n’elu osisi.
- source_word: ὑπεδέξατο
  choice: nabata
  rationale: Okwu a pụtara ịnabata mmadụ, karịchaa dịka ọbịa. “Nabata” na-egosi nnabata ọma n'ụzọ doro anya.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs.
- source_word: χαίρων
  choice: jiri ọṅụ
  rationale: Nkebi ngwaa a na-egosi na ọṅụ so nnabata ahụ. “Jiri ọṅụ” na-echekwa echiche nke ime ihe n’ọṅụ ma na-ada nke ọma n’Igbo.
- source_word: καὶ ... καὶ
  choice: O wee ...
  rationale: Njikọ ndị a na-ejikọta omume ndị ahụ n’usoro akụkọ. “O wee” bụ ụzọ Igbo eke si aga n’ihu n’akụkọ, ebe usoro ngwaa ndị so ya na-egosi omume ndị ahụ n’otu ahịrị.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Nsụgharị ahụ na-ejigide ngwa ngwa o mere ihe ahụ, ụzọ ọ rịdatara, nnabata ọbịa, na ọṅụ ya.
