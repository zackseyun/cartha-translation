    issue: Awkward verbal construction
    rationale: “O wee mee ngwa ngwa rịdata” is understandable, but “mee ngwa ngwa” followed by “rịdata” is not the most natural Standard Igbo construction. “O wee gbadata ngwa ngwa” communicates the same prompt descent idiomatically.
  - severity: low
    issue: Footnote does not provide a meaningful alternative
    rationale: The current note merely makes a minor connective change and repeats essentially the same wording. A lexical alternative should offer a real, source-supported alternative such as “were ọṅụ nabata ya” for the manner phrase.
