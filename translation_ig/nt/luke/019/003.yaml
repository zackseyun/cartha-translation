translation_notes:
  register: E ji Standard Igbo dị mfe, nke ugbu a ma dị ùgwù mee ntụgharị ahụ. A họọrọ “ọ nọ na-agbalị” iji gosipụta mgbalị na-aga n’ihu, ma jiri “ọ dị mkpụmkpụ” mee ka ihe gbasara ogo ahụ doo ndị na-agụ akwụkwọ anya.
