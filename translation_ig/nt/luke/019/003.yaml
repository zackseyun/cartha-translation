  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: ig
  text: Ọ nọ na-agbalị ịhụ onye Jizọs bụ, ma o nweghị ike ịhụ ya n’ihi igwe mmadụ ahụ, n’ihi na ọ dị mkpụmkpụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a pụtara n’ụzọ nkịtị na ọ dị ntakịrị n’ogo ya; n’ebe a, ọ na-ekwu maka ịdị mkpụmkpụ, ọ bụghị afọ ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτει
  choice: ọ nọ na-agbalị
  rationale: Oge imperfect na-egosi mgbalị na-aga n’ihu; okwu a na-egosipụta nke ahụ n’Igbo nkịtị.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Infinitive a na-egosi ihe mgbalị ya chọrọ ime; “ịhụ” bụ ntụgharị doro anya.
- source_word: τίς ἐστιν
  choice: onye Jizọs bụ
  rationale: Nke a na-edobe ajụjụ banyere onye Jizọs bụ, n’ebughị ụzọ kpebie ma ọ bụ njirimara ya naanị ma ọ bụ ụdị onye ọ bụ.
- source_word: οὐκ ἠδύνατο
  choice: o nweghị ike
  rationale: Nke a bụ ụzọ Igbo dị ugbu a si ekwu enweghị ike ime ihe.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: n’ihi igwe mmadụ ahụ
  rationale: ἀπό n’ebe a na-egosi ihe gbochiri ya; “n’ihi” na-enye ihe kpatara ya n’ụzọ doro anya.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Njikọ a na-ewebata ihe mere igwe mmadụ ji gbochie ya ịhụ Jizọs.
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: ọ dị mkpụmkpụ
  rationale: Ọ bụ ezie na ἡλικία nwere ike ịmetụta afọ ndụ ma ọ bụ ogo ahụ, ọnọdụ igwe mmadụ na-egbochi ya ịhụ na-egosi na ihe a bụ ịdị mkpụmkpụ n’ogologo ahụ.
