id: LUK.19.28
reference: Luke 19:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: ig
  text: Mgbe o kwusịrị ihe ndị a, ọ gara n’ihu, na-arịgo Jerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe
  rationale: N’Igbo, ijikọ Καὶ na participle εἰπών dịka “Mgbe...” na-eme ka usoro ihe ndị mere doo anya n’enweghị ịgbakwụnye echiche ọhụrụ.
- source_word: εἰπὼν ταῦτα
  choice: o kwusịrị ihe ndị a
  rationale: “Kwusịrị” na-egosi na okwu ahụ buru ụzọ mee tupu ọ gawa; “ihe ndị a” na-edobe ịdị obosara nke ταῦτα kama ime ka ọ bụrụ naanị ‘okwu ndị a.’
- source_word: ἐπορεύετο
  choice: ọ gara
  rationale: N’akụkọ Igbo, “ọ gara” na-enye mmegharị akụkọ ahụ n’ụzọ eke. Ọnọdụ imperfect Grik na-egosi njem na-aga n’ihu, nke okwu ndị gbara ya gburugburu na-akọwapụta.
- source_word: ἔμπροσθεν
  choice: n’ihu
  rationale: Ọ na-edobe echiche nke ịga n’ihu ma ọ bụ ibu ụzọ, ma ọ naghị akpọpụta ndị ọ nọ n’ihu ebe Grik n’onwe ya akpọpụtaghị ha.
- source_word: ἀναβαίνων
  choice: na-arịgo
  rationale: Nke a na-edobe participle nke na-egosi ihe na-eme n’otu oge ahụ, nakwa okwu mgbago e ji kọwaa njem ahụ.
- source_word: εἰς Ἱεροσόλυμα
  choice: Jerusalem
  rationale: N’usoro “na-arịgo Jerusalem,” aha ebe ahụ na-egosi ebe njem ahụ na-aga n’ụzọ Igbo na-ada nke ọma, n’ebughị ụzọ kwuo na ọ banyelarị n’obodo ahụ.
theological_decisions:
- issue: Ma a ga-edobe okwu mgbago e ji kọwaa njem gaa Jerusalem
  choice: na-arịgo Jerusalem
  alternative: na-aga Jerusalem
  rationale: ἀναβαίνων pụtara ịrịgo n’ezie. Idebe ya na-echekwa ma ọdịdị ala nke njem ahụ ma ụda pụrụ iche nke akụkọ Luk, n’etinyeghị nkọwa okpukpe ọzọ n’amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ugwu. A hapụrụ “n’ihu” n’enweghị “ha” iji zere ịgbakwụnye onye nnọchiaha na-adịghị n’ihe odide Grik, ma ahịrịokwu ahụ ka na-ada nke ọma n’Igbo.
