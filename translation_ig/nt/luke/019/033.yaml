    issue: Footnote ends with “ná ndị mmadụ nwe nwa ịnyịnya ibu ahụ.”
    rationale: This lacks the copular/relative element needed for natural Igbo. “ná ndị mmadụ bụ ndị nwe...” clearly states that the referents are the animal’s human owners.
