  naturalness: The main text is fluent, clear Standard Igbo, with an appropriately direct narrative register. The footnote, however, contains an awkward alternative phrase and a minor grammatical deficiency in its final clause.
  terminology: “Ndị nwe ya” is the natural contextual term for the colt’s human proprietors. The alternative “masters” should be expressed as “ndị nna ukwu ya,” not “ndị nna ya ukwu,” which can be read differently. The Greek lexical explanation should identify the singular lexical sense more idiomatically.
