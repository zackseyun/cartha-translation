id: LUK.19.33
reference: Luke 19:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: ig
  text: Mgbe ha na-atọpụ nwa ịnyịnya ibu ahụ, ndị nwe ya[a] sịrị ha, “Gịnị mere unu ji na-atọpụ nwa ịnyịnya ibu ahụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nna ukwu ya.” Okwu Grik a bụ ụdị ọtụtụ nke okwu pụtara “onye nwe” ma ọ bụ “nna ukwu,” ma n’ebe a ọ na-ezo aka ná ndị mmadụ bụ ndị nwe nwa ịnyịnya ibu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυόντων
  choice: mgbe ha na-atọpụ
  rationale: Ọ bụ participle nke na-egosi ihe na-aga n’ihu n’otu oge ahụ ihe e kwuru mesịrị mere. “Na-atọpụ” dabara n’omume ịtọpụ anụmanụ e kere agbụ ma na-echekwa njikọ ya na λύετε.
- source_word: δὲ
  choice: mgbe
  rationale: N’ebe a δέ bụ njikọ dị nro na-akwalite akụkọ. N’Igbo, usoro “Mgbe ...” na-ejikọta ihe omume abụọ ahụ n'ụzọ eke, ya mere ọ dịghị mkpa ịgbakwunye “ma” ma ọ bụ “ọzọkwa.”
- source_word: αὐτῶν
  choice: ha
  rationale: Nnọchiaha a na-ezo aka ná mmadụ abụọ e kwuru okwu ha n’amaokwu ndị bu ụzọ; “ha” na-edebe ntụaka ahụ n’ebughị nkọwa ọzọ bata.
- source_word: πῶλον
  choice: nwa ịnyịnya ibu
  rationale: πῶλος pụtara nwa anụmanụ; ihe gbara amaokwu a gburugburu na-egosi na ọ bụ nwa ịnyịnya ibu. Nke a doro onye Igbo nke oge a anya karịa okwu nwere ike ịpụta ụdị anụmanụ ndị ọzọ.
- source_word: εἶπαν
  choice: sịrị
  rationale: Nke a bụ ihe nnọchi anya λέγω n’ụzọ kwụ ọtọ. Ọ bụ ezie na okwu na-esochi ya bụ ajụjụ, “sịrị” na-edebe ụdị ngwaa Grik ahụ.
- source_word: οἱ κύριοι αὐτοῦ
  choice: ndị nwe ya
  rationale: κύριοι ebe a na-ezo aka ná ndị mmadụ nwe anụmanụ ahụ, ọ bụghị aha nsọ ma ọ bụ utu aha Chineke. “Ndị nwe ya” bụ okwu Igbo doro anya ma dịrị eke.
- source_word: πρὸς αὐτούς
  choice: ha
  rationale: Mgbe “sịrị” gasịrị, Igbo na-eji nnọchiaha ihe “ha” egosi ndị a gwara okwu; nke a na-enye echiche πρός αὐτούς n'ụzọ eke.
- source_word: Τί
  choice: Gịnị mere
  rationale: N’agbanyeghị na τί bụ “gịnị” n’ụzọ nkịtị, n’usoro ajụjụ a ọ na-ajụ ihe kpatara omume ahụ; “Gịnị mere” na-egosipụta ya nke ọma.
- source_word: λύετε
  choice: unu ji na-atọpụ
  rationale: Ụdị present a na-egosi omume na-aga n’ihu. “Na-atọpụ” na-emegharị otu okwu e ji sụgharịa λυόντων ma chekwaa nkwughachi dị na Grik.
theological_decisions:
- issue: Ịsụgharị κύριοι n’ebe ọ na-ekwu maka ndị mmadụ nwe anụmanụ
  choice: ndị nwe ya
  alternative: ndị nna ya ukwu
  rationale: N’agbanyeghị na κύριος nwere ike ịpụta “Onyenwe anyị” ma ọ bụ “nna ukwu,” ebe a ọ bụ ọtụtụ mmadụ nwe nwa ịnyịnya ibu ahụ. “Ndị nwe ya” na-ezere ime ka okwu ahụ nwee echiche gbasara Chineke nke na-adịghị na gburugburu okwu a, ebe ndetu na-echekwa nsụgharị ọzọ nwere ike ịdị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E tinyere akara ndetu [a] n’akụkụ “ndị nwe ya,” bụ́ kpọmkwem okwu ndetu ahụ na-akọwa. A na-eji “nwa ịnyịnya ibu” mee ka ụdị anụmanụ a ghara ịdị mgbagwoju anya n’Igbo.
