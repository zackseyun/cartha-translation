  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: ig
  text: Ana m agwa unu na onye ọ bụla nwere ihe, a ga-enyekwu ya[a]; ma onye na-enweghị ihe, a ga-anapụ ya ọbụna ihe o nwere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ naanị, “a ga-enye ya.” Grik ekwughị kpọmkwem “ọzọ,” ọ bụ ezie na a na-aghọtakarị echiche mmụba a site n’ọnọdụ okwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ana m agwa unu
  rationale: Nke a na-egosipụta okwu Jizọs na-ekwu ozugbo n’asụsụ Igbo dị ugbu a, ma na-edobe nnọchiaha ọtụtụ nke ὑμῖν.
- source_word: παντὶ τῷ ἔχοντι
  choice: onye ọ bụla nwere ihe
  rationale: Articular participle ahụ na-arụ ọrụ dị ka aha onye n’ozuzu. E tinyere “ihe” dị ka mmejuokwu ebumpụta ụwa nke ngwaa “nwere” n’Igbo, n’agbanyeghị na Grik ekwughị kpọmkwem ihe ahụ.
- source_word: δοθήσεται
  choice: a ga-enyekwu ya
  rationale: Ọdịdị passive future pụtara “a ga-enye ya.” Mkpụrụokwu “-kwu” na-egosi mmụba a ghọtara site n’ọnọdụ ilu ahụ, ma ndetu ala peeji na-edobe nsụgharị nkịtị nke na-adịghị ekwupụta mmụba ahụ.
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: ma onye na-enweghị ihe
  rationale: “Ma” na-egosipụta ọdịiche nke δέ; nkebi “onye na-enweghị ihe” bụ ụzọ doro anya na nke ebumpụta ụwa isi kọwaa onye ahụ n’ozuzu.
- source_word: καὶ ὃ ἔχει
  choice: ọbụna ihe o nwere
  rationale: N’ebe a καί na-emesi okwu ike, ya mere “ọbụna” dabara karịa “ọzọkwa.” Nkebi ahụ na-ezo aka n’ihe onye ahụ nwere ugbu a.
- source_word: ἀρθήσεται
  choice: a ga-anapụ ya
  rationale: “Anapụ” na-egosipụta iwepụ ihe n’aka mmadụ ma ọ bụ ime ka ọ ghara inwe ya, nke dabara n’ọrụ passive nke αἴρω n’ebe a.
theological_decisions:
- issue: Ma okwu a bụ ụkpụrụ izugbe banyere mmụba na mfu, ka ọ bụ nkọwa ozizi pụrụ iche
  choice: A sụgharịrị ya dị ka okwu ilu dị mkpirikpi, n’etinyeghị nkọwa banyere nzọpụta, ọrụ ọma, ma ọ bụ akara aka.
  alternative: A pụrụ ịkọwa ya kpọmkwem dị ka ụkpụrụ banyere ilekọta ihe e nyere mmadụ n’ilu ahụ, ma ọ bụ dị ka ụkpụrụ sara mbara nke alaeze Chineke.
  rationale: Amaokwu ahụ anaghị akọwa usoro ozizi nke na-akpata inye ihe ma ọ bụ ịnara ya. Nsụgharị ahụ na-edobe mgbagwoju na ike okwu ahụ ka ọnọdụ gbara ya gburugburu duzie nkọwa ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “a ga-” maka passive na-akọwaghị onye na-eme ihe, nke na-edobe otu ụdị enweghị onye ọrụ a kpọrọ aha dị na Grik. Nnọchiaha “ya/o” na-arụ ọrụ n’ozuzu ma anaghị akwalite nkọwa ụka ọ bụla.
