source:
  edition: SBLGNT
  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: ig
  text: na-ekwu, sị, “Eze ahụ na-abịa n’aha Onyenwe anyị ka a gọziri agọzi![a] Udo dị n’eluigwe, ebube dịkwa n’ebe kachasị elu!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ nsụgharị na-agbaso okwu a maara nke ọma, ‘Onye na-abịa n’aha Onyenwe anyị bụ onye a gọziri agọzi,’ ma Luk kpọrọ onye ahụ ‘Eze’ kpọmkwem.
    reason: alternative_reading
  - marker: b
    text: 'Nke a na-eme ka Luk 2:14 bata n’uche, ma ebe udo ahụ dị agbanweela: n’ebe ahụ, ọ bụ ‘udo n’ụwa’; n’ebe a, ọ bụ ‘udo n’eluigwe.’'
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ bụ participle nke na-ejikọta mkpu ìgwè mmadụ ahụ na amaokwu gara aga; ‘na-asị’ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: Εὐλογημένος
  choice: Onye a gọziri agọzi
  rationale: Nke a na-echekwa ọdịdị ngọzi a na-ekwupụta banyere onye ahụ, kama ịtụgharị ya naanị ka otuto.
- source_word: ὁ ἐρχόμενος
  choice: nke na-abịa
  rationale: Ọ na-echekwa echiche participle dị ugbu a ma na-akọwa Eze ahụ n’ụzọ doro anya n’Igbo.
- source_word: βασιλεὺς
  choice: Eze ahụ
  rationale: Luk kpọrọ ya Eze kpọmkwem; ‘ahụ’ na-egosi na ọ bụ Eze a kapịrị ọnụ a na-atụ anya ya, ọ bụghị naanị otu eze ọ bụla.
- source_word: ἐν ὀνόματι κυρίου
  choice: n’aha Onyenwe anyị
  rationale: Nke a bụ akpaalaokwu Igbo kwesịrị ekwesị nke na-echekwa ma ndabere Semitic ya ma echiche nke ịbịa n’ikike Onyenwe anyị.
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: Udo dị n’eluigwe
  rationale: 'A gbakwụnyere ‘dị’ ka okwu ahụ wee bụrụ Igbo sitere n’ọnụ mmadụ, ma e debere kpọmkwem ebe udo ahụ dị: n’eluigwe.'
- source_word: δόξα ἐν ὑψίστοις
  choice: ebube dịkwa n’ebe kachasị elu
  rationale: Nke a na-echekwa usoro uri ahụ na nghọta sara mbara nke ὑψίστοις dị ka ebe kachasị elu, na-enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
theological_decisions:
- issue: Mkpu nke na-ekwupụta Eze Mesaịa mgbe ọ na-abanye
  choice: E debere βασιλεὺς kpọmkwem dịka ‘Eze ahụ.’
  alternative: ‘Onye na-abịa n’aha Onyenwe anyị bụ onye a gọziri agọzi,’ na-ahapụ ‘Eze.’
  rationale: Ihe odide Luk nwere βασιλεὺς n’onwe ya. Idebe ya na-echekwa nkwupụta ọchịchị eze nke Luk n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
- issue: Mmekọrịta okwu a na Luk 2:14
  choice: ‘Udo dị n’eluigwe’
  alternative: ‘Udo dị n’ụwa’
  rationale: Isi mmalite ahụ kwuru ‘n’eluigwe.’ A naghị eme ka ya na abụ ọmụmụ Jizọs kwekọọ, ka ọdịiche na esemokwu echiche Luk dere wee dịgide.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ ka nwere ọdịdị mkpu otuto, ma e zere asụsụ ụka nke otu denominashọn. E tinyere akara nkọwa ala peeji [a] na [b] n’ebe okwu ha na-akọwa dị n’ahịrịokwu ahụ.
