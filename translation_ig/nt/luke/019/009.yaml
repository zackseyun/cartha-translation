id: LUK.19.9
reference: Luke 19:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: ig
  text: Jizọs wee sị ya, “Taa, nzọpụta abịala n'ụlọ a[a], n'ihi na ya onwe ya kwa bụ nwa Ebraham.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ezinụlọ a.” Okwu Grik ahụ nwere ike ịpụta ụlọ ahụ n'onwe ya ma ọ bụ ndị ezinụlọ metụtara ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Jizọs wee sị
  rationale: “Wee” na-ejikọta okwu a na akụkọ bu ya ụzọ n'ụzọ dị nro, n'ebughị echiche esemokwu siri ike n'ime δέ.
- source_word: πρὸς αὐτὸν
  choice: sị ya
  rationale: Nke a na-edobe nnọchiaha nwoke dị na Grik, ghara ịtinye aha Zakiọs nke na-adịghị n'amaokwu a.
- source_word: Σήμερον
  choice: Taa
  rationale: Ọ bụ okwu Igbo nkịtị ma doo anya, tinyekwa mkpasi ike nke ọnọdụ okwu a n'isi ahịrịokwu.
- source_word: σωτηρία
  choice: nzọpụta
  rationale: “Nzọpụta” na-echekwa ibu echiche okpukpe okwu a nwere n'akwụkwọ Luk, karịa nanị nnapụta n'ihe ize ndụ.
- source_word: τῷ οἴκῳ τούτῳ
  choice: n'ụlọ a
  rationale: “Ụlọ” bụ ezigbo ihe kwekọrọ na οἶκος, ma n'Igbo ọ pụkwara ịgụnye ndị ezinụlọ bi na ya; nkọwa ala peeji na-echekwa ụzọ nghọta abụọ ahụ.
- source_word: ἐγένετο
  choice: abịala
  rationale: N'okwu a gbasara nzọpụta, “abịala” bụ Igbo sitere n'okike nke na-egosi na nzọpụta eruola ugbu a.
- source_word: καθότι
  choice: n'ihi na
  rationale: Ọ na-egosi ihe mere Jizọs ji kwuo nkwupụta ahụ n'ụzọ doro anya.
- source_word: καὶ αὐτὸς
  choice: nwoke a kwa
  rationale: “Kwa” na-echekwa echiche nke itinye ya n'etiti ndị ọzọ; “nwoke a” na-eme ka onye nnọchiaha ahụ na-arụtụ aka n'ebe ọ nọ doo anya n'Igbo.
- source_word: υἱὸς Ἀβραάμ
  choice: nwa Ebraham
  rationale: Ọ na-echekwa akpaalaokwu gbasara njirimara na ọgbụgba ndụ, n'emeghị ya naanị “mkpụrụ Ebraham” ma ọ bụ kpebie otu nkọwa.
theological_decisions:
- issue: Ihe “nwa Ebraham” pụtara
  choice: E debere akpaalaokwu ahụ dịka “nwa Ebraham,” n'akọwaghị ma ọ bụ naanị ọmụmụ anụ ahụ, ịbụ onye ezinụlọ okwukwe Ebraham, ma ọ bụ ha abụọ.
  alternative: “mkpụrụ Ebraham” ma ọ bụ “onye so n'ezinụlọ okwukwe Ebraham”
  rationale: Amaokwu ahụ n'onwe ya anaghị amanye otu nkọwa dị warara. Idebe akpaalaokwu ahụ na-echekwa esemokwu echiche okpukpe dị na ya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ akpaalaokwu “nwa Ebraham” ka ọ chekwaa ibu njirimara na ọgbụgba ndụ ya. Akara nkọwa [a] sochiri “sị ya” iji gosi na okwu Grik πρὸς αὐτόν nwere ike ịrụtụ aka n'onye ahụ ma ọ bụ, dịka nghọta metụtara οἶκος si dị, n'ezinụlọ ya.
