    issue: Footnote anchor and content do not correspond to the annotated source expression.
    rationale: The note concerns οἶκος in “ụlọ a,” but [a] follows “ya.” Further, “Ma ọ bụ, ‘gwara ndị ụlọ a’” changes the verbal relation rather than offering the lexical alternative “household.” The marker should follow “ụlọ a,” and the alternative should be “ezinụlọ a.”
  - severity: low
    issue: “Nwoke a kwa” adds a demonstrative not present in καὶ αὐτός.
    rationale: The Greek means “he too/he himself also.” “Ya onwe ya kwa” preserves the emphasis and inclusion without adding “this.”
