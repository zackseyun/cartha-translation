  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: ig
  text: Mgbe ọ kpọchara ndị ohu ya iri, o nyere ha mina iri, ọ sịrị ha, “Zụọnụ ahịa ruo mgbe m ga-abịa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Na-arụnụ ọrụ azụmahịa ruo mgbe m ga-abịa.” Mina bụ otu ụdị ego e ji eme ihe n'oge ochie.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: Mgbe ọ kpọchara
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; ntụgharị a na-egosipụta usoro ahụ n'Igbo eke.
- source_word: δούλους
  choice: ndị ohu
  rationale: N'ọnọdụ ilu a, okwu ahụ na-egosi ndị nọ n'okpuru onye nwe ha; “ndị ohu” na-echekwa mmekọrịta onye nwe na ohu nke Greek gosiri.
- source_word: ἑαυτοῦ
  choice: nke ya
  rationale: Nke a na-echekwa nkwusi ike nke nnọchiaha reflexive ahụ, ya bụ, na ha bụ ndị ohu nke ya onwe ya.
- source_word: μνᾶς
  choice: mina
  rationale: E debere aha ego oge ochie ahụ ka a ghara iji ụdị ego nke oge a dochie ya n'ụzọ na-eduhie eduhie.
- source_word: Πραγματεύσασθε
  choice: Jirinụ ego a zụọ ahịa
  rationale: Iwu ahụ chọrọ ka ha jiri ego e nyere ha rụọ ọrụ azụmahịa; okwu a bụ Igbo doro anya ma ghara ikwu kpọmkwem ụdị azụmahịa ha ga-eme.
- source_word: ἐν ᾧ ἔρχομαι
  choice: ruo mgbe m ga-alọghachi
  rationale: N'ọnọdụ a, akpaalaokwu Greek ahụ pụtara “ruo mgbe m ga-abịa/alọghachi”; “alọghachi” dabara n'ilu banyere onye na-apụ njem ma mesịa laghachi.
theological_decisions:
- issue: Otú e si atụgharị δοῦλος n'ilu nke onye nwe na ndị nọ n'okpuru ya
  choice: ndị ohu
  alternative: ndị na-ejere ya ozi
  rationale: “Ndị ohu” na-egosipụta mmekọrịta ọchịchị na inwe mmadụ nke dị n'ọnọdụ akụkọ a, ma ọ naghị etinye nkọwa ozizi pụrụ iche.
- issue: Ma ἔρχομαι ga-abụ “m ga-abịa” ka ọ bụ “m ga-alọghachi”
  choice: m ga-alọghachi
  alternative: m ga-abịa
  rationale: Ọnọdụ akụkọ ahụ na-egosi na nwoke ahụ gara mba dị anya ma ga-abịaghachi; “alọghachi” na-eme ka ntụaka ahụ doo anya n'enweghị ịgbanwe ihe ilu ahụ pụtara.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ndị ohu” chekwaa ọnọdụ mmekọrịta ọha mmadụ nke ederede Greek; e ji nkọwa ala peeji kọwaa mina na ụzọ ọzọ e nwere ike isi tụgharị iwu azụmahịa ahụ.
