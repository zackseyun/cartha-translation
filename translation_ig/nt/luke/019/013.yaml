revisions:
- from: Mgbe ọ kpọchara ndị ohu iri nke ya, o nyere ha mina iri[a], sị ha, “Jirinụ ego a zụọ ahịa ruo mgbe m ga-alọghachi.”[b]
  to: Mgbe ọ kpọchara ndị ohu ya iri, o nyere ha mina iri, ọ sịrị ha, “Zụọnụ ahịa ruo mgbe m ga-abịa.”[a]
  rationale: The revision removes an unexpressed demonstrative, translates ἔρχομαι with the direct Igbo equivalent “m ga-abịa,” and replaces a potentially reciprocal alternative with one that reflects commercial activity. Because the mina note naturally explains the term occurring in the same command, it is combined under the single correctly placed anchor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:28:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the calling of ten of the man's own slaves and the giving of ten minas. However, “ego a” (“this money”) is an unnecessary added demonstrative, and “m ga-alọghachi” (“I will return”) makes explicit a contextual inference where the Greek says simply “I come.” Rendering the latter as “m ga-abịa” preserves the source wording and its idiomatic temporal sense.
  naturalness: “Mgbe ọ kpọchara ndị ohu ya iri” and “Zụọnụ ahịa” are clear, natural Standard Igbo. The revised wording is concise and reads smoothly. The previous alternative “Na-azụrịtanụ ahịa” can suggest reciprocal trading among the slaves and is not a suitable alternative.
  terminology: “Ndị ohu” appropriately represents δούλους in this parabolic ownership setting. “Mina” correctly retains the historical monetary term, with a useful cultural note. “Zụọnụ ahịa” suitably conveys the commercial imperative Πραγματεύσασθε without specifying a particular business method.
  issues:
  - severity: medium
    issue: The command adds “ego a” (“this money”).
    rationale: Although the minas are the means with which the slaves are to conduct business, the Greek command does not contain a demonstrative or explicitly repeat “money.” Omitting it keeps the wording closer to the source without loss of sense.
  - severity: low
    issue: “M ga-alọghachi” translates ἔρχομαι as “I will return.”
    rationale: The wider parable supports a return, but this verse itself uses the ordinary verb “I come.” “M ga-abịa” retains the source expression and avoids making the contextual implication explicit.
  - severity: medium
    issue: The lexical-alternative footnote includes “Na-azụrịtanụ ahịa.”
    rationale: The reciprocal element in -rịta can imply trading with one another, which is not expressed by Πραγματεύσασθε. It should be replaced with a non-reciprocal business alternative.
  revised_text: Mgbe ọ kpọchara ndị ohu ya iri, o nyere ha mina iri, ọ sịrị ha, “Zụọnụ ahịa ruo mgbe m ga-abịa.”[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Na-arụnụ ọrụ azụmahịa ruo mgbe m ga-abịa.” Mina bụ otu ụdị ego e ji eme ihe n'oge ochie.
    reason: lexical_alternative
  revision_rationale: The revision removes an unexpressed demonstrative, translates ἔρχομαι with the direct Igbo equivalent “m ga-abịa,” and replaces a potentially reciprocal alternative with one that reflects commercial activity. Because the mina note naturally explains the term occurring in the same command, it is combined under the single correctly placed anchor.
