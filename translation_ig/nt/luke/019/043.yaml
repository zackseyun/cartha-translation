    text: Ma ọ bụ, “wuoro gị mgbidi agha e ji nọchibido.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an unclear expression for χάραξ with a natural, contextually accurate term for siege works. The footnote preserves the more specific “siege rampart” sense. “Kpachibido” better represents the final image of being confined from every direction, while retaining the Greek order, future force, and singular address.
