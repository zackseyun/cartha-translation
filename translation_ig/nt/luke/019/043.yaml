  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: ig
  text: N’ihi na ụbọchị ga-abịakwasị gị mgbe ndị iro gị ga-ewu ihe mgbochi nnọchibido megide gị, gbaa gị gburugburu, ma kpachibido gị n’akụkụ niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wuoro gị mgbidi agha e ji nọchibido.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Na-ejikọta amụma a na akwa arịrị Jizọs kwuru tupu ya, ma na-echekwa ike nke ihe kpatara ya.
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: ụbọchị ga-abịakwasị gị
  rationale: Na-echekwa akpaalaokwu amụma Grik na echiche nke ihe ga-eme n’ọdịnihu nke ga-erute Jerusalem.
- source_word: παρεμβαλοῦσιν
  choice: ga-ewuli
  rationale: N’ọnọdụ agha a, ngwaa ahụ na-ekwu maka ịrụ ma ọ bụ iwuli ihe e ji nọchibido obodo.
- source_word: οἱ ἐχθροί σου
  choice: ndị iro gị
  rationale: Ọ bụ ntụgharị doro anya nke okwu ahụ, na-edebekwa nnọchiaha onye nke abụọ otu.
- source_word: χάρακά
  choice: mkpọmkpọ ala agha
  rationale: Na-egosi ihe a na-ewuli maka nnọchibido n’asụsụ ndị mmadụ ga-aghọta, n’agbanyeghị na okwu Grik nwekwara ike ịpụta mgbidi ma ọ bụ ogige siri ike e ji nọchibido.
- source_word: σοι
  choice: megide gị
  rationale: Dative ahụ nwere echiche nke mmegide n’ọnọdụ a; ‘megide gị’ na-eme ka ebumnuche ọjọọ nke ihe owuwu ahụ doo anya.
- source_word: περικυκλώσουσίν σε
  choice: agbaa gị gburugburu
  rationale: Na-enye echiche agha nke ndị iro ịgba obodo ahụ gburugburu n’ụzọ kwụ ọtọ ma bụrụ Igbo ebumpụta ụwa.
- source_word: συνέξουσίν σε
  choice: mechibido gị
  rationale: Na-egosi na ndị iro ga-akpachi onye a na-agwa okwu, mee ka ọ ghara inwe ụzọ mgbapụ.
- source_word: πάντοθεν
  choice: si n’akụkụ niile
  rationale: Na-emesi nnọchibido zuru ezu site n’ebe niile ike.
theological_decisions:
- issue: Onye nnọchiaha onye nke abụọ otu na-ezo aka na ya n’akwa arịrị Jizọs banyere Jerusalem
  choice: E debere ‘gị’ dị ka onye otu, ebe a na-agwa Jerusalem okwu dị ka a ga-asị na ọ bụ mmadụ.
  alternative: A pụrụ ịkọwa ya n’ụzọ sara mbara dị ka ndị niile bi na Jerusalem.
  rationale: Nnọchiaha Grik niile bụ nke onye otu, nke kwekọrọ n’ịkpọ Jerusalem okwu dị ka mmadụ. Idebe ya otu a na-echekwa ọdịdị amụma na abụ nke okwu ahụ n’agbasaghị ihe ọ na-ezo aka na ya karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. ‘Mkpọmkpọ ala agha’ na-enye onyinyo ihe owuwu ndị agha, ebe nkọwa ala ala peeji na-echekwa ohere okwu Grik χάραξ nwere maka ụdị ihe mgbochi nnọchibido ndị ọzọ.
