review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal clause, Jesus looking upward, the urgent command, the causal γάρ, the dwelling, and the unqualified necessity of δεῖ. “Aghaghị m ịnọ” appropriately preserves the force of δεῖ without specifying its theological basis.
  naturalness: “Mee ngwa, rịdata” is understandable, but “gbadata ngwa ngwa” is more natural Standard Igbo for an urgent command to descend. “Bịarutere ebe ahụ” is also a smoother narrative form than “bịaruru ebe ahụ.”
  terminology: “Jizọs,” “Zakịọs,” “ụlọ,” and “aghaghị m” are suitable Standard Igbo forms. The footnote alternative “n’ezinụlọ gị” can misleadingly shift the immediate reference from Zacchaeus’s dwelling to his family or household; retain a dwelling-focused alternative.
  issues:
  - severity: low
    issue: The imperative phrase is somewhat awkward.
    rationale: Replacing “mee ngwa, rịdata” with “gbadata ngwa ngwa” gives natural Igbo urgency while retaining the command to descend.
  - severity: low
    issue: The οἶκος footnote includes “n’ezinụlọ gị.”
    rationale: Although οἶκος can sometimes concern a household, in this immediate context Jesus says he will stay at Zacchaeus’s dwelling. “N’ebe obibi gị” is the safer lexical alternative.
  revised_text: Mgbe Jizọs bịarutere ebe ahụ, o leliri anya elu wee sị ya, “Zakịọs, gbadata ngwa ngwa, n’ihi na taa aghaghị m[a] ịnọ n’ụlọ gị[b].”
