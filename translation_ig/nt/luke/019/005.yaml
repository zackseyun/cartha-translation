revisions:
- from: Mgbe Jizọs bịaruru ebe ahụ, o leliri anya elu wee sị ya, “Zakịọs, mee ngwa, rịdata, n’ihi na taa aghaghị m[a] ịnọ n’ụlọ gị[b].”
  to: Mgbe Jizọs bịarutere ebe ahụ, o leliri anya elu wee sị ya, “Zakịọs, gbadata ngwa ngwa, n’ihi na taa aghaghị m[a] ịnọ n’ụlọ gị[b].”
  rationale: The revision improves idiomatic Standard Igbo without changing the meaning. It preserves the source’s urgency, Jesus’s necessary staying, and the immediate reference of οἶκος to Zacchaeus’s dwelling. Footnote markers remain correctly attached to δεῖ and οἶκος.
  reviewer_model: gpt-5.6-terra
