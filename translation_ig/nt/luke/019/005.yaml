    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “n’ebe obibi gị.”
    reason: lexical_alternative
  revision_rationale: The revision improves idiomatic Standard Igbo without changing the meaning. It preserves the source’s urgency, Jesus’s necessary staying, and the immediate reference of οἶκος to Zacchaeus’s dwelling. Footnote markers remain correctly attached to δεῖ and οἶκος.
