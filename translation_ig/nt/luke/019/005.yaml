  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: ig
  text: Mgbe Jizọs bịarutere ebe ahụ, o leliri anya elu wee sị ya, “Zakịọs, gbadata ngwa ngwa, n’ihi na taa aghaghị m[a] ịnọ n’ụlọ gị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “aghaghị” (δεῖ) nwere ike igosi mkpa metụtara ozi Jizọs ma ọ bụ nzube Chineke.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “n’ebe obibi gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Mgbe
  rationale: N’usoro akụkọ a, ὡς na-ewebata ihe mere n’otu oge; “Mgbe” bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche ya.
- source_word: ἐπὶ τὸν τόπον
  choice: bịaruru ebe ahụ
  rationale: Nke a na-egosi ebe ahụ a maara site n’ihe gbara ya gburugburu; “ebe ahụ” na-ada nke ọma n’Igbo ma na-echekwa nkọwa ọnọdụ ahụ.
- source_word: ἀναβλέψας
  choice: o leliri anya elu
  rationale: Ọ na-egosi na Jizọs tụgharịrị anya ya n’elu, ebe Zakịọs nọ n’osisi.
- source_word: εἶπεν πρὸς αὐτόν
  choice: wee sị ya
  rationale: Nke a bụ usoro okwu Igbo nkịtị na nke doro anya maka ịgwa mmadụ okwu.
- source_word: Ζακχαῖε
  choice: Zakịọs
  rationale: E ji ụdị aha a nke a na-ahụkarị n’Igbo depụta aha Grik ahụ.
- source_word: σπεύσας κατάβηθι
  choice: mee ngwa, rịdata
  rationale: Ọ na-echekwa ngwa ngwa dị n’iwu Grik ahụ ma na-ada ka iwu e nyere kpọmkwem n’Igbo.
- source_word: σήμερον γὰρ
  choice: n’ihi na taa
  rationale: “N’ihi na” na-egosipụta na γάρ na-enye ihe mere e ji nye iwu ahụ.
- source_word: ἐν τῷ οἴκῳ σου
  choice: n’ụlọ gị
  rationale: οἶκος n’ebe a bụ ebe obibi Zakịọs; “n’ụlọ gị” bụ okwu Igbo doro anya ma dị ndụ.
- source_word: δεῖ
  choice: aghaghị m
  rationale: “Aghaghị m” na-echekwa ike nke mkpa ma ọ bụ ihe dị mkpa ga-emerịrị, n’enweghị ịkọwa kpọmkwem ihe kpatara mkpa ahụ.
- source_word: μεῖναι
  choice: ịnọ
  rationale: μένω n’ebe a pụtara ịnọgide ma ọ bụ nọrọ n’ebe mmadụ; “ịnọ” dabara nleta ma nwee ike ịgụnye ịrahụ ebe ahụ.
theological_decisions:
- issue: Ike okwu δεῖ n’akụkọ Luk
  choice: aghaghị m
  alternative: ọ dị m mkpa ka m; m ga-anọrịrị
  rationale: N’akwụkwọ Luk, δεῖ nwere ike igosi mkpa metụtara ozi Jizọs ma ọ bụ nzube Chineke. “Aghaghị m” na-echekwa ike na mgbagwoju anya ahụ n’ebughị nkọwa nkà mmụta okpukpe karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke ugwu ma dị mfe nghọta, mee ihe. “Mee ngwa, rịdata” na-enye iwu ahụ ume n’enweghị asụsụ ochie; “aghaghị m” na-echekwa mkpa siri ike dị n’ederede Grik.
