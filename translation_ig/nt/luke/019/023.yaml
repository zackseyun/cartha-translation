review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the rebuke, depositing the master's money, and the counterfactual recovery with interest. However, «tinyenyeghị» is not the natural past-negative form for this sense, and «lọtara» adds the nuance ‘returned,’ whereas the Greek simply says ‘having come.’
  naturalness: «Gịnịkwa mere na» is understandable, but «Gịnị mere i tinyeghị…» is more idiomatic and direct in Standard Igbo. «M bịara» naturally renders the temporal participle without adding ‘back/return.’ «anakọta ya na ọmụrụ nwa» is clear in this commercial context.
  terminology: «ụlọ akụ» and «ọmụrụ nwa» are appropriate modern Standard Igbo financial terms. A footnote is retained at «ụlọ akụ» to preserve the source’s table/banker wording and the English audit trail’s lexical alternative.
  issues:
  - severity: medium
    issue: Verb form «i tinyenyeghị»
    rationale: For ‘you did not put/deposit,’ Standard Igbo naturally uses «i tinyeghị». The draft form is morphologically and idiomatically unsuitable here.
  - severity: low
    issue: «m lọtara» specifies returning
    rationale: The Greek ἐλθών means ‘having come’; although return is contextually conceivable, it is not stated and should not be added in the main text.
  - severity: low
    issue: No footnote for τράπεζα
    rationale: The main rendering «ụlọ akụ» is sound, but a footnote preserves the literal banking-table imagery and the alternate ‘bankers’ sense.
  revised_text: Gịnị mere i tinyeghị ego m n’ụlọ akụ[a]? Mgbe m bịara, m gaara anakọta ya na ọmụrụ nwa.
  revised_footnotes:
