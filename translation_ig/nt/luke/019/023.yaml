  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: ig
  text: Gịnị mere i tinyeghị ego m n’ụlọ akụ[a]? Mgbe m bịara, m gaara anakọta ya na ọmụrụ nwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nye ndị na-ahụ maka ego ego m”; n’ụzọ nkịtị, “nye ego m n’elu tebụl.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: Gịnịkwa mere
  rationale: Ọ bụ ajụjụ na-achọ ihe kpatara omume ahụ ma na-edobekwa ụda ịba mba dị n'okwu Grik.
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: i tinyenyeghị ... n’ụlọ akụ
  rationale: N'ụzọ nkịtị, okwu a bụ itinye ego 'n'elu tebụl,' ma n'ọnọdụ azụmahịa a τράπεζα na-ezo aka n'ebe ndị na-edebe ma na-agbazinye ego; 'itinye n’ụlọ akụ' bụ Igbo doro anya nke oge a.
- source_word: μου τὸ ἀργύριον
  choice: ego m
  rationale: ἀργύριον nwere ike ịpụta ọlaọcha, ma n'ilu azụmahịa a ọ pụtara ego; 'ego m' bụ okwu Igbo kachasị doo anya.
- source_word: κἀγὼ ἐλθὼν
  choice: Mgbe ahụ, mgbe m lọtara
  rationale: A tụgharịrị participle ahụ ka ọ bụrụ nkebiokwu oge n'Igbo; 'Mgbe ahụ' na-egosi ihe gaara esochi itinye ego ahụ n'ụlọ akụ.
- source_word: σὺν τόκῳ
  choice: na ọmụrụ nwa
  rationale: N'ebe a τόκος bụ ego na-abawanye n'elu ego e tinyere; 'ọmụrụ nwa' bụ okwu Igbo a na-ejikarị eme ihe maka interest.
- source_word: αὐτὸ ἔπραξα
  choice: m gaara anakọtaghachi ya
  rationale: N'ọnọdụ ego a, πράσσω pụtara ịnara ma ọ bụ ịnakọta ego kwesịrị ịkwụ; ụdị 'gaara' na-egosipụta ọnọdụ a na-emezughị nke ἄν na-ebute.
