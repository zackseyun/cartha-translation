    text: Ma ọ bụ, “nye ndị na-ahụ maka ego ego m”; n’ụzọ nkịtị, “nye ego m n’elu tebụl.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the deposit verb, avoids importing the unstated idea of returning, and keeps the Greek counterfactual result and financial terminology. The footnote supplies the literal and contextual alternative for τράπεζα without burdening the main text.
