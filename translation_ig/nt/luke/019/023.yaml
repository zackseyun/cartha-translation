translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E jighị nkọwa nkịtị ''n''elu tebụl'' n''ahịrị isi n''ihi na ọ ga-agbagwoju onye na-agụ Igbo anya; e nyefere echiche akụ na ụba ya kpọmkwem. Enweghị akara ndetu ala peeji n''ihi na ndetu Bekee e nyere yiri ka akara [a] ya adịghị n''ebe kwesịrị ekwesị: ihe ndetu ahụ metụtara ''bank,'' ọ bụghị ''when I came.'''
