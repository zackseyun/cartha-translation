  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: ig
  text: Ọ sịrị ndị nọ ebe ahụ, “Werenụ mina ahụ n'aka ya[a], nyekwa onye nwere mina iri ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka nsụgharị ọdịnala si kwuo, “paụnd.” Okwu Grik a na-ekwu maka otu ego oge ochie a na-akpọ mina.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεστῶσιν
  choice: ndị guzo n'akụkụ ya
  rationale: Nkebiokwu a na-egosi ndị nọ ebe ahụ, guzo nso; nsụgharị a na-echekwa ihe a na-ahụ anya n'ọnọdụ ahụ ma bụrụkwa Igbo nkịtị.
- source_word: Ἄρατε ... ἀπ’ αὐτοῦ
  choice: Napụnụ ya
  rationale: N'ebe a αἴρω tinyere ἀπό na-egosi iwepụ ihe n'aka mmadụ; ‘napụnụ ya’ na-enye iwu ahụ n'ụzọ doro anya ma dịrị Igbo mma.
- source_word: μνᾶν
  choice: mina
  rationale: Mina bụ aha otu ego oge ochie; idebe aha ahụ na-echekwa ọnọdụ akụkọ ihe mere eme ma zere ime ka ọ dị ka ego ọgbara ọhụrụ.
- source_word: δότε
  choice: nyekwa
  rationale: Ọ bụ iwu ka e nye onye ọzọ ihe ahụ; ‘nyekwa’ jikọtara iwu nke abụọ ahụ nke ọma na nke mbụ.
- source_word: τῷ ... ἔχοντι
  choice: onye nwere
  rationale: Nke a na-asụgharị participle nwere article dịka onye a na-ekwu maka ya, na-agbakwunyeghị nwoke ma ọ bụ nkọwa ọzọ na-adịghị na Grik.
- source_word: τὰς δέκα μνᾶς
  choice: mina iri ahụ
  rationale: ‘Ahụ’ na-anọchi article Grik ma na-egosi ego iri ahụ e kwuburu okwu banyere ya.
theological_decisions:
- issue: Nsụgharị μνᾶ dịka otu ego
  choice: mina
  alternative: paụnd
  rationale: ‘Mina’ na-edobe aha otu ego oge ochie dị na Grik; ‘paụnd’ nwere ike ime ka onye na-agụ ya chee banyere ego ma ọ bụ ibu nke oge a.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma nwee nsọpụrụ. ‘Ndị guzo n'akụkụ ya’ na-echekwa ọdịdị ihe a na-ahụ anya na παρεστῶσιν; usoro iwu ‘Napụnụ ... nyekwa ...’ na-ada ka okwu Igbo e ji enye ọtụtụ mmadụ iwu.
