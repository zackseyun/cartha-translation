review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the ancient monetary unit mina and represents the two plural imperatives. However, the second command, “nyekwa ya onye nwere mina iri ahụ,” is not source-faithful in Igbo syntax: ya (''him'') introduces an unintended recipient/object relation, whereas Greek gives the mina to the person who has ten minas.'
  naturalness: “Ndị guzo n'akụkụ ya” is possible, but it adds ya ('him') and is narrower than παρεστῶσιν, which simply identifies people present/standing by. “Ndị nọ ebe ahụ” is natural Standard Igbo and avoids that addition. “Werenụ mina ahụ n'aka ya” is a clear, idiomatic plural command for taking the mina away from him.
  terminology: Mina is appropriately retained as the name of the ancient monetary unit. The traditional alternative paụnd is suitably confined to the footnote.
  issues:
  - severity: medium
    issue: The phrase “nyekwa ya onye nwere mina iri ahụ” contains an extra ya.
    rationale: The Greek command δότε τῷ ... ἔχοντι means 'give [it] to the one who has ...'; it does not contain a pronoun corresponding to ya. In Igbo, the drafted wording is also syntactically unclear and can suggest giving 'him' a person.
  - severity: low
    issue: “n'akụkụ ya” adds a possessive/pronominal element not explicit in παρεστῶσιν.
    rationale: The participle means those present or standing by. A neutral expression avoids unnecessarily locating them specifically beside him.
  revised_text: Ọ sịrị ndị nọ ebe ahụ, “Werenụ mina ahụ n'aka ya[a], nyekwa onye nwere mina iri ahụ.”
