id: LUK.19.37
reference: Luke 19:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: ig
  text: Ka ọ na-eruolarị nso n'ebe mkpọda Ugwu Oliv dị, ìgwè ndị na-eso ụzọ ya niile malitere iji ọṅụ na oké olu too Chineke n'ihi ọrụ ndị dị ike niile ha hụrụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọrụ ebube” ma ọ bụ “ọrụ ike.” Okwu Grik ahụ nwere ike ịpụta ike, ma ọ bụ ọrụ ndị na-egosi ike Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: Mgbe ọ na-eruwela nso
  rationale: Nkebiokwu a na-enye ọnọdụ oge ma na-egosi na ọ nọ n’ịbịaru nso; “na-eruwela nso” na-echekwa ma mmegharị ahụ ma ἤδη (“ugbua/eruwela”).
- source_word: πρὸς τῇ καταβάσει
  choice: n'ebe mkpọda ... dị
  rationale: Nke a na-egosi ebe dị nso n’ụzọ ugwu ahụ si arịda, n’ebughị amụma kpọmkwem banyere ọdịdị ala ahụ.
- source_word: τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: Ugwu Oliv
  rationale: Nke a bụ aha ebe ahụ a na-aghọta nke ọma n’Igbo, ma na-ezere ịkọwa ya dịka ugwu osisi oliv n’ahịrịokwu ahụ.
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: ìgwè ndị na-eso ụzọ ya niile
  rationale: “Ìgwè” na-egosi nnukwu ọnụ ọgụgụ, ebe “niile” na-echekwa ike okwu ἅπαν; “ya” na-eme ka Igbo doo anya n’enweghị ịgbanwe ndị a na-ekwu maka ha.
- source_word: χαίροντες ... αἰνεῖν τὸν θεὸν
  choice: malitere iji ọṅụ ... too Chineke
  rationale: “Iji ọṅụ” na-egosipụta χαίροντες dịka ụzọ ha si too Chineke, ebe “malitere ... too” na-echekwa ἤρξαντο na infinitive ya n’Igbo dị ire ụtọ.
- source_word: φωνῇ μεγάλῃ
  choice: na oké olu
  rationale: Nke a bụ ụzọ Igbo si ekwu n'ụzọ doro anya na olu ha dara ụda nke ukwuu.
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: n'ihi ọrụ ike niile ha hụrụ[a]
  rationale: “Ọrụ ike” na-echekwa echiche nke omume ndị na-egosipụta ike, kama ime ka δυνάμεις bụrụ naanị otu okwu teknụzụ maka ọrụ ebube; ndetu ala na-akọwa nhọrọ ndị ọzọ.
theological_decisions:
- issue: Nsụgharị δυνάμεις n’ọnọdụ ọrụ ebube
  choice: ọrụ ike
  alternative: ọrụ ebube; ọrụ ndị dị ike
  rationale: δυνάμεις nwere ike ịpụta ngosipụta ike, ọrụ ndị dị ike, ma ọ bụ ọrụ ebube. “Ọrụ ike” na-echekwa obosara okwu Grik ahụ na njikọ ya na ike, ebe ndetu na-eme ka onye na-agụ mara na ọrụ ebube so n’ihe ọ pụrụ ịpụta.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-aga dịka akụkọ nkịtị n’Igbo; e debere okwu nkọwa [a] ozugbo n’akụkụ “ọrụ ike,” bụ okwu ọ na-akọwa.
