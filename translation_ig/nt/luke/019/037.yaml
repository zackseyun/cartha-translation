    text: A pụkwara ịsị, “ọrụ ebube” ma ọ bụ “ọrụ ike.” Okwu Grik ahụ nwere ike ịpụta ike, ma ọ bụ ọrụ ndị na-egosi ike Chineke.
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s syntax and narrative register, while using the more idiomatic “ọrụ ndị dị ike” for the plural δυνάμεις. The footnote is revised for clear, natural Standard Igbo and continues to preserve the lexical alternatives without narrowing the term to miracles alone.
