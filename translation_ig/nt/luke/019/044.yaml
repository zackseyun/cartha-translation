source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: ig
  text: 'ha ga-akwatu gị na ụmụ gị ndị nọ n’ime gị ruo n’ala. Ha agaghị ahapụ otu nkume n’elu nkume ọzọ n’ime gị, n’ihi na ị mataghị oge nleta gị.[a]


    [a] A pụkwara ịtụgharị ya, “oge nnyocha gị.” Okwu Grik ahụ nwere ike ịpụta nleta ma ọ bụ nnyocha, karịsịa nleta Chineke; nleta dị otú ahụ nwere ike iweta ebere ma ọ bụ ikpe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “oge nnyocha gị.” Okwu Grik ahụ nwere ike ịpụta nleta ma ọ bụ nnyocha, karịsịa nleta Chineke; nleta dị otú ahụ nwere ike iweta ebere ma ọ bụ ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: ha ga-akwatu gị ruo n’ala
  rationale: Nkebi a na-egosi ịkwatu ihe kpamkpam ruo n’ala. Nsụgharị a bụ Igbo dị mfe ma na-edobe ike dị n’okwu Grik ahụ.
- source_word: σε
  choice: gị
  rationale: A na-agwa Jerusalem okwu dị ka mmadụ. Iji “gị” na-edobe ihe atụ ahụ kama ịkọwa ya dị ka “obodo gị.”
- source_word: τὰ τέκνα σου ἐν σοί
  choice: ụmụ gị ndị nọ n’ime gị
  rationale: τέκνα pụtara “ụmụ.” N’agbanyeghị na ọ na-ezo aka n’ụmụ mmadụ bi na Jerusalem, nsụgharị a na-edobe onyinyo Jerusalem dị ka nne.
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: Ha agaghị ahapụ otu nkume n’elu nkume ọzọ n’ime gị
  rationale: Nke a na-egosi mbibi zuru ezu. “Otu nkume n’elu nkume ọzọ” bụ ụzọ doro anya e si kwuo ya n’Igbo, ebe “n’ime gị” na-edobe okwu e ji agwa Jerusalem.
- source_word: ἀνθ’ ὧν
  choice: n’ihi na
  rationale: N’ebe a nkebi ahụ na-enye ihe kpatara ikpe ahụ; “n’ihi na” na-egosipụta njikọ ahụ nke ọma.
- source_word: ἔγνως
  choice: ị mataghị
  rationale: γινώσκω nwere ike ịpụta ịma ma ọ bụ ịghọta/ịmata ihe mgbe ọ pụtara. “Ị mataghị” bụ okwu Igbo nkịtị nke na-egosi na Jerusalem aghọtaghị ihe Chineke na-eme n’oge ahụ.
- source_word: καιρὸν
  choice: oge
  rationale: καιρός bụ oge pụrụ iche ma ọ bụ oge a kara aka. “Oge” dị nkenke ma bụrụkwa okwu Igbo ebumpụta ụwa; ịdị mkpa ya pụtara site na nkebi so ya.
- source_word: τῆς ἐπισκοπῆς σου
  choice: oge nleta gị
  rationale: ἐπισκοπή nwere ike ịpụta nleta, nnyocha, ma ọ bụ nlekọta. “Nleta gị” na-edobe echiche banyere nleta Chineke n’emeghị ka o doo anya naanị ma nleta ahụ bụ nke ebere ka ọ bụ nke ikpe.
theological_decisions:
- issue: Ihe ἐπισκοπή pụtara n’ọnọdụ ikpe a
  choice: “nleta” ka e ji sụgharịa ya, ebe a hapụrụ onye na-eleta na ụdị ihe nleta ahụ ga-eweta ka ha ghara ịkọwa karịa ihe odide Grik kwuru
  alternative: “nnyocha,” ma ọ bụ “oge Chineke letara gị”
  rationale: Okwu ahụ nwere ike ịpụta nleta Chineke nke na-eweta ebere ma ọ bụ ikpe. Ihe gbara amaokwu ahụ gburugburu na-egosi ikpe Jerusalem, ma aha Grik ahụ akọwaghị ihe niile n’onwe ya. Ya mere, “nleta” na-edobe esemokwu na obosara echiche ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ Jerusalem ka a na-agwa ya okwu dị ka mmadụ, ma debeekwa onyinyo ụmụ ya nọ n’ime ya. Akara ntụaka [a] dị n’akụkụ “nleta gị,” bụ ebe okwu ọzọ ahụ metụtara.
