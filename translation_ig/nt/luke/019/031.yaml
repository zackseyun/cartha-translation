  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: ig
  text: 'Ọ bụrụkwa na onye ọ bụla ajụọ unu, ‘Gịnị mere unu ji atọpụ ya?’ unu ga-ekwu otu a: ‘Onyenweanyị[a] chọrọ ya.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye nwe ya chọrọ ya.”
    reason: N’ọnọdụ a, κύριος αὐτοῦ pụkwara ịpụta onye nwe nwa ịnyịnya ibu ahụ; ederede bụ isi na-eji “Onyenweanyị” dịka aha nsọpụrụ.
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: ajụọ
  rationale: ‘Jụọ’ bụ okwu Igbo a na-ejikarị ekwu ịjụ ajụjụ; ụdị njikọ ‘ajụọ’ dabara n’ahịrịokwu ọnọdụ a.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si ajụ ‘n’ihi gịnị?’ ma ọ bụ ‘maka gịnị?’
- source_word: λύετε
  choice: unu ji atọpụ ya
  rationale: N’ọnọdụ a, λύω pụtara ịtọpụ nwa ịnyịnya ibu e kere eke; ‘ya’ mere ihe a na-ekwu maka ya doo anya, ọ bụ ezie na e kwughị ya kpọmkwem n’asụsụ Grik.
- source_word: οὕτως
  choice: otu a
  rationale: Ọ na-egosi kpọmkwem ihe ha ga-aza; ‘unu ga-ekwu otu a’ bụ Igbo dị mfe ma na-edobe usoro okwu Grik.
- source_word: ἐρεῖτε
  choice: unu ga-ekwu
  rationale: Ọdịnihu a nwere ike iwu ma ọ bụ ntụziaka n’ọnọdụ a; ‘ga-ekwu’ na-eburu ike ntụziaka ahụ n’Igbo.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-ejikarị sụgharị κύριος mgbe ọ na-ezo aka n’ebe Jizọs nọ, ma na-edobe ụda okpukpe okwu ahụ.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha a kacha dabara na nwa ịnyịnya ibu ahụ a na-atọpụ; Igbo na-egosipụta ihe a chọrọ site na ‘chọrọ ya.’
- source_word: χρείαν ἔχει
  choice: chọrọ ya
  rationale: Ọ bụ ụzọ Igbo dị ndụ na nke doro anya isi kwuo na mmadụ nwere mkpa ihe ahụ, na-enweghị ime ka ahịrịokwu ahụ sie ike n’ụzọ na-adịghị eke.
theological_decisions:
- issue: Ihe Ὁ κύριος na-ezo aka na ya na Luke 19:31
  choice: Onyenwe anyị
  alternative: Onye nwe ya / nna ya ukwu
  rationale: N’akụkọ Luk, κύριος nwere ike ịbụ aha nsọpụrụ e ji ezo aka na Jizọs. ‘Onyenwe anyị’ na-edobe nghọta ahụ na ụda okpukpe ya, ebe nkọwa ala peeji na-egosi na a pụkwara ịghọta ya dị ka onye nwe anụmanụ ahụ ma ọ bụ nna ukwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù, dee ya. E debere ụdị ahịrịokwu ọnọdụ na ntụziaka nke Grik, ma mee ihe a na-atọpụ ka ọ doo anya site n’iji ‘ya.’
