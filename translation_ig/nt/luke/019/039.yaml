  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: ig
  text: Ụfọdụ ndị Farisii si n’ìgwè mmadụ ahụ sịrị ya[a], “Onye Ozizi[b], baara ndị na-eso ụzọ gị mba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ụfọdụ ndị Farisii nọ n’etiti ìgwè mmadụ ahụ sịrị ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Nna Ukwu, baara ndị na-eso ụzọ gị mba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: Ụfọdụ ndị Farisii
  rationale: “Ụfọdụ” na-egosi otu akụkụ a na-akọwaghị kpọmkwem n’etiti ndị Farisii, ma ọ bụkwa okwu Igbo doro anya ma dị mfe.
- source_word: ἀπὸ τοῦ ὄχλου
  choice: nọ n’etiti ìgwè mmadụ ahụ
  rationale: ἀπό na-egosi ebe ha si pụta ma ọ bụ ebe ha nọ; n’ọnọdụ a, okwu a na-egosi na ndị Farisii ahụ so n’ìgwè mmadụ ahụ. Nsụgharị a na-eme ka nke ahụ doo anya n’Igbo n’enweghị ịgbakwụnye echiche ọzọ.
- source_word: εἶπαν πρὸς αὐτόν
  choice: sịrị ya
  rationale: Nke a bụ ụzọ Igbo nkịtị na nkenke si akọ na ha gwara ya okwu.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ na-egosipụta onye na-akụzi ihe, bụ isi ihe διδάσκαλος pụtara, n’enweghị itinye echiche ọchịchị ma ọ bụ nkwupụta okwukwe siri ike karịa ihe odide ahụ kwuru.
- source_word: ἐπιτίμησον
  choice: baara … mba
  rationale: Akpaalaokwu Igbo a na-egosipụta iwu ka e jiri okwu siri ike dọọ mmadụ aka ná ntị ma ọ bụ katọọ ya; ọ naghị akọwa ya naanị dị ka imechi ha ọnụ.
- source_word: τοῖς μαθηταῖς σου
  choice: ndị na-eso ụzọ gị
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa μαθηταί, ma na-echekwa mmekọrịta dị n’etiti onye ozizi na ndị na-amụta ihe n’aka ya.
theological_decisions:
- issue: Aha nkwanye ùgwù Διδάσκαλε e ji kpọọ Jizọs
  choice: Onye Ozizi
  alternative: Nna Ukwu
  rationale: N’ebe a, okwu Grik ahụ na-elekwasị anya n’ọrụ ịkụzi ihe, ọ bụghị n’ịkpọsa kpọmkwem ọkwa Kraịst. “Onye Ozizi” na-echekwa ihe ndị kwuru n’enweghị itinye nkwupụta nkà mmụta okpukpe ọzọ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. “Baara … mba” bụ akpaalaokwu nkịtị ma sie ike nke ọma; “ndị na-eso ụzọ” na-agbaso okwu Agba Ọhụrụ a maara nke ọma.
