  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: ig
  text: Ka ọ na-abịaru nso[a], ọ hụrụ obodo ahụ, kwaara ya ákwá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ọ bịaruru nso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἤγγισεν
  choice: Mgbe ọ na-eru nso
  rationale: Nkebi a na-egosi oge na mmegharị ya ka ọ na-abịaru nso, n’akọwaghị ihe ọ na-erute ebe ihe gbara amaokwu ahụ gburugburu mere ka o doo anya.
- source_word: ἰδὼν
  choice: ọ hụrụ
  rationale: Ụdị ngwaa a nwere ike igosi ihe mere n’otu oge ahụ ma ọ bụ obere oge tupu ngwaa bụ isi; Igbo nkịtị na-egosipụta njikọ a nke ọma site n’usoro ‘ọ hụrụ ... kwaakwa.’
- source_word: τὴν πόλιν
  choice: obodo ahụ
  rationale: πόλις pụtara obodo; ‘ahụ’ na-ezo aka n’obodo a marala n’ihe gbara amaokwu ahụ gburugburu, n’etinyeghị ‘Jerusalem’ nke na-anọghị kpọmkwem n’ederede a.
- source_word: ἔκλαυσεν
  choice: kwaakwa ákwá
  rationale: κλαίω pụtara ịkwa ákwá; ntụgharị a bụ Igbo doro anya ma dị ùgwù, na-agbakwụghị ike mmetụta ahụ karịa ihe okwu Grik kwuru.
- source_word: ἐπ’ αὐτήν
  choice: n’ihi ya
  rationale: Mgbe ọ na-eso κλαίω, ἐπί na accusative na-egosi onye ma ọ bụ ihe a na-akwara ákwá. ‘N’ihi ya’ bụ ụzọ Igbo ebumpụta ụwa si egosi na obodo ahụ bụ isi ihe kpatara akwa ahụ; footnote na-echekwa ohere nke ịkpọ obodo ahụ dịka nwanyị.
theological_decisions:
- issue: Ma a ga-echekwa ụdị nwanyị nke πόλις na nnọchiaha
  choice: Jiri ‘ya,’ nke na-adịghị egosi nwoke ma ọ bụ nwanyị n’Igbo
  alternative: Kọwaa obodo ahụ dịka nwanyị, ‘n’ihi nwanyị ahụ’ ma ọ bụ ‘n’ihi ya dịka nwanyị’
  rationale: Nnọchiaha Igbo ‘ya’ anaghị ekewa nwoke na nwanyị, ya mere ọ na-asụ Igbo ebumpụta ụwa ma ghara ikpebi ma okwu Grik ahụ bụ naanị nkwekọrịta ụtọasụsụ ka ọ bụ ịkọwa Jerusalem dịka nwanyị. Ihe odide ala peeji na-echekwa ohere nke ịkọwa obodo ahụ dịka nwanyị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ n’usoro ebumpụta ụwa nke Igbo, ebe njikọ ‘ọ hụrụ ... kwaakwa’ na-egosi njikọ chiri anya dị n’etiti ịhụ obodo ahụ na ịkwa ákwá. Nnọchiaha ‘ya’ na-echekwa enweghị mkpebi gbasara personification n’ihi na Igbo anaghị egosi gender na nnọchiaha ahụ.
