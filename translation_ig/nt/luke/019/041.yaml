revisions:
- from: Mgbe ọ na-eru nso[a], ọ hụrụ obodo ahụ, kwaakwa ákwá n’ihi ya.
  to: Ka ọ na-abịaru nso[a], ọ hụrụ obodo ahụ, kwaara ya ákwá.
  rationale: 'The revision retains the concise Greek sequence and the English audit trail’s lexical scope, while using the natural Igbo valency of ịkwa ákwá: one weeps “kwaara mmadụ/ihe ákwá,” not primarily “n’ihi” that person or thing. The gender-neutral pronoun “ya” is retained, appropriately preserving the noncommittal force available in Igbo regarding the city’s grammatical feminine.'
