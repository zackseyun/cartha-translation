id: LUK.19.45
reference: Luke 19:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς ⸀πωλοῦντας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: ig
  text: Mgbe ọ banyere n'ụlọ nsọ ahụ[a], ọ malitere ịchụpụ ndị nọ na-ere ahịa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ogige ụlọ nsọ ahụ” ma ọ bụ “mpaghara ụlọ nsọ ahụ.” Okwu Grik ἱερόν na-ezo aka n'akụkụ niile nke ụlọ nsọ, ọ bụghị kpọmkwem ebe nsọ dị n'ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Mgbe ọ banyere
  rationale: Nkebiokwu a na-egosi ihe mere tupu ngwaa bụ isi. “Mgbe ọ banyere” na-egosi usoro ihe omume ahụ n'Igbo doro anya, n'enweghị ịgbaso usoro okwu Grik nke ga-ada arọ.
- source_word: ἱερὸν
  choice: ụlọ nsọ ahụ
  rationale: ἱερόν na-ezo aka n'ogige na akụkụ niile nke ụlọ nsọ ahụ, ọ bụghị nanị ebe nsọ dị n'ime ya. “Ụlọ nsọ ahụ” bụ okwu Igbo dị mkpirikpi ma bụrụkwa nke ndị mmadụ na-aghọta; nkọwa ala peeji na-eme ka ókè okwu Grik ahụ doo anya.
- source_word: ἤρξατο
  choice: ọ malitere
  rationale: Nke a na-echekwa echiche na omume ịchụpụ ahụ bidoro n'oge a.
- source_word: ἐκβάλλειν
  choice: ịchụpụ
  rationale: “Ịchụpụ” na-egosi iwepụ mmadụ n'ike ma ọ bụ n'ụzọ siri ike, dị ka ngwaa Grik si dị, ma bụrụ okwu Igbo nkịtị ma dị ùgwù.
- source_word: πωλοῦντας
  choice: ndị nọ na-ere ahịa
  rationale: Okwu a na-ezo aka n'ụmụ mmadụ nọ n'ọrụ ire ere n'oge ahụ. Nsụgharị a na-egosi omume na-aga n'ihu ma ọ naghị akọwa kpọmkwem ihe ha na-ere, ebe amaokwu a ekwughị ya.
theological_decisions:
- issue: Ókè ἱερόν gbasara ebe Jizọs mere ihe a
  choice: A sụgharịrị ya “ụlọ nsọ ahụ,” ma a ghọtara ya dị ka ogige na akụkụ niile nke ụlọ nsọ ahụ.
  alternative: “ogige ụlọ nsọ ahụ” ma ọ bụ “mpaghara ụlọ nsọ ahụ”; “ebe nsọ” ga-eme ka ihe ọ pụtara dị warara karịa okwu Grik.
  rationale: ἱερόν na-egosikarị akụkụ niile nke ụlọ nsọ, n'adịghị ka ναός nke pụrụ izo aka n'ebe nsọ dị n'ime. Isi ederede ka dị mfe ịgụ, ebe nkọwa ala peeji na-echekwa nkọwa gbasara ebe ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro ihe omume, ike dị na “ịchụpụ,” na obosara ihe ἱερόν pụtara. E tinyere rikoma n'ikpeazụ n'ihi na amaokwu ahụ na-aga n'ihu n'amaokwu na-esote.
