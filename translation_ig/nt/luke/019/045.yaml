  source_fidelity: 'The translation accurately represents the Greek: the participial entrance is naturally conveyed by “Mgbe ọ banyere”; ἤρξατο is retained as “ọ malitere”; and the forceful infinitive ἐκβάλλειν is well rendered by “ịchụpụ.” “Ndị nọ na-ere ahịa” properly leaves unstated what was being sold, as does πωλοῦντας.'
