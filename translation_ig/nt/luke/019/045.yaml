  terminology: “Ụlọ nsọ ahụ” is an acceptable concise rendering of ἱερόν, and the footnote correctly distinguishes the broader temple complex from the inner sanctuary. The wording neither narrows the location in the main text nor introduces interpretation about the sellers’ goods.
