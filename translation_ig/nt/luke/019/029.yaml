revisions:
- from: O wee bụrụ na, ka ọ na-abịaru Betfage na Betani nso, n’akụkụ ugwu a na-akpọ Oliv[a], o zipụrụ mmadụ abụọ n’ime ndị na-eso ụzọ.
  to: O mere na, mgbe ọ bịaruru Betfage na Betani nso, n'akụkụ ugwu a na-akpọ Ugwu Oliv, o zipụrụ mmadụ abụọ n'ime ndị na-eso ụzọ.
  rationale: The revision retains every source element while using natural Standard Igbo. It renders the named mountain transparently and idiomatically as “ugwu a na-akpọ Ugwu Oliv,” rather than reproducing an English-style compressed “Oliv.” The footnote is removed because its content is now appropriately in the main text.
  reviewer_model: gpt-5.6-terra
