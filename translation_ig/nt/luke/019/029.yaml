  text: Καὶ ἐγένετο ὡς ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν, ἀπέστειλεν δύο τῶν ⸀μαθητῶν
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: ig
  text: O mere na, mgbe ọ bịaruru Betfage na Betani nso, n'akụkụ ugwu a na-akpọ Ugwu Oliv, o zipụrụ mmadụ abụọ n'ime ndị na-eso ụzọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: O wee bụrụ na
  rationale: Nke a na-edobe usoro Luk ji akọọ akụkọ, ma na-eji Igbo nke oge a nke na-ada nke ọma kama okwu ochie ma ọ bụ nke siri ike.
- source_word: ὡς ἤγγισεν
  choice: ka ọ na-abịaru … nso
  rationale: “Ka” na-ewebata oge ihe mere, ebe “na-abịaru … nso” na-egosi na ịbịaru ebe ahụ ka na-aga n’ihu, dịka ὡς si kwe ka a ghọta ya.
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: Betfage na Betani nso
  rationale: Ọ bụ ezie na εἰς na-egosikarị ngagharị gaa ebe, ijikọ ya na ἤγγισεν chọrọ n’Igbo okwu “ịbịaru … nso.” E degharịrị aha ebe ndị ahụ n’ụdị dabara n’Igbo.
- source_word: πρὸς τὸ ὄρος
  choice: n’akụkụ ugwu
  rationale: πρός n’ebe a nwere ike igosi ọnọdụ ma ọ bụ ntụziaka n’ihe metụtara ugwu ahụ. “N’akụkụ ugwu” na-enye nghọta doro anya n’Igbo n’emeghị ka okwu ahụ kwuo karịa ihe Grik kwuru.
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: a na-akpọ Oliv
  rationale: E debere ụdị okwu Grik ahụ dị mkpirikpi, nke pụtara n’ụzọ nkịtị “a na-akpọ Oliv,” ebe nkọwa a maara nke ọma dị n’okpuru peeji.
- source_word: ἀπέστειλεν
  choice: o zipụrụ
  rationale: “Zipụrụ” bụ okwu Igbo nkịtị na nke ziri ezi maka iziga mmadụ ka ọ gaa mee ihe.
- source_word: δύο τῶν μαθητῶν
  choice: mmadụ abụọ n’ime ndị na-eso ụzọ
  rationale: Nke a na-egosipụta usoro genitiv Grik ahụ, “abụọ n’ime ndị na-eso ụzọ,” n’etinyeghị “ya,” nke adịghị kpọmkwem n’ihe odide Grik.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ usoro akụkọ Luk ka a hụ ya, ma e zere okwu ochie. E tinyere akara nkọwa [a] n’ebe okwu τὸ καλούμενον Ἐλαιῶν dị, n’ihi na ọ bụ okwu ahụ ka nkọwa ahụ metụtara.
