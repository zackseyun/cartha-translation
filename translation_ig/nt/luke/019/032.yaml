  yaml_path: translation/nt/luke/019/032.yaml
  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: ig
  text: Ndị ahụ e zitere gara wee chọta ya dịka ọ gwara ha[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ naanị, “chọtara,” ebe a na-aghọta ihe ha chọtara site n’ihe ndị gbara amaokwu a gburugburu: nwa ịnyịnya ibu ahụ Jizọs kọwara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: gara
  rationale: Ngwaa a na-egosi na ha hapụrụ ebe ahụ gawa ime ihe e nyere ha iwu; “gara” bụ okwu Igbo dị mfe ma kwekọọ n’akụkọ a.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ na-eme ka akụkọ gaa n’ihu ma jikọta omume ha na ntụziaka e nyere ha tupu mgbe ahụ.
- source_word: οἱ ἀπεσταλμένοι
  choice: ndị ahụ e zitere
  rationale: Nke a na-echekwa ọdịdị passive nke participle Grik ma ghara itinye nkọwa ọzọ dịka “ndị ozi.”
- source_word: εὗρον
  choice: hụkwara ya
  rationale: Ngwaa Grik pụtara ịchọta ma ọ bụ ịhụ ihe a na-achọ. E tinyere “ya” ka Igbo wee daa nke ọma; ihe ọ na-anọchi anya ya bụ nwa ịnyịnya ibu e kwuru banyere ya n’amaokwu ndị bu ụzọ.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nke a na-egosi nkwekọrịta doro anya n’etiti ihe ha hụrụ na ihe Jizọs gwara ha.
- source_word: εἶπεν αὐτοῖς
  choice: ọ gwara ha
  rationale: “Ọ gwara ha” bụ ụzọ Igbo sitere n’okike isi kwuo na onye ahụ kwuru ihe nye ha; ọnọdụ akụkọ na-eme ka o doo anya na nke a mere tupu ha agaa.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ugwu. E ji usoro okwu dị mfe nke ndị na-agụ akwụkwọ taa ga-aghọta, ma chekwaa njikọ akụkọ na ọdịdị passive nke ihe odide Grik.
