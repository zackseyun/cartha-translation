  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: ig
  text: Ha wee sị ya, “Nna ukwu[a], o nwere mina iri[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Onyenwe” ma ọ bụ “Onyeisi.”
    reason: lexical_alternative
  - marker: b
    text: Mina bụ otu ụdị ego e ji eme ihe n’oge ochie; ọnụ ahịa ya ruru ihe dị ka ụgwọ ọrụ ụbọchị otu narị.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: Ha wee
  rationale: Ọ na-ejikọta ihe a na akụkọ bu ya ụzọ n'ụzọ dị mfe, na-agbakwụghị echiche nke mmegide.
- source_word: εἶπαν αὐτῷ
  choice: sị ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi okwu e kwuru n'oge gara aga nye mmadụ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ na-echekwa echiche bụ isi nke κύριος dị ka aha nkwanye ùgwù nye onye nwere ikike; ihe ndị ọzọ nwere ike ịbụ ‘Nna ukwu’ ma ọ bụ ‘Onyeisi.’
- source_word: ἔχει
  choice: o nwere
  rationale: Ọ na-egosi inwe ihe n'ụzọ doro anya, n'etinyeghị okwu mgbakwunye dịka ‘ugbua.’
- source_word: δέκα
  choice: iri
  rationale: Ọ bụ ntụgharị kpọmkwem nke ọnụọgụ ahụ.
- source_word: μνᾶς
  choice: mina
  rationale: E debere aha ego oge ochie ahụ kama iji aha ego nke oge a nke nwere ike iduhie onye na-agụ ya.
theological_decisions:
- issue: Otú e si atụgharị κύριος mgbe a na-akpọ mmadụ okwu n’ilu a
  choice: Onyenwe anyị
  alternative: Nna ukwu; Onyeisi
  rationale: ‘Onyenwe anyị’ na-echekwa echiche nke ikike dị na okwu Grik ahụ, ma ihe odide a n’onwe ya anaghị amanye ka a ghọta ya dị ka nkwupụta kpọmkwem banyere ịbụ Chineke. Ihe odide ala peeji na-egosi ụzọ ndị ọzọ e nwere ike isi ghọta nkwanye ùgwù ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. Akara ogologo ahịrị dị n’ọgwụgwụ na-echekwa nkwụsị okwu dị na isi mmalite ahụ.
