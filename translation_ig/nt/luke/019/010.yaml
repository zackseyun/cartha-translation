  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ζητῆσαι καὶ σῶσαι τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/010.yaml
  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: ig
  text: N’ihi na Nwa nke Mmadụ bịara ịchọ na ịzọpụta ihe furu efu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ndị furu efu.” Okwu Grik ahụ bụ neuter singular, ma a pụrụ ịghọta ya dịka okwu izugbe, nke pụrụ ịpụta ndị furu efu n’ozuzu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: bịara
  rationale: Oge aorist indicative na-akọ ọbịbịa ahụ dị ka ihe mere; “bịara” bụ ụzọ Igbo doro anya ma kwekọọ na nkwupụta banyere ozi ya.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara ma ọ bụ nkọwa nke okwu bu ụzọ; “N’ihi na” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: E debere aha Jizọs ji akpọ onwe ya n’ụdị aha nsọpụrụ, ka njikọ ya na ihe oyiyi dị na Daniel na omimi nkà mmụta okpukpe ghara ịla n’iyi.
- source_word: ζητῆσαι
  choice: ịchọ
  rationale: Infinitive a na-egosi ebumnuche ọbịbịa ahụ; “ịchọ” bụ okwu Igbo nkịtị nke na-egosi nchọgharị nwere nzube.
- source_word: σῶσαι
  choice: ịzọpụta
  rationale: “Ịzọpụta” na-edobe obosara nke σῴζω, gụnyere nzọpụta ime mmụọ, ma kwekọọ na okwu banyere nzọpụta dị na Luk 19:9.
- source_word: τὸ ἀπολωλός
  choice: ihe furu efu
  rationale: Ụdị neuter singular ahụ nwere ike ịbụ okwu izugbe ma ọ bụ nke na-anọchi otu ìgwè. “Ihe furu efu” na-edobe ọdịdị singular/neuter na nghọta sara mbara ya, n’agbanyeghị na n’ọnọdụ a ọ metụtara mmadụ.
theological_decisions:
- issue: Ókè na nghọta nke τὸ ἀπολωλός
  choice: ihe furu efu
  alternative: ndị furu efu; onye ahụ furu efu
  rationale: Greek ji neuter singular nwere article, nke nwere ike ịrụ ọrụ dịka okwu izugbe ma ọ bụ mkpokọta. “Ihe furu efu” na-edobe amaghị kpọmkwem ma okwu ahụ na-elekwasị anya n’otu onye ma ọ bụ n’ụdị mmadụ niile nọ n’ọnọdụ ịla n’iyi; ya mere ọ naghị eme ka okwu ahụ dị warara karịa isi mmalite.
translation_notes:
  register: Igbo Standard dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji “Nwa nke Mmadụ” debe aha ahụ n’ụdị a maara nke ọma; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa otu okpukpe tinye n’amaokwu ahụ.
