id: LUK.19.12
reference: Luke 19:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: ig
  text: Ya mere, ọ sịrị, “Otu nwoke si n’ezinụlọ dị elu gara mba dị anya ịnata alaeze[a] maka onwe ya ma lọghachi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọkwa eze” ma ọ bụ “ikike ọchịchị eze.” Okwu Grik βασιλεία nwere ike izo aka n’alaeze n’onwe ya ma ọ bụ n’ọchịchị na ikike eze.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ echiche na ihe a kọwara tupu ya; ọ bụkwa ụzọ doro anya ma kwekọọ n’asụsụ Igbo e ji eme ihe ugbu a.
- source_word: Ἄνθρωπός τις εὐγενὴς
  choice: Otu nwoke sitere n’ezinụlọ ndị a ma ama
  rationale: Na-egosi nwoke a na-akpọpụtaghị aha ya, onye ọnọdụ ya dị elu n’ihi ọmụmụ ya. Nke a na-ezere ịtụgharị εὐγενής ka à ga-asị na ọ bụ naanị onye nwere ezigbo agwa.
- source_word: ἐπορεύθη εἰς χώραν μακρὰν
  choice: gara mba dị anya
  rationale: Na-enye echiche njem gaa n’ógbè ma ọ bụ mba dị anya n’ụzọ dị mfe ma bụrụ Igbo ebumpụta ụwa.
- source_word: λαβεῖν ἑαυτῷ
  choice: ịnata ... maka onwe ya
  rationale: Na-echekwa echiche nke ịnata ihe a ga-enye ya, tinyere uru ma ọ bụ ọnọdụ ahụ bụ nke ya onwe ya.
- source_word: βασιλείαν
  choice: alaeze
  rationale: Okwu ahụ nwere ike ịpụta alaeze dị ka ógbè ma ọ bụ ọchịchị na ikike eze. “Alaeze” na-echekwa ihe oyiyi ndọrọ ndọrọ ọchịchị dị n’ilu ahụ, ebe nkọwa ala ala peeji na-egosi nkọwa ndị ọzọ.
- source_word: ὑποστρέψαι
  choice: ma lọghachi
  rationale: Na-egosi nzube nke abụọ e jikọtara na ịnata alaeze, n’etinyeghị okwu ọzọ na-akọwa oge nke na-adịghị n’ihe odide Grik.
theological_decisions:
- issue: Nkọwa βασιλείαν n’ilu nwere ihe oyiyi nke inweta ikike ọchịchị eze
  choice: alaeze
  alternative: ọkwa eze; ikike ọchịchị eze
  rationale: βασιλεία nwere ike izo aka n’alaeze n’onwe ya ma ọ bụ n’ọchịchị na ikike eze. E debere “alaeze” n’ahịrị isi, ma kọwaa nhọrọ ndị ọzọ ka a ghara imechi nghọta okwu ahụ n’otu ụzọ naanị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. A họọrọ “sitere n’ezinụlọ ndị a ma ama” iji kọwaa ọkwa e nwetara site n’ọmụmụ n’enweghị okwu ochie ma ọ bụ nke ụka pụrụ iche.
