- from: Ya mere, ọ sịrị, “Otu nwoke sitere n’ezinụlọ ndị a ma ama gara mba dị anya ịnata alaeze[a] maka onwe ya, ma lọghachi.”
  to: Ya mere, ọ sịrị, “Otu nwoke si n’ezinụlọ dị elu gara mba dị anya ịnata alaeze[a] maka onwe ya ma lọghachi.”
  rationale: The revision narrowly corrects the expression for εὐγενής so that it denotes noble or high-born status rather than mere fame. The wording for βασιλεία and its lexical footnote is retained, as is the coordinated purpose of receiving and returning.
  reviewer_model: gpt-5.6-terra
