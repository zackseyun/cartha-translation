    reason: lexical_alternative
  revision_rationale: The revision narrowly corrects the expression for εὐγενής so that it denotes noble or high-born status rather than mere fame. The wording for βασιλεία and its lexical footnote is retained, as is the coordinated purpose of receiving and returning.
