  to: O wee sị ya[a], “I meela nke ọma, ezi ohu! N’ihi na i gosiri na ị bụ onye ntụkwasị obi n’ihe dị nnọọ nta, nwee ikike ịchị obodo iri.”
  rationale: The revision corrects the addressee of the opening commendation and removes an avoidable modal ambiguity in the clause about faithfulness. It preserves the parabolic register, the authority relationship conveyed by δοῦλος, and the Greek sense of authority over ten cities.
