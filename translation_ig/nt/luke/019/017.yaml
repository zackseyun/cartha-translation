source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: ig
  text: O wee sị ya[a], “I meela nke ọma, ezi ohu! N’ihi na i gosiri na ị bụ onye ntụkwasị obi n’ihe dị nnọọ nta, nwee ikike ịchị obodo iri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-eje ozi.” Okwu Grik bụ doulos, nke nwere ike ịpụta “ohu” ma ọ bụ “onye na-eje ozi,” dabere n’ọnọdụ okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὖγε
  choice: I mere nke ọma
  rationale: Ọ bụ okwu otuto a na-ekwu n’ụzọ ebumpụta ụwa n’Igbo, nke na-egosi na onye nwe ya nabatara ihe ohu ahụ mere.
- source_word: ἀγαθὲ
  choice: ezi
  rationale: ‘Ezi’ na-akọwa ohu ahụ ozugbo dịka onye dị mma, ma dabara n’okwu a na-agwa mmadụ ihu na ihu.
- source_word: δοῦλε
  choice: ohu
  rationale: ‘Ohu’ na-egosipụta ọnọdụ onye nọ n’okpuru onye nwe ya nke ọma karịa ‘onye na-eje ozi’ n’akụkọ a; nkọwa ala peeji na-egosi na a pụkwara ịghọta ya dịka onye na-eje ozi dabere n’ọnọdụ okwu.
- source_word: ἐν ἐλαχίστῳ
  choice: n’ihe dị nnọọ nta
  rationale: Nke a na-echekwa echiche nke ihe pere nnọọ mpe ma na-ada nke ọma n’Igbo nke oge a.
- source_word: πιστὸς ἐγένου
  choice: i kwesịrị ntụkwasị obi
  rationale: Nke a na-egosipụta na onye ahụ gosiri ntụkwasị obi n’ọrụ e nyere ya, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: nwee ikike ịchị
  rationale: Ụdị iwu a pụtara ka onye ahụ nwee ikike; ‘ịchị’ na-eme ka ụdị ikike a n’ebe obodo dị doo anya.
- source_word: ἐπάνω δέκα πόλεων
  choice: obodo iri
  rationale: ‘Obodo iri’ bụ ntụgharị ebumpụta ụwa nke δέκα πόλεων; echiche ‘n’elu’ ha dịlarị n’okwu ‘ikike ịchị.’
theological_decisions:
- issue: Ntụgharị δοῦλος n’akụkọ onye nwe mmadụ na ohu ya
  choice: ohu
  alternative: onye na-eje ozi
  rationale: N’ọnọdụ mmekọrịta onye nwe mmadụ na onye nọ n’okpuru ya ebe a, ‘ohu’ na-echekwa ịdị ike nke δοῦλος. Agbanyeghị, ebe okwu ahụ nwere ike ịpụta onye na-eje ozi n’ọnọdụ ụfọdụ, e debere nhọrọ ahụ na nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu ma doo ndị na-agụ akwụkwọ taa anya. E ji ‘nwee ikike ịchị’ mee ka ọchịchị obodo pụta ìhè n’enweghị mgbakwunye echiche okpukpe pụrụ iche.
