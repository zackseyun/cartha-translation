  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: ig
  text: Ka ọ na-aga, ha na-atọgbọ uwe ha[a] n’ụzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uwe elu ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: Ka ọ na-aga
  rationale: Nkebi okwu a bụ genitive absolute nke na-egosi na ihe abụọ ahụ na-eme n’otu oge. “Ka ọ na-aga” bụ Igbo ebumpụta ụwa nke na-echekwa echiche ahụ; njikọ dị nro δέ na-apụta n’ịga n’ihu nke akụkọ ahụ n’enweghị ime ka ọ bụrụ nnukwu ntụnyere.
- source_word: ὑπεστρώννυον
  choice: ha nọ na-agbasapụ
  rationale: Oge imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro. “Nọ na-agbasapụ” na-eme ka ọdịdị omume ahụ na-aga n’ihu pụta ìhè.
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: uwe ha
  rationale: Ἱμάτια nwere ike ịpụta uwe n’ozuzu ya ma ọ bụ, karịchaa n’ọnọdụ a, uwe elu mmadụ na-eyipụ. “Uwe ha” na-echekwa obosara okwu Grik ahụ ma na-ada nke ọma n’Igbo; e depụtara nkọwa pụrụ iche karị n’ala peeji.
- source_word: ἐν τῇ ὁδῷ
  choice: n’okporo ụzọ
  rationale: Nkebi okwu ahụ na-egosi ebe ha na-agbasapụ uwe ndị ahụ. “N’okporo ụzọ” doro anya ma kwekọọ n’ụzọ ndị Igbo si ekwu ya.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu. A hapụrụ onye “ha” na-anọchi anya ya n’enweghị ịkọwapụta ya, dịka isi mmalite Grik si mee. E tinyere akara ala peeji [a] n’akụkụ okwu ọ na-akọwa.
