  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: ig
  text: Ọ zara ha sị, “Ana m agwa unu, ọ bụrụ na ndị a agbachie nkịtị[a], nkume ga-eti mkpu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọrọ nkịtị” ma ọ bụ “dị nkịtị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: Ọ zara ha sị
  rationale: Nkebiokwu a na-edobe ma echiche nke ịza mmadụ ma ngwaa bụ isi nke ikwu okwu, n’ụzọ Igbo dị nkenke ma bụrụkwa ihe a na-asụkarị.
- source_word: Λέγω ὑμῖν
  choice: Ana m agwa unu
  rationale: Nke a na-egosipụta okwu Jizọs kwuru kpọmkwem n’ike, ma na-ada ka Igbo nke oge a.
- source_word: οὗτοι
  choice: ndị a
  rationale: Aha ngosi a na-arụtụ aka n’ebe ndị na-eso ụzọ na-eto Chineke nọ, n’ebughị nkọwa ahụ bata n’amaokwu.
- source_word: σιωπήσουσιν
  choice: agbachie nkịtị
  rationale: Ọ na-egosi na ndị ahụ ga-akwụsị ikwu okwu ma gbachi nkịtị; e debere ụzọ okwu ndị ọzọ ga-ekwe omume n’ala ala peeji.
- source_word: οἱ λίθοι
  choice: nkume
  rationale: Igbo anaghị achọ mkpụrụokwu pụrụ iche iji gosipụta article Grik mgbe ihe a na-ekwu doro anya n’ọnọdụ okwu. ‘Nkume’ na-edobe onyinyo ahụ kpọmkwem.
- source_word: κράξουσιν
  choice: ga-eti mkpu
  rationale: Nkebiokwu a na-egosi iti mkpu n’olu dara ụda ma na-edobe ike nke onyinyo Grik.
theological_decisions:
- issue: Ma a ga-akọwa iti mkpu nke nkume dịka ihe atụ ma ọ bụ ọrụ ebube
  choice: E debere ya kpọmkwem dịka ‘nkume ga-eti mkpu.’
  alternative: Ihe e kere eke ga-agba akaebe ma ọ bụ too Chineke.
  rationale: Grik akọwaghị ma okwu a ọ bụ ikwubiga okwu ókè, onyinyo amụma, ma ọ bụ ihe nwere ike ime n’ọrụ ebube; ya mere nsụgharị ahụ anaghị ekpebi ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọ zara ha sị’ bụ usoro Igbo ebumpụta ụwa nke na-edobe ἀποκριθεὶς na εἶπεν n’enweghị nkwughachi na-adịghị mkpa.
