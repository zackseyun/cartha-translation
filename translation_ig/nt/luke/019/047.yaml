  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: ig
  text: Ọ nọ na-akụzi ihe kwa ụbọchị n’ụlọ nsọ. Ma ndị isi nchụàjà, ndị odeakwụkwọ, na ndị isi n’etiti ndị mmadụ[a] nọ na-achọ ibibi ya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ndú ndị mmadụ.” Okwu Grik ahụ pụtara kpọmkwem “ndị mbụ nke ndị mmadụ,” ya bụ, ndị a ma ama ma ọ bụ ndị nwere mmetụta n’etiti ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: Ọ nọkwa na-akụzi ihe
  rationale: Nke a na-egosipụta omume gara n’ihu ma ọ bụ a na-eme ugboro ugboro n’oge gara aga, dịka periphrastic imperfect Grik si dị.
- source_word: τὸ καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Ọ bụ okwu Igbo doro anya ma dị mfe nke na-egosipụta na ọ na-eme ya ụbọchị niile n’usoro.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọ nsọ ahụ
  rationale: ἱερόν na-ezo aka n’ogige na mpaghara ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime; ‘ụlọ nsọ’ bụ ụzọ nkịtị e si akọwa ya n’Igbo.
- source_word: οἱ ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a bụ aha doro anya maka òtù ndị ndu nchụàjà, kama ịsụgharị ya dịka ọtụtụ nnukwu onye nchụàjà.
- source_word: οἱ γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nhọrọ a na-anọ nso n’aha γραμματεῖς, ma ihe odide ala peeji na-akọwa ọrụ ha n’iwu okpukpe.
- source_word: ἐζήτουν
  choice: nọ na-achọ ụzọ
  rationale: Imperfect ahụ na-egosi mbọ na-aga n’ihu; ‘na-achọ ụzọ’ na-eweta echiche ahụ n’Igbo nkịtị.
- source_word: ἀπολέσαι
  choice: ha ga-esi bibie ya
  rationale: ‘Bibie’ na-echekwa obosara ἀπόλλυμι, nke n’ọnọdụ a gụnyere igbu Jizọs, n’enweghị ime ka okwu ahụ dị warara karịa Grik.
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: ndị a ma ama n’etiti ndị mmadụ
  rationale: Okwu ahụ pụtara n’ụzọ nkịtị ‘ndị mbụ nke ndị mmadụ,’ ya bụ, ndị nwere ọkwá ma ọ bụ mmetụta n’etiti ọha; nsụgharị a bụ nke e ji asụ Igbo n’ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Ihe οἱ πρῶτοι τοῦ λαοῦ pụtara na ma a ga-eme ka nwoke pụta ìhè
  choice: ndị a ma ama n’etiti ndị mmadụ
  alternative: ndị ikom na-edu ndị mmadụ
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ nwoke mee ihe, isi okwu ahụ bụ ọkwá na mmetụta ndị ahụ nwere. Igbo anaghị egosi okike n’ụdị ọtụtụ ‘ndị’; ịtinye ‘ndị ikom’ ga-eme ka ihe a na-eche n’akụkọ ihe mere eme bụrụ ihe e kwuru kpọmkwem karịa isi iyi ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. A họọrọ ahịrịokwu na-aga nke ọma n’ọnụ, ma e chekwara omume na-aga n’ihu nke ngwaa Grik na obosara okwu ‘bibie.’
