revisions:
- from: Ọ nọkwa na-akụzi ihe kwa ụbọchị n’ụlọ nsọ ahụ. Ma ndị isi nchụàjà, ndị odeakwụkwọ[a], na ndị a ma ama n’etiti ndị mmadụ nọ na-achọ ụzọ ha ga-esi bibie ya.
  to: Ọ nọ na-akụzi ihe kwa ụbọchị n’ụlọ nsọ. Ma ndị isi nchụàjà, ndị odeakwụkwọ, na ndị isi n’etiti ndị mmadụ[a] nọ na-achọ ibibi ya,
  rationale: The revision replaces a fame-focused expression with one denoting prominence and influence, moves the lexical-alternative note to the phrase it explains, removes the unnecessary “ụzọ ha ga-esi” expansion, and preserves the source’s continuing syntax. It retains the source’s ambiguity about the exact role of these prominent people and does not add gender or institutional claims beyond the Greek.
