    text: Ma ọ bụ, “ndị ndú ndị mmadụ.” Okwu Grik ahụ pụtara kpọmkwem “ndị mbụ nke ndị mmadụ,” ya bụ, ndị a ma ama ma ọ bụ ndị nwere mmetụta n’etiti ha.
    reason: lexical_alternative
  revision_rationale: The revision replaces a fame-focused expression with one denoting prominence and influence, moves the lexical-alternative note to the phrase it explains, removes the unnecessary “ụzọ ha ga-esi” expansion, and preserves the source’s continuing syntax. It retains the source’s ambiguity about the exact role of these prominent people and does not add gender or institutional claims beyond the Greek.
