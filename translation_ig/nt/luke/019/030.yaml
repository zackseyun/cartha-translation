review_pass:
  verdict: revise
  source_fidelity: A correction is needed for two source-sensitive points. πῶλον is a young equid/colt and does not itself specify a donkey; rendering it “nwa ịnyịnya” preserves that lexical breadth. Also, ἐκάθισεν means “sat,” which requires “nọdụ” rather than “anọ.” The command sequence and plural address are retained.
  naturalness: “E kegidere” is idiomatic Standard Igbo for an animal being tied, unlike “e kere agbụ,” which is not natural in this context. “Ka unu na-abanye” and “nọdụbeghị” read naturally and clearly.
  terminology: “Obodo nta” appropriately renders κώμην. “Nwa ịnyịnya” preserves the source term’s ambiguity without importing “ibu” (donkey). “Tọpụnụ” and “kpọtanụ” suitably convey the paired imperatives.
  issues:
  - severity: medium
    issue: The draft specifies “nwa ịnyịnya ibu” for πῶλον.
    rationale: πῶλον denotes a colt/young equid and does not independently identify the animal as a donkey in this verse. A generic Igbo rendering better preserves the Greek wording.
  - severity: medium
    issue: “na-anọtụbeghị n’elu ya” does not precisely render sitting.
    rationale: ἐκάθισεν means “sat”; “nọdụbeghị n’elu ya” expresses this action accurately.
  - severity: medium
    issue: “e kere agbụ” is not idiomatic for “tied.”
    rationale: “E kegidere” is the natural Standard Igbo passive expression and does not overstate the means by which the colt was secured.
  revised_text: na-asị, “Gaanụ n’obodo nta dị n’ihu unu. Ka unu na-abanye n’ime ya, unu ga-ahụ nwa ịnyịnya e kegidere, nke mmadụ ọ bụla nọdụbeghị n’elu ya. Tọpụnụ ya, kpọtanụ ya.”
  revised_footnotes: []
  revision_rationale: The revision improves idiomatic Standard Igbo and directly reflects the Greek while preserving πῶλον’s lexical ambiguity. No footnotes are needed for this verse.
