source:
  edition: SBLGNT
  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: ig
  text: na-asị, “Gaanụ n’obodo nta dị n’ihu unu. Ka unu na-abanye n’ime ya, unu ga-ahụ nwa ịnyịnya e kegidere, nke mmadụ ọ bụla nọdụbeghị n’elu ya. Tọpụnụ ya, kpọtanụ ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμην
  choice: obodo nta
  rationale: Ọ na-egosi obodo dị nta ma ọ bụ ime obodo, n’asụsụ Igbo dị mfe ma doo anya.
- source_word: πῶλον
  choice: nwa ịnyịnya ibu
  rationale: πῶλος n’onwe ya pụtara nwa anụmanụ nke ezinụlọ ịnyịnya; ọnọdụ akụkọ a na amaokwu ndị kwekọrọ na ya na-egosi nwa ịnyịnya ibu.
- source_word: δεδεμένον
  choice: e kere agbụ
  rationale: Na-egosi na e kegidere anụmanụ ahụ; okwu a bụ ụzọ Igbo nkịtị si kwuo na anụmanụ nọ n’agbụ, n’agbanyeghị ụdị ihe e ji kee ya.
- source_word: λύσαντες
  choice: Tọpụnụ
  rationale: Na-enye iwu ka ha tọpụ ihe e ji kee anụmanụ ahụ.
- source_word: ἀγάγετε
  choice: kpọtakwanụ ya
  rationale: Na-egosi iduru anụmanụ ahụ bịakwute Jizọs; “kpọta” bụ okwu Igbo ebumpụta ụwa n’ọnọdụ a.
theological_decisions: []
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwanyere ugwu, ma dị mfe nghọta. E debere usoro iwu ahụ na ọtụtụ mmadụ (“unu”), nakwa nkwupụta siri ike nke οὐδεὶς πώποτε.
