  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: ig
  text: na-asị[a], “A sị na ị matara n’ụbọchị a, ọbụna gị onwe gị, ihe ndị na-eduga n’udo[b]—ma ugbu a, e zoro ha n’anya gị.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “A sị nnọọ na ị matara n’ụbọchị a, ọbụna gị onwe gị, ihe ndị na-eduga n’udo.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ n’ụzọ nkịtị, “ihe ndị gbasara udo,” ya bụ, ihe ndị metụtara udo ma ọ bụ ndị na-eduga na ya.
    reason: lexical_alternative
  - marker: c
    text: 'Ụfọdụ nsụgharị na-etinye akụkụ ikpeazụ n’otu: “ma ugbu a, e zoro ya n’anya gị,” ebe ha na-ewere akpaokwu bu ya ụzọ dịka otu echiche.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle nke na-aga n’ihu jikọta okwu a na omume dị n’amaokwu bu ya ụzọ; ‘na-asị’ na-edobe usoro ahụ kama ime ya ngwaa kwụụrụ onwe ya.
- source_word: Εἰ ἔγνως
  choice: A sị na ị matara
  rationale: N’ọnọdụ akwa arịrị a, aorist indicative na-egosi ihe a na-atụghịzị ka o mezuru. Akpaokwu Igbo a na-egosi ọchịchọ a na-emezughị n’etinyeghị okwu ọzọ pụtara ‘naanị.’
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: n’ụbọchị a
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke nkịtị isi kwuo oge ahụ n’enweghị ịgbakwunye nkwusikwu ike na-adịghị n’ihe odide Grik.
- source_word: καὶ σὺ
  choice: ọbụna gị onwe gị
  rationale: Nke a na-egosipụta nkwusikwu ike na mmetụta dị n’akwa arịrị a a na-akwa Jerusalem.
- source_word: τὰ πρὸς εἰρήνην
  choice: ihe ndị na-eduga n’udo
  rationale: Akpaokwu ahụ na-ezo aka n’ihe ndị metụtara udo ma ọ bụ ndị na-eduga na ya. Nsụgharị a doro anya ma na-edobekwa echiche nke ọtụtụ ihe.
- source_word: εἰρήνην
  choice: udo
  rationale: ‘Udo’ bụ okwu Igbo a na-ejikarị eme ihe ebe a, ọ pụkwara ịgụnye ọdịmma zuru ezu na ihe ga-egbochi ikpe na-abịa.
- source_word: νῦν δὲ
  choice: ma ugbu a
  rationale: Ọ na-egosi nnukwu ọdịiche dị n’etiti ihe a gaara amata na ọnọdụ nzuzo dị ugbu a.
- source_word: ἐκρύβη
  choice: e zowo ha
  rationale: A na-ewere ihe e zoro ezo dị ka ‘ihe ndị na-eduga n’udo.’ Igbo chọrọ nnọchiaha ọtụtụ ‘ha’ iji mee njikọ ahụ doo anya, ọ bụ ezie na ngwaa Grik dị n’otu.
- source_word: ἀπὸ ὀφθαλμῶν σου
  choice: n’anya gị
  rationale: Nke a bụ akpaokwu Igbo ebumpụta ụwa nke na-edobe ihe atụ Akwụkwọ Nsọ banyere ịhụ, ịghọta, na ịmata.
theological_decisions:
- issue: Ihe a na-ewere dị ka onye/okwu e zoro n’ἐκρύβη
  choice: E zowo ‘ihe ndị na-eduga n’udo,’ ya mere e jiri ‘ha.’
  alternative: E zowo ‘ya’ n’anya gị, na-ewere echiche ahụ dum dịka otu ihe.
  rationale: Ọ bụ ezie na ἐκρύβη dị n’otu, τὰ πρὸς εἰρήνην bụ neuter plural, nke Grik pụrụ iji ngwaa dị n’otu soro. ‘Ha’ na-eme ka njikọ ya na ihe ndị e kwuru tupu ya doo anya n’Igbo n’etinyeghị nkọwa mmụta okpukpe ọzọ.
- issue: Ike dị n’akwa arịrị nke conditional
  choice: A sị na ị matara
  alternative: A sị nnọọ na ị matara
  rationale: Okwu ahụ bụ akwa arịrị ma na-egosi ihe a na-emezughị, ma ihe odide Grik enweghị particle pụtara kpọmkwem ‘nnọọ/naanị.’ Ya mere, a hapụrụ nkwusikwu ahụ na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọbụna gị onwe gị’ na-eburu nkwusikwu ike nke καὶ σὺ, ebe ‘e zowo ha n’anya gị’ na-edobe ihe atụ nke ịhụ na ịmata. A hapụrụ ahịrịokwu ahụ ka ọ bụrụ nke na-aga n’ihu site n’amaokwu bu ya ụzọ n’ihi participle λέγων.
