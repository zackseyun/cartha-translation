id: LUK.19.8
reference: Luke 19:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: ig
  text: Ma Zakịọs guzoro sị Onyenwe anyị, “Lee, Onyenwe anyị, ana m enye ndị ogbenye ọkara ihe niile m nwere; ọ bụrụkwa na m napụtala onye ọ bụla ihe ọ bụla n’ụzọ aghụghọ[a], ana m akwụghachi ya okpukpu anọ.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ bụrụ na m aghọgbuola onye ọ bụla n’ihe ọ bụla.” Okwu Grik ahụ nwere ike ịpụta ịnara mmadụ ihe site n’ike ma ọ bụ mmegbu, iji aghụghọ napụ ya ihe, ma ọ bụ ime ya site n’ebubo ụgha.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ngwaa ndị ahụ dị n’oge ugbu a n’asụsụ Grik dịka, “m ga-enye” na “m ga-akwụghachi,” ya bụ, mkpebi ọ na-eme ozugbo.
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: guzoro
  rationale: Ọ bụ participle nke ἵστημι e ji n’ụzọ intransitive; “guzoro” na-egosi omume ahụ n’ụzọ dị mkpirikpi n’etinyeghị nkọwa ọzọ banyere ọnọdụ ahụ ya.
- source_word: κύριον / κύριε
  choice: Onyenwe anyị
  rationale: Nke a na-edobe κύριος dị ka aha nsọpụrụ “Onyenwe anyị,” ma ghara ime ka ọ bụrụ naanị okwu nkwanye ùgwù dịka “nna anyị ukwu.”
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo dị ugbu a nke na-akpọ uche onye na-ege ntị n’ihe a ga-ekwu.
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: ọkara ihe niile m nwere
  rationale: Nke a na-egosipụta ihe onwunwe Zakịọs na partitive sense nke ahịrị Grik n’ụzọ Igbo doro anya.
- source_word: τοῖς πτωχοῖς
  choice: ndị ogbenye
  rationale: Ọ bụ ntụgharị nkịtị na nke doro anya nke substantive πτωχοῖς, na-ezo aka ná ndị nọ ná mkpa n’ụzọ akụ na ụba.
- source_word: δίδωμι
  choice: ana m enye
  rationale: E debere present indicative dịka present n’Igbo, ka okwu ahụ ghara ikpebi ma ọ bụ omume ọ na-emebu ma ọ bụ mkpebi ọ na-eme ozugbo.
- source_word: ἐσυκοφάντησα
  choice: napụtala ... n’ụzọ aghụghọ
  rationale: Okwu a nwere ike ịpụta ịnara mmadụ ihe site n’ike, mmegbu, aghụghọ, ma ọ bụ ebubo ụgha. Nhọrọ a sara mbara ma bụrụ nke ndị Igbo ga-aghọta, ebe ndetu ala na-edobe ụzọ ndị ọzọ e si aghọta ya.
- source_word: ἀποδίδωμι
  choice: ana m akwụghachi
  rationale: “Akwụghachi” dabara n’echiche nke iweghachi ma ọ bụ ịkwụghachi ihe e nara mmadụ.
- source_word: τετραπλοῦν
  choice: okpukpu anọ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi isi kwuo nkwụghachi ji anọ karịa ihe mbụ.
theological_decisions:
- issue: Ike present-tense verbs δίδωμι na ἀποδίδωμι nwere
  choice: “ana m enye … ana m akwụghachi”
  alternative: “m ga-enye … m ga-akwụghachi”
  rationale: 'Present progressive/habitual Igbo na-edobe present nke Grik ma na-ahapụ ihe a ka ọ nwee ezi mgbagwoju anya ya: Zakịọs nwere ike ịbụ na-akọ omume ya, na-ekwupụta mkpebi ọ na-eme ozugbo, ma ọ bụ na okwu ya nwere akụkụ abụọ ahụ. A naghị eji ntụgharị dozie esemokwu nkà mmụta okpukpe banyere ma nke a bụ omume mbụ ya ka ọ bụ nchegharị ọhụrụ.'
- issue: Uru κύριος mgbe Zakịọs na-agwa Jizọs okwu
  choice: Onyenwe anyị
  alternative: nna anyị ukwu
  rationale: “Onyenwe anyị” na-edobe ịdị arọ nke aha ahụ n’akụkọ Luk, ma ka na-ekwe ka okwu ahụ bụrụ nkwanye ùgwù n’ọnụ Zakịọs n’enweghị ịkọwa kpọmkwem oke nghọta okwukwe ya n’oge ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-eso usoro okwu Igbo eke, ma na-edobe aha “Onyenwe anyị,” okwu nlebara anya “Lee,” na mgbagwoju anya nke present tense nke Grik. E tinyere akara ndetu [a] ozugbo n’akụkụ okwu gbasara συκοφαντέω, tinyekwa [b] n’ọgwụgwụ okwu ahụ maka ụzọ ọzọ e si aghọta ngwaa present-tense.
