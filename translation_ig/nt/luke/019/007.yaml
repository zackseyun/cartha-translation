source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: ig
  text: Mgbe ha niile hụrụ nke a, ha malitere ịtamu ntamu, na-asị, “Ọ banyela ịnọ ọbịa n’ebe nwoke bụ onye mmehie nọ[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ banyela ịnọ n’ebe nwoke bụ onye mmehie nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Mgbe ha niile hụrụ nke a
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu oge n’Igbo nkịtị. E tinyere “nke a” iji zoo aka n’ihe ha hụrụ, ya bụ, ihe Jizọs mere n’ihe gbasara Zakiọs.
- source_word: πάντες
  choice: ha niile
  rationale: Nke a na-edobe ike okwu Grik nke na-egosi na ndị niile nọ ebe ahụ so ná mmeghachi omume ahụ.
- source_word: διεγόγγυζον
  choice: ha malitere ịtamu ntamu
  rationale: “Ịtamu ntamu” na-egosi mkpesa ha na-eme n’olu dị ala; “malitere” na-enye imperfect ahụ nghọta nke omume malitere ma na-aga n’ihu.
- source_word: λέγοντες
  choice: na-asị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’okwu Grik nke na-ewebata ihe ha kwuru.
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: n’ebe nwoke bụ onye mmehie nọ
  rationale: “N’ebe ... nọ” na-egosi ịnọ n’ụlọ ma ọ bụ n’ebe mmadụ nọ, ebe “nwoke bụ onye mmehie” na-edobe ma adjective ahụ ma aha nwoke ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: εἰσῆλθεν
  choice: Ọ banyere
  rationale: Nke a na-edobe ngwaa Grik “ịbanye” n’enweghị ịgbakwunye “ụlọ,” bụ́ okwu a ghọtara site n’ihe gbara amaokwu ahụ gburugburu ma na-adịghị n’ahịrị Grik a kpọmkwem.
- source_word: καταλῦσαι
  choice: ka ọ nọrọ dị ka ọbịa
  rationale: N’ebe a infinitive ahụ pụtara ịnọ ma ọ bụ ile ọbịa n’ebe mmadụ nọ. Okwu a họọrọ na-eme ka nghọta ahụ doo anya n’Igbo ugbu a, ebe ihe ọzọ nwere ike ịbụ naanị “ka ọ nọrọ.”
theological_decisions:
- issue: Otu ìgwè mmadụ si kọwaa Zakiọs
  choice: nwoke bụ onye mmehie
  alternative: onye mmehie
  rationale: Grik nwere adjective ἁμαρτωλῷ tinyere aha nwoke ἀνδρί. Nsụgharị a na-edobe mkpebi nlelị nke ìgwè mmadụ na nwoke ahụ a kapịrị ọnụ, n’etinyeghị nkọwa okpukpe ọzọ.
- issue: Ma καταλῦσαι ọ pụtara ịnọ nkịtị ka ọ bụ ịnọ dị ka ọbịa
  choice: ka ọ nọrọ dị ka ọbịa
  alternative: ka ọ nọrọ
  rationale: Ihe okwu a pụtara n’ọnọdụ a gụnyere ịnọ n’ebe mmadụ dị ka ọbịa. E debere nhọrọ dị mkpụmkpụ karị n’ala peeji ka a ghara izochi obosara okwu Grik ahụ.
translation_notes:
  register: Asụsụ a bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ịtamu ntamu” na-adabara mkpesa ìgwè mmadụ, ebe usoro “n’ebe ... nọ” na-eme ka okwu ahụ daa ka Igbo nkịtị n’enweghị ịgbakwunye “ụlọ” n’ahịrị bụ isi.
