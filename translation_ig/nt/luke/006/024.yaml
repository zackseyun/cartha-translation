id: LUK.6.24
reference: Luke 6:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: ig
  text: Ma ahụhụ dịrị unu ndị bara ọgaranya, n’ihi na unu anatala[a] nkasi obi[b] unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu anatala n’uju.” Ngwaa Grik ahụ pụrụ ịpụta na mmadụ anatala ihe ruuru ya kpamkpam.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta okwu a dịka “ihe na-akasi unu obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ma
  rationale: Ọ na-egosi nnukwu mgbanwe megide ngọzi ndị e kwuru tupu nke a; “Ma” bụ okwu Igbo dị mfe ma na-aga were were.
- source_word: οὐαὶ ὑμῖν
  choice: ahụhụ dịrị unu
  rationale: Nke a na-echekwa ịdị arọ nke okwu ịdọ aka ná ntị na ikpe dị n’οὐαί, n’emeghị ka ọ bụrụ naanị okwu mwute.
- source_word: τοῖς πλουσίοις
  choice: ndị bara ọgaranya
  rationale: Ọ bụ ụzọ Igbo doro anya na nke a na-ejikarị akọwa ndị nwere akụnụba, ma ọ na-echekwa ịkpọ ha okwu ozugbo.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi hoo haa na ihe na-esote bụ ihe kpatara okwu ahụhụ ahụ.
- source_word: ἀπέχετε
  choice: unu anatala
  rationale: Ngwaa Igbo a na-egosi na nnata ahụ emeelarị, ma ọ naghị etinye echiche ọzọ na-adịghị n’amaokwu ahụ. E debere echiche nke ‘ịnara n’uju’ n’ala ala peeji.
- source_word: παράκλησιν
  choice: nkasi obi
  rationale: “Nkasi obi” bụ okwu Igbo nkịtị, doro anya, nke na-ekpuchi echiche nke comfort ma ọ bụ consolation n’ebe a.
- source_word: ὑμῶν
  choice: unu
  rationale: Ọ na-echekwa nnọchiaha nke onye nke abụọ n’ọnụọgụ ọtụtụ nke na-egosi na nkasi obi ahụ bụ nke ndị a na-agwa okwu.
theological_decisions:
- issue: Ụdị ịdọ ndị bara ọgaranya aka ná ntị
  choice: A sụgharịrị ya dịka okwu ahụhụ a gwara ndị bara ọgaranya ozugbo.
  alternative: Ime ka ọ bụrụ naanị akwa arịrị, ma ọ bụ ịgbakwunye ‘ndị tụkwasịrị obi n’akụnụba.’
  rationale: Grik kpọrọ “ndị bara ọgaranya” okwu ozugbo. Ya mere, nsụgharị ahụ echekwaghị ike okwu Jizọs site n’ịkọwa ihe kpatara omume ha karịa ihe amaokwu ahụ kwuru.
- issue: Ike oge na nghọta nke ἀπέχετε
  choice: unu anatala
  alternative: unu na-anata; unu anatala n’uju
  rationale: Ụdị ngwaa Grik ahụ dị ugbu a, ma n’iji ya eme ihe ọ pụkwara ịpụta na mmadụ anatala ihe ruuru ya n’uju. Isi ederede na-egosi nnata emeelarị, ebe ala ala peeji na-echekwa nghọta ‘n’uju’ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “ahụhụ dịrị unu” na-echekwa olu amụma na ịdọ aka ná ntị nke okwu Grik, n’etinyeghị nkọwa ụka pụrụ iche.
