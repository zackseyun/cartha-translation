  source_fidelity: 'Nsụgharị ahụ na-anọchi anya Grik ahụ n’ụzọ ziri ezi: οὐαί nwere ike amụma/ịdọ aka ná ntị ya na “Ahụhụ dịrị unu”; ἐμπεπλησμένοι νῦν bụ ọnọdụ afọ ojuju ugbu a; πεινάσετε bụ agụụ n’ọdịnihu. Okwu nke abụọ na-edobe ndị na-achị ọchị ugbu a na ihe abụọ ga-esote—iru uju na ịkwa ákwá. Enweghị mgbakwunye nkọwa okpukpe ma ọ bụ mgbanwe nke ihe ederede pụtara.'
  naturalness: “Ahụhụ dịrị unu” dabara n’usoro Igbo Baịbụl ma nwee ụda amụma kwesịrị ekwesị. “Ndị afọ juru,” “agụụ ga-agụ unu,” “ndị na-achị ọchị,” “unu ga-eru uju, beekwa ákwá” bụ Igbo Standard eke, doo anya, ma debe usoro na mkpụmkpụ nke amaokwu ahụ.
  terminology: A họpụtara okwu ndị kwekọrọ n’ụdị na ụda nke amaokwu ahụ. “Ahụhụ dịrị unu” na-egosi οὐαί karịa okwu ọmịiko nkịtị; “afọ juru” na “agụụ ga-agụ” na-echekwa ọdịiche dị n’etiti afọ ojuju dị ugbu a na agụụ ga-adị; “eru uju” na “ịkwa ákwá” na-edobe ngwaa abụọ dị iche, πενθήσετε na κλαύσετε.
