id: LUK.6.25
reference: Luke 6:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: ig
  text: Ahụhụ dịrị unu ndị afọ juru ugbu a, n’ihi na agụụ ga-agụ unu. Ahụhụ dịrị unu ndị na-achị ọchị ugbu a, n’ihi na unu ga-eru uju, beekwa ákwá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: Ahụhụ dịrị unu
  rationale: Ọ na-ejigide ike nke ịma ikpe na ịdọ aka ná ntị dị n’okwu amụma ahụ, kama ime ka ọ bụrụ naanị okwu ọmịiko.
- source_word: ἐμπεπλησμένοι
  choice: ndị afọ juru
  rationale: Na-egosi ọnọdụ dị ugbu a nke mmadụ rijuru afọ, ma na-edobe ọdịiche ya na agụụ ga-abịa.
- source_word: νῦν
  choice: ugbu a
  rationale: Na-edobe ọdịiche oge dị n’etiti ọnọdụ ugbu a na mgbanwe ga-abịa.
- source_word: πεινάσετε
  choice: agụụ ga-agụ unu
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu ọnọdụ agụụ n’ọdịnihu.
- source_word: γελῶντες
  choice: ndị na-achị ọchị
  rationale: Na-egosi omume ịchị ọchị nke na-aga n’ihu ugbu a, n’enweghị ịgbasa ya ka ọ bụrụ ọṅụ n’ozuzu.
- source_word: πενθήσετε
  choice: unu ga-eru uju
  rationale: Na-egosi iru uju miri emi ma na-edobe ya iche n’ịkwa ákwá nke sochiri ya.
- source_word: κλαύσετε
  choice: beekwa ákwá
  rationale: Na-echekwa mmụba ike okwu ahụ site n’iru uju ruo n’ịkwa ákwá.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-ewebata ihe kpatara ahụhụ ahụ n’ụzọ doro anya ma bụrụ Igbo eke.
theological_decisions:
- issue: Ụdị okwu ahụhụ a
  choice: Ịdọ aka ná ntị dịka okwu amụma banyere mgbanwe na ikpe ga-abịa n’ahụ ndị rijuru afọ ma na-achị ọchị ugbu a
  alternative: Naanị nkọwa mmekọrịta mmadụ banyere otú ọnọdụ ndụ si agbanwe
  rationale: Nkwughachi οὐαί, ngwaa ọdịnihu, na njikọ ya na ngọzi ndị gbara ya gburugburu na-egosi ịdọ aka ná ntị banyere mgbanwe ga-abịa; nsụgharị ahụ akọwaghị usoro mgbanwe ahụ karịa ihe ederede kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma doo ndị nkịtị anya. E ji ‘Ahụhụ dịrị unu’ mee ka olu amụma na ikpe pụta ìhè; e jikwa akpaalaokwu Igbo ‘afọ juru’ na ‘agụụ ga-agụ’ mee ka okwu ahụ bụrụ eke.
