  to: Ọ bụrụkwa na unu hụrụ ndị hụrụ unu n’anya n’anya, gịnị bụ otuto unu?[a] N’ihi na ọbụna ndị mmehie na-ahụkwa ndị hụrụ ha n’anya n’anya.
