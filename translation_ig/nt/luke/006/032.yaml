  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: ig
  text: Ọ bụrụkwa na unu hụrụ ndị hụrụ unu n’anya n’anya, gịnị bụ otuto unu?[a] N’ihi na ọbụna ndị mmehie na-ahụkwa ndị hụrụ ha n’anya n’anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gịnị bụ amara unu?” Okwu Grik a pụkwara ịpụta “amara,” “otuto,” ma ọ bụ “mmasị”; n’ebe a, ọ na-ekwu maka ihe kwesịrị otuto.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: hụrụ ... n’anya / hụrụ ... n’anya / na-ahụ ... n’anya
  rationale: E ji otu akpaokwu Igbo ahụ n’anya mee ihe ugboro atọ iji chekwaa nkwughachi na njikọ okwu dị na Grik, ma mee ka okwu ahụ bụrụ nke e ji asụsụ Igbo nkịtị na-ekwu.
- source_word: ποία
  choice: olee ihe
  rationale: N’ajụjụ a, ποία na-ajụ ihe ma ọ bụ ụdị uru kwesịrị otuto dị na omume ahụ; ‘olee ihe’ bụ ụzọ doro anya ma dịkwa eke e si jụọ ya n’Igbo.
- source_word: χάρις
  choice: ihe kwesịrị otuto unu na-enweta
  rationale: N’ebe a, χάρις na-ekwu maka nnabata ma ọ bụ otuto mmadụ kwesịrị inweta n’ihi omume ya, ọ bụghị amara nzọpụta. Nsụgharị a na-eme ka echiche ahụ doo ndị na-agụ Igbo anya ma ghara ibubata ihe ọ pụtara n’ozizi nke na-abụghị isi okwu ebe a.
- source_word: ἁμαρτωλοὶ
  choice: ndị mmehie
  rationale: Nke a bụ nsụgharị kwụ ọtọ ma bụrụkwa okwu a na-aghọta nke ọma maka aha e si n’adjective Grik mee.
- source_word: καὶ γὰρ
  choice: N’ihi na ọbụna
  rationale: ‘N’ihi na’ na-egosi na ahịrịokwu nke abụọ na-enye ihe kpatara ajụjụ ahụ, ebe ‘ọbụna’ na-echekwa ike καί nke na-etinye ndị mmehie n’ihe atụ ahụ.
- source_word: ὑμῖν
  choice: unu ... na-enweta
  rationale: 'A tụgharịrị dative ahụ n’ụzọ dabara n’usoro okwu Igbo: ihe kwesịrị otuto nke na-abịara ma ọ bụ nke unu na-enweta.'
theological_decisions:
- issue: Ihe χάρις pụtara n’okwu Jizọs a
  choice: ihe kwesịrị otuto ma ọ bụ nnabata mmadụ na-enweta
  alternative: amara; ekele
  rationale: Ọnọdụ okwu a na-atụle ma ịhụ naanị ndị hụrụ mmadụ n’anya ò nwere ihe pụrụ iche kwesịrị otuto. Ya mere, a naghị akọwa χάρις ebe a dịka amara nzọpụta; ma e debere ‘amara’ n’ala peeji iji chekwaa oke ihe okwu Grik ahụ pụrụ ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. A hapụrụ nkwughachi nke ‘hụrụ ... n’anya’ ka ike okwu Jizọs na ntụnyere ya ghara ifu. Akara ala peeji [a] dị n’isi ederede dịka achọrọ.
