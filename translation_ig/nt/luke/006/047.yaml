  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: ig
  text: Onye ọ bụla na-abịakwute m, na-anụ okwu m ma na-eme ihe okwu m kwuru—aga m egosi unu onye ọ dị ka ya:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “onye ọ dị ka ya.” Nke a na-ebute ntụnyere Jizọs ga-akọwa n’amaokwu na-esote.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: Onye ọ bụla na-abịakwute m
  rationale: Nke a na-egosipụta onye ọ bụla n’enweghị oke; “na-abịakwute m” na-enye echiche ngagharị πρός με n’Igbo nkịtị.
- source_word: ἀκούων μου τῶν λόγων
  choice: na-anụ okwu m
  rationale: Ọ na-edobe ihe okwu Grik kwuru ozugbo na usoro yiri nke “na-emekwa”; “okwu m” nwere ike ịpụta okwu ma ọ bụ nkuzi Jizọs n’ebe a.
- source_word: ποιῶν αὐτούς
  choice: na-emekwa ha
  rationale: “Ime” na-edobe njikọ doro anya n’etiti ịnụ okwu ndị ahụ na ime ha, ya bụ itinye ha n’ọrụ, n’agbanyeghị na okwu ahụ dị mkpirikpi karịa nkọwa ahụ.
- source_word: ὑποδείξω ὑμῖν
  choice: aga m egosi unu
  rationale: Nke a bụ ntụgharị eke nke ọdịnihu ὑποδείξω na nnọchiaha ọtụtụ ὑμῖν.
- source_word: τίνι ἐστὶν ὅμοιος
  choice: onye ọ dị ka ya
  rationale: τίνι bụ dative nke onye a na-atụnyere ya; Igbo na-ekwu ya n’ụzọ eke dị ka “onye ọ dị ka ya,” ma na-edobe ntụnyere onye ga-apụta n’amaokwu na-esote.
theological_decisions:
- issue: Nnọchiaha nwoke otu onye e ji anọchi anya mmadụ niile
  choice: Jiri “onye ọ bụla” na “ọ,” nke na-adịghị egosi nwoke ma ọ bụ nwaanyị n’Igbo
  alternative: Itinye okwu nwoke dịka “nwoke ahụ” iji ṅomie ụdị nwoke nke ụtọasụsụ Grik
  rationale: Ụdị nwoke otu onye dị na Grik bụ nke a na-eji ekwu maka onye ọ bụla. Igbo anaghị achọ ka nnọchiaha onye nke atọ “ọ” gosi okike, ya mere ntụgharị a na-edobe otu onye na mkpokọta mmadụ niile n’etinyeghị nwoke ebe ihe ahụ abụghị isi okwu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E debere usoro atọ ahụ—ịbịakwute, ịnụ, na ime—n’ụdị yiri ibe ha. “Na-emekwa ha” na-adị ntakịrị kpọmkwem, ma ọ na-echekwa njikọ okwu nke ederede Grik; n’ebe a ọ pụtara ime ihe okwu ndị ahụ kwuru.
