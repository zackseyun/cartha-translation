review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the universal subject, the three coordinated actions, the future force of ὑποδείξω, and the personal comparison introduced by τίνι ἐστὶν ὅμοιος. The phrase “na-emekwa ha,” however, is not a clear or idiomatic Igbo way to express doing/acting on spoken words and can obscure ποιῶν αὐτούς.
  naturalness: “Onye ọ bụla na-abịakwute m, na-anụ okwu m” is natural Standard Igbo. Recasting the final participial action as “na-eme ihe okwu m kwuru” gives a clear, current Igbo expression for putting Jesus’ words into practice while retaining the source’s concrete connection between the words and obedient action. “Onye ọ dị ka ya” is a natural way to retain the source’s personal comparison.
  terminology: '“Okwu m” suitably renders λόγοι in this context. No gendered term is needed: Igbo “ọ” is naturally generic and preserves the singular representative construction without importing a sex-specific meaning.'
  issues:
  - severity: medium
    issue: “na-emekwa ha” is unclear/unnatural with “okwu m.”
    rationale: Although it attempts to mirror ποιῶν αὐτούς (“doing them”), Igbo does not naturally use “ime ha” for obeying or carrying out words. The wording may leave readers unsure what is being done. “Na-eme ihe okwu m kwuru” expresses the intended action without adding doctrinal content.
