  rationale: The revision replaces only the unclear expression for ποιῶν αὐτούς. “Na-eme ihe okwu m kwuru” is idiomatic Standard Igbo for acting in accordance with the words and keeps the repeated reference to Jesus’ words explicit. The comparison and its footnote are retained, since the Greek asks to whom such a person is comparable and the following verse supplies the comparison.
