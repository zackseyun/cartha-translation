  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: ig
  text: Ọ bụrụkwa na unu emere ndị na-emere unu ihe ọma ihe ọma, olee otuto dịrị unu?[a] Ọbụna ndị mmehie na-eme otu ihe ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “olee amara dịịrị unu?” Okwu Grik ahụ nwere ike ịpụta “amara,” “ihu ọma,” “ekele,” ma ọ bụ “otuto”; n'ebe a, ọ na-ezo aka n'otuto a na-enye mmadụ maka imere ndị na-emere ya ihe ọma ihe ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε
  choice: unu emere ... ihe ọma
  rationale: Nke a na-egosi ime mmadụ ihe ọma ma na-edobe njikọ okwu ya na participle nke sochirinụ.
- source_word: ἀγαθοποιοῦντας
  choice: ndị na-emere unu ihe ọma
  rationale: E jiri otu isi okwu ahụ, “ime ihe ọma,” mee ka nkwughachi dị na Grik pụta ìhè n'Igbo eke.
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: olee otuto unu kwesịrị inweta?
  rationale: N'ebe a χάρις na-ezo aka n'otuto ma ọ bụ nnabata mmadụ ga-enweta n'ihi omume ya, ọ bụghị amara nzọpụta. Usoro a bụ ajụjụ nkọcha doro ndị na-agụ Igbo anya.
- source_word: ἁμαρτωλοὶ
  choice: ndị mmehie
  rationale: Nke a bụ ntụgharị kwụ ọtọ, nke a na-aghọta nke ọma maka aha otu ndị ahụ n'okwu Luk.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: na-eme otu ihe ahụ
  rationale: Nke a na-enye okwu Grik ahụ n'ụzọ Igbo dị mfe ma zie ezi.
- source_word: καὶ
  choice: Ọ bụrụkwa / Ọbụna
  rationale: “-kwa” na-edobe njikọ ya na usoro okwu ndị gbara ya gburugburu; “Ọbụna” na-egosi ike mgbakwunye nke καὶ nke abụọ.
theological_decisions:
- issue: Ihe χάρις pụtara n'ozizi gbasara omume ọma
  choice: otuto mmadụ kwesịrị inweta
  alternative: amara; ihu ọma; ekele
  rationale: Ajụjụ ahụ na-atụle ma imere naanị ndị na-emere mmadụ ihe ọma ò kwesịrị otuto pụrụ iche. Ya mere, a zere ịmanye echiche banyere amara nzọpụta n'ebe okwu ahụ na-adịghị ekwu ya, ma e debere ụzọ ọzọ n'ala ala peeji.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke “ime ihe ọma” na ọdịdị ajụjụ nkọcha nke amaokwu ahụ.
