review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the conditional construction, reciprocal doing of good, rhetorical question, and concluding comparison with sinners. However, “unu kwesịrị inweta” adds the idea of what the hearers ‘ought to receive,’ whereas ποία ὑμῖν χάρις ἐστίν asks more directly what credit, favor, or commendation is theirs.
  naturalness: The repeated phrase “emere ... ihe ọma” is understandable and appropriately preserves the Greek verbal repetition. Replacing “olee otuto unu kwesịrị inweta?” with “olee otuto dịrị unu?” produces a more direct and idiomatic rendering of the rhetorical question without added modal nuance.
  terminology: “Ndị mmehie” is an appropriate standard Igbo rendering of ἁμαρτωλοί. “Otuto” suitably conveys commendation/credit in this context, while the footnote responsibly retains “amara” as a lexical alternative without importing a theological sense.
  issues:
  - severity: medium
    issue: The phrase “unu kwesịrị inweta” adds a modal sense.
    rationale: The Greek says literally, “what χάρις is to/for you?” It does not expressly state that the hearers deserve or ought to receive the commendation. “Olee otuto dịrị unu?” preserves the rhetorical question more closely.
  revised_text: Ọ bụrụkwa na unu emere ndị na-emere unu ihe ọma ihe ọma, olee otuto dịrị unu?[a] Ọbụna ndị mmehie na-eme otu ihe ahụ.
