  to: Ọ bụrụkwa na unu emere ndị na-emere unu ihe ọma ihe ọma, olee otuto dịrị unu?[a] Ọbụna ndị mmehie na-eme otu ihe ahụ.
  rationale: The revision removes the added ‘should receive’ nuance and renders ποία ὑμῖν χάρις ἐστίν more directly as “olee otuto dịrị unu?” The footnote is adjusted correspondingly and retains the lexical ambiguity of χάρις. No doctrinal interpretation is added.
