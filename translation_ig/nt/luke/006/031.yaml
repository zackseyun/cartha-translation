reference: Luke 6:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: ig
  text: Dị ka unu chọrọ ka ndị mmadụ meere unu[a], meerenụ ha otu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Dị ka unu si chọọ ka ndị mmadụ meere unu, meerenụ ha otu ahụ.”
    reason: Ụzọ ọzọ e si hazie nkebi ntụnyere ahụ n’Igbo; ọ na-edobe “ndị mmadụ” dịka ntụgharị nke οἱ ἄνθρωποι.
lexical_decisions:
- source_word: καθὼς
  choice: Dị nnọọ ka
  rationale: Ọ na-egosi ụkpụrụ ntụnyere; ‘Dị nnọọ ka’ na-edobe ike ntụnyere ahụ n'Igbo doro anya.
- source_word: θέλετε
  choice: unu chọrọ
  rationale: Ọ na-egosi ihe mmadụ na-achọ ma ọ bụ na-atụ anya ya; ‘chọrọ’ bụ okwu Igbo nkịtị ma kwụ ọtọ.
- source_word: ἵνα ποιῶσιν ὑμῖν
  choice: ka ndị mmadụ meere unu
  rationale: Usoro ‘chọrọ ka … meere unu’ na-egosi ihe ha chọrọ ka e mee maka ha, ma na-edobekwa obosara nke ποιέω karịa ịsụgharị ya dị ka ‘mesoo.’
- source_word: οἱ ἄνθρωποι
  choice: ndị mmadụ
  rationale: Okwu Grik a na-ezo aka n'ụmụ mmadụ n'ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: ποιεῖτε αὐτοῖς
  choice: meerenụ ha
  rationale: Ụdị iwu ‘meerenụ’ na-enye iwu ahụ ozugbo, ma na-emegharị otu ngwaa ahụ e ji mee ihe na nkebi mbụ.
- source_word: ὁμοίως
  choice: otu ahụ
  rationale: Ọ na-egosi na ihe a ga-emere ha ga-adaba n'ihe unu chọrọ ka ha meere unu.
theological_decisions:
- issue: Ma οἱ ἄνθρωποι ọ na-ezo naanị aka n'ụmụ nwoke
  choice: ndị mmadụ
  alternative: ndị nwoke
  rationale: N'ebe a, okwu ahụ bụ maka mmadụ niile n'ozuzu; ya mere, ‘ndị mmadụ’ na-ezere itinye nkọwa nke na-egbochi ụmụ nwanyị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị mfe ma nwee ugwu. A hapụrụ ‘mee/meere’ ka ọ bụrụ okwu sara mbara dịka ποιέω, kama iji ‘mesoo’ nke ga-eme ka ihe ọ pụtara dị warara.
