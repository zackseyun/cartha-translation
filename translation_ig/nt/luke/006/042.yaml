revisions:
- from: Olee otu ị ga-esi asị nwanne gị nwoke[c], ‘Nwanne m nwoke, hapụ m ka m wepụ irighiri ihe[a] dị n’anya gị,’ ebe gị onwe gị na-adịghị ahụ nnukwu ogwe osisi[b] dị n’anya nke gị? Onye ihu abụọ! Buru ụzọ wepụ nnukwu ogwe osisi ahụ n’anya nke gị; mgbe ahụ, ị ga-ahụ nke ọma, nwee ike iwepụ irighiri ihe dị n’anya nwanne gị nwoke.
  to: Olee otu ị ga-esi asị nwanne gị nwoke[c], ‘Nwanne m nwoke, hapụ m ka m wepụ irighiri ihe[a] dị n’anya gị,’ ebe gị onwe gị na-adịghị ahụ nnukwu osisi e ji arụ ụlọ[b] dị n’anya nke gị? Onye ihu abụọ! Buru ụzọ wepụ nnukwu osisi e ji arụ ụlọ ahụ n’anya nke gị; mgbe ahụ, ị ga-ahụ nke ọma iji wepụ irighiri ihe dị n’anya nwanne gị nwoke.
  rationale: The revision sharpens the lexical contrast by rendering δοκός as a substantial building timber rather than a generic large trunk/log, and it makes the final purpose relation conform more closely to διαβλέψεις ... ἐκβαλεῖν. No theological interpretation has been added, and the masculine singular kinship wording is retained.
