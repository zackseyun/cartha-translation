review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the rhetorical question, the emphatic contrast ('gị onwe gị'), the direct rebuke, and the sequence of first removing one's own obstruction before addressing the brother's. However, 'nnukwu ogwe osisi' normally evokes a large log or tree trunk more readily than δοκός, which specifically denotes a substantial construction timber/beam. The final clause can also more directly express διαβλέψεις ... ἐκβαλεῖν ('see clearly in order to remove') without adding 'nwee ike' ('be able').
  naturalness: The Igbo is generally clear and appropriately forceful. 'Ị ga-ahụ nke ọma iji wepụ' is more idiomatic and tightly connected to the Greek purpose-infinitive construction than 'ị ga-ahụ nke ọma, nwee ike iwepụ.'
  terminology: Retain 'nwanne gị nwoke' to represent the masculine singular ἀδελφός and 'Onye ihu abụọ!' for ὑποκριτά. Render δοκός as 'nnukwu osisi e ji arụ ụlọ' so that the large timber/beam imagery is clear and the contrast with the tiny κάρφος remains vivid.
  issues:
  - severity: medium
    issue: The rendering 'nnukwu ogwe osisi' is semantically less precise for δοκός.
    rationale: An ogwe osisi is commonly understood as a trunk/log; δοκός is a heavy timber or beam, often structural. 'Nnukwu osisi e ji arụ ụlọ' better preserves the source image without selecting an overly narrow modern construction term.
  - severity: low
    issue: The phrase 'nwee ike iwepụ' slightly explicates the final construction.
    rationale: διαβλέψεις followed by the infinitive means seeing clearly so as to remove the speck. 'Iji wepụ' expresses that relation directly and avoids adding an explicit notion of capability.
