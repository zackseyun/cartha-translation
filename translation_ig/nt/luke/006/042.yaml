id: LUK.6.42
reference: Luke 6:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: ig
  text: Olee otu ị ga-esi asị nwanne gị nwoke[c], ‘Nwanne m nwoke, hapụ m ka m wepụ irighiri ihe[a] dị n’anya gị,’ ebe gị onwe gị na-adịghị ahụ nnukwu osisi e ji arụ ụlọ[b] dị n’anya nke gị? Onye ihu abụọ! Buru ụzọ wepụ nnukwu osisi e ji arụ ụlọ ahụ n’anya nke gị; mgbe ahụ, ị ga-ahụ nke ọma iji wepụ irighiri ihe dị n’anya nwanne gị nwoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “obere iberibe ihe kpọrọ nkụ.” Okwu Grik κάρφος na-ezo aka n’otu obere ihe kpọrọ nkụ nke ukwuu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya “ogwe osisi” ma ọ bụ “beam.” Okwu Grik δοκός na-ezo aka n’osisi buru ibu e ji arụ ma ọ bụ akwado ụlọ.
    reason: lexical_alternative
  - marker: c
    text: “Nwanne gị nwoke” sụgharịrị okwu Grik ἀδελφός, nke dị n’ụdị otu nwoke. Ozizi a nwere ike ịmetụta ndị ọzọ n’ozuzu, ma okwu Grik e ji dee ya kpọrọ nwoke aha.
    reason: cultural_note
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: Olee otu ị ga-esi asị
  rationale: Ọ bụ ajụjụ e ji agba onye a na-agwa aka ná ntị ma maa omume ya ikpe; ntụgharị a na-ada nke ọma n’Igbo ma na-edobe ike ajụjụ ahụ.
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: nwanne gị nwoke / Nwanne m nwoke / nwanne gị nwoke
  rationale: Nke a na-edobe ụdị nwoke na otu onye nke okwu Grik ἀδελφός, ma jiri okwu Igbo doro anya ma dị ndụ.
- source_word: ἄφες ἐκβάλω
  choice: hapụ m ka m wepụ
  rationale: N’ebe a ἄφες bụ arịrịọ ka e kwe ka onye ahụ mee ihe, ebe ἐκβάλλω pụtara iwepụ ihe dị n’anya.
- source_word: κάρφος
  choice: irighiri ihe
  rationale: Okwu a na-egosi obere iberibe ihe kpọrọ nkụ; ‘irighiri ihe’ na-eme ka ịdị nta ya doo anya ma na-emegide nnukwu ogwe osisi.
- source_word: αὐτὸς ... οὐ βλέπων
  choice: ebe gị onwe gị na-adịghị ahụ
  rationale: ‘Gị onwe gị’ na-edobe nkwusi ike nke αὐτός na ọdịiche dị n’etiti ịhụ ntụpọ onye ọzọ na enweghị ike ịhụ nke onwe.
- source_word: δοκός
  choice: nnukwu ogwe osisi
  rationale: δοκός bụ nnukwu osisi e ji akwado ụlọ; ‘nnukwu ogwe osisi’ na-edobe ihe atụ ahụ na nnukwu ọdịiche ya na irighiri ihe.
- source_word: ὑποκριτά
  choice: Onye ihu abụọ!
  rationale: Nke a bụ ịkpọ onye ahụ aha ozugbo n’ụdị mba ike; okwu Igbo a bụ nke a na-aghọta nke ọma maka onye omume ya na ihe ọ na-egosi adịghị otu.
- source_word: διαβλέψεις
  choice: ị ga-ahụ nke ọma
  rationale: Okwu ahụ pụtara ịhụ ụzọ nke ọma ma ọ bụ ịhụ nke ọma; ntụgharị a na-edobe njikọ ya na ihe atụ nke anya.
theological_decisions:
- issue: Ụdị nwoke nke okwu ἀδελφός n’ozizi metụtara omume
  choice: nwanne ... nwoke
  alternative: nwanne / onye otu gị
  rationale: Ọ bụ ezie na ozizi ahụ nwere ike iru mmadụ niile, ederede Grik kpọrọ otu nwoke aha kpọmkwem; ya mere a hapụghị ụdị nwoke ahụ n’enweghị ihe àmà.
- issue: Nnukwu ọdịiche ihe atụ dị n’etiti κάρφος na δοκός
  choice: irighiri ihe ... nnukwu ogwe osisi
  alternative: obere iberibe osisi ... osisi e ji arụ ụlọ
  rationale: Nhọrọ ahụ na-edobe ikwubiga ihe ókè nke Jizọs ji gosi na mmadụ nwere ike ilekwasị anya n’obere mmejọ onye ọzọ ma ghara ịhụ nnukwu nke onwe ya, n’enweghị ịkọwa ihe atụ ahụ karịa ihe ederede kwuru.
- issue: Ebumnuche nke ajụjụ πῶς δύνασαι
  choice: Olee otu ị ga-esi asị
  alternative: Olee otu i nwere ike isi kwuo
  rationale: A hapụrụ ya dịka ajụjụ siri ike nke nwere ike imetụta ma ikike ma izi ezi nke omume ahụ, kama ịkọwa ya naanị dịka enweghị ikike anụ ahụ ma ọ bụ naanị dịka mmachibido iwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Onye ihu abụọ!’ iji chekwaa ike nke ịba mba ahụ; e jikwa ‘nnukwu ogwe osisi’ mee ka ihe atụ ụlọ na nnukwu ọdịiche ahụ pụta ìhè.
