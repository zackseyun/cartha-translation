reference: Luke 6:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: ig
  text: Ìgwè mmadụ ahụ dum na-achọ imetụ ya aka, n’ihi na ike na-esi n’ebe ọ nọ apụta, na-agwọkwa ha niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: Ìgwè mmadụ ahụ dum
  rationale: Nke a na-egosipụta aha mkpokọta dị n’otu n’ụzọ Igbo sitere n’okike, ma na-echekwa echiche na ìgwè ahụ niile so na ya.
- source_word: ἐζήτουν
  choice: nọ na-agbalị
  rationale: Ọdịdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ a na-eme ugboro ugboro; ‘nọ na-agbalị’ na-eweta nke a n’Igbo nke oge a.
- source_word: ἅπτεσθαι
  choice: imetụ ya aka
  rationale: N’ọnọdụ ọgwụgwọ a, okwu ahụ pụtara imetụ mmadụ aka ma ọ bụ ịkpọtụrụ ya; nkebiokwu Igbo a bụ nke doro anya ma dị n’okike.
- source_word: δύναμις
  choice: ike
  rationale: ‘Ike’ na-echekwa okwu Grik n’enweghị ịgbakwunye nkọwa dịka ‘ike ọrụ ebube,’ bụ́ nke ọnọdụ ahụ na-egosi ma ederede ahụ ekwughị kpọmkwem.
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: si n’ime ya na-apụta
  rationale: Nke a na-egosipụta ike nke na-esi n’ebe Jizọs nọ apụta mgbe niile. ‘N’ime ya’ bụ ụzọ Igbo sitere n’okike isi kwuo na ike ahụ sitere n’ahụ ya ma ọ bụ n’ebe ọ nọ.
- source_word: ἰᾶτο
  choice: na-agwọkwa
  rationale: Ụdị na-aga n’ihu na-echekwa imperfect Grik ahụ, ebe ‘-kwa’ na-ejikọta ọgwụgwọ ahụ na mpụta ike ahụ.
- source_word: πάντας
  choice: ha niile
  rationale: Nke a na-eme ka ndị a na-agwọ doo anya n’Igbo ma na-echekwa echiche ‘ha niile.’
theological_decisions:
- issue: Ụdị ike (δύναμις) nke si na Jizọs apụta
  choice: ike si n’ime ya na-apụta
  alternative: ike ọrụ ebube si n’ime ya na-apụta
  rationale: Nsụgharị ahụ na-egosi Jizọs dị ka ebe ike ọgwụgwọ ahụ si abịa, ma ọ naghị atụkwasị okwu nkọwa nke Grik na-ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Ìgwè mmadụ ahụ dum’ mee ka mkpokọta ahụ doo anya, ma jiri usoro ngwaa na-aga n’ihu chekwaa akụkụ imperfect nke ngwaa Grik.
