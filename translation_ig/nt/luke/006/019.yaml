revisions:
- from: Ìgwè mmadụ ahụ dum nọ na-agbalị imetụ ya aka, n’ihi na ike si n’ime ya na-apụta, na-agwọkwa ha niile.
  to: Ìgwè mmadụ ahụ dum na-achọ imetụ ya aka, n’ihi na ike na-esi n’ebe ọ nọ apụta, na-agwọkwa ha niile.
  rationale: The revision removes the unwarranted interior sense introduced by “n’ime ya” and uses “na-achọ” for the crowd’s ongoing effort or desire. It retains the collective crowd, the ongoing emanation of power, and the healing of all, without adding theological interpretation.
  reviewer_model: gpt-5.6-terra
