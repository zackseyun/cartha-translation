review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the crowd’s desire to touch Jesus and the healing of all. However, “si n’ime ya” means “from inside him,” which is more specific and bodily than Greek παρ’ αὐτοῦ (“from him/from his presence”) warrants. “Na-achọ” more directly represents ἐζήτουν (“were seeking/trying”) than “nọ na-agbalị.”
  naturalness: The revised wording is idiomatic Standard Igbo, maintains a dignified biblical register, and expresses the Greek imperfects naturally through ongoing-action phrasing.
  terminology: “Ike” faithfully renders δύναμις without doctrinal expansion. “N’ebe ọ nọ” appropriately renders the source relation without adding the bodily nuance of “n’ime ya.”
  issues:
  - severity: medium
    issue: “si n’ime ya na-apụta” over-specifies παρ’ αὐτοῦ.
    rationale: The Greek says that power was proceeding from Jesus, not explicitly from within his body. In Standard Igbo, “n’ime ya” ordinarily adds an interior/bodily sense.
  - severity: low
    issue: “nọ na-agbalị” is less direct for ἐζήτουν.
    rationale: The verb ζητέω denotes seeking or desiring to do something; “na-achọ imetụ ya aka” preserves this sense and the ongoing aspect more closely.
  revised_text: Ìgwè mmadụ ahụ dum na-achọ imetụ ya aka, n’ihi na ike na-esi n’ebe ọ nọ apụta, na-agwọkwa ha niile.
  revised_footnotes: []
  revision_rationale: The revision removes the unwarranted interior sense introduced by “n’ime ya” and uses “na-achọ” for the crowd’s ongoing effort or desire. It retains the collective crowd, the ongoing emanation of power, and the healing of all, without adding theological interpretation.
