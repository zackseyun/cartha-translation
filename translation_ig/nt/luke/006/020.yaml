id: LUK.6.20
reference: Luke 6:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: ig
  text: Ya onwe ya weliri anya ya lekwasị ndị na-eso ụzọ ya anya, wee sị, “Ngọzi na-adịrị unu ndị ogbenye[a][b], n’ihi na alaeze Chineke bụ nke unu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-esochi usoro Grik nke ọma karịa, “Ngọzi na-adịrị ndị ogbenye.” Okwu Grik ahụ dị n’ụdị onye nke atọ, ma “nke unu” nke na-esochi ya na-egosi na ọ na-agwa ha okwu kpọmkwem.
    reason: lexical_alternative
  - marker: b
    text: Luk kwuru “ndị ogbenye,” ọ bụghị “ndị ogbenye n’ime mmụọ” (tụnyere Matiu 5:3).
    reason: cross_reference
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: O weliri anya ya
  rationale: Nke a na-edobe ihe oyiyi doro anya dị n’asụsụ Grik, ma bụrụkwa okwu Igbo nkịtị maka ibuli anya ele ihe.
- source_word: εἰς τοὺς μαθητὰς αὐτοῦ
  choice: lee ndị na-eso ụzọ ya
  rationale: “Lee” na-egosi na o duziri anya ya n’ebe ndị na-eso ụzọ ya nọ; ọ na-asụkwa nke ọma n’Igbo karịa ntụgharị siri ike nke “n’ebe ... nọ.”
- source_word: ἔλεγεν
  choice: wee na-asị
  rationale: Ụdị ngwaa imperfect na-ewebata okwu ọ nọ na-ekwu; “wee na-asị” na-egosi mmalite na-aga n’ihu nke okwu ahụ n’Igbo nkịtị.
- source_word: Μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Nke a na-eburu echiche nke ịbụ onye Chineke kwadoro ma gọzie, kama ime ka okwu ahụ bụrụ naanị inwe obi ụtọ.
- source_word: οἱ πτωχοί
  choice: unu ndị ogbenye
  rationale: Ọ bụ ezie na okwu Grik ahụ dị n’ụdị onye nke atọ, ὑμετέρα na-esochi ya na-eme ka o doo anya na Jizọs na-agwa ndị na-eso ụzọ ya okwu kpọmkwem. “Ndị ogbenye” na-edobe ihe Luk dere n’etinyeghị “n’ime mmụọ.”
- source_word: ὅτι
  choice: n’ihi na
  rationale: Nke a na-egosi ihe kpatara a ji kpọọ ha ndị a gọziri agọzi.
- source_word: ὑμετέρα ἐστὶν
  choice: bụ nke unu
  rationale: Nke a na-edobe nkwupụta kpọmkwem banyere onye alaeze ahụ bụ nke ya, ma bụrụkwa Igbo doro anya.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Ọ bụ okwu Igbo a maara nke ọma, ọ na-edobekwa ohere nghọta nke βασιλεία dịka ọchịchị na alaeze Chineke.
theological_decisions:
- issue: Ma a ga-akọwa πτωχοί dịka ịda ogbenye n’ime mmụọ ka ọ bụ hapụ ya dịka “ndị ogbenye”
  choice: ndị ogbenye
  alternative: ndị ogbenye n’ime mmụọ
  rationale: Luk dere naanị “ndị ogbenye”; ịgbakwunye “n’ime mmụọ” ga-eme ka amaokwu a kwekọọ na Matiu 5:3 n’ụzọ ihe odide Grik nke Luk na-akwadoghị.
- issue: Ma a ga-asụ ngọzi ahụ n’ụdị onye nke atọ ka ọ bụ dịka okwu a na-agwa ndị na-eso ụzọ kpọmkwem
  choice: Ngọzi na-adịrị unu ndị ogbenye
  alternative: Ngọzi na-adịrị ndị ogbenye
  rationale: οἱ πτωχοί bụ onye nke atọ n’ụdị okwu ya, ma ὑμετέρα (“nke unu”) na-eme ka adreesị ahụ bụrụ nke kpọmkwem. Isiokwu na ndetu ala peeji na-echekwa ma ọdịdị ụtọasụsụ ahụ ma ntụgharị okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ngọzi na-adịrị” na-ezere ime Μακάριοι ka ọ bụrụ naanị mmetụta obi ụtọ; “unu ndị ogbenye” na-eme ka okwu kpọmkwem ahụ doo anya, ebe ndetu [a] na-echekwa ọdịdị onye nke atọ nke Grik.
