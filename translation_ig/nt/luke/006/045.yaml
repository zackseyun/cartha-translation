id: LUK.6.45
reference: Luke 6:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: ig
  text: Ezi mmadụ na-ewepụta ezi ihe site n’ezi akụ dị n’obi ya, onye ọjọọ na-ewepụta ihe ọjọọ site n’akụ ọjọọ ya; n’ihi na ọnụ ya na-ekwu site n’ụbara[a] obi ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe jupụtara n’obi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: ezi mmadụ
  rationale: Nke a na-egosipụta àgwà ọma mmadụ ahụ n’ụzọ doro anya ma dịkwa eke n’Igbo; “mmadụ” nwekwara ike ịnọchite anya onye ọ bụla dịka ἄνθρωπος si arụ ọrụ n’ilu a.
- source_word: θησαυροῦ
  choice: akụ
  rationale: “Akụ” na-edobe ihe atụ nke ihe bara uru a kwakọbara n’ime mmadụ, ebe okwu na omume ya si apụta.
- source_word: καρδίας
  choice: obi
  rationale: “Obi” bụ okwu Igbo a na-ejikarị akọwa ime mmadụ—echiche, ọchịchọ, na mmetụta ya—ma kwekọọ n’ihe καρδία pụtara ebe a.
- source_word: προφέρει
  choice: na-ewepụta
  rationale: “Na-ewepụta” na-edobe echiche nke iweta ihe site n’ebe e debere ya, ma na-arụ ọrụ nke ọma n’ahịrị abụọ ahụ.
- source_word: πονηρὸς / πονηροῦ / πονηρόν
  choice: onye ọjọọ / akụ ọjọọ / ihe ọjọọ
  rationale: “Ọjọọ” na-edobe ike omume ọma na omume ọjọọ nke πονηρός, ma mee ka ọdịiche ya na “ezi” doo anya.
- source_word: περισσεύματος
  choice: ihe jupụtara
  rationale: N’ahịrịokwu “ihe jupụtara n’obi,” nhọrọ a na-egosi ụbara ma ọ bụ njupụta nke na-apụta n’okwu ọnụ, n’ụzọ Igbo nkịtị ma doo anya.
- source_word: λαλεῖ
  choice: na-ekwu
  rationale: “Na-ekwu” bụ ntụgharị Igbo eke nke λαλεῖ n’ilu a ma nwee ugwu kwesịrị ekwesị.
- source_word: τὸ στόμα αὐτοῦ
  choice: ọnụ ya
  rationale: A hapụrụ “ọnụ ya” dịka ihe odide Grik si kwuo iji mesie mmekọrịta dị n’etiti ihe dị n’obi na ihe ọnụ na-ekwupụta ike.
theological_decisions:
- issue: Ọdịiche gbasara àgwà na omume dị n’etiti ἀγαθός na πονηρός
  choice: “ezi” na “ọjọọ”
  alternative: “dị mma” na “dị njọ”
  rationale: “Ezi” na “ọjọọ” na-edobe ịdị arọ nke ikpe gbasara àgwà mmadụ n’okwu Jizọs, kama ime ka ọ bụrụ naanị ịdị mma ma ọ bụ adịghị mma n’ọrụ.
- issue: Mmekọrịta nke obi na okwu ọnụ
  choice: E debere obi dịka isi iyi nke ihe ọnụ na-ekwu, n’enweghị ịkọwa ma ọ bụ ime ka echiche ahụ dị mfe karịa ihe odide ahụ.
  alternative: Ịsụgharị ya dịka “mmadụ na-ekwu ihe ọ na-eche”
  rationale: Ntụgharị nkọwa ahụ ga-ebelata ihe atụ na nghọta sara mbara nke καρδία dịka ime mmadụ dum.
translation_notes:
  register: Asụsụ Igbo Ọha a bụ nke ugbu a, dị ugwu, ma dị mfe nghọta. E debere ihe atụ nke akụ, obi, na ọnụ. Akara ntụaka [a] dị n’isi ederede ma na-enye ntụgharị ọzọ maka περισσεύματος.
