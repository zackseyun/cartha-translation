revisions:
- from: Ezi mmadụ na-ewepụta ezi ihe site n’ezi akụ dị n’obi ya, onye ọjọọ na-ewepụtakwa ihe ọjọọ site n’akụ ọjọọ dị n’obi ya; n’ihi na ọnụ ya na-ekwu ihe jupụtara n’obi ya.[a]
  to: Ezi mmadụ na-ewepụta ezi ihe site n’ezi akụ dị n’obi ya, onye ọjọọ na-ewepụta ihe ọjọọ site n’akụ ọjọọ ya; n’ihi na ọnụ ya na-ekwu site n’ụbara[a] obi ya.
  rationale: Ndozigharị a na-ewepụ mgbakwunye ‘dị n’obi ya’ n’ahịrị nke abụọ ka asịmẹtri dị na Grik wee dịgide, ma na-atụgharị περισσεύματος dịka ‘ụbara’ n’ederede bụ isi. A debere nhọrọ Igbo dị mfe ‘ihe jupụtara n’obi ya’ n’ala ala peeji. E debekwara okwu ndị bụ isi na ihe atụ nke isi mmalite n’enweghị itinye nkọwa ozizi.
  reviewer_model: gpt-5.6-terra
