review_pass:
  verdict: revise
  source_fidelity: A na-edobe ọdịiche dị n’etiti ezi na ihe ọjọọ, yana ihe atụ nke akụ, obi, na ọnụ. Otú ọ dị, ederede a tinyeere akụkụ nke abụọ ‘dị n’obi ya,’ nke SBLGNT anaghị ekwu n’akụkụ ahụ; Grik na-eji ‘ihe ọjọọ/akụ ọjọọ’ n’ụzọ a hapụrụ aha akụ ka e were ghọta ya. Ọzọkwa, ‘ihe jupụtara n’obi ya’ na-eme ka περισσεύματος bụrụ kpọmkwem ọdịnaya obi, kama ‘ụbara/iju oke’ nke obi, nke bụ ihe Grik kwuru.
  naturalness: Ntụgharị ahụ na-agụ nke ọma n’Igbo Ọha. A ga-eme ka nkwughachi ahụ bụrụ nke kwekọrọ n’ahịrị abụọ ahụ site n’iji ‘na-ewepụta’ n’ebe abụọ, ma jiri ‘ụbara obi ya’ n’ahịrị ikpeazụ iji debe ihe atụ Grik.
  terminology: ‘Ezi mmadụ,’ ‘onye ọjọọ,’ ‘akụ,’ ‘obi,’ na ‘ọnụ’ bụ nhọrọ dabara adaba ma bụrụkwa nke a ghọtara n’Igbo. ‘Ụbara’ bụ nhọrọ kwesịrị ekwesị maka περισσεύματος; a pụrụ idebe ‘ihe jupụtara n’obi ya’ dị ka nhọrọ ọzọ n’ala ala peeji.
  issues:
  - severity: medium
    issue: E tinyere ‘dị n’obi ya’ n’akụkụ ‘akụ ọjọọ.’
    rationale: Ederede Grik nwere ἐκ τοῦ πονηροῦ (‘site n’ihe/akụ ọjọọ’) n’enweghị ‘obi ya’ n’akụkụ nke abụọ. Ikwughachi ‘obi ya’ na-eme ka ntụgharị ahụ kwụ ọtọ karịa isi mmalite.
  - severity: medium
    issue: E ji ‘ihe jupụtara n’obi ya’ mee ntụgharị bụ isi maka περισσεύματος.
    rationale: Nke a na-akọwa ihe obi nwere, ebe περισσεύματος na-ekwu maka ụbara ma ọ bụ iju oke nke obi, nke ọnụ si na ya ekwu. E kwesịrị idobe ihe oyiyi ahụ n’ederede bụ isi.
  - severity: low
    issue: Akara ala peeji dị ugbu a na-enye ‘ụbara’ dịka nhọrọ ọzọ, ebe nke ahụ kacha soro isi mmalite.
    rationale: A ga-atụgharị ederede bụ isi ka ọ bụrụ ‘ụbara,’ ma mee ‘ihe jupụtara n’obi ya’ nhọrọ ọzọ.
