- from: ndị bịara ịnụ okwu ya, ka a gwọọkwa ha ọrịa ha; a nọkwa na-agwọ ndị mmụọ na-adịghị ọcha na-enye nsogbu.[a]
  to: ndị bịara ịnụ ya, ka a gwọọkwa ha ọrịa ha; a nọkwa na-agwọ ndị mmụọ na-adịghị ọcha na-enye nsogbu n’ahụ ha.[a]
  rationale: The revision preserves the relative connection to the crowd, the two purpose infinitives, the passive sense of healing, and the imperfect aspect of the final verb. Most importantly, it restores the source’s participant roles by making unclean spirits the cause of the people’s distress and the distressed people the recipients of healing. “Ịnụ ya” is closer to ἀκοῦσαι αὐτοῦ than “ịnụ okwu ya,” which adds “word(s)” absent from the Greek.
