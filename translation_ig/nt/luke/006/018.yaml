review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the purpose of coming, healing from diseases, and the imperfective healing action. However, its final clause reverses the Greek participant roles: it says that people were healing the unclean spirits, whereas the Greek says that people troubled by unclean spirits were being healed.'
  naturalness: The revised wording is natural, clear Standard Igbo. Adding “n’ahụ ha” removes the possible ambiguity over who is receiving the trouble and who is being healed.
  terminology: “mmụọ na-adịghị ọcha” appropriately preserves πνεύματα ἀκάθαρτα without interpretively replacing it with “mmụọ ọjọọ.” “na-enye nsogbu” is a suitably measured rendering of ἐνοχλούμενοι; the note supplies legitimate stronger alternatives.
  issues:
  - severity: high
    issue: The final clause makes “ndị mmụọ na-adịghị ọcha” the direct object of “a nọkwa na-agwọ.”
    rationale: This reverses the syntax and meaning of οἱ ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων ἐθεραπεύοντο. The persons afflicted/troubled by unclean spirits, not the spirits, are those being healed.
  - severity: medium
    issue: The footnote’s alternative is syntactically incomplete/unclear as written.
    rationale: “ndị mmụọ na-adịghị ọcha na-emekpa ahụ” can be read unclearly without identifying the afflicted people. The revised note explicitly identifies the Greek word under discussion and gives alternatives that retain the affected persons as the implied head of the relative expression.
  revised_text: ndị bịara ịnụ ya, ka a gwọọkwa ha ọrịa ha; a nọkwa na-agwọ ndị mmụọ na-adịghị ọcha na-enye nsogbu n’ahụ ha.[a]
