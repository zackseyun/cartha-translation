  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: ig
  text: ndị bịara ịnụ ya, ka a gwọọkwa ha ọrịa ha; a nọkwa na-agwọ ndị mmụọ na-adịghị ọcha na-enye nsogbu n’ahụ ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “na-enye nsogbu” pụkwara ịpụta “ndị a na-emekpa ahụ,” “ndị a na-enye nsogbu,” ma ọ bụ “ndị a na-ata ahụhụ,” dabere n’ọnọdụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: ndị bịara
  rationale: Okwu a na-ejikọta ìgwè mmadụ a na ndị a kpọtụrụ aha n’amaokwu bu ụzọ; “ndị bịara” bụ ụzọ Igbo si aga were mee njikọ ahụ n’enweghị ịgbakwunye ihe ọzọ.
- source_word: ἀκοῦσαι αὐτοῦ
  choice: ịnụ okwu ya
  rationale: N’Igbo, “ịnụ okwu ya” na-egosi nke ọma na ha bịara ige ihe ọ na-ekwu ntị; infinitive a na-egosikwa nzube ha ji bịa.
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: ka a gwọọkwa ha ọrịa ha
  rationale: “Ka a gwọọ ha” na-egosipụta passive na nzube; “ọrịa ha” na-enye echiche nke ịtọhapụ ha n’ọrịa ha n’ụzọ Igbo dị mma.
- source_word: ἐνοχλούμενοι
  choice: na-enye nsogbu
  rationale: Present passive participle na-akọwa ndị mmụọ ndị ahụ nọ na-enye nsogbu. Nhọrọ a anaghị eme ka ike okwu Grik ahụ sie karịa ka ọ dị, ma ọ ka na-ahapụ ohere maka nghọta siri ike karị.
- source_word: ἀπὸ πνευμάτων ἀκαθάρτων
  choice: mmụọ na-adịghị ọcha
  rationale: Nke a na-echekwa aha a na-ejikarị akọwa mmụọ ọjọọ n’Oziọma, na-enweghị ịgbanwe ya ozugbo ka ọ bụrụ “ndị mmụọ ọjọọ.” Nhazi ahịrịokwu Igbo na-eme mmụọ ndị ahụ ndị na-akpata nsogbu.
- source_word: ἐθεραπεύοντο
  choice: a nọkwa na-agwọ
  rationale: “A nọ na-agwọ” na-echekwa imperfect aspect, ya bụ na ọgwụgwọ ahụ nọ na-aga n’ihu ma ọ bụ na-eme ugboro ugboro n’ebe ahụ.
theological_decisions:
- issue: Nkọwa πνευμάτων ἀκαθάρτων n’ọnọdụ nsogbu sitere n’aka mmụọ
  choice: mmụọ na-adịghị ọcha
  alternative: mmụọ ọjọọ
  rationale: Nhọrọ ahụ na-echekwa okwu Grik banyere adịghị ọcha na nkọwa Akwụkwọ Nsọ, kama ịkọwa ya ozugbo dịka “mmụọ ọjọọ,” ọ bụ ezie na ọnọdụ ahụ na-egosi mmụọ ọjọọ.
- issue: Aspect nke ἐθεραπεύοντο
  choice: a nọkwa na-agwọ
  alternative: a gwọrọ
  rationale: Imperfect na-egosi omume nọ na-aga n’ihu n’oge ahụ; “a nọ na-agwọ” na-echekwa ọdịiche ahụ karịa simple past.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji passive impersonal “a” mee ka ihe odide ahụ bụrụ ihe e ji ọnụ ekwu nke ọma, ma chekwaa nzube na ongoing aspect nke Grik.
