    text: A pụkwara ịsị, “kpọrọ nkụ.” Okwu Grik ahụ nwere ike ịkọwa ihe kpọrọ nkụ ma ọ bụ kpọnwụrụ akpọnwụ; n’ebe a, ọ na-ekwu maka aka nri nwoke ahụ kpọnwụrụ akpọnwụ.
    reason: lexical_alternative
  revision_rationale: The revision replaces the misleading opening idiom with an impersonal event-introduction corresponding to Ἐγένετο δὲ, while preserving the temporal setting, ongoing teaching, and the specified right hand. The footnote now explains the lexical alternative without adding a diagnostic paraphrase.
