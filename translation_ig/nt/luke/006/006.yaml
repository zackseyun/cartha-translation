  text: Ἐγένετο ⸀δὲ ἐν ἑτέρῳ σαββάτῳ εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν· καὶ ἦν ⸂ἄνθρωπος ἐκεῖ⸃ καὶ ἡ χεὶρ αὐτοῦ ἡ δεξιὰ ἦν ξηρά·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: ig
  text: O mere n’ụbọchị izu ike ọzọ na ọ banyere n’ụlọ nzukọ ma na-akụzi ihe. Otu nwoke nọ n’ebe ahụ, aka nri ya kpọnwụrụ akpọnwụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “kpọrọ nkụ.” Okwu Grik ahụ nwere ike ịkọwa ihe kpọrọ nkụ ma ọ bụ kpọnwụrụ akpọnwụ; n’ebe a, ọ na-ekwu maka aka nri nwoke ahụ kpọnwụrụ akpọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: O wee ruo
  rationale: Ọ bụ ụzọ akụkọ Luk si ejikọ ihe na-esote na nke gara aga ma webata ihe mere; okwu a na-ada nke ọma n’Igbo ma ọ naghị etinye okwu pụtara ‘ugbu a’ nke na-adịghị n’isi mmalite Grik.
- source_word: ἐν ἑτέρῳ σαββάτῳ
  choice: n’ụbọchị izu ike ọzọ
  rationale: Nke a na-egosi ụbọchị izu ike ọzọ dị iche n’oge gara aga, ma jiri okwu Igbo ndị mmadụ na-aghọta nke ọma.
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν
  choice: na ọ banyere n’ụlọ nzukọ
  rationale: A gbanwere infinitive Grik ka ọ bụrụ nkebiokwu zuru ezu n’Igbo. E debere nnọchiaha ‘ọ’ n’ihi na aha onye ahụ adịghị n’amaokwu Grik a.
- source_word: καὶ διδάσκειν
  choice: ma na-akụzi ihe
  rationale: Ụdị ‘na-akụzi’ na-egosipụta na ọrụ nkuzi ahụ na-aga n’ihu, dịka present infinitive Grik si egosi.
- source_word: ἄνθρωπος ἐκεῖ
  choice: Otu nwoke nọkwa n’ebe ahụ
  rationale: ‘Nwoke’ na-edobe nwoke nke okwu Grik na-ekwu maka ya; ‘nọkwa’ na-ejikọta nkebiokwu ahụ na akụkọ gara aga n’ụzọ dị nro.
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: aka nri ya
  rationale: Nke a bụ usoro okwu Igbo doro anya ma na-edobe nkwusi ike Grik na ọ bụ aka nri ya kpọmkwem.
- source_word: ξηρά
  choice: kpọnwụrụ akpọnwụ
  rationale: Okwu a na-egosi aka dara arụ ma kpọnwụọ; ọ naghị ekwu kpọmkwem na aka ahụ kpọnwụrụ akpọnwụ n’ihi mkpọnwụ akwara.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ nke dị ugbu a, dị ugwu ma dị mfe nghọta. A hapụrụ onye isiokwu ahụ dịka ‘ọ’ kama ịtinye aha Jizọs, n’ihi na amaokwu Grik a kpọmkwem anaghị akpọ aha ya. E debere akara nkọwa [a] n’akụkụ okwu ξηρά ọ na-akọwa.
