  source_fidelity: The draft accurately represents the temporal setting, Jesus’ going out to the mountain for prayer, and his continuing in prayer for the entire night. “Ọ pụrụ gaa n’ugwu” retains the outward movement of ἐξελθεῖν, and the wording identifies God as the one to whom prayer is directed.
  naturalness: “Ọ nọkwara abalị dum n’ekpere ọ na-ekpegara Chineke” is understandable, but “ọ nọrọ abalị dum na-ekpegara Chineke ekpere” is more natural, direct Standard Igbo narrative phrasing. It also avoids the somewhat heavy embedded relative construction.
  terminology: “Ugwu,” “ikpe ekpere,” and “Chineke” are appropriate Standard Igbo terms. The revised wording preserves the source’s sense without adding “Father” or other theological specification absent from the Greek.
