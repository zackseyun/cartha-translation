  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: ig
  text: N’ụbọchị ndị ahụ, o mere na ọ pụrụ gaa n’ugwu ikpe ekpere, ọ nọrọ abalị dum na-ekpegara Chineke ekpere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ nọgidere na-ekpegara Chineke ekpere n’abalị dum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: o mere na
  rationale: Nke a na-egosipụta ntụgharị Luk ji ebido ihe ọzọ mere n’akụkọ ahụ, n’Igbo dị mfe ma ghara itinye okwu pụtara ‘ugbu a’ nke na-adịghị n’isi mmalite Grik.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: N’ụbọchị ndị ahụ
  rationale: Ọ bụ ụzọ Igbo nkịtị si akọwa oge ahụ a na-ekwu maka ya n’akụkọ.
- source_word: ἐξελθεῖν αὐτὸν
  choice: ọ pụrụ gaa
  rationale: Ọ na-echekwa echiche nke isi n’ebe ọ nọ pụọ, ebe ahịrịokwu na-esote na-egosi ebe ọ gara.
- source_word: εἰς τὸ ὄρος
  choice: n’ugwu
  rationale: ‘Ugwu’ bụ okwu Igbo kpọmkwem maka ὄρος; ntụgharị a anaghị akọwa ugwu ahụ karịa ihe Grik kwuru.
- source_word: προσεύξασθαι
  choice: ikpe ekpere
  rationale: Ọ na-egosi nzube o ji pụọ gaa n’ugwu.
- source_word: ἦν διανυκτερεύων
  choice: ọ nọkwara abalị dum
  rationale: Ọ na-ewepụta omume gara n’ihu nakwa echiche nke ịnọru abalị ahụ niile.
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: n’ekpere ọ na-ekpegara Chineke
  rationale: Ọ bụ Igbo doro anya nke na-egosi na Chineke bụ onye a na-ekpegara ekpere, ọ bụghị na ekpere ahụ bụ nke Chineke na-ekpe.
theological_decisions:
- issue: Mmekọrịta τοῦ θεοῦ na ekpere Jizọs
  choice: n’ekpere ọ na-ekpegara Chineke
  alternative: n’ekpere Chineke
  rationale: Nhọrọ a na-egosi na Jizọs na-ekpegara Chineke ekpere, ma ọ naghị etinye nkọwa ozizi ọzọ dịka ịkpọ aha ‘Nna’ ebe okwu ahụ adịghị na Grik. Ọ na-ezerekwa nghọtahie na Chineke bụ onye na-ekpe ekpere ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro akụkọ Luk n’ụzọ sitere n’okike n’Igbo, ma e chekwaghị okwu njikọ δέ site n’itinye okwu oge na-adịghị na Grik.
