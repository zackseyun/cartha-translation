id: LUK.6.4
reference: Luke 6:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: ig
  text: Otú o si baa n’ụlọ Chineke, were achịcha a na-edebe n’ihu Chineke[a] rie, nyekwa ndị so ya—achịcha nke iwu anaghị ekwe ka a rie, ma e wezụga naanị ndị nchụàjà?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “achịcha e doro nsọ”; n’asụsụ ọdịnala, “achịcha ngosi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: Otú o si
  rationale: Nke a na-ewebata otú ihe Devid mere si mee n’ajụjụ na-ezo aka n’ihe e kwuru na amaokwu bu ụzọ.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: baa n’ụlọ Chineke
  rationale: Ọ na-edobe okwu οἶκος dị ka “ụlọ,” kama ịgbanwe ya ka ọ bụrụ “ụlọ nsọ,” ma na-asụ ya n’Igbo dị mfe.
- source_word: ἄρτους τῆς προθέσεως
  choice: achịcha a na-edebe n’ihu Chineke
  rationale: Ọ na-akọwa achịcha nsọ a na-edowe n’ihu Chineke n’ụzọ onye Igbo nke oge a ga-aghọta, ma na-edobe echiche nke πρόθεσις.
- source_word: λαβὼν ἔφαγεν
  choice: were ... rie
  rationale: Usoro ngwaa Igbo a na-egosi na o bu ụzọ were achịcha ahụ, mesịa rie ya, n’enweghị asụsụ siri ike.
- source_word: ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: nyekwa ndị ya na ha nọ
  rationale: “Nye-kwa” na-egosipụta καί nke mgbakwunye, ebe “ndị ya na ha nọ” na-esochi Greek anya ma bụrụkwa Igbo nkịtị.
- source_word: οὐκ ἔξεστιν φαγεῖν
  choice: iwu na-ekweghị ka onye ọ bụla rie
  rationale: Nke a na-edobe echiche nke ikike iwu na okpukpe, ọ bụghị naanị omenala mmadụ.
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: ma e wezụga naanị ndị nchụàjà
  rationale: 'Ọ na-edobe nkwusi ike abụọ nke εἰ μὴ na μόνους: ọ bụ naanị ndị nchụàjà ka e kwere.'
theological_decisions:
- issue: Mmachi iwu na ofufe metụtara achịcha nsọ ahụ
  choice: iwu na-ekweghị ka onye ọ bụla rie
  alternative: a naghị ekwe ka onye ọ bụla rie
  rationale: Ikwupụta “iwu” na-eme ka o doo anya na okwu ahụ gbasara ikike e nyere n’iwu ofufe Izrel, ọ bụghị nanị ihe ndị mmadụ na-anabataghị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara nkọwa [a] ozugbo n’akụkụ okwu achịcha ọ na-akọwa, kama n’akụkụ “ụlọ Chineke.” A hapụrụ amaokwu ahụ n’ụdị ajụjụ dịka Greek si dị.
