  text: Σίμωνα ὃν καὶ ὠνόμασεν Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ ⸀καὶ Ἰάκωβον καὶ Ἰωάννην ⸁καὶ Φίλιππον καὶ Βαρθολομαῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/014.yaml
  text: Simon, whom he also named Peter, and Andrew his brother, and James and John, and Philip and Bartholomew,
translation:
  language: ig
  text: Saimọn, onye ọ kpọkwara Pita, na Andru nwanne ya nwoke, na Jemis na Jọn, na Filip na Batọlọmi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: Saịmọn
  rationale: Ụdị a na-asụgharị ụda aha Grik Σίμων n'ụzọ dabara n'usoro edemede Igbo ma na-eme ka aha onyeozi a doo anya.
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: onye ọ kpọkwara Pita
  rationale: “Kpọkwara” na-egosipụta ma omume ịkpọ aha ma echiche καί nke pụtara “kwa”; ọ bụkwa okwu Igbo dị n'okike karịa nsụgharị siri ike nke “nyere aha.”
- source_word: Πέτρον
  choice: Pita
  rationale: Pita bụ ụdị aha Πέτρος a maara nke ọma n'Igbo.
- source_word: Ἀνδρέαν
  choice: Andru
  rationale: Andru bụ ụdị aha Ἀνδρέας a na-eji n'Igbo nke na-agbaso ụda aha ahụ.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: nwanne ya nwoke
  rationale: Nke a na-akọwa n'ụzọ doro anya na ἀδελφός bụ nwanne nwoke nkịtị, ma na-ejigide onye okwu “ya” na-ezo aka na ya.
- source_word: Ἰάκωβον
  choice: Jemis
  rationale: Jemis bụ ụdị aha onyeozi a a na-ahụkarị n'usoro aha Agba Ọhụrụ n'Igbo, kama ịgbanwe ya ka ọ bụrụ Jekọb.
- source_word: Ἰωάννην
  choice: Jọn
  rationale: Jọn bụ ụdị aha Ἰωάννης a maara nke ọma n'Igbo.
- source_word: Φίλιππον
  choice: Filip
  rationale: Filip na-asụgharị ụda aha Φίλιππος n'ụzọ dị mfe ma doo anya n'Igbo.
- source_word: Βαρθολομαῖον
  choice: Batọlọmiọs
  rationale: Batọlọmiọs bụ nsụgharị ụda aha Grik Βαρθολομαῖος n'ụdị dabara na mkpụrụokwu na ụda Igbo.
- source_word: καὶ
  choice: na / kwa
  rationale: N'ime ndepụta ahụ, καί bụ “na”; n'ahịrị ὃν καὶ ὠνόμασεν, e tinyere ya n'ọrụ dị ka mgbakwunye “kwa” n'ime “kpọkwara.”
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta nke Grik na njikọ “na” ugboro ugboro, ebe a tụgharịrị aha ndị mmadụ n'ụdị Igbo a na-amata.
