  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: ig
  text: Ma ya onwe ya maara echiche ha[a], ọ sịrị nwoke ahụ aka ya kpọrọ nkụ[b], “Bilie, guzo n’etiti mmadụ.” O biliri, guzo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntụgharị uche ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “aka ya akpọnwụwo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ọ maara
  rationale: Okwu a na-egosi na Jizọs maara ihe dị ha n'obi; nsụgharị a anaghị agbakwụnye otú o si mata ya.
- source_word: διαλογισμοὺς
  choice: echiche
  rationale: “Echiche” bụ okwu Igbo doro anya nke nwere ike ịgụnye echiche ma ọ bụ ntụgharị uche dị n'ime, n'ebughị ụzọ kọwaa ebumnuche ha karịa ihe Grik kwuru.
- source_word: ἀνδρὶ
  choice: nwoke
  rationale: ἀνήρ na-ezo aka kpọmkwem n'ebe nwoke toro eto nọ, ya mere “nwoke” chekwara nkọwa ahụ.
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: aka ya kpọnwụrụ akpọnwụ
  rationale: N'okwu gbasara akụkụ ahụ, ξηρός pụtara ihe kpọnwụrụ ma ọ bụ tara akpụ; nkebi a bụ Igbo a na-aghọta nke ọma maka aka na-adịghịzi ike ma kpọnwụọ.
- source_word: Ἔγειρε
  choice: Bilie
  rationale: “Bilie” na-egosi iwu ka nwoke ahụ si n'ọnọdụ ya pụta, ma na-edobe ya iche n'iwu nke abụọ, στῆθι.
- source_word: στῆθι
  choice: guzoro
  rationale: “Guzoro” chekwara iwu nke abụọ dị iche n'okwu “Bilie.”
- source_word: εἰς τὸ μέσον
  choice: n'etiti mmadụ niile
  rationale: N'ọnọdụ a, “n'etiti mmadụ niile” na-eme ka o doo anya na a gwara ya ka ọ bịa n'etiti ndị gbakọtara, ebe Grik kwuru n'ụzọ nkịtị “banye n'etiti.”
- source_word: ἀναστὰς ἔστη
  choice: O biliri guzoro n'ebe ahụ
  rationale: 'Nsụgharị a chekwara omume abụọ ahụ n''usoro: o biliri, mesịa guzoro.'
theological_decisions:
- issue: Jizọs maara echiche dị n'ime ndị ọzọ
  choice: Kwuo ya ozugbo dịka akụkọ si kwuo na ọ maara echiche ha, n'agbakwụnyeghị nkọwa banyere otú o si mara ya.
  alternative: “Ọ ghọtara ebumnuche ha” ma ọ bụ “site n'ike karịrị mmadụ ọ maara ntụgharị uche ha.”
  rationale: Amaokwu ahụ kwuru na ọ maara echiche ha, ma ọ kọwaghị ụzọ o si mara ya. Ya mere, nsụgharị ahụ na-echekwa nkwupụta na esemokwu nkà mmụta okpukpe dị na ya n'enweghị nkọwa agbakwunyere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere iwu abụọ ahụ—“Bilie” na “guzoro”—iche, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi agbakwunyere.
