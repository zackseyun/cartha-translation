review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical causal question (τί), the contrastive continuation (δέ), seeing the small obstruction in the brother’s eye, and failing to notice the large timber in one’s own eye. However, “n’anya nke gị” does not express the emphatic possessive force of ἰδίῳ as naturally or fully as “n’anya gị onwe gị.”
  naturalness: The sentence is clear Standard Igbo and preserves the vivid hyperbole. “N’anya gị onwe gị” is more idiomatic than “n’anya nke gị” in this construction and gives the intended emphatic contrast.
  terminology: “Nwanne gị” is the natural Igbo rendering of ἀδελφοῦ, though Igbo does not mark the Greek masculine singular in this word; the explanatory footnote handles this appropriately. “Nnukwu ogwe osisi” suitably renders δοκός. “Ntakịrị irighiri ihe” is acceptably broad for κάρφος and the lexical alternatives footnote preserves the likely straw/wood-chip nuance.
  issues:
  - severity: low
    issue: The emphatic possessive ἰδίῳ is underrepresented by “n’anya nke gị.”
    rationale: The Greek explicitly contrasts the other person’s eye with one’s own eye. In Standard Igbo, “n’anya gị onwe gị” expresses this emphasis more naturally and directly.
  revised_text: Ma gịnị mere i ji ahụ ntakịrị irighiri ihe[a] dị n’anya nwanne gị[b], ma ị naghị achọpụta nnukwu ogwe osisi[c] dị n’anya gị onwe gị?
