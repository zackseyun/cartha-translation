id: LUK.6.41
reference: Luke 6:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ig
  text: Ma gịnị mere i ji ahụ ntakịrị irighiri ihe[a] dị n’anya nwanne gị[b], ma ị naghị achọpụta nnukwu ogwe osisi[c] dị n’anya gị onwe gị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “obere iberibe osisi” ma ọ bụ “iberibe ahịhịa.” Okwu Grik κάρφος pụtara obere ihe kpọrọ nkụ, nke e ji tụnyere nnukwu ogwe osisi.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “nwanne” dị n’ụdị nwoke otu onye; ma n’Igbo, “nwanne” n’onwe ya nwere ike ịpụta nwoke ma ọ bụ nwanyị, ihe nkuzi a metụtakwara onye ibe n’ozuzu ya.
    reason: cultural_note
  - marker: c
    text: N’ebe a, ọ bụ nnukwu osisi e ji akwado ụlọ; a pụkwara ịkpọ ya “osisi ụlọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: gịnị mere
  rationale: N’ajụjụ ịba mba a, τί na-enye echiche nke “gịnị mere,” ọ bụghị naanị “gịnị”; nke a na-egosipụta ike ajụjụ ahụ n’Igbo nkịtị.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-ejikọta okwu a na ihe bu ya ụzọ ma na-egosikwa obere ntụgharị megidere ya.
- source_word: βλέπεις
  choice: i ji ahụ
  rationale: “Ịhụ” na-edobe ihe atụ nke anya nke dị n’okwu Grik.
- source_word: κάρφος
  choice: ntakịrị irighiri ihe
  rationale: Ọ na-egosi obere iberibe ihe kpọrọ nkụ ma ọ bụ ahịhịa; “ntakịrị irighiri ihe” doro ndị na-agụ Igbo anya ma na-emegide nnukwu ogwe osisi.
- source_word: ἀδελφοῦ
  choice: nwanne gị
  rationale: “Nwanne” bụ okwu Igbo sitere n’okike nke na-ekpuchi nwanne nwoke ma ọ bụ nwanyị, ebe ụdị okwu Grik bụ nke nwoke otu onye; ihe odide na-ekwu maka onye nọ n’ezinụlọ okwukwe ma ọ bụ onye ibe.
- source_word: δοκόν
  choice: nnukwu ogwe osisi
  rationale: δοκός bụ nnukwu osisi a na-eji akwado ụlọ; okwu a na-edobe ikwubiga okwu ókè nke Jizọs na ọdịiche ya na obere irighiri ihe.
- source_word: ἰδίῳ
  choice: nke gị
  rationale: Nkebi a na-emesi ikike nke onye ahụ ike, ya bụ, anya nke ya onwe ya, n’ụzọ kwekọrọ na ἰδίῳ.
- source_word: κατανοεῖς
  choice: ị naghị achọpụta
  rationale: “Ịchọpụta” na-egosi ilebara ihe anya ruo n’ịghọta na ọ dị, ma na-emepụta ọdịiche dabara adaba na “ịhụ.”
theological_decisions:
- issue: Okwu mmekọrịta ἀδελφοῦ nke dị n’ụdị nwoke
  choice: nwanne gị
  alternative: nwanne nwoke gị
  rationale: Standard Igbo “nwanne” anaghị egosi nwoke ma ọ bụ nwanyị n’onwe ya. Iji “nwanne nwoke” ga-etinye nkọwa gbasara okike nke asụsụ Igbo chọrọ ka e kwuo kpọmkwem, ebe ebumnuche ihe atụ ahụ gbasara onye ibe n’ozuzu ya. Ihe e dere n’ala ala na-echekwa eziokwu na Grik ji ụdị nwoke otu onye.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ajụjụ ịba mba, ihe atụ anya, ikwubiga okwu ókè, na ọdịiche dị n’etiti obere irighiri ihe na nnukwu ogwe osisi.
