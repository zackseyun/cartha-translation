language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: ig
  text: Ọ bụrụkwa na unu agbazinye ndị unu na-atụ anya na unu ga-anata n’aka ha, gịnị ka a ga-eji too unu?[a] Ndị mmehie na-agbazinyekwa ndị mmehie, ka ha nataghachi ihe hà nhata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gịnị bụ ekele dịrị unu?” Okwu Grik ahụ nwekwara ike ịpụta “ekele,” ma n’ebe a o yikarịrị ka ọ na-ekwu banyere otuto ma ọ bụ nkwanye ùgwù mmadụ kwesịrị inweta.
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: gbazinye / na-agbazinye
  rationale: Okwu a na-egosi inye mmadụ ego ma ọ bụ ihe ka o jiri ya nwa oge ma mesịa weghachi ya; “gbazinye” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: παρ’ ὧν
  choice: ndị ... n’aka ha
  rationale: N’usoro okwu a, παρά tinyere genitive na-arụtụ aka ná ndị a na-atụ anya ịnara ihe n’aka ha; nhazi Igbo a na-eme ka mmekọrịta ahụ doo anya n’enweghị ịgbakwunye nkọwa banyere ọmụrụ nwa.
- source_word: ἐλπίζετε λαβεῖν
  choice: unu na-atụ anya ịnara ihe
  rationale: “Na-atụ anya” na-egosi ihe mmadụ chere na ọ ga-enweta, ebe “ịnara ihe” na-edobe obosara nke λαβεῖν kama ịkọwa ya ozugbo dị ka ịkwụghachi ụgwọ.
- source_word: ποία ... χάρις ἐστίν
  choice: olee ihe e kwesịrị iji too unu?
  rationale: N’ajụjụ a, χάρις na-arụtụ aka n’ihe ga-eme ka e too mmadụ ma ọ bụ kwanyere omume ya ùgwù, ọ bụghị amara nzọpụta. Nhazi a bụ Igbo sitere n’ọnụ mmadụ ma na-edobe ike ajụjụ ahụ.
- source_word: ἁμαρτωλοὶ
  choice: ndị mmehie
  rationale: Nke a na-edobe ụdị aha e ji adjective Grik ahụ mee ma na-egosipụta otu ndị Jizọs kpọrọ aha n’amaokwu ahụ.
- source_word: ἵνα ἀπολάβωσιν
  choice: ka ha wee nataghachi
  rationale: “Nata-ghachi” na-egosipụta echiche nke inwetaghachi ihe e nyere, nke bụ isi ihe ἀπολαμβάνω pụtara n’ebe a.
- source_word: τὰ ἴσα
  choice: ihe ha nyere n’otu ọnụ ọgụgụ ahụ
  rationale: Nhazi a na-egosi nkwụghachi hà nhata n’ọnụ ọgụgụ ma ọ bụ oke, na-enweghị itinye echiche ọmụrụ nwa ma ọ bụ uru a na-enweta.
theological_decisions:
- issue: Ihe χάρις pụtara n’ajụjụ Jizọs
  choice: A sụgharịrị ya dị ka ihe e kwesịrị iji too mmadụ, ya bụ otuto ma ọ bụ nkwanye ùgwù omume ahụ kwesịrị iweta.
  alternative: “amara,” “ekele,” ma ọ bụ “uru”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ajụ ihe mere omume ndị na-eso ụzọ ji dị iche n’omume ndị mmehie. Ya mere, okwu ahụ ebe a abụghị aha nkà mmụta okpukpe maka amara nzọpụta; ma “ekele” ka bụ nghọta okwu ahụ nwekwara ike inwe.
- issue: Ụdị ihe a na-atụ anya inwetaghachi n’ịgbazinye ihe
  choice: E gosipụtara ya dị ka ịnataghachi ihe hà nhata n’ọnụ ọgụgụ ma ọ bụ oke.
  alternative: Ịnata ọmụrụ nwa, uru, ma ọ bụ ihe karịrị nke e nyere
  rationale: τὰ ἴσα na-egosi ihe hà nhata. Amaokwu ahụ ekwughị na e nwere ọmụrụ nwa ma ọ bụ uru ọzọ, ya mere a naghị etinye echiche ndị ahụ na nsụgharị ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta, dee amaokwu ahụ. A họọrọ “gbazinye” maka okwu gbasara inye ihe ka e mesịa weghachi ya, ma zere okwu pụrụ iche nke ụlọ akụ. Ajụjụ “olee ihe e kwesịrị iji too unu?” bụ nhazi sitere n’ọnụ mmadụ nke na-eburu echiche χάρις n’ọnọdụ a, ebe nkọwa ala peeji na-edobe nghọta ọzọ bụ “ekele.”
