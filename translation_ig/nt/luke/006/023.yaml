id: LUK.6.23
reference: Luke 6:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: ig
  text: Ṅụrịanụ ọṅụ n'ụbọchị ahụ, maliekwanụ elu n'ọṅụ[a], n'ihi na lee, ụgwọ ọrụ unu dị ukwuu n'eluigwe; n'ihi na otu a ka nna nna ha na-emebu ndị amụma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “wụlienụ elu.”
    reason: lexical_alternative
  - marker: b
    text: 'N''ụzọ okwu si dị kpọmkwem: “n''ihi na otu a ka nna nna ha na-emebu ndị amụma”; ihe ọ pụtara bụ na ndị nna nna ha mesoro ndị amụma n''otu ụzọ ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρητε
  choice: Ṅụrịanụ ọṅụ
  rationale: Ngwaa a bụ iwu e nyere ọtụtụ mmadụ ka ha ṅụrịa ọṅụ; nsụgharị a doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: σκιρτήσατε
  choice: maliekwanụ elu n'ọṅụ
  rationale: Ọ na-egosi mmegharị ahụ siri ike nke ọṅụ na-akpali, ọ bụghị naanị inwe obi ụtọ n'ime obi.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” na-adọta uche gaa n'ihe kpatara iwu ahụ, dị ka okwu Grik si eme.
- source_word: μισθὸς
  choice: ụgwọ ọrụ
  rationale: N'ebe a ọ pụtara ihe nkwụghachi a ga-enye mmadụ; “ụgwọ ọrụ” bụ okwu Igbo doro anya nke na-ahapụkwa ọdịdị okwu Grik ahụ.
- source_word: πολὺς
  choice: dị ukwuu
  rationale: Nke a na-egosi ịdị ukwuu nke ụgwọ ọrụ ahụ n'ụzọ dị mfe ma kwekọọ n'okwu Grik.
- source_word: ἐν τῷ οὐρανῷ
  choice: n'eluigwe
  rationale: Ọ na-edobe ebe ma ọ bụ ógbè e kwuru na ụgwọ ọrụ ahụ dị, n'etinyeghị nkọwa okpukpe ọzọ.
- source_word: κατὰ τὰ αὐτά
  choice: ọ bụ otu ihe ahụ
  rationale: Akpaalaokwu a na-egosi na omume ahụ yiri nke e kwuru banyere ya n'amaokwu ndị gbara ya gburugburu.
- source_word: ἐποίουν
  choice: na-emere
  rationale: Ụdị ngwaa gara aga na-egosi omume ha na-eme ugboro ugboro ma ọ bụ nke ha na-emebu; “na-emere” na-edobe nke ahụ n'Igbo.
- source_word: τοῖς προφήταις
  choice: ndị amụma
  rationale: E ji “emere ndị amụma” chekwaa usoro okwu ahụ n'ebughị ụzọ kọwaa kpọmkwem ụdị mmeso ọjọọ ahụ, nke gburugburu okwu na-egosi.
- source_word: οἱ πατέρες αὐτῶν
  choice: nna nna ha
  rationale: N'ebe a “nna nna” na-egosi ndị nna ochie ha, ọ bụghị naanị ndị mụrụ ha ozugbo, ma na-echekwa ihe atụ ezinụlọ dị n'okwu ahụ.
theological_decisions:
- issue: Ụdị na ebe ụgwọ ọrụ ahụ dị
  choice: ụgwọ ọrụ unu dị ukwuu n'eluigwe
  alternative: ụgwọ ọrụ unu dị ukwuu n'ebe Chineke nọ n'eluigwe
  rationale: Isiokwu Grik kwuru naanị “n'eluigwe”; nsụgharị ahụ etinyeghị nkọwa ọzọ banyere otú ma ọ bụ mgbe a ga-enye ụgwọ ọrụ ahụ.
- issue: Ndị okwu “nna nna ha” na-ezo aka na ha
  choice: nna nna ha
  alternative: ndị nna ochie ha
  rationale: Nke a na-echekwa okwu ezinụlọ nke Grik ma na-egosikwa ọgbọ ndị bu ha ụzọ, bụ́ ndị mesoro ndị amụma otu ahụ.
- issue: Ụdị omume e mere ndị amụma
  choice: na-emere ndị amụma
  alternative: na-emeso ndị amụma otu ahụ
  rationale: Nhọrọ a na-echekwa mkpakọ okwu Grik ma hapụ gburugburu okwu ka ọ gosi na ihe ahụ bụ mmeso ọjọọ, kama ịgbakwunye ya n'ahịrịokwu ahụ n'onwe ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ụda iwu nye ọtụtụ mmadụ, ike ọṅụ nke ngwaa abụọ ahụ, na ntakịrị mkpakọ dị n'ahịrị ikpeazụ n'ebughị nkọwa okpukpe pụrụ iche.
