- from: Ṅụrịanụ ọṅụ n'ụbọchị ahụ, maliekwanụ elu n'ọṅụ[a], n'ihi na lee, ụgwọ ọrụ unu dị ukwuu n'eluigwe; n'ihi na ọ bụ otu ihe ahụ ka nna nna ha na-emere ndị amụma[b].
  to: Ṅụrịanụ ọṅụ n'ụbọchị ahụ, maliekwanụ elu n'ọṅụ[a], n'ihi na lee, ụgwọ ọrụ unu dị ukwuu n'eluigwe; n'ihi na otu a ka nna nna ha na-emebu ndị amụma[b].
  rationale: The final comparison is revised to an idiomatic Igbo past-habitual construction, accurately reflecting ἐποίουν while retaining the Greek clause’s deliberate lack of a stated object for the hostile treatment. The associated footnote is updated accordingly, and the alternate imperative in footnote a is regularized.
