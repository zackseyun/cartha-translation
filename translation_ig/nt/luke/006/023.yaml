review_pass:
  verdict: revise
  source_fidelity: The two imperatives, the attention marker, the greatness and heavenly setting of the reward, and the comparison with treatment of the prophets are conveyed faithfully. The final verb, however, is rendered as a present progressive ('na-emere'), whereas ἐποίουν is imperfect and describes customary action in the past.
  naturalness: The register is clear Standard Igbo and suitable for the passage. “Otu a ka ... na-emebu” is more idiomatic and directly communicates the past habitual comparison than “ọ bụ otu ihe ahụ ka ... na-emere.”
  terminology: “Ṅụrịanụ ọṅụ,” “maliekwanụ elu n'ọṅụ,” “ụgwọ ọrụ,” “n'eluigwe,” “ndị amụma,” and “nna nna ha” are suitable. The alternate wording in footnote a is regularized to the standard plural imperative form “wụlienụ elu.”
  issues:
  - severity: medium
    issue: The final clause uses a present-progressive form, “nna nna ha na-emere ndị amụma,” for the Greek imperfect ἐποίουν.
    rationale: In this context the imperfect denotes what their forefathers customarily did in the past. “Na-emebu” preserves this habitual past sense without specifying the nature of the treatment.
  - severity: low
    issue: Footnote a has the less regular imperative form “nwụliakwanụ elu.”
    rationale: “Wụlienụ elu” is a clear Standard Igbo plural imperative and provides the intended lexical alternative.
  revised_text: Ṅụrịanụ ọṅụ n'ụbọchị ahụ, maliekwanụ elu n'ọṅụ[a], n'ihi na lee, ụgwọ ọrụ unu dị ukwuu n'eluigwe; n'ihi na otu a ka nna nna ha na-emebu ndị amụma[b].
