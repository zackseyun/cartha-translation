  source_fidelity: 'Isi ederede ahụ na-anọchi anya Grik nke ọma: “Mgbe chi bọrọ” maka ὅτε ἐγένετο ἡμέρα, ịkpọ ndị na-eso ụzọ, ịhọpụta mmadụ iri na abụọ n’ime ha, na inye ha aha “ndịozi.” “Ka ha bịakwute ya” bụ nkọwa ọnọdụ a pụrụ ịnabata, ebe ihe gbara amaokwu ahụ gburugburu na-egosi ịkpọkọta ha maka nhọrọ ahụ.'
