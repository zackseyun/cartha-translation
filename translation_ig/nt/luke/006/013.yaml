  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: ig
  text: Mgbe chi bọrọ, ọ kpọrọ ndị na-eso ụzọ ya ka ha bịakwute ya,[a] wee họpụta mmadụ iri na abụọ n’ime ha, ndị ọ kpọrọ ndịozi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ kpọrọ ndị na-eso ụzọ ya.” Ngwaa Grik ahụ nwere ike ịpụta ịkpọ mmadụ ka ọ bịakwute onye na-akpọ ya ma ọ bụ ịgwa ya okwu; n’ebe a, ihe gbara ya gburugburu na-akwado na ọ kpọkọtara ha maka ịhọpụta ụfọdụ n’ime ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị ọ kpọkwara ndịozi.” Ngwaa ahụ pụtara inye aha ma ọ bụ ịkpọ mmadụ ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: Mgbe chi bọrọ
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu na ehihie abịala ma ọ bụ na chi abọọla, ma na-echekwa ọrụ nkebiokwu oge dị na Grik.
- source_word: προσεφώνησεν
  choice: ọ kpọrọ ... ka ha bịakwute ya
  rationale: N’ebe a, ngwaa ahụ na-egosi na Jizọs kpọkọtara ndị na-eso ụzọ ya n’ebe ọ nọ maka ịhọpụta ụfọdụ n’ime ha; ntụgharị a doro anya n’Igbo ma ghara ịghọta ya dịka nanị ịkpọ aha.
- source_word: μαθητὰς
  choice: ndị na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a na-anabata nke ọma maka ndị na-amụta ihe n’aka onye nkuzi ma na-eso ya.
- source_word: ἐκλεξάμενος
  choice: wee họpụta
  rationale: “Họpụta” na-egosi ịhọrọ ụfọdụ n’ime ìgwè buru ibu maka ọrụ pụrụ iche.
- source_word: ἀπ’ αὐτῶν
  choice: n’ime ha
  rationale: Nke a na-eme ka o doo anya na mmadụ iri na abụọ ahụ sitere n’ìgwè ndị na-eso ụzọ ya.
- source_word: δώδεκα
  choice: mmadụ iri na abụọ
  rationale: Ịtinye “mmadụ” bụ usoro Igbo ebumpụta ụwa mgbe a na-agụ mmadụ, ma ọ dịghị agbakwunye echiche ọzọ na ederede.
- source_word: ἀποστόλους
  choice: nd ndịozi
  rationale: “Ndịozi” bụ aha Igbo a maara nke ọma maka ndị e zigara ozi, ma n’ebe a ọ na-arụ ọrụ dịka aha Jizọs nyere mmadụ iri na abụọ ahụ.
- source_word: ὠνόμασεν
  choice: ọ kpọkwara
  rationale: N’Igbo, “ịkpọ mmadụ” nwere ike ịpụta inye ya aha ma ọ bụ utu aha; n’ahịrịokwu a, ihe na-eso ya na-eme ka nzube nke ịkpọ aha pụta ìhè.
theological_decisions:
- issue: Ma a ga-asụgharị ἀποστόλους dịka nkọwa nkịtị “ndị e zigara” ka ọ bụ dịka aha e ji mara ọrụ ahụ
  choice: nd ndịozi
  alternative: ndị e zigara ozi
  rationale: N’ebe a, okwu ahụ bụ aha Jizọs nyere mmadụ iri na abụọ ahụ, ọ bụghị naanị nkọwa na e zigara ha otu ozi. “Ndịozi” na-echekwa ọrụ ya dịka aha n’akụkọ Luk na-enweghị itinye ozizi ụka ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Mgbe chi bọrọ” na “ndị na-eso ụzọ” bụ okwu nkịtị; “nd ndịozi” na-echekwa aha ọrụ pụrụ iche dị n’ederede Grik.
