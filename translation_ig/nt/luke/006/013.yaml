  to: Mgbe chi bọrọ, ọ kpọrọ ndị na-eso ụzọ ya ka ha bịakwute ya,[a] wee họpụta mmadụ iri na abụọ n’ime ha, ndị ọ kpọrọ ndịozi.[b]
