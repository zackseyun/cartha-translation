id: LUK.6.21
reference: Luke 6:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: ig
  text: Ngọzi na-adịrị unu, ndị agụụ na-agụ ugbu a[a], n’ihi na a ga-eju unu afọ[b]. Ngọzi na-adịrị unu, ndị na-akwa ákwá ugbu a, n’ihi na unu ga-achị ọchị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ngọzi na-adịrị ndị agụụ na-agụ ugbu a ... Ngọzi na-adịrị ndị na-akwa ákwá ugbu a.” N’asụsụ Grik, e ji edemede na ngwaa-nkọwa kwuo ya, ma ihe gbara amaokwu ahụ gburugburu na ngwaa ndị dị n’onye nke abụọ na-akwado na ọ bụ okwu a na-agwa ndị na-ege ntị ozugbo.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “unu ga-enwe afọ ojuju.” Ngwaa Grik ahụ pụrụ ịpụta iriju afọ n’ihe oriri, ma o nwekwara ike ịpụta inwe afọ ojuju zuru ezu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Ngọzi na-adịrị unu
  rationale: Nke a na-edobe usoro okwu ngọzi Jizọs ji ekwu okwu ma na-ezere ime ka ọ bụrụ naanị mmetụta obi ụtọ ma ọ bụ ihe ọma dakwasịrị mmadụ na mberede.
- source_word: οἱ πεινῶντες
  choice: unu ndị agụụ na-agụ
  rationale: Ọ bụ ezie na Grik ji isiokwu na participle kwuo ‘ndị agụụ na-agụ,’ ngwaa ndị na-esochi ya dị n’onye nke abụọ ọtụtụ, ọnọdụ okwu ahụ kwa bụ okwu a na-agwa ndị na-eso ụzọ ozugbo. Ya mere, ‘unu ndị’ na-egosipụta okwu a na-agwa ha kpọmkwem.
- source_word: νῦν
  choice: ugbu a
  rationale: Ọ na-edobe ọdịiche dị n’etiti ọnọdụ ha nọ na ya ugbu a na mgbanwe a na-ekwe ha ná nkwa n’ọdịnihu.
- source_word: χορτασθήσεσθε
  choice: a ga-eju unu afọ
  rationale: Okwu a na-ejikarị ezo aka n’ịriju afọ ma ọ bụ n’inwe afọ ojuju. Nsụgharị a na-edobe ihe atụ nri ahụ n’ụzọ doro anya, ma ọ naghị amachibido nkwa ahụ ka ọ bụrụ naanị nri nkịtị.
- source_word: οἱ κλαίοντες
  choice: unu ndị na-akwa ákwá
  rationale: Nke a na-egosipụta ịkwa ákwá n’ezie ma ghara ime ka ihe ọ pụtara bụrụ naanị iru újú n’ihi ọnwụ mmadụ; ‘unu ndị’ kwekọrọ n’okwu a na-agwa ndị na-ege ntị ozugbo.
- source_word: γελάσετε
  choice: unu ga-achị ọchị
  rationale: Nke a na-edobe ihe oyiyi pụtara ìhè nke mgbanwe site n’ịkwa ákwá ruo n’ịchị ọchị, kama iji okwu sara mbara dịka ‘unu ga-aṅụrị ọṅụ.’
theological_decisions:
- issue: Ịgwa ndị na-ege ntị okwu ozugbo ma ọ bụ ikwu banyere ha dịka otu ìgwè n’ozuzu
  choice: E ji ‘unu ndị agụụ na-agụ’ na ‘unu ndị na-akwa ákwá’ gwa ha okwu ozugbo.
  alternative: A pụrụ ịsụgharị ya ‘Ngọzi na-adịrị ndị agụụ na-agụ ... ndị na-akwa ákwá.’
  rationale: N’agbanyeghị na isiokwu na participle ndị Grik nwere ike ịbụ okwu banyere otu ìgwè n’ozuzu, ngwaa nkwa abụọ ahụ dị n’onye nke abụọ ọtụtụ, ọnọdụ Luk 6 kwa na-egosi na Jizọs na-agwa ndị na-eso ụzọ ya okwu.
- issue: Ụdị na oge mgbanwe ahụ e kwere ná nkwa
  choice: E debere nkwa ndị ahụ dịka ‘a ga-eju unu afọ’ na ‘unu ga-achị ọchị.’
  alternative: A pụrụ ịkọwa ha kpọmkwem dịka afọ ojuju ime mmụọ, mgbanwe ndụ n’oge a, ma ọ bụ mmezu n’ọgwụgwụ oge.
  rationale: Amaokwu ahụ n’onwe ya akọwaghị ma nkwa ndị a bụ naanị nke anụ ahụ, nke ime mmụọ, nke ugbu a, ma ọ bụ nke ọgwụgwụ oge. Nsụgharị ahụ na-ahapụ nghọta ahụ oghe dịka ihe odide Grik si mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ngọzi na-adịrị unu’ na-edobe ụda okwu ngọzi; ‘agụụ na-agụ,’ ‘na-akwa ákwá,’ na ‘ga-achị ọchị’ bụ okwu nkịtị ma pụta ìhè. E debere nkwa ndị ahụ n’ụdị doro anya n’enweghị ịgbakwụnye nkọwa ụka ma ọ bụ idozi ma mmezu ha ọ bụ nke anụ ahụ, nke ime mmụọ, ma ọ bụ nke ọgwụgwụ oge.
