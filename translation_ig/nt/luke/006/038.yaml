revisions:
- from: 'Nyenụ, a ga-enyekwa unu: ọ̀tụ̀tụ̀ ọma—nke a pịkọbara ọnụ, nke a kwagharịrị ka ihe dị na ya dajụọ, nke na-ejubiga ókè[a]—ka ha ga-awụnye n’apata unu[b]. N’ihi na ọ̀tụ̀tụ̀ unu ji atụ ihe ka a ga-eji tụghachi nye unu.'
  to: 'Nyenụ, a ga-enyekwa unu: ọ̀tụ̀tụ̀ ọma—nke a pịkọbara ọnụ, nke a kwagharịrị ka ihe dị na ya dajụọ, nke na-awụfu n’ọnụ[a]—ka ha ga-awụnye n’apata unu[b]. N’ihi na ọ̀tụ̀tụ̀ ọ bụla unu ji atụ ihe, ọ bụkwa ya ka a ga-eji tụghachi nye unu.'
  rationale: The revision corrects the future clause governed by δώσουσιν, clarifies the relative-and-reciprocal structure of the final saying, and restores the concrete overflowing image. It retains the broad exhortation to give and does not make the saying a promise about money or material wealth.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T03:35:56Z'
review_pass:
  verdict: revise
  source_fidelity: The draft generally preserves the imperative, the future/passive reciprocity, the indefinite third-person plural in δώσουσιν, and the market-measure imagery. However, “ka ha ga-awụnye” has an unnecessary and ungrammatical/awkward linker before the future clause. The final reciprocal-measure clause also needs an explicit resumptive construction so that the measure used is clearly the measure returned, as required by ᾧ ... μέτρῳ ... ἀντιμετρηθήσεται.
  naturalness: The register is suitably clear Standard Igbo. “N’apata unu” is a workable modern rendering of κόλπος, especially with a cultural note. The revised wording makes the final sentence more idiomatic and removes the awkward future construction.
  terminology: “Ọ̀tụ̀tụ̀ ọma,” “Nyenụ,” and “tụghachi” appropriately retain the broad, non-financial sense and reciprocal force. “Nke na-awụfu n’ọnụ” makes the active image of ὑπερεκχυννόμενον explicit; the alternative wording is retained in the note.
  issues:
  - severity: medium
    issue: Unnecessary “ka” before “ha ga-awụnye.”
    rationale: δώσουσιν is an independent future verb, “they will give.” In this sentence, “ka ha ga-awụnye” is not natural Standard Igbo. “Ha ga-awụnye” retains the indefinite plural without introducing a purposive or subordinate nuance.
  - severity: medium
    issue: The final clause does not explicitly identify the measure used as the one returned.
    rationale: “ọ̀tụ̀tụ̀ unu ji atụ ihe ka a ga-eji tụghachi nye unu” is compressed and syntactically unclear. The Greek relative construction means that the very measure with which one measures is the measure that will be measured back. A resumptive “ọ bụkwa ya” makes this relation clear without adding interpretation.
  - severity: low
    issue: “Nke na-ejubiga ókè” weakens the spilling-over image.
    rationale: ὑπερεκχυννόμενον depicts contents pouring or running over, not merely exceeding a limit. “Nke na-awụfu n’ọnụ” directly preserves the image.
  revised_text: 'Nyenụ, a ga-enyekwa unu: ọ̀tụ̀tụ̀ ọma—nke a pịkọbara ọnụ, nke a kwagharịrị ka ihe dị na ya dajụọ, nke na-awụfu n’ọnụ[a]—ka ha ga-awụnye n’apata unu[b]. N’ihi na ọ̀tụ̀tụ̀ ọ bụla unu ji atụ ihe, ọ bụkwa ya ka a ga-eji tụghachi nye unu.'
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “nke na-ejubiga ókè.” Ihe atụ a bụ nke ihe e ji atụ juru nke ukwuu nke na ihe dị n’ime ya na-awụfu n’ọnụ.
    reason: lexical_alternative
  - marker: b
    text: “Apata” ebe a na-ekwu maka mpịachi uwe dị n’ihu ahụ mmadụ, nke a pụrụ iji nata ngwongwo a tụrụ.
    reason: cultural_note
  revision_rationale: The revision corrects the future clause governed by δώσουσιν, clarifies the relative-and-reciprocal structure of the final saying, and restores the concrete overflowing image. It retains the broad exhortation to give and does not make the saying a promise about money or material wealth.
