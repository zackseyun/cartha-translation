id: LUK.6.38
reference: Luke 6:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: ig
  text: 'Nyenụ, a ga-enyekwa unu: ọ̀tụ̀tụ̀ ọma—nke a pịkọbara ọnụ, nke a kwagharịrị ka ihe dị na ya dajụọ, nke na-awụfu n’ọnụ[a]—ka ha ga-awụnye n’apata unu[b]. N’ihi na ọ̀tụ̀tụ̀ ọ bụla unu ji atụ ihe, ọ bụkwa ya ka a ga-eji tụghachi nye unu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nke na-ejubiga ókè.” Ihe atụ a bụ nke ihe e ji atụ juru nke ukwuu nke na ihe dị n’ime ya na-awụfu n’ọnụ.
    reason: lexical_alternative
  - marker: b
    text: “Apata” ebe a na-ekwu maka mpịachi uwe dị n’ihu ahụ mmadụ, nke a pụrụ iji nata ngwongwo a tụrụ.
    reason: cultural_note
lexical_decisions:
- source_word: δίδοτε
  choice: Nyenụ
  rationale: Ọ bụ iwu dị n’ụdị present active imperative plural. “Nyenụ” bụ Igbo kwụ ọtọ ma dị mma, ọ naghịkwa amanye echiche nke “na-enyekwanụ mgbe niile” karịa ihe aspect Grik kwuru.
- source_word: δοθήσεται ὑμῖν
  choice: a ga-enyekwa unu
  rationale: A haziri ya n’ụdị passive na-enweghị ịkpọ onye na-eme ihe aha, dịka Grik si dị; “-kwa” na-egosipụta nzaghachi dị n’etiti inye na ịnata.
- source_word: μέτρον καλὸν
  choice: ọ̀tụ̀tụ̀ ọma
  rationale: “Ọ̀tụ̀tụ̀” na-edobe ihe atụ nke ịtụ ngwongwo ma ọ bụ oke a tụrụ; “ọma” adịghị etinye nkọwa nke mmesapụ aka nke okwu Grik n’onwe ya ekwughị kpọmkwem.
- source_word: πεπιεσμένον
  choice: nke a pịkọbara ọnụ
  rationale: Nke a na-egosi na a pịara ihe dị n’ihe e ji atụ ka ọ daba nke ọma ma buru ọtụtụ ihe.
- source_word: σεσαλευμένον
  choice: nke a kwagharịrị ka ihe dị na ya dajụọ
  rationale: Ọ na-akọwa ịkwagharị ihe e ji atụ ka mkpụrụ ma ọ bụ ngwongwo dị n’ime ya dajụọ ma jupụta oghere ndị fọdụrụ.
- source_word: ὑπερεκχυννόμενον
  choice: nke na-ejubiga ókè
  rationale: Nke a na-edobe onyinyo nke ihe juru nke ukwuu ruo n’ókè nke ịwụfu, n’asụsụ Igbo doro anya.
- source_word: δώσουσιν
  choice: ka ha ga-awụnye
  rationale: “Ha” na-edobe third-person plural nke Grik ma hapụ ndị na-eme ihe ahụ n’amaghị aha; “awụnye” dabara n’onyinyo nke ngwongwo a tụrụ nke a na-etinye n’apata uwe.
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: n’apata unu
  rationale: “Apata” bụ ụzọ Igbo dị mfe isi kọwaa ebe mmadụ na-anata ihe n’ihu ahụ ya; ihe odide ala peeji kọwara na ọ bụ apata ma ọ bụ mpịachi uwe mwụda e ji anata ngwongwo.
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: N’ihi na ọ̀tụ̀tụ̀ unu ji atụ ihe
  rationale: Nke a na-edobe ma njikọ ihe kpatara ya ma ihe atụ nke iji otu ọ̀tụ̀tụ̀ atụ ihe.
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: ka a ga-eji tụghachi nye unu
  rationale: “Tụghachi” na-egosipụta reciprocity nke ἀντί, ebe ahịrịokwu na-enweghị onye a kpọrọ aha na-edobe passive nke Grik.
theological_decisions:
- issue: Ma a ga-akọwa okwu a dịka ihe gbasara ego na inye ndị ogbenye naanị, ka ọ bụ hapụ ya ka ọ gbasaa karịa nke ahụ
  choice: E debere iwu “Nyenụ” na ụkpụrụ nke ọ̀tụ̀tụ̀ a ga-eji tụghachi, n’agbanyeghị ụdị ihe a na-enye.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka ọ bụrụ naanị inye ego ma ọ bụ ihe e ji enyere ndị ogbenye aka.
  rationale: Ihe gbara amaokwu ahụ gburugburu gụnyere ebere, ịghara ikpe mmadụ ikpe, mgbaghara, na inye ihe. Grik ekwughị kpọmkwem na ọ bụ ego; ya mere nsụgharị ahụ anaghị akpọchi ihe ọ pụtara n’ozizi ọganihu akụ̀ na ụba ma ọ bụ n’inye ego naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ debere ihe atụ ahịa nke ịtụ ngwongwo, onye “ha” na-anọchi anya ya ka bụ onye a na-akpọghị aha, ma e zere ịtụgharị iwu ahụ ka ọ bụrụ nkwa akụ̀ na ụba kpọmkwem.
