source:
  edition: SBLGNT
  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: ig
  text: '“Ma ana m asị unu ndị na-ege ntị: Hụnụ ndị iro unu n’anya; meerenụ ndị kpọrọ unu asị ihe ọma.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: Ma
  rationale: Na-egosi mgbanwe siri ike site n’ihe bu ụzọ, ma bụrụkwa okwu Igbo dị mkpirikpi ma kwekọọ n’ọnọdụ a.
- source_word: ὑμῖν λέγω
  choice: ana m asị unu
  rationale: Na-echekwa okwu onye mbụ na-agwa ọtụtụ mmadụ okwu ozugbo; ọdịdị ‘ana m’ na-egosikwa omume ikwu ahụ n’oge ahụ.
- source_word: τοῖς ἀκούουσιν
  choice: ndị na-ege ntị
  rationale: Na-egosipụta participle nke ugbu a dịka ige ntị na-aga n’ihu, ọ bụghị naanị ịnụ ụda.
- source_word: ἀγαπᾶτε
  choice: Hụnụ ... n’anya
  rationale: Ọ bụ ụzọ Igbo nkịtị ma dị ugwu isi nye ọtụtụ mmadụ iwu ka ha hụ n’anya.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: ndị iro unu
  rationale: Nsụgharị doro anya nke aha ọtụtụ na nnọchiaha nwe ọtụtụ mmadụ.
- source_word: καλῶς ποιεῖτε
  choice: meenụ ... ihe ọma
  rationale: Na-eburu echiche ime ezi ihe n’ụzọ Igbo dị mfe ma doo anya.
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: ndị kpọrọ unu asị
  rationale: Na-echekwa ike nkịtị nke μισέω n’emeghị ka okwu ahụ dị nro.
theological_decisions:
- issue: Iwu gbasara otu e si emeso ndị iro
  choice: E depụtara iwu abụọ ahụ dịka iwu metụtara ndị na-ege ntị niile, n’enweghị mmachi a gbakwunyere.
  alternative: Ịkọwa ya dịka naanị ndị iro onwe onye, ma ọ bụ dịka ikwubiga okwu ókè.
  rationale: Grik nwere iwu onye nke abụọ ọtụtụ ugboro abụọ, ọ dịghịkwa mmachi doro anya n’amaokwu ahụ; nsụgharị ahụ kwesịrị ịhapụ ike na esemokwu nke iwu ahụ dịka ọ dị.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E ji ụdị iwu ọtụtụ mmadụ ‘Hụnụ’ na ‘meenụ’ mee ka adreesị ὑμῖν/ὑμῶν/ὑμᾶς doo anya. Enweghị akara nkọwa ala peeji n’ihi na nkọwa Bekee nyere maka [a] adabaghị n’ebe akara ahụ dị na ederede Bekee; a sụgharịrị τοῖς ἀκούουσιν ozugbo dịka ‘ndị na-ege ntị.’
