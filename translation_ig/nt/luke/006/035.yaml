id: LUK.6.35
reference: Luke 6:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: ig
  text: Ma hụnụ ndị iro unu n’anya[a], meenụ ihe ọma, gbazinyenụkwa ihe na-atụghị anya inweta ihe ọ bụla n’azụ; ụgwọ ọrụ unu ga-adị ukwuu, unu ga-abụkwa ụmụ nwoke nke Onye Kasị Elu[b], n’ihi na ọ na-enwe obiọma n’ebe ndị na-enweghị ekele na ndị ajọ omume nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma eleghị anya, n’agbanyeghị na o yikarịghị: “na-enweghị onye unu na-atụ anya ya ihe ọma,” ma ọ bụ, “na-enweghị ịda mbà n’olileanya.” Akpaokwu Grik μηδὲν ἀπελπίζοντες siri ike nghọta; n’ebe a, a ghọtara ya dị ka ịghara ịtụ anya nkwụghachi ma ọ bụ ihe a ga-enyeghachi.'
    reason: lexical_alternative
  - marker: b
    text: “Ụmụ nwoke” sụgharịrị okwu Grik nke dị n’ụdị nwoke ọtụtụ; n’ebe a, ọ pụkwara ịnọchite anya ndị niile so n’ìgwè ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ma unu onwe unu
  rationale: “Ma” na-egosi nnukwu ntụgharị megide omume nke ime naanị ihe a ga-akwụghachi; “unu onwe unu” na-eme ka ọdịiche ahụ pụta n’ụzọ Igbo si ada nke ọma.
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: hụnụ ndị iro unu n’anya
  rationale: Nke a bụ iwu kpọmkwem, ma ọ na-edobe ike na ihe ịtụnanya dị n’iwu ịhụ ndị iro n’anya.
- source_word: ἀγαθοποιεῖτε
  choice: na-emekwa ihe ọma
  rationale: Ọ bụ okwu Igbo doro anya nke na-egosi ime ihe ga-abara ndị ọzọ uru, ọ bụghị naanị inwe ezi echiche.
- source_word: δανίζετε
  choice: na-agbazinyekwa ihe
  rationale: “Ịgbazinye ihe” na-edobe echiche izinye n’agbakwụnyeghị na ọ bụ naanị ego ka a na-ekwu maka ya.
- source_word: μηδὲν ἀπελπίζοντες
  choice: n’atụghị anya inweta ihe ọ bụla n’azụ
  rationale: N’ọnọdụ a nke ịgbazinye ihe na nke mmeghachi omume, nke a na-egosi ịghara ịtụ anya nkwụghachi; a na-edobe nkọwa ọzọ n’ala ala peeji.
- source_word: μισθὸς ὑμῶν πολύς
  choice: ụgwọ ọrụ unu ga-adịkwa ukwuu
  rationale: “Ụgwọ ọrụ” na-egosi ihe a ga-akwụghachi mmadụ n’ihi omume ya, “ukwuu” na-edobekwa ịdị ukwuu nke πολύς.
- source_word: υἱοὶ Ὑψίστου
  choice: ụmụ ndị ikom nke Onye Kasị Elu
  rationale: Nke a na-edobe ụdị nwoke ọtụtụ nke υἱοί ma jiri aha nsọpụrụ Chineke “Onye Kasị Elu.”
- source_word: χρηστός
  choice: na-emere ... ebere
  rationale: N’ebe a χρηστός na-egosi obiọma Chineke n’ebe ndị na-erughị eru nọ; “na-emere ... ebere” na-ada nke ọma n’Igbo ma na-egosi omume ọma ahụ.
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: ndị na-enweghị ekele na ndị ajọ omume
  rationale: Nke a na-ekewa ìgwè abụọ ahụ n'ụzọ doro anya ma na-edobe echiche nke enweghị ekele na ajọ omume.
theological_decisions:
- issue: Otu a ga-esi tụgharịa υἱοὶ Ὑψίστου
  choice: ụmụ ndị ikom nke Onye Kasị Elu
  alternative: ụmụ nke Onye Kasị Elu
  rationale: Isiokwu Grik ahụ bụ ụdị nwoke ọtụtụ, ya mere isi ederede na-edobe ya; ndetu na-akọwa na okwu ahụ nwere ike ịnọchite anya ndị niile so n’ìgwè ahụ.
- issue: Nkọwa μηδὲν ἀπελπίζοντες n’iwu ịgbazinye ihe
  choice: n’atụghị anya inweta ihe ọ bụla n’azụ
  alternative: enweghị onye unu kwụsịrị inwe olileanya n’ebe ọ nọ; ma ọ bụ, ghara ịda mbà n’olileanya
  rationale: Ọnọdụ gbara ya gburugburu bụ nke ịgbazinye ihe na ịghara ịtụ anya mmeghachi, ma okwu Grik ahụ siri ike, ya mere a naghị ezobe nkọwa ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro iwu atọ ahụ, ọdịiche nke “Ma,” na esemokwu dị n’akpaokwu μηδὲν ἀπελπίζοντες; e tinyeghị “ego” n’ihi na Grik ekwughị ụdị ihe a na-agbazinye.
