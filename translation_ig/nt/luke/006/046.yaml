id: LUK.6.46
reference: Luke 6:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: ig
  text: Gịnị mere unu ji akpọ m, ‘Onyenwe anyị[a], Onyenwe anyị,’ ma unu anaghị eme ihe m na-ekwu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Nna ukwu, Nna ukwu.” N’asụsụ Grik: “Kyrios, kyrios.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: Gịnị mere
  rationale: N’agbanyeghị na τί pụtara ‘gịnị’ n’ụzọ nkịtị, n’usoro ajụjụ a ọ na-ajụ ihe kpatara omume ahụ; ‘Gịnị mere’ bụ ụzọ Igbo si ekwu ‘n’ihi gịnị’ n’ụzọ dị ndụ ma na-echekwa ike ịba mba dị n’ajụjụ ahụ.
- source_word: δέ
  choice: —
  rationale: δέ bụ njikọ dị nro. A hapụrụ ya n’enweghị okwu pụrụ iche n’Igbo n’ihi na usoro ajụjụ ahụ na njikọ ya na ihe ndị bu ya ụzọ egosila ọrụ ya nke ọma.
- source_word: με
  choice: m
  rationale: Ọ bụ nnara nke καλεῖτε, ya mere a sụgharịrị ya kpọmkwem dịka ‘m.’
- source_word: καλεῖτε
  choice: unu ji akpọ
  rationale: Ngwaa ahụ bụ onye nke abụọ, ụbara, n’oge ugbu a. ‘Unu ji akpọ’ na-egosi omume ha na-eme mgbe niile ma dabara n’ụzọ Igbo si wuo ajụjụ kpatara ihe.
- source_word: Κύριε κύριε
  choice: Onyenwe anyị, Onyenwe anyị
  rationale: A họọrọ aha nsọpụrụ ‘Onyenwe anyị’ maka κύριος, ma debe nkwughachi ya iji chekwaa nkwusi ike na ọdịiche dị n’etiti ihe ọnụ ha na-ekwupụta na enweghị nrubeisi ha.
- source_word: καὶ οὐ
  choice: ma ... anaghị
  rationale: N’ebe a καὶ οὐ na-egosi ọdịiche dị n’etiti ịkpọ Jizọs Onyenwe na ịghara ime ihe ọ na-ekwu. ‘Ma ... anaghị’ bụ ụzọ Igbo doro anya ma dị ndụ isi gosipụta ọdịiche ahụ.
- source_word: ποιεῖτε
  choice: eme
  rationale: ποιέω n’ebe a pụtara imezu ma ọ bụ irube isi n’ihe Jizọs kwuru. ‘Eme’ dị mfe, kpọmkwem, ma kwekọọ n’okwu Igbo ‘ime ihe mmadụ kwuru.’
- source_word: ἃ
  choice: ihe
  rationale: Nnọchiaha ikwu a bụ ụbara na Grik ma na-arụtụ aka n’ihe niile Jizọs na-ekwu. ‘Ihe’ na-egosipụta ya n’Igbo n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: λέγω
  choice: m na-ekwu
  rationale: A sụgharịrị λέγω n’ụzọ kpọmkwem dịka ‘m na-ekwu,’ nke na-echekwa oge ugbu a ma ghara ịgbakwunye echiche nke na-adịghị n’ederede.
theological_decisions:
- issue: Nsụgharị κύριος dịka aha e ji akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma nsọpụrụ ma ibu echiche Kraịst dị n’aha κύριος mgbe a na-agwa Jizọs okwu. ‘Nna ukwu’ nwekwara ike ịpụta onyeisi ma ọ bụ onye nkuzi, ma ọ naghị ebu otu ibu echiche ahụ n’ụzọ zuru oke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ihe. A hapụrụ nkwughachi aha ahụ dịka ọ dị na Grik, ma jiri ‘unu’ chekwaa onye nke abụọ ụbara.
