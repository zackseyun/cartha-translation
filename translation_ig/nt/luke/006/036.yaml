  verdict: revise
  source_fidelity: The draft accurately represents the present plural imperative γίνεσθε as an ongoing exhortation and preserves the comparative force of καθώς. “Obi ebere” is an appropriate Standard Igbo rendering of οἰκτίρμονες, and its repetition appropriately reflects the repeated Greek adjective. “Nna unu” does not add “heavenly.”
