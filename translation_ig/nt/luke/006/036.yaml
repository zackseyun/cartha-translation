  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: ig
  text: Na-enwenụ obi ebere[a], dị nnọọ ka Nna unu si enwe obi ebere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Na-enwenụ ọmịiko.” Okwu Grik ahụ nwere ike ịkọwa onye ihe nhụjuanya nke ndị ọzọ na-emetụta n’obi, nke na-eme ka o gosi ha ebere.
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: Na-enwenụ
  rationale: Ngwaa a bụ iwu dị n'ụdị present nye ọtụtụ mmadụ, ma na-akpọ ha ka ha nọgide na-egosipụta àgwà a. “Na-enwenụ” bụ Igbo nkịtị ma na-egosi omume na-aga n'ihu nke ọma.
- source_word: οἰκτίρμονες
  choice: obi ebere
  rationale: Okwu a na-akọwa ndị obi ebere na-emetụ n'ahụ ma na-egosi ebere. Akpaokwu “inwe obi ebere” bụ ụzọ Igbo doro anya na nke eke si kwuo ya.
- source_word: καθὼς
  choice: dị nnọọ ka ... si
  rationale: 'Nke a na-egosi ntụnyere doro anya: àgwà Nna bụ ihe nlereanya ndị na-eso ụzọ ga-agbaso, ọ bụghị nanị ihe kpatara iwu ahụ.'
- source_word: πατὴρ ὑμῶν
  choice: Nna unu
  rationale: Nke a na-edobe okwu Grik kpọmkwem n'etinyeghị “nke eluigwe,” nke na-adịghị n'amaokwu a.
- source_word: οἰκτίρμων
  choice: enwe obi ebere
  rationale: E jiri otu akpaokwu ahụ mee ihe ọzọ iji chekwaa njikọ okwu dị n'etiti iwu e nyere ndị na-ege ntị na àgwà Nna.
theological_decisions:
- issue: Mmekọrịta dị n'etiti iwu ahụ na àgwà Nna
  choice: 'A kọwara ebere Nna dịka ụkpụrụ ndị na-eso ụzọ ga-eṅomi: “dị nnọọ ka Nna unu si enwe obi ebere.”'
  alternative: 'Ịsụgharị ya dịka ihe kpatara iwu ahụ: “n''ihi na Nna unu nwere obi ebere.”'
  rationale: καθὼς bụ okwu ntụnyere ebe a, ya mere nsụgharị ahụ na-echekwa echiche nke iṅomi àgwà Nna n'etinyeghị nkọwa nkà mmụta okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Na-enwenụ” na-agwa ọtụtụ mmadụ okwu ma na-egosi oku na-aga n'ihu; “Nna unu” na-edobe nkenke na mmekọrịta dị n'okwu mbụ.
