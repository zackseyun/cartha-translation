id: LUK.6.15
reference: Luke 6:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: ig
  text: na Matiu na Tọmọs, na Jemis nwa Alfiọs, na Saịmọn onye a na-akpọ Zelọt[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-anụ ọkụ n’obi.” Aha Grik a nwere ike ịbụ aha e ji mara ya; naanị aha ahụ anaghị egosi na ọ ga-abụrịrị onye so n’òtù ndọrọ ndọrọ ọchịchị e mechara mara dị ka ndị Zelọt.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: na
  rationale: Njikọ nkịtị e ji ag nối aha ndị nọ n’usoro; ikwughachi ya na-echekwa ụdị ndepụta dị n’asụsụ Grik.
- source_word: Μαθθαῖον
  choice: Matiu
  rationale: Ụdị a na-ejikarị ede aha Μαθθαῖος n’Igbo.
- source_word: Θωμᾶν
  choice: Tọmọs
  rationale: Nsụgharị mkpụrụokwu nke aha Grik Θωμᾶς n’ụdị dabara n’Igbo.
- source_word: Ἰάκωβον Ἁλφαίου
  choice: Jemis nwa Alfiọs
  rationale: N’usoro ịkpọ aha a, Ἁλφαίου bụ genitive nke kacha egosi mmekọrịta nna na nwa; ‘nwa Alfiọs’ na-eme ka nke ahụ doo anya n’Igbo ma kewapụ Jemis a n’aka ndị ọzọ nwere otu aha ahụ.
- source_word: Σίμωνα
  choice: Saịmọn
  rationale: Ụdị aha Σίμων a na-amata nke ọma ma dabara n’usoro mkpụrụokwu Igbo.
- source_word: τὸν καλούμενον
  choice: onye a na-akpọ
  rationale: Na-egosipụta participle passive e ji akọwa onye ahụ n’ụzọ doro anya ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: Ζηλωτὴν
  choice: Zelọt
  rationale: E debere ya dị ka aha e ji amata Saịmọn, na-enweghị ikpebi ma ọ pụtara naanị onye na-anụ ọkụ n’obi ka ọ bụ onye so n’òtù pụrụ iche. Ihe odide ala peeji kọwara ụzọ ọzọ e nwere ike isi ghọta ya.
theological_decisions:
- issue: Ma Ζηλωτής bụ aha òtù ndọrọ ndọrọ ọchịchị ka ọ bụ aha nkọwa nke onye na-anụ ọkụ n’obi
  choice: Zelọt
  alternative: onye na-anụ ọkụ n’obi
  rationale: Ide ya ‘Zelọt’ na-echekwa aha e ji amata Saịmọn, ma ghara ikwu karịa ihe Grik kwuru banyere ma ọ bụ onye otu òtù ndọrọ ndọrọ ọchịchị kpọmkwem. Ihe odide ala peeji na-edebe nkọwa ọzọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. E chekwara usoro ndepụta nke Grik site n’ikwughachi ‘na.’ E tinyere akara ihe odide ala peeji ozugbo n’aha ‘Zelọt,’ ebe nkọwa ahụ metụtara.
