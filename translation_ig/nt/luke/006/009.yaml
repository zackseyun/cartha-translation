source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: ig
  text: 'Ma Jizọs sịrị ha, “Ana m ajụ unu: Ọ̀ bụ ihe iwu kwadoro n’Ụbọchị Izuike ime ihe ọma ka ọ bụ ime ihe ọjọọ[a], ịzọpụta ndụ ka ọ bụ ibibi ya[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ime ihe na-emerụ ahụ.” Okwu Grik ahụ na-egosi ọdịiche dị n’etiti ime ihe ọma na ime ihe ọjọọ, ma n’ọnọdụ a ọ pụkwara ịpụta ime ihe na-akpata mmerụ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ịzọpụta mkpụrụ obi ka ọ bụ ibibi ya.” N’ebe a, “ndụ” ka ahọrọ n’ihi na ọnọdụ ahụ metụtara ichekwa ma ọ bụ ibibi ndụ mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’akụkọ ahụ, ebe Jizọs zara ọnọdụ ahụ na nlekọ ndị na-emegide ya.
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: Ana m ajụ unu
  rationale: Nke a bụ okwu Igbo dị ndụ nke na-edobe ike ajụjụ Jizọs ji maa ha aka.
- source_word: εἰ ἔξεστιν
  choice: Ọ̀ bụ ihe iwu kwadoro
  rationale: N’arụmụka banyere Ụbọchị Izuike, okwu a na-ajụ ihe iwu kwere ka e mee, ọ bụghị naanị ihe mmadụ nwere ike ime.
- source_word: τῷ σαββάτῳ
  choice: n’Ụbọchị Izuike
  rationale: Nke a bụ aha Igbo doro anya maka ụbọchị izu ike ahụ, ma ọ na-arụkwa ọrụ dịka dative nke oge si dị na Grik.
- source_word: ἀγαθοποιῆσαι
  choice: ime ihe ọma
  rationale: Ọ na-edobe ọdịiche doro anya dị n’etiti ime ezi ihe na ime ihe ọjọọ ma ọ bụ na-emerụ ahụ.
- source_word: κακοποιῆσαι
  choice: ime ihe na-emerụ ahụ
  rationale: Nhọrọ a dabara n’ọnọdụ ọgwụgwọ ahụ na ụzọ okwu na-esochi ya banyere ịzọpụta ma ọ bụ ibibi ndụ, ma nkọwa ala peeji na-edobe ntụgharị sara mbara bụ “ime ihe ọjọọ.”
- source_word: ψυχὴν
  choice: ndụ mmadụ
  rationale: N’ebe a, ψυχή na-ezo aka ná ndụ mmadụ n’ụzọ pụtara ihe, ọ bụghị naanị n’akụkụ mmadụ a na-akpọ mkpụrụ obi.
- source_word: σῶσαι
  choice: ịzọpụta
  rationale: Ọ na-edobe echiche nke ichekwa ma ọ bụ napụta ndụ, tinyere njikọ okwu a nwere n’ebe ndị ọzọ n’Akwụkwọ Nsọ.
- source_word: ἀπολέσαι
  choice: ibibi ya
  rationale: Ọ na-edobe ọdịiche siri ike na “ịzọpụta” ma ghara ime ka ihe okwu Grik pụtara dị warara ruo naanị “igbu.”
theological_decisions:
- issue: Ihe ψυχή pụtara n’okwu ψυχὴν σῶσαι ἢ ἀπολέσαι
  choice: ndụ mmadụ ... ibibi ya
  alternative: mkpụrụ obi mmadụ ... ibibi ya
  rationale: Ọnọdụ a metụtara ịgwọ mmadụ n’Ụbọchị Izuike na ichekwa ma ọ bụ imebi ndụ mmadụ. Nhọrọ a anaghị ebubata nkọwa ozizi banyere ọdịdị mkpụrụ obi nke amaokwu ahụ ekwughị kpọmkwem, ebe nkọwa ala peeji na-edobe ntụgharị ọzọ kwere omume.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “Ụbọchị Izuike” maka Sabbath, “ihe iwu kwadoro” iji gosipụta ajụjụ gbasara ihe iwu kwere, na ahịrịokwu abụọ na-emegiderịta onwe ha iji chekwaa usoro na ike ajụjụ Grik.
