  to: 'Ma Jizọs sịrị ha, “Ana m ajụ unu: Ọ̀ bụ ihe iwu kwadoro n’Ụbọchị Izuike ime ihe ọma ka ọ bụ ime ihe ọjọọ[a], ịzọpụta ndụ ka ọ bụ ibibi ya[b]?”'
  rationale: The revision strengthens the natural Igbo ethical contrast corresponding to ἀγαθοποιῆσαι ἢ κακοποιῆσαι and removes the unnecessary addition ‘mmadụ’ from the main text. The footnotes retain the relevant lexical alternatives without imposing a doctrinal sense on ψυχή.
