id: LUK.6.48
reference: Luke 6:48
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: ig
  text: Ọ dị ka otu onye[a] na-ewu ụlọ, onye gwuru ala miri emi, tọrọ ntọala n’elu nkume. Mgbe idei mmiri bịara, osimiri ahụ ji ike kụrụ ụlọ ahụ, ma o nweghị ike ime ka ọ maa jijiji, n’ihi na e wuru ya nke ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu nwoke.” Okwu Grik ahụ dị n’ụdị nwoke na otu, ma n’ihe atụ a ọ pụrụ izo aka n’otu onye n’ozuzu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιός ἐστιν
  choice: Ọ dị ka
  rationale: Nke a bụ ụzọ Igbo si ekwu ntụnyere n'ụzọ doro anya ma dịkwa eke.
- source_word: ἀνθρώπῳ
  choice: otu nwoke
  rationale: E debere nwoke otu onye nke dị n’asụsụ Grik dịka onye e ji mee ihe atụ, kama ime ka ọ bụrụ okwu na-enweghị njirimara nwoke ma ọ bụ nwanyị.
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: na-ewu ụlọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ọrụ iwu ụlọ, ma na-egosikwa omume ahụ na-aga n’ihu.
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: gwuru ala nke ukwuu, gwurukwaa ya ruo omimi
  rationale: Asụsụ Grik nwere ngwaa abụọ na-emesi igwu ala ruo omimi ike; nsụgharị a na-edebe nkwusikwu ahụ kama ịhapụ otu n’ime ha.
- source_word: ἔθηκεν θεμέλιον
  choice: tọọ ntọala ya
  rationale: ‘Ịtọ ntọala’ bụ njikọ okwu Igbo doro anya maka itinye ntọala ụlọ.
- source_word: ἐπὶ τὴν πέτραν
  choice: n’elu nkume
  rationale: ‘Nkume’ na-edebe ihe oyiyi πέτρα n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: πλημμύρης δὲ γενομένης
  choice: Mgbe idei mmiri bịara
  rationale: Nke a na-egosipụta ọnọdụ oge nke genitive absolute ahụ n’Igbo eke.
- source_word: προσέρηξεν ὁ ποταμὸς
  choice: osimiri ahụ ji ike dakwasị
  rationale: ‘Ji ike dakwasị’ na-egosipụta oke ike nke ngwaa προσρήγνυμι karịa nanị ‘kụrụ,’ ebe ‘osimiri’ bụ ntụgharị kwesịrị ekwesị nke ποταμός.
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν
  choice: o nweghị ike ime ka ọ maa jijiji
  rationale: Nke a na-edebe echiche enweghị ike na ịma jijiji ma ọ bụ ịmagharị ụlọ ahụ.
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: n’ihi na e wuru ya nke ọma
  rationale: Nke a na-edebe ihe kpatara ya na olu nnara nke infinitive Grik ahụ, n’Igbo dị mfe nghọta.
theological_decisions:
- issue: Otu a ga-esi sụgharịa ἀνθρώπῳ, nke bụ nwoke otu onye e ji mee ihe atụ
  choice: otu nwoke
  alternative: otu onye
  rationale: Ihe atụ ahụ na-eji nwoke otu onye. E debere njirimara nwoke nke ederede ahụ, ebe nkọwa ala peeji na-egosi na a pụkwara ịghọta okwu Grik ahụ dịka ‘otu onye.’
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ihe oyiyi nke igwu ala miri emi, ntọala, nkume, idei mmiri, na ike osimiri n’enweghị itinye nkọwa ụka ma ọ bụ nkwenkwe pụrụ iche.
