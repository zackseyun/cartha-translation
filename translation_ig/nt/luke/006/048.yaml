revisions:
- from: Ọ dị ka otu nwoke na-ewu ụlọ[a], onye gwuru ala nke ukwuu, gwurukwaa ya ruo omimi, tọọ ntọala ya n’elu nkume. Mgbe idei mmiri bịara, osimiri ahụ ji ike dakwasị ụlọ ahụ, ma o nweghị ike ime ka ọ maa jijiji, n’ihi na e wuru ya nke ọma.
  to: Ọ dị ka otu onye[a] na-ewu ụlọ, onye gwuru ala miri emi, tọrọ ntọala n’elu nkume. Mgbe idei mmiri bịara, osimiri ahụ ji ike kụrụ ụlọ ahụ, ma o nweghị ike ime ka ọ maa jijiji, n’ihi na e wuru ya nke ọma.
  rationale: The revision follows the Greek more closely by rendering ἀνθρώπῳ generically as “otu onye,” retaining the masculine-form issue in a properly anchored note. It improves the idiomatic rendering of the deep digging and the river’s impact, and removes an unnecessary possessive, without changing the verse’s imagery or theological force.
