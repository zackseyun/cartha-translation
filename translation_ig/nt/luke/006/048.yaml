review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the construction comparison, deep excavation, foundation on rock, flood, violent impact, inability to shake the house, and causal passive conclusion. However, ἀνθρώπῳ ordinarily denotes a human being/person and is grammatically masculine; it does not by itself require a specifically male referent. Rendering it as “otu onye” is more source-faithful, while a footnote can retain “otu nwoke” as an alternative. The revised wording also avoids adding the possessive “ya” to “ntọala,” which is not expressed in the Greek.
  naturalness: The original double rendering of the excavation (“gwuru ala nke ukwuu, gwurukwaa ya ruo omimi”) is repetitive and “nke ukwuu” can suggest quantity rather than depth. “Gwuru ala miri emi” is concise and natural. “Osimiri ahụ ji ike kụrụ ụlọ ahụ” is clearer Standard Igbo for the river’s violent striking of the house than “ji ike dakwasị.”
  terminology: “Tọrọ ntọala n’elu nkume,” “idei mmiri,” and “maa jijiji” are clear, modern, and appropriately dignified. The lexical-alternative footnote is moved from “ụlọ” to the term it concerns, “onye.”
  issues:
  - severity: medium
    issue: The rendering “otu nwoke” presents ἀνθρώπῳ as necessarily male.
    rationale: Although grammatically masculine singular, ἄνθρωπος commonly refers generically to a person/human being. The source does not require that the exemplary builder be male.
  - severity: medium
    issue: Footnote anchor [a] is attached to “ụlọ” rather than to the rendering of ἀνθρώπῳ.
    rationale: The note discusses the Greek word for the person in the comparison, so its anchor must follow “onye.”
  - severity: low
    issue: The excavation phrase is awkwardly repetitive, and “nke ukwuu” does not specifically convey depth.
    rationale: The paired Greek verbs stress digging deeply; “gwuru ala miri emi” conveys this naturally without an unnecessary repetition.
  - severity: low
    issue: “Ntọala ya” adds an unexpressed possessive.
    rationale: The Greek says simply that he laid a foundation; the possessive is inferable but not needed in Igbo.
  revised_text: Ọ dị ka otu onye[a] na-ewu ụlọ, onye gwuru ala miri emi, tọrọ ntọala n’elu nkume. Mgbe idei mmiri bịara, osimiri ahụ ji ike kụrụ ụlọ ahụ, ma o nweghị ike ime ka ọ maa jijiji, n’ihi na e wuru ya nke ọma.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “otu nwoke.” Okwu Grik ahụ dị n’ụdị nwoke na otu, ma n’ihe atụ a ọ pụrụ izo aka n’otu onye n’ozuzu.
    reason: lexical_alternative
  revision_rationale: The revision follows the Greek more closely by rendering ἀνθρώπῳ generically as “otu onye,” retaining the masculine-form issue in a properly anchored note. It improves the idiomatic rendering of the deep digging and the river’s impact, and removes an unnecessary possessive, without changing the verse’s imagery or theological force.
