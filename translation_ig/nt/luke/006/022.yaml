revisions:
- from: Ngọzi na-adịrị unu mgbe ndị mmadụ kpọrọ unu asị, mgbe ha kewapụrụ unu n’ebe ha nọ, kọchaa unu, ma jụ aha unu dịka ihe ọjọọ n’ihi Nwa nke Mmadụ.[a]
  to: Ngọzi na-adịrị unu mgbe ndị mmadụ kpọọ unu asị, na mgbe ha kewapụ unu, kparịa unu, ma jụ aha unu dịka ihe ọjọọ[a] n’ihi Nwa nke Mmadụ.
  rationale: The revision corrects the nuance of the verb for insult, aligns the persecution verbs as contingent actions under “mgbe,” and places the footnote marker directly at the disputed idiom. It retains the source’s ambiguity about the precise social mechanism of casting out the disciples’ name and does not add doctrinal interpretation.
