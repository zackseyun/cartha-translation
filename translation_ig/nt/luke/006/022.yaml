review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the beatitude, the generic reference to people, social exclusion, repudiation of the disciples' name as evil, and the causal phrase tied to the Son of Man. A modest revision makes the repeated indefinite future/contingent actions more natural and parallel in Igbo.
  naturalness: “Kọchaa” more commonly suggests scolding or rebuking; “kparịa” is the clearer contemporary Standard Igbo equivalent for verbal insult/reproach here. Using subjunctive-like forms after “mgbe” gives the persecution actions an appropriately contingent sense.
  terminology: “Ngọzi na-adịrị unu” suitably carries the beatitude register, and “Nwa nke Mmadụ” properly retains the established Gospel title. “Jụ aha unu dịka ihe ọjọọ” is retained as a natural rendering that preserves the concrete ‘name’ while allowing the idiom’s social-repudiation sense.
  issues:
  - severity: low
    issue: The verb “kọchaa” is less precise for ὀνειδίσωσιν.
    rationale: It can mean to scold or rebuke, whereas the Greek denotes insulting, reproaching, or reviling. “Kparịa” directly expresses the intended verbal abuse.
  - severity: low
    issue: The forms “kpọrọ” and “kewapụrụ” read more readily as completed past actions.
    rationale: After “mgbe,” “kpọọ” and “kewapụ” better sustain the contingent, future-oriented sequence represented by ὅταν with subjunctives.
  - severity: low
    issue: The footnote marker is placed at the sentence end rather than beside the idiom it explains.
    rationale: Moving [a] immediately after “ihe ọjọọ” gives the lexical-alternative note a clear anchor.
  revised_text: Ngọzi na-adịrị unu mgbe ndị mmadụ kpọọ unu asị, na mgbe ha kewapụ unu, kparịa unu, ma jụ aha unu dịka ihe ọjọọ[a] n’ihi Nwa nke Mmadụ.
  revised_footnotes:
