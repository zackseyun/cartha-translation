id: LUK.6.22
reference: Luke 6:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: ig
  text: Ngọzi na-adịrị unu mgbe ndị mmadụ kpọọ unu asị, na mgbe ha kewapụ unu, kparịa unu, ma jụ aha unu dịka ihe ọjọọ[a] n’ihi Nwa nke Mmadụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “tụpụ aha unu dịka ihe ọjọọ”; ya bụ, kwupụta n’ihu ọha na aha unu dị njọ, ma ọ bụ jụ unu kpamkpam.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοί
  choice: Ngọzi na-adịrị unu
  rationale: Nke a na-edobe ụda nke okwu ngọzi ahụ na ịdị arọ ya n’ihe gbasara Chineke; ‘unu nwere obi ụtọ’ ga-eme ka ọ yie naanị mmetụta mmadụ.
- source_word: ὅταν
  choice: mgbe
  rationale: Ya na ngwaa ndị dị na subjunctive, ọ na-egosi ọnọdụ nwere ike ime n’ọdịnihu; ‘mgbe’ bụ Igbo dị mfe ma kwekọọ n’usoro okwu ngọzi.
- source_word: μισήσωσιν ὑμᾶς οἱ ἄνθρωποι
  choice: ndị mmadụ kpọrọ unu asị
  rationale: ‘Ndị mmadụ’ na-egosi mmadụ niile n’ozuzu, ọ bụghị naanị ndị nwoke; ‘kpọrọ ... asị’ na-ebute ike nke μισέω n’ụzọ doro anya.
- source_word: ἀφορίσωσιν ὑμᾶς
  choice: ha kewapụrụ unu n’ebe ha nọ
  rationale: N’ọnọdụ mkpagbu a, okwu ahụ na-ezo aka n’ịchụpụ mmadụ n’etiti ọha ma ọ bụ ịjụ iso ya na-emekọrịta; ntụgharị a bụ nke kwụ ọtọ ma doo anya.
- source_word: ὀνειδίσωσιν
  choice: kọchaa unu
  rationale: Ọ na-egosi ikwu okwu mkparị ma ọ bụ ịta mmadụ ụta n’ihu ọha; ‘kọchaa’ bụ okwu Igbo a na-aghọta nke ọma.
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν
  choice: jụ aha unu dịka ihe ọjọọ
  rationale: Nkebiokwu Grik a bụ akpaalaokwu na-egosi ịjụ mmadụ n’ihu ọha ma were aha ma ọ bụ aha ọma ya dịka ihe ọjọọ. ‘Jụ aha unu’ dị eke n’Igbo karịa ntụgharị nkịtị ‘tụpụ aha unu,’ ma ọ ka na-edobe ‘aha’ na njirimara omume ahụ.
- source_word: ἕνεκα
  choice: n’ihi
  rationale: Ọ na-egosi ihe kpatara omume ahụ; ‘n’ihi’ bụ ntụgharị Igbo dị nkenke ma bụrụ ihe a na-ejikarị eme ihe.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Aha a na-edobe ụdị okwu Grik na ojiji ya dịka aha Jizọs ji akpọ onwe ya, tinyere njikọ ya na akwụkwọ nsọ ndị ọzọ.
theological_decisions:
- issue: Ịtụgharị akpaalaokwu ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν
  choice: Jiri ‘jụ aha unu dịka ihe ọjọọ’ n’ahịrịokwu bụ isi.
  alternative: ‘tụpụ aha unu dịka ihe ọjọọ’ ma ọ bụ ‘kwutọọ unu dịka ndị ọjọọ’
  rationale: ‘Jụ aha unu’ na-eme ka uche nke ịnapụ mmadụ nnabata n’ihu ọha doo anya n’Igbo, ma ọ naghị ehichapụ ihe oyiyi ‘aha’ dị na Grik. Ihe odide ala peeji na-egosi ohere nghọta nke aha ọma ma ọ bụ ikwutọ mmadụ n’ihu ọha.
- issue: Ịtụgharị οἱ ἄνθρωποι dịka okwu metụtara mmadụ niile
  choice: Jiri ‘ndị mmadụ,’ ọ bụghị okwu na-ezo naanị n’ebe ndị nwoke nọ.
  alternative: ‘ụmụ nwoke’
  rationale: N’ebe a, οἱ ἄνθρωποι na-ezo aka n’ebe mmadụ nọ n’ozuzu, ọ bụghị naanị nwoke.
- issue: Ịtụgharị τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Jiri aha ‘Nwa nke Mmadụ.’
  alternative: ‘Onye ahụ bụ mmadụ’
  rationale: Ụdị a na-edobe aha Jizọs ji akpọ onwe ya, okwu Grik ahụ, na njikọ ya n’ime Oziọma na akwụkwọ nsọ ndị ọzọ, n’enweghị ịgbakwunye nkọwa otu ụka.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Usoro ahụ na-edobe ụda okwu ngọzi, ndepụta omume mkpagbu, na aha ‘Nwa nke Mmadụ.’ E tinyere akara [a] n’ebe ọ na-akọwa akpaalaokwu banyere ‘aha,’ ka a ghara ime ka nkọwa Grik ahụ bụrụ naanị otu ihe.
