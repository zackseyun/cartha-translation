  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: ig
  text: Mgbe o legharịrị ha niile anya, ọ sịrị ya, “Gbatịa aka gị.” O mere otú ahụ, e wee weghachite aka ya n’ọnọdụ mbụ ya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “A gwọrọ aka ya.” Okwu Grik ahụ, n’ụzọ ka kpọmkwem, sịrị na e weghachiri aka ya n’ọnọdụ o kwesịrị ịdị.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: Mgbe o legharịrị ... anya
  rationale: Nke a na-egosi na o buru ụzọ lee ndị nọ ebe ahụ gburugburu tupu ya ekwuo okwu, ma na-ada nke ọma n’Igbo.
- source_word: πάντας αὐτούς
  choice: ha niile
  rationale: Ọ na-echekwa nkwusi okwu Grik ahụ na ọ lere onye ọ bụla n’ime ha anya.
- source_word: εἶπεν αὐτῷ
  choice: ọ sịrị ya
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma dị mfe nke ngwaa ikwu okwu tinyere onye a gwara okwu.
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: Setịpụ aka gị
  rationale: “Setịpụ” na-enye iwu ime ka aka gbatịa n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ὁ δὲ ἐποίησεν
  choice: O mere otú ahụ
  rationale: Ọ na-ezo aka kpọmkwem n’ihe a gwara nwoke ahụ ka o mee, ebe δέ bụ njikọ akụkọ dị nro n’ebe a.
- source_word: ἀπεκατεστάθη
  choice: e wee weghachite ... n’ọnọdụ mbụ ya
  rationale: Ọ na-echekwa echiche bụ́ iweghachi ihe n’ọnọdụ kwesịrị ya, kama ịkọwa ya ozugbo naanị dị ka ọgwụgwọ.
- source_word: ἡ χεὶρ αὐτοῦ
  choice: aka ya
  rationale: Ọ na-echekwa aha akụkụ ahụ na nkwupụta onye nwe ya n’ụzọ Igbo nkịtị.
theological_decisions:
- issue: Ụdị ọrụ ebube nke ἀπεκατεστάθη na-egosi
  choice: e wee weghachite aka ya n’ọnọdụ mbụ ya
  alternative: aka ya wee gwọọ
  rationale: Ngwaa Grik ahụ na-emesi iweghachi aka ahụ n’ọnọdụ kwesịrị ya ike. Nhọrọ a na-echekwa echiche ahụ n’etinyeghị okwu ọgwụgwọ karịrị ihe okwu Grik kwuru.
translation_notes:
  register: 'Ejiri Standard Igbo nke dị ugbu a, dị mfe nghọta ma nwee ugwu. Ahịrịokwu ahụ na-echekwa usoro ihe mere: o buru ụzọ lee ha niile anya, nye iwu, nwoke ahụ mee ya, aka ya wee laghachi n’ọnọdụ kwesịrị ya.'
