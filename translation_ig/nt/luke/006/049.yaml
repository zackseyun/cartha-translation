id: LUK.6.49
reference: Luke 6:49
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: ig
  text: Ma onye nụrụ ma o meghị ihe ahụ[a] dị ka nwoke wuru ụlọ n’ala n’enweghị ntọala. Mgbe osimiri ahụ kụrụ ụlọ ahụ, ọ dara ozugbo, mbibi ụlọ ahụ wee dị ukwuu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ma o meghị ihe ọ nụrụ,” ma ọ bụ, “ma o tinyeghị ya n’ọrụ.” Ngwaa Grik ahụ pụtara nanị “ime,” ma n’ebe a ọ na-ekwu maka ime ihe Jizọs kwuru.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mgbawa ụlọ ahụ dị ukwuu.” Okwu Grik ahụ pụrụ ịpụta mgbawa, mmebi, ma ọ bụ mbibi nke ụlọ ahụ dara kpatara.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: Ma onye nụrụ ma o meghị ya
  rationale: Nkebiokwu a na-egosi onye nụrụ okwu Jizọs ma ọ naghị eme ihe ọ nụrụ. ‘O meghị ya’ na-edobe ngwaa ποιέω dị mfe ma na-adabere n’ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: ἀνθρώπῳ
  choice: nwoke
  rationale: Ọ bụ ezie na ἄνθρωπος pụrụ ịpụta mmadụ n’ozuzu, ebe a ọ bụ otu nwoke e ji mee ihe atụ; ‘nwoke’ na-edobe onyinyo onye otu n’asụsụ mmalite.
- source_word: ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: n’ala n’enweghị ntọala
  rationale: ‘N’ala’ bụ okwu Igbo dị mfe maka ebe e wuru ụlọ ahụ, ebe ‘n’enweghị ntọala’ na-edobe ihe bụ isi n’onyinyo ahụ.
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: Mgbe osimiri ahụ jiri ike dakwasị ụlọ ahụ
  rationale: προσρήγνυμι na-egosi nkụda siri ike. Ikwughachi ‘ụlọ ahụ’ kama iji nnọchiaha na-eme ka ihe osimiri dakwasịrị doo anya n’Igbo.
- source_word: εὐθὺς συνέπεσεν
  choice: ọ dara ozugbo
  rationale: συμπίπτω na-ekwu maka ụlọ ịda ma ọ bụ ịdakọta; ‘dara’ bụ okwu Igbo nkịtị ma ‘ozugbo’ na-edobe εὐθύς.
- source_word: τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: mbibi ụlọ ahụ wee dị ukwuu
  rationale: ῥῆγμα nwere ike ịpụta mgbawa, mmebi, ma ọ bụ mbibi sitere n’ịda. N’ebe a, ‘mbibi’ na-enye nsonaazụ ahụ n’Igbo doro anya, ebe ‘dị ukwuu’ na-edobe μέγα.
theological_decisions:
- issue: Asụsụ nwoke e ji anọchi anya mmadụ n’ihe atụ ahụ
  choice: nwoke
  alternative: mmadụ
  rationale: Ihe atụ ahụ ji otu nwoke mee ihe n’asụsụ mmalite. Nsụgharị ahụ debere onyinyo a, n’agbanyeghị na ihe a na-akụzi metụtara onye ọ bụla na-anụ ma ọ naghị eme.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị mfe ma dị ugwu mee ihe. Ahịrịokwu ahụ na-edobe usoro ihe atụ ahụ: ịnụ ma ghara ime, iwu ụlọ na-enweghị ntọala, mwakpo osimiri, ịda ozugbo, na nnukwu mbibi.'
