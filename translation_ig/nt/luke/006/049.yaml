review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrast between hearing and not doing, the foundationless house, its immediate collapse, and the greatness of its ruin. However, “osimiri ahụ jiri ike dakwasị ụlọ ahụ” can suggest that the river came down upon the house; προσέρηξεν instead depicts the river striking/bursting against it. “Kụrụ” more directly conveys the violent impact without adding imagery.
  naturalness: The revised wording is fluent, modern Standard Igbo. “O meghị ihe ahụ” gives the implied object of ποιέω clearly, while retaining the compactness of the Greek.
  terminology: “Nwoke” appropriately retains the masculine singular figure in the simile. “Ntọala,” “osimiri,” and “mbibi” are suitable, clear terms. The footnotes retain lexical alternatives without imposing interpretation.
  issues:
  - severity: medium
    issue: “jiri ike dakwasị” for προσέρηξεν
    rationale: This expression may mean ‘came down forcefully upon,’ whereas the Greek verb specifically portrays the river’s forceful collision with/against the house. “Kụrụ ụlọ ahụ” better represents the impact.
  revised_text: Ma onye nụrụ ma o meghị ihe ahụ[a] dị ka nwoke wuru ụlọ n’ala n’enweghị ntọala. Mgbe osimiri ahụ kụrụ ụlọ ahụ, ọ dara ozugbo, mbibi ụlọ ahụ wee dị ukwuu.[b]
