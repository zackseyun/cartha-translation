  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: ig
  text: Onye na-eso ụzọ adịghị elu karịa onye nkụzi ya, ma onye ọ bụla e zụrụ nke ọma[a] ga-adị ka onye nkụzi ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye ọ bụla e kwadebere nke ọma ga-adị ka onye nkụzi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: onye na-eso ụzọ
  rationale: Nke a na-echekwa echiche nke onye na-amụta ihe site n’iso onye nkụzi ya, ọ bụghị naanị nwa akwụkwọ nọ n’ụlọ akwụkwọ.
- source_word: ὑπὲρ
  choice: elu karịa
  rationale: N’ebe a okwu ahụ na-egosi ịdị elu n’ọkwa; ntụgharị a bụ nke doro anya ma kwekọọ n’ilu ahụ.
- source_word: διδάσκαλος
  choice: onye nkụzi
  rationale: Ọ bụ okwu Igbo nkịtị ma kpọmkwem maka onye na-akụzi ihe.
- source_word: κατηρτισμένος
  choice: e zụrụ nke ọma
  rationale: Perfect passive participle a na-egosi onye e meworo ka ọ dị njikere site n’ọzụzụ; ọnọdụ gbasara onye na-eso ụzọ na onye nkụzi na-akwado echiche ọzụzụ.
- source_word: πᾶς
  choice: onye ọ bụla
  rationale: Ọ na-enye ụdị okwu izugbe nke Greek masculine singular n’Igbo dị mfe.
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-egosi ntụnyere n’etiti onye a zụrụ na onye nkụzi ya.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha Igbo “ya” na-ezo aka n’otu onye ahụ ma ghara ịtinye okike nwoke ma ọ bụ nwanyị ebe asụsụ Igbo anaghị achọ ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti onye na-eso ụzọ na onye nkụzi mgbe ọzụzụ zuru oke
  choice: ga-adị ka onye nkụzi ya
  alternative: ga-aha ka onye nkụzi ya
  rationale: “Dị ka” na-echekwa ntụnyere nke ὡς n’enweghị ikwu na ha ga-abụ otu onye ma ọ bụ hara nhata n’ụzọ niile.
- issue: Ihe κατηρτισμένος pụtara
  choice: e zụrụ nke ọma
  alternative: e kwadebere nke ọma / e mezuru
  rationale: N’ọnọdụ a, okwu gbasara onye na-eso ụzọ na onye nkụzi na-eme ka echiche ọzụzụ pụta ìhè, ma ndetu ala na-echekwa obosara nke okwu Greek ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Onye na-eso ụzọ” na-echekwa ọdịdị mmekọrịta na ọzụzụ nke μαθητής; “nwa akwụkwọ” ga-eme ka ọ yie naanị ọnọdụ ụlọ akwụkwọ. A tinyere akara ndetu [a] ozugbo n’isiokwu ọ na-akọwa.
