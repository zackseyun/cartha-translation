  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: ig
  text: Ma ara jupụtara ha, ha wee na-akparịta ụka n’etiti onwe ha banyere ihe ha nwere ike ime Jizọs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “oke nzuzu jupụtara ha,” ma ọ bụ, “enweghị ezi uche jupụtara ha.” Okwu Grik ahụ nwere ike ịpụta ara, nzuzu, ma ọ bụ enweghị ezi uche.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ
  choice: ha
  rationale: Nnọchiaha ahụ nwere nkwusi ike ma na-egosi ọdịiche dị n'etiti ndị a na Jizọs; n'Igbo, “ha” n'ọnọdụ a na-enye nghọta ahụ n'ụzọ eke.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti omume ọma Jizọs n'amaokwu bu ụzọ na mmeghachi omume ndị a.
- source_word: ἐπλήσθησαν ἀνοίας
  choice: juputara n'oké iwe nke na-enweghị uche
  rationale: “Juputara” na-echekwa akpaala okwu Grik; nkebi nke fọdụrụ na-ejikọta iwe dị n'ọnọdụ a na isi echiche ἄνοια, ya bụ enweghị uche ma ọ bụ nzuzu, n'enweghị ime ka ọ bụrụ ọrịa uche.
- source_word: διελάλουν
  choice: na-akparịta ụka
  rationale: Ụdị imperfect na-egosi mkparịta ụka na-aga n'ihu na ntụle ha na-atụle ọnụ.
- source_word: πρὸς ἀλλήλους
  choice: n'etiti onwe ha
  rationale: Ọ na-egosi na ha na-ekwurịta okwu ibe ha.
- source_word: τί ἂν ποιήσαιεν
  choice: banyere ihe ha pụrụ ime
  rationale: “Pụrụ ime” na-echekwa echiche nke ihe ha nwere ike ikpebi ime, n'ekwughị na ọ bụ ihe ha kwesịrị ime.
- source_word: τῷ Ἰησοῦ
  choice: Jizọs
  rationale: N'Igbo, ihe a na-eme mmadụ nwere ike iso “ime” ozugbo; e tinyeghị “megide” ka a ghara ịkọwapụta iro ahụ karịa otú Grik si kwuo ya.
theological_decisions:
- issue: Ma a ga-asụgharị ἀνοίας dị ka ọrịa uche, nzuzu, ma ọ bụ iwe na-enweghị uche
  choice: oké iwe nke na-enweghị uche
  alternative: ara; nzuzu
  rationale: Nhọrọ a na-echekwa enweghị uche dị n'okwu Grik ma na-egosikwa ike mmetụta iwe dị n'ọnọdụ ahụ, n'emeghị ka okwu ahụ bụrụ nchọpụta ọrịa uche.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. A họọrọ “na-akparịta ụka n'etiti onwe ha” ka ọ bụrụ nke ndị nkịtị ga-aghọta, ebe e chekwara ntụgharị uche na-aga n'ihu nke imperfect Grik.
