id: LUK.6.7
reference: Luke 6:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: ig
  text: Ndị odeakwụkwọ na ndị Farisii nọ na-ele ya anya nke ọma[a], ka ha hụ ma ọ̀ ga-agwọ ọrịa n’ụbọchị izu ike, ka ha wee chọta ihe ha ga-eji bo ya ebubo[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nọ na-eleru ya anya.” Ngwaa Grik ahụ pụrụ ịpụta ile mmadụ anya nke ọma, ọbụna n’ụzọ iro ma ọ bụ enyo.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “chọta ebubo megide ya,” ma ọ bụ naanị, “bo ya ebubo.” Okwu Grik ahụ na-egosi na ha na-achọ ihe ndabere ha ga-eji bo ya ebubo.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: nọ na-ele ya anya nke ọma
  rationale: Oge ngwaa Grik a na-egosi na ha nọgidere na-ele ya anya nke ọma. N’ọnọdụ a, ile anya ahụ abụghị nke nkịtị, kama ọ bụ nleba anya nke ndị na-achọ ihe ha ga-eji megide ya.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ okwu a na-ejikarị n’Igbo akọwa ndị maara ma na-akụzi Iwu n’oge ahụ, ma ọ na-edobe aha ọrụ ndị ahụ dịka isi mmalite si kwuo.
- source_word: Φαρισαῖοι
  choice: ndị Farisii
  rationale: E depụtara aha òtù a n’ụdị a maara nke ọma n’Igbo, kama ịkọwa ya dịka utu aha.
- source_word: εἰ
  choice: ka ha hụ ma
  rationale: Nke a na-egosi na ebumnuche ile ya anya bụ ịchọpụta ihe ọ ga-eme.
- source_word: ἐν τῷ σαββάτῳ
  choice: n’ụbọchị izu ike
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke e ji eme ihe n’Igbo maka Sabat ndị Juu; otu ụbọchị ka ụdị okwu Grik ahụ na-ezo aka.
- source_word: θεραπεύει
  choice: ọ̀ ga-agwọ ọrịa
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a, n’ajụjụ a na-akọ n’ime akụkọ, Igbo na-ekwu ya nke ọma dịka ihe ha na-eche ịhụ ma ọ ga-eme.
- source_word: ἵνα εὕρωσιν
  choice: ka ha wee chọta
  rationale: 'Nhọrọ a na-edobe ebumnuche nke ἵνα: ihe mere ha ji na-ele ya anya bụ ka ha chọta ihe ha chọrọ.'
- source_word: κατηγορεῖν αὐτοῦ
  choice: ihe ha ga-eji bo ya ebubo
  rationale: N’usoro ya na εὕρωσιν, okwu ahụ pụtara ịchọta ihe ma ọ bụ ihe ndabere a ga-eji bo ya ebubo. Nsụgharị a bụ Igbo eke ma ọ naghị etinye ihe karịrị echiche Grik ahụ.
theological_decisions:
- issue: Ebumnuche ndị mmegide ji na-ele Jizọs anya
  choice: E gosiri na ha ji nlezianya na-ele ya anya iji chọta ihe ha ga-eji bo ya ebubo.
  alternative: A pụrụ ịsụgharị ya n’ụzọ na-anọpụ iche dịka naanị na ha na-ele ma ọ ga-agwọ ọrịa.
  rationale: Ngwakọta nke παρετηροῦντο na nkebi ebumnuche ἵνα εὕρωσιν κατηγορεῖν αὐτοῦ na-egosi nleba anya e bu n’obi ịchọta ebubo. Nsụgharị ahụ na-egosi iro dị n’ọnọdụ a n’etinyeghị nkọwa okpukpe ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro akụkọ ahụ n’ụzọ eke n’Igbo, ma chekwaa nleba anya iro na ebumnuche ịchọta ebubo dị n’isi mmalite.
