id: LUK.6.43
reference: Luke 6:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: ig
  text: N’ihi na ọ dịghị ezi osisi na-amị mkpụrụ rere ure[a]; n’aka nke ọzọ, ọ dịghịkwa osisi rere ure na-amị ezi mkpụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mkpụrụ ọjọọ” / “osisi ọjọọ.” Okwu Grik bụ σαπρός, nke pụrụ ịpụta ihe rere ure, ihe mebiri emebi, ma ọ bụ ihe ọjọọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ
  choice: N’ihi na ọ dịghị
  rationale: “N’ihi na” na-egosipụta ọrụ nkọwa nke γάρ ma jikọta okwu a na ihe bu ya ụzọ; “ọ dịghị” na-egosipụta nkwụ megide ịdị adị nke Οὐ ... ἐστιν.
- source_word: δένδρον
  choice: osisi
  rationale: N’ebe a, okwu ahụ pụtara osisi na-amị mkpụrụ; “osisi” bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị.
- source_word: καλὸν / καλόν
  choice: ezi
  rationale: “Ezi” na-echekwa echiche nke ihe dị mma ma ọ bụ zuru oke, ma ọ dabara ma osisi ma mkpụrụ n’usoro ntụnyere a.
- source_word: ποιοῦν
  choice: na-amị
  rationale: Ọ bụ ezie na ποιέω pụtara ime ma ọ bụ ịrụpụta, “ịmị mkpụrụ” bụ ụzọ Igbo si ekwu ihe osisi na-eme, ya mere ọ bụ ntụgharị ebumpụta ụwa nke na-echekwa ihe okwu ahụ pụtara.
- source_word: καρπὸν
  choice: mkpụrụ
  rationale: “Mkpụrụ” bụ okwu Igbo a na-ejikarị eme ihe maka fruit, ma ọ na-arụkwa ọrụ n’ihe atụ gbasara omume.
- source_word: σαπρόν
  choice: rere ure
  rationale: “Rere ure” na-echekwa onyinyo a na-ahụ anya nke ihe mebiri emebi ma ọ bụ rere ure, kama ime ka okwu ahụ bụrụ naanị ikpe omume dịka “ọjọọ.”
- source_word: οὐδὲ πάλιν
  choice: ọ dịghịkwa
  rationale: “Ọ dịghịkwa” na-ejikọta nkebiokwu nke abụọ na nkwụ megide nke mbụ n’ụzọ Igbo dị larịị. Echiche ntụgharị nke πάλιν pụtara ìhè site n’usoro abụọ na-emegiderịta onwe ha, n’agbanyeghị na a naghị atụgharị ya n’otu okwu pụrụ iche.
theological_decisions:
- issue: Ike nke ihe atụ banyere osisi na omume
  choice: A tụgharịrị σαπρός dịka “rere ure” n’ebe abụọ ahụ.
  alternative: “ọjọọ”
  rationale: “Rere ure” na-edobe ihe atụ nke osisi na mkpụrụ n’ihu, ka ihe ọ pụtara gbasara omume si n’ihe atụ ahụ pụta n’onwe ya, kama itinye nkọwa omume kpọmkwem n’ahịrịokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. “Na-amị mkpụrụ” bụ akpaalaokwu Igbo ebumpụta ụwa maka osisi na-producing fruit. E chekwara nhazi ntụnyere nke ezi osisi/ezi mkpụrụ na osisi rere ure/mkpụrụ rere ure.
