- from: O wee ruo n’otu ụbọchị izuike, mgbe ọ na-agafe n’ubi ọka, ndị na-eso ụzọ ya nọ na-aghọrọ isi ọka[a] na-ata ha, na-ete ha n’ọbụ aka ha[b].
  to: O wee bụrụ na n’otu ụbọchị izuike, ka ọ na-agafe n’ubi ọka, ndị na-eso ụzọ ya nọ na-atụtụ isi ọka[a] ma na-eri ha, na-ete ha n’ọbụ aka ha[b].
