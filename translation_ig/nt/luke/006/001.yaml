  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: ig
  text: O wee bụrụ na n’otu ụbọchị izuike, ka ọ na-agafe n’ubi ọka, ndị na-eso ụzọ ya nọ na-atụtụ isi ọka[a] ma na-eri ha, na-ete ha n’ọbụ aka ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ntị ọka.” Okwu Grik στάχυας na-ezo aka n’isi ma ọ bụ ntị ọka, ebe mkpụrụ ya dị.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ha na-ete ọka ahụ n’ọbụ aka ha ka e kewapụ mkpụrụ a na-eri n’isi ọka ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: O wee ruo
  rationale: Nke a bụ ụzọ Luk si ebido akụkọ ọhụrụ. “O wee ruo” na-egosi njikọ akụkọ ahụ n’Igbo n’etinyeghị okwu oge ọzọ na-adịghị na Grik.
- source_word: ἐν σαββάτῳ
  choice: n’otu ụbọchị izuike
  rationale: Aha ahụ enweghị article na Grik, ya mere “otu ụbọchị izuike” na-egosi otu oge izuike na-akọwaghị nke ọ bụ kpọmkwem.
- source_word: διαπορεύεσθαι αὐτὸν
  choice: mgbe ọ na-agafe
  rationale: Ọ na-egosi omume nọ na-aga n’ihu, ma usoro a bụ nke dị mfe ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: διὰ σπορίμων
  choice: n’ubi ọka
  rationale: σπόριμα bụ ubi a kụrụ ihe ubi na-amị mkpụrụ; “ubi ọka” doro ndị na-agụ Igbo anya ma ọ naghị ekwu ụdị ọka kpọmkwem.
- source_word: ἔτιλλον
  choice: nọ na-aghọrọ
  rationale: Ọdịdị imperfect na-egosi omume na-aga n’ihu; “nọ na-aghọrọ” na-echekwa nke ahụ.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa μαθηταί.
- source_word: καὶ ἤσθιον
  choice: na-ata ha
  rationale: E jikọtara omume iri ahụ na nke ịghọrọ dị ka omume abụọ na-aga n’ihu n’otu oge.
- source_word: τοὺς στάχυας
  choice: isi ọka
  rationale: στάχυας pụtara isi ma ọ bụ ntị ọka, ya bụ akụkụ nke nwere mkpụrụ; “isi ọka” bụ okwu dị mfe ma ghara ịkọwa ụdị ọka ahụ karịa ihe Grik kwuru.
- source_word: ψώχοντες ταῖς χερσίν
  choice: na-ete ha n’ọbụ aka ha
  rationale: 'Nke a na-echekwa omume a kọwara n’ụzọ doro anya: ha na-ete isi ọka ahụ n’etiti aka ha tupu ha erie ya.'
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ụbọchị izuike” na-ezere ibubata nkọwa otu ụka pụrụ iche, ebe “isi ọka” na-ahapụ ụdị ihe ubi ahụ n’enweghị ịkọwa ya karịa isi mmalite Grik.
