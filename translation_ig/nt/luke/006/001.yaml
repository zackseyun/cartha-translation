review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the Sabbath setting, Jesus' passage through cultivated grainfields, and the disciples' plucking, eating, and rubbing grain in their hands. However, “O wee ruo n’otu ụbọchị izuike” is not an idiomatic or accurate rendering of the Lucan event-introducing construction; it can suggest that a day ‘arrived’ rather than that the narrated event occurred.
  naturalness: The revision uses natural, modern Standard Igbo. “O wee bụrụ na …” is an established narrative introduction, and “na-atụtụ” expresses plucking grain heads more naturally than “na-aghọrọ” in this immediate context.
  terminology: “Ụbọchị izuike” suitably renders σάββατον without importing a denominational designation. “Ndị na-eso ụzọ ya,” “isi ọka,” and “ọbụ aka” are clear and appropriate. The explanatory cultural footnote is revised for idiomatic grammar and to state the action precisely.
  issues:
  - severity: medium
    issue: Narrative introduction is unnatural and shifts the sense.
    rationale: “O wee ruo n’otu ụbọchị izuike” treats the Sabbath day as something that arrived. Ἐγένετο δὲ introduces the occurrence of the following event; “O wee bụrụ na …” better preserves this function.
  - severity: low
    issue: The cultural footnote has awkward wording.
    rationale: “ka mkpụrụ a ga-eri kewapụ” lacks the natural passive/causative expression needed in Igbo. “ka e kewapụ mkpụrụ a na-eri n’isi ọka ahụ” clearly explains the separation of edible kernels from the heads.
  revised_text: O wee bụrụ na n’otu ụbọchị izuike, ka ọ na-agafe n’ubi ọka, ndị na-eso ụzọ ya nọ na-atụtụ isi ọka[a] ma na-eri ha, na-ete ha n’ọbụ aka ha[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ntị ọka.” Okwu Grik στάχυας na-ezo aka n’isi ma ọ bụ ntị ọka, ebe mkpụrụ ya dị.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ha na-ete ọka ahụ n’ọbụ aka ha ka e kewapụ mkpụrụ a na-eri n’isi ọka ahụ.
    reason: cultural_note
  revision_rationale: 'The text is revised only where needed: the opening now idiomatically conveys the Greek narrative-event formula, “na-atụtụ” naturally denotes plucking grain heads, and the cultural note is grammatically clarified. The Sabbath remains indefinite (“n’otu ụbọchị izuike”), and no crop type or theological interpretation is added.'
