revisions:
- from: Unu ekpela ndị ọzọ ikpe, a gaghịkwa ekpe unu ikpe ma ọlị; unu amakwala ndị ọzọ ikpe, a gaghịkwa ama unu ikpe ma ọlị. Hapụnụ ndị ọzọ[a], a ga-ahapụkwa unu.
  to: Unu ekpela ndị ọzọ ikpe, a gaghịkwa ekpe unu ikpe ma ọlị; unu amakwala ndị ọzọ ikpe, a gaghịkwa ama unu ikpe ma ọlị. Tọhapụnụ ndị ọzọ[a], a ga-atọhapụkwa unu.
  rationale: The revision replaces bare “hapụ” with “tọhapụ” in both halves of the final saying. This avoids the misleading sense “leave/abandon” while preserving the broad release sense of ἀπολύω and its formal correspondence. The footnote remains anchored to the final imperative and supplies “forgive” as a legitimate contextual alternative.
