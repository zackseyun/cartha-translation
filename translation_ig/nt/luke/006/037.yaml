review_pass:
  verdict: revise
  source_fidelity: 'The two prohibitions and their emphatic passive consequences are conveyed accurately. However, the final imperative should retain the Greek verbal correspondence more clearly: bare “Hapụnụ ndị ọzọ” most readily means “leave others” in modern Igbo and can obscure the release/acquittal sense of ἀπολύετε.'
  naturalness: The parallel phrasing is clear and suitably formal. “Tọhapụnụ” is more explicit and natural for the intended release sense than bare “Hapụnụ,” while the footnote preserves “forgive” as the contextually likely narrower interpretation.
  terminology: “Ekpela ... ikpe” and “amakwala ... ikpe” appropriately distinguish judging from condemning/finding guilty. “Tọhapụnụ ... / a ga-atọhapụkwa unu” retains the lexical breadth and reciprocal wordplay of ἀπολύω.
  issues:
  - severity: medium
    issue: The rendering “Hapụnụ ndị ọzọ ... a ga-ahapụkwa unu” is semantically too loose.
    rationale: In Standard Igbo, bare “hapụ” commonly means leave or abandon. “Tọhapụ” better represents release/set free, without requiring the narrower interpretive rendering “gbaghara.”
  revised_text: Unu ekpela ndị ọzọ ikpe, a gaghịkwa ekpe unu ikpe ma ọlị; unu amakwala ndị ọzọ ikpe, a gaghịkwa ama unu ikpe ma ọlị. Tọhapụnụ ndị ọzọ[a], a ga-atọhapụkwa unu.
