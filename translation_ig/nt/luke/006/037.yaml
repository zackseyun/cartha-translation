  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: ig
  text: Unu ekpela ndị ọzọ ikpe, a gaghịkwa ekpe unu ikpe ma ọlị; unu amakwala ndị ọzọ ikpe, a gaghịkwa ama unu ikpe ma ọlị. Tọhapụnụ ndị ọzọ[a], a ga-atọhapụkwa unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gbagharanụ ndị ọzọ, a ga-agbagharakwa unu.” Okwu Grik a nwere ike ịpụta “hapụ,” “tọhapụ,” ma n’ọnọdụ a, a pụkwara ịghọta ya dịka “gbaghara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: ekpela ndị ọzọ ikpe
  rationale: Nke a na-egosipụta iwu ahụ ka a ghara ikpe ndị ọzọ ikpe, ma na-edobe njikọ ya na ụdị nnara ‘a gaghị ekpe unu ikpe.’
- source_word: οὐ μὴ κριθῆτε
  choice: a gaghịkwa ekpe unu ikpe ma ọlị
  rationale: ‘Ma ọlị’ na-egosipụta nkwusi ike dị n’usoro Grik οὐ μή n’Igbo dị mfe ma doo anya.
- source_word: καταδικάζετε
  choice: amakwala ndị ọzọ ikpe
  rationale: ‘Ịma mmadụ ikpe’ siri ike karịa nanị ‘ikpe ikpe’; ọ na-egosi ikpe mmadụ ikpe dị ka onye ikpe mara, si otú ahụ na-edobe nrịgo echiche dị n’etiti κρίνω na καταδικάζω.
- source_word: οὐ μὴ καταδικασθῆτε
  choice: a gaghịkwa ama unu ikpe ma ọlị
  rationale: Nke a na-edobe ụdị nnara, nkwusi ike nke οὐ μή, na myirịta ya na ahịrịokwu bu ya ụzọ.
- source_word: ἀπολύετε
  choice: Hapụnụ ndị ọzọ
  rationale: ‘Hapụnụ’ na-edobe obosara okwu ἀπολύω—ịhapụ, ịtọhapụ, ma ọ bụ ịhapụ mmadụ n’ihe e ji ya—na-enweghị ime ka isi ihe ya bụrụ naanị mgbaghara.
- source_word: ἀπολυθήσεσθε
  choice: a ga-ahapụkwa unu
  rationale: Iji otu mgbọrọgwụ ‘hapụ’ n’ahịrịokwu abụọ ahụ na-edobe nzaghachi na myirịta dị n’okwu Grik.
- source_word: καὶ
  choice: kwa
  rationale: ‘Kwa’ na-ejikọta akụkụ ndị yiri ibe ha n’ụzọ sitere n’okike n’Igbo ma na-anọchi καὶ ugboro ugboro.
theological_decisions:
- issue: Ma a ga-akọwa ἀπολύετε n’ụzọ wara wara dị ka ‘gbaghara’ ka ọ bụ n’ụzọ sara mbara dị ka ‘hapụ’
  choice: E ji ‘Hapụnụ ndị ọzọ’ mee ihe n’ahịrịokwu bụ isi.
  alternative: ‘Gbagharanụ ndị ọzọ’
  rationale: N’ọnọdụ okwu a gbasara ikpe ikpe na ịma ikpe, ἀπολύω nwere ike ịpụta ịtọhapụ mmadụ ma ọ bụ ịhapụ ihe e ji ya. ‘Hapụnụ’ na-echekwa obosara na ntakịrị mgbagwoju anya nke okwu Grik; a debere ‘gbaghara’ n’ala ala peeji dịka nkọwa dabara adaba.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. ‘Unu …’ na-egosi na iwu ndị a bụ maka ọtụtụ mmadụ. Myirịta nke ahịrịokwu Grik ka echekwara site n’iji ‘ikpe ikpe/ekpe ikpe,’ ‘ịma ikpe/ama ikpe,’ na ‘ịhapụ/ahapụ’ n’akụkụ abụọ nke okwu ọ bụla.
