id: LUK.6.44
reference: Luke 6:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: ig
  text: N’ihi na a na-eji mkpụrụ nke ya amata osisi ọ bụla; n’ihi na a naghị atụtụ mkpụrụ fig n’osisi ogwu, a naghịkwa aghọ mkpụrụ vaịn n’osisi ogwu ọhịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a na-ezo aka n’ụdị osisi ọhịa nwere ogwu, nke yiri bramble.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: osisi ọ bụla
  rationale: 'Nke a na-egosipụta echiche nkesa dị n’okwu Grik: a na-ekwu banyere osisi n’otu n’otu.'
- source_word: γὰρ
  choice: N’ihi na; njikọ nkọwa gosipụtara site n’usoro ahịrịokwu nke abụọ
  rationale: ‘N’ihi na’ na-edobe njikọ nkọwa nke γάρ mbụ. N’ahịrịokwu nke abụọ, usoro okwu na ntụpọ na-egosi na ihe na-esote na-akwado ilu ahụ, n’enweghị ikwughachi njikọ n’ụzọ na-adịghị ada ka Igbo nkịtị.
- source_word: ἐκ τοῦ ἰδίου καρποῦ
  choice: site ná mkpụrụ nke ya / a na-eji mkpụrụ nke ya
  rationale: ‘Mkpụrụ nke ya’ na-echekwa ἰδίου, ebe usoro ‘a na-eji ... amata’ na-enye ἐκ nghọta ngwá ọrụ dabara n’Igbo.
- source_word: γινώσκεται
  choice: a na-eji ... amata
  rationale: Usoro a na-egosipụta omume a na-eme mgbe niile ma na-ada ka ilu Igbo dị mfe ma doo anya.
- source_word: ἀκανθῶν
  choice: osisi ogwu
  rationale: N’agbanyeghị na okwu Grik ahụ bụ ọtụtụ, ọ na-ezo aka n’osisi ndị nwere ogwu; ‘osisi ogwu’ na-ezere nghọta nke ogwu ndị e bepụrụ iche.
- source_word: συλλέγουσιν
  choice: atụtụ
  rationale: ‘Ịtụtụ’ bụ okwu Igbo nkịtị maka ịnakọta mkpụrụ osisi dịka fig.
- source_word: σῦκα
  choice: mkpụrụ fig
  rationale: ‘Fig’ bụ aha mkpụrụ osisi ahụ a na-aghọta n’Igbo ugbu a; itinye ‘mkpụrụ’ na-eme ka ihe a na-ekwu doo anya.
- source_word: βάτου
  choice: osisi ogwu ọhịa
  rationale: Okwu Grik a na-ezo aka n’ụdị ọhịa nwere ogwu yiri bramble, ọ bụghị naanị ọhịa nkịtị.
- source_word: σταφυλήν
  choice: mkpụrụ vaịn
  rationale: Ọ bụ ezie na okwu Grik dị n’otu, ‘mkpụrụ vaịn’ bụ ụzọ Igbo si ekwu mkpụrụ vaịn n’ụzọ ebumpụta ụwa.
- source_word: τρυγῶσιν
  choice: aghọta
  rationale: ‘Ịghọta’ n’ọnọdụ ọrụ ubi na-egosi ịghọ ma ọ bụ iwepụta mkpụrụ chara acha, karịchaa mkpụrụ vaịn, ma na-edobe obere ọdịiche ya na ‘ịtụtụ.’
theological_decisions:
- issue: Ike ihe atụ nke mkpụrụ osisi
  choice: Idowe ilu ọrụ ubi ahụ n’enweghị ịgbasa ya ka ọ kọwaa omume ọma, omume ọjọọ, ma ọ bụ agwa mmadụ kpọmkwem.
  alternative: Ịtinye nkọwa doro anya na mkpụrụ ahụ pụtara omume ma ọ bụ agwa mmadụ.
  rationale: Amaokwu ahụ n’onwe ya na-eji ihe atụ ọrụ ubi eme okwu. Ịhapụ ihe atụ ahụ otu a na-echekwa ike ya na ohere nkọwa ya n’ime gburugburu okwu Jizọs.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. Ahịrịokwu ahụ ka nwere ọdịdị ilu, ma okwu ọrụ ubi ndị ahụ ka doro ndị na-agụ akwụkwọ nkịtị anya.
