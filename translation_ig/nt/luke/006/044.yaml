revisions:
- from: N’ihi na a na-eji mkpụrụ nke ya amata osisi ọ bụla. A naghị atụtụ mkpụrụ fig n’osisi ogwu, a naghịkwa aghọta mkpụrụ vaịn n’osisi ogwu ọhịa[a].
  to: N’ihi na a na-eji mkpụrụ nke ya amata osisi ọ bụla; n’ihi na a naghị atụtụ mkpụrụ fig n’osisi ogwu, a naghịkwa aghọ mkpụrụ vaịn n’osisi ogwu ọhịa[a].
  rationale: The revision corrects the verb for harvesting grapes, preserves the distinction between gathering figs and harvesting grapes, and explicitly retains both occurrences of γάρ. It otherwise maintains the draft’s faithful, idiomatic agricultural proverb and its lexical footnote.
  reviewer_model: gpt-5.6-terra
