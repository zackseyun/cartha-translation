id: LUK.6.28
reference: Luke 6:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς καταρωμένους ⸀ὑμᾶς, προσεύχεσθε ⸀περὶ τῶν ἐπηρεαζόντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: ig
  text: Gọzienụ ndị na-akọcha unu; kpeerenụ ndị na-emegbu unu ekpere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Gọzienụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. “Gọzienụ” bụ okwu Igbo doro anya nke na-echekwa ọdịiche dị n’etiti ịgọzi na ịkọcha.
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: ndị na-akọcha unu
  rationale: 'Participụl ahụ e tinyere artikụl na-arụ ọrụ dị ka aha: ndị na-akpọku ihe ọjọọ megide unu. “Ndị na-akọcha unu” bụ Igbo nkịtị ma na-echekwa omume okwu iro ahụ.'
- source_word: προσεύχεσθε
  choice: kpeerenụ ... ekpere
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ. Usoro “kpeerenụ ... ekpere” na-ekwupụta iwu ahụ n’Igbo dị ugbu a ma ghara ịmanye nkọwa pụrụ iche banyere akụkụ oge nke present tense Grik.
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: ndị na-emegbu unu
  rationale: περί tinyere προσεύχομαι pụtara ikpe ekpere maka mmadụ. ἐπηρεάζω nwere ike ịgụnye mmegbu, mkparị, ma ọ bụ mmeso ọjọọ; “na-emegbu” na-enye echiche sara mbara ma dị mfe nghọta n’Igbo.
theological_decisions:
- issue: Oke iwu banyere ịhụ ndị iro n’anya
  choice: E nyere iwu abụọ ahụ ozugbo, n’enweghị nkọwa ozizi agbakwunyere.
  alternative: Ịgbakwunye nkọwa banyere ụdị mmegbu ma ọ bụ ókè iwu ahụ ruru.
  rationale: Amaokwu ahụ na-enye iwu omume doro anya banyere otú e si aza iro. Nsụgharị ahụ kwesịrị idobe ike na esemokwu nke iwu ndị ahụ n’onwe ha, ghara itinye ozizi otu ụka.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke dị ugbu a, kwanyere ùgwù, ma dị mfe nghọta. E ji ụdị iwu ọtụtụ mmadụ “-nụ” mee ka adreesị plural nke Grik pụta ìhè.
