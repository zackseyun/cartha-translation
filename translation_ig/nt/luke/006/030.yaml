review_pass:
  verdict: revise
  source_fidelity: The first clause accurately conveys the universal recipient and the request addressed to the hearer. In the second clause, the draft correctly reflects the broad sense of αἴρων and avoids prejudging theft. However, its final pronoun sequence, “ka o nyeghachi ya,” does not clearly identify the returned object or the person to whom it is returned; it can mean that the taker gives something back to another person rather than back to “you.”
  naturalness: “Nye onye ọ bụla na-arịọ gị ihe” is natural Standard Igbo. Recasting the second clause with “n'aka onye” and explicit “gị” and “ihe ndị ahụ” makes the relationship of reclamation clear and idiomatic.
  terminology: No theological or proper-name terminology occurs. “Na-ewere ihe bụ nke gị” suitably preserves the nontechnical breadth of αἴρω, while “arịọla ka ... nyeghachi” maintains the prohibition against seeking return without imposing a legal-theft interpretation.
  issues:
  - severity: medium
    issue: Ambiguous referents in “arịọla ya ka o nyeghachi ya.”
    rationale: The two occurrences of “ya” leave both the item and the recipient unclear. The Greek refers to the things belonging to the addressee and prohibits demanding them back from the taker. Explicit wording is needed in Igbo to preserve that relation.
