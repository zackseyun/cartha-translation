  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: ig
  text: Nye onye ọ bụla na-arịọ gị ihe; ma n'aka onye na-ewere ihe bụ nke gị, arịọla ka o nyeghachi gị ihe ndị ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'aka onye ọ bụla na-ewere ihe bụ nke gị, arịọla ka o nyeghachi gị ihe ndị ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὶ
  choice: onye ọ bụla
  rationale: Na-egosi onye ọbụla n’enweghị ịkpa oke, dịka ojiji nkesa nke πᾶς si dị.
- source_word: αἰτοῦντί σε
  choice: na-arịọ gị ihe
  rationale: Ọ na-egosi onye na-arịọ onye a na-agwa okwu arịrịọ; “ihe” na-eme ka okwu Igbo zuo oke n’enweghị ịkọwa ụdị ihe a rịọrọ.
- source_word: δίδου
  choice: Nye
  rationale: Iwu dị mfe ma kwụ ọtọ; ọ dabara n’ụdị iwu nke δίδου ma ghara ime ka akụkụ oge na-aga n’ihu pụta karịa ka Igbo nkịtị chọrọ.
- source_word: ἀπὸ τοῦ αἴροντος τὰ σὰ
  choice: onye na-ewere ihe bụ nke gị
  rationale: “Na-ewere” na-edebe obosara αἴρω ebe a, n’ebughị ụzọ kọwaa ya dịka izu ohi; “ihe bụ nke gị” na-anọchi neuter plural τὰ σὰ n’ụzọ eke.
- source_word: μὴ ἀπαίτει
  choice: arịọla ya ka o nyeghachi ya
  rationale: Na-egosi ịghara ịchọ ka e weghachi ihe ahụ. Igbo a bụ nke eke, ọ bụ ezie na ἀπαιτέω nwekwara ike ibu echiche nke ịkpọsi ike ka e nyeghachi ihe.
theological_decisions:
- issue: Ókè na ike iwu omume Jizọs kwuru
  choice: E debere iwu ndị ahụ dịka iwu sara mbara ma kwụ ọtọ.
  alternative: Ịsụgharị ha dịka ikwubiga okwu ókè, ịkpa ha ókè n’inye ndị ogbenye ihe, ma ọ bụ ime ka nkebi nke abụọ bụrụ naanị okwu gbasara izu ohi.
  rationale: Grik ji iwu doro anya na okwu zuru ụwa ọnụ kwuo ya. Nsụgharị ekwesịghị ibelata esemokwu omume dị n’okwu ahụ ma ọ bụ kpebie tupu oge eruo otu a ga-esi tinye ya n’ọrụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị mfe ma nwee ugwu. A họọrọ “Jizọs” naanị na nkọwa mkpebi, ọ bụghị n’amaokwu; amaokwu ahụ na-edebe ntụziaka onye nke abụọ otu ọnụọgụ dịka isi mmalite si dị.
