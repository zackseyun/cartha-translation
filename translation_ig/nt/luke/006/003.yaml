id: LUK.6.3
reference: Luke 6:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πρὸς αὐτοὺς εἶπεν ὁ Ἰησοῦς· Οὐδὲ τοῦτο ἀνέγνωτε ὃ ἐποίησεν Δαυὶδ ⸀ὁπότε ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ ⸀ὄντες;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: ig
  text: Jizọs zara ha, sị, “Ọ bụ na unu agụbeghị ọbụna ihe a, bụ ihe Devid mere mgbe agụụ gụrụ ya na ndị ya na ha nọ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: zara ha, sị
  rationale: Ngwakọta participle na ngwaa a pụtara ‘zara wee sị.’ ‘Zara ha, sị’ bụ usoro Igbo dị mma nke na-egosipụta ma nzaghachi ahụ ma okwu sochiri ya.
- source_word: πρὸς αὐτοὺς
  choice: ha
  rationale: E tinyere nnọchiaha ahụ n’usoro ‘zara ha,’ nke bụ ụzọ Igbo nkịtị si egosi ndị Jizọs zara.
- source_word: Οὐδὲ τοῦτο
  choice: ọbụna ihe a
  rationale: ‘Ọbụna’ na-echekwa nkwusi ike dị na οὐδέ, ebe ‘ihe a’ na-anọchi τοῦτο n'ụzọ doro anya.
- source_word: ἀνέγνωτε
  choice: unu agụbeghị
  rationale: Ụdị ajụjụ ‘Ọ bụ na unu agụbeghị...?’ na-egosipụta ajụjụ nkwugide nke na-ezo aka n’ihe ha kwesịrị ịma site n’Akwụkwọ Nsọ.
- source_word: ὃ ἐποίησεν Δαυὶδ
  choice: bụ ihe Devid mere
  rationale: Nke a na-echekwa nkebi njikọ nke Grik ma na-ada nke ọma n’Igbo.
- source_word: Δαυὶδ
  choice: Devid
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha ahụ nke a na-ahụkarị n’Igbo.
- source_word: ὁπότε
  choice: mgbe
  rationale: ‘Mgbe’ bụ njikọ oge dị mfe ma kwekọọ kpọmkwem n’ebe a.
- source_word: ἐπείνασεν
  choice: agụụ gụrụ ya
  rationale: Nke a bụ akpaalaokwu Igbo nkịtị maka ịbụ onye agụụ na-agụ.
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: ya na ndị ya na ha nọ
  rationale: Nke a na-echekwa ma Devid n’onwe ya ma ndị ya na ha nọ, na-enweghị ịkọwa ụdị mmekọrịta ha karịa ihe Grik kwuru.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E debere ajụjụ ahụ dịka ajụjụ nkwugide, a naghịkwa etinye nkọwa ụka ma ọ bụ ozizi agbakwunyere.
