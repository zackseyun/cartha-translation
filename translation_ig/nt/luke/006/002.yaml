    reason: lexical_alternative
  revision_rationale: The revision avoids making “law” explicit where the Greek leaves the source of permission unstated, while retaining the legal-permission sense required by the context. The revised footnote accurately explains the Greek plural idiom without introducing the misleading idea of different Sabbath days.
