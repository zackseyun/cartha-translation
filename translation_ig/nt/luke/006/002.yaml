  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: ig
  text: Ma ụfọdụ n’ime ndị Farisii sịrị, “Gịnị mere unu ji eme ihe e kweghị ka e mee n’ụbọchị izu ike[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a bụ “ụbọchị izu ike” n’ọnụọgụ ọtụtụ; nke a bụ akpaalaokwu a na-ejikarị akọwa otu ụbọchị izu ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: ụfọdụ n’ime
  rationale: Na-egosi naanị otu akụkụ nke ndị Farisii, ọ bụghị ha niile.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere ntụgharị ma ọ bụ esemokwu megide ihe mere n’amaokwu bu ụzọ.
- source_word: Φαρισαίων
  choice: ndị Farisii
  rationale: Ọ bụ nsụgharị-ụda aha otu ndị Juu a n’ụdị Igbo a na-aghọta nke ọma.
- source_word: εἶπαν
  choice: sịrị
  rationale: Aorist ahụ na-akọ okwu ha dị ka otu ihe mere n’akụkọ ahụ.
- source_word: Τί ποιεῖτε
  choice: Gịnị mere unu ji eme
  rationale: Ọ bụ ezie na Τί pụtara ‘gịnị’ n’ụzọ nkịtị, n’ajụjụ ịma aka dị otu a ọ pụtara ‘gịnị mere’; ‘unu’ na-echekwa onye nke abụọ n’ọnụọgụ ọtụtụ.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ihe iwu na-ekweghị ka e mee
  rationale: Na-echekwa echiche banyere ihe iwu ma ọ bụ ụkpụrụ okpukpe na-enyeghị ikike ime, n’Igbo dị mfe ma doo anya.
- source_word: τοῖς σάββασιν
  choice: n’ụbọchị izu ike[a]
  rationale: N’asụsụ Grik okwu ahụ dị n’ọnụọgụ ọtụtụ, ma ọ bụ akpaalaokwu a na-ejikarị akọwa ụbọchị izu ike; Igbo nkịtị na-eji otu ụbọchị mee ka nghọta doo anya, ebe nkọwa ala peeji na-echekwa ụdị Grik ahụ.
theological_decisions:
- issue: Ụdị e si sụgharịa okwu banyere ụbọchị izu ike
  choice: n’ụbọchị izu ike[a]
  alternative: n’ụbọchị izu ike dị iche iche
  rationale: τοῖς σάββασιν dị n’ọnụọgụ ọtụtụ n’asụsụ Grik, ma ebe a ọ bụ akpaalaokwu nkịtị maka ụbọchị izu ike. Ịsụgharị ya n’ọnụọgụ otu bụ Igbo eke, ebe nkọwa ala peeji na-eme ka onye na-agụ mara ọdịdị okwu mbụ ahụ n’emeghị ka ọ pụta na ihe a mere n’ọtụtụ ụbọchị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ajụjụ ahụ ka bụ nke ịma aka, a hapụkwara ‘unu’ ka o doo anya na ndị Farisii na-agwa ihe karịrị otu onye okwu.
