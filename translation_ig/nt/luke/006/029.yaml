id: LUK.6.29
reference: Luke 6:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: ig
  text: Onye na-akụ gị ihe na ntì[a], nyekwa[b] ya ntì nke ọzọ; onye na-anapụ gị uwe elu[c], egbochila ya ịnara uwe ime gị kwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’agba.”
    reason: lexical_alternative
  - marker: b
    text: A na-asụgharịkarị ya n’ụzọ ọdịnala dị ka “tụgharịa ntì nke ọzọ,” ma Grik ebe a kwuru n’ụzọ kpọmkwem, “nye” ma ọ bụ “wepụta” ntì nke ọzọ.
    reason: alternative_reading
  - marker: c
    text: “Uwe elu” bụ uwe a na-eyikwasị n’èzí (ἱμάτιον); “uwe ime” bụ uwe a na-eyi n’ime, nso n’ahụ (χιτών).
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: Onye na-akụ gị
  rationale: Nkebi a na-ezo aka n’ozuzu nye onye na-eme ihe ahụ; okwu a bụ Igbo nkịtị, ma na-edobe ike nke omume ahụ.
- source_word: ἐπὶ τὴν σιαγόνα
  choice: na ntì
  rationale: σιαγών nwere ike ịpụta ntì ma ọ bụ agba; “ntì” dabara nke ọma n’ọnọdụ iti mmadụ ihe n’ihu, ebe nkọwa ọzọ dị n’ala peeji.
- source_word: πάρεχε
  choice: nyekwa ya
  rationale: παρέχω pụtara inye ma ọ bụ iwepụta. “Nyekwa ya” na-edobe iwu nke inye ntì nke ọzọ, kama ibubata okwu Matiu nke pụtara ịtụgharị.
- source_word: καὶ τὴν ἄλλην
  choice: ntì nke ọzọ
  rationale: Aha ahụ a hapụrụ n’asụsụ Grik bụ “ntì”; itinye ya n’Igbo na-eme ka okwu doo anya, ebe echiche καί nke pụtara “kwa/ọzọkwa” dị n’ọrụ ngwaa “nyekwa.”
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: onye na-anapụ gị
  rationale: αἴρω n’ebe a na-egosi iwepụ ma ọ bụ ịnara ihe; “na-anapụ” na-egosipụta nke ahụ n’Igbo eke.
- source_word: τὸ ἱμάτιον
  choice: uwe mwụda
  rationale: ἱμάτιον bụ uwe elu a na-eyikwasị uwe ọzọ; “uwe mwụda” na-edobe ọdịiche ya na uwe ime.
- source_word: τὸν χιτῶνα
  choice: uwe ime gị
  rationale: χιτών bụ uwe a na-eyi n’ime, nso n’ahụ; “uwe ime” na-enye onye Igbo nke oge a nghọta doro anya ma na-edobe ọdịiche uwe abụọ ahụ.
- source_word: μὴ κωλύσῃς
  choice: egbochikwala ya ịnara
  rationale: κωλύω pụtara igbochi ma ọ bụ ime ka ihe ghara ime. Nke a na-edobe ihe ngwaa Grik pụtara ma na-ada nke ọma n’Igbo n’ọnọdụ a.
theological_decisions:
- issue: Ma a ga-eme ka okwu Luk kwekọọ n’okwu Matiu a maara nke ọma, “tụgharịa ntì nke ọzọ.”
  choice: E debere okwu Luk dịka “nyekwa ya ntì nke ọzọ.”
  alternative: “Tụgharịa ntì nke ọzọ.”
  rationale: Luk ji πάρεχε, nke pụtara inye ma ọ bụ iwepụta, ọ bụghị ngwaa nke pụtara ịtụgharị. Nke a na-ezere ibubata okwu sitere n’akụkọ Matiu.
- issue: Ma a ga-akọwa iwu ndị a n’ime amaokwu ahụ dịka iwu nwere oke, ihe atụ ikwubiga okwu ókè, ma ọ bụ nkuzi banyere ịghara ịbọ ọbọ.
  choice: A sụgharịrị iwu ndị ahụ ozugbo, n’etinyeghị nkọwa ga-eme ka ike ha daa ma ọ bụ kpebie esemokwu nkọwa.
  alternative: Ịtinye nkọwa n’amaokwu ahụ iji kọwaa na ọ bụ naanị banyere ịghara ịbọ ọbọ ma ọ bụ na ọ bụ ikwubiga okwu ókè.
  rationale: Asụsụ Grik nyere iwu ozugbo. Nsụgharị kwesịrị idobe ike na mgbagwoju anya nke nkuzi ahụ kama ikpebi ihe ndị na-akọwa ya na-arụrịta ụka.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu dị mkpirikpi na usoro iwu doro anya. E tinyere akara ala peeji niile n’ederede isi.
