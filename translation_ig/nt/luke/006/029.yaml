revisions:
- from: Onye na-akụ gị na ntì[a], nyekwa ya ntì nke ọzọ; onye na-anapụ gị uwe mwụda[b], egbochikwala ya ịnara uwe ime gị kwa.
  to: Onye na-akụ gị ihe na ntì[a], nyekwa[b] ya ntì nke ọzọ; onye na-anapụ gị uwe elu[c], egbochila ya ịnara uwe ime gị kwa.
  rationale: The revision replaces the misleading modern term “uwe mwụda” with “uwe elu” and adds a note defining it as the outer garment. It also makes the first clause more natural in Standard Igbo and restores the explanatory footnote for παρέχε, while preserving the direct force, parallelism, and ambiguity of the Greek.
