source:
  edition: SBLGNT
  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: ig
  text: Ahụhụ ga-adịrị unu mgbe mmadụ niile na-ekwu okwu ọma banyere unu[a], n’ihi na ndị nna ha na-emebu ndị amụma ụgha otu a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekwu ihe ọma banyere unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Ahụhụ dịrị unu
  rationale: Na-edobe ike nke mkpu amụma na ịdọ aka ná ntị; ọ bụghị naanị nkwupụta mwute.
- source_word: ὅταν
  choice: mgbe
  rationale: Na-egosi ọnọdụ nwere ike ime n’ozuzu ya ma na-asụ Igbo n’ụzọ eke.
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: na-ekwu okwu ọma banyere unu
  rationale: Na-egosi ikwu ihe ga-eme ka mmadụ dị mma n’anya ndị ọzọ, ọ bụghị nanị ikwu okwu n’ụzọ ziri ezi.
- source_word: πάντες οἱ ἄνθρωποι
  choice: mmadụ niile
  rationale: Ọ bụ okwu gbasara mmadụ niile n’enweghị ịkọwa naanị nwoke.
- source_word: κατὰ τὰ αὐτά
  choice: otu a
  rationale: Na-enye echiche nke ime ụdị ihe ahụ n’otu ụzọ ahụ n’Igbo dị mfe ma bụrụkwa eke.
- source_word: γάρ
  choice: n’ihi na
  rationale: Na-egosi na ihe sochiri ya bụ ihe kpatara ịdọ aka ná ntị ahụ.
- source_word: ἐποίουν
  choice: na-emesobu
  rationale: Na-egosipụta omume a na-emekarị n’oge gara aga, dịka imperfect Grik si dị.
- source_word: τοῖς ψευδοπροφήταις
  choice: ndị amụma ụgha
  rationale: Na-akọwa ndị omume ahụ metụtara n’ụzọ doro anya.
- source_word: οἱ πατέρες αὐτῶν
  choice: nna nna ha
  rationale: Na-edobe okwu gbasara ọgbọ ndị gara aga n’ụzọ a na-aghọta nke ọma n’Igbo, ebe nkọwa ala peeji na-eme ka obosara ya pụta ìhè.
theological_decisions:
- issue: Ihe ntụnyere ndị amụma ụgha pụtara na ike ọ nwere
  choice: Amaokwu ahụ na-adọ aka ná ntị na otuto sitere n’aka mmadụ niile yiri otú ọgbọ ndị gara aga si mesoo ndị amụma ụgha.
  alternative: Ịghọta ya dị ka ịkatọ okwu ọma ọ bụla mmadụ kwuru banyere onye ọzọ, ma ọ bụ naanị dị ka ịkatọ ịbụ onye a ma ama.
  rationale: γάρ na κατὰ τὰ αὐτά jikọtara ịdọ aka ná ntị ahụ na omume e mesoro ndị amụma ụgha. Nsụgharị ahụ edozighị esemokwu ahụ karịa ihe odide ahụ kwuru, ma ọ dịghịkwa eme ka otuto niile bụrụ ihe ọjọọ.
translation_notes:
  register: Igbo ọkọlọtọ dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” debe plural nke ὑμᾶς. Akara nkọwa [a] na [b] pụtara n’ahịrị isi n’ebe okwu ha na-akọwa dị.
