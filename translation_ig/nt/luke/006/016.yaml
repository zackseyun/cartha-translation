id: LUK.6.16
reference: Luke 6:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: ig
  text: na Judas nwa Jemis[a], na Judas Iskarịọt, onye ghọrọ onye nrara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Judas nwanne Jemis”; n’asụsụ Grik, ihe e kwuru kpọmkwem bụ “Judas nke Jemis.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: Judas nwa Jemis
  rationale: Mkpụrụokwu Ἰακώβου dị n'ụdị genitive ma hapụ mmekọrịta ahụ n'ekwughị ya kpọmkwem. N'ime ndepụta ndị ozi, ‘nwa Jemis’ bụ ụzọ Igbo doro anya ma dị mma isi mejupụta ihe ahapụkwara; a debeghị ohere nke ‘nwanne Jemis’ n'okpuru ala.
- source_word: Ἰσκαριὼθ
  choice: Iskarịọt
  rationale: A sụgharịghị aha/nkọwa onwe a; e dere ya dịka ụda ya si dị n'Igbo.
- source_word: ὃς ἐγένετο
  choice: onye ghọrọ
  rationale: ‘Onye ghọrọ’ na-echekwa ike ngwaa γίνομαι nke pụtara ịghọ ma ọ bụ ịbịa bụrụ, kama ime ya ka ọ bụrụ naanị ọnọdụ ‘onye bụ.’
- source_word: προδότης
  choice: onye sabara ha nye
  rationale: N'Igbo nke oge a, ‘ịsara mmadụ nye’ na-ekwupụta omume ịrara ma ọ bụ inyefe ndị ọzọ mmadụ nke ọma. Ịgbakwunye ‘ha’ na-eme ka okwu ahụ bụrụ nke eke n'ahịrịokwu ma na-ezo aka n'ìgwè Jizọs na ndị na-eso ụzọ ya dị na gburugburu akụkọ ahụ.
- source_word: καὶ
  choice: na
  rationale: ‘Na’ bụ njikọ Igbo dị mfe nke jikọtara aha abụọ ikpeazụ n'ime ndepụta ahụ.
theological_decisions:
- issue: Mmekọrịta Ἰακώβου na-egosi n'okwu ‘Judas nke Jemis’
  choice: Judas nwa Jemis n'isiokwu
  alternative: Judas nwanne Jemis
  rationale: Genitive Grik ahụ ekwughị ụdị mmekọrịta ahụ kpọmkwem. ‘Nwa Jemis’ bụ nghọta a na-anabatakarị ma dị mma n'ndepụta ndị ozi, ma ihe odide ala ala na-echekwa ohere nke ‘nwanne Jemis’ n'ebughị ụzọ kpebie esemokwu ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji ‘ghọrọ’ chekwaa mgbanwe ọnọdụ dị na ἐγένετο, ebe ‘onye sabara ha nye’ na-enye προδότης n'ụzọ ndị Igbo nkịtị ga-aghọta ozugbo.
