id: LUK.6.17
reference: Luke 6:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: ig
  text: Mgbe o so ha rịdata, o guzoro n’ebe dị larịị,[a] ya na oké ìgwè ndị na-eso ụzọ ya na nnukwu ìgwè ndị mmadụ sitere na Judia niile, Jerusalem, na n’ógbè dị n’akụkụ oké osimiri nke Taịa na Saịdọn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ala dị larịị.” Okwu Grik ahụ pụtara n’ụzọ nkịtị, “n’ebe dị larịị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς
  choice: Mgbe ya na ha rịdatara
  rationale: Nke a na-egosi na Jizọs so ha rịdata tupu ya eguzo, ma na-asụ ya n’ụzọ Igbo dị mfe ma dị ndụ.
- source_word: ἔστη
  choice: o guzoro
  rationale: Ọ bụ ntụgharị kwụ ọtọ nke omume iguzo n’ebe ahụ, dabara n’usoro akụkọ ahụ.
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: n’ebe dị larịị
  rationale: Nke a na-edobe echiche nke τόπος dị ka ‘ebe’ na πεδινός dị ka ‘dị larịị,’ n’ebughị ụzọ kpebie na ọ bụ nnukwu ndagwurugwu sara mbara.
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: oké ìgwè ndị na-eso ụzọ ya
  rationale: ‘Oké ìgwè’ na-egosi ọtụtụ mmadụ gbakọrọ ọnụ, ebe ‘ndị na-eso ụzọ ya’ na-akọwa ndị ìgwè ahụ bụ.
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: ọtụtụ igwe mmadụ
  rationale: Nke a na-ekwupụta nnukwu ọnụ ọgụgụ ndị ọzọ ma na-ekewapụ ha n’ìgwè ndị na-eso ụzọ.
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: si n’akụkụ niile nke Judia
  rationale: Nke a na-enye πάσης echiche zuru ezu ma na-ada nke ọma n’Igbo oge a.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Aha obodo a bụ nke a maara nke ọma n’Igbo Akwụkwọ Nsọ.
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: n’ógbè dị n’akụkụ oké osimiri nke Taịa na Saịdọn
  rationale: Nke a na-akọwapụta παράλιος dị ka ógbè dị n’akụkụ osimiri, jikọrọ ya na Taịa na Saịdọn n’enweghị nkọwa ọzọ a gbakwụnyere.
theological_decisions:
- issue: Okwu gbasara ọdịdị ala ebe Jizọs guzoro
  choice: n’ebe dị larịị
  alternative: n’ala dị larịị
  rationale: Nhọrọ a na-edobe kpọmkwem nghọta okwu Grik ma ghara ime ka ọ bụrụ nnukwu ala dị larịị, ma ọ bụ gbalịa ime ka akụkọ Luk kwekọọ n’ụzọ pụrụ iche na ọnọdụ ugwu dị na Matiu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ gaa n’ihu n’ihi na amaokwu a na-ejedebe na kọma n’isi mmalite Grik, na echiche ya na-aga n’ihu n’amaokwu na-esonụ.
