source:
  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: ig
  text: Ọ nọ na-agwa ha, “Nwa nke Mmadụ bụ Onyenwe Ụbọchị Izu Ike.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ọ nọkwa
  rationale: Akara njikọ -kwa na-ejikọta okwu a na akụkọ bu ya ụzọ n'ụzọ e ji asụ Igbo nke ọma, n'ebughị echiche oge ọzọ abụghị nke dị na Grik.
- source_word: ἔλεγεν
  choice: nọ na-agwa
  rationale: Ụdị imperfect na-egosi omume na-aga n'ihu n'oge akụkọ ahụ; “nọ na-agwa” na-echekwa akụkụ a n'Igbo dị mfe ma dị ugbu a.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha a bụ dative plural ma na-arụ ọrụ dị ka ndị a na-agwa okwu; “agwa ha” bụ usoro Igbo ebumpụta ụwa.
- source_word: Κύριος
  choice: Onyenwe
  rationale: “Onyenwe” na-egosipụta aha nsọpụrụ na ikike, ọ bụghị naanị okwu nkwanye ùgwù, ma kwekọọ n'ike Kraịst nke okwu a na-ekwupụta.
- source_word: τοῦ σαββάτου
  choice: Ụbọchị Izu Ike
  rationale: Nke a bụ okwu Igbo doro anya maka ụbọchị Sabbath dị ka ụbọchị na usoro e guzobere; njikọ ya na “Onyenwe” na-egosipụta ịbụ onye nwe ya na onye nwere ikike n'ebe ọ nọ.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa aha Jizọs ji akọwa onwe ya, ndabere Semitic ya, na njikọ o nwere ike inwe na Daniel 7, n'enweghị ịtụgharị ya nanị dịka mmadụ nkịtị.
theological_decisions:
- issue: Ike Kraịst nke okwu banyere Sabbath na-ekwupụta
  choice: “Nwa nke Mmadụ bụ Onyenwe Ụbọchị Izu Ike.”
  alternative: “Nwa nke Mmadụ bụ onye na-achị Ụbọchị Izu Ike.”
  rationale: “Onyenwe” na-echekwa ịdị mkpụmkpụ na ike nke Κύριος, tinyere ịdị arọ ya dịka aha Kraịst. A naghị etinye “ọbụna,” n'ihi na ọ dịghị kpọmkwem n'amaokwu Grik a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. A họọrọ “nọ na-agwa” iji chekwaa imperfect Grik, ebe “Ụbọchị Izu Ike” na-eme ka Sabbath doo ndị na-agụ akwụkwọ taa anya. Enweghị ihe e dere n'ala peeji n'ihi na ọdịiche “Onyenwe ...” na “onye na-achị ...” abụghị ihe mgbagwoju anya dị mkpa n'Igbo nke ga-achọ akara n'amaokwu.
