  to: 'O kwukwara ilu a nye ha, sị: “Onye ìsì ọ̀ nwere ike idu onye ìsì ibe ya? Ha abụọ ọ̀ gaghị adaba n’olulu?”[a]'
  rationale: The revision retains the draft’s accurate rendering while making the second rhetorical question more direct and natural in Standard Igbo. The footnote is narrowed to an alternative that does not introduce the unsupported idea of a water well.
