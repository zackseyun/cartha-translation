  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: ig
  text: 'O kwukwara ilu a nye ha, sị: “Onye ìsì ọ̀ nwere ike idu onye ìsì ibe ya? Ha abụọ ọ̀ gaghị adaba n’olulu?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “olulu” dịka “ọwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: kwukwara
  rationale: Mgbakwunye -kwara na-egosi echiche nke ‘ọzọkwa/also’ n'ụzọ Igbo na-ada nke ọma.
- source_word: παραβολὴν
  choice: ilu
  rationale: N'ebe a, okwu ahụ bụ ihe atụ e ji ezi ihe; ‘ilu’ bụ okwu Igbo doro ndị nkịtị anya ma dabara n'ụdị ajụjụ ihe atụ a.
- source_word: Μήτι δύναται
  choice: ò nwere ike
  rationale: Ụdị ajụjụ a na-atụ anya azịza na-adịghị mma, ma ọ naghị etinye azịza ahụ kpọmkwem n'ọnụ onye na-ekwu.
- source_word: τυφλὸς ... τυφλὸν
  choice: onye ìsì ... onye ìsì ibe ya
  rationale: ‘Onye ìsì’ bụ ụzọ Igbo nkịtị, na-anọpụ iche n'ihe gbasara nwoke ma ọ bụ nwaanyị, ma na-eburu ike nnọchianya nke ụdị Grik.
- source_word: ὁδηγεῖν
  choice: idu
  rationale: ‘Idu’ na-egosi iduzi mmadụ n'ụzọ ma kwekọọ n'onyonyo onye na-edu ibe ya.
- source_word: οὐχὶ ἀμφότεροι
  choice: Ọ̀ bụ na ha abụọ agaghị
  rationale: 'Nke a na-echekwa ajụjụ nkwupụta nke na-atụ anya azịza dị mma: ee, ha abụọ ga-adaba.'
- source_word: βόθυνον
  choice: olulu
  rationale: ‘Olulu’ nwere ike ịpụta oghere miri emi ma ọ bụ ebe e gwuru n'ala, ya mere ọ na-echekwa obosara nkọwa okwu Grik karịa ịhọrọ naanị ‘ọwa mmiri.’
- source_word: ἐμπεσοῦνται
  choice: adaba n’
  rationale: Ọdịnihu Grik na echiche ịbanye n'ime ihe pụtara nke ọma site na ‘agaghị adaba n’olulu.’
theological_decisions:
- issue: Ụdị nwoke nke τυφλός e ji anọchi mmadụ n'ozuzu
  choice: onye ìsì ... onye ìsì ibe ya
  alternative: nwoke ìsì ... nwoke ìsì
  rationale: Ọ bụ ezie na Grik ji ụdị ụtọasụsụ nwoke, ọ na-arụ ọrụ nnọchianya n'ilu a. Igbo ‘onye’ na-ebunye echiche izugbe ahụ n'enweghị ịgbakwunye na ọ bụ naanị nwoke ka a na-ekwu maka ya.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. E debere usoro ajụjụ abụọ na ike ilu ahụ; e jikwa akara ụda olu n'ebe ọ na-enyere ịmata ajụjụ na okwu ‘ìsì.’
