- from: Lee, a hapụrụ unu ụlọ unu[a][b]. Ma ana m agwa unu, unu agaghị ahụ m ma ọlị ruo mgbe oge ahụ ga-abịa, bú mgbe unu ga-asị[d], “Onye a gọziri agọzi ka onye na-abịa n’aha Onyenwe anyị bụ.”[c]
  to: Lee, a hapụrụ unu ụlọ unu[a][b]. Ma ana m agwa unu, unu agaghị ahụ m ma ọlị ruo mgbe oge ahụ ga-eru, mgbe unu ga-asị[d], “Ngọzi dịrị onye na-abịa n’aha Onyenwe anyị.”[c]
  rationale: The revision retains the source’s passive wording, emphatic “will certainly not,” and open-ended future condition. It replaces the malformed final clause with an idiomatic Igbo blessing formula, streamlines the time clause, and corrects the lexical footnote’s explanation of the passive’s possible judicial force.
