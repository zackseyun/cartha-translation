id: LUK.13.35
reference: Luke 13:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: ig
  text: Lee, a hapụrụ unu ụlọ unu[a][b]. Ma ana m agwa unu, unu agaghị ahụ m ma ọlị ruo mgbe oge ahụ ga-eru, mgbe unu ga-asị[d], “Ngọzi dịrị onye na-abịa n’aha Onyenwe anyị.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a gbahapụrụ” ma ọ bụ “a tọgbọla.” Olu nnara nke Grik nwere ike ibu echiche ikpe, ya bụ, na a gbahapụrụ ya.
    reason: lexical_alternative
  - marker: b
    text: “Ụlọ unu” nwere ike na-ezo aka na Jerusalem, karịsịa ụlọ nsọ ya; ma okwu Grik ahụ kwuru naanị “ụlọ unu.”
    reason: alternative_reading
  - marker: c
    text: Okwu ahụ, “Ngọzi dịrị onye na-abịa n’aha Onyenwe anyị,” na-ekwughachi Abụ Ọma 118:26.
    reason: cross_reference
  - marker: d
    text: Ụfọdụ na-aghọta nke a dịka ihe na-ezo aka na mbata Jizọs n’ụzọ mmeri na Jerusalem; ndị ọzọ na-ewere ya dịka nkweta ya n’ọdịnihu. Okwu Grik ahụ n’onwe ya anaghị ekpebi otu oge kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche n’ụzọ dị nsọ ma sie ike; “Lee” bụ okwu Igbo nke oge a, dịkwa mfe nghọta.
- source_word: ἀφίεται
  choice: a hapụrụ
  rationale: Nke a na-edobe olu nnara nke Grik ma ghara ikpebi ma ihe ọ pụtara kpọmkwem ọ̀ bụ ịgbahapụ kpamkpam, ịjụ, ma ọ bụ inyefe n’ikpe.
- source_word: ὁ οἶκος ὑμῶν
  choice: ụlọ unu
  rationale: Nke a sụgharịrị okwu Grik ahụ kpọmkwem n’ebughị ụzọ kọwaa ya dị ka ụlọ nsọ, Jerusalem, ma ọ bụ mba Izrel.
- source_word: οὐ μὴ ἴδητέ με
  choice: unu agaghị ahụ m ma ọlị
  rationale: “Ma ọlị” na-egosipụta nkwusi ike nke οὐ μή n’Igbo dị ndụ ma doo anya.
- source_word: ἕως ἥξει ὅτε
  choice: ruo mgbe oge ahụ ga-abịa, bú mgbe
  rationale: Nke a na-egosipụta echiche oge nke okwu Grik ahụ n’ụzọ Igbo na-aga were were.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Onye a gọziri agọzi ka onye na-abịa ... bụ
  rationale: Usoro a na-edobe ụdị nkwupụta ngọzi ahụ na ụda amaokwu Akwụkwọ Nsọ n’Igbo.
- source_word: ἐν ὀνόματι κυρίου
  choice: n’aha Onyenwe anyị
  rationale: Nke a na-edobe usoro okwu Akwụkwọ Nsọ a maara nke ọma, ma sụgharịa κύριος dị ka “Onyenwe anyị.”
theological_decisions:
- issue: Ihe “ụlọ unu” na-ezo aka na ya
  choice: E debere “ụlọ unu” n’ahịrị bụ isi n’akọwaghị ya kpọmkwem.
  alternative: Ụlọ nsọ, Jerusalem, ma ọ bụ ụlọ/agbụrụ Izrel
  rationale: Ọnọdụ okwu ahụ na-atụ aka na Jerusalem, karịsịa ụlọ nsọ ya, ma Grik kwuru naanị “ụlọ unu.” Ịkọwa ya karịa nke ahụ n’ahịrị bụ isi ga-emechi nghọta okwu ahụ n’ụzọ isi mmalite ahụ na-emeghị.
- issue: Oge mmezu nke nkwupụta ikpeazụ
  choice: E debere ya dịka ihe ga-eme n’ọdịnihu n’akọwaghị oge kpọmkwem.
  alternative: Mbata Jizọs n’ụzọ mmeri na Jerusalem, nkweta ya n’ọdịnihu, ma ọ bụ nkweta ya mgbe ọ ga-alọghachi
  rationale: Okwu Grik ahụ anaghị amanye otu n’ime nkọwa oge ndị a; ya mere ntụgharị ahụ na-edobe nghọta dị iche iche o nwere ike ibu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere okwu ndị nwere ike inwe ọtụtụ nghọta n’enweghị itinye nkọwa otu ụka ma ọ bụ usoro ihe gbasara ọgwụgwụ ụwa n’ahịrị bụ isi.
