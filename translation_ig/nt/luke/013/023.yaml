  text: εἶπεν δέ τις αὐτῷ· Κύριε, εἰ ὀλίγοι οἱ σῳζόμενοι; ὁ δὲ εἶπεν πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: ig
  text: Otu onye wee sị ya, “Onyenwe anyị,[a] ọ̀ bụ naanị mmadụ ole na ole ka a na-azọpụta?” O wee sị ha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta “Onyenwe anyị” ebe a dị ka okwu nkwanye ùgwù, dịka “Nna ukwu”; okwu Grik ahụ anaghị akọwapụta n'ụzọ zuru ezu ike aha ahụ nwere n’ebe a.
    reason: alternative_reading
lexical_decisions:
- source_word: δέ
  choice: wee
  rationale: Ọ bụ njikọ dị nro nke na-eme ka akụkọ gaa n'ihu; “wee” bụ ụzọ Igbo si ejikọta ihe omume n’akụkọ n’etinyeghị esemokwu na-adịghị na Grik.
- source_word: τις
  choice: otu onye
  rationale: Ọ na-ezo aka n’onye a na-akpọghị aha; “otu onye” bụ okwu Igbo doro anya ma dịkwa ndụ.
- source_word: αὐτῷ
  choice: ya
  rationale: E debere nnọchiaha dị na Grik n’etinyeghị aha Jizọs n’amaokwu a.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị a na-ejikarị maka κύριος, ma ọ ka na-enye ohere ka okwu ahụ bụrụ nkwanye ùgwù ma ọ bụ aha nwere ibu okwukwe.
- source_word: εἰ
  choice: ọ̀ bụ ... ka
  rationale: Usoro ajụjụ Igbo a na-egosi ajụjụ banyere ma ọnọdụ ahụ ọ̀ dị otú ahụ, n'ụzọ kwekọrọ n'ọrụ εἰ ebe a.
- source_word: ὀλίγοι
  choice: naanị mmadụ ole na ole
  rationale: “Ole na ole” na-egosi ọnụ ọgụgụ dị nta, ebe “naanị” na-egosipụta ike mmachi ajụjụ ahụ.
- source_word: οἱ σῳζόμενοι
  choice: a na-azọpụta
  rationale: Usoro a na-edobe olu nnabata na ọdịdị ihe na-aga n’ihu nke participle ugbu a, n’ejikọghị ya na otu ozizi nzọpụta kpọmkwem.
- source_word: πρὸς αὐτούς
  choice: sị ha
  rationale: “Ha” na-edobe nnọchiaha ọtụtụ dị na Grik ma hapụ ndị ọ na-ezo aka na ha dịka akụkụ gbara amaokwu ahụ gburugburu si kọwaa.
theological_decisions:
- issue: Ike κύριε dị ka okwu a kpọrọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu; Nna ukwu
  rationale: '“Onyenwe anyị” na-agbaso nsụgharị nkịtị nke κύριος ma na-ahapụ ogo okwu ahụ ka ọ ghe oghe: ọ pụrụ ịbụ nkwanye ùgwù ma ọ bụ nwee ibu Kraịst dị elu.'
- issue: Ọdịdị σῳζόμενοι
  choice: a na-azọpụta
  alternative: ndị a na-azọpụta; ndị a zọpụtara
  rationale: “A na-azọpụta” na-echekwa olu nnabata na echiche nke ọnọdụ ma ọ bụ omume na-aga n’ihu, na-enweghị ime ya ka ọ bụrụ naanị ihe e mechara eme.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. A họọrọ usoro akụkọ “wee sị” na ajụjụ “ọ̀ bụ ... ka” ka amaokwu ahụ daa ka Igbo ebumpụta ụwa. Akara ụkwụ [a] dị n’isiokwu ahụ ozugbo e kwuchara “Onyenwe anyị.”
