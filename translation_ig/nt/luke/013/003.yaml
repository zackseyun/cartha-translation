  source_fidelity: 'The translation accurately renders the Greek: “Mba” reflects οὐχί; “ana m agwa unu” naturally conveys λέγω ὑμῖν; “ọ bụrụ na unu echegharịghị” preserves the negative conditional ἐὰν μὴ μετανοῆτε; “unu niile” represents πάντες; and “ga-ala n’iyi” appropriately retains the deliberately broad warning of ἀπολεῖσθε. “Otu aka ahụ” is a defensible rendering of ὁμοίως and, with the note, does not require identical circumstances of death.'
  naturalness: The wording is clear, idiomatic Standard Igbo, and suitably solemn for Jesus’ warning. The sequence “Mba, ana m agwa unu; kama, ọ bụrụ na…” is natural and maintains the contrast and urgency of the source.
  terminology: “Echegharị” is a well-established Christian Igbo term for repentance and carries more than merely intellectual reconsideration. “Ịla n’iyi” preserves the semantic breadth of perishing/ruin without imposing a specific doctrinal outcome. The footnote is relevant and naturally expressed.
