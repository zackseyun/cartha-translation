  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: ig
  text: Mba, ana m agwa unu; kama, ọ bụrụ na unu echegharịghị, unu niile ga-ala n’iyi otu aka ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’otu ụzọ ahụ.” Okwu a sụgharịrị “otu aka ahụ” nwere ike izo aka n’ikpe mberede yiri nke ahụ, ọ bụghị na ha ga-anwụ kpọmkwem n’otu ụdị ụzọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Mba
  rationale: Ọ bụ ọjụjụ siri ike nye echiche e zoro aka na ya n’amaokwu ndị bu ụzọ; “Mba” bụ ụzọ doro anya ma dịkwa eke e si kwuo ya n’Igbo.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a na-edobe okwu Jizọs dị ka okwu ọ na-agwa ndị na-ege ya ntị ozugbo, n’ụzọ Igbo nke oge a si ekwu ya.
- source_word: ἀλλ’
  choice: kama
  rationale: “Kama” na-egosi ntụgharị megide echiche a jụrụ ajụ ma na-eduga n’ịdọ aka ná ntị sochirinụ.
- source_word: ἐὰν μὴ
  choice: ọ bụrụ na ... -ghị
  rationale: Usoro ọnọdụ a na-enye n’Igbo ihe “unless/if not” pụtara n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: μετανοῆτε
  choice: unu echegharịghị
  rationale: Ngwaa “ichegharị” n’Igbo na-egosi mgbanwe nke uche na ụzọ ndụ n’ihu Chineke, ọ bụghị naanị ịtụgharị uche n’otu echiche nkịtị.
- source_word: πάντες
  choice: unu niile
  rationale: Nke a na-echekwa nrụgide dị n’okwu Grik na ịdọ aka ná ntị ahụ metụtara onye ọ bụla n’ime ndị na-ege ntị.
- source_word: ὁμοίως
  choice: otu aka ahụ
  rationale: Ọ na-echekwa ntụnyere ya na ihe ndị a kọrọ n’amaokwu ndị bu ụzọ, ma ọ naghị amanye echiche na ụdị ọnwụ ahụ ga-abụ kpọmkwem otu.
- source_word: ἀπολεῖσθε
  choice: ga-ala n’iyi
  rationale: “Ịla n’iyi” na-ejigide echiche nke ịdakwasị mbibi ma ọ bụ ikpe, n’emeghị ka ọ bụrụ naanị ọnwụ anụ ahụ ma ọ bụ kọwaa kpọmkwem njedebe ebighị ebi.
theological_decisions:
- issue: Oke ihe ἀπολεῖσθε pụtara n’ịdọ aka ná ntị Jizọs
  choice: ga-ala n’iyi
  alternative: ga-anwụ; a ga-ebibi unu; a ga-ama unu ikpe ebighị ebi
  rationale: Okwu Grik ahụ na-adọ aka ná ntị banyere mbibi ma ọ bụ ikpe nke na-abịa n’ihi enweghị nchegharị, ma n’ebe a ọ kọwaghị kpọmkwem ụdị ma ọ bụ oke mbibi ahụ. “Ga-ala n’iyi” na-echekwa esemokwu nkà mmụta okpukpe ahụ n’emeghị ka ihe ederede ahụ kwuru sie ike karịa ka ọ dị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ichegharị” bụ okwu ndị nkịtị maara nke na-eburu ibu omume na nke ime mmụọ nke μετανοέω; “ịla n’iyi” na-echekwa obosara nke ἀπόλλυμι.
