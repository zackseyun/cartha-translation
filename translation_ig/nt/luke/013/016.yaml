id: LUK.13.16
reference: Luke 13:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: ig
  text: Ma nwaanyị a, ebe ọ bụ ada Abraham, onye Setan ji agbụ kee—lee, afọ iri na asatọ—ò kwesịghị ka a tọpụ ya n’agbụ a n’ụbọchị izu ike?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: ada Abraham
  rationale: Nke a na-edobe okwu ezinụlọ dị n’asụsụ Grik, nke na-egosi na nwaanyị ahụ so n’ụmụ Abraham.
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: ji agbụ kee / tọpụ / agbụ
  rationale: E ji otu ihe oyiyi nke ikekọta na ịtọpụ mee ihe n’ebe atọ ahụ, dịka isi mmalite si mee.
- source_word: ἰδού
  choice: lee
  rationale: A hapụrụ okwu ahụ pụtara ìhè dịka mkpali ka onye na-ege ntị tụlee ogologo oge ahụ.
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: n’ụbọchị izu ike
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ụbọchị Sabbath.
theological_decisions:
- issue: Ihe ‘ada Abraham’ pụtara
  choice: E debere ya dịka ‘ada Abraham’ n’enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya dịka naanị onye Juu ma ọ bụ dịka onye nwere okwukwe Abraham.
  rationale: Isi mmalite anaghị ekpebi n’amaokwu a ma okwu ahụ na-emesi agbụrụ, ọgbụgba ndụ, okwukwe, ma ọ bụ ha niile ike; nsụgharị ekwesịghị idozi mgbagwoju ahụ n’onwe ya.
- issue: Njikọ Setan na ọrịa nwaanyị ahụ
  choice: ‘onye Setan ji agbụ kee’
  alternative: Ịsị na Setan nyere ya ọrịa ahụ kpọmkwem.
  rationale: A na-edobe ihe Jizọs kwuru banyere ikekọta ya, na-agbakwụnyeghị nkọwa banyere ụzọ ma ọ bụ ihe kpatara ọnọdụ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ajụjụ ‘ò kwesịghị...?’ na-edobe ike ajụjụ nkwupụta dị n’asụsụ Grik; akara ogologo na-ekewapụ ‘lee, afọ iri na asatọ’ dịka mkpali pụrụ iche.
