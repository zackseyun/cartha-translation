  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: ig
  text: Ọ dị ka ihe na-eko achịcha[a], nke otu nwanyị weere zoo[c] n’ime ọ̀tụ̀tụ̀ ntụ ọka atọ[b], ruo mgbe ntụ ọka ahụ dum koro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “yist.” Okwu Grik a pụtara ihe e ji eme ka ntụ ọka koo.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “sata atọ,” ya bụ ihe dị ka sea atọ, bụ nnukwu ọnụọgụ ntụ ọka.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsị, “gwakọta n’ime ya.” Ma ngwaa Grik ahụ pụtara n’ụzọ nkịtị “zoo” ma ọ bụ “kpuchie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία
  choice: Ọ dị ka
  rationale: Ọ bụ ụzọ Igbo si ekwu ntụnyere n’ụzọ doro anya ma kwekọọ na adjective predicate nke Grik.
- source_word: ζύμῃ
  choice: ihe e ji eko achịcha
  rationale: Nke a na-akọwa ihe na-eme ka ntụ ọka koo n’asụsụ Igbo nke oge a, ma ghara ime ka onye na-agụ ya chee nanị banyere yist a na-ere n’oge ugbu a.
- source_word: λαβοῦσα
  choice: weere
  rationale: A sụgharịrị aorist participle ahụ dị ka omume mbụ n’usoro omume, nke bụ ụzọ ebumpụta ụwa n’Igbo.
- source_word: γυνὴ
  choice: otu nwanyị
  rationale: N’ilu a, okwu ahụ na-ezo aka n’otu nwanyị a na-akọwaghị onye ọ bụ.
- source_word: ἔκρυψεν
  choice: zoo
  rationale: Nke a na-edobe isi ihe ngwaa Grik ahụ pụtara, ya bụ ‘zoo’ ma ọ bụ ‘kpuchie,’ kama ịgbanwe ya ozugbo ka ọ bụrụ ‘gwakọta.’
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: n’ime ọ̀tụ̀tụ̀ ntụ ọka atọ
  rationale: Nke a na-eme ka okwu ahụ bụrụ ihe onye Igbo oge a ga-aghọta, ebe nkọwa ala peeji na-echekwa aha ọ̀tụ̀tụ̀ oge ochie ahụ.
- source_word: ἕως οὗ
  choice: ruo mgbe
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị mkpirikpi isi gosipụta njikọ oge ahụ.
- source_word: ἐζυμώθη ὅλον
  choice: ruo mgbe ihe ahụ dum koro
  rationale: Nke a na-echekwa echiche passive na nke zuru ezu—ihe niile e tinyere ọnụ bịara koo—n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
theological_decisions:
- issue: Ihe iko achịcha ahụ na-anọchi anya ya n’ilu a
  choice: E debere ihe oyiyi ahụ n’ụzọ na-adịghị ekpebi ma ọ bụ ihe ọma ma ọ bụ ihe ọjọọ.
  alternative: Ịkọwa ya kpọmkwem dị ka akara ihe ọjọọ, ma ọ bụ dị ka akara mgbasa nke alaeze Chineke.
  rationale: Amaokwu ahụ n’onwe ya na-enye ntụnyere ahụ ma ọ naghị akọwa ihe iko achịcha ahụ n’ụzọ ga-emechi esemokwu nkọwa; ntụgharị ekwesịghị itinye ozizi ọzọ n’ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ihe e ji eko achịcha” kama okwu mbịara “yist” n’isi amaokwu, ma debe “zoo” iji chekwaa ihe oyiyi Grik ahụ. E debere akara nkọwa ala peeji niile n’ebe okwu ha metụtara dị.
