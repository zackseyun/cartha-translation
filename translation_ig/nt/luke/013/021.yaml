review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the comparison, the woman’s taking and concealing of the leaven, the three sata of flour, and the eventual leavening of the entire amount. “Ihe e ji eko achịcha” is understandable, but “ihe na-eko achịcha” more directly identifies ζύμη as leaven. The final clause should identify the flour/dough mixture rather than the vague “ihe ahụ.”
  naturalness: 'The proposed revision is more idiomatic Standard Igbo: “ihe na-eko achịcha” is a familiar, clear expression, and “ruo mgbe ntụ ọka ahụ dum koro” gives the final clause a natural and explicit referent.'
  terminology: “Ihe na-eko achịcha” preserves the biblical image of leaven without imposing an interpretation. “Sata” is retained in the cultural footnote, while “ọ̀tụ̀tụ̀ ntụ ọka atọ” remains accessible in the text. The note’s description of the quantity is revised to remove the unnatural repetition “nnukwu ntụ ọka dị ukwuu.”
  issues:
  - severity: low
    issue: The expression for leaven is somewhat periphrastic.
    rationale: “Ihe e ji eko achịcha” can be understood as any implement or ingredient used in making bread; “ihe na-eko achịcha” more specifically conveys a leavening agent.
  - severity: medium
    issue: The final referent is vague and the wording is less natural.
    rationale: “Ihe ahụ dum koro” does not clearly specify that the whole mass of flour/dough was leavened. “Ntụ ọka ahụ dum koro” preserves the Greek totalizing sense with a clear Igbo referent.
  - severity: low
    issue: Footnote b has redundant and unnatural wording.
    rationale: “Nnukwu ntụ ọka dị ukwuu” is not an idiomatic way to say that three sata is a large quantity of flour.
