  to: Mgbe onye nwe ụlọ biliri ma mechie ọnụ ụzọ[a], unu amalite iguzo n’èzí na-akụ aka n’ọnụ ụzọ, na-asị, ‘Onyenwe anyị[b], megheere anyị ọnụ ụzọ,’ ọ ga-aza unu sị, ‘Amaghị m unu, ebe unu si[c].’
  rationale: E dochiri «ụzọ» anya na «ọnụ ụzọ» iji sụgharị θύρα kpọmkwem n’ebe ọ bụla ọ pụtara. E wepụrụ «kwa» ka a ghara itinye echiche na-adịghị n’ederede Grik. E debere okwu ikpeazụ ahụ n’usoro ya nke na-echekwa «unu» na «ebe unu si», ma e wepụrụ nkọwa ala peeji nke gafere nkwupụta ederede ahụ.
