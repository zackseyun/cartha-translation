  verdict: revise
  source_fidelity: Ntụtụgharị ahụ na-esochi usoro na isi okwu Grik nke ọma n’ozuzu ya, gụnyere okwu ikpeazụ nke nwere ma «unu» ma «ebe unu si». Otú ọ dị, «ụzọ» naanị ya na-ezighị kpọmkwem θύρα, nke bụ ọnụ ụzọ; n’ebe a ọ pụkwara ịpụta ụzọ a na-aga. «kwa» n’«amalitekwa» na-atụnye echiche “ọzọ/kwakwa” nke ederede Grik anaghị ekwu.
  naturalness: «Ọnụ ụzọ» na «ịkụ aka n’ọnụ ụzọ» doro anya ma bụrụ Igbo Ọkọlọtọ ebumpụta ụwa karịa «ụzọ» n’ọnọdụ a. Iwepu «kwa» na-eme njikọ ahịrịokwu ahụ ka ọ dị mfe ma na-enweghị mgbakwunye echiche.
  terminology: «Onyenwe anyị» bụ aha nsọpụrụ a maara nke ọma n’Igbo maka κύριε, ma nkọwa ala peeji kwesịrị ịkọwa na n’ihe atụ a ọ nwekwara ike ịdị ka adreesị nye nna ukwu/onye nwe ụlọ. Nkọwa ala peeji c nke na-ekwu na ọ “anaghị anabata ha dịka ndị nke ya” na-agafe ihe okwu Grik ahụ kwuru; a ga-edobe ya dịka nkọwa okwu naanị.
