id: LUK.13.25
reference: Luke 13:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: ig
  text: Mgbe onye nwe ụlọ biliri ma mechie ọnụ ụzọ[a], unu amalite iguzo n’èzí na-akụ aka n’ọnụ ụzọ, na-asị, ‘Onyenwe anyị[b], megheere anyị ọnụ ụzọ,’ ọ ga-aza unu sị, ‘Amaghị m unu, ebe unu si[c].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n’ụzọ ka nso n’usoro Grik: “Mgbe onye nwe ụlọ biliri ma mechie ọnụ ụzọ.”'
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik bụ κύριε, nke a na-asụgharịkarị “Onyenwe anyị”; n’ihe atụ a, a pụkwara ịghọta ya dịka “Nna ukwu” ma ọ bụ adreesị nkwanye ùgwù.
    reason: alternative_reading
  - marker: c
    text: 'N’usoro Grik dị nso karị: “Amaghị m unu, ebe unu si.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: Mgbe
  rationale: Nkebiokwu a na-ewebata oge ihe ga-eme n’amaghị kpọmkwem mgbe; “Mgbe” bụ ụzọ Igbo dị mfe ma kwekọọ n’usoro okwu ahụ.
- source_word: ἐγερθῇ
  choice: biliri
  rationale: N’ebe a ọ pụtara isi n’ọnọdụ ịnọdụ ala ma ọ bụ izu ike bilie, ọ bụghị mbilite n’ọnwụ.
- source_word: ὁ οἰκοδεσπότης
  choice: onye nwe ụlọ
  rationale: Ọ na-egosi onye isi ma na-achị ụlọ ahụ; okwu a bụ nke ndị Igbo taa na-aghọta nke ọma.
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: mechie ụzọ
  rationale: Ọ na-egosi imechi ọnụ ụzọ nke mere ka ndị nọ n’èzí ghara ịbanye; “mechie ụzọ” bụ asụsụ Igbo ebumpụta ụwa.
- source_word: ἔξω ἑστάναι
  choice: iguzo n’èzí
  rationale: Nke a na-echekwa ọnọdụ ha nke ịnọ n’èzí ka ha guzo.
- source_word: κρούειν τὴν θύραν
  choice: na-akụ aka n’ụzọ
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị ekwu ịkụ aka n’ọnụ ụzọ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ na-echekwa nsụgharị ọdịnala na ụda nkà mmụta okpukpe nke κύριος, ebe ihe atụ a nwekwara ike ikwe ka a ghọta ya dịka nkwanye ùgwù nye onye nwe ụlọ.
- source_word: ἄνοιξον ἡμῖν
  choice: meghere anyị ụzọ
  rationale: N’Igbo, ịsị “meghere anyị ụzọ” na-eme ka arịrịọ imeghe ọnụ ụzọ doo anya ma dịkwa ebumpụta ụwa.
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: ọ ga-aza unu sị
  rationale: Nke a na-enye participle na ngwaa ahụ n’usoro Igbo dị mma n’enweghị iwepụ echiche nke ịza ha.
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Amaghị m unu, ebe unu si
  rationale: A hapụrụ ma “unu” ma “ebe unu si” dịka ha dị na Grik, iji chekwaa nkwuwa okwu na ntakịrị ihe mgbagwoju anya dị n’ahịrịokwu mbụ.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu a dị n’ihe atụ
  choice: Onyenwe anyị
  alternative: Nna ukwu; Nwoke ọma
  rationale: “Onyenwe anyị” na-echekwa uru okwu κύριος na ụda ya n’Oziọma Luk, ma ihe odide a n’onwe ya ka na-enye ohere ịghọta ya dịka okwu nkwanye ùgwù nye onye nwe ụlọ.
- issue: Ike okwu οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: Amaghị m unu, ebe unu si
  alternative: Amaghị m ebe unu si
  rationale: Nsụgharị a na-echekwa nnọchiaha kpọmkwem “unu” na nkebiokwu gbasara ebe ha si, kama ime ka ha bụrụ naanị otu echiche ma si otú ahụ dozie mgbagwoju anya Grik ahụ nwayọọ nwayọọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E ji “onye nwe ụlọ,” “iguzo n’èzí,” na “na-akụ aka n’ụzọ” mee ka okwu ahụ bụrụ nke ndị Igbo taa na-anụ nke ọma, ebe e chekwara usoro na esemokwu dị na Grik n’okwu ikpeazụ.
