  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: ig
  text: O wee bikwasị ya aka abụọ; ozugbo ahụ, o guzoro ọtọ[a], wee na-enye Chineke otuto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e mere ka o guzozie ọtọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: O wee bikwasị ya aka ya abụọ
  rationale: Nke a na-asụgharị okwu Grik maka ibikwasị mmadụ aka n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ nke ọma; ‘aka ya abụọ’ na-egosi na τὰς χεῖρας bụ aka Jizọs.
- source_word: παραχρῆμα
  choice: ozugbo ahụ
  rationale: Ọ na-egosi na ihe ahụ mere n’otu ntabi anya, n’enweghị oge gafere.
- source_word: ἀνωρθώθη
  choice: nwanyị ahụ guzoro ọtọ
  rationale: N’ọnọdụ akụkọ a, ngwaa ahụ na-egosi na nwanyị ahụ e hulatara hulata bịara kwụrụ ọtọ. Nhọrọ a bụ Igbo eke, ma ndetu ala na-edobe ụzọ ọzọ e si pụrụ ịghọta ụdị nnara ahụ.
- source_word: ἐδόξαζεν τὸν θεόν
  choice: na-enye Chineke otuto
  rationale: Ụdị ‘na-enye’ na-egosipụta omume na-aga n’ihu nke imperfect ἐδόξαζεν, ebe ‘inye Chineke otuto’ na-echekwa ibu okwu δοξάζω nwere.
theological_decisions:
- issue: Nsonaazụ ọgwụgwọ nke ἀνωρθώθη kọwara
  choice: nwanyị ahụ guzoro ọtọ
  alternative: e mere ka o guzozie ọtọ; a gbatịziri ya
  rationale: Akụkụ gbara amaokwu a gburugburu na-ekwu maka nwanyị a hulatara hulata nke na-enweghị ike iguzozi onwe ya. Nsụgharị a na-egosi mgbake anụ ahụ ahụ n’enweghị ịgbakwụnye nkọwa banyere otú ọgwụgwọ ahụ si rụọ ọrụ; ndetu ala na-echekwakwa ọdịdị nnara nke Grik.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘nwanyị ahụ’ mee ka onye a na-ekwu maka ya doo anya, ebe usoro ‘na-enye Chineke otuto’ na-egosipụta omume na-aga n’ihu.
