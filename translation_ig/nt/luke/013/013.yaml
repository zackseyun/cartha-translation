  to: O wee bikwasị ya aka abụọ; ozugbo ahụ, o guzoro ọtọ[a], wee na-enye Chineke otuto.
  rationale: The revision improves idiomatic Standard Igbo, retains the immediate physical restoration described in the narrative, and provides a concise footnote that preserves the passive nuance of ἀνωρθώθη. It neither adds “again” nor specifies a healing mechanism beyond the source text.
