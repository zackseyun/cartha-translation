id: LUK.13.32
reference: Luke 13:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: ig
  text: Ọ gwara ha, sị, “Gaanụ gwa nkịta ọhịa ahụ, sị, ‘Lee, ana m achụpụ ndị mmụọ ọjọọ, na-agwọkwa ndị ọrịa taa na echi; n’ụbọchị nke atọ, a ga-eme ka m zuo oke.’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “m ga-eru ihe mgbaru ọsọ m,” “a ga-eme ka m ruo na mmezu,” ma ọ bụ, “m ga-emecha njem ọrụ m.” Okwu Grik ahụ nwere ike ịpụta iru mmezu ma ọ bụ imecha ihe; o yikarịrị ka ọ na-ekwu maka mmezu nke ozi e nyere Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλώπεκι
  choice: nkịta ọhịa
  rationale: Nke a bụ aha anụmanụ ‘fox’ n’Igbo. Ịhapụ ya dịka ihe atụ, kama ịkọwa ya ozugbo dị ka onye aghụghọ, na-echekwa ụda nlelị na nghọta sara mbara nke okwu Grik ahụ.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo doro anya nke na-adọta uche n’ihe na-esote, n’enweghị ụda ochie ma ọ bụ nkọwa agbakwunyere.
- source_word: ἐκβάλλω δαιμόνια
  choice: ana m achụpụ ndị mmụọ ọjọọ
  rationale: ‘Ịchụpụ ndị mmụọ ọjọọ’ bụ ụzọ Igbo ebumpụta ụwa si kwuo ịchụ mmụọ ọjọọ, ma na-echekwa ike nke ἐκβάλλω.
- source_word: ἰάσεις ἀποτελῶ
  choice: na-eme ka ndị ọrịa dịrị mma
  rationale: Nkebi a na-egosi ime ka ọgwụgwọ pụta ihe. Nsụgharị a bụ Igbo dị mfe ma dị ndụ, ma na-ekewapụ ọrụ ọgwụgwọ a na ‘ịchụpụ’ nke dị n’ihu ya.
- source_word: σήμερον καὶ αὔριον
  choice: taa na echi
  rationale: Ọ na-echekwa usoro oge nke Grik n’ụzọ Igbo nkịtị, ma hapụkwa ohere ka e were ya dị ka ụbọchị kpọmkwem ma ọ bụ obere oge a kara aka.
- source_word: τῇ τρίτῃ
  choice: n’ụbọchị nke atọ
  rationale: Nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa isi gosipụta dative temporal nke ordinal ahụ.
- source_word: τελειοῦμαι
  choice: a ga-eme ka m ruo n’isi njedebe
  rationale: Nhọrọ a na-echekwa ọdịdị passive na echiche nke iru mmezu, n’akọwaghị ya kpọmkwem dịka mbilite n’ọnwụ, izu oke n’omume, ma ọ bụ naanị ịkwụsị ọrụ.
theological_decisions:
- issue: Ihe τελειοῦμαι pụtara gbasara mmezu ozi Jizọs na o kwe omume na ọ na-atụ aka n’ọnwụ ya na mbilite n’ọnwụ ya
  choice: a ga-eme ka m ruo n’isi njedebe
  alternative: m ga-eru ihe mgbaru ọsọ m; a ga-eme ka m zuo oke; m ga-emecha njem ọrụ m
  rationale: Okwu Grik ahụ nwere ike ịpụta iru mmezu, ịbụ onye e mere ka o zuo oke, ma ọ bụ imecha ụzọ e kenyere mmadụ. Isi okwu a ekwughị mbilite n’ọnwụ kpọmkwem; ya mere, nsụgharị ahụ na-echekwa obosara na esemokwu nkà mmụta okpukpe dị na ya kama idozi ya n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Nkịta ọhịa ahụ’ na-echekwa ihe atụ na ụda nlelị; ‘a ga-eme ka m ruo n’isi njedebe’ na-echekwa passive na mgbagwoju anya nke τελειοῦμαι. E tinyere akara nkọwa ala ala [a] n’isiokwu ahụ dịka achọrọ.
