- from: Ọ gwara ha, sị, “Gaanụ gwa nkịta ọhịa ahụ, sị, ‘Lee, ana m achụpụ ndị mmụọ ọjọọ ma na-eme ka ndị ọrịa dịrị mma taa na echi; n’ụbọchị nke atọkwa, a ga-eme ka m ruo n’isi njedebe.’[a]”
  to: Ọ gwara ha, sị, “Gaanụ gwa nkịta ọhịa ahụ, sị, ‘Lee, ana m achụpụ ndị mmụọ ọjọọ, na-agwọkwa ndị ọrịa taa na echi; n’ụbọchị nke atọ, a ga-eme ka m zuo oke.’[a]”
