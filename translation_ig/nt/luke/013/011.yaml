id: LUK.13.11
reference: Luke 13:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: ig
  text: Lee, e nwere otu nwanyị nke nwere mmụọ nke adịghị ike[a] kemgbe afọ iri na asatọ. Azụ ya hulatara, ọ nweghịkwa ike ikwụrụ ọtọ kpamkpam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “mmụọ na-eme ka ọ ghara ịdị ike” ma ọ bụ “mmụọ ọrịa.” Grik kwuru “mmụọ” kpọmkwem, nke nwere ike igosi na e nwere ọrụ mmụọ n’ahụhụ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo dị ndụ nke na-adọta uche onye na-agụ ma na-echekwa ịdị ngwa na ịdị vivid nke akụkọ ahụ.
- source_word: γυνὴ
  choice: otu nwanyị
  rationale: Ọ na-ewebata nwanyị a na-akọwabeghị na mbụ; “otu” na-arụ ọrụ nke indefinite reference n’Igbo n’enweghị ime ka ọ bụrụ ọnụ ọgụgụ a na-emesi ike.
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: nwere mmụọ adịghị ike
  rationale: Nke a na-edobe okwu “mmụọ” nke Grik kwuru kpọmkwem na njikọ ya na “adịghị ike,” ma zere ikwubi na amaokwu a kpọrọ ya mmụọ ọjọọ kpọmkwem ma ọ bụ naanị ọrịa anụ ahụ.
- source_word: ἀσθενείας
  choice: adịghị ike
  rationale: “Adịghị ike” na-ekpuchi echiche sara mbara nke ike ọgwụgwụ, nkwarụ, ma ọ bụ ọrịa, n’enweghị imechi ihe ọ pụtara n’otu ụdị ọrịa.
- source_word: ἔτη δεκαοκτώ
  choice: kemgbe afọ iri na asatọ
  rationale: “Kemgbe” na-egosi oge ọnọdụ ahụ gara n’ihu ruo mgbe akụkọ a na-eme, n’ụzọ dabara n’Igbo nkịtị.
- source_word: συγκύπτουσα
  choice: na-ehulata ehulata
  rationale: Okwu a na-egosi na ahụ ya gbadara ma hulata; nkwughachi ahụ na-enye echiche nke ọnọdụ na-adịgide adịgide n’Igbo.
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: ọ nweghịkwa ike ịgbatị onwe ya ọtọ
  rationale: Nke a na-egosi enweghị ike isi n’ọnọdụ hulatara bilie ma kwụrụ ọtọ, na-enweghị ịgbakwunye nkọwa ahụike na-adịghị na Grik.
- source_word: εἰς τὸ παντελές
  choice: kpamkpam
  rationale: “Kpamkpam” na-echekwa ike okwu ahụ nke na-egosi na ọ pụghị ịgbatị onwe ya ruo n’ókè zuru ezu.
theological_decisions:
- issue: Ma a ga-ewepụ ma ọ bụ belata ihe πνεῦμα na-egosi banyere ọrụ mmụọ n’ahụhụ nwanyị ahụ
  choice: Idobe “mmụọ adịghị ike” n’ahịrịokwu bụ isi
  alternative: “mmụọ na-eme ka ọ ghara ịdị ike” ma ọ bụ ịsị naanị “ọrịa/nkwarụ”
  rationale: Grik kpọrọ πνεῦμα, ya mere e kwesịghị ime ka ọnọdụ ahụ bụrụ naanị nkọwa ahụike. Ma njikọ genitive ahụ akọwaghị kpọmkwem ụdị mmụọ ahụ ma ọ bụ usoro o si akpata ọnọdụ ahụ; nsụgharị ahụ na-edobe mgbagwoju anya ahụ.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị mfe ma dị ùgwù. “Lee” na-eme ka akụkọ ahụ dị ndụ; “na-ehulata ehulata” bụ okwu nkịtị na-aghọta ngwa ngwa, ebe “mmụọ adịghị ike” na-edobe okwu na esemokwu dị na isi mmalite.
