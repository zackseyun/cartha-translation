- from: Lee, e nwere otu nwanyị nwere mmụọ adịghị ike[a] kemgbe afọ iri na asatọ. Ọ na-ehulata ehulata, ọ nweghịkwa ike ịgbatị onwe ya ọtọ kpamkpam.
  to: Lee, e nwere otu nwanyị nke nwere mmụọ nke adịghị ike[a] kemgbe afọ iri na asatọ. Azụ ya hulatara, ọ nweghịkwa ike ikwụrụ ọtọ kpamkpam.
  rationale: The revision corrects the posture wording so that it denotes an enduring stooped condition rather than repeated bending. It also uses the natural Igbo genitive construction for “spirit of weakness,” while retaining all source-level ambiguity concerning the nature of the spirit.
