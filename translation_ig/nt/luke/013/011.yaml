review_pass:
  verdict: revise
  source_fidelity: The draft preserves the explicit reference to a spirit, the eighteen-year duration, and the woman's inability to become fully upright. However, “na-ehulata ehulata” ordinarily suggests repeated bending or bowing rather than the continuing physical state expressed by συγκύπτουσα (“being bent over/stooped”).
  naturalness: “Lee” and the overall sentence are clear Standard Igbo. Replacing the reduplicated verbal expression with a description of her bent back is more idiomatic and accurately depicts a persistent posture. “Mmụọ nke adịghị ike” also makes the Greek genitive relationship more natural in Igbo than the bare juxtaposition “mmụọ adịghị ike.”
  terminology: “Mmụọ nke adịghị ike” retains πνεῦμα and the broad sense of ἀσθένεια without identifying the spirit as evil or reducing the affliction to a medical diagnosis. “Ikwụrụ ọtọ kpamkpam” naturally conveys ἀνακύψαι εἰς τὸ παντελές in this bodily context.
  issues:
  - severity: medium
    issue: “na-ehulata ehulata” can imply repeated acts of bending.
    rationale: The Greek describes her as being in a stooped condition, not as repeatedly bending over. A state-description better preserves the aspect and physical sense.
  - severity: low
    issue: “mmụọ adịghị ike” is compressed and less natural as a genitive construction in Standard Igbo.
    rationale: “Mmụọ nke adịghị ike” more transparently retains “a spirit of weakness/infirmity” while preserving the source ambiguity.
  revised_text: Lee, e nwere otu nwanyị nke nwere mmụọ nke adịghị ike[a] kemgbe afọ iri na asatọ. Azụ ya hulatara, ọ nweghịkwa ike ikwụrụ ọtọ kpamkpam.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “mmụọ na-eme ka ọ ghara ịdị ike” ma ọ bụ “mmụọ ọrịa.” Grik kwuru “mmụọ” kpọmkwem, nke nwere ike igosi na e nwere ọrụ mmụọ n’ahụhụ ya.
    reason: lexical_alternative
  revision_rationale: The revision corrects the posture wording so that it denotes an enduring stooped condition rather than repeated bending. It also uses the natural Igbo genitive construction for “spirit of weakness,” while retaining all source-level ambiguity concerning the nature of the spirit.
