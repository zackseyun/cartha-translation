id: LUK.13.14
reference: Luke 13:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: ig
  text: Ma onyeisi ụlọ nzukọ zara, ebe iwe were ya n’ihi na Jizọs gwọrọ n’ụbọchị Sabat. Ọ sịrị ìgwè mmadụ ahụ, “E nwere ụbọchị isii nke e kwesịrị ịrụ ọrụ n’ime ha; ya mere, bịanụ n’ụbọchị ndị ahụ ka a gwọọ unu, ọ bụghị n’ụbọchị Sabat.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ okwu ya n’ụzọ dị nso n’usoro Grik: “E nwere ụbọchị isii nke ọ dị mkpa ịrụ ọrụ n’ime ha; ya mere, bịanụ n’ụbọchị ndị ahụ ka a gwọọ unu, ọ bụghị n’ụbọchị Sabat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Ma ... zara okwu
  rationale: ‘Ma’ na-egosi ntakịrị ntụgharị megide ọgwụgwọ ahụ e mere tupu nke a; ‘zara okwu’ na-egosikwa ọrụ ἀποκρίνομαι n’ịmalite nzaghachi, ọ bụ ezie na a kpọghị ajụjụ kpọmkwem.
- source_word: ἀρχισυνάγωγος
  choice: onyeisi ụlọ nzukọ ndị Juu
  rationale: Nke a na-akọwa onye na-elekọta ihe gbasara ụlọ nzukọ ndị Juu n’asụsụ Igbo doro anya, n’enweghị ime ka ọ bụrụ onye ọchịchị obodo.
- source_word: ἀγανακτῶν
  choice: iwe ju ya obi
  rationale: Nkebiokwu a na-egosi iwe siri ike na enweghị afọ ojuju nke onyeisi ahụ, ma ọ naghị agbakwụnye nkọwa banyere ihe ziri ezi ma ọ bụ ihe ọjọọ.
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: n’ihi na Jizọs gwọrọ mmadụ n’ụbọchị izuike
  rationale: ‘N’ihi na’ na-edobe ὅτι dị ka ihe kpatara iwe ya. ‘Ụbọchị izuike’ bụ okwu Igbo doro anya maka Sabat; ‘mmadụ’ na-eme ka ngwaa ọgwụgwọ zuo oke n’Igbo n’enweghị ịkọwapụta onye ahụ karịa ihe amaokwu ahụ kwuru.
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: Ọ sịrị ìgwè mmadụ ahụ
  rationale: Ọ bụ nsụgharị Igbo dị ndụ ma dị mfe maka okwu ọ gwara ndị gbakọrọ. Ọnọdụ a anaghị achọ ka imperfect ahụ bụrụ okwu e kwuru ugboro ugboro.
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: E nwere ụbọchị isii a ga-eji rụọ ọrụ
  rationale: ‘A ga-eji’ na-eburu echiche mkpa ma ọ bụ iwu dị na δεῖ, ma na-anọgide bụrụ Igbo eke karịa nsụgharị mkpụrụokwu n’otu n’otu.
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: Ya mere, bịanụ n’ụbọchị ndị ahụ ka a gwọọ unu
  rationale: Nke a na-edobe njikọ nkwubi okwu nke οὖν, iwu nke ‘bịanụ,’ na ọdịdị nnabata ọgwụgwọ nke θεραπεύεσθε.
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: ọ bụghị n’ụbọchị izuike
  rationale: Nsụgharị a na-edobe mmachibido na ntụnyere dị n’okwu onyeisi ahụ n'ụzọ Igbo dị nkenke.
theological_decisions:
- issue: Okwu onyeisi ụlọ nzukọ banyere ụbọchị kwesịrị ekwesị maka ọrụ na ọgwụgwọ
  choice: 'E gosipụtara ya dịka ihe onyeisi ahụ kwuru: “E nwere ụbọchị isii a ga-eji rụọ ọrụ.”'
  alternative: Ịkọgharị ya ka nsụgharị ahụ kwuo ozugbo na echiche ya bụ ihu abụọ ma ọ bụ na ọ megidere uche Chineke.
  rationale: Amaokwu a na-akọ echiche na iwe onyeisi ahụ; ọ naghị akwado okwu ya dịka iwu Chineke. Nsụgharị ahụ na-ahapụ esemokwu akụkọ ahụ ka ọ dị, n’agbakwụnyeghị ikpe nkà mmụta okpukpe nke amaokwu a n’onwe ya ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ụlọ nzukọ ndị Juu’ na-akọwa synagogue nye onye na-agụ akwụkwọ nkịtị; ‘ụbọchị izuike’ na-ekwupụta Sabbath n’Igbo doro anya, ebe ndetu ala peeji debere aha ‘Sabat’ dịka ụzọ ọzọ.
