  source_fidelity: A chọrọ obere ndezi iji wepụ nkọwa agbakwunyere na-adịghị n’amaokwu Grik—“ndị Juu” na “mmadụ”—ma mee ka aha Σάββατον pụta ìhè dịka “Sabat.” Nsụgharị a ka na-edobe ihe kpatara iwe onyeisi ahụ, ndị ọ na-agwa okwu, na iwu ya banyere ụbọchị isii na ọgwụgwọ.
  naturalness: “Zara okwu” adịghị eke dịka “zara” n’ebe a. “Iwe were ya” bụ okwu Standard Igbo dị mfe ma na-egosi ἀγανακτῶν nke ọma. “E nwere ụbọchị isii nke e kwesịrị ịrụ ọrụ n’ime ha” na-edobe ike δεῖ n’enweghị ịgbakwunye onye kpọmkwem ga-arụ ọrụ.
  terminology: “Onyeisi ụlọ nzukọ” na-anọchi ἀρχισυνάγωγος n’enweghị ịgbakwunye “ndị Juu,” bụ́ nke Grik anaghị ekwu kpọmkwem. “Ụbọchị Sabat” na-echekwa aha na echiche τῇ ἡμέρᾳ τοῦ σαββάτου karịa “ụbọchị izuike,” nke nwere ike ịdị obosara.
