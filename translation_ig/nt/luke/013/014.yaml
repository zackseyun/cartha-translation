revisions:
- from: Ma onyeisi ụlọ nzukọ ndị Juu zara okwu, iwe ju ya obi n’ihi na Jizọs gwọrọ mmadụ n’ụbọchị izuike. Ọ sịrị ìgwè mmadụ ahụ, “E nwere ụbọchị isii a ga-eji rụọ ọrụ. Ya mere, bịanụ n’ụbọchị ndị ahụ ka a gwọọ unu, ọ bụghị n’ụbọchị izuike.”[a]
  to: Ma onyeisi ụlọ nzukọ zara, ebe iwe were ya n’ihi na Jizọs gwọrọ n’ụbọchị Sabat. Ọ sịrị ìgwè mmadụ ahụ, “E nwere ụbọchị isii nke e kwesịrị ịrụ ọrụ n’ime ha; ya mere, bịanụ n’ụbọchị ndị ahụ ka a gwọọ unu, ọ bụghị n’ụbọchị Sabat.”[a]
  rationale: Ndezi a na-ewepụ nkọwa ndị isi mmalite anaghị ekwu, na-eji okwu Igbo eke karị maka nzaghachi na iwe, ma na-echekwa “Sabat” dịka aha dị n’asụsụ Grik. Ọ na-edobe ἔλεγεν dịka “Ọ sịrị,” nke dabara n’akụkọ Igbo n’enweghị ikwubiga aspect imperfect ókè, ma na-edobe iwu/ọrụ dị na δεῖ site na “e kwesịrị.”
