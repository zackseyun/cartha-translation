source:
  edition: SBLGNT
  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: ig
  text: Ma mgbe Jizọs hụrụ ya, ọ kpọrọ ya okwu ma sị ya, “Nwanyị, a tọpụla gị n’adịghị ike gị.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a hapụla gị n’ọrịa gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: mgbe ... hụrụ
  rationale: 'Aorist participle ahụ na-egosi ọnọdụ oge n''ụzọ kwekọrọ n’Igbo: “mgbe Jizọs hụrụ ya.”'
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ntughari ma ọ bụ obere ọdịiche n’akụkọ ahụ, n’enweghị ime ka ọdịiche ahụ sie ike karịa ka Grik si kwuo.
- source_word: προσεφώνησεν
  choice: ọ kpọrọ ya ka ọ bịakwute ya
  rationale: Na-egosi na Jizọs kpọrọ nwanyị ahụ n’ebe ọ nọ ka ọ bịakwute ya, ọ bụghị nanị na ọ gwara ya okwu.
- source_word: Γύναι
  choice: Nwanyị
  rationale: Ọ bụ ụzọ kpọmkwem ma dị nsọpụrụ e si akpọ nwanyị; ọ naghị etinye mmetụta ịhụnanya ma ọ bụ ọkwa mmekọrịta na-adịghị na Grik.
- source_word: ἀπολέλυσαι
  choice: a tọpụla gị
  rationale: 'Na-echekwa passive perfect: emewo ihe ntọhapụ ahụ, ọnọdụ ya ka dịkwa ugbu a.'
- source_word: τῆς ἀσθενείας σου
  choice: n’adịghị ike gị
  rationale: “Adịghị ike” na-echekwa obosara ἀσθένεια, nke nwere ike ịpụta adịghị ike, ọrịa, ma ọ bụ nkwarụ, n’etinyeghị nchọpụta ahụike kpọmkwem.
theological_decisions:
- issue: Ụdị ọnọdụ nwanyị ahụ nke ἀσθένεια na-akọwa
  choice: adịghị ike
  alternative: ọrịa; nkwarụ
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi nsogbu anụ ahụ, ma okwu Grik ahụ sara mbara. “Adịghị ike” na-echekwa obosara ahụ ma ghara ime ya ka ọ bụrụ otu ụdị ọrịa a chọpụtara kpọmkwem.
- issue: Ike onye na-eme ntọhapụ n’okwu passive ἀπολέλυσαι
  choice: a tọpụla gị
  alternative: atọpụla m gị; ị tọpụla onwe gị
  rationale: Grik kwuru ya n’ụdị passive ma ọ kpọghị onye mere ihe ahụ aha. Nsụgharị ahụ na-echekwa oghere ahụ kama ịkpọ Jizọs ma ọ bụ Chineke aha n’ime ahịrịokwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji “tọpụla” gosi ntọhapụ e mezuru nke nsonaazụ ya ka dị; e debere akara ntụaka [a] ozugbo n’isiokwu ọ na-akọwa.
