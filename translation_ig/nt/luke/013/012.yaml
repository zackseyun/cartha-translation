review_pass:
  verdict: revise
  source_fidelity: The principal correction needed is for προσεφώνησεν. It means that Jesus addressed or called to the woman; the draft's “ọ kpọrọ ya ka ọ bịakwute ya” explicitly says that he told/summoned her to come to him, an added movement not stated in the Greek. “Ọ kpọrọ ya okwu” retains the direct address without adding that detail. “A tọpụla gị n’adịghị ike gị” suitably retains the perfect passive force of ἀπολέλυσαι and the broad sense of ἀσθένεια.
  naturalness: The revised wording is idiomatic, clear Standard Igbo. “Ọ kpọrọ ya okwu ma sị ya” naturally represents the successive acts of addressing and speaking. Moving the footnote anchor directly after “adịghị ike gị” makes its scope clear.
  terminology: “Nwanyị” is a direct, respectful rendering of Γύναι in this context. “Adịghị ike” appropriately preserves the semantic breadth of ἀσθένεια; the note supplies “ọrịa” as a viable contextual alternative without imposing a diagnosis. “A tọpụla gị” maintains the unnamed passive agent and completed-result aspect.
  issues:
  - severity: medium
    issue: The phrase “ọ kpọrọ ya ka ọ bịakwute ya” adds a summons to approach.
    rationale: προσεφώνησεν denotes addressing/calling to her, but neither it nor the immediate context states that Jesus instructed her to come over.
  - severity: low
    issue: The footnote marker is placed after the entire quotation rather than directly with the expression it qualifies.
    rationale: The note concerns “adịghị ike,” so attaching the anchor there improves referential clarity.
  revised_text: Ma mgbe Jizọs hụrụ ya, ọ kpọrọ ya okwu ma sị ya, “Nwanyị, a tọpụla gị n’adịghị ike gị.”[a]
  revised_footnotes:
