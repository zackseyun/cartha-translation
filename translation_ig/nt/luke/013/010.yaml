  yaml_path: translation/nt/luke/013/010.yaml
  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: ig
  text: Ọ nọ na-akụzi ihe n’otu n’ime ụlọ nzukọ ndị Juu n’ụbọchị Izuike[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụbọchị Izuike dị iche iche”; okwu Grik a dị n’ụdị ọtụtụ, ma ọ na-arụkarị ọrụ dị ka otu, “ụbọchị Izuike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: Ọ nọ na-akụzi ihe
  rationale: Ngwakọta imperfect ἦν na participle διδάσκων na-egosi omume gara aga nke nọ na-aga n’ihu. Usoro Igbo ‘nọ na-akụzi ihe’ na-egosipụta nke a n’asụsụ dị ndụ. A naghị atụgharị δέ iche ebe a, n’ihi na ọ bụ njikọ akụkọ dị nro, ma itinye ‘ma’ nwere ike ime ka ọ dị ka e nwere mmegide siri ike.
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: n’otu n’ime ụlọ nzukọ ndị Juu
  rationale: Nke a na-edobe echiche partitive, ‘otu n’ime.’ ‘Ụlọ nzukọ ndị Juu’ bụ okwu Igbo doro anya maka ụlọ nzukọ ofufe na nkuzi ndị Juu, kama ime ya naanị ‘ebe nzukọ.’
- source_word: ἐν τοῖς σάββασιν
  choice: n’ụbọchị Izuike
  rationale: Ọ bụ ezie na σάββασιν dị n’ụdị ọtụtụ, ụdị a na-arụkarị ọrụ dị ka otu n’asụsụ Grik Koine. ‘N’ụbọchị Izuike’ bụ nsụgharị Igbo eke; e debere ụdị ọtụtụ n’okpuru peeji.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ụlọ nzukọ ndị Juu’ mee ka ebe akụkọ ahụ bụ pụta ìhè, e jighịkwa okwu ụka nke otu denominashọn.
