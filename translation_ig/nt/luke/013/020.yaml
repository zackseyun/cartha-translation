reference: Luke 13:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: ig
  text: Ọ sịrị ọzọ, “Gịnị ka m ga-eji tụnyere alaeze Chineke?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Ọzọkwa
  rationale: E jikọtara Καὶ na πάλιν n'ụzọ Igbo si ada nke ọma; “Ọzọkwa” na-egosi njikọ okwu na nkwughachi n'etinyeghị echiche oge ọzọ.
- source_word: πάλιν
  choice: Ọzọkwa
  rationale: N'ọnọdụ a, “Ọzọkwa” bụ ụzọ nkịtị na nke doro anya isi gosi na Jizọs kwuru okwu ọzọ.
- source_word: εἶπεν
  choice: o kwuru
  rationale: Nke a bụ okwu Igbo a na-ejikarị webata okwu mmadụ kwuru kpọmkwem, ma ọ na-echekwa ụdị akụkọ dị na Grik.
- source_word: Τίνι
  choice: Gịnị ka m ga-eji
  rationale: Ụdị ajụjụ a na ὁμοιώσω na-achọ ihe a ga-eji mee ntụnyere, ọ bụghị mmadụ; nke a bụkwa usoro Igbo ebumpụta ụwa.
- source_word: ὁμοιώσω
  choice: tụnyere
  rationale: '“Tụnyere” na-enye deliberative future ahụ n''ụzọ Igbo doro anya: “Gịnị ka m ga-eji tụnyere...?”'
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: “Alaeze Chineke” bụ nkebiokwu Akwụkwọ Nsọ a maara nke ọma, ma na-echekwa obosara βασιλεία nke nwere ike ịgụnye ọchịchị Chineke na ógbè ọchịchị ya.
theological_decisions:
- issue: Nsụgharị βασιλεία n'okwu gbasara ọchịchị Chineke
  choice: alaeze Chineke
  alternative: ọchịchị Chineke
  rationale: “Alaeze Chineke” na-echekwa ma echiche ịchị achị Chineke ma echiche alaeze ya, ebe “ọchịchị Chineke” nwere ike ime ka ihe ọ pụtara bụrụ naanị omume ịchị achị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ajụjụ “Gịnị ka m ga-eji tụnyere...” n'ihi na ọ na-ada nke ọma n'Igbo ma na-esochi usoro ntụnyere nke Grik.
