id: LUK.13.19
reference: Luke 13:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: ig
  text: Ọ dị ka mkpụrụ mọstad nke otu nwoke kpọrọ tụba n’ogige ya; ọ toro, ghọọ osisi, ụmụ nnụnụ nke mbara igwe wee biri n’alaka ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: Ọ dị ka
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ntụnyere; ọ na-edobe usoro ihe atụ ahụ n’enweghị okwu siri ike.
- source_word: κόκκῳ σινάπεως
  choice: mkpụrụ mọstad
  rationale: “Mkpụrụ” na-enye echiche κόκκος n’ọnọdụ a nke ọma, ebe “mọstad” bụ aha osisi ahụ a na-amata n’Igbo nke oge a.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: nke otu nwoke were
  rationale: “Otu nwoke” na-edobe onye nwoke nọ n’otu n’otu nke ederede Grik kpọrọ aha, kama ime ya okwu izugbe na-enweghị okike.
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: tụba n’ogige ya
  rationale: “Tụba” na-edobe ike na ihe osise dị na βάλλω karịa “tinye”; “ogige ya” na-egosipụta κῆπος dịka ebe a kụrụ ihe nke onye ahụ.
- source_word: ηὔξησεν
  choice: Ọ too
  rationale: Nke a bụ okwu Igbo nkịtị na nke ziri ezi maka uto osisi.
- source_word: ἐγένετο εἰς δένδρον
  choice: ghọọ osisi
  rationale: Ederede Grik kwuru kpọmkwem na ọ ghọrọ δένδρον, ya bụ osisi; nsụgharị ahụ ekwesịghị ibelata nnukwu ihe osise dị n’ilu ahụ ka ọ bụrụ naanị obere ahịhịa.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ụmụ nnụnụ nke mbara igwe
  rationale: Nke a na-egosipụta nnụnụ ndị nọ n’eluigwe n’echiche nke mbara igwe, n’enweghị ịmanye okwu ahụ ka ọ bụrụ ebe obibi Chineke.
- source_word: κατεσκήνωσεν
  choice: wuo akwụ́
  rationale: N’ihe gbasara nnụnụ na alaka, okwu a na-enye echiche idozi ebe obibi ma ọ bụ ịma ụlọikwuu n’ụzọ Igbo ga-aghọta ozugbo.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: n’alaka ya
  rationale: “Alaka” bụ okwu Igbo doro anya maka κλάδοις, ebe “ya” na-alaghachi n’osisi ahụ.
theological_decisions:
- issue: Igosipụta okike nke ἄνθρωπος
  choice: otu nwoke
  alternative: otu onye
  rationale: N’ilu a, ederede ahụ gosipụtara otu nwoke dị ka onye na-eme ihe; nsụgharị ahụ na-edobe nkọwa ahụ kama ime ka ọ bụrụ onye na-enweghị okike.
- issue: Ihe osise δένδρον n’ilu mkpụrụ mọstad
  choice: osisi
  alternative: nnukwu ahịhịa ma ọ bụ osisi nta
  rationale: Ọ bụ δένδρον ka ederede Grik kwuru. Ọ bụ ezie na ihe osise ahụ nwere ike iyi nnukwu karịa ka a tụrụ anya ya n’ihe gbasara mọstad, a hapụrụ nrụgide na ịtụnanya dị n’ilu ahụ ka ọ dị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ na-eme ka ederede na-agụ were were, ma njikọ na usoro uto nke ilu ahụ ka dị. Ejighị okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi agbakwunyere.
