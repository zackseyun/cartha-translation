id: LUK.13.6
reference: Luke 13:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: ig
  text: 'Ọ nọ na-akọrọ ilu a, sị: “Otu nwoke nwere osisi fig a kụrụ n’ubi vaịn ya[a]. Ọ bịara na-achọ mkpụrụ n’elu ya, ma ọ hụghị nke ọ bụla.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Otu onye nwere osisi fig a kụrụ n’ubi vaịn ya.” Okwu Grik ahụ nwere ike ịpụta onye a na-akọwaghị kpọmkwem; ma “otu nwoke” dabara nke ọma n’ụzọ e si akọ ilu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ọ nọkwa na-akọrọ ha
  rationale: Ụdị imperfect na-egosi omume a na-aga n’ihu ma ọ bụ ụzọ e si webata akụkọ; ‘nọ na-akọrọ’ na-egosipụta nke a n’Igbo nkịtị. E tinyere ‘ha’ dị ka ihe nnara a ghọtara site n’ọnọdụ okwu, ọ bụghị dị ka isi ihe ọhụrụ.
- source_word: δὲ
  choice: -kwa
  rationale: δὲ bụ njikọ dị nro; mgbakwunye ‘-kwa’ na-eme ka okwu a gaa n’ihu n'ụzọ Igbo dị mma n’enweghị ịkọwa njikọ ahụ karịa ihe Grik kwuru.
- source_word: παραβολήν
  choice: ilu
  rationale: ‘Ilu’ bụ okwu Igbo a na-ejikarị akọwa akụkọ ihe atụ Jizọs ji akụzi ihe.
- source_word: Συκῆν
  choice: osisi fig
  rationale: Okwu ahụ kpọmkwem bụ osisi fig, ọ bụghị naanị mkpụrụ fig.
- source_word: εἶχέν τις
  choice: Otu nwoke nwere
  rationale: τις bụ onye a na-akọwaghị kpọmkwem; ‘otu nwoke’ dabara n’usoro ịkọ ilu n’Igbo ma ghara itinye nkọwa okpukpe ọzọ.
- source_word: πεφυτευμένην
  choice: a kụrụ
  rationale: Perfect passive participle na-egosi osisi nọ n’ọnọdụ e kụwororị ya; ‘a kụrụ’ na-enye echiche ahụ n’Igbo n'ụzọ dị mfe.
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: n’ubi vaịn ya
  rationale: ἀμπελών bụ ubi a na-akụ vaịn, possessive αὐτοῦ bụ ‘ya.’
- source_word: ἦλθεν ζητῶν
  choice: Ọ bịara na-achọ
  rationale: Ngwakọta aorist na present participle na-egosi na ọ bịara ma nọkwa na-achọ; nsụgharị a bụ Igbo eke ma chekwaa omume ọchịchọ ahụ.
- source_word: καρπὸν
  choice: mkpụrụ
  rationale: ‘Mkpụrụ’ bụ okwu Igbo kwesịrị ekwesị maka ihe osisi na-amị, ma na-echekwa ohere nke nghọta ihe atụ n’ilu ahụ.
- source_word: ἐν αὐτῇ
  choice: n’elu ya
  rationale: Ọ bụ ezie na Grik ji ἐν, Igbo na-ekwu maka mkpụrụ dị ‘n’elu’ osisi; nke a na-eme ka asụsụ bụrụ eke n’enweghị mgbanwe ihe ọ pụtara.
- source_word: οὐχ εὗρεν
  choice: ọ hụghị nke ọ bụla
  rationale: Nke a na-ezo aka azụ na mkpụrụ ma na-egosi nke ọma na ọ hụghị mkpụrụ ọbụla.
theological_decisions:
- issue: Onye a na-akọwaghị kpọmkwem n’okwu τις
  choice: Otu nwoke
  alternative: Otu onye
  rationale: Ihe odide Grik na-ewebata onye nkịtị n’ilu ahụ n’enweghị nkọwa mmụọ ma ọ bụ okpukpe pụrụ iche. ‘Otu nwoke’ dabara n’ụdị akụkọ ahụ, ebe ihe ọzọ ka edere n’akwụkwọ nkọwa iji chekwaa ịdị obosara nke τις.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro akụkọ nkịtị, ma e chekwara akụkụ omume nke Ἔλεγεν na mgbagwoju anya nke τις site n’akwụkwọ nkọwa.
