  to: 'Ọ nọ na-akọrọ ilu a, sị: “Otu nwoke nwere osisi fig a kụrụ n’ubi vaịn ya[a]. Ọ bịara na-achọ mkpụrụ n’elu ya, ma ọ hụghị nke ọ bụla.”'
