  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: ig
  text: Mgbe ahụ, unu ga-amalite ịsị, “Anyị riri ma ṅụọ n’ihu gị, ị kụziri ihe n’okporo ámá anyị[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ámá ọha anyị”; okwu Grik ahụ nwere ike ịpụta okporo ámá sara mbara ma ọ bụ ebe ghe oghe ndị mmadụ na-ezukọ n’ime obodo.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Mgbe ahụ
  rationale: Ọ na-egosi ihe ga-esochi n’usoro okwu ahụ, ma bụrụkwa ụzọ Igbo dị mfe ma doo anya isi kwuo ya.
- source_word: ἄρξεσθε λέγειν
  choice: unu ga-amalite ịsị
  rationale: Nke a na-echekwa echiche nke ịmalite ikwu ihe, kama ịsụgharị ya naanị dịka ‘unu ga-asị.’
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: Anyị riri ma ṅụọ
  rationale: Oge omume gara aga dị mfe na Igbo na-egosipụta omume abụọ ahụ dịka ihe mere eme, ma na-echekwa njikọ iri na ịṅụ.
- source_word: ἐνώπιόν σου
  choice: n’ebe ị nọ
  rationale: Nke a na-egosi na ha mere ya n’ọnụnọ ya, n’enweghị ịtụ aro na ha na ya nwere mmekọrịta nke ọ nabatara.
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: n’okporo ámá anyị[a]
  rationale: ‘Okporo ámá’ bụ okwu Igbo mmadụ niile ga-aghọta maka ụzọ sara mbara ma ọ bụ ebe ọha na-ezukọ n’obodo; ihe odide ala ala peeji na-echekwa nkọwa ọzọ o nwere ike inwe.
- source_word: ἐδίδαξας
  choice: ị kụzikwaara ihe
  rationale: Nke a na-egosi eziokwu nke omume gara aga, ebe ‘-kwaara’ na-ejikọta ihe akaebe nke abụọ ha na-ekwu.
theological_decisions:
- issue: Ụdị ihe ndị na-ekwu okwu ji arịọ ka a mata ha
  choice: E debere okwu ha dịka nkwupụta na ha nọ ya nso ma nụkwa ozizi ya n’ebe ha bi.
  alternative: A pụrụ ịsụgharị ya n’ụzọ ga-eme ka o yie na ha na ya rikọrọ nri ma ọ bụ na ọ nabatara ha dịka ndị nke ya.
  rationale: Asụsụ Grik na-ekwu naanị na ha riri ma ṅụọ n’ọnụnọ ya nakwa na ọ kụziri ihe n’okporo ámá ha; ọ naghị ekwu na ọ kwadoro mmekọrịta nzọpụta ha na ya. Nsụgharị ahụ na-echekwa esemokwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘N’ebe ị nọ’ dịkwuo eke karịa nsụgharị okwu n’otu n’otu dịka ‘n’ihu gị,’ ma na-echekwa echiche nke ἐνώπιόν σου. E tinyere akara [a] kpọmkwem n’akụkụ ‘okporo ámá anyị,’ bụ ebe nkọwa ala ala peeji metụtara.
