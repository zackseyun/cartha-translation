revisions:
- from: Mgbe ahụ, unu ga-amalite ịsị, “Anyị riri ma ṅụọ n’ebe ị nọ, ị kụzikwaara ihe n’okporo ámá anyị[a].”
  to: Mgbe ahụ, unu ga-amalite ịsị, “Anyị riri ma ṅụọ n’ihu gị, ị kụziri ihe n’okporo ámá anyị[a].”
  rationale: The revision makes the personal-presence claim explicit with n’ihu gị, corresponding closely to ἐνώπιόν σου, while retaining the speakers’ appeal based only on outward proximity and public teaching. It also uses unmarked coordination for the final clause and preserves the existing, correctly anchored lexical footnote for πλατεῖαι.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the future-ingressive force of τότε ἄρξεσθε λέγειν, the past acts of eating and drinking, and the public-local sense of ἐν ταῖς πλατείαις ἡμῶν. However, n’ebe ị nọ is more literally “where you were/are” and can weaken the direct personal-presence sense of ἐνώπιόν σου. N’ihu gị is a standard, natural equivalent that retains this sense without adding theological implications.
  naturalness: The wording is generally clear Standard Igbo. Replacing n’ebe ị nọ with n’ihu gị is both more idiomatic for the intended claim and closer to the source. Removing the additive -kwa from kụzikwaara avoids giving undue emphasis to the second clause; the Greek conjunction simply coordinates the claims.
  terminology: Okporo ámá appropriately renders πλατεῖαι as public streets/thoroughfares, and the footnote responsibly preserves the possible sense of public squares/open places. The revised wording retains a dignified, modern register.
  issues:
  - severity: medium
    issue: The phrase n’ebe ị nọ underrepresents ἐνώπιόν σου.
    rationale: It can mean merely “where you were,” whereas the Greek explicitly frames the claim as eating and drinking before/in the presence of Jesus. N’ihu gị better conveys direct presence while remaining natural Igbo.
  - severity: low
    issue: kụzikwaara adds an unnecessary additive emphasis.
    rationale: The -kwa intensifies the second item in a way not required by the simple Greek καί. Plain kụziri ihe gives an even coordination of the speakers’ two claims.
  revised_text: Mgbe ahụ, unu ga-amalite ịsị, “Anyị riri ma ṅụọ n’ihu gị, ị kụziri ihe n’okporo ámá anyị[a].”
  revised_footnotes:
