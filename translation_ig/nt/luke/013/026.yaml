    reason: lexical_alternative
  revision_rationale: The revision makes the personal-presence claim explicit with n’ihu gị, corresponding closely to ἐνώπιόν σου, while retaining the speakers’ appeal based only on outward proximity and public teaching. It also uses unmarked coordination for the final clause and preserves the existing, correctly anchored lexical footnote for πλατεῖαι.
