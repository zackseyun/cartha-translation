  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: ig
  text: Ha ga-esi n’ọwụwa anyanwụ na n’ọdịda anyanwụ, nakwa site n’ugwu na n’ndịda bịa; ha ga-edina n’akụkụ tebụl oriri[a] n’alaeze Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha ga-anọdụ ala n’oriri”; okwu Grik ahụ na-ekwu kpọmkwem banyere idina n’akụkụ tebụl mgbe a na-eri oriri.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: ha ga-esi … bịa
  rationale: Ụdị a bụ ụzọ Igbo si egosi ọbịbịa nke si n'ebe ndị a kpọrọ aha pụta, ma na-edobe ihe ọdịnihu nke ngwaa Grik.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: site n'ebe ọwụwa anyanwụ na n'ebe ọdịda anyanwụ
  rationale: Ndị a bụ okwu ntụaka ebe anwụ si awa na ebe ọ na-ada; ntụgharị a bụ asụsụ Igbo doro anya maka ọwụwa anyanwụ na ọdịda anyanwụ.
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: sitekwa n'ebe ugwu na n'ebe ndịda
  rationale: Ọ na-aga n'ihu n'ịkpọ akụkụ ụwa anọ, n'asụsụ Igbo dị mfe ma kwekọọ n'usoro Grik.
- source_word: ἀνακλιθήσονται
  choice: ha ga-edina n'akụkụ tebụl iri nri
  rationale: Ngwaa Grik na-akọwa omenala ndị oge ahụ nke idina n'akụkụ tebụl mgbe a na-eri oriri; nke a na-echekwa ihe atụ nke oriri karịa nanị ịsị ‘ịnọdụ ala.’
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: n'alaeze Chineke
  rationale: Nke a bụ ntụgharị Igbo doro anya nke na-edobe ịdị arọ nke okwu gbasara ọchịchị na alaeze Chineke n'enweghị nkọwa agbakwunyere.
theological_decisions:
- issue: Ihe atụ nke oriri n'alaeze nke ga-abịa
  choice: Idobe ihe osise nke ndị na-edina n'akụkụ tebụl iri nri
  alternative: ha ga-anọdụ ala n'alaeze Chineke
  rationale: Ngwaa ahụ na-egosi iri nri n'oriri. Idobe ihe osise a na-egosi ikere òkè n'alaeze n'ụzọ pụtara ìhè, ma ọ naghị etinye ozizi ọzọ na-adịghị n'amaokwu ahụ.
- issue: Nchịkọta ndị mmadụ site n'akụkụ ụwa niile
  choice: Ịkpọ akụkụ anọ—ọwụwa anyanwụ, ọdịda anyanwụ, ugwu, na ndịda—n'enweghị ịkọ agbụrụ ha
  alternative: Ịkọwa ha kpọmkwem dị ka ndị mba ọzọ
  rationale: Amaokwu ahụ na-egosi ọbịbịa sitere n'akụkụ niile, ma ọ kpọghị ndị ahụ ndị mba ọzọ kpọmkwem. Ya mere, ntụgharị ahụ na-edobe obosara okwu ahụ n'enweghị ịkọwa ya gabiga ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ ‘ga-edina n'akụkụ tebụl iri nri’ iji chekwaa omenala oriri nke okwu Grik na-egosi, ebe nkọwa ala peeji na-enye ụzọ Igbo a na-ahụkarị, ‘ga-anọdụ ala iri nri.’
