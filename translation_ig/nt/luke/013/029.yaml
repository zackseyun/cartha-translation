  terminology: “Alaeze Chineke” is an established, clear rendering of βασιλεία τοῦ θεοῦ. “Idina n’akụkụ tebụl oriri” preserves the ancient banquet posture without importing interpretation; the footnote supplies the more idiomatic alternative.
