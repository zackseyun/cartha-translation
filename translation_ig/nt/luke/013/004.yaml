id: LUK.13.4
reference: Luke 13:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: ig
  text: Ma ọ bụ mmadụ iri na asatọ ahụ ụlọ elu dị na Saịloam dakwasịrị ha ma gbuo ha—unu chere na ha ghọrọ ndị ji ụgwọ karịa ndị mmadụ niile bi na Jerusalem?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ndị ji ụgwọ karịa” dịka “ndị mmehie karịa” ma ọ bụ “ndị mere njọ karịa.” Okwu Grik ahụ pụtara n’ụzọ nkịtị “ndị ji ụgwọ,” ma eleghị anya n’echiche nke ikpe ọmụma omume.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ma ọ bụ
  rationale: Na-ewebata ihe atụ ọzọ n’arụmụka Jizọs ma na-edobe njikọ ya na amaokwu bu ụzọ.
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: mmadụ iri na asatọ ahụ
  rationale: Igbo chọrọ isiokwu doro anya n’ebe a; “mmadụ” anaghị ekwu na ha niile bụ ụmụ nwoke, ma ọ dabara n’ἀνθρώπους nke nwere ike ịgụnye mmadụ niile.
- source_word: ἐφ’ οὓς ἔπεσεν ὁ πύργος
  choice: ụlọ elu ... dakwasịrị
  rationale: “Dakwasịrị” na-egosipụta ma ọdịda ụlọ elu ahụ ma na ọ dakwasịrị ndị ahụ, n’ụzọ Igbo dị ndụ ma kwekọọ n’ihe Grik kwuru.
- source_word: ἐν τῷ Σιλωὰμ
  choice: dị na Siloam
  rationale: Na-akọwa ebe ụlọ elu ahụ dị n’ụzọ Igbo na-ada nke ọma, na-edobekwa aha ebe ahụ dịka Siloam.
- source_word: ἀπέκτεινεν αὐτούς
  choice: wee gbuo
  rationale: Isiokwu nke ngwaa ahụ ka bụ ụlọ elu ahụ; ịhapụ “ha” n’ebe a na-ezere nkwughachi na-adịghị mkpa n’Igbo.
- source_word: δοκεῖτε ὅτι
  choice: unu chere na
  rationale: Na-edobe ajụjụ Jizọs jụrụ ndị ọ na-agwa n’ụdị Igbo nkịtị ma kwụ ọtọ.
- source_word: ὀφειλέται
  choice: ji ụgwọ
  rationale: Na-echekwa ihe atụ Grik banyere ndị ji ụgwọ kama ịgbanwe ya ozugbo ka ọ bụrụ “ndị mmehie”; n’ọnọdụ a, ọ bụ ụgwọ n’echiche omume na ikpe ọmụma.
- source_word: ἐγένοντο ... παρὰ πάντας
  choice: ji ụgwọ karịa ndị niile
  rationale: Ngwaa γίνομαι anaghị achọ nsụgharị pụrụ iche n’Igbo n’ahịrịokwu a; “karịa” na-ebupụta ntụnyere παρά n'ụzọ doro anya ma bụrụ nke e ji eme ihe.
- source_word: τοὺς ἀνθρώπους τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: ndị niile bi na Jerusalem
  rationale: Na-egosi ndị mmadụ niile bi n’obodo ahụ n’enweghị itinye nwoke naanị n’ihe Grik nwere ike iji maka mmadụ n’ozuzu.
theological_decisions:
- issue: Ihe ὀφειλέται pụtara n’ọnọdụ a
  choice: ji ụgwọ
  alternative: bụrụ ndị mmehie ka njọ / bụrụ ndị mere njọ karịa
  rationale: Okwu Grik pụtara n'ụzọ nkịtị ndị ji ụgwọ, ma ebe a o yiri ka ọ na-ekwu banyere ụgwọ omume ma ọ bụ ikpe ọmụma. Isi nsụgharị na-echekwa ihe atụ ahụ na esemokwu ya kama ijikọta ya kpamkpam na “ndị mmehie” dị n’amaokwu nke 2.
- issue: Ma ἀνθρώπους ọ na-ezo aka n’ụmụ nwoke naanị
  choice: ndị niile
  alternative: ụmụ nwoke niile
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ozuzu ndị bi na Jerusalem, ọ bụghị naanị ụmụ nwoke; “ndị niile” na-egosipụta oke ntụnyere ahụ nke ọma.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” kwupụta onye nke abụọ n’ọnụọgụ ọtụtụ, “ụlọ elu” maka πύργος, na “dakwasịrị” iji mee ka ihe mberede ahụ doo anya n’enweghị ịgbakwunye nkọwa na-adịghị na isi mmalite.
