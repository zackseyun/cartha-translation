revisions:
- from: Ma ọ bụ mmadụ iri na asatọ ahụ ụlọ elu dị na Siloam dakwasịrị wee gbuo—unu chere na ha ji ụgwọ karịa ndị niile bi na Jerusalem?[a]
  to: Ma ọ bụ mmadụ iri na asatọ ahụ ụlọ elu dị na Saịloam dakwasịrị ha ma gbuo ha—unu chere na ha ghọrọ ndị ji ụgwọ karịa ndị mmadụ niile bi na Jerusalem?[a]
  rationale: The revision restores the explicit victims of the tower’s fall and killing, represents “became,” and keeps the Greek debt metaphor in the main text. The footnote preserves the plausible moral alternatives without imposing one interpretation.
  reviewer_model: gpt-5.6-terra
