  verdict: approve
  source_fidelity: 'Nsụgharị ahụ na-echekwa ihe ndị bụ isi dị na Grik: nkwughachi arịrị nke “Jerusalem,” participle ndị na-akọwa omume e ji obodo ahụ mara, ndị amụma na ndị e zigara ya, “ugboro ole,” ọchịchọ onye na-ekwu okwu, ụmụ Jerusalem, na ọdịiche dị n’etiti “m chọrọ” na “unu achọghị.” “Nne ọkụkọ ... ụmụ ya n’okpuru nku ya” bụ nkọwa dabara n’ihe atụ Grik ahụ; ngwaa “si achịkọta” na-eme ka ntụnyere ahụ zuo ezu n’Igbo n’enweghị ịgbakwunye echiche ọhụrụ.'
  naturalness: Ọ bụ Standard Igbo doro anya ma nwee ụda arịrị kwesịrị ekwesị. “Gị onye na-egbu ...” na “ma unu achọghị” na-arụ ọrụ nke ọma n’ịgbanwe site n’ịgwa Jerusalem okwu ruo n’ịgwa “ụmụ” ya ọtụtụ mmadụ okwu. “Na-eji nkume atụgbu” bụ ụzọ nghọta dị mfe isi sụgharị λιθοβολεῖν.
  terminology: Aha Jerusalem ka edebere n’ụzọ a na-ahụkarị. “Ndị amụma,” “ndị e zitere,” “ụmụ gị,” na “nne ọkụkọ” bụ okwu dabara n’amaokwu ahụ. Nsụgharị ahụ anaghị ekpebi n’enweghị ihe ndabere ndị “ụmụ gị” bụ kpọmkwem, ma ọ bụ gbasaa ihe amaokwu ahụ kwuru banyere ọchịchọ na ọjụjụ.
