id: LUK.13.34
reference: Luke 13:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: ig
  text: Jerusalem[a], Jerusalem, gị onye na-egbu ndị amụma ma na-eji nkume atụgbu ndị e zitere gị—ugboro ole ka m chọrọ ịchịkọta ụmụ gị dịka nne ọkụkọ si achịkọta ụmụ ya n’okpuru nku ya[b], ma unu achọghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Jerusalem, Jerusalem, onye na-egbu ndị amụma ma na-eji nkume atụgbu ndị e zitere ya.” Okwu Grik ji participle ndị nọ n’oge ugbu a kọwaa otú Jerusalem si emeso ndị ozi Chineke dịka àgwà e ji mara ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dịka nnụnụ si achịkọta ụmụ ya n’okpuru nku ya.” Okwu Grik ὄρνις nwere ike ịpụta nnụnụ n’ozuzu, ma ihe atụ nne na-achịkọta ụmụ ya n’okpuru nku ya na-eme ka “nne ọkụkọ” bụrụ nsụgharị kachasị dabara ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jerusalem, Jerusalem
  rationale: E debere nkwughachi aha obodo ahụ iji chekwaa ụda arịrị na nkwusi ike dị n’okwu a kpọrọ ya kpọmkwem.
- source_word: ἡ ἀποκτείνουσα ... λιθοβολοῦσα
  choice: gị onye na-egbu ... ma na-eji nkume atụgbu
  rationale: Ụdị ngwaa ‘na-’ na Igbo na-egosi omume e ji mara Jerusalem, ma na-echekwa myirịta dị n’etiti participle abụọ ahụ.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: ndị e zitere gị
  rationale: Nke a na-echekwa passive nke okwu Grik ahụ ma na-adaba n’okwu a na-agwa Jerusalem kpọmkwem.
- source_word: ποσάκις ἠθέλησα
  choice: ugboro ole ka m chọrọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ndụ isi gosipụta ọtụtụ oge na ọchịchọ onye na-ekwu okwu.
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: ịchịkọta ụmụ gị
  rationale: ‘Ụmụ gị’ na-echekwa ihe atụ nke Jerusalem dịka nne obodo n’enweghị ịkọwa kpọmkwem ndị ọ na-anọchi anya ha.
- source_word: ὄρνις τὴν ἑαυτῆς νοσσιὰν
  choice: nne ọkụkọ ... ụmụ ya
  rationale: Ọ bụ ezie na ὄρνις nwere ike ịpụta nnụnụ n’ozuzu, ihe atụ nke nne na-achịkọta ụmụ ya n’okpuru nku na-eme ka ‘nne ọkụkọ’ bụrụ okwu kacha doo anya ma bụrụ nke ebumpụta ụwa n’Igbo.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: ma unu achọghị
  rationale: E ji ‘achọghị’ chekwaa njikọ kpọmkwem ya na θέλω (‘chọrọ’), ebe plural ‘unu’ kwekọrọ na ngwaa Grik ma na-atụgharị uche site n’obodo ahụ gaa n’ụmụ ya.
theological_decisions:
- issue: Ndị okwu ‘ụmụ gị’ na-ezo aka na ha
  choice: E debere ya dịka ‘ụmụ gị.’
  alternative: ndị bi na Jerusalem; ma ọ bụ ndị Izrel Jerusalem nọchiri anya ha
  rationale: Ihe odide Grik na-agwa Jerusalem okwu dịka nne obodo, ma ọ naghị akọwa kpọmkwem oke ndị a na-akpọ ụmụ ya. Nsụgharị ahụ ahapụghị mgbagwoju anya ahụ.
- issue: Mmegide dị n’etiti θέλω na ἠθελήσατε
  choice: ‘m chọrọ ... unu achọghị’
  alternative: ‘m dị njikere ... unu ekweghị’
  rationale: Nke a na-echekwa okwu gbasara ọchịchọ nke dị n’amaokwu ahụ, n’etinyeghị mkpebi ozizi sara mbara banyere ọchịchọ Chineke na ngọnarị mmadụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A na-agwa Jerusalem okwu dịka mmadụ site na ‘gị’; plural ‘unu’ na ngwụcha na-echekwa plural Grik ma na-ezo aka n’ụmụ Jerusalem. E debere ụda arịrị, nkwughachi, na ihe atụ nke nne ọkụkọ.
