source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: ig
  text: Ọ ga-asị unu, “Amaghị m ebe unu si.[a] Sinụ n’ebe m nọ pụọ, unu niile ndị na-eme ajọ omume.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ebe unu si bịa.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ndị na-eme ihe na-ezighị ezi” ma ọ bụ “ndị na-emebi iwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: Ọ ga-asị unu
  rationale: Okwu Grik ahụ jikọtara ngwaa ọdịnihu ‘ọ ga-asị’ na participle ‘na-ekwu/na-asị,’ nke na-ekwughachi otu echiche ahụ. Igbo dị ire na-ejikọta ha n’otu ahịrịokwu a n’enweghị iwepụ ihe okwu ahụ pụtara.
- source_word: οἶδα
  choice: Amaghị m
  rationale: Nke a na-edobe isi ihe οἶδα pụtara, ya bụ ‘ịma,’ ma hapụkwa ọnọdụ ikpe a ka ọ gosi echiche nke ịjụ mmekọrịta ma ọ bụ nnabata.
- source_word: πόθεν ἐστέ
  choice: ebe unu si
  rationale: πόθεν na-egosi ebe mmalite ma ọ bụ ebe mmadụ si. ‘Ebe unu si’ bụ okwu Igbo doro anya ma dịkwa nkenke.
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: Sinụ n’ebe m nọ pụọ
  rationale: Aorist imperative a chọrọ ka ha kewapụ onwe ha ozugbo. Nsụgharị a na-egosi iwu siri ike nke ịchụpụ ha n’ebe ọ nọ.
- source_word: πάντες ἐργάται
  choice: unu niile ndị na-eme
  rationale: πάντες na-emetụta ndị a na-akpọ okwu, ebe ἐργάται n’ọnọdụ a bụ ndị na-eme ma ọ bụ na-arụ ụdị omume a mgbe niile.
- source_word: ἀδικίας
  choice: ajọ omume
  rationale: ἀδικία na-ekpuchi ihe na-ezighị ezi, ajọ omume, na enweghị ezi omume. ‘Ajọ omume’ bụ okwu Igbo nkịtị ma dị arọ nke na-adịghị etinye echiche iwu kpọmkwem n’ebe Grik na-etinyeghị νόμος.
theological_decisions:
- issue: Otu e si sụgharịa ἀδικίας n’okwu ikpe a
  choice: ajọ omume
  alternative: omume na-ezighị ezi; mmebi iwu
  rationale: ‘Ajọ omume’ na-edobe ikpe omume ahụ n’ụzọ sara mbara. ‘Mmebi iwu’ nwere ike ime ka νόμος, ‘iwu,’ yie ka ọ dị n’okwu Grik, ebe ọ na-adịghị; ‘omume na-ezighị ezi’ bụkwa nke ziri ezi ma ọ naghị ada arọ otú ahụ n’Igbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E jikọtara pleonasm dị na ἐρεῖ λέγων n’ụzọ Igbo si ekwu okwu nke ọma, ma e debere ike dị n’iwu ịchụpụ ha na ịdị arọ nke ikpe omume ahụ.
