review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the address, the request to leave the tree for this additional year, and the two agricultural actions. However, “m gwuchara” is a completed/perfective form (“after I have dug”), whereas Greek σκάψω is a future subjunctive action governed by “until.” A non-completed form better preserves the source construction.
  naturalness: “Nna m ukwu,” “hapụ ya n’afọ a kwa,” and “gwuo ala gbara ya gburugburu” are natural, respectful Standard Igbo in this parabolic agricultural setting. Stating where the manure is applied makes the final clause idiomatic without introducing a material new action.
  terminology: “Nna m ukwu” is an appropriate respectful address to the vineyard owner within the parable and does not unnecessarily impose a divine reading on Κύριε. “Nsị anụ” retains the concrete sense of κόπρια. The footnote is revised to offer “fatịlaịza” as a genuinely more general alternative while identifying the literal expression.
  issues:
  - severity: medium
    issue: Completed aspect in “m gwuchara”
    rationale: 'The Greek has σκάψω, a future subjunctive after ἕως ὅτου, not a completed action. “M gwuo” better retains the prospective action: “until I dig.”'
  - severity: low
    issue: Footnote alternative and explanation are imprecise
    rationale: “Nri ala” is not the closest natural lexical alternative to κόπρια, and the explanation “e ji eme ka ala maa nri” is awkward. “Fatịlaịza” is a clear general alternative, while “nsị anụ” remains the literal wording.
  revised_text: Ma ọ zara ya sị, “Nna m ukwu, hapụ ya n’afọ a kwa, ruo mgbe m gwuo ala gbara ya gburugburu ma tinye nsị anụ n’ala gbara ya gburugburu[a].”
  revised_footnotes:
