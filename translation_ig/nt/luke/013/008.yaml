  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: ig
  text: Ma ọ zara ya sị, “Nna m ukwu, hapụ ya n’afọ a kwa, ruo mgbe m gwuo ala gbara ya gburugburu ma tinye nsị anụ n’ala gbara ya gburugburu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “tinye fatịlaịza.” N’ụzọ kpọmkwem, okwu Grik ahụ pụtara “nsị anụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: ọ zara ya sị
  rationale: Nke a na-edobe ma echiche ‘ịza’ ma nke ‘ikwu,’ ma bụrụkwa ụzọ e si ekwu ya nke ọma n’Igbo.
- source_word: Κύριε
  choice: Nna m ukwu
  rationale: N’ime ilu a, ọ bụ okwu nkwanye ùgwù a na-akpọ onye nwe ubi; ‘Nna m ukwu’ na-egosi ọnọdụ onye nwe ya n’enweghị ịmanye ka ọ bụrụ aha Chineke kpọmkwem.
- source_word: ἄφες αὐτὴν
  choice: hapụ ya
  rationale: Ọ pụtara ikwe ka osisi ahụ dịgide, kama igbutu ya; okwu a na-edobe obosara ihe ἀφίημι pụtara.
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: n’afọ a kwa
  rationale: Nke a na-egosipụta arịrịọ ka e nye ya afọ a ọzọ, ma na-agbaso ‘this year also’ nke Grik nke ọma.
- source_word: ἕως ὅτου
  choice: ruo mgbe
  rationale: Ọ bụ njikọ oge sitere n’ihe odide ahụ, ma bụrụkwa okwu Igbo doro anya.
- source_word: σκάψω περὶ αὐτὴν
  choice: m gwuchara ala gbara ya gburugburu
  rationale: Nke a na-echekwa ihe oyiyi nkịtị nke igwu ala gburugburu osisi ahụ, n’enweghị ịkọwapụta nzube ọrụ ahụ karịa ihe odide ahụ.
- source_word: βάλω κόπρια
  choice: tinye nsị anụ
  rationale: κόπρια bụ nsị a na-eji eme ka ala maa nri; ‘nsị anụ’ na-echekwa ihe onyonyo doro anya nke okwu Grik karịa okwu izugbe dịka ‘fatịlaịza.’
theological_decisions:
- issue: Ntugharị Κύριε mgbe onye ọrụ ubi na-agwa onye nwe ubi okwu n’ilu
  choice: Nna m ukwu
  alternative: Onyenwe m
  rationale: N’ebe a, Κύριε bụ aha nkwanye ùgwù nye onye nwe ubi n’ime ilu. ‘Nna m ukwu’ bụ okwu Igbo dị ndụ ma dị ùgwù, ma ọ naghị ekpebi na okwu ahụ bụ aha nsọ e ji akpọ Chineke.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji ‘nsị anụ’ chekwaa ịdị nkịtị na ihe oyiyi ọrụ ugbo dị n’odide Grik; e tinyere nkọwa ala ala maka okwu izugbe.
