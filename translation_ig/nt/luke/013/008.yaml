    text: Ma ọ bụ, “tinye fatịlaịza.” N’ụzọ kpọmkwem, okwu Grik ahụ pụtara “nsị anụ.”
    reason: lexical_alternative
  revision_rationale: The revision changes the digging verb from a completed form to a prospective form corresponding to the Greek future subjunctive. It also expresses the agricultural application of manure naturally in Igbo and replaces the footnote with a precise general alternative, while preserving the source’s concrete image of manure.
