- from: Mgbe ahụ, ọ sịrị onye na-elekọta ubi vaịn[a], ‘Lee, kemgbe afọ atọ ka m na-abịa achọ mkpụrụ n’osisi fiig a, ma ahụghị m nke ọ bụla. Gbutuo ya. Gịnị mere ọ ga-eji nọgide na-eme ka ala a ghara ịmị mkpụrụ?’
  to: Mgbe ahụ, ọ sịrị onye na-arụ ọrụ n’ubi vaịn[a], ‘Lee, afọ atọ ugbu a ka m na-abịa achọ mkpụrụ n’osisi fiig a, ma anaghị m ahụ nke ọ bụla. Gbutuo ya. Gịnị mere o ji na-emekwa ka ala ahụ ghara ịmị mkpụrụ[b]?’
  rationale: Ndozigharị a na-eme ka ἀμπελουργός bụrụ aha ọrụ kpọmkwem, na-egosipụta kaị dịka «kwa» n’ime ajụjụ ahụ, ma na-echekwa omume a na-eme ugboro ugboro nke ngwaa Grik dị ugbu a. E tinyere ndetu ala n’ebe καταργεῖ dị, ya bụ n’ebe nghọta lexical ọzọ a kpọtụrụ aha dị, ebe a hapụrụ ndetu maka ἀμπελουργός n’ebe akara ya kwesịrị ịdị.
