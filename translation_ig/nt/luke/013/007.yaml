source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị onye na-arụ ọrụ n’ubi vaịn[a], ‘Lee, afọ atọ ugbu a ka m na-abịa achọ mkpụrụ n’osisi fiig a, ma anaghị m ahụ nke ọ bụla. Gbutuo ya. Gịnị mere o ji na-emekwa ka ala ahụ ghara ịmị mkpụrụ[b]?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-elekọta ubi vaịn.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Gịnị mere o ji emekwa ka ala ahụ ghara ịba uru?” Okwu Grik ahụ pụrụ ịpụta ime ka ala ghara ịrụpụta ihe ma ọ bụ ghara ịba uru, ọ bụghị naanị iji ebe dị n’ala ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: onye na-elekọta ubi vaịn
  rationale: Ọ bụ onye na-arụ ọrụ ma na-elekọta ubi vaịn; okwu a doro ndị na-agụ Igbo anya ma chekwaa ọnọdụ ubi vaịn ahụ.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: Ọ na-akpọ uche onye na-ege ntị n'ụzọ siri ike ma bụrụ okwu Igbo dị ugbu a na nke dị ùgwù.
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: kemgbe afọ atọ
  rationale: Ọ na-egosi oge malitere n’oge gara aga wee ruo ugbu a.
- source_word: ἔρχομαι ζητῶν
  choice: ka m na-abịa achọ
  rationale: Ụdị a na-egosi na ọ na-abịa ugboro ugboro ịchọ mkpụrụ n’ime afọ atọ ahụ.
- source_word: καρπὸν
  choice: mkpụrụ
  rationale: N’ilu a, ọ bụ mkpụrụ osisi n’echiche ọrụ ugbo; e tinyebeghị nkọwa ime mmụọ n’ime ntụgharị ahụ.
- source_word: συκῇ
  choice: osisi fiig
  rationale: Nke a bụ aha osisi ahụ n’ụzọ doro anya n’Igbo nke oge a.
- source_word: οὐχ εὑρίσκω
  choice: ahụghị m nke ọ bụla
  rationale: Ọ na-achịkọta nchọgharị ndị ahụ niile na-enweghị ihe a hụrụ; Igbo na-eji ụdị gara aga mee nke a n'ụzọ ebumpụta ụwa.
- source_word: ἔκκοψον
  choice: Gbutuo ya
  rationale: Ọ bụ iwu kpọmkwem ka e gbutuo osisi ahụ.
- source_word: ἱνατί
  choice: Gịnị mere
  rationale: Ajụjụ a na-achọ ihe kpatara ọnọdụ ahụ.
- source_word: καὶ
  choice: nọgide
  rationale: N’usoro ajụjụ Igbo a, echiche mgbakwunye na-adịgide adịgide nke καί na-apụta site n’ịsị na osisi ahụ ka na-akpata nsogbu ọzọ, ọ bụghị naanị na ọ naghị amị mkpụrụ.
- source_word: γῆν
  choice: ala a
  rationale: N’ọnọdụ ọrụ ugbo a, ‘ala’ gụnyere ala ubi ma ọ bụ ájá osisi ahụ na-eto n’ime ya.
- source_word: καταργεῖ
  choice: na-eme ka ala a ghara ịmị mkpụrụ
  rationale: Okwu Grik ahụ nwere ike ịpụta ime ka ala ghara ịba uru ma ọ bụ ghara ịmị mkpụrụ, ọ bụghị naanị ịnọchi ebe.
theological_decisions:
- issue: Ihe oyiyi ilu ahụ ma ọ bụ nkọwa ime mmụọ kpọmkwem
  choice: Idobe asụsụ ọrụ ugbo ahụ dịka ọ dị n’ilu ahụ
  alternative: Ịsụgharị ya n’ụzọ ga-akọwa enweghị mkpụrụ dịka enweghị mkpụrụ ime mmụọ
  rationale: Amaokwu ahụ bụ akụkụ nke ilu; ntụgharị ahụ ekwesịghị itinye nkọwa nkà mmụta okpukpe n’ime okwu Jizọs n’onwe ya.
- issue: Uche abụọ dị na καταργεῖ
  choice: na-eme ka ala a ghara ịmị mkpụrụ
  alternative: na-eji ala a emefusị
  rationale: Nhọrọ bụ isi na-egosipụta ike okwu ahụ nke ime ka ala ghara ịrụpụta ihe, ebe ndetu ala na-echekwa nghọta nke iji ebe ma ọ bụ akụ ala emefusị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ùgwù. E chekwara okwu ọrụ ugbo nke ilu ahụ, a zerekwa itinye nkọwa ụka ma ọ bụ ozizi pụrụ iche n’ime amaokwu ahụ.
