review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the locative ‘there,’ the paired images of weeping and gnashing, the future scene introduced by ‘when,’ the named patriarchs and all the prophets in God’s kingdom, and the contrasting exclusion of the hearers. The final passive action should be explicitly future in Igbo to reflect the future-oriented scene, while retaining the force of exclusion.
  naturalness: The sentence is generally clear Standard Igbo. ‘ịta ikikere eze’ is the established and natural expression for ‘gnashing of teeth’; ‘ịta iké eze’ is not the appropriate expression here. Adding ‘ga-’ to the passive final clause makes the sequence natural and unambiguously future.
  terminology: ‘N’ebe ahụ,’ ‘akwa ákwá,’ ‘alaeze Chineke,’ and the selected Igbo forms of Abraham, Isaac, and Jacob are suitable. ‘Ikikere eze’ should replace ‘iké eze.’
  issues:
  - severity: medium
    issue: ‘iké eze’ in the rendering of βρυγμὸς τῶν ὀδόντων
    rationale: The conventional and semantically appropriate Standard Igbo expression is ‘ịta ikikere eze’ (gnashing of teeth). The current wording does not convey the expression reliably.
  - severity: low
    issue: The final passive clause lacks explicit future marking
    rationale: ‘A ga-achụpụ’ naturally matches the future judgment scene and the Greek participle’s relation to the future main clause, without changing the meaning.
  revised_text: N’ebe ahụ, a ga-akwa ákwá ma taakwa ikikere eze[a], mgbe unu hụrụ Ebreham na Aịzik na Jekọb na ndị amụma niile n’alaeze Chineke, ma a ga-achụpụ unu onwe unu n’èzí.
