id: LUK.13.28
reference: Luke 13:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: ig
  text: N’ebe ahụ, a ga-akwa ákwá ma taakwa ikikere eze[a], mgbe unu hụrụ Ebreham na Aịzik na Jekọb na ndị amụma niile n’alaeze Chineke, ma a ga-achụpụ unu onwe unu n’èzí.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ebe ahụ ka ịkwa ákwá na ịta ikikere eze ga-adị.”
    reason: Nhazi okwu Grik nwere ike ikwe ka e jikọta ‘n’ebe ahụ’ na okwu niile na-esochi ya; nsụgharị bụ isi na-enye otu echiche ahụ n’Igbo dị mfe.
lexical_decisions:
- source_word: ἐκεῖ
  choice: N’ebe ahụ
  rationale: Na-egosi kpọmkwem ebe a ga-anọ n’ọnọdụ nchụpụ na ikpe; ọ bụkwa Igbo doro anya.
- source_word: ὁ κλαυθμὸς
  choice: a ga-akwa ákwá
  rationale: Na-egosipụta ịkwa ákwá nke ahụhụ n’asụsụ Igbo nkịtị, n’etinyeghị nkọwa karịrị okwu Grik.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: taakwa iké eze
  rationale: Akpaalaokwu Igbo a na-aghọta nke ọma maka ịta iké eze n’ihi ahụhụ ma ọ bụ iwe; ọ na-edobe ihe oyiyi dị na Grik.
- source_word: ὅταν ὄψησθε
  choice: mgbe unu hụrụ
  rationale: Na-edobe ọnọdụ oge nke ὅταν na subjunctive, ma na-ada nke ọma n’Igbo maka ihe ga-eme n’ọdịnihu.
- source_word: πάντας τοὺς προφήτας
  choice: ndị amụma niile
  rationale: Na-edobe πάντας, ‘niile,’ na-enweghị ibelata ike okwu ahụ.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: n’alaeze Chineke
  rationale: Nsụgharị a maara nke ọma ma kwekọọ n’usoro okwu banyere ọchịchị/alaeze Chineke.
- source_word: ὑμᾶς δὲ
  choice: ma ... unu onwe unu
  rationale: ‘Ma’ na-egosi ọdịiche nke δέ, ebe ‘unu onwe unu’ na-eweta nkwusiri ike nke nnọchiaha ὑμᾶς.
- source_word: ἐκβαλλομένους ἔξω
  choice: a chụpụ ... n’èzí
  rationale: ‘Chụpụ’ na-egosi nchụpụ siri ike nke ἐκβάλλω, ‘n’èzí’ na-edobekwa ἔξω kama iwepụ ya dị ka ihe a ghọtara naanị.
theological_decisions:
- issue: Ụdị ihe oyiyi nke ikpe
  choice: Idobe okwu doro anya banyere ịkwa ákwá, ịta iké eze, na ịchụpụ n’èzí.
  alternative: Ịkọwa ya dịka ‘oke mwute’ ma ọ bụ ‘ikpe ikpeazụ.’
  rationale: Amaokwu ahụ na-egosi ahụhụ na nchụpụ n’alaeze Chineke, ma ọ naghị akọwa usoro ozizi niile banyere ikpe ikpeazụ; ya mere, e doghị ihe karịrị ihe odide ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Ebreham,’ ‘Aịzik,’ na ‘Jekọb’ dịka ụdị aha ndị a na-ahụkarị n’Igbo. E debere ihe oyiyi ikpe ahụ n’enweghị ime ka ọ dị nro ma ọ bụ itinye nkọwa ụka pụrụ iche.
