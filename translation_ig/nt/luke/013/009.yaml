review_pass:
  verdict: approve
  source_fidelity: The Igbo preserves the conditional contrast (κἂν μὲν ... εἰ δὲ μήγε), the agricultural idiom of bearing fruit, the deliberately nonspecific temporal phrase εἰς τὸ μέλλον, and the future action of cutting down the fig tree. “N’oge na-abịa” appropriately avoids importing “next year” into the main text.
  naturalness: The wording is clear, idiomatic Standard Igbo, and the register suits a concise parabolic saying. “Ọ mịa mkpụrụ” and “ị ga-egbutu ya” are natural agricultural expressions.
  terminology: 'Key imagery is retained consistently: “mkpụrụ” for καρπός and “egbutu” for ἐκκόπτω. The feminine Greek pronoun is naturally rendered as the inanimate “ya,” referring to the tree. The footnote accurately identifies “n’afọ ọzọ” as an interpretive contextual specification rather than the explicit wording of this verse.'
