  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: ig
  text: Ọ bụrụkwa na ọ mịa mkpụrụ n’oge na-abịa—ọ dị mma; ma ọ bụrụ na ọ mịghị[a], ị ga-egbutu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’afọ ọzọ”; ụfọdụ nsụgharị na-etinye oge a kapịrị ọnụ site n’amaokwu bu ụzọ, ma okwu Grik dị n’ebe a pụtara n’ụzọ nkịtị “maka ọdịnihu” ma ọ bụ “n’oge na-abịa.”
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: Ọ bụrụkwa na
  rationale: κἄν (καί + ἐάν) jikọtara okwu a na nke bu ya ụzọ ma webata ọnọdụ; “Ọ bụrụkwa na” na-egosipụta njikọ ahụ na ọnọdụ ahụ n’Igbo dị mfe.
- source_word: ποιήσῃ καρπὸν
  choice: ọ mịa mkpụrụ
  rationale: N’ihe gbasara osisi, ποιέω na καρπός pụtara ịmị mkpụrụ. Nke a bụ ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa ma na-edobe ihe atụ ọrụ ubi ahụ.
- source_word: εἰς τὸ μέλλον
  choice: n’oge na-abịa
  rationale: Nkebiokwu Grik ahụ pụtara n'ụzọ sara mbara “maka ọdịnihu” ma ọ bụ “n’oge na-abịa”; nhọrọ a anaghị etinye “n’afọ ọzọ” n’amaokwu ebe Grik ekwughị ya kpọmkwem.
- source_word: εἰ δὲ μήγε
  choice: ma ọ bụrụ na ọ mịghị
  rationale: Nke a na-egosipụta ọdịiche nke δέ ma mee ka ihe a na-agọnahụ—ịmị mkpụrụ—doo anya n’Igbo.
- source_word: ἐκκόψεις αὐτήν
  choice: ị ga-egbutu ya
  rationale: N’ọnọdụ ilekọta osisi a, ἐκκόπτω pụtara igbutu osisi ahụ; “ị ga-egbutu ya” na-edobe ihe oyiyi ahụ na onye a na-agwa okwu n’otu onye.
theological_decisions:
- issue: Oge ikpe e yigharịrị n’ilu ahụ
  choice: E debere okwu oge ahụ dịka “n’oge na-abịa,” na-enweghị ịkọwa ya kpọmkwem dịka “n’afọ ọzọ.”
  alternative: Ịsụgharị εἰς τὸ μέλλον dịka “n’afọ ọzọ,” site n’ịdabere n’okwu banyere afọ dị n’amaokwu bu ụzọ.
  rationale: Amaokwu Grik a anaghị ekwu “n’afọ ọzọ” kpọmkwem, kama ọ na-ekwu banyere oge na-abịa n’ụzọ sara mbara. Nke a na-echekwa ọnọdụ a na-amaghị kpọmkwem ma na-ahapụkwa ịdọ aka ná ntị banyere ikpe e yigharịrị ma nke ka nwere ike ịbịa.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ọ mịa mkpụrụ” bụ okwu ọrụ ubi a na-ejikarị eme ihe; “n’oge na-abịa” na-echekwa obosara na ntakịrị edoghị anya nke Grik.
