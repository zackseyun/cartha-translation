revisions:
- from: Ma otu ọ dị, aghaghị m ịga n’ihu n’ụzọ m taa, echi, na n’ụbọchị na-esote[b], n’ihi na ọ gaghị ekwe omume[a] ka onye amụma laa n’iyi n’èzí Jerusalem.
  to: N’agbanyeghị nke a, aghaghị m ịga n’ihu taa, echi, na n’ụbọchị na-esote[b], n’ihi na ọ gaghị ekwe omume[a] ka onye amụma laa n’iyi n’èzí Jerusalem.
  rationale: The revision preserves the Greek sequence and ambiguity while using more idiomatic Standard Igbo. It removes an unexpressed possessive element from the travel verb and repairs the lexical-alternative footnote so that it is grammatical and accurately scoped. No doctrinal interpretation is added.
