id: LUK.13.33
reference: Luke 13:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: ig
  text: N’agbanyeghị nke a, aghaghị m ịga n’ihu taa, echi, na n’ụbọchị na-esote[b], n’ihi na ọ gaghị ekwe omume[a] ka onye amụma laa n’iyi n’èzí Jerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ pụghị ịdị otú ahụ” ma ọ bụ “ọ bụ ihe a na-apụghị iche n’echiche,” ka onye amụma laa n’iyi n’èzí Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Okwu a, “taa, echi, na n’ụbọchị na-esote,” nwere ike ịbụ akpaalaokwu na-egosi obere oge ma ọ bụ usoro a kara aka, kama ịbụ kpọmkwem ụbọchị kalenda atọ.
    reason: cultural_note
lexical_decisions:
- source_word: πλὴν
  choice: Ma otu ọ dị
  rationale: Na-egosi ntụgharị ma ọ bụ nkwụsi ike megide ihe e kwuru tupu ya, n’ụzọ Igbo dị ugbu a ma dị ugwu.
- source_word: δεῖ με
  choice: aghaghị m
  rationale: Na-echekwa echiche nke ihe dị mkpa ma ọ bụ iwu siri ike n’ebughị ụzọ kọwaa ma ọ bụ kpebie na ọ bụ kpọmkwem iwu Chineke.
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: taa, echi, na n’ụbọchị na-esote
  rationale: Na-echekwa usoro oge atọ nke Grik; nkọwa ala peeji na-egosi na ọ pụkwara ịbụ akpaalaokwu maka obere oge a kara aka.
- source_word: πορεύεσθαι
  choice: ịga n’ihu n’ụzọ m
  rationale: Na-egosi ịga ma ọ bụ ịga n’ihu n’ije, ọ bụghị naanị mmegharị nkịtị.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Na-ewebata ihe kpatara mkpa ahụ e kwuru.
- source_word: οὐκ ἐνδέχεται
  choice: ọ gaghị ekwe omume
  rationale: Na-echekwa okwu gbasara ihe na-apụghị ime ma na-ahapụkwa ohere maka nghọta nke ihe a na-apụghị iche n’echiche ma ọ bụ nkwulu dị n’okwu ahụ.
- source_word: προφήτην
  choice: onye amụma
  rationale: 'Aha otu onye na-enweghị artikel na-arụ ọrụ n’ozuzu: onye amụma ọ bụla dị ka ụdị mmadụ.'
- source_word: ἀπολέσθαι
  choice: laa n’iyi
  rationale: Na-echekwa ụda siri ike na obosara pụtara ‘ịla n’iyi, ịnwụ, ma ọ bụ ibibi,’ n’akọwaghị ya naanị dị ka igbu mmadụ.
- source_word: ἔξω Ἰερουσαλήμ
  choice: n’èzí Jerusalem
  rationale: Ntụgharị doro anya nke okwu ọnọdụ ebe ahụ.
theological_decisions:
- issue: Ike okwu Jizọs na onye amụma ịla n’iyi n’èzí Jerusalem
  choice: E depụtara ya dịka ihe na-agaghị ekwe omume, ma e tinyeghị nkọwa na-eme ya nkwupụta metafiziks zuru oke.
  alternative: A pụrụ ịsụ ya ‘ọ bụ ihe a na-apụghị iche n’echiche’ iji mee ka njakịrị ilu ma ọ bụ nkwulu ya pụta ìhè.
  rationale: οὐκ ἐνδέχεται nwere ike igosi ihe na-agaghị ekwe omume, ihe na-ekwesịghị ịdị, ma ọ bụ ihe a na-apụghị iche n’echiche. Ntụgharị a na-echekwa esemokwu ahụ n’etinyeghị nkọwa otu ozizi n’ime ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ ‘aghaghị m’ maka mkpa siri ike, ‘ịga n’ihu n’ụzọ m’ maka mmegharị na-aga n’ihu, na ‘laa n’iyi’ iji chekwaa obosara okwu Grik. E debere akara ala peeji [a] na [b] n’isiokwu bụ isi.
