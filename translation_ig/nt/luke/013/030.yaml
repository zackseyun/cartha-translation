id: LUK.13.30
reference: Luke 13:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: ig
  text: Ma lee, e nwere ndị ikpeazụ ga-abụ ndị mbụ, e nwekwara ndị mbụ ga-abụ ndị ikpeazụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ okwu Igbo dị nkenke ma kwanyere ugwu nke na-adọta uche onye na-ege ntị, na-enweghị ịdị ochie ma ọ bụ ịgbakwunye nkọwa.
- source_word: ἔσχατοι
  choice: ndị ikpeazụ
  rationale: Ọ na-egosi ndị nọ n'ọnọdụ ikpeazụ ma na-echekwa ọdịiche doro anya ya na “ndị mbụ”; a sụgharịghị ya “ndị kacha nta,” nke nwere ike ịgbakwunye echiche ọzọ.
- source_word: πρῶτοι
  choice: ndị mbụ
  rationale: Nke a bụ ụzọ kpọmkwem na nke e ji eme ihe n'Igbo maka ndị nọ n'ọnọdụ mbụ, ma na-adaba n'usoro okwu ntụgharị a.
- source_word: οἳ ἔσονται
  choice: ga-abụ ndị
  rationale: “Ga-abụ” na-egosipụta ọdịnihu nke ἔσονται nke ọma, ebe “ndị” na-ejikọta nkebiokwu ahụ n'ụzọ Igbo si aga nke ọma.
- source_word: εἰσὶν
  choice: e nwere
  rationale: “E nwere” na-echekwa ike existential nke εἰσὶν ma na-ada ka Igbo nkịtị na nke doro anya.
- source_word: καὶ
  choice: ma; e nwekwara
  rationale: “Ma” na mmalite na-ejikọta amaokwu a na ihe bu ya ụzọ ma dọta uche; “e nwekwara” na nkebi nke abụọ na-echekwa njikọ na nhazi yiri ibe ya nke okwu Grik.
theological_decisions:
- issue: Ókè nke okwu banyere mgbanwe ọnọdụ
  choice: E debere ya dịka ụkpụrụ sara mbara banyere ndị ikpeazụ ịghọ ndị mbụ na ndị mbụ ịghọ ndị ikpeazụ.
  alternative: Ịkọwa ya kpọmkwem dịka ndị mba ọzọ na ndị Juu, ndị dị umeala n'obi na ndị mpako, ma ọ bụ ọkwa n'ikpeazụ.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu metụtara ịbanye n'alaeze Chineke, ma okwu Grik n'onwe ya akọwaghị otu ìgwè pụrụ iche. Nsụgharị ahụ na-ahapụ obosara na esemokwu nkà mmụta okpukpe ahụ dịka ọ dị.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị mfe nghọta ma dịkwa nsọpụrụ. E chekwara nhazi abụọ na-emegiderịta onwe ha nke okwu mbụ ahụ, na-enweghị itinye nkọwa agbụrụ, mmekọrịta mmadụ, ma ọ bụ nke ikpeazụ n'ime amaokwu ahụ.
