revisions:
- from: Ọ na-agafe n’obodo ukwu na n’obodo nta dị iche iche, na-akụzi ihe, na-aga n’ihu n’ebe Jerusalem dị[a].
  to: Ọ na-agafe obodo ukwu na obodo nta, na-akụzi ihe, n’ụzọ ya gaa Jerusalem[a].
  rationale: The revision preserves the progressive narrative sense of διεπορεύετο through “na-agafe” and renders πορείαν ποιούμενος εἰς Ἱεροσόλυμα naturally as “n’ụzọ ya gaa Jerusalem” (“on his way toward Jerusalem”). This conveys directed, continuing travel without implying arrival. The footnote retains the more direct destination-oriented alternative.
