  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: ig
  text: Ọ na-agafe obodo ukwu na obodo nta, na-akụzi ihe, n’ụzọ ya gaa Jerusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maọbụ, “na-aga Jerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεπορεύετο
  choice: Ọ na-agafe
  rationale: Ụdị imperfect na-egosi njem na-aga n’ihu n’oge ahụ; “na-agafe” na-egosikwa na ọ na-esi n’ebe dị iche iche agafe.
- source_word: κατὰ πόλεις καὶ κώμας
  choice: n’obodo ukwu na n’obodo nta dị iche iche
  rationale: Κατά na accusative nwere echiche nkesa na ịgafe ebe dị iche iche. “Obodo ukwu” na “obodo nta” na-edobe ọdịiche dị n’etiti πόλεις na κώμας n’Igbo doro anya.
- source_word: διδάσκων
  choice: na-akụzi ihe
  rationale: Present participle a na-akọ ọrụ ọ na-arụ ka njem ahụ na-aga n’ihu, n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: πορείαν ποιούμενος
  choice: na-aga n’ihu
  rationale: Akpaalaokwu a na-egosi na ọ na-eme njem ya ma na-aga n’ihu ruo ebe ọ na-ezube; okwu a bụ Igbo eke nke na-ezere nsụgharị siri ike n’ụzọ nkịtị.
- source_word: εἰς Ἱεροσόλυμα
  choice: n’ebe Jerusalem dị
  rationale: N’ahịrịokwu njem a, εἰς na-egosi ntụziaka nke njem na-aga n’ihu, ọ bụghị na ọ bịarutela ugbu a. Nhọrọ a na-egosipụta ‘toward Jerusalem,’ ebe nkọwa ala peeji na-edobe ‘to Jerusalem’ dị ka ụzọ ọzọ ziri ezi.
- source_word: Ἱεροσόλυμα
  choice: Jerusalem
  rationale: A na-eji aha obodo a a maara nke ọma n’Igbo, kama ịsụgharị ihe aha ahụ pụtara.
theological_decisions:
- issue: Ntụziaka nke njem Jizọs gaa Jerusalem
  choice: na-aga n’ihu n’ebe Jerusalem dị
  alternative: na-aga Jerusalem
  rationale: Nhọrọ bụ isi na-emesi njem ka na-aga n’ihu ike ma ghara ikwu na ọ bịarutela. A na-edobe nsụgharị kpọmkwem nke εἰς dịka ihe ọzọ n’ala peeji, n’enweghị itinye nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị mfe ma nwee ugwu. E ji “obodo ukwu” na “obodo nta” mee ka ndị nkịtị ghọta ọdịiche nke ebe obibi abụọ ahụ; e jikwara usoro ngwaa na-aga n’ihu gosipụta imperfect na participles Grik.
