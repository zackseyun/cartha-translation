  source_fidelity: The draft accurately renders the temporal emphasis (Ἐν αὐτῇ τῇ ὥρᾳ), the indefinite group of Pharisees, their approach and speech, the paired imperatives to leave and depart, the causal clause, and Herod's desire to kill Jesus. It does not add an assessment of the Pharisees' motive.
  naturalness: The Standard Igbo is clear and suitably dignified. “N’oge ahụ kpọmkwem,” “ụfọdụ ndị Farisii bịakwutere ya,” and the direct reported speech read naturally. The paired wording “Hapụ ebe a, si ebe a gawa” retains the two Greek imperatives and the directional sense of ἐντεῦθεν.
  terminology: “Ndị Farisii,” “Herọd,” “chọrọ,” and “igbu gị” are appropriate, recognizable Standard Igbo forms. The rendering avoids interpretive theological expansion.
