id: LUK.13.31
reference: Luke 13:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: ig
  text: N’oge ahụ kpọmkwem[a], ụfọdụ ndị Farisii bịakwutere ya, sị ya, “Hapụ ebe a, si ebe a gawa[b], n’ihi na Herọd chọrọ igbu gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “N’otu oge ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “Hapụ ebe a, gaa ebe ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: N’oge ahụ kpọmkwem
  rationale: Nke a na-egosi oge ahụ a kpọrọ aha nke ọma ma na-echekwa nkwusi ike dị na αὐτῇ, n’Igbo nkịtị na nke doro anya.
- source_word: προσῆλθάν
  choice: bịakwutere ya
  rationale: Ọ na-egosi na ha bịara nso n’ebe Jizọs nọ; ‘bịakwutere ya’ bụ ụzọ Igbo si ekwu ya nke ọma.
- source_word: τινες Φαρισαῖοι
  choice: ụfọdụ ndị Farisii
  rationale: ‘Ụfọdụ’ na-echekwa na e kwughị kpọmkwem ndị Farisii ndị ahụ bụ ndị nke, ma ọ naghị ada ka okwu ochie.
- source_word: λέγοντες αὐτῷ
  choice: sị ya
  rationale: A gbanwere participle ahụ ka ọ bụrụ ngwaa zuru ezu iji mee ka ahịrịokwu ahụ bụrụ Igbo dị mfe ma dị ndụ.
- source_word: Ἔξελθε
  choice: Hapụ ebe a
  rationale: Nke a na-enye iwu ka ọ pụọ n’ebe ahụ n’asụsụ Igbo doro anya, na-enweghị ụda mkparị gabigara ókè.
- source_word: καὶ πορεύου ἐντεῦθεν
  choice: si ebe a gawa
  rationale: Nke a na-echekwa echiche nke ịpụ ma gaa n’ihu site n’ebe ahụ, ma na-ekwe ka iwu abụọ dị na Grik pụta ìhè.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ịdọ aka ná ntị ahụ n’ụzọ Igbo doro anya.
- source_word: Ἡρῴδης
  choice: Herọd
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha ahụ n’ụdị dabara n’usoro ụda na odide Igbo.
- source_word: θέλει
  choice: chọrọ
  rationale: ‘Chọrọ’ na-egosi ọchịchọ, na-enweghị ịgbakwunye echiche siri ike nke na ọ kpebiela atụmatụ zuru ezu.
- source_word: ἀποκτεῖναι
  choice: igbu
  rationale: Ọ bụ okwu Igbo kpọmkwem na nke sara mbara maka ime ka mmadụ nwụọ, na-enweghị ịkọwa ya dị ka ikpe ọnwụ gọọmenti.
theological_decisions:
- issue: Ebumnobi ndị Farisii ji dọọ Jizọs aka ná ntị
  choice: E gosiri okwu ha dị ka ịdọ aka ná ntị, ma e kwughị ma ha ji ezi obi kwuo ya ma ọ bụ na ha nwere aghụghọ.
  alternative: Ịkọwa ha dị ka ndị chọrọ ịzọpụta Jizọs, ma ọ bụ dị ka ndị chọrọ iji egwu chụpụ ya.
  rationale: Ihe odide Grik na-akọ naanị ihe ha kwuru; ọ naghị ekpughe ebumnobi ha. Ya mere, nsụgharị ahụ na-ahapụ nghọta abụọ ahụ oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ iwu abụọ ahụ n’ụdị na-egosi ma ịhapụ ebe ahụ ma ịga n’ihu, a zerekwa ịkọwa ebumnobi ndị Farisii.
