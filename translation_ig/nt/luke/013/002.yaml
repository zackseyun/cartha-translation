id: LUK.13.2
reference: Luke 13:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: ig
  text: Ọ zara ha, sị, “Ùnu chere na ndị Galili ndị a bụ ndị mmehie karịa ndị Galili niile n’ihi na ha tara ahụhụ ihe ndị a?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Ọ zara ha, sị
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke kwesị ekwesị si ekwupụta usoro okwu Grik ahụ, ‘ọ zara wee sị ha,’ n’enweghị ikwughachi okwu n’ụzọ na-adịghị eke.
- source_word: ἐγένοντο
  choice: ghọrọ
  rationale: A họọrọ ‘ghọrọ’ iji chekwaa ọdịdị okwu Grik ginomai na nghọta ‘became,’ kama ịgbanwe ya ozugbo ka ọ bụrụ naanị ‘bụ.’
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους
  choice: ndị mmehie karịa ndị Galili niile
  rationale: '‘Karịa’ na-egosipụta ntụnyere nke παρὰ n’ebe a: ajụjụ ahụ bụ ma ha bụ ndị mmehie karịa ndị Galili ibe ha niile.'
- source_word: ταῦτα πεπόνθασιν
  choice: ha tara ahụhụ ndị a
  rationale: Perfect πεπόνθασιν na-ezo aka n’ahụhụ dakwasịrị ha; Igbo a na-enye nghọta ahụ n'ụzọ doro anya ma ghara ịkọwapụta ihe ahụhụ ahụ karịa isi mmalite.
theological_decisions:
- issue: Njikọ dị n’etiti mmehie na ahụhụ
  choice: E debere ya dịka ajụjụ Jizọs jụrụ, n’enweghị itinye azịza n’amaokwu a.
  alternative: Ịsụgharị ya n’ụzọ ga-egosi ozugbo na ahụhụ ha abụghị n’ihi mmehie pụrụ iche.
  rationale: Isi mmalite na amaokwu a na-ajụ ajụjụ ma ghara ịza ya ruo n’amaokwu na-esote; nsụgharị kwesịrị ichekwa usoro arụmụka na esemokwu nkà mmụta okpukpe ahụ.
- issue: ἐγένοντο dị ka ‘ghọrọ’ ma ọ bụ ‘bụ’
  choice: ghọrọ
  alternative: bụ
  rationale: ‘Ghọrọ’ na-esochi ọdịdị ngwaa Grik ma na-echekwa nghọta akwụkwọ ntụaka nyere, n’agbanyeghị na n’okwu a ọ pụrụ ịrụ ọrụ nso na ‘pụtara na ha bụ.’
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri “Ùnu” mee ajụjụ kpọmkwem; ahịrịokwu ahụ na-asọ nke ọma n’Igbo ma na-echekwa ntụnyere na ajụjụ nke Grik.
