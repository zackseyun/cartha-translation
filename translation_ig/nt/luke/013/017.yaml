  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: ig
  text: Mgbe ọ nọ na-ekwu ihe ndị a, ihere mere ndị niile na-emegide ya[a], ìgwè mmadụ ahụ dum nọkwa na-aṅụrị ọṅụ n’ihi ihe niile dị ebube[b] ọ na-eme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ndị na-emegide ya.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya ‘ihe niile dị ịtụnanya.’ N’asụsụ Grik, ọ bụ ‘ihe ndị dị ebube,’ okwu sara mbara nke pụrụ ịgụnye ọrụ ya dị ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: Mgbe ọ nọ na-ekwu ihe ndị a
  rationale: Nke a na-egosi na okwu ahụ na-aga n’ihu n’otu oge ahụ, dịka present participle dị na genitive absolute si dị.
- source_word: κατῃσχύνοντο
  choice: ihere mere
  rationale: Nkebiokwu Igbo a na-egosi ọnọdụ ihere nke dakwasịrị ha n’ihu ọha; ọ na-adabara imperfect ahụ n’enweghị asụsụ a manyere amanye.
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: ndị niile na-emegide ya
  rationale: Ọ na-echekwa ike omume na-aga n’ihu nke participle ἀντικείμενοι karịa iji naanị aha dịka ‘ndị iro ya.’
- source_word: πᾶς ὁ ὄχλος
  choice: ìgwè mmadụ ahụ dum
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ isi gosi na ìgwè mmadụ ahụ n’ozuzu ya niile mere otu ihe ahụ.
- source_word: ἔχαιρεν
  choice: nọkwa na-aṅụrị ọṅụ
  rationale: Ọ na-egosi ọṅụ na-aga n’ihu dịka imperfect Greek ahụ si egosi.
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: n’ihi ihe niile dị ebube
  rationale: ‘N’ihi’ na-egosi ihe kpatara ọṅụ ahụ, ebe ‘dị ebube’ na-echekwa obosara ἔνδοξος n’akọwaghị ya naanị dịka ọrụ ebube.
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: ọ na-eme
  rationale: Igbo na-ahọrọ ahịrịokwu active a nke ọma; ọ ka na-ekwu n’ụzọ doro anya na Jizọs bụ onye na-eme ihe ndị ahụ ma na-egosikwa omume na-aga n’ihu.
theological_decisions:
- issue: Ụdị ‘ihe dị ebube’ ndị a
  choice: ihe niile dị ebube
  alternative: ọrụ ebube niile; ihe niile dị ịtụnanya
  rationale: ἔνδοξος sara mbara karịa naanị ọrụ ebube. Nsụgharị a na-ahapụ ka okwu ahụ gụnye ọrụ dị ike, dị ebube, ma ọ bụ kwesịrị nsọpụrụ dịka ihe gbara ya gburugburu si dị.
- issue: Onye mere ihe ndị ahụ na τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: ọ na-eme
  alternative: ndị a na-eme site n’aka ya
  rationale: Ọ na-egosi Jizọs dịka onye na-eme ihe ndị ahụ, dịka ὑπό na genitive si egosi, n’etinyeghị echiche ọzọ banyere onye ọrụ n’etiti.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere aspect na-aga n’ihu n’ebe ọ dabara, ma zere ikwu kpọmkwem ‘ọrụ ebube’ ebe Greek hapụrụ okwu ahụ sara mbara. E tinyere akara nkọwa [a] n’akụkụ ‘ndị niile na-emegide ya’ na [b] n’akụkụ ‘ihe niile dị ebube,’ n’ihi na ebe ndị a bụ ebe nkọwa nke ọ bụla metụtara.
