  source_fidelity: 'Ihe odide ahụ na-anọchi anya usoro na echiche nke Grik nke ọma: ‘Mgbe ọ nọ na-ekwu’ na-egosi genitive absolute na present participle; ‘ìgwè mmadụ ahụ dum nọkwa na-aṅụrị ọṅụ’ na-egosi imperfect ἔχαιρεν; ‘ihe niile dị ebube ọ na-eme’ na-edobe obosara ἐνδόξοις na onye omume ὑπ’ αὐτοῦ. Otú ọ dị, nkọwa ala peeji a ugbu a na-atụgharị ‘ndị na-emegide ya’ ka ‘ndị iro ya,’ nke na-agbasawanye ἀντικείμενοι karịa ihe okwu ahụ kwuru.'
