review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Greek: κύριος is retained as a title, the plural rebuke is forceful, the distributive ‘each of you’ is preserved, and the sequence of untying, leading away, and giving water is clear. However, the referent of the pronoun after the coordinated ‘ehi ... ma ọ bụ ịnyịnya ibu’ is grammatically awkward in Igbo, since ‘ya’ can sound as though it refers only to the donkey. Recasting with a plural livestock noun preserves the generic alternative without this ambiguity.'
  naturalness: The wording is largely fluent Standard Igbo. ‘n’ụbọchị izu ike’ is understandable, but ‘n’ụbọchị Sabat’ is the more established biblical and precise designation for τῷ σαββάτῳ. ‘ebe a na-enye anụ ụlọ nri’ is natural but broad; the note can retain the trough/manger alternative.
  terminology: ‘Onyenwe anyị,’ ‘Ndị ihu abụọ,’ ‘ehi,’ and ‘ịnyịnya ibu’ are appropriate. ‘Ụbọchị Sabat’ better preserves the conventional biblical term without reducing it to a general day of rest. The revised footnote accurately identifies φάτνη as a feeding trough while retaining ‘manger’ as an alternative.
  issues:
  - severity: low
    issue: ‘n’ụbọchị izu ike’ is less precise than the established biblical term for Sabbath.
    rationale: The Greek specifies the Sabbath, not merely a day of rest. ‘n’ụbọchị Sabat’ is standard, natural biblical Igbo and maintains the referential specificity.
  - severity: medium
    issue: Singular pronouns following ‘ehi ya ma ọ bụ ịnyịnya ibu ya’ can attach awkwardly to only the immediately preceding animal.
    rationale: The Greek’s singular animal is distributive under ‘each’; Igbo can express this idiomatically and unambiguously by using ‘anụ ụlọ ya’ after naming the alternatives, then plural concord for the successive actions.
  revised_text: Ma Onyenwe anyị zara ya sị, “Ndị ihu abụọ! Ọ̀ bụghị na onye ọ bụla n’ime unu na-atọpụ ehi ya ma ọ bụ ịnyịnya ibu ya n’ebe a na-enye anụ ụlọ nri[a] n’ụbọchị Sabat, duru anụ ụlọ ya pụọ ka o nye ha mmiri ha ṅụọ?”
  revised_footnotes:
