id: LUK.13.15
reference: Luke 13:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: ig
  text: Ma Onyenwe anyị zara ya sị, “Ndị ihu abụọ! Ọ̀ bụghị na onye ọ bụla n’ime unu na-atọpụ ehi ya ma ọ bụ ịnyịnya ibu ya n’ebe a na-enye anụ ụlọ nri[a] n’ụbọchị Sabat, duru anụ ụlọ ya pụọ ka o nye ha mmiri ha ṅụọ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a nwekwara ike ịpụta ebe ma ọ bụ ihe e ji enye anụ ụlọ nri, dịka ihe e ji adọba nri anụ ụlọ n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Aha a na-ejikarị akọwa κύριος mgbe ọ bụ aha nsọpụrụ e nyere Jizọs; ọ na-edebekwa mkpa aha ahụ nwere n’akụkọ Luk.
- source_word: Ὑποκριταί
  choice: Ndị ihu abụọ
  rationale: Ọ bụ ịkpọ ọtụtụ mmadụ okwu n’ụzọ ịbara ha mba; okwu a bụ nke doro ndị Igbo taa anya ma na-edobe ịdị nkọ nke okwu Grik.
- source_word: ἕκαστος ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: Nke a na-edobe echiche nke onye nke ọ bụla n’ime ndị a na-agwa okwu.
- source_word: τῷ σαββάτῳ
  choice: n’ụbọchị izu ike
  rationale: Ọ bụ ụzọ a maara nke ọma n’Igbo isi kpọọ ụbọchị Sabat ma na-egosi oge ihe ahụ na-eme.
- source_word: λύει
  choice: atọpụ
  rationale: N’ọnọdụ a, anụ ụlọ ahụ kegidere n’ebe a na-enye ya nri, ya mere ‘atọpụ’ bụ okwu doro anya.
- source_word: βοῦν
  choice: ehi
  rationale: ‘Ehi’ bụ okwu Igbo nkịtị maka anụ ụlọ bovine a kpọrọ ebe a, n’enweghị ịgbakwụnye nkọwa mmekọahụ ma ọ bụ ọrụ anụmanụ ahụ nke Grik na-ekwughị.
- source_word: ὄνον
  choice: ịnyịnya ibu
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka donkey.
- source_word: φάτνης
  choice: ebe a na-enye anụ ụlọ nri
  rationale: Ọ na-enye ihe okwu ahụ pụtara n’ọnọdụ a n’ụzọ dị mfe ma ghara ime ka ọ bụrụ naanị otu ụdị ihe e ji enye nri, ebe okwu Grik nwere obosara ụfọdụ.
- source_word: ἀπαγαγὼν
  choice: duru ya pụọ gaa
  rationale: 'Nke a na-egosi usoro omume ahụ: a tọpụ anụmanụ ahụ, e mesịa duru ya pụọ.'
- source_word: ποτίζει
  choice: nye ya mmiri ka ọ ṅụọ
  rationale: Nke a bụ ụzọ Igbo sitere n’okike isi kwuo inye anụmanụ ihe ọṅụṅụ, ma na-edobe ebumnuche nke iduru ya pụọ.
theological_decisions:
- issue: Aha akụkọ κύριος nke e ji kpọọ Jizọs
  choice: Onyenwe anyị
  alternative: onye nwe ya
  rationale: N’akụkọ Luk, κύριος bụ aha nsọpụrụ nwere mkpa gbasara onye Jizọs bụ. ‘Onyenwe anyị’ na-edobe ibu aha ahụ n’enweghị ịgbakwunye nkọwa ozizi na-adịghị n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ajụjụ na-amalite na ‘Ọ̀ bụ na ... anaghị’ na-edobe ụdị ajụjụ Grik nke na-atụ anya azịza nkwenye. Akara ntụaka [a] dị ozugbo n’ebe okwu φάτνη pụtara, ka nkọwa ya kwekọọ na okwu ọ na-akọwa.
