revisions:
- from: Ma Onyenwe anyị zara ya sị, “Ndị ihu abụọ! Ọ̀ bụ na onye ọ bụla n’ime unu anaghị atọpụ ehi ya ma ọ bụ ịnyịnya ibu ya n’ebe a na-enye anụ ụlọ nri[a] n’ụbọchị izu ike, duru ya pụọ gaa nye ya mmiri ka ọ ṅụọ?”
  to: Ma Onyenwe anyị zara ya sị, “Ndị ihu abụọ! Ọ̀ bụghị na onye ọ bụla n’ime unu na-atọpụ ehi ya ma ọ bụ ịnyịnya ibu ya n’ebe a na-enye anụ ụlọ nri[a] n’ụbọchị Sabat, duru anụ ụlọ ya pụọ ka o nye ha mmiri ha ṅụọ?”
  rationale: The revision uses the conventional, source-specific ‘ụbọchị Sabat.’ It also avoids an unclear singular pronoun chain after the ox/donkey alternative by resuming with ‘anụ ụlọ ya’ and using plural agreement for the generic livestock. The footnote is adjusted to state clearly that φάτνη may denote a feeding place or feeding trough, without overcommitting to one disputed physical form.
