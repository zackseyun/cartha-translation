- from: Mba, ana m agwa unu; ma ọ bụrụ na unu echegharịghị, unu niile ga-alakwa n’iyi otu aka ahụ.[a]
  to: Mba, ana m asị unu; ma ọ bụrụ na unu echegharịghị, unu niile ga-ala n’iyi otú ahụ.[a]
  rationale: The revision replaces the non-idiomatic and redundant comparative wording with 'túzọ ahụ,' which naturally renders ὡσαύτως while leaving open the precise nature of the comparison. It also adopts the standard direct-speech formula 'ana m asị unu.' The footnote preserves the lexical alternative and contextual caution without claiming more than the Greek states.
