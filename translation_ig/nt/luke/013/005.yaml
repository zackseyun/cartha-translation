  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: ig
  text: Mba, ana m asị unu; ma ọ bụrụ na unu echegharịghị, unu niile ga-ala n’iyi otú ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-ala n’iyi n’otu ụzọ ahụ.” Okwu Grik a sụgharịrị “túzọ ahụ” pụrụ izo aka n’ikpe yiri nke dị n’ihe ndị e kwuru na mbụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: Mba
  rationale: Ọ bụ azịza na-ajụ echiche e zoro aka na ya n'okwu ndị bu ụzọ; “Mba” bụ okwu Igbo doro anya ma dịkwa ike n’enweghị ịgbakwunye nkọwa.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ ụzọ e si ekwu okwu n’Igbo nke oge a, ma ọ na-edobe onye na-ekwu okwu na ndị ọ na-agwa dịka Grik si mee.
- source_word: ἀλλ’ ἐὰν μὴ
  choice: ma ọ bụrụ na ...ghị
  rationale: Usoro a na-egosipụta ọnọdụ e wezụga nke siri ike; n’Igbo, “ma ọ bụrụ na ...ghị” na-ebute ya n'ụzọ ebumpụta ụwa.
- source_word: μετανοῆτε
  choice: unu echegharịghị
  rationale: “Ichegharị” n’ọnọdụ a na-egosi nchegharị n’ihu Chineke, ọ bụghị naanị ịgbanwe echiche; ọ na-edobe ịdị arọ nke ịdọ aka ná ntị ahụ.
- source_word: πάντες
  choice: unu niile
  rationale: 'Nke a na-edobe oke zuru ezu nke ịdọ aka ná ntị ahụ: onye ọ bụla n’ime ndị a na-agwa okwu.'
- source_word: ὡσαύτως
  choice: otu aka ahụ
  rationale: Ọ na-edobe ntụnyere ahụ n'ụzọ sara mbara, n’akọwaghị ma ihe e ji atụnyere bụ ụzọ, ịdị n’aka nke ikpe ahụ, ma ọ bụ ihe ọzọ.
- source_word: ἀπολεῖσθε
  choice: ga-alakwa n’iyi
  rationale: “Ịla n’iyi” na-egosi mbibi ma ọ bụ ịla n’iyi dị ukwuu, n’emeghị ka ihe okwu ahụ pụtara bụrụ naanị ọnwụ anụ ahụ.
theological_decisions:
- issue: Ihe nchegharị pụtara n’ịdọ aka ná ntị Jizọs
  choice: echegharị
  alternative: gbanwee obi unu; laghachikwute Chineke
  rationale: “Echegharị” na-edobe oku siri ike nke okwu Grik ahụ n’enweghị ime ka ọ bụrụ naanị mwute dị n’obi ma ọ bụ tinye nkọwa ozizi zuru ezu na amaokwu ahụ.
- issue: Ike nke ὡσαύτως ἀπολεῖσθε
  choice: ga-alakwa n’iyi otu aka ahụ
  alternative: ga-ala n’iyi n’otu ụzọ ahụ; ga-anwụkwa otú ahụ
  rationale: Ntụnyere ahụ doro anya, ma kpọmkwem ihe “otu aka ahụ” na-atụnyere edoghị anya kpamkpam. Nsụgharị a na-edobe esemokwu ahụ n’akọwaghị ya gabiga ihe Grik kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “unu” doo anya na a na-agwa ọtụtụ mmadụ okwu; e zere okwu ụka pụrụ iche ma debeghị nghọta nke ὡσαύτως n’otu ụzọ naanị.
