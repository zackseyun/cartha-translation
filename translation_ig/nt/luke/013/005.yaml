review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the emphatic negative, the conditional call to repentance, the inclusive scope of πάντες, and the grave future sense of ἀπολεῖσθε. However, the combination of ga-alakwa ('will also perish') with otu aka ahụ duplicates the single comparative adverb ὡσαύτως.
  naturalness: '''Otu aka ahụ'' is not the natural Standard Igbo expression for this comparative sense and may be understood literally as ''the same hand.'' ''Tụzọ ahụ'' is natural and appropriately retains the contextual comparison. ''Ana m asị unu'' is also the more idiomatic concise rendering of λέγω ὑμῖν in this solemn direct saying.'
  terminology: '''Echegharịghị'' is an appropriate Standard Igbo rendering of μετανοῆτε in this warning context. ''Ịla n’iyi'' suitably preserves the broad ruin/destruction force without reducing it to physical death.'
  issues:
  - severity: medium
    issue: The rendering of ὡσαύτως is unnatural and doubled.
    rationale: '''Ga-alakwa'' already contributes an ''also/likewise'' sense, while ''otu aka ahụ'' adds a second, non-idiomatic comparison. The Greek has one comparative adverb; ''túzọ ahụ'' renders it naturally without duplication.'
  - severity: low
    issue: '''Ana m agwa unu'' is less idiomatic here than ''Ana m asị unu.'''
    rationale: Both are intelligible, but 'ana m asị unu' is the normal direct-speech formula and better suits λέγω ὑμῖν.
  revised_text: Mba, ana m asị unu; ma ọ bụrụ na unu echegharịghị, unu niile ga-ala n’iyi otú ahụ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-ala n’iyi n’otu ụzọ ahụ.” Okwu Grik a sụgharịrị “túzọ ahụ” pụrụ izo aka n’ikpe yiri nke dị n’ihe ndị e kwuru na mbụ.
    reason: lexical_alternative
  revision_rationale: The revision replaces the non-idiomatic and redundant comparative wording with 'túzọ ahụ,' which naturally renders ὡσαύτως while leaving open the precise nature of the comparison. It also adopts the standard direct-speech formula 'ana m asị unu.' The footnote preserves the lexical alternative and contextual caution without claiming more than the Greek states.
