id: LUK.13.24
reference: Luke 13:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: ig
  text: “Gbalịsienụ ike ịbanye site n’ọnụ ụzọ dị warara[a], n’ihi na ana m agwa unu, ọtụtụ ndị ga-achọ ịbanye ma ha agaghị enwe ike.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ọnụ ụzọ ámá dị warara.” Okwu Grik Luk ji bụ “ọnụ ụzọ” (θύρα), ebe amaokwu yiri nke a na Matiu ji “ọnụ ụzọ ámá.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: Gbalịsie ike
  rationale: Ọ na-egosi ịgba mbọ siri ike na mgba a na-agba iji ruo ihe mgbaru ọsọ; ọ na-echekwa ịdị arọ nke iwu ahụ n’asụsụ Igbo dị ugbu a.
- source_word: εἰσελθεῖν
  choice: ịbanye
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwu banyere ịga n’ime ebe; e jikwa ya mee ihe n’ebe abụọ okwu ahụ pụtara.
- source_word: διὰ τῆς στενῆς θύρας
  choice: site n’ọnụ ụzọ dị warara
  rationale: θύρα pụtarakarị ọnụ ụzọ, ebe στενῆς na-akọwa ya dị ka nke dị warara. Nsụgharị a anaghị agwakọta okwu Luk na okwu ‘ọnụ ụzọ ámá’ dị na Matiu.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara iwu ahụ, nke a na-egosipụta nke ọma site na ‘n’ihi na’.
- source_word: πολλοί
  choice: ọtụtụ ndị
  rationale: Adjective ahụ na-anọchi anya mmadụ; ‘ọtụtụ ndị’ na-egosipụta nke a nke ọma n’Igbo.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a bụ usoro okwu Igbo dị ndụ ma kwanyere ugwu, nke na-echekwa okwu Jizọs gwara ọtụtụ mmadụ.
- source_word: ζητήσουσιν
  choice: ga-achọ
  rationale: ‘Ga-achọ’ na-echekwa isi echiche ζητέω ma mee ka ọdịiche dị n’etiti ịchọ na ịgbalịsi ike ghara ịla n’iyi.
- source_word: οὐκ ἰσχύσουσιν
  choice: ha agaghị enwe ike
  rationale: N’ebe a, ἰσχύω na-ekwu banyere inwe ikike imezu ihe; okwu a doro anya ma ghara ịkọwa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Mgbalị mmadụ na okwu gbasara nzọpụta
  choice: E chekwara iwu siri ike ahụ dịka ‘Gbalịsie ike’ n’enweghị ịkụzi na mgbalị ahụ bụ ụgwọ e ji azụta nzọpụta.
  alternative: ‘Gbaa mbọ ịbanye’ ma ọ bụ ‘Nwaa ịbanye.’
  rationale: Amaokwu ahụ n’onwe ya na-enye iwu ka mmadụ gbalịsie ike ma na-adọ aka ná ntị na ọtụtụ ndị ga-achọ ịbanye ma ha agaghị enwe ike. Nsụgharị ahụ na-ahapụ esemokwu a ka ọ dị, n’etinyeghị ozizi otu ụka banyere amara, ọrụ mmadụ, ma ọ bụ ikike Chineke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu, mee ihe. ‘Gbalịsie ike’ na-enye iwu ahụ ike kwesịrị ya; ‘ọnụ ụzọ dị warara’ na-agbaso mkpụrụokwu Luk kpọmkwem. Akara nkọwa ala peeji [a] dị n’ederede isi.
