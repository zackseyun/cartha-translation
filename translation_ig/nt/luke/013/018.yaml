source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: ig
  text: Ya mere, ọ nọ na-ekwu, “Alaeze Chineke[a] yiri gịnị, gịnịkwa ka m ga-eji tụnyere ya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọchịchị Chineke,” iji mesie ike na Chineke na-achị, kama ilekwasị anya n’ala ma ọ bụ ógbè ọ na-achị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ọ nọ na-ekwu
  rationale: Ụdị imperfect na-egosi okwu na-aga n'ihu n’akụkọ ahụ; ‘ọ nọ na-ekwu’ na-echekwa akụkụ a n’ụzọ Igbo nkịtị.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-ejikọta okwu a na ihe bu ya ụzọ ma na-egosi nsonaazụ ma ọ bụ ịga n’ihu n’echiche.
- source_word: Τίνι ... ὁμοία ἐστὶν
  choice: Alaeze Chineke yiri gịnị
  rationale: Nke a bụ ụzọ Igbo doro anya na nke e ji eme ihe mgbe a na-ajụ ihe ihe ọzọ yiri.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Alaeze Chineke
  rationale: Ọ bụ okwu Baịbụl a maara nke ọma, ma ọ ka nwere ike ịpụta ma ógbè ọchịchị Chineke ma ọchịchị ya n’onwe ya.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ jikọtara ajụjụ abụọ ahụ n’ụzọ Igbo dị mma ma chekwaa ọrụ njikọ καὶ.
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: gịnịkwa ka m ga-eji tụnyere ya
  rationale: Na-echekwa ajụjụ ntụgharị uche nke future ὁμοιώσω ma na-ada ka Igbo nke oge a.
theological_decisions:
- issue: Nsụgharị βασιλεία τοῦ θεοῦ
  choice: Alaeze Chineke
  alternative: ọchịchị Chineke
  rationale: ‘Alaeze Chineke’ na-echekwa okwu ihe atụ e ji mara ozizi na ilu Jizọs, ebe ihe odide ala peeji na-egosi na ọ pụkwara imesi omume Chineke nke ịchị achị ike.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta; a zere okwu ochie na nkọwa okpukpe nke otu ụka.
