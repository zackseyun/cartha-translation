  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: ig
  text: N’oge ahụ kpọmkwem, ụfọdụ ndị nọ n’ebe ahụ na-akọrọ ya banyere ndị Galili ahụ, ndị ọbara ha Paịlet gwakọtara na àjà ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “jikọtara ọbara ha na àjà ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρῆσαν
  choice: ụfọdụ ndị nọ n’ebe ahụ
  rationale: Ụdị ngwaa imperfect a na-akọwa na ụfọdụ ndị nọ ya mgbe ahụ, ọ bụghị na ha ka bịarutere.
- source_word: δέ
  choice: e gosighị ya iche n’Igbo
  rationale: Ọ bụ obere njikọ na-egosi ntụgharị n’okwu; nhazi ahịrịokwu Igbo na ọnọdụ ya na-enye ntụgharị ahụ n’enweghị ịgbakwunye okwu siri ike.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: N’oge ahụ kpọmkwem
  rationale: Nke a na-echekwa ike nke αὐτῷ na ntụaka ya n’oge a kapịrị ọnụ.
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: na-akọrọ ya
  rationale: Nke a bụ ụzọ Igbo dị ndụ isi kwuo na ha nọ na-enye ya akụkọ ma ọ bụ ozi.
- source_word: περὶ τῶν Γαλιλαίων
  choice: banyere ndị Galili ahụ
  rationale: περί na genitive na-egosi isiokwu nke akụkọ ahụ; ‘banyere’ dabara nke ọma.
- source_word: ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν
  choice: ndị Paịlet gwakọtara ọbara ha
  rationale: Nhazi a na-echekwa relative clause na okwu siri ike banyere ngwakọta ọbara ha.
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: na àjà ha
  rationale: ‘Na’ na-egosipụta μετά (‘with’), ebe ‘àjà ha’ na-ahapụ ụdị njikọ ha na àjà ndị ahụ ka ọ dị nkenke dịka Grik si mee.
theological_decisions:
- issue: Ihe mere n’akụkọ a na ihe omume Paịlet pụtara
  choice: E kwuru ya ozugbo dị ka Paịlet gwakọtara ọbara ndị Galili ahụ na àjà ha.
  alternative: Ịgbasa ya dịka ‘Paịlet gburu ha mgbe ha na-achụ àjà.’
  rationale: Grik anaghị akọwa kpọmkwem etu ihe ahụ si mee ma ọ bụ ihe ọ pụtara n’ụzọ mmụta okpukpe. Nsụgharị ahụ na-echekwa okwu ya dị egwu n’etinyeghị nkọwa ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke doro anya ma dị ùgwù. ‘Àjà’ bụ okwu a na-aghọta nke ọma maka θυσίαι; ahịrịokwu ahụ anaghị akọwa ma ha na-achụ àjà ahụ n’oge ahụ, ma ọ bụ naanị na àjà ndị ahụ bụ nke ha.
