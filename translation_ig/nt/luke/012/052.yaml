  to: 'N’ihi na malite ugbu a gaa n’ihu, a ga-enwe mmadụ ise n’otu ụlọ[a], ndị e kewara ekewa: mmadụ atọ megide mmadụ abụọ, mmadụ abụọ megidekwa mmadụ atọ.'
  rationale: The revision retains the draft’s accurate modern Standard Igbo and its lexical ambiguity for οἶκος. It changes only the expression for “divided” so that the completed passive state expressed by the Greek participle is overt and natural in Igbo.
