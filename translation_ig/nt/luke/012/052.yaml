source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: ig
  text: 'N’ihi na malite ugbu a gaa n’ihu, a ga-enwe mmadụ ise n’otu ụlọ[a], ndị e kewara ekewa: mmadụ atọ megide mmadụ abụọ, mmadụ abụọ megidekwa mmadụ atọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’otu ezinụlọ.” Okwu Grik ahụ pụrụ ịpụta ma ụlọ ahụ n’onwe ya ma ndị bi na ya dịka otu ezinụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: a ga-enwe
  rationale: Ọ bụ ọdịnihu nke εἰμί. N’ebe a, okwu Igbo a na-egosi n’ụzọ ebumpụta ụwa na mmadụ ise ga-adị n’otu ụlọ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejigide ọrụ nkọwa nke okwu a, nke na-ejikọta ya na ihe Jizọs kwuru tupu ya banyere nkewa.
- source_word: ἀπὸ τοῦ νῦν
  choice: malite ugbu a gaa n’ihu
  rationale: Nke a na-egosi oge na-amalite ugbu a ma na-aga n’ihu, n’Igbo doro anya ma bụrụkwa nke a na-asụ ugbu a.
- source_word: πέντε
  choice: mmadụ ise
  rationale: E tinyere “mmadụ” iji mee ka o doo anya na ọnụọgụ a na-ekwu maka ndị bi n’ụlọ, dị ka amaokwu na-esonụ gosiri.
- source_word: ἐν ἑνὶ οἴκῳ
  choice: n’otu ụlọ
  rationale: “Ụlọ” na-edobe isi okwu Grik, ma n’ọnọdụ a ọ pụkwara ịpụta ndị niile bi dịka otu ezinụlọ; e debere nghọta nke ọzọ n’ala ala peeji.
- source_word: διαμεμερισμένοι
  choice: kewara ekewa
  rationale: Nke a na-egosi ọnọdụ nkewa nke sitere n’ihe e mere, kwekọọ na participle zuru oke nke nọ n’ụdị nnara na Grik.
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: mmadụ atọ megide mmadụ abụọ
  rationale: “Megide” na-egosi mmegide dị n’etiti akụkụ abụọ ahụ n’ụzọ doro anya.
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: mmadụ abụọ megidekwa mmadụ atọ
  rationale: Nke a na-edobe nhazi na mmegide kwekọrọ na nkebi nke bu ya ụzọ.
theological_decisions:
- issue: Ma a ga-asụgharị οἶκος dịka ụlọ nkịtị ka ọ bụ dịka otu ezinụlọ
  choice: ụlọ
  alternative: ezinụlọ
  rationale: Amaokwu na-esonụ kpọrọ mmekọrịta ndị ezinụlọ aha, ya mere ihe a na-ekwu bụ ndị bi dịka ezinụlọ. Ma okwu Grik ahụ n’onwe ya pụtara “ụlọ” ma pụtakwa “ezinụlọ”; ya mere, e debere “ụlọ” n’ahịrị isi ma gosipụta nghọta nke ọzọ n’ala ala peeji ka a ghara idozi ihe okwu ahụ pụtara karịa ka isi mmalite siri kwuo.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Kewara ekewa” na-egosi ọnọdụ nkewa siri ike, ebe “megide” na-edobe mmegide doro anya nke ahịrịokwu Grik.
