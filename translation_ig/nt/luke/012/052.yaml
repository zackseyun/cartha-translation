    text: Ma ọ bụ, “n’otu ezinụlọ.” Okwu Grik ahụ pụrụ ịpụta ma ụlọ ahụ n’onwe ya ma ndị bi na ya dịka otu ezinụlọ.
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s accurate modern Standard Igbo and its lexical ambiguity for οἶκος. It changes only the expression for “divided” so that the completed passive state expressed by the Greek participle is overt and natural in Igbo.
