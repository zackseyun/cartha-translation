review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future/explanatory sense, the temporal phrase, the five persons in one house, and the reciprocal opposition of three and two. However, the Greek perfect passive participle διαμεμερισμένοι is more clearly represented in Igbo with an explicit passive relative clause.
  naturalness: The present wording is understandable, but “mmadụ ise kewara ekewa” is somewhat compressed and can sound like an unmarked descriptive sequence. “ndị e kewara ekewa” is clearer, more idiomatic, and explicitly states the resultant passive state.
  terminology: “ụlọ” appropriately preserves οἶκος, while the footnote correctly records “ezinụlọ” as a contextual lexical alternative. “megide” is a natural and accurate rendering of ἐπί with the dative in this contrastive construction.
  issues:
  - severity: low
    issue: The passive force of διαμεμερισμένοι is not explicit enough in “mmadụ ise kewara ekewa.”
    rationale: διαμεμερισμένοι is a perfect passive participle, denoting five people who stand in a state of having been divided. Adding “ndị e” makes this grammatical relationship clear without adding interpretation.
  revised_text: 'N’ihi na malite ugbu a gaa n’ihu, a ga-enwe mmadụ ise n’otu ụlọ[a], ndị e kewara ekewa: mmadụ atọ megide mmadụ abụọ, mmadụ abụọ megidekwa mmadụ atọ.'
