revisions:
- from: 'Ma aga m egosi unu onye unu ga-atụ egwu: tụọnụ onye ahụ egwu—onye, mgbe o gbuchara, nwere ikike ịtụba na Gehena.[a] Ee, ana m agwa unu, tụọnụ onye a egwu.'
  to: 'Ma aga m egosi unu onye unu ga-atụ egwu: tụọnụ onye ahụ egwu, onye, mgbe o gbuchara mmadụ, nwere ikike ịtụba mmadụ n''ime Gehena.[a] Ee, ana m agwa unu, tụọnụ onye a egwu.'
  rationale: 'The revision changes only phrasing needed for accurate, natural Standard Igbo: it renders εἰς explicitly as ‘n''ime,’ smooths the relative clause, and improves the footnote’s idiom. ‘Mmadụ’ supplies the object that Igbo normally requires with ‘ịtụba’; the Greek leaves that object implicit in a context of killing and judgment. The translation continues to avoid identifying ‘onye ahụ’ beyond the source text.'
  reviewer_model: gpt-5.6-terra
