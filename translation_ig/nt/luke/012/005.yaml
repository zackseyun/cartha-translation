review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future introduction, repeated imperative ‘fear,’ the temporal sequence after killing, authority (ἐξουσία), Gehenna, and the emphatic final demonstrative. It appropriately leaves the identity of ‘the one’ unspecified. However, ‘ịtụba na Gehena’ does not clearly express movement into Gehenna; ἐμβαλεῖν εἰς requires ‘n'ime.’
  naturalness: The wording is generally clear Standard Igbo, but the relative clause punctuated as ‘onye, mgbe o gbuchara, ...’ is slightly awkward. A smoother relative construction and the locative ‘n'ime’ improve readability.
  terminology: ‘Ikike’ is suitable for ἐξουσία, ‘Gehena’ responsibly preserves γέεννα, and ‘tụọnụ ... egwu’ keeps the repeated fear terminology. The footnote should describe Gehenna more idiomatically as a term used in connection with judgment.
  issues:
  - severity: medium
    issue: The phrase ‘ịtụba na Gehena’ is locatively imprecise.
    rationale: Greek ἐμβαλεῖν εἰς means ‘throw into.’ In Standard Igbo, ‘ịtụba mmadụ n'ime Gehena’ clearly conveys entry into the destination.
  - severity: low
    issue: The relative clause is somewhat awkwardly punctuated and ordered.
    rationale: Recasting it as ‘onye, mgbe o gbuchara mmadụ, nwere ikike...’ is more natural while retaining the Greek temporal and participial relationships.
  - severity: low
    issue: The footnote’s wording ‘okwu metụtara ikpe’ is less idiomatic.
    rationale: ‘Okwu a na-eji ekwu maka ikpe’ conveys the judgment-related lexical sense more naturally without adding theological interpretation.
  revised_text: 'Ma aga m egosi unu onye unu ga-atụ egwu: tụọnụ onye ahụ egwu, onye, mgbe o gbuchara mmadụ, nwere ikike ịtụba mmadụ n''ime Gehena.[a] Ee, ana m agwa unu, tụọnụ onye a egwu.'
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “hel.” Okwu Grik bụ Gehena, okwu a na-eji ekwu maka ikpe, nke sitere n'onyinyo Ndagwurugwu Hinom.
    reason: lexical_alternative
  revision_rationale: 'The revision changes only phrasing needed for accurate, natural Standard Igbo: it renders εἰς explicitly as ‘n''ime,’ smooths the relative clause, and improves the footnote’s idiom. ‘Mmadụ’ supplies the object that Igbo normally requires with ‘ịtụba’; the Greek leaves that object implicit in a context of killing and judgment. The translation continues to avoid identifying ‘onye ahụ’ beyond the source text.'
