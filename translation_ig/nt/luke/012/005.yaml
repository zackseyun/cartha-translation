id: LUK.12.5
reference: Luke 12:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: ig
  text: 'Ma aga m egosi unu onye unu ga-atụ egwu: tụọnụ onye ahụ egwu, onye, mgbe o gbuchara mmadụ, nwere ikike ịtụba mmadụ n''ime Gehena.[a] Ee, ana m agwa unu, tụọnụ onye a egwu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “hel.” Okwu Grik bụ Gehena, okwu a na-eji ekwu maka ikpe, nke sitere n'onyinyo Ndagwurugwu Hinom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: aga m egosi unu
  rationale: Ọdịnihu nke ὑποδείκνυμι na-egosi na Jizọs na-aga ịkọwapụta onye ha kwesịrị ịtụ egwu. ‘Aga m egosi unu’ bụ Igbo doro anya nke na-adịghị etinye echiche ọzọ dịka ịdọ aka ná ntị.
- source_word: τίνα φοβηθῆτε
  choice: onye unu ga-atụ egwu
  rationale: Nke a na-asụgharị ajụjụ na-adabere n’okwu ọzọ n’ụzọ Igbo nkịtị, ma na-edobe okwu bụ ‘ịtụ egwu.’
- source_word: φοβήθητε
  choice: tụọnụ … egwu
  rationale: E ji iwu a ugboro abụọ mee ka ịdọ aka ná ntị ahụ sie ike. ‘Tụọnụ … egwu’ na-edobe otu mgbọrọgwụ okwu ahụ n’ebe abụọ ahụ.
- source_word: τὸν
  choice: onye ahụ
  rationale: E ji article Grik mee aha onye a na-ekwu maka ya. ‘Onye ahụ’ bụ ụzọ Igbo doro anya isi gosipụta ya.
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: mgbe o gbuchara
  rationale: Nke a na-edobe usoro oge nke μετά na infinitive ahụ. A hapụrụ ihe e gburu n’ekwughị aha, dịka e mere na Grik.
- source_word: ἔχοντα ἐξουσίαν
  choice: nwere ikike
  rationale: ἐξουσία na-egosi ikike ziri ezi ma ọ bụ ikike e nyere, ọ bụghị naanị ike mmadụ nwere; ya mere ‘ikike’ dabara nke ọma.
- source_word: ἐμβαλεῖν εἰς
  choice: ịtụba na
  rationale: ‘Ịtụba na’ bụ okwu Igbo dị ndụ ma kwụ ọtọ maka omume ịtụba ihe ma ọ bụ mmadụ n’ime ebe.
- source_word: γέενναν
  choice: Gehena
  rationale: E debere aha Grik ahụ n’ụdị e dere ya n’Igbo ka e wee ghara itinye ozizi ndị e mechara jikọta na okwu ‘hel’ ozugbo n’ime isiokwu.
- source_word: ναί
  choice: Ee
  rationale: ‘Ee’ na-edobe nkwenye siri ike nke ναί n’ụzọ dị mfe ma dị ike.
- source_word: τοῦτον
  choice: onye a
  rationale: ‘Onye a’ na-edobe ike demonstrative τοῦτον, nke na-atụ aka kpọmkwem n’onye ahụ e kwuru okwu ya.
theological_decisions:
- issue: Otu e si asụgharị γέεννα n’okwu gbasara ikpe
  choice: Gehena
  alternative: hel
  rationale: Ide ‘Gehena’ na-edobe aha na echiche ndị Juu dị n’okwu Grik ahụ, kama iji otu okwu nwere ike iburu nghọta nkà mmụta okpukpe e mechara wulite. E tinyere ‘hel’ n’ala ala peeji dịka ihe ọzọ a pụrụ iji sụgharịa ya.
- issue: Onye ‘onye ahụ’ bụ
  choice: A kpọghị onye ahụ aha n’amaokwu a
  alternative: Ịkọwa ya kpọmkwem dịka Chineke
  rationale: Ihe gbara amaokwu a gburugburu nwere ike iduga onye na-agụ ya n’ịghọta onye a na-ekwu maka ya, ma Grik nke amaokwu ahụ n’onwe ya ji naanị okwu na-egosi ‘onye ahụ.’ Nsụgharị ahụ ekwughị ihe karịrị nke isi mmalite kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrị ogologo (—) na-enyere aka igosi nkọwa gbasara ‘onye ahụ’ n’enweghị mgbagwoju anya. E deghị ‘onye ahụ’ na mkpụrụedemede ukwu ka a ghara itinye nkọwa nkà mmụta okpukpe nke Grik ekwughị kpọmkwem.
