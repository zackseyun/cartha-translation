  rationale: The revision retains the source’s emphasis, future tense, masculine-singular parabolic referent as naturally represented by Igbo “ya,” and the broad sense of all that belongs to the master. It makes the appointment-to-authority relationship explicit in idiomatic Standard Igbo and corrects the footnote phrasing.
