base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: ig
  text: N’ezie, ana m agwa unu na ọ ga-ahọpụta ya ka ọ bụrụ onye nlekọta ihe niile o nwere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ihe onwunwe ya niile” ma ọ bụ “ihe niile bụ nke ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀληθῶς
  choice: N’ezie
  rationale: Na-egosipụta nkwenye siri ike na eziokwu nke okwu ahụ n’ụzọ Igbo dị ugbu a ma dị ugwu.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Usoro okwu nkịtị nke na-echekwa ịgwa ọtụtụ mmadụ okwu ozugbo na ikike onye na-ekwu ya.
- source_word: ὅτι
  choice: na
  rationale: Na-ewebata ọdịnaya nke ihe a na-ekwu n’ụzọ Igbo nkịtị.
- source_word: ἐπὶ
  choice: ka ọ na-elekọta
  rationale: N’ebe a, ἐπί na-egosi ịbụ onye e nyere ikike na ọrụ ilekọta ihe; okwu a na-eme ka echiche ahụ doo anya n’Igbo.
- source_word: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: ihe niile o nwere
  rationale: Na-echekwa obosara nke okwu Grik ahụ n’etinyeghị ya naanị n’ala, ụlọ, ma ọ bụ akụ ndị ọzọ.
- source_word: καταστήσει
  choice: ọ ga-ahọpụta ya
  rationale: Na-egosi ime ka mmadụ bụrụ onye nọ n’ọrụ ma ọ bụ n’ọkwa e nyere ya, karịchaa ọrụ nlekọta n’akụkọ a.
- source_word: αὐτόν
  choice: ya
  rationale: Na-ezo aka n’ohu ma ọ bụ onye nlekọta nwoke ahụ e kwuru okwu ya n’amaokwu ndị gbara ya gburugburu; Igbo 'ya' anaghị egosi okike n’onwe ya ma na-echekwa onye ahụ a na-ezo aka na ya.
theological_decisions:
- issue: Nnochiaha nwoke n’ime ilu ahụ
  choice: Jiri “ya” dịka usoro ụtọasụsụ Igbo si dị
  alternative: Tinye okwu dịka “nwoke ahụ” iji mee ka okike nwoke pụta ìhè
  rationale: Grik na-ezo aka n’otu nwoke nọ n’ime ilu ahụ, ma nnochiaha onye nke atọ n’Igbo anaghị ekewa nwoke na nwanyị. Ịgbakwunye “nwoke ahụ” ga-eme ka ihe na-adịghị n’ụdị okwu isi pụta ìhè karịa ka ọ dị na ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E ji “ka ọ na-elekọta” gosipụta ikike na ọrụ nlekọta nke ἐπὶ n’ụzọ eke n’Igbo; akara nkọwa [a] dị n’ederede isi.
