  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: ig
  text: Ma ọ sịrị ya, “Nwoke, ònye họpụtara m ịbụ onyeikpe ma ọ bụ onye na-ekewa ihe n’etiti unu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: Nwoke a
  rationale: Ọ bụ ụzọ Igbo dị ndụ e si agwa nwoke okwu ozugbo; ọ na-edobe ụda ịkpọ onye ahụ okwu n’enweghị ịgbakwunye nkwanye ùgwù ma ọ bụ mkparị na-adịghị na Grik.
- source_word: κατέστησεν
  choice: họpụtara
  rationale: Na-egosi ime ka mmadụ nọrọ n’ọrụ ma ọ bụ inye ya ikike maka ọrụ ahụ.
- source_word: κριτὴν
  choice: onyeikpe
  rationale: Na-edobe echiche onye nwere ọrụ ikpe ikpe.
- source_word: μεριστὴν
  choice: onye na-ekere unu ihe
  rationale: Na-akọwa onye na-ekewa ma na-ekenye ihe, karịchaa ihe nketa n’ọnọdụ a, n’etinyeghị okwu ‘ihe nketa’ nke na-adịghị n’amaokwu ahụ n’onwe ya.
- source_word: ἐφ’ ὑμᾶς
  choice: unu
  rationale: Ụdị ọtụtụ mmadụ dị na Grik; ọ pụrụ ịgụnye onye rịọrọ arịrịọ ahụ na onye ya na ya na-ese okwu.
theological_decisions:
- issue: Ma ajụjụ Jizọs ọ na-ajụ bụ ịjụ ikike ikpe niile ka ọ bụ ọrụ dị n’esemokwu a
  choice: E debere ya dịka ajụjụ banyere onye họpụtara ya ka ọ rụọ ọrụ onyeikpe ma ọ bụ onye nkewa n’ebe ha nọ.
  alternative: Ịsụgharị ya dịka nkwupụta na Jizọs enweghị ikike ikpe n’ụzọ ọ bụla.
  rationale: Grik bụ ajụjụ gbasara nhọpụta maka ọrụ a; ọ naghị edozi n’amaokwu a naanị ya ajụjụ sara mbara banyere ikike Jizọs.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. A họọrọ ‘onye na-ekere unu ihe’ kama okwu iwu siri ike, iji mee ka ọrụ μεριστής doo onye nkịtị anya ma debe ọdịiche ya na ‘onyeikpe.’
