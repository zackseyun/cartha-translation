  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: ig
  text: 'Ma maranụ nke a: a sị na onye nwe ụlọ ahụ maara oge onye ohi na-abịa, ọ garaghị ekwe ka a gwupuo ụlọ ya[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ka a gwupuo ya”; okwu a na-ezo aka n’igwu mgbidi ụlọ ka e si na ya bata.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: Ma maranụ nke a
  rationale: “Maranụ” na-egosipụta iwu e nyere ọtụtụ mmadụ, dịka γινώσκετε; “Ma” na-eburu mgbanwe ma ọ bụ ọdịiche nke δέ.
- source_word: οἰκοδεσπότης
  choice: onye nwe ụlọ ahụ
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-achị ma na-ahụ maka ụlọ, ma ọ naghị ebubata echiche pụrụ iche na-abụghị nke okwu Grik.
- source_word: ποίᾳ ὥρᾳ
  choice: oge
  rationale: “Oge” bụ ụzọ Igbo kachasị eke isi kwuo oge ihe ga-eme; itinye “elekere” ga-ada ka oge nke elekere ọgbara ọhụrụ ma nwee ike ime ka okwu ahụ sie ike n’enweghị mkpa.
- source_word: ὁ κλέπτης ἔρχεται
  choice: onye ohi ga-abịa
  rationale: Ọ bụ ezie na ἔρχεται dị n’ụdị ugbu a, n’ọnọdụ ahịrịokwu a ọ na-ekwu banyere ọbịbịa a tụrụ anya ya; “ga-abịa” na-eme ka nke ahụ pụta nke ọma n’Igbo.
- source_word: οὐκ ἂν ἀφῆκεν
  choice: ọ garaghị ekwe
  rationale: “Ọ garaghị” na-egosipụta ọnọdụ megidere ihe mere n’eziokwu, ebe “ekwe” na-eburu echiche nke ịhapụ ma ọ bụ ikwe ka ihe mee.
- source_word: διορυχθῆναι
  choice: ka a gwupuo
  rationale: Nhọrọ a na-echekwa ihe oyiyi kpọmkwem nke igwu mgbidi ụlọ iji bata, kama iji naanị okwu izugbe dịka “ịgbaba n’ụlọ.”
- source_word: τὸν οἶκον αὐτοῦ
  choice: ụlọ ya
  rationale: Nke a bụ ihe kwekọrọ n’οἶκος n’ebe a ma na-ezo aka n’ụlọ ahụ a ga-egwu mgbidi ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ntụgharị na-echekwa ihe oyiyi Grik nke igwu mgbidi, ebe nkọwa ala peeji na-eme ka omenala ụlọ nke oge ahụ doo anya.
