revisions:
- from: Reenụ ihe onwunwe unu, nyekwa ndị nọ ná mkpa onyinye ebere.[a] Meere onwe unu akpa ego ndị na-adịghị aka nka, ya bụ, akụ na-adịghị agwụ agwụ n’eluigwe,[b] ebe onye ohi na-adịghị abịaru nso, nla adịghịkwa emebi.
  to: Reenụ ihe onwunwe unu, nyenụ onyinye ebere.[a] Meerenụ onwe unu akpa ego ndị na-adịghị aka nka, akụ na-adịghị agwụ agwụ n’eluigwe,[b] ebe onye ohi na-adịghị abịaru nso, nla adịghịkwa emebi.
