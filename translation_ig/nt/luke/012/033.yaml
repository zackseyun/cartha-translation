id: LUK.12.33
reference: Luke 12:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: ig
  text: Reenụ ihe onwunwe unu, nyenụ onyinye ebere.[a] Meerenụ onwe unu akpa ego ndị na-adịghị aka nka, akụ na-adịghị agwụ agwụ n’eluigwe,[b] ebe onye ohi na-adịghị abịaru nso, nla adịghịkwa emebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nyenụ ndị nọ ná mkpa ihe.” Okwu Grik a na-ezo aka n’inye ndị nọ ná mkpa ihe dịka ọrụ ebere.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’eluigwe dị iche iche”; okwu Grik dị n’ụdị ọtụtụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πωλήσατε
  choice: Reenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha ree; okwu a dị mfe ma ghara ịgbakwunye echiche na ha ga-ererịrị ihe niile.
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: ihe onwunwe unu
  rationale: Nke a na-egosi ihe ndị mmadụ nwere, ya bụ, ihe ha nwe.
- source_word: δότε ἐλεημοσύνην
  choice: nyekwa ndị nọ ná mkpa onyinye ebere
  rationale: ἐλεημοσύνη na-ezo aka n’ọrụ ebere nke inye ndị nọ ná mkpa ihe; nsụgharị a na-eme ka onye a na-enyere doo anya ma debe echiche ebere dị n’okwu Grik.
- source_word: ποιήσατε ἑαυτοῖς
  choice: Meere onwe unu
  rationale: Ọ na-edebe iwu ahụ na echiche na ihe a na-eme bụ maka uru nke ndị a na-agwa okwu.
- source_word: βαλλάντια
  choice: akpa ego
  rationale: Ọ bụ obere akpa e ji edobe ego; okwu a na-edebe ihe atụ ahụ n’ụzọ ndị na-agụ Igbo ga-aghọta.
- source_word: μὴ παλαιούμενα
  choice: ndị na-adịghị aka nka
  rationale: Ọ na-egosi akpa ndị na-adịghị eme ochie ma ọ bụ gwụ n’iji ha eme ihe, ma na-edebe ihe oyiyi nke isiokwu Grik.
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: akụ na-adịghị agwụ agwụ
  rationale: ἀνέκλειπτος pụtara ihe na-adịghị ada ada ma ọ bụ gwụ; nkebiokwu a doro anya ma debe ihe atụ nke akụ.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: n’eluigwe
  rationale: Igbo nkịtị na-eji otu ụdị a akọwa ebe Chineke bi; ndetu ala na-egosi na okwu Grik dị n’ụdị ọtụtụ.
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: ebe onye ohi na-adịghị abịaru nso
  rationale: Ọ na-edebe ihe oyiyi gbasara ịbịaru ebe ahụ nso, kama naanị ịsị na onye ohi apụghị izu ya.
- source_word: οὐδὲ σὴς διαφθείρει
  choice: nla adịghịkwa emebi
  rationale: σής bụ nla na-eri akwa, διαφθείρει bụkwa imebi ma ọ bụ ibibi; okwu a dabara n’ihe atụ ahụ.
theological_decisions:
- issue: Ihe ἐλεημοσύνην pụtara n’iwu gbasara ihe onwunwe na akụ dị n’eluigwe
  choice: nyekwa ndị nọ ná mkpa onyinye ebere
  alternative: nyekwa onyinye ebere
  rationale: Nhọrọ a na-egosi na ọ bụ inye ndị nọ ná mkpa ihe n’ihi ebere, n’enweghị itinye usoro akụ na ụba ma ọ bụ ozizi ọzọ na-adịghị n’amaokwu ahụ.
- issue: Otu e si sụgharịa ἐν τοῖς οὐρανοῖς
  choice: n’eluigwe
  alternative: n’eluigwe dị iche iche
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ, “n’eluigwe” bụ ụzọ Igbo ebumpụta ụwa si kwuo ya. Ndetu ala na-echekwa ọdịdị ọtụtụ nke isi mmalite ahụ n’enweghị ịmepụta echiche na-ezighi ezi banyere ọtụtụ eluigwe.
- issue: Mmekọrịta dị n’etiti akpa ego na akụ
  choice: tinye “ya bụ” iji gosi nkọwa ihe atụ ahụ
  alternative: hapụ ha ka ha bụrụ ihe abụọ na-esochi ibe ha n’enweghị njikọ doro anya
  rationale: N’usoro Grik, “akụ na-adịghị agwụ agwụ” nọ n’ọnọdụ nkọwa nye “akpa ego”; “ya bụ” na-eme ka mmekọrịta ahụ doo anya n’Igbo n’enweghị ịgbanwe isi okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ihe onwunwe,” “onyinye ebere,” na “akụ” na-edebe ụda amaokwu ahụ, ebe “ndị nọ ná mkpa” na-eme ka ihe inye ebere pụtara doo ndị nkịtị anya.
