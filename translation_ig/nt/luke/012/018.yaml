  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: ig
  text: 'O wee sị, “Ihe a ka m ga-eme: M ga-akwatu ọba m, ma wuo ndị ka ibu[a]; n’ebe ahụ ka m ga-achịkọta mkpụrụ ọka m niile[b] na ihe onwunwe m[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụlọ nchekwa ndị ka ibu.”
    reason: lexical_alternative
  - marker: b
    text: “Mkpụrụ ọka” (σῖτος) nwere ike ịpụta kpọmkwem “ọka wit” n’ọnọdụ ụfọdụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ngwongwo m” maka “ihe onwunwe m” (τὰ ἀγαθά μου).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: Ihe a ka m ga-eme
  rationale: Ọ na-egosipụta nkwusi ike dị n'okwu Grik ma na-ada ka Igbo nkịtị.
- source_word: καθελῶ
  choice: Aga m akwatu
  rationale: Ọ na-enye echiche doro anya nke ịkwatu ụlọ ndị dị ugbu a.
- source_word: ἀποθήκας
  choice: ọba
  rationale: N'ọnọdụ ọrụ ugbo a, ọba bụ ebe a na-edebe ihe ubi; ọ dị mfe nghọta ma ọ naghị ebelata okwu ahụ naanị n'otu ụdị mkpụrụ.
- source_word: μείζονας οἰκοδομήσω
  choice: wuo ndị ka ibu
  rationale: Ọ na-eweghachi aha ụlọ nchekwa a ghọtara n'okwu ahụ ma chekwaa ntụnyere nke μείζονας.
- source_word: συνάξω ἐκεῖ
  choice: n’ebe ahụkwa ka m ga-achịkọta
  rationale: Ọ na-edobe ma ebe e kwuru kpọmkwem, ma echiche nke ịchịkọta ihe ọnụ, n'enweghị ịgbakwunye nkọwa karịa isi mmalite.
- source_word: πάντα τὸν σῖτον
  choice: mkpụrụ ọka m niile
  rationale: Mkpụrụ ọka bụ okwu sara mbara maka σῖτος; “m” na-esochi echiche onye na-ekwu okwu na njikọ ya na ihe onwunwe ya.
- source_word: τὰ ἀγαθά μου
  choice: ihe onwunwe m niile
  rationale: Ọ na-egosipụta ihe ọma ma ọ bụ akụ mmadụ nwere n'ụzọ eke n'Igbo, n'emeghị ka ọ bụrụ naanị ego.
