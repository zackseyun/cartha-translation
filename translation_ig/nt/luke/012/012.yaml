    reason: lexical_alternative
  revision_rationale: The revision renders the emphatic Greek temporal expression as ‘n’awa ahụ kpọmkwem’ and restores the necessity conveyed by δεῖ with ‘kwesịrị.’ It retains the explanatory connection, the plural ‘unu,’ and the established term ‘Mmụọ Nsọ.’
