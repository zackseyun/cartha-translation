  text: τὸ γὰρ ἅγιον πνεῦμα διδάξει ὑμᾶς ἐν αὐτῇ τῇ ὥρᾳ ἃ δεῖ εἰπεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: ig
  text: n’ihi na Mmụọ Nsọ ga-akụziri unu n’awa ahụ kpọmkwem ihe unu kwesịrị ikwu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’oge ahụ” ma ọ bụ “n’awa ahụ.” Okwu Grik ahụ na-emesi oge kpọmkwem a mkpa ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: n’ihi na
  rationale: Na-egosi na amaokwu a na-akọwa ihe mere ha ekwesịghị ichegbu onwe ha banyere ihe ha ga-ekwu n’amaokwu bu ya ụzọ.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Mmụọ Nsọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka Mmụọ Chineke ahụ, ma na-edobe ya dịka onye na-eme ihe n’ahịrịokwu ahụ.
- source_word: διδάξει ὑμᾶς
  choice: ga-akụziri unu
  rationale: Na-edobe ọdịnihu nke ngwaa ahụ na ọtụtụ mmadụ nke ὑμᾶς; ‘unu’ na-eme ka ọtụtụ mmadụ ahụ doo anya.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: n’otu oge ahụ kpọmkwem
  rationale: ‘Kpọmkwem’ na-egosipụta ike αὐτῇ, ya bụ, na enyemaka ahụ ga-abịa n’oge mkpa ahụ n’onwe ya.
- source_word: ἃ δεῖ εἰπεῖν
  choice: ihe unu ga-ekwu
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke okike isi kwuo ọdịnaya ha kwesịrị ikwu; ‘ga-’ n’ebe a na-ekwupụta ihe ọnọdụ ahụ chọrọ, n’enweghị okwu siri ike nke na-adịghị mkpa.
theological_decisions:
- issue: Ọrụ Mmụọ Nsọ dịka onye na-eme ihe
  choice: E mere Mmụọ Nsọ onye isi ngwaa nke ga-akụziri ndị na-eso ụzọ ihe ha ga-ekwu.
  alternative: Ịkọwa Mmụọ Nsọ dịka ike ma ọ bụ mmetụta na-abụghị onye.
  rationale: Akwụkwọ Grik mere τὸ ἅγιον πνεῦμα onye na-arụ ọrụ nke ngwaa διδάξει; nsụgharị ahụ na-edobe nke a ma ghara itinye nkọwa ozizi ọzọ na-adịghị n’amaokwu ahụ.
- issue: Ike nke δεῖ
  choice: ihe unu ga-ekwu
  alternative: ihe unu kwesịrị ikwu; ihe unu na-aghaghị ikwu
  rationale: N’Igbo, ‘ihe unu ga-ekwu’ dabara nke ọma n’ọdịdị nkwa a ma nwee ike igosi ihe ọnọdụ ahụ chọrọ. Nhọrọ ndị ọzọ nwere ike ime ka ọ dị ka iwu siri ike karịa ka okwu a si arụ ọrụ n’ebe a.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ chekwaa ọtụtụ mmadụ nke Grik, ma tinye akara [a] n’ederede isi dịka achọrọ.
