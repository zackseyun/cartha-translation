revisions:
- from: n’ihi na Mmụọ Nsọ ga-akụziri unu n’otu oge ahụ kpọmkwem ihe unu ga-ekwu.[a]
  to: n’ihi na Mmụọ Nsọ ga-akụziri unu n’awa ahụ kpọmkwem ihe unu kwesịrị ikwu.[a]
  rationale: The revision renders the emphatic Greek temporal expression as ‘n’awa ahụ kpọmkwem’ and restores the necessity conveyed by δεῖ with ‘kwesịrị.’ It retains the explanatory connection, the plural ‘unu,’ and the established term ‘Mmụọ Nsọ.’
  reviewer_model: gpt-5.6-terra
