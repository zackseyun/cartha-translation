review_pass:
  verdict: revise
  source_fidelity: Draft correctly renders γάρ, the future action of the Holy Spirit, and the plural addressee. However, “n’otu oge ahụ kpọmkwem” does not naturally convey ἐν αὐτῇ τῇ ὥρᾳ, which refers to that very hour/moment, and “ihe unu ga-ekwu” leaves δεῖ (‘it is necessary/must’) unexpressed.
  naturalness: “N’awa ahụ kpọmkwem” is a clearer, natural Standard Igbo equivalent for the emphatic temporal phrase. “Ihe unu kwesịrị ikwu” naturally expresses the contextual necessity without sounding unduly harsh.
  terminology: “Mmụọ Nsọ” and “ga-akụziri unu” are appropriate, established Standard Igbo renderings and preserve the Spirit as the grammatical agent.
  issues:
  - severity: medium
    issue: The temporal phrase is imprecise and somewhat unnatural.
    rationale: “N’otu oge ahụ” normally suggests ‘at the same time,’ whereas ἐν αὐτῇ τῇ ὥρᾳ means ‘in/at that very hour.’
  - severity: medium
    issue: The necessity expressed by δεῖ is omitted.
    rationale: “Ihe unu ga-ekwu” states future speech but does not represent what they need or must say; “ihe unu kwesịrị ikwu” retains the source sense idiomatically.
  revised_text: n’ihi na Mmụọ Nsọ ga-akụziri unu n’awa ahụ kpọmkwem ihe unu kwesịrị ikwu.[a]
  revised_footnotes:
