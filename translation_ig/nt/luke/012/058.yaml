revisions:
- from: N’ihi na mgbe gị na onye na-ebo gị ebubo na-aga n’ihu onye ọchịchị, gbasie mbọ ike mgbe unu ka nọ n’ụzọ ka i nwere onwe gị pụọ n’aka ya,[a] ka ọ ghara ịdọkpụrụ gị gaa n’ihu onyeikpe, onyeikpe ahụ enyefee gị n’aka onye ọrụ ụlọikpe, onye ọrụ ahụ atụbakwa gị n’ụlọ mkpọrọ.
  to: N’ihi na mgbe gị na onye na-emegide gị n’ikpe na-aga n’ihu onye ọchịchị, gbalịsie ike n’ụzọ ka i wepụ onwe gị n’aka ya,[a] ka ọ ghara ịdọkpụrụ gị gaa n’ihu onyeikpe; onyeikpe ahụ enyefee gị n’aka onye ọrụ ụlọikpe, onye ọrụ ahụ atụbakwa gị n’ụlọ mkpọrọ.
  rationale: The revision replaces the overly specific “accuser” with a neutral legal opponent, corrects an awkward expression for being freed from that party, and retains the escalating legal image and vivid coercion of the Greek. The footnote continues to distinguish the literal passive wording from the contextual implication of settlement.
