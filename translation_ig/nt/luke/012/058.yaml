id: LUK.12.58
reference: Luke 12:58
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: ig
  text: N’ihi na mgbe gị na onye na-emegide gị n’ikpe na-aga n’ihu onye ọchịchị, gbalịsie ike n’ụzọ ka i wepụ onwe gị n’aka ya,[a] ka ọ ghara ịdọkpụrụ gị gaa n’ihu onyeikpe; onyeikpe ahụ enyefee gị n’aka onye ọrụ ụlọikpe, onye ọrụ ahụ atụbakwa gị n’ụlọ mkpọrọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka gị na ya dozie okwu ahụ.” Okwu Grik ahụ pụtara n’ụzọ nkịtị, “ka a tọhapụ gị n’aka ya,” ma n’ọnọdụ a ọ pụrụ ịpụta idozi esemokwu ahụ tupu o ruo n’ihu onyeikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιδίκου
  choice: onye na-ebo gị ebubo
  rationale: N’ọnọdụ ikpe a, okwu ahụ na-ezo aka n’otu onye nọ n’akụkụ nke ọzọ nke na-eweta ebubo; nsụgharị a doro ndị na-agụ Igbo nke oge a anya.
- source_word: ἄρχοντα
  choice: onye ọchịchị
  rationale: Ọ na-egosi onye nwere ikike ọchịchị ma ọ bụ ikpe. A hapụrụ ya n’ụdị sara mbara dịka Grik si dị, kama ịmanye aha otu ọkwa iwu nke omenala ọzọ.
- source_word: δὸς ἐργασίαν
  choice: gbasie mbọ ike
  rationale: Nke a na-enye iwu ka onye ahụ tinye ezigbo mgbalị; ọ bụ okwu Igbo ebumpụta ụwa nke na-eburu ike nke akpaalaokwu Grik.
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: ka i nwere onwe gị pụọ n’aka ya
  rationale: Nke a na-edobe echiche nkịtị nke ịbụ onye a tọhapụrụ n’aka onye ahụ, n’agbanyeghị na n’ọnọdụ a ọ pụrụ ịpụta idozi okwu ahụ.
- source_word: κατασύρῃ
  choice: ịdọkpụrụ
  rationale: Okwu a na-egosi mmegharị a manyere n’ike, dịka ngwaa Grik siri sie ike.
- source_word: κριτήν / κριτής
  choice: onyeikpe
  rationale: Nke a bụ okwu Igbo doro anya maka onye na-ekpe ikpe n’ọnọdụ iwu.
- source_word: παραδώσει
  choice: enyefee gị n’aka
  rationale: Ọ na-egosi inyefe onye ọzọ n’okpuru ikike onye ọrụ na-esote n’usoro ikpe.
- source_word: πράκτορι / πράκτωρ
  choice: onye ọrụ ụlọikpe
  rationale: Ọ na-egosi onye ọrụ na-emezu iwu onyeikpe, ma na-ezere ịkpọ ya aha ọkwa iwu Bekee nke nwere ike ịdị oke kpọmkwem.
- source_word: βαλεῖ εἰς φυλακήν
  choice: atụbakwa gị n’ụlọ mkpọrọ
  rationale: “Atụba” na-edobe ike na ịdị ndụ nke βάλλω karịa naanị “tinye.”
- source_word: ὡς γὰρ
  choice: N’ihi na mgbe
  rationale: “N’ihi na” na-ejigide njikọ nkọwa nke γάρ, ebe “mgbe” na-eme ka ọnọdụ atụ ahụ daa nke ọma n’Igbo.
- source_word: ἐν τῇ ὁδῷ
  choice: mgbe unu ka nọ n’ụzọ
  rationale: Ọ na-edobe ma ọnọdụ njem ahụ ma ngwa ngwa nke ime ihe tupu ha eruo n’ihu onyeikpe.
theological_decisions:
- issue: Ogo nkọwa e kwesịrị itinye n’ihe atụ gbasara ikpe
  choice: Idobe ihe oyiyi nke usoro ikpe n’amaokwu ahụ n’ebughị ụzọ kọwaa ya dịka ikpe ikpeazụ ma ọ bụ ime udo na Chineke.
  alternative: Ịsụgharị ya kpọmkwem dịka oku ka mmadụ mee udo na Chineke tupu ikpe ikpeazụ.
  rationale: Amaokwu ahụ n’onwe ya na-eji asụsụ nke esemokwu iwu, ma ọ kpọghị onye na-ebo ebubo, onyeikpe, ma ọ bụ ụlọ mkpọrọ aha dịka ihe nnọchianya okpukpe. Ya mere, nsụgharị ahụ na-ahapụ ihe ọ pụtara n’ụzọ sara mbara ka ọnọdụ gbara ya gburugburu gosipụta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro iwu ahụ n’asụsụ ndị nkịtị ga-aghọta, na-enweghị iji aha ọkwa sitere kpọmkwem n’usoro iwu Bekee.
