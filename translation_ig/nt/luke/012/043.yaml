    text: Ma ọ bụ, “Ngọzi na-adịrị ohu ahụ mgbe Onyenwe ya bịara, ọ ga-ahụ ka ọ na-eme otu a.” Okwu Grik ahụ nwere ike ịpụta “nna ukwu” n'ọnọdụ ezinaụlọ nke ilu a, ma ọ bụ “Onyenwe” mgbe a na-eleba anya n'ọrụ ilu ahụ n'ụzọ sara mbara.
    reason: alternative_reading
  revision_rationale: Changed “mgbe ọ lọtara” to “mgbe ... bịara” because the Greek says “when he comes,” not specifically “when he returns.” Recast the clause so that the master is explicitly identified as the one who comes and finds the servant, while retaining the demonstrative emphasis (“ahu”), future finding, and the reference to doing what was commanded (“otu a”). The footnote marker is placed at the end of the sentence, matching the alternative rendering of κύριος and avoiding attachment solely to a noun phrase.
