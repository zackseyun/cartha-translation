revisions:
- from: Ngọzi na-adịrị ohu ahụ nna ya ukwu[a] ga-ahụ ka ọ na-eme otu ahụ mgbe ọ lọtara.
  to: Ngọzi na-adịrị ohu ahụ mgbe nna ukwu ya bịara, ọ ga-ahụ ka ọ na-eme otu a.[a]
  rationale: Changed “mgbe ọ lọtara” to “mgbe ... bịara” because the Greek says “when he comes,” not specifically “when he returns.” Recast the clause so that the master is explicitly identified as the one who comes and finds the servant, while retaining the demonstrative emphasis (“ahu”), future finding, and the reference to doing what was commanded (“otu a”). The footnote marker is placed at the end of the sentence, matching the alternative rendering of κύριος and avoiding attachment solely to a noun phrase.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents μακάριος, δοῦλος, κύριος in its household sense, the future force of εὑρήσει, and the ongoing action in ποιοῦντα οὕτως. However, “mgbe ọ lọtara” means “when he returned/came back” and adds a return nuance not expressed by ἐλθών (“when he comes”).
  naturalness: The revision gives the temporal clause a clear, natural Igbo placement and avoids potential momentary ambiguity over whether “ọ” refers to the servant or the master.
  terminology: “Ohu” appropriately retains the dependent/slave-servant status of δοῦλος in the parable. “Nna ukwu ya” is suitable for κύριος in the household scene; “Onyenwe ya” is retained only as a legitimate alternative with broader resonance.
  issues:
  - severity: medium
    issue: “lọtara” adds an unexpressed return/back-again sense.
    rationale: The Greek participle ἐλθών simply denotes coming. Although the parable context may imply a master's arrival, the verse itself does not specify returning, so “bịara” preserves the source wording without extra implication.
  revised_text: Ngọzi na-adịrị ohu ahụ mgbe nna ukwu ya bịara, ọ ga-ahụ ka ọ na-eme otu a.[a]
  revised_footnotes:
