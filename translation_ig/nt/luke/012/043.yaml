  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: ig
  text: Ngọzi na-adịrị ohu ahụ mgbe nna ukwu ya bịara, ọ ga-ahụ ka ọ na-eme otu a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ngọzi na-adịrị ohu ahụ mgbe Onyenwe ya bịara, ọ ga-ahụ ka ọ na-eme otu a.” Okwu Grik ahụ nwere ike ịpụta “nna ukwu” n'ọnọdụ ezinaụlọ nke ilu a, ma ọ bụ “Onyenwe” mgbe a na-eleba anya n'ọrụ ilu ahụ n'ụzọ sara mbara.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosipụta nkwupụta ngọzi nke okwu Grik ahụ, ọ bụghị naanị mmetụta obi ụtọ ma ọ bụ ihe ọma dakwasịrị mmadụ na mberede.
- source_word: δοῦλος
  choice: ohu
  rationale: N'ọnọdụ ilu banyere ezinaụlọ, “ohu” na-egosipụta onye nọ n'okpuru ikike nna ya ukwu ma na-arụ ọrụ e nyere ya.
- source_word: κύριος
  choice: nna ya ukwu
  rationale: N'elu ilu ahụ, okwu a na-ezo aka n'onye na-achị ohu n'ụlọ. “Nna ya ukwu” na-egosipụta mmekọrịta ahụ n'ụzọ doro anya; e debere “Onyenwe ya” n'okpuru peeji maka ụda ọzọ okwu Grik ahụ nwere.
- source_word: ἐλθὼν
  choice: mgbe ọ lọtara
  rationale: N'ọnọdụ a, participle a na-egosi oge nna ukwu bịaghachiri, ya mere “mgbe ọ lọtara” bụ Igbo eke ma doo usoro ihe omume anya.
- source_word: εὑρήσει
  choice: ga-ahụ
  rationale: Nke a na-edobe ọdịnihu nke ngwaa Grik ahụ.
- source_word: ποιοῦντα οὕτως
  choice: ka ọ na-eme otu ahụ
  rationale: Nke a na-ezo n'ụzọ eke azụ n'omume kwesịrị ntụkwasị obi a kọwara n'amaokwu ndị bu ụzọ.
- source_word: ἐκεῖνος
  choice: ahụ
  rationale: “Ahụ” na-edobe nrụtụ aka na nkwusike nke demonstrative Grik ahụ.
theological_decisions:
- issue: κύριος nwere ike ịpụta nna ukwu nke ohu n'ilu a ma ọ bụ Onyenwe anyị n'ọrụ sara mbara nke ilu ahụ
  choice: nna ya ukwu
  alternative: Onyenwe ya
  rationale: Ọnọdụ ilu ahụ n'onwe ya bụ nke ohu na onye na-achị ya n'ụlọ, ya mere e ji “nna ya ukwu” n'ahịrị isi. Ma n'ihi na okwu ahụ nwekwara ike ime ka onye na-agụ ya cheta nlọghachi nke Onyenwe anyị, e chekwara “Onyenwe ya” n'okpuru peeji kama iwepụ esemokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-edobe nkwupụta ngọzi, mmekọrịta ohu na nna ukwu, na ntụaka azụ nke “otu ahụ” n'omume a kọwara tupu amaokwu a.
