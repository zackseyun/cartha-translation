source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: ig
  text: Ma ọbụna a gụọla ntutu niile dị n'isi unu ọnụ. Unu atụla egwu; unu bara uru karịa ọtụtụ nza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Ma ọbụna
  rationale: Ọ na-egosipụta ma ọdịiche dị n'okwu bu ụzọ ma nkwusi ike dị na nkasi obi a.
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: ntutu niile dị n'isi unu
  rationale: Nke a bụ Igbo nkịtị ma doo anya, na-echekwa ihe oyiyi ahụ na ike nke πᾶσαι, ‘niile.’
- source_word: ἠρίθμηνται
  choice: agụọla ... ọnụ
  rationale: 'Ụdị a na-egosipụta omume e mechara nke nsonaazụ ya ka dị ugbu a: a gụọla ha nke ọma.'
- source_word: μὴ φοβεῖσθε
  choice: Unu atụla egwu
  rationale: Ọ bụ iwu jụrụ ihe n'ụzọ kwụ ọtọ, bụrụkwa okwu Igbo a na-eji eme ihe nke ọma.
- source_word: πολλῶν στρουθίων
  choice: ọtụtụ nza
  rationale: ‘Nza’ na-echekwa ụdị nnụnụ ahụ na njikọ ya na amaokwu ndị gbara ya gburugburu.
- source_word: διαφέρετε
  choice: unu bara uru karịa
  rationale: N'ọnọdụ a, ngwaa ahụ na-egosi uru e ji atụnyere, ọ bụghị nanị ịdị iche.
theological_decisions:
- issue: Ntụnyere uru ndị na-eso ụzọ na uru nza
  choice: unu bara uru karịa ọtụtụ nza
  alternative: unu dị oké ọnụ ahịa karịa ọtụtụ nza
  rationale: ‘Bara uru karịa’ na-egosipụta arụmụka sitere n'ihe dị nta ruo n'ihe ka ukwuu banyere nlekọta Chineke, na-etinyeghị echiche nkà ihe ọmụma karịrị ihe ederede kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ chekwaa ọnụọgụ ọtụtụ dị na Grik. Enweghị nkọwa ala peeji n'ihi na ozi e nyere maka akara ndị Bekee ekwekọghị na ederede ha; nsụgharị Igbo a anaghị achọ ha iji kọwaa isi okwu ahụ.
