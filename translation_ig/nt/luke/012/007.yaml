  source_fidelity: 'The draft conveys the full sense of the Greek: the emphatic contrast (''but even''), the totality of the hairs, the perfect-passive sense of having been counted, the plural prohibition, and the comparison with many sparrows. The spelling/word division of the counting clause should be corrected so that the impersonal/passive-like subject marker is clear in Standard Igbo.'
