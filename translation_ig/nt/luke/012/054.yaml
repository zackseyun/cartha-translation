  to: Ọ na-agwakwa ìgwè mmadụ ndị ahụ sị, “Mgbe unu hụrụ ígwé ojii ka ọ na-ebili n’ebe ọdịda anyanwụ, unu na-ekwu ozugbo, ‘Oké mmiri ozuzo na-abịa,’[a] ọ na-adịkwa otú ahụ.”
