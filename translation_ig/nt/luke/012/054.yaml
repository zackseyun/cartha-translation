  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: ig
  text: Ọ na-agwakwa ìgwè mmadụ ndị ahụ sị, “Mgbe unu hụrụ ígwé ojii ka ọ na-ebili n’ebe ọdịda anyanwụ, unu na-ekwu ozugbo, ‘Oké mmiri ozuzo na-abịa,’[a] ọ na-adịkwa otú ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmiri ozuzo na-abịa.” Okwu Grik bụ ὄμβρος nwere ike ịpụta mmiri ozuzo n’ozuzu ya, ma ọ bụ oké mmiri ozuzo kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ọ na-agwakwa
  rationale: Oge imperfect na-egosi okwu nọ na-aga n’ihu ma ọ bụ nke a na-ekwukarị; usoro a bụ ụzọ Igbo sitere n’okike si gosipụta ya n’akụkọ.
- source_word: δὲ καὶ
  choice: -kwa
  rationale: Mgbakwunye -kwa na-egosipụta echiche ‘ọzọkwa/also’ n’enweghị ịgbatị δέ karịa ihe ọ pụtara.
- source_word: τοῖς ὄχλοις
  choice: ìgwè mmadụ ahụ
  rationale: Nke a na-anọchi ọtụtụ ìgwè mmadụ Grik kwuru, ma bụrụkwa okwu Igbo dị mfe ma kwanyere ùgwù.
- source_word: Ὅταν ἴδητε
  choice: Mgbe unu hụrụ
  rationale: Ọ na-egosipụta ọnọdụ a na-atụ anya ya ma ọ bụ nke na-eme mgbe ọ bụla; ‘mgbe’ dabara nke ọma n’Igbo.
- source_word: νεφέλην
  choice: ígwé ojii
  rationale: Okwu Grik pụtara ígwé ojii n’onwe ya; e tinyeghị ‘ígwé ojii mmiri’ n’ihi na gburugburu okwu ahụ emeela ka nke ahụ doo anya.
- source_word: ἀνατέλλουσαν
  choice: ka ọ na-ebili
  rationale: Nke a na-echekwa ihe oyiyi nke ígwé ojii na-ebili ma na-ada nke ọma n’Igbo.
- source_word: ἐπὶ δυσμῶν
  choice: n’ebe ọdịda anyanwụ
  rationale: Nke a na-egosi mpaghara ọdịda anyanwụ ebe a hụrụ ígwé ojii ahụ, na-enweghị imechi ohere dị n’etiti ‘n’ebe’ na ‘site n’ebe.’
- source_word: εὐθέως
  choice: ozugbo
  rationale: ‘Ozugbo’ na-enye ike nke adverb Grik ahụ n'ụzọ nkịtị.
- source_word: λέγετε
  choice: unu na-ekwu
  rationale: Usoro present a na-egosi omume a na-emekarị; Igbo a na-eme ka nke ahụ pụta ìhè.
- source_word: ὄμβρος
  choice: oké mmiri ozuzo
  rationale: ὄμβρος nwere ike ịpụta mmiri ozuzo n’ozuzu ya ma ọ bụ nnukwu mmiri ozuzo; nhọrọ a na-egosipụta echiche mmiri ozuzo siri ike ma hapụkwa nhọrọ sara mbara n’ala ala peeji.
- source_word: ἔρχεται
  choice: na-abịa
  rationale: Nke a na-egosipụta ihe dị nso ịbịa n’ụzọ Igbo dị mfe.
- source_word: γίνεται οὕτως
  choice: ọ na-emekwa otu ahụ
  rationale: Nke a na-echekwa nkwenye nke ihe e buru n’amụma na-eme n’ezie.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ùgwù. E ji ‘unu’ chekwaa plural nke ndị a na-agwa okwu; e zere okwu ụka pụrụ iche ma ọ bụ nkọwa okpukpe agbakwunyere.
