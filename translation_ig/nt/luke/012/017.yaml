  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: ig
  text: O wee na-atụgharị uche n’ime onwe ya, sị, “Gịnị ka m ga-eme, ebe ọ bụ na enweghị m ebe m ga-achịkọta ihe ubi m?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: na-atụgharị uche
  rationale: Oge imperfect na-egosi ntụgharị uche na-aga n’ihu; okwu a na-egosipụta mkparịta ụka ime obi n’Igbo nkịtị ma dị ùgwù.
- source_word: ἐν ἑαυτῷ
  choice: n’ime onwe ya
  rationale: Nke a na-edobe echiche nke mkparịta ụka dị n’ime mmadụ, kama ime ka ọ dị ka okwu e kwuru n’olu.
- source_word: λέγων
  choice: sị
  rationale: Ụdị a na-ewebata ọdịnaya nke okwu ime obi n’ụzọ dị nkenke ma bụrụ nke Igbo na-asụkarị.
- source_word: Τί ποιήσω
  choice: Gịnị ka m ga-eme
  rationale: Ajụjụ a bụ nke onye na-atụle ihe ọ ga-eme; “ga-eme” bụ ụzọ ebumpụta ụwa e si kwuo ya n’Igbo ugbu a.
- source_word: ὅτι
  choice: ebe ọ bụ na
  rationale: Ọ na-ewebata ihe kpatara ajụjụ ahụ n'ụzọ doro anya ma dị nro.
- source_word: οὐκ ἔχω ποῦ
  choice: enweghị m ebe
  rationale: Nke a bụ ụzọ Igbo si ekwu echiche nke enweghị ebe a ga-eji mee ihe.
- source_word: συνάξω
  choice: ga-achịkọta
  rationale: “Ịchịkọta” na-edobe isi echiche nke ikpokọta ihe ọnụ, na-enweghị ịgbakwunye echiche nchekwa nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: τοὺς καρπούς μου
  choice: ihe ubi m
  rationale: N’ọnọdụ ọrụ ugbo a, καρποί pụtara mkpụrụ ma ọ bụ ihe ala ahụ mepụtara n’ozuzu; “ihe ubi” doro ndị na-agụ Igbo anya ma ghara ime ka ọ bụrụ naanị mkpụrụ osisi.
