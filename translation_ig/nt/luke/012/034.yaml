id: LUK.12.34
reference: Luke 12:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ig
  text: N’ihi na ebe akụ unu dị[a], n’ebe ahụ ka obi unu ga-adịkwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ihi na ebe ọ bụla akụ unu dị, n’ebe ahụ ka obi unu ga-adịkwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: ebe
  rationale: Ọ na-ewebata nkebiokwu na-egosi ebe n’ụzọ dị mfe ma kwekọọ n’usoro ‘ebe… n’ebe ahụ…’ nke Grik.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-echekwa ọrụ okwu a dị ka nkọwa ma ọ bụ ihe kpatara ndụmọdụ dị n’amaokwu ndị bu ụzọ.
- source_word: θησαυρός
  choice: akụ
  rationale: ‘Akụ’ bụ okwu Igbo doro anya maka ihe bara uru e chekwara ma na-echekwa ma ihe ọ pụtara kpọmkwem ma ihe atụ ya n’ọnọdụ a.
- source_word: καρδία
  choice: obi
  rationale: ‘Obi’ na-echekwa echiche Akwụkwọ Nsọ banyere etiti ọchịchọ, ịhụnanya, na mkpebi mmadụ n’enweghị ime ka ihe ọ pụtara dị warara.
- source_word: ἐκεῖ
  choice: n’ebe ahụ
  rationale: Ọ na-echekwa njikọ okwu Grik nke bụ ‘ebe… n’ebe ahụ…’.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ na ngwaa na-egosi echiche nke ‘ọzọ/also’ n’ụzọ Igbo si ada nke ọma.
- source_word: ἔσται
  choice: ga-adị
  rationale: Ọ na-echekwa ọdịnihu e gosipụtara kpọmkwem na Grik, ma na-adabara eziokwu ilu a na-ekwu.
- source_word: ὑμῶν
  choice: unu
  rationale: ‘Unu’ na-egosi n'ụzọ doro anya na nnọchiaha a bụ nke mmadụ nke abụọ n’ọtụtụ, n’ebe abụọ ọ pụtara.
theological_decisions:
- issue: Ihe ‘obi’ pụtara gbasara mmadụ
  choice: E debere ‘obi’ dị ka okwu Akwụkwọ Nsọ maka etiti ọchịchọ, ịhụnanya, na ihe mmadụ ji kpọrọ ihe.
  alternative: Ịsụgharị ya n’ụzọ nkọwa dị ka ‘ọchịchọ unu’ ma ọ bụ ‘uche unu’.
  rationale: Okwu a na-ekwu n’ụzọ ilu na ndụ ime mmadụ na-esochi ihe ọ ji kpọrọ ihe. ‘Obi’ na-echekwa obosara echiche ahụ n’emeghị ka ọ bụrụ naanị otu akụkụ nke ọnọdụ ime mmadụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ugwu. E ji usoro ‘ebe… n’ebe ahụ…’ chekwaa nhazi ilu ahụ; ‘ga-adịkwa’ na-eme ka ọdịnihu na echiche mgbakwunye pụta n’ụzọ nkịtị.
