  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τί δὲ καὶ ἀφ’ ἑαυτῶν οὐ κρίνετε τὸ δίκαιον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/057.yaml
  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: ig
  text: Gịnịkwa mere unu anaghị ekpebi ihe ziri ezi n’onwe unu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ziri ezi n’ụzọ ikpe” ma ọ bụ “ihe kwesịrị ekwesị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: Gịnịkwa mere
  rationale: Ọ bụ ụzọ Igbo dị n'okike isi webata ajụjụ nkwugide nke na-aga n'ihu n'echiche bu ya ụzọ; “-kwa” na-echekwa ike njikọ nke δὲ καὶ.
- source_word: ἀφ’ ἑαυτῶν
  choice: unu onwe unu
  rationale: Nke a na-egosi na ndị a na-agwa okwu kwesịrị iji nghọta na mkpebi nke ha mee ihe, n'ebughị ụzọ chere ka onye ọzọ kpebiere ha.
- source_word: οὐ κρίνετε
  choice: anaghị ekpebi
  rationale: N'ebe a κρίνω pụtara inyocha okwu wee kpebie ya. “Ikpebi” bụ okwu Igbo doro anya ma ghara ime ka a ghọta ya naanị dịka ikpe ụlọikpe.
- source_word: τὸ δίκαιον
  choice: ihe ziri ezi
  rationale: Adjective neuter a na-arụ ọrụ dịka aha ma na-ezo aka n'ihe kwesịrị ekwesị, nke ziri ezi, ma ọ bụ nke kwekọrọ n'ikpe ziri ezi. “Ihe ziri ezi” na-echekwa obosara echiche ahụ.
theological_decisions:
- issue: Ihe τὸ δίκαιον pụtara
  choice: ihe ziri ezi
  alternative: ihe e mere n'ikpe ziri ezi; ihe kwesịrị ekwesị
  rationale: Nhọrọ a na-echekwa ma akụkụ omume ọma ma akụkụ ikpe ziri ezi nke okwu Grik ahụ, n'emeghị ka ọ bụrụ naanị okwu iwu ma ọ bụ tinye nkọwa okpukpe pụrụ iche.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee nsọpụrụ. E ji “unu” mee ka o doo anya na Jizọs na-agwa ọtụtụ mmadụ okwu; nkwugide “unu onwe unu” na-egosipụta ἀφ’ ἑαυτῶν n'ụzọ Igbo dị n'okike.
