review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical question and τὸ δίκαιον as “ihe ziri ezi.” However, ἀφ’ ἑαυτῶν is better represented by “n’onwe unu” (“by/from yourselves”) than by the more emphatic “unu onwe unu.”
  naturalness: “Gịnịkwa mere unu anaghị ekpebi ihe ziri ezi n’onwe unu?” is natural, clear Standard Igbo. Placing “n’onwe unu” after the object gives the phrase its ordinary adverbial force.
  terminology: “Ikpebi” is an appropriate nontechnical rendering of κρίνετε in this context, and “ihe ziri ezi” preserves the moral and evaluative breadth of τὸ δίκαιον. The current footnote’s first alternative is not a valid lexical equivalent and should be replaced.
  issues:
  - severity: low
    issue: The reflexive expression is positioned and framed less idiomatically.
    rationale: ἀφ’ ἑαυτῶν denotes judging from/by one’s own initiative or judgment. “N’onwe unu” expresses this directly; “unu onwe unu” mainly adds emphasis to the subject.
  - severity: medium
    issue: The footnote alternative “ihe e mere n'ikpe ziri ezi” does not translate τὸ δίκαιον.
    rationale: It means approximately “what was done in a just judgment,” adding actions and a judicial setting absent from the Greek. Lexical alternatives should retain the substantive sense “what is right/just.”
  revised_text: Gịnịkwa mere unu anaghị ekpebi ihe ziri ezi n’onwe unu?[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ziri ezi n’ụzọ ikpe” ma ọ bụ “ihe kwesịrị ekwesị.”
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek rhetorical force, the plural addressees, and the broad sense of κρίνω and τὸ δίκαιον. It renders ἀφ’ ἑαυτῶν with the natural Igbo adverbial expression “n’onwe unu” and replaces an inaccurate footnote alternative with options that do not introduce an unstated judicial action.
