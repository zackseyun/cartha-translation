- from: Gịnịkwa mere unu onwe unu anaghị ekpebi ihe ziri ezi?[a]
  to: Gịnịkwa mere unu anaghị ekpebi ihe ziri ezi n’onwe unu?[a]
  rationale: The revision retains the Greek rhetorical force, the plural addressees, and the broad sense of κρίνω and τὸ δίκαιον. It renders ἀφ’ ἑαυτῶν with the natural Igbo adverbial expression “n’onwe unu” and replaces an inaccurate footnote alternative with options that do not introduce an unstated judicial action.
  reviewer_model: gpt-5.6-terra
