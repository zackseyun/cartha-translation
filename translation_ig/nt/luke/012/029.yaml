revisions:
- from: Unu onwe unu, unu echegbula onwe unu banyere ihe unu ga-eri na ihe unu ga-aṅụ; unu anọkwala n’obi abụọ.[a]
  to: Unu, achọla ihe unu ga-eri na ihe unu ga-aṅụ; unu enwekwala obi abụọ.[a]
  rationale: The revision restores “achọla” for ζητεῖτε and leaves the state of anxious uncertainty for the separate command μετεωρίζεσθε. It retains the food-and-drink parallelism, the emphatic address, and the ambiguity of the final Greek verb without treating ordinary provision as inherently wrong.
  reviewer_model: gpt-5.6-terra
