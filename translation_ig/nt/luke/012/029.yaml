id: LUK.12.29
reference: Luke 12:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: ig
  text: Unu, achọla ihe unu ga-eri na ihe unu ga-aṅụ; unu enwekwala obi abụọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “unu echegbula onwe unu,” “unu enwekwala obi mgbagwoju anya,” ma ọ bụ, n’ụzọ okwu Grik si dị kpọmkwem karị, “unu anọkwala n’ọnọdụ a na-ejighị n’aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: unu onwe unu
  rationale: Nnọchiaha Grik a pụtara ìhè ma nwee nkwusi ike. ‘Unu onwe unu’ na-egosipụta nkwusi ike ahụ n’Igbo n’ụzọ doro anya.
- source_word: ζητεῖτε
  choice: echegbula onwe unu banyere
  rationale: N’ọnọdụ okwu a, ζητεῖτε abụghị naanị ịchọ ihe, kama ọ bụ itinye uche n’ịchọ nri na ihe ọṅụṅụ n’ụzọ nchegbu. Nsụgharị a na-egosi ihe okwu ahụ pụtara n’ebe a n’enweghị ịkatọ atụmatụ kwesịrị ekwesị.
- source_word: τί φάγητε
  choice: ihe unu ga-eri
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke okike isi kwuo ajụjụ banyere nri a ga-enweta, n’agbanyeghị na ụdị ngwaa Grik ahụ anaghị ekpebi ihe ga-eme n’ụzọ siri ike.
- source_word: τί πίητε
  choice: ihe unu ga-aṅụ
  rationale: A sụgharịrị ya n’usoro yiri τί φάγητε ka njikọ na nhazi okwu Grik wee pụta nke ọma.
- source_word: μετεωρίζεσθε
  choice: anọkwala n’obi abụọ
  rationale: N’ebe a, okwu ahụ na-egosi obi na-adịghị akwụsi ike n’ihi ejighị n’aka ma ọ bụ nchegbu. ‘Ịnọ n’obi abụọ’ bụ okwu Igbo dị ndụ nke na-edebe echiche nke ịnọ n’ọnọdụ a na-ejighị n’aka.
- source_word: καὶ ... καὶ ... καὶ
  choice: na ... na ...; ...-kwala
  rationale: Igbo na-ejikọta nri na ihe ọṅụṅụ nke ọma site na ‘na’; semikolon na ụdị ‘-kwala’ na-eburu njikọ nke iwu nke abụọ n’enweghị ime ka ahịrịokwu sie ike.
theological_decisions:
- issue: Ma iwu a ọ na-ajụ atụmatụ nkịtị maka mkpa anụ ahụ, ka ọ na-ajụ nchegbu banyere ha
  choice: Iwu megide itinye uche n’ịchọ nri na ihe ọṅụṅụ n’ụzọ nchegbu
  alternative: Iwu megide atụmatụ ọ bụla gbasara nri na ihe ọṅụṅụ
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu maka nchegbu banyere mkpa ndụ, ọ bụghị na nri na ihe ọṅụṅụ adịghị mma ma ọ bụ na mmadụ ekwesịghị ime atụmatụ ọ bụla. Nsụgharị ahụ anaghị etinye echiche okpukpe nke ileghara mkpa anụ ahụ anya.
- issue: Ogo nkọwa nke μετεωρίζεσθε
  choice: anọkwala n’obi abụọ
  alternative: unu echegbukwala onwe unu; unu anọkwala n’ọnọdụ a na-ejighị n’aka
  rationale: A họọrọ okwu na-egosi obi na-adịghị akwụsi ike na ejighị n’aka, ma e debere ụzọ ndị ọzọ n’okpuru ala ka nghọta sara mbara nke okwu Grik ghara ịla n’iyi.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ gosi na okwu ahụ bụ maka ọtụtụ mmadụ; ‘unu onwe unu’ na-eburu nkwusi ike nke ὑμεῖς. Akara ụdaume na mkpụrụedemede Igbo dịka ‘ṅ’ ka edebere nke ọma.
