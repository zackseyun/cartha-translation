id: LUK.12.56
reference: Luke 12:56
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: ig
  text: Ndị ihu abụọ! Unu maara otú e si enyocha ọdịdị ala na mbara igwe, ma oleezi otú unu na-amaghị enyocha oge a[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “oge dị mkpa” ma ọ bụ “oge kwesịrị ekwesị.” Okwu Grik bụ καιρός nwere ike ịpụta oge pụrụ iche ma ọ bụ oge kwesịrị ekwesị, ọ bụghị naanị oge n’ozuzu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριταί
  choice: Ndị ihu abụọ
  rationale: Ọ bụ okwu ịba mba a kpọrọ ndị a ihu na ihu; “ndị ihu abụọ” na-egosi ndị na-eme ka à ga-asị na ha bụ ihe ha na-abụghị, ọ bụghị ndị na-eme egwuregwu n’elu ikpo okwu.
- source_word: πρόσωπον
  choice: ihe ... na-egosi
  rationale: N’okwu a, πρόσωπον bụ ọdịdị a na-ahụ anya; ntụgharị a na-eme ka akpaalaokwu Grik ahụ daa nke ọma n’Igbo.
- source_word: γῆς καὶ τοῦ οὐρανοῦ
  choice: ala na eluigwe
  rationale: Njikọ ala na eluigwe na-ekwu banyere ihe ịrịba ama ihu igwe; “eluigwe” bụ okwu Igbo nkịtị nke nwere ike ịpụta mbara igwe n’ọnọdụ a.
- source_word: οἴδατε δοκιμάζειν
  choice: unu maara otú e si akọwa
  rationale: οἴδατε tinyere infinitive na-egosi ịma otú e si eme ihe, ebe δοκιμάζειν n’ebe a bụ inyocha ihe ịrịba ama ma ghọta ihe ọ pụtara.
- source_word: τὸν καιρὸν τοῦτον
  choice: oge a
  rationale: “Oge a” na-asụgharị demonstrative na καιρός ozugbo, ma ghara ịmanye nkọwa pụrụ iche n’ahịrịokwu bụ isi; nkọwa ụkwụ na-edebe echiche nke oge dị mkpa ma ọ bụ oge kwesịrị ekwesị.
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: ma olee otú unu na-amaghị akọwa
  rationale: Ajụjụ a na-edebe ike nke ajụjụ ịba mba πῶς ma na-emegharị okwu “ịkọwa” dịka Grik si eme.
theological_decisions:
- issue: Ihe καιρός pụtara n’ịba mba Jizọs
  choice: oge a
  alternative: oge a dị mkpa / oge a kara aka
  rationale: Akụkụ a nwere ike na-ezo aka n’oge pụrụ iche nke ozi Jizọs na ọrụ Chineke, ma ederede Grik akọwaghị ya n’uju. Ya mere, isi ederede na-edebe obosara okwu ahụ, ebe nkọwa ụkwụ na-egosi ihe ndị ọzọ o nwere ike ịpụta.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. E ji “ndị ihu abụọ” mee ka ịba mba ahụ doo anya, ma jiri ahịrịokwu a na-asụ n’ụzọ nkịtị kọwaa akpaalaokwu banyere ọdịdị ala na eluigwe.
