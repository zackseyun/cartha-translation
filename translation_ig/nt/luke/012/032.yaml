revisions:
- from: “Atụla egwu, gị obere ìgwè atụrụ,[a] n’ihi na o masịrị Nna unu inye unu alaeze ahụ.[b]”
  to: “Obere ìgwè atụrụ, atụla egwu,[a] n’ihi na o masịrị Nna unu inye unu alaeze ahụ.[b]”
  rationale: The revision removes the unnatural singular pronoun from the collective vocative while preserving the Greek metaphor and direct exhortation. It also corrects the corresponding lexical footnote and refines the kingdom note so that it reflects both major semantic dimensions without imposing a theological interpretation.
