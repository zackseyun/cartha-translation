id: LUK.12.32
reference: Luke 12:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: ig
  text: “Obere ìgwè atụrụ, atụla egwu,[a] n’ihi na o masịrị Nna unu inye unu alaeze ahụ.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ìgwè atụrụ nta.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta “alaeze” dị ka “ọchịchị eze,” nke na-emesi ọchịchị Chineke dị ka Eze ike, nakwa alaeze o nyere ndị ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: Atụla egwu
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji asụkarị maka mmachibido ịtụ egwu; ọ na-echekwa ike nke iwu Grik ahụ.
- source_word: τὸ μικρὸν ποίμνιον
  choice: gị obere ìgwè atụrụ
  rationale: “Ìgwè atụrụ” na-echekwa ihe atụ nke onye ọzụzụ atụrụ na ìgwè ya, ebe “obere” na-egosi na ìgwè ahụ pere mpe. “Gị” na-eme ka okwu a na-akpọ ìgwè ahụ kpọmkwem doo anya n’Igbo.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere ha na-ekwesịghị ịtụ egwu, dịka njikọ na-egosi ihe kpatara ihe si dị na Grik.
- source_word: εὐδόκησεν
  choice: o masịrị
  rationale: Ọ na-egosi ezi ọchịchọ na obi ụtọ Nna ahụ n’enweghị ịgbakwunye echiche nkà mmụta okpukpe gbasara mkpebi ebighị ebi.
- source_word: ὁ πατὴρ ὑμῶν
  choice: Nna unu
  rationale: Ọ na-agbaso Grik nke kwuru naanị “Nna unu,” n’etinyeghị “nke eluigwe” nke na-adịghị n’amaokwu a.
- source_word: δοῦναι ὑμῖν
  choice: inye unu
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma dị ndụ nke infinitive na nnọchiaha dative ahụ.
- source_word: τὴν βασιλείαν
  choice: alaeze ahụ
  rationale: “Alaeze” bụ okwu Akwụkwọ Nsọ a maara nke ọma ma nwee ike ibu ma echiche ọchịchị eze ma ebe ndị ọchịchị ahụ nọ; “ahụ” na-egosipụta article Grik.
theological_decisions:
- issue: Ihe βασιλεία pụtara
  choice: alaeze ahụ
  alternative: ọchịchị eze ahụ
  rationale: “Alaeze” na-ahapụ oghere maka ma ọchịchị Chineke dị ka Eze ma ihe/ndị nọ n’okpuru ọchịchị ya, kama imechi okwu ahụ n’otu nghọta naanị.
- issue: Ihe εὐδόκησεν pụtara banyere uche Chineke
  choice: o masịrị
  alternative: o ji amara họrọ
  rationale: Nhọrọ a na-egosi ezi obi ụtọ na ọchịchọ ọma nke Nna ahụ, ma ọ naghị ebubata nkọwa pụrụ iche banyere iwu ma ọ bụ mkpebi Chineke.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ nke ìgwè atụrụ na ụda ịhụnanya dị n’okwu a. Akara nkọwa ala peeji niile dị n’ederede isi.
