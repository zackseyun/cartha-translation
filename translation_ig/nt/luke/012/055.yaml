  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: ig
  text: Mgbe ifufe ndịda na-efe[a], unu na-asị, ‘Oke okpomọkụ ga-adị,’[b] ọ na-adịkwa otú ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘ndịda’—ya bụ, ifufe ndịda.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘okpomọkụ’ ma ọ bụ ‘okpomọkụ na-ere ọkụ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νότον
  choice: ifufe ndịda
  rationale: N’ọnọdụ amụma ihu igwe a, νότον pụtara ifufe si n’ebe ndịda; ‘ifufe ndịda’ na-eme ka nke a doo anya n’Igbo.
- source_word: πνέοντα
  choice: na-efe
  rationale: Nke a na-egosi ifufe ahụ ka ọ na-aga n’ihu ife, dịka participle nke oge ugbu a si dị.
- source_word: λέγετε
  choice: unu na-asị
  rationale: Oge ugbu a na-egosi ihe ha na-emekarị mgbe ha hụrụ ụdị ihu igwe a.
- source_word: Καύσων
  choice: okpomọkụ dị egwu
  rationale: Καύσων na-egosi okpomọkụ siri ike ma na-akpagbu mmadụ; okwu a bụ nke nghọta doro anya n’Igbo ugbu a.
- source_word: ἔσται
  choice: ga-adị
  rationale: Ọ na-egosi na ọnọdụ okpomọkụ ahụ ga-abịa ma ọ bụ ga-adị.
- source_word: γίνεται
  choice: ọ na-adịkwa otú ahụ
  rationale: Nke a na-egosi na ihe ha buru n’amụma na-emezu, ma na-ada nke ọma n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugwu ma dị mfe nghọta. E debere usoro okwu ahụ nso na Grik, ma jiri akpaalaokwu Igbo mee ka amụma ihu igwe na mmezu ya daa nke ọma.
