    rationale: Although it can communicate extreme heat, ‘dị egwu’ may also mean frightening/terrible. ‘Oke okpomọkụ’ is the clearer ordinary Igbo expression for severe or scorching heat.
  - severity: low
    issue: Footnote a does not precisely state the lexical alternative.
    rationale: The alternative to ‘ifufe ndịda’ is bare ‘ndịda’; the existing wording ‘ndịda na-efe’ turns it into a clause and is less suitable as a lexical footnote.
