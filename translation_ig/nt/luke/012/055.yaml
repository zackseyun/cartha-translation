  verdict: revise
  source_fidelity: The draft accurately represents the weather setting, the customary present force of λέγετε, the future prediction, and the fulfillment expressed by γίνεται. However, ‘okpomọkụ dị egwu’ can suggest frightening or terrible heat rather than specifically intense, scorching heat.
  naturalness: ‘Mgbe ifufe ndịda na-efe’ and ‘ọ na-adịkwa otú ahụ’ are natural Standard Igbo. Replacing ‘okpomọkụ dị egwu’ with ‘oke okpomọkụ’ gives a more idiomatic and unambiguous expression.
  terminology: ‘Ifufe ndịda’ appropriately renders νότον in this meteorological context. ‘Oke okpomọkụ’ adequately conveys Καύσων without importing a modern technical term such as ‘heat wave.’ The first footnote is adjusted so that its alternative is actually the lexical alternative ‘ndịda,’ not a full, less natural clause.
