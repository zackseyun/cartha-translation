  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ παραβολὴν πρὸς αὐτοὺς λέγων· Ἀνθρώπου τινὸς πλουσίου εὐφόρησεν ἡ χώρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: ig
  text: Mgbe ahụ, ọ gwara ha ilu, sị, “Ala nke otu nwoke bara ọgaranya mịrị mkpụrụ n'ụba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Mgbe ahụ, ọ gwara
  rationale: ‘Mgbe ahụ’ na-egosi ntakịrị ọganihu n'akụkọ ahụ n'ụzọ Igbo dị ndụ, ebe ‘ọ gwara’ dabara n'okwu e ji ‘ilu’ mee ihe karịa nsụgharị nkịtị dịka ‘ọ sịrị ilu.’
- source_word: παραβολὴν
  choice: ilu
  rationale: ‘Ilu’ bụ okwu Igbo a na-ejikarị akọwa παραβολή n'Oziọma, ya bụ akụkọ ntụnyere nke na-akụzi eziokwu.
- source_word: πρὸς αὐτοὺς
  choice: ha
  rationale: E tinyere echiche nke ịgwa ndị ahụ okwu n'usoro Igbo nkịtị ‘ọ gwara ha.’
- source_word: λέγων
  choice: sị
  rationale: ‘Sị’ na-ewebata kpọmkwem ihe dị n'ilu ahụ n'ụzọ dị mkpirikpi ma bụrụkwa Igbo eke.
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: otu nwoke bara ọgaranya
  rationale: ‘Otu nwoke’ na-echekwa τινός na nwoke kpọmkwem nke ụdị okwu Grik ahụ na-egosi; ‘bara ọgaranya’ bụ okwu Igbo doro anya maka πλουσίου.
- source_word: εὐφόρησεν
  choice: mịrị mkpụrụ n'ụba
  rationale: Okwu a na-egosi na ala ahụ rụpụtara nke ọma nke ukwuu. ‘Mịrị mkpụrụ n'ụba’ bụ okwu ọrụ ugbo e ji Igbo eke kwuo ya.
- source_word: ἡ χώρα
  choice: Ala
  rationale: N'ebe a χώρα pụtara ala ọrụ ugbo ma ọ bụ ala nwoke ahụ nwere, ọ bụghị obodo ma ọ bụ mba.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E debeghị akara nkọwa ala peeji n'ihi na nhọrọ ‘mịrị mkpụrụ n'ụba’ na-egosipụta εὐφόρησεν nke ọma n'ime amaokwu ahụ n'onwe ya.
