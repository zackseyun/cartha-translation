    issue: Possessive construction in ‘Ala otu nwoke bara ọgaranya’
    rationale: The Greek genitive Ἀνθρώπου τινὸς πλουσίου modifies χώρα (‘the land of a certain rich man’). In Standard Igbo, ‘ala nke otu nwoke bara ọgaranya’ clearly and naturally expresses this relation.
  revised_text: Mgbe ahụ, ọ gwara ha ilu, sị, “Ala nke otu nwoke bara ọgaranya mịrị mkpụrụ n'ụba.”
