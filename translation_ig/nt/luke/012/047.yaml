source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: ig
  text: Ma ohu ahụ, onye maara ihe nna ya ukwu chọrọ ma o meghị nkwadebe, o meghịkwa ihe kwekọrọ n’ihe nna ya ukwu chọrọ, a ga-eti ya ọtụtụ ugboro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, a kwughị aha ihe “ọtụtụ” na-akọwa; ihe a na-ekwu bụ na a ga-eti ya ọtụtụ ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosi onye nọ n’okpuru onye nwe ya, ọ bụghị naanị onye ọrụ e goro ego; nke a dabara n’ọnọdụ ilu a na ikike nna ukwu nwere n’ebe ọ nọ.
- source_word: γνοὺς
  choice: nke maara
  rationale: Nke a na-egosi na ohu ahụ amaraworị ihe nna ya ukwu chọrọ tupu ọ jụ ime ya.
- source_word: θέλημα
  choice: ihe ... chọrọ / uche
  rationale: E ji okwu abụọ a na-asụkarị n’Igbo gosipụta ọchịchọ ma ọ bụ nzube nna ukwu, n’enweghị ime ka ahịrịokwu ahụ sie ike nghọta.
- source_word: κυρίου αὐτοῦ
  choice: nna ya ukwu
  rationale: N’ọnọdụ ezinụlọ nke ilu a, “nna ya ukwu” na-egosi onye nwe ohu ahụ nke ọma, na-enweghị ime κύριος ka ọ bụrụ aha nsọ kpọmkwem n’ahịrịokwu a.
- source_word: μὴ ἑτοιμάσας
  choice: ọ kwadoghị onwe ya
  rationale: “Kwado onwe ya” bụ ụzọ Igbo si ekwu n’ụzọ doro anya na onye ahụ emeghị onwe ya njikere; ọ na-eme ka ngwaa ahụ e hapụrụ ihe ọ na-emetụta na Grik bụrụ nke a ga-aghọta.
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: ma ọ bụ mee ihe kwekọrọ n’uche nna ya ukwu
  rationale: Nke a na-edobe ọdịiche dị n’etiti ịkwadebe onwe ya na ime ihe n’ụzọ kwekọrọ n’uche nna ukwu.
- source_word: δαρήσεται πολλάς
  choice: a ga-eti ya ọtụtụ ugboro
  rationale: Nke a na-edobe ọdịdị passive nke ngwaa ahụ na echiche nke iti ya ugboro ọtụtụ, n’enweghị ịgbakwụnye ụdị ngwá e ji tie ya nke Grik na-ekwughị.
theological_decisions:
- issue: Ịsụgharị κύριος n’ọnọdụ ilu banyere nna ukwu na ohu
  choice: nna ya ukwu
  alternative: Onyenwe ya
  rationale: N’ahịrịokwu a, okwu ahụ na-akọwa mmekọrịta dị n’etiti ohu na onye nwe ya. “Nna ya ukwu” na-eme ka ọnọdụ ilu ahụ doo anya ma hapụkwa ihe ilu ahụ na-ezo aka na ya ka ọ dị.
- issue: Okwu ntaramahụhụ δαρήσεται πολλάς
  choice: a ga-eti ya ọtụtụ ugboro
  alternative: a ga-eti ya ọtụtụ ihe / a ga-apịa ya ọtụtụ ụtarị
  rationale: Grik hapụrụ aha nke πολλάς na-akọwa n’ekwughị ya. “Ọtụtụ ugboro” na-echekwa echiche nke iti ugboro ugboro, ma ọ naghị ekpebi na e ji ụtarị tie ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ debere ụda ịdọ aka ná ntị nke ilu ahụ, zere okwu ochie, ma ghara ịkọwa ihe atụ ahụ karịa ka Grik si kwuo.
