id: LUK.12.25
reference: Luke 12:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: ig
  text: Ònye n’ime unu pụrụ, site n’ichegbu onwe ya, ịgbakwunye otu kubit n’ogologo ndụ ya[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ogologo ahụ ya.” Okwu Grik a sụgharịrị “ogologo ndụ” nwekwara ike ịpụta ogo ma ọ bụ ogologo ahụ mmadụ.
    reason: Preserves the lexical ambiguity of ἡλικίαν while retaining “lifespan” as the main contextual rendering.
lexical_decisions:
- source_word: μεριμνῶν
  choice: site ná nchegbu ya
  rationale: Na-egosi nchegbu ma ọ bụ ichegbu onwe, ma na-edebe ụzọ okwu nke na-akọwa ihe mmadụ ji eme ihe ahụ.
- source_word: ἡλικίαν
  choice: ogologo ndụ ya
  rationale: ἡλικία nwere ike ịpụta afọ ndụ, ogologo ndụ, ma ọ bụ ogo mmadụ; n’ebe a, njikọ ya na πῆχυς bụ ihe atụ banyere ịgbatị ndụ, dịka okwu gbara amaokwu ahụ gburugburu si kwado.
- source_word: πῆχυν
  choice: otu kubit
  rationale: Na-edebe ihe atụ mbụ nke otu mízurụ ogologo oge ochie kama ịgbanwe ya ka ọ bụrụ nke oge a.
- source_word: δύναται ... προσθεῖναι
  choice: pụrụ ịgbakwụnye
  rationale: Na-egosipụta ajụjụ banyere ikike mmadụ ime ihe ahụ n’asụsụ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa.
theological_decisions:
- issue: Ma ἡλικίαν ọ pụtara ogologo ahụ mmadụ ka ọ bụ ogologo ndụ ya
  choice: ogologo ndụ ya
  alternative: ogologo ahụ ya
  rationale: Okwu ndị gbara amaokwu ahụ gburugburu lekwasịrị anya ná ndụ na mkpa mmadụ enweghị ike idozi; nsụgharị a na-edebe ihe atụ nke ‘otu kubit’ n’enweghị ịkọwa ya karịa ihe ederede kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘kubit’ debe mízurụ oge ochie; a naghị etinye nkọwa ụka ma ọ bụ nke otu okpukpe.
