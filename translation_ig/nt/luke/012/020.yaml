  to: Ma Chineke sịrị ya, “Onye nzuzu! N'abalị a kpọmkwem, a na-achọ ndụ gị[a] n'aka gị; ihe ndị ahụ i kwadebere, ha ga-abụ nke onye?”
  rationale: A minor idiomatic revision removes the nonessential additive particle from the final rhetorical question. All other wording is retained because it faithfully preserves the Greek's force, its unspecified plural subject, and the lexical ambiguity of ψυχή.
