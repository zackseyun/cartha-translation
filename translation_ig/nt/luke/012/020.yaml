source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: ig
  text: Ma Chineke sịrị ya, “Onye nzuzu! N'abalị a kpọmkwem, a na-achọ ndụ gị[a] n'aka gị; ihe ndị ahụ i kwadebere, ha ga-abụ nke onye?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ obi gị.” Okwu Grik ahụ nwere ike ịpụta “ndụ” ma ọ bụ “mkpụrụ obi,” dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: Onye nzuzu
  rationale: Ọ bụ okwu ịba mba a gwara nwoke ahụ ihu na ihu. “Onye nzuzu” bụ Igbo doro anya ma sie ike, n'ebughị nkọwa ọzọ abata.
- source_word: ταύτῃ τῇ νυκτί
  choice: N'abalị a kpọmkwem
  rationale: “Kpọmkwem” na-egosipụta nkwusi ike nke okwu ngosi ahụ ma mee ka ịdị ngwa nke ihe ga-eme pụta ìhè n'Igbo nkịtị.
- source_word: ψυχήν
  choice: ndụ gị
  rationale: N'ebe a, okwu Grik ahụ na-ekwu banyere ndụ nwoke ahụ nke a ga-achọ n'aka ya n'abalị ahụ. “Ndụ” dabara n'ọnọdụ ahụ, ebe e debere “mkpụrụ obi” dị ka ụzọ ọzọ na nkọwa ala peeji.
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: a na-achọ ... n'aka gị
  rationale: Ngwaa Grik ahụ dị n'ụdị ọtụtụ mmadụ ma onye na-eme ya akọwaghị. Ụdị Igbo na-eji “a” eme ka onye na-eme ihe ghara ịpụta, ma “ịchọ ... n'aka” na-echekwa echiche nke ịrịọsi ike ma ọ bụ ịnara ihe a chọrọ.
- source_word: ἃ δὲ ἡτοίμασας
  choice: ihe ndị ahụ i kwadebere
  rationale: Nke a na-ezo aka n'ihe onwunwe nwoke ahụ chịkọbara ma kwadebe, ma ọ na-agbasochi usoro na ihe okwu Grik pụtara.
- source_word: τίνι ἔσται
  choice: ha ga-abụkwa nke onye?
  rationale: Ajụjụ a na-ajụ onye ihe ndị ahụ ga-abụ nke ya. Ụdị a bụ Igbo e ji eme ihe nke ọma ma na-echekwa ike ajụjụ ahụ.
theological_decisions:
- issue: Otú e si tụgharị ψυχή n'ọnọdụ ọnwụ na-abịa nso
  choice: ndụ
  alternative: mkpụrụ obi
  rationale: Ihe gbara amaokwu ahụ gburugburu lekwasịrị anya n'ọnwụ nwoke ahụ n'abalị ahụ. “Ndụ” anaghị amanye otu nkọwa pụrụ iche banyere ọdịdị mmadụ; nkọwa ala peeji na-edebekwa “mkpụrụ obi” n'ihi obosara ihe okwu Grik ahụ pụrụ ịpụta.
- issue: Onye na-achọ ndụ ahụ
  choice: 'E jiri ụdị onye na-eme ihe na-apụtaghị ìhè: “a na-achọ”'
  alternative: “ha na-achọ” ma ọ bụ ịkpọ Chineke kpọmkwem dị ka onye na-achọ ya
  rationale: Ngwaa Grik ahụ bụ ọtụtụ mmadụ, ma isiokwu ya akọwaghị. Ịghara ịkpọ onye na-eme ya aha na-echekwa mgbagwoju anya dị n'ihe odide ahụ ma ghara itinye ndị mmụọ ozi, Chineke, ma ọ bụ ndị ọzọ n'ime amaokwu ahụ n'enweghị nkwado doro anya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, doro anya ma nwee ugwu. Ahịrịokwu ahụ na-echekwa ịba mba, ịdị ngwa nke abalị ahụ, na ajụjụ ikpeazụ siri ike, ma ọ naghị akpọ onye ngwaa ọtụtụ ahụ na-ezo aka na ya aha.
