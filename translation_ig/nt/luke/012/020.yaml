review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys the divine address, the emphatic temporal phrase, the unspecified agents of απαιτουσιν, ψυχή as imminent earthly life, and the final question about the prepared possessions. The impersonal Igbo construction “a na-achọ ... n'aka gị” appropriately avoids supplying an agent not named in the Greek.
  naturalness: The sentence is clear, modern Standard Igbo, and its urgent, admonitory register suits the parable. Removing “-kwa” from the final question produces a more idiomatic and focused possessive question without introducing the additive sense of “also.”
  terminology: “Onye nzuzu” is a natural forceful equivalent for Ἄφρων; “ndụ” is contextually sound for ψυχή, with “mkpụrụ obi” properly retained as a lexical alternative in the footnote. “N'abalị a kpọmkwem” effectively expresses the emphasis of ταύτῃ τῇ νυκτί.
  issues:
  - severity: low
    issue: The enclitic “-kwa” in “ha ga-abụkwa nke onye?” can carry an unnecessary additive nuance.
    rationale: δέ here marks the transition to the rhetorical question, not necessarily addition. Omitting “-kwa” makes the question more direct while preserving its meaning.
