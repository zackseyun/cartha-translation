id: LUK.12.42
reference: Luke 12:42
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: ig
  text: Onyenwe anyị sịrị, “Ònye kwa bụ onye nlekọta ụlọ nke kwesịrị ntụkwasị obi, nke nwere ezi uche[a], onye onyenwe ụlọ ga-atụkwasị n’ọrụ ilekọta ndị ọrụ ụlọ ya, ka o nye ha oke nri ha[b] n’oge kwesịrị ekwesị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye maara ihe.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ okwu Grik ahụ si kwuo ya kpọmkwem: “oke ọka a tụrụ atụ,” ya bụ, òkè nri e tụrụ atụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị / nna ya ukwu
  rationale: N’ebe mbụ, okwu a bụ aha e ji akpọ Jizọs dịka onye na-ekwu okwu, ya mere ‘Onyenwe anyị’ dabara adaba. N’ime ihe atụ ahụ, ọ na-ezo aka n’onye nwe ụlọ, ya mere ‘nna ya ukwu’ na-eme ka ọkwa abụọ ahụ doo anya ma na-echekwa otu ihe okwu Grik ahụ pụtara n’ọnọdụ dị iche iche.
- source_word: πιστός
  choice: kwesịrị ntụkwasị obi
  rationale: N’ebe a, okwu ahụ na-akọwa onye a pụrụ ịtụkwasị ọrụ e nyere ya obi; nkebiokwu a bụ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwupụta ntụkwasị obi.
- source_word: οἰκονόμος
  choice: onye na-elekọta ụlọ
  rationale: Okwu ahụ pụtara onye e nyere ọrụ ilekọta na ịhazi ihe gbasara ụlọ ma ọ bụ ezinụlọ ukwu. Nsụgharị a na-egosipụta ọrụ nlekọta ahụ n’asụsụ Igbo nkịtị.
- source_word: φρόνιμος
  choice: nwere ezi uche
  rationale: Okwu ahụ na-egosi amamihe bara uru, ezi mkpebi, na ịkpachapụ anya n’ọrụ. ‘Nwere ezi uche’ bụ ụzọ dị mfe ma dị ndụ e si kwuo ya n’Igbo.
- source_word: καταστήσει
  choice: ga-ahọpụta ka ọ na-elekọta
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara itinye mmadụ n’ọkwa ma nye ya ọrụ nlekọta; ‘ga-ahọpụta’ na-egosi inyefe ọrụ ahụ nke ọma.
- source_word: θεραπείας
  choice: ndị na-ejere ya ozi n’ụlọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ìgwè ndị ọrụ ma ọ bụ ndị na-eje ozi n’ụlọ, ọ bụghị n’ọrụ ọgwụgwọ ma ọ bụ echiche nkịtị nke ije ozi.
- source_word: ἐν καιρῷ
  choice: n’oge kwesịrị ekwesị
  rationale: Nkebiokwu a na-egosi oge ziri ezi ma ọ bụ oge e kwesịrị ime ihe ahụ.
- source_word: σιτομέτριον
  choice: oke nri ha
  rationale: Okwu ahụ pụtara nri a tụrụ atụ ma kee nye onye ọ bụla. ‘Oke nri ha’ na-ekwupụta nke a n’ụzọ dị mfe, ebe nkọwa ala peeji na-echekwa nkọwa kpọmkwem banyere ọka.
theological_decisions:
- issue: Otu e si sụgharịa κύριος ugboro abụọ
  choice: ‘Onyenwe anyị’ maka Jizọs dịka onye na-ekwu okwu; ‘nna ya ukwu’ maka onye nwe ụlọ n’ime ihe atụ ahụ
  alternative: Iji ‘Onyenwe anyị’ n’ebe abụọ ahụ
  rationale: Ọ bụ otu okwu Grik ka e ji mee ihe, ma ebe ndị ahụ ọ nọ na-arụ ọrụ dị iche. Nsụgharị a na-egbochi mgbagwoju anya n’etinyeghị nkọwa okpukpe na-adịghị n’ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta, mee ihe. Ajụjụ ahụ ka bụ ajụjụ atụ nke na-akpọ onye na-ege ntị ka o chee echiche; e tinyebeghị nkọwa ga-ekpebi onye onye na-elekọta ụlọ ahụ nọchiri anya ya.
