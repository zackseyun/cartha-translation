    text: 'N’ụzọ okwu Grik ahụ si kwuo ya kpọmkwem: “oke ọka a tụrụ atụ,” ya bụ, òkè nri e tụrụ atụ.'
    reason: lexical_alternative
  revision_rationale: 'The revision retains the source’s ambiguity-free narrative/parabolic distinction without importing interpretation: “Onyenwe anyị” is kept for Jesus as speaker, while “onyenwe ụlọ” identifies the master within the parable. It improves Standard Igbo idiom, represents appointment to entrusted responsibility, and narrows the food-ration note to what the Greek explicitly states.'
