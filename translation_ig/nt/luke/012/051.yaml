id: LUK.12.51
reference: Luke 12:51
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: ig
  text: Ùnu chere na m bịara inye udo n’ụwa? Mba, ana m agwa unu, kama nkewa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοκεῖτε
  choice: Ùnu chere
  rationale: Ọ bụ ajụjụ a na-ajụ ọtụtụ ndị ozugbo banyere ihe ha na-eche; okwu a bụ asụsụ Igbo dị mfe ma dị ugbu a.
- source_word: εἰρήνην
  choice: udo
  rationale: “Udo” na-edobe obosara okwu Grik ahụ, gụnyere ịdị n’otu na enweghị esemokwu n’etiti ndị mmadụ.
- source_word: παρεγενόμην
  choice: na m bịara
  rationale: Ọ na-egosi ọbịbịa Jizọs nke nwere nzube, ma kwekọọ n’ụzọ e si ekwu ya n’Igbo.
- source_word: δοῦναι
  choice: inye
  rationale: Nke a bụ ntụgharị kpọmkwem nke infinitive Grik ahụ ma na-ada nke ọma n’Igbo n’ahịrịokwu a.
- source_word: ἐν τῇ γῇ
  choice: n’ụwa
  rationale: “N’ụwa” na-egosi nghọta sara mbara karịa “n’ala,” nke nwere ike ime ka okwu ahụ yie naanị otu mpaghara.
- source_word: οὐχί
  choice: Mba
  rationale: Ọ bụ nzaghachi nkw否 siri ike, dị mkpụmkpụ ma doo anya.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Ọ bụ usoro okwu nkịtị ma dị ebube n’Igbo maka nkwupụta Jizọs nye ọtụtụ ndị.
- source_word: ἀλλ’ ἢ
  choice: kama
  rationale: “Kama” na-egosipụta ntụgharị siri ike site n’udo gaa n’ihe dị iche na ya.
- source_word: διαμερισμόν
  choice: nkewa
  rationale: “Nkewa” bụ okwu sara mbara nke na-ekpuchi ikewa na esemokwu mmekọrịta mmadụ na ibe ya, dịka amaokwu ndị na-esote si kọwaa.
theological_decisions:
- issue: Ma a ga-eme ka ọdịiche dị n’etiti udo na nkewa dị nro n’ihi akụkụ Akwụkwọ Nsọ ndị ọzọ na-ekwu banyere udo
  choice: 'E debere okwu ahụ n’ụzọ siri ike: ọ bụghị udo, kama nkewa.'
  alternative: Ịsụgharị ya n’ụzọ nkọwa dịka “ọ bụghị udo, kama esemokwu,” ma ọ bụ ime ka nkewa ahụ yie naanị ihe mere na mberede.
  rationale: Grik ahụ na-etinye udo na nkewa n’ọdịiche doro anya. Amaokwu ndị sochirinụ na-egosi nkewa n’etiti ndị ezinụlọ n’ihi ozi Jizọs; ya mere, e kwesịghị iwepụ mgbagwoju anya ahụ ma ọ bụ mee ka ọ dị nro.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị mfe nghọta ma nwee ugwu. E jiri “inye udo” debe okwu Grik δοῦναι nso; e jiri “n’ụwa” gosipụta obosara γῆ. Enweghị ihe odide ala peeji dị mkpa, n’ihi na nhọrọ ndị a na-ada nke ọma n’Igbo ma ghara imechi ezigbo obosara isi iyi.
