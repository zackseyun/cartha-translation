source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: ig
  text: 'Mgbe ahụ, ọ gwara ndị na-eso ụzọ ya, sị, “N’ihi nke a ka m ji agwa unu: Unu echegbula onwe unu[a] banyere ndụ unu[b], ihe unu ga-eri, nakwa banyere ahụ unu, ihe unu ga-eyi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Unu enwela nchegbu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mkpụrụ obi unu.” N’ebe a, okwu Grik ahụ na-apụtakarị “ndụ,” ya bụ, ịdị ndụ mmadụ n’ụwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Mgbe ahụ, ọ gwara
  rationale: δέ bụ njikọ dị nro. “Mgbe ahụ” na-eme ka akụkọ ahụ gaa n’ihu n’Igbo n’enweghị ime ka ọ bụrụ nnukwu okwu mmegide.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo doro anya maka μαθηταί, ma “ya” na-echekwa αὐτοῦ e dere kpọmkwem na Grik.
- source_word: Διὰ τοῦτο λέγω ὑμῖν
  choice: N’ihi nke a ka m ji agwa unu
  rationale: Nhazi a na-echekwa ihe Διὰ τοῦτο na-egosi—na okwu a sitere n’ihe e kwuru n’amaokwu ndị bu ya ụzọ—ma bụrụkwa Igbo dị ndụ ma dị mfe nghọta.
- source_word: μὴ μεριμνᾶτε
  choice: Unu echegbula onwe unu
  rationale: μεριμνάω n’ebe a pụtara inwe nchegbu na-enye mmadụ nsogbu. Okwu a bụ ụzọ e si ekwu ya n’Igbo nkịtị, ma ndetu ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ya.
- source_word: τῇ ψυχῇ
  choice: banyere ndụ unu
  rationale: N’ọnọdụ a, ψυχή na-ezo aka ná ndụ mmadụ n’ụwa, nke nri na-akwado, ọ bụghị kpọmkwem akụkụ ime mmụọ a na-akpọ mkpụrụ obi.
- source_word: τί φάγητε
  choice: ihe unu ga-eri
  rationale: Nke a na-egosi ajụjụ metụtara ihe ga-eme n’ọdịnihu ma na-ada nke ọma n’Igbo.
- source_word: μηδὲ τῷ σώματι
  choice: ma ọ bụ banyere ahụ unu
  rationale: N’okwu mmachibido a, “ma ọ bụ” na-ejikọta akụkụ nke abụọ n’ụzọ ebumpụta ụwa, na-etinye “echegbula” nke e kwuru ná mmalite n’ọrụ n’akụkụ abụọ ahụ.
- source_word: τί ἐνδύσησθε
  choice: ihe unu ga-eyi
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’ụdị “ihe unu ga-eri,” ma na-echekwa echiche iyi uwe.
theological_decisions:
- issue: Ihe ψυχή pụtara n’ebe a
  choice: ndụ
  alternative: mkpụrụ obi
  rationale: Nri na ψυχή, ya na uwe na σώμα, nọ n’usoro yiri ibe ha. Ya mere, “ndụ” na-egosi ndụ mmadụ n’ụwa n’enweghị ịmanye nghọta gbasara nkewa nke ahụ na mkpụrụ obi; a ka debere “mkpụrụ obi” na ndetu dị ka ntụgharị e nwere ike ịhụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. A haziri ahịrịokwu ahụ ka ọ bụrụ okwu ọnụ Jizọs gaara agwa ndị na-eso ụzọ ya, ma e chekwara njikọ dị n’etiti ndụ na nri, nakwa ahụ na uwe.
