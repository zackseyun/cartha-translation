    text: “Ụlọ nzukọ ndị Juu na ndị na-achị achị na ndị ọchịchị” na-ezo aka n’òtù okpukpe na nke ọchịchị ndị nwere ike ịjụ ndị na-eso ụzọ ajụjụ ma ọ bụ kpee ha ikpe.
    reason: cultural_note
  - marker: b
    text: 'A pụkwara ịsụgharị ya n’ụzọ ka nke iwu si dị: “otú ma ọ bụ ihe unu ga-eji gbachitere onwe unu.”'
    reason: lexical_alternative
  revision_rationale: The revision distinguishes the two governmental terms in a natural way, preserves the source’s judicial nuance, and repairs the lexical footnote so that it represents both “how” and “what.” No theological interpretation has been added.
