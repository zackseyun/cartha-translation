  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: ig
  text: Ma mgbe ọ bụla ha kpọtara unu n’ihu ụlọ nzukọ ndị Juu na ndị na-achị achị na ndị ọchịchị[a], unu echegbula onwe unu banyere otú ma ọ bụ ihe unu ga-ekwu n’ịgbachitere onwe unu[b], ma ọ bụ ihe unu ga-ekwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụlọ nzukọ ndị Juu na ndị na-achị achị na ndị ọchịchị” na-ezo aka n’òtù okpukpe na nke ọchịchị ndị nwere ike ịjụ ndị na-eso ụzọ ajụjụ ma ọ bụ kpee ha ikpe.
    reason: cultural_note
  - marker: b
    text: 'A pụkwara ịsụgharị ya n’ụzọ ka nke iwu si dị: “otú ma ọ bụ ihe unu ga-eji gbachitere onwe unu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Ma mgbe ọ bụla
  rationale: “Mgbe ọ bụla” na-egosipụta ihe nwere ike ime n’ọdịnihu ugboro ọ bụla; “Ma” na-eburu njikọ δέ n’ụzọ dị nro n’usoro okwu a.
- source_word: εἰσφέρωσιν ὑμᾶς
  choice: ha kpọtara unu
  rationale: N’ọnọdụ ikpe a, okwu ahụ pụtara ịkpọta mmadụ ka ọ pụta n’ihu ndị na-enyocha ma ọ bụ na-ekpe ikpe.
- source_word: ἐπὶ τὰς συναγωγὰς
  choice: n’ihu ụlọ nzukọ ndị Juu
  rationale: A hapụrụ ihe συναγωγή pụtara kpọmkwem, ma “n’ihu” na-eme ka ọnọdụ nyocha ma ọ bụ ikpe doo anya. Mgbakwunye “ndị Juu” na-enyere onye Igbo nke oge a aka ịmata ụdị ụlọ nzukọ a na-ekwu maka ya.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: ndị ọchịchị na ndị nwere ikike
  rationale: Nhọrọ a na-ekewa ndị na-achị achị na ndị e nyere ikike iwu, ma na-ezere ịtụgharị okwu ndị a ka ha bụrụ ike ime mmụọ n’ebe a, ebe ọnọdụ ahụ bụ nke ọchịchị na ikpe.
- source_word: μὴ μεριμνήσητε
  choice: unu echegbula onwe unu
  rationale: Nke a na-egosipụta nchegbu na-akpaghasị uche, n’asụsụ Igbo dị ugbu a ma dị mfe nghọta.
- source_word: πῶς ἢ τί
  choice: banyere otú ma ọ bụ ihe
  rationale: E debere ma ajụjụ gbasara ụzọ e si aza ma nke gbasara ihe a ga-ekwu, dịka ederede Grik si kwuo.
- source_word: ἀπολογήσησθε
  choice: unu ga-ekwu iji gbachitere onwe unu
  rationale: N’ọnọdụ ikpe, ngwaa a pụtara ikwu okwu iji zara ebubo ma ọ bụ gbachitere onwe onye; ntụgharị a na-ada nke ọma n’Igbo ma na-echekwa echiche iwu ahụ.
- source_word: ἢ τί εἴπητε
  choice: ma ọ bụ ihe unu ga-ekwu
  rationale: E debere nkebi okwu a iche dịka ọ dị na Grik, n’agbanyeghị na ọ yiri nkebi bu ya ụzọ, ka a ghara ihichapụ nkwughachi nke isi mmalite.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ụlọ nzukọ ndị Juu” na-akọwa synagogue n’enweghị iji okwu mgbazinye na-adịghị aghọta ngwa ngwa. E chekwara nkwughachi na mgbagwoju anya dị n’etiti πῶς, τί, ἀπολογήσησθε, na τί εἴπητε kama ijikọta ha ka ha bụrụ naanị otu echiche.
