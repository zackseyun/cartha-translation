  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: ig
  text: 'Ma ana m agwa unu, ndị enyi m: unu atụla egwu ndị na-egbu ahụ́; mgbe nke ahụ gasịrị, ha enweghịkwa ihe ọzọ ha pụrụ ime.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: Ma ana m agwa
  rationale: δέ na-egosi ntakịrị ntụgharị n'okwu Jizọs; “Ma” na-egosipụta ya n'Igbo n'emeghị ka esemokwu ahụ sie ike karịa ka ọ dị.
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: unu, ndị enyi m
  rationale: Nkebi dative a kọwara ndị a na-agwa okwu dịka ndị enyi Jizọs; nsụgharị a debere ma “unu” ma aha ịhụnanya ahụ.
- source_word: μὴ φοβηθῆτε
  choice: unu atụla egwu
  rationale: Ụdị a bụ iwu mgbochi; “unu atụla egwu” bụ Igbo doro anya ma bụrụkwa nke a na-asụ ugbu a.
- source_word: ἀπὸ τῶν ἀποκτεινόντων
  choice: ndị na-egbu
  rationale: ἀπό so φοβέομαι na-akọwa ndị a na-atụ egwu; participle nke present na-ezo aka n'ozuzu nye ndị na-egbu mmadụ.
- source_word: τὸ σῶμα
  choice: ahụ́
  rationale: σῶμα ebe a bụ ahụ́ mmadụ nke anụ ahụ; akara ụda na-enyere aka ịmata ya nke ọma n'Igbo.
- source_word: καὶ μετὰ ταῦτα
  choice: mgbe nke ahụ gasịrị
  rationale: Nkebi a na-egosi oge na-esochi igbu ahụ́; okwu Igbo a bụ nke eke ma debe usoro ihe omume ahụ.
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: ndị na-enweghịkwa ihe ọzọ ha pụrụ ime
  rationale: Nkebi ahụ na-emesi ókè ike ndị na-egbu mmadụ nwere mgbe ọnwụ gasịrị; “ihe ọzọ ha pụrụ ime” na-edebe echiche nke περισσότερόν τι n'enweghị mgbakwụnye nkọwa.
theological_decisions:
- issue: Ókè ike mmadụ mgbe e gbuchara ahụ́
  choice: E kwuru naanị na ndị mmadụ pụrụ igbu ahụ́ ma ha enweghị ihe ọzọ ha pụrụ ime mgbe nke ahụ gasịrị.
  alternative: Ịgbakwunye na ha apụghị igbu mkpụrụ obi.
  rationale: Amaokwu a ekwughị mkpụrụ obi kpọmkwem. Ọ bụ ezie na amaokwu na-esote na-egosi ọdịiche dị n'etiti ókè ike mmadụ na ikike Chineke, nsụgharị a adịghị ebubata nkọwa ahụ n'amaokwu a.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ndị enyi m” debe okwu ịhụnanya Jizọs, ma zere okwu ụka pụrụ iche. Enweghị akara ntụaka ụkwụ n'ihi na ọdịiche Bekee e nyere adịghị eweta ọdịiche bara uru n'Igbo a.
