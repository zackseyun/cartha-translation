  to: 'Ma ana m agwa unu, ndị enyi m: unu atụla egwu ndị na-egbu ahụ́; mgbe nke ahụ gasịrị, ha enweghịkwa ihe ọzọ ha pụrụ ime.'
  rationale: The revision changes only clause structure for clarity and natural Standard Igbo. It preserves the mild connective “Ma,” the appositional “ndị enyi m,” the prohibition, and the source's deliberately unspecified statement that human killers can do nothing further after killing the body.
