review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' address to his friends, the prohibition against fearing bodily killers, and the limit that follows their act. The final relative clause, however, makes the temporal phrase somewhat awkwardly modify the killers' possible action; recasting it as a separate clause more transparently represents καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
  naturalness: The wording is generally clear Standard Igbo. A separate final clause is more fluent and immediately makes clear that the same people who kill the body have no further power afterward.
  terminology: “ndị enyi m,” “atụla egwu,” and “ahụ́” are appropriate, dignified, and theologically noninterpretive. No term for “soul” should be added, since it is absent from the Greek verse.
  issues:
  - severity: low
    issue: The final temporal and relative construction is syntactically heavy.
    rationale: In “ndị na-enweghịkwa ihe ọzọ ha pụrụ ime mgbe nke ahụ gasịrị,” “mgbe nke ahụ gasịrị” may be processed late and less directly as the temporal limit on the killers. A new clause retains the Greek sequence and makes the antecedent explicit through “ha.”
  revised_text: 'Ma ana m agwa unu, ndị enyi m: unu atụla egwu ndị na-egbu ahụ́; mgbe nke ahụ gasịrị, ha enweghịkwa ihe ọzọ ha pụrụ ime.'
