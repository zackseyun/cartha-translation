revisions:
- from: Unu onwe unu kwesịkwara ịdị njikere, n’ihi na Nwa nke Mmadụ ga-abịa n’oge awa unu na-atụghị anya ya.[a]
  to: Unu kwa, dịrịnụ njikere, n’ihi na Nwa nke Mmadụ ga-abịa n’awa unu na-atụghị anya ya.[a]
  rationale: The revision removes the redundant “n’oge awa,” uses a direct plural imperative for γίνεσθε ἕτοιμοι, retains the inclusive force of καὶ ὑμεῖς with “Unu kwa,” and preserves the future sense of ἔρχεται with “ga-abịa.” The footnote retains the lexical alternatives and cautiously expresses the likely Danielic echo without overstating it.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the command, its causal connection, the Son of Man title, and the future-oriented force of ἔρχεται. However, “n’oge awa” redundantly combines two temporal nouns and is not idiomatic Standard Igbo for ᾗ ὥρᾳ.
  naturalness: “Unu onwe unu kwesịkwara ịdị njikere” is understandable, but the imperative is more direct and natural as “Unu kwa, dịrịnụ njikere.” “N’awa unu na-atụghị anya ya” is the natural rendering of the unexpected-time phrase.
  terminology: “Nwa nke Mmadụ” appropriately preserves the established title and its literary resonance. “Daniẹl” is the standard Igbo form of the biblical name.
  issues:
  - severity: medium
    issue: 'Redundant temporal expression: “n’oge awa.”'
    rationale: The Greek has one temporal noun, ὥρᾳ (“at an hour”). Standard Igbo should use either “n’awa” or “n’oge,” not both together here.
  - severity: low
    issue: The command is rendered with “kwesịkwara ịdị,” rather than a direct imperative.
    rationale: Although understandable, “kwesịkwara” can sound like advisory ‘should.’ A plural imperative better represents γίνεσθε while retaining natural modern Igbo.
  - severity: low
    issue: Footnote repeats the non-idiomatic phrase “n’oge awa” and uses a less standard spelling for Daniel.
    rationale: The note should match the corrected wording and use “Daniẹl.”
  revised_text: Unu kwa, dịrịnụ njikere, n’ihi na Nwa nke Mmadụ ga-abịa n’awa unu na-atụghị anya ya.[a]
