source:
  edition: SBLGNT
  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: ig
  text: Unu kwa, dịrịnụ njikere, n’ihi na Nwa nke Mmadụ ga-abịa n’awa unu na-atụghị anya ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’awa unu na-echeghị,” ma ọ bụ, “mgbe unu na-atụghị anya ya.” Aha Grik ahụ bụ “Nwa nke Mmadụ,” aha Jizọs ji akpọ onwe ya, nke nwere ike ịdị na-ezo aka na Daniẹl 7:13–14.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: Unu onwe unu kwesịkwara
  rationale: 'Nke a na-egosi ma ntinye ma nkwusi ike: ndị na-ege ntị kwesịkwara ịdị njikere dịka ndị ohu e kwuru banyere ha n’ilu bu ụzọ.'
- source_word: γίνεσθε ἕτοιμοι
  choice: ịdị njikere
  rationale: N’usoro ya na ‘kwesịkwara,’ nke a na-enye iwu ka ha nọgide n’ọnọdụ njikere, n’Igbo doro anya ma dịkwa eke.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara iwu ahụ.
- source_word: ᾗ ὥρᾳ οὐ δοκεῖτε
  choice: n’oge awa unu na-atụghị anya ya
  rationale: Ọ na-egosipụta oge a na-amaghị nke ndị na-ege ntị na-adịghị atụ anya ya, kama ịkọwa otu awa a maara.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A hapụrụ ọdịdị aha ahụ ka ọ chekwaa njikọ ya na aha Jizọs ji akpọ onwe ya na ndabere ya dị ka nke Daniel 7:13–14.
- source_word: ἔρχεται
  choice: ga-abịa
  rationale: Ọ bụ ezie na Grik ji present, ebe a ọ nwere nghọta ọdịnihu. ‘Ga-abịa’ bụ ụzọ Igbo si ekwu nke a n'ụzọ eke ma na-echekwa ịdọ aka ná ntị ahụ.
theological_decisions:
- issue: Nsụgharị aha Kraịst ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: Nsụgharị nkịtị a na-echekwa aha ahụ, ụda Mesaịa na nke oge ikpeazụ ya, nakwa njikọ ya nwere ike inwe na Daniel 7:13–14, n’etinyeghị nkọwa ozizi ọzọ n’ime amaokwu ahụ.
- issue: Ike oge nke ἔρχεται n’okwu banyere ọbịbịa ga-eme n’ọdịnihu
  choice: ga-abịa
  alternative: na-abịa
  rationale: Present Grik nwere ike ịrụ ọrụ dị ka ọdịnihu. N’Igbo, ‘ga-abịa’ na-eme ka oge ahụ doo anya ma ghara ikpebi usoro ozizi ọ bụla banyere ihe ndị ga-eme n’oge ikpeazụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘unu onwe unu kwesịkwara’ chekwaa nkwusi ike nke καὶ ὑμεῖς, ebe ‘ịdị njikere’ na-egosi ọnọdụ njikere na-aga n’ihu.
