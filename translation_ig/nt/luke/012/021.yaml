  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: ig
  text: Otú a ka ọ dị onye na-akpakọba akụ maka onwe ya ma ọ bụghị ọgaranya n’ebe Chineke nọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-akpakọba akụ maka onwe ya ma ọ bụghị ọgaranya n’ihu Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Otú ahụ ka ọ dịrị
  rationale: Ọ na-ewepụta ihe mmụta sitere n’ilu gara aga, ma na-enye okwu ahụ ụda mkpebi dị nkenke.
- source_word: ὁ θησαυρίζων
  choice: nwoke ahụ na-akpakọba akụ
  rationale: Nkebi participle nwere article na-egosi onye e ji mee ihe atụ; ‘na-akpakọba akụ’ na-echekwa echiche nke ịchịkọta na ịkwakọba akụ.
- source_word: ἑαυτῷ
  choice: maka onwe ya
  rationale: Ọ na-egosi na ihe a na-akpakọba bụ maka uru nke onye ahụ n’onwe ya.
- source_word: καὶ μὴ
  choice: ma ọ bụghị
  rationale: ‘Ma’ na-eme ka ọdịiche dị n’etiti ịba ọgaranya nye onwe ya na enweghị ịba ọgaranya n’ebe Chineke nọ doo anya n’Igbo ekeghị ekegide.
- source_word: εἰς θεὸν
  choice: n’ebe Chineke nọ
  rationale: Ọ na-echekwa nghọta mmekọrịta na ntụziaka nke εἰς, na-enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: πλουτῶν
  choice: ọgaranya
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụ eke isi kwuo ọnọdụ nke ịba ọgaranya n’usoro ahịrịokwu a.
theological_decisions:
- issue: Nwoke otu onye e ji anọchi anya mmadụ n’okwu ịdọ aka ná ntị
  choice: nwoke ahụ na-akpakọba akụ
  alternative: onye ahụ na-akpakọba akụ
  rationale: Greek ji participle nwoke otu onye mee ihe atụ. Nsụgharị ahụ na-edebe ụdị onye e gosiri n’ilu ahụ, ma ihe mmụta ya ka bụ nke mmadụ niile.
- issue: Ihe ‘ịbụ ọgaranya n’ebe Chineke nọ’ pụtara
  choice: ọgaranya n’ebe Chineke nọ
  alternative: ọgaranya n’ihu Chineke
  rationale: A hapụrụ okwu ahụ n’ụdị mmekọrịta ya ma ghara ịgbakwunye nkọwa ozizi nke amaokwu ahụ n’onwe ya ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘akpakọba akụ’ iji debe njikọ okwu nke ịkwakọba treasure, ebe ‘n’ebe Chineke nọ’ na-echekwa mgbagwoju anya dị n’okwu Greek.
