id: LUK.12.30
reference: Luke 12:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: ig
  text: N’ihi na ihe ndị a niile ka mba nke ụwa[a] na-achọ, ma Nna unu maara na unu chọrọ ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị mba ọzọ nke ụwa.” Okwu Grik a nwere ike ịpụta “mba” ma ọ bụ “ndị mba ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ... πάντα
  choice: ihe ndị a niile
  rationale: Nke a na-ezo aka n’ihe ndị e kwuru banyere ha n’amaokwu ndị bu ụzọ—nri, ihe ọṅụṅụ, na uwe—ma na-edobe okwu ahụ n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: mba niile nke ụwa
  rationale: ἔθνη nwere ike ịpụta mba dị iche iche ma ọ bụ ndị mba ọzọ. Nhọrọ a na-edobe okwu sara mbara nke Grik, ebe nkọwa ala peeji na-egosi ihe ọzọ ọ pụrụ ịpụta.
- source_word: ἐπιζητοῦσιν
  choice: na-achọ
  rationale: Ngwaa a na-egosi ịchọ ihe ma ọ bụ ịgbaso ya. “Na-achọ” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a, n’etinyeghị nkọwa karịrị nke ederede.
- source_word: ὑμῶν ... ὁ πατήρ
  choice: Nna unu
  rationale: Nke a na-edobe kpọmkwem mmekọrịta nke ederede kwuru. Etinyeghị “nke eluigwe,” n’ihi na okwu ahụ adịghị n’amaokwu Grik a.
- source_word: οἶδεν
  choice: maara
  rationale: Ọ bụ ezie na ọdịdị okwu Grik a bụ nke perfect, ihe ọ pụtara ebe a bụ ịma ugbu a; “maara” bụ ntụgharị Igbo kwesịrị ekwesị.
- source_word: χρῄζετε τούτων
  choice: ihe ndị a dị unu mkpa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche Grik nke ịbụ ndị chọrọ ihe ndị ahụ; ikwughachi “ihe ndị a” na-edobekwa nkwusi okwu nke amaokwu ahụ.
theological_decisions:
- issue: Ọdịiche dị n’etiti ihe mba ụwa na-achọ na ntụkwasị obi ụmụ na-etinye na Nna ha
  choice: E debere “mba niile nke ụwa” na “Nna unu” n’enweghị mgbakwunye nkọwa.
  alternative: Ịsụgharị ἔθνη dịka “ndị mba ọzọ,” ma ọ bụ ịgbakwunye “nke eluigwe” n’aha Nna.
  rationale: Ederede ahụ na-egosi ọdịiche dị n’etiti nchụso nke ụwa na mmekọrịta ndị na-eso ụzọ nwere na Chineke dịka Nna ha. Nhọrọ a na-edobe ọdịiche ahụ n’enweghị ime ka ἔθνη dị warara ma ọ bụ ibubata okwu sitere n’amaokwu yiri ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta. Nhazi “ihe ndị a niile ka…” na-edobe nkwusi okwu dị na mmalite ahịrị Grik ahụ, ebe “Nna unu” na-anọgide n’enweghị mgbakwunye sitere n’amaokwu ọzọ.
