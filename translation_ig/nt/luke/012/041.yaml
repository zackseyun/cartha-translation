id: LUK.12.41
reference: Luke 12:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: ig
  text: Pita wee sị, “Onyenweanyị, ọ bụ anyị ka ị na-agwa ilu a, ka ị na-agwakwa mmadụ niile[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị niile.” Okwu Grik πάντας dị n’ụdị ọtụtụ nwoke, ma e ji ya mee ihe n’ozuzu ebe a maka ndị niile na-ege ntị, ọ bụghị naanị ụmụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: wee sị
  rationale: “Wee” na-egosi ọganihu n’akụkọ ahụ n’ụzọ Igbo si ada nke ọma, ebe “sị” na-edobe ngwaa λέγω dị ka ‘kwuo’ kama ịgbanwe ya ka ọ bụrụ ‘jụọ.’
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị nkwanye ùgwù akpọ Jizọs ‘Lord’; ọ na-edobekwa ohere ịdị arọ nke aha a n’ihe gbasara onye Kraịst bụ.
- source_word: πρὸς ἡμᾶς
  choice: anyị ka
  rationale: Usoro ‘ọ bụ anyị ka…’ na-egosi nke ọma na ajụjụ Pita gbasara ndị a na-agwa okwu ahụ, ma na-ada nke ọma n’Igbo.
- source_word: τὴν παραβολὴν ταύτην
  choice: ilu a
  rationale: “Ilu” bụ okwu Igbo dị mfe ma guzosie ike maka παραβολή, ya bụ akụkọ ntụnyere e ji akụzi ihe.
- source_word: λέγεις
  choice: ị na-agwa
  rationale: Ọdịdị na-aga n’ihu nke ngwaa Igbo a na-egosi okwu Jizọs na-ekwu n’oge ahụ ma dabara na present Greek.
- source_word: ἢ καὶ
  choice: ka ị na-agwakwa
  rationale: “Ka” na-egosi nhọrọ nke abụọ, ebe mgbakwunye “-kwa” na-edobe ike καί, ya bụ ‘ọzọkwa.’
- source_word: πρὸς πάντας
  choice: mmadụ niile
  rationale: πάντας na-ezo aka n’ìgwè ndị na-ege ntị n’ozuzu, ọ bụghị naanị ụmụ nwoke; “mmadụ niile” na-egosipụta nke ahụ n’Igbo doro anya.
theological_decisions:
- issue: Otú e si sụgharị κύριος mgbe Pita na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: “Onyenwe anyị” na-edobe ma nkwanye ùgwù Pita nyere Jizọs ma ohere ihe okwu κύριος pụtara n’ihe gbasara onye Jizọs bụ, n’etinyeghị nkọwa karịrị ihe amaokwu ahụ kwuru.
- issue: Ma πάντας ọ na-ezo aka naanị n’ụmụ nwoke
  choice: mmadụ niile
  alternative: ha niile
  rationale: Ọ bụ ezie na πάντας nwere ọdịdị oke nwoke n’asụsụ Grik, e ji ya mee ihe n’ozuzu ebe a iji gosi ndị niile na-ege ntị; ya mere, a gaghị egbochi ya ka ọ bụrụ naanị ụmụ nwoke.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta mee ihe. Usoro ajụjụ ‘ọ bụ… ka…?’ na nkwughachi ‘ị na-agwa/ị na-agwakwa’ na-eme ka ọdịiche dị n’etiti ‘anyị’ na ‘mmadụ niile’ doo anya ma bụrụkwa okwu Igbo sitere n’ọnụ mmadụ.
