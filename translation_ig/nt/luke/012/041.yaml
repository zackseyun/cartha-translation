  verdict: revise
  source_fidelity: The draft accurately preserves Peter as the speaker, his address to Jesus, the contrast between “us” and the wider audience, and the additive force of ἢ καί (“or also”). “Ilu a” is an appropriate established rendering of παραβολή.
  naturalness: The main sentence is natural Standard Igbo. A small adjustment to the conventional spelling of the divine/title form and a clearer footnote improve readability and consistency.
  terminology: Use the conventional Standard Igbo biblical form “Onyenweanyị” for Κύριε. The footnote’s alternative “ha niile” can be read as “all of them” rather than as the generic wider audience; “ndị niile” is clearer.
  issues:
