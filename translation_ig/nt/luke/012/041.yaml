    issue: Title spelling/register
    rationale: “Onyenweanyị” is the conventional fused biblical title for “Lord” in direct address and avoids the ordinary possessive reading that “Onyenwe anyị” may carry.
  - severity: low
    issue: Footnote alternative and explanation need clarification
    rationale: “Ha niile” may suggest a defined group (“all of them”), whereas πάντας here contrasts the disciples with all other hearers. The explanation should state the grammatical masculine-plural form and its generic contextual reference directly.
