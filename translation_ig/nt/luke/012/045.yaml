id: LUK.12.45
reference: Luke 12:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: ig
  text: Ma ọ bụrụ na ohu ahụ[a] asị n’obi ya[b], ‘Nna m ukwu na-egbu oge ịbịa,’ wee malite iti ndị ohu nwoke na ndị ohu nwaanyị ihe, iri nri na ịṅụ, na ịṅụbiga mmanya ókè,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “onye na-eje ozi.” Ma okwu Grik bụ́ δοῦλος na-egosi onye nọ n’ọnọdụ ohu n’okpuru nna ukwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “gwa onwe ya.” N’asụsụ Grik, ọ bụ “kwuo n’obi ya,” nke na-egosi echiche nzuzo dị n’ime ya.
    reason: idiom_clarification
lexical_decisions:
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” bụ okwu Igbo kacha nso nke na-egosi onye nọ n’okpuru ikike nna ukwu n’ezinụlọ; ọ dabara n’usoro ikike na ịza ajụjụ dị n’ilu a.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: n’obi ya
  rationale: Nke a na-edobe ihe atụ Grik ma na-egosi na ọ bụ echiche nzuzo dị n’ime ya, ọ bụghị ihe o kwuru n’ihu mmadụ.
- source_word: Χρονίζει
  choice: na-egbu oge
  rationale: Ọ na-egosi igbu oge na-aga n’ihu ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: κύριός μου
  choice: Nna m ukwu
  rationale: N’ime ilu a, okwu ahụ na-ezo aka n’onyeisi ezinụlọ nke ohu ahụ, ọ bụghị n’aha nsọ Chineke; “nna m ukwu” na-egosi mmekọrịta ikike ahụ.
- source_word: ἔρχεσθαι
  choice: ịbịa
  rationale: Infinitive a na-esochi “na-egbu oge” n’ụzọ dị mfe ma bụrụkwa Igbo eke.
- source_word: ἄρξηται
  choice: wee malite
  rationale: Ọ na-egosi mmalite omume ọjọọ ndị na-esochi ya.
- source_word: τύπτειν
  choice: iti … ihe
  rationale: Nke a na-egosi iti mmadụ n’ụzọ ike ma ọ bụ ugboro ugboro, dịka ọnọdụ ahụ chọrọ.
- source_word: τοὺς παῖδας
  choice: ndị ohu nwoke
  rationale: E tinyere “nwoke” iji chekwaa ọdịiche nwoke na nwaanyị nke dị n’ahịrịokwu Grik.
- source_word: τὰς παιδίσκας
  choice: ndị ohu nwaanyị
  rationale: Nke a bụ akụkụ nwaanyị kwekọrọ na “ndị ohu nwoke,” ma na-egosi ndị na-eje ozi n’ezinụlọ.
- source_word: ἐσθίειν τε καὶ πίνειν
  choice: na-eri ihe, na-aṅụkwa mmanya
  rationale: Nsụgharị a doro anya ma na-edobe usoro omume abụọ ahụ; ọnọdụ na okwu ikpeazụ mere ka “ịṅụ” pụta ìhè dịka ịṅụ mmanya.
- source_word: μεθύσκεσθαι
  choice: na-aṅụbigakwa mmanya ókè
  rationale: Nke a bụ ụzọ Igbo eke isi kwuo na mmadụ na-eru n’ịṅụbiga mmanya ókè ma ọ bụ na-egbu onwe ya mmanya.
theological_decisions:
- issue: Otu e si tụgharịa κύριος mgbe ọ na-ezo aka n’onyeisi mmadụ n’ime ilu
  choice: Nna m ukwu
  alternative: Onyenwe m
  rationale: “Nna m ukwu” na-eme ka o doo anya na onye a bụ onyeisi ohu ahụ n’ime akụkọ ahụ, n’enweghị ime ka okwu ahụ bụrụ aha nsọ nke Chineke ozugbo.
- issue: Otu e si tụgharịa δοῦλος n’ọnọdụ ezinụlọ a
  choice: ohu
  alternative: onye na-eje ozi
  rationale: N’ihi na ilu ahụ na-akọwa ikike siri ike, ịnọ n’okpuru nna ukwu, na ịza ajụjụ, “ohu” na-egosi ọnọdụ mmekọrịta ahụ nke ọma karịa okwu dị nro bụ́ “onye na-eje ozi.”
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara usoro ahịrịokwu ahụ dịka akụkụ nke okwu na-aga n’ihu ruo amaokwu na-esote, ya mere e ji rikoma mechie ya.
