revisions:
- from: Ma ọ bụrụ na ohu ahụ[a] asị n’obi ya[b], ‘Nna m ukwu na-egbu oge ịbịa,’ wee malite iti ndị ohu nwoke na ndị ohu nwaanyị ihe, na-eri ihe, na-aṅụkwa mmanya, na-aṅụbigakwa mmanya ókè,
  to: Ma ọ bụrụ na ohu ahụ[a] asị n’obi ya[b], ‘Nna m ukwu na-egbu oge ịbịa,’ wee malite iti ndị ohu nwoke na ndị ohu nwaanyị ihe, iri nri na ịṅụ, na ịṅụbiga mmanya ókè,
  rationale: The revision removes the premature specification ‘mmanya’ from the rendering of πίνειν, retaining it only where μεθύσκεσθαι requires the idea of excessive alcohol consumption. It also aligns the coordinated actions more transparently with the Greek infinitives, without changing the meaning or the verse’s intentionally continuing syntax.
