revisions:
- from: N’ihi ya, ihe niile unu kwuru n’ọchịchịrị ka a ga-anụ n’ìhè; ihe unu kwukwara na ntị n’ime ụlọ ime ka a ga-ekwusapụ n’elu ụlọ.[a]
  to: N’ihi ya, ihe niile unu kwuru n’ọchịchịrị ka a ga-anụ n’ìhè; ihe unu kwuru na ntị n’ime ụlọ ime ka a ga-ekwusapụ n’elu ụlọ.[a]
  rationale: The revision removes an unsupported additive nuance from the second verb while retaining the Greek’s deliberate parallelism and its ambiguity concerning the person whose ear is addressed. The footnote is retained and minimally clarified for idiomatic precision.
