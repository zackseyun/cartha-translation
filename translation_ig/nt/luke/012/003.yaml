id: LUK.12.3
reference: Luke 12:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: ig
  text: N’ihi ya, ihe niile unu kwuru n’ọchịchịrị ka a ga-anụ n’ìhè; ihe unu kwuru na ntị n’ime ụlọ ime ka a ga-ekwusapụ n’elu ụlọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’elu ụlọ.” Ihe oyiyi a bụ nke mmadụ na-eme ka ọha nụ ọkwa site n’elu ụlọ ndị dị larịị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: N’ihi ya
  rationale: Akpaalaokwu a na-egosi nkwubi okwu sitere n’ihe e kwuru n’amaokwu bu ụzọ. “N’ihi ya” na-egosipụta njikọ ahụ n’Igbo dị ugbu a.
- source_word: ὅσα
  choice: ihe niile
  rationale: 'Nke a na-egosipụta obosara nke okwu ahụ: ihe ọ bụla ha kwuru na nzuzo.'
- source_word: ἐν τῇ σκοτίᾳ
  choice: n’ọchịchịrị
  rationale: Ọ na-edobe oyiyi ọchịchịrị ma na-emegide ya na ìhè; o nwekwara ike ịpụta izochi ihe.
- source_word: εἴπατε
  choice: unu kwuru
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọ λέγω, ma ọ na-edobe onye nke abụọ ọtụtụ.
- source_word: ἐν τῷ φωτί
  choice: n’ìhè
  rationale: Ọ na-edobe ntụnyere doro anya dị n’etiti ọchịchịrị na ìhè, n’enweghị ịkọwa ya naanị dị ka ìhè ehihie ma ọ bụ ikpughe ihe.
- source_word: ἀκουσθήσεται
  choice: ka a ga-anụ
  rationale: Nke a na-edobe ọdịdị nnara-eme nke ngwaa ọdịnihu ahụ ma na-ada ka Igbo ebumpụta ụwa.
- source_word: ὃ πρὸς τὸ οὖς ἐλαλήσατε
  choice: ihe unu kwukwara na ntị
  rationale: Ọ na-edobe oyiyi nke ikwu okwu na ntị, ya bụ ikwu okwu na nzuzo, n’agbanyeghị na onye nwe ntị ahụ akọwaghị n’asụsụ Grik.
- source_word: ἐν τοῖς ταμείοις
  choice: n’ime ụlọ ime
  rationale: ταμεῖον nwere ike ịbụ ọnụ ụlọ ime, ụlọ nchekwa, ma ọ bụ ụlọ nzuzo. “Ụlọ ime” na-egosipụta ebe dị n’ime ụlọ n’ebughị ụzọ kpebie na ọ bụ naanị ụlọ nchekwa.
- source_word: κηρυχθήσεται
  choice: ka a ga-ekwusapụ
  rationale: “Kwụsapụ” na-egosi ikwusa ihe n’ihu ọha, ọ bụghị naanị ikwusa ozi ọma n’ụzọ okpukpe.
- source_word: ἐπὶ τῶν δωμάτων
  choice: n’elu ụlọ
  rationale: Nke a na-edobe ebe oyiyi ahụ kpọrọ aha—elu ụlọ ndị dị larịị ebe a pụrụ isi mee ka ọha nụ ọkwa.
theological_decisions:
- issue: Ụdị na oge a ga-ekpughe ihe zoro ezo
  choice: E dere ya dịka ịdọ aka ná ntị na ihe e kwuru na nzuzo ga-apụta ìhè n’ihu ọha, n’akọwaghị oge ma ọ bụ ụzọ nke a ga-esi mee.
  alternative: Ịkọwa ya kpọmkwem dịka mkpughe n’ụbọchị ikpeazụ, ma ọ bụ dịka ikpughe ihu abụọ n’akụkọ ihe mere eme ugbu a.
  rationale: Ọnọdụ okwu ahụ gbasara ikpughe ihe zoro ezo, ma amaokwu a ekwughị kpọmkwem ma ọ bụ ikpe Chineke n’ọdịnihu, ihe ga-eme n’oge a, ma ọ bụ ha abụọ. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere ntụnyere ọchịchịrị/ìhè na oyiyi elu ụlọ, ma zere okwu ụka pụrụ iche nke nwere ike ime ka κηρυχθήσεται pụta naanị dịka ikwusa ozi ọma.
