id: LUK.12.26
reference: Luke 12:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: ig
  text: Ya mere, ọ bụrụ na unu enweghị ike ime ọbụna ihe kasị nta, gịnị mere unu ji echegbu onwe unu banyere ihe ndị ọzọ[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị fọdụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ οὖν
  choice: Ya mere, ọ bụrụ na
  rationale: Nke a na-edobe ma ọnọdụ εἰ na njikọ nkwubi okwu οὖν na arụmụka dị n’amaokwu bu ụzọ, n’ụzọ Igbo dị mfe ma doo anya.
- source_word: οὐδὲ ἐλάχιστον
  choice: enweghị ike ime ọbụna ihe kasị nta
  rationale: ἐλάχιστον bụ okwu neuter e ji mee aha n’ebe a; ‘ihe kasị nta’ na-eme ka ihe ahịrịokwu ahụ pụtara doo anya n’Igbo, ebe ‘ọbụna’ na-edobe ike nke οὐδέ.
- source_word: δύνασθε
  choice: unu enweghị ike ime
  rationale: Nke a na-egosipụta enweghị ikike ma ọ bụ ike ime ihe, dịka δύναμαι si pụta, ma kwekọọ na onye nke abụọ n’ọnụọgụ ọtụtụ.
- source_word: τί
  choice: gịnị mere
  rationale: Ọ bụ ezie na τί pụtara ‘gịnị’ n’ụzọ nkịtị, n’ajụjụ a ọ na-achọ ihe kpatara omume ahụ; ‘gịnị mere’ bụ ụzọ Igbo ebumpụta ụwa si kwuo ya.
- source_word: περὶ τῶν λοιπῶν
  choice: banyere ihe ndị ọzọ
  rationale: Nke a na-ezo aka n’ihe ndị ọzọ niile karịrị ‘ihe kasị nta’; okwu a dị mfe ma na-edobe njikọ ntụnyere ahụ. ‘Ihe ndị fọdụrụ’ ka bụ ụzọ ọzọ kwe omume.
- source_word: μεριμνᾶτε
  choice: unu ji echegbu onwe unu
  rationale: Nke a na-egosipụta nchegbu na-aga n’ihu, ma dabara n’ozizi gbara amaokwu a gburugburu banyere ịtụkwasị Chineke obi.
theological_decisions:
- issue: Otú e si sụgharị μεριμνάω n’ozizi Jizọs banyere ịdabere na Chineke
  choice: echegbu onwe unu
  alternative: na-echegbu onwe unu / na-eche banyere
  rationale: ‘Echegbu onwe unu’ na-egosi nchegbu na-enye mmadụ nsogbu, kama ime ka amaokwu ahụ yie ka ọ na-amachibido ụdị nlekọta ma ọ bụ iche echiche kwesịrị ekwesị niile. Ọ naghịkwa ewebata nkọwa ụka pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Unu’ na-edobe onye nke abụọ n’ọnụọgụ ọtụtụ nke Grik. Nhazi ajụjụ ahụ na-edobe ike arụmụka na ajụjụ nkwupụta nke isi mmalite ahụ.
