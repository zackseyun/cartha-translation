id: LUK.12.46
reference: Luke 12:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: ig
  text: Onye nwe ohu ahụ ga-abịa n’ụbọchị ohu ahụ na-atụghị anya ya, nakwa n’awa ọ na-amaghị; ọ ga-egbutu ya ka ọ bụrụ iberibe abụọ[a], kenye ya òkè ya n’etiti ndị na-ekwesịghị ntụkwasị obi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ na-ewere okwu a dịka akpaalaokwu pụtara, “ga-ata ya ahụhụ nke ukwuu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-ekweghị ekwe.”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: onye nwe ohu ahụ
  rationale: N’ọnọdụ ilu a, okwu ahụ na-egosi onye nwe ohu, ọ bụghị aha nsọ “Onyenwe anyị.” Nhọrọ a na-eme ka mmekọrịta onye nwe na ohu pụta ìhè.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosipụta ọnọdụ onye nọ n’okpuru ikike onye nwe ya nke ọma karịa okwu dị nro dịka “onye na-eje ozi.”
- source_word: ἥξει
  choice: ga-abịa
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’ọdịnihu nke ngwaa Grik ahụ.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: n’ụbọchị ohu ahụ na-atụghị anya ọbịbịa ya
  rationale: E webatara “ọbịbịa ya” iji mee ka ihe a na-atụghị anya ya doo anya n’Igbo, n’enweghị ịgbanwe echiche nke isi mmalite.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: n’oge awa ọ na-amaghị
  rationale: A hapụrụ ọdịiche dị n’etiti ‘ịtụ anya’ na ‘ịma’ dịka ọ dị na Grik.
- source_word: διχοτομήσει
  choice: ga-egbutu ya ibé ibé
  rationale: Nhọrọ a na-echekwa ihe oyiyi ikpe siri ike dị na okwu Grik. Ihe ọ pụtara n’ụzọ nkịtị, ‘ịkpụ ya abụọ,’ na echiche na ọ pụrụ ịbụ akpaalaokwu maka ntaramahụhụ siri ike dị na nkọwa ala peeji.
- source_word: τὸ μέρος αὐτοῦ
  choice: ọnọdụ ya
  rationale: N’ebe a μέρος na-egosi ọnọdụ ma ọ bụ òkè e kenyere mmadụ. “Ọnọdụ ya” na-ada nke ọma n’Igbo n’okwu gbasara ebe e kenyere ya n’ikpe.
- source_word: ἀπίστων
  choice: ndị na-ekwesịghị ntụkwasị obi
  rationale: N’ime ilu gbasara ohu na-emeghị ihe e nyere ya, echiche nke ekwesịghị ntụkwasị obi dabara n’ọnọdụ ahụ; e debere ‘ndị na-ekweghị ekwe’ dịka ụzọ ọzọ n’ala peeji.
- source_word: θήσει
  choice: kenye
  rationale: “Kenye” na-egosi na onye nwe ya na-ekpebi ọnọdụ ma ọ bụ òkè ohu ahụ, kama nanị idowe ya n’otu ebe.
theological_decisions:
- issue: Ma a ga-edebe ihe oyiyi nke διχοτομήσει n’ụzọ doro anya, ka a kọwaa ya nanị dịka ntaramahụhụ siri ike
  choice: 'E debere ihe oyiyi ahụ n’isiokwu: “ga-egbutu ya ibé ibé.”'
  alternative: “ga-ata ya ahụhụ nke ukwuu”
  rationale: Isi okwu Grik nwere ihe oyiyi dị egwu nke ikpe. Ịgbanwe ya ozugbo ka ọ bụrụ naanị ntaramahụhụ siri ike ga-eme ka ike ịdọ aka ná ntị ya belata; ma ebe ụfọdụ na-ewere ya dịka akpaalaokwu, e gosiri nke ahụ n’ala peeji.
- issue: Ma ἀπίστων pụtara ndị na-ekwesịghị ntụkwasị obi ka ọ bụ ndị na-ekweghị ekwe
  choice: ndị na-ekwesịghị ntụkwasị obi
  alternative: ndị na-ekweghị ekwe
  rationale: Ọnọdụ ilu ahụ na-elekwasị anya n’ikwesị ntụkwasị obi nke ohu, ya mere isiokwu ji nhọrọ mbụ. Ma okwu Grik nwekwara ike ịpụta enweghị okwukwe, karịsịa n’okwu ikpe, ya mere e chekwara nhọrọ nke abụọ n’ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ohu” chekwaa mmekọrịta ikike dị n’ilu ahụ; e zere iji “Onyenwe anyị” n’ihi na κύριος ebe a bụ onye nwe ohu n’ime ilu. E tinyere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
