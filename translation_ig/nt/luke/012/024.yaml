  to: 'Tụleenụ ugoloọma[a]: ha anaghị akụ mkpụrụ, ha anaghịkwa ewe ihe ubi; ha enweghị ụlọ nkwakọba ihe ma ọ bụ ọba[b], ma Chineke na-enye ha nri. Lee ka unu si baa uru karịa nnụnụ![c]'
