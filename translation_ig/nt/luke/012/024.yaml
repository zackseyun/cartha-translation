review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the plural imperative, the specific ravens, the sow/reap pair, the two distinct storage locations, God's ongoing feeding of them, and the climactic comparison of human worth with birds. The generic present in the agricultural clause is better expressed with the Igbo habitual negative karịa the progressive-sounding form in the draft.
  naturalness: “Chebaranụ ugoloọma echiche” is not idiomatic Standard Igbo word order or collocation. “Tụleenụ ugoloọma” is concise, natural, and conveys attentive consideration. “Ha anaghị akụ mkpụrụ, ha anaghị ewe ihe ubi” naturally states their characteristic lack of farming activity.
  terminology: “Ugoloọma” appropriately preserves the concrete raven image. “Ụlọ nkwakọba ihe” and “ọba” preserve the source’s distinct storage terms. “Baa uru” is acceptable in the final comparison and avoids adding a doctrinal explanation.
  issues:
  - severity: medium
    issue: 'The opening imperative is awkward: “Chebaranụ ugoloọma echiche.”'
    rationale: Standard Igbo normally uses “Tụleenụ ugoloọma” for an imperative to consider/reflect on something, or “Cheenụ echiche banyere ugoloọma.” The present wording is an unnatural calque.
  - severity: low
    issue: “Ha adịghị agha mkpụrụ, ha adịghịkwa ewe ihe ubi” can sound progressive rather than characteristically habitual.
    rationale: The Greek present verbs describe what ravens do not do as a general characteristic. Igbo habitual “anaghị” expresses this more naturally and precisely.
