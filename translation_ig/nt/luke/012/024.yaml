language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: ig
  text: 'Tụleenụ ugoloọma[a]: ha anaghị akụ mkpụrụ, ha anaghịkwa ewe ihe ubi; ha enweghị ụlọ nkwakọba ihe ma ọ bụ ọba[b], ma Chineke na-enye ha nri. Lee ka unu si baa uru karịa nnụnụ![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Lerụnụ ugoloọma anya” ma ọ bụ “Cheenụ echiche nke ọma banyere ugoloọma.”
    reason: lexical_alternative
  - marker: b
    text: “Ụlọ nkwakọba ihe” sụgharịrị ταμεῖον; “ọba” sụgharịrị ἀποθήκη. Grik ji okwu abụọ dị iche maka ebe nchekwa.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, “Lee nnọọ ka unu si dị oké ọnụ ahịa karịa nnụnụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Chebaranụ … echiche
  rationale: Ọ bụ iwu ka ndị a na-agwa okwu jiri nlezianya tụlee ihe ha na-ahụ, ọ bụghị naanị ile ya anya ngwa ngwa. “Chebaranụ … echiche” bụ okwu Igbo doro anya nke na-egosi nlebara anya na ntụgharị uche.
- source_word: κόρακας
  choice: ugoloọma
  rationale: A họọrọ aha nnụnụ a kapịrị ọnụ kama iji naanị okwu sara mbara bụ́ “nnụnụ,” ka ihe atụ Jizọs nyere ghara ịla n’iyi.
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: ha adịghị agha mkpụrụ, ha adịghịkwa ewe ihe ubi
  rationale: Nke a na-edobe njikọ dị n’etiti ịgha mkpụrụ na iwe ihe ubi, ma bụrụkwa ụzọ ndị Igbo na-asụ ugbu a ga-esi kwuo ya n’ụzọ eke.
- source_word: ταμεῖον
  choice: ụlọ nkwakọba ihe
  rationale: Okwu a na-ezo aka n’ebe ma ọ bụ ọnụ ụlọ e ji echekwa ihe. Nsụgharị a na-eme ka ọ dị iche na ἀποθήκη.
- source_word: ἀποθήκη
  choice: ọba
  rationale: “Ọba” bụ ebe a na-edobe ihe ubi, ya mere ọ dabara n’ọnọdụ ọrụ ugbo a ma na-echekwa ọdịiche dị n’etiti okwu nchekwa abụọ nke Grik ji.
- source_word: τρέφει
  choice: na-enye ha nri
  rationale: Nke a bụ okwu Igbo dị mfe ma kwekọọ n’omume Chineke na-aga n’ihu nke inye nnụnụ nri.
- source_word: πόσῳ μᾶλλον
  choice: Lee ka … karịa
  rationale: Usoro a na-egosipụta ike nke ntụnyere sitere n’ihe nta gaa n’ihe ka ukwuu, ma na-ada nke ọma n’Igbo dị ugbu a.
- source_word: διαφέρετε
  choice: unu si baa uru
  rationale: N’ebe a, ngwaa ahụ pụtara ịkarị n’uru ma ọ bụ n’ịdị mkpa, ọ bụghị naanị ịdị iche. “Baa uru” na-egosipụta ntụnyere ahụ n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: τῶν πετεινῶν
  choice: karịa nnụnụ
  rationale: Okwu Grik a bụ aha sara mbara maka anụ ufe. Mgbe e kwuchara ugoloọma kpọmkwem, “nnụnụ” na-echekwa mgbasawanye nke ntụnyere ahụ.
theological_decisions:
- issue: Nlekọta Chineke n’ime ntụnyere ahụ
  choice: ma Chineke na-enye ha nri
  alternative: ma Chineke na-azụ ha
  rationale: Amaokwu ahụ kwuru kpọmkwem na Chineke na-enye ihe ndị o kere eke nri, nke bụ ntọala arụmụka Jizọs banyere uru mmadụ. A naghị agbasapụ okwu ahụ ka ọ bụrụ nkwupụta ozizi karịrị ihe amaokwu ahụ kwuru.
- issue: Ihe διαφέρετε pụtara n’ihe banyere mmadụ
  choice: unu si baa uru karịa nnụnụ
  alternative: unu si dị iche na nnụnụ
  rationale: N’usoro ntụnyere πόσῳ μᾶλλον, ihe a na-ekwu bụ ịdị elu n’uru ma ọ bụ n’ịdị mkpa, ọ bụghị naanị ọdịiche nkịtị. Nsụgharị ahụ na-echekwa ike ntụnyere ahụ n’enweghị ịkọwa ihe kpatara uru ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere iwu ahụ n’ụdị ọtụtụ mmadụ site na “-nụ,” e chekwara njikọ dị mkpirikpi nke ahịrịokwu ugbo abụọ ahụ, ma jiri akara mkpu gosi ike ajụjụ ntụnyere nke ngwụcha amaokwu ahụ.
