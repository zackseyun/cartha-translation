source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: ig
  text: À naghị ere ụmụ nnụnụ nza ise n’ego asarịa abụọ? Ma ọ dịghị otu n’ime ha e chefuru n’ihu Chineke.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ego mkpụrụ ego ọla kọpa abụọ.” Asarịa bụ obere mkpụrụ ego ọla kọpa ndị Rom.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, “ọ dịghị otu n’ime ha a na-eleghara anya n’ihu Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: ụmụ nnụnụ nza
  rationale: Okwu a na-ezo aka n’ụmụ nnụnụ nta, ma n’ebe a ‘ụmụ nnụnụ nza’ bụ ntụgharị doro anya ma bụrụ nke a na-aghọta ngwa ngwa.
- source_word: πωλοῦνται
  choice: a naghị ere
  rationale: Ajụjụ a tụrụ n’ụdị na-atụ anya azịza nkwenye; usoro a na-egosikwa olu nnara nke okwu Grik ahụ n’Igbo nkịtị.
- source_word: ἀσσαρίων δύο
  choice: n’ego asarịa abụọ
  rationale: E debere aha mkpụrụ ego oge ochie ahụ ka a ghara iji ego nke oge anyị dochie ya n’ụzọ na-ezighi ezi; nkọwa ala peeji na-akọwa ụdị ego ahụ.
- source_word: ἐπιλελησμένον
  choice: na-echefu
  rationale: Nke a na-edobe isi echiche nke ọnọdụ ịbụ onye e chefuru, n’asụsụ Igbo dị mfe ma dị ndụ.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: Chineke na-echefu
  rationale: 'Usoro Igbo a na-enye echiche ‘n’ihu Chineke’ n’ụzọ eke: ọ dịghị nke Chineke chefuru. Nkọwa ala peeji na-edobe ntụgharị dị nso n’usoro Grik.'
- source_word: οὐχὶ ... ;
  choice: À naghị ...?
  rationale: Ụdị ajụjụ a na-atụ anya azịza ‘ee,’ dịka οὐχί si arụ ọrụ n’ebe a.
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: Ma ọ dịghị otu n’ime ha
  rationale: ‘Ma’ na-egosipụta ọdịiche dị n’etiti ọnụ ahịa ha pere mpe na ncheta Chineke, ebe ‘otu n’ime ha’ na-edobe nkwusi okwu banyere ọbụna otu nnụnụ.
theological_decisions:
- issue: Asụsụ banyere ncheta na nlekọta Chineke
  choice: ọ dịghị otu n’ime ha Chineke na-echefu
  alternative: ọ dịghị otu n’ime ha a na-eleghara anya n’ihu Chineke
  rationale: ‘Na-echefu’ dị nso n’isi okwu Grik ma na-ekwupụta na Chineke maara ọbụna anụmanụ ndị dị obere, n’etinyeghị ozizi sara mbara karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E ji usoro ajụjụ ‘À naghị…?’ gosipụta ajụjụ na-atụ anya nkwenye; e debere aha ego oge ochie ma kọwaa ya n’ala peeji.
