source:
  edition: SBLGNT
  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: ig
  text: Ma enwere m baptizim m ga-anata[a][b], lee ka m si nọ n’oké nrụgide[c] ruo mgbe e mezuru ya!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “Enwere m baptizim a ga-eme m baptizim.” Okwu Grik na-eme ka ihe oyiyi baptizim pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, “baptizim” bụ ihe atụ nke nnukwu ahụhụ Jizọs na-achọ ịgabiga.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya, “lee ka e si kpagide m,” ma ọ bụ “lee ka ihe si na-akpagbu m,” ruo mgbe e mezuru ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: baptizim
  rationale: E debere okwu baptizim n’onwe ya ka ihe atụ nke imikpu ma ọ bụ ahụhụ na-ekpuchi mmadụ ghara ịla n’iyi; a kọwaghị ya ozugbo dị ka ‘ahụhụ’ ma ọ bụ ‘ọnwụ.’
- source_word: ἔχω βαπτισθῆναι
  choice: enwere baptizim a ga-eme m
  rationale: Nke a na-egosi ihe na-echere Jizọs nke ọ ga-agabiga, ma na-edobekwa ọnọdụ nnara dị n’okwu Grik βαπτισθῆναι n’ụzọ Igbo na-ada nke ọma.
- source_word: πῶς
  choice: lee ka
  rationale: ‘Lee ka’ na-eweta mkpu mmetụta siri ike nke πῶς n’Igbo dị ndụ ma kwanyere ugwu.
- source_word: συνέχομαι
  choice: obi si na-akpagbu m
  rationale: Nhọrọ a na-egosi nrụgide na nhụjuanya ime mmụọ, ma ọ naghị agọnahụ na okwu Grik nwekwara ike ịpụta ịbụ onye ihe jidere ma ọ bụ kpagidere.
- source_word: ἕως ὅτου
  choice: ruo mgbe
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji egosi njedebe oge.
- source_word: τελεσθῇ
  choice: e mezuru ya
  rationale: Ọ na-egosi na a ga-eweta ihe ahụ n’isi njedebe ya, na-enweghị ibubata kpọmkwem okwu Jọn 19:30.
theological_decisions:
- issue: Ihe ‘baptizim’ ji atụnyere
  choice: E debere baptizim dị ka ihe atụ Jizọs ji kwuo maka ahụhụ na ọnwụ na-abịakwute ya.
  alternative: Ịsụgharị ya naanị dị ka ahụhụ na ọnwụ, ma ọ bụ ịghọta ya naanị dị ka baptizim mmiri.
  rationale: Ọnọdụ okwu a na-arụtụ aka n’ahụhụ Jizọs na ọnwụ ya, ma ihe oyiyi baptizim n’onwe ya bụ akụkụ dị mkpa nke okwu ahụ; ya mere, nsụgharị ahụ ekwesịghị ikpochapụ esemokwu na ịdị omimi ya.
- issue: Uche συνέχομαι pụtara kpọmkwem
  choice: obi si na-akpagbu m
  alternative: ihe jidere m; anọ m ná nrụgide
  rationale: Okwu Grik nwere ike ịkọwa nhụjuanya ime obi ma ọ bụ ọnọdụ nke ihe jidere ma kpagide mmadụ. Isi okwu họọrọ nhụjuanya doro anya, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ‘baptizim’ dịka okwu Ndị Kraịst na-asụkarị, ma e zere ịkọwa ihe atụ ahụ n’isi amaokwu n’ụzọ ga-emechi nghọta ndị okwu Grik nwere ike ibu.
