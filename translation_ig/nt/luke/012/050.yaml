- from: Ma enwere baptizim a ga-eme m[a][b], lee ka obi si na-akpagbu m[c] ruo mgbe e mezuru ya!
  to: Ma enwere m baptizim m ga-anata[a][b], lee ka m si nọ n’oké nrụgide[c] ruo mgbe e mezuru ya!
  rationale: The revision retains the central baptism metaphor and the temporal completion clause, while replacing an added, potentially narrowing reference to “heart” with a direct Standard Igbo expression for the pressure or constraint conveyed by συνέχομαι. The notes are made more idiomatic and more restrained interpretively.
