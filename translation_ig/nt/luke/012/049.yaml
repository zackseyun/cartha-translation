revisions:
- from: “Abịara m ịtụnye ọkụ n’elu ụwa[a], lee ka m si chọọ ka a sị na ọ mụnyerela!”
  to: “Abịara m ịtụba ọkụ n’elu ụwa[a], ma lee ka m si achọ ka ọ gbanyeworị!”
  rationale: The revision strengthens the rendering of βαλεῖν from “put” to “cast/throw” (ịtụba), and replaces an awkward conditional wording with an idiomatic Igbo expression of intense desire that the fire already be kindled. The note continues to preserve the difficult, more literal alternative without resolving the metaphor’s meaning.
