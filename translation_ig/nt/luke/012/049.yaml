  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: ig
  text: “Abịara m ịtụba ọkụ n’elu ụwa[a], ma lee ka m si achọ ka ọ gbanyeworị!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ na-esochi mkpụrụokwu Grik anya karị: “Gịnịkwa ka m chọrọ ma ọ bụrụ na a mụnyelarị ya?” (ya bụ, ọkụ ahụ). Nkebiokwu Grik a siri ike; isi ederede na-egosi echiche akpaalaokwu o yikarịrị ka ọ bụ ya, bụ́ oke ọchịchọ.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: ọkụ
  rationale: A hapụrụ ihe atụ ahụ dịka ‘ọkụ’ n’akọwaghị ya dịka ikpe, nsacha, Mmụọ Nsọ, ma ọ bụ nkewa.
- source_word: ἦλθον
  choice: Abịara m
  rationale: Nke a na-egosi nzube ọbịbịa na ozi Jizọs, ma na-agbasokwa aorist Grik n'ụzọ Igbo dị mma.
- source_word: βαλεῖν
  choice: ịtụnye
  rationale: ‘Ịtụnye’ na-echekwa ike na ihe onyonyo nke βάλλω karịa okwu dị larịị dịka ‘iweta.’
- source_word: ἐπὶ τὴν γῆν
  choice: n’elu ụwa
  rationale: ‘Ụwa’ dabara n’ogo sara mbara nke okwu a; ‘ala’ nwere ike ime ka ọ dị ka ebe a kapịrị ọnụ.
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: lee ka m si chọọ ka a sị na ọ mụnyerela!
  rationale: Nkebiokwu Grik a siri ike. Nsụgharị a na-egosi oke agụụ dị n’ụdị mkpu, ma ihe odide ala peeji na-edebe ụzọ nsụgharị nke na-esochi mkpụrụokwu kpọmkwem.
- source_word: ἤδη
  choice: -larịị / mụnyerela
  rationale: Ngwụcha ‘-la’ na-egosi na ihe ahụ emeela tupu ugbu a, kwekọọ na ἤδη.
- source_word: ἀνήφθη
  choice: ọ mụnyerela
  rationale: Ụdị a na-edebe ihe oyiyi nke ịmụnye ọkụ; usoro ‘a sị na’ na-egosi ọchịchọ maka ihe a chọrọ ka o meworị.
theological_decisions:
- issue: Ihe ‘ọkụ’ pụtara n’okwu Jizọs
  choice: Idowe ya dịka ‘ọkụ’ n’enweghị nkọwa ọzọ
  alternative: ikpe, nsacha, Mmụọ Nsọ, ma ọ bụ nsogbu na nkewa ozi Jizọs na-eweta
  rationale: Amaokwu ahụ akọwaghị ihe atụ ahụ kpọmkwem, ya mere nsụgharị ekwesịghị idozi esemokwu nkà mmụta okpukpe nke isi mmalite hapụrụ ghe oghe.
- issue: Ike nke τί θέλω εἰ ἤδη ἀνήφθη
  choice: Igosipụta ya dịka mkpu nke oke ọchịchọ
  alternative: ‘Gịnị ka m chọrọ ma ọ bụrụ na a mụnyerela ya?’
  rationale: Usoro ajụjụ nke na-eso mkpụrụokwu kpọmkwem siri ike ma bụrụ ihe na-edochaghị anya n’Igbo. Isi ederede na-enye echiche akpaalaokwu a na-anabatakarị, ebe ihe odide ala peeji na-echekwa ihe ọzọ ga-ekwe omume.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ugwu, ma doo ndị nkịtị anya. E ji ‘ịtụnye ọkụ’ chekwaa ihe onyonyo siri ike nke isi mmalite, ebe ‘lee ka m si chọọ’ na-eme ka mkpu ọchịchọ ahụ bụrụ Igbo ebumpụta ụwa.
