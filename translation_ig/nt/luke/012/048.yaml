id: LUK.12.48
reference: Luke 12:48
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: ig
  text: Ma onye na-amaghị, ma mee ihe kwesịrị ka e tie ya ihe, a ga-eti ya ihe ole na ole. N’aka onye ọ bụla e nyere ọtụtụ ihe, a ga-achọ ọtụtụ ihe n’aka ya[a]; n’aka onye ha tụkwasịrị ọtụtụ ihe n’aka, ha ga-achọ n’aka ya ọbụna karịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-achọ ọtụtụ ihe site n’aka ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha ga-achọ ihe karịa n’aka ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: onye ahụ nke na-amaghị
  rationale: Nke a na-egosi onye na-enweghị ihe ọmụma ahụ, n’etinyeghị echiche ọzọ banyere ihe kpatara amaghị ya.
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: mee ihe kwesịrị ka e tie ya ihe
  rationale: Ọ na-edobe njikọ dị n’etiti ihe onye ahụ mere na ntaramahụhụ o kwesịrị, ma na-eji Igbo doro anya nke oge a.
- source_word: δαρήσεται ὀλίγας
  choice: a ga-eti ya ihe ole na ole
  rationale: Ngwaa Grik ahụ pụtara iti ihe; nsụgharị a na-edobe ihe atụ doro anya nke iti mmadụ ihe na ogo ntaramahụhụ ahụ.
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: N’aka onye ọ bụla e nyere ọtụtụ ihe
  rationale: ‘N’aka’ na-egosipụta na a ga-achọ ihe n’aka onye ahụ ma na-eme ka ụkpụrụ nke ibu ọrụ doo anya.
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: a ga-achọ ọtụtụ ihe
  rationale: ‘A ga-achọ’ nwere ike ịpụta ihe a chọrọ ma ọ bụ a na-atụ anya n’aka mmadụ, na-enweghị ịkọwapụta onye na-achọ ya ebe Grik na-ekwughị ya.
- source_word: παρέθεντο
  choice: ha tụkwasịrị ... n’aka ya
  rationale: Akpaalaokwu Igbo a na-egosi inyefe mmadụ ihe ka ọ lekọta ya ma ọ bụ buru ibu ọrụ ya.
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: ha ga-arịọ ya ihe karịrị nke ahụ
  rationale: Nke a na-edobe ngwaa dị iche na ζητηθήσεται ma na-egosi na ihe a ga-atụ anya ya ga-akarị.
theological_decisions:
- issue: Ụdị ihe atụ nke ntaramahụhụ
  choice: E debere okwu doro anya banyere iti mmadụ ihe, tinyere ‘ihe ole na ole.’
  alternative: Iji okwu sara mbara dịka ‘ntaramahụhụ,’ ma ọ bụ ịkọwa ya kpọmkwem dịka ịpịa ụtarị.
  rationale: Akụkụ a ji ihe atụ nke iti ihe kọwaa ntaramahụhụ dị n’ogo dị iche iche. Nsụgharị ahụ ekwesịghị ime ka ihe atụ ahụ dị nro ma ọ bụ tinye usoro ntaramahụhụ a na-akọwaghị.
- issue: Onye na-eme ihe na nkebi ikpeazụ
  choice: E debere ‘ha’ n’ebe Grik ji ngwaa mmadụ nke atọ n’ọnụọgụ ọtụtụ na-enweghị ịkpọ onye ahụ aha.
  alternative: Ịsị kpọmkwem na ọ bụ Chineke ma ọ bụ ụmụ mmadụ nyere ihe ahụ ma ga-achọkwa ya.
  rationale: Ịkpọ onye ahụ aha ga-ekpebi ihe ederede ahụ hapụrụ n’ụzọ sara mbara; ‘ha’ na-echekwa enweghị nkọwa ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘tụkwasịrị ... n’aka’ dịka akpaalaokwu nkịtị maka ihe e nyere mmadụ ka ọ lekọta, ma e debere ‘ha’ iji ghara ịkpọ onye Grik na-akpọghị aha.
