review_pass:
  verdict: revise
  source_fidelity: The draft retains the two coordinated exhortations and the concrete readiness imagery. However, the additive particle “-kwa” has no counterpart in the Greek, and “na-enwukwa ọkụ” is less precise for lamps that are burning. The opening is also clearer and more idiomatic when it explicitly directs the hearers to tie up their garments at their waists.
  naturalness: “Ka unu kee ákwà n’úkwù unu” is natural Standard Igbo for gathering and fastening one’s garment for readiness. “Ka oriọna unu na-ere ọkụ” naturally expresses lamps burning. The footnote’s proposed alternative has been made idiomatic, since garments themselves are not normally described as being ‘ready’ in Igbo.
  terminology: “Ákwà ... n’úkwù” appropriately preserves the garment-and-waist image without introducing archaic wording. “Oriọna” is accurate for λύχνοι, and “na-ere ọkụ” conveys the ongoing burning denoted by καιόμενοι.
  issues:
  - severity: medium
    issue: The particle “-kwa” in “na-enwukwa ọkụ” adds an emphatic/additive sense not present in the source.
    rationale: The Greek simply coordinates the lamps’ burning with the girded-garment image; it does not add ‘also’ or ‘indeed.’
  - severity: medium
    issue: “na-enwukwa ọkụ” is not the most direct rendering of lamps ‘burning.’
    rationale: “Na-enwu” primarily evokes giving light or shining, whereas “na-ere ọkụ” directly states that the lamps are burning and retains the participle’s ongoing sense.
  - severity: low
    issue: The footnote alternative says that the clothes are ready for action.
    rationale: In natural Igbo, readiness belongs more directly to the people than to their clothes; the cultural explanation can retain the garment image.
  revised_text: Ka unu kee ákwà n’úkwù unu, ka oriọna unu na-ere ọkụ.[a]
  revised_footnotes:
  - marker: a
    text: Ya bụ, “Dịọnụ njikere ime ihe.” Ihe oyiyi a na-ekwu maka mmadụ chịkọtara uwe ogologo ya ma kee ya n’úkwù, ka ọ dị njikere ime ihe.
    reason: cultural_note
  revision_rationale: The revision removes an unsupported additive nuance, uses the direct Igbo expression for burning lamps, and makes the garment-fastening command and explanatory footnote natural while preserving the source’s concrete readiness metaphor.
