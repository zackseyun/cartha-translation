  text: Ἔστωσαν ὑμῶν αἱ ὀσφύες περιεζωσμέναι καὶ οἱ λύχνοι καιόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/035.yaml
  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: ig
  text: Ka unu kee ákwà n’úkwù unu, ka oriọna unu na-ere ọkụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, “Dịọnụ njikere ime ihe.” Ihe oyiyi a na-ekwu maka mmadụ chịkọtara uwe ogologo ya ma kee ya n’úkwù, ka ọ dị njikere ime ihe.
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: Ka ...
  rationale: Ngwaa iwu nke onye nke atọ na-egosi agbamume; “Ka ...” bụ ụzọ Igbo si ekwu ya n'ụzọ dị mfe ma dị ùgwù.
- source_word: ὑμῶν
  choice: unu
  rationale: Ọ bụ nnọchiaha nwe nke metụtara ma úkwù ma oriọna; “unu” na-egosi na a na-agwa ọtụtụ mmadụ okwu.
- source_word: ὀσφύες
  choice: úkwù
  rationale: Ọ na-ezo aka n’akụkụ úkwù ebe a na-ekechi ákwà; okwu a na-edobe ihe atụ ahụ n’Igbo nke oge a.
- source_word: περιεζωσμέναι
  choice: a kee ákwà ... n’úkwù
  rationale: Perfect passive participle ahụ na-egosi ọnọdụ nke ákwà e kegerela n’úkwù. Nsụgharị a na-edobe ihe oyiyi nke ijikere kama ịtụgharị ya ozugbo ka ọ bụrụ naanị “dịrị njikere.”
- source_word: λύχνοι
  choice: oriọna
  rationale: Okwu Grik ahụ pụtara oriọna mmanụ, ọ bụghị ìhè n’ozuzu ya.
- source_word: καιόμενοι
  choice: na-enwukwa ọkụ
  rationale: Present participle ahụ na-egosi ọnọdụ na-aga n’ihu; okwu a na-egosi na oriọna ndị ahụ ka na-ere ọkụ.
theological_decisions:
- issue: Ihe atụ ọdịnala nke ịdị njikere
  choice: E debere ihe oyiyi doro anya nke ike ákwà n’úkwù n’ahịrị bụ isi.
  alternative: Dịnụ njikere ime ihe.
  rationale: Isi mmalite ahụ ji omume a na-ahụ anya gosipụta ịdị njikere. Idebe ihe atụ ahụ na-echekwa ike na ọdịdị okwu ahụ, ebe nkọwa ala peeji na-akọwa ihe ọ pụtara nye onye na-agụ akwụkwọ nke oge a.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe ma dị ùgwù. E jiri “ákwà” mee ka omume ike uwe n’úkwù doo anya, ebe e zere okwu ochie ma ọ bụ nkọwa ga-ewepụ ihe atụ dị n’isi mmalite.
