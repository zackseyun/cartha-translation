  text: ἡ ⸀γὰρ ψυχὴ πλεῖόν ἐστιν τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: ig
  text: N’ihi na ndụ[a] karịrị nri, ahụ karịrịkwa uwe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “mkpụrụ obi”: okwu Grik ψυχή nwere ike ịpụta “ndụ,” “onwe mmadụ,” ma ọ bụ “mkpụrụ obi”; n’ebe a, ihe gbara ya gburugburu na-akwado “ndụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na iwu bu ya ụzọ, na-egosi ihe mere mmadụ ekwesịghị ichegbu onwe ya.
- source_word: ψυχή
  choice: ndụ
  rationale: N’ebe a, okwu ahụ na-ezo aka ná ndụ mmadụ nke nri na-akwado; ọ bụghị kpọmkwem mkpụrụ obi dị iche n’ahụ.
- source_word: πλεῖόν
  choice: karịrị / dị mkpa karịa
  rationale: Ọ na-egosi na ndụ na ahụ bara uru karịa ihe ndị na-akwado ma ọ bụ na-ekpuchi ha; ntụgharị dị iche ntakịrị mere ka ahịrịokwu ahụ bụrụ Igbo nkịtị.
- source_word: τροφή
  choice: nri
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe maka ihe mmadụ na-eri.
- source_word: σῶμα
  choice: ahụ
  rationale: Ọ na-ezo aka n’ahụ mmadụ, nke e jikọtara ya na uwe.
- source_word: ἔνδυμα
  choice: uwe
  rationale: Ọ bụ okwu Igbo nkịtị maka ihe e ji ekpuchi ahụ.
theological_decisions:
- issue: Ihe ψυχή pụtara n’ozizi banyere nchegbu na mkpa ndụ
  choice: A sụgharịrị ya “ndụ.”
  alternative: mkpụrụ obi
  rationale: N’ihi na e ji ψυχή tụnyere nri, e jikwa ahụ tụnyere uwe, ihe a na-ekwu bụ ndụ mmadụ n’ụwa na mkpa anụ ahụ ya. Nke a anaghị agọnahụ na ψυχή nwere ike ịpụta “mkpụrụ obi” n’ebe ndị ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E ji “dị mkpa karịa” mee nkebi nke abụọ ka ntụnyere uru pụta nke ọma n’Igbo, ma e chekwaghị nkọwa okpukpe pụrụ iche.
