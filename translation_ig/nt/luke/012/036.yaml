  verdict: approve
  source_fidelity: The draft accurately conveys the comparison, the servants’ expectant waiting for their master, his return from the wedding feast, and their immediate opening upon his arrival and knock. “Onyenwe ha” appropriately renders κύριον ἑαυτῶν in this household-servant image without importing a divine title.
  naturalness: The Standard Igbo is clear, idiomatic, and suitably dignified. The sequence of waiting, return, knocking, and immediate opening reads naturally. “Unu onwe unu dịkwa” suitably retains the discourse emphasis of καὶ ὑμεῖς without overburdening the sentence.
  terminology: “Onyenwe ha,” “oriri agbamakwụkwọ,” “na-echere,” and “ozugbo” are appropriate and consistent choices. Supplying “n’ọnụ ụzọ” makes the idiomatic action of knocking explicit in Igbo and does not materially alter the sense.
