id: LUK.12.36
reference: Luke 12:36
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: ig
  text: Unu onwe unu dịkwa ka ndị mmadụ na-echere onyenwe ha mgbe ọ ga-esi n’oriri agbamakwụkwọ lọta, ka ha wee megheere ya ozugbo ọ bịara kụọ aka n’ọnụ ụzọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν κύριον ἑαυτῶν
  choice: onyenwe ha
  rationale: N’ọnọdụ a, κύριος pụtara onye nwe ndị ohu ma ọ bụ onye isi ụlọ; “onyenwe ha” na-egosipụta mmekọrịta ahụ n’Igbo n’enweghị itinye aha nsọ pụrụ iche.
- source_word: προσδεχομένοις
  choice: na-echere
  rationale: Na-egosi ichere onye a tụrụ anya ọbịbịa ya; okwu Igbo a doro anya ma bụrụ nke mmadụ niile na-aghọta.
- source_word: πότε ἀναλύσῃ ἐκ τῶν γάμων
  choice: mgbe ọ ga-esi n’oriri agbamakwụkwọ lọta
  rationale: ἀναλύω ebe a bụ ịlaghachi, ebe γάμοι n’ọnụọgụ ọtụtụ na-ezo aka n’emume ma ọ bụ oriri agbamakwụkwọ.
- source_word: κρούσαντος
  choice: kụọ aka n’ọnụ ụzọ
  rationale: Ọ bụ ezie na Grik kwuru naanị “kụọ aka,” itinye “n’ọnụ ụzọ” na-eme ka omume ahụ doo anya n’Igbo ma ọ naghị agbanwe ihe ọ pụtara.
- source_word: εὐθέως
  choice: ozugbo
  rationale: Na-echekwa echiche imeghe n’egbughị oge.
theological_decisions:
- issue: Ụzọ e si atụgharị κύριος
  choice: onyenwe ha
  alternative: nna ha ukwu
  rationale: “Onyenwe ha” na-echekwa ịdị arọ nke κύριος na mmekọrịta nke onye nwe ụlọ na ndị na-ejere ya ozi, ma ọ naghị ekpebi n’amaokwu a ma okwu ahụ bụ utu aha Chineke.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Unu onwe unu” chekwaa nkwusi ike dị na καὶ ὑμεῖς; a haziri ahịrịokwu ahụ n’usoro Igbo sitere n’okike.
