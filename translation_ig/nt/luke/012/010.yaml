id: LUK.12.10
reference: Luke 12:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: ig
  text: Onye ọ bụla nke kwuru okwu megide Nwa nke Mmadụ[a], a ga-agbaghara ya[b]; ma onye kwuluru okwu nkwulu megide Mmụọ Nsọ, a gaghị agbaghara ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ọ bụla nke kwuru otu okwu megide Nwa nke Mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ sịrị, “a ga-agbaghara ya”; ihe e mejọrọ bụ ihe a na-aghọta na a na-agbaghara.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: Onye ọ bụla nke
  rationale: Nke a na-egosi onye ọ bụla n’otu n’otu ma na-edobe oke okwu ahụ gbasara mmadụ niile.
- source_word: ἐρεῖ λόγον
  choice: kwuru okwu
  rationale: Ọ na-edobe λόγον (“okwu”) ma na-ada ka Igbo nkịtị na nke doro anya.
- source_word: εἰς
  choice: megide
  rationale: N’ọnọdụ okwu mmegide a, “megide” na-egosi iro ma ọ bụ mmegide, ọ bụghị naanị ntụziaka.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a bụ nsụgharị aha-utu ahụ nke na-edobe ọdịdị okwu Grik na ndabere Semitik ya.
- source_word: ἀφεθήσεται αὐτῷ
  choice: a ga-agbaghara ya
  rationale: Igbo na-ekwu nke a n'ụzọ eke dị ka ịgbaghara mmadụ; ihe e mejọrọ nke a na-agbaghara ka dị n'ime nghọta ahịrịokwu ahụ.
- source_word: τῷ ... βλασφημήσαντι
  choice: onye kwuluru
  rationale: “Kwuluru” na-egosi ikwu okwu nkwulu megide onye dị nsọ, ma ghara itinye nkọwa banyere ụdị mmehie ahụ karịa ihe Grik kwuru.
- source_word: τὸ ἅγιον πνεῦμα
  choice: Mmụọ Nsọ
  rationale: Nke a bụ okwu Igbo ọkọlọtọ, nke ugbu a, maka aha ahụ.
- source_word: οὐκ ἀφεθήσεται
  choice: agaghị enweta mgbaghara
  rationale: Nke a na-egosipụta ọdịnihu na nkwụsị siri ike nke Grik n’Igbo doro anya.
theological_decisions:
- issue: Ọdịiche dị n’etiti ikwu okwu megide Nwa nke Mmadụ na ikwulu Mmụọ Nsọ
  choice: E debere ọdịiche ahụ kpọmkwem n’enweghị ịkọwa ihe mere otu ji enweta mgbaghara ma nke ọzọ adịghị.
  alternative: Ịkọwa nke mbụ dị ka mmehie e mere n’amaghị ama, ma kọwaa nke abụọ dị ka enweghị nchegharị ruo ọgwụgwụ.
  rationale: Amaokwu a n’onwe ya ekwughị usoro ma ọ bụ ihe kpatara ọdịiche ahụ; nsụgharị ekwesịghị idozi esemokwu nkà mmụta okpukpe nke ederede hapụrụ ghe oghe.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. “Kwuluru” na-edobe ịdị arọ nke βλασφημέω, ebe usoro “agaghị enweta mgbaghara” na-ada nke ọma n’Igbo ugbu a.
