revisions:
- from: Onye ọ bụla nke kwuru okwu megide Nwa nke Mmadụ[a], a ga-agbaghara ya[b]; ma onye kwuluru Mmụọ Nsọ agaghị enweta mgbaghara.
  to: Onye ọ bụla nke kwuru okwu megide Nwa nke Mmadụ[a], a ga-agbaghara ya[b]; ma onye kwuluru okwu nkwulu megide Mmụọ Nsọ, a gaghị agbaghara ya.
  rationale: The revision corrects the rendering of βλασφημήσαντι εἰς τὸ ἅγιον πνεῦμα by explicitly stating blasphemous speech against the Holy Spirit. It also restores the source text’s parallel future-passive phrasing in the final clause. No theological explanation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:29Z'
review_pass:
  verdict: revise
  source_fidelity: The first clause accurately conveys the generic scope, hostile force of εἰς ('megide'), Son of Man title, and future passive forgiveness. In the second clause, however, the draft omits the explicit hostile relation ('against') and uses 'kwuluru Mmụọ Nsọ' in a syntactically incomplete/unclear way for βλασφημήσαντι εἰς τὸ ἅγιον πνεῦμα. Rendering the final passive in parallel with the first clause better reflects οὐκ ἀφεθήσεται.
  naturalness: The revised wording is standard, clear Igbo. 'kwuluru okwu nkwulu megide Mmụọ Nsọ' explicitly and naturally expresses blasphemous speech against the Holy Spirit. 'agaghị agbaghara ya' is more direct and maintains the deliberate Greek parallel with 'a ga-agbaghara ya.'
  terminology: ‘Nwa nke Mmadụ’ and ‘Mmụọ Nsọ’ are appropriate established Standard Igbo biblical terms. ‘Okwu nkwulu’ adequately expresses βλασφημία without supplying an interpretation of the offense.
  issues:
  - severity: medium
    issue: The second clause lacks an explicit equivalent of εἰς ('against') and ‘onye kwuluru Mmụọ Nsọ’ is unclear in construction.
    rationale: The Greek specifically identifies one who has blasphemed against the Holy Spirit. Adding ‘okwu nkwulu megide’ restores both the sense and a natural Igbo construction.
  - severity: low
    issue: ‘agaghị enweta mgbaghara’ does not retain the direct passive parallel of the Greek clauses.
    rationale: Though semantically acceptable, ‘agaghị agbaghara ya’ more closely mirrors οὐκ ἀφεθήσεται and the preceding ‘a ga-agbaghara ya.’
  revised_text: Onye ọ bụla nke kwuru okwu megide Nwa nke Mmadụ[a], a ga-agbaghara ya[b]; ma onye kwuluru okwu nkwulu megide Mmụọ Nsọ, a gaghị agbaghara ya.
  revised_footnotes:
