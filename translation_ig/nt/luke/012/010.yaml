    text: Ma ọ bụ, “onye ọ bụla nke kwuru otu okwu megide Nwa nke Mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ sịrị, “a ga-agbaghara ya”; ihe e mejọrọ bụ ihe a na-aghọta na a na-agbaghara.
    reason: lexical_alternative
  revision_rationale: The revision corrects the rendering of βλασφημήσαντι εἰς τὸ ἅγιον πνεῦμα by explicitly stating blasphemous speech against the Holy Spirit. It also restores the source text’s parallel future-passive phrasing in the final clause. No theological explanation has been added.
