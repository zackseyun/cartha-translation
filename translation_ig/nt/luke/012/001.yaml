id: LUK.12.1
reference: Luke 12:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: ig
  text: Ka ihe ndị a na-eme ugbu a[a], ọtụtụ puku mmadụ gbakọtara ọnụ, nke mere na ha na-azọ ibe ha. Ọ malitere ibu ụzọ gwa ndị na-eso ụzọ ya, sị, “Kpacharanụ anya maka ihe iko achịcha nke ndị Farisii[b], nke bụ ihu abụọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’oge ahụ” ma ọ bụ “Ka ọ dị ugbu a.” Okwu Grik a na-ejikọta ihe a na-eme ebe a na ihe ndị bu ya ụzọ.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ ọzọ: “Lezienụ onwe unu anya maka ihe iko achịcha nke ndị Farisii.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν οἷς
  choice: Ka ihe ndị a na-eme
  rationale: Na-egosi oge na ọnọdụ nke jikọtara ihe a na akụkọ bu ya ụzọ, n'Igbo dị mfe ma bụrụkwa nke eke.
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: ìgwè mmadụ dị ọtụtụ puku gbakọtara
  rationale: “Ọtụtụ puku” na-eburu echiche μυριάδες dị ka oke ìgwè mmadụ n'ebughị ụzọ kpebie na ọ bụ kpọmkwem iri puku kwuru iri puku.
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: nke na ha na-azọrịta ibe ha ụkwụ
  rationale: Na-egosi ihe si ná mgbakọta ahụ pụta nakwa omume ahụ na-aga n'ihu n'etiti mkpọtụ ìgwè mmadụ.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: malitere ibu ụzọ gwa ndị na-eso ụzọ ya
  rationale: Na-edobe πρῶτον dị ka ihe na-egosi na ndị na-eso ụzọ ya bụ ndị o buru ụzọ gwa okwu.
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: Lezienụ onwe unu anya ka ... ghara imetụta unu
  rationale: Nke a na-eburu ịdọ aka ná ntị na akụkụ ntụgharị uche ἑαυτοῖς n'okwu Igbo doro anya ma dị ndụ.
- source_word: ζύμη
  choice: ihe iko achịcha
  rationale: Na-edobe ihe atụ nke ihe na-eme ka ntụ ọka koo kama iji nkọwa dịka “ozizi” ma ọ bụ “mmetụta” dochie ya.
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: ihe ahụ bụ ihu abụọ
  rationale: Na-edobe nkọwa kpọmkwem nke Luk nyere banyere ihe atụ ahụ.
- source_word: τῶν Φαρισαίων
  choice: nke ndị Farisii
  rationale: Na-egosi ihe iko achịcha e ji mara ndị Farisii n'enweghị mgbakwunye nkọwa òtù okpukpe.
theological_decisions:
- issue: Ihe atụ ζύμη
  choice: E debere “ihe iko achịcha” dị ka ihe atụ, ma ederede n'onwe ya kọwara ya dị ka ihu abụọ.
  alternative: Ịsụgharị ya ozugbo dị ka “ozizi” ma ọ bụ “mmetụta ọjọọ.”
  rationale: Nkọwa dị n'amaokwu ahụ zuru ezu; dochie ihe atụ ahụ ga-eme ka ọdịdị okwu na njikọ Akwụkwọ Nsọ ya laa n'iyi.
- issue: Oke πρῶτον
  choice: A tụgharịrị ya dị ka ibu ụzọ gwa ndị na-eso ụzọ ya.
  alternative: Iwere ya dị ka “nke mbụ” na-amalite ndepụta okwu.
  rationale: Ọnọdụ okwu Grik na-akwado mkpa ndị a na-agwa okwu, ma ọ naghị ekwu hoo haa usoro okwu ndị ga-esochi.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “ihe iko achịcha” debe ihe atụ Akwụkwọ Nsọ, ma zere okwu siri ike ma ọ bụ nkọwa okpukpe agbakwunyere.
