revisions:
- from: Ka ihe ndị a na-eme[a], ìgwè mmadụ dị ọtụtụ puku gbakọtara, nke na ha na-azọrịta ibe ha ụkwụ. Jizọs malitere ibu ụzọ gwa ndị na-eso ụzọ ya, sị, “Lezienụ onwe unu anya ka ihe iko achịcha nke ndị Farisii[b] ghara imetụta unu; ihe ahụ bụ ihu abụọ.”
  to: Ka ihe ndị a na-eme ugbu a[a], ọtụtụ puku mmadụ gbakọtara ọnụ, nke mere na ha na-azọ ibe ha. Ọ malitere ibu ụzọ gwa ndị na-eso ụzọ ya, sị, “Kpacharanụ anya maka ihe iko achịcha nke ndị Farisii[b], nke bụ ihu abụọ.”
  rationale: E mere ka mmalite ahụ bụrụ Igbo eke ma debe ọrụ njikọ oge/ọnọdụ ya. E wepụrụ nkọwa ‘ghara imetụta unu’ ka ihe atụ «ihe iko achịcha» ghara ịghọ paraphrase; nkọwa Luk, «nke bụ ihu abụọ», ka na-esote ya. E mekwara ka nkọwa ìgwè mmadụ na ịzọ ibe ha bụrụ nke eke karịa n’Igbo.
