  source_fidelity: A chọrọ mmezi. «Ka ihe ndị a na-eme» anaghị egosipụta nke ọma njikọ ọnọdụ/oge nke Ἐν οἷς, ma «ka ihe iko achịcha ... ghara imetụta unu» na-atụgharị ihe atụ ζύμη ka ọ bụrụ ‘mmetụta’ ma tinye usoro nke na-adịghị n’ederede.
  naturalness: Ụfọdụ okwu dị mfe nghọta, ma «ìgwè mmadụ dị ọtụtụ puku» na «na-azọrịta ibe ha ụkwụ» adịghị eke nke ọma n’Igbo ọkọlọtọ n’ọnọdụ a. «Ọtụtụ puku mmadụ ... na-azọ ibe ha» dị mma karịa.
  terminology: «Ihe iko achịcha», «ndị Farisii», na «ihu abụọ» dabara adaba. E kwesịghị ịkọwa ihe iko achịcha dị ka mmetụta n’ahịrịokwu ahụ n’onwe ya, n’ihi na Luk kọwara ya kpọmkwem dịka ihu abụọ.
