id: LUK.12.27
reference: Luke 12:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: ig
  text: 'Tụleenụ okooko lili[a], otú ha si eto: ha adịghị adọgbu onwe ha n’ọrụ, ha adịghịkwa atụ ogho. Ma ana m agwa unu, ọbụna Solomọn, n’ebube ya niile[b], eyighị uwe dị ka otu n’ime ha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okooko ọhịa” ma ọ bụ “okooko osisi”; okwu Grik ahụ kwuru “lili” kpọmkwem.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ịma mma ya niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Tụleenụ
  rationale: Ọ bụ iwu ka ọtụtụ ndị jiri nlezianya leba anya ma chebara ihe echiche; “Tụleenụ” na-egosi ntụgharị uche, ọ bụghị naanị ịhụ anya.
- source_word: τὰ κρίνα
  choice: okooko lili
  rationale: κρίνα na-ezo kpọmkwem aka na lili; a hapụghị ya ka ọ bụrụ naanị “okooko osisi,” ma e nyere nkọwa ndị ọzọ n’ala peeji.
- source_word: πῶς αὐξάνει
  choice: hụ otú ha si eto
  rationale: Ọ bụ ezie na ngwaa Grik dị n’otu maka isiokwu na-anọpụ iche nke dị n’ọtụtụ, Igbo nkịtị na-eji “ha” eme ka ọnụọgụ okooko ndị ahụ doo anya.
- source_word: οὐ κοπιᾷ
  choice: ha adịghị adọgbu onwe ha n’ọrụ
  rationale: Nke a na-egosi ịrụ ọrụ siri ike ma ọ bụ ịdọgbu onwe mmadụ n’ọrụ, dịka κοπιάω si pụta.
- source_word: οὐδὲ νήθει
  choice: ha adịghịkwa atụ ogho
  rationale: νήθω bụ ịtụ eriri site n’ogho ma ọ bụ ihe yiri ya; “ịtụ ogho” na-echekwa ihe oyiyi nke ime ihe eji akwa uwe.
- source_word: λέγω δὲ ὑμῖν
  choice: Ma ana m agwa unu
  rationale: “Ma” na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche nke δέ, ebe ahịrịokwu ahụ ka bụ okwu dị mfe ma sie ike.
- source_word: οὐδὲ Σολομὼν
  choice: ọbụna Solomọn
  rationale: '“Ọbụna” na-ebute nkwusi ike nke οὐδέ: eze ahụ a ma ama n’ebube erughị otu n’ime okooko ndị ahụ.'
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: n’ebube ya niile
  rationale: “Ebube” na-echekwa nghọta nke δόξα dịka ịma mma na ịdị ukwuu nke eze, nakwa ụda okwu Akwụkwọ Nsọ.
- source_word: περιεβάλετο
  choice: eyighị uwe
  rationale: Ụdị ngwaa ahụ nwere ike ịdị ka middle ma ọ bụ passive; “eyighị uwe” bụ Igbo dị nkenke nke na-echekwa ihe oyiyi uwe n’akọwaghị onye yiwere ya uwe.
- source_word: ὡς ἓν τούτων
  choice: dị ka otu n’ime ha
  rationale: Ntụnyere a na-ezo n’ụzọ doro anya n’otu n’ime okooko lili ndị ahụ, n’enweghị ikwughachi aha ha.
theological_decisions:
- issue: Ihe ụdị okooko a na-ezo aka na ya
  choice: E ji “okooko lili” mee ihe kpọmkwem.
  alternative: “okooko ọhịa” ma ọ bụ “okooko osisi”
  rationale: Ihe odide Grik kpọrọ κρίνα aha kpọmkwem. Ọ bụ ezie na nkuzi ahụ gbasara nlekọta Chineke n’ihe o kere, ọ dịghị mkpa ịgbasa okwu ahụ karịa ihe isi mmalite kwuru.
- issue: Nghọta δόξα n’ihe gbasara Solomọn
  choice: E ji “ebube” mee ihe.
  alternative: “ịma mma”
  rationale: Ha abụọ ga-ekwe omume n’ebe a, ma “ebube” na-echekwa obosara okwu ahụ na ụda Akwụkwọ Nsọ, ebe nkọwa ala peeji na-egosi nhọrọ nke na-elekwasị anya n’ịma mma.
- issue: Ụdị olu nke περιεβάλετο
  choice: E dere ya “eyighị uwe,” n’akọwaghị onye mere ka o yi uwe.
  alternative: “e yighị ya uwe” ma ọ bụ “o yighị onwe ya uwe”
  rationale: Ụdị Grik ahụ nwere ike ibu nghọta middle/passive; nsụgharị a anaghị edozi onye mere ihe ahụ n’ụzọ isi mmalite na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Tụleenụ” na-agwa ọtụtụ ndị okwu dịka ụdị Grik si dị. A họọrọ “ịtụ ogho” karịa okwu nwere ike ịpụta ịkpa akwa, ka ọrụ ịtụ eriri nke νήθω pụta kpọmkwem. E tinyere akara ala peeji [b] n’akụkụ “ebube ya niile,” ebe nhọrọ okwu ahụ metụtara.
