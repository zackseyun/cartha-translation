    reason: cultural_note
  revision_rationale: The revision removes the source-inconsistent negation and expresses πόσῳ μᾶλλον as a positive Igbo comparative question. It retains the Greek temporal contrast, the oven imagery, and the mild but direct rebuke. Footnote a is made lexically closer to the broad sense of χόρτος without over-specifying crops or trees.
