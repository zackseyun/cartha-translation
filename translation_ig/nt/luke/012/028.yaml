id: LUK.12.28
reference: Luke 12:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: ig
  text: Ma ọ bụrụ na Chineke na-eyikwasị ahịhịa[a] dị n'ọhịa uwe otú a—ahịhịa nke dị taa, ma echi a tụba ya n’ekwú[b]—olee otú ọ ga-esi ka eyikwasị unu uwe karịa, unu ndị okwukwe nta!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ahịhịa ndụ” ma ọ bụ “ihe na-eto n’ọhịa.”
    reason: lexical_alternative
  - marker: b
    text: “Ekwú” a bụ nke e ji esi nri ma ọ bụ eme achịcha; a pụrụ iji ahịhịa ọhịa a kpọrọ nkụ mụnye ya ọkụ.
    reason: cultural_note
lexical_decisions:
- source_word: χόρτον
  choice: ahịhịa
  rationale: “Ahịhịa” bụ okwu Igbo nkịtị nke nwere ike ịpụta grass ma ọ bụ obere ihe ọkụkụ na-eto n'ọhịa; ọ dabara n'ihe a ga-akpọnwụ were mụnye ọkụ.
- source_word: ἐν ἀγρῷ
  choice: dị n'ọhịa
  rationale: Nke a na-egosi ebe ahịhịa ahụ na-eto n'ụzọ nkịtị, n'etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: nke dị taa, ma echi a tụba ya
  rationale: A gbasapụrụ usoro participle dị mkpirikpi na Grik ka ọ bụrụ Igbo doro anya, ma chekwaa ọdịiche dị n'etiti taa na echi na ịdị mkpụmkpụ nke ndụ ahịhịa.
- source_word: κλίβανον
  choice: ekwú
  rationale: “Ekwú” na-ezo aka n'ebe a na-etinye ọkụ maka isi ma ọ bụ ime achịcha, ọ bụghị nnukwu ebe ọkụ ụlọ ọrụ nke “furnace” nwere ike ịpụta.
- source_word: ἀμφιέζει
  choice: na-eyikwasị ... uwe
  rationale: Nke a na-echekwa ihe atụ nke iyi uwe ma na-ada ka Igbo eke; e jiri usoro a mee ihe banyere ahịhịa na mmadụ abụọ.
- source_word: πόσῳ μᾶλλον
  choice: ọ̀ bụ unu ka ọ na-agaghị eyikwasị uwe karịa
  rationale: Ajụjụ a na-egosipụta arụmụka site n'ihe nta ruo n'ihe ka ukwuu n'Igbo eke, na-enweghị ime ka nkwa ahụ sie ike karịa Grik.
- source_word: ὀλιγόπιστοι
  choice: unu ndị okwukwe nta
  rationale: Nke a bụ ịkpọ ndị na-eso ụzọ okwu ozugbo ma bụrụkwa mba dị nro banyere ntụkwasị obi ha na-adịghị ezu; ọ naghị akọwa ụdị nkwenkwe n'ụzọ ozizi.
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: “Ma” na-egosi ntakịrị ntụgharị ma na-aga n'ihu n'arụmụka nke amaokwu ndị gbara ya gburugburu.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: A sụgharịrị aha onye na-eme ihe ahụ ozugbo, n'etinyeghị nkọwa ọzọ.
- source_word: οὕτως
  choice: otú a
  rationale: Ọ na-akọwa otú Chineke si eyikwasị ahịhịa uwe, ma ọ bụ okwu Igbo dị nkenke na nke eke.
theological_decisions:
- issue: Ike na ụda nke ὀλιγόπιστοι mgbe Jizọs na-agwa ndị na-eso ụzọ okwu
  choice: “unu ndị okwukwe nta,” mba kpọmkwem ma dị nro
  alternative: Mba siri ike nke iwe, ma ọ bụ naanị nkọwa na ha nwere ntụkwasị obi na-adịghị ike
  rationale: Okwu ahụ na-akatọ ntụkwasị obi na-adịghị ezu, ma ọ naghị ekwu ozizi pụrụ iche banyere okwukwe nzọpụta ma ọ bụ ịdapụ n'okwukwe. Nsụgharị ahụ chekwara esemokwu na ụda nlekọta dị na Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ajụjụ “ọ̀ bụ unu ka ọ na-agaghị...” na-eme ka arụmụka site n'ihe nta ruo n'ihe ka ukwuu daa ka Igbo eke. Ihe nrịba ama ụkwụ [a] na [b] dị n'ederede isi.
