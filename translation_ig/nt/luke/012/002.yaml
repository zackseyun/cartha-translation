id: LUK.12.2
reference: Luke 12:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: ig
  text: Ma ọ dịghị ihe e kpuchiri[a] nke a na-agaghị ekpughe, ọ dịghịkwa ihe zoro ezo nke a na-agaghị amata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “e kpuchiri” dịka “e zoro.” Okwu Grik ahụ ji ihe atụ nke ihe e kpuchiri, nke a ga-emesịa kpughee.
    reason: lexical_alternative
  - marker: b
    text: Okwu a pụrụ izo aka n’ikpughe ihe n’oge a ma ọ bụ n’ikpe ikpe ikpeazụ; amaokwu ahụ ekwughị kpọmkwem mgbe ọ ga-eme.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ọ dịghị ihe
  rationale: Nke a bụ ụzọ Igbo si ekwu echiche nke ‘ọ dịghị otu ihe,’ ma na-edobe oke zuru ezu nke okwu Grik ahụ.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’ihe a na-ekwu, dịka δέ si arụ ọrụ n’ebe a.
- source_word: συγκεκαλυμμένον
  choice: e kpuchiri ekpuchi
  rationale: Okwu a na-edobe ihe atụ nke ihe e kpuchiri ma na-egosikwa na ihe ahụ ka nọ n’ọnọdụ nzuzo.
- source_word: ἀποκαλυφθήσεται
  choice: a na-agaghị ekpughe
  rationale: ‘Ikpughe’ na-enye ọdịiche doro anya megide ‘ikpuchi,’ ma na-edobe ọdịdị nnara nke ngwaa ọdịnihu ahụ.
- source_word: κρυπτὸν
  choice: ihe zoro ezo
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka ihe ezoro ma ọ bụ ihe dị na nzuzo.
- source_word: γνωσθήσεται
  choice: a na-agaghị amata
  rationale: Nke a na-edobe echiche nke ihe ahụ ịghọ ihe a maara, n’enweghị ịkọ onye ga-eme ka a mara ya.
- source_word: ὃ οὐκ / ὃ οὐ
  choice: nke a na-agaghị
  rationale: Usoro a na-edobe nkebi njikọ abụọ yiri ibe ha na nkwugide ọdịnihu ha.
theological_decisions:
- issue: Oke na ike okwu a
  choice: Okwu izugbe na ihe e zoro ugbu a ga-emecha pụta ìhè ma bụrụ ihe a maara.
  alternative: Ọ pụrụ izo aka kpọmkwem n’ikpughe ihe n’ikpe ikpe ikpeazụ, ma ọ bụ n’ime ka ihu abụọ pụta ìhè n’oge a.
  rationale: Ngwaa ọdịnihu ndị dị n’ụdị nnara na-egosi na a ga-emecha kpughee ma mata ihe ahụ, ma Grik ahụ ekwughị kpọmkwem mgbe nke a ga-eme. Ya mere, nsụgharị ahụ anaghị amachibido ya naanị n’oge ugbu a ma ọ bụ naanị n’ikpe ikpeazụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nhazi abụọ yiri ibe ha na ihe atụ ‘ikpuchi/ikpughe,’ ma zere ịkọwapụta oge ma ọ bụ ụdị ikpe nke amaokwu ahụ n’onwe ya na-ahapụghị doo anya.
