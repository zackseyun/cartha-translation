  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: ig
  text: M ga-asị mkpụrụ obi m[a], ‘Mkpụrụ obi, i nwere ọtụtụ ihe ọma e debeere ọtụtụ afọ. Zuru ike, rie, ṅụọ, nwee ọṅụ.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onwe m” ma ọ bụ “ndụ m.” Okwu Grik bụ ψυχή, nke ihe ọ pụtara na-adabere n'ọnọdụ okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: M ga-asị
  rationale: Ọ bụ ọdịnihu nke λέγω; ntụgharị a na-egosi okwu onye ahụ ga-agwa onwe ya n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ψυχῇ / Ψυχή
  choice: mkpụrụ obi m / Mkpụrụ obi
  rationale: N'ebe a, onye ahụ na-agwa ihe dị n'ime onwe ya okwu. “Mkpụrụ obi” na-edobe oyiyi na ike okwu Grik ahụ, ebe nkọwa ala peeji na-egosi na ọ pụkwara ịpụta onwe onye ma ọ bụ ndụ dịka ọnọdụ okwu siri dị.
- source_word: ἀγαθὰ
  choice: ihe ọma
  rationale: Okwu Grik a sara mbara. N'ọnọdụ akụkọ a, ọ na-ezo aka n'ihe onwunwe bara uru, ma “ihe ọma” anaghị eme ka ihe ọ pụtara dị warara karịa isi mmalite.
- source_word: κείμενα
  choice: e chekwara
  rationale: N'ọnọdụ a, participle a na-ekwu banyere ihe e debere n'ụlọ nkwakọba. “E chekwara” bụ Igbo dị mfe ma bụrụ nke eke maka ihe edobere maka ọdịnihu.
- source_word: εἰς ἔτη πολλά
  choice: maka ọtụtụ afọ
  rationale: Nke a na-egosi ogologo oge ihe ndị ahụ ga-ezuru ya; okwu Igbo a doro anya ma dị nso n'echiche Grik.
- source_word: ἀναπαύου
  choice: Zuru ike
  rationale: Iwu a na-akpọ onye ahụ ka o zuru ike ma hapụ nchegbu; ntụgharị a dị nkenke ma bụrụ nke oge a.
- source_word: φάγε
  choice: rie
  rationale: Ọ bụ iwu kpọmkwem nke pụtara iri nri.
- source_word: πίε
  choice: ṅụọ
  rationale: Ọ bụ iwu kpọmkwem nke pụtara ịṅụ ihe ọṅụṅụ.
- source_word: εὐφραίνου
  choice: nwee ọṅụ
  rationale: Okwu a pụtara inwe obi ụtọ ma ọ bụ ikpori ndụ. “Nwee ọṅụ” na-edobe obosara ya n'enweghị ịgbakwunye ikpe omume nke okwu Grik ekwughị kpọmkwem.
theological_decisions:
- issue: Otú e si tụgharị ψυχή mgbe onye ahụ na-agwa onwe ya okwu n'ilu ahụ
  choice: mkpụrụ obi
  alternative: onwe m; ndụ m
  rationale: Amaokwu a anaghị akọwa n'ụzọ teknụzụ ihe mmadụ mejupụtara; ọ na-egosi nwoke ahụ ka ọ na-agwa ihe dị n'ime onwe ya okwu. “Mkpụrụ obi” na-edobe ụda edemede na nghọta sara mbara nke ψυχή, ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ okwu ahụ pụrụ isi pụta.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro iwu ndị dị n''ikpeazụ dị nkenke dịka nke Grik: “Zuru ike, rie, ṅụọ, nwee ọṅụ.”'
