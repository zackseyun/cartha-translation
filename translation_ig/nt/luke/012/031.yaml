  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: ig
  text: Kama, chọọnụ alaeze ya[b][a], a ga-atụkwasịkwara unu ihe ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “alaeze Chineke”; ederede Grik kwuru “alaeze ya,” ebe ihe gbara ya gburugburu na-egosi onye “ya” na-ezo aka na ya.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ odide aka ochie kwuru “alaeze Chineke” kama “alaeze ya.”
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Kama
  rationale: Ọ na-egosi ọdịiche dị n’etiti ịchọ alaeze ahụ na nchegbu banyere mkpa anụ ahụ e kwuru okwu ya n’amaokwu ndị bu ụzọ.
- source_word: ζητεῖτε
  choice: na-achọnụ
  rationale: Ụdị iwu dị ugbu a na-egosi omume a ga-anọgide na-eme; “na-achọnụ” na-enye echiche ahụ n’Igbo dị mfe ma doo anya.
- source_word: βασιλείαν
  choice: alaeze
  rationale: “Alaeze” bụ okwu Igbo a maara nke ọma, ọ pụkwara ịgụnye ma ọchịchị eze ma ógbè ọ na-achị, dịka okwu Grik a si nwee obosara nghọta.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnochiaha ahụ na-ezo aka n’ebe Chineke nọ site n’ihe gbara amaokwu ahụ gburugburu. Ide “ya” na-echekwa ụdị okwu Grik kama ime ka aha onye a na-ekwu maka ya pụta ìhè n’ahịrị ahụ.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-ezo aka ná mkpa ndụ ndị a kpọrọ aha n’amaokwu ndị bu ụzọ. E tinyebeghị “niile” n’ihe odide Grik a, ya mere a naghị agbakwunye ya site n’amaokwu yiri nke a na Matiu.
- source_word: προστεθήσεται
  choice: a ga-atụkwasịkwara
  rationale: Nke a na-echekwa ọdịdị okwu Grik nke pụtara ịgbakwunye ihe, ma “-kwara” na-egosi na ihe ndị ahụ ga-abịakwa dịka mgbakwunye.
- source_word: ὑμῖν
  choice: unu
  rationale: “Unu” na-egosi nke ọma na okwu ahụ bụ maka ọtụtụ ndị a na-agwa okwu, ma dabara n’usoro ahịrịokwu Igbo a.
theological_decisions:
- issue: Onye αὐτοῦ (“ya”) na-ezo aka na ya
  choice: E debere nnochiaha ahụ dịka “alaeze ya,” ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Chineke ka ọ na-ezo aka na ya.
  alternative: A pụrụ ịsụ ya “alaeze Chineke” iji mee ka onye ọ na-ezo aka na ya pụta ìhè.
  rationale: N’amaokwu ndị gbara ya gburugburu, a na-ekwu maka Nna na nlekọta Chineke. Ide “ya” na-echekwa okwu dị n’ihe odide Grik ma ghara ime ka ihe o kwuru pụta ìhè karịa ka isi mmalite ahụ mere.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ụdị “na-achọnụ” na-eburu echiche nke iwu a ga-anọgide na-eme; e chekwara nnochiaha “ya” na okwu “ihe ndị a” iji zere ime ka ihe odide ahụ kwekọọ n’ụzọ na-enweghị isi na Matiu.
