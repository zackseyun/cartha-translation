  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: ig
  text: Mgbe ahụ, otu onye n’ime ìgwè mmadụ ahụ sịrị ya, “Onye Nkụzi, gwa nwanne m ka o kee ihe nketa ahụ n’etiti ya na m.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: Mgbe ahụ, ... sịrị
  rationale: δέ bụ njikọ dị nro; “Mgbe ahụ” na-egosi ọganihu akụkọ n’ụzọ ebumpụta ụwa n’etinyeghị echiche mmegide siri ike.
- source_word: τις
  choice: otu onye
  rationale: Ọ bụ nnọchiaha na-akọwa onye a na-akpọghị aha; “otu onye” bụ Igbo doro anya ma dịkwa mma n’akụkọ.
- source_word: ἐκ τοῦ ὄχλου
  choice: n’ime ìgwè mmadụ ahụ
  rationale: Ọ na-egosi na onye ahụ si n’etiti ndị gbakọtara; nke a bụ okwu Igbo ebumpụta ụwa.
- source_word: αὐτῷ
  choice: ya
  rationale: Ọ bụ onye nnata okwu ahụ, ya bụ Jizọs; a sụgharịrị ya ozugbo dịka “ya.”
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Aha a na-akpọ onye na-akụzi; “Onye Ozizi” na-edobe ihe okwu Grik pụtara n’enweghị ịgbakwụnye ikike ọzọ.
- source_word: εἰπὲ
  choice: gwa
  rationale: Imperativu nke λέγω n’ebe a bụ arịrịọ ka Jizọs gwa nwanne ahụ ihe ọ ga-eme; “gwa” bụ ntụgharị Igbo kacha adabara.
- source_word: τῷ ἀδελφῷ μου
  choice: nwanne m
  rationale: A na-edobe mmekọrịta ezinụlọ na nnọchiaha nke onye nwe ya kpọmkwem.
- source_word: μερίσασθαι
  choice: ka o kee
  rationale: Okwu a pụtara ikewa ma ọ bụ ikesa ihe n’òkè; “kee” dabara n’ihe gbasara ihe nketa.
- source_word: μετ’ ἐμοῦ
  choice: soro m
  rationale: μετά na genitivu na-egosi iso onye nwee òkè; “soro m” na-edobe ịdị mkpụmkpụ na nghọta nke okwu Grik.
- source_word: τὴν κληρονομίαν
  choice: ihe nketa ahụ
  rationale: Ọ na-ezo aka n’ihe onwunwe e ketara; “ihe nketa” bụ okwu sara mbara, ziri ezi, nke a na-aghọta nke ọma n’Igbo.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe arịrịọ onye ahụ n’ụzọ kpọmkwem ma ghara ịkọwa usoro iwu nketa karịa ihe Grik kwuru.
