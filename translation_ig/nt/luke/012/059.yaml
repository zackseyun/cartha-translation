  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: ig
  text: Ana m agwa gị, ị gaghị esi n’ebe ahụ pụta ma ọlị ruo mgbe ị kwụrụ ọbụna mkpụrụ ego lepton ikpeazụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ ego nta ikpeazụ.” Okwu Grik bụ λεπτόν, aha otu mkpụrụ ego dị nnọọ nta.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω σοι
  choice: Ana m agwa gị
  rationale: Ọ bụ ụzọ ebumpụta ụwa e si ekwu okwu ozugbo n’Igbo taa, ma ọ ka na-egosipụta ngwaa dị na present na nnọchiaha onye a na-agwa.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: ị gaghị esi ... pụta ma ọlị
  rationale: Njikọ ‘gaghị’ na ‘ma ọlị’ na-egosipụta nkwusiri ike dị n’οὐ μή banyere ihe agaghị eme n’ọdịnihu.
- source_word: ἐκεῖθεν
  choice: esi n’ebe ahụ
  rationale: Nke a na-egosipụta echiche isi n’otu ebe pụta n’ụzọ Igbo doro anya ma dị mma.
- source_word: ἕως
  choice: ruo mgbe
  rationale: Ọ na-egosi ókè oge ọnọdụ ahụ ga-adịgide.
- source_word: καὶ τὸ ἔσχατον
  choice: ọbụna ... ikpeazụ
  rationale: ‘Ọbụna’ na-egosipụta ike/additive nke καί, ebe ‘ikpeazụ’ na-asụgharị ἔσχατον.
- source_word: λεπτόν
  choice: mkpụrụ ego lepton
  rationale: ‘Lepton’ na-echekwa aha mkpụrụ ego ahụ n’akụkọ ihe mere eme, ebe ‘mkpụrụ ego’ na-eme ka onye na-agụ ya ghọta ozugbo ihe ọ bụ.
- source_word: ἀποδῷς
  choice: ị kwụchara
  rationale: N’ọnọdụ ụgwọ na ikpe, ‘kwụ ụgwọ’ bụ okwu Igbo kwesịrị ekwesị; ọdịdị mmecha ‘kwụchara’ na-egosi na a ga-akwụrịrị ya n’uju tupu ọ pụta.
theological_decisions:
- issue: Ihe onyinyo ụgwọ na ụlọ mkpọrọ pụtara
  choice: E debere ihe onyinyo nke ịnọ ebe ahụ ruo mgbe a kwụrụ ụgwọ ikpeazụ, n’akọwaghị kpọmkwem ihe ọ na-anọchi anya.
  alternative: Ịkọwa ya dị ka naanị ihe gbasara ikpe mmadụ n’ụwa, ikpe Chineke, ma ọ bụ ahụhụ purgatory.
  rationale: Amaokwu ahụ n’onwe ya akọwaghị ihe onyinyo ahụ kpọmkwem. Nsụgharị na-echekwa nghọtahie nwere ike ịdị na esemokwu nkà mmụta okpukpe kama itinye ozizi e mesịrị n’ime ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ma ọlị’ chekwaa nkwusiri ike nke Grik; a hapụrụ ‘lepton’ dịka aha mkpụrụ ego akụkọ ihe mere eme ma kọwaa ya n’okpuru peeji.
