  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: ig
  text: Ọ bụrụgodị na ọ bịa n’oge nche nke abụọ[a], ma ọ bụ ọbụna n’oge nche nke atọ, ma hụ ha ka ha dị otu ahụ, ngọzi na-adịrị ndị ohu ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ zuru ezu karị, “n’oge nche nke abụọ nke abalị, ma ọ bụ n’oge nche nke atọ nke abalị.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ okwu Grik si kwuo ya kpọmkwem, “ngọzi na-adịrị ndị ahụ.” Ndị a bụ ndị ohu e kwuru okwu ha n’amaokwu ndị gbara nke a gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: Ọ bụrụgodị na ... ma ọ bụ ọbụna
  rationale: Nke a na-egosipụta ọnọdụ nke nwere nkwenye mgbakwunye, ma na-echekwa nkwughachi na nkwusi ike dị n’okwu Grik.
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: n’oge nche nke abụọ ... n’oge nche nke atọ
  rationale: φυλακή n’ebe a bụ nkewa oge nche abalị, ọ bụghị ụlọ mkpọrọ ma ọ bụ ebe ndị nche nọ. Iji ‘oge nche’ mee ihe na-eme ka ihe ọ pụtara doo anya n’Igbo.
- source_word: ἔλθῃ
  choice: ọ bịa
  rationale: Ụdị a na-enye ọnọdụ ga-ekwe omume n’ọdịnihu n'ụzọ dị mfe ma bụrụkwa nke e ji asụ Igbo nke ọma.
- source_word: εὕρῃ οὕτως
  choice: hụkwa ha ka ha dị otu ahụ
  rationale: οὕτως na-ezo azụ n’ọnọdụ njikere nke ndị ohu ahụ; ‘ha’ bụ ihe e tinyere site n’ihe gbara amaokwu ahụ gburugburu iji mee ka Igbo bụrụ nke doro anya.
- source_word: μακάριοί
  choice: ngọzi na-adịrị
  rationale: Nhọrọ a na-echekwa echiche nke ịbụ ndị Chineke hụrụ n’ọnọdụ ọma, kama ime ka okwu ahụ bụrụ naanị inwe obi ụtọ ma ọ bụ inwe chi ọma.
- source_word: ἐκεῖνοι
  choice: ndị ohu ahụ
  rationale: N’agbanyeghị na okwu Grik pụtara kpọmkwem ‘ndị ahụ,’ ihe gbara ya gburugburu na-egosi na ọ na-ezo aka n’ebe ndị ohu nna ukwu ahụ nọ. A kọwara onye a na-ekwu maka ya n’ederede, ma tinye nkọwa ala peeji.
theological_decisions:
- issue: Ikwupụta onye ἐκεῖνοι na-ezo aka na ya
  choice: ndị ohu ahụ
  alternative: ndị ahụ
  rationale: Okwu Grik bụ nnọchiaha ngosipụta, ma ihe gbara amaokwu a gburugburu na-eme ka o doo anya na ọ bụ ndị ohu e kwuru okwu ha n’amaokwu ndị bu ya ụzọ. Ịkpọ ha ‘ndị ohu ahụ’ na-eme ka Igbo doo anya n’etinyeghị ozizi ọhụrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Oge nche’ na-akọwa nkewa oge nche abalị n’enweghị mkpa ibubata usoro oge ndị Rom ma ọ bụ ndị Juu nke ederede ahụ ekwughị kpọmkwem.
