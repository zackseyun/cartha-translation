review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the concessive alternatives (κἂν ... κἂν), the second and third night watches, and the contextual reference of οὕτως to the servants’ readiness. “Ndị ohu ahụ” is a legitimate contextual clarification of ἐκεῖνοι, and the footnote appropriately notes the Greek’s more general “ndị ahụ.”
  naturalness: 'The wording is generally clear Standard Igbo. However, “hụkwa ha” is less precise here: -kwa normally adds an ‘also’ nuance, whereas καί simply coordinates the coming and finding. “ma hụ ha” is the natural sequential coordination and makes the shared subject clear.'
  terminology: “Oge nche” suitably renders φυλακή as a watch of the night, without importing a specific historical time system. “Ngọzi na-adịrị” is an appropriate elevated biblical rendering of μακάριοι. “Ndị ohu” preserves the established contextual designation without forcing a lexical claim for this verse alone.
  issues:
  - severity: low
    issue: The verb “hụkwa” adds an unnecessary additive nuance.
    rationale: The Greek καί joins ἔλθῃ and εὕρῃ (‘comes and finds’); it does not require the emphatic/additive sense commonly carried by -kwa in Igbo. Replacing it with “ma hụ” is both more idiomatic and closer to the source relation.
  revised_text: Ọ bụrụgodị na ọ bịa n’oge nche nke abụọ[a], ma ọ bụ ọbụna n’oge nche nke atọ, ma hụ ha ka ha dị otu ahụ, ngọzi na-adịrị ndị ohu ahụ.[b]
