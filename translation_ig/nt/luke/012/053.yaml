id: LUK.12.53
reference: Luke 12:53
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: ig
  text: 'A ga-ekewa ha[a]: nna ga-emegide nwa ya nwoke, nwa nwoke ga-emegidekwa nna ya; nne ga-emegide nwa ya nwanyị, nwa nwanyị ga-emegidekwa nne ya; nne di ga-emegide nwunye nwa ya[b], nwunye nwa ga-emegidekwa nne di ya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “A ga-ekewapụ ha iche.” Ngwaa Grik ahụ na-emesi nkewa dị n’etiti otu ìgwè ma ọ bụ ezinụlọ ike.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a sụgharịrị “nwunye nwa” nwekwara ike ịpụta “nwaanyị a na-alụ ọhụrụ” n’ebe ndị ọzọ; ma ebe e jikọtara ya na “nne di” n’ebe a, ọ pụtara nwunye nwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: A ga-ekewa ha
  rationale: Nke a na-edobe ọdịdị nnara nke ngwaa Grik ahụ ma na-egosi nkewa ga-adị n’etiti ndị otu ezinụlọ, n’enweghị ịkọwapụta onye kpatara ya.
- source_word: ἐπὶ
  choice: ga-emegide
  rationale: N’usoro mmekọrịta ndị a, ἐπί na-egosi iguzogide mmadụ; ‘ga-emegide’ bụ Igbo doro anya ma dịkwa mma n’ọnọdụ a.
- source_word: πατήρ / υἱός
  choice: nna / nwa ya nwoke
  rationale: Okwu ndị a na-edobe mmekọrịta nna na nwa nwoke nke Grik kwuru kpọmkwem.
- source_word: μήτηρ / θυγάτηρ
  choice: nne / nwa ya nwanyị
  rationale: Okwu ndị a na-edobe mmekọrịta nne na nwa nwanyị, tinyere ọdịiche nwoke na nwanyị dị n’ihe odide Grik.
- source_word: πενθερά
  choice: nne di
  rationale: N’usoro e jikọtara ya na νύμφη, nke a bụ okwu Igbo a na-eji maka nne di nke nwaanyị lụrụ di.
- source_word: νύμφη
  choice: nwunye nwa
  rationale: Ọ bụ ezie na νύμφη nwere ike ịpụta nwaanyị a na-alụ ọhụrụ, njikọ ya na πενθερά n’ebe a na-egosi nwunye nwa, ya bụ, daughter-in-law.
- source_word: αὐτῆς
  choice: ya
  rationale: E debere nnọchiaha nke na-egosi na ọ bụ nwunye nwa nke nne di ahụ.
theological_decisions:
- issue: Ụdị nkewa a na-ekwu maka ya
  choice: A sụgharịrị ya dị ka esemokwu na nkewa n’etiti ndị ezinụlọ ga-esi n’ozi Jizọs pụta.
  alternative: Iwere ya naanị dị ka ilu nkịtị banyere nsogbu ezinụlọ, ma ọ bụ dị ka iwu na-akwado iro n’ezinụlọ.
  rationale: Ọnọdụ amaokwu ndị gbara ya gburugburu na-egosi ihe ozi Jizọs ga-ebute. Nsụgharị ahụ na-edobe okwu siri ike banyere mmegide, ma ọ naghị etinye echiche na Jizọs na-akwado iro n’ezinụlọ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E tinyere ‘ga-’ n’ahịrị nke ọ bụla iji mee ka usoro aha ndị dị na Grik bụrụ ahịrịokwu zuru oke ma doo anya n’Igbo; ‘-kwa’ na-egosi mmegide na-alaghachi azụ n’etiti mmadụ abụọ ahụ.
