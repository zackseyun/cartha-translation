  source_fidelity: 'Nsụgharị ahụ na-anọchi anya Grik ahụ nke ọma: ọdịnihu nnara nke διαμερισθήσονται dị na “A ga-ekewa ha,” ebe ἐπί n’usoro ndị a ka e ji “ga-emegide” kọwaa n’ụzọ ziri ezi. Usoro mmegide nna/nwa nwoke, nne/nwa nwanyị, na nne di/nwunye nwa dịgidekwara. “Ya” ndị agbakwunyere n’akụkụ mmekọrịta ezinụlọ na-eme ka Igbo doo anya, n’enweghị mgbanwe n’ihe amaokwu ahụ pụtara.'
