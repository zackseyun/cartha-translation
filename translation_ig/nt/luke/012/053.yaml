  terminology: A họpụtara “nwa ya nwoke” na “nwa ya nwanyị” n’ụzọ na-echekwa ọdịiche nwoke na nwanyị dị na υἱός na θυγάτηρ. “Nne di” na “nwunye nwa” na-akọwa πενθερά na νύμφη nke ọma n’ọnọdụ mmekọrịta ha. Ihe odide ala peeji b na-akọwa ihe νύμφη pụrụ ịpụta n’ọnọdụ ọzọ n’enweghị imebi ihe amaokwu a pụtara.
