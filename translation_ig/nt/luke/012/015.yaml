- from: Mgbe ahụ, ọ sịrị ha, “Lezienụ anya, chebekwanụ onwe unu pụọ n’ụdị anyaukwu niile,[a] n’ihi na ndụ mmadụ adịghị n’ọba ụba nke ihe o nwere.”
  to: Mgbe ahụ, ọ sịrị ha, “Lezienụ anya, chebekwanụ onwe unu megide anyaukwu ọ bụla,[a] n’ihi na ndụ mmadụ adabereghị n’ịba ụba nke ihe o nwere.”
  rationale: The revision replaces an unnatural avoidance construction with a natural reflexive warning, and clarifies that the saying concerns the basis or grounding of life rather than the mere existence of life amid material abundance. It retains the generic “mmadụ,” the broad scope of πάσης, and the lexical footnote’s alternatives.
