review_pass:
  verdict: revise
  source_fidelity: The paired imperatives and the broad warning against πλεονεξία are substantially represented. However, “chebekwanụ onwe unu pụọ n’ụdị anyaukwu niile” is not idiomatic Standard Igbo for guarding oneself against something, and “ndụ mmadụ adịghị n’ọba ụba” can sound as though life is absent where abundance exists rather than that life is not grounded in abundant possessions.
  naturalness: A modest recasting makes the warning natural while retaining its two imperatives. “Adabereghị n’ịba ụba nke ihe o nwere” clearly conveys the force of οὐκ ἐν ... ἐστιν without over-specifying the nature of life.
  terminology: “Anyaukwu” is an appropriate contemporary rendering of πλεονεξία. The footnote appropriately retains the related sense of covetousness/acquisitiveness.
  issues:
  - severity: medium
    issue: The phrase “chebekwanụ onwe unu pụọ n’ụdị anyaukwu niile” is awkward and its construction is not a natural way to express φυλάσσεσθε ἀπό in Standard Igbo.
    rationale: Using “chebekwanụ onwe unu megide anyaukwu ọ bụla” preserves the reflexive protective force and clearly identifies greed as the danger to be guarded against.
  - severity: medium
    issue: “Ndụ mmadụ adịghị n’ọba ụba nke ihe o nwere” inadequately expresses the predicative sense of οὐκ ἐν τῷ περισσεύειν ... ἡ ζωὴ ... ἐστιν.
    rationale: “Ndụ mmadụ adabereghị n’ịba ụba nke ihe o nwere” naturally states that life is not grounded in the abundance of possessions, without suggesting that a wealthy person lacks life.
  revised_text: Mgbe ahụ, ọ sịrị ha, “Lezienụ anya, chebekwanụ onwe unu megide anyaukwu ọ bụla,[a] n’ihi na ndụ mmadụ adabereghị n’ịba ụba nke ihe o nwere.”
