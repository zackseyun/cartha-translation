source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị ha, “Lezienụ anya, chebekwanụ onwe unu megide anyaukwu ọ bụla,[a] n’ihi na ndụ mmadụ adabereghị n’ịba ụba nke ihe o nwere.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “oke ọchịchọ inweta ihe n’ụdị ya niile.” Okwu Grik πλεονεξία nwere ike ịpụta anyaukwu, ọchịchọ ihe onye ọzọ nwere, ma ọ bụ ọchịchọ ịnọgide na-enwetakwu ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Lezienụ anya
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke na-adọ ha aka ná ntị; okwu a bụ ụzọ Igbo dị ugbu a si egosipụta ịmụrụ anya.
- source_word: φυλάσσεσθε
  choice: chebekwanụ onwe unu
  rationale: Ọ na-echekwa echiche reflexive dị na okwu Grik ahụ, ya bụ, ka ndị na-ege ntị jiri nlezianya chebe onwe ha.
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: pụọ n’ụdị anyaukwu niile
  rationale: πλεονεξία gụnyere ọchịchọ ịchọkwu ihe n’ụzọ gabigara ókè; πάσης na-eme ka ịdọ aka ná ntị ahụ metụta ụdị ya niile.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara ịdọ aka ná ntị ahụ.
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: ndụ mmadụ adịghị n’ọba ụba
  rationale: Nke a na-egosi na ihe na-eme ka ndụ bụrụ ndụ ma ọ bụ ihe ndụ dabeere na ya abụghị inwe ihe n’ọba ụba; e jighị ya kwuo na ndụ mmadụ adịghị adị mgbe ọ bara ọgaranya.
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: nke ihe o nwere
  rationale: ὑπάρχοντα n’ebe a bụ ihe mmadụ nwere ma ọ bụ ihe onwunwe ya; nsụgharị a doro ndị Igbo nkịtị anya ma dịkwa nso n’usoro echiche Grik.
theological_decisions:
- issue: Okwu nwoke otu onye e ji anọchi anya mmadụ niile
  choice: ndụ mmadụ ... ihe o nwere
  alternative: ndụ ya ... ihe onwunwe ya
  rationale: Ihe a na-ekwu metụtara mmadụ ọ bụla, ọ bụghị naanị nwoke; “mmadụ” na-egosipụta nke ahụ n’Igbo n’enweghị ịgbakwunye echiche ọzọ.
- issue: Obosara ihe πλεονεξία pụtara
  choice: ụdị anyaukwu niile
  alternative: oke ọchịchọ inweta ihe niile
  rationale: A họọrọ “anyaukwu” iji gosi ọchịchọ inweta ma ọ bụ ịchịkọta ihe n’ụzọ gabigara ókè, ọ bụghị naanị ịchọ ihe onye ọzọ nwere.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere iwu abụọ ahụ iche—“Lezienụ anya” na “chebekwanụ onwe unu”—iji chekwaa ike na usoro nke Ὁρᾶτε καὶ φυλάσσεσθε.
