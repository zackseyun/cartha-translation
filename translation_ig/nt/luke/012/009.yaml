review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrastive δέ, the generic substantive participle, the explicit object “me,” both public/heavenly settings, and the unnamed agent in the future passive. “Ndị mmadụ” appropriately renders ἀνθρώπων inclusively. However, “-kwa” in “a ga-agọnahụkwa ya” adds an explicit ‘also/in turn’ nuance not present in the Greek passive and is unnecessary for the reciprocal parallel.
  naturalness: The rendering is clear, idiomatic Standard Igbo, and suitably solemn. “N’ihu ndị mmadụ” and “n’ihu ndị mmụọ ozi Chineke” are natural and preserve the public/celestial contrast. Removing “-kwa” makes the second clause more strictly source-aligned without reducing naturalness.
  terminology: “Gọnahụ” consistently preserves the verbal correspondence between ἀρνέομαι and ἀπαρνέομαι. “Ndị mmụọ ozi Chineke” is an established, clear rendering of “the angels of God.” The passive impersonal construction “a ga-agọnahụ ya” rightly avoids identifying the agent.
  issues:
  - severity: low
    issue: The particle “-kwa” is added in the future passive clause.
    rationale: The Greek says only ἀπαρνηθήσεται, ‘will be denied,’ with no equivalent of ‘also.’ Although the added particle can make the reciprocal contrast sound smooth in Igbo, omitting it more closely preserves the wording and its unspecified passive action.
  revised_text: Ma onye na-agọnahụ m n’ihu ndị mmadụ, a ga-agọnahụ ya n’ihu ndị mmụọ ozi Chineke.[a]
