source:
  edition: SBLGNT
  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: ig
  text: Ma onye na-agọnahụ m n’ihu ndị mmadụ, a ga-agọnahụ ya n’ihu ndị mmụọ ozi Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘a ga-ajụ ịmata ya.’ Ngwaa Grik nke abụọ nwere ike ịdị ike karịa nke mbụ, ma isi okwu ahụ ji ‘agọnahụ … agọnahụ’ chekwaa njikọ okwu dị n’etiti ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός
  choice: Ma onye na-agọnahụ
  rationale: ‘Ma’ na-egosi ọdịiche dị n’amaokwu bu ụzọ. Nkebi a na-arụ ọrụ dịka aha, ya mere ‘onye na-agọnahụ’ na-egosipụta ụkpụrụ izugbe n’Igbo eke.
- source_word: με
  choice: m
  rationale: Nnọchiaha a bụ ihe omume ngwaa metụtara, na-ezo aka na Jizọs.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: n’ihu ndị mmadụ
  rationale: ‘N’ihu’ na-egosi ime ihe n’ọha ma ọ bụ n’ebe ndị ọzọ nọ; ‘ndị mmadụ’ bụ okwu Igbo gụnyere mmadụ niile ma chekwaa ọdịiche ya na ndị mmụọ ozi.
- source_word: ἀπαρνηθήσεται
  choice: a ga-agọnahụkwa ya
  rationale: Ọdịdị passive nke ‘a ga-… ya’ anaghị akpọ onye ga-eme ya aha. Iji otu mgbọrọgwụ ‘gọnahụ’ n’akụkụ abụọ na-echekwa nzaghachi kwekọrọ ekwekọ dị n’asụsụ Grik; ‘-kwa’ na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ
  choice: n’ihu ndị mmụọ ozi Chineke
  rationale: Nsụgharị a doro anya ma na-echekwa usoro genitive ahụ na ọnọdụ ụlọikpe eluigwe.
theological_decisions:
- issue: Onye a na-akọwaghị aha ya nke ga-agọnahụ onye ahụ
  choice: 'Ịhapụ okwu ahụ n’ụdị passive: ‘a ga-agọnahụkwa ya,’ n’akpọghị onye ga-eme ya aha'
  alternative: Ịsị na Nwa nke Mmadụ, Jizọs, ma ọ bụ Chineke ga-agọnahụ ya
  rationale: Grik akpọghị onye na-eme omume ahụ aha. Amaokwu gbara ya gburugburu nwere ike iduga onye na-agụ ya n’otu nghọta, ma amaokwu a n’onwe ya hapụrụ ya n’ụdị passive; nsụgharị ahụ kwesịrị ichekwa esemokwu nkà mmụta okpukpe a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị mmadụ’ kama okwu nwere ike ịpụta naanị ụmụ nwoke, n’ihi na ἄνθρωποι ebe a pụtara mmadụ n’ozuzu ma na-emegide ‘ndị mmụọ ozi Chineke.’
