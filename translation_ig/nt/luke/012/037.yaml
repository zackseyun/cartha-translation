    issue: “mee ka ha nọdụ ala iri nri” anaghị echekwa ἀνακλινεῖ nke ọma.
    rationale: Okwu Grik a pụtara ime ka ha dabere/dina ala maka nri, ọ bụghị naanị ịnọdụ ala. Nkọwa ala peeji ziri ezi, ma ederede bụ isi kwesịrị igosikwa ihe ahụ.
  - severity: low
    issue: “bịakwutekwa ha” nwere “-kwa” na-abụghị akụkụ nke παρελθών.
    rationale: Participial παρελθών na-egosi ịbịa ma ọ bụ ịgafe iji jeere ha ozi n’ọnọdụ a; “-kwa” na-enye mgbakwunye nkwusi ike na-enweghị isi n’ederede Grik.
  - severity: low
    issue: Nkọwa c sịrị “ọ ga-eke onwe ya n’úkwù.”
    rationale: Nke a abụghị Igbo nkịtị ma nwee ike ịpụta ịkewa onwe ya. Ihe a na-ekwu bụ ikechi uwe ya n’úkwù.
