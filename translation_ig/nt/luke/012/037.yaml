id: LUK.12.37
reference: Luke 12:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: ig
  text: 'Ngọzi na-adịrị ndị ohu[a] ahụ Onyenwe ha[b] ga-ahụ ka ha na-eche nche mgbe ọ bịara. N’ezie, ana m asị unu: ọ ga-ekechi uwe ya n’úkwù maka ije ozi[c], mee ka ha dinara ala iri nri[d], bịa jeere ha ozi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị na-eje ozi.” Okwu Grik bụ δοῦλοι (douloi); n’ọnọdụ a, ọ na-ekwu maka ndị ohu nọ n’okpuru onye nwe ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “nna ukwu ha” ma ọ bụ “onye nwe ha.” Okwu Grik κύριος (kyrios) pụrụ ịpụta Onyenwe, nna ukwu, ma ọ bụ onye nwe ndị ohu n’ọnọdụ a.
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ nkịtị: “ọ ga-ekechi uwe ya n’úkwù.” Nke a bụ ikechi uwe n’úkwù iji kwadebe maka ọrụ.'
    reason: cultural_note
  - marker: d
    text: N’ụzọ nkịtị, ọ ga-eme ka ha dabere ma ọ bụ dina ala n’ebe nri, dịka omenala iri nri n’oge ahụ si dị.
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Ọ bụ usoro okwu Igbo a na-ejikarị akọwa μακάριοι n’okwu ngọzi; ọ na-egosi ọnọdụ ọma sitere n’ihu ọma Chineke karịa naanị obi ụtọ mmadụ.
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: N’akụkọ a, mmekọrịta onye nwe ụlọ na ndị nọ n’okpuru ya pụtara ìhè. “Ndị ohu” na-egosipụta ọnọdụ ahụ nke ọma, ebe nkọwa ala peeji na-ekweta na a pụkwara ịghọta ya dị ka ndị na-eje ozi.
- source_word: κύριος
  choice: Onyenwe ha
  rationale: Nke a dabara n’ọnọdụ onye nwe ndị ohu n’ilu ahụ, ma okwu “Onyenwe” ka na-ahapụkwa ụda sara mbara κύριος nwere ike inwe n’akwụkwọ Luk.
- source_word: γρηγοροῦντας
  choice: ka ha na-eche nche
  rationale: Ọ na-egosi na ha amụghị ụra ma dị njikere; okwu a bụ Igbo dị ndụ ma na-eburu ma nche ma njikere.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: N’ezie, ana m asị unu
  rationale: Ọ na-echekwa nkwusi ike nke usoro okwu Grik ma bụrụkwa Igbo doro anya na nke dị ùgwù.
- source_word: περιζώσεται
  choice: ọ ga-ekechi uwe ya n’úkwù maka ije ozi
  rationale: Nke a na-egosipụta omume mmadụ na-akwadebe onwe ya maka ọrụ, ma na-echekwakwa ihe atụ omenala nke ikechi uwe n’úkwù.
- source_word: ἀνακλινεῖ αὐτούς
  choice: mee ka ha nọdụ ala iri nri
  rationale: Ndị oge ahụ na-adabere ma ọ bụ na-edina n’akụkụ tebụl mgbe ha na-eri nri. Ntụgharị a na-enye onye Igbo nke oge a ihe omume ahụ n'ụzọ nghọta, ebe nkọwa ala peeji na-echekwa nkọwa nkịtị.
- source_word: παρελθὼν
  choice: bịakwutekwa ha
  rationale: N’ọnọdụ ije ozi n’oge nri, participle a na-egosi ịbịaru ndị nọ na nri nso iji jeere ha ozi.
- source_word: διακονήσει αὐτοῖς
  choice: jeere ha ozi
  rationale: Ọ na-egosi ọrụ a na-arụ n’ezie, karịchaa ije ozi n’oge nri, na-enweghị ime ka okwu ahụ bụrụ naanị okwu ụka.
theological_decisions:
- issue: Ịsụgharị κύριος n’ilu ebe ọ pụtara onye nwe ndị ohu ma nwee ike inwe ụda gbasara Onyenwe
  choice: Onyenwe ha
  alternative: nna ukwu ha / onye nwe ha
  rationale: “Onyenwe ha” dabara na ọnọdụ ụlọ ahụ ma ghara imechi ụzọ n’ụda sara mbara Luk nwere ike ịkpọlite. Nkọwa ala peeji na-egosi nhọrọ a kapịrị ọnụ banyere onye nwe ụlọ.
- issue: Ịsụgharị δοῦλος n’ọnọdụ mmekọrịta ndị ohu na onye nwe ha
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: Ọnọdụ ndị a nọ n’okpuru onye nwe ha bụ akụkụ dị mkpa nke ihe atụ ahụ. “Ndị ohu” na-echekwa nke a, ma a na-enye nhọrọ dị nro karị n’ala peeji.
- issue: Omume Onyenwe ahụ nke ijere ndị ohu ya ozi
  choice: 'E chekwara nkwupụta ahụ kpọmkwem: ọ ga-akwadebe onwe ya, mee ka ha rie nri, jeere ha ozi'
  alternative: Ịkọwa ya dịka naanị ihe atụ banyere ụgwọ ọrụ n’ọdịnihu
  rationale: 'Amaokwu ahụ n’onwe ya nwere ntụgharị ọnọdụ dị ịtụnanya: onye nwe ha na-eje ozi. Ntụgharị ahụ ekwesịghị ịkọwa kpọmkwem ihe nkà mmụta okpukpe nke ihe a pụtara ma ọ bụ belata ike ya.'
translation_notes:
  register: 'E ji Standard Igbo dị ugbu a, nke doro anya ma dị ùgwù. Ahịrịokwu ahụ na-echekwa usoro ihe omume na ihe ịtụnanya dị na Grik: ndị ohu na-eche nche, Onyenwe ha abịa, ma ya onwe ya akwadebe jeere ha ozi. E ji “nọdụ ala iri nri” mee ka omenala iri nri doo onye na-agụ taa anya, ebe e debere nkọwa banyere idabere n’ala peeji.'
