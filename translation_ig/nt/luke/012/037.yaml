review_pass:
  verdict: revise
  source_fidelity: 'E chekwara ihe ndị bụ isi dị na Grik: ngọzi e kwuru maka ndị ohu, ịchọta ha ka ha na-amụ anya, Onyenwe ahụ ikechi uwe maka ije ozi, ime ka ha rie nri n’ọnọdụ iri nri nke oge ahụ, na ijere ha ozi. Otú ọ dị, “mee ka ha nọdụ ala” na-ebelata ἀνακλινεῖ, nke na-ekwu kpọmkwem maka ime ka mmadụ dabere ma ọ bụ dina ala n’ebe nri. “bịakwutekwa ha” na-agbakwụnye ụda “kwa/tụkwasị” na-adịghị n’asụsụ Grik; a gbanwere ya ka ọ bụrụ “bịa jeere ha ozi.”'
  naturalness: Ntụgharị e degharịrị na-eji Standard Igbo doro anya ma dị ùgwù. “Mee ka ha dinara ala iri nri” na-adị mfe ịghọta, ma na-echekwa omume iri nri n’ịdabere nke okwu Grik chọrọ; nkọwa ala peeji na-akọwa omenala ahụ.
  terminology: “Ndị ohu” dabara na δοῦλοι n’ọnọdụ ụlọ na onye nwe. “Onyenwe ha” na-echekwa κύριος ma kwe ka ihe ilu ahụ na ụda Luk dịrị. “Jeere ha ozi” na-asụgharị διακονήσει n’enweghị itinye nkọwa ụka na-enweghị isi.
  issues:
