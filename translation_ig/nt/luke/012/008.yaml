revisions:
- from: Ma ana m agwa unu, onye ọ bụla nke ga-ekwupụta n'ihu mmadụ na ọ bụ nke m,[a] Nwa nke Mmadụ ga-ekwupụtakwa n'ihu ndị mmụọ ozi nke Chineke na onye ahụ bụ nke ya.
  to: Ma ana m asị unu, onye ọ bụla ga-ekwupụta m n'ihu ndị mmadụ, Nwa nke Mmadụ ga-ekwupụtakwa ya n'ihu ndị mmụọ ozi Chineke.[a]
  rationale: The revision restores the direct reciprocal objects of the Greek—Jesus («m») and the individual («ya»)—while retaining an idiomatic Standard Igbo rendering of public acknowledgment. It also uses «ndị mmadụ» for the general human plural and preserves the established title «Nwa nke Mmadụ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:34Z'
review_pass:
  verdict: revise
  source_fidelity: Draft retains the reciprocal public-witness structure and the title «Nwa nke Mmadụ», but «na ọ bụ nke m» / «onye ahụ bụ nke ya» changes the direct objects «me» and «him» into possessive-status statements (‘is mine/is his’). This is an interpretive expansion and does not preserve the Greek construction as closely as direct acknowledgment of Jesus and of that person.
  naturalness: The wording is generally clear Standard Igbo, but «n'ihu mmadụ» is less idiomatic here than the plural «n'ihu ndị mmadụ». Direct-object use of «kwupụta» is concise and suitably formal in this reciprocal saying.
  terminology: «Nwa nke Mmadụ» and «ndị mmụọ ozi Chineke» are appropriate established biblical terms. Retaining «kwupụta» in both clauses preserves the lexical correspondence of ὁμολογέω without forcing an unnatural literal rendering of ἐν.
  issues:
  - severity: medium
    issue: The phrases «na ọ bụ nke m» and «na onye ahụ bụ nke ya» are possessive paraphrases rather than direct acknowledgments of Jesus and the person.
    rationale: The Greek says that a person confesses/acknowledges Jesus and that the Son of Man will confess/acknowledge that person. The draft's wording adds a status formula (‘belongs to me/him’) not stated in the source and weakens the direct reciprocal syntax.
  - severity: low
    issue: «n'ihu mmadụ» uses a singular collective where «n'ihu ndị mmadụ» is more natural for the public plural in this context.
    rationale: The Greek plural τῶν ἀνθρώπων refers generally to people. The Igbo plural is idiomatic and preserves this public setting.
  revised_text: Ma ana m asị unu, onye ọ bụla ga-ekwupụta m n'ihu ndị mmadụ, Nwa nke Mmadụ ga-ekwupụtakwa ya n'ihu ndị mmụọ ozi Chineke.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị «ga-ekwupụta m» dịka «ga-anakwere m n'ihu ọha». Okwu Grik ahụ na-ekwu banyere ịnakwere ma ọ bụ ikwupụta Jizọs n'ihu ọha.
    reason: lexical_alternative
  revision_rationale: The revision restores the direct reciprocal objects of the Greek—Jesus («m») and the individual («ya»)—while retaining an idiomatic Standard Igbo rendering of public acknowledgment. It also uses «ndị mmadụ» for the general human plural and preserves the established title «Nwa nke Mmadụ».
