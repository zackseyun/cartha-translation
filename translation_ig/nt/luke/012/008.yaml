id: LUK.12.8
reference: Luke 12:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: ig
  text: Ma ana m asị unu, onye ọ bụla ga-ekwupụta m n'ihu ndị mmadụ, Nwa nke Mmadụ ga-ekwupụtakwa ya n'ihu ndị mmụọ ozi Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị «ga-ekwupụta m» dịka «ga-anakwere m n'ihu ọha». Okwu Grik ahụ na-ekwu banyere ịnakwere ma ọ bụ ikwupụta Jizọs n'ihu ọha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: Ma ana m agwa unu
  rationale: δέ bụ njikọ dị nro nke nwere ike igosi ntakịrị ntụgharị uche; “Ma” dabara n'okwu a, ebe “ana m agwa unu” na-egosipụta nkwupụta siri ike nke Jizọs na-ekwu ugbu a.
- source_word: πᾶς ὃς ἂν
  choice: onye ọ bụla nke ga-
  rationale: Nke a na-egosi ọnọdụ zuru ụwa ọnụ na-emetụta onye ọ bụla; Igbo a bụ nke e ji eme ihe n'ụzọ nkịtị.
- source_word: ὁμολογήσῃ ἐν ἐμοὶ
  choice: ga-ekwupụta ... na ọ bụ nke m
  rationale: ὁμολογέω na ἐν + dative ebe a pụtara ikweta ma ọ bụ ịkpọsa n'ihu ọha mmekọrịta mmadụ na Jizọs. Nsụgharị a na-ezere okwu Igbo na-adịghị eke, “kwupụta n'ime m,” ma ghara ịgbakwunye echiche nke otu ụka.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: n'ihu mmadụ
  rationale: “N'ihu” na-egosi ịbụ n'ihu ọha ma ọ bụ n'ọnụnọ ha. “Mmadụ” n'Igbo nwere ike ịrụ ọrụ mkpokọta, na-ezo aka n'ụmụ mmadụ niile n'agbanyeghị nwoke ma ọ bụ nwanyị.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: E debere aha Jizọs ji akpọ onwe ya n'ụzọ a maara nke ọma, ka ihe ọ na-echetara gbasara Daniel na ịdị arọ ya n'ihe gbasara okwukwe ghara ịla n'iyi.
- source_word: ὁμολογήσει ἐν αὐτῷ
  choice: ga-ekwupụtakwa ... na onye ahụ bụ nke ya
  rationale: E ji otu ngwaa “kwupụta” debe njikọ ya na nkwupụta nke mbụ. Usoro a na-egosipụta nkwenye Jizọs ga-enye onye ahụ n'ihu ọha, n'Igbo doro anya.
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: n'ihu ndị mmụọ ozi nke Chineke
  rationale: Nsụgharị kwụ ọtọ nke na-echekwa ọnọdụ nke ịgba akaebe n'ihu ọha n'eluigwe.
theological_decisions:
- issue: Usoro nkwupụta ibe ya nke ὁμολογέω na ἐν + dative
  choice: “kwupụta ... na ọ bụ nke m ... kwupụta ... na onye ahụ bụ nke ya”
  alternative: “kwupụta n'ime m ... kwupụta n'ime ya” ma ọ bụ “kweta na m ... kweta na ya”
  rationale: Iji “n'ime” sụgharịa ἐν n'ụzọ mkpụrụokwu agaghị abụ Igbo eke, ọ pụkwara ime ka ihe a pụtara ghara ido anya. Nhọrọ a na-echekwa nkwupụta mmekọrịta n'ihu ọha na mmeghachi omume kwekọrọ na ya, n'etinyeghị nkọwa ozizi ọzọ.
- issue: Oke ndị okwu ἀνθρώπων na-ezo aka na ha
  choice: “mmadụ” dị ka okwu mkpokọta maka ụmụ mmadụ
  alternative: “ndị mmadụ” ma ọ bụ “ụmụ nwoke”
  rationale: Ọ bụ ezie na ọdịdị Grik bụ masculine plural, n'ebe a ọ na-anọchite anya ụmụ mmadụ n'ozuzu. “Mmadụ” bụ Igbo eke nke na-echekwa oke ahụ n'emeghị ka amaokwu ahụ yie ka ọ bụ naanị ụmụ nwoke ka ọ na-ekwu maka ha.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji “kwupụta ... na ọ bụ nke m” mee ka nkwupụta n'ihu ọha na mmekọrịta ahụ doo onye nkịtị anya, ma e debere otu ngwaa ahụ n'akụkụ abụọ iji gosipụta usoro mmeghachi omume dị n'okwu Grik.
