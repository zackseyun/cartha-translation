id: LUK.16.23
reference: Luke 16:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: ig
  text: N’ime Hedis[a], mgbe ọ nọ n’ahụhụ, o weliri anya ya, hụ Ebreham n’ebe dị anya, hụkwa Lazarọs n’obi Ebreham.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ala ndị nwụrụ anwụ.” Hedis bụ aha ebe ndị nwụrụ anwụ nọ; ọ bụghị otu okwu Grik ahụ a na-asụgharị “Gehena,” nke na-ezo aka n’ebe ikpe ikpeazụ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’obi ya”; ya bụ, “n’obi Ebreham.” Okwu a na-egosi na Lazarọs nọ Ebreham ezigbo nso.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: Hedis
  rationale: A tụgharịghị ya ka ọ bụrụ “hel,” kama e dere aha Grik ahụ n’ụdị Igbo iji debe ọdịiche dị n’etiti Hedis, ebe ndị nwụrụ anwụ nọ, na Gehena, ebe ikpe ikpeazụ.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: o weliri anya ya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke na-edebe ihe oyiyi dị n’okwu Grik ahụ.
- source_word: ὑπάρχων ἐν βασάνοις
  choice: mgbe ọ nọ ... n’ahụhụ
  rationale: E jiri nkebiokwu oge mee participle Grik ahụ ka ahịrịokwu ahụ bụrụ Igbo nkịtị, na-akọwapụtaghị mmekọrịta oge karịa ihe odide ahụ kwuru.
- source_word: ὁρᾷ
  choice: ọ ... hụ
  rationale: Ọ bụ ezie na Grik ji present tense dị ndụ, past narrative bụ ụzọ Igbo kacha eke si kọọ ihe a; ịdị ndụ nke akụkọ ahụ ka nọgidere na ngwaa dị n’usoro.
- source_word: ἀπὸ μακρόθεν
  choice: n’ebe dị anya
  rationale: Nke a na-egosi nkewapụ dị ukwuu n’ebe ha nọ n’Igbo doro anya.
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: n’akụkụ obi ya
  rationale: κόλπος na-ezo aka n’obi, obi uwe, ma ọ bụ ebe dị ezigbo nso n’akụkụ mmadụ. “N’akụkụ obi ya” na-edebe ihe oyiyi ahụ ma na-egosi ịdị nso n’enweghị ime ka ọ pụta nanị dị ka mmetụta nke obi.
theological_decisions:
- issue: ᾅδης n’ihe gbasara ọnọdụ ndị nwụrụ anwụ na ikpe ikpeazụ
  choice: Hedis
  alternative: ala ndị nwụrụ anwụ; hel
  rationale: “Hedis” na-edebe okwu Grik ahụ iche, ghara ijikọ ya ozugbo na Gehena ma ọ bụ kpebie arụmụka gbasara ọnọdụ ikpeazụ.
- issue: Ihe oyiyi κόλπος nke a na-akpọkarị ‘obi Ebreham’
  choice: n’akụkụ obi ya
  alternative: n’aka ya; n’obi Ebreham
  rationale: Nhọrọ a na-edebe ihe oyiyi obi na mmekọrịta chiri anya, ma ọ naghị eme ka nkọwa ọdịnala bụrụ nkọwa naanị ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ soro usoro akụkọ Igbo nkịtị, ebe ndetu ala peeji na-echekwa nkọwa okwu Grik na okwu ọdịnala.
