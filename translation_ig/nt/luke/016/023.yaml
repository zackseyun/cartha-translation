revisions:
- from: Mgbe ọ nọ na Hedis[a] n’ahụhụ, o weliri anya ya hụ Ebreham n’ebe dị anya, hụkwa Lazarọs ka ọ nọ n’akụkụ obi ya.[b]
  to: N’ime Hedis[a], mgbe ọ nọ n’ahụhụ, o weliri anya ya, hụ Ebreham n’ebe dị anya, hụkwa Lazarọs n’obi Ebreham.[b]
  rationale: The revision restores the opening locative force of the Greek and replaces an awkward, potentially ambiguous possessive expression with an explicit reference to Abraham. It preserves the Greek distinction between Hades and Gehenna, the narrative sequence, spatial distance, and the close-fellowship imagery, without adding doctrinal conclusions.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains Hades as a distinct term and conveys the lifting of the eyes, affliction, distant sight of Abraham, and Lazarus' close place with Abraham. However, “n’akụkụ obi ya” leaves the possessive referent less explicit than the Greek context and is an awkward rendering of the established κόλποις imagery. The revision explicitly identifies Abraham while retaining the bodily/relational image.
  naturalness: The proposed wording is clear, dignified Standard Igbo. “N’ime Hedis” naturally renders the locative phrase, and “mgbe ọ nọ n’ahụhụ” appropriately expresses the circumstantial participle without forcing a doctrinal or temporal interpretation.
  terminology: “Hedis” properly preserves ᾅδης rather than conflating it with Gehena. “N’obi Ebreham” is a natural, recognizable Igbo rendering of the traditional and source-based ‘Abraham’s bosom’ image; the note explains the literal possessive and its referent. “Ebreham” and “Lazarọs” are appropriate established Igbo biblical forms.
  issues:
  - severity: medium
    issue: The phrase “n’akụkụ obi ya” is both somewhat unnatural and less explicit about whose bosom is meant.
    rationale: ἐν τοῖς κόλποις αὐτοῦ refers to Abraham, who is just named. Rendering it “n’obi Ebreham” preserves the image and removes avoidable pronoun ambiguity.
  - severity: low
    issue: The Hades location is introduced with a temporal clause rather than as the opening locative setting.
    rationale: “N’ime Hedis” more directly reflects καὶ ἐν τῷ ᾅδῃ while retaining fluent Igbo.
  revised_text: N’ime Hedis[a], mgbe ọ nọ n’ahụhụ, o weliri anya ya, hụ Ebreham n’ebe dị anya, hụkwa Lazarọs n’obi Ebreham.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ala ndị nwụrụ anwụ.” Hedis bụ aha ebe ndị nwụrụ anwụ nọ; ọ bụghị otu okwu Grik ahụ a na-asụgharị “Gehena,” nke na-ezo aka n’ebe ikpe ikpeazụ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’obi ya”; ya bụ, “n’obi Ebreham.” Okwu a na-egosi na Lazarọs nọ Ebreham ezigbo nso.
    reason: lexical_alternative
