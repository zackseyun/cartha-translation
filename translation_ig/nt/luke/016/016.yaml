    text: 'Ụfọdụ na-aghọta akụkụ ikpeazụ a n’ụzọ ọzọ, n’ihi okwu yiri ya dị na Matiu 11:12: na a na-eme alaeze ahụ ihe ike, ndị na-eme ihe ike na-ejikwa ya n’ike. Ma n’ebe a, isiokwu dị n’asụsụ Grik bụ “onye ọ bụla,” ọ bụghị “alaeze.”'
    reason: alternative_reading
  revision_rationale: The revision improves idiomatic Standard Igbo while retaining the Greek syntax and semantic tension. It renders εὐαγγελίζεται as proclamation of good news concerning the kingdom, retains the forceful sense of βιάζεται, and revises both footnotes to report alternatives accurately and neutrally.
