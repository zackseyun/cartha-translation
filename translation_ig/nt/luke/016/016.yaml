revisions:
- from: Iwu na Ndị Amụma dị ruo n’oge Jọn; malite mgbe ahụ, a na-ekwusa alaeze Chineke dị ka ozi ọma, onye ọ bụla na-ejikwa ike abanye n’ime ya.[a][b]
  to: Iwu na Ndị Amụma dị ruo n’oge Jọn; site n’oge ahụ gawa, a na-ekwusa ozi ọma banyere alaeze Chineke, onye ọ bụla na-ejikwa ike abanye n’ime ya.[a][b]
  rationale: The revision improves idiomatic Standard Igbo while retaining the Greek syntax and semantic tension. It renders εὐαγγελίζεται as proclamation of good news concerning the kingdom, retains the forceful sense of βιάζεται, and revises both footnotes to report alternatives accurately and neutrally.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the temporal boundary at John, the ongoing proclamation of God's kingdom, and the difficult construction πᾶς εἰς αὐτὴν βιάζεται. However, rendering εὐαγγελίζεται as ‘a na-ekwusa alaeze Chineke dị ka ozi ọma’ is less idiomatic in Igbo and can make the kingdom itself sound like the grammatical content being labelled ‘good news.’ ‘A na-ekwusa ozi ọma banyere alaeze Chineke’ naturally retains the verb’s good-news proclamation sense. The main rendering of βιάζεται remains appropriately forceful without resolving the disputed nuance.
  naturalness: ‘Site n’oge ahụ gawa’ is a more natural Standard Igbo transition than ‘malite mgbe ahụ’ in this register. Recasting the proclamation clause also improves flow and clarity. The capitalized scriptural-category terms ‘Iwu’ and ‘Ndị Amụma’ are suitable.
  terminology: ‘Iwu,’ ‘Ndị Amụma,’ ‘alaeze Chineke,’ and ‘ozi ọma’ are appropriate Standard Igbo theological and scriptural terms. The footnotes should state the lexical and interpretive alternatives without adding ‘ngwa ngwa’ (‘quickly’), which is not specifically expressed by βιάζεται.
  issues:
  - severity: medium
    issue: The wording ‘a na-ekwusa alaeze Chineke dị ka ozi ọma’ is awkward and potentially imprecise.
    rationale: Although understandable, it presents ‘the kingdom’ as directly being called good news. The Greek εὐαγγελίζεται idiomatically communicates good news being proclaimed concerning the kingdom; the revised wording expresses this naturally in Igbo.
  - severity: low
    issue: Footnote a introduces ‘ngwa ngwa’ (‘quickly/urgently’) as part of its explanation.
    rationale: The verb βιάζεται conveys forceful or strenuous movement, but does not itself specifically denote speed. The note should preserve the forceful ambiguity without adding that element.
  - severity: low
    issue: Footnote b describes an alternative as merely ‘negative’ rather than identifying it.
    rationale: A clear, neutral description of the alternative reading better serves the audit trail and avoids evaluative wording.
  revised_text: Iwu na Ndị Amụma dị ruo n’oge Jọn; site n’oge ahụ gawa, a na-ekwusa ozi ọma banyere alaeze Chineke, onye ọ bụla na-ejikwa ike abanye n’ime ya.[a][b]
  revised_footnotes:
