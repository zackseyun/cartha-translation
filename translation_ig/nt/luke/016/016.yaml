id: LUK.16.16
reference: Luke 16:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: ig
  text: Iwu na Ndị Amụma dị ruo n’oge Jọn; site n’oge ahụ gawa, a na-ekwusa ozi ọma banyere alaeze Chineke, onye ọ bụla na-ejikwa ike abanye n’ime ya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ọ bụla na-agbasi mbọ ike ịbanye n’ime ya.” Ngwaa Grik ahụ nwere ike igosi mmegharị e ji ike ma ọ bụ mgbalị siri ike mee.
    reason: lexical_alternative
  - marker: b
    text: 'Ụfọdụ na-aghọta akụkụ ikpeazụ a n’ụzọ ọzọ, n’ihi okwu yiri ya dị na Matiu 11:12: na a na-eme alaeze ahụ ihe ike, ndị na-eme ihe ike na-ejikwa ya n’ike. Ma n’ebe a, isiokwu dị n’asụsụ Grik bụ “onye ọ bụla,” ọ bụghị “alaeze.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος
  choice: Iwu
  rationale: Nke a na-ezo aka n’Iwu Mosis dị ka otu akụkụ Akwụkwọ Nsọ, ọ bụghị iwu nkịtị; mkpụrụedemede ukwu na-egosi aha otu ahụ.
- source_word: οἱ προφῆται
  choice: Ndị Amụma
  rationale: Ọ bụ aha a na-eji maka akụkụ Akwụkwọ Nsọ ndị Juu nke a na-ejikọkarị ya na Iwu; mkpụrụedemede ukwu na-egosi ụdị ojiji a.
- source_word: μέχρι Ἰωάννου
  choice: ruo n’oge Jọn
  rationale: Nke a na-egosi njedebe oge. Ịtinye ‘n’oge’ na-eme ka okwu ahụ doo anya ma daa nke ọma n’Igbo, ebe Jọn bụ Jọn Onye Na-eme Baptizim dịka ihe gbara amaokwu ahụ gburugburu si gosi.
- source_word: ἀπὸ τότε
  choice: malite mgbe ahụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji egosi mgbanwe malitere n’oge ahụ ma gaa n’ihu.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ nsụgharị Igbo doro anya nke na-ahapụ ma echiche ọchịchị Chineke ma echiche alaeze ya ka ha dị.
- source_word: εὐαγγελίζεται
  choice: a na-ekwusa ... dị ka ozi ọma
  rationale: Ụdị a na-egosi nkwusa na-aga n’ihu, ma na-echekwa echiche nke ozi ọma dị n’okwu Grik ahụ.
- source_word: πᾶς
  choice: onye ọ bụla
  rationale: 'Nke a na-egosipụta ike nkesa nke okwu ahụ: mmadụ n’otu n’otu, n’enweghị ibelata oke ya.'
- source_word: εἰς αὐτὴν
  choice: n’ime ya
  rationale: ‘Ya’ na-alaghachi n’alaeze Chineke, ebe ‘n’ime’ na-egosi mmegharị ịbanye n’alaeze ahụ.
- source_word: βιάζεται
  choice: na-ejikwa ike abanye
  rationale: Okwu Grik a siri ike ịkọwa, ma n’usoro ahịrịokwu a, ‘onye ọ bụla’ bụ isiokwu, ‘n’ime ya’ na-egosikwa mmegharị ịbanye. Nsụgharị a na-echekwa echiche nke ịbanye n’ike ma ọ bụ n’ọsọ siri ike.
theological_decisions:
- issue: Ihe βιάζεται pụtara n’ihe gbasara alaeze Chineke
  choice: Ahịrịokwu ahụ na-ekwu na ndị mmadụ na-eji ike abanye n’alaeze ahụ.
  alternative: A na-eme alaeze Chineke ihe ike, ma ndị na-eme ihe ike na-apụnara ya.
  rationale: N’adịghị ka Matiu 11:12, isiokwu ngwaa a na Luk bụ πᾶς (‘onye ọ bụla’), ebe εἰς αὐτὴν na-egosi mmegharị ịbanye n’alaeze ahụ. A hapụrụ ịdị ike na mgbagwoju anya okwu ahụ ka ọ dị, n’emeghị ya ozizi banyere mmadụ iji ọrụ ya nweta alaeze.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Iwu’ na ‘Ndị Amụma’ nwere mkpụrụedemede ukwu iji gosi na ha bụ aha ngalaba Akwụkwọ Nsọ. E chekwara mgbagwoju anya dị na βιάζεται n’ahịrịokwu bụ isi na nkọwa ala peeji, n’etinyeghị echiche otu ụka pụrụ iche.
