  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: ig
  text: Ya mere, ọ bụrụ na unu egosibeghị na unu bụ ndị a pụrụ ịtụkwasị obi n'ijikwa akụ na ụba na-adịghị ezi omume[a], ònye ga-atụkwasị unu n'aka ezi akụ ahụ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “akụ na ụba aghụghọ.” N'okwu Greek, “mamọn na-adịghị ezi omume.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “ezi ihe ahụ” ma ọ bụ “ihe ahụ bụ ezi”; n'ebe a, o yikarịrị ka ọ pụtara “ezi akụ ahụ,” nke e ji atụnyere akụ na ụba nke ụwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδίκῳ
  choice: ajọ omume
  rationale: Nke a na-edobe agba omume nke ἄδικος, ya bụ ihe na-abụghị ezi omume, n'emeghị ka ọ pụta nanị akụ e nwetara site n'aghụghọ.
- source_word: μαμωνᾷ
  choice: akụ na ụba
  rationale: Ọ na-egosi akụ ma ọ bụ ihe mmadụ nwere n'ozuzu, ọ bụghị naanị ego; nke a bụkwa okwu Igbo doro anya nye ndị na-agụ akwụkwọ taa.
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: n'iji akụ na ụba ajọ omume
  rationale: N'iji na-egosipụta ụzọ ma ọ bụ ọnọdụ e ji amata ntụkwasị obi, ma na-asụ Igbo n'ụzọ ebumpụta ụwa.
- source_word: πιστοὶ
  choice: kwesịrị ntụkwasị obi
  rationale: N'ọnọdụ nlekọta ihe e nyere mmadụ, okwu a na-elekwasị anya n'ịbụ onye a pụrụ ịtụkwasị obi.
- source_word: οὐκ ἐγένεσθε
  choice: unu egosighị na unu kwesịrị
  rationale: γίνομαι na adjective a nwere echiche nke ịbụ ma ọ bụ igosi onwe onye dị otu a; nsụgharị a dabara n'okwu nlekọta akụ.
- source_word: τὸ ἀληθινὸν
  choice: ezi akụ ahụ
  rationale: Adjective neuter singular a guzochiri noun a hapụrụ n'ekwughị; 'akụ' na-eme ka ọdịiche ya na μαμωνᾷ doo anya, ebe nkọwa ala peeji na-edobe literalness na ambiguity.
- source_word: πιστεύσει
  choice: ga-enyefe unu
  rationale: N'ebe a πιστεύω nwere ihe a na-enyefe na onye a na-enyefe ya, ya mere ọ pụtara inyefe ihe n'aka mmadụ ka o lekọta, ọ bụghị ikwere.
theological_decisions:
- issue: Ihe τὸ ἀληθινὸν na-ezo aka na ya n'ọdụiche ya na akụ na ụba ajọ omume
  choice: ezi akụ ahụ
  alternative: ihe ahụ bụ eziokwu; ezi ihe ahụ
  rationale: Greek hapụrụ noun ahụ n'ekwughị, ma ọdịiche ya na μαμωνᾷ na-akwado nghọta nke ezi akụ. A gbakwụnyere 'akụ' maka Igbo doro anya, ma nkọwa ala peeji na-ekwupụta na ọ bụghị okwu pụtara ìhè na Greek.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ 'akụ na ụba' kama ịsụgharị mamọn dịka aha mbinye, ma jiri 'ezi akụ ahụ' mee ka ọdịiche dị n'amaokwu ahụ doo anya n'enweghị ịgbakwunye ozizi otu ụka.
