revisions:
- from: Ya mere, ọ bụrụ na unu egosighị na unu kwesịrị ntụkwasị obi n'iji akụ na ụba ajọ omume[a], ònye ga-enyefe unu ezi akụ ahụ[b]?
  to: Ya mere, ọ bụrụ na unu egosibeghị na unu bụ ndị a pụrụ ịtụkwasị obi n'ijikwa akụ na ụba na-adịghị ezi omume[a], ònye ga-atụkwasị unu n'aka ezi akụ ahụ[b]?
  rationale: The revision retains the source’s ambiguity about the unstated noun in τὸ ἀληθινόν while using ‘ezi akụ ahụ’ as the same contextually supported completion adopted in the English audit trail. It improves Standard Igbo syntax for ‘unrighteous wealth,’ makes the faithfulness expression less cumbersome, and renders the entrustment sense of πιστεύσει explicitly. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the conditional contrast and correctly understands πιστεύσει as ‘entrust.’ However, ‘akụ na ụba ajọ omume’ is not a natural or well-formed way to express the Greek attributive phrase in Standard Igbo, and ‘ga-enyefe’ can be broader than the stewardship sense of πιστεύω.
  naturalness: The repeated construction ‘egosighị na unu kwesịrị ntụkwasị obi’ is heavy. ‘Unu egosibeghị na unu bụ ndị a pụrụ ịtụkwasị obi’ is clearer, idiomatic Standard Igbo, and retains the contextual force of proving to be faithful.
  terminology: ‘Ndị a pụrụ ịtụkwasị obi’ aptly renders πιστοί in this stewardship setting. ‘Akụ na ụba na-adịghị ezi omume’ preserves the moral qualification of ἀδίκῳ without narrowing it to fraud. ‘Ga-atụkwasị unu n'aka’ expresses entrusting for care or stewardship more precisely than simply handing over.
  issues:
  - severity: medium
    issue: The phrase ‘akụ na ụba ajọ omume’ is grammatically and idiomatically awkward.
    rationale: It does not naturally mark ‘ajọ omume’ as the qualifier of wealth in Standard Igbo. ‘Akụ na ụba na-adịghị ezi omume’ clearly and naturally conveys ‘unrighteous wealth.’
  - severity: low
    issue: ‘Ga-enyefe unu’ understates the nuance of πιστεύσει.
    rationale: πιστεύω here means to entrust something to persons as responsible stewards. ‘Ga-atụkwasị unu n'aka’ preserves that nuance.
  - severity: low
    issue: Footnote b’s wording ‘ihe ahụ bụ eziokwu’ is not a literal equivalent of the substantival adjective.
    rationale: That wording means ‘that thing is true.’ The Greek means ‘the true [thing],’ with the noun unstated.
  revised_text: Ya mere, ọ bụrụ na unu egosibeghị na unu bụ ndị a pụrụ ịtụkwasị obi n'ijikwa akụ na ụba na-adịghị ezi omume[a], ònye ga-atụkwasị unu n'aka ezi akụ ahụ[b]?
  revised_footnotes:
