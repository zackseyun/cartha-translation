    reason: lexical_alternative
  revision_rationale: The revision retains the source’s ambiguity about the unstated noun in τὸ ἀληθινόν while using ‘ezi akụ ahụ’ as the same contextually supported completion adopted in the English audit trail. It improves Standard Igbo syntax for ‘unrighteous wealth,’ makes the faithfulness expression less cumbersome, and renders the entrustment sense of πιστεύσει explicitly. No doctrinal interpretation has been added.
