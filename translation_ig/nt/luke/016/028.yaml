  rationale: The revision gives the contextual warning force of διαμαρτύρηται primary place while retaining its solemn-testimony sense in the footnote. It also replaces an unclear compressed expression for the destination with a natural Igbo phrase that conveys “this place of torment.” The two Greek purpose clauses and the force of “they too” are preserved.
