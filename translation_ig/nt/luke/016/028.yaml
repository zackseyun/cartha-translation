id: LUK.16.28
reference: Luke 16:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: ig
  text: n’ihi na m nwere ụmụnne nwoke ise, ka ọ dọọ ha aka ná ntị nke ọma[a], ka ha kwa ghara ịbịa n’ebe a na-ata ahụhụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka ọ gbaa ha àmà n’ụzọ siri ike.” Okwu Grik ahụ nwere ike igosi ịgba àmà n’ụzọ dị nsọ ma ọ bụ ịdọ aka ná ntị n’ụzọ siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: n’ihi na enwere m
  rationale: γάρ na-enye nkọwa kpatara arịrịọ e kwuru n’amaokwu bu ụzọ, ebe ἔχω pụtara inwe; nkebi a bụ Igbo doro anya ma jikọta echiche abụọ ahụ.
- source_word: πέντε ἀδελφούς
  choice: ụmụnne nwoke ise
  rationale: ἀδελφούς bụ ọtụtụ nke nwoke, ya mere ‘ụmụnne nwoke’ na-egosi kpọmkwem na ndị a bụ ụmụnne ya ndị nwoke.
- source_word: ὅπως
  choice: ka
  rationale: ὅπως na-egosi ebumnobi; ‘ka’ bụ ụzọ ebumpụta ụwa e si egosi nke a n’Igbo.
- source_word: διαμαρτύρηται
  choice: ọ gbaara ha àmà siri ike
  rationale: διαμαρτύρομαι nwere ike ịpụta ịgba àmà n’ụzọ siri ike ma ọ bụ ịdọ aka ná ntị n’ụzọ siri ike. Nhọrọ a debere echiche ịgba àmà ma gosikwa ịdị arọ na ngwa ngwa ya.
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: ka ha onwe ha ghara ịbịakwa
  rationale: ‘ka ... ghara’ na-egosi ebumnobi na-adịghị mma nke ἵνα μή, ebe ‘onwe ha’ na ‘-kwa’ na-ebute ike nke καὶ αὐτοί, ya bụ, ka ha sokwa ghara ịbịa.
- source_word: εἰς τὸν τόπον τοῦτον τῆς βασάνου
  choice: n’ebe ahụhụ a
  rationale: εἰς na-egosi ebe a na-aga, ebe βάσανος na-egosi ahụhụ dị ukwuu. ‘Ebe ahụhụ a’ bụ Igbo dị nkenke ma ghara ịgbakwunye nkọwa nkà mmụta okpukpe na-adịghị n’amaokwu ahụ.
theological_decisions:
- issue: Nkọwa ebe onye ọgaranya na-ekwu banyere ya mgbe mmadụ nwụsịrị
  choice: ebe ahụhụ a
  alternative: ebe nhụjuanya a
  rationale: βάσανος na-egosi ahụhụ ma ọ bụ ihe mgbu siri ike. Nsụgharị a na-edebe ịdị arọ nke okwu ahụ n’enweghị ịkọwa ebe ahụ karịa ihe amaokwu a kwuru.
- issue: Ma a ga-asụgharị διαμαρτύρηται dị ka ịgba àmà ma ọ bụ ịdọ aka ná ntị
  choice: ọ gbaara ha àmà siri ike
  alternative: ọ dọọ ha aka ná ntị siri ike
  rationale: Okwu Grik ahụ nwere ohere nghọta abụọ ahụ. Isi ederede na-edebe echiche ịgba àmà, ebe ihe odide ala peeji na-egosi nghọta nke ịdọ aka ná ntị, ka e wee ghara ihichapụ mgbagwoju anya dị n’isi mmalite.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ebumnobi abụọ nke Grik site n’iji ‘ka ... ka ... ghara,’ ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa karịrị ihe amaokwu ahụ kwuru.
