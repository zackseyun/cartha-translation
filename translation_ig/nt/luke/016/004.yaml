revisions:
- from: Amaara m ihe m ga-eme, ka ọ ga-abụ, mgbe a napụrụ m ọrụ ilekọta akụnụba ahụ,[a] ha anabata m n’ụlọ ha.
  to: Ama m ihe m ga-eme, ka, mgbe a napụrụ m n’ọrụ nlekọta a,[a] ha nabata m n’ụlọ ha.
  rationale: 'The revision replaces an awkward purpose expression with idiomatic Standard Igbo while retaining the Greek sequence: realization, plan, purpose, future removal from an office, and hoped-for hospitality. It also renders οἰκονομία as the office of management rather than as wealth management. The footnote retains the legitimate alternative of dismissal from the stewardship.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the steward’s realization, intended action, removal from office, and hoped-for reception into others’ homes. However, “ka ọ ga-abụ, mgbe” does not naturally or clearly express the Greek purpose-plus-future-contingency construction (ἵνα ὅταν), and “ọrụ ilekọta akụnụba ahụ” can suggest management of wealth rather than the office of household administration.
  naturalness: “Amaara m” is understandable but less direct and idiomatic here than “Ama m.” The phrase “ka ọ ga-abụ, mgbe” is awkward in Standard Igbo. Recasting the purpose clause as “ka, mgbe …, ha nabata m …” is natural and preserves the intended result.
  terminology: “ọrụ nlekọta” suitably renders οἰκονομία as an administrative/stewardly office without importing a theological sense. “Nabata m n’ụlọ ha” appropriately renders δέξωνταί με εἰς τοὺς οἴκους ἑαυτῶν.
  issues:
  - severity: medium
    issue: The rendering “ka ọ ga-abụ, mgbe” is an unnatural and imprecise rendering of ἵνα ὅταν.
    rationale: The Greek marks the purpose of the steward’s plan and the future contingency of his removal. In this context, “ka, mgbe …, ha nabata m …” clearly expresses that intended outcome.
  - severity: low
    issue: “ọrụ ilekọta akụnụba ahụ” is potentially too narrow or misleading for οἰκονομία.
    rationale: The term denotes the stewardship/office of management, not specifically the management of wealth. “ọrụ nlekọta a” retains the occupational sense.
  revised_text: Ama m ihe m ga-eme, ka, mgbe a napụrụ m n’ọrụ nlekọta a,[a] ha nabata m n’ụlọ ha.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe a chụrụ m n’ọrụ nlekọta a.”
    reason: lexical_alternative
  revision_rationale: 'The revision replaces an awkward purpose expression with idiomatic Standard Igbo while retaining the Greek sequence: realization, plan, purpose, future removal from an office, and hoped-for hospitality. It also renders οἰκονομία as the office of management rather than as wealth management. The footnote retains the legitimate alternative of dismissal from the stewardship.'
