source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: ig
  text: Ama m ihe m ga-eme, ka, mgbe a napụrụ m n’ọrụ nlekọta a,[a] ha nabata m n’ụlọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe a chụrụ m n’ọrụ nlekọta a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνων
  choice: Amaara m
  rationale: Aorist a na-egosi na onye nlekọta ahụ eruola n’ịmata ma kpebie ihe ọ ga-eme; okwu a bụ ụzọ Igbo dị mfe isi gosipụta nghọta ahụ o nwetara ugbu a.
- source_word: τί ποιήσω
  choice: ihe m ga-eme
  rationale: Nke a na-egosipụta ajụjụ echiche nke ghọrọ atụmatụ o kpebiri ime; “ihe m ga-eme” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: ἵνα ὅταν
  choice: ka ọ ga-abụ, mgbe
  rationale: Nke a na-edobe ma ebumnuche atụmatụ ya ma ihe a na-atụ anya na ọ ga-eme n’ọdịnihu.
- source_word: μετασταθῶ
  choice: a napụrụ m
  rationale: Passive nke μεθίστημι ebe a pụtara iwepụ mmadụ n’ọkwa ma ọ bụ ọrụ ya; “a napụrụ m” na-egosi nke ahụ n’enweghị ịgbakwunye nkọwa na-adịghị na isi mmalite.
- source_word: ἐκ τῆς οἰκονομίας
  choice: ọrụ ilekọta akụnụba ahụ
  rationale: οἰκονομία ebe a bụ ọrụ ijikwa ihe onwunwe na ihe omume ụlọ nna ukwu, ọ bụghị “akụ na ụba” n’echiche ọgbara ọhụrụ.
- source_word: δέξωνταί με
  choice: ha anabata m
  rationale: δέχομαι nwere ike ịbụ ịnabata ma ọ bụ ịnabata nke ọma; “anabata m” na-echekwa echiche ile ọbịa ahụ n’etinyeghị mmetụta ịhụnanya karịrị ihe ederede kwuru.
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: n’ụlọ ha
  rationale: N’ọnọdụ a οἶκος na-ezo aka n’ebe obibi nke ndị ahụ; nnọchiaha “ha” na-egosipụta reflexive ἑαυτῶν n’ụzọ Igbo nkịtị.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ọrụ ilekọta akụnụba ahụ” iji kọwaa ọrụ onye na-elekọta ihe nna ukwu n’enweghị iji okwu nwere ụda okpukpe pụrụ iche. Ihe akara nkọwa ala peeji [a] dị n’isi ederede.
