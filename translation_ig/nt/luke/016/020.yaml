review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents πτωχὸς, the indefinite introduction, Lazarus’s name, the passive pluperfect sense of ἐβέβλητο, and the location at the rich man’s gate. “A tọgbọworo” suitably conveys that others placed him there without overstating the force as violent throwing. The final clause should more directly express the participial state, however: “ọnya juru ya ahụ” is more idiomatic and does not introduce the additive nuance of -kwara.'
  naturalness: The principal sentence is clear Standard Igbo. Recasting the final phrase as “ọnya juru ya ahụ” is more natural. Footnote a contains an awkward repetition in “nleghara anya e leghaara ya”; this should be simplified.
  terminology: “Ogbenye,” “Lazarọs,” and “ọnụ ụzọ ámá” are appropriate. “Ọnya” is a suitable general rendering for εἱλκωμένος; the note may mention sores or ulcers without diagnosing their cause or severity.
  issues:
  - severity: low
    issue: The phrase “ọnya jukwara ya ahụ” has an unnecessary/additive -kwara and is less idiomatic for the Greek participial description.
    rationale: εἱλκωμένος describes Lazarus as being full of or afflicted with sores. “Ọnya juru ya ahụ” naturally conveys this state.
  - severity: low
    issue: Footnote a’s wording “nleghara anya e leghaara ya” is repetitive and awkward.
    rationale: The intended sense is neglect of Lazarus; “nleghara anya a na-eleghara ya” communicates it naturally.
  - severity: low
    issue: Footnote b calls the sores “ọnya ọjọọ.”
    rationale: The Greek denotes sores/ulcers but does not independently characterize them as especially severe. Neutral wording better preserves the source.
  revised_text: Ma otu ogbenye aha ya bụ Lazarọs ka a tọgbọworo n'ọnụ ụzọ ámá nwoke ahụ bara ọgaranya[a]; ọnya juru ya ahụ[b].
