base_translation:
  language: en
  yaml_path: translation/nt/luke/016/020.yaml
  text: And a poor man named Lazarus had been laid at his gate[a], covered with sores[b],
translation:
  language: ig
  text: Ma otu ogbenye aha ya bụ Lazarọs ka a tọgbọworo n'ọnụ ụzọ ámá nwoke ahụ bara ọgaranya[a]; ọnya juru ya ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka a tụpụworo n'ọnụ ụzọ ámá ya.” Ngwaa Grik ahụ nwere ike ịpụta ịtụ ma ọ bụ ịtụpụ, nke nwere ike ime ka enweghị ike Lazarọs na nleghara anya a na-eleghara ya pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọnya kpuchiri ya ahụ.” Partisipụl Grik ahụ na-egosi na ọnya ma ọ bụ etuto juru Lazarọs ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: ogbenye
  rationale: Ọ na-egosi onye dara ogbenye ma ọ bụ onye nọ ná mkpa; “ogbenye” bụ okwu Igbo doro anya nke na-adịghị agbakwụnye kpọmkwem na ọ bụ onye arịrịọ.
- source_word: τις
  choice: otu
  rationale: N'okwu a, τις na-ewebata onye ọhụrụ; “otu ogbenye” bụ ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa.
- source_word: ὀνόματι Λάζαρος
  choice: aha ya bụ Lazarọs
  rationale: Nke a na-enye ihe dative ahụ pụtara n'Igbo dị ugbu a ma na-edobe aha onye ahụ site n'ịtụgharị ụda ya.
- source_word: ἐβέβλητο
  choice: ka a tọgbọworo
  rationale: Ụdị pluperfect passive a na-egosi na ndị ọzọ tinyere ya ebe ahụ, ma ọ nọgide n'ọnọdụ ahụ; “tọgbọworo” na-edobe echiche nke enweghị ike inyere onwe ya n'enweghị ime ka okwu ahụ sie ike karịa ihe ọnọdụ a chọrọ.
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: n'ọnụ ụzọ ámá nwoke ahụ bara ọgaranya
  rationale: πυλών bụ ọnụ ụzọ ámá ma ọ bụ ụzọ mbata nke ụlọ ukwu. Ịkọwapụta na nnọchiaha αὐτοῦ na-ezo aka n'ebe nwoke ahụ bara ọgaranya bi na-ewepụ mgbagwoju anya nke nnọchiaha Igbo n'amaokwu a e bipụtara iche.
- source_word: εἱλκωμένος
  choice: ọnya jukwara ya ahụ
  rationale: Ọ na-egosi na ọnya ọjọọ ma ọ bụ ọnya etuto na-emekpa ya ahụ; okwu a bụ Igbo doro anya ma na-eburu echiche nke “full of sores” nke ọma.
