translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ọnụ ụzọ ámá” maka nnukwu ụzọ mbata, “tọgbọworo” iji debe passive na ọnọdụ na-aga n'ihu, ma tinye ụzọ okwu ndị siri ike ma ọ bụ ndị ọzọ kwe omume n'ala ala peeji.
