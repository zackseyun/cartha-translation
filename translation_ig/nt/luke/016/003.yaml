review_pass:
  verdict: revise
  source_fidelity: The draft conveys the manager’s internal deliberation, the removal of his office, and the contrast between hard labor and begging. However, the initial expression for οἰκονόμος is unnecessarily expanded and syntactically awkward, and the wording for the office should more clearly correspond to the person term, as the Greek cognates do.
  naturalness: “Onye ahụ na-elekọta ihe nna ya ukwu” is heavy and less natural than the established, concise “onye nlekọta.” The possessive order “nna ya ukwu” is also less idiomatic here than “nna ukwu ya.” “Ihere na-emekwa m” is understandable, but “ihere na-eme m” is more natural in this construction.
  terminology: “Onye nlekọta” and “ọrụ nlekọta” provide a clear modern pairing for οἰκονόμος and οἰκονομία without importing a theological sense. “Nna ukwu ya” appropriately renders the human κύριος in the parable. “Ịrịọ arịrịọ” retains the sense of begging.
  issues:
  - severity: medium
    issue: The rendering of οἰκονόμος is overexpanded and awkward.
    rationale: “Onye ahụ na-elekọta ihe nna ya ukwu” burdens the subject with information supplied more naturally by context and does not pair as cleanly with the office term. “Onye nlekọta” is concise, idiomatic, and permits a cognate rendering of οἰκονομία.
  - severity: low
    issue: Possessive order in “nna ya ukwu” is less natural.
    rationale: “Nna ukwu ya” is the more idiomatic Standard Igbo form for “his master.”
  - severity: low
    issue: The office/person cognate relationship is not fully maintained in the main text.
    rationale: The Greek deliberately uses related terms. “Onye nlekọta” / “ọrụ nlekọta” preserves this relationship clearly.
