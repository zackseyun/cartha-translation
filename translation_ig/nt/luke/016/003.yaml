revisions:
- from: Mgbe ahụ, onye ahụ na-elekọta ihe nna ya ukwu kwuru n’obi ya[a], “Gịnị ka m ga-eme, ebe ọ bụ na nna m ukwu na-anapụ m ọrụ ilekọta ihe ya? Enweghị m ike igwu ala, ihere na-emekwa m ịrịọ arịrịọ.”
  to: Mgbe ahụ, onye nlekọta ahụ kwuru n’obi ya[a], “Gịnị ka m ga-eme, ebe ọ bụ na nna ukwu m na-anapụ m ọrụ nlekọta ahụ? Enweghị m ume igwu ala; ihere na-eme m ịrịọ arịrịọ.”
  rationale: The revision uses the natural Standard Igbo pair “onye nlekọta” and “ọrụ nlekọta” to reflect the Greek cognates while retaining the socioeconomic sense of a manager and his entrusted office. It also uses the idiomatic possessive “nna ukwu m,” makes the physical-strength implication of οὐκ ἰσχύω explicit with “Enweghị m ume,” and smooths the final clause without changing its meaning. The footnote remains anchored to the internal-speech expression and continues to document the household-manager/steward lexical alternative.
