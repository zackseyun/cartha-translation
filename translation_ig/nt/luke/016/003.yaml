id: LUK.16.3
reference: Luke 16:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: ig
  text: Mgbe ahụ, onye nlekọta ahụ kwuru n’obi ya[a], “Gịnị ka m ga-eme, ebe ọ bụ na nna ukwu m na-anapụ m ọrụ nlekọta ahụ? Enweghị m ume igwu ala; ihere na-eme m ịrịọ arịrịọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu ndị Grik e ji kpọọ onye ahụ na ọrụ ya dịka “onye na-elekọta ụlọ” na “ọrụ nlekọta ụlọ.” Okwu Grik abụọ ahụ sitere n’otu mgbọrọgwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκονόμος
  choice: onye ahụ na-elekọta ihe nna ya ukwu
  rationale: N’ọnọdụ ilu a, okwu ahụ na-ezo aka n’onye e nyere ọrụ ilekọta akụ na ihe onye ọzọ. Nkebiokwu a doro ndị na-agụ Igbo nke oge a anya ma gosi mmekọrịta dị n’etiti ya na nna ya ukwu.
- source_word: ἐν ἑαυτῷ
  choice: kwuru n’obi ya
  rationale: Nke a bụ ụzọ Igbo si egosi okwu mmadụ kwuru naanị n’ime onwe ya, ya bụ ntụgharị uche dị n’obi.
- source_word: Τί ποιήσω
  choice: Gịnị ka m ga-eme
  rationale: Ajụjụ a na-egosi na ọ na-atụle ihe ọ ga-eme n’ọdịnihu.
- source_word: κύριός μου
  choice: nna m ukwu
  rationale: N’ebe a, κύριος bụ mmadụ nwere ikike n’ebe onye na-elekọta ihe ya nọ, ọ bụghị utu aha Chineke. “Nna m ukwu” na-egosi ikike ahụ n’Igbo n’enweghị ụda nke aha nsọ.
- source_word: ἀφαιρεῖται
  choice: na-anapụ m
  rationale: Okwu a na-egosi iwepụ ọrụ ma ọ bụ ihe dị n’aka mmadụ; “na-anapụ m” na-echekwa ike nke ngwaa ahụ na ἀπ’ ἐμοῦ.
- source_word: οἰκονομίαν
  choice: ọrụ ilekọta ihe ya
  rationale: Aha a na-ezo aka n’ọrụ na ibu ọrụ nke ilekọta ihe nna ukwu, ọ bụghị naanị echiche izugbe banyere nhazi.
- source_word: σκάπτειν
  choice: igwu ala
  rationale: Nke a bụ ntụgharị nkịtị na nke doro anya maka ọrụ aka siri ike a kpọrọ aha.
- source_word: οὐκ ἰσχύω
  choice: Enweghị m ike
  rationale: N’ihi na okwu ahụ metụtara igwu ala, ọ pụtara enweghị ume ma ọ bụ ike zuru ezu; Igbo a na-anụkarị na-eburu echiche ahụ n’enweghị ịgbakwunye ihe ederede ekwughị kpọmkwem.
- source_word: ἐπαιτεῖν
  choice: ịrịọ arịrịọ
  rationale: Nkebiokwu a pụtara ịrịọ ndị ọzọ ihe e ji ebi ndụ ma ọ bụ enyemaka, ma dịkwa mma n’Igbo.
- source_word: αἰσχύνομαι
  choice: ihere na-emekwa m
  rationale: Nke a na-egosi ihere ọ na-enwe mgbe ọ na-eche banyere ịrịọ arịrịọ.
theological_decisions:
- issue: Ntụgharị κύριος n’ọnọdụ ilu ebe ọ na-abụghị aha Chineke
  choice: nna m ukwu
  alternative: Onyenwe m
  rationale: Onye okwu ahụ na-ezo aka na ya bụ ọgaranya nwe onye nlekọta ahụ ma nwee ikike n’ebe ọ nọ. “Nna m ukwu” na-echekwa mmekọrịta ikike ahụ, ebe “Onyenwe m” nwere ike ime ka ndị na-agụ ya chee na ọ bụ aha Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A họọrọ nkebiokwu nkọwa kama otu aha teknụzụ na-adịghị adịkarị n’okwu ndị mmadụ, ma debe njikọ dị n’etiti onye nlekọta ahụ na ọrụ ya site n’iji “ilekọta” n’ebe abụọ ahụ.
