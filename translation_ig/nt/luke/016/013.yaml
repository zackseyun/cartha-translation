review_pass:
  verdict: revise
  source_fidelity: 'The verse is rendered faithfully overall: οἰκέτης is appropriately represented by “odibo ụlọ,” the two-master antithesis and both paired responses are retained, and the final plural address (“Unu apụghị”) reflects δύνασθε. “Mamon” appropriately maintains the rhetorical personification of μαμωνᾷ.'
  naturalness: The main text is clear, idiomatic Standard Igbo, with an appropriately formal scriptural register. “Ịkpọ asị,” “ịhụ n’anya,” “ịrapara n’otu,” and “ileda ... anya” communicate the contrasts naturally.
  terminology: “Chineke,” “nna ukwu,” and “Mamon” are suitable. The footnote, however, inaccurately calls Mammon a word from “asụsụ ndị Juu”; it is an Aramaic (more broadly Semitic) loanword. Its description also needs smoother wording that identifies riches as rhetorically personified as a rival master, without suggesting a literal title or doctrine.
  issues:
  - severity: medium
    issue: 'Footnote etymology: “okwu sitere n’asụsụ ndị Juu.”'
    rationale: μαμωνᾶς is a loanword from Aramaic, not accurately described as coming from “the language of the Jews.” The note should identify it as Aramaic (or, less specifically, Semitic).
  - severity: low
    issue: 'Footnote wording: “mee ihe n’ebe a dịka aha nna ukwu na-azọ ọchịchị.”'
    rationale: This wording is somewhat unnatural and can imply that Mamon literally bears a master’s title. The Greek’s effect is better represented by saying that riches are portrayed/personified as a rival master.
  revised_text: Ọ dịghị odibo ụlọ pụrụ ijere nna ukwu abụọ ozi; n’ihi na ọ ga-akpọ otu asị ma hụ nke ọzọ n’anya, ma ọ bụ ọ ga-arapara n’otu ma leda nke ọzọ anya. Unu apụghị ijere Chineke na Mamon[a] ozi.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ “akụ na ụba” ma ọ bụ “ego.” Grik ji Mamon, okwu mbinye sitere n’asụsụ Aramaik nke pụtara akụ, mee ihe n’ebe a, na-eme ka akụ dị ka nna ukwu na-azọ Chineke ọchịchị.
    reason: lexical_alternative
