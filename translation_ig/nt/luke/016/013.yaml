id: LUK.16.13
reference: Luke 16:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: ig
  text: Ọ dịghị odibo ụlọ pụrụ ijere nna ukwu abụọ ozi; n’ihi na ọ ga-akpọ otu asị ma hụ nke ọzọ n’anya, ma ọ bụ ọ ga-arapara n’otu ma leda nke ọzọ anya. Unu apụghị ijere Chineke na Mamon[a] ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “akụ na ụba” ma ọ bụ “ego.” Grik ji Mamon, okwu mbinye sitere n’asụsụ Aramaik nke pụtara akụ, mee ihe n’ebe a, na-eme ka akụ dị ka nna ukwu na-azọ Chineke ọchịchị.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: odibo ụlọ
  rationale: Okwu a na-ezo aka n’odibo nọ n’ezinụlọ ma ọ bụ n’ụlọ nna ya ukwu. “Odibo ụlọ” na-edobe ọnọdụ ụlọ ahụ na mmekọrịta odibo na nna ukwu n’enweghị ịgbasa ya ka ọ bụrụ naanị onye ọrụ nkịtị.
- source_word: κυρίοις
  choice: nna ukwu
  rationale: N’ebe a, okwu ahụ pụtara ndị nwere ikike n’ebe odibo nọ. “Nna ukwu” bụ okwu Igbo doro anya maka onye odibo na-ejere ozi.
- source_word: δουλεύειν
  choice: ijere ... ozi
  rationale: Nkebiokwu a na-egosi ije ozi n’okpuru ikike onye ọzọ. Ọ bụkwa okwu Igbo sitere n’ọnụ mmadụ nke na-arụ ọrụ nke ọma ma n’ihe banyere nna ukwu mmadụ ma n’ihe banyere Chineke na Mamon.
- source_word: μισήσει
  choice: ga-akpọ ... asị
  rationale: A hapụrụ ike nkịtị nke okwu Grik ahụ, ya bụ ịkpọ asị, kama ime ka ọ dị nro dịka naanị ịhụ otu n’anya karịa ibe ya.
- source_word: ἀγαπήσει
  choice: hụ ... n’anya
  rationale: Nke a bụ ụzọ Igbo kwesịrị ekwesị isi kwuo ịhụnanya, ma ọ na-edobe ọdịiche siri ike dị n’etiti ịhụ n’anya na ịkpọ asị.
- source_word: ἀνθέξεται
  choice: ga-arapara n’otu
  rationale: Okwu a na-egosi ijidesi otu onye ike ma ọ bụ iguzosi ike n’akụkụ ya. “Ịrapara n’otu” na-egosipụta nkwụsi ike na nrubeisi n’asụsụ Igbo dị mfe.
- source_word: καταφρονήσει
  choice: leda ... anya
  rationale: Nkebiokwu Igbo a na-egosi ile mmadụ anya nlelị ma ọ bụ ịghara ịkwanyere ya ùgwù, nke kwekọrọ n’ike okwu Grik.
- source_word: θεῷ
  choice: Chineke
  rationale: Nke a bụ ntụgharị Igbo doro anya na nke a na-ejikarị eme ihe maka θεός n’ebe a.
- source_word: μαμωνᾷ
  choice: Mamon
  rationale: E debere aha mbinye “Mamon” iji chekwaa otú amaokwu ahụ si mee akụ na ụba ka ọ dị ka nna ukwu ọzọ na-azọ ọchịchị megide Chineke. Ihe e dere n’ala ala peeji na-akọwa ihe okwu ahụ pụtara.
theological_decisions:
- issue: Otu e si tụgharịa μαμωνᾷ mgbe e mere ka ọ bụrụ onye na-azọ ọchịchị megide Chineke
  choice: Mamon
  alternative: akụ na ụba; ego
  rationale: “Mamon” na-edobe oyiyi okwu ahụ nke na-egosi akụ dịka nna ukwu na-achọ nrubeisi. Nke a apụtaghị na Mamon bụ chi n’ezie; ọ bụ ụzọ okwu si mee akụ ka ọ dị ka onye nwere ike ịchị mmadụ.
- issue: Onye a na-ekwu maka ya n’ahịrị ndị dị n’etiti amaokwu ahụ
  choice: ọ ga-akpọ ... ọ ga-arapara
  alternative: odibo ahụ ga-akpọ ... odibo ahụ ga-arapara
  rationale: Grik ji onye nke atọ otu n’ọnụọgụ mee ihe n’ụzọ na-anọchi anya odibo ọ bụla. Nnọchiaha Igbo “ọ” na-edobe otu n’ọnụọgụ ahụ n’enweghị itinye nkọwa ọzọ na-adịghị na isi mmalite.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dịkwa mfe nghọta. “Odibo ụlọ” na-edobe ọnọdụ ụlọ nke οἰκέτης; “nna ukwu” na “ijere ... ozi” na-eme ka oyiyi nke ndị nna ukwu abụọ doo anya. E tinyere akara [a] ozugbo n’azụ “Mamon,” okwu akara ala peeji ahụ na-akọwa.
