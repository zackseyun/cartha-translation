  text: Ἤκουον δὲ ταῦτα ⸀πάντα οἱ Φαρισαῖοι φιλάργυροι ὑπάρχοντες, καὶ ἐξεμυκτήριζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/014.yaml
  text: The Pharisees[a], who were lovers of money, were hearing all these things and were ridiculing him.
translation:
  language: ig
  text: Ndị Farisii, bụ ndị hụrụ ego n’anya, nọ na-anụ ihe ndị a niile ma na-akwa ya emo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤκουον
  choice: nọ na-anụ
  rationale: Oge imperfect na-egosi omume na-aga n’ihu n’oge ahụ; “nọ na-anụ” na-egosipụta nke a n’Igbo dị mfe.
- source_word: δὲ
  choice: ejighị okwu pụrụ iche sụgharịa ya
  rationale: N’ebe a δέ bụ njikọ akụkọ dị nro. Nhazi ahịrịokwu Igbo na-egosi ntụgharị ahụ nke ọma n’enweghị itinye “ma” nke nwere ike ime ka ọdịiche ahụ sie ike karịa nke Grik.
- source_word: ταῦτα πάντα
  choice: ihe ndị a niile
  rationale: Nke a na-ezo aka n’ozizi niile Jizọs kwuru tupu amaokwu a.
- source_word: οἱ Φαρισαῖοι
  choice: Ndị Farisii
  rationale: Nke a bụ aha a na-ejikarị akpọ òtù ndị Juu ahụ n’Igbo.
- source_word: φιλάργυροι ὑπάρχοντες
  choice: bú ndị hụrụ ego n’anya
  rationale: Ọ na-akọwa àgwà ha dị ka ịhụ ego n’anya, kama iji okwu sara mbara dị ka “ndị anyaukwu,” nke ga-agbakwụnye nkọwa.
- source_word: ἐξεμυκτήριζον
  choice: ha na-akwa ya emo
  rationale: Imperfect na-egosi omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro; “ịkwa emo” na-egosi ịchị mmadụ ọchị n’ụzọ nlelị ma bụrụ okwu ndị Igbo na-aghọta ngwa ngwa.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka ihe omume ahụ metụtara.
theological_decisions:
- issue: Nkọwa mmehie ndị Farisii n’okwu φιλάργυροι
  choice: ndị hụrụ ego n’anya
  alternative: ndị anyaukwu
  rationale: Grik ahụ kwuru kpọmkwem banyere ịhụ ego n’anya. Nhọrọ a na-echekwa njikọ ya na ozizi Jizọs banyere akụnụba ma ghara ịgbasa ihe okwu ahụ pụtara karịa isi mmalite.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara mmegharị nke imperfect site n’iji “nọ na-anụ” na “na-akwa.”
