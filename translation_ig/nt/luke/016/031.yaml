id: LUK.16.31
reference: Luke 16:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: ig
  text: Ma ọ sịrị ya, “Ọ bụrụ na ha anaghị ege Mosis na Ndị Amụma ntị[a], ha agaghịkwa ekwenye[c], ọ bụrụgodị na mmadụ si ná ndị nwụrụ anwụ bilie[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha anaghị anụ Mosis na Ndị Amụma” ma ọ bụ “ha anaghị erube isi n'okwu Mosis na Ndị Amụma.” Okwu Grik ahụ pụrụ ịgụnye ma ịnụ ihe ma ilebara ya anya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n'etiti ndị nwụrụ anwụ bilie.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “agaghị ekweta” ma ọ bụ “agaghị eme ka e kwenye.” Okwu Grik ahụ pụtara ịbụ onye e mere ka o kwenye ma ọ bụ ịnabata ihe dị ka eziokwu; ọ pụtaghị n'ụzọ kpọmkwem okwukwe nzọpụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Ma ọ sịrị ya
  rationale: ‘Ma’ na-egosipụta obere ntụgharị ma ọ bụ mmegide nke δέ n'okwu mkparịta ụka ahụ; ‘ọ sịrị ya’ bụ Igbo nkịtị maka εἶπεν αὐτῷ.
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: Mosis na Ndị Amụma
  rationale: A hapụrụ aha ọdịnala a dịka ụzọ ndị Juu si ezo aka n'ịgba-ama Akwụkwọ Nsọ, karịchaa Iwu na Ndị Amụma, kama ịkọwa ya ozugbo dịka ‘Akwụkwọ Nsọ.’
- source_word: οὐκ ἀκούουσιν
  choice: ha egeghị ... ntị
  rationale: ‘Ige ntị’ na-ejikọta ịnụ ihe na ilebara ya anya, na-enweghị ịkọwapụta ya gabiga ókè dịka nrubeisi zuru ezu.
- source_word: οὐδ’ ἐάν
  choice: a gaghịkwa ... ọ bụrụgodị na
  rationale: 'Usoro a na-echekwa ike nke nkwusioru ahụ: ọbụna ọnọdụ pụrụ iche e kwuru agaghị eme ka nsonaazụ ahụ gbanwee.'
- source_word: τις
  choice: mmadụ
  rationale: Ọ bụ nnọchiaha otu onye a na-akọwaghị kpọmkwem; ‘mmadụ’ bụ okwu Igbo dị mfe ma kwekọọ na ya.
- source_word: ἐκ νεκρῶν
  choice: esi n'etiti ndị nwụrụ anwụ
  rationale: Nke a na-eme ka echiche ἐκ, ya bụ isi n'etiti ìgwè ndị nwụrụ anwụ pụta, ma ka bụrụkwa Igbo a ghọtara nke ọma.
- source_word: ἀναστῇ
  choice: bilie
  rationale: ‘Bilie’ bụ okwu dị mfe ma bụrụ nke a na-ejikarị ekwu maka ibili n'ọnwụ; ọnọdụ ‘ọ bụrụgodị na’ na-eburu echiche subjunctive ahụ.
- source_word: πεισθήσονται
  choice: a gaghịkwa eme ka ha kwenye
  rationale: Usoro a na-echekwa ọdịdị passive na echiche nke ịbụ ndị e mere ka ha kwenye, na-enweghị ime ka ọ pụta kpọmkwem dịka okwukwe nzọpụta ma ọ bụ nchegharị.
theological_decisions:
- issue: Ihe ‘Mosis na Ndị Amụma’ pụtara
  choice: E debere akpaalaokwu ahụ dịka ntụaka nye ịgba-ama Akwụkwọ Nsọ e nyeworo Izrel
  alternative: Ịsụgharị ya ozugbo dịka ‘Akwụkwọ Nsọ,’ ma ọ bụ were ya dịka naanị mmadụ abụọ nọchiri anya onwe ha
  rationale: N'ọnọdụ a, akpaalaokwu ahụ na-ezo aka n'ịgba-ama Iwu na Ndị Amụma. Idebe okwu mbụ ahụ na-ahapụ onye na-agụ ya ka ọ nụ ụzọ e si kwuo ya na mbụ, n'ebughị nkọwa banye n'ahịrịokwu ahụ.
- issue: Ike πεισθήσονται
  choice: Ime ka mmadụ kwenye n'ozuzu ya
  alternative: ‘Ha agaghị ekwere’ ma ọ bụ ‘ha agaghị echegharị’
  rationale: πείθω na-ekwu maka ikwenye ma ọ bụ ime ka e kwenye; ‘ikwere’ n'echiche okwukwe nzọpụta ma ọ bụ ‘ichegharị’ ga-etinye nkọwa okpukpe kpọmkwem nke okwu Grik ahụ n'onwe ya ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘Mosis’ na ‘Ndị Amụma’ mee ka okwu ahụ na-ezo aka n'ìgwè Akwụkwọ Nsọ ahụ n'ụzọ doro anya. E tinyere akara ndetu ụkwụ niile [a], [b] n'ime isi ederede.
