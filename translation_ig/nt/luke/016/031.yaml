revisions:
- from: Ma ọ sịrị ya, “Ọ bụrụ na ha egeghị Mosis na Ndị Amụma ntị[a], a gaghịkwa eme ka ha kwenye, ọ bụrụgodị na mmadụ esi n'etiti ndị nwụrụ anwụ bilie[b].”
  to: Ma ọ sịrị ya, “Ọ bụrụ na ha anaghị ege Mosis na Ndị Amụma ntị[a], ha agaghịkwa ekwenye[c], ọ bụrụgodị na mmadụ si ná ndị nwụrụ anwụ bilie[b].”
  rationale: The revision corrects the first clause to a present habitual/general negative, removes the added causative agent from the final passive verb, and adds the missing lexical audit note for πεισθήσονται. It retains the original conditional force, the singular indefinite ‘mmadụ,’ and the established designation ‘Mosis na Ndị Amụma.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:35Z'
review_pass:
  verdict: revise
  source_fidelity: The first condition should express the Greek present-tense general refusal ('do not listen'), not a completed past action. The rendering of πεισθήσονται as 'a gaghị eme ka ha kwenye' adds an unspecified external persuader/causer; the Greek passive denotes their not being persuaded or convinced. 'Ha agaghị ekwenye' conveys this naturally without narrowing it to repentance or saving faith.
  naturalness: The revised wording is idiomatic Standard Igbo and retains the solemn but straightforward dialogue register. 'Ha anaghị ege ... ntị' is the natural ongoing expression, and 'ha agaghị ekwenye' is more direct and natural than the periphrastic causative passive.
  terminology: ‘Mosis na Ndị Amụma’ appropriately preserves the established scriptural designation. ‘Ndị nwụrụ anwụ’ and ‘bilie’ are suitable, natural resurrection language. A lexical note on ‘ekwenye’ is added so that the translation preserves the audit trail’s distinction between persuasion and a narrower theological sense of belief.
  issues:
  - severity: medium
    issue: ‘ha egeghị ... ntị’ uses a completed/perfect negative form.
    rationale: οὐκ ἀκούουσιν is present tense and describes their ongoing failure to listen or heed. ‘Ha anaghị ege ... ntị’ preserves this general present sense.
  - severity: medium
    issue: ‘a gaghịkwa eme ka ha kwenye’ introduces an explicit causative agent.
    rationale: πεισθήσονται is passive (‘they will be persuaded/be convinced’), but the Igbo construction means more specifically that no one will make them agree. ‘Ha agaghị ekwenye’ gives the intended result/state without adding an agent.
  - severity: low
    issue: The first footnote’s alternatives use completed negative forms that do not match the source verb’s present aspect, and no note records the persuasion/convinced sense.
    rationale: Updating note a aligns its alternatives with the verse, while note c documents that ‘ekwenye’ here means being persuaded/convinced rather than necessarily a specifically theological act of faith.
  revised_text: Ma ọ sịrị ya, “Ọ bụrụ na ha anaghị ege Mosis na Ndị Amụma ntị[a], ha agaghịkwa ekwenye[c], ọ bụrụgodị na mmadụ si ná ndị nwụrụ anwụ bilie[b].”
  revised_footnotes:
