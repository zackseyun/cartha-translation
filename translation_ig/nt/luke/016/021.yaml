translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro amaokwu ahụ dịka akụkụ ahịrịokwu na-esochi amaokwu bu ya ụzọ, ma jiri ‘na-’ gosipụta omume na ọchịchọ na-aga n'ihu.
