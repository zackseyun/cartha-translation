  text: καὶ ἐπιθυμῶν χορτασθῆναι ⸀ἀπὸ τῶν πιπτόντων ἀπὸ τῆς τραπέζης τοῦ πλουσίου· ἀλλὰ καὶ οἱ κύνες ἐρχόμενοι ⸀ἐπέλειχον τὰ ἕλκη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/021.yaml
  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: ig
  text: ọ na-achọsi ike ka e nye ya nri site n'ihe na-ada n'okpokoro nwoke ahụ bara ọgaranya[a]. Ma ọbụna nkịta na-abịa na-aracha ọnya ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n'iberibe nri ndị na-ada n'okpokoro nwoke ahụ bara ọgaranya.” N'ụzọ nkịtị, Grik sịrị “site n'ihe na-ada”; a na-aghọta “iberibe nri” site n'ọnọdụ oriri ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: na-achọsikwa ike
  rationale: Ọ na-egosi ọchịchọ siri ike nke na-aga n'ihu; ntụgharị a bụ nke e ji asụ Igbo nke ọma ma na-ejigide ike okwu Grik.
- source_word: χορτασθῆναι
  choice: ka e nye ya nri
  rationale: Ụdị a na-egosi na ọ bụ onye ọzọ ga-enye ya nri, dịka infinitive passive dị na Grik, ma dịkwa mfe nghọta n'Igbo.
- source_word: ἀπὸ τῶν πιπτόντων
  choice: site n'ihe na-ada
  rationale: A hapụrụ okwu ahụ n'obosara dịka Grik si kwuo ya, kama itinye ‘iberibe nri’ n'ahụ amaokwu ahụ; ọnọdụ oriri na-egosi na nri ka a na-ekwu maka ya.
- source_word: τῆς τραπέζης τοῦ πλουσίου
  choice: n'okpokoro nwoke ahụ bara ọgaranya
  rationale: Nke a na-egosi tebụl nri na nwoke bara ọgaranya a kpọtụrụ aha n'akụkọ ahụ.
- source_word: ἀλλὰ καὶ
  choice: Ma ọbụna
  rationale: Ọ na-ejigide ma ntụgharị echiche ahụ ma ihe ijuanya e mesiri ike na njikọ okwu Grik.
- source_word: οἱ κύνες
  choice: nkịta
  rationale: Nke a bụ ntụgharị nkịtị nke aha ọtụtụ ahụ; e tinyeghị nkọwa ọzọ nke isi mmalite ahụ na-ekwughị.
- source_word: ἐρχόμενοι ἐπέλειχον
  choice: na-abịa aracha
  rationale: Usoro ngwaa ‘na-’ na-egosi omume na-aga n'ihu ma ọ bụ na-eme ugboro ugboro, kwekọọ na participle na imperfect nke Grik.
- source_word: τὰ ἕλκη αὐτοῦ
  choice: ọnya ya
  rationale: ‘Ọnya’ bụ okwu Igbo nkịtị ma doo anya maka ọnya mepere emepe ma ọ bụ ọnya ahụ na-adịghị ala ala e zoro aka na ya.
