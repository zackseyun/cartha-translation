  - severity: low
    issue: The parallel marker for ὁμοίως is slightly less clear in “Lazarọs natakwa.”
    rationale: “Lazarọs kwa natara” more directly marks Lazarus as the corresponding member of the contrast while retaining natural Igbo word order.
