review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Greek contrast: Abraham addresses the man tenderly, calls him to remember his lifetime reception of good things, sets Lazarus'' adverse experiences in parallel, and contrasts Lazarus'' present comfort with the man''s anguish. The temporal force of ἐν τῇ ζωῇ σου is retained, and ὧδε is represented by “n''ebe a.”'
  naturalness: “Ihe ọma ndị nke gị” is understandable but is not idiomatic Standard Igbo. “Ihe ọma gị” expresses the same possessive sense naturally. Also, placing “kwa” directly after “Lazarọs” makes the parallel expressed by ὁμοίως clearer than attaching it to the verb.
  terminology: “Nwa m” is an idiomatic, compassionate Igbo vocative for Τέκνον and need not assert literal kinship. “A na-akasi ya obi” appropriately renders παρακαλεῖται. “Ị nọ n'oké ihe mgbu” suitably conveys ὀδυνᾶσαι without imposing a more specific doctrinal interpretation. The alternative footnotes remain lexically appropriate.
