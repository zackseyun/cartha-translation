source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: ig
  text: Ma Ebreham sịrị, “Nwa m, cheta na n'oge ndụ gị, ị natara ihe ọma gị[a], Lazarọs kwa natara ihe ọjọọ. Ma ugbu a, a na-akasi ya obi n'ebe a, ebe gị onwe gị nọ n'oké ihe mgbu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ị natara ihe ọma gị n'uju.” Ngwaa Grik ahụ nwere ike ịpụta ịnata ihe e kenyere mmadụ ma ọ bụ ịnata ya n'uju.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a na-ata gị ahụhụ.” Okwu Grik ahụ nwere ike ịpụta nnukwu ihe mgbu ma ọ bụ nhụjuanya siri ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: Nwa m
  rationale: Ọ bụ okwu a na-eji kpọọ mmadụ n'ụzọ ọmịiko ma ọ bụ dịka onye okenye si akpọ onye nta; ọ pụtaghị na ọ bụ nwa ya n'anụ ahụ. “Nwa m” bụ okwu Igbo dị ndụ ma dị nro.
- source_word: μνήσθητι
  choice: cheta
  rationale: Na-egosipụta iwu ka onye ahụ tụleeghachi ihe mere; “cheta” bụ ụzọ Igbo kacha doo anya ma kwekọọ n'okwu Grik.
- source_word: ἀπέλαβες
  choice: ị natara
  rationale: Ngwaa a nwere ike ịpụta ịnata ihe e kenyere mmadụ ma ọ bụ ịnata ya n'uju. “Ị natara” na-edebe isi echiche ahụ n'amaokwu, ebe nkọwa ala peeji na-echekwa nghọta siri ike karị.
- source_word: τὰ ἀγαθά σου
  choice: ihe ọma ndị nke gị
  rationale: Na-edebe echiche nke ihe ndị bara uru ma ọ bụ tọrọ ụtọ nke bụ nke nwoke ahụ, n'etinyeghị okwu okpukpe pụrụ iche dịka “ngọzi.”
- source_word: ἐν τῇ ζωῇ σου
  choice: n'oge ndụ gị
  rationale: Ọ bụ okwu Igbo ebumpụta ụwa nke na-egosi oge ndụ ya n'ụwa.
- source_word: ὁμοίως
  choice: natakwa
  rationale: Mgbakwunye “-kwa” na-egosipụta njikọ yiri “otu aka ahụ” n'ụzọ dị mkpirikpi ma bụrụ Igbo ebumpụta ụwa.
- source_word: τὰ κακά
  choice: ihe ọjọọ
  rationale: N'ebe a, ọ na-ezo aka n'ahụhụ na ihe ndị na-adịghị mma Lazarọs nwetara, ọ bụghị ajọ omume o mere. Okwu ahụ na-edebe obosara nke Grik.
- source_word: παρακαλεῖται
  choice: a na-akasi ya obi
  rationale: N'ụdị a na ọnọdụ a, ọ pụtara na Lazarọs na-enweta nkasi obi; nsụgharị a doro anya ma dị ndụ n'Igbo.
- source_word: ὧδε
  choice: n'ebe a
  rationale: Na-egosi ebe Ebreham na Lazarọs nọ n'ihe atụ ahụ.
- source_word: ὀδυνᾶσαι
  choice: ị nọ n'oké ihe mgbu
  rationale: Na-egosipụta nnukwu mgbu ma ọ bụ nhụjuanya siri ike, n'etinyeghị nkọwa ozizi karịrị ike okwu Grik ahụ.
theological_decisions:
- issue: Okwu e ji kọwaa ahụhụ mgbe ọnwụ gasịrị
  choice: ị nọ n'oké ihe mgbu
  alternative: a na-ata gị ahụhụ
  rationale: Okwu a na-egosi ahụhụ siri ike n'ụzọ doro anya, ma ọ naghị amanye otu nkọwa ozizi pụrụ iche n'elu okwu Grik ὀδυνᾶσαι.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “Nwa m” chekwaa ịdị nro nke okwu Ebreham, jiri usoro ọdịiche “Ma ugbu a ... ebe gị onwe gị ...” mee ka mgbanwe ọnọdụ ha pụta ìhè.
