id: LUK.16.8
reference: Luke 16:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: ig
  text: Nna ukwu ahụ[a] wee too onye nlekọta ahụ na-adịghị ezi omume, n’ihi na o ji akọ mee ihe. N’ihi na ụmụ nke ọgbọ a[b] na-eji akọ karịa ka ụmụ nke ìhè[b] si eme n’otú ha si emeso ndị ọgbọ nke ha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onyenwe anyị wee too onye nlekọta ahụ na-adịghị ezi omume.” N’ebe a, “Nna ukwu ahụ” yikarịrị ka ọ na-ezo aka n’ọgaranya nọ n’akụkọ ilu ahụ, ọ bụghị kpọmkwem na Jizọs ma ọ bụ Chineke.
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, ọ bụ “ụmụ nke ọgbọ a” na “ụmụ nke ìhè.” Okwu ndị a na-atụnyere ndị ndụ ha dabere n’ọgbọ dị ugbu a na ndị e ji ìhè Chineke mara.
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ dị nso karị n’okwu Grik: “karịa ụmụ nke ìhè n’ebe ọgbọ nke ha nọ.” Akụkụ Grik a siri ike; nsụgharị a na-akọwa ya dịka iji akọ na-emeso ndị ọgbọ ha ma ọ bụ ndị otu ha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: Nna ukwu ahụ
  rationale: N’akụkọ ilu a, okwu ahụ na-ezo aka n’ọgaranya bụ́ nna ukwu onye nlekọta ahụ. Nhọrọ a na-egosi ọrụ ya n’akụkọ ahụ, ma hapụkwa ‘Onyenwe anyị’ maka ebe κύριος bụ aha e ji akpọ Jizọs ma ọ bụ Chineke.
- source_word: τὸν οἰκονόμον τῆς ἀδικίας
  choice: onye nlekọta ahụ na-adịghị ezi omume
  rationale: ‘Onye nlekọta’ bụ okwu Igbo doro anya maka onye na-elekọta akụ na ihe nna ukwu ya. ‘Na-adịghị ezi omume’ na-edobe ikpe omume dị na ἀδικία n’agbanyeghị na nna ukwu ahụ toro akọ ya.
- source_word: φρονίμως / φρονιμώτεροι
  choice: ji akọ mee ihe / na-eji akọ karịa
  rationale: ‘Akọ’ na-egosi nghọta bara uru na aghụghọ e ji achọta ụzọ isi nweta ihe a chọrọ, n’ebughị ụzọ kwuo na omume ahụ dị mma n’ụzọ omume.
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: ụmụ nke oge a
  rationale: Nhọrọ a na-edobe ihe atụ ezinụlọ dị n’asụsụ Grik nakwa ọdịiche ya na ‘ụmụ nke ìhè,’ ma ọ ka na-ada nghọta n’Igbo.
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: ụmụ nke ìhè
  rationale: Nke a na-edobe ihe atụ Akwụkwọ Nsọ maka ndị e ji ìhè Chineke mara, ma na-eme ka ntụnyere ya na ‘ụmụ nke oge a’ pụta ìhè.
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: n’otú ha si emeso ndị ọgbọ nke ha
  rationale: Akụkụ Grik a siri ike. Nsụgharị a na-eme ka mmekọrịta ahụ doo anya n’Igbo, ma ihe odide ala peeji na-edobe nsụgharị dị nso n’okwu Grik.
theological_decisions:
- issue: Onye ὁ κύριος na-ezo aka na ya
  choice: Nna ukwu nọ n’ime akụkọ ilu ahụ
  alternative: Onyenwe anyị, ya bụ Jizọs ma ọ bụ Chineke
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ nna ukwu onye nlekọta ahụ. Nke a anaghị ewepụ na a pụrụ ịghọta okwu Grik ahụ dịka ‘Onyenwe anyị,’ ya mere e debere nke ahụ n’ihe odide ala peeji.
- issue: Ihe e toro n’omume onye nlekọta ahụ
  choice: A toro akọ o ji mee ihe, ọ bụghị ajọ omume ya
  alternative: A toro omume ya dịka omume ziri ezi
  rationale: Amaokwu ahụ kpọrọ ya onye na-adịghị ezi omume ma kwuo na o ji akọ mee ihe. Nsụgharị ahụ na-edobe esemokwu a kama ime ka otu akụkụ ghara ịdị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ‘ụmụ nke oge a’ na ‘ụmụ nke ìhè,’ ma jiri ‘n’otú ha si emeso ndị ọgbọ nke ha’ mee ka akụkụ ikpeazụ siri ike doo anya n’enweghị ịkwụsị ihe ọ pụtara n’otu ụzọ naanị.
