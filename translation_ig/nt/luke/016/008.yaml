revisions:
- from: Nna ukwu ahụ[a] wee too onye nlekọta ahụ na-adịghị ezi omume, n’ihi na o ji akọ mee ihe. N’ihi na ụmụ nke oge a[b] na-eji akọ karịa ụmụ nke ìhè[b] n’otú ha si emeso ndị ọgbọ nke ha.[c]
  to: Nna ukwu ahụ[a] wee too onye nlekọta ahụ na-adịghị ezi omume, n’ihi na o ji akọ mee ihe. N’ihi na ụmụ nke ọgbọ a[b] na-eji akọ karịa ka ụmụ nke ìhè[b] si eme n’otú ha si emeso ndị ọgbọ nke ha.[c]
  rationale: The revision corrects the misleading and unnatural wording in footnote b, uses the more idiomatic “ọgbọ a” for the present age, and smooths the comparative construction. It preserves the narrative referent of “master,” the moral tension concerning the unrighteous manager, and the acknowledged ambiguity of εἰς τὴν γενεὰν τὴν ἑαυτῶν.
