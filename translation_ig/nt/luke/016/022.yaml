    reason: lexical_alternative
  revision_rationale: The revision replaces an Igbo expression that ordinarily refers to Abraham’s heart with “n’apata Ebreham,” which more naturally conveys the bodily closeness/lap imagery of κόλπος while retaining its metaphorical openness. It also corrects the burial clause to the normal past passive form. The footnote preserves the alternative “at Abraham’s side” and explains the literal Greek image without imposing a doctrinal interpretation.
