source:
  edition: SBLGNT
  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: ig
  text: O wee ruo na ogbenye ahụ nwụrụ, ndị mmụọ ozi wee buru ya gaa n’apata Ebreham[a]. Ọgaranya ahụ nwụkwara, e liri ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’akụkụ Ebreham.” N’asụsụ Grik, okwu ahụ bụ n’ụzọ nkịtị “n’obi Ebreham”; ọ bụ ihe atụ nke ịdị nso, nsọpụrụ, na mmekọrịta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: O wee ruo na
  rationale: Nke a bụ ụzọ Igbo si akọwa mgbanwe na ihe mere n’akụkọ, ma ọ naghị etinye okwu oge doro anya nke na-adịghị na Grik.
- source_word: ἀποθανεῖν τὸν πτωχὸν
  choice: ogbenye ahụ nwụrụ
  rationale: Ọ na-egosipụta infinitive Grik n’ụzọ ahịrịokwu Igbo na-ada nke ọma; πτωχός bụ onye dara ogbenye, ọ bụghị kpọmkwem onye arịrịọ.
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: ndị mmụọ ozi wee buru ya
  rationale: “Buru ya” na-edebe echiche nke ibuga mmadụ, ebe “ndị mmụọ ozi” na-egosipụta ndị mere omume ahụ dịka Grik si kwuo.
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: gaa n’obi Ebreham
  rationale: “N’obi Ebreham” na-edebe ihe atụ nke κόλπος—ịdị nso n’obi ma ọ bụ n’akụkụ mmadụ—kama ịkọwa ya ozugbo dị ka aha otu ebe n’ụwa ndị nwụrụ anwụ.
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: Ọgaranya ahụ nwụkwara
  rationale: Mgbakwunye -kwa na-egosipụta καί (“kwa/ọzọ”) ma na-echekwa myirịta dị n’etiti ọnwụ ndị ikom abụọ ahụ.
- source_word: ἐτάφη
  choice: e lie ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si kwuo passive Grik “e liri ya,” n’ụdị dị mkpirikpi ma doo anya.
theological_decisions:
- issue: Nkọwa εἰς τὸν κόλπον Ἀβραάμ
  choice: n’obi Ebreham
  alternative: n’akụkụ Ebreham
  rationale: Nhọrọ a na-echekwa ihe atụ na mgbagwoju echiche nke okwu Grik banyere ịdị nso, nsọpụrụ na mmekọrịta, n’enweghị ịgbanwe ya ka ọ bụrụ nkọwa ozizi banyere ọnọdụ ndị nwụrụ anwụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị nsọpụrụ, dee ya. “O wee ruo na” dabara n’usoro akụkọ; “n’obi Ebreham” na-echekwa ihe atụ mbụ, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
