revisions:
- from: O wee ruo na ogbenye ahụ nwụrụ, ndị mmụọ ozi wee buru ya gaa n’obi Ebreham[a]. Ọgaranya ahụ nwụkwara, e lie ya.
  to: O wee ruo na ogbenye ahụ nwụrụ, ndị mmụọ ozi wee buru ya gaa n’apata Ebreham[a]. Ọgaranya ahụ nwụkwara, e liri ya.
  rationale: The revision replaces an Igbo expression that ordinarily refers to Abraham’s heart with “n’apata Ebreham,” which more naturally conveys the bodily closeness/lap imagery of κόλπος while retaining its metaphorical openness. It also corrects the burial clause to the normal past passive form. The footnote preserves the alternative “at Abraham’s side” and explains the literal Greek image without imposing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the narrative transition, the deaths of both men, angelic agency, and the rich man's burial. However, “n’obi Ebreham” normally means “in Abraham’s heart” in modern Igbo, rather than the bodily/table-fellowship image conveyed by κόλπος.
  naturalness: The narrative is generally natural Standard Igbo. “e lie ya” is not the appropriate completed passive form here; “e liri ya” clearly means “he was buried.”
  terminology: “Ebreham,” “ndị mmụọ ozi,” “ogbenye,” and “ọgaranya” are suitable. “N’apata Ebreham” better preserves the concrete closeness imagery without turning κόλπος into an abstract inward-emotion expression.
  issues:
  - severity: medium
    issue: “n’obi Ebreham” miscommunicates κόλπος.
    rationale: In contemporary Igbo, obi primarily denotes the heart/interior, so the phrase can suggest being in Abraham’s heart. The Greek expression denotes Abraham’s bosom/lap or a place of honored closeness beside him.
  - severity: medium
    issue: “e lie ya” does not express the past passive assertion clearly.
    rationale: The Greek ἐτάφη is a completed past passive, “was buried.” Standard Igbo “e liri ya” supplies that sense.
  revised_text: O wee ruo na ogbenye ahụ nwụrụ, ndị mmụọ ozi wee buru ya gaa n’apata Ebreham[a]. Ọgaranya ahụ nwụkwara, e liri ya.
  revised_footnotes:
