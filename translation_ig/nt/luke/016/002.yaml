  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: ig
  text: Mgbe ọ kpọrọ ya, ọ sịrị ya, “Gịnị bụ ihe a m na-anụ banyere gị? Nyefee akụkọ banyere ọrụ nlekọta gị,[a] n’ihi na ị pụghịzi ịrụ ọrụ nlekọta.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nyefee ndekọ banyere nlekọta gị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi na ị pụghịzi ịrụ ọrụ dị ka onye nlekọta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: O wee kpọọ ya
  rationale: Aorist participle ahụ na-egosi ihe mere tupu isi ngwaa; nsụgharị a na-egosipụta usoro ihe omume ahụ n’Igbo dị mfe ma bụrụkwa nke sitere n’okwu ahụ.
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: Gịnị bụ ihe a m na-anụ banyere gị?
  rationale: Nke a na-echekwa ọdịdị ajụjụ na ike ịkatọ dị na Grik, n’ejighị nkọwa gbakwunyere dochie ya.
- source_word: ἀπόδος τὸν λόγον
  choice: Nyefee akụkọ
  rationale: N’ọnọdụ nchịkwa a, λόγος bụ akụkọ ndekọ a ga-enye maka ọrụ e nyere mmadụ; ‘nyefee akụkọ’ na-ebute echiche nke ịza ajụjụ n’ụzọ doro anya.
- source_word: τῆς οἰκονομίας σου
  choice: banyere ọrụ nlekọta gị
  rationale: οἰκονομία na-ezo aka n’ọrụ na ibu ọrụ nke ilekọta ụlọ ma ọ bụ akụ onye ọzọ. ‘Ọrụ nlekọta’ bụ okwu Igbo nke oge a, nghọta ya dịkwa mfe.
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: n’ihi na ị pụghịzi ilekọta ihe
  rationale: ‘Pụghịzi’ na-ejikọta echiche nke enweghị ike na ‘ọ bụghịkwa ọzọ’ (ἔτι), ebe ‘ilekọta ihe’ na-egosipụta ọrụ onye nlekọta n’Igbo eke.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ọrụ nlekọta’ na ‘ilekọta ihe’ zere okwu mgbagwoju anya, ma chekwaa njikọ dị n’etiti οἰκονομία na οἰκονομεῖν. E tinyere akara ala ala [a] na [b] n’ebe okwu ndị ha na-akọwa dị n’isi ederede.
