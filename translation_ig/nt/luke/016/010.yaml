id: LUK.16.10
reference: Luke 16:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: ig
  text: Onye a pụrụ ịtụkwasị obi n’ihe dị nnọọ nta[a] bụkwa onye a pụrụ ịtụkwasị obi n’ihe dị ukwuu; onye na-adịghị eme ihe ziri ezi[b] n’ihe dị nnọọ nta adịghịkwa eme ihe ziri ezi n’ihe dị ukwuu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe kasị nta.” Okwu Grik a na-ezo aka n’ihe pere nnọọ mpe ma ọ bụ n’ihe a na-ewere na ọ baghị uru.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye na-aghọ aghụghọ” ma ọ bụ “onye na-adịghị ekpe ikpe ziri ezi.” Okwu Grik a sara mbara karịa aghụghọ ego, ọ bụ ezie na echiche ahụ dabara n’ihe ndị gbara amaokwu a gburugburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: kwesịrị ntụkwasị obi
  rationale: N’ebe a, okwu a na-egosi onye a pụrụ ịtụkwasị obi n’ilekọta ihe e nyere ya, ọ bụghị naanị onye nwere okwukwe. Nhọrọ a bụ Igbo nkịtị ma na-edobe echiche nke ikwesị ntụkwasị obi.
- source_word: ἐν ἐλαχίστῳ
  choice: n’ihe dị nnọọ nta
  rationale: Ọ na-egosi ọnọdụ ma ọ bụ ihe pere nnọọ mpe. Nsụgharị a na-edobe ọdịiche ya na ‘n’ihe dị ukwuu’ ma na-ada nke ọma n’Igbo.
- source_word: πολλῷ
  choice: n’ihe dị ukwuu
  rationale: Neuter singular a na-egosi oke ma ọ bụ ihe buru ibu n’ụzọ na-emegide ἐλαχίστῳ. ‘Ihe dị ukwuu’ na-eme ka ntụnyere ahụ doo anya.
- source_word: ἄδικος
  choice: na-adịghị eme ihe ziri ezi
  rationale: Okwu Grik a sara mbara karịa ịghọ aghụghọ n’ihe gbasara ego; ọ gụnyere omume na-ezighị ezi na enweghị ikpe ziri ezi. Nhọrọ a na-edobe obosara ahụ n’Igbo nkịtị.
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: onye kwesịrị ntụkwasị obi ... onye na-adịghị eme ihe ziri ezi
  rationale: Isiokwu ndị a bụ otu onye e ji anọchi anya onye ọ bụla. ‘Onye...’ na-egosipụta nke a nke ọma n’Igbo ma ghara itinye okike nwoke ma ọ bụ nwanyị n’ebe Grik ahụ na-emeghị ya.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ na ‘kwesịkwara’ na ‘adịghịkwa’ na-egosi echiche nke ‘ọzọkwa/also’ ma na-edobe usoro ahịrịokwu abụọ ahụ n’ụzọ Igbo dị ire.
theological_decisions:
- issue: Nkọwa omume nke ἄδικος n’ọnọdụ metụtara ilekọta akụ
  choice: na-adịghị eme ihe ziri ezi
  alternative: onye aghụghọ; onye na-ekpeghị ikpe ziri ezi
  rationale: Amaokwu ahụ na-ekwu ụkpụrụ omume sara mbara, ọ bụghị naanị aghụghọ ego. Nhọrọ a na-agaghị emechi ihe Jizọs kwuru n’ihe gbasara ego naanị, ma ọ ka dabara n’ọnọdụ gbara ya gburugburu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee nsụgharị ahụ. E debere nhazi ahịrịokwu abụọ yiri ibe ha na ọdịiche dị n’etiti ‘ihe dị nnọọ nta’ na ‘ihe dị ukwuu.’
