review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two balanced general statements, the contrast between what is very little and what is much, and the broad moral force of ἄδικος. However, “kwesịrị ntụkwasị obi” ordinarily means “deserves trust,” rather than stating that someone is faithful/trustworthy; it should be recast.
  naturalness: The second half is understandable and natural enough in modern Standard Igbo. Replacing the first predicate with “a pụrụ ịtụkwasị obi” gives the intended sense in idiomatic Igbo and retains the parallel structure.
  terminology: “A pụrụ ịtụkwasị obi” accurately conveys πιστός here as reliable or trustworthy in handling matters. “Onye na-adịghị eme ihe ziri ezi” appropriately retains the broader sense of ἄδικος without restricting it to financial deception. The footnote alternatives are retained, with wording adjusted so that the alternatives are idiomatic descriptors rather than awkward nominal substitutes.
  issues:
  - severity: medium
    issue: The expression “onye kwesịrị ntụkwasị obi” is semantically imprecise.
    rationale: In Standard Igbo it more readily means “a person who deserves trust,” whereas πιστός here describes a person who is in fact trustworthy or faithful. “Onye a pụrụ ịtụkwasị obi” expresses the source meaning clearly.
  revised_text: Onye a pụrụ ịtụkwasị obi n’ihe dị nnọọ nta[a] bụkwa onye a pụrụ ịtụkwasị obi n’ihe dị ukwuu; onye na-adịghị eme ihe ziri ezi[b] n’ihe dị nnọọ nta adịghịkwa eme ihe ziri ezi n’ihe dị ukwuu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe kasị nta.” Okwu Grik a na-ezo aka n’ihe pere nnọọ mpe ma ọ bụ n’ihe a na-ewere na ọ baghị uru.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye na-aghọ aghụghọ” ma ọ bụ “onye na-adịghị ekpe ikpe ziri ezi.” Okwu Grik a sara mbara karịa aghụghọ ego, ọ bụ ezie na echiche ahụ dabara n’ihe ndị gbara amaokwu a gburugburu.
    reason: lexical_alternative
  revision_rationale: The revision corrects the first key predicate from “deserves trust” to “is trustworthy,” while preserving the verse’s representative-singular form, parallelism, scope, and the existing footnote anchors. No doctrinal interpretation has been added.
