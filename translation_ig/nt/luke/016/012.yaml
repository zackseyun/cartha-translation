  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: ig
  text: Ọ bụrụkwa na unu egosighị na unu bụ ndị kwesịrị ntụkwasị obi n’ihe bụ nke onye ọzọ,[a][c] ònye ga-enye unu ihe bụ nke unu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe onwunwe onye ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe dịịrị unu.”
    reason: lexical_alternative
  - marker: c
    text: Ọdịiche a nwere ike ịbụ n’etiti ịbụ ndị kwesịrị ntụkwasị obi n’ijikwa akụnụba ụwa ugbu a na ịnata ezi akụnụba ma ọ bụ akụnụba na-adịgide adịgide n’ọdịnihu; ma amaokwu a n’onwe ya akọwaghị kpọmkwem ihe ndị ahụ bụ.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: n’ihe bụ nke onye ọzọ
  rationale: Ọ bụ adjective neuter e jiri dịka aha; ntụgharị a na-egosi ihe onye ọzọ nwe ma na-ada nke ọma n’Igbo.
- source_word: πιστοὶ
  choice: ndị kwesịrị ntụkwasị obi
  rationale: N’ebe a, okwu ahụ na-ekwu maka ịbụ onye a pụrụ ịtụkwasị obi n’ilekọta ihe, ọ bụghị naanị ikwere.
- source_word: ἐγένεσθε
  choice: unu abụghị
  rationale: N’ahịrị ọnọdụ a, nke a bụ ụzọ Igbo dị nkenke ma dị ndụ isi kwuo na ha egosighị na ha kwesịrị ntụkwasị obi.
- source_word: τὸ ὑμέτερον
  choice: ihe bụ nke unu onwe unu
  rationale: Nke a na-echekwa ọdịiche dị n’etiti ihe onye ọzọ nwe na ihe bụ nke unu, ma na-enye onwe unu ike kwesịrị ekwesị.
- source_word: δώσει ὑμῖν
  choice: ga-enye unu
  rationale: Nke a na-agbaso ihe δίδωμι pụtara kpọmkwem, n’agbanyeghị na gburugburu okwu ahụ gbasara ilekọta ihe e nyefere mmadụ.
- source_word: καὶ εἰ
  choice: Ọ bụrụkwa na
  rationale: Nke a jikọtara amaokwu ahụ na nke bu ya ụzọ ma webata ọnọdụ ahụ n’ụzọ Igbo ebumpụta ụwa.
- source_word: τίς
  choice: ònye
  rationale: Ajụjụ a bụ nke nkwupụta echiche, a sụgharịkwara ya kpọmkwem dịka ajụjụ banyere onye ga-enye ihe ahụ.
theological_decisions:
- issue: Ihe ọdịiche dị n’etiti “ihe bụ nke onye ọzọ” na “ihe bụ nke unu onwe unu” na-ezo aka na ya
  choice: Ekwughị kpọmkwem ihe abụọ ahụ na-ezo aka na ya n’ahịrị bụ isi.
  alternative: A pụrụ ịghọta ha dịka akụnụba ụwa na akụnụba eziokwu na-adịgide adịgide, ma ọ bụ dịka ọrụ nlekọta n’ụwa na ihe nketa nke ga-abịa.
  rationale: Amaokwu Grik a n’onwe ya akọwaghị ndị a na-ezo aka na ha; ịhapụ ha otú ahụ na-echekwa nghọta dị iche iche na esemokwu nkà mmụta okpukpe dị n’ederede.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma doo onye nkịtị anya. E jiri “ndị kwesịrị ntụkwasị obi” gosipụta ntụkwasị obi n’ọrụ nlekọta; e zere ịkọwa ihe atụ ahụ karịa ka Grik si kwuo.
