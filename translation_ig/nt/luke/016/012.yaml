review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two substantival contrasts, ‘what belongs to another’ (ἐν τῷ ἀλλοτρίῳ) and ‘what is yours’ (τὸ ὑμέτερον), as well as the rhetorical question and future ‘will give.’ However, ‘unu abụghị’ is a present-state expression and does not adequately convey the aorist ἐγένεσθε in this conditional saying, which concerns whether they proved/showed themselves faithful. ‘unu onwe unu’ also adds reflexive emphasis not present in ὑμέτερον.
  naturalness: The wording is generally clear Standard Igbo. ‘Ọ bụrụkwa na unu egosighị na unu bụ ndị kwesịrị ntụkwasị obi’ is more idiomatic for demonstrated reliability in stewardship than ‘unu abụghị ndị kwesịrị ntụkwasị obi.’ Removing the unnecessary reflexive repetition makes the final contrast more natural.
  terminology: ‘Ndị kwesịrị ntụkwasị obi’ suitably expresses πιστοί as reliability in stewardship rather than belief. ‘Ihe bụ nke onye ọzọ’ and ‘ihe bụ nke unu’ faithfully retain the source’s deliberately unspecified referents. The explanatory footnote should likewise use natural wording for faithful management without deciding the referents.
  issues:
  - severity: medium
    issue: The rendering of ἐγένεσθε as ‘unu abụghị’ treats the verb as a simple present-state copula.
    rationale: The aorist γίνομαι here refers to becoming/proving to be faithful. Rendering it as ‘unu egosighị na unu bụ...’ preserves the completed/demonstrated sense naturally in Igbo.
  - severity: low
    issue: ‘Unu onwe unu’ adds emphasis to τὸ ὑμέτερον.
    rationale: The Greek means ‘what is yours’ and already contrasts with ‘what belongs to another’; it does not contain a reflexive or emphatic pronoun requiring ‘onwe unu.’
  - severity: low
    issue: The cross-reference footnote’s phrase for faithful use of worldly wealth is somewhat stiff.
    rationale: ‘Ịbụ ndị kwesịrị ntụkwasị obi n’ijikwa akụnụba ụwa’ is clearer and more idiomatic while preserving the footnote’s explicitly tentative interpretation.
  revised_text: Ọ bụrụkwa na unu egosighị na unu bụ ndị kwesịrị ntụkwasị obi n’ihe bụ nke onye ọzọ,[a][c] ònye ga-enye unu ihe bụ nke unu?[b]
