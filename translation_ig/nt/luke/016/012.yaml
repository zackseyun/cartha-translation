  rationale: The revision improves the rendering of the aorist ἐγένεσθε without making the implied referents explicit, removes an unsupported reflexive emphasis, and smooths the explanatory footnote. It retains the draft’s faithful stewardship terminology, rhetorical form, footnote anchors, and all stated lexical alternatives.
