revisions:
- from: Ọ kpọkwara ndị ji ihe nna ya ukwu otu otu, wee sị onye nke mbụ, “Ego ole ka i ji nna m ukwu?”[a]
  to: Mgbe ọ kpọkọrọ onye ọ bụla n’ime ndị ji nna ukwu ya ụgwọ, ọ sịrị onye nke mbụ, “Ole ka ị ji nna ukwu m?”[a]
  rationale: The revision retains the distributive sense of ἕνα ἕκαστον, clearly renders χρεοφειλετῶν as those owing the master a debt, keeps the human-social sense of κύριος as “nna ukwu,” and avoids specifying cash where the Greek leaves the kind of debt open. The temporal sequence of the aorist participle and the following speech is conveyed naturally by “Mgbe ... ọ sịrị.”
