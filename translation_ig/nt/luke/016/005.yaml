id: LUK.16.5
reference: Luke 16:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: ig
  text: Mgbe ọ kpọkọrọ onye ọ bụla n’ime ndị ji nna ukwu ya ụgwọ, ọ sịrị onye nke mbụ, “Ole ka ị ji nna ukwu m?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik κύριος na-apụtakarị “Onyenweanyị,” ma n’ebe a ọ na-ekwu maka nna ukwu onye na-elekọta ihe ahụ, bụ́ mmadụ. Ya mere, “nna ukwu” dabara adaba karịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: Ọ kpọkwara
  rationale: Aorist participle na-egosi ihe o mere tupu okwu so ya; usoro ‘ọ kpọkwara ... wee sị’ bụ Igbo nkịtị ma na-echekwa usoro omume ahụ.
- source_word: ἕνα ἕκαστον
  choice: otu otu
  rationale: Nkebi a nwere ike nkesa siri ike; ‘otu otu’ na-egosi na ọ kpọrọ onye ọ bụla n’usoro.
- source_word: χρεοφειλετῶν
  choice: ndị ji ihe
  rationale: Nke a na-akọwa ndị ji onye ọzọ ụgwọ. ‘Ndị ji ihe’ bụ okwu Igbo doro anya n’ebe a ma ọ naghị ekpebi ma ụgwọ ahụ bụ ego nkịtị ma ọ bụ ihe ubi.
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: nna ya ukwu
  rationale: κύριος ebe a bụ onye nwe ụlọ ma ọ bụ onye ọrụ ahụ na-ejere ozi, ọ bụghị aha Chineke; ἑαυτοῦ na-ezo aka n’ebe onye na-elekọta ihe ahụ nọ.
- source_word: ἔλεγεν
  choice: wee sị
  rationale: Ọ bụ ezie na imperfect nwere ike igosi omume a na-emeghachi, ‘wee sị’ na-asụ Igbo nke ọma n’ọnọdụ onye mbụ, ebe ‘otu otu’ enyelarị echiche nke omume a na-emeghachi.
- source_word: τῷ πρώτῳ
  choice: onye nke mbụ
  rationale: Nke a na-echekwa ordinal na onye a na-agwa okwu n’ụzọ doro anya.
- source_word: Πόσον
  choice: Ego ole
  rationale: ‘Ole’ na-ajụ ọnụọgụ ụgwọ; ‘ego’ na-eme ka ajụjụ ahụ dị mfe nghọta n’Igbo, n’agbanyeghị na ihe a ga-akwụ n’amaokwu na-esote bụ ihe ubi.
- source_word: ὀφείλεις
  choice: ka i ji
  rationale: N’ọnọdụ ụgwọ, ‘iji mmadụ ihe’ bụ ụzọ Igbo nkịtị si ekwu owing.
- source_word: τῷ κυρίῳ μου
  choice: nna m ukwu
  rationale: Ọ na-egosi onye mmadụ a na-ejere ozi n’ụlọ ma ọ bụ n’ihe onwunwe, ma na-echekwa ‘m’ dị na μου.
theological_decisions:
- issue: Nsụgharị κύριος n’ọnọdụ akụ na ụba nke ilu a
  choice: nna ukwu
  alternative: Onyenweanyị / onyenwe
  rationale: Onye a na-ekwu maka ya bụ mmadụ bụ́ onye nwe ihe na onye ọrụ ahụ na-ejere ozi, ọ bụghị Chineke. ‘Nna ukwu’ na-egosi mmekọrịta ahụ n’enweghị itinye echiche banyere aha nsọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘nna ukwu’ mee ka κύριος bụrụ onye isi mmadụ n’ọnọdụ a, ma zere ime ya aha nsọ. Akara nkọwa ala peeji [a] dị n’isiokwu ahụ.
