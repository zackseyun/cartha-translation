id: LUK.16.15
reference: Luke 16:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: ig
  text: O wee sị ha, “Ọ bụ unu bụ ndị na-egosi onwe unu dị ka ndị ezi omume n’ihu ndị mmadụ[a], ma Chineke maara obi unu. N’ihi na ihe dị elu n’etiti ndị mmadụ[b] bụ ihe arụ n’ihu Chineke.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’anya ndị mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ndị mmadụ ji kpọrọ ihe nke ukwuu.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “ihe na-asọ Chineke oyi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: na-egosi onwe unu dị ka ndị ezi omume
  rationale: N’ebe a, okwu ahụ na-ekwu banyere mmadụ ime ka ndị ọzọ hụ ya dị ka onye ezi omume. Nsụgharị a na-edobe echiche nke igosi na onwe onye ziri ezi, n’emeghị ka ọ pụta na ha pụrụ ime onwe ha ndị ezi omume n’ezie.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: n’ihu ndị mmadụ
  rationale: “N’ihu” na-egosi otú ndị mmadụ si ahụ ma na-ekpebi ihe banyere ha; “ndị mmadụ” na-egosipụta na ἀνθρώπων bụ okwu metụtara mmadụ niile n’ebe a.
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: maara obi unu
  rationale: “Obi” na-echekwa ihe okwu Grik pụtara banyere ụdị mmadụ dị n’ime, ebumnobi, na echiche ya.
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: ihe dị elu n’etiti ndị mmadụ
  rationale: Nsụgharị a na-echekwa ihe atụ nke ịdị elu, ma hapụkwa ohere ka ọ gụnye ihe ndị mmadụ na-ebuli elu ma ọ bụ jiri kpọrọ ihe.
- source_word: βδέλυγμα
  choice: ihe arụ
  rationale: “Ihe arụ” bụ okwu Igbo siri ike ma doo anya maka ihe na-asọ oyi ma bụrụ nke a na-apụghị ịnabata n’ihu Chineke.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Nke a na-edobe otu ahịrịokwu e ji sụgharịa ἐνώπιον na mbụ ma mee ka ọdịiche dị n’etiti echiche mmadụ na nke Chineke pụta ìhè.
- source_word: Ὑμεῖς ἐστε οἱ ...
  choice: Ọ bụ unu bụ ndị ...
  rationale: Ụdị ahịrịokwu a na-egosipụta nkwusi ike dị n’okwu Grik ahụ ma mee ka ebubo Jizọs na-ebo ha pụta ìhè.
theological_decisions:
- issue: Ihe ἀνθρώπων pụtara n’ahịrịokwu abụọ ahụ
  choice: ndị mmadụ
  alternative: ụmụ mmadụ
  rationale: N’ebe a okwu Grik ahụ gụnyere mmadụ niile, ọ bụghị naanị ndị nwoke. “Ndị mmadụ” bụ ụzọ Igbo doro anya na nke dị ugbu a isi chekwaa nghọta ahụ.
- issue: Ike okwu τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: ihe dị elu n’etiti ndị mmadụ
  alternative: ihe ndị mmadụ ji kpọrọ ihe nke ukwuu
  rationale: “Ihe dị elu” na-echekwa ihe atụ dị n’asụsụ Grik ma ghara imechi nghọta ya nanị n’ihe ndị mmadụ ji kpọrọ ihe; nkọwa ọzọ dị n’ala peeji.
- issue: Ike okwu βδέλυγμα
  choice: ihe arụ
  alternative: ihe na-asọ Chineke oyi
  rationale: “Ihe arụ” na-echekwa ịdị arọ nke ikpe Chineke n’enweghị itinye nkọwa okpukpe pụrụ iche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere nkwusi ike nke mmalite ahịrịokwu ahụ, ọdịiche dị n’etiti otú ndị mmadụ si ahụ ihe na otú Chineke si ahụ ya, nakwa ihe atụ nke “ịdị elu.”
