  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: ig
  text: Ma Ebreham kwuru, “Ha nwere Mosis na ndị amụma[a]; ka ha gee ha ntị.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mosis na ndị amụma” na-ezo aka n’ọgbụgba akaebe nke Akwụkwọ Nsọ e jikọtara na Mosis na akwụkwọ ndị amụma.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, n'ụzọ nkịtị, “ka ha nụ ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: Ma ... kwuru
  rationale: δέ na-egosi ntakịrị mmegide n'azịza a, ebe λέγει bụ historical present; iji oge gara aga ‘kwuru’ bụ ụzọ Igbo si akọ akụkọ n'ụzọ ebumpụta ụwa.
- source_word: Ἀβραάμ
  choice: Ebreham
  rationale: Aha mmadụ a sụgharịrị n'ụdị a maara nke ọma n'Igbo.
- source_word: Ἔχουσι
  choice: Ha nwere
  rationale: Ọ na-egosi na ihe ahụ dịịrị ha ugbu a ma ha nwere ike irute ya; ‘Ha nwere’ bụ okwu Igbo doro anya ma kwụ ọtọ.
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: Mosis na Ndị Amụma
  rationale: E debere akpaalaokwu ahụ nkenke dịka ọ dị na Grik. ‘Mosis’ na-anọchi anya ihe odide e jikọtara ya na ya, ‘Ndị Amụma’ na-ezo aka n'akwụkwọ amụma; mkpụrụedemede ukwu na-egosi na ọ bụ akụkụ Akwụkwọ Nsọ a maara ama.
- source_word: ἀκουσάτωσαν
  choice: ka ha gee ... ntị
  rationale: Nke a na-ebute ike iwu nke aorist imperative onye nke atọ ọtụtụ, ma ‘ige ntị’ na-egosikwa ịnara ozi ahụ ma ṅaa ya ntị, ọ bụghị naanị ịnụ ụda.
- source_word: αὐτῶν
  choice: ha
  rationale: Nnochiaha a laghachiri na ‘Mosis na Ndị Amụma.’ N'usoro okwu ‘gee ha ntị,’ Igbo na-egosi nke ọma isi mmalite okwu a ga-anụ.
theological_decisions:
- issue: Ihe ‘Mosis na Ndị Amụma’ na-ezo aka na ya
  choice: E debere ya dịka akpaalaokwu na-ezo aka n'ama Akwụkwọ Nsọ e nyelarị ụmụnne ahụ.
  alternative: Ịghọta ya naanị dịka Mosis na ndị amụma bụ́ ndị mmadụ biri n'akụkọ ihe mere eme.
  rationale: N'usoro okwu ndị Juu na nke Luk, ‘Mosis na Ndị Amụma’ na-ezokarị aka n'Akwụkwọ Nsọ. Isiokwu ahụ ka dị n'ụzọ nkịtị n'amaokwu ahụ, ebe nkọwa ala peeji na-akọwa ihe ọ na-anọchi anya n'etinyeghị nkọwa ahụ n'ime amaokwu.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘gee ntị’ nye iwu ahụ nghọta nke ịnụrụ ma ṅaa ntị, ebe nkọwa [b] na-edebe nhọrọ nkịtị karị. Aha ‘Ebreham’ na ‘Mosis’ gbasoro ụdị Igbo a na-ejikarị eme ihe.
