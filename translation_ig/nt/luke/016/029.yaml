  terminology: 'Ebreham and Mosis are established Igbo biblical forms. Lowercasing “ndị amụma” in the text is preferable: the Greek expression remains literal while the note can explain its conventional scriptural reference. “Akwụkwọ Nsọ” is retained for Scripture.'
