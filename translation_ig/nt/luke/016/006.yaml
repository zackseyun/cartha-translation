  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: ig
  text: Ọ zara, sị, “Otu narị bat mmanụ oliv[a].” Onye nlekọta ahụ wee sị ya, “Were akwụkwọ ụgwọ gị[b], nọdụ ala ngwa ngwa, dee iri ise.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bat bụ ihe ọ̀tụ̀tụ̀ mmiri e ji eme ihe n’oge ochie. Ihe odide Grik kwuru kpọmkwem, “otu narị bat mmanụ oliv.”
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya “akwụkwọ nkwekọrịta gị” ma ọ bụ “ihe odide gị.” Okwu Grik ahụ pụtara “ihe e dere ede”; n’ebe a, ọ na-ezo aka n’akwụkwọ e ji dekọọ ụgwọ onye ji ụgwọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: bat
  rationale: A hapụrụ aha otu ihe ọ̀tụ̀tụ̀ mmiri oge ochie ahụ ka nkọwa akụ na ụba dị n’ilu ahụ ghara ịla n’iyi; e nyere nkọwa ya n’ala peeji.
- source_word: ἐλαίου
  choice: mmanụ oliv
  rationale: N’ebe a, okwu Grik ahụ na-ezo aka na mmanụ oliv; ntụgharị a doro onye na-agụ akwụkwọ nke oge a anya karịa naanị “mmanụ.”
- source_word: Δέξαι
  choice: Were
  rationale: N’iwu a, ọ pụtara iwere akwụkwọ ahụ n’aka; “Were” bụ okwu Igbo dị mfe ma kwekọọ n’omume a chọrọ ozugbo.
- source_word: τὰ γράμματα
  choice: akwụkwọ ụgwọ gị
  rationale: N’agbanyeghị na okwu Grik ahụ bụ ọtụtụ ma pụta n’ụzọ nkịtị “ihe e dere ede,” ọnọdụ a na-egosi na ọ bụ akwụkwọ e ji dekọọ ụgwọ onye ahụ.
- source_word: καθίσας
  choice: nọdụ ala
  rationale: E mere participle ahụ ka ọ bụrụ iwu ọzọ n’usoro omume, nke bụ ụzọ Igbo sitere n’okike si kwuo ya.
- source_word: ταχέως
  choice: ngwa ngwa
  rationale: Nke a na-egosipụta ọsọ nke iwu ahụ kpọmkwem.
- source_word: γράψον
  choice: dee
  rationale: Ọ bụ iwu ka o dee ọnụ ọgụgụ ọhụrụ ahụ; “dee” zuru oke n’Igbo n’etinyeghị nkọwa na-adịghị n’ihe odide ahụ.
- source_word: πεντήκοντα
  choice: iri ise
  rationale: Nke a bụ ntụgharị ọnụ ọgụgụ ahụ kpọmkwem.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A hapụrụ “bat” dịka aha ihe ọ̀tụ̀tụ̀ oge ochie ma kọwaa ya n’ala peeji; usoro iwu ndị ahụ dị mkpụmkpụ iji chekwaa ọsọ nke akụkọ ahụ.
