revisions:
- from: O wee tie mkpu sị, “Nna Abraham, meere m ebere. Zite Lazarọs ka o mikpuo ọnụ mkpịsị aka ya na mmiri, mee ka ire m jụọ oyi, n’ihi na ana m ahụ oké ihe mgbu[a] n’ire ọkụ a.”
  to: O wee tie mkpu sị, “Nna Abraham, meere m ebere, zitere m Lazarọs ka o mikpuo ọnụ mkpịsị aka ya n’ime mmiri, mee ka ire m jụọ oyi, n’ihi na ana m enwe oké mgbu[a] n’ire ọkụ a.”
  rationale: The revision makes the pain expression idiomatic in modern Standard Igbo and makes the dipping action syntactically explicit, while preserving the Greek’s urgency, physical imagery, degree of suffering, and singular “flame.” The footnote remains anchored to “oké mgbu” and presents a legitimate broader lexical alternative without resolving the scene doctrinally.
  reviewer_model: gpt-5.6-terra
