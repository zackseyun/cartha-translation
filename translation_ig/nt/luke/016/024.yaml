id: LUK.16.24
reference: Luke 16:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: ig
  text: O wee tie mkpu sị, “Nna Abraham, meere m ebere, zitere m Lazarọs ka o mikpuo ọnụ mkpịsị aka ya n’ime mmiri, mee ka ire m jụọ oyi, n’ihi na ana m enwe oké mgbu[a] n’ire ọkụ a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ana m ata ahụhụ n’ire ọkụ a.” Ngwaa Grik a pụrụ ịpụta ịnọ n’oké mgbu ma ọ bụ ịta ahụhụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: tie mkpu
  rationale: Nkebiokwu a na-egosi na ọ kpọrọ oku n’olu dara ụda n’ihi mkpa na ihe mgbu; “tie mkpu” na-egosipụta ike arịrịọ ahụ n’Igbo doro anya.
- source_word: ἐλέησόν με
  choice: meere m ebere
  rationale: Nke a bụ ụzọ Igbo dị ugbu a, dịkwa ugwu, si kwuo arịrịọ ka e gosipụta ebere.
- source_word: πέμψον Λάζαρον
  choice: Zite Lazarọs
  rationale: “Zite” na-egosipụta iwu/arịrịọ kpọmkwem nke ngwaa Grik ahụ n’enweghị ịgbakwunye nkọwa.
- source_word: βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος
  choice: ka o mikpuo ọnụ mkpịsị aka ya na mmiri
  rationale: “Mikpuo” na-egosipụta imetụ ihe n’ime mmiri obere oge, ebe “ọnụ mkpịsị aka” na-akọwa akụkụ ikpeazụ nke mkpịsị aka ahụ.
- source_word: καταψύξῃ τὴν γλῶσσάν μου
  choice: mee ka ire m jụọ oyi
  rationale: 'Nke a na-echekwa ihe oyiyi anụahụ dị na Grik: iji mmiri mee ka ire ya dajụọ oyi.'
- source_word: ὀδυνῶμαι
  choice: ana m ahụ oké ihe mgbu
  rationale: Nhọrọ a na-egosipụta nnukwu ahụhụ na mgbu nke ngwaa Grik pụtara, ma ọ naghị ewebata nkọwa okpukpe karịrị ihe e kwuru.
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: n’ire ọkụ a
  rationale: “Ire ọkụ” dabara na φλόξ, nke pụtara ọkụ na-enwu ma ọ bụ flame, karịa okwu sara mbara bụ naanị “ọkụ.”
- source_word: Πάτερ Ἀβραάμ
  choice: Nna Abraham
  rationale: E debere kpọmkwem ụdị ọ kpọrọ nna nna Izrel ahụ, nke na-egosipụta njikọ agbụrụ na arịrịọ ya.
theological_decisions:
- issue: Otú e si kọwaa ahụhụ nwoke bara ọgaranya
  choice: ana m ahụ oké ihe mgbu n’ire ọkụ a
  alternative: ana m ata ahụhụ n’ire ọkụ a
  rationale: “Oké ihe mgbu” na-egosipụta ike ὀδυνῶμαι n’enweghị ime ka okwu ahụ sie ike ma ọ bụ dị nro karịa Grik; ndetu ala peeji na-echekwa ụzọ ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ugwu. Ahịrịokwu ndị ahụ na-echekwa ngwa ngwa na ike arịrịọ ahụ, ebe e kewara okwu ya ụzọ abụọ ka ọ na-ada nke ọma n’Igbo.
