id: LUK.16.30
reference: Luke 16:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: ig
  text: Ma ọ sịrị, “Mba, nna Ebraham! Kama, ọ bụrụ na onye si n’etiti ndị nwụrụ anwụ[a] gakwuru ha, ha ga-echegharị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ dị mkpụmkpụ, “si ná ndị nwụrụ anwụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐχί
  choice: Mba
  rationale: Nke a bụ ụzọ Igbo dị ndụ si ekwu nkwugide siri ike n’okwu a na-aza ozugbo, n’etinyeghị okwu ndị na-adịghị na Grik.
- source_word: πάτερ Ἀβραάμ
  choice: nna Ebraham
  rationale: Ọ bụ okwu a na-akpọ mmadụ kpọmkwem, nke na-egosi na ọ na-arịọ Ebraham dị ka nna nna ya; e meghị ya utu aha pụrụ iche.
- source_word: ἀλλ’ ἐάν
  choice: Kama, ọ bụrụ na
  rationale: Nke a na-egosi mgbazi na ọdịiche dị n’etiti ihe Ebraham kwuru na ọnọdụ ọzọ nwoke ahụ na-atụ aro.
- source_word: τις
  choice: onye
  rationale: ‘Onye’ bụ ụzọ Igbo dị mfe ma kwekọọ n’otu onye a na-akọwaghị kpọmkwem.
- source_word: ἀπὸ νεκρῶν
  choice: si n’etiti ndị nwụrụ anwụ
  rationale: Nke a na-eme ka echiche nke isi n’etiti ma ọ bụ n’ọgbọ ndị nwụrụ anwụ pụta ìhè, ma na-ahapụkwa ụzọ ntụgharị dị mkpụmkpụ n’okpuru ederede.
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: gakwuru ha
  rationale: ‘Gakwuru ha’ na-egosi ngagharị ruo n’ebe ndị ahụ nọ ma na-edobe echiche nke πορεύομαι na πρός.
- source_word: μετανοήσουσιν
  choice: ha ga-echegharị
  rationale: ‘Chegharị’ bụ okwu Igbo a na-aghọta nke ọma maka mgbanwe uche na ụzọ ndụ n’ihu Chineke, ọ bụghị naanị ịgbanwe echiche n’ihe nkịtị.
theological_decisions:
- issue: Ihe μετανοήσουσιν pụtara
  choice: ha ga-echegharị
  alternative: ha ga-agbanwe echiche ha; ha ga-atụgharị
  rationale: N’ọnọdụ Luk a, okwu ahụ na-ekwu maka nzaghachi nye ịdọ aka ná ntị Chineke nke na-ebute mgbanwe n’uche na n’omume. ‘Chegharị’ na-echekwa ibu omume na nke mmụọ dị n’okwu ahụ n’enweghị itinye nkọwa otu ụka.
- issue: Ihe ἀπὸ νεκρῶν pụtara
  choice: si n’etiti ndị nwụrụ anwụ
  alternative: si ná ndị nwụrụ anwụ
  rationale: Isi okwu ahụ nwere ike ịpụta isi n’etiti ndị nwụrụ anwụ ma ọ bụ, n’ụzọ dị mkpụmkpụ, isi ná ndị nwụrụ anwụ. E debere ọdịiche a n’okpuru ederede kama ikpebi ihe karịrị ihe Grik kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. ‘Mba’ na mkpu e tinyere n’okwu a na-akpọ Ebraham na-eme ka arịrịọ siri ike nke onye ahụ doo anya; ‘gakwuru ha’ na ‘ha ga-echegharị’ bụ okwu nkịtị ma nwee ibu kwesịrị ekwesị.
