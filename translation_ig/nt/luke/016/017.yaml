source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: ig
  text: Ma, ọ dị mfe ka eluigwe na ụwa gabiga karịa ka otu obere akara e ji amata mkpụrụedemede n’Iwu ahụ daa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “otu ntakịrị akara”—ya bụ, obere ahịrị e ji mee ka otu mkpụrụedemede dị iche n’ibe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: ọ dị mfe ... karịa
  rationale: 'Nke a na-egosipụta ntụnyere dị n’okwu Grik: otu ihe dị mfe ime karịa nke ọzọ.'
- source_word: δέ
  choice: Ma
  rationale: “Ma” na-egosi obere ọdịiche dị n’etiti okwu a na ihe ndị bu ya ụzọ, n’ebughị ọdịiche ahụ ókè.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: eluigwe na ụwa
  rationale: Nke a na-echekwa akpaalaokwu Akwụkwọ Nsọ nke na-ezo aka n’ihe niile Chineke kere.
- source_word: παρελθεῖν
  choice: gabiga
  rationale: “Gabiga” na-echekwa onyinyo nke ihe na-agafe ma kwụsị ịdị, n’akọwaghị ya karịa ihe ederede kwuru.
- source_word: νόμου
  choice: Iwu ahụ
  rationale: Mkpoaha a nwere akara njirimara n’asụsụ Grik, ebe ọnọdụ okwu ahụ na-egosi Iwu e nyere n’Akwụkwọ Nsọ, ọ bụghị iwu n’ozuzu ya.
- source_word: μίαν κεραίαν
  choice: otu obere ahịrị dị n’otu mkpụrụedemede
  rationale: Nke a na-akọwa obere ahịrị ma ọ bụ strok e ji amata otu mkpụrụedemede, n’asụsụ Igbo nke onye nkịtị ga-aghọta.
- source_word: πεσεῖν
  choice: daa
  rationale: “Daa” na-edobe ihe atụ nkịtị nke ngwaa Grik ma na-egosi na ọbụna ihe kasị nta agaghị efunahụ ọnọdụ ya.
theological_decisions:
- issue: Ihe νόμος na-ezo aka na ya
  choice: Iwu ahụ dị n’Akwụkwọ Nsọ
  alternative: iwu n’ozuzu ya
  rationale: Ọnọdụ okwu Luk na njirimara dị n’okwu Grik na-akwado na ọ bụ Iwu Chineke e dere ede ka a na-ekwu maka ya; ntụgharị ahụ anaghị akọwa karịa nke a.
- issue: Otú e si ghọta κεραία
  choice: otu obere ahịrị dị n’otu mkpụrụedemede
  alternative: otu ntakịrị akara
  rationale: 'Nhọrọ a na-eme ka isi okwu ahụ pụta ìhè: ọbụna ihe kasị nta e ji dee ma ọ bụ amata mkpụrụedemede nke Iwu ahụ agaghị ada, ma ọ naghị eji okwu ụka ochie nke ndị mmadụ nwere ike ghara ịghọta.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma doo anya, mee ntụgharị ahụ. E chekwara akpaalaokwu “eluigwe na ụwa” na onyinyo “daa,” ebe nkọwa dị mkpirikpi n’ala peeji na-eme ka κεραία doo anya.
