  to: Ma, ọ dị mfe ka eluigwe na ụwa gabiga karịa ka otu obere akara e ji amata mkpụrụedemede n’Iwu ahụ daa.[a]
  rationale: The revision only improves the naturalness and precision of the phrase for κεραία. It retains the Greek comparison, the biblical idiom “eluigwe na ụwa,” the scriptural sense of “Iwu ahụ,” and the literal metaphor “daa.”
