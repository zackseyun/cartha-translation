review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two general statements, the marital sense of ἀπολύω, marriage to another woman, and μοιχεύει (“commits adultery”). The expression “nwanyị di ya gbara alụkwaghịm” appropriately represents a woman divorced from her husband in this marital context.
  naturalness: The wording is generally natural Standard Igbo. Repeating “onye ọ bụla” in the second coordinated clause makes its independent universal scope explicit and is more idiomatic than relying on “onye lụkwara,” which can sound merely additive (“the one who also marries”).
  terminology: “gbara ... alụkwaghịm,” “lụọ nwanyị ọzọ,” and “na-akwa iko” are clear, current, and suitably formal Standard Igbo terms. No doctrinal qualification has been added.
  issues:
  - severity: low
    issue: The second clause does not explicitly repeat the universal subject.
    rationale: Greek has a fresh articular participial subject, καὶ ὁ ... γαμῶν, not simply an appended action by the first subject. “Onye lụkwara” can be understood correctly, but “onye ọ bụla lụrụ” clearly preserves the parallel generalization.
  revised_text: Onye ọ bụla gbara nwunye ya alụkwaghịm ma lụọ nwanyị ọzọ na-akwa iko; onye ọ bụla lụrụ nwanyị di ya gbara alụkwaghịm na-akwa iko.
