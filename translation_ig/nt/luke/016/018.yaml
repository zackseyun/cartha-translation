source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: ig
  text: Onye ọ bụla gbara nwunye ya alụkwaghịm ma lụọ nwanyị ọzọ na-akwa iko; onye ọ bụla lụrụ nwanyị di ya gbara alụkwaghịm na-akwa iko.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: Onye ọ bụla
  rationale: Nkebiokwu a na-enye iwu zuru ụwa ọnụ; “Onye ọ bụla” bụ Igbo doro anya nke na-echekwa oke ahụ.
- source_word: ἀπολύων
  choice: gbara ... alụkwaghịm
  rationale: N'okwu gbasara alụmdi na nwunye, ngwaa a pụtara ịgba alụkwaghịm, ọ bụghị nanị ịchụpụ mmadụ.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: nwunye ya
  rationale: N'ebe a γυνή pụtara nwunye n'ihi na okwu ahụ gbasara alụmdi na nwunye na ịgba alụkwaghịm.
- source_word: γαμῶν ἑτέραν
  choice: ma lụọ nwanyị ọzọ
  rationale: “Lụọ nwanyị ọzọ” bụ Igbo eke nke na-eme ka onye a na-ekwu banyere ya pụta ìhè ma na-echekwa echiche ἑτέραν.
- source_word: μοιχεύει
  choice: na-akwa iko
  rationale: N'ọnọdụ a, okwu a kpọmkwem na-ezo aka n'ịkwa iko megide alụmdi na nwunye; nke a bụ okwu Igbo a na-aghọta nke ọma.
- source_word: ἀπολελυμένην ἀπὸ ἀνδρός
  choice: nwanyị di ya gbara alụkwaghịm
  rationale: Nhọrọ a na-echekwa ọnọdụ nwanyị ahụ dịka onye a gbara alụkwaghịm, ma na-akọwa ἀνήρ dịka di n'ihi ọnọdụ alụmdi na nwunye.
theological_decisions:
- issue: Oke na ike nke okwu Jizọs banyere ịgba alụkwaghịm
  choice: E depụtara ya dịka nkwupụta omume metụtara onye ọ bụla, n'etinyeghị ọnọdụ mgbaghara sitere n'akụkụ Akwụkwọ Nsọ ndị ọzọ.
  alternative: Ịgbakwunye ọnọdụ mgbaghara banyere ịkwa iko, ma ọ bụ ime ka okwu a bụrụ naanị maka ụdị ịgba alụkwaghịm ụfọdụ n'okpuru iwu ndị Juu.
  rationale: Okwu Luk n'amaokwu a bụ nkwupụta dị nkenke na nke zuru ụwa ọnụ. Nsụgharị kwesịrị ịhapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị, kama ịgbakwunye nkọwa na-adịghị na Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Gbara ... alụkwaghịm” na “na-akwa iko” bụ okwu ndị a na-ejikarị eme ihe ma na-enye echiche iwu na omume nke amaokwu ahụ n'ụzọ doro anya.
