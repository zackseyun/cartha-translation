translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri usoro akụkọ ilu nke Igbo (“O nwere otu nwoke...”) mee ka okwu ahụ daa nke ọma, ebe e chekwara ọdịiche dị n’etiti ebubo na ihe e gosipụtara dị ka eziokwu.
