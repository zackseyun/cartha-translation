source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: ig
  text: Ọ na-agwakwa ndị na-eso ụzọ ya okwu, sị, “O nwere otu nwoke bara ọgaranya nke nwere onye nlekọta akụ ya[a]. E boro onye nlekọta ahụ ebubo[b] n’ihu nwoke bara ọgaranya ahụ na ọ na-emefusị ihe onwunwe nwoke ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nlekọta ụlọ na akụ ya.” Okwu Grik ahụ na-ezo aka n’onye e nyere ọrụ ilekọta ụlọ, ala, ma ọ bụ ihe onwunwe mmadụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a kọọrọ nwoke bara ọgaranya ahụ ihe ọjọọ banyere onye nlekọta ahụ,” ma ọ bụ “a kpọrọ ya ebubo n’ihu ya.” Okwu Grik ahụ nwere ike ịpụta ebubo ma ọ bụ akụkọ ọjọọ e wetara megide mmadụ; ọ pụtaghị n’onwe ya na e gosipụtala ebubo ahụ dị ka eziokwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ọ na-agwakwa ... okwu
  rationale: Ụdị imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke na-emeghe ọnọdụ akụkọ; “na-agwa ... okwu” na-egosipụta nke a n’Igbo nkịtị.
- source_word: δὲ καὶ
  choice: -kwa
  rationale: “Kwa” na-egosipụta καί (‘ọzọkwa’), ebe a hapụrụ δέ ka mgbanwe akụkọ pụta n’usoro okwu Igbo na-enweghị ime ka ahịrịokwu sie ike.
- source_word: πρὸς τοὺς μαθητάς
  choice: ndị na-eso ụzọ ya
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya maka μαθηταί. Agbakwunyere “ya” dịka ihe asụsụ Igbo na-achọ n’ọnọdụ a iji mata ndị a na-ekwu maka ha, ọ bụghị iji webata echiche ozizi ọzọ.
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: O nwere otu nwoke bara ọgaranya
  rationale: Nke a bụ ụzọ Igbo dị ndụ e si ewebata onye a kapịrị ọnụ ma a kpọghị aha ya n’ilu.
- source_word: οἰκονόμον
  choice: onye na-elekọta akụ ya
  rationale: Ọ na-egosi onye e nyere ọrụ ilekọta ụlọ, ala, ma ọ bụ akụ mmadụ; okwu a doro ndị na-agụ Igbo nke oge a anya karịa okwu mgbazinye.
- source_word: οὗτος
  choice: onye ahụ
  rationale: “Onye ahụ” na-ejigide nkwusiri ike demonstrative nke na-alaghachi n’onye na-elekọta akụ.
- source_word: διεβλήθη αὐτῷ
  choice: E boro onye ahụ ebubo n’ihu ya
  rationale: Nke a na-edobe echiche nke ịkpọrọ ebubo gaa n’ihu nwoke bara ọgaranya, ma ọ naghị ekwu na e gosipụtala ebubo ahụ dị ka eziokwu.
- source_word: ὡς διασκορπίζων
  choice: na ọ na-emefusị
  rationale: Ọ na-enye ọdịnaya ebubo ahụ ma na-egosipụta omume a sịrị na ọ na-aga n’ihu; “imefusị” dabara n’ọnọdụ akụ na ụba.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ihe onwunwe ya
  rationale: Ọ bụ okwu sara mbara ma dị mma maka ihe niile nwoke bara ọgaranya nwere.
