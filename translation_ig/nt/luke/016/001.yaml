    issue: Ambiguous referents of "ya" in the accusation clause
    rationale: In "E boro onye ahụ ebubo n’ihu ya na ọ na-emefusị ihe onwunwe ya," both "n’ihu ya" and especially "ihe onwunwe ya" may be understood as referring to the manager. In the Greek, the recipient of the accusation and owner of the possessions are the rich man. Explicit noun phrases resolve this source-fidelity ambiguity.
  - severity: low
    issue: Footnote b is anchored after "ihe onwunwe ya" although it explains διεβλήθη
    rationale: The lexical-alternative note concerns the accusation/report verb, not possessions. Moving its marker to "ebubo" gives it an accurate anchor.
