id: LUK.16.27
reference: Luke 16:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἐρωτῶ ⸂σε οὖν⸃, πάτερ, ἵνα πέμψῃς αὐτὸν εἰς τὸν οἶκον τοῦ πατρός μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: ig
  text: O wee sị, “Ya mere, nna, ana m arịọ gị[a] ka i ziga ya n’ụlọ nna m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ana m ekpe gị arịrịọ.” Ngwaa Grik a nwere ike igosi arịrịọ siri ike, ọ bụ ezie na isi ihe ọ pụtara bụ ịrịọ mmadụ ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: O wee sị
  rationale: “Wee” na-egosi njikọ dị nwayọọ nke δέ ji eme ka akụkọ gaa n’ihu, n’ụzọ Igbo sitere n’okike.
- source_word: Ἐρωτῶ
  choice: ana m arịọ
  rationale: ἐρωτάω pụtara ịrịọ ma ọ bụ ịjụ mmadụ ihe; n’ebe a, “ana m arịọ” na-egosi na ọ bụ arịrịọ siri ike n’etinyeghị mmetụta karịrị ihe okwu Grik kwuru.
- source_word: σε οὖν
  choice: Ya mere ... gị
  rationale: “Ya mere” na-egosipụta njikọ οὖν na ihe a jụrụ ya na mbụ, ebe “gị” na-anọchi σε n’ebe kwesịrị ekwesị n’usoro okwu Igbo.
- source_word: πάτερ
  choice: nna
  rationale: Ọ bụ okwu a kpọrọ Ebreham dị ka nna nna; mkpụrụedemede nta na-ezere ime ka ọ dị ka aha nsọ e ji akpọ Chineke.
- source_word: ἵνα πέμψῃς
  choice: ka i ziga
  rationale: N’eso ngwaa nke ịrịọ, “ka i ziga” na-egosi ọdịnaya nke arịrịọ ahụ ma na-asụkwa Igbo nke ọma.
- source_word: αὐτὸν
  choice: ya
  rationale: “Ya” na-ezo aka na Lazarọs dịka ihe gbara amaokwu a gburugburu si gosi.
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: n’ụlọ nna m
  rationale: Nke a na-egosi ebe a chọrọ ka e ziga ya ma na-edebe nkọwa ahụ dịka ụlọ nna onye na-ekwu okwu.
theological_decisions:
- issue: πάτερ dị ka okwu a kpọrọ onye n’ilu ahụ
  choice: nna
  alternative: Nna
  rationale: Onye ahụ na-agwa Ebreham okwu dị ka nna nna ya, ọ bụghị Chineke. Ide ya n’ụdị mkpụrụedemede nta na-edebe ihe ederede ahụ kwuru n’etinyeghị nkọwa okpukpe ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ihe. “O wee sị” na-eme ka akụkọ na-aga n’ihu n’ụzọ sitere n’okike; “Ya mere” na-edebe njikọ echiche nke οὖν.
