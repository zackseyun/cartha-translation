revisions:
- from: Ọzọkwa, tinyere ihe ndị a niile[a], e meela ka nnukwu oghere dị n’etiti anyị na unu guzosie ike, ka ndị chọrọ isi n’ebe a gafere n’ebe unu nọ ghara inwe ike, ka ndị si n’ebe ahụ chọọ ịgafe n’ebe anyị nọ gharakwa inwe ike.
  to: Ma e wezụga ihe ndị a niile[a], e meela ka nnukwu oghere dị n’etiti anyị na unu guzosie ike, ka ndị chọrọ isi n’ebe a gafere n’ebe unu nọ ghara inwe ike; ọ dịghịkwa onye nwere ike isi n’ebe ahụ gafere bịa n’ebe anyị nọ.
