id: LUK.16.26
reference: Luke 16:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: ig
  text: Ma e wezụga ihe ndị a niile[a], e meela ka nnukwu oghere dị n’etiti anyị na unu guzosie ike, ka ndị chọrọ isi n’ebe a gafere n’ebe unu nọ ghara inwe ike; ọ dịghịkwa onye nwere ike isi n’ebe ahụ gafere bịa n’ebe anyị nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “N’ime ihe ndị a niile.” Nkebiokwu Grik a nwere ike igosi ihe ọzọ a na-agbakwụnye n’ihe ndị e kwuburu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: Ọzọkwa, tinyere ihe ndị a niile
  rationale: Nke a na-egosi na a na-agbakwụnye ihe ọzọ n’okwu ahụ, ma na-edobekwa echiche nke ‘ihe ndị a niile’ n’ụzọ Igbo doro anya.
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: n’etiti anyị na unu
  rationale: ‘Unu’ na-egosipụta nke ọma na nnọchiaha Grik ahụ bụ ọtụtụ.
- source_word: χάσμα μέγα
  choice: nnukwu oghere
  rationale: ‘Nnukwu oghere’ na-enye echiche nke nnukwu nkewa a na-apụghị ịgafe, n’asụsụ ndị mmadụ na-aghọta.
- source_word: ἐστήρικται
  choice: e meela ka ... guzosie ike
  rationale: Ụdị zuru oke nke ngwaa ahụ na-egosi na e tinyela nkewa ahụ ma ọ ka dịgide.
- source_word: ὅπως
  choice: ka
  rationale: ‘Ka’ na-ewebata ebumnuche ma ọ bụ ihe si na ọnọdụ ahụ pụta, n’enweghị idozi nghọtahie ahụ n’otu ụzọ naanị.
- source_word: οἱ θέλοντες
  choice: ndị chọrọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi gosipụta ndị nwere ọchịchọ ịgafe.
- source_word: διαβῆναι
  choice: gafere
  rationale: Ọ na-egosi isi n’otu akụkụ ruo n’akụkụ nke ọzọ.
- source_word: ἔνθεν
  choice: n’ebe a
  rationale: Ọ na-edobe ntụaka si n’akụkụ onye na-ekwu okwu.
- source_word: μὴ δύνωνται
  choice: ghara inwe ike
  rationale: Nke a na-egosi enweghị ike, ọ bụghị naanị mmachibido iwu.
- source_word: μηδὲ
  choice: gharakwa
  rationale: Ọ na-ejikọta enweghị ike nke abụọ na nke mbụ n’ụzọ kwekọrọ.
- source_word: ἐκεῖθεν
  choice: n’ebe ahụ
  rationale: Ọ bụ ihe na-emegide ‘n’ebe a,’ ma na-edobe ntụaka akụkụ abụọ ahụ.
- source_word: διαπερῶσιν
  choice: ịgafe
  rationale: Ọ na-edobe echiche nke ịgabiga ruo n’akụkụ nke ọzọ n’enweghị ikwubiga ihe ngwaa ngwakọta ahụ pụtara ókè.
theological_decisions:
- issue: Ụdị nkewa dị n’etiti akụkụ abụọ ahụ n’ilu a
  choice: E gosipụtara ya dị ka nkewa e mere ka o guzosie ike nke mmadụ na-enweghị ike ịgafe.
  alternative: Ịkọwa oghere ahụ kpọmkwem dị ka ọdịdị ala nke ụwa ndị nwụrụ anwụ, ma ọ bụ ịsị na ọ bụ naanị ihe atụ na-enweghị ihe ọ bụla ọ na-ekwu banyere nkewa na-adịgide.
  rationale: Amaokwu ahụ n’onwe ya na-emesi ike na nkewa ahụ guzosiri ike nakwa na a pụghị ịgafe ya; ntụgharị ahụ anaghị agbakwunye ozizi karịrị ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E jiri ‘unu’ gosipụta ọtụtụ nke nnọchiaha ahụ; e zere okwu ozizi pụrụ iche na nkọwa karịrị ihe amaokwu ahụ kwuru.
