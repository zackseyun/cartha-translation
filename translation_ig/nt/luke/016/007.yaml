  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: ig
  text: Mgbe ahụ, ọ sịrị onye ọzọ, “Gị kwa, ole ka i ji ụgwọ?” Ọ zara, “Otu narị kọr ọka wit[a].” Ọ na-asị ya, “Were akwụkwọ ụgwọ gị[b], dee iri asatọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kọr bụ nnukwu ihe e ji atụ mkpụrụ ọka kpọrọ nkụ n’oge ochie.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya “akwụkwọ nkwekọrịta gị” ma ọ bụ “akwụkwọ ndekọ gị.” N’asụsụ Grik, ọ bụ “ihe odide gị” (τὰ γράμματα), nke na-ezo aka n’akwụkwọ e dere ụgwọ onye ahụ n’ime ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: Mgbe ahụ
  rationale: Na-egosi ihe sochiri nke gara aga n’akụkọ ahụ n’ụzọ Igbo dị mfe ma kwekọọ n’usoro oge.
- source_word: ἑτέρῳ
  choice: onye ọzọ
  rationale: Na-egosi onye ji ụgwọ ọzọ, dị iche na onye e kwuru okwu ya na mbụ, n’etinyeghị nkọwa nwoke nke Grik ekwughị kpọmkwem.
- source_word: Σὺ δὲ πόσον ὀφείλεις
  choice: Gịnịkwa banyere gị, ole ka i ji ụgwọ?
  rationale: “Gịnịkwa banyere gị” na-egosipụta nkwusi ike dị na Σὺ δὲ, ebe “ole ka i ji ụgwọ?” na-akọwa ụgwọ ego ma ọ bụ ihe e ji n’ụzọ doro anya.
- source_word: Ἑκατὸν κόρους σίτου
  choice: Ọka wit otu narị kọr
  rationale: E debere kọρ dị ka aha otu nnukwu ihe e ji atụ mkpụrụ ọka n’oge ochie; “ọka wit” bụ okwu Igbo a na-aghọta nke ọma maka σῖτος n’ebe a.
- source_word: λέγει αὐτῷ
  choice: Ọ na-asị ya
  rationale: Ụdị ugbu a na-echekwa mgbanwe Grik si n’oge gara aga banye n’ụdị akụkọ ugbu a, nke na-eme ka ihe ahụ dị ndụ.
- source_word: Δέξαι σου τὰ γράμματα
  choice: Were akwụkwọ ụgwọ gị
  rationale: N’agbanyeghị na γράμματα bụ ọtụtụ n’asụsụ Grik ma pụta n’ụzọ nkịtị ‘ihe odide’ ma ọ bụ ‘akwụkwọ,’ ọnọdụ a na-egosi akwụkwọ e dere ụgwọ onye ahụ n’ime ya.
- source_word: γράψον ὀγδοήκοντα
  choice: dee iri asatọ
  rationale: Na-edobe iwu ahụ nso n’okwu Grik ma mee ka o doo anya na a ga-ede ọnụ ọgụgụ ọhụrụ n’akwụkwọ ụgwọ ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. A hapụrụ aha otu ihe atụ oge ochie dị ka “kọr” ma kọwaa ya n’ala ala peeji. A chekwara mgbanwe gaa n’ụdị akụkọ ugbu a na λέγει site n’iji “Ọ na-asị ya.”
