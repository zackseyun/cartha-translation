- from: 'Mụ onwe m na-agwa unu sị: Jirinụ akụ na ụba nke ajọ omume[a] meere onwe unu ndị enyi, ka ọ ga-abụ na mgbe ọ gwụsịrị[b], ha anabata unu n’ebe obibi ebighị ebi[c].'
  to: 'Mụ onwe m na-agwa unu sị: Jirinụ akụ na ụba nke ajọ omume[a] meere onwe unu ndị enyi, ka, mgbe ọ gwụsịrị[b], ha wee nabata unu n’ebe obibi ebighị ebi[c].'
