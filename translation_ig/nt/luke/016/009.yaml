id: LUK.16.9
reference: Luke 16:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: ig
  text: 'Mụ onwe m na-agwa unu sị: Jirinụ akụ na ụba nke ajọ omume[a] meere onwe unu ndị enyi, ka, mgbe ọ gwụsịrị[b], ha wee nabata unu n’ebe obibi ebighị ebi[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site na mamọn nke ajọ omume.” “Mamọn” bụ okwu ọdịnala e ji asụgharị okwu Grik nke pụtara akụ na ụba ma ọ bụ ego.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ya dịka, “mgbe unu nwụsịrị,” ma ọ bụ “mgbe ọ gwụrụ.” Grik ahụ ekwughị isiokwu ngwaa ahụ hoo haa; ọtụtụ na-ewere ya na ọ na-ekwu maka akụ na ụba ịgwụ, ebe ụfọdụ na-ewere ya na ọ na-ekwu maka ọnwụ mmadụ.
    reason: alternative_reading
  - marker: c
    text: 'N’ụzọ nkịtị: “n’ụlọikwuu ebighị ebi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: meere onwe unu ndị enyi
  rationale: Nke a na-edobe iwu ahụ na echiche nke ime ndị enyi maka ọdịmma onwe ha, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: jirinụ akụ na ụba nke ajọ omume
  rationale: “Jirinụ” na-egosi na akụ ahụ bụ ihe e ji eme ihe, ebe “nke ajọ omume” na-edobe njikọ sara mbara nke ἀδικία n’emeghị ka ọ bụrụ naanị ego e nwetara n’ụzọ aghụghọ.
- source_word: μαμωνᾶ
  choice: akụ na ụba
  rationale: Ọ bụ okwu doro ndị na-agụ Igbo anya maka akụ ma ọ bụ ego; e debere “mamọn” dịka nsụgharị ọdịnala n’okpuru amaokwu.
- source_word: τῆς ἀδικίας
  choice: nke ajọ omume
  rationale: Ọ na-edobe echiche sara mbara nke mmejọ na enweghị ezi omume karịa okwu ga-apụta naanị aghụghọ n’ihe gbasara ego.
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: ka ọ ga-abụ na mgbe ọ gwụsịrị
  rationale: Nnọchiaha “ọ” na-ezo aka n’akụ na ụba dịka ihe kacha nso, ebe “gwụsịrị” na-egosi ọdịdị akụ nke na-adịghị adịgide; a kọwara nghọta ndị ọzọ n’okpuru amaokwu.
- source_word: δέξωνται ὑμᾶς
  choice: ha anabata unu
  rationale: “Anabata” na-egosi nnabata nke ọma ma hapụ onye “ha” bụ ka ọ ghara ịkọwapụta karịa ihe Grik kwuru.
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: n’ebe obibi ebighị ebi
  rationale: “Ebe obibi” na-enye echiche nke ebe mmadụ bi n’Igbo doro anya, ebe a na-edebe ihe oyiyi nkịtị nke ụlọikwuu n’okpuru amaokwu.
theological_decisions:
- issue: Ihe “akụ na ụba nke ajọ omume” pụtara
  choice: E debere okwu ahụ n’ụzọ sara mbara, ka ọ ghara ịpụta naanị akụ e nwetara n’aghụghọ.
  alternative: Akụ e nwetara n’ụzọ aghụghọ; ma ọ bụ Mamọn dịka ike e mere onye.
  rationale: Njikọ okwu Grik ahụ nwere ike igosi akụ nke ụwa mmehie a n’ozuzu ya. Nsụgharị ahụ anaghị amanye naanị otu nkọwa.
- issue: Onye ma ọ bụ ihe bụ isiokwu nke ἐκλίπῃ
  choice: Akụ na ụba ahụ ga-agwụ.
  alternative: Mgbe unu dara, ya bụ, nwụọ; ma ọ bụ mgbe ihe onwunwe ụwa gwụrụ.
  rationale: Akụ na ụba bụ ihe e kwuru ozugbo tupu ngwaa ahụ, ma Grik ekwughị isiokwu ya hoo haa; ya mere a debere ụzọ ndị ọzọ n’okpuru amaokwu.
- issue: Ndị “ha” ga-anabata unu bụ ndị nke ha
  choice: A hapụrụ njirimara ha n’enweghị nkọwa.
  alternative: Ndị enyi e nwetara site n’iji akụ mee ihe ọma; ndị ogbenye ma ọ bụ ndị Chineke; ndị nke eluigwe.
  rationale: Grik enyeghị aha doro anya nye isiokwu nke δέξωνται, ya mere ịkpọ otu ìgwè aha ga-abụ itinye nkọwa n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere nkwusi ike nke καὶ ἐγώ site na “Mụ onwe m,” jiri ụdị iwu ọtụtụ mmadụ “Jirinụ… meere,” ma zere ịkọwapụta onye “ha” bụ ma ọ bụ ime ka akụ ahụ bụrụ naanị ego e nwetara n’aghụghọ.
