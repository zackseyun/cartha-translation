review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the imperative to make friends for oneself, the instrumental use of unrighteous wealth, the unexpressed subject of ἐκλίπῃ, the unspecified plural subject of δέξωνται, and the eternal dwellings. The wording of the purpose clause should more clearly mark the Greek ἵνα with an Igbo purposive construction.
  naturalness: Most wording is clear Standard Igbo. “Ka ọ ga-abụ na … ha anabata” is less idiomatic and weakens the purpose/result connection. “Ka, mgbe …, ha wee nabata” is natural and retains the intended relationship.
  terminology: “Akụ na ụba nke ajọ omume” is a serviceable broad rendering of μαμωνᾶ τῆς ἀδικίας and does not restrict the phrase to fraudulently acquired money. “Ebe obibi ebighị ebi” appropriately communicates σκηναί in the main text, while the literal tent image is retained in the footnote.
  issues:
  - severity: medium
    issue: The main clause following “ka ọ ga-abụ” uses indicative “ha anabata.”
    rationale: The Greek ἵνα introduces the intended purpose, followed by a temporal clause. Revising to “ka, mgbe ọ gwụsịrị, ha wee nabata unu” gives a natural Igbo purposive expression without resolving who “ha” are.
  - severity: low
    issue: Footnote b’s alternative “mgbe unu dara” is potentially misleading in Igbo.
    rationale: Although it follows the English audit trail’s wording, “fall” in Igbo does not naturally convey the proposed interpretation of death. “Mgbe unu nwụsịrị” states that interpretive alternative clearly while identifying it as an alternative understanding.
  revised_text: 'Mụ onwe m na-agwa unu sị: Jirinụ akụ na ụba nke ajọ omume[a] meere onwe unu ndị enyi, ka, mgbe ọ gwụsịrị[b], ha wee nabata unu n’ebe obibi ebighị ebi[c].'
