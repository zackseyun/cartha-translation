  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: ig
  text: O nwere otu nwoke bara ọgaranya. Ọ na-eyikarị uwe e ji akwa odo odo na akwa linin dị ezigbo mma mee, na-ekpori ndụ n'ụzọ okomoko kwa ụbọchị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-eri oriri n’ụzọ dị oke ọnụ kwa ụbọchị.” Okwu Grik εὐφραινόμενος nwere ike ịpụta ikpori ndụ ma ọ bụ iri oriri, ebe λαμπρῶς na-emesi ịdị ebube na okomoko ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: O nwere otu nwoke
  rationale: Nke a na-ewebata onye a na-akọwaghị aha ya n'ụzọ nkịtị n'Igbo; a naghị amanye δέ ka ọ bụrụ okwu na-egosi oge.
- source_word: πλούσιος
  choice: bara ọgaranya
  rationale: Ọ na-egosi n'ụzọ doro anya na nwoke ahụ nwere nnukwu akụnụba.
- source_word: ἐνεδιδύσκετο
  choice: na-eyikarị
  rationale: Ụdị imperfect na-egosi omume ọ na-eme mgbe niile; “na-eyikarị” na-egosipụta àgwà ahụ nke ọma.
- source_word: πορφύραν
  choice: uwe e ji akwa odo odo ... mee
  rationale: πορφύρα na-anọchi anya uwe e ji akwa e tere odo odo dị oke ọnụ mee; itinye “uwe” na-eme ka metonymy ahụ doo onye Igbo anya.
- source_word: βύσσον
  choice: ezi linen
  rationale: βύσσος bụ akwa linen dị mma ma dị oke ọnụ; “ezi linen” na-echekwa ma ụdị akwa ahụ ma ogo ya.
- source_word: εὐφραινόμενος
  choice: na-ekpori ndụ
  rationale: Okwu a nwere ike ịpụta ịnụ ụtọ ndụ, ime ememme, ma ọ bụ iri oriri; “na-ekpori ndụ” na-echekwa obosara ihe ọ pụtara n'etinyeghị naanị iri oriri.
- source_word: καθ’ ἡμέραν
  choice: kwa ụbọchị
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosi ihe a na-eme ụbọchị niile.
- source_word: λαμπρῶς
  choice: n'ụzọ okomoko
  rationale: N'ọnọdụ a, adverb ahụ na-egosi ndụ mara mma, dị oke ọnụ, juputara n'ọṅụ na ihe ọma; “n'ụzọ okomoko” dabara na ọnọdụ akụnụba ahụ.
