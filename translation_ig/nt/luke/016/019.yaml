translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji usoro okwu dị mfe mee ka amaokwu ahụ doo ndị nkịtị anya, ma e chekwara nghọtahie ziri ezi dị na εὐφραινόμενος site n'isiokwu ukwu na nkọwa ala peeji.
