translation:
  language: ig
  text: Ha nọkwa na-ekwu ọtụtụ okwu nkwulu ndị ọzọ megide ya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ọtụtụ okwu mkparị ndị ọzọ” ma ọ bụ “ọtụtụ okwu ịkpọasị ndị ọzọ.” Okwu Grik a pụrụ ịpụta ikwu okwu mkparị ma ọ bụ ikwutọ n’ozuzu ya, ọ bụ ezie na “okwu nkwulu” na-edobe ịdị arọ ya n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “nye ya.” A pụrụ ịsụgharị preposition Grik ahụ otú ahụ n’ụzọ nkịtị, ma n’ọnọdụ a, “megide ya” na-egosi nke ọma na okwu ahụ bụ nke iro.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: nọkwa
  rationale: “Kwa” jikọtara amaokwu a na mkparị ndị e kwuru n’amaokwu bu ya ụzọ; itinye ya n’usoro “Ha nọkwa” bụ Igbo dị eke.
- source_word: ἕτερα πολλὰ
  choice: ọtụtụ ... ndị ọzọ
  rationale: Nke a na-edobe ma echiche nke ịba ụba ma nke ihe ndị ọzọ e tinyere n’ihe ndị e kwuburu.
- source_word: βλασφημοῦντες
  choice: okwu nkwulu
  rationale: βλασφημέω nwere ike ịpụta ikwu okwu nkwulu, ikwutọ, ma ọ bụ ịkparị. “Okwu nkwulu” na-edobe ịdị arọ nke okwu Grik n’ebe a, ma nkọwa ala peeji na-egosi nghọta sara mbara ya.
- source_word: ἔλεγον
  choice: nọ ... na-ekwu
  rationale: Ụdị imperfect na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro; usoro a bụ ụzọ Igbo si egosipụta ya n'ụzọ eke.
- source_word: εἰς αὐτόν
  choice: megide ya
  rationale: Ọ bụ ezie na εἰς nwere ike ịbụ “gwa ya,” n’ọnọdụ okwu iro a, “megide ya” na-egosi ebumnobi mmegide nke ọma.
theological_decisions:
- issue: Ma a ga-eme ka βλασφημοῦντες bụrụ naanị mkparị nkịtị ka a ga-edobe ịdị arọ ya
  choice: Edobere “okwu nkwulu.”
  alternative: “okwu mkparị” ma ọ bụ “okwu mkparị jọgburu onwe ya”
  rationale: “Okwu nkwulu” dabara n’otu akụkụ pụtara ìhè nke βλασφημέω ma na-edobe ịdị arọ nke okwu ahụ. N’otu oge ahụ, nkọwa [a] na-echekwa ohere lexical nke okwu mkparị ma ọ bụ okwu mkparị jọgburu onwe ya, n’enweghị itinye nkọwa ozizi n’ime amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo anya. “Ha nọkwa na-ekwu” na-egosipụta omume na-aga n’ihu nke imperfect; “okwu nkwulu” bụ okwu ndị nkịtị ga-aghọta, ebe nkọwa ala peeji na-echekwa nhọrọ ndị ọzọ dị n’okwu Grik.
