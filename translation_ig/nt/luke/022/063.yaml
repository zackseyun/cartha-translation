  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: ig
  text: Ndị ikom ndị na-ejide ya nọ na-akwa ya emo ma na-eti ya ihe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị ikom ndị na-edobe ya n’okpuru nche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: (E gosipụtara njikọ ahụ site n’ịga n’ihu n’akụkọ ahụ, n’enweghị okwu njikọ pụrụ iche)
  rationale: N’Igbo, ịmalite ahịrịokwu a na “Ma” nwere ike igosi mmegide na-adịghị na Grik, ebe “Na” agaghị adị eke. Ịga n’ihu ozugbo na-echekwa usoro akụkọ ahụ n’Igbo dị ire.
- source_word: ἄνδρες
  choice: Ndị ikom
  rationale: Grik kwuru kpọmkwem “ndị ikom,” ọ bụghị “ndị nche” ma ọ bụ “ndị agha”; nke a na-ezere ime ka njirimara ha pụta karịa ihe ederede kwuru.
- source_word: συνέχοντες
  choice: jidere ya
  rationale: N’ebe a, συνέχω na-egosi ijide Jizọs ma debe ya n’okpuru ha. “Jidere ya” bụ okwu Igbo doro anya ma dị eke nke na-echekwa echiche anụahụ nke ijide mmadụ, n’enweghị ịkọwa usoro mkpọrọ kpọmkwem.
- source_word: ἐνέπαιζον αὐτῷ
  choice: na-akwa ya emo
  rationale: “Ịkwa mmadụ emo” na-egosi ịkwa ya ọchị n’ụzọ mkparị na nlelị, ma na-enye dative αὐτῷ dị ka onye a na-eme ya.
- source_word: δέροντες
  choice: ma na-eti ya ihe
  rationale: Participle a na-egosi iti ihe na-aga n’otu oge na ịkwa emo. “Na-eti ya ihe” doro anya, ma ọ naghị eme ka ihe ahụ bụrụ ịpịa ụtarị kpọmkwem.
theological_decisions:
- issue: Njirimara ndị na-emegbu Jizọs
  choice: Ndị ikom ahụ jidere ya
  alternative: Ndị nche ahụ jidere ya
  rationale: Ederede Grik ji okwu izugbe ἄνδρες, “ndị ikom.” Ọ bụ ezie na ọnọdụ akụkọ ahụ na-egosi na ha na-edebe ya n’okpuru nche, nsụgharị ahụ ekwesịghị ịkpọ ha “ndị nche” mgbe okwu Grik ekwughị ya kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji usoro “nọ na-akwa ... ma na-eti ...” gosi omume abụọ na-aga n’ihu n’otu oge. Ihe nrịbama [a] dị n’isi ederede dịka achọrọ.
