revisions:
- from: Ndị ikom ahụ jidere ya nọ na-akwa ya emo ma na-eti ya ihe.[a]
  to: Ndị ikom ndị na-ejide ya nọ na-akwa ya emo ma na-eti ya ihe.[a]
  rationale: Replacing “jidere ya” with “ndị na-ejide ya” preserves the ongoing force of συνέχοντες and avoids suggesting merely that these were the men who had arrested Jesus. The footnote supplies the custodial alternative without identifying the men more specifically than the Greek does.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders ἄνδρες as “Ndị ikom,” ἐνέπαιζον as “na-akwa ya emo,” and δέροντες as accompanying physical beating without incorrectly specifying flogging. However, “ndị ikom ahụ jidere ya” naturally identifies the men as those who previously seized him, whereas συνέχοντες is a present participle describing those currently holding or keeping him in custody.
  naturalness: “Ndị ikom ndị na-ejide ya nọ na-akwa ya emo ma na-eti ya ihe” is natural, clear Standard Igbo. It preserves the narrative sense without requiring an explicit equivalent for Greek Καὶ, whose connective force can be carried by Igbo discourse flow.
  terminology: “Ndị ikom” properly avoids importing “guards” or “soldiers.” “Na-ejide ya” best retains the ongoing custodial sense of συνέχοντες. “Na-akwa ya emo” and “na-eti ya ihe” are idiomatic and suitably serious in register.
  issues:
  - severity: medium
    issue: The main clause uses “jidere ya.”
    rationale: This completed past form can mean “the men who arrested/seized him,” rather than “the men who were holding him,” which is the sense of the Greek present participle συνέχοντες.
  revised_text: Ndị ikom ndị na-ejide ya nọ na-akwa ya emo ma na-eti ya ihe.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị ikom ndị na-edobe ya n’okpuru nche.”
    reason: lexical_alternative
  revision_rationale: Replacing “jidere ya” with “ndị na-ejide ya” preserves the ongoing force of συνέχοντες and avoids suggesting merely that these were the men who had arrested Jesus. The footnote supplies the custodial alternative without identifying the men more specifically than the Greek does.
