  text: ἐὰν ⸀δὲ ἐρωτήσω, οὐ μὴ ⸀ἀποκριθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/068.yaml
  text: But if I ask[a], you will certainly not answer.
translation:
  language: ig
  text: Ma ọ bụrụ na m ajụọ unu ajụjụ, unu agaghị aza ma ọlị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Ọ na-ewebata ahịrịokwu nke ọnọdụ; ‘ọ bụrụ na’ bụ ụzọ Igbo nkịtị si ekwu ya n’enweghị itinye nkwusi ike ọzọ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti okwu a na nke gbara ya gburugburu; ‘Ma’ na-egosipụta ọdịiche ahụ nke ọma.
- source_word: ἐρωτήσω
  choice: m ajụọ unu ajụjụ
  rationale: N’ọnọdụ a, ọ pụtara ịjụ ndị a na-agwa okwu ajụjụ. Ikwughachi echiche ‘ajụ ... ajụjụ’ bụ Igbo doro anya ma dịkwa eke, n’enweghị ime ka ọ bụrụ ajụjụ ikpe siri ike karịa ihe Grik kwuru.
- source_word: οὐ μὴ
  choice: agaghị ... ma ọlị
  rationale: Njikọ a bụ nkwụsi ike siri ike n’ịjụ ihe. ‘Agaghị ... ma ọlị’ na-edobe nkwusi ike ahụ n’Igbo nke oge a.
- source_word: ἀποκριθῆτε
  choice: aza
  rationale: Ọ pụtara ịza ma ọ bụ imeghachi okwu; ‘aza’ bụ okwu Igbo kacha kpọmkwem ma kwekọọ n’ọnọdụ ajụjụ a.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A hapụrụ ụda ọnọdụ na nkwusi ike nke οὐ μὴ ka ha dị, n’enweghị ịgbakwunye nkọwa ụka.
