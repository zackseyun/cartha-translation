  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: ig
  text: Mgbe ndị nọ ya gburugburu hụrụ ihe na-aga ime, ha sịrị, “Onyenwe anyị, anyị ọ̀ ga-eji mma agha[a] tie?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ́ μάχαιρα nwere ike ịpụta mma agha ma ọ bụ mma ọgụ dị mkpụmkpụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: Mgbe ... hụrụ
  rationale: A sụgharịrị aorist participle ahụ dị ka nkebiokwu oge n’Igbo ka njikọ ya na ngwaa bụ́ isi doo anya ma bụrụkwa okwu e ji eme ihe n’ụzọ nkịtị.
- source_word: οἱ περὶ αὐτὸν
  choice: ndị nọ ya gburugburu
  rationale: Nke a na-egosi ndị ha na Jizọs nọ n’ebe ahụ n’enweghị ịkpọ ha ‘ndị na-eso ụzọ’ ma ọ bụ ịkọwa ha karịa ihe Grik kwuru.
- source_word: τὸ ἐσόμενον
  choice: ihe na-aga ime
  rationale: Nkebiokwu a na-egosi ihe dị nso ime; ‘ihe na-aga ime’ bụ ụzọ doro anya ma dịkwa nkịtị isi kwuo ya n’Igbo.
- source_word: εἶπαν
  choice: ha sịrị
  rationale: Nke a na-edobe ihe λέγω pụtara kpọmkwem; akara ajụjụ na-egosi na okwu ha bụ ajụjụ.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị akpọ Jizọs dị ka κύριος, ma na-edobe nkwanye ùgwù na ịdị arọ nke utu aha ahụ.
- source_word: εἰ πατάξομεν
  choice: anyị ọ̀ ga-... wakpo ha?
  rationale: εἰ na future indicative na-eweta ajụjụ banyere ihe ha kwesịrị ime. ‘Anyị ọ̀ ga-...?’ na-egosipụta nke a n’Igbo nkịtị. A họọrọ ‘wakpo ha’ maka πατάξομεν n’ọnọdụ ọgụ a; ‘ha’ na-eme ka ahịrịokwu ahụ zuo oke n’Igbo ma na-ezo aka n’ìgwè ahụ na-abịa ijide Jizọs.
- source_word: ἐν μαχαίρῃ
  choice: jiri mma agha
  rationale: ἐν bụ nke e ji gosi ngwa ọrụ n’ebe a. ‘Jiri mma agha’ na-egosi na ọ bụ ngwá ọgụ ha ga-eji; Igbo anaghị eji article akọwa ọdịiche dị n’etiti ‘the sword’ na ‘a sword’.
theological_decisions:
- issue: Nsụgharị κύριος mgbe a na-akpọ Jizọs okwu
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: ‘Onyenwe anyị’ na-edobe κύριος dị ka utu aha nwere nkwanye ùgwù na ihe ọ pụtara n’okwukwe, kama ime ka ọ bụrụ naanị aha nkwanye ùgwù mmadụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ajụjụ ‘anyị ọ̀ ga-...?’ na-ada nke ọma n’okwu ọnụ, ebe ‘mma agha’ na-enye echiche nke ngwá ọgụ n’enweghị ịmanye ụdị ngwá agha ahụ karịa ihe μάχαιρα kwadoro.
