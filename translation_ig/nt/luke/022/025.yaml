source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Ndị eze nke ndị mba ọzọ[a] na-achị ha dịka ndị nwe ha, a na-akpọkwa ndị na-eji ikike achị ha ‘ndị na-emere mmadụ ihe ọma.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: “Ndị na-emere mmadụ ihe ọma” bụ aha nsọpụrụ e ji akpọ ndị eze ma ọ bụ ndị ọzọ nwere ikike, bụ́ ndị e weere dịka ndị na-ewetara ọha mmadụ uru.
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: ndị eze
  rationale: Okwu Grik a pụtara ndị eze kpọmkwem, ọ bụghị naanị ndị ọchịchị n’ozuzu.
- source_word: τῶν ἐθνῶν
  choice: nke ndị mba ọzọ
  rationale: N’akwụkwọ Luk na Ọrụ Ndị Ozi, okwu a na-ezokarị aka ná ndị na-abụghị ndị Juu; e deberekwa ‘mba dị iche iche’ dị ka nkọwa ọzọ n’ala peeji.
- source_word: κυριεύουσιν
  choice: na-achị ha n’ike dị ka ndị nwe ha
  rationale: Nkebiokwu a na-egosi ịchị mmadụ dịka onye nwe ya ma ọ bụ iji ike na-achị ya, nke dabara n’ọdịiche Jizọs na-akọwa.
- source_word: ἐξουσιάζοντες
  choice: ndị na-eji ikike achị ha
  rationale: 'Nsụgharị a na-edebe omume dị n’okwu ahụ: ọ bụghị naanị na ha nwere ọkwá, kama ha na-eji ikike ha achị.'
- source_word: εὐεργέται
  choice: Ndị Na-emere Ọha Mmadụ Ihe Ọma
  rationale: A sụgharịrị aha nsọpụrụ a n’ụzọ onye Igbo nke oge a ga-aghọta, ma ihe odide ala peeji kọwara otú e si eji ya n’oge ahụ.
- source_word: καλοῦνται
  choice: a na-akpọkwa
  rationale: Nke a na-egosipụta olu nnara nke okwu Grik ahụ n’ụzọ doro anya ma dịkwa eke n’Igbo.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi obere ọdịiche dị n’etiti okwu Jizọs na esemokwu ndị na-eso ụzọ ya a kọrọ n’amaokwu ndị bu ụzọ.
theological_decisions:
- issue: Ihe τῶν ἐθνῶν pụtara n’ebe a
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: ‘Ndị mba ọzọ’ na-egosipụta ihe okwu a na-apụtakarị n’Agba Ọhụrụ—ndị na-abụghị ndị Juu—ma nkọwa ọzọ na-echekwa nghọta sara mbara nke ‘mba dị iche iche’ n’enweghị ịmanye otu nghọta naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Nkebiokwu ‘na-achị ha n’ike dị ka ndị nwe ha’ na-eburu echiche nke ịchị n’aka ike, ebe aha nsọpụrụ ahụ nọ n’ime akara nhota ma malite n’ mkpụrụedemede ukwu iji gosi na ọ bụ utu aha.
