  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: ig
  text: Mgbe ọ ka na-ekwu okwu, lee, ìgwè mmadụ bịara. Onye a na-akpọ Judas, otu n’ime ndị iri na abụọ ahụ, na-aga n’ihu ha[a]. Ọ bịaruru Jizọs nso ka o susuo ya ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-edu ha” ma ọ bụ “gara ha n’ihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: Mgbe ọ ka na-ekwu okwu
  rationale: Nke a na-egosipụta omume na-aga n’ihu n’otu oge ihe sochirinụ mere; “ka” na-echekwa echiche nke ἔτι.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ okwu Igbo doro anya nke na-adọta uche onye na-agụ ma na-eme ka mbata ìgwè mmadụ ahụ pụta ìhè na akụkọ ahụ.
- source_word: ὄχλος
  choice: ìgwè mmadụ bịara
  rationale: “Ìgwè mmadụ” na-enye ihe ὄχλος pụtara; a gbakwụnyere “bịara” ka ahịrịokwu ahụ bụrụ Igbo zuru oke ma gosipụta mbata ha nke ọnọdụ akụkọ ahụ na-egosi.
- source_word: ὁ λεγόμενος Ἰούδας
  choice: Onye a na-akpọ Judas
  rationale: Nke a na-esochi ụzọ Grik si kọwaa onye ahụ n’ebughị echiche ọzọ banyere ya bata.
- source_word: εἷς τῶν δώδεκα
  choice: otu n’ime mmadụ iri na abụọ ahụ
  rationale: Ọ na-echekwa njirimara Judas dịka otu onye n’ime ndị iri na abụọ ahụ, tinyere ịdị arọ nke ihe ọ na-eme n’akụkọ a.
- source_word: προήρχετο αὐτούς
  choice: na-aga n’ihu ha
  rationale: Ọ na-echekwa ọdịdị imperfect nke ngwaa ahụ na isi echiche nke ịga n’ihu ìgwè ahụ, n’ekwughị hoo haa na ọ bụ onye ndu ha.
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: Ọ bịaruru Jizọs nso
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ na echiche nke ịbịaru mmadụ nso.
- source_word: φιλῆσαι αὐτόν
  choice: ka o susuo ya ọnụ
  rationale: “Isusu ọnụ” bụ okwu Igbo nkịtị maka isusu mmadụ ọnụ; ọ naghị agbakwunye nkọwa na nsusu ahụ bụ ekele ma ọ bụ nrara nye.
theological_decisions:
- issue: Otú e si kọwaa omume Judas
  choice: A kọwara na ọ bịaruru Jizọs nso ka o susuo ya ọnụ, n’etinyeghị okwu dịka “ịrara ya nye.”
  alternative: “ka o jiri nsusu ọnụ rara ya nye”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi nrara nye, ma okwu Grik nke amaokwu a n’onwe ya kwuru naanị banyere ịbịaru nso na isusu ọnụ. Ya mere, nsụgharị ahụ echekwala esemokwu na ịdị arọ nke akụkọ ahụ n’ebughị nkọwa ọzọ bata.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere “lee” iji chekwaa ike okwu akụkọ ahụ ji adọta uche. E tinyere akara ala ala peeji [a] ozugbo n’akụkụ okwu “na-aga n’ihu ha,” bụ́ ebe nhọrọ ntụgharị ahụ metụtara.
