id: LUK.22.59
reference: Luke 22:59
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: ig
  text: Mgbe ihe dị ka otu awa gafere, nwoke ọzọ[a] kwusiri ike, sị, “N’ezie, onye a sokwa ya nọrọ, n’ihi na ọ bụkwa onye Galili.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ọzọ.” Okwu Grik ahụ akọwaghị kpọmkwem onye ahụ, ọ bụ ezie na ọnọdụ akụkọ ahụ na-egosi na onye kwuru okwu bụ nwoke.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: Mgbe ihe dị ka otu awa gafere
  rationale: Nkebi a na-egosi na ihe dị ka otu awa agafeela; nsụgharị a bụ Igbo dị mfe ma na-edobe echiche nke oge e mere atụmatụ ya.
- source_word: ἄλλος τις
  choice: nwoke ọzọ[a]
  rationale: Okwu Grik ahụ pụtara onye ọzọ a na-akọwaghị kpọmkwem. Ọnọdụ akụkọ ahụ na-egosi na onye kwuru okwu bụ nwoke, ma e tinyere nkọwa ala peeji iji chekwaa ọdịdị na-edochaghị anya nke okwu Grik ahụ.
- source_word: διϊσχυρίζετο
  choice: kwusiri ike
  rationale: Ngwaa ahụ na-egosi nkwupụta siri ike ma ọ bụ nke e ji obi ike na-ekwusi ike; okwu Igbo a na-ebute ike ahụ n'ụzọ e ji asụ Igbo ugbu a.
- source_word: Ἐπ’ ἀληθείας
  choice: N’ezie
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma dị ugwu isi webata nkwupụta e mesiri eziokwu ya ike.
- source_word: οὗτος
  choice: onye a
  rationale: Ọ na-atụ aka na Pita n’ụzọ pụtara ìhè, ma ọ naghị agbakwunye nkọwa na-adịghị na Grik.
- source_word: μετ’ αὐτοῦ ἦν
  choice: sokwa ya nọrọ
  rationale: Nke a na-edobe nkwupụta na Pita nọnyere Jizọs n’enweghị ịkọwa mmekọrịta ahụ karịa ka isi mmalite si kwuo.
- source_word: καὶ γὰρ
  choice: n’ihi na ọ bụkwa
  rationale: “N’ihi na” na-enye ihe mere onye ahụ ji kwuo ebubo ahụ, ebe “bụkwa” na-edobe echiche nke καί, ya bụ na Pita sokwa bụrụ onye Galili.
- source_word: Γαλιλαῖός ἐστιν
  choice: onye Galili
  rationale: Nke a na-akọwa Pita site n’ógbè o si, dịka ahịrịokwu Grik ahụ si mee.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ugwu mee nsụgharị ahụ. A tụkwasịghị nkọwa ụka ma ọ bụ ozizi pụrụ iche n’ihe odide ahụ.
