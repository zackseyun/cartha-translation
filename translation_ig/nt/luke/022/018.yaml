id: LUK.22.18
reference: Luke 22:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: ig
  text: N’ihi na ana m agwa unu, site ugbu a gaa n’ihu, agaghị m aṅụ ihe osisi vaịn na-amị[a] ma ọlị ruo mgbe alaeze Chineke ga-abịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmanya vaịn.” N’asụsụ Grik, okwu ya bụ “ihe osisi vaịn na-amị,” okwu sara mbara nke o yiri ka ọ na-ezo aka n’ihe dị n’iko ahụ n’ejighị aha nkịtị a na-akpọ mmanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: N’ihi na ana m agwa unu
  rationale: “Ana m agwa unu” bụ ụzọ Igbo dị ugbu a si ekwu usoro okwu a na-agwa ndị mmadụ ozugbo. “N’ihi na” na-edobe njikọ nkọwa nke γάρ na okwu bu ụzọ.
- source_word: οὐ μὴ πίω
  choice: agaghị m aṅụ ... ma ọlị
  rationale: Njikọ “agaghị m ... ma ọlị” na-egosipụta nkwusi ike dị n’ọjụjụ οὐ μή, ma ọ naghị atụgharị ya ka ọ bụrụ “mgbe ebighị ebi,” ebe ahịrịokwu “ruo mgbe” nyere ya oke oge.
- source_word: ἀπὸ τοῦ νῦν
  choice: site ugbu a gaa n’ihu
  rationale: Nke a bụ okwu Igbo doro anya nke na-egosi na ihe ahụ malitere ugbu a ma na-aga n’ihu.
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: ihe si n’osisi vaịn pụta
  rationale: Nhọrọ a na-edobe echiche sara mbara nke γένημα, ya bụ ihe osisi vaịn mepụtara, n’akọwaghị ya kpọmkwem dị ka mmanya vaịn. Ọ dịkwa mfe nghọta karịa ntụgharị mkpụrụokwu n’ahịrị nke ga-eme ka ọ dị ka a na-aṅụ mkpụrụ osisi n’onwe ya.
- source_word: ἕως οὗ
  choice: ruo mgbe
  rationale: “Ruo mgbe” na-egosi oke oge nke ọjụjụ ahụ n’ụzọ Igbo sitere n’okike.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: “Alaeze Chineke” bụ okwu Igbo a maara nke ọma, ma na-ahapụkwa echiche nke ọchịchị na mpaghara eze n’enweghị ime ka otu naanị bụrụ ihe ama ama.
- source_word: ἔλθῃ
  choice: ga-abịa
  rationale: Ọdịdị a na-egosi ihe a na-atụ anya n’ọdịnihu mgbe “ruo mgbe” gasịrị, kwekọrọ n’aorist subjunctive nke Grik.
theological_decisions:
- issue: Ma a ga-atụgharị γενήματος τῆς ἀμπέλου kpọmkwem dị ka “mmanya vaịn”
  choice: ihe si n’osisi vaịn pụta
  alternative: mmanya vaịn
  rationale: Grik ji okwu sara mbara karịa aha nkịtị e ji akpọ mmanya. Idebe okwu ahụ sara mbara na-ezere itinye nkọwa dị warara karịa ihe ederede kwuru, ebe ndetu ala peeji na-enye nhọrọ a na-atụ anya ya n’ọnọdụ nri ahụ.
- issue: Ụdị ma ọ bụ ogo ọbịbịa nke alaeze Chineke
  choice: ruo mgbe alaeze Chineke ga-abịa
  alternative: ruo mgbe alaeze Chineke ga-abịa n’uju
  rationale: Ederede ahụ kwuru naanị banyere ọbịbịa alaeze dị n’ọdịnihu; ọ kọwaghị ma nke a bụ mmalite ya, mmezu ya n’uju, ma ọ bụ otu usoro nkà mmụta banyere ọgwụgwụ ụwa. Ntụgharị a na-ahapụ mgbagwoju na esemokwu nkà mmụta okpukpe ahụ ka ha dị.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ma ọlị” na-enye ọjụjụ ahụ ike, ebe “site ugbu a gaa n’ihu” na-edobe mmalite oge ahụ. A hapụrụ okwu banyere alaeze Chineke n’enweghị ịgbakwunye nkọwa otu ụka ma ọ bụ usoro nkà mmụta okpukpe ọ bụla.
