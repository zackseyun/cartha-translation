review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the explanatory γάρ, the emphatic future negation οὐ μή, the present starting point, the temporal limit, and the future-oriented coming of God’s kingdom. Its rendering of γενήματος τῆς ἀμπέλου is intentionally broader than “wine,” as required. However, “ihe si n’osisi vaịn pụta” is an unnecessarily mechanical expression and is less idiomatic than a phrase referring to what the vine bears.
  naturalness: The sentence is generally clear Standard Igbo. Replacing the literal-sounding “ihe si n’osisi vaịn pụta” with “ihe osisi vaịn na-amị” gives a more natural expression while retaining the source’s nontechnical breadth. The emphatic “agaghị m aṅụ ... ma ọlị” is natural and appropriately strong.
  terminology: “Alaeze Chineke” is established Standard Igbo biblical terminology and suitably retains the breadth of βασιλεία. “Osisi vaịn” is understandable for vine/grapevine. “Ihe osisi vaịn na-amị” preserves the distinction between the broader Greek expression and the narrower alternative “mmanya vaịn.”
  issues:
  - severity: low
    issue: The phrase “ihe si n’osisi vaịn pụta” is overly literal and slightly awkward in this drinking context.
    rationale: Although semantically defensible, it reads as a general product that comes out of a plant. “Ihe osisi vaịn na-amị” is idiomatic Igbo for what a vine bears and preserves the Greek expression’s broader wording without explicitly substituting “wine.”
  revised_text: N’ihi na ana m agwa unu, site ugbu a gaa n’ihu, agaghị m aṅụ ihe osisi vaịn na-amị[a] ma ọlị ruo mgbe alaeze Chineke ga-abịa.
