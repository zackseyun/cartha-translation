revisions:
- from: N’ihi na ana m agwa unu, site ugbu a gaa n’ihu, agaghị m aṅụ ihe si n’osisi vaịn pụta[a] ma ọlị ruo mgbe alaeze Chineke ga-abịa.
  to: N’ihi na ana m agwa unu, site ugbu a gaa n’ihu, agaghị m aṅụ ihe osisi vaịn na-amị[a] ma ọlị ruo mgbe alaeze Chineke ga-abịa.
  rationale: The revision makes only a stylistic and lexical-naturalness adjustment to the phrase for γενήματος τῆς ἀμπέλου. It continues to avoid identifying the drink explicitly as wine in the main text, retains the footnoted alternative, and leaves the eschatological wording unexpanded.
