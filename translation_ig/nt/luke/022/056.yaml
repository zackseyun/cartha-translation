  to: Mgbe ahụ, otu nwa agbọghọ na-eje ozi hụrụ ya ka ọ nọ ọdụ n'akụkụ ìhè ahụ[a]. O legidere ya anya nke ọma wee sị, “Nwoke a sokwa ya nọ.”
