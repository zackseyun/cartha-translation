  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: ig
  text: Mgbe ahụ, otu nwa agbọghọ na-eje ozi hụrụ ya ka ọ nọ ọdụ n'akụkụ ìhè ahụ[a]. O legidere ya anya nke ọma wee sị, “Nwoke a sokwa ya nọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n'ebe ìhè ahụ na-enwu.” Nkebi okwu Grik ahụ nwere ike ịpụta ịnọ nso n'ebe ìhè si abịa ma ọ bụ ịnọ n'ime ebe ìhè ahụ na-enwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα δὲ
  choice: Mgbe ahụ ... hụrụ
  rationale: δὲ na-aga n'ihu n'akụkọ ahụ, ebe ἰδοῦσα na-egosi mgbe nwa agbọghọ ahụ hụrụ Pita. Nhazi a bụ Igbo dị eke ma na-edebe usoro ihe mere.
- source_word: παιδίσκη τις
  choice: otu nwa agbọghọ na-eje ozi
  rationale: παιδίσκη τις na-ezo aka n'otu nwa agbọghọ bụ onye na-eje ozi. Nhọrọ a na-egosi ma afọ/okike ya ma ọrụ ya, n'ebughị ụzọ mesie ọnọdụ ịbụ ohu ike karịa ihe amaokwu ahụ chọrọ.
- source_word: καθήμενον πρὸς τὸ φῶς
  choice: ka ọ nọ ọdụ n'akụkụ ìhè[a]
  rationale: καθήμενον na-akọwa na Pita nọ ọdụ; πρὸς τὸ φῶς nwere ike ịpụta na ọ nọ nso n'ebe ìhè si abịa ma ọ bụ n'ebe ìhè na-enwu. “N'akụkụ ìhè” na-edebe njikọ ọnọdụ ahụ n'ejighị ọkụ kpọmkwem tinye n'amaokwu a.
- source_word: ἀτενίσασα αὐτῷ
  choice: O legidere ya anya nke ọma
  rationale: ἀτενίζω na-egosi ile mmadụ anya nke ọma na nke lekwasịrị anya. Nkebi ahịrị a na-enye ike ahụ n'Igbo dị mfe nghọta.
- source_word: Καὶ οὗτος
  choice: Nwoke a sokwa
  rationale: οὗτος bụ ntụaka doro anya nye nwoke ahụ, καί na-egosikwa “kwa.” “Nwoke a sokwa” na-edebe ụda nke ịmata na ịkọwa onye ahụ.
- source_word: σὺν αὐτῷ ἦν
  choice: ya nọrọ
  rationale: N'usoro “Nwoke a sokwa ya nọrọ,” okwu a na-egosi na Pita so Jizọs nọ. Ọ bụ ntụgharị Igbo dị eke nke echiche mkpakọrịta dị na σύν.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E kewara participles Grik ahụ n'ahịrịokwu abụọ ka okwu ahụ daa nke ọma n'Igbo, n'agbanweghi usoro echiche. Akara ntụaka [a] dị ozugbo n'akụkụ nkebi okwu ọ na-akọwa.
