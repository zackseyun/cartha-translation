  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐξωμολόγησεν, καὶ ἐζήτει εὐκαιρίαν τοῦ παραδοῦναι αὐτὸν ⸂ἄτερ ὄχλου αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/006.yaml
  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: ig
  text: O kwetara, wee malite ịchọ ohere ọ ga-eji nyefee ya n’aka ha na-enweghị ìgwè mmadụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: O kwetara
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi na Judas nabatara ihe ndị isi nchụaja kwuru, ọ bụghị na o kwupụtara mmehie.
- source_word: ἐζήτει
  choice: wee malite ịchọ
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke malitere n’oge ahụ; okwu a na-egosipụta mgbanwe akụkọ ahụ n’Igbo dị mfe.
- source_word: εὐκαιρίαν
  choice: ohere
  rationale: “Ohere” bụ okwu Igbo nkịtị nke na-egosi oge ma ọ bụ ọnọdụ dabara adaba iji mee ihe ahụ.
- source_word: τοῦ παραδοῦναι αὐτόν
  choice: ọ ga-eji nyefee ya n’aka ha
  rationale: “Nyefee ya n’aka ha” na-edobe isi echiche παραδίδωμι, bụ́ inyefe mmadụ n’aka ndị ọzọ, n’etinyeghị nkọwa “ịrara mmadụ nye” ozugbo.
- source_word: ἄτερ ὄχλου
  choice: mgbe ìgwè mmadụ na-anọghị ya
  rationale: Nke a na-egosi n'ụzọ doro anya na Judas chọrọ oge ìgwè mmadụ na-agaghị anọ, dịka ἄτερ ὄχλου si pụta.
- source_word: αὐτοῖς
  choice: n’aka ha
  rationale: Nke a na-egosi ndị a ga-enyefe Jizọs n’aka ha, ya bụ ndị e kwuru okwu ha n’amaokwu ndị bu ụzọ.
theological_decisions:
- issue: Ma a ga-asụgharị παραδοῦναι dịka “ịrara nye” ma ọ bụ “inyefe n’aka”
  choice: nyefee ya n’aka ha
  alternative: rara ya nye
  rationale: Nhọrọ a na-edobe obosara ihe okwu Grik pụtara ma na-ahapụ ọnọdụ akụkọ ahụ ka o gosi na omume Judas bụ nrara nye, kama itinye nkọwa ahụ ozugbo n’ime ngwaa.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ usoro ahịrịokwu nkịtị nke na-egosipụta nkwenye Judas, mmalite ọchịchọ ya, na ebumnobi ịchọta oge ìgwè mmadụ na-anọghị.
