id: LUK.22.1
reference: Luke 22:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: ig
  text: Ememme Achịcha na-enweghị ihe na-eko achịcha[a], nke a na-akpọ Ngabiga, na-eru nso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngabiga na Ememme Achịcha na-enweghị ihe na-eko achịcha bụ emume abụọ nwere njikọ chiri anya. N’otú ndị Juu si ekwu okwu, a pụrụ ịkpọ ha ọnụ ma ọ bụ jiri aha otu n’ime ha gụnye oge ememme ahụ dum.
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: na-eru nso
  rationale: Ụdị ngwaa imperfect na-egosi na ememme ahụ nọ na-abịaru nso; okwu a bụ asụsụ Igbo dị mfe ma na-echekwa echiche ahụ.
- source_word: δὲ
  choice: ahapụrụ ya n’enweghị okwu pụrụ iche
  rationale: N’ebe a, δέ bụ njikọ akụkọ dị nro. Usoro ahịrịokwu Igbo na-ebuga akụkọ ahụ nke ọma n’enweghị ịgbakwunye ‘Ma’ ma ọ bụ ‘Ugbu a,’ nke nwere ike ime ka ọdịiche ma ọ bụ oge pụta karịa ka Grik si kwuo.
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: Ememme Achịcha Na-ekoghị Eko
  rationale: Nke a na-akọwa aha ememme ndị Juu n’Igbo doro anya. ‘Na-ekoghị eko’ na-egosi achịcha e tinyebeghị ihe na-eme ka ọ koo.
- source_word: ἡ λεγομένη
  choice: nke a na-akpọ
  rationale: Ọ na-echekwa nkọwa onye odeakụkọ ji mee ka a mata ememme ahụ n’aha ọzọ.
- source_word: Πάσχα
  choice: Ngabiga
  rationale: ‘Ngabiga’ bụ aha Igbo a maara nke ọma maka ememme ndị Juu a, ma na-enye onye na-agụ ya nghọta karịa idegharị ụda okwu Grik ahụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti Ememme Achịcha Na-ekoghị Eko na Ngabiga
  choice: 'E debere okwu Luk dịka njirimara nkọwa: ‘Ememme Achịcha Na-ekoghị Eko, nke a na-akpọ Ngabiga.’'
  alternative: Ịsụgharị ha dịka ememme abụọ e kewapụrụ iche nke ukwuu.
  rationale: Okwu Grik Luk na-ejikọta aha abụọ ahụ n’ụzọ nkọwa, kwekọrọ n’otú ndị Juu si eji aha ha eme ihe n’oge ahụ. Nsụgharị ahụ anaghị amanye ọdịiche teknụzụ ma ọ bụ idozi esemokwu oge karịa ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro nkọwa nke Grik ma na-ada nke ọma n’Igbo.
