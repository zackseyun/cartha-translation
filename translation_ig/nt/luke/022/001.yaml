review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the imperfect sense of ἤγγιζεν (“na-eru nso”), the explanatory force of ἡ λεγομένη (“nke a na-akpọ”), and Luke’s appositional identification of the Feast of Unleavened Bread with Passover. Omitting δέ is appropriate in this Igbo sentence.
  naturalness: '“Ememme Achịcha Na-ekoghị Eko” is not idiomatic Standard Igbo and is unclear: its wording can sound as though the bread itself is performing the action of leavening. “Achịcha na-enweghị ihe na-eko achịcha” is natural, explicit, and readily understood.'
  terminology: “Ngabiga” is an appropriate established Igbo rendering for Passover. Rendering ἄζυμα as bread “without leavening agent” accurately expresses the festival designation without importing a disputed chronological distinction.
  issues:
