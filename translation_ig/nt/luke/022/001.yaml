    issue: The expression “Achịcha Na-ekoghị Eko” is awkward and semantically imprecise.
    rationale: The Greek denotes unleavened bread, namely bread without leaven/leavening agent. In Standard Igbo, “achịcha na-enweghị ihe na-eko achịcha” communicates this naturally and avoids an ambiguous verbal construction.
