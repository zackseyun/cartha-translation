id: LUK.22.38
reference: Luke 22:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κύριε, ἰδοὺ μάχαιραι ὧδε δύο. ὁ δὲ εἶπεν αὐτοῖς· Ἱκανόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: ig
  text: Ha wee sị, “Onyenwe anyị, lee, mma agha abụọ dị ebe a.” Ọ wee sị ha, “O zuola.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nke ahụ ezuola,” nke nwere ike ịpụta na a ga-akwụsị mkparịta ụka ahụ, ọ bụghị na mma agha abụọ zuru ezu.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ha wee sị
  rationale: “Wee” na-ejikọta okwu a na akụkọ gara aga n'ụzọ Igbo si aga nke ọma, n'etinyeghị nghọtahie siri ike nke δέ na-adịghị amanye.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị akpọ Jizọs κύριος, ma na-egosikwa nkwanye ùgwù na aha ya n'Agba Ọhụrụ.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” na-egosipụta ọkpụkpọ ka a hụ ihe dị nso, n'ụzọ doro anya ma bụrụ nke Igbo ugbu a.
- source_word: μάχαιραι
  choice: mma agha
  rationale: Okwu a na-anọchi anya ngwa ọgụ nwere agụba; “mma agha” bụ okwu sara mbara nke na-adịghị akọwapụta ụdị ma ọ bụ ogologo ya karịa ihe Grik kwuru.
- source_word: ὧδε δύο
  choice: abụọ dị ebe a
  rationale: Nke a na-eburu ma ọnụọgụ abụọ ma echiche ebe nke ὧδε, n'usoro okwu Igbo dị mfe.
- source_word: Ἱκανόν ἐστιν
  choice: O zuola
  rationale: '“O zuola” na-echekwa nkenke na mgbagwoju nghọta nke Grik: o nwere ike ịpụta na mma agha abụọ ezuola, ma ọ bụ na mkparịta ụka ahụ ezuola.'
theological_decisions:
- issue: Mgbagwoju nghọta dị n'azịza Jizọs, Ἱκανόν ἐστιν
  choice: O zuola
  alternative: Nke ahụ ezuola / Ka nke a kwụsị ebe a
  rationale: Grik ahụ akọwaghị kpọmkwem ma Jizọs kwuru na mma agha abụọ zuru ezu, ka ọ̀ na-akwụsị mkparịta ụka ahụ. Isiokwu ahụ na-ahapụ nghọta abụọ ahụ ka ha dị, ebe nkọwa ala peeji na-egosi nke ọzọ n'etinyeghị ya n'ime ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe, nke dị ugbu a, dị ugwu ma dị mfe nghọta. E jighị okwu ochie ma ọ bụ nkọwa ụka pụrụ iche; e chekwara mgbagwoju nghọta nke azịza ikpeazụ.
