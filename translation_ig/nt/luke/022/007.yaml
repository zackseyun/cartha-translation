    reason: alternative_reading
  revision_rationale: The revision corrects the relative-clause relationship by expressing the required action as occurring “n’ụbọchị ahụ” (“on that day”). It otherwise preserves the draft’s faithful lexical choices, its formal narrative register, and the source ambiguity of τὸ πάσχα.
