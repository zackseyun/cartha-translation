  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: ig
  text: Mgbe ahụ, ụbọchị Ememme Achịcha Na-ekoghị Eko bịara, nke a na-aghaghị ịchụ àjà Ngabiga n’ụbọchị ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwa atụrụ Ngabiga” ma ọ bụ “àjà Ngabiga.” Okwu Grik ahụ nwere ike ịpụta ememme Ngabiga, ma n’ebe a, ọ pụkwara ịpụta kpọmkwem anụ e ji achụ àjà Ngabiga.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦλθεν
  choice: bịara
  rationale: Aorist ἔρχομαι is used idiomatically for the arrival of a day; “bịara” preserves that temporal image naturally in Igbo.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: Here δέ advances the narrative. “Mgbe ahụ” clearly marks sequence without making the conjunction overly emphatic.
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: ụbọchị Ememme Achịcha Na-ekoghị Eko
  rationale: This keeps the source singular “ụbọchị” while making clear in natural Igbo that Achịcha Na-ekoghị Eko names the Jewish observance.
- source_word: ᾗ
  choice: bụ́ ụbọchị
  rationale: The Igbo identifying-relative construction links the requirement directly back to the day and expresses the temporal force naturally.
- source_word: ἔδει
  choice: a na-aghaghị
  rationale: This impersonal construction conveys the imperfect verb’s calendrical necessity or obligation without specifying a human agent.
- source_word: θύεσθαι
  choice: ịchụ àjà
  rationale: In this cultic setting θύω denotes sacrificial killing. “ịchụ àjà” communicates the ritual dimension more precisely than a general verb for killing.
- source_word: τὸ πάσχα
  choice: Ngabiga
  rationale: The established Igbo name preserves the broad Greek term rather than inserting “nwa atụrụ” into the main text; the sacrificial sense is supplied by the verb and clarified in the footnote.
theological_decisions:
- issue: Referent of τὸ πάσχα in a sacrificial context
  choice: Retain the broad term “Ngabiga” in the main text, with “ịchụ àjà” carrying the sacrificial sense.
  alternative: “nwa atụrụ Ngabiga” or “àjà Ngabiga”
  rationale: πάσχα may designate the observance, meal, or sacrificial victim. Since θύεσθαι already indicates sacrifice, retaining the broader noun preserves the source’s lexical ambiguity while the footnote gives the contextually explicit interpretations.
translation_notes:
  register: Standard Igbo; natural, dignified narrative register. The feast name is transparent to ordinary readers, and the passive/impersonal necessity of the Greek is represented without adding an agent.
