- from: Mgbe ahụ, ụbọchị Ememme Achịcha Na-ekoghị Eko bịara, bụ́ ụbọchị a na-aghaghị ịchụ àjà Ngabiga.[a]
  to: Mgbe ahụ, ụbọchị Ememme Achịcha Na-ekoghị Eko bịara, nke a na-aghaghị ịchụ àjà Ngabiga n’ụbọchị ahụ.[a]
  rationale: The revision corrects the relative-clause relationship by expressing the required action as occurring “n’ụbọchị ahụ” (“on that day”). It otherwise preserves the draft’s faithful lexical choices, its formal narrative register, and the source ambiguity of τὸ πάσχα.
  reviewer_model: gpt-5.6-terra
