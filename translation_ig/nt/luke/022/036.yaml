  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: ig
  text: Ma ugbu a, ka onye nwere akpa ego buru ya, burukwa akpa njem[a] n’otu aka ahụ. Ka onye na-enweghị[c] ree uwe elu ya zụta mma agha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị πήρα dịka “akpa” ma ọ bụ “akpa a na-ebu n’azụ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik μάχαιρα nwekwara ike ịpụta mma agha dị mkpụmkpụ ma ọ bụ mma buru ibu.
    reason: lexical_alternative
  - marker: c
    text: N’ebe a, asụsụ Grik ekwughị kpọmkwem ihe onye ahụ na-enweghị.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: Ma ugbu a
  rationale: Na-egosi mgbanwe siri ike megide ntụziaka ndị bu ya ụzọ, ma na-edobe ma echiche mmegide nke ἀλλά ma oge nke νῦν.
- source_word: βαλλάντιον
  choice: akpa ego
  rationale: Ọ bụ akpa e ji ebu ego; okwu a doro onye Igbo nke oge a anya karịa okwu nwere ike ịpụta naanị akpa nkịtị.
- source_word: ἀράτω
  choice: ya buru ya
  rationale: N’ọnọdụ nkwadebe maka njem, αἴρω pụtara iwere ihe soro mmadụ ma ọ bụ ibu ya; ‘buru ya’ na-ekwupụta nke a n’ụzọ Igbo dị mma.
- source_word: ὁμοίως καὶ πήραν
  choice: ka o bukwa akpa njem n’otu aka ahụ
  rationale: πήρα bụ akpa onye njem; ‘akpa njem’ na-akọwa ọrụ ya nke ọma, ebe ‘n’otu aka ahụ’ na-edobe ὁμοίως.
- source_word: ὁ μὴ ἔχων
  choice: onye na-enweghịkwa mma agha
  rationale: Asụsụ Grik hapụrụ ihe onye ahụ na-enweghị n’ekwughị ya kpọmkwem. E tinyere ‘mma agha’ n’ahịrị isi ka okwu ahụ bụrụ Igbo a na-aghọta ngwa ngwa, ma e debere nghọta ọzọ n’ala ala peeji.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: akwa mgbokwasị ya
  rationale: ἱμάτιον bụ uwe a na-eyi n’elu uwe ndị ọzọ. ‘Akwa mgbokwasị’ na-egosi nke a n’enweghị ime ka ọ bụrụ otu ụdị uwe pụrụ iche nke ukwuu.
- source_word: μάχαιραν
  choice: mma agha
  rationale: μάχαιρα nwere ike ịbụ mma agha dị mkpụmkpụ ma ọ bụ nnukwu mma ọgụ. ‘Mma agha’ bụ okwu sara mbara, kwụ ọtọ, nke na-adịghị ekpebi ogologo ya kpọmkwem.
theological_decisions:
- issue: Ma a ga-eme ka iwu Jizọs banyere ịzụta μάχαιρα dị nro ma ọ bụ kọwaa ya ozugbo dị ka ihe atụ.
  choice: A sụgharịrị ya n’ụzọ kwụ ọtọ dịka ‘zụta mma agha.’
  alternative: Ịsụgharị ya dịka ‘kwadebe onwe unu maka ihe ize ndụ’ ma ọ bụ ‘zụta ngwa ọgụ.’
  rationale: Asụsụ Grik ji aha μάχαιρα na iwu doro anya. Nsụgharị ahụ kwesịrị idobe esemokwu dị n’okwu ahụ, ghara ikpebi n’ime ederede ma iwu ahụ bụ ihe atụ, ma ọ bụ tinye ozizi pụrụ iche banyere iji ike eme ihe.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E ji usoro ‘ya buru… ya ree… zụta…’ mee ka iwu ndị ahụ sie ike dịka n’asụsụ Grik, ma zere okwu ụka pụrụ iche ma ọ bụ nkọwa ga-edozi esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
