  edition: SBLGNT
  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: ig
  text: Ma Pita sịrị, “Nwoke, amaghị m ihe ị na-ekwu.” Ozugbo ahụ, mgbe ọ ka na-ekwu okwu, oke ọkụkọ kwara akwa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosi ntụgharị na mmegide dị n’etiti ebubo ahụ na ngọnarị Pita, n’ụzọ kwekọrọ n’ọrụ δὲ n’akụkọ a.
- source_word: Ἄνθρωπε
  choice: Nwoke
  rationale: N’ebe a, okwu a bụ ịkpọ otu nwoke okwu ozugbo; “Nwoke” doro anya, dịkwa mkpụmkpụ, na-enweghị itinye nsọpụrụ nke “Nna anyị ukwu” ma ọ bụ “Onyenwe m” na-adịghị n’asụsụ Grik.
- source_word: οὐκ οἶδα
  choice: amaghị m
  rationale: 'Nke a bụ ntụgharị Igbo ebumpụta ụwa nke ngwaa οἶδα a jụrụ ajụ, nke nwere nghọta oge ugbu a: “amaghị m.”'
- source_word: ὃ λέγεις
  choice: ihe ị na-ekwu
  rationale: Ọ na-edobe kpọmkwem ihe okwu Grik pụtara, ghara ịkọwa ya karịa ka “ihe i bu n’uche” ga-eme.
- source_word: παραχρῆμα
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na ihe ahụ mere n’enweghị oge gafere, ma dabara n’asụsụ akụkọ Igbo nke oge a.
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: mgbe ọ ka na-ekwu okwu
  rationale: 'Ọ na-echekwa njikọta oge ahụ: oke ọkụkọ bere akwa ka Pita nọkwa n’etiti okwu ya.'
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: oke ọkụkọ bere akwa
  rationale: “Oke ọkụkọ” bụ ụzọ doro anya e si akọwa ἀλέκτωρ, ebe “bere akwa” bụ akpaalaokwu Igbo ebumpụta ụwa maka olu anụmanụ a.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ahịrịokwu kpọmkwem iji chekwaa ike ngọnarị Pita na ọsọ nke ihe mere, na-enweghị itinye nkọwa okpukpe na-adịghị n’isi mmalite.
