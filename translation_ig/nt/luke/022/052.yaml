id: LUK.22.52
reference: Luke 22:52
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: ig
  text: Ma Jizọs gwara ndị bịara imegide ya—ndị isi nchụàjà, ndị isi nche ụlọ nsọ, na ndị okenye—sị, “Ùnu ji mma agha na osisi pụta imegide m dị ka a ga-asị na m bụ onye ohi[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-apụnara mmadụ ihe” ma ọ bụ “onye nnupụisi ji ọgụ eme ihe.” Okwu Grik bụ λῃστής nwere ike ịpụta onye ohi, onye ohi na-eme ihe ike, ma ọ bụ onye iwu na-achụ nke nwere ike ịbụ onye nnupụisi. N’ebe a, Jizọs na-atụnyere otú ha si ji ngwa agha bịa na ụzọ e si aga ijide onye omekome dị ize ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere ntụgharị ma ọ bụ ọdịiche n’akụkọ ahụ; “Ma” dabara n’otu Jizọs si zaghachi ihe a na-eme.
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: bịara megide ya
  rationale: ἐπί tinyere accusative n’ọnọdụ njide a na-egosi na ọbịbịa ha bụ imegide Jizọs, ọ bụghị naanị ịbịaru ya nso.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a bụ aha doro anya maka ndị ndu n’etiti ndị nchụàjà, ọ bụghị ọtụtụ ndị isi nchụàjà ukwu n’otu oge.
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: ndị isi ndị nche ụlọ nsọ
  rationale: Ọ na-ezo aka ná ndị ọrụ nọ n’isi nchekwa ụlọ nsọ; ntụgharị a na-eme ka ọrụ ha doo onye Igbo nke oge a anya.
- source_word: πρεσβυτέρους
  choice: ndị okenye
  rationale: N’ebe a okwu ahụ pụtara ndị ndu ndị Juu a ma ama, ọ bụghị naanị ndị kara nká.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: dị ka a ga-asị na m bụ onye ohi
  rationale: Nke a na-ebupụta ike ajụjụ Jizọs n’Igbo eke, ebe λῃστής ka nwere ike ịpụta onye ohi, onye na-apụnara mmadụ ihe, ma ọ bụ onye nnupụisi ji ọgụ eme ihe.
- source_word: ἐξήλθατε
  choice: Ùnu ... pụta
  rationale: “Pụta” na-egosi ihe ha mere n’oge ahụ, ajụjụ ahụ na-elekwasịkwa anya n’ọbịbịa ha ji ngwa agha bịa.
- source_word: μαχαιρῶν
  choice: mma agha
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ngwa agha e ji egbutu mmadụ n’ọnọdụ a.
- source_word: ξύλων
  choice: okpiri
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara ihe osisi, n’ebe a ọ na-ezo aka n’osisi ike e ji akụ mmadụ dịka ngwa agha; “okpiri” na-enye nghọta ahụ n’ụzọ eke.
theological_decisions:
- issue: Ihe λῃστής pụtara
  choice: onye ohi, tinyere nkọwa ala peeji
  alternative: onye na-apụnara mmadụ ihe ma ọ bụ onye nnupụisi ji ọgụ eme ihe
  rationale: A naghị emechi obosara okwu Grik ahụ n’otu nkọwa pụrụ iche; isi ederede na-eji okwu ndị mmadụ na-aghọta ngwa ngwa, ebe nkọwa ala peeji na-echekwa nhọrọ ndị ọzọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị isi ndị nche ụlọ nsọ” na-akọwa ọrụ ndị ahụ nke ọma karịa aha agha nwere ike iduhie ndị na-agụ ya. E tinyere akara [a] n’akụkụ “onye ohi,” ebe nkọwa ya metụtara.
