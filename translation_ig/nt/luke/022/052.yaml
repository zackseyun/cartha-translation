revisions:
- from: Ma Jizọs sịrị ndị isi nchụàjà, ndị isi ndị nche ụlọ nsọ, na ndị okenye bịara megide ya, “Ùnu ji mma agha na okpiri pụta imegide m dị ka a ga-asị na m bụ onye ohi[a]?”
  to: Ma Jizọs gwara ndị bịara imegide ya—ndị isi nchụàjà, ndị isi nche ụlọ nsọ, na ndị okenye—sị, “Ùnu ji mma agha na osisi pụta imegide m dị ka a ga-asị na m bụ onye ohi[a]?”
  rationale: The revision clarifies that every group named had come against Jesus, improves the title for the temple security officials, and uses a more general, natural equivalent for the wooden weapons. It preserves the Greek rhetorical question and the lexical ambiguity of λῃστής through the anchored footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the participants, hostile purpose, armed equipment, and rhetorical comparison in the Greek. However, the Igbo placement of “bịara megide ya” most naturally modifies only “ndị okenye,” whereas παραγενομένους ἐπ’ αὐτόν modifies all three groups. The revision makes that scope explicit. “Ndị isi nche ụlọ nsọ” more directly and idiomatically represents the temple security commanders than the repetitive “ndị isi ndị nche ụlọ nsọ.”
  naturalness: The revised wording uses a natural Igbo reporting construction (“gwara ndị bịara imegide ya … sị”) and a clear appositional list. “Osisi” is the ordinary natural term for the wooden sticks/clubs intended by ξύλα in this arrest context.
  terminology: “Ndị isi nchụàjà,” “ndị isi nche ụlọ nsọ,” and “ndị okenye” preserve the institutional senses of ἀρχιερεῖς, στρατηγοὺς τοῦ ἱεροῦ, and πρεσβυτέρους. “Onye ohi” remains a defensible broad rendering of λῃστής, while the footnote retains brigand/insurgent-type alternatives without deciding a disputed historical sense.
  issues:
  - severity: medium
    issue: Scope of “bịara megide ya” is ambiguous
    rationale: In the draft it follows only the final coordinated noun, “ndị okenye,” and can be read as describing only the elders. In Greek, the participle governs the chief priests, temple officers, and elders alike.
  - severity: low
    issue: “ndị isi ndị nche ụlọ nsọ” is stylistically repetitive
    rationale: The repeated “ndị isi / ndị nche” is less idiomatic than “ndị isi nche ụlọ nsọ,” while both intend temple security leaders.
  - severity: low
    issue: “okpiri” is narrower and less broadly transparent than needed
    rationale: ξύλων denotes wooden sticks or clubs. “Osisi” is a more widely natural Standard Igbo term and retains the source's breadth.
  revised_text: Ma Jizọs gwara ndị bịara imegide ya—ndị isi nchụàjà, ndị isi nche ụlọ nsọ, na ndị okenye—sị, “Ùnu ji mma agha na osisi pụta imegide m dị ka a ga-asị na m bụ onye ohi[a]?”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-apụnara mmadụ ihe” ma ọ bụ “onye nnupụisi ji ọgụ eme ihe.” Okwu Grik bụ λῃστής nwere ike ịpụta onye ohi, onye ohi na-eme ihe ike, ma ọ bụ onye iwu na-achụ nke nwere ike ịbụ onye nnupụisi. N’ebe a, Jizọs na-atụnyere otú ha si ji ngwa agha bịa na ụzọ e si aga ijide onye omekome dị ize ndụ.
    reason: lexical_alternative
  revision_rationale: The revision clarifies that every group named had come against Jesus, improves the title for the temple security officials, and uses a more general, natural equivalent for the wooden weapons. It preserves the Greek rhetorical question and the lexical ambiguity of λῃστής through the anchored footnote.
