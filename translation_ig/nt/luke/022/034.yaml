source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: ig
  text: Ma ọ sịrị, “Ana m agwa gị, Pita, oke ọkụkọ agaghị akwa ákwá taa ruo mgbe ị ga-agọnahụ ugboro atọ na ị maara m.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: Ma ọ sịrị
  rationale: ‘Ma’ na-egosipụta ntakịrị ọdịiche dị n’okwu na-aga n’ihu, ebe ‘ọ sịrị’ bụ ụzọ Igbo si ewebata okwu kpọmkwem n'ụzọ dị mma.
- source_word: Λέγω σοι
  choice: Ana m agwa gị
  rationale: Nke a bụ okwu Igbo dị ugbu a ma kwekọọ n’ike nke present λέγω n’okwu a na-agwa mmadụ ozugbo.
- source_word: Πέτρε
  choice: Pita
  rationale: A na-eji ụdị aha a nabatara nke ọma n’Igbo.
- source_word: φωνήσει
  choice: ga-ebe ákwá
  rationale: Mgbe ἀλέκτωρ bụ onye na-eme ihe ahụ, okwu a pụtara mkpu oke ọkụkọ; ‘ebe ákwá’ bụ ụzọ Igbo e si ekwu ya n'ụzọ nkịtị.
- source_word: σήμερον
  choice: taa
  rationale: Ọ bụ okwu Igbo doro anya maka oge nke ụbọchị a.
- source_word: ἀλέκτωρ
  choice: oke ọkụkọ
  rationale: Nke a na-akọwa rooster n'ụzọ doro anya ma bụrụkwa okwu ndị Igbo nke oge a na-aghọta.
- source_word: ἕως
  choice: ruo mgbe
  rationale: 'Ọ na-echekwa usoro oge nke ahịrịokwu Grik: mkpu ahụ agaghị eme ruo mgbe ihe ọzọ e kwuru ga-eme.'
- source_word: τρίς
  choice: ugboro atọ
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya isi kwuo ‘three times.’
- source_word: ἀπαρνήσῃ
  choice: ị ga-agọnahụ
  rationale: ‘Ịgọnahụ’ na-egosi ịjụ ma ọ bụ ịsị na ihe abụghị eziokwu; ọdịdị ọdịnihu dabara n’amụma a n’Igbo.
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: ị ga-agọnahụ ... na ị maara m
  rationale: 'Nke a na-echekwa εἰδέναι nke na-akọwapụta ihe Pita ga-agọnahụ: na ọ maara Jizọs; ọ naghị eme ka okwu ahụ bụrụ naanị ịjụ iso ya.'
theological_decisions:
- issue: Ụdị ngọnahụ e buru n’amụma banyere Pita
  choice: Kọwaa ya kpọmkwem dịka ịgọnahụ na ọ maara Jizọs.
  alternative: ị ga-agọnahụ m ugboro atọ
  rationale: Grik nwere εἰδέναι, ya bụ ‘ịma’; idebe ya na-echekwa ihe okwu ahụ kwuru kpọmkwem ma ghara ịgbasa ya ka ọ bụrụ nkwupụta sara mbara banyere mmekọrịta ma ọ bụ nrubeisi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro na mgbagwoju anya nke ἕως dịka ‘ruo mgbe’ n’ahịrịokwu bụ isi; enweghị akara nkọwa ala peeji n’ihi na e tinyeghị nkọwa ala peeji n’ụdị Igbo a.
