  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: ig
  text: Mgbe ahụ, ha sịrị[a], “Gịnị mere anyị ka ji chọọ akaebe ọzọ? N’ihi na anyị onwe anyị anụwo ya n’ọnụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Olee mkpa ọzọ anyị nwere maka akaebe?”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Mgbe ahụ, ha sịrị
  rationale: δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu; ‘Mgbe ahụ’ na-egosi usoro ihe mere n’Igbo nkịtị n’etinyeghị esemokwu siri ike.
- source_word: Τί ἔτι ... χρείαν
  choice: Gịnị mere anyị ka ji chọọ
  rationale: N’ahịrịokwu ajụjụ a, τί ἔτι tinyere χρείαν ἔχειν bụ ajụjụ nkwupụta pụtara ‘gịnị mere anyị ka ji nwee mkpa’; ụdị a bụ Igbo doro anya ma dị ndụ.
- source_word: μαρτυρίας
  choice: akaebe
  rationale: ‘Akaebe’ dabara n’ọnọdụ ikpe a ma nwee ike ịpụta ihe onye akaebe kwuru ma ọ bụ ihe e ji agba akaebe.
- source_word: αὐτοὶ γὰρ
  choice: N’ihi na anyị onwe anyị
  rationale: '‘anyị onwe anyị’ na-echekwa nkwusi ike dị na αὐτοί: ọ bụ ha n’onwe ha nụrụ ihe ahụ.'
- source_word: ἠκούσαμεν
  choice: anụwo
  rationale: Ụdị mmechi ‘anụwo’ na-egosi na ha anụla ya ugbu a, ihe ha nụrụ ka nwekwara mmetụta n’oge ahụ.
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: n’ọnụ ya
  rationale: Nke a na-echekwa okwu oyiyi Grik nke na-egosi na ha nụrụ okwu ahụ kpọmkwem site n’aka ya, n’agbakwụnyeghị ‘n’onwe ya’ nke na-adịghị iche dịka okwu ọzọ na Grik.
theological_decisions:
- issue: Ma a ga-akọwa kpọmkwem ihe ha nụrụ dịka nkwupụta na-ama Jizọs ikpe
  choice: 'E debere ya n’ozuzu ya: ‘anyị onwe anyị anụwo ya n’ọnụ ya.’'
  alternative: anyị onwe anyị anụwo akaebe ahụ n’ọnụ ya
  rationale: Grik etinyeghị ihe nnara kpọmkwem mgbe ἠκούσαμεν gasịrị. Ịgbakwunye ‘nkwupụta’ ma ọ bụ ịkọwa ya dịka okwu na-ama ya ikpe ga-akọwapụta ihe ederede hapụrụ nkenke.
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwesịrị ekwesị ma dị mfe nghọta. A họọrọ ahịrịokwu ajụjụ nkwupụta nkịtị n’isi ederede, ebe nkọwa ala peeji na-echekwa usoro okwu nke dị nso karịa n’ụdị Grik.
