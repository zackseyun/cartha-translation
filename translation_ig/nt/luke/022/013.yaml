- from: Ya mere, ha gara, hụkwa ihe niile dị nnọọ ka ọ gwara ha, ha wee kwadebe Ememme Ngabiga.[a]
  to: Ha gara, hụ ihe ahụ dịka ọ gwara ha, wee kwadebe Ememme Ngabiga.[a]
