source:
  edition: SBLGNT
  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: ig
  text: Ha gara, hụ ihe ahụ dịka ọ gwara ha, wee kwadebe Ememme Ngabiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nri Ememme Ngabiga” ma ọ bụ “nwa atụrụ Ememme Ngabiga.” Okwu Grik a nwere ike ịpụta Ememme Ngabiga n’ozuzu ya, ma ọ bụ kpọmkwem nri ya ma ọ bụ nwa atụrụ a na-achụ n’àjà.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες
  choice: ha gara
  rationale: Aorist participle a na-arụ ọrụ oge n’usoro akụkọ; iji ngwaa zuru ezu bụ ụzọ Igbo si ekwu ya nke ọma ma na-edobe usoro ihe mere.
- source_word: δὲ
  choice: Ya mere
  rationale: N’ebe a, δέ na-aga n’ihu n’akụkọ ma na-egosi nzaghachi ha nye ntụziaka Jizọs nyere, ọ bụghị nnukwu mmegide.
- source_word: εὗρον
  choice: hụkwa ihe niile
  rationale: εὗρον pụtara na ha hụrụ ihe ha gara ịchọta. ‘Ihe niile’ na-ezo aka n’ọnọdụ na ndokwa ndị a kọwara n’amaokwu ndị bu ụzọ, ma na-eme ka Igbo bụrụ nke eke.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Na-egosipụta nkwekọ zuru oke n’etiti ihe Jizọs kwuru na ihe ha hụrụ.
- source_word: εἰρήκει αὐτοῖς
  choice: ọ gwara ha
  rationale: Pluperfect ahụ na-ezo aka n’okwu o kwuru tupu mgbe ahụ; n’Igbo, usoro akụkọ na-eme ka oge gara aga doo anya n’enweghị ịgbakwunye okwu oge ọzọ.
- source_word: ἡτοίμασαν
  choice: ha wee kwadebe
  rationale: Na-egosipụta omume nke sochiri ihe ha hụrụ, ya bụ ime ihe niile dị mkpa ka ọ dị njikere.
- source_word: τὸ πάσχα
  choice: Ememme Ngabiga
  rationale: Nhọrọ a na-edobe obosara nke πάσχα dị ka ememme/usoro ncheta, n’ebughị ụzọ kpebie na ọ bụ naanị nri ma ọ bụ nwa atụrụ ahụ.
theological_decisions:
- issue: Ókè ihe πάσχα pụtara n’ebe a
  choice: Ememme Ngabiga
  alternative: nri Ememme Ngabiga; nwa atụrụ Ememme Ngabiga
  rationale: πάσχα nwere ike ịpụta ememme ahụ n’ozuzu ya, nri ya, ma ọ bụ nwa atụrụ a na-achụ n’àjà. Ihe gbara amaokwu ahụ gburugburu metụtara nri ahụ, ma isiokwu Grik ka sara mbara; ya mere isi ederede anaghị amachi ya n’otu ihe.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. E jiri ‘Ememme Ngabiga’ mee ka aha ememme ahụ doo anya nye onye nkịtị; a hapụrụ nkọwa dị warara banyere nri ma ọ bụ nwa atụrụ na nkọwa ala peeji.
