  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: ig
  text: Ma unu bụ ndị nọgidere n’akụkụ m n’ọnwụnwa m.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ime nnwale m” ma ọ bụ “n’ime ọnwụnwa ndị bịakwasịrị m.” Okwu Grik ahụ nwere ike izo aka n’ọnwụnwa, nnwale, ma ọ bụ ihe isi ike; n’ebe a, o yikarịrị ka ọ na-ekwu banyere nsogbu ndị Jizọs gabigara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: unu
  rationale: Nnọchiaha onye nke abụọ n’ụbara dị n’isi ahịrịokwu maka imesi ndị a na-agwa okwu ike; usoro ‘unu bụ ndị’ na-egosipụta nkwusi ike ahụ n’Igbo.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche n’etiti okwu a na ihe Jizọs kwuru tupu ya; ‘Ma’ na-ebute ọdịiche ahụ n’ụzọ doro anya.
- source_word: οἱ διαμεμενηκότες
  choice: ndị nọgidere
  rationale: Nkebi okwu a na-akọwa otu ndị gara n’ihu ịnọ ruo ugbu a; ‘ndị nọgidere’ na-echekwa echiche nke ntachi obi na ihe gara n’ihu ruo oge a.
- source_word: μετ’ ἐμοῦ
  choice: nọnyeere m
  rationale: N’Igbo nkịtị, ‘ịnọnyere mmadụ’ na-egosi mkpakọrịta na iso ya nọ, nke kwekọrọ na μετά tinyere genitive.
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: n’ọnwụnwa m niile
  rationale: ‘Ọnwụnwa’ nwere ike ịpụta nnwale, ahụhụ siri ike, ma ọ bụ ọnwụnwa ime mmehie, ya mere ọ na-echekwa obosara ihe πειρασμός pụtara. ‘Niile’ na-egosipụta ụbara nke okwu Grik n’ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Ihe πειρασμοῖς pụtara mgbe Jizọs na-ekwu banyere onwe ya
  choice: ọnwụnwa, nke n’ebe a na-elekwasị anya ná nnwale na ahụhụ ndị Jizọs gabigara
  alternative: ọnwụnwa ime ihe ọjọọ ma ọ bụ nnwale
  rationale: Okwu Grik ahụ nwere ike ịpụta nnwale, ahụhụ siri ike, ma ọ bụ ọnwụnwa ime mmehie. Ihe gbara amaokwu ahụ gburugburu na-elekwasị anya ná nsogbu na mmegide ndị Jizọs diri, ma ntụgharị ahụ na nkọwa ala peeji anaghị ewepụ obosara ihe okwu ahụ nwere ike ịpụta.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Nọnyeere m’ bụ ụzọ ebumpụta ụwa isi kwuo mkpakọrịta na iguzosi ike n’akụkụ mmadụ; e debere nkọwa ọzọ n’ala peeji iji chekwaa nghọta dị iche iche nke πειρασμός.
