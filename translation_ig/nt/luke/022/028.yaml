review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the contrast ("Ma"), the emphatic plural addressees ("unu bụ ndị"), the disciples' continued association with Jesus, and πειρασμοί as his trials/testings. However, "niile" (“all”) adds a totalizing sense not expressed by the Greek plural.
  naturalness: '"Nọgidere nọnyeere m" is understandable and acceptable Standard Igbo, though the phrase is somewhat repetitive. "Nọgidere n’akụkụ m" is more idiomatic in this context and retains the sense of steadfast presence with Jesus.'
  terminology: '"Ọnwụnwa" appropriately preserves the lexical breadth of πειρασμοί, including trial, testing, and temptation. The footnote should retain these alternatives without importing the unsupported “all.”'
  issues:
  - severity: medium
    issue: The translation adds “niile” in “n’ọnwụnwa m niile.”
    rationale: ἐν τοῖς πειρασμοῖς μου is plural (“in my trials/testings”), but it does not say “all my trials.” The added quantifier narrows and intensifies the statement beyond the source.
  - severity: low
    issue: The footnote’s alternatives also contain “niile.”
    rationale: The lexical note should not repeat an addition absent from the Greek, especially where it presents alternative renderings.
