revisions:
- from: Ma unu bụ ndị nọgidere nọnyeere m n’ọnwụnwa m niile.[a]
  to: Ma unu bụ ndị nọgidere n’akụkụ m n’ọnwụnwa m.[a]
  rationale: Removed the unsupported quantifier “niile” from both text and note. Recast the continued companionship phrase as “nọgidere n’akụkụ m,” a natural Standard Igbo expression for remaining steadfastly with someone. The wording “ọnwụnwa m” retains the source term’s semantic range, while the footnote gives viable contextual alternatives without deciding the disputed lexical nuance too narrowly.
