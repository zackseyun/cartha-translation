  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: ig
  text: N’ihi na, ònye ka ukwuu[a]—onye nọ na tebụl na-eri nri, ka ọ bụ onye na-eje ozi? Ọ̀ bụghị onye nọ na tebụl na-eri nri? Ma m nọ n’etiti unu dị ka onye na-eje ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụdị ka nke Grik kpọmkwem: “onye dina ala iri nri” / “n’etiti unu.” N’oge ahụ, ndị na-eri nri n’oriri na-anọkarị n’ọnọdụ ịdina n’akụkụ tebụl, ebe ndị na-eje ozi na-elekọta ha.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς γὰρ μείζων
  choice: N’ihi na, ònye ka ukwuu
  rationale: “N’ihi na” na-egosi na ajụjụ a na-akọwa ihe e kwuru tupu ya; “ònye ka ukwuu” na-echekwa ntụnyere gbasara ọkwa ma ọ bụ ịdị mkpa n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: ὁ ἀνακείμενος
  choice: onye nọ na tebụl na-eri nri
  rationale: N’oge ahụ, okwu Grik a na-ezo aka n’onye dina n’akụkụ tebụl iri nri. Nsụgharị a na-eme ka ọnọdụ oriri doo onye Igbo nke oge a anya n’enweghị ime ka ọnọdụ ahụ bụrụ isi ihe a na-ekwusi ike.
- source_word: ὁ διακονῶν
  choice: onye na-eje ozi
  rationale: Nke a na-echekwa ụdị ngwaa participle ahụ na echiche nke ijere ndị ọzọ ozi, kama iji aha nwere ike ibute echiche pụrụ iche banyere ọkwa onye ọrụ ma ọ bụ ọrụ chọọchị.
- source_word: οὐχὶ
  choice: Ọ̀ bụghị
  rationale: Ụdị ajụjụ a na-atụ anya azịza nkwenye, dị ka nke Grik.
- source_word: ἐγὼ δὲ
  choice: Ma m
  rationale: “Ma” na-egosi ọdịiche dị n’etiti atụmanya ọha mmadụ na ihe Jizọs na-eme.
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: m nọ n’etiti unu
  rationale: Ọ bụ nsụgharị ebumpụta okwu ma dịkwa eke n’Igbo maka ịnọ n’etiti otu ndị mmadụ.
- source_word: ὡς ὁ διακονῶν
  choice: dị ka onye na-eje ozi
  rationale: “Dị ka” na-echekwa echiche nke ụzọ ma ọ bụ ntụnyere dị na ὡς, ebe “onye na-eje ozi” na-ejigide omume ahụ.
theological_decisions:
- issue: Otú e si sụgharịa nkọwa Jizọs banyere onwe ya site n’okwu ijere ozi
  choice: Ma m nọ n’etiti unu dị ka onye na-eje ozi.
  alternative: Ma m nọ n’etiti unu dị ka ohu.
  rationale: Grik ji participle διακονῶν, nke pụtara onye na-eje ozi, ọ bụghị aha δοῦλος, “ohu.” Ya mere, nsụgharị ahụ na-echekwa echiche nke omume ijere ozi na ọnọdụ nri a ma ghara ibubata echiche siri ike nke ọnọdụ ohu nke okwu ahụ n’onwe ya ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Onye nọ na tebụl na-eri nri” na-akọwa omenala iri nri ahụ n'ụzọ eke, ebe nkọwa ala ala peeji na-echekwa nkọwa kpọmkwem banyere ịdina n’akụkụ tebụl. Akara [a] dị n’isiokwu ahụ dịka achọrọ.
