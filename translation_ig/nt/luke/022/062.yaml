revisions:
- from: Mgbe ọ pụrụ n'èzí, ọ bere ákwá n'obi ilu.[a]
  to: O wee pụọ n'èzí, bere ákwá n'oke mwute.[a]
  rationale: The revision preserves the Greek narrative linkage with “O wee,” renders the prior departure naturally in sequential Igbo narration, and replaces an unclear idiom with a clear equivalent for bitterly. The footnote supplies a more explicitly participial/temporal alternative and corrects the erroneous verbal form.
