  yaml_path: translation/nt/luke/022/062.yaml
  text: And after going outside, he wept bitterly.
translation:
  language: ig
  text: O wee pụọ n'èzí, bere ákwá n'oke mwute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “Ma mgbe ọ pụtachara n'èzí, o bere ákwá n'oke mwute.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Mgbe
  rationale: N'Igbo, ijikọ nkebi a na nke bu ya ụzọ site n'usoro ‘Mgbe...’ na-egosi njikọ akụkọ na na omume ịpụ ụzọ butere ibe ákwá, n'ụzọ dị ụtọ karịa ịmalite ya na ‘Na’.
- source_word: ἐξελθὼν
  choice: ọ pụrụ
  rationale: Aorist participle a na-egosi omume ịpụ nke mere tupu isi ngwaa; usoro ‘Mgbe ọ pụrụ’ na-ebupụta mmekọrịta ahụ n'Igbo nkịtị.
- source_word: ἔξω
  choice: n'èzí
  rationale: Nke a na-egosi ebe ọ pụrụ gaa—n'èzí—ma na-edobe nghọta gbasara ohere dị na okwu Grik.
- source_word: ἔκλαυσεν
  choice: ọ bere ákwá
  rationale: ‘Ibe ákwá’ bụ ụzọ Igbo doro anya ma dị ùgwù isi kwuo κλαίω n'akụkọ a.
- source_word: πικρῶς
  choice: n'obi ilu
  rationale: Akpaala okwu Igbo a na-egosi mwute miri emi na obi mgbawa nke adverb Grik ahụ na-akọwa, kama ịsụgharị ya n'ụzọ na-adịghị eke eke.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E ji ‘Mgbe ọ pụrụ’ mee ka aorist participle bụrụ okwu Igbo na-aga were were; e debere nkọwa ọzọ na ndetu ala peeji. Ihe nrịbama [a] dị n'isiokwu ahụ dịka achọrọ.
