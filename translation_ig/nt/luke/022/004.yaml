    text: A pụkwara ịsị, “rara ya nye ha.” Ngwaa Grik ahụ nwere ike ịpụta “inyefe,” “inye n’aka,” ma ọ bụ, n’ọnọdụ a, “ịrara nye.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “ndị isi ndị nche” ndị a bụ ndị ọchịchị Ụlọ Nsọ ma ọ bụ ndị na-achị ndị nche Ụlọ Nsọ, ọ bụghị ndị agha Rom.
    reason: cultural_note
