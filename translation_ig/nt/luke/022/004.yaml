source:
  edition: SBLGNT
  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: ig
  text: Ọ gara kwurịta okwu na ndị isi nchụaja na ndị isi ndị nche banyere otú ọ ga-esi nyefee ya n’aka ha[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “rara ya nye ha.” Ngwaa Grik ahụ nwere ike ịpụta “inyefe,” “inye n’aka,” ma ọ bụ, n’ọnọdụ a, “ịrara nye.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “ndị isi ndị nche” ndị a bụ ndị ọchịchị Ụlọ Nsọ ma ọ bụ ndị na-achị ndị nche Ụlọ Nsọ, ọ bụghị ndị agha Rom.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: Ọ gara
  rationale: Aorist participle ahụ na-egosi ihe mere tupu ma ọ bụ jikọrọ ya na ngwaa bụ isi; n’Igbo, ‘Ọ gara kwurịta’ na-enye usoro ahụ n'ụzọ dị mfe ma dị ndụ.
- source_word: συνελάλησεν
  choice: kwurịta ya na
  rationale: Ngwaa ahụ pụtara ikwurịta okwu ọnụ ma ọ bụ ịgba izu; ‘kwurịta ya na’ na-egosipụta mkparịta ụka nwere nzube n’Igbo nkịtị.
- source_word: ἀρχιερεῦσιν
  choice: ndịisi nchụaja
  rationale: Nke a na-ezo aka n’òtù ndị ndu nchụaja, ọ bụghị ọtụtụ ndị ji otu ọkwa onyeisi nchụaja n’otu oge.
- source_word: στρατηγοῖς
  choice: ndịisi ndị nche
  rationale: N’ọnọdụ Ụlọ Nsọ dị na Jerusalem, okwu a na-ezo aka n’ụfọdụ ndị ọchịchị ma ọ bụ ndị na-achị ndị nche Ụlọ Nsọ; ‘ndịisi ndị nche’ doro anya, ebe nkọwa ala peeji na-akọwa ọnọdụ ha.
- source_word: τὸ πῶς
  choice: otú ... ga-esi
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa maka iwebata ụzọ a ga-esi mee ihe e kwuru banyere ya.
- source_word: παραδῷ
  choice: nyefee ... n’aka
  rationale: ‘Nyefee n’aka’ na-echekwa isi echiche sara mbara nke παραδίδωμι—inye ma ọ bụ inyefe mmadụ n’aka ndị ọzọ—na-enweghị ime ka naanị nkọwa ‘rara nye’ bụrụ nke dị n’ahịrị bụ isi.
- source_word: αὐτοῖς ... αὐτόν
  choice: ya n’aka ha
  rationale: ‘Ya’ na-anọchi Jizọs, ‘ha’ na-anọchi ndịisi nchụaja na ndịisi ndị nche; okwu Igbo a na-ekewa ha nke ọma.
theological_decisions:
- issue: Otú e si tụgharị παραδῷ n’omume Judas
  choice: nyefee ya n’aka ha
  alternative: rara ya nye ha
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi nrara Judas, ma ngwaa Grik ahụ sara mbara karịa ‘ịrara nye.’ Ahịrị bụ isi na-echekwa nghọta nke inyefe mmadụ n’aka ndị ọzọ, ebe nkọwa ala peeji na-enye ụzọ ọzọ dabara n’ọnọdụ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọ gara kwurịta ya na’ zere ntụgharị siri ike nke participle Grik, ebe ‘ndịisi ndị nche’ na nkọwa [b] na-echekwa ọdịiche dị n’etiti ndị nche Ụlọ Nsọ na ndị agha Rom.
