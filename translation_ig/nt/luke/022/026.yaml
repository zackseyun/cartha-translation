review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the emphatic contrast, the comparative sense of μείζων and νεώτερος, the imperative γινέσθω, and the active sense of ὁ διακονῶν. However, “onye ka ibe ya ukwuu” is not idiomatic Standard Igbo and is needlessly cumbersome for “the greater among you.”
  naturalness: The sentence structure is generally clear, but “onye ka ibe ya ukwuu n’etiti unu” sounds unnatural. “Onye ka ukwuu n’etiti unu” is the normal, concise comparative construction. Rendering γινέσθω as “ghọọ” also more directly conveys “become.”
  terminology: “Onye na-edu ndú” and “onye na-eje ozi” are appropriate, modern, and non-sectarian renderings. “Onye ka nta” appropriately retains the comparative wording and, with the note, its social-status implication.
  issues:
  - severity: medium
    issue: Awkward comparative expression
    rationale: “Onye ka ibe ya ukwuu” is grammatically understandable but unnatural and repetitive in Standard Igbo. It should be replaced with “onye ka ukwuu n’etiti unu,” which preserves the Greek comparative μείζων and reads naturally.
  - severity: low
    issue: Imperative of becoming is weakened
    rationale: “Dịrị” can suggest a continuing state, whereas γινέσθω specifically calls for becoming/taking the role. “Ghọọ” preserves this nuance more directly.
  revised_text: Ma unu ekwesịghị ịdị otu ahụ.[a] Kama, ka onye ka ukwuu n’etiti unu ghọọ ka onye ka nta,[b] onye na-edu ndú bụrụkwa ka onye na-eje ozi.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ma ọ gaghị adị otu a n’etiti unu.” Okwu Grik ahụ dị nkenke ma na-egosi ọdịiche siri ike n’etiti ndị na-eso ụzọ Jizọs na ndị na-achọ ọkwa e kwuru banyere ha n’amaokwu bu ụzọ.
    reason: alternative_reading
  - marker: b
    text: “Onye ka nta” na-ezo aka karịchaa n’onye ọkwa ya dị ala n’etiti ndị mmadụ, ọ bụghị naanị onye afọ ya pere mpe.
    reason: cultural_note
  revision_rationale: The revision removes an unnatural Igbo comparative construction and uses “ghọọ” to reflect the imperative sense of becoming. It otherwise preserves the draft’s faithful rendering, register, terminology, ambiguity, and both footnote anchors.
