id: LUK.22.26
reference: Luke 22:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: ig
  text: Ma unu ekwesịghị ịdị otu ahụ.[a] Kama, ka onye ka ukwuu n’etiti unu ghọọ ka onye ka nta,[b] onye na-edu ndú bụrụkwa ka onye na-eje ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ma ọ gaghị adị otu a n’etiti unu.” Okwu Grik ahụ dị nkenke ma na-egosi ọdịiche siri ike n’etiti ndị na-eso ụzọ Jizọs na ndị na-achọ ọkwa e kwuru banyere ha n’amaokwu bu ụzọ.
    reason: alternative_reading
  - marker: b
    text: “Onye ka nta” na-ezo aka karịchaa n’onye ọkwa ya dị ala n’etiti ndị mmadụ, ọ bụghị naanị onye afọ ya pere mpe.
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: Ma unu ekwesịghị ịdị otu ahụ
  rationale: Na-egosipụta ọdịiche siri ike dị n’etiti ụzọ ndị ọchịchị a kpọtụrụ aha n’amaokwu bu ụzọ si achọ ọkwa na ụzọ ndị na-eso ụzọ Jizọs kwesịrị isi bie; ọ na-emekwa ka okwu Grik ahụ e kepụrụ ekepụ doo anya n’Igbo.
- source_word: ἀλλ’
  choice: Kama
  rationale: Ọ bụ ụzọ Igbo dị mfe ma sie ike isi webata ntụgharị gaa n’iwu ziri ezi Jizọs nyere.
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: onye ka ibe ya ukwuu n’etiti unu
  rationale: Na-echekwa ụdị ntụnyere μείζων, ‘onye ka ibe ya ukwuu,’ kama ime ya ‘onye kachasị ukwuu’; ebe a, ịdị ukwuu metụtara ọkwa n’etiti ndị otu ahụ.
- source_word: γινέσθω
  choice: ka ... dịrị
  rationale: Na-enye iwu ahụ n’Igbo nkịtị ma na-egosi na onye ahụ ga-ewere ọnọdụ ma ọ bụ àgwà a kpọrọ aha, ọ bụghị naanị ịkọwa ọnọdụ ya.
- source_word: ὡς ὁ νεώτερος
  choice: ka onye ka nta
  rationale: N’ọnọdụ a, νεώτερος na-ezo aka n’onye dị ala n’afọ ma ọ bụ n’ọkwa mmekọrịta mmadụ; ‘onye ka nta’ na-echekwa ohere abụọ ahụ, ebe nkọwa ala peeji kọwara isi omenala ya.
- source_word: ὁ ἡγούμενος
  choice: onye na-edu ndú
  rationale: Na-egosipụta ọrụ onye na-ebute ma ọ bụ na-edu ndị ọzọ n’enweghị itinye echiche siri ike banyere ọchịchị ma ọ bụ ọkwa ụka.
- source_word: ὡς ὁ διακονῶν
  choice: ka onye na-eje ozi
  rationale: 'Na-echekwa omume na-aga n’ihu nke participle ahụ: onye na-arụ ọrụ ijere ndị ọzọ ozi.'
theological_decisions:
- issue: Ụdị ntụziaka Jizọs banyere ọkwa na idu ndú
  choice: 'E gosipụtara ya dị ka ịtụgharị ụkpụrụ ọkwa n’etiti ndị na-eso ụzọ: onye dị elu ga-ewere ọnọdụ onye dị ala, onye ndu aghọọkwa onye na-eje ozi.'
  alternative: Iji okwu ụlọ ọrụ ma ọ bụ ọchịchị siri ike kọwaa ọkwa na idu ndú.
  rationale: Okwu Grik ahụ na-eme ka ‘onye ka ibe ya ukwuu’ na ‘onye na-edu ndú’ kwekọọ n’ụzọ atụnyere ‘onye ka nta’ na ‘onye na-eje ozi.’ Nsụgharị a na-echekwa oku ịdị umeala n’obi n’etinyeghị usoro ọchịchị ụka e mechara guzobe.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere nkwanye ùgwù ma dị mfe nghọta. E ji ‘ịdị otu ahụ’ mee ka ntụnyere amaokwu bu ụzọ doo anya; e jikwa ‘onye ka nta’ chekwaa njikọ dị n’etiti afọ na ọkwa mmadụ, ebe nkọwa ala peeji na-akọwa isi ihe omenala ahụ.
