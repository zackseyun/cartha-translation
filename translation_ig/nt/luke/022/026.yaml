revisions:
- from: Ma unu ekwesịghị ịdị otu ahụ.[a] Kama, ka onye ka ibe ya ukwuu n’etiti unu dịrị ka onye ka nta,[b] onye na-edu ndú adịkwa ka onye na-eje ozi.
  to: Ma unu ekwesịghị ịdị otu ahụ.[a] Kama, ka onye ka ukwuu n’etiti unu ghọọ ka onye ka nta,[b] onye na-edu ndú bụrụkwa ka onye na-eje ozi.
  rationale: The revision removes an unnatural Igbo comparative construction and uses “ghọọ” to reflect the imperative sense of becoming. It otherwise preserves the draft’s faithful rendering, register, terminology, ambiguity, and both footnote anchors.
  reviewer_model: gpt-5.6-terra
