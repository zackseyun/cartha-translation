id: LUK.22.32
reference: Luke 22:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: ig
  text: Ma ekpeela m ekpere maka gị[a], ka okwukwe gị ghara ịda; ma gị onwe gị, mgbe ị lọghachiri[b], mee ka ụmụnne gị guzosie ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ntụkwasị obi gị ghara ịda,” ma ọ bụ “ka ikwesị ntụkwasị obi gị ghara ịda.” Okwu Grik ahụ nwere echiche ndị a jikọrọ ọnụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “mgbe ị tụgharịrị laghachi,” ma ọ bụ “mgbe ị laghachiri ọzọ.” Okwu a na-arụtụ aka na mweghachi Pita mgbe ọdịda ya nke na-abịa gasịrị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: ekpeela m ekpere
  rationale: Nke a na-egosi arịrịọ siri ike e kpecharala, nke ka metụtara ọnọdụ Pita ugbu a; ọ bụkwa okwu Igbo doro anya ma dị ebube.
- source_word: περὶ σοῦ
  choice: maka gị
  rationale: Mgbe e ji ya na ekpere, περί tinyere genitive na-egosi ịrịọchitere mmadụ arịrịọ, ya mere “maka gị” bụ ụzọ Igbo kacha kwekọọ.
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: ka ... ghara ịda
  rationale: ἐκλείπω nwere ike ịpụta ịda, ịkwụsị, ma ọ bụ ịgwụ. “Ghara ịda” dabara n’okwukwe ma ghara ikwu na okwukwe Pita ga-ala kpamkpam.
- source_word: πίστις
  choice: okwukwe
  rationale: “Okwukwe” na-echekwa obosara nke πίστις, nke nwere ike ịgụnye ntụkwasị obi na ikwesị ntụkwasị obi; e debere nuances ndị ahụ n’ala peeji.
- source_word: ποτε
  choice: mgbe
  rationale: N’ebe a, ποτέ na-arụtụ aka n’oge ga-abịa nke a na-akọwaghị kpọmkwem; “mgbe” na-eme ka usoro participle na iwu ahụ bụrụ Igbo eke.
- source_word: ἐπιστρέψας
  choice: mgbe ị lọghachiri
  rationale: “Lọghachiri” na-echekwa echiche nke nlọghachi ma ọ bụ mweghachi mgbe ọdịda gasịrị, n’etinyeghị okwu nkà mmụta okpukpe siri ike dịka nchegharị kpọmkwem.
- source_word: στήρισον
  choice: mee ka ... guzosie ike
  rationale: Okwu a na-egosi ime ka ndị ọzọ sie ike ma kwụsie ike; ahịrịokwu Igbo a na-ebupụta ike nke imperative ahụ nke ọma.
- source_word: ἀδελφούς
  choice: ụmụnne
  rationale: “Ụmụnne” bụ okwu Igbo a na-ejikarị akọwa ndị nọ n’otu mmekọrịta okwukwe; n’ọnọdụ a ndị a bụ ndị na-eso ụzọ Jizọs, n’enweghị mkpa itinye okike na-adịghị apụta n’usoro okwu Igbo.
theological_decisions:
- issue: Ihe πίστις pụtara n’ebe okwukwe, ntụkwasị obi, na ikwesị ntụkwasị obi jikọrọ ọnụ
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: “Okwukwe” na-ahapụ obosara okwu Grik ahụ ka ọ dị. Ihe ndị ọzọ nwere ike ịbụ nuances ziri ezi, ma ịhọrọ otu n’ime ha naanị ga-eme ka ihe okwu ahụ pụtara dị warara.
- issue: Ihe ἐπιστρέψας pụtara banyere ọnọdụ Pita n’ọdịnihu
  choice: mgbe ị lọghachiri
  alternative: mgbe ị tụgharịrị laghachi; mgbe ị chegharịrị
  rationale: “Lọghachiri” na-egosi mweghachi mgbe Pita dara, ma ọ naghị amanye nkọwa ahụ ka ọ bụrụ okwu teknụzụ banyere nchegharị naanị.
- issue: Ndị ἀδελφούς na-ezo aka na ha
  choice: ụmụnne gị
  alternative: ụmụnna gị; ụmụnne ndị kwere ekwe ibe gị
  rationale: Ndị a na-ezo aka na ha ozugbo bụ ndị na-eso ụzọ Jizọs. “Ụmụnne” bụ okwu mmekọrịta eke n’Igbo ma na-echekwa njikọ chiri anya ahụ n’etinyeghị nkọwa sara mbara karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, doro anya ma dị ebube. A họọrọ “ekpeela m ekpere” iji gosi ihe e mecharala nke ka nwere mkpa ugbu a, “okwukwe” iji chekwaa obosara πίστις, na “lọghachiri” iji ghara imechi mgbagwoju anya dị n’etiti nlọghachi, mweghachi, na nchegharị.
