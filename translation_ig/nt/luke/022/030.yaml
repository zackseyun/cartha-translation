  source_fidelity: Isi okwu ahụ na-edobe nzube nke ἵνα, oriri na ọṅụṅụ, tebụl Jizọs, alaeze ya, ocheeze, na ikpe ebo iri na abụọ nke Izrel nke ọma. Otú ọ dị, ‘ihe’ n’azụ ‘rie ma ṅụọ’ adịghị na Grik ma na-eme ka ihe a na-eri na nke a na-aṅụ bụrụ otu ihe n’ụzọ na-adịghị mkpa. E wepụrụ ya.
  naturalness: ‘Ka unu wee rie ma ṅụọ ...’ bụ Standard Igbo dị mfe ma dị eke karịa ‘rie ma ṅụọ ihe.’ ‘Na-ekpe ... ikpe’ na-adaba nke ọma n’ọdịdị okwu ahụ.
  terminology: ‘Alaeze,’ ‘ocheeze,’ ‘ebo iri na abụọ nke Izrel,’ na ‘na-ekpe ... ikpe’ kwesịrị ekwesị. ‘Na-ekpe ikpe’ na-edobe nghọta ikpe nke κρίνω; nkọwa ala peeji na-enye ‘na-achị’ dị ka ohere ọzọ n’enweghị ime ka ọ bụrụ naanị ihe okwu ahụ pụtara.
