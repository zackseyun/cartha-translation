  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: ig
  text: ka unu wee rie ma ṅụọ na tebụl m n’alaeze m, unu ga-anọdụkwa n’ocheeze na-ekpe ebo iri na abụọ nke Izrel ikpe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-achị ebo iri na abụọ nke Izrel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka unu wee
  rationale: Na-egosi nzube ma ọ bụ ihe si ná nkwa dị n’amaokwu bu ụzọ pụta; usoro a bụ Igbo nkịtị ma na-edobe ike okwu nzube ahụ.
- source_word: ἔσθητε καὶ πίνητε
  choice: rie ma ṅụọ ihe
  rationale: Na-edobe omume abụọ ahụ n’okpuru ἵνα; ịgbakwunye ‘ihe’ na-eme ka okwu ahụ daa nke ọma n’Igbo n’enweghị ịkọwa ụdị nri ma ọ bụ ihe ọṅụṅụ.
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: na tebụl m
  rationale: Nke a bụ ụzọ Igbo si ekwu iso mmadụ rie nri na tebụl ya; nsụgharị mkpụrụokwu dịka ‘n’elu tebụl m’ ga-enye echiche na-ezighị ezi.
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: n’alaeze m
  rationale: ‘Alaeze’ dabara n’ọnọdụ oriri na ocheeze dị ebe a, ma ọ ka na-eburu echiche nke ọchịchị eze.
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: unu ga-anọdụkwa n’ocheeze
  rationale: Na-edobe ọdịnihu na ihe oyiyi nke ndị e nyere ọnọdụ eze na ikike ikpe ikpe; Igbo ekwesịghị ịmegharị ‘ocheeze’ iji gosi ọtụtụ mgbe ọnụọgụ adịghị mkpa n’aha ahụ.
- source_word: κρίνοντες
  choice: na-ekpe … ikpe
  rationale: Nke a bụ ihe okwu κρίνω pụtara kpọmkwem n’ebe a, ma ọ naghị akọwapụta ma ikpe ahụ bụ naanị ịma ikpe ọmụma ma ọ bụkwa ịchị achị.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: ebo iri na abụọ nke Izrel
  rationale: Na-edobe ọnụ ọgụgụ ahụ na njikọ ọgbụgba ndụ ya na Izrel n’ụzọ doro anya.
theological_decisions:
- issue: Ụdị ọrụ ndị na-eso ụzọ ga-arụ n’ebe ebo iri na abụọ nke Izrel nọ
  choice: na-ekpe … ikpe
  alternative: na-achị ebo iri na abụọ nke Izrel
  rationale: κρίνω nwere ike ịgụnye ikpe ikpe nakwa ikike ọchịchị. Isi ederede na-edobe okwu ikpe nke bụ isi ihe okwu Grik ahụ pụtara, ebe nkọwa ala peeji na-egosi nghọta ọchịchị n’enweghị imechi nghọtahie ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere ihe oyiyi nke tebụl, alaeze, na ocheeze, tinyekwa akara nkọwa [a] ozugbo n’ebe okwu κρίνοντες metụtara.
