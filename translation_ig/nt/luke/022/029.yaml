  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κἀγὼ διατίθεμαι ὑμῖν, καθὼς διέθετό μοι ὁ πατήρ μου βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/029.yaml
  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: ig
  text: Mụ kwa na-ekenye unu otu alaeze[a], dị nnọọ ka Nna m kenyere m alaeze.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mụ kwa na-agba unu ọgbụgba ndụ maka otu alaeze, dị ka Nna m gbara m ọgbụgba ndụ maka ya.” Ngwaa Grik ahụ nwekwara ike ịpụta ime ọgbụgba ndụ, ịhazi ihe, ma ọ bụ ikenye mmadụ ihe.
    reason: alternative_reading
  - marker: b
    text: 'N’usoro okwu Grik, “otu alaeze” bụ ihe jikọrọ ngwaa abụọ ahụ: “Mụ kwa na-ekenye unu, dị nnọọ ka Nna m kenyere m, otu alaeze.”'
    reason: previous_rendering
lexical_decisions:
- source_word: κἀγὼ
  choice: Mụ onwe m na-…kwa
  rationale: “Mụ onwe m” na-egosipụta nkwusi ike dị n’ἐγώ, ebe “-kwa” na-edobe njikọ na echiche nke καί n’ụzọ Igbo na-ada nke ọma.
- source_word: διατίθεμαι
  choice: na-ekenye
  rationale: “Ikenye” na-egosi inye mmadụ ihe ma ọ bụ ikike ka ọ bụrụ nke ya, ma ọ naghị amanye naanị echiche nke ọgbụgba ndụ. Ọ dabara n’alaeze a na-enye ndị na-eso ụzọ.
- source_word: ὑμῖν
  choice: unu
  rationale: “Unu” bụ ndị a na-enye ma ọ bụ ekenye alaeze ahụ.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nke a na-egosi ntụnyere doro anya n’etiti ihe Jizọs na-eme na ihe Nna ya mere.
- source_word: διέθετό
  choice: kenyere
  rationale: E ji otu ngwaa ahụ e ji sụgharịa διατίθεμαι mee ihe, ka myirịta dị n’etiti omume Ọkpara na nke Nna ghara ịla n’iyi; oge gara aga na-egosi omume Nna ahụ dị ka ihe e mereworị.
- source_word: μοι
  choice: m
  rationale: Nnochiaha a na-egosi na Jizọs bụ onye Nna kenyere alaeze ahụ.
- source_word: ὁ πατήρ μου
  choice: Nna m
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwanyere ùgwù isi chekwaa mmekọrịta Nna na Ọkpara.
- source_word: βασιλείαν
  choice: otu alaeze
  rationale: N’ebe a, okwu ahụ na-ezo aka n’alaeze ma ọ bụ ọchịchị eze a na-enye. “Otu alaeze” na-egosi aha na-enweghị edemede n’asụsụ Grik n’ụzọ Igbo kwekọrọ n’okwu a.
theological_decisions:
- issue: Ma a ga-eji okwu doro anya nke ọgbụgba ndụ sụgharịa διατίθεμαι
  choice: na-ekenye
  alternative: na-agba unu ọgbụgba ndụ inye unu
  rationale: Ngwaa Grik ahụ nwere ike ibu echiche nke ịhazi, inyefe, ma ọ bụ ịgba ọgbụgba ndụ. N’ihi na βασιλείαν bụ ihe a na-enye, “na-ekenye” na-edobe echiche sara mbara nke inyefe alaeze n’etinyeghị nkọwa nkà mmụta okpukpe karịrị ihe ederede kwuru. E debere ohere nke ọgbụgba ndụ n’okpuru amaokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. “Ikenye” bụ okwu a na-aghọta nke ọma maka inyefe mmadụ ihe ma ọ bụ ikike; e zere okwu ụka pụrụ iche. Ahịrịokwu bụ isi na-ada nke ọma n’Igbo, ebe nkọwa [b] na-echekwa usoro nkwupụta Grik nke na-edebe “alaeze” ruo na ngwụcha.
