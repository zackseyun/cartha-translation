revisions:
- from: Mụ onwe m na-ekenyekwa unu otu alaeze[a], dị nnọọ ka Nna m kenyere m ya.[b]
  to: Mụ kwa na-ekenye unu otu alaeze[a], dị nnọọ ka Nna m kenyere m alaeze.[b]
  rationale: The revision moderates the emphasis of κἀγώ, improves idiomatic Igbo by repeating the shared object in the comparison, and retains the Greek’s parallel use of διατίθεμαι/διέθετο. The footnotes preserve both the covenantal alternative and the end-positioned shared object in Greek, without requiring either reading in the main text.
