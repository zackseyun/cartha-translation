  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: ig
  text: Ma Jizọs zara, sị, “O zuola!” O metụkwara ntị nwoke ahụ aka, gwọọ ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐᾶτε ἕως τούτου
  choice: O zuola!
  rationale: Akpaokwu Grik a nwere ike ịpụta ịkwụsị ihe a na-eme n’oge ahụ. Nsụgharị a bụ okwu Igbo dị nkenke ma sie ike, kwekọọkwa na ọnọdụ ebe Jizọs na-akwụsị ime ihe ike.
- source_word: ὠτίου
  choice: ntị
  rationale: Ọ bụ okwu na-ezo aka na ntị; ‘ntị’ bụ okwu Igbo nkịtị, doro anya, nke na-adịghị etinye nkọwa karịa ihe odide ahụ.
- source_word: ἰάσατο
  choice: gwọọ
  rationale: Ngwaa a pụtara ime ka onye ahụ dịrị mma ma ọ bụ gwọọ akụkụ ahụ merụrụ emerụ; ‘gwọọ’ na-ebute ihe ahụ n’Igbo n'ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Onye nwe ntị ahụ na ọdịdị ọgwụgwọ ahụ
  choice: ‘ntị nwoke ahụ’ na ‘gwọọ ya’
  alternative: Ịkpọ ya ‘ohu onyeisi nchụàjà’ ma ọ bụ ịkọwa kpọmkwem otú ntị ahụ si laghachi
  rationale: Amaokwu a n’onwe ya na-eji nnọchiaha akọwa onye ahụ, ọ naghịkwa akọwa usoro ọgwụgwọ ahụ. ‘Nwoke ahụ’ na-eme ka Igbo doo anya n’enweghị ibubata nkọwa sitere n’amaokwu ndị gbara ya gburugburu.
translation_notes:
  register: Asụsụ Igbo Ọha dị ugbu a, dị mfe ma nwee ugwu. E debere okwu Jizọs nkenke na ike; a zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
