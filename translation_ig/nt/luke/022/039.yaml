id: LUK.22.39
reference: Luke 22:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: ig
  text: Mgbe ọ pụtasịrị, ọ gara n’Ugwu Oliv dị ka ọ na-emebu[a]; ndị na-eso ụzọ ahụ sokwara ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “dị ka omenala si dị.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Mgbe ọ pụtasịrị
  rationale: Aorist participle a na-egosi ihe mere tupu ngwaa bụ isi; nkebiokwu a na-egosipụta usoro ahụ nke ọma n’Igbo nkịtị.
- source_word: ἐπορεύθη
  choice: ọ gara
  rationale: Nke a bụ nsụgharị Igbo dị mfe ma bụrụ nke sitere n’ọnọdụ akụkọ maka πορεύομαι.
- source_word: κατὰ τὸ ἔθος
  choice: dị ka ọ na-emebu
  rationale: Ọ na-egosi omume a na-eme mgbe niile. N’Igbo, okwu a bụ nke eke ma doo anya, ebe ihe gbara ya gburugburu na-egosi na ọ bụ Jizọs ka a na-ekwu maka ya.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: n’Ugwu Oliv
  rationale: Aha a bụ aha ebe a maara ama; “Ugwu Oliv” bụ nsụgharị dị nkenke ma doo anya n’Igbo.
- source_word: ἠκολούθησαν
  choice: sokwara ya
  rationale: N’ọnọdụ njem a, “iso ya” na-egosipụta ma ịgbaso ya n'ụzọ ma mmekọrịta ndị na-eso ụzọ ahụ na ya.
- source_word: οἱ μαθηταί
  choice: ndị na-eso ụzọ ahụ
  rationale: Mkpọaha ngosi “ahụ” na-egosipụta article Grik ma na-ezere itinye “ya,” nke na-adịghị n’ederede Grik.
- source_word: καὶ … δὲ καὶ
  choice: Mgbe … ; … sokwara
  rationale: Nhazi a na-eme ka njikọ akụkọ na mgbakwunye nke ndị na-eso ụzọ pụta n’Igbo na-enweghị ịmanye njikọ Grik niile ka ha bụrụ otu mkpụrụokwu.
theological_decisions:
- issue: Ma a ga-eme ka Jizọs bụrụ onye a kpọrọ aha n'ụzọ doro anya dịka onye omenala ahụ bụ nke ya
  choice: dị ka ọ na-emebu
  alternative: dị ka omenala si dị
  rationale: Ọ bụ ezie na Grik ekwughị kpọmkwem “nke ya,” onye ngwaa bụ isi na ihe gbara amaokwu ahụ gburugburu na-egosi Jizọs. Nsụgharị a bụ Igbo eke; ndetu ala peeji na-echekwa ọdịdị okwu Grik nke na-akọwaghị onye nwe omenala ahụ kpọmkwem.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ugwu ma dị mfe nghọta. E ji “ndị na-eso ụzọ ahụ” zere ịgbakwunye “ya” n’ebe Grik na-ekwughị ya, ebe “sokwara” na-echekwa ike mgbakwunye nke καί.
