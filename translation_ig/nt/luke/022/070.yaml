  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: ig
  text: Ha niile wee sị, “Ya mere, ị bụ Ọkpara Chineke?” Ọ sịrị ha, “Unu onwe unu na-ekwu na m bụ ya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ ọzọ, a pụrụ ịsụgharị ya, “Ọ bụ dịka unu kwuru,” ma ọ bụ, “Unu kwuru ya.” Okwu Grik ahụ bụ n’ụzọ nkịtị, “Unu onwe unu na-ekwu na m bụ ya”; n’ọnọdụ a, ọ na-arụ ọrụ dị ka nzaghachi nkwenye.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: Ha niile
  rationale: Adjective a na-arụ ọrụ dị ka aha ma na-ezo aka n’ìgwè ahụ dum; ‘Ha niile’ bụ Igbo doro anya nke na-echekwa nkwusi ike ahụ.
- source_word: οὖν
  choice: Ya bụ
  rationale: N’ajụjụ a, okwu a na-egosi nkwubi okwu ha si n’ihe e kwuru tupu ya nweta; ‘Ya bụ’ na-egosipụta nke a n’Igbo nkịtị.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Aha ùgwù a metụtara Kraịst. ‘Ọkpara Chineke’ bụ nsụgharị Igbo a maara nke ọma ma na-echekwa ịdị arọ nke aha ahụ.
- source_word: ἔφη
  choice: Ọ zara ha
  rationale: Ọ bụ ezie na ngwaa Grik ahụ pụtara ‘sị,’ n’ebe a okwu Jizọs bụ nzaghachi nye ajụjụ ha; ‘Ọ zara ha’ bụ Igbo ebumpụta ụwa nke na-agbanweghị ihe ọ pụtara.
- source_word: Ὑμεῖς
  choice: Unu onwe unu
  rationale: Nnochiaha ahụ pụtara ìhè na Grik ma nwee nkwusi ike; ‘Unu onwe unu’ na-echekwa nkwusi ike ahụ ma na-atụgharị okwu ahụ laghachi n’ọnụ ndị na-ajụ ya.
- source_word: λέγετε
  choice: na-ekwu
  rationale: Oge ugbu a nke ngwaa ahụ dabara na ‘na-ekwu,’ ma kwekọọ na ‘unu’ nke bụ ọtụtụ mmadụ.
- source_word: ὅτι
  choice: na
  rationale: N’usoro Igbo ‘na’ na-ewebata ihe ha na-ekwu, dịka ὅτι si ewebata ọdịnaya okwu ahụ na Grik.
- source_word: ἐγώ εἰμι
  choice: m bụ ya
  rationale: Igbo chọrọ ihe nnọchi anya ‘ya’ ka ahịrịokwu ahụ zuo oke n’ụzọ ebumpụta ụwa; ọ na-ezo aka n’aha ‘Ọkpara Chineke’ dị n’ajụjụ ahụ ma na-echekwa mkpụmkpụ nzaghachi Grik.
theological_decisions:
- issue: Ma a ga-eme ka nzaghachi Jizọs bụrụ nkwenye doro anya kpamkpam, ka a hapụ ya n’ụdị ntụgharị okwu ya
  choice: Unu onwe unu na-ekwu na m bụ ya.
  alternative: Ọ bụ otu unu kwuru; ma ọ bụ, Ee, ọ bụ ya.
  rationale: Okwu Grik ahụ na-arụ ọrụ dị ka nzaghachi nkwenye n’ọnọdụ a, ma usoro ya na-atụgharị okwu ahụ laghachi n’ọnụ ndị jụrụ ajụjụ. Isi ederede na-echekwa ụdị ahụ na esemokwu nkà mmụta okpukpe dị na ya kama ime ka ọ bụrụ ‘Ee’ nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ọkpara Chineke’ na-echekwa aha ùgwù ahụ; ‘Ya bụ’ na-egosi nkwubi okwu dị n’ajụjụ ahụ. Ihe nrịbama nkọwa ala peeji [a] dị n’isi ederede ozugbo e kwuchara nzaghachi ahụ.
