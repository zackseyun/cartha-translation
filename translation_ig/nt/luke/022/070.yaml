- from: Ha niile wee sị, “Ya bụ, ị bụ Ọkpara Chineke?” Ọ zara ha, “Unu onwe unu na-ekwu na m bụ ya.”[a]
  to: Ha niile wee sị, “Ya mere, ị bụ Ọkpara Chineke?” Ọ sịrị ha, “Unu onwe unu na-ekwu na m bụ ya.”[a]
  rationale: The revision corrects the rendering of the inferential particle οὖν, uses the more source-near speech verb for ἔφη, and refines the alternative-reading note. It retains the established title “Ọkpara Chineke,” the emphatic plural subject, and the indirect form of Jesus’ reply.
