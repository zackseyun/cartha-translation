  to: Mgbe oge ahụ ruru, ya na ndịozi ahụ dinara n’akụkụ tebụl iri nri[a].
  rationale: The revision retains the narrative ‘hour,’ the apostles, and their association with Jesus. “Dinara n’akụkụ tebụl iri nri,” read with the note, gives a clear modern Igbo expression while preserving the historically specific dining posture of ἀνέπεσεν. The note supplies the cultural precision without overloading the verse.
