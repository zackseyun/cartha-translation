reference: Luke 22:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: ig
  text: Mgbe oge ahụ ruru, ya na ndịozi ahụ dinara n’akụkụ tebụl iri nri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’oge ahụ, ndị mmadụ na-adịkarị makpuo n’akụkụ tebụl mgbe ha na-eri nri, ọ bụghị ịnọdụ ala dịka a na-emekarị taa.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: Mgbe oge ahụ ruru
  rationale: Nke a bụ ụzọ Igbo si ekwu na oge a kara aka eruola; ‘oge ahụ’ na-edobekwa nkọwa nke ἡ ὥρα n’enweghị ịgbasa ihe odide ahụ.
- source_word: ἀνέπεσεν
  choice: ọ makpuru n’akụkụ tebụl iri nri
  rationale: ἀναπίπτω na-egosi ọnọdụ ndị mmadụ ji eri nri n’oge ahụ—ịmakpu n’akụkụ ebe nri—ọ bụghị nanị ịnọdụ ala. Ịkpọ tebụl aha na-enyere onye na-agụ Igbo taa aka ịghọta ihe a na-eme.
- source_word: οἱ ἀπόστολοι
  choice: ndịozi ahụ
  rationale: ‘Ndịozi’ bụ okwu Igbo a na-aghọta nke ọma maka ἀπόστολοι; ‘ahụ’ na-egosipụta otu ndị a maara ama nke njirimara okwu Grik ahụ na-arụtụ aka na ya.
- source_word: σὺν αὐτῷ
  choice: sokwa ya
  rationale: Nke a na-egosipụta n'ụzọ Igbo dị mfe na ndịozi nọnyere ya; ‘kwa’ na-ejikọta ha na omume e kwuru banyere ya.
- source_word: Καὶ
  choice: —
  rationale: A hapụrụ njikọ a ka usoro ahịrịokwu Igbo buru ya, kama ibido amaokwu ahụ na ‘Na’, nke ga-ada arọ ebe a; njikọ akụkọ ahụ ka dị n’usoro okwu ahụ.
theological_decisions:
- issue: Ọnọdụ e ji eri nri n’akụkọ Ememme Ngabiga
  choice: ọ makpuru n’akụkụ tebụl iri nri
  alternative: ọ nọdụrụ ala iri nri
  rationale: Nhọrọ a na-edobe ọnọdụ iri nri nke ngwaa Grik na-egosi, kama ime ka ọ bụrụ omume ịnọdụ ala nke oge a. Ọ bụ nkọwa asụsụ na omenala, ọ bụghị mgbakwunye ozizi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ugwu. E tinyere akara [a] ozugbo n’ebe okwu ọ na-akọwa dị, ya bụ n’ọrụ ‘ọ makpuru’, kama itinye ya n’akụkụ ‘oge ahụ ruru’.
