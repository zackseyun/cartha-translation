id: LUK.22.46
reference: Luke 22:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί καθεύδετε; ἀναστάντες προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: ig
  text: O wee sị ha, “Gịnị mere unu ji na-ehi ụra? Bilienụ kpee ekpere, ka unu ghara ịbanye n’ọnwụnwa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: na-ehi ụra
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si egosipụta ‘ịrahụ ụra’ n’ọnọdụ a.
- source_word: ἀναστάντες
  choice: Bilienụ
  rationale: Ọ na-egosipụta iwu ka ha si n’ọnọdụ ha bilie; ọ kwekọrọ n’ụdị participle a ji nye iwu n’amaokwu a.
- source_word: προσεύχεσθε
  choice: kpee ekpere
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ikpegara Chineke ekpere.
- source_word: εἰσέλθητε εἰς πειρασμόν
  choice: ịbanye n’ọnwụnwa
  rationale: E debere ihe oyiyi nke ‘ịbanye’ dị n’asụsụ Grik, ma hapụ πειρασμός ka ọ bụrụ ‘ọnwụnwa,’ nke nwere ike ịgụnye ọnwụnwa ime mmehie ma ọ bụ oge nnwale.
theological_decisions:
- issue: Ihe πειρασμός pụtara
  choice: ọnwụnwa
  alternative: nnwale
  rationale: ‘Ọnwụnwa’ bụ okwu a na-aghọta nke ọma n’Igbo ma na-edobe ịdọ aka ná ntị ime mmụọ; a kọwara n’ime mkpebi okwu na okwu Grik nwekwara obosara nke ‘nnwale,’ n’enweghị idozi nghọta ahụ n’otu akụkụ naanị.
- issue: Nzube ἵνα μή
  choice: ka unu ghara
  alternative: ka unu wee ghara
  rationale: Ụdị dị mkpirikpi a na-ada nke ọma n’Igbo ma na-egosipụta nzube ahụ kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E jiri ụdị okwu mmadụ na-ekwu mee ajụjụ na iwu ahụ, ma debe usoro echiche nke Grik.
