  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: ig
  text: Mgbe o bilisịrị n’ekpere, ọ bịakwutere ndị na-eso ụzọ ya, hụ ha ka ha na-ehi ụra[a] n’ihi mwute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “hụ ha nọ n’ụra n’ihi mwute.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: Mgbe o si n’ekpere bilie
  rationale: Nke a na-egosi na ibili ya n’ekpere buru ụzọ tupu ọ bịakwute ndị na-eso ụzọ ya, ma na-edobekwa echiche ἀπό nke isi n’otu ọnọdụ pụta.
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: ọ bịakwutere ndị na-eso ụzọ ya
  rationale: ‘Bịakwutere’ na-egosi ije bịaruo mmadụ nso dị ka πρός si kwuo; ‘ndị na-eso ụzọ ya’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa μαθηταί n’Oziọma.
- source_word: εὗρεν
  choice: hụ
  rationale: N’ọnọdụ a, ‘hụ’ bụ ụzọ Igbo si ekwu n’ụzọ dị mma na ọ bịara chọpụta ọnọdụ ha, n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: κοιμωμένους αὐτούς
  choice: hụ ha ka ha na-ehi ụra
  rationale: Usoro ‘ka ha na-ehi ụra’ na-echekwa ọdịdị participle nke na-egosi ihe ha nọ na-eme mgbe ọ hụrụ ha.
- source_word: ἀπὸ τῆς λύπης
  choice: n’ihi mwute
  rationale: N’ebe a ἀπό na-egosi ihe kpatara ọnọdụ ahụ. ‘N’ihi mwute’ bụ Igbo nkịtị, doro anya, ma ọ naghị etinye nkọwa gbasara uche ha nke ihe odide ahụ na-ekwughị.
theological_decisions:
- issue: Ihe kpatara ndị na-eso ụzọ ya ji hie ụra
  choice: E gosiri na mwute bụ ihe mere ha ji hie ụra.
  alternative: A pụrụ ịghọta ya nanị na ha nọ na-ehi ụra mgbe ha jupụtara na mwute, n’agbanyeghị na a naghị emesi ihe kpatara ya ike.
  rationale: ἀπὸ τῆς λύπης na-egosikarị ihe kpatara ihe, ya mere ‘n’ihi mwute’ kacha kwekọọ n’isi mmalite ahụ. Nsụgharị ahụ anaghị akọwa otú mwute si mee ka ụra bie ha karịa ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee nsụgharị ahụ. ‘Ndị na-eso ụzọ ya’ na-enye nghọta ngwa ngwa karịa okwu e si n’asụsụ ọzọ webata, ebe ‘mwute’ na-adabara λύπη nke ọma n’ọnọdụ a.
