review_pass:
  verdict: revise
  source_fidelity: The main rendering accurately conveys the sequence of rising from prayer, coming to the disciples, finding them sleeping, and sorrow as the cause of their sleep. The contextual possessive in “ndị na-eso ụzọ ya” is natural in Igbo and does not materially alter the referent.
  naturalness: The verse is clear and appropriately dignified in Standard Igbo. “Mgbe o bilisịrị n’ekpere” more smoothly marks the completed action preceding his coming. The current footnote wording, however, uses “hụ na,” which means “see that” rather than retaining the object “them.”
  terminology: “Ndị na-eso ụzọ” appropriately renders μαθηταί, “mwute” suitably renders λύπη, and “n’ihi” correctly expresses the causal force of ἀπό in this context.
  issues:
  - severity: low
    issue: The alternative footnote does not preserve “them” as the object of “found.”
    rationale: “Hụ na ha arahụla...” shifts the construction toward “see that they have slept” and is less faithful to εὗρεν κοιμωμένους αὐτούς. “Hụ ha nọ n’ụra” retains the object and gives a natural stative alternative for “found them asleep.”
  - severity: low
    issue: The footnote marker is placed after the causal phrase although the stated alternative concerns sleeping/asleep.
    rationale: Placing the anchor directly after “ụra” makes its scope clearer while leaving “n’ihi mwute” in both readings.
