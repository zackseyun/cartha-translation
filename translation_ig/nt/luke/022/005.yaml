  yaml_path: translation/nt/luke/022/005.yaml
  text: And they rejoiced and agreed to give him money[a].
translation:
  language: ig
  text: Ha ṅụrịrị ọṅụ, kwekọrịta inye ya ego[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ọlaọcha.” Okwu Grik ahụ nwere ike ịpụta ọlaọcha n’onwe ya ma ọ bụ ego n’ozuzu ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: Ha wee ṅụrịa ọṅụ
  rationale: Ọ na-egosipụta mmeghachi omume ha nke ọṅụ siri ike; okwu a bụ nke Igbo kwụ ọtọ ma dị ùgwù.
- source_word: συνέθεντο
  choice: kwekọrịtakwa
  rationale: N’etiti okwu a, ọ pụtara na ha bịara ná nkwekọrịta; “kwekọrịta” na-enye echiche ahụ kpọmkwem n’Igbo.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a bụ onye a ga-enye ihe; “inye ya ego” bụ usoro okwu Igbo sitere n’okike.
- source_word: ἀργύριον
  choice: ego
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta ọlaọcha n’onwe ya, n’ihe gbasara azụmahịa ọ na-apụtakarị ego. E debere “ọlaọcha” dị ka nhọrọ n’okpuru peeji.
- source_word: δοῦναι
  choice: inye
  rationale: Nke a na-ekwu ihe ha kwekọrịtara ime. “Inye” na-anọgide nso n’echiche okwu Grik ahụ karịa “ịkwụ.”
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. E ji “wee” gosi usoro akụkọ, ebe “-takwa” na-ejikọta omume abụọ ahụ n’ụzọ sitere n’okike.
