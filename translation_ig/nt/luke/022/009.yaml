  naturalness: The question is understandable, but “Ha wee sị ya” is less idiomatic as a completed narrative clause than “Ha sịrị ya,” and “Ebee ka …” is the more natural concise form for this direct location question in contemporary Standard Igbo.
  terminology: “kwadebe” and “nri Ngabiga” are appropriate and clear. The footnote's explanatory sentence should use the more natural expression “e kwuru maka ya” rather than “e kwuru okwu ya.”
