  yaml_path: translation/nt/luke/022/009.yaml
  text: They said to him[a], “Where do you want us to prepare it?”
translation:
  language: ig
  text: Ha sịrị ya, “Ebee ka ị chọrọ ka anyị kwadebe ya[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ zuru ezu karị, “ka anyị mee nkwadebe.” “Ya” na-ezo aka na nri Ngabiga e kwuru maka ya n’amaokwu bu ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ha wee
  rationale: Akụkụ a na-ezo aka n’ebe ndị na-eso ụzọ nọ; δέ bụ njikọ dị nro, nke “wee” na-egosipụta n’Igbo nkịtị.
- source_word: εἶπαν αὐτῷ
  choice: sị ya
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu n'ụzọ ebumpụta ụwa ma na-egosipụta ma ngwaa ahụ ma onye a gwara okwu.
- source_word: Ποῦ
  choice: Olee ebe
  rationale: Ọ na-ajụ kpọmkwem banyere ebe ihe ga-eme.
- source_word: θέλεις
  choice: ị chọrọ
  rationale: Ọ na-egosipụta ọchịchọ ma ọ bụ ebumnuche n’asụsụ Igbo nke oge a.
- source_word: ἑτοιμάσωμεν
  choice: ka anyị kwadebe ya
  rationale: Ụdị subjunctive onye mbụ ọtụtụ mgbe θέλεις na-ada n’Igbo nke ọma dịka “ị chọrọ ka anyị…”. “Ya” bụ ihe a ghọtara site n’okwu bu ụzọ banyere nri Ngabiga.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ nke oge a, dị mfe nghọta ma dịkwa ùgwù. E debere “sị ya” kama “jụrụ ya” iji nọrọ nso n’okwu Grik, ebe ajụjụ dị n’okwu a kpọrọ kpọmkwem.
