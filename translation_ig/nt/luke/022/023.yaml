  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: ig
  text: Ha wee malite ịkparịta ụka n’etiti onwe ha banyere onye n’ime ha pụrụ ịbụ onye ahụ na-achọ ime ihe a[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ ya: “onye n’ime ha ọ pụrụ ịbụ onye ahụ na-achọ ime ihe a.” Ihe ndị gbara amaokwu a gburugburu na-eme ka o doo anya na “ihe a” bụ omume ịrara Jizọs nye nke e kwuru n’amaokwu bu ụzọ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: wee malite
  rationale: Ọ na-egosi na ha bidoro ime ihe ahụ; ‘wee malite’ bụ ụzọ Igbo dị mma isi jikọta ihe omume a na ihe gara ya n’ihu.
- source_word: συζητεῖν
  choice: ịkparịta ụka
  rationale: Okwu Grik a nwere ike ịpụta ịtụle okwu, ịrụrịta ụka, ma ọ bụ ịjụrịta ajụjụ ọnụ. ‘Ịkparịta ụka’ na-egosi mkparịta ụka ha n’enweghị ịgbakwunye echiche na ha na-ese okwu ike.
- source_word: πρὸς ἑαυτούς
  choice: n'etiti onwe ha
  rationale: Nke a na-egosi na ndị nọ n’ìgwè ahụ na-ekwurịta okwu n’onwe ha.
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: banyere onye n'ime ha pụrụ ịbụ
  rationale: Nhazi a na-egosi ajụjụ a na-akọ n’ụzọ na-abụghị okwu kpọmkwem, tinyere ejighị n’aka onye ahụ bụ. ‘Pụrụ ịbụ’ na-echekwa ọnọdụ amaghị ama nke εἴη n’Igbo dị mma.
- source_word: ὁ τοῦτο μέλλων πράσσειν
  choice: onye ahụ na-aga ime ihe a
  rationale: ‘Na-aga ime’ na-egosi ihe a tụrụ anya na ọ dị nso ime, ebe ‘ime ihe a’ na-edobe okwu ahụ n’ozuzu dịka Grik si kwuo ya.
- source_word: τοῦτο
  choice: ihe a
  rationale: Ọ na-arụtụ aka n’ihe e kwuru n’amaokwu bu ụzọ, na-enweghị ịkpọ omume ahụ aha ọzọ n’amaokwu a.
theological_decisions:
- issue: Ma a ga-akọwa ‘ihe a’ kpọmkwem dịka ịrara Jizọs nye
  choice: E debere okwu sara mbara bụ ‘ime ihe a’ n’ahịrị isi.
  alternative: ‘onye ga-arara ya nye’
  rationale: Ọ bụ ezie na amaokwu bu ụzọ na-eme ka o doo anya na ihe a bụ ịrara Jizọs nye, Grik nke amaokwu a kwuru τοῦτο (‘ihe a’). Idebe ya otú ahụ na-ahapụ ka gburugburu okwu kọwaa ya ma zere itinye okwu na-anọghị n’amaokwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ịkparịta ụka n'etiti onwe ha’ na-egosipụta mkparịta ụka ha n’ìgwè, ebe ‘pụrụ ịbụ’ na-echekwa ejighị n’aka dị n’ajụjụ ahụ.
