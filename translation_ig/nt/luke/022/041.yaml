  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: ig
  text: Ya onwe ya si n’ebe ha nọ pụọ gaa ihe dịka ọtụ okwute; o wee gbuo ikpere n’ala, na-ekpe ekpere.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: si n’ebe ha nọ pụọ
  rationale: Ụdị okwu Grik a bụ passive, ma n’ọnọdụ a ọ na-egosi na Jizọs kewapụrụ onwe ya n’ebe ndị na-eso ụzọ ya nọ. Nsụgharị a bụ Igbo dị mfe ma na-egosi ịpụ iche n’enweghị ịmanye passive na-adịghị ada ụtọ.
- source_word: ὡσεὶ λίθου βολήν
  choice: ihe dịka ebe mmadụ pụrụ ịtụ okwute ruo
  rationale: Nke a bụ ụzọ e si atụ anya ogologo ebe. ‘Ihe dịka’ na-echekwa echiche ὡσεὶ nke na-egosi na ogologo ahụ abụghị kpọmkwem.
- source_word: θεὶς τὰ γόνατα
  choice: gbuo ikpere n’ala
  rationale: N’agbanyeghị na okwu Grik pụtara n’ụzọ nkịtị ‘dobe ikpere,’ ọ bụ akpaalaokwu maka igbu ikpere n’ala. Nke a bụ ụzọ doro anya ma bụrụkwa nke a na-asụ n’Igbo.
- source_word: προσηύχετο
  choice: na-ekpe ekpere
  rationale: Imperfect Grik na-egosi omume na-aga n’ihu; ‘na-ekpe ekpere’ na-echekwa akụkụ ahụ nke omume na-aga n’ihu.
- source_word: αὐτὸς
  choice: o
  rationale: Ọnọchiaha ahụ nwere ntakịrị nkwusi ike, ma ‘o’ zuru oke n’Igbo n’ihi na onye a na-ekwu maka ya doro anya. Ịgbakwụnye ‘ya onwe ya’ nwere ike ime ka nkwusi ike ahụ sie karịa nke isi mmalite.
- source_word: καὶ
  choice: O wee
  rationale: ‘O wee’ na-ejikọta omume ndị a nke ọma n’akụkọ Igbo ma ghara ịgbakwụnye nkọwa ọzọ.
theological_decisions:
- issue: Ọnọdụ ahụ Jizọs ji kpee ekpere na otú e si kọwaa ya
  choice: Ịkọwa ya ozugbo dị ka onye si n’ebe ndị na-eso ụzọ ya nọ pụọ, gbuo ikpere n’ala, na-ekpe ekpere.
  alternative: Ịgbakwụnye nkọwa ofufe ma ọ bụ ozizi banyere ihe mere o ji pụọ iche ma gbuo ikpere n’ala.
  rationale: Amaokwu ahụ na-akọ naanị mmegharị ahụ ya na ọnọdụ o ji kpee ekpere. Nsụgharị ekwesịghị ịgbakwụnye ozizi ma ọ bụ nkọwa ime mmụọ nke adịghị n’ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dịkwa mfe nghọta. ‘Gbuo ikpere n’ala’ bụ akpaalaokwu a na-aghọta nke ọma; ‘ihe dịka ebe mmadụ pụrụ ịtụ okwute ruo’ na-echekwa ihe atụ anya ogologo ebe n’asụsụ Grik.
