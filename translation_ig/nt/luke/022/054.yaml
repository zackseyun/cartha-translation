  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: ig
  text: Mgbe ha jidere ya, ha duuru ya pụọ ma kpọbata ya n'ụlọ onyeisi nchụàjà. Ma Pita nọ na-eso ya n'ebe dị anya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “site n'ebe dị anya,” ma ọ bụ, dị ka nsụgharị ọdịnala ụfọdụ si kwuo, “n'ebe tere aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συλλαβόντες
  choice: Mgbe ha jidere ya
  rationale: Nkebi ahịrị a dị n'ụdị aorist participle ma na-egosi ihe mere tupu ngwaa ndị isi; ‘Mgbe ha jidere ya’ bụ Igbo doro anya nke na-egosikwa na e tinyela ya n'okpuru njide.
- source_word: ἤγαγον
  choice: ha duuru ya pụọ
  rationale: ‘Duurụ ya pụọ’ na-egosi na a na-akpọrọ ya n'okpuru ikike, ma na-edobekwa ọdịiche ya na ngwaa na-esote nke pụtara ịkpọbata n'ime.
- source_word: εἰσήγαγον
  choice: kpọbata ya
  rationale: ‘Kpọbata’ na-edobe echiche nke mmegharị banye n'ime ebe, nke πρόposishọn e tinyere na εἰσάγω na-egosi.
- source_word: οἰκίαν
  choice: ụlọ
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ebe obibi a pụrụ ịbanye n'ime ya; ‘ụlọ’ bụ okwu Igbo kachasị mfe ma kwụ ọtọ.
- source_word: ἀρχιερέως
  choice: onyeisi nchụàjà
  rationale: ‘Onyeisi nchụàjà’ bụ nsụgharị Igbo doro anya maka ọkwa ἀρχιερεύς, na-enweghị ịgwakọta ya na ndị isi nchụàjà n'ozuzu ha.
- source_word: ἠκολούθει
  choice: nọ na-eso ya
  rationale: Ụdị imperfect na-egosi omume na-aga n'ihu n'oge gara aga; ‘nọ na-eso’ na-echekwa akụkụ ahụ nke ihe na-aga n'ihu.
- source_word: μακρόθεν
  choice: n'ebe dị anya
  rationale: Okwu a na-egosi ohere dị n'etiti ha. ‘N'ebe dị anya’ bụ Igbo nkịtị, doro anya, ma ọ naghị agbakwụnye ihe banyere ihe kpatara Pita ji mee otú ahụ.
- source_word: δὲ
  choice: Ma
  rationale: δὲ nke abụọ na-egosi obere ọdịiche dị n'etiti ịkpọbata Jizọs n'ụlọ na Pita nke nọ na-eso n'ebe dị anya; ‘Ma’ na-egosipụta ọdịiche ahụ n'ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Nkọwa banyere otú Pita si soro Jizọs mgbe e jidere ya
  choice: E ji ‘nọ na-eso ya n'ebe dị anya’ kọwaa naanị omume na ọnọdụ ya.
  alternative: A pụrụ ịsị ‘sooro ya site n'ebe dị anya,’ ma e kwesịghị ịgbakwunye na ọ na-eso ya ‘na nzuzo’ ma ọ bụ ‘n'ihi ụjọ.’
  rationale: Amaokwu ahụ na-ekwu na Pita nọ na-eso n'ebe dị anya, ma ọ kọwaghị ebumnobi ma ọ bụ mmetụta uche ya. Nsụgharị a na-ahapụ esemokwu dị n'akụkọ ahụ ka ọ dị n'ebughị nkọwa uche ọzọ bata.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. E debere ngwaa abụọ nke ngagharị—‘duuru ya pụọ’ na ‘kpọbata ya’—iji gosipụta usoro dị na Grik. Akara ntụaka [a] dị n'akụkụ okwu μακρόθεν ọ na-akọwa.
