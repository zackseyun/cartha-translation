  rationale: The revision retains the source’s implied action, temporal sequence, covenantal wording, and sacrificial reference in idiomatic Standard Igbo. It corrects the lexical footnote’s anchor and content, and it revises the syntactic note so that it reports the contextual preference without erasing the Greek grammatical ambiguity.
