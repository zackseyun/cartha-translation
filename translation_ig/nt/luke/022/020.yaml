id: LUK.22.20
reference: Luke 22:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: ig
  text: N’otu aka ahụ, mgbe ha risịrị nri, o weere iko ahụ, sị, “Iko a bụ ọgbụgba ndụ ọhụrụ[a] n’ọbara m, nke a na-awụpụ maka unu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị διαθήκη ebe a dịka “testament”; ma “ọgbụgba ndụ” na-egosi nke ọma ndabere ọgbụgba ndụ nke okwu a.
    reason: lexical_alternative
  - marker: b
    text: N’okwu Grik, “nke a na-awụpụ maka unu” na-esochi nkebi ahịrịokwu ahụ dum. N’ụzọ ụtọasụsụ, o nwere ike iyi ka ọ dabara na “iko,” ma n’ọnọdụ a, nghọta kachasị pụta ìhè bụ na ọ bụ ọbara Jizọs ka a na-awụpụ maka unu.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ποτήριον
  choice: iko
  rationale: Ọ bụ okwu Igbo nkịtị na nke doro anya maka arịa a na-aṅụ ihe ọṅụṅụ; ọ naghị ebubata okwu pụrụ iche nke emume ụka.
- source_word: ὡσαύτως
  choice: N’otu aka ahụ
  rationale: Ọ na-ejikọta omume a na nke bu ya ụzọ ma na-ada nke ọma n’Igbo.
- source_word: μετὰ τὸ δειπνῆσαι
  choice: mgbe ha risịrị nri
  rationale: Ọ na-echekwa usoro oge nke okwu Grik ma bụrụ Igbo e ji eme ihe kwa ụbọchị.
- source_word: λέγων
  choice: na-asị
  rationale: Ọ na-echekwa njikọ participle dị na Grik n’ụzọ na-aga were were n’Igbo.
- source_word: καινὴ
  choice: ọhụrụ
  rationale: N’ọnọdụ gbasara ọgbụgba ndụ, nke a bụ ntụgharị doro anya ma kwesị ekwesị.
- source_word: διαθήκη
  choice: ọgbụgba ndụ
  rationale: Ọ na-echekwa ndabere Akwụkwọ Nsọ Ochie nke nkwekọrịta e ji ọbara guzosie ike, kama ịtụgharị ya dị ka akwụkwọ ikike onye nwụrụ anwụ.
- source_word: ἐν τῷ αἵματί μου
  choice: n’ọbara m
  rationale: Ọ na-anọ nso n’ụdị okwu Grik ma ghara ikpebi ma ἐν pụtara kpọmkwem ‘site n’ọbara’ ma ọ bụ ‘n’ọbara.’
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: nke a na-awụpụ maka unu
  rationale: Ọ na-egosi n’ụzọ ebumpụta ụwa na ọbara Jizọs bụ ihe a na-awụpụ, ebe ‘maka unu’ na-echekwa ike ὑπὲρ n’enweghị ịmanye otu nkọwa ozizi pụrụ iche.
theological_decisions:
- issue: Ntụgharị διαθήκη n’ọnọdụ nri Onyenwe anyị na ọgbụgba ndụ
  choice: ọgbụgba ndụ ọhụrụ
  alternative: ọgbụgba ndụ ọhụrụ e dere n’akwụkwọ / testament ọhụrụ
  rationale: Ọnọdụ a na-akpọghachi asụsụ ọgbụgba ndụ e ji ọbara guzosie ike n’Akwụkwọ Nsọ Ochie; ‘ọgbụgba ndụ’ na-echekwa nke ahụ nke ọma karịa echiche nke akwụkwọ ikike.
- issue: Ihe τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον na-ezo aka na ya
  choice: A ghọtara ya n’echiche dị ka ọbara Jizọs nke a na-awụpụ maka ha.
  alternative: N’usoro ụtọasụsụ siri ike, enwere ike ịhụ nkebi ahụ ka ọ na-esochi okwu niile ma ọ bụ ka ọ dabara na ‘iko.’
  rationale: Ọ bụ ezie na participle ahụ bụ neuter ma kwekọọ n’ụdị ya na ποτήριον, nghọta nke ọnọdụ ahụ bụ na ọbara ka a na-awụpụ, ọ bụghị arịa iko. Ihe odide na ndetu ala na-echekwa mgbagwoju anya ụtọasụsụ ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘O were iko ahụ’ na-eme ka ngwaa a ghọtara site n’amaokwu bu ụzọ doo anya n’Igbo, ebe ‘na-asị’ na-echekwa njikọ nke participle. E zere okwu emume ụka pụrụ iche.
