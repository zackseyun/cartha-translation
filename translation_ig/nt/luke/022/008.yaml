revisions:
- from: O wee ziga Pita na Jọn, sị ha, “Gaanụ kwadebeere anyị Emume Ngabiga[a], ka anyị wee rie ya.”
  to: O zipụrụ Pita na Jọn, sị ha, “Gaanụ, kwadebeere anyị nri Emume Ngabiga[a], ka anyị wee rie ya.”
  rationale: The revision makes the prepared and eaten referent explicit as the Passover meal, yielding natural Igbo and reflecting the immediate syntax and context. The footnote retains the broader possible sense of πάσχα, so the translation does not overstate a lexical narrowing beyond this context.
