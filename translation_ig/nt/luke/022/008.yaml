review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the sending of Peter and John, the paired imperatives, the benefactive ‘for us,’ and the purpose clause. However, ‘Emume Ngabiga’ (the Passover festival) followed by ‘rie ya’ (‘eat it’) is less precise idiomatically in Igbo, since what is prepared and eaten in this context is the Passover meal. The Greek πάσχα retains a broader lexical range, which is best preserved in a footnote.
  naturalness: ‘O zipụrụ Pita na Jọn, sị ha’ is straightforward modern Standard Igbo. Adding a comma after ‘Gaanụ’ clarifies the two coordinated commands. ‘nri Emume Ngabiga’ naturally supplies an edible referent for ‘rie ya.’
  terminology: ‘Emume Ngabiga’ is retained as the standard designation for Passover. ‘nri Emume Ngabiga’ appropriately denotes the meal in the main text without asserting that πάσχα must always have that narrower sense; the note records the broader alternative.
  issues:
  - severity: medium
    issue: The main text calls the object ‘Emume Ngabiga’ but subsequently says to eat it.
    rationale: In Standard Igbo, an emume is primarily an observance or festival, not ordinarily the thing eaten. The immediate Greek context—prepare it so that we may eat—supports rendering the meal in the main line, while a note can preserve πάσχα’s wider reference.
  revised_text: O zipụrụ Pita na Jọn, sị ha, “Gaanụ, kwadebeere anyị nri Emume Ngabiga[a], ka anyị wee rie ya.”
