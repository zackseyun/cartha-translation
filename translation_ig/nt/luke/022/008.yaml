  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: ig
  text: O zipụrụ Pita na Jọn, sị ha, “Gaanụ, kwadebeere anyị nri Emume Ngabiga[a], ka anyị wee rie ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Emume Ngabiga.” Okwu Grik ahụ nwere ike izo aka n’Emume Ngabiga n’ozuzu ya; ma n’ebe a, okwu banyere ịkwadebe ya na iri ya na-egosi oriri ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: ziga
  rationale: “Ziga” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa izipụ mmadụ ka ọ gaa rụọ ọrụ.
- source_word: εἰπών
  choice: sị ha
  rationale: Nke a na-ejikọta iziga ha na okwu o gwara ha n’ụzọ Igbo si ada nke ọma; “ha” na-eme ka ndị a gwara okwu doo anya n’enweghị mgbanwe n’ihe amaokwu ahụ pụtara.
- source_word: Πορευθέντες
  choice: Gaanụ
  rationale: Ọ bụ ezie na okwu Grik a bụ participle, n’ebe a ọ na-arụ ọrụ dị ka iwu nke na-ebute iwu ọzọ; “Gaanụ” na-egosipụta ike iwu ahụ n’Igbo nkịtị.
- source_word: ἑτοιμάσατε
  choice: kwadebeere
  rationale: “Kwadebeere” na-egosi ime nkwadebe dị mkpa maka ndị ọzọ, ma kwekọọ na dative ἡμῖν nke na-esochi ya.
- source_word: ἡμῖν
  choice: anyị
  rationale: N’usoro “kwadebeere anyị,” “anyị” na-egosi ndị a na-emere nkwadebe ahụ, ya bụ Jizọs na ndị ya, n’enweghị ịgbakwunye “anyị niile.”
- source_word: τὸ πάσχα
  choice: Emume Ngabiga
  rationale: “Emume Ngabiga” na-echekwa obosara nke πάσχα, nke nwere ike izo aka n’emume ahụ n’ozuzu ya ma ọ bụ n’oriri ya; ọnọdụ okwu gbasara iri ya na-akọwa ihe a na-elekwasị anya.
- source_word: ἵνα φάγωμεν
  choice: ka anyị wee rie ya
  rationale: “Ka … wee” na-egosipụta ebumnuche nke ἵνα na subjunctive, ebe “ya” na-eme ka ihe a ga-eri doo anya dịka Emume Ngabiga ahụ.
theological_decisions:
- issue: Ihe “τὸ πάσχα” na-ezo aka na ya
  choice: Emume Ngabiga
  alternative: nri Emume Ngabiga; nwa atụrụ Ngabiga
  rationale: Ọnọdụ a, nke kwuru maka ịkwadebe na iri ya, na-atụ aka nke ukwuu n’oriri ahụ. Ma okwu Grik n’onwe ya nwere nghọta sara mbara karị, ya mere e chekwara “Emume Ngabiga” n’ahịrị bụ isi ma kọwaa nhọrọ dị warara na ndetu ala.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Gaanụ” na “kwadebeere” na-egosi na a na-agwa Pita na Jọn abụọ okwu. A họọrọ usoro “O wee …, sị ha” ka akụkọ ahụ na okwu Jizọs jikọọ n’ụzọ Igbo si ada nke ọma.
