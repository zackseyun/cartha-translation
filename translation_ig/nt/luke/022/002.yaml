  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: ig
  text: Ndị isi nchụàjà na ndị odeakwụkwọ iwu nọkwa na-achọ ụzọ ha ga-esi gbuo ya[a], n’ihi na ha na-atụ ndị mmadụ egwu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụzọ ha ga-esi wepụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: nọkwa na-achọ
  rationale: Ọdịdị imperfect na-egosi omume gara n’ihu n’oge gara aga; ‘nọkwa na-achọ’ na-echekwa echiche ahụ, ebe ‘kwa’ na-anọchi καί nke jikọtara amaokwu a na nke bu ya ụzọ.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụàjà
  rationale: Nke a bụ okwu Igbo doro anya maka ndị ndú nchụàjà nọ na Jeruselem, ọ naghịkwa eme ka a ghọta ya dị ka à ga-asị na ọtụtụ mmadụ ji otu ọkwa onyeisi nchụàjà n’otu oge.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Ọ bụ nsụgharị kpọmkwem, nke a na-ejikarị eme ihe n’akụkọ Oziọma; ‘ndị nkuzi iwu’ ga-akọwa ọrụ ha karịa ihe okwu Grik ahụ kwuru n’onwe ya.
- source_word: τὸ πῶς
  choice: ụzọ ha ga-esi
  rationale: Nkebiokwu a na-egosi ‘otu’ ma ọ bụ ‘ụzọ’ e si eme ihe; ụdị Igbo a bụ nke sitere n’ọnụ ma doo anya.
- source_word: ἀνέλωσιν
  choice: gbuo ya
  rationale: N’ebe a, okwu ahụ pụtara iwepụ mmadụ site n’ọnwụ. ‘Gbuo ya’ na-egosi ebumnobi ọjọọ ahụ nke ọma, n’etinyeghị usoro ikpe iwu na-adịghị n’ederede.
- source_word: ἐφοβοῦντο
  choice: ha na-atụ ... egwu
  rationale: Ụdị a na-egosi ọnọdụ egwu nke nọgidere na-adị, kwekọọkwa na imperfect Grik.
- source_word: τὸν λαόν
  choice: ndị mmadụ
  rationale: Ọ na-ezo aka n’ebe ndị mmadụ n’ozuzu ha nọ dị ka otu ọha; ‘ìgwè mmadụ’ ga-eme ka ihe ọ na-ezo aka na ya dị warara karịa ka Grik si dị.
theological_decisions:
- issue: Ike okwu ἀνέλωσιν n’ihe gbasara ebumnobi ndị ndú ahụ
  choice: gbuo ya
  alternative: mee ka ọ nwụọ
  rationale: A hapụrụ ebumnobi igbu Jizọs ka ọ pụta ìhè, n’emeghị ka ọ dị nro ma ọ bụ tinye usoro ikpe iwu a na-ekwughị n’amaokwu a.
- issue: Ndị λαός na-ezo aka na ha
  choice: ndị mmadụ
  alternative: ìgwè mmadụ
  rationale: 'Nke a na-echekwa nghọta sara mbara nke ndị mmadụ dịka ọha, nakwa esemokwu dị n’akụkọ ahụ: egwu mmeghachi omume ndị mmadụ gbochiri ndị ndú ahụ.'
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. Usoro ahịrịokwu ahụ na-echekwa omume gara n’ihu nke ngwaa imperfect abụọ ahụ ma hapụ ịdị njọ nke ebumnobi ndị ndú ka ọ pụta ìhè.
