revisions:
- from: Ndị isi nchụàjà na ndị odeakwụkwọ nọkwa na-achọ ụzọ ha ga-esi gbuo ya[a], n’ihi na ha na-atụ ndị mmadụ egwu.
  to: Ndị isi nchụàjà na ndị odeakwụkwọ iwu nọkwa na-achọ ụzọ ha ga-esi gbuo ya[a], n’ihi na ha na-atụ ndị mmadụ egwu.
  rationale: The revision clarifies γραμματεῖς for modern Igbo readers and adjusts the lexical-alternative footnote to reflect ἀναιρέω more closely. The ongoing action, murderous intent, and fear of the people remain unchanged.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:38Z'
review_pass:
  verdict: revise
  source_fidelity: The rendering accurately retains the ongoing force of ἐζήτουν and ἐφοβοῦντο, the leaders’ intent to kill Jesus, and λαός as the people collectively. However, in current Standard Igbo, ndị odeakwụkwọ ordinarily means secretaries and does not adequately identify γραμματεῖς in this Gospel setting.
  naturalness: The sentence is clear and appropriately formal. Replacing ndị odeakwụkwọ with ndị odeakwụkwọ iwu makes the historical referent clear to contemporary readers while retaining a natural Igbo expression.
  terminology: Ndị isi nchụàjà, gbuo ya, and ndị mmadụ are suitable. Ndị odeakwụkwọ iwu is preferred for γραμματεῖς; it avoids the modern default sense of office secretaries. The supplied footnote’s mee ka ọ nwụọ softens the lexical alternative and is replaced with a closer alternative.
  issues:
  - severity: medium
    issue: ndị odeakwụkwọ for γραμματεῖς
    rationale: In modern Standard Igbo this normally denotes secretaries. The Gospel scribes were recognized experts associated with the law; adding iwu supplies necessary contextual identification without changing the verse’s meaning.
  - severity: low
    issue: Footnote alternative “mee ka ọ nwụọ”
    rationale: This wording means ‘cause him to die’ and can weaken the direct force of ἀνέλωσιν. A ‘remove/do away with’ alternative better reflects the lexical range while leaving the main text’s explicit ‘kill’ intact.
  revised_text: Ndị isi nchụàjà na ndị odeakwụkwọ iwu nọkwa na-achọ ụzọ ha ga-esi gbuo ya[a], n’ihi na ha na-atụ ndị mmadụ egwu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ụzọ ha ga-esi wepụ ya.”
    reason: lexical_alternative
  revision_rationale: The revision clarifies γραμματεῖς for modern Igbo readers and adjusts the lexical-alternative footnote to reflect ἀναιρέω more closely. The ongoing action, murderous intent, and fear of the people remain unchanged.
