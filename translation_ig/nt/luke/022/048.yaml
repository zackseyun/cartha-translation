  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: ig
  text: Ma Jizọs sịrị ya, “Judas, ọ̀ bụ nsusu ọnụ ka ị ji na-arara Nwa nke Mmadụ nye?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dabara nnọọ n’okwu mbụ: “Judas, ọ̀ bụ nsusu ọnụ ka ị ji enyefe Nwa nke Mmadụ?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Njikọ δέ dị nro, ma n’ọnọdụ a ọ na-egosi ọdịiche dị n’etiti ihe Judas mere na nzaghachi Jizọs; “Ma” bụ ụzọ Igbo doro anya si gosipụta ya.
- source_word: εἶπεν αὐτῷ
  choice: sịrị ya
  rationale: Nke a na-anọchi ma ngwaa “kwuru” ma nnọchiaha dative αὐτῷ n’ụzọ Igbo nkịtị ma dị nkenke.
- source_word: Ἰούδα
  choice: Judas
  rationale: Aha a dị na vocative; “Judas” bụ nsụgharị mkpụrụedemede aha ahụ nke ndị na-agụ Baịbụl Igbo maara nke ọma.
- source_word: φιλήματι
  choice: nsusu ọnụ ka ị ji
  rationale: Dative a na-egosi ihe e ji mee ihe. Usoro Igbo “ka ị ji” na-echekwa echiche nke iji nsusu ọnụ dị ka ụzọ e si mee omume ahụ.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa ọdịdị aha ahụ n’asụsụ Grik na ịdị arọ ya dịka aha Jizọs ji akọwa onwe ya, n’etinyeghị nkọwa otu ụka.
- source_word: παραδίδως
  choice: na-arara ... nye
  rationale: N’ọnọdụ a, παραδίδως pụtara inyefe mmadụ n’aka ndị iro, ya mere “na-arara ... nye” na-ekwupụta ihe ọjọọ dị n’omume ahụ ma na-echekwa present tense nke ihe na-eme ugbu a.
theological_decisions:
- issue: Nsụgharị τὸν υἱὸν τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: “Nwa nke Mmadụ” na-echekwa nhazi okwu Grik, aha Jizọs ji akọwa onwe ya, na njikọ Akwụkwọ Nsọ ya, n’emeghị ka ọ bụrụ naanị okwu gbasara mmadụ n’ozuzu.
- issue: Uche nke παραδίδως
  choice: na-arara ... nye
  alternative: na-enyefe ... n’aka
  rationale: Ọnọdụ akụkọ a na-akwado uche nke ịrara mmadụ nye, ma ihe ngwaa ahụ pụtara n'ụzọ nkịtị bụ inyefe mmadụ. E debere nke ọzọ n’okpuru ala ka e wee ghara izochi obosara okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ajụjụ ahụ ka bụ ajụjụ nkwutọ nke na-eme ka njọ nke iji akara ịhụnanya rara mmadụ nye pụta ìhè. E debere “Nwa nke Mmadụ” dịka aha pụrụ iche.
