  rationale: E debere ederede isi n’ihi na ọ na-egosipụta ihe Grik ahụ n’ụzọ ziri ezi ma bụrụ Igbo nkịtị. E degharịrị ala okwu ahụ naanị iji wepụ nkọwa “n’aka ndị iro,” nke na-adịghị n’amaokwu Grik, ma ka o wee nye ụzọ ọzọ e si asụgharị παραδίδως dịka “enyefe.”
