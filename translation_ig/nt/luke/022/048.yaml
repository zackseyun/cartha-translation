review_pass:
  verdict: revise
  source_fidelity: 'Isi okwu ahụ ziri ezi nke ọma: ọ na-edobe nnọchiaha a kpọpụtara kpọmkwem (“ya”), ajụjụ rhetorical ahụ, ụzọ e ji mee omume ahụ (“nsusu ọnụ”), na aha pụrụ iche “Nwa nke Mmadụ.” “na-arara ... nye” kwekọrọ n’ọnọdụ aghụghọ a, ebe ọ na-egosi uru ọjọọ nke παραδίδως. Otú ọ dị, ala okwu ahụ na-agbakwụnye “n’aka ndị iro,” nke na-adịghị n’ihe odide Grik; a ghaghị iwepu ya.'
  naturalness: “Ma Jizọs sịrị ya, ‘Judas, ọ̀ bụ nsusu ọnụ ka ị ji na-arara Nwa nke Mmadụ nye?’” bụ Standard Igbo doro anya, nke sitere n’okwu ọnụ ma kwesịkwa ekwesị n’akụkọ Akwụkwọ Nsọ. Nhazi “ka ị ji na-arara” na-egosi n’ụzọ nkịtị na nsusu ọnụ bụ ụzọ e ji mee ịrara ahụ.
  terminology: “Jizọs,” “Judas,” na “Nwa nke Mmadụ” dabara na aha Baịbụl Igbo a na-ahụkarị. “na-arara ... nye” kwesịrị ekwesị n’amaokwu a; ala okwu ahụ kwesịrị inye “na-enyefe” naanị dịka ụzọ ọzọ e si sụgharị παραδίδως, na-enweghị ịkọwa onye a na-enyefe ya n’aka.
  issues:
  - severity: medium
    issue: Ala okwu a na-agbakwụnye “n’aka ndị iro.”
    rationale: SBLGNT kwuru naanị “ị na-enyefe Nwa nke Mmadụ,” ma ọ kpọghị ndị a na-enyefe ya n’aka. Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-eme ka echiche ahụ doo anya, itinye ya n’ala okwu a kpọrọ “n’ụzọ dabara nnọọ n’okwu mbụ” karịrị ihe odide ahụ kwuru.
  revised_text: Ma Jizọs sịrị ya, “Judas, ọ̀ bụ nsusu ọnụ ka ị ji na-arara Nwa nke Mmadụ nye?”[a]
