revisions:
- from: Otu onye n’ime ha wee tie ohu onyeisi nchụàjà ahụ mma agha, bipụ ya ntị aka nri.[a]
  to: Otu onye n’ime ha tiri ohu onyeisi nchụàjà ahụ, wee bipụ ntị aka nri ya.[a]
  rationale: The only required correction is deletion of the added sword. “Tiri” faithfully renders the forceful but instrument-unspecified ἐπάταξεν, while “bipụ ntị aka nri ya” naturally expresses the injury described by ἀφεῖλεν in context. The existing alternative-reading footnote is retained and remains correctly anchored.
  reviewer_model: gpt-5.6-terra
