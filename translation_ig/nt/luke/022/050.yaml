review_pass:
  verdict: revise
  source_fidelity: The draft adds “mma agha” (“with a sword”), but no instrument appears in Luke 22:50’s Greek. Although a sword occurs in the wider narrative, it must not be supplied in this verse. The revision retains the anonymous “one of them,” the high priest’s slave, the striking, and the removal of the right ear.
  naturalness: 'Removing the unsupported instrumental phrase also produces a more direct and natural Standard Igbo sequence: he struck the slave and cut off his right ear.'
  terminology: “Ohu” is an appropriate, concrete rendering of δοῦλος here. “Onyeisi nchụàjà” accurately renders ἀρχιερεύς, and “ntị aka nri ya” clearly conveys “his right ear.”
  issues:
  - severity: high
    issue: The translation introduces “mma agha” (“sword”).
    rationale: The SBLGNT text says only that one of them struck the high priest’s slave and removed/cut off his right ear. It does not state the means of striking; the instrument must not be imported from the surrounding context.
  revised_text: Otu onye n’ime ha tiri ohu onyeisi nchụàjà ahụ, wee bipụ ntị aka nri ya.[a]
  revised_footnotes:
