id: LUK.22.50
reference: Luke 22:50
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπάταξεν εἷς τις ἐξ αὐτῶν ⸂τοῦ ἀρχιερέως τὸν δοῦλον⸃ καὶ ἀφεῖλεν ⸂τὸ οὖς αὐτοῦ⸃ τὸ δεξιόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: ig
  text: Otu onye n’ime ha tiri ohu onyeisi nchụàjà ahụ, wee bipụ ntị aka nri ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “onye na-ejere onyeisi nchụàjà ahụ ozi.” Okwu Grik bụ doulos, nke nwere ike ịpụta ohu ma ọ bụ onye na-eje ozi, dabere n’ọnọdụ okwu ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: tie ... mma agha
  rationale: N’ọnọdụ a, ihe sochiri ya—ịbipụ ntị—na-egosi na ọ bụ iji mma agha tie ya. Nkebiokwu a bụ Igbo nkịtị ma na-egosi ihe ike ahụ mere nke ọma.
- source_word: εἷς τις ἐξ αὐτῶν
  choice: Otu onye n’ime ha
  rationale: Nke a na-edobe onye ahụ n’amaghị aha ma na-asụgharị okwu Grik ahụ n’ụzọ Igbo doro anya.
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: ohu onyeisi nchụàjà ahụ
  rationale: Ohu na-egosi ọnọdụ δοῦλος dị ka onye nọ n’okpuru onye ọzọ, kama ime ka ọ bụrụ naanị onye ọrụ. A na-edebe ‘onye na-ejere ... ozi’ dịka ntụgharị ọzọ n’okpuru peeji.
- source_word: ἀφεῖλεν
  choice: bipụ
  rationale: N’ihe gbasara mmerụ ntị a, ‘bipụ’ na-egosi n’ụzọ eke na ihe ahụ kewapụrụ n’ahụ.
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: ya ntị aka nri
  rationale: Nke a na-edobe nkọwa akụkụ ahụ na akụkụ aka nri dị n’akwụkwọ Grik, n’usoro okwu Igbo a na-aghọta ngwa ngwa.
theological_decisions:
- issue: Nsụgharị δοῦλος
  choice: ohu
  alternative: onye na-ejere onyeisi nchụàjà ahụ ozi
  rationale: N’amaokwu a, δοῦλος bụ aha ọnọdụ mmadụ n’obodo, ọ bụghị ihe atụ ime mmụọ. ‘Ohu’ na-edobe ịdị n’okpuru onye nwe ya nke okwu ahụ nwere ike ịpụta, ebe ntụgharị ọzọ na-egosi na a pụkwara ilekwasị anya n’ozi ọ na-eje.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E jiri ‘onyeisi nchụàjà’ maka ἀρχιερεύς, ‘ohu’ maka δοῦλος, ma tinye ntụgharị ọzọ n’okpuru peeji iji chekwaa obosara ihe okwu Grik ahụ pụrụ ịpụta.
