id: LUK.22.67
reference: Luke 22:67
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: ig
  text: na-asị, “Ọ bụrụ na ị bụ Mesaịa ahụ[a], gwa anyị.” Ma ọ sịrị ha, “Ọ bụrụ na m agwa unu, unu agaghị ekwere ma ọlị;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst ahụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ bụ participle dị ugbu a nke jikọtara okwu ndị kansụl ahụ na akụkọ bu ya ụzọ; ‘na-asị’ na-edobe njikọ ahụ n’ụzọ dị nkenke ma bụrụ Igbo nkịtị.
- source_word: Εἰ σὺ εἶ
  choice: Ọ bụrụ na ị bụ
  rationale: Nke a na-edobe ụdị ọnọdụ doro anya dị na Grik kama ịgbanwe ya ka ọ bụrụ ajụjụ nkịtị.
- source_word: ὁ χριστός
  choice: Mesaịa ahụ
  rationale: Χριστός bụ aha ọkwá ebe a, nke metụtara olileanya ndị Juu banyere Onye E Tere Mmanụ; ‘Mesaịa’ na-eme ka ihe ahụ pụta ìhè, ebe ‘ahụ’ na-egosipụta article ὁ n’ụzọ dabara adaba n’Igbo.
- source_word: εἰπὸν ἡμῖν
  choice: gwa anyị
  rationale: Nke a bụ ụzọ Igbo si ekwu iwu a nke ọma, ma na-edobe ike nke ‘tell us.’
- source_word: εἶπεν δὲ αὐτοῖς
  choice: Ma ọ sịrị ha
  rationale: ‘Ma’ na-egosipụta obere ntụgharị ma ọ bụ ọdịiche nke δέ mgbe Jizọs na-aza ihe ha chọrọ.
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: Ọ bụrụ na m agwa unu
  rationale: Nke a na-edobe ọnọdụ nke ahịrịokwu Grik ma na-ada nke ọma n’Igbo ugbu a.
- source_word: οὐ μὴ πιστεύσητε
  choice: unu agaghị ekwere ma ọlị
  rationale: ‘Ma ọlị’ na-ebupụta nkwughachi siri ike nke οὐ μή, na-enweghị iji okwu ochie ma ọ bụ nke na-adịghị eke.
theological_decisions:
- issue: Ntughari Χριστός dịka aha ọkwá
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ọnọdụ ajụjụ a, okwu ahụ bụ aha ọkwá metụtara olileanya Mesaịa nke ndị Juu. A tụgharịrị ya ‘Mesaịa’ iji chekwaa echiche ahụ, ebe e nyere ‘Kraịst’ n’ala peeji dịka ụzọ ọzọ a maara nke ọma.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ụdị ọnọdụ nke ajụjụ ahụ, njikọ participle na ihe bu ya ụzọ, yana nkwughachi siri ike dị na οὐ μή.
