  source_fidelity: Igbo text accurately preserves the Greek participial continuation (λέγοντες), the conditional challenge, the titular and definite sense of ὁ χριστός, the imperative addressed to the group, and the emphatic οὐ μή negation. “Unu agaghị ekwere ma ọlị” clearly conveys the strong denial without adding meaning.
