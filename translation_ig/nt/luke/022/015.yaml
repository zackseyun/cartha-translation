revisions:
- from: O wee sị ha, “Ọ gụsiri m agụụ ike iso unu rie Ememme Ngabiga a tupu m ata ahụhụ.”
  to: Ọ sịrị ha, “Ejiwo m oke ọchịchọ chọọ iri Ememme Ngabiga a iso unu tupu m ata ahụhụ.”
  rationale: The revision replaces an expression for hunger with one for strong desire, preserving the Greek emphatic construction and avoiding an unwarranted narrowing of meaning. It retains “Ememme Ngabiga” rather than adding “nri” to the main text, while documenting the contextual meal sense in a footnote. The sentence order is adjusted for smooth Standard Igbo.
  reviewer_model: gpt-5.6-terra
