review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the speech, the Passover reference, eating with the disciples, and the temporal clause “before I suffer.” However, “Ọ gụsiri m agụụ ike” primarily means that Jesus was very hungry. The Greek Ἐπιθυμίᾳ ἐπεθύμησα expresses intense desire or longing, not physical hunger; the distinction should be retained.
  naturalness: “O wee sị ha” is understandable, but “Ọ sịrị ha” is a more natural, uncluttered Standard Igbo narrative introduction here. “Ejiwo m oke ọchịchọ chọọ iri …” is idiomatic enough in a solemn modern register and conveys strong desire without implying hunger.
  terminology: “Ememme Ngabiga” is an established and intelligible rendering of πάσχα. Although the immediate context concerns eating the Passover meal, the main text should not add “nri,” since πάσχα can refer to the festival or its meal. “Ata ahụhụ” appropriately renders πάσχω in this context.
  issues:
  - severity: high
    issue: “Ọ gụsiri m agụụ ike” renders physical hunger rather than earnest desire.
    rationale: Ἐπιθυμίᾳ ἐπεθύμησα is an emphatic cognate expression denoting intense longing. Physical hunger narrows and changes the stated motivation.
  - severity: low
    issue: The connective “wee” is not required in the Igbo main text.
    rationale: Greek καί is a routine narrative connective. Omitting it produces natural Igbo and does not lose a material element of meaning.
  revised_text: Ọ sịrị ha, “Ejiwo m oke ọchịchọ chọọ iri Ememme Ngabiga a iso unu tupu m ata ahụhụ.”
  revised_footnotes:
