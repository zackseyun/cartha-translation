  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: ig
  text: Ọ sịrị ha, “Ejiwo m oke ọchịchọ chọọ iri Ememme Ngabiga a iso unu tupu m ata ahụhụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν πρὸς αὐτούς
  choice: O wee sị ha
  rationale: Nke a bụ ụzọ nkịtị na nke doro anya e si kọwaa okwu onye kwuru n’akụkọ Igbo.
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Ọ gụsiri m agụụ ike
  rationale: Nkwughachi aha na ngwaa sitere n’otu mgbọrọgwụ na Grik na-emesi ọchịchọ ahụ ike. Akpaokwu Igbo a na-egosipụta oke agụụ ahụ n'ụzọ dị ndụ ma bụrụkwa nke ndị mmadụ na-aghọta ngwa ngwa.
- source_word: τοῦτο τὸ πάσχα
  choice: Ememme Ngabiga a
  rationale: “Ngabiga” na-anọchi πάσχα, ebe “Ememme” na-eme ka okwu ahụ bụrụ nke doro anya n’Igbo. N’agbanyeghị na ọnọdụ a metụtara nri ememme ahụ, isi ederede anaghị agbakwụnye “nri” ka ọ ghara imechi obosara okwu Grik ahụ.
- source_word: φαγεῖν
  choice: rie
  rationale: Nke a bụ ntụgharị kpọmkwem na nke eke nke ngwaa pụtara iri nri.
- source_word: μεθ’ ὑμῶν
  choice: iso unu
  rationale: N’akpaokwu “iso unu rie,” nke a na-egosipụta ime ihe ọnụ n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: πρὸ τοῦ με παθεῖν
  choice: tupu m ata ahụhụ
  rationale: Akpaokwu a na-egosipụta oge bu ụzọ, ebe “ịta ahụhụ” bụ ụzọ Igbo doro anya si kwuo πάσχω n’ebe a n’etinyeghị nkọwa ndị ọzọ banyere ụdị ahụhụ ahụ.
theological_decisions:
- issue: Ihe πάσχα pụtara n’ọnọdụ a
  choice: E ji “Ememme Ngabiga a” mee ihe n’isi ederede, n’etinyeghị “nri.”
  alternative: nri Ememme Ngabiga a
  rationale: Ọnọdụ ahụ na-egosi na nri Ngabiga ka a ga-eri, ma okwu Grik ahụ n’onwe ya nwere ike ịpụta ememme ahụ ma ọ bụ nri ya. Nhọrọ a na-ahapụ ọnọdụ ka ọ kọwaa ihe a na-ekwu n’etinyeghị nkọwa karịrị isi mmalite.
- issue: Ike dị n’okwu Ἐπιθυμίᾳ ἐπεθύμησα
  choice: Ọ gụsiri m agụụ ike
  alternative: Ejiri m oke ọchịchọ chọọ
  rationale: Nhọrọ ahụ na-echekwa oke agụụ Jizọs gosipụtara tupu ahụhụ ya, ma ọ naghị etinye nkọwa nkà mmụta okpukpe ọzọ n’ime okwu ahụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugwu ma dị ugbu a, nke ndị nkịtị ga-aghọta. E ji “unu” chekwaa ụdị onye nke abụọ ọtụtụ, e jiri “Ememme Ngabiga” zere okwu mgbazinye na-enweghị nkọwa, ma debe usoro okwu ahụ ka ọ daa nke ọma n’Igbo.
