  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: ig
  text: Ma site ugbu a gaa n’ihu, Nwa nke Mmadụ ga-anọ ọdụ n’aka nri nke ike Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: site ugbu a gaa n’ihu
  rationale: Ọ bụ akpaalaokwu oge nke na-egosi na ihe a kwuru ga-amalite ịdị ire ugbu a wee gaa n’ihu; nsụgharị a bụ Igbo nkịtị ma na-edobe echiche nke ọdịnihu.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a, δέ na-egosi ntụgharị nwere ọdịiche n’azịza Jizọs; “Ma” na-egosipụta nke a nke ọma.
- source_word: ἔσται
  choice: ga-anọ
  rationale: Ọdịnihu nke εἰμί na-egosi ọnọdụ ahụ nke ga-adị; “ga-anọ” jikọtara nke ọma na “ọdụ” n’Igbo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: E debere aha Jizọs ji akọwa onwe ya n’ụzọ nkịtị, ka njikọ ya na ihe odide Daniel na nghọta ya sara mbara ghara ịla n’iyi.
- source_word: καθήμενος
  choice: ọdụ
  rationale: Ọ na-egosi ịnọ n’oche n’ọnọdụ nsọpụrụ na ọchịchị; “ga-anọ ọdụ” bụ okwu Igbo doro anya nke na-edobe onyinyo ahụ.
- source_word: ἐκ δεξιῶν
  choice: n’aka nri
  rationale: E debere akpaalaokwu Akwụkwọ Nsọ nke na-egosi ebe nsọpụrụ na ikike kachasị elu.
- source_word: τῆς δυνάμεως
  choice: nke ike
  rationale: δύναμις pụtara “ike”; nsụgharị nkịtị a na-edobe nhazi okwu Grik ma ghara ime ya aha Chineke n’onwe ya n’ahịrị bụ isi.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: Ọ na-akọwa onye nwe ike ahụ; ịkpọ Chineke aha n’ụzọ doro anya na-agbaso okwu Grik.
theological_decisions:
- issue: Otú e si sụgharị okwu banyere ibuli Nwa nke Mmadụ elu na ikike Chineke
  choice: Nwa nke Mmadụ ga-anọ ọdụ n’aka nri nke ike Chineke
  alternative: Nwa nke Mmadụ ga-anọ ọdụ n’aka nri nke Onye Dị Ike
  rationale: Nhọrọ a na-edobe nkwupụta siri ike banyere ibuli ya elu na inye ya ikike, tinyere njikọ ya na Abụ Ọma 110 na Daniel 7, n’enweghị nkọwa agbakwunyere. Ihe ọzọ nwere ike ịbụ akpaalaokwu nkwanye ùgwù e ji zere ịkpọ Chineke aha ka e debere n’ala ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere “Nwa nke Mmadụ” dịka aha nwere ụda Akwụkwọ Nsọ, ma e zere ịgbakwunye nkọwa nke otu ụka ma ọ bụ nke onye nkọwa ọ bụla.
