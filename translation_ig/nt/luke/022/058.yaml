  text: καὶ μετὰ βραχὺ ἕτερος ἰδὼν αὐτὸν ἔφη· Καὶ σὺ ἐξ αὐτῶν εἶ· ὁ δὲ Πέτρος ⸀ἔφη· Ἄνθρωπε, οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: ig
  text: Mgbe obere oge gasịrị, nwoke ọzọ hụrụ ya wee sị, “Gị kwa bụ otu n’ime ha.” Ma Pita sịrị, “Nwoke, abụghị m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ikwu ya n'ụzọ doro anya karị, “Abụghị m otu n’ime ha.” N’asụsụ Grik, ọ bụ naanị “Abụghị m” ka e kwuru; a hapụrụ ihe ọ na-agọnahụ ka a ghọta ya site n’ebubo e kwuru tupu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: Mgbe obere oge gasịrị
  rationale: Nke a na-egosi na obere oge gafere tupu ihe ọzọ emee, ma ọ bụkwa okwu Igbo dị mfe ma bụrụ nke e ji akọ akụkọ n'ụzọ ebumpụta ụwa.
- source_word: ἕτερος
  choice: nwoke ọzọ
  rationale: Okwu Grik a bụ aha nnọchi n'ụdị nwoke nke pụtara onye ọzọ; “nwoke ọzọ” na-eme ka onye na-ekwu okwu doo anya n'Igbo.
- source_word: ἰδὼν αὐτὸν
  choice: hụrụ ya
  rationale: Aorist participle a na-enye ihe mere n'akụkụ omume isi; ijikọ ya na “wee sị” na-enye usoro omume ahụ n'Igbo n'ụzọ dị mma.
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: Gị onwe gị bụkwa otu n’ime ha
  rationale: “Otu n’ime ha” na-egosi isonyere ìgwè ahụ, ebe “gị onwe gị” na-eburu ike dị na Καὶ σὺ, ya bụ, “gị kwa.”
- source_word: Ἄνθρωπε
  choice: Nwoke
  rationale: A hapụrụ ya dịka okwu a kpọrọ nwoke ahụ ihu na ihu, iji chekwaa ụda okwu Pita nke dị mkpirikpi ma sie ike.
- source_word: οὐκ εἰμί
  choice: abụghị m
  rationale: Nke a na-echekwa mkpụmkpụ na enweghị ihe e kwuru kpọmkwem n'okwu Grik; ihe Pita na-agọnahụ ka a na-aghọta site n'ebubo e kwuru tupu ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, sụgharịa amaokwu ahụ. Usoro “hụrụ ya wee sị” na-eme ka participle Grik bụrụ okwu Igbo ebumpụta ụwa, ebe a hapụrụ nzaghachi Pita n'ụdị mkpirikpi iji chekwaa ike na mgbagwoju anya dị n'isi mmalite.
