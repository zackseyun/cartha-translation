source:
  edition: SBLGNT
  text: ⸀περιαψάντων δὲ πῦρ ἐν μέσῳ τῆς αὐλῆς καὶ ⸀συγκαθισάντων ἐκάθητο ὁ Πέτρος ⸀μέσος αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: ig
  text: Mgbe ha mụnyere ọkụ n’etiti ogige ahụ ma nọdụkọọ ala, Pita nọ ọdụ n’etiti ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Pita nọdụrụ n’etiti ha.” Okwu Grik ahụ nwere ike ịpụta nanị “nọdụrụ,” ma “nọ ọdụ” na-egosipụta nke ọma na ọnọdụ ahụ nọ na-aga n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: Mgbe ha mụnyere
  rationale: Aorist participle a na-egosi omume mere tupu ma ọ bụ dịka ọnọdụ nke isi omume ahụ; “mụnyere ọkụ” bụ okwu Igbo doro anya maka ịgbanye ọkụ.
- source_word: πῦρ
  choice: ọkụ
  rationale: N'Igbo, “ọkụ” anaghị achọ mkpụrụokwu na-anọchi indefinite article nke Bekee; ọnọdụ ahụ na-eme ka o doo anya na ọ bụ ọkụ ha mụnyere.
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: n’etiti ogige ahụ
  rationale: Nke a na-echekwa nghọta ebe dị kpọmkwem. “Ogige ahụ” na-ezo aka n'ogige ụlọ ahụ, n'enweghị ịgbakwụnye nkọwa na ọ bụ ogige obí.
- source_word: συγκαθισάντων
  choice: nọdụkọọ ala
  rationale: “Nọdụkọọ” na-echekwa σύν, ya bụ, na ha nọdụrụ ọnụ; “ala” na-eme ka okwu ahụ bụrụ nke e ji eme ihe n'Igbo ugbu a.
- source_word: ἐκάθητο
  choice: nọkwa ọdụ
  rationale: Nkebiokwu a na-egosi ọnọdụ na-aga n'ihu n'oge gara aga, kwekọrọ na imperfect Grik; “-kwa” jikọtara ọnọdụ Pita na nke ndị ọzọ n'ụzọ nkịtị.
- source_word: μέσος αὐτῶν
  choice: n’etiti ha
  rationale: Nke a na-echekwa ọnọdụ Pita n'ime ìgwè ahụ, ma dịkwa mfe nghọta n'Igbo.
- source_word: δὲ
  choice: Mgbe
  rationale: Ọ bụ ezie na δέ bụ njikọ akụkọ dị nro, usoro Igbo ji “Mgbe...” mee ka njikọ na usoro ihe omume pụta ìhè n'ụzọ eke, n'enweghị mkpa ịmalite na “Ma.”
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “ogige” kọwaa αὐλή n'ọnọdụ ụlọ onyeisi nchụàjà, a hapụkwara nkọwa ndị isi mmalite na-enyeghị.
