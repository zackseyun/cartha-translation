revisions:
- from: O wee were achịcha, nye ekele, nyawaa ya, nye ha ya, sị, “Nke a bụ ahụ m[c], nke a na-enye maka unu[b]. Na-emerenụ nke a iji na-echeta m.”[a]
  to: O wee were achịcha; mgbe o nyesịrị ekele, ọ nyawara ya ma nye ha ya, sị, “Nke a bụ ahụ m[c], nke a na-enye maka unu[b]. Nọgidenụ na-eme nke a iji na-echeta m.”[a]
  rationale: The revision improves Standard Igbo grammar and narrative flow while retaining every component of the supplied SBLGNT text. It expresses the antecedent thanksgiving, preserves the direct “is” statement, retains “for you” without doctrinal expansion, and renders the present imperative as an ongoing plural command. The textual-variant and interpretive notes remain correctly anchored and retain the ambiguity of the source tradition.
