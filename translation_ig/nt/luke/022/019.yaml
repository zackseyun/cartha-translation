  edition: SBLGNT
  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: ig
  text: O wee were achịcha; mgbe o nyesịrị ekele, ọ nyawara ya ma nye ha ya, sị, “Nke a bụ ahụ m[c], nke a na-enye maka unu[b]. Nọgidenụ na-eme nke a iji na-echeta m.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ aka ochie enweghị okwu ndị a: “nke a na-enye maka unu. Nọgidenụ na-eme nke a iji na-echeta m.”'
    reason: textual_variant
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “nke a na-enye ugbu a maka unu.”'
    reason: lexical_alternative
  - marker: c
    text: A sụgharịrị “Nke a bụ ahụ m” dịka e si dee ya. Ụfọdụ na-akọwa ya dịka “Nke a na-anọchi anya ahụ m,” ma Grik n’onwe ya ji okwu pụtara “bụ.”
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: O wee were achịcha
  rationale: Usoro ngwaa Igbo a na-egosi na o bu ụzọ were achịcha, ma na-eme ka akụkọ ahụ na-aga were were n’enweghị asụsụ siri ike.
- source_word: εὐχαριστήσας
  choice: nye ekele
  rationale: Nke a na-egosi inye ekele tupu inyawa achịcha, n’enweghị itinye onye a kelere aha mgbe Grik ekwughị ya kpọmkwem.
- source_word: ἔκλασεν
  choice: nyawaa ya
  rationale: ‘Nyawaa’ bụ okwu Igbo doro anya maka ikewa achịcha site n’ịnyawa ya; ‘ya’ na-egosi achịcha ahụ.
- source_word: ἔδωκεν αὐτοῖς
  choice: nye ha ya
  rationale: Usoro a bụ Igbo nkịtị nke na-egosi ma ndị natara ya (‘ha’) ma ihe e nyere (‘ya’).
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: Nke a bụ ahụ m
  rationale: A hapụrụ ngwaa njikọ ἐστιν dịka ‘bụ’ ka a ghara ịkọwa okwu ahụ dịka naanị ihe nnọchianya ma ọ bụ kpebie esemokwu gbasara Nri Anyasị Onyenwe anyị.
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: nke a na-enye maka unu
  rationale: Nkebiokwu njikọ a na-anọchi participle Grik nke ọma. ‘Maka unu’ na-egosi uru ma ọ bụ ime ihe n’ihi ha, ma ọ naghị eme ka otu nkọwa nkà mmụta okpukpe bụrụ naanị nke kwe omume.
- source_word: τοῦτο ποιεῖτε
  choice: Na-emerenụ nke a
  rationale: Ngwaa iwu dị n’oge ugbu a na ọnọdụ a na-akwado omume a na-eme ugboro ugboro. ‘Na-emerenụ’ na-eme ka ịdịgide n’omume ahụ pụta ìhè ma na-edokwa iwu ahụ n’ụdị ọtụtụ mmadụ.
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: iji na-echeta m
  rationale: Nke a bụ Igbo dị ndụ nke na-egosi omume ncheta na-aga n’ihu, ọ bụghị naanị echiche nke onwe otu mgbe.
theological_decisions:
- issue: Ihe okwu ‘Nke a bụ ahụ m’ pụtara n’ihe gbasara Nri Anyasị Onyenwe anyị
  choice: E debere okwu ahụ dịka ‘Nke a bụ ahụ m.’
  alternative: ‘Nke a na-anọchi anya ahụ m’ ma ọ bụ ‘Nke a pụtara ahụ m.’
  rationale: Grik ji ngwaa ‘bụ’ kwuo ya. Nsụgharị ekwesịghị idozi esemokwu ụka site n’ịgbakwunye ‘na-anọchi anya’ ma ọ bụ ‘pụtara.’
- issue: Ọnọdụ nkebiokwu ogologo dị na Luk 22:19 n’ihe gbasara ọdịiche akwụkwọ aka ochie
  choice: E tinyere ‘nke a na-enye maka unu. Na-emerenụ nke a iji na-echeta m’ n’isiokwu.
  alternative: Ederede dị mkpirikpi nke kwụsịrị n’‘Nke a bụ ahụ m.’
  rationale: SBLGNT nyere nkebiokwu ogologo ahụ dịka ederede ọrụ ma jiri akara gosi na e nwere ajụjụ gbasara ya. Ihe odide dị mkpirikpi ka e gosiri n’okpuru peeji ka ndị na-agụ ya mara ọdịiche ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Usoro ngwaa ‘were… nye… nyawaa… nye’ dabara n’akụkọ Igbo ma na-edobe usoro omume Grik. E zere okwu pụrụ iche nke otu ụka, ma e debere nghọtahie ziri ezi dị n’okwu banyere ahụ Kraịst na ọdịiche akwụkwọ aka ochie.
