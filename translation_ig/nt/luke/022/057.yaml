  source_fidelity: The rendering accurately reflects ἠρνήσατο λέγων and preserves the Greek's unstated object of denial while supplying a natural Igbo object, “okwu ahụ.” “Amaghị m ya” correctly renders Οὐκ οἶδα αὐτόν, and “nwanyị” retains the direct vocative γύναι without importing an honorific not present in the source.
  naturalness: The sentence is clear, idiomatic Standard Igbo, and the direct address at the end is understandable and suitably terse for the dialogue. “Ọ gọnahụrụ okwu ahụ” is a natural way to express denial of the preceding assertion/charge.
  terminology: “Gọnahụrụ” appropriately conveys denial in this context; “okwu ahụ” is a restrained, contextually recoverable supply rather than an assertion that Peter explicitly denied Jesus himself. The direct-address term “nwanyị” is source-close and does not impose a softened interpretation.
