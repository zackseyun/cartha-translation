id: LUK.22.57
reference: Luke 22:57
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: ig
  text: Ma ọ gọnahụrụ okwu ahụ[a], sị, “Amaghị m ya, nwanyị[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ na-agbasochi Grik anya karị: “Ma ọ gọnahụrụ, sị …” Grik ekwughị kpọmkwem ihe ọ gọnahụrụ; e tinyere “okwu ahụ” ka ọ bụrụ Igbo a na-asụkarị.'
    reason: lexical_alternative
  - marker: b
    text: “Nwanyị” bụ nsụgharị okwu Grik γύναι, nke e ji akpọ nwanyị ahụ okwu kpọmkwem. Okwu nkwanye ùgwù ndị ọzọ ga-eme ka okwu ahụ dị nro karịa ka ederede Grik si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: gọnahụrụ okwu ahụ
  rationale: Ngwaa “gọnahụrụ” na-egosi ịjụ ma ọ bụ ịsị na ihe e kwuru abụghị eziokwu. E tinyere “okwu ahụ” ka ahịrịokwu ahụ bụrụ nke Igbo na-asụkarị, ma ọ na-ezo aka n’ihe nwanyị ahụ kwuru, ọ bụghị n’ịgbakwunye na Pita gọnahụrụ Jizọs kpọmkwem.
- source_word: λέγων
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji ewebata okwu onye kwuru, ma na-echekwa njikọ dị n’etiti ịgọnahụ ahụ na okwu so ya.
- source_word: Οὐκ οἶδα
  choice: Amaghị m
  rationale: Nke a bụ nsụgharị Igbo doro anya ma bụrụ nke a na-asụkarị maka ngwaa ịma ihe e tinyere n’ụdị njụ.
- source_word: αὐτόν
  choice: ya
  rationale: “Ya” na-anọchi anya Jizọs n’enweghị ịgbasa ya ka ọ bụrụ “nwoke a,” nke ederede Grik na-ekwughị.
- source_word: γύναι
  choice: nwanyị
  rationale: “Nwanyị” na-asụgharị kpọmkwem okwu a kpọrọ nwanyị ahụ. A họrọghị okwu nkwanye ùgwù ga-eme ka okwu Pita dị nro karịa ka Grik si dị.
theological_decisions:
- issue: Ma a ga-etinye ihe Pita gọnahụrụ n’ahịrịokwu ahụ
  choice: E tinyere “okwu ahụ” dị ka ihe a na-aghọta na ọ gọnahụrụ.
  alternative: “Ma ọ gọnahụrụ, sị …” ma ọ bụ “Ma ọ gọnahụrụ ya, sị …”
  rationale: Grik ekwughị ihe ngwaa ἠρνήσατο metụtara kpọmkwem. “Okwu ahụ” na-eme ka Igbo bụrụ nke e ji ọnụ ekwu nke ọma ma na-ezo aka n’ebubo a ka kwuru. “Ya” nwere ike ime ka onye na-agụ ya chee ozugbo na ihe ọ gọnahụrụ bụ Jizọs n’onwe ya, ebe “ọ gọnahụrụ” naanị ya ga-ada ka ahịrịokwu na-ezughị ezu n’Igbo.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke doro anya ma nwee ugwu. Usoro okwu “Amaghị m ya, nwanyị” na-echekwa ọnọdụ okwu ịkpọ nwanyị ahụ dị ná ngwụcha dịka ọ dị na Grik, n’agbanyeghị na “Nwanyị, amaghị m ya” ga-abụkwa usoro Igbo a na-asụkarị.
