  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: ig
  text: Unu ga-asị onye nwe ụlọ ahụ, ‘Onye Ozizi na-asị gị, “Olee ebe ọnụ ụlọ ndị ọbịa ahụ dị, ka mụ na ndị na-eso ụzọ m rie nri Ngabiga?”’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: onye nwe ụlọ ahụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ nke a na-aghọta nke ọma isi kọwaa onye na-achị ma ọ bụ onye na-ahụ maka ụlọ ahụ, n’agbanyeghị na okwu Grik ahụ apụtaghị nanị ikike iwu nke onye nwe ihe.
- source_word: ὁ διδάσκαλος
  choice: Onye Ozizi
  rationale: A tụgharịrị aha ọrụ a kpọmkwem, ma jiri mkpụrụedemede ukwu gosi na ọ bụ aha e ji mara Jizọs n’okwu a.
- source_word: κατάλυμα
  choice: ọnụ ụlọ ndị ọbịa
  rationale: N’ọnọdụ ụlọ obibi a, okwu ahụ na-ezo aka n’ọnụ ụlọ e nyere ndị ọbịa, ọ bụghị kpọmkwem ụlọ ndị njem ma ọ bụ ọnụ ụlọ elu.
- source_word: τὸ πάσχα
  choice: nri Ngabiga
  rationale: Ebe ngwaa bụ ‘iri,’ ihe a na-elekwasị anya bụ nri Ngabiga; ntụgharị a na-eme ka ahịrịokwu ahụ bụrụ Igbo nkịtị ma na-edebe aha ememme ndị Juu ahụ.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: m ga-eso ndị na-eso ụzọ m
  rationale: ‘Ndị na-eso ụzọ’ na-egosipụta mmekọrịta μαθητής nke ndị na-amụta ihe site n’ịgbaso onye nkuzi, ọ bụghị nanị ụmụ akwụkwọ nọ na klaasị.
- source_word: φάγω
  choice: m ... rie
  rationale: Ụdị a na-edebe echiche nke ihe Jizọs chọrọ ma ọ bụ zubere ime n’ebe ahụ, na-enweghị ime ka ọ bụrụ nkwupụta ọdịnihu siri ike.
- source_word: ἐρεῖτε
  choice: Unu ga-asịkwa
  rationale: E ji ọdịnihu Igbo sụgharịa future indicative ahụ, nke na-arụkwa ọrụ dịka ntụziaka n’ọnọdụ a.
theological_decisions:
- issue: Aha Jizọs ji kpọọ onwe ya site n’okwu διδάσκαλος
  choice: Onye Ozizi
  alternative: Nna Ukwu; onye ozizi
  rationale: ‘Onye Ozizi’ na-ebuga ihe okwu Grik ahụ pụtara n’enweghị itinye aha ụka ma ọ bụ nkọwa ozizi ọzọ; mkpụrụedemede ukwu na-egosi ojiji ya dịka aha e ji mara Jizọs.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị ahụ. E debere usoro okwu kpọmkwem n’ime okwu a kọrọ, ma zere okwu ochie ma ọ bụ okwu pụrụ iche nke otu ụka.
