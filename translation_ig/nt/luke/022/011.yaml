review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the householder, the titular ‘Teacher,’ the guest room, the Passover meal, and the disciples. However, the enclitic -kwa in “ga-asịkwa” adds ‘also,’ which is not present in καὶ ἐρεῖτε; καί here simply continues the instruction. The revised wording removes that addition and makes the relation ‘with my disciples’ more direct.
  naturalness: “Unu ga-asị onye nwe ụlọ ahụ” and “Onye Ozizi na-asị gị” are natural Standard Igbo. Recasting the final clause as “ka mụ na ndị na-eso ụzọ m rie...” is smoother and unambiguously expresses that Jesus and his disciples eat together.
  terminology: “Onye Ozizi” appropriately renders ὁ διδάσκαλος as a title. “Onye nwe ụlọ ahụ” is an acceptable idiomatic rendering of the householder/master of the house. “Ọnụ ụlọ ndị ọbịa” fits κατάλυμα in this domestic context, while “nri Ngabiga” is justified by the explicit act of eating.
  issues:
  - severity: low
    issue: The word “ga-asịkwa” contains the additive particle -kwa (‘also’).
    rationale: The Greek καὶ is connective in this instruction and does not require an additive sense. “Ga-asị” is more exact.
  - severity: low
    issue: The final clause can state the shared meal more directly.
    rationale: “M ga-eso ndị na-eso ụzọ m rie” is understandable, but “ka mụ na ndị na-eso ụzọ m rie” more naturally represents μετὰ τῶν μαθητῶν μου without suggesting merely accompanying them.
  revised_text: Unu ga-asị onye nwe ụlọ ahụ, ‘Onye Ozizi na-asị gị, “Olee ebe ọnụ ụlọ ndị ọbịa ahụ dị, ka mụ na ndị na-eso ụzọ m rie nri Ngabiga?”’
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe a na-anọ ọbịa.” Okwu Grik κατάλυμα nwere ike ịpụta ebe mmadụ na-anọ ma ọ bụ ọnụ ụlọ ndị ọbịa. N’ebe a, ọ dịghị mkpa ka ọ pụta “ụlọ ndị njem,” a kpọghịkwa ya “ọnụ ụlọ elu” ruo n’amaokwu na-esonụ.
    reason: lexical_alternative
  revision_rationale: A safe, limited revision removes an unsupported additive nuance and improves the natural expression of eating the Passover together. The footnote is adjusted for idiomatic Igbo and to avoid implying that κατάλυμα cannot ever denote lodging; rather, ‘inn’ is not required in this context.
