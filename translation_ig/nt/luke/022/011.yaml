revisions:
- from: Unu ga-asịkwa onye nwe ụlọ ahụ, ‘Onye Ozizi na-asị gị, “Olee ebe ọnụ ụlọ ndị ọbịa[a] ahụ dị, ebe m ga-eso ndị na-eso ụzọ m rie nri Ngabiga?”’
  to: Unu ga-asị onye nwe ụlọ ahụ, ‘Onye Ozizi na-asị gị, “Olee ebe ọnụ ụlọ ndị ọbịa ahụ dị, ka mụ na ndị na-eso ụzọ m rie nri Ngabiga?”’
  rationale: A safe, limited revision removes an unsupported additive nuance and improves the natural expression of eating the Passover together. The footnote is adjusted for idiomatic Igbo and to avoid implying that κατάλυμα cannot ever denote lodging; rather, ‘inn’ is not required in this context.
