source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: ig
  text: Mgbe ọ natara otu iko, o nyesịrị ekele, wee sị, “Werenụ nke a, kesaakwa ya n’etiti onwe unu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεξάμενος
  choice: Mgbe ọ natara
  rationale: Nkebi ngwaa a na-egosi ihe mere tupu ngwaa bụ isi; ‘Mgbe ọ natara’ na-egosipụta usoro ahụ n’Igbo nkịtị ma dịkwa ugwu.
- source_word: ποτήριον
  choice: otu iko
  rationale: Aha Grik a enweghị mkpụrụokwu na-akọwapụta ya; ‘otu iko’ na-egosipụta na e kwuru banyere iko na nke mbụ, n’agbanyeghị na ọnọdụ nri ahụ nwere ike ime ka a ghọta ya dị ka iko pụrụ iche.
- source_word: εὐχαριστήσας
  choice: ma kelee Chineke
  rationale: N’Igbo, ‘kele Chineke’ bụ ụzọ doro anya e si ekwu na mmadụ kelere n’oge nri. ‘Chineke’ bụ ihe e mere ka o doo anya site n’ọnọdụ ahụ, ọ bụghị iji webata okwu emume Oriri Nsọ.
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Nke a na-asụgharị naanị ‘ọ kwuru’ n’etinyeghị ‘ha’ dị ka ndị ọ gwara, ebe Grik ekwughị ya kpọmkwem.
- source_word: Λάβετε
  choice: Werenụ
  rationale: Iwu a dabara n’omume mmadụ ịnara ihe e nyere ya n’oge nri.
- source_word: τοῦτο
  choice: nke a
  rationale: Ọ na-ezo aka n’iko ahụ a kpọtụrụ aha, ma anaghị emegharị aha ‘iko,’ dịka Grik si dị mkpụmkpụ.
- source_word: διαμερίσατε
  choice: kesaakwa ya
  rationale: ‘Kesaakwa’ na-egosipụta ikewa ma ọ bụ ikesa ihe ka ndị nọ n’otu ahụ nweta ya; ‘ya’ dị mkpa n’usoro Igbo iji mee ka ihe a na-ekesa doo anya.
- source_word: εἰς ἑαυτούς
  choice: n’etiti onwe unu
  rationale: Nke a na-egosipụta na ndị otu ahụ ga-ekekọrịta ya n’etiti ha, ọ bụghị na onye ọ bụla ga-edobere onwe ya ya.
theological_decisions:
- issue: Ma a ga-eji asụsụ emume Oriri Nsọ pụrụ iche kọwaa εὐχαριστήσας na ποτήριον
  choice: 'Iji asụsụ akụkọ nkịtị: ‘otu iko’ na ‘kele Chineke’'
  alternative: ‘iko ahụ’ ma ọ bụ okwu nwere ụda emume Oriri Nsọ siri ike
  rationale: Amaokwu ahụ na-akọ ihe Jizọs mere n’oge nri; ọ dịghị mkpa itinye n’asụsụ ntụgharị okwu ụka ma ọ bụ nkwenkwe e mesịrị nke Grik na-ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ugwu. E jiri ‘Werenụ’ na ‘onwe unu’ gosi na a na-agwa ọtụtụ mmadụ okwu. E tinyeghị nkọwa ụka pụrụ iche ma ọ bụ nkọwa nke ga-emechi ohere nghọta dị na Grik.
