revisions:
- from: Mgbe ọ natara otu iko ma kelee Chineke, ọ sịrị, “Werenụ nke a, kesaakwa ya n’etiti onwe unu.”
  to: Mgbe ọ natara otu iko, o nyesịrị ekele, wee sị, “Werenụ nke a, kesaakwa ya n’etiti onwe unu.”
  rationale: The revision removes the supplied object “Chineke” while retaining the ordinary, natural Igbo expression “nye ekele” for εὐχαριστήσας. It preserves the anarthrous “otu iko,” the plural imperative, and the reciprocal distribution sense of εἰς ἑαυτούς.
  reviewer_model: gpt-5.6-terra
