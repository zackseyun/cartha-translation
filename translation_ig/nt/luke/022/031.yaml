  rationale: E megharịrị naanị okwu abụọ iji mee ka ike arịrịọ Setan na ihe oyiyi ịfụcha ọka dị na Grik pụta nke ọma. E jigidere nnọchiaha ọtụtụ mmadụ, ahaghị onye Setan rịọrọ, ma e tinyebeghị echiche na e nyere ya ikike.
