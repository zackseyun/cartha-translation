  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: ig
  text: “Saịmọn, Saịmọn, lee! Setan arịọsiwo ike ka e nye ya unu niile, ka ọ fụchaa unu dị ka a na-afụcha ọka wit.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Unu” n’amaokwu a bụ ọtụtụ mmadụ; ya bụ, arịrịọ Setan metụtara Saịmọn na ndị ọzọ, ọ bụghị naanị Saịmọn.
    reason: Igbo nwere ọdịiche doro anya n’etiti nnọchiaha otu onye na ọtụtụ mmadụ; nkọwa a na-eme ka plural nke ὑμᾶς pụta ìhè.
lexical_decisions:
- source_word: ἰδού
  choice: lee!
  rationale: Okwu a na-adọrọ Saịmọn uche n’ihe dị mkpa Jizọs na-achọ ikwu; “lee” bụ okwu Igbo doro anya ma dịkwa nsọpụrụ.
- source_word: ἐξῃτήσατο
  choice: arịọwo ka e nye ya
  rationale: Ngwaa ahụ na-egosi ịrịọsi ike ka e nyefee mmadụ n’aka onye rịọrọ; nsụgharị a anaghị ekwu hoo haa onye a rịọrọ, ebe ederede Grik ekwughị ya.
- source_word: ὑμᾶς
  choice: unu niile
  rationale: Nnọchiaha Grik a bụ ọtụtụ mmadụ, ọ bụghị naanị Saịmọn; “niile” na-eme ka ọdịiche a pụta ìhè n’Igbo.
- source_word: σινιάσαι
  choice: yọchaa
  rationale: Ọ bụ omume iji nyọ sachapụ ma kewapụ ọka; “yọchaa” na-eburu ihe oyiyi ahụ n’ụzọ ndị na-agụ Igbo ga-aghọta.
- source_word: ὡς τὸν σῖτον
  choice: dị ka ọka wit
  rationale: A nọgidere n’ihe atụ nke wit kpọmkwem kama iji naanị okwu sara mbara bụ́ “ọka.”
theological_decisions:
- issue: Onye Setan rịọrọ na ikike e nyere ya
  choice: Ekwughị onye Setan rịọrọ ma ọ bụ ma e nyela ya ikike ahụ
  alternative: Ịgbakwunye “Chineke” ma ọ bụ ikwu na Chineke enyela Setan ikike
  rationale: Ederede Grik kwuru naanị na Setan rịọrọsiwo ike; ọ hapụrụ onye a rịọrọ na ihe si n’arịrịọ ahụ pụta n’emeghị ka o doo anya.
- issue: Ndị arịrịọ Setan metụtara
  choice: “unu niile” na-egosi na ὑμᾶς bụ ọtụtụ mmadụ
  alternative: “gị” nke ga-eme ka ọ metụta naanị Saịmọn
  rationale: Ọ bụ ezie na a kpọrọ Saịmọn aha, nnọchiaha ahụ bụ plural ma yikarịrị ka ọ na-ezo aka n’ebe ndị na-eso ụzọ nọ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu. A họọrọ “Saịmọn” maka aha Σίμων, “Setan” maka Σατανᾶς, ma jiri “ọka wit” chekwaa ụdị ọka e kwuru kpọmkwem.
