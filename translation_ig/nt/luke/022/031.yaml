review_pass:
  verdict: revise
  source_fidelity: The plural ὑμᾶς is correctly retained and the draft appropriately does not identify the person from whom Satan made the request. However, «arịọwo» alone softens ἐξῃτήσατο, which carries the force of an insistent request/demand, and «yọchaa» ordinarily suggests close examination rather than the grain-processing image of σινιάσαι.
  naturalness: The address and overall sentence are clear Standard Igbo. Recasting the final comparison as «dị ka a na-afụcha ọka wit» gives a more idiomatic and concrete agricultural expression for the intended image.
  terminology: «Saịmọn», «Setan», and «ọka wit» are appropriate. «arịọsiwo ike» better represents the emphatic Greek verb without specifying an unstated addressee; «afụchaa» preserves the sifting/winnowing image.
  issues:
  - severity: medium
    issue: The force of ἐξῃτήσατο is understated.
    rationale: The simple «arịọwo» means “has asked,” while the prefixed Greek verb conveys an urgent or insistent request. «Arịọsiwo ike» retains this force without turning the request into a statement that Satan was granted permission.
  - severity: medium
    issue: «Yọchaa» does not clearly convey sifting grain.
    rationale: In current Igbo it is more readily understood as examining or investigating thoroughly. The source invokes processing wheat; «afụchaa ... dịka a na-afụcha ọka wit» makes that image intelligible and natural.
  revised_text: “Saịmọn, Saịmọn, lee! Setan arịọsiwo ike ka e nye ya unu niile, ka ọ fụchaa unu dị ka a na-afụcha ọka wit.”[a]
  revised_footnotes:
  - marker: a
    text: “Unu” n’amaokwu a bụ ọtụtụ mmadụ; ya bụ, arịrịọ Setan metụtara Saịmọn na ndị ọzọ, ọ bụghị naanị Saịmọn.
    reason: Igbo nwere ọdịiche doro anya n’etiti nnọchiaha otu onye na ọtụtụ mmadụ; nkọwa a na-eme ka plural nke ὑμᾶς pụta ìhè.
  revision_rationale: E megharịrị naanị okwu abụọ iji mee ka ike arịrịọ Setan na ihe oyiyi ịfụcha ọka dị na Grik pụta nke ọma. E jigidere nnọchiaha ọtụtụ mmadụ, ahaghị onye Setan rịọrọ, ma e tinyebeghị echiche na e nyere ya ikike.
