revisions:
- from: Mgbe ọ nọ ná mwute dị ukwuu[a], ọ nọgidere na-ekpe ekpere nke ukwuu;[c] ọsụsọ ya wee dị ka nnukwu ntapụ ọbara[b] na-adakwasị n’ala.
  to: Mgbe ọ nọ n’oké nhụjuanya[a], ọ nọ na-ekpe ekpere n’ike karị;[c] ọsụsọ ya wee dị ka mkpụkọ ọbara[b] na-adakwasị n’ala.
  rationale: The revision restores the comparative force of ἐκτενέστερον, uses a broader and more accurate equivalent for ἀγωνία, and avoids adding a stronger continuative nuance than the imperfect necessarily bears. It retains the source’s explicit simile and its textual uncertainty. Footnote markers remain anchored in the text and all notes correspond to their stated purposes.
