  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: ig
  text: Mgbe ọ nọ n’oké nhụjuanya[a], ọ nọ na-ekpe ekpere n’ike karị;[c] ọsụsọ ya wee dị ka mkpụkọ ọbara[b] na-adakwasị n’ala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’oké mgba.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “dị ka mkpụkọ ma ọ bụ ntapụ ọbara.” Nke a bụ ntụnyere; ọ naghị ekwu hoo haa na ọsụsọ ahụ bụ ọbara n’ezie.
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ ihe odide ochie enweghị Luk 22:43–44; ndị ọzọ nwere ha. SBLGNT tinyere amaokwu ndị a n’ime akara mgbodo iji gosi na e nwere ejighị n’aka banyere ọdịnaya mbụ nke amaokwu ndị a.
    reason: textual_variant
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: Mgbe ọ nọ ná mwute dị ukwuu
  rationale: Nkebi a na-egosi ọnọdụ Jizọs nọ na ya, ya bụ ahụhụ na mgba dị ukwuu. Nsụgharị a bụ Igbo doro anya ma na-echekwa ịdị arọ nke ἀγωνία.
- source_word: ἐκτενέστερον
  choice: nke ukwuu
  rationale: Ọ bụ adverb ntụnyere nke na-egosi na ekpere ahụ gara n’ihu n’ike karị. N’usoro Igbo a, ‘nke ukwuu’ na-enye echiche nke mmụba ahụ n’enweghị itinye nkọwa okpukpe ọzọ.
- source_word: προσηύχετο
  choice: ọ nọgidere na-ekpe ekpere
  rationale: Imperfect na-egosi omume na-aga n’ihu; ‘ọ nọgidere na-ekpe ekpere’ na-eme ka nke a pụta ìhè n’Igbo.
- source_word: ἐγένετο
  choice: wee dị
  rationale: N’Igbo nkịtị, ‘wee dị’ na-egosi ọnọdụ ọsụsọ ahụ bịara nwee ma na-aga nke ọma na ntụnyere sochiri ya.
- source_word: ἱδρὼς
  choice: ọsụsọ
  rationale: Nke a bụ okwu Igbo kwụ ọtọ maka sweat.
- source_word: ὡσεὶ
  choice: dị ka
  rationale: ‘Dị ka’ na-echekwa ntụnyere doro anya, ọ naghị ekwu na ọsụsọ ahụ bụ ọbara n’onwe ya.
- source_word: θρόμβοι αἵματος
  choice: nnukwu ntapụ ọbara
  rationale: θρόμβοι nwere ike ịpụta ntapụ gbara ọkpụrụkpụ ma ọ bụ mkpụkọ. ‘Nnukwu ntapụ ọbara’ dabara n’onyonyo nke ihe na-adapụ, ebe e debere ụzọ ọzọ n’ala peeji.
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: na-adakwasị n’ala
  rationale: Nke a na-egosi mmegharị ala nke ntapụ ndị ahụ n’Igbo eke.
theological_decisions:
- issue: Ụdị ntụnyere dị n’okwu ‘dị ka nnukwu ntapụ ọbara’
  choice: 'E chekwara ya dịka ntụnyere: ọsụsọ ya dị ka nnukwu ntapụ ọbara.'
  alternative: Ikwu na ọsụsọ ya bụ ọbara n’ezie.
  rationale: ὡσεὶ na-egosi ntụnyere n'ụzọ doro anya. Ya mere, nsụgharị ahụ ekwesịghị ime ka ntụnyere ahụ ghọọ nkwupụta na ọsụsọ ahụ bụ ọbara n’ezie.
- issue: Ejighị n’aka banyere ịdị Luk 22:43–44 n’ihe odide mbụ
  choice: E tinyere amaokwu ahụ n’isiokwu ma tinye nkọwa [c] banyere ọdịiche ihe odide.
  alternative: Ịhapụ amaokwu ahụ kpamkpam ma ọ bụ igosi ya dịka ihe a na-ejighị n’aka n’enweghị nkọwa.
  rationale: SBLGNT bipụtara amaokwu ndị a n’ime akara na-egosi ejighị n’aka n’ihe odide. Isiokwu na ala peeji ọnụ na-echekwa ma ọdịnaya ahụ ma ihe akaebe dị iche iche.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọ nọgidere na-ekpe ekpere’ na-echekwa omume na-aga n’ihu; ‘dị ka’ na-echekwa ntụnyere nke Grik. Akara ala peeji niile [a], [b], na [c] pụtara n’isiokwu.
