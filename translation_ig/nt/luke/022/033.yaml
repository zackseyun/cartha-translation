  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: ig
  text: Ma ọ sịrị ya, “Onyenwe anyị, adị m njikere iso gị gaa ma n’ụlọ mkpọrọ ma ruo n’ọnwụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ma ọ
  rationale: Akụkụ okwu a na-arụ ọrụ dị ka nnọchiaha na-ezo aka na Pita, ebe δέ na-egosi ntakịrị ọdịiche n’ihe Jizọs kwuru tupu ya; “Ma ọ” na-egosipụta nke a n’Igbo nkịtị.
- source_word: εἶπεν αὐτῷ
  choice: sịrị ya
  rationale: Nke a na-edobe ngwaa ikwu na onye a gwara okwu n’enweghị ịkpọ aha onye ahụ ọzọ karịa ka Grik si mee.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị asụgharị κύριος mgbe a na-agwa Jizọs okwu; ọ na-echekwa ibu aha ahụ nwere n’ihe gbasara okwukwe.
- source_word: μετὰ σοῦ
  choice: iso gị
  rationale: μετά tinyere genitive na-egosi iso mmadụ; “iso gị” bụ ụzọ Igbo dị mfe ma kwekọọ na ngwaa “gaa.”
- source_word: ἕτοιμός εἰμι
  choice: adị m njikere
  rationale: Nkebi a na-egosi na Pita kwuru na o kwadebere ma dịkwa njikere ime ihe ahụ.
- source_word: καὶ ... καὶ
  choice: ma ... ma
  rationale: Usoro “ma ... ma” na-ejikọta ebe abụọ ahụ n’ụzọ kwekọrọ na paired καί ma mee ka ahịrịokwu ahụ bụrụ Igbo e ji eme ihe ugbu a.
- source_word: εἰς φυλακὴν
  choice: n’ụlọ mkpọrọ
  rationale: φυλακή n’ebe a pụtara ebe a na-atụ mmadụ mkpọrọ; n’usoro “iso gị gaa,” Igbo na-ekwu n’ụzọ ebumpụta ụwa “gaa n’ụlọ mkpọrọ.”
- source_word: εἰς θάνατον
  choice: n’ọnwụ
  rationale: Nke a na-egosi na Pita dị njikere iso Jizọs ruo n’ịnwụ anwụ, ma na-echekwa njikọ ya na “ụlọ mkpọrọ.”
- source_word: πορεύεσθαι
  choice: gaa
  rationale: N’ebe a, infinitive ahụ bụ ihe “ịdị njikere” na-achị, “gaa” bụkwa okwu Igbo kacha doo anya n’usoro a.
theological_decisions:
- issue: Ịsụgharị κύριος dị ka aha a na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-echekwa ma nsọpụrụ ma mkpa aha κύριος nwere n’ihe gbasara onye Jizọs bụ, ebe “Nna ukwu” nwere ike ime ka ọ bụrụ naanị aha onye isi ma ọ bụ onye nkụzi.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ùgwù. E debere okwu Pita n’ụzọ siri ike ma kwụ ọtọ, n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
