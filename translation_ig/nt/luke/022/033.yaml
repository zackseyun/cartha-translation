review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Peter as the speaker, his address to Jesus, his readiness, accompaniment, imprisonment, and death. However, “n’ọnwụ” most naturally locates the action ‘in death’ rather than expressing the directional limit εἰς θάνατον (‘to/as far as death’).
  naturalness: The sentence is clear and appropriately dignified in Standard Igbo. Adding “ruo” before the second destination makes the intended extent—readiness even as far as death—more idiomatic and unambiguous.
  terminology: “Onyenwe anyị” is an established reverential Standard Igbo rendering for κύριε in biblical register. It is suitable here; no doctrinal expansion is required. “ụlọ mkpọrọ” appropriately renders φυλακή.
  issues:
  - severity: medium
    issue: The phrase “n’ọnwụ” is insufficiently directional for εἰς θάνατον.
    rationale: In this construction it can be understood as ‘in death,’ while Peter’s statement expresses willingness to go with Jesus even as far as death. “ruo n’ọnwụ” clearly preserves that limit without adding interpretation.
  revised_text: Ma ọ sịrị ya, “Onyenwe anyị, adị m njikere iso gị gaa ma n’ụlọ mkpọrọ ma ruo n’ọnwụ.”
  revised_footnotes: []
  revision_rationale: The sole revision adds “ruo” to convey the directional and climactic force of εἰς θάνατον naturally in Standard Igbo. The paired structure, respectful address, and restrained register are retained.
