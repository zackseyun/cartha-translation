  to: Ma ọ sịrị ya, “Onyenwe anyị, adị m njikere iso gị gaa ma n’ụlọ mkpọrọ ma ruo n’ọnwụ.”
  rationale: The sole revision adds “ruo” to convey the directional and climactic force of εἰς θάνατον naturally in Standard Igbo. The paired structure, respectful address, and restrained register are retained.
