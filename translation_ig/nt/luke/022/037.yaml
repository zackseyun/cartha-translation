id: LUK.22.37
reference: Luke 22:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: ig
  text: 'N’ihi na ana m agwa unu na ihe a e dere aghaghị imezu n’ime m: “A gụkọtara ya na ndị na-emebi iwu.”[a] N’ihi na ihe gbasara m na-eru na mmezu ya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka nsụgharị ọdịnala si kwuo, “A gụnyere ya n’etiti ndị mmehie” (Aịzaya 53:12).
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ihe gbasara m na-eru ná njedebe ya,” ma ọ bụ “ihe gbasara m na-abịa na mmezu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: N’ihi na ana m agwa unu
  rationale: ‘Ana m agwa unu’ bụ ụzọ Igbo nke oge a si ekwu okwu a n'ụzọ eke; ‘N’ihi na’ na-edobe njikọ nkọwa nke γάρ.
- source_word: τοῦτο τὸ γεγραμμένον
  choice: ihe a e dere
  rationale: Nke a na-edobe ihe ngosi ahụ na participle perfect n’etinyeghị okwu ‘Akwụkwọ Nsọ,’ nke adịghị kpọmkwem n’asụsụ Grik.
- source_word: δεῖ τελεσθῆναι ἐν ἐμοί
  choice: aghaghị imezu n’ime m
  rationale: ‘Aghaghị’ na-egosipụta mkpa dị na δεῖ; ‘imezu’ dabara n’ihe amụma e dere; ‘n’ime m’ na-edobe ἐν ἐμοί n’enweghị ịkọwa ya karịa ihe ederede kwuru.
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: A gụkọtara ya na ndị na-emebi iwu
  rationale: ‘Ndị na-emebi iwu’ na-egosipụta ἀνόμων n’Igbo doro anya, ebe ‘a gụkọtara ya na’ na-eburu echiche nke itinye ya n’otu ndị ahụ.
- source_word: τὸ περὶ ἐμοῦ
  choice: ihe gbasara m
  rationale: Nke a bụ Igbo eke nke na-edobe nkọwa sara mbara nke ihe metụtara Jizọs.
- source_word: τέλος ἔχει
  choice: na-eru na mmezu ya
  rationale: Nkebiokwu a na-echekwa echiche nke ịga n’ihu ruo na njedebe ma ọ bụ mmezu, n’emeghị ka otu n’ime echiche abụọ ahụ bụrụ naanị ihe o pụtara.
theological_decisions:
- issue: Otu e si sụgharịa okwu e hotara n’Aịzaya 53:12
  choice: A gụkọtara ya na ndị na-emebi iwu
  alternative: A gụnyere ya n’etiti ndị mmehie
  rationale: Nhọrọ bụ isi na-anọ nso na ἀνόμων, ‘ndị na-enweghị iwu/ndị na-emebi iwu.’ E debere okwu ọdịnala nke na-ekwu ‘ndị mmehie’ n’ala peeji maka njikọ a maara nke ọma na Aịzaya 53:12.
- issue: Ihe τέλος ἔχει pụtara
  choice: na-eru na mmezu ya
  alternative: na-eru ná njedebe ya; enweela mmezu
  rationale: Okwu Grik ahụ nwere ike igosi njedebe, mmecha, ma ọ bụ mmezu. Nhọrọ a na-echekwa esemokwu ahụ ma na-egosi na ihe gbasara Jizọs na-aga n’ihu iru ebe a kara aka.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ mee plural doro anya. E zere okwu ụka pụrụ iche, ma debe ihe odide amụma na mgbagwoju anya dị na τέλος ἔχει.
