  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: ig
  text: Mgbe chi bọrọ[a], òtù ndị okenye nke ndị mmadụ, ya na ndị isi nchụàjà na ndị odeakwụkwọ Iwu, zukọtara; ha wee duga ya n’ihu nzukọ ikpe ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ụbọchị bịara” ma ọ bụ “n’isi ụtụtụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “banye ná nzukọ ha” ma ọ bụ “gaa n’ụlọ nzukọ ikpe ha.” Okwu Grik bụ συνέδριον; ọ pụrụ izo aka n’òtù ikpe ahụ n’onwe ya, ná nnọkọ ya, ma ọ bụ n’ebe ha na-enwe nnọkọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: Mgbe chi bọrọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo na ụbọchị abịala; ọ na-edobe echiche oge dị n’okwu Grik.
- source_word: συνήχθη
  choice: zukọtara
  rationale: Ọ na-egosi na ndị mejupụtara òtù ahụ gbakọrọ n’otu ebe, n’enweghị ịgbakwunye onye kpọkọtara ha.
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: nzukọ ndị okenye nke ndị Juu
  rationale: πρεσβυτέριον bụ òtù ndị okenye, ọ bụghị nanị ọnọdụ ịbụ okenye. ‘Ndị Juu’ na-eme ka ndị a na-ekwu maka ha doo onye na-agụ Igbo anya n’ọnọdụ akụkọ a.
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: ya bụ ndị isi nchụàjà na ndị odeakwụkwọ Iwu
  rationale: ‘Ya bụ’ na-egosi ndị e depụtara dị ka ndị so n’òtù ndị okenye ahụ; ‘ndị odeakwụkwọ Iwu’ na-akọwa ọrụ γραμματεῖς nke ọma karịa ‘ndị odeakwụkwọ’ naanị ya.
- source_word: ἀπήγαγον αὐτόν
  choice: ha wee kpọrọ ya gaa
  rationale: Ọ na-edobe echiche iduru ma ọ bụ ịkpọrọ mmadụ pụọ gaa ebe ọzọ, ma ọ naghị etinye ike ma ọ bụ ime ihe ike nke okwu Grik ekwughị kpọmkwem.
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: gaa n’ihu òtù ikpe ha
  rationale: συνέδριον nwere ike ịpụta òtù ahụ, nnọkọ iwu ya, ma ọ bụ ebe a na-anọ ikpe. ‘N’ihu òtù ikpe ha’ bụ Igbo doro anya nke dabara n’ọnọdụ ikpe, ebe nkọwa ala peeji na-edobe nghọta ndị ọzọ.
theological_decisions:
- issue: Aha ụlọ ọrụ ndị ọchịchị okpukpe ndị Juu
  choice: nzukọ ndị okenye ... òtù ikpe ha
  alternative: Kpọọ συνέδριον ‘Sanhedrin’ ma ọ bụ ‘ụlọ nzukọ ikpe ha’
  rationale: Nsụgharị isi na-eji okwu Igbo nghọta ya dị mfe kama ibubata aha transliteration; nkọwa ala peeji na-echekwa ọtụtụ ihe okwu Grik nwere ike ịpụta, n’enweghị ikpebi na ọ bụ naanị òtù ma ọ bụ naanị ụlọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma nwee ugwu. E ji ‘chi bọrọ’ mee ka ahịrịokwu ahụ daa nke ọma n’Igbo; e nyere ‘ndị odeakwụkwọ Iwu’ iji zere nghọtahie na ha bụ ndị na-ede ihe nkịtị. E tinyere akara nkọwa ala peeji [a] na [b] n’ahụ ederede dịka achọrọ.
