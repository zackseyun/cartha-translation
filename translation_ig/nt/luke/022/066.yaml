  source_fidelity: A chọrọ mmezi. ‘Ndị Juu’ na-atụgharị τοῦ λαοῦ (‘ndị mmadụ/ndị nke ha’) n’ụzọ kpọmkwem karịa ka Grik si kwuo; n’amaokwu a, ọ naghị eji Ἰουδαῖοι. ‘Ya bụ’ na-eme ka ndị isi nchụàjà na ndị odeakwụkwọ bụrụ nkọwa zuru oke nke nzukọ ndị okenye, ebe τε καί na-agbakwunye ha dịka akụkụ ndị e kpọrọ aha. ‘Duga ya’ na-edobe ἀπήγαγον nke ọma karịa ‘kpọrọ ya gaa.’
  naturalness: 'Ederede a a gbanwere ka ọ bụrụ Igbo ọkọlọtọ doro anya: ‘òtù ndị okenye nke ndị mmadụ’ na ‘n’ihu nzukọ ikpe ha’ na-ada nke ọma n’ọnọdụ ikpe, na-enweghị ibubata aha ‘Sanhedrin.’'
