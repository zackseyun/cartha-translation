  to: Mgbe chi bọrọ[a], òtù ndị okenye nke ndị mmadụ, ya na ndị isi nchụàjà na ndị odeakwụkwọ Iwu, zukọtara; ha wee duga ya n’ihu nzukọ ikpe ha[b].
  rationale: E wepụrụ ‘ndị Juu’ ka nsụgharị ahụ soro τοῦ λαοῦ n’ezoghị ezo. E dochiri ‘ya bụ’ anya ‘ya na’ ka τε καί nọgide bụrụ mgbakwunye. E ji ‘duga ya’ soro ἀπήγαγον, ma e jigidere ‘n’ihu nzukọ ikpe ha’ dịka nsụgharị Igbo eke nke na-ahapụ nghọta συνέδριον ka nkọwa ala peeji kọwaa.
