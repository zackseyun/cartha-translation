  verdict: revise
  source_fidelity: 'The draft conveys all principal elements of the Greek: the Lord turns, looks at Peter, Peter remembers the Lord’s word, and the prediction concerns a rooster’s crowing today and Peter’s threefold denial. The participial sequence is retained naturally by rendering στραφεὶς as “tụgharịrị” before “lee Pita anya.”'
  naturalness: The draft is generally clear Standard Igbo. Revising “wee tụgharịa” to the finite past form “tụgharịrị” makes the completed prior action more idiomatic within this self-contained sentence. “Oké ọkpa,” written as two words, is the standard transparent form for “rooster.”
  terminology: “Onyenwe anyị” is an appropriate reverential rendering of κύριος here. “Okwu Onyenwe anyị,” “lee ... anya,” “cheta,” and “ugboro atọ” are suitable and retain the register and sense of the source. The footnote appropriately preserves the possible nuance of an intent gaze without overstating it in the text.
