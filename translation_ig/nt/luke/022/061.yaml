    rationale: “Onyenwe anyị wee tụgharịa lee Pita anya” is understandable, but “Onyenwe anyị tụgharịrị lee Pita anya” more directly represents the Greek aorist participle as an action preceding the look and reads more smoothly as an independent verse sentence.
  - severity: low
    issue: Rooster spelling
    rationale: Writing “oké ọkpa” as two words is the clearer Standard Igbo orthography for the bird.
