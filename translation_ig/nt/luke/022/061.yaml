id: LUK.22.61
reference: Luke 22:61
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: ig
  text: Onyenwe anyị tụgharịrị lee Pita anya[a], Pita wee cheta okwu Onyenwe anyị, otu o si gwa ya, “Tupu oké ọkpa akwaa taa, ị ga-agọnahụ m ugboro atọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “legidere Pita anya”; ngwaa Grik ahụ pụrụ ịpụta ile mmadụ anya kpọmkwem ma ọ bụ ilegide ya anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: tụgharịa
  rationale: Ọ bụ aorist participle nke na-egosi ihe Onyenwe anyị mere tupu o lee Pita anya; usoro ‘wee tụgharịa’ na-egosipụta usoro omume ahụ n’Igbo dị mfe.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Aha a bụ ụzọ Igbo a na-ejikarị asụ κύριος mgbe ọ bụ utu aha Jizọs, ma na-echekwa ịdị arọ nke utu aha ahụ.
- source_word: ἐνέβλεψεν
  choice: lee Pita anya
  rationale: Nkebiokwu Igbo a na-egosi ile mmadụ anya kpọmkwem n’enweghị ịgbakwụnye n’amaokwu na ọ bụ ilegide anya; nkọwa ala peeji na-echekwa nuance ahụ.
- source_word: ὑπεμνήσθη
  choice: cheta
  rationale: Ụdị okwu Grik ahụ pụrụ ịpụta na e mere ka o cheta, ma n’ọnọdụ a isi ihe bụ na okwu ahụ batara Pita n’obi ọzọ; ‘cheta’ bụ Igbo nkịtị ma doo anya.
- source_word: λόγου
  choice: okwu
  rationale: N’ebe a λόγος na-ezo aka n’ihe Onyenwe anyị kwuru kpọmkwem; ‘okwu’ na-arụ ọrụ nke ọma n’Igbo.
- source_word: ὡς
  choice: otu o si
  rationale: N’ebe a ὡς na-ebute ọdịnaya nke ihe Pita chetara; ‘otu o si gwa ya’ bụ usoro Igbo eke.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Tupu okeọkpa akwaa
  rationale: πρίν na infinitive na-egosi oge tupu ihe ọzọ emee. Igbo anaghị achọ article iji kewaa ‘a rooster’ na ‘the rooster’ n’ụzọ Bekee si eme ya.
- source_word: σήμερον
  choice: taa
  rationale: ‘Taa’ na-egosipụta oge ozugbo nke amụma ahụ n’Igbo dị ugbu a.
- source_word: ἀπαρνήσῃ
  choice: ị ga-agọnahụ m
  rationale: ‘Gọnahụ’ na-egosi ịjụ ma ọ bụ ikwu na mmadụ amaghị onye ahụ, nke dabara n’omume Pita n’akụkọ a.
- source_word: τρίς
  choice: ugboro atọ
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụ nke oge a isi kwuo ‘three times.’
theological_decisions:
- issue: Ntughari κύριος dịka utu aha Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma ojiji akụkọ ahụ ma ịdị arọ nke utu aha metụtara onye Jizọs bụ; ‘Nna ukwu’ nwere ike ime ka uche gaa naanị n’ịbụ onye nkuzi ma ọ bụ onyeisi.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Usoro ‘wee’ na-eme ka omume ndị sochiri ibe ha doo anya, ebe a hapụrụ ike pụrụ ịdị na ἐμβλέπω n’akụkụ nkọwa ala peeji ka a ghara ikwubiga ihe odide ahụ ókè.
