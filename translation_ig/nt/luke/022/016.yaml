  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: ig
  text: N’ihi na agwa m unu na agaghị m eri ya ma ọlị ruo mgbe e mezuru ya n’alaeze Chineke[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Agaghị m eri ya ọzọ ma ọlị ruo mgbe e mezuru ya n’alaeze Chineke.” Grik ahụ na-ekwusi ike na ọ gaghị eri ya n’ọdịnihu. Ụfọdụ ntụgharị na-agbakwunye “ọzọ” site n’ihe gbara okwu ahụ gburugburu, ma okwu ahụ adịghị kpọmkwem n’ihe odide Grik.
    reason: lexical_alternative
  - marker: b
    text: “Ya” na-arụtụ aka na Emume Ngabiga a kpọrọ aha n’amaokwu bu ụzọ.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: N’ihi na ana m agwa unu
  rationale: “Ana m agwa unu” bụ ụzọ Igbo nke oge a si ekwupụta usoro okwu a n’ụzọ doro anya; “N’ihi na” na-echekwa njikọ nkọwa γάρ nwere n’amaokwu bu ụzọ.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ihe Jizọs na-ekwu ma na-echekwa nhazi ahịrịokwu Grik ahụ n’ụzọ dị mma n’Igbo.
- source_word: οὐ μὴ φάγω
  choice: agaghị m eri ya ma ọlị
  rationale: οὐ μή ya na ngwaa a dị n’ụdị subjunctive na-ekwusi ike na iri ahụ agaghị eme n’ọdịnihu. “Ma ọlị” na-ebupụta nkwusi ike ahụ n’Igbo nke oge a.
- source_word: αὐτό
  choice: ya
  rationale: Nnọchiaha ahụ na-arụtụ aka na Ngabiga a kpọrọ aha n’amaokwu bu ụzọ. “Ya” na-echekwa mkpụmkpụ na ntakịrị oghere nghọta dị n’ihe odide Grik kama ịgbakwunye aha ahụ n’ahịrịokwu.
- source_word: ἕως ὅτου
  choice: ruo mgbe
  rationale: Nke a na-egosi ókè oge; “ruo mgbe” bụ ntụgharị Igbo doro anya ma kwekọọ n’echiche ahụ.
- source_word: πληρωθῇ
  choice: e mezuru ya
  rationale: Ụdị a na-echekwa echiche nke imezu ihe ma ọ bụ iweta ya n’ozuzu ya, tinyere ụda mmezu dị n’akụkọ nzọpụta, n’ebughị ụzọ kọwaa kpọmkwem otú mmezu ahụ ga-adị.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: n’alaeze Chineke
  rationale: “Alaeze Chineke” bụ okwu Igbo a maara nke ọma nke na-echekwa ma echiche ọchịchị Chineke ma echiche ebe ọchịchị ya pụtara ìhè.
theological_decisions:
- issue: Ihe αὐτό (“ya”) na-arụtụ aka na ya
  choice: E debere nnọchiaha “ya,” nke n’ọnọdụ a na-arụtụ aka na Ngabiga a kpọrọ aha n’amaokwu bu ụzọ.
  alternative: Ịsụgharị ya kpọmkwem dịka “nri Ngabiga a” ma ọ bụ ịghọta ya n’obosara dịka emume Ngabiga.
  rationale: Ihe gbara amaokwu ahụ gburugburu na-akwado Ngabiga dịka ihe ọ na-arụtụ aka na ya, ma nnọchiaha Grik ahụ akọwaghị kpọmkwem ma ọ bụ nri ahụ naanị ka ọ bụ emume ahụ n’obosara. Ya mere, “ya” na-echekwa oghere nghọta ahụ.
- issue: Ihe “e mezuru ya n’alaeze Chineke” pụtara
  choice: E chekwara okwu mmezu nke na-ele anya n’ọdịnihu n’akọwaghị kpọmkwem ụzọ ma ọ bụ ihe omume mmezu ahụ.
  alternative: Ịkọwa ya dịka mmezu site n’ọbịbịa alaeze Chineke ma ọ bụ dịka oriri Mesaịa n’ọdịnihu.
  rationale: Grik ahụ na-atụ aka na mmezu nke metụtara alaeze Chineke, ma ọ naghị akọwa kpọmkwem usoro ma ọ bụ ihe omume ahụ. Ntụgharị a anaghị edozi esemokwu nkà mmụta okpukpe nke ihe odide ahụ hapụrụ ghe oghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa nkwusi ike nke nkwụsi-ike Grik, njikọ ya na amaokwu bu ụzọ, na nghọta mmezu nke ihe odide ahụ akọwaghị n’ụzọ dị warara.
