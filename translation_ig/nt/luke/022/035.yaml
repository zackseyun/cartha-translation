  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E ji ‘O wee sị’ jikọta amaokwu a na akụkọ gara aga; ahịrịokwu ajụjụ ahụ na azịza ya na-edobe mkparịta ụka dị nkenke nke Grik.
