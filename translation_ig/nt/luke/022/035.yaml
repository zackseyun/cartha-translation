- from: O wee sị ha, “Mgbe m zipụrụ unu n’ebughị obere akpa ego, akpa njem, ma ọ bụ akpụkpọ ụkwụ, ò nwere ihe ọ bụla kọrọ unu?” Ha sịrị, “Ọ dịghị ihe ọ bụla.”
  to: O wee sị ha, “Mgbe m zipụrụ unu n’enweghị akpa ego, akpa njem, na akpụkpọ ụkwụ, ọ̀ dị ihe ọ bụla unu kọrọ?” Ha sịrị, “Ọ dịghị ihe ọ bụla.”
  rationale: The revision removes the unsupported diminutive “obere,” renders the source preposition more directly, and lightly recasts the question for natural Standard Igbo without changing meaning, register, or the source’s concise exchange.
