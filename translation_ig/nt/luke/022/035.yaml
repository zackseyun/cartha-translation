  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: ig
  text: O wee sị ha, “Mgbe m zipụrụ unu n’enweghị akpa ego, akpa njem, na akpụkpọ ụkwụ, ọ̀ dị ihe ọ bụla unu kọrọ?” Ha sịrị, “Ọ dịghị ihe ọ bụla.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄτερ
  choice: n’ebughị
  rationale: N’ọnọdụ a, okwu ahụ na-egosi na ha ejighị ihe ndị a gawa; ‘n’ebughị’ bụ ụzọ Igbo si ekwu ya n'ụzọ doro anya ma dị mfe.
- source_word: βαλλαντίου
  choice: obere akpa ego
  rationale: Ọ bụ akpa e ji ebu ego. ‘Obere akpa ego’ na-akọwa ihe ahụ nke ọma n’Igbo nke oge a.
- source_word: πήρας
  choice: akpa njem
  rationale: Ọ bụ akpa e ji ebu ihe oriri ma ọ bụ ihe ndị ọzọ n’oge njem; ‘akpa njem’ na-egosi ọrụ ya n’enweghị ịkọwa ya karịa ihe odide Grik.
- source_word: ὑποδημάτων
  choice: akpụkpọ ụkwụ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ihe a na-eyi n’ụkwụ, gụnyere akpụkpọ ụkwụ ndị e ji aga njem n’oge ahụ.
- source_word: μή τινος ὑστερήσατε
  choice: ò nwere ihe ọ bụla kọrọ unu?
  rationale: Ajụjụ a na-atụ anya azịza na-adịghị mma. ‘Kọrọ unu’ na-egosipụta echiche nke ịnweghị ihe dị mkpa n’ụzọ Igbo na-adị ndụ.
- source_word: Οὐθενός
  choice: Ọ dịghị ihe ọ bụla
  rationale: Nke a na-edobe mkpụmkpụ na nkwuwa okwu nke azịza Grik, ma bụrụkwa Igbo nkịtị.
- source_word: ἀπέστειλα
  choice: m zipụrụ unu
  rationale: ‘Zipụrụ’ na-egosi na Jizọs nyere ha ozi ma mee ka ha pụọ, dabara n’ọnọdụ iziga ndị na-eso ụzọ.
