  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: ig
  text: Ọ ga-egosi unu otu nnukwu ọnụ ụlọ dị n’elu, nke e doziri; kwadebenụ ihe n’ebe ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνος
  choice: Ọ ga-...kwa
  rationale: Ngwakọta καί + ἐκεῖνος na-aga n’ihu n’usoro ntụziaka ma na-ezo aka n’ọ̀nyà nwe ụlọ ahụ; n’Igbo, nnọchiaha “Ọ” na mgbakwunye “-kwa” na-ebute njikọ ahụ n’ụzọ ebumpụta ụwa.
- source_word: ὑμῖν δείξει
  choice: ga-egosi unu
  rationale: Ọdịnihu δείξει na dative ὑμῖν pụtara na nwoke ahụ ga-egosi ha ebe ahụ; “ga-egosi unu” bụ ntụgharị doro anya ma dịkwa n’usoro Igbo.
- source_word: ἀνάγαιον μέγα
  choice: otu nnukwu ọnụ ụlọ dị n’elu
  rationale: ἀνάγαιον bụ ọnụ ụlọ dị n’elu ụlọ, μέγα na-akọwa ya dị ka nnukwu; okwu a anaghị agbakwunye na ọ bụ kpọmkwem ọnụ ụlọ ndị ọbịa.
- source_word: ἐστρωμένον
  choice: nke a kwadebere
  rationale: Perfect passive participle na-egosi na e meelarị ndokwa n’ọnụ ụlọ ahụ. “A kwadebere” na-edobe obosara ihe okwu Grik nwere ike ịpụta, ebe nkọwa ala peeji na-egosi nhọrọ nke ihe e debere ma ọ bụ ngwá ụlọ.
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: kwadebenụ ihe n’ebe ahụ
  rationale: ἐκεῖ bụ “n’ebe ahụ,” ebe ἑτοιμάσατε bụ iwu a nyere ọtụtụ mmadụ. “Ihe” na-eme ka iwu ahụ bụrụ Igbo ebumpụta ụwa n’agbanyeghị na ihe a ga-akwadebe sitere n’okirikiri amaokwu ndị gbara ya gburugburu.
