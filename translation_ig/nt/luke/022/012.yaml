translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe ἐστρωμένον pụtara n’obosara ya kama ikpebi kpọmkwem ma ọ bụ ngwá ụlọ, ihe ndina iri nri, ma ọ bụ nkwadebe ndị ọzọ.
