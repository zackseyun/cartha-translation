  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: ig
  text: Kwa ụbọchị, mgbe mụ na unu nọ n'ụlọ nsọ, unu esetịghị aka unu megide m[a]. Ma nke a bụ oge unu na ikike nke ọchịchịrị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu ejideghị m.” Okwu Grik ahụ pụtara n'ụzọ nkịtị ịsetị aka megide mmadụ; n'ebe a, ọ na-ekwu maka ime ihe iro, ya bụ ijide ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ike ọchịchịrị.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: Kwa ụbọchị
  rationale: Nkebiokwu a na-egosi ihe na-eme ugboro ugboro kwa ụbọchị. “Kwa ụbọchị” bụ okwu Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: mgbe mụ na unu nọ
  rationale: A tụgharịrị genitive absolute ahụ ka ọ bụrụ nkebiokwu oge nke na-ada nke ọma n'Igbo ma na-echekwa ọnọdụ ahụ Jizọs na-ekwu maka ya.
- source_word: ἐν τῷ ἱερῷ
  choice: n'ụlọ nsọ
  rationale: ἱερόν na-ezo aka n'ogige na mpaghara ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n'ime ya. “Ụlọ nsọ” bụ ụzọ a na-aghọta nke ọma n'Igbo n'enweghị nkọwa karịrị ihe odide ahụ kwuru.
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: unu esetịghị aka unu megide m
  rationale: Nke a na-echekwa ihe oyiyi dị n'okwu Grik banyere ịsetị aka megide mmadụ, ebe ọnọdụ a na-egosi omume iro nke ijide ya.
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: Ma nke a bụ oge unu
  rationale: “Oge unu” na-echekwa ịdị mkpụmkpụ na ịdị arọ nke ὑμῶν ἡ ὥρα, nke pụtara oge e nyere ha ohere ime ihe, ọ bụghị naanị oge elekere.
- source_word: ἐξουσία
  choice: ikike
  rationale: “Ikike” nwere ike igosi ikike ime ihe ma ọ bụ ọchịchị e nyere ohere, ma ghara ime ka okwu ahụ bụrụ naanị ike anụ ahụ.
- source_word: τοῦ σκότους
  choice: ọchịchịrị
  rationale: “Ọchịchịrị” na-echekwa ihe atụ na ibu mmụọ dị n'okwu Grik ahụ n'emeghị ka a kọwaa ya kpọmkwem dịka Setan ma ọ bụ ihe ọjọọ.
theological_decisions:
- issue: Ma a ga-akọwa “ikike ọchịchịrị” kpọmkwem dịka ikike Setan ma ọ bụ ọchịchị ihe ọjọọ
  choice: E debere okwu ihe atụ ahụ dịka “ikike ọchịchịrị.”
  alternative: ikike Setan; ọchịchị ihe ọjọọ; ike ọchịchịrị
  rationale: Ihe odide ahụ n'onwe ya kwuru “ọchịchịrị” ma ọ kpọghị Setan aha. Idebe ihe atụ ahụ na-echekwa mgbagwoju na ibu mmụọ nke okwu ahụ n'etinyeghị nkọwa okpukpe nke amaokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ okwu ihe atụ “oge unu” na “ikike ọchịchịrị” ka ha nwee ibu na mgbagwoju dị n'odide Grik, n'ebughị nkọwa otu ụka ma ọ bụ onye nkọwa ọ bụla bata.
