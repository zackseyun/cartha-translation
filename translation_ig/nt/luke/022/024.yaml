  yaml_path: translation/nt/luke/022/024.yaml
  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: ig
  text: Esemokwu bilitekwara n’etiti ha banyere onye n’ime ha a na-ewere dị ka onye ka ukwuu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye n’ime ha yiri ka ọ ka ukwuu.” Ngwaa Grik ahụ nwere ike ịpụta “o yiri” ma ọ bụ “a na-ewere dị ka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: bilitere
  rationale: N'ebe a, γίνομαι na-egosi mmalite nke ọnọdụ; “bilitere” bụ ụzọ Igbo si ekwu na esemokwu malitere.
- source_word: δὲ καὶ
  choice: -kwara
  rationale: Ngwakọta a na-egosi mmepe akụkọ na mgbakwunye. Mgbakwunye -kwara na-egosipụta καί nke ọma, ebe usoro akụkọ Igbo anaghị achọ ka e tinye okwu ntụgharị pụrụ iche maka δέ.
- source_word: φιλονεικία
  choice: esemokwu
  rationale: “Esemokwu” bụ okwu Igbo doro anya maka esemokwu ma ọ bụ ịrụrịta ụka, ma ọ naghị etinye ike karịa nke okwu Grik chọrọ.
- source_word: ἐν αὐτοῖς
  choice: n’etiti ha
  rationale: Nke a na-egosi na esemokwu ahụ mere n’ime ìgwè ahụ.
- source_word: τὸ τίς αὐτῶν
  choice: banyere onye n’ime ha
  rationale: Nke a na-egosipụta isiokwu esemokwu ahụ n’ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: δοκεῖ
  choice: e weere na
  rationale: δοκέω nwere ike ịpụta na mmadụ yiri ihe ma ọ bụ na ndị ọzọ weere ya otú ahụ. N'ọnọdụ a, “e weere na” na-egosipụta ntule ọkwa n’etiti ndị otu ahụ.
- source_word: εἶναι μείζων
  choice: ọ ka ndị ọzọ ukwuu
  rationale: Nke a na-edebe ụdị ntụnyere nke μείζων, ọ bụghị ime ya ka ọ bụrụ okwu kachasị elu.
theological_decisions:
- issue: Asụsụ gbasara ọkwa n’etiti ndị na-eso ụzọ
  choice: ọ ka ndị ọzọ ukwuu
  alternative: ọ bụ onye kachasị ukwuu
  rationale: Grik ji ụdị ntụnyere μείζων mee ihe, ọ bụghị ụdị kachasị elu n'ụzọ doro anya; ya mere nsụgharị ahụ anaghị eme ka okwu ahụ sie ike karịa isi mmalite.
- issue: Ihe δοκεῖ pụtara
  choice: e weere na
  alternative: o yiri ka
  rationale: Ihe gbara okwu ahụ gburugburu na-akwado echiche nke otú ndị otu ahụ si atụ ọkwa mmadụ, ma ihe ọzọ δοκεῖ nwere ike ịpụta ka e debere n'ala peeji.
translation_notes:
  register: Asụsụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “-kwara” gosipụta mgbakwunye, ma zere itinye okwu mmalite na-enweghị okwu kwekọrọ kpọmkwem na isi mmalite.
