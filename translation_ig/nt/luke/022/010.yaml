  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: ig
  text: Ọ sịrị ha, “Lee[a], mgbe unu banyere n’obodo ahụ, otu nwoke bu ite[b] mmiri ga-ezute unu. Soro ya banye n’ụlọ ahụ ọ na-abanye.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lekwa.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik κεράμιον pụrụ ịpụta kpọmkwem ite mmiri e ji ụrọ kpụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo dị mfe ma dị ndụ e ji adọta uche mmadụ; ọ na-echekwa ọrụ okwu Grik ahụ n’enweghị asụsụ ochie na-adịghị adịkarị n’ọnụ ndị mmadụ.
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: mgbe unu banyere n’obodo ahụ
  rationale: A tụgharịrị genitive absolute a dị ka nkebiokwu oge. “Mgbe unu banyere” na-egosi na nzute ahụ ga-eme mgbe ha batara n’obodo ahụ.
- source_word: συναντήσει ὑμῖν
  choice: ga-ezute unu
  rationale: Nke a na-egosipụta ngwaa ọdịnihu na onye ihe ahụ metụtara n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: N’ebe a, okwu ahụ na-ezo aka n’otu nwoke a kapịrị ọnụ; “otu nwoke” na-eme ka nke ahụ doo anya n’Igbo.
- source_word: κεράμιον ὕδατος
  choice: ite mmiri
  rationale: “Ite mmiri” bụ okwu Igbo dị mfe ma kwekọọ n’echiche bụ isi nke arịa e ji ebu mmiri. E debere nkọwa na ọ pụrụ ịbụ ite ụrọ n’ihe odide ala peeji.
- source_word: βαστάζων
  choice: bu
  rationale: “Bu” na-egosi omume nwoke ahụ na-eme mgbe ha hụrụ ya, n’ụzọ dị mkpirikpi ma kwekọọ n’asụsụ Igbo.
- source_word: ἀκολουθήσατε αὐτῷ
  choice: Soro ya
  rationale: Nke a bụ iwu kwụ ọtọ, ma ọ na-enye echiche nkịtị nke iso onye ahụ n’azụ.
- source_word: οἰκίαν
  choice: ụlọ
  rationale: “Ụlọ” bụ okwu Igbo nkịtị na nke kpọmkwem maka οἰκία n’ebe a.
- source_word: εἰς ἣν εἰσπορεύεται
  choice: banye n’ụlọ ọ ga-abanye
  rationale: 'Nhọrọ a na-echekwa ntụziaka nke εἰς ugboro abụọ: ha ga-eso ya banye kpọmkwem n’ụlọ ahụ ọ na-abanye.'
