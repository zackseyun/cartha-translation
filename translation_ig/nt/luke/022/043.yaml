id: LUK.22.43
reference: Luke 22:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ὤφθη δὲ αὐτῷ ἄγγελος ⸀ἀπ’ οὐρανοῦ ἐνισχύων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/043.yaml
  text: Then an angel from heaven appeared to him[a], strengthening him.
translation:
  language: ig
  text: Mgbe ahụ, otu mmụọ ozi si n’eluigwe pụta ìhè n’ihu ya[a], na-enye ya ike.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide anaghị etinye amaokwu 43–44.
    reason: textual_variant
lexical_decisions:
- source_word: ὤφθη
  choice: pụta ìhè n’ihu ya
  rationale: N’usoro okwu banyere ngosipụta, aorist passive nke ὁράω pụtara ‘pụtara ìhè’ ma ọ bụ ‘gosiri onwe ya.’ Nke a bụ Igbo eke karịa ntụgharị nkịtị dịka ‘a hụrụ ya,’ nke nwere ike ime ka uche gaa n’ebe onye hụrụ ya nọ.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: δέ na-akwalite akụkọ ahụ n’ihu; ‘Mgbe ahụ’ na-egosi usoro ihe omume n’enweghị itinye echiche nke nnukwu ọdịiche.
- source_word: αὐτῷ
  choice: n’ihu ya
  rationale: Dative a jikọrọ na ὤφθη na-egosi onye mmụọ ozi ahụ pụtara nye ya; n’Igbo, ‘pụta ìhè n’ihu ya’ na-ekwupụta nke a n’ụzọ eke.
- source_word: ἄγγελος
  choice: otu mmụọ ozi
  rationale: N’ihi na onye ozi a si n’eluigwe, ‘mmụọ ozi’ bụ nghọta kwesịrị ekwesị karịa naanị ‘onye ozi.’ ‘Otu’ na-egosipụta na aha Grik ahụ enweghị article.
- source_word: ἀπ’ οὐρανοῦ
  choice: si n’eluigwe
  rationale: Nkebi okwu a na-egosi ebe o si bịa; ‘si n’eluigwe’ bụ okwu Igbo doro anya ma kwekọọ na isi mmalite ahụ.
- source_word: ἐνισχύων
  choice: na-enye ya ike
  rationale: Present participle ahụ na-egosi ihe ọ nọ na-eme n’otu oge ahụ. ‘Na-enye ya ike’ bụ Igbo dị mfe ma chekwaa echiche nke ime ka o sie ike, n’ejighị ‘ịgba ume’ kọwaa ya naanị dịka nkwado mmetụta uche.
- source_word: αὐτόν
  choice: ya
  rationale: Ọ bụ direct object nke na-ezo aka na Jizọs; ‘ya’ na-enye ntụgharị kwụ ọtọ ma dị eke.
theological_decisions:
- issue: Ọnọdụ ederede nke Luk 22:43
  choice: E tinyere amaokwu a n’ederede bụ isi dịka ọ dị na SBLGNT e nyere.
  alternative: Ụfọdụ ihe odide anaghị etinye Luk 22:43–44.
  rationale: A tụgharịrị ederede Grik e nyere, ma e gosikwara esemokwu dị n’ihe odide ochie na nkọwa ala peeji kama izochi ya ma ọ bụ kpebie ya n’otu akụkụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘na-enye ya ike’ iji chekwaa omume na-aga n’ihu nke participle ahụ na-enweghị ịkọwa ụdị ike ahụ karịa ihe Grik kwuru.
