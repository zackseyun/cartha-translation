source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: ig
  text: Ma Setan banyere n’ime Judas, onye a na-akpọ Iskarịọt, onye bụ otu n’ime ndị iri na abụọ ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye sitere n’ọnụọgụgụ ndị iri na abụọ ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: Mgbe ahụ ... banyere
  rationale: δὲ na-aga n’ihu n’akụkọ ahụ, ya mere ‘Mgbe ahụ’ dabara n’Igbo; ‘banyere’ na-egosipụta omume εἰσῆλθεν.
- source_word: Σατανᾶς
  choice: Setan
  rationale: Nke a bụ nsụgharị aha a na-ejikarị eme ihe n’Igbo Agba Ọhụrụ.
- source_word: εἰς Ἰούδαν
  choice: n’ime Judas
  rationale: ‘N’ime’ na-eme ka εἰς pụta ìhè ma chekwaa okwu siri ike nke na-ekwu na Setan banyere n’ime Judas.
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: onye a na-akpọ Iskarịọt
  rationale: Nkebiokwu a na-akọwapụta Judas n’ụzọ doro anya ma bụrụkwa Igbo nkịtị na-asọ asọ.
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: onye so n’ọnụọgụ ndị ozi iri na abụọ
  rationale: ‘So n’ọnụọgụ’ na-echekwa echiche nkịtị nke ἐκ τοῦ ἀριθμοῦ; itinye ‘ndị ozi’ na-eme ka ndị iri na abụọ a na-ekwu maka ha doo onye na-agụ Igbo anya n’enweghị ịkọwa ihe karịrị ọnọdụ akụkọ ahụ.
theological_decisions:
- issue: Ụdị omume Setan mere n’ebe Judas nọ
  choice: Setan banyere n’ime Judas
  alternative: Setan metụtara Judas / Setan jidere Judas
  rationale: εἰσῆλθεν ... εἰς kwuru banyere ịbanye n’ime mmadụ kpọmkwem. Nsụgharị ahụ anaghị eme ka okwu a dị nro, ma ọ naghịkwa agbakwunye nkọwa banyere inwe mmụọ ọjọọ ma ọ bụ wepụ ibu ọrụ Judas.
- issue: Njirimara ndị iri na abụọ
  choice: ndị ozi iri na abụọ
  alternative: ndị iri na abụọ
  rationale: N’ọnọdụ Luk, otu a bụ ndị ozi Jizọs họpụtara. ‘Ndị ozi iri na abụọ’ na-eme ka ihe a na-ekwu doo anya; ihe odide ahụ anaghị ekpebi ụdị mkpụrụedemede ukwu ma ọ bụ nta dịka Bekee.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ aha ‘Judas’ na ‘Iskarịọt’ n’ụdị a maara nke ọma. Akara nkọwa [a] dị n’ahịrị isi, dị ka achọrọ.
