revisions:
- from: Mgbe ahụ, Setan banyere n’ime Judas, onye a na-akpọ Iskarịọt, onye so n’ọnụọgụ ndị ozi iri na abụọ.[a]
  to: Ma Setan banyere n’ime Judas, onye a na-akpọ Iskarịọt, onye bụ otu n’ime ndị iri na abụọ ahụ.[a]
  rationale: The revision removes the unsupported addition “ndị ozi” from both the text and its footnote. It renders the Greek membership expression naturally as “onye bụ otu n’ime ndị iri na abụọ ahụ,” while the footnote records a more literal alternative. “Ma” retains the connective narrative force of δέ without imposing a stronger temporal relation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders Satan's entry into Judas and preserves the identifying expression “the one called Iscariot.” However, “ndị ozi” (apostles) is not present in the Greek of this verse; it specifies only “the twelve.” This contextual clarification should not be inserted into the translated text.
  naturalness: “Onye bụ otu n’ime ndị iri na abụọ ahụ” is clear, idiomatic Standard Igbo, and naturally conveys Judas’s membership in the group. “Ma” is a closer and natural narrative rendering of δέ than the more temporally specific “Mgbe ahụ.”
  terminology: “Setan,” “Judas,” and “Iskarịọt” are appropriate established Igbo biblical forms. Retaining “ndị iri na abụọ ahụ” avoids adding the title “apostles” while still referring clearly to the definite group in context.
  issues:
  - severity: medium
    issue: The translation adds “ndị ozi” (“apostles”) to the phrase describing the twelve.
    rationale: The source reads ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα, “of/from the number of the twelve,” without the word ἀπόστολοι. Though context identifies the group, the added designation is not part of this verse and reduces formal source fidelity.
  - severity: low
    issue: The footnote’s alternative likewise adds “ndị ozi.”
    rationale: A lexical-alternative footnote should not introduce terminology absent from the source phrase it explains.
  revised_text: Ma Setan banyere n’ime Judas, onye a na-akpọ Iskarịọt, onye bụ otu n’ime ndị iri na abụọ ahụ.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “onye sitere n’ọnụọgụgụ ndị iri na abụọ ahụ.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unsupported addition “ndị ozi” from both the text and its footnote. It renders the Greek membership expression naturally as “onye bụ otu n’ime ndị iri na abụọ ahụ,” while the footnote records a more literal alternative. “Ma” retains the connective narrative force of δέ without imposing a stronger temporal relation.
