id: LUK.22.64
reference: Luke 22:64
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: ig
  text: Mgbe ha kpuchisịrị ya[a], ha nọgidere na-ajụ ya, sị, “Buo amụma! Ònye bụ onye tiri gị ihe?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mgbe ha kechara ya ákwà n’anya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: Mgbe ha kpuchisịrị ya ihu
  rationale: Okwu Grik ahụ pụtara ikpuchi mmadụ ma ọ bụ ikpuchi ya gburugburu. N'Igbo, ịgbakwunye “ihu” na-eme ka ihe ahụ doo anya n'ụzọ dị mma n'ọnọdụ a, ma ọ naghị ekwu kpọmkwem otú ha si gbochie ya ịhụ ụzọ.
- source_word: ἐπηρώτων
  choice: ha nọgidere na-ajụ ya
  rationale: Ụdị imperfect na-egosi na ajụjụ ahụ gara n'ihu ma ọ bụ na ha na-ajụ ya ugboro ugboro; “nọgidere na-ajụ” na-egosipụta nke a.
- source_word: λέγοντες
  choice: sị
  rationale: “Sị” bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi webata kpọmkwem ihe ha kwuru.
- source_word: Προφήτευσον
  choice: Buo amụma!
  rationale: Nke a na-edobe iwu ịkwa emo ahụ n'ụzọ kpọmkwem ma ghara ịgbakwunye “gwa anyị,” nke na-adịghị n'ihe odide Grik.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Ònye bụ onye tiri gị ihe?
  rationale: “Onye tiri gị ihe” na-egosipụta participle nwere article dị ka aha—onye ahụ mere ihe ahụ—ma “tiri ... ihe” bụ okwu Igbo ebumpụta ụwa maka iti mmadụ.
theological_decisions:
- issue: Ma a ga-ekwu kpọmkwem na e kere Jizọs ákwà n'anya
  choice: E debere okwu sara mbara, “kpuchisịrị ya ihu,” n'isiokwu
  alternative: “kere ya ákwà n'anya”
  rationale: Ọnọdụ ahụ na-egosi na ha gbochiri ya ịhụ ụzọ, ma ngwaa Grik n'onwe ya pụtara ikpuchi ma ọ bụ ikpuchi gburugburu. Ya mere, isiokwu ahụ anaghị akọwa ụzọ e si mee ya karịa ihe isi mmalite kwuru; nkọwa ala peeji na-edebe nsụgharị a na-ahụkarị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu na-aga nke ọma n'Igbo, ebe a ka na-edobe omume na-aga n'ihu nke imperfect na ịkwa emo dị n'iwu ahụ.
