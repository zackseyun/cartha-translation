source:
  edition: SBLGNT
  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: ig
  text: Mgbe ọ bịarutere n’ebe ahụ, ọ sịrị ha, “Kpeenụ ekpere ka unu ghara ịbanye n’ọnwụnwa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ule” ma ọ bụ “nnwale.” Okwu Grik a nwere ike ịpụta ọnwụnwa ime ihe ọjọọ, ma ọ bụ oge ule n’ụzọ sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος
  choice: ọ bịarutere
  rationale: N’usoro a, γενόμενος tinyere ἐπὶ τοῦ τόπου na-egosi na ọ rutere ebe ahụ. “Ọ bịarutere” bụ Igbo doro anya ma na-egosi na ọbịbịa ahụ mere tupu o kwuo okwu.
- source_word: δὲ
  choice: Mgbe
  rationale: E jikọtara δέ na participle γενόμενος iji mee njikọ akụkọ na nke oge. “Mgbe” na-eme ka njikọ ahụ bụrụ Igbo sitere n’ọnụ nke ọma.
- source_word: ἐπὶ τοῦ τόπου
  choice: n’ebe ahụ
  rationale: Ọ bụ ebe a maara ama site n’ihe e kwuru n’amaokwu bu ụzọ. “N’ebe ahụ” na-egosi ebe ahụ n'ụzọ dị mfe ma kwekọọ na ngwaa “bịarutere.”
- source_word: εἶπεν αὐτοῖς
  choice: ọ sịrị ha
  rationale: Nke a na-asụgharị λέγω n’ụzọ kwụ ọtọ, n’Igbo nkịtị ma dị ùgwù, n’etinyeghị ike ọzọ nke okwu Grik ahụ na-enweghị.
- source_word: Προσεύχεσθε
  choice: Kpeenụ ekpere
  rationale: Imperative present a na-akpọ ndị na-eso ụzọ ka ha na-ekpe ekpere. “Kpeenụ ekpere” bụ iwu ọtụtụ mmadụ nke sitere n’ọnụ nke ọma; ọ dịghị mkpa ịgbasa ya ka ọ bụrụ “na-ekpekwanụ ekpere” n’ahịrị isi.
- source_word: μὴ εἰσελθεῖν
  choice: ka unu ghara ịbanye
  rationale: Nkebiokwu a na-egosi ihe ma ọ bụ ebumnuche ekpere ahụ. “Ka unu ghara ịbanye” na-edebe ihe εἰσέρχομαι pụtara n’ụzọ kwụ ọtọ, kama ịsụgharị ya dịka “ịdaba,” nke ga-akọwawanye ihe karịa okwu Grik ahụ.
- source_word: πειρασμόν
  choice: ọnwụnwa
  rationale: “Ọnwụnwa” dabara n’ọnọdụ a nke ihe ize ndụ nke ọdịda ime mmụọ. Ma ebe πειρασμός nwekwara ike ịpụta ule ma ọ bụ oge nnwale, e debere nke ahụ n’ala ala peeji.
theological_decisions:
- issue: Ihe πειρασμός pụtara n’ịdọ aka ná ntị Jizọs
  choice: ọnwụnwa
  alternative: ule ma ọ bụ nnwale
  rationale: Ọnọdụ ahụ na-ekwu banyere ihe ize ndụ nke ndị na-eso ụzọ ịda n’ime mmehie, ya mere “ọnwụnwa” dabara nke ọma. Otú ọ dị, okwu Grik ahụ nwekwara nghọta sara mbara nke ule ma ọ bụ nnwale; ala ala peeji na-echekwa nghọta abụọ a kama idozi esemokwu ahụ n’amaghị ama.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị ùgwù. E ji ụdị iwu ọtụtụ mmadụ “Kpeenụ” mee ka okwu a gwara ndị na-eso ụzọ doo anya. E tinyere akara ala ala peeji [a] ozugbo n’akụkụ “ọnwụnwa,” bụ okwu ọ na-akọwa.
