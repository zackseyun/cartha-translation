source:
  edition: SBLGNT
  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: ig
  text: na-asị, “Nna, ọ bụrụ na ị chọrọ, wepụ m iko a[b]. Otú ọ dị, ọ bụghị uche m, kama ka uche gị mezuo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: N’Akwụkwọ Nsọ, “iko” bụ ihe atụ nke oke e kenyere mmadụ, ọkachasị ahụhụ ma ọ bụ ikpe.
    reason: cross_reference
lexical_decisions:
- source_word: λέγων
  choice: na-asị
  rationale: Ọ bụ participle nke na-ejikọta ekpere a na omume dị n’amaokwu bu ya ụzọ; ‘na-asị’ na-echekwa njikọ ahụ n’enweghị ịtụgharị ya ka ọ bụrụ ahịrịokwu ọhụrụ.
- source_word: Πάτερ
  choice: Nna
  rationale: Nke a bụ okwu a na-akpọ Chineke ozugbo; ‘Nna’ bụ okwu Igbo doro anya, dịkwa ugwu.
- source_word: εἰ βούλει
  choice: ọ bụrụ na ị chọrọ
  rationale: Nkebi a na-egosi ọchịchọ ma ọ bụ ịdị njikere nke Nna. Nsụgharị a bụ Igbo nkịtị ma na-echekwa ọnọdụ ‘ọ bụrụ na.’
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: wepụ ... n’ebe m nọ
  rationale: Okwu iwu a na-arịọ ka e bugharịa iko ahụ pụọ n’ebe Jizọs nọ; ‘wepụ ... n’ebe m nọ’ na-enye ihe okwu Grik ahụ pụtara n’ụzọ doro anya.
- source_word: τοῦτο τὸ ποτήριον
  choice: iko a
  rationale: E debere ihe atụ nke ‘iko’ ka njikọ ya na ahụhụ ma ọ bụ oke e kenyere mmadụ n’Akwụkwọ Nsọ ghara ịla n’iyi.
- source_word: πλὴν
  choice: Ma
  rationale: N’ebe a, ‘Ma’ na-egosi ntụgharị siri ike site n’arịrịọ ahụ gaa n’ido onwe ya n’okpuru uche Nna, ma ọ na-ada n’ụzọ nkịtị n’Igbo.
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: ọ bụghị uche m, kama ... uche gị
  rationale: A na-echekwa ọdịiche doro anya dị n’etiti uche Jizọs na uche Nna, dịka ahịrịokwu aha ndị ahụ dị na Grik.
- source_word: γινέσθω
  choice: ka ... mezuo
  rationale: Ụdị iwu nke γίνομαι na-arịọ ka uche Nna bụrụ ihe ga-emezu. ‘Ka uche gị mezuo’ bụ Igbo dị ndụ ma na-enye echiche ahụ n’enweghị nkọwa nkwenkwe agbakwunyere.
theological_decisions:
- issue: Mmekọrịta dị n’etiti uche Jizọs na uche Nna
  choice: ọ bụghị uche m, kama ka uche gị mezuo
  alternative: ọ bụghị ihe m chọrọ, kama ihe ị chọrọ
  rationale: A hapụrụ ọdịiche ahụ dịka ederede si kwuo ya, ma gosi nrubeisi Jizọs, n’enweghị ịkọwa ma ọ bụ belata esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
- issue: Ihe atụ nke iko
  choice: iko a
  alternative: ahụhụ a
  rationale: Ịhapụ ‘iko’ n’isi ederede na-echekwa ihe atụ na njikọ Akwụkwọ Nsọ ya; ịsị ‘ahụhụ’ n’isi ederede ga-akọwa ihe atụ ahụ karịa ka isi mmalite mere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ugwu. A na-ahapụ ‘na-asị’ ka ọ bụrụ njikọ participle na amaokwu bu ụzọ. E zere okwu ụka pụrụ iche na nkọwa nkwenkwe agbakwunyere.
