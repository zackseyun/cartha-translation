  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: ig
  text: N’ihi na Nwa nke Mmadụ na-aga dịka e kpebiri, ma ahụhụ ga-adịrị nwoke ahụ, onye ga-arara ya nye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ga-enyefe ya.” Okwu Grik ahụ nwere ike ịpụta “ịrara mmadụ nye” ma ọ bụ “inyefe mmadụ,” dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe mere okwu bu ya ụzọ ji bụrụ eziokwu, ma ọ na-adaba nke ọma n’usoro okwu Igbo.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Nke a na-echekwa aha Jizọs ji akọwa onwe ya na njikọ ya na akụkụ Akwụkwọ Nsọ ndị ọzọ.
- source_word: μέν … πλὴν
  choice: … ma
  rationale: Igbo anaghị achọ ka a sụgharịa μέν iche ebe a; “ma” na-egosipụta nke ọma ọdịiche dị n’etiti atụmatụ e kpebiri na ikpe dịịrị onye ahụ.
- source_word: κατὰ τὸ ὡρισμένον
  choice: dịka e kpebiri
  rationale: Ọ na-echekwa echiche nke mkpebi e mere tupu oge ahụ n’agbanyeghị na onye mere mkpebi ahụ apụtaghị kpọmkwem na Grik.
- source_word: πορεύεται
  choice: na-aga
  rationale: Ọ bụ okwu Igbo dị mfe ma kwekọọ na ụzọ Jizọs na-aga ruo n’ọnwụ ya.
- source_word: οὐαὶ
  choice: ahụhụ ga-adịrị
  rationale: Nke a na-enye ike nke ịdọ aka ná ntị banyere mbibi ma ọ bụ ikpe, n’asụsụ Igbo ndị mmadụ na-aghọta nke ọma.
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: nwoke ahụ
  rationale: Ọ na-ezo aka n’otu nwoke a kapịrị ọnụ, ya bụ onye ga-arara Jizọs nye.
- source_word: δι’ οὗ
  choice: onye a na-esite n’aka ya
  rationale: Ọ na-egosipụta agency nke διά na genitive n’ụzọ ebumpụta ụwa n’Igbo.
- source_word: παραδίδοται
  choice: rara ya nye
  rationale: N’ọnọdụ a, okwu ahụ na-egosipụta aghụghọ na ntụkwasị obi e mebiri; nkọwa ala peeji na-echekwa ihe ọzọ ọ pụtara, “nyefee.”
theological_decisions:
- issue: Mmekọrịta dị n’etiti mkpebi Chineke na ibu ọrụ mmadụ
  choice: E kwuru na Nwa nke Mmadụ na-aga dịka e kpebiri, ma ahụhụ ka ga-adịrị onye rụrụ ọrụ ahụ.
  alternative: Ime ka mkpebi e buru ụzọ mee ghara ịdị ike, ma ọ bụ ime ka ikpe dịịrị onye rara ya nye ghara ịdị ike.
  rationale: Grik tinyere ihe abụọ a n’akụkụ ibe ha n’enweghị idozi esemokwu dị n’etiti ha; nsụgharị ahụ na-echekwa ha abụọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma doo ndị na-agụ akwụkwọ taa anya. Ahịrịokwu ahụ na-echekwa ọdịiche siri ike dị n’etiti ihe e kpebiri na ibu ọrụ onye rara Jizọs nye.
