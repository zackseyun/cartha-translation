revisions:
- from: N’ihi na Nwa nke Mmadụ na-aga dịka e kpebiri, ma ahụhụ ga-adịrị nwoke ahụ onye a na-esite n’aka ya rara ya nye.[a]
  to: N’ihi na Nwa nke Mmadụ na-aga dịka e kpebiri, ma ahụhụ ga-adịrị nwoke ahụ, onye ga-arara ya nye.[a]
  rationale: The revision corrects an unclear agency construction by using a natural active relative clause. It retains the source’s juxtaposition of what has been determined with the woe pronounced on the responsible man, without resolving the theological tension. The footnote preserves the viable lexical alternative of “hand over.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:48Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the causal connection, the title «Nwa nke Mmadụ», the prior determination, and the contrast between that determination and the betrayer’s culpability. However, «onye a na-esite n’aka ya rara ya nye» does not naturally or clearly express the Greek passive «δι’ οὗ παραδίδοται» in Igbo.
  naturalness: «Nwa nke Mmadụ na-aga dịka e kpebiri» is clear, dignified Standard Igbo. Recasting the final relative clause actively as «onye ga-arara ya nye» is idiomatic and makes the intended agency unambiguous without materially changing the sense.
  terminology: «Ahụhụ ga-adịrị» suitably conveys the prophetic force of οὐαί in a biblical register. «Rara ya nye» fits the immediate context, while the footnote retains «nyefee» as the lexical alternative for παραδίδωμι.
  issues:
  - severity: medium
    issue: The clause «onye a na-esite n’aka ya rara ya nye» is syntactically and semantically unclear.
    rationale: 'The construction combines «site n’aka» with the active form «rara», leaving the relation of the man to the handing-over obscure. The Greek identifies the man as the one through whom the Son of Man is handed over; idiomatic Igbo can state this directly: «onye ga-arara ya nye».'
  - severity: low
    issue: The footnote’s alternative repeats the same unclear construction.
    rationale: Its wording should be revised in parallel so that the alternative sense, handing over rather than betrayal, is readily understood.
  revised_text: N’ihi na Nwa nke Mmadụ na-aga dịka e kpebiri, ma ahụhụ ga-adịrị nwoke ahụ, onye ga-arara ya nye.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ga-enyefe ya.” Okwu Grik ahụ nwere ike ịpụta “ịrara mmadụ nye” ma ọ bụ “inyefe mmadụ,” dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
  revision_rationale: The revision corrects an unclear agency construction by using a natural active relative clause. It retains the source’s juxtaposition of what has been determined with the woe pronounced on the responsible man, without resolving the theological tension. The footnote preserves the viable lexical alternative of “hand over.”
