  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: ig
  text: Ma lee, aka onye na-arara m nye dịnyere m n’elu tebụl.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Ma
  rationale: N’ebe a, okwu a na-egosi mgbanwe dị ike site n’ihe Jizọs kwuru tupu ya gaa n’ihe dị iche ma dị mwute; “Ma” na-egosipụta nke a n’Igbo nkịtị.
- source_word: ἰδοὺ
  choice: lee
  rationale: “Lee” bụ oku a na-akpọ onye na-ege ntị ka o tinye uche n’ihe na-esote, ma kwekọọ na ike nke ἰδού.
- source_word: ἡ χεὶρ τοῦ παραδιδόντος με
  choice: aka onye na-arara m nye
  rationale: E debere ihe atụ ahụ nke “aka” na ụdị participle nke na-egosi onye nọ ugbu a n’ọrụ ịrara Jizọs nye.
- source_word: μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης
  choice: dịnyere m n’elu tebụl
  rationale: Nke a na-edebe njikọ onye ahụ na Jizọs na tebụl, dịka usoro okwu Grik si kwuo, na-enweghị ịkọwapụta ihe karịrị isi mmalite.
theological_decisions:
- issue: Ma okwu ahụ ọ na-akpọ onye ahụ “onye sabọtara” ka ọ bụ “onye na-arara ... nye”?
  choice: onye na-arara m nye
  alternative: onye ga-arara m nye
  rationale: Participial present παραδιδόντος na-enye nkọwa nke onye ahụ dịka onye na-arara ya nye; e zere ime ya naanị ihe ga-eme n’ọdịnihu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E debere ihe atụ nke aka nọ n’elu tebụl na ihe ijuanya dị na “Ma lee,” n’agbanyeghị na okwu ahụ pụrụ ịdịtụ iche n’usoro Igbo nkịtị.
