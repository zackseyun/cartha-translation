review_pass:
  verdict: revise
  source_fidelity: The sequence of expulsion followed by killing and the concluding inferential question are preserved. However, “chụpụsịrị ya n’ubi vaịn ahụ” can be read as expelling him while in the vineyard and does not unambiguously express ἔξω τοῦ ἀμπελῶνος (“outside/out of the vineyard”).
  naturalness: The wording is otherwise clear, modern Standard Igbo, and appropriately concise. “N’èzí ubi vaịn ahụ” naturally and explicitly supplies the required destination outside the vineyard.
  terminology: “Onye nwe ubi vaịn ahụ” accurately conveys ὁ κύριος τοῦ ἀμπελῶνος in this parabolic context. “Gịnịzi” appropriately represents the inferential force of τί οὖν, and “ha gburu ya” is suitably direct for ἀπέκτειναν.
  issues:
  - severity: medium
    issue: The phrase for the expulsion does not explicitly state that the son was put outside the vineyard.
    rationale: Greek ἔξω τοῦ ἀμπελῶνος specifies the location/destination outside the vineyard. Adding “n’èzí” prevents a possible locative reading of “n’ubi vaịn ahụ.”
  revised_text: Mgbe ha chụpụrụ ya n’èzí ubi vaịn ahụ, ha gburu ya. Gịnịzi ka onye nwe ubi vaịn ahụ ga-eme ha?
  revised_footnotes: []
