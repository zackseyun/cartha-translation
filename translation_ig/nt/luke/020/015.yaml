  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: ig
  text: Mgbe ha chụpụrụ ya n’èzí ubi vaịn ahụ, ha gburu ya. Gịnịzi ka onye nwe ubi vaịn ahụ ga-eme ha?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: Mgbe ha chụpụsịrị ya
  rationale: Ngwaa a na-egosi na ha buru ụzọ chụpụ ya tupu ha egbuo ya; “chụpụ” na-egosikwa ike e ji wepụ ya.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: n’ubi vaịn ahụ
  rationale: Mgbe e jikọtara ya na “chụpụ,” nkebiokwu a na-egosi mmegharị si n’ime ubi ahụ pụọ; Igbo nkịtị na-ekwupụta nke a nke ọma dị ka “chụpụ ... n’ubi.”
- source_word: ἀπέκτειναν
  choice: ha gburu ya
  rationale: Nke a bụ ntụgharị kpọmkwem na nke doro anya nke ngwaa pụtara igbu mmadụ, n’etinyeghị nkọwa ọzọ dịka ikpe ọchụ.
- source_word: τί οὖν
  choice: Gịnịzi
  rationale: “Gịnịzi” na-echekwa ike nkwubi okwu nke οὖν ma bụrụkwa ajụjụ e ji Igbo oge a ekwu n'ụzọ ebumpụta ụwa.
- source_word: ποιήσει ... αὐτοῖς
  choice: ka ... ga-eme ha
  rationale: Nke a na-egosipụta ajụjụ banyere ihe onye nwe ubi ahụ ga-eme ndị ahụ n’ụzọ Igbo doro anya.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: onye nwe ubi vaịn ahụ
  rationale: N’ime ilu a, κύριος na-ezo aka n’ebe onye nwe ubi ahụ nọ, ọ bụghị iji aha nsọ “Onyenwe anyị” kpọọ Chineke ozugbo.
theological_decisions:
- issue: Otú e si tụgharịa κύριος mgbe ọ na-ezo aka n’ebe mmadụ nọ n’ilu
  choice: onye nwe ubi vaịn ahụ
  alternative: onyeisi ubi vaịn ahụ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ onye nwe ihe onwunwe ahụ ka a na-ekwu maka ya. Nhọrọ a na-ezere ime ka okwu ahụ yie aha nsọ Chineke, ma ọ naghị ewepụ ihe ilu ahụ nwere ike ịpụta n’ụzọ ime mmụọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ntụgharị ahụ. “Ubi vaịn” bụ okwu a na-aghọta nke ọma maka ἀμπελών, ebe “Mgbe ... chụpụsịrị” na-echekwa usoro omume dị na Grik.
