revisions:
- from: Mgbe ha chụpụsịrị ya n’ubi vaịn ahụ, ha gburu ya. Gịnịzi ka onye nwe ubi vaịn ahụ ga-eme ha?
  to: Mgbe ha chụpụrụ ya n’èzí ubi vaịn ahụ, ha gburu ya. Gịnịzi ka onye nwe ubi vaịn ahụ ga-eme ha?
  rationale: 'The revision makes the movement outside the vineyard explicit while retaining the aorist-participle sequence: they expelled him, then killed him. No footnote is necessary, since the contextual sense of “onye nwe” is clear in Igbo and no ambiguity affecting the translation remains.'
  reviewer_model: gpt-5.6-terra
