  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: ig
  text: N’ihi na Devid n’onwe ya na-ekwu n’Akwụkwọ Abụ Ọma, sị, “Onyenweanyị gwara Onyenwe m, ‘Nọdụ ala n’aka nri m.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: N’ihi na ... n’onwe ya
  rationale: “N’ihi na” na-egosi na okwu a bụ nkọwa na-esochi ihe e kwuru, ebe “n’onwe ya” na-egosipụta nkwusi ike dị na αὐτός.
- source_word: Δαυὶδ
  choice: Devid
  rationale: E dere aha mmadụ a n’ụdị a na-ejikarị eme ihe n’Igbo.
- source_word: λέγει
  choice: kwuru
  rationale: Ọ bụ ezie na Grik ji oge ugbu a n’usoro okwu e ji ewebata ihe e dere, oge gara aga bụ ụzọ Igbo dị mfe ma dị mma isi kwuo ya n’ebe a.
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: n’Akwụkwọ Abụ Ọma
  rationale: Nke a na-egosipụta βίβλος dị ka “Akwụkwọ” na ψαλμῶν dị ka “Abụ Ọma,” aha akwụkwọ Akwụkwọ Nsọ a maara nke ọma n’Igbo.
- source_word: Εἶπεν
  choice: gwara
  rationale: N’ahịrịokwu a, “gwara” na-egosipụta nke ọma na otu onye kwuru okwu nye onye ọzọ, ma na-edobe oge gara aga nke aorist.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: κύριος mbụ na-ezo aka na Chineke; “Onyenwe anyị” bụ nsụgharị Igbo a na-aghọta nke ọma nke na-agbaso Grik “Onyenwe,” ebe ndetu ala peeji na-echekwa ozi banyere aha Chineke dị n’amaokwu Hibru a kpọrọ.
- source_word: τῷ κυρίῳ μου
  choice: Onyenwe m
  rationale: Nke a na-echekwa okwu “Onyenwe” na nnọchiaha nke onye mbụ, ma ghara ime ka ihe amaokwu ahụ pụtara n’ihe gbasara Kraịst dị mfe karịa ka Grik siri kwuo ya.
- source_word: Κάθου
  choice: Nọdụ ala
  rationale: Nke a bụ iwu doro anya ma bụrụkwa ụzọ Igbo sitere n’obi isi sụgharịa κάθημαι n’ebe a.
- source_word: ἐκ δεξιῶν μου
  choice: n’aka nri m
  rationale: Nke a bụ akpaalaokwu Igbo kwesịrị ekwesị maka ịnọ n’ọnọdụ dị n’aka nri onye na-ekwu okwu.
theological_decisions:
- issue: Otu e si sụgharịa κύριος mbụ ebe Hibru nke Abụ Ọma 110:1 ji aha Chineke YHWH
  choice: Onyenwe anyị
  alternative: YHWH (aha Onyenwe anyị)
  rationale: Isi ederede na-agbaso Grik κύριος, ma ndetu ala peeji na-eme ka onye na-agụ mara na Hibru nke Abụ Ọma 110:1 nwere aha Chineke, ka ọdịiche dị n’etiti isi mmalite Grik na Hibru ghara ifu.
- issue: Otu e si sụgharịa κύριος nke abụọ n’okwu a dị mkpa banyere Kraịst
  choice: Onyenwe m
  alternative: Nna m ukwu
  rationale: “Onyenwe m” na-echekwa ịdị arọ nke okwu Grik na njikọ ya na arụmụka Jizọs banyere Mesaịa, n’enweghị itinye nkọwa karịrị ihe ederede kwuru.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “Akwụkwọ Abụ Ọma” maka aha akwụkwọ ahụ, ma debe ọdịiche dị n’etiti “Onyenwe anyị” na “Onyenwe m” ka esemokwu na ịdị arọ nke okwu ahụ ghara ịla n’iyi.
