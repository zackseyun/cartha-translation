  verdict: revise
  source_fidelity: 'A na-edobe ihe ndị bụ isi nke Grik nke ọma: nkwusi ike dị na «Devid n’onwe ya», ebe e si nweta okwu ahụ, okwu abụọ «Lord», na iwu ahụ. Otú ọ dị, «Onyenwe anyị» nke e dere okwu abụọ na-adịkarị ka «our Lord», ebe κύριος mbụ enweghị nnọchiaha nke onye mbụ. Aha okwukwe e ji eme ihe n’Igbo maka Lord n’ebe a kwesịrị ịbụ «Onyenweanyị», ka e wee ghara ịgbakwunye ihe enweghị na Grik. A gbanwere «kwuru» ka ọ bụrụ «na-ekwu» iji gosipụta oge ugbu a dị na λέγει n’usoro e ji akpọpụta Akwụkwọ Nsọ.'
