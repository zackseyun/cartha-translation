source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: ig
  text: Ndị odeakwụkwọ na ndị isi nchụàjà chọrọ ijide ya n’oge ahụ kpọmkwem[a], ma ha tụrụ ndị mmadụ egwu, n’ihi na ha maara na ọ bụ megide ha ka o kwuru ilu a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ịbịkwasị ya aka”; a pụkwara ịsụgharị ya “ijide ya.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “na ọ bụ ha ka ọ gwara ilu a” ma ọ bụ “na ilu a bụ banyere ha.” N’ebe a, o yiri ka ọ pụtara na ilu ahụ lekwasịrị ha anya ma katọọ ha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: chọrọ
  rationale: Aorist a na-achịkọta ebumnuche na mgbalị ha n’oge ahụ; “chọrọ” na-egosi ihe ha bu n’obi n’etinyeghị na ha mezuru ya.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ aha Igbo a na-ejikarị akọwa ndị ọkachamara n’Iwu ahụ dịka otu ndị a maara n’akụkọ Oziọma.
- source_word: ἀρχιερεῖς
  choice: ndịisi nchụàjà
  rationale: Plural a na-ezo aka n’òtù ndị ndu nchụàjà, ọ bụghị ọtụtụ ndị ji ọkwa otu nnukwu onye nchụàjà n’otu oge.
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: ijide ya
  rationale: Akpaalaokwu Grik ahụ pụtara imetụ mmadụ aka n’ike iji jide ya; “ijide ya” bụ okwu Igbo doro anya ma hapụ ma ihe ha chọrọ ọ̀ bụ ijichi ya ozugbo ma ọ bụ ijide ya ka e were ya gaa.
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: n’otu oge ahụ
  rationale: Na-egosi na ha chọrọ ime ya ozugbo n’oge ahụ kpọmkwem.
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: ha tụrụ ndị mmadụ egwu
  rationale: λαός bụ ndị mmadụ n’ozuzu ha, ọ bụghị naanị ìgwè mmadụ gbakọtara; okwu a na-echekwa egwu ndị ndu ahụ tụrụ mmeghachi omume ọha.
- source_word: ἔγνωσαν
  choice: ha maara
  rationale: Na-egosi na ha ghọtara ndị ilu ahụ lekwasịrị anya na ha.
- source_word: πρὸς αὐτοὺς
  choice: megide ha
  rationale: N’ọnọdụ esemokwu a, πρός na-egosi na ilu ahụ katọrọ ma lekwasị anya n’ebe ha nọ, ọ bụghị naanị na a gwara ha ya.
- source_word: παραβολὴν
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo dị mfe ma guzosie ike maka παραβολή n’akụkọ nkuzi Jizọs.
theological_decisions:
- issue: Ike okwu πρὸς αὐτοὺς n’ihe gbasara ilu Jizọs
  choice: ọ bụ megide ha ka o kwuru ilu ahụ
  alternative: ọ gwara ha ilu ahụ; ma ọ bụ, ilu ahụ bụ banyere ha
  rationale: Mmeghachi omume ha na ihe gbara amaokwu a gburugburu na-egosi na ha ghọtara onwe ha dịka ndị a katọrọ n’ilu ahụ. “Megide ha” na-echekwa ike esemokwu ahụ n’etinyeghị ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E ji “ndịisi nchụàjà” mata òtù ndị ndu nchụàjà, “ilu” maka παραβολή, ma jiri nkọwa ala mee ka akpaalaokwu ijide mmadụ na ike πρός pụta ìhè.
