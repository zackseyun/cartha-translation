  text: Ἀκούοντος δὲ παντὸς τοῦ λαοῦ εἶπεν τοῖς ⸀μαθηταῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: ig
  text: 'Mgbe ndị mmadụ niile nọ na-ege ntị[a], ọ sịrị ndị na-eso ụzọ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ka ndị mmadụ niile na-ege ntị, ọ sịrị ndị na-eso ụzọ.” N’asụsụ Grik, a na-eji usoro genitive absolute egosi ọnọdụ okwu ahụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: Mgbe ... nọ na-ege ntị
  rationale: Nkebiokwu a na-egosi ihe nọ na-eme n'otu oge ahụ ọ na-ekwu okwu; Igbo a na-asụ ugbu a na-egosipụta omume na-aga n'ihu nke ọma.
- source_word: δὲ
  choice: ejighị okwu njikọ pụrụ iche sụgharịa ya
  rationale: δὲ bụ njikọ dị nro na-akwalite akụkọ ahụ. N'Igbo, “mgbe” ejikọtala ahịrịokwu ahụ n'ụzọ eke, ya mere itinye “ma” ma ọ bụ “na” ga-eme ka okwu ahụ sie ike n'enweghị mkpa.
- source_word: παντὸς τοῦ λαοῦ
  choice: ndị mmadụ niile
  rationale: Nke a na-echekwa echiche nke mmadụ niile nọ n'ebe ahụ dịka otu ìgwè, n'ejighị “ìgwè mmadụ” mee ka λαός bụrụ naanị igwe gbakọtara.
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Nke a bụ ụzọ dị mkpirikpi ma bụrụkwa nke a na-ejikarị eme ihe n'Igbo maka okwu akụkọ nke pụtara “o kwuru.”
- source_word: τοῖς μαθηταῖς
  choice: ndị na-eso ụzọ ya
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya maka μαθηταί. A tinyere “ya” maka Igbo eke na maka njirimara ndị ahụ n'ọnọdụ akụkọ a, ọ bụ ezie na nnọchiaha nwe adịghị kpọmkwem na Grik.
theological_decisions:
- issue: Ịmata ọdịiche dị n'etiti ndị na-ege ntị na ndị a na-agwa okwu kpọmkwem
  choice: Jizọs gwara ndị na-eso ụzọ ya okwu mgbe ndị mmadụ niile nọ na-ege ntị.
  alternative: Jizọs gwara ndị mmadụ niile okwu kpọmkwem, ma ọ bụ gwa ndị na-eso ụzọ ya okwu na nzuzo.
  rationale: Nkebiokwu genitive absolute na-egosi ọnọdụ ọha mmadụ nke okwu ahụ, ebe dative τοῖς μαθηταῖς na-akọwa ndị ọ na-agwa okwu kpọmkwem. Nsụgharị ahụ na-echekwa ọdịiche abụọ ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a, dị ugwu ma dịkwa mfe nghọta. A họọrọ “nọ na-ege ntị” iji gosipụta omume na-aga n'ihu; akara ụkwụ [a] dị n'ederede isi.
