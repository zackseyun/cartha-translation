id: LUK.20.28
reference: Luke 20:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: ig
  text: Ha sịrị, “Onye Nkụzi, Mosis deere anyị na ọ bụrụ na nwanne nwoke mmadụ anwụọ mgbe o nwere nwunye[a], ma ọ nweghị nwa, nwanne ya nwoke ga-akpọrọ nwunye ahụ, mụtaara nwanne ya nwoke ụmụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “hapụ nwunye.” N’asụsụ Grik, ihe e kwuru kpọmkwem bụ “anwụọ mgbe o nwere nwunye.”
    reason: lexical_alternative
  - marker: b
    text: “Mụtaara nwanne ya nwoke ụmụ” na-ekwughachi akpaalaokwu iwu dị na Deuterọnọmi 25:5 banyere ime ka onye ahụ nwụrụ nwee ụmụ a ga-agụ n’aha ya. N’asụsụ Grik, ihe e kwuru kpọmkwem bụ “welitere mkpụrụ maka nwanne ya nwoke.”
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Ọ bụ okwu a kpọrọ Jizọs ihu na ihu. ‘Onye Ozizi’ bụ okwu Igbo doro anya ma dịkwa ugwu, na-enweghị echiche ndị ọzọ okwu dịka ‘Nna Ukwu’ nwere ike ibute.
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: Mosis deere anyị
  rationale: ἡμῖν na-egosi na ihe Mosis dere metụtara ha dịka ndị Izrel, ọ bụghị na ọ bụ akwụkwọ ozi o zigaara ha kpọmkwem.
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: ọ bụrụ na nwanne nwoke mmadụ anwụọ
  rationale: Nke a na-edobe otu onye a na-akọwaghị kpọmkwem nke τινος na-egosi, ma na-eme ka mmekọrịta ụmụnne nwoke doo anya n’Igbo.
- source_word: ἔχων γυναῖκα
  choice: mgbe ọ nwere nwunye
  rationale: Nke a na-esochi ihe Grik kwuru n’ụzọ kwụ ọtọ—‘anwụọ ebe o nwere nwunye’—ma bụrụkwa Igbo a na-aghọta nke ọma.
- source_word: οὗτος ἄτεκνος ᾖ
  choice: ma ọ mụtaghị nwa
  rationale: Ọ na-ekwu na nwoke ahụ nwụrụ n’enweghị nwa. Okwu a bụ Igbo nkịtị ma ghara ịkọwa ihe karịrị nke ἄτεκνος kwuru.
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: nwanne ya nwoke ga-akpọrọ nwanyị ahụ
  rationale: ‘Ga-akpọrọ’ na-egosi ihe iwu ahụ chọrọ, ebe ‘nwanyị ahụ’ na-ezo aka n’ebe nwunye ahụ a kpọtụrụla aha nọ, dịka artịkụl Grik si eme.
- source_word: ἐξαναστήσῃ σπέρμα
  choice: mụtaara ... ụmụ
  rationale: Nke a na-enye echiche okwu iwu ahụ—ịmụ ụmụ a ga-agụ dị ka ụmụ onye ahụ nwụrụ—n’Igbo dị ndụ ma doo anya; nkọwa ala peeji na-echekwa akpaalaokwu ‘iwelitera mkpụrụ.’
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: nwanne ya nwoke
  rationale: N’usoro ‘mụtaara nwanne ya nwoke ụmụ,’ ngwụcha -ara na-egosi na a mụtara ụmụ ahụ maka ma ọ bụ n’aha nwanne ahụ nwụrụ.
theological_decisions:
- issue: Otu e si tụgharị asụsụ iwu gbasara nwoke ịlụ nwunye nwanne ya nwụrụ n’etinyeghị nkọwa omenala ma ọ bụ ozizi e tinyere n’elu ihe ederede
  choice: nwanne ya nwoke ga-akpọrọ nwanyị ahụ, mụtaara nwanne ya nwoke ụmụ
  alternative: nwanne ya nwoke aghaghị ịlụ nwanyị ahụ, mụtakwa ụmụ ga-aza aha onye ahụ nwụrụ
  rationale: Nhọrọ ahụ na-edobe ụda iwu na nzube nke Deuterọnọmi 25:5, ma ọ naghị agbakwunye ‘ga-aza aha’ n’ahịrị bụ́ isi ebe Luk ji akpaalaokwu dị mkpirikpi kwuo ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ugwu. Ahịrị ahụ ka nwere ụda nke ntụaka iwu Mosis, ma e zere okwu ochie ma ọ bụ nkọwa ụka pụrụ iche. E debere akara ala peeji [a] n’akụkụ ‘nwere nwunye’ na [b] n’akụkụ okwu banyere ịmụta ụmụ, ebe nkọwa nke ọ bụla metụtara kpọmkwem.
