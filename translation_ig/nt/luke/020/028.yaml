revisions:
- from: Ha sịrị, “Onye Ozizi, Mosis deere anyị na ọ bụrụ na nwanne nwoke mmadụ anwụọ mgbe ọ nwere nwunye[a], ma ọ mụtaghị nwa, nwanne ya nwoke ga-akpọrọ nwanyị ahụ, mụtaara nwanne ya nwoke ụmụ[b].”
  to: Ha sịrị, “Onye Nkụzi, Mosis deere anyị na ọ bụrụ na nwanne nwoke mmadụ anwụọ mgbe o nwere nwunye[a], ma ọ nweghị nwa, nwanne ya nwoke ga-akpọrọ nwunye ahụ, mụtaara nwanne ya nwoke ụmụ[b].”
  rationale: 'The revision makes only safe lexical and idiomatic corrections: it uses the customary title “Onye Nkụzi,” identifies the woman as the deceased brother’s wife, expresses childlessness as a state, and clarifies the literal footnote gloss. It preserves the source text’s concise legal idiom and does not add cultural or doctrinal interpretation.'
