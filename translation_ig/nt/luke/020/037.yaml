revisions:
- from: Ma na a na-eme ka ndị nwụrụ anwụ bilie[a], Mosis n’onwe ya mere ka a mara nke a n’akụkụ Akwụkwọ Nsọ banyere ọhịa nta ahụ[b], ebe ọ kpọrọ Onyenwe anyị “Chineke Abraham, na Chineke Aịzik, na Chineke Jekọb.”
  to: Ma Mosis n’onwe ya mekwara ka a mara na a na-akpọlite ndị nwụrụ anwụ, n’akụkụ Akwụkwọ Nsọ nke gbasara ohia ahụ[a], ebe ọ kpọrọ Onyenwe anyị[b] Chineke Abraham, Chineke Aịzik, na Chineke Jekọb.
  rationale: The revision corrects the referent of βάτος, clarifies that Jesus refers to the scriptural section about the bush, and uses an idiomatic passive expression for resurrection. It separates the two English audit-trail notes and moves each anchor to its proper referent, without adding theological interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the resurrection claim and Moses' evidence, but "ọhịa nta" means a small forest/woodland rather than the thornbush intended by βάτος. The passage-reference sense of ἐπὶ τῆς βάτου should be retained with a clearer formulation, and the footnote material needs to be attached to the terms it explains.
  naturalness: '"N’akụkụ Akwụkwọ Nsọ nke gbasara ohia ahụ" is clearer and more idiomatic than "n’akụkụ Akwụkwọ Nsọ banyere ọhịa nta ahụ." "A na-akpọlite ndị nwụrụ anwụ" is a natural passive Igbo expression for resurrection and avoids the cumbersome periphrasis "a na-eme ka ... bilie."'
  terminology: '"Onyenwe anyị" appropriately renders κύριον in the project register. The repeated "Chineke" is retained to reflect the Greek''s emphatic repetition. "ohia" is used for the bush; the footnote specifies the burning bush of Exodus 3.'
  issues:
  - severity: medium
    issue: '"ọhịa nta" mistranslates βάτος.'
    rationale: The expression denotes a bush, specifically the burning bush in the Exodus allusion; "ọhịa nta" ordinarily denotes a small forest or woodland, not a bush.
  - severity: medium
    issue: Footnotes are attached to unrelated words and combine distinct notes.
    rationale: The alternative for ἐπὶ τῆς βάτου belongs after the reference to the bush, while the Septuagint/divine-name note belongs after "Onyenwe anyị." The draft's note a instead discusses ἐγείρονται, and note b combines two separate audit-trail notes.
  - severity: low
    issue: The passive resurrection expression is unnecessarily heavy.
    rationale: '"A na-akpọlite ndị nwụrụ anwụ" preserves the passive sense of ἐγείρονται in standard, natural Igbo.'
  revised_text: Ma Mosis n’onwe ya mekwara ka a mara na a na-akpọlite ndị nwụrụ anwụ, n’akụkụ Akwụkwọ Nsọ nke gbasara ohia ahụ[a], ebe ọ kpọrọ Onyenwe anyị[b] Chineke Abraham, Chineke Aịzik, na Chineke Jekọb.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ebe ohia ahụ dị.” Ahịrịokwu Grik ahụ nwere ike izo aka ma n’ebe ihe ahụ mere ma, dịka akpaalaokwu, n’akụkụ Akwụkwọ Nsọ gbasara ohia na-ere ọkụ (Ọpụpụ 3).
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ bụ “Onyenwe anyị”; nke a na-egosipụta ụzọ Septuagint si asụgharịkarị aha Chineke n’Ọpụpụ 3.
    reason: cross_reference
  revision_rationale: The revision corrects the referent of βάτος, clarifies that Jesus refers to the scriptural section about the bush, and uses an idiomatic passive expression for resurrection. It separates the two English audit-trail notes and moves each anchor to its proper referent, without adding theological interpretation.
