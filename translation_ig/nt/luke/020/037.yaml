id: LUK.20.37
reference: Luke 20:37
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: ig
  text: Ma Mosis n’onwe ya mekwara ka a mara na a na-akpọlite ndị nwụrụ anwụ, n’akụkụ Akwụkwọ Nsọ nke gbasara ohia ahụ[a], ebe ọ kpọrọ Onyenwe anyị[b] Chineke Abraham, Chineke Aịzik, na Chineke Jekọb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ebe ohia ahụ dị.” Ahịrịokwu Grik ahụ nwere ike izo aka ma n’ebe ihe ahụ mere ma, dịka akpaalaokwu, n’akụkụ Akwụkwọ Nsọ gbasara ohia na-ere ọkụ (Ọpụpụ 3).
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ bụ “Onyenwe anyị”; nke a na-egosipụta ụzọ Septuagint si asụgharịkarị aha Chineke n’Ọpụpụ 3.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: a na-eme ka ... bilie
  rationale: Nke a na-egosipụta ụdị okwu nnara dị na Grik ma na-ahapụ onye na-eme ihe ahụ n’ebughị ụzọ kpọọ ya aha; n’ọnọdụ a, ọ bụ okwu banyere mbilite n’ọnwụ.
- source_word: οἱ νεκροὶ
  choice: ndị nwụrụ anwụ
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ìgwè ndị nwụrụ anwụ.
- source_word: ἐμήνυσεν
  choice: mere ka a mara
  rationale: Ọ na-ebute echiche nke ime ka ihe pụta ìhè ma ọ bụ ime ka a mata ya, n’ebughị ibu karịa ihe okwu Grik kwuru.
- source_word: ἐπὶ τῆς βάτου
  choice: n’akụkụ Akwụkwọ Nsọ banyere ọhịa nta ahụ
  rationale: N’ebe a, ahịrịokwu ahụ nwere ike izo aka n’akụkọ Akwụkwọ Nsọ banyere ọhịa nta ahụ, ọ bụghị naanị n’ebe ihe ahụ mere; ihe edeturu ala na-echekwa ụzọ nghọta nke ọzọ.
- source_word: ὡς λέγει
  choice: ebe ọ kpọrọ
  rationale: Nke a dabara n’usoro okwu sochirinụ, ebe Mosis kpọrọ Onyenwe anyị Chineke Abraham, Aịzik, na Jekọb.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị maka κύριος mgbe ọ bụ aha nsọpụrụ Chineke n’amaokwu Akwụkwọ Nsọ.
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: Chineke Abraham, na Chineke Aịzik, na Chineke Jekọb
  rationale: E debere nkwughachi ‘Chineke’ ugboro atọ iji chekwaa nkwusi ike na ụda okwu Grik.
theological_decisions:
- issue: Okwu mbilite n’ọnwụ n’arụmụka Jizọs
  choice: a na-eme ka ndị nwụrụ anwụ bilie
  alternative: ndị nwụrụ anwụ na-ebili
  rationale: Nhọrọ ahụ na-echekwa ụdị nnara nke ἐγείρονται na echiche nke ọrụ onye ọzọ, n’etinyeghị nkọwa ozizi karịrị ederede.
- issue: Nsụgharị κύριος n’amaokwu gbasara Chineke Izrel
  choice: Onyenwe anyị
  alternative: ONYENWE ANYỊ
  rationale: Ederede Grik kwuru κύριον, ya mere e ji aha nsọpụrụ ‘Onyenwe anyị’; ihe edeturu ala kọwara njikọ ya na omenala Septuagint banyere aha Chineke.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu dị na ya ma dị mfe nghọta. E chekwara nkwughachi ‘Chineke’ nke dị na Grik. A họọrọ ‘ọhịa nta’ maka βάτος, ebe ihe edeturu ala na-echekwa nghọta abụọ nke ἐπὶ τῆς βάτου.
