revisions:
- from: N’ihi na ha apụghịkwa ịnwụ anwụ, n’ihi na ha na ndị mmụọ ozi hà[a], ha bụkwa ụmụ Chineke, ebe ha bụ ụmụ mbilite n’ọnwụ[b].
  to: N’ihi na ha enweghịzi ike ịnwụ, n’ihi na ha na ndị mmụọ ozi hà; ha bụkwa ụmụ Chineke, ebe ha bụ ụmụ nke mbilite n’ọnwụ[b].
  rationale: The revision replaces the unnatural reduplicated expression for dying with an idiomatic rendering of inability to die any longer, clarifies the resurrection genitive, and refines the gender-form footnote. The first footnote is retained as a legitimate lexical alternative for ἰσάγγελοι, though its marker is not needed in the revised main text.
