  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: ig
  text: N’ihi na ha enweghịzi ike ịnwụ, n’ihi na ha na ndị mmụọ ozi hà; ha bụkwa ụmụ Chineke, ebe ha bụ ụmụ nke mbilite n’ọnwụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'N’asụsụ Grik, e ji okwu nwoke ọtụtụ “ụmụ” mee ihe ugboro abụọ: “ụmụ Chineke” na “ụmụ nke mbilite n’ọnwụ.” N’ebe a, ụdị okwu a na-egosi ọnọdụ na njirimara; ọ pụtaghị na ọ bụ naanị ụmụ nwoke ka a na-ekwu maka ha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: ha apụghịkwa ịnwụ anwụ
  rationale: Nke a na-egosipụta enweghị ike ịnwụ ọzọ n’echiche nke na ọnwụ agaghịzi enwe ike n’ahụ ha; ‘-kwa’ na-enye ἔτι echiche nke ‘ọzọ/agaghịzi.’
- source_word: ἰσάγγελοι
  choice: ha na ndị mmụọ ozi hà
  rationale: Okwu a pụtara ịbụ ndị ha na ndị mmụọ ozi hà ma ọ bụ ịdị ka ha. Nsụgharị a na-echekwa echiche nke nhatanha n’ọnọdụ ahụ n’emeghị ka ha bụrụ ndị mmụọ ozi.
- source_word: υἱοί ... θεοῦ
  choice: ụmụ Chineke
  rationale: N’Igbo, ‘ụmụ’ bụ okwu nkịtị maka ndị sitere n’ezinụlọ ma ọ bụ ndị nwere ọnọdụ mmekọrịta a; ọ naghị ekewa nwoke na nwaanyị. Ọ na-eburu ihe atụ nke mmekọrịta na ọnọdụ dị n’okwu Grik ahụ.
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: ebe ha bụ ụmụ mbilite n’ọnwụ
  rationale: ‘Ebe ha bụ’ na-echekwa ọdịdị participle ahụ na-enweghị ikpebi ya naanị dịka ihe kpatara ya, ebe ‘ụmụ mbilite n’ọnwụ’ na-edobe ihe atụ na nkwughachi nke υἱοί.
- source_word: γάρ ... γάρ
  choice: N’ihi na ... n’ihi na
  rationale: 'E debere njikọ nkọwa ugboro abụọ ahụ: nke mbụ jikọtara amaokwu a na okwu bu ya ụzọ, nke abụọ kọwakwara ihe mere ọnwụ agaghịzi ekwe ha omume.'
theological_decisions:
- issue: Asụsụ ịbụ nwa n’ọnọdụ ndụ mbilite n’ọnwụ
  choice: Jiri ‘ụmụ Chineke’ na ‘ụmụ mbilite n’ọnwụ’ n’ahịrịokwu bụ isi
  alternative: ndị nke Chineke; ndị e mere ka ha si n’ọnwụ bilie
  rationale: Nke a na-echekwa ihe atụ nke υἱοί ugboro abụọ na njikọ dị n’etiti ọnọdụ ha n’ihu Chineke na mbilite n’ọnwụ. N’Igbo, ‘ụmụ’ gụnyere nwoke na nwaanyị, ya mere ọ naghị eme ka nkwa ahụ bụrụ naanị nke ụmụ nwoke.
translation_notes:
  register: E ji Standard Igbo dị ugwu ma dị mfe nghọta mee ya. A hapụrụ ihe atụ ‘ụmụ Chineke’ na ‘ụmụ mbilite n’ọnwụ’ dịka isi mmalite si dị, ma jiri nkọwa ala peeji kọwaa ụdị nwoke nke Grik. ‘Ha na ndị mmụọ ozi hà’ na-egosi ntụnyere, ọ bụghị na ndị ahụ aghọọla ndị mmụọ ozi.
