  terminology: «Ndị Sadusii» and «mbilite n’ọnwụ» are established, natural biblical Igbo terms. «Ndị na-agọnahụ na e nwere mbilite n’ọnwụ» faithfully expresses the Sadducees’ stated position without importing further doctrinal claims.
