  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: ig
  text: Mgbe ahụ, ụfọdụ ndị Sadusii, bụ ndị na-agọnahụ na e nwere mbilite n’ọnwụ[a], bịakwutere ya ma jụọ ya ajụjụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ekwu na mbilite n’ọnwụ adịghị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσελθόντες
  choice: bịakwutere ya
  rationale: Nke a na-egosi na ha bịarutere Jizọs nso tupu ha ajụọ ya ajụjụ; ọ bụkwa okwu Igbo dị mfe ma bụrụ nke e ji eme ihe ugbu a.
- source_word: δέ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-akwalite akụkọ gaa n’ihu karịa igosi nnukwu ọdịiche.
- source_word: τινες τῶν Σαδδουκαίων
  choice: ụfọdụ ndị Sadusii
  rationale: 'Nke a na-echekwa echiche partitive ahụ: ọ bụghị ndị Sadusii niile, kama ọ bụ ụfọdụ n’ime ha.'
- source_word: οἱ ἀντιλέγοντες
  choice: ndị na-agọnahụ
  rationale: N’ọnọdụ a, okwu ahụ na-akọwa nkwenkwe ha na-ajụ ma mbilite n’ọnwụ ọ̀ dị; ‘na-agọnahụ’ na-egosi ike okwu ahụ karịa naanị ‘na-ekwu megide.’
- source_word: ἀνάστασιν
  choice: mbilite n’ọnwụ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị akọwa ịbilite site n’ọnwụ.
- source_word: μὴ εἶναι
  choice: na e nwere ... n’ọnwụ
  rationale: Tinyere ‘na-agọnahụ,’ usoro a na-egosipụta nke ọma isi ihe ha na-agọnahụ, ya bụ, na mbilite n’ọnwụ dị.
- source_word: ἐπηρώτησαν
  choice: jụọ ... ajụjụ
  rationale: Ọ na-egosi na ha jụrụ ya ajụjụ, ma ihe ndị na-esochi ga-eme ka ụdị ajụjụ ịma aka ahụ pụta ìhè n’enweghị ịgbakwunye ya n’amaokwu a.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs, dị ka ọnọdụ akụkọ ahụ si gosi.
theological_decisions:
- issue: Otú e si kọwaa echiche ndị Sadusii banyere mbilite n’ọnwụ
  choice: ndị na-agọnahụ na e nwere mbilite n’ọnwụ
  alternative: ndị na-ekwu na mbilite n’ọnwụ adịghị
  rationale: Nhọrọ a na-echekwa nkwupụta ozizi dị n’asụsụ Grik n’enweghị ịgbakwunye nkọwa banyere ụdị mbilite n’ọnwụ ma ọ bụ banyere ozizi ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. ‘Bú’ na-ejikọta nkọwa ndị Sadusii n’ụzọ doro anya, ebe ‘bịakwutere ya jụọ ya ajụjụ’ na-eme ka usoro omume ahụ bụrụ nke e ji asụ Igbo n’enweghị ịla n’iyi n’ihe Grik kwuru.
