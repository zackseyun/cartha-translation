  naturalness: “Ma ebe ọ ghọtara” is understandable but less idiomatic in this brief narrative transition. “Ma, mgbe ọ ghọtara aghụghọ ha, ọ sịrị ha,” is fluent Standard Igbo and retains the source structure.
  terminology: “Aghụghọ” is an appropriate, current Standard Igbo rendering for πανουργία. The supplied footnote alternatives include awkward expressions; they should be recast in idiomatic Igbo while preserving the negative sense of clever, unscrupulous scheming.
  issues:
