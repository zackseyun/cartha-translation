  yaml_path: translation/nt/luke/020/023.yaml
  text: But perceiving their cunning[a], he said to them,
translation:
  language: ig
  text: Ma, mgbe ọ ghọtara aghụghọ ha[a], ọ sịrị ha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “aghụghọ e ji akọ eme,” “ụzọ aghụghọ,” ma ọ bụ “nkwuhie.” Okwu Grik a na-ekwu maka iji akọ n’ụzọ na-adịghị mma akpa nkata.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσας
  choice: ebe ọ ghọtara
  rationale: Nkebiokwu a na-egosi na Jizọs matara ma ghọta ihe ha ji aghụghọ na-eme tupu ọ gwa ha okwu; ọ na-eburu echiche nke ịmata nke ọma n’etinyeghị ihe karịrị ihe Grik kwuru.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’akụkọ ahụ; “Ma” dabara n’ebe a ka Jizọs na-azaghachi atụmatụ ọjọọ ha.
- source_word: αὐτῶν
  choice: ha
  rationale: N’Igbo, itinye “ha” n’azụ aha “aghụghọ” bụ ụzọ ebumpụta ụwa isi gosipụta ihe bụ nke ha.
- source_word: πανουργίαν
  choice: aghụghọ
  rationale: “Aghụghọ” na-egosi amamihe ọjọọ e ji akpa nkata ma ọ bụ eduhie mmadụ; ọ bụ okwu doro ndị na-agụ Igbo nke oge a anya.
- source_word: εἶπεν
  choice: ọ sịrị
  rationale: Nke a bụ nsụgharị Igbo dị mfe ma bụrụkwa nke a na-ejikarị akọwa okwu mmadụ kwuru.
- source_word: πρὸς αὐτούς
  choice: ha
  rationale: Mgbe e jikọtara ya na “ọ sịrị,” “ha” na-egosi ndị a gwara okwu n’ụzọ Igbo si ekwu ya nke ọma.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro participle nke Grik site na “ebe ọ ghọtara,” ma jiri “aghụghọ” gosipụta echiche ọjọọ dị na πανουργία.
