id: LUK.20.10
reference: Luke 20:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: ig
  text: Mgbe oge kwesịrị ekwesị bịara, o zigara ndị na-akọ ubi vaịn ahụ otu ohu[a], ka ha nye ya ụfọdụ n’ime mkpụrụ nke ubi vaịn ahụ. Ma ndị na-akọ ubi vaịn ahụ tiri ya ihe, wee zipụ ya ka ọ laa aka efu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a pụkwara ịpụta “onye na-eje ozi,” ma “ohu” na-egosipụta nke ọma na ọ nọ n’okpuru ikike onye nwe ya.
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “efu” ma ọ bụ “na-enweghị ihe”; ya bụ, ha enyeghị ya ihe ọ bụla sitere ná mkpụrụ nke ubi vaịn ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: mgbe oge kwesịrị ekwesị ruru
  rationale: Nke a na-egosi oge dabara adaba ma ọ bụ oge a kara aka, n’etinyeghị kpọmkwem na ọ bụ oge owuwe ihe ubi.
- source_word: γεωργούς
  choice: ndị na-akọ ubi vaịn
  rationale: Nhọrọ a na-edobe ọrụ ugbo ha n’ubi vaịn n’ebughị ụzọ kọwaa ọnọdụ iwu ha dị ka ndị gbazitere ubi.
- source_word: δοῦλον
  choice: ohu
  rationale: Okwu Grik a nwere ike izo aka n’ohu ma ọ bụ onye na-eje ozi; “ohu” na-egosipụta nke ọma ọnọdụ onye nọ n’okpuru onye nwe ya n’akụkọ a.
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: ka ha nye ya
  rationale: Nke a na-egosi nzube e ji ziga ohu ahụ n’ụzọ Igbo dị mfe ma kwekọọ n’usoro Grik.
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: ụfọdụ n’ime mkpụrụ ubi vaịn ahụ
  rationale: ἀπό ya na genitive na-egosi òkè sitere ná mkpụrụ ubi ahụ, n’akọwaghị ya dị ka òkè iwu a kapịrị ọnụ.
- source_word: ἐξαπέστειλαν
  choice: zipụ ya ka ọ laa
  rationale: Ngwaa a karịrị nanị iziga mmadụ; ọ na-egosi ịchụpụ ma ọ bụ izipụ ya pụọ.
- source_word: δείραντες
  choice: tiri ya ihe
  rationale: Nke a na-egosipụta iti mmadụ ihe n’enweghị ịkọwa ụdị ntaramahụhụ pụrụ iche nke okwu Grik na-ekwughị.
- source_word: κενόν
  choice: aka efu
  rationale: Ọ bụ ụzọ Igbo ebumpụta ụwa si ekwu na ọ laghachiri n’enwetaghị ihe ọ bụla.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “ubi vaịn” iji doo ụdị ubi ahụ anya, ebe “aka efu” na-enye echiche κενόν n’ụzọ Igbo na-asụkarị.
