  to: Mgbe oge kwesịrị ekwesị bịara, o zigara ndị na-akọ ubi vaịn ahụ otu ohu[a], ka ha nye ya ụfọdụ n’ime mkpụrụ nke ubi vaịn ahụ. Ma ndị na-akọ ubi vaịn ahụ tiri ya ihe, wee zipụ ya ka ọ laa aka efu[b].
