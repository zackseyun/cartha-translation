    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “efu” ma ọ bụ “na-enweghị ihe”; ya bụ, ha enyeghị ya ihe ọ bụla sitere ná mkpụrụ nke ubi vaịn ahụ.
    reason: lexical_alternative
