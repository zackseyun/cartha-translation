  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: ig
  text: Jizọs wee sị ha, “Mụ onwe m agaghịkwa agwa unu ikike dị aṅaa ka m ji eme ihe ndị a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Jizọs wee sị ha
  rationale: “Wee” na-ejikọta azịza Jizọs na ihe ndị bu ya ụzọ n’ụzọ akụkọ Igbo si aga nke ọma, ebe “sị ha” na-egosipụta εἶπεν αὐτοῖς.
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Mụ onwe m agaghịkwa agwa unu
  rationale: “Agaghịkwa” na-egosipụta na Jizọs jụrụ ịgwa ha, dịka nzaghachi nye ọjụjụ ha n’amaokwu bu ụzọ; “mụ onwe m” na-echekwa nkwusi ike dị na ἐγώ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ikike dị aṅaa m ji
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa ihe a na-ekwu kwa ụbọchị iji gosi ikike ma ọ bụ ihe ndabere mmadụ ji eme ihe, n’enweghị ime ka ọ bụrụ nanị ike nkịtị.
- source_word: ἐξουσίᾳ
  choice: ikike
  rationale: “Ikike” na-egosi ikike ziri ezi ma ọ bụ ikike e nyere mmadụ, nke dabara n’ebe a karịa okwu ga-egosi naanị ume ma ọ bụ ike anụ ahụ.
- source_word: ταῦτα ποιῶ
  choice: m ji eme ihe ndị a
  rationale: “Ihe ndị a” na-echekwa ọtụtụ ihe dị na ταῦτα, “eme” na-egosikwa omume dị ugbu a n’ụzọ Igbo eke.
theological_decisions:
- issue: Ọjụjụ Jizọs jụrụ ịza ndị ndú ahụ
  choice: E depụtara ya dịka ọjụjụ kwụ ọtọ ịgwa ha ikike o ji eme ihe ndị a.
  alternative: Ịgbakwunye na Jizọs na-ezere ajụjụ ahụ, ma ọ bụ na ọ na-ekpe ha ikpe n’ihi ekweghị ekwe ha.
  rationale: Amaokwu ahụ n’onwe ya ekwughị ihe kpatara ọjụjụ ahụ; ya mere, nsụgharị ahụ na-ahapụ esemokwu na ike okwu ahụ dịka ha dị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma nwee ugwu, dee amaokwu ahụ. Nhazi “Mụ onwe m agaghịkwa” na-echekwa nkwusi ike na njikọ nzaghachi ahụ n’enweghị ịgbakwunye nkọwa ozizi.
