revisions:
- from: Jizọs wee sị ha, “Mụ onwe m agaghịkwa agwa unu ikike dị aṅaa[a] m ji eme ihe ndị a.”
  to: Jizọs wee sị ha, “Mụ onwe m agaghịkwa agwa unu ikike dị aṅaa ka m ji eme ihe ndị a.”
  rationale: The revision retains the draft’s faithful rendering of the dialogue while supplying the standard Igbo focus particle in the question. The footnote is revised to offer ‘n’ikike dị aṅaa’ (‘with/in what authority’) as a genuine alternative to the main instrumental expression ‘ikike dị aṅaa ka m ji.’
  reviewer_model: gpt-5.6-terra
