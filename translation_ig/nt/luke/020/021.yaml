id: LUK.20.21
reference: Luke 20:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: ig
  text: Ha jụrụ ya ajụjụ sị, “Onye Ozizi, anyị maara na ị na-ekwu okwu ma na-akụzi ihe n'ụzọ ziri ezi, na ị naghị ele mmadụ anya n'ihu[a], kama ị na-akụzi ụzọ Chineke n'eziokwu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, okwu Grik a bụ “ị naghị anabata ihu mmadụ”; ọ bụ akpaalaokwu pụtara na mmadụ anaghị akpa ókè ma ọ bụ na ọkwa na ọdịdị ndị mmadụ anaghị emetụta ya.
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịhazi ya: “kama n''eziokwu, ị na-akụzi ụzọ Chineke.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: Ha jụrụ ya ajụjụ
  rationale: Nkebi a na-egosi na ha jụrụ ya ajụjụ; ọ dabara n'ọnọdụ ebe ajụjụ ahụ bụ nke e ji anwale ya, ma ọ naghị etinye iro karịrị ihe okwu Grik kwuru.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Nke a bụ okwu nkwanye ùgwù a na-akpọ onye na-akụzi ihe, ma ọ bụkwa asụsụ Igbo doro anya nke oge a.
- source_word: οἴδαμεν
  choice: anyị maara
  rationale: Ọ na-egosipụta nkwupụta ha na ha ji n'aka, n'agbanyeghị na ọnọdụ akụkọ ahụ na-egosi na okwu ha bụ otuto aghụghọ.
- source_word: ὀρθῶς
  choice: n'ụzọ ziri ezi
  rationale: Ọ na-eburu echiche nke ikwu na ịkụzi ihe n'ụzọ ziri ezi, ma na-agụkwa nke ọma n'Igbo.
- source_word: λέγεις καὶ διδάσκεις
  choice: ị na-ekwu okwu ma na-akụzi ihe
  rationale: A hapụrụ ngwaa abụọ ahụ iche dịka ha dị na Grik, iji chekwaa njupụta nke okwu otuto ahụ.
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: ị naghị ele mmadụ anya n'ihu
  rationale: Nke a bụ akpaalaokwu Igbo a na-ahụkarị maka enweghị ịkpa ókè ma ọ bụ ihu mmadụ n'anya; ọ na-enye echiche akpaalaokwu Grik nke ọma.
- source_word: ἐπ’ ἀληθείας
  choice: n'eziokwu
  rationale: Ọ na-akọwa otú Jizọs si akụzi—n'ụzọ kwekọrọ n'eziokwu. E debere ya nso na ngwaa 'na-akụzi' dịka n'usoro echiche Grik.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: ụzọ Chineke
  rationale: Ọ na-echekwa ihe oyiyi nke 'ụzọ' na njikọ ya na Chineke, nke nwere ike ịgụnye uche Chineke na ụzọ ndụ ọ chọrọ.
- source_word: ἀλλ’
  choice: kama
  rationale: Ọ na-egosi ntụgharị doro anya site n'ịghara ile mmadụ anya n'ihu gaa n'ịkụzi ihe n'eziokwu.
theological_decisions:
- issue: Akpaalaokwu banyere enweghị ịkpa ókè
  choice: ị naghị ele mmadụ anya n'ihu
  alternative: ị naghị anabata ihu mmadụ; ọdịdị mmadụ adịghị emetụta gị
  rationale: Ịsụgharị ihe akpaalaokwu ahụ pụtara na-eme ka isi okwu banyere Jizọs na-adịghị ekpe mmadụ ikpe dịka ọkwa ma ọ bụ ọdịdị ya si dị doo anya, n'etinyeghị nkọwa ozizi pụrụ iche.
- issue: Njikọ nke ἐπ’ ἀληθείας
  choice: n'eziokwu dị ka nkọwa nke ụzọ o si akụzi
  alternative: ị na-akụzi ụzọ eziokwu nke Chineke
  rationale: Usoro Grik kwadoro nghọta na okwu ahụ na-akọwa etu ọ si akụzi. A naghị agbanwe ya ka 'eziokwu' bụrụ nkọwa nke 'ụzọ,' ma ndetu ala na-echekwa ụzọ ọzọ e si hazie okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. “Onye Ozizi” dabara n'okwu nkwanye ùgwù ahụ; “ele mmadụ anya n'ihu” bụ akpaalaokwu Igbo doro anya nke na-ebufe echiche Grik n'enweghị asụsụ ochie ma ọ bụ nke otu ụka pụrụ iche.
