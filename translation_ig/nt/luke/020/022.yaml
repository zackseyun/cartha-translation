revisions:
- from: O kwere n’iwu ka anyị tụọrọ Siza ụtụ isi[a], ka ọ bụ na o kweghị?
  to: Ọ̀ bụ ihe iwu kwere ka anyị kwụọ Siza ụtụ isi[a], ka ọ bụghị?
  rationale: The revision supplies an idiomatic Igbo construction for the Greek question of permissibility, retains the source’s ambiguity about which law is at issue, uses the standard expression for paying taxes, and renders the final disjunction without adding meaning. The footnote is lightly smoothed while preserving its lexical purpose.
