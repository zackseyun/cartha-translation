  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: ig
  text: Ọ̀ bụ ihe iwu kwere ka anyị kwụọ Siza ụtụ isi[a], ka ọ bụghị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụtụ” ma ọ bụ “ụtụ ọchịchị.” Okwu Grik a na-ekwu maka ụtụ a na-akwụ ọchịchị na-achị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: O kwere n’iwu
  rationale: Nke a na-egosi ihe iwu kwadoro ma ọ bụ ihe e kwere ime, ọ bụghị nanị ihe mmadụ nwere ike ime.
- source_word: ἡμᾶς
  choice: ka anyị
  rationale: Ọ na-egosipụta ‘anyị’ dị n’ahịrịokwu Grik n’etinyeghị ‘ndị Juu,’ nke na-adịghị na mkpụrụokwu ahụ.
- source_word: Καίσαρι
  choice: Siza
  rationale: Aha-ọrụ a na-echekwa kpọmkwem ọnọdụ ọchịchị Rom nke ajụjụ ahụ karịa ịsị naanị ‘eze ukwu.’
- source_word: φόρον
  choice: ụtụ isi
  rationale: Ọ bụ ụtụ a na-akwụ onye ọchịchị; ‘ụtụ isi’ na-egosipụta ma ịkwụ ụgwọ ahụ ma nrubeisi ndọrọ ndọrọ ọchịchị dị n’okwu ahụ.
- source_word: δοῦναι
  choice: tụọrọ
  rationale: N’Igbo, ‘ịtụ ụtụ isi’ bụ ụzọ ebumpụta ụwa isi kwuo inye ma ọ bụ ịkwụ ụtụ.
- source_word: ἢ οὔ
  choice: ka ọ bụ na o kweghị
  rationale: Nke a bụ ajụjụ Igbo doro anya nke na-echekwa ntụnyere ‘ma ọ bụ na ọ bụghị.’
theological_decisions:
- issue: Ụdị iwu ajụjụ a na-ekwu maka ya
  choice: E kwuru naanị ‘O kwere n’iwu’ n’akọwaghị ma ọ bụ iwu Rom ka ọ bụ iwu Chineke.
  alternative: O kwere n’iwu Rom / O kwere n’iwu Chineke
  rationale: Asụsụ Grik akọwaghị ụdị iwu ahụ; ịhapụ ya otú ahụ na-echekwa esemokwu okpukpe na ndọrọ ndọrọ ọchịchị dị n’ajụjụ ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Siza’ na-echekwa aha-ọrụ akụkọ ihe mere eme, ebe ‘ụtụ isi’ na-eme ka ụdị ụgwọ ahụ doo anya.
