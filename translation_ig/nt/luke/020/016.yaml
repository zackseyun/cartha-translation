revisions:
- from: Ọ ga-abịa bibie ndị ọrụ ubi a na-agbazinye ubi ahụ[a], nyekwa ndị ọzọ ubi vaịn ahụ.” Ma mgbe ha nụrụ nke a, ha sịrị[b], “Ka ọ ghara ime ma ọlị!”
  to: Ọ ga-abịa bibie ndị ọrụ ubi ndị a, ma nye ndị ọzọ ubi vaịn ahụ.” Ma mgbe ha nụrụ nke a, ha sịrị, “Ka ọ ghara ime!”
  rationale: The primary rendering of γεωργούς has been changed to the idiomatic, lexically broad “ndị ọrụ ubi ndị a.” The footnote preserves tenant-related alternatives appropriate to the parable’s context without making that contextual inference obligatory in the main text. The coordinated verbs have been smoothed, and the closing exclamation is kept as a direct optative rejection. Footnote anchors are omitted from the revised text because neither note is needed to understand the main translation; the supplied footnote set is retained for the project record.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:34:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future actions, the demonstrative reference, the transfer of the vineyard to unspecified others, and the force of Μὴ γένοιτο. However, “ndị ọrụ ubi a na-agbazinye ubi ahụ” is not a clear or idiomatic way to identify γεωργούς; its wording can suggest that the workers themselves are being leased or that the field is regularly leased, rather than simply identifying the cultivators in the parable.
  naturalness: The revised wording uses straightforward Standard Igbo. “Ndị ọrụ ubi ndị a” is natural and sufficiently broad for γεωργούς, while the footnote may note the tenant sense supplied by the parable’s setting. “Ma nye ndị ọzọ...” more directly and smoothly represents the coordinated future verbs.
  terminology: “Ubi vaịn” appropriately represents ἀμπελών. “Ndị ọrụ ubi” is a sound primary rendering for γεωργοί without over-specifying a legal tenancy arrangement in the verse itself. “Ka ọ ghara ime!” retains the optative, wish-like repudiation of Μὴ γένοιτο.
  issues:
  - severity: medium
    issue: Unidiomatic and potentially misleading rendering of γεωργούς
    rationale: “Ndị ọrụ ubi a na-agbazinye ubi ahụ” is structurally unclear in Igbo and does not naturally mean ‘these tenant farmers/cultivators.’ The Greek denotes agricultural cultivators; tenancy is contextual rather than required by the word alone.
  - severity: low
    issue: Awkward coordination in the verbal sequence
    rationale: “bibie ... nyekwa ...” is understandable, but “bibie ... ma nye ...” is clearer and more natural for the two coordinated future actions.
  revised_text: Ọ ga-abịa bibie ndị ọrụ ubi ndị a, ma nye ndị ọzọ ubi vaịn ahụ.” Ma mgbe ha nụrụ nke a, ha sịrị, “Ka ọ ghara ime!”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ndị ọrụ ugbo,’ ‘ndị na-akọ ubi,’ ma ọ bụ, n’ọnọdụ ilu a, ‘ndị ọrụ ubi gbazitere ubi ahụ.’ Okwu Grik ahụ na-ezo aka ná ndị na-arụ ala ma ọ bụ ubi onye ọzọ.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya ‘Mba, ọ gaghị ekwe omume!’ ma ọ bụ ‘O nweghị mgbe ọ ga-adị otu ahụ!’ Okwu Grik a bụ ịjụ ihe n’ike; n’ụzọ nkịtị, ‘Ka ọ ghara ime.’
    reason: alternative_reading
  revision_rationale: The primary rendering of γεωργούς has been changed to the idiomatic, lexically broad “ndị ọrụ ubi ndị a.” The footnote preserves tenant-related alternatives appropriate to the parable’s context without making that contextual inference obligatory in the main text. The coordinated verbs have been smoothed, and the closing exclamation is kept as a direct optative rejection. Footnote anchors are omitted from the revised text because neither note is needed to understand the main translation; the supplied footnote set is retained for the project record.
