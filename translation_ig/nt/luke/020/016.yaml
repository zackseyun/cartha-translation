id: LUK.20.16
reference: Luke 20:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: ig
  text: Ọ ga-abịa bibie ndị ọrụ ubi ndị a, ma nye ndị ọzọ ubi vaịn ahụ.” Ma mgbe ha nụrụ nke a, ha sịrị, “Ka ọ ghara ime!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσεται
  choice: Ọ ga-abịa
  rationale: Ọ na-asụgharị ọdịnihu nke ἔρχομαι n'ụzọ dị mfe, n’etinyeghị echiche ọzọ dịka ‘lọghachi.’
- source_word: ἀπολέσει
  choice: bibie
  rationale: ‘Bibie’ na-echekwa ịdị arọ nke ikpe ahụ ma hapụ obosara okwu ἀπόλλυμι, nke nwere ike ịpụta igbu ma ọ bụ iweta mbibi.
- source_word: γεωργοὺς
  choice: ndị ọrụ ubi a na-agbazinye ubi ahụ
  rationale: N’akụkọ a, okwu ahụ na-ezo aka n’ụdị ndị na-arụ ubi onye ọzọ ha gbazinyere, ọ bụghị naanị ndị ọrụ ugbo n’ozuzu.
- source_word: τούτους
  choice: a
  rationale: ‘A’ na-echekwa nrụtụ aka nso nke τούτους nye ndị ahụ a na-ekwu maka ha kpọmkwem.
- source_word: δώσει
  choice: nyekwa
  rationale: Nke a na-echekwa ịdị mfe nke δίδωμι, ‘inye,’ ma jikọta ya n'ụzọ Igbo si aga nke ọma na ahịrịokwu bu ya ụzọ.
- source_word: τὸν ἀμπελῶνα
  choice: ubi vaịn ahụ
  rationale: Nke a bụ okwu doro anya maka ubi a kụrụ osisi vaịn, na-echekwakwa ihe oyiyi ilu ahụ.
- source_word: ἄλλοις
  choice: ndị ọzọ
  rationale: Ọ na-ahapụ ndị a ga-enye ubi ahụ n’amaghị aha, dịka Grik si mee.
- source_word: ἀκούσαντες
  choice: mgbe ha nụrụ nke a
  rationale: Ọ na-egosipụta mmekọrịta oge nke aorist participle n’Igbo eke.
- source_word: Μὴ γένοιτο
  choice: Ka ọ ghara ime ma ọlị!
  rationale: Nke a na-egosipụta ọchịchọ siri ike ka ihe ahụ ghara ime, tinyere ụjọ na ịjụ okwu ahụ kpamkpam.
theological_decisions:
- issue: Ike na ọdịdị nzaghachi Μὴ γένοιτο
  choice: Ka ọ ghara ime ma ọlị!
  alternative: Mba, ọ gaghị ekwe omume!; O nweghị mgbe ọ ga-adị otu ahụ!
  rationale: Nhọrọ a na-echekwa ụdị ọchịchọ nke optative Grik na mmetụta nke ịjụ ikpe ahụ n’ike, na-enweghị ịkọwa ihe ndị na-ege ntị bu n’obi karịa ihe ederede kwuru.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ubi vaịn’ na-echekwa ihe oyiyi ahụ; ‘ndị ọrụ ubi a na-agbazinye ubi ahụ’ na-eme ka ọnọdụ ndị ọrụ ahụ doo anya n’enweghị ịgbakwunye nkọwa okpukpe.
