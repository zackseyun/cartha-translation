  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: ig
  text: Ma ọ bụrụ na anyị asị, ‘O sitere n’aka mmadụ,’ ndị mmadụ niile ga-atụ anyị nkume, n’ihi na ha kwenyesiri ike na Jọn bụ onye amụma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, infinitive dị ugbu a na-egosi na ịbụ Jọn onye amụma bụ ihe ndị mmadụ kwenyesiri ike banyere ya n’oge ahụ. N’Igbo, ‘bụ’ anaghị akọwapụta oge n’ụzọ doro anya.
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Ma ọ bụrụ na anyị asị
  rationale: Nke a na-egosipụta ọnọdụ nwere ike ime, ma na-echekwa ike δέ nke na-atụgharị uche gaa n’ụzọ ọzọ.
- source_word: Ἐξ ἀνθρώπων
  choice: O sitere n’aka mmadụ
  rationale: Nkebiokwu Grik a hapụrụ ihe ọ na-ekwu banyere ya n’ụzọ zoro ezo; itinye ‘O’ na-eme ka Igbo bụrụ nke eke, ebe ‘sitere n’aka mmadụ’ ka na-echekwa ajụjụ banyere ebe baptizim Jọn si.
- source_word: ὁ λαὸς ἅπας
  choice: ndị mmadụ niile
  rationale: Nke a na-egosipụta mkpokọta ndị ahụ na ike ἅπας nke pụtara ha niile.
- source_word: καταλιθάσει
  choice: ga-eji nkume tụgbuo anyị
  rationale: Nke a bụ ụzọ Igbo doro anya si kwuo iji nkume wakpo mmadụ; etinyeghị ‘ruo ọnwụ’ n’ihi na Grik ekwughị ya hoo haa n’ebe a.
- source_word: πεπεισμένος γάρ ἐστιν
  choice: n’ihi na ha kwenyesiri ike
  rationale: Ọ bụ ezie na Grik ji otu ọnụọgụ maka ìgwè ahụ, Igbo na-ezo aka n’ụzọ eke n’ebe ‘ndị mmadụ niile’ nọ site n’iji ‘ha’; ‘kwenyesiri ike’ na-egosipụta nkwenye siri ike.
- source_word: Ἰωάννην προφήτην εἶναι
  choice: na Jọn bụ onye amụma
  rationale: Infinitive εἶναι anaghị akọwa oge n’onwe ya. Igbo ‘bụ’ na-ahapụ oge ahụ ka ihe gbara ya gburugburu kpebie, si otú a na-echekwa mgbagwoju anya dị na Grik.
theological_decisions:
- issue: Oge nke nkwenye ndị mmadụ banyere Jọn dịka onye amụma
  choice: na Jọn bụ onye amụma
  alternative: na Jọn bụbu onye amụma
  rationale: Grik εἶναι enweghị akara oge n’onwe ya. ‘Bụ’ bụ okwu Igbo eke nke na-adịghị amanye echiche na ọnọdụ amụma Jọn akwụsịla, ma ọ bụ na ọ ka na-aga n’ihu; ya mere ọ na-echekwa nghọta abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ọdịdị okwu mkparịta ụka na ihe iyi egwu dị na isi mmalite ahụ.
