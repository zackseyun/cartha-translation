review_pass:
  verdict: revise
  source_fidelity: The conditional, the elliptical ‘from humans,’ the collective subject, and the people’s conviction are conveyed faithfully. However, ‘ga-eji nkume tụgbuo anyị’ more readily describes pelting/throwing stones at them than the specific verb καταλιθάσει, ‘will stone us.’ The present infinitive εἶναι presents John’s being a prophet as the content of the people’s current conviction; it does not support the footnote’s suggested past-form alternative ‘bụbu.’
  naturalness: The wording is clear, contemporary Standard Igbo, and the collective plural ‘ha’ naturally refers to ‘ndị mmadụ niile.’ ‘Ga-atụ anyị nkume’ is the more direct, idiomatic rendering of ‘will stone us.’
  terminology: ‘onye amụma’ is the standard and appropriate term for προφήτης. ‘Jọn’ is appropriate. The unmarked Igbo copula ‘bụ’ is suitable here because it does not impose an English-style past tense.
  issues:
  - severity: medium
    issue: The rendering of καταλιθάσει is imprecise.
    rationale: ‘ga-eji nkume tụgbuo anyị’ can mean to pelt us with stones. ‘ga-atụ anyị nkume’ directly expresses the act of stoning while, like the Greek, not adding ‘to death.’
  - severity: medium
    issue: The footnote offers ‘na Jọn bụbu onye amụma’ as an alternative and says the Greek does not indicate time on its own.
    rationale: 'The present infinitive εἶναι is not tense-neutral in the way stated: it characterizes John’s prophethood as the content of their present conviction. The Igbo main text is appropriately noncommittal about English-style tense, but ‘bụbu’ adds a former-status/past sense not warranted by the Greek.'
  revised_text: Ma ọ bụrụ na anyị asị, ‘O sitere n’aka mmadụ,’ ndị mmadụ niile ga-atụ anyị nkume, n’ihi na ha kwenyesiri ike na Jọn bụ onye amụma.[a]
  revised_footnotes:
