- from: Ma ọ bụrụ na anyị asị, ‘O sitere n’aka mmadụ,’ ndị mmadụ niile ga-eji nkume tụgbuo anyị, n’ihi na ha kwenyesiri ike na Jọn bụ onye amụma.[a]
  to: Ma ọ bụrụ na anyị asị, ‘O sitere n’aka mmadụ,’ ndị mmadụ niile ga-atụ anyị nkume, n’ihi na ha kwenyesiri ike na Jọn bụ onye amụma.[a]
  rationale: The revision uses the direct Standard Igbo expression for stoning and replaces the misleading tense-alternative note with a concise grammatical clarification. It preserves the source’s ellipsis and avoids forcing either a past-only or a continuing-status interpretation beyond what the narrative and Igbo wording express.
  reviewer_model: gpt-5.6-terra
