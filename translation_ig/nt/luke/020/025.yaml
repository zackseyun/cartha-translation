source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Ya mere, nyeghachinụ[a] Siza ihe ndị bụ nke Siza, nyeghachikwara Chineke ihe ndị bụ nke Chineke.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nyenụ Siza … nyekwa Chineke …” Ngwaa Grik ahụ nwere ike ịpụta inye, ịkwụ, ma ọ bụ iweghachi ihe ruuru onye.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Ma ọ sịrị ha
  rationale: “Ma” na-egosipụta ntụgharị dị nro nke δέ n'ọnọdụ mkparịta ụka a; “ọ sịrị ha” bụ ụzọ Igbo nkịtị si akọ λέγω πρὸς αὐτούς.
- source_word: Τοίνυν
  choice: Ya mere
  rationale: Na-egosipụta nkwubi okwu ma ọ bụ ihe na-esite n'okwu ndị gara aga, dịka τοίνυν si arụ ọrụ n'ebe a.
- source_word: ἀπόδοτε
  choice: nyenụ
  rationale: “Nyenụ” bụ okwu doro anya ma bụrụ nke e ji eme ihe n'Igbo taa; ọ nwere ike ịgụnye inye, ịkwụ, ma ọ bụ iweghachiri onye ihe ruuru ya. Ihe odide ala na-echekwa obosara nkọwa a.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: nyenụ Siza ihe ndị bụ nke Siza
  rationale: Na-echekwa nhazi na obosara nke okwu Grik, n'akọwaghị ya naanị dị ka ụtụ isi.
- source_word: Καίσαρος / Καίσαρι
  choice: Siza
  rationale: A sụgharịghị aha/utu aha ọchịchị Καῖσαρ ka ọ ghara ịbụ nkọwa sara mbara dịka “eze ukwu.”
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: nyekwa Chineke ihe ndị bụ nke Chineke
  rationale: Na-echekwa myirịta na ọdịiche dị n'etiti akụkụ Siza na akụkụ Chineke.
- source_word: θεοῦ / θεῷ
  choice: Chineke
  rationale: N'ebe a θεός na-ezo aka n'ebe Chineke nke Izrel nọ; “Chineke” bụ okwu Standard Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Oke okwu Jizọs banyere ọchịchị na Chineke
  choice: 'E chekwara iwu abụọ yiri ibe ha: inye Siza ihe bụ nke ya na inye Chineke ihe bụ nke ya, n''akọwaghị kpọmkwem oke nke akụkụ nke ọ bụla.'
  alternative: Ịkọwa ya dị ka nkewa siri ike n'etiti okpukpe na ọchịchị, nkwado ọchịchị na-enweghị oke, ma ọ bụ naanị iwu ịkwụ ụtụ isi.
  rationale: Grik na-ekwu ka e nye onye ọ bụla ihe bụ nke ya, ma ọ naghị akọwa usoro ndọrọ ndọrọ ọchịchị zuru ezu. Nsụgharị ahụ kwesịrị ịhapụ obosara na esemokwu dị n'okwu ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E ji “Siza” debe aha/utu aha ahụ, ma debe nhazi okwu abụọ ahụ n'ụzọ kwekọrọ na ibe ha.
