  rationale: E jiri “nyeghachinụ” dochie “nyenụ” ka e wee gosipụta nke ọma echiche ἀπόδοτε banyere inyeghachi ma ọ bụ ịkwụ ihe kwesịrị onye. E debeere nhazi yiri ibe ya n’akụkụ Siza na nke Chineke, a kpalikwara akara ala peeji ahụ n’ebe ngwaa a dị.
