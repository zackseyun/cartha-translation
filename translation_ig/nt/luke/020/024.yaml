  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: ig
  text: “Gosinụ m otu mkpụrụ ego denarịọs[a]. Onyonyo na ihe e dere n’elu ya bụ nke onye?” Ha zara, “Ọ bụ nke Siza.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denarịọs bụ mkpụrụ ego ndị Rom ji eme ihe nke ukwuu n’oge ahụ; e debere aha ya iji chekwaa ọnọdụ akụkọ ihe mere eme.
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: Gosinụ m
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ozugbo; ‘Gosinụ m’ bụ Igbo nkịtị ma na-edobe ike nke iwu ahụ.
- source_word: δηνάριον
  choice: otu mkpụrụ ego denarịọs
  rationale: ‘Denarịọs’ na-edobe aha mkpụrụ ego ahụ kpọmkwem, ebe ‘mkpụrụ ego’ na-enyere onye na-agụ ya aka ịghọta ihe ọ bụ.
- source_word: τίνος
  choice: bụ nke onye?
  rationale: Nke a na-egosipụta ajụjụ gbasara onye onyonyo na ihe e dere ahụ metụtara, n’ụzọ Igbo na-ada nke ọma.
- source_word: εἰκόνα
  choice: onyonyo
  rationale: ‘Onyonyo’ bụ okwu sara mbara ma kwesị ekwesị maka ihe oyiyi ihu dị n’elu mkpụrụ ego.
- source_word: ἐπιγραφήν
  choice: ihe e dere n’elu ya
  rationale: Nkebi okwu a doro ndị na-agụ Igbo nke oge a anya ma na-egosi ihe odide e tinyere n’elu mkpụrụ ego.
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: Ha zara
  rationale: Nke a na-ebufe njikọ participle na ngwaa ahụ n’Igbo dị mfe, nke sitere n’okike.
- source_word: Καίσαρος
  choice: Ọ bụ nke Siza
  rationale: Ọ na-edobe azịza genitive ahụ dị nkenke ma na-eme ka ọ zuo oke n’usoro okwu Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ụdị ọtụtụ mmadụ ‘Gosinụ’ mee ihe n’ihi na okwu Grik ahụ bụ iwu e nyere ọtụtụ mmadụ.
