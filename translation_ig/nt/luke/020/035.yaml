source:
  edition: SBLGNT
  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: ig
  text: Ma ndị ahụ e weere na ha ruru eru inweta oge ahụ[b] na mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ, anaghị alụ di ma ọ bụ nwunye, a naghịkwa enye ha n’alụmdi na nwunye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “a naghị enye ha ka ha lụọ.” Okwu Grik a dị n’ụdị nnara, ọ na-ekwu banyere ịbụ onye e nyere n’alụmdi na nwunye.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “oge ahụ na-abịa.” N’ụzọ nkịtị, ọ bụ “oge ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: ndị ahụ e weere na ha kwesịkwara
  rationale: 'Nke a na-edobe ụdị nnara nke okwu Grik ahụ: ọ bụ ndị e lere anya ma kpee na ha kwesịrị, ọ bụghị nkwupụta na ha n’onwe ha ritere ya site n’ọrụ ha.'
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: oge ahụ
  rationale: “Oge ahụ” na-eso ihe ngosi Grik ahụ nke ọma ma na-edobe ọdịiche dị n’etiti oge a na oge ahụ na-abịa, n’ebughị nkọwa ahụ gafee ihe ederede kwuru.
- source_word: τυχεῖν
  choice: iru
  rationale: N’ebe a, “iru” na-egosi inweta ma ọ bụ iso nwee òkè n’oge ahụ na mbilite n’ọnwụ; ọ bụkwa okwu Igbo dị mfe ma kwekọọ n’ihe abụọ ahụ e jikọtara ọnụ.
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta mbilite n’ọnwụ nke ọma ma na-echekwa ike nke ἐκ, nke pụtara isi n’etiti ndị nwụrụ anwụ pụta.
- source_word: γαμοῦσιν
  choice: alụ di ma ọ bụ nwunye
  rationale: Okwu a bụ ụzọ Igbo doro anya ma gụnye nwoke na nwanyị n’enweghị itinye echiche na-adịghị n’ederede.
- source_word: γαμίζονται
  choice: a naghịkwa enye ha n’alụmdi na nwunye
  rationale: Nke a na-echekwa ụdị nnara na ọdịiche dị n’etiti ịlụ di ma ọ bụ nwunye na ịbụ onye e nyere n’alụmdi na nwunye.
theological_decisions:
- issue: Ma καταξιωθέντες ọ na-ekwu na mmadụ ji ọrụ ọma ya rụta ndụ mbilite n’ọnwụ
  choice: e weere na ha kwesịkwara
  alternative: ndị kwesịrị oge ahụ
  rationale: Nhọrọ a na-echekwa echiche nke ikpe ma ọ bụ nyocha e mere banyere ha, n’ekwughị na ha ji aka ha rụta ya; n’otu aka ahụ, ọ naghị ehichapụ esemokwu nkà mmụta okpukpe dị n’okwu Grik ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “oge” kama “ụwa” maka αἰών, ma debe ụdị nnara nke καταξιωθέντες na γαμίζονται. Akara nkọwa ala peeji [a] na [b] pụtara n’ederede isi.
