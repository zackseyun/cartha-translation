revisions:
- from: Ma ndị ahụ e weere na ha kwesịkwara iru oge ahụ[b] na mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ, anaghị alụ di ma ọ bụ nwunye, a naghịkwa enye ha n’alụmdi na nwunye.[a]
  to: Ma ndị ahụ e weere na ha ruru eru inweta oge ahụ[b] na mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ, anaghị alụ di ma ọ bụ nwunye, a naghịkwa enye ha n’alụmdi na nwunye.[a]
  rationale: The revision corrects an unnatural construction while preserving the passive force of καταξιωθέντες and its non-meritorious, evaluative nuance. It retains the explicit distinction in the Greek marriage verbs and replaces the footnote’s potentially misleading alternative with a direct passive explanation. No theological interpretation beyond the source wording has been added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:08Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the passive sense of καταξιωθέντες, the coordinated objects 'that age' and 'the resurrection from the dead,' and the contrast between γαμοῦσιν and the passive γαμίζονται. However, 'e weere na ha kwesịkwara iru' is grammatically and idiomatically strained and can sound like 'were considered as also needing to reach.'
  naturalness: Replacing that expression with 'ndị e weere na ha ruru eru inweta' is clear, natural Standard Igbo and retains the sense that worthiness is ascribed or judged, not asserted as intrinsic merit. The remaining marriage pair is understandable and appropriately preserves the source distinction.
  terminology: '''Oge ahụ,'' ''mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ,'' and ''a naghịkwa enye ha n’alụmdi na nwunye'' are suitable. The passive explanatory footnote should avoid ''alụpụ,'' which can suggest divorce or is otherwise less precise in this context.'
  issues:
  - severity: medium
    issue: Awkward rendering of καταξιωθέντες with its infinitive
    rationale: The wording 'e weere na ha kwesịkwara iru' is not smooth Standard Igbo and does not clearly convey 'were considered worthy to attain.' 'E weere na ha ruru eru inweta' expresses the passive judgment and the infinitive complement naturally.
  - severity: medium
    issue: Footnote a gives an imprecise alternative
    rationale: '''A naghịkwa alụpụ ha'' is potentially misleading and does not plainly convey the passive social idiom ''are given in marriage.'' The note should explain the passive construction directly.'
  revised_text: Ma ndị ahụ e weere na ha ruru eru inweta oge ahụ[b] na mbilite n’ọnwụ site n’etiti ndị nwụrụ anwụ, anaghị alụ di ma ọ bụ nwunye, a naghịkwa enye ha n’alụmdi na nwunye.[a]
