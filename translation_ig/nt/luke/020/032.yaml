  text: ὕστερον ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/032.yaml
  text: Later[a], the woman also died.
translation:
  language: ig
  text: Mgbe e mesịrị[a], nwaanyị ahụ nwụkwara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N'ikpeazụ, nwaanyị ahụ nwụkwara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Mgbe e mesịrị
  rationale: Ọ na-egosi oge sochirinụ n'usoro akụkọ ahụ, n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ taa.
- source_word: καὶ
  choice: -kwa- (nwụkwara)
  rationale: N'ebe a, καί pụtara na nwaanyị ahụ sokwa ụmụnne ndị ahụ nwụọ; mgbakwụnye -kwa- na-egosipụta echiche 'kwa/ọzọ' n'ụzọ ebumpụta ụwa n'Igbo.
- source_word: ἡ γυνή
  choice: nwaanyị ahụ
  rationale: γυνή nwere ike ịpụta 'nwaanyị' ma ọ bụ 'nwunye.' N'ihi na ọ lụrụ ọtụtụ ụmụnne n'usoro ahụ, 'nwaanyị ahụ' na-ezere ime ka ọ dị ka a na-ekwu banyere naanị otu mmekọrịta alụmdi na nwunye.
- source_word: ἀπέθανεν
  choice: nwụụrụ
  rationale: Ọ na-akọ ọnwụ ya kpọmkwem dịka ihe mere n'oge gara aga, n'enweghị ime ka okwu ahụ dị nro karịa isi mmalite Grik.
