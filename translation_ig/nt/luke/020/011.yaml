    issue: Infinitival phrasing is slightly less idiomatic.
    rationale: After “gara n’ihu,” Standard Igbo normally reads more smoothly with “iziga,” preserving the Greek sense of proceeding/continuing to send.
  - severity: low
    issue: The wording for ἀτιμάσαντες can be more exact and idiomatic.
    rationale: “Mee ya ihe ihere” is understandable, but “mesookwa ya n’ụzọ ihere” more directly expresses shameful, dishonoring treatment and retains the parallel participial actions.
