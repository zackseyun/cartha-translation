  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: ig
  text: Ọ gara n’ihu iziga ohu ọzọ[a]; ma ha tikwara onye ahụ ihe, mesookwa ya n’ụzọ ihere, wee zilaga ya n’aka efu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye na-eje ozi.” Okwu Grik bụ δοῦλος, nke na-egosi onye nọ n’okpuru ikike onye nwe ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: Ọ gara n’ihu
  rationale: N’ebe a, προστίθημι tinyere ngwaa infinitive pụtara ịnọgide ma ọ bụ ịga n’ihu ime ihe, ọ bụghị nanị ‘ịgbakwunye.’
- source_word: ἕτερον
  choice: ọzọ
  rationale: ἕτερος na-egosi ohu ọzọ dị iche na nke e zigara na mbụ; ‘ọzọ’ bụ okwu Igbo doro anya ma kwekọọ n’akụkọ a.
- source_word: πέμψαι
  choice: ziga
  rationale: ‘Ziga’ bụ ụzọ nkịtị na nke ziri ezi isi kwuo iziga mmadụ n’ọrụ.
- source_word: δοῦλον
  choice: ohu
  rationale: ‘Ohu’ na-echekwa ọnọdụ onye ahụ dị ka onye nwe ya nwere ikike n’ebe ọ nọ, nke δοῦλος na-egosi n’ilu a; e tinyere nkọwa ala peeji maka nhọrọ dị nro karị.
- source_word: κἀκεῖνον
  choice: onye ahụ ... kwa
  rationale: Nhazi ‘ha tikwara onye ahụ ihe’ na-egosi ma ‘onye ahụ’ ma echiche nke ‘kwa,’ si otú ahụ jikọta ihe mere ya na ihe mere onye mbụ.
- source_word: δείραντες
  choice: tikwara ... ihe
  rationale: δέρω na-egosi iti mmadụ ihe; okwu a adịghị akọwa ụdị iti ahụ karịa ihe Grik kwuru.
- source_word: ἀτιμάσαντες
  choice: mee ya ihe ihere
  rationale: Nkebi a bụ Igbo sitere n’okike nke na-egosi mmeso na-eweda mmadụ ugwu ma na-eme ya ihere, nke kwekọrọ na ἀτιμάζω.
- source_word: ἐξαπέστειλαν
  choice: zilaga ya
  rationale: ‘Zilaga ya’ na-egosi na ha zipụrụ ya pụọ ka ọ laghachi, dị ka ngwaa Grik a si dị n’ọnọdụ akụkọ ahụ.
- source_word: κενόν
  choice: n’aka efu
  rationale: N’ebe a κενός pụtara na o nweghị ihe e nyere ya ka o buru laa; ‘n’aka efu’ bụ akpaalaokwu Igbo dabara adaba.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ilu a
  choice: ohu
  alternative: onye na-eje ozi
  rationale: N’ilu a, mmekọrịta onye nwe ubi na onye o zigara na-egosi ọnọdụ onye nọ n’okpuru ikike onye nwe ya. ‘Ohu’ na-echekwa eziokwu mmekọrịta ahụ n’enweghị itinye nkọwa ozizi ọzọ; ‘onye na-eje ozi’ ka dị ka nhọrọ ma ọ bụrụ na a chọrọ okwu dị nro.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu dee ya. ‘Gara n’ihu ziga’ na-eburu akpaalaokwu Grik n’ụzọ sitere n’okike; ‘n’aka efu’ na-enye ihe κενόν pụtara n’ọnọdụ a. Akara nkọwa [a] dị n’akụkụ okwu ọ na-akọwa.
