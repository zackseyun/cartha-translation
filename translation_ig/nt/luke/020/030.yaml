- source_word: ὁ δεύτερος
  choice: onye nke abụọ
  rationale: 'Ordinal ahụ nwere artikel ma na-arụ ọrụ dịka aha: ‘onye nke abụọ.’ ‘Onye’ na-eme ka okwu ahụ bụrụ Igbo doro anya, ebe a hapụrụ ‘nwanne nwoke’ nke na-adịghị n''okwu Grik.'
