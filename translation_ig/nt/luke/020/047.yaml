  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: ig
  text: ndị na-erichapụ ụlọ ndị inyom di ha nwụrụ, ma na-ekpe ogologo ekpere n’okpuru ihe ngọpụ[a]. Ndị a ga-anata ikpe ka ukwuu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ekpe ogologo ekpere n’aghụghọ” ma ọ bụ “n’ihi ngosi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikpe ka njọ” ma ọ bụ “ikpe ọmụma ka ukwuu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: na-erichapụ
  rationale: Ọ bụ okwu atụ na-egosi iri ma ọ bụ nara ihe mmadụ n’ụzọ obi ọjọọ ruo mgbe ọ gwụrụ; “na-erichapụ” na-echekwa ịdị ike nke okwu Grik ahụ.
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: ihe ndị inyom di ha nwụrụ nwere
  rationale: Ọ bụ ezie na οἰκίας pụtara “ụlọ” n’ụzọ nkịtị, n’ebe a ọ na-anọchi anya ụlọ, akụ, ma ọ bụ ihe ha ji ebi ndụ. Nsụgharị a na-eme ka ụdị mmegbu ahụ doo onye Igbo nke oge a anya n’emebighị isi okwu ahụ.
- source_word: προφάσει
  choice: ka ọ bụrụ ihe mkpuchi
  rationale: Okwu a na-egosi ihe e ji ekpuchi ezi ebumnobi ma ọ bụ mee ka omume ọjọọ yie ihe ziri ezi. “Ihe mkpuchi” bụ okwu Igbo sitere n’okike nke na-echekwa echiche nke pretext/pretense.
- source_word: μακρὰ προσεύχονται
  choice: na-ekpekwa ogologo ekpere
  rationale: μακρὰ na-arụ ọrụ dịka okwu na-akọ ogologo oge ekpere ahụ were; okwu Igbo a dị mfe ma na-eguzosi ike n’ihe nye isi mmalite.
- source_word: λήμψονται περισσότερον κρίμα
  choice: ga-anata ikpe ka njọ
  rationale: “Ga-anata” na-egosipụta ihe ga-abịara ha, ebe “ikpe ka njọ” na-echekwa ntụnyere dị na περισσότερον na obosara ihe κρίμα pụtara.
theological_decisions:
- issue: Ihe κρίμα pụtara n’ebe a
  choice: ikpe
  alternative: ikpe ọmụma
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ ikpe Chineke na-adịghị mma. Ma “ikpe” na-echekwa obosara okwu Grik ahụ karịa “ikpe ọmụma,” nke na-emechi ihe ọ pụtara n’otu ụzọ.
- issue: Ihe προφάσει na-ekwu banyere ogologo ekpere ahụ
  choice: ekpere ahụ bụ ihe mkpuchi
  alternative: ha na-ekpe ekpere ka ndị mmadụ hụ ha
  rationale: “Ihe mkpuchi” na-egosi aghụghọ ahụ n’etinyeghị nkọwa na isi mmalite ekwughị kpọmkwem, dịka ebumnobi ịbụ ka ndị mmadụ hụ ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. A họọrọ “ndị inyom di ha nwụrụ” kama okwu dị mkpirikpi nwere ike ịdị arọ ma ọ bụ bụrụ nke mpaghara ụfọdụ. Ahịrịokwu ahụ bụ akụkụ na-aga n’ihu site n’amaokwu bu ya ụzọ, ya mere o ji malite na “ndị.”
