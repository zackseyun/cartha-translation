  text: until I make your enemies a footstool for your feet[a].
translation:
  language: ig
  text: ruo mgbe m ga-eme ka ndị iro gị bụrụ ihe mgbakwasị ụkwụ gị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “ruo mgbe m ga-etinye ndị iro gị ka ha bụrụ ihe mgbakwasị ụkwụ gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἂν
  choice: ruo mgbe
  rationale: Nkebiokwu a na-egosi ókè oge nke ihe ga-eme n’ọdịnihu; “ruo mgbe” bụ ụzọ Igbo doro anya ma kwekọọ na ya.
- source_word: θῶ
  choice: m ga-eme ka ... bụrụ
  rationale: Ọ bụ ezie na τίθημι pụtara n'ụzọ nkịtị “idowe/itinye,” n’ihe atụ a, “ime ka ... bụrụ” na-egosipụta nsonaazụ okwu ahụ n’Igbo eke, ma ihe odide ala peeji na-edebe nsụgharị nkịtị karị.
- source_word: τοὺς ἐχθρούς σου
  choice: ndị iro gị
  rationale: Nke a na-asụgharị kpọmkwem ndị a na-emegide onye a na-agwa okwu, n’enweghị ime ka echiche iro ahụ dị nro.
- source_word: ὑποπόδιον
  choice: ihe mgbakwasị ụkwụ
  rationale: Nke a bụ okwu Igbo doro anya maka ihe mmadụ na-adọba ma ọ bụ na-agbakwasị ụkwụ n’elu ya, ma na-echekwa ihe atụ eze nke amaokwu ahụ.
- source_word: τῶν ποδῶν σου
  choice: ụkwụ gị
  rationale: Mgbe e jikọtara ya na “ihe mgbakwasị ụkwụ,” nke a bụ okwu Igbo eke ma na-enye otu echiche ahụ nke Grik, bụ́ “nke ụkwụ gị.”
theological_decisions:
- issue: Ihe atụ sitere n’Abụ Ọma 110:1 banyere ido ndị iro n’okpuru ọchịchị
  choice: E debere ihe atụ ahụ dịka “ime ka ndị iro gị bụrụ ihe mgbakwasị ụkwụ gị.”
  alternative: “idowe ndị iro gị n’okpuru ụkwụ gị”
  rationale: Nhọrọ a na-echekwa ihe atụ eze na nke Mesaịa dị n’amaokwu ahụ, n’akọwaghị ya dịka mbibi ma ọ bụ mmeri zuru ezu karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A hapụrụ amaokwu ahụ dịka nkebiokwu na-aga n’ihu site n’amaokwu bu ya ụzọ, dịka ọ dị na Grik.
