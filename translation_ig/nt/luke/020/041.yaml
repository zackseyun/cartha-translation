  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Olee otú ha si ekwu na Mesaya[a] bụ nwa Devid[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.” E ji “Mesaya” sụgharịa aha ọkwá Grik bụ Χριστός n’ebe a n’ihi na ihe a na-ekwu bụ banyere onye nzọpụta sitere n’agbụrụ Devid nke a na-atụ anya ya.
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, ọ bụ kpọmkwem “nwa Devid.” Okwu Grik ahụ enweghị article n’ebe a, ya mere ọ naghị akọwapụta ma a ga-ewere ya dịka “nwa Devid” ma ọ bụ “nwa ahụ nke Devid.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ bụ njikọ dị nro nke na-egosi ntụgharị n’okwu; “Ma” dabara n’ebe a ka Jizọs na-ebute ajụjụ siri ike.
- source_word: πρὸς αὐτούς
  choice: ha
  rationale: N’usoro okwu Igbo, “ọ sịrị ha” bụ ụzọ ebumpụta ụwa isi kwuo na ọ gwara ha okwu.
- source_word: Πῶς
  choice: Olee otú
  rationale: Ọ na-ajụ otú nkwupụta ahụ si kwe omume ma ọ bụ ihe ndabere ya bụ.
- source_word: λέγουσιν
  choice: ha si ekwu
  rationale: Nke a na-edobe isiokwu ọtụtụ mmadụ a na-akọwaghị kpọmkwem, dị ka Grik si mee.
- source_word: τὸν χριστόν
  choice: Mesaya
  rationale: N’ebe a Χριστός bụ aha ọkwá nke onye nzọpụta eze sitere n’agbụrụ Devid nke ndị mmadụ na-atụ anya ya; “Mesaya” na-eme ka nke ahụ doo anya.
- source_word: εἶναι
  choice: bụ
  rationale: Mgbe e mesịrị “ha si ekwu na,” infinitive Grik a na-asụ n’Igbo nke ọma dịka ngwaa zuru ezu “bụ.”
- source_word: Δαυὶδ υἱόν
  choice: nwa Devid
  rationale: Nke a bụ ntụgharị dị nso ma bụrụkwa nke ebumpụta ụwa; ọ naghị amanye mkpebi ma ọ bụ okwu nsọpụrụ karịrị ihe Grik kwuru.
theological_decisions:
- issue: Ntughari Χριστός
  choice: Mesaya
  alternative: Kraịst
  rationale: Ihe gbara amaokwu a gburugburu bụ atụmanya banyere onye ọchịchị-nzọpụta sitere n’agbụrụ Devid. “Mesaya” na-egosipụta ojiji ya dịka aha ọkwá, ebe nkọwa ala peeji na-echekwa “Kraịst” dịka ụzọ ọzọ.
- issue: Okwu banyere ịbụ nwa Devid
  choice: nwa Devid
  alternative: otu nwa Devid; Nwa Devid ahụ
  rationale: Nhọrọ a na-echekwa okwu ọmụmụ na esemokwu nkà mmụta okpukpe nke Jizọs ga-ajụkwu banyere ya, na-etinyeghị nkọwa doro anya nke article Grik na-enyeghị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. A họọrọ “Olee otú ha si ekwu” ka ajụjụ ahụ daa nke ọma n’ọnụ ndị na-agụ akwụkwọ taa. E debere akara ala peeji [b] n’akụkụ “nwa Devid,” ebe [a] dị n’akụkụ ahịrịokwu dum nke nwere “Mesaya.”
