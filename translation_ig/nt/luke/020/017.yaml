id: LUK.20.17
reference: Luke 20:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: ig
  text: 'Ma o legidere ha anya wee sị[a], “Gịnịzi bụ ihe a e dere: ‘Nkume ahụ ndị na-ewu ụlọ jụrụ, ọ bụ ya aghọọla isi nkuku’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “nkume ntọala nkuku”; ma ọ bụ “nkume elu.” N’okwu Grik, ọ pụtara n’ụzọ nkịtị, “isi nkuku.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμβλέψας
  choice: legidere ha anya nke ọma
  rationale: Nke a na-egosi ile ha anya kpọmkwem na ụma, n’enweghị ime ka ike okwu ahụ karịa nke Grik.
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: Gịnịzi ka ihe a e dere pụtara
  rationale: N’Igbo nkịtị, ajụjụ a na-achọ ihe odide ahụ pụtara; nsụgharị a na-edebe ike ajụjụ ahụ na echiche nke ihe e dere, kama ịkpọ ya ‘Akwụkwọ Nsọ’ n’ebe Grik na-ekwughị ya kpọmkwem.
- source_word: Λίθον
  choice: Nkume ahụ
  rationale: Ọ na-arụtụ aka n’otu nkume a maara nke ọma n’okwu e hotara.
- source_word: ἀπεδοκίμασαν
  choice: jụrụ ajụ
  rationale: Ọ na-egosi na ndị na-ewu ụlọ nyochara nkume ahụ ma jụ ya; nkwugharị ‘jụrụ ajụ’ bụ Igbo doro anya ma sie ike.
- source_word: οἱ οἰκοδομοῦντες
  choice: ndị na-ewu ụlọ
  rationale: Ọ bụ ụzọ Igbo dị mfe ma kwekọọ n’ihe atụ banyere iwu ụlọ.
- source_word: οὗτος
  choice: ọ bụ ya
  rationale: Ọ na-edebe nkwusi ike dị na nnọchiaha ngosi Grik ma na-ezo aka n’otu nkume ahụ, n’enweghị ịgbanwe ya ozugbo ka ọ bụrụ onye.
- source_word: ἐγενήθη εἰς
  choice: aghọọla
  rationale: Ụdị a na-egosi mgbanwe nke mere eme nke nsonaazụ ya ka dị ugbu a.
- source_word: κεφαλὴν γωνίας
  choice: isi nkuku
  rationale: Nke a na-esochi okwu Grik n’ụzọ doro anya ma na-edebe ihe oyiyi ‘isi nkuku’ n’agbanyeghị na ụdị nkume ụlọ a kpọrọ aha ka a na-arụrịta ụka.
theological_decisions:
- issue: Ihe atụ ihe owuwu dị na ntụaka Abụ Ọma 118:22
  choice: isi nkuku
  alternative: nkume isi nkuku; ma ọ bụ nkume elu nke na-emechi ụlọ
  rationale: ‘Isi nkuku’ na-edebe ọdịdị okwu Grik κεφαλὴ γωνίας ma ghara ikpebi ma ọ bụ nkume ntọala dị n’akụkụ ụlọ ka ọ bụ nkume elu na-emechi ihe owuwu. A kọwara nhọrọ ndị ọzọ n’ala ala peeji.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘legidere ha anya nke ọma’ gosipụta ile anya kpọmkwem; e debere ihe atụ ụlọ ahụ n’ụdị na-anaghị ekpebi nkọwa ya n’ike.
