    text: A pụkwara ịsụgharị ya “nkume ntọala nkuku”; ma ọ bụ “nkume elu.” N’okwu Grik, ọ pụtara n’ụzọ nkịtị, “isi nkuku.”
    reason: alternative_reading
  revision_rationale: The revised text removes the added interpretive sense from the opening question, uses more idiomatic Igbo for the builders’ rejection, and retains the deliberately noncommittal architectural metaphor. The revised footnote continues to supply familiar alternatives while preserving the ambiguity of the Greek expression.
