  text: καὶ οὐκ ἴσχυσαν ἐπιλαβέσθαι ⸀τοῦ ῥήματος ἐναντίον τοῦ λαοῦ, καὶ θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ ἐσίγησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: ig
  text: Ha enweghịkwa ike ijide ya n'okwu o kwuru n'ihu ndị mmadụ; azịza ya tụrụ ha n'anya, ha wee gbaa nkịtị.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴσχυσαν
  choice: enweghịkwa ike
  rationale: Na-egosi enweghị ikike ime ihe ahụ n'ụzọ doro anya ma dịkwa eke n'Igbo.
- source_word: ἐπιλαβέσθαι
  choice: ijide
  rationale: Na-echekwa ihe oyiyi Grik nke ijide ihe, ebe ọnọdụ okwu a na-egosi ịchọta ihe ha ga-eji megide Jizọs.
- source_word: τοῦ ῥήματος
  choice: okwu ya
  rationale: ῥῆμα ebe a bụ okwu e kwuru; 'okwu ya' na-egosi n'ụzọ eke na ọ bụ okwu Jizọs.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: n'ihu ọha n'etiti ndị mmadụ
  rationale: Na-egosi na ihe ahụ mere n'ihu ndị mmadụ, ọ bụghị na nzuzo; 'ndị mmadụ' na-anọchi λαός na-enweghị ime ya naanị ìgwè mmadụ.
- source_word: θαυμάσαντες
  choice: azịza ya tụrụ ha n'anya
  rationale: Usoro okwu a bụ Igbo eke nke na-egosi mmeghachi omume ha nke oke ịtụnanya.
- source_word: ἀποκρίσει
  choice: azịza ya
  rationale: Ọ bụ ntụgharị kwụ ọtọ ma kwekọọ n'ọnọdụ esemokwu na ajụjụ.
- source_word: ἐσίγησαν
  choice: ha wee gbaa nkịtị
  rationale: Na-egosi mgbanwe ha si n'ikwu okwu banye n'ịgbachi nkịtị mgbe azịza ahụ tụrụ ha n'anya.
