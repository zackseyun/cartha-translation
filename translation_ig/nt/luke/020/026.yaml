revisions:
- from: Ha enweghịkwa ike ijide okwu ya n'ihu ọha n'etiti ndị mmadụ[a]; ma azịza ya tụrụ ha n'anya, ha wee gbaa nkịtị.
  to: Ha enweghịkwa ike ijide ya n'okwu o kwuru n'ihu ndị mmadụ; azịza ya tụrụ ha n'anya, ha wee gbaa nkịtị.
  rationale: The revision makes explicit that the intended target of the attempted seizure was Jesus, while retaining the source idiom’s sense of using his spoken words against him. It removes added locational nuance and avoids an unwarranted adversative connective. The footnote preserves the closer, though less idiomatic in Igbo, image of ‘seizing his statement.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys their failure to exploit Jesus' utterance and their astonishment followed by silence. However, “ijide okwu ya” by itself can naturally mean to understand/grasp his words in Igbo, rather than to catch or entrap him by something he said. “n'ihu ọha n'etiti ndị mmadụ” also adds both ‘openly’ and ‘among,’ whereas ἐναντίον τοῦ λαοῦ means simply ‘before/in the presence of the people.’
  naturalness: The revised wording uses the natural Igbo legal/disputation idiom “ijide ya n'okwu o kwuru” for catching someone by what they said. The final clause remains idiomatic and preserves the narrative sequence.
  terminology: “okwu o kwuru” appropriately renders the nontechnical spoken-utterance sense of ῥῆμα. “ndị mmadụ” is suitable for λαός in this setting; “azịza” and “gbaa nkịtị” are clear Standard Igbo renderings of ἀπόκρισις and ἐσίγησαν.
  issues:
  - severity: medium
    issue: “ijide okwu ya” is semantically ambiguous in Igbo.
    rationale: Without an expressed person, it can mean ‘grasp/understand his words.’ The Greek idiom denotes catching Jesus on the basis of something he said.
  - severity: low
    issue: “n'ihu ọha n'etiti ndị mmadụ” over-specifies ἐναντίον τοῦ λαοῦ.
    rationale: The source says ‘before/in the presence of the people’; it does not independently assert ‘openly’ or ‘among the people.’
  - severity: low
    issue: The connective “ma” introduces an adversative relation not marked by the Greek.
    rationale: The clauses are linked by καί; simple sequential coordination is preferable.
  revised_text: Ha enweghịkwa ike ijide ya n'okwu o kwuru n'ihu ndị mmadụ; azịza ya tụrụ ha n'anya, ha wee gbaa nkịtị.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ijide okwu ya.”
    reason: lexical_alternative
  revision_rationale: The revision makes explicit that the intended target of the attempted seizure was Jesus, while retaining the source idiom’s sense of using his spoken words against him. It removes added locational nuance and avoids an unwarranted adversative connective. The footnote preserves the closer, though less idiomatic in Igbo, image of ‘seizing his statement.’
