  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe oyiyi 'ijide okwu,' tinyekwa nkọwa ọzọ n'ala peeji iji gosi echiche idiom nke ịnwụde ya n'okwu ya.
