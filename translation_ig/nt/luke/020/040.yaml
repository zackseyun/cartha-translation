  yaml_path: translation/nt/luke/020/040.yaml
  text: For they no longer dared to ask him anything.
translation:
  language: ig
  text: N’ihi na ha enwekwaghị obi ike ịjụ ya ihe ọ bụla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: enwekwaghị
  rationale: Na njikọ ya na ‘obi ike,’ nke a na-egosi na site n’oge ahụ gaa n’ihu, ha akwụsịla inwe obi ike ime ihe ahụ.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ejikọ amaokwu a na ihe bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: ἐτόλμων
  choice: ha enwekwaghị obi ike
  rationale: Okwu a na-egosi inwe obi ike ma ọ bụ ịnwa anwa ime ihe; ụdị gara aga na οὐκέτι na-egosi na ha akwụsịla ime otú ahụ.
- source_word: ἐπερωτᾶν
  choice: ịjụ
  rationale: N’ọnọdụ a, ọ bụ ịjụ ajụjụ, karịchaa n’ihu ọha; ‘ịjụ’ bụ okwu Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs dịka onye a na-ajụ ajụjụ.
- source_word: οὐδέν
  choice: ihe ọ bụla
  rationale: N’okwu a jụrụ ajụ, ‘ihe ọ bụla’ na-egosi oke zuru ezu nke οὐδέν n’ụzọ Igbo si ada nke ọma.
