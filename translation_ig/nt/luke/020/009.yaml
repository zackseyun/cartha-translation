  to: 'Mgbe ahụ, ọ malitere ịkọrọ ndị mmadụ ilu a: “Otu nwoke kụrụ ubi vaịn, gbazinye ya ndị ọrụ ugbo, wee pụọ gaa ebe ọzọ[a] ruo ogologo oge.”'
