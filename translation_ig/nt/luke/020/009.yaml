id: LUK.20.9
reference: Luke 20:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: ig
  text: 'Mgbe ahụ, ọ malitere ịkọrọ ndị mmadụ ilu a: “Otu nwoke kụrụ ubi vaịn, gbazinye ya ndị ọrụ ugbo, wee pụọ gaa ebe ọzọ[a] ruo ogologo oge.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wee gaa mba ọzọ ruo ogologo oge.” Ngwaa Grik ahụ nwere ike ịpụta na mmadụ hapụrụ mpaghara ebe obibi ya, ọbụna gaa mba ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: Mgbe ahụ, ọ malitere
  rationale: δὲ na-akwalite akụkọ gaa n’ihu, ebe ἤρξατο na-egosi mmalite nke okwu Jizọs; nkebi a bụ Igbo doro anya ma kwekọọ n’usoro akụkọ.
- source_word: πρὸς τὸν λαὸν λέγειν
  choice: ịgwa ndị mmadụ
  rationale: πρός ya na ngwaa ikwu okwu na-egosi ndị a na-agwa okwu; λαός bụ ‘ndị mmadụ,’ ọ bụghị naanị ìgwè mmadụ e kwuru kpọmkwem.
- source_word: τὴν παραβολὴν ταύτην
  choice: ilu a
  rationale: N’Igbo, ‘ilu’ bụ okwu a na-ejikarị akọ akụkọ nkuzi yiri παραβολή, ma ọ ka na-adị mfe nghọta nye ndị na-agụ akwụkwọ taa.
- source_word: Ἄνθρωπος
  choice: Otu nwoke
  rationale: Aha ahụ bụ otu onye nwoke n’akụkọ a; ‘otu nwoke’ na-egosi ma enweghị njirimara ya ma nwoke ọ bụ.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: kụrụ ubi vaịn
  rationale: φυτεύω bụ ‘kụọ/kụnye,’ ebe ἀμπελών bụ ubi a na-akụ vaịn; ‘ubi vaịn’ bụ ụzọ dị mfe ma doo anya isi kwuo ya.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: gbazinye ya ndị ọrụ ugbo
  rationale: ἐκδίδωμι n’ebe a pụtara inye ihe onwunwe n’ịgbazite, γεωργοί bụkwa ndị na-arụ ọrụ ugbo. Nkebi a na-egosi ma mgbazinye ahụ ma ndị ga-akọ ubi ahụ.
- source_word: ἀπεδήμησεν
  choice: pụọ gaa ebe ọzọ
  rationale: Nhọrọ a na-edobe isi echiche nke ịhapụ ebe obibi gaa ebe ọzọ, n’agbanyeghị na ngwaa ahụ nwekwara ike ịpụta ịga mba ọzọ.
- source_word: χρόνους ἱκανούς
  choice: ruo ogologo oge
  rationale: Ọtụtụ χρόνους ya na ἱκανούς na-egosi oge dị ukwuu; ‘ruo ogologo oge’ bụ Igbo e ji ekwu ya n’ụzọ nkịtị.
theological_decisions:
- issue: Ma ἀπεδήμησεν ọ̀ na-ekwu kpọmkwem na nwoke ahụ gara mba ọzọ
  choice: pụọ gaa ebe ọzọ
  alternative: gaa mba ọzọ
  rationale: Ngwaa Grik ahụ nwere ike ịgụnye ịga mba ọzọ, ma amaokwu ahụ ekwughị mba kpọmkwem. Isi ederede na-edobe nghọta sara mbara, ebe nkọwa ala peeji na-echekwa nghọta nke ịga mba ọzọ.
- issue: Ụdị nwoke nke Ἄνθρωπος n’akụkọ ahụ
  choice: Otu nwoke
  alternative: Otu onye
  rationale: N’agbanyeghị na ἄνθρωπος nwere ike ịpụta mmadụ n’ozuzu, ebe a ọ na-ewebata otu nwoke nwe ubi n’akụkọ ahụ; ya mere a naghị ewepụ ihe ederede ahụ na-egosi banyere nwoke ọ bụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị nsọ ma dị mfe nghọta. E tinyere akara [a] ozugbo n’akụkụ okwu ‘gaa ebe ọzọ’ nke nkọwa ya metụtara, kama itinye ya n’akụkụ ‘ubi vaịn.’
