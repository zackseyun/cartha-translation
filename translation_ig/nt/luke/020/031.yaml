revisions:
- from: Onye nke atọ kwa lụrụ ya, otu ahụkwa ka ụmụnne asaa ahụ niile mere; ha amụtaghị nwa, ha wee nwụọ.
  to: 'Onye nke atọ lụrụ ya; otu ahụkwa ka ụmụnne asaa ahụ niile mere: ha ahapụghị ụmụ, ha nwụkwara.'
  rationale: The revision replaces ‘ha amụtaghị nwa’ with ‘ha ahapụghị ụmụ’ to represent καταλείπω with τέκνα faithfully and naturally. It retains the contextual translation ‘lụrụ ya’ for ‘took her,’ the totality of all seven brothers, and their death.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the marriage sense of ἔλαβεν αὐτήν and the referent of ‘the seven.’ However, “ha amụtaghị nwa” means ‘they did not bear/beget a child’ rather than the Greek’s ‘they left no children [behind],’ and can be awkward when applied collectively to male brothers. The revised wording retains the death-related sense of κατέλιπον.
  naturalness: The revised sentence uses clear, contemporary Standard Igbo. “Ahapụghị ụmụ” is idiomatic in this context for leaving no children, and the colon makes the shared outcome of the seven brothers easy to follow.
  terminology: “Lụrụ ya” appropriately conveys the contextual marital idiom without importing doctrinal interpretation. “Ụmụnne asaa ahụ niile” is a contextually necessary and natural resolution of the Greek ellipsis. No footnote is needed because the Igbo wording is unambiguous and idiomatic.
  issues:
  - severity: medium
    issue: “ha amụtaghị nwa” does not preserve the force of οὐ κατέλιπον τέκνα.
    rationale: The Greek says that the seven ‘left no children,’ specifically framing the absence of surviving descendants in connection with their deaths. “Amụtaghị” shifts this to not bearing/begetting a child and is less suitable for the collective male referent.
  revised_text: 'Onye nke atọ lụrụ ya; otu ahụkwa ka ụmụnne asaa ahụ niile mere: ha ahapụghị ụmụ, ha nwụkwara.'
