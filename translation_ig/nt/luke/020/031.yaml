base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: ig
  text: 'Onye nke atọ lụrụ ya; otu ahụkwa ka ụmụnne asaa ahụ niile mere: ha ahapụghị ụmụ, ha nwụkwara.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: Onye nke atọ
  rationale: Grik kwuru naanị ‘onye nke atọ’ ma hapụ ‘nwanne nwoke’ ka a ghọta ya site n'okwu ndị gbara ya gburugburu; Igbo nwekwara ike ikwupụta nke a n'ụzọ doro anya ma ghara ịgbakwunye okwu ahụ.
- source_word: ἔλαβεν αὐτήν
  choice: lụrụ ya
  rationale: N'ọnọdụ iwu ịlụ nwunye nwanne nwụrụ anwụ a, ‘kpọrọ ya’ bụ akpaalaokwu Grik nke pụtara ịlụ ya. ‘Lụrụ ya’ bụ Igbo nkịtị ma doo anya; ntụgharị nkịtị ‘kpọrọ ya’ nwere ike ịpụta ọtụtụ ihe n'Igbo, ya mere o kwesịghị ịbụ isi ederede.
- source_word: ὡσαύτως δὲ καὶ οἱ ἑπτὰ
  choice: otu ahụkwa ka ụmụnne asaa ahụ niile mere
  rationale: Nke a na-egosi na ụmụnne asaa ahụ niile mere otu ihe ahụ n'usoro. A gbakwụnyere ‘ụmụnne’ na ‘mere’ iji mee ka ellipsis Grik bụrụ Igbo zuru oke na nke a na-aghọta ngwa ngwa, n'enweghị mgbanwe n'echiche.
- source_word: οὐ κατέλιπον τέκνα
  choice: ha amụtaghị nwa
  rationale: N'ebe a, okwu ahụ pụtara na ọ dịghị onye n'ime ha hapụrụ nwa mgbe ọ nwụrụ. ‘Ha amụtaghị nwa’ bụ ụzọ Igbo dị ndụ na nke doro anya isi kwuo na ha enweghị ụmụ sitere n'alụmdi na nwunye ndị ahụ.
- source_word: τέκνα
  choice: nwa
  rationale: Igbo na-ejikarị ‘nwa’ n'ụdị mkpokọta mgbe a na-ekwu na mmadụ amụtaghị nwa ọ bụla; nke a na-eburu echiche ụmụ ma ọ bụ ụmụ ọmụmụ niile.
- source_word: ἀπέθανον
  choice: ha wee nwụọ
  rationale: '‘Nwụọ’ na-enye kpọmkwem echiche nke ngwaa Grik. ‘Wee’ na-egosi usoro ahụ: ha amụtaghị nwa, mesịa nwụọ.'
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ntụgharị echiche nke akpaalaokwu ἔλαβεν αὐτήν kama ịrapara n'ụdị okwu Grik nke ga-eduhie onye na-agụ Igbo; ya mere ọ dịghị mkpa itinye nkọwa ala peeji.
