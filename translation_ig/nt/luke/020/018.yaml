review_pass:
  verdict: revise
  source_fidelity: 'The first clause reverses the Greek passive force: “ga-etipịa” makes the person the agent who crushes, whereas συνθλασθήσεται means that the person will be broken/shattered. The second clause correctly preserves the contrast in which the stone falls on the person and acts destructively.'
  naturalness: The proposed revision is clear, idiomatic Standard Igbo, and maintains the verse's compact parallelism. “Dara n'elu nkume ahụ” states the first image plainly; “onye nkume ahụ dakwasịrị” naturally expresses the converse image.
  terminology: “A ga-agbajisị ya ka ọ bụrụ iberibe” accurately conveys the severe passive result of συνθλασθήσεται. “Ọ ga-egwepịa ya” suitably renders λικμήσει, while the footnote retains the possible nuance of grinding to powder or scattering like chaff. “Ya” appropriately retains the generic singular reference without importing grammatical gender not required by Igbo.
  issues:
  - severity: high
    issue: The first-clause verb is active rather than passive.
    rationale: 'In “Onye ọ bụla dakwasịrị nkume ahụ ga-etipịa,” the person who falls appears to be the one who will crush something. Greek συνθλασθήσεται is future passive: the person will be broken to pieces. The Igbo requires an explicit passive/impersonal construction.'
