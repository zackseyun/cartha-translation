- from: Onye ọ bụla dakwasịrị nkume ahụ ga-etipịa[a]; ma onye nkume ahụ dakwasịrị[b], ọ ga-egwepịa ya.
  to: Onye ọ bụla dara n'elu nkume ahụ, a ga-agbajisị ya ka ọ bụrụ iberibe[a]; ma onye nkume ahụ dakwasịrị[b], ọ ga-egwepịa ya.
  rationale: The revision corrects the source-critical grammatical error in the first clause by rendering the future passive as “a ga-agbajisị ya.” It preserves the deliberate contrast between falling on the stone and the stone falling on someone, retains the demonstrative “ahụ,” and keeps the stronger pulverizing/scattering sense of λικμήσει available in the existing footnote.
