source:
  edition: SBLGNT
  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: ig
  text: Onye ọ bụla dara n'elu nkume ahụ, a ga-agbajisị ya ka ọ bụrụ iberibe[a]; ma onye nkume ahụ dakwasịrị[b], ọ ga-egwepịa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-etipịa ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ ga-egwe ya ka ọ ghọọ ntụ” ma ọ bụ “ọ ga-efesa ya dị ka igbogbo ọka”; ngwaa Grik a na-egosi ihe karịrị naanị ịdakwasị mmadụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: Onye ọ bụla dakwasịrị
  rationale: Nkebi participle a nwere article na-arụ ọrụ dị ka aha ma na-ezo aka n'ozuzu mmadụ niile; “Onye ọ bụla” na-egosi oke ahụ n'Igbo nkịtị.
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: nkume ahụ
  rationale: “Dakwasịrị nkume ahụ” na-egosi ịda n'elu/megide nkume ahụ n'ụzọ Igbo na-ada nke ọma, ma na-echekwa ike demonstrative nke ἐκεῖνον.
- source_word: συνθλασθήσεται
  choice: ga-etipịa
  rationale: Okwu a bụ future passive ma pụta ịgbaji mmadụ ma ọ bụ ihe ka ọ bụrụ iberibe; “ga-etipịa” na-egosi nnukwu mmebi ahụ n'enweghị ịkọwa usoro ya karịa isi mmalite.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: ma onye nkume ahụ dakwasịrị
  rationale: Relative clause ya na ἄν na aorist subjunctive na-egosi onye ọ bụla ihe ahụ nwere ike ịdakwasị; ntụgharị a na-echekwa ọdịiche dị n'etiti mmadụ ịdakwasị nkume na nkume ịdakwasị mmadụ.
- source_word: λικμήσει
  choice: ọ ga-egwepịa
  rationale: λικμάω nwere ike ịpụta ịzọpịa nke ukwuu ma ọ bụ ifesa dị ka igbogbo ọka; “egwepịa” na-enye ike siri ike karịa mmetụta nkịtị, ebe ihe ndị ọzọ okwu ahụ nwere ike ịpụta dị na nkọwa ala peeji.
- source_word: αὐτόν
  choice: ya
  rationale: Nnọchiaha Igbo “ya” na-ezo kpọmkwem n'onye ahụ a kpọrọ aha, na-enweghị ịgbakwunye nkọwa mmekọahụ nke ụtọ asụsụ Igbo anaghị achọ.
theological_decisions:
- issue: Ihe atụ nke nkume dị ka ikpe mbibi
  choice: E debere nkume ahụ dị ka ihe na-eweta mbibi siri ike, n'emeghị ka ihe atụ ahụ dị nro.
  alternative: Ịsụgharị ya naanị dị ka ịsụ ngọngọ ma ọ bụ obere mmerụ ahụ.
  rationale: N'ọnọdụ okwu a, ngwaa συνθλασθήσεται na λικμήσει abụọ na-egosi mbibi siri ike. Tụgharị ha n'ụzọ dị nro ga-ebelata ike ikpe dị n'okwu Grik.
- issue: Nnọchiaha nwoke nke na-anọchite mmadụ n'ozuzu
  choice: E ji “ya,” nke bụ nnọchiaha otu onye na Igbo ma anaghị akọ nwoke ma ọ bụ nwaanyị.
  alternative: Ịgbakwunye “nwoke ahụ” iji gosipụta ụdị masculine nke αὐτόν.
  rationale: Ọ bụ ezie na αὐτόν bụ masculine singular n'ụtọ asụsụ Grik, onye e zoro aka na ya bụ onye ọ bụla n'ozuzu. Igbo na-eji “ya” maka nwoke ma ọ bụ nwaanyị, ya mere nke a na-echekwa otu onye na generic force n'enweghị ịtinye nwoke ebe asụsụ Igbo anaghị achọ ya.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma doo onye nkịtị anya. E ji “etipịa” na “egwepịa” kewaa ngwaa Grik abụọ ahụ ma chekwaa mmụba nke ike dị na nkebi nke abụọ. Akara nkọwa [a] na [b] dị n'ahịrị isiokwu ahụ.
