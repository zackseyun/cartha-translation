  to: Ma mgbe ndị na-akọ ubi vaịn[a] hụrụ ya, ha nọ na-atụle okwu ahụ n’etiti onwe ha, na-ekwu sị, “Onye a bụ onye nketa ahụ. Ka anyị gbuo ya, ka ihe nketa ahụ wee ghọọ nke anyị.”
