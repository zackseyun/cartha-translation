  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: ig
  text: Ma mgbe ndị na-akọ ubi vaịn[a] hụrụ ya, ha nọ na-atụle okwu ahụ n’etiti onwe ha, na-ekwu sị, “Onye a bụ onye nketa ahụ. Ka anyị gbuo ya, ka ihe nketa ahụ wee ghọọ nke anyị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị ọrụ ugbo” ma ọ bụ “ndị gbaziri ubi.” Okwu Grik ahụ na-ezo aka ná ndị na-arụ ọrụ ugbo; n’ilu a, ha na-arụ ọrụ kpọmkwem n’ubi vaịn.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: ndị na-akọ ubi vaịn
  rationale: Okwu Grik a na-ezo aka ná ndị ọrụ ugbo. Ebe ọ bụ na ilu a na-ekwu maka ubi vaịn, nsụgharị a na-eme ka ọnọdụ ahụ doo anya n’etinyeghị echiche iwu nke ndị gbaziri ubi n’ime okwu ahụ n’onwe ya.
- source_word: διελογίζοντο
  choice: ha tụkọrọ uche
  rationale: Nke a na-egosi na ha nọ na-atụle atụmatụ ahụ ọnụ. Ọ na-echekwa echiche nke mkparịta ụka na ịtụgharị uche n’etiti ha n’emeghị ka ọ bụrụ na ha na-arụrịta ụka.
- source_word: πρὸς ἀλλήλους
  choice: n’etiti onwe ha
  rationale: Nkebiokwu a na-egosi omume ibe na ibe; okwu Igbo a bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a.
- source_word: κληρονόμος
  choice: onye nketa ahụ
  rationale: Nke a bụ okwu Igbo dị mkpirikpi ma doo anya maka onye iwu kwadoro ịnata ihe nketa. Mkpụrụokwu ‘ahụ’ na-egosipụta article Grik ma na-adabara onye a kapịrị ọnụ n’ilu ahụ.
- source_word: ἀποκτείνωμεν
  choice: Ka anyị gbuo ya
  rationale: Ụdị subjunctive onye mbụ ọtụtụ bụ agbamume ka ndị otu ahụ mee ihe. Nsụgharị a kwụ ọtọ, ọ dịkwaghị etinye okwu ikpe omume karịrị ihe ngwaa ahụ kwuru.
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: ka ihe nketa ahụ wee ghọọ nke anyị
  rationale: Nke a na-echekwa nzube nke ἵνα na echiche γένηται nke pụtara na ihe ahụ ga-agbanwe wee bụrụ nke ha.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị akụkọ nwere obere ọdịiche n’ihe gara aga.
- source_word: ἰδόντες
  choice: mgbe ... hụrụ
  rationale: A sụgharịrị participle a dị ka nkebiokwu oge, nke na-agụ nke ọma n’Igbo ma na-echekwa usoro ihe mere.
theological_decisions:
- issue: Okwu e ji kpọọ γεωργοὶ n’ilu banyere ubi vaịn
  choice: ndị na-akọ ubi vaịn
  alternative: ndị gbaziri ubi; ndị ọrụ ugbo
  rationale: Nhọrọ a na-ebute ihe okwu Grik pụtara n’ihu ma na-echekwa ọnọdụ ubi vaịn. Akụkọ gbara amaokwu a gburugburu na-egosi na e nyere ha ubi ahụ ka ha rụọ ọrụ na ya, ma okwu γεωργοί n’onwe ya anaghị akọwapụta ọnọdụ iwu ha dị ka ndị gbaziri ubi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. ‘Ha tụkọrọ uche’ na-egosi mkparịta ụka nwere atụmatụ n’etiti ha, ebe ‘wee ghọọ nke anyị’ na-echekwa echiche nke ihe nketa ahụ ịghọ nke ha.
