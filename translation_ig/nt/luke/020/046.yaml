- from: “Kpacharanụ anya maka ndị odeakwụkwọ[a], ndị na-achọ iji uwe ogologo na-ejegharị[b], ndị hụrụ ka a na-ekele ha n’ámá ahịa, na ịnọ n’oche ndị kachasị mkpa n’ụlọ nzukọ[c], nakwa n’ọnọdụ nsọpụrụ n’oriri[d].”
  to: “Kpacharanụ anya maka ndị odeakwụkwọ[a], ndị chọrọ ịna-ejegharị n’uwe ogologo[b], ndị hụrụ ka a na-ekele ha n’ámá ahịa n’anya, na ịnọ n’oche ndị kachasị mkpa n’ụlọ nzukọ[c], nakwa n’ebe nsọpụrụ n’oriri[d].”
