review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the warning, the scribes’ desire for conspicuous public dress, honorific greetings, prominent synagogue seating, and honored places at dinners. Two expressions can be made closer and clearer: “n’uwe ogologo” directly renders the clothing construction, and “ebe nsọpụrụ” more specifically represents honored places/seating at meals than the broader “ọnọdụ nsọpụrụ.”'
  naturalness: The revision uses idiomatic Standard Igbo and preserves the Greek’s linked characterization of the scribes. “Ka a na-ekele ha” naturally expresses the socially honorific greetings intended in context.
  terminology: “Ndị odeakwụkwọ” is retained as the conventional Gospel designation for γραμματεῖς. The prior explanatory note went beyond the verse by specifying Mosaic-law expertise; a restrained lexical alternative avoids adding historical claims not required by the source. “Ụlọ nzukọ” remains an established Igbo biblical term for synagogues.
  issues:
  - severity: medium
    issue: The wording “iji uwe ogologo na-ejegharị” is less direct than the Greek locative phrase and can suggest using robes as an instrument.
    rationale: ἐν στολαῖς means walking about in/wearing long robes. “N’uwe ogologo” is natural Igbo and retains this sense without interpretive expansion.
  - severity: low
    issue: “Ọnọdụ nsọpụrụ” is broader than the meal places/seats denoted by πρωτοκλισίας.
    rationale: The Greek refers to the most honored places at banquets. “Ebe nsọpụrụ” retains the spatial/seating sense.
  - severity: low
    issue: Footnote [a] adds a detailed description of scribes as Mosaic-law experts that is not present in this verse or in the corresponding English audit note.
    rationale: A concise alternative for the warning is sufficient and avoids importing explanatory material beyond the immediate source.
  revised_text: “Kpacharanụ anya maka ndị odeakwụkwọ[a], ndị chọrọ ịna-ejegharị n’uwe ogologo[b], ndị hụrụ ka a na-ekele ha n’ámá ahịa n’anya, na ịnọ n’oche ndị kachasị mkpa n’ụlọ nzukọ[c], nakwa n’ebe nsọpụrụ n’oriri[d].”
