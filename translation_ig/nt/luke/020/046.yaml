id: LUK.20.46
reference: Luke 20:46
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: ig
  text: “Kpacharanụ anya maka ndị odeakwụkwọ[a], ndị chọrọ ịna-ejegharị n’uwe ogologo[b], ndị hụrụ ka a na-ekele ha n’ámá ahịa n’anya, na ịnọ n’oche ndị kachasị mkpa n’ụlọ nzukọ[c], nakwa n’ebe nsọpụrụ n’oriri[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Lezienụ anya maka ndị odeakwụkwọ.”
    reason: lexical_alternative
  - marker: b
    text: “Uwe ogologo” bụ uwe pụtara ìhè nke pụrụ igosi ọkwa na ùgwù onye yi ya.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “oche ndị isi” n’ụlọ nzukọ.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “ebe ndị kachasị mkpa” n’oriri.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Kpacharanụ anya maka
  rationale: Ngwaa iwu a dị n’ụdị ọtụtụ ma na-adọ ndị na-ege ntị aka ná ntị ka ha lezie anya banyere otu ndị a. Nkebiokwu Igbo a bụ nke e ji asụsụ nkịtị ekwu ịdọ aka ná ntị, ma ọ naghị eme ka okwu ahụ sie ike karịa Grik.
- source_word: γραμματέων
  choice: ndị odeakwụkwọ
  rationale: Nke a na-edobe aha ọrụ ọdịnala a na-ahụ n’Oziọma, kama ịgbasa ya ozugbo ka ọ bụrụ naanị ‘ndị nkuzi Iwu.’ Ihe e dere n’okpuru na-akọwa ọrụ ha ka onye na-agụ ghara iche na ọ bụ ndị odeakwụkwọ nke oge a.
- source_word: τῶν θελόντων περιπατεῖν
  choice: ndị na-achọ ... na-ejegharị
  rationale: ‘Na-achọ’ na-echekwa echiche nke ọchịchọ dị na θελόντων; ‘na-ejegharị’ na-egosi omume ha n’ihu ọha n’enweghị ịgbakwụnye ebumnobi a na-ekwughị kpọmkwem.
- source_word: ἐν στολαῖς
  choice: iji uwe ogologo
  rationale: στολή bụ uwe ogologo e ji egosi ùgwù ma ọ bụ ọkwa. ‘Uwe ogologo’ bụ okwu Igbo doro anya, ebe nkọwa ọdịnala dị n’ihe e dere n’okpuru.
- source_word: φιλούντων ἀσπασμοὺς
  choice: ndị hụrụ ka a na-ekele ha
  rationale: Nke a na-echekwa ike nke ‘ịhụ n’anya’ ma na-eme ka o doo anya n’Igbo na ọ bụ ekele a na-enye ha ka ha na-achọ.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: n’ámá ahịa
  rationale: ἀγορά bụ ebe ahịa na ebe ọha na-ezukọ; ‘ámá ahịa’ na-egosipụta ebe ọha ahụ n’Igbo nke oge a.
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: oche ndị kachasị mkpa n’ụlọ nzukọ
  rationale: Okwu a na-ezo aka n’oche ndị nwere ùgwù kachasị elu n’ụlọ nzukọ ndị Juu. Nsụgharị a na-egosi ọkwa na nsọpụrụ, ọ bụghị naanị ebe oche dị.
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: ọnọdụ nsọpụrụ n’oriri
  rationale: πρωτοκλισία bụ ebe onye a na-asọpụrụ na-anọ ma ọ bụ na-anọdụ n’oriri. ‘Ọnọdụ nsọpụrụ’ na-ebunye ọrụ ọdịnala ya n’Igbo doro anya.
theological_decisions:
- issue: Ịkatọ ndị odeakwụkwọ n’ihe gbasara okpukpe na ọha mmadụ
  choice: E debere okwu ahụ dịka ịdọ aka ná ntị banyere ndị odeakwụkwọ a kọwara site n’ịchọ igosipụta onwe ha na ịchụso nsọpụrụ n’ihu ọha.
  alternative: Ịkọwa ya dịka ikpe a mara onye odeakwụkwọ ọ bụla n’enweghị iche; ma ọ bụ ime ka ọ bụrụ naanị nkatọ banyere ụdị uwe.
  rationale: Nkebiokwu ndị na-esochi ‘ndị odeakwụkwọ’ na-akọwa agwa a na-akatọ. Nsụgharị ahụ anaghị eme ka ikpe ahụ gbasaa karịa omume ndị amaokwu ahụ kpọrọ aha, ma ọ dịghịkwa ebelata ike ịdọ aka ná ntị ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọpụrụ ma dịkwa mfe nghọta. A họọrọ usoro ahịrịokwu na-aga were were ka ndepụta Grik ahụ dịrị ndụ, ma e tinyere akara [a] ruo [d] n’ebe okwu ndị ihe e dere n’okpuru na-akọwa pụtara.
