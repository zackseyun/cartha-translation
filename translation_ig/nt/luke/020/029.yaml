- from: Ya mere, e nwere ụmụnne nwoke asaa. Onye mbụ[a] lụrụ nwanyị, ma nwụọ n’amụtaghị nwa.
  to: Ya mere, e nwere ụmụnne nwoke asaa; onye mbụ lụrụ nwanyị[a] wee nwụọ n’enweghị nwa.
  rationale: The revision preserves the source’s discourse connective, male plural “brothers,” ordinal “the first,” marriage idiom, and childless death. It replaces a potentially gender-inappropriate expression with the natural Standard Igbo phrase “n’enweghị nwa” and moves the footnote marker to the phrase it explains.
