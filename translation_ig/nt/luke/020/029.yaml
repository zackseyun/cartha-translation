  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: ig
  text: Ya mere, e nwere ụmụnne nwoke asaa; onye mbụ lụrụ nwanyị[a] wee nwụọ n’enweghị nwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “were nwanyị.” N’asụsụ Grik, “ịwere nwanyị” bụ akpaalaokwu pụtara ịlụ nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτὰ
  choice: asaa
  rationale: Ọnụọgụ nkịtị na-akọwa ole ụmụnne nwoke ahụ dị.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ ma ọ bụ nkwubi okwu dị nro n’ihe ndị Sadusii na-akọ; ọ naghị egosi oge dịka ‘ugbu a.’
- source_word: ἀδελφοὶ
  choice: ụmụnne nwoke
  rationale: Ụdị ọtụtụ nke nwoke na ọnọdụ a na-ekwu kpọmkwem banyere ụmụ nwoke si n’otu ezinụlọ.
- source_word: ὁ πρῶτος
  choice: Onye mbụ
  rationale: Na-egosi onye mbụ n’usoro, ọ bụghị na ọ bụrịrị ọkpara ma ọ bụ onye kacha okenye.
- source_word: λαβὼν γυναῖκα
  choice: lụrụ nwanyị
  rationale: Nke a bụ akpaalaokwu Grik pụtara ịlụ nwanyị; nsụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: γυναῖκα
  choice: nwanyị
  rationale: N’ọnọdụ alụmdi na nwunye a, okwu ahụ na-ezo aka n’ebe nwunye nọ.
- source_word: ἀπέθανεν
  choice: nwụọ
  rationale: Nsụgharị kwụ ọtọ, dị mfe, nke ngwaa ahụ.
- source_word: ἄτεκνος
  choice: n’amụtaghị nwa
  rationale: Na-egosi na ọ nwụrụ n’enweghị nwa, nke bụ isi ihe dị mkpa n’iwu alụmdi na nwunye a na-atụle.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu. A họọrọ “lụrụ nwanyị” kama ntụgharị mkpụrụokwu n’otu n’otu ka akpaalaokwu ahụ bụrụ ihe onye Igbo ga-aghọta ozugbo; e debere ntụgharị nkịtị na nkọwa ala peeji.
