  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: ig
  text: O zigakwara onye nke atọ[a]; ma ha merụkwara onye a ahụ ma chụpụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, kpọmkwem, “ọ gbakwụnyere iziga onye nke atọ,” bụ akpaalaokwu pụtara “o zigara onye nke atọ” ma ọ bụ “ọ gara n’ihu zigara onye nke atọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: O zigakwara
  rationale: Ngwaa a na infinitive so ya bụ akpaalaokwu pụtara ịga n’ihu ime otu ihe ọzọ. “O zigakwara” na-egosipụta nke ọma na o mere iziga ọzọ, n’Igbo nkịtị.
- source_word: τρίτον πέμψαι
  choice: onye nke atọ
  rationale: Ihe a na-ezigara adịghị n’ahịrị Grik a n’aha, ma amaara ya site n’amaokwu ndị bu ụzọ na ọ bụ ohu. “Onye nke atọ” na-edobe mkpụmkpụ okwu ahụ ma mee ka onye a na-ekwu maka ya doo anya.
- source_word: οἱ δὲ
  choice: ma ha
  rationale: δέ na-egosi ntụgharị megidere ihe onye nwe ubi mere; “ma ha” na-ebute mmeghachi omume ndị ọrụ ubi n’ụzọ doro anya.
- source_word: καὶ τοῦτον
  choice: merụrụkwa onye a
  rationale: Mgbakwunye -kwa na-echekwa ike καί, na-egosi na ha mekwara onye nke atọ ihe ọjọọ dịka ndị bu ya ụzọ.
- source_word: τραυματίσαντες
  choice: merụrụ ... ahụ
  rationale: Nkebiokwu Igbo “imerụ mmadụ ahụ” na-egosi inye ya ọnya ma ọ bụ mmerụ ahụ, kwekọrọ na τραυματίζω.
- source_word: ἐξέβαλον
  choice: chụpụkwa ya
  rationale: “Chụpụ” bụ okwu Igbo ebumpụta ụwa maka ịchụ mmadụ ka ọ pụọ; ọnọdụ akụkọ a na-egosikwa na e ji ike mee ya.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “onye nke atọ” hapụ aha “ohu” ka a ghara ịgbakwunye ihe ederede Grik na-ekwughị kpọmkwem n’amaokwu a, ebe ihe ọ na-ezo aka na ya doro anya site n’ọnọdụ akụkọ.
