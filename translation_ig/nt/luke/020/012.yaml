- from: O zigakwara onye nke atọ[a]; ma ha merụrụkwa onye a ahụ, chụpụkwa ya.
  to: O zigakwara onye nke atọ[a]; ma ha merụkwara onye a ahụ ma chụpụ ya.
  rationale: The revision preserves the source’s contextual ellipsis (“onye nke atọ”), its iterative/continuative sense (“zigakwara”), and the additive force concerning this servant (“merụkwara”). It corrects the final verb to the completed narrative form “chụpụ” and improves coordination of the two hostile actions without adding information.
