  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: ig
  text: Baptizim Jọn ọ̀ sitere n’eluigwe ka ọ̀ sitere n’aka mmadụ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “sitere n’aka Chineke.” N’asụsụ Grik, ọ bụ “sitere n’eluigwe” kpọmkwem, bụ ụzọ nsọpụrụ e si ekwu maka mmalite ma ọ bụ ikike sitere n’aka Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: Baptizim
  rationale: Ọ na-ezo aka n’emume baptizim e jikọtara na Jọn, ọ bụghị naanị n’omume imikpu ma ọ bụ ịsa mmadụ.
- source_word: Ἰωάννου
  choice: Jọn
  rationale: N’usoro Igbo, ịtụkwasị aha Jọn n’azụ ‘Baptizim’ na-egosi baptizim e jikọtara ya na Jọn n’enweghị mkpa akara nwe.
- source_word: ἐξ οὐρανοῦ
  choice: sitere n’eluigwe
  rationale: Nke a na-edobe okwu Grik ahụ n’ụzọ doro anya, tinyere ụzọ nsọpụrụ ndị Juu si ekwu maka mmalite ma ọ bụ ikike sitere n’aka Chineke.
- source_word: ἐξ ἀνθρώπων
  choice: sitere n’aka mmadụ
  rationale: ‘Mmadụ’ bụ okwu Igbo na-anọchi mmadụ niile n’ozuzu; ebe a ọ na-egosi mmalite ma ọ bụ ikike nke mmadụ, megide nke eluigwe.
- source_word: ἦν
  choice: ò sitere
  rationale: Ọ bụ ezie na Grik ji ngwaa njikọ pụtara ‘dị/bụ,’ Igbo na-ekwukarị ajụjụ banyere isi mmalite n’ụzọ ebumpụta ụwa site n’iji ‘sitere.’
- source_word: ἢ
  choice: ka
  rationale: '‘Ka’ na-ejikọta nhọrọ abụọ n’ajụjụ Igbo: ma nke mbụ ka ọ bụ nke abụọ.'
theological_decisions:
- issue: Ihe ‘sitere n’eluigwe’ pụtara banyere baptizim Jọn
  choice: Debere ‘sitere n’eluigwe’ n’ahịrịokwu bụ isi.
  alternative: sitere n’aka Chineke
  rationale: Nkebiokwu ahụ na-egosi mmalite ma ọ bụ ikike Chineke, ma Grik kwuru ‘eluigwe’ kpọmkwem. Idebe ya na-echekwa akpaalaokwu nsọpụrụ ahụ ma ghara ịkọwa ya karịa ihe ederede kwuru.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. E ji ‘ò ... ka ò ...?’ mee ajụjụ nhọrọ abụọ n’ụzọ dabara n’Igbo; e tinyere akara ụda na ‘ò’ iji mee ka ajụjụ ahụ doo anya.
