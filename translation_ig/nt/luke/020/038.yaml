source:
  edition: SBLGNT
  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: ig
  text: Ma Chineke abụghị Chineke nke ndị nwụrụ anwụ, kama ọ bụ Chineke nke ndị dị ndụ, n’ihi na mmadụ niile dị ndụ nye ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na mmadụ niile dị ndụ n’ihu ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: θεὸς
  choice: Chineke
  rationale: Ọ bụ ezie na okwu Grik a enweghị artikul, ọnọdụ ya n’okwu banyere otu Chineke nke Izrel na-egosi na ọ bụ Chineke ahụ kpọmkwem, ọ bụghị ‘otu chi.’
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi njikọ na ntụgharị dị nro n’ihe Jizọs na-ekwu, n’enweghị itinye echiche oge dịka ‘ugbu a.’
- source_word: νεκρῶν
  choice: ndị nwụrụ anwụ
  rationale: Nke a na-asụgharị okwu ahụ e ji dịka aha maka ndị nwụrụ anwụ, ma na-edobe ọdịiche ya na ndị dị ndụ.
- source_word: ζώντων
  choice: ndị dị ndụ
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi kwuo participle ahụ e ji dịka aha, ma na-edobe nhata ya na ‘ndị nwụrụ anwụ.’
- source_word: πάντες
  choice: mmadụ niile
  rationale: Okwu a na-edobe obosara ‘niile’ dị na Grik n’ebughị ụzọ kpebie ma ọ bụ naanị ndị nna ochie a kpọtụrụ aha ka ọ na-ezo aka na ha.
- source_word: αὐτῷ
  choice: n’ebe ọ nọ
  rationale: Dative Grik ahụ dị mkpirikpi ma nwee ọtụtụ ụzọ a pụrụ isi ghọta ya. ‘N’ebe ọ nọ’ na-egosi ịdị ndụ n’ihe metụtara Chineke n’emeghị ka ọ pụta ihe dịka ibi ndụ maka nzube ya.
- source_word: ζῶσιν
  choice: na-adị ndụ
  rationale: Nke a na-egosipụta present active nke ọma ma na-asụ Igbo n’ụzọ eke.
theological_decisions:
- issue: Ihe αὐτῷ pụtara n’ahịrịokwu πάντες γὰρ αὐτῷ ζῶσιν
  choice: n’ihi na mmadụ niile na-adị ndụ n’ebe ọ nọ
  alternative: n’ihi na mmadụ niile dị ndụ n’ihu ya
  rationale: Nhọrọ bụ isi na-edobe echiche mmekọrịta mmadụ na Chineke nke dative ahụ nwere, ebe ihe odide ala peeji na-enye ụzọ ọzọ a ma ama isi ghọta ya. Nke a anaghị ekpebi n’ụzọ karịrị ihe Grik kwuru ma ọ bụ tinye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ọdịiche dị n’etiti ‘ndị nwụrụ anwụ’ na ‘ndị dị ndụ,’ ma zere asụsụ otu ụka ma ọ bụ nkọwa ozizi pụrụ iche.
