review_pass:
  verdict: revise
  source_fidelity: 'The principal contrast is conveyed accurately: God is not God of the dead but of the living. The final clause should render ζῶσιν as a present state (''dị ndụ'') rather than the progressive/habitual ''na-adị ndụ.'' Also, αὐτῷ is more directly retained by ''nye ya'' than by the locative ''n’ebe ọ nọ.'''
  naturalness: The revised wording is idiomatic Standard Igbo and retains the solemn, concise register of the saying. 'Ma' adequately represents the mild connective δέ.
  terminology: '''Chineke,'' ''ndị nwụrụ anwụ,'' and ''ndị dị ndụ'' are accurate, natural, and suitably parallel. ''Mmadụ niile'' maintains the broad wording of πάντες without introducing a doctrinal qualification.'
  issues:
  - severity: medium
    issue: The main text uses 'na-adị ndụ n’ebe ọ nọ' for πάντες γὰρ αὐτῷ ζῶσιν.
    rationale: '''Na-adị ndụ'' can suggest ongoing or habitual living, whereas the Greek present here states that they are living. ''N’ebe ọ nọ'' changes the compact dative relation into a locative expression. ''Dị ndụ nye ya'' is both more natural in this context and closer to the source while leaving the dative''s nuance open.'
  revised_text: Ma Chineke abụghị Chineke nke ndị nwụrụ anwụ, kama ọ bụ Chineke nke ndị dị ndụ, n’ihi na mmadụ niile dị ndụ nye ya.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na mmadụ niile dị ndụ n’ihu ya.”
    reason: alternative_reading
  revision_rationale: 'The revision preserves the source''s contrast and ambiguity while improving the final clause: ''dị ndụ'' expresses the present assertion, and ''nye ya'' more closely reflects αὐτῷ than a locative phrase. The alternative footnote remains a legitimate contextual rendering of the dative.'
