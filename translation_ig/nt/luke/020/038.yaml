- from: Ma Chineke abụghị Chineke nke ndị nwụrụ anwụ, kama ọ bụ Chineke nke ndị dị ndụ, n’ihi na mmadụ niile na-adị ndụ n’ebe ọ nọ.[a]
  to: Ma Chineke abụghị Chineke nke ndị nwụrụ anwụ, kama ọ bụ Chineke nke ndị dị ndụ, n’ihi na mmadụ niile dị ndụ nye ya.[a]
  rationale: 'The revision preserves the source''s contrast and ambiguity while improving the final clause: ''dị ndụ'' expresses the present assertion, and ''nye ya'' more closely reflects αὐτῷ than a locative phrase. The alternative footnote remains a legitimate contextual rendering of the dative.'
  reviewer_model: gpt-5.6-terra
