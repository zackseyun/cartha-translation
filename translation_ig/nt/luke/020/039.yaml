- from: Mgbe ahụ, ụfọdụ ndị odeakwụkwọ zara ya, sị, “Onye Ozizi, i kwuru nke ọma.”[a]
  to: Mgbe ahụ, ụfọdụ ndị odeakwụkwọ zara, sị, “Onye Ozizi, i kwuru nke ọma.”[a]
  rationale: The revision removes an unstated object from the response verb and refines the lexical footnote so that it directly reflects the possible ‘rightly/correctly’ force of καλῶς while preserving the source’s commendation of Jesus’ speaking.
