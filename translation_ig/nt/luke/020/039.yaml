  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: ig
  text: Mgbe ahụ, ụfọdụ ndị odeakwụkwọ zara, sị, “Onye Ozizi, i kwuru nke ọma.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Onye Ozizi, i kwuru n’ụzọ ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: zara ya
  rationale: Nkebi ngwaa a na-egosi nzaghachi e nyere n'okwu; ‘zara ya’ bụ ụzọ Igbo si ekwu ya nke ọma n'akụkọ, ebe ‘ya’ na-eme ka onye a zara doo anya.
- source_word: δέ
  choice: Mgbe ahụ
  rationale: δέ na-egosi ntakịrị ngafe n'akụkọ. ‘Mgbe ahụ’ jikọtara nzaghachi a na arụmụka Jizọs kwuru tupu ya, n'etinyeghị esemokwu siri ike.
- source_word: τινες τῶν γραμματέων
  choice: ụfọdụ ndị odeakwụkwọ
  rationale: ‘Ụfọdụ’ na-egosi na ọ bụ naanị akụkụ nke ìgwè ndị odeakwụkwọ ahụ kwuru okwu, dịka usoro partitive nke Grik si dị.
- source_word: γραμματέων
  choice: ndị odeakwụkwọ
  rationale: Nke a bụ aha Baịbụl a na-ejikarị eme γραμματεῖς; ọ na-echekwa aha otu ahụ n'agbanyeghị na ọrụ ha gụnyere ịma na ịkụzi Iwu.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Nke a na-enye kpọmkwem echiche nke onye na-akụzi, ma na-arụ ọrụ dị ka okwu a na-akpọ mmadụ kpọmkwem.
- source_word: καλῶς
  choice: nke ọma
  rationale: ‘Nke ọma’ bụ okwu Igbo dị n'okike nke nwere ike ịja ma ịdị mma e si kwuo okwu ma izi ezi ya, si otú a chekwaa obosara καλῶς.
- source_word: εἶπας
  choice: i kwuru
  rationale: Aorist Grik na-ezo aka n'okwu Jizọs ka kwuru; oge gara aga dị mfe, ‘i kwuru,’ bụ nke doro anya ma dị n'okike n'Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ùgwù ma dị mfe nghọta. E ji ‘ndị odeakwụkwọ’ debe aha otu ahụ n'usoro Baịbụl; e ji ‘Onye Ozizi’ mee Διδάσκαλε n'ụzọ doro anya. Akara nkọwa ala [a] dị n'isiokwu ma na-echekwa ohere καλῶς nwere ịpụta ma ‘nke ọma’ ma ‘n'ụzọ ziri ezi.’
