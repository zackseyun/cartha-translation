id: LUK.20.20
reference: Luke 20:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: ig
  text: Ha lechara Jizọs anya nke ọma, wee ziga ndị nledo, ndị mere ka hà bụ ndị ezi omume, ka ha jide ya n’okwu o kwuru[a], ka ha wee nyefee ya n'aka ọchịchị na ikike nke gọvanọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ nkịtị karị: “ka ha jide ya n’okwu” ma ọ bụ “ka ha jide okwu ya.”'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “nyefee ya n''aka ọchịchị na ikike ọchịchị nke gọvanọ.” Okwu abụọ ahụ e jikọtara ọnụ na-egosi ọchịchị na ikike gọvanọ n’ọrụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: Ha nọ na-ele Jizọs anya nke ọma
  rationale: Na-egosi nlekọta nzuzo nwere ebumnuche ọjọọ; a kpọrọ Jizọs aha site n'ihe gbara amaokwu ahụ gburugburu ka Igbo wee doo anya.
- source_word: ἐγκαθέτους
  choice: ndị nledo
  rationale: Na-akọwa ndị e tinyere na nzuzo ka ha nweta ihe a ga-eji jide mmadụ.
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: ndị mere onwe ha ka ndị ezi omume
  rationale: Na-echekwa echiche nke igosi onwe ha n'ụzọ aghụghọ dị ka ndị omume ha ziri ezi.
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: ka ha nwee ike ijide ya n'okwu o kwuru
  rationale: Ọ bụ akpaalaokwu gbasara iji okwu mmadụ mee ihe ga-eji maa ya ikpe, ọ bụghị ijide okwu n'ụzọ nkịtị.
- source_word: ὥστε
  choice: si otú ahụ
  rationale: Na-egosi nsonaazụ ma ọ bụ nzube nke ọnyà ahụ n'Igbo dị mfe.
- source_word: παραδοῦναι
  choice: nyefee ya n'aka
  rationale: Okwu a dabara n'ọnọdụ ikpe ma na-egosi inyefe mmadụ n'aka ikike ọzọ.
- source_word: τῇ ἀρχῇ
  choice: ọchịchị
  rationale: Na-egosi ọchịchị ma ọ bụ ikike ịchị; e debere ya iche na ἐξουσία.
- source_word: τῇ ἐξουσίᾳ
  choice: ikike
  rationale: Na-egosi ikike iwu kwadoro ma ọ bụ ikike ime ihe.
- source_word: τοῦ ἡγεμόνος
  choice: nke gọvanọ
  rationale: Ọ bụ aha doro anya, nke ndị Igbo nke oge a na-aghọta, maka onye ọchịchị ógbè Rom.
theological_decisions:
- issue: Ntughari δίκαιος n'ọnọdụ ndị na-eme ka hà bụ ndị omume ziri ezi
  choice: ndị ezi omume
  alternative: ndị ziri ezi
  rationale: “Ndị ezi omume” na-echekwa ụda omume na okpukpe nke okwu ahụ, ma ọ naghị ekwu na ha bụ n'ezie ndị dị otú ahụ n'ihi na ahịrịokwu ahụ kwuru na ha mere onwe ha ka ha bụrụ ya.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “wee” jikọta omume ndị ahụ n'ụzọ eke; e chekwara ọdịiche dị n'etiti “ọchịchị” na “ikike.”
