  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: ig
  text: 'Ha wee sị ya, “Gwa anyị: Ọ bụ n''ikike dị aṅaa ka ị ji eme ihe ndị a? Ma ọ bụ, ònye bụ onye nyere gị ikike a?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ha wee
  rationale: ‘Wee’ bụ njikọ akụkọ a na-ahụkarị n'Igbo, na-ejikọta ajụjụ a na ihe mere tupu ya n'etinyeghị nkọwa ọzọ.
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: sị ya
  rationale: Nke a na-enye echiche nke okwu mmeghe Grik ahụ n'ụzọ Igbo dị nkenke ma dị ndụ, na-ezere ikwughachi ‘kwuo’ ugboro abụọ.
- source_word: Εἰπὸν ἡμῖν
  choice: Gwa anyị
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi isi kwuo iwu ahụ ka mmadụ mee ka ha mara ihe.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: Ọ bụ n'ikike dị aṅaa ... ka
  rationale: Usoro a na-egosi ntọala ma ọ bụ ikike e ji eme ihe, ma na-edobe ụdị ajụjụ Grik ahụ nke na-ajụ ụdị ikike ahụ.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-edobe ọtụtụ ihe nke okwu Grik ahụ ma na-arụtụ aka n'ihe Jizọs mere n'oge ahụ.
- source_word: ποιεῖς
  choice: ị ji eme
  rationale: Ụdị a dabara n'ajụjụ gbasara ihe onye ahụ na-eme ugbu a ma na-asụkwa nke ọma n'Igbo.
- source_word: ἢ
  choice: Ma ọ bụ
  rationale: Ọ na-ewebata ajụjụ nke abụọ dịka ụzọ ọzọ e si jụọ otu okwu ahụ.
- source_word: τίς ἐστιν ὁ δούς
  choice: ònye bụ onye nyere
  rationale: Ọ na-edobe nkwupụta doro anya nke articular participle ahụ—‘onye nyere’—karịa ime ka ọ bụrụ naanị ‘ònye nyere?’
- source_word: σοι
  choice: gị
  rationale: Igbo na-etinye onye natara ihe ozugbo n'azụ ngwaa ‘nyere’.
- source_word: τὴν ἐξουσίαν ταύτην
  choice: ikike a
  rationale: ‘Ikike’ na-egosi ikike ziri ezi ma ọ bụ ikike e nyere mmadụ, ọ bụghị naanị ike anụ ahụ; ‘a’ na-edobe demonstrative ahụ.
theological_decisions:
- issue: Ihe ἐξουσία pụtara n'ịma aka Jizọs banyere ihe o mere n'ụlọ nsọ
  choice: ikike
  alternative: ike; ikike ime ihe
  rationale: Ndị ndú ahụ na-ajụ ma Jizọs ò nwere ikike ziri ezi ime ihe ndị ahụ nakwa onye nyere ya ya. ‘Ikike’ na-edobe echiche a nke nnabata na ikike e nyere mmadụ, kama ime ka ọ bụrụ naanị ike mmadụ nwere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘Ha wee sị ya’ mee ka okwu mmeghe ahụ bụrụ nke e ji asụ Igbo n'ụzọ nkịtị; e debeghị redundancy nke εἶπαν λέγοντες n'ụzọ osisi. E tinyere akara ụda ebe ha bara uru, dịka ‘dị aṅaa’ na ‘ònye,’ n'enweghị ime ka ederede sie onye nkịtị ike.
