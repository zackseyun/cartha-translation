source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: ig
  text: Ya mere, ná mbilite n’ọnwụ[a], nwaanyị ahụ ga-abụ nwunye onye n’ime ha[b]? N’ihi na ndị ikom asaa ahụ nwere ya dịka nwunye[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na mbilite n’ọnwụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ọ ga-abụ nwunye nke onye n’ime ha?”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “ndị ikom asaa ahụ lụrụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: nwaanyị ahụ
  rationale: N'ebe mbụ a, γυνή na-ezo aka n'anyịanyị a na-ekwu maka ya; “nwaanyị ahụ” bụ Igbo doro anya, ebe e ji “nwunye” gosipụta mmekọrịta alụmdi na nwunye n'azụ ahịrịokwu ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nzọụkwụ nkwubi okwu n'ajụjụ ndị Sadusii; “Ya mere” na-edobe njikọ arụmụka ahụ n'Igbo nkịtị.
- source_word: ἐν τῇ ἀναστάσει
  choice: ná mbilite n’ọnwụ
  rationale: Nke a na-asụgharị okwu mbilite n'ọnwụ n'ụzọ kwụ ọtọ, n'etinyeghị nkọwa ozizi ọzọ; akara olu dị na “ná” na-enyere aka ịmata ya dị ka preposition.
- source_word: τίνος αὐτῶν
  choice: onye n’ime ha
  rationale: Usoro a na-egosi onye n'etiti ndị ahụ nwaanyị ahụ ga-abụ nwunye ya, ma na-ada nke ọma n'Igbo.
- source_word: γίνεται γυνή
  choice: ga-abụ nwunye
  rationale: “Ga-abụ” na-echekwa echiche γίνομαι nke ịghọ ma ọ bụ ịbịa n'ọnọdụ ahụ; “nwunye” na-egosi kpọmkwem ihe γυνή pụtara n'ebe a.
- source_word: οἱ γὰρ ἑπτὰ
  choice: N’ihi na ndị ikom asaa ahụ
  rationale: “N’ihi na” na-anọchi γάρ; “ndị ikom asaa ahụ” na-eme ka ndị a kpọtụrụla aha doo anya n'Igbo, na-agbakwụghị okwu “niile” n'akụkụ numeral a.
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: ndị ikom asaa ahụ niile lụrụ ya
  rationale: N'Igbo nkịtị, “lụrụ ya” na-egosi na onye ọ bụla n'ime ndị ikom asaa ahụ nwere ya dịka nwunye. “Niile” na-eme ka nkesa ahụ doo anya, ọ bụghị ịgbakwunye onye ọzọ n'ọnụọgụ asaa ahụ.
theological_decisions:
- issue: Ihe asụsụ mbilite n’ọnwụ pụtara n’ajụjụ ndị Sadusii
  choice: A sụgharịrị ἀνάστασις naanị dịka “mbilite n’ọnwụ.”
  alternative: “mbilite ndị nwụrụ anwụ”
  rationale: Amaokwu ahụ n'onwe ya ekwughị okwu nkọwa ọzọ. Nsụgharị a na-edobe ụzọ ndị Sadusii siri kwuo ajụjụ ahụ, n'enweghị ịgbakwunye nkọwa ozizi sitere n'akụkụ amaokwu ndị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Nwaanyị” na “nwunye” kewara ihe γυνή pụtara n’ebe abụọ ahụ. A họọrọ “lụrụ ya” n'ahịrịokwu ikpeazụ maka ịdị eke n'Igbo, ebe nkọwa ala peeji na-echekwa usoro okwu Grik nke pụtara “nwere ya dịka nwunye.”
