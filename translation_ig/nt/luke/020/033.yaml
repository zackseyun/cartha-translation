revisions:
- from: Ya mere, ná mbilite n’ọnwụ[a], nwaanyị ahụ ga-abụ nwunye onye n’ime ha[b]? N’ihi na ndị ikom asaa ahụ niile lụrụ ya[c].
  to: Ya mere, ná mbilite n’ọnwụ[a], nwaanyị ahụ ga-abụ nwunye onye n’ime ha[b]? N’ihi na ndị ikom asaa ahụ nwere ya dịka nwunye[c].
  rationale: The revision replaces “lụrụ ya” with “nwere ya dịka nwunye” to retain the Greek marital-status idiom, and removes the unexpressed “niile.” The resurrection wording and the woman/wife distinction are retained. Footnote a is made a genuine, noninterpretive prepositional alternative; footnote c now identifies “lụrụ ya” as a possible idiomatic alternative rather than presenting the closer Greek wording as merely a note.
