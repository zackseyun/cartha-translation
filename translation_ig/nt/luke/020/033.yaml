review_pass:
  verdict: revise
  source_fidelity: 'The first clause conveys the Sadducees’ question well: “nwaanyị ahụ” appropriately renders the first γυνή, and “ga-abụ nwunye onye n’ime ha?” represents γίνεται γυνή and τίνος αὐτῶν without adding doctrinal interpretation. In the final clause, however, “lụrụ ya” changes ἔσχον αὐτὴν γυναῖκα (“had her as wife”) from a marital-status idiom to the act of marrying. “niile” is also not expressed in οἱ ἑπτά (“the seven”).'
  naturalness: The revised wording is natural, clear Standard Igbo. “Nwere ya dịka nwunye” is intelligible and accurately preserves the Greek idiom; it is slightly formal, which suits the register.
  terminology: “Mbilite n’ọnwụ” is the established, appropriately plain rendering of ἀνάστασις. The distinction between “nwaanyị” in the initial reference and “nwunye” in the marital predicate is sound. “Ya mere” is acceptable for οὖν, though it has somewhat stronger inferential force than English “then”; it does not materially distort the question.
  issues:
  - severity: medium
    issue: The final verb “lụrụ ya” renders an act of marriage rather than the Greek expression for having her as a wife.
    rationale: ἔσχον αὐτὴν γυναῖκα uses ἔχω with γυναῖκα to describe the marital relationship. “Nwere ya dịka nwunye” preserves this sense.
  - severity: low
    issue: “niile” adds explicit totality not stated by οἱ ἑπτά.
    rationale: The definite phrase means “the seven”; the context entails the seven brothers, but the translation need not add “all.”
  - severity: low
    issue: Footnote a’s proposed alternative introduces unnecessary future wording.
    rationale: “mgbe mbilite n’ọnwụ ga-adị” is not a close alternative for ἐν τῇ ἀναστάσει. “na mbilite n’ọnwụ” preserves the same phrase naturally.
