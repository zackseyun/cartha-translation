id: LUK.20.5
reference: Luke 20:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: ig
  text: Ma ha tụgharịrị uche n’etiti onwe ha, na-asị, “Ọ bụrụ na anyị asị, ‘O si n’eluigwe,’ ọ ga-asị, ‘Gịnị mere unu ekweghị ya?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο
  choice: tụgharịrị uche
  rationale: Nke a na-egosipụta ịtụgharị uche na ịtụle azịza ha nke ọma, ya bụ echiche na mgbakọ dị n’okwu Grik ahụ, ma bụrụkwa Igbo nkịtị.
- source_word: πρὸς ἑαυτοὺς
  choice: n’etiti onwe ha
  rationale: Ọ na-egosi na ha na-atụkọrịta uche n’ime otu ha, ọ bụghị na onye ọ bụla na-eche naanị ya.
- source_word: λέγοντες
  choice: na-asị
  rationale: Ọ na-egosi ihe ha nọ na-ekwu n’otu oge ha na-atụgharị uche.
- source_word: Ἐὰν εἴπωμεν
  choice: Ọ bụrụ na anyị asị
  rationale: Nke a na-edobe ọnọdụ a na-atụ anya ya n'ụzọ doro anya ma bụrụkwa okwu Igbo sitere n’ọnụ mmadụ.
- source_word: Ἐξ οὐρανοῦ
  choice: O si n’eluigwe
  rationale: A hapụrụ akpaalaokwu Grik nke na-egosi mmalite ma ọ bụ ikike Chineke n’akọwaghị ya ozugbo dị ka ‘n’aka Chineke.’
- source_word: ἐρεῖ
  choice: ọ ga-asị
  rationale: Ọ bụ ntụgharị kpọmkwem nke ngwaa ahụ; ajụjụ so ya na-egosipụta na ihe o kwuru bụ ajụjụ.
- source_word: Διὰ τί
  choice: Gịnị mere
  rationale: Nke a bụ ụzọ Igbo nkịtị si ajụ ‘n’ihi gịnị?’
- source_word: ἐπιστεύσατε αὐτῷ
  choice: unu ekweghị ya
  rationale: πιστεύω tinyere onye n’ọnọdụ dative pụtara ikwere ihe onye ahụ kwuru ma ọ bụ ịtụkwasị ya obi; ‘ikwere ya’ dabara n’ihe Jọn gbara akaebe ma zere echiche sara mbara nke ‘ikwere na ya.’
theological_decisions:
- issue: Ihe ‘O si n’eluigwe’ pụtara banyere isi mmalite baptizim Jọn
  choice: O si n’eluigwe
  alternative: O si n’aka Chineke
  rationale: Okwu Grik ji ‘eluigwe’ mee okwu nkwanye ùgwù na-egosi ikike Chineke. Idebe ya otu a na-echekwa akpaalaokwu na nghọta okpukpe ya n’etinyeghị nkọwa n’ime amaokwu ahụ.
- issue: Udi nkwenye a jụrụ banyere Jọn
  choice: unu ekweghị ya
  alternative: unu atụkwasịghị ya obi
  rationale: Ihe gbara amaokwu ahụ gburugburu na-elekwasị anya n’ịnabata okwu ma ọ bụ akaebe Jọn. ‘Ekweghị ya’ na-echekwa nke a, ebe ‘ịtụkwasị ya obi’ ka bụ ihe ngwaa ahụ nwekwara ike ịpụta.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘tụgharịrị uche n’etiti onwe ha’ iji chekwaa echiche nke ịtụle na ịgba izu n’otu, n’agbanyeghị na ‘kparịtara ụka’ ga-adịkwu mkparịta ụka ma ghara igosipụta akụkụ mgbakọ ahụ nke ọma.
