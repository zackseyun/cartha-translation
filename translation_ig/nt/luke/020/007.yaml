  text: καὶ ἀπεκρίθησαν μὴ εἰδέναι πόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: ig
  text: Ha wee zaa na ha amaghị ebe o si bịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe o si.” Okwu Grik ahụ na-ajụ banyere mmalite ma ọ bụ isi iyi ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: N'usoro akụkọ Igbo, “wee” na-ejikọta nzaghachi a na ihe bu ya ụzọ n'ụzọ dị nro ma na-egosipụta ihe sochiri ya.
- source_word: ἀπεκρίθησαν
  choice: Ha ... zaa
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke nkịtị isi kwuo na ha nyere azịza.
- source_word: μὴ εἰδέναι
  choice: na ha amaghị
  rationale: Infinitive a na μή na-arụ ọrụ dị ka okwu a kọrọ mgbe ngwaa ‘zaa’ gasịrị; “na ha amaghị” bụ Igbo ebumpụta ụwa ma debe ihe ọ pụtara.
- source_word: πόθεν
  choice: ebe o si bịa
  rationale: Ọ na-egosi ebe ihe ahụ sitere ma ọ bụ mmalite ya. Nnochiaha “o” na-alaghachi n'ihe a na-ajụ banyere ya n'okwu ndị bu ụzọ n'ebughị ụzọ kọwaa ya karịa ihe Grik kwuru.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. E debere mkpụmkpụ na mgbagwoju anya nke azịza Grik ahụ, ebe ihe nnochiaha ahụ na-ezo aka na ya sitere n'ọnọdụ okwu bu ụzọ.
