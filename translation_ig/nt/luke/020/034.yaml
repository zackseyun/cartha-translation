review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders αἰών as “oge” and retains the active/passive contrast between γαμοῦσιν and γαμίσκονται. However, the footnote inaccurately glosses υἱοί as “Ụmụ ndị nwoke” (“male children/sons”); the Greek word itself means “sons,” not “sons of males.” The marriage wording can also be made more idiomatic while retaining the conventional active/passive pairing.
  naturalness: “A na-enyekwa ha n’alụmdi na nwunye” is understandable but less natural in this context. “A na-enyekwa ha ka ha lụọ di” clearly expresses the passive/conventional counterpart in natural Standard Igbo. “Ụmụ nke oge a” retains the source image more smoothly than “Ụmụ oge a.”
  terminology: “Oge a” appropriately preserves the eschatological sense of τοῦ αἰῶνος τούτου. “Alụ nwanyị” and “a na-enye ... ka ha lụọ di” preserve the source’s paired conventional marriage idiom without treating the Greek masculine representative expression as exclusively male.
  issues:
  - severity: medium
    issue: The footnote says the Greek is “Ụmụ ndị nwoke nke oge a.”
    rationale: υἱοὶ means “sons”; it does not mean “sons of males.” The note should accurately identify it as a masculine plural representative expression.
  - severity: low
    issue: The passive marriage expression is somewhat unnatural.
    rationale: “A na-enyekwa ha ka ha lụọ di” is a clearer Standard Igbo expression for being given in marriage and maintains the contrast with the preceding active verb.
  revised_text: Jizọs wee sị ha, “Ụmụ nke oge a[a] na-alụ nwanyị, a na-enyekwa ha ka ha lụọ di.”
  revised_footnotes:
