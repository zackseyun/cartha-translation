  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: ig
  text: Jizọs wee sị ha, “Ụmụ nke oge a[a] na-alụ nwanyị, a na-enyekwa ha ka ha lụọ di.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ndị nke oge a.” N’asụsụ Grik, ọ bụ “ụmụ nke oge a,” bụ okwu nwoke e ji nọchite anya ndị niile so n’oge ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: wee
  rationale: “Wee” bụ njikọ akụkọ a na-ejikarị n’Igbo egosi ihe sochiri n’usoro, na-agbakwụnyeghị nkọwa karịrị njikọ Grik ahụ.
- source_word: εἶπεν αὐτοῖς
  choice: sị ha
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma kwekọọ kpọmkwem n’echiche nke ‘ọ sịrị ha’; e tinyeghị ‘zara’ n’ihi na ngwaa Grik n’onwe ya apụtaghị ya kpọmkwem.
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: Ụmụ oge a
  rationale: “Ụmụ oge a” na-edobe akpaalaokwu nke ịbụ ụmụ ndị e ji otu oge mara. N’Igbo, “ụmụ” nwere ike ịgụnye mmadụ niile, ebe Grik ji ụdị okwu nwoke mee nnọchianya maka ndị niile nke oge a; a kọwara nke a n’ala peeji.
- source_word: γαμοῦσιν
  choice: na-alụ di na nwunye
  rationale: Nke a bụ okwu Igbo zuru mmadụ ọnụ maka ịlụ, nke na-ezere ime ka ahịrịokwu ahụ bụrụ naanị maka nwoke ma ọ bụ naanị maka nwanyị.
- source_word: γαμίσκονται
  choice: a na-enyekwa ha n’alụmdi na nwunye
  rationale: Nhọrọ a na-edobe olu nnara nke ngwaa Grik ma na-echekwa ọdịiche ya na ngwaa mbu nke pụtara na ha onwe ha na-alụ.
theological_decisions:
- issue: Okwu nwoke e ji nọchite anya mmadụ niile
  choice: Ụmụ oge a[a]
  alternative: Ndị oge a
  rationale: A hapụrụ ihe oyiyi nke ‘ụmụ’ dị n’asụsụ Grik kama ime ya naanị ‘ndị.’ Ma ebe “ụmụ” n’Igbo anaghị egosi nwoke naanị, ala peeji na-eme ka onye na-agụ mara na Grik kwuru kpọmkwem ‘ụmụ ndị nwoke’ dị ka okwu nnọchianya.
- issue: αἰών dị ka oge ma ọ bụ usoro nke ụwa ugbu a
  choice: oge a
  alternative: ụwa a
  rationale: “Oge a” na-echekwa ọdịiche dị n’etiti oge ugbu a na oge na-abịa, nke bụ isi okwu Jizọs n’amaokwu ndị gbara ya gburugburu. “Ụwa a” nwere ike ime ka a ghọta ya dị ka ụwa a na-ahụ anya.
- issue: Ọdịiche dị n’etiti ngwaa ịlụ na ịbụ onye e nyere n’alụmdi na nwunye
  choice: na-alụ di na nwunye, a na-enyekwa ha n’alụmdi na nwunye
  alternative: na-alụ di na nwunye
  rationale: E debere akụkụ abụọ ahụ ka ọdịiche nke olu ọrụ na olu nnara dị na Grik ghara ịla n’iyi, n’agbanyeghị na ha abụọ na-ekwu banyere alụmdi na nwunye.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “alụmdi na nwunye” mee ka okwu alụmdi na nwunye doo anya, ma e zere okwu ụka pụrụ iche ma ọ bụ nkọwa ga-ekpebi esemokwu nke isi mmalite ahụ na-ekpebighị.
