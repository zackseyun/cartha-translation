    reason: lexical_alternative
  revision_rationale: E dezie ala peeji ka ọ kọwaa okwu Grik ahụ n’eziokwu, ma dozie okwu banyere ịbụ onye e nyere n’alụmdi na nwunye ka ọ bụrụ Igbo Izugbe na-adị mfe karịa. “Oge a” na ọdịiche dị n’etiti ịlụ nwanyị na ịbụ onye e nyere ka ọ lụọ di ka edobere.
