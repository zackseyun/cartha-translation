  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: ig
  text: Ya mere, Devid na-akpọ ya Onyenwe; oleezi otú ọ si bụrụ nwa Devid?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δαυὶδ
  choice: Devid
  rationale: Ụdị aha a na-ejikarị eme ihe n'Igbo maka Devid.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'amaokwu ahụ e hotara na arụmụka bu ya ụzọ.
- source_word: αὐτὸν κύριον
  choice: na-akpọ ya “Onyenwe ya”
  rationale: Nke a na-egosipụta omume ịkpọ onye ahụ κύριος, ma na-edobe ịdị arọ nke aha nsọpụrụ ahụ n'arụmụka gbasara Mesaịa.
- source_word: καλεῖ
  choice: na-akpọ
  rationale: Ọ bụ ntụgharị dị mfe ma bụrụkwa nke e ji ekwu okwu n'Igbo maka ngwaa dị n'oge ugbu a.
- source_word: πῶς
  choice: oleezi otú
  rationale: Ọ na-ebute ajụjụ nrụrịta ụka nke ọma; “-zi” na-ejikọta ya n'ụzọ ebumpụta ụwa na nkwubi okwu bu ya ụzọ.
- source_word: αὐτοῦ υἱός
  choice: nwa ya
  rationale: Ọ na-edobe okwu doro anya nke Grik, “nwa ya,” kama ịgbasa ya n'ahịrị bụ “nwa sitere n'agbụrụ ya.”
- source_word: ἐστιν
  choice: o si bụrụ
  rationale: N'ime ajụjụ Igbo a, usoro a na-egosipụta “is” n'ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Ịsụgharị κύριος n'arụmụka gbasara Mesaịa/Kraịst
  choice: Onyenwe ya
  alternative: Nna ukwu ya
  rationale: “Onyenwe ya” na-edobe ma ihe okwu ahụ pụtara ma ịdị elu na nsọpụrụ Devid nyere onye ahụ, n'etinyeghị nkọwa karịrị ihe amaokwu ahụ kwuru.
- issue: Ma a ga-agbasa υἱός ka ọ bụrụ onye sitere n'agbụrụ Devid
  choice: nwa ya
  alternative: onye sitere n'agbụrụ ya
  rationale: Arụmụka ahụ dabere n'okwu filiashọn doro anya bụ υἱός. “Nwa ya” na-echekwa esemokwu dị n'okwu ahụ kama idozi ya n'ime ntụgharị.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro ajụjụ ebumpụta ụwa “oleezi otú o si bụrụ” chekwaa ike ajụjụ nrụrịta ụka ahụ. Akara nkọwa ala peeji [a] dị n'ederede isi.
