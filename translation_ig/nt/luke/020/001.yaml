id: LUK.20.1
reference: Luke 20:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: ig
  text: O wee ruo otu ụbọchị n’ime ụbọchị ndị ahụ, mgbe ọ nọ na-akụziri ndị mmadụ ihe n’ụlọ nsọ[b] ma na-ekwusara ha ozi ọma[a], ndị isi nchụaja na ndị odeakwụkwọ Iwu, ha na ndị okenye, bịakwutere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-ekwusa oziọma.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ἱερόν na-ezo aka n’ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: O wee ruo
  rationale: Nke a na-edobe ụzọ Luk si ejikọ akụkọ, ma na-ada ka Igbo dị ugbu a kama ịbụ okwu ochie siri ike.
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: n’otu n’ime ụbọchị ndị ahụ
  rationale: Ọ na-egosi otu ụbọchị a na-akọwaghị kpọmkwem n’ime usoro ụbọchị ndị a na-ekwu maka ha.
- source_word: διδάσκοντος αὐτοῦ τὸν λαὸν
  choice: mgbe ọ nọ na-akụziri ndị mmadụ ihe
  rationale: Ọ na-egosipụta na omume a nọ na-aga n’ihu n’otu oge ahụ, ma na-asụgharị λαός dị ka ndị mmadụ, ọ bụghị naanị ìgwè mmadụ.
- source_word: ἐν τῷ ἱερῷ
  choice: n’ụlọ nsọ
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ụlọ nsọ; nkọwa ala peeji na-eme ka o doo anya na ἱερόν bụ ogige ụlọ nsọ dum, ọ bụghị naanị ebe nsọ dị n’ime ya.
- source_word: εὐαγγελιζομένου
  choice: na-ekwusara ha ozi ọma
  rationale: Ọ na-edobe echiche nke ikwusa ozi ọma n’ụzọ dị mfe nghọta, na-enweghị ime ka okwu ahụ bụrụ naanị okwu ụka e ji eme ihe mgbe e mesịrị.
- source_word: ἐπέστησαν
  choice: bịakwutere ya
  rationale: Ọ na-egosi na ha bịara nso ya kpọmkwem, n’agbanyeghị na a naghị etinye echiche iro nke okwu Grik ahụ n’onwe ya ekwughị hoo haa.
- source_word: ἀρχιερεῖς
  choice: ndị isi nchụaja
  rationale: Ọ na-ezo aka n’òtù ndị ndu nchụaja, ọ bụghị ọtụtụ ndị ji otu ọkwa nnukwu onye nchụaja.
- source_word: γραμματεῖς
  choice: ndị odeakwụkwọ
  rationale: Ọ na-edobe aha òtù akụkọ ihe mere eme ahụ n’ụzọ kpọmkwem, kama ịkọwa ha naanị site n’ọrụ ha dị ka ndị ọkà n’Iwu.
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: ha na ndị okenye
  rationale: Ọ na-egosipụta na ndị okenye sonyeere òtù ndị ndu ndị ọzọ bịara.
theological_decisions:
- issue: Otu e si asụgharị εὐαγγελιζομένου n’akụkọ banyere ozi Jizọs
  choice: na-ekwusara ha ozi ọma
  alternative: na-ekwusa oziọma
  rationale: Nhọrọ a na-egosipụta ihe ngwaa Grik pụtara n’asụsụ ndị mmadụ na-aghọta, ma zere ime ka ọ bụrụ okwu nkà mmụta okpukpe ma ọ bụ okwu otu ụka kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ùgwù ma dị mfe nghọta mee ihe. E debere usoro akụkọ Luk site n’okwu “O wee ruo,” ma tinye akara nkọwa ala peeji n’ebe okwu ndị ha na-akọwa dị, n’agbanyeghị na nke a mere ka [b] buru ụzọ pụta tupu [a].
