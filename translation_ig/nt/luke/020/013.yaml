  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: ig
  text: Mgbe ahụ, onye nwe ubi vaịn ahụ[a] kwuru, “Gịnị ka m ga-eme? Aga m eziga nwa m nwoke m hụrụ n’anya; eleghị anya, ha ga-akwanyere ya ùgwù[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “Onyenwe ubi vaịn ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a sụgharịrị “kwanyere ya ùgwù” pụkwara ịpụta “ha ga-enwe ihere n’ihu ya” ma ọ bụ “ha ga-egosi ya nsọpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: onye nwe ubi vaịn ahụ
  rationale: N’ọnọdụ ilu a, okwu ahụ na-ezo aka n’onye ubi vaịn ahụ bụ nke ya. Nsụgharị a na-eme ka ihe akụkọ ahụ pụtara doo anya n’Igbo, n’etinyeghị aha nsọpụrụ nke nwere ike ịmanye nkọwa banyere Chineke n’ime okwu ahụ.
- source_word: Τί ποιήσω;
  choice: Gịnị ka m ga-eme?
  rationale: Ajụjụ a bụ nke onye ahụ ji atụgharị uche n’onwe ya banyere ihe ọ ga-eme; ụdị Igbo a bụ nke eke ma na-echekwa echiche ahụ.
- source_word: πέμψω
  choice: Aga m eziga
  rationale: Oge ọdịnihu a na-egosi ihe onye nwe ubi ahụ kpebiri ime.
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: nwa m nwoke m hụrụ n’anya
  rationale: “Nwa nwoke” na-echekwa kpọmkwem okike υἱός, ebe “m hụrụ n’anya” na-eburu ịdị arọ nke ἀγαπητός ma na-anọgide bụrụ Igbo dị mfe nghọta.
- source_word: ἴσως
  choice: eleghị anya
  rationale: Ọ na-egosi olileanya ma ọ bụ ihe nwere ike ime, ọ bụghị ihe e ji n’aka.
- source_word: τοῦτον
  choice: ya
  rationale: N’Igbo, nnọchiaha “ya” na-ezo aka n’ebe nwa nwoke ahụ nọ n’ụzọ eke; ihe gbara ya gburugburu na-eme ka onye a na-ekwu maka ya doo anya.
- source_word: ἐντραπήσονται
  choice: ha ga-akwanyere ya ùgwù
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara igosi mmadụ nsọpụrụ ma ọ bụ ịsọpụrụ ya. Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke eke, ebe nkọwa ndị metụtara ime ihere ka edobere na nkọwa ala peeji.
theological_decisions:
- issue: Nsụgharị κύριος n’ilu ebe onye ahụ nwere ike ịnọchi anya Chineke
  choice: onye nwe ubi vaịn ahụ
  alternative: Onyenwe ubi vaịn ahụ; nna ukwu ubi vaịn ahụ
  rationale: Echiche dị n’elu akụkọ ahụ bụ onye nwe ihe onwunwe. Nhọrọ a na-echekwa ihe ilu ahụ pụtara n’akụkọ ahụ ma hapụkwa ndị na-agụ ya ka ha hụ ntụnyere gbasara Chineke n’onwe ha, n’enweghị ịmanye ya site n’aha nsọpụrụ.
- issue: Mmetụta gbasara Kraịst dị n’okwu “nwa m nwoke m hụrụ n’anya”
  choice: nwa m nwoke m hụrụ n’anya
  alternative: nwa m nwoke ahụ, onye m hụrụ n’anya
  rationale: Nhọrọ a na-echekwa ma ihe ọ pụtara n’ilu ahụ ma ụda okwu nwere ike icheta ebe ndị ọzọ na Luk kpọrọ Jizọs Ọkpara a hụrụ n’anya, n’agbakwunyeghị nkọwa n’amaokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu, dee ya. A họọrọ “ubi vaịn” maka ἀμπελών, a jikwa akara mkparịta ụka na usoro ahịrịokwu Igbo nke eke chekwaa ụda onye nwe ubi ahụ na-atụgharị uche.
