  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: ig
  text: Ma ọ zara ha sị, “Mụ kwa ga-ajụ unu otu ajụjụ[a], unu gwa m:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-esochi okwu Grik anya karịa, “Mụ kwa ga-ajụ unu otu okwu/otu ihe.” Okwu Grik bụ λόγον, nke pụtara n’ụzọ nkịtị “okwu” ma ọ bụ “ihe”; ma n’ebe a, ọ pụtara ihe a na-ajụ, ya bụ, “ajụjụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: Ma ọ zara ha sị
  rationale: Nke a na-egosipụta ma njikọ δέ, ma ọnọdụ nzaghachi dị na ἀποκριθείς, ma ngwaa okwu εἶπεν n’ụzọ Igbo dị mfe ma kwekọọ n’okwu a na-ekwu kpọmkwem.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Mụ onwe m ga-ajụkwa unu
  rationale: '“Mụ onwe m” na “-kwa” jikọrọ ọnụ na-egosipụta nkwusi ike na echiche mgbakwunye dị na κἀγώ: ebe ha jụrụ ya, ya onwe ya ga-ajụkwa ha.'
- source_word: λόγον
  choice: otu ajụjụ
  rationale: Ọ bụ ezie na λόγος nwere ike ịpụta “okwu” ma ọ bụ “ihe,” mgbe ἐρωτάω so ya n’ebe a, ihe ọ pụtara n’ụzọ okwu bụ ihe a na-ajụ, ya bụ ajụjụ.
- source_word: καὶ εἴπατέ μοι
  choice: gwakwa m
  rationale: Nke a na-edobe iwu e nyere ọtụtụ mmadụ na εἴπατε, nnọchiaha dative μοι, na njikọ καί. Ihe mgbakwunye “-kwa” na-enye njikọ ahụ n’Igbo nkịtị.
