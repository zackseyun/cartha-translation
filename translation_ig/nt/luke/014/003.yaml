source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: ig
  text: Jizọs wee zaa, sị ndị ọkà n’Iwu[a] na ndị Farisii, “Iwu ò kwere ka a gwọọ mmadụ n’ụbọchị izu ike, ka ọ̀ bụ na o kweghị?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị ọkachamara n’Iwu.” Okwu Grik a na-ezo aka na ndị ọkachamara n’Iwu ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: wee zaa, sị
  rationale: Nke a na-edobe okwu abụọ ahụ e ji webata azịza Jizọs n’asụsụ Grik, ma na-eme ka ha daa nke ọma n’Igbo.
- source_word: νομικοὺς
  choice: ndị ọkà n’Iwu
  rationale: Ọ na-ezo aka n’ọkachamara n’Iwu ndị Juu, ọ bụghị ndị ọka iwu obodo nke oge a.
- source_word: Φαρισαίους
  choice: ndị Farisii
  rationale: Nke a bụ aha otu okpukpe ahụ a na-ejikarị n’Igbo.
- source_word: Ἔξεστιν
  choice: Iwu ò kwere
  rationale: Ọ na-egosipụta ajụjụ banyere ihe Iwu nyere ikike, karịsịa n’arụmụka banyere ụbọchị izu ike.
- source_word: τῷ σαββάτῳ
  choice: n’ụbọchị izu ike
  rationale: Nke a na-akọwa ụbọchị Sabat n’Igbo doro anya ma dị mfe nghọta.
- source_word: θεραπεῦσαι
  choice: ka a gwọọ mmadụ
  rationale: Ọ na-egosipụta ime ka onye ọrịa dị mma; itinye ‘mmadụ’ na-eme ka okwu ahụ bụrụ Igbo zuru oke n’enweghị ịgbakwunye onye a kapịrị ọnụ.
- source_word: ἢ οὔ
  choice: ka ọ̀ bụ na o kweghị
  rationale: Nke a na-edobe akụkụ abụọ nke ajụjụ ahụ n’ụzọ Igbo nkịtị.
theological_decisions:
- issue: Ịsụgharị ajụjụ gbasara Iwu ụbọchị izu ike n’etinyeghị azịza Jizọs n’ime ya
  choice: Iwu ò kwere ka a gwọọ mmadụ n’ụbọchị izu ike, ka ọ̀ bụ na o kweghị?
  alternative: À ga-ekwe ka a gwọọ mmadụ n’ụbọchị izu ike, ka a gaghị ekwe?
  rationale: Nhọrọ a na-edobe ike ajụjụ metụtara Iwu ma ghara ịgbakwunye nkọwa banyere ebere, mkpa, ma ọ bụ ikike Jizọs nke amaokwu a na-ekwughị.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị ọkà n’Iwu’ zere echiche na ndị a bụ ndị ọka iwu obodo nke oge a; e debere akara nkọwa ala ala peeji [a] n’ederede.
