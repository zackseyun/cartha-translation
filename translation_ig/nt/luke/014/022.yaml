  text: καὶ εἶπεν ὁ δοῦλος· Κύριε, γέγονεν ⸀ὃ ἐπέταξας, καὶ ἔτι τόπος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: ig
  text: Ohu ahụ[a] wee sị, “Onyenwe m[b], e meela ihe i nyere n’iwu, ọzọkwa, ohere ka dị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-eje ozi.” Okwu Grik bụ δοῦλος, nke pụkwara ịpụta ohu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Nna m ukwu.” Okwu Grik bụ Κύριε; n’akụkọ ilu a, ọ na-ekwu maka onye nwe ụlọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosipụta onye nọ n’okpuru ikike nna ukwu ya, nke kwekọrọ n’okwu Grik δοῦλος. Ọ bụ ezie na okwu a nwere ike ịpụta “onye na-eje ozi” n’ọnọdụ a, a hapụrụ ike okwu mbụ ahụ ka ọ dị.
- source_word: Κύριε
  choice: Nna m ukwu
  rationale: N’akụkọ ilu a, Κύριε bụ okwu ohu ji akpọ onye nwe ụlọ. “Nna m ukwu” bụ okwu Igbo doro anya ma dịkwa mma maka onye nwere ikike n’ebe onye na-ekwu okwu nọ, n’enweghị ime ka ọ bụrụ aha Chineke kpọmkwem.
- source_word: γέγονεν
  choice: e meela
  rationale: Perfect γέγονεν na-egosi na e mezuru iwu ahụ, nakwa na ihe e mere ka dị n’ọnọdụ e mezuru ya.
- source_word: ὃ ἐπέταξας
  choice: ihe i nyere n’iwu
  rationale: Nke a na-egosipụta ihe nna ukwu ahụ nyere iwu ka e mee ma na-echekwa ike ọchịchị dị na ἐπιτάσσω.
- source_word: ἔτι
  choice: ka
  rationale: N’usoro “ohere ka dị,” “ka” na-egosi na ohere ahụ ka nọgidere ịdị mgbe e mezuchara iwu ahụ.
- source_word: τόπος
  choice: ohere
  rationale: N’ọnọdụ oriri a, τόπος pụtara ohere fọdụrụ maka ndị ọzọ, ọ bụghị naanị otu ebe a kapịrị ọnụ.
theological_decisions:
- issue: Ma Κύριε ọ̀ bụ aha nsọ ka ọ bụ okwu a na-akpọ nna ukwu n’akụkọ ilu
  choice: Nna m ukwu
  alternative: Onyenwe m
  rationale: Onye a na-agwa okwu bụ onye nwe ụlọ n’ime akụkọ ilu ahụ. “Nna m ukwu” na-echekwa mmekọrịta nna ukwu na ohu n’emeghị ka okwu ahụ bụrụ aha nsọ naanị; e debere “Onyenwe m” dịka ihe ọzọ e nwere ike ịsụgharị ya.
translation_notes:
  register: E ji Standard Igbo nke dị mfe, dị ùgwù, ma dịkwa mma n’ọnụ mee ihe. “Ohu ahụ wee sị” na-edobe njikọ akụkọ dị na καὶ, ebe “ohere ka dị” bụ ụzọ Igbo sitere n’okike si kwuo na ohere ka fọdụrụ.
