revisions:
- from: Ohu ahụ[a] wee sị, “Nna m ukwu[b], e meela ihe i nyere n’iwu, ma ohere ka dị.”
  to: Ohu ahụ[a] wee sị, “Onyenwe m[b], e meela ihe i nyere n’iwu, ọzọkwa, ohere ka dị.”
  rationale: The revision replaces the adversative “ma” with additive “ọzọkwa” to reflect καὶ faithfully. It uses “Onyenwe m” for the vocative κύριε in its immediate parabolic household sense, while preserving “Nna m ukwu” as a viable lexical alternative. The remaining wording retains the draft’s accurate and natural rendering of the completed command and the space still available.
