translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ ‘ọnọdụ’ kama naanị ‘oche’ iji chekwaa ma echiche ebe ịnọ ma echiche ọkwa nsọpụrụ dị n’akụkọ ahụ. Ihe nrịbama ndetu [a] dị n’isi ederede.
