  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: ig
  text: Onye kpọrọ gị na ya abụọ ga-abịa sị gị, “Nye nwoke a oche gị.” Mgbe ahụ, ị ga-eji ihere malite ịnọ n’oche ikpeazụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “oche kacha ala.” Okwu Grik τὸν ἔσχατον τόπον nwere ike ịpụta oche ikpeazụ n’usoro; n’ọnọdụ oriri a, ọ nwekwara ike ịpụta oche nwere nsọpụrụ kacha nta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: onye ahụ kpọrọ ma gị ma ya
  rationale: Nkebi a na-arụ ọrụ dị ka aha ma na-ezo aka n’onye kpọrọ mmadụ abụọ ahụ. Nsụgharị a na-edobe ọdịiche dị n’etiti ‘gị’ na ‘ya’ n’ụzọ doro anya.
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: ga-abịa sị gị
  rationale: Ọ bụ ezie na ἐλθών bụ participle aorist, ọ na-ebute ngwaa ọdịnihu ἐρεῖ; ya mere, ‘ga-abịa sị gị’ na-egosi usoro omume ahụ n’Igbo eke.
- source_word: Δὸς τούτῳ τόπον
  choice: Hapụụrụ nwoke a ọnọdụ gị
  rationale: N’ọnọdụ oriri a, iwu ahụ pụtara ka onye ahụ nyefee onye ọzọ ebe ọ nọ, ọ bụghị naanị ka o meere ya oghere. ‘Ọnọdụ’ na-egosikwa ma ebe ịnọ ma ọkwa nsọpụrụ ya.
- source_word: μετὰ αἰσχύνης
  choice: ihere ga-eme gị
  rationale: Usoro okwu a bụ Igbo eke nke na-egosi ihere ma ọ bụ mmechuihu ọha nke αἰσχύνη nwere ike ịpụta.
- source_word: ἄρξῃ ... κατέχειν
  choice: ị ga-amalite ịnọ
  rationale: A na-edobe echiche ‘ịmalite’ nke ἄρξῃ, ebe ‘ịnọ’ na-egosi iwere ma jide ọnọdụ ahụ n’ọnọdụ oche oriri.
- source_word: τὸν ἔσχατον τόπον
  choice: ọnọdụ ikpeazụ
  rationale: ‘Ọnọdụ ikpeazụ’ na-edobe isi okwu ἔσχατος n’enweghị ịkagbu nghọta ya ọzọ dị ka ọnọdụ kacha ala n’usoro nsọpụrụ.
