  verdict: revise
  source_fidelity: 'A na-asụgharị okwu ndị bụ isi nke ọma: “obe,” “nke aka ya,” na “onye na-eso ụzọ m” na-edobe ihe Grik pụtara. Otú ọ dị, n’edemede dị ugbu a, nnegide “na-adịghị” metụtara naanị “ebu,” ebe njikọ “ma na-abịa n’azụ m” pụrụ igosi na onye ahụ anaghị ebu obe ma ọ na-abịa n’azụ Jizọs. N’asụsụ Grik, οὐ na-achị ma “ebu” ma “ịbịa n’azụ”; a ghaghị igosi nke a n’Igbo.'
