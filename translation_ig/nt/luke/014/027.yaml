  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: ig
  text: Onye ọ bụla nke na-adịghị ebu obe nke aka ya[a] ma na-adịghị abịa n’azụ m[b] apụghị ịbụ onye na-eso ụzọ m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “na-eburu obe nke aka ya.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị, “na-abịa n’azụ m”; tụnyere okwu a na-ejikarị akọwa ịbụ onye na-eso ụzọ: “soro m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: Onye ọ bụla nke
  rationale: Nnọchiaha a na-ewebata ọnọdụ metụtara onye ọ bụla; ntụgharị a na-edobe ike izugbe ya n’Igbo nkịtị.
- source_word: βαστάζει
  choice: na-ebu
  rationale: Okwu Grik a pụtara ibu ma ọ bụ iburu ihe. “Na-ebu” doro anya, na-echekwa ma ihe oyiyi obe a na-ebu n’ezie ma ihe ọ na-anọchi anya banyere ọnụ ahịa iso ụzọ.
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: obe nke aka ya
  rationale: “Obe” bụ okwu Igbo a na-ejikarị akọwa σταυρός, ebe “nke aka ya” na-eme ka nkwusiri ike nke nnọchiaha ntụgharị ἑαυτοῦ pụta ìhè n’ụzọ e ji asụ Igbo.
- source_word: ἔρχεται ὀπίσω μου
  choice: na-abịa n’azụ m
  rationale: Nke a na-edobe ihe oyiyi mmegharị dị n’okwu Grik n’ụzọ nkịtị karịa ịkọwa ya ozugbo naanị dị ka “na-eso m.”
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: apụghị ịbụ onye na-eso ụzọ m
  rationale: “Apụghị ịbụ” na-echekwa echiche enweghị ike ma ọ bụ enweghị nkwekọrịta, ọ bụghị nanị mmachibido iwu; “onye na-eso ụzọ” bụ okwu Igbo doro anya maka μαθητής n’akụkọ Oziọma.
theological_decisions:
- issue: Ike izugbe nke nnọchiaha ἑαυτοῦ nke dị n’otu onye
  choice: “obe nke aka ya”
  alternative: “obe nke ha”
  rationale: Asụsụ Grik ji otu onye mee ihe n’ụzọ na-emetụta onye ọ bụla. Igbo “onye ọ bụla … nke aka ya” na-edobe otu onye ahụ na ike izugbe ya, na-enweghị ịgbanwe ya gaa n’ọtụtụ mmadụ.
- issue: Mmekọrịta dị n’etiti ịbịa n’azụ Jizọs na iso ụzọ ya
  choice: “na-abịa n’azụ m”
  alternative: “na-eso m”
  rationale: A hapụrụ ihe oyiyi nke mmadụ ịbịa n’azụ Jizọs ka ọ dị, kama imechi ihe ọ pụtara n’otu nkọwa naanị. Ihe gbara amaokwu ahụ gburugburu ka na-eme ka njikọ ya na iso ụzọ doo anya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “nke aka ya” maka nkwusiri ike dị n’“own,” “onye na-eso ụzọ” maka okwu ama ama nke μαθητής, ma debe “na-abịa n’azụ m” iji chekwaa ihe oyiyi nke asụsụ mbụ.
