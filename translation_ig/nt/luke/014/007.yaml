- from: 'Ọ nọ na-agwa ndị a kpọrọ òkù ilu, mgbe ọ hụrụ otú ha si na-ahọrọ ebe ndị a na-asọpụrụkarị[a], na-asị ha:'
  to: 'Ọ nọ na-agwa ndị a kpọrọ òkù otu ilu, ka ọ na-ahụ otú ha si na-ahọrọ ebe ndị kasị nwee ùgwù[a], na-asị ha:'
  rationale: The revision preserves the Greek imperfect framing (“Ọ nọ na-agwa”; “na-ahọrọ”), renders ἐπέχων as a contemporaneous observation rather than a prior completed act, and states the honor-ranking sense of πρωτοκλισίας more explicitly. It keeps the Greek designation παραβολή as “ilu” and preserves the direct-speech introduction.
