  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: ig
  text: 'Ọ nọ na-agwa ndị a kpọrọ òkù otu ilu, ka ọ na-ahụ otú ha si na-ahọrọ ebe ndị kasị nwee ùgwù[a], na-asị ha:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oche ndị a na-asọpụrụkarị.” Okwu Grik ahụ na-ezo aka n’ebe ịnọdụ n’oriri ndị nwere ùgwù kachasị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: Ọ nọ na-agwa
  rationale: Oge imperfect na-egosi omume na-aga n'ihu ma ọ bụ nke na-akọwa ọnọdụ; “ọ nọ na-agwa” na-egosipụta nke a n'Igbo eke.
- source_word: δὲ
  choice: —
  rationale: Nke a bụ njikọ dị nro n'akụkọ; a hapụrụ ya n'enweghị okwu pụrụ iche n'Igbo ka amaokwu ahụ ghara ịmalite site n'okwu oge na-adịghị na isi mmalite.
- source_word: τοὺς κεκλημένους
  choice: ndị a kpọrọ òkù
  rationale: Perfect participle na-akọwa ndị nọ n'ọnọdụ ịbụ ndị a kpọrọ; okwu a doro anya ma dịkwa eke n'Igbo.
- source_word: παραβολήν
  choice: ilu
  rationale: “Ilu” bụ okwu Igbo a na-ejikarị akọwa παραβολή n'Oziọma, ma na-edobe ụdị nkuzi onye dere kpọrọ ya.
- source_word: ἐπέχων
  choice: mgbe ọ hụrụ
  rationale: Nke a na-egosi nlebara anya ya n'ihe ha na-eme, bụ́ ihe kpaliri ilu ahụ; “mgbe ọ hụrụ” bụ Igbo dị mfe ma ghara ịgbakwunye nkọwa.
- source_word: πῶς
  choice: otú ... si
  rationale: Usoro a bụ ụzọ Igbo eke si egosipụta manner nke πῶς.
- source_word: πρωτοκλισίας
  choice: ebe ndị a na-asọpụrụkarị
  rationale: Okwu ahụ na-ezo aka n'ebe kachasị ùgwù n'oriri, ọ bụghị naanị oche nkịtị; nsụgharị a na-egosipụta mkpa mmekọrịta mmadụ nke okwu Grik ahụ.
- source_word: ἐξελέγοντο
  choice: ha si na-ahọrọ
  rationale: Ụdị imperfect middle na-egosi omume na-aga n'ihu, yana echiche na ha na-ahọrọ ebe ahụ maka onwe ha; Igbo a na-egosipụta akụkụ na-aga n'ihu n'ụzọ eke.
- source_word: λέγων πρὸς αὐτούς
  choice: na-asị ha
  rationale: Nke a na-edobe participial construction nke na-ewebata okwu na-esochi, ma dị nkenke ma dịkwa eke n'Igbo.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere mmegharị imperfect n'okwu “ọ nọ na-agwa” na “ha si na-ahọrọ,” ma zere ịgbakwunye okwu mmalite nke pụtara “ugbu a.”
