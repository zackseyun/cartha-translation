    text: Ma ọ bụ, “nnu aghọọ nke na-enweghị uto.” N'ụzọ nkịtị, ngwaa Grik a nwere ike ịpụta “ịghọ onye nzuzu,” ma n’ebe a ọ na-ekwu banyere nnu ịghọ nke na-adịghị atọ ụtọ.
    reason: lexical_alternative
  revision_rationale: The revision keeps the Greek inference (οὖν), contrast and emphasis (ἐὰν δὲ καὶ), and culinary metaphor. It replaces an awkward main-clause expression with idiomatic Standard Igbo, renders the final passive seasoning question without adding ‘again,’ and maintains the lexical footnote’s literal and contextual senses.
