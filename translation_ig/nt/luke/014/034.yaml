  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: ig
  text: Ya mere, nnu dị mma; ma ọ bụrụ na ọbụna nnu efunahụ uto ya[a], gịnị ka a ga-eji tinye ya ihe na-enye uto?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnu aghọọ nke na-enweghị uto.” N'ụzọ nkịtị, ngwaa Grik a nwere ike ịpụta “ịghọ onye nzuzu,” ma n’ebe a ọ na-ekwu banyere nnu ịghọ nke na-adịghị atọ ụtọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: dị mma
  rationale: Nke a na-ekwupụta na nnu bụ ihe ọma bara uru n'ụzọ zuru ezu, n'enweghị ime ka echiche ahụ bụrụ naanị ịma mma ma ọ bụ uru.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'ozizi dị n'ihu; “Ya mere” bụ njikọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: ἅλας
  choice: nnu
  rationale: Ọ bụ aha nkịtị nke nnu; e debere ihe atụ ahụ dịka ọ dị.
- source_word: ἐὰν δὲ καὶ
  choice: ma ọ bụrụ na ọbụna
  rationale: “Ma” na-echekwa ntụgharị δέ, ebe “ọbụna” na-echekwa nkwusi ike καί.
- source_word: μωρανθῇ
  choice: aghọọ ihe na-enweghị ụtọ
  rationale: Ọ bụ ezie na ngwaa Grik ahụ nwere ike ịpụta n'ụzọ nkịtị ‘ịghọ onye nzuzu,’ mgbe ihe a na-ekwu bụ nnu, ọ na-egosi na nnu aghọọla nke na-adịghị atọ ụtọ.
- source_word: ἐν τίνι
  choice: gịnị ka a ga-eji
  rationale: Nke a bụ ụzọ Igbo sitere n'okike isi jụọ ihe ma ọ bụ ụzọ a ga-eji mee ihe ahụ.
- source_word: ἀρτυθήσεται
  choice: mee ka ọ dị ụtọ ọzọ
  rationale: Ọ na-echekwa echiche nke ime ka ihe nwee ụtọ ma na-eme ka ajụjụ banyere nnu doro anya n'Igbo; “ọzọ” na-egosi iweghachite àgwà nnu ahụ tụfuru n'ime ọnọdụ a.
theological_decisions:
- issue: Ike ihe atụ dị n'okwu banyere nnu
  choice: Idobe ilu banyere nnu n'ụzọ ihe atụ, n'akọwaghị ya dịka ndị na-eso ụzọ n'ime ederede.
  alternative: Ịgbasa ya n'ụzọ nkọwa dịka, ‘ọ bụrụ na ndị na-eso ụzọ efunahụ ihe e ji amata ha.’
  rationale: Amaokwu ahụ ji nnu mee ihe atụ, ebe ọnọdụ okwu gbara ya gburugburu na-enye ntụziaka maka itinye ya n'ọrụ. Idobe ya otú ahụ na-echekwa nghọtahie na esemokwu nke ihe atụ ahụ n'enweghị ịmanye otu nkọwa okpukpe.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe njikọ nkwubi okwu, nkwusi ike nke ‘ọbụna,’ na ajụjụ ilu dị n'akwụkwọ Grik.
