revisions:
- from: Mgbe mmadụ kpọrọ gị òkù ịbịa n’oriri agbamakwụkwọ,[a] anọkwala n’ebe a na-enye onye a kacha asọpụrụ;[b] n’ihi na ọ pụrụ ịbụ na ọ kpọkwara onye a na-asọpụrụ karịa gị òkù.
  to: Mgbe mmadụ kpọrọ gị òkù ịbịa n’oriri agbamakwụkwọ,[a] anọdụla n’ebe nsọpụrụ kachasị elu;[b] ka ọ ghara ịbụ na ọ kpọọla onye a na-asọpụrụ karịa gị òkù.
  rationale: The revision makes the command and the chief place idiomatic and precise in Standard Igbo, while retaining the source’s banquet setting and the warning that a more honored guest may already have been invited. The footnote continues to supply the historical detail behind the Greek verb for reclining.
