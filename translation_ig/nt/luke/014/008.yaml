    reason: cultural_note
  revision_rationale: The revision makes the command and the chief place idiomatic and precise in Standard Igbo, while retaining the source’s banquet setting and the warning that a more honored guest may already have been invited. The footnote continues to supply the historical detail behind the Greek verb for reclining.
