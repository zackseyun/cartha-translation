review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands the invitation, wedding festivities, comparative honor, and the cautionary force of μήποτε. However, “anọkwala” means ‘do not remain/stay’ more readily than ‘do not take a place/recline,’ and the phrase “n’ebe a na-enye onye a kacha asọpụrụ” is not an idiomatic designation for the honored place. The final clause should more clearly express the possibility that the inviter has already invited a more honored person.
  naturalness: The proposed revision uses direct, current Standard Igbo. “Anọdụla n’ebe nsọpụrụ kachasị elu” naturally conveys taking the chief place, while the footnote preserves the historically specific reclining practice without forcing an unnatural dining expression into the verse.
  terminology: “Oriri agbamakwụkwọ,” “ọkpụ/ebe nsọpụrụ,” and “onye a na-asọpụrụ karịa gị” suitably convey γάμοι, πρωτοκλισία, and ἐντιμότερός σου. The revised cultural note distinguishes ancient reclining couches from ordinary chairs.
  issues:
  - severity: medium
    issue: “anọkwala” does not adequately convey taking a dining place.
    rationale: κατακλιθῇς refers specifically to reclining/taking one’s place at table. In this context, “anọkwala” can mean simply ‘do not stay there,’ whereas “anọdụla” directly gives the intended prohibition in idiomatic Igbo.
  - severity: medium
    issue: “n’ebe a na-enye onye a kacha asọpụrụ” is awkward and semantically indirect.
    rationale: The phrase sounds like a location where an honored person is given something, rather than the chief place itself. “n’ebe nsọpụrụ kachasị elu” idiomatically identifies the place of greatest honor.
  - severity: low
    issue: The footnote’s description “na-adabere n’oche ndina” is imprecise.
    rationale: Ancient formal diners reclined on dining couches; “oche ndina” can suggest an ordinary chair or bed. The revision uses clearer wording.
  revised_text: Mgbe mmadụ kpọrọ gị òkù ịbịa n’oriri agbamakwụkwọ,[a] anọdụla n’ebe nsọpụrụ kachasị elu;[b] ka ọ ghara ịbụ na ọ kpọọla onye a na-asọpụrụ karịa gị òkù.
  revised_footnotes:
