  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: ig
  text: Mgbe mmadụ kpọrọ gị òkù ịbịa n’oriri agbamakwụkwọ,[a] anọdụla n’ebe nsọpụrụ kachasị elu;[b] ka ọ ghara ịbụ na ọ kpọọla onye a na-asọpụrụ karịa gị òkù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ịbịa n’agbamakwụkwọ.” Okwu Grik ahụ dị n’ụdị ọtụtụ, ọ pụkwara izo aka n’emume agbamakwụkwọ, karịchaa oriri ya.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ebe kacha nwee nsọpụrụ n’akụkụ tebụl. N’oriri ndị a haziri ahazi n’oge ochie, ndị mmadụ na-adina n’oche iri nri n’akụkụ tebụl kama ịnọdụ ala kwụ ọtọ.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: Mgbe mmadụ kpọrọ gị òkù
  rationale: N’ọnọdụ oriri, καλέω pụtara ịkpọ mmadụ òkù; “mmadụ” na-edobe onye kpọrọ òkù dị ka onye a na-akọwaghị kpọmkwem.
- source_word: εἰς γάμους
  choice: ịbịa n’oriri agbamakwụkwọ
  rationale: Ọtụtụ γάμους pụrụ ịpụta emume agbamakwụkwọ, karịchaa oriri ya; ntụgharị a dabara n’okwu gbasara ebe ndị ọbịa na-anọ.
- source_word: μὴ κατακλιθῇς
  choice: anọkwala
  rationale: κατακλίνω na-ezo aka n’ịdina n’akụkụ tebụl dịka omenala oge ahụ si dị. Igbo nkịtị anaghị eji ụdị okwu ahụ akọwa iri nri, ya mere “anọkwala” na-enye iwu ahụ n’ụzọ eke, ebe nkọwa omenala dị na ndetu ala peeji.
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: n’ebe a na-enye onye a kacha asọpụrụ
  rationale: πρωτοκλισία bụ ebe nsọpụrụ kachasị elu n’oriri; okwu a na-egosipụta ọnọdụ na nsọpụrụ, ọ bụghị naanị oche.
- source_word: μήποτε
  choice: n’ihi na ọ pụrụ ịbụ na
  rationale: Na-ewebata ihe nwere ike ime nke bụ ihe kpatara ịdọ aka ná ntị; ọ na-edobe ike nke subjunctive n’Igbo eke.
- source_word: ἐντιμότερός σου
  choice: onye a na-asọpụrụ karịa gị
  rationale: Comparative ahụ na-ekwu banyere onye nwere nsọpụrụ ma ọ bụ ọkwá ka ukwuu n’ọnọdụ oriri.
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: ọ kpọkwara ... òkù
  rationale: Periphrastic perfect na-egosi na onye ahụ akpọọlarị òkù, nke ka bara uru ugbu a; “ọ” na-alaghachi n’ebe onye kpọrọ gị òkù nọ, ebe “-kwara” na-egosi na a kpọrọ onye ọzọ ahụ kwa.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ “anọkwala” kama ntụgharị nkịtị nke ịdina n’akụkụ tebụl, ebe ndetu [b] na-echekwa nkọwa omenala ahụ. Akara ndetu niile dị n’ederede bụ [a] na [b].
