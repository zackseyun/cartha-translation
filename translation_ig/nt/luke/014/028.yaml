  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: ig
  text: N’ihi na, ònye n’ime unu nke chọrọ iwu ụlọ elu ọ̀ gaghị ebu ụzọ nọdụ ala gbakọọ ego ọ ga-efu[a], ma o nwere ego zuru iji rụchaa ya[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “gụọ ego ọ ga-emefu” ma ọ bụ “gbakọọ ụgwọ ya.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ma o nwere maka mmecha.” Ihe ọ pụtara bụ ma o nwere ego zuru iji rụchaa ọrụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: N’ihi na ònye n’ime unu
  rationale: Na-ejigide njikọ γάρ na ajụjụ okwu ọnụ a na-ajụ ndị na-ege ntị ozugbo.
- source_word: θέλων
  choice: ọ bụrụ na ọ chọrọ
  rationale: Na-egosi ọchịchọ ma ọ bụ ebumnobi onye ahụ n’ụzọ Igbo nkịtị.
- source_word: πύργον
  choice: ụlọ elu
  rationale: Nke a bụ okwu Igbo doro anya maka πύργος, ya bụ tower.
- source_word: οἰκοδομῆσαι
  choice: iwu
  rationale: Okwu nkịtị maka ịrụ ma ọ bụ iwuli ụlọ.
- source_word: οὐχὶ πρῶτον καθίσας
  choice: na-agaghị ebu ụzọ nọdụ ala
  rationale: Na-echekwa ajụjụ na-atụ anya azịza ee, tinyere omume ịnọdụ ala tupu ịgbakọ.
- source_word: ψηφίζει τὴν δαπάνην
  choice: gbakọọ ihe ọ ga-efu
  rationale: Na-enye echiche nke ịtụ ma gbakọọ ụgwọ ọrụ ahụ n’Igbo dị mfe ma kwekọọ n’ihe owuwu.
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: iji mara ma o nwere ihe ga-ezu iji rụchaa ya
  rationale: 'Na-eme ka akpaalaokwu Grik pụta ihe n’Igbo: ma ihe o nwere ò zuru ezu imecha ọrụ ahụ.'
