  - severity: low
    issue: Ụdị ajụjụ okwu ọnụ
    rationale: “Ọ̀ gaghị ebu ụzọ” na-anọchi οὐχὶ nke ọma karịa “na-agaghị,” n’ihi na ọ na-egosi ajụjụ na-atụ anya azịza ee.
