review_pass:
  verdict: revise
  source_fidelity: A na-echekwa isi ihe oyiyi ahụ—onye chọrọ iwu ụlọ elu, ịnọdụ ala buru ụzọ gbakọọ ụgwọ, na ịjụ ma ihe o nwere ezuo imecha ya. Otú ọ dị, “ọ bụrụ na ọ chọrọ” na-eme ka participle θέλων dị ka ọnọdụ a na-atụ anya ya, ebe “iji mara” na-agbakwunye nzube nke na-adịghị pụta kpọmkwem n’asụsụ Grik. A pụrụ ịhazi ajụjụ a n’Igbo ka ọ na-esochi mmekọrịta Grik n’enweghị mgbakwunye ahụ.
  naturalness: Ntụgharị ahụ dị mfe nghọta, ma “ònye n’ime unu, ọ bụrụ na ọ chọrọ ... na-agaghị” adịghị ada nke ọma dịka ajụjụ okwu ọnụ n’Igbo Standard. Ịkpụzi ya dịka “ọ̀ gaghị ebu ụzọ...” na-eme ka atụmanya azịza ee nke οὐχί pụta nke ọma.
  terminology: “Ụlọ elu” dabara na πύργος; “gbakọọ ego ọ ga-efu” dabara na ψηφίζει τὴν δαπάνην; “rụchaa” dabara na ἀπαρτισμός. “Ego zuru” na-eme ka ihe a na-atụle—ihe onwunwe ga-ezu—pụta n’ụzọ Igbo nkịtị.
  issues:
