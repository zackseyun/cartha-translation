  to: N’ihi na, ònye n’ime unu nke chọrọ iwu ụlọ elu ọ̀ gaghị ebu ụzọ nọdụ ala gbakọọ ego ọ ga-efu[a], ma o nwere ego zuru iji rụchaa ya[b]?
