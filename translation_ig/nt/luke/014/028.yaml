  register: Standard Igbo dị ugbu a, nke ugwu ya dị mma ma dịrị ndị nkịtị mfe nghọta. E tinyere akara ụda naanị n’ebe ọ na-enyere aka igbochi mgbagwoju anya, dị ka ònye.
