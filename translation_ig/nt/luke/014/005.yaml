  naturalness: The rhetorical question is natural Standard Igbo. “Olulu mmiri,” “adaba,” “adọpụta,” and “ozugbo” are clear and idiomatic in this context. Retaining the conditional formulation is appropriate.
  terminology: Replace the generic “ụbọchị izu ike” with “ụbọchị Sabat” to preserve the established biblical and theological referent without adding interpretation. “Ehi” is an acceptable general Igbo rendering for βοῦς in the absence of a common distinct everyday term for an ox.
