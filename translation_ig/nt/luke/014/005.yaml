id: LUK.14.5
reference: Luke 14:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: ig
  text: O wee sị ha[a], “Ònye n’ime unu, ọ bụrụ na nwa ya nwoke ma ọ bụ ehi ya adaba n’olulu mmiri, na-agaghị adọpụta ya ozugbo n’ụbọchị Sabat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie gụrụ “ịnyịnya ibu” kama “nwa nwoke.”
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: Ònye n’ime unu
  rationale: Nke a bụ ụzọ Igbo si ajụ ajụjụ a nke ọma ma na-edobe ike nke ajụjụ nzaghachi ahụ.
- source_word: υἱὸς
  choice: nwa ya nwoke
  rationale: Ọ na-edobe kpọmkwem ihe okwu Grik pụtara, ya bụ nwa nwoke, ma mee ka njikọ ya na onye a na-ajụ doo anya n’Igbo.
- source_word: βοῦς
  choice: ehi ya
  rationale: “Ehi” bụ okwu Igbo nkịtị ma doo anya maka anụ bovine a kpọrọ aha; itinye “ya” na-egosi na ọ bụ nke onye ahụ dịka usoro ajụjụ ahụ si chọọ.
- source_word: φρέαρ
  choice: olulu mmiri
  rationale: Nke a bụ okwu Igbo doro anya maka olulu e gwuru iji nweta mmiri, ọ naghị agwakọta ya na naanị olulu nkịtị.
- source_word: πεσεῖται
  choice: adaba
  rationale: Ọ dabara n’usoro ọnọdụ “ọ bụrụ na” n’Igbo ma na-eburu echiche ọdịda ahụ n’enweghị ịgbakwunye nkọwa.
- source_word: εὐθέως
  choice: ozugbo
  rationale: Ọ na-egosipụta ngwa ngwa na enweghị igbu oge nke okwu Grik.
- source_word: ἀνασπάσει
  choice: adọpụta ...
  rationale: “Dọpụta” na-egosi ịdọli ihe si n’ebe dị ala pụta, dịka isi n’olulu mmiri dọpụta onye ma ọ bụ anụmanụ.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha Igbo “ya” na-arụ ọrụ maka nwa nwoke ma ọ bụ ehi ma na-edobe otu onye ma ọ bụ otu anụmanụ ahụ n’enweghị nsogbu gbasara jinsi okwu.
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: n’ụbọchị izu ike
  rationale: Nke a na-asụgharị ma “ụbọchị” ma echiche Sabbath n’asụsụ Igbo dị ugbu a, nke ndị nkịtị na-aghọta.
theological_decisions:
- issue: Ọdịiche ederede gbasara onye ma ọ bụ anụmanụ dara n’olulu mmiri
  choice: nwa ya nwoke ma ọ bụ ehi ya
  alternative: ịnyịnya ibu ya ma ọ bụ ehi ya
  rationale: Ederede SBLGNT e nyere nwere υἱὸς, “nwa nwoke.” A gbasoro ya n’ahịrị bụ isi, ma debe ọgụgụ “ịnyịnya ibu” nke ụfọdụ akwụkwọ aka ochie nwere n’okpuru peeji kama ịgwakọta ya n’ederede.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Ònye n’ime unu” mee ka ajụjụ nzaghachi ahụ bụrụ nke e ji ọnụ ekwu n’enweghị ịhapụ ọdịdị ya; e debekwara akara ụda n’“Ònye” iji gbochie nghọtahie.
