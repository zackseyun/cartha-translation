  to: O wee sị ha[a], “Ònye n’ime unu, ọ bụrụ na nwa ya nwoke ma ọ bụ ehi ya adaba n’olulu mmiri, na-agaghị adọpụta ya ozugbo n’ụbọchị Sabat?”
