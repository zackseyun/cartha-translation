    text: A pụkwara ịsụgharị “iguzogide” dịka “izute.” Okwu Grik ahụ pụtara “izute” n'ụzọ kpọmkwem, ma n’ọnọdụ agha a ọ na-ekwu banyere izute onye iro na ọgụ.
    reason: lexical_alternative
