id: LUK.14.31
reference: Luke 14:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: ig
  text: Ma ọ bụ, olee eze nke, mgbe ọ na-aga izute eze ọzọ n’agha, ọ̀ gaghị ebu ụzọ nọdụ ala tụlee ma ya na puku iri ọ ga-enwe ike iguzogide onye ji puku iri abụọ na-abịa imegide ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “iguzogide” dịka “izute.” Okwu Grik ahụ pụtara “izute” n'ụzọ kpọmkwem, ma n’ọnọdụ agha a ọ na-ekwu banyere izute onye iro na ọgụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ τίς βασιλεὺς
  choice: Ma ọ bụ, olee eze
  rationale: Na-ewebata ihe atụ nke abụọ ma na-edobe ụdị ajụjụ a na-ajụ n’atụghị anya azịza ọzọ karịa nkwenye.
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: mgbe ọ na-aga izute eze ọzọ n’agha
  rationale: “Izute ... n’agha” na-egosi nzute nke agha n’enweghị ịgbatị ihe Grik kwuru karịa oke ya.
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: nke na-agaghị ebu ụzọ nọdụ ala tụlee
  rationale: Na-echekwa usoro omume ahụ—ibu ụzọ nọdụ ala, mesịa tụlee—nakwa ike ajụjụ rhetorical nke οὐχί.
- source_word: εἰ δυνατός ἐστιν
  choice: ma ... ọ̀ ga-enwe ike
  rationale: Na-egosi nyocha banyere ikike ma ọ bụ ike iru ihe ahụ, ọ bụghị naanị ikike e nyere mmadụ.
- source_word: ἐν δέκα χιλιάσιν
  choice: ya na puku ndị agha iri
  rationale: Ọnụọgụ ahụ bụ ndị agha eze ahụ ji aga agha; itinye “ndị agha” na-eme ka Igbo doo anya site n’ọnọdụ okwu ahụ.
- source_word: ὑπαντῆσαι
  choice: iguzogide
  rationale: Ọ bụ ezie na isi echiche ya bụ ‘izute,’ n’ọnọdụ agha a ọ pụtara izute onye iro iji guzogide ya.
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: onye ji puku ndị agha iri abụọ na-abịakwute ya
  rationale: Na-egosi onye iro nke ji ndị agha ka ukwuu na-abịa imegide ya, ma na-edobe usoro participle nke Grik n’Igbo dị mfe.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “ndị agha” kọwaa ọnụọgụ ndị ahụ n’ụzọ doro anya, ebe a hapụrụ ihe atụ na ajụjụ rhetorical ahụ ka ha dị.
