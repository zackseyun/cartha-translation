  to: Ma ọ bụ, olee eze nke, mgbe ọ na-aga izute eze ọzọ n’agha, ọ̀ gaghị ebu ụzọ nọdụ ala tụlee ma ya na puku iri ọ ga-enwe ike iguzogide onye ji puku iri abụọ na-abịa imegide ya?[a]
  rationale: The revision improves the rhetorical-question syntax, retains the sequence of sitting down before deliberating, and removes the supplied noun “ndị agha” so that the numerical wording remains as close as possible to the Greek while the military context still makes its reference clear. The lexical footnote now gives the literal alternative precisely.
