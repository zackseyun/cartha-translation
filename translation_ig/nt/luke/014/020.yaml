  text: καὶ ἕτερος εἶπεν· Γυναῖκα ἔγημα καὶ διὰ τοῦτο οὐ δύναμαι ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/020.yaml
  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: ig
  text: Onye ọzọ sịrị, “Alụọla m nwaanyị, n’ihi nke a, enweghị m ike ịbịa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερος
  choice: Onye ọzọ
  rationale: N’usoro akụkọ a, okwu a na-ewebata onye ọzọ n’etiti ndị na-enye ihe ngọpụ.
- source_word: Γυναῖκα
  choice: nwaanyị
  rationale: N’Igbo, ‘ịlụ nwaanyị’ bụ ụzọ ebumpụta ụwa e si ekwu na nwoke lụrụ nwunye; ngwaa ahụ mere ka o doo anya na ọ bụ alụmdi na nwunye ka a na-ekwu maka ya.
- source_word: ἔγημα
  choice: Alụọla m
  rationale: Ụdị a na-egosi ihe e mere nke ọnọdụ ya ka dị ugbu a, ya mere ọ dabara n’ihe ngọpụ onye ahụ na-enye.
- source_word: διὰ τοῦτο
  choice: n’ihi nke a
  rationale: Ọ na-edobe njikọ kpọmkwem n’etiti alụmdi na nwunye ahụ na ihe onye ahụ kwuru na ya enweghị ike ime.
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: enweghị m ike ịbịa
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ na nkwupụta onye ahụ na ya apụghị ịbịa.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe nghọta ma nwee ugwu. E ji ‘Alụọla m nwaanyị’ mee ka okwu ahụ bụrụ nke ebumpụta ụwa n’Igbo, na-edobekwa ihe aorist ahụ pụtara n’ọnọdụ akụkọ a.
