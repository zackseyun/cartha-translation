lexical_decisions:
- source_word: οἱ δὲ
  choice: Ma ha
  rationale: “Ha” na-ezo aka n’ebe ndị a kpọtụrụ aha tupu nke a nọ; “ma” na-egosi ọdịiche dị n’etiti ajụjụ Jizọs jụrụ na enweghị azịza ha.
- source_word: ἡσύχασαν
  choice: gbara nkịtị
  rationale: N’ebe a, okwu ahụ pụtara na ha azaghị ihe ọ bụla. “Gbara nkịtị” bụ Igbo dị mfe ma na-egosi ịghara ikwu okwu.
- source_word: ἐπιλαβόμενος
  choice: jide ya
  rationale: Nke a na-echekwa echiche nke imetụ nwoke ahụ aka ma jide ya, n’ebughị nkọwa banyere otú o si jide ya.
- source_word: ἰάσατο
  choice: gwọọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ịgwọ ọrịa ma kwekọọ n’ọnọdụ a.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha a na-ezo aka n’ebe nwoke ahụ na-arịa ọrịa nọ.
- source_word: ἀπέλυσεν
  choice: hapụkwa ya ka ọ laa
  rationale: ἀπολύω nwere ike ịpụta ịhapụ mmadụ, izipụ ya, ma ọ bụ ikwe ka ọ laa. Nhọrọ a bụ nke sitere n’okwu Grik ma bụrụkwa Igbo eke n’ọnọdụ akụkọ a.
