  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E debere usoro omume nke Grik—ijide ya, ịgwọ ya, na ịhapụ ya ka ọ laa—ma chekwaa nhọrọ nkọwa nke ἡσύχασαν na ἀπέλυσεν n’okpuru ederede.
