  yaml_path: translation/nt/luke/014/025.yaml
  text: 'Large crowds were traveling with him[a], and turning, he said to them:'
translation:
  language: ig
  text: 'Ọtụtụ ìgwè mmadụ so ya na-aga; ọ tụgharịrị gwa ha sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνεπορεύοντο
  choice: so ya na-aga
  rationale: 'Nkebi a na-egosi omume gara n’ihu n’oge gara aga: ìgwè mmadụ ahụ nọ na-eso Jizọs n’ụzọ. “So ya na-aga” bụ Igbo dị mfe ma na-egosi ma iso mmadụ ma ime njem.'
- source_word: δὲ
  choice: (ahapụrụ ya n’enweghị okwu pụrụ iche)
  rationale: δέ bụ njikọ akụkọ dị nro n’ebe a, ọ bụghị ihe na-egosi mmegide siri ike. Usoro ahịrịokwu Igbo na-eburu njikọ ahụ nke ọma n’enweghị itinye “ugbu a” nke na-adịghị n’isi okwu ahụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Jizọs; ide “ya” na-edobe ụdị okwu Grik ma na-ezere ikwughachi aha ya n’enweghị mkpa.
- source_word: ὄχλοι πολλοί
  choice: Ìgwè mmadụ buru ibu
  rationale: Okwu Grik ahụ na-ekwusi ike na ndị na-eso ya dị ọtụtụ ma gbakọta n’ìgwè. Nke a bụ ụzọ Igbo sitere n’okike si gosi nnukwu ọnụ ọgụgụ mmadụ, ọ bụ ezie na Grik ji ụdị ọtụtụ mee ihe.
- source_word: καὶ
  choice: ;
  rationale: Njikọ a na-ejikọta ọnọdụ ndị mmadụ na-eso ya na ihe Jizọs mere. Akara semicolon na Igbo na-eme ka usoro akụkọ ahụ doo anya n’enweghị itinye echiche nkwubi okwu na-adịghị na Grik.
- source_word: στραφεὶς
  choice: ọ tụgharịrị
  rationale: Nke a na-egosi na Jizọs tụgharịrị n’ebe ìgwè ahụ nọ tupu ọ gwa ha okwu, ma anaghị agbakwunye nkọwa karịa ihe Grik kwuru.
- source_word: εἶπεν
  choice: gwa ... sị
  rationale: “Gwa ha, sị” bụ usoro Igbo nkịtị na nke doro anya iji webata okwu mmadụ kwuru.
- source_word: πρὸς αὐτούς
  choice: gwa ha
  rationale: Nke a na-egosi ndị a gwara okwu ahụ, ma na-edobe nnọchiaha Grik nke na-ezo aka n’ìgwè mmadụ ahụ.
