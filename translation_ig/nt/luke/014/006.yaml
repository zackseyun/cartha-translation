  text: And they were not able to reply to these things[a].
translation:
  language: ig
  text: Ha enweghịkwa ike ịza ihe ndị a.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịtụgharị ya dịka “ịza nke a” ma ọ bụ “inye nzaghachi banyere ihe ndị a.” N’asụsụ Grik, okwu ahụ dị n’ụdị ọtụtụ; n’ụzọ nkịtị, ọ bụ “ihe ndị a.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: Akụkụ mgbakwunye “-kwa” na-ejikọta okwu a na ihe mere tupu ya n'ụzọ dị mfe, n’etinyeghị echiche oge ma ọ bụ ihe kpatara ya.
- source_word: οὐκ ἴσχυσαν
  choice: ha enweghị ike
  rationale: N’ebe a, ἰσχύω na-egosi ikike ime ihe, ọ bụghị ike anụ ahụ; “enweghị ike” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: ἀνταποκριθῆναι
  choice: ịza
  rationale: “Ịza” na-egosi inye nzaghachi n’ụzọ ebumpụta ụwa, na-enweghị ịgbakwunye echiche nke ịrụ ụka ma ọ bụ ikwu okwu n’ụzọ mkparị.
- source_word: πρὸς ταῦτα
  choice: ihe ndị a
  rationale: Nhọrọ a na-echekwa ọtụtụ nke ταῦτα ma na-enye nghọta ebumpụta ụwa nke ịza ihe ndị a kwuru ma ọ bụ mere.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. Ahịrịokwu ahụ na-echekwa njikọ ya na amaokwu bu ya ụzọ na ọtụtụ nke okwu Grik, ebe nkọwa ala peeji na-egosi ụzọ ndị ọzọ e si aghọta πρὸς ταῦτα.
