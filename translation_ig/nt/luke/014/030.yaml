  yaml_path: translation/nt/luke/014/030.yaml
  text: saying[a], ‘This man began to build and was not able to finish.’
translation:
  language: ig
  text: na-ekwu, “Nwoke a malitere iwu ya, ma o nweghị ike ịrụcha ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: na-ekwu
  rationale: Ọ bụ participle nke na-aga n'ihu n'okwu amaokwu bu ụzọ; ‘na-ekwu’ jikọtara ya n'ụzọ eke ma gosipụta okwu ndị mmadụ na-ekwu.
- source_word: ὅτι
  choice: “
  rationale: Ọ na-ewebata ihe ndị ahụ kwuru kpọmkwem; akara nhota bụ ụzọ Igbo dị eke isi gosi nke a.
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: Nwoke a
  rationale: Nke a na-edobe demonstrative ahụ na masculine singular nke Greek, tinyere ụda okwu a kapịrị ọnụ na nke ọhaneze.
- source_word: ἤρξατο
  choice: malitere
  rationale: Ọ na-egosipụta ịmalite ime ihe, ma bụrụ okwu Igbo doro anya na nke kwesịrị ekwesị.
- source_word: οἰκοδομεῖν
  choice: iwu ụlọ
  rationale: N'ọnọdụ ilu a, ihe a na-ewu bụ ụlọ elu ahụ e kwuru n'amaokwu bu ụzọ; ‘iwu ụlọ’ bụ okwu Igbo eke ma ghara ime ka ọ bụrụ teknụzụ.
- source_word: οὐκ ἴσχυσεν
  choice: o nweghị ike
  rationale: ἰσχύω n'ebe a na-ekwu maka ikike imecha ọrụ, ọ bụghị naanị ike anụ ahụ; okwu a na-edobe obosara ahụ.
- source_word: ἐκτελέσαι
  choice: ịrụcha ya
  rationale: Ọ pụtara iweta ọrụ ahụ ruo na njedebe; ‘ịrụcha ya’ bụ okwu Igbo eke n'ihe gbasara ọrụ owuwu.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị mfe nghọta ma nwee ugwu. Ahịrịokwu ahụ na-aga n'ihu site n'amaokwu bu ụzọ, ya mere e ji ‘na-ekwu’ malite ya. E tinyeghị nkọwa ụka ma ọ bụ nkọwa mmụta okpukpe na-adịghị na Greek.
