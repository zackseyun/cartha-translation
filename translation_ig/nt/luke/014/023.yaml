id: LUK.14.23
reference: Luke 14:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: ig
  text: Onye nwe ụlọ ahụ wee sị ohu ya, “Pụọ gaa n'okporo ụzọ na n'ogige, manyee[a] ndị mmadụ ka ha bata, ka ụlọ m wee jupụta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “rịọsie ha ike ka ha bata.” Ngwaa Grik ahụ siri ike; ọ pụtara “ịmanye” ma ọ bụ “ịrịgide mmadụ.” Ma n'ilu a, ọ bụghị iwu na ọ na-ekwu maka iji ike anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: onye nwe ụlọ ahụ
  rationale: N'ilu a, okwu ahụ na-ezo aka n'onye nwe ụlọ na onye kpọrọ oriri, ọ bụghị aha nsọ a na-akpọ Chineke kpọmkwem.
- source_word: δοῦλον
  choice: ohu ya
  rationale: ‘Ohu’ na-echekwa ọnọdụ onye nọ n'okpuru nna ukwu nke δοῦλος na-egosi, kama ime ka ọ bụrụ naanị onye na-eje ozi n'efu.
- source_word: Ἔξελθε
  choice: Pụọ gaa
  rationale: Nke a na-egosi ma iwu ịga ma mmegharị isi n'ime pụọ n'èzí.
- source_word: ὁδοὺς
  choice: okporo ụzọ
  rationale: Ọ bụ okwu Igbo doro anya maka ụzọ ndị a na-aga n'èzí obodo ma ọ bụ n'akụkụ ya.
- source_word: φραγμοὺς
  choice: akụkụ ogige dị iche iche
  rationale: φραγμός nwere ike ịbụ ogige, mgbidi, ma ọ bụ ihe e ji kee ala; ‘akụkụ ogige’ na-egosi ebe ndị dị n'akụkụ ụzọ na ókèala nwere ike ịnọ, n'Igbo a na-asụ nke ọma.
- source_word: ἀνάγκασον
  choice: manyekwa ndị mmadụ
  rationale: ‘Manye’ na-echekwa ike dị n'iwu Grik ahụ, ebe ndetu ala peeji na-akọwa na n'ilu a ọ pụtaghị na a ga-eji ike anụ ahụ mee ya.
- source_word: εἰσελθεῖν
  choice: ka ha bata
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si kwuo ịbanye n'ụlọ ebe onye na-ekwu okwu nọ.
- source_word: ἵνα γεμισθῇ
  choice: ka ... wee jupụta
  rationale: Usoro a na-egosi nzube iwu ahụ ma na-asụkwa nke ọma n'Igbo.
- source_word: μου ὁ οἶκος
  choice: ụlọ m
  rationale: οἶκος ebe a bụ ụlọ a na-anọ eme oriri, ya mere ‘ụlọ m’ bụ ntụgharị kpọmkwem ma kwekọọ n'ọnọdụ ahụ.
theological_decisions:
- issue: Otú e si atụgharị κύριος n'ilu a
  choice: onye nwe ụlọ ahụ
  alternative: Onyenwe anyị; nna ukwu
  rationale: N'ime ụwa akụkọ ilu a, ọ bụ mmadụ nwe ụlọ ma kpọọ oriri. Nhọrọ a na-ezere ime okwu ahụ ozugbo ka ọ bụrụ aha Chineke, ma ọ naghị egbochi ihe ilu ahụ nwere ike ịkụziri banyere Chineke.
- issue: Ike dị n'okwu ἀνάγκασον
  choice: manyekwa ndị mmadụ ka ha bata
  alternative: rịọsie ha ike ka ha bata; gbaa ha ume nke ukwuu ka ha bata
  rationale: Isi okwu ahụ na-echekwa ike nke ngwaa Grik ma ghara ime ka ọ dị nro. N'otu oge ahụ, ndetu na-ahapụ nghọta kwesịrị ọnọdụ ilu ahụ n'emebighị mgbagwoju anya dị na okwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. ‘Onye nwe ụlọ’ dabara n'ọnọdụ oriri ahụ; ‘ohu’ na-echekwa ọnọdụ mmekọrịta e gosiri na δοῦλος. E tinyere akara ndetu [a] ozugbo n'ahịrịokwu metụtara ya.
