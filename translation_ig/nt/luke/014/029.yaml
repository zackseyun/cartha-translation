  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: ig
  text: ma ọ bụghị ya[a], mgbe ọ tụsịrị ntọala ma ghara inwe ike ịrụcha ya, ndị niile hụrụ ya ga-amalite ịkwa ya emo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka ọ ghara ịbụ na, mgbe ọ tụsịrị ntọala ma ghara inwe ike ịrụcha ya, ndị niile hụrụ ya amalite ịkwa ya emo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: ma ọ bụghị ya
  rationale: N'ịdọ aka ná ntị a, okwu ahụ na-egosi ihe ọjọọ nwere ike isi na ya pụta ma a kpachaghị anya; nke a bụ Igbo doro anya ma dịkwa eke.
- source_word: θέντος αὐτοῦ θεμέλιον
  choice: mgbe ọ tụsịrị ntọala ụlọ
  rationale: Ụdị genitive absolute na-egosi na ịtụ ntọala buru ụzọ mee; “mgbe ọ tụsịrị” na-egosipụta usoro oge ahụ nke ọma. Ịgbakwunye “ụlọ” na-eme ka ihe ntọala ahụ bụ doo anya n'ọnọdụ ihe atụ gbasara iwu ụlọ.
- source_word: μὴ ἰσχύοντος
  choice: ma ghara inwe ike
  rationale: ἰσχύω ebe a bụ ikike imezu ọrụ, ọ bụghị naanị ike anụ ahụ.
- source_word: ἐκτελέσαι
  choice: ịrụcha ya
  rationale: N'ọnọdụ iwu ụlọ, “ịrụcha” na-egosi iweta ọrụ ahụ ruo na njedebe n'Igbo eke.
- source_word: πάντες οἱ θεωροῦντες
  choice: ndị niile hụrụ ya
  rationale: θεωρέω pụtara ịhụ ma ọ bụ ile ihe anya; “hụrụ ya” na-ezo aka n'ọrụ ụlọ ahụ a na-ahụ anya.
- source_word: ἄρξωνται
  choice: nwere ike ịmalite
  rationale: Nke a na-edobe mmetụta nke subjunctive, ya bụ ihe nwere ike ime n'ihi ọnọdụ ahụ.
- source_word: αὐτῷ ἐμπαίζειν
  choice: ịkwa ya emo
  rationale: Nke a bụ ụzọ Igbo nkịtị, dị ùgwù, si kwuo ịchị mmadụ ọchị n'ụzọ nlelị.
