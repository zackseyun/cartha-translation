id: LUK.14.10
reference: Luke 14:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: ig
  text: Ma mgbe a kpọrọ gị òkù, gaa nọdụ n’ebe kasị ala[a], ka mgbe onye kpọrọ gị òkù bịara, ọ ga-asị gị, ‘Enyi, bịaruo n’ebe dị elu karị[b].’ Mgbe ahụ, a ga-asọpụrụ gị n’ihu ndị niile gị na ha nọ na-eri nri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “gaa nọdụ n’oche kasị ala.” Ngwaa Grik ahụ na-ezo kpọmkwem n’ịdina n’akụkụ tebụl mgbe a na-eri nri.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “rịgoro n’ebe dị elu karị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κληθῇς
  choice: mgbe a kpọrọ gị òkù
  rationale: N’ọnọdụ oriri a, καλέω pụtara ịkpọ mmadụ òkù, ọ bụghị nanị ịkpọ ya aha ma ọ bụ ịkpọku ya.
- source_word: πορευθεὶς
  choice: gaa
  rationale: 'A sụgharịrị participle a dị ka omume jikọrọ iwu na-esote ya, n’Igbo nkịtị: “gaa nọdụ.”'
- source_word: ἀνάπεσε
  choice: nọdụ
  rationale: Okwu Grik ahụ na-ezo kpọmkwem n’ịdina n’akụkụ tebụl mgbe a na-eri nri, ma “nọdụ” bụ okwu Igbo doro anya ma kwekọọ n’otú ndị taa si ekwu maka ịnọ n’oriri; nkọwa ala na-echekwa omenala mbụ ahụ.
- source_word: ἔσχατον τόπον
  choice: n’ọnọdụ kasị ala
  rationale: Nke a na-egosi ọnọdụ onye e nyere nsọpụrụ kacha nta n’usoro ndị ọbịa, ọ bụghị naanị ebe dị ala n’ala.
- source_word: ὁ κεκληκώς σε
  choice: onye kpọrọ gị òkù
  rationale: Nke a na-agbaso participle Grik nke na-akọwa onye kpọrọ onye ahụ òkù, n’enweghị itinye nkọwa ọzọ dịka “onye nwe oriri.”
- source_word: Φίλε
  choice: Enyi
  rationale: Nke a bụ kpọmkwem okwu nkwanye ùgwù e ji akpọ onye ahụ; etinyeghị possessive na-adịghị na Grik.
- source_word: προσανάβηθι ἀνώτερον
  choice: kwaga n’ọnọdụ dị elu karị
  rationale: Nkebiokwu ahụ pụtara ịkwaga n’ebe e ji nsọpụrụ ka ukwuu, ma ọ ka na-echekwa echiche nke ịrịgo elu.
- source_word: δόξα
  choice: nsọpụrụ
  rationale: N’ebe a δόξα bụ ugwu ma ọ bụ nsọpụrụ mmadụ na-enweta n’ihu ọha, ọ bụghị otuto Chineke.
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: n’ihu ndị niile gị na ha nọ na-eri nri
  rationale: Nke a na-echekwa ọdịdị nsọpụrụ ahụ n’ihu ọha na ọnọdụ oriri, ma na-eji Igbo dị mfe karịa ntụgharị nkịtị banyere ndị dina n’otu tebụl.
theological_decisions:
- issue: Ụdị nkuzi okwu a bụ
  choice: E gosipụtara ya dịka ntụziaka n’ihe atụ banyere ịdị umeala n’obi na nsọpụrụ, n’ebughị ụzọ kpebie na ọ bụ naanị ụkpụrụ omume n’oriri ma ọ bụ naanị ụgwọ ọrụ nke ọdịnihu.
  alternative: Ịsụgharị ya dịka naanị ndụmọdụ banyere omume ọma n’oriri, ma ọ bụ ịmanye ya ka ọ bụrụ naanị nkwa banyere nsọpụrụ n’ọdịnihu.
  rationale: Ihe atụ oriri ahụ na-akụzi ịdị umeala n’obi na mgbanwe ọnọdụ nsọpụrụ, ma amaokwu ahụ n’onwe ya anaghị amanye otu nkọwa n’ime abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Nọdụ” na “ndị gị na ha nọ na-eri nri” na-eme ka okwu ahụ bụrụ nke mmadụ nkịtị ga-aghọta, ebe nkọwa ala na-echekwa omenala ndị narị afọ mbụ nke ịdina n’akụkụ tebụl. E debere “ọnọdụ” iji gosi na elu na ala ebe a metụtarakwa ogo nsọpụrụ.
