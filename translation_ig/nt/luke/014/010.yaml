revisions:
- from: Ma mgbe a kpọrọ gị òkù, gaa nọdụ n’ọnọdụ kasị ala[a], ka mgbe onye kpọrọ gị òkù bịara, ọ ga-asị gị, ‘Enyi, kwaga n’ọnọdụ dị elu karị[b].’ Mgbe ahụ, ị ga-enweta nsọpụrụ n’ihu ndị niile gị na ha nọ na-eri nri.
  to: Ma mgbe a kpọrọ gị òkù, gaa nọdụ n’ebe kasị ala[a], ka mgbe onye kpọrọ gị òkù bịara, ọ ga-asị gị, ‘Enyi, bịaruo n’ebe dị elu karị[b].’ Mgbe ahụ, a ga-asọpụrụ gị n’ihu ndị niile gị na ha nọ na-eri nri.
  rationale: The revision retains the draft’s faithful banquet and honor imagery while making the seating language more idiomatic, restoring the upward movement in προσανάβηθι ἀνώτερον, and expressing δόξα as public honor without adding a particular mechanism of receiving it. The existing footnote anchors remain correctly placed and no theological interpretation is introduced.
  reviewer_model: gpt-5.6-terra
