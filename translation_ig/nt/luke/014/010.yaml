review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys invitation, choosing the least prominent place, the inviter's subsequent address, public honor, and the dining setting. However, “kwaga n’ọnọdụ dị elu karị” weakens the explicit upward movement of προσανάβηθι, and “ị ga-enweta nsọpụrụ” makes the result sound more like an acquisition than the Greek’s statement that honor will accrue/be accorded publicly.
  naturalness: The draft is generally clear Standard Igbo. “gaa nọdụ n’ọnọdụ kasị ala” is somewhat repetitive and less idiomatic than “gaa nọdụ n’ebe kasị ala.” “Bịaruo n’ebe dị elu karị” is a natural polite imperative in this banquet context.
  terminology: “kpọrọ gị òkù,” “Enyi,” and “nsọpụrụ” are suitable. The footnote correctly preserves the specific first-century meal-reclining sense of ἀνάπεσε without making the main text obscure.
  issues:
  - severity: medium
    issue: The rendering of προσανάβηθι ἀνώτερον lacks the upward-motion nuance.
    rationale: “Kwaga n’ọnọdụ dị elu karị” communicates promotion but does not directly render the invitation to come/move up. “Bịaruo n’ebe dị elu karị” retains both natural Igbo and the Greek imagery.
  - severity: low
    issue: The phrase “nọdụ n’ọnọdụ” is stylistically repetitive.
    rationale: Using “nọdụ n’ebe kasị ala” is more natural while preserving the socially least prominent place in context.
  - severity: low
    issue: “Ị ga-enweta nsọpụrụ” slightly over-specifies the manner of the result.
    rationale: The Greek says that honor will be for the person before the fellow diners, without specifying that the person actively receives it. “A ga-asọpụrụ gị” is idiomatic and preserves the public-honor outcome.
  revised_text: Ma mgbe a kpọrọ gị òkù, gaa nọdụ n’ebe kasị ala[a], ka mgbe onye kpọrọ gị òkù bịara, ọ ga-asị gị, ‘Enyi, bịaruo n’ebe dị elu karị[b].’ Mgbe ahụ, a ga-asọpụrụ gị n’ihu ndị niile gị na ha nọ na-eri nri.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “gaa nọdụ n’oche kasị ala.” Ngwaa Grik ahụ na-ezo kpọmkwem n’ịdina n’akụkụ tebụl mgbe a na-eri nri.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “rịgoro n’ebe dị elu karị.”
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s faithful banquet and honor imagery while making the seating language more idiomatic, restoring the upward movement in προσανάβηθι ἀνώτερον, and expressing δόξα as public honor without adding a particular mechanism of receiving it. The existing footnote anchors remain correctly placed and no theological interpretation is introduced.
