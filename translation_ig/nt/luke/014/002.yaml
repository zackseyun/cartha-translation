    issue: Awkward construction of the medical modifier
    rationale: The draft’s “otu nwoke ọrịa ọzịza mmiri na-arịa” is grammatically and stylistically strained. “otu nwoke na-arịa ọrịa ọzịza mmiri” clearly means ‘a certain man who was suffering from fluid-swelling disease’ and retains the Greek sense.
  - severity: low
    issue: Footnote alternative is imprecise
    rationale: “Ma hụkwa” adds the sense ‘also’ and is less direct as an alternative for ἰδού. “Ma hụ” is a clearer, natural alternative for the attention-directing expression.
