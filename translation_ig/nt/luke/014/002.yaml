  text: καὶ ἰδοὺ ἄνθρωπός τις ἦν ὑδρωπικὸς ἔμπροσθεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/002.yaml
  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: ig
  text: Ma lee[a], otu nwoke na-arịa ọrịa ọzịza mmiri nọ n’ihu ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ma hụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: Njikọ a na-aga n’ihu n’akụkọ ahụ; “Ma” dabara n’ọnọdụ a ma ghara itinye nkọwa oge na-adịghị na Grik.
- source_word: ἰδοὺ
  choice: lee
  rationale: Ọ na-akpọ uche onye na-agụ ka ọ hụ ihe mberede dị n’akụkọ ahụ, n’asụsụ Igbo doro anya ma dịkwa ugwu.
- source_word: ἄνθρωπός τις
  choice: otu nwoke
  rationale: Ọ na-egosi nwoke a kapịrị ọnụ ma a na-akpọghị aha ya.
- source_word: ἦν
  choice: nọ
  rationale: N’Igbo, “nọ” na-egosipụta ọnọdụ onye ahụ n’ebe ahụ n'ụzọ ebumpụta ụwa.
- source_word: ὑδρωπικὸς
  choice: ọrịa ọzịza mmiri na-arịa
  rationale: Okwu a na-ezo aka n’onye ahụ ya zara n’ihi mmiri na-ezukọta n’ahụ; ntụgharị a na-akọwa ọrịa ahụ n’asụsụ ndị mmadụ ga-aghọta.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: n’ihu ya
  rationale: Ọ na-echekwa echiche ọnọdụ mmadụ n’ihu onye ọzọ, ma nwee ike ịgụnye ịdị n’ebe ọ nọ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E ji “lee” chekwaa ike ἰδοὺ nke na-adọta uche; e kọwara ὑδρωπικός kama iji naanị aha ọgwụ Bekee a na-amaghị nke ọma.
