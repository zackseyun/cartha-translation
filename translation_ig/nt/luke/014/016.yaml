  text: Ma ọ sịrị ya, “Otu nwoke nọ na-akwadebe nnukwu oriri[a], ọ kpọkwara ọtụtụ mmadụ òkù.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya “nnukwu nri” ma ọ bụ “nnukwu nri anyasị.” Okwu Grik δεῖπνον na-ezo aka n’isi nri ụbọchị ahụ; n’ebe a, ọ bụ nri pụrụ iche onye nwe ụlọ kwadoro maka ndị ọ kpọrọ òkù.
