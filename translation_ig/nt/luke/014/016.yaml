lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: Ma ọ sịrị ya
  rationale: “Ma” na-egosi ntụgharị dị nro n’okwu dịka δέ si eme, ebe “ọ sịrị ya” na-anọchi anya onye a gwara okwu n’enweghị itinye nkọwa ọzọ.
- source_word: Ἄνθρωπός τις
  choice: Otu nwoke
  rationale: Nke a na-egosi onye nwoke a na-akọghị aha ya, ma na-edobe ụdị nwoke otu onye dị n’asụsụ Grik.
- source_word: ἐποίει
  choice: nọ na-akwadebe
  rationale: Ụdị imperfect na-egosi ihe na-aga n’ihu n’oge gara aga; n’ihe gbasara oriri, “nọ na-akwadebe” bụ Igbo ebumpụta ụwa karịa ntụgharị nkịtị nke “na-eme.”
- source_word: δεῖπνον μέγα
  choice: nnukwu oriri
  rationale: “Oriri” dabara n’isi nri a kwadoro nke onye nwe ụlọ na-anabata ndị ọ kpọrọ òkù, ebe “nnukwu” na-edobe μέγα.
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: ọ kpọkwara ọtụtụ mmadụ òkù
  rationale: N’ọnọdụ oriri, καλέω pụtara ịkpọ mmadụ òkù; “ọtụtụ mmadụ” na-eme ka ihe πολλούς na-ezo aka na ya doo anya n’Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nọ na-akwadebe” na-egosipụta omume na-aga n’ihu, ebe “kpọkwara … òkù” bụ ụzọ Igbo ebumpụta ụwa si akọ ịkpọ ndị mmadụ bịa n’oriri.
