  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: ig
  text: Ya mere, onye ọ bụla n’ime unu na-adịghị ahapụ ihe onwunwe ya niile enweghị ike ịbụ onye na-eso ụzọ m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe atụ ndị bu ụzọ, n’Igbo dị mfe ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: πᾶς ἐξ ὑμῶν
  choice: onye ọ bụla n’ime unu
  rationale: 'Ọ na-echekwa echiche nkesa nke okwu Grik ahụ: ihe a metụtara onye nke ọ bụla n’ime ndị na-ege ntị.'
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: nke na-ajụghị
  rationale: N’ebe a, ἀποτάσσεται na-egosi ịsị ihe mmadụ nwere mba, ma ọ bụ ịhapụ ihe onye ahụ na-azọrọ na ọ bụ nke ya. “Ajụghị” na-echekwa ịdị ike nke ihe a chọrọ n’enweghị mkpebi na ọ bụ naanị ire ma ọ bụ inye ihe niile n’ụzọ nkịtị.
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: ihe niile o nwere
  rationale: Akpaalaokwu Grik ahụ na-ezo aka n’ihe onwunwe mmadụ. Nsụgharị a bụ Igbo nkịtị ma na-echekwa “ihe niile” na njikọ nke onye ahụ na ihe ndị ahụ.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: enweghị ike ịbụ onye na-eso ụzọ m
  rationale: Ọ na-echekwa okwu nke enweghị ike, ọ bụghị naanị na omume ahụ ekwesịghị ekwesị.
- source_word: μαθητής
  choice: onye na-eso ụzọ
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka μαθητής n’Oziọma, na-egosi ma iso Jizọs ma ịmụ ihe n’aka ya.
theological_decisions:
- issue: Ụdị ihe a chọrọ banyere ihe onwunwe
  choice: Jiri “jụ ihe niile o nwere” gosi ịhapụ nkwupụta ikike na njide obi n’ihe onwunwe.
  alternative: “Hapụ ihe niile o nwere,” nke nwere ike ime ka a ghọta ya kpọmkwem dị ka iwepụ ihe niile n’aka mmadụ.
  rationale: ἀποτάσσεται nwere ike ịpụta ịsị mmadụ ma ọ bụ ihe ka ọ gaa nke ọma, ma n’ebe a ọ na-egosi ịjụ ma ọ bụ ịhapụ ihe mmadụ na-azọrọ dị ka nke ya. Nsụgharị ahụ na-ahapụ ịdị egwu na esemokwu dị n’ihe Jizọs kwuru n’enweghị ịmanye otu usoro akụ na ụba n’elu okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma doo ndị nkịtị anya. E jiri “onye” na “o” mee ntụaka gbasara mmadụ n’ozuzu ya; ọ gbasara onye na-eso ụzọ ọ bụla, ma nwoke ma nwanyị.
