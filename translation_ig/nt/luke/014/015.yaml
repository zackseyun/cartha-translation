id: LUK.14.15
reference: Luke 14:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: ig
  text: Ma mgbe otu onye n’ime ndị ya na ya nọ na-eri nri[a] nụrụ ihe ndị a, ọ sịrị ya, “Ngọzi na-adịrị onye ga-eri achịcha[b] n’alaeze Chineke!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a pụtara n’ụzọ nkịtị “ndị ya na ya makpu n’eri nri,” n’ihi na ndị mmadụ na-amakarị ịmakpu n’akụkụ tebụl mgbe ha na-eri nri n’oge ahụ.
    reason: cultural_note
  - marker: b
    text: “Iri achịcha” bụ ụzọ e si ekwu okwu n’asụsụ Grik nke pụrụ ịpụta iso rie nri; e debere ihe oyiyi achịcha ahụ n’ebe a.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: mgbe ... nụrụ
  rationale: E ji nkebiokwu na-egosi oge mee ka usoro ihe mere doo anya n’Igbo, kama ịsụgharị participle Grik ahụ n’ụzọ ga-ada ka okwu siri ike.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị ntụgharị n’akụkọ ahụ na nzaghachi onye ahụ nyere n’ihe Jizọs kwuru.
- source_word: τις τῶν συνανακειμένων
  choice: otu onye n’ime ndị ha na ya nọ na-eri nri
  rationale: Nke a na-egosi otu onye a na-akpọghị aha n’etiti ndị ya na Jizọs na-eri nri; a kọwara ọnọdụ iri nri ahụ n’ụzọ ndị Igbo nke oge a ga-aghọta nke ọma.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: A hapụrụ demonstrative plural ahụ ka ọ na-arụtụ aka n’ihe Jizọs kwuru tupu nke a.
- source_word: εἶπεν αὐτῷ
  choice: ọ sịrị ya
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke okike isi kwuo usoro akụkọ ahụ.
- source_word: Μακάριος
  choice: Ngọzi na-adịrị
  rationale: Okwu a na-egosi ọnọdụ onye Chineke meere amara, ọ bụghị naanị mmetụta obi ụtọ; ahịrịokwu Igbo a na-eburu ibu okwu ngọzi ahụ n’ụzọ dị ndụ.
- source_word: ὅστις
  choice: onye
  rationale: N’ahịrịokwu a, ‘onye’ nwere nghọta zuru ezu nke onye ọ bụla dabara n’ihe a na-ekwu, n’enweghị ịkpọ otu onye kpọmkwem aha.
- source_word: φάγεται
  choice: ga-eri
  rationale: E chekwara ọdịnihu nke ngwaa Grik ahụ, nke na-ele anya n’iri nri n’alaeze Chineke.
- source_word: ἄρτον
  choice: achịcha
  rationale: Nke a na-echekwa ihe oyiyi nkịtị nke okwu Grik ahụ, ọ bụ ezie na n’omenala asụsụ ahụ o nwekwara ike ịpụta iso rie nri.
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: n’alaeze Chineke
  rationale: Ọ bụ nsụgharị kwụ ọtọ nke nkebiokwu ahụ; e tinyeghị ‘n’oriri’ n’isiokwu bụ́ isi n’agbanyeghị na ọnọdụ ahụ na-egosi oriri.
theological_decisions:
- issue: Ibu okwu Μακάριος n’okwu gbasara oriri nke alaeze Chineke n’ọdịnihu
  choice: Ngọzi na-adịrị onye ga-eri achịcha n’alaeze Chineke
  alternative: Obi ụtọ na-adịrị onye ga-eri achịcha n’alaeze Chineke
  rationale: ‘Ngọzi na-adịrị’ na-echekwa echiche nke amara na ihu ọma Chineke nke dị n’okwu a; ‘obi ụtọ’ pụrụ ime ka ọ dị ka naanị mmetụta mmadụ n’ime obi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee nsụgharị ahụ. A sụgharịrị ọnọdụ mmadụ ịmakpu iri nri n’ụzọ ga-ada nke ọma n’Igbo, ma kọwaa nkọwa omenala ya n’ala ala peeji. Ahịrịokwu “Ngọzi na-adịrị” na-echekwa ụda beatitude n’enweghị okwu ochie ma ọ bụ nkọwa ụka pụrụ iche.
