id: LUK.14.14
reference: Luke 14:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: ig
  text: Ngọzi ga-adịrị gị, n’ihi na ha enweghị ike ịkwụghachi gị; n’ihi na a ga-akwụghachi gị n’oge mbilite n’ọnwụ nke ndị ezi omume.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος ἔσῃ
  choice: Ngọzi ga-adịrị gị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ùgwù si ekwu na mmadụ ga-abụ onye a gọziri agọzi; ọ na-echekwa ibu okwu ahụ gbasara ngọzi Chineke na ọdịnihu, kama ime ka ọ bụrụ naanị mmetụta obi ụtọ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara ngọzi ahụ n'ụzọ doro anya ma bụrụkwa okwu Igbo a na-ejikarị eme ihe.
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: ha enweghị ike ịkwụghachi gị
  rationale: Ihe owuwu Grik ahụ pụtara na ha enweghị ikike ma ọ bụ ihe ha ga-eji kwụọ ụgwọ omume ọma ahụ; nsụgharị a zere nghọtahie nke ga-eme ka ọ dị ka a sị na ha enweghị ọrụ ịkwụghachi.
- source_word: ἀνταποδοθήσεται γάρ σοι
  choice: n’ihi na a ga-akwụghachi gị
  rationale: Ọ na-echekwa ọdịdị nnara-ọrụ nke okwu Grik ahụ na njikọ dị n’etiti ịkwụghachi n’oge a na ụgwọ a ga-enye n’ọdịnihu.
- source_word: ἐν τῇ ἀναστάσει
  choice: n’oge mbilite n’ọnwụ
  rationale: ἐν nwere ọrụ nke igosi oge n’ebe a; ‘n’oge’ bụ Igbo ebumpụta ụwa ma na-egosi mgbe nkwụghachi ahụ ga-eme.
- source_word: τῶν δικαίων
  choice: nke ndị ezi omume
  rationale: Ọ na-echekwa nkọwa genitiv ahụ na ihe δίκαιος pụtara n’ụzọ doro anya, n’enweghị ịgbakwunye nkọwa ụka pụrụ iche.
theological_decisions:
- issue: Ihe ‘mbilite n’ọnwụ nke ndị ezi omume’ pụtara
  choice: E debere ya dịka mbilite n’ọnwụ dị n’ọdịnihu nke metụtara ndị ezi omume.
  alternative: Ọ pụrụ izo aka na mbilite n’ọnwụ izugbe nke e mesiri ndị ezi omume ike, ma ọ bụ mbilite n’ọnwụ pụrụ iche nke ndị ezi omume.
  rationale: Amaokwu ahụ na-ekwusi ike na Chineke ga-akwụghachi ndị ezi omume n’oge mbilite n’ọnwụ, ma ọ naghị akọwa usoro ma ọ bụ oge ihe omume ndị ọzọ. Ya mere, nsụgharị ahụ ahọpụtaghị ozizi ụka ọ bụla n’etiti nghọta ndị ahụ.
- issue: Onye ga-akwụghachi ụgwọ ahụ
  choice: E jigidere ọdịdị nnara-ọrụ ‘a ga-akwụghachi gị.’
  alternative: ‘Chineke ga-akwụghachi gị.’
  rationale: Ọ bụ ezie na gburugburu okwu ahụ na-egosi na Chineke bụ onye ga-akwụghachi, Grik ahụ kpọghị ya aha kpọmkwem. Ijide nnara-ọrụ ahụ na-echekwa ụzọ e si kwuo ya na isi mmalite.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. E ji ‘ngọzi ga-adịrị gị’ mee ka μακάριος doo onye Igbo nkịtị anya, ma zere okwu ochie ma ọ bụ okwu nke otu ụka pụrụ iche.
