- from: O wee ruo na mgbe ọ banyere n’ụlọ otu n’ime ndị ndú ndị Farisii n’ụbọchị izu ike ka ọ rie nri[a], ha nọ na-ele ya anya nke ọma.[b]
  to: O wee bụrụ na, mgbe ọ banyere n’ụlọ otu n’ime ndị ndú ndị Farisii n’ụbọchị Sabat ka ọ rie nri[a], ha nọ na-ele ya anya nke ọma.[b]
  rationale: The revision corrects the Lukan narrative formula and restores the specific name of the Sabbath, while retaining the draft’s accurate, natural rendering of the hosted meal and the deliberately noncommittal description of the Pharisees’ observation. Footnote markers and notes remain correctly aligned with their anchors.
