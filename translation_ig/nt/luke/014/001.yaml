    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ha nọ na-enyocha ya nke ọma”; okwu Grik ahụ nwere ike igosi na ha ji enyo ma ọ bụ iro na-ele ya anya.
    reason: lexical_alternative
