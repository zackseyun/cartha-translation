id: LUK.14.1
reference: Luke 14:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: ig
  text: O wee bụrụ na, mgbe ọ banyere n’ụlọ otu n’ime ndị ndú ndị Farisii n’ụbọchị Sabat ka ọ rie nri[a], ha nọ na-ele ya anya nke ọma.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “ka ọ rie achịcha.” Ọ bụ akpaalaokwu pụtara iri nri.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ha nọ na-enyocha ya nke ọma”; okwu Grik ahụ nwere ike igosi na ha ji enyo ma ọ bụ iro na-ele ya anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Ọ bụ usoro Luk ji ewebata ihe mere; nsụgharị a bụ Igbo dị ebube ma na-agakwa nke ọma n’akụkọ.
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: mgbe ọ banyere
  rationale: Articular infinitive nwere ἐν na-egosi oge; ‘mgbe ọ banyere’ na-egosi nke a n’Igbo nkịtị.
- source_word: οἶκόν
  choice: ụlọ
  rationale: Nke a bụ ihe οἶκος pụtara kpọmkwem n’ọnọdụ oriri a.
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: otu n’ime ndị ndú ndị Farisii
  rationale: Ọ na-echekwa echiche nke otu onye so ná ndị na-edu ndị Farisii, n’enweghị ime ka aha ọchịchị ya sie ike karịa ihe Grik kwuru.
- source_word: σαββάτῳ
  choice: n’ụbọchị izu ike
  rationale: Dative a na-egosi oge; okwu Igbo a doro ndị na-agụ akwụkwọ anya ma na-ezo aka na Sabbath.
- source_word: φαγεῖν ἄρτον
  choice: ka ọ rie nri
  rationale: Ọ bụ ezie na ọ pụtara n’ụzọ nkịtị ‘iri achịcha,’ ọ bụ akpaalaokwu pụtara iri nri; isi ederede jiri Igbo nkịtị, ebe nkọwa ala peeji na-echekwa ọdịdị okwu mbụ.
- source_word: παρατηρούμενοι
  choice: na-ele ya anya nke ọma
  rationale: Ọ na-egosi ile mmadụ anya nke ọma ma nwee ike ịpụta nche enyo ma ọ bụ ibu iro; nsụgharị a echekwaghị ebumnobi ahụ dịka ihe e kwuru hoo haa.
- source_word: αὐτοὶ
  choice: ha
  rationale: ‘Ha’ na-enye isiokwu ahụ n’ụzọ Igbo na-aga nke ọma; itinye ‘ha onwe ha’ ga-adị arọ ma ọ bụghị ihe dị mkpa n’ebe a.
theological_decisions:
- issue: Ma ile Jizọs anya ahụ ò gosiri iro hoo haa
  choice: ha nọ na-ele ya anya nke ọma
  alternative: ha nọ na-enyocha ya / na-eche ya nche ka ha jide ya
  rationale: παρατηρούμενοι nwere ike ibu echiche nke enyo ma ọ bụ iro, ma amaokwu ahụ ekwughị ebumnobi ọjọọ hoo haa. Nhọrọ a na-echekwa esemokwu dị n’akụkọ ahụ n’etinyeghị ebubo karịrị isi mmalite.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dịkwa ebube. E jiri ‘ndị ndú’ kama okwu ọchịchị siri ike, ma jiri ‘ụbọchị izu ike’ maka Sabbath. Akara nkọwa [a] na [b] dị n’isi ederede ma kwekọọ na nkọwa ala peeji.
