  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: ig
  text: Ma ha niile malitere n’otu aka inye ihe ngọpụ.[a] Onye mbụ sịrị ya, ‘Azụtara m otu ubi, ọ dịkwa mkpa ka m gaa lee ya. Ana m arịọ gị, biko, gbaghara m.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “malitere ịjụ òkù ahụ,” ma ọ bụ “malitere ịgọpụta onwe ha.” Ngwaa Grik a nwere ike ịpụta ịjụ òkù site n’inye ihe ngọpụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ma
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ, ma n’ebe a ọ na-egosi ntụgharị megide òkù ahụ.
- source_word: ἤρξαντο ... πάντες παραιτεῖσθαι
  choice: ha niile malitere ... ịrịọ ka a gbaghara ha ịbịa
  rationale: Nke a na-egosi na onye ọ bụla malitere ịjụ òkù ahụ site n’inye ihe ngọpụ; mgbakwunye ‘ịbịa’ na-eme ka ụdị arịrịọ ahụ doo anya n’Igbo.
- source_word: ἀπὸ μιᾶς
  choice: n’otu olu
  rationale: Ọ bụ akpaalaokwu pụtara na ha niile mere otu ihe n’otu ụzọ ma ọ bụ dịka otu; ‘n’otu olu’ na-eburu ike mkpokọta ahụ n’Igbo.
- source_word: Ἀγρὸν
  choice: otu ubi
  rationale: ἀγρός bụ ubi ma ọ bụ ala; ‘ubi’ bụ okwu Igbo kpọmkwem nke na-adịghị etinye nkọwa ọrụ ugbo karịrị nke isi mmalite kwuru.
- source_word: ἠγόρασα
  choice: Azụrụ m
  rationale: Ọ na-egosi ihe onye ahụ zụrụla, nke ka metụtara ọnọdụ ya ugbu a.
- source_word: ἔχω ἀνάγκην
  choice: ọ dịkwa mkpa ka m
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụ eke isi kwuo na ihe dị onye ahụ mkpa ime.
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: gaa lee ya
  rationale: Ọ na-echekwa omume abụọ ahụ—ịga na ịhụ—n’enweghị ịgbakwunye echiche siri ike nke nyocha zuru ezu.
- source_word: ἐρωτῶ σε
  choice: Ana m arịọ gị
  rationale: Ọ na-echekwa arịrịọ nkwanye ùgwù doro anya nke Grik, kama ime ka ọ bụrụ naanị okwu ‘biko.’
- source_word: ἔχε με παρῃτημένον
  choice: were ya na a gbagharala m
  rationale: Nke a na-egosi ka onye ahụ na-arịọ onye kpọrọ ya ka ọ nabata na ọ gaghị abịa, ma na-echekwa ọnọdụ sitere n’omume ahụ.
- source_word: ὁ πρῶτος
  choice: Onye mbụ
  rationale: Nsụgharị kwụ ọtọ nke na-ewebata onye mbụ n’usoro ndị na-enye ihe ngọpụ.
