revisions:
- from: Onye ọzọ sịkwara, “Azụrụ m ehi abụọ abụọ, ụzọ ise[a], ana m aga ịnwale ha. Ana m arịọ gị, biko, gbaghara m[b].”
  to: Onye ọzọ sịkwara, “Azụrụ m ehi abụọ abụọ, ụzọ ise[a], ana m aga ịnwale ha. Ana m arịọ gị, were m dịka onye a gọpụrụ[b].”
  rationale: The revision preserves the agricultural image of five yoked pairs and corrects the final request so that it means being excused from attendance, not being forgiven for wrongdoing. It also removes an unclear footnote alternative.
  reviewer_model: gpt-5.6-terra
