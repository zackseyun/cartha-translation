  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: ig
  text: Onye ọzọ sịkwara, “Azụrụ m ehi abụọ abụọ, ụzọ ise[a], ana m aga ịnwale ha. Ana m arịọ gị, were m dịka onye a gọpụrụ[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ pụtara ụzọ ehi ise—ya bụ, ehi abụọ abụọ e jikọtara ọnụ ịrụ ọrụ, ụzọ ise. A pụkwara ịsụ ya, “ụzọ ehi ise” ma ọ bụ “ehi abụọ abụọ, ụzọ ise.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “were m dịka onye a gọpụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: Onye ọzọ
  rationale: N’usoro ndị a kpọrọ òkù na-enye ihe ngọpụ, okwu a pụtara onye ọzọ n’ime ha; nsụgharị a dị mfe ma bụrụ Igbo a na-asụ ugbu a.
- source_word: Ζεύγη βοῶν ... πέντε
  choice: ehi abụọ abụọ, ụzọ ise
  rationale: ζεῦγος na-egosi ụzọ anụmanụ abụọ a na-ejikọ ọnụ ịrụ ọrụ. Okwu ndị a na-eme ka onye na-agụ ya ghọta na ọ bụ ụzọ ehi ise, ọ bụghị naanị ehi ise.
- source_word: ἠγόρασα
  choice: Azụrụ m
  rationale: Oge aorist ebe a na-ekwu maka ihe o mere nke ka metụtara ihe ngọpụ ọ na-enye ugbu a. Igbo anaghị achọ ọdịiche dị n’etiti simple past na present perfect dịka Bekee si achọ ya.
- source_word: πορεύομαι
  choice: ana m aga
  rationale: Ọ na-egosi ihe onye ahụ na-aga ime ozugbo ma ọ bụ njem ọ na-amalite ugbu a.
- source_word: δοκιμάσαι
  choice: ịnwale
  rationale: δοκιμάζω ebe a bụ ịnwale ehi ndị a zụrụ iji hụ otú ha si arụ ọrụ; “ịnwale” bụ okwu doro anya ma bụrụ nke nkịtị.
- source_word: ἐρωτῶ σε
  choice: Ana m arịọ gị
  rationale: Okwu a bụ arịrịọ e ji nkwanye ùgwù kwuo, ọ bụghị nanị ịjụ ajụjụ.
- source_word: ἔχε με παρῃτημένον
  choice: biko, gbaghara m
  rationale: Akpaalaokwu Grik ahụ na-arịọ onye kpọrọ ya òkù ka o were ya dịka onye a hapụrụ ịbịa. “Biko, gbaghara m” na-ekwupụta nke a n’Igbo dị ndụ, ebe nkọwa okwu n’ụzọ nkịtị dị n’ala peeji.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. “Sịkwara” na-ejikọta okwu a na usoro ihe ngọpụ ndị gara aga. E debere ihe oyiyi ọrụ ugbo dị n’asụsụ Grik site n’ịkọwa ehi ndị ahụ dịka ehi abụọ abụọ, ụzọ ise.
