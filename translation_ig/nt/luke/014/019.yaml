    text: Okwu Grik ahụ pụtara ụzọ ehi ise—ya bụ, ehi abụọ abụọ e jikọtara ọnụ ịrụ ọrụ, ụzọ ise. A pụkwara ịsụ ya, “ụzọ ehi ise” ma ọ bụ “ehi abụọ abụọ, ụzọ ise.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “were m dịka onye a gọpụrụ.”
    reason: lexical_alternative
