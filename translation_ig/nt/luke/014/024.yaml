id: LUK.14.24
reference: Luke 14:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: ig
  text: N’ihi na ana m agwa unu na ọ dịghị onye ọ bụla n’ime ndị ikom ahụ a kpọrọ òkù ga-edetụ nri anyasị m[a] ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oriri m”; n’asụsụ ọdịnala, “nri mgbede m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: N’ihi na ana m agwa unu
  rationale: Nke a na-echekwa γάρ dị ka njikọ na-akọwa ihe e kwuru tupu ya, ma na-asụgharị usoro okwu ahụ n’Igbo doro anya nke na-egosi na a na-agwa ọtụtụ mmadụ okwu.
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: ọ dịghị onye ọ bụla n’ime ndị ikom ahụ
  rationale: ‘Ọ dịghị onye ọ bụla’ na-egosipụta nkwusioru siri ike nke οὐδείς, ebe ‘ndị ikom ahụ’ na-echekwa ma nwoke nke ἀνδρῶν ma ngosipụta nke ἐκείνων.
- source_word: τῶν κεκλημένων
  choice: a kpọrọ òkù
  rationale: N’ọnọdụ oriri a, καλέω pụtara ịkpọ òkù karịa naanị ‘ịkpọ’; okwu a na-egosikwa ndị natara òkù ahụ.
- source_word: γεύσεταί
  choice: ga-edetụ ... ọnụ
  rationale: Akpaalaokwu Igbo ‘idetụ ihe ọnụ’ na-echekwa ihe oyiyi nke γεύομαι, ‘itọ/taste,’ ma dịkwa eke n’okwu banyere nri.
- source_word: μου τοῦ δείπνου
  choice: nri anyasị m
  rationale: δεῖπνον bụ nri bụ isi a na-erikarị ná mgbede; ‘nri anyasị’ bụ okwu Igbo dị ugbu a ma ghara ịgbakwunye nkọwa karịrị isi mmalite ahụ. E depụtara ‘oriri m’ dị ka nhọrọ ọzọ n’ala peeji.
theological_decisions:
- issue: Okwu onye nwe oriri ahụ na ihe atụ ahụ
  choice: E debere onye nke mbụ n’‘nri anyasị m’ n’ebughị ụzọ kọwaa onye nwe oriri ahụ dịka ihe nnọchianya kpọmkwem.
  alternative: oriri m
  rationale: Asụsụ Grik na-edebe olu onye na-ekwu okwu n’ime ihe atụ ahụ. Ịhapụ ya otú ahụ na-echekwa esemokwu na ihe omimi nke nkà mmụta okpukpe kama ịtinye nkọwa n’ime amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ugwu. A họọrọ usoro okwu onye nkịtị ga-aghọta, ebe e chekwara ‘ndị ikom’ maka kpọmkwem nwoke nke ἀνδρῶν na ‘idetụ ... ọnụ’ maka ihe oyiyi nke γεύομαι.
