review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the generic scope, the reflexive contrast, and the unexpressed agent of both future passives. However, rendering καί solely by a comma leaves the Greek coordination unrepresented. A small recasting can retain the passive sense and explicitly carry the second coordinated clause.
  naturalness: The proposed wording is fluent Standard Igbo and keeps the aphoristic balance. Using the impersonal passive construction with the affected person expressed after the verb is especially clear and idiomatic.
  terminology: “Ebuli ... elu” and “eweda ... ala” appropriately render the paired metaphorical terms ὑψόω and ταπεινόω. “Onye ọ bụla” naturally represents the generic singular without adding gender.
  issues:
  - severity: low
    issue: The coordinating καί is omitted in the main text.
    rationale: A comma can join the clauses rhetorically, but it does not translate the explicit Greek conjunction. The enclitic -kwa (“also/and”) naturally marks the coordination in Igbo without weakening the antithetical parallelism.
  revised_text: N’ihi na a ga-eweda onye ọ bụla na-ebuli onwe ya elu ala, a ga-ebulikwa onye na-eweda onwe ya ala elu.
