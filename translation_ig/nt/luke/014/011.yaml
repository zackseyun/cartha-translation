- from: N’ihi na onye ọ bụla nke na-ebuli onwe ya elu ka a ga-eweda ala, onye na-eweda onwe ya ala ka a ga-ebuli elu.
  to: N’ihi na a ga-eweda onye ọ bụla na-ebuli onwe ya elu ala, a ga-ebulikwa onye na-eweda onwe ya ala elu.
  rationale: The revision preserves the proverbial universal force, voluntary self-exaltation/self-humbling, and the source’s two future passives without naming their agent. It also represents καί through -kwa and maintains the balanced contrast in natural modern Standard Igbo.
