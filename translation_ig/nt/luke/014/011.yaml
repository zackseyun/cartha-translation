id: LUK.14.11
reference: Luke 14:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: ig
  text: N’ihi na a ga-eweda onye ọ bụla na-ebuli onwe ya elu ala, a ga-ebulikwa onye na-eweda onwe ya ala elu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ọnọdụ a, okwu ahụ na-ewebata ihe mere Jizọs ji nye ntụziaka dị n’amaokwu bu ụzọ; “N’ihi na” na-egosipụta njikọ nkọwa ahụ nke ọma.
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: onye ọ bụla nke na-ebuli onwe ya elu
  rationale: Nkebi a na-ekwu maka onye ọ bụla n’ozuzu ya. “Na-ebuli onwe ya elu” na-egosipụta ịkwalite onwe onye, ọ bụghị ibuli ahụ elu n’ụzọ nkịtị.
- source_word: ταπεινωθήσεται
  choice: a ga-eweda ala
  rationale: 'Nke a na-edobe ọdịdị nnara-eme nke ngwaa Grik: onye ahụ ga-anata mweda, ebe a na-akpọghị onye ga-eme ya aha.'
- source_word: καὶ
  choice: ','
  rationale: N’Igbo, njikọ dị n’etiti ahịrị abụọ a na-apụta nke ọma site n’usoro ilu ha na nkwekọrịta okwu ha; rikoma na-eme ka ahịrịokwu ahụ bụrụ nke e ji ọnụ ekwu n’ụzọ dị ire, n’agbanyeghị na Grik ji “na” jikọta ha.
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: onye na-eweda onwe ya ala
  rationale: Nke a na-egosipụta onye ji aka ya họrọ ịdị umeala n’obi, ma na-edobekwa nhazi ya na nkebi nke mbụ.
- source_word: ὑψωθήσεται
  choice: a ga-ebuli elu
  rationale: Nke a na-edobe ọdịdị nnara-eme na mmegide ya na “a ga-eweda ala,” n’etinyeghị onye na-eme ihe ahụ n’amaokwu.
theological_decisions:
- issue: Onye a na-aghọtaghị aha ya nke na-eme ihe n’ụdị ngwaa nnara-eme abụọ
  choice: Idobe “a ga-eweda” na “a ga-ebuli” n’akpọghị Chineke aha
  alternative: Ịsị “Chineke ga-eweda” na “Chineke ga-ebuli”
  rationale: Ọ bụ ezie na ọnọdụ Akwụkwọ Nsọ nwere ike igosi na Chineke bụ onye na-eme ihe ahụ, Grik akpọghị ya aha. Ya mere, nsụgharị ahụ anaghị ekpebi ihe ederede hapụrụ n’ụzọ a na-ekwughị kpọmkwem.
- issue: Ụdị nwoke otu onye e ji kwuo mmadụ niile na Grik
  choice: Iji “onye” na “onwe ya,” bụ́ okwu Igbo na-adịghị egosi nwoke ma ọ bụ nwaanyị
  alternative: Ịgbakwunye okwu na-egosi nwoke kpọmkwem
  rationale: Grik ji ụdị nwoke otu onye mee ihe n’ụzọ metụtara mmadụ niile. N’Igbo, “onye” na “onwe ya” na-ebuga otu ihe ahụ n’ụzọ ebumpụta ụwa n’enweghị ịgbakwunye okike nke asụsụ Igbo anaghị achọ n’ebe a.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ilu ahụ na myirịta nke “na-ebuli onwe ya elu / a ga-eweda ala” na “na-eweda onwe ya ala / a ga-ebuli elu.”
