source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: ig
  text: “Ọ bụrụ na onye ọ bụla abịakwute m ma ọ kpọghị nna ya na nne ya na nwunye ya na ụmụ ya na ụmụnne ya nwoke na ụmụnne ya nwanyị asị—na ọbụna ndụ nke ya—ọ pụghị ịbụ onye na-eso ụzọ m.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ma ọ hụghị m n’anya karịa ndị a, ọbụna karịa ndụ ya.” Okwu Grik ahụ pụtara kpọmkwem “ịkpọ asị,” ma n’ebe a ọ na-egosi na ikwesi ntụkwasị obi nye Jizọs aghaghị ịdị mbụ karịa ọbụna mmekọrịta ezinụlọ kacha nso. Tulee Matiu 10:37.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mkpụrụ obi nke ya.” N’ebe a, o yikarịrị ka ψυχή na-ezo aka ná ndụ mmadụ, n’ihi na ọnọdụ ahụ bụ maka ọnụ ahịa iso ụzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: kpọghị ... asị
  rationale: Nke a na-edobe isi okwu Grik ahụ, ‘ịkpọ asị,’ na ike dị n’okwu Jizọs; nkọwa nke ịhụ ndị ọzọ n’anya n’ókè dị ala ka edobere n’akwụkwọ nkọwa kama ime ka okwu ahụ dị nro n’ahịrị isi.
- source_word: ἔρχεται πρός με
  choice: abịakwute m
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na mmadụ na-abịa n’ebe onye ọzọ nọ, n’enweghị itinye echiche ‘iso m n’azụ’ nke na-adịghị n’okwu Grik a.
- source_word: πατέρα ἑαυτοῦ
  choice: nna ya
  rationale: N’Igbo, nnọchiaha ‘ya’ na-egosi nke ọma na ọ bụ nna onye ahụ n’onwe ya; ịgbakwunye okwu ọzọ maka reflexive ga-eme ka ahịrị ahụ sie ike n’enweghị mkpa.
- source_word: γυναῖκα
  choice: nwunye ya
  rationale: N’usoro ndị ezinụlọ a kpọrọ aha, γυνή pụtara nwunye, ọ bụghị naanị nwanyị n’ozuzu.
- source_word: ἀδελφοὺς καὶ ἀδελφάς
  choice: ụmụnne ya ndị nwoke na ndị nwanyị
  rationale: Nke a na-egosipụta kpọmkwem ma ụmụnne nwoke ma ụmụnne nwanyị ndị dị n’isi mmalite Grik.
- source_word: ἔτι τε καὶ
  choice: ọbụna
  rationale: ‘Ọbụna’ na-enye ihe ikpeazụ n’usoro ahụ ike pụrụ iche dịka okwu Grik si eme.
- source_word: ψυχὴν ἑαυτοῦ
  choice: ndụ nke ya
  rationale: N’ihe gbasara ụgwọ iso ụzọ, ψυχή na-ezo aka n’ụzọ kacha kwe omume ná ndụ mmadụ n’onwe ya. ‘Ndụ nke ya’ na-edobe nkwusiri ike nke reflexive ma ghara ime ka okwu ahụ bụrụ naanị banyere akụkụ ime mmụọ.
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: ọ pụghị ịbụ onye na-eso ụzọ m
  rationale: Nke a bụ Igbo doro anya nke na-edobe echiche enweghị ike ma ọ bụ ekwekọghị ekwekọ, ọ bụghị naanị iwu machibidoro mmadụ ime ihe.
theological_decisions:
- issue: Ma a ga-eme ka μισεῖ dị nro n’ahịrị isi site n’ịsụgharị ya dịka ịhụ ndị ezinụlọ n’anya n’ókè dị ala
  choice: Edobere ‘kpọọ ... asị’ n’ahịrị isi, ma kọwaa echiche ntụnyere na nrubeisi kachasị elu n’akwụkwọ nkọwa.
  alternative: Ịsụgharị ya n’ahịrị isi dịka ‘ọ hụghị m n’anya karịa ha.’
  rationale: Okwu Jizọs bụ nke e ji ụma kwuo n’ụzọ siri ike. Idebe ya na-echekwa esemokwu na ike dị n’isi mmalite, ebe akwụkwọ nkọwa na-egosi echiche ntụnyere nke ọnọdụ ahụ na Matiu 10:37 na-akwado.
- issue: Ihe ψυχή pụtara n’amaokwu a
  choice: A sụgharịrị ya ‘ndụ.’
  alternative: ‘Mkpụrụ obi’ ma ọ bụ ‘onwe ya.’
  rationale: Ọnọdụ ahụ na-ekwu maka ihe iso ụzọ ga-efu mmadụ, gụnyere ịhapụ ọbụna ndụ ya. ‘Ndụ’ na-enye echiche ahụ nke ọma n’Igbo oge a n’ebughị ụzọ kpebie ozizi banyere ọdịdị mkpụrụ obi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrị ahụ na-edobe ike na mwute nke okwu Jizọs kama ime ka ọ dị nro. E ji ‘onye na-eso ụzọ’ mee μαθητής n’ihi na ọ bụ okwu Igbo a na-aghọta nke ọma maka onye na-amụta ihe ma na-eso onye nkụzi.
