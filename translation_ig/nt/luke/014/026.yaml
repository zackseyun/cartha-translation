revisions:
- from: '“Ọ bụrụ na onye ọ bụla abịakwute m ma ọ kpọghị nna ya na nne ya na nwunye ya na ụmụ ya na ụmụnne ya ndị nwoke na ndị nwanyị asị—ọbụna ndụ nke ya—ọ pụghị ịbụ onye na-eso ụzọ m.[a][b]”


    [a] A pụkwara ịsụgharị ya, “ma ọ hụghị ha n’anya nke na-erughị otú ọ hụrụ m n’anya.” Okwu Grik ahụ pụtara kpọmkwem “ịkpọ asị,” ma n’ebe a ọ na-egosi na mmadụ aghaghị ibute nrubeisi ya nye Jizọs ụzọ karịa ọbụna mmekọrịta ezinụlọ kacha chie anya. Tulee Matiu 10:37.


    [b] A pụkwara ịsụgharị ya, “mkpụrụ obi nke ya.” N’ebe a, o yikarịrị ka ψυχή na-ezo aka ná ndụ mmadụ, n’ihi na ihe a na-ekwu bụ ihe mmadụ ga-ahapụ iji bụrụ onye na-eso ụzọ Jizọs.'
  to: “Ọ bụrụ na onye ọ bụla abịakwute m ma ọ kpọghị nna ya na nne ya na nwunye ya na ụmụ ya na ụmụnne ya nwoke na ụmụnne ya nwanyị asị—na ọbụna ndụ nke ya—ọ pụghị ịbụ onye na-eso ụzọ m.[a][b]”
  rationale: E degharịrị naanị okwu ndị na-adịghị ada nke ọma n’Igbo ma ọ bụ ndị nwere ike ikwu karịa ka isi mmalite si kwuo. Ahịrị isi ka na-edobe ike okwu μισεῖ, mkpali ‘na ọbụna,’ na ‘ndụ’ dịka nghọta dabara n’ọnọdụ ψυχή. A haziri [a] ka ọ bụrụ ụzọ ọzọ doro anya n’Igbo, n’enweghị ime ka ‘ịkpọ asị’ dị nro n’ahịrị isi, ma [b] edobela amụma ya n’ókè isi mmalite kwadoro.
