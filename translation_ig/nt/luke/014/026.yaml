  verdict: revise
  source_fidelity: 'Ahịrị isi na-edobe ihe ndị dị mkpa n’asụsụ Grik: ọnọdụ “ọ bụrụ na,” ‘ịbịakwute m,’ okwu μισεῖ (“ịkpọ asị”) n’enweghị ime ka ọ dị nro, ndepụta ezinụlọ dum, mkpali nke “ọbụna,” ndụ mmadụ n’onwe ya, na enweghị ike ịbụ onye na-eso ụzọ Jizọs. Otú ọ dị, nkọwa ala [a] kwesịrị ime ka ụzọ ọzọ a pụrụ isi ghọta okwu a bụrụ Igbo ziri ezi ma doo anya karịa.'
  naturalness: Ahịrị isi bụ Igbo Izugbe doro anya. ‘Ụmụnne ya ndị nwoke na ndị nwanyị’ ghọtara nke ọma, mana ‘ụmụnne ya nwoke na ụmụnne ya nwanyị’ na-adịkarị n’ụzọ ebumpụta ụwa ma na-egosikwa akụkụ abụọ ahụ kpọmkwem. Nkọwa [a] ugbu a, ‘ọ hụghị ha n’anya nke na-erughị otú ọ hụrụ m n’anya,’ anaghị ada nke ọma n’Igbo ma nwee ike ime ka ntụnyere ahụ ghara ido anya.
  terminology: ‘kpọọ ... asị,’ ‘nwunye,’ ‘ndụ nke ya,’ na ‘onye na-eso ụzọ m’ dabara na okwu Grik na aha ọmụmụ ihe okpukpe n’enweghị itinye nkọwa ozizi. Nkọwa [a] ga-eji ‘ikwesi ntụkwasị obi’ maka loyalty karịa ‘nrubeisi,’ n’ihi na nke a ka kwekọrọ n’echiche isiokwu Bekee na ọnọdụ amaokwu ahụ.
