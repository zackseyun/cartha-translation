  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: ig
  text: Ma ọ bụrụ na ọ bụghị otú ahụ, mgbe eze nke ọzọ ka nọ n’ebe dị anya, ọ na-eziga ndị nnọchiteanya ka ha jụọ maka ihe ndị gbasara udo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, ‘ihe ndị metụtara udo’; nke a pụrụ ịgụnye ihe ndị ga-eme ka udo dị ma ọ bụ usoro udo.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: Ma ọ bụrụ na ọ bụghị otú ahụ
  rationale: Nke a na-edobe ụdị okwu ọnọdụ na mmegide dị n’asụsụ Grik, ‘ma ọ bụrụ na ọ bụghị,’ n’Igbo dị mfe ma ghara ịkọwapụta kpọmkwem ihe eze ahụ na-apụghị ime.
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: mgbe eze nke ọzọ ka nọ n’ebe dị anya
  rationale: Nkebiokwu a na-egosi ihe na-eme n’otu oge ahụ. ‘Eze nke ọzọ’ na-eme ka o doo anya na αὐτοῦ na-ezo aka n’eze na-abịanụ, ebe ‘ka nọ n’ebe dị anya’ na-egosipụta ἔτι na πόρρω.
- source_word: πρεσβείαν
  choice: ndị nnọchiteanya
  rationale: Okwu Grik a nwere ike ịpụta òtù ndị e zigara ka ha nọchite anya onye ọchịchị. ‘Ndị nnọchiteanya’ bụ okwu Igbo nke oge a, doro anya ma kwesịkwa ọnọdụ eze na agha.
- source_word: ἀποστείλας
  choice: ọ na-eziga
  rationale: 'Ọ bụ ezie na Grik ji participle aorist, iji ngwaa zuru ezu n’Igbo na-eme ka usoro omume ahụ bụrụ ihe e ji olu ebumpụta ụwa kwuo: o bu ụzọ ziga ndị nnọchiteanya ka ha rịọ.'
- source_word: ἐρωτᾷ
  choice: ka ha rịọ maka
  rationale: N’ebe a, ἐρωτάω pụtara ịrịọ ma ọ bụ ịchọ ihe, ọ bụghị naanị ịjụ ajụjụ. Nhazi a na-egosikwa na ndị e zigara na-arịọchitere eze ha arịrịọ.
- source_word: τὰ πρὸς εἰρήνην
  choice: usoro nkwekọrịta udo
  rationale: Nkebiokwu ahụ pụtara n’ụzọ nkịtị ‘ihe ndị metụtara udo.’ N’ọnọdụ eze abụọ nwere ike ịlụ agha, ‘usoro nkwekọrịta udo’ na-enye ihe ọ pụtara n’Igbo doro anya n’enweghị ịgbakwunye nkọwa okpukpe.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘eze nke ọzọ’ iji gbochie mgbagwoju anya banyere onye αὐτοῦ na-ezo aka na ya, ma e debere εἰ δὲ μήγε n’ụdị ọnọdụ ya kama ịkọwa ya karịa ihe ederede kwuru.
