  to: Ma ọ bụrụ na ọ bụghị otú ahụ, mgbe eze nke ọzọ ka nọ n’ebe dị anya, ọ na-eziga ndị nnọchiteanya ka ha jụọ maka ihe ndị gbasara udo.[a]
