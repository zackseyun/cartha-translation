  to: Mgbe oge nri anyasị ahụ ruru, o zipụrụ odibo ya ka ọ gaa gwa ndị a kpọrọla òkù, sị, “Bịanụ, n’ihi na ihe niile[a] adịla njikere ugbu a.”
  rationale: The revision preserves the Greek passive ambiguity concerning the earlier inviter and relocates and clarifies the footnote so that it accurately explains the implicit collective expression in the source. No doctrinal or interpretive expansion is introduced.
