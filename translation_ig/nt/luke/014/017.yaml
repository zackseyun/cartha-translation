  text: καὶ ἀπέστειλεν τὸν δοῦλον αὐτοῦ τῇ ὥρᾳ τοῦ δείπνου εἰπεῖν τοῖς κεκλημένοις· Ἔρχεσθε, ὅτι ἤδη ἕτοιμά ⸀ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: ig
  text: Mgbe oge nri anyasị ahụ ruru, o zipụrụ odibo ya ka ọ gaa gwa ndị a kpọrọla òkù, sị, “Bịanụ, n’ihi na ihe niile[a] adịla njikere ugbu a.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, a kwughị kpọmkwem ihe bụ isiokwu ahụ. Okwu neuter plural ahụ nwere echiche mkpokọta, nke e ji “ihe niile” gosipụta n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: o zipụrụ
  rationale: Okwu a na-egosi na onye ahụ zigara odibo ya ozi; “zipụrụ” bụ okwu Igbo doro anya ma kwekọọ n’ụdị ngwaa gara aga.
- source_word: δοῦλον
  choice: odibo ya
  rationale: N’akụkọ ilu a, ọrụ onye ahụ dị ka onye na-eje ozi ma na-ezisa ozi bụ ihe a na-elekwasị anya. “Odibo” bụ okwu Igbo nkịtị nke na-egosipụta ọnọdụ ahụ n’enweghị itinye nkọwa okpukpe ọzọ.
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: Mgbe oge nri anyasị ahụ ruru
  rationale: Nke a na-egosi oge a kara aka maka nri ahụ. Ụdị a bụ Igbo e ji ekwu okwu nke ọma ma na-echekwa echiche nke ‘n’oge nri ahụ.’
- source_word: εἰπεῖν
  choice: ka ọ gaa gwa ... sị
  rationale: Infinitive ahụ na-egosi nzube e ji zipụ odibo ahụ. “Ka ọ gaa gwa ... sị” na-eduga n’okwu e hotara n’ụzọ Igbo si aga nke ọma.
- source_word: τοῖς κεκλημένοις
  choice: ndị ọ kpọrọla òkù
  rationale: Perfect passive participle ahụ na-egosi na a kpọọlarị ha òkù tupu ozi nke ugbu a erute. “Kpọrọla òkù” na-echekwa echiche ahụ.
- source_word: Ἔρχεσθε
  choice: Bịanụ
  rationale: Nke a bụ iwu a na-enye ọtụtụ mmadụ ka ha bịa; “Bịanụ” na-egosipụta ya nke ọma n’Igbo.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Okwu a na-ewebata ihe mere e ji kpọọ ha ka ha bịa.
- source_word: ἤδη
  choice: adịla ... ugbu a
  rationale: Ngwakọta “-la” na “ugbu a” na-egosi na nkwadebe ahụ agwụla tupu oge a, ma na ọnọdụ ahụ dị otu a ugbu a.
- source_word: ἕτοιμά ἐστιν
  choice: ihe niile adịla njikere
  rationale: N’asụsụ Grik, adjective neuter plural ahụ na-arụ ọrụ dịka mkpokọta, ebe ngwaa ya dị singular. “Ihe niile adịla njikere” bụ ụzọ Igbo nkịtị si akọwa echiche ahụ, ebe ndetu ala na-echekwa mgbagwoju anya dị n’isiokwu e kwughị kpọmkwem.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Odibo” dabara n’ọrụ onye ahụ n’ezinụlọ nke akụkọ ilu a; a zere okwu ndị nwere ike itinye nkọwa ụka ma ọ bụ ozizi na-adịghị n’amaokwu ahụ.
