review_pass:
  verdict: revise
  source_fidelity: 'The verse is substantially faithful: it preserves the sending, the appointed mealtime, the summons, and the readiness of what has been prepared. However, “ndị ọ kpọrọla òkù” makes the sender explicitly the one who had invited them, whereas the Greek perfect passive participle simply says “those who had been invited.”'
  naturalness: The rendering is clear, idiomatic Standard Igbo, and its respectful narrative register suits the parable. “Mgbe oge nri anyasị ahụ ruru,” “odibo,” and “Bịanụ” are natural in context.
  terminology: “Odibo” is a suitable context-sensitive rendering of δοῦλος in this household-parable setting. “Ihe niile adịla njikere ugbu a” naturally expresses the Greek collective neuter plural, while the note should be anchored to that supplied collective expression rather than to the end of the quotation.
  issues:
  - severity: medium
    issue: The invited people are described as “ndị ọ kpọrọla òkù.”
    rationale: The Greek τοῖς κεκλημένοις is passive and does not expressly identify who issued the earlier invitations. “Ndị a kpọrọla òkù” retains that passive formulation and avoids adding an explicit agent.
  - severity: low
    issue: The footnote marker is placed after the closing quotation rather than at the phrase it explains.
    rationale: The note concerns the implicit subject and collective sense represented by “ihe niile”; placing the marker directly after that phrase gives it a clear anchor.
  - severity: low
    issue: The current footnote’s proposed alternative, “ọ dịla njikere ugbu a,” can misleadingly sound as though a singular subject is present in Greek.
    rationale: Greek leaves the subject unexpressed and uses a neuter plural predicate collectively. The note should describe this without implying that Greek explicitly supplies “ọ.”
  revised_text: Mgbe oge nri anyasị ahụ ruru, o zipụrụ odibo ya ka ọ gaa gwa ndị a kpọrọla òkù, sị, “Bịanụ, n’ihi na ihe niile[a] adịla njikere ugbu a.”
