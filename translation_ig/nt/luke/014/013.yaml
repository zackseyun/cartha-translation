  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: ig
  text: Kama, mgbe ọ bụla ị mere oriri[a], kpọọ ndị ogbenye, ndị nwere nkwarụ n’ahụ[b], ndị ngwọrọ, na ndị ìsì.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mgbe ị kwadebere oriri” ma ọ bụ “mgbe ị nabatara ndị ọbịa n’oriri.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a na-ezo aka n’ndị nwere nkwarụ n’ahụ; a pụkwara ịsụgharị ya, “ndị nwere akụkụ ahụ merụrụ emerụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Kama
  rationale: Ọ na-egosi mgbanwe doro anya site n’ihe a machibidoro n’amaokwu bu ụzọ gaa n’ihe e kwesịrị ime.
- source_word: ὅταν
  choice: mgbe ọ bụla
  rationale: Ọ na-egosipụta oge na-abụghị naanị otu oge, kama oge ọ bụla ọnọdụ ahụ mere.
- source_word: δοχὴν ποιῇς
  choice: ị na-eme oriri
  rationale: Nke a bụ ụzọ Igbo dị ndụ si ekwu mmadụ ịkwado oriri ma ọ bụ nnabata e ji nri eme; ọ naghị amachi ya n’otu ụdị nri.
- source_word: κάλει
  choice: kpọọ
  rationale: N’ọnọdụ oriri a, ‘kpọọ’ pụtara ịkpọ ndị mmadụ òkù, dịka ngwaa Grik ahụ si pụta.
- source_word: πτωχούς
  choice: ndị ogbenye
  rationale: Ọ na-ezo aka n’ìgwè ndị dara ogbenye ma na-edebe usoro ndepụta dị mkpirikpi nke Grik.
- source_word: ἀναπείρους
  choice: ndị nwere nkwarụ
  rationale: Okwu a na-ezo aka n’ndị nwere nkwarụ n’ahụ n’ụzọ sara mbara. Nhọrọ a bụ nke nkwanye ùgwù ma dị iche na okwu na-esote nke metụtara ịga ije.
- source_word: χωλούς
  choice: ndị ngwọrọ
  rationale: Ọ na-ezo kpọmkwem n’ndị ụkwụ ha nwere nsogbu nke na-eme ka ije sie ha ike, ya mere ọ na-anọgide dị iche na ἀναπείρους.
- source_word: τυφλούς
  choice: ndị ìsì
  rationale: Nke a bụ okwu Igbo nkịtị na nke doro anya maka ndị na-adịghị ahụ ụzọ.
theological_decisions:
- issue: Otú e si sụgharịta okwu abụọ dị iche iche gbasara nkwarụ ahụ
  choice: ndị nwere nkwarụ … ndị ngwọrọ
  alternative: ndị akụkụ ahụ ha mebiri emebi … ndị ngwọrọ
  rationale: Nhọrọ ahụ na-edebe ọdịiche dị n’etiti ἀναπείρους, nke sara mbara gbasara nkwarụ ahụ, na χωλούς, nke metụtara nsogbu ije; ọ naghịkwa etinye nkọwa nkuzi okpukpe na-adịghị n’ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ ndepụta ahụ n’ụdị dị mkpirikpi dịka Grik, ma jiri okwu na-akwanyere ndị nwere nkwarụ ùgwù.
