review_pass:
  verdict: revise
  source_fidelity: The adversative «Kama», the indefinite temporal sense, invitation imperative, and fourfold list are retained. «Ndị nwere nkwarụ» is broadly defensible for ἀναπείρους, but adding «n’ahụ» more explicitly represents the bodily impairment denoted by the Greek and helps distinguish it from the following specific category, «ndị ngwọrọ». «Mgbe ọ bụla ị mere» gives the Greek indefinite temporal clause more naturally than the progressive «ị na-eme».
  naturalness: The revision uses idiomatic, contemporary Standard Igbo. «Kpọọ» naturally means invite in this hospitality context, and the concise coordinated list reads smoothly.
  terminology: «Ndị ogbenye», «ndị ngwọrọ», and «ndị ìsì» are clear established terms. «Ndị nwere nkwarụ n’ahụ» is respectful modern wording while preserving the distinction from walking impairment. The footnote supplies a more limb-specific alternative without asserting an overly narrow meaning.
  issues:
  - severity: low
    issue: The temporal clause uses progressive aspect («mgbe ọ bụla ị na-eme»).
    rationale: Although understandable, «mgbe ọ bụla ị mere» more naturally conveys ὅταν with the subjunctive, referring to any occasion on which one gives a feast.
  - severity: low
    issue: The rendering of ἀναπείρους lacks an explicit bodily qualifier.
    rationale: «Ndị nwere nkwarụ» can be broader than the physical impairment in view. Adding «n’ahụ» improves source precision and maintains the distinction from «ndị ngwọrọ».
  revised_text: Kama, mgbe ọ bụla ị mere oriri[a], kpọọ ndị ogbenye, ndị nwere nkwarụ n’ahụ[b], ndị ngwọrọ, na ndị ìsì.
