base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: ig
  text: Ọ baghị uru n’ala, ọ baghịkwa uru n’ikpo nsị anụ[a]; ha na-atụfu ya n’èzí. Onye nwere ntị ịnụ ihe[b], ya nụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpo nsị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Onye ọ bụla nwere ntị ịnụ ihe, ya nụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: ala
  rationale: N’ọnọdụ okwu ugbo a, γῆ na-ezo aka n’ala a na-akọ ihe, ọ bụghị ụwa dum. “Ala” bụ okwu Igbo doro anya ma kwekọọ na onyinyo ikpo nsị anụ.
- source_word: κοπρίαν
  choice: ikpo nsị anụ
  rationale: κοπρία na-ezo aka n’ikpo nsị ma ọ bụ nri ala sitere na nsị anụ. “Ikpo nsị anụ” na-edobe kpọmkwem onyinyo ọrụ ugbo ahụ n’asụsụ Igbo nke oge a.
- source_word: εὔθετόν
  choice: ọ baghị uru
  rationale: εὔθετος pụtara ihe kwesịrị ekwesị ma ọ bụ bara uru maka otu ọrụ. N’Igbo, “ọ baghị uru n’...” na-ekwupụta nke a n’ụzọ ebumpụta ụwa n’enweghị ịgbakwunye nkọwa ọzọ.
- source_word: ἔξω βάλλουσιν αὐτό
  choice: ha na-atụfu ya n’èzí
  rationale: Nke a na-edobe ngwaa ahụ n’olu ọrụ na isiokwu ọtụtụ na-akọwaghị kpọmkwem, dị ka Grik si mee, ma na-echekwa onyinyo ịtụfu ihe n’èzí.
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: Onye nwere ntị ịnụ ihe, ya nụrụ
  rationale: Nke a na-agbasochi usoro okwu Grik anya ma na-edobe ike iwu dị na ἀκουέτω. “Onye” na-arụ ọrụ n’Igbo dị ka onye nnọchianya nke onye ọ bụla.
theological_decisions:
- issue: Otu onye e ji anọchi anya mmadụ niile n’ịdọ aka ná ntị ikpeazụ
  choice: Onye nwere ntị ịnụ ihe, ya nụrụ
  alternative: Onye ọ bụla nwere ntị ịnụ ihe, ya nụrụ
  rationale: Grik ji otu onye mee okwu ahụ, ma ọ na-emetụta onye ọ bụla. “Onye” na-edobe ọdịdị ahụ n’Igbo ma ghara ime ka okwu ahụ bụrụ nke nwoke naanị, ebe Igbo enweghị akara okike nwoke n’okwu a.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A họọrọ “ọ baghị uru” kama usoro siri ike dịka “o kwesịghị ekwesị,” iji mee ka ilu ahụ daa nke ọma n’Igbo ma ka na-echekwa echiche nke ihe na-ekwesịghị maka ọrụ ahụ.
