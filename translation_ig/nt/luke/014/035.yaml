review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the agricultural contrast in οὔτε εἰς γῆν οὔτε εἰς κοπρίαν, retains the indefinite active plural in ἔξω βάλλουσιν αὐτό, and does not add theological interpretation. The final imperative, however, must be expressed as an Igbo imperative rather than with the perfective-looking form “nụrụ.”
  naturalness: '“Ọ baghị uru n’ala, ọ baghịkwa uru n’ikpo nsị anụ” is clear, natural Standard Igbo for this concrete agricultural image. “Onye nwere ntị ịnụ ihe, ya nụrụ” is not suitable here: “nụrụ” normally reads as completed hearing. “ya nụ” naturally conveys the exhortation.'
  terminology: “Ala” and “ikpo nsị anụ” appropriately represent soil and a manure/dung pile. The footnote’s proposed “ikpo nri ala sitere na nsị anụ” is explanatory and less direct than a lexical alternative; “ikpo nsị” is a cleaner alternative.
  issues:
  - severity: medium
    issue: The closing command uses “ya nụrụ.”
    rationale: ἀκουέτω is a present imperative (“let him hear”). In Standard Igbo, “nụrụ” ordinarily has perfective/past force; “ya nụ” gives the required imperative exhortation.
  - severity: low
    issue: Footnote a is not a concise lexical alternative.
    rationale: “ikpo nri ala sitere na nsị anụ” explains possible agricultural use but does not directly render κοπρίαν as a pile/heap. “ikpo nsị” preserves the lexical alternative without expanding the meaning.
