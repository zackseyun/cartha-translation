id: LUK.14.21
reference: Luke 14:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: ig
  text: Mgbe ohu ahụ lọtara, ọ kọọrọ onyenwe ya ihe ndị a. Mgbe ahụ, iwe were onye nwe ụlọ ahụ, o wee sị ohu ya, “Pụọ ngwa ngwa gaa n’okporo ámá ndị sara mbara na n’ụzọ warara nke obodo ahụ, kpọbatakwa ndị ogbenye, ndị nwere nkwarụ, ndị ìsì na ndị ngwụrọ n’ebe a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενος
  choice: lọtara
  rationale: N’usoro akụkọ a, ohu ahụ si n’ọrụ e zigara ya lọghachi ịkọ ihe mere; “lọtara” na-egosipụta nke a n’Igbo nkịtị.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” bụ okwu Igbo kwesịrị ekwesị maka onye nọ n’okpuru onye nwe ya n’ezinụlọ a, ma na-edobe ọnọdụ mmekọrịta ahụ nke ọma.
- source_word: ἀπήγγειλεν
  choice: kọọrọ
  rationale: Ọ na-egosi izigara onye ka elu akụkọ banyere ihe mere.
- source_word: κυρίῳ
  choice: onyenwe
  rationale: N’ebe a, okwu ahụ na-ezo aka n’onyenwe ohu ahụ bụ mmadụ, ọ bụghị aha Chineke.
- source_word: ὀργισθεὶς
  choice: iwe were
  rationale: Akpaalaokwu Igbo a na-egosipụta na iwe bilitere n’ime onye nwe ụlọ ahụ tupu o kwuo okwu.
- source_word: οἰκοδεσπότης
  choice: onye nwe ụlọ
  rationale: Ọ na-egosi onye bụ isi ma na-achị ụlọ ahụ; ọ bụkwa okwu doro anya n’Igbo ugbu a.
- source_word: πλατείας
  choice: okporo ámá ndị sara mbara
  rationale: Nke a na-edobe echiche nke nnukwu ụzọ ọha na eze ma na-egosi ọdịiche ya na ụzọ nta.
- source_word: ῥύμας
  choice: ụzọ nta dị iche iche
  rationale: Ọ na-ezo aka n’ụzọ ndị dị warara ma ọ bụ obere ụzọ dị n’obodo, n’ụzọ ga-edo anya nye ndị na-agụ Igbo.
- source_word: πτωχούς
  choice: ndị ogbenye
  rationale: Nke a bụ nsụgharị Igbo kwụ ọtọ ma bụrụ nke a na-aghọta nke ọma.
- source_word: ἀναπείρους
  choice: ndị nwere nkwarụ
  rationale: Okwu sara mbara a na-egosi ndị ahụ ha nwere nkwarụ ma ghara ime ka ọ bụrụ naanị otu ụdị mmerụ ahụ.
- source_word: τυφλούς
  choice: ndị ìsì
  rationale: Ọ bụ okwu Igbo kpọmkwem maka ndị na-adịghị ahụ ụzọ.
- source_word: χωλούς
  choice: ndị ngwụrọ
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka ndị ụkwụ ha nwere nkwarụ nke na-eme ka ije siere ha ike.
theological_decisions:
- issue: Nsụgharị δοῦλος n’akụkọ ilu banyere ụlọ
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Ọnọdụ onye ahụ n’okpuru onyenwe ya dị n’akwụkwọ Grik; “ohu” na-edobe mmekọrịta ahụ nke ọma karịa okwu sara mbara “onye na-eje ozi,” n’agbanyeghị na isi okwu amaokwu a abụghị ọnọdụ iwu ya.
- issue: Nsụgharị κύριος mgbe ọ na-ezo aka n’ mmadụ
  choice: onyenwe
  alternative: nna ukwu
  rationale: N’akụkọ a, κύριος bụ onye mmadụ bụ onye nwe ohu ahụ, ọ bụghị Onyenwe anyị dị ka aha Chineke; “onyenwe” na-ezere ime ka ọ bụrụ aha nsọ ma na-edobe mmekọrịta nke ikike.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, kwanyere ùgwù ma dị mfe nghọta mee ihe. E debere ọdịiche dị n’etiti nnukwu okporo ámá na obere ụzọ, ma zere okwu ochie ma ọ bụ nke otu ụka pụrụ iche.
