id: LUK.14.12
reference: Luke 14:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: ig
  text: Ọ gwakwara onye kpọrọ ya òkù, sị, “Mgbe ọ bụla ị na-eme oriri ehihie[a] ma ọ bụ oriri anyasị, akpọla ndị enyi gị, ụmụnne gị ndị nwoke, ndị ikwu gị, ma ọ bụ ndị agbata obi gị bara ọgaranya òkù, ka ọ ghara ịbụ na ha kpọọkwa gị òkù, nke ahụ wee ghọọ nkwụghachi ụgwọ nye gị[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “nri ụtụtụ.” Okwu Grik ἄριστον na-ezo aka na nri e riri n’oge mbụ nke ụbọchị, nke na-abụkarị ihe dị ka ehihie karịa nri ụtụtụ nke oge a.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “e wee kwụghachi gị ụgwọ.” N’ụzọ ka nso n’okwu Grik, ọ sịrị, “ọ ghọọ nkwụghachi ụgwọ nye gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: Ọ gwakwara
  rationale: A sụgharịrị imperfect a dị ka omume na-aga n’ihu n’akụkọ, ma n’Igbo nkịtị ụdị a na-egosikwa na nke a bụ okwu ọzọ Jizọs gwara ha; “-kwa” na-eburu καὶ, ebe δὲ bụ njikọ dị nro.
- source_word: τῷ κεκληκότι αὐτόν
  choice: onye kpọrọ ya oriri
  rationale: Nke a na-egosipụta onye ahụ kpọrọ Jizọs òkù n’oriri ahụ n’enweghị itinye nkọwa ọzọ dịka “onye nwe ụlọ.”
- source_word: Ὅταν ποιῇς
  choice: Mgbe ị na-eme
  rationale: ποιέω tinyere aha nri pụtara ime ma ọ bụ ịkwado oriri; “na-eme oriri” bụ okwu Igbo doro anya ma bụrụkwa nke a na-asụkarị.
- source_word: ἄριστον
  choice: oriri ehihie
  rationale: ἄριστον bụ nri a na-eri n’oge mbụ nke ụbọchị, nke na-abụkarị n’ehihie; nhọrọ a na-edobe ọdịiche ya na δεῖπνον.
- source_word: δεῖπνον
  choice: oriri anyasị
  rationale: δεῖπνον na-ezo aka na nri ukwu a na-erikarị n’oge e mesịrị n’ụbọchị.
- source_word: μὴ φώνει
  choice: akpọla
  rationale: N’ọnọdụ oriri a, φωνέω pụtara ịkpọ mmadụ òkù; “akpọla” bụ ụzọ Igbo dị mfe ma kwekọọ n’ọnọdụ ahụ.
- source_word: τοὺς φίλους σου
  choice: ndị enyi gị
  rationale: Nke a bụ ntụgharị doro anya nke φίλοι n’ọnọdụ mmekọrịta mmadụ.
- source_word: τοὺς ἀδελφούς σου
  choice: ụmụnne gị ndị nwoke
  rationale: Aha Grik ahụ bụ nke nwoke n’ụbara; ịgbakwunye “ndị nwoke” na-egbochi “ụmụnne” Igbo ịgbanwe ya ka ọ bụrụ ụmụnne nwoke na nwanyị niile.
- source_word: τοὺς συγγενεῖς σου
  choice: ndị ikwu gị
  rationale: “Ndị ikwu” bụ okwu Igbo ugbu a, doo anya maka συγγενεῖς.
- source_word: γείτονας πλουσίους
  choice: ndị agbata obi gị bara ọgaranya
  rationale: Nke a na-eme ka πλουσίους kọwaa ndị agbata obi ahụ ozugbo, n’Igbo eke.
- source_word: μήποτε
  choice: ka ọ ghara ịbụ na
  rationale: Nke a na-echekwa ụda ịdọ aka ná ntị na ihe nwere ike isi na ya pụta, n’enweghị ime ka ọ bụrụ naanị iwu gbasara nzube.
- source_word: ἀντικαλέσωσίν σε
  choice: ha onwe ha akpọkwa gị oriri n’aka nke ha
  rationale: Ngwaa mejupụtara ahụ pụtara ịkpọ mmadụ òkù n’ụzọ nkwụghachi; okwu a na-eme ka echiche nke ịkpọghachi mmadụ pụta ìhè n’Igbo.
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: nke ahụ wee ghọọ nkwụghachi ụgwọ nye gị
  rationale: A hapụrụ usoro na echiche nkịtị nke Grik—“ọ ghọọ nkwụghachi nye gị”—kama ime ka ọ bụrụ naanị “a kwụghachi gị ụgwọ.”
