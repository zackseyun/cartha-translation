translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Oriri ehihie” na “oriri anyasị” na-edobe ọdịiche dị n’etiti ụdị nri abụọ ahụ. E zere okwu ụka pụrụ iche ma debe echiche nke mmekọrịta nkwụghachi n’enweghị ịgbakwụnye nkọwa ozizi.
