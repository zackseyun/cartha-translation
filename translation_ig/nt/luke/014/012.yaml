review_pass:
  verdict: revise
  source_fidelity: The draft conveys the meal contrast, the four social groups, the warning introduced by μήποτε, reciprocal invitation (ἀντικαλέσωσιν), and recompense (ἀνταπόδομα) accurately. However, the Igbo expressions for inviting someone to a meal need explicit òkù ('invitation') for idiomatic precision.
  naturalness: 'Several phrases are understandable but not fully natural Standard Igbo: "kpọrọ ya oriri" and "kpọọ ... oriri" omit the usual object òkù, while "n’aka nke ha" is redundant after the reciprocal sense is already expressed.'
  terminology: '"Oriri ehihie" and "oriri anyasị" appropriately preserve the distinction between ἄριστον and δεῖπνον. "Nkwụghachi ụgwọ" suitably communicates recompense, though the revised wording keeps the source''s impersonal construction more directly.'
  issues:
  - severity: medium
    issue: Invitation idiom lacks òkù
    rationale: In Standard Igbo, kpọọ mmadụ òkù / kpọọ mmadụ òkù ka ọ bịa oriri is the natural and unambiguous way to express inviting someone. "kpọrọ ya oriri" and "akpọla ndị enyi gị ... oriri" are awkward and can obscure the invitation action represented by καλέω/φωνέω.
  - severity: low
    issue: Redundant reciprocal phrase
    rationale: '"kpọọkwa gị òkù" already conveys ἀντικαλέσωσιν, ''invite you in return.'' Adding "n’aka nke ha" is unnecessary and less idiomatic.'
  revised_text: Ọ gwakwara onye kpọrọ ya òkù, sị, “Mgbe ọ bụla ị na-eme oriri ehihie[a] ma ọ bụ oriri anyasị, akpọla ndị enyi gị, ụmụnne gị ndị nwoke, ndị ikwu gị, ma ọ bụ ndị agbata obi gị bara ọgaranya òkù, ka ọ ghara ịbụ na ha kpọọkwa gị òkù, nke ahụ wee ghọọ nkwụghachi ụgwọ nye gị[c].”
