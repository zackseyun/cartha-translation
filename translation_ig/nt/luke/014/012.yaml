revisions:
- from: Ọ gwakwara onye kpọrọ ya oriri, sị, “Mgbe ị na-eme oriri ehihie[a] ma ọ bụ oriri anyasị, akpọla ndị enyi gị, ụmụnne gị ndị nwoke, ndị ikwu gị, ma ọ bụ ndị agbata obi gị bara ọgaranya, ka ọ ghara ịbụ na ha onwe ha akpọkwa gị oriri n’aka nke ha[b], nke ahụ wee ghọọ nkwụghachi ụgwọ nye gị[c].”
  to: Ọ gwakwara onye kpọrọ ya òkù, sị, “Mgbe ọ bụla ị na-eme oriri ehihie[a] ma ọ bụ oriri anyasị, akpọla ndị enyi gị, ụmụnne gị ndị nwoke, ndị ikwu gị, ma ọ bụ ndị agbata obi gị bara ọgaranya òkù, ka ọ ghara ịbụ na ha kpọọkwa gị òkù, nke ahụ wee ghọọ nkwụghachi ụgwọ nye gị[c].”
  rationale: The revision supplies òkù wherever the Greek concerns inviting, yielding clear, natural Standard Igbo without changing the source meaning. Footnote b is no longer needed because the revised main text directly and idiomatically expresses reciprocal invitation; footnotes a and c remain valid lexical alternatives.
