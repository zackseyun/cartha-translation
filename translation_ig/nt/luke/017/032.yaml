  text: μνημονεύετε τῆς γυναικὸς Λώτ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/032.yaml
  text: Remember Lot's wife[a][b].
translation:
  language: ig
  text: Chetanụ nwunye Lọt[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ na-esochi okwu Grik nso karị, “Chetanụ nwunye nke Lọt.”
    reason: lexical_alternative
  - marker: b
    text: Nke a na-atụ aka na Jenesis 19:26, ebe nwunye Lọt lere anya azụ mgbe a na-ebibi Sọdọm.
    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: Chetanụ
  rationale: Ngwaa a bụ iwu dị n'ụdị onye nke abụọ ọtụtụ. “Chetanụ” bụ ụzọ Igbo kwụ ọtọ ma dịkwa n'okike isi gwa ìgwè mmadụ ka ha cheta ma buru ihe a n'uche.
- source_word: τῆς γυναικὸς
  choice: nwunye
  rationale: Ọ bụ ezie na γυνή pụrụ ịpụta “nwaanyị” ma ọ bụ “nwunye,” njikọ ya na aha Lọt n'ebe a na-egosi mmekọrịta alụmdi na nwunye. Usoro Igbo “nwunye Lọt” bụ nke doro anya ma dị n'okike.
- source_word: Λώτ
  choice: Lọt
  rationale: E depụtara aha onye a n'ụdị ntụgharị mkpụrụokwu kwekọrọ n'usoro aha Baịbụl a na-ahụkarị n'Igbo.
theological_decisions:
- issue: Ụdị ịdọ aka ná ntị na ntụaka ahụ
  choice: 'E debere ya dị ka iwu dị mkpirikpi ma kwụ ọtọ: “Chetanụ nwunye Lọt.”'
  alternative: “Chetanụ nwunye nke Lọt.”
  rationale: Okwu ahụ na-atụ aka n'ihe mere na Jenesis 19:26 ma na-arụ ọrụ dị ka ịdọ aka ná ntị. “Nwunye Lọt” bụ Igbo nkịtị ma na-echekwa ike na nkenke nke ihe odide Grik, ebe “nwunye nke Lọt” bụ ntụgharị nke na-esochi usoro genitiv ahụ nso karịa ma ọ naghị ada nke ọma n'Igbo.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị nsọ ma dị mfe nghọta. E ji ụdị ọtụtụ “-nụ” chekwaa na iwu ahụ bụ nke a gwara ọtụtụ mmadụ; e debekwara nkenke nke isi mmalite ahụ.
