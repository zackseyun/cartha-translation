- from: Ma n’ụbọchị ahụ Lọt si na Sọdọm pụọ, ọkụ na sọlfọ[a] si n’eluigwe zoo, bibiekwa ha niile.
  to: Ma n’ụbọchị ahụ Lọt si na Sọdọm pụọ, ọkụ na sọlfọ si n’eluigwe zoo wee bibie ha niile.
  rationale: A small stylistic correction replaces “bibiekwa” with “wee bibie” while preserving the source’s simple coordination and all other lexical choices. No disputed ambiguity is resolved beyond what the Greek states.
