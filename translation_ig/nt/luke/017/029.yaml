  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: ig
  text: Ma n’ụbọchị ahụ Lọt si na Sọdọm pụọ, ọkụ na sọlfọ si n’eluigwe zoo wee bibie ha niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: Ma n’ụbọchị ahụ
  rationale: Nkebiokwu a na-egosi oge, ya bụ ‘n’ụbọchị ahụ mgbe’; ‘Ma’ na-echekwa obere ntụgharị ma ọ bụ ọdịiche δέ na-eweta n’ihe atụ gara aga.
- source_word: ἐξῆλθεν
  choice: si … pụọ
  rationale: Nke a na-egosipụta ịpụ n’otu ebe n'ụzọ doro anya ma bụrụkwa okwu Igbo a na-ejikarị eme ihe.
- source_word: Λὼτ
  choice: Lọt
  rationale: Nke a bụ nsụgharị aha onye ahụ kwekọrọ n’usoro mkpọpụta na odide Igbo.
- source_word: ἀπὸ Σοδόμων
  choice: si na Sọdọm
  rationale: Ọ bụ ụzọ Igbo dị mfe ma ziri ezi isi kwuo na Lọt pụrụ n’obodo ahụ.
- source_word: ἔβρεξεν
  choice: zoo
  rationale: E ji ngwaa a kọwaa ihe si n’elu daa dịka mmiri ozuzo, n’enweghị ịgbakwụnye onye mere ka o zoo ebe Grik na-ekwughị ya kpọmkwem.
- source_word: πῦρ καὶ θεῖον
  choice: ọkụ na sọlfọ
  rationale: ‘Sọlfọ’ bụ aha ihe θεῖον pụtara n’asụsụ nke oge a; ọ na-echekwakwa onyonyo ikpe ahụ n’enweghị okwu ochie na-edoghị ọtụtụ ndị anya.
- source_word: ἀπ’ οὐρανοῦ
  choice: si n’eluigwe
  rationale: ‘Eluigwe’ dabara n’ụdị okwu Akwụkwọ Nsọ ma chekwaa njikọ ya na akụkọ Jenesis, n’enweghị ịkọwa ihe karịrị ihe odide ahụ kwuru.
- source_word: ἀπώλεσεν πάντας
  choice: bibiekwa ha niile
  rationale: ‘Bibie’ na-egosipụta mbibi zuru ezu; ‘ha niile’ na-eme ka ndị πάντας na-ezo aka na ha pụta ìhè n’Igbo nkịtị.
theological_decisions:
- issue: Otú e si sụgharịa θεῖον n’ọnọdụ ikpe
  choice: sọlfọ
  alternative: nkume sọlfọ
  rationale: ‘Sọlfọ’ bụ ihe okwu Grik ahụ pụtara kpọmkwem ma bụrụ okwu oge a. ‘Nkume sọlfọ’ na-echekwa ụdị okwu ọdịnala, ma ọ nwere ike ime ka onye na-agụ ya chee na ihe odide Grik kwuru ‘nkume,’ ebe ọ na-ekwughị ya.
- issue: Otú e si sụgharịa οὐρανός
  choice: eluigwe
  alternative: mbara igwe
  rationale: ‘Eluigwe’ na-echekwa akpaalaokwu Akwụkwọ Nsọ na njikọ ya na Jenesis, ma ọ naghị amanye nkọwa ozizi karịrị ihe dị n’ihe odide ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa usoro akụkọ dị mkpirikpi nke Grik, njikọ ya na Jenesis 19:24, na nghọta na ikpe ahụ si n’eluigwe bịa, n’enweghị ịgbakwụnye onye a kpọrọ aha dị ka onye mere ka ọkụ na sọlfọ zoo.
