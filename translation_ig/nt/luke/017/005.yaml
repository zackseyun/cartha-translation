  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: ig
  text: Ndị ozi ahụ wee sị Onyenwe anyị, “Mee ka okwukwe[b] anyị bawanye.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Tinyeere anyị okwukwe.” Ngwaa Grik ahụ pụtara n'ụzọ nkịtị “tinye” ma ọ bụ “gbakwunye,” ma n’ebe a echiche ya bụ ime ka okwukwe ha bawanye.
    reason: lexical_alternative
  - marker: b
    text: “Okwukwe” nwekwara ike ịpụta “ntụkwasị obi”; ihe na-adịchaghị ka ọ bụ ya n’ebe a bụ “ikwesị ntụkwasị obi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: wee
  rationale: Ọ na-ejikọta ihe a na ihe bu ya ụzọ n’akụkọ, n’enweghị ịgbakwụnye nkọwa oge siri ike.
- source_word: εἶπαν
  choice: sị
  rationale: Aorist a bụ omume mere otu ugboro n’akụkọ; ‘sị’ bụ ụzọ Igbo si ekwu ya n'ụzọ nkịtị.
- source_word: οἱ ἀπόστολοι
  choice: Ndị ozi ahụ
  rationale: ‘Ndị ozi’ bụ okwu Igbo doro anya maka ndị Jizọs zipụrụ; ‘ahụ’ na-egosi otu a maara nke ọma n’akụkọ ahụ.
- source_word: τῷ κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a na-edobe κύριος dị ka aha nsọpụrụ a na-akpọ Jizọs, ma na-echekwa ịdị arọ nke aha ahụ n’akwụkwọ Luk.
- source_word: Πρόσθες
  choice: Mee ka ... bawanye
  rationale: Ọ bụ ezie na ngwaa Grik ahụ pụtara n'ụzọ nkịtị ‘tinye’ ma ọ bụ ‘gbakwunye,’ n’ebe a ọ na-arịọ ka ihe ha nwere baa ụba.
- source_word: ἡμῖν
  choice: anyị
  rationale: Dative ‘nye anyị’ jikọtara na πίστιν; n’Igbo, ‘okwukwe anyị’ na-enye otu echiche ahụ n'ụzọ dị mma.
- source_word: πίστιν
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ okwu Igbo a na-ejikarị akọwa πίστις n’ọnọdụ a, ya bụ ịtụkwasị Chineke obi; a na-edobe ohere nkọwa ndị ọzọ na nkọwa ala peeji.
theological_decisions:
- issue: Ịsụgharị κύριος mgbe ọ na-ezo aka na Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa ma nsọpụrụ a na-enye Jizọs ma ịdị arọ nke aha ahụ; ‘Nna ukwu’ nwere ike ime ka ọ bụrụ naanị aha onye isi.
- issue: Ịsụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’ebe a, arịrịọ ka e mee ka πίστις bawanye na-ezo aka n’ụzọ kacha kwe omume n’okwukwe ma ọ bụ ntụkwasị obi ha. ‘Ikwesị ntụkwasị obi’ dị n’oke ihe okwu ahụ nwere ike ịpụta, ma ọ naghị adịcha ka nkọwa a chọrọ n’ebe a.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu a na-asụkarị ‘Mee ka okwukwe anyị bawanye’ kama nsụgharị nkịtị nke ga-ada arọ. E tinyere akara nkọwa [a] na [b] n’ederede isi.
