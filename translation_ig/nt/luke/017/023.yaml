base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: ig
  text: Ha ga-asị unu, “Lee, ebe ahụ!” ma ọ bụ, “Lee, ebe a!” Unu apụla, unu achụkwala ha[a] ọsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Unu apụla, unu achụkwala.” N’asụsụ Grik, ekwughị kpọmkwem ihe a ga-achụso.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: Ha ga-asịkwa unu
  rationale: Ọdịnihu nke λέγω na-egosi ihe ndị mmadụ ga-ekwu; ‘ga-asị unu’ na-ebute okwu kpọmkwem n’ụzọ Igbo nkịtị, ebe καί bụ ‘kwa’.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: ‘Lee’ bụ okwu Igbo dị mkpirikpi nke na-adọta uche ma kwekọọ na ike ἰδού n’enweghị asụsụ ochie gabiga ókè.
- source_word: ἐκεῖ ... ὧδε
  choice: ọ nọ ebe ahụ ... ọ nọ ebe a
  rationale: ‘Ebe ahụ’ na ‘ebe a’ na-edobe ọdịiche dị n’etiti ebe dị anya na ebe dị nso. Ịtinye ‘ọ nọ’ na-eme ka mkpu ahụ bụrụ Igbo eke, ma onye a na-ekwu banyere ya ka a na-enweta site n’okwu gbara amaokwu ahụ gburugburu.
- source_word: μὴ ἀπέλθητε
  choice: Unu apụla
  rationale: Aorist subjunctive ya na μή bụ iwu mgbochi. ‘Unu apụla’ na-egosi ka ha ghara isi n’ebe ha nọ pụọ n’ihi nkwupụta ndị ahụ, n’ebughị nkọwa ọzọ abata.
- source_word: μηδὲ διώξητε
  choice: unu achụkwala ha ọsọ
  rationale: διώκω nwere echiche ịchụso ma ọ bụ ịgbaso ọsọ. Igbo chọrọkarị ihe a na-achụ; ‘ha’ na-ezo aka n’ụzọ ebumpụta ụwa n’ebe ndị na-ekwu okwu nọ, ma ndetu ala na-eme ka doo anya na Grik ekwughị ihe ahụ kpọmkwem.
theological_decisions:
- issue: Ihe διώξητε na-ezo aka na ya ekwughị kpọmkwem na Grik
  choice: Tinye ‘ha’ n’ahịrị isi maka Igbo doro anya, ma kọwaa ya na ndetu ala
  alternative: ‘unu achụkwala ọsọ’ ma ọ bụ ‘unu esokwala’
  rationale: Grik hapụrụ ihe a na-achụ n’amaghị aha. ‘Ha’ bụ nghọta sitere n’aka ndị ga-ekwu, ma ndetu ala na-echekwa ohere na ederede ahụ akọwaghị ihe ahụ kpọmkwem.
- issue: Onye Ἰδοὺ ἐκεῖ / Ἰδοὺ ὧδε na-atụ aka na ya
  choice: ‘ọ nọ ebe ahụ ... ọ nọ ebe a’
  alternative: ‘Lee, ebe ahụ! ... Lee, ebe a!’
  rationale: Ihe gbara ya gburugburu na-egosi na mkpu ndị ahụ na-ekwu maka Nwa nke Mmadụ, ma ejighị aha ahụ tinye n’amaokwu a. Nnọchiaha ‘ọ’ na-eme ka okwu ahụ bụrụ Igbo eke n’etinyeghị aha ma ọ bụ nkọwa okpukpe ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. E ji ọtụtụ ‘unu’ mee ka onye a na-agwa doo anya; e debere mkpu abụọ ahụ nkenke na ngwa ngwa dịka n’asụsụ mbụ.
