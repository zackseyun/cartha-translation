revisions:
- from: Ha ga-asịkwa unu[a], “Lee, ọ nọ ebe ahụ!” ma ọ bụ, “Lee, ọ nọ ebe a!” Unu apụla, unu achụkwala ha ọsọ.
  to: Ha ga-asị unu, “Lee, ebe ahụ!” ma ọ bụ, “Lee, ebe a!” Unu apụla, unu achụkwala ha[a] ọsọ.
  rationale: The revision removes the unstated pronoun and copula from the two deictic cries, retaining the Greek’s concise ambiguity. It retains the idiomatic Igbo object “ha” with an anchored note that makes its supplied status transparent, and it renders the opening connective without an unnecessary additive particle.
