review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the future report, the contrast of distant and near locations, and the paired prohibitions. However, adding “ọ nọ” (“he is”) to both exclamations makes explicit an implied referent that the Greek deictic expressions themselves leave unstated. The supplied object “ha” for διώξητε is acceptable for idiomatic Igbo if its implicit status is footnoted, but the footnote anchor should attach to that supplied word rather than to “unu.”
  naturalness: “Lee, ebe ahụ!” / “Lee, ebe a!” is concise, natural Standard Igbo for the Greek attention-getting location cries. “Unu apụla, unu achụkwala ha ọsọ” is clear and appropriately urgent. Removing “kwa” avoids giving καί an unnecessary additive force in a context where it simply continues the discourse.
  terminology: No doctrinal terminology occurs in this verse. The revision preserves the Greek’s unspecific deictic wording and does not identify the one being indicated. The note accurately records that the object of “pursue” is unexpressed in Greek.
  issues:
  - severity: medium
    issue: The text adds “ọ nọ” in both location cries.
    rationale: Ἰδοὺ ἐκεῖ / Ἰδοὺ ὧδε literally consists of an attention-getter plus a locative adverb; it does not state “he is.” The surrounding context may suggest a referent, but the verse itself leaves it implicit. “Lee, ebe ahụ!” and “Lee, ebe a!” preserve that ambiguity.
  - severity: low
    issue: The footnote marker is attached to “unu,” although the note concerns the supplied object “ha.”
    rationale: Moving the marker to “ha” gives the note a clear and accurate anchor.
  - severity: low
    issue: “kwa” over-translates the discourse connective καί.
    rationale: Here καί naturally links the saying to the preceding discourse; Igbo does not need additive “kwa” in this clause.
  revised_text: Ha ga-asị unu, “Lee, ebe ahụ!” ma ọ bụ, “Lee, ebe a!” Unu apụla, unu achụkwala ha[a] ọsọ.
  revised_footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Unu apụla, unu achụkwala.” N’asụsụ Grik, ekwughị kpọmkwem ihe a ga-achụso.'
    reason: lexical_alternative
  revision_rationale: The revision removes the unstated pronoun and copula from the two deictic cries, retaining the Greek’s concise ambiguity. It retains the idiomatic Igbo object “ha” with an anchored note that makes its supplied status transparent, and it renders the opening connective without an unnecessary additive particle.
