revisions:
- from: Ma ọ ga-ebu ụzọ taa ahụhụ n'ọtụtụ ụzọ, ọgbọ a ajụkwa ya.
  to: Ma nke mbụ, ọ ghaghị ịta ọtụtụ ahụhụ, ọgbọ a ga-ajụkwa ya.
  rationale: The revision explicitly renders δεῖ with "ọ ghaghị" and replaces the overly specific "n'ọtụtụ ụzọ" with "ọtụtụ ahụhụ." The coordinated future clause naturally retains the sequence and presents this generation as the agent of rejection, without adding an interpretation of divine necessity.
  reviewer_model: gpt-5.6-terra
