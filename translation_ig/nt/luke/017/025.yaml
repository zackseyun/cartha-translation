  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: ig
  text: Ma nke mbụ, ọ ghaghị ịta ọtụtụ ahụhụ, ọgbọ a ga-ajụkwa ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: ga-ebu ụzọ
  rationale: Ọ na-egosi na ahụhụ na ọjụjụ ga-ebu ụzọ mee tupu ihe ndị a kpọtụrụ aha n'okwu gbara amaokwu a gburugburu.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n'etiti okwu a na ihe bu ya ụzọ.
- source_word: δεῖ
  choice: ọ ga-...rịrị
  rationale: Nrụpụta a na-egosi mkpa siri ike dị na δεῖ, na-akọwaghị kpọmkwem ma mkpa ahụ sitere n'atụmatụ Chineke.
- source_word: αὐτὸν
  choice: ọ / ya
  rationale: N'Igbo, a na-eji nnọchiaha onye nke atọ dị ka isiokwu nke 'ga-...rịrị,' ebe 'ya' bụ ihe omume ịjụ metụtara.
- source_word: πολλὰ
  choice: n'ọtụtụ ụzọ
  rationale: Neuter plural a na-egosi ọtụtụ ụdị ahụhụ; ntụgharị a bụ Igbo nkịtị ma na-echekwa obosara okwu Grik ahụ.
- source_word: παθεῖν
  choice: taa ahụhụ
  rationale: Nke a bụ ụzọ doro anya ma dịkwa ebube e si kwuo πάσχω n'Igbo.
- source_word: ἀποδοκιμασθῆναι
  choice: ajụkwa ya
  rationale: Ọ na-egosi na a jụrụ ya ma ọ bụ na a nabataghị ya; 'jụ' bụ okwu Igbo doro anya na nke sitere n'echiche okwu ahụ kpọmkwem.
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: ọgbọ a
  rationale: N'ahịrịokwu ọrụ na-eme, 'ọgbọ a' bụ onye na-ajụ ya, nke na-egosipụta agency nke ἀπό so passive verb ma na-echekwa nrụtụ aka n'ọgbọ dị n'oge ahụ.
theological_decisions:
- issue: Ike δεῖ gbasara ahụhụ Nwa nke Mmadụ
  choice: ọ ga-...rịrị
  alternative: ọ dị mkpa ka ọ...; ịkọwa ya kpọmkwem dị ka atụmatụ Chineke
  rationale: Nke a na-echekwa echiche nke mkpa ma ọ bụ ihe a na-apụghị izere ezere, tinyere arọ okpukpe okwu ahụ nwere na Luk, ma ọ naghị etinye nkọwa banyere iwu ma ọ bụ atụmatụ Chineke nke amaokwu ahụ ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. E ji ahịrịokwu ọrụ na-eme—'ọgbọ a ajụkwa ya'—mee ka Igbo daa nke ọma, ebe a ka chekwara na ọgbọ ahụ bụ onye jụrụ ya. Enweghị akara nkọwa ala peeji n'ihi na ọ dịghị nke achọrọ.
