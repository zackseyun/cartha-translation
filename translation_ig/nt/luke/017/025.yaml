review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the contrast ("Ma"), temporal priority, suffering, and the contemporary "ọgbọ a" as the rejecting agent. However, "ọ ga-..." expresses future time rather than the necessity carried by δεῖ, and "n'ọtụtụ ụzọ" narrows πολλὰ ('many things') to manners or methods.
  naturalness: The active construction with "ọgbọ a" is natural Standard Igbo. "Ọ ghaghị" clearly and idiomatically conveys the required necessity, and "ịta ọtụtụ ahụhụ" is a natural rendering of the broad plural object.
  terminology: '"ịta ahụhụ" and "jụ ya" are appropriate modern Standard Igbo renderings. No theological term requires a footnote.'
  issues:
  - severity: high
    issue: δεῖ is not represented adequately by "ọ ga-...".
    rationale: The simple future auxiliary ga- does not convey the necessity ('must') expressed by δεῖ. "Ọ ghaghị" preserves the force without specifying the source of that necessity.
  - severity: medium
    issue: '"n''ọtụtụ ụzọ" restricts πολλὰ.'
    rationale: The Greek says he must suffer 'many things,' not specifically suffer in many ways. "Ịta ọtụtụ ahụhụ" retains the intended breadth more naturally in Igbo.
  revised_text: Ma nke mbụ, ọ ghaghị ịta ọtụtụ ahụhụ, ọgbọ a ga-ajụkwa ya.
