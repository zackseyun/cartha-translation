  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: ig
  text: Ha weliri olu ha[a], sị, “Jizọs, Nna ukwu[b], meere anyị ebere!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ okwu ahụ si dị kpọmkwem, “weliri olu ha elu.”
    reason: lexical_alternative
  - marker: b
    text: “Nna ukwu” bụ nsụgharị okwu Grik epistata, aha a na-akpọ onye nwere ikike; ọ bụghị okwu a na-ejikarị asụgharị “Onyenwe” (kyrios).
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: wee
  rationale: “Wee” bụ njikọ akụkọ dị mfe nke na-aga n’ihu n’enweghị ịgbakwunye echiche oge siri ike.
- source_word: αὐτοὶ
  choice: ha
  rationale: Nnochiaha ahụ pụtara ìhè n’asụsụ Grik, ma “ha” na-enye Igbo dị mfe ma doo anya n’ebe a.
- source_word: ἦραν φωνὴν
  choice: welie olu ha
  rationale: Nke a na-edobe oyiyi okwu Grik nke ‘iweli olu’ ma na-egosikwa na ha kpọrọ oku n’olu dara ụda.
- source_word: λέγοντες
  choice: sị
  rationale: Mgbe e kwuchara na ha weliri olu ha, “sị” bụ ụzọ Igbo dị mma isi webata kpọmkwem ihe ha kwuru.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Nke a bụ nsụgharị mkpụrụokwu aha ahụ n’ụdị a na-aghọta nke ọma n’Igbo.
- source_word: ἐπιστάτα
  choice: Nna ukwu
  rationale: Ọ bụ aha nkwanye ùgwù a na-akpọ onye nwere ikike ma ọ bụ onye na-achị; ọ naghị agwakọta okwu a na κύριος, nke a na-asụgharịkarị ‘Onyenwe anyị.’
- source_word: ἐλέησον
  choice: meere anyị ebere
  rationale: Nke a na-egosipụta arịrịọ ngwa ngwa ka Jizọs jiri ọmịiko nyere ha aka.
- source_word: ἡμᾶς
  choice: anyị
  rationale: “Anyị” bụ ihe omume ebere ahụ metụtara, dị ka ihe nnọchiaha Grik si gosi.
theological_decisions:
- issue: Otú e si asụgharị ἐπιστάτα dịka aha a kpọrọ Jizọs
  choice: Nna ukwu
  alternative: Onyenwe anyị
  rationale: Okwu Grik ebe a bụ ἐπιστάτης, ọ bụghị κύριος. “Nna ukwu” na-egosi nkwanye ùgwù na ikike n’ebughị ụzọ tinye nghọta okpukpe siri ike nke “Onyenwe anyị” pụrụ iweta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu dee ya. “Welie olu ha” na-edobe oyiyi okwu mbụ, ebe “Nna ukwu” na-echekwa ọdịiche dị n’etiti epistata na kyrios.
