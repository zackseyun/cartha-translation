  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· ⸀Οὐχὶ οἱ δέκα ἐκαθαρίσθησαν; οἱ δὲ ἐννέα ποῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/017.yaml
  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: ig
  text: Jizọs wee zaa, sị, “Ọ̀ bụghị mmadụ iri ahụ ka e mere ka ha dị ọcha[a]? Ma mmadụ itoolu ahụ nọ ebee?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ̀ bụghị mmadụ iri ahụ niile ka e mere ka ha dị ọcha?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: Jizọs wee zaa, sị
  rationale: Nke a na-egosipụta usoro okwu Grik nke na-ewebata azịza, ma na-asụ ya n’ụzọ Igbo dị mfe ma bụrụkwa nke e ji akọ akụkọ.
- source_word: Οὐχὶ
  choice: Ọ̀ bụghị ...?
  rationale: Ajụjụ a na-atụ anya azịza nkwenye; usoro ‘Ọ̀ bụghị ...?’ na-edobe ike ajụjụ ahụ.
- source_word: οἱ δέκα
  choice: mmadụ iri ahụ
  rationale: Mkpọaha ahụ na ọnụọgụ ahụ na-ezo aka n’ìgwè mmadụ iri a kpọtụrụla aha n’akụkọ ahụ. ‘Ahụ’ na-egosipụta na a maara ìgwè ahụ, n’etinyeghị ‘niile’ n’amaokwu n’onwe ya.
- source_word: ἐκαθαρίσθησαν
  choice: e mere ka ha dị ọcha
  rationale: Nke a na-edobe isi echiche καθαρίζω, bụ́ ime ka ihe ma ọ bụ mmadụ dị ọcha, ma ghara ime ka ọ bụrụ naanị ọgwụgwọ ọrịa; n’ọnọdụ ndị ekpenta, ọ gụnyere mgbake anụ ahụ na ịdị ọcha n’usoro okpukpe.
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: Ma mmadụ itoolu ndị ọzọ nọ ebee?
  rationale: ‘Ma’ na-egosipụta ọdịiche dị n’etiti otu onye lọtara na mmadụ itoolu ahụ; ‘ndị ọzọ’ na-eme ka ntụaka ahụ doo anya n’Igbo n’agbanweghi ọnụ ọgụgụ ahụ.
theological_decisions:
- issue: Ihe καθαρίζω pụtara n’akụkọ ọgwụgwọ ndị ekpenta
  choice: e mere ka ha dị ọcha
  alternative: a gwọrọ ha; a sachara ha
  rationale: Nhọrọ a na-echekwa ma echiche mgbake n’ọrịa ma echiche ịdị ọcha nke metụtara ọnọdụ onye ekpenta, n’etinyeghị nkọwa okpukpe ọzọ na-adịghị n’ederede.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Wee zaa, sị’ bụ usoro akụkọ nkịtị; akara ụda dị na ‘Ọ̀’ na-eme ka ajụjụ ahụ doo anya. E tinyere akara ala ala peeji [a] ozugbo n’akụkụ okwu ọ na-akọwa.
