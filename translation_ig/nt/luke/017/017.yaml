  to: Jizọs wee zaa, sị, “Ọ̀ bụghị mmadụ iri ahụ ka e mere ka ha dị ọcha[a]? Ma mmadụ itoolu ahụ nọ ebee?”
  rationale: The revision removes the unnecessary added qualifier “ndị ọzọ” while retaining the source's contrast through “Ma” and the established referent through “ahụ.” All other wording faithfully and naturally conveys the Greek and preserves the lexical significance of cleansing.
