review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders Jesus' response, the affirmative-answer rhetorical question, the known group of ten, and the passive sense of ἐκαθαρίσθησαν. However, “ndị ọzọ” (‘the others’) is not expressed in οἱ δὲ ἐννέα; the contrast is adequately carried by “Ma.”
  naturalness: “Jizọs wee zaa, sị” and “Ọ̀ bụghị ...?” are natural Standard Igbo narrative and interrogative forms. “E mere ka ha dị ọcha” is clear and appropriately preserves the cleansing terminology in this context.
  terminology: “E mere ka ha dị ọcha” suitably maintains the ritual-and-physical breadth of καθαρίζω without narrowing it to healing. “Mmadụ iri ahụ” and “mmadụ itoolu ahụ” naturally refer back to the identified group.
  issues:
  - severity: low
    issue: The phrase “ndị ọzọ” has been added in the final question.
    rationale: The Greek reads literally, “but the nine, where [are they]?” Although the contrast with the one who returned is evident from context, “ndị ọzọ” is not needed for idiomatic Igbo and slightly makes the contrast more explicit than the source wording.
  revised_text: Jizọs wee zaa, sị, “Ọ̀ bụghị mmadụ iri ahụ ka e mere ka ha dị ọcha[a]? Ma mmadụ itoolu ahụ nọ ebee?”
