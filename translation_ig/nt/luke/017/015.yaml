revisions:
- from: Ma otu onye n’ime ha, mgbe ọ hụrụ na a gwọọla ya, laghachiri, jiri olu dara ụda na-enye Chineke otuto.[a]
  to: Ma otu onye n’ime ha, mgbe ọ hụrụ na a gwọọla ya, laghachiri, na-enye Chineke otuto n’olu dị ukwuu.[a]
  rationale: The revision replaces the potentially imprecise expression for voice with “n’olu dị ukwuu,” which directly reflects μετὰ φωνῆς μεγάλης (“with/in a loud voice”). It retains the completed passive sense of ἰάθη and the participial sense of δοξάζων without adding interpretive content.
  reviewer_model: gpt-5.6-terra
