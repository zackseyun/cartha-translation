  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: ig
  text: Ma otu onye n’ime ha, mgbe ọ hụrụ na a gwọọla ya, laghachiri, na-enye Chineke otuto n’olu dị ukwuu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-enye Chineke ebube.” Okwu Grik ahụ nwere ike ịpụta inye otuto ma ọ bụ inye ebube.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: Ma otu onye n’ime ha
  rationale: Nkebi a na-egosi otu onye sitere n’etiti ha; “Ma” na-egosipụta ọdịiche dị nro n’etiti ya na mmadụ itoolu ndị ọzọ.
- source_word: ἰδὼν
  choice: mgbe ọ hụrụ
  rationale: Nke a na-egosipụta ihe ọ chọpụtara tupu ọ laghachi, n’asụsụ Igbo dị mfe ma kwekọọ na ọrụ participle a.
- source_word: ὅτι ἰάθη
  choice: na a gwọọla ya
  rationale: Ụdị a na-egosi na ọgwụgwọ ahụ emezuola tupu ọ mata ya; passive ahụ ka dịkwa n’ụdị Igbo eke.
- source_word: ὑπέστρεψεν
  choice: laghachiri
  rationale: Ọ pụtara ịlaghachi n’ebe onye ahụ si bịa; “laghachiri” bụ okwu Igbo nkịtị ma doo anya.
- source_word: μετὰ φωνῆς μεγάλης
  choice: jiri olu dara ụda
  rationale: Nke a na-egosi ikwu okwu n’olu dị ike ma na-ada ụda, kama ịsụgharị “nnukwu olu” n’ụzọ siri ike.
- source_word: δοξάζων τὸν θεόν
  choice: na-enye Chineke otuto
  rationale: “Inye Chineke otuto” na-echekwa echiche δοξάζω nke inye otuto ma ọ bụ ebube, ma bụrụkwa okwu Igbo dị ugbu a na nke a na-aghọta ngwa ngwa.
theological_decisions:
- issue: Nsụgharị τὸν θεόν
  choice: Chineke
  alternative: —
  rationale: Amaokwu ahụ kwuru naanị na nwoke ahụ nyere Chineke otuto; etinyeghị nkọwa ozizi ọzọ na-adịghị n’isi mmalite.
- issue: Oke nghọta δοξάζων
  choice: na-enye Chineke otuto
  alternative: na-enye Chineke ebube
  rationale: “Otuto” dabara n’omume ikwupụta ịdị ukwuu Chineke n’olu dara ụda, ebe ntụaka ala peeji na-echekwa ohere lexical nke “ebube.”
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro akụkọ ahụ n’ụdị eke, ma echekwakwa ọdịiche dị nro nke δέ na obosara ihe δοξάζω pụtara.
