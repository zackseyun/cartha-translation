    text: A pụkwara ịsụgharị ya, “na-enye Chineke ebube.” Okwu Grik ahụ nwere ike ịpụta inye otuto ma ọ bụ inye ebube.
    reason: lexical_alternative
  revision_rationale: The revision replaces the potentially imprecise expression for voice with “n’olu dị ukwuu,” which directly reflects μετὰ φωνῆς μεγάλης (“with/in a loud voice”). It retains the completed passive sense of ἰάθη and the participial sense of δοξάζων without adding interpretive content.
