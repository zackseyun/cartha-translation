  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: ig
  text: Onyenwe anyị wee sị, “Ọ bụrụ na unu nwere okwukwe dị ka mkpụrụ mọstad, unu gaara asị osisi mulberị a[a], ‘Ka e fọpụta gị na mgbọrọgwụ, ka e kụọkwa gị n’oké osimiri,’ ọ gaara erubere unu isi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘osisi sikamin,’ bụ́ aha ọdịnala e ji atụgharị okwu Grik a maka osisi mulberị.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-akpọ Jizọs n’akụkọ Luk; ‘Onyenwe anyị’ bụ ntụgharị Igbo a na-ejikarị eme ihe maka κύριος n’ọnọdụ a.
- source_word: πίστιν
  choice: okwukwe
  rationale: N’ebe a, okwu ahụ na-egosi ntụkwasị obi n’ebe Chineke nọ, ọ bụghị isi ihe gbasara ikwesị ntụkwasị obi n’omume.
- source_word: ὡς κόκκον σινάπεως
  choice: dị ka mkpụrụ mọstad
  rationale: Nke a na-edobe ntụnyere ahụ n’enweghị ịkọwa ya naanị dị ka ihe gbasara ịdị nta.
- source_word: συκαμίνῳ
  choice: osisi mulberị
  rationale: Okwu Grik a na-ezo aka n’osisi mulberị; aha a na-eme ka ụdị osisi ahụ doo onye na-agụ akwụkwọ nke oge a anya.
- source_word: ἐλέγετε ἂν
  choice: unu gaara asị
  rationale: Ụdị a na-egosi ihe gaara eme n’ọnọdụ e kwuru, ma dabara n’ụzọ Igbo si ekwu ọnọdụ atụghị anya ya.
- source_word: Ἐκριζώθητι
  choice: Ka e si na mgbọrọgwụ hopụ gị
  rationale: Nke a na-edobe iwu ahụ n’ụdị nnara (passive) ma gosipụta n’ụzọ doro anya na a ga-ehopu osisi ahụ na mgbọrọgwụ ya.
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: kụọkwa gị n’oké osimiri
  rationale: Nke a na-edobe ihe oyiyi siri ike ma dị ịtụnanya nke ịkụ osisi n’oké osimiri, n’etinyeghị nkọwa ọzọ.
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: ọ gaara erubere unu isi
  rationale: ‘Irubere isi’ na-egosipụta ike nke ὑπακούω nke ọma n’ọnọdụ ebe e nyere osisi iwu.
theological_decisions:
- issue: Ihe πίστις pụtara n’okwu gbasara ọrụ ebube
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Ọnọdụ a na-ekwu maka ntụkwasị obi nke na-eche ihe yiri ihe agaghị ekwe omume ihu. ‘Okwukwe’ na-edobe okwu nkà mmụta okpukpe a maara nke ọma, ma ọ naghị akọwa ya dị ka ikwesị ntụkwasị obi n’omume.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ntụnyere mkpụrụ mọstad ka ọ bụrụ ntụnyere sara mbara, a hapụkwara ihe oyiyi ahụ na-atụghị anya ya—ịkụ osisi n’oké osimiri—n’enweghị ime ka ọ dị nro.
