review_pass:
  verdict: revise
  source_fidelity: The conditional potential force (ἔχετε ... ἐλέγετε ἄν ... ὑπήκουσεν ἄν), the mustard-seed comparison, and the command imagery are otherwise represented faithfully. However, both Greek passive imperatives need a clear, parallel passive rendering in Igbo.
  naturalness: 'The present wording “Ka e si na mgbọrọgwụ hopụ gị, kụọkwa gị n’oké osimiri” is not natural Standard Igbo: “hopụ” does not suitably express uprooting here, and the second imperative lacks the passive construction required by the Greek and is syntactically awkward.'
  terminology: “Onyenwe anyị,” “okwukwe,” “mkpụrụ mọstad,” “osisi mulberị,” and “irubere ... isi” are suitable. The lexical-alternative footnote appropriately distinguishes the traditional “sikamin” rendering without confusing it with a sycamore-fig tree.
  issues:
  - severity: medium
    issue: The imperative “Ka e si na mgbọrọgwụ hopụ gị” is semantically and idiomatically unsuitable for “Be uprooted.”
    rationale: ἐκριζώθητι is an aorist passive imperative meaning to be uprooted/rooted out. “Ka e fọpụta gị na mgbọrọgwụ” clearly conveys being removed by the roots in natural Igbo.
  - severity: medium
    issue: “kụọkwa gị n’oké osimiri” does not clearly retain the passive imperative of φυτεύθητι.
    rationale: The Greek gives a second passive imperative, “be planted.” Repeating “ka e” produces a natural parallel construction and avoids reading the clause as an active command addressed to an unspecified agent.
  revised_text: Onyenwe anyị wee sị, “Ọ bụrụ na unu nwere okwukwe dị ka mkpụrụ mọstad, unu gaara asị osisi mulberị a[a], ‘Ka e fọpụta gị na mgbọrọgwụ, ka e kụọkwa gị n’oké osimiri,’ ọ gaara erubere unu isi.”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘osisi sikamin,’ bụ́ aha ọdịnala e ji atụgharị okwu Grik a maka osisi mulberị.
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the two imperative clauses so that they naturally and explicitly convey the Greek passive commands: the tree is to be uprooted and planted. It retains the draft’s conditional phrasing, established key terms, paradoxical sea imagery, and lexical footnote.'
