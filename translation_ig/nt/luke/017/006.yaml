revisions:
- from: Onyenwe anyị wee sị, “Ọ bụrụ na unu nwere okwukwe dị ka mkpụrụ mọstad, unu gaara asị osisi mulberị a[a], ‘Ka e si na mgbọrọgwụ hopụ gị, kụọkwa gị n’oké osimiri,’ ọ gaara erubere unu isi.”
  to: Onyenwe anyị wee sị, “Ọ bụrụ na unu nwere okwukwe dị ka mkpụrụ mọstad, unu gaara asị osisi mulberị a[a], ‘Ka e fọpụta gị na mgbọrọgwụ, ka e kụọkwa gị n’oké osimiri,’ ọ gaara erubere unu isi.”
  rationale: 'The revision corrects the two imperative clauses so that they naturally and explicitly convey the Greek passive commands: the tree is to be uprooted and planted. It retains the draft’s conditional phrasing, established key terms, paradoxical sea imagery, and lexical footnote.'
