base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: ig
  text: 'N’otu aka ahụ[a], dị nnọọ ka o mere n’oge Lọt: ha nọ na-eri ihe, na-aṅụ ihe ọṅụṅụ, na-azụ ihe, na-ere ihe, na-akụ mkpụrụ, na-ewu ụlọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Dịkwa ka o mere n’oge Lọt.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: N’otu aka ahụ
  rationale: Na-ejikọta ihe atụ a na nke bu ya ụzọ ma na-echekwa echiche nke myirịta n’Igbo dị ugbu a.
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Na-egosipụta ntụnyere ahụ nke ọma ma kwekọọ na ike okwu Grik ahụ.
- source_word: ἐγένετο
  choice: o mere
  rationale: Na-enye echiche nke ihe mere n’akụkọ ihe mere eme n’asụsụ Igbo dị mfe ma bụrụ nke e ji eme ihe taa.
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: n’oge Lọt
  rationale: Ọ bụ ụzọ Igbo si ekwu oge metụtara mmadụ; ọ na-ezere ntụgharị siri ike nke ‘n’ụbọchị Lọt’ ma chekwaa ihe okwu ahụ pụtara.
- source_word: ἤσθιον
  choice: ha nọ na-eri ihe
  rationale: ‘Nọ na-’ na-egosipụta omume na-aga n’ihu nke imperfect Grik.
- source_word: ἔπινον
  choice: na-aṅụ ihe ọṅụṅụ
  rationale: Na-aga n’usoro na ngwaa mbụ, ma na-egosipụta ọrụ nkịtị na-aga n’ihu.
- source_word: ἠγόραζον
  choice: na-azụ ahịa
  rationale: N’ebe a ọ pụtara ịzụta ihe; okwu a bụ nke a na-aghọta nke ọma n’usoro ọrụ ahịa.
- source_word: ἐπώλουν
  choice: na-ere ahịa
  rationale: Na-ejikọta n’ụzọ eke na ‘na-azụ ahịa’ iji gosipụta ịzụ na ire ihe.
- source_word: ἐφύτευον
  choice: na-akụ ihe
  rationale: Na-egosipụta ọrụ ịkụ mkpụrụ ma ọ bụ ihe ọkụkụ n’enweghị ịgbakwunye nkọwa na-adịghị na isi mmalite.
- source_word: ᾠκοδόμουν
  choice: na-ewukwa ụlọ
  rationale: Na-echekwa ihe nkịtị, ya bụ iwu ụlọ, ọ bụghị ihe atụ ime mmụọ; ‘-kwa’ na-emechi ndepụta ahụ n’ụzọ Igbo dị mma.
