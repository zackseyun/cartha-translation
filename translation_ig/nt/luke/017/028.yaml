translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro ‘ha nọ na-…’ chekwaa ọdịdị omume na-aga n’ihu nke ngwaa imperfect ndị Grik, ebe e mere ka ndepụta ahụ na-aga nke ọma n’Igbo.
