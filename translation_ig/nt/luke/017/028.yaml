revisions:
- from: 'N’otu aka ahụ[a], dị nnọọ ka o mere n’oge Lọt: ha nọ na-eri ihe, na-aṅụ ihe ọṅụṅụ, na-azụ ahịa, na-ere ahịa, na-akụ ihe, na-ewukwa ụlọ.'
  to: 'N’otu aka ahụ[a], dị nnọọ ka o mere n’oge Lọt: ha nọ na-eri ihe, na-aṅụ ihe ọṅụṅụ, na-azụ ihe, na-ere ihe, na-akụ mkpụrụ, na-ewu ụlọ.'
  rationale: The revision preserves the source’s comparison and imperfective catalogue while distinguishing buying from selling, rendering planting more precisely, and removing unexpressed emphasis. The footnote remains a genuine alternative for ὁμοίως while retaining the eventive sense of ἐγένετο.
