lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: O wee sị ya
  rationale: Nke a bụ ụzọ Igbo si akọ akụkọ n'ụzọ eke, ma na-edobe na Jizọs gwara nwoke ahụ okwu kpọmkwem.
- source_word: Ἀναστὰς
  choice: Bilie
  rationale: Ọ na-egosipụta iwu dị nkenke nke ἀνίστημι n'ụzọ doro anya ma kwesịkwa ekwesị.
- source_word: πορεύου
  choice: gawa
  rationale: “Gawa” bụ iwu eke n'Igbo nke na-egosi ka ọ malite ịga ma nọgide n'ụzọ ya.
- source_word: πίστις
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo a na-ejikarị sụgharịa πίστις; n'ebe a ọ gụnyere ịtụkwasị Jizọs obi, ma a naghị eme ka ihe okwu ahụ pụtara bụrụ naanị otu akụkụ.
- source_word: σέσωκέν
  choice: azọpụtala
  rationale: “Azọpụtala” na-edobe obosara ihe σῴζω pụrụ ịpụta, gụnyere nzọpụta na mgbake, ma ọdịdị “-la” na-egosi ihe e mezuru nke nsonaazụ ya ka dị.
- source_word: σε
  choice: gị
  rationale: Ọ bụ nnọchiaha onye nke abụọ dịka ihe omume ahụ metụtara.
theological_decisions:
- issue: Ihe σέσωκέν σε pụtara n'akụkọ ọgwụgwọ a
  choice: azọpụtala gị
  alternative: emela ka ahụ dị gị mma; agwọọla gị
  rationale: Ọ bụ ezie na σῴζω pụrụ izo aka n'ọgwụgwọ anụ ahụ, mmadụ iri ahụ niile adịlarị ọcha, ebe naanị onye a laghachiri nye Chineke otuto. “Azọpụtala gị” na-edobe ohere nke nzọpụta sara mbara ma ghara iwepụ njikọ ya na mgbake anụ ahụ.
- issue: Ihe πίστις pụtara n'ebe a
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N'ọnọdụ a, “okwukwe” nwere ike ịgụnye ntụkwasị obi nwoke ahụ nwere n'ebe Jizọs nọ. A hapụrụ ụzọ okwu ndị ọzọ pụrụ isi pụta na nkọwa ala peeji kama ikpebi ya n'ụzọ dị warara.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E ji “O wee sị ya” mee ka usoro akụkọ ahụ bụrụ nke eke; e jighị okwu ụka pụrụ iche nke otu nzukọ. E tinyere akara nkọwa [b] n'akụkụ “okwukwe” na [a] n'akụkụ “azọpụtala” ka ha kwekọọ n'ezie n'okwu ndị nkọwa ahụ na-akọwa.
