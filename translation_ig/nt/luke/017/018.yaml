id: LUK.17.18
reference: Luke 17:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐχ εὑρέθησαν ὑποστρέψαντες δοῦναι δόξαν τῷ θεῷ εἰ μὴ ὁ ἀλλογενὴς οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/018.yaml
  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: ig
  text: Ọ̀ bụ na a hụghị ndị laghachiri inye Chineke otuto, ma e wezụga onye mba ọzọ a?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye si n’agbụrụ ọzọ a” ma ọ bụ “ọbịa a.” Okwu Grik ahụ na-ezo aka n’onye mba ọzọ, onye na-abụghị onye Izrel.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: a hụghị ndị
  rationale: A na-eji usoro a na Igbo egosipụta aorist passive n’ajụjụ nkwupụta n’ụzọ doro anya, ma na-echekwa echiche nke ‘a hụrụ.’
- source_word: ὑποστρέψαντες
  choice: laghachiri
  rationale: Ọ na-egosi na ha kwesịrị ịlaghachi ma nye Chineke otuto; ‘laghachiri’ bụ okwu Igbo dị mfe ma kwekọọ n’ihe participle ahụ pụtara.
- source_word: δοῦναι δόξαν
  choice: inye ... otuto
  rationale: Nke a na-echekwa akpaalaokwu Grik nke pụtara ‘inye otuto,’ kama ime ka ọ bụrụ naanị ‘ito.’
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: ‘Inye Chineke otuto’ bụ usoro okwu Igbo ebumpụta ụwa ma na-egosi onye a na-enye otuto ahụ.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Nke a bụ ụzọ Igbo doro anya isi gosipụta mwepu nke εἰ μή.
- source_word: ἀλλογενής
  choice: onye mba ọzọ
  rationale: Ọ na-egosi onye si n’agbụrụ ma ọ bụ mba ọzọ, onye nọ n’èzí Izrel, na-enweghị ịgbakwunye nkọwa okpukpe na-adịghị n’okwu ahụ n’onwe ya.
- source_word: οὗτος
  choice: a
  rationale: Demonstrative ‘a’ na-esochi aha n’usoro Igbo ma na-echekwa nkwusi ike dị na ‘onye mba ọzọ a.’
theological_decisions:
- issue: Ọnọdụ nwoke a dịka onye agbụrụ na okpukpe ọzọ
  choice: onye mba ọzọ a
  alternative: onye si n’agbụrụ ọzọ a; ọbịa a
  rationale: 'Nhọrọ a na-echekwa ihe ijuanya dị n’amaokwu ahụ: onye laghachiri nye Chineke otuto bụ onye nọ n’èzí Izrel. Ọ naghị etinye ‘onye Sameria’ n’amaokwu a, ọ bụ ezie na gburugburu amaokwu ahụ na-egosi nke ahụ.'
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere ajụjụ ahụ dịka ajụjụ nkwupụta, ma chekwaa akpaalaokwu ‘inye Chineke otuto.’
