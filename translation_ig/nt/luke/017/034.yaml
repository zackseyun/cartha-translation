id: LUK.17.34
reference: Luke 17:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: ig
  text: Ana m agwa unu, n’abalị ahụ, mmadụ abụọ ga-adị n’otu akwa ndina; a ga-ewere otu onye[a], a ga-ahapụkwa onye nke ọzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a ga-akpọrọ otu onye.” Ngwaa Grik ahụ n’onwe ya ekwughị n’ebe a ma ịkpọrọ onye ahụ ọ̀ bụ maka nzọpụta ka ọ̀ bụ maka ikpe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a ga-ahapụ onye nke ọzọ n’azụ.” E ji okwu dị mkpirikpi n’ahịrịokwu bụ isi zere itinye echiche ndị e mesịrị jikọtara n’ụzọ pụrụ iche na okwu ahụ banyere ọgwụgwụ oge, nke na-apụtaghị ìhè n’asụsụ Grik.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu kpọmkwem ma mesie ndị a na-agwa ike, n’enweghị ịgbakwunye nkọwa.
- source_word: ταύτῃ τῇ νυκτί
  choice: n’abalị ahụ
  rationale: Ọ na-ezo aka n’otu abalị a kapịrị ọnụ nke a na-ekwu maka ya.
- source_word: ἔσονται δύο
  choice: mmadụ abụọ ga-anọ
  rationale: E tinyere ‘mmadụ’ ka ahịrịokwu ahụ doo anya ma bụrụ Igbo nkịtị; ọdịnihu dị na ‘ga-anọ’.
- source_word: ἐπὶ κλίνης μιᾶς
  choice: n’otu ihe ndina
  rationale: κλίνη nwere ike ịbụ ihe ndina ma ọ bụ oche ndina, ma ọnọdụ abalị a na-akwado ‘ihe ndina’; ‘n’otu’ bụ ụzọ Igbo kachasị pụta ụwa maka mmadụ abụọ nọ n’otu ihe ndina.
- source_word: ὁ εἷς
  choice: otu onye
  rationale: Nke a na-egosipụta otu n’ime mmadụ abụọ ahụ n’ụzọ doro anya ma dị mfe.
- source_word: παραλημφθήσεται
  choice: a ga-ewere otu onye
  rationale: ‘A ga-ewere’ na-edobe olu nnara na ihe okwu Grik pụtara n’ozuzu ya, ma ọ naghị ekpebi ma e were onye ahụ maka nzọpụta ka ọ bụ maka ikpe.
- source_word: ὁ ἕτερος
  choice: onye nke ọzọ
  rationale: Ọ bụ okwu Igbo nkịtị maka onye nke abụọ n’ime mmadụ abụọ a na-atụnyere.
- source_word: ἀφεθήσεται
  choice: hapụkwa onye nke ọzọ
  rationale: N’ọnọdụ a, ἀφίημι pụtara ịhapụ, ọ bụghị ịgbaghara. Nhọrọ a dị mkpirikpi ma zere ịgbakwunye echiche pụrụ iche banyere ihe ndị ga-eme n’ọgwụgwụ oge.
theological_decisions:
- issue: Ma onye a ga-ewere ọ̀ bụ onye a napụtara ka ọ̀ bụ onye e weere maka ikpe
  choice: 'E debere ya n’enweghị mkpebi: ‘a ga-ewere otu onye, hapụkwa onye nke ọzọ.’'
  alternative: Ịkọwa na onye e were bụ onye a zọpụtara, ma ọ bụ na ọ bụ onye e weere maka ikpe.
  rationale: Ngwaa Grik ndị dị n’amaokwu a n’onwe ha ekpebighị nke bụ ezi nghọta. Nsụgharị ahụ na-edobe mgbagwoju na esemokwu nkà mmụta okpukpe dị n’isi mmalite kama ịmanye otu usoro nkọwa banyere ọgwụgwụ oge.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ihe ndina’ kama okwu ochie ma ọ bụ nke mpaghara; e debere usoro okwu ahụ ka ọ bụrụ nke a na-anụkarị n’Igbo. A doziri akara nkọwa ala peeji ka [a] soro ‘a ga-ewere’ na [b] soro ‘onye nke ọzọ,’ n’ihi na nke ahụ bụ okwu nkọwa ndị ahụ na-akọwa.
