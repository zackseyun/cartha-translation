  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: ig
  text: Ha agaghịkwa asị, “Lee, ọ nọ ebe a!” ma ọ bụ “Ọ nọ ebe ahụ!” N’ihi na lee, alaeze Chineke dị n’etiti unu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime unu.” Okwu Grik ahụ nwere ike ịpụta ma “n’ime unu” ma ọ bụ “n’etiti unu,” dabere n’otú a si aghọta ya.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: Ha agaghịkwa asị
  rationale: “Agaghịkwa” na-aga n’ihu nkatọ dị n’amaokwu bu ụzọ ma na-egosi ọdịnihu nke ngwaa ahụ n’Igbo nkịtị.
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: “Lee, ọ nọ ebe a!” ma ọ bụ, “Ọ nọ ebe ahụ!”
  rationale: “Lee” bụ okwu ịdọrọ uche; itinye “ọ nọ” na-eme ka okwu ọnọdụ ahụ doo anya ma daa nke ọma n’Igbo, ebe “ebe a” na “ebe ahụ” na-echekwa ntụnyere ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara na a gaghị atụ aka n’otu ebe a pụrụ ịhụ anya.
- source_word: ἰδοὺ
  choice: lee
  rationale: Ọ na-echekwa ike okwu Grik nke na-adọrọ uche, ma bụrụkwa okwu Igbo dị ugbu a ma kwanyere ugwu.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ nsụgharị doro anya nke na-echekwa ma echiche ọchịchị Chineke ma nke alaeze ya n’emeghị ka otu echiche merie ibe ya.
- source_word: ἐντὸς ὑμῶν
  choice: dị n’etiti unu
  rationale: “Unu” bụ ọtụtụ mmadụ, ọnọdụ okwu ahụ na-ekwukwa banyere ebe a pụrụ ịtụ aka; ya mere “n’etiti unu” na-egosi ọnụnọ n’etiti ìgwè ahụ. Ma “n’ime unu” ka bụ nghọta Grik nwere ike ibu, ya mere e debere ya n’ala peeji.
- source_word: ἐστιν
  choice: dị
  rationale: “Dị” na-enye nghọta nke ịdị ma ọ bụ ịnọ ugbu a n’ụzọ dị nkenke ma kwekọọ n’Igbo.
theological_decisions:
- issue: Ihe ἐντὸς ὑμῶν pụtara
  choice: alaeze Chineke dị n’etiti unu
  alternative: alaeze Chineke dị n’ime unu
  rationale: N’ihi na a na-agwa ọtụtụ mmadụ okwu, tinyere ndị Farisii, nghọta nke ọnụnọ n’etiti ha ka dabara nke ọma n’isi ederede. Otú ọ dị, okwu Grik ahụ nwekwara ike ịpụta ihe dị n’ime mmadụ; ihe odide ala peeji na-echekwa mgbagwoju anya a n’ebughị ụzọ kpebie ozizi ga-esite na ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma kwanyere ugwu. “Lee” na-echekwa ụda ịdọrọ uche nke ἰδοὺ; “n’etiti unu” bụ isi nsụgharị, ebe e chekwara “n’ime unu” n’ala peeji n’ihi ezigbo mgbagwoju anya dị n’asụsụ Grik.
