revisions:
- from: Ọ̀ na-ekele ohu ahụ n’ihi na o mere ihe e nyere ya n’iwu?[a]
  to: Ọ̀ na-ekele ohu ahụ n’ihi na o mere ihe e nyere n’iwu?[a]
  rationale: The revision removes an unstated recipient from the passive expression ‘what was commanded’ and replaces an inaccurate, overly narrow footnote alternative. It retains the natural rhetorical-question form, the causal relation, and “ohu” for the socially subordinate status denoted by δοῦλος.
  reviewer_model: gpt-5.6-terra
