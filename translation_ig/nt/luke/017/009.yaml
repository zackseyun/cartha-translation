  text: μὴ ⸂ἔχει χάριν⸃ τῷ ⸀δούλῳ ὅτι ἐποίησεν τὰ ⸀διαταχθέντα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: ig
  text: Ọ̀ na-ekele ohu ahụ n’ihi na o mere ihe e nyere n’iwu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu Grik doulos dị ka “onye na-eje ozi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: Ọ̀ ...?
  rationale: Ajụjụ a bụ nke na-atụ anya azịza na-adịghị mma. Ụdị ajụjụ Igbo a na-eme ka nke ahụ pụta ìhè site n’ọnọdụ okwu ndị gbara ya gburugburu, n’enweghị ịgbakwụnye okwu na-adịghị na Grik.
- source_word: ἔχει χάριν
  choice: na-ekele
  rationale: Nkebiokwu Grik a pụtara inwe ma ọ bụ igosi ekele n’ebe mmadụ nọ; “na-ekele” bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: δούλῳ
  choice: ohu
  rationale: “Ohu” na-echekwa ọnọdụ onye nọ n’okpuru ikike nna ya ukwu, onye iwu ji ime ihe e nyere ya n’iwu. Nke a dị mkpa n’echiche ilu ahụ.
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe ga-abụ ihe kpatara ekele ahụ.
- source_word: ἐποίησεν
  choice: o mere
  rationale: Nke a bụ nsụgharị Igbo nkịtị nke ποιέω n’ebe a, ya na ihe so ya na-egosi imezu iwu.
- source_word: τὰ διαταχθέντα
  choice: ihe e nyere ya n’iwu
  rationale: Nke a na-echekwa echiche nke ihe e nyere n’iwu ma na-eme ka onye e nyere iwu doo anya n’Igbo n’ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ọnọdụ nna ukwu na ohu n’ilu a
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Echiche amaokwu a dabeere n’ọrụ onye nọ n’okpuru ikike nna ya ukwu, onye iwu ji irube isi. “Ohu” anaghị eme ka ezi ọnọdụ mmekọrịta ahụ dị nro, ebe ihe ọzọ nwere ike ịdị ka ọrụ mmadụ ji aka ya họrọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dịkwa ugwu, dee ya. Akara ụda dị na “Ọ̀” na-enyere onye na-agụ aka ịmata na ọ bụ ajụjụ; usoro ajụjụ ahụ na ọnọdụ ya na-egosi na azịza a na-atụ anya ya bụ mba.
