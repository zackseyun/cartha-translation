id: LUK.17.7
reference: Luke 17:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: ig
  text: Ma ònye n’ime unu, onye nwere ohu[a] na-akọ ala ma ọ bụ na-elekọta ìgwè anụ ụlọ, ga-asị ya mgbe o si n’ubi lọta, “Bịa ozugbo, dinaa n’ebe a na-eri nri[b]”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik doulos pụtara ohu, ya bụ, onye nọ n’okpuru ikike nna ukwu ya; n’ọnọdụ ụfọdụ, a pụkwara ịsụgharị ya “onye na-eje ozi.”
    reason: alternative_reading
  - marker: b
    text: N’oge ahụ, ndị mmadụ na-adina n’akụkụ ebe a na-eri nri mgbe ha na-eri; n’asụsụ dị mfe, nke a pụtara “nọdụ ala rie nri.”
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: ohu
  rationale: “Ohu” na-egosipụta onye nọ n’okpuru ikike nna ya ukwu, ọ bụghị onye e goro ọrụ naanị; nke a na-echekwa ike mmekọrịta e ji wuo ihe atụ ahụ.
- source_word: ἀροτριῶντα
  choice: na-akọ ala
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa kpọmkwem maka ọrụ ịkọ ala.
- source_word: ποιμαίνοντα
  choice: na-elekọta ìgwè anụ ụlọ
  rationale: Ọ na-egosipụta ọrụ onye ọzụzụ atụrụ n’ebughị ụzọ kpebie ụdị anụmanụ ndị ahụ, ebe Grik ekwughị ya kpọmkwem.
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: mgbe o si n’ubi lọta
  rationale: Nke a na-egosipụta na nlọghachi ya si n’ubi bụ oge nna ya ukwu ga-agwa ya okwu.
- source_word: ἐρεῖ αὐτῷ
  choice: ga-asị ya
  rationale: Ọ bụ nsụgharị Igbo dị mfe ma dị nso n’okwu Grik nke pụtara ‘will say to him.’
- source_word: Εὐθέως
  choice: ozugbo
  rationale: “Ozugbo” na-egosipụta ngwa ngwa na-enweghị igbu oge.
- source_word: παρελθὼν
  choice: Bịa
  rationale: N’usoro iwu a, participle ahụ na-egosi ịbịaru nso tupu mmadụ ewere ọnọdụ iri nri; “Bịa” na-ada nke ọma n’Igbo.
- source_word: ἀνάπεσε
  choice: dinara ala iri nri
  rationale: Nke a na-echekwa echiche akụkọ ihe mere eme nke ịdina n’akụkụ ebe a na-eri nri, kama ịgbanwe ya kpamkpam ka ọ bụrụ ịnọdụ ala.
theological_decisions:
- issue: Nsụgharị δοῦλος n’ọnọdụ ụlọ nke ihe atụ a
  choice: ohu
  alternative: onye na-eje ozi
  rationale: Isi ihe n’ajụjụ ahụ dabere n’ikike nna ukwu nwere n’ebe ohu nọ. “Ohu” na-echekwa ọdịiche ikike ahụ n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ajụjụ ahụ ka ọ bụrụ ajụjụ nkwuwa okwu, ma kọwaa omenala iri nri n’ihe odide ala peeji kama ihichapụ ya n’ahịrịokwu ahụ.
