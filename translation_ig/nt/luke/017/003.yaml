source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: ig
  text: Lezienụ onwe unu anya. Ọ bụrụ na nwanne gị[a][b] emehie, baara ya mba; ọ bụrụkwa na o chegharịa, gbaghara ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ odide na-agụ, “Ọ bụrụ na nwanne gị emehie megide gị, baara ya mba.”
    reason: textual_variant
  - marker: b
    text: N'okwu Grik, “nwanne” dị n'ụdị nwoke, otu onye, ma ọ pụkwara ịpụta n'ụzọ sara mbara onye ọzọ so na ndị na-eso ụzọ.
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: Lezienụ onwe unu anya
  rationale: Ngwaa dị n’ụdị iwu nke na-egosi ịga n’ihu na-amụ anya; nkebi a na-echekwa echiche nke ile onwe ha anya, ma n’otu n’otu ma dịka ọgbakọ.
- source_word: ἁμάρτῃ
  choice: emehie
  rationale: Ihe odide SBLGNT enweghị okwu pụtara ‘megide gị’; ya mere, ‘emehie’ na-echekwa nghọta sara mbara nke ihe odide ahụ.
- source_word: ὁ ἀδελφός σου
  choice: nwanne gị
  rationale: Nke a na-egosipụta otu nwoke dịka ụtọasụsụ Grik si dị, ma n’ọnọdụ a ọ pụkwara ịpụta onye ọzọ so na ndị na-eso ụzọ; a kọwara nke ahụ n’ala ala peeji.
- source_word: ἐπιτίμησον αὐτῷ
  choice: baara ya mba
  rationale: Nke a bụ ụzọ Igbo doro anya ma sie ike isi kwuo ịgwa mmadụ mmejọ ya, na-emeghị ka iwu ahụ dị nro karịa ihe Grik kwuru.
- source_word: μετανοήσῃ
  choice: o chegharịa
  rationale: ‘Chegharịa’ bụ okwu Igbo a na-ejikarị egosi mgbanwe nke uche na ụzọ ndụ n’ihe gbasara mmehie.
- source_word: ἄφες αὐτῷ
  choice: gbaghara ya
  rationale: N’ọnọdụ mmekọrịta mmadụ na ibe ya, nke a bụ ntụgharị doro anya na nke ebumpụta ụwa maka ịhapụ mmadụ mmejọ ya.
theological_decisions:
- issue: Ma a ga-etinye ‘megide gị’ n’ahịrị bụ isi
  choice: E tinyebeghị ‘megide gị’ n’ahịrị bụ isi.
  alternative: Ọ bụrụ na nwanne gị emehie megide gị, baara ya mba.
  rationale: Ihe odide Grik enyere kwuru naanị na nwanne ahụ ‘emehie’; ọ naghị ekwu kpọmkwem na o mere ya megide onye a na-agwa okwu. E debere ọgụgụ dị ogologo n’ala ala peeji ka a ghara izochi ọdịiche dị n’ihe odide.
- issue: Otú a ga-esi tụgharịa ἀδελφός nke bụ otu nwoke n’ụtọasụsụ Grik
  choice: nwanne gị
  alternative: onye ọzọ so na ndị kwere ekwe
  rationale: ‘Nwanne gị’ na-agbasochi ụdị okwu Grik anya ma na-ahapụ nkọwa gbasara onye a na-ekwu maka ya n’ala ala peeji, kama itinye nkọwa ahụ n’ahịrị bụ isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Lezienụ onwe unu anya’ na-echekwa iwu e nyere ọtụtụ mmadụ; ‘baara ya mba’ na-ebute ike nke ịdọ aka ná ntị n’ihu mmehie, ebe ‘chegharịa’ na ‘gbaghara’ bụ okwu ndị mmadụ maara nke ọma n’okwu omume na okwukwe.
