id: LUK.17.22
reference: Luke 17:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: ig
  text: Mgbe ahụ, ọ gwara ndị na-eso ụzọ, “Ụbọchị ga-abịa mgbe unu ga-achọsi ike ịhụ otu n’ime ụbọchị nke Nwa nke Mmadụ[a], ma unu agaghị ahụ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ụbọchị nke Nwa nke Mmadụ” nwere ike izo aka n’oge ọnụnọ ya na ọrụ ya, ma ọ bụ karịchaa n’oge mkpughe ya nke ga-abịa; okwu Grik ahụ akọwaghị ókè ihe ọ na-ezo aka na ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Mgbe ahụ, ọ gwara
  rationale: δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n’ihu. “Mgbe ahụ” na-enye Igbo dị ugbu a nke na-aga were were, ebe “ọ gwara” dabara n’otú e si ekwu okwu a gwara ndị mmadụ.
- source_word: πρὸς τοὺς μαθητάς
  choice: ndị na-eso ụzọ
  rationale: Asụsụ Grik nwere mkpụrụokwu na-egosi ndị a maara, ma o nweghị okwu pụtara “ya.” Ya mere, a hapụrụ nnọchiaha nwe mmadụ iji soro ihe odide ahụ nke ọma.
- source_word: Ἐλεύσονται ἡμέραι
  choice: Ụbọchị na-abịa
  rationale: Nke a bụ ụzọ amụma si egosi oge ga-abịa. Nsụgharị a bụ Igbo kwụ ọtọ ma na-edobe ike okwu ọdịnihu ahụ.
- source_word: ἐπιθυμήσετε
  choice: unu ga-achọsi ike
  rationale: Okwu a na-egosi ọchịchọ siri ike, ọ bụghị naanị ịhọrọ ma ọ bụ ịchọ ihe n’ụzọ nkịtị.
- source_word: μίαν τῶν ἡμερῶν
  choice: otu n’ime ụbọchị
  rationale: Nke a na-edobe echiche nke otu ụbọchị n’etiti ọtụtụ ụbọchị.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: A sụgharịrị aha a n’ụzọ nkịtị iji chekwaa ojiji Jizọs ji ya kpọọ onwe ya na njikọ Akwụkwọ Nsọ ya.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Nke a bụ okwu Igbo dị mfe ma doo anya maka ịhụ ihe a na-achọsi ike ịhụ.
- source_word: καὶ οὐκ ὄψεσθε
  choice: ma unu agaghị ahụ ya
  rationale: “Ma” na-egosi ọdịiche dị n’etiti ọchịchọ ha na ihe ga-eme n’ụzọ Igbo nkịtị. “Ya” na-ezo aka n’otu n’ime ụbọchị ahụ.
theological_decisions:
- issue: Ihe “ụbọchị Nwa nke Mmadụ” pụtara
  choice: E debere okwu ahụ ka ọ na-ezo n’ụzọ sara mbara n’oge Nwa nke Mmadụ, n’akọwaghị ya kpọmkwem.
  alternative: Ọ pụrụ izo aka n’oge Jizọs nọ n’etiti ndị na-eso ụzọ ya, ma ọ bụ karịchaa n’oge mkpughe ya nke ga-abịa.
  rationale: Okwu Grik ahụ na ọnọdụ amaokwu ndị gbara ya gburugburu nwere echiche gbasara ọgwụgwụ oge, ma ha anaghị amanye ka a họrọ naanị otu n’ime nghọta ndị a. Nsụgharị ahụ na-edobe esemokwu na ohere ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “ndị na-eso ụzọ” kama okwu nwere nnọchiaha “ya,” n’ihi na ihe odide Grik ekwughị ya kpọmkwem. E tinyere naanị nkọwa ala peeji nke na-echekwa nghọta sara mbara nke okwu ahụ.
