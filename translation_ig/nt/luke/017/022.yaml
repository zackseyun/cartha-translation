revisions:
- from: Mgbe ahụ, ọ gwara ndị na-eso ụzọ, “Ụbọchị na-abịa mgbe unu ga-achọsi ike ịhụ otu n’ime ụbọchị Nwa nke Mmadụ[a], ma unu agaghị ahụ ya.”
  to: Mgbe ahụ, ọ gwara ndị na-eso ụzọ, “Ụbọchị ga-abịa mgbe unu ga-achọsi ike ịhụ otu n’ime ụbọchị nke Nwa nke Mmadụ[a], ma unu agaghị ahụ ya.”
  rationale: The revision makes the Greek future explicit and clarifies the possessive/genitive relationship in the phrase 'days of the Son of Man.' It retains the source’s ambiguity about the scope of those days, the direct wording of the title, and the footnote anchor and content.
  reviewer_model: gpt-5.6-terra
