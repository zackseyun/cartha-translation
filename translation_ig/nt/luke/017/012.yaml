  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: ig
  text: Ka ọ na-abanye n’otu obodo nta, ndị ikom iri nwere ekpenta[a] zutere ya; ha guzoro n’ebe dị anya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, e ji okwu akọwa “ndị ikom iri” dị ka ndị ekpenta. Okwu ahụ anaghị akọwa otu ọrịa kpọmkwem dịka ọgwụ ọgbara ọhụrụ si akọwa ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “n’ebe tere aka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: Ka ọ na-abanye
  rationale: Nke a na-egosi na ịbanye ya ka na-aga n’ihu mgbe ndị ikom ahụ zutere ya, dịka participle nke oge ugbu a si dị.
- source_word: εἴς τινα κώμην
  choice: n’otu obodo nta
  rationale: “Otu” na-egosipụta obodo nta a na-akpọghị aha kpọmkwem, ebe “obodo nta” dabara na κώμην.
- source_word: ἀπήντησαν
  choice: zutere ya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke nkịtị maka izute mmadụ, n’etinyeghị nkọwa mmegharị ọzọ na-adịghị n’amaokwu ahụ.
- source_word: δέκα λεπροὶ ἄνδρες
  choice: ndị ikom iri ekpenta na-arịa
  rationale: Ọ na-edobe ndị ahụ dịka ndị ikom ma kọwaa ọnọdụ ha n’asụsụ Igbo dị mma, na-enweghị ime ka ọrịa ahụ bụrụ njirimara ha niile.
- source_word: οἳ ἔστησαν
  choice: ha guzoro
  rationale: Ọ na-edobe ihe ἵστημι pụtara n’ụzọ dị mfe ma doo anya, ọbụna mgbe e kewara relative clause ahụ ka Igbo wee na-aga were were.
- source_word: πόρρωθεν
  choice: n’ebe dị anya
  rationale: Nke a bụ ụzọ Igbo nke oge a si egosi na ha nọpụụrụ ya anya, na-enweghị ịkọ kpọmkwem ogologo ebe ahụ.
theological_decisions:
- issue: Otú e si sụgharịta λεπροί, aha ọnọdụ ọrịa ahụ
  choice: ndị ikom iri ekpenta na-arịa
  alternative: ndị ikom iri nwere ọrịa akpụkpọ ahụ
  rationale: “Ekpenta” bụ okwu ndị na-agụ Igbo ga-aghọta, ma ihe odide Grik anaghị akwado ikwu na ọ bụ kpọmkwem ọrịa a na-akpọ Hansen’s disease n’ọgwụ ọgbara ọhụrụ. Ihe odide ala peeji na-echekwa ọdịiche a.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E ji “Ka ọ na-abanye” chekwaa omume na-aga n’ihu; e ji semicolon mee ka njikọ dị n’etiti izute Jizọs na iguzo n’ebe dị anya pụta ìhè.
