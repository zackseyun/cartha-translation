source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: ig
  text: Dị nnọọ ka o mere n’oge Noa, otu ahụkwa ka ọ ga-adị n’oge Nwa nke Mmadụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye Mmadụ.” Utuokwu Grik a, nke a na-asụgharịkarị “Nwa nke Mmadụ,” nwere ike ịkpọtụrụ Daniel 7; e debere ya ebe a n’ihi njikọ ya a maara nke ọma na Mesaịa na ihe ndị ga-eme n’ọdịnihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Dị nnọọ ka
  rationale: Na-egosi ntụnyere siri ike; okwu a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi nye echiche ‘dị nnọọ ka.’
- source_word: ἐγένετο
  choice: o mere
  rationale: Na-egosi ihe mere n’oge Noa n’asụsụ Igbo nke oge a, na-enweghị iji okwu ochie ma ọ bụ ịgbakwunye nkọwa.
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: n’oge Noa
  rationale: ‘N’oge Noa’ bụ akpaokwu oge na-ada nke ọma n’Igbo ma na-eburu echiche nke ‘n’ụbọchị Noa’ n’enweghị nghọtahie na ọ bụ ụbọchị ole na ole nkịtị.
- source_word: οὕτως
  choice: otu ahụ
  rationale: Na-amalite akụkụ nke abụọ nke ntụnyere ahụ n’ụzọ doro anya ma kwekọọ na ‘dị nnọọ ka.’
- source_word: ἔσται
  choice: ọ ga-adị
  rationale: Na-edobe ụdị ọdịnihu nke ngwaa εἰμί ma ghara ịkọwapụta kpọmkwem ihe ga-eme karịa ihe Grik kwuru.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ na ‘ahụkwa’ na-egosipụta echiche nke ‘ọzọkwa/also’ n’ụzọ Igbo dị ebumpụta ụwa.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Na-edobe ọdịdị aha ahụ na njikọ ya na Daniel 7, kama ime ka ọ bụrụ naanị okwu izugbe banyere mmadụ.
theological_decisions:
- issue: Nsụgharị aha τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ Mmadụ
  rationale: ‘Nwa nke Mmadụ’ na-echekwa ọdịdị okwu Grik na ụda Mesaịa na nke ihe ndị ga-eme n’ọdịnihu, karịsịa njikọ ya na Daniel 7, n’enweghị idozi mgbagwoju anya dị n’aha ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘n’oge Noa’ karịa nsụgharị nkịtị ‘n’ụbọchị Noa’ ka akpaokwu oge ahụ daa nke ọma n’Igbo. E debere ntụnyere na ọdịnihu ahụ n’enweghị ịgbakwunye ihe ndị a na-eme n’oge Noa, nke amaokwu ndị na-esote ga-akọwa.
