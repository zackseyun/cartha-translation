  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: ig
  text: Ha zara ya sị, “Ebee, Onyenwe anyị?” Ọ sịrị ha, “Ebe ahụ[b] dị, n’ebe ahụkwa ka udele[a] ga-ezukọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “udele” dịka “ugo.” Okwu Grik ahụ nwere ike ịpụta ugo, ma n’ọnọdụ nnụnụ na-ezukọ gburugburu ahụ, “udele” nwere ike ime ka echiche ahụ doo anya karị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ahụ” dịka “ozu,” nke ga-eme ka onyinyo nnụnụ na-eri anụ nwụrụ anwụ pụta ìhè karị.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες λέγουσιν
  choice: Ha zara ya sị
  rationale: Nke a na-egosi omume ịza na okwu ha n’ụzọ Igbo dị mfe ma bụrụ nke okike; a naghị amanye historical present nke Grik ebe ọ ga-ada arọ n’Igbo.
- source_word: Ποῦ
  choice: Ebee
  rationale: Ọ bụ ajụjụ dị mkpirikpi banyere ebe.
- source_word: κύριε
  choice: Onyenwe anyị
  rationale: Aha nkwanye ugwu a na-asụkarị nye Jizọs na Standard Igbo, kwekọrọ na κύριος n’ebe a.
- source_word: Ὅπου
  choice: Ebe ... nọ
  rationale: Ọ na-edobe usoro ilu ahụ n’Igbo n’enweghị ịgbakwunye nkọwa gbasara ebe a na-ekwu kpọmkwem.
- source_word: σῶμα
  choice: ahụ
  rationale: “Ahụ” bụ nsụgharị kpọmkwem nke σῶμα ma na-ahapụ onyinyo ọnwụ ahụ ka ihe gbasara nnụnụ na-ezukọ mee ka ọ pụta ìhè.
- source_word: ἀετοὶ
  choice: udele
  rationale: N’ọnọdụ nnụnụ na-ezukọ n’ebe ahụ dị, “udele” na-eme ka echiche nnụnụ na-eri anụ nwụrụ anwụ doo anya; a debere “ugo” dị ka nhọrọ n’ala peeji.
- source_word: ἐπισυναχθήσονται
  choice: ga-ezukọ
  rationale: Ọ bụ ụzọ Igbo dị ndụ na nke doro anya isi kwuo na nnụnụ ndị ahụ ga-agbakọta ọnụ, ọ bụ ezie na Grik ji ọdịdị passive.
theological_decisions:
- issue: Ihe ilu banyere ahụ na udele na-anọchi anya ya
  choice: E debere onyinyo ahụ dịka ilu n’enweghị ịkọwa onye ma ọ bụ ihe ọ na-ezo aka na ya.
  alternative: Ịkọwa ya kpọmkwem dịka ikpeazụ ikpe, ndị agha Rom, ma ọ bụ ụkpụrụ izugbe banyere ikpe.
  rationale: Grik ekwughị kpọmkwem ihe onyinyo ahụ na-anọchi anya ya; ịhapụ ya otu a na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Ha zara ya sị” mee ka okwu ahụ bụrụ nke okike n’Igbo, ebe e debere ụdị ilu na ihe omimi ya. Akara ala peeji abụọ dị n’isiokwu ndị ha na-akọwa.
