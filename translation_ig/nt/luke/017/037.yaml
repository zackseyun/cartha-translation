review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the plural response, the question «Ebee, Onyenwe anyị?», the proverbial location construction, and the future gathering of the birds. However, «Ebe ahụ dị nọ» is not a valid or natural rendering of Ὅπου τὸ σῶμα; removing «nọ» restores the intended sense, “Where the body is.”
  naturalness: «Ha zara ya sị» and «udele ga-ezukọ» are natural Standard Igbo. The corrected clause «Ebe ahụ dị, n’ebe ahụkwa ka udele ga-ezukọ» is idiomatic and preserves the concise proverbial register.
  terminology: «Onyenwe anyị» suitably renders the respectful address κύριε. «Ahụ» retains the source term σῶμα without prematurely specifying “corpse,” while «udele» communicates the likely carrion-bird sense of ἀετοί. The lexical alternatives “ugo” and “ozu” should remain footnoted. Footnote markers are placed directly after the words they qualify.
  issues:
  - severity: medium
    issue: The phrase «Ebe ahụ dị nọ» contains two incompatible locative/existential expressions.
    rationale: It is ungrammatical or at least seriously unnatural in Standard Igbo and obscures the source clause “Where the body is.” «Ebe ahụ dị» is sufficient and idiomatic.
  - severity: low
    issue: The footnote markers are both placed at the end of the quotation rather than at their respective lexical anchors.
    rationale: Marker a concerns «udele» and marker b concerns «ahụ»; anchoring them to those words makes their scope clear.
  revised_text: Ha zara ya sị, “Ebee, Onyenwe anyị?” Ọ sịrị ha, “Ebe ahụ[b] dị, n’ebe ahụkwa ka udele[a] ga-ezukọ.”
