id: LUK.17.11
reference: Luke 17:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: ig
  text: O wee bụrụ na, mgbe ọ na-aga Jerusalem, ọ na-agafe n’etiti[a] Sameria na Galili.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ na-agafe n’ime mpaghara Sameria na Galili.” Okwu Grik ahụ nwere ike ịpụta na ọ na-aga n’etiti mpaghara abụọ ahụ, ma ọ bụ na ọ na-agafe n’akụkụ ókèala kewara ha.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Ọ bụ usoro Luk ji ewebata ihe mere n’akụkọ; nsụgharị a bụ Igbo e ji akọ akụkọ nke ọma ma ọ bụghị asụsụ ochie.
- source_word: ἐν τῷ πορεύεσθαι
  choice: mgbe ọ na-aga
  rationale: Ọ na-egosi na njem ahụ ka na-aga n’ihu n’otu oge ihe ọzọ mere.
- source_word: εἰς Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Aha ebe ahụ ka e dere n’ụdị a na-ahụkarị n’Igbo, ebe ‘na-aga’ egosilarị ntụziaka njem ahụ.
- source_word: αὐτός
  choice: ọ
  rationale: Nnochiaha ahụ pụtara ìhè na Grik, ma Igbo nkịtị achọghị itinye ‘ya onwe ya’ ebe a.
- source_word: διήρχετο
  choice: ọ nọ na-agafe
  rationale: Nke a na-edobe ọdịdị imperfect nke na-egosi njem na-aga n’ihu.
- source_word: διὰ μέσον
  choice: n’etiti
  rationale: Ọ na-edobe nghọta bụ isi nke mmegharị n’etiti mpaghara abụọ, ma ihe odide Grik nwekwara ike izo aka n’ịgafe n’ime ókèala ha.
- source_word: Σαμαρείας καὶ Γαλιλαίας
  choice: Sameria na Galili
  rationale: E debere usoro aha abụọ ahụ dị ka ọ dị na Grik, jiri ụdị aha ndị a maara n’Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị nsọ n’ụzọ dabara n’Akwụkwọ Nsọ. A họọrọ ‘O wee ruo na’ dịka usoro akụkọ ebumpụta ụwa; a hapụrụ nghọtahie dị na διὰ μέσον ka nkọwa ala ghara ịbụ nke a kpebiri karịa ihe Grik kwuru.
