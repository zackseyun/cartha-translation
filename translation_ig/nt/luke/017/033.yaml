id: LUK.17.33
reference: Luke 17:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: ig
  text: Onye ọ bụla na-achọ ichekwa ndụ ya ga-atụfu ya[a], ma onye ọ bụla tụfuo ya ga-eme ka ọ dịrị ndụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ndụ” ebe a dịka “mkpụrụobi,” ma n'ọnọdụ a o yikarịrị ka ọ na-ezo aka ná ndụ mmadụ ma ọ bụ onwe ya.
    reason: lexical_alternative
  - marker: b
    text: 'N''ụzọ nkịtị: “ga-edobe ya ndụ”; a pụkwara ịsụgharị ya dịka “ga-azọpụta ya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: na-achọ
  rationale: Ọ na-egosi mgbalị nwere nzube, ọ bụghị naanị ọchịchọ efu.
- source_word: ψυχὴν
  choice: ndụ
  rationale: N'okwu a, ψυχή na-ezo aka ná ndụ mmadụ ma ọ bụ onwe ya, ọ bụghị kpọmkwem mkpụrụobi na-abụghị ahụ.
- source_word: περιποιήσασθαι
  choice: ichekwa
  rationale: Okwu a pụtara ichebe ma ọ bụ idobere onwe ya ihe; “ichekwa” na-eweta echiche nke mmadụ ịgbalị ịzọpụta ndụ nke ya.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: ga-atụfu / tụfuru
  rationale: 'Nke a na-echekwa ọdịiche na-emegiderịta onwe ya dị n''okwu Jizọs: onye chọrọ ichekwa ndụ ya ga-atụfu ya, onye tụfuru ya enweta ndụ.'
- source_word: ζῳογονήσει
  choice: ga-eme ka ọ dịrị ndụ
  rationale: ζῳογονέω pụtara ime ka ihe dị ndụ ma ọ bụ idobe ya ndụ; ntụgharị a na-egosipụta okwu Grik ahụ nke ọma karịa naanị “ga-azọpụta ya.”
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: Onye ọ bụla nke ... ma onye ọ bụla nke
  rationale: Ọ na-egosi ọnọdụ metụtara onye ọ bụla, ebe “ma” na-eme ka ọdịiche dị n'etiti akụkụ abụọ ahụ pụta ìhè.
theological_decisions:
- issue: Ihe ψυχή pụtara n'okwu a
  choice: ndụ
  alternative: mkpụrụobi
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu bụ nke ịgbalị ichekwa onwe mmadụ n'oge ikpe; “ndụ” anaghị ebubata nkewa ahụ na mkpụrụobi nke ederede ahụ ekwughị kpọmkwem.
- issue: Otú e si sụgharịa ζῳογονήσει
  choice: ga-eme ka ọ dịrị ndụ
  alternative: ga-azọpụta ya; ga-edobe ya ndụ
  rationale: E jiri okwu na-abụghị ngwaa Grik a na-ejikarị akọwa nzọpụta mee ihe; ntụgharị a na-echekwa echiche nke ime ka ihe dị ndụ, ma hapụkwa nghọtahie na esemokwu dị n'okwu ahụ ka ha dị.
translation_notes:
  register: E ji asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù mee ihe. Ahịrịokwu ahụ na-echekwa usoro na-emegiderịta onwe ya nke okwu Grik, ma zere nkọwa okpukpe pụrụ iche.
