id: LUK.17.27
reference: Luke 17:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: ig
  text: Ha nọ na-eri ihe, na-aṅụ ihe, na-alụ di na nwunye, na-enyekwa ha n’alụmdi na nwunye[a], ruo ụbọchị Noa banyere n’ụgbọ mmiri ahụ, oke iju mmiri ahụ wee bịa bibie ha niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ikwu ya nkenke sị, “ha na-alụ di na nwunye.” Ma asụsụ Grik ji ngwaa abụọ dị iche: otu bụ ngwaa active (“na-alụ di na nwunye”), nke ọzọ bụ ngwaa passive (“na-enyekwa ha n’alụmdi na nwunye”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον
  choice: Ha nọ na-eri ihe
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu ma ọ bụ nke a na-emekarị n’oge gara aga; “nọ na-eri” na-egosipụta nke a n’Igbo nkịtị.
- source_word: ἔπινον
  choice: na-aṅụ ihe
  rationale: E jikọtara ya na “Ha nọ” iji chekwaa echiche nke omume na-aga n’ihu, n’enweghị ikwughachi okwu ndị na-adịghị mkpa.
- source_word: ἐγάμουν
  choice: na-alụ di na nwunye
  rationale: Nke a bụ ụzọ Igbo doro anya, nke na-adịghị ekewapụ nwoke na nwanyị, isi kwuo na ndị mmadụ na-abanye n’alụmdi na nwunye.
- source_word: ἐγαμίζοντο
  choice: a na-enyekwa ha n’alụmdi na nwunye
  rationale: Nhazi a na-echekwa passive dị n’asụsụ Grik ma mee ka ọ dị iche na ngwaa active bu ya ụzọ.
- source_word: ἄχρι ἧς ἡμέρας
  choice: ruo ụbọchị
  rationale: Nke a na-egosi oke oge omume ndị ahụ gara n’ihu n’ụzọ dị nkenke ma dịkwa eke n’Igbo.
- source_word: εἰσῆλθεν
  choice: banyere n’ime
  rationale: Ọ na-egosi omume e mechara eme n’akụkọ ahụ, ma na-echekwa echiche nke ịbanye n’ime ihe.
- source_word: κιβωτόν
  choice: ụgbọ mmiri ahụ
  rationale: N’ihe gbasara Noa, okwu a na-ezo aka n’ụgbọ ahụ e ji zọpụta ndụ n’iju mmiri; “ụgbọ mmiri ahụ” bụ okwu ndị Igbo taa ga-aghọta ngwa ngwa.
- source_word: κατακλυσμός
  choice: oke iju mmiri ahụ
  rationale: “Oke iju mmiri” na-enye echiche nke nnukwu flood ahụ nke akụkọ Jenesis na-ezo aka na ya.
- source_word: ἀπώλεσεν πάντας
  choice: bibie ha niile
  rationale: “Ha niile” na-eme ka mmadụ niile e kwuru okwu ha doo anya ma chekwaa ngụkọta zuru ezu nke πάντας.
theological_decisions:
- issue: Ichekwa ngwaa abụọ gbasara alụmdi na nwunye
  choice: na-alụ di na nwunye, a na-enyekwa ha n’alụmdi na nwunye
  alternative: na-alụ di na nwunye
  rationale: Asụsụ Grik ji ngwaa active na passive abụọ dị iche. Ichekwa ha abụọ na-egosi ụdị ndụ mmadụ na-aga n’ihu tupu ikpe ahụ abịa, n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ụdị omume nke ngwaa anọ mbụ
  choice: iji “nọ na-/na-” gosipụta omume na-aga n’ihu
  alternative: iji simple past, dịka “Ha riri, ha ṅụrụ”
  rationale: Imperfect ndị ahụ na-egosi omume ndị a na-eme mgbe niile ma na-aga n’ihu ruo ụbọchị Noa banyere n’ụgbọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “Ha nọ na-… na-…” na-eme ka ndepụta ahụ ghara ịdị arọ ma na-echekwa omume ndị na-aga n’ihu. E debere akara nkọwa ala peeji [a] kpọmkwem n’akụkụ ahịrịokwu alụmdi na nwunye ọ na-akọwa.
