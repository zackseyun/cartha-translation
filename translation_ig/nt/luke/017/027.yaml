  to: Ha nọ na-eri ihe, na-aṅụ ihe, na-alụ di na nwunye, na-enyekwa ha n’alụmdi na nwunye[a], ruo ụbọchị Noa banyere n’ụgbọ mmiri ahụ, oke iju mmiri ahụ wee bịa bibie ha niile.
