revisions:
- from: Mgbe ndị Farisii jụrụ ya mgbe alaeze Chineke ga-abịa, ọ zara ha sị, “Alaeze Chineke adịghị abịa n’ụzọ a pụrụ iji nlezianya hụ ya[a],”
  to: Mgbe ndị Farisii jụrụ ya mgbe alaeze Chineke ga-abịa, ọ zara ha sị, “Alaeze Chineke anaghị abịa n’ụzọ a pụrụ ileba anya na ya nke ọma[a],”
  rationale: The revision replaces an awkward construction with idiomatic Standard Igbo that communicates observation, watchfulness, or scrutiny. It does not add outward ‘signs’ or claim that the kingdom is wholly imperceptible, thereby preserving the ambiguity and scope of μετὰ παρατηρήσεως.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the Pharisees’ question, Jesus’ reply, and the future-oriented sense of ἔρχεται in their question. Its rendering of μετὰ παρατηρήσεως rightly avoids adding “signs,” which is not explicit in the Greek. The phrase ‘iji nlezianya hụ ya,’ however, is less idiomatic and can imply merely seeing carefully rather than observing or watching for a detectable arrival.
  naturalness: ‘Alaeze Chineke anaghị abịa n’ụzọ a pụrụ ileba anya na ya nke ọma’ is more natural Standard Igbo and clearly expresses an arrival that can be watched for or observed. ‘Ọ zara ha sị’ remains concise and idiomatic narrative Igbo.
  terminology: ‘Ndị Farisii’ and ‘alaeze Chineke’ are established, appropriate New Testament terms. The revision preserves the lexical ambiguity of παρατήρησις as observation, watchfulness, or careful scrutiny, without doctrinally resolving the saying.
  issues:
  - severity: medium
    issue: The expression ‘n’ụzọ a pụrụ iji nlezianya hụ ya’ is awkward and semantically narrower than the Greek.
    rationale: It can be understood as ‘in a way one can see it carefully,’ whereas παρατήρησις concerns observation/watchfulness/scrutiny. ‘Ileba anya na ya’ is idiomatic Igbo for observing or watching something and retains the source’s ambiguity.
  revised_text: Mgbe ndị Farisii jụrụ ya mgbe alaeze Chineke ga-abịa, ọ zara ha sị, “Alaeze Chineke anaghị abịa n’ụzọ a pụrụ ileba anya na ya nke ọma[a],”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ileba anya,” “n’ụzọ a pụrụ ịhụ ya,” ma ọ bụ “site n’ile anya nke ọma.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an awkward construction with idiomatic Standard Igbo that communicates observation, watchfulness, or scrutiny. It does not add outward ‘signs’ or claim that the kingdom is wholly imperceptible, thereby preserving the ambiguity and scope of μετὰ παρατηρήσεως.
