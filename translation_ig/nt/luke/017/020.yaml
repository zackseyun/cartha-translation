source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: ig
  text: Mgbe ndị Farisii jụrụ ya mgbe alaeze Chineke ga-abịa, ọ zara ha sị, “Alaeze Chineke anaghị abịa n’ụzọ a pụrụ ileba anya na ya nke ọma[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site n’ileba anya,” “n’ụzọ a pụrụ ịhụ ya,” ma ọ bụ “site n’ile anya nke ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: Mgbe ndị Farisii jụrụ ya
  rationale: A na-egosipụta aorist passive participle n’ụzọ Igbo dị mfe ma bụrụkwa eke. Ọ bụ ezie na e ji active construction mee ya n’Igbo, ‘ya’ ka bụ onye a jụrụ ajụjụ, ebe ndị Farisii bụ ndị mere ya. A naghị atụgharị δέ iche n’ihi na njikọ ‘Mgbe’ na-eburu ntụgharị akụkọ ahụ nke ọma.
- source_word: πότε ἔρχεται
  choice: mgbe ... ga-abịa
  rationale: ‘Mgbe’ na-egosipụta ajụjụ oge, ebe ‘ga-abịa’ na-eburu ọdịdị ọdịnihu nke present ἔρχεται nwere n’ajụjụ a.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ ntụgharị Igbo a maara nke ọma, nke na-echekwa ịdị arọ nke okwu ahụ ma ghara ịkọwa kpọmkwem ma ọ̀ bụ ọchịchị Chineke ka a na-ekwu ma ọ bụ mpaghara ọchịchị ya.
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: ọ zara ha sị
  rationale: Usoro Igbo a na-asụkarị na-eburu ma ‘zara’ ma ‘kwuo’ n’otu ahịrịokwu, na-enweghị ịdị arọ na-ekwekọghị n’asụsụ Igbo.
- source_word: Οὐκ ἔρχεται
  choice: adịghị abịa
  rationale: Present negative a na-egosipụta okwu zuru ụwa ọnụ banyere ụzọ alaeze ahụ si abịa, ọ bụghị naanị otu ihe na-eme ugbu a.
- source_word: μετὰ παρατηρήσεως
  choice: n’ụzọ a pụrụ iji nlezianya hụ ya
  rationale: παρατήρησις nwere ike ịpụta ile anya, nlekiri anya, ma ọ bụ nlezianya nyochaa. Nhọrọ a na-echekwa echiche nke ihe a pụrụ ịhụ ma soro site na nlekiri anya, n’etinyeghị ‘ihe ịrịba ama’ nke na-adịghị apụta kpọmkwem n’okwu Grik.
theological_decisions:
- issue: Ihe Jizọs na-agọnahụ banyere ọbịbịa alaeze Chineke
  choice: Ọ naghị abịa n’ụzọ ndị mmadụ pụrụ iji nlezianya leba anya hụ ma ọ bụ soro ya dịka ihe a na-enyocha anya.
  alternative: Ọ naghị abịa site n’ihe ịrịba ama ndị a pụrụ ịhụ; ma ọ bụ na mmadụ apụghị ịhụ ya ma ọlị.
  rationale: Ntụgharị ahụ na-edobe nghọta sara mbara nke παρατήρησις—nlekiri, ile anya, ma ọ bụ nyocha anya—na-ekwughị na ama ọdịnihu niile adịghị, ma ọ bụ na a pụghị ịghọta alaeze ahụ n’ụzọ ọ bụla.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma doo ndị nkịtị anya. E ji ‘alaeze Chineke’ mee ka okwu Agba Ọhụrụ a maara nke ọma dịgide. E tinyere akara nkọwa ala peeji [a] ozugbo n’akụkụ ahịrịokwu ọ na-akọwa.
