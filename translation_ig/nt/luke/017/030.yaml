id: LUK.17.30
reference: Luke 17:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: ig
  text: Ọ ga-adị otú ahụ n’ụbọchị a ga-ekpughe Nwa nke Mmadụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “N’otu aka ahụ” ma ọ bụ “N’otu ụzọ ahụ.” Akpaalaokwu Grik a na-atụ aka n’ihe atụ ndị e kwuru tupu nke a.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: Ọ ga-adị otú ahụ
  rationale: Akpaalaokwu a na-atụ aka n’ihe atụ ndị bu ya ụzọ ma na-egosi na ihe ahụ ga-adị n’otu ụzọ ahụ. Nsụgharị a bụ Igbo dị mfe ma na-echekwa ma ntụnyere ahụ ma echiche ọdịnihu dị na ἔσται.
- source_word: ἔσται
  choice: ga-adị
  rationale: Nke a na-egosipụta ọdịnihu nke ngwaa εἰμί n’ụzọ doro anya ma bụrụkwa okwu Igbo a na-asụ taa.
- source_word: ᾗ ἡμέρᾳ
  choice: n’ụbọchị
  rationale: Dative a na-arụ ọrụ oge, ya bụ, ‘n’ụbọchị mgbe.’ N’Igbo, njikọ ya na nkebiokwu na-esochi emeela ka ‘n’ụbọchị’ zuo oke ma bụrụ ihe e ji ekwu okwu n’ụzọ ebumpụta ụwa.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: E debere aha a Jizọs ji akọwa onwe ya n’Oziọma ndị ahụ, ka njikọ ya na Daniel 7 na ụda amụma banyere ọgwụgwụ oge ghara ifu.
- source_word: ἀποκαλύπτεται
  choice: a ga-ekpughe
  rationale: ‘Ikpughe’ na-echekwa echiche nke iwepụ ihe kpuchiri mmadụ ka a hụ ya ma mata ya n’ihu ọha. Ọdịnihu e ji sụgharịa ya n’Igbo sitere n’ụbọchị ọdịnihu nke ahịrịokwu ahụ, ma a gbanweghị ya ka ọ bụrụ naanị ‘ọbịbịa.’
theological_decisions:
- issue: Nsụgharị aha ὁ υἱὸς τοῦ ἀνθρώπου nke metụtara ọgwụgwụ oge
  choice: Nwa nke Mmadụ
  alternative: Onye ahụ bụ mmadụ
  rationale: ‘Nwa nke Mmadụ’ na-echekwa aha pụrụ iche a maara n’Oziọma nakwa njikọ ya na Daniel 7; nhọrọ ọzọ ga-eme ka njikọ Mesaịa na ọgwụgwụ oge ghara ịpụta nke ọma.
- issue: Ihe ἀποκαλύπτεται pụtara n’ebe a
  choice: a ga-ekpughe
  alternative: ga-abịa / ga-apụta
  rationale: Ngwaa Grik ahụ pụtara ikpughe ma ọ bụ ime ka a hụ ihe zoro ezo. Ọ bụ ezie na ọnọdụ a metụtara ọbịbịa Nwa nke Mmadụ, ‘ga-abịa’ ga-etinye echiche ngwaa ọzọ na-adịghị kpọmkwem n’okwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ọ ga-adị otú ahụ’ na-ejikọta amaokwu a nke ọma na ihe atụ banyere oge Noa na Lọt ndị bu ya ụzọ, ebe ‘a ga-ekpughe’ na-egosi ngosipụta Nwa nke Mmadụ n’ihu ọha n’enweghị itinye nkọwa ụka pụrụ iche.
