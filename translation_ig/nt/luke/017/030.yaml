  terminology: ‘Nwa nke Mmadụ’ is the established and appropriate Igbo rendering of the Gospel title. ‘ekpughe’ accurately retains the semantic focus on revelation. The footnote offers legitimate alternatives for the opening Greek idiom and correctly explains its backward reference.
