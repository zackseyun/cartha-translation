  source_fidelity: ‘Ọ ga-adị otú ahụ’ faithfully conveys the comparative idiom κατὰ τὰ αὐτά together with the future ἔσται. ‘n’ụbọchị a ga-ekpughe’ appropriately renders the temporal clause ᾗ ἡμέρᾳ, and ‘a ga-ekpughe Nwa nke Mmadụ’ preserves the revelation/unveiling sense and passive force of ἀποκαλύπτεται without substituting ‘come’ or ‘appear.’
