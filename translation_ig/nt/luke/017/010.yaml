revisions:
- from: Unu onwe unu kwa, mgbe unu mechara ihe niile e nyere unu n’iwu, sịnụ, “Anyị bụ ndị ohu na-abaghị uru[a]; anyị emeela ihe dịịrị anyị ime[b].”
  to: Otu a ka unu kwa, mgbe unu mechara ihe niile e nyere unu iwu ka unu mee, sịnụ, “Anyị bụ ndị ohu na-abaghị uru[a]; anyị emeela ihe dịịrị anyị ime[b].”
  rationale: The revision supplies the omitted comparative/applicational force of οὕτως while preserving the draft’s accurate handling of command, obligation, and the social force of δοῦλοι. It also makes the command clause and the duty alternative more idiomatic in modern Standard Igbo.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:34Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the completion of all commanded tasks, the imperative response, the slave/master image, and the concluding statement of obligation. However, «Unu onwe unu kwa» renders καὶ ὑμεῖς but leaves οὕτως (‘thus/in the same way’) unexpressed. The revision restores this explicit link to the preceding illustration.
  naturalness: The revised wording is idiomatic Standard Igbo. “Otu a ka unu kwa” naturally carries the applicational ‘so also you,’ and “e nyere unu iwu ka unu mee” clearly expresses what they were commanded to do. The alternative wording in footnote b is adjusted to a more natural Igbo expression of duty.
  terminology: “Ndị ohu” appropriately preserves δοῦλοι in this master–slave analogy. “Na-abaghị uru” retains the primary lexical sense of ἀχρεῖοι; its contextual implication that obedience gives no special claim to reward is helpfully retained in the note without forcing a doctrinal interpretation into the main text.
  issues:
  - severity: medium
    issue: The inferential adverb οὕτως is omitted.
    rationale: “Unu onwe unu kwa” means ‘you yourselves also,’ but does not express ‘thus/in the same way,’ which explicitly applies the preceding illustration to the hearers.
  - severity: low
    issue: Footnote b’s alternative is somewhat unnatural idiomatically.
    rationale: “Ihe anyị ji ụgwọ ime” can be understood, but “ihe anyị kwesịrị ime” is clearer and more usual for ‘what we ought/were obligated to do.’
  revised_text: Otu a ka unu kwa, mgbe unu mechara ihe niile e nyere unu iwu ka unu mee, sịnụ, “Anyị bụ ndị ohu na-abaghị uru[a]; anyị emeela ihe dịịrị anyị ime[b].”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị ohu na-erughị eru,” ma ọ bụ, “ndị ohu na-enweghị ihe ha ga-eji rịọ ụgwọ ọrụ.” Okwu Grik ahụ nwere ike ịpụta ndị na-adịghị eweta uru, ma ọ bụ ndị na-enweghị ikike ịsị na e kwesịrị inye ha ụgwọ ọrụ pụrụ iche.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe anyị kwesịrị ime.”
    reason: lexical_alternative
  revision_rationale: The revision supplies the omitted comparative/applicational force of οὕτως while preserving the draft’s accurate handling of command, obligation, and the social force of δοῦλοι. It also makes the command clause and the duty alternative more idiomatic in modern Standard Igbo.
