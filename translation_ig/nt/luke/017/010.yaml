id: LUK.17.10
reference: Luke 17:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: ig
  text: Otu a ka unu kwa, mgbe unu mechara ihe niile e nyere unu iwu ka unu mee, sịnụ, “Anyị bụ ndị ohu na-abaghị uru[a]; anyị emeela ihe dịịrị anyị ime[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị ohu na-erughị eru,” ma ọ bụ, “ndị ohu na-enweghị ihe ha ga-eji rịọ ụgwọ ọrụ.” Okwu Grik ahụ nwere ike ịpụta ndị na-adịghị eweta uru, ma ọ bụ ndị na-enweghị ikike ịsị na e kwesịrị inye ha ụgwọ ọrụ pụrụ iche.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe anyị kwesịrị ime.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: Unu onwe unu kwa
  rationale: Nke a na-ejikọta ihe Jizọs na-agwa ndị na-eso ụzọ ya na ihe atụ gara aga, ma na-emesi ‘unu’ ike dịka Grik si eme.
- source_word: ὅταν ποιήσητε
  choice: mgbe unu mechara
  rationale: Ụdị a na-egosi na e mechala omume ahụ tupu ha ekwu okwu a nyere n’iwu.
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: ihe niile e nyere unu n’iwu
  rationale: Ọ na-echekwa ike ọchịchị dị na διατάσσω, kama iji okwu dị nro nke pụtara nanị ọrụ e kenyere mmadụ.
- source_word: λέγετε
  choice: sịnụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ; ‘sịnụ’ bụ ụzọ Igbo dị nkenke ma kwekọọ n’ọnọdụ a.
- source_word: Δοῦλοι
  choice: ndị ohu
  rationale: N’ihe atụ gbara amaokwu a gburugburu, ọnọdụ onye nwe na ohu pụtara ìhè; ‘ndị ohu’ na-echekwa ike okwu ahụ karịa ‘ndị na-eje ozi.’
- source_word: ἀχρεῖοί
  choice: na-abaghị uru
  rationale: Nke a na-echekwa isi nghọta nkịtị nke okwu Grik ahụ, bụ enweghị uru ma ọ bụ enweghị ihe ga-eme ka mmadụ kwuo na e kwesịrị inye ya ụgwọ ọrụ. Ihe odide ala na-egosi nkọwa ndị ọzọ iji zere imechi nghọta okwu ahụ n’otu ụzọ.
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: ihe dịịrị anyị ime
  rationale: Nke a bụ Igbo ebumpụta ụwa nke na-egosi ọrụ ma ọ bụ ibu ọrụ mmadụ kwesịrị ịrụ, dịka ὀφείλω si kwuo.
- source_word: πεποιήκαμεν
  choice: anyị emeela
  rationale: Ụdị ngwaa a na-egosi omume e mechara nke ihe ọ pụtara ka dị ugbu a; ‘emeela’ na-egosipụta nke ahụ n’Igbo.
theological_decisions:
- issue: Otú e si sụgharịta δοῦλοι n’ihe atụ banyere ndị na-eso ụzọ
  choice: ndị ohu
  alternative: ndị na-eje ozi
  rationale: Ihe atụ ahụ dabeere n’ọnọdụ onye nwe na ohu. Nhọrọ a na-echekwa ịdị n’okpuru ikike na ike okwu Jizọs ji akụzi ịdị umeala n’obi.
- issue: Ihe ἀχρεῖοι pụtara
  choice: na-abaghị uru
  alternative: na-erughị eru; ndị na-enweghị ihe ha ga-eji rịọ ụgwọ ọrụ
  rationale: Okwu Grik ahụ nwere ike ịpụta ndị na-abaghị uru, mana n’ọnọdụ a o nwekwara ike imesi ike na irube isi adịghị enye ndị na-eso ụzọ ikike ịsị na onye nwe ha ji ha ụgwọ. E debere okwu siri ike n’isi ederede ma kọwaa obosara nghọta ya n’ihe odide ala.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘E nyere unu n’iwu’ na-echekwa ụda iwu; ‘ndị ohu’ na-echekwa mmekọrịta onye nwe na ohu dị n’ihe atụ ahụ. E debere akara ihe odide ala [a] na [b] ozugbo n’ebe okwu ha na-akọwa dị.
