id: LUK.17.24
reference: Luke 17:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: ig
  text: N’ihi na, dị nnọọ ka àmụ̀mà na-egbu site n’otu akụkụ n’okpuru eluigwe ruo n’akụkụ nke ọzọ n’okpuru eluigwe[a], ma na-enwu, otu ahụ ka Nwa nke Mmadụ ga-adị n’ụbọchị ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ikwu ya n’ụzọ Igbo na-adị mfe karị, “site n’otu nsọtụ mbara igwe ruo na nke ọzọ.” Grik kwughachiri okwu pụtara “n’okpuru eluigwe” n’akụkụ abụọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’oge ya.” Okwu a na-ezo aka n’oge e jikọtara ya na Nwa nke Mmadụ, ma ọ kọwaghị kpọmkwem ihe ga-eme n’oge ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: N’ihi na, dị nnọọ ka
  rationale: Ọ na-edobe ma nkọwa γάρ na ntụnyere siri ike nke ὥσπερ n’ụzọ Igbo na-ada nke ọma.
- source_word: ἀστραπὴ
  choice: àmụ̀mà
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa lightning, ya bụ ìhè mberede a na-ahụ n’eluigwe.
- source_word: ἀστράπτουσα
  choice: mgbe ọ na-egbu
  rationale: Ọ na-egosipụta omume àmụ̀mà ahụ ka ọ na-eme, ma na-ahapụkwa λάμπει ka e jiri okwu ọzọ sụgharịa ya.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν ... εἰς τὴν ὑπ’ οὐρανόν
  choice: site n’otu akụkụ dị n’okpuru eluigwe ruo n’akụkụ nke ọzọ dị n’okpuru eluigwe
  rationale: Ọ na-edobe nkwughachi ‘n’okpuru eluigwe’ dị na Grik ma mee ka ntụgharị ahụ doo onye na-agụ Igbo anya.
- source_word: λάμπει
  choice: si enwu
  rationale: Ọ na-ekewapụ ngwaa a na ἀστράπτουσα, ka e wee chekwaa ngwaa abụọ metụtara ibe ha ma na-abụghị otu.
- source_word: οὕτως ἔσται
  choice: otu ahụ ka ... ga-adị
  rationale: Ọ na-edobe usoro ntụnyere ahụ na ọdịnihu n’Igbo doro anya.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Nwa nke Mmadụ
  rationale: Ọ bụ nsụgharị doro anya nke aha Jizọs ji kpọọ onwe ya, na-enweghị ịkọwakwu ihe aha ahụ pụtara.
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: n’ụbọchị ya
  rationale: Ọ na-edobe ma ‘ụbọchị’ ma nnọchiaha nwe ‘ya,’ na-akọwaghị kpọmkwem ihe ga-eme n’ụbọchị ahụ.
theological_decisions:
- issue: Ihe ‘Nwa nke Mmadụ ... n’ụbọchị ya’ pụtara n’okwu banyere ihe ndị ga-eme n’ọdịnihu
  choice: n’ụbọchị ya
  alternative: mgbe ọ ga-abịa; n’ụbọchị ikpe
  rationale: Grik kwuru naanị ‘n’ụbọchị ya.’ Ịgbakwunye ọbịbịa ya ma ọ bụ ikpe ga-eme ka nsụgharị ahụ kwuo ihe kpọmkwem karịa ihe ederede ahụ kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. E chekwara nkwughachi ‘n’okpuru eluigwe’ na ọdịiche dị n’etiti àmụ̀mà ‘na-egbu’ na ya ‘na-enwu,’ n’agbanyeghị na nke a na-eme ka ahịrịokwu ahụ nwee ntakịrị usoro pụrụ iche.
