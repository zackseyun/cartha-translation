revisions:
- from: N’ihi na, dị nnọọ ka àmụ̀mà, mgbe ọ na-egbu site n’otu akụkụ dị n’okpuru eluigwe ruo n’akụkụ nke ọzọ dị n’okpuru eluigwe[a], si enwu, otu ahụ ka Nwa nke Mmadụ ga-adị n’ụbọchị ya[b].
  to: N’ihi na, dị nnọọ ka àmụ̀mà na-egbu site n’otu akụkụ n’okpuru eluigwe ruo n’akụkụ nke ọzọ n’okpuru eluigwe[a], ma na-enwu, otu ahụ ka Nwa nke Mmadụ ga-adị n’ụbọchị ya[b].
  rationale: The revision smooths the Igbo syntax, retains both Greek verbs with distinct but natural wording, preserves the repeated “n’okpuru eluigwe,” and leaves the eschatological expression unexpanded. Footnote b is corrected to offer a genuine Igbo alternative rather than the unidiomatic “n’ime ụbọchị ya.”
