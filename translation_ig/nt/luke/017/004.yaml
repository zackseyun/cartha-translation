id: LUK.17.4
reference: Luke 17:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: ig
  text: Ọ bụrụkwa na o mehie gị ugboro asaa n’otu ụbọchị, ugboro asaakwa ọ laghachikwute gị[a] na-asị, “Ana m echegharị,” ị ga-agbaghara ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ tụgharịa bịakwute gị.” Okwu Grik ahụ nwere ike ịpụta ma ịlaghachi ma ịtụgharị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ị ghaghị ịgbaghara ya.” Grik ji ọdịdị future mee ihe, ma n’ebe a ọ nwere ike nke iwu.
    reason: grammatical_force
lexical_decisions:
- source_word: ἑπτάκις τῆς ἡμέρας
  choice: ugboro asaa n’otu ụbọchị
  rationale: Nke a na-egosipụta ugboro asaa n’ime otu ụbọchị n’Igbo dị mfe ma bụrụkwa nke sitere n’ụzọ Grik si egosi oge ihe mere n’ime ya.
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: o mehie gị
  rationale: N’Igbo, ‘ime mmadụ ihe ọjọọ/imehie mmadụ’ na-egosi mmehie e mere megide onye ahụ; ‘o mehie gị’ dị nkenke ma doo anya.
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: ọ laghachikwute gị
  rationale: ἐπιστρέφω nwere ike ịpụta ịlaghachi ma ọ bụ ịtụgharị. N’ebe a, ‘laghachikwute gị’ na-egosipụta ịbịakwute onye ahụ ọzọ mgbe mmehie gasịrị.
- source_word: λέγων
  choice: na-asị
  rationale: Nke a na-edobe njikọ participle nke Grik ma na-ada nke ọma n’Igbo.
- source_word: Μετανοῶ
  choice: Ana m echegharị
  rationale: Nke a na-edobe ọdịdị present nke Grik na echiche nke nchegharị, kama ime ka ọ bụrụ naanị mwute ma ọ bụ ịrịọ mgbaghara.
- source_word: ἀφήσεις αὐτῷ
  choice: ị ga-agbaghara ya
  rationale: Ọdịdị future nke Grik nwere ike nke iwu n’ọnọdụ nkuzi a. ‘Ị ga-agbaghara ya’ na-edobe ma ọdịdị ahụ ma ibu ọrụ e nyere onye a na-agwa okwu.
theological_decisions:
- issue: Ike ἀφήσεις dị ka future indicative
  choice: ị ga-agbaghara ya
  alternative: gbaghara ya; ị ghaghị ịgbaghara ya
  rationale: N’ọnọdụ a, future indicative na-arụ ọrụ dịka iwu. Nsụgharị a na-edobe ọdịdị ahịrịokwu ahụ n’enweghị ịgbanwe ya ka ọ bụrụ amụma nkịtị ma ọ bụ itinyekwu ike karịa nke ederede.
- issue: Ihe Μετανοῶ pụtara
  choice: Ana m echegharị
  alternative: Ọ na-ewute m; Echegharịala m
  rationale: Ederede ahụ kwuru nchegharị, ọ bụghị naanị mwute. Nhọrọ a na-edobekwa present tense nke okwu Grik, ọ bụ ezie na n’Igbo a pụkwara ikwu ya dịka ihe emechara eme.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. ‘Laghachikwute gị’ na ‘ị ga-agbaghara ya’ bụ okwu nkịtị ma doo anya; e debere nghọta abụọ dị na ἐπιστρέψῃ na ike iwu nke ἀφήσεις n’ala peeji.
