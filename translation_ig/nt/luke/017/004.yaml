  source_fidelity: 'The draft accurately represents the conditional sequence and repeated actions in the Greek: sinning against the addressee seven times within a day, returning seven times, declaring repentance, and the directive to forgive. “O mehie gị” appropriately conveys ἁμαρτήσῃ εἰς σέ, and “ọ laghachikwute gị” is a valid contextual rendering of ἐπιστρέψῃ πρὸς σέ. “Ana m echegharị” retains the present-form repentance declaration without reducing it to mere regret.'
