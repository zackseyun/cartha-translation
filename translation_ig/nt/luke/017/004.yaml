  terminology: “Echegharị” appropriately conveys μετάνοια/μετανοέω in this context, and “gbaghara” is the standard, natural term for forgiveness. The rendering “ị ga-agbaghara ya” suitably reflects the Greek future indicative with directive force while avoiding unnecessary doctrinal amplification.
