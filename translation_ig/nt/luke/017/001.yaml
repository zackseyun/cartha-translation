review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the narrative connection, Jesus' disciples, the impossibility of the non-arrival of σκάνδαλα, and the warning directed at the singular person through whom they come. The plural reference is retained appropriately. A small clarification of the final pronoun is advisable so that it unambiguously refers to the stumbling-causing things rather than to people.
  naturalness: 'The main sentence is generally clear Standard Igbo. Repeating the antecedent as “ihe ndị ahụ” in the final clause is more natural and avoids a potentially unclear bare “ha.” The footnote needs a semantic correction: “daa n’omume ọma” can suggest falling in good conduct, whereas the intended sense is moral or spiritual downfall.'
  terminology: “Ihe ndị na-eme ka mmadụ sụọ ngọngọ” retains the metaphor and does not prematurely restrict σκάνδαλα to offense, temptation, or sin. “Ahụhụ dịrị” is an acceptable elevated rendering of οὐαί in this warning context. The alternatives in the note remain suitable when the explanatory wording is corrected.
  issues:
  - severity: low
    issue: The pronoun “ha” in “onye ha si n’aka ya abịa” lacks an explicit noun antecedent in the final clause.
    rationale: Although context can supply “ihe ndị,” explicitly restating it better reflects τὰ σκάνδαλα and prevents the pronoun from being read as referring to persons.
  - severity: medium
    issue: The footnote says σκάνδαλα can make someone “daa n’omume ọma.”
    rationale: 'This wording is semantically misleading: the Greek concerns moral or spiritual stumbling/downfall, not falling in good conduct. The explanation should use “daa n’omume” or explicitly mention falling into sin.'
  revised_text: Mgbe ahụ, ọ gwara ndị na-eso ụzọ ya, sị, “Ọ gaghị ekwe omume ka ihe ndị na-eme ka mmadụ sụọ ngọngọ[a] ghara ịbịa; ma ahụhụ dịrị onye ihe ndị ahụ si n’aka ya abịa!”
