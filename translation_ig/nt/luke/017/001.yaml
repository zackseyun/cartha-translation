id: LUK.17.1
reference: Luke 17:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: ig
  text: Mgbe ahụ, ọ gwara ndị na-eso ụzọ ya, sị, “Ọ gaghị ekwe omume ka ihe ndị na-eme ka mmadụ sụọ ngọngọ[a] ghara ịbịa; ma ahụhụ dịrị onye ihe ndị ahụ si n’aka ya abịa!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “mmejọ,” “ihe ndị na-eduba mmadụ ná mmehie,” ma ọ bụ “ọnwụnwa ime mmehie.” Okwu Grik bụ σκάνδαλα na-ezo aka n’ihe ndị na-eme ka mmadụ daa n’omume ma ọ bụ n’ime mmụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Mgbe ahụ, ọ ... sị
  rationale: δέ bụ njikọ dị nro n’akụkọ a; “Mgbe ahụ” na-eme ka usoro akụkọ ahụ gaa nke ọma n’Igbo n’emeghị ka ọ bụrụ nnukwu ọdịiche.
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: ọ gwara ndị na-eso ụzọ ya
  rationale: “Ndị na-eso ụzọ” bụ okwu Igbo doro anya maka μαθηταί, ebe “ya” na-anọchi αὐτοῦ nke dị n’ihe odide Grik.
- source_word: Ἀνένδεκτόν ἐστιν
  choice: Ọ gaghị ekwe omume
  rationale: Nke a na-edobe ụdị nkwupụta Grik nke na-ekwu na enweghị ike izere ọbịbịa ihe ndị ahụ.
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: ka ihe ndị na-eme ka mmadụ sụọ ngọngọ ghara ịbịa
  rationale: Usoro a na-egosi kpọmkwem na ihe na-agaghị ekwe omume bụ na σκάνδαλα agaghị abịa.
- source_word: σκάνδαλα
  choice: ihe ndị na-eme ka mmadụ sụọ ngọngọ
  rationale: Nhọrọ a na-edobe ihe atụ nke ihe na-eme ka mmadụ sụọ ngọngọ, ma na-ahapụkwa obosara echiche ya banyere iduba mmadụ ná mmehie ma ọ bụ ọdịda ime mmụọ.
- source_word: πλὴν οὐαὶ
  choice: ma ahụhụ dịrị
  rationale: “Ma” na-egosi ntụgharị site n’ihe a na-apụghị izere ezere gaa n’ikpe siri ike; “ahụhụ dịrị” bụ ụzọ Igbo dị nsọ ma doo anya isi kwuo οὐαί.
- source_word: δι’ οὗ
  choice: onye ha si n’aka ya
  rationale: Nke a na-edobe onye otu ahụ e kwuru okwu banyere ya ma na-egosi na ihe ndị ahụ na-abịa site n’aka onye ahụ.
- source_word: ἔρχεται
  choice: ha ... abịa
  rationale: Ọ bụ ezie na ngwaa Grik dị n’otu, ọ na-ezo aka n’echiche ahụ bụ σκάνδαλα; nnọchiaha “ha” dabara n’Igbo maka ọtụtụ ihe ndị e kwuru.
theological_decisions:
- issue: Ihe σκάνδαλα pụtara n’ozizi gbasara omume
  choice: ihe ndị na-eme ka mmadụ sụọ ngọngọ
  alternative: mmejọ; ihe ndị na-eduba mmadụ ná mmehie; ọnwụnwa ime mmehie
  rationale: Nsụgharị a na-edobe ihe atụ Grik ma ghara ikpebi nanị otu akụkụ nke okwu ahụ, ma ọ bụ mkpasu iwe, ọnwụnwa, ọnyà, ma ọ bụ ihe na-eduba mmadụ n’ọdịda ime mmụọ.
- issue: Onye otu e ji δι’ οὗ gosipụta
  choice: onye ha si n’aka ya abịa
  alternative: nwoke ahụ ha si n’aka ya abịa; mmadụ ha si n’aka ya abịa
  rationale: “Onye” na-edobe onye otu a na-anọchite anya mmadụ ọ bụla, n’etinyeghị nkọwa nwoke kpọmkwem nke ihe odide ahụ anaghị achọ ka e mesie ike.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta mee ihe. A hapụrụ ihe atụ nke ịsụ ngọngọ ka obosara echiche Grik ghara ịla n’iyi; akara nkọwa ala peeji dị n’akụkụ okwu ọ na-akọwa.
