revisions:
- from: Mgbe ahụ, ọ gwara ndị na-eso ụzọ ya, sị, “Ọ gaghị ekwe omume ka ihe ndị na-eme ka mmadụ sụọ ngọngọ[a] ghara ịbịa; ma ahụhụ dịrị onye ha si n’aka ya abịa!”
  to: Mgbe ahụ, ọ gwara ndị na-eso ụzọ ya, sị, “Ọ gaghị ekwe omume ka ihe ndị na-eme ka mmadụ sụọ ngọngọ[a] ghara ịbịa; ma ahụhụ dịrị onye ihe ndị ahụ si n’aka ya abịa!”
  rationale: The revision preserves the source text's ambiguity and metaphor while making the final referent explicit in idiomatic Igbo. The footnote is corrected to describe moral or spiritual stumbling without the unintended implication that a person falls in good conduct.
