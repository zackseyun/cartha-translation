review_pass:
  verdict: revise
  source_fidelity: Isi ederede Grik Byzantine nwere naanị “abụọ” (na-enweghị ịkọwa nwoke ma ọ bụ nwanyị), “n’ubi,” na ọdịiche doro anya dị n’etiti onye a ga-akpọrọ na onye a ga-ahapụ. “Mmadụ abụọ” na-echekwa enweghị nkọwa okike ahụ. A chọrọ ka e megharịa nkebi nke abụọ ka passive abụọ ahụ pụta ìhè n’Igbo.
  naturalness: '“a ga-akpọrọ otu, hapụkwa onye nke ọzọ” adịghị edo anya nke ọma n’usoro ahịrịokwu: “hapụkwa” nwere ike ịdị ka ntụziaka ma ọ bụ ngwaa na-enweghị akara passive. “a ga-ahapụ onye nke ọzọ” bụ Igbo ọkọlọtọ doro anya ma na-edobe nhazi Grik ahụ.'
  terminology: “a ga-akpọrọ” dabara παραληφθήσεται n’enweghị ikpebi ma ọ bụ nzọpụta ma ọ bụ ikpe; “a ga-ahapụ” dabara ἀφεθήσεται. “onye nke ọzọ” na-egosi nke ọzọ n’ime mmadụ abụọ ahụ. Ihe odide ala peeji kwesịrị ikwu “nsụgharị Coptic oge mbụ” n’enweghị “ụfọdụ,” ebe audit trail anaghị amachi ya otú ahụ.
  issues:
  - severity: medium
    issue: Nhazi passive nke ngwaa nke abụọ adịghị akọwapụta nke ọma.
    rationale: Ederede Grik ji passive mee ngwaa abụọ ahụ (παραληφθήσεται / ἀφεθήσεται). Ịgbakwunye “a ga-” n’ihu “ahapụ” na-eme ka ọdịiche ahụ na onye na-anata omume doo anya n’Igbo.
  - severity: low
    issue: Ihe odide ala peeji tinyere “ụfọdụ” n’ihu nsụgharị Coptic.
    rationale: Nke a na-amachi nkwupụta English audit trail, nke kwuru naanị “early Coptic translations.” Iwepụ ya na-edobe nkọwa ahụ nke ọma.
  revised_text: Mmadụ abụọ[a] ga-anọ n’ubi; a ga-akpọrọ otu, a ga-ahapụ onye nke ọzọ.
