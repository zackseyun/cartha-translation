  text: Δύο ἔσονται ἐν τῷ ἀγρῷ· εἷς παραληφθήσεται, καὶ ὁ ἕτερος ἀφεθήσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/036.yaml
  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: ig
  text: Mmadụ abụọ[a] ga-anọ n’ubi; a ga-akpọrọ otu, a ga-ahapụ onye nke ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a adịghị n’ihe odide Grik ndị kasị ochie, gụnyere Codex Sinaiticus na Codex Vaticanus nke narị afọ nke anọ, nakwa na nsụgharị Coptic oge mbụ. Ma ọ dị n’ọdịnala ederede nke Ọdịda Anyanwụ, dịka Codex Bezae nke narị afọ nke ise, n’ọtụtụ ihe odide Byzantine, nakwa na Vulgate Latịn. O yikarịrị ka ndị odeakwụkwọ mechara tinye ya ka ọ kwekọọ na Matiu 24:40.
    reason: textual_critical
lexical_decisions:
- source_word: δύο
  choice: mmadụ abụọ
  rationale: Ọnụọgụ ahụ na-ezo aka n’ mmadụ abụọ n’enweghị ịkọwa okike ha; ‘mmadụ abụọ’ bụ Igbo doro anya ma kwekọọ n’isi mmalite.
- source_word: παραληφθήσεται
  choice: a ga-akpọrọ
  rationale: Ụdị ngwaa a na-egosi na a ga-akpọrọ onye ahụ gaa ma ọ bụ were ya sonyere ndị ọzọ; nhọrọ a na-echekwa ọdịiche ya na onye a hapụrụ, n’agbanyeghị na amaokwu ahụ ekwughị kpọmkwem ebe a kpọrọ ya gaa.
- source_word: ἀφεθήσεται
  choice: hapụkwa
  rationale: N’ebe a, ngwaa ahụ pụtara ịhapụ onye ahụ n’ebe ọ nọ, n’ụzọ megidere ịkpọrọ onye nke ọzọ.
- source_word: ὁ ἕτερος
  choice: onye nke ọzọ
  rationale: Nke a na-akọwa onye nke abụọ n’ime mmadụ abụọ ahụ e kwuru okwu ha.
theological_decisions:
- issue: Ihe ịkpọrọ otu onye na ịhapụ onye nke ọzọ pụtara n’ihe gbasara ọgwụgwụ oge
  choice: E kwughị ma onye a kpọrọ ọ bụ onye a zọpụtara ka ọ bụ onye e kpere ikpe.
  alternative: Ịkọwa ‘a ga-akpọrọ’ ozugbo dị ka nzọpụta ma ọ bụ ikpe.
  rationale: Asụsụ Grik nke amaokwu a na-ekwu naanị na a ga-akpọrọ otu ma hapụ onye nke ọzọ; ya mere ntụgharị ahụ anaghị edozi esemokwu nkọwa ahụ n’ime ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ùgwù. E ji ‘mmadụ abụọ’ zere itinye okike mmadụ ebe Grik kwuru naanị ‘abụọ’; ‘n’ubi’ bụ ụzọ nkịtị e si kwuo ἐν τῷ ἀγρῷ.
