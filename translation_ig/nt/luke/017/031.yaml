revisions:
- from: N’ụbọchị ahụ, onye ọ bụla nọ n’elu ụlọ[a], ebe ngwongwo ya dị n’ime ụlọ, ya agbatalakwa ịga were ha; otu aka ahụ, onye nọ n’ubi alaghachikwala azụ[b].
  to: N’ụbọchị ahụ, onye ọ bụla nọ n’elu ụlọ[a], ebe ngwongwo ya dị n’ime ụlọ, ka ọ ghara ịgbadata iburu ha; otu aka ahụ, onye nọ n’ubi ka ọ ghara ịlaghachi azụ[b].
  rationale: The revision replaces an unclear expression with a direct and natural rendering of the command not to descend in order to retrieve possessions. It also retains an idiomatic rendering of the second prohibition while preserving, in a carefully qualified footnote, the possible object-like nuance of εἰς τὰ ὀπίσω. The cultural footnote remains accurate and useful.
  reviewer_model: gpt-5.6-terra
