review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal setting, the accessible roof, the goods inside, and the paired urgent prohibitions. However, “ya agbatalakwa ịga were ha” does not naturally or clearly express καταβάτω (“go down/descend”) in Standard Igbo; it needs a clear form of “ịgbadata.” The final prohibition is best rendered idiomatically as not returning/turning back; the Greek expression εἰς τὰ ὀπίσω need not be forced into the main text as an object phrase.
  naturalness: Most of the verse is clear and appropriately formal. Recasting the first prohibition with “ka ọ ghara ịgbadata iburu ha” gives natural, unambiguous Standard Igbo. “ka ọ ghara ịlaghachi azụ” maintains the urgent parallelism without the slightly awkward/redundant “alaghachikwala azụ.”
  terminology: “N’elu ụlọ” is suitable for δῶμα when accompanied by the cultural note. “Ngwongwo ya” appropriately represents τὰ σκεύη αὐτοῦ. No doctrinally loaded terminology is introduced.
  issues:
  - severity: medium
    issue: “ya agbatalakwa ịga were ha” is unclear/nonstandard for descending from the roof.
    rationale: The source verb καταβάτω specifically means “go down/descend.” Using the transparent Standard Igbo verb “ịgbadata” preserves this concrete action and the prohibition’s urgency.
  - severity: low
    issue: The wording of footnote b overstates its proposed rendering as closely matching the Greek.
    rationale: εἰς τὰ ὀπίσω is idiomatically “back/behind,” and “n’ihe ndị dị n’azụ” is a possible explicating rendering, not a necessary or strictly literal one. The note should present it as an alternative without overstating precision.
  revised_text: N’ụbọchị ahụ, onye ọ bụla nọ n’elu ụlọ[a], ebe ngwongwo ya dị n’ime ụlọ, ka ọ ghara ịgbadata iburu ha; otu aka ahụ, onye nọ n’ubi ka ọ ghara ịlaghachi azụ[b].
  revised_footnotes:
