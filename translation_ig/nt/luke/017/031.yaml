id: LUK.17.31
reference: Luke 17:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: ig
  text: N’ụbọchị ahụ, onye ọ bụla nọ n’elu ụlọ[a], ebe ngwongwo ya dị n’ime ụlọ, ka ọ ghara ịgbadata iburu ha; otu aka ahụ, onye nọ n’ubi ka ọ ghara ịlaghachi azụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Elu ụlọ” a bụ elu ụlọ dị larịị, nke ndị mmadụ n’oge ahụ na-arịgoro ma na-eji eme ihe.
    reason: cultural_note
  - marker: b
    text: 'Okwu Grik ahụ nwekwara ike igosi: “ka ọ ghara ịlaghachi n’ihe ndị dị n’azụ,” ya bụ, n’ihe a hapụrụ n’azụ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: N’ụbọchị ahụ
  rationale: Ọ bụ ụzọ Igbo dị mfe ma doo anya isi kwuo oge ahụ, ma na-edebekwa nrụgide dị na okwu ngosi ἐκείνῃ.
- source_word: ὃς ἔσται
  choice: onye ọ bụla nọ
  rationale: Nke a na-egosi onye ọbụla ọnọdụ ahụ ga-adakwasị, n’ebughị amụma ọdịnihu ahụ ụzọ karịa ka okwu Grik si chọọ.
- source_word: ἐπὶ τοῦ δώματος
  choice: n’elu ụlọ
  rationale: N’ọnọdụ omenala a, δώμα bụ elu ụlọ dị larịị nke mmadụ pụrụ ịnọ n’elu ya; ‘n’elu ụlọ’ bụ okwu Igbo nkịtị, ebe nkọwa ala peeji na-eme ka ọdịdị ya doo anya.
- source_word: τὰ σκεύη αὐτοῦ
  choice: ngwongwo ya
  rationale: Ngwongwo na-ekpuchi ihe mmadụ nwere n’ụlọ nke a pụrụ iburu, n’enweghị ime ka ọ bụrụ naanị otu ụdị arịa.
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: ya agbatalakwa ịga were ha
  rationale: 'Usoro a na-ebupụta iwu mgbochi nke onye nke atọ ma na-edebe omume abụọ ahụ: isi n’elu gbadata na ịga were ngwongwo ahụ.'
- source_word: ὁ ἐν ἀγρῷ ὁμοίως
  choice: otu aka ahụ, onye nọ n’ubi
  rationale: Nke a na-edebe njikọ na myirịta doro anya dị n’etiti iwu abụọ ahụ.
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: alaghachikwala azụ
  rationale: Nke a bụ ụzọ Igbo dị ndụ isi kwuo ịtụgharị laghachi n’ebe a hapụrụ, ebe nkọwa ala peeji na-echekwa ọdịdị sara mbara nke okwu Grik ahụ.
theological_decisions:
- issue: Ọsọ na mkpa dị n’ihe oyiyi banyere ụbọchị ahụ
  choice: 'E debere iwu ndị a dịka omume a na-ahụ anya: onye ahụ agaghị agbadata were ngwongwo ya, onye nọ n’ubi agaghịkwa alaghachi azụ.'
  alternative: Ịkọwa ya naanị dịka ndụmọdụ izugbe ka mmadụ ghara ịhụ ihe onwunwe n’anya.
  rationale: Okwu Grik na-enye ọnọdụ na iwu doro anya. Idebe ihe oyiyi ahụ na-egbochi itinye ozizi sara mbara nke amaokwu a n’onwe ya ekwughị kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ya agbatalakwa’ na-ebupụta iwu mgbochi nke onye nke atọ; ‘alaghachikwala azụ’ bụ okwu Igbo ebumpụta ụwa, ebe nkọwa [b] na-echekwa ọdịdị okwu Grik na obere nghọtahie o nwere.
