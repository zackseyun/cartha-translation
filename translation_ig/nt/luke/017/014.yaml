    rationale: Okwu “Iwu ka…” adịghị eke n’Igbo; kwa, isi Greek na-eji καθαρίζω, nke metụtara ịdị ọcha ma n’ahụ ma n’usoro ofufe. Imezi ya na-akọwa ihe ndị nchụàjà ga-enyocha n’enweghị ịgbanwe ihe amaokwu ahụ pụtara.
