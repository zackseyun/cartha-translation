  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: ig
  text: Mgbe ọ hụrụ ha, ọ sịrị ha, “Gaanụ gosi ndị nchụàjà[a] onwe unu.” Ka ha na-aga, e mere ka ha dị ọcha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Iwu ahụ chọrọ ka ndị a sachara n’ọrịa akpụkpọ ahụ gosi ndị nchụàjà onwe ha ka ha nyochaa ha; lee Levitikọs 14.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsị, “a sachara ha.” Ngwaa Grik ahụ nwere ike ịpụta ime ka mmadụ dị ọcha ma n’ahụ ma n’usoro ofufe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: Mgbe ọ hụrụ ha
  rationale: A tụgharịrị aorist participle ahụ ka ọ bụrụ ahịrịokwu na-egosi oge, nke bụ ụzọ Igbo si ekwu ya nke ọma; e tinyere “ha” site n’ihe gbara okwu ahụ gburugburu.
- source_word: Πορευθέντες
  choice: Gaanụ
  rationale: Participle a na-arụ ọrụ dị ka iwu jikọtara ya na ἐπιδείξατε; “Gaanụ gosi…” na-edobe iwu ahụ na usoro omume ya n’Igbo eke.
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: gosi … onwe unu
  rationale: Nke a na-egosi na ha ga-eme ka ndị nchụàjà nyochaa ha; okwu a doro anya ma bụrụ nke ndị Igbo nke oge a na-aghọta.
- source_word: ἱερεῦσιν
  choice: ndị nchụàjà
  rationale: Ọ na-ezo aka ná ndị nchụàjà ga-enyocha ma kwupụta ịdị ọcha ha dịka Iwu si dị.
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: Ka ha na-aga
  rationale: Nrụpụta okwu Grik a na-egosi na ihe ahụ mere mgbe njem ha ka na-aga; nsụgharị a dị mkpirikpi ma bụrụ Igbo eke.
- source_word: ἐκαθαρίσθησαν
  choice: e mere ka ha dị ọcha
  rationale: A hapụrụ ya n’ụdị nnara-eme ma chekwaa ma echiche mgbake nke ahụ ma nke ịdị ọcha n’usoro ofufe, kama iji naanị “a gwọrọ ha.”
theological_decisions:
- issue: Okwu gbasara ime ka mmadụ dị ọcha n’ọnọdụ ọrịa akpụkpọ ahụ
  choice: e mere ka ha dị ọcha
  alternative: a gwọrọ ha
  rationale: 'καθαρίζω karịrị naanị ọgwụgwọ anụ ahụ: n’ọnọdụ a, ọ gụnyekwara iweghachi mmadụ n’ọnọdụ ịdị ọcha nke ndị nchụàjà ga-amata. Nsụgharị a anaghị ehichapụ njikọ ahụ.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị nchụàjà” na “e mere ka ha dị ọcha” na-edobe ọdịnala na echiche okpukpe dị n’akwụkwọ mbụ n’enweghị ịkwado nkọwa otu ụka.
