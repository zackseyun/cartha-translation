  terminology: “Ndị nchụàjà” dabara maka ἱερεῦσιν. “E mere ka ha dị ọcha” na-echekwa ihe gbasara ịdị ọcha n’ahụ na n’usoro ofufe, na-enweghị itinye nkọwa ozizi. Nkọwa ala peeji a kwesịrị iji “a sachara” kama “a gwọrọ” ka ọ ghara ime ka echiche ahụ bụrụ naanị ọgwụgwọ.
  issues:
