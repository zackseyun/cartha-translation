id: LUK.17.8
reference: Luke 17:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: ig
  text: Kama nke ahụ[a], ọ̀ gaghị asị ya, ‘Kwadebe m nri anyasị, kechie uwe gị n’úkwù, jeere m ozi ruo mgbe m richara ma ṅụchaa[b]; mgbe nke ahụ gasịrị, gị onwe gị ga-eri ma ṅụọ’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ma ọ̀ gaghị.” Okwu Grik a na-egosi ihe megidere ihe e kwuru tupu ya, n’ajụjụ a na-atụ anya azịza ee.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ruo mgbe m ga-eri ma ṅụọ.” Okwu Grik ahụ nwere ike ịpụta otú ahụ kpọmkwem; “richara ma ṅụchaa” na-eme ka o doo anya na ọ ga-ebu ụzọ mechaa tupu onye nke ọzọ erie ma ṅụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: Kama nke ahụ, ọ̀ gaghị
  rationale: Na-egosipụta ntụgharị megide ihe e kwuru tupu ya ma debe ajụjụ a na-atụ anya azịza ee.
- source_word: ἐρεῖ αὐτῷ
  choice: asị ya
  rationale: Na-edebe ngwaa bụ isi ‘ịsị’ na onye a na-agwa okwu n'ụzọ doro anya.
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: Kwadebere m nri anyasị
  rationale: Na-enye echiche nke ịkwadebe ihe onye nwe ya ga-eri dị ka nri mgbede, n'Igbo dị mfe ma kwekọọ n'ọnọdụ ahụ.
- source_word: περιζωσάμενος
  choice: kee uwe gị n'úkwù
  rationale: Na-edebe ihe oyiyi omenala nke ikekọta uwe n'úkwù iji kwadebe maka ọrụ, kama iwepụ ya kpamkpam.
- source_word: διακόνει μοι
  choice: jeere m ozi
  rationale: N'ọnọdụ a ọ pụtara ijere onye ahụ ozi, karịchaa n'ihe metụtara nri; okwu a anaghị etinye echiche ụka n'ime ya.
- source_word: ἕως φάγω καὶ πίω
  choice: ruo mgbe m richara ma ṅụchaa
  rationale: Ụdị a na-egosi na iri na ịṅụ nke onye nwe ya ga-ebu ụzọ gwụ tupu oge onye nke ọzọ eruo.
- source_word: μετὰ ταῦτα
  choice: mgbe nke ahụ gasịrị
  rationale: Ọ bụ ntụgharị oge doro anya na nke mmadụ na-asụ kwa ụbọchị.
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: gị onwe gị ga-eri ma ṅụọ
  rationale: Na-edebe ọdịnihu nke ngwaa ndị ahụ nakwa nkwusi ike nke nnọchiaha σύ.
theological_decisions:
- issue: Aha ọnọdụ mmekọrịta mmadụ n'ilu a
  choice: E tinyebeghị ‘ohu’ ma ọ bụ ‘onye na-eje ozi’ n'amaokwu a; e debere nnọchiaha na iwu ndị dị na Grik.
  alternative: Ịgbakwunye ‘ohu ahụ’ ma ọ bụ ‘onye na-eje ozi ahụ’ iji mee onye a na-ekwu maka ya ka o doo anya.
  rationale: Ọ bụ ezie na amaokwu gbara ya gburugburu kpọrọ δοῦλος, amaokwu a n'onwe ya ejighị aha ahụ. Nke a na-ezere itinye okwu na-adịghị n'ahịrị Grik ma ka na-eme ka mmekọrịta onye nwe na onye na-eje ozi pụta ìhè site n'iwu ndị ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘kee uwe gị n'úkwù’ debe ihe oyiyi omenala dị n'okwu Grik; e tinyere akara ụdaume ebe ha dị mkpa maka nghọta, ma e zere asụsụ ụka pụrụ iche.
