  to: Kama nke ahụ[a], ọ̀ gaghị asị ya, ‘Kwadebe m nri anyasị, kechie uwe gị n’úkwù, jeere m ozi ruo mgbe m richara ma ṅụchaa[b]; mgbe nke ahụ gasịrị, gị onwe gị ga-eri ma ṅụọ’?”
