review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the adversative rhetorical question, the commands to prepare a meal and provide table service, the completed meal before the other person's turn, and the emphatic future in the final clause. However, “Kwadebere” is not the appropriate imperative form for the Greek aorist imperative Ἑτοίμασον; “Kwadebe” is required.
  naturalness: The overall wording is clear Standard Igbo. “Kechie uwe gị n’úkwù” is a more natural and precise idiom than “kee uwe gị n’úkwù” for securing one’s garment at the waist in readiness for work.
  terminology: “Nri anyasị” suitably renders the meal denoted by δείπνησον in this setting, without importing a social-role noun absent from this verse. “Jeere m ozi” appropriately conveys table service here. The explicit “gị onwe gị” reasonably represents the emphasis of σύ.
  issues:
  - severity: medium
    issue: “Kwadebere” is used where an imperative is required.
    rationale: Ἑτοίμασον is an aorist imperative, commanding the addressee to prepare the meal. Standard Igbo requires “Kwadebe,” not “Kwadebere,” in this direct command.
  - severity: low
    issue: “kee uwe gị n’úkwù” is less idiomatic for the action of girding oneself.
    rationale: “Kechie uwe gị n’úkwù” clearly conveys tying up or securing one’s garment for service and retains the concrete cultural image of περιζωσάμενος.
  revised_text: Kama nke ahụ[a], ọ̀ gaghị asị ya, ‘Kwadebe m nri anyasị, kechie uwe gị n’úkwù, jeere m ozi ruo mgbe m richara ma ṅụchaa[b]; mgbe nke ahụ gasịrị, gị onwe gị ga-eri ma ṅụọ’?”
