revisions:
- from: O wee daa kpudo ihu n’ala n’ụkwụ ya, na-ekele ya. Ma ya onwe ya bụ onye Sameria.
  to: O wee daa n’ala n’ihu ụkwụ ya, tinye ihu ya n’ala, na-ekele ya. Ọ bụkwa onye Sameria.
  rationale: The revision explicitly preserves the two components of the Greek posture—falling and being face-down—while using “n’ihu ụkwụ ya” for the location at/before Jesus’ feet. It retains the concurrent thanksgiving and the understated but emphasized Samaritan identification without adding interpretive explanation.
  reviewer_model: gpt-5.6-terra
