  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: ig
  text: O wee daa n’ala n’ihu ụkwụ ya, tinye ihu ya n’ala, na-ekele ya. Ọ bụkwa onye Sameria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν
  choice: daa
  rationale: Oge gara aga nke πίπτω pụtara n'ụzọ nkịtị ‘daa’; okwu ndị gbara ya gburugburu na-egosi na ọ bụ ịkpọ isiala, ya mere ọ dịghị mkpa ịgbasa ngwaa ahụ.
- source_word: ἐπὶ πρόσωπον
  choice: kpudo ihu n’ala
  rationale: Nke a na-egosi ọnọdụ ịkpọ isiala, ihu chere ala. Okwu Igbo a bụ nke doro anya ma na-echekwa ihe ahụ anya hụrụ.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: n’ụkwụ ya
  rationale: N’ọnọdụ nsọpụrụ a, nke a bụ ụzọ Igbo dị mfe e si kwuo na ọ dara n’ihu ya n’akụkụ ụkwụ ya.
- source_word: εὐχαριστῶν αὐτῷ
  choice: na-ekele ya
  rationale: Ụdị participle dị ugbu a na-egosi ihe ọ nọ na-eme n’otu oge ahụ; ‘na-ekele ya’ bụ Igbo eke ma na-edobe na ekele ahụ bụụrụ ya.
- source_word: Σαμαρίτης
  choice: onye Sameria
  rationale: Nke a bụ aha njirimara agbụrụ na okpukpe ahụ, ma ọ dị mkpa n’akụkọ Luk; ‘onye Sameria’ bụ ụdị Igbo a na-aghọta nke ọma.
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: Ma ya onwe ya bụ onye Sameria
  rationale: ‘Ya onwe ya’ na-egosipụta nkwusi ike dị na αὐτός, ebe ‘Ma’ na-eme ka njirimara ya dị ịtụnanya pụta ìhè n’enweghị nkọwa agbakwunyere.
theological_decisions:
- issue: Nkwusi ike akụkọ ahụ n’ihe gbasara onye nwoke ahụ bụ
  choice: Ma ya onwe ya bụ onye Sameria
  alternative: Ọ bụkwa onye Sameria
  rationale: A na-edobe nkwupụta ahụ dị mfe ma na-egosipụta nkwusi ike nke αὐτός. Nke a na-ahapụ ịdị arọ nke mmekọrịta ọha na eze na nke okpukpe dị n’aha ‘onye Sameria’ ka akụkọ ahụ n’onwe ya gosipụta ya, n’enweghị itinye nkọwa n’amaokwu ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Daa kpudo ihu n’ala’ na-enye ihe omume ahụ n’ụzọ eke ma na-echekwa ọnọdụ ịkpọ isiala; ahịrịokwu ikpeazụ dị nkenke iji nọgide na-enwe ike akụkọ ahụ.
