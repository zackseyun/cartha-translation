    reason: lexical_alternative
  - marker: b
    text: Okwu ahụ bụ “a ga-akpọrọ” anaghị ekpebi n'onwe ya ma ọ bụ maka nzọpụta ka ọ bụ maka ikpe; Grik hapụrụ ka ihe ndị gbara amaokwu a gburugburu nyere aka n'ịghọta ya.
    reason: alternative_reading
