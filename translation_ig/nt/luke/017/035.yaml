revisions:
- from: Ụmụ nwanyị abụọ ga-anọkọ na-egwe ihe[a]; a ga-akpọrọ otu, ma a ga-ahapụ nke ọzọ.[b]
  to: Ụmụ nwanyị abụọ ga-adị na-egwe ihe ọnụ[a]; a ga-akpọrọ otu[b], ma a ga-ahapụ nke ọzọ.
  rationale: The revision uses the idiomatic Standard Igbo expression “na-egwe ihe ọnụ” for the women grinding together while retaining the legitimate alternative “n'otu ebe” in the note. It also places the interpretive note immediately after the expression it explains. No theological outcome is imposed on either passive verb.
