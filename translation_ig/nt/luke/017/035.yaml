  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: ig
  text: Ụmụ nwanyị abụọ ga-adị na-egwe ihe ọnụ[a]; a ga-akpọrọ otu[b], ma a ga-ahapụ nke ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'otu ebe.” Okwu Grik a nwere ike ịpụta “ọnụ” ma ọ bụ “n'otu ebe.”
    reason: lexical_alternative
  - marker: b
    text: Okwu ahụ bụ “a ga-akpọrọ” anaghị ekpebi n'onwe ya ma ọ bụ maka nzọpụta ka ọ bụ maka ikpe; Grik hapụrụ ka ihe ndị gbara amaokwu a gburugburu nyere aka n'ịghọta ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο
  choice: Ụmụ nwanyị abụọ ga-anọ
  rationale: Okwu ọdịnihu a na-egosi ọnọdụ ga-adị; ụdị nwanyị nke ἀλήθουσαι mere ka e kwuo ‘ụmụ nwanyị’ n'ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe.
- source_word: ἀλήθουσαι
  choice: na-egwe ihe
  rationale: Ọ na-ezo aka n'ọrụ igwe ihe, nke na-abụkarị mkpụrụ ọka; ‘ihe’ na-eme ka okwu ahụ bụrụ nke eke n'Igbo n'etinyeghị ihe isi mmalite ekwughị kpọmkwem.
- source_word: ἐπὶ τὸ αὐτό
  choice: ọnọkọ
  rationale: Ọ na-enye echiche nke ịnọkọ ọnụ ma ọ bụ ịnọ n'otu ebe; ‘ọnọkọ’ dabara n'ọnọdụ ọrụ a ma debe ohere nkọwa nke abụọ na ndetu.
- source_word: ἡ μία παραλημφθήσεται
  choice: a ga-akpọrọ otu
  rationale: Ụdị nnara a na-egosi na a ga-ewere otu onye soro, ma ọ naghị ekpebi n'onwe ya ma nke ahụ bụ maka nzọpụta ka ọ bụ ikpe.
- source_word: ἡ δὲ ἑτέρα ἀφεθήσεται
  choice: ma a ga-ahapụ nke ọzọ
  rationale: ‘Ma’ na-egosi ọdịiche δέ, ebe ‘a ga-ahapụ’ na-asụgharị ụdị nnara nke ἀφίημι n'etinyeghị echiche ọzọ dịka ịgbahapụ kpamkpam.
theological_decisions:
- issue: Ma ịkpọrọ otu onye na ịhapụ onye nke ọzọ na-egosi nzọpụta ma ọ bụ ikpe.
  choice: A ga-akpọrọ otu, ma a ga-ahapụ nke ọzọ.
  alternative: A ga-akpọrọ otu gaa na nzọpụta, ma hapụ nke ọzọ maka ikpe; ma ọ bụ, a ga-akpọrọ otu gaa n'ikpe, hapụkwa nke ọzọ.
  rationale: Amaokwu ahụ n'onwe ya na-ekwu naanị banyere ikewapụ mmadụ abụọ ahụ; ọ naghị akọwa n'ụzọ doro anya ihe ga-eme onye a kpọrọ ma ọ bụ onye a hapụrụ. Ya mere, nsụgharị ahụ na-edebe esemokwu nkọwa ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ugwu. E ji ‘na-egwe ihe’ mee ka ọrụ ahụ doo anya n'ụzọ eke; e zere itinye ‘ọka’ n'ihi na isi mmalite ekwughị ya kpọmkwem. A debere nghọta abụọ nke ἐπὶ τὸ αὐτό na παραλημφθήσεται na ndetu.
