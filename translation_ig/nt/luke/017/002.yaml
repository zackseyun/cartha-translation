id: LUK.17.2
reference: Luke 17:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: ig
  text: Ọ ga-akara ya mma ma a kegide nkume igwe nri[a] n’olu ya ma a tụba ya n’oké osimiri, karịa ka o mee ka otu n’ime ndị nta a sụọ ngọngọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnukwu nkume igwe nri.” Okwu Grik ahụ pụrụ izo aka ná nkume igwe nri buru ibu, nke dị arọ karịa.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mee ka otu n’ime ndị nta a daba ná mmehie.” Ngwaa Grik ahụ gụnyere echiche ime ka mmadụ daba ná mmehie ma ọ bụ ná mbibi ime mmụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: Ọ ga-akara ya mma
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi na otu ihe ga-akaara mmadụ mma karịa ihe ọzọ, ma na-echekwa ike ntụnyere dị n’okwu Grik.
- source_word: λίθος μυλικὸς
  choice: nkume igwe nri
  rationale: Nke a bụ aha Igbo doro anya maka nkume e ji egwe ihe; e debere echiche na ọ pụrụ ịbụ nkume buru ibu n’ala peeji.
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: e kegidere ... n’olu ya
  rationale: Ọ na-egosi ọnọdụ nkume ahụ gbara olu ya gburugburu n’ụzọ Igbo na-aghọta nke ọma, ma na-echekwa olu nnara-eme nke okwu Grik.
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: tụba ya n’oké osimiri
  rationale: ‘Tụba’ na-egosi ịkwanye mmadụ n’ike, ebe ‘oké osimiri’ bụ ntụgharị kwụ ọtọ ma dị ndụ nke θάλασσα.
- source_word: σκανδαλίσῃ
  choice: mee ka ... sụọ ngọngọ
  rationale: Nke a na-echekwa ihe atụ nke ime ka mmadụ daa, n’ebughị ụzọ mechie ma ọ bụ belata echiche ime ka ọ daba ná mmehie ma ọ bụ mbibi ime mmụọ.
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: otu n’ime ndị nta ndị a
  rationale: Nke a na-echekwa obosara okwu Grik, n’akọwaghị ha kpọmkwem dị ka ụmụaka ma ọ bụ naanị ndị kwere ekwe.
- source_word: ἢ ἵνα
  choice: karịa ka
  rationale: Ọ bụ njikọ Igbo kwesịrị ekwesị nke na-egosi ntụnyere n’etiti ihe ga-akara ya mma na ime ka onye nta sụọ ngọngọ.
theological_decisions:
- issue: Ndị okwu a kpọrọ ‘ndị nta ndị a’ bụ ndị ole?
  choice: E ji ‘ndị nta ndị a’ hapụ ndị a na-ekwu maka ha n’obosara ya.
  alternative: ụmụaka ndị a; ndị na-eso ụzọ ma ọ bụ ndị kwere ekwe dị umeala n’obi
  rationale: Okwu Grik ekwughị kpọmkwem na ha bụ naanị ụmụaka ma ọ bụ naanị ndị kwere ekwe. Ya mere, ntụgharị ahụ echekwala nghọta abụọ ahụ kama ikpebi otu n’ime ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ntụnyere siri ike na ihe atụ nke ‘ịsụ ngọngọ,’ ebe ala peeji na-akọwa echiche mmehie nke ngwaa Grik ahụ nwekwara.
