revisions:
- from: Ọ ga-akara ya mma ma ọ bụrụ na e kegidere nkume igwe nri[a] n’olu ya, ma tụba ya n’oké osimiri, karịa ka o mee ka otu n’ime ndị nta ndị a sụọ ngọngọ[b].
  to: Ọ ga-akara ya mma ma a kegide nkume igwe nri[a] n’olu ya ma a tụba ya n’oké osimiri, karịa ka o mee ka otu n’ime ndị nta a sụọ ngọngọ[b].
  rationale: The revision preserves the Greek comparison and its deliberately broad reference to “these little ones,” while making the two conditional actions grammatically parallel and natural in Standard Igbo. Footnote wording is also streamlined without adding interpretive claims.
