id: LUK.4.25
reference: Luke 4:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: ig
  text: Ma n’ezie, ana m asị unu, ọtụtụ ndị inyom di ha nwụrụ nọ n’Izrel n’oge Ịlaịja, mgbe e mechiri eluigwe ruo afọ atọ na ọnwa isii, oké ụnwụ wee daa n’ala ahụ dum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας
  choice: n’ezie
  rationale: Na-egosipụta nkwusi ike nke okwu Grik n'ụzọ dị nkenke ma bụrụkwa Igbo nkịtị.
- source_word: χῆραι
  choice: ụmụanyị di ha nwụrụ
  rationale: Nkọwa a doro onye Igbo nke oge a anya ma zere okwu nwere ike ịdị ochie ma ọ bụ ghara ịdị otu ebe niile.
- source_word: ἐκλείσθη ὁ οὐρανός
  choice: e mechiri eluigwe
  rationale: Na-edobe ihe atụ na usoro enweghị onye kpọmkwem mere ya dị n’asụsụ Grik.
- source_word: λιμὸς μέγας
  choice: oké ụnwụ
  rationale: Ọ bụ ụzọ ebumpụta ụwa e si akọ nnukwu ụkọ nri n’Igbo.
- source_word: πᾶσαν τὴν γῆν
  choice: ala ahụ niile
  rationale: N’ọnọdụ akụkọ a, γῆ na-ezo aka n’ala/ógbè ahụ dum; ‘ahụ’ na-edobe njikọ ya na Izrel n’ebughị echiche ụwa dum bata.
theological_decisions:
- issue: Onye mechiri eluigwe
  choice: E jiri usoro ‘e mechiri eluigwe’ na-akpọghị onye mere ya aha.
  alternative: Chineke mechiri eluigwe
  rationale: Grik jiri passive na-akpọghị onye mere ihe ahụ aha; ntụgharị ahụ ekwesịghị itinye ‘Chineke’ n’ederede n’agbanyeghị na ọnọdụ Akwụkwọ Nsọ nwere ike ime ka a ghọta ya otú ahụ.
- issue: Ókè ‘ala ahụ niile’ pụtara
  choice: ala ahụ niile
  alternative: ụwa niile
  rationale: γῆ nwere ike ịpụta ala, ógbè, ma ọ bụ ụwa; ebe a, ọnọdụ ahụ na-akwado ala ahụ dum ma na-ezere ịkọwa ya dịka ụwa niile n’enweghị mkpa.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu ahụ nso n’isi mmalite Grik, ma gbanwee ya ntakịrị ka ọ na-aga nke ọma n’Igbo.
