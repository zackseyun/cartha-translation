  to: Ma n’ezie, ana m asị unu, ọtụtụ ndị inyom di ha nwụrụ nọ n’Izrel n’oge Ịlaịja, mgbe e mechiri eluigwe ruo afọ atọ na ọnwa isii, oké ụnwụ wee daa n’ala ahụ dum.
