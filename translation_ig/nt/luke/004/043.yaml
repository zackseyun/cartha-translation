id: LUK.4.43
reference: Luke 4:43
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: ig
  text: Ma ọ sịrị ha, “Aghaghị m ịkpọsakwa[a] ozi ọma banyere alaeze Chineke n’obodo ndị ọzọ, n’ihi na ọ bụ maka nke a ka e zitere m[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwusa ozi ọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’ihi na ọ bụ maka nzube a ka e zitere m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: Ma ọ sịrị ha
  rationale: “Ma” na-egosipụta ntakịrị ntụgharị ma ọ bụ ọdịiche nke δέ n’ọnọdụ a; “ọ sịrị ha” bụ ụzọ Igbo dị mfe ma kwesị ntụkwasị obi isi kwuo εἶπεν πρὸς αὐτούς.
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: obodo ndị ọzọ ... -kwara
  rationale: “Obodo ndị ọzọ” na-egosipụta ebe ndị ọzọ karịa ebe ahụ; mgbakwụnye “-kwara” na ngwaa na-eburu echiche mgbakwunye nke καί n’ụzọ Igbo ebumpụta ụwa.
- source_word: εὐαγγελίσασθαί
  choice: ịkpọsa ... ozi ọma
  rationale: εὐαγγελίζω pụtara iweta ma ọ bụ ịkpọsa ozi ọma. “Ịkpọsa ozi ọma” na-edobe ọrụ ngwaa ahụ n’asụsụ Igbo doro anya, na-enweghị ime ya ka ọ bụrụ naanị okwu ụka pụrụ iche.
- source_word: δεῖ
  choice: Aghaghị m
  rationale: “Aghaghị m” na-egosipụta mkpa siri ike nke δεῖ, gụnyere ịdị mkpa metụtara ozi e nyere Jizọs, ma ọ naghị akọwa onye mere ka ọ dị mkpa karịa ihe amaokwu ahụ kwuru.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: ozi ọma banyere alaeze Chineke
  rationale: “Alaeze Chineke” na-edobe ahịrịokwu Luku dị mkpa. “Banyere” na-eme ka njikọ ya na ozi ọma doo anya n’Igbo, ma ọ naghị amachi ma alaeze ahụ bụ ọchịchị Chineke ma ọ bụ ógbè ọchịchị ya.
- source_word: ἐπὶ τοῦτο
  choice: maka nke a
  rationale: Nkebiokwu a na-egosipụta nzube ma ọ bụ ebumnuche. “Maka nke a” dị mfe ma na-edobe nkenke nke okwu Grik ahụ.
- source_word: ἀπεστάλην
  choice: e zitere m
  rationale: Nke a na-edobe ụdị nnara nke ngwaa Grik na echiche nke ozi e nyere ya, n’akọwaghị onye zitere ya n’ahịrịokwu bụ isi.
theological_decisions:
- issue: Ike nke nkwupụta Jizọs banyere ozi ya
  choice: Amaokwu ahụ na-egosi na ọ dị mkpa ka Jizọs kpọsaa ozi ọma banyere alaeze Chineke n’obodo dị iche iche, nakwa na e zitere ya maka nzube a.
  alternative: A pụrụ ịkọwa mkpa ahụ kpọmkwem dị ka iwu sitere n’aka Chineke, ma kọwaa Chineke n’ahịrịokwu bụ isi dị ka onye zitere ya.
  rationale: δεῖ na ἀπεστάλην na-egosi mkpa metụtara ozi sitere n’elu, ma ihe odide ahụ akpọghị onye zitere ya aha. Nsụgharị ahụ na-edobe ma ịdị mkpa ahụ ma ụdị nnara ahụ n’etinyeghị nkọwa karịrị ihe e dere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. Nhazi “ịkpọsakwara obodo ndị ọzọ ozi ọma” bụ nke Igbo ebumpụta ụwa ma na-edobe obodo ndị ọzọ dị ka ndị a na-ewegara ozi ahụ. Akara nkọwa [a] na [b] dị n’ahịrịokwu bụ isi n’ebe ha metụtara.
