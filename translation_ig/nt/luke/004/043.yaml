- from: Ma ọ sịrị ha, “Aghaghị m ịkpọsakwara obodo ndị ọzọ ozi ọma banyere alaeze Chineke[a], n’ihi na ọ bụ maka nke a ka e zitere m[b].”
  to: Ma ọ sịrị ha, “Aghaghị m ịkpọsakwa[a] ozi ọma banyere alaeze Chineke n’obodo ndị ọzọ, n’ihi na ọ bụ maka nke a ka e zitere m[b].”
  rationale: The revision retains every source-level element and its ambiguity, while placing the other cities as the sphere of the proclamation in natural Igbo. It also relocates and narrows footnote [a] so that its anchor and content clearly correspond to εὐαγγελίσασθαι. Footnote [b] remains tied to ἐπὶ τοῦτο ἀπεστάλην and preserves the passive without naming the sender.
