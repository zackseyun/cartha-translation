review_pass:
  verdict: revise
  source_fidelity: A safe correction is needed. ποίησον is a singular aorist imperative addressed to Jesus, not a plural imperative addressed to the crowd. The draft’s “meenụ” therefore changes the grammatical addressee. The reported deeds are appropriately left unspecified, and “na Kapanaum” correctly conveys the contextual locative force of εἰς.
  naturalness: The corrected singular “mee” is natural Standard Igbo. “Ihe ndị anyị nụrụ na e mere” avoids forcing an agent into the passive report and works idiomatically with the following imperative. “N’obodo gị” suitably renders πατρίς here as Jesus’ home town/native place.
  terminology: “ilu” is appropriate for παραβολή as a proverbial saying, and “Dọkịta, gwọọ onwe gị” is clear contemporary Standard Igbo. “Kapanaum” is retained consistently. The footnote is recast so that its proposed literal alternative is grammatical Igbo and accurately explains εἰς without implying that its directional meaning is the contextual translation.
  issues:
  - severity: high
    issue: “meenụ” is plural, whereas ποίησον is singular.
    rationale: 'Jesus predicts what the people will say to him: they command him, singular, to do in his hometown what was reported in Capernaum. The plural imperative shifts the command to a group and must be corrected.'
  - severity: medium
    issue: The footnote’s quoted alternative, “ihe ndị anyị nụrụ mere gaa/n’ime Kapanaum,” is not natural or grammatically coherent Igbo.
    rationale: It does not provide a usable lexical alternative and muddles the prepositional issue. A footnote should state the directional/basic sense of εἰς while noting that the context calls for a locative rendering.
  revised_text: 'Ọ sịrị ha, “N’ezie, unu ga-asị m ilu a: ‘Dọkịta, gwọọ onwe gị.’ Ihe ndị anyị nụrụ na e mere na Kapanaum[a], mee kwa n’ebe a n’obodo gị.”'
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dị nso karị n’okwu Grik, “ihe ndị anyị nụrụ mere n’ime Kapanaum.” Okwu Grik bụ εἰς, nke pụtara n’isi “gaa” ma ọ bụ “ba n’ime”; ma n’ebe a, ihe ọ pụtara bụ ebe ihe ndị ahụ mere.
    reason: lexical_alternative
  revision_rationale: The revision changes the final imperative from plural to singular (“meenụ ha” → “mee”), preserving the singular address inherent in ποίησον. It also removes the unnecessary pronoun “ha,” since the object is already expressed by “Ihe ndị anyị nụrụ na e mere,” retains the broad reported-deeds sense, and replaces the malformed footnote alternative with clear Standard Igbo. No doctrinal or interpretive expansion has been introduced.
