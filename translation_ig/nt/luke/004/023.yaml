revisions:
- from: Ọ sịrị ha, “N’ezie, unu ga-agwa m ilu a, ‘Dọkịta, gwọọ onwe gị.’ Ihe niile anyị nụrụ na e mere na Kapanaum[a], meenụ ha n’ebe a kwa, n’obodo gị.”
  to: 'Ọ sịrị ha, “N’ezie, unu ga-asị m ilu a: ‘Dọkịta, gwọọ onwe gị.’ Ihe ndị anyị nụrụ na e mere na Kapanaum[a], mee kwa n’ebe a n’obodo gị.”'
  rationale: The revision changes the final imperative from plural to singular (“meenụ ha” → “mee”), preserving the singular address inherent in ποίησον. It also removes the unnecessary pronoun “ha,” since the object is already expressed by “Ihe ndị anyị nụrụ na e mere,” retains the broad reported-deeds sense, and replaces the malformed footnote alternative with clear Standard Igbo. No doctrinal or interpretive expansion has been introduced.
