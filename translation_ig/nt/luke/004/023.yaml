id: LUK.4.23
reference: Luke 4:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: ig
  text: 'Ọ sịrị ha, “N’ezie, unu ga-asị m ilu a: ‘Dọkịta, gwọọ onwe gị.’ Ihe ndị anyị nụrụ na e mere na Kapanaum[a], mee kwa n’ebe a n’obodo gị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ dị nso karị n’okwu Grik, “ihe ndị anyị nụrụ mere n’ime Kapanaum.” Okwu Grik bụ εἰς, nke pụtara n’isi “gaa” ma ọ bụ “ba n’ime”; ma n’ebe a, ihe ọ pụtara bụ ebe ihe ndị ahụ mere.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: N’ezie
  rationale: Na-egosipụta nkwenye siri ike Jizọs ji buru amụma ihe ha ga-agwa ya, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’ụdị okwu a.
- source_word: ἐρεῖτέ μοι
  choice: unu ga-agwa m
  rationale: E chekwara ọdịdị ngwaa nke na-ekwu ihe ga-eme n’ọdịnihu, ọ bụghị iwu ma ọ bụ naanị ihe nwere ike ime.
- source_word: παραβολὴν
  choice: ilu
  rationale: N’ebe a, okwu ahụ na-ezo aka n’okwu amamihe dị mkpirikpi a maara ama, ọ bụghị akụkọ ilu toro ogologo.
- source_word: Ἰατρέ
  choice: Dọkịta
  rationale: Ọ bụ okwu Igbo nke oge a ndị mmadụ na-aghọta nke ọma maka onye na-agwọ ọrịa; ọ na-ezere mgbagwoju anya okwu ‘dibịa’ nwere ike iweta.
- source_word: θεράπευσον σεαυτόν
  choice: gwọọ onwe gị
  rationale: Na-echekwa iwu kpọmkwem nke ilu ahụ ma na-ada nke ọma n’Igbo.
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: Ihe niile anyị nụrụ na e mere
  rationale: Na-egosipụta ihe ndị a kọrọ na ha mere n’enweghị ịkpọ onye mere ha aha; nke a na-adabara ihe ịrịba ama ndị a na-atụ anya ka Jizọs mee, ọ bụ ezie na okwu Grik nwekwara ike ịpụta ihe ndị mere.
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: na Kapanaum
  rationale: Ọ bụ ezie na εἰς na-apụtakarị ‘gaa/ba n’ime,’ n’usoro okwu a ọ na-arụ ọrụ igosi ebe ihe mere; ‘na Kapanaum’ bụ Igbo nkịtị.
- source_word: ποίησον καὶ ὧδε
  choice: meenụ ha n’ebe a kwa
  rationale: A sụgharịrị iwu ahụ n’ụdị ọtụtụ mmadụ n’ihi na Jizọs na-agwa ìgwè ahụ okwu; ‘kwa’ na-echekwa ike καί.
- source_word: ἐν τῇ πατρίδι σου
  choice: n’obodo gị
  rationale: N’ọnọdụ a πατρίς bụ obodo ma ọ bụ ebe mmadụ si, ya bụ Nazaret, ọ bụghị mba n’echiche nke oge a.
theological_decisions:
- issue: Ụdị παραβολή n’ebe a
  choice: ilu
  alternative: akụkọ ilu; okwu
  rationale: ‘Dọkịta, gwọọ onwe gị’ bụ okwu amamihe dị mkpirikpi a maara ama, ọ bụghị akụkọ e ji ihe atụ kụzie ihe. Nke a bụ mkpebi gbasara ihe okwu ahụ pụtara n’ọnọdụ a, ọ bụghị itinye ozizi otu ụka.
- issue: Ụdị ὅσα ἠκούσαμεν γενόμενα
  choice: Ihe niile anyị nụrụ na e mere
  alternative: Ihe niile anyị nụrụ na ha mere; ihe niile anyị nụrụ mere
  rationale: Nhọrọ a na-eme ka Igbo doo anya ma na-ahapụ onye mere ihe ndị ahụ n’aghaghị ịkpọ aha. Ọ na-ejigide njikọ ya na iwu ‘mee,’ ebe ihe odide Grik n’onwe ya na-ekwu n’ụzọ sara mbara banyere ihe ndị mere.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. ‘Dọkịta’ ka a họọrọ kama ‘dibịa’ iji zere echiche pụrụ iche banyere dibịa ọdịnala. E tinyere akara [a] ozugbo n’aha Kapanaum, ebe nkọwa ala peeji ahụ metụtara.
