  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: ig
  text: Ma ya onwe ya[a] gafere n’etiti ha, wee gawa n’ụzọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ma ya onwe ya, mgbe ọ na-agafe n’etiti ha, gara n’ihu.” Grik na-akọwa Jizọs ka ọ na-agafe n’etiti ìgwè mmadụ ahụ, ma ọ naghị ekwu otú nke a si mee.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: Nnọchiaha a pụtara ìhè ma nwee ntakịrị nkwusi ike. “Ya onwe ya” na-egosipụta nke a n’Igbo n’enweghị ịgbakwụnye ihe gbasara otú o si gbanahụ ha.
- source_word: δὲ
  choice: Ma
  rationale: δέ na-egosi ntụgharị nwere ọdịiche dị nro n’etiti nzube ọjọọ ìgwè mmadụ ahụ na ọpụpụ Jizọs n’enweghị mmerụ.
- source_word: διελθὼν
  choice: si ... gafee
  rationale: Ụdị ngwaa a na-egosi ngagharị site n’otu ebe gafee; usoro a bụ Igbo kwụ ọtọ ma na-edobe njikọ ya na ngwaa bụ isi.
- source_word: διὰ μέσου αὐτῶν
  choice: n'etiti ha
  rationale: Nkebiokwu a na-akọwa ịgafe n’etiti ìgwè ahụ. Ọ naghị ekwu otú nke a si mee.
- source_word: ἐπορεύετο
  choice: wee gawa n'ụzọ ya
  rationale: Imperfect a na-egosi ngagharị na-aga n’ihu. “Gawa n'ụzọ ya” na-enye echiche na ọ gara n’ihu pụọ n’ebe ahụ n’Igbo eke.
theological_decisions:
- issue: Ma amaokwu a ò kwesịrị igosi hoo haa na mgbapụ ahụ bụ ọrụ ebube
  choice: 'Okwu na-anọpụ iche: “si n''etiti ha gafee, wee gawa n''ụzọ ya”'
  alternative: Ịsị na o jiri ike karịrị mmadụ gafee ha
  rationale: Grik na-akọ naanị na Jizọs gafere n’etiti ìgwè mmadụ ahụ; ọ kọwaghị ụzọ nke a si mee. Nsụgharị ahụ ekwesịghị itinye nkọwa ọrụ ebube nke ederede ahụ na-ekwughị hoo haa.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị mfe ma nwee ugwu. E jidere nkwusi ike dị na αὐτός site na “ya onwe ya,” ebe okwu ndị ọzọ nọgidere bụrụ nkọwa na-anọpụ iche.
