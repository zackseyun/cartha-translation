source:
  edition: SBLGNT
  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: ig
  text: Mgbe anyanwụ na-ada[a], ndị niile nwere ndị na-arịa ụdị ọrịa dị iche iche kpọtara ha n’ebe ọ nọ; o wee bikwasị onye ọ bụla n’ime ha aka ya ma gwọọ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ka anyanwụ na-ada.” N’asụsụ Grik, usoro okwu a na-egosi oge ihe ndị a mere, mgbe anyanwụ nọ na-ada.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: Mgbe anyanwụ na-ada
  rationale: Nkebiokwu genitive absolute nke nwere present participle na-egosi oge ihe ndị a mere ka anyanwụ nọ na-ada; ntụgharị a na-edobe omume ahụ na-aga n’ihu n’Igbo nkịtị.
- source_word: ἅπαντες ὅσοι
  choice: ndị niile
  rationale: Ọ na-egosi mmadụ niile n’enweghị onye fọdụrụ, ma bụrụkwa okwu doro anya ma dị mfe n’Igbo.
- source_word: εἶχον ἀσθενοῦντας
  choice: nwere ndị ọrịa na-arịa ọrịa
  rationale: N’ebe a, εἶχον na-egosi ndị nwere ndị ọrịa n’ezinụlọ ha ma ọ bụ nlekọta ha; ahịrịokwu ahụ na-edobe mmekọrịta ahụ n’emeghị ka ọ bụrụ naanị ndị ọrịa bịara n’onwe ha.
- source_word: νόσοις ποικίλαις
  choice: ọrịa dị iche iche
  rationale: Ọ na-egosi ụdị ọrịa dịgasị iche iche, n’asụsụ Igbo dị mfe ma kwụ ọtọ.
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: kpọtaara ya ha
  rationale: ἄγω pụtara iduga ma ọ bụ ịkpọta; n’ọnọdụ ndị ọrịa a, ‘kpọtaara’ bụ okwu Igbo dabara adaba.
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: onye ọ bụla n’ime ha
  rationale: Ọ na-echekwa nkwusi ike nke okwu Grik ahụ na Jizọs lebara onye nke ọ bụla anya n’otu n’otu.
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: bikwasị ... aka ya abụọ
  rationale: Ọ bụ omume nkịtị nke ịtụkwasị aka abụọ n’ahụ mmadụ; ‘aka ya abụọ’ na-egosipụta plural χεῖρας n'ụzọ doro anya.
- source_word: ἐθεράπευεν
  choice: gwọọ ha
  rationale: Imperfect ahụ na-egosi omume a na-eme ugboro ugboro ka ọ na-elebara onye ọ bụla anya; ‘onye ọ bụla’ na usoro ahịrịokwu ahụ na-eburu nghọta a n’Igbo.
theological_decisions:
- issue: Ịsụgharị ịbikwasị aka
  choice: o wee bikwasị onye ọ bụla n’ime ha aka ya abụọ
  alternative: ọ nọ na-ebikwasị onye nke ọ bụla n’ime ha aka
  rationale: A na-edobe omume anụ ahụ Jizọs mere na nlebara anya ya nye onye ọ bụla, n’etinyeghị echiche sakrament ma ọ bụ usoro ụka nke oge mechara n’ihe ederede ahụ na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, sụgharịa ya. A họọrọ ‘Mgbe anyanwụ na-ada’ iji chekwaa akụkụ omume na-aga n’ihu nke Grik; e zere ịgbakwunye okwu mmeghe nke pụtara ‘ugbu a’ n’ihi na isi mmalite enweghị okwu oge dị otu ahụ.
