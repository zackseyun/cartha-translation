revisions:
- from: Mgbe anyanwụ na-ada[a], ndị niile nwere ndị ọrịa na-arịa ọrịa dị iche iche kpọtaara ya ha; o wee bikwasị onye ọ bụla n’ime ha aka ya abụọ ma gwọọ ha.
  to: Mgbe anyanwụ na-ada[a], ndị niile nwere ndị na-arịa ụdị ọrịa dị iche iche kpọtara ha n’ebe ọ nọ; o wee bikwasị onye ọ bụla n’ime ha aka ya ma gwọọ ha.
  rationale: The revision resolves the redundant sickness wording and replaces an unnatural object construction with clear, idiomatic Standard Igbo. It preserves the source’s ongoing temporal setting, the varied diseases, the movement of the sick persons to Jesus, and the repeated individual care conveyed by “onye ọ bụla n’ime ha.”
