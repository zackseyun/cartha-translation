review_pass:
  verdict: revise
  source_fidelity: The draft retains the temporal genitive absolute, the comprehensive force of “all who,” the relationship implied by having sick persons, the diversity of diseases, the bringing of the sick to Jesus, and his individual laying on of hands and healing. However, “ndị ọrịa na-arịa ọrịa” is needlessly repetitive, and “kpọtaara ya ha” is an unnatural and unclear rendering of “brought them to him.”
  naturalness: 'The proposed revision uses idiomatic Standard Igbo: “ndị na-arịa ụdị ọrịa dị iche iche” avoids the repetition of “ọrịa,” and “kpọtara ha n’ebe ọ nọ” clearly expresses movement to him. “Bikwasị ... aka ya” is a natural rendering of laying hands on someone, while the distributive phrase preserves the verse’s individual emphasis.'
  terminology: “Anyanwụ na-ada,” “ndị na-arịa ụdị ọrịa dị iche iche,” “bikwasị ... aka,” and “gwọọ” are clear, contemporary Standard Igbo terms appropriate to a dignified biblical register. The wording describes a concrete healing action and does not add sacramental implications.
  issues:
  - severity: medium
    issue: Redundant illness expression
    rationale: “ndị ọrịa na-arịa ọrịa dị iche iche” literally and awkwardly repeats illness terminology (“sick people suffering diseases”). The Greek means persons who were ill with various diseases; “ndị na-arịa ụdị ọrịa dị iche iche” expresses this naturally.
  - severity: medium
    issue: Unnatural and unclear object/order in “kpọtaara ya ha”
    rationale: This order is not idiomatic Standard Igbo and can obscure who was brought to whom. “kpọtara ha n’ebe ọ nọ” naturally and explicitly renders ἤγαγον αὐτοὺς πρὸς αὐτόν.
  revised_text: Mgbe anyanwụ na-ada[a], ndị niile nwere ndị na-arịa ụdị ọrịa dị iche iche kpọtara ha n’ebe ọ nọ; o wee bikwasị onye ọ bụla n’ime ha aka ya ma gwọọ ha.
  revised_footnotes:
