  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: ig
  text: Mgbe chi bọrọ, ọ pụrụ gaa n’ebe mmadụ na-ebighị[a]. Ìgwè mmadụ ahụ nọ na-achọ ya, ha bịakwutere ya, na-agbalịkwa igbochi ya ịhapụ ha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ebe dịpụrụ adịpụ” ma ọ bụ “n’ebe ọzara.” Okwu Grik ahụ na-akọwa ebe naanị ya dị ma ọ bụ ebe mmadụ na-ebighị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “na-achọ ijide ya ka ọ ghara ịla” ma ọ bụ “na-achọ ime ka ọ ghara ịhapụ ha.” Echiche ya bụ na ìgwè mmadụ ahụ chọrọ igbochi ya ịhapụ ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: Mgbe chi bọrọ
  rationale: Nke a na-egosi mgbanwe oge n’ụzọ Igbo na-ada nke ọma, ma na-echekwa echiche nke mgbe ụbọchị malitere.
- source_word: ἐξελθὼν ἐπορεύθη
  choice: ọ pụrụ gaa
  rationale: Okwu abụọ a na-egosi na o si ebe ahụ pụọ wee gaa ebe ọzọ; ntụgharị a na-echekwa usoro mmegharị ahụ n’Igbo na-enweghị ikwughachi okwu n’ụzọ na-adịghị eke.
- source_word: εἰς ἔρημον τόπον
  choice: n’ebe mmadụ na-ebighị
  rationale: ἔρημος na-akọwa ebe mmadụ na-ebighị ma ọ bụ ebe dịpụrụ adịpụ; ọ pụtaghị mgbe niile ala ịkpa kpọmkwem.
- source_word: οἱ ὄχλοι
  choice: Ìgwè mmadụ ahụ
  rationale: Nke a na-enye echiche nke ọtụtụ mmadụ gbakọtara, dịka ụdị ọtụtụ nke ὄχλος si dị.
- source_word: ἐπεζήτουν αὐτόν
  choice: nọ na-achọ ya
  rationale: Ụdị imperfect na-egosi omume na-aga n’ihu; “nọ na-achọ” na-egosipụta nke a nke ọma.
- source_word: ἦλθον ἕως αὐτοῦ
  choice: ha bịakwutere ya
  rationale: Nke a bụ ụzọ Igbo eke si kwuo na ha rutere ebe ọ nọ.
- source_word: κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: na-agbalịkwa igbochi ya ịhapụ ha
  rationale: κατέχω n’ebe a pụtara ijide azụ ma ọ bụ igbochi ọpụpụ; “na-agbalị” na-egosi mbọ na-aga n’ihu n’enweghị ikwubi na ha jidere ya n’ike.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dịkwa mfe nghọta. E ji “ebe mmadụ na-ebighị” zere ime ka ἔρημος bụrụ ala ịkpa kpọmkwem, ma e debere nkọwa ndị ọzọ n’okpuru amaokwu.
