  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: ig
  text: 'E nyefere ya akwụkwọ mpịakọta[a] nke onye amụma Aịzaya. Mgbe ọ gbasasịrị akwụkwọ mpịakọta ahụ, ọ chọtara ebe e dere, sị:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya “akwụkwọ.” Okwu Grik bụ βιβλίον nwere ike ịpụta ihe odide n'ozuzu ya, ma n'ọnọdụ ụlọ nzukọ a, o yikarịrị ka ọ bụ akwụkwọ mpịakọta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: E nyefere ya
  rationale: Okwu a bụ ngwaa n'ụdị nnara nke pụtara na e nyere ya ihe; “E nyefere ya” dabara n'omume inyefe onye ga-agụ ihe n'ụlọ nzukọ.
- source_word: βιβλίον
  choice: akwụkwọ mpịakọta
  rationale: N'ọnọdụ ụlọ nzukọ ndị Juu na narị afọ mbụ, okwu a yikarịrị ka ọ na-ezo aka n'akwụkwọ a na-apịakọta, ọ bụghị akwụkwọ e kere ibe dị ka nke oge a.
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: nke Aịzaya onye amụma
  rationale: Nke a na-egosi ma onye akwụkwọ ahụ bụ nke ya ma ọkwá Aịzaya dị ka onye amụma.
- source_word: ἀναπτύξας
  choice: Mgbe ọ gbasasịrị
  rationale: Ọ na-egosi omume mere tupu ngwaa bụ isi; “gbasasịrị” dabara n'ịtọsa akwụkwọ mpịakọta ka a gụọ ya.
- source_word: εὗρεν
  choice: ọ chọtara
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke na-adịghị atụkwasị echiche na ịchọta ebe ahụ siri ike.
- source_word: τόπον
  choice: ebe
  rationale: Ọ bụ ntụgharị nkịtị nke okwu Grik ahụ ma na-ezo anya n'ebe dị n'ime ihe e dere.
- source_word: οὗ ἦν γεγραμμένον
  choice: ebe e dere
  rationale: Nke a na-ebute ihe e hotara na-esote ma na-enye echiche nke ihe dịlarị n'akwụkwọ ahụ n'Igbo dị mfe ma dị ugwu.
theological_decisions: []
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. Ahịrịokwu abụọ ahụ na-egosipụta usoro omume dị na Grik: e buru ụzọ nyefee ya akwụkwọ mpịakọta ahụ, mgbe ahụ ọ gbasasịrị ya wee chọta ebe e dere ihe na-esote.'
