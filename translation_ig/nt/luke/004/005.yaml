id: LUK.4.5
reference: Luke 4:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: ig
  text: Ekwensu duuru ya gaa n’elu, wee gosi ya alaeze niile nke ụwa mmadụ bi[a] n’otu ntabi anya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke ụwa.” Okwu Grik ahụ na-apụtakarị ụwa mmadụ bi, ma n’ọnọdụ ụfọdụ ọ pụrụ izo aka kpọmkwem n’ụwa mepere emepe ma ọ bụ n’alaeze ukwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’otu ntabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν
  choice: O duuru ya rịgoro n’elu
  rationale: Nke a na-egosipụta omume iduru ya gaa n’elu, ma ọ naghị atụkwasị ‘ugwu’ nke Luk ekwughị.
- source_word: ἔδειξεν
  choice: gosi ya
  rationale: ‘Gosi’ bụ okwu Igbo nkịtị ma dabara n’omume nke ime ka mmadụ hụ ihe.
- source_word: πάσας τὰς βασιλείας
  choice: alaeze niile
  rationale: Ọtụtụ βασιλεία n’ebe a na-ezo aka n’alaeze ma ọ bụ ógbè ndị ọchịchị na-achị, ọ bụghị naanị echiche nkịtị banyere ọchịchị.
- source_word: τῆς οἰκουμένης
  choice: nke ụwa mmadụ bi
  rationale: Nke a na-echekwa nkọwa οἰκουμένη dị ka ụwa ndị mmadụ bi, na-enweghị imechi ya naanị n’Alaeze Ukwu Rom.
- source_word: ἐν στιγμῇ χρόνου
  choice: n’otu ntabi anya
  rationale: Akpaokwu a na-egosipụta oge dị nnọọ mkpụmkpụ n’Igbo dị ndụ ma doo anya.
theological_decisions:
- issue: Ụzọ Ekwensu si gosi Jizọs alaeze ndị ahụ
  choice: A kọwara naanị na o gosiri ya alaeze niile, n’akọwaghị ụzọ o si mee ya.
  alternative: Ịkọwa ya dị ka ọhụụ pụrụ iche ma ọ bụ ihe a hụrụ n’ezie site n’ebe dị elu.
  rationale: Grik ekwughị ma nke a bụ ọhụụ, ihe karịrị ike mmadụ, ma ọ bụ ile anya site n’ebe dị elu; ya mere, nsụgharị ahụ anaghị ekpebi ihe ederede ahụ na-ekpebighị.
translation_notes:
  register: Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E jighị ‘ugwu’ n’ihi na ọ dịghị n’ederede Luk. Akara ntụaka [a] dị n’ebe ọ na-akọwa akpaokwu oge.
