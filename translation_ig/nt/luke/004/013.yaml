- from: Mgbe ekwensu nwụchara ọnwụnwa niile[a], ọ hapụrụ ya ruo mgbe ohere ọzọ ga-adaba.
  to: Mgbe ekwensu nwụchara ọnwụnwa niile[a], ọ hapụrụ ya ruo oge kwesịrị ekwesị.
  rationale: The revision preserves the Greek προσωρινός/strategic nuance of καιρός as a suitable or opportune time without adding that a further opportunity will arise. The footnote retains the valid lexical alternative while making its contextual rationale precise.
