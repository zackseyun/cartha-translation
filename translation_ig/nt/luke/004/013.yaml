id: LUK.4.13
reference: Luke 4:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: ig
  text: Mgbe ekwensu nwụchara ọnwụnwa niile[a], ọ hapụrụ ya ruo oge kwesịrị ekwesị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnwale niile.” Okwu Grik a nwere ike ịpụta “ọnwụnwa” ma ọ bụ “nnwale”; n’akụkọ a, ebe ekwensu bụ onye na-anwa Jizọs, “ọnwụnwa” dabara nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: Mgbe ... nwụchara
  rationale: Aorist participle a na-egosi ihe ekwensu mezuru tupu o hapụ Jizọs; usoro a bụ Igbo nkịtị ma doo anya.
- source_word: πάντα πειρασμόν
  choice: ọnwụnwa niile
  rationale: Nke a na-egosi ọnwụnwa dị iche iche niile e kwuru n'akụkọ ahụ. πειρασμός nwekwara ike ịpụta nnwale, ya mere e debere nke ahụ n'ala peeji.
- source_word: ὁ διάβολος
  choice: ekwensu
  rationale: N'okwu Luk, nke a bụ aha onye iro ime mmụọ ahụ; “ekwensu” bụ okwu Igbo a na-ejikarị eme ihe.
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: ọ hapụrụ ya
  rationale: Nke a na-egosi na ekwensu si n'ebe Jizọs nọ pụọ; ọ bụ okwu doro anya ma dị n'Igbo ugbu a.
- source_word: ἄχρι καιροῦ
  choice: ruo mgbe ohere ọzọ ga-adaba
  rationale: καιρός ebe a abụghị naanị oge n'ozuzu, kama ọ bụ oge kwesịrị ekwesị ma ọ bụ ohere ga-adaba; “ọzọ” na-eme ka ọdịdị nwa oge nke ọpụpụ ahụ pụta ìhè n'ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Ihe πειρασμός pụtara n'ihe banyere ahụmahụ Jizọs
  choice: ọnwụnwa
  alternative: nnwale
  rationale: Ebe ọ bụ ekwensu na-eme ihe ndị a iji dọpụ Jizọs n'irubere Chineke isi, “ọnwụnwa” dabara nke ọma n'ahịrịokwu bụ isi. Ma okwu Grik ahụ nwekwara ike ịpụta “nnwale,” ya mere e chekwara nghọta ahụ n'ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji “mgbe ... nwụchara” mee ka njikọ oge nke participle Grik doo anya; e jighị okwu ụka pụrụ iche nke otu denomination.
