  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: ig
  text: “Ha! Gịnị ka anyị na gị nwekọrọ[a], Jizọs onye Nazaret?[b] Ị bịara ibibi anyị[c]? Amaara m onye ị bụ—Onye Nsọ nke Chineke[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “Gịnị dịịrị anyị na gị?” Ọ bụ akpaalaokwu na-egosi ịjụ mmekọrịta ma ọ bụ ngagharị iwe.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “Jizọs onye si Nazaret.”
    reason: alternative_reading
  - marker: c
    text: Ndị “anyị” na-ezo aka na ha akọwaghị kpọmkwem na Grik; ọ pụrụ ịbụ mmụọ ahụ na-ekwu n’ụzọ nnọchi anya maka onwe ya, ma ọ bụ maka ụwa mmụọ ọjọọ n’ụzọ sara mbara.
    reason: alternative_reading
  - marker: d
    text: A pụkwara ịsụgharị ya, “Onye Nsọ Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: Ehee!
  rationale: Mkpu mberede nke na-egosi ụjọ ma ọ bụ ngagharị iwe; ọ na-edobe ike mkpu ahụ n’etinyeghị nkọwa sara mbara dịka ‘Hapụ anyị!’
- source_word: τί ἡμῖν καὶ σοί
  choice: Gịnị ka anyị na gị nwekọrọ?
  rationale: Ọ bụ akpaalaokwu sitere n’ụzọ okwu ndị Sem, nke na-egosi ịjụ mmekọrịta ma ọ bụ ngagharị iwe; nsụgharị a bụ Igbo kwụ ọtọ ma na-edobe ọdịiche ahụ.
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: Jizọs onye Nazaret
  rationale: Ọ bụ okwu a na-akpọ mmadụ nke na-akọwa Jizọs site n’obodo Nazaret; ‘onye Nazaret’ na-edobe ma njikọ ebe ahụ ma ohere ịghọta ya dịka aha njirimara.
- source_word: ἦλθες ἀπολέσαι
  choice: Ị bịara ibibi
  rationale: Ajụjụ ahụ lekwasịrị anya n’ọbịbịa Jizọs na ebumnuche mbibi; ‘ibibi’ bụ okwu doro anya na nke na-adịghị etinye nkọwa okpukpe ọzọ.
- source_word: ἡμᾶς
  choice: anyị
  rationale: E debere nnọchiaha ọtụtụ dịka Grik si dị, n’agbanyeghị na e kwughị kpọmkwem ndị ọ na-ezo aka na ha.
- source_word: οἶδά σε τίς εἶ
  choice: Amaara m onye ị bụ
  rationale: Ọ na-egosipụta nkwupụta mmụọ ahụ na ọ matara njirimara Jizọs n’enweghị mgbakwunye.
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: Onye Nsọ nke Chineke
  rationale: Ọ na-edobe aha nsọpụrụ ahụ n’ụdị dị nso na Grik ma na-egosi mmekọrịta ya na Chineke n’enweghị ịgbasa nkọwa ozizi.
theological_decisions:
- issue: Nnọchiaha ọtụtụ ἡμᾶς n’okwu mmụọ ọjọọ
  choice: E debere ya dịka ‘anyị’ n’enweghị ịkọwa ndị ọ gụnyere.
  alternative: Mmụọ ahụ nwere ike ikwu maka onwe ya na mmụọ ọjọọ ndị ọzọ, ma ọ bụ maka onwe ya na nwoke ahụ mmụọ ji.
  rationale: Grik kọwara ya n’ụdị ọtụtụ, ma amaokwu ahụ akọwaghị kpọmkwem ndị ọ gụnyere; ya mere nsụgharị ahụ na-edobe mgbagwoju anya ahụ.
- issue: Aha ὁ ἅγιος τοῦ θεοῦ
  choice: Onye Nsọ nke Chineke
  alternative: Onye Nsọ nke si n’aka Chineke; Onye Nsọ Chineke
  rationale: Amaokwu ahụ na-enye Jizọs aha dị mkpa, ma ọ naghị akọwa ihe niile aha ahụ pụtara n’ozizi; e debere aha ahụ dịka e kwuru ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. ‘Ehee!’ na-enye mkpu mberede; ‘Gịnị ka anyị na gị nwekọrọ?’ na-eme ka akpaalaokwu ahụ bụrụ Igbo ebumpụta ụwa. E debere ọtụtụ ‘anyị’ na aha ‘Onye Nsọ nke Chineke’ n’enweghị idozi mgbagwoju anya ma ọ bụ itinye nkọwa otu ụka.
