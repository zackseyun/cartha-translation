  yaml_path: translation/nt/luke/004/028.yaml
  text: And all in the synagogue were filled with anger when they heard these things,[a]
translation:
  language: ig
  text: Mgbe ndị niile nọ n’ụlọ nzukọ ahụ nụrụ ihe ndị a, iwe jupụtara n’obi ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “oke iwe jupụtara n’obi ha.” Okwu Grik bụ θυμός pụrụ ịpụta iwe siri ike ma ọ bụ ọnụma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: jupụtara ha n’obi
  rationale: Nke a na-egosipụta na iwe juputara n’ime ha n’ụzọ Igbo si ekwu ya nke ọma, ma na-echekwa echiche nke ịbụ ndị ihe jupụtara.
- source_word: πάντες
  choice: ndị niile
  rationale: Ọ na-ezo aka n’onye ọ bụla nọ n’ìgwè ahụ, ma na-edobe ike okwu Grik ahụ.
- source_word: θυμοῦ
  choice: iwe
  rationale: θυμός pụtara iwe siri ike; “iwe” bụ okwu Igbo doro anya ma bụrụkwa nke mmadụ niile na-aghọta, ebe ihe odide ala peeji na-egosi na ọ pụrụ ịbụ oke iwe.
- source_word: ἐν τῇ συναγωγῇ
  choice: n’ụlọ nzukọ ahụ
  rationale: Nke a na-akọwa ebe ndị ahụ nọ. “Ụlọ nzukọ” bụ okwu Igbo doro anya maka synagogue, “ahụ” na-ezokwa aka n’ebe ahụ e kwuburu okwu ya.
- source_word: ἀκούοντες
  choice: Mgbe ... nụrụ
  rationale: Participul a na-egosi ihe mere n’otu oge ma bụrụkwa ihe kpaliri iwe ahụ; usoro “Mgbe ... nụrụ” bụ Igbo eke.
- source_word: ταῦτα
  choice: ihe ndị a
  rationale: Ọ na-ezo n’ụzọ sara mbara n’ihe Jizọs kwuru tupu nke a, na-agbakwụnyeghị “okwu” nke na-anọghị kpọmkwem na Grik.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro ahịrịokwu Igbo eke tinye nkebi oge n’ihu, na-enweghị ịgbanwe njikọ ya na omume bụ isi.
