id: LUK.4.9
reference: Luke 4:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: ig
  text: Mgbe ahụ, ọ duuru ya gaa Jerusalem, mee ka o guzo n’ọnụ ọnụ dị elu nke ụlọ nsọ[a][b], wee sị ya, “Ọ bụrụ na ị bụ Ọkpara Chineke[c], si n’ebe a tụda onwe gị n’ala.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’elu nku ụlọ nsọ.” Okwu Grik a na-ezo aka n’ọnụ mpụta ma ọ bụ n’ebe dị elu nke ihe owuwu ụlọ nsọ ahụ.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ἱερόν na-ezo aka n’ogige na ụlọ niile nke ụlọ nsọ, ọ bụghị naanị ebe nsọ dị n’ime ya.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “Ebe ị bụ Ọkpara Chineke.” A pụrụ ịghọta ụdị ọnọdụ a n’asụsụ Grik n’ụzọ ahụ, ma a sụgharịrị ya “Ọ bụrụ na” n’ebe a iji debe ịma aka onye na-anwa ya.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἤγαγεν
  choice: ọ duuru ya gaa
  rationale: Ngwaa ἄγω na-egosi iduru ma ọ bụ ịkpọga mmadụ; ‘duuru ya gaa’ na-egosipụta njem ahụ na onye na-edu ya n’enweghị ịkọwa ụzọ e si mee ya karịa ihe odide ahụ kwuru.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-eme ka akụkọ ahụ gaa n’ihu n’usoro; ‘Mgbe ahụ’ bụ ụzọ Igbo dị ire ụtọ isi gosipụta usoro ihe omume.
- source_word: Ἰερουσαλήμ
  choice: Jerusalem
  rationale: Nke a bụ aha obodo ahụ a na-ejikarị eme ihe n’Igbo nke oge a.
- source_word: ἔστησεν
  choice: mee ka o guzo
  rationale: Ụdị a nke ἵστημι nwere nghọta nke ime ka mmadụ guzo ma ọ bụ idowe ya n’otu ebe; nsụgharị a na-edebe nghọta ahụ nke ọma.
- source_word: ἐπὶ τὸ πτερύγιον
  choice: n’ọnụ ọnụ dị elu
  rationale: πτερύγιον pụtara n’ụzọ nkịtị obere nku, ma n’ihe owuwu ọ na-ezo aka n’ọnụ mpụta ma ọ bụ ebe dị elu. ‘Ọnụ ọnụ dị elu’ doro onye na-agụ Igbo anya ma ọ naghị ekpebi kpọmkwem ụdị akụkụ ụlọ ahụ.
- source_word: τοῦ ἱεροῦ
  choice: nke ụlọ nsọ
  rationale: ἱερόν na-ezo aka n’ogige na ụlọ niile nke ụlọ nsọ, ọ bụghị naanị ebe nsọ dị n’ime; ‘ụlọ nsọ’ bụ okwu Igbo nkịtị, ebe nkọwa ala peeji na-eme ka oke nghọta Grik ahụ doo anya.
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Ọ bụrụ na ị bụ Ọkpara Chineke
  rationale: ‘Ọ bụrụ na’ na-edebe ụdị ọnọdụ na aka mgba dị n’okwu onye na-anwa ya; ‘Ọkpara Chineke’ na-egosipụta aha njirimara ahụ n’ụzọ Igbo a maara nke ọma.
- source_word: βάλε σεαυτὸν
  choice: tụda onwe gị
  rationale: βάλλω n’iwu a pụtara ịtụ ma ọ bụ ịkwatu; ‘tụda onwe gị’ bụ Igbo doro anya ma dị ugbu a.
- source_word: ἐντεῦθεν κάτω
  choice: si n’ebe a … n’ala
  rationale: ἐντεῦθεν na-egosi ebe a nọ, ebe κάτω na-egosi ngagharị ala; usoro Igbo a na-ebuga ha abụọ n’ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Otu e si sụgharị aka mgba megide njirimara Jizọs
  choice: Ọ bụrụ na ị bụ Ọkpara Chineke
  alternative: Ebe ị bụ Ọkpara Chineke
  rationale: εἰ tinyere ngwaa na-egosi eziokwu nwere ike ịpụta ihe yiri ‘ebe ọ bụ na,’ ma ‘ọ bụrụ na’ na-edebe aka mgba na nnwale dị n’akụkọ ahụ, n’ebughị ụzọ kpebie ma onye na-ekwu okwu na-ekwenye n’eziokwu ahụ ma ọ bụ na ọ bụghị.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-eso usoro akụkọ Igbo ebumpụta ụwa, ma na-edebe mgbagwoju anya nke πτερύγιον na ike ọnọdụ εἰ site na nkọwa ala peeji.
