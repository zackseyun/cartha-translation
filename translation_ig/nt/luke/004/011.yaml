  yaml_path: translation/nt/luke/004/011.yaml
  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: ig
  text: Na, “Ha ga-eburu gị n’aka ha, ka ụkwụ gị ghara ịkụgide na nkume.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Ọzọkwa
  rationale: Njikọ a na-aga n’ihu n’otu amaokwu Akwụkwọ Nsọ ahụ; ‘Ọzọkwa’ na-egosi nke a nke ọma n’Igbo.
- source_word: ὅτι
  choice: “
  rationale: N’ebe a, ὅτι na-ewebata ihe e hotara; akara nhota na-anọchi ọrụ ya n’Igbo dị larịị.
- source_word: Ἐπὶ χειρῶν
  choice: jiri aka ha
  rationale: Nke a na-echekwa ihe oyiyi nke iburu mmadụ site n’aka, ma bụrụkwa okwu Igbo e ji eme ihe n’ụzọ nkịtị.
- source_word: ἀροῦσίν σε
  choice: ha ga-ebuli gị elu
  rationale: αἴρω n’ebe a pụtara ibuli ma ọ bụ ibu; ‘bulie gị elu’ na-egosipụta nchebe ahụ nke ọma.
- source_word: μήποτε
  choice: ka ... ghara
  rationale: Ụdị a bụ ụzọ Igbo doro anya isi gosipụta ebumnuche mgbochi nke μήποτε.
- source_word: προσκόψῃς
  choice: ịkpọtu
  rationale: N’ihe gbasara ụkwụ na nkume, ‘ịkpọtu’ na-egosi ụkwụ ịkụgide ma ọ bụ ịsụ ngọngọ n’ihe.
- source_word: πρὸς λίθον
  choice: n’elu nkume
  rationale: N’Igbo, ‘ịkpọtu n’elu nkume’ bụ ụzọ ebumpụta ụwa isi kwuo na ụkwụ kụrụ nkume.
- source_word: τὸν πόδα σου
  choice: ụkwụ gị
  rationale: E debere otu ụkwụ dị ka ọ dị n’asụsụ Grik.
theological_decisions:
- issue: Ịsụgharị amaokwu Abụ Ọma ahụ n’Igbo nke oge a ma chekwaa ihe oyiyi nke nchebe
  choice: ha ga-ebuli gị elu
  alternative: ha ga-ebu gị
  rationale: Nhọrọ abụọ ahụ anaghị agbanwe ozizi; ‘ebuli gị elu’ na-eme ka ọrụ nchebe ahụ pụta ìhè ma na-anọgide nso na αἴρω.
translation_notes:
  register: Asụsụ Igbo izugbe, nke ugwu na nke dị mfe nghọta. E chekwara nhota ahụ na ihe oyiyi nke aka, ụkwụ, na nkume; a zere okwu ochie na nkọwa nke otu ụka.
