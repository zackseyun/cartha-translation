  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: ig
  text: Ọtụtụ ndị ekpenta nọ n’Izrel n’oge Ịlaịsha onye amụma, ma ọ dịghị onye ọ bụla n’ime ha ka e mere ka ọ dị ọcha, ma e wezụga Neeman onye Siria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεπροὶ
  choice: ndị ekpenta
  rationale: Nke a bụ okwu Igbo dị nkenke ma bụrụkwa nke a na-aghọta nke ọma maka ndị ọrịa akpụkpọ ahụ a na-akpọ ekpenta n'okwu Baịbụl; ọ na-edobe ụdị aha mmadụ nke okwu Grik ahụ.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: n’Izrel
  rationale: Ọ na-egosi ebe ma ọ bụ ógbè ha nọ n'ụzọ dị mfe, n'ebughị ụzọ kpebie ma ọ bụ ala ahụ kpọmkwem ka ọ bụ ndị Izrel ka e bu n'uche.
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: n’oge Ịlaịsha onye amụma
  rationale: ἐπί tinyere genitive ebe a na-egosi oge; nsụgharị a bụ Igbo eke ma doo anya.
- source_word: ἐκαθαρίσθη
  choice: e mere ka ọ dị ọcha
  rationale: Ọ na-edobe echiche καθαρίζω banyere ime ka onye ekpenta dị ọcha, nke gụnyere mgbake anụ ahụ na ọnọdụ ịdị ọcha n'usoro Akwụkwọ Nsọ, kama ime ka ọ bụrụ naanị 'gwọọ ya.'
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: N'okwu a, njikọ ahụ na-egosi onye naanị ya so n'ihe e kwuru, ya bụ, 'except.'
- source_word: Ναιμὰν ὁ Σύρος
  choice: Neeman onye Siria
  rationale: 'Aha a sụgharịrị n''ụdị a maara n''Igbo, ebe ''onye Siria'' na-edobe njirimara agbụrụ ya na ike ntụnyere ahụ: onye e mere ka ọ dị ọcha bụ onye mba ọzọ.'
theological_decisions:
- issue: Ihe asụsụ ịdị ọcha pụtara n'ihe gbasara ekpenta
  choice: e mere ka ọ dị ọcha
  alternative: a gwọrọ ya; e sachara ya
  rationale: Nhọrọ a na-edobe njikọ Akwụkwọ Nsọ dị n'etiti mgbake ọrịa ekpenta na iwepụ ọnọdụ adịghị ọcha, n'etinyeghị nkọwa ozizi ọzọ.
- issue: Ike njirimara agbụrụ Neeman
  choice: Neeman onye Siria
  alternative: Neeman, otu onye Siria
  rationale: Ọ na-edobe onye Siria dị ka njirimara a maara ya, ma na-eme ka ọdịiche dị n'etiti ya na ọtụtụ ndị nọ n'Izrel pụta ìhè.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji 'ndị ekpenta' mee ihe n'ihi na ọ bụ okwu Baịbụl a maara nke ọma, ebe 'e mere ka ọ dị ọcha' na-echekwa okwu na echiche nke isi mmalite Grik.
