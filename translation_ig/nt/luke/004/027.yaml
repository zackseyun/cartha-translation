  to: Ọtụtụ ndị ekpenta nọ n’Izrel n’oge Ịlaịsha onye amụma, ma ọ dịghị onye ọ bụla n’ime ha ka e mere ka ọ dị ọcha, ma e wezụga Neeman onye Siria.
