id: LUK.4.26
reference: Luke 4:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: ig
  text: Ma e zigaghị Ịlaịja ka ọ gakwuru onye ọ bụla n’ime ha, ma e wezụga ka ọ gakwuru otu nwanyị di ya nwụrụ na Zarefat nke Saịdọn[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik: “Sarepta nke Saịdọn”; ọ bụ Zarefat a kpọrọ aha na 1 Ndị Eze 17:9.'
    reason: cross_reference
lexical_decisions:
- source_word: ἐπέμφθη
  choice: e zigara ya
  rationale: Ụdị okwu Igbo a na-ahapụ onye zitere Ịlaịja n’ekwughị aha, dịka ahịrị Grik si mee, ma na-egosikwa nke ọma na e zigara ya.
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: ka ọ gakwuru onye ọ bụla n’ime ha
  rationale: N’ime ahịrị na-ajụ ihe, ‘onye ọ bụla n’ime ha’ bụ ụzọ Igbo dị mfe ma doo anya isi kwuo na ọ dịghị onye n’ime ha ka ọ gakwuuru.
- source_word: Ἠλίας
  choice: Ịlaịja
  rationale: Nke a bụ ụdị aha onye amụma ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: εἰ μὴ
  choice: kama
  rationale: N’usoro ahịrị a, ‘kama’ na-ewebata onye e wepụrụ n’okwu ahụ n’ụzọ Igbo na-ada nke ọma, ọ bụghị dị ka ọnọdụ a na-atụ anya ya.
- source_word: Σάρεπτα
  choice: Zarefat
  rationale: A họọrọ ụdị aha ebe ahụ a maara site n’Akụkọ Ndị Eze Mbụ 17, kama idegharị naanị ọdịdị aha Grik bụ Sarepta.
- source_word: τῆς Σιδωνίας
  choice: nke Saịdọn
  rationale: ‘Nke Saịdọn’ na-edobe njikọ genitiv nke Grik ma na-egosi ebe a na-akọwa Zarefat site na njikọ ya na Saịdọn.
- source_word: γυναῖκα χήραν
  choice: otu nwanyị di ya nwụrụ
  rationale: Nke a bụ okwu Igbo nkịtị na nke nkwanye ùgwù maka nwanyị nwunye ya nwụnahụrụ, ma ọ na-edobe ma ‘nwanyị’ ma ọnọdụ ya dịka onye di ya nwụrụ.
theological_decisions:
- issue: Onye zitere Ịlaịja ezoghị aha n’ụdị ngwaa ahụ
  choice: 'Ahapụrụ onye zitere ya n’ekwughị aha: ‘e zigara ya.’'
  alternative: 'Ikwupụta ya hoo haa: ‘Chineke zigara ya.’'
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu na-egosi na Chineke bụ onye zitere Ịlaịja, Grik akpọghị onye mere ya aha. Nsụgharị ahụ anaghị etinye aha Chineke n’ebe ederede ahụ na-ekwughị ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrị ahụ site na semikolon iji mee ka ntụnyere dị n’etiti ndị inyom di ha nwụrụ n’Izrel na otu nwanyị nọ na Zarefat doo anya. Akara nkọwa ala [a] dị n’akụkụ aha ebe ọ na-akọwa.
