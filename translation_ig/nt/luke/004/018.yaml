revisions:
- from: Mmụọ nke Onyenwe anyị dịkwasịrị m,[a] n’ihi na o tere m mmanụ ka m zie ndị ogbenye ozi ọma. O zitela m ka m kwusara ndị a dọọrọ n’agha na a ga-atọhapụ ha, kwusarakwa ndị ìsì na ha ga-ahụ ụzọ ọzọ; ka m tọhapụ ndị e tipịara etipịa,[b]
  to: Mmụọ nke Onyenwe anyị dịkwasịrị m, n’ihi na o tere m mmanụ ka m zie ndị ogbenye ozi ọma. O zitela m ka m kwusara ndị a dọọrọ n’agha ntọhapụ,[a] na nlaghachi nke ịhụ ụzọ nye ndị ìsì, ka m zipụ ndị e tipịara etipịa[b] ka ha nweere onwe ha,
  rationale: The revision restores the source’s coordinated proclamation of release and recovery of sight, preserves the repeated liberation term with an appropriately anchored lexical footnote, and retains the distinct ‘send out’ action in the final infinitive. It avoids the misleading idiom “ịhụ ụzọ ọzọ” while keeping the elevated but current Standard Igbo register.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:02:18Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the Spirit, anointing, good news, the captives, and the crushed. However, “ha ga-ahụ ụzọ ọzọ” means that the blind will find/see another path, rather than receive or recover sight. Rendering ἄφεσις as a future clause (“a ga-atọhapụ ha”) also obscures the Greek noun that is proclaimed and its deliberate repetition. The final clause should retain both the sending action and the liberation sense of ἐν ἀφέσει.
  naturalness: “Dịkwasịrị m,” “o tere m mmanụ,” and “O zitela m” are natural, dignified Standard Igbo. “Nlaghachi nke ịhụ ụzọ” clearly conveys recovery of sight. “Ka ha nweere onwe ha” is a natural way to express the released condition of those sent out without reducing ἀποστεῖλαι to merely ‘set free.’
  terminology: “Onyenwe anyị,” “tere m mmanụ,” “ozi ọma,” and “ntọhapụ” preserve established biblical register while remaining understandable. The first occurrence of “ntọhapụ” receives a footnote preserving the possible lexical sense “mgbaghara.” “Ndị e tipịara etipịa” retains the force of τεθραυσμένους, with an idiomatic contextual alternative noted.
  issues:
  - severity: high
    issue: “ndị ìsì na ha ga-ahụ ụzọ ọzọ”
    rationale: This naturally refers to seeing/finding another way or path, not to ἀνάβλεψις, ‘recovery/restoration of sight.’
  - severity: medium
    issue: “ndị a dọọrọ n’agha na a ga-atọhapụ ha”
    rationale: The Greek has the noun ἄφεσιν, ‘release,’ as the content proclaimed. The future passive paraphrase loses that nominal form and weakens the rhetorical repetition with ἐν ἀφέσει.
  - severity: medium
    issue: The final clause omits the sending sense of ἀποστεῖλαι
    rationale: “Ka m tọhapụ” renders liberation but not the explicit action ‘send out.’ A revised wording should retain both elements.
  - severity: low
    issue: Footnote a gives an unnecessary alternative for ἐπ’ ἐμέ
    rationale: “Dị n’ahụ m” is broader than ‘upon me’ and does not preserve the spatial/image-bearing force as well as the main text. The available footnote space is better used for the genuine lexical ambiguity of ἄφεσις.
  revised_text: Mmụọ nke Onyenwe anyị dịkwasịrị m, n’ihi na o tere m mmanụ ka m zie ndị ogbenye ozi ọma. O zitela m ka m kwusara ndị a dọọrọ n’agha ntọhapụ,[a] na nlaghachi nke ịhụ ụzọ nye ndị ìsì, ka m zipụ ndị e tipịara etipịa[b] ka ha nweere onwe ha,
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbaghara.” Okwu Grik ahụ (ἄφεσις) pụrụ ịpụta ntọhapụ ma ọ bụ mgbaghara; n’ebe a, okwu banyere ndị a dọọrọ n’agha na ndị e tipịara etipịa na-akwado “ntọhapụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ndị agbajiri agbaji” ma ọ bụ “ndị e tipịara etipịa”; n’ọnọdụ a, ọ pụkwara ịpụta “ndị a na-emegbu emegbu.”
    reason: lexical_alternative
  revision_rationale: The revision restores the source’s coordinated proclamation of release and recovery of sight, preserves the repeated liberation term with an appropriately anchored lexical footnote, and retains the distinct ‘send out’ action in the final infinitive. It avoids the misleading idiom “ịhụ ụzọ ọzọ” while keeping the elevated but current Standard Igbo register.
