id: LUK.4.18
reference: Luke 4:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: ig
  text: Mmụọ nke Onyenwe anyị dịkwasịrị m, n’ihi na o tere m mmanụ ka m zie ndị ogbenye ozi ọma. O zitela m ka m kwusara ndị a dọọrọ n’agha ntọhapụ,[a] na nlaghachi nke ịhụ ụzọ nye ndị ìsì, ka m zipụ ndị e tipịara etipịa[b] ka ha nweere onwe ha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbaghara.” Okwu Grik ahụ (ἄφεσις) pụrụ ịpụta ntọhapụ ma ọ bụ mgbaghara; n’ebe a, okwu banyere ndị a dọọrọ n’agha na ndị e tipịara etipịa na-akwado “ntọhapụ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ndị agbajiri agbaji” ma ọ bụ “ndị e tipịara etipịa”; n’ọnọdụ a, ọ pụkwara ịpụta “ndị a na-emegbu emegbu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου
  choice: Mmụọ nke Onyenwe anyị
  rationale: Nke a na-egosi njikọ nke genitive ahụ dị ka ịbụ nke Onyenwe anyị ma na-edokwa ụda amaokwu Aịzaya.
- source_word: ἐπ’ ἐμέ
  choice: dịkwasịrị m
  rationale: Ọ na-egosi na Mmụọ ahụ dị n’elu ya ma ọ bụ bịakwasị ya, n’ụzọ Igbo dị mfe ma dị ugwu.
- source_word: οὗ εἵνεκεν
  choice: n’ihi na
  rationale: Akpaokwu ahụ na-enye ihe kpatara Mmụọ ji dịkwasị onye na-ekwu okwu.
- source_word: ἔχρισέν με
  choice: o tere m mmanụ
  rationale: Ọ na-echekwa ihe oyiyi nke χρίω na ụda Mesaịa ya, kama iji naanị okwu gbasara ịhọpụta mmadụ.
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: ka m zie ndị ogbenye ozi ọma
  rationale: Nke a na-ekwupụta izisa ozi ọma n’asụsụ Igbo a na-aghọta nke ọma, ma hapụ ‘ndị ogbenye’ n’enweghị ịkọwapụta ma ọ bụ naanị ịda ogbenye n’ihe onwunwe.
- source_word: ἀπέσταλκέν με
  choice: O zitela m
  rationale: Ụdị ‘zitela’ na-egosi izite e mere nke mmetụta ya ka dị ugbu a, dịka perfect Greek si dị.
- source_word: κηρύξαι
  choice: ka m kwusara
  rationale: ‘Kwụsara’ na-enye echiche nke nkwupụta ọha nke κηρύσσω.
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: ndị a dọọrọ n’agha na a ga-atọhapụ ha
  rationale: N’ọnọdụ a ἄφεσις na-ezo karịsịa n’ịtọhapụ ndị e jidere; ntụgharị a na-eme ka ihe ahụ doo onye Igbo anya.
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: ndị ìsì na ha ga-ahụ ụzọ ọzọ
  rationale: ‘Ga-ahụ ụzọ ọzọ’ na-egosi inweta ma ọ bụ iweghachi ịhụ ụzọ, nke bụ isi echiche ἀνάβλεψις.
- source_word: ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει
  choice: ka m tọhapụ ndị e tipịara etipịa
  rationale: Nke a na-egosipụta ebumnuche nke izipụ ha dịka ndị a tọhapụrụ, ma okwu ‘e tipịara etipịa’ na-echekwa ihe oyiyi siri ike nke perfect passive τεθραυσμένους.
theological_decisions:
- issue: Ihe ἄφεσις pụtara n’okwu Aịzaya a
  choice: ntọhapụ
  alternative: mgbaghara
  rationale: Njikọ ya na ndị a dọọrọ n’agha na ndị e tipịara etipịa na-akwado echiche ntọhapụ. Ma ebe ἄφεσις nwekwara ike ịpụta mgbaghara, e debere nke ahụ n’ala peeji ka a ghara ikpochapụ mgbagwoju anya dị n’okwu ahụ.
- issue: Ihe τεθραυσμένους na-akọwa
  choice: ndị e tipịara etipịa
  alternative: ndị a na-emegbu emegbu
  rationale: Nhọrọ bụ isi na-echekwa ihe oyiyi nkịtị nke ‘ndị agbajiri/etipịara,’ ebe ala peeji na-enye nghọta ọnọdụ nke ndị a na-emegbu emegbu.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. E ji ‘Onyenwe anyị’ na ‘o tere m mmanụ’ chekwaa ụda Akwụkwọ Nsọ na ihe oyiyi Mesaịa; e zere okwu ụka siri ike ebe okwu nkịtị zuru oke.
