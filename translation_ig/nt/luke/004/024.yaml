id: LUK.4.24
reference: Luke 4:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δέ· Ἀμὴν λέγω ὑμῖν ὅτι οὐδεὶς προφήτης δεκτός ἐστιν ἐν τῇ πατρίδι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: ig
  text: O wee sị, “N’ezie, ana m agwa unu, ọ dịghị onye amụma a na-anabata n’obodo ya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe o si” ma ọ bụ “n’ala nna ya.” Okwu Grik bụ πατρίς nwere ike ịpụta obodo mmadụ, mpaghara ebe o si, ma ọ bụ ala nna ya; n’ebe a, “obodo ya” dabara n’ọnọdụ Nazaret.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: O wee sị
  rationale: δέ bụ njikọ akụkọ dị nro n'ebe a; “wee” na-eme ka akụkọ gaa n'ihu n'Igbo n'etinyeghị esemokwu siri ike.
- source_word: Ἀμὴν
  choice: N’ezie
  rationale: N'okwu Jizọs, ἀμήν na-ebute nkwupụta siri ike na nke a pụrụ ịtụkwasị obi; “N’ezie” na-egosipụta nke a n'Igbo nkịtị.
- source_word: λέγω ὑμῖν
  choice: ana m agwa unu
  rationale: Nke a na-edobe onye mbụ, okwu a na-ekwu ugbu a, na ịgwa ọtụtụ mmadụ okwu ozugbo.
- source_word: οὐδεὶς προφήτης
  choice: ọ dịghị onye amụma
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke e ji ekwu okwu n'Igbo iji gosipụta na ọ dịghị otu onye amụma.
- source_word: δεκτός
  choice: a na-anabata
  rationale: Nhọrọ a na-egosi ịbụ onye ndị mmadụ nabatara nke ọma, ma ghara ime ka ihe ọ pụtara bụrụ naanị nnabata ọbịa.
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: n’obodo ya
  rationale: πατρίς nwere ike ịpụta obodo mmadụ, mpaghara ebe o si, ma ọ bụ ala nna ya. N'ọnọdụ Nazaret ebe a, “obodo ya” bụ okwu ebumpụta ụwa ma dabara n'okwu ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere usoro nkwupụta siri ike “N’ezie, ana m agwa unu,” ma hapụkwa obosara ihe πατρίς nwere ike ịpụta n'okpuru ederede.
