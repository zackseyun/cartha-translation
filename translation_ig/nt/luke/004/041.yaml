id: LUK.4.41
reference: Luke 4:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: ig
  text: Ndị mmụọ ọjọọ na-esikwa n’ime ọtụtụ mmadụ apụta, na-eti mkpu na-asị, “Ị bụ Ọkpara Chineke!” Ma ọ na-abara ha mba, ọ naghị ekwekwa ka ha kwuo okwu, n’ihi na ha maara na ọ bụ Mesaịa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst.” Okwu Grik ahụ bụ Χριστός, nke pụtara “Mesaịa” ma ọ bụ “Onye e tere mmanụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ ụzọ doro anya ma bụrụkwa nke ndị na-asụ Igbo taa na-aghọta maka ndị mmụọ ọjọọ; ọ naghị agbanwe okwu Grik ahụ ka ọ bụrụ nkebiokwu ọzọ dị ka ‘mmụọ na-adịghị ọcha.’
- source_word: ἐξήρχετο
  choice: na-apụta
  rationale: Ụdị ngwaa na-aga n’ihu na-egosi ihe na-eme ugboro ugboro n’akụkọ ahụ; ‘na-apụta’ na-echekwa nghọta a.
- source_word: ἀπὸ πολλῶν
  choice: n’ime ọtụtụ mmadụ
  rationale: Ọ bụ ezie na Grik ekwughị ‘mmadụ’ kpọmkwem, ihe a na-ekwu bụ na ndị mmụọ ahụ si n’ime ọtụtụ ndị mmadụ pụta. Ịtinye ‘mmadụ’ na-eme ka Igbo bụrụ ihe doro anya ma ghara ịgbanwe ihe okwu ahụ pụtara.
- source_word: κραυγάζοντα
  choice: na-eti mkpu
  rationale: Nke a na-egosi mkpu dara ụda ma dabara n’ụzọ Igbo si akọ akụkọ.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Ọ na-echekwa aha nsọ na ịdị arọ nke utu aha ahụ n’Igbo nkịtị ma dị ùgwù.
- source_word: ἐπιτιμῶν
  choice: na-abara ha mba
  rationale: Nkebiokwu a na-egosi ịdọ aka ná ntị ma ọ bụ inye iwu siri ike, dịka ngwaa Grik ahụ si dị.
- source_word: οὐκ εἴα
  choice: ọ naghịkwa ekwe
  rationale: Ụdị na-aga n’ihu na-egosi na Jizọs nọgidere na-ajụ ikwe ka ha kwuo okwu.
- source_word: τὸν χριστὸν
  choice: Mesaịa
  rationale: Χριστός bụ utu aha ebe a, ya mere ‘Mesaịa’ na-ebute ihe ọ pụtara dịka Onye E Tere Mmanụ kama ime ya naanị aha mmadụ.
theological_decisions:
- issue: Otu e si sụgharịa Χριστός n’okwu onye na-akọ akụkọ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Ebe a, okwu ahụ bụ utu aha nke na-akọwa onye Jizọs bụ. ‘Mesaịa’ na-echekwa ọrụ ya dịka Onye E Tere Mmanụ; ihe ọzọ a pụrụ ịsụgharị ya dị n’ala peeji.
- issue: Mmekọrịta dị n’etiti ‘Ọkpara Chineke’ na ‘Mesaịa’
  choice: E debere utu aha abụọ ahụ iche dịka ha dị na Grik
  alternative: Ijikọta ha ka ha bụrụ otu nkọwa
  rationale: Ndị mmụọ ahụ kpọrọ ya ‘Ọkpara Chineke,’ ebe onye na-akọ akụkọ kwuru na ha maara na ọ bụ Mesaịa. Idebe ha iche na-echekwa ọdịiche na mgbagwoju echiche dị n’akwụkwọ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘na-apụta,’ ‘na-eti mkpu,’ na ‘ọ naghịkwa ekwe’ na-echekwa omume na-aga n’ihu ma ọ bụ na-eme ugboro ugboro nke ngwaa Grik ndị ahụ.
