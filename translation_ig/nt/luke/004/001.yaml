source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ⸂πλήρης πνεύματος ἁγίου⸃ ὑπέστρεψεν ἀπὸ τοῦ Ἰορδάνου, καὶ ἤγετο ἐν τῷ πνεύματι ⸂ἐν τῇ ἐρήμῳ⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: ig
  text: Ma Jizọs, onye jupụtara na Mmụọ Nsọ[a], si na Jọdan lọta; Mmụọ Nsọ na-edukwa ya n’ọzara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Mmụọ.” Okwu Grik ahụ nwere ike ịsụgharị n’ụzọ nkịtị otu a; ma n’ebe a, o yikarịrị ka ọ pụtara na Mmụọ Nsọ bụ onye na-edu ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: onye jupụtara na Mmụọ Nsọ
  rationale: Nke a na-egosipụta πλήρης tinyere genitive dị ka ọnọdụ Jizọs nọ na ya, ọ bụghị dị ka ihe mere naanị otu mgbe; ọ bụkwa Igbo doro anya ma dị mma.
- source_word: ὑπέστρεψεν
  choice: lọta
  rationale: “Lọta” na-enye kpọmkwem echiche nke ịlaghachi ebe mmadụ si bịa, dịka aorist ὑποστρέφω si dị n’akụkọ a.
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: si na Jọdan
  rationale: E debere aha ahụ dịka Grik si kpọọ ya n’etinyeghị okwu “osimiri,” nke a na-adịghị ekwu kpọmkwem n’amaokwu ahụ.
- source_word: ἤγετο
  choice: nọkwa na-edu ya
  rationale: E ji ahịrịokwu na-arụ ọrụ dochie passive Grik n’ihi na nke ahụ bụ Igbo nkịtị; “nọ na-edu” na-echekwa omume na-aga n’ihu nke imperfect ahụ.
- source_word: ἐν τῷ πνεύματι
  choice: Mmụọ Nsọ … na-edu ya
  rationale: N’ọnọdụ a, ἐν nwere ike igosi onye e ji mee ihe ma ọ bụ onye na-eme ka e duzie ya. Ịkpọ Mmụọ Nsọ onye na-edu Jizọs na-eme ka ihe a pụtara doo anya, ma ndetu ala peeji na-echekwa nsụgharị nkịtị ọzọ.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ime ọzara
  rationale: “Ọzara” na-egosi ebe tọgbọrọ n’efu na ebe ndị mmadụ na-adịghị bi nke ọma, n’etinyeghị echiche na ọ ga-abụrịrị ala aja.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-arụ ọrụ dịka njikọ dị nro nke na-ebuga akụkọ ahụ n’ihe na-esote, dịka δέ si eme.
theological_decisions:
- issue: Onye “Mmụọ” dị na ἐν τῷ πνεύματι na-ezo aka na ya
  choice: Mmụọ Nsọ bụ onye na-edu Jizọs
  alternative: Ọnọdụ ime mmụọ Jizọs, ma ọ bụ nsụgharị nkịtị “n’ime Mmụọ Nsọ”
  rationale: Nkebi ahịrịokwu dị nso, “jupụtara na Mmụọ Nsọ,” na-emekwa ka o yikarịrị ka ọ bụ otu Mmụọ Nsọ ahụ ka a na-ekwu na ọ na-edu Jizọs. N’agbanyeghị nke ahụ, ndetu ahụ na-echekwa ụzọ ọzọ e si aghọta ἐν.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Jizọs,” “Mmụọ Nsọ,” “Jọdan,” na “ọzara” dịka okwu Baịbụl ndị a maara nke ọma. Ahịrịokwu na-arụ ọrụ mere ka Igbo ahụ dịrị ndụ, ebe “nọ na-edu” chekwara omume gara n’ihu dị na imperfect Grik.
