revisions:
- from: Ma Jizọs, onye jupụtara na Mmụọ Nsọ, si na Jọdan lọta, Mmụọ Nsọ nọkwa na-edu ya[a] n’ime ọzara.
  to: Ma Jizọs, onye jupụtara na Mmụọ Nsọ[a], si na Jọdan lọta; Mmụọ Nsọ na-edukwa ya n’ọzara.
  rationale: The revision preserves the imperfect sense with “na-edukwa,” states the likely agent explicitly as the Holy Spirit, renders the wilderness phrase locatively as “n’ọzara,” and replaces the malformed footnote alternative with a natural Igbo expression that preserves the Greek ambiguity.
