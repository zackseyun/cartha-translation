  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: ig
  text: Akụkọ banyere ya nọ na-agbasa ruo n’ebe niile n’ógbè gbara gburugburu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Akụkọ banyere ya nọ na-apụ ruo n’ebe niile n’ógbè gbara gburugburu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (E jikọtara nke a na amaokwu bu ụzọ n’enweghị ịmalite ahịrịokwu Igbo na “Na”)
  rationale: καὶ bụ njikọ akụkọ dị mfe; n’Igbo, usoro akụkọ ahụ n’onwe ya na-eme ka njikọ ahụ doo anya ma zere ahịrịokwu na-adịghị eke eke.
- source_word: ἐξεπορεύετο
  choice: nọ na-agbasa
  rationale: Ụdị imperfect na-egosi omume gara n’ihu n’oge gara aga; n’ebe ἦχος bụ isiokwu, “nọ na-agbasa” na-enye echiche nke akụkọ na-erute ebe dị iche iche n’ụzọ Igbo dị eke.
- source_word: ἦχος
  choice: Akụkọ
  rationale: Ọ bụ ezie na okwu ahụ nwere ike ịpụta ụda, njikọ ya na περὶ αὐτοῦ na-egosi akụkọ ma ọ bụ ozi a na-akọ banyere Jizọs.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: Nke a na-egosipụta kpọmkwem onye akụkọ ahụ gbasara.
- source_word: εἰς πάντα τόπον
  choice: ruo n’ebe niile
  rationale: “Ruo” na-echekwa echiche ngagharị nke εἰς, ebe “n’ebe niile” na-enye ike nkesa nke πάντα τόπον n’Igbo nkịtị.
- source_word: τῆς περιχώρου
  choice: n’ógbè ndị gbara ya gburugburu
  rationale: Nke a na-egosi mpaghara gbara ebe ihe ahụ mere gburugburu, n’asụsụ Igbo doro anya.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma nwee ugwu. E ji “akụkọ” mee ka echiche ἦχος n’ọnọdụ a doo anya, ma e debere nsụgharị dị nso n’okwu Grik “na-apụ” n’akụkụ nkọwa.
