id: LUK.4.14
reference: Luke 4:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: ig
  text: Jizọs wee laghachi na Galili n’ike nke Mmụọ. Akụkọ[a] banyere ya wee gbasaa n’ógbè niile dị gburugburu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi,” “aha,” ma ọ bụ “asịrị.” Okwu Grik ahụ pụtara akụkọ na-agbasa ebe niile, ma o kwughị ma akụkọ ahụ ọ dị mma ma ọ bụ na ọ dị njọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: laghachi
  rationale: Ngwaa a pụtara ịlaghachi n’ebe mmadụ si bịa; “laghachi” bụ okwu Igbo doro anya ma kwesị ekwesị n’akụkọ njem.
- source_word: ἐν τῇ δυνάμει
  choice: n’ike
  rationale: Nke a na-echekwa njikọ okwu Grik nke na-egosi ike nke Mmụọ dị n’ọrụ mgbe Jizọs laghachiri, n’emeghị ka ọ bụrụ naanị ụzọ e si mee ihe.
- source_word: τοῦ πνεύματος
  choice: nke Mmụọ Nsọ
  rationale: Ọ bụ ezie na naanị “Mmụọ” dị n’amaokwu Grik, ihe ndị gbara ya gburugburu na Luk 4 na-egosi nke ọma na ọ bụ Mmụọ Nsọ. N’Igbo, “Mmụọ Nsọ” na-eme ka onye a na-ekwu banyere ya doo anya ma zere nghọtahie.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: na Galili
  rationale: Nke a bụ ụzọ Igbo si ekwu ebe njem na-aga n’ụzọ dị mfe ma bụrụ nke eke.
- source_word: φήμη
  choice: Akụkọ
  rationale: “Akụkọ” nwere ike ịpụta ozi ma ọ bụ akụkọ a na-akọ banyere mmadụ, n’ebughị ụzọ kpebie ma ọ dị mma ma ọ dị njọ.
- source_word: ἐξῆλθεν
  choice: gbasaa
  rationale: Ọ bụ ụzọ Igbo dị eke isi gosipụta ihe atụ Grik nke akụkọ ‘pụpụtara’ wee ruo ebe niile.
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: n’ógbè niile gbara ya gburugburu
  rationale: Nke a na-egosipụta ma oke mgbasa ahụ—ebe niile—ma ọdịdị ala gbara Galili gburugburu.
- source_word: περὶ αὐτοῦ
  choice: banyere ya
  rationale: Nke a bụ okwu Igbo ugbu a, doro anya, nke kwekọrọ n’echiche ‘concerning him.’
theological_decisions:
- issue: Onye πνεύματος na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ
  rationale: Ihe ndị bu amaokwu a ụzọ na Luk 4 na-ekwu kpọmkwem banyere Mmụọ Nsọ n’ihe gbasara Jizọs. Nhọrọ a na-eme ka onye okwu ahụ na-ezo aka na ya doo onye na-agụ Igbo anya, n’agbanyeghị na okwu “Nsọ” adịghị n’amaokwu a n’onwe ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji usoro akụkọ “wee” mee ka mmegharị ihe omume doo anya. E tinyere akara ndetu [a] ozugbo n’ahịrịokwu nke abụọ; ndetu ahụ na-akọwa ọtụtụ nghọta φήμη nwere ike inwe.
