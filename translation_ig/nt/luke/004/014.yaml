revisions:
- from: Jizọs wee laghachi na Galili n’ike nke Mmụọ Nsọ. Akụkọ banyere ya wee gbasaa n’ógbè niile gbara ya gburugburu.[a]
  to: Jizọs wee laghachi na Galili n’ike nke Mmụọ. Akụkọ[a] banyere ya wee gbasaa n’ógbè niile dị gburugburu.
  rationale: The revision removes an adjective not present in the Greek, corrects the referent problem in the surrounding-region expression, and makes the lexical note neutral as required by φήμη. The note anchor is placed directly after “Akụkọ,” the word it explains.
  reviewer_model: gpt-5.6-terra
