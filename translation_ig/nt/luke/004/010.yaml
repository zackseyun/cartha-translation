  text: γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ τοῦ διαφυλάξαι σε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/010.yaml
  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: ig
  text: 'N’ihi na e dere, sị: “Ọ ga-enye ndị mmụọ ozi ya iwu banyere gị[a][c], ka ha chebe gị[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “gbasara gị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ka ha kpuchido gị.”
    reason: lexical_alternative
  - marker: c
    text: 'A pụkwara ịgụ ya: “banyere gị—ka ha chebe gị.”'
    reason: previous_rendering
lexical_decisions:
- source_word: γέγραπται
  choice: e dere ya
  rationale: Nke a bụ ụzọ Igbo doro anya e si ekwu na ihe ahụ dị n’Akwụkwọ Nsọ; ọ na-egosikwa na ihe e dere ka nwere ikike ugbu a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-edobe njikọ nkọwa dị n’etiti amaokwu a na okwu ọnwụnwa dị n’amaokwu bu ya ụzọ.
- source_word: ὅτι
  choice: 'sị:'
  rationale: N’Igbo, “sị” na ntụpọ abụọ na-ewebata okwu e hotara n’ụzọ dị mma karịa ịsụgharị ὅτι n’ụzọ siri ike.
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: ndị mmụọ ozi ya
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ndị ozi eluigwe nke Chineke, ma na-edobe njirimara nke αὐτοῦ.
- source_word: ἐντελεῖται
  choice: Ọ ga-enye ... iwu
  rationale: Ọ na-egosipụta iwu ma ọ bụ ọrụ a na-enye ndị mmụọ ozi, ma na-edobe ọdịnihu nke ngwaa Grik ahụ.
- source_word: περὶ σοῦ
  choice: banyere gị
  rationale: “Banyere” na-egosipụta echiche περί na genitive, ya bụ ihe metụtara ma ọ bụ gbasara onye ahụ.
- source_word: τοῦ διαφυλάξαι σε
  choice: ka ha chebe gị
  rationale: Nkebiokwu a na-egosipụta ebumnuche iwu ahụ. Ịtinye “ha” na-eme ka Igbo bụrụ nke eke, ebe ndị mmụọ ozi bụ ndị ga-echebe onye ahụ.
theological_decisions:
- issue: Otu e si sụgharị akụkụ Abụ Ọma nke Ekwensu hotara
  choice: Ịsụgharị naanị okwu Luk dekọrọ ebe a, n’ụzọ dị nso n’isi mmalite
  alternative: Ịgbakwunye akụkụ ndị ọzọ nke Abụ Ọma 91:11 na-adịghị n’ihe odide Grik nke amaokwu a
  rationale: Luk dekọrọ naanị akụkụ a nke ihe e hotara. Ịghara imeju ya site n’akụkụ ndị ọzọ na-echekwa ihe odide ahụ ma ghara itinye okwu ndị na-adịghị na Grik.
- issue: Onye na-eme omume dị na “ka ha chebe gị”
  choice: E mere ka “ndị mmụọ ozi” pụta ìhè site n’iji “ha”
  alternative: Ịsụgharị ya n’enweghị nnọchiaha doro anya, dị ka “ichebe gị”
  rationale: Grik na-ahapụ onye na-eme infinitive ka a ghọta ya site na “ndị mmụọ ozi.” Igbo chọrọ “ha” ebe a ka okwu wee bụrụ nke eke, n’enweghị ịgbanwe ihe ọ pụtara.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Ndị mmụọ ozi” bụ okwu a maara nke ọma; “nye ... iwu” na “chebe” na-eme ka okwu ahụ bụrụ eke ma ka nọgide nso n’usoro na echiche Grik.
