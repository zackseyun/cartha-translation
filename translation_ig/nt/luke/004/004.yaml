  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: ig
  text: 'Jizọs zara ya, sị, “E dere ya: ‘Mmadụ agaghị adị ndụ naanị site n’achịcha.’”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jizọs na-ehota Diuterọnọmi 8:3.
    reason: cross_reference
  - marker: b
    text: Ụfọdụ ihe odide aka ochie na-agbakwụnye, “kama site n’okwu Chineke ọ bụla.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτόν
  choice: zara ya
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu ahụ nke ọma ma doo anya; ọ na-egosi na Jizọs nyere ya azịza.
- source_word: Γέγραπται
  choice: E dere ya n’Akwụkwọ Nsọ
  rationale: Ọ bụ usoro e ji ebido ntụaka Akwụkwọ Nsọ. Ịgbakwunye “n’Akwụkwọ Nsọ” na-eme ka ihe a na-ekwu doo onye Igbo anya ma na-echekwa echiche nke ihe e dere nke ka nwere ikike.
- source_word: ὅτι
  choice: 'sị:'
  rationale: N’ebe a, ὅτι na-ewebata ihe e hotara; “sị:” bụ ụzọ Igbo dị ire ụtọ isi webata okwu ahụ.
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: ọ bụghị naanị achịcha ... ga-eji
  rationale: Usoro “iji ... dị ndụ” na-egosi achịcha dị ka ihe e ji akwado ndụ, ma na-echekwa nkwusi ike dị na μόνῳ, ‘naanị.’
- source_word: ζήσεται
  choice: ga-adị ndụ
  rationale: “Ga-adị ndụ” na-anọchi ọdịnihu ahụ n’Igbo nke oge a n'ụzọ doro anya.
- source_word: ὁ ἄνθρωπος
  choice: mmadụ
  rationale: N’Igbo, “mmadụ” bụ otu aha nwere echiche izugbe nke na-emetụta mmadụ niile; ọ naghị eme ka okwu ahụ bụrụ naanị nwoke, ma ọ ka na-echekwa otu onye nnọchianya dị na Grik.
theological_decisions:
- issue: Otu e si sụgharịa ὁ ἄνθρωπος dị ka otu onye nke na-anọchite mmadụ niile n’okwu Akwụkwọ Nsọ
  choice: mmadụ
  alternative: nwoke / mmadụ ọ bụla / ụmụ mmadụ
  rationale: “Mmadụ” bụ okwu Igbo ebumpụta ụwa nke pụrụ ịpụta mmadụ n’ozuzu ya, ma nwoke ma nwanyị. Ọ na-echekwa otu aha ahụ na echiche izugbe ya n’enweghị iweta nkọwa ụka pụrụ iche.
- issue: Igosipụta na Γέγραπται bụ usoro ntụaka Akwụkwọ Nsọ
  choice: E dere ya n’Akwụkwọ Nsọ
  alternative: E dere ya
  rationale: N’Igbo, “E dere ya” naanị ya nwere ike ịdị mgbagwoju anya. Ịkọwa ebe e dere ya na-eme ka usoro ntụaka ahụ doo anya, n’akwụsịghị ikike na-adịgide adịgide nke okwu e dere.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro “ọ bụghị naanị achịcha ka mmadụ ga-eji dị ndụ” ka ọ bụrụ okwu Igbo ebumpụta ụwa ma ka o chekwaa nkwusi ike nke Grik. E debere akara ntụaka [a] na [b] n’ederede bụ isi.
