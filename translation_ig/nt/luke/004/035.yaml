revisions:
- from: Jizọs baara mmụọ ahụ mba, sị, “Daa jụụ[a], si n’ime ya pụta!” Mmụọ ọjọọ ahụ tụdara nwoke ahụ n’etiti ha, wee si n’ime ya pụta n’emerụghị ya ahụ ma ọlị.[b]
  to: Jizọs baara mmụọ ahụ mba, sị, “Mechie ọnụ gị[a], sikwa n’ime ya pụta!” Mmụọ ọjọọ ahụ tụdara nwoke ahụ n’etiti ha, wee si n’ime ya pụta n’emerụghị ya ahụ ma ọlị.[b]
  rationale: The revision narrows the first imperative to the Greek’s explicit command for silence and improves the literal footnote’s Igbo idiom. The remaining wording preserves the source sequence and the Greek statement that the man was not harmed. “N’etiti ha” is retained as a natural contextual expression for εἰς τὸ μέσον without materially changing the scene.
