reference: Luke 4:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: ig
  text: Jizọs baara mmụọ ahụ mba, sị, “Mechie ọnụ gị[a], sikwa n’ime ya pụta!” Mmụọ ọjọọ ahụ tụdara nwoke ahụ n’etiti ha, wee si n’ime ya pụta n’emerụghị ya ahụ ma ọlị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “Ka e kechie gị ọnụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’emeghị ya ihe ọjọọ ọ bụla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: baara mmụọ ahụ mba
  rationale: “Ịbara mba” na-egosipụta okwu ike nke onye nwere ikike. Ikwughachi “mmụọ ahụ” kama naanị “ya” na-eme ka onye a na-agwa okwu doo anya n’Igbo.
- source_word: Φιμώθητι
  choice: Daa jụụ
  rationale: N’iwu a gbasara ikwu okwu, nke a bụ ụzọ Igbo dị mfe ma sie ike isi kwuo “kwụsị ikwu okwu.” Ihe oyiyi nkịtị nke ikekọta ọnụ ka e debere n’ala peeji.
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: si n’ime ya pụta
  rationale: Nke a na-egosipụta iwu kpọmkwem ka mmụọ ahụ hapụ nwoke ahụ, n’ụzọ Igbo na-ada nke ọma.
- source_word: ῥίψαν αὐτὸν
  choice: tụdara nwoke ahụ
  rationale: “Tụdara” na-egosipụta omume ike nke ῥίπτω. “Nwoke ahụ” na-ewepụ mgbagwoju anya nke ọtụtụ nnọchiaha n’Igbo n’etinyeghị onye ọhụrụ n’akụkọ ahụ.
- source_word: εἰς τὸ μέσον
  choice: n’etiti ha
  rationale: “N’etiti ha” bụ ụzọ Igbo zuru oke ma bụrụ nke ebumpụta ụwa; “ha” na-ezo aka n’ọgbakọ ahụ nke ọnọdụ akụkọ na-egosi, ọ bụ ezie na a hapụrụ ya n’ụzọ nghọta n’asụsụ Grik.
- source_word: τὸ δαιμόνιον
  choice: Mmụọ ọjọọ ahụ
  rationale: “Mmụọ ọjọọ” bụ okwu Igbo doro anya ma bụrụ nke a na-aghọta nke ọma maka δαιμόνιον n’ọnọdụ a.
- source_word: μηδὲν βλάψαν αὐτόν
  choice: n’emerụghị ya ahụ ma ọlị
  rationale: Nke a na-egosipụta na, n’agbanyeghị na mmụọ ahụ tụdara nwoke ahụ, o merụghị ya ahụ n’ụzọ ọ bụla.
theological_decisions:
- issue: Ụdị na omume nke δαιμόνιον n’akụkọ ịchụpụ mmụọ ọjọọ
  choice: Ịsụgharị ya dịka “mmụọ ọjọọ” ma debe na Jizọs gwara ya okwu kpọmkwem nakwa na o si n’ime nwoke ahụ pụta.
  alternative: Ịsụgharị ya dịka ike ọjọọ na-abụghị mmụọ nwere onwe ya, ma ọ bụ dịka ọrịa uche naanị.
  rationale: Asụsụ Grik na-egosi onye a na-agwa okwu, onye e nyere iwu, ma kwuo na ọ pụrụ n’ime nwoke ahụ. Nsụgharị ekwesịghị iwepụ ụzọ akụkọ ahụ si kọwaa ihe merenụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “Daa jụụ” maka okwu nkịtị dị ire, ebe ala peeji na-echekwa ihe oyiyi nke “ikekọta ọnụ.” A kpọrọ nwoke ahụ aha n’ahịrị nke abụọ iji zere mgbagwoju anya nke nnọchiaha.
