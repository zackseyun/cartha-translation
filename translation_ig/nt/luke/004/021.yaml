  source_fidelity: The translation accurately represents the narrative transition, Jesus’ beginning to address the audience, the emphatic temporal ‘Taa,’ the completed-present force of πεπλήρωται (‘emezuola’), and the audience-oriented idiom ἐν τοῖς ὠσὶν ὑμῶν. ‘Ka unu na-anụ ya’ is a natural Igbo rendering of the hearing idiom without adding an explicit agent or explanation of fulfillment.
  naturalness: The wording is clear, modern Standard Igbo, and suitably reverent without being archaic. ‘Ọ malitere ịgwa ha, sị’ naturally introduces the quotation, and the final clause communicates the intended contemporaneous hearing context.
  terminology: ‘Ihe e dere n’Akwụkwọ Nsọ a’ appropriately identifies γραφὴ as the Scripture passage just read in context. ‘Emezuola’ retains the fulfillment language and does not impose a theological explanation beyond the Greek text.
