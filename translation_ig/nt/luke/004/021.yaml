  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: ig
  text: Mgbe ahụ, ọ malitere ịgwa ha, sị, “Taa, ihe e dere n’Akwụkwọ Nsọ a emezuola ka unu na-anụ ya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς
  choice: Mgbe ahụ, ọ malitere ịgwa ha, sị
  rationale: δὲ na-akwalite akụkọ ahụ n’ihu, ya mere ‘Mgbe ahụ’ dabara nke ọma. ‘Ọ malitere ịgwa ha, sị’ na-egosipụta ἤρξατο λέγειν πρὸς αὐτούς n’Igbo dị ndụ ma na-eduga nke ọma n’okwu e hotara.
- source_word: Σήμερον
  choice: Taa
  rationale: ‘Taa’ na-echekwa ọnọdụ okwu ahụ n’isi ahịrịokwu na ịdị ngwa nke nkwupụta Jizọs.
- source_word: πεπλήρωται
  choice: emezuola
  rationale: Ụdị ngwaa perfect passive na-egosi mmezu nke ruru ugbu a ma nweekwa nsonaazụ dị ugbu a. N’Igbo, ‘emezuola’ na-enye echiche a n’enweghị ịgbakwunye onye mere ka o mezuo.
- source_word: ἡ γραφὴ αὕτη
  choice: ihe e dere n’Akwụkwọ Nsọ a
  rationale: N’ebe a γραφή na-ezo aka n’ihe sitere n’Akwụkwọ Nsọ a ka gụrụ. Nkebiokwu a bụ nke doro ndị na-agụ Igbo anya ma na-echekwa echiche nke ihe odide dị nsọ.
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: ka unu na-anụ ya
  rationale: N'ụzọ nkịtị ọ bụ ‘n’ime ntị unu,’ ma ọ bụ akpaalaokwu na-egosi na mmezu ahụ na-eme mgbe ha na-anụ nkwupụta ahụ. ‘Ka unu na-anụ ya’ na-ebute echiche ahụ n’Igbo nkịtị.
theological_decisions:
- issue: Ụdị nkwupụta banyere mmezu Akwụkwọ Nsọ
  choice: E kwuru naanị na ihe e dere emezuola taa ka ndị na-ege ntị na-anụ ya.
  alternative: Ịgbasa ya ka ọ bụrụ, ‘Taa, amụma a emezuola site n’aka m ka unu na-anụ ya.’
  rationale: Grik ekwughị kpọmkwem ‘amụma’ ma ọ bụ ‘site n’aka m.’ Ọ bụ ezie na ihe ndị gbara amaokwu ahụ gburugburu na-egosi njikọ ya na Jizọs, nsụgharị ahụ ekwesịghị ịgbakwunye nkọwa ahụ ma mechie esemokwu na omimi dị n’okwu mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A zere ntụgharị nkịtị ‘n’ime ntị unu’ n’ihi na ọ naghị ada ka Igbo nkịtị; e zigara akpaalaokwu ahụ dịka ‘ka unu na-anụ ya.’
