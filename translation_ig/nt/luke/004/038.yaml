revisions:
- from: Mgbe o biliri, si n’ụlọ nzukọ pụọ, ọ banyere n’ụlọ Saịmọn. Nne nwunye Saịmọn nọ n’oké ahụ ọkụ, ha wee jụọ ya banyere ya.[a]
  to: Mgbe o si n’ụlọ nzukọ pụọ, ọ banyere n’ụlọ Saịmọn. Nne nwunye Saịmọn ahụ na-arịa oké ahụ ọkụ, ha wee jụọ ya banyere nwaanyị ahụ.[a]
  rationale: The revision improves Standard Igbo idiom and referential clarity while maintaining the source’s sequence and ambiguity. The main text continues to render ἠρώτησαν αὐτὸν περὶ αὐτῆς conservatively as asking Jesus about the woman; the footnote records the contextually likely appeal for help without making it the asserted wording of the verse.
