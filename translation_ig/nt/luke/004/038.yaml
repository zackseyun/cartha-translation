review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s sequence, Simon’s relationship to the sick woman, the severity of the fever, and the deliberately restrained wording of the request. However, the opening wording can imply merely standing up and is less natural than a direct departure-from-the-synagogue construction. The repeated pronouns in the final clause also obscure the referents.
  naturalness: “Nọ n’oké ahụ ọkụ” is understandable, but “na-arịa oké ahụ ọkụ” is more idiomatic contemporary Standard Igbo for being afflicted by a severe fever. Explicitly naming “nwaanyị ahụ” in the final clause improves clarity without adding information.
  terminology: “Nne nwunye Saịmọn” accurately identifies Simon’s wife’s mother and is suitable Standard Igbo. “Ụlọ nzukọ” and “oké ahụ ọkụ” are appropriate in register. The footnote should retain the Greek’s less explicit main sense while making the contextual alternative clear.
  issues:
  - severity: low
    issue: Opening temporal phrase is awkward and may overemphasize standing up.
    rationale: Ἀναστὰς ἀπὸ τῆς συναγωγῆς functions in context as departure from the synagogue. “Mgbe o si n’ụlọ nzukọ pụọ” is natural Igbo and retains the temporal sequence without importing a separate emphasis on standing.
  - severity: medium
    issue: Pronoun reference in “ha wee jụọ ya banyere ya” is unclear.
    rationale: The two occurrences of “ya” can leave readers uncertain which refers to Jesus and which to Simon’s mother-in-law. Replacing the second with “nwaanyị ahụ” preserves περὶ αὐτῆς exactly in sense while improving readability.
  - severity: low
    issue: Illness expression is less idiomatic than available alternative.
    rationale: “Na-arịa oké ahụ ọkụ” naturally conveys the passive-afflictive sense of ἦν συνεχομένη πυρετῷ μεγάλῳ.
  revised_text: Mgbe o si n’ụlọ nzukọ pụọ, ọ banyere n’ụlọ Saịmọn. Nne nwunye Saịmọn ahụ na-arịa oké ahụ ọkụ, ha wee jụọ ya banyere nwaanyị ahụ.[a]
