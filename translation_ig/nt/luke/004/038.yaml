source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: ig
  text: Mgbe o si n’ụlọ nzukọ pụọ, ọ banyere n’ụlọ Saịmọn. Nne nwunye Saịmọn ahụ na-arịa oké ahụ ọkụ, ha wee jụọ ya banyere nwaanyị ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha wee rịọ ya ka o nyere nwaanyị ahụ aka.” Okwu Grik ahụ pụtara n’ụzọ nkịtị, “ha jụrụ ya banyere ya,” ma n’ọnọdụ a, o yikarịrị ka ọ bụ arịrịọ ka o nyere nwaanyị ahụ aka.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: Mgbe o biliri, si n’ụlọ nzukọ pụọ
  rationale: Aorist participle ahụ na-egosi ihe mere tupu isi ngwaa ahụ; “mgbe o biliri” na-egosi usoro oge ahụ n’Igbo dị mfe. “Si n’ụlọ nzukọ pụọ” na-egosikwa ngagharị site n’ebe ahụ.
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: ọ banyere n’ụlọ Saịmọn
  rationale: “Banyere n’ụlọ” bụ ụzọ Igbo doro anya si ekwu ịbanye n’ime ebe, ebe “ụlọ Saịmọn” na-egosi onye nwe ụlọ ahụ n’ụzọ ebumpụta ụwa.
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: Nne nwunye Saịmọn
  rationale: Okwu Grik πενθερά pụtara nne di ma ọ bụ nne nwunye; n’ebe a, “nne nwunye Saịmọn” na-egosi nne nke nwunye Saịmọn n’Igbo doro anya.
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: nọ n’oké ahụ ọkụ
  rationale: Nkebiokwu Grik ahụ na-akọwa na nnukwu ahụ ọkụ jidere ya. “Nọ n’oké ahụ ọkụ” bụ okwu Igbo dị mfe ma dịkwa ebube nke na-egosi ọrịa ahụ siri ike.
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: ha wee jụọ ya banyere ya
  rationale: Nke a na-anọ Grik nso, n’ihi na ἐρωτάω pụrụ ịpụta ịjụ ma ọ bụ ịrịọ. Ọnọdụ akụkọ ahụ na-egosi na o nwere ike ịbụ arịrịọ maka enyemaka, ma isi ederede anaghị akọwa nke ahụ karịa ka Grik mere.
theological_decisions:
- issue: Ihe okwu πενθερά na-egosi banyere alụmdi na nwunye Saịmọn
  choice: Ịsụgharị ya kpọmkwem dịka “nne nwunye Saịmọn” n’enweghị nkọwa ọzọ.
  alternative: Ịgbakwụnye n’ederede na Saịmọn lụrụ nwaanyị.
  rationale: Okwu ikwu ahụ n’onwe ya na-egosi mmekọrịta ezinụlọ ahụ, ma ekwesịghị ịgbasa amaokwu ahụ site n’itinye nkwubi okwu ọzọ n’ime ya.
- issue: Ụdị arịrịọ dị na ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: “ha wee jụọ ya banyere ya” n’isi ederede.
  alternative: “ha wee rịọ ya ka o nyere ya aka.”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi arịrịọ maka enyemaka ma ọ bụ ọgwụgwọ, ma okwu Grik ahụ anaghị ekwu ya hoo haa. Nsụgharị a na-echekwa obosara ihe okwu ahụ pụrụ ịpụta, ebe nkọwa ala peeji na-egosi nghọta ọzọ dabara n’ọnọdụ ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù, mee ihe. E debere mgbagwoju pụtara dị n’ọrụ ἐρωτάω n’isi ederede ma kọwaa nghọta arịrịọ ahụ n’ala peeji.
