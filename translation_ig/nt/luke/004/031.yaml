- from: Ọ gbadara gaa Kapanọm, obodo dị na Galili. Ọ nọkwa na-akụziri ha ihe n’ụbọchị izu ike dị iche iche.
  to: Ọ gbadara gaa Kapanọm, obodo dị na Galili. Ọ na-akụziri ha ihe n’ụbọchị izu ike[a].
  rationale: E wepụrụ “dị iche iche” n’ederede n’ihi na ọ na-agbakwunye echiche ‘various/different’ nke isi Grik anaghị ekwu. A na-eji “n’ụbọchị izu ike” eme ihe n’ụzọ Igbo nkịtị, ebe ndetu e jikọtara kpọmkwem na nkebi ahụ na-edobe plural Grik na echiche ya nwere ike ịbụ nke ugboro ugboro. E mekwara ahịrị nke abụọ ka ọ bụrụ Igbo dị mfe ma na-echekwa omume na-aga n’ihu ma ọ bụ nke a na-eme ugboro ugboro.
