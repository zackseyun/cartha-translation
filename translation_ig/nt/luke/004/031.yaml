  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: ig
  text: Ọ gbadara gaa Kapanọm, obodo dị na Galili. Ọ na-akụziri ha ihe n’ụbọchị izu ike[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, okwu a dị n’ụdị ọtụtụ: “n’ụbọchị izu ike dị iche iche” n’echiche nke ugboro ugboro, ma ọ bụ “n’ụbọchị izu ike” dịka okwu a na-ekwu n’ozuzu ya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατῆλθεν
  choice: gbadara gaa
  rationale: Nke a na-echekwa echiche ngagharị ịgbada dị na κατέρχομαι ma na-ada nke ọma n’Igbo.
- source_word: Καφαρναοὺμ
  choice: Kapanọm
  rationale: E ji ụdị nsụgharị aha obodo a a na-anabata n’Igbo mee ihe.
- source_word: πόλιν τῆς Γαλιλαίας
  choice: obodo dị na Galili
  rationale: Nke a na-enye anarthrous πόλιν nghọta na-abụghị otu obodo a kapịrị ọnụ, ma na-egosikwa njikọ ebe nke genitive τῆς Γαλιλαίας n’Igbo nkịtị.
- source_word: ἦν διδάσκων
  choice: ọ nọkwa na-akụziri
  rationale: Nhazi ‘nọ na-akụziri’ na-echekwa omume na-aga n’ihu nke imperfect periphrastic Grik.
- source_word: αὐτοὺς
  choice: ha
  rationale: A hapụrụ ya dị ka nnọchiaha n’etinyeghị ‘ndị mmadụ’ ma ọ bụ otu ndị ọzọ isi mmalite ahụ na-akọwaghị.
- source_word: ἐν τοῖς σάββασιν
  choice: n’ụbọchị izu ike dị iche iche
  rationale: Ụdị a na-echekwa plural σάββασιν na nghọta ya dịka ọtụtụ oge e mere ihe ahụ, ma na-eji okwu Igbo onye nkịtị ga-aghọta.
theological_decisions:
- issue: Ma a ga-eme ka plural σάββασιν bụrụ singular n’Igbo
  choice: n’ụbọchị izu ike dị iche iche
  alternative: n’ụbọchị izu ike
  rationale: Plural ahụ nwere ike igosi na Jizọs kụziri ha ugboro ugboro n’ụbọchị izu ike. Idebe ya na-egbochi ime ka usoro ozi ya yie naanị otu ihe mere otu ugboro.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji ‘ụbọchị izu ike’ mee ka Sabbath doo onye Igbo nkịtị anya, ebe ‘dị iche iche’ na-echekwa plural nke Grik na-enweghị ụkwụokwu.
