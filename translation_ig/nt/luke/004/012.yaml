  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: ig
  text: 'Jizọs zara ya, sị: “E kwuola[a]: ‘Etinyela Onyenwe gị, bụ Chineke gị, n’ule.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ntụgharị ọdịnala na-enwekarị, “E dere ya.” Ma Grik ebe a ji okwu pụtara “E kwuola” ma ọ bụ “E kwuwo ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: zara ya sị
  rationale: Ngwakọta participle na ngwaa a bụ usoro Grik nwere mmetụta asụsụ Semitik nke pụtara ịza ma ọ bụ ịsị na nzaghachi. ‘Zara ya sị’ bụ okwu Igbo doro anya ma bụrụkwa nke e ji ewebata ihe onye ahụ kwuru.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha dative a na-ezo aka n’ekwensu, onye Jizọs na-aza n’akụkụ okwu a.
- source_word: ὅτι
  choice: sị
  rationale: N’Igbo, ‘sị’ na-ewebata ọdịnaya nke nzaghachi ahụ n’ụzọ ebumpụta ụwa; ọ dịghị mkpa ịgbakwunye okwu ọzọ kwekọrọ kpọmkwem na ‘na’.
- source_word: Εἴρηται
  choice: E kwuola
  rationale: Perfect passive nke λέγω pụtara na e kwuola ihe ahụ, ya bụ, okwu ahụ ka dị irè. Nke a na-edobe ‘kwuru’ nke dị na Grik kama iji okwu pụtara kpọmkwem ‘e dere ya.’
- source_word: Οὐκ ἐκπειράσεις
  choice: Etinyela … n’ule
  rationale: ἐκπειράζω pụtara ịnwa ma ọ bụ itinye onye n’ule. Usoro iwu ‘Etinyela … n’ule’ bụ Igbo doro anya ma na-ezere nghọta nke ịrafu Chineke ime mmehie.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo a na-ahụkarị ma dị ùgwù maka κύριος n’ebe a, ma na-agbaso ụdị Grik nke amaokwu ahụ.
- source_word: τὸν θεόν σου
  choice: bú Chineke gị
  rationale: Nkebiokwu a kọwara onye ‘Onyenwe anyị’ bụ. ‘bú Chineke gị’ na-edobe nnọchiaha nke onye nke abụọ na mmekọrịta ọgbụgba ndụ dị n’okwu ahụ.
theological_decisions:
- issue: Usoro e ji kpọtụrụ Akwụkwọ Nsọ (Εἴρηται)
  choice: E kwuola
  alternative: E dere ya
  rationale: Grik ji perfect passive nke λέγω (‘ikwu’), ọ bụghị γράφω (‘ide’). Ya mere, isiokwu ahụ na-edobe echiche ‘e kwuola,’ ebe nkọwa ala peeji na-egosi ụdị ọdịnala ndị na-agụ akwụkwọ nwere ike ịma.
- issue: Ntụgharị κύριος n’okwu e hotara na Diuterọnọmi 6:16
  choice: Onyenwe anyị
  alternative: YHWH
  rationale: Ihe odide Grik nwere κύριον, ya mere a tụgharịrị ya ‘Onyenwe anyị.’ Otú ọ dị, ebe Hibru e si hota okwu a nwere aha Chineke YHWH; a kọwara njikọ ahụ n’ala peeji n’ebughị ya n’isiokwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Zara ya sị’ na-eme ka usoro okwu ahụ bụrụ nke ebumpụta ụwa n’Igbo; ‘Etinyela … n’ule’ na-echekwa echiche ule siri ike n’enweghị mgbakwunye nkọwa okpukpe na-adịghị na isi mmalite.
