id: LUK.4.6
reference: Luke 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: ig
  text: Ekwensu wee sị ya, “Ọ bụ gị ka m ga-enye ikike a niile na ebube ha[a], n’ihi na e nyefewo m ya, ana m enye onye ọ bụla m chọrọ ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịma mma ha.” Okwu Grik ahụ pụrụ ịpụta ebube, ịma mma, ma ọ bụ ịdị ukwuu n’ọnọdụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: Ekwensu
  rationale: N’akụkọ ọnwụnwa a, okwu ahụ bụ aha a maara nke ọma maka Setan dị ka onye onwe ya, ọ bụghị naanị nkọwa pụtara ‘onye nkwutọ.’
- source_word: Σοὶ δώσω
  choice: Aga m enye gị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’okwu Grik nke na-emesi onye a ga-enye ihe ike.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: ‘Ikike’ na-egosi ikike ịchị ma ọ bụ ikike e nyere mmadụ, ọ bụghị naanị ike anụ ahụ.
- source_word: ταύτην ἅπασαν
  choice: a niile
  rationale: Ọ na-echekwa echiche nke ihe ahụ dum e gosiri n’amaokwu bu ụzọ.
- source_word: δόξαν αὐτῶν
  choice: ebube ha
  rationale: ‘Ebube’ nwere ike ịpụta otuto, ịma mma dị ukwuu, ma ọ bụ ịdị ebube nke alaeze ndị ahụ; ‘ha’ na-ezo aka n’alaeze ndị a kpọtụrụ aha n’amaokwu nke 5.
- source_word: παραδέδοται
  choice: e nyefewo m ya
  rationale: Ụdị okwu a na-echekwa olu nnara na echiche nke ihe e mere n’oge gara aga nke nsonaazụ ya ka dị ugbu a, n’enweghị ịkwado izi ezi nke nkwupụta Ekwensu.
- source_word: ᾧ ἂν θέλω
  choice: onye ọ bụla m chọrọ
  rationale: Nke a na-egosi na, dịka nkwupụta Ekwensu si dị, ọ pụrụ ịhọrọ onye ọ ga-enye ya.
- source_word: δίδωμι αὐτήν
  choice: ana m enyekwa ya
  rationale: Oge ugbu a na Grik na-egosi omume izugbe ma ọ bụ nke a na-emekarị; ụdị Igbo a na-egosipụta ya nke ọma.
theological_decisions:
- issue: Ma ntụgharị ahụ ò kwesịrị igosi na nkwupụta Ekwensu banyere ikike o nwere n’ebe alaeze ndị ahụ nọ bụ eziokwu
  choice: E gosipụtara okwu ahụ ozugbo dịka nkwupụta Ekwensu, n’etinyeghị okwu ga-akwado ma ọ bụ gọnahụ ya.
  alternative: Ịgbakwunye okwu dịka ‘ọ sịrị na’ ma ọ bụ ‘ọ na-azọrọ na’ iji kewapụ onye na-akọ akụkọ na nkwupụta ahụ.
  rationale: Grik nyere ya dịka okwu Ekwensu kwuru ozugbo. Ịmata onye na-ekwu okwu ezuru ime ka o doo anya na nke a bụ nkwupụta ya; ntụgharị ekwesịghị idozi esemokwu nkà mmụta okpukpe nke ederede hapụrụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Nhazi ahịrịokwu ahụ bụ nke nkịtị n’Igbo, ma e chekwara njikọ okwu na nrụgide dị n’isi mmalite.
