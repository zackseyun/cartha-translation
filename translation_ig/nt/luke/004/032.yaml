  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: ig
  text: Nkuzi ya juru ha anya, n’ihi na okwu ya nwere ikike.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “n’ihi na o ji ikike kwuo okwu” ma ọ bụ “n’ihi na ozi ya nwere ikike.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: juru ha anya
  rationale: Nkebi okwu a na-egosi na ihe ha nụrụ tụrụ ha n’anya nke ukwuu; ụdị ngwaa Grik ahụ na-egosikwa mmeghachi omume na-aga n’ihu n’akụkọ ahụ.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: Okwu nkuzi ya ... juru ha anya
  rationale: Nke a na-egosi na ihe kpatara ma bụrụ isi ihe juru ha anya bụ nkuzi ya; nhazi a bụ Igbo nkịtị ma doo anya.
- source_word: διδαχῇ
  choice: okwu nkuzi
  rationale: “Okwu nkuzi” nwere ike ịgụnye ma omume izi ihe ma ihe a na-akụzi, dịka okwu Grik si kwe omume.
- source_word: ὅτι
  choice: n’ihi na
  rationale: N’ebe a, okwu ahụ na-ewebata ihe mere nkuzi ya ji ju ha anya.
- source_word: ἐν ἐξουσίᾳ
  choice: nwere ikike
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji ekwu na okwu mmadụ nwere ike na ikike, n’enweghị ịgbakwunye nkọwa nkà mmụta okpukpe.
- source_word: ὁ λόγος αὐτοῦ
  choice: okwu ya
  rationale: “Okwu ya” na-edobe mkpụmkpụ nke Grik ma nwee ike ịpụta okwu ọ kwuru ma ọ bụ ozi ya.
theological_decisions:
- issue: Ụdị ikike dị n’okwu Jizọs
  choice: okwu ya nwere ikike
  alternative: o ji ikike kwuo okwu / ozi ya bụ nke nwere ikike
  rationale: Amaokwu ahụ kwuru na okwu Jizọs nwere ikike, ma ọ kọwaghị kpọmkwem ebe ikike ahụ si bịa. Nsụgharị a na-edobe nkwupụta ahụ n’enweghị ịgbakwunye nkọwa banyere ọdịdị chi ya ma ọ bụ isi mmalite ikike ya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. E ji “okwu nkuzi” mee ka διδαχή doo anya, ma e debere “okwu ya” maka λόγος αὐτοῦ ka nghọtahie dị n’etiti okwu e kwuru na ozi ghara ịla n’iyi.
