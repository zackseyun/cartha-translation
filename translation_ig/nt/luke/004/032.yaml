- from: Okwu nkuzi ya juru ha anya, n’ihi na okwu ya nwere ikike.[a]
  to: Nkuzi ya juru ha anya, n’ihi na okwu ya nwere ikike.[a]
  rationale: The revision replaces the less natural “Okwu nkuzi ya” with “Nkuzi ya,” a direct and idiomatic rendering of διδαχή. It retains “okwu ya nwere ikike” to preserve the Greek statement that his word was characterized by authority, without expanding its theological basis. The footnote remains a valid presentation of natural lexical and syntactic alternatives.
