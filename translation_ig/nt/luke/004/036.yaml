  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: ig
  text: Ịtụnanya jidere mmadụ niile, ha na-agwa ibe ha okwu, sị, “Okwu[a] a bụ ụdị gịnị, na o ji ikike na ike na-enye mmụọ ndị na-adịghị ọcha iwu, ha na-apụtakwa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ozi a bụ ụdị gịnị?” Okwu Grik bụ logos, nke pụrụ ịpụta “okwu,” “ozi,” ma ọ bụ “ihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θάμβος
  choice: oke ihe ijuanya
  rationale: Nkebiokwu a na-egosi mmetụta siri ike nke ịtụ n’anya; ọ bụkwa okwu Igbo doro anya ma dị ebube.
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: jidere mmadụ niile
  rationale: N’Igbo, ikwu na ihe ijuanya ‘jidere’ mmadụ na-egosi nke ọma na mmetụta ahụ bịakwasịrị ha niile, n’enweghị nsụgharị siri ike ma na-adịghị eke.
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: ha wee na-agwa ibe ha
  rationale: ‘Na-agwa’ na-egosipụta omume na-aga n’ihu nke imperfect, ebe ‘ibe ha’ na-echekwa echiche nke mkparịta ụka n’etiti ha.
- source_word: Τίς ὁ λόγος οὗτος
  choice: Okwu dị aṅaa bụ nke a?
  rationale: Nsụgharị a na-egosipụta ajụjụ banyere ụdị na ọdịdị okwu ahụ, ma hapụkwa λόγος ka ọ nwee obosara ya dịka okwu, ozi, ma ọ bụ ihe e kwuru.
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: ji ikike na ike
  rationale: ‘Ji’ na-egosi ụzọ ma ọ bụ ihe e ji eme ihe; ‘ikike na ike’ na-echekwa ọdịiche na usoro dị n’etiti ἐξουσία na δύναμις.
- source_word: ἐπιτάσσει
  choice: enye ... iwu
  rationale: Nke a bụ ụzọ Igbo e si ekwu ‘inye iwu’ nke ọma, ma na-echekwa ike iwu dị na ngwaa Grik.
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: mmụọ ndị na-adịghị ọcha
  rationale: Nke a na-echekwa okwu gbasara ịdị ọcha dị na ἀκάθαρτος na ọnọdụ akụkọ ịchụpụ mmụọ ọjọọ, kama ịkọwa ya n’ụzọ ọzọ.
- source_word: ἐξέρχονται
  choice: ha ana-apụtakwa
  rationale: ‘Na-apụta’ bụ okwu Igbo eke maka mmụọ ndị ahụ isi n’ime mmadụ pụta; ‘-kwa’ jikọtara nsonaazụ ahụ na iwu e nyere ha.
theological_decisions:
- issue: Aha e nyere ndị mmụọ n’akụkọ ịchụpụ mmụọ ọjọọ
  choice: mmụọ ndị na-adịghị ọcha
  alternative: mmụọ rụrụ arụ
  rationale: Nhọrọ a na-agbaso kpọmkwem asụsụ Grik na echiche Akwụkwọ Nsọ banyere ịdị ọcha, ma ghara ime ka ndị mmụọ ahụ bụrụ nanị ihe atụ nke ọnọdụ uche.
- issue: Mmekọrịta dị n’etiti ikike na ike
  choice: ikike na ike
  alternative: ike ọchịchị na ike dị ukwuu
  rationale: Idobe okwu abụọ ahụ iche na-echekwa esemokwu bara uru dị n’etiti ikike ziri ezi na ike na-arụpụta ihe, n’etinyeghị nkọwa okwukwe ọzọ n’ime amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ebube. E kewara ajụjụ ahụ ụzọ abụọ n’akara edemede ka ọ daa nke ọma n’Igbo, ebe ahịrịokwu nke abụọ ka na-akọwa ihe mere okwu ahụ ji ju ha anya. Akara nkọwa ala [a] dị n’akụkụ ‘Okwu,’ bụ́ ebe nghọtahie lexical ahụ dị.
