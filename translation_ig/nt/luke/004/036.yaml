- from: Oke ihe ijuanya jidere mmadụ niile, ha wee na-agwa ibe ha, sị, “Okwu[a] dị aṅaa bụ nke a? O ji ikike na ike enye mmụọ ndị na-adịghị ọcha iwu, ha ana-apụtakwa!”
  to: Ịtụnanya jidere mmadụ niile, ha na-agwa ibe ha okwu, sị, “Okwu[a] a bụ ụdị gịnị, na o ji ikike na ike na-enye mmụọ ndị na-adịghị ọcha iwu, ha na-apụtakwa?”
  rationale: The revision retains the draft's accurate key terminology while making the dialogue a single Igbo question, as in Greek. It also uses more idiomatic wording for the ongoing mutual conversation and avoids adding an explicit intensifier to θάμβος. The footnote remains anchored to “Okwu” and preserves the stated lexical alternatives for logos.
