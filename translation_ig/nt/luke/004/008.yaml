  rationale: The revision removes an unexpressed reference to Scripture from the Greek citation formula while retaining a natural Igbo introduction, “E dere, sị.” It also improves the wording of the Deuteronomy cross-reference note. The rendering of the two distinct worship/service verbs, the exclusivity of “naanị ya,” and the existing footnote anchors are retained.
