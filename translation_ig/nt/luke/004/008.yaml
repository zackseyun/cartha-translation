id: LUK.4.8
reference: Luke 4:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: ig
  text: 'Jizọs zara ya, sị, “E dere, sị: ‘Ị ga-efe[a] Onyenweanyị bụ́ Chineke gị[b], ọ bụkwa naanị ya ka ị ga-ejere ozi.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “Ị ga-akpọ isiala nye Onyenweanyị bụ́ Chineke gị.”
    reason: lexical_alternative
  - marker: b
    text: Ihe e hotara a na-ezo aka na Diuterọnọmi 6:13.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτῷ
  choice: zara ya, sị
  rationale: Nke a na-etinye participle na ngwaa bụ isi n’ụzọ Igbo si akọ okwu nke ọma, ma na-edobe echiche nke ịza onye ahụ kpọmkwem.
- source_word: Γέγραπται
  choice: E dere ya n’Akwụkwọ Nsọ
  rationale: Ọ bụ usoro e ji webata ihe e hotara n’Akwụkwọ Nsọ; ntụgharị a doro onye na-agụ Igbo anya ma na-egosi na ihe e dere ka nwere ikike.
- source_word: Κύριον
  choice: Onyenweanyị
  rationale: Aha Igbo a na-ahụkarị maka ‘Onyenwe’ na-ekwu maka Chineke ma na-edobe ibu okwu κύριος nwere n’ihe e hotara n’Akwụkwọ Nsọ.
- source_word: θεόν σου
  choice: bụ́ Chineke gị
  rationale: 'Ọ na-edobe njikọ nke apposition na nnọchiaha nke onye nwe: Onyenweanyị, ya bụ Chineke gị.'
- source_word: προσκυνήσεις
  choice: Ị ga-efe
  rationale: N’ọnọdụ a, okwu ahụ na-egosi ofufe a na-enye Chineke; ‘ife’ bụ okwu Igbo dị mkpirikpi ma doo anya. Ihe ọ pụtara n’ụzọ nkịtị karị, bụ́ ịkpọ isiala, dị n’ala ala peeji.
- source_word: λατρεύσεις
  choice: ị ga-ejere ozi
  rationale: Ọ na-egosi ọrụ a na-ejere chi; njikọ ya na ofufe na naanị ya na-eme ka ụdị ọrụ nsọ a pụta ìhè.
- source_word: μόνῳ
  choice: naanị ya
  rationale: E tinyere ‘naanị’ n’akụkụ ‘ya’ iji chekwaa nkwusi ike Grik na ọ bụ naanị Chineke ka a ga-ejere ozi.
theological_decisions:
- issue: Ịsụgharị κύριος n’ihe e hotara n’Akwụkwọ Nsọ nke na-ekwu maka Chineke
  choice: Onyenweanyị
  alternative: Onyeisi; YHWH
  rationale: Ihe odide Grik nke Luk nwere κύριον. Ya mere, a sụgharịrị okwu Grik ahụ dị ka ‘Onyenweanyị’ kama ibubata aha Hibru YHWH n’ime isi ederede Agba Ọhụrụ.
- issue: Mmekọrịta dị n’etiti ofufe na ijere Chineke ozi
  choice: E debeere ‘ife’ na ‘ijere ozi’ dị ka ngwaa abụọ
  alternative: Ijikọta ha ka ha bụrụ otu echiche
  rationale: Grik ji προσκυνέω na λατρεύω, bụ́ okwu abụọ nwere njikọ ma na-adịghị otu kpamkpam; ntụgharị ahụ na-echekwa ọdịiche na esemokwu echiche dị n’etiti ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Onyenweanyị’ bụ aha a maara nke ọma n’asụsụ ụka na n’Akwụkwọ Nsọ, ebe ‘E dere ya n’Akwụkwọ Nsọ’ na-eme ka usoro hotara ihe doo onye nkịtị anya.
