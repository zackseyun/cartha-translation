review_pass:
  verdict: revise
  source_fidelity: The main rendering accurately preserves Jesus’ response, the citation formula, worship, sacred service, and the exclusive force of μόνῳ. However, “n’Akwụkwọ Nsọ” explicitly adds “in Scripture/Bible,” which is not present in Γέγραπται, even though it is a conventional implication of the citation formula.
  naturalness: The verse is generally clear and appropriately formal Standard Igbo. “E dere, sị” is both idiomatic for a citation formula and closer to the Greek. The cross-reference note is more natural when it identifies the quotation directly rather than saying it “repeats” what was said.
  terminology: “Ife” and “ijere ozi” suitably distinguish προσκυνέω and λατρεύω. “Onyenweanyị” is retained as the established ecclesial/scriptural Igbo designation for “Lord” in reference to God; it should be read as a conventional title here, not as an added possessive pronoun. The footnote alternative correctly gives the more literal physical sense of προσκυνέω.
  issues:
  - severity: low
    issue: The citation formula adds “n’Akwụkwọ Nsọ.”
    rationale: Γέγραπται literally means “It is written.” Scripture is clearly implied by the context, but is not expressed in the Greek text. Removing the addition improves formal source fidelity without harming naturalness.
  - severity: low
    issue: The cross-reference footnote is somewhat awkward and imprecise in wording.
    rationale: “Ihe a e hotara na-emegharị ihe e kwuru” is less idiomatic and can suggest mere repetition. The verse is a quotation/allusion to Deuteronomy 6:13; a direct formulation is clearer.
