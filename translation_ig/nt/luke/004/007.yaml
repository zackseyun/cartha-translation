id: LUK.4.7
reference: Luke 4:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: ig
  text: Ya mere, ọ bụrụ na ị kpọọ isiala n'ihu m[a], ihe niile a ga-abụ nke gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “fee m ofufe.” Okwu Grik a nwere ike ịpụta ịkpọ isiala ma ọ bụ ife ofufe; n'ebe a, ihe gbara ya gburugburu na-egosi na Setan na-achọ ka e nye ya ofufe okpukpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: ị
  rationale: Nnọchiaha onye nke abụọ otu bụ nke e kwuru kpọmkwem maka imesi onye a na-agwa ike; n'Igbo, ‘ị’ na usoro okwu ahụ na-egosi nke a n'ụzọ eke.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi ihe si n'okwu onyinye dị n'amaokwu bu ụzọ pụta, ma na-edobe njikọ echiche ahụ nke ọma.
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Ọ na-ewebata ọnọdụ dịka ngwaa njikọ a dị n'asụsụ Grik si eme.
- source_word: προσκυνήσῃς
  choice: kpọọ isiala
  rationale: N'Igbo, ‘ịkpọ isiala’ nwere ike ịpụta ihulata n'ala n'ihu onye ma ọ bụ ife ya; ya mere ọ na-edobe obosara ihe okwu Grik προσκυνέω nwere ike ịpụta na ọnọdụ a.
- source_word: ἐνώπιον ἐμοῦ
  choice: nye m
  rationale: N'okwu Igbo ‘ịkpọ isiala nye m,’ ‘nye m’ na-egosi na ọ bụ Setan ka a ga-enye nkwanye ugwu ahụ, ma na-ada n'ụzọ eke karịa nsụgharị nkịtị ‘n'ihu m.’
- source_word: ἔσται σοῦ
  choice: ga-abụ nke gị
  rationale: Nke a na-egosipụta ọdịnihu na nwe ihe n'ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: πᾶσα
  choice: ihe niile a
  rationale: Ụdị nwanyị otu a na-alaghachi n'ihe niile a kpọtụrụ aha n'amaokwu bu ụzọ. ‘Ihe niile a’ na-eme ka ntụaka ahụ doo anya n'Igbo n'akwụnyeghị aha ọhụrụ.
theological_decisions:
- issue: Ma a ga-asụgharị προσκυνέω dịka mmegharị ahụ nkịtị ma ọ bụ dịka ofufe okpukpe
  choice: kpọọ isiala nye m
  alternative: fee m ofufe
  rationale: ‘Kpọọ isiala’ na-edobe ma echiche ihulata n'ala ma echiche inye ofufe. Ihe gbara amaokwu ahụ gburugburu, karịchaa nzaghachi Jizọs n'amaokwu na-esote, na-eme ka o doo anya na ihe Setan chọrọ bụ ofufe kwesịrị naanị Chineke, n'agbanyeghị na ahọpụtara okwu na-adịghị ehichapụ obosara okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. A họọrọ ‘kpọọ isiala’ iji chekwaa obosara okwu Grik, ebe ihe odide ala ala na-akọwa ihe ofufe pụtara n'ọnọdụ a.
