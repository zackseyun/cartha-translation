review_pass:
  verdict: revise
  source_fidelity: The conditional structure, future possession, and totality are conveyed accurately. However, ἐνώπιον ἐμοῦ means “before me/in my presence”; “nye m” (“to me”) shifts this spatial-relational phrase into an indirect-object relation. “n'ihu m” preserves the Greek directly and remains idiomatic with kpọọ isiala.
  naturalness: The revised sentence is natural, clear Standard Igbo and retains a suitably serious biblical register.
  terminology: “kpọọ isiala” is a viable rendering of προσκυνήσῃς that retains the gesture of obeisance, while the footnote appropriately supplies “fee m ofufe” for the religious-homage sense demanded by the immediate context. The footnote’s reference to Setan is contextually accurate without inserting it into the verse itself.
  issues:
  - severity: medium
    issue: The phrase “nye m” does not fully represent ἐνώπιον ἐμοῦ.
    rationale: Greek specifies that the act is performed “before me.” In Igbo, “n'ihu m” directly conveys this location/presence, whereas “nye m” primarily means “to me” and can obscure that element.
  revised_text: Ya mere, ọ bụrụ na ị kpọọ isiala n'ihu m[a], ihe niile a ga-abụ nke gị.
  revised_footnotes:
