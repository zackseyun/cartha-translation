revisions:
- from: Ha biliri ọtọ, chụpụ ya n’obodo ahụ, duru ya ruo na nsọtụ ugwu ahụ e wuru obodo ha n’elu ya, ka ha wee tụda ya n’ala.
  to: Ha biliri, chụpụ ya n’obodo ahụ, duru ya ruo na nsọtụ ugwu ahụ e wuru obodo ha n’elu ya, ka ha wee tụda ya site n’ugwu ahụ.
  rationale: The revision removes an idiomatically unnecessary intensifier and changes the final action from throwing Jesus onto the ground to throwing him down from the hill, preserving the source's hostile intended action and vertical sense without supplying ‘cliff.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:30:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the expulsion, leading to the hill's edge, the town built upon it, and the crowd's intended action. However, “tụda ya n’ala” means throwing him to the ground and fails to convey κατακρημνίσαι, throwing/casting someone down from a height. “Biliri ọtọ” is also redundant and not natural Standard Igbo.
  naturalness: Removing “ọtọ” yields idiomatic narrative Igbo. The revised wording keeps the syntax clear while expressly locating the downward throwing at the hill, rather than merely on the ground.
  terminology: “Chụpụ,” “obodo,” “duru,” and “nsọtụ ugwu” are suitable modern Standard Igbo choices. “Ka ha wee tụda ya site n’ugwu ahụ” conveys the lethal downward intent without adding an explicit “cliff,” which the Greek does not state independently.
  issues:
  - severity: medium
    issue: “tụda ya n’ala”
    rationale: This ordinarily means ‘throw him to the ground’; it loses the directional force of κατακρημνίσαι, which denotes casting him down from a height.
  - severity: low
    issue: “Ha biliri ọtọ”
    rationale: “Biliri” already expresses rising/standing up. Adding “ọtọ” is redundant and unnatural here.
  revised_text: Ha biliri, chụpụ ya n’obodo ahụ, duru ya ruo na nsọtụ ugwu ahụ e wuru obodo ha n’elu ya, ka ha wee tụda ya site n’ugwu ahụ.
  revised_footnotes: []
  revision_rationale: The revision removes an idiomatically unnecessary intensifier and changes the final action from throwing Jesus onto the ground to throwing him down from the hill, preserving the source's hostile intended action and vertical sense without supplying ‘cliff.’
