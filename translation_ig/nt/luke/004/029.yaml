reference: Luke 4:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: ig
  text: Ha biliri, chụpụ ya n’obodo ahụ, duru ya ruo na nsọtụ ugwu ahụ e wuru obodo ha n’elu ya, ka ha wee tụda ya site n’ugwu ahụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: Ha biliri ọtọ
  rationale: Na-egosi na ìgwè mmadụ ahụ biliri wee malite ime ihe ozugbo, n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: ἐξέβαλον
  choice: chụpụ ya
  rationale: “Chụpụ” na-egosi nchụpụ e ji ike mee ma zere ụda pụrụ iche nke okwu okpukpe.
- source_word: πόλεως
  choice: obodo
  rationale: “Obodo” bụ okwu Igbo nkịtị nke pụrụ ịpụta town ma ọ bụ city; o dabara Nazaret nke ọma n’ebe a.
- source_word: ἤγαγον
  choice: duru ya
  rationale: Nke a na-edobe ihe ἄγω pụtara n’ozuzu ya; “dọkpụrụ” ga-eme ka ike e ji mee ya pụta karịa ka ngwaa Grik ahụ kwuru kpọmkwem.
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: ruo na nsọtụ ugwu ahụ
  rationale: ὀφρύς nwere echiche nke ọnụ, ọnụ ọnụ, ma ọ bụ nsọtụ ebe dị elu; “nsọtụ ugwu” doro onye Igbo nke oge a anya.
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: e wuru obodo ha n’elu ya
  rationale: Na-edobe passive ahụ na αὐτῶν dị ka ihe nwe (“obodo ha”), ma na-asụ ya n’Igbo eke.
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: ka ha wee tụda ya n’ala
  rationale: “Ka ha wee” na-egosi ebumnuche dị n’ὥστε na infinitive; “tụda ya n’ala” na-egosi ịtụda mmadụ site n’ebe dị elu n’etinyeghị “ọnụ mmiri” ma ọ bụ “ugwu kpọdara akpọda” nke Grik na-ekwughị kpọmkwem.
theological_decisions:
- issue: Ogo ime ihe ike nke ìgwè mmadụ ahụ
  choice: E ji “chụpụ” na “tụda ya n’ala” gosi iwe na ebumnuche igbu ya site n’ihe ha mere.
  alternative: Ịsị “dọkpụrụ ya” ma ọ bụ kọwaa ya ozugbo dị ka “ha chọrọ igbu ya.”
  rationale: Amaokwu ahụ gosiri ebumnuche ọjọọ nke ọma, ma nsụgharị ekwesịghị itinye nkọwa ma ọ bụ ụdị ike ngwaa Grik na-ekwughị kpọmkwem.
- issue: Ma ὥστε ọ na-egosi ebumnuche ma ọ bụ nsonaazụ
  choice: “ka ha wee,” nke n’ebe a na-egosi ihe ha bu n’obi ime
  alternative: “nke mere na,” nke ga-eme ka ọ dị ka nsonaazụ e mezuru
  rationale: N’usoro akụkọ a, infinitive ahụ na-akọ ihe ìgwè ahụ chọrọ ime, ọ bụghị ihe ha rụzuru.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ọsọ na ike nke akụkọ Grik, na-ezere ma okwu ochie na nkọwa karịrị isi mmalite.
