id: LUK.4.20
reference: Luke 4:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: ig
  text: Mgbe ọ pịakọtachara akwụkwọ mpịakọta ahụ[a] ma nyeghachi ya onye na-enyere aka n’ụlọ nzukọ ndị Juu[b], ọ nọdụrụ ala. Anya mmadụ niile nọ n’ụlọ nzukọ ndị Juu ahụ legidere ya anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “akwụkwọ.” Okwu Grik ahụ nwere ike ịpụta ihe e dere ede n’ozuzu ya, ma n’ụlọ nzukọ ndị Juu n’oge ahụ, ihe a bụ akwụkwọ mpịakọta.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, onye na-enyere aka n’ụlọ nzukọ ndị Juu, onye ọrụ ya gụnyere ilekọta akwụkwọ mpịakọta.
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: chịkọtachara
  rationale: N’ebe a, okwu ahụ na-egosi ịchịkọta akwụkwọ mpịakọta mgbe a gụchara ya, ọ bụghị imechi akwụkwọ nwere ibe dịka akwụkwọ nke oge a.
- source_word: βιβλίον
  choice: akwụkwọ mpịakọta
  rationale: Ọ bụ ezie na okwu Grik a nwekwara ike ịpụta akwụkwọ n’ozuzu ya, akwụkwọ Aịzaya e ji agụ ihe n’ụlọ nzukọ ndị Juu n’oge ahụ bụ akwụkwọ mpịakọta.
- source_word: ἀποδοὺς
  choice: nyeghachi
  rationale: Nke a na-egosi na o nyereghachi ihe ahụ n’aka onye ji ya elekọta mgbe o jisịrị ya mee ihe.
- source_word: ὑπηρέτῃ
  choice: onye na-eje ozi
  rationale: N’ọnọdụ ụlọ nzukọ ndị Juu, nke a bụ onye na-enyere aka n’ozi ma na-elekọta akwụkwọ mpịakọta; okwu a anaghị eme ka ọ bụrụ ohu ma ọ bụ onye uwe ojii.
- source_word: ἐκάθισεν
  choice: ọ nọdụrụ ala
  rationale: Nke a na-akọ omume ahụ n’ụzọ doro anya ma kwekọọ n’asụsụ Igbo nkịtị.
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: Anya ndị niile nọ ...
  rationale: Nhọrọ a na-edebe ‘anya’ dịka isiokwu ahịrịokwu ma na-egosikwa na ọ gbasara mmadụ niile nọ ebe ahụ.
- source_word: ἀτενίζοντες
  choice: lekwasịrị ya anya
  rationale: Nke a na-egosi ile mmadụ anya nke ọma na n’esepụghị anya, n’enweghị itinye echiche iro n’ihe ahụ.
- source_word: συναγωγῇ
  choice: ụlọ nzukọ ndị Juu
  rationale: N’akụkọ a, okwu ahụ na-ezo aka n’ebe ndị Juu na-ezukọ maka ofufe na ịgụ Akwụkwọ Nsọ; ntụgharị a doro onye Igbo nke oge a anya.
theological_decisions:
- issue: Ụdị βιβλίον e ji eme ihe n’ụlọ nzukọ ndị Juu
  choice: akwụkwọ mpịakọta
  alternative: akwụkwọ
  rationale: Nhọrọ a na-egosipụta ụdị akwụkwọ a na-eji n’oge na ọnọdụ ahụ n’ụzọ ziri ezi, n’agbanyeghị na okwu Grik ahụ nwere ike ịpụta akwụkwọ n’ozuzu ya. Ọ naghị agbanwe isi ihe amaokwu ahụ pụtara.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘ụlọ nzukọ ndị Juu’ kama naanị ‘ụlọ nzukọ’ iji gbochie mgbagwoju anya, ma e debere ihe oyiyi doro anya nke anya mmadụ niile lekwasịrị Jizọs anya.
