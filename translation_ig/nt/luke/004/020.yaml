- from: Mgbe ọ chịkọtachara akwụkwọ mpịakọta ahụ[a] ma nyeghachi ya onye na-eje ozi[b], ọ nọdụrụ ala. Anya ndị niile nọ n’ụlọ nzukọ ndị Juu ahụ lekwasịrị ya anya.
