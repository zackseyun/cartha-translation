  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: ig
  text: Ọ wee guzoro n’elu ya, baara ahụ ọkụ ahụ mba, ahụ ọkụ ahụ wee hapụ ya.[a] O biliri ozugbo wee malite ijere ha ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, ahụ ọkụ ahụ bụ ihe Jizọs baara mba, ọ bụkwa ya ka e gosiri dịka ihe hapụrụ nwanyị ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: guzoro n’elu ya
  rationale: Nke a na-echekwa ọnọdụ Jizọs n’ebe nwanyị ahụ nọ n’ụzọ dị nkenke, na-agbakwụnyeghị ihe dị ka ihe ndina ma ọ bụ hulata, nke ederede Grik ekwughị.
- source_word: ἐπετίμησεν
  choice: baara ... mba
  rationale: Akpaokwu Igbo a na-egosi ịbara mba n’ike ma na-echekwa ụda iwu na ikike dị na ngwaa Grik ahụ.
- source_word: τῷ πυρετῷ
  choice: ahụ ọkụ ahụ
  rationale: “Ahụ ọkụ” bụ okwu Igbo nkịtị maka fever; iji njirimara “ahụ” na-egosi na ọ bụ ahụ ọkụ ahụ ka Jizọs baara mba kpọmkwem.
- source_word: ἀφῆκεν αὐτήν
  choice: ahụ ọkụ ahụ wee hapụ ya
  rationale: Ikwughachi “ahụ ọkụ ahụ” na-eme ka isiokwu ngwaa doo anya n’Igbo ma na-echekwa otú Grik si gosi na ahụ ọkụ ahụ hapụrụ nwanyị ahụ.
- source_word: παραχρῆμα
  choice: ozugbo
  rationale: “Ozugbo” na-egosi na mgbake ahụ mere n’otu ntabi anya, dịka adverb Grik si mesie ya ike.
- source_word: ἀναστᾶσα
  choice: O biliri
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’omume nwanyị ahụ mgbe ahụ ọkụ hapụrụ ya.
- source_word: διηκόνει αὐτοῖς
  choice: malite ijere ha ozi
  rationale: “Malite ijere ha ozi” na-egosi mmalite nke omume na-aga n’ihu nke imperfect Grik nwere ike igosi, na-enweghị itinye echiche ọkwa ụka n’okwu ahụ.
theological_decisions:
- issue: Ma ịbara ahụ ọkụ mba ọ̀ na-egosi na ahụ ọkụ ahụ bụ mmụọ ọjọọ ma ọ bụ na e mere ya ka ihe nwere ndụ
  choice: E chekwara okwu kpọmkwem bụ “baara ahụ ọkụ ahụ mba” n’enweghị nkọwa ọzọ.
  alternative: “O nyere ahụ ọkụ ahụ iwu siri ike” ma ọ bụ ịkọwa ọrịa ahụ dịka mmụọ ọjọọ.
  rationale: Grik kwuru kpọmkwem na Jizọs baara ahụ ọkụ ahụ mba. Nsụgharị ahụ na-echekwa ngosipụta ikike ya, ma ọ naghị ekpebi ma ọrịa ahụ ò sitere n’aka mmụọ ọjọọ ma ọ bụ na e ji naanị asụsụ mmebe mmadụ kọwaa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ijere ha ozi” kama okwu nwere ike ịpụta ọrụ ọchịchị ụka, ma e chekwara ihe oyiyi na esemokwu dị n’okwu Grik.
