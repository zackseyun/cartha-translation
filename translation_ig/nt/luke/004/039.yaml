review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the sequence: Jesus stood over the woman, rebuked the fever, the fever left her, and she rose immediately. Repeating “ahụ ọkụ ahụ” appropriately makes explicit the Greek’s implied subject of “hapụrụ ya,” without adding a claim about demonic causation. The immediate action expressed by παραχρῆμα is retained.'
  naturalness: The final clause needs a connective before “malite.” In Standard Igbo, “O biliri ozugbo malite...” is less natural and reads as syntactically incomplete. “O biliri ozugbo wee malite ijere ha ozi” is fluent and preserves the intended inceptive/ongoing sense of the imperfect διηκόνει.
  terminology: “Ahụ ọkụ” is the standard natural term for “fever,” and “baara ... mba” suitably represents ἐπετίμησεν without interpreting the fever as a spirit. “Ijere ha ozi” is clear, respectful, and avoids unnecessarily ecclesiastical terminology.
  issues:
  - severity: low
    issue: Missing connective in the final clause
    rationale: 'Add “wee” between “ozugbo” and “malite” for idiomatic Standard Igbo syntax: “O biliri ozugbo wee malite ijere ha ozi.”'
