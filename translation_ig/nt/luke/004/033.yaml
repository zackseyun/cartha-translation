  to: N’ime ụlọ nzukọ ahụ, e nwere otu nwoke nke nwere mmụọ nke mmụọ ọjọọ na-adịghị ọcha[a], o wee jiri oké olu tie mkpu[b],
  rationale: A single, limited revision moves 'na-adịghị ọcha' so that it modifies the Igbo expression corresponding to δαιμονίου, in line with the Greek grammar. The sentence otherwise preserves the draft’s clear Standard Igbo wording, narrative register, and both footnote anchors.
