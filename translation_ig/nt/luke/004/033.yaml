  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: ig
  text: N’ime ụlọ nzukọ ahụ, e nwere otu nwoke nke nwere mmụọ nke mmụọ ọjọọ na-adịghị ọcha[a], o wee jiri oké olu tie mkpu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ ọjọọ na-adịghị ọcha.” Okwu Grik ahụ nwere ma okwu “mmụọ” ma okwu “mmụọ ọjọọ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ ọzọ, “o wee tie mkpu n’oké olu.”
    reason: previous_rendering
lexical_decisions:
- source_word: συναγωγῇ
  choice: ụlọ nzukọ
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ebe ndị Juu na-ezukọ maka ofufe na nkuzi; ọ dabara n’ọnọdụ akụkọ a.
- source_word: ἄνθρωπος
  choice: otu nwoke
  rationale: N’akụkọ a, okwu ahụ na-ezo aka n’otu nwoke, ọ bụghị mmadụ n’ozuzu.
- source_word: ἔχων
  choice: nke nwere
  rationale: Nke a na-edobe ihe participle Grik ahụ kwuru n’enweghị ịgbakwụnye nkọwa siri ike dịka ‘mmụọ ọjọọ ji ya.’
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: mmụọ na-adịghị ọcha nke mmụọ ọjọọ
  rationale: Nsụgharị a na-edobe ma πνεῦμα (‘mmụọ’) ma δαιμόνιον (‘mmụọ ọjọọ’), ma na-egosikwa njikọ genitive dị n’okwu Grik ahụ n’ụzọ Igbo nwere ike ịghọta.
- source_word: ἀνέκραξεν
  choice: tie mkpu
  rationale: Ọ bụ ụzọ Igbo sitere n’okike e si akọ iti mkpu n’ike.
- source_word: φωνῇ μεγάλῃ
  choice: jiri oké olu
  rationale: Nke a na-edobe ihe oyiyi doro anya nke ‘olu ukwu’ ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Otú e si sụgharịa okwu metụtara mmụọ ọjọọ
  choice: mmụọ na-adịghị ọcha nke mmụọ ọjọọ
  alternative: mmụọ ọjọọ na-adịghị ọcha
  rationale: Okwu Grik ahụ kpọrọ ma ‘mmụọ’ ma ‘mmụọ ọjọọ’ aha. Nsụgharị a anaghị ehichapụ otu n’ime ha ma ọ bụ tinye ozizi ọzọ karịrị ihe ederede kwuru.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugwu ma dị mfe nghọta. ‘Ụlọ nzukọ’ na-enye ebe ndị Juu na-ezukọ n’ofufe; ahịrịokwu ahụ na-edobe ntakịrị ihe mgbagwoju anya dị n’okwu Grik banyere ‘mmụọ’ na ‘mmụọ ọjọọ.’
