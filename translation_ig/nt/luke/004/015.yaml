  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: ig
  text: Ọ nọkwa na-ezi ihe n’ụlọ nzukọ ha, mmadụ niile na-enyekwa ya otuto.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mmadụ niile na-etokwa ya,” ma ọ bụ, “mmadụ niile na-asọpụrụkwa ya.” Okwu Grik δοξαζόμενος nwere ike ịpụta otuto ma ọ bụ nsọpụrụ a na-enye mmadụ n’ihu ọha; “na-enyekwa ya otuto” na-edobe njikọ okwu ahụ na echiche banyere ebube.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: nokwa
  rationale: Ọ na-ejikọta amaokwu a na akụkọ bu ya ụzọ n’enweghị ịgbakwụnye oge ma ọ bụ usoro ihe ndị Grik ekwughị.
- source_word: αὐτὸς
  choice: Ọ
  rationale: Nnọchiaha ahụ na-ezo aka na Jizọs. Igbo achọghị ka e tinye ‘ya onwe ya’ ebe a, n’ihi na nke ahụ ga-eme ka nkwusi ike karịa nke ederede Grik chọrọ.
- source_word: ἐδίδασκεν
  choice: nọ na-ezi ihe
  rationale: Ụdị ngwaa imperfect na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro n’oge gara aga; ‘nọ na-ezi ihe’ na-egosipụta akụkụ a nke ọma.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: n’ụlọ nzukọ ha
  rationale: Nke a bụ ntụgharị ebumpụta ụwa nke na-edobe ma ebe ihe ahụ mere ma nnọchiaha ‘ha.’ N’okwu a, ‘ụlọ nzukọ’ na-ezo aka n’ụlọ nzukọ ndị Juu.
- source_word: δοξαζόμενος
  choice: na-enyekwa ya otuto
  rationale: Nkebiokwu a na-egosi na ndị mmadụ na-enye Jizọs otuto ma ọ bụ nsọpụrụ. Ịsụ ya n’ụdị na-arụ ọrụ bụ Igbo ebumpụta ụwa, ebe ‘otuto’ na-edobe njikọ ya na echiche banyere ebube.
- source_word: ὑπὸ πάντων
  choice: mmadụ niile
  rationale: ὑπό tinyere genitive na-egosi ndị mere omume ahụ. ‘Mmadụ niile’ na-egosipụta nnabata zuru ebe niile n’enweghị ịkọwapụta ya karịa ihe ederede kwuru.
theological_decisions:
- issue: Otú e si tụgharị δοξαζόμενος mgbe ọ na-ekwu banyere Jizọs
  choice: mmadụ niile na-enyekwa ya otuto
  alternative: mmadụ niile na-etokwa ya; mmadụ niile na-asọpụrụkwa ya
  rationale: N’okwu a, δοξάζω nwere ike ịpụta otuto ma ọ bụ nsọpụrụ ọha na-enye Jizọs n’ihi nkuzi ya. ‘Na-enye ya otuto’ na-edobe ike okwu ahụ na njikọ ya na asụsụ ebube, ma ọ naghị amanye nkọwa nkà mmụta okpukpe karịrị ihe amaokwu ahụ kwuru.
translation_notes:
  register: Ejiri Igbo Izugbe dị ugbu a, nke dị mfe nghọta ma nwee ugwu. A họọrọ ‘ụlọ nzukọ’ maka synagogue, ebe ihe gbara amaokwu ahụ gburugburu na-eme ka o doo anya na ọ bụ ụlọ nzukọ ndị Juu. E mere participle passive ahụ ka ọ bụrụ ahịrịokwu active ka okwu ahụ daa nke ọma n’Igbo, ma e debere onye na-eme omume ahụ—‘mmadụ niile.’
