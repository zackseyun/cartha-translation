  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: ig
  text: Ọ nọ na-ekwusa ozi n’ụlọ nzukọ ndị Juu dị na Judia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akaakwụkwọ nwere ‘Galili’ kama ‘Judia.’ Ederede Grik e ji mee nsụgharị a nwere ‘Judia.’
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: Ọ nọkwa na-ekwusa ozi
  rationale: Usoro ἦν tinyere participle κηρύσσων na-egosi omume gara n’ihu ma ọ bụ nke a na-eme ugboro ugboro n’oge gara aga. ‘Ọ nọkwa na-ekwusa ozi’ na-egosipụta nke a n’Igbo dị mfe ma dịkwa mma.
- source_word: κηρύσσων
  choice: na-ekwusa ozi
  rationale: κῆρύσσω pụtara ikwupụta ozi n’ihu ọha. ‘Ikwusa ozi’ bụ okwu Igbo a na-aghọta nke ọma n’ọnọdụ a, ma ọ naghị etinye nkọwa pụrụ iche banyere ihe ozi ahụ bụ.
- source_word: εἰς τὰς συναγωγάς
  choice: n’ụlọ nzukọ ndị Juu
  rationale: Ọ bụ ezie na εἰς na-apụtakarị ‘banye n’ime,’ n’ebe a ọ na-egosi ebe ozi ahụ na-aga n’ihu. Ya mere, ‘n’ụlọ nzukọ ndị Juu’ bụ nsụgharị Igbo kwụ ọtọ ma doo anya.
- source_word: συναγωγάς
  choice: ụlọ nzukọ ndị Juu
  rationale: N’ọnọdụ a, συναγωγή bụ ebe ndị Juu na-ezukọ maka ofufe na ịmụ Akwụkwọ Nsọ. Okwu nkọwa a ga-edo ndị na-agụ Igbo anya karịa ibufe okwu mba ọzọ ‘sinagọgụ.’
- source_word: Ἰουδαίας
  choice: Judia
  rationale: Ἰουδαία na-ezo aka na Judia. A hapụrụ aha ebe ahụ dịka ederede Grik SBLGNT si dị, n’agbanyeghị na ụfọdụ akaakwụkwọ nwere ‘Galili.’
theological_decisions:
- issue: Aha mpaghara τῆς Ἰουδαίας n’agbanyeghị na ihe ndị gbara amaokwu ahụ gburugburu na-ekwu banyere Galili
  choice: Judia
  alternative: Galili; ma ọ bụ ịghọta Judia dịka ala ndị Juu n’ozuzu ya
  rationale: Ederede bụ isi gbasoro ihe SBLGNT nwere, ‘Judia,’ kama idozi esemokwu ahụ ka o kwekọọ na ọnọdụ akụkọ. Ihe dị iche n’akaakwụkwọ ka e depụtara n’okpuru peeji n’enweghị ikpebi nkọwa mpaghara ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. ‘Ụlọ nzukọ ndị Juu’ na-akọwa συναγωγή n’enweghị ịdabere n’okwu mbinye mba ọzọ; ‘na-ekwusa ozi’ na-echekwa echiche nke nkwupụta n’ihu ọha na omume gara n’ihu.
