- from: Ọ nọkwa na-ekwusa ozi n’ụlọ nzukọ ndị Juu dị na Judia.[a]
  to: Ọ nọ na-ekwusa ozi n’ụlọ nzukọ ndị Juu dị na Judia.[a]
  rationale: The revision removes an unwarranted additive nuance while retaining the imperfect ongoing sense through ‘nọ na-ekwusa.’ It preserves the source reading ‘Judia’ without harmonizing it to the surrounding Galilean setting and retains a clear textual-variant footnote.
