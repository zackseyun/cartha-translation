  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: ig
  text: Mgbe ahụ, Ekwensu sịrị ya[a], “Ọ bụrụ na ị bụ Ọkpara Chineke, gwa nkume a ka ọ ghọọ achịcha.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ebe ọ bụ na ị bụ Ọkpara Chineke.” Enwere ike ịghọta nkebiokwu ọnọdụ a dị n’asụsụ Grik dịka nke na-ewere ihe ahụ dịka eziokwu n’ihi ịma aka ahụ; ma isi ederede na-edobe ụdị okwu ọnọdụ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: Ọ bụ njikọ dị nro nke na-aga n’ihu n’akụkọ; “Mgbe ahụ” na-egosi usoro ihe mere n’Igbo dị mfe ma doo anya.
- source_word: διάβολος
  choice: Ekwensu
  rationale: N’ebe a, okwu ahụ bụ aha a maara nke onye ahụ na-anwa Jizọs; “Ekwensu” bụ okwu Igbo a na-ejikarị eme ihe maka ya.
- source_word: Εἰ
  choice: Ọ bụrụ na
  rationale: Nke a na-edobe ụdị ọnọdụ dị n’asụsụ Grik, ghara ikpebi na ọ pụtara “Ebe ọ bụ na.”
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: N’ọnọdụ a, ọ bụ utu aha pụrụ iche, ọ bụghị nanị otu n’ime ụmụ Chineke; “Ọkpara Chineke” na-egosi nke ahụ n’Igbo.
- source_word: εἰπὲ
  choice: gwa
  rationale: Ngwaa a bụ ịgwa nkume ihe ọ ga-eme. “Gwa” bụ okwu Igbo ebumpụta ụwa, ma ọ naghị etinye ike nke “nye iwu” nke na-adịghị kpọmkwem na Grik.
- source_word: τῷ λίθῳ τούτῳ
  choice: nkume a
  rationale: “Nkume” kwekọrọ na λίθος, ebe “a” na-edobe okwu ngosi τούτῳ.
- source_word: ἵνα γένηται
  choice: ka ọ ghọọ
  rationale: Ụdị a na-asụ nke ọma n’Igbo ma na-egosi ihe e kwuru ka nkume ahụ bụrụ.
- source_word: ἄρτος
  choice: achịcha
  rationale: “Achịcha” bụ ntụgharị Igbo doro anya nke ἄρτος; ọ naghị agbakwunye nkọwa nke otu ogbe ma ọ bụ gbasaa ya ka ọ bụrụ nri niile.
theological_decisions:
- issue: Ike okwu ọnọdụ εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Ọ bụrụ na ị bụ Ọkpara Chineke
  alternative: Ebe ọ bụ na ị bụ Ọkpara Chineke
  rationale: Isi ederede na-edobe ọnọdụ e gosiri n’asụsụ Grik na esemokwu dị n’ọnwụnwa ahụ, kama idozi ya ka ọ bụrụ nkwenye tupu oge eruo. Nke a anaghị agọnahụ na Jizọs bụ Ọkpara Chineke.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Ahịrịokwu ahụ na-eso usoro akụkọ n'ụzọ ebumpụta ụwa, ma na-edobe mgbagwoju anya nke okwu ọnọdụ Grik.
