  to: Ọ bịara Nazara[a], ebe e zụlitere ya; dị ka ọ na-emebu, ọ banyere n’ụlọ nzukọ ndị Juu n’ụbọchị Sabat, biliri ịgụ ihe.
  rationale: The revision retains the Greek place-name form and its alternative in a footnote, preserves the passive sense of Jesus’ upbringing and his customary action, uses the specific term “Sabat” for the Sabbath, and replaces a redundant expression for rising to read with natural Standard Igbo.
