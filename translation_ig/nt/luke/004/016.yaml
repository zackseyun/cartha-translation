    text: Ma ọ bụ, “Nazaret.” N’asụsụ Grik, aha ahụ dị n'ebe a bụ Nazara.
    reason: alternative_reading
  revision_rationale: The revision retains the Greek place-name form and its alternative in a footnote, preserves the passive sense of Jesus’ upbringing and his customary action, uses the specific term “Sabat” for the Sabbath, and replaces a redundant expression for rising to read with natural Standard Igbo.
