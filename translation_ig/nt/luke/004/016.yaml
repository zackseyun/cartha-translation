source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: ig
  text: Ọ bịara Nazara[a], ebe e zụlitere ya; dị ka ọ na-emebu, ọ banyere n’ụlọ nzukọ ndị Juu n’ụbọchị Sabat, biliri ịgụ ihe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nazaret.” N’asụsụ Grik, aha ahụ dị n'ebe a bụ Nazara.
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: Nazara
  rationale: A sụgharịghị aha obodo ahụ ka ọ bụrụ ụdị a maara nke ọma, kama e dere ya dịka ọdịdị Grik dị n'amaokwu a si dị.
- source_word: τεθραμμένος
  choice: ebe a zụlitere ya
  rationale: Nke a na-egosi ebe e lekọtara ya ma zụlite ya site n'oge ọ bụ nwata; okwu Igbo a bụ nke doro anya ma dịkwa n'okike.
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: Dị ka ọ na-emebu
  rationale: Nke a na-egosipụta omume ọ na-eme mgbe niile, n'Igbo dị mfe ma kwekọọ na nkebiokwu Grik.
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: n'ụbọchị izuike
  rationale: Ọ bụ ezie na Grik ji ụdị ọtụtụ mee ihe, nkebiokwu a bụ akpaalaokwu na-ezo aka n'otu ụbọchị izuike.
- source_word: συναγωγήν
  choice: ụlọ nzukọ ndị Juu
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka n'ebe ndị Juu na-ezukọ maka ofufe na ịgụ Akwụkwọ Nsọ; ntụgharị a na-eme ka ihe ọ pụtara doo onye Igbo nke oge a anya.
- source_word: ἀνέστη ἀναγνῶναι
  choice: biliekwa ọtọ ịgụ ihe
  rationale: Nke a na-echekwa omume ibili ọtọ na ebumnuche ya, ya bụ ịgụ ihe.
theological_decisions:
- issue: Ụdị aha obodo Ναζαρά
  choice: Nazara
  alternative: Nazaret
  rationale: A họọrọ ụdị nke na-anọchite anya mkpụrụokwu Grik dị kpọmkwem n'amaokwu a, kama ime ka ya na ụdị aha ahụ a maara nke ọma kwekọọ; e debere ụdị a maara nke ọma n'ala ala peeji.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “ụlọ nzukọ ndị Juu” kọwaa συναγωγή n'ụzọ ga-edo ndị na-agụ akwụkwọ anya, ma e chekwara aha Nazara dịka ọdịdị ya dị na isi mmalite Grik.
