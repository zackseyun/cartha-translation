  to: N’ime ụbọchị iri anọ, Ekwensu na-anwa ya ọnwụnwa[a]. Ọ righị ihe ọ bụla n’ụbọchị ndị ahụ; mgbe ụbọchị ndị ahụ zuru, agụụ gụrụ ya.
