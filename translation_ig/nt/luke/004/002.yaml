  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: ig
  text: N’ime ụbọchị iri anọ, Ekwensu na-anwa ya ọnwụnwa[a]. Ọ righị ihe ọ bụla n’ụbọchị ndị ahụ; mgbe ụbọchị ndị ahụ zuru, agụụ gụrụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-anwale ya.” Ngwaa Grik ahụ pụrụ ịpụta “ịnwa mmadụ ọnwụnwa” ma ọ bụ “ịnwale mmadụ,” ma “ịnwa ọnwụnwa” kacha dabaa n’ebe a n’ihi na onye na-eme ya bụ Ekwensu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: Ruo ụbọchị iri anọ
  rationale: Akuzatịv nke ogologo oge na-egosi oge ihe ahụ were; “ruo ụbọchị iri anọ” bụ ụzọ Igbo doro anya si kwupụta oge ahụ n’usoro ahịrịokwu a.
- source_word: πειραζόμενος
  choice: na-anwa ya ọnwụnwa
  rationale: Ngwaa ahụ nwere ike ịpụta ịnwa mmadụ ọnwụnwa ma ọ bụ ịnwale ya. Ebe onye na-eme ya bụ Ekwensu, echiche ọnwụnwa dabara nke ọma, ma e debere ihe ọzọ ọ pụrụ ịpụta n’ala ala peeji.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: Ekwensu
  rationale: N’ebe a διάβολος bụ aha a maara nke onye ahụ, ya mere “Ekwensu” bụ okwu Igbo a na-aghọta nke ọma ma ghara ime ka onye a na-ekwu banyere ya zoo.
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: O righịkwa ihe ọ bụla
  rationale: Nke a na-edobe nkwughachi ike nke Grik n’ụzọ Igbo dị mfe ma doo anya.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: n’ụbọchị ndị ahụ
  rationale: Nkebiokwu a na-akọwa ogologo oge ahụ n’asụsụ Igbo nkịtị.
- source_word: συντελεσθεισῶν αὐτῶν
  choice: mgbe ụbọchị ndị ahụ zuru
  rationale: Genitive absolute ahụ ghọrọ nkebiokwu oge; ikwughachi “ụbọchị ndị ahụ” na-ewepụ mgbagwoju anya nke nnọchiaha ma na-edobe echiche na oge ahụ mezuru.
- source_word: ἐπείνασεν
  choice: agụụ gụrụ ya
  rationale: Nke a bụ ụzọ Igbo e ji ekwu n’ụzọ ebumpụta ụwa na mmadụ nọ n’agụụ mgbe oge ahụ gasịrị.
theological_decisions:
- issue: Ihe πειραζόμενος pụtara n’ihe Jizọs hụrụ n’ọzara
  choice: na-anwa ya ọnwụnwa
  alternative: na-anwale ya
  rationale: Ekwensu bụ onye na-eme ihe a, ya mere “ịnwa ọnwụnwa” kacha dabaa n’ọnọdụ a. Ma okwu Grik ahụ nwekwara ike ịpụta “ịnwale,” ya mere a hapụrụ nke ahụ n’ala ala peeji n’enweghị idozi esemokwu nkà mmụta okpukpe karịa ihe ederede kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “Ekwensu” mee aha διάβολος dịka aha onye a maara; e zere okwu ochie na nkọwa pụrụ iche nke otu ụka.
