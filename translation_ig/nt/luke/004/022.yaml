  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: ig
  text: Ndị mmadụ niile na-ekwu okwu ọma banyere ya, okwu amara ndị na-esi n’ọnụ ya apụta na-ejukwa ha anya.[a] Ha na-asịkwa, “Ọ̀ bụghị nwa Josef ka onye a bụ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “Ndị mmadụ niile na-agba akaebe banyere ya.” Okwu Grik ahụ nwere ike ịpụta na ha kwuru okwu ọma banyere ya ma ọ bụ na ha gbara akaebe banyere ya. N’ebe a, njikọ ya na iju ha anya na-akwado nghọta nke mbụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: kwukwara okwu ọma banyere ya
  rationale: N’ebe a, ahịrịokwu ahụ na-egosi na ha kwuru ihe ọma banyere Jizọs; njikọ ya na iju ha anya na-akwado nghọta a karịa echiche nke ịgba akaebe n’ụzọ ikpe.
- source_word: ἐθαύμαζον
  choice: ihe ... jukwara ha anya
  rationale: Nke a bụ ụzọ Igbo dị mma isi gosipụta mmeghachi omume ha nke iju anya na mmasị; ọdịdị imperfect na-egosi mmeghachi omume na-aga n’ihu.
- source_word: ἐπὶ τοῖς λόγοις
  choice: ihe banyere okwu ... jukwara ha anya
  rationale: Ọ na-egosi na okwu ndị ahụ bụ ihe kpatara ma ọ bụ ihe ndabere nke iju ha anya.
- source_word: τῆς χάριτος
  choice: okwu amara
  rationale: 'Nke a na-edobe njikọ aha nke Grik na mgbagwoju ya: okwu e ji amara mara, okwu nwere ihu ọma ma ọ bụ mma na-adọrọ mmasị.'
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: ndị si n’ọnụ ya pụta
  rationale: Ọ na-edobe ihe oyiyi doro anya nke okwu ndị ahụ si n’ọnụ ya na-apụta, n’Igbo nkịtị ma dị ugwu.
- source_word: Οὐχὶ
  choice: Ọ̀ bụghị ...?
  rationale: Ajụjụ a na-atụ anya azịza nkwenye; usoro Igbo a na-echekwa ike ajụjụ ahụ.
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: nwa Josef ka onye a bụ
  rationale: Ọ bụ usoro Igbo eke nke na-akọ kpọmkwem otú ìgwè mmadụ si ghọta onye Jizọs bụ, na-agbakwunyeghị nkọwa onye dere akwụkwọ na-ekwughị.
theological_decisions:
- issue: Ịkpọ Jizọs nwa Josef n’agbanyeghị akụkọ banyere ịtụrụ ime ya site n’ike Mmụọ Nsọ
  choice: “nwa Josef ka onye a bụ” n’enweghị nkọwa mgbakwunye
  alternative: Ịgbakwunye okwu ga-eme ka o doo anya na Josef abụghị nna mụrụ ya
  rationale: Amaokwu a na-akọ echiche ìgwè mmadụ, ọ bụghị mmezi ozizi sitere n’ọnụ onye na-akọ akụkọ. Nsụgharị ahụ kwesịrị ichekwa esemokwu dị n’akụkọ ahụ kama idozi ya n’ime okwu ha.
- issue: Mgbagwoju dị na τῆς χάριτος
  choice: “okwu amara”
  alternative: “okwu dị ụtọ” ma ọ bụ “okwu juputara n’amara”
  rationale: “Okwu amara” na-echekwa ma echiche amara/ihu ọma ma echiche okwu mara mma na-adọrọ mmasị, na-ekpebighị otu ihe naanị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma dị ugwu. E debere “okwu amara” iji chekwaa obosara pụtara τῆς χάριτος, ebe e ji “kwukwara okwu ọma banyere ya” mee ka isi echiche nke ἐμαρτύρουν αὐτῷ doo anya; ihe ọzọ e tinyere na nkọwa ala peeji [a].
