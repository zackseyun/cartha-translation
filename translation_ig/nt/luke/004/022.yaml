revisions:
- from: Mmadụ niile kwukwara okwu ọma banyere ya, ihe banyere okwu amara ndị si n’ọnụ ya pụta jukwara ha anya.[a] Ha na-asịkwa, “Ọ̀ bụghị nwa Josef ka onye a bụ?”
  to: Ndị mmadụ niile na-ekwu okwu ọma banyere ya, okwu amara ndị na-esi n’ọnụ ya apụta na-ejukwa ha anya.[a] Ha na-asịkwa, “Ọ̀ bụghị nwa Josef ka onye a bụ?”
  rationale: The revision preserves the favorable sense of ἐμαρτύρουν, the ongoing force of both imperfect verbs, the ambiguity and positive quality of τῆς χάριτος in “okwu amara,” and the crowd’s rhetorical question. It improves Standard Igbo flow without adding doctrinal explanation.
