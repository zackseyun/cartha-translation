  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwusa afọ nke ihu ọma Onyenweanyị.”
    reason: lexical_alternative
  - marker: b
    text: 'Nsụgharị ọdịnala: “ikwusa afọ anabatara nke Onyenweanyị.” Okwu a na-echetara Aịzaya 61:2, o nwekwara ike ime ka a cheta Afọ Jubili.'
