lexical_decisions:
- source_word: κηρύξαι
  choice: ikwusa
  rationale: “Ikwusa” na-egosi ịkpọsa ozi n’ihu ọha dịka onye na-ekwusa ọkwa, ma na-edobe ụdị infinitive nke na-aga n’ihu n’usoro ebumnuche nke amaokwu bu ya ụzọ.
- source_word: ἐνιαυτὸν
  choice: afọ
  rationale: Okwu Grik a na-apụtakarị “afọ.” Idebe “afọ” na-echekwa njikọ okwu a na Aịzaya 61:2 kama ịgbanwe ya ka ọ bụrụ naanị “oge.”
- source_word: κυρίου
  choice: nke Onyenweanyị
  rationale: “Onyenweanyị” bụ nsụgharị kwesịrị ekwesị nke κύριος n’ebe a; “nke” na-egosi na afọ ahụ bụ nke Onyenweanyị ma ọ bụ na ihu ọma ya ji mara ya.
- source_word: δεκτόν
  choice: ihu ọma
  rationale: N’ọnọdụ a, δεκτός na-egosi ihe a nabatara nke ọma ma ọ bụ oge amara na ihu ọma. “Ihu ọma” na-eme ka uche banyere ihu ọma Chineke doo onye Igbo nke oge a anya karịa nsụgharị nkịtị dịka “nke a na-anabata.”
theological_decisions:
- issue: Njikọ ya na Aịzaya 61:2 na echiche Afọ Jubili
  choice: E debere “afọ” n’ahịrịokwu ahụ, ma etinyeghị “Jubili” n’ime ya.
  alternative: ịkwusa Afọ Jubili nke Onyenweanyị
  rationale: Okwu Grik ahụ na-echetara Aịzaya 61:2, o nwekwara ike ime ka a cheta Jubili, ma ọ kpọghị Jubili aha kpọmkwem. Ya mere, nsụgharị ahụ na-echekwa ihe a na-atụ aka na ya n’etinyeghị nkọwa n’ime ederede.
- issue: Nsụgharị κύριος
  choice: Onyenweanyị
  alternative: YHWH / Nna Ukwu
  rationale: “Onyenweanyị” na-adaba n’usoro e ji asụ Igbo maka κύριος ma na-echekwa njikọ ya na amaokwu Aịzaya n’akọwaghị karịa ihe ederede Grik kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Ihu ọma” na-ekwupụta echiche nke divine favor n’enweghị itinye “Jubili” ma ọ bụ nkọwa okpukpe pụrụ iche n’ime ahịrịokwu.
