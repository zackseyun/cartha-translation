id: LUK.10.3
reference: Luke 10:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: ig
  text: Gaanụ; lee, ana m ezipụ unu dị ka ụmụ atụrụ[a] n’etiti anụ ọhịa wolf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik kwuru kpọmkwem “ụmụ atụrụ,” ọ bụghị naanị “atụrụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάγετε
  choice: Gaanụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha gaa. “Gaanụ” bụ okwu Igbo dị nkenke, doo anya, ma gosipụta na a na-agwa mmadụ karịrị otu.
- source_word: ἰδοὺ
  choice: lee
  rationale: Ọ bụ okwu e ji adọta uche ndị na-ege ntị n’ihe na-esochi. “Lee” na-arụ ọrụ a n’Igbo nke oge a ma na-edobe ịdị arọ nke okwu ahụ.
- source_word: ἀποστέλλω ὑμᾶς
  choice: ana m ezipụ unu
  rationale: Oge ugbu a nke ngwaa ahụ na-egosi ihe Jizọs na-eme ugbu a, ebe “unu” na-edobe ọnụọgụ ọtụtụ nke nnọchiaha Grik.
- source_word: ὡς
  choice: dị ka
  rationale: Ọ na-ewebata ntụnyere, ọ bụghị ikwu na ndị ahụ bụ ụmụ atụrụ n’ezie.
- source_word: ἄρνας
  choice: ụmụ atụrụ
  rationale: Okwu Grik ahụ pụtara kpọmkwem ụmụ atụrụ, ya mere nsụgharị a na-edobe ihe oyiyi nke ịdị nta na enweghị ike ichebe onwe ha.
- source_word: ἐν μέσῳ λύκων
  choice: n’etiti anụ ọhịa wolf
  rationale: “N’etiti” na-edobe echiche nke ịnọ n’ime ìgwè ndị iro gbara ha gburugburu; “anụ ọhịa wolf” bụ aha a na-aghọta nke ọma n’Igbo maka anụmanụ ahụ.
theological_decisions:
- issue: Ihe atụ anụmanụ e ji kọwaa ozi ndị na-eso ụzọ
  choice: dị ka ụmụ atụrụ n’etiti anụ ọhịa wolf
  alternative: dị ka atụrụ n’etiti anụ ọhịa wolf
  rationale: ἄρνας pụtara “ụmụ atụrụ,” ọ bụghị naanị “atụrụ.” Ijide “ụmụ” na-edobe ike nke ihe oyiyi ahụ banyere adịghị ike na ihe ize ndụ, n’enweghị ịgwakọta amaokwu a na okwu yiri ya n’ebe ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Akara semikolon na-ekewa iwu “Gaanụ” na nkwupụta na-esochi, ebe “lee” na-adọta uche dịka ἰδοὺ si eme.
