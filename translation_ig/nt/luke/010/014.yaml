  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: ig
  text: Ma n’ikpe ahụ, ikpe ahụ ga-adịrị Taịa na Saịdọn mfe ịnagide karịa ka ọ ga-adịrị unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ikpe ahụ, ikpe ahụ ga-adịrị Taịa na Saịdọn nke a pụrụ ịnagide karịa ka ọ ga-adịrị unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Ma
  rationale: Na-egosi ntụgharị siri ike megide ihe e kwuru tupu ya, n’ụzọ dị mfe ma bụrụ Igbo nke oge a.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: Taịa na Saịdọn
  rationale: Aha obodo ndị a dị n’ọnọdụ dative; usoro ‘ga-adịrị Taịa na Saịdọn’ na-egosipụta ndị ikpe ahụ ga-adịrị mfe karị.
- source_word: ἀνεκτότερον
  choice: ihe ga-adịrị ... mfe ịnagide karịa
  rationale: Na-echekwa echiche ntụnyere nke ‘ihe a pụrụ ịnagide karịa’ n’Igbo doro anya ma dị eke.
- source_word: ἔσται
  choice: ga-adịrị
  rationale: Na-egosipụta ọdịnihu nke ngwaa εἰμί ma jikọta ya n’ụzọ eke na ndị ikpe ahụ ga-emetụta.
- source_word: ἐν τῇ κρίσει
  choice: n’ụbọchị ikpe ahụ
  rationale: ‘Ụbọchị ikpe ahụ’ bụ okwu Igbo doro anya maka ọnọdụ ikpe ikpeazụ a na-ekwu maka ya; ‘ahụ’ na-echekwa nkọwa definite nke isiokwu Grik.
- source_word: ἢ ὑμῖν
  choice: karịa ka ọ ga-adịrị unu
  rationale: Na-emecha ntụnyere ahụ ma na-echekwa dative nke ὑμῖν n’Igbo eke.
theological_decisions:
- issue: Ụdị κρίσις n’ebe a
  choice: ụbọchị ikpe ahụ, nke na-arụtụ aka n’ikpe ikpeazụ
  alternative: ikpe n’ozuzu ya
  rationale: Ọnọdụ okwu ahụ, nke ji obodo ndị na-echegharịghị tụnyere Taịa na Saịdọn, na-arụtụ aka n’ikpe Chineke nke ikpeazụ. Nsụgharị ahụ anaghị akọwa ihe karịrị ihe okwu Grik na ọnọdụ ya kwadoro.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E jiri ‘ihe ga-adịrị ... mfe ịnagide’ mee ka ntụnyere Grik doo anya n’enweghị itinye nkọwa ụka pụrụ iche.
