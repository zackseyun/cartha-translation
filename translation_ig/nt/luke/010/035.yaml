id: LUK.10.35
reference: Luke 10:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: ig
  text: N’echi ya, o wepụtara mkpụrụ ego denarịọs abụọ[a] ma nye onye na-elekọta ụlọ ndị njem, sị ya, “Lekọta ya. Ego ọ bụla ọzọ ị ga-emefu, aga m akwụghachi gị ya mgbe m lọtara.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Denarịọs bụ mkpụrụ ego ọlaọcha ndị Rom ji eme ihe; ọ bara ihe dị ka ụgwọ ọrụ otu ụbọchị maka onye ọrụ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: N’echi ya
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji ekwu ụbọchị sochirinụ n'ụzọ ebumpụta ụwa.
- source_word: ἐκβαλών
  choice: o wepụtara
  rationale: N’ebe a, okwu ahụ pụtara iwepụta ego mmadụ ji, ọ bụghị ịtụpụ ihe n’ike.
- source_word: δύο δηνάρια
  choice: mkpụrụ ego denarịọs abụọ
  rationale: A hapụrụ aha ego Rom ahụ dịka okwu akụkọ ihe mere eme, tinyekwa ‘mkpụrụ ego’ ka onye na-agụ ya ghọta ozugbo ihe ọ bụ.
- source_word: πανδοχεῖ
  choice: onye na-elekọta ụlọ ndị njem
  rationale: Nhọrọ a na-egosi onye na-ahụ maka ebe ndị njem na-anọ, n’ebughị ụzọ kwuo na ọ bụ ya nwe ụlọ ahụ.
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: Lekọta ya
  rationale: Ọ bụ iwu doro anya nke chọrọ ka e jiri nlezianya na-elekọta nwoke ahụ.
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: Ego ọ bụla ọzọ ị ga-emefu
  rationale: Nke a na-echekwa ma echiche ego a na-amaghị ole ọ ga-abụ, ma echiche nke mmefu ga-agbakwunye n’ego e nyere.
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: mgbe m lọtara
  rationale: Nke a na-enye usoro oge ahụ n’Igbo dị mfe ma dịkwa ebumpụta ụwa.
- source_word: ἀποδώσω σοι
  choice: aga m akwụghachi gị ya
  rationale: Ọ na-egosi nkwa ịkwụghachi onye na-elekọta ụlọ ahụ ego ọzọ niile ọ ga-emefu.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, sụgharịa amaokwu ahụ. E debere aha ego Rom ahụ ka a ghara iji nkọwa dịka ‘ụgwọ ọrụ ụbọchị abụọ’ dochie kpọmkwem ihe odide Grik kwuru; a kọwara ya n’ala ala peeji.
