  text: Σαμαρίτης δέ τις ὁδεύων ἦλθεν κατ’ αὐτὸν καὶ ⸀ἰδὼν ἐσπλαγχνίσθη,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: ig
  text: Ma otu onye Sameria, ka ọ na-eme njem, bịarutere ebe nwoke ahụ nọ; mgbe ọ hụrụ ya, obi ebere kpaliri ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “O nwere ọmịiko.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σαμαρίτης
  choice: otu onye Sameria
  rationale: Nke a bụ ụzọ doro anya ma dịkwa mfe n'Igbo isi kọwaa onye sitere n'agbụrụ na òtù okpukpe ndị Sameria, ma chekwaa ọdịiche dị n'akụkọ ahụ.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n'etiti omume onye Sameria na nke onye nchụàjà na onye Livayị ndị e kwuru okwu ha tupu ya.
- source_word: τις
  choice: otu
  rationale: Ọ na-egosi onye a na-akọwaghị kpọmkwem; 'otu onye Sameria' bụ okwu Igbo sitere n'okike.
- source_word: ὁδεύων
  choice: ka ọ na-eme njem
  rationale: Ọ na-egosi omume na-aga n'ihu nke bụ ọnọdụ ndabere mgbe ihe ahụ mere.
- source_word: ἦλθεν
  choice: bịarutere
  rationale: Ọ na-egosi na onye njem ahụ bịara ruo n'ebe nwoke ahụ nọ; nke a dabara n'ọnọdụ karịa naanị 'bịa.'
- source_word: κατ’ αὐτόν
  choice: ebe nwoke ahụ nọ
  rationale: N'ọnọdụ a, nkebiokwu ahụ na-egosi ịbịaru n'ebe onye ahụ merụrụ ahụ nọ, ọ bụghị ịdakwasị ya.
- source_word: ἰδών
  choice: mgbe ọ hụrụ ya
  rationale: Ọ na-egosipụta n'ụzọ Igbo sitere n'okike na ịhụ nwoke ahụ bu ụzọ tupu mmetụta ọmịiko ahụ.
- source_word: ἐσπλαγχνίσθη
  choice: obi ebere kpaliri ya
  rationale: Okwu a na-egosi ọmịiko miri emi nke metụrụ mmadụ n'ime; ntụgharị a chekwara ike mmetụta ahụ n'Igbo dị ugbu a.
theological_decisions:
- issue: Ịkọwa mmeghachi omume ọmịiko nke onye Sameria n'etinyeghị nkọwa ozizi ọzọ
  choice: obi ebere kpaliri ya
  alternative: o nwere ọmịiko n'ebe ọ nọ
  rationale: Nhọrọ a na-echekwa mmetụta miri emi nke ngwaa Grik ahụ, ma ọ naghị agbakwunye echiche banyere amara, ọrụ ọma, ma ọ bụ ịhụ onye agbata obi n'anya karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji 'onye Sameria' mee ka njirimara agbụrụ na okpukpe ahụ doo anya; e zere okwu nwere ike ibubata nkọwa ụka pụrụ iche.
