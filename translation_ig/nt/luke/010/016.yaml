id: LUK.10.16
reference: Luke 10:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: ig
  text: Onye na-ege unu ntị na-ege m ntị; onye na-ajụ unu na-ajụ m; ma onye na-ajụ m na-ajụ Onye zitere m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἀκούων
  choice: Onye na-ege ... ntị
  rationale: Nkebi participle a nwere article na-arụ ọrụ dị ka aha ma na-ekwu maka onye ọ bụla a maara site n'omume a. “Onye na-ege ... ntị” bụ Igbo nkịtị ma na-edobe echiche nke ịnụ na ịnabata okwu onye ọzọ.
- source_word: ὑμῶν
  choice: unu
  rationale: Genitive a na ἀκούω na-egosi ndị a na-anụ. E debere “unu” n'onwe ya, n'etinyeghị “ozi unu,” n'ihi na Greek kwuru banyere ndị ahụ kpọmkwem.
- source_word: ἐμοῦ
  choice: m
  rationale: “M” na-edobe myirịta dị n'etiti ὑμῶν na ἐμοῦ nakwa njikọ Jizọs mere n'etiti ige ndị na-eso ụzọ ya ntị na ige ya onwe ya ntị.
- source_word: ἀκούει
  choice: na-ege ... ntị
  rationale: Nhọrọ a bụ okwu Igbo dị ndụ maka ige mmadụ ntị, ma na-edobe nkwugharị nke mgbọrọgwụ ἀκούω n'ahịrịokwu ahụ.
- source_word: ὁ ἀθετῶν
  choice: onye na-ajụ
  rationale: N'ọnọdụ mmekọrịta mmadụ na nnọchiteanya a, “na-ajụ” na-egosi ịghara ịnabata ndị e zitere. Ọ dị mfe ma doo anya, ebe nkọwa ndị ọzọ nke ἀθετέω ka e gosiri na ndetu ala peeji.
- source_word: ὑμᾶς
  choice: unu
  rationale: Direct object bụ ndị na-eso ụzọ ahụ n'onwe ha dịka ndị nnọchiteanya Jizọs; a tụgharịghị ya ka ọ bụrụ naanị “ozi unu.”
- source_word: ἐμὲ ἀθετεῖ
  choice: na-ajụ m
  rationale: E ji otu ngwaa ahụ mee ihe ọzọ iji chekwaa nkwugharị na ike okwu Greek ahụ.
- source_word: δὲ
  choice: ma
  rationale: “Ma” na-egosi ntakịrị ntụgharị na nzọụkwụ na-eduga n'okwu ikpeazụ kachasị ike, n'enweghị ime ka ọdịiche ahụ sie ike karịa Greek.
- source_word: τὸν ἀποστείλαντά με
  choice: Onye ahụ zitere m
  rationale: Nkebi participle a nwere article na-arụ ọrụ dị ka aha. “Onye ahụ zitere m” bụ Igbo doro anya nke na-ahapụghị onye ahụ n'amaghị ama ma na-etinyeghị “Nna” nke na-adịghị n'okwu Greek a.
theological_decisions:
- issue: Njikọ Jizọs na ndị ozi ọ họpụtara
  choice: 'E debere usoro metụtara mmadụ kpọmkwem: ige ndị na-eso ụzọ ntị bụ ige Jizọs ntị; ịjụ ha bụ ịjụ ya; ịjụ ya bụkwa ịjụ Onye zitere ya.'
  alternative: Ịkọwa ya dịka naanị ige ozi ndị na-eso ụzọ ntị ma ọ bụ ịjụ ozi ha.
  rationale: Greek ji nnọchiaha ndị mmadụ—“unu” na “m”—ọ bụghị aha echiche dịka “ozi” ma ọ bụ “ozizi.” Nke a na-echekwa ikike nnọchiteanya ha n'etinyeghị nkọwa ọzọ.
- issue: Onye okwu “Onye ahụ zitere m” na-ezo aka na ya
  choice: A hapụrụ ya dịka “Onye ahụ zitere m.”
  alternative: Ịsị kpọmkwem, “Nna ahụ zitere m.”
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Chineke Nna, ma Greek ekwughị “Nna” n'amaokwu a. Ya mere, a hapụrụ ntụaka ahụ dịka isi mmalite si dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu na nkwugharị ya na-esochi ike okwu Greek ahụ, ebe “na-ege ... ntị” na “na-ajụ” na-eme ka ọ bụrụ okwu Igbo nkịtị.
