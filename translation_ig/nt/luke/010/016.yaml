- from: Onye na-ege unu ntị na-ege m ntị; onye na-ajụ unu[a] na-ajụ m; ma onye na-ajụ m na-ajụ Onye ahụ zitere m.
  to: Onye na-ege unu ntị na-ege m ntị; onye na-ajụ unu na-ajụ m; ma onye na-ajụ m na-ajụ Onye zitere m.
  rationale: The revision retains the direct personal and rhetorical structure of the Greek. It replaces an unnatural footnote alternative with a clear contextual alternative and removes the added demonstrative force of “ahụ” from the final designation.
