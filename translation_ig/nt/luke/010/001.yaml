id: LUK.10.1
reference: Luke 10:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: ig
  text: Mgbe ihe ndị a gasịrị[a], Onyenwe anyị họpụtara mmadụ iri asaa na abụọ ndị ọzọ kwa, wee ziga ha abụọ abụọ ka ha buru ya ụzọ gaa n’obodo na ebe ọ bụla ya onwe ya ga-aga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide aka na-agụ, “iri asaa,” kama “iri asaa na abụọ.”
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Mgbe ihe ndị a gasịrị
  rationale: Nke a na-edobe mgbanwe oge na ọtụtụ nke ταῦτα, ma bụrụkwa okwu Igbo doro anya ma na-agụ nke ọma.
- source_word: ἀνέδειξεν
  choice: họpụtara
  rationale: N’ebe a, ngwaa ahụ pụtara ịhọpụta mmadụ maka ọrụ e nyere ya, ọ bụghị naanị igosi ya.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị akọwa κύριος dị ka aha nsọpụrụ; n’ebe a ọ na-ezo aka na Jizọs.
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: mmadụ iri asaa na abụọ ndị ọzọ kwa
  rationale: ‘Ndị ọzọ kwa’ na-egosipụta ma ἑτέρους ma echiche mgbakwunye nke καί. E debere iri asaa na abụọ nke dị na SBLGNT n’ahịrị bụ isi.
- source_word: ἀπέστειλεν
  choice: zipụ
  rationale: Ọ na-egosipụta omume iziga ha n’ọrụ n’enweghị ịgbakwụnye nkọwa pụrụ iche banyere ọkwa ha.
- source_word: ἀνὰ δύο δύο
  choice: abụọ abụọ
  rationale: Nke a na-edobe usoro nkesa na nkwughachi nke Grik, ma bụrụkwa okwu Igbo ebumpụta ụwa.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: ka ha buru ya ụzọ
  rationale: Ọ pụtara na e zigara ha n’ihu ya tupu ọ bịarute, ọ bụghị naanị na ha guzoro n’ihu ya.
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: gaa n’obodo na ebe niile
  rationale: Nke a na-edobe aha abụọ ahụ, πόλις na τόπος, ma na-ezere ime ka πόλις bụrụ naanị nnukwu obodo.
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: ya onwe ya na-achọ ịga
  rationale: ‘Na-achọ ịga’ na-egosipụta ihe ọ na-ezube ime n’oge na-abịa, ebe ‘ya onwe ya’ na-edobe nkwusi ike nke αὐτός.
theological_decisions:
- issue: Ọdịiche ederede banyere ọnụ ọgụgụ ndị a họpụtara
  choice: iri asaa na abụọ
  alternative: iri asaa
  rationale: SBLGNT nyere ἑβδομήκοντα δύο, ya bụ ‘iri asaa na abụọ.’ Ederede aka ụfọdụ nwere ‘iri asaa,’ ya mere e debere ya n’okpuru peeji kama ileghara ezigbo ọdịiche ederede ahụ anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche Grik n’enweghị ime ka Igbo sie ike ma ọ bụ bụrụ nke ochie.
