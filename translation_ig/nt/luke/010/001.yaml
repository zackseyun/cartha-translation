revisions:
- from: Mgbe ihe ndị a gasịrị[a], Onyenwe anyị họpụtara mmadụ iri asaa na abụọ ndị ọzọ kwa, zipụ ha abụọ abụọ ka ha buru ya ụzọ gaa n’obodo na ebe niile ya onwe ya na-achọ ịga.
  to: Mgbe ihe ndị a gasịrị[a], Onyenwe anyị họpụtara mmadụ iri asaa na abụọ ndị ọzọ kwa, wee ziga ha abụọ abụọ ka ha buru ya ụzọ gaa n’obodo na ebe ọ bụla ya onwe ya ga-aga.
  rationale: The revision corrects the narrative tense of ‘sent’ and removes the unwanted desire nuance in the final prospective clause. It retains the SBLGNT reading ‘seventy-two,’ preserves the significant alternative reading in the footnote, and keeps the paired-mission and advance-before-him senses explicit.
  reviewer_model: gpt-5.6-terra
