  text: ὁ δὲ εἶπεν πρὸς αὐτόν· Ἐν τῷ νόμῳ τί γέγραπται; πῶς ἀναγινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: ig
  text: Ọ sịrị ya, “Gịnị ka e dere n’Iwu ahụ? Olee otú i si agụ ya?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịtụgharị ya, “Olee otú i si akọwa ya?” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ nkịtị, “Olee otú i si agụ ya?” ma ọ pụkwara ịgụnye echiche nke ịghọta ma ọ bụ ịkọwa ihe a gụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ọ
  rationale: Igbo can naturally continue the narrative with the third-person pronoun alone; forcing a connective such as ‘Ma’ would suggest a stronger contrast than δέ requires here.
- source_word: εἶπεν πρὸς αὐτόν
  choice: sịrị ya
  rationale: This is the natural, concise Standard Igbo expression for direct speech addressed to someone.
- source_word: Ἐν τῷ νόμῳ
  choice: n’Iwu ahụ
  rationale: ‘Iwu ahụ’ identifies the recognized scriptural Law rather than law in a generic sense; the contracted preposition gives idiomatic Igbo.
- source_word: τί γέγραπται
  choice: Gịnị ka e dere
  rationale: The impersonal passive construction preserves the focus on what stands written, while remaining natural in Igbo.
- source_word: πῶς ἀναγινώσκεις
  choice: Olee otú i si agụ ya?
  rationale: This keeps the primary lexical sense ‘read’ and preserves the open possibility that the question also concerns understanding or interpretation.
theological_decisions:
- issue: Sense of νόμος in Jesus’ question
  choice: Iwu ahụ
  alternative: Tora; iwu n’ozuzu ya
  rationale: The context points to Israel’s recognized scriptural Law. ‘Iwu ahụ’ is accessible Standard Igbo and avoids reducing the phrase to generic law.
- issue: Interpretive nuance of πῶς ἀναγινώσκεις
  choice: Olee otú i si agụ ya?
  alternative: Olee otú i si akọwa ya?
  rationale: The Greek verb directly denotes reading but may imply understanding or interpretation. The main text retains ‘read’ so that this rhetorical and theological openness is not silently resolved.
translation_notes:
  register: Natural, current, and dignified Standard Igbo. The wording is concise and suitable for oral reading; ‘Iwu ahụ’ marks the specific scriptural Law without using a specialized transliteration.
