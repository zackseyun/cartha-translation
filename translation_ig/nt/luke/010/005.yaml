id: LUK.10.5
reference: Luke 10:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: ig
  text: Ụlọ ọ bụla unu banyere, buru ụzọ sị, “Udo dịrị ụlọ a.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ka udo dịrị ụlọ a” ma ọ bụ “Udo dakwasị ụlọ a.” Okwu Grik ahụ bụ usoro ngọzi dị mkpụmkpụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃
  choice: Ụlọ ọ bụla unu banyere
  rationale: Nkebiokwu a na-egosi ụlọ ọ bụla ndị ahụ ga-abanye. N'Igbo, itinye “ụlọ” n'ihu ma sị “unu banyere” na-enye echiche mmegharị nke εἰς na εἰσέλθητε n'ụzọ doro anya ma bụrụkwa nke e ji asụsụ eme ihe.
- source_word: πρῶτον
  choice: buru ụzọ
  rationale: “Buru ụzọ” na-egosi na nke a bụ ihe mbụ ha kwesịrị ime ozugbo ha banyere.
- source_word: λέγετε
  choice: sị
  rationale: “Sị” bụ okwu Igbo nkịtị ma kwekọọ n'iwu ka ha kwuo ekele ma ọ bụ ngọzi ahụ.
- source_word: Εἰρήνη
  choice: Udo
  rationale: “Udo” na-eburu isi echiche εἰρήνη, ma na-ahapụ okwu ahụ ka ọ bụrụ ekele na ngọzi n'otu oge.
- source_word: τῷ οἴκῳ τούτῳ
  choice: dịrị ụlọ a
  rationale: Dative ahụ na-egosi onye ma ọ bụ ihe a na-enye ngọzi ahụ. Usoro “dịrị ụlọ a” bụ ụzọ Igbo sitere n'okike isi kwupụta “udo dịrị...” ma ọ naghị akọwa “ụlọ” dị ka naanị ndị bi n'ime ya.
theological_decisions:
- issue: Ụdị okwu udo ahụ
  choice: “Udo dịrị ụlọ a.”
  alternative: “Ka udo dịrị ụlọ a” ma ọ bụ “Udo dakwasị ụlọ a.”
  rationale: Nhọrọ a na-edebe ya dịka ekele/ngọzi a na-ekwupụta, kwekọọ na mkpụmkpụ okwu Grik ahụ, ma ghara ime ka ọ bụrụ naanị ekele nkịtị ma ọ bụ tinye usoro emume ọzọ n'ime ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma nwee ugwu. “Ụlọ ọ bụla unu banyere” na-ada nke ọma n'ọnụ, ebe “Udo dịrị ụlọ a” na-echekwa mkpụmkpụ na ike ngọzi nke okwu mbụ.
