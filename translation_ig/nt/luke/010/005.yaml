  verdict: approve
  source_fidelity: The translation accurately conveys the indefinite directive, “whatever house you enter,” the sequential priority of πρῶτον (“buru ụzọ”), the imperative to speak, and the concise blessing formula directed to the house. “Ụlọ ọ bụla unu banyere” naturally retains the directional sense of entering without adding interpretation.
  naturalness: The wording is clear, idiomatic Standard Igbo, and appropriately direct for Jesus’ instruction. “Buru ụzọ sị” and “Udo dịrị ụlọ a” are especially natural and preserve the compact, performative character of the saying.
  terminology: “Udo” is the established and suitable equivalent for εἰρήνη. “Dịrị ụlọ a” correctly presents the house as the recipient of the blessing while allowing the customary contextual implication of its inhabitants. The alternative renderings in the footnote are sound and do not impose a theological interpretation.
