- from: Gwọọnụ ndị ọrịa nọ n’ime ya, gwakwa ha, ‘Alaeze Chineke abịaruwo unu nso.’
  to: Gwọọnụ ndị ọrịa nọ n’obodo ahụ, gwa ha sị, ‘Alaeze Chineke abịaruwo unu nso.’[a]
  rationale: The revision makes the antecedent of αὐτῇ explicit as the already established town, uses an idiomatic Standard Igbo direct-speech construction, and restores a footnoted lexical alternative for the perfect kingdom-nearness announcement. It does not resolve the theological scope of the announcement beyond the Greek text.
