id: LUK.10.9
reference: Luke 10:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: ig
  text: Gwọọnụ ndị ọrịa nọ n’obodo ahụ, gwa ha sị, ‘Alaeze Chineke abịaruwo unu nso.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Alaeze Chineke abịala unu nso.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεραπεύετε
  choice: Gwọọnụ
  rationale: Ọ bụ iwu nọ n’ụdị present active imperative; “gwọọnụ” na-egosi ọrụ ịgwọ ndị ọrịa n’ụzọ doro anya ma kwekọọ n’ọnọdụ ozi a.
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: ndị ọrịa nọ n’ime ya
  rationale: N’ihi njikọ ya na θεραπεύετε, ἀσθενεῖς pụtara ndị na-arịa ọrịa ebe a; “n’ime ya” na-ezo aka n’obodo e kwuru okwu ya n’amaokwu bu ụzọ.
- source_word: λέγετε αὐτοῖς
  choice: gwakwa ha
  rationale: Nke a na-ebupụta iwu okwu ahụ n’Igbo dị mfe ma bụrụ nke e ji eme ihe kwa ụbọchị.
- source_word: Ἤγγικεν
  choice: abịaruwo ... nso
  rationale: Ụdị perfect ahụ na-egosi na ọ bịarutela nso ma na ọnọdụ ahụ ka dị mkpa ugbu a; “abịaruwo nso” na-echekwa ma omume ịbịaru nso ma ihe ọ pụtara ugbu a.
- source_word: ἐφ’ ὑμᾶς
  choice: unu
  rationale: Mgbe e jikọtara ya na “abịaruwo nso,” nnọchiaha “unu” na-enye Igbo ebumpụta ụwa maka ihe bịaruru ndị na-anụ ozi ahụ nso, na-enweghị ịgbakwunye echiche nke mmegide.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: Alaeze Chineke
  rationale: Nke a bụ okwu Akwụkwọ Nsọ a maara nke ọma n’Igbo, ma ọ ka na-edobe obosara echiche nke ọchịchị na alaeze Chineke.
theological_decisions:
- issue: Ihe nkwupụta banyere alaeze ahụ pụtara
  choice: A sụgharịrị ya dịka alaeze Chineke nke bịaruru ndị na-anụ ozi ahụ nso, n’enweghị ikwu na ọ mezuru kpamkpam ugbu a ma ọ bụ na ọ bụ naanị ihe ga-eme n’ọdịnihu.
  alternative: “Alaeze Chineke anọwo n’etiti unu” ma ọ bụ “Alaeze Chineke na-abịa n’oge na-adịghị anya.”
  rationale: Ἤγγικεν na-egosi ịbịaru nso nke nwere mkpa ugbu a, ma amaokwu ahụ anaghị edozi esemokwu dị n’etiti ịdị adị ya ugbu a na mmezu ya n’ọdịnihu. “Abịaruwo unu nso” na-echekwa esemokwu nkà mmụta okpukpe ahụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A họọrọ “Gwọọnụ” na “gwakwa ha” dịka iwu a gwara ọtụtụ mmadụ; ahịrịokwu ahụ na-aga were were n’enweghị okwu ụka pụrụ iche agbakwunyere.
