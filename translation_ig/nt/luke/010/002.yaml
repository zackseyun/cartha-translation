reference: Luke 10:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: ig
  text: Ọ sịrị ha, “Owuwe ihe ubi hiri nne, ma ndị ọrụ dị ole na ole. Ya mere, rịọọnụ Onyenwe owuwe ihe ubi ka o zipụ[a] ndị ọrụ banye n’owuwe ihe ubi ya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ngwaa Grik ahụ pụkwara inwe echiche nke izipu n’ike ma ọ bụ n’ọsọ, karịa naanị ‘izipụ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Ọ sịrị
  rationale: Ọ bụ ezie na imperfect pụrụ ịpụta ‘ọ nọ na-agwa,’ n’akụkọ Igbo, ‘Ọ sịrị’ bụ ụzọ ebumpụta ụwa isi webata okwu mmadụ n’enweghị mfu dị mkpa.
- source_word: δὲ
  choice: E gosipụtaghị ya iche
  rationale: δὲ bụ njikọ dị nro na-aga n’ihu n’akụkọ; n’Igbo, ịmalite ozugbo na ‘Ọ sịrị ha’ na-ada nke ọma karịa ịgbakwunye njikọ na-enweghị ọrụ doro anya.
- source_word: θερισμός
  choice: owuwe ihe ubi
  rationale: Nke a bụ okwu Igbo a na-ejikarị ekwu harvest, ọ na-echekwa ma ihe ubi nkịtị ma ihe atụ dị n’amaokwu ahụ.
- source_word: πολύς
  choice: hiri nne
  rationale: ‘Hiri nne’ na-egosi ụbara n’ụzọ doro anya ma kwekọọ nke ọma na ‘owuwe ihe ubi.’
- source_word: ἐργάται
  choice: ndị ọrụ
  rationale: Ọ bụ okwu Igbo nke oge a, dị mfe nghọta, maka ndị na-arụ ọrụ owuwe ihe ubi.
- source_word: ὀλίγοι
  choice: dị ole na ole
  rationale: Ọ na-egosi n’ụzọ doro anya ọdịiche dị n’etiti ụbara ihe ubi na ụkọ ndị ọrụ.
- source_word: δεήθητε
  choice: rịọọnụ
  rationale: Imperative a na-egosi arịrịọ siri ike e chere ihu n’ebe Chineke nọ; ‘rịọọnụ’ bụ okwu ebumpụta ụwa ma na-echekwa ike iwu ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’okwu banyere ụbara ihe ubi na ụkọ ndị ọrụ.
- source_word: κύριος
  choice: Onyenwe
  rationale: ‘Onyenwe’ na-echekwa echiche nke onye nwe ihe ma na-achị ya, yana ụda nkà mmụta okpukpe dị n’aha ‘Onyenwe owuwe ihe ubi.’
- source_word: ὅπως
  choice: ka
  rationale: ‘Ka’ na-ewebata ebumnuche ma ọ bụ ọdịnaya arịrịọ ahụ n’Igbo n’ụzọ dị mkpirikpi ma dị mma.
- source_word: ἐκβάλῃ
  choice: o zipụ
  rationale: ‘Zipụ’ na-eme ka ebumnuche nke iziga ndị ọrụ pụta ìhè n’Igbo na-enweghị ịtinye echiche nke mmegbu; ihe ngwaa Grik ahụ nwere ike igosi banyere izipụ n’ike ka edebere n’ala peeji.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: banye n’owuwe ihe ubi ya
  rationale: Ọ na-echekwa ntụziaka εἰς na nwepụta αὐτοῦ, n’etinyeghị ‘ubi’ ma ọ bụ nkọwa ọzọ na-adịghị kpọmkwem n’ederede Grik.
theological_decisions:
- issue: Onye ‘Onyenwe owuwe ihe ubi’ na-ezo aka na ya na ihe aha ahụ pụtara
  choice: E debere aha ihe atụ ahụ dịka ‘Onyenwe owuwe ihe ubi’ n’enweghị ịkọwa onye ọ bụ karịa ihe ederede kwuru.
  alternative: Ịkọwa ya kpọmkwem dịka Chineke, ma ọ bụ ikwu na Jizọs na-egosi ikike Chineke o nwere n’ozi ahụ.
  rationale: Amaokwu ahụ na-egosi onye nwere ihe ubi ma na-achịkwa iziga ndị ọrụ, ma ọ kọwaghị christology ya kpọmkwem n’ebe a. Ịhapụ aha ahụ n’enweghị mgbakwunye na-echekwa esemokwu na oghere nkà mmụta okpukpe nke ederede ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. E ji ‘owuwe ihe ubi’ mee ihe n’otu aka ahụ n’ebe niile iji chekwaa ihe atụ ahụ; e zere okwu ụka pụrụ iche na nkọwa denominational.
