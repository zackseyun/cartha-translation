review_pass:
  verdict: revise
  source_fidelity: The main translation accurately conveys the Greek contrast, the imperative to petition, the title ‘Lord of the harvest,’ and the sending of workers into the owner’s harvest. ‘Ọ sịrị ha’ is an idiomatic narrative rendering of the imperfect ἔλεγεν. The footnote’s proposed alternative ‘ka o chụpụ ndị ọrụ,’ however, normally suggests expelling or dismissing workers in contemporary Standard Igbo and can misrepresent the contextual force of ἐκβάλῃ.
  naturalness: The verse is clear, idiomatic Standard Igbo, with an appropriate public-scripture register. ‘Owuwe ihe ubi hiri nne’ and ‘ndị ọrụ dị ole na ole’ are natural and preserve the agricultural metaphor.
  terminology: ‘Owuwe ihe ubi,’ ‘ndị ọrụ,’ and ‘Onyenwe owuwe ihe ubi’ are consistent and suitable. The stronger nuance of ἐκβάλῃ is best expressed in the note as sending out with force or urgency, rather than by ‘chụpụ.’
  issues:
  - severity: medium
    issue: The footnote gloss ‘ka o chụpụ ndị ọrụ’ is contextually misleading in Standard Igbo.
    rationale: Although ἐκβάλλω can have a forceful sense, ‘chụpụ’ ordinarily means to drive away, expel, or dismiss. In this context it may imply that the workers are being removed from employment rather than commissioned for the harvest. A note referring to forceful or urgent sending preserves the lexical nuance without that misleading implication.
  revised_text: Ọ sịrị ha, “Owuwe ihe ubi hiri nne, ma ndị ọrụ dị ole na ole. Ya mere, rịọọnụ Onyenwe owuwe ihe ubi ka o zipụ[a] ndị ọrụ banye n’owuwe ihe ubi ya.”
  revised_footnotes:
