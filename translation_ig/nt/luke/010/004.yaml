  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: ig
  text: Unu ebula akpa ego, akpa njem[a], ma ọ bụ akpụkpọ ụkwụ; unu ekelekwala onye ọ bụla n'ụzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “akpa njem” dịka “akpa e ji ebu ihe n’azụ” ma ọ bụ naanị “akpa.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka nke a abụghị mmachibido ekele nkịtị, kama ọ na-egosi na ozi ahụ dị ngwa nke na ha ekwesịghị igbu oge n’ogologo ekele ndị mmadụ na-emebu n’omenala oge ahụ.
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: ebula
  rationale: N’ọnọdụ ntụziaka njem a, βαστάζω pụtara iburu ihe. “Ebula” bụ iwu mgbochi doro anya ma bụrụkwa okwu Igbo nkịtị.
- source_word: βαλλάντιον
  choice: akpa ego
  rationale: Okwu a na-ezo aka n’akpa e ji ebu ego; “akpa ego” na-eme ka ihe ọ bụ doo onye na-agụ taa anya.
- source_word: πήραν
  choice: akpa njem
  rationale: πήρα bụ akpa e ji ebu ihe oriri ma ọ bụ ihe ndị ọzọ n’ụzọ. “Akpa njem” na-egosi ọrụ ya nke ọma ma na-ada ka Igbo nke oge a.
- source_word: ὑποδήματα
  choice: akpụkpọ ụkwụ
  rationale: ὑπόδημα bụ ihe a na-eyi n’ụkwụ, nke na-abụkarị sandal n’ụwa Mediterenian oge ahụ. “Akpụkpọ ụkwụ” bụ okwu Igbo a na-aghọta nke ọma maka ụdị ihe a na-eyi n’ụkwụ, n’agbanyeghị na ọ bụghị mgbe niile ka ọ na-akọwa kpọmkwem ụdị sandal oge ochie.
- source_word: μηδένα
  choice: onye ọ bụla
  rationale: 'N’usoro mgbochi “ekelekwala,” “onye ọ bụla” na-enye echiche μηδένα nke ọma: unu ekelela onye ọbụla.'
- source_word: κατὰ τὴν ὁδόν
  choice: n'ụzọ
  rationale: Nkebiokwu a na-ezo aka n’ihe na-eme mgbe mmadụ nọ n’ụzọ njem. “N’ụzọ” dị mkpirikpi, bụrụkwa Igbo ebumpụta ụwa.
- source_word: ἀσπάσησθε
  choice: ekelekwala
  rationale: ἀσπάζομαι pụtara ikele mmadụ ma ọ bụ ịnabata ya. “Ekelekwala” na-echekwa iwu mgbochi ahụ n’enweghị itinye nkọwa omenala n’ahịrị bụ isi.
theological_decisions:
- issue: Ike iwu ahụ machibidoro ikele ndị mmadụ n’ụzọ
  choice: 'E debere ya dịka iwu mgbochi doro anya: “unu ekelekwala onye ọ bụla n’ụzọ.”'
  alternative: Ịsụgharị ya dịka “unu ekwela ka ekele ndị mmadụ gbuo oge unu.”
  rationale: Grik ahụ nyere iwu ozugbo, ọ kọwaghị ya dịka naanị izere igbu oge. Ya mere, ahịrị bụ isi na-echekwa ike na mgbagwoju anya nke okwu ahụ; ihe gbasara ogologo ekele omenala dị n’okpuru peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara [a] n’akụkụ “akpa njem” na [b] n’akụkụ iwu banyere ekele ka ndetu nke ọ bụla kwekọọ n’ezie n’okwu ọ na-akọwa; nke a na-edozi enweghị nkwekọrịta dị n’etiti akara na ndetu n’akwụkwọ ntụnyere Bekee.
