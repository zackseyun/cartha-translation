reference: Luke 10:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: ig
  text: 'Ọbụna ntụ nke si n’obodo unu rapara n’ụkwụ anyị, anyị na-ehichapụ ya megide unu.[a] Ma, maranụ nke a: alaeze Chineke abịaruwo nso.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’okwu Grik, a pụkwara ịhazi ya dịka: “Ọbụna ntụ nke rapara n’ụkwụ anyị, nke si n’obodo unu, anyị na-ehichapụ ya megide unu.” Ngwaa ahụ pụtara kpọmkwem “ihichapụ,” ọ bụghị naanị “ịkwapụ site n’ịma jijiji.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “abịarula nso.” Ụdị ngwaa Grik na-egosi na alaeze Chineke abịaruola nso, na ịdị nso ahụ ka dịkwa mkpa ugbu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: ntụ
  rationale: “Ntụ” na-akọwa kpọmkwem uzuzu dị n’ụzọ ma na-echekwa ihe omume ihe ịrịba ama a pụtara.
- source_word: κολληθέντα
  choice: rapara
  rationale: “Rapara” na-egosi na ntụ ahụ jidesiri ụkwụ ndị ozi ahụ ike.
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: nke si n’obodo unu
  rationale: Nke a na-egosi ebe ntụ ahụ si n’ụzọ doro anya ma bụrụkwa Igbo ebumpụta ụwa.
- source_word: εἰς τοὺς πόδας
  choice: n’ụkwụ anyị
  rationale: N’okwu a, nkebiokwu Grik ahụ na-akọwa ntụ nke rapara n’ụkwụ ndị ozi; nsụgharị a na-eme ka echiche ahụ doo anya.
- source_word: ἀπομασσόμεθα
  choice: anyị na-ehichapụ ya
  rationale: Ngwaa ahụ pụtara ihichapụ ihe rapara n’elu ihe, ọ bụghị nanị ịkwapụ ya site n’ịma jijiji.
- source_word: ὑμῖν
  choice: megide unu
  rationale: N’ọnọdụ a, dative ahụ na-egosi na omume ahụ bụ ihe akaebe ma ọ bụ ikpe megide ndị jụrụ ozi ahụ.
- source_word: πλήν
  choice: Ma
  rationale: “Ma” na-egosi ntụgharị siri ike gaa n’eziokwu nke ha ka ga-amata n’agbanyeghị ihe omume ikpe ahụ.
- source_word: γινώσκετε
  choice: maranụ
  rationale: Ụdị iwu a na-akpọ ndị a na-agwa ka ha mata ma kweta n’eziokwu ahụ.
- source_word: ἤγγικεν
  choice: abịaruwo nso
  rationale: Ụdị perfect ahụ na-egosi na alaeze ahụ abịaruola nso, na ịdị nso ya ka dịkwa mkpa ugbu a.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: alaeze Chineke
  rationale: Nke a bụ okwu Igbo a na-ahụkarị ma na-echekwa ma echiche ọchịchị Chineke ma okwu e ji akọwa alaeze ya.
theological_decisions:
- issue: Ike ihe omume ihichapụ ntụ pụtara
  choice: Ihe omume ihe ịrịba ama nke na-agba akaebe ma na-ekwupụta ikpe megide obodo jụrụ ozi ahụ
  alternative: Omume nkịtị maka ịdị ọcha ma ọ bụ njem
  rationale: ὑμῖν na ọnọdụ okwu iziga ndị ozi na-egosi na nke a bụ ihe akaebe megide ndị jụrụ ozi ahụ; “megide unu” na-echekwa ike a n’etinyeghị nkọwa ọzọ n’amaokwu ahụ.
- issue: Ihe ịdị nso nke alaeze ahụ pụtara
  choice: Alaeze Chineke abịaruwo nso, ịdị nso ahụ ka nwekwara mkpa ugbu a
  alternative: Ọ bụ naanị ihe ga-eme n’oge na-adịghị anya, ma ọ bụ na alaeze ahụ eruola mmezu ya niile
  rationale: ἤγγικεν na-egosi ịdị nso nke bịarutere ma na-adịgide n’ihe ọ pụtara, ma ọ naghị ekwu na mmezu ikpeazụ emezuola.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “maranụ” maka iwu a na-enye ọtụtụ mmadụ, “megide unu” iji chekwaa mmetụta akaebe/ikpe nke dative, na “abịaruwo nso” iji chekwaa esemokwu dị n’etiti ịdị nso bịarutere na mmezu ikpeazụ nke a na-ekwughị.
