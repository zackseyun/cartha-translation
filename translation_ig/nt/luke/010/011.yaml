  verdict: revise
  source_fidelity: The main rendering accurately conveys the dust as originating from the hearers’ city, adhering to the messengers’ feet, being wiped off as an act directed against them, and the perfect-force nearness of God’s kingdom. “Alaeze Chineke abịaruwo nso” is an appropriate Standard Igbo rendering of ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
  naturalness: The verse is clear, modern, and suitably dignified. “Maranụ” and “megide unu” fit the imperative and the judicial/testimonial force of the context. The main text does not require alteration.
  terminology: “Ntụ,” “rapara,” “ehichapụ,” and “alaeze Chineke” are appropriate and consistent theological and lexical choices. Footnote a, however, contains an ungrammatical/unclear alternative (“rapara anyị n’ụkwụ”), which should be corrected to preserve the stated sense that the dust adhered to the feet.
  issues:
  - severity: medium
    issue: Footnote a’s proposed alternative is grammatically defective and obscures the feet-adherence phrase.
    rationale: “rapara anyị n’ụkwụ” does not naturally mean ‘clung to our feet’ in Standard Igbo. It needs “rapara n’ụkwụ anyị” (or an equivalent clear construction). Since the note offers a translation alternative, it must itself be intelligible and source-faithful.
  - severity: low
    issue: Footnote b’s alternative “adịla nso” is less precise as an alternative to the Greek perfect.
    rationale: “Abịarula nso” directly expresses ‘has drawn/come near’ and better preserves the completed approach with present relevance indicated by ἤγγικεν.
