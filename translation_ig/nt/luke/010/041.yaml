id: LUK.10.41
reference: Luke 10:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: ig
  text: Ma Onyenwe anyị zara ya, sị, “Mata, Mata, ị na-echegbu onwe gị, obi adịghịkwa gị jụụ n’ihi ọtụtụ ihe,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: Ma ... zara ya, sị
  rationale: A tụgharịrị usoro participle na ngwaa Grik a n’ụzọ Igbo si ekwu okwu nke ọma. “Ma” na-egosi ntakịrị mgbanwe ma ọ bụ ọdịiche n’etiti mkpesa Mata na nzaghachi Jizọs.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị akọwa κύριος mgbe ọ bụ aha e nyere Jizọs; ọ na-echekwa ma nsọpụrụ ma ụda Kraịst dị n’akụkọ Luk.
- source_word: Μάρθα Μάρθα
  choice: Mata, Mata
  rationale: E debere ịkpọ aha ahụ ugboro abụọ iji chekwaa nkwusi ike na obiọma dị n’okwu a gwara ya kpọmkwem.
- source_word: μεριμνᾷς
  choice: ị na-echegbu onwe gị
  rationale: Nkebiokwu a na-egosi nchegbu dị n’ime mmadụ ma bụrụkwa okwu Igbo doro ndị mmadụ anya.
- source_word: θορυβάζῃ
  choice: obi adịghịkwa gị jụụ
  rationale: Nhọrọ a na-egosi mgbagwoju anya na enweghị udo n’ime mmadụ, ma na-edobe ọdịiche ya na nchegbu nke μεριμνᾷς.
- source_word: περὶ πολλά
  choice: n’ihi ọtụtụ ihe
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo na ọtụtụ ihe bụ ihe na-akpata nchegbu ahụ.
theological_decisions:
- issue: Ịtụgharị κύριος dị ka aha e nyere Jizọs
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: “Onyenwe anyị” na-echekwa ịdị arọ nke aha ahụ n’akụkọ Luk, ebe “Nna ukwu” nwere ike ime ka ọ bụrụ naanị aha nsọpụrụ mmadụ na-enye onye isi.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi “Mata, Mata” na ọdịiche dị n’etiti nchegbu na enweghị udo n’obi.
