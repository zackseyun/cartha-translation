  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: ig
  text: Ọ tụgharịrị chee ndị na-eso ụzọ ahụ ihu, sịrị ha naanị ha, “Ngọzi na-adịrị anya ndị na-ahụ ihe unu na-ahụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: Mgbe ọ tụgharịrị chee … ihu
  rationale: Nke a na-egosi omume Jizọs mere tupu o kwuo okwu, ma na-eme ka njikọ participle ahụ daa nke ọma n’Igbo.
- source_word: κατ’ ἰδίαν
  choice: n’ebe naanị ha nọ
  rationale: Akpaalaokwu a na-egosi na ọ gwara ndị na-eso ụzọ ya okwu iche site n’ebe ndị ọzọ nọ; nsụgharị a bụ nke doro anya ma bụrụ Igbo a na-asụ ugbu a.
- source_word: μαθητάς
  choice: ndị na-eso ụzọ ya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ndị na-amụta ihe n’aka onye nkụzi ma na-eso ya.
- source_word: Μακάριοι
  choice: Ngọzi na-adịrị
  rationale: Ọ na-echekwa ike nke nkwupụta ngọzi ahụ, kama ime ka ọ bụrụ naanị mmetụta obi ụtọ.
- source_word: ὀφθαλμοὶ
  choice: anya
  rationale: A hapụrụ ihe atụ doro anya nke Grik, nke na-ekwu banyere anya dị ka ihe nnọchianya nke ndị e nyere ohere ịhụ.
- source_word: οἱ βλέποντες
  choice: na-ahụ
  rationale: Ọ na-akọwa anya ndị ahụ n’ụzọ dị nkenke ma dịkwa mma n’Igbo.
- source_word: ἃ βλέπετε
  choice: ihe unu na-ahụ
  rationale: Nke a na-echekwa okwu a gwara ọtụtụ ndị na ihe ha na-ahụ ugbu a, n’etinyeghị nkọwa ọzọ.
theological_decisions:
- issue: Ike nke nkwupụta ngọzi ahụ
  choice: E kwupụtara na ngọzi na-adịrị anya na-ahụ ihe ndị na-eso ụzọ ahụ na-ahụ.
  alternative: Ikwuo naanị na ha nwere obi ụtọ ma ọ bụ na ihe ọma dakwasịrị ha.
  rationale: Μακάριοι bụ nkwupụta ngọzi nwere ibu nke amara Chineke; “Ngọzi na-adịrị” na-echekwa ibu ahụ n’etinyeghị nkọwa gbasara ihe ha hụrụ nke amaokwu a n’onwe ya na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ihe oyiyi nke “anya” dị ka ọ dị na Grik, ma zere okwu ụka nke otu òtù pụrụ iche.
