revisions:
- from: Mgbe ọ tụgharịrị chee ndị na-eso ụzọ ya ihu, ọ gwara ha okwu n’ebe naanị ha nọ[a] sị, “Ngọzi na-adịrị anya na-ahụ ihe unu na-ahụ.”
  to: Ọ tụgharịrị chee ndị na-eso ụzọ ahụ ihu, sịrị ha naanị ha, “Ngọzi na-adịrị anya ndị na-ahụ ihe unu na-ahụ.”
  rationale: The revision retains the source’s participial action and its separate address to the disciples while using a more idiomatic Igbo direct-speech form. It retains the plural image of “eyes” and the beatitude wording. The footnote now offers an alternative that reflects being apart from others rather than implying secret speech.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ turning, his separate address to the disciples, and the beatitude on the eyes that see what they see. However, the private-address phrase is more naturally placed directly with the addressees, and the current footnote’s “na nzuzo” can imply secrecy rather than speaking apart from others.
  naturalness: “Ọ gwara ha okwu … sị” is somewhat redundant in this direct-speech construction. “Ọ sịrị ndị na-eso ụzọ ahụ naanị ha” is concise, natural Standard Igbo, and clearly marks the address as separate. “Anya ndị na-ahụ” preserves the Greek plural imagery and is idiomatic.
  terminology: “Ndị na-eso ụzọ” suitably renders μαθητάς, and “Ngọzi na-adịrị” preserves the beatitude force of Μακάριοι without importing a denominational interpretation. The revised footnote gives a genuine lexical alternative for κατ’ ἰδίαν without the potentially misleading secrecy nuance of “na nzuzo.”
  issues:
  - severity: medium
    issue: The footnote alternative “na nzuzo” is semantically imprecise.
    rationale: κατ’ ἰδίαν here means apart from others/privately. “Na nzuzo” often suggests secrecy or concealment, which is not required by the Greek.
  - severity: low
    issue: “Ọ gwara ha okwu n’ebe naanị ha nọ sị” is stylistically redundant.
    rationale: Using both “gwara ha okwu” and “sị” before a direct quotation is less smooth than the normal Igbo direct-speech construction.
  revised_text: Ọ tụgharịrị chee ndị na-eso ụzọ ahụ ihu, sịrị ha naanị ha, “Ngọzi na-adịrị anya ndị na-ahụ ihe unu na-ahụ.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ebe naanị ha nọ.”
    reason: lexical_alternative
  revision_rationale: The revision retains the source’s participial action and its separate address to the disciples while using a more idiomatic Igbo direct-speech form. It retains the plural image of “eyes” and the beatitude wording. The footnote now offers an alternative that reflects being apart from others rather than implying secret speech.
