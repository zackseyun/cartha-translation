  to: Ma lee, otu ọkà n’Iwu[a] biliri iji nwalee ya, sị, “Onye Ozizi, gịnị ka m ga-eme iji keta ndụ ebighị ebi?”
  rationale: The revision removes the unnecessary “ọtọ” after “biliri” and expresses the testing participle with the natural Igbo purposive construction “iji nwalee ya.” It retains the source’s probing sense, the inheritance imagery, and the existing lexical clarification for νομικός.
