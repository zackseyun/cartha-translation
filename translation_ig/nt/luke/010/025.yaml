  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: ig
  text: Ma lee, otu ọkà n’Iwu[a] biliri iji nwalee ya, sị, “Onye Ozizi, gịnị ka m ga-eme iji keta ndụ ebighị ebi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ọkachamara n’Iwu.” Okwu Grik a na-ekwu maka onye maara Iwu ndị Juu nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Ma lee
  rationale: Na-edobe akara akụkọ nke na-adọta uche, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: νομικός τις
  choice: otu ọkà n’Iwu
  rationale: Na-egosi onye maara nke ọma Iwu Mozis, ọ bụghị onye ọka iwu ụlọikpe nke oge a. E ji mkpụrụedemede ukwu dee “Iwu” iji mee ka ntụaka ya n’Iwu ndị Juu doo anya.
- source_word: ἀνέστη
  choice: biliri ọtọ
  rationale: Nke a na-egosipụta omume ibili ọtọ n’ụzọ doro anya ma bụrụkwa okwu Igbo nkịtị.
- source_word: ἐκπειράζων αὐτὸν
  choice: na-anwale ya
  rationale: Na-echekwa echiche nke itinye ya n’ule ma ghara ịkọwa ebumnuche onye ahụ karịa ihe Grik kwuru.
- source_word: λέγων
  choice: sị
  rationale: Ọ bụ ụzọ Igbo dị nkenke ma dịkwa ebumpụta ụwa isi webata okwu onye kwuru.
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Na-enye aha a kpọrọ Jizọs n’ụzọ doro anya, dị ùgwù, ma kwekọọ na Igbo ọkọlọtọ.
- source_word: τί ποιήσας
  choice: gịnị ka m ga-eme iji
  rationale: Na-enye njikọ participle na ngwaa ọdịnihu n’Igbo dị mfe nghọta, ma na-echekwa ajụjụ banyere ihe onye ahụ ga-eme.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Ọ bụ ntụgharị Igbo a maara nke ọma nke na-enye echiche ndụ na-adịghị agwụ agwụ.
- source_word: κληρονομήσω
  choice: keta
  rationale: Na-echekwa ihe atụ nke ihe nketa dị n’okwu Grik kama ime ka ọ bụrụ nanị ‘inweta.’
theological_decisions:
- issue: Ihe νομικός pụtara n’ọnọdụ ndị Juu nke oge ahụ
  choice: ọkà n’Iwu
  alternative: onye ọka iwu
  rationale: “Ọkà n’Iwu” na-egosi onye bụ ọkachamara n’Iwu Mozis ma na-ezere nghọtahie na ọ bụ onye ọka iwu obodo nke oge a.
- issue: Ike okwu τί ποιήσας ... κληρονομήσω
  choice: gịnị ka m ga-eme iji keta ndụ ebighị ebi?
  alternative: gịnị ka m ga-eme ka m wee keta ndụ ebighị ebi?
  rationale: Nhọrọ a bụ Igbo ebumpụta ụwa ma na-echekwa otú nwoke ahụ si jụọ ajụjụ ahụ n’ihe gbasara ihe ọ ga-eme, na-enweghị idozi esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta mee ntụgharị a. A hapụrụ “Ma lee” iji chekwaa ike okwu akụkọ ahụ, a họrọkwara “ọkà n’Iwu” iji zere echiche onye ọka iwu ụlọikpe nke oge a.
