id: LUK.10.6
reference: Luke 10:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: ig
  text: Ọ bụrụkwa na nwa nke udo nọ n’ebe ahụ[a], udo unu ga-ezu ike n’ahụ ya; ma ọ bụrụ na o nweghị, udo unu ga-alaghachikwute unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye udo”—ya bụ, onye dị njikere ịnabata ozi na-eweta udo.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: nwa udo
  rationale: Nke a na-edobe akpaalaokwu ndị Semitic na ọdịdị nwoke otu onye dị na Grik. Ọ pụtara onye udo ji mara ma ọ bụ onye dị njikere ịnabata ozi na-eweta udo; nkọwa ala peeji na-enye ụzọ okwu Igbo doro anya karị.
- source_word: ἐπαναπαήσεται
  choice: ga-adakwasị ya
  rationale: Nhọrọ a na-egosi udo ahụ ịbịakwasị onye ahụ ma nọrọ n’ebe ọ nọ, ma na-agakwa nke ọma na Igbo.
- source_word: ἡ εἰρήνη ὑμῶν
  choice: udo unu
  rationale: A hapụrụ usoro nwekọrịta dị na Grik, n’akọwaghị ya naanị dị ka ekele ma ọ bụ ngọzi.
- source_word: μήγε
  choice: ma ọ bụrụ na ọ dịghị
  rationale: Nke a na-egosi ọnọdụ megidere nke mbụ n’ụzọ doro anya ma dị mfe n’Igbo.
- source_word: ἀνακάμψει
  choice: ọ ga-alaghachikwute
  rationale: Ngwaa a pụtara ịlaghachi ma ọ bụ ịtụgharị azụ; okwu a na-echekwa echiche na udo ahụ na-alọghachikwute ndị zitere ya mgbe ọ na-achọtaghị ebe ọ ga-anọ.
- source_word: ἐφ’ ὑμᾶς
  choice: unu
  rationale: N’ime okwu ‘ọ ga-alaghachikwute unu,’ njikọ ‘-kwute’ na-egosipụta ebumnuche nke nlọghachi ahụ n’Igbo eke.
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: Ọ bụrụkwa na ... nọ n’ebe ahụ
  rationale: Nke a na-echekwa njikọ καί, ọnọdụ ahụ, na nkwusi ike n’ebe ahụ.
theological_decisions:
- issue: Ma a ga-eme ka akpaalaokwu nwoke υἱὸς εἰρήνης bụrụ okwu na-enweghị nwoke ma ọ bụ nwaanyị
  choice: E debere ‘nwa udo’ n’ahịrị isi
  alternative: onye udo, ya bụ, onye dị njikere ịnabata ozi na-eweta udo
  rationale: Grik ji ọdịdị nwoke otu onye na akpaalaokwu Semitic. ‘Nwa udo’ na-echekwa ọdịdị isi mmalite ahụ, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo onye na-agụ anya n’enweghị itinye nkọwa otu ụka.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara akpaalaokwu isi mmalite n’ahịrị isi, tinyekwa nkọwa doro anya n’ala peeji.
