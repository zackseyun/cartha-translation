review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the conditional construction, the possessive “your peace,” and the return of that peace to the disciples. However, “ga-adakwasị ya” primarily conveys ‘fall/come upon him’ and does not adequately retain ἐπαναπαήσεται, ‘will come to rest/remain upon.’ The revised wording explicitly preserves the resting image. “Nwa nke udo” is also a more idiomatic and transparent Igbo calque of the Greek Semitic-style expression than the compressed “nwa udo.”
  naturalness: The revision is fluent Standard Igbo while retaining the source’s solemn, proverbial register. Repeating “udo unu” in the final clause removes a potentially unclear pronoun antecedent and makes the sense natural without adding interpretation.
  terminology: “Nwa nke udo” preserves the masculine-singular, idiomatic source expression; the footnote supplies the natural explanatory alternative “onye udo.” “Udo unu ga-ezu ike n’ahụ ya” accurately expresses peace settling upon the recipient, without reducing it merely to a greeting.
  issues:
  - severity: medium
    issue: “ga-adakwasị ya” does not express the ‘rest/settle upon’ sense of ἐπαναπαήσεται.
    rationale: In Standard Igbo, adakwasị commonly denotes coming or falling upon someone. “Ga-ezu ike n’ahụ ya” preserves the specific image that the peace comes to rest upon the person.
  - severity: low
    issue: “nwa udo” is less idiomatic and less transparent than “nwa nke udo.”
    rationale: The genitive linker nke more clearly represents the source idiom and avoids reading the phrase simply as a child associated with peace.
  - severity: low
    issue: The final pronoun “ọ” can momentarily have an unclear antecedent.
    rationale: Repeating “udo unu” makes clear that it is the peace, not the person, that returns, as required by the Greek.
  revised_text: Ọ bụrụkwa na nwa nke udo nọ n’ebe ahụ[a], udo unu ga-ezu ike n’ahụ ya; ma ọ bụrụ na o nweghị, udo unu ga-alaghachikwute unu.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “onye udo”—ya bụ, onye dị njikere ịnabata ozi na-eweta udo.
    reason: lexical_alternative
  revision_rationale: The revised text retains the Greek idiom in the main line, improves its Standard Igbo form, and restores the central image of the disciples’ peace resting upon a receptive person. The footnote anchor and lexical-alternative function are retained unchanged.
