  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: ig
  text: Ọ sịrị, “Ọ bụ onye meere ya ebere.” Jizọs wee sị ya, “Gaa, gị kwa, mee otu ahụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: onye ahụ meere ya ebere
  rationale: Nke a na-egosipụta okwu Grik nke pụtara ime ebere n’ebe mmadụ nọ, n’Igbo nkịtị ma doo anya.
- source_word: Πορεύου
  choice: Gaa
  rationale: Iwu dị mkpụmkpụ na nke kpọmkwem kwekọrọ n’ụdị iwu nke Grik.
- source_word: καὶ σὺ
  choice: gị onwe gị meekwa
  rationale: E tinyere nkwusi ike dị na σὺ n’ụzọ doro anya; -kwa na-egosikwa καὶ, ya bụ, na onye ahụ ga-eme otu ihe ahụ.
- source_word: ποίει ὁμοίως
  choice: meekwa otu ahụ
  rationale: Ọ na-echekwa iwu ka a na-eme omume yiri nke onye ebere ahụ, ọ bụghị naanị otu omume n’otu oge.
theological_decisions:
- issue: Nkwusi ike n’ọrụ onye na-ege Jizọs ntị
  choice: gị onwe gị meekwa otu ahụ
  alternative: meekwa otu ahụ
  rationale: Grik kwuru καὶ σὺ n'ụzọ pụtara ìhè; nsụgharị ahụ na-echekwa nkwusi ike na onye ahụ n’onwe ya, na-enweghị itinye nkọwa ụka ọzọ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “Jizọs” dịka nsụpe aha a na-ahụkarị n’Igbo. Okwu ahụ na-edobe mkparịta ụka kpọmkwem na nkwusi ike nke Grik.
