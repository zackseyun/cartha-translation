id: LUK.10.13
reference: Luke 10:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: ig
  text: “Ahụhụ ga-adịrị gị, Kọrazin! Ahụhụ ga-adịrị gị, Betsaida! Ọ bụrụ na ọrụ ebube ndị mere n’etiti unu mere na Taịa na Saịdọn, ha gaara echegharị ogologo oge gara aga, ka ha nọ ọdụ n’ákwà mkpe na ntụ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Ahụhụ ga-adịrị gị
  rationale: Nke a na-egosipụta ma ịdọ aka ná ntị amụma banyere ikpe ma mwute dị n’okwu ahụ; ọ bụkwa okwu Igbo doro anya e ji agwa onye ahụ okwu kpọmkwem.
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: Kọrazin / Betsaida / Taịa / Saịdọn
  rationale: E dere aha obodo ndị a n’ụdị dabara n’usoro ụda na mkpopụta asụsụ Igbo.
- source_word: δυνάμεις
  choice: ọrụ ebube ndị ahụ na-egosi ike
  rationale: Nhọrọ a na-egosi na ihe ndị a bụ ọrụ pụrụ iche ma na-echekwa isi echiche banyere ike dị n’okwu Grik ahụ, kama ime ka ọ bụrụ naanị aha teknụzụ maka ọrụ ebube.
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: mere ... nke mere
  rationale: Iji ‘mere’ ugboro abụọ na-echekwa nkwughachi nke γίνομαι ma na-egosi ebe ihe ndị ahụ mere n’Igbo dị mfe nghọta.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: N’ebe a, ọtụtụ ‘unu’ na-ezo aka n’obodo na ndị bi na ya; ‘n’etiti unu’ na-egosi ebe ọrụ ndị ahụ mere n’ụzọ eke.
- source_word: πάλαι
  choice: kemgbe
  rationale: ‘Kemgbe’ na-enye echiche nke na ha gaara eme nke ahụ ogologo oge gara aga n’ọnọdụ a na-eche n’echiche.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: n’ákwà mkpe na ntụ
  rationale: A hapụrụ ihe atụ ọdịnala nke ákwà mkpe na ntụ, nke na-egosi iru uju na nchegharị.
- source_word: καθήμενοι
  choice: nọ ọdụ
  rationale: Nke a na-echekwa ọnọdụ ahụ mmadụ ji anọ nke participle Grik gosiri.
- source_word: μετενόησαν
  choice: gaara echegharị
  rationale: ‘Ichegharị’ bụ okwu Igbo doro anya maka mgbanwe nke uche na ụzọ ndụ n’ebe a, ma usoro ‘gaara’ na-egosi ọnọdụ na-emeghị eme.
theological_decisions:
- issue: Ụdị ọrụ ndị a kpọrọ δυνάμεις
  choice: ọrụ ebube ndị ahụ na-egosi ike
  alternative: ọrụ ike; ọrụ ebube
  rationale: Nsụgharị ahụ na-ejikọta ọdịdị ọrụ ndị pụrụ iche na echiche bụ isi nke ike, na-enweghị ịmachi okwu Grik ahụ n’otu nkọwa ozizi.
- issue: Ike nke μετενόησαν
  choice: gaara echegharị
  alternative: ha gaara agbanwe uche ha
  rationale: ‘Ichegharị’ dabara n’otú Luk si eji okwu ahụ eme ihe ma na-ahapụ njikọ dị n’etiti mgbanwe uche na ntụgharị ndụ n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- issue: Ihe atụ nchegharị
  choice: kemgbe, nọ ọdụ n’ákwà mkpe na ntụ
  alternative: ha gaara egosi nchegharị site n’iyiri ákwà mkpe na iji ntụ
  rationale: A hapụrụ ọnọdụ na ihe atụ a hụrụ anya n’ihe odide Grik kama ịgbanwe ya ka ọ bụrụ nkọwa nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A hapụrụ ụdị ịdọ aka ná ntị amụma, ọnọdụ megidere eziokwu, na ihe atụ ákwà mkpe na ntụ. Akara nkọwa ala ala [a] na [b] dị kpọmkwem n’ebe okwu ha na-akọwa pụtara.
