review_pass:
  verdict: revise
  source_fidelity: The conditional construction, direct prophetic denunciation, repeated occurrence language, and mourning imagery are substantially represented. However, “kemgbe” normally means “since” and does not faithfully express πάλαι (“long ago”) in this contrary-to-fact statement. The main rendering of δυνάμεις also adds an explanatory element (“na-egosi ike”) and the demonstrative “ndị ahụ,” neither of which is present in Greek.
  naturalness: “A sị na” is understandable, but “Ọ bụrụ na” is clearer Standard Igbo for the counterfactual conditional in this context. “Ogologo oge gara aga” naturally renders “long ago.” Recasting the participial phrase with “ka ha nọ ọdụ” is fluent while retaining the posture of mourning.
  terminology: “Ahụhụ ga-adịrị gị” appropriately conveys οὐαί in a prophetic judgment register. “Ọrụ ebube” is a familiar Igbo biblical rendering, while the footnote preserves the power/deed nuance of δυνάμεις. “Echegharị” is suitable for μετενόησαν without doctrinal over-specification.
  issues:
  - severity: medium
    issue: “kemgbe” used for πάλαι
    rationale: “Kemgbe” ordinarily marks duration from a specified past point (“since”), whereas πάλαι means “long ago.” “Ogologo oge gara aga” conveys the temporal sense accurately.
  - severity: low
    issue: Main-text rendering of δυνάμεις is over-explicit
    rationale: “ọrụ ebube ndị ahụ na-egosi ike” adds “those” and an explanatory assertion that the works “show power.” The Greek noun can be rendered naturally as “ọrụ ebube,” with “ọrụ ike” supplied in a footnote to preserve its lexical range.
  - severity: low
    issue: Conditional wording can be clearer in Standard Igbo
    rationale: “Ọ bụrụ na” gives a direct and idiomatic conditional frame; together with “gaara,” it clearly conveys the unreal condition and result.
  revised_text: “Ahụhụ ga-adịrị gị, Kọrazin! Ahụhụ ga-adịrị gị, Betsaida! Ọ bụrụ na ọrụ ebube ndị mere n’etiti unu mere na Taịa na Saịdọn, ha gaara echegharị ogologo oge gara aga, ka ha nọ ọdụ n’ákwà mkpe na ntụ.”
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ọrụ ike”; n’asụsụ Grik, “ọrụ nke ike.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ha gaara agbanwe uche na ụzọ ha.”
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the temporal adverb, removes additions from the main rendering of δυνάμεις, and uses a more direct Standard Igbo conditional. It retains the source’s judgment register, contrary-to-fact sense, concrete sackcloth-and-ashes imagery, and the participial posture of sitting. Footnote anchors remain attached to the relevant terms: [a] after “ọrụ ebube” and [b] after “echegharị.”'
