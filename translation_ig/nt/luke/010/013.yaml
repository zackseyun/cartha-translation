revisions:
- from: “Ahụhụ ga-adịrị gị, Kọrazin! Ahụhụ ga-adịrị gị, Betsaida! N’ihi na a sị na ọrụ ebube ndị ahụ na-egosi ike[a] nke mere n’etiti unu mere na Taịa na Saịdọn, ha gaara echegharị[b] kemgbe, nọ ọdụ n’ákwà mkpe na ntụ.”
  to: “Ahụhụ ga-adịrị gị, Kọrazin! Ahụhụ ga-adịrị gị, Betsaida! Ọ bụrụ na ọrụ ebube ndị mere n’etiti unu mere na Taịa na Saịdọn, ha gaara echegharị ogologo oge gara aga, ka ha nọ ọdụ n’ákwà mkpe na ntụ.”
  rationale: 'The revision corrects the temporal adverb, removes additions from the main rendering of δυνάμεις, and uses a more direct Standard Igbo conditional. It retains the source’s judgment register, contrary-to-fact sense, concrete sackcloth-and-ashes imagery, and the participial posture of sitting. Footnote anchors remain attached to the relevant terms: [a] after “ọrụ ebube” and [b] after “echegharị.”'
