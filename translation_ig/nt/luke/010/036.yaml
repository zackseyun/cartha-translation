  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: ig
  text: “N’ime mmadụ atọ ndị a, ònye ka ọ dị gị ka ọ ghọrọ onye agbata obi nye nwoke ahụ dabara n’aka ndị ohi?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ime mmadụ atọ ndị a, ònye ka i chere na ọ bụụrụ nwoke ahụ dabara n’aka ndị ohi onye agbata obi?” N’asụsụ Grik, okwu ahụ pụtara n’ụzọ kpọmkwem karị, “ọ dị gị ka ọ ghọrọ onye agbata obi,” nke na-eme ka omume mmadụ ji aghọ onye agbata obi pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: ònye
  rationale: Ajụjụ a na-ahọrọ otu onye n’ime mmadụ atọ a kpọrọ aha; “ònye” bụ ụzọ Igbo si ajụ nke a n'ụzọ doro anya.
- source_word: τούτων τῶν τριῶν
  choice: n’ime mmadụ atọ ndị a
  rationale: Nke a na-egosipụta partitive genitive nke ọma. E tinyere “mmadụ” ka ahịrịokwu bụrụ nke e ji Igbo nkịtị ekwu, n’agbanyeghị na okwu ahụ anọghị kpọmkwem na Grik.
- source_word: πλησίον
  choice: onye agbata obi
  rationale: N’ebe a, okwu ahụ pụtara onye na-emeso onye ọzọ dịka agbata obi, ọ bụghị nanị onye bi nso.
- source_word: δοκεῖ σοι
  choice: ka i chere
  rationale: Nke a bụ ụzọ Igbo dị ndụ si gosi echiche nke “ọ dị gị ka” ma ọ bụ “ị na-eche,” n’enweghị ịgbakwunye nkọwa.
- source_word: γεγονέναι
  choice: ghọrọ
  rationale: “Ghọrọ” na-echekwa echiche γίνομαι nke ịghọ ma ọ bụ ịbịa bụrụ, kama ime ka ọ bụrụ nanị ọnọdụ kwụ otu ebe.
- source_word: τοῦ ἐμπεσόντος
  choice: nye nwoke ahụ dabara
  rationale: Participial phrase a na-ezo aka n’otu nwoke e kwuru okwu ya n’akụkọ ahụ; “nwoke ahụ” bụ Igbo eke ma doo onye a na-ekwu banyere ya anya.
- source_word: εἰς τοὺς λῃστάς
  choice: n’aka ndị ohi
  rationale: Ọ bụ akpaalaokwu Igbo e ji egosi na onye ahụ dabara n’ike ndị ohi; ọ na-ebufe ihe idiom Grik ahụ pụtara n'ụzọ eke.
theological_decisions:
- issue: Isi omume ọma dị n’ajụjụ ahụ n’ilu onye Sameria ahụ
  choice: Jiri “ghọrọ onye agbata obi” chekwaa mgbanwe Jizọs mere site n’ịchọpụta onye bụ agbata obi gaa n’ịghọrọ onye agbata obi site n’omume.
  alternative: “bụụrụ onye agbata obi” ma ọ bụ “bụ onye agbata obi”
  rationale: Perfect infinitive γεγονέναι na-elekwasị anya n’ịbịa bụrụ onye agbata obi. “Ghọrọ” na-echekwa ike omume na nke nkà mmụta okpukpe ahụ n’enweghị idozi esemokwu dị n’okwu ahụ n’ụzọ ntụgharị uche.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “n’aka ndị ohi” dịka akpaalaokwu Igbo eke, ebe “ghọrọ onye agbata obi” na-echekwa isi okwu pụrụ iche dị na Grik.
