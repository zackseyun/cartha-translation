revisions:
- from: “N’ime mmadụ atọ ndị a, ònye ka i chere ghọrọ onye agbata obi nye nwoke ahụ dabara n’aka ndị ohi?”[a]
  to: “N’ime mmadụ atọ ndị a, ònye ka ọ dị gị ka ọ ghọrọ onye agbata obi nye nwoke ahụ dabara n’aka ndị ohi?”[a]
  rationale: The revision replaces the less natural “ka i chere ghọrọ” with “ka ọ dị gị ka ọ ghọrọ,” which faithfully represents both δοκεῖ (“seems”) and σοι (“to you”) and supplies a grammatical Standard Igbo complement clause. It retains the draft’s sound renderings of the ethical reversal (“ghọrọ onye agbata obi”) and the robbers idiom.
