revisions:
- from: Ma gị onwe gị, Kapanaum, à ga-ebuli gị elu ruo n’eluigwe? A ga-eweda gị ruo n’ala ndị nwụrụ anwụ.[a]
  to: Ma gị, Kapanọm, à ga-ebuli gị elu ruo n’eluigwe? A ga-eweda gị ruo na Hedis.[a]
  rationale: The revision retains the Greek rhetorical question and passive judgment language, uses the established Igbo form “Kapanọm,” and represents ᾅδης directly as “Hedis.” The footnote then supplies the explanatory sense without conflating Hades and Gehena.
  reviewer_model: gpt-5.6-terra
