review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the rhetorical question (μὴ ... ὑψωθήσῃ), the vertical contrast between heaven and Hades, and the passive sense of καταβιβασθήσῃ. However, the main text''s explanatory rendering of ᾅδης and its footnote are reversed: the note presents the Greek lexical form as though it were merely an alternative to the explanatory translation.'
  naturalness: The sentence is clear Standard Igbo and appropriately formal. “Kapanọm” is the more established and natural Igbo biblical form of the place name than “Kapanaum.” “Ruo na Hedis” is idiomatic in this context and makes the contrast with “ruo n’eluigwe” clear.
  terminology: Use “Hedis” in the text to represent ᾅδης directly, preserving its distinction from Gehena. Give “ala ndị nwụrụ anwụ” as the explanatory alternative in the footnote. This avoids identifying Hades with final punishment.
  issues:
  - severity: medium
    issue: The Hades footnote reverses the relationship between the main rendering and the lexical alternative.
    rationale: The main text says “ala ndị nwụrụ anwụ,” but the note says “Ma ọ bụ, ‘ruo na Hedis.’” Since Hedis is the direct representation of the Greek term, it should be the main rendering, while “ala ndị nwụrụ anwụ” belongs as the explanatory alternative.
  - severity: low
    issue: The place name “Kapanaum” is not the established Igbo biblical form.
    rationale: “Kapanọm” is the customary Standard Igbo form and is more readily recognizable to Igbo Bible readers.
  revised_text: Ma gị, Kapanọm, à ga-ebuli gị elu ruo n’eluigwe? A ga-eweda gị ruo na Hedis.[a]
