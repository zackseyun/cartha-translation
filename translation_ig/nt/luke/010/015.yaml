id: LUK.10.15
reference: Luke 10:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: ig
  text: Ma gị, Kapanọm, à ga-ebuli gị elu ruo n’eluigwe? A ga-eweda gị ruo na Hedis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ruo n’ala ndị nwụrụ anwụ.” Okwu Grik bụ “Hedis,” ọ bụghị “Gehena,” nke a na-asụgharịkarị “hel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Kapanaum
  rationale: E depụtara aha obodo ahụ n’ụzọ dabara n’usoro mkpụrụokwu na mkpọpụta Igbo, kama ịsụgharị ihe aha ahụ pụtara.
- source_word: μὴ ... ὑψωθήσῃ
  choice: à ga-ebuli gị elu
  rationale: E ji ajụjụ nkwupụta nke na-atụ anya azịza ‘mba’ chekwaa usoro Grik ahụ. ‘Ebuli gị elu’ na-egosipụta ma ihe oyiyi nke ịrị elu ma echiche nke inweta ọkwá dị elu.
- source_word: ἕως οὐρανοῦ
  choice: ruo n’eluigwe
  rationale: ‘Ruo’ na-egosipụta oke ebe, ebe ‘n’eluigwe’ na-echekwa ọdịiche kwụ ọtọ dị n’etiti eluigwe na ebe ndị nwụrụ anwụ.
- source_word: ἕως τοῦ ᾅδου
  choice: ruo n’ala ndị nwụrụ anwụ
  rationale: Nhọrọ a na-akọwa Hedis dị ka ebe ma ọ bụ ala ndị nwụrụ anwụ, na-enweghị ịgwakọta ya na Gehena ma ọ bụ itinye ozizi banyere ntaramahụhụ ikpeazụ n’amaokwu ahụ.
- source_word: καταβιβασθήσῃ
  choice: A ga-eweda gị
  rationale: Usoro a na-echekwa olu nnara nke Grik—ọ bụ onye ọzọ ga-eme ka obodo ahụ rịdata—ma na-egosikwa iweda ya n’ọnọdụ ikpe.
theological_decisions:
- issue: Nsụgharị ᾅδης
  choice: ala ndị nwụrụ anwụ
  alternative: Hedis; hel
  rationale: ‘Ala ndị nwụrụ anwụ’ na-eme ka ndị na-agụ Igbo ghọta ihe okwu Grik ahụ na-ezo aka na ya ma na-echekwa ọdịiche ya na Gehena. A jụrụ ‘hel’ n’ihi na ọ pụrụ ime ka a tụnye echiche banyere ebe ntaramahụhụ ikpeazụ n’ebe okwu Grik ahụ hapụrụ ihe ahụ n’obosara.
- issue: Ajụjụ μὴ ... ὑψωθήσῃ
  choice: ajụjụ nkwupụta na-atụ anya azịza mba
  alternative: 'nkwupụta kpọmkwem: ‘a gaghị ebuli gị elu’'
  rationale: E chekwara ụdị ajụjụ dị n’ihe odide Grik, ya na ike ịkatọ onwe-elu nke obodo ahụ, kama ịgbanwe ya ka ọ bụrụ nkwupụta nkịtị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘gị onwe gị’ mee ka nkwusi ike dị na καὶ σύ pụta ìhè; e ji akara ụda na ‘à ga-’ mee ka ajụjụ ahụ ghara ịdị ka nkwupụta.
