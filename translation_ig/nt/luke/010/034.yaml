revisions:
- from: Ọ bịaruru ya nso, kechie ọnyá ya, na-awụkwasị ha mmanụ oliv na mmanya. Mgbe ahụ, ọ tụkwasịrị ya n’anụmanụ nke ya[a], kpọga ya n’ụlọ ndị njem na-anọ, ma lekọta ya.
  to: Ọ gakwuuru ya nso, kechie ọnyá ya, na-awụkwasị ha mmanụ na mmanya. Mgbe ahụ, ọ kwasịrị ya n’elu anụmanụ nke ya[a], kpọgara ya n’ụlọ nnabata ndị njem, ma lekọta ya.
  rationale: The revision retains the source’s action sequence and its nontechnical, compassionate register while using more idiomatic Standard Igbo. It makes clear that the man was placed on top of the animal and renders the inn as a place receiving travelers. The source simply says “oil,” so “mmanụ” is retained without specifying a variety. The sole footnote remains correctly anchored and unchanged in meaning.
