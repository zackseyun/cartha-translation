id: LUK.10.34
reference: Luke 10:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: ig
  text: Ọ gakwuuru ya nso, kechie ọnyá ya, na-awụkwasị ha mmanụ na mmanya. Mgbe ahụ, ọ kwasịrị ya n’elu anụmanụ nke ya[a], kpọgara ya n’ụlọ nnabata ndị njem, ma lekọta ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “anụmanụ” pụtara anụ e ji ebu ibu ma ọ bụ anụ a na-agba.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: Ọ bịaruru ya nso
  rationale: Na-egosi na ọ gara bịaruo nwoke ahụ nso tupu ya elekọta ọnyá ya; nsụgharị a bụ nke doro anya ma dịkwa mfe n’Igbo.
- source_word: κατέδησεν τὰ τραύματα αὐτοῦ
  choice: kechie ọnyá ya
  rationale: “Kechie” na-egosipụta ikechi ọnyá ka e wee chebe ya, n’agbakwụnyeghị ihe dị ka ákwà nke ederede Grik na-ekwughị kpọmkwem.
- source_word: ἐπιχέων
  choice: na-awụkwasị ha
  rationale: Ọnọdụ ngwaa a na-egosi ihe ọ na-eme mgbe ọ na-ekechi ọnyá ndị ahụ; “ha” na-ezo aka n’ọnyá ndị ahụ.
- source_word: ἔλαιον
  choice: mmanụ oliv
  rationale: ἔλαιον na-ezo aka na mmanụ sitere n’osisi oliv; ịkpọ ya “mmanụ oliv” na-egbochi onye Igbo ịghọta ya dịka mmanụ nkwụ.
- source_word: οἶνον
  choice: mmanya
  rationale: Nke a bụ okwu Igbo nkịtị dabara na οἶνος; e tinyeghị nkọwa banyere ebumnuche ọgwụ n’ihi na ederede ekwughị ya kpọmkwem.
- source_word: ἐπιβιβάσας δὲ αὐτὸν
  choice: Mgbe ahụ, ọ tụkwasịrị ya
  rationale: 'Na-egosipụta ihe ọzọ sochiri: o buliri nwoke ahụ tinye ya n’elu anụmanụ ahụ.'
- source_word: ἐπὶ τὸ ἴδιον κτῆνος
  choice: n’anụmanụ nke ya[a]
  rationale: “Nke ya” na-echekwa nkwusi ike nke ἴδιον, ebe “anụmanụ” na-ahapụ ụdị anụ ahụ ghe oghe dịka κτῆνος si eme.
- source_word: εἰς πανδοχεῖον
  choice: n’ụlọ ndị njem na-anọ
  rationale: Nke a na-akọwa ebe a na-anabata ndị njem ka ha nọrọ n’abalị, n’enweghị iji okwu oge a dịka “họtelu” nke nwere ike ịgbakwunye echiche ọzọ.
- source_word: ἐπεμελήθη αὐτοῦ
  choice: lekọta ya
  rationale: Na-egosipụta nlekọta onwe onye na nlebara anya nke ngwaa Grik ahụ pụtara.
theological_decisions: []
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị mfe ma dị ugwu mee ihe. A họọrọ “mmanụ oliv” kama “mmanụ” naanị ka ndị na-agụ Igbo ghara iche na ọ bụ mmanụ nkwụ. E debeghị ihe mgbakwunye nkọwa okpukpe ọ bụla.
