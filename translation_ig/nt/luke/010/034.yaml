    reason: cultural_note
  revision_rationale: The revision retains the source’s action sequence and its nontechnical, compassionate register while using more idiomatic Standard Igbo. It makes clear that the man was placed on top of the animal and renders the inn as a place receiving travelers. The source simply says “oil,” so “mmanụ” is retained without specifying a variety. The sole footnote remains correctly anchored and unchanged in meaning.
