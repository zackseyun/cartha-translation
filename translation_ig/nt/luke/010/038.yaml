base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: ig
  text: Ka ha na-aga, ọ banyere n’otu obodo nta. Otu nwanyị aha ya bụ Mata nabatara ya nke ọma[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nabatara ya dị ka ọbịa.” Ngwaa Grik ahụ na-egosi ịnabata mmadụ nke ọma dị ka onye ọbịa.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: Ka ha na-aga n’ụzọ
  rationale: 'Usoro ἐν tinyere infinitive nwere article na-egosi ihe na-eme n’otu oge: ‘ka/ebe ha na-aga.’ ‘Ha’ na-edobe plural αὐτούς, ebe a hapụrụ δέ ka usoro akụkọ Igbo si aga n’enweghị ịgbakwunye okwu oge na-adịghị na Grik.'
- source_word: αὐτὸς
  choice: ọ
  rationale: Nnọchiaha otu onye na-ekewapụ onye a na-ekwu maka ya na ‘ha’ ndị na-aga. N’Igbo, mgbanwe site na ‘ha’ gaa na ‘ọ’ na-eme ka ọdịiche ahụ doo anya n’enweghị ịgbakwunye aha ‘Jizọs’ nke ederede a ekwughị kpọmkwem.
- source_word: εἰσῆλθεν
  choice: banyere
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke nkịtị isi kwuo na mmadụ batara n’ebe ahụ.
- source_word: εἰς κώμην τινά
  choice: n’otu obodo nta
  rationale: κώμη bụ obodo nta, τινά na-enye echiche nke otu obodo a na-akpọghị aha; ‘otu’ na-edobe indefiniteness ahụ n’ụzọ Igbo na-ada eke.
- source_word: γυνὴ δέ τις
  choice: Otu nwanyị
  rationale: Okwu a na-ewebata onye ọhụrụ n’akụkọ. ‘Otu nwanyị’ na-egosipụta τις n’ụzọ Igbo na-ada mma, ebe ahịrịokwu ọhụrụ na-eburu ọrụ njikọ dị nro nke δέ.
- source_word: ὀνόματι Μάρθα
  choice: aha ya bụ Mata
  rationale: Nke a bụ akpaalaokwu Igbo doro anya maka ịkpọ aha mmadụ; Μάρθα ka e depụtara dịka ‘Mata’ n’usoro mkpụrụokwu Igbo.
- source_word: ὑπεδέξατο αὐτόν
  choice: nabatara ya nke ọma[a]
  rationale: ὑποδέχομαι pụtara ịnabata mmadụ, karịchaa n’ụzọ ile ọbịa. ‘Nke ọma’ na-egosi nnabata obiọma ahụ, ma ọ naghị agbakwunye ‘n’ụlọ ya,’ ihe a na-ekwughị kpọmkwem na Grik.
theological_decisions: []
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu ahụ ụzọ abụọ ka akụkọ ahụ gụọ nke ọma n’Igbo. E tinyere akara nkọwa ụkwụ n’ebe ‘nabatara ya nke ọma’ dị, n’ihi na nkọwa ahụ metụtara ὑπεδέξατο, ọ bụghị okwu banyere njem ahụ.
