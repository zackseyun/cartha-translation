id: LUK.10.30
reference: Luke 10:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: ig
  text: Jizọs zara sị, “Otu nwoke si na Jerusalem na-agbada gaa Jeriko, o wee daba n’aka ndị na-apụnara mmadụ ihe. Ha yipụrụ ya uwe, kụọ ya ihe, ma pụọ, hapụ ya ka ọ fọrọ obere ka ọ nwụọ.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ ὁ Ἰησοῦς εἶπεν
  choice: Jizọs wee zaa sị
  rationale: N’ebe a, ὑπολαμβάνω pụtara iburu okwu ma zaghachi; “wee zaa sị” bụ Igbo nkịtị ma na-egosipụta njikọ ahụ.
- source_word: Ἄνθρωπός τις
  choice: Otu nwoke
  rationale: Na akụkọ ihe atụ a, “otu nwoke” na-asụgharị mmadụ a na-akọwaghị onye ọ bụ n’ụzọ doro anya ma dị mfe.
- source_word: κατέβαινεν
  choice: na-agbada
  rationale: Na-echekwa echiche nke njem mgbada site na Jerusalem gaa Jeriko, nke dabara na ọdịdị ala ahụ.
- source_word: λῃσταῖς περιέπεσεν
  choice: wee daba n’aka ndị ohi
  rationale: Akpaalaokwu Igbo a na-egosi na ndị na-apụnara mmadụ ihe wakporo ya; “ndị ohi” bụ okwu ndị mmadụ na-aghọta ngwa ngwa n’ọnọdụ a.
- source_word: ἐκδύσαντες αὐτὸν
  choice: Ha yipụrụ ya uwe
  rationale: Na-egosi kpọmkwem na ha wepụrụ uwe ya, ọ bụghị naanị na ha zuru ihe o ji.
- source_word: πληγὰς ἐπιθέντες
  choice: tie ya ihe
  rationale: Ọ bụ ụzọ Igbo sitere n’okike isi kwuo na ha merụrụ ya ahụ site n’iti ya.
- source_word: ἡμιθανῆ
  choice: ka ọ nọ n’ọnọdụ ịbụ onye ọ fọrọ obere ka ọ nwụọ
  rationale: Na-eburu echiche nke ‘ọkara nwụrụ anwụ’ n’Igbo doro anya, na-ekwughị na ọ nwụọla n’ezie.
theological_decisions:
- issue: Ọnọdụ nwoke ahụ mgbe ndị ohi hapụrụ ya
  choice: onye ọ fọrọ obere ka ọ nwụọ
  alternative: ọkara nwụrụ anwụ
  rationale: Nhọrọ a na-echekwa esemokwu dị na ἡμιθανῆ—ọ ka dị ndụ ma ọnwụ eruola ya nso—n’asụsụ Igbo nkịtị, n’enweghị nkọwa ozizi agbakwunyere.
translation_notes:
  register: 'Asụsụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro akụkọ sitere n’okike mee ihe, ma chekwaa usoro omume ndị Gris depụtara: iyipụ uwe, iti ihe, ịpụ, na ịhapụ ya n’ọnọdụ ọnwụ dị nso.'
