  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: ig
  text: Ọ sịrị ya, “Ị zara nke ọma.[a] Mee nke a, ị ga-adị ndụ.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ị zara n’ụzọ ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: Ihe gbara okwu a gburugburu bụ gbasara ndụ ebighị ebi (lee Luk 10:25), ma Grik n’ebe a kwuru naanị, “ị ga-adị ndụ.”
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: Ọ sịrị ya
  rationale: Nke a na-enye okwu a n’ụzọ Igbo dị mfe ma bụrụkwa nke nkịtị. δέ bụ njikọ dị nro, ya mere ọ dịghị mkpa itinye okwu ga-egosi nnukwu mgbanwe ma ọ bụ mmegide.
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: Ị zara nke ọma
  rationale: Ὀρθῶς pụtara ‘n’ụzọ ziri ezi’ ma ọ bụ ‘nke ọma.’ ‘Ị zara nke ọma’ bụ Igbo eke nke na-egosi na azịza ahụ ziri ezi.
- source_word: τοῦτο ποίει
  choice: Na-eme nke a
  rationale: τοῦτο na-arụtụ aka n’iwu ahụ e kwughachara n’amaokwu bu ụzọ. Ụdị iwu nke ποίει nwere ike igosi omume a na-aga n’ihu; ‘Na-eme nke a’ na-echekwa echiche ahụ n’Igbo eke.
- source_word: καὶ ζήσῃ
  choice: ị ga-adịkwa ndụ
  rationale: ζήσῃ pụtara kpọmkwem ‘ị ga-adị ndụ.’ Mgbakwunye ‘-kwa’ na-egosipụta καί n’ụzọ Igbo na-aga were were, na-enweghị itinye ‘ndụ ebighị ebi’ n’ebe okwu Grik ahụ na-ekwughị ya kpọmkwem.
theological_decisions:
- issue: Ihe ‘ị ga-adị ndụ’ pụtara n’okwu gbara ya gburugburu
  choice: ị ga-adịkwa ndụ
  alternative: ị ga-eketa ndụ ebighị ebi
  rationale: Ajụjụ dị na Luk 10:25 gbasara ndụ ebighị ebi, ma n’amaokwu a Grik kwuru naanị ‘ị ga-adị ndụ.’ Nsụgharị ahụ na-echekwa okwu ahụ kpọmkwem ma hapụ ihe gbara ya gburugburu ka ọ kọwaa obosara ihe ọ pụtara.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Na-eme’ na-egosipụta omume a na-aga n’ihu nke present imperative ποίει nwere ike ibu, ebe ‘ị ga-adịkwa ndụ’ na-echekwa mkpụmkpụ na mgbagwoju ihe okwu Grik ahụ pụrụ ịpụta.
