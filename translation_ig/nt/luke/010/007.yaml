id: LUK.10.7
reference: Luke 10:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: ig
  text: Nọrọnụ n’otu ụlọ ahụ, na-eri ma na-aṅụ ihe ha na-enye unu, n’ihi na onye ọrụ kwesịrị inweta ụgwọ ọrụ ya.[a] Unu esila n’otu ụlọ na-akwaga n’ụlọ ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụgwọ ọrụ e kwesịrị ịkwụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: n’otu ụlọ ahụ
  rationale: Nke a na-ezo aka n’ụlọ ahụ nabatara ha ma na-emesi ike ka ha nọrọ n’otu ebe ahụ, kama ịgbanwe ebe obibi.
- source_word: μένετε
  choice: Nọrọnụ
  rationale: Iwu dị n’ụdị ugbu a na-egosi ka ha nọgide n’ebe ahụ; “Nọrọnụ” bụ Igbo doro anya ma kwekọọ n’ọnụọgụ ọtụtụ.
- source_word: ἐσθίοντες καὶ πίνοντες
  choice: na-eri ma na-aṅụ
  rationale: Ọ na-egosi omume ndị na-aga n’ihu n’otu oge ahụ ha na-anọ n’ụlọ ahụ.
- source_word: τὰ παρ’ αὐτῶν
  choice: ihe ha na-enye unu
  rationale: Akpaokwu Grik ahụ pụtara ihe ndị nwe ụlọ na-enye ndị ọbịa; ntụgharị a doro anya n’Igbo ma ọ naghị etinye nkọwa na-adịghị na isi mmalite.
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: n’ihi na onye ọrụ kwesịrị inweta ụgwọ ọrụ ya
  rationale: “Onye ọrụ” dabara na ἐργάτης, “ụgwọ ọrụ” na-egosipụta ụgwọ a na-akwụ maka ọrụ, ebe “kwesịrị inweta” na-ebupụta echiche ἄξιος n’Igbo nkịtị.
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: Unu esila n’otu ụlọ na-akwaga n’ụlọ ọzọ
  rationale: Nke a na-egbochi ịgbanwe ebe obibi site n’otu ezinụlọ gaa n’ọzọ; “na-akwaga” na-egosi mgbanwe ebe obibi karịa nanị ịga leta.
theological_decisions:
- issue: Nnọchiaha nwoke n’okwu τοῦ μισθοῦ αὐτοῦ
  choice: ụgwọ ọrụ ya
  alternative: ụgwọ ọrụ e kwesịrị ịkwụ ya
  rationale: Grik ji nnọchiaha otu onye nwoke kwekọrọ na ὁ ἐργάτης. “Ya” na-echekwa otu onye ahụ n’Igbo, ọ bụ ezie na okwu ahụ na-ekwu maka onye ọrụ n’ozuzu ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “unu” mee ka o doo anya na iwu ndị a bụ maka ọtụtụ ndị. E tinyere akara [a] ozugbo n’akụkụ okwu ọ na-akọwa.
