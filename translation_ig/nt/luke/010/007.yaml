review_pass:
  verdict: approve
  source_fidelity: The translation accurately conveys the commands to remain in the receiving house, eat and drink what the hosts supply, the rationale that a worker deserves his wages, and the prohibition against changing lodging from house to house. “Nọrọnụ n’otu ụlọ ahụ” appropriately carries the anaphoric/emphatic force of ἐν αὐτῇ τῇ οἰκίᾳ in natural context.
  naturalness: The wording is clear, idiomatic Standard Igbo, and maintains an appropriately direct but dignified imperative register. The plural commands and the progressive participial sense in “na-eri ma na-aṅụ” are natural.
  terminology: “Onye ọrụ” and “ụgwọ ọrụ” faithfully render ἐργάτης and μισθός in their ordinary economic sense. “Ya” suitably retains the singular referential force without unnecessarily imposing a gendered form not grammatically required by Igbo.
