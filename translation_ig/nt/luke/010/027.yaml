id: LUK.10.27
reference: Luke 10:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: ig
  text: Ọ zara sị, “Ị ga-eji obi gị niile[a], na mkpụrụ obi gị niile, na ike gị niile, na uche gị niile hụ Onyenwe anyị Chineke gị n’anya; hụkwa onye agbata obi gị n’anya dịka onwe gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, nkebi mbụ kwuru n’ụzọ nkịtị, “site n’obi gị niile” (ἐξ ὅλης τῆς καρδίας), ebe nkebi atọ na-esochi ji okwu pụtara “na/jiri” (ἐν). N’Igbo, “jiri obi gị niile” na-ekwupụta echiche ahụ n’ụzọ eke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Ọ zara sị
  rationale: Nke a bụ ụzọ Igbo dị mma ma bụrụkwa nke a na-ejikarị akọwa participle na finite verb ndị a n’akụkọ, n’enweghị ihe furu efu.
- source_word: Ἀγαπήσεις
  choice: Ị ga-... hụ ... n’anya
  rationale: Future indicative a na-arụ ọrụ dịka iwu e hotara n’Akwụkwọ Nsọ; ‘Ị ga-’ na-edobe ọdịdị iwu ahụ ma na-ada nke ọma n’Igbo.
- source_word: κύριον τὸν θεόν σου
  choice: Onyenwe anyị Chineke gị
  rationale: ‘Onyenwe anyị’ bụ aha nsọpụrụ Chineke a na-aghọta nke ọma n’Igbo, ebe ‘Chineke gị’ na-edobe njikọ onye ahụ na Chineke dịka Grik si kwuo.
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: jiri obi gị niile
  rationale: Ọ bụ ezie na ἐξ pụtara ‘site na/n’ime,’ n’okwu iwu a ọ na-egosi isi iyi na izu oke nke ịhụnanya. ‘Jiri obi gị niile’ bụ Igbo eke ma na-edobe echiche nke obi dum; ihe dị iche n’etiti preposition a na ndị na-esochi ya ka akọwara n’ala peeji.
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: na mkpụrụ obi gị niile
  rationale: ‘Mkpụrụ obi’ na-edobe okwu dị iche n’usoro akụkụ anọ ahụ, ma a naghị eji ya kpebie na amaokwu a na-akụzi nkewa siri ike nke mmadụ.
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: na ike gị niile
  rationale: ‘Ike’ bụ ntụgharị Igbo doro anya ma bụrụ nke eke maka ἰσχύς, ya bụ ume ma ọ bụ ike mmadụ nwere.
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: na uche gị niile
  rationale: ‘Uche’ na-egosi ikike iche echiche na nghọta nke διάνοια n’Igbo dị mfe nghọta.
- source_word: τὸν πλησίον σου
  choice: onye agbata obi gị
  rationale: Nke a bụ okwu Igbo a maara nke ọma maka onye nọ mmadụ nso n’usoro mmekọrịta na omume ọma; ọ bụghị naanị onye bi n’ụlọ dị nso.
- source_word: ὡς σεαυτόν
  choice: dịka onwe gị
  rationale: Nke a na-edobe ntụnyere ὡς n’ụzọ dị nkenke ma bụrụ Igbo eke.
theological_decisions:
- issue: Aha nsọpụrụ κύριος mgbe ọ na-ezo aka n’Chineke Izrel
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: N’ebe a κύριος bụ aha nsọpụrụ Chineke n’okwu Akwụkwọ Nsọ e hotara. ‘Onyenwe anyị’ na-edobe ịdị arọ nke aha ahụ na njikọ ya na Akwụkwọ Nsọ, ebe ‘Nna ukwu’ nwere ike ịdị ka aha onye nwe mmadụ nkịtị.
- issue: 'Okwu mmadụ anọ: καρδία, ψυχή, ἰσχύς, διάνοια'
  choice: obi, mkpụrụ obi, ike, na uche
  alternative: iji okwu mkpokọta dịka ‘ihe niile ị bụ’ dochie ha
  rationale: Idebe okwu anọ ahụ na-echekwa ụda nkwughachi na ịdị ukwuu nke nraranye zuru oke, ma ọ naghị amanye nkọwa na mmadụ bụ akụkụ anọ kewapụrụ iche.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. E debere usoro ihe anọ ahụ na nkwughachi ‘gị niile,’ ma hazie ngwaa ‘hụ ... n’anya’ ka ahịrịokwu ahụ daa nke ọma n’Igbo.
