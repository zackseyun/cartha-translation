  source_fidelity: The rendering preserves the narrative response and the quoted command’s future/imperatival force. It retains all four coordinated expressions—heart, soul, strength, and mind—and accurately renders the comparative command concerning one’s neighbor. Igbo does not mark the responder’s gender here, which is a normal and non-lossy consequence of the target language.
  naturalness: “Ọ zara sị” and the construction “Ị ga-eji ... hụ ... n’anya” are natural Standard Igbo. The repeated coordinated phrases flow clearly, and “onye agbata obi gị” is an established, intelligible equivalent in this ethical context.
  terminology: “Onyenwe anyị Chineke gị” appropriately conveys the divine title and possessive construction in established biblical Igbo register. “obi,” “mkpụrụ obi,” “ike,” and “uche” preserve the source’s rhetorical fourfold formulation without imposing a technical anthropology. The footnote responsibly notes the Greek prepositional distinction while explaining the idiomatic Igbo expression.
