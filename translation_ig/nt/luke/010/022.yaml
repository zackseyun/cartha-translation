revisions:
- from: E nyefewo m ihe niile n’aka Nna m,[a] ọ dịghịkwa onye maara onye Ọkpara ahụ bụ ma e wezụga Nna ahụ; ọ dịghịkwa onye maara onye Nna ahụ bụ ma e wezụga Ọkpara ahụ na onye ọ bụla Ọkpara ahụ họọrọ ikpughere ya.[b]
  to: Nna m enyefela m ihe niile,[a] ọ dịghịkwa onye maara onye Ọkpara ahụ bụ ma e wezụga Nna ahụ; ọ dịghịkwa onye maara onye Nna ahụ bụ ma e wezụga Ọkpara ahụ na onye ọ bụla Ọkpara ahụ chọrọ ikpughere Nna ahụ.[b]
  rationale: The revision makes the giver and recipient in the first clause explicit, represents βούληται with a non-past volitional expression, and clarifies that the Son reveals the Father. It otherwise retains the draft's source-faithful mutual-knowledge structure, title terminology, and restrained theological register.
