id: LUK.10.22
reference: Luke 10:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ig
  text: Nna m enyefela m ihe niile,[a] ọ dịghịkwa onye maara onye Ọkpara ahụ bụ ma e wezụga Nna ahụ; ọ dịghịkwa onye maara onye Nna ahụ bụ ma e wezụga Ọkpara ahụ na onye ọ bụla Ọkpara ahụ chọrọ ikpughere Nna ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “E nyefewo m ihe niile site n’aka Nna m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye ọ bụla Ọkpara ahụ kpebiri ikpughere Nna ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: ihe niile
  rationale: Ọ bụ neuter plural nke nwere nghọta sara mbara; “ihe niile” bụ ụzọ Igbo nkịtị na nke doro anya isi chekwaa oke okwu ahụ.
- source_word: παρεδόθη
  choice: e nyefewo m ... n’aka
  rationale: Aorist passive a na-egosi na e nyefere ihe ndị ahụ n’aka Ọkpara. Perfect Igbo “e nyefewo” na-egosi omume e mezuru nke nsonaazụ ya ka dị, na-enweghị itinye echiche stewardship nke na-anọghị kpọmkwem n’okwu Grik.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: Nna m
  rationale: ὑπό na genitive na-egosi onye mere omume ahụ. N’usoro Igbo “E nyefewo m ... n’aka Nna m,” Nna bụ onye nyefere ihe ahụ, ọ bụghị onye natara ya.
- source_word: γινώσκει
  choice: maara
  rationale: “Maara” na-enye isi nghọta nke γινώσκω n’etinyeghị “maara nke ọma/zuo oke,” nke ga-abụ nkọwa agbakwunyere.
- source_word: τίς ἐστιν ὁ υἱὸς
  choice: onye Ọkpara ahụ bụ
  rationale: Usoro a bụ Igbo dị ndụ nke na-echekwa ajụjụ banyere onye Ọkpara bụ, na-enweghị ịkọwapụta karịa ihe odide ahụ.
- source_word: ὁ υἱός
  choice: Ọkpara ahụ
  rationale: “Ọkpara” bụ aha mmekọrịta na aha nsọpụrụ a na-aghọta n’Igbo maka Ọkpara ahụ pụrụ iche; “ahụ” na-egosipụta article Grik n’ụzọ eke.
- source_word: ὁ πατήρ
  choice: Nna ahụ
  rationale: Ọ na-echekwa aha mmekọrịta pụrụ iche na article Grik, ma na-anọgide n’asụsụ Igbo dị ùgwù ma doo anya.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: onye ọ bụla Ọkpara ahụ họọrọ ikpughere ya
  rationale: Nke a na-echekwa onye nnata a na-akọwaghị kpọmkwem, mkpebi Ọkpara, na Nna dị ka object a na-aghọta site n’ahịrịokwu gara aga.
- source_word: βούληται
  choice: họọrọ
  rationale: “Họọrọ” na-egosipụta ọchịchọ nke na-eduga ná mkpebi n’Igbo nke oge a; ọ naghị eme ka okwu ahụ dị nro ma ọ bụ tinye usoro ozizi ọzọ.
- source_word: ἀποκαλύψαι
  choice: ikpughere
  rationale: “Ikpughere” na-echekwa echiche nke ime ka ihe zoro ezo pụta ìhè, tinyere ụda theological nke mkpughe.
theological_decisions:
- issue: Ọmụma pụrụ iche nke dị n’etiti Nna na Ọkpara
  choice: 'E chekwara okwu dị mfe na nke kwụ ọtọ: naanị Nna maara onye Ọkpara bụ, naanị Ọkpara makwaara onye Nna bụ.'
  alternative: Ịgbakwunye okwu dịka “maara nke ọma” ma ọ bụ “maara n’ụzọ zuru oke.”
  rationale: γινώσκει pụtara “maara.” Syntax ahụ n’onwe ya na-egosi ọmụma pụrụ iche na nke ibe ha; ntụgharị ekwesịghị ime ka okwu ahụ sie ike karịa Grik.
- issue: Ọchịchọ na ikike Ọkpara n’ikpughe Nna
  choice: A sụgharịrị βούληται dịka “họọrọ,” na-echekwa Ọkpara dị ka onye na-ekpebi onye ọ ga-ekpughere Nna.
  alternative: “chọrọ,” “kpebiri,” ma ọ bụ paraphrase nke ga-eme ka agency Ọkpara belata.
  rationale: Grik na-egosi volition Ọkpara n'ụzọ doro anya. “Họọrọ” na-echekwa nke ahụ na-enweghị idozi ajụjụ theological ndị ọzọ ederede ahụ ekwughị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “Ọkpara ahụ” na “Nna ahụ” chekwaa aha mmekọrịta na ịdị pụrụ iche ha n’amaokwu a. E tinyere akara ndetu ụkwụ [a] na [b] n’ebe okwu ndị ọzọ ha na-akọwa dị.
