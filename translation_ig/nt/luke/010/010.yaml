  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: ig
  text: Ma n’obodo ọ bụla unu banyere ma ha anabataghị unu, pụọnụ gaa n’okporo ámá ya[a] kwuo,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ama ọha ya,” ma ọ bụ “n’okporo ámá ya ndị sara mbara.” Okwu Grik a na-ekwu banyere okporo ụzọ sara mbara ma ọ bụ ebe ghe oghe ndị ọha na eze na-agafe ma na-ezukọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: Ma obodo ọ bụla
  rationale: Ngwakọta nnọchiaha njikọ na ἄν na-egosi obodo ọ bụla ọnọdụ a nwere ike ime na ya; ‘obodo ọ bụla’ na-enye echiche ahụ n’Igbo nkịtị.
- source_word: εἰσέλθητε
  choice: unu banyere
  rationale: Okwu a na-egosi ịbanye n’obodo; ụdị a dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: μὴ δέχωνται ὑμᾶς
  choice: ha anabataghị unu
  rationale: ‘Ịnabata’ na-edobe ma echiche ịnabata ndị ozi ma nke ile ha ọbịa, n’ejighị okwu ga-akọwa ya karịa ihe Grik kwuru.
- source_word: ἐξελθόντες
  choice: pụọnụ gaa
  rationale: 'Participle a na-ebute iwu εἴπατε ma na-egosi usoro omume: ha ga-apụ, gaa ebe ọha na eze nọ, kwuo. Iji iwu jikọrọ ọnụ bụ Igbo sitere n’ọnụ.'
- source_word: τὰς πλατείας αὐτῆς
  choice: n’okporo ámá ya[a]
  rationale: πλατεῖαι bụ okporo ámá ndị sara mbara ma ọ bụ ebe ọha na eze na-agafe ma na-ezukọ. ‘Okporo ámá’ bụ okwu Igbo kacha doo anya n’ahịrịokwu, ebe nkọwa ala na-echekwa obosara ihe okwu Grik nwere ike ịpụta.
- source_word: εἴπατε
  choice: kwuo
  rationale: Nke a bụ iwu sitere na λέγω; ‘kwuo’ na-ebute okwu a ga-ehota n’amaokwu na-esote n’ụzọ doro anya.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E tinyere akara nkọwa ala [a] n’akụkụ ‘okporo ámá ya,’ ebe ọ bụ okwu πλατείας ka nkọwa ahụ gbasara; nke a na-agbazi ọnọdụ akara ahụ n’English POB.
