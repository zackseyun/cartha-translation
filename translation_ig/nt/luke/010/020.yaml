id: LUK.10.20
reference: Luke 10:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: ig
  text: Otú ọ dị, unu aṅụrịla ọṅụ n’ihe a, na mmụọ ndị ahụ[a] na-edo onwe ha n’okpuru unu[b]; kama, ṅụrịanụ ọṅụ n’ihi na e deela aha unu n’eluigwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gburugburu okwu ahụ na-egosi na ndị a bụ mmụọ na-emegide Chineke; a pụkwara ịsụgharị ya ‘ndị mmụọ ọjọọ,’ ma okwu Grik ebe a bụ naanị ‘mmụọ.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘nọ n’okpuru ikike unu.’
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ nkịtị, okwu Grik ahụ dị n’ụdị ọtụtụ: ‘n’eluigwe.’ ‘N’eluigwe’ bụ ụzọ Igbo a na-asụkarị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Otú ọ dị
  rationale: Nke a na-egosi ntụgharị okwu siri ike nke na-agbazi ihe ndị na-eso ụzọ ji aṅụrị, ma ọ bụkwa okwu Igbo dị ugwu ma doo anya.
- source_word: ἐν τούτῳ
  choice: n’ihi nke a
  rationale: N’Igbo, nke a na-egosi nke ọma ihe ha ji aṅụrị, ma na-edobe ntụaka doro anya nke okwu Grik.
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: aṅụrịla unu ... Kama, ṅụrịanụ
  rationale: E ji otu mgbọrọgwụ okwu ahụ mee iwu mgbochi na iwu nkwado, ka mmegide na nkwugharị dị n’akwụkwọ mbụ wee pụta ìhè.
- source_word: τὰ πνεύματα
  choice: mmụọ ndị ahụ
  rationale: Nke a na-edobe okwu sara mbara bụ ‘mmụọ’ n’enweghị ịkọwa ha kpọmkwem dị ka ndị mmụọ ọjọọ, ọ bụ ezie na gburugburu okwu ahụ na-egosi na ha bụ ndị iro.
- source_word: ὑμῖν ὑποτάσσεται
  choice: na-edo onwe ha n’okpuru unu
  rationale: Ọ bụ ụzọ Igbo doro anya isi kwuo na ha nọ n’okpuru ikike ndị na-eso ụzọ, ma ghara ime ka okwu ahụ bụrụ naanị nrubeisi nke afọ ofufo.
- source_word: τὰ ὀνόματα ὑμῶν
  choice: aha unu
  rationale: Nke a bụ usoro nkịtị na nke ziri ezi n’Igbo maka njikọ aha na nnọchiaha nwe.
- source_word: ἐγγέγραπται
  choice: e deela
  rationale: Ụdị a na-egosi na e mechaala ide aha ndị ahụ nakwa na nsonaazụ ya ka dị ugbu a, dịka perfect passive nke Grik si dị.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: n’eluigwe
  rationale: ‘N’eluigwe’ bụ okwu Igbo nkịtị ma doo anya maka ebe Chineke; nkọwa ala peeji na-eme ka a mara na okwu Grik dị n'ụdị ọtụtụ.
theological_decisions:
- issue: Ụdị ndị mmụọ ahụ
  choice: mmụọ ndị ahụ
  alternative: ndị mmụọ ọjọọ; ndị mmụọ ọjọọ a na-akpọ ndị mmụọ ọjọọ
  rationale: Gburugburụ okwu ahụ na-egosi ndị mmụọ na-emegide Chineke, ma amaokwu a n’onwe ya kwuru naanị πνεύματα. Ya mere, a hapụrụ obosara okwu mbụ ahụ n’isi ederede.
- issue: Ebe e dere aha ndị ahụ
  choice: n’eluigwe
  alternative: n’eluigwe dị iche iche; n’eluigwe niile
  rationale: Okwu Grik bụ ọtụtụ, ma ịmanye ọtụtụ n’isi ederede Igbo ga-ada ka nkọwa gbasara ọtụtụ eluigwe. E ji okwu Igbo a na-asụkarị mee isi ederede, ma debe ọdịdị ọtụtụ nke Grik na nkọwa ala peeji.
- issue: Ọnọdụ aha ndị ahụ e dere
  choice: e deela aha unu
  alternative: aha unu dị n’akwụkwọ
  rationale: ‘E deela’ na-edobe omume e mere n’oge gara aga na nsonaazụ ya na-adịgide, n’enweghị ịgbakwunye ‘akwụkwọ,’ nke na-adịghị n’amaokwu Grik a.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘Otú ọ dị’ gosipụta mgbazi siri ike, e jikwa ntụpọ abụọ mee ka ihe ‘nke a’ na-atụ aka na ya doo anya. A zere okwu ụka pụrụ iche na nkọwa ozizi agbakwunyere.
