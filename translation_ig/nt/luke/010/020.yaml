review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the adversative correction, the unspecified ‘spirits,’ their subjection to the disciples, and the perfect passive sense of ἐγγέγραπται (‘e deela’). The singular idiomatic Igbo n’eluigwe is acceptable in the text, provided the Greek plural is described accurately in the note.
  naturalness: The placement in ‘aṅụrịla unu’ is less natural for a plural imperative in Standard Igbo. ‘Unu aṅụrịla ọṅụ’ is clearer and idiomatic. The repeated expression ‘aṅụrịla ọṅụ … ṅụrịanụ ọṅụ’ also preserves the rhetorical repetition of χαίρετε.
  terminology: ‘Mmụọ ndị ahụ’ appropriately retains πνεύματα without narrowing it to demons. ‘E deela aha unu’ naturally represents the completed action with continuing result. The current note c wrongly glosses the Greek plural as ‘different heavens’ or ‘all heavens’; neither is entailed by the plural.
  issues:
  - severity: medium
    issue: Footnote c over-interprets the plural οὐρανοῖς.
    rationale: The Greek plural means ‘in the heavens’; it does not itself mean ‘in different heavens’ or ‘in all heavens.’ The note should state the formal plural without supplying those interpretations.
  - severity: low
    issue: The word order ‘aṅụrịla unu’ is awkward for the plural negative imperative.
    rationale: Putting the subject pronoun first—‘Unu aṅụrịla ọṅụ’—is more natural Standard Igbo and makes the plural addressee explicit.
  - severity: low
    issue: Footnote a begins with an apparent malformed phrase, ‘Gburugburụ okwu ahụ.’
    rationale: ‘Gburugburu okwu ahụ’ is the natural wording for ‘the context.’
  revised_text: Otú ọ dị, unu aṅụrịla ọṅụ n’ihe a, na mmụọ ndị ahụ[a] na-edo onwe ha n’okpuru unu[b]; kama, ṅụrịanụ ọṅụ n’ihi na e deela aha unu n’eluigwe[c].
