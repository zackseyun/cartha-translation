- from: 'Otú ọ dị, aṅụrịla unu n’ihi nke a: na mmụọ ndị ahụ[a] na-edo onwe ha n’okpuru unu[b]. Kama, ṅụrịanụ n’ihi na e deela aha unu n’eluigwe[c].'
  to: Otú ọ dị, unu aṅụrịla ọṅụ n’ihe a, na mmụọ ndị ahụ[a] na-edo onwe ha n’okpuru unu[b]; kama, ṅụrịanụ ọṅụ n’ihi na e deela aha unu n’eluigwe[c].
  rationale: The revision improves the plural imperative’s Standard Igbo word order and corrects the explanatory footnote on the Greek plural. It retains the draft’s source-faithful terminology, its non-sectarian treatment of the spirits, and the perfect-result nuance in ‘e deela.’
