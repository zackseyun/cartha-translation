  text: εἶπεν δὲ αὐτοῖς· Ἐθεώρουν τὸν Σατανᾶν ὡς ἀστραπὴν ἐκ τοῦ οὐρανοῦ πεσόντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: ig
  text: O wee sị ha[a], “Anọ m na-ele Setan ka ọ na-esi n’eluigwe ada dị ka àmụ̀mà.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ahụrụ m Setan ka ọ si n’eluigwe daa dị ka àmụ̀mà.” Ngwaa Grik ahụ dị n’ụdị imperfect; a pụrụ ịtụgharị ya n’ụzọ dị mfe dịka “Ahụrụ m,” ma “Anọ m na-ele” na-echekwa nke ọma echiche nke omume na-aga n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: O wee sị
  rationale: Oge gara aga dị mfe na-akọ ihe mere n’usoro akụkọ; ‘wee’ na-eme ka njikọ akụkọ ahụ bụrụ nke Igbo nkịtị.
- source_word: δὲ
  choice: wee
  rationale: δέ bụ njikọ dị nro; ‘wee’ na-ejikọta okwu a na ihe bu ya ụzọ n’enweghị ịkọwa mmekọrịta ahụ karịa ihe Grik kwuru.
- source_word: αὐτοῖς
  choice: ha
  rationale: Nnọchiaha dativ ọtụtụ na-arụ ọrụ dị ka onye a gwara okwu; ‘sị ha’ bụ usoro Igbo ebumpụta ụwa.
- source_word: Ἐθεώρουν
  choice: Anọ m na-ele
  rationale: Imperfect nke θεωρέω na-egosi omume a na-ahụ ka ọ na-aga n’ihu; ‘Anọ m na-ele’ na-echekwa akụkụ a karịa ‘Ahụrụ m.’
- source_word: τὸν Σατανᾶν
  choice: Setan
  rationale: A na-eji Σατανᾶς ebe a dị ka aha/utu aha nke onye; ‘Setan’ bụ nsụgharị mkpụrụokwu a maara nke ọma n’Igbo.
- source_word: ὡς ἀστραπὴν
  choice: dị ka àmụ̀mà
  rationale: ὡς na-ewebata ntụnyere; nkebiokwu a na-echekwa ihe atụ ahụ n’Igbo doro anya.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: si n’eluigwe
  rationale: οὐρανός nwere ike ịbụ mbara igwe ma ọ bụ eluigwe; n’okwu a gbasara Setan, ‘eluigwe’ na-echekwa nghọta okpukpe na mbara ụwa nke okwu ahụ.
- source_word: πεσόντα
  choice: ka ọ na-ada
  rationale: Participle aorist ahụ na-akọ ihe Setan na-eme dịka ihe a na-ele; ‘ka ọ na-ada’ bụ Igbo ebumpụta ụwa nke na-ejikọta nke ọma na ngwaa ịhụ/ile ma ghara ịmanye nkọwa oge pụrụ iche.
theological_decisions:
- issue: Oge na ọdịdị omume dị n’okwu Jizọs banyere ọdịda Setan
  choice: ‘Anọ m na-ele Setan ka ọ na-ada’ na-echekwa echiche nke ihe a na-ele ka ọ na-eme.
  alternative: ‘Ahụrụ m Setan ka ọ na-ada.’
  rationale: Grik anaghị ekpebi ma nke a bụ ọdịda mbụ Setan, ihe metụtara ozi ndị na-eso ụzọ n’oge ahụ, ma ọ bụ ọhụụ amụma banyere mmeri ga-abịa. Nsụgharị ahụ na-ahapụ esemokwu nkọwa a ka ọ dị.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. E ji ‘Anọ m na-ele’ chekwaa imperfective aspect, ebe usoro ‘ka ọ na-ada’ na-eme ka ahịrịokwu ahụ bụrụ nke Igbo ebumpụta ụwa. Akara ụda dị na ‘àmụ̀mà’ na-enyere ọgụgụ aka.
