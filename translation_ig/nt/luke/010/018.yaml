revisions:
- from: O wee sị ha[a], “Anọ m na-ele Setan ka ọ na-ada dị ka àmụ̀mà si n’eluigwe.”
  to: O wee sị ha[a], “Anọ m na-ele Setan ka ọ na-esi n’eluigwe ada dị ka àmụ̀mà.”
  rationale: The revision places “si n’eluigwe” directly within the clause describing Satan’s descent, matching the Greek construction and avoiding a misleading attachment to “àmúmà.” It preserves the imperfective force of Ἐθεώρουν without deciding the debated temporal or theological reference of the vision.
  reviewer_model: gpt-5.6-terra
