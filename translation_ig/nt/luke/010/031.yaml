source:
  edition: SBLGNT
  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: ig
  text: Site n’ndabara, otu onye nchụàjà nọ na-agbada n’ụzọ ahụ; mgbe ọ hụrụ ya, ọ gafere n’akụkụ nke ọzọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ gafere ya”; ma ngwaa Greek ahụ na-egosi na ọ gafere n’akụkụ nke ọzọ, nke na-egosi na o kpachaara anya zere ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: O wee daba na
  rationale: Akpaokwu a na-egosi na ihe mere n’ụzọ ndabara. “O wee daba na” bụ Igbo nkịtị nke na-egosi ndabara ahụ n’etinyeghị echiche siri ike banyere ma ihe ọ bụla ọ̀ bụ ihe chi ma ọ bụ ihe mere n’onwe ya.
- source_word: δὲ
  choice: wee
  rationale: δὲ bụ njikọ dị nro na-akwalite akụkọ n’ihu; “wee” na-arụ ọrụ a nke ọma n’Igbo n’enweghị itinye mmegide na-adịghị na Greek.
- source_word: ἱερεύς τις
  choice: otu onye nchụàjà
  rationale: “Otu onye” na-echekwa ịdị onye ahụ kpọmkwem ma a na-akpọghị aha ya, ebe “onye nchụàjà” bụ okwu Igbo a na-aghọta nke ọma maka ἱερεύς.
- source_word: κατέβαινεν
  choice: nọ na-agbada
  rationale: Ụdị imperfect Greek na-egosi omume na-aga n’ihu n’oge akụkọ ahụ; “nọ na-agbada” na-echekwa akụkụ a.
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: n’ụzọ ahụ
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma dịkwa eke isi kwuo na ọ na-aga n’okporo ụzọ ahụ.
- source_word: ἰδὼν αὐτὸν
  choice: mgbe ọ hụrụ ya
  rationale: Aorist participle a na-egosi oge omume nke sochiri ịhụ nwoke ahụ; “mgbe ọ hụrụ ya” doro anya ma bụrụkwa Igbo eke.
- source_word: ἀντιπαρῆλθεν
  choice: ọ gafere n’akụkụ nke ọzọ
  rationale: Ngwaa ahụ pụtara ihe karịrị nanị ịgafe; ọ na-egosi ịgafe n’akụkụ chere ihu ma ọ bụ n’akụkụ nke ọzọ, ya mere nsụgharị a na-echekwa echiche izere onye ahụ.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ echiche ndabara dị na κατὰ συγκυρίαν ka ọ ghara ikpebi ajụjụ nkà mmụta okpukpe banyere ihe kpatara ihe ahụ ji mee.
