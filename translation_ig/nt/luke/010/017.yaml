id: LUK.10.17
reference: Luke 10:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: ig
  text: Mgbe ahụ, mmadụ iri asaa na abụọ ahụ[a] ji ọṅụ lọta, na-ekwu, “Onyenwe anyị, ọbụna ndị mmụọ ọjọọ na-edo onwe ha n’okpuru anyị n’aha gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie gụrụ “iri asaa” kama “iri asaa na abụọ.”
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: lọta
  rationale: Ngwaa a na-egosi na ha si n’ozi ahụ laghachi; “lọta” bụ okwu Igbo dị mfe ma kwekọọ n’omume gara aga.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a δέ na-akwalite akụkọ gaa n’ihe mere ọzọ; “Mgbe ahụ” na-egosi njikọ akụkọ ahụ n’ụzọ ebumpụta ụwa.
- source_word: οἱ ἑβδομήκοντα δύο
  choice: mmadụ iri asaa na abụọ ahụ
  rationale: Nke a na-agbaso ọgụgụ SBLGNT, “iri asaa na abụọ,” ma na-eji “mmadụ” mee ka ọnụ ọgụgụ ahụ doo anya n’Igbo.
- source_word: μετὰ χαρᾶς
  choice: ji ọṅụ
  rationale: Ọ na-echekwa aha ahụ bụ “ọṅụ” ma na-ekwupụta ọnọdụ obi ha mgbe ha lọtara n’Igbo dị mma.
- source_word: λέγοντες
  choice: na-ekwu
  rationale: Ọ na-echekwa njikọ participle ahụ na omume ịlọta ma na-eduba okwu ha kwuru ozugbo.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu ịkpọ κύριος nke a gwara Jizọs; “Onyenwe anyị” bụ nsụgharị Igbo a na-aghọta nke ọma ma dị ùgwù.
- source_word: καὶ
  choice: ọbụna
  rationale: 'N’okwu ịtụnanya a, καί na-emesi ihe na-atụghị anya ya ike: ọbụna ndị mmụọ ọjọọ rubere ha isi.'
- source_word: τὰ δαιμόνια
  choice: ndị mmụọ ọjọọ
  rationale: Nke a bụ okwu Igbo doro anya maka ndị mmụọ iro a na-ekwu maka ha, na-enweghị itinye nkọwa okpukpe ọzọ.
- source_word: ὑποτάσσεται
  choice: na-edo onwe ha n’okpuru
  rationale: Nkebiokwu a na-egosipụta ido onwe n’okpuru ikike ma na-echekwa nghọta middle/passive nke ụdị Grik ahụ n’enweghị mkpebi siri ike banyere nke ọ bụ.
- source_word: ἡμῖν
  choice: anyị
  rationale: E tinyere ya na “n’okpuru anyị,” nke na-egosipụta dative nke onye a na-edo onwe n’okpuru ya n’Igbo dị mma.
- source_word: ἐν τῷ ὀνόματί σου
  choice: n’aha gị
  rationale: Nke a na-echekwa akpaalaokwu nke isi mmalite, nke na-ezo aka n’ike ma ọ bụ ikike e ji aha Jizọs mee ihe, n’ebughị ụzọ kọwaa ya karịa ihe ederede kwuru.
theological_decisions:
- issue: Ọdịiche dị n’akwụkwọ aka ochie banyere ọnụ ọgụgụ ndị e zigara
  choice: iri asaa na abụọ
  alternative: iri asaa
  rationale: Isi mmalite SBLGNT e nyere gụrụ “iri asaa na abụọ.” E debere ọgụgụ dị mkpa nke ọzọ, “iri asaa,” n’okpuru peeji kama izochi ọdịiche ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere akara nkọwa [a] ozugbo n’akụkụ ọnụ ọgụgụ ọ na-akọwa, kama itinye ya n’akụkụ “ọṅụ.”
