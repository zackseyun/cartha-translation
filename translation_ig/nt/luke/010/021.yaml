id: LUK.10.21
reference: Luke 10:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: ig
  text: N’otu oge ahụ, ọ ṅụrịrị ọṅụ n’ime Mmụọ Nsọ, sị, “Ana m eto gị[a], Nna, Onyenwe eluigwe na ụwa, n’ihi na i zonahụrụ ndị maara ihe na ndị nwere nghọta ihe ndị a, ma kpugheere ụmụntakịrị[b] ihe ndị a. Ee, Nna, n’ihi na ọ bụ otú a ka ọ masịrị gị[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ana m ekele gị.” Ngwaa Grik a nwere ike igosi ekele nakwa otuto n’ekpere.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụmụ ọhụrụ.” O yikarịrị ka e ji okwu a mee ihe atụ maka ndị dị umeala n’obi ma ọ bụ ndị mmadụ na-elelị, ọ bụghị naanị ụmụaka n’ezie.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ihi na otú a bụ uche amara gị,” ma ọ bụ, “n’ihi na nke a bụ ezi mmasị gị.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: N’otu oge ahụ
  rationale: Nke a na-egosipụta kpọmkwem na ihe ahụ mere n’oge ahụ kpọmkwem, ma bụrụkwa okwu Igbo dị mfe ma kwekọọ n’ụdị oge Grik.
- source_word: ἠγαλλιάσατο
  choice: ọ ṅụrịrị ọṅụ
  rationale: Ngwaa a na-egosi ọṅụ dị ukwuu. Okwu Igbo a bụ nke mmadụ nkịtị na-aghọta ma na-edobe ike nke okwu Grik.
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: n’ime Mmụọ Nsọ
  rationale: Mkpụrụokwu nwere isiokwu ahụ ugboro abụọ na-egosi Mmụọ Nsọ. ‘N’ime’ na-edobe nghọta nke ọnọdụ ma ọ bụ ụzọ ọrụ nke dative n’enweghị ịkọwa ya gabiga ihe ederede kwuru.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Ana m eto gị
  rationale: N’ekpere a, ngwaa ahụ nwere ike ịpụta ito ma ọ bụ ikele. ‘Ana m eto gị’ dabara n’okwu nsọpụrụ na-esochi, ebe e debere ‘Ana m ekele gị’ n’ala peeji.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Nna, Onyenwe eluigwe na ụwa
  rationale: Nke a na-edobe okwu ịkpọku abụọ ahụ na ọchịchị Chineke n’asụsụ Igbo dị ugwu ma bụrụ nke a na-aghọta nke ọma.
- source_word: ἀπέκρυψας … ἀπεκάλυψας
  choice: i zonahụrụ … ma kpugheere
  rationale: Ngwaa abụọ a na-edobe ntụnyere dị n’etiti izochi na ikpughe, Chineke ka bụkwa onye mere ha abụọ dịka Grik si kwuo.
- source_word: σοφῶν καὶ συνετῶν
  choice: ndị maara ihe na ndị nwere nghọta
  rationale: Nke a na-egosipụta amamihe na nghọta n’enweghị ime ka okwu ahụ bụrụ naanị banyere agụmakwụkwọ.
- source_word: νηπίοις
  choice: ụmụntakịrị
  rationale: Okwu ahụ nwere ike ịpụta ụmụ ọhụrụ n’ụzọ nkịtị, ma n’ebe a o yiri ka ọ bụ ihe atụ maka ndị dị umeala ma ọ bụ ndị ụwa na-elelị. ‘Ụmụntakịrị’ na-edobe ihe atụ ahụ n’asụsụ dị mfe.
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: ọ bụ otú a ka o si dị gị mma
  rationale: Nke a na-edobe οὕτως (‘otú a’) na echiche nke ihe masịrị Nna, ma na-ada ka Igbo ebumpụta ụwa karịa nsụgharị okwu n’otu n’otu.
theological_decisions:
- issue: Onye τῷ πνεύματι τῷ ἁγίῳ na-ekwu maka ya
  choice: Mmụọ Nsọ
  alternative: mmụọ ya / n’ime mmụọ
  rationale: Nhazi okwu Grik, nke tinyere isiokwu n’aha na nkọwa ya, na-akwado na ọ bụ Mmụọ Nsọ ka a na-ekwu maka ya. Nsụgharị ahụ anaghị atụkwasị nkọwa ozizi ọzọ n’ihe ederede.
- issue: Ihe zoro n’okwu εὐδοκία na njedebe amaokwu ahụ
  choice: ọ bụ otú a ka o si dị gị mma
  alternative: ọ bụ uche amara gị / nke a bụ ezi mmasị gị
  rationale: Nhọrọ a na-edobe echiche nke ihe dị Nna mma na okwu ‘otú a,’ ma ọ naghị eme ka okwu ahụ bụrụ nkọwa zuru ezu banyere uche Chineke karịa ka Grik si kwuo.
- issue: Onye na-eme izochi na ikpughe
  choice: Chineke bụ onye isiokwu nke ngwaa abụọ ahụ
  alternative: ime ka ngwaa ndị ahụ bụrụ ihe mere n’onwe ya n’enweghị onye mere ya
  rationale: Ụdị active nke ἀπέκρυψας na ἀπεκάλυψας na-agwa Nna kpọmkwem dị ka onye mere omume abụọ ahụ; e debere esemokwu nkà mmụta okpukpe dị na nkwupụta ahụ kama ime ka ọ dị nro.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, mee ihe. A họọrọ ‘Onyenwe’ maka κύριος, ‘Mmụọ Nsọ’ maka πνεῦμα ἅγιον, ma zere okwu ụka pụrụ iche nke otu nzukọ. E debere usoro ekpere ahụ na ntụnyere izochi/ikpughe n’ụzọ doro anya.
