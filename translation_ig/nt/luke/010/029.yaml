  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: ig
  text: Ma, n’ịchọ igosi na ya ziri ezi, ọ sịrị Jizọs, “Ònyekwa bụ onye agbata obi m[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ònye ka a ga-agụta dị ka onye agbata obi m?”
    reason: Nhọrọ ọzọ nke na-akọwa ajụjụ ahụ; ọ na-egosi echiche “onye a na-ewere dị ka onye agbata obi” n’enweghị itinye nkọwa ahụ n’ime ederede bụ isi.
lexical_decisions:
- source_word: θέλων
  choice: ebe ọ chọrọ
  rationale: Na-egosi ebumnuche nwoke ahụ n'ụzọ dị mfe ma kwekọọ n'ụdị participle dị n'asụsụ Grik.
- source_word: δικαιῶσαι ἑαυτόν
  choice: igosi na ya bụ onye ezi omume
  rationale: N'ọnọdụ a, okwu ahụ pụtara na ọ chọrọ igosi na ihe o mere ma ọ bụ echiche ya ziri ezi; nsụgharị a na-ezere ime ka ọ bụrụ naanị okwu nkà mmụta okpukpe gbasara ịgụ mmadụ n'onye ezi omume.
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: ọ sịrị Jizọs
  rationale: Nke a bụ ụzọ Igbo dị mma ma kwụ ọtọ isi kọwaa onye a gwara okwu.
- source_word: Καὶ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” n'ajụjụ ahụ na-eburu mmetụta njikọ na ajụjụ na-esochi nke Καὶ nwere n'asụsụ Grik, n'ụzọ dabara n'okwu Igbo.
- source_word: τίς ἐστίν μου πλησίον
  choice: Ònyekwa bụ onye agbata obi m?
  rationale: “Onye agbata obi” bụ okwu a maara nke ọma maka πλησίον ma na-echekwa ụdị ajụjụ kpọmkwem dị na isi mmalite.
theological_decisions:
- issue: Ihe δικαιῶσαι ἑαυτόν pụtara
  choice: A sụgharịrị ya dị ka mbọ nwoke ahụ na-agba igosi na ya bụ onye ezi omume.
  alternative: igosi na ihe o mere ziri ezi; ịgụ onwe ya n'onye ezi omume
  rationale: Ọnọdụ okwu ahụ bụ mkparịta ụka gbasara iwu na omume. Ya mere, ọ na-egosi mbọ ịkwado onwe ya, ọ bụghị n'ụzọ doro anya ozizi pụrụ iche banyere ịgụ mmadụ n'onye ezi omume.
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, nke ugwu ya dị ma dịkwa mfe nghọta. E ji “Jizọs” na “onye agbata obi” mee ihe dịka ụdị ndị a na-ahụkarị n''Igbo. Enweghị nkọwa ala peeji n''ihi na ozi e nyere tinye akara [a] n''ebe na-ekwesịghị ekwesị: nkọwa ya metụtara ajụjụ ikpeazụ, ọ bụghị nnọchiaha “he.”'
