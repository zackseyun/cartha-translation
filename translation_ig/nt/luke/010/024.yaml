id: LUK.10.24
reference: Luke 10:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ig
  text: N’ihi na ana m agwa unu na ọtụtụ ndị amụma na ndị eze chọsiri ike[a] ịhụ ihe unu na-ahụ na ịnụ ihe unu na-anụ, ma ha ahụghị ya, ma ha anụghị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “chọrọ” ma ọ bụ “nwere ọchịchọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: N’ihi na ana m agwa unu
  rationale: “Ana m agwa unu” bụ ụzọ Igbo si ekwu λέγω ὑμῖν n'ụzọ doro anya; “N’ihi na” na-echekwa njikọ nkọwa nke γάρ na amaokwu bu ụzọ.
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: ọtụtụ ndị amụma na ndị eze
  rationale: Nke a na-asụgharị aha abụọ ahụ ozugbo ma na-edebe “ndị eze,” kama ịgbasa ya ka ọ bụrụ ndị ọchịchị niile.
- source_word: ἠθέλησαν
  choice: chọsiri ike
  rationale: θέλω n’ebe a na-egosi ọchịchọ siri ike; okwu a bụ Igbo dị ndụ ma kwanyere ụda amaokwu ahụ ùgwù, n’emeghị ka mmetụta ya gafee ihe Grik kwuru.
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: ịhụ ihe unu na-ahụ
  rationale: Ọ na-edebe nghọta nkịtị nke ịhụ na usoro ahịrịokwu Grik, tinyere nnọchiaha “unu.”
- source_word: οὐκ εἶδαν
  choice: ma ha ahụghị ya
  rationale: A na-eme ka ihe a na-ekwu maka ya pụta ìhè site na “ya,” dịka ụtọasụsụ Igbo si achọkarị, ma na-edebe eziokwu mere n’oge gara aga.
- source_word: ἀκοῦσαι ἃ ἀκούετε
  choice: ịnụ ihe unu na-anụ
  rationale: Nke a na-edebe nhazi yiri nke “ịhụ ihe unu na-ahụ” ma na-asụgharị ἀκούω dị ka ịnụ.
- source_word: οὐκ ἤκουσαν
  choice: ma ha anụghị ya
  rationale: Ọ na-edebe nhazi nha anya nke akụkụ abụọ ahụ ma na-eme ka ihe e zoro ezo dị ka ihe a nụrụ pụta n'ụzọ Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Ndị a kpọrọ “ndị amụma na ndị eze” bụ ndị ole?
  choice: E debere aha akụkọ ihe mere eme ahụ dịka “ndị amụma na ndị eze,” n’enweghị nkọwa agbakwunyere.
  alternative: “ndị amụma na ndị ọchịchị” ma ọ bụ “ndị amụma na ndị eze oge ochie”
  rationale: Grik kwuru kpọmkwem ndị amụma na ndị eze. Ịgbakwunye “oge ochie” ma ọ bụ ịgbanwe “ndị eze” ka ọ bụrụ “ndị ọchịchị” ga-akọwa ihe ederede ahụ karịa ka ọ na-ekwu.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa nsọpụrụ. E debere nhazi abụọ yiri ibe ha—ịhụ/ihe unu na-ahụ na ịnụ/ihe unu na-anụ—iji chekwaa ịdị n’otu nke amaokwu Grik.
