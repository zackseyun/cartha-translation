revisions:
- from: N’ihi na ana m agwa unu na ọtụtụ ndị amụma na ndị eze chọsiri ike ịhụ ihe unu na-ahụ, ma ha ahụghị ya; ha chọkwara ịnụ ihe unu na-anụ, ma ha anụghị ya.[a]
  to: N’ihi na ana m agwa unu na ọtụtụ ndị amụma na ndị eze chọsiri ike[a] ịhụ ihe unu na-ahụ na ịnụ ihe unu na-anụ, ma ha ahụghị ya, ma ha anụghị ya.
  rationale: The revision makes ‘chọsiri ike’ govern both ‘ịhụ’ and ‘ịnụ,’ as ἠθέλησαν governs both Greek infinitives, while retaining the sequence of the two unmet desires. The footnote is moved to its lexical referent and revised to give natural, semantically suitable Igbo alternatives.
