revisions:
- from: Ma ihe ole na ole dị mkpa—ma ọ bụ otu ihe[a]. N’ihi na Meri ahọrọla oke ọma[b], nke a na-agaghị anapụ ya.
  to: Ma ọ bụ naanị ihe ole na ole—ma ọ bụ otu ihe—ka dị mkpa[a]. N’ihi na Meri ahọrọla òkè ọma[b], nke a na-agaghị anapụ ya.
  rationale: 'The revision corrects the key lexical form to òkè and smooths the opening necessity clause. It keeps the source’s ambiguity: ‘ihe ole na ole’ and ‘otu ihe’ may concern meal preparation or a broader essential concern, and òkè may evoke both a food portion and a figurative share. No doctrinal interpretation is added.'
  reviewer_model: gpt-5.6-terra
