    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “akụkụ ọma.” “Òkè” nwere ike ikwu ma banyere òkè nri ma banyere òkè mmadụ nwere n’ihe bara uru n’ezie.
    reason: lexical_alternative
  revision_rationale: 'The revision corrects the key lexical form to òkè and smooths the opening necessity clause. It keeps the source’s ambiguity: ‘ihe ole na ole’ and ‘otu ihe’ may concern meal preparation or a broader essential concern, and òkè may evoke both a food portion and a figurative share. No doctrinal interpretation is added.'
