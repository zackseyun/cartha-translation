  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: ig
  text: Ma ọ bụ naanị ihe ole na ole—ma ọ bụ otu ihe—ka dị mkpa[a]. N’ihi na Meri ahọrọla òkè ọma[b], nke a na-agaghị anapụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “naanị otu ihe dị mkpa.” N’ihi ihe gbasara nri dị n’akụkọ a, a pụkwara ịghọta okwu Grik ahụ kpọmkwem dịka, “naanị efere ole na ole dị mkpa—ma ọ bụ naanị otu.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “akụkụ ọma.” “Òkè” nwere ike ikwu ma banyere òkè nri ma banyere òkè mmadụ nwere n’ihe bara uru n’ezie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: Ma ihe ole na ole dị mkpa—ma ọ bụ otu ihe
  rationale: 'Nkebi ahịrị a na-egosi na ihe a chọrọ adịghị ọtụtụ, ma jiri ‘ma ọ bụ otu ihe’ chekwaa mkpụmkpụ okwu Grik na nghọta abụọ o nwere: ọ pụrụ izo aka n’ihe oriri ole na ole/otu efere, ma ọ bụ n’otu ihe dị mkpa n’ezie.'
- source_word: Μαριὰμ
  choice: Meri
  rationale: Nke a bụ ụdị aha Μαριάμ a na-ejikarị eme ihe n’Igbo.
- source_word: τὴν ἀγαθὴν μερίδα
  choice: oke ọma
  rationale: ‘Oke’ na-egosi òkè mmadụ nwetara ma nwee ike ịtụkwa aka n’oke nri; ya mere, ọ na-echekwa nghọta abụọ nke μερίδα. ‘Ọma’ sụgharịrị ἀγαθή n’enweghị itinye echiche ntụnyere nke ‘ka mma’ na-adịghị n’ederede Grik.
- source_word: ἐξελέξατο
  choice: ahọrọla
  rationale: Ụdị a na-egosi nhọrọ Meri mere n’onwe ya, nke nsonaazụ ya ka dịkwa, dịka nkebi na-esote si gosi.
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: nke a na-agaghị anapụ ya
  rationale: Nke a na-ejikọta nkebi ahụ na ‘oke ọma’ ma na-ekwupụta n'ụzọ nkịtị na a gaghị ewepụ ya n’aka Meri.
theological_decisions:
- issue: Ihe ‘ihe ole na ole ... ma ọ bụ otu ihe’ pụtara n’ihe gbasara ozi Mata na nhọrọ Meri
  choice: E chekwara okwu ahụ dịka nkwupụta banyere ihe dị mkpa, n’akọwaghị kpọmkwem ma ọ bụ efere ole na ole, otu efere, ka ọ bụ otu ihe kacha mkpa.
  alternative: ‘Naanị otu ihe dị mkpa,’ ma ọ bụ, ‘Naanị efere ole na ole dị mkpa—ọbụna otu efere.’
  rationale: Okwu Grik nwere ike izo aka ma ná nkwadebe nri a na-ekwu maka ya ozugbo ma ná mkpa ime mmụọ ka ukwuu. Nsụgharị a echekwala esemokwu nghọta ahụ kama idozi ya n’ụzọ ederede ahụ na-amanyeghị.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dịkwa mfe nghọta. E ji ‘oke ọma’ chekwaa egwuregwu nghọta nke ọnọdụ nri na òkè bara uru, ma zere ịsụgharị ἀγαθή dịka ‘nke ka mma,’ n’ihi na Grik abụghị ntụnyere.
