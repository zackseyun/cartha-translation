review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the main sense of the Greek, including the compact and deliberately unresolved contrast between ‘few’ and ‘one,’ Mary’s deliberate choice, and the future passive assurance. However, the central noun μερίδα should be written òkè, not oke: òkè is the ordinary Standard Igbo word for a share or portion and better preserves the meal/share resonance.'
  naturalness: The wording is generally clear, but ‘Ma ihe ole na ole dị mkpa’ is somewhat less idiomatic than a cleft construction with ka. ‘Ma ọ bụ naanị ihe ole na ole—ma ọ bụ otu ihe—ka dị mkpa’ is natural modern Standard Igbo while retaining the source ambiguity.
  terminology: Meri is an appropriate Standard Igbo form of Μαριάμ. Òkè ọma faithfully renders τὴν ἀγαθὴν μερίδα without importing the comparative sense ‘better.’ ‘A gaghị anapụ ya’ naturally renders the future passive ‘will not be taken away from her.’
  issues:
  - severity: medium
    issue: ‘oke ọma’ in the text is lexically ambiguous and does not clearly express μερίδα.
    rationale: Standard Igbo òkè means ‘share, allotted portion.’ Writing òkè makes the intended noun clear and retains its possible meal-portion and figurative-share senses. The existing footnote already uses the more precise form.
  - severity: low
    issue: The first clause can be made more idiomatic in Standard Igbo.
    rationale: Using ‘... ka dị mkpa’ gives the necessity construction a smoother, natural Igbo form without resolving whether the referent is dishes or one essential matter.
  revised_text: Ma ọ bụ naanị ihe ole na ole—ma ọ bụ otu ihe—ka dị mkpa[a]. N’ihi na Meri ahọrọla òkè ọma[b], nke a na-agaghị anapụ ya.
