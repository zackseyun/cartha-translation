source:
  edition: SBLGNT
  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: ig
  text: Nwanyị a nwekwara nwanne nwanyị a na-akpọ Meri, onye nọdụkwara ala n’ụkwụ Jizọs, na-ege okwu ya ntị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ e ji aka dee na-agụ “Onyenwe anyị” kama “Jizọs.”
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: Nwanyị a
  rationale: Nnọchiaha ngosi a na-ezo aka na Mata n'amaokwu gara aga; “Nwanyị a” na-eme ka njikọ ahụ doo anya n'Igbo n'etinyeghị aha ya n'amaokwu a.
- source_word: ἀδελφὴ
  choice: nwanne nwanyị
  rationale: Nke a bụ okwu Igbo doro anya maka nwanne bụ nwanyị, ma ọ dịghị ekpebi ma ọ tọrọ ya ma ọ bụ na ọ bụ nke nta.
- source_word: καλουμένη Μαριάμ
  choice: a na-akpọ Meri
  rationale: Ọ bụ ụzọ Igbo dị mma ma kwụsie ike isi kwuo aha e ji mara mmadụ.
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: nọdụrụkwa n'ụkwụ
  rationale: Ọ na-egosi na Meri weere ọnọdụ ịnọdụ n'ụkwụ Jizọs; nke a na-echekwa ihe oyiyi onye na-amụ ihe n'ebughị nkọwa ọzọ bata.
- source_word: τοῦ Ἰησοῦ
  choice: Jizọs
  rationale: Ederede SBLGNT e nyere nwere Ἰησοῦ, ya mere a sụgharịrị aha ahụ kpọmkwem; ọgụgụ ọzọ ka edebere n'okpuru peeji.
- source_word: ἤκουεν
  choice: na-ege ... ntị
  rationale: Ụdị imperfect na-egosi omume na-aga n'ihu; usoro Igbo “na-ege ... ntị” na-egosipụta nke a nke ọma.
- source_word: τὸν λόγον αὐτοῦ
  choice: okwu ya
  rationale: Nke a na-anọ nso na λόγος ma na-ahapụ obosara okwu ahụ karịa ịkọwa ya naanị dị ka “nkuzi” ma ọ bụ “ozi.”
theological_decisions:
- issue: Ọgụgụ ederede n'okwu na-ekwu onye Meri nọdụrụ n'ụkwụ ya
  choice: Jizọs
  alternative: Onyenwe anyị
  rationale: Isi ederede SBLGNT e nyere gụrụ Ἰησοῦ (“Jizọs”). Ebe ụfọdụ akaọrụ nwere ọgụgụ κύριος (“Onyenwe anyị”), a na-echekwa ya n'okpuru peeji kama ịgbanwe isi ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ugwu. E kewara ahịrịokwu Grik ahụ ụzọ abụọ ka ọ bụrụ ihe ndị mmadụ na-agụ kwa ụbọchị ga-aghọta ngwa ngwa, na-enweghị iwepụ njikọ ma ọ bụ ihe ọ pụtara.
