  - severity: low
    issue: “anabatakwa” adds an unnecessary additive/emphatic sense
    rationale: The suffix -kwa can suggest “also/indeed,” whereas the Greek καί is most naturally represented here by the overall conditional sequence, not by an added emphasis on receiving.
