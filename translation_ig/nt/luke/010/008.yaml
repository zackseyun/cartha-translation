id: LUK.10.8
reference: Luke 10:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἰς ἣν ἂν πόλιν εἰσέρχησθε καὶ δέχωνται ὑμᾶς, ἐσθίετε τὰ παρατιθέμενα ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: ig
  text: N’obodo ọ bụla unu banyere, ọ bụrụ na ha anabata unu, rienụ ihe e tinyere n’ihu unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: n’obodo ọ bụla
  rationale: Nkebi ahịrịokwu a na ἄν nwere echiche zuru ezu nke obodo ọ bụla ha pụrụ ịbanye na ya; ‘n’obodo ọ bụla’ bụ Igbo nkịtị ma na-edobe echiche ahụ.
- source_word: εἰσέρχησθε
  choice: Mgbe unu banyere
  rationale: Ụdị subjunctive a nọ n’ọnọdụ izugbe; ‘mgbe unu banyere’ na-egosi ịbanye n’obodo ma na-aga nke ọma na usoro okwu Igbo.
- source_word: δέχωνται ὑμᾶς
  choice: ndị bi na ya anabatakwa unu
  rationale: δέχομαι n’ebe a pụtara ịnabata ma ọ bụ ile ọbịa anya ọma. ‘Anabata’ na-edobe obosara ihe okwu Grik ahụ pụtara; ‘ndị bi na ya’ na-eme ka onye isi ngwaa plural doo anya n’Igbo.
- source_word: ἐσθίετε
  choice: rienụ
  rationale: Nke a bụ iwu present imperative e nyere ọtụtụ mmadụ; ‘rienụ’ bụ iwu doro anya ma bụrụ Igbo ebumpụta ụwa.
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: ihe e tinyere n’ihu unu
  rationale: Nhọrọ a na-edobe passive participle na ihe onyinye dị n’ihu ha, n’enweghị ịkọwa ya karịa ka isi mmalite si kwuo.
theological_decisions: []
translation_notes:
  register: 'Asụsụ Igbo ọkọlọtọ, nke oge a ma dị nsọ n’ụzọ kwesịrị ekwesị. A haziri njikọ καί dị n’etiti nkebi abụọ ahụ dịka usoro ọnọdụ ebumpụta ụwa n’Igbo: mgbe ha banyere ma a nabata ha, ha ga-eri ihe e tinyere n’ihu ha.'
