  verdict: revise
  source_fidelity: The draft conveys the general instruction, but “ndị bi na ya” (“the inhabitants of it”) explicitly supplies an antecedent that the Greek leaves implicit in δέχωνται (“they receive/welcome”). Also, anabatakwa adds an emphatic/additive nuance not required by the Greek καί in this conditional construction.
