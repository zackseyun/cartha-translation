  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: ig
  text: Ana m asị unu na n’ụbọchị ahụ[b], ọ ga-adịrị ndị Sọdọm mfe karị ịnagide karịa ka ọ ga-adịrị obodo ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ ga-adịrị ndị Sọdọm mfe karị ịtachi obi karịa ka ọ ga-adịrị obodo ahụ.” Okwu Grik bụ ἀνεκτότερον pụtara ihe a pụrụ ịnagide mfe karị.
    reason: lexical_alternative
  - marker: b
    text: “Ụbọchị ahụ” na-ezo aka n’ụbọchị ikpe Chineke; ụfọdụ amaokwu ndị yiri nke a kwuru nke ahụ hoo haa.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: Ana m agwa unu
  rationale: Nke a bụ ụzọ Igbo nke oge a si ekwu nkwupụta a na-agwa ndị mmadụ ozugbo, ma na-echekwa ịdị arọ nke okwu Jizọs.
- source_word: Σοδόμοις
  choice: Sọdọm
  rationale: Aha obodo ahụ na-anọchi anya ndị bi na ya dịka ọ dị n’asụsụ Grik; ịhapụ ya dịka aha ebe ahụ na-echekwa nkenke na ntụaka nke otu obodo dum.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: n’ụbọchị ahụ
  rationale: Nke a na-asụgharị okwu oge ahụ ozugbo, n’etinyeghị ‘ụbọchị ikpe’ n’ahịrịokwu bụ isi ebe Grik na-ekwughị ya hoo haa.
- source_word: ἀνεκτότερον
  choice: ihe ga-adịrị ... mfe ịnagide karịa
  rationale: Usoro a bụ Igbo doro anya nke na-egosipụta ntụnyere nke ihe a pụrụ ịnagide karịa, n’agbanyeghị na Grik ji naanị otu okwu ntụnyere mee ya.
- source_word: ἔσται
  choice: ga-adịrị
  rationale: Ọ na-echekwa oge ọdịnihu nke ngwaa Grik ma na-ada ka Igbo nkịtị n’usoro ntụnyere a.
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: karịa ka ọ ga-adịrị obodo ahụ
  rationale: Nke a na-echekwa ntụnyere na okwu ngosi ‘obodo ahụ,’ ma na-eme ka ahịrịokwu ahụ zuo oke ma bụrụ nke mmadụ ga-aghọta ngwa ngwa n’Igbo.
theological_decisions:
- issue: Ihe ‘ụbọchị ahụ’ pụtara
  choice: E debere ‘n’ụbọchị ahụ’ n’ahịrịokwu bụ isi n’agbasaghị ya.
  alternative: n’ụbọchị ikpe ahụ
  rationale: Ọnọdụ okwu na amaokwu ndị yiri ya na-egosi ụbọchị ikpe Chineke, ma amaokwu a n’onwe ya kwuru naanị ‘ụbọchị ahụ.’ Ya mere, nsụgharị ahụ echekwala okwu mbụ na ntakịrị mgbagwoju anya ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro Igbo nkịtị kama iṅomi nhazi Grik n’ụzọ ga-eme ka ọ sie ike, ma ọ naghị agbakwunye nkọwa okpukpe n’ahịrịokwu bụ isi.
