- from: Ana m agwa unu na n’ụbọchị ahụ[b], ihe ga-adịrị Sọdọm mfe ịnagide[a] karịa ka ọ ga-adịrị obodo ahụ.
  to: Ana m asị unu na n’ụbọchị ahụ[b], ọ ga-adịrị ndị Sọdọm mfe karị ịnagide karịa ka ọ ga-adịrị obodo ahụ[a].
  rationale: The revision more closely reflects the plural reference of Σοδόμοις, improves the comparative syntax in Standard Igbo, and keeps the verse’s deliberate wording “n’ụbọchị ahụ” rather than inserting “ụbọchị ikpe” into the main text. Footnote anchors and their functions are retained.
