id: LUK.10.32
reference: Luke 10:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: ig
  text: N’otu aka ahụ, onye Livaị bịakwara n’ebe ahụ[a]; mgbe ọ hụrụ ya, ọ gafere n’akụkụ nke ọzọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’akụkụ ebe ahụ” ma ọ bụ “n’ebe ahụ kpọmkwem.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ngwaa ahụ naanị dị ka “ọ gafere,” ma ọdịdị ngwaa Grik ahụ na-enye echiche nke izere onye ahụ ụma; ya mere, “ọ gafere n’akụkụ nke ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: N’otu aka ahụ
  rationale: Na-ejikọta omume onye Livaị na nke onye nchụàjà e kwuru okwu ya tupu nke a, ma na-ada nke ọma n’Igbo oge a.
- source_word: δὲ
  choice: —
  rationale: Ọ bụ njikọ dị nro n’ebe a; usoro ahịrịokwu Igbo na-ebupụta ọrụ ya nke ọma n’enweghị okwu pụrụ iche.
- source_word: καὶ
  choice: -kwara
  rationale: Mgbakwunye -kwara na ‘bịa’ na-egosi na onye Livaị bụkwa onye ọzọ bịara, dịka καί si tinye ya n’ihe atụ ahụ.
- source_word: Λευίτης
  choice: onye Livaị
  rationale: Na-edobe aha ìgwè okpukpe na akụkọ ihe mere eme ahụ, kama ịgbanwe ya ka ọ bụrụ nkọwa ọrụ nke nwere ike ịgbakwụnye ihe ederede ekwughị.
- source_word: κατὰ τὸν τόπον
  choice: n’ebe ahụ
  rationale: Na-egosi ebe ihe ahụ mere nke a marala site n’akụkọ; ọ dị nkenke ma bụrụkwa asụsụ Igbo nkịtị.
- source_word: ἐλθὼν
  choice: bịa
  rationale: A gbanwere participle aorist ahụ ka ọ bụrụ ngwaa kwụụrụ onwe ya n’usoro omume doro anya n’Igbo.
- source_word: ἰδὼν
  choice: mgbe ọ hụrụ ya
  rationale: Na-egosi na ịhụ nwoke ahụ buru ụzọ tupu isi omume ahụ; ‘ya’ sitere n’ihe a na-ekwu maka ya n’akụkọ.
- source_word: ἀντιπαρῆλθεν
  choice: ọ gafere n’akụkụ nke ọzọ
  rationale: Na-ebupụta ike nke ngwaa ngwakọta ahụ, nke na-egosi ịgafe n’akụkụ ọzọ ma zere onye ahụ, ọ bụghị naanị ịgafe ya.
theological_decisions:
- issue: Njirimara mmekọrịta mmadụ na okpukpe nke Λευίτης
  choice: onye Livaị
  alternative: onye na-eje ozi n’ụlọ nsọ; onye si n’agbụrụ Livaị
  rationale: Idebe ‘Livaị’ dị ka aha ìgwè na-echekwa nkọwa akụkọ ihe mere eme na myirịta ya na onye nchụàjà, n’agbakwụnyeghị nkọwa ọrụ n’ime isi ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji ‘onye Livaị’ chekwaa aha akụkọ ihe mere eme ahụ; e jighị okwu ụka otu ọ bụla ma ọ bụ nkọwa nkuzi pụrụ iche.
