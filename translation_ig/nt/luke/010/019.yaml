  to: Lee, enyela m unu ikike ịzọ ụkwụ n’elu agwọ na akpị[a], nakwa n’elu ike niile nke onye iro; ọ dịghịkwa ihe ọ bụla ga-emerụ unu ma ọlị.[b]
  rationale: E dochiri 'n’ahụ ike niile' anya na 'n’elu ike niile' iji sụgharịa ἐπὶ πᾶσαν τὴν δύναμιν n’ụzọ ziri ezi ma dị eke n’Igbo. Nke a na-edobe ọdịiche okwu dị n’etiti ikike e nyere na ike onye iro, na-ahapụkwa onye iro ahụ n’enweghị nkọwa karịrị ihe Grik kwuru. E mezigharịrị ihe odide ala a ka ọ bụrụ nkọwa ọnọdụ amaokwu, kama ikwu nhọrọ okwu na-adịghị adị n’eziokwu.
