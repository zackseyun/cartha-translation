id: LUK.10.19
reference: Luke 10:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: ig
  text: Lee, enyela m unu ikike ịzọ ụkwụ n’elu agwọ na akpị[a], nakwa n’elu ike niile nke onye iro; ọ dịghịkwa ihe ọ bụla ga-emerụ unu ma ọlị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ọnọdụ amaokwu a, onyinyo agwọ na akpị nwekwara ike ime ka a chee banyere ike ime mmụọ ndị iro.
    reason: contextual_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ dịghị ihe ga-emerụ unu n’ụzọ ọ bụla.” Asụsụ Grik ji njụ siri ike mee ka okwu a pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: Lee
  rationale: Ọ bụ okwu e ji adọta uche ndị na-ege ntị; “Lee” bụ okwu Igbo doro anya ma dịkwa nsọpụrụ.
- source_word: δέδωκα
  choice: enyela m unu
  rationale: Ụdị perfect na-egosi ihe e mere nke mmetụta ya ka dị ugbu a; “enyela m unu” na-echekwa nghọta ahụ.
- source_word: ἐξουσίαν
  choice: ikike
  rationale: “Ikike” na-egosi ikike e nyere mmadụ, ma na-eme ka ọdịiche ya na δύναμις, bụ́ “ike,” pụta ìhè.
- source_word: τοῦ πατεῖν ἐπάνω
  choice: ịzọ ụkwụ n’elu
  rationale: Nke a na-echekwa onyinyo nke ịga ma ọ bụ ịzọ n’elu ihe n’asụsụ Igbo dị mfe nghọta.
- source_word: ὄφεων καὶ σκορπίων
  choice: agwọ na akpị
  rationale: Ndị a bụ aha anụmanụ ndị okwu Grik ahụ kpọrọ kpọmkwem; a hapụrụ onyinyo ahụ ka ọ ghara ịkọwa ya naanị dị ka ihe ime mmụọ.
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: ikike n’ahụ ike niile
  rationale: “N’ahụ” na-egosi na ikike ahụ karịrị ike onye iro, ebe “ike” na-echekwa ọdịiche dị n’etiti δύναμις na ἐξουσία.
- source_word: τοῦ ἐχθροῦ
  choice: nke onye iro
  rationale: A hapụrụ okwu ahụ n’ozuzu ya dịka Grik si kwuo, n’etinyeghị “Setan” ma ọ bụ “ekwensu” n’ime isiokwu.
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: ọ dịghịkwa ihe ọ bụla ga-emerụ unu ma ọlị
  rationale: “Ma ọlị” na-egosipụta nkwusi ike nke njụ abụọ dị n’asụsụ Grik n’ụzọ Igbo na-ada nke ọma.
theological_decisions:
- issue: Onye okwu “onye iro” na-ezo aka na ya
  choice: A sụgharịrị ya dịka “onye iro” n’akpọghị Setan aha.
  alternative: “Setan” ma ọ bụ “ekwensu”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi mmegide Setan, ma Grik kpọrọ naanị “onye iro.” Nsụgharị ahụ anaghị akọwapụta ihe ederede ahụ na-akọwaghị kpọmkwem.
- issue: Ma “agwọ na akpị” bụ anụmanụ nkịtị ka hà bụ ihe atụ
  choice: E debere onyinyo nkịtị ahụ n’isi ederede.
  alternative: Ịsụgharị ha dịka mmụọ ọjọọ ma ọ bụ ike ime mmụọ
  rationale: Okwu ndị ahụ pụtara agwọ na akpị n’ụzọ nkịtị, ọ bụ ezie na ọnọdụ amaokwu ahụ nwere ike ime ka ha na-anọchi anya ike ime mmụọ ndị na-emegide Chineke. Nsụgharị ahụ hapụrụ nghọta abụọ ahụ oghe.
- issue: Nkwa ahụ na njụ mmerụ ahụ siri ike
  choice: E ji “ma ọlị” chekwaa nkwusi ike nke okwu Grik.
  alternative: “Ọ dịghị ihe ga-emerụ unu” n’enweghị okwu nkwusi ike
  rationale: Grik ji οὐδέν tinyere οὐ μή kwusie njụ ahụ ike; e kwesịghị ime ka ike okwu ahụ daa ma ọ bụ kọwaa ụdị mmerụ ahụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. “Ikike” na “ike” kewapụrụ ἐξουσία na δύναμις. E debere onyinyo na nghọta ime mmụọ ya n’enweghị itinye nkọwa otu ụka n’ime isi ederede.
