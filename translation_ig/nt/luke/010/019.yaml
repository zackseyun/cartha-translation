  naturalness: '''N’ahụ ike niile'' adịghị ekwekọ n’ụzọ nkịtị n’ebe a na Standard Igbo. ''Nakwanụ n’elu ike niile nke onye iro'' na-adị mfe ma na-egosi mmekọrịta ọchịchị/ịka ike nke ọma.'
