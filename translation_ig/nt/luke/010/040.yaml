    reason: lexical_alternative
  revision_rationale: The revision makes Mata, as in the Greek, the explicit subject of the opening imperfect clause while retaining the ongoing sense of distraction. It also replaces the footnote’s overly strong ‘you do not want to care’ wording with an alternative that preserves the Greek question about concern. No theological or interpretive expansion is introduced.
