revisions:
- from: Ma ọtụtụ ọrụ ile ọbịa dọpụrụ Mata uche. Ọ bịakwutere ya sị, “Onyenwe anyị, ọ̀ dịghị gị mkpa na nwanne m nwanyị ahapụla naanị m ka m na-eje ozi?[a] Ya mere, gwa ya ka o nyere m aka.”
  to: Ma Mata nọ na ọtụtụ ọrụ ile ọbịa na-adọpụ ya uche. Ọ bịakwutere ya sị, “Onyenwe anyị, ọ̀ dịghị gị mkpa na nwanne m nwanyị ahapụla m ka m na-eje ozi naanị m?[a] Ya mere, gwa ya ka o nyere m aka.”
  rationale: The revision makes Mata, as in the Greek, the explicit subject of the opening imperfect clause while retaining the ongoing sense of distraction. It also replaces the footnote’s overly strong ‘you do not want to care’ wording with an alternative that preserves the Greek question about concern. No theological or interpretive expansion is introduced.
  reviewer_model: gpt-5.6-terra
