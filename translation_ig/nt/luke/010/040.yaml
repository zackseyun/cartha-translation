id: LUK.10.40
reference: Luke 10:40
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: ig
  text: Ma Mata nọ na ọtụtụ ọrụ ile ọbịa na-adọpụ ya uche. Ọ bịakwutere ya sị, “Onyenwe anyị, ọ̀ dịghị gị mkpa na nwanne m nwanyị ahapụla m ka m na-eje ozi naanị m?[a] Ya mere, gwa ya ka o nyere m aka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onyenwe anyị, ọ̀ ihe a ọ dịghị gị mkpa na nwanne m nwanyị ahapụla m ka m na-eje ozi naanị m?”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: dọpụrụ ... uche
  rationale: Ngwaa a na-egosi ọnọdụ na-aga n’ihu nke ọtụtụ ihe na-adọpụ uche Mata; okwu a na-echekwa ọdịiche dị n’etiti ya na Meri n’akụkụ amaokwu ndị gbara ya gburugburu.
- source_word: περὶ πολλὴν διακονίαν
  choice: ọtụtụ ọrụ ile ọbịa
  rationale: N’ọnọdụ ụlọ a, διακονία bụ ọrụ bara uru nke ile ọbịa na ijere ndị nọ ya ozi, ọ bụghị ọkwa ozi ụka; ‘ọrụ ile ọbịa’ bụ Igbo nkịtị ma ghara ime ka ọ bụrụ naanị isi nri.
- source_word: ἐπιστᾶσα
  choice: Ọ bịakwutere ya
  rationale: Nke a na-egosi na Mata bịara nso tupu o kwuo okwu, n’ụzọ doro anya ma bụrụkwa Igbo e ji eme ihe ugbu a.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị asụgharị κύριος mgbe a na-akpọ Jizọs, ma na-echekwa ibu okwu ahụ n’akwụkwọ Luk.
- source_word: οὐ μέλει σοι
  choice: ọ̀ dịghị gị mkpa
  rationale: Nkebi a na-ajụ ma ihe ahụ ọ bụ ihe na-emetụta ma ọ bụ na-echegbu Jizọs; nsụgharị a na-echekwa mkpesa Mata n’etinyeghị mmetụta siri ike karịa Grik.
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: ahapụla naanị m ka m na-eje ozi
  rationale: Nke a na-echekwa ma ‘naanị m’ ma omume ijere ndị ọzọ ozi, n’agbanyeghị na Igbo nwere ike ịgụ njikọ ‘naanị m’ n’ụzọ abụọ; e tinyere nhọrọ doro anya na nkọwa ala peeji.
- source_word: εἰπὲ οὖν αὐτῇ
  choice: Ya mere, gwa ya
  rationale: ‘Gwa ya’ na-egosipụta iwu ahụ kpọmkwem, ‘ya mere’ na-echekwakwa ike nkwubi okwu nke οὖν.
- source_word: συναντιλάβηται
  choice: ka o nyere m aka
  rationale: Ngwaa ahụ pụtara isonyere mmadụ n’iburu ibu ma ọ bụ inyere ya aka; okwu Igbo a bụ nke nkịtị ma dabara n’ọnọdụ ahụ.
theological_decisions:
- issue: Nsụgharị κύριος mgbe Mata na-akpọ Jizọs
  choice: Onyenwe anyị
  alternative: Nna anyị ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa aha nsọpụrụ ahụ na ojiji sara mbara nke Luk banyere Jizọs, n’ebughị ụzọ mechie ma Mata bu n’obi naanị nkwanye ùgwù mmadụ ma ọ bụ nkwupụta zuru oke banyere onye Jizọs bụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ọrụ ile ọbịa’ iji mee ka ọnọdụ ụlọ pụta ìhè n’emeghị διακονία ka ọ bụrụ ọkwa ọrụ okpukpe. Akara ajụjụ Igbo ‘ọ̀’ na-enyere aka igosi ajụjụ mkpesa Mata.
