review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal sense of Martha’s being distracted by extensive domestic service, her approach to Jesus, her complaint, and her request that Mary assist her. However, the footnote’s alternative, “ị chọghị ịma,” means “you do not want to know/care” and introduces a stronger, volitional nuance not present in οὐ μέλει σοι. The base wording “ọ̀ dịghị gị mkpa” adequately conveys the question of concern.
  naturalness: The text is generally clear Standard Igbo. Recasting the opening so that Mata is explicitly the subject follows the Greek more directly and reads more smoothly. “Bịakwutere ya” naturally renders her approaching Jesus in context.
  terminology: “Onyenwe anyị” is an appropriate established respectful rendering of Κύριε. “Ọtụtụ ọrụ ile ọbịa” suitably conveys practical household service without turning διακονία into formal church ministry. “nyere m aka” accurately expresses the requested shared help.
  issues:
  - severity: medium
    issue: The existing footnote alternative overstates οὐ μέλει σοι.
    rationale: “Ị chọghị ịma” attributes unwillingness or refusal to care, whereas the Greek idiom asks whether the matter is of concern to the hearer. The footnote should instead offer a closer alternative such as “ọ̀ ihe a ọ dịghị gị mkpa?”
  revised_text: Ma Mata nọ na ọtụtụ ọrụ ile ọbịa na-adọpụ ya uche. Ọ bịakwutere ya sị, “Onyenwe anyị, ọ̀ dịghị gị mkpa na nwanne m nwanyị ahapụla m ka m na-eje ozi naanị m?[a] Ya mere, gwa ya ka o nyere m aka.”
  revised_footnotes:
