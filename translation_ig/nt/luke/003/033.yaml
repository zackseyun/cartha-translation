  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ odide nwere ọgụgụ a: “nwa Aminadab, nwa Admin, nwa Aram”; ndị ọzọ na-ahapụ “Admin” ma nwee: “nwa Aminadab, nwa Aram.”'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N'usoro ọmụmụ a, mkpụrụokwu genitive a na-anọchi anya ‘nwa nke.’ Igbo na-ekwu ya n'ụzọ ebumpụta ụwa dị ka ‘nwa’ tupu aha nna ọ bụla.
- source_word: Ἀμιναδάβ
  choice: Aminadab
  rationale: Ntụgharị-ụda aha Grik nke na-edobe ụdị aha a ndị na-agụ Baịbụl Igbo maara.
- source_word: Ἀδμίν
  choice: Admin
  rationale: Ntụgharị-ụda aha ahụ dịka ọ dị n'ihe odide SBLGNT e nyere.
- source_word: Ἀρνί
  choice: Anị
  rationale: Ntụgharị-ụda ọgụgụ Ἀρνί dị na SBLGNT; a hapụrụ ọgụgụ ọzọ, Aram, n'ala peeji.
- source_word: Ἑσρώμ
  choice: Hezọn
  rationale: Ụdị aha kwekọrọ na aha Hibru a maara n'Agba Ochie, ma kwekwaa n'ụda Igbo.
- source_word: Φαρές
  choice: P-rez
  rationale: Ụdị aha kwekọrọ na Perez nke Agba Ochie; akara njikọ na-enyere onye Igbo aka ịkpọ mkpọkọta mgbochiume ahụ nke ọma.
- source_word: Ἰούδα
  choice: Juda
  rationale: Ụdị aha a na-ejikarị maka nna ochie Juda, ka ọ ghara ịgwakọta ya na ndị Agba Ọhụrụ a na-akpọ Judas.
