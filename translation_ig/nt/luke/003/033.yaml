  register: Asụsụ Igbo Izugbe dị mfe ma dị ùgwù; e debere usoro ugboro ugboro nke ndekọ ọmụmụ ahụ. A họọrọ ụdị aha ndị dabara n'usoro ịkpọ aha n'Igbo na njikọ ha na Agba Ochie.
