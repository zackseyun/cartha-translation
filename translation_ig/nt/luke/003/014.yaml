  to: Ndị agha nọkwa na-ajụ ya sị, “Gịnịkwa ka anyị ga-eme?”[a] Ọ sịrị ha, “Unu ejila ike napụ onye ọ bụla ihe ya[b], unu ebolakwa onye ọ bụla ebubo ụgha; ka afọ ju unu n’ụgwọ ọrụ unu[c].”
