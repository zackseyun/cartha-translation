  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: ig
  text: Ndị agha nọkwa na-ajụ ya sị, “Gịnịkwa ka anyị ga-eme?”[a] Ọ sịrị ha, “Unu ejila ike napụ onye ọ bụla ihe ya[b], unu ebolakwa onye ọ bụla ebubo ụgha; ka afọ ju unu n’ụgwọ ọrụ unu[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a na-ekwusi ike na ndị agha na-ajụ ihe ha onwe ha ga-emekwa dịka ndị ọzọ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, ngwaa Grik a nwere echiche nke ịma jijiji ma ọ bụ iyi mmadụ egwu; n’ebe a, ọ pụtara iji ike ma ọ bụ ọnọdụ mmadụ napụ onye ọzọ ihe.
    reason: lexical_alternative
  - marker: c
    text: “Ụgwọ ọrụ” nwekwara ike ịpụta ụgwọ ma ọ bụ ihe e ji enye ndị agha maka mkpa ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: ndị agha
  rationale: Okwu a na-ezo aka n’ebe ndị nọ n’ọrụ agha nọ; ‘ndị agha’ bụ okwu Igbo doro anya ma dịkwa mfe nghọta.
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: Gịnịkwa ka anyị ga-eme?
  rationale: ‘-kwa’ na-egosipụta καὶ ἡμεῖς, ya bụ na ndị agha na-ajụ ihe ha onwe ha ga-emekwa dịka ìgwè ndị ọzọ.
- source_word: διασείσητε
  choice: ejila ike napụ onye ọ bụla ihe ya
  rationale: N’ebe a, ngwaa ahụ pụtara iji iyi egwu ma ọ bụ ike ọchịchị amanye mmadụ inye ihe; nsụgharị a na-egosipụta mmegbu maka uru n’enweghị iji okwu slang.
- source_word: συκοφαντήσητε
  choice: ebolakwa onye ọ bụla ebubo ụgha
  rationale: Nke a na-echekwa isi echiche nke ibo mmadụ ebubo na-abụghị eziokwu, ma ghara imechi nkọwa ya n’ụzọ pụrụ iche dịka blackmail.
- source_word: ἀρκεῖσθε
  choice: ka ... ju unu afọ
  rationale: Akpaalaokwu Igbo a na-egosipụta afọ ojuju na ihe mmadụ nwere, kwekọrọ n’iwu na-aga n’ihu nke ngwaa Grik.
- source_word: ὀψωνίοις
  choice: ụgwọ ọrụ unu
  rationale: Okwu Grik ahụ nwere ike ịpụta ụgwọ ma ọ bụ ihe e ji elekọta onye agha; ‘ụgwọ ọrụ’ bụ okwu Igbo doro anya n’ọnọdụ a.
theological_decisions:
- issue: Ndụmọdụ omume e nyere ndị agha
  choice: E chekwara ndụmọdụ Jọn nyere ndị agha ka ha ghara iji ike ha emegbu mmadụ ma ọ bụ nwee anyaukwu.
  alternative: Ịkọwa amaokwu ahụ dịka iwu ka ha hapụ ọrụ agha.
  rationale: Ihe odide ahụ enyeghị ha iwu ịhapụ ọrụ agha; ọ gwara ha kpọmkwem ka ha ghara ime omume ọjọọ n’ọrụ ha. Nsụgharị ahụ anaghị etinye nkwenkwe ọzọ n’ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọpụrụ ma dịkwa mfe nghọta. A họọrọ ‘Gịnịkwa ka anyị ga-eme?’ iji mee ka nkwusi ike nke καὶ ἡμεῖς daa nke ọma n’Igbo. Akara nkọwa ala ala [a], [b], na [c] niile nọ n’ebe okwu ha na-akọwa dị.
