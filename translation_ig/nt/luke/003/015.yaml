id: LUK.3.15
reference: Luke 3:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: ig
  text: Mgbe ndị mmadụ nọ na-atụsi anya ike, ha niile nọkwa na-atụgharị uche n’obi ha banyere Jọn, ma eleghị anya ọ̀ bụ ya onwe ya bụ Mezaya ahụ[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Kraịst ahụ.” N’asụsụ Grik: ho christos.'
    reason: alternative_reading
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: Mgbe ... nọ na-atụsi anya ike
  rationale: Nkebi a na-akọ ọnọdụ dị n’oge ahụ; “na-atụsi anya ike” na-egosi na ha nọ na-eche ihe ha tụrụ anya ya nke ukwuu, ọ bụghị nanị na ha nọ na-eche oge.
- source_word: δὲ
  choice: ejighị okwu pụrụ iche sụgharịa ya
  rationale: N’ebe a δέ bụ njikọ akụkọ dị nro. Nhazi ahịrịokwu Igbo na “Mgbe” na-ebuga akụkọ ahụ n’ihu n’enweghị mkpa itinye “ugbu a” ma ọ bụ “ma.”
- source_word: λαοῦ
  choice: ndị mmadụ
  rationale: Nke a na-anọchi ndị ahụ dịka otu ìgwè n’ụzọ doro anya ma dịrị ndị na-agụ Igbo mfe.
- source_word: διαλογιζομένων
  choice: na-atụgharị uche
  rationale: Ọ na-egosi ịtụle ihe n’ime mmadụ, ọkachasị ebe isi iyi ahụ kwuru na ọ bụ n’obi ha ka ha mere ya.
- source_word: πάντων
  choice: ha niile
  rationale: Ọ na-edobe nghọta zuru ezu nke πάντων banyere ndị mmadụ ahụ a na-ekwu okwu ha.
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: n’obi ha
  rationale: Nsụgharị a na-edobe ihe oyiyi Baịbụl nke obi dịka ebe echiche na ntụgharị uche dị, ma ọ ka bụ Igbo e ji eme ihe.
- source_word: περὶ τοῦ Ἰωάννου
  choice: banyere Jọn
  rationale: Nke a bụ ụzọ Igbo dị mfe ma ziri ezi isi kwuo na ihe ha na-atụle metụtara Jọn.
- source_word: μήποτε ... εἴη
  choice: ma eleghị anya ọ̀ bụ
  rationale: Ajụjụ ụda olu na “eleghị anya” jikọtara ọnụ na-egosi ma ajụjụ ahụ ma ejighị n’aka dị n’okwu Grik.
- source_word: αὐτὸς
  choice: ya onwe ya
  rationale: 'Nke a na-edobe nkwusi ike dị na nnọchiaha Grik: ha na-eche ma Jọn n’onwe ya ọ̀ bụ onye ahụ.'
- source_word: ὁ χριστός
  choice: Mezaya ahụ
  rationale: N’ebe a Χριστός bụ utu aha onye ndị mmadụ na-atụ anya ya, ya mere “Mezaya ahụ” na-egosi ọnọdụ ndị Juu na nghọta nke aha ahụ.
theological_decisions:
- issue: Nsụgharị Χριστός dịka utu aha
  choice: Mezaya ahụ
  alternative: Kraịst ahụ
  rationale: Ndị mmadụ na-atụle onye Jọn bụ n’ihe gbasara onye e tere mmanụ ha na-atụ anya ya. “Mezaya” na-edobe ọrụ okwu ahụ dịka utu aha kama ime ka ọ dị ka aha nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ ahịrịokwu ahụ na kọma dịka isi iyi nyere si dị, n’ihi na echiche ahụ na-aga n’ihu n’amaokwu na-esote. E debere akara nkọwa ụkwụ [a] ozugbo n’azụ “Mezaya ahụ,” ebe ọ metụtara.
