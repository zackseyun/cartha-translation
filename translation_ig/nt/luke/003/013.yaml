  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: ig
  text: Ọ sịrị ha[a], “Unu anakọtala ụtụ karịa ihe e nyere unu iwu ka unu nakọta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nke na-esochikwu mkpụrụokwu Grik anya, “Unu emela ihe ọ bụla karịrị ihe e nyere unu iwu ka unu mee.” N’ihe gbara okwu a gburugburu, ngwaa ahụ na-ezo aka kpọmkwem n’ọrụ ha nke ịnakọta ụtụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Ọ
  rationale: δέ bụ njikọ dị nro n’akụkọ a; n’Igbo, ịmalite naanị na “Ọ” na-eme ka okwu gaa n’ihu n’ụzọ ebumpụta ụwa, n’enweghị ime ka ọ dị ka e nwere nnukwu mgbagha.
- source_word: εἶπεν πρὸς αὐτούς
  choice: sịrị ha
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ziri ezi isi kwuo na ọ gwara ha okwu.
- source_word: Μηδὲν πλέον
  choice: anakọtala ihe karịrị
  rationale: Nkebi a machibidoro ha ịnara ihe gafere oke; “ihe karịrị” na-egosipụta echiche nke mmachi ahụ nke ọma.
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: nke e nyere unu iwu
  rationale: διατεταγμένον bụ participle perfect passive nke na-egosi ihe e nyere n’iwu ma ọ bụ ihe a tụrụ ka e mee; ntụgharị a na-echekwa ụda iwu na passive ahụ.
- source_word: πράσσετε
  choice: ịnakọta
  rationale: Ọ bụ ezie na πράσσω nwere ike ịpụta “ime,” ihe gbara ya gburugburu na-egosi na Jọn na-agwa ndị ọnaụtụ okwu; ya mere, “ịnakọta” na-eme ka ọrụ a na-ekwu maka ya doo anya n’Igbo.
theological_decisions:
- issue: Ime ka ọrụ e zoro n’okwu πράσσετε pụta ìhè
  choice: 'Ịsụgharị ya dịka ọrụ ịnakọta ụtụ: “Unu anakọtala ihe karịrị nke e nyere unu iwu ịnakọta.”'
  alternative: “Unu emela ihe ọ bụla karịrị nke e nyere unu iwu ime.”
  rationale: Nke a abụghị mkpebi ozizi, kama ọ bụ mkpebi ntụgharị. Ndị a na-agwa bụ ndị ọnaụtụ dịka amaokwu bu ụzọ gosiri, ya mere ime ka “ịnakọta” pụta ìhè na-enye onye na-agụ ya nghọta n’etinyeghị echiche ọhụrụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Unu anakọtala” bụ iwu na-adịghị mma kwesịrị ekwesị maka ọtụtụ mmadụ; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa otu okpukpe mee ihe.
