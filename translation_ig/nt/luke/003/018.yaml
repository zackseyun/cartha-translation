  yaml_path: translation/nt/luke/003/018.yaml
  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: ig
  text: Ya mere, ka ọ na-adụ ha ọdụ n'ọtụtụ ihe ndị ọzọ, Jọn nọ na-ezisa ndị mmadụ ozi ọma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: ọtụtụ ndụmọdụ ndị ọzọ kwa
  rationale: Okwu ndị a na-egosi ọtụtụ ihe ndị ọzọ Jọn kwuru; ijikọ ha na participle παρακαλῶν dịka ‘ọtụtụ ndụmọdụ ndị ọzọ’ na-eme ka Igbo bụrụ nke e kere eke, ebe ndetu ala na-echekwa na ihe Πολλὰ na-akọwapụta apụtaghị kpọmkwem na Grik.
- source_word: μὲν οὖν
  choice: Ya mere
  rationale: Na-egosi njikọ na ntụgharị n’ihe a na-akọ, n’enweghị ịsụgharị particle nke ọ bụla gabiga ókè.
- source_word: παρακαλῶν
  choice: ji ... ndụmọdụ
  rationale: N’ọnọdụ nkwusa amụma Jọn, nke a na-egosi ịgba ume na ịdọ aka ná ntị ka ndị mmadụ mee ihe kwesịrị ekwesị; ‘ndụmọdụ’ na-enye echiche a n’Igbo nkịtị.
- source_word: εὐηγγελίζετο
  choice: na-ezisa ... ozi ọma
  rationale: Ọdịdị imperfect na-egosi omume na-aga n’ihu n’oge gara aga; ‘na-ezisa ozi ọma’ na-echekwa nkọwa nke ikwusa ozi ọma.
- source_word: τὸν λαόν
  choice: ndị mmadụ
  rationale: Na-anọchi anya ndị Jọn na-agwa okwu n’enweghị itinye nkọwa ‘Izrel’ nke amaokwu ahụ ekwughị kpọmkwem.
theological_decisions:
- issue: Ike εὐηγγελίζετο n’ozi Jọn
  choice: na-ezisa ndị mmadụ ozi ọma
  alternative: na-ekwusara ndị mmadụ okwu
  rationale: Grik n’onwe ya kọwara ozi ndụmọdụ na ịdọ aka ná ntị Jọn dịka izisa ozi ọma; nsụgharị ahụ kwesịrị ichekwa njikọta a kama ime ka ọ bụrụ naanị nkwusa n’ozuzu.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Jọn’ mee ka onye nọchiri anya ya doo anya n’Igbo, n’ihi na amaokwu a guzo naanị ya; ọ naghị agbakwunye ọdịnaya ọhụrụ n’ihe gbara amaokwu ahụ gburugburu.
