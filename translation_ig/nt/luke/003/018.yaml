revisions:
- from: Ya mere, Jọn ji ọtụtụ ndụmọdụ ndị ọzọ kwa[a] na-ezisa ndị mmadụ ozi ọma.
  to: Ya mere, ka ọ na-adụ ha ọdụ n'ọtụtụ ihe ndị ọzọ, Jọn nọ na-ezisa ndị mmadụ ozi ọma.
  rationale: The revision renders παρακαλῶν as a concurrent action (“ka ọ na-adụ ha ọdụ”), retains the broad and implicit sense of πολλά ... καὶ ἕτερα (“n'ọtụtụ ihe ndị ọzọ”), and preserves the imperfect gospel proclamation with “nọ na-ezisa ... ozi ọma.” The footnote is retained with wording that matches the revised syntax.
