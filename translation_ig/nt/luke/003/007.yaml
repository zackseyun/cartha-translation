  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ig
  text: Ya mere, ọ nọ na-agwa ìgwè mmadụ ndị na-apụta ka o mee ha baptizim, “Ụmụ ajụala[a], ònye dọrọ unu aka ná ntị ka unu gbanahụ ọnụma na-abịa[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ìgwè ụmụ ajụala.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọnụma nke gaje ịbịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ọ nọ na-agwa
  rationale: Ụdị ngwaa imperfect na-egosi okwu na-aga n’ihu ma ọ bụ nke a na-ekwu ugboro ugboro; okwu a na-echekwa echiche ahụ n’enweghị ịkọwapụta ugboro ole.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta ihe a na akụkọ na echiche nke bu ya ụzọ n’ụzọ doro anya n’Igbo.
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: ìgwè mmadụ ndị na-apụta
  rationale: Ọ na-echekwa echiche nke ìgwè mmadụ na-esi ebe ha nọ apụta, na-aga n’ebe Jọn nọ.
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: ka o mee ha baptizim
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke okike isi kwuo na ha bịara ka onye ahụ mee ha baptizim, na-echekwakwa na ọ bụ ya na-eme omume ahụ.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Ụmụ ajụala
  rationale: “Ụmụ” na-egosi ihe a mụrụ, ebe “ajụala” na-enye ihe oyiyi agwọ ọjọọ dị n’okwu Grik ahụ; okwu ahụ dị nkọ ma ghọta ya ngwa ngwa n’Igbo.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: ònye dọrọ unu aka ná ntị
  rationale: N’ọnọdụ a, ngwaa ahụ pụtara ime ka mmadụ mara ihe ize ndụ na-abịa; “dọrọ ... aka ná ntị” na-ewepụta ike ịdọ aka ná ntị ahụ.
- source_word: φυγεῖν
  choice: ka unu gbanahụ
  rationale: Ọ na-echekwa ihe oyiyi nke ịgbapụ n’ihe ize ndụ ma bụrụ okwu Igbo a na-aghọta nke ọma.
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: ọnụma na-abịa
  rationale: “Na-abịa” na-egosi ihe a na-atụ anya na ọ ga-abịa, ebe “ọnụma” na-ahapụ echiche ikpe Chineke n’obosara ya dịka isi mmalite si mee.
theological_decisions:
- issue: Ihe ὀργή pụtara n’ịdọ aka ná ntị Jọn
  choice: “ọnụma” na-ezo aka n’ikpe Chineke na-abịa n’akọwaghị usoro ozizi pụrụ iche
  alternative: ịkọwa ya kpọmkwem dịka ikpe ikpeazụ ma ọ bụ dịka naanị ikpe nke mere n’akụkọ ihe mere eme
  rationale: Ihe gbara amaokwu ahụ gburugburu na-ekwu maka nchegharị n’ihi ikpe Chineke. Nsụgharị ahụ na-echekwa okwu sara mbara ma ghara ikpebi kpọmkwem ụdị ikpe nke amaokwu ahụ n’onwe ya na-akọwaghị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E debere ụda ịdọ aka ná ntị siri ike nke Jọn, ma zere okwu ga-eme ka amaokwu ahụ bụrụ nke otu ụka ma ọ bụ otu usoro ozizi kpọmkwem.
