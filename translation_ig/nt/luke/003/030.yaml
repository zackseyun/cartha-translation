translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe, dị ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E mere ka usoro ọmụmụ pụta ìhè site n'ikwughachi ‘nwa’; e debere akara nkọwa ala peeji niile n'akụkụ aha ha metụtara.
