lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N'usoro ọmụmụ a, mkpụrụokwu genitive a na aha ọ bụla na-aga n'ihu n'echiche nke ‘nwa nke’; n'Igbo, ikwughachi ‘nwa’ na-eme ka njikọ ọmụmụ doo anya ma na-ada ka asụsụ ebumpụta ụwa.
- source_word: Συμεὼν
  choice: Simiọn
  rationale: E dere aha ahụ n'ụdị mkpọpụta dabara n'usoro mkpụrụedemede na ụda Igbo.
- source_word: Ἰούδα
  choice: Juda
  rationale: Ụdị Grik a nwere ike ịbụ Juda ma ọ bụ Judas; n'usoro ọmụmụ a, ‘Juda’ na-egosipụta aha ndị Juu sitere n'asụsụ Hibru nke ọma, ghara ime ka a chee ozugbo banyere Judas Iskarịọt.
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: Nke a bụ ụdị aha ahụ a na-amata nke ọma n'Igbo, ọ na-esokwa ụda aha Grik ahụ.
- source_word: Ἰωνὰμ
  choice: Jonam
  rationale: Ọ na-anọchite anya kpọmkwem ụdị Ἰωνάμ dị na SBLGNT; ‘Jonan’ sitere n'ụdị ederede ma ọ bụ omenala ntụgharị ọzọ.
- source_word: Ἐλιακὶμ
  choice: Eliakim
  rationale: Nke a bụ ntụgharị mkpụrụedemede doro anya ma dị mfe ọgụgụ nke aha ndị Semit ahụ n'Igbo.
