  terminology: '“Juda,” “Josef,” “Jonam,” and “Eliakim” are appropriate. The first footnote is misleading: the issue is not that Greek itself offers two renderings, but that the same Greek form Ἰούδα may be transliterated in translation as Juda/Judah or Judas. Also, the source contains no internal reason to claim that one rendering fits the genealogy better; that interpretive preference should be removed.'
