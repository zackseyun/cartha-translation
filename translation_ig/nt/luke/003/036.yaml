lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N’usoro ọmụmụ a, mkpụrụokwu genitive a na aha ọ bụla na-egosi njikọ nna na nwa nke amaokwu ndị gbara ya gburugburu guzobere. “Nwa” na-eme ka njikọ ahụ doo anya n’Igbo n’enweghị ịgbakwụnye echiche ọzọ.
- source_word: Καϊνὰμ
  choice: Kainam
  rationale: A sụgharịrị aha Grik a n’ụzọ na-esochi ụda na mkpụrụedemede ya, gụnyere m dị n’ọgwụgwụ.
- source_word: Ἀρφαξὰδ
