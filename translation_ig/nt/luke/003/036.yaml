  rationale: Ụdị a na-esochi aha Grik dị na Luk, kama ime ka ọ bụrụ otu ihe kpọmkwem na ụdị Hibru nke Agba Ochie.
- source_word: Σὴμ
  choice: Shem
  rationale: E degharịrị aha mmadụ a n’ụdị a maara nke ọma ma dị mfe ọgụgụ n’Igbo.
- source_word: Νῶε
  choice: Noa
  rationale: “Noa” bụ ụdị aha a na-agụ n’ụzọ ebumpụta ụwa n’Igbo, ma na-anọchi anya aha Grik Νῶε.
- source_word: Λάμεχ
  choice: Lamek
  rationale: E degharịrị aha Grik ahụ n’ụdị kwekọrọ na mkpọpụta na usoro mkpụrụedemede Igbo.
theological_decisions:
- issue: Ịgụnye Kainam n’agbụrụ Luk n’etiti Arfaksad na Shem
  choice: E debere Kainam n’ahịrịokwu bụ isi dịka SBLGNT si gụọ ya.
  alternative: Ụfọdụ ọdịnala na-ahapụ Kainam ka usoro ọmụmụ a yie ụfọdụ ụdị usoro ọmụmụ Agba Ochie.
  rationale: Ederede Grik a họpụtara nwere Καϊνὰμ. Ya mere, nsụgharị ahụ ekwesịghị ime ka Luk kwekọọ n’ike na Jenesis; ihe dị iche ahụ kwesịrị ịdịrị onye na-agụ ya anya.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro mkpirikpi “nwa X” n’ihi na ọ bụ ụzọ ebumpụta ụwa isi depụta agbụrụ n’Igbo. E debere ọdịiche dị n’etiti ụdị aha Grik na ụdị Agba Ochie na nkọwa ala peeji kama ihichapụ ya.
