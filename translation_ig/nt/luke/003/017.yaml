revisions:
- from: Ihe e ji efecha ọka dị ya n’aka, iji sachapụ ebe ịzọcha ọka ya nke ọma, chịkọtakwa ọka wit n’ụlọ nkwakọba ihe ya[b]. Ma igbogbo ọka ka ọ ga-eji ọkụ a na-apụghị imenyụ emenyụ gbaa ọkụ[a].
  to: Ihe e ji efecha ọka dị ya n’aka, iji sachapụ ebe a na-azọcha ọka ya nke ọma, chịkọtakwa ọka wit n’ụlọ nkwakọba ihe ya[b]. Ma igbogbo ọka ka ọ ga-eji ọkụ a na-apụghị imenyụ emenyụ rechapụ[a].
  rationale: The revision retains the draft’s accurate and accessible agricultural vocabulary, smooths the expression for the threshing floor, and renders κατακαύσει with 'rechapụ' to preserve the Greek verb’s sense of complete burning. The text continues to state the judgment image without expanding it into a more detailed doctrinal claim.
  reviewer_model: gpt-5.6-terra
