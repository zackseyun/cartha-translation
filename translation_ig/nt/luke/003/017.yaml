id: LUK.3.17
reference: Luke 3:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: ig
  text: Ihe e ji efecha ọka dị ya n’aka, iji sachapụ ebe a na-azọcha ọka ya nke ọma, chịkọtakwa ọka wit n’ụlọ nkwakọba ihe ya[b]. Ma igbogbo ọka ka ọ ga-eji ọkụ a na-apụghị imenyụ emenyụ rechapụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọkụ nke na-agaghị anyụ anyụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọba ọka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: ihe e ji efecha ọka
  rationale: Okwu a na-ezo aka n’ihe ọrụ ugbo e ji atụgharị ma ọ bụ tụba ọka n’ikuku ka ikuku kewapụ mkpụrụ ọka na igbogbo ya. Nkebiokwu nkọwa a doro ndị na-agụ Igbo nke oge a anya karịa ịmepụta otu aha ọrụ pụrụ iche.
- source_word: διακαθᾶραι
  choice: iji sachapụ ... nke ọma
  rationale: “Sachapụ ... nke ọma” na-egosipụta ike nke ngwaa a, ya bụ ime ka ebe ahụ dị ọcha kpamkpam.
- source_word: ἅλωνα
  choice: ebe ịzọcha ọka
  rationale: Nke a bụ ebe a na-azọcha ma na-efecha ọka; ọ na-edobe ihe atụ ọrụ ugbo nke ederede ahụ.
- source_word: συναγαγεῖν
  choice: chịkọtakwa
  rationale: Ọ na-egosi ịchịkọta mkpụrụ ọka ndị e kewapụrụ ma webata ha n’ebe nchekwa.
- source_word: σῖτον
  choice: ọka wit
  rationale: Ọ bụ ezie na okwu Grik ahụ nwere ike ịpụta ọka n’ozuzu, n’ihe atụ a ọka wit bụ ihe e ji atụnyere igbogbo ọka, ma ọ na-eme ka ọdịiche ahụ doo anya.
- source_word: ἀποθήκην
  choice: ụlọ nkwakọba ihe
  rationale: Ọ na-ezo n’ozuzu ya n’ebe a na-edebe ihe ubi, na-enweghị ịkọwapụta ụdị ụlọ karịa ihe ederede kwuru.
- source_word: ἄχυρον
  choice: igbogbo ọka
  rationale: N’ihe gbasara ifecha ọka, nke a bụ ihe efu a na-ekewapụ n’ebe mkpụrụ ọka dị; ọ dabara karịa “ahịhịa ọka.”
- source_word: κατακαύσει
  choice: ga-eji ... gbaa ọkụ
  rationale: Nkebiokwu Igbo a na-egosi ime ka ihe ree ọkụ; ọnọdụ okwu na onyinyo ahụ na-ebukwa echiche nke irechapụ.
- source_word: πυρὶ ἀσβέστῳ
  choice: ọkụ a na-apụghị imenyụ emenyụ
  rationale: Nke a na-egosi ọkụ nke mmadụ na-apụghị imenyụ, ma na-edobe ike nke onyinyo ikpe ahụ.
- source_word: οὗ
  choice: dị ya / ya
  rationale: Nnọchiaha nke nwe na-akọwa Onye ahụ na-abịa; iji “ya” eme ihe n’Igbo na-edobe njikọ ahụ n’ụzọ ebumpụta ụwa.
theological_decisions:
- issue: Onyinyo ikpe na nkewa n’ihe atụ ọrụ ugbo
  choice: E debere nkewa doro anya n’etiti ọka wit a na-achịkọta na igbogbo ọka a na-agba ọkụ.
  alternative: Ịkọwa ya kpọmkwem dị ka naanị ikpe nwa oge n’ahụ Izrel, ma ọ bụ tinye ozizi zuru ezu banyere ọnọdụ ikpe ikpeazụ.
  rationale: Amaokwu ahụ n’onwe ya na-egosi nzọpụta na ikpe site n’ịchịkọta ọka na ịgba igbogbo ọkụ. Nsụgharị ahụ anaghị ebelata “ọkụ a na-apụghị imenyụ emenyụ,” ma ọ naghị agbakwunye nkọwa usoro ozizi nke ederede ahụ na-ekwughị.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. A kọwara ngwa ọrụ ifecha ọka kama iji okwu ochie ma ọ bụ okwu nwere ike ghara ido ọtụtụ ndị anya. E debere usoro ahịrịokwu na onyinyo ọrụ ugbo ahụ n’ụzọ dị nso n’asụsụ Grik ma bụrụkwa Igbo ebumpụta ụwa.
