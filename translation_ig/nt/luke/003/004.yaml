id: LUK.3.4
reference: Luke 3:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ig
  text: 'dị ka e dere n’akwụkwọ nke okwu Aịzaya onye amụma, sị:


    “Olu onye na-eti mkpu n’ọzara[a]:


    ‘Kwadebenụ ụzọ Onyenwe anyị[b];


    meenụ ka ụzọ nta ya kwụ ọtọ.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịghọta ya dịka: “Olu onye na-eti mkpu, ‘N’ọzara, kwadebenụ ụzọ Onyenwe anyị.’”'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ONYENWE ANYỊ.” Okwu a na-emegharị Aịzaya 40:3, ebe ihe odide Hibru nwere aha Chineke YHWH.
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: e dere
  rationale: Nke a bụ ụzọ Igbo dị mfe ma dị ùgwù si akọ usoro passive e ji ewebata ihe e dere n’Akwụkwọ Nsọ; ọ na-egosikwa na ihe ahụ e dere ka dị irè.
- source_word: βίβλῳ λόγων
  choice: n’akwụkwọ nke okwu
  rationale: A hapụrụ ma ‘akwụkwọ’ ma ‘okwu’ dịka ha dị n’asụsụ Grik, n’agbanyeghị na ihe e ji ede akwụkwọ n’oge ahụ nwere ike ịbụ akwụkwọ mpịakọta.
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: Aịzaya onye amụma
  rationale: Nke a na-akọwapụta Aịzaya n’ụzọ Igbo na-aga were were ma na-edebe aha ọrụ ya.
- source_word: Φωνὴ βοῶντος
  choice: Olu onye na-eti mkpu
  rationale: Ọ na-edebe usoro nke na-ekwu maka olu nke otu onye na-eti mkpu, ma bụrụkwa Igbo nkịtị doro anya.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ọzara
  rationale: ‘Ọzara’ na-egosi ebe tọgbọrọ n’efu nke okwu amụma ahụ na ebe Jọn nọ; e jikọtara ya na ‘na-eti mkpu’ n’ahịrị isi, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ e nwere ike isi ghọta njikọ ahụ.
- source_word: Ἑτοιμάσατε
  choice: Kwadebeenụ
  rationale: E debere ya dịka iwu e nyere ọtụtụ mmadụ, dị ka ụdị ngwaa Grik si dị.
- source_word: τὴν ὁδὸν κυρίου
  choice: ụzọ Onyenwe anyị
  rationale: Ọ na-edebe ihe atụ nke ịkwadebe ụzọ maka ọbịbịa Onyenwe anyị.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-aghọta nke ọma maka κύριος; ndabere aha Chineke YHWH dị n’Aịzaya ka e gosiri na nkọwa ala peeji kama ịgbanwe ihe odide Grik n’ahịrị isi.
- source_word: εὐθείας ποιεῖτε
  choice: meenụ ka ... kwụ ọtọ
  rationale: Ọ bụ usoro Igbo ebumpụta ụwa nke na-edebe ike iwu ahụ na echiche ime ka ụzọ ghara ịgbagọ.
- source_word: τὰς τρίβους αὐτοῦ
  choice: ụzọ nta ya
  rationale: ‘Ụzọ nta’ na-egosi τρίβοι dịka ụzọ ndị a na-aga, ma na-echekwa ọdịiche ya na ὁδός, ‘ụzọ,’ dị n’ahịrị bu ya ụzọ.
theological_decisions:
- issue: Otu e si asụgharị κύριος n’okwu e hotara n’Aịzaya, ebe Hibru mbụ nwere aha Chineke YHWH
  choice: Onyenwe anyị
  alternative: ONYENWE ANYỊ (YHWH)
  rationale: Ihe odide Grik Luk ji bụ κύριος, ya mere ahịrị isi soro ya jiri aha nsọpụrụ ‘Onyenwe anyị.’ Nkọwa ala peeji na-echekwa njikọ ya na aha Chineke YHWH n’Aịzaya, n’emeghị ka nsụgharị ahụ kpebie ihe karịrị ihe odide ahụ.
- issue: Ihe n’ọzara jikọtara ya na ya n’usoro ahịrịokwu
  choice: onye na-eti mkpu n’ọzara
  alternative: N’ọzara, kwadebeenụ ụzọ Onyenwe anyị
  rationale: Enwere ike ijikọ ἐν τῇ ἐρήμῳ na mkpu onye ahụ ma ọ bụ na iwu na-esochi ya. Ahịrị isi họọrọ njikọ nke mbụ, nke kwekọrọ n’usoro okwu Luk, ma nkọwa ala peeji hapụrụ nke ọzọ ka ọ dị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ụda okwu amụma ahụ, iwu ndị dị n’ụdị ọtụtụ mmadụ, na ihe atụ nke ịkwadebe ụzọ. Akara nkọwa [a] na [b] dị n’ahịrị isi n’ebe ha metụtara kpọmkwem.
