  text: καὶ ὄψεται πᾶσα σὰρξ τὸ σωτήριον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/006.yaml
  text: and all flesh will see the salvation of God[a][b].
translation:
  language: ig
  text: anụ ahụ niile ga-ahụkwa nzọpụta nke Chineke[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ mmadụ niile.” N'okwu Grik, e kwuru ya kpọmkwem dịka “anụ ahụ niile,” nke na-ekwughachi Aịzaya 40:5 ma na-ezo aka n'ebe a n'ụmụ mmadụ niile.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nzọpụta si n'aka Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψεται
  choice: ga-ahụ
  rationale: Ọ bụ ọdịnihu nke ὁράω ma nwee nghọta nkịtị nke ịhụ; “ga-ahụ” bụ Igbo doro anya ma na-edobe ihe oyiyi anya dị n'okwu Grik.
- source_word: πᾶσα σὰρξ
  choice: anụ ahụ niile
  rationale: A hapụrụ akpaalaokwu amụma ahụ n'ụzọ nkịtị iji debe njikọ ya na Aịzaya 40:5; n'ebe a ọ na-ezo aka n'ụmụ mmadụ niile, nke e mere ka o doo anya na nkọwa ala peeji.
- source_word: σωτήριον
  choice: nzọpụta
  rationale: E ji okwu ahụ mee aha n'okwu Grik; “nzọpụta” na-edobe ma ndabere Aịzaya ma obosara ọrụ nzọpụta Chineke.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: Nke a na-edobe usoro genitive nke Grik ma hapụ ohere nghọta nke ihe bụ nke Chineke ma ọ bụ nke si n'aka ya bịa.
theological_decisions:
- issue: Ihe akpaalaokwu πᾶσα σὰρξ pụtara
  choice: Ọ na-ezo aka n'ụmụ mmadụ niile, ma e debere “anụ ahụ niile” n'isiokwu.
  alternative: Ịsụgharị ya ozugbo dịka “ụmụ mmadụ niile.”
  rationale: N'ọnọdụ a, ọ bụ nkwughachi okwu Aịzaya nke nwere obosara gbasara mmadụ niile. Nsụgharị nkịtị na-echekwa njikọ Akwụkwọ Nsọ na esemokwu asụsụ ahụ, ebe nkọwa ala peeji na-akọwa ihe ọ pụtara.
- issue: Ọrụ genitive na τοῦ θεοῦ
  choice: “nke Chineke,” nke na-edobe nghọta Grik sara mbara.
  alternative: “si n'aka Chineke,” nke na-akọwa ya dịka isi mmalite.
  rationale: Genitive ahụ nwere ike igosi njikọ ma ọ bụ isi mmalite; isiokwu ekwesịghị imechi nghọta ahụ n'otu ụzọ naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “anụ ahụ niile” iji debe akpaalaokwu amụma na njikọ ya na Aịzaya, ebe nkọwa ala peeji na-eme ka nghọta ya banyere mmadụ niile doo anya.
