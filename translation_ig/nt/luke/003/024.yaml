  source_fidelity: 'Ederede ahụ na-egosipụta n''ụzọ kwesịrị ekwesị usoro mkpụrụokwu Grik τοῦ ... τοῦ ...; itinye “nwa” na-eme ka mmekọrịta a hapụrụ n''okwu Grik pụta ìhè n''enweghị mgbakwunye ihe ọzọ. Aha ndị ahụ na-agbaso usoro ha na SBLGNT: Matat, Livai, Melki, Janai, Josef.'
  naturalness: “nwa Matat, nwa Livai, nwa Melki, nwa Janai, nwa Josef,” bụ usoro dị mkpirikpi, doo anya, ma bụrụkwa nke e kere eke n'Igbo Izugbe maka usoro ọmụmụ.
  terminology: Ojiji “nwa” dabara n'usoro ọmụmụ a. Nsụgharị na mkpoputa aha ndị mmadụ dị mma ma na-agụ nke ọma n'Igbo. Ihe odide ala peeji ahụ na-akọwa nhọrọ genitive ahụ n'ụzọ ziri ezi.
