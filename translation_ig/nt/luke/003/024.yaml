  text: τοῦ Μαθθὰτ τοῦ Λευὶ τοῦ Μελχὶ τοῦ Ἰανναὶ τοῦ Ἰωσὴφ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/024.yaml
  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: ig
  text: nwa Matat[a], nwa Livai, nwa Melki, nwa Janai, nwa Josef,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n''ụdị na-esochi Grik anya karị: “nke Matat, nke Livai, nke Melki, nke Janai, nke Josef.” Grik gara n''ihu n''usoro ọmụmụ site n''iji genitive mee ihe ugboro ugboro, ebe ihe gbara ya gburugburu na-egosi na a ghaghị ịghọta “nwa” n''ebe nke ọ bụla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N'usoro ọmụmụ a, mkpụrụokwu τοῦ a na-emegharị emegharị bụ genitive e ji hapụ okwu mmekọrịta ahụ n'ezoghị ọnụ; ihe gbara amaokwu a gburugburu na-egosi na ihe a pụtara bụ ‘nwa.’ Iji ‘nwa’ mee ya n'Igbo na-eme ka usoro ahụ doo anya ma ghara ịgbakwunye echiche ọzọ.
- source_word: Μαθθὰτ
  choice: Matat
  rationale: E dere aha mmadụ a n'ụdị dabara n'usoro mkpọpụta na ide aha n'Igbo.
- source_word: Λευὶ
  choice: Livai
  rationale: Ụdị ‘Livai’ na-egosipụta mkpọpụta aha Grik ahụ n'ụzọ dị mfe nye ndị na-agụ Igbo.
- source_word: Μελχὶ
  choice: Melki
  rationale: A sụgharịghị aha mmadụ ahụ; e dere ya dịka mkpọpụta ya si dị n'Igbo.
- source_word: Ἰανναὶ
  choice: Janai
  rationale: Ụdị ‘Janai’ na-anọ nso n'ụdị Grik Ἰανναί ma dị mfe ịgụ n'Igbo.
- source_word: Ἰωσὴφ
  choice: Josef
  rationale: E ji ụdị aha a na-agụ nke ọma n'Igbo mee nnọchi anya Ἰωσήφ.
theological_decisions:
- issue: Mwepụ okwu n'usoro ọmụmụ
  choice: Itinye ‘nwa’ n'ihu aha nke ọ bụla
  alternative: 'Ịhapụ ya dịka usoro genitive nkịtị: ‘nke Matat, nke Livai, nke Melki, nke Janai, nke Josef’'
  rationale: Grik na-aga n'ihu n'usoro ọmụmụ Luk ma na-adabere n'echiche mmekọrịta nna na nwa nke akụkụ gbara ya gburugburu gosipụtara. Itinye ‘nwa’ na-eme ka Igbo doo anya n'emebighị nghọta ma ọ bụ esemokwu ọ bụla dị n'ederede.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta dị mkpirikpi nke amaokwu Grik, ma tinye ‘nwa’ iji mee ka mmekọrịta usoro ọmụmụ pụta ìhè.
