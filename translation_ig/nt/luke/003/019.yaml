  source_fidelity: A chọrọ imezi ntụgharị nke ἐλεγχόμενος. «mgbe ọ na-abara ya mba» na-eme ka Herọd bụrụ onye na-abara onye ọzọ mba, ebe Grik kwuru na ọ bụ Herọd ka a na-abara mba site n'aka ya. «mgbe ọ na-anata mba n'aka ya» na-edobe olu pasiv na nnọchiaha abụọ ahụ. Aha τετραάρχης ekwesịghị ịkọwa n’ahịrị isi dịka onye na-achị kpọmkwem otu ụzọ n’ime akụkụ anọ, n’ihi na nke a bụ aha ọkwa ọchịchị akụkọ ihe mere eme nke e ji mee ihe n’ụzọ sara mbara.
