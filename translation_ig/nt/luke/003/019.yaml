  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: ig
  text: Ma Herọd, onye tetraak[a], mgbe ọ na-anata mba n'aka ya banyere Herọdias, nwunye nwanne ya nwoke, nakwa banyere ihe ọjọọ niile Herọd mere,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Tetraak» bụ aha ọkwa ọchịchị. Na mbụ, ọ pụtara onye na-achị otu ụzọ n’ime akụkụ anọ; ma n’oge e mesịrị, a na-ejikwa ya akpọ onye na-achị mpaghara.
    reason: historical-cultural clarification
lexical_decisions:
- source_word: τετραάρχης
  choice: onye na-achị otu akụkụ anọ
  rationale: A sụgharịrị aha ọkwa ọchịchị ahụ n'ụzọ ga-enyere onye Igbo nke oge a aka ịghọta ya, kama iji mkpụrụokwu Gris a na-amaghịkarị; ọ na-ejigide echiche nke onye ọchịchị e kenyere otu akụkụ.
- source_word: ἐλεγχόμενος
  choice: mgbe ọ na-abara ya mba
  rationale: Nkebi a na-egosi na Jọn nọ na-akatọ Herọd n'ụzọ metụtara omume ọjọọ ya; ‘ịbara mba’ na-egosipụta ike nke ịdọ aka ná ntị na ịkatọ omume.
- source_word: ὑπ’ αὐτοῦ
  choice: ọ ... ya
  rationale: E debere nnọchiaha dị ka ọ dị na Gris, n’agbanyeghị na ihe gbara amaokwu ahụ gburugburu na-egosi na onye ahụ bụ Jọn.
- source_word: περὶ Ἡρῳδιάδος
  choice: banyere Herọdias
  rationale: ‘Banyere’ bụ ụzọ Igbo doro anya ma dị mma isi gosi περὶ, ma na-enyekwa ohere ikwughachi usoro ahụ n’akụkụ nke abụọ.
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: nwunye nwanne ya nwoke
  rationale: Nke a na-egosipụta njikọ nwe-nwunye dị na usoro genitive nke Gris ma na-ada ka Igbo nkịtị.
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: nakwa banyere ihe ọjọọ niile Herọd mere
  rationale: Nke a na-edobe nkwughachi περὶ ma na-egosi n'ụzọ sara mbara omume ọjọọ niile Herọd mere.
- source_word: πονηρῶν
  choice: ihe ọjọọ
  rationale: ‘Ihe ọjọọ’ bụ okwu Igbo doro anya, nke mmadụ niile na-aghọta, ma na-edobe ụdị ọtụtụ nke okwu Gris ahụ.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi ntụgharị na ọdịiche akụkọ a na ihe e kwuru tupu ya.
theological_decisions:
- issue: Ike omume dị n’ịkatọ Herọd
  choice: A sụgharịrị ἐλεγχόμενος dịka ‘mgbe ọ na-abara ya mba.’
  alternative: ‘mgbe ọ na-adọ ya aka ná ntị’ ma ọ bụ ‘mgbe ọ na-ekpughe ihe ọjọọ ya’
  rationale: Nhọrọ ahụ na-edobe ịkatọ omume nke onye amụma n’enweghị ịgbakwụnye nkọwa iwu ma ọ bụ ozizi okpukpe nke ederede ahụ ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A kọwara aha ọkwa ọchịchị ahụ n’ahịrị, tinyekwa nkọwa ụkwụ iji chekwaa nkọwa akụkọ ihe mere eme. E debere amaokwu ahụ dịka nkebi ahịrịokwu na-aga n’ihu ruo amaokwu 20, dịka usoro sintaksis Gris si dị.
