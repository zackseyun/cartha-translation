    text: Ma ọ bụ, “ị na-atọ m ụtọ.”
    reason: lexical_alternative
  revision_rationale: The revision removes the unintended firstborn sense, represents the aorist εὐδόκησα with the natural completed expression “obi tọrọ m ụtọ,” and retains a concise present-state alternative in the footnote for comparison with the English audit trail. It preserves the source’s bodily manifestation and dove simile without doctrinal expansion.
