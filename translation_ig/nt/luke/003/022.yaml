id: LUK.3.22
reference: Luke 3:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: ig
  text: 'Mmụọ Nsọ wee rịdata n’elu ya n’ụdị anụ ahụ, dịka nduru; olu wee si n’eluigwe bịa, sị: “Ị bụ Nwa m nwoke, onye m hụrụ n’anya; n’ime gị ka obi tọrọ m ụtọ.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ị na-atọ m ụtọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβῆναι
  choice: rịdata
  rationale: Okwu a na-egosi i si n’elu gbadata; “rịdata” bụ okwu Igbo doro anya ma kwekọọ n’usoro akụkọ a.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Mmụọ Nsọ
  rationale: Nke a bụ aha a na-ejikarị eme ihe n’Igbo ugbu a maka Holy Spirit, ma ọ na-edobe ịdị nsọ na njirimara Mmụọ ahụ.
- source_word: σωματικῷ εἴδει
  choice: n’ọdịdị anụ ahụ
  rationale: Ọ na-egosi ọdịdị a pụrụ ịhụ nke yiri ihe nwere ahụ, n’enweghị ịsị na Mmụọ ahụ ghọrọ anụ ahụ n’ụzọ ontological.
- source_word: ὡς περιστερὰν
  choice: dịka nduru
  rationale: “Dịka” na-edobe ntụnyere nke ὡς, ya mere ọ naghị ekwu na Mmụọ Nsọ ghọrọ nduru n’ezie.
- source_word: ἐπ’ αὐτόν
  choice: n’ahụ́ ya
  rationale: Nke a na-egosi na mgbadata ahụ bịakwasịrị Jizọs; okwu ahụ bụ nke mmadụ Igbo na-aghọta ngwa ngwa.
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: olu wee si n’eluigwe bịa
  rationale: Nke a na-enye okwu omume γενέσθαι n’ụzọ Igbo dị mfe ma na-edobe na olu ahụ sitere n’eluigwe.
- source_word: Σὺ εἶ
  choice: Ị bụ
  rationale: Ọ bụ ntụgharị kpọmkwem na nke ebumpụta ụwa nke okwu a gwara Jizọs.
- source_word: ὁ υἱός μου
  choice: Ọkpara m
  rationale: “Ọkpara” bụ okwu Akwụkwọ Nsọ Igbo a maara nke ọma maka Son n’ọnọdụ a, ma na-egosi mmekọrịta pụrụ iche dị n’okwu Grik ahụ.
- source_word: ὁ ἀγαπητός
  choice: onye m hụrụ n’anya
  rationale: Nke a bụ ụzọ Igbo dị ndụ na nke doro anya isi kwuo na ọ bụ Onye a hụrụ n’anya.
- source_word: ἐν σοὶ εὐδόκησα
  choice: ị na-atọ m ụtọ nke ukwuu
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa isi kwupụta nnwapụta na obi ụtọ nke onye na-ekwu okwu nwere n’ebe Ọkpara ahụ nọ. Ihe odide ala peeji na-echekwa ọdịdị oge gara aga nke aorist εὐδόκησα.
theological_decisions:
- issue: Ụdị ngosipụta nke Mmụọ Nsọ
  choice: Mmụọ Nsọ rịdatara n’ọdịdị anụ ahụ dịka nduru.
  alternative: Mmụọ Nsọ rịdatara dịka nduru n’ezie ma ọ bụ ghọọ nduru.
  rationale: Njikọ σωματικῷ εἴδει na ὡς περιστερὰν na-ekwu maka ngosipụta a pụrụ ịhụ na ntụnyere. “Dịka nduru” na-edobe ntụnyere ahụ, ọ naghị etinye nkwupụta siri ike karịa ihe Grik kwuru.
- issue: Ike na oge nke εὐδόκησα
  choice: ị na-atọ m ụtọ nke ukwuu
  alternative: n’ime gị ka obi tọrọ m ụtọ
  rationale: Aorist Grik nwere ike igosi ihe e kwuru dịka ihe mere, ma n’okwu nkwupụta a, Igbo ebumpụta ụwa na-eji usoro ọnọdụ dị ugbu a ekwupụta nnabata na obi ụtọ na-adịgide. Ihe odide ala peeji na-edobe ụzọ ntụgharị nke na-egosi oge gara aga n’ụzọ pụtara ìhè.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. E debere ntụnyere “dịka nduru,” zere ikwu na Mmụọ Nsọ ghọrọ nduru n’ezie, ma tinye akara ihe odide ala peeji [a] ozugbo n’ebe ọ metụtara εὐδόκησα.
