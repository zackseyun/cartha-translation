revisions:
- from: 'Mmụọ Nsọ wee rịdata n’ahụ́ ya n’ọdịdị anụ ahụ dịka nduru, olu wee si n’eluigwe bịa, sị: “Ị bụ Ọkpara m, onye m hụrụ n’anya; ị na-atọ m ụtọ nke ukwuu.”[a]'
  to: 'Mmụọ Nsọ wee rịdata n’elu ya n’ụdị anụ ahụ, dịka nduru; olu wee si n’eluigwe bịa, sị: “Ị bụ Nwa m nwoke, onye m hụrụ n’anya; n’ime gị ka obi tọrọ m ụtọ.”[a]'
  rationale: The revision removes the unintended firstborn sense, represents the aorist εὐδόκησα with the natural completed expression “obi tọrọ m ụtọ,” and retains a concise present-state alternative in the footnote for comparison with the English audit trail. It preserves the source’s bodily manifestation and dove simile without doctrinal expansion.
  reviewer_model: gpt-5.6-terra
