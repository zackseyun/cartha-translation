  yaml_path: translation/nt/luke/003/027.yaml
  text: the son of Joanan[a], the son of Rhesa, the son of Zerubbabel, the son of Shealtiel, the son of Neri[b],
translation:
  language: ig
  text: nwa Joanan[a], nwa Resa, nwa Zerubabel, nwa Shealtiel[b], nwa Neri,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, a na-emeghachi artikel genitiv ahụ n’ihu aha ọ bụla; e tinyere “nwa” n’ihi usoro ọmụmụ ahụ ka mmekọrịta ahụ wee doo anya n’Igbo.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, aha ahụ bụ “Salatiel”; “Shealtiel” bụ ụdị aha Agba Ochie a na-ejikarị eme ya.
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N'usoro ọmụmụ a, τοῦ bụ njirimara genitive e ji mkpirikpi dochie mmekọrịta e kwuru n'amaokwu ndị gbara ya gburugburu. “Nwa” na-eme ka mmekọrịta ahụ doo anya n'Igbo nkịtị.
- source_word: Ἰωανὰν
  choice: Joanan
  rationale: E degharịrị aha Grik ahụ n'ụdị a na-amata nke ọma, n'ebughị ihe aha ahụ pụtara banye na nsụgharị.
- source_word: Ῥησὰ
  choice: Resa
  rationale: “Resa” bụ ndegharị aha ahụ kwekọrọ n'ụda Grik ma dị mfe ọgụgụ n'Igbo.
- source_word: Ζοροβαβὲλ
  choice: Zerubabel
  rationale: A họọrọ ụdị aha a maara n'Akwụkwọ Nsọ iji mee ka njikọ ya na onye a kpọrọ aha n'Agba Ochie pụta ìhè, ebe ọ ka na-anọchi anya aha Grik ahụ.
- source_word: Σαλαθιὴλ
  choice: Shealtiel
  rationale: Ọ bụ ezie na “Salatiel” ga-abụ ndegharị Grik kpọmkwem karị, “Shealtiel” bụ ụdị aha Agba Ochie a na-ejikarị amata otu onye ahụ.
- source_word: Νηρὶ
  choice: Neri
  rationale: A degharịrị aha Grik ahụ ozugbo n'ụdị dị mfe ma kwekọọ n'usoro ide aha n'Igbo.
theological_decisions:
- issue: Mwepụ okwu na usoro ọmụmụ
  choice: Tinye “nwa” n'ihu aha nke ọ bụla.
  alternative: Jiri “nke” kwughachi naanị ya n'ihu aha nke ọ bụla.
  rationale: Grik na-eji usoro genitive dị mkpirikpi n'ihi na mmekọrịta nna na nwa apụtaworị ìhè n'okwu gbara ya gburugburu. Ịtinye “nwa” na-asụgharị ihe syntax ahụ na-egosi n'Igbo doro anya, n'etinyeghị nkọwa okwukwe ọhụrụ.
translation_notes:
  register: Ejiri Igbo ọkọlọtọ nke dị ugbu a, dị ugwu ma dị mfe nghọta. E debere usoro ndepụta aha nke amaokwu ahụ, ma jiri “nwa” kwughachi mmekọrịta ahụ dịka Igbo nkịtị si achọ. Akara nkọwa [b] dị n'akụkụ “Shealtiel,” bụ́ okwu nkọwa ahụ metụtara.
