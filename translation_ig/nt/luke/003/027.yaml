  naturalness: “nwa Joanan, nwa Resa ...” is concise, natural, and appropriately formal for an Igbo genealogy. Repetition of “nwa” clearly conveys the implied relationship.
  terminology: The name forms Joanan, Resa, Zerubabel, Shealtiel, and Neri are consistent and readable. The note on Shealtiel should state the traditional name correspondence without asserting more than the form-based/canonical association requires.
