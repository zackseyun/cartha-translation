  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: ig
  text: Ọ zara ha sị, “Onye nwere uwe abụọ[a], ka o nye onye na-enweghị uwe otu n’ime ha; onye nwere nri, ka o meekwa otu ahụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a na-ekwu maka chitọn, ya bụ uwe bụ isi a na-eyi n’ahụ; a pụrụ ịkpọ ya tunik.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: Ọ zara ha, sị
  rationale: Nke a na-egosipụta azịza Jọn na okwu ọ gwara ha n’ụzọ Igbo dị nfe ma dị ndụ; δέ bụ njikọ dị nro nke na-achọghị ka e mesie ya ike iche.
- source_word: Ὁ ἔχων
  choice: Onye nwere / onye nwerekwa
  rationale: Okwu a na-ekwu maka onye ọ bụla n’ozuzu ya. Nhọrọ a na-edobe otu onye nnọchianya n’enweghị ikwupụta nwoke naanị.
- source_word: δύο χιτῶνας
  choice: uwe ime abụọ[a]
  rationale: χιτών bụ uwe bụ isi a na-eyi n’ahụ, ọ bụghị kpọmkwem uwe elu ma ọ bụ jaket nke oge a. “Uwe ime” bụ nkọwa Igbo ga-enyere onye na-agụ ya aka, ebe nkọwa ala peeji na-akọwa ọdịbendị ya.
- source_word: μεταδότω
  choice: ga-ekenye ... otu
  rationale: Imperative onye nke atọ nwere ike iwu siri ike. N’Igbo, “ga-ekenye” n’okwu iwu a na-ebuga mkpa ime ihe ahụ, ebe ịtinye “otu” na-eme ka ihe a ga-enye doo anya.
- source_word: τῷ μὴ ἔχοντι
  choice: onye na-enweghị nke ọ bụla
  rationale: A na-eweghachite ihe a na-ekwu maka ya, ya bụ uwe ahụ, site n’okwu gbara ya gburugburu, ma na-edobe echiche nke onye na-enweghị ya ma ọlị.
- source_word: βρώματα
  choice: nri
  rationale: βρώματα bụ okwu sara mbara maka ihe oriri; “nri” bụ okwu Igbo nkịtị ma ziri ezi.
- source_word: ὁμοίως ποιείτω
  choice: ga-emekwa otu ahụ
  rationale: Nke a na-agbatị otu iwu ahụ ruo n’ebe onye nwere nri nọ ma na-edobe ntụnyere dị n’etiti ahịrịokwu abụọ ahụ.
theological_decisions:
- issue: Otu onye nnọchianya na okike onye ahụ
  choice: Onye nwere ... onye nwekwara
  alternative: Nwoke nwere ... nwoke nwekwara
  rationale: Participle ndị Grik bụ masculine singular n’usoro ụtọasụsụ, ma ihe ha pụtara bụ onye ọ bụla. “Onye” na-edobe singular ahụ ma ghara ime ka iwu ahụ yie nke metụtara naanị ụmụ nwoke.
- issue: Ike iwu dị na μεταδότω na ποιείτω
  choice: ga-ekenye ... ga-emekwa
  alternative: ka o kenye ... ka o meekwa
  rationale: N’okwu ndụmọdụ a, ụdị “ga-” na Igbo nwere ike igosi ihe a chọrọ n’ụzọ kwụ ọtọ. Ọ naghị eme ka okwu ahụ bụrụ naanị amụma banyere ọdịnihu, n’ihi ọnọdụ okwu iwu gbara ya gburugburu.
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwụ ọtọ ma dị ùgwù. E jiri “onye” mee ka iwu ahụ gbasaa onye ọ bụla, ma zere okwu ochie ma ọ bụ nke otu ụka pụrụ iche.
