    text: Okwu Grik a na-ekwu maka chitọn, ya bụ uwe bụ isi a na-eyi n’ahụ; a pụrụ ịkpọ ya tunik.
    reason: cultural_note
  revision_rationale: The revision avoids the misleading modern sense of “uwe ime,” preserves the generic singular, makes explicit that one of the two garments is to be given to the person without one, and uses direct Igbo imperative phrasing. The cultural note supplies the historical clothing detail without overloading the verse.
