- from: Ọ zara ha, sị, “Onye nwere uwe ime abụọ[a] ga-ekenye onye na-enweghị nke ọ bụla otu; onye nwekwara nri ga-emekwa otu ahụ.”
  to: Ọ zara ha sị, “Onye nwere uwe abụọ[a], ka o nye onye na-enweghị uwe otu n’ime ha; onye nwere nri, ka o meekwa otu ahụ.”
  rationale: The revision avoids the misleading modern sense of “uwe ime,” preserves the generic singular, makes explicit that one of the two garments is to be given to the person without one, and uses direct Igbo imperative phrasing. The cultural note supplies the historical clothing detail without overloading the verse.
