  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: ig
  text: nwa Jekọb, nwa Aịzik, nwa Ebreham, nwa Tera[a], nwa Neho[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Grik nwere “Thara”; e dere “Tera” ka o kwekọọ n’ụdị aha Agba Ochie a maara nke ọma.
    reason: lexical_alternative
  - marker: b
    text: Grik nwere “Nachor”; e dere “Neho” ka o kwekọọ n’ụdị aha Agba Ochie a maara nke ọma.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N’usoro agbụrụ a, τοῦ na aha onye nọ na genitiv na-egosi njikọ nna na nwa nke e kwuru n'ụzọ mkpirikpi. Igbo na-achọ ka e tinye “nwa” iji mee ka njikọ ahụ doo anya.
- source_word: Ἰακώβ
  choice: Jekọb
  rationale: Ụdị aha a na-ahụkarị n’Igbo maka nna ochie ahụ.
- source_word: Ἰσαάκ
  choice: Aịzik
  rationale: Ụdị aha a maara nke ọma n’Igbo maka Aịzik.
- source_word: Ἀβραάμ
  choice: Ebreham
  rationale: Ụdị aha nna ochie ahụ a maara nke ọma n’Igbo.
- source_word: Θάρα
  choice: Tera
  rationale: A họọrọ ụdị aha Agba Ochie a maara nke ọma kama idepụta kpọmkwem ụdị Grik Θάρα.
- source_word: Ναχώρ
  choice: Neho
  rationale: A họọrọ ụdị aha Agba Ochie a maara nke ọma n’Igbo kama idepụta kpọmkwem ụdị Grik Ναχώρ.
theological_decisions:
- issue: Ime ka njikọ nwa na nna pụta ìhè n’usoro agbụrụ e dere n'ụzọ mkpirikpi
  choice: Ịsụgharị njikọ genitiv ọ bụla dị ka “nwa”
  alternative: Ịhapụ naanị usoro aha ndị nwere njikọ “nke”
  rationale: Grik hapụrụ okwu na-akọwa njikọ ahụ n’ihi usoro amaokwu ndị gbara ya gburugburu. “Nwa” na-eme ka ebumnuche usoro agbụrụ ahụ doo anya n’Igbo n’enweghị itinye ozizi ọhụrụ.
translation_notes:
  register: Asụsụ Igbo izugbe, dị mfe ma dị ùgwù. E jiri usoro mkpirikpi “nwa X” mee ka amaokwu ahụ bụrụ ihe a na-agụ n’ụzọ nkịtị, ma debeghachi usoro njikọ agbụrụ nke Grik.
