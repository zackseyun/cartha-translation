revisions:
- from: A ga-emejupụta ndagwurugwu niile[a], a ga-eweda ugwu ukwu na ugwu nta niile ala; a ga-eme ka ebe ndị gbagọrọ agbagọ guzozie[b], meekwa ka ụzọ ndị siri ike ghọọ okporo ụzọ ndị dị larịị.
  to: A ga-ejupụta ndagwurugwu niile[a], a ga-eweda ugwu ukwu niile na ugwu nta niile ala; ebe ndị gbagọrọ agbagọ ga-adị kwụ ọtọ[b], ụzọ ndị tara akpụ ga-aghọ ụzọ dị larịị.
  rationale: The revision corrects the physical sense of “rough,” makes the distributive scope of “every” explicit, and improves the alternative footnote’s fidelity. It retains the Greek’s concrete prophetic terrain and road imagery, its future orientation, and its ambiguity without adding theological interpretation.
