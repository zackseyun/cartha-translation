source:
  edition: SBLGNT
  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: ig
  text: A ga-ejupụta ndagwurugwu niile[a], a ga-eweda ugwu ukwu niile na ugwu nta niile ala; ebe ndị gbagọrọ agbagọ ga-adị kwụ ọtọ[b], ụzọ ndị tara akpụ ga-aghọ ụzọ dị larịị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A ga-ejupụta ndagwurugwu miri emi niile ... ihe ndị gbagọrọ agbagọ ga-adị kwụ ọtọ, ụzọ ndị tara akpụ ga-aghọ ụzọ dị larịị.”
    reason: lexical_alternative
  - marker: b
    text: Nkebi ahịrịokwu a na-ekwughachi Aịzaya 40:4, na-eji onyonyo ịrụ na idozi ụzọ akọwa nkwadebe ụzọ nke Onyenwe anyị.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: ndagwurugwu niile
  rationale: “Ndagwurugwu” na-egosi ala dị omimi n’etiti ugwu ma kwekọọ n’onyonyo a nke ime ka ala dị larịị; “niile” na-ebupụta πᾶσα.
- source_word: πληρωθήσεται
  choice: a ga-emejupụta
  rationale: Nke a na-edobe ọdịdị ihe a ga-eme (future passive) na echiche nke ijuputa ala dị omimi.
- source_word: πᾶν ὄρος καὶ βουνός
  choice: ugwu ukwu na ugwu nta niile
  rationale: A na-edobe aha abụọ ahụ dị n’asụsụ Grik, na-egosi ma ugwu dị elu ma nke nta.
- source_word: ταπεινωθήσεται
  choice: a ga-eweda ... ala
  rationale: N’ọnọdụ a, okwu ahụ pụtara iweda ala dị elu, ma ọ ka na-edobe ụda amụma nke okwu ahụ.
- source_word: τὰ σκολιά
  choice: ebe ndị gbagọrọ agbagọ
  rationale: Adjective ahụ nọchiri aha; “ebe” anaghị akọwapụta ya gabiga ókè, ma na-eme ka onyonyo ala na ụzọ doo anya.
- source_word: εἰς εὐθείαν
  choice: guzozie
  rationale: Okwu a na-egosi mgbanwe site n’ihe gbagọrọ agbagọ ruo n’ihe kwụ ọtọ; “guzozie” bụ okwu Igbo doro anya n’onyonyo ụzọ.
- source_word: αἱ τραχεῖαι
  choice: ụzọ ndị siri ike
  rationale: Feminine plural adjective a yiri ka ọ hapụrụ aha “ụzọ” n’uche; nhọrọ a na-egosi ụzọ jupụtara n’ihe mgbochi ma ọ bụ nke na-adịghị mma ije.
- source_word: εἰς ὁδοὺς λείας
  choice: ghọọ okporo ụzọ ndị dị larịị
  rationale: ὁδούς bụ ụzọ n’ezie, λείας bụ ndị dị ire ụtọ ma ọ bụ larịị; “okporo ụzọ ndị dị larịị” na-adaba n’onyonyo idozi ụzọ.
theological_decisions:
- issue: Onyonyo amụma banyere ala na idozi ụzọ sitere n’Aịzaya 40:4
  choice: Idobe okwu ndị na-akọwa ndagwurugwu, ugwu, na ụzọ n’ụzọ a na-ahụ anya
  alternative: Ịkọwa ya ozugbo dị ka iweli ndị e wedara ala na iweda ndị mpako
  rationale: Amaokwu ahụ n’onwe ya ji onyonyo idozi ala na ụzọ kwadebe ụzọ Onyenwe anyị. Idobe onyonyo ahụ na-ezere itinye nkọwa ime mmụọ n’ime ederede ahụ n’onwe ya.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ùgwù. Ahịrịokwu ahụ na-edobe usoro uri na onyonyo ala nke Grik, ma jiri “a ga-” chekwaa ọdịdị ihe ndị a ga-eme. E tinyere akara ndetu [a] na [b] n’ederede.
