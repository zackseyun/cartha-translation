source:
  edition: SBLGNT
  text: Καὶ ἐπηρώτων αὐτὸν οἱ ὄχλοι λέγοντες· Τί οὖν ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/010.yaml
  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: ig
  text: Ìgwè mmadụ ahụ nọgidere na-ajụ ya, sị, “Gịnịzi ka anyị ga-eme[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Gịnịzi ka anyị kwesịrị ime?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτων
  choice: nọgidere na-ajụ
  rationale: Oge imperfect na-egosi omume gara n’ihu ma ọ bụ nke e mere ugboro ugboro; okwu a na-egosipụta na ha nọ na-ajụ ya.
- source_word: οἱ ὄχλοι
  choice: Ìgwè mmadụ ahụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji akọwa ọtụtụ mmadụ gbakọrọ ọnụ; ọ bụ ezie na okwu Grik dị n’ụdị ọtụtụ, Igbo na-ejikarị aha mkpokọta a ekwu otu echiche ahụ n’enweghị arọ okwu.
- source_word: λέγοντες
  choice: sị
  rationale: “Sị” na-ewebata ihe ha kwuru n’ụzọ Igbo sitere n’okike ma na-edobe njikọ participle ahụ n’enweghị ikwughachi okwu na-adịghị mkpa.
- source_word: Τί οὖν
  choice: Gịnịzi
  rationale: Mgbakwunye “-zi” na-egosi nkwubi okwu sitere n’ihe Jọn kwuru tupu nke a, dịka οὖν si arụ ọrụ n’amaokwu Grik.
- source_word: ποιήσωμεν
  choice: ka anyị ga-eme
  rationale: 'N’ajụjụ a, aorist subjunctive bụ deliberative: ndị mmadụ na-ajụ ihe ha ga-eme dịka nzaghachi bara uru. Nke a bụ ụzọ Igbo doro anya ma bụrụ nke sitere n’okike, ebe ndetu na-echekwa nhọrọ nke na-akọwapụta ‘should’ karịa.'
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu, mee ntụgharị a. “Nọgidere na-ajụ” na-echekwa omume na-aga n’ihu nke imperfect, ebe “Gịnịzi” na-eme ka njikọ echiche nke οὖν pụta ìhè.
