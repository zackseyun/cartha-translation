review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ approximate age and preserves the restraint of ἀρχόμενος by not adding “ministry.” However, the opening temporal clause omits the narrative connective Καὶ, and the second sentence’s wording can momentarily make “nwa Heli” sound like a second direct predicate of Jesus rather than continuing the genealogy through Joseph.
  naturalness: The Igbo is generally clear and modern. Recasting the opening as a single sentence with “Ma” better maintains narrative flow, and placing the public-assumption qualification directly after “Josef” is more natural and unambiguous in a genealogical statement.
  terminology: “Jizọs n’onwe ya,” “ihe dị ka afọ iri atọ,” “Josef,” and “Heli” are suitable Standard Igbo forms. “Dị ka e chere” appropriately conveys ὡς ἐνομίζετο without asserting biological paternity. The genealogical relation should be phrased so that Heli is explicitly Joseph’s father in the chain, while retaining the source’s compact style.
  issues:
  - severity: medium
    issue: Καὶ is not represented in the main text.
    rationale: Although Igbo may sometimes leave Greek connectives implicit, this is a straightforward narrative continuation and “Ma” preserves it naturally without burdening the sentence.
  - severity: medium
    issue: “ọ bụ nwa Josef, nwa Heli” is structurally ambiguous in Igbo.
    rationale: It can be heard as saying that Jesus is both Joseph’s and Heli’s son. The Greek genealogical chain identifies Joseph as being of Heli; “Josef, nwa Heli” makes that linkage clear without making a claim beyond the genealogy’s conventional elliptical syntax.
  revised_text: Ma Jizọs n’onwe ya, mgbe ọ malitere, dị ihe dị ka afọ iri atọ, bụrụ nwa Josef (dị ka e chere), Josef nwa Heli.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe ọ na-amalite.” Asụsụ Grik ekwughị kpọmkwem “ọrụ ozi ya,” ọ bụ ezie na ọnọdụ akụkọ ahụ na-egosi nke ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, ndị mmadụ na-ewere Jizọs dị ka nwa Josef.
    reason: alternative_reading
  - marker: c
    text: 'A pụkwara ịhazi nkebi a otú a: “Jizọs n’onwe ya dị ihe dị ka afọ iri atọ mgbe ọ malitere.”'
    reason: previous_rendering
  revision_rationale: The revision restores the narrative connective, retains the emphatic “Jizọs n’onwe ya,” and keeps ἀρχόμενος non-specific. It integrates the genealogical apposition into one sentence and attaches “dị ka e chere” directly to Joseph’s presumed paternity. “Josef nwa Heli” clarifies the intended progression of the genealogy while remaining concise and faithful to the Greek’s elliptical form. Footnote markers a and c remain anchored to “malitere” and the age expression respectively; marker b is anchored to the parenthetical qualification.
