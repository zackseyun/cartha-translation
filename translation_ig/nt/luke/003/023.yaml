  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: ig
  text: Ma Jizọs n’onwe ya, mgbe ọ malitere, dị ihe dị ka afọ iri atọ, bụrụ nwa Josef (dị ka e chere), Josef nwa Heli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Mgbe
  rationale: A naghị atụgharị njikọ Καὶ iche n’ebe a, n’ihi na Igbo na-amalite ahịrịokwu a n’ụzọ dị nro site na nkebi oge; njikọ akụkọ ahụ ka pụtara site n’usoro okwu.
- source_word: αὐτὸς Ἰησοῦς
  choice: Jizọs n’onwe ya
  rationale: “N’onwe ya” na-echekwa nkwusi ike dị na αὐτός ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: ἀρχόμενος
  choice: malitere
  rationale: Nke a na-egosi mmalite ihe Jizọs mere n’ihu ọha, ma etinyeghị “ọrụ ozi ya” n’ahịrịokwu bụ isi ebe ọ bụ na okwu ahụ adịghị kpọmkwem n’asụsụ Grik.
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: ihe dị ka afọ iri atọ
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi afọ ndụ na-abụghị ọnụ ọgụgụ a kapịrị ọnụ.
- source_word: ὡς ἐνομίζετο
  choice: Dị ka e chere
  rationale: Ọ na-echekwa echiche na ọ bụ otú ndị mmadụ si were ya, ọ bụghị nkwupụta doro anya banyere nna mụrụ ya.
- source_word: υἱός ... Ἰωσὴφ τοῦ Ἠλὶ
  choice: nwa Josef, nwa Heli
  rationale: “Nwa” bụ okwu ebumpụta ụwa n’usoro ọmụmụ Igbo. Ịhapụ ya n’usoro mkpirikpi a na-echekwa njikọ agbụrụ nke usoro genitiv Grik na-enweghị itinye nkọwa ọzọ.
theological_decisions:
- issue: Mmekọrịta okwu “dị ka e chere” na ịbụ Jizọs nwa Josef
  choice: E debere ya dị ka nkọwa na-egosi echiche ndị mmadụ banyere ịbụ ya nwa Josef.
  alternative: Ikwu ya n’enweghị nkọwa a, ma ọ bụ ikwu hoo haa na Josef abụghị nna mụrụ ya.
  rationale: 'Nke a na-echekwa esemokwu dị n’akụkọ Luk: a na-ewere Jizọs dị ka nwa Josef n’etiti mmadụ, ebe akụkọ gara aga ekwuola banyere ịtụrụ ime ya n’ụzọ pụrụ iche. A naghị agbakwunye ihe amaokwu a na-ekwughị.'
- issue: Ma a ga-etinye “ọrụ ozi ya” mgbe a sụgharịrị ἀρχόμενος
  choice: A sụgharịrị ya naanị “malitere.”
  alternative: “malitere ọrụ ozi ya.”
  rationale: Ọnọdụ akụkọ ahụ na-atụ aka ná mmalite ọrụ Jizọs n’ihu ọha, ma aha “ọrụ ozi” adịghị n’asụsụ Grik; ya mere a hapụrụ nkọwa ahụ n’ihe odide ala peeji.
- issue: Njikọ Heli na usoro ọmụmụ
  choice: E chekwara usoro ahụ dịka “nwa Josef, nwa Heli.”
  alternative: “Josef bụ nwa Heli.”
  rationale: Ụdị ahọrọ na-esochi usoro mkpirikpi nke Grik ma ghara ịkọwapụta karịa ihe owuwu usoro ọmụmụ ahụ n’onwe ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu na-agụ nke ọma n’Igbo, ebe a na-echekwa nkwusi ike nke αὐτός, enweghị aha kpọmkwem mgbe ἀρχόμενος gasịrị, na nkwụsị echiche dị na ὡς ἐνομίζετο.
