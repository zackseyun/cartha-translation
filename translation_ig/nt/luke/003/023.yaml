revisions:
- from: Mgbe Jizọs n’onwe ya malitere[a], ọ dị ihe dị ka afọ iri atọ[c]. Dị ka e chere[b], ọ bụ nwa Josef, nwa Heli.
  to: Ma Jizọs n’onwe ya, mgbe ọ malitere, dị ihe dị ka afọ iri atọ, bụrụ nwa Josef (dị ka e chere), Josef nwa Heli.
  rationale: The revision restores the narrative connective, retains the emphatic “Jizọs n’onwe ya,” and keeps ἀρχόμενος non-specific. It integrates the genealogical apposition into one sentence and attaches “dị ka e chere” directly to Joseph’s presumed paternity. “Josef nwa Heli” clarifies the intended progression of the genealogy while remaining concise and faithful to the Greek’s elliptical form. Footnote markers a and c remain anchored to “malitere” and the age expression respectively; marker b is anchored to the parenthetical qualification.
  reviewer_model: gpt-5.6-terra
