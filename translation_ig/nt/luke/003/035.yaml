  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: ig
  text: nwa Serug[a], nwa Reu, nwa Peleg, nwa Eber, nwa Shela[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''asụsụ Grik: “nke Serukh, nke Ragau, nke Phalek, nke Eber, nke Sala.” N''usoro ọmụmụ Luk, okwu ndị a dị n''ụdị genitive dị mkpirikpi; e tinyere “nwa” site n''ihe gbara ha gburugburu iji mee ka ihe ha pụtara doo anya n''Igbo.'
    reason: lexical_alternative
  - marker: b
    text: 'E dere aha ndị a n''ụdị a na-ejikarị amata ha n''Agba Ochie: Serug, Reu, Peleg, Eber, na Shela.'
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N'usoro ọmụmụ a, genitive article a na-eme ugboro ugboro na-aga n'ihu n'echiche mmekọrịta nna na nwa nke amaokwu ndị gbara ya gburugburu. “Nwa” na-eme ka ihe ahịrịokwu Grik hapụrụ n'ekwughị pụta ìhè n'Igbo n'ụzọ dị mfe ma doo anya.
- source_word: Σεροὺχ
  choice: Serug
  rationale: Aha a bụ transliteration nke aha nna ochie a maara n'usoro ọmụmụ Jenesis. “Serug” na-eme ka njikọ ahụ doo anya ma ka na-anọ nso n'ụdị aha ahụ.
- source_word: Ῥαγαὺ
  choice: Reu
  rationale: Ọ bụ ezie na ụdị Grik bụ Ragau, onye a bụ nna ochie a maara dị ka Reu n'usoro ọmụmụ Jenesis; ụdị ahụ na-enyere ndị na-agụ Igbo aka ịmata njikọ Akwụkwọ Nsọ ahụ.
- source_word: Φάλεκ
  choice: Peleg
  rationale: Ụdị Grik Phalek kwekọrọ n'aha Peleg n'usoro ọmụmụ Jenesis. A họọrọ ụdị Akwụkwọ Nsọ a maara nke ọma maka ịdị n'otu n'aha.
- source_word: Ἔβερ
  choice: Eber
  rationale: Aha Grik a kwekọrọ na Eber nke Jenesis. “Eber” bụ ụdị doro anya nke na-ezere mgbagwoju anya na ndị ọzọ nwere aha yiri ya.
- source_word: Σαλὰ
  choice: Shela
  rationale: Sala nke Grik kwekọrọ na Shela n'usoro ọmụmụ Jenesis. “Shela” bụ nsụgharị Igbo dị mfe nke ụdị aha Hibru ahụ, ma na-eme ka njikọ dị n'etiti Agba Ochie na Luk pụta ìhè.
