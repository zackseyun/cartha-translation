  text: τοῦ Ἰεσσαὶ τοῦ Ἰωβὴλ τοῦ Βόος τοῦ ⸀Σαλὰ τοῦ Ναασσὼν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/032.yaml
  text: the son of Jesse, the son of Jobed, the son of Boaz, the son of Sala, the son of Nahshon,
translation:
  language: ig
  text: nwa Jese, nwa Jobel[a], nwa Boaz, nwa Sala, nwa Nashọn,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ihe odide Grik e ji sụgharị ebe a gụrụ «Jobel»; ụfọdụ ndị na-atụ anya «Obed» n’ihi usoro ọmụmụ dị na Rut 4:21–22.
    reason: Documents the potentially surprising source-text reading without resolving or harmonizing the genealogy.
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N’usoro ọmụmụ a, genitive nke edemede nwoke na-egosi njikọ nna na nwa; ‘nwa’ bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo ugbu a.
- source_word: Ἰεσσαὶ
  choice: Jesi
  rationale: Ntụgharị mkpụrụokwu aha Grik n’ụdị aha a maara nke ọma n’Igbo.
- source_word: Ἰωβὴλ
  choice: Jobel
  rationale: E debere ọdịdị aha dị na SBLGNT, bụ Ἰωβήλ (Iōbēl), kama iji ‘Obed’ nke sitere n’ịhazigharị aha ahụ dịka Agba Ochie.
- source_word: Βόος
  choice: Boaz
  rationale: Ụdị aha a maara nke ọma n’Igbo maka Boaz, ọ bụ ezie na ọdịdị Grik bụ Boos.
- source_word: Σαλὰ
  choice: Sala
  rationale: Ntughari ụda aha Grik dịka ọ dị n’amaokwu a, n’enweghị idozi ya ka ọ bụrụ aha ọzọ.
- source_word: Ναασσὼν
  choice: Nashọn
  rationale: Ntụgharị aha Grik n’ụdị Igbo nke na-egosi ụda sh na ụdaume imi nke ngwụcha aha ahụ.
theological_decisions:
- issue: Ọdịdị aha Ἰωβὴλ n’ihe odide Grik megide njirimara ya dịka Obed n’usoro ọmụmụ Agba Ochie
  choice: Jobel
  alternative: Obed
  rationale: A sụgharịrị ihe akaebe ederede SBLGNT dịka o siri dị, n’enweghị imezi aha ahụ iji kwekọọ n’usoro ọmụmụ Rut 4:21–22; nke a na-echekwa ọdịiche dị n’ihe odide.
translation_notes:
  register: Igbo Izugbe dị mfe ma dị ùgwù. E debere usoro ugboro ugboro ‘nwa …’ iji gosipụta usoro ọmụmụ nke ederede Grik; akara rịkọm na-egosi na ahịrịokwu ahụ na-aga n’ihu.
