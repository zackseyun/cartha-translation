  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: ig
  text: n’oge ọkwa nke nnukwu onye nchụaja Anas na Kaịfas[a], okwu Chineke bịakwutere Jọn, nwa Zekaraya, n’ọzara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “n’oge ọkwa nke nnukwu onye nchụaja Anas na Kaịfas.” Luk kpọrọ mmadụ abụọ ahụ aha, ọ bụ ezie na aha ọkwa ahụ dị n’otu ọnụọgụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: n’oge ọkwa nnukwu onye nchụaja nke Anas na Kayafas
  rationale: ἐπί ya na genitive na-egosi oge. Nsụgharị a na-edobe ἀρχιερέως n’otu ọnụọgụ dị ka ọkwa, ma na-akpọkwa Anas na Kayafas abụọ aha, si otú ahụ chekwaa mgbagwoju anya dị n’asụsụ Grik n’enweghị ịkọwa ya n’ike.
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: okwu Chineke bịakwutere
  rationale: Nke a bụ akpaalaokwu amụma nke na-egosi na Chineke kpughere ozi ya. “Bịakwutere” na-egosipụta omume nke ἐγένετο n’ụzọ Igbo na-ada nke ọma.
- source_word: ἐπὶ Ἰωάννην
  choice: bịakwutere Jọn
  rationale: ἐπί ya na accusative ebe a na-egosi na okwu ahụ bịara ruo Jọn; “bịakwutere” bụ okwu Igbo doro anya ma kwekọọ na akpaalaokwu ahụ.
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: Jọn, nwa Zekaraya
  rationale: Nkebi a na-akọwapụta Jọn a na-ekwu maka ya. Usoro “nwa Zekaraya” bụ Igbo ebumpụta ụwa ma na-edobe njirimara ahụ.
- source_word: ἐν τῇ ἐρήμῳ
  choice: n’ime ọzara
  rationale: ἔρημος na-ezo aka n’ebe mmadụ bi ntakịrị, ọ bụghị naanị ala aja kpọrọ nkụ. “Ọzara” bụ okwu Igbo a na-ahụkarị maka ụdị ebe a.
theological_decisions:
- issue: Otu e si gosipụta Anas na Kayafas mgbe ἀρχιερέως dị n’otu ọnụọgụ
  choice: 'Idobe ọkwa ahụ n’otu ọnụọgụ: “n’oge ọkwa nnukwu onye nchụaja nke Anas na Kayafas”'
  alternative: “mgbe Anas na Kayafas bụ nnukwu ndị nchụaja”
  rationale: Asụsụ Grik ji aha ọkwa ahụ n’otu ọnụọgụ ma kpọọ mmadụ abụọ aha. Nsụgharị a na-edobe esemokwu akụkọ ihe mere eme na nke edemede ahụ kama ime ka ọ dị mfe site n’ịgbanwe ya gaa n’ọtụtụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. “Ọkwa nnukwu onye nchụaja” na-enyere aka idobe otu ọnụọgụ nke okwu Grik ma zere ikwu na mmadụ abụọ jidere otu ọkwa ahụ n’otu oge.
