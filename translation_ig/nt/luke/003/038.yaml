id: LUK.3.38
reference: Luke 3:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦ Ἐνὼς τοῦ Σὴθ τοῦ Ἀδὰμ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: ig
  text: nwa Inọs[a], nwa Set, nwa Adam, nwa Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, e kwughachiri naanị usoro genitive a: “nke Inọs, nke Set, nke Adam, nke Chineke.” E tinyere “nwa” n’Igbo n’ihi usoro ọmụmụ nke amaokwu ndị bu ụzọ guzobere.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: nwa Inọs
  rationale: Usoro aha n’usoro ọmụmụ a ji mkpụrụokwu dị na genitive, ebe a ghọtara ‘nwa’ n’agbanyeghị na e deghị ya kpọmkwem. Ịtinye ‘nwa’ na-eme ka mmekọrịta ahụ doo anya n’Igbo. ‘Inọs’ bụ nsụgharị ụda aha Ἐνώς dabara n’Igbo.
- source_word: τοῦ Σὴθ
  choice: nwa Set
  rationale: Otu usoro genitive ahụ na-aga n’ihu ma na-egosi onye bụ nwa onye. ‘Set’ bụ nsụgharị ụda aha Σήθ n’Igbo.
- source_word: τοῦ Ἀδὰμ
  choice: nwa Adam
  rationale: A na-edebe ‘Adam’ dịka aha mmadụ, ọ bụghị ịsụgharị ya ka ọ bụrụ ‘mmadụ’; usoro ọmụmụ ahụ ka na-egosi mmekọrịta nwa na nna.
- source_word: τοῦ θεοῦ
  choice: nwa Chineke
  rationale: Nkebi ikpeazụ ahụ na-agbaso otu usoro genitive nke usoro ọmụmụ ahụ. ‘Nwa Chineke’ na-echekwa ọdịdị na ike okwu Luk n’enweghị ịgbanwe ya ka ọ bụrụ naanị ‘sitere na Chineke.’
theological_decisions:
- issue: Otu a ga-esi sụgharị τοῦ θεοῦ na njedebe usoro ọmụmụ Adam
  choice: nwa Chineke
  alternative: nke Chineke; onye sitere na Chineke
  rationale: Ọ bụ ezie na Grik dere naanị nkebi genitive, usoro okwu nke usoro ọmụmụ ahụ na-eme ka a ghọta mmekọrịta ‘nwa’ n’ebe niile. ‘Nwa Chineke’ na-echekwa usoro edemede na esemokwu nkà mmụta okpukpe dị na ya, ma ọ naghị atụkwasị Adam ụdị ịbụ Ọkpara nke metụtara Kraịst.
translation_notes:
  register: Igbo Izugbe dị mfe, nke ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. E ji ‘nwa’ mee ka usoro ọmụmụ doo anya, ebe ihe odide Grik hapụrụ okwu mmekọrịta ahụ ka a ghọta ya site n’usoro okwu.
