revisions:
- from: Jọn zara ha niile, sị, “Mụ onwe m ji mmiri eme unu baptizim; ma onye dị ike karịa m na-abịa. Erughị m eru ịtọpụ eriri akpụkpọ ụkwụ ya. Ọ bụ ya ga-eji Mmụọ Nsọ na ọkụ mee unu baptizim.[a][b]”
  to: Jọn zara ha niile, sị, “Mụ onwe m ji mmiri eme unu baptizim; ma onye dị ike karịa m na-abịa, onye m na-erughị eru ịtọpụ eriri akpụkpọ ụkwụ ya. Ọ bụ ya ga-eji Mmụọ Nsọ na ọkụ mee unu baptizim.[a][b]”
  rationale: The revision is limited to the sandal-strap clause. It supplies the relative linkage expressed by οὗ and uses the idiomatic Standard Igbo expression “m na-erughị eru” for being unworthy or not fit. The remaining phrasing and both footnotes faithfully retain the source’s lexical and theological openness.
