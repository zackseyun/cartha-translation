    text: A pụkwara ịsị, “Ọ ga-eme unu baptizim n’ime Mmụọ Nsọ na ọkụ.” Okwu Grik bụ “n’ime,” ma n’ebe a ọ pụrụ igosi ihe e ji eme ya, ihe a na-eme ya n’ime, ma ọ bụ mpaghara ọrụ ahụ.
    reason: lexical_alternative
