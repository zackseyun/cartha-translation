review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the principal contrasts accurately: John baptizes with water, a stronger one is coming, John is unworthy for the lowly sandal-strap task, and the coming one will baptize in/with the Holy Spirit and fire. However, the standalone wording “Erughị m eru” does not adequately and naturally render οὗ οὐκ εἰμὶ ἱκανός, because it loses the Greek relative connection (“whose”) and is not idiomatic Standard Igbo in this form.'
  naturalness: Most of the wording is clear contemporary Standard Igbo. Recasting the unworthiness clause as “onye m na-erughị eru ịtọpụ...” is natural, restores the intended relationship, and retains John’s humility without interpretive expansion.
  terminology: “baptizim,” “Mmụọ Nsọ,” “ọkụ,” and “akpụkpọ ụkwụ” are suitable, recognizable terms in an appropriately dignified modern register. “Ji mmiri” and “ga-eji Mmụọ Nsọ na ọkụ” are idiomatic and do not over-resolve the distinct Greek constructions; the note preserves the alternative “n’ime.”
  issues:
  - severity: medium
    issue: The clause “Erughị m eru ịtọpụ eriri akpụkpọ ụkwụ ya” is structurally and idiomatically deficient.
    rationale: οὗ introduces a relative clause, “whose ...,” linking John’s unworthiness to the coming stronger one. The draft separates it into a sentence and uses “Erughị m eru,” which is not the natural present humility expression here. “onye m na-erughị eru ịtọpụ eriri akpụkpọ ụkwụ ya” restores both the relationship and idiomatic Standard Igbo.
  revised_text: Jọn zara ha niile, sị, “Mụ onwe m ji mmiri eme unu baptizim; ma onye dị ike karịa m na-abịa, onye m na-erughị eru ịtọpụ eriri akpụkpọ ụkwụ ya. Ọ bụ ya ga-eji Mmụọ Nsọ na ọkụ mee unu baptizim.[a][b]”
  revised_footnotes:
