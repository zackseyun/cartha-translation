id: LUK.3.16
reference: Luke 3:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: ig
  text: Jọn zara ha niile, sị, “Mụ onwe m ji mmiri eme unu baptizim; ma onye dị ike karịa m na-abịa, onye m na-erughị eru ịtọpụ eriri akpụkpọ ụkwụ ya. Ọ bụ ya ga-eji Mmụọ Nsọ na ọkụ mee unu baptizim.[a][b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ọ ga-eme unu baptizim n’ime Mmụọ Nsọ na ọkụ.” Okwu Grik bụ “n’ime,” ma n’ebe a ọ pụrụ igosi ihe e ji eme ya, ihe a na-eme ya n’ime, ma ọ bụ mpaghara ọrụ ahụ.
    reason: lexical_alternative
  - marker: b
    text: “Ọkụ” nwere ike ịpụta ọkụ na-asachapụ, ọkụ ikpe, ma ọ bụ bụrụ akụkụ nke otu onyinyo baptizim nke Mmụọ Nsọ na ọkụ. E hapụrụ okwu ahụ dịka isi mmalite si kwuo ya.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν
  choice: Jọn zara ha niile, sị
  rationale: Nke a na-egosipụta usoro akụkọ Grik nke ịza na ikwu, ma na-ada ka Igbo nkịtị ma doo anya.
- source_word: Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς
  choice: Mụ onwe m ji mmiri eme unu baptizim
  rationale: “Mụ onwe m” na-egosipụta nkwusi ike na ntụnyere μέν, ebe “ji mmiri” nwere ike igosi ụzọ e si eme ya ma ọ bụ ihe a na-eme baptizim n’ime ya.
- source_word: βαπτίζω / βαπτίσει
  choice: eme baptizim / ga-eme baptizim
  rationale: “Baptizim” bụ okwu a maara nke ọma n’akụkọ Oziọma; ọ naghị amanye nkọwa ụka pụrụ iche banyere usoro e si eme ya.
- source_word: ὁ ἰσχυρότερός μου
  choice: onye dị ike karịa m
  rationale: Nke a na-edobe ntụnyere doro anya nke ἰσχυρότερος n’Igbo dị mfe ma kwekọọ n’isi mmalite.
- source_word: ἔρχεται
  choice: na-abịa
  rationale: Ọ na-egosipụta ihe na-eme ugbu a ma ọ bụ nke dị nso, dịka ụdị oge Grik si kwuo.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: Erughị m eru
  rationale: Akpaokwu Igbo a na-egosipụta na Jọn ahụghị onwe ya dịka onye kwesịrị ekwesị ma ọ bụ tozuru ime ọrụ ahụ dị ala.
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: ịtọpụ eriri akpụkpọ ụkwụ ya
  rationale: Nke a bụ ntụgharị doro anya na nke oge a nke ịtọpụ eriri akpụkpọ ụkwụ, n’etinyeghị okwu ochie ma ọ bụ nkọwa agbakwunyere.
- source_word: αὐτὸς
  choice: Ọ bụ ya
  rationale: Nke a na-echekwa nkwusi ike nke αὐτός ma mee ka ọdịiche dị n’etiti Jọn na onye ahụ na-abịa pụta ìhè.
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: ji Mmụọ Nsọ na ọkụ
  rationale: “Ji” bụ ụzọ Igbo si ekwu nke ọma n’usoro “ime mmadụ baptizim,” ma ọ ka na-ahapụ ma okwu ahụ ọ na-egosi ihe e ji eme ya, ihe a na-emikpu mmadụ n’ime ya, ma ọ bụ mpaghara ọrụ ahụ. Ihe odide isi na nkọwa ala na-echekwa nhọrọ “n’ime.”
theological_decisions:
- issue: Ihe “ga-eji Mmụọ Nsọ na ọkụ mee unu baptizim” pụtara
  choice: E debere “Mmụọ Nsọ na ọkụ” ọnụ n’enweghị ịkọwa ọrụ ọkụ ahụ kpọmkwem.
  alternative: A pụrụ ịghọta ọkụ ahụ dịka ihe na-asachapụ, dịka ikpe, ma ọ bụ dịka akụkụ nke otu baptizim nke Mmụọ na ọkụ.
  rationale: Amaokwu ahụ akọwaghị nke ọ bụla n’ime nghọta ndị a kpọmkwem; ya mere ntụgharị ahụ na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n’isi mmalite.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Akpụkpọ ụkwụ” na “eriri” bụ okwu nkịtị doro anya; “Erughị m eru” na-egosi ịdị umeala n’obi Jọn n’enweghị ịgbakwunye nkọwa ụka pụrụ iche.
