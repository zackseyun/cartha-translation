id: LUK.3.9
reference: Luke 3:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ig
  text: Ma ugbu a, a dọbeworị anyụike n’akụkụ mgbọrọgwụ osisi ndị ahụ. Ya mere, osisi ọ bụla na-adịghị amị ezi mkpụrụ ka a na-egbutu ma tụba ya n’ọkụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: Ugbu a
  rationale: Na-egosipụta na oge ikpe ahụ eruola nso, ọ bụghị naanị ihe ga-eme n’ọdịnihu dị anya.
- source_word: δὲ καὶ
  choice: kwa
  rationale: Na-eburu echiche mgbakwunye na nkwụsi ike nke okwu Grik ahụ n’ụzọ dị mfe n’Igbo.
- source_word: ἡ ἀξίνη
  choice: anyụike
  rationale: Ọ bụ ngwa e ji egbu osisi; okwu a doro ndị na-agụ Igbo anya ma debe ihe atụ ahụ.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων
  choice: n’ụgwụ osisi ndị ahụ
  rationale: “Ụgwụ osisi” bụ ụzọ Igbo si ekwu mgbọrọgwụ ma ọ bụ ala ukwu osisi n’ebe a ga-egbutu ya; ọ na-egosi na anyụike ahụ adịla njikere.
- source_word: κεῖται
  choice: a tọgbọla
  rationale: Na-egosipụta na e tinyela anyụike ahụ n’ebe ahụ ma ọ dị njikere iji ya rụọ ọrụ.
- source_word: πᾶν οὖν δένδρον
  choice: Ya mere, osisi ọ bụla
  rationale: “Ya mere” na-echekwa nkwubi okwu οὖν, ebe “osisi ọ bụla” na-edebe echiche zuru ụwa ọnụ nke πᾶν.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: nke na-adịghị amị ezi mkpụrụ
  rationale: N’Igbo, “ịmị mkpụrụ” bụ okwu ebumpụta ụwa maka osisi na-amị mkpụrụ, ọ na-arụkwa ọrụ nke ọma n’ihe atụ banyere omume.
- source_word: ἐκκόπτεται
  choice: a na-egbutu ya
  rationale: Na-echekwa udi nnara-eme nke ngwaa ahụ ma na-akọwa igbutu osisi n’ụzọ doro anya.
- source_word: εἰς πῦρ βάλλεται
  choice: tụba ya n’ọkụ
  rationale: Na-edebe ihe oyiyi siri ike nke ịtụ osisi a gbuturu n’ime ọkụ n’asụsụ Igbo nke oge a.
theological_decisions:
- issue: Ihe atụ banyere ikpe
  choice: E debere anyụike, osisi, mkpụrụ, na ọkụ dịka ihe atụ nke ikpe dị nso, n’akọwaghị kpọmkwem ụdị ikpe ọkụ ahụ na-anọchi anya ya.
  alternative: Ịkọwa ọkụ ahụ kpọmkwem dịka ọkụ ala mmụọ, ma ọ bụ naanị dịka ikpe mere n’akụkọ ihe mere eme.
  rationale: Amaokwu ahụ na-adọ aka ná ntị banyere ikpe siri ike nke dị nso, ma ọ naghị akọwa kpọmkwem ma ọkụ ahụ bụ ikpe nke oge a, ikpe ikpeazụ, ma ọ bụ ha abụọ.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “a tọgbọla” mee ka ọnọdụ anyụike ahụ dị njikere pụta ìhè, ma jiri “amị ezi mkpụrụ” debe ma ihe osisi pụtara n’ezie ma ihe omume mmadụ ọ na-anọchi anya ya.
