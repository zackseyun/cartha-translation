revisions:
- from: Ugbu a kwa, a tọgbọla anyụike n’ụgwụ osisi ndị ahụ. Ya mere, osisi ọ bụla nke na-adịghị amị ezi mkpụrụ, a na-egbutu ya tụba ya n’ọkụ.
  to: Ma ugbu a, a dọbeworị anyụike n’akụkụ mgbọrọgwụ osisi ndị ahụ. Ya mere, osisi ọ bụla na-adịghị amị ezi mkpụrụ ka a na-egbutu ma tụba ya n’ọkụ.
  rationale: The revision explicitly represents ἤδη with “-worị,” preserves the additive/discourse connection with “Ma ugbu a,” and clarifies the coordinated passive judgment actions. It retains the source’s metaphorical ambiguity and does not identify the fire with any particular doctrinal or historical referent.
  reviewer_model: gpt-5.6-terra
