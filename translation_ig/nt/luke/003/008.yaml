id: LUK.3.8
reference: Luke 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ig
  text: Ya mere, mịpụtaanụ mkpụrụ ndị kwesịrị nchegharị[a]; unu amalitela ịsị n’etiti onwe unu[b], ‘Anyị nwere Ebreham dịka nna anyị,’ n’ihi na ana m agwa unu na Chineke pụrụ ịkpọlitere Ebreham ụmụ site na nkume ndị a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mkpụrụ kwesịrị nchegharị” ma ọ bụ “mkpụrụ kwekọrọ na nchegharị.” Grik ji ụdị ọtụtụ, “mkpụrụ,” mee ihe, na-emesikwa omume kwekọrọ n’ezi nchegharị ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “n’ime onwe unu” ma ọ bụ “n’onwe unu.” Okwu ahụ nwere ike izo aka n’ihe ha na-ekwu n’obi ha ma ọ bụ n’ihe ha na-ekwu n’etiti ndị otu ha.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: mịpụta
  rationale: Ọ bụ iwu na-akpọ ha ka ha mee ihe ozugbo; ‘mịpụta’ na-adabara okwu ihe atụ banyere mkpụrụ ma na-egosi omume na-apụta ìhè.
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ịdọ aka ná ntị dị n’amaokwu ndị bu ụzọ.
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: mkpụrụ ndị kwesịrị nchegharị
  rationale: E debere ‘mkpụrụ’ n’ụdị ọtụtụ dị ka Grik si dị, ebe ‘ndị kwesịrị nchegharị’ na-egosi omume kwekọrọ na nchegharị n’enweghị ịsị na omume ahụ na-erite mgbaghara.
- source_word: μὴ ἄρξησθε λέγειν
  choice: Unu amalitela ịsị
  rationale: Na-echekwa ike nke iwu ahụ nke na-agwa ha ka ha ghara ọbụna ịmalite iji okwu a gbachitere onwe ha.
- source_word: ἐν ἑαυτοῖς
  choice: n’etiti onwe unu
  rationale: Okwu Grik ahụ pụrụ izo aka n’ihe ha na-ekwu n’obi ha ma ọ bụ n’etiti ndị otu ha; nsụgharị a na-echekwa echiche nke ìgwè ahụ.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Anyị nwere Ebreham dịka nna anyị
  rationale: Na-echekwa nkwupụta ha banyere ịbụ ụmụ Ebreham n’ụzọ doro anya ma bụrụkwa Igbo a na-aghọta.
- source_word: δύναται ὁ θεὸς
  choice: Chineke pụrụ
  rationale: Na-ekwupụta ikike Chineke n'ụzọ dị nkenke ma dị arọ.
- source_word: ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: isi na nkume ndị a kulitere Ebreham ụmụ
  rationale: ‘Kulitere’ na-edobe ihe oyiyi nke ἐγεῖραι, ebe usoro ahịrịokwu ahụ na-egosi na ụmụ ahụ bụ ụmụ e welitere nye Ebreham.
theological_decisions:
- issue: Ihe ‘mkpụrụ ndị kwesịrị nchegharị’ pụtara
  choice: Omume a na-ahụ anya nke kwekọrọ na ezi nchegharị ma na-egosi ya
  alternative: ‘Mkpụrụ kwekọrọ na nchegharị’
  rationale: Nkebi okwu Grik ahụ na-emesi nkwekọrịta dị n’etiti nchegharị na omume ike; ọ naghị ekwu na omume ọma na-azụta mgbaghara.
- issue: Ịtụkwasị obi n’ịbụ ụmụ Ebreham site n’ọbara
  choice: Jọn jụrụ echiche na agbụrụ mmadụ naanị ya na-enye nchebe n’ihu Chineke
  alternative: Ịkọwa ‘ụmụ Ebreham’ ozugbo dịka otu ụdị ụmụ ime mmụọ
  rationale: Amaokwu ahụ na-emegide ntụkwasị obi n’agbụrụ ma na-ekwupụta nnwere onwe na ike Chineke, ma ọ naghị akọwa n’ụzọ zuru ezu ụdị ịbụ ụmụ ahụ; ya mere a hapụrụ esemokwu ahụ ka ederede si dị.
translation_notes:
  register: E jiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E jigidere ihe atụ nke ‘mkpụrụ,’ ụdị ọtụtụ nke Grik, na mgbagwoju anya dị na ἐν ἑαυτοῖς site n’ihe odide ala ala peeji.
