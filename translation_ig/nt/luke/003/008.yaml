  to: Ya mere, mịpụtaanụ mkpụrụ ndị kwesịrị nchegharị[a]; unu amalitela ịsị n’etiti onwe unu[b], ‘Anyị nwere Ebreham dịka nna anyị,’ n’ihi na ana m agwa unu na Chineke pụrụ ịkpọlitere Ebreham ụmụ site na nkume ndị a.
