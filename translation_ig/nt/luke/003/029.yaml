  text: the son of Jeshua, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi,
translation:
  language: ig
  text: nwa Jeshua, nwa Elieza, nwa Jorim, nwa Matat, nwa Livai,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N'usoro ọmụmụ a, mkpụrụokwu genitive a na-egosi mmekọrịta nna na nwa; “nwa” na-eme ka nke ahụ doo anya n'Igbo.
- source_word: Ἰησοῦ
  choice: Jeshua
  rationale: E debere aha nna ochie a dịka “Jeshua,” kwekọrọ na ọdịdị aha Semitik ahụ ma na-enyere aka ịmata ọdịiche ya na Jisọs onye a na-akọ banyere ya.
- source_word: Ἐλιέζερ
  choice: Elieza
  rationale: Ntụgharịmkpụrụedemede Igbo dị mfe nke aha Grik ahụ.
- source_word: Ἰωρὶμ
  choice: Jorim
  rationale: Ntụgharịmkpụrụedemede na-echekwa ụda na njirimara aha ahụ.
- source_word: Μαθθὰτ
  choice: Matat
  rationale: E ji “Matat” nọchite ụda aha Grik Μαθθὰτ n'ụzọ ndị na-agụ Igbo ga-adị mfe ịkpọ.
- source_word: Λευὶ
  choice: Livai
  rationale: Ụdị aha a bụ nke a maara nke ọma n'Igbo ma kwekọọ na Levi nke Akwụkwọ Nsọ.
theological_decisions: []
translation_notes:
  register: Asụsụ dị mkpirikpi ma dị ugwu, dịka usoro ndekọ agbụrụ. E megharịrị τοῦ ọ bụla dịka “nwa” ka mmekọrịta agbụrụ pụta ìhè n'Igbo, ma e debere akara rikoma na-aga n'ihu n'ihi na amaokwu a bụ akụkụ nke otu ahịrị ọmụmụ toro ogologo.
