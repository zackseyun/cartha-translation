  yaml_path: translation/nt/luke/003/031.yaml
  text: the son of Melea[a], the son of Menna, the son of Mattatha, the son of Nathan, the son of David[b],
translation:
  language: ig
  text: nwa Melea[a], nwa Menna[b], nwa Matata, nwa Netan, nwa Devid,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''asụsụ Grik: “nke Melea, nke Menna, nke Matata, nke Netan, nke Devid”; n''usoro ọmụmụ Luk, a na-aghọta nke a dịka “nwa” n''ihu aha nke ọ bụla.'
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ nsụgharị nwere “Menan” kama “Menna,” n'ihi ụdị aha ọzọ dị n'ihe odide ụfọdụ; SBLGNT e ji mee nsụgharị a nwere “Menna.”
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N'usoro ọmụmụ a, mkpụrụokwu Grik a na aha ndị mmadụ so na-egosi njikọ nna na nwa nke amaokwu ndị gbara ya gburugburu mere ka o doo anya. Iji “nwa” ugboro ugboro na-eme ka Igbo bụrụ nke e ji ọnụ agụ nke ọma.
- source_word: Μελεὰ
  choice: Melea
  rationale: E depụtara aha Grik ahụ n'ụdị kwekọrọ na ụda ya, nke dịkwa mfe ịgụ n'Igbo.
- source_word: Μεννὰ
  choice: Menna
  rationale: Nke a na-agbaso kpọmkwem ụdị Μεννά dị na SBLGNT, kama iji ụdị ọzọ bụ Menan.
- source_word: Ματταθὰ
  choice: Matata
  rationale: E tinyere aha ahụ n'ụdị mkpụrụokwu Igbo nke na-anọchite ụda Grik Ματταθά n'ụzọ doro anya.
- source_word: Ναθὰμ
  choice: Netan
  rationale: Nke a bụ ụdị aha ahụ a na-amata nke ọma n'Igbo, ma ọ ka na-anọchite aha Grik Ναθάμ.
- source_word: Δαυὶδ
  choice: Devid
  rationale: Nke a bụ ụdị aha Devid a na-ejikarị eme ihe n'Igbo maka Δαυίδ.
theological_decisions:
- issue: Mwepụ okwu n'usoro ọmụmụ
  choice: Tinye “nwa” n'ihu aha nke ọ bụla.
  alternative: Sụgharịa ya naanị dị ka “nke Melea, nke Menna, nke Matata, nke Netan, nke Devid.”
  rationale: Grik nwere usoro genitive dị mkpirikpi nke na-adabere n'ahịrịokwu sara mbara nke usoro ọmụmụ ahụ. “Nwa” na-eme ka njikọ ahụ pụta ìhè n'Igbo n'etinyeghị ozi ọhụrụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri “nwa” kama usoro “nwa nke” ugboro ugboro ka ahịrịokwu ahụ bụrụ nke e ji ọnụ agụ nke ọma. E debere akara nkọwa ala peeji [a] na [b] n'ahịrịokwu isi.
