  text: προσέθηκεν καὶ τοῦτο ἐπὶ πᾶσιν, ⸀καὶ κατέκλεισεν τὸν Ἰωάννην ⸀ἐν φυλακῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: ig
  text: 'Ọ gbakwụnyere nke a kwa n’ajọ omume ya niile[a]: o kpọchiri Jọn n’ụlọ mkpọrọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ na-esochi mkpụrụokwu anya karịa, “Ọ gbakwụnyere nke a kwa n’ihe ndị ahụ niile.” Ihe ọ pụtara bụ na Herọd gbakwụnyere omume a n’ajọ omume ya ndị ọzọ niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: tinyekwara
  rationale: Oge gara aga nke προστίθημι n’ebe a pụtara ịgbakwunye otu omume ọzọ n’ihe ndị e mere na mbụ. “Tinyekwara” na-egosipụta ma mgbakwunye ahụ ma ike nke καί.
- source_word: τοῦτο
  choice: nke a
  rationale: Nnọchiaha ngosi a na-arụtụ aka kpọmkwem n’omume a kọwara n’ahịrịokwu na-esonụ.
- source_word: ἐπὶ πᾶσιν
  choice: n’elu ajọ omume ya niile
  rationale: Nkebiokwu a nwere echiche nke ịgbakwunye ihe n’ihe niile gara aga. Ihe gbara ya gburugburu na-ekwu banyere ajọ omume Herọd; ime ka “ajọ omume ya” pụta ìhè na-enye Igbo doro anya ma na-edobe echiche nchịkọta ahụ.
- source_word: κατέκλεισεν
  choice: mechibidoro
  rationale: κατακλείω pụtara imechi mmadụ n’ime ebe ma ọ bụ ijide ya. “Mechibidoro” na-edobe ọdịdị okwu ahụ, ebe “n’ụlọ mkpọrọ” na-akọwa ebe ahụ.
- source_word: Ἰωάννην
  choice: Jọn
  rationale: A sụgharịrị aha ahụ dịka e si ede ya n’Igbo ọkọlọtọ.
- source_word: ἐν φυλακῇ
  choice: n’ụlọ mkpọrọ
  rationale: φυλακή n’ebe a bụ ebe a na-edebe ndị e jidere; “ụlọ mkpọrọ” bụ okwu Igbo nkịtị ma doo anya.
theological_decisions:
- issue: Ihe ἐπὶ πᾶσιν na-arụtụ aka na ya na ike ọ nwere
  choice: Ọ na-egosi na Herọd gbakwụnyere imechi Jọn n’ụlọ mkpọrọ n’ajọ omume ya niile gara aga.
  alternative: A pụrụ ịsụgharị ya n’ụzọ na-esochi mkpụrụokwu anya karịa dịka “n’elu ihe niile” ma ọ bụ “na mgbakwunye n’ihe ndị a niile.”
  rationale: Amaokwu 19–20 na-edepụta ajọ omume Herọd, ya emechaa kwuo omume ọzọ ọ gbakwụnyere. Nsụgharị a na-eme ka njikọ ahụ doo anya n’Igbo n’etinyeghị nkọwa okwukwe ọzọ.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. E ji “mechibidoro ... n’ụlọ mkpọrọ” debe ihe oyiyi doro anya nke okwu Grik, ma e tinyere nkọwa ọzọ na ndetu ala peeji iji chekwaa ụzọ nsụgharị na-esochi mkpụrụokwu anya.
