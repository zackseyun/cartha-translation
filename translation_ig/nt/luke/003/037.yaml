    rationale: “Matusala” and “Jared” are understandable, but “Metusela” and “Jered” are more natural and recognizable in Igbo biblical register.
  - severity: low
    issue: The main-text spelling “Kainam” is not the clearest rendering of Καϊνάμ.
    rationale: “Kainan” better represents the Greek name in a form familiar to modern readers, while “Kenan” belongs in the note as an Old Testament-harmonizing alternative.
  - severity: low
