  text: τοῦ Μαθουσαλὰ τοῦ Ἑνὼχ τοῦ Ἰάρετ τοῦ Μαλελεὴλ τοῦ Καϊνὰμ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/037.yaml
  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: ig
  text: nwa Metusela, nwa Inọk, nwa Jered, nwa Mahalaleel, nwa Kainan[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, aha a bụ Καϊνάμ (Kainan). A pụkwara ide ya “Kainan” n’ụzọ ọzọ, ma ọ bụ “Kenan” n’ụfọdụ nsụgharị iji kwekọọ na usoro ọmụmụ ụfọdụ nke Agba Ochie. Ihe odide Grik nke Luk gụnyere aha a.
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N’usoro ọmụmụ a, mkpụrụokwu Grik a dị n’ụdị nke na-egosi onye e si n’aka ya mụta onye ọzọ. Ikwughachi “nwa” na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: Μαθουσαλά
  choice: Matusala
  rationale: Nke a bụ nsụgharị aha ahụ n’ụzọ dabara n’usoro mkpọpụta na ide aha ndị Baịbụl n’Igbo.
- source_word: Ἑνώχ
  choice: Inọk
  rationale: A họọrọ ụdị aha a na-aghọta ngwa ngwa n’Igbo ma na-anọgide nso na aha Grik.
- source_word: Ἰάρετ
  choice: Jared
  rationale: Aha a bụ ụdị a maara nke ọma n’usoro ọmụmụ Akwụkwọ Nsọ, ma na-anọgide nso na ụda aha Grik.
- source_word: Μαλελεήλ
  choice: Mahalalel
  rationale: Ụdị a na-eme ka onye a dị n’usoro ọmụmụ Jenesis bụrụ onye a pụrụ ịmata, n’agbanyeghị ntakịrị ọdịiche dị n’ide aha Grik.
- source_word: Καϊνάμ
  choice: Kainam
  rationale: A họọrọ nsụgharị mkpụrụedemede nke na-anọgide nso n’aha dị kpọmkwem n’ihe odide Grik, kama ịgbanwe ya n’enweghị nkọwa ka o kwekọọ n’ụdị aha dị n’Agba Ochie.
theological_decisions:
- issue: Mkpụrụokwu e hapụrụ n’usoro genitiv nke usoro ọmụmụ Luk
  choice: Ikwughachi “nwa” n’ihu aha ọ bụla
  alternative: Iji naanị “nke” kee aha ndị ahụ n’usoro
  rationale: Ọ bụ ezie na Grik na-eji usoro genitiv dị mkpirikpi, ihe a ghọtara n’ebe a bụ njikọ nna na nwa. “Nwa” na-egosipụta nke ahụ n’Igbo n’ụzọ doro anya ma dịkwa mfe ịgụ.
- issue: Otu e si dee Καϊνάμ n’usoro ọmụmụ Luk
  choice: Itinye “Kainam” n’ahịrị bụ isi
  alternative: “Kainan” ma ọ bụ “Kenan”
  rationale: Ihe odide Grik nke Luk nwere aha Καϊνάμ. Ya mere, e debeghị ya n’akụkụ ma ọ bụ gbanwee ya naanị iji mee ka usoro ọmụmụ ahụ kwekọọ n’ụdị ụfọdụ nke Agba Ochie; e nyere ụdị ndị ọzọ n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị ùgwù ma dị mfe nghọta. Ikwughachi “nwa” na-edobe usoro na ụda nke ndepụta ọmụmụ ahụ; a na-edekwa aha ndị mmadụ n’ụdị ndị onye na-agụ Igbo nwere ike ịkpọ nke ọma.
