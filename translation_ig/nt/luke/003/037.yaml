  naturalness: The concise repeated pattern “nwa X” is natural, clear Standard Igbo for a genealogical list. Conventional Igbo biblical spellings improve readability and continuity with related genealogies.
  terminology: Use the established Igbo biblical forms “Metusela” and “Jered.” Render Καϊνάμ as “Kainan,” a transparent Igbo/modern biblical transliteration; retain “Kenan” only as a noted harmonizing alternative.
  issues:
