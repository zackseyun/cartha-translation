  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: ig
  text: nwa Maat[a], nwa Matatias, nwa Semein, nwa Josek, nwa Joda,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’edemede Grik, a na-ekwughachi edemede genitiv “τοῦ” n’ihu aha ọ bụla; ekwughị “nwa” n’ebe ọ bụla n’ahịrị a. E tinyere “nwa” n’ihi na usoro ọmụmụ gbara ya gburugburu na-egosi mmekọrịta ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N’usoro ọmụmụ a, edemede Grik na-eji τοῦ ugboro ugboro n’ụzọ dị mkpirikpi, ebe ihe gbara ya gburugburu na-egosi mmekọrịta nna na nwa. “Nwa” na-eme ka mmekọrịta ahụ doo anya n’Igbo ma na-anọgide n’ụdị okwu dị mfe nke usoro ọmụmụ.
- source_word: Μάαθ
  choice: Maat
  rationale: A sụgharịghị aha mmadụ a; a dere ya n’ụdị dabara n’usoro mkpọpụta na mkpụrụedemede Igbo.
- source_word: Ματταθίου
  choice: Matatias
  rationale: Nke a bụ ndegharị aha Grik Ματταθίας n’ụdị dabara n’Igbo; ọdịdị Ματταθίου bụ genitive.
- source_word: Σεμεῒν
  choice: Semein
  rationale: A hapụrụ aha ahụ nso n’ụdị Grik ya ma dee ya n’ụdị a pụrụ ịgụ n’Igbo.
- source_word: Ἰωσὴχ
  choice: Josek
  rationale: “Josek” na-anọchi anya aha Grik Ἰωσήχ n’ụdị e ji mkpụrụedemede Igbo dee, ebe “k” na-enye mmechi aha ahụ n’ụzọ a pụrụ ịkpọ nke ọma.
- source_word: Ἰωδὰ
  choice: Joda
  rationale: Nke a bụ ndegharị kpọmkwem nke Ἰωδά, na-enweghị ime ka aha ahụ kwekọọ n’ụdị Hibru ọzọ.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe dị mfe ma dị ùgwù dee ya. E mere ka usoro aha ndị ahụ dị mkpirikpi dịka n’usoro ọmụmụ, ma e tinyere “nwa” iji zere okwu na-edoghị anya n’Igbo.
