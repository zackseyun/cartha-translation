id: LUK.3.21
reference: Luke 3:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: ig
  text: O wee mee na, mgbe e mere ndị mmadụ niile baptizim, e mekwara Jizọs baptizim, ọ nọkwa na-ekpe ekpere, e meghere eluigwe[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e meghere mbara igwe.” Okwu Grik ahụ nwere ike ịpụta mbara igwe a na-ahụ anya ma ọ bụ eluigwe; ma n’ọnọdụ mkpughe a, “eluigwe” kacha daba adaba.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: O wee ruo na
  rationale: Ọ bụ usoro Luk ji akwalite akụkọ gaa n’ihe ọzọ mere; nsụgharị a na-egosi mmegharị akụkọ ahụ n’Igbo ebumpụta ụwa n’etinyeghị okwu oge na-adịghị na Grik.
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: mgbe e mere ndị mmadụ niile baptizim
  rationale: Nkebi infinitive nwere ἐν na-egosi oge. ‘Mgbe’ na-enye ya n’Igbo doro anya, ebe ‘ndị mmadụ niile’ na-egosipụta ἅπαντα τὸν λαόν.
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: e mekwara Jizọs baptizim
  rationale: ‘kwara’ na-eburu ike mgbakwunye nke καί, ebe usoro a na-edobe baptizim Jizọs n’ọnọdụ oge tupu mmeghe eluigwe.
- source_word: καὶ προσευχομένου
  choice: ọ nọkwa na-ekpe ekpere
  rationale: Ụdị na-aga n’ihu na-egosi na Jizọs nọ n’etiti ikpe ekpere mgbe ihe bụ isi mere.
- source_word: ἀνεῳχθῆναι
  choice: e meghere
  rationale: A hapụrụ ya n’usoro enweghị onye a kpọrọ aha dị ka onye mere ya, nke kwekọrọ na passive Grik, ma a zere echiche siri ike nke ‘ịdọwa’ dị n’akụkọ Mak.
- source_word: τὸν οὐρανὸν
  choice: eluigwe
  rationale: N’ọnọdụ mkpughe a, ‘eluigwe’ kacha egosipụta mpaghara Chineke, ọ bụ ezie na okwu Grik ahụ nwekwara ike ịpụta mbara igwe a na-ahụ anya.
theological_decisions:
- issue: Ihe οὐρανός na-ezo aka na ya n’akụkọ baptizim Jizọs
  choice: eluigwe
  alternative: mbara igwe
  rationale: Ọdịda Mmụọ Nsọ na olu Chineke na-esochi na-akwado nghọta mkpughe nke ‘eluigwe’; ihe odide ala peeji na-echekwa ihe ọzọ okwu Grik ahụ nwekwara ike ịpụta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere usoro akụkọ Luk, ọdịiche oge dị n’etiti baptizim na ikpe ekpere, na passive nke mmeghe eluigwe. E tinyere akara ihe odide ala peeji n’akụkụ ‘eluigwe,’ bụ okwu ihe odide ala peeji ahụ na-akọwa.
