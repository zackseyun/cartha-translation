  - marker: b
    text: Ma ọ bụ, “na-akpọsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: Ọ gakwuuru
  rationale: Aorist ἔρχομαι na-egosi ịga ma ọ bụ ịbịa n'ebe ahụ; “gakwuuru” bụ ụzọ Igbo dị mma isi kọwaa mmegharị ahụ n'akụkọ a n'enweghị ịgbakwunye ebe onye na-akọ akụkọ nọ.
- source_word: εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: mpaghara niile gbara Jọdan gburugburu
  rationale: Nke a na-egosipụta πᾶσαν na περίχωρον n'Igbo doro anya, ma na-ahapụ τοῦ Ἰορδάνου dị ka mpaghara gbara osimiri Jọdan gburugburu.
- source_word: κηρύσσων
  choice: na-ekwusa
  rationale: “Na-ekwusa” na-egosipụta nkwupụta a na-eme n'ihu ọha, nke bụ isi echiche κηρύσσω, ma bụrụkwa okwu Igbo ndị mmadụ na-aghọta.
- source_word: βάπτισμα
  choice: baptizim
  rationale: “Baptizim” bụ okwu a nabatara n'Igbo maka emume imikpu ma ọ bụ ịsa ahụ nke okwu Grik a na-ezo aka na ya.
- source_word: μετανοίας
  choice: nke nchegharị
  rationale: 'Nke a na-edobe njikọ genitive ahụ nso: baptizim e ji nchegharị mara, n''ebughị ụzọ kpebie kpọmkwem ụdị njikọ ha nwere.'
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: maka mgbaghara mmehie
  rationale: “Maka mgbaghara mmehie” bụ Igbo ebumpụta ụwa nke na-egosipụta ebumnuche ma ọ bụ ntụziaka εἰς, ma na-edobe ἄφεσις dịka mgbaghara n'ọnọdụ a.
theological_decisions:
- issue: Njikọ dị n'etiti baptizim, nchegharị, na mgbaghara mmehie
  choice: “baptizim nke nchegharị maka mgbaghara mmehie”
  alternative: “baptizim nke na-egosi nchegharị nke na-eduga ná mgbaghara mmehie” ma ọ bụ “baptizim e ji egosipụta nchegharị maka mgbaghara mmehie”
  rationale: Nhazi Grik anaghị akọwa n'ụzọ zuru ezu ma baptizim ọ bụ ụzọ e si enweta mgbaghara, ihe akaebe ya, ka ọ bụ akara nkwupụta ya. Nsụgharị ahụ na-edobe esemokwu nkà mmụta okpukpe a n'edoziweghị ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Na-ekwusa” na-edobe ụda nkwupụta ihu ọha; “baptizim nke nchegharị maka mgbaghara mmehie” na-agbasochi usoro isi okwu Grik ma ghara itinye nkọwa otu ụka pụrụ iche.
