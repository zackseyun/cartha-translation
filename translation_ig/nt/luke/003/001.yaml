id: LUK.3.1
reference: Luke 3:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: ig
  text: N’afọ nke iri na ise nke ọchịchị Taịbiriọs Siza[a], mgbe Pọntiọs Paịlet na-achị Judia, Herọd na-achị Galili dịka tetrak, Filip, nwanne ya, na-achị ógbè Ituria na Trakonitis dịka tetrak, Lisanias na-achị Abilini dịka tetrak[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “N’ime afọ nke iri na ise.”
    reason: lexical_alternative
  - marker: b
    text: “Tetrak” bụ onye na-achị otu ógbè n’okpuru ọchịchị Rom.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ
  choice: N’afọ nke iri na ise
  rationale: Ọ bụ ụzọ Igbo kwụ ọtọ ma dị mfe isi gosi oge ihe mere; a hapụrụ δὲ ka usoro ahịrịokwu na njikọ ndị so ya gosi mgbanwe akụkọ n’enweghị itinye okwu na-adịghị mkpa.
- source_word: ἡγεμονίας
  choice: ọchịchị
  rationale: N’ebe eze ukwu nọ, “ọchịchị” na-egosi oge na omume ọchịchị ya n'ụzọ doro anya ma ghara ime ka okwu ahụ bụrụ naanị aha ọkwa.
- source_word: ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας
  choice: mgbe Pọntiọs Paịlet na-achị Judia
  rationale: “Mgbe ... na-achị” na-echekwa ọnọdụ nke participle Grik ma na-ada ka Igbo ebumpụta ụwa.
- source_word: τετρααρχοῦντος
  choice: bụ tetrak nke
  rationale: E chekwara aha ọkwa ọchịchị pụrụ iche nke oge Rom kama ịgbasa ya ka ọ bụrụ naanị “onye ọchịchị”; ihe odide ala peeji na-akọwa ya.
- source_word: Φιλίππου ... τοῦ ἀδελφοῦ αὐτοῦ
  choice: Filip nwanne ya
  rationale: Nke a na-echekwa njikọ apposition na ntụaka “ya” nye Herọd n'ụzọ dị mkpirikpi ma doo anya.
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: ógbè Ituria na Trakonitis
  rationale: “Ógbè” na-anọchi χώρα ma na-egosi na aha abụọ ahụ metụtara mpaghara ọchịchị, ọ bụghị mba ndị nweere onwe ha.
theological_decisions:
- issue: Ntụgharị aha ọkwa τετρααρχοῦντος
  choice: bụ tetrak nke
  alternative: na-achị / bụ onye ọchịchị nke
  rationale: Ọ bụ okwu akụkọ ihe mere eme karịa okwu ozizi; idebe aha ọkwa ahụ na-echekwa nkọwa pụrụ iche nke ederede Grik, ebe ihe odide ala peeji na-enyere onye na-agụ aka.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A sụgharịrị aha mmadụ na ebe dịka ụda ha si dị n’usoro Igbo; e debere “tetrak” dịka aha ọkwa akụkọ ihe mere eme ma kọwaa ya n’ala peeji. Ahịrịokwu ahụ kwụsịrị na rikoma n’ihi na amaokwu Grik a na-aga n’ihu n’amaokwu na-esonụ.
