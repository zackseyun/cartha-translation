id: LUK.3.12
reference: Luke 3:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: ig
  text: Ọbụna ndị ọnaụtụ bịara ka e mee ha baptizim[a], ha wee sị ya, “Onye Ozizi, gịnị ka anyị kwesịrị ime?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ndị ọnaụtụ sokwa bịa ka e mee ha baptizim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: bịara
  rationale: Aorist indicative a bụ ihe mere n’oge gara aga, ya mere “bịara” dabara nke ọma.
- source_word: δὲ καὶ τελῶναι
  choice: Ọbụna ndị ọnaụtụ
  rationale: “Ọbụna” na-egosipụta ike mgbakwunye dị na δὲ καὶ nakwa ihe ijuanya na ndị ọnaụtụ sokwa bịa; “ndị ọnaụtụ” bụ okwu Igbo doro anya maka τελῶναι.
- source_word: βαπτισθῆναι
  choice: ka e mee ha baptizim
  rationale: Infinitive passive a na-egosi nzube ha ji bịa, ma na-edobekwa na ọ bụ onye ọzọ ga-eme ha baptizim.
- source_word: εἶπαν πρὸς αὐτόν
  choice: ha wee sị ya
  rationale: Nke a na-asụgharị λέγω πρὸς n’ụzọ kwụ ọtọ, kama ịgbanwe ya ka ọ bụrụ ngwaa pụtara kpọmkwem “jụọ.”
- source_word: Διδάσκαλε
  choice: Onye Ozizi
  rationale: Aha a kpọrọ mmadụ na-egosi onye na-akụzi, n’enweghị itinye echiche ikike ọzọ na-adịghị mkpa.
- source_word: τί ποιήσωμεν
  choice: gịnị ka anyị kwesịrị ime?
  rationale: Nke a na-egosipụta ajụjụ deliberative subjunctive banyere omume kwesịrị ekwesị n’Igbo nke oge a.
theological_decisions:
- issue: Ntinye ndị ọnaụtụ, bụ́ ndị ọha na-ele anya ọjọọ, n’etiti ndị zara oku Jọn
  choice: E jiri “Ọbụna ndị ọnaụtụ” chekwaa nkwusi ike nke amaokwu ahụ.
  alternative: “Ndị ọnaụtụ sokwa bịa”
  rationale: Ihe odide ahụ na-eme ka o doo anya na ọbụna ndị a na-ele anya dị ka ndị omume ha na-enyo enyo zara ozi Jọn; ntụgharị ahụ anaghị agbakwunye nkọwa okpukpe ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Onye Ozizi” mee aha a kpọrọ mmadụ, jiri “baptizim” mee okwu Ndị Kraịst a maara nke ọma, ma chekwaa nhọrọ n’etiti “ọbụna” na “sokwa” n’ihe odide ukwu na nkọwa ala peeji.
