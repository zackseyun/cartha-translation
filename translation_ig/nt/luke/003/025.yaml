  yaml_path: translation/nt/luke/003/025.yaml
  text: the son of Mattathias, the son of Amos, the son of Nahum, the son of Esli, the son of Naggai,
translation:
  language: ig
  text: nwa Matatias, nwa Emọs, nwa Nahum, nwa Esli, nwa Nagai,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N'usoro ọmụmụ a, mkpụrụokwu genitive a na-ekwughachi na-anọchi anya njikọ ‘nwa nke.’ Igbo na-egosipụta ya n'ụzọ doro anya ma dịkwa mfe site n'ịsị ‘nwa’ tupu aha nna nna ọ bụla.
- source_word: Ματταθίου
  choice: Matatias
  rationale: E dere aha mmadụ a n'ụdị mkpụrụedemede Igbo nke na-agbaso ụda Grik Ματταθίας, ebe Ματταθίου bụ ụdị genitive ya.
- source_word: Ἀμὼς
  choice: Emọs
  rationale: Nke a bụ aha mmadụ; ‘Emọs’ bụ ụdị aha ahụ a maara nke ọma n'Igbo, ma n'ebe a ọ bụ naanị aha otu nna nna n'usoro ọmụmụ.
- source_word: Ναοὺμ
  choice: Nahum
  rationale: E degharịrị aha mmadụ a n'ụdị a maara nke ọma n'Igbo, na-ejigide mkpọpụta consonant nke aha ahụ.
- source_word: Ἑσλὶ
  choice: Esli
  rationale: E degharịrị aha ahụ ozugbo dịka mkpọpụta Grik si dị; e tinyeghị ‘H’ n'isi n'ihi na iku ume mbido adịghị mkpa maka ọgụgụ Igbo.
- source_word: Ναγγαὶ
  choice: Nagai
  rationale: E degharịrị aha mmadụ ahụ dịka ụda Grik si dị n'ụdị dị mfe ọgụgụ n'Igbo; otu ‘g’ zuru ezu n'usoro odide Igbo.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị mfe, dị ùgwù, ma kwekọọ n'ụdị ndepụta usoro ọmụmụ. E webatara ‘nwa’ nke ahịrịokwu ndị gbara amaokwu a gburugburu na-achọ, ebe Grik ji naanị isiokwu genitive e kwughachiri mee njikọ ahụ.
