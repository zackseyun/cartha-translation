  register: Asụsụ Igbo izugbe, dị mfe ma nwee ugwu. E ji usoro nkenke ‘nwa X’ mee ka ndepụta ọmụmụ ahụ bụrụ nke ebumpụta ụwa n'Igbo, ebe e chekwara nkwughachi dị na Greek.
