  - marker: a
    text: N’asụsụ Greek, a na-emegharị mkpụrụokwu genitiv τοῦ (“nke”) tupu aha ọ bụla; e tinyere “nwa” iji mee ka mmekọrịta ezinụlọ dị n’usoro ọmụmụ a pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: nwa
  rationale: N'usoro ọmụmụ a, edemede genitiv nke a na-emegharị ugboro ugboro na-anọchi anya mmekọrịta ‘nwa nke’; Igbo na-egosipụta ya nke ọma ma n'ụzọ ebumpụta ụwa site n'okwu ‘nwa’ tupu aha nke ọ bụla.
- source_word: Μελχὶ
  choice: Melki
  rationale: E degharịrị aha onye ahụ n'ụdị mkpụrụedemede na ụda dabara n'Igbo; ‘k’ na-anọchi anya ụda Greek χ n'ụzọ dị mfe nghọta.
- source_word: Ἀδδὶ
  choice: Adi
  rationale: E degharịrị aha ahụ n'ụdị Igbo dị mfe ịgụ; otu ‘d’ zuru ezu n'ihi na Igbo anaghị ejikarị mkpụrụedemede abụọ egosi ogologo mgbochiume.
- source_word: Κωσὰμ
  choice: Kosam
  rationale: E degharịrị aha ahụ ozugbo site na Greek, jiri ‘K’ maka Κ kama ịgbaso omenala Bekee nke iji ‘C’.
- source_word: Ἐλμαδὰμ
  choice: Elmadam
  rationale: E degharịrị aha onye ahụ n'ụzọ kwụ ọtọ ma dị mfe ịgụ n'Igbo.
- source_word: Ἢρ
  choice: Ea
  rationale: E ji ‘Ea’ gosipụta ụda aha Greek Ἢρ n'ụzọ dabara n'usoro mkpọpụta Igbo, ebe r anaghị abụkarị ngwụcha nkejiokwu n'okwu Igbo.
