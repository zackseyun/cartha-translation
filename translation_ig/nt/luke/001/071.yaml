id: LUK.1.71
reference: Luke 1:71
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σωτηρίαν ἐξ ἐχθρῶν ἡμῶν καὶ ἐκ χειρὸς πάντων τῶν μισούντων ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/071.yaml
  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: ig
  text: nzọpụta site n’aka ndị iro anyị na site n’aka ndị niile kpọrọ anyị asị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnapụta n’aka ndị iro anyị na n’ike nke ndị niile kpọrọ anyị asị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σωτηρίαν
  choice: nzọpụta
  rationale: “Nzọpụta” na-edobe ma ịdị arọ nke okwu ahụ n’ihe gbasara nzọpụta Chineke ma echiche doro anya nke ịnapụta ndị mmadụ n’aka ndị iro.
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: site n’aka ndị iro anyị
  rationale: N’Igbo, “site n’aka” na-egosi ịpụ n’okpuru ikike ma ọ bụ ihe ize ndụ nke ndị iro n’ụzọ eke, n’agbanyeghị na Grik ji naanị ἐξ gosipụta nkewapụ.
- source_word: ἐκ χειρὸς
  choice: site n’aka
  rationale: Nsụgharị nkịtị a na-edobe ihe atụ Akwụkwọ Nsọ nke “aka” dịka ikike ma ọ bụ ọchịchị, ma bụrụkwa okwu ndị Igbo na-aghọta nke ọma.
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: ndị niile kpọrọ anyị asị
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche nke ndị e ji omume ịkpọ anyị asị mara.
- source_word: καὶ
  choice: na
  rationale: “Na” jikọtara ahịrịokwu abụọ ahụ n’enweghị itinye nkọwa ọzọ na-adịghị na Grik.
theological_decisions:
- issue: Ụdị nzọpụta e kwere ná nkwa n’amụma Zekaraya
  choice: Jiri “nzọpụta” ma debe okwu gbasara ndị iro na ndị kpọrọ anyị asị.
  alternative: Ịsụgharị ya naanị dịka nnapụta ndọrọ ndọrọ ọchịchị, ma ọ bụ naanị dịka nzọpụta ime mmụọ pụọ ná mmehie.
  rationale: Amaokwu ahụ na-ekwu kpọmkwem banyere ndị iro, ma okwu “nzọpụta” n’ime Luk nwekwara ịdị arọ nke mgbapụta Chineke. Nsụgharị ahụ ekwesịghị imechi otu n’ime echiche abụọ a.
translation_notes:
  register: E ji asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. “Site n’aka” na-edobe ihe atụ nke aka dịka ikike, ebe nkọwa ala peeji na-enye “n’ike” dịka ụzọ ọzọ e si akọwa akpaalaokwu ahụ.
