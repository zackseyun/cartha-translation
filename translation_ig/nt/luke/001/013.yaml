revisions:
- from: Ma mmụọ ozi ahụ sịrị ya, “Atụla egwu, Zakaraya, n’ihi na a nụla arịrịọ gị[a]. Nwunye gị Elizabet ga-amụtara gị nwa nwoke, ị ga-akpọkwa ya Jọn.”
  to: Ma mmụọ ozi ahụ sịrị ya, “Atụla egwu, Zekaraya, n’ihi na a nụla arịrịọ gị[a], nwunye gị Elizabet ga-amụrụ gị nwa nwoke, ị ga-akpọkwa ya Jọn.”
  rationale: The revision uses the conventional Igbo biblical form “Zekaraya,” improves the modern clarity of the birth expression, and restores the Greek coordination with a comma. It retains the source’s implicit divine passive and the natural Igbo naming expression “ị ga-akpọkwa ya Jọn.”
