  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: ig
  text: Ma mmụọ ozi ahụ sịrị ya, “Atụla egwu, Zekaraya, n’ihi na a nụla arịrịọ gị[a], nwunye gị Elizabet ga-amụrụ gị nwa nwoke, ị ga-akpọkwa ya Jọn.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ekpere gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: Ma ... sịrị
  rationale: δέ bụ njikọ dị nro nke na-egosi ntakịrị mgbanwe n’akụkọ ahụ; “Ma” na-egosipụta nke a n’enweghị ime ka esemokwu ahụ sie ike karịa ka ọ dị.
- source_word: ὁ ἄγγελος
  choice: mmụọ ozi ahụ
  rationale: N’ebe a, ἄγγελος na-ezo aka n’ony ozi si n’eluigwe; “mmụọ ozi” bụ okwu Igbo a maara nke ọma maka ya.
- source_word: Μὴ φοβοῦ
  choice: Atụla egwu
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma doo anya isi kwuo mmachibido ahụ n’ọnọdụ Zakaraya nọ na ya.
- source_word: Ζαχαρία
  choice: Zakaraya
  rationale: Nke a bụ nsụgharị aha ahụ nke dabara n’usoro mkpọpụta na ide aha n’Igbo.
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe mere Zakaraya na-ekwesịghị ịtụ egwu.
- source_word: εἰσηκούσθη
  choice: a nụla
  rationale: Ụdị a na-edebe olu nnara nke Grik ma hapụ onye nụrụ arịrịọ ahụ n’amaghị aha, dịka isi mmalite ahụ si mee; ihe gbara ya gburugburu na-egosi ọrụ Chineke.
- source_word: ἡ δέησίς σου
  choice: arịrịọ gị
  rationale: δέησις bụ arịrịọ siri ike e ji ekpe ekpere. “Arịrịọ” na-egosipụta kpọmkwem akụkụ ịrịọ ihe, ebe ndetu ala na-akọwa na ọ bụ ekpere.
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: nwunye gị Elizabet
  rationale: N’ihi njikọ onye nwe na ọnọdụ alụmdi na nwunye, γυνή pụtara “nwunye,” ọ bụghị naanị “nwaanyị.”
- source_word: γεννήσει υἱόν σοι
  choice: ga-amụtara gị nwa nwoke
  rationale: Nke a na-egosipụta ma ịmụ nwa nke Elizabet ma dative σοι, nke na-egosi na nwa ahụ bụụrụ Zakaraya.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: ị ga-akpọkwa ya Jọn
  rationale: Nke a bụ ụzọ Igbo e si ekwu inye mmadụ aha n'ụzọ doro anya ma dịkwuo ndụ karịa ịsụgharị akpaalaokwu Grik ahụ n’okwu n’okwu.
- source_word: Ἰωάννην
  choice: Jọn
  rationale: “Jọn” bụ ụdị aha a na-ejikarị eme ihe n’Igbo maka Ἰωάννης.
theological_decisions:
- issue: Onye mere ihe dị n’okwu nnara εἰσηκούσθη (“a nụla”)
  choice: E debere ya n’olu nnara n’akpọghị Chineke aha kpọmkwem.
  alternative: “Chineke anụla arịrịọ gị.”
  rationale: N’ọnọdụ ekpere ndị Juu, a na-aghọta na ọ bụ Chineke nụrụ arịrịọ ahụ, ma Grik akpọghị ya aha. Nsụgharị ahụ na-edebe ihe ahụ isi mmalite hapụrụ n’amaghị aha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “arịrịọ” iji chekwaa ike δέησις, ma e nyere “ekpere” dịka ụzọ ọzọ na ndetu ala. A hapụrụ olu nnara “a nụla” ka ọ ghara ịkọwapụta ihe Grik hapụrụ n’ụzọ na-apụtaghị ìhè.
