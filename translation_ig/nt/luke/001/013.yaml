    text: Ma ọ bụ, “ekpere gị.”
    reason: lexical_alternative
  revision_rationale: The revision uses the conventional Igbo biblical form “Zekaraya,” improves the modern clarity of the birth expression, and restores the Greek coordination with a comma. It retains the source’s implicit divine passive and the natural Igbo naming expression “ị ga-akpọkwa ya Jọn.”
