  text: ἀφόβως ἐκ χειρὸς ⸀ἐχθρῶν ῥυσθέντας λατρεύειν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/074.yaml
  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: ig
  text: ka anyị, mgbe a napụtachara anyị n’aka ndị iro anyị[b], wee jeere ya ozi[c] n’enweghị egwu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’atụghị ụjọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ike ndị iro anyị.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịtụgharị ya, “fee ya ofufe,” karịsịa ebe okwu a na-ekwu maka ozi a na-ejere Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: n’atụghị egwu
  rationale: Nke a na-egosi ime ihe n’enweghị egwu. Ide ya n’akụkụ ‘jeere ya ozi’ na-eme ka Igbo bụrụ nke e ji eme ihe nke ọma ma kwekọọ n’otú a na-aghọtakarị njikọ okwu Grik a.
- source_word: ἐκ χειρὸς
  choice: n’aka
  rationale: ‘N’aka’ na-echekwa ihe atụ dị n’asụsụ Grik ma na-egosikwa ịpụ n’ike ma ọ bụ n’okpuru ọchịchị ndị iro.
- source_word: ἐχθρῶν
  choice: ndị iro anyị
  rationale: Ọ bụ ezie na Grik ekwughị ‘anyị’ kpọmkwem n’okwu a, ihe gbara amaokwu ahụ gburugburu na-egosi ndị iro nke ndị Chineke; ‘anyị’ na-emekwa ka Igbo doo anya.
- source_word: ῥυσθέντας
  choice: mgbe a napụtasịrị anyị
  rationale: Ụdị a na-egosi na nnapụta ahụ buru ụzọ mee tupu ijere Chineke ozi, dịka aorist passive participle si egosi.
- source_word: λατρεύειν
  choice: jeere ya ozi
  rationale: Okwu a nwere ike ịpụta ijere Chineke ozi ma ọ bụ ife ya ofufe. ‘Jeere ya ozi’ na-echekwa ma nrubeisi ma ofufe dị n’echiche ahụ.
- source_word: αὐτῷ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Chineke, onye a kpọtụrụ aha n’ihe gbara amaokwu ahụ gburugburu.
theological_decisions:
- issue: Oke ihe λατρεύειν pụtara mgbe ọ na-ekwu maka Chineke
  choice: jeere ya ozi
  alternative: fee ya ofufe
  rationale: ‘Jeere ya ozi’ anaghị eme ka ihe okwu ahụ pụtara bụrụ naanị emume ofufe; ọ ka na-eburu echiche nke ofufe, nrubeisi, na ndụ e nyefere Chineke.
- issue: Ihe ἀφόβως jikọtara ya na ya n’ahịrịokwu ahụ
  choice: ọ na-akọwa ijere Chineke ozi
  alternative: ọ nwere ike ịkọwa ọnọdụ nnapụta ahụ
  rationale: N’usoro ahịrịokwu ahụ dum, a na-aghọtakarị ya dịka ‘ijere ya ozi n’atụghị egwu,’ ma ọnọdụ okwu Grik ahụ na-enye ohere ka e chebara njikọ ọzọ echiche; e gosiri nke a n’okpuru amaokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Mgbe a napụtasịrị anyị’ na-egosipụta ihe mere tupu isi omume ahụ; ‘n’aka’ na-echekwa ihe atụ Akwụkwọ Nsọ n’enweghị ime ka okwu ahụ sie ike nghọta.
