    issue: The footnote for marker a proposes an unsupported syntactic alternative.
    rationale: In ἀφόβως ἐκ χειρὸς ἐχθρῶν ῥυσθέντας λατρεύειν αὐτῷ, ἀφόβως is most naturally construed with λατρεύειν, not with ῥυσθέντας. The note should give a genuine lexical alternative rather than introduce doubtful ambiguity.
  - severity: low
    issue: The primary wording for “without fear” is somewhat less natural than available Standard Igbo phrasing.
    rationale: “N’enweghị egwu” idiomatically expresses the adverbial sense “without fear,” while “n’atụghị egwu” can sound less direct in this construction.
