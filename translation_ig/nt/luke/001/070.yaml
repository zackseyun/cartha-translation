  text: καθὼς ἐλάλησεν διὰ στόματος τῶν ⸀ἁγίων ἀπ’ αἰῶνος προφητῶν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/070.yaml
  text: just as he spoke through the mouth of his holy prophets from of old,[a]
translation:
  language: ig
  text: dị ka o kwuru site n’ọnụ ndị amụma ya dị nsọ site n'oge ochie,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịtụgharị ya dịka, “site n’oge dị anya gara aga.” Nkebi okwu a nwere ike ịpụta oge dị nnọọ anya gara aga. Ụfọdụ na-ewere ya n’ụzọ siri ike karị dịka “site na mgbe ebighị ebi,” ma n’ebe a, ntụaka e kwuru banyere ndị amụma na-akwado nghọta nke “site n'oge ochie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: dị ka
  rationale: Ọ na-egosi na ihe a dabara n’ihe Chineke kwuru na mbụ; ‘dị ka’ bụ ụzọ Igbo doro anya ma dịkwa mma isi gosipụta ya.
- source_word: ἐλάλησεν
  choice: o si kwuo
  rationale: Oge gara aga nke λαλέω pụtara ikwu okwu. Usoro a na-ejikọta n'ụzọ eke na nkebi na-esote, ‘site n’ọnụ.’
- source_word: διὰ στόματος
  choice: site n’ọnụ
  rationale: E debere ihe atụ doro anya nke ‘ọnụ’ iji gosipụta na Chineke ji ndị amụma zisa okwu ya, kama ime ka ọ bụrụ naanị ‘site n’aka.’
- source_word: τῶν ἁγίων ... προφητῶν
  choice: ndị amụma ya dị nsọ
  rationale: ἁγίων na-akọwa προφητῶν. Nke a na-egosi na ha bụ ndị amụma Chineke e kewapụrụ nye ya.
- source_word: ἀπ’ αἰῶνος
  choice: kemgbe oge ochie
  rationale: N’ebe a, nkebi ahụ na-ezo aka n’oge dị anya gara aga nke ndị amụma, ọ bụghị n’ụzọ doro anya na mgbe ebighị ebi.
- source_word: αὐτοῦ
  choice: ya
  rationale: 'N’ọnọdụ okwu a, nnọchiaha ahụ na-ezo aka n’ebe Chineke nọ: ha bụ ndị amụma ya.'
theological_decisions:
- issue: Ókè ihe ἀπ’ αἰῶνος pụtara
  choice: kemgbe oge ochie
  alternative: site na mgbe ebighị ebi
  rationale: N’ihi na a kpọrọ ndị amụma aha ozugbo, okwu ahụ kacha dabara n’oge dị anya gara aga n’akụkọ nzọpụta. N’agbanyeghị nke ahụ, ihe e dere n’ala ala peeji na-echekwa ịdị omimi nke okwu Grik ahụ.
translation_notes:
  register: Asụsụ Igbo izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere akpaalaokwu ‘site n’ọnụ’ iji chekwaa ihe oyiyi nke okwu Grik na ọrụ ndị amụma dị ka ndị Chineke si n’ọnụ ha kwuo okwu.
