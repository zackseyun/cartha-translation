revisions:
- from: dị ka o si kwuo site n’ọnụ ndị amụma ya dị nsọ kemgbe oge ochie,[a]
  to: dị ka o kwuru site n’ọnụ ndị amụma ya dị nsọ site n'oge ochie,[a]
  rationale: The revision improves idiomatic Standard Igbo and represents the temporal force of ἀπ’ αἰῶνος without introducing a durative implication. It preserves the concrete ‘mouth’ idiom, the reference to God’s holy prophets, and the English audit trail’s appropriately cautious lexical note.
  reviewer_model: gpt-5.6-terra
