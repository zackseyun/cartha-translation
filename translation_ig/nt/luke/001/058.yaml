  to: Ndị agbata obi ya na ndị ikwu ya nụrụ na Onyenwe anyị meere ya nnukwu ebere[a], wee soro ya ṅụrịa ọṅụ.
  rationale: The revision corrects the active verb required by the Lord's agency, uses the more idiomatic expression “nnukwu ebere,” and clarifies the alternative rendering's pronoun. It retains the Greek sense that the Lord made his mercy great toward Elizabeth and that the neighbors and relatives rejoiced with her.
