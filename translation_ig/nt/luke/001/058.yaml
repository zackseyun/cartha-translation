source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: ig
  text: Ndị agbata obi ya na ndị ikwu ya nụrụ na Onyenwe anyị meere ya nnukwu ebere[a], wee soro ya ṅụrịa ọṅụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, “Onyenwe anyị mere ka ebere ya dị ukwuu n’ebe ya nọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περίοικοι
  choice: ndị agbata obi ya
  rationale: Ọ na-ezo aka ná ndị bi ya gburugburu; okwu a bụ ụzọ Igbo nkịtị si akọwa ndị agbata obi.
- source_word: συγγενεῖς
  choice: ndị ikwu ya
  rationale: Nke a na-egosi ndị ha na ya bụ otu ọbara ma ọ bụ otu ezinụlọ sara mbara; “ndị ikwu” bụ okwu Igbo doro anya ma dị ugbu a.
- source_word: ἐμεγάλυνεν
  choice: emere ... dị ukwuu
  rationale: N’usoro okwu a, ngwaa ahụ pụtara ime ka ebere pụta ìhè n’ụzọ dị ukwuu. Nsụgharị a na-edobe echiche nke ịdị ukwuu ma na-ada nke ọma n’Igbo.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: N'ebe a, okwu ahụ bụ aha nsọ a na-akpọ Chineke, ọ bụ ezie na ọ nweghị mkpụrụokwu Grik na-akọwapụta ya kpọmkwem.
- source_word: ἔλεος
  choice: ebere
  rationale: “Ebere” bụ okwu Igbo kwesịrị ekwesị maka obi ebere na enyemaka e nyere onye nọ ná mkpa, ma kwekọọkwa n’isiokwu Luk na-akọwa ebe a.
- source_word: μετ’ αὐτῆς
  choice: ya
  rationale: N’akpaala okwu Grik a, μετά na-egosi onye ebere ahụ metụtara. Iji “ya” mee ihe n’usoro “emere ya ebere” bụ ụzọ Igbo ebumpụta ụwa si kwuo ya.
- source_word: συνέχαιρον αὐτῇ
  choice: ha wee soro ya ṅụrịa ọṅụ
  rationale: Nke a na-egosi na ha sonyeere ya n’ọṅụ ya, ọ bụghị naanị na ha kelere ya.
theological_decisions:
- issue: Nsụgharị akpaala okwu ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς
  choice: Onyenwe anyị emere ya ebere dị ukwuu
  alternative: Onyenwe anyị mere ka ebere ya dị ukwuu n’ebe ọ nọ
  rationale: Nhọrọ bụ isi na-ewepụta ihe akpaala okwu Grik ahụ pụtara n’Igbo doro anya, ebe ihe ọzọ a tinyere n’ala ala peeji na-egosi n’ụzọ pụtara ìhè usoro okwu na ike ngwaa Grik ahụ. E nweghị echiche okpukpe ọzọ agbakwunyere.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta mee ihe. “Soro ya ṅụrịa ọṅụ” na-edobe echiche nke iso onye ọzọ kerịta ọṅụ, ebe “emere ya ebere dị ukwuu” na-eme ka akpaala okwu Grik doo anya n’Igbo.
