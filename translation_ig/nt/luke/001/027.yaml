  - severity: low
    issue: The final naming clause is slightly awkward in word order.
    rationale: ‘Aha nwa agbọghọ na-amaghị nwoke ahụ bụ Meri’ is more natural Igbo while retaining Luke’s repeated designation ‘virgin.’
