  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: ig
  text: n’ebe otu nwa agbọghọ na-amaghị nwoke, onye e kwere nkwa ịlụ[a] otu nwoke aha ya bụ Josef, nke si n’ụlọ Devid, nọ; aha nwa agbọghọ na-amaghị nwoke ahụ bụ Meri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye e kwere ịlụ.” Okwu Grik ahụ na-egosi nkwa alụmdi na nwunye e mere n’ụzọ iwu na omenala tupu ha amalite ibikọ dị ka di na nwunye.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Mariam,” nke dị nso karịa n’otú e si dee aha ahụ n’asụsụ Grik.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: nwa agbọghọ na-amaghị nwoke
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwanyere ùgwù si kwupụta na ọ bụ nwa agbọghọ na-amaghị nwoke; ikwughachi ya na-agbaso nkwughachi okwu Grik n’amaokwu ahụ.
- source_word: ἐμνηστευμένην
  choice: onye e kwere nkwa ịlụ
  rationale: Ọ na-egosi ọnọdụ nkwekọrịta alụmdi na nwunye e mere n’ụzọ iwu na omenala tupu ha ebikọ dị ka di na nwunye; okwu a dị mfe nghọta karịa iji okwu na-egosi naanị njikọ aka nke oge a.
- source_word: ἀνδρὶ
  choice: otu nwoke
  rationale: N’agbanyeghị na okwu Grik ahụ nwekwara ike ịpụta ‘di,’ ọnọdụ a metụtara nkwa ịlụ di, ya mere ‘nwoke’ anaghị ekwu karịa ihe amaokwu ahụ kwuru.
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: aha ya bụ Josef
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa maka ịkọ aha mmadụ, ma ọ na-ebute ihe okwu Grik ahụ pụtara n’enweghị mgbagwoju anya.
- source_word: ἐξ οἴκου Δαυίδ
  choice: onye si n’ụlọ Devid
  rationale: ‘Ụlọ Devid’ na-echekwa okwu usoro ọmụmụ na usoro eze dị n’asụsụ Akwụkwọ Nsọ; ‘si’ na-anọchi ἐξ nke ọma.
- source_word: Μαριάμ
  choice: Meri
  rationale: Meri bụ ọdịdị aha a a maara nke ọma n’Igbo; ‘Mariam’ ga-adị nso n’ụdị Grik mana ọ bụghị nke a na-ejikarị eme ihe n’Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị παρθένος n’ụzọ na-echekwa echiche nke amaghị nwoke dị mkpa n’akụkọ ọmụmụ Jizọs nke Luk
  choice: nwa agbọghọ na-amaghị nwoke
  alternative: nwa agbọghọ
  rationale: Okwu Grik ahụ na ọnọdụ ya na Luk na-akwado echiche ‘nwa agbọghọ na-amaghị nwoke’ nke ọma; nke a na-echekwa ihe amaokwu ahụ kwuru n’etinyeghị ozizi ọzọ n’ime ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, kwanyere ùgwù ma dị mfe nghọta. E debere nkwughachi παρθένος na okwu ‘nwa agbọghọ na-amaghị nwoke,’ ma chekwaa ‘ụlọ Devid’ dịka okwu usoro ọmụmụ na usoro eze nke Akwụkwọ Nsọ.
