id: LUK.1.39
reference: Luke 1:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: ig
  text: N’ụbọchị ndị ahụ, Meri biliri, jiri ọsọ gaa n’ala ugwu[a], n’otu obodo dị na Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ógbè ugwu.” Okwu Grik ahụ na-ezo aka n’ala ma ọ bụ mpaghara ugwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: biliri
  rationale: Ọ bụ participle aorist nke ἀνίστημι, nke na-egosi ihe Meri mere tupu ngwaa bụ isi; “biliri” na-edobe usoro akụkọ ahụ n’enweghị ịkọwa ya karịa ka isi mmalite kwuru.
- source_word: δὲ
  choice: ejighị okwu pụrụ iche tụgharịa ya
  rationale: δὲ bụ njikọ dị nro na-akwalite akụkọ. N’Igbo, usoro ahịrịokwu ahụ na kọma na-egosi njikọ a nke ọma; itinye “ma” ma ọ bụ “ugbu a” ga-ada ka nkwugide ma ọ bụ oge nke Grik na-ekwughị kpọmkwem.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: N’ụbọchị ndị ahụ
  rationale: Nke a bụ ntụgharị Igbo doro anya ma bụrụ nke e ji akọ akụkọ, na-edobe ntụaka oge nke ταύταις.
- source_word: ἐπορεύθη
  choice: gaa
  rationale: πορεύομαι n’ebe a pụtara ịga ma ọ bụ ime njem; “gaa” bụ okwu Igbo kachasị mfe ma dabara n’akụkọ a.
- source_word: εἰς τὴν ὀρεινὴν
  choice: n’ala ugwu
  rationale: ὀρεινή e ji ya dịka aha na-ezo aka n’ógbè ugwu; “ala ugwu” bụ okwu Igbo sitere n’okike ma na-egosi mpaghara ahụ, ọ bụghị naanị otu ugwu.
- source_word: μετὰ σπουδῆς
  choice: jiri ọsọ
  rationale: σπουδή nwere ike igosi ọsọ, ịnụ ọkụ n’obi, ma ọ bụ ịdị uchu. N’ọnọdụ njem a, “jiri ọsọ” na-egosi na ọ gara ngwa ngwa n’enweghị ịgbakwunye ihe kpatara ya.
- source_word: εἰς πόλιν Ἰούδα
  choice: n’otu obodo dị na Juda
  rationale: πόλις nwere ike ịbụ obodo ukwu ma ọ bụ obodo nta. “Obodo” na-ahapụ nha ya ghe oghe, ebe “dị na Juda” na-egosi nghọta kacha kwekọọ n’ebe a na Juda bụ mpaghara.
theological_decisions:
- issue: Ihe Ἰούδα na-ezo aka na ya
  choice: Juda dịka mpaghara ma ọ bụ ala ebo Juda
  alternative: obodo a na-akpọ Juda; ma ọ bụ Judia dịka aha mpaghara e mere ka ọ dị ire ụtọ
  rationale: N’ọnọdụ a, Ἰούδα yikarịrị ka ọ na-egosi mpaghara Juda. “Dị na Juda” na-eme ka nghọta ahụ doo anya n’Igbo ma ghara ịkọwa ya dịka aha mmadụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị nsọ n’ụdị akụkọ. Ahịrịokwu ahụ na-edobe usoro na mkpụmkpụ nke Grik. “Obodo” ahapụghị ma ọ bụ obodo ukwu ka ọ bụ obodo nta; nkọwa ala nke Juda ka e gosiri n’ụzọ sitere n’okike n’Igbo.
