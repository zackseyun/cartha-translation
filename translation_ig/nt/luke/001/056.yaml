translation_notes:
  register: E ji Igbo Izugbe nke dị ugbu a, dị mfe nghọta ma nwee ugwu dee ya. “Wee … mesịa” na-eme ka usoro akụkọ ahụ na-aga nke ọma, ebe “ihe dị ka” na-echekwa echiche nke oge a na-amaghị kpọmkwem.
