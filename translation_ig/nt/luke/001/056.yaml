  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: ig
  text: Meri nọnyere ya ihe dị ka ọnwa atọ[a], wee laghachi n’ụlọ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ὡς, mgbe e ji ya na ogologo oge mee ihe, pụrụ igosi na oge ahụ dị nso na ọnwa atọ, ọ bụghị kpọmkwem ọnwa atọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔμεινεν
  choice: nọnyeere
  rationale: N’ebe a, μένω pụtara ịnọgide n’otu ebe ruo oge ụfọdụ. “Nọnyeere” na-egosikwa na Meri nọnyere Elizabet, dịka σὺν αὐτῇ si kwuo.
- source_word: δὲ
  choice: wee
  rationale: δέ bụ njikọ dị nro n’akụkọ a. “Wee” na-ejikọta ihe omume a na nke bu ya ụzọ n’ụzọ Igbo na-ada nke ọma, n’etinyeghị echiche nke esemokwu.
- source_word: Μαριὰμ
  choice: Meri
  rationale: E ji ụdị aha a a na-ejikarị eme ihe n’Igbo mee aha Μαριάμ.
- source_word: σὺν αὐτῇ
  choice: ya
  rationale: σύν na-egosi ịnọnyere mmadụ. N’usoro okwu “nọnyeere ya,” “ya” na-ezo aka n’Elizabet site n’ihe ndị gbara amaokwu a gburugburu.
- source_word: ὡς μῆνας τρεῖς
  choice: ihe dị ka ọnwa atọ
  rationale: ὡς n’ihu oge a tụrụ atụ na-egosi na ọnụ ọgụgụ ahụ abụghị kpọmkwem. “Ihe dị ka ọnwa atọ” bụ ụzọ Igbo doro anya ma bụrụkwa nke mmadụ na-ekwu kwa ụbọchị.
- source_word: ὑπέστρεψεν
  choice: laghachi
  rationale: ὑποστρέφω pụtara ịlaghachi n’ebe mmadụ si bịa ma ọ bụ n’ebe ọ nọbu.
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: n’ụlọ ya
  rationale: N’ebe a, οἶκος na-ezo aka n’ebe Meri bi, ọ bụghị n’ezinụlọ ya dịka otu ndị mmadụ. “N’ụlọ ya” na-egosipụta njem ahụ nke ọma.
