  yaml_path: translation/nt/luke/001/040.yaml
  text: and entered the house of Zechariah and greeted Elizabeth[a][b].
translation:
  language: ig
  text: Ọ banyere n'ụlọ Zekaraya, kelee Elizabet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: banyere
  rationale: Ngwaa a na-egosi na ọ banyere n’ime otu ebe; “banyere” bụ okwu Igbo doro anya ma bụrụkwa nke e ji akọ omume ahụ n’ụzọ nkịtị.
- source_word: οἶκον
  choice: ụlọ
  rationale: N’ebe a, εἰς na-egosi ebe a banyere, ya mere “ụlọ” na-ezo aka n’ebe obibi ahụ kpọmkwem, ọ bụghị ezinụlọ dị ka ìgwè mmadụ.
- source_word: Ζαχαρίου
  choice: Zakaraya
  rationale: E dere aha ahụ n’ụdị a maara nke ọma n’Igbo, nke kwekọrọ n’aha Hibru ahụ.
- source_word: ἠσπάσατο
  choice: kelee
  rationale: “Kelee” bụ ụzọ Igbo kachasị eke isi kwuo na mmadụ nyere onye ọzọ ekele mgbe ha zutere; ọ naghị etinye echiche nnabata ma ọ bụ emume pụrụ iche na-adịghị n’isi mmalite.
- source_word: Ἐλισάβετ
  choice: Elizabet
  rationale: E degharịrị aha ahụ n’ụdị dị mfe ma bụrụ nke ndị na-agụ Igbo maara.
- source_word: καὶ
  choice: Ọ …,
  rationale: καί nke mbụ jikọtara amaokwu a na akụkọ gara aga. N’Igbo, ịmalite ahịrịokwu ọhụrụ site n’isiokwu “Ọ” na-eme ka okwu ahụ bụrụ nke eke n’enweghị ịgbanwe usoro omume.
- source_word: καὶ
  choice: ', kelee'
  rationale: καί nke abụọ jikọtara omume abụọ sochiri ibe ha; akara rikoma na usoro ngwaa ndị so ibe ha na-egosipụta njikọ ahụ n’Igbo n’ụzọ eke.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E ji usoro ngwaa ndị so ibe ha mee ka akuko ahụ na-aga were were, ma chekwaa ihe isi mmalite ahụ kwuru n’enweghị nkọwa agbakwunyere.
