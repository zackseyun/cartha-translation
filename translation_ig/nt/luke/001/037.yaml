  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: ig
  text: N’ihi na ọ dịghị okwu sitere n’aka Chineke ga-agaghị ekwe omume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N’ebe Chineke nọ, ọ dịghị ihe ga-agaghị ekwe omume.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: N’ọnọdụ a, ọ na-egosi ihe mere okwu Gebriel kwuru tupu ya ji bụrụ eziokwu; “N’ihi na” na-enye njikọ nkọwa ahụ n’Igbo.
- source_word: οὐκ ἀδυνατήσει
  choice: nke ga-agaghị ekwe omume
  rationale: Nke a na-egosipụta echiche ọdịnihu nke ịbụ ihe na-agaghị ekwe omume, ma na-ada nke ọma n’Igbo mgbe e jikọtara ya na “ọ dịghị okwu.”
- source_word: παρὰ τοῦ θεοῦ
  choice: sitere n’aka Chineke
  rationale: Παρά na genitive nwere ike igosi ebe ihe si; ebe e jikọtara ya na ῥῆμα, okwu a na-echekwa echiche nke okwu sitere n’aka Chineke.
- source_word: πᾶν
  choice: ọ dịghị
  rationale: Ọ bụ ezie na πᾶν pụtara “ihe niile/okwu niile,” usoro negetivu “ọ dịghị ... nke ga-agaghị” na-egosipụta ike ya zuru ụwa ọnụ n’Igbo nkịtị.
- source_word: ῥῆμα
  choice: okwu
  rationale: “Okwu” na-echekwa ihe ῥῆμα pụtara dịka okwu e kwuru ma ọ bụ nkwupụta, ma kwe ka ọnọdụ ahụ gosi na ọ bụ okwu Chineke kwupụtara.
theological_decisions:
- issue: Ihe παρὰ τοῦ θεοῦ πᾶν ῥῆμα pụtara
  choice: Amaokwu ahụ kwuru na ọ dịghị okwu sitere n’aka Chineke nke ga-agaghị ekwe omume.
  alternative: N’ebe Chineke nọ, ọ dịghị ihe ga-agaghị ekwe omume.
  rationale: Ụzọ abụọ ahụ kwekọrọ na ụtọasụsụ Grik. Isi ederede na-echekwa “okwu,” ebe ọ bụ na ῥῆμα dị kpọmkwem na Grik ma kwekọọ n’okwu Gebriel gwara Meri; ihe odide ala peeji na-echekwa nghọta ọdịnala nke na-elekwasị anya n’ike Chineke.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. E ji “sitere n’aka Chineke” chekwaa echiche nke isi mmalite, ebe e debere nghọta ọzọ n’ihe odide ala peeji ka e ghara idozi mgbagwoju anya nke Grik n’ụzọ nzuzo.
