  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: ig
  text: Mgbe ụbọchị ọrụ ya zuru[a], ọ gara n'ụlọ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ọrụ” a bụ ọrụ e kenyere Zekaraya ịrụ dịka onye nchụàjà n'ụlọ nsọ.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsị, “n'ebe obibi ya.” Okwu Grik ahụ nwere ike ịpụta ụlọ ahụ n'onwe ya ma ọ bụ, n'ụzọ sara mbara, ebe obibi ya na ezi-na-ụlọ ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: (e gosipụtaghị ya iche)
  rationale: N'okwu Grik, nke a bụ usoro Luk ji akwọ akụkọ n'ihu. Igbo nkịtị adịghị achọ ka a sụgharịa ya iche n'ebe a; “Mgbe…” na-ebute ihe merenụ n'ụzọ doro anya ma dị ndụ.
- source_word: ὡς
  choice: Mgbe
  rationale: Ọ na-ebute nkebiokwu oge n'ebe a; “Mgbe” bụ okwu Igbo kacha kwekọọ n'ụzọ ebumpụta ụwa.
- source_word: ἐπλήσθησαν
  choice: zuru
  rationale: Ọ na-egosi na ụbọchị ndị e kenyere ya eruola n'isi njedebe ha. “Zuru” na-ekwupụta nke a nkenke ma ghara itinye echiche ọzọ.
- source_word: λειτουργίας
  choice: ozi ya
  rationale: N'ebe akụkọ a dị, ọ bụ ọrụ e kenyere Zekaraya ịrụ dịka onye nchụàjà n'ụlọ nsọ. “Ozi” bụ okwu Igbo dị ùgwù ma dị mfe; nkọwa ala peeji na-eme ka ọnọdụ ya doo anya.
- source_word: ἀπῆλθεν
  choice: ọ laghachiri
  rationale: N'ihi na ebe ọ na-aga bụ ụlọ ya, “laghachiri” na-enye mmegharị ahụ n'ụzọ Igbo nkịtị, ọ bụ ezie na ngwaa Grik n'onwe ya pụtara ịpụ ma ọ bụ ịga.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: n'ụlọ ya
  rationale: οἶκος nwere ike izo aka n'ụlọ dịka ụlọ e wuru ma ọ bụ n'ebe obibi na ezi-na-ụlọ. “N'ụlọ ya” bụ nkebiokwu Igbo ebumpụta ụwa ma na-ahapụ ohere abụọ ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe ma dị ùgwù. A hapụrụ usoro akụkọ Grik ἐγένετο n'ebughị ya iche, n'ihi na ịmalite na “Mgbe” na-asụ Igbo nke ọma. E tinyere akara ala peeji niile n'akụkụ okwu ha na-akọwa.
