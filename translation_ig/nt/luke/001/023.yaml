    reason: cultural_note
  - marker: b
    text: A pụkwara ịsị, “n'ebe obibi ya.” Okwu Grik ahụ nwere ike ịpụta ụlọ ahụ n'onwe ya ma ọ bụ, n'ụzọ sara mbara, ebe obibi ya na ezi-na-ụlọ ya.
    reason: lexical_alternative
  revision_rationale: Replaced “laghachiri” with “gara” to avoid adding the unstated idea of return, and replaced “ozi” with the more natural and precise “ọrụ.” The temporal construction and the two footnote anchors are retained.
