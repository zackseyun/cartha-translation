- from: Mgbe ụbọchị ozi ya zuru[a], ọ laghachiri n'ụlọ ya.[b]
  to: Mgbe ụbọchị ọrụ ya zuru[a], ọ gara n'ụlọ ya.[b]
  rationale: Replaced “laghachiri” with “gara” to avoid adding the unstated idea of return, and replaced “ozi” with the more natural and precise “ọrụ.” The temporal construction and the two footnote anchors are retained.
