review_pass:
  verdict: revise
  source_fidelity: The draft preserves the comparison, the past divine speech, Abraham, the singular collective sense of σπέρμα, and the final open-ended placement of εἰς τὸν αἰῶνα. However, “o si gwa ... okwu” is not idiomatic Igbo for ἐλάλησεν, and repeating “gwa” before Abraham makes the appositional relationship less clear than in Greek.
  naturalness: “Dị nnọọ ka o si gwa ndị nna nna anyị okwu, gwa Ebreham...” is awkward because the first verbal construction is unnatural and the second recipient phrase is needlessly recast as a second act of speaking. “Dị ka o kwuru ...” is natural, dignified Standard Igbo.
  terminology: “Ndị nna ochie anyị” naturally denotes the ancestral forefathers and retains the masculine/patriarchal reference better than a neutral term. “Mkpụrụ ya” appropriately preserves the Greek singular collective and its covenantal resonance. “Ebreham” is an established Igbo biblical form.
  issues:
