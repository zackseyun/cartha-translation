  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: ig
  text: dị ka o kwuru nye ndị nna ochie anyị[a], ya bụ, Ebreham na mkpụrụ ya[b], ruo mgbe ebighị ebi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị nna nna anyị.” Okwu Grik ahụ pụtara kpọmkwem, “ndị nna anyị.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “mkpụrụ ya,” “ụmụ ya,” ma ọ bụ “ụmụ ụmụ ya.” Okwu Grik ahụ bụ aha otu ọnụ nke nwere ike ịpụta mkpụrụ ma ọ bụ ụmụ sitere n’ahụ mmadụ dịka otu ìgwè.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Nke a na-egosi na ihe a kpọrọ aha n’amaokwu bu ụzọ kwekọrọ n’ihe Chineke kwuru na mbụ; “dị nnọọ ka” na-egosipụta nkwekọrịta ahụ nke ọma n’Igbo.
- source_word: ἐλάλησεν
  choice: o si ... gwa ... okwu
  rationale: Nke a na-edobe echiche nke ikwu okwu n’oge gara aga, n’etinyeghị echiche pụrụ iche dịka “ikwe nkwa,” nke okwu Grik n’onwe ya ekwughị kpọmkwem.
- source_word: πρὸς τοὺς πατέρας ἡμῶν
  choice: ndị nna nna anyị[a]
  rationale: “Ndị nna nna anyị” bụ ụzọ e si ekwu maka ndị nna ochie n’Igbo ma ka na-echekwa okwu nwoke na njikọ ya na akụkọ ọgbụgba ndụ.
- source_word: τῷ Ἀβραὰμ
  choice: Ebreham
  rationale: E ji ụdị aha a na-ahụkarị n’Igbo dee aha Abraham; a ghọtara na ngwaa “gwa” gbasakwara ya.
- source_word: τῷ σπέρματι αὐτοῦ
  choice: mkpụrụ ya[b]
  rationale: “Mkpụrụ” na-echekwa ihe oyiyi mkpụrụ nakwa ụdị otu ọnụ nke okwu Grik, ma nwee ike ịpụta ụmụ sitere n’ahụ ya dịka otu ìgwè.
- source_word: εἰς τὸν αἰῶνα
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ okwu Igbo doro anya ma dịkwa ebube nke na-egosi ịdịgide ruo mgbe ebighị ebi.
theological_decisions:
- issue: Okwu nwoke dị na πατέρας ἡμῶν n’akụkọ ọgbụgba ndụ
  choice: ndị nna nna anyị
  alternative: ndị nna ochie anyị
  rationale: A họọrọ ụdị nke ka na-egosipụta ndị nna n’akụkọ Izrel; edoghị ya n’ụdị na-anọpụ iche nke ga-ehichapụ nkọwa ahụ.
- issue: Otu ọnụ na ihe oyiyi dị na σπέρματι αὐτοῦ
  choice: mkpụrụ ya
  alternative: ụmụ ụmụ ya; ụmụ ya niile
  rationale: “Mkpụrụ ya” na-echekwa ma ụdị otu ọnụ nke na-anọchi ìgwè ma njikọ ya na okwu e kwere Ebreham; ihe odide ahụ ekpebighị n’onwe ya na ọ bụ naanị otu onye ma ọ bụ ọtụtụ ụmụ.
- issue: Ihe εἰς τὸν αἰῶνα jikọrọ ya na ya
  choice: e debere “ruo mgbe ebighị ebi” n’isi njedebe nke ahịrịokwu
  alternative: ijikọta ya n'ụzọ doro anya naanị na “mkpụrụ ya” ma ọ bụ naanị na “gwa”
  rationale: Idowe ya n’isi njedebe na-echekwa obosara njikọ okwu Grik ma ghara idozi n’amaghị ama kpọmkwem ihe okwu oge ahụ na-akọwa.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A tụgharịrị ngwaa ugboro abụọ n’Igbo (“gwa ... okwu, gwa ...”) iji mee ka usoro ndị nnata okwu abụọ doo anya n’enweghị ịgbakwunye echiche nke “nkwa.”
