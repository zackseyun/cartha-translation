- from: Ọ[a] ga-adị ukwuu, a ga-akpọkwa ya Ọkpara Onye Kachasị Elu[b], Onyenwe anyị Chineke ga-enyekwa ya ocheeze Devid, nna ya[c].
  to: Ọ[a] ga-adị ukwuu, a ga-akpọkwa ya Nwa nwoke nke Onye Kasị Elu[b], ma Onyenweanyị Chineke ga-enyekwa ya ocheeze Devid, nna ya[c].
  rationale: The revision removes the potentially restrictive firstborn sense of “Ọkpara,” supplies the required Igbo linker, regularizes the divine title, and improves coordination while retaining the source text’s scope, register, and Davidic-ancestral ambiguity.
