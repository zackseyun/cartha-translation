    text: Ma ọ bụ, “a ga-enye ya aha Nwa nwoke nke Onye Kasị Elu.”
    reason: lexical_alternative
  - marker: c
    text: “Nna ya” na-ekwu maka Devid dịka nna nna Jizọs n’usoro ndị eze sitere n’agbụrụ Devid.
    reason: cultural_note
  revision_rationale: The revision removes the potentially restrictive firstborn sense of “Ọkpara,” supplies the required Igbo linker, regularizes the divine title, and improves coordination while retaining the source text’s scope, register, and Davidic-ancestral ambiguity.
