id: LUK.1.32
reference: Luke 1:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: ig
  text: Ọ[a] ga-adị ukwuu, a ga-akpọkwa ya Nwa nwoke nke Onye Kasị Elu[b], ma Onyenweanyị Chineke ga-enyekwa ya ocheeze Devid, nna ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye a ga-adị ukwuu.” Okwu Grik malitere na nnọchiaha ngosi nke pụtara “onye a.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “a ga-enye ya aha Nwa nwoke nke Onye Kasị Elu.”
    reason: lexical_alternative
  - marker: c
    text: “Nna ya” na-ekwu maka Devid dịka nna nna Jizọs n’usoro ndị eze sitere n’agbụrụ Devid.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: Ọ
  rationale: Nnọchiaha Igbo a na-ada nke ọma mgbe a na-ekwu banyere nwa ahụ mmụọ ozi ka kwupụtara. Ihe ngosi dị na οὗτος ka e debere n’ihe nkọwa ala peeji.
- source_word: ἔσται μέγας
  choice: ga-adị ukwuu
  rationale: Nke a na-egosipụta ọdịnihu nke ἔσται ma na-ahapụ μέγας ka ọ nwee echiche sara mbara nke ịdị ukwuu na ịdị mkpa.
- source_word: υἱὸς Ὑψίστου
  choice: Ọkpara Onye Kachasị Elu
  rationale: A sụgharịrị ya dịka aha nsọpụrụ, na-emeghị ka ọ bụrụ naanị otu n’ime ọtụtụ ụmụ. “Onye Kachasị Elu” na-echekwa aha e ji akpọ Chineke.
- source_word: κληθήσεται
  choice: a ga-akpọkwa ya
  rationale: Usoro nnọchianya a na-egosi na a ga-eji aha ma ọ bụ ọkwa a mara ya; ọ bụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: κύριος ὁ θεὸς
  choice: Onyenwe anyị Chineke
  rationale: Nke a bụ ụzọ Igbo a na-anabata nke ọma isi kwuo aha nsọpụrụ a, ma ọ naghị eme κύριος ka ọ bụrụ aha Chineke e dere dị ka YHWH.
- source_word: δώσει αὐτῷ
  choice: ga-enyekwa ya
  rationale: Ọ na-echekwa ọdịnihu na onye a na-enye ihe n’ụzọ Igbo dị mfe.
- source_word: τὸν θρόνον Δαυὶδ
  choice: ocheeze Devid
  rationale: Nke a na-echekwa asụsụ ọchịchị eze na njikọ ya na Devid.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: nna ya
  rationale: A hapụrụ okwu nna dị ka ọ dị na Grik, kama iji okwu nkọwa bụ́ nna nna ochie dochie ya.
theological_decisions:
- issue: Aha Kraịst dị na υἱὸς Ὑψίστου
  choice: Ọkpara Onye Kachasị Elu
  alternative: otu nwa nke Onye Kachasị Elu
  rationale: Akụkụ okwu a na-arụ ọrụ dịka aha nsọpụrụ e nyere Jizọs. Nsụgharị ahụ na-echekwa ịdị arọ nke okwu banyere ịbụ Ọkpara n’etinyeghị nkọwa okwukwe e mechara mepụta.
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị na “Onyenwe anyị Chineke”
  alternative: ONYE-NWE Chineke; Nna Ukwu Chineke
  rationale: Grik nwere κύριος, ọ bụghị tetragrammaton; ya mere e jighị mkpụrụedemede ukwu mee ka ihe odide ahụ kwuo karịa ihe ọ kwuru.
- issue: Devid dịka “nna ya”
  choice: E debere “nna ya” n’ahịrị bụ isi
  alternative: nna nna ya ochie; nna nna ya n’usoro eze
  rationale: Nke a na-echekwa okwu agbụrụ na nkwa ọchịchị eze dị na Grik; nkọwa ala peeji na-eme ka onye na-agụ ghọta na ọ bụ nna nna n’usoro ọmụmụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E chekwara usoro ahịrịokwu na okwu ọchịchị eze nke Grik, ma jiri njikọ okwu Igbo mee ka ọ na-aga were were.
