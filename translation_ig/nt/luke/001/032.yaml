review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the future greatness, divine designation, and Davidic throne promise. However, “Ọkpara” can specifically mean an eldest/firstborn son, a restriction not expressed by υἱός, and the title phrase lacks the needed Igbo linker “nke.” The conventional divine title is best written as the fixed expression “Onyenweanyị Chineke.”
  naturalness: The wording is broadly natural and appropriately elevated. Adding “nke” makes the title idiomatic Standard Igbo, and using “ma” to join the final coordinated clause avoids an overloaded comma sequence.
  terminology: “Nwa nwoke nke Onye Kasị Elu” represents “Son of the Most High” without adding firstborn status. “Onye Kasị Elu,” “Onyenweanyị Chineke,” “ocheeze Devid,” and “nna ya” retain biblical register and the source’s Davidic-dynastic language.
  issues:
  - severity: medium
    issue: “Ọkpara” may over-specify υἱός as eldest or firstborn son.
    rationale: The Greek says “Son,” not “firstborn/eldest son.” “Nwa nwoke” preserves male sonship without introducing that additional semantic claim.
  - severity: medium
    issue: The title phrase “Ọkpara Onye Kachasị Elu” is missing the normal linker and uses a less standard formulation.
    rationale: Standard Igbo requires “nke” in this possessive/title construction. “Onye Kasị Elu” is the established natural rendering of “the Most High.”
  - severity: low
    issue: “Onyenwe anyị” is written as an ordinary possessive phrase rather than the conventional fixed divine-title form.
    rationale: “Onyenweanyị Chineke” is the customary Standard Igbo biblical form for “the Lord God” and avoids foregrounding a literal inclusive possessive reading.
  revised_text: Ọ[a] ga-adị ukwuu, a ga-akpọkwa ya Nwa nwoke nke Onye Kasị Elu[b], ma Onyenweanyị Chineke ga-enyekwa ya ocheeze Devid, nna ya[c].
  revised_footnotes:
