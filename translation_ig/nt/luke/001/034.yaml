  text: εἶπεν δὲ Μαριὰμ πρὸς τὸν ἄγγελον· Πῶς ἔσται τοῦτο, ἐπεὶ ἄνδρα οὐ γινώσκω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: ig
  text: Ma Meri gwara mmụọ ozi ahụ[a], “Olee otú nke a ga-esi mee, ebe ọ bụ na amaghị m nwoke?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’okwu doro anya karị, “ebe mụ na nwoke enwebeghị mmekọahụ.” Okwu Grik ahụ, “ịma nwoke,” bụ okwu e ji ekwu n’ụzọ nsọpụrụ nke na-ezo aka n’inwe mmekọahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere mgbanwe ma ọ bụ ọdịiche dị n’etiti ozi mmụọ ozi ahụ na ajụjụ Meri, n’enweghị ime ka ọdịiche ahụ sie ike karịa ihe Grik kwuru.
- source_word: Μαριὰμ
  choice: Meri
  rationale: Nke a bụ ụdị aha ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: πρὸς τὸν ἄγγελον
  choice: gwara mmụọ ozi ahụ
  rationale: N’usoro akụkọ a, ἄγγελος bụ onye ozi si n’eluigwe; “mmụọ ozi” bụ okwu Igbo doro anya ma bụrụ nke a maara nke ọma.
- source_word: Πῶς ἔσται τοῦτο
  choice: Olee otú nke a ga-esi mee
  rationale: Nke a na-ajụ ụzọ ihe ahụ e kwupụtara ga-esi bụrụ eziokwu; ọ bụkwa usoro okwu dị ndụ ma doo anya n’Igbo.
- source_word: ἐπεὶ
  choice: ebe ọ bụ na
  rationale: Ọ na-ewebata ihe kpatara Meri ji jụọ ajụjụ ahụ.
- source_word: ἄνδρα
  choice: nwoke
  rationale: ἀνήρ nwere ike ịpụta nwoke ma ọ bụ di, ma n’akpaalaokwu a “nwoke” na-edobe obosara okwu Grik ma ghara ime ka ọ bụrụ naanị “di.”
- source_word: οὐ γινώσκω
  choice: amaghị m
  rationale: Ọ na-edobe akpaalaokwu dị umeala n’obi nke Grik, “ịma nwoke,” nke na-ezo aka n’inwe mmekọahụ; nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
theological_decisions:
- issue: Okwu Meri na ịtụrụ ime Jizọs
  choice: E debere akpaalaokwu ahụ, “amaghị m nwoke,” n’ahịrịokwu bụ isi.
  alternative: “ebe mụ na nwoke enwebeghị mmekọahụ” ma ọ bụ “ebe m bụ nwa agbọghọ na-amaghị nwoke”
  rationale: Okwu Grik na-eji akpaalaokwu “ịma nwoke,” nke n’ebe a na-egosi na Meri enwebeghị mmekọahụ. Nsụgharị ahụ na-edobe ihe e dere n’enweghị ịgbakwunye nkọwa karịrị ya, ebe nkọwa ala peeji na-akọwa echiche ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Olee otú nke a ga-esi mee” bụ usoro okwu Igbo ebumpụta ụwa; e debere “amaghị m nwoke” iji chekwaa akpaalaokwu na nghọta okpukpe dị n’isi mmalite.
