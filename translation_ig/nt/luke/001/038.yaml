  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: ig
  text: Meri wee sị, “Lee, abụ m odibo nwanyị Onyenweanyị[a]. Ka o meere m dịka okwu gị si dị[b].” Mmụọ ozi ahụ wee hapụ ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ohu nwanyị nke Onyenweanyị.” Okwu Grik ahụ nwere ike ịpụta ohu nwanyị ma ọ bụ odibo nwanyị.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Ka ọ dịrị m dịka okwu gị si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: wee
  rationale: Ọ bụ njikọ akụkọ dị nro; “wee” na-eme ka akụkọ na-aga n’ihu n’enweghị ịgbakwụnye nkọwa oge na-adịghị na Grik.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” na-echekwa ike okwu a ji adọta uche na ịdị nsọ nke nkwupụta Meri, ma ọ ka bụkwa okwu ndị Igbo taa na-aghọta nke ọma.
- source_word: δούλη
  choice: odibo
  rationale: Okwu Grik a bụ aha nwanyị nke nwere ike ịpụta ohu ma ọ bụ onye na-eje ozi. “Odibo” na-egosipụta nrubeisi Meri nye Onyenweanyị n’asụsụ Igbo dị ugwu ma dịkwa mfe; e debere echiche siri ike nke ịbụ ohu n’ala ala peeji.
- source_word: κυρίου
  choice: Onyenweanyị
  rationale: N’ebe a κύριος bụ aha nsọ a na-akpọ Chineke; “Onyenweanyị” bụ nsụgharị Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe.
- source_word: γένοιτό μοι
  choice: Ka ihe ahụ meere m
  rationale: Ụdị optative a na-egosi ọchịchọ na nkwenye Meri ka ihe mmụọ ozi kwuru mee ya. Ịkpọ “ihe ahụ” aha na-eme ka okwu Igbo doo anya n’enweghị ịkọwa karịa ihe dị na ọnọdụ ahụ.
- source_word: κατὰ τὸ ῥῆμά σου
  choice: dị ka okwu gị si dị
  rationale: Nke a na-echekwa echiche nke ihe ahụ ime n’ụzọ kwekọrọ kpọmkwem n’ozi mmụọ ozi kwuru.
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: wee si n’ebe ọ nọ pụọ
  rationale: Nsụgharị a na-egosi na mmụọ ozi ahụ hapụrụ ebe Meri nọ, ma na-asụ ya n’ụzọ Igbo dị mma karịa nsụgharị mkpụrụokwu kpọmkwem.
- source_word: ὁ ἄγγελος
  choice: Mmụọ ozi ahụ
  rationale: N’akụkọ a, okwu ahụ na-ekwu maka onye ozi sitere n’eluigwe, ọ bụghị naanị onye ozi mmadụ.
theological_decisions:
- issue: Otu e si sụgharị δούλη, aha Meri kpọrọ onwe ya
  choice: odibo Onyenweanyị
  alternative: ohu nwanyị nke Onyenweanyị
  rationale: δούλη nwere ike ịpụta ohu nwanyị ma ọ bụ odibo. N’ọnọdụ a, isi ihe bụ ịdị umeala n’obi na nrubeisi Meri nye Chineke; ala ala peeji na-echekwa echiche siri ike nke ịbụ onye nwe ya nwere ikike n’ahụ ya.
- issue: Ike okwu γένοιτό μοι nwere
  choice: Ka ihe ahụ meere m dị ka okwu gị si dị
  alternative: Ka ọ dịrị m dị ka okwu gị si dị
  rationale: Okwu a abụghị nanị amụma banyere ihe ga-eme; ọ na-egosipụta ọchịchọ na nkwenye Meri. Nsụgharị a na-echekwa nkwenye ahụ n’enweghị itinye echiche okpukpe ọzọ n’ime ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta, dee amaokwu ahụ. “Lee” na “Onyenweanyị” na-echekwa ụda dị nsọ nke okwu ahụ, ebe usoro ahịrịokwu ndị ọzọ na-anọgide n’ụdị okwu ndị mmadụ na-aghọta ngwa ngwa.
