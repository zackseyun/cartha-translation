revisions:
- from: Meri wee sị, “Lee, abụ m odibo Onyenweanyị[a]. Ka ihe ahụ meere m dị ka okwu gị si dị[b].” Mmụọ ozi ahụ wee si n’ebe ọ nọ pụọ.
  to: Meri wee sị, “Lee, abụ m odibo nwanyị Onyenweanyị[a]. Ka o meere m dịka okwu gị si dị[b].” Mmụọ ozi ahụ wee hapụ ya.
  rationale: The revision explicitly marks Mary’s feminine self-designation, removes an unnecessary supplied noun while maintaining the optative wish, and corrects the final clause so that the angel departs from Mary, as in the Greek.
