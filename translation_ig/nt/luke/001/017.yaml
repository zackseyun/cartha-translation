    text: Okwu bụ́ “n’mmụọ na ike Ịlaịja” na-ezo aka n’ọrụ amụma na ike yiri nke Ịlaịja; ọ dịghị mkpa ka ọ pụta na Ịlaịja n’onwe ya alọghachila.
    reason: cross_reference
