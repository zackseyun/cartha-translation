id: LUK.1.17
reference: Luke 1:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: ig
  text: Ọ ga-aga n’ihu ya n’mmụọ na ike Ịlaịja,[a] ka ọ tụgharịa obi ndị nna n’ebe ụmụ ha nọ,[b] ma tụgharịa ndị na-enupụ isi gaa n’ezi nghọta ndị ezi omume,[c] ka o wee kwadebeere Onyenwe anyị ndị mmadụ dị njikere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu bụ́ “n’mmụọ na ike Ịlaịja” na-ezo aka n’ọrụ amụma na ike yiri nke Ịlaịja; ọ dịghị mkpa ka ọ pụta na Ịlaịja n’onwe ya alọghachila.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “obi ndị nna chere ụmụaka ihu.” Okwu a na-ekwughachi Malakaị 4:6, ọ pụkwara igosi ime ka udo na ịdị n’otu laghachi n’ezinụlọ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “gaa n’ụzọ echiche ndị ezi omume,” ma ọ bụ “n’ime ezi nghọta ndị ezi omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: ọ ga-aga n’ihu ya
  rationale: Nke a na-egosi na ọ ga-ebu onye ahụ ụzọ n’ozi ya, ma ọ naghị akọwapụta onye nnọchiaha ahụ karịa ka Grik si mee.
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: n’ime mmụọ na ike Ịlaịja
  rationale: Ọ na-edobe okwu Grik nke na-egosi ụdị ọrụ amụma na ike e jikọtara ya na Ịlaịja, n’enweghị ikwu na onye ahụ bụ Ịlaịja n’onwe ya.
- source_word: ἐπιστρέψαι
  choice: ka ọ tụgharịa … tụgharịakwa
  rationale: Infinitive ndị a na-egosi ebumnuche; ‘tụgharịa’ na-edobekwa njikọ ahụ na Malakaị 4:6.
- source_word: καρδίας πατέρων ἐπὶ τέκνα
  choice: obi ndị nna n’ebe ụmụ ha nọ
  rationale: Nke a bụ Igbo doro anya nke na-echekwa ntụziaka nke ἐπί na echiche nke ime ka mmekọrịta dịghachi mma.
- source_word: ἀπειθεῖς
  choice: ndị na-enupụ isi
  rationale: Okwu a na-egosi ndị jụrụ ikwenye ma ọ bụ irube isi; ntụgharị a na-echekwa akụkụ nnupụisi nke okwu ahụ.
- source_word: ἐν φρονήσει δικαίων
  choice: gaa n’amamihe ndị ezi omume
  rationale: N’usoro ahịrịokwu a, ọ na-akọwa ebe ma ọ bụ ụkpụrụ echiche a na-atụgharị ndị na-enupụ isi ka ha soro; ‘amamihe’ na-agụnye nghọta na ezi mkpebi omume.
- source_word: κυρίῳ
  choice: Onyenwe anyị
  rationale: Dative a na-egosi onye a na-akwadebere ndị ahụ; aha ahụ ka a hapụrụ dịka ‘Onyenwe anyị’ n’enweghị ịkọwapụta onye ọ bụ n’ime isi okwu.
- source_word: λαὸν κατεσκευασμένον
  choice: otu ndị dị njikere
  rationale: Perfect passive participle ahụ na-emesi ọnọdụ njikere nke sitere ná nkwadebe ike; okwu Igbo a dị mfe ma na-echekwa ihe ahụ.
theological_decisions:
- issue: Ihe okwu banyere Ịlaịja pụtara
  choice: Ọ ga-arụ ọrụ n’ụdị mmụọ na ike e ji mara Ịlaịja.
  alternative: Ịlaịja n’onwe ya alọghachila n’ahụ́ nkịtị.
  rationale: Grik kwuru ‘n’ime mmụọ na ike Ịlaịja,’ ọ bụghị na onye ahụ bụ Ịlaịja n’onwe ya; ya mere, e chekwara njikọ amụma ahụ n’enweghị itinye ozizi ọzọ.
- issue: Onye ‘ya’ na ‘Onyenwe anyị’ na-ezo aka na ya
  choice: E debere nnọchiaha na utu aha dịka ha dị na Grik.
  alternative: Ịgbasa ha n’isi okwu ka ha bụrụ ‘Mesaya’ ma ọ bụ ‘Jizọs.’
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-enyere onye na-agụ ya aka ịmata onye a na-ekwu maka ya, ma amaokwu ahụ n’onwe ya anaghị akpọ aha ahụ kpọmkwem.
- issue: Njikọ dị n’etiti ndị na-enupụ isi na amamihe ndị ezi omume
  choice: A ghọtara ya dịka ịtụgharị ha gaa n’ụzọ nghọta na ezi mkpebi ndị ezi omume.
  alternative: Ịsụgharị ἐν naanị dịka ‘n’ime,’ nke nwere ike ime ka njikọ okwu ahụ ghara ido anya n’Igbo.
  rationale: Ọ bụ ezie na ἐν pụtara ‘n’ime’ n’ọtụtụ ebe, ebe a ọ na-esochi echiche nke ἐπιστρέψαι ma nwee ike igosi ntụziaka ma ọ bụ ọnọdụ a na-akpọbata mmadụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ ‘ya’ n’enweghị ịgbasa ya ka e wee chekwaa mgbagwoju anya dị n’amaokwu Grik. E tinyere akara ndetu ala peeji niile n’ebe okwu ha na-akọwa dị.
