revisions:
- from: Ọ ga-aga n’ihu ya n’ime mmụọ na ike Ịlaịja,[a] ka ọ tụgharịa obi ndị nna n’ebe ụmụ ha nọ,[b] tụgharịakwa ndị na-enupụ isi gaa n’amamihe ndị ezi omume,[c] ka o wee kwadebere Onyenwe anyị otu ndị dị njikere.
  to: Ọ ga-aga n’ihu ya n’mmụọ na ike Ịlaịja,[a] ka ọ tụgharịa obi ndị nna n’ebe ụmụ ha nọ,[b] ma tụgharịa ndị na-enupụ isi gaa n’ezi nghọta ndị ezi omume,[c] ka o wee kwadebeere Onyenwe anyị ndị mmadụ dị njikere.
  rationale: The revision corrects the final-clause grammar so that the people, not the Lord, are prepared, and makes two limited lexical idiom improvements. It retains the Greek pronoun ambiguity, the Malachi allusion, and the non-dogmatic sense of Elijah-like prophetic ministry.
