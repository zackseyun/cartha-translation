id: LUK.1.31
reference: Luke 1:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: ig
  text: Ma lee, ị ga-atụrụ ime, mụọkwa nwa nwoke, ị ga-akpọkwa aha ya Jizọs.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo doro anya nke na-adọta uche onye na-ege ntị ma na-edobe ụda nkwupụta dị nsọ nke ἰδού.
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: ị ga-atụrụ ime
  rationale: Akpaokwu Igbo “ịtụrụ ime” na-egosipụta n'ụzọ eke ma doo anya ihe akpaokwu Grik a pụtara, ya bụ ịtụrụ nwa n’afọ.
- source_word: τέξῃ
  choice: mụọkwa
  rationale: “Ịmụ nwa” bụ ụzọ Igbo nkịtị si ekwu ịmụpụta nwa; “-kwa” na-egosipụta njikọ καὶ.
- source_word: υἱόν
  choice: nwa nwoke
  rationale: “Nwa nwoke” na-echekwa nkọwa nwoke kpọmkwem dị na υἱόν.
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ị ga-akpọkwa aha ya
  rationale: Nke a na-echekwa usoro okwu ịkpọ aha dị n’asụsụ Grik, ma bụrụkwa akpaokwu Igbo a na-aghọta nke ọma.
- source_word: Ἰησοῦν
  choice: Jizọs
  rationale: “Jizọs” bụ ụdị aha ahụ a na-ejikarị eme ihe n’Igbo Standard n’Agba Ọhụrụ.
theological_decisions:
- issue: Ntughari usoro ịkpọ aha καλέσεις τὸ ὄνομα αὐτοῦ
  choice: ị ga-akpọkwa aha ya Jizọs
  alternative: ị ga-agụ ya Jizọs
  rationale: Nhọrọ bụ isi na-echekwa usoro okwu Grik na ụda amụma nke Akwụkwọ Nsọ, n’enweghị itinye nkọwa ụka ọ bụla; ụdị ọzọ dị nkenke karị ma na-eme ka usoro ahụ dị larịị.
translation_notes:
  register: Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. E debere “Lee” iji chekwaa ọrụ ἰδού dị ka okwu na-adọta uche; e jighị akara nkọwa ala peeji n’ihi na ederede Igbo anaghị achọ nkọwa ọzọ ebe a.
