  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: ig
  text: O welitela mpi nke nzọpụta nye anyị n’ụlọ Devid, ohu ya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye Nzọpụta dị ike.” N’ụzọ nkịtị, “mpi nke nzọpụta,” bụ ihe oyiyi Akwụkwọ Nsọ na-egosi ike dị ukwuu nke na-eweta nnapụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: O mewokwa ka ... bilie
  rationale: Aorist ahụ na-akọ ihe Chineke mere; usoro a na-echekwa ihe oyiyi nke ime ka onye nzọpụta bilie ma na-adaba n’abụ amụma Zekaraya.
- source_word: κέρας σωτηρίας
  choice: mpi nke nzọpụta
  rationale: E debere ihe oyiyi Akwụkwọ Nsọ nke mpi, nke na-anọchi anya ike na nzọpụta mmeri, kama ịkọwa ya ozugbo dịka onye nzọpụta dị ike.
- source_word: ἡμῖν
  choice: nye anyị
  rationale: Dative a na-egosi uru omume Chineke bara anyị.
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: n’ụlọ Devid
  rationale: ‘Ụlọ’ na-ezo aka n’agbụrụ ma ọ bụ usoro eze Devid, ma idebe okwu ahụ na-echekwa njikọ ya na ọgbụgba ndụ Devid.
- source_word: παιδὸς αὐτοῦ
  choice: ohu ya
  rationale: N’ebe a παῖς pụtara Devid dịka onye na-ejere Chineke ozi, ọ bụghị dịka nwata.
theological_decisions:
- issue: Ma a ga-edebe ihe atụ ‘mpi nke nzọpụta’ ka a ga-akọwa ya dịka ‘Onye Nzọpụta dị ike’
  choice: E debere ‘mpi nke nzọpụta’ n’ahịrịokwu bụ isi.
  alternative: Onye Nzọpụta dị ike
  rationale: Okwu Grik ahụ ji ihe oyiyi Akwụkwọ Nsọ gbasara ike eze na nzọpụta mmeri; idebe ya na-echekwa njikọ edemede na nkà mmụta okpukpe ya, ebe nkọwa ala peeji na-enyere onye na-agụ ya aka.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E debere ‘mpi’ na ‘ụlọ Devid’ iji chekwaa ihe oyiyi na njikọ Akwụkwọ Nsọ; nkọwa ala peeji na-akọwa ihe ‘mpi’ pụtara.
