    issue: Periphrastic rendering of ἤγειρεν
    rationale: ‘O mewokwa ka mpi ... bilie’ literally means ‘He has also caused a horn ... to rise’ and adds the sense of ‘also’ through -kwa while weakening the direct ‘raised up’ expression. ‘O welitela’ is a more direct and natural equivalent.
