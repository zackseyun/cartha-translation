id: LUK.1.5
reference: Luke 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: ig
  text: N’oge Herọd[a], eze Judia, e nwere otu onye nchụàjà aha ya bụ Zakarịa, onye si n’òtù ndị nchụàjà nke Abịa[b]. O nwere nwunye sitere n’ụmụ nwanyị Erọn, aha ya bụ Elizabet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Herọd a bụ Herọd Ukwu, onye Rom mere eze Judia.
    reason: historical_note
  - marker: b
    text: “Òtù ndị nchụàjà nke Abịa” bụ otu n’ime òtù ndị e kewara ndị nchụàjà ka ha na-eje ozi n’ụlọ nsọ.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: N’oge ... e nwere
  rationale: Ụdị a na-asụ Igbo nke ọma ma na-edobe usoro mmalite akụkọ na echiche ịdị adị nke onye a na-ewebata.
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: Herọd, eze Judia
  rationale: Ọ na-egosipụta aha, ọkwa ọchịchị, na ókèala ya n'ụzọ doro anya ma dị mkpirikpi.
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: otu onye nchụàjà aha ya bụ Zakarịa
  rationale: “Otu onye” na-eburu ike nke τις dịka mmeghe onye a na-akọ banyere ya, ebe “aha ya bụ” bụ usoro Igbo ebumpụta ụwa.
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: onye si n’òtù ndị nchụàjà nke Abịa
  rationale: ἐφημερία bụ otu ọrụ ndị nchụàjà, ọ bụghị naanị òtù mmadụ n’ozuzu; itinye “ndị nchụàjà” na-eme ka ihe ụlọ nsọ a pụta ìhè.
- source_word: γυνὴ αὐτῷ
  choice: nwunye ya
  rationale: Dative a na-egosi ihe mmadụ nwere; “nwunye ya” bụ Igbo dị mfe ma kwesị ntụkwasị obi.
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: sikwa n’ụmụ nwanyị Erọn
  rationale: A hapụrụ ihe oyiyi ezinụlọ nke Grik—“ụmụ nwanyị Erọn”—n’isiokwu, n’agbanyeghị na ọ na-ezo aka n’agbụrụ Erọn.
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: aha ya bụ Elizabet
  rationale: Nke a bụ usoro ịkpọ aha mmadụ nke na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Okwu gbasara agbụrụ Elizabet
  choice: sikwa n’ụmụ nwanyị Erọn
  alternative: sikwa n’ụmụ Erọn
  rationale: Nhọrọ a na-edobe okwu Grik θυγατέρων, “ụmụ nwanyị,” na nkwusi ike ya n’agbụrụ ndị nchụàjà, kama ịkọwa ya n’ụzọ sara mbara n’isiokwu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu dị na ya ma dị mfe nghọta. E ji “onye nchụàjà” na “òtù ndị nchụàjà” mee ka ọnọdụ ọrụ ụlọ nsọ doo anya. Akara nkọwa ala ala peeji [a] na [b] dị n’isiokwu n’ebe ha kwesịrị ịdị.
