- from: N’oge Herọd[a], eze Judia, e nwere otu onye nchụàjà aha ya bụ Zakarịa, onye si n’òtù ndị nchụàjà nke Abịa[b]; nwunye ya sikwa n’ụmụ nwanyị Erọn, aha ya bụ Elizabet.
  to: N’oge Herọd[a], eze Judia, e nwere otu onye nchụàjà aha ya bụ Zakarịa, onye si n’òtù ndị nchụàjà nke Abịa[b]. O nwere nwunye sitere n’ụmụ nwanyị Erọn, aha ya bụ Elizabet.
