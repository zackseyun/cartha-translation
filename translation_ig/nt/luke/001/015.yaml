id: LUK.1.15
reference: Luke 1:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: ig
  text: N’ihi na ọ ga-abụ onye ukwu n’ihu Onyenwe anyị, ọ gaghị aṅụ mmanya vaịn na ihe ọṅụṅụ ọzọ na-aba n’anya ma ọlị[a][b], ọ ga-ejupụtakwa na Mmụọ Nsọ ọbụna malite n’afọ nne ya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ gaghị aṅụ mmanya vaịn na ihe ọṅụṅụ ọzọ na-aba n’anya n’ezie.” Grik na-agọnahụ omume ahụ n’ụzọ siri ike.
    reason: lexical_alternative
  - marker: b
    text: “Ihe ọṅụṅụ ọzọ na-aba n’anya” pụtara ihe ọṅụṅụ na-aba n’anya nke na-abụghị mmanya vaịn.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “mgbe ọ ka nọ n’afọ nne ya,” ma ọ bụ, “site n’afọ nne ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: onye ukwu
  rationale: Nke a na-egosi ịdị ukwuu na ịbụ onye dị mkpa n’ụzọ doro anya, n’enweghị ịkọwa ụdị ịdị ukwuu ahụ karịa ihe Grik kwuru.
- source_word: ἐνώπιον τοῦ κυρίου
  choice: n’ihu Onyenwe anyị
  rationale: Ọ bụ okwu Igbo e ji ekwu na mmadụ nọ n’anya ma ọ bụ n’ihu onye nwe ikike; ọ na-echekwa echiche nke ịbụ onye ukwu n’anya Chineke.
- source_word: οἶνον καὶ σίκερα
  choice: mmanya vaịn ma ọ bụ ihe ọṅụṅụ na-egbu egbu
  rationale: “Mmanya vaịn” na-akọwa οἶνος kpọmkwem, ebe “ihe ọṅụṅụ na-egbu egbu” na-ekpuchi σίκερα, ya bụ ihe ọṅụṅụ na-aba n’anya ndị ọzọ na-abụghị mmanya vaịn.
- source_word: οὐ μὴ πίῃ
  choice: ọ gaghị aṅụ ... ma ọlị
  rationale: Njikọ “ọ gaghị” na “ma ọlị” na-egosipụta nkwupụta ọdịnihu siri ike nke οὐ μή, n’ebughị ya ozugbo ka iwu.
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: a ga-ejupụtakwa ya na Mmụọ Nsọ
  rationale: Ụdị a na-echekwa olu nnara nke ngwaa ahụ ma na-egosi Mmụọ Nsọ dịka onye Chineke.
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: ọbụna site n’afọ nne ya
  rationale: Nke a na-echekwa ma nkwusi ike nke ἔτι ma mmalite oge nke ἐκ, ma ghara ikpebi ma ọ pụtara mgbe ọ ka nọ n’afọ nne ya ma ọ bụ site n’oge ahụ gaa n’ihu.
theological_decisions:
- issue: Ike nke οὐ μὴ πίῃ n’amụma mmụọ ozi
  choice: 'Nkwupụta ọdịnihu siri ike: “ọ gaghị aṅụ ... ma ọlị”'
  alternative: 'Iwu ma ọ bụ ọrụ e nyere ya: “ọ kwesịghị ịṅụ mgbe ọ bụla”'
  rationale: Grik na-ekwusi agọnahụ omume ahụ ike, ma usoro ya bụ nkwupụta ọdịnihu. Nsụgharị a na-echekwa ike ahụ n’etinyeghị iwu kpọmkwem n’ebe ederede ahụ hapụrụ njikọ ya na nraranye Jọn ka a ghọta ya site n’ọnọdụ okwu.
- issue: Onye πνεύματος ἁγίου na-ezo aka na ya
  choice: Mmụọ Nsọ dịka onye Chineke
  alternative: mmụọ nsọ dịka ike ma ọ bụ ọnọdụ na-abụghị onye
  rationale: Ojiji Luk na ọnọdụ akụkọ a na-akwado na okwu ahụ na-ezo aka na Mmụọ Chineke, ya mere e ji mkpụrụedemede ukwu dee ya.
- issue: Oge nke ijupụta na Mmụọ Nsọ
  choice: “ọbụna site n’afọ nne ya”
  alternative: “mgbe ọ ka nọ n’afọ nne ya”
  rationale: Nkebiokwu Grik nwere ike igosi mmalite site n’afọ nne ma ọ bụ ọnọdụ mgbe ọ ka nọ n’ime ya. Isi ederede na-ahapụ oghere ahụ dịka Grik si mee.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E ji “Onyenwe anyị” mee κύριος dịka aha e ji ezo aka na Chineke; e zere okwu ụka nke otu denominashọn. Ahịrịokwu ahụ na-agbaso usoro echiche Grik ma na-ada ka Igbo nke oge a.
