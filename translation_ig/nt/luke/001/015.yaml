    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “mgbe ọ ka nọ n’afọ nne ya,” ma ọ bụ, “site n’afọ nne ya.”
    reason: lexical_alternative
  revision_rationale: The revision restores the source's coordination of wine and σίκερα, improves the natural Standard Igbo expression for Spirit-filling, and clarifies that σίκερα denotes an alcoholic drink other than wine. It retains the strong future negation and preserves the Greek phrase's temporal latitude concerning the mother's womb.
