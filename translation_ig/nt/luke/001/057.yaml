  naturalness: “Mgbe oge Elizabet ji mụọ nwa ruru” is idiomatic Standard Igbo for the completion of her pregnancy term. “Ọ mụkwara nwa nwoke” gives a smooth narrative continuation and retains the force of καί without unnecessary repetition.
