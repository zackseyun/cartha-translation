  text: Τῇ δὲ Ἐλισάβετ ἐπλήσθη ὁ χρόνος τοῦ τεκεῖν αὐτήν, καὶ ἐγέννησεν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: ig
  text: Mgbe oge Elizabet ji mụọ nwa ruru[a], ọ mụkwara nwa nwoke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ na-agbaso okwu Grik nso karị, “oge Elizabet ji mụọ nwa mezuru.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma mgbe
  rationale: δὲ bụ njikọ dị nro na-akwalite akụkọ n’ihu. N'Igbo, “Ma mgbe” na-ejikọta amaokwu a na ihe bu ya ụzọ n'ụzọ eke, n'etinyeghị okwu pụtara “ugbu a” nke na-adịghị n'isi mmalite.
- source_word: ἐπλήσθη ὁ χρόνος
  choice: oge ruru
  rationale: Nkebi a pụtara na oge ime Elizabet ezuola. “Oge ruru” bụ ụzọ Igbo dị ugbu a na nke doro anya isi kwuo ya, ebe nkọwa nkịtị dịka “oge mezuru” agaghị ada nke ọma n'ọnọdụ ọmụmụ nwa.
- source_word: τοῦ τεκεῖν αὐτήν
  choice: ka Elizabet mụọ nwa
  rationale: Articular infinitive a na-egosi ihe oge ahụ ruru ime, ya bụ ịmụ nwa. Ikwughachi aha Elizabet na-eme ka ntụaka ahụ doo anya ma kwekọọ n'usoro okwu Igbo.
- source_word: ἐγέννησεν
  choice: ọ mụrụ
  rationale: Ngwaa a na-akọ omume ọmụmụ nwa nke mezuru. “Ọ mụrụ” bụ okwu Igbo dị nkenke ma bụrụ nke a na-ejikarị eme ihe.
- source_word: υἱόν
  choice: nwa nwoke
  rationale: υἱός na-akọwapụta nwa nwoke kpọmkwem, ya mere e chekwara nkọwa gbasara okike nwa ahụ.
- source_word: Ἐλισάβετ
  choice: Elizabet
  rationale: E degharịrị aha ahụ dịka usoro mkpụrụokwu na ụda Igbo si dị.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ugwu ma dị mfe nghọta. Isi ahịrịokwu jiri akpaalaokwu Igbo eke mee ka nkọwa nke oge ime zuru ezu pụta ìhè; ihe odide ala peeji chekwara ụzọ nke na-agbaso ọdịdị Grik nso karị.
