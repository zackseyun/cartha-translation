  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: ig
  text: Ebe ọ bụ na ọtụtụ mmadụ ewerela ọrụ n'aka idepụta akụkọ banyere ihe ndị mezuru n’etiti anyị,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe ndị e rụzuru,” ma ọ bụ, “ihe ndị e mere ka ha guzosie ike n’etiti anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: Ebe ọ bụ na
  rationale: Na-ewebata ihe ndabere kpatara okwu na-esochi ya n'ụzọ doro anya ma dịkwa ugwu n'Igbo.
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: Na-egosipụta ọnụ ọgụgụ buru ibu n'ebughị echiche na ha bụ ‘ndị ọzọ,’ nke Grik ekwughị kpọmkwem.
- source_word: ἐπεχείρησαν
  choice: ebidola
  rationale: Na-egosi na ha malitere ma were ọrụ ahụ n'aka, n'ebughị echiche na mbọ ha dara ada.
- source_word: ἀνατάξασθαι
  choice: ịchịkọta
  rationale: Na-egosi ọrụ ide na ịhazi ihe ka ọ bụrụ otu akụkọ; ọ bụ okwu Igbo dị mfe nghọta ma kwekọọ n'ụdị okwu mmalite a.
- source_word: διήγησιν
  choice: akụkọ
  rationale: Na-enye echiche nke akụkọ a haziri ahazi n'asụsụ Igbo nkịtị ma dị ugwu.
- source_word: περὶ
  choice: banyere
  rationale: Ọ bụ ụzọ ebumpụta ụwa n'Igbo isi gosi isiokwu akụkọ ahụ.
- source_word: τῶν πεπληροφορημένων
  choice: ndị e mezuru
  rationale: Perfect passive participle ahụ, ya na πραγμάτων, yikarịrị ka ọ na-ezo aka n'ihe e mere ruo na mmezu; e debere nghọta ndị ọzọ n'ala peeji.
- source_word: ἐν ἡμῖν
  choice: n'etiti anyị
  rationale: Na-echekwa nghọta obodo nke okwu ahụ n'akọwaghị ndị ‘anyị’ bụ karịa ihe ederede kwuru.
- source_word: πραγμάτων
  choice: ihe
  rationale: Okwu sara mbara nke nwere ike ịgụnye ihe mere, omume, na ọnọdụ ndị a na-akọ, n'emeghị ka ihe Grik pụtara dị warara.
theological_decisions:
- issue: Ihe πεπληροφορημένων pụtara n'okwu mmalite Luk
  choice: e mezuru
  alternative: e rụzuru; e mere ka o doo anyị anya nke ọma
  rationale: N'ọnọdụ a, ya na πραγμάτων na akụkọ nzọpụta na-esochi, nghọta nke mmezu bụ nke kachasị dabara. Ma ebe okwu Grik ahụ nwekwara ike igosi ịrụzu ihe ma ọ bụ ime ka ihe guzosie ike nke ọma, e chekwara nhọrọ ndị ahụ n'ala peeji ka a ghara imechi esemokwu ahụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ugwu ma dị mfe nghọta. A na-echekwa ọdịdị okwu mmalite akwụkwọ ahụ n'enweghị okwu ochie ma ọ bụ nkọwa ụka agbakwunyere.
