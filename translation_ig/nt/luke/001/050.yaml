  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: ig
  text: Ebere ya dịkwara ndị na-atụ egwu ya site n’ọgbọ ruo n’ọgbọ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ruo ọgbọ na ọgbọ.” N’asụsụ Grik, nkebiokwu ahụ na-egosi na ebere ya na-aga n’ihu n’ọgbọ ndị na-esochi ibe ha.
    reason: lexical_alternative
  - marker: b
    text: “Ndị na-atụ egwu ya” na-ekwu maka ndị nwere egwu nsọpụrụ n’ebe Chineke nọ; a pụkwara ịsụgharị ya, “ndị na-asọpụrụ ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: ebere
  rationale: “Ebere” bụ okwu Igbo doro anya ma dịkwa ebube nke na-egosi obiọma na ọmịiko a na-emere onye nọ ná mkpa; ọ naghị etinye nkọwa karịrị ihe okwu Grik pụtara.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: site n’ọgbọ ruo n’ọgbọ
  rationale: Nke a bụ ụzọ Igbo si ekwu na ihe na-aga n’ihu n’ọgbọ ndị na-esochi ibe ha. Ọ bụ ezie na εἰς pụtara ịgbatị ruo n’ọgbọ dị iche iche, nkebiokwu a na-enye echiche ahụ n’Igbo dị mfe ma na-aga were were.
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: ndị na-atụ egwu ya
  rationale: Nke a na-echekwa okwu Baịbụl na ịdị arọ ya. Mgbe Chineke bụ ihe φοβέομαι na-ezo aka na ya, ọ na-agụnyekarị egwu nsọpụrụ na nrubeisi, ọ bụghị nanị ịtụ ụjọ.
- source_word: καὶ
  choice: dịkwara
  rationale: Mgbakwunye “-kwa” na-ejikọta ahịrị a na okwu ndị bu ya ụzọ n’abụ Meri ma na-echekwa usoro nkwukọta nke καὶ.
- source_word: αὐτοῦ / αὐτόν
  choice: ya / ya
  rationale: Nnochiaha abụọ ahụ na-ezo aka na Chineke dịka ihe gbara amaokwu a gburugburu si gosi; Igbo anaghị achọ ịgbakwunye aha ahụ ọzọ.
theological_decisions:
- issue: Ihe “ịtụ egwu” pụtara mgbe Chineke bụ onye a na-atụ egwu ya
  choice: ndị na-atụ egwu ya
  alternative: ndị na-asọpụrụ ya nke ukwuu
  rationale: E debere “ịtụ egwu” iji chekwaa asụsụ na ịdị arọ nke Akwụkwọ Nsọ. N’ebe a, okwu ahụ nwere echiche egwu nsọpụrụ, ofufe na nrubeisi, ma e kwesịghị ime ka ọ bụrụ nanị ụjọ ma ọ bụ mee ka echiche egwu dị na ya pụọ kpamkpam.
translation_notes:
  register: Standard Igbo; natural, current, and dignified. The sentence retains the poetic link to the preceding line through “-kwa,” preserves the biblical idiom “ịtụ egwu Chineke,” and uses the familiar generational expression “site n’ọgbọ ruo n’ọgbọ.”
