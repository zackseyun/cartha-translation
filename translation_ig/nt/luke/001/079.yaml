    issue: The verb phrase ‘mụkwasị ndị nọ ọdụ ... ìhè’ is awkward in this context.
    rationale: Although intelligible, it is not the clearest idiomatic Standard Igbo way to express ἐπιφᾶναι, ‘to shine upon.’ ‘Chakwasa ... ìhè’ directly conveys the light imagery and takes the people as the natural object of the action.
