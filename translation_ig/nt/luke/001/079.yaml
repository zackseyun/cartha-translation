id: LUK.1.79
reference: Luke 1:79
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: ig
  text: ka o wee chakwasa ndị nọ ọdụ n’ọchịchịrị na n’onyinyo ọnwụ[a] ìhè, ka o duzie ụkwụ anyị banye n’ụzọ udo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onyinyo nke ọnwụ”; ụfọdụ na-aghọta okwu a n’ụzọ sara mbara dịka “oke ọchịchịrị,” ma okwu Grik kpọrọ “ọnwụ” aha kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: mụkwasị ... ìhè
  rationale: Nke a na-egosipụta ìhè nke na-abịakwasị ndị nọ n’ọchịchịrị, ma na-edobe ihe atụ ahụ n’Igbo doro anya.
- source_word: τοῖς ἐν σκότει ... καθημένοις
  choice: ndị nọ ọdụ n’ọchịchịrị
  rationale: A hapụrụ echiche nkịtị nke ‘ịnọ ọdụ’ iji chekwaa ihe oyiyi ahụ na njikọ ya na okwu amụma.
- source_word: σκότει
  choice: ọchịchịrị
  rationale: Nke a bụ okwu Igbo nkịtị kwekọrọ na σκότος, ma o nweghị nkọwa agbakwunyere nke ga-emechi ihe atụ ahụ.
- source_word: σκιᾷ θανάτου
  choice: onyinyo ọnwụ
  rationale: Nke a na-edobe ma ‘onyinyo’ ma ‘ọnwụ’ dịka Grik si kwuo, ma na-echekwa ụda okwu Akwụkwọ Nsọ.
- source_word: τοῦ κατευθῦναι
  choice: ka o duzie
  rationale: ‘Duzie’ na-egosi iduru gaa n’ebe kwesịrị ekwesị ma kwekọọ nke ọma na ihe atụ nke ụkwụ na ụzọ.
- source_word: τοὺς πόδας ἡμῶν
  choice: ụkwụ anyị
  rationale: A hapụrụ ihe atụ ahụ n’ụdị nkịtị kama ịgbanwe ya ka ọ bụrụ naanị ‘anyị.’
- source_word: εἰς ὁδὸν εἰρήνης
  choice: banye n’ụzọ udo
  rationale: ‘Ụzọ udo’ na-echekwa ihe atụ nke ụzọ na ịdị adị nke udo; ‘banye’ na-egosipụta ntụgharị εἰς nke ọma n’Igbo.
theological_decisions:
- issue: Ma a ga-akọwa ihe atụ nke ọchịchịrị, onyinyo ọnwụ, ụkwụ, na ụzọ n'ụzọ sara mbara
  choice: Edobere ihe atụ niile n’ederede n’enweghị ịkọwa ha dịka amaghị ihe ime mmụọ, ihe ize ndụ ọnwụ, ma ọ bụ omume ọma.
  alternative: Ịsụgharị ya dịka ‘inye ndị nọ n’amaghị ihe ime mmụọ ìhè’ ma ọ bụ ‘iduru anyị n’ụzọ na-eweta udo.’
  rationale: Okwu ahụ bụ abụ ma juputakwa n’ihe atụ; idebe ha na-ahapụ nghọta na esemokwu nkà mmụta okpukpe dị n’isi mmalite ka ha guzosie ike.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. Nhazi ahịrịokwu ahụ na-echekwa ọdịdị abụ nke amaokwu ahụ na ihe atụ nke ìhè, ịnọ ọdụ, ụkwụ, na ụzọ.
