  verdict: revise
  source_fidelity: The draft accurately retains the paired purpose clauses, the image of people sitting in darkness and death’s shadow, the plural ‘our feet,’ and the destination ‘the way of peace.’ However, ‘mụkwasị ... ìhè’ is not the most natural or precise Standard Igbo expression for shining light upon people in this construction.
  naturalness: Replace ‘mụkwasị ... ìhè’ with ‘chakwasa ... ìhè,’ a clearer, idiomatic expression for casting/shining light upon someone. The remaining poetic syntax is natural and suitably elevated.
  terminology: ‘Ọchịchịrị,’ ‘onyinyo ọnwụ,’ ‘ụkwụ anyị,’ and ‘ụzọ udo’ are appropriate Standard Igbo renderings that preserve the source imagery without interpretive expansion. The footnote’s proposed wording is a grammatical variant rather than a substantively distinct lexical alternative, but it safely identifies the traditional genitive phrasing and retains the source’s explicit reference to death.
  issues:
