id: LUK.1.65
reference: Luke 1:65
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: ig
  text: Egwu bịara n’ahụ ndị niile bi gburugburu ha[b], a na-ekwukwa banyere ihe ndị a niile[a] n’ógbè ugwu Judia dum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “okwu ndị a niile” ma ọ bụ “ihe ndị a metụtara.” Okwu Grik ahụ nwere ike izo aka n’okwu e kwuru ma ọ bụ n’ihe omume ndị a na-ekwu banyere ha.
    reason: lexical_alternative
  - marker: b
    text: “Egwu” n’ebe a nwekwara ike ịgụnye ịtụnanya na nsọpụrụ n’ihi ọrụ Chineke pụtara ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας
  choice: Egwu bịakwutere ndị niile
  rationale: Nkebi a na-egosi na egwu malitere ijide mmadụ niile; “bịakwutere” na-ebupụta echiche nke ἐγένετο ἐπί n’Igbo dị mma.
- source_word: φόβος
  choice: egwu
  rationale: “Egwu” bụ ntụgharị kpọmkwem nke φόβος ma ka na-ahapụ ohere ka ọnọdụ ahụ gụnye ịtụnanya na nsọpụrụ n’ihu ọrụ Chineke.
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: ndị niile bi ha gburugburu
  rationale: Nke a na-egosi ndị bi nso ha n’ụzọ doro anya, n’emeghị ka okwu ahụ bụrụ naanị “ndị agbata obi.”
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: n’ala ugwu niile nke Judia
  rationale: “Ala ugwu” na-egosi mpaghara ugwu ugwu, ebe “niile” na-ebupụta oke mgbasa okwu ahụ n’ógbè ahụ dum.
- source_word: διελαλεῖτο
  choice: a nọkwa na-akọ gbasara
  rationale: 'Ụdị a na-egosi omume na-aga n’ihu: ndị mmadụ nọ na-ekwukarị ma na-akọ banyere ihe ndị ahụ.'
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ihe ndị a niile
  rationale: ῥήματα nwere ike ịpụta okwu, ihe omume, ma ọ bụ ihe a na-ekwu banyere ya; “ihe ndị a niile” dabara n’akụkọ a ma na-edobe obosara ihe okwu Grik ahụ pụtara.
theological_decisions:
- issue: Ihe φόβος pụtara mgbe ndị mmadụ hụrụ ọrụ Chineke
  choice: egwu
  alternative: ịtụ egwu nke jupụtara ná nsọpụrụ; ịtụnanya dị nsọ
  rationale: E tinyere “egwu” n’ahịrị isi ka e wee ghara ịkọwapụta okwu ahụ karịa ka Grik si kwuo; ihe gbara ya gburugburu ka na-enye ohere nghọta nke ụjọ jikọtara na ịtụnanya ma ọ bụ nsọpụrụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma dịkwa ùgwù. E debere nhazi ahịrịokwu ka ọ bụrụ nke sitere n’okwu Grik, ma zere ntụgharị kpọrọ nkụ. Akara nkọwa ala ala [a] na [b] dị n’ahịrị isi n’ebe okwu ndị ha na-akọwa nọ.
