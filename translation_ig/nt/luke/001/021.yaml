    text: Ma ọ bụ, “n’ime ụlọ nsọ ahụ.” Okwu Grik a na-ezo aka kpọmkwem n’ebe nsọ dị n’ime ụlọ nsọ, ọ bụghị n’ogige ụlọ nsọ niile.
    reason: lexical_alternative
  revision_rationale: The revision restores the people as the explicit experiencers of amazement, preserves the durative sense of both Greek imperfects through “nọ na-eche” and “nọkwa na-eju anya,” and uses the conventional Standard Igbo form “Zekaraya.” The footnote is retained and adjusted for consistent terminology.
