  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: ig
  text: Ndị mmadụ nọ na-eche Zekaraya, ha nọkwa na-eju anya n’ihi na ọ nọtere aka n’ebe nsọ ahụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ụlọ nsọ ahụ.” Okwu Grik a na-ezo aka kpọmkwem n’ebe nsọ dị n’ime ụlọ nsọ, ọ bụghị n’ogige ụlọ nsọ niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαὸς
  choice: Ndị mmadụ
  rationale: Ọ na-egosi ndị mmadụ gbakọrọ n’èzí; nsụgharị a bụ nke Igbo nkịtị ma na-edobe echiche mkpokọta ahụ.
- source_word: προσδοκῶν
  choice: nọ na-eche
  rationale: Ọ na-egosipụta omume nke gara n’ihu, dịka periphrastic imperfect Grik si dị.
- source_word: Ζαχαρίαν
  choice: Zakaraya
  rationale: E ji ụdị aha a nke a maara nke ọma n’Igbo dee aha onye ahụ.
- source_word: ἐθαύμαζον
  choice: ọ nọkwa na-eju ha anya
  rationale: Nke a na-egosi mmeghachi omume ha nke gara n’ihu n’ihi ogologo oge ahụ, n’akọwaghị ihe karịrị ihe ederede kwuru.
- source_word: ἐν τῷ χρονίζειν
  choice: na ọ nọtere aka
  rationale: Ọ na-enye n’Igbo nkịtị echiche na Zakaraya anọrọla ogologo oge karịa ka a tụrụ anya ya.
- source_word: ναῷ
  choice: n’ebe nsọ ahụ
  rationale: ναός n’ebe a bụ ebe nsọ dị n’ime ụlọnsọ, ọ bụghị ogige ụlọnsọ niile; ‘ebe nsọ’ na-edobe nkọwa ahụ kpọmkwem.
- source_word: αὐτόν
  choice: ọ
  rationale: Ọ bụ isiokwu nke infinitive n’usoro Grik; n’Igbo, a na-asụ ya dịka nnọchiaha isiokwu ‘ọ’.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị mfe, dị ugwu, ma bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta. A họọrọ ‘ebe nsọ’ iji kọwaa ναός nke ọma, ebe e debere ‘ụlọnsọ’ dịka ụzọ ọzọ n’ala ala peeji.
