- from: Ndị mmadụ nọ na-eche Zakaraya, ọ nọkwa na-eju ha anya na ọ nọtere aka n’ebe nsọ ahụ[a].
  to: Ndị mmadụ nọ na-eche Zekaraya, ha nọkwa na-eju anya n’ihi na ọ nọtere aka n’ebe nsọ ahụ[a].
  rationale: The revision restores the people as the explicit experiencers of amazement, preserves the durative sense of both Greek imperfects through “nọ na-eche” and “nọkwa na-eju anya,” and uses the conventional Standard Igbo form “Zekaraya.” The footnote is retained and adjusted for consistent terminology.
