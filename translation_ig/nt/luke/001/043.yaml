  text: καὶ πόθεν μοι τοῦτο ἵνα ἔλθῃ ἡ μήτηρ τοῦ κυρίου μου πρὸς ⸀ἐμέ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/043.yaml
  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: ig
  text: Olee otu o si bụrụ na nne Onyenwe m ga-abịakwute m?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόθεν
  choice: Olee otú
  rationale: Ọ bụ ezie na okwu a pụtara n'ụzọ nkịtị ‘site ebee,’ n'okwu ajụjụ a ọ na-egosi ihe ijuanya banyere otú ihe ùgwù dị otu a si bịara onye ahụ.
- source_word: μοι
  choice: nye m
  rationale: Dative a na-egosi onye ihe ùgwù a bịara rute; ‘nye m’ na-eme ka akpaalaokwu ahụ doo anya n'Igbo.
- source_word: τοῦτο
  choice: ihe ùgwù a
  rationale: Greek kwuru naanị ‘nke a,’ ma usoro ahịrịokwu ahụ na-egosi na ọ bụ ihe ùgwù a na-atụghị anya ya. Mgbakwunye a na-eme ka Igbo bụrụ ihe e ji ọnụ ekwu nke ọma, ebe nkọwa ala peeji na-echekwa ọdịdị nkịtị.
- source_word: ἵνα ἔλθῃ
  choice: na ... bịakwutere m
  rationale: ἵνα ebe a na-ewebata ihe mere Elizabet ji ju anya; ‘na ... bịakwutere m’ na-enye ya n'ụzọ Igbo dị ndụ ma dịkwa eke.
- source_word: μήτηρ
  choice: nne
  rationale: Nke a bụ ntụgharị kpọmkwem na nke nkịtị.
- source_word: κυρίου
  choice: Onyenwe
  rationale: ‘Onyenwe m’ na-echekwa ịdị arọ nke aha κύριος na nkwupụta Elizabet, n'etinyeghị nkọwa ozizi ọzọ.
- source_word: πρὸς ἐμέ
  choice: bịakwutere m
  rationale: πρός na accusative na-egosi ngagharị bịakwute Elizabet; okwu a adịghị agbakwụnye ‘ụlọ m,’ nke Greek na-ekwughị.
theological_decisions:
- issue: Ntụgharị κυρίου n'okwu ἡ μήτηρ τοῦ κυρίου μου
  choice: Onyenwe m
  alternative: nna m ukwu
  rationale: ‘Onyenwe m’ na-echekwa aha nsọpụrụ na ike okwu ahụ nwere banyere Kraịst, ma ọ naghị ebubata nkọwa ozizi e mechara karịa ihe amaokwu ahụ kwuru.
- issue: Ma a ga-asụgharị akpaalaokwu πόθεν μοι τοῦτο n'ụzọ nkịtị ka ọ bụ n'ụzọ Igbo doro anya
  choice: Olee otú e si nye m ihe ùgwù a
  alternative: Olee ebe nke a si bịara m
  rationale: Ụdị a họọrọ na-egosi ihe ijuanya Elizabet na-enwe n'ihi nsọpụrụ e nyere ya. Nkọwa ala peeji na-edebe ọdịdị Greek nke pụtara n'ụzọ nkịtị ‘site ebee ka nke a si bịara m?’
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, mee ntụgharị ahụ. ‘Bịakwutere m’ na-ada eke karịa ikwughachi ‘bịa n'ebe m nọ,’ ebe ‘Onyenwe m’ na-echekwa ụda nkwupụta na nsọpụrụ nke ederede Greek.
