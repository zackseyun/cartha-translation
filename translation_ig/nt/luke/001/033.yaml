    reason: lexical_alternative
  revision_rationale: A small idiomatic adjustment removes a possible 'no longer' nuance from the final clause while retaining every element of the Greek and the draft's formal, readable Standard Igbo register. The footnote remains accurate and its anchor is unchanged.
