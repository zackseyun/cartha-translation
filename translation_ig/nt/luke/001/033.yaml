id: LUK.1.33
reference: Luke 1:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: ig
  text: Ọ ga-achị ụlọ Jekọb dịka eze ruo mgbe ebighị ebi[a], alaeze ya agaghị enwe ọgwụgwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ruo oge niile.” Akpaala okwu Grik εἰς τοὺς αἰῶνας na-egosi oge na-enweghị njedebe.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: ga-achị ... dịka eze
  rationale: Ngwaa ọdịnihu a pụtara ịchị n’ọkwa eze. Nsụgharị a na-eme ka echiche nke ọchịchị eze pụta ìhè n’Igbo dị mfe nghọta.
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: ụlọ Jekọb
  rationale: ἐπί na-egosi ndị ọ ga-achị. ‘Ụlọ Jekọb’ na-edobe akpaala okwu ọgbụgba ndụ ahụ na echiche ya nke ụmụ Jekọb dịka otu ndị, kama ịkọwa ya ozugbo dịka ‘Izrel’ ma ọ bụ ‘ndị Chineke.’
- source_word: εἰς τοὺς αἰῶνας
  choice: ruo mgbe ebighị ebi
  rationale: Akpaala okwu Grik a na-egosi oge na-enweghị njedebe. ‘Ruo mgbe ebighị ebi’ bụ ụzọ Igbo nkịtị ma doo anya isi kwuo ya.
- source_word: βασιλείας
  choice: alaeze
  rationale: βασιλεία nwere ike ịpụta ọchịchị eze ma ọ bụ alaeze. N’ebe a, ‘alaeze’ dabara nke ọma n’ahịrịokwu ahụ ma na-edobe ma echiche nke ọchịchị eze ma nke ịdịgide adịgide.
- source_word: οὐκ ἔσται τέλος
  choice: agaghịkwa enwe ọgwụgwụ
  rationale: Nke a na-edobe ngọnarị siri ike na ihe ga-adị n’ọdịnihu, ma bụrụkwa Igbo dị ndụ na nke doro anya.
theological_decisions:
- issue: Ndị okwu ‘ụlọ Jekọb’ na-ezo aka na ha
  choice: E debere ya dịka ‘ụlọ Jekọb,’ n’enweghị ịgbasa ya ka ọ bụrụ ‘ndị Izrel’ ma ọ bụ ‘ndị Chineke.’
  alternative: ndị Izrel; ndị Chineke
  rationale: Nke a na-echekwa aha ọgbụgba ndụ dị n’okwu mmụọ ozi ahụ ma zere itinye nkọwa nkà mmụta okpukpe nke amaokwu ahụ ekwughị kpọmkwem.
- issue: Ogologo oge ọchịchị ahụ ga-adị
  choice: A sụgharịrị εἰς τοὺς αἰῶνας dịka ‘ruo mgbe ebighị ebi,’ tinyekwa na alaeze ya ‘agaghịkwa enwe ọgwụgwụ.’
  alternative: ruo oge niile; ruo ọtụtụ oge
  rationale: Ahịrịokwu abụọ ahụ jikọtara ọnụ na-egosi ọchịchị na alaeze na-enweghị njedebe. Nsụgharị a na-enye echiche ahụ n’Igbo doro anya n’ebelataghị ike ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ụlọ Jekọb’ na-edobe akpaala okwu Akwụkwọ Nsọ, ebe ‘dịka eze’ na-eme ka echiche βασιλεύσει nke ọchịchị eze pụta ìhè.
