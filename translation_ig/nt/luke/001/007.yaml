  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: ig
  text: Ha enweghịkwa nwa, n’ihi na Elizabet enweghị ike ịmụ nwa; ha abụọ akala nnọọ nká.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’okwu nkịtị: “ha agaala n’ihu n’ụbọchị ha.”'
    reason: E debere ihe akpaala okwu Grik ahụ pụtara n’ahịrị isi, ebe nkọwa a na-egosi ọdịdị okwu ya kpọmkwem.
lexical_decisions:
- source_word: τέκνον
  choice: nwa
  rationale: Okwu Grik a dị n’otu, ya mere “nwa” na-egosipụta ya nke ọma n’Igbo n’enweghị itinye ọtụtụ ụmụaka n’ihe odide ahụ.
- source_word: καθότι
  choice: n’ihi na
  rationale: Ọ na-ewebata ihe kpatara na ha enweghị nwa; “n’ihi na” bụ njikọ ihe kpatara ya doro anya ma bụrụkwa Igbo nkịtị.
- source_word: στεῖρα
  choice: enweghị ike ịmụ nwa
  rationale: Nke a na-egosipụta enweghị ike ịmụ nwa, ọ bụghị nanị ọnọdụ nke enweghị nwa. Ọ bụkwa okwu doro ndị na-agụ Igbo nke oge a anya karịa ịkpọ Elizabet “aga.”
- source_word: ἀμφότεροι
  choice: ha abụọ
  rationale: Ọ na-emesi ike na okwu ahụ gbasara Zekaraya na Elizabet ọnụ.
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: akala nnọọ nká
  rationale: Nke a bụ ụzọ Igbo si ekwu n’ụzọ ebumpụta ụwa na mmadụ agaala n’ihu n’afọ ndụ, ma ọ na-edobekwa ụda nkwanye ùgwù nke akpaala okwu Grik ahụ.
- source_word: οὐκ ἦν αὐτοῖς
  choice: ha enweghị
  rationale: Grik ahụ na-ekwu n’ụdị “ọ dịghịrị ha,” ma “ha enweghị” bụ ụzọ Igbo ebumpụta ụwa si egosipụta inwe ihe ma ọ bụ enweghị ya.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma nwee ugwu. A họọrọ “enweghị ike ịmụ nwa” kama okwu ọdịnala “bụ aga” ka ihe ọ pụtara doo onye ọ bụla anya ma zere ịkọwa Elizabet nanị site n’ọnọdụ ahụ. E tinyere akara nkọwa ala peeji [a] n’akụkụ akpaala okwu ọ na-akọwa.
