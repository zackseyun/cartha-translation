  edition: SBLGNT
  text: ποιῆσαι ἔλεος μετὰ τῶν πατέρων ἡμῶν καὶ μνησθῆναι διαθήκης ἁγίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: ig
  text: iji meere ndị nna nna anyị ebere[a][c], na iji cheta[b] ọgbụgba ndụ ya dị nsọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “iso ndị nna nna anyị mee ebere.” Okwu Grik ahụ pụtara ime ebere n'ihe metụtara ndị nna nna Izrel.
    reason: lexical_alternative
  - marker: b
    text: N'asụsụ ọgbụgba ndụ nke Akwụkwọ Nsọ, “icheta” na-apụtakarị ime ihe n'ikwesị ntụkwasị obi dịka nkwa e kwuburu si dị, ọ bụghị naanị iburu ihe n'uche.
    reason: cultural_note
  - marker: c
    text: “Ndị nna nna anyị” na-ezo aka na ndị nna ochie Izrel, ya bụ ndị patriarch; a pụkwara ịsụgharị ya, “ndị nna ochie anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: iji meere … ebere
  rationale: N'Igbo, “imeere mmadụ ebere” bụ ụzọ ebumpụta ụwa e si kwuo idiom Grik nke pụtara igosi mmadụ ebere. “Iji” na-echekwa ọrụ infinitive nke na-egosi nzube n'okwu gbara amaokwu a gburugburu.
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: ndị nna nna anyị
  rationale: Ọ bụ ezie na μετά na genitive pụtara n'ụzọ nkịtị “na/so,” n'okwu a ọ na-egosi ndị e meere ebere. “Ndị nna nna anyị” bụ okwu Igbo doro anya maka ndị nna ochie Izrel ma na-echekwa echiche nna ndị ahụ dị n'okwu Grik.
- source_word: μνησθῆναι
  choice: icheta
  rationale: “Icheta” sụgharịrị okwu Grik ahụ ozugbo, ma hapụkwa ihe okwu ọgbụgba ndụ a pụtara n'Akwụkwọ Nsọ—na ncheta Chineke na-edugakarị n'omume kwesịrị ntụkwasị obi—n'enweghị ịgbasa ya n'ime isi ederede.
- source_word: διαθήκης
  choice: ọgbụgba ndụ
  rationale: N'ebe a, διαθήκη bụ ọgbụgba ndụ Chineke, ọ bụghị akwụkwọ ikike ikpeazụ ma ọ bụ nkwekọrịta nkịtị.
- source_word: ἁγίας
  choice: dị nsọ
  rationale: “Dị nsọ” bụ Igbo ebumpụta ụwa nke na-akọwa ọgbụgba ndụ ahụ dịka nke Chineke kewapụrụ nye onwe ya.
- source_word: αὐτοῦ
  choice: ya
  rationale: “Ya” na-echekwa nnọchiaha Grik; ihe gbara okwu ahụ gburugburu na-egosi na ọ na-ezo aka na Chineke.
theological_decisions:
- issue: Ncheta Chineke dịka omume ọgbụgba ndụ
  choice: icheta ọgbụgba ndụ ya dị nsọ
  alternative: imezu ọgbụgba ndụ ya dị nsọ
  rationale: N'asụsụ ọgbụgba ndụ nke Akwụkwọ Nsọ, Chineke ‘icheta’ na-agụnyekarị ime ihe n'ikwesị ntụkwasị obi dịka nkwa ya si dị. Ma ebe Grik kwuru ‘icheta,’ isi ederede na-echekwa okwu ahụ na esemokwu echiche ya kama ịkọwa ya dịka ‘imezu.’
- issue: Ndị πατέρων ἡμῶν bụ
  choice: ndị nna nna anyị
  alternative: ndị nna ochie anyị
  rationale: Okwu Grik ahụ bụ masculine ma na-ezo aka n'ebe ndị nna Izrel, gụnyere ndị nna ochie ọgbụgba ndụ, nọ. “Ndị nna nna anyị” na-echekwa njikọ a karịa okwu sara mbara “ndị nna ochie anyị.”
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-anọgide dịka akụkụ nke ogologo abụ amụma Zekaraya, ya mere e debere obere mkpụrụedemede na rikoma ikpeazụ dịka isi mmalite e nyere si dị.
