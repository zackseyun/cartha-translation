id: LUK.1.66
reference: Luke 1:66
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: ig
  text: Ndị niile nụrụ ihe ndị a debere ha n’obi ha[a], na-asị, “Gịnịkwa ka nwata a ga-abụ?” N’ihi na aka Onyenwe anyị dịnyere ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “tinyere ha n’obi ha”; ya bụ, ha chekwara ihe ndị a n’uche ma tụgharịa uche na ha.
    reason: cultural_note
  - marker: b
    text: “Aka Onyenwe anyị” bụ akpaalaokwu Akwụkwọ Nsọ nke nwere ike igosi ike, amara, ma ọ bụ nduzi Chineke.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: debere ha n’obi ha
  rationale: Nke a na-edowe ihe atụ Grik nke itinye ihe n’obi, ma n’Igbo ọ na-egosi icheta ihe ahụ nke ọma na ịtụgharị uche na ya.
- source_word: πάντες οἱ ἀκούσαντες
  choice: Ndị niile nụrụ ihe ndị a
  rationale: Akụkụ a na-ezo aka ná ndị niile nụrụ akụkọ ihe ndị mere; ‘ihe ndị a’ na-eme ka njikọ ya na ihe ndị bu ụzọ doo anya n’Igbo.
- source_word: Τί ἄρα
  choice: Gịnịkwa
  rationale: Mgbakwunye ‘-kwa’ na-egosipụta echiche nkwubi okwu ma ọ bụ ajụjụ sitere n’ihe ndị mere tupu ya.
- source_word: τὸ παιδίον τοῦτο
  choice: nwata a
  rationale: ‘Nwata a’ bụ okwu Igbo nkịtị ma doo anya, na-enweghị ịkọwapụta afọ nwata ahụ karịa ihe Grik kwuru.
- source_word: ἔσται
  choice: ga-abụ
  rationale: Nke a na-agbasochi ngwaa Grik ‘ga-adị/ga-abụ’ anya ma na-ahapụ ajụjụ banyere ọdịnihu, njirimara, ma ọ bụ ọrụ nwata ahụ ka ọ ghara idozi ya n’ụzọ gabigara ederede.
- source_word: καὶ γὰρ
  choice: N’ihi na
  rationale: N’ebe a, mkpụrụokwu ndị ahụ na-ewebata ihe kpatara ndị mmadụ ji jụọ ajụjụ ahụ; ‘N’ihi na’ na-ekwupụta njikọ ahụ n’Igbo eke.
- source_word: χεὶρ κυρίου
  choice: aka Onyenwe anyị
  rationale: A na-edowe ihe atụ Akwụkwọ Nsọ nke na-egosi ike, amara, ma ọ bụ nduzi Chineke, na-akọwaghị kpọmkwem otu akụkụ naanị.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị asọpụrụ Chineke maka κύριος n’ọnọdụ a.
- source_word: μετ’ αὐτοῦ
  choice: dịnyere ya
  rationale: Nke a na-enye echiche ‘ịnọnyere ya’ n’Igbo dị mfe ma na-ezo aka n’ebe nwata ahụ nọ.
theological_decisions:
- issue: Ihe akpaalaokwu ‘aka Onyenwe anyị dịnyere ya’ pụtara
  choice: Idowe ihe atụ ahụ dịka nkwupụta banyere ike, amara, ọnụnọ, ma ọ bụ nduzi Chineke, na-akọwaghị ya n’otu ụzọ kpọmkwem.
  alternative: Onyenwe anyị na-enyere ya aka; ike Chineke dịkwasịrị ya.
  rationale: Ederede ahụ na-egosi na Chineke na-arụ ọrụ ná ndụ nwata ahụ, ma ọ kọwaghị ma ihe a bụ nchebe, inye ike, amara, nduzi, ma ọ bụ ha niile. Idowe akpaalaokwu ahụ na-echekwa obosara na esemokwu nkà mmụta okpukpe dị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta, dee ya. E dowere ihe atụ ‘aka Onyenwe anyị’ iji chekwaa ụda Akwụkwọ Nsọ na obosara ihe ọ pụtara. A họọrọ ‘ga-abụ’ kama ‘ga-aghọ’ iji nọgide nso na ἔσται ma ghara ịkọwa ọdịnihu nwata ahụ karịa ederede.
