  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: ig
  text: n’ịdị nsọ na n’ezi omume n’ihu ya, ụbọchị niile nke ndụ anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: n’
  rationale: N’ebe a, mbuụzọ a na-egosi ụzọ ma ọ bụ ọnọdụ e ji efe Chineke; “n’” na-edobe usoro Grik ma na-ada nke ọma n’Igbo.
- source_word: ὁσιότητι
  choice: ịdị nsọ
  rationale: “Ịdị nsọ” na-egosi ndụ e doro Chineke nsọ ma na-eme ka okwu a dị iche na δικαιοσύνη.
- source_word: καὶ
  choice: na
  rationale: Njikọ dị mfe nke jikọtara àgwà abụọ ahụ.
- source_word: δικαιοσύνῃ
  choice: ibi ezi omume
  rationale: N’ọnọdụ a, okwu ahụ na-ekwu maka ndụ ziri ezi n’ihu Chineke; “ibi ezi omume” bụ okwu Igbo doro anya ma bụrụkwa nke sitere n’omume, ebe “ikpe ziri ezi” ka dị ka nghọta ọzọ.
- source_word: ἐνώπιον αὐτοῦ
  choice: n’ihu ya
  rationale: Ọ bụ akpaalaokwu Igbo dị mkpirikpi nke na-egosi ịnọ n’ebe Chineke nọ nakwa ibi ndụ n’anya ya.
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: ụbọchị niile nke ndụ anyị
  rationale: Nke a na-egosipụta oge ndụ anyị dum n’Igbo eke, n’agbanyeghị na “ndụ” dị n’echiche ahịrịokwu Grik kama ịbụ otu okwu pụtara ìhè na ya.
theological_decisions:
- issue: Ịsụgharị δικαιοσύνη n’ọnọdụ omume ọma na-abụghị nke akwụkwọ Pọl
  choice: ibi ezi omume
  alternative: ikpe ziri ezi
  rationale: Ebe e jikọtara ya na ὁσιότης ma kwuo maka ndụ n’ihu Chineke, “ibi ezi omume” na-echekwa echiche nke ịdị ziri ezi n’omume na n’ọdịnihu Chineke. “Ikpe ziri ezi” nwekwara ike ịbụ ihe okwu ahụ pụtara, ma ọ naghị adabara njikọ okwu a nke ọma dịka nke mbụ.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro na-aga n’ihu site n’amaokwu gara aga, ma e debeghị nkọwa ọgbakọ ọbụla n’ime ya.
