  text: ὅρκον ὃν ὤμοσεν πρὸς Ἀβραὰμ τὸν πατέρα ἡμῶν, τοῦ δοῦναι ἡμῖν
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/073.yaml
  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: ig
  text: iyi ahụ ọ ṅụrụ nye Ebreham, nna anyị[a], ka o nye anyị
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nna ochie anyị.” N'okwu Grik, ọ bụ “nna anyị” kpọmkwem, nke na-edobe asụsụ ọgbụgba ndụ gbasara Ebreham.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: iyi ahụ
  rationale: Ọ bụ iyi a kapịrị ọnụ nke ahịrịokwu gara aga na-ekwu maka ya; “ahụ” na-egosi nke a nke ọma.
- source_word: ὃν ὤμοσεν
  choice: ọ ṅụrụ
  rationale: N'Igbo, “ịṅụ iyi” bụ ụzọ ebumpụta ụwa e si kwuo ime iyi; okwu a na-edobe njikọ ya na “iyi.”
- source_word: πρὸς Ἀβραὰμ
  choice: nye Ebreham
  rationale: Mgbe a na-ekwu maka ịṅụ iyi, πρός na-egosi onye e nyere iyi ahụ; “nye Ebreham” bụ Igbo doro anya.
- source_word: τὸν πατέρα ἡμῶν
  choice: nna anyị
  rationale: Nke a na-edobe okwu ezinụlọ na ọgbụgba ndụ dị na Grik, kama ime ka ọ bụrụ naanị “nna nna anyị ochie.”
- source_word: τοῦ δοῦναι ἡμῖν
  choice: ka o nye anyị
  rationale: Articular infinitive nwere ike igosi nzube ma ọ bụ ihe iyi ahụ ga-eweta. “Ka o nye anyị” bụ okwu Igbo dị mma ma na-ahapụ mmezu echiche ahụ nye amaokwu na-esote.
theological_decisions:
- issue: Okwu ọgbụgba ndụ gbasara Ebreham
  choice: nna anyị
  alternative: nna nna anyị ochie
  rationale: “Nna anyị” na-edobe kpọmkwem okwu Grik na ụda ọgbụgba ndụ nke na-akpọ Ebreham nna Izrel, n'etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E debere nkebi ahịrịokwu ahụ dị ka akụkụ nke ahịrịokwu na-aga n'ihu site n'amaokwu gara aga ruo na nke na-esote.
