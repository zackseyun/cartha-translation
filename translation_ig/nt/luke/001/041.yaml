id: LUK.1.41
reference: Luke 1:41
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: ig
  text: O wee ruo na, mgbe Elizabet nụrụ ekele Meri, nwa ahụ wụliri elu n’akpa nwa Elizabet, Elizabet wee jupụta na Mmụọ Nsọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo na
  rationale: Ọ bụ usoro Luk ji akwalite akụkọ gaa n’ihu; nsụgharị a bụ Igbo nkịtị ma dị ùgwù, na-enweghị iji okwu ochie na-adịghị eke ọnụ.
- source_word: ὡς
  choice: mgbe
  rationale: N’usoro a, okwu ahụ na-egosi oge ihe mere ozugbo Elizabet nụrụ ekele ahụ.
- source_word: ἀσπασμός
  choice: ekele
  rationale: N’ebe a ọ pụtara okwu e ji kele mmadụ; “ekele” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ ahụ.
- source_word: Μαρίας
  choice: Meri
  rationale: A sụgharịrị aha ahụ n’ụdị a maara nke ọma n’Igbo; nhazi ahịrịokwu ahụ na-egosi na ekele ahụ bụ nke Meri.
- source_word: ἐσκίρτησεν
  choice: wụliri elu
  rationale: Ọ na-egosi mmegharị mberede siri ike ma dị ndụ, ọ bụghị naanị ịma jijiji ntakịrị.
- source_word: βρέφος
  choice: nwa ahụ
  rationale: Ọ na-ezo aka n’ọkụkọ nwa dị n’akpa nwa Elizabet; “nwa ahụ” bụ okwu Igbo eke ọnụ ma na-edebe ntụaka ahụ kpọmkwem.
- source_word: κοιλία
  choice: akpa nwa
  rationale: N’ọnọdụ a, ọ na-ezo kpọmkwem n’ebe nwa nọ n’ahụ nne, ya bụ akpa nwa.
- source_word: ἐπλήσθη
  choice: jupụta
  rationale: Usoro “Mmụọ Nsọ wee jupụta Elizabet” bụ Igbo eke ọnụ nke na-egosipụta passive Greek n’enweghị ịkọwa onye mere ya karịa ihe odide ahụ kwuru.
- source_word: πνεύματος ἁγίου
  choice: Mmụọ Nsọ
  rationale: N’akwụkwọ Luk, okwu a na-ezo aka na Mmụọ Chineke; mkpụrụedemede ukwu na-egosi onye a na-ekwu maka ya n’Igbo.
theological_decisions:
- issue: Onye πνεύματος ἁγίου na-ezo aka na ya
  choice: Mmụọ Nsọ, ya bụ Mmụọ Chineke
  alternative: mmụọ dị nsọ
  rationale: Ojiji okwu a n’akwụkwọ Luk na Ọrụ Ndị Ozi, tinyere ọnọdụ mkpali amụma ebe a, na-akwado ntụaka ya nye Mmụọ Chineke, n’enweghị itinye nkọwa ozizi ọzọ.
- issue: Otu e si kpọọ βρέφος mgbe ọ ka nọ n’akpa nwa
  choice: nwa ahụ
  alternative: nwa ọhụrụ; nwa nta
  rationale: Okwu Greek ahụ na-ezo aka n’otu nwa kpọmkwem, ebe ọnọdụ ahụ na-eme ka o doo anya na ọ nọ n’akpa nwa. Nsụgharị a anaghị etinye nkọwa nkà mmụta okpukpe ọzọ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. Ejiri usoro akụkọ “O wee ruo na” chekwaa ụda akụkọ Luk, ebe usoro ahịrịokwu ndị ọzọ bụ nke eke ọnụ n’Igbo.
