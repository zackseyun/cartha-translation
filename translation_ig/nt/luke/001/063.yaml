  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: ig
  text: 'Ọ rịọrọ ka e nye ya mbadamba e ji ede ihe, wee dee, sị: “Jọn bụ aha ya.” Ha niile tụrụ n’anya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: Ọ rịọkwara ka e nye ya
  rationale: Aorist participle a na-egosi ihe o mere tupu o dee; ntụgharị a na-egosipụta arịrịọ ahụ na usoro omume n’Igbo dị mma.
- source_word: πινακίδιον
  choice: mbadamba e ji ede ihe
  rationale: Ọ bụ obere mbadamba a na-eji ede ihe; nkọwa a doro onye na-agụ Igbo nke oge a anya ma zere nghọtahie banyere ụdị mbadamba ọ bụ.
- source_word: ἔγραψεν λέγων
  choice: wee dee sị
  rationale: Nke a na-edobe ma omume ide ihe ma ọrụ λέγων nke na-ewebata ihe e dere, n’ụzọ Igbo na-ada nke ọma.
- source_word: Ἰωάννης
  choice: Jọn
  rationale: Aha ahụ bụ ụdị a na-ejikarị ede John n’Igbo.
- source_word: ἐστὶν ὄνομα αὐτοῦ
  choice: bụ aha ya
  rationale: 'Tinyere “Jọn” n’isi ahịrịokwu, nke a na-edobe usoro okwu Grik na nkwusi ike e tinyere n’aha ahụ: “Jọn bụ aha ya,” ọ bụghị amụma na nke ahụ ga-abụ aha ya n’ọdịnihu.'
- source_word: ἐθαύμασαν πάντες
  choice: Ha niile wee ju anya
  rationale: “Ju anya” bụ ụzọ Igbo nkịtị ma dị ùgwù isi kwuo ihe ijuanya nke θαυμάζω; “ha niile” na-edobe nkwusi ike nke πάντες.
theological_decisions: []
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. A hapụrụ usoro okwu “Jọn bụ aha ya” iji chekwaa nkwusi ike nke ederede Grik; achọghị nkọwa ala peeji n’ihi na usoro ahụ bụkwa Igbo doro anya.
