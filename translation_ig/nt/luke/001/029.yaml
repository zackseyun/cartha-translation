  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: ig
  text: Ma okwu ahụ mere ka obi ya ghara iru ya ala nke ukwuu,[a] ọ nọgidekwara na-atụgharị uche[b] banyere ụdị ekele nke a pụrụ ịbụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi ahụ,” ma ọ bụ “n’ihi ihe ahụ e kwuru.” Okwu Grik λόγος nwere ike ịpụta “okwu,” “ihe e kwuru,” ma ọ bụ “ozi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ nọ na-atụgharị uche” ma ọ bụ “ọ nọ na-eche ihe ọ pụrụ ịpụta.” Ụdị ngwaa Grik e ji mee ihe na-egosi ntụgharị uche na-aga n’ihu.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi obere mgbanwe ma ọ bụ ọdịiche site n'ekele mmụọ ozi ahụ gaa n'otú Meri si meghachi omume.
- source_word: ἐπὶ τῷ λόγῳ
  choice: okwu ahụ
  rationale: Na-ezo aka n'ihe mmụọ ozi ahụ kwuru; “okwu ahụ” bụ asụsụ Igbo dị mfe ma nwee ike ịpụta okwu ma ọ bụ ozi e kwuru.
- source_word: διεταράχθη
  choice: wutere ya nke ukwuu
  rationale: Na-egosipụta na ihe ahụ kpasuru ya nnukwu ọgba aghara n'obi, n'ekwughị na mmeghachi omume ya bụ mmehie ma ọ bụ ekweghị ekwe.
- source_word: διελογίζετο
  choice: ọ nọgidekwara na-atụgharị uche n’obi ya
  rationale: Ụdị imperfect na-egosi ntụgharị uche na-aga n'ihu; nkebi a na-egosikwa mkparịta ụka dị n'ime obi.
- source_word: ποταπὸς
  choice: ụdị
  rationale: Na-ajụ maka ọdịdị ma ọ bụ ụdị ekele ahụ.
- source_word: εἴη
  choice: pụrụ ịbụ
  rationale: Na-echekwa nghọta nke ntule na-ejighị n'aka nke optative dị n'okwu a kọrọ.
- source_word: ἀσπασμὸς
  choice: ekele
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị akọwa okwu e ji ekele mmadụ.
- source_word: οὗτος
  choice: nke a
  rationale: Na-arụtụ aka n'ekele ahụ mmụọ ozi kwuru ozugbo.
theological_decisions:
- issue: Ụdị mmeghachi omume Meri
  choice: Ihe okwu ahụ kwuru wutere Meri nke ukwuu, o wee nọgide na-atụgharị uche n'ihe ekele ahụ pụtara.
  alternative: Ọ bụ ọdịdị mmụọ ozi ahụ tụrụ Meri ụjọ, ma ọ bụ na mmeghachi omume ya gosiri ekweghị ekwe.
  rationale: Grik jikọtara ọgba aghara ya na okwu ahụ, ọ bụghị kpọmkwem n'ọdịdị mmụọ ozi ahụ; ọ kọwaghịkwa ntụgharị uche ya dị ka mmehie ma ọ bụ ekweghị ekwe.
translation_notes:
  register: Igbo Izugbe dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. A họọrọ “okwu ahụ” iji nọgide nso na λόγος, ebe nkọwa ala peeji na-echekwa “ozi ahụ” dịka nhọrọ ọzọ. E tinyere akara ala peeji niile n'ederede bụ isi.
