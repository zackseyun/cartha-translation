  text: καὶ πᾶν τὸ πλῆθος ἦν τοῦ λαοῦ προσευχόμενον ἔξω τῇ ὥρᾳ τοῦ θυμιάματος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/010.yaml
  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: ig
  text: Ìgwè mmadụ ahụ dum nọ n'èzí na-ekpe ekpere n'oge isure ihe nsure ọkụ na-esi ísì ụtọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'oge a na-esure ihe nsure ọkụ na-esi ísì ụtọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: Ìgwè mmadụ ahụ niile
  rationale: Nke a na-egosi na ìgwè ahụ dum sonyere, ma na-edobe echiche nke otu nnukwu ìgwè gbakọtara.
- source_word: τοῦ λαοῦ
  choice: mmadụ ahụ
  rationale: N'Igbo, “ìgwè mmadụ ahụ” na-ejikọta πλῆθος na λαός n'ụzọ eke; etinyeghị “Izrel” n'ihi na ederede Grik ekwughị ya kpọmkwem.
- source_word: ἦν ... προσευχόμενον
  choice: nọkwa ... na-ekpe ekpere
  rationale: Usoro a na-egosi omume na-aga n'ihu n'oge ahụ; “nọ ... na-ekpe” na-eweta nke a n'Igbo nke ọma.
- source_word: ἔξω
  choice: n'èzí
  rationale: Ọ na-edobe naanị echiche nke ịnọ n'èzí, n'agbanyeghị na ọnọdụ ahụ na-egosi na Zekaraya nọ n'ime ebe nsọ.
- source_word: τῇ ὥρᾳ
  choice: n'oge
  rationale: “N'oge” bụ okwu Igbo eke maka oge a kara aka, ma ọ naghị amanye echiche nke nkeji iri isii.
- source_word: τοῦ θυμιάματος
  choice: a na-achụ ihe nsure ọkụ na-esi ísì ụtọ
  rationale: N'ọnọdụ ofufe n'ụlọ nsọ, θυμίαμα na-ezo aka n'ihe nsure ọkụ na-esi ísì ụtọ a na-achụ; okwu a na-eme ka ihe omume ofufe ahụ doo anya.
theological_decisions:
- issue: Okwu metụtara ofufe n'ụlọ nsọ dị na θυμίαμα
  choice: a na-achụ ihe nsure ọkụ na-esi ísì ụtọ
  alternative: a na-esure ihe na-esi ísì ụtọ ọkụ
  rationale: Nhọrọ bụ isi na-egosi na nke a bụ omume ofufe ndị nchụàjà na-eme n'ụlọ nsọ, n'etinyeghị ozizi ọzọ na-adịghị n'amaokwu ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ “ìgwè mmadụ” kama okwu ochie ma ọ bụ nke siri ike; “ihe nsure ọkụ na-esi ísì ụtọ” na-akọwa incense n'ụzọ ndị na-agụ akwụkwọ taa ga-aghọta.
