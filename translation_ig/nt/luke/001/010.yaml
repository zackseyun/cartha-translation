    reason: lexical_alternative
  revision_rationale: The revision replaces the potentially over-specific sacrificial verb “ịchụ” with “isure,” which more directly reflects θυμίαμα (“incense”) in its ritual setting. It also streamlines the sentence while preserving the Greek’s collective subject, ongoing prayer, exterior location, and temporal association with incense.
