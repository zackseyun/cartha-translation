  text: ἀντελάβετο Ἰσραὴλ παιδὸς αὐτοῦ, μνησθῆναι ἐλέους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/054.yaml
  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: ig
  text: O nyeere Izrel, ohu ya[a], aka, n’icheta ebere[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwa ya.” Okwu Grik ahụ, pais, nwere ike ịpụta “ohu” ma ọ bụ “nwa”; a họọrọ “ohu” n’ebe a n’ihi otú Agba Ochie si akpọ Izrel ohu Chineke.
    reason: lexical_alternative
  - marker: b
    text: “Ebere” nwekwara ike ibu echiche nke ebere nke ọgbụgba ndụ, ya bụ, ọmịiko na ikwesị ntụkwasị obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: O nyeere ... aka
  rationale: Nkebiokwu Igbo a na-egosi ijide mmadụ aka iji nyere ya ma ọ bụ ịkwado ya, bụ́ isi nghọta ngwaa ahụ n’ebe a.
- source_word: Ἰσραὴλ
  choice: Izrel
  rationale: Aha a bụ nsụgharị mkpụrụokwu a na-ejikarị eme ihe n’Igbo; n’ebe a ọ na-anọchi anya ndị Izrel n’otu.
- source_word: παιδὸς
  choice: ohu
  rationale: Ọ bụ ezie na παῖς nwekwara ike ịpụta ‘nwa,’ ‘ohu’ dabara n’ụzọ Agba Ochie si akpọ Izrel ohu Chineke, ma a hapụrụ nhọrọ ọzọ ahụ na nkọwa ala peeji.
- source_word: αὐτοῦ
  choice: ya
  rationale: 'Okwu nnọchiaha nwe a na-ezo aka na Chineke: Izrel bụ ohu ya.'
- source_word: μνησθῆναι
  choice: n’icheta
  rationale: Ụdị a na-ejikọta icheta na enyemaka Chineke n’ụzọ dị mkpirikpi ma dịkwa mma n’Igbo, n’enweghị ikpebi kpamkpam ma ọ bụ nzube, ihe so omume ahụ, ma ọ bụ ihe si na ya pụta.
- source_word: ἐλέους
  choice: ebere
  rationale: ‘Ebere’ bụ okwu Igbo doro anya maka ọmịiko na amara e gosiri onye nọ ná mkpa; nkọwa ala peeji na-egosi ụda ọgbụgba ndụ ọ pụrụ inwe n’ebe a.
theological_decisions:
- issue: Ihe παῖς pụtara mgbe ọ na-ezo aka n’Izrel
  choice: Izrel, ohu ya
  alternative: Izrel, nwa ya
  rationale: ‘Ohu’ na-echekwa njikọ dị n’etiti okwu a na asụsụ Akwụkwọ Nsọ gbasara Izrel dị ka ohu Chineke, ebe nkọwa ala peeji na-echekwa ezi mgbagwoju anya nke okwu Grik ahụ.
- issue: Ike okwu μνησθῆναι ἐλέους
  choice: n’icheta ebere
  alternative: iji cheta ebere ya
  rationale: Nsụgharị a na-edobe okwu ahụ nso n’usoro Grik ma ghara ịmanye ya ka ọ bụrụ naanị nzube; ọ na-ahapụkwa echiche banyere Chineke icheta ọgbụgba ndụ ya ka ihe gbara amaokwu a gburugburu kọwaa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. Nkebiokwu “nyere ... aka” bụ asụsụ Igbo ebumpụta ụwa; a hapụrụ usoro abụ ahụ na rikoma ikpeazụ n’ihi na amaokwu a na-aga n’ihu n’amaokwu na-esote.
