revisions:
- from: “N’ihi na otu a ka Onyenwe anyị si mesoo m n’oge o lebara m anya, iji wepụ nkọcha[a] a na-akọcha m n’etiti ndị mmadụ.”
  to: “N’ihi na otu a ka Onyenwe anyị si mesoo m n’ụbọchị ndị ahụ mgbe o lebara m anya, iji wepụ nkọcha[a] m n’etiti ndị mmadụ.”
  rationale: The revision removes an unnecessary tautology, retains the social sense of Elizabeth’s reproach, and represents the Greek temporal expression more closely in natural Standard Igbo. It preserves the source ambiguity concerning the infinitive by retaining “iji wepụ.”
  reviewer_model: gpt-5.6-terra
