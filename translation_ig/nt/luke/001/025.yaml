source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: ig
  text: “N’ihi na otu a ka Onyenwe anyị si mesoo m n’ụbọchị ndị ahụ mgbe o lebara m anya, iji wepụ nkọcha[a] m n’etiti ndị mmadụ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya “ihere m” ma ọ bụ “mmechuihu m.” Okwu Grik ahụ na-elekwasị anya na nkọcha ma ọ bụ enweghị nsọpụrụ mmadụ na-enweta n’etiti ndị ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ejikọta okwu Elizabet na ihe e kwuru tupu ya ma na-egosi nkọwa ma ọ bụ ihe kpatara okwu ya.
- source_word: Οὕτως μοι πεποίηκεν
  choice: otu a ka ... si mesoo m
  rationale: Nke a na-edobe ike e nyere ụzọ Onyenwe anyị si mee ihe, ma bụrụkwa okwu Igbo doro anya na nke mmadụ na-asụ taa.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị akọwa Chineke n’Igbo, ọ naghịkwa amanye nkọwa ọzọ na-adịghị n’amaokwu a.
- source_word: ἐν ἡμέραις αἷς ἐπεῖδεν
  choice: n’oge o lebara m anya
  rationale: Ọ na-enye usoro oge ahụ n’Igbo dị mfe ma na-egosi na ile ahụ bụ ilebara mmadụ anya nke ọma, ọ bụghị naanị ịhụ ya anya.
- source_word: ἀφελεῖν
  choice: iji wepụ
  rationale: Ọ na-egosi nzube ma ọ bụ ihe omume ahụ rụpụtara, dịka infinitive Grik ahụ nwere ike isi rụọ ọrụ n’ebe a.
- source_word: ὄνειδός μου
  choice: nkọcha a na-akọcha m
  rationale: Ọ na-egosi ihere na mmechuihu ndị ọzọ na-etinye mmadụ n’elu ya, kama ime ka ọ bụrụ naanị mmetụta ihere dị n’ime obi.
- source_word: ἐν ἀνθρώποις
  choice: n’etiti ndị mmadụ
  rationale: Ọ na-edobe ọnọdụ mmekọrịta mmadụ na ibe ya ma na-ezere okwu ga-ada ka ọ na-ekwu naanị gbasara ụmụ nwoke.
theological_decisions:
- issue: Onye κύριος na-ezo aka na ya
  choice: Onyenwe anyị, ya bụ Chineke
  alternative: Enweghị nkọwa ọzọ siri ike n’ọnọdụ okwu a
  rationale: Elizabet na-ekwu maka ihe Chineke mere site n’iwepụ amụghị nwa na nkọcha ọ na-eweta; nsụgharị ahụ anaghị etinye nghọta Kraịst pụrụ iche n’amaokwu a.
- issue: Ọdịdị ὄνειδος
  choice: nkọcha a na-akọcha m
  alternative: ihere m; mmechuihu m
  rationale: 'Nhọrọ a na-eme ka akụkụ mmekọrịta mmadụ na ibe ya pụta ìhè: ọ bụ nkọcha ma ọ bụ mmechuihu n’anya ndị mmadụ, ọ bụghị naanị mmetụta ime obi.'
- issue: Mmekọrịta ἀφελεῖν na ἐπεῖδεν
  choice: iji wepụ
  alternative: wee wepụ
  rationale: “Iji” na-ahapụ nghọta nke nzube n’ihu, ma ihe a rụpụtara ka na-apụtakwa n’okwu ahụ; ọ naghị agbakwunye nkọwa okpukpe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Nkọcha a na-akọcha m” na-ada nke ọma n’Igbo ma na-edobe akụkụ ọha mmadụ dị na ὄνειδος; e debere akara nkọwa [a] ozugbo n’azụ okwu ọ na-akọwa.
