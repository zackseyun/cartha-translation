id: LUK.1.20
reference: Luke 1:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: ig
  text: Ma lee[a], ị ga-adị nkịtị, ị gaghịkwa enwe ike ikwu okwu ruo ụbọchị ihe ndị a ga-eme, n’ihi na i kweghị n’okwu m, bụ́ ndị a ga-emezu n’oge a kara aka nye ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ị ga-abụ onye ogbi.” Grik jikọtara “ịdị nkịtị” na “enweghị ike ikwu okwu,” na-emesi ike na ọ bụ ọnọdụ e mere ka ọ ghara ikwu okwu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’oge kwesịrị ekwesị nye ha.” Nkebiokwu ahụ na-ezo aka n’oge kwesịrị ekwesị ma ọ bụ oge a kara aka ka okwu ndị a mezuo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Na-echekwa ọrụ ya dị ka okwu na-adọta uche na ịdị nsọ nke ọkwa mmụọ ozi ahụ, n’Igbo dị mfe ma kwụ ọtọ.
- source_word: ἔσῃ σιωπῶν
  choice: ị ga-agbachi nkịtị
  rationale: Na-egosi ọnọdụ ịgbachi nkịtị nke ga-adịgide, ma ahịrịokwu na-esote na-eme ka o doo anya na ọ bụghị ịgbachi nkịtị n’afọ ofufo.
- source_word: μὴ δυνάμενος λαλῆσαι
  choice: ị gaghịkwa enwe ike ikwu okwu
  rationale: Na-echekwa echiche nke enweghị ikike ikwu okwu ma mee ka o doo anya na ịgbachi nkịtị ahụ bụ ihe a manyere amanye.
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: ruo ụbọchị ihe ndị a ga-emezu
  rationale: Na-enye usoro oge ahụ n’Igbo ebumpụta ụwa; ebe a γίνομαι na-ezo aka n’ihe ndị e kwere ná nkwa ịpụta ma ọ bụ imezu.
- source_word: ἀνθ’ ὧν
  choice: n’ihi na
  rationale: Na-egosipụta ihe kpatara ntaramahụhụ Zekaraya n’ụzọ doro anya ma kwekọọ n’ọnọdụ okwu ahụ.
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: i kweghị n’okwu m
  rationale: Na-echekwa πιστεύω na λόγοι n’ụzọ Igbo a na-aghọta nke ọma, na-elekwasị anya n’ịghara ikwere ihe mmụọ ozi kwuru.
- source_word: οἵτινες πληρωθήσονται
  choice: bụ́ ndị a ga-emezu
  rationale: Na-ejikọta nkebi ahụ na “okwu m” ma chekwaa olu nnabata nke ngwaa Grik ahụ na echiche nke okwu ahụ ịghọ eziokwu.
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: n’oge a kara aka nye ha
  rationale: Na-egosi na καιρός bụ oge kwesịrị ekwesị ma ọ bụ oge e kenyere, ọ bụghị nanị oge n’usoro elekere.
theological_decisions:
- issue: Ụdị ikpe e nyere Zekaraya
  choice: Amaokwu ahụ na-ekwu na a manyere Zekaraya ịghara inwe ike ikwu okwu ruo mgbe nkwa ahụ mezuru.
  alternative: A pụrụ ịghọta ịgbachi nkịtị ahụ dị ka ihe o ji aka ya họrọ ime.
  rationale: Njikọ nke “ị ga-agbachi nkịtị” na “ị gaghịkwa enwe ike ikwu okwu” na-egosi ọnọdụ a manyere amanye, ọ bụghị nanị iwu ka ọ ghara ikwu okwu.
- issue: Oge mmezu nke okwu ahụ
  choice: Okwu mmụọ ozi ahụ ga-emezu n’oge a kara aka nye ha.
  alternative: Okwu ahụ ga-emezu nanị n’oge kwesịrị ekwesị, n’enweghị echiche nke oge e kenyere.
  rationale: καιρός nwere ike ịpụta oge kwesịrị ekwesị ma ọ bụ oge a kara aka; nsụgharị ahụ na-echekwa echiche oge e kenyere n’enweghị ịkọwapụta onye kara ya aka.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E chekwara akụkụ abụọ nke Grik gbasara ịgbachi nkịtị na enweghị ike ikwu okwu, ka a ghara ime ka ọnọdụ ahụ bụrụ nanị ịgbachi nkịtị n’afọ ofufo. Akara ụkwụokwu [a] na [b] dị n’ederede isi.
