revisions:
- from: Ma lee[a], ị ga-agbachi nkịtị, ị gaghịkwa enwe ike ikwu okwu ruo ụbọchị ihe ndị a ga-emezu, n’ihi na i kweghị n’okwu m, bụ́ ndị a ga-emezu n’oge a kara aka nye ha.[b]
  to: Ma lee[a], ị ga-adị nkịtị, ị gaghịkwa enwe ike ikwu okwu ruo ụbọchị ihe ndị a ga-eme, n’ihi na i kweghị n’okwu m, bụ́ ndị a ga-emezu n’oge a kara aka nye ha.[b]
  rationale: The revision preserves the draft’s overall faithful rendering while distinguishing ‘these things will happen’ from ‘my words will be fulfilled,’ as in the Greek. It also replaces a potentially volitional expression for silence with a natural state expression. Footnote wording is adjusted to align with the revised main-text expression and to avoid an unnecessary third-person reference.
