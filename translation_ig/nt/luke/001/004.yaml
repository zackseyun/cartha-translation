  yaml_path: translation/nt/luke/001/004.yaml
  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: ig
  text: ka i wee mata ịdị ntụkwasị obi nke ihe ndị a kụziiri gị.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịdị n'aka”; aha Grik ahụ nwere ike ịpụta ijide n'aka ma ọ bụ ịdị ntụkwasị obi.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ndị a gwara gị ka ị mụta”; ngwaa Grik ahụ na-ezo aka n'ịkụziri mmadụ ihe, karịchaa site n'ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka i wee
  rationale: Ọ na-egosi ebumnuche Luk ji dee; okwu a bụ ụzọ Igbo dị mfe ma bụrụkwa nke e ji asụ nke ọma iji gosi ebumnuche.
- source_word: ἐπιγνῷς
  choice: mata nke ọma
  rationale: Ngwaa a pụtara ịmata ma ọ bụ ịghọta nke ọma. Nsụgharị a na-egosi nghọta doro anya n'ebughị ibu karịa ihe Grik kwuru.
- source_word: περὶ ὧν ... λόγων
  choice: na ihe ndị
  rationale: N'ebe a, λόγων na-arụtụ aka n'ihe ndị dị n'ime ozizi ahụ, ọ bụghị naanị mkpụrụokwu; nhazi a bụ Igbo ebumpụta ụwa.
- source_word: κατηχήθης
  choice: a kụziiri gị
  rationale: Ọ bụ ụdị nnara nke ngwaa pụtara ịkụziri mmadụ ihe, karịchaa site n'ọnụ. Okwu a doro ndị na-agụ Igbo anya ma ọ naghị ebubata aha ụka e mesịrị.
- source_word: τὴν ἀσφάλειαν
  choice: bụ ihe ndị e ji n'aka
  rationale: Akpaalaokwu Igbo a na-egosi na ihe ndị ahụ bụ eziokwu a pụrụ ịtụkwasị obi, ma ka na-enye ohere maka echiche nke ijide n'aka na nke ntụkwasị obi.
theological_decisions:
- issue: Ụdị ebumnuche Luk ji dee
  choice: E debere ma echiche nke ijide n'aka ma nke ịbụ ihe a pụrụ ịtụkwasị obi n'okwu “ihe ndị e ji n'aka.”
  alternative: ịmata na ihe ndị ahụ bụ eziokwu; ịmata na ihe ndị ahụ bụ ihe a pụrụ ịtụkwasị obi
  rationale: ἀσφάλεια nwere ike ịpụta ijide n'aka, nchekwa, ma ọ bụ ịbụ ihe a pụrụ ịtụkwasị obi. Ya mere, a naghị akọwa ya dị ka naanị obi ike nke mmadụ n'ime onwe ya ma ọ bụ naanị nkwenye banyere akụkọ ihe mere eme.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “a kụziiri gị” mee ka olu nnara Grik pụta, jiri “ihe ndị e ji n'aka” chekwaa obosara nkọwa nke ἀσφάλεια.
