  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: ig
  text: Zekaraya wee sị mmụọ ozi ahụ, “Olee otú m ga-esi mara nke a? N’ihi na m bụ agadi nwoke, nwunye m emewokwa agadi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, Grik sịrị, “nwunye m agaala n’ihu n’ụbọchị ya,” ya bụ, o meela agadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: wee sị
  rationale: Nke a bụ ụzọ Igbo e si akọ okwu mmadụ kwuru n’akụkọ, ma na-ejikọkwa omume a na ihe ndị bu ya ụzọ.
- source_word: πρὸς τὸν ἄγγελον
  choice: mmụọ ozi ahụ
  rationale: N’ebe a, onye a na-agwa okwu bụ mmụọ ozi ahụ e kwuburu banyere ya; ngwaa Igbo “sị” na-egosilarị onye a na-agwa okwu n’enweghị mkpa itinye “nye.”
- source_word: Κατὰ τί γνώσομαι
  choice: Olee otú m ga-esi mara
  rationale: Nkebi a na-ajụ ụzọ ma ọ bụ ihe ndabere Zekaraya ga-eji mata na okwu ahụ ga-emezu, ma “m ga-esi mara” na-echekwa echiche nke ihe ọ ga-amata n’ọdịnihu.
- source_word: τοῦτο
  choice: nke a
  rationale: Ọ na-ezo aka n’ihe mmụọ ozi ahụ ka kwupụtara.
- source_word: πρεσβύτης
  choice: agadi nwoke
  rationale: Okwu a na-ekwu maka nwoke merela agadi, ọ bụghị onye ji ọkwa ọchịchị ma ọ bụ nke nzukọ.
- source_word: ἡ γυνή μου
  choice: nwunye m
  rationale: N’ọnọdụ a, γυνή pụtara nwunye, ọ bụghị naanị nwanyị.
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: emekwala agadi
  rationale: Nke a bụ ụzọ Igbo doro anya ma dị ndụ e si zipụta akpaalaokwu Grik nke pụtara na nwunye ya agaala nnọọ n’ihu n’afọ ndụ ya.
theological_decisions:
- issue: Nsụgharị ἄγγελος
  choice: mmụọ ozi
  alternative: onye ozi
  rationale: Ọ bụ Gebriel pụtara ma na-ekwu okwu n’akụkụ akụkọ a; ya mere “mmụọ ozi” dabara n’ọnọdụ ahụ n’enweghị ịgbakwunye nkọwa ozizi na-adịghị n’ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe nghọta ma dịkwa ugwu. Ahịrị ajụjụ ahụ na-edobe arịrịọ Zekaraya maka ụzọ ọ ga-esi mara na okwu ahụ ga-emezu, ebe nkebi ikpeazụ na-asụgharị akpaalaokwu Grik n’ụzọ Igbo ga-ada nke ọma ma na-edebe ihe oyiyi ya n’ala ala peeji.
