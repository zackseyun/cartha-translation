  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: ig
  text: Dị ka omenala e si eme n’ọrụ nchụàjà, nza dakwasịrị ya ka ọ gbaa ihe nsure ísì ụtọ mgbe ọ banyere n’ebe nsọ nke Onyenwe anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụlọ nsọ nke Onyenwe anyị.” Okwu Grik bụ ναός, nke na-ezokarị aka n’ụlọ nsọ ahụ n’onwe ya karịa ogige ụlọ nsọ niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: dị ka omenala nke ọrụ nchụàjà si dị
  rationale: Nkebiokwu a na-egosi ime ihe n’usoro omenala e guzobere maka ọrụ ndị nchụàjà; ‘ọrụ nchụàjà’ na-echekwa echiche nke ọkwa na ije ozi ahụ, ọ bụghị nanị ndị nchụàjà n’onwe ha.
- source_word: ἔλαχε
  choice: nza dakwasịrị ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke e ji eme ihe iji gosi na e ji nza họpụta onye ma ọ bụ nye ya ọrụ.
- source_word: τοῦ θυμιᾶσαι
  choice: ka ọ gbaa ihe nsure ọkụ
  rationale: 'Ọ na-egosi ọrụ e nyere ya site ná nza: ịgba ihe nsure ọkụ; ‘ka’ na-egosipụta ebumnuche nke infinitive ahụ n’ụzọ Igbo dị mma.'
- source_word: εἰσελθὼν
  choice: mgbe ọ banyere
  rationale: Ọ na-egosipụta njikọ oge nke participle ahụ n’enweghị ịkọwapụta usoro karịa ihe Grik kwuru.
- source_word: εἰς τὸν ναὸν τοῦ κυρίου
  choice: n’ebe nsọ nke Onyenwe anyị
  rationale: ναός n’ọnọdụ a na-ezo aka n’ebe nsọ dị n’ụlọ nsọ ahụ, ebe a na-anọ agba ihe nsure ọkụ; ‘Onyenwe anyị’ bụ nsụgharị Igbo ebumpụta ụwa nke κύριος mgbe ọ na-ezo aka na Chineke.
theological_decisions:
- issue: Mpaghara ναός na-ezo aka n’ọrụ ụlọ nsọ
  choice: ebe nsọ
  alternative: ụlọ nsọ
  rationale: ναός na-adịkarị iche na ἱερόν ma na-ezo kpọmkwem n’ụlọ ma ọ bụ ebe nsọ dị n’ime ogige ụlọ nsọ. Ebe Zekaraya banyere ịgba ihe nsure ọkụ, ‘ebe nsọ’ bụ nke ziri ezi karị; ihe ọzọ e nwere ka e debere n’ala ala peeji.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma doo ndị nkịtị anya. E ji ‘nza dakwasịrị ya’ mee ka usoro ịhọpụta site ná nza pụta ìhè, ma e ji ‘ebe nsọ’ kewaa ναός na ogige ụlọ nsọ sara mbara.
