  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: ig
  text: N’ọnwa nke isii[a], e zitere mmụọ ozi Gebriel site n’ebe Chineke nọ gaa n’otu obodo dị na Galili, nke a na-akpọ Nazaret[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, ọnwa nke isii nke afọ ime Elizabet; lee Luk 1:24, 36.
    reason: cross_reference
  - marker: b
    text: Ma ọ bụ, “n’otu obodo nke Galili, nke aha ya bụ Nazaret.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: N’ọnwa nke isii
  rationale: Nkebiokwu ἐν na dative na-egosi oge, ‘n’ọnwa nke isii.’ δέ bụ njikọ dị nro; n’Igbo, ịhapụ ya ebe a na-eme ka ahịrịokwu bụrụ nke eke n’etinyeghị echiche nke mmegide na-adịghị ike n’ebe ahụ.
- source_word: ἀπεστάλη
  choice: e ... zite
  rationale: Aorist passive a pụtara ‘e zitere ya.’ Nhazi ‘e si n’ebe Chineke nọ zite’ na-edobe olu nnara ahụ ma na-eme ka isi mmalite nke iziga pụta ìhè.
- source_word: ὁ ἄγγελος
  choice: mmụọ ozi
  rationale: N’akụkọ a, ἄγγελος bụ onye ozi nke eluigwe, ya mere okwu Igbo a na-ahụkarị, ‘mmụọ ozi,’ dabara karịa naanị ‘onye ozi.’
- source_word: Γαβριὴλ
  choice: Gebriel
  rationale: A sụgharịghị aha mmadụ; e dere ya dịka usoro mkpọpụta aha ahụ si dị n’Igbo ọkọlọtọ.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: si n’ebe Chineke nọ
  rationale: 'ἀπό na genitive na-egosi isi mmalite: ozi ahụ si n’ebe Chineke nọ. Nke a na-ezere ịgbanwe ya naanị ka ọ bụrụ ngosipụta onye mere ihe ahụ.'
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: ka ọ gaa n’otu obodo dị na Galili
  rationale: εἰς na-egosi ebe a na-aga; genitive τῆς Γαλιλαίας nwere ike ịbụ obodo ‘nke Galili’ ma ọ bụ, n’ụzọ Igbo na-ada nke ọma, obodo ‘dị na Galili.’
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: nke a na-akpọ Nazaret
  rationale: Nhazi ahụ pụtara n’ụzọ nkịtị ‘nke aha ya bụ Nazaret’; ‘nke a na-akpọ Nazaret’ bụ Igbo doro anya ma dịkwa nkenke.
theological_decisions:
- issue: Ihe ‘ọnwa nke isii’ na-ezo aka na ya
  choice: E debere ya naanị dịka ‘ọnwa nke isii’ n’ahịrịokwu bụ isi, ebe nkọwa ala peeji na-egosi na ọ bụ ọnwa nke isii nke afọ ime Elizabet.
  alternative: Ịghọta ya dịka ọnwa nke isii n’afọ.
  rationale: Ihe gbara amaokwu a gburugburu na Luk 1:24, 36 na-egosi afọ ime Elizabet, ma okwu Grik n’amaokwu a ekwughị ya ọzọ. Ya mere, a naghị etinye nkọwa ahụ n’ime ederede bụ isi.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-edobe olu nnara nke ἀπεστάλη, ma na-eji ‘ka ọ gaa’ mee ka ebe e zigara ya doo anya n’Igbo.
