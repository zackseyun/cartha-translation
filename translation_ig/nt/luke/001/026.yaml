review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the temporal phrase, Gabriel, God as the sender/source, Galilee, and Nazareth. However, “e si n’ebe Chineke nọ zite” is not an adequately formed past passive rendering of ἀπεστάλη; it needs the completed passive verb “e zitere.” The destination should remain explicit.
  naturalness: 'The proposed revision uses fluent Standard Igbo: “E zitere ... gaa n''otu obodo...” naturally expresses a completed sending to a destination without making the clause sound like a habitual action.'
  terminology: “mmụọ ozi,” “Chineke,” “Gebriel,” “Galili,” and “Nazaret” are appropriate standard biblical Igbo terms. The main-text wording retains the source’s indefiniteness (“otu obodo”) and does not expand the referent of “ọnwa nke isii.”
  issues:
  - severity: medium
    issue: The passive verb phrase is incomplete/unnatural
    rationale: “e si n’ebe Chineke nọ zite” employs the bare infinitive “zite” where the aorist passive ἀπεστάλη requires a completed passive past form. “E zitere” accurately and naturally renders “was sent.”
  - severity: low
    issue: Destination expression can be made more direct
    rationale: Replacing “ka ọ gaa n’otu obodo” with “gaa n’otu obodo” after “E zitere” gives a more idiomatic Igbo expression of being sent to a place while retaining the destination marked by εἰς.
  revised_text: N’ọnwa nke isii[a], e zitere mmụọ ozi Gebriel site n’ebe Chineke nọ gaa n’otu obodo dị na Galili, nke a na-akpọ Nazaret[b].
  revised_footnotes:
