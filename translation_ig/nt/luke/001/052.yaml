revisions:
- from: O si n’ocheeze kwatuo ndị ọchịchị[a], buliekwa ndị e wedara ala elu[b].
  to: O wedara ndị ọchịchị n’ocheeze ha[a], buliekwa ndị dị ala elu[b].
  rationale: The revision uses an idiomatic Igbo expression for bringing rulers down from their thrones and replaces the passive “those brought low” with “the lowly,” which more accurately represents ταπεινούς. The possessive “ha” is supplied by normal Igbo usage and is implicit in the source’s reference to rulers being removed from thrones. The paired completed actions and the ambiguity concerning the lowly/humble are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T09:26:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the reversal of powerful rulers and lowly people, but “ndị e wedara ala” portrays people who have already been brought low rather than the Greek ταπεινούς, which describes the lowly/humble people whom God exalts. “kwatuo” can also suggest demolishing or overthrowing more forcefully than needed when applied directly to persons.
  naturalness: The opening word order, “O si n’ocheeze kwatuo ndị ọchịchị,” is understandable but less idiomatic and does not naturally express removal from the rulers’ thrones. “O wedara ndị ọchịchị n’ocheeze ha” is a clear, natural idiom for dethroning rulers.
  terminology: “Ndị ọchịchị” appropriately renders δυνάστας in this throne context. “Ndị dị ala” preserves the social sense of ταπεινούς without falsely making them the already-humiliated; the footnote retains the related sense “ndị dị umeala n’obi.”
  issues:
  - severity: medium
    issue: “ndị e wedara ala” for ταπεινούς
    rationale: This passive relative expression means ‘those who have been brought low,’ importing an action not present in the adjective. The Greek refers to lowly/humble persons.
  - severity: medium
    issue: “kwatuo” and the placement of “si n’ocheeze”
    rationale: Applied to people, “kwatuo” may imply a stronger overthrow, and the phrase order is less natural. An idiomatic dethroning construction better renders καθεῖλεν δυνάστας ἀπὸ θρόνων.
  revised_text: O wedara ndị ọchịchị n’ocheeze ha[a], buliekwa ndị dị ala elu[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị dị ike.” Okwu Grik ahụ pụrụ ịpụta ndị nwere ike n’ozuzu, ọ bụ ezie na okwu banyere ocheeze na-akwado echiche nke ndị ọchịchị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị dị umeala n’obi.” Okwu Grik ahụ pụrụ ịpụta ndị nọ n’ọnọdụ dị ala na/ma ọ bụ ndị dị umeala n’obi.
    reason: lexical_alternative
