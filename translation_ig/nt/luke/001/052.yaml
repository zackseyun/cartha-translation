  text: καθεῖλεν δυνάστας ἀπὸ θρόνων καὶ ὕψωσεν ταπεινούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/052.yaml
  text: He has brought down rulers from thrones and exalted the humble[a][b].
translation:
  language: ig
  text: O wedara ndị ọchịchị n’ocheeze ha[a], buliekwa ndị dị ala elu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị dị ike.” Okwu Grik ahụ pụrụ ịpụta ndị nwere ike n’ozuzu, ọ bụ ezie na okwu banyere ocheeze na-akwado echiche nke ndị ọchịchị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị dị umeala n’obi.” Okwu Grik ahụ pụrụ ịpụta ndị nọ n’ọnọdụ dị ala na/ma ọ bụ ndị dị umeala n’obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: kwatuo
  rationale: Ọ na-egosi iweda ndị nọ n’ọkwa dị elu ma ọ bụ iwepụ ha n’ike, n’ebughị ụzọ kọwaa na e ji ime ihe ike mee ya.
- source_word: δυνάστας
  choice: ndị ọchịchị
  rationale: Okwu Grik ahụ nwere ike ịpụta ndị dị ike n’ozuzu, ma njikọ ya na ocheeze na-eme ka ndị na-achị achị bụrụ ihe a na-elekwasị anya.
- source_word: ἀπὸ θρόνων
  choice: si n’ocheeze
  rationale: Nke a na-echekwa ihe oyiyi ocheeze dị n’akwụkwọ mbụ ma ghara ịgbakwunye nnọchiaha nke na-adịghị na Grik.
- source_word: ὕψωσεν
  choice: buliekwa ... elu
  rationale: Nkebiokwu Igbo a na-enye echiche nke ibuli mmadụ n’ọnọdụ ma na-adaba nke ọma na ntụgharị ọnọdụ dị n’abụ ahụ.
- source_word: ταπεινούς
  choice: ndị e wedara ala
  rationale: Nke a nwere ike ịgụnye ma ndị nọ n’ọnọdụ dị ala ma ndị dị umeala n’obi, n’agbanyeghị na ọ na-eme ka ọnọdụ mmekọrịta mmadụ pụta ìhè.
theological_decisions:
- issue: Oge na ọdịdị omume nke aorist ndị dị n’abụ Meri
  choice: Jiri “O ... kwatuo ... buliekwa” dị ka omume Chineke e gosipụtara n’ụzọ zuru ezu n’akụkọ abụ ahụ.
  alternative: A pụrụ ịsụgharị ya n’ụzọ na-emesi omume gara aga ike, ma ọ bụ dị ka eziokwu Chineke na-eme mgbe niile.
  rationale: Usoro ngwaa Igbo anaghị ekewa simple past na present perfect kpọmkwem dịka Bekee. Nhazi a na-egosi omume doro anya nke Chineke n’emeghị mkpebi siri ike ma ọ bụ amụma, nchịkọta akụkọ, ma ọ bụ eziokwu a na-eto n’abụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị nsọ. E ji “ocheeze” chekwaa ihe oyiyi eze dị na Grik; e ji “ndị e wedara ala” mee ka ntụgharị ọnọdụ pụta ìhè, ebe nkọwa ala peeji na-echekwa echiche nke ịdị umeala n’obi.
