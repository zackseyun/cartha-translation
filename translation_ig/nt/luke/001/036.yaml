  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: ig
  text: Ma lee, Elizabet, onye ikwu gị, atụwokwa ime nwa nwoke n’agadi ya; ugbu a ọ nọ n’ọnwa nke isii nke ime ya, bụ nwanyị ahụ a na-akpọ aga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: Ma lee
  rationale: Na-adọta uche onye na-ege ntị n’ụzọ doro anya ma bụrụkwa okwu Igbo dị ugbu a.
- source_word: συγγενίς
  choice: onye ikwu
  rationale: Na-egosi nwanyị onye ezinụlọ ma ọ bụ onye agbụrụ, na-enweghị ịkọwa ụdị mmekọrịta ahụ karịa ihe Grik kwuru.
- source_word: συνείληφεν υἱὸν
  choice: atụwokwa ime nwa nwoke
  rationale: Na-enye echiche nke ịtụrụ ime nwa nwoke n’ụzọ Igbo kwụ ọtọ; ‘-kwa’ na-echekwa καὶ αὐτή, ya bụ, na Elizabet onwe ya kwa atụwo ime.
- source_word: ἐν γήρει αὐτῆς
  choice: n’agadi ya
  rationale: Ọ bụ nsụgharị dị mfe ma kwekọọ n’echiche nke ime agadi.
- source_word: στείρᾳ
  choice: aga
  rationale: ‘Aga’ bụ okwu Igbo a na-aghọta maka nwanyị na-amụghị nwa, ma na-echekwa nkọwa mmekọrịta mmadụ nyere ya.
theological_decisions:
- issue: Ma Elizabet bụ kpọmkwem nwanne Meri ma ọ bụ onye ikwu n’ozuzu
  choice: onye ikwu
  alternative: nwanne nwanyị
  rationale: συγγενίς anaghị akọwa kpọmkwem ogo ma ọ bụ ụdị mmekọrịta ezinụlọ; ya mere, a hapụrụ nghọtahie ahụ ka ọ dị.
- issue: Ọnọdụ enweghị nwa nke Elizabet
  choice: nwanyị ahụ a na-akpọ aga
  alternative: nwanyị ahụ bụ aga
  rationale: τῇ καλουμένῃ na-ekwu banyere ihe a na-akpọ ya, ọ bụghị nkwupụta na ọnọdụ ahụ ka na-adịgide mgbe ọ tụworo ime.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jighị okwu ụka pụrụ iche; a chekwara usoro nkwupụta na mmesi ike nke amaokwu Grik ahụ.
