  text: τοῦ δοῦναι γνῶσιν σωτηρίας τῷ λαῷ αὐτοῦ ἐν ἀφέσει ἁμαρτιῶν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: ig
  text: iji nye ndị nke ya ihe ọmụma banyere nzọpụta n’ime mgbaghara nke mmehie ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site na mgbaghara nke mmehie ha”; ma ọ bụ, “n’ihi mgbaghara nke mmehie ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: iji mee ka ... mata
  rationale: Ngwaa ebumnuche a dabere n’amaokwu bu ụzọ. N’Igbo, ‘iji mee ka ... mata’ na-egosipụta ebumnuche ahụ n’ụzọ doro anya ma dịkwa eke.
- source_word: γνῶσιν
  choice: mata
  rationale: N’usoro okwu Igbo a, ‘mee ka ... mata’ na-enye echiche nke inye ihe ọmụma ma na-ada eke karịa iji aha nkịtị ‘ihe ọmụma.’
- source_word: σωτηρίας
  choice: nzọpụta
  rationale: ‘Nzọpụta’ bụ okwu Igbo a na-ejikarị akọwa σωτηρία, ọ dabara ma echiche ịnapụta mmadụ ma ihe ọ pụtara n’ọnọdụ okpukpe Luk.
- source_word: τῷ λαῷ αὐτοῦ
  choice: ndị ya
  rationale: ‘Ndị ya’ na-egosipụta ndị bụ nke ya, bụ́ ndị natara ihe ọmụma ahụ. Ọ bụ okwu dị mfe ma bụrụkwa Igbo eke maka λαός n’ebe a.
- source_word: ἐν ἀφέσει
  choice: n’ime mgbaghara
  rationale: ‘N’ime’ na-echekwa ohere ihe ἐν pụtara ebe a—ọnọdụ ma ọ bụ ụzọ e si amata nzọpụta—n’ebughị ụzọ kpebie na ọ bụ naanị ‘site na’ ma ọ bụ ‘n’ihi.’
- source_word: ἁμαρτιῶν αὐτῶν
  choice: mmehie ha
  rationale: ‘Mmehie ha’ na-egosipụta na mmehie ndị a bụ nke ndị ahụ. N’Igbo, ‘mmehie’ nwere ike izo aka n’ọtụtụ mmehie n’enweghị akara ọtụtụ pụrụ iche.
theological_decisions:
- issue: Mmekọrịta dị n’etiti nzọpụta na mgbaghara
  choice: A sụgharịrị ἐν dịka ‘n’ime,’ ka amaokwu ahụ gosi na a na-amata nzọpụta n’ihe metụtara mgbaghara mmehie nakwa n’ime ya.
  alternative: A pụkwara ịsụgharị ya ‘site na mgbaghara mmehie ha’ ma ọ bụ ‘n’ihi mgbaghara mmehie ha.’
  rationale: Nkebiokwu Grik ahụ nwere ike igosi ọnọdụ, ụzọ, ma ọ bụ ihe e ji eme ihe. ‘N’ime’ na-echekwa njikọ ahụ n’emeghị ka otu nkọwa bụrụ naanị nke ziri ezi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị nsọ ma dị mfe nghọta. Ahịrịokwu a na-aga n’ihu n’usoro ụtọasụsụ nke amaokwu bu ya ụzọ; e ji ‘ndị ya’ mee ka okwu ahụ dị eke nye ndị na-agụ Igbo.
