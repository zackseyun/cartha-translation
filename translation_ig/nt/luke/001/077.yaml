- from: iji mee ka ndị ya mata nzọpụta n’ime mgbaghara mmehie ha.[a]
  to: iji nye ndị nke ya ihe ọmụma banyere nzọpụta n’ime mgbaghara nke mmehie ha.[a]
  rationale: The revision retains the purpose infinitive, explicitly renders γνῶσις as “ihe ọmụma,” preserves salvation terminology, and expresses the people as “ndị nke ya.” It keeps “n’ime” for ἐν so that the source’s open relation between salvation and forgiveness is not narrowed. The footnote remains anchored to the phrase and presents the close instrumental and causal alternatives.
