  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: ig
  text: Mmụọ ozi ahụ wee sị ya, “Atụla egwu, Meri, n’ihi na ị nwetala ihu ọma n’ebe Chineke nọ.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ “amara”: aha Grik χάρις nwere ike ịpụta “amara” ma ọ bụ “ihu ọma,” ma n’usoro okwu a bụ “inweta ihu ọma n’ebe Chineke nọ,” “ihu ọma” dabara nke ọma n’ebe a.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: wee sị
  rationale: N’akụkọ a, nke a bụ ụzọ Igbo si akọ omume sochiri nke ọzọ n’ụzọ dị mfe ma bụrụkwa nke e ji ewebata okwu ọnụ.
- source_word: ἄγγελος
  choice: Mmụọ ozi
  rationale: N’akụkọ ọmụmụ Jizọs nke Luk, okwu a na-ezo aka n’onye ozi si n’eluigwe, ya mere “mmụọ ozi” bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe.
- source_word: Μὴ φοβοῦ
  choice: Atụla egwu
  rationale: Nke a bụ mmachibido iwu e kwuru kpọmkwem; “Atụla egwu” bụ okwu Igbo eke na nghọta ya bụ ka Meri ghara ịtụ egwu.
- source_word: Μαριάμ
  choice: Meri
  rationale: E ji ụdị aha a ndị na-agụ Bible Igbo maara nke ọma mee ihe.
- source_word: εὗρες
  choice: ị nwetala
  rationale: Ụdị mmecha “-tala” na-egosi na Meri enwetawo ihu ọma ahụ, ọnọdụ ya ka dịkwa otu ahụ n’oge mmụọ ozi na-agwa ya okwu.
- source_word: χάριν
  choice: ihu ọma
  rationale: N’usoro okwu εὗρες χάριν, “ihu ọma” na-egosipụta echiche nke ịbụ onye Chineke nabatara ma meere amara, ma ọ naghị amanye nkọwa ozizi e mechara tinye n’okwu a.
- source_word: παρὰ τῷ θεῷ
  choice: n’ebe Chineke nọ
  rationale: Nke a na-egosipụta na ọ bụ n’anya Chineke, ma ọ bụ n’ebe Chineke nọ, ka Meri nwetara ihu ọma ahụ; ọ bụkwa ụzọ okwu dị nkenke ma bụrụ nke Igbo.
theological_decisions:
- issue: Ịsụgharị χάριν n’okwu metụtara Meri
  choice: ihu ọma
  alternative: amara
  rationale: Usoro okwu Grik εὑρίσκω χάριν παρά na-abụkarị “inweta ihu ọma n’ebe mmadụ nọ.” Nhọrọ a na-edebe echiche nke nnabata ọma Chineke n’etinyeghị ozizi okpukpe e mesịrị n’amaokwu ahụ; ihe odide ala ala peeji na-echekwakwa “amara” dịka ezigbo ụzọ ọzọ e nwere ike isi ghọta χάρις.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, mee ihe. Ahịrịokwu ahụ na-eso usoro akụkọ Igbo eke, ma na-echekwa njikọ, mmachibido iwu, na nghọta nke okwu Grik ahụ n’enweghị ịgbakwunye nkọwa ụka pụrụ iche.
