  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: ig
  text: Ọzọkwa, mmụọ m aṅụrịwo ọṅụ n’ime Chineke, Onye Nzọpụta m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmụọ m nwekwara nnukwu ọṅụ n’ime Chineke, Onye Nzọpụta m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (njikọ ahịrịokwu ahụ na nke bu ya ụzọ, nke a na-egosipụta site n’usoro okwu)
  rationale: καί bụ njikọ dị mfe nke jikọtara ahịrị a na amaokwu bu ya ụzọ. N’Igbo, ịmalite ahịrị a na “na” agaghị ada ka okwu nkịtị; njikọ ahụ ka pụtara ìhè n’usoro abụ ahụ.
- source_word: ἠγαλλίασεν
  choice: aṅụrịala ọṅụ
  rationale: Okwu a na-egosi ọṅụ dị ukwuu. “Aṅụrịala ọṅụ” bụ Igbo doro anya ma dị ebube, na-egosikwa omume ahụ dị ka ihe mezuru n’usoro abụ a.
- source_word: τὸ πνεῦμά μου
  choice: mmụọ m
  rationale: Nke a na-echekwa okwu πνεῦμα na ọdịiche ya na “mkpụrụ obi m” dị n’amaokwu bu ụzọ, n’agbanyeghị na ha na-arụkọ ọrụ n’usoro abụ ahụ.
- source_word: ἐπὶ τῷ θεῷ
  choice: n’ime Chineke
  rationale: Mgbe ἀγαλλιάω so ἐπί na dative, ọ pụrụ igosi ihe ọṅụ ahụ dabeere na ya ma ọ bụ ihe kpatara ya. “N’ime Chineke” bụ okwu Igbo kwụ ọtọ nke na-echekwa isi mmekọrịta dị n’okwu ahụ.
- source_word: τῷ σωτῆρί μου
  choice: Onye Nzọpụta m
  rationale: σωτήρ pụtara onye na-azọpụta ma ọ bụ onye na-anapụta. “Onye Nzọpụta m” na-enye ihe okwu Grik ahụ kwuru kpọmkwem ma na-echekwa ịdị arọ ya n’otuto Meri.
theological_decisions:
- issue: Ịkpọ Chineke “Onye Nzọpụta m”
  choice: Chineke, Onye Nzọpụta m
  alternative: Chineke, Onye Nnapụta m
  rationale: Grik ahụ kpọrọ Chineke kpọmkwem Onye Nzọpụta Meri. Nsụgharị a na-echekwa nkwupụta ahụ n’etinyeghị nkọwa ozizi ọzọ n’ime ya.
- issue: Mmekọrịta dị n’etiti “mmụọ m” na “mkpụrụ obi m” n’amaokwu gbara ya gburugburu
  choice: Idowe okwu abụọ ahụ iche
  alternative: Ịsụgharị ha abụọ otu ụzọ dị ka ihe dị n’ime mmadụ
  rationale: Usoro abụ ahụ na-egosi na echiche ha yiri ibe ha, ma Grik jiri okwu abụọ dị iche. Idowe “mmụọ m” na-echekwa ma ụdị edemede ahụ ma esemokwu nkọwa ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “aṅụrịala ọṅụ” iji gosipụta ọṅụ siri ike nke ἠγαλλίασεν; e zere ịmalite ahịrị ahụ na “na” n’ihi na nke ahụ adịghị ada ka Igbo nkịtị mgbe e wepụtara amaokwu a naanị ya.
