  text: καὶ ἀποκριθεῖσα ἡ μήτηρ αὐτοῦ εἶπεν· Οὐχί, ἀλλὰ κληθήσεται Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/060.yaml
  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: ig
  text: 'Nne ya zara sị: “Mba, kama a ga-akpọ ya Jọn.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἀποκριθεῖσα ... εἶπεν
  choice: Nne ya zara sị
  rationale: E ji “zara sị” mee ka usoro participle na ngwaa okwu Grik bụrụ Igbo dị nkenke ma dịrị ndị na-agụ ya mfe; ọ ka na-egosi na okwu nne ya bụ nzaghachi.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: nne ya
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta njikọ onye nwe ihe, ma na-edobe onye a na-ekwu maka ya nke ọma.
- source_word: Οὐχί
  choice: Mba!
  rationale: “Mba” bụ nzaghachi Igbo doro anya nke na-egosipụta ịjụ echiche ndị ọzọ siri ike dịka οὐχί si mee n'ọnọdụ a.
- source_word: ἀλλὰ
  choice: Kama
  rationale: “Kama” na-egosi na nne ya na-agbazi aha ndị ahụ chọrọ ịkpọ nwa ahụ, ọ bụghị nanị na ọ na-etinye okwu ọzọ.
- source_word: κληθήσεται
  choice: a ga-akpọ ya
  rationale: Usoro a na-egosipụta ọdịnihu na passive nke ngwaa καλέω n'ụzọ Igbo sitere n'okike, na-enweghị ịkọ onye ga-akpọ ya aha ahụ.
- source_word: Ἰωάννης
  choice: Jọn
  rationale: “Jọn” bụ ụdị aha a maara nke ọma n'Igbo maka Ἰωάννης.
theological_decisions: []
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị mfe, dị ùgwù, ma dịrị n'ọnụ; e debere ike nke nzaghachi nne ya na ọdịdị amụma nke aha a ga-akpọ nwa ahụ.
