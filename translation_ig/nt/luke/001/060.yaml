  source_fidelity: The draft accurately conveys the mother’s reply, the corrective force of ἀλλά, the future passive sense of κληθήσεται, and the name Ἰωάννης. “A ga-akpọ ya” appropriately leaves the unnamed agent implicit, as does the Greek passive.
