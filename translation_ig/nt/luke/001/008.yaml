  text: Ἐγένετο δὲ ἐν τῷ ἱερατεύειν αὐτὸν ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ ἔναντι τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: ig
  text: O wee ruo, mgbe ọ na-arụ ọrụ nchụaja n’ihu Chineke n’usoro ìgwè ọrụ ya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: O wee ruo na
  rationale: Usoro akụkọ a na-egosi mmegharị gaa n’ihe ọhụrụ mere; nsụgharị a bụ nke Igbo e ji akọ akụkọ n'ụzọ ebumpụta ụwa, ma ọ naghị etinye echiche nke esemokwu siri ike na δέ.
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: mgbe ọ na-eje ozi dị ka onye nchụaja
  rationale: Articular infinitive ya na ἐν nwere ọrụ nke oge, ebe ἱερατεύω na-akọwa ije ozi nchụaja kpọmkwem.
- source_word: τάξει
  choice: dịka usoro ... si dị
  rationale: N’ọnọdụ a, τάξις bụ usoro a haziri ahazi nke ọrụ nchụaja; akpaokwu Igbo a na-eme ka njikọ ahụ doo anya.
- source_word: ἐφημερίας
  choice: ìgwè ọrụ ya
  rationale: Ọ na-ezo aka n’ìgwè ndị nchụaja nwere oge ọrụ e kenyere ha; ‘ìgwè ọrụ’ na-eme ka ihe ụlọ nsọ ahụ pụta ìhè nye onye na-agụ Igbo nke oge a.
- source_word: ἔναντι τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Nke a na-edobe okwu nkịtị nke ịnọ n’ihu Chineke ma ọ bụ ije ozi n’ebe ọ nọ, n’enweghị ịgbakwunye nkọwa okpukpe ọzọ.
theological_decisions:
- issue: Okwu gbasara ọrụ nchụaja Zekaraya n’ụlọ nsọ
  choice: ọ na-eje ozi dị ka onye nchụaja n’ihu Chineke, dịka usoro nke ìgwè ọrụ ya si dị
  alternative: ọ na-arụ ọrụ nchụaja n’ihu Chineke n’oge ìgwè ya ruru ịrụ ọrụ
  rationale: Nhọrọ ahụ na-edobe ma ọrụ nchụaja ahụ ma usoro ìgwè ndị nchụaja, n’enweghị ibubata echiche ụka nke oge e mesịrị. Ọ naghị emechi ma τάξις na-elekwasị anya n’usoro e debere ma ọ bụ n’oge ntụgharị ọrụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘onye nchụaja’ maka onye na-arụ ọrụ ịchụ àjà n’ụlọ nsọ; ‘ìgwè ọrụ’ na-egosi nkewa ndị nchụaja e kenyere oge ọrụ. Ahịrịokwu ahụ kwụsịrị na kọma n’ihi na amaokwu a bụ mmalite nke ahịrịokwu na-aga n’ihu n’amaokwu na-esote.
