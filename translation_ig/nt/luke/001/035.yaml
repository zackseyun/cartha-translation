id: LUK.1.35
reference: Luke 1:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: ig
  text: Mmụọ ozi ahụ zara ya sị, “Mmụọ Nsọ ga-abịakwasị gị, ike nke Onye Kasị Elu ga-ekpuchikwa gị; n’ihi ya kwa, onye nsọ ahụ a ga-amụ[a] ka a ga-akpọ Ọkpara Chineke[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nwa ahụ a ga-amụ.” Okwu Grik τὸ γεννώμενον pụtara n’ụzọ nkịtị “onye a na-amụ” ma ọ bụ “ihe a na-amụ.”
    reason: lexical_alternative
  - marker: b
    text: “Ọkpara Chineke” sụgharịrị okwu Grik nke na-enweghị isiokwu n’ihu “Ọkpara”; ma n’ebe a, ọ bụ utu aha pụrụ iche, ọ bụghị okwu pụtara “otu nwa Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: Mmụọ ozi ahụ zara ya sị
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosipụta azịza e nyere mmadụ, ma ọ na-echekwa ma omume ‘ịza’ ma okwu mmụọ ozi ahụ kwuru.
- source_word: Πνεῦμα ἅγιον
  choice: Mmụọ Nsọ
  rationale: Ọ na-ezo aka na Mmụọ Chineke dị nsọ; mkpụrụedemede ukwu na-egosi na ọ bụ aha e ji amata onye Chineke, ọ bụghị naanị mmụọ ma ọ bụ ọnọdụ dị nsọ.
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: ga-abịakwasị gị
  rationale: ‘Ịbịakwasị’ na-echekwa echiche nke ịbịakwute mmadụ n’ụzọ nwere ike ma bụrụkwa okwu Igbo doro anya.
- source_word: δύναμις Ὑψίστου
  choice: ike nke Onye Kasị Elu
  rationale: Ọ na-echekwa njikọ genitive ahụ ma were ‘Onye Kasị Elu’ dị ka utu aha Chineke.
- source_word: ἐπισκιάσει σοι
  choice: ga-ekpuchikwa gị
  rationale: ‘Ikpuchi’ na-enye echiche nke ịdị n’elu ma kpuchie mmadụ, na-enweghị itinye nkọwa gbasara mmekọahụ ma ọ bụ usoro ihe ndị e kere eke nke Grik ahụ na-ekwughị.
- source_word: διὸ καὶ
  choice: n’ihi ya kwa
  rationale: ‘N’ihi ya’ na-egosi ihe si na nke gara aga pụta, ebe ‘kwa’ na-echekwa ntakịrị ike mgbakwunye nke καί.
- source_word: τὸ γεννώμενον ἅγιον
  choice: onye nsọ ahụ a ga-amụ
  rationale: Nke a na-egosi na okwu ahụ bụ banyere nwa a ga-amụ ma na-echekwa nsọpụrụ e kwuru banyere ya, n’asụsụ Igbo dị mfe nghọta.
- source_word: κληθήσεται
  choice: ka a ga-akpọ
  rationale: Ọ na-echekwa ụdị okwu passive na echiche nke aha ma ọ bụ njirimara a ga-eji mara ya.
- source_word: υἱὸς θεοῦ
  choice: Ọkpara Chineke
  rationale: N’ebe a okwu ahụ na-arụ ọrụ dị ka utu aha pụrụ iche, ọ bụghị dịka otu nwa n’etiti ọtụtụ ụmụ; ‘Ọkpara Chineke’ bụ okwu Igbo a na-aghọta nke ọma maka aha a.
theological_decisions:
- issue: Ịsụgharị Πνεῦμα ἅγιον dịka onye Chineke
  choice: Mmụọ Nsọ
  alternative: mmụọ nsọ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi Mmụọ Chineke dịka onye na-arụ ọrụ n’ịtụrụ ime Jizọs; nsụgharị ahụ ekwesịghị ime ka ọ bụrụ naanị ike na-enweghị onye nwe ya.
- issue: Ike doro anya nke υἱὸς θεοῦ n’Igbo
  choice: Ọkpara Chineke
  alternative: otu nwa Chineke
  rationale: Ọ bụ ezie na isiokwu Grik adịghị n’ihu υἱός, n’ebe a okwu ahụ bụ utu aha na njirimara Kraịst. Ya mere, e zere nsụgharị ga-eme ka ọ dị ka ọ bụ naanị otu nwa n’etiti ọtụtụ ndị.
- issue: Ichekwa ihe atụ dị nsọ nke ἐπισκιάσει
  choice: ga-ekpuchikwa gị
  alternative: ga-ekpuchi gị n’onyinyo
  rationale: Nhọrọ a na-echekwa asụsụ ihe atụ banyere ọrụ Chineke ma ghara ịgbakwunye nkọwa banyere otú ịtụrụ ime ahụ si mee nke ederede ahụ na-enyeghị.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-agbaso usoro echiche Grik, ma a haziri ya ka ọ na-ada ka okwu Igbo nkịtị. E debere akara nkọwa [a] na [b] kpọmkwem n’ebe okwu ndị nkọwa ha metụtara dị.
