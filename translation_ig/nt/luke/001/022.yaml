  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: ig
  text: Ma mgbe ọ pụtara, o nweghị ike ịgwa ha okwu. Ha wee ghọta na ọ hụrụ ọhụụ n’ime ebe nsọ ahụ[a]. Ọ nọgidere na-emere ha ihe ịrịba ama, ọ nọgidekwara bụrụ onye ogbi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ụlọ nsọ.” Okwu Grik e ji mee ihe n’ebe a na-ezo kpọmkwem n’ebe nsọ dị n’ime ụlọ nsọ karịa ogige ụlọ nsọ niile.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a nwere ike ịpụta onye na-enweghị ike ikwu okwu; n’ọnọdụ ụfọdụ, ọ nwekwara ike ịgụnye onye na-enweghị ike ịnụ ihe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: mgbe ọ pụtara
  rationale: A sụgharịrị participle aorist a dị ka nkebi oge n’Igbo, nke na-egosi na ọ pụtara tupu ihe ndị ọzọ emee ma na-adakwa nke ọma n’asụsụ Igbo.
- source_word: οὐκ ἐδύνατο λαλῆσαι αὐτοῖς
  choice: o nweghị ike ịgwa ha okwu
  rationale: Nke a na-echekwa echiche nke enweghị ike dị na δύναμαι tinyere infinitive, ma bụrụkwa okwu Igbo doro anya ma dị ndụ.
- source_word: ἐπέγνωσαν
  choice: ha wee ghọta
  rationale: Ngwaa ahụ na-egosi na ha matara ihe merenụ site n’ihe ha hụrụ; “ghọta” na-egosipụta nghọta ahụ n’ụzọ eke.
- source_word: ὀπτασίαν
  choice: ọhụụ
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ihe karịrị nke mmadụ nke Chineke mere ka a hụ; “ọhụụ” bụ okwu Igbo kwesịrị ekwesị.
- source_word: ἐν τῷ ναῷ
  choice: n’ime ebe nsọ ahụ
  rationale: ναός na-ezo kpọmkwem n’ebe nsọ dị n’ime ụlọ nsọ, ọ bụghị ogige ụlọ nsọ niile. “Ebe nsọ” na-echekwa ọdịiche ahụ.
- source_word: ἦν διανεύων
  choice: ọ nọgidere na-emere ha ihe ịrịba ama
  rationale: Periphrastic imperfect a na-egosi omume gara n’ihu ruo oge ụfọdụ; “nọgidere na-eme” na-egosipụta ịdịgide ahụ nke ọma.
- source_word: διέμενεν κωφός
  choice: nọgidekwa bụrụ onye ogbi
  rationale: “Nọgide” na-egosi ọnọdụ gara n’ihu, ebe “onye ogbi” na-egosipụta enweghị ike ikwu okwu nke amaokwu ahụ kwusiri ike, n’agbanyeghị na κωφός nwekwara ike ịgụnye enweghị ike ịnụ ihe n’ọnọdụ ụfọdụ.
theological_decisions:
- issue: Ihe κωφός pụtara gbasara ọnọdụ Zekaraya
  choice: onye ogbi
  alternative: onye ntị chiri na onye ogbi
  rationale: Amaokwu a na-ekwusi ike na Zekaraya enweghị ike ikwu okwu nakwa na ọ na-eme ihe ịrịba ama. Ya mere, isi ederede ekwughị hoo haa na ọ bụ onye ntị chiri; nkọwa ala peeji na-echekwa ohere ọzọ okwu Grik ahụ nwere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee amaokwu ahụ. E kewara ahịrịokwu mbụ ụzọ abụọ ka ọ gụọ nke ọma n’Igbo. E tinyere akara ala peeji [a] n’akụkụ “ebe nsọ” na [b] n’akụkụ “onye ogbi,” ka akara ọ bụla kwekọọ kpọmkwem na nkọwa ya.
