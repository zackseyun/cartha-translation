  rationale: The revision makes “from the beginning” modify the eyewitness experience rather than the origin of the people and renders γενόμενοι as “ghọrọ” (“became”) without adding “later.” It retains the draft’s natural rendering of eyewitnesses, service to the word, and the implicit transmitted referent (“ha”) in continuity with the preceding context.
