id: LUK.1.2
reference: Luke 1:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: ig
  text: dị ka ndị ji anya ha hụ ihe ndị a site ná mmalite, ndị ghọrọ ndị na-ejere okwu ahụ ozi, siri nyefee anyị ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ozi ahụ.” Okwu Grik bụ λόγος (logos) nwere ike ịpụta “okwu,” “ozi,” ma ọ bụ “akụkọ”; n’ebe a, o yikarịrị ka ọ na-ezo aka n’ozi a na-ekwusa banyere Jizọs.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: dị nnọọ ka
  rationale: Ọ na-egosi na ihe a na-ekwu kwekọrọ n’ihe e kwuru n’amaokwu bu ya ụzọ; nkebi a bụ Igbo dị mfe nke na-echekwa njikọ ahụ.
- source_word: παρέδοσαν
  choice: nyefere anyị ha
  rationale: Ngwaa a na-ekwu maka inyefe ma ọ bụ ibufe ozi e nwetara n’aka ndị ọzọ; ‘nyefere’ na-egosi nnyefe a nke ọma.
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: ndị ahụ sitere ná mmalite
  rationale: Nke a na-akọwa ìgwè ndị nọ ebe ahụ kemgbe mmalite ihe ndị a na-akọ.
- source_word: αὐτόπται
  choice: jiri anya ha hụ ihe ndị ahụ
  rationale: Nke a bụ ụzọ Igbo e si akọwa ndị ji anya ha hụ ihe n’onwe ha, kama iji okwu siri ike ma ọ bụ nke na-abụghị nke nkịtị.
- source_word: ὑπηρέται
  choice: ndị na-ejere ... ozi
  rationale: Ọ na-egosi ndị tinyere onwe ha n’ọrụ okwu ahụ, n’etinyeghị echiche banyere ọkwa pụrụ iche n’ọgbakọ.
- source_word: γενόμενοι
  choice: mesịa bụrụ
  rationale: Ọ na-echekwa ọdịiche dị n’etiti ịbụ ndị ji anya ha hụ ihe site ná mmalite na ịbụ ndị bịara jeere okwu ahụ ozi.
- source_word: τοῦ λόγου
  choice: okwu ahụ
  rationale: ‘Okwu’ na-echekwa obosara nghọta λόγος, ebe n’ebe a ọ ga-abụkarị ozi a na-ekwusa banyere Jizọs.
theological_decisions:
- issue: Ihe τοῦ λόγου (‘okwu ahụ’) na-ezo aka na ya
  choice: okwu ahụ
  alternative: ozi ahụ; akụkọ ahụ
  rationale: N’ebe a, λόγος yiri ka ọ na-ezo aka n’ozi a na-ekwusa banyere Jizọs, ọ bụghị Jizọs dị ka ‘Okwu’ n’aha pụrụ iche. A hapụrụ ‘okwu ahụ’ n’ahịrị bụ isi iji ghara imechi nghọta okwu Grik ahụ, tinyekwa nkọwa ọzọ n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. ‘Jiri anya ha hụ’ bụ okwu nkịtị karịa ịmepụta aha teknịkal maka ‘eyewitnesses,’ ebe ‘ndị na-ejere ... ozi’ na-ezere ịgụnye ọkwa ụka pụrụ iche.
