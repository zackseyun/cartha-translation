id: LUK.1.12
reference: Luke 1:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἐταράχθη Ζαχαρίας ἰδών, καὶ φόβος ἐπέπεσεν ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/012.yaml
  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: ig
  text: Mgbe Zekaraya hụrụ ya[a], obi erughị ya ala, egwu wee dakwasị ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “mgbe ọ na-ahụ ya” ma ọ bụ “ka ọ hụrụ ya”; participle Grik ἰδών na-egosi oge n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: obi gbara ya gharịị
  rationale: Okwu a na-egosi na ihe ahụ kpasuru Zakaịas nnukwu nchekasị n’ime obi, ma ọ naghị eme ka ọ bụrụ otu ihe ahụ kpọmkwem na φόβος, bụ́ egwu, nke sochiri ya.
- source_word: Ζαχαρίας
  choice: Zakaịas
  rationale: Nke a bụ nsụgharị aha ahụ n’ụdị a na-ejikarị ede ya n’Igbo.
- source_word: ἰδών
  choice: Mgbe ... hụrụ ya
  rationale: Aorist participle a nwere ọrụ nke igosi oge n’ebe a. ‘Ya’ na-ezo aka n’mmụọ ozi ahụ a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: φόβος
  choice: egwu
  rationale: ‘Egwu’ bụ okwu Igbo kwụ ọtọ nke na-edobe oke ihe okwu Grik ahụ pụtara n’ebughị ụzọ mee ka ọ sie ike karịa ka isiokwu ahụ kwuru.
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: dakwasị ya
  rationale: ‘Dakwasị ya’ na-edobe ihe atụ dị n’okwu Grik nke na-ekwu na egwu ‘dakwasịrị’ mmadụ, ma ọ bụkwa okwu Igbo doro anya ma dị ndụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a ma dị ugwu. A họọrọ ‘obi gbara ya gharịị’ iji gosipụta mgbagwoju anya na nchekasị dị n’ime obi, ebe ‘egwu dakwasị ya’ na-edobe ihe atụ na usoro echiche nke Grik.
