id: LUK.1.45
reference: Luke 1:45
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: ig
  text: Ngọzi na-adịịrị nwanyị ahụ kweere na[a] a ga-emezu[b] ihe ndị e si n’aka Onyenwe anyị gwa ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na a ga-emezu ihe ndị e si n’aka Onyenwe anyị gwa ya.” Njikọ okwu Grik a nwekwara ike ịpụta “n’ihi na,” ọ bụ ezie na “na,” nke na-ewebata ihe o kwere, yiri ka ọ ka dabara ebe a.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “a ga-arụzu” ma ọ bụ “a ga-eweta ruo n’isi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: Ngọzi dịrị
  rationale: Nke a na-egosipụta ịdị onye a gọziri agọzi n’ụzọ dị ùgwù ma dịkwa mfe nghọta, karịa ịsị nanị na obi dị ya ụtọ ma ọ bụ na ihe ọma dakwasịrị ya.
- source_word: ἡ πιστεύσασα
  choice: nwanyị ahụ kwere
  rationale: Ọ na-asụgharị participle ahụ dịka aha onye, na-egosikwa omume okwukwe ahụ e mere, n’asụsụ Igbo na-aga were were.
- source_word: ὅτι
  choice: na
  rationale: 'N’ebe a, ‘na’ na-ewebata ihe nwanyị ahụ kwere: na okwu ahụ ga-emezu. Agbanyeghị, e debere nghọta nke ‘n’ihi na’ n’ala peeji.'
- source_word: τελείωσις
  choice: a ga-emezu
  rationale: Ọ bụ ụzọ Igbo sitere n’okike si kwuo na a ga-eweta ihe e kwuru ruo n’isi ya; iji ngwaa eme ihe ebe a dị mfe karịa ịmanye aha nkịtị.
- source_word: τοῖς λελαλημένοις
  choice: ihe ndị ... gwa ya
  rationale: Nke a na-echekwa echiche nke ihe ndị e kwuburu nye ya, ma zere okwu siri ike ma ọ bụ nke na-adịghị aga were were.
- source_word: παρὰ κυρίου
  choice: e si n’aka Onyenwe anyị gwa ya
  rationale: ‘Si n’aka’ na-egosipụta na okwu ahụ sitere n’aka Onyenwe anyị, nke dabara n’ọrụ παρά tinyere genitive ebe a, na-amanyeghị echiche na Onyenwe anyị gwara ya okwu ozugbo n’onwe ya.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị ma dị ùgwù maka κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ngọzi Meri, okwukwe ya, na nkwa e nyere ya
  choice: A kpọrọ nwanyị ahụ onye a gọziri agọzi n’ihi na o kwere na ihe sitere n’aka Onyenwe anyị ga-emezu.
  alternative: A kpọrọ ya onye a gọziri agọzi n’ihi na ihe ndị a gwara ya ga-emezu, ebe ‘n’ihi na’ na-enye ihe kpatara ngọzi ahụ.
  rationale: Nhazi okwu Grik kacha akwado na ὅτι na-ewebata ihe o kwere. E debere nghọta ọzọ n’ala peeji ka a ghara ikpochapụ mgbagwoju anya dị n’ezie.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-eji ‘Ngọzi dịrị’ maka ụda nkwupụta ngọzi, ‘nwanyị ahụ’ iji mee ka onye a na-ekwu banyere ya doo anya, na ‘e si n’aka Onyenwe anyị’ iji chekwaa echiche nke isi mmalite okwu ahụ.
