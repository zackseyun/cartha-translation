  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: ig
  text: O yikwara m mma, ebe m nyochasịrị[a] ihe niile nke ọma site ná mmalite, idegara gị ha n’usoro[b], Teofilọs, onye a na-asọpụrụ nke ukwuu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe m soro ihe niile nke ọma site ná mmalite.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n’usoro kwesịrị ekwesị”; okwu ahụ nwere ike izo aka ná nhazi dị mma, ọ bụghị naanị n’usoro oge kpọmkwem.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε
  choice: Ọ dị m mma
  rationale: Nke a na-egosipụta mkpebi e ji nlezianya tụlee, ma na-edobekwa ụdị okwu nkw مقدمة ahụ karịa ịsị naanị ‘ekpebiri m.’
- source_word: κἀμοὶ
  choice: Ọ dịkwa m
  rationale: ‘-kwa’ na-egosi na Luk tinyere onwe ya n’etiti ndị ọzọ dere akụkọ ndị a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: παρηκολουθηκότι
  choice: ebe m nyochasịrị
  rationale: N’ebe a, okwu ahụ na-egosi iso ihe niile nke ọma ma ọ bụ ime nchọpụta nke ọma; ‘nyochasịrị’ bụ okwu Igbo doro anya ma kwekọọ n’ọrụ onye na-akwadebe akụkọ.
- source_word: ἄνωθεν
  choice: site ná mmalite
  rationale: N’okwu akụkọ ihe mere eme a, ihe ọ pụtara nke kacha kwekọọ bụ isi n’mmalite, ọ bụghị ‘site n’elu.’
- source_word: πᾶσιν
  choice: ihe niile
  rationale: Nke a na-egosipụta obosara ihe Luk nyochara n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἀκριβῶς
  choice: nke ọma
  rationale: Ya na ‘nyochasịrị,’ okwu a na-egosi nlezianya na izi ezi n’Igbo nkịtị ma dị ùgwù.
- source_word: καθεξῆς
  choice: n'usoro
  rationale: ‘N’usoro’ na-ahapụ ohere ka okwu ahụ bụrụ nhazi dị mma ma ọ bụ usoro ihe so ibe ya, n’enweghị ịmanye echiche na ọ bụ usoro oge kpọmkwem.
- source_word: σοι γράψαι
  choice: idepụtara gị ha
  rationale: Nke a na-egosi onye a na-edegara na ihe ndị a na-ede, nke a ghọtara site n’amaokwu ndị gbara ya gburugburu.
- source_word: κράτιστε
  choice: onye a na-asọpụrụ nke ukwuu
  rationale: Ọ bụ okwu nkwanye ùgwù e ji akpọ onye dị elu; ntụgharị a bụ nke ebumpụta ụwa ma dị ùgwù n’Igbo.
- source_word: Θεόφιλε
  choice: Teofilọs
  rationale: A sụgharịghị aha ahụ; e dere ya dịka ụda na usoro mkpope Igbo si dị.
theological_decisions:
- issue: Ihe καθεξῆς pụtara banyere usoro akụkọ
  choice: n'usoro
  alternative: n'usoro oge kpọmkwem
  rationale: Okwu Grik ahụ nwere ike ịpụta nhazi nwere usoro ma ọ bụ ihe ndị so ibe ha. Ọ naghị amanye nkwupụta na akụkọ niile nọ n’usoro oge kpọmkwem, ya mere ntụgharị ahụ na-echekwa ohere abụọ ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị mfe nghọta ma dị ùgwù. A nọgidere na ụdị okwu mmeghe e ji nlezianya dee; e jighị okwu ụka pụrụ iche ma ọ bụ nkọwa ozizi agbakwụnye.
