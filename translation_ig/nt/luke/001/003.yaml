revisions:
- from: Ọ dịkwa m mma[a], ebe m nyochasịrị ihe niile nke ọma site ná mmalite, idepụtara gị ha n'usoro, gị Teofilọs onye a na-asọpụrụ nke ukwuu[b],
  to: O yikwara m mma, ebe m nyochasịrị[a] ihe niile nke ọma site ná mmalite, idegara gị ha n’usoro[b], Teofilọs, onye a na-asọpụrụ nke ukwuu,
  rationale: The revision uses a natural formal Igbo idiom for Luke’s considered decision while retaining the inclusive force of -kwa. It preserves the investigative sense of παρηκολουθηκότι without excluding its more literal “followed closely” sense in a footnote. The καθεξῆς note is moved to its proper anchor, and “n’usoro” continues to preserve the Greek ambiguity between orderly arrangement and strict chronology.
