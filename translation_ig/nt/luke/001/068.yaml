  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: ig
  text: Onye a gọziri agọzi ka Onyenwe anyị, Chineke nke Izrel, bụ, n’ihi na o letala ndị ya anya ma wetara ha mgbapụta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Otuto dịrị
  rationale: Nke a bụ okwu ngọzi na otuto a na-ekwupụta nye Chineke. “Otuto dịrị” bụ Igbo dị ugbu a, dị ugwu, ma na-ebute ike ekpere otuto nke okwu Grik ahụ n’enweghị ahịrịokwu na-ada ka nkọwa nkịtị.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Ọ bụ aha nsọ a na-ejikarị akọwa Chineke dị ka Onyenwe; ọ na-echekwa ụda Akwụkwọ Nsọ na njikọ ya na Chineke Izrel.
- source_word: ὁ θεὸς τοῦ Ἰσραήλ
  choice: Chineke Izrel
  rationale: Nke a na-enye aha njirimara ahụ n’ụzọ doro anya ma dị mfe n’Igbo, dị ka nkọwa ọzọ nke “Onyenwe anyị.”
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere e ji too Chineke, dịka njikọ Grik ahụ si arụ ọrụ n’ebe a.
- source_word: ἐπεσκέψατο
  choice: ọ bịara ileta
  rationale: “Ileta” na-echekwa ihe atụ Akwụkwọ Nsọ nke Chineke bịara lebara ndị ya anya ma tinye aka n’ọnọdụ ha; “ọ bịara” na-eme ka okwu ahụ doo anya n’Igbo.
- source_word: ἐποίησεν λύτρωσιν
  choice: wetara ... mgbapụta
  rationale: N’agbanyeghị na akpaokwu Grik ahụ pụtara n’ụzọ nkịtị “mere mgbapụta,” “wetara mgbapụta” bụ Igbo eke nke na-echekwa omume ahụ na nsonaazụ ya.
- source_word: λύτρωσιν
  choice: mgbapụta
  rationale: Ọ na-echekwa echiche nke ịtọhapụ ma ọ bụ ịnapụta mmadụ site n’ọnọdụ njide, tinyere ịdị arọ nke okwu ahụ n’ihe gbasara nzọpụta.
- source_word: τῷ λαῷ αὐτοῦ
  choice: ndị ya ... ha
  rationale: “Ndị ya” bụ ụzọ Igbo dị mfe isi kwuo ndị nke Chineke; nnọchiaha “ha” na-egosi nke ọma na ọ bụ ha ka e wetara mgbapụta ahụ.
theological_decisions:
- issue: Okwu banyere nleta Chineke
  choice: ọ bịara ileta ndị ya
  alternative: ọ bịara inyere ndị ya aka
  rationale: Nhọrọ a na-echekwa ihe atụ sitere n’Akwụkwọ Nsọ banyere Chineke ileta ndị ya—ya bụ, ilebara ha anya ma tinye aka iji zọpụta ha—kama ịkọwa ya naanị dị ka inye aka.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe ma dị ugwu. “Otuto dịrị” na-enye ụda ekpere otuto; “ileta” na-echekwa okwu atụ Akwụkwọ Nsọ, ebe nkọwa ala peeji na-eme ka ihe ọ pụtara doo anya.
