source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: ig
  text: 'n’ihi na o lebara ọnọdụ dị ala[a] nke ohu nwanyị ya[b] anya. Lee, site ugbu a gaa n’ihu, ọgbọ niile ga-akpọ m onye a gọziri agọzi.


    [a] A pụkwara ịsụ: “ịdị ala” ma ọ bụ “mmechuihu.”

    [b] A pụkwara ịsụ: “odibo ya” ma ọ bụ “odibo nwanyị ya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụ: “ịdị ala” ma ọ bụ “mmechuihu.”'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụ: “odibo ya” ma ọ bụ “odibo nwanyị ya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: o lebara … anya
  rationale: Akpaalaokwu Igbo a na-egosi na Chineke tụgharịrị uche ya n’ebe Meri nọ; n’ọnọdụ a, ọ nwekwara echiche nke ile ya anya n’amara.
- source_word: ταπείνωσιν
  choice: ọnọdụ dị ala
  rationale: Nke a na-egosi ọnọdụ Meri nke dị ala na nke a na-adịghị ahụkebe n’etiti mmadụ, kama ime ka okwu ahụ bụrụ naanị àgwà ịdị umeala n’obi ya.
- source_word: δούλης
  choice: ohu nwanyị ya
  rationale: “Ohu” na-echekwa echiche nke onye nọ n’okpuru ma bụrụ nke nna ya ukwu; “nwanyị” na-egosipụta ụdị nwanyị dị n’okwu Grik, ebe “ya” na-echekwa njikọ nke ịbụ nke Chineke.
- source_word: ἰδοὺ
  choice: Lee
  rationale: “Lee” bụ okwu Igbo doro anya nke na-akpọ uche onye na-ege ntị ma na-echekwa nkwusi ike nke okwu Grik.
- source_word: ἀπὸ τοῦ νῦν
  choice: site ugbu a gaa n’ihu
  rationale: Akpaalaokwu a na-echekwa mmalite n’oge ugbu a na ịga n’ihu n’ọdịnihu.
- source_word: μακαριοῦσίν με
  choice: ga-akpọ m onye a gọziri agọzi
  rationale: Nke a na-egosi na ọgbọ ndị ahụ ga-ekwupụta ma were Meri dị ka onye Chineke gọziri, ọ bụghị na ha onwe ha bụ isi iyi ngọzi ahụ.
- source_word: πᾶσαι αἱ γενεαί
  choice: ọgbọ niile
  rationale: Nke a bụ ntụgharị dị mkpirikpi ma bụrụkwa nke nkịtị maka ọgbọ ndị mmadụ na-esochi ibe ha.
theological_decisions:
- issue: Otú e si tụgharịa aha Meri kpọrọ onwe ya, δούλη
  choice: ohu nwanyị ya
  alternative: odibo ya; odibo nwanyị ya
  rationale: A họọrọ “ohu” ka e wee ghara ime ka asụsụ nke ịbụ onye Chineke ma nọ n’okpuru ya dị nro. Nkọwa ala peeji na-enye okwu ndị a na-ejikarị eme ihe n’enweghị itinye ozizi ụka pụrụ iche.
- issue: Ihe ταπείνωσις pụtara n’abụ Meri
  choice: ọnọdụ dị ala
  alternative: ịdị ala; mmechuihu
  rationale: Okwu ahụ nwere ike ịgụnye ọnọdụ ala, ịdị ala, ma ọ bụ mmechuihu. N’ebe a, “ọnọdụ dị ala” na-echekwa isi echiche nke ọnọdụ Meri n’anya mmadụ n’enweghị ikwu na ọ bụ naanị ịdị umeala n’obi dị n’ime ya ma ọ bụ naanị mmegbu.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma doo anya. E ji “Lee” chekwaa ụda abụ na nkwusi ike, ebe ahịrịokwu ndị ọzọ na-agbaso usoro Igbo ebumpụta ụwa.
