id: LUK.1.76
reference: Luke 1:76
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: ig
  text: Gị kwa, nwatakịrị, a ga-akpọ gị onye amụma nke Onye Kasị Elu; n’ihi na ị ga-aga n’ihu Onyenwe anyị[a] iji kwadebe ụzọ ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta ya dịka, “n’ebe Onyenwe anyị nọ.” Okwu Grik a pụrụ ịpụta ịga n’ihu mmadụ ma ọ bụ ịnọ n’ihu ya.
    reason: lexical_alternative
  - marker: b
    text: Okwu a na-akpọghachi nkwa ndị amụma banyere ịkwadebere Onyenwe anyị ụzọ (tulnyere Aịzaya 40:3; Malakaị 3:1). N’akụkọ Luk, nke a mezuru n’ozi Jọn, onye bu ụzọ tupu ozi Jizọs.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: Gị onwe gị kwa
  rationale: Nke a na-egosi mgbanwe n’okwu ma mesie onye a na-agwa okwu ike; “kwa” na-echekwa echiche mgbakwunye dị na δέ, ebe “gị onwe gị” na-emesi σὺ ike n’Igbo eke.
- source_word: παιδίον
  choice: nwatakịrị
  rationale: Ọ bụ okwu a kpọrọ Jọn mgbe ọ ka bụ nwa ọhụrụ. “Nwatakịrị” ziri ezi, doo anya, ọ naghịkwa etinye nkọwa karịrị nke Grik kwuru.
- source_word: προφήτης
  choice: onye amụma
  rationale: Nke a bụ okwu Igbo a na-ejikarị sụgharịa προφήτης, ọ dabara n’ọrụ onye na-ekwupụta ozi Chineke.
- source_word: Ὑψίστου
  choice: nke Onye Kasị Elu
  rationale: “Onye Kasị Elu” na-echekwa aha nsọ e ji akọwa Chineke nakwa njikọ genitivu ya na “onye amụma.”
- source_word: κληθήσῃ
  choice: a ga-akpọ gị
  rationale: Ọ na-egosipụta ọdịnihu n’olu nnara ma na-enye echiche nke ịkpọ mmadụ aha ma ọ bụ ịmata ya dịka onye nwere ọkwa a.
- source_word: προπορεύσῃ
  choice: ị ga-aga n’ihu
  rationale: Ngwaa a pụtara ịga tupu onye ọzọ ma ọ bụ ibu ya ụzọ; “ịga n’ihu” na-echekwa ma echiche onye na-ebu ụzọ ma mgbagwoju anya metụtara ịnọ n’ihu mmadụ.
- source_word: ἐνώπιον κυρίου
  choice: n’ihu Onyenwe anyị
  rationale: ἐνώπιον nwere ike ịpụta ibu mmadụ ụzọ ma ọ bụ ịnọ n’ihu ya/n’ebe ọ nọ. Nsụgharị a na-echekwa ohere abụọ ahụ ma na-ahapụ κύριος dịka aha nsọ “Onyenwe anyị.”
- source_word: ἑτοιμάσαι
  choice: ịkwadebe
  rationale: Infinitivu a na-egosi nzube nke ịga n’ihu; “ịkwadebe” bụ okwu Igbo kwụ ọtọ ma dị eke.
- source_word: ὁδοὺς αὐτοῦ
  choice: ụzọ ya niile
  rationale: “Ụzọ” na-echekwa ihe atụ amụma ahụ, ebe “niile” na-eme ka ọtụtụ dị na ὁδοὺς pụta ìhè n’Igbo.
theological_decisions:
- issue: Onye okwu “Onyenwe anyị” na-ezo aka na ya n’amụma banyere onye ga-ebu ụzọ
  choice: E debere κύριος dịka “Onyenwe anyị” n’ahịrị nsụgharị, n’akọwaghị kpọmkwem onye ọ bụ.
  alternative: Ịkọwa ya kpọmkwem dịka Chineke n’ihi Aịzaya 40:3 na Malakaị 3:1, ma ọ bụ dịka Jizọs n’ihi mmezu ya n’akụkọ Luk.
  rationale: Okwu ahụ na-akpọghachi amụma Agba Ochie banyere ịkwadebere Onyenwe anyị ụzọ, ebe akụkọ Luk na-egosi Jọn dịka onye bu Jizọs ụzọ. Ịhapụ ya dịka “Onyenwe anyị” na-echekwa njikọ na mgbagwoju echiche okpukpe abụọ ahụ n’emeghị mkpebi nke ederede n’onwe ya na-emeghị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke kwanyere ugwu ma dị mfe nghọta. “Gị onwe gị kwa” na-enye nkwusi ike dị n’isi mmalite; “Onye Kasị Elu” na “Onyenwe anyị” bụ aha nsọ ndị a na-aghọta nke ọma. E debere “ụzọ” dịka ihe atụ amụma kama ịgbanwe ya ka ọ bụrụ nkọwa nkịtị.
