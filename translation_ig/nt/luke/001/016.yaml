id: LUK.1.16
reference: Luke 1:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: ig
  text: Ọ ga-emekwa ka ọtụtụ ụmụ Izrel chigharịkwute Onyenwe ha, bụ Chineke ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọtụtụ ndị Izrel.” N’asụsụ Grik, okwu ahụ bụ “ọtụtụ ụmụ Izrel,” bụ okwu ọdịnala nke ọgbụgba ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Ọ ga-emekwa
  rationale: E jikọtara καὶ na ngwaa n’ụzọ Igbo na-aga were were, ka njikọ ya na amaokwu bu ụzọ doo anya.
- source_word: πολλοὺς
  choice: ọtụtụ n’ime
  rationale: Nke a na-egosi ọtụtụ ndị sitere n’ìgwè a kpọrọ aha, dịka ọdịdị okwu Grik si dị.
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: ụmụ Izrel
  rationale: “Ụmụ Izrel” bụ okwu Igbo sitere n’omenala Akwụkwọ Nsọ nke na-anọchi anya ndị Izrel, ma na-ezere ime ka okwu ahụ yie naanị ụmụ nwoke ebe ọ bụ aha ìgwè mmadụ.
- source_word: ἐπιστρέψει
  choice: ga-eme ka ... chigharịkwute
  rationale: 'Ọdịdị a na-echekwa ike transitive nke ngwaa ahụ: Jọn ga-abụ onye Chineke ji mee ka ọtụtụ ndị tụgharịa gaa n’ebe Chineke nọ.'
- source_word: ἐπὶ
  choice: -kwute
  rationale: Nsonaazụ ngwaa “chigharịkwute” na-egosi ntụgharị na ịbịaru onye ahụ nso, kwekọrọ na ἐπὶ mgbe ọ soro ἐπιστρέφω.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme ihe maka κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ, ọ bụghị naanị nna ukwu mmadụ.
- source_word: τὸν θεὸν αὐτῶν
  choice: Chineke ha
  rationale: Ọ bụ aha ọzọ na-akọwa “Onyenwe anyị,” ma na-echekwa mmekọrịta ọgbụgba ndụ dị n’okwu ahụ.
theological_decisions:
- issue: Nsụgharị okwu ọgbụgba ndụ τῶν υἱῶν Ἰσραὴλ
  choice: ụmụ Izrel
  alternative: ụmụ nwoke Izrel; ndị Izrel
  rationale: N’Igbo, “ụmụ Izrel” bụ okwu Akwụkwọ Nsọ e ji akpọ agbụrụ Izrel niile ma ka na-echekwa ihe oyiyi nke ịbụ ụmụ Izrel. “Ụmụ nwoke Izrel” ga-eme ka uche gbasaa naanị n’ebe nwoke nọ karịa ihe okwu ahụ pụtara n’ọnọdụ a; “ndị Izrel” dịkwa mfe ma ọ na-ebelata ụda ọdịnala ahụ.
- issue: Onye κύριον τὸν θεὸν αὐτῶν na-ezo aka na ya
  choice: Onyenwe anyị, Chineke ha
  alternative: nna ukwu ha, bụ́ Chineke
  rationale: Nkebiokwu ahụ na-akọwa Chineke nke Izrel n’asụsụ ọgbụgba ndụ, ọ bụghị nna ukwu mmadụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Chigharịkwute” na-enye ma echiche nke ịlaghachi azụ ma nke ịtụgharị uche na ndụ n’ebe Chineke nọ, n’enweghị iji okwu ụka pụrụ iche kọwaa ya karịa isi mmalite.
