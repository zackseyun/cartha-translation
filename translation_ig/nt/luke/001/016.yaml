revisions:
- from: Ọ ga-emekwa ka ọtụtụ n’ime ụmụ Izrel chigharịkwute Onyenwe anyị, Chineke ha.[a]
  to: Ọ ga-emekwa ka ọtụtụ ụmụ Izrel chigharịkwute Onyenwe ha, bụ Chineke ha.[a]
  rationale: The revision changes only the possessive attached to “Onyenwe” from first-person plural to third-person plural, matching αὐτῶν and the following “Chineke ha.” The footnote is tightened to state the Greek expression accurately while retaining the idiomatic alternative.
  reviewer_model: gpt-5.6-terra
