  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: ig
  text: 'O wee bụrụ na n’ụbọchị nke asatọ, ha bịara ibi nwata ahụ úgwù. Ha nọ na-akpọ ya Zakaraya[a], dịka aha nna ya.[b]


    [a] A pụkwara ịsụgharị ya, “Ha kpọrọ ya Zakaraya.” Okwu Grik e ji mee ihe ebe a nwere ike igosi omume na-aga n’ihu ma ọ bụ mbọ a na-eme, nke dabara n’ịjụ aha a e mere n’amaokwu na-esonụ.


    [b] N’ụzọ okwu Grik si kwuo ya kpọmkwem, “ha nọ na-akpọ ya n’aha nna ya, Zakaraya.” Nke a na-ezo aka n’omenala ịgụ nwa aha onye òtù ezinụlọ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ha kpọrọ ya Zakaraya.” Okwu Grik e ji mee ihe ebe a nwere ike igosi omume na-aga n’ihu ma ọ bụ mbọ a na-eme, nke dabara n’ịjụ aha a e mere n’amaokwu na-esonụ.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ okwu Grik si kwuo ya kpọmkwem, “ha nọ na-akpọ ya n’aha nna ya, Zakaraya.” Nke a na-ezo aka n’omenala ịgụ nwa aha onye òtù ezinụlọ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: O wee ruo
  rationale: Nke a bụ ụzọ Luk si ewebata ihe ọhụrụ n’akụkọ. “O wee ruo” bụ okwu Igbo doro anya ma dịkwa ebube, n’enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: n’ụbọchị nke asatọ
  rationale: Nke a na-egosi kpọmkwem ụbọchị ihe ahụ mere ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἦλθον
  choice: ha bịara
  rationale: Grik ekwughị kpọmkwem ndị bịara; nnọchiaha “ha” na-echekwa amaghị ama ahụ.
- source_word: περιτεμεῖν
  choice: ibi ... úgwù
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ibi nwa nwoke úgwù, ma infinitive ahụ na-egosi ebumnuche ha ji bịa.
- source_word: τὸ παιδίον
  choice: nwata ahụ
  rationale: “Nwata ahụ” na-asụgharị παιδίον n’ụzọ kwụ ọtọ ma dabara n’ọnọdụ nwa ọhụrụ a na-ekwu maka ya.
- source_word: ἐκάλουν
  choice: ha nọkwa na-akpọ
  rationale: Ụdị imperfect Grik nwere ike igosi omume na-aga n’ihu ma ọ bụ ihe a na-achọ ime. “Ha nọkwa na-akpọ” na-echekwa akụkụ ahụ n’ederede, ebe nkọwa ala peeji na-egosi nghọta nke mbọ ha chọrọ ime.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: n’aha nna ya
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma bụrụkwa eke isi gosi na ha na-agụ ya aha nna ya; nkọwa ala peeji kọwara omenala ahụ.
- source_word: Ζαχαρίαν
  choice: Zakaraya
  rationale: “Zakaraya” bụ nsụgharị aha a na-aghọta nke ọma n’Igbo, nke na-anọchite anya aha Grik Ζαχαρίας na aha Hibru sitere na ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa ugwu, mee ihe. E chekwara isiokwu ọtụtụ mmadụ nke Grik n’enweghị ịkọwapụta ndị ha bụ, ma hapụkwa nghọta abụọ dị na imperfect ἐκάλουν ka nkọwa ala peeji kọwaa ya.
