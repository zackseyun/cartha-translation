source:
  edition: SBLGNT
  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: ig
  text: n’ihi ebere dị nro nke Chineke anyị, nke chi ọbụbọ si n’elu ga-eji leta anyị[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ọwụwa anyanwụ”; okwu Grik ahụ, ἀνατολή, nwekwara ike ikwughachi aha Mesaịa bụ “Alaka” na Septuagint.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ
  choice: n’ihi
  rationale: N’ebe a, διά na accusative na-egosi ihe kpatara ya; “n’ihi” bụ okwu Igbo doro anya ma kwekọọ n’echiche ahụ.
- source_word: σπλάγχνα ἐλέους
  choice: obi ebere dị nro
  rationale: Nkebiokwu Grik a na-ekwu n’ụzọ ihe atụ banyere ebere miri emi sitere n’ime obi; “obi ebere dị nro” na-ebute mmetụta ahụ n’Igbo ekeghị ekegide.
- source_word: θεοῦ ἡμῶν
  choice: nke Chineke anyị
  rationale: Nke a na-edobe njikọ genitive nke na-egosi na ebere ahụ bụ nke Chineke anyị.
- source_word: ἐν οἷς
  choice: nke ... ga-eji
  rationale: Nhazi a na-egosi na ọ bụ site n’ebere ahụ ka nleta ahụ ga-abịa, ma na-ada ka Igbo nkịtị.
- source_word: ἐπισκέψεται
  choice: ga-abịa leta anyị
  rationale: Ọ bụ future nke ἐπισκέπτομαι. “Ga-abịa leta anyị” na-edobe ihe oyiyi nke nleta ma kwe ka ọnọdụ ya gosipụta enyemaka nzọpụta dị n’ime ya.
- source_word: ἀνατολὴ
  choice: chi ọbụbọ
  rationale: N’ọnọdụ amaokwu 78–79, ihe oyiyi nke ìhè na-apụta n’ọchịchịrị na-akwado “chi ọbụbọ”; okwu ahụ nwekwara ike iburu ụda aha Mesaịa bụ “Alaka,” nke e debere n’okpuru peeji.
- source_word: ἐξ ὕψους
  choice: si n’elu
  rationale: Nke a dị nso na Grik ma na-ezere ịkọwa ya kpọmkwem dịka “si n’eluigwe,” n’agbanyeghị na nke ahụ bụ ihe a na-atụ aka na ya.
theological_decisions:
- issue: Ihe ἀνατολή pụtara n’ọnọdụ metụtara Mesaịa
  choice: chi ọbụbọ
  alternative: Alaka; ihe na-apụta; ọwụwa anyanwụ
  rationale: Amaokwu na-esochi ya na-ekwu maka ìhè na-enwu n’ọchịchịrị, ya mere “chi ọbụbọ” bụ isi ihe oyiyi. Ma ebe ἀνατολή nwekwara ike ikwughachi aha Mesaịa “Alaka” na Septuagint, e debere nke ahụ n’okpuru peeji kama ịmanye ya n’ahịrị isi.
translation_notes:
  register: Igbo ọkọlọtọ dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “obi ebere dị nro” iji zere ntụgharị nkịtị nke akụkụ ime ahụ, ebe “chi ọbụbọ” na-edobe ihe oyiyi ìhè nke amaokwu gbara ya gburugburu.
