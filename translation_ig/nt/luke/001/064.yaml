base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: ig
  text: Ozugbo ahụ, ọnụ ya meghere, ire ya kwa[a], o wee malite ikwu okwu[b], na-agọzi Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, Grik sịrị, “ire ya kwa.” Ụfọdụ nsụgharị na-asị, “a tọpụkwara ire ya,” ma okwu ahụ bụ “a tọpụkwara” adịghị na Grik ebe a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ nọ na-ekwu okwu.” Ụdị ngwaa Grik a nwere ike imesi ikwu okwu na-aga n'ihu ike kama imesi mmalite ya ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: meghere
  rationale: Okwu a bụ aorist passive nke ἀνοίγω. N'Igbo, “ọnụ ya meghere” na-egosi nke ọma na e weghachiri ya ikike ikwu okwu n'ebughị ụzọ kọwaa onye mere ya.
- source_word: δὲ
  choice: Ozugbo ahụ
  rationale: δὲ bụ njikọ dị nro n'akụkọ a; n'Igbo, usoro ahịrịokwu na “ozugbo ahụ” na-aga n'ihu n'akụkọ ahụ n'ụzọ eke, na-enweghị itinye echiche nke mmegide.
- source_word: στόμα
  choice: ọnụ
  rationale: Nke a bụ aha akụkụ ahụ kpọmkwem, ọ dabara n'akụkọ banyere iweghachi ikike ikwu okwu.
- source_word: παραχρῆμα
  choice: Ozugbo ahụ
  rationale: Ọ na-egosi na ihe ahụ mere n'otu ntabi anya, ozugbo ihe bu ya ụzọ gasịrị.
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: ire ya kwa
  rationale: Nke a na-edobe kpọmkwem otú Grik si kpọọ ma ọnụ ya ma ire ya, n'etinyeghị okwu a na-adịghị n'ahịrịokwu ahụ, dịka “a tọpụkwara ire ya.”
- source_word: ἐλάλει
  choice: o wee malite ikwu okwu
  rationale: Imperfect nke λαλέω nwere ike igosi mmalite ma ọ bụ ịga n'ihu nke ikwu okwu. N'ọnọdụ a, ebe ọ bụ na ọ bụbu onye ogbi, “malite ikwu okwu” na-eme ka usoro akụkọ doo anya, ebe nkọwa ala peeji na-echekwa nghọta ọzọ.
- source_word: εὐλογῶν
  choice: na-agọzi
  rationale: Present participle a na-akọwa ihe ọ na-eme mgbe ọ na-ekwu okwu. “Na-agọzi” bụ ihe kwekọrọ kpọmkwem karịa “na-eto.”
- source_word: τὸν θεόν
  choice: Chineke
  rationale: Ọ bụ ihe εὐλογῶν na-emetụta kpọmkwem; “Chineke” bụ nsụgharị Igbo kwesịrị ekwesị.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Nhazi ahịrịokwu ahụ na-edobe ọsọ nke akụkọ ahụ na mberede ihe mere, ma nkọwa ala peeji na-echekwa nghọta abụọ nke imperfect ἐλάλει na okwu kpọmkwem banyere ire ya.
