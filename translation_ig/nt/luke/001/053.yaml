  text: πεινῶντας ἐνέπλησεν ἀγαθῶν καὶ πλουτοῦντας ἐξαπέστειλεν κενούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: ig
  text: O ji ihe ọma mejuo ndị agụụ na-agụ, ma zipụ ndị ọgaranya ka ha laa n’enweghị ihe ọ bụla[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “aka ha tọgbọ chakoo.”
    reason: Nhọrọ okwu ọzọ maka κενούς nke na-egosi na ha laghachiri n’aka efu.
lexical_decisions:
- source_word: πεινῶντας
  choice: ndị agụụ na-agụ
  rationale: Partisịpụ a bụ aha na-akọwa otu ndị mmadụ. Nkebi a bụ Igbo nkịtị maka ndị nọ n’agụụ, ma ọ naghị eme ka agụụ ahụ sie ike karịa ihe Grik kwuru.
- source_word: ἐνέπλησεν
  choice: mee ka afọ ju
  rationale: N’ọnọdụ okwu gbasara agụụ na nri, nke a na-egosi imeju mmadụ nke ọma n’Igbo. Ọ na-eburu echiche nke imeju n’enweghị ịgbakwụnye na ihe ahụ bụ nanị nke ime mmụọ.
- source_word: ἀγαθῶν
  choice: ji ihe ọma
  rationale: Genitiv a na-egosi ihe e ji mejupụta ha. ‘Ihe ọma’ na-edobe okwu ahụ sara mbara, n’etinyeghị echiche ‘onyinye’ nke na-adịghị kpọmkwem n’akwụkwọ Grik.
- source_word: πλουτοῦντας
  choice: ndị ọgaranya
  rationale: Partisịpụ a bụ aha otu ndị mmadụ, ‘ndị ọgaranya’ bụkwa ụzọ doro anya na nke a na-ejikarị ekwu ya n’Igbo, ma na-edobe ọdịiche ya na ndị agụụ na-agụ.
- source_word: ἐξαπέστειλεν
  choice: zipụ ... ka ha laa
  rationale: Nke a na-egosipụta izipu mmadụ pụọ n’ụzọ Igbo na-ada nke ọma, n’enweghị ịtụ aro na ọ bụ nchụpụ n’ụlọikpe ma ọ bụ n’ihu eze.
- source_word: κενούς
  choice: n’enweghị ihe ọ bụla
  rationale: Nke a na-egosi ọnọdụ efu ha nọ na ya mgbe e zipụrụ ha. Ọ na-edobe okwu ahụ sara mbara karịa ‘aka ha tọgbọ chakoo,’ nke na-eme ka onyinyo aka pụta ìhè.
theological_decisions:
- issue: Mgbanwe ọnọdụ ọha mmadụ na abụ Meri
  choice: E debere ọdịiche pụtara ìhè n’etiti ‘ndị agụụ na-agụ’ na ‘ndị ọgaranya.’
  alternative: Ịkọwa ha dị ka nanị ndị agụụ ime mmụọ na-agụ na ndị mpako ma ọ bụ ndị juru onwe ha afọ.
  rationale: Grik kpọrọ ndị agụụ na-agụ na ndị ọgaranya aha n’ụzọ metụtara ọnọdụ ndụ ha. Nsụgharị ahụ anaghị eme ka okwu ndị a bụrụ naanị ihe atụ ime mmụọ, kama ọ na-ahapụ nghọta na esemokwu nkà mmụta okpukpe dị n’abụ ahụ ka ha dị.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma dị nsọ n’ụda. A họọrọ ‘mee ka afọ ju’ ka njikọ dị n’etiti agụụ na imeju pụta nke ọma; e zere ịkọwa agụụ ahụ dị ka naanị agụụ ime mmụọ. E debere akara ntụaka [a] ozugbo n’akụkụ okwu ọ na-akọwa.
