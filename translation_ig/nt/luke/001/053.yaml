    reason: Nhọrọ okwu ọzọ maka κενούς nke na-egosi na ha laghachiri n’aka efu.
  revision_rationale: The revision uses “mejuo” to render the direct filling sense of ἐνέπλησεν, while preserving the broad object “ihe ọma” and the concrete hungry/rich contrast. It also moves the footnote anchor to the precise phrase for which the alternative is supplied.
