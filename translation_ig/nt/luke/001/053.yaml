revisions:
- from: O ji ihe ọma mee ka afọ ju ndị agụụ na-agụ, ma zipụ ndị ọgaranya ka ha laa n’enweghị ihe ọ bụla.[a]
  to: O ji ihe ọma mejuo ndị agụụ na-agụ, ma zipụ ndị ọgaranya ka ha laa n’enweghị ihe ọ bụla[a].
  rationale: The revision uses “mejuo” to render the direct filling sense of ἐνέπλησεν, while preserving the broad object “ihe ọma” and the concrete hungry/rich contrast. It also moves the footnote anchor to the precise phrase for which the alternative is supplied.
