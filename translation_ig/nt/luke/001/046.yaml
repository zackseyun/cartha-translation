  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: ig
  text: Meri wee sị[a], “Mkpụrụ obi m na-ebuli Onyenwe anyị elu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mkpụrụ obi m na-ekwupụta ịdị ukwuu nke Onyenwe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: wee
  rationale: Njikọ a na-egosi usoro akụkọ n'ụzọ Igbo sitere n'okike, n'etinyeghị nkọwa oge karịrị nke Grik.
- source_word: εἶπεν
  choice: sị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị ewebata okwu mmadụ kwuru n'akụkọ.
- source_word: Μαριάμ
  choice: Meri
  rationale: E ji ụdị aha a maara nke ọma na Standard Igbo dee aha Μαριάμ.
- source_word: Μεγαλύνει
  choice: na-ekwupụta ịdị ukwuu nke
  rationale: Nke a na-egosipụta μεγαλύνω dị ka ikwusa na Onyenwe anyị dị ukwuu; ọ bụ okwu doro anya ma dịkwa ugwu n'Igbo, ma na-edobe ike abụ nke ahịrịokwu ahụ.
- source_word: ἡ ψυχή μου
  choice: Mkpụrụ obi m
  rationale: A hapụrụ okwu ahụ n'ụdị okwu abụ ya kama ime ya naanị ‘m,’ ka echiche ψυχή ghara ịla n'iyi.
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọ a na-ejikarị sụgharị κύριος mgbe ọ bụ aha e ji asọpụrụ Chineke; ọ dabara n'olu abụ otuto a.
theological_decisions:
- issue: Nsụgharị κύριος
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: N'ebe a, κύριος bụ aha nsọ a na-akpọ Chineke n'okwu otuto nke na-ada ka Akwụkwọ Nsọ; ‘Nna ukwu’ ga-eme ka ihe ọ pụtara dị warara.
- issue: Okwu gbasara mmadụ n’ἡ ψυχή μου
  choice: Mkpụrụ obi m
  alternative: Mụ onwe m
  rationale: Nke a na-edobe okwu ime mmụọ na nke abụ dị na isi mmalite, na-akọwaghị ψυχή n'ụzọ ga-emechi ihe ọ pụrụ ịpụta.
- issue: Ihe Μεγαλύνει pụtara
  choice: na-ekwupụta ịdị ukwuu nke
  alternative: na-ebuli elu
  rationale: Nhọrọ ahụ na-egosi na Meri na-eto ma na-ekwusa ịdị ukwuu Chineke, n'etinyeghị echiche na ọ na-eme ka Chineke bụrụ onye ka ukwuu n'ezie.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma nwee ugwu na ụda abụ. E ji ‘wee sị’ mee ka usoro akụkọ daa nke ọma; e debere ‘mkpụrụ obi m’ maka okwu abụ na ihe gbasara mmadụ dị n'isi mmalite.
