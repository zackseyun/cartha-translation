base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: ig
  text: O gosila ike ya site n’ogwe aka ya[a]; ọ gbasasịala ndị mpako n’echiche dị n’obi ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “O jirila ogwe aka ya rụọ ọrụ dị ike.” N’asụsụ Grik, okwu ya n’ụzọ nkịtị bụ “o mere ike,” nke bụ akpaalaokwu pụtara igosipụta ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ gbasasịala ndị mpako site n’ebumnobi nke obi ha,” ma ọ bụ, “n’echiche nke obi ha.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: O gosila ike ya
  rationale: Nkebi okwu Grik a pụtara n’ụzọ nkịtị ‘o mere ike,’ ma ọ bụ akpaalaokwu nke pụtara igosipụta ike. ‘O gosila ike ya’ bụ Igbo dị eke ma na-edobe echiche nke omume Chineke mezuru nke ka nwere uru ugbu a.
- source_word: ἐν βραχίονι αὐτοῦ
  choice: site n’ogwe aka ya
  rationale: ἐν nwere ọrụ nke ngwa e ji mee ihe n’ebe a. ‘Ogwe aka’ na-edobe ihe atụ Akwụkwọ Nsọ nke na-egosi ike Chineke n’omume, ebe ‘site na’ na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: διεσκόρπισεν
  choice: ọ gbasasịala
  rationale: Okwu ahụ pụtara ịchụsasị ma ọ bụ ime ka ndị mmadụ gbasaa. Ụdị mmecha ‘-la’ kwekọrọ na omume e gosiri dịka nke mezuru ma na-aga n’ihu inwe mmetụta.
- source_word: ὑπερηφάνους
  choice: ndị mpako
  rationale: Adjective a ji onwe ya rụọ ọrụ dịka aha, ya mere ọ na-ezo aka n’ụmụ mmadụ ndị mpako. ‘Ndị mpako’ bụ okwu Igbo doro anya ma dị nkenke.
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: n’echiche dị n’obi ha
  rationale: Nsụgharị a na-edobe ma διάνοια (‘echiche/uche’) ma καρδία (‘obi,’ ya bụ ime mmadụ), n’agbanyeghị na njikọ Grik ahụ nwere ike ịpụta ọnọdụ ma ọ bụ ụzọ e si mee omume ahụ.
theological_decisions:
- issue: Oge na ọrụ nke aorist ndị dị n’abụ Meri
  choice: Jiri ụdị mmecha Igbo ‘gosila’ na ‘gbasasịala.’
  alternative: 'Jiri oge gara aga nkịtị: ‘O gosiri’ na ‘ọ gbasasịrị.’'
  rationale: Aorist ndị ahụ na-akọ omume Chineke dịka ihe e mezuru, ma n’abụ ahụ ha nwekwara ike ịbụ nchịkọta nke omume ya ma ọ bụ nkwupụta amụma. Ụdị ‘-la’ na-egosi mmezu na uru ya ka dị, n’enweghị ịkọwa esemokwu ahụ kpamkpam.
- issue: Njikọ διανοίᾳ καρδίας αὐτῶν
  choice: 'Gụọ ya dịka ọnọdụ ime mmadụ: ‘n’echiche dị n’obi ha.’'
  alternative: 'Gụọ ya dịka ngwa ma ọ bụ ihe kpatara ya: ‘site n’ebumnobi nke obi ha’ ma ọ bụ ‘n’echiche efu nke obi ha.’'
  rationale: Ụdị Grik ahụ nwere ike igosi ebe mpako ha dị n’ime mmadụ ma ọ bụ ụzọ e si mata ma gbasasịa ha. Isi nsụgharị na-edobe okwu ‘echiche’ na ‘obi,’ ebe nkọwa ala peeji na-echekwa ụzọ ndị ọzọ a pụrụ isi ghọta ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ ‘ogwe aka’ nke Akwụkwọ Nsọ kama ịtụgharị ya naanị dịka ‘ike,’ ma e jiri nkọwa ala peeji chekwaa mgbagwoju anya dị na nkebi ikpeazụ.
