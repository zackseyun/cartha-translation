  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: ig
  text: Ọ banyere n’ebe ọ nọ, wee sị ya, “Ekele dịrị gị[a], gị onye e meere amara[b]; Onyenwe anyị nọnyeere gị.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ṅụrịa ọṅụ,” ma ọ bụ n’ụdị e ji eme ihe n’oge ochie, “Ekele.” Okwu Grik ahụ bụ ekele a na-ejikarị eme ihe, ọ bụ ezie na n’ụdị ya kpọmkwem ọ bụ iwu nke pụtara “ṅụrịa ọṅụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “gị onye e meere amara nke ukwuu,” “gị onye amara ruru,” ma ọ bụ dịka nsụgharị ọdịnala si kwuo, “gị onye juputara n’amara.” Okwu Grik ahụ na-egosi onye e meere amara ma ọ bụ ihuọma.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: Mgbe ọ batakwutere ya
  rationale: Nkebiokwu a na-egosi na ọ banyere ebe Meri nọ wee bịakwute ya tupu o kwuo okwu. ‘Batakwutere ya’ na-enye echiche mmegharị ahụ n’Igbo dị mfe ma doo anya.
- source_word: Χαῖρε
  choice: Ekele dịrị gị
  rationale: Ọ bụ ezie na ụdị okwu Grik a pụtara n’ụzọ nkịtị ‘ṅụrịa ọṅụ,’ a na-ejikarị ya eme ekele. ‘Ekele dịrị gị’ na-egosipụta ọrụ ya dị ka ekele n’asụsụ Igbo nke oge a.
- source_word: κεχαριτωμένη
  choice: gị onye e meere amara
  rationale: Okwu a bụ participle zuru oke nke nọ n’ụdị nnata, na-egosi onye natara amara ma ọ bụ ihuọma. Nsụgharị a na-edobe Meri dị ka onye Chineke meere amara, ọ bụghị dị ka isi iyi amara n’onwe ya.
- source_word: ὁ κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ a na-ejikarị akọwa κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ, ma ọ na-adabara asụsụ Akwụkwọ Nsọ Igbo.
- source_word: μετὰ σοῦ
  choice: nọnyeere gị
  rationale: μετά tinyere genitive pụtara ‘ịnọnyere.’ ‘Nọnyeere gị’ bụ ụzọ Igbo si ekwu n’ụzọ dị ndụ na Onyenwe anyị nọ ya nso ma na-anọnyere ya.
theological_decisions:
- issue: Nsụgharị κεχαριτωμένη n’amaokwu metụtara Meri nke nwere nnukwu mmetụta n’okwukwe
  choice: gị onye e meere amara
  alternative: onye juputara n’amara; onye e meere amara nke ukwuu
  rationale: 'Nhọrọ a na-agbaso ụdị nnata nke participle Grik: Meri bụ onye e nyeworo amara ma ọ bụ ihuọma. Ọ na-akwanyere nkwupụta siri ike nke amaokwu ahụ ùgwù n’etinyeghị ozizi e mepụtara mgbe e mesịrị n’ime okwu Grik ahụ.'
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma nwee ugwu, dee ya. ‘Ekele dịrị gị’ na-arụ ọrụ dị ka ekele nkịtị, ebe ‘onye e meere amara’ na-edobe ụdị nnata nke okwu Grik ma zere itinye nkọwa otu ụka n’ime amaokwu ahụ.
