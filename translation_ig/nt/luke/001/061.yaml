  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: ig
  text: Ha wee sị ya, “Ọ dịghị onye ọ bụla nʼime ndị ikwu gị a na-akpọ aha a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: Ha wee sị ya
  rationale: Nke a bụ ụzọ Igbo dị nʼusoro akụkọ si egosipụta okwu a gwara mmadụ; “sị ya” na-egosi πρὸς αὐτήν n'ụzọ doro anya.
- source_word: Οὐδείς ἐστιν
  choice: Ọ dịghị onye ọ bụla
  rationale: Nke a na-egosipụta nkwụsi ike nke Οὐδείς nʼIgbo dị mfe ma doo anya.
- source_word: ἐκ τῆς συγγενείας σου
  choice: nʼime ndị ikwu gị
  rationale: “Ndị ikwu gị” na-egosipụta συγγένεια dị ka ndị mmadụ nwere mmekọrịta ọbara ma ọ bụ ezinụlọ, ebe “nʼime” na-enye echiche nkewa nke ἐκ.
- source_word: ὃς καλεῖται
  choice: a na-akpọ
  rationale: Ụdị a na-edobe echiche passive nke καλεῖται ma bụrụkwa okwu Igbo e ji ekwu aha mmadụ.
- source_word: τῷ ὀνόματι τούτῳ
  choice: aha a
  rationale: “Aha a” bụ ntụgharị Igbo nkịtị nke na-edobe ntụaka τούτῳ nʼaha a ka kpọtụrụla.
