  text: Μετὰ δὲ ταύτας τὰς ἡμέρας συνέλαβεν Ἐλισάβετ ἡ γυνὴ αὐτοῦ· καὶ περιέκρυβεν ἑαυτὴν μῆνας πέντε, λέγουσα
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: ig
  text: Mgbe ụbọchị ndị ahụ gasịrị, Elizabet, nwunye ya, tụụrụ ime; ọ nọgidere na-ezo onwe ya ọnwa ise, na-asị,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “wee sị.” Okwu Grik ahụ bụ participle nke na-ewebata ihe Elizabet kwuru n'amaokwu na-esote.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: Mgbe ụbọchị ndị ahụ gasịrị
  rationale: Nke a na-egosipụta usoro oge μετά tinyere accusative. N'Igbo, ‘ụbọchị ndị ahụ’ bụ ụzọ e si akọ ihe mere n'oge gara aga n'ụzọ dị mma; δέ bụ njikọ dị nro nke okwu ahụ adịghị mkpa ka a sụgharịa iche.
- source_word: συνέλαβεν
  choice: tụụrụ ime
  rationale: N'ọnọdụ a, συλλαμβάνω pụtara ịtụrụ nwa ime. ‘Tụụrụ ime’ bụ okwu Igbo kpọmkwem ma bụrụkwa nke a na-aghọta nke ọma.
- source_word: Ἐλισάβετ
  choice: Elizabet
  rationale: Ụdị mkpọgharị aha a dabara n'usoro mkpụrụedemede na mkpọpụta Igbo.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: nwunye ya
  rationale: Ọ bụ ezie na γυνή nwekwara ike ịpụta ‘anyịanyị,’ possessive na ọnọdụ a na-egosi nke ọma na ọ pụtara nwunye.
- source_word: περιέκρυβεν ἑαυτὴν
  choice: o wee zoo onwe ya
  rationale: ‘Zoo onwe ya’ na-edobe reflexive ἑαυτήν. ‘Wee’ na usoro ahịrịokwu ahụ, tinyere ‘ruo ọnwa ise,’ na-eme ka a ghọta na ọnọdụ izobe onwe ya gara n'ihu, dị ka imperfect Greek si egosi.
- source_word: μῆνας πέντε
  choice: ruo ọnwa ise
  rationale: Accusative a na-egosi ogologo oge. ‘Ruo ọnwa ise’ bụ ụzọ Igbo dị ire ụtọ isi kwupụta oge ahụ dum.
- source_word: λέγουσα
  choice: na-asị
  rationale: Nke a na-edobe participle nke na-ejikọta amaokwu a na ihe Elizabet kwuru n'amaokwu na-esote, kama ime ya ngwaa kwụụrụ onwe ya.
theological_decisions: []
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro okwu sitere n'okike n'Igbo, ebe a ka debere njikọ participle na amaokwu na-esote. E tinyeghị footnote maka ‘ụbọchị ndị a/ndị ahụ’ n'ihi na n'Igbo akụkọ oge gara aga, ‘ndị ahụ’ bụ nhọrọ doro anya na nke sitere n'okike.
