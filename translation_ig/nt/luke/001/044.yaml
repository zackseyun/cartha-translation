  naturalness: «N’ihi na, lee, mgbe ...» bụ Igbo ọkọlọtọ dị mma ma na-ejigide njikọ nkọwa na ike adọta uche nke mkpụrụokwu Grik. Itinye akara ala ozugbo n’akụkụ «n’ọṅụ» na-eme ka ebe ọ na-akọwa doo anya.
