id: LUK.1.44
reference: Luke 1:44
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: ig
  text: N’ihi na, lee, mgbe ụda ekele gị rutere ná ntị m, nwa ahụ wụliri elu n’ọṅụ[a] n’afọ m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “nwa ahụ wụliri elu n’oke ọṅụ n’afọ m.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: lee
  rationale: Ọ bụ okwu a na-eji adọta uche n’ụzọ doro anya ma dịkwa mma n’Igbo nke oge a.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-egosi na ihe a na-ekwu na-akọwa ihe e kwuru n’amaokwu bu ya ụzọ.
- source_word: ὡς ἐγένετο
  choice: ozugbo ... rutere
  rationale: N’ọnọdụ a, usoro okwu ahụ na-egosi oge ihe ahụ mere; ‘ozugbo’ na-eme ka njikọ ngwa ngwa dị n’etiti ịnụ ekele ahụ na mmegharị nwa ahụ pụta ìhè.
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: ụda ekele gị
  rationale: ‘Ụda’ na-elekwasị anya n’ihe Elizabet nụrụ, ebe ‘ekele’ bụ okwu Igbo nkịtị maka ἀσπασμός n’ebe a.
- source_word: εἰς τὰ ὦτά μου
  choice: rutere ná ntị m
  rationale: Nke a na-egosipụta ntụziaka εἰς n’Igbo eke, ya bụ na ụda ahụ bịaruru ntị ya.
- source_word: ἐσκίρτησεν
  choice: wụliri elu
  rationale: Ọ na-egosi mmegharị mberede ma sie ike nke nwa nọ n’afọ.
- source_word: ἐν ἀγαλλιάσει
  choice: n’ọṅụ
  rationale: Ọ na-echekwa echiche nke ọṅụ dị ukwuu n’ụzọ dị mkpirikpi ma dị mfe nghọta.
- source_word: τὸ βρέφος
  choice: nwa ahụ
  rationale: βρέφος nwere ike ịpụta nwa ọhụrụ ma ọ bụ nwa nọ n’afọ; ‘nwa ahụ’ bụ okwu eke nke na-adịghị etinye nkọwa karịrị ihe ederede kwuru.
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: n’afọ m
  rationale: N’Igbo, ‘n’afọ m’ bụ ụzọ eke isi kwuo na nwa ahụ nọ n’akpa nwa, ihe gbara ya gburugburu na-eme ka ihe ọ pụtara doo anya.
theological_decisions:
- issue: Otú e si kpọọ βρέφος nke na-ezo aka na Jọn nọ n’afọ nne ya
  choice: nwa ahụ
  alternative: nwa ọhụrụ ahụ
  rationale: ‘Nwa ahụ’ na-anọgide n’ókè okwu Grik ahụ ma na-ezere itinye arụmụka ozizi nke ederede n’onwe ya ekwughị kpọmkwem.
- issue: Njikọ ἐν ἀγαλλιάσει na mmegharị nwa ahụ
  choice: wụliri elu n’ọṅụ
  alternative: wụliri elu n’obi aṅụrị
  rationale: Nke a na-ejikọta ọṅụ ahụ na mmegharị nwa ahụ dịka usoro Grik si mee, na-enweghị ịkọwa ụdị nghọta ma ọ bụ ebumnobi nwa ahụ nwere.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘lee’ mee ka ike okwu ἰδοὺ dịrị, ma e zere okwu ochie ma ọ bụ nke otu ụka kpọmkwem.
