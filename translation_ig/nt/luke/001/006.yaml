  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: ig
  text: Ha abụọ bụkwa ndị ezi omume n’ihu Chineke,[a] na-ebi ndụ n’enweghị ihe a ga-eji taa ha ụta, na-erubere iwu na ụkpụrụ niile nke Onyenweanyị isi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’anya Chineke.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “na-eje ije n’iwu na ụkpụrụ niile nke Onyenweanyị n’enweghị ihe a ga-eji taa ha ụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιοι
  choice: ndị ezi omume
  rationale: Nke a na-echekwa echiche omume ziri ezi na ikwesị ntụkwasị obi n’ọgbụgba ndụ, kama ime ka okwu ahụ bụrụ naanị ikpe ziri ezi n’iwu.
- source_word: ἀμφότεροι
  choice: ha abụọ
  rationale: Ọ na-emesi ike na nkọwa a metụtara Zekaraya na Elizabet n’otu aka ahụ.
- source_word: ἐναντίον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Ọ bụ ntụgharị Igbo dị nkenke ma kwekọọ n’echiche na Chineke hụrụ ma na-enyocha ezi omume ha.
- source_word: πορευόμενοι
  choice: na-ebi ndụ
  rationale: N’ebe a, okwu ije bụ ihe atụ maka ụzọ mmadụ si ebi ndụ; ntụgharị a bụ nke doro ndị na-agụ Igbo nke oge a anya.
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: na-erubere iwu ... niile ... isi
  rationale: Nke a na-egosipụta omume nrubeisi ma na-echekwa mkpokọta nke πάσαις, ‘niile.’
- source_word: δικαιώμασιν
  choice: ụkpụrụ
  rationale: ‘Ụkpụrụ’ na-egosi ihe e nyere iwu ka a na-eme ma na-edobe ọdịiche dị n’etiti ya na ‘iwu,’ n’agbanyeghị na okwu abụọ ahụ nwere mpaghara ihe ha pụtara jikọrọ ọnụ.
- source_word: τοῦ κυρίου
  choice: nke Onyenweanyị
  rationale: Ọ bụ aha nsọpụrụ Igbo a na-ejikarị eme ihe maka κύριος mgbe ọ na-ezo aka n’ebe Chineke Izrel nọ.
- source_word: ἄμεμπτοι
  choice: n’enweghị ihe a ga-eji taa ha ụta
  rationale: Ọ na-echekwa ike nke okwu ahụ dịka enweghị ihe a pụrụ ịkatọ n’omume ha, na-ekwughị n’onwe ya na ha enweghị mmehie ọ bụla.
- source_word: ἦσαν δὲ
  choice: bụkwa
  rationale: ‘-kwa’ na-arụ ọrụ njikọ akụkọ dị nro nke δέ n’enweghị ime ka ọ bụrụ nnukwu ntụnyere.
theological_decisions:
- issue: Ma ἄμεμπτοι ọ̀ pụtara na ha enweghị mmehie kpamkpam
  choice: E gosipụtara ndụ a na-apụghị ịta ụta n’ọrụ nrubeisi ha, n’etinyeghị nkọwa na ha zuru oke n’enweghị mmehie.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka ndị na-agụ ya ghọta na ha enweghị mmehie ọbụla.
  rationale: Ọnọdụ okwu ahụ jikọtara ἄμεμπτοι na irube isi n’iwu na ụkpụrụ Onyenweanyị. Ya mere, ntụgharị ahụ na-edobe nkwupụta siri ike nke ederede ma ghara itinye nkwubi okwu ozizi nke ederede ahụ ekwughị kpọmkwem.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. ‘Na-ebi ndụ’ na-eme ka ihe atụ πορευόμενοι doo anya; ihe e dere n’ala peeji [b] na-echekwa usoro na ihe atụ ‘ije’ nke Grik n’ụzọ ka nso.
