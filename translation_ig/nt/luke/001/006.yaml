- from: Ha abụọ bụkwa ndị ezi omume n’ihu Chineke,[a] na-ebi ndụ n’enweghị ihe a ga-eji taa ha ụta, na-erubere iwu na ụkpụrụ niile nke Onyenweanyị isi.[b]
  to: Ha abụọ bụkwa ndị ezi omume n’ihu Chineke,[a] na-ebi ndụ n’enweghị ihe a ga-eji taa ha ụta, na-erubere iwu na ụkpụrụ niile nke Onyenweanyị isi.[b]
  rationale: The verse text requires no semantic change. Footnote b is revised to preserve the source’s walking metaphor while avoiding an awkward presentation as ordinary idiomatic Igbo. The wording continues to leave ἄμεμπτοι as blameless or irreproachable conduct, without adding a claim of absolute sinlessness.
