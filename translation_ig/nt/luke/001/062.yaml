  text: So they motioned to his father to find out what he wanted him to be called.
translation:
  language: ig
  text: Ha wee jiri ihe ịrịba ama jụọ nna ya ihe ọ chọrọ ka a kpọọ nwata ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “Ha wee jiri ihe ịrịba ama jụọ nna ya ihe ọ pụrụ ịchọ ka a kpọọ nwata ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνένευον
  choice: jiri ihe ịrịba ama jụọ
  rationale: Ngwaa a pụtara iji mmegharị ahụ ma ọ bụ ihe ịrịba ama zie ozi. N'ọnọdụ a, okwu a họọrọ na-egosi na ha jụrụ ajụjụ n'ekwughị okwu, ma ọ naghị ekwu kpọmkwem ụdị mmegharị ahụ ha mere.
- source_word: δὲ
  choice: wee
  rationale: N'ebe a, δέ bụ njikọ dị nro nke na-eme ka akụkọ gaa n'ihu; “wee” bụ ụzọ Igbo si ekwu nke a n'ụzọ ebumpụta ụwa.
- source_word: τῷ πατρὶ αὐτοῦ
  choice: nna ya
  rationale: Dative a na-egosi onye e zigara ihe ịrịba ama ahụ. N'ahịrịokwu Igbo a, “jụọ nna ya” na-egosipụta nke ahụ nke ọma.
- source_word: τὸ τί ἂν θέλοι
  choice: aha ọ chọrọ
  rationale: Ajụjụ a na-apụtaghị ìhè na-ekwu ihe nna nwata ahụ chọrọ. Ọ bụ ezie na ἄν na optative nwere ike igosi ihe a na-atụ anya ma ọ bụ nkwanye ùgwù dị nro, “ọ chọrọ” bụ Igbo doro anya ma dị mma n'ọnọdụ a.
- source_word: καλεῖσθαι αὐτό
  choice: ka a kpọọ nwata ahụ
  rationale: A hapụrụ infinitive ahụ n'ụdị passive site n'iji “ka a kpọọ”; “nwata ahụ” na-eme ka onye αὐτό na-ezo aka na ya doo anya n'Igbo.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma nwee ugwu, dee ya. “Jiri ihe ịrịba ama jụọ” na-eme ka nkwurịta okwu na-enweghị okwu doo anya, ebe nkọwa ala peeji na-echekwa usoro na ohere ihe optative Grik pụtara n'ụzọ nkịtị karị.
