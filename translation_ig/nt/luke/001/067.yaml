id: LUK.1.67
reference: Luke 1:67
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: ig
  text: 'Zekaraya, nna ya, wee jupụta na Mmụọ Nsọ, buru amụma, sị:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ζαχαρίας
  choice: Zekaraya
  rationale: E dere aha onye ahụ n'ụdị a na-ejikarị ede ya n'Igbo, kama ịtụgharị ihe aha ahụ pụtara.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: nna ya
  rationale: Nke a bụ ụzọ Igbo si ekwu ya nke ọma, ọ na-echekwakwa njikọ ezinụlọ ahụ n'ụzọ doro anya.
- source_word: ἐπλήσθη
  choice: wee jupụta
  rationale: Ngwaa a na-egosi ihe mere n'otu oge, ebe onye ahụ bụ onye natara omume ahụ; usoro 'jupụta na' bụ okwu Igbo ebumpụta ụwa n'ebe a.
- source_word: πνεύματος ἁγίου
  choice: na Mmụọ Nsọ
  rationale: Mgbe 'jupụta' gasịrị, 'na' na-egosi ihe jupụtara mmadụ; mkpụrụedemede ukwu na-egosi na okwu ahụ na-ezo aka na Mmụọ nke Chineke.
- source_word: ἐπροφήτευσεν
  choice: buru amụma
  rationale: Nke a bụ akpaokwu Igbo a maara nke ọma maka ikwu okwu sitere n'ike mmụọ nsọ dịka onye amụma.
- source_word: λέγων
  choice: sị
  rationale: '''Sị'' na-ebute okwu amụma ahụ na-esote n''ụzọ dị mkpirikpi ma bụrụkwa Igbo ebumpụta ụwa.'
- source_word: Καὶ
  choice: wee
  rationale: '''Wee'' na-ejikọta ihe a na akụkọ gara aga ma na-egosikwa usoro omume n''ụzọ dabara n''akụkọ Igbo.'
theological_decisions:
- issue: Ihe πνεύματος ἁγίου na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ dị nsọ
  rationale: N'ọnọdụ a nke mkpali Chineke n'akwụkwọ Luk, akpaokwu ahụ na-ezo aka na Mmụọ Nsọ. Nsụgharị a adịghị atụkwasị nkọwa ozizi ọzọ n'ihe odide ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji 'wee' mee ka njikọ akụkọ na usoro omume daa nke ọma; e nweghị ihe e tinyere iji dozie esemokwu ma ọ bụ nghọta karịrị ihe Greek kwuru.
