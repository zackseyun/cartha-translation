id: LUK.1.14
reference: Luke 1:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: ig
  text: Ị ga-enwe ọṅụ na oke aṅụrị, ọtụtụ mmadụ ga-aṅụrịkwa ọṅụ mgbe a mụrụ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na a mụrụ ya.” Nkebiokwu Grik ahụ nwere ike igosi ma oge e ji aṅụrị ọṅụ ma ihe kpatara aṅụrị ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται ... σοι
  choice: Ị ga-enwe
  rationale: Ọ bụ ụzọ Igbo si ekwu n'ụzọ ebumpụta ụwa na ọṅụ ga-abụ nke Zekaraya, kama ịsụgharị usoro Grik ahụ n'ụzọ ga-ada arọ.
- source_word: χαρά
  choice: ọṅụ
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ọṅụ.
- source_word: ἀγαλλίασις
  choice: oke aṅụrị
  rationale: Nke a na-egosi aṅụrị siri ike na nke emume, ma na-edobekwa ọdịiche ya na χαρά.
- source_word: πολλοὶ
  choice: ọtụtụ mmadụ
  rationale: E tinyere “mmadụ” iji mee ka adjective Grik e ji dị ka aha doo anya ma daa nke ọma n'Igbo.
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: mgbe a mụrụ ya
  rationale: Nke a na-egosipụta ọmụmụ ya dị ka oge ma ọ bụ ọnọdụ aṅụrị ahụ n'Igbo ebumpụta ụwa, n'emebighị ohere nghọta nke ihe kpatara aṅụrị ahụ.
- source_word: χαρήσονται
  choice: ga-aṅụrịkwa ọṅụ
  rationale: Ọ na-egosipụta omume ịṅụrị ọṅụ n'ụzọ doro anya ma na-ejikọta ya na okwu ọṅụ dị na mbido amaokwu ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Oke aṅụrị” na-echekwa ike pụrụ iche nke ἀγαλλίασις, ebe akara nkọwa [a] na-echekwa nghọta abụọ dị na ἐπί tinyere dative.
