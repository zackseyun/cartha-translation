  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: ig
  text: n’ihi na Onye Dị Ike emeela m ihe ukwu, aha ya dịkwa nsọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “Nsọ bụ aha ya.” N’asụsụ Grik, e debere “nsọ” n’ihu “aha ya” iji mesie ya ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe mere Meri ji eto Onyenwe anyị n’amaokwu bu ụzọ, ma na-edobe nghọta nke ihe kpatara ya.
- source_word: ἐποίησέν
  choice: emeela
  rationale: Oge ngwaa a na-egosi ihe Chineke mezuru nke ka nwere ihe ọ pụtara ugbu a; “emeela” na-egosipụta nke a nke ọma n’Igbo.
- source_word: μοι
  choice: m
  rationale: N’usoro okwu “emeela m ihe ukwu,” nnọchiaha a na-egosi na ihe ahụ bụ maka uru Meri, n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: μεγάλα
  choice: ihe ukwu
  rationale: Ọ bụ adjective ọtụtụ nke e ji dị ka aha; “ihe ukwu” na-edobe obosara okwu ahụ n’etinyeghị nkọwa karịrị isi mmalite.
- source_word: ὁ δυνατός
  choice: Onye Dị Ike
  rationale: Adjective nwere article na-arụ ọrụ dị ka aha nsọpụrụ e ji akpọ Chineke; ntụgharị a dị nkenke, dị ùgwù, ma na-edobe ike aha ahụ.
- source_word: ἅγιον
  choice: dị nsọ
  rationale: Ọ na-akọwa aha Chineke dị ka nke dị nsọ; nke a bụ okwu Igbo doro anya ma kwekọọ n’asụsụ Akwụkwọ Nsọ.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: aha ya
  rationale: Nke a bụ ntụgharị Igbo ebumpụta ụwa nke na-edobe okwu “aha” dịka o si dị n’isi mmalite.
theological_decisions:
- issue: Ịsụgharị ὁ δυνατός dị ka aha nsọpụrụ Chineke
  choice: Onye Dị Ike
  alternative: onye ahụ dị ike
  rationale: Greek ji adjective nwere article mee aha e ji akpọ Chineke. “Onye Dị Ike” na-edobe ọrụ aha nsọpụrụ ahụ n’etinyeghị ozizi ọzọ.
- issue: Usoro okwu na καὶ ἅγιον τὸ ὄνομα αὐτοῦ
  choice: aha ya dịkwa nsọ
  alternative: ihe dịkwa nsọ bụ aha ya
  rationale: Igbo nkịtị na-asụ “aha ya dị nsọ.” Nhọrọ a na-eme ka amaokwu ahụ doo anya ma debe ihe Greek kwuru; ihe e mesiri ike site n’itinye “nsọ” n’ihu ka a kọwara n’ala ala peeji.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “Onye Dị Ike” debe aha nsọpụrụ Chineke, ebe ahịrịokwu ikpeazụ gbasoro usoro Igbo ebumpụta ụwa; nkọwa ala peeji na-echekwa mmetụ pụrụ iche nke usoro okwu Greek.
