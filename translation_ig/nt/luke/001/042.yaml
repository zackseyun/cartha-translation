revisions:
- from: O wee tie mkpu n’olu dara ụda, sị[a], “Onye a gọziri agọzi ka ị bụ n’etiti ụmụ nwanyị, onye a gọziri agọzi ka mkpụrụ nke akpa nwa gị bụkwa.”
  to: O wee tie mkpu n’oké olu[a], sị, “Ị bụ onye a gọziri agọzi n’etiti ụmụ nwanyị, mkpụrụ nke akpa nwa gị bụkwa onye a gọziri agọzi.”
  rationale: The revision renders the loudness explicitly, relocates the footnote anchor to the phrase it qualifies, and uses idiomatic Standard Igbo predicative blessing clauses. It retains the Greek’s parallel blessing formula, its unexpanded “among women,” and the metaphorical “fruit of your womb.”
  reviewer_model: gpt-5.6-terra
