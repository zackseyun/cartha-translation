  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: ig
  text: O wee tie mkpu n’oké olu[a], sị, “Ị bụ onye a gọziri agọzi n’etiti ụmụ nwanyị, mkpụrụ nke akpa nwa gị bụkwa onye a gọziri agọzi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “wee jiri nnukwu mkpu kwuo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: tie mkpu
  rationale: Ngwaa a na-egosi ikwu okwu n’olu siri ike ma ọ bụ iti mkpu; ‘tie mkpu’ na-egosipụta ike olu ahụ n’ebughị echiche na ọ nọ ná mwute.
- source_word: κραυγῇ μεγάλῃ
  choice: n’olu dara ụda
  rationale: Nkebi a na-akọ ụzọ o si kwuo okwu. Nsụgharị a bụ Igbo e ji eme ihe nke ọma ma na-egosipụta ịdị ike na ịnụpụta olu ahụ.
- source_word: Εὐλογημένη
  choice: Onye a gọziri agọzi ka ị bụ
  rationale: Nke a na-edobe usoro okwu ngọzi ahụ dịka nkwupụta, ma na-egosi na ngọzi ahụ dakwasịrị Meri.
- source_word: ἐν γυναιξίν
  choice: n’etiti ụmụ nwanyị
  rationale: Nke a na-egosi ọnọdụ ya pụrụ iche n’etiti ụmụ nwanyị n’etinyeghị ‘niile,’ nke na-adịghị kpọmkwem n’ihe odide Grik.
- source_word: εὐλογημένος
  choice: onye a gọziri agọzi ka ... bụkwa
  rationale: Usoro a kwekọrọ na ngọzi e kwuru banyere Meri, na-echekwa myiri ahịrịokwu abụọ ahụ.
- source_word: ὁ καρπὸς
  choice: mkpụrụ
  rationale: ‘Mkpụrụ’ na-echekwa ihe atụ dị n’asụsụ mmalite ma bụrụkwa okwu Akwụkwọ Nsọ a pụrụ ịghọta n’ebe a.
- source_word: τῆς κοιλίας σου
  choice: nke akpa nwa gị
  rationale: N’ọnọdụ ime a, κοιλία na-ezo aka kpọmkwem n’akpa nwa; okwu a na-echekwa ihe oyiyi nne na nwa dị n’ihe odide ahụ.
theological_decisions:
- issue: Ụdị ngọzi a gwara Meri
  choice: Onye a gọziri agọzi ka ị bụ n’etiti ụmụ nwanyị
  alternative: A gọziri gị n’etiti ụmụ nwanyị
  rationale: Nhọrọ a na-echekwa usoro nkwupụta ngọzi nke amaokwu ahụ, n’ebelataghị ma ọ bụ gbasaa ọrụ Meri karịa ihe ederede kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere myiri dị n’etiti ngọzi Meri na ngọzi mkpụrụ akpa nwa ya, tinyekwa akara [a] ozugbo n’isiokwu ederede.
