reference: Luke 1:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: ig
  text: Mmụọ ozi ahụ zara ya sị, “Abụ m Gebriel, onye na-eguzo n’ihu Chineke; e zitere m ka m gwa gị okwu ma kwusaara gị ozi ọma ndị a.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: zara ya
  rationale: Nkebi a na-ewebata okwu a na-ekwu kpọmkwem; ‘zara ya’ bụ ụzọ Igbo dị ire ma doo anya isi kwuo ya.
- source_word: ἄγγελος
  choice: Mmụọ ozi
  rationale: N’ebe a, onye a na-ekwu maka ya bụ onye ozi si n’eluigwe, ya bụ Gebriel; ‘mmụọ ozi’ bụ okwu Igbo nkịtị maka angel.
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: Abụ m Gebriel
  rationale: Nke a na-edobe nkwupụta njirimara ahụ n’ụzọ Igbo dị mfe ma nwee nkwusi ike kwesịrị ekwesị.
- source_word: ὁ παρεστηκὼς
  choice: onye na-eguzo
  rationale: Perfect participle ahụ na-egosi ọnọdụ na-adịgide ugbu a; ‘onye na-eguzo’ na-egosipụta nke a n’ụzọ eke.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: ‘N’ihu Chineke’ na-egosi ịnọ n’ọnụnọ Chineke, ma na-echekwa ihe oyiyi nke onye na-eje ozi n’ihu eze.
- source_word: ἀπεστάλην
  choice: E zitere m
  rationale: Nke a na-echekwa olu nnara nke Grik ma na-egosi na e nyere Gebriel ọrụ.
- source_word: λαλῆσαι πρὸς σὲ
  choice: ka m gwa gị okwu
  rationale: Ọ bụ nsụgharị Igbo dị eke nke infinitive nke nzube, ‘ịgwa gị okwu.’
- source_word: εὐαγγελίσασθαί σοι
  choice: ma kwusaara gị ozi ọma
  rationale: ‘Kwusara ... ozi ọma’ na-echekwa echiche nke ikwupụta ma ọ bụ iweta ozi dị mma n’enweghị ime ka okwu ahụ bụrụ aha nkà mmụta okpukpe pụrụ iche.
- source_word: ταῦτα
  choice: banyere ihe ndị a
  rationale: Aha nrụtụ aka ahụ pụtara n'ụzọ nkịtị ‘ihe ndị a’ ma na-arụtụ aka n’ozi Gebriel kwupụtara; edobere ya ka mgbagwoju okwu ziri ezi nke Grik ghara ịla n’iyi.
theological_decisions:
- issue: Nsụgharị εὐαγγελίζω n’akụkọ ọkwa mmụọ ozi
  choice: kwusaara gị ozi ọma
  alternative: kwusaara gị oziọma / wetara gị ozi ọma
  rationale: ‘Ozi ọma’ na-enye isi ihe ngwaa ahụ pụtara n’ebe a, n’enweghị ibubata nghọta teknụzụ nke ‘gospel’ dị ka aha e mesịrị jiri mee ihe.
- issue: Mmekọrịta εὐαγγελίσασθαί na ταῦτα
  choice: kwusaara gị ozi ọma banyere ihe ndị a
  alternative: kwusaara gị ihe ndị a dị ka ozi ọma
  rationale: Nhọrọ ahụ na-edobe ma echiche ‘ozi ọma’ dị na ngwaa ahụ ma okwu nrụtụ aka ‘ihe ndị a,’ nke na-arụtụ aka n’ihe Gebriel kwupụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Gebriel’ bụ nsụgharị aha ahụ a na-ejikarị n’Igbo; ahịrịokwu ahụ na-edobe ụda nkwenye na ikike nke onye ozi ahụ.
