  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: ig
  text: Nwatakịrị ahụ nọgidere na-eto, na-esiwanye ike n'ime mmụọ[a]; ọ nọkwa n'ebe tọgbọrọ n'efu[b] ruo ụbọchị e gosiri ya n'ihu ọha nye Izrel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime Mmụọ.” Okwu Grik ahụ nwere ike ịpụta ike n'ime mmadụ ma ọ bụ ike ime mmụọ n'ozuzu ya, ma ọ bụ ike n'ihe gbasara Mmụọ Nsọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n'ọzara.” Okwu Grik ahụ dị n'ụdị ọtụtụ; n'ụzọ nkịtị, “n'ebe tọgbọrọ n'efu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ruo ụbọchị ngosi ya n'ihu Izrel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: Nwatakịrị ahụ
  rationale: Ọ na-ezo aka na Jọn mgbe ọ ka bụ nwata, n'ekwughị kpọmkwem afọ ndụ ya.
- source_word: ηὔξανε
  choice: nọgidere na-eto
  rationale: Ọdịdị imperfect na-egosi uto gara n'ihu.
- source_word: ἐκραταιοῦτο
  choice: na-adịkwa ike
  rationale: Na-egosi usoro ịga n'ihu nke ịghọ onye siri ike, n'ekpebighị ma e mere ka o sie ike ma ọ bụ na o toro sie ike.
- source_word: πνεύματι
  choice: n'ime mmụọ
  rationale: Na-echekwa echiche sara mbara nke ike ime mmụọ ma ọ bụ ike nke ime mmadụ, n'ekwughị hoo haa na ọ bụ Mmụọ Nsọ.
- source_word: ἐν ταῖς ἐρήμοις
  choice: n'ebe ndị tọgbọrọ n'efu
  rationale: Na-echekwa ụdị ọtụtụ nke okwu Grik ma na-ezere ime ka ebe ahụ bụrụ naanị ọzara aja.
- source_word: ἀναδείξεως
  choice: ọ pụtara n'ihu ọha
  rationale: Na-egosi oge e mere ka ọha mmadụ mata ya ma ọ bụ mgbe ọ malitere ọrụ ya n'ihu ha.
- source_word: πρὸς τὸν Ἰσραήλ
  choice: nye Izrel
  rationale: Na-egosi na ndị Izrel bụ ndị ọ pụtara n'ihu ha na ndị e zigara ngosipụta ahụ n'ebe ha nọ.
theological_decisions:
- issue: Ihe πνεύματι pụtara n'otú Jọn si na-eto
  choice: n'ime mmụọ
  alternative: site n'ike Mmụọ Nsọ
  rationale: E nweghị article n'okwu Grik ahụ, ọ kpọghịkwa Mmụọ Nsọ aha kpọmkwem; nsụgharị bụ isi na-ahapụ ma echiche nke ike ime mmadụ ma nke mmekọrịta ya na Mmụọ Nsọ ghe oghe.
translation_notes:
  register: Standard Igbo dị ugbu a, nke kwụ ọtọ ma dị nsọ n'olu; e ji “ebe ndị tọgbọrọ n'efu” chekwaa ụdị ọtụtụ na obosara nke ἐρήμοις, ebe e zere ikwubi kpọmkwem na πνεύματι bụ Mmụọ Nsọ.
