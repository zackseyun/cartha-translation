  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: ig
  text: Mgbe ahụ, otu mmụọ ozi nke Onyenwe anyị pụtara ìhè nye ya, guzo n’akụkụ aka nri nke ebe ịchụàjà maka ihe nsure ọkụ na-esi ísì ụtọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: pụtara n’ihu
  rationale: N’akụkọ a, ụdị ngwaa a pụtara na mmụọ ozi ahụ mere ka a hụ ya. “Pụtara n’ihu ya” bụ okwu Igbo doro anya ma dịkwa mfe, nke na-egosi onye ọ pụtara nye ya.
- source_word: δὲ
  choice: Mgbe ahụ
  rationale: N’ebe a, δέ na-akwalite usoro akụkọ gaa n’ihe mere ọzọ; “Mgbe ahụ” na-egosipụta usoro ahụ n’enweghị ịgbakwunye esemokwu na-adịghị na Greek.
- source_word: αὐτῷ
  choice: ya
  rationale: E tinyere ya n’ahịrịokwu “pụtara n’ihu ya” iji mee ka onye natara ọhụụ ahụ doo anya.
- source_word: ἄγγελος
  choice: mmụọ ozi
  rationale: N’ọnọdụ ọhụụ dị n’ụlọ nsọ a, okwu ahụ na-ezo aka n’onye ozi si n’eluigwe, ya mere “mmụọ ozi” ka “onye ozi” dabara.
- source_word: κυρίου
  choice: nke Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-aghọta nke ọma isi sụgharịa njikọ genitive ἄγγελος κυρίου ma chekwaa κύριος dị ka aha nsọpụrụ.
- source_word: ἑστὼς
  choice: guzo
  rationale: Participle a na-akọ ọnọdụ mmụọ ozi ahụ mgbe ọ pụtara; “guzo” na-enye ọnọdụ ahụ n’Igbo nkịtị.
- source_word: ἐκ δεξιῶν
  choice: n’akụkụ aka nri
  rationale: Akpaokwu Greek a na-egosi ebe ihe dị n’aka nri; nsụgharị a na-echekwa nghọta ọnọdụ ya.
- source_word: θυσιαστηρίου
  choice: ebe ịchụàjà
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka ebe a na-achụ àjà, nke genitive na-esote kọwara ụdị ya.
- source_word: τοῦ θυμιάματος
  choice: ihe nsure ọkụ na-esi ísì ụtọ
  rationale: Ọ na-akọwa ebe ịchụàjà ahụ dị ka nke e ji esure ihe na-esi ísì ụtọ; okwu a na-eme ka ọrụ ya doo onye Igbo nke oge a anya.
theological_decisions:
- issue: Nsụgharị κύριος n’akpaokwu ἄγγελος κυρίου
  choice: Onyenwe anyị
  alternative: Onyenwe; Dinwenụ
  rationale: “Onyenwe anyị” bụ aha nsọpụrụ a na-aghọta nke ọma n’Igbo ma na-echekwa njikọ ahụ dị ka “mmụọ ozi nke Onyenwe anyị,” n’etinyeghị nkọwa okwukwe ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. A họọrọ “ihe nsure ọkụ na-esi ísì ụtọ” kama okwu mgbazinye ma ọ bụ okwu ochie, ka ụdị ebe ịchụàjà ahụ doo anya.
