review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the central contrast: the speaker does not understand his own action, does not do what he wants, and does what he hates. However, the first γάρ introduces the entire explanation, and retaining the two clauses in one connected sentence better reflects the source’s syntax. The added infinitive in “ihe m chọrọ ime” is understandable but is not required by the Greek, which simply says “what I want.”'
  naturalness: The wording is generally clear Standard Igbo. A single connected sentence with commas is more natural for this tightly linked argument than breaking after the first clause and restarting with “N’ihi na.”
  terminology: “aghọta,” “eme,” and “kpọrọ asị” are appropriate, modern, and suitably strong equivalents. No doctrinal interpretation is introduced.
  issues:
  - severity: low
    issue: The first explanatory clause is separated as an independent sentence.
    rationale: The Greek joins the clauses with γάρ and then develops the contrast with ἀλλά. Keeping them connected better preserves the argumentative flow without changing meaning.
  - severity: low
    issue: “ihe m chọrọ ime” supplies an explicit infinitive not present in the Greek.
    rationale: It is idiomatic and not seriously misleading, but “ihe m chọrọ” is more concise and preserves the source’s open wording.
  revised_text: N’ihi na ihe m na-eme adịghị m aghọta, n’ihi na anaghị m eme ihe m chọrọ, kama ihe m kpọrọ asị ka m na-eme.
