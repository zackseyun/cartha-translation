- from: N’ihi na ihe m na-eme adịghị m aghọta. N’ihi na anaghị m eme ihe m chọrọ ime; kama, ọ bụ kpọmkwem ihe m kpọrọ asị ka m na-eme.
  to: N’ihi na ihe m na-eme adịghị m aghọta, n’ihi na anaghị m eme ihe m chọrọ, kama ihe m kpọrọ asị ka m na-eme.
  rationale: The revision preserves the repeated explanatory force of γάρ and the contrast introduced by ἀλλά in one coherent Igbo sentence. It also avoids unnecessarily specifying the object of the speaker’s desire while retaining the source’s deliberate parallelism.
