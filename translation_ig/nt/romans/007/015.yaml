  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: ig
  text: N’ihi na ihe m na-eme adịghị m aghọta, n’ihi na anaghị m eme ihe m chọrọ, kama ihe m kpọrọ asị ka m na-eme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: ihe m na-eme
  rationale: N’ebe a, okwu a na-ezo aka n’ihe Pọl na-arụpụta n’omume ya; Igbo nkịtị ‘ihe m na-eme’ na-ebute echiche ahụ nke ọma.
- source_word: οὐ γινώσκω
  choice: adịghị m aghọta
  rationale: γινώσκω nwere ike ịpụta ‘ịma’ ma ọ bụ ‘ịghọta’; n’ọnọdụ a, ‘aghọta’ na-egosi mgbagwoju anya Pọl banyere omume nke ya, ọ bụghị na ọ maghị na ọ na-eme ya.
- source_word: πράσσω
  choice: anaghị m eme
  rationale: Ọ bụ ezie na πράσσω pụrụ iburu echiche nke ime ihe dịka omume a na-eme ugboro ugboro, ‘anaghị m eme’ bụ asụsụ Igbo doro anya ma ghara ịkwanye nkọwa karịrị isiokwu ahụ.
- source_word: μισῶ
  choice: m kpọrọ asị
  rationale: Nke a bụ nsụgharị kpọmkwem ma dị ike nke μισέω, na-echekwa esemokwu dị n’etiti ọchịchọ ya na omume ya.
- source_word: ποιῶ
  choice: m na-eme
  rationale: A sụgharịrị ya n’asụsụ Igbo nkịtị; ọdịiche dị n’etiti ποιῶ na πράσσω adịghị mfe igosi n’Igbo n’enweghị ịgbakwunye nkọwa na-adịghị n’amaokwu ahụ.
theological_decisions:
- issue: Onye ma ọ bụ ọnọdụ ndụ nke onye na-ekwu okwu na-anọchi anya ya
  choice: E debere okwu ahụ n’olu onye mbụ n’enweghị ịkọwa ma ọ na-ekwu banyere onwe ya ugbu a, ndụ ya gara aga, ma ọ bụ mmadụ dịka onye nnọchi anya.
  alternative: Ịgbakwunye okwu ga-egosi na ọ bụ onye kwere ekwe, onye na-ekweghị ekwe, ma ọ bụ Izrel ka a na-ekwu maka ya.
  rationale: Amaokwu Grik n’onwe ya anaghị edozi esemokwu nkọwa ahụ; nsụgharị ekwesịghị ibubata otu ozizi pụrụ iche.
- issue: Njikọ γὰρ nke ugboro abụọ
  choice: N’ihi na
  alternative: N’ezie / lee
  rationale: 'Nke a na-echekwa ọrụ nkọwa nke γὰρ: ihe na-esochi na-akọwa ihe mere onye na-ekwu okwu ji sị na ọ naghị aghọta ihe ọ na-eme.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi ‘na-eme’ nke dị na isi mmalite, ma jiri ‘kpọmkwem’ mesie τοῦτο ike n’ahịrị ikpeazụ.
