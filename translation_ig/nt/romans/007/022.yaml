    text: Ma ọ bụ, “dịka onwe m dị n’ime si dị,” ma ọ bụ “dịka akụkụ m dị n’ime si dị.”
    reason: lexical_alternative
  revision_rationale: The revision replaces an opaque expression with an idiomatic Standard Igbo clause. It retains the affective force of συνήδομαι (“ana m enwe ọṅụ n’”), the established Pauline term “iwu Chineke,” and the metaphor of the inner person. The alternatives in the note are adjusted to avoid introducing “ọnọdụ” (“condition”), which is not present in the Greek.
