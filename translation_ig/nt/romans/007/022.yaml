  to: N’ihi na ana m enwe ọṅụ n’iwu Chineke, dịka mmadụ dị n’ime m si dị,[a]
  rationale: The revision replaces an opaque expression with an idiomatic Standard Igbo clause. It retains the affective force of συνήδομαι (“ana m enwe ọṅụ n’”), the established Pauline term “iwu Chineke,” and the metaphor of the inner person. The alternatives in the note are adjusted to avoid introducing “ọnọdụ” (“condition”), which is not present in the Greek.
