lexical_decisions:
- source_word: συνήδομαι
  choice: na-atọ m ụtọ
  rationale: Nke a na-egosi nnabata sitere n'ọṅụ na obi ụtọ, ọ bụghị naanị ikweta n'uche.
- source_word: νόμῳ τοῦ θεοῦ
  choice: iwu Chineke
  rationale: “Iwu” na-edobe okwu Pọl ji eme ihe na ịdị arọ ya n'ọnọdụ a; njikọ aha a bụkwa Igbo nkịtị maka “iwu nke Chineke.”
- source_word: κατὰ
  choice: n’ime
  rationale: N'okwu a, ọ na-akọwa akụkụ ime mmadụ ebe obi ụtọ ahụ dị; “n’ime” bụ ụzọ Igbo doro anya ma dịkwa eke isi kwuo ya.
- source_word: τὸν ἔσω ἄνθρωπον
  choice: mmadụ m bụ n’ime ime
  rationale: Nke a na-edobe ihe atụ Pọl banyere “mmadụ dị n’ime,” ma jiri “m” mee ka njikọ ya na onye na-ekwu okwu doo anya n’Igbo.
theological_decisions:
- issue: Ihe τὸν ἔσω ἄνθρωπον pụtara banyere ọdịdị mmadụ
  choice: mmadụ m bụ n’ime ime
  alternative: ọnụnọ m dị n’ime; onwe m dị n’ime
  rationale: Nsụgharị a na-edobe ihe atụ nke “mmadụ dị n’ime” n’enweghị ịkọwapụta ya dịka ozizi pụrụ iche banyere akụkụ ndị mejupụtara mmadụ.
