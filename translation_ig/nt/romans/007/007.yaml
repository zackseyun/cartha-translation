revisions:
- from: Gịnịzi ka anyị ga-ekwu? Iwu ahụ ọ bụ mmehie? Mba, ọ gaghị ekwe omume! Kama, agaraghị m ama mmehie ma a sị na ọ bụghị site n’iwu. N’ihi na agaraghị m ama ihe ọ bụ mmadụ inwe agụụ[a] ma a sị na iwu ahụ ekwughị, “Enwela agụụ ihe mmadụ ọzọ nwere.”
  to: Gịnịzi ka anyị ga-ekwu? Iwu ahụ ọ bụ mmehie? Ekwela! Kama, agaraghị m amata mmehie ma ọ bụghị site n’iwu; n’ihi na agaraghị m ama ọchịchọ[a] ma iwu ahụ asịghị, “Ekwela ka ị chọọ ihe onye ọzọ nwere.”
  rationale: The revision replaces an ambiguous hunger-associated term with a natural Standard Igbo term for desire, retains the contextual sense of coveting through the quotation and footnote, and uses an idiomatic emphatic denial for μὴ γένοιτο. It also removes an unnecessary explanatory circumlocution while preserving the Greek counterfactuals and rhetorical flow.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the rhetorical questions, the categorical denial, the law's role in making sin known, and the counterfactual structure. However, “inwe agụụ” commonly evokes physical hunger and is not a suitably precise or natural rendering of ἐπιθυμία in this context. The command quotation also expands the Greek and does not retain a natural lexical link with the preceding noun.
  naturalness: “Mba, ọ gaghị ekwe omume!” is intelligible but sounds like a statement about possibility rather than Paul's conventional forceful repudiation. “Ekwela!” is concise, idiomatic, and preserves the optative force. “Agaraghị m ama ihe ọ bụ mmadụ inwe agụụ” is cumbersome; the revision is direct and idiomatic.
  terminology: Use “ọchịchọ” for ἐπιθυμία, with a footnote recording the broader sense “agụụ,” while the immediate command makes clear that prohibited coveting is intended. Render the command as “Ekwela ka ị chọọ ihe onye ọzọ nwere,” which naturally expresses the command's coveting sense without importing a denominational interpretation.
  issues:
  - severity: medium
    issue: “agụụ” is used as the primary rendering of ἐπιθυμία.
    rationale: In contemporary Standard Igbo, “agụụ” primarily denotes hunger. Though it can participate in expressions of desire, it is liable to misread the passage and makes the clause unnatural.
  - severity: medium
    issue: The denial “Mba, ọ gaghị ekwe omume!” weakens and shifts μὴ γένοιτο.
    rationale: It frames the matter as impossibility rather than Paul's emphatic repudiation. “Ekwela!” better reflects both the force and idiom.
  - severity: low
    issue: The wording “ihe ọ bụ mmadụ inwe agụụ” is overly periphrastic.
    rationale: It obscures the straightforward parallel between knowing sin and knowing coveting/desire.
  revised_text: Gịnịzi ka anyị ga-ekwu? Iwu ahụ ọ bụ mmehie? Ekwela! Kama, agaraghị m amata mmehie ma ọ bụghị site n’iwu; n’ihi na agaraghị m ama ọchịchọ[a] ma iwu ahụ asịghị, “Ekwela ka ị chọọ ihe onye ọzọ nwere.”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “agụụ” ma ọ bụ “ọchịchọ.” Ma iwu e hotara ozugbo na-egosi na n’ebe a ọ na-ekwu maka ọchịchọ inweta ihe onye ọzọ nwere.
    reason: lexical_alternative
  revision_rationale: The revision replaces an ambiguous hunger-associated term with a natural Standard Igbo term for desire, retains the contextual sense of coveting through the quotation and footnote, and uses an idiomatic emphatic denial for μὴ γένοιτο. It also removes an unnecessary explanatory circumlocution while preserving the Greek counterfactuals and rhetorical flow.
