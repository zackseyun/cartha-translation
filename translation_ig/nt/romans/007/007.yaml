  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: ig
  text: Gịnịzi ka anyị ga-ekwu? Iwu ahụ ọ bụ mmehie? Ekwela! Kama, agaraghị m amata mmehie ma ọ bụghị site n’iwu; n’ihi na agaraghị m ama ọchịchọ[a] ma iwu ahụ asịghị, “Ekwela ka ị chọọ ihe onye ọzọ nwere.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “agụụ” ma ọ bụ “ọchịchọ.” Ma iwu e hotara ozugbo na-egosi na n’ebe a ọ na-ekwu maka ọchịchọ inweta ihe onye ọzọ nwere.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Gịnịzi ka anyị ga-ekwu?
  rationale: Na-edobe usoro ajụjụ Pọl ji aga n’ihu n’arụmụka ya, n’Igbo dị mfe ma dịkwa ugwu.
- source_word: ὁ νόμος
  choice: iwu ahụ
  rationale: Nkọwa a kapịrị ọnụ na-egosi Iwu Mozis nke a na-ekwu maka ya n’ebe a.
- source_word: ἁμαρτία
  choice: mmehie
  rationale: Ọ bụ okwu Igbo a na-ahụkarị ma kwekọọ kpọmkwem n’echiche omume na nke okpukpe nke okwu Grik ahụ.
- source_word: μὴ γένοιτο
  choice: Mba, ọ gaghị ekwe omume!
  rationale: Na-egosipụta ịjụ echiche ahụ kpamkpam na ike dị n’okwu Pọl, karịa nanị ịsị ‘Mba.’
- source_word: ἀλλὰ
  choice: Kama
  rationale: Na-egosi ntụgharị siri ike site n’ịjụ echiche mbụ gaa n’ihe iwu ahụ na-eme n’ezie.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: agaraghị m ama mmehie ma a sị na ọ bụghị site n’iwu
  rationale: Na-edobe ọdịdị ọnọdụ megidere eziokwu nke ahịrịokwu ahụ, tinyere echiche na iwu mere ka a mata mmehie.
- source_word: ἐπιθυμίαν
  choice: inwe agụụ
  rationale: ‘Agụụ’ na-edobe obosara okwu Grik ἐπιθυμία, ebe ihe e hotara n’iwu na-akọwapụta na n’ebe a ọ bụ agụụ ihe onye ọzọ nwere.
- source_word: οὐκ ᾔδειν
  choice: agaraghị m ama ihe ọ bụ
  rationale: Na-eme ka Igbo bụrụ ihe doro anya ma na-edobe ndakọrịta ya na ‘agaraghị m ama’ dị n’ahịrịokwu gara aga.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Enwela agụụ ihe mmadụ ọzọ nwere
  rationale: Na-enye iwu ahụ n’Igbo eke ma na-eme ka ụdị agụụ a machibidoro—ịchọ ihe onye ọzọ nwere—pụta ìhè.
theological_decisions:
- issue: Mmekọrịta dị n’etiti iwu na mmehie
  choice: Iwu ahụ ọ bụ mmehie? Mba, ọ gaghị ekwe omume!
  alternative: Iwu ahụ ọ na-eme mmehie?
  rationale: Aha nkwupụta Grik na-ajụ ma iwu ahụ ọ bụ mmehie n’onwe ya, ọ bụghị naanị ma iwu ahụ ò nwere àgwà mmehie. Nsụgharị a na-edobe ịdị nkọ nke ajụjụ Pọl.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E debere ajụjụ nkwupụta Pọl, ịjụ ya siri ike, na ọnọdụ megidere eziokwu; e zere okwu pụrụ iche nke otu ụka.
