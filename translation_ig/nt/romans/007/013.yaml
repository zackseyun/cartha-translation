id: ROM.7.13
reference: Romans 7:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: ig
  text: Ya mere, ihe ọma ò ghọrọ ọnwụ nye m? Mba, ọ dịghị ma ọlị! Kama, ọ bụ mmehie—ka o wee pụta ìhè dị ka mmehie[a]—na-eji ihe ọma arụpụta ọnwụ n’ime m, ka mmehie wee ghọọ ihe dị oke njọ gabiga ókè site n’iwu ahụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ka e wee gosi na ọ bụ mmehie.”'
    reason: lexical_alternative
  - marker: b
    text: 'N’usoro okwu Grik dị nso: “ka mmehie wee ghọọ ihe dị oke njọ gabiga ókè site n’iwu ahụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: ihe ahụ dị mma
  rationale: Nke a na-egosipụta adjective neuter e ji dị ka aha, ma na-ejikọkwa ya n'ụzọ doro anya na ihe ọma a kpọtụrụ aha n'okwu gbara amaokwu a gburugburu.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: ọ ghọrọ ọnwụ nye m
  rationale: Ọ na-edobe echiche predicative nke γίνομαι na dative nke onye okwu ahụ metụtara, n'Igbo dị mfe ma kwụ ọtọ.
- source_word: μὴ γένοιτο
  choice: Mba, ọ dịghị ma ọlị!
  rationale: Nke a bụ nkwupụta siri ike nke ịjụ echiche ahụ kpamkpam, n'asụsụ Igbo nke oge a na-aghọta ngwa ngwa.
- source_word: ἡ ἁμαρτία
  choice: mmehie
  rationale: Ọ na-edobe mmehie dị ka ihe e mere ka ọ na-arụ ọrụ dịka onye, n'ebughị nkọwa okpukpe ọzọ bata.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: ka e wee gosi na ọ bụ mmehie
  rationale: Ọ na-edobe purpose clause na nkwughachi siri ike Pọl ji mee ka ezigbo ọdịdị mmehie pụta ìhè.
- source_word: διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον
  choice: mmehie ji ihe dị mma na-arụpụta ọnwụ n’ime m
  rationale: E dozigharịrị usoro okwu ahụ ntakịrị ka ọ bụrụ Igbo e ji ekwu okwu nke ọma, ma a ka debere mmehie dị ka onye na-arụpụta ọnwụ na ihe dị mma dị ka ụzọ o si mee ya.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: ihe jọgburu onwe ya gabiga ókè
  rationale: Nke a na-ebufe ike nke okwu ahụ n'Igbo eke; ihe odide ala ala na-edebekwa nsụgharị nke na-emegharị okwu ‘mmehie’ kpọmkwem.
- source_word: διὰ τῆς ἐντολῆς
  choice: site n’iwu ahụ
  rationale: ‘Iwu ahụ’ bụ okwu Igbo doro anya maka ἐντολή n'ebe a ma na-ezo aka n'iwu a kpọtụrụ aha n'amaokwu ndị bu ụzọ.
theological_decisions:
- issue: Nchekwa Pọl na-echekwa ịdị mma nke iwu ahụ
  choice: E mere mmehie ka ọ bụrụ onye na-arụpụta ọnwụ, ebe ihe dị mma ma ọ bụ iwu ahụ bụ ụzọ mmehie si rụọ ọrụ.
  alternative: A pụrụ ịsụgharị ya n'ụzọ ga-eme ka iwu ahụ n'onwe ya yie ihe kpatara ọnwụ n'ụzọ kwesịrị ikpe ọmụma.
  rationale: Ọdịiche dị n'okwu Grik mgbe μὴ γένοιτο gasịrị na-etinye ibu ọrụ ahụ n'ahụ mmehie, ọ bụghị n'ahụ ihe dị mma; nsụgharị a na-edobe usoro ọrụ ahụ n'edozi esemokwu ahụ karịa ihe odide kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere ajụjụ nkwugha, nzaghachi siri ike, na mmehie a kọwara dị ka onye na-arụ ọrụ. A hazigharịrị usoro participial clause ka ọ daa nke ọma n'Igbo n'emebighị onye na-eme ihe na ụzọ e si mee ya.
