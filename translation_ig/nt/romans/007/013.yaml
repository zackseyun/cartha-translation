review_pass:
  verdict: revise
  source_fidelity: 'A na-edobe ajụjụ nkwugha ahụ, ịjụ ya n’ike, na mmehie dịka onye na-arụpụta ọnwụ site n’ihe ọma. Otú ọ dị, “ihe jọgburu onwe ya” anaghị akọwa ἁμαρτωλός nke ọma n’ebe a: ọ pụtara ihe na-atụ egwu ma ọ bụ ihe na-akpasu iwe, karịa “mmehie”/“dị oke njọ n’ụzọ omume.” A gbanwere ya ka ọ nọgide na-ekwupụta na mmehie ghọrọ ihe dị oke njọ site n’iwu ahụ.'
  naturalness: “Ihe ọma” bụ Standard Igbo dị mkpirikpi ma dị eke karịa “ihe ahụ dị mma” maka adjective Grik e jiri dị ka aha. Ịtinye “ka o wee pụta ìhè dị ka mmehie” n’akụkụ isiokwu ya na-eme ka nzube mbụ doo anya, ebe “na-eji” na-egosipụta participle na-aga n’ihu n’ụzọ Igbo a na-ahụkarị.
  terminology: A debere “mmehie,” “ọnwụ,” “ihe ọma,” na “iwu ahụ.” “Iwu ahụ” nwere ike ịnọchite ἐντολή n’ọdụ a n’ihi na ọ na-atụ aka n’iwu/commandment Pọl kwurula; e kwesịghị ime ka ọ bụrụ naanị iwu n’ozuzu n’ụzọ na-apụ n’amaokwu ndị gbara ya gburugburu.
  issues:
  - severity: medium
    issue: “ihe jọgburu onwe ya gabiga ókè” maka καθ’ ὑπερβολὴν ἁμαρτωλός
    rationale: Nkebi okwu a na-akọwakarị ihe dị egwu ma ọ bụ nke na-akpasu iwe, ọ bụghị kpọmkwem àgwà mmehie nke ἁμαρτωλός. “ihe dị oke njọ” na-ewepụta echiche omume ahụ nke ọma karịa, n’agbanyeghị na Igbo enweghị adjective dị mfe nke dabara kpọmkwem na “sinful.”
