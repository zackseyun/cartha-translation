revisions:
- from: Ya mere, ihe ahụ dị mma ọ ghọrọ ọnwụ nye m? Mba, ọ dịghị ma ọlị! Kama, mmehie ji ihe dị mma na-arụpụta ọnwụ n’ime m, ka e wee gosi na ọ bụ mmehie[a], ka mmehie wee site n’iwu ahụ bụrụ ihe jọgburu onwe ya gabiga ókè[b].
  to: Ya mere, ihe ọma ò ghọrọ ọnwụ nye m? Mba, ọ dịghị ma ọlị! Kama, ọ bụ mmehie—ka o wee pụta ìhè dị ka mmehie[a]—na-eji ihe ọma arụpụta ọnwụ n’ime m, ka mmehie wee ghọọ ihe dị oke njọ gabiga ókè site n’iwu ahụ[b].
  rationale: 'E megharịrị ntụgharị ahụ naanị ebe ọ dị mkpa: e wepụrụ demonstrative na-enweghị ihe ndabere n’isiokwu Grik, e mere clause mbụ nke nzube ka mmehie bụrụ onye pụtara ìhè dị ka mmehie, ma dochie nkọwa nke nwere ike ịpụta naanị “horrible” site n’okwu na-egosi njọ omume. A ka debere usoro Pọl: ihe ọma abụghị ihe kpatara ọnwụ n’ụzọ ikpe ọmụma; mmehie bụ onye ji ya arụpụta ọnwụ.'
