    issue: “ihe ahụ dị mma” maka Τὸ ἀγαθὸν
    rationale: Demonstrative “ahụ” adịghị n’akwụkwọ Grik. “Ihe ọma” na-edobe substantival/abstract force ahụ n’enweghị mgbakwunye ngosi.
