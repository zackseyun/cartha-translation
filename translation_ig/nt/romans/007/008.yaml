revisions:
- from: Ma mmehie, ebe o si n’iwu ahụ nweta ohere[a], kpalitere n’ime m ọchịchọ ọ bụla inweta ihe nke onye ọzọ[b]. N’ihi na, n’enweghị iwu, mmehie nwụrụ anwụ.
  to: Ma mmehie, ebe o sitere n’iwu ahụ nweta ohere[a], mere ka ọchịchọ ọ bụla pụta n’ime m[b]. N’ihi na, n’enweghị iwu, mmehie nwụrụ anwụ.
  rationale: The revision renders κατειργάσατο with “mere ka ... pụta,” which expresses causing or producing, while retaining sin as the acting subject. It removes the explanatory expansion about another person’s possessions from the main text, preserving Paul’s stated breadth and placing the contextual sense in a footnote. The first note now reflects the Greek participle and “opportunity” more closely.
