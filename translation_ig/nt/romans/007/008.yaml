source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: ig
  text: Ma mmehie, ebe o sitere n’iwu ahụ nweta ohere[a], mere ka ọchịchọ ọ bụla pụta n’ime m[b]. N’ihi na, n’enweghị iwu, mmehie nwụrụ anwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mgbe o sitere n’iwu ahụ were ohere.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ọchịchọ ọ bụla” ma ọ bụ “ụdị ọchịchọ niile”; n’ebe a, ihe gbara amaokwu a gburugburu na-egosi ịchọ inweta ihe nke onye ọzọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν
  choice: ohere
  rationale: “Ohere” na-egosi ohere mmehie jiri mee ihe, ma ọ naghị akọwakarị ihe atụ ahụ karịa otú Grik si kwuo ya.
- source_word: λαβοῦσα
  choice: ebe o si ... nweta
  rationale: Nke a na-egosi na mmehie nwetara ma jiri ohere ahụ mee ihe; ọ na-edobekwa mmehie dị ka ike Pọl mere ka ọ na-eme omume.
- source_word: ἡ ἁμαρτία
  choice: mmehie
  rationale: E debere mmehie dị ka isiokwu na-eme omume, dịka personification dị n’asụsụ Grik.
- source_word: διὰ τῆς ἐντολῆς
  choice: si n’iwu ahụ
  rationale: Ọnụọgụ otu na-arụtụ aka n’iwu a kpọtụrụ aha n’akụkụ amaokwu a; “si n’” na-egosi ụzọ mmehie si nweta ohere.
- source_word: κατειργάσατο
  choice: kpalitere
  rationale: N’ebe a, okwu ahụ pụtara ime ka ihe pụta ma ọ bụ mee ka ọ rụọ ọrụ; “kpalitere” bụ okwu Igbo dị ndụ ma doo anya.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: ọchịchọ ọ bụla inweta ihe nke onye ọzọ
  rationale: N’ihe gbara amaokwu a gburugburu, ἐπιθυμία metụtara iwu megide ịchọ ihe onye ọzọ; nsụgharị a na-eme ka echiche ahụ doo anya n’Igbo n’enweghị ịgbasa ya ruo n’ọchịchọ ọjọọ niile.
- source_word: χωρὶς γὰρ νόμου
  choice: N’ihi na, n’enweghị iwu
  rationale: Nke a na-echekwa ike nkọwa nke γάρ na echiche nke ịnọghị n’okpuru ma ọ bụ n’enweghị iwu, n’ebughị ụzọ kpebie nkọwa nkà mmụta okpukpe ya.
- source_word: νεκρά
  choice: nwụrụ anwụ
  rationale: E chekwara ihe atụ siri ike Pọl ji mee ihe kama ịtụgharị ya ka ọ bụrụ naanị “adịghị arụ ọrụ.”
theological_decisions:
- issue: Mmehie dị ka ike na-eme omume, na ihe “mmehie nwụrụ anwụ” pụtara
  choice: E debere mmehie dị ka onye na-enweta ohere ma na-akpalite ọchịchọ, e debekwara “nwụrụ anwụ” n’ụdị ihe atụ ya.
  alternative: Ịsụgharị mmehie dịka echiche nkịtị ma ọ bụ ịsụgharị νεκρά dịka “adịghị arụ ọrụ.”
  rationale: Grik na-eme ka mmehie yie ike na-eme omume ma jiri okwu “nwụrụ anwụ” mee ihe n’ụzọ siri ike. Nsụgharị ahụ ekwesịghị idozi esemokwu nkà mmụta okpukpe okwu ndị a nwere.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “ọchịchọ ... inweta ihe nke onye ọzọ” kama okwu nwere ike ịpụta naanị anyaukwu ego, ka njikọ ya na iwu megide ịchọ ihe onye ọzọ doo anya. E dozikwara akara nkọwa ala peeji ka ha soro okwu ha na-akọwa kpọmkwem.
