  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: ig
  text: 'Ya mere, ana m achọpụta iwu[a] a: mgbe m chọrọ ime ihe ọma, ihe ọjọọ dị m nso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụkpụrụ” ma ọ bụ “usoro.”
    reason: alternative_reading
lexical_decisions:
- source_word: Εὑρίσκω
  choice: ana m achọpụta
  rationale: Oge ugbu a nke ngwaa Grik na-egosi nghọta Pọl na-aga n’ihu; “ana m achọpụta” na-egosipụta nke a n’Igbo dị ugbu a.
- source_word: ἄρα
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya.
- source_word: νόμον
  choice: iwu
  rationale: A hapụrụ okwu bụ isi nke νόμος ka ọ bụrụ “iwu,” iji chekwaa njikọ ya na okwu Pọl banyere iwu nakwa mgbagwoju anya ma ọ̀ bụ Iwu Mozis ka ọ bụ ụkpụrụ na-achị achị.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: mgbe m chọrọ ime ihe ọma
  rationale: Nke a na-eme ka usoro dative Grik ahụ doo anya n’Igbo, ma na-echekwa ọchịchọ nke θέλω na echiche nke ime ihe ọma.
- source_word: τὸ καλὸν
  choice: ihe ọma
  rationale: “Ihe ọma” bụ ụzọ Igbo doro anya ma dịkwa mma isi kwuo adjective e ji mee noun n’ebe a.
- source_word: τὸ κακὸν
  choice: ihe ọjọọ
  rationale: Nke a na-echekwa ọdịiche doro anya dị n’etiti τὸ καλὸν na τὸ κακὸν.
- source_word: παράκειται
  choice: na-anọ m nso
  rationale: Ọ na-egosipụta ihe dị n’akụkụ mmadụ ma ọ bụ dị ya nso mgbe niile, n’asụsụ Igbo dị mfe ma kwekọọ n’echiche Grik.
theological_decisions:
- issue: Ma νόμον ọ̀ na-ezo aka n’Iwu Mozis, ka ọ bụ n’ụkpụrụ ma ọ bụ usoro na-achị achị
  choice: E jiri “iwu” mee ihe n’ahịrịokwu bụ isi.
  alternative: “ụkpụrụ” ma ọ bụ “usoro na-achị achị”
  rationale: “Iwu” na-echekwa okwu Pọl n’onwe ya na njikọ ya na νόμος n’akụkụ akwụkwọ a, n’ebughị ụzọ kpebie na ọ bụ naanị Iwu Mozis ma ọ bụ naanị ụkpụrụ ka ọ pụtara. Ihe odide ala peeji na-egosi ụzọ ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu, mee ihe. A tụkwasịrị akara [a] n’akụkụ “iwu,” bụ okwu ọ na-akọwa, ka onye na-agụ ya ghọta ihe ọzọ νόμος pụrụ ịpụta.
