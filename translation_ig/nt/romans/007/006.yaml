id: ROM.7.6
reference: Romans 7:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: ig
  text: Ma ugbu a, a tọhapụla anyị n'iwu ahụ, ebe anyị nwụrụ n'ihe ahụ e ji jide anyị[a], ka anyị wee na-eje ozi n'ịdị ọhụrụ nke Mmụọ[b], ọ bụghị n'ịdị ochie nke ihe e dere ede[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebe anyị nwụrụ nye ihe ahụ nke kere anyị agbụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “n'ịdị ọhụrụ nke mmụọ.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “n'ịdị ochie nke ihe e dere ede.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: a tọhapụla anyị n'okpuru iwu ahụ
  rationale: N'okwu a, passive ahụ na-egosi na iwu ahụ anaghịzi ejide ndị kwere ekwe n'okpuru ikike ya; ọ naghị ekwu na iwu ahụ kwụsịrị ịdị. “N'okpuru iwu ahụ” na-eme ka njikọ ahụ doo anya n'Igbo.
- source_word: ἀποθανόντες
  choice: ebe anyị nwụrụ
  rationale: Nke a na-edobe ndị e zoro aka na ha dịka “anyị” dị ka ndị nwụrụ, ọ bụghị iwu ahụ, ma na-egosikwa ihe mere tupu ntọhapụ ahụ.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: n'ihe ahụ e ji jide anyị
  rationale: Nkebiokwu a na-edobe echiche nke ihe ji mmadụ ike ma ọ bụ kee ya agbụ, na-enweghị ime ka ihe Gris ahụ pụtara bụrụ naanị otu ụzọ.
- source_word: δουλεύειν
  choice: na-eje ozi
  rationale: Ọ na-egosi ọrụ a na-arụ n'okpuru onye ọzọ, ma bụrụkwa okwu Igbo doro anya ma dị ùgwù n'ọnọdụ a.
- source_word: καινότητι πνεύματος
  choice: n'ịdị ọhụrụ nke Mmụọ
  rationale: “Ịdị ọhụrụ” na-edobe aha echiche nke Gris ma na-echekwa ntụnyere ya na “ịdị ochie”; “Mmụọ” na-egosi Mmụọ Nsọ dịka ihe okwu Pọl yikarịrị ka ọ na-ekwu.
- source_word: παλαιότητι γράμματος
  choice: n'ịdị ochie nke mkpụrụedemede
  rationale: Nke a na-edobe ọdịdị okwu Gris na ntụnyere kpọmkwem dị n'etiti ihe ọhụrụ na ihe ochie, nakwa akpaalaokwu Pọl banyere “mkpụrụedemede.”
theological_decisions:
- issue: Ma iwu ahụ ka ọ nwụrụ, ka ọ bụ ndị kwere ekwe nwụrụ n'ihe metụtara iwu ahụ
  choice: 'Ndị kwere ekwe bụ ndị nwụrụ: “ebe anyị nwụrụ n''ihe ahụ e ji jide anyị.”'
  alternative: Iwu ahụ nwụrụ n'ihe metụtara anyị.
  rationale: ἀποθανόντες bụ participle nominative plural nke na-alaghachi n'isiokwu “anyị.” Ya mere, nsụgharị ahụ anaghị eme iwu ka ọ bụrụ ihe nwụrụ.
- issue: Ma πνεύματος ọ na-ezo aka na Mmụọ Nsọ ka ọ bụ mmụọ mmadụ
  choice: Mmụọ
  alternative: mmụọ
  rationale: Ntụnyere Pọl n'etiti Mmụọ na mkpụrụedemede, tinyere ọnọdụ ọgbụgba ndụ ọhụrụ, na-akwado Mmụọ Nsọ; agbanyeghị, a hapụrụ ohere nke “mmụọ” n'ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A nọgidere na-eji “ịdị ọhụrụ/ịdị ochie” chekwaa ntụnyere okwu Gris, ebe e ji ala peeji debe ụzọ ndị ọzọ e nwere ike isi ghọta nkebiokwu ndị nwere mgbagwoju anya.
