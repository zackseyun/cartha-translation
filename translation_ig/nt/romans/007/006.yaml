    text: Ma ọ bụ, “n'ịdị ochie nke ihe e dere ede.”
    reason: lexical_alternative
  revision_rationale: The revision changes the release phrase to “n'iwu ahụ” to represent ἀπὸ (“from”) rather than continued existence under the law. It replaces “mkpụrụedemede” with “ihe e dere ede,” which better conveys γράμμα in its contrast with πνεῦμα. The translation retains the source ambiguity of ἐν ᾧ κατειχόμεθα and preserves the Spirit/spirit alternative in the footnote.
