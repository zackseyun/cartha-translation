id: ROM.7.23
reference: Romans 7:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: ig
  text: Ma ana m ahụ iwu ọzọ n’akụkụ dị iche iche nke ahụ m, nke na-ebuso iwu nke uche m agha ma na-eme m onye a dọọrọ n’agha n’okpuru iwu nke mmehie[b], nke dị n’akụkụ dị iche iche nke ahụ m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: N’ụzọ nkịtị, “n’ime iwu nke mmehie.” “N’okpuru iwu nke mmehie” na-egosipụta ọnọdụ onye e dọọrọ n’agha n’okpuru ike iwu ahụ. N’ebe a, a pụkwara ịghọta “iwu” dịka “ụkpụrụ” ma ọ bụ “ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: ana m ahụ
  rationale: Na-egosipụta nghọta Pọl na-ekwu banyere ya ugbu a n'ụzọ dị mfe ma doo anya.
- source_word: ἕτερον
  choice: ọzọ
  rationale: Na-echekwa ọdịiche dị n’etiti iwu a na iwu uche e kwuru banyere ya.
- source_word: νόμον / νόμῳ
  choice: iwu
  rationale: Iji otu okwu ahụ mee ihe ugboro ugboro na-echekwa usoro okwu Pọl na esemokwu echiche dị n’amaokwu ahụ; ihe odide ala peeji na-egosi nkọwa ndị ọzọ enwere ike.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: n’akụkụ ahụ m
  rationale: Nke a bụ Igbo kwụ ọtọ, nke mmadụ niile ga-aghọta, ma na-echekwa echiche banyere akụkụ dị iche iche nke ahụ karịa ikwu naanị ‘n’ahụ m.’
- source_word: ἀντιστρατευόμενον
  choice: nke na-ebuso ... agha
  rationale: Na-echekwa ihe atụ agha dị n’okwu Grik ma bụrụkwa okwu Igbo e ji eme ihe n’ụzọ ebumpụta ụwa.
- source_word: τοῦ νοός μου
  choice: nke uche m
  rationale: ‘Uche m’ na-egosipụta ikike ime echiche na ịhọrọ ihe, n’enweghị ịgbasa nkọwa ahụ karịa ihe odide ahụ.
- source_word: αἰχμαλωτίζοντά με
  choice: na-emekwa ka m bụrụ onye a dọọrọ n’agha
  rationale: Na-aga n’ihu n’ihe atụ agha ahụ ma na-egosipụta ịbụ onye e jidere n’agha.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: n’okpuru iwu nke mmehie
  rationale: Ọ bụ ezie na ἐν pụtara n’ime/n’ebe, ‘n’okpuru’ na Igbo na-egosipụta nke ọma ọnọdụ nke ịbụ onye iwu ahụ jidere ma na-achị, na-enweghị ime ka o doo anya karịa isi okwu Grik.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: Ọ bụ okwu Igbo a na-ahụkarị ma ziri ezi maka ἁμαρτία n’ebe a.
theological_decisions:
- issue: Ma a ga-asụgharị νόμος dịka ‘iwu’ ka a ga-akọwa ya dịka ‘ụkpụrụ’ ma ọ bụ ‘ike.’
  choice: E ji ‘iwu’ mee ihe n’ebe niile n’amaokwu bụ isi.
  alternative: A pụrụ iji ‘ụkpụrụ’ ma ọ bụ ‘ike’ n’otu ebe ma ọ bụ karịa.
  rationale: Nkwughachi ‘iwu’ na-echekwa okwu Pọl kpachapụrụ anya kwughachi na esemokwu dị n’etiti iwu uche na iwu mmehie, kama ịkọwapụta ozugbo ụdị ike iwu mmehie bụ.
- issue: Otu e si egosipụta ἐν mgbe αἰχμαλωτίζω gasịrị.
  choice: ‘n’okpuru iwu nke mmehie’
  alternative: ‘n’ime iwu nke mmehie’
  rationale: ‘N’okpuru’ na-enye nghọta Igbo doro anya banyere ịbụ onye e mere ohu ma ọ bụ onye e jidere n’ike iwu mmehie, ebe ihe odide ala peeji na-echekwa ọdịdị nkịtị nke preposition Grik.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị nsọ n’ụzọ kwesịrị ekwesị. E debere ihe atụ agha na nkwughachi okwu ‘iwu,’ ebe e ji ‘akụkụ ahụ m’ mee ka ihe atụ anatomical ahụ doo ndị na-agụ akwụkwọ anya.
