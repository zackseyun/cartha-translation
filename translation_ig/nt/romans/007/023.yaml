revisions:
- from: Ma ana m ahụ iwu ọzọ n’akụkụ ahụ m[a], nke na-ebuso iwu nke uche m agha, na-emekwa ka m bụrụ onye a dọọrọ n’agha n’okpuru iwu nke mmehie[b] dị n’akụkụ ahụ m.
  to: Ma ana m ahụ iwu ọzọ n’akụkụ dị iche iche nke ahụ m, nke na-ebuso iwu nke uche m agha ma na-eme m onye a dọọrọ n’agha n’okpuru iwu nke mmehie[b], nke dị n’akụkụ dị iche iche nke ahụ m.
  rationale: The revision explicitly represents the plural, anatomical force of μέλεσιν at both occurrences, while preserving the deliberate repetition of “iwu,” the military imagery, and the source’s ambiguity concerning νόμος. The remaining note documents the literal prepositional wording behind the idiomatic Igbo expression of captivity.
  reviewer_model: gpt-5.6-terra
