  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: ig
  text: N’ihi na ama m na ọ dịghị ihe ọma bi n’ime m—ya bụ, n’anụ ahụ m[a]. N’ihi na ọchịchọ ime ihe ọma dị m nso, ma imezu ihe ọma adịghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ọdịdị mmehie m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: ama m
  rationale: Ọ bụ ụzọ Igbo nkịtị na nke ziri ezi isi kwuo ngwaa a nke dị n’ụdị perfect ma nwee nghọta nke ugbu a.
- source_word: οἰκεῖ
  choice: bi
  rationale: “Bi” na-echekwa ihe atụ nke ihe ibi n’ime mmadụ, ma bụrụkwa okwu Igbo doro anya.
- source_word: ἀγαθόν
  choice: ezi ihe
  rationale: N’ihi na οὐκ jụrụ ịdị adị ya, “ọ dịghị ezi ihe” bụ ụzọ Igbo e si akọwa ἀγαθόν nke e ji dị ka aha.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: “Anụ ahụ” na-edobe okwu Pọl n’ụzọ pụtara ihe ozugbo ma ghara ikpebi tupu oge eruo na ọ pụtara naanị “ọdịdị mmehie.”
- source_word: θέλειν
  choice: ọchịchọ ime ihe ọma
  rationale: Ọ na-eme ka articular infinitive ahụ bụrụ okwu a na-aghọta n’Igbo; e tinyere ihe a chọrọ ime site n’okwu gbara ya gburugburu.
- source_word: παράκειταί μοι
  choice: dị n’ime m
  rationale: N’ebe a, ọ na-egosi na ọchịchọ ahụ nọ ya nso ma dị ya; okwu a na-aga nke ọma n’Igbo n’enweghị ịgbanwe isi echiche.
- source_word: κατεργάζεσθαι
  choice: imezu
  rationale: “Imezu” na-egosi ime ihe ahụ ruo n’omume ma ọ bụ rụpụta ya, nke kwekọrọ n’echiche ngwaa Grik a.
- source_word: τὸ καλόν
  choice: ihe ọma ahụ
  rationale: Ọ na-edobe ya dị ka ihe omume ọma a kpọtụrụ aha, ma bụrụkwa asụsụ Igbo dị mfe.
- source_word: οὔ
  choice: adịghị
  rationale: Nke a na-emeju okwu Grik ahụ e hapụrụ nkenke, ma na-echekwa nkenke ya n’Igbo.
theological_decisions:
- issue: Otú e si sụgharị σάρξ n’ebe Pọl na-ekwu maka omume ọjọọ
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: “Anụ ahụ” na-echekwa okwu Pọl na esemokwu nkọwa ya; “ọdịdị mmehie” ga-akọwa ihe okwu ahụ pụtara n’ụzọ pụrụ iche karịa ka ederede Grik si mee.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke “ibi” na nghọta sara mbara nke “anụ ahụ,” ebe e mere ahịrịokwu ikpeazụ ka ọ daa nke ọma n’Igbo.
