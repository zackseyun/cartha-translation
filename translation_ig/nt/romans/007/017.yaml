id: ROM.7.17
reference: Romans 7:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: ig
  text: Ma ugbu a, ọ bụghịzi m na-eme ya,[a] kama ọ bụ mmehie nke bi n’ime m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụghịzi m bụ onye na-eme ya, kama ọ bụ mmehie nke bi n’ime m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ma ugbu a
  rationale: Na-egosi mgbanwe nke nwere ma oge ma ntụnyere megidere ihe e kwuru tupu ya; nke a bụkwa okwu Igbo doro anya ma na-aga nke ọma.
- source_word: οὐκέτι
  choice: ọ bụghịzi
  rationale: Na-egosipụta na ihe ahụ abụghịzi otú ọ dịbu, ma na-echekwa ike nke nkwụsị ma ọ bụ ikewapụ onye ahụ n’omume ahụ.
- source_word: ἐγὼ
  choice: m
  rationale: Aha nnọchiaha ahụ pụtara ìhè na Grik, ya mere e debere ya n’usoro ‘ọ bụghịzi m’ iji chekwaa nkwusiri ike ya n’Igbo.
- source_word: κατεργάζομαι
  choice: na-eme
  rationale: N’ebe a, ngwaa ahụ na-ekwu maka imezu omume a na-ekwu maka ya; ‘na-eme’ bụ okwu nkịtị, doro anya, nke dabara n’Igbo.
- source_word: αὐτὸ
  choice: ya
  rationale: Na-atụ aka n’omume ahụ e kwurula n’amaokwu ndị bu ụzọ; ‘ya’ bụ ntụgharị Igbo kacha eke.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: mmehie nke bi n’ime m
  rationale: Na-echekwa onyonyo Pọl ji mee mmehie ka ihe dị ndụ nke bi n’ime mmadụ, ma na-ada nke ọma n’Igbo.
- source_word: οἰκοῦσα
  choice: nke bi
  rationale: ‘Bi’ na-echekwa echiche nke ịnọgide n’ime ebe dịka onye bi n’ụlọ, ọ bụghị naanị ịdị ebe ahụ nwa oge.
theological_decisions:
- issue: Ọdịiche Pọl mere n’etiti ‘m’ na ‘mmehie nke bi n’ime m’ nwere ike iyi ka ọ na-agbanahụ ibu ọrụ.
  choice: E debere ọdịiche ahụ kpọmkwem dịka ederede Grik si kwuo ya.
  alternative: Ịkọwagharị ya dịka naanị ọgụ dị n’ime mmadụ, ma ọ bụ ịgbakwunye nkọwa iji mesie ibu ọrụ onye ahụ ike.
  rationale: Amaokwu ahụ n’onwe ya na-ekwupụta ọdịiche a n’ụzọ siri ike; ntụgharị ekwesịghị idozi esemokwu nkà mmụta okpukpe ahụ ma ọ bụ tinye nkọwa na-adịghị na ederede.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘mmehie nke bi n’ime m’ chekwaa ihe atụ nke mmehie dịka ihe na-ebi n’ime mmadụ, na-enweghị ịkọwa esemokwu ahụ karịa ihe ederede kwuru.
