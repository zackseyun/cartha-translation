  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: ig
  text: Ya mere, iwu ahụ dị nsọ, iwu e nyere dịkwa nsọ, dịkwa ezi omume, dịkwa mma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a, n’ụzọ Igbo doro anya ma dịkwa eke.
- source_word: νόμος
  choice: iwu ahụ
  rationale: Na-edobe okwu Pọl n’ozuzu ya ma na-ahapụ ihe gbara amaokwu ahụ gburugburu igosi na ọ bụ Iwu Mosis ka a na-ekwu maka ya.
- source_word: ἅγιος
  choice: dị nsọ
  rationale: Ọ bụ okwu Igbo a na-ejikarị egosi ihe dị nsọ, ma na-eburu echiche nke ịdị ọcha na ịbụ nke e kewapụrụ nye Chineke.
- source_word: ἐντολή
  choice: ihe e nyere n’iwu ahụ
  rationale: Na-egosi otu iwu a kapịrị ọnụ dị n’ime Iwu ahụ, ma zere mgbagwoju anya nke iji naanị “iwu” mee ma νόμος ma ἐντολή.
- source_word: δικαία
  choice: ihe ziri ezi
  rationale: Na-egosipụta ikpe omume ọma e nyere iwu ahụ; ọ bụkwa okwu Igbo nkịtị, doro anya maka ihe kwekọrọ n’ezi omume na ikpe ziri ezi.
- source_word: ἀγαθή
  choice: ihe ọma
  rationale: Na-echekwa ma ịdị mma n’omume ma uru dị n’iwu ahụ, n’etinyeghị nkọwa karịrị okwu Grik.
- source_word: μὲν
  choice: anaghị atụgharị ya iche
  rationale: Ọ na-enye ntakịrị nkwusi ike n’okwu Grik, ma ebe δέ na-esoghị ya ebe a, nhazi ahịrịokwu Igbo na-eburu ike ahụ n’enweghị okwu ọzọ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma dị mfe nghọta. E jiri “iwu ahụ” na “ihe e nyere n’iwu ahụ” kewaa νόμος na ἐντολή nke ọma, n’enweghị ịkọwa karịa ihe isi mmalite kwuru.
