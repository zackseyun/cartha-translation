  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: ig
  text: Lee ka m si bụrụ onye nhụsianya! Ònye ga-anapụta m n’ahụ ọnwụ a?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka usoro okwu Grik si dị kpọmkwem karị, “ahụ nke ọnwụ a.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ga-azọpụta m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: nọ n’oké nhụsianya
  rationale: Nke a na-egosipụta oke ahụhụ na mwute dị n’okwu mkpu Pọl, ma zere okwu nwere ike ịpụta na ọ na-akpọ onwe ya onye ajọ omume.
- source_word: ἄνθρωπος
  choice: mmadụ
  rationale: “Mmadụ” bụ okwu Igbo nkịtị na nke kwesịrị ekwesị ebe onye na-ekwu okwu na-ezo aka n’onwe ya.
- source_word: τίς
  choice: Ònye
  rationale: Ajụjụ ahụ na-achọ onye ga-abịa napụta ya, ya mere “Ònye” na-edobe ụdị ajụjụ nke Grik.
- source_word: ῥύσεται
  choice: ga-anapụta
  rationale: “Napụta” na-egosi ịdọpụta mmadụ pụọ n’ihe ize ndụ ma ọ bụ n’agbụ, ma dịkwa ndụ n’Igbo nke oge a.
- source_word: ἐκ
  choice: n’…
  rationale: N’usoro okwu a, “n’ahụ” na-egosi ihe a ga-esi napụta onye ahụ pụọ na ya n’ụzọ Igbo si ekwu ya nke ọma.
- source_word: σώματος
  choice: ahụ
  rationale: A hapụrụ ihe oyiyi doro anya nke “ahụ” dịka ọ dị na Grik, kama ịkọwa ya n’ụzọ ga-ewepụ mgbagwoju anya ya.
- source_word: τοῦ θανάτου τούτου
  choice: ọnwụ a
  rationale: N’ime “ahụ ọnwụ a,” nhọrọ a na-eburu njikọ dị n’etiti ahụ na ọnwụ, ma na-eme ka okwu ahụ bụrụ nke a pụrụ ịghọta n’Igbo. Ihe odide ala peeji na-edobe usoro okwu Grik nke ka kpọmkwem.
theological_decisions:
- issue: Ma a ga-asụgharị nkebi ikpeazụ ahụ dịka usoro okwu Grik si dị kpọmkwem, ka a ga-asụ ya n’Igbo doro anya
  choice: ahụ ọnwụ a
  alternative: ahụ nke ọnwụ a
  rationale: “Ahụ ọnwụ a” na-agụ nke ọma n’Igbo ma na-edobe ihe oyiyi na esemokwu dị n’okwu ahụ. Ihe odide ala peeji na-enye usoro nke ka nso n’ụdị Grik, na-enweghị ikpebi kpọmkwem ihe “ahụ” na “ọnwụ” pụtara n’ozizi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke nwere nkwanye ùgwù ma dị mfe nghọta, mee ihe. “Lee ka m si bụrụ…” na-eburu ike mkpu ahụ; “n’oké nhụsianya” na-ezere ịgbanwe mwute ahụ ka ọ bụrụ ikpe omume. Akara [a] na [b] dị n’isiokwu ahụ ma kwekọọ n’ihe odide ala peeji.
