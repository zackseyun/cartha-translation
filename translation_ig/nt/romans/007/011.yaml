id: ROM.7.11
reference: Romans 7:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: ig
  text: N’ihi na mmehie[a] jiri iwu ahụ nweta ohere, ghọgburu m, jirikwa iwu ahụ[b] gbuo m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘mmehie, mgbe o nwetara ohere site n’iwu ahụ.’
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu a bụ ‘site na ya’; ‘ya’ na-ezo aka n’iwu ahụ.
    reason: pronoun_reference
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosipụta na amaokwu a na-akọwa ihe e kwuru tupu ya, n’ụzọ dị mma n’Igbo.
- source_word: ἁμαρτία
  choice: mmehie
  rationale: Ọ bụ okwu Igbo a na-ejikarị eme ihe maka ‘sin’; idowe ya dịka onye na-eme omume na-echekwa etu Pọl si mee ka mmehie yie ike dị ndụ.
- source_word: ἀφορμὴν λαβοῦσα
  choice: ebe o ... nweta ohere
  rationale: Na-egosipụta ịnara ma ọ bụ iji ohere mee ihe, ma na-asụkwa Igbo dị mfe ma bụrụ nke ebumpụta ụwa.
- source_word: διὰ τῆς ἐντολῆς
  choice: sitere n’iwu ahụ
  rationale: Na-echekwa echiche nke iwu ahụ ịbụ ụzọ mmehie si nweta ohere; otu aha ahụ dị n’otu n’ọnụọgụ.
- source_word: ἐξηπάτησέν
  choice: ghọgburu
  rationale: Na-enye echiche doro anya nke iduhie mmadụ n’ụzọ aghụghọ, na-enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: με
  choice: m
  rationale: Na-edowe onye a na-eme ihe n’ahụ ya kpọmkwem.
- source_word: δι’ αὐτῆς
  choice: sitekwa n’iwu ahụ
  rationale: N’Igbo, ikwughachi ‘iwu ahụ’ na-eme ka ihe nnọchiaha Grik na-ezo aka na ya doo anya ma na-echekwa echiche nke ụzọ e si mee ihe.
- source_word: ἀπέκτεινεν
  choice: gbuo
  rationale: Ọ bụ ntụgharị nkịtị, doro anya, nke ἀπέκτεινεν, na-echekwaghị ya ka okwu iwu ikpe pụrụ iche.
theological_decisions:
- issue: Ogo e ji mee mmehie ka ọ yie onye na-eme ihe
  choice: 'E mere mmehie ka ọ bụrụ onye na-eme omume ndị a: inweta ohere, ịghọgbu, na igbu.'
  alternative: Ime ka mmehie bụrụ naanị echiche ma ọ bụ ike na-enweghị omume doro anya.
  rationale: N’asụsụ Grik, mmehie bụ isiokwu nke omume atọ ndị a; ntụgharị a na-echekwa nkwupụta siri ike Pọl kwuru n’etinyeghị nkọwa ozizi ọzọ.
- issue: Ihe αὐτῆς na-ezo aka na ya
  choice: Kọwaa ya n’ahịrị dịka ‘iwu ahụ.’
  alternative: Jiri naanị ‘ya,’ nke nwere ike ime ka onye na-agụ Igbo chee na ọ na-ezo aka na mmehie.
  rationale: Ụdị nwanyị otu nke nnọchiaha Grik na-ezo aka na ἐντολή; ebe Igbo enweghị ụdị okike ahụ, ikwughachi aha ahụ na-ewepụ mgbagwoju anya n’agbanweghị ihe ọ pụtara.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma dị mfe nghọta. E ji ‘iwu ahụ’ mee ntụgharị nke ἐντολή n’otu n’ọnụọgụ, ma kwughachi ya na nkebi ikpeazụ ka ntụaka doo anya.
