revisions:
- from: N’ihi na mmehie[a], ebe o sitere n’iwu ahụ nweta ohere, ghọgburu m, sitekwa n’iwu ahụ[b] gbuo m.
  to: N’ihi na mmehie[a] jiri iwu ahụ nweta ohere, ghọgburu m, jirikwa iwu ahụ[b] gbuo m.
  rationale: The revised wording renders ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς as sin’s obtaining an opportunity by means of the commandment, while retaining sin as the active subject of deceiving and killing. The explicit repetition of ‘iwu ahụ’ faithfully clarifies the Greek pronoun for Igbo readers. Footnote a replaces an interpretive personification comment with a limited translation alternative; footnote b remains useful as an audit note for the Greek pronoun.
  reviewer_model: gpt-5.6-terra
