source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: ig
  text: Ma mụ onwe m nwụrụ, iwu ahụ nke bụ maka ndụ wee bụrụụrụ m maka ọnwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Iwu ahụ kpọmkwem, nke bụ maka ndụ, pụtaraara m maka ọnwụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: m nwụrụ
  rationale: 'Oge aorist nke ngwaa ahụ na-ekwu kpọmkwem ihe mere n’oge gara aga: “m nwụrụ,” ọ bụghị ọnọdụ na-aga n’ihu.'
- source_word: εὑρέθη μοι
  choice: wee bụrụụrụ m ihe
  rationale: Nke a na-egosipụta na n’ahụmahụ onye na-ekwu okwu, a chọpụtara ihe iwu ahụ ghọrọ nye ya, n’enweghị ntụgharị siri ike nke na-agaghị ada ka Igbo eke.
- source_word: ἐντολή
  choice: iwu ahụ
  rationale: “Iwu” bụ okwu Igbo doro anya ma kwesị ekwesị maka otu iwu e nyere; “ahụ” na-egosipụta na ọ bụ iwu ahụ a kpọtụrụla aha.
- source_word: ἡ εἰς ζωὴν
  choice: nke bụ maka ndụ
  rationale: 'Nke a na-edobe nghọta sara mbara nke εἰς: ihe e chere ihu ya ma ọ bụ ihe ọ ga-arụpụta, n’akọwaghị ya karịa ihe Grik kwuru.'
- source_word: αὕτη
  choice: iwu ahụ
  rationale: Ngosipụta αὕτη dị n’ime “ahụ,” nke na-arụ ọrụ n’ụzọ eke n’Igbo ma na-ezere ikwugharị okwu n’ụzọ siri ike.
- source_word: εἰς θάνατον
  choice: ihe na-eduga n’ọnwụ
  rationale: Nke a na-egosi nsonaazụ ahụ n’Igbo doro anya, ma na-ezere ịsị kpọmkwem na iwu ahụ “wetara” ọnwụ, nke nwere ike ịkọwa ihe kpatara ya karịa Grik.
theological_decisions:
- issue: Ma a ga-ekwu na iwu ahụ “wetara” ọnwụ ma si otú ahụ kọwaa ihe kpatara ọnwụ ahụ
  choice: “wee bụrụụrụ m ihe na-eduga n’ọnwụ”
  alternative: “wetara m ọnwụ”
  rationale: Nhọrọ ahụ na-edobe esemokwu dị n’etiti iwu nke bụ maka ndụ na nsonaazụ ọnwụ n’ahụmahụ Pọl, n’etinyeghị nkọwa ọzọ banyere otú iwu ahụ si kpatara ọnwụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ntụnyere dị n’etiti ndụ na ọnwụ ma ghara idozi esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ.
