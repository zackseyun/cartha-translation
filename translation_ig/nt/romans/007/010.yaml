    text: 'A pụkwara ịsụgharị ya: “Iwu ahụ kpọmkwem, nke bụ maka ndụ, pụtaraara m maka ọnwụ.”'
    reason: lexical_alternative
  revision_rationale: The revision retains the explicit first-person contrast and the past event “m nwụrụ.” It renders εὑρέθη μοι idiomatically with “wee bụrụụrụ m,” while preserving the Greek rhetorical parallel “maka ndụ ... maka ọnwụ” without explaining how the commandment relates to death. The alternative footnote represents the demonstrative emphasis of αὕτη without importing “given” or a stronger causal claim.
