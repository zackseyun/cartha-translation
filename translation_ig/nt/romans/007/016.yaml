id: ROM.7.16
reference: Romans 7:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: ig
  text: Ma ọ bụrụ na m na-eme ihe m na-achọghị ime, ana m ekwenye n’iwu ahụ na ọ dị mma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-edobe ọnọdụ nke εἰ na ntakịrị ntụgharị ma ọ bụ njikọ nke δέ n’Igbo dị mfe ma bụrụ nke e ji eme ihe ugbu a.
- source_word: ὃ … τοῦτο
  choice: ihe
  rationale: A sụgharịrị usoro njikọ a n’ụzọ Igbo si ekwu ya nke ọma, na-enweghị ikwughachi okwu n’ụzọ ga-ada arọ.
- source_word: θέλω
  choice: m na-achọghị
  rationale: ‘Ịchọ’ na-egosipụta ọchịchọ ime ihe nke onye ahụ, nke a na-atụnyere ihe ọ na-eme n’ezie.
- source_word: ποιῶ
  choice: m na-eme
  rationale: ‘Ime’ bụ okwu kwụ ọtọ nke kwekọrọ na ποιῶ ma na-egosipụta omume ahụ n’enweghị mgbakwunye nkọwa.
- source_word: σύμφημι
  choice: ana m ekwenye
  rationale: Nke a na-egosipụta ikweta ma ọ bụ iso mkpebi iwu ahụ kwekọọ, ọ bụghị naanị irubere iwu isi.
- source_word: τῷ νόμῳ
  choice: n’iwu ahụ
  rationale: Akara nrụtụ aka ahụ na-egosi iwu a maara ama; ‘ahụ’ na-eme ka nke a pụta ìhè n’Igbo, ebe ‘n’iwu’ na-esochi ngwaa ‘ekwenye’ n’ụzọ kwesịrị ekwesị.
- source_word: καλός
  choice: dị mma
  rationale: ‘Dị mma’ bụ nsụgharị kpọmkwem ma dị mfe nke na-egosipụta àgwà ọma nke iwu ahụ n’enweghị ịgbakwụnye echiche ọzọ.
theological_decisions:
- issue: Ma okwu Pọl ọ na-egosi na iwu ahụ n’onwe ya dị mma
  choice: E debere ya dịka ‘ana m ekwenye n’iwu ahụ na ọ dị mma.’
  alternative: ‘ana m ekweta na iwu ahụ ziri ezi’
  rationale: Nhọrọ a na-edobe nkwenye Pọl doro anya banyere ịdị mma nke iwu ahụ, ma ọ naghị akọwa karịa ihe ederede Grik kwuru ma ọ bụ wepụ esemokwu dị n’okwu gbara ya gburugburu.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu kwesịrị Akwụkwọ Nsọ. E debere mmeghachi omume nke onye mbụ na njikọ ọnọdụ nke amaokwu ahụ, n’enweghị okwu ụka pụrụ iche ma ọ bụ nkọwa agbakwunyere.
