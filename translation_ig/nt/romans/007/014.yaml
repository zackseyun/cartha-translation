source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: ig
  text: N’ihi na anyị maara na iwu ahụ bụ nke mmụọ[a]; ma mụ onwe m bụ onye anụ ahụ, e reela m[b] n’okpuru mmehie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nke Mmụọ Nsọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e rerela m dị ka ohu n’okpuru mmehie,” ya bụ, n’okpuru ike ọchịchị mmehie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: anyị maara
  rationale: Ọ na-egosi ihe Pọl na ndị ọ na-agwa maara nke ọma; nke a bụ nsụgharị Igbo doro anya ma bụrụkwa nke e ji ekwu okwu n'ụzọ ebumpụta ụwa.
- source_word: ὁ νόμος
  choice: iwu ahụ
  rationale: Ọ na-edobe okwu Grik ahụ n’enweghị ịkọwapụta n’ahịrịokwu bụ́ kpọmkwem iwu Mosis, ọ bụ ezie na gburugburu akwụkwọ Ndị Rom na-akwado nghọta ahụ.
- source_word: πνευματικός
  choice: nke mmụọ
  rationale: Ọ na-echekwa ọdịiche dị n’etiti ihe bụ nke mmụọ na ihe bụ nke anụ ahụ, ma na-ahapụ ihe mgbagwoju anya dị na Grik banyere ma ọ bụ Mmụọ Nsọ ka a na-ezo aka kpọmkwem.
- source_word: σάρκινός
  choice: onye anụ ahụ
  rationale: Ọ na-echekwa asụsụ ‘anụ ahụ’ na njikọ ya na σάρξ, kama ịgbasa ya ozugbo ka ọ bụrụ ‘onye mmehie’ ma ọ bụ ‘onye nwere ọdịdị mmehie.’
- source_word: πεπραμένος
  choice: onye e rere
  rationale: Ụdị participle perfect passive na-egosi ọnọdụ sitere n’ịbụ onye e rere; okwu a na-echekwa ihe atụ ahịa/ịgba ohu dị na Grik.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: n’okpuru mmehie
  rationale: Ọ na-agbasochi okwu Grik anya ma na-echekwa echiche nke ịnọ n’okpuru ọchịchị mmehie n’enweghị ịgbasa ya nke ukwuu n’ahịrịokwu bụ isi.
theological_decisions:
- issue: Otu a ga-esi ghọta okwu Pọl banyere anụ ahụ
  choice: E ji “onye anụ ahụ” mee ihe n’ahịrịokwu bụ isi.
  alternative: onye mmehie; onye nwere ọdịdị mmehie; onye na-abụghị nke mmụọ
  rationale: Nhọrọ a na-echekwa esemokwu dị n’etiti πνευματικός na σάρκινος ma ghara ịmanye nkọwa ozizi e mesịrị n’ime okwu Pọl.
- issue: Ma πνευματικός na-ezo aka kpọmkwem na Mmụọ Nsọ
  choice: nke mmụọ
  alternative: nke Mmụọ Nsọ
  rationale: Grik nwere ike igosi ihe nwere agwa ma ọ bụ mpaghara nke mmụọ, ma ọ bụ ihe metụtara Mmụọ Nsọ; nsụgharị bụ isi ekwesịghị idozi mgbagwoju anya ahụ n’amaghị ama.
- issue: Ike ihe atụ nke ịbụ onye e rere
  choice: onye e rere n’okpuru mmehie
  alternative: onye e rere dị ka ohu n’okpuru ọchịchị mmehie
  rationale: Ahịrịokwu bụ isi na-edobe ihe atụ Grik nkenke; nkọwa ala peeji na-eme ka echiche ịgba ohu na ọchịchị mmehie pụta ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. A họọrọ “nke mmụọ” na “onye anụ ahụ” iji chekwaa ọdịiche okwu Grik, ebe akara ala peeji na-akọwa nhọrọ ndị nwere ike ịdị n’enweghị itinye nkọwa otu ụka n’ahịrịokwu bụ isi.
