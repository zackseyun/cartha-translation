id: ROM.7.25
reference: Romans 7:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: ig
  text: Ekele dịrị Chineke site n’aka Jizọs, bụ Mesaya[a], Onyenwe anyị! Ya mere, mụ onwe m ji uche m na-ejere iwu Chineke ozi, ma n’anụ ahụ m[b], ana m ejere iwu mmehie[c] ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Greek: “Jizọs Kraịst Onyenwe anyị.” N’ebe a, “Mesaya” na-egosipụta Χριστός dị ka aha-ọkwa.'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọdịdị mmehie m”; Greek kwuru “anụ ahụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ụkpụrụ mmehie.”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Ekele dịrị Chineke
  rationale: N’ụdị mkpu a, χάρις ya na τῷ θεῷ bụ okwu e ji ekele Chineke, ọ bụghị nkọwa banyere amara dị ka onyinye.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: site n’aka Jizọs, bụ Mesaya
  rationale: διά ya na genitive na-egosi onye e si n’aka ya mee ihe; ‘site n’aka’ bụ ụzọ Igbo nkịtị si kwuo nke a. A sụgharịrị Χριστός dị ka aha-ọkwa ‘Mesaya.’
- source_word: τοῦ κυρίου ἡμῶν
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo doro anya ma guzosie ike maka ‘our Lord.’
- source_word: Ἄρα οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nchịkọta na nkwubi okwu sitere n’ihe e kwuru tupu ya.
- source_word: αὐτὸς ἐγώ
  choice: mụ onwe m
  rationale: Ọ na-edobe nkwusi ike dị na Greek n’ahụ onye na-ekwu okwu.
- source_word: νοῒ
  choice: uche m
  rationale: ‘Uche’ na-anọchi ikike ime echiche na nghọta, nke a na-atụnyere anụ ahụ n’amaokwu a.
- source_word: δουλεύω
  choice: na-ejere … ozi
  rationale: Ọ na-egosi ịnọ n’okpuru ma na-eje ozi; usoro a bụ Igbo dị mma ma na-arụ ọrụ n’ahịrịokwu abụọ yiri ibe ha.
- source_word: νόμῳ θεοῦ
  choice: iwu Chineke
  rationale: ‘Iwu’ na-edobe νόμος ma na-aga n’ihu na arụmụka Pọl n’isi nke asaa.
- source_word: σαρκὶ
  choice: n’anụ ahụ m
  rationale: ‘Anụ ahụ’ na-edobe okwu ihe oyiyi Pọl ma ghara ịkọwa ya ozugbo dị ka ‘ọdịdị mmehie,’ nke ga-emechi esemokwu echiche dị na Greek.
- source_word: νόμῳ ἁμαρτίας
  choice: iwu mmehie
  rationale: Iji ‘iwu’ ọzọ na-edobe nkwughachi νόμος na ntụnyere ya na ‘iwu Chineke.’
theological_decisions:
- issue: Ihe σάρξ pụtara n’ebe a
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: Greek kwuru σάρξ, ọ bụghị okwu doro anya pụtara ‘ọdịdị mmehie.’ ‘Anụ ahụ’ na-ahapụ esemokwu Pọl n’etiti uche na anụ ahụ ka ọ dị.
- issue: Ma νόμος na nkebi ikpeazụ ọ bụ iwu nkịtị ka ọ bụ ụkpụrụ na-achị
  choice: iwu mmehie
  alternative: ụkpụrụ mmehie
  rationale: ‘Iwu’ na-edobe otu okwu Greek ahụ e ji kwuo ‘iwu Chineke,’ ebe ‘ụkpụrụ’ ga-abụ nkọwa karịa nsụgharị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. Usoro ahịrịokwu abụọ yiri ibe ha na-edobe ntụnyere dị n’etiti uche/iwu Chineke na anụ ahụ/iwu mmehie.
