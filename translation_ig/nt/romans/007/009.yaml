source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: ig
  text: Ma adị m ndụ na mbụ n’enweghị Iwu ahụ; ma mgbe iwu e nyere bịara, mmehie dịghachiri ndụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmehie malitere ịdị ndụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔζων
  choice: dịbu ndụ
  rationale: Nke a na-egosipụta ọnọdụ nke ‘ịdị ndụ,’ ọ bụghị naanị ibi ndụ, ma na-edobekwa ọdịiche dị n’etiti ndụ na ọnwụ n’amaokwu ndị gbara ya gburugburu.
- source_word: χωρὶς νόμου
  choice: mgbe m na-enweghị Iwu ahụ
  rationale: Ọ na-enye echiche nkewa dị na χωρίς n’Igbo doro anya. ‘Iwu ahụ’ na-egosi na o yikarịrị ka Pọl na-ekwu banyere Iwu Mozis, n’agbanyeghị na amaokwu a naanị ya akọwaghị okwu ahụ niile.
- source_word: ποτέ
  choice: dịbu
  rationale: Mgbakwunye ‘-bu’ na-egosi oge gara aga—‘n’otu oge’ ma ọ bụ ‘na mbụ’—n’ụzọ Igbo dị mkpirikpi ma bụrụkwa ihe a na-aghọta ngwa ngwa.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: mgbe ihe ahụ e nyere n’iwu bịara
  rationale: E doziri genitive absolute ahụ ka ọ bụrụ ahịrịokwu oge nke na-ada nke ọma n’Igbo, ebe a ka na-echekwa ihe oyiyi nke iwu ahụ ‘ịbịa.’
- source_word: ἐντολῆς
  choice: ihe ahụ e nyere n’iwu
  rationale: Nke a na-ekewapụ otu iwu e nyere n’iwu n’Iwu ahụ n’ozuzu ya, ma na-ezere iji otu okwu ahụ mee ka νόμος na ἐντολή yie nnọọ otu ihe.
- source_word: ἁμαρτία
  choice: mmehie
  rationale: E debere ya n’otu aha dịka onye a na-eme ka à ga-asị na ọ dị ndụ, dịka Pọl si eji ya ebe a.
- source_word: ἀνέζησεν
  choice: malitere ịdị ndụ
  rationale: Nke a na-echekwa ihe oyiyi nke mmehie ịbata ná ndụ n’asụsụ Igbo dị mfe. Nkọwa ‘dịghachiri ndụ’ ka dị ka ụzọ ọzọ n’ihi ike nke ἀνά-.
theological_decisions:
- issue: Ma okwu Pọl ò bụ akụkọ banyere onwe ya kpọmkwem, nnọchianya Izrel ma ọ bụ mmadụ niile, ka ọ bụ nkọwa banyere akụkọ nzọpụta
  choice: E debere onye mbụ, ‘Mụ onwe m,’ n’enweghị nkọwa agbakwunyere.
  alternative: A pụrụ ịkọwa ya kpọmkwem dịka ahụmahụ Pọl, ma ọ bụ dịka okwu nnọchianya nke Izrel ma ọ bụ mmadụ nọ n’okpuru Iwu.
  rationale: Amaokwu Grik a naanị ya anaghị ekpebi esemokwu ahụ; ya mere nsụgharị ahụ anaghị etinye otu nkọwa ozizi n’ime ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji ‘Iwu ahụ’ maka νόμος, ma jiri ‘ihe ahụ e nyere n’iwu’ maka ἐντολή ka ọdịiche ha ghara ịla n’iyi. Akara nkọwa ụkwụ [a] dị ozugbo n’akụkụ okwu ọ na-akọwa.
