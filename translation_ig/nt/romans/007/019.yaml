  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: ig
  text: N’ihi na ezi ihe ahụ m chọrọ ime, anaghị m eme ya; kama ajọ ihe ahụ m na-achọghị ime, ọ bụ ya ka m na-eme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “na-eme” n’ikpeazụ (πράσσω) dị iche na nke a sụgharịrị “eme” na mbụ (ποιῶ), ọ bụ ezie na ihe ha pụtara na-adakọrịta nke ukwuu.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: chọrọ
  rationale: “Chọrọ” bụ okwu Igbo dị mfe ma bụrụ nke a na-ejikarị egosipụta ihe mmadụ chọrọ ma ọ bụ kpebisiri ike ime; ọ dabara ugboro abụọ n’amaokwu a.
- source_word: ποιῶ
  choice: eme
  rationale: '“Ime” bụ ntụgharị nkịtị na nke sara mbara maka ποιέω, ma ọ dabara nke ọma n’usoro okwu a: “ezi ihe ahụ m chọrọ ime, anaghị m eme ya.”'
- source_word: ἀγαθόν
  choice: ezi ihe
  rationale: “Ezi ihe” na-egosi ihe ọma n’ụzọ omume, ma na-emepụta ọdịiche doro anya na “ajọ ihe.”
- source_word: κακὸν
  choice: ajọ ihe
  rationale: “Ajọ ihe” na-echekwa ịdị arọ nke ọdịiche omume dị n’etiti ἀγαθόν na κακόν, kama ime ka ọ bụrụ naanị ihe na-adịghị mma.
- source_word: πράσσω
  choice: na-eme mgbe niile
  rationale: N’ebe a πράσσω pụtara ime ma ọ bụ na-eme omume ahụ; “na-eme mgbe niile” na-enyere aka ịmata ya iche na ποιῶ, n’agbanyeghị na ihe okwu abụọ ahụ pụtara na-adakọrịta nke ukwuu.
- source_word: τοῦτο
  choice: ọ bụ ya
  rationale: “Ọ bụ ya” na-echekwa nkwusi ike nke τοῦτο, nke na-atụ aka kpọmkwem n’ajọ ihe ahụ onye na-ekwu okwu na-achọghị ime.
- source_word: οὐ γὰρ
  choice: N’ihi na ... anaghị
  rationale: “N’ihi na” na-echekwa ọrụ nkọwa nke γάρ ma jikọta amaokwu a na arụmụka gbara ya gburugburu.
theological_decisions:
- issue: Ma a ga-eme ka ọdịiche omume Pọl kwuru ghara ịdị ike
  choice: E chekwara “ezi ihe” na “ajọ ihe” dị ka ụdị omume nwere ibu.
  alternative: ihe ziri ezi / ihe na-ezighị ezi; ihe ọma / ihe ọjọọ
  rationale: ἀγαθόν na κακόν nwere ọdịiche omume siri ike n’ebe a; ekwesịghị ime ka ọ bụrụ naanị ihe bara uru ma ọ bụ ihe na-abaghị uru.
- issue: Ma a ga-akọwa onye “m” ahụ bụ n’ime ntụgharị
  choice: E debere onye mbụ “m” n’enweghị nkọwa ọzọ.
  alternative: Ịkọwa ya dị ka Pọl tupu okwukwe, Pọl dịka onye kwere ekwe, ma ọ bụ mmadụ n’ozuzu ya
  rationale: Amaokwu ahụ n’onwe ya ekpebighị esemokwu nkọwa a; ntụgharị ekwesịghị itinye otu echiche nkà mmụta okpukpe n’ime ederede.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji usoro yiri ibe ya—“ezi ihe” na “ajọ ihe”—chekwaa ọdịiche nke Grik. Akara nkọwa ala ala peeji [a] dị n’ederede isi.
