    issue: The phrase “mgbe niile” adds an unexpressed meaning.
    rationale: πράσσω is present tense and may depict ongoing conduct in context, but it does not itself mean “always.” Adding explicit frequency overstates the Greek.
  - severity: low
    issue: The footnote labels the identical main rendering as an alternative.
    rationale: Once “mgbe niile” is removed, the note should simply explain that πράσσω differs from the earlier ποιῶ while their meanings substantially overlap.
