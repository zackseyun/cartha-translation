revisions:
- from: N’ihi na iwu kekọtara nwanyị lụrụ di na di ya mgbe di ahụ ka dị ndụ; ma ọ bụrụ na di ahụ anwụọ[a], a tọhapụla ya n’iwu nke kekọtara ya na di ya.
  to: N’ihi na nwanyị lụrụ di ka iwu kekọtaworo na di ya mgbe di ya dị ndụ; ma ọ bụrụ na di ahụ anwụọ[a], a tọhapụla ya n’iwu nke kekọtara ya na di ya.
  rationale: The revision retains the draft’s clear explanation of the marital legal bond, while bringing the woman’s state of being bound into the foreground, as in the Greek perfect passive δέδεται. It also makes the footnote idiomatic without altering its lexical guidance.
