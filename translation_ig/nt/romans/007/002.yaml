id: ROM.7.2
reference: Romans 7:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: ig
  text: N’ihi na nwanyị lụrụ di ka iwu kekọtaworo na di ya mgbe di ya dị ndụ; ma ọ bụrụ na di ahụ anwụọ[a], a tọhapụla ya n’iwu nke kekọtara ya na di ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “o nweere onwe ya pụọ n’iwu di ya”; o yikarịrị ka okwu Grik ahụ pụtara njikọ iwu nke kekọtara ya na di ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: nwanyị lụrụ di
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ n’echiche nwanyị nọ n’agbụ alụmdi na nwunye.
- source_word: τῷ ζῶντι ἀνδρί
  choice: na di ya mgbe di ahụ ka dị ndụ
  rationale: Ọ na-egosipụta njikọ ya na di ya ma mee ka ọnọdụ bụ́ na di ahụ ka dị ndụ pụta ìhè n’Igbo nkịtị.
- source_word: δέδεται
  choice: kekọtara
  rationale: Ọ na-egosipụta ọnọdụ dị ugbu a nke sitere n’omume e mere nke kekọtara onye ahụ; ntụgharị a na-echekwa ihe perfect passive pụtara.
- source_word: νόμῳ
  choice: iwu
  rationale: A ghọtara ya dị ka ụkpụrụ iwu metụtara alụmdi na nwunye, ọ bụghị dị ka nrụtụ aka doro anya n’Iwu Mosis.
- source_word: κατήργηται
  choice: a tọhapụla ya
  rationale: Ọ na-egosipụta na ike ma ọ bụ ibu ọrụ iwu ahụ adịghịzi emetụta ya, ma na-echekwa mmetụta perfect passive.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: n’iwu nke kekọtara ya na di ya
  rationale: Genitive Grik ahụ dị mkpụmkpụ ma nwee ike ịpụta n’ụzọ dị iche; okwu a na-akọwa njikọ iwu metụtara di ahụ n’enweghị ime ka ọ dị ka di bụ onye nyere iwu ahụ.
theological_decisions:
- issue: Ma νόμῳ / τοῦ νόμου ọ̀ na-ezo kpọmkwem n’Iwu Mosis ka ọ bụ n’agbụ iwu nke alụmdi na nwunye n’ozuzu
  choice: ụkpụrụ iwu nke alụmdi na nwunye n’ozuzu
  alternative: Iwu Mosis dịka o si metụta alụmdi na nwunye
  rationale: Ọnọdụ okwu ahụ bụ ihe atụ nke alụmdi na nwunye banyere otú ọnwụ si akwụsị njikọ iwu; enweghị article na νόμῳ na-akwado nghọta izugbe a, n’agbanyeghị na okwu ahụ ka nwere njikọ na mkparịta ụka Pọl banyere iwu.
- issue: Otu a ga-esi ghọta τοῦ νόμου τοῦ ἀνδρός
  choice: iwu nke kekọtara nwanyị ahụ na di ya
  alternative: iwu di ya ma ọ bụ iwu gbasara di ya
  rationale: Nke a na-ezere echiche na di bụ onye omebe iwu, ma na-egosipụta njikọ iwu alụmdi na nwunye nke ọnwụ ya kwụsịrị.
translation_notes:
  register: Ejiri Igbo Izugbe nke dị ugbu a, kwụ ọtọ ma nwee nsọpụrụ. “Nwanyị lụrụ di” bụ okwu nkịtị ma doo anya; “iwu nke kekọtara ya na di ya” na-eme ka okwu iwu ahụ ghọta nke ọma n’enweghị itinye nkọwa ụka pụrụ iche.
