    text: Ma ọ bụ, “o nweere onwe ya pụọ n’iwu di ya”; o yikarịrị ka okwu Grik ahụ pụtara njikọ iwu nke kekọtara ya na di ya.
    reason: lexical_alternative
  revision_rationale: The revision retains the draft’s clear explanation of the marital legal bond, while bringing the woman’s state of being bound into the foreground, as in the Greek perfect passive δέδεται. It also makes the footnote idiomatic without altering its lexical guidance.
