review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the marriage-law analogy, the husband's continued life as the condition of the bond, and release upon his death. However, beginning with “iwu kekọtara...” makes the law the overt agent and slightly weakens the Greek focus on the woman’s present legally bound state. The final explanatory wording is sound but can be retained with more natural syntax.
  naturalness: “Nwanyị lụrụ di” and “a tọhapụla ya” are clear Standard Igbo. “Nwanyị lụrụ di ka iwu kekọtaworo na di ya” more naturally expresses a woman who stands bound by law to her husband. The footnote’s “ọ̀ pụtara” is not idiomatic in this declarative indirect statement; “pụtara” is preferable.
  terminology: “Iwu” appropriately represents νόμος in its general legal-marital sense. “Iwu nke kekọtara ya na di ya” responsibly explains the compressed Greek genitive without implying that the husband is the lawgiver. No doctrinally loaded terminology is introduced.
  issues:
  - severity: medium
    issue: The first clause foregrounds the law as actor rather than the woman as legally bound.
    rationale: Greek ἡ ... γυνὴ ... δέδεται νόμῳ has the married woman as subject and presents her as in a continuing state of legal bond. Recasting the sentence preserves this emphasis while remaining idiomatic.
  - severity: low
    issue: The footnote contains an unnecessary interrogative particle in “ọ̀ pụtara.”
    rationale: The note makes an assertion about likely meaning, not a direct question; “o yikarịrị ka okwu Grik ahụ pụtara...” is standard and clear.
  revised_text: N’ihi na nwanyị lụrụ di ka iwu kekọtaworo na di ya mgbe di ya dị ndụ; ma ọ bụrụ na di ahụ anwụọ[a], a tọhapụla ya n’iwu nke kekọtara ya na di ya.
  revised_footnotes:
