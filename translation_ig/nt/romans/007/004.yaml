id: ROM.7.4
reference: Romans 7:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: ig
  text: Ya mere, ụmụnna m[a], e mere ka unu nwụọ n’ihe gbasara iwu ahụ site n’ahụ Mezaịa ahụ[b], ka unu wee bụrụ nke onye ọzọ[c]—ya bụ, nke onye ahụ e mere ka o si n’ọnwụ bilie—ka anyị wee mịpụta mkpụrụ maka Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụmụnna m ndị nwoke na ndị nwanyị”; okwu Grik a sụgharịrị “ụmụnna” nwere ike ịkpọ ndị nwoke na ndị nwanyị ọnụ.
    reason: lexical_alternative
  - marker: b
    text: 'Grik: Christou. E ji “Mezaịa” sụgharịa ya ebe a n’ihi na ihe aha ọkwa ahụ pụtara pụtara ìhè. Nhọrọ ọzọ bụ “Kraịst.”'
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ nkịtị: “ka unu wee bụrụ nke onye ọzọ.” Okwu a na-aga n’ihu n’ihe atụ alụmdi na nwunye dị n’amaokwu ndị bu ụzọ.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: Ya mere
  rationale: Ọ na-egosi ihe e si n’ihe atụ dị n’amaokwu ndị bu ụzọ kwubie, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἀδελφοί μου
  choice: ụmụnna m
  rationale: Ọ na-edobe ụdị okwu ịkpọ ndị a na-agwa okwu nke Grik, ebe “ụmụnna” pụkwara ịgụnye ndị nwoke na ndị nwanyị n’ọgbakọ.
- source_word: ἐθανατώθητε
  choice: e mekwara ka unu nwụọ
  rationale: Nke a na-edobe olu nnara nke ngwaa Grik, kama ịsụgharị ya naanị dịka “unu nwụrụ.”
- source_word: τῷ νόμῳ
  choice: n’ebe iwu ahụ dị
  rationale: Ọ na-egosi na ọnwụ ahụ metụtara njikọ ha na iwu ahụ, n’agbanyeghị na Grik ekwughị kpọmkwem “ịpụ n’okpuru iwu.”
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: site n’ahụ Mezaịa ahụ
  rationale: “Site na” na-egosi ụzọ e si mee ihe, ebe “ahụ” na-edobe ntụaka doro anya nye ọnwụ anụ ahụ nke Mezaịa.
- source_word: Χριστοῦ
  choice: Mezaịa
  rationale: N’ebe a, okwu ahụ ka bụ aha ọkwa nke Onye E Tere Mmanụ, ya mere “Mezaịa” na-eme ka ihe aha ọkwa ahụ pụtara pụta ìhè.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: ka unu wee bụrụ nke onye ọzọ
  rationale: Ọ na-edobe okwu mmekọrịta na ihe atụ alụmdi na nwunye nke gbara amaokwu a gburugburu, na-agbakwụghị nkọwa ọzọ n’ime ederede.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: nke onye ahụ e si ná ndị nwụrụ anwụ kpọlitee
  rationale: Ọ na-edobe olu nnara nke mbilite n’ọnwụ na echiche nke isi n’etiti ndị nwụrụ anwụ bilie.
- source_word: ἵνα καρποφορήσωμεν
  choice: ka anyị wee mịara ... mkpụrụ
  rationale: Ọ na-edobe ihe atụ nke ịmị mkpụrụ nakwa mgbanwe onye Grik mere site na “unu” gaa na “anyị.”
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: N’usoro “mịara Chineke mkpụrụ,” Igbo na-egosi na mkpụrụ ahụ bụ maka Chineke n’ụzọ dị mfe ma kwekọọ n’okwu Grik.
theological_decisions:
- issue: Otu e si sụgharị Χριστοῦ n’okwu Pọl
  choice: Mezaịa
  alternative: Kraịst
  rationale: Aha ọkwa ahụ metụtara Onye E Tere Mmanụ, ọ bụghị naanị aha onwe; “Mezaịa” na-echekwa nkọwa ahụ n’ebe a.
- issue: Ichekwa ihe atụ mmekọrịta/alụmdi na nwunye dị na εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: ka unu wee bụrụ nke onye ọzọ
  alternative: ka e jikọta unu na onye ọzọ
  rationale: Nhọrọ a na-edobe ihe okwu Grik kwuru banyere ịbụ nke onye ọzọ ma hapụ ka ihe atụ alụmdi na nwunye nke amaokwu ndị bu ụzọ kọwaa ya, kama idozi esemokwu ahụ n’ụzọ nkọwa.
- issue: Olu nnara n’okwu mbilite n’ọnwụ
  choice: onye ahụ e si ná ndị nwụrụ anwụ kpọlitee
  alternative: onye si ná ndị nwụrụ anwụ bilie
  rationale: Nhọrọ a na-edobe olu nnara nke ἐγερθέντι ma ghara ịgbanwe ya ka ọ bụrụ na onye ahụ ji aka ya bilie.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe okwu ihe atụ nke ọnwụ, ịbụ nke onye ọzọ, na ịmị mkpụrụ; o dokwara mgbanwe sitere na “unu” gaa na “anyị” anya.
