id: ROM.7.20
reference: Romans 7:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: ig
  text: Ma ọ bụrụ na m na-eme ihe m na-achọghị ime, ọ bụghịzi mụ onwe m na-arụ ya[a], kama ọ bụ mmehie bi n’ime m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-eme ya.”
    reason: κατεργάζομαι nwere ike ịpụta nanị “ime,” ọ bụ ezie na “ịrụ” na-enyere aka iche ya na ποιῶ dị n’ahịrịokwu mbụ.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Na-egosi ọnọdụ nwere ntakịrị ntụgharị megide ihe e kwuru tupu ya, ma na-ada nke ọma n’Igbo.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: m na-eme ihe m na-achọghị ime
  rationale: Na-echekwa njikọ dị n’etiti ihe Pọl na-achọghị ime na ihe ọ na-eme, n’asụsụ Igbo doro anya.
- source_word: οὐκέτι ἐγὼ
  choice: ọ bụghịzi mụ onwe m
  rationale: “Ọ bụghịzi” na-enye echiche οὐκέτι, ebe “mụ onwe m” na-echekwa nkwusi ike nke nnọchiaha ἐγώ.
- source_word: κατεργάζομαι αὐτό
  choice: na-arụ ya
  rationale: “Na-arụ ya” na-egosi imezu ma ọ bụ iweta ihe ahụ, ma na-enyekwa obere ọdịiche n’etiti κατεργάζομαι na ποιῶ e ji “na-eme” sụgharịa.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: mmehie bi n’ime m
  rationale: Na-edobe mmehie dị ka ihe e mere ka ọ dị ka onye bi n’ime mmadụ, n’ebughị ụzọ kọwaa ya dị ka “ọdịdị mmehie.”
theological_decisions:
- issue: Ma a ga-eme ka okwu Pọl belata ọrụ onwe onye, ma ọ bụ kọwaa “mmehie” dị ka naanị echiche efu.
  choice: E debere ọdịiche Pọl kwuru n’etiti “mụ onwe m” na “mmehie bi n’ime m” n’enweghị nkọwa agbakwunyere.
  alternative: Ịsụgharị ya dị ka “ọdịdị mmehie m” ma ọ bụ ịgbakwunye nkọwa ga-edozi ihe Pọl pụtara.
  rationale: Grik kwuru ἁμαρτία, “mmehie,” ọ bụghị σάρξ, “anụ ahụ”; ya mere ntụgharị ahụ kwesịrị ichekwa esemokwu nke okwu Pọl kama idozi ajụjụ nkà mmụta okpukpe ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. E ji “mụ onwe m” chekwaa nkwusi ike nke ἐγώ, ma e debere “mmehie bi n’ime m” n’ụdị dị mkpirikpi iji chekwaa ihe atụ nke mmehie dịka onye bi n’ime mmadụ.
