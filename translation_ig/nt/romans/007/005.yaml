  to: N’ihi na mgbe anyị nọ n’anụ ahụ[a], ọchịchọ mmehie[b] ndị sitere n’iwu ahụ nọ na-arụ ọrụ n’akụkụ ahụ anyị[c], ka ha wee mịta mkpụrụ maka ọnwụ.
  rationale: E degharịala naanị akụkụ na nkọwa ala ndị chọrọ mmezi. “mịta mkpụrụ maka ọnwụ” na-enye nsụgharị Igbo eke nke idiom Gris ahụ n’enweghị ịgbakwunye nkọwa gbasara otú iwu si arụ ọrụ. E chekwawo “anụ ahụ,” “ọchịchọ mmehie,” na “ndị sitere n’iwu ahụ” iji debe ambiguity na register nke isi ederede.
