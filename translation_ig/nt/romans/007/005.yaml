id: ROM.7.5
reference: Romans 7:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: ig
  text: N’ihi na mgbe anyị nọ n’anụ ahụ[a], ọchịchọ mmehie[b] ndị sitere n’iwu ahụ nọ na-arụ ọrụ n’akụkụ ahụ anyị[c], ka ha wee mịta mkpụrụ maka ọnwụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ọdịdị mmehie”; ma ọ bụ “n’ọnọdụ mmadụ anyị dara ada.”
    reason: alternative_reading
  - marker: b
    text: 'N’ụzọ okwu si dị kpọmkwem: “ọchịchọ nke mmehie.”'
    reason: lexical_alternative
  - marker: c
    text: “Akụkụ ahụ anyị” pụtara akụkụ ahụ ma ọ bụ ikike dị iche iche nke mmadụ, ndị a pụrụ iji mee omume.
    reason: cultural_note
lexical_decisions:
- source_word: σάρξ
  choice: anụ ahụ
  rationale: Ọ bụ okwu Igbo doro anya nke na-echekwa ihe atụ Pọl ji mee ihe nakwa esemokwu dị n’etiti anụ ahụ na Mmụọ, kama ịkọwa ya ozugbo dịka ‘ọdịdị mmehie.’
- source_word: παθήματα τῶν ἁμαρτιῶν
  choice: ọchịchọ mmehie
  rationale: N’ebe a, παθήματα pụtara mkpali ma ọ bụ agụụ na-akpali mmadụ ime mmehie; nsụgharị a na-asụ Igbo nke ọma ma na-egosi na mmehie na-akọwa ụdị ọchịchọ ndị ahụ.
- source_word: διὰ τοῦ νόμου
  choice: ndị sitere n’iwu ahụ
  rationale: Nke a na-echekwa njikọ nkọwa okwu Grik ahụ na ‘ọchịchọ mmehie’ na ike διὰ nke nwere ike igosi ụzọ ma ọ bụ ihe sitere na ya, n’agbanyeghị na ọ naghị ekwu hoo haa na iwu ahụ kpalitere ha.
- source_word: ἐνηργεῖτο
  choice: nọ na-arụ ọrụ
  rationale: Ọ na-egosipụta omume gara n’ihu n’oge gara aga nke imperfect ahụ na-egosi.
- source_word: μέλεσιν
  choice: akụkụ ahụ anyị
  rationale: Ọ bụ Igbo nkịtị ma doo anya karịa iburu okwu Bekee ‘members’; ọ na-egosi akụkụ ahụ ma na-ahapụkwa echiche na ha bụ ngwa e ji eme omume.
- source_word: καρποφορῆσαι τῷ θανάτῳ
  choice: ka ha wee mịara ọnwụ mkpụrụ
  rationale: Ọ na-echekwa ihe atụ nke ịmị mkpụrụ na dative nke na-eduga mkpụrụ ahụ n’ọnwụ ma ọ bụ na-eme ka ọ bụrụ nke ọnwụ.
theological_decisions:
- issue: Ma a ga-akọwa ἐν τῇ σαρκί dịka ‘n’ọdịdị mmehie’ ma ọ bụ chekwaa okwu anụ ahụ
  choice: n’anụ ahụ
  alternative: n’ọdịdị mmehie anyị / n’ọnọdụ mmadụ anyị nke mmehie merụrụ
  rationale: Isiokwu ahụ na-echekwa okwu na ihe atụ Pọl ji mee ihe, ka a ghara ikpebi otu nkọwa gbasara ọnọdụ mmadụ ebe okwu ahụ ka nwere ibu na mgbagwoju anya n’echiche Pọl.
- issue: Ụdị njikọ dị n’etiti ọchịchọ mmehie na iwu ahụ
  choice: ndị sitere n’iwu ahụ
  alternative: ndị iwu ahụ kpalitere
  rationale: διὰ τοῦ νόμου na-egosi na iwu ahụ bụ ụzọ ma ọ bụ ihe metụtara ịdị irè nke ọchịchọ ndị ahụ, ma ‘kpalitere’ ga-agbakwunye nkọwa kpatara ihe karịa ihe ahịrịokwu ahụ kwuru hoo haa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ‘anụ ahụ’ iji chekwaa ihe atụ na esemokwu nkà mmụta okpukpe dị na σάρξ; e jiri ‘akụkụ ahụ anyị’ dochie nsụgharị nkịtị na-adịghị adịkarị n’Igbo. Akara nkọwa ala ala [a], [b], na [c] niile dị n’isiokwu.
