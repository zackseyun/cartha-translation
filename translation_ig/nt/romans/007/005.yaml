  verdict: revise
  source_fidelity: 'Isi nsụgharị ahụ na-esochi usoro na isi okwu Gris nke ọma: ọnọdụ gara aga (“mgbe anyị nọ”), “anụ ahụ,” ọchịchọ ndị mmehie, njikọ ha na iwu, ọrụ ha n’akụkụ ahụ, na nzube nke ịmị mkpụrụ maka ọnwụ. Otú ọ dị, “ka ha wee mịara ọnwụ mkpụrụ” anaghị egosi idiom Igbo nke ọma maka καρποφορῆσαι τῷ θανάτῳ.'
  naturalness: “Nọ na-arụ ọrụ” na “n’akụkụ ahụ anyị” bụ Igbo doro anya n’usoro ederede dị ùgwù. A ghaghị idozi “mịara ọnwụ mkpụrụ” ka ọ bụrụ “mịta mkpụrụ maka ọnwụ,” nke bụ usoro Igbo nkịtị ma na-echekwa ihe atụ mkpụrụ na ntụzịaka ya n’ọnwụ.
  terminology: “Anụ ahụ” na-echekwa σάρξ n’enweghị ịmanye nkọwa okpukpe. “Ọchịchọ mmehie” bụ ezigbo nsụgharị atụgharị nke παθήματα τῶν ἁμαρτιῶν. “Iwu ahụ” na “akụkụ ahụ anyị” dabara n’ọrụ Paulus ebe a. Edoghachila nkọwa ala [a] ka Igbo ya bụrụ nke eke karịa, ma [b] ewepụtala nkwupụta “mmehie dị iche iche,” nke nwere ike ịkpọpụta ihe karịa ihe ederede chọrọ.
