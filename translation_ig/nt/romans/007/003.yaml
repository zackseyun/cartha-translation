revisions:
- from: N’ihi ya, mgbe di ya ka dị ndụ, a ga-akpọ ya nwanyị na-akwa iko ma ọ bụrụ na ọ lụọ nwoke ọzọ.[a] Ma ọ bụrụ na di ya anwụọ, o nweere onwe ya pụọ n’iwu ahụ,[b] nke mere na ọ gaghị abụ nwanyị na-akwa iko ma ọ bụrụ na ọ lụọ nwoke ọzọ.
  to: N’ihi ya, mgbe di ya ka dị ndụ, a ga-akpọ ya nwanyị na-akwa iko ma ọ bụrụ na ọ lụọ nwoke ọzọ.[a] Ma ọ bụrụ na di ya anwụọ, o nweere onwe ya n’iwu ahụ,[b] nke mere na ọ bụghị nwanyị na-akwa iko mgbe ọ lụrụ nwoke ọzọ.
  rationale: 'The revision makes a source-based grammatical correction in the final clause: the first ἐὰν γένηται remains conditional (“ma ọ bụrụ na”), whereas the final γενομένην is represented as a participial/temporal circumstance (“mgbe ọ lụrụ”). It also smooths the idiom for freedom from the law. Footnote anchors and their content remain valid.'
  reviewer_model: gpt-5.6-terra
