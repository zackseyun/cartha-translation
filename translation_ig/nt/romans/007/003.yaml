id: ROM.7.3
reference: Romans 7:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: ig
  text: N’ihi ya, mgbe di ya ka dị ndụ, a ga-akpọ ya nwanyị na-akwa iko ma ọ bụrụ na ọ lụọ nwoke ọzọ.[a] Ma ọ bụrụ na di ya anwụọ, o nweere onwe ya n’iwu ahụ,[b] nke mere na ọ bụghị nwanyị na-akwa iko mgbe ọ lụrụ nwoke ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ bụrụ nke nwoke ọzọ” ma ọ bụ “ọ sonyeere nwoke ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: “Iwu ahụ” n’ebe a na-ezo aka ozugbo n’iwu nke na-ejikọta di na nwunye n’alụmdi na nwunye.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: N’ihi ya
  rationale: Ngwakọta mkpụrụokwu abụọ a na-egosi nkwubi okwu sitere n’ihe e kwuru n’amaokwu ndị bu ụzọ; “N’ihi ya” na-ekwupụta njikọ ahụ n’Igbo dị mfe ma dị nsọpụrụ.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: mgbe di ya ka dị ndụ
  rationale: Nke a na-egosi ọnọdụ na-aga n’otu oge. “Di ya” sitere n’ihe gbasara nwanyị lụrụ di nke a na-ekwu maka ya.
- source_word: μοιχαλὶς
  choice: nwanyị na-akwa iko
  rationale: Ọ bụ aha kpọmkwem maka nwanyị mere ịkwa iko; okwu Igbo a doro ndị na-agụ taa anya.
- source_word: χρηματίσει
  choice: a ga-akpọ ya
  rationale: N’ebe a, ngwaa ahụ pụtara ịbụ onye a kpọrọ ma ọ bụ onye a mara dị ka ihe; ahịrị a na-edokwa ọdịdị ọdịnihu ya.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: ma ọ bụrụ na ọ lụọ nwoke ọzọ
  rationale: N’ọnọdụ iwu alụmdi na nwunye a, okwu ahụ na-egosi ịbanye na mmekọrịta alụmdi na nwunye nke nwoke ọzọ. E tinyere ụzọ ndị ka na-agbasochi ọdịdị okwu Grik anya n’ala ala peeji iji ghara izochi obosara okwu ahụ.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: o nweere onwe ya pụọ n’iwu ahụ
  rationale: Nke a na-egosi na iwu ahụ ejighịzi ya; a hapụrụ “iwu ahụ” n’ozuzu dịka Grik si kwuo, ebe ihe gbara ya gburugburu na-akọwa iwu e bu n’uche.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: nke mere na ọ gaghị abụ nwanyị na-akwa iko
  rationale: Nkebi ahịrị a na-egosi ihe si na ọnwụ di ya pụta n’ihe banyere ọnọdụ iwu nke nwanyị ahụ.
theological_decisions:
- issue: Oke ihe νόμος (“iwu”) na-ezo aka na ya n’ihe atụ a
  choice: E debere ya dịka “iwu ahụ,” ebe ihe gbara amaokwu ahụ gburugburu na-egosi njikọ iwu nke alụmdi na nwunye.
  alternative: “iwu alụmdi na nwunye” ma ọ bụ iwu Mozis n’ozuzu ya
  rationale: Ikwu naanị “iwu ahụ” na-echekwa okwu Pọl ma zere itinye nkọwa ozizi sara mbara karịa ihe atụ ya chọrọ; ala ala peeji na-eme ka ihe ọ na-ezo aka na ya ozugbo doo anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dịkwa nsọpụrụ. A họọrọ “nwanyị na-akwa iko” kama okwu ochie ma ọ bụ okwu ụka pụrụ iche; e debere usoro arụmụka Pọl na njikọ iwu nke ihe atụ ahụ.
