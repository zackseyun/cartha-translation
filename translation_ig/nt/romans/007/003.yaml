review_pass:
  verdict: revise
  source_fidelity: 'The first conditional clause is conveyed well: ζῶντος τοῦ ἀνδρός, χρηματίσει, and the marital sense of γένηται ἀνδρὶ ἑτέρῳ are represented clearly. In the final clause, however, γενομένην is an aorist participle (“having become/when she has become”), not a second conditional clause. The revision preserves that distinction without over-specifying the disputed breadth of the idiom.'
  naturalness: The Igbo is generally clear and appropriately formal. “O nweere onwe ya n’iwu ahụ” is a more idiomatic and direct way to express being free from a binding law than “o nweere onwe ya pụọ n’iwu ahụ.” The revised final clause reads naturally while retaining the legal-marital logic.
  terminology: “Nwanyị na-akwa iko” accurately expresses μοιχαλίς in accessible Standard Igbo. “Iwu ahụ” appropriately retains νόμος without importing a broader doctrinal interpretation; the explanatory note properly identifies its immediate marital-legal referent. “Lụọ nwoke ọzọ” is a suitable contextual rendering of becoming related to another man in this marriage analogy.
  issues:
  - severity: medium
    issue: The final occurrence of “ma ọ bụrụ na ọ lụọ nwoke ọzọ” renders γενομένην as a conditional clause.
    rationale: The Greek final expression is participial and describes her status upon/after entering the relation to another man. Rendering it with “mgbe ọ lụrụ nwoke ọzọ” preserves this distinction and avoids repeating a condition that is not present in the source.
  - severity: low
    issue: “O nweere onwe ya pụọ n’iwu ahụ” is less direct idiomatically.
    rationale: “O nweere onwe ya n’iwu ahụ” naturally conveys freedom from a binding law while keeping the Greek expression’s concise wording.
  revised_text: N’ihi ya, mgbe di ya ka dị ndụ, a ga-akpọ ya nwanyị na-akwa iko ma ọ bụrụ na ọ lụọ nwoke ọzọ.[a] Ma ọ bụrụ na di ya anwụọ, o nweere onwe ya n’iwu ahụ,[b] nke mere na ọ bụghị nwanyị na-akwa iko mgbe ọ lụrụ nwoke ọzọ.
