id: ROM.7.1
reference: Romans 7:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: ig
  text: Ka ọ̀ bụ na unu amaghị, ụmụnna[a]—n’ihi na ana m agwa ndị maara iwu okwu—na iwu na-achị[b] mmadụ n’oge niile mmadụ dị ndụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị ‘ụmụnna’ bụ adelphoi, nke dị n’ụdị ọtụtụ nke nwoke; n’ebe a, o yikarịrị ka ọ gụnyere ụmụ nwanyị nọ n’etiti ndị Pọl na-agwa okwu.
    reason: cultural_note
  - marker: b
    text: Ma ọ bụ, ‘nwere ikike n’ebe mmadụ nọ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: Ka ọ̀ bụ
  rationale: Na-egosi na ajụjụ a na-aga n’ihu n’arụmụka Pọl si n’ihe o kwuru tupu ya, kama ịbụ naanị okwu mmalite.
- source_word: ἀγνοεῖτε
  choice: unu amaghị
  rationale: Ọ bụ ụzọ Igbo doro anya si kwuo ajụjụ a na-ajụ iji kpọkuo ihe ndị na-ege ntị kwesịrị ịma.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: Ọ bụ okwu nkwanye ùgwù na nke sitere n’ezinụlọ okwukwe, nke dabara n’ụzọ Pọl si akpọ ndị Kraịst ibe ya okwu; nkọwa ala peeji na-echekwa ozi gbasara ụdị okwu Grik ahụ.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: n’ihi na ana m agwa ndị maara iwu okwu
  rationale: Na-echekwa nkọwa etiti ahịrị nke γάρ ma na-asụ ya n’Igbo eke ma doo anya.
- source_word: νόμον / ὁ νόμος
  choice: iwu
  rationale: E meghị ka ọ bụrụ naanị Iwu Mosis ma ọ bụ iwu n’ozuzu ya, n’ihi na okwu Grik ahụ na ọnọdụ ya hapụrụ oke okwu ahụ ka ọ dị obosara.
- source_word: κυριεύει
  choice: na-achị
  rationale: Na-egosi ikike na ọchịchị okwu Grik ahụ pụtara n’ụzọ dị mkpirikpi ma bụrụ Igbo eke.
- source_word: τοῦ ἀνθρώπου
  choice: mmadụ
  rationale: ἄνθρωπος bụ mmadụ n’ozuzu ya ebe a, ọ bụghị nwoke kpọmkwem; ‘mmadụ’ na-echekwa nke ahụ n’enweghị ịgbakwunye okike.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: naanị oge ọ dị ndụ
  rationale: Na-enye echiche oge dum mmadụ ka dị ndụ, ma na-ejigide otu onye nke ahịrịokwu Grik ahụ.
theological_decisions:
- issue: Oke ihe νόμος na-ezo aka na ya n’okwu Pọl
  choice: A sụgharịrị ya naanị dị ka ‘iwu,’ n’emeghị ka nkọwa ya dị warara.
  alternative: ‘Iwu Mosis’ kpọmkwem, ma ọ bụ iwu dị ka ụkpụrụ iwu n’ozuzu ya.
  rationale: Ọnọdụ gbara ya gburugburu na-elekwasị anya n’Iwu Mosis, ma okwu Grik n’onwe ya anaghị ekpebi oke ahụ kpamkpam. Ya mere, nsụgharị ahụ na-ahapụ obosara na esemokwu nkà mmụta okpukpe dị n’ahịrịokwu ahụ.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. Akara nkwụsị ogologo na-ekewa nkọwa Pọl tinyere n’etiti ahịrịokwu ahụ. A zere okwu ụka pụrụ iche nke otu ngalaba, ma okwu ‘mmadụ’ na nnọchiaha ‘ọ’ na-echekwa izugbe nke Grik n’enweghị ime ka ọ bụrụ nwoke kpọmkwem.
