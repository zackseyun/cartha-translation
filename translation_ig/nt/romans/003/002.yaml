id: ROM.3.2
reference: Romans 3:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: ig
  text: Uru ya dị ukwuu n’ụzọ niile. N’ihi na, nke mbụ, e nyefere ha okwu nsọ Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nkwupụta Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺ
  choice: Ọ bara uru nke ukwuu
  rationale: N'ebe a, okwu ahụ na-aza ajụjụ dị n'amaokwu gara aga banyere uru ndị Juu nwere; nsụgharị a na-eme ka ihe e zoro aka na ya doo anya n'Igbo.
- source_word: κατὰ πάντα τρόπον
  choice: n'ụzọ niile
  rationale: Nke a na-egosi na uru ahụ sara mbara n'akụkụ niile, ma bụrụkwa okwu Igbo dị mfe ma kwụ ọtọ.
- source_word: πρῶτον μὲν γὰρ
  choice: N'ihi na, nke mbụ
  rationale: “N'ihi na” na-anọchi γὰρ, ebe “nke mbụ” na-egosi mmalite nke uru Pọl depụtara, n'agbanyeghị na nke abụọ esoghị ozugbo.
- source_word: ἐπιστεύθησαν
  choice: e nyefere ha
  rationale: Ụdị ngwaa a pụtara na e tinyere ihe n'aka ha ka ha lekọta ya, ọ bụghị na ha kweere.
- source_word: τὰ λόγια
  choice: okwu
  rationale: N'ebe a, λόγια bụ okwu ma ọ bụ nkwupụta sitere n'aka Chineke; “okwu” bụ Igbo nkịtị ma na-edobe echiche ahụ n'ụzọ sara mbara.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: Njikọ ahụ nwere ike igosi na okwu ndị ahụ bụ nke Chineke ma sikwa n'aka ya; “okwu Chineke” bụ ụzọ Igbo doro anya nke na-adịghị akpa oke n'etiti echiche abụọ ahụ.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu nke mbụ na-adabere n'ajụjụ dị n'amaokwu 1, ebe “e nyefere ha” na-echekwa echiche nke ibu ọrụ e nyere ndị Juu.
