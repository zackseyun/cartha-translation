  rationale: The revision retains the verse’s elliptical, context-dependent answer by referring to the advantage already under discussion, renders the connective and first-item marker clearly, and expresses the entrusted divine utterances with appropriate sacred-register precision. The footnote remains anchored to the final phrase and gives a concise lexical alternative.
