revisions:
- from: site ná ndidi Chineke, iji gosi ezi omume[a] ya n’oge a, ka o wee bụrụ onye ezi omume ma bụrụkwa onye na-agụ[b] onye nwere okwukwe na Jizọs[c] n’onye ezi omume.
  to: n’ime ndidi Chineke, iji gosi ezi omume[a] ya n’oge a, ka o wee bụrụ onye ezi omume ma bụrụkwa onye na-ekwupụta na onye nwere okwukwe n’ebe Jizọs nọ[c] bụ onye ezi omume[b].
  rationale: The revision replaces the erroneous and unnatural use of “onye na-agụ” with a clear judicial expression for δικαιοῦντα, while retaining the source’s relation between God being righteous and declaring righteous the believer. It also makes the contested alternative reading of πίστεως Ἰησοῦ explicit as Jesus’ faithfulness. The opening remains a dependent clause, as in the Greek context.
