    text: Ma ọ bụ, “onye sitere n’ikwesị ntụkwasị obi Jizọs.”
    reason: alternative_reading
  revision_rationale: The revision replaces the erroneous and unnatural use of “onye na-agụ” with a clear judicial expression for δικαιοῦντα, while retaining the source’s relation between God being righteous and declaring righteous the believer. It also makes the contested alternative reading of πίστεως Ἰησοῦ explicit as Jesus’ faithfulness. The opening remains a dependent clause, as in the Greek context.
