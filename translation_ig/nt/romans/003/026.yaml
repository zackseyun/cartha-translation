id: ROM.3.26
reference: Romans 3:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: ig
  text: n’ime ndidi Chineke, iji gosi ezi omume[a] ya n’oge a, ka o wee bụrụ onye ezi omume ma bụrụkwa onye na-ekwupụta na onye nwere okwukwe n’ebe Jizọs nọ[c] bụ onye ezi omume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye na-eme ka mmadụ bụrụ onye ezi omume.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “onye sitere n’ikwesị ntụkwasị obi Jizọs.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνοχῇ
  choice: ndidi
  rationale: “Ndidi” na-egosi na Chineke ejighị ikpe ya abịa ozugbo, kama o ji aka ya kwụsị ya ruo oge; ọ dabara n’echiche okwu a n’ebe a.
- source_word: ἔνδειξιν
  choice: iji gosi
  rationale: Ụdị ngwaa a bụ asụsụ Igbo dị mfe ma doo anya, ma ọ ka na-egosi ngosipụta pụtara ìhè nke ἔνδειξις.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: “Ezi omume” bụ ụzọ a na-aghọta nke ọma isi kwuo δικαιοσύνη n’Igbo; ihe ọ pụtara dịka ikpe ziri ezi ka e debere n’ala ala peeji.
- source_word: νῦν καιρῷ
  choice: n’oge a
  rationale: Nke a bụ okwu Igbo e ji eme ihe ugbu a, ma ọ na-echekwa nkwusiri ike banyere oge dị ugbu a.
- source_word: δίκαιον
  choice: onye ezi omume
  rationale: Ọ na-egosi na Chineke ziri ezi, ma na-emekwa ka njikọ okwu dị n’etiti δίκαιον na δικαιοῦντα pụta ìhè.
- source_word: δικαιοῦντα
  choice: onye na-agụ ... n’onye ezi omume
  rationale: Nke a na-enye participle ahụ ọrụ aha ma na-echekwa echiche ikpe ụlọikpe nke ịgụ mmadụ n’onye ezi omume.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: onye nwere okwukwe na Jizọs
  rationale: Isi ederede ghọtara genitive ahụ dị ka ihe okwukwe na-elekwasị anya na ya, n’asụsụ Igbo doro anya; a hapụrụ nghọta ọzọ n’ala ala peeji.
theological_decisions:
- issue: Ihe ἐκ πίστεως Ἰησοῦ pụtara
  choice: onye nwere okwukwe na Jizọs
  alternative: onye sitere ná ntụkwasị obi Jizọs
  rationale: Genitive a nwere nghọta abụọ a na-arụrịta ụka banyere ha. Isi ederede họọrọ nghọta okwukwe mmadụ nwere na Jizọs maka ido anya, ma ala ala peeji chekwara nghọta nke ntụkwasị obi Jizọs n’onwe ya.
- issue: Njikọ dị n’etiti δίκαιον na δικαιοῦντα
  choice: onye ezi omume ... onye na-agụ ... n’onye ezi omume
  alternative: onye ikpe ya ziri ezi ... onye na-ekwupụta na mmadụ bụ onye ezi omume
  rationale: Nhọrọ a na-echekwa ma echiche ikpe ziri ezi ma egwuregwu okwu Pọl, n’enweghị ịkọwa n’ụzọ ga-emechi ihe okwu ahụ nwere ike ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-amalite dịka nkebi na-aga n’ihu site n’amaokwu bu ya ụzọ, dịka isi mmalite Grik si dị. E debere okwu ikpe ụlọikpe n’ụzọ a na-aghọta, ma e chekwara mgbagwoju anya nke ἐκ πίστεως Ἰησοῦ n’ala ala peeji.
