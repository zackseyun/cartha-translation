id: ROM.3.27
reference: Romans 3:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: ig
  text: Ya mere, olee ebe ịnya isi dị? E wepụla ya. Site n’ụdị iwu dị aṅaa? Iwu nke ọrụ? Mba, kama ọ bụ site n’iwu nke okwukwe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: ịnya isi
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi kwuo nganga ma ọ bụ itu ọnụ n’ihe mmadụ ji onwe ya kpọrọ ihe.
- source_word: ἐξεκλείσθη
  choice: E wepụla ya
  rationale: Ọ na-egosi na e mechibidoro ịnya isi ụzọ ma wepụ ya, na-enweghị ịgbakwunye onye mere ihe ahụ ebe Grik ejighị onye ahụ kpọọ aha.
- source_word: νόμος
  choice: iwu
  rationale: Ọ na-edobe otu mkpụrụokwu ahụ Pọl ji mee egwuregwu echiche n’etiti ‘iwu nke ọrụ’ na ‘iwu nke okwukwe.’
- source_word: ἔργων
  choice: ọrụ
  rationale: Ọ bụ ntụgharị nkịtị nke ἔργα n’okwu Pọl, ma na-ahapụ ihe okwu gbara ya gburugburu ka ọ kọwaa ụdị ọrụ ndị ahụ.
- source_word: πίστεως
  choice: okwukwe
  rationale: Ọ na-edobe nkọwa sara mbara nke πίστις ebe a, na-enweghị ịkpebi n’ime ntụgharị ma ọ bụ okwukwe mmadụ, ntụkwasị obi, ma ọ bụ ikwesị ntụkwasị obi.
- source_word: διὰ
  choice: site n’
  rationale: N’ebe a, διὰ na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ka ịnya isi ghara ịdị; ‘site n’…’ bụ okwu Igbo doro anya maka njikọ ahụ.
theological_decisions:
- issue: Ihe ‘iwu nke okwukwe’ pụtara
  choice: iwu nke okwukwe
  alternative: usoro nke okwukwe
  rationale: E debere ‘iwu’ maka νόμος iji chekwaa nrụgide na egwuregwu okwu Pọl kpachapụrụ anya kee n’etiti iwu, ọrụ, na okwukwe; ịsụgharị ya ‘usoro’ ga-akọwa echiche ahụ karịa ka isi mmalite kwuru.
- issue: Onye wepụrụ ịnya isi
  choice: E wepụla ya
  alternative: Chineke ewepụla ya
  rationale: Ụdị ngwaa Grik bụ passive, ọ kpọghị onye mere ya aha. Agbanyeghị na ihe gbara amaokwu ahụ gburugburu nwere ike igosi ọrụ Chineke, etinyeghị aha Chineke n’ime ntụgharị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ajụjụ ndị dị n’isi mmalite ka edobere n’usoro dị mkpirikpi iji chekwaa ike arụmụka Pọl.
