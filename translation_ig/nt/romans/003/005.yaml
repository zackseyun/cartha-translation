id: ROM.3.5
reference: Romans 3:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: ig
  text: Ma ọ bụrụ na ajọ omume anyị na-eme ka ezi omume Chineke pụta ìhè[a], gịnị ka anyị ga-ekwu? Chineke ọ na-adịghị ezi omume n’ịweta iwe? (Ana m ekwu okwu dịka mmadụ.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ezighị ezi anyị na-eme ka ikpe ziri ezi Chineke pụta ìhè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικία
  choice: ajọ omume
  rationale: Ọ na-egosi omume na-adịghị ezi n’ụzọ doro ndị na-agụ Igbo anya, ma na-echekwa ọdịiche dị n’etiti omume mmadụ na ezi omume Chineke.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka ịdị ezi n’omume; ihe ọzọ ọ pụrụ ịpụta n’ebe a, ya bụ ikpe ziri ezi, ka e debere n’ala ala peeji.
- source_word: συνίστησιν
  choice: na-eme ka ... pụta ìhè
  rationale: Ọ na-egosipụta echiche nke ime ka ihe doo anya ma ọ bụ bụrụ ihe a hụrụ nke ọma, n’enweghị ịgbakwunye echiche nke ịja mma.
- source_word: μὴ ἄδικος
  choice: Chineke ọ bụ onye ajọ ikpe
  rationale: E debere ya dị ka ajụjụ nkwugharị okwu, dịka Grik si dị, nke na-atụ anya azịza na-adịghị mma ma na-ahapụghị ajụjụ ahụ n’ụdị nkwupụta.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: ọ na-eweta iwe ya
  rationale: Nke a na-echekwa ihe oyiyi nke iweta iwe dịka ikpe, ma bụrụkwa Igbo dị mfe ma kwe nghọta.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Ana m ekwu okwu dị ka mmadụ
  rationale: Ọ na-echekwa nkwupụta Pọl na ọ na-ekwu dịka mmadụ, n’asụsụ Igbo dị nkenke ma dịkwa eke.
theological_decisions:
- issue: Ajụjụ Pọl banyere ma Chineke ọ na-eme ajọ ikpe mgbe ọ na-eweta iwe
  choice: 'E debere ya dịka ajụjụ: “Chineke ọ bụ onye ajọ ikpe ...?”'
  alternative: “Chineke abụghị onye ajọ ikpe ..., ka ọ bụ?”
  rationale: μή na-atụ anya azịza ‘mba,’ ma usoro ajụjụ kwụ ọtọ na-echekwa ọdịdị Grik na esemokwu arụmụka ahụ n’enweghị ịgbakwunye nkwusi ike.
- issue: δικαιοσύνη dịka ezi omume ma ọ bụ ikpe ziri ezi
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’isi okwu e ji “ezi omume” mee ka ọdịiche omume dị n’etiti ἀδικία mmadụ na δικαιοσύνη Chineke pụta; ihe “ikpe ziri ezi” pụtara ka e chekwara na nkọwa ala ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma dị ùgwù. A họọrọ okwu ndị ndị nkịtị ga-aghọta, ebe e chekwara ọdịiche okwu Grik na ajụjụ nkwugharị okwu ahụ.
