  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: ig
  text: Ma ọ bụrụ na eziokwu Chineke[a] esitewo n’ụgha m[b] baa ụba iji wetara ya otuto[c], gịnị mere a ka na-ekpekwa m ikpe dị ka onye mmehie?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ikwesị ntụkwasị obi nke Chineke” ma ọ bụ “eziokwu nke Chineke.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “site n’ihe m kwuru nke na-abụghị eziokwu.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “ruo n’otuto ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: eziokwu Chineke
  rationale: Nke a bụ okwu Igbo doro anya ma dịkwa obosara nke pụrụ ịpụta eziokwu nke Chineke ma ọ bụ ikwesi eziokwu ike ya. Ọ na-edobe njikọ dị n’etiti okwu a na ụgha mmadụ n’amaokwu gbara ya gburugburu, na-enweghị imechi nghọta nke njikọ genitiv ahụ.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: esitewo n’ụgha m
  rationale: “Esitewo na” na-egosi ụzọ ma ọ bụ ihe e ji mee ka eziokwu Chineke baa ụba, kama ịkọwa nanị ebe ihe ahụ mere.
- source_word: ψεύσματι
  choice: ụgha
  rationale: “Ụgha” bụ okwu Igbo kwụ ọtọ ma bụrụ nke ndị mmadụ na-eji eme ihe maka ihe na-abụghị eziokwu.
- source_word: ἐπερίσσευσεν
  choice: baa ụba
  rationale: Nkebiokwu a na-egosi ịba ụba ma ọ bụ ịrị elu nke ọma, ma na-ada ka Igbo ebumpụta ụwa.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: iji wetara ya otuto
  rationale: Nke a na-egosipụta ebumnuche ma ọ bụ ihe si na ya pụta nke εἰς, ma na-edobe nke a n’ihe odide ala peeji.
- source_word: τί ἔτι
  choice: gịnị mere a ka ji
  rationale: “A ka” na-egosi na ikpe ahụ ka na-aga n’ihu, nke kwekọrọ n’ike ἔτι.
- source_word: κἀγὼ
  choice: ekpekwa m
  rationale: Mkpụrụ “kwa” na-eburu echiche mgbakwunye dị na κἀγώ n’ụzọ dabara n’usoro okwu Igbo.
- source_word: κρίνομαι
  choice: a ... ji ekpe ... ikpe
  rationale: Usoro a na-edobe olu nnara na echiche nke ịbụ onye a na-ekpe ikpe, na-enweghị ịkọwa ya ozugbo dị ka ikpe ọmụma ikpeazụ.
- source_word: ὡς ἁμαρτωλὸς
  choice: dị ka onye mmehie
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ ma dịkwa mfe nghọta nke aha ahụ.
theological_decisions:
- issue: Ma ἀλήθεια τοῦ θεοῦ ọ pụtara “eziokwu Chineke” n’ozuzu ya ka ọ bụ ikwesi eziokwu ike nke Chineke.
  choice: eziokwu Chineke
  alternative: ikwesi eziokwu ike nke Chineke
  rationale: “Eziokwu Chineke” na-edobe obosara okwu Grik ahụ na esemokwu ya na ụgha mmadụ. Ihe odide ala peeji na-egosi nghọta nke ikwesi eziokwu ike, n’emeghị ka otu nghọta mechie nke ọzọ.
- issue: Ma ajụjụ a bụ nkwupụta Pọl n’onwe ya ka ọ bụ arụmụka onye mmadụ pụrụ iweta.
  choice: E debere ya dị ka ajụjụ onye mbụ kpọmkwem, dịka Grik si dị.
  alternative: Ịgbakwunye okwu na-akọwa na onye na-emegide ya bụ onye na-ekwu ya.
  rationale: Amaokwu ahụ n’onwe ya anaghị akpọpụta onye ọzọ n’ahịrịokwu a; ya mere, ịgbakwunye onye na-ekwu okwu ga-edozi esemokwu nkọwa nke isi mmalite hapụrụ emeghe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A họọrọ usoro okwu na-aga were were n’Igbo, ma e debere ajụjụ arụmụka, olu nnara, echiche nke ikpe na-aga n’ihu, na mgbakwunye dị na κἀγώ.
