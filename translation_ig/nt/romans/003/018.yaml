lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: adịghị
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke e ji eme ihe mgbe niile iji gosi na ihe ahụ adịghị, ma na-echekwa ike nke nkwụpụ dị n’asụsụ Grik.
- source_word: φόβος
  choice: egwu
  rationale: “Egwu” bụ isi ihe okwu Grik a pụtara, ọ na-echekwa kwa okwu atụmanya Akwụkwọ Nsọ banyere egwu kwesịrị ekwesị mmadụ na-atụ Chineke; nkọwa dịka nsọpụrụ ka e debere n’ala ala peeji.
- source_word: θεοῦ
  choice: Chineke
  rationale: N’usoro okwu Igbo, itinye “Chineke” ozugbo n’azụ “egwu” na-egosi na Chineke bụ onye egwu ahụ metụtara, n’enweghị mgbakwunye nkọwa na-adịghị n’ihe odide Grik.
- source_word: ἀπέναντι
  choice: n’ihu
  rationale: “N’ihu” na-echekwa ihe atụ gbasara ọnọdụ ihe n’ihu anya, ma bụrụkwa okwu Igbo doro anya ma dị ebube.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: ha
  rationale: N’akpaokwu Igbo “n’ihu ha,” “ihu” na-arụ ọrụ nke ihe oyiyi gbasara ihe dị n’ihu mmadụ ma ọ bụ n’uche ya. Nke a bụ asụsụ Igbo ebumpụta ụwa karịa “n’ihu anya ha,” nke nwere ike ịdị ka nsụgharị mkpụrụokwu n’ụzọ na-adịghị ụtọ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị nkenke, dị ebube, ma dị mfe nghọta. E ji “Egwu Chineke” chekwaa isi okwu φόβος θεοῦ; e ji “n’ihu ha” nye akpaokwu ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν n’ụzọ Igbo ebumpụta ụwa, ebe ihe oyiyi banyere ihe dị n’ihu mmadụ ka dị.
