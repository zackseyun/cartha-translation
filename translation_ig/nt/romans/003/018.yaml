  text: Egwu Chineke adịghị n’ihu anya ha[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nsọpụrụ Chineke adịghị n’ihu anya ha.”
