  verdict: revise
  source_fidelity: The draft correctly represents the relative construction, singular collective 'mouth,' and the present state of being full. However, 'obi ilu' shifts πικρίας toward an inward emotional condition ('bitterness of heart') rather than retaining the source's direct predicate that the mouth is full of bitterness.
  naturalness: '''Ndị ọnụ ha jupụtara ...'' is a natural Standard Igbo relative construction. In this mouth/speech context, bare ''ilu'' is more idiomatic and direct than ''obi ilu.'''
  terminology: Use 'ọbụbụ ọnụ' for ἀρά and 'ilu' for πικρία. These retain the paired abstract nouns of the Greek without adding 'okwu' or 'obi,' neither of which is expressed in the source.
  issues:
  - severity: medium
    issue: '''obi ilu'' adds ''heart'' to πικρίας.'
    rationale: The Greek says that their mouth is full of 'bitterness'; it does not specify the heart. Bare 'ilu' preserves the concise parallelism and avoids narrowing or relocating the quality from speech to an inner state.
