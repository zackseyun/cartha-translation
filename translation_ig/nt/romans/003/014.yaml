reference: Romans 3:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὧν τὸ στόμα ἀρᾶς καὶ πικρίας γέμει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/014.yaml
  text: whose mouth is full of cursing and bitterness.
translation:
  language: ig
  text: Ndị ọnụ ha jupụtara n'ọbụbụ ọnụ na ilu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: ndị ... ha
  rationale: Nnochiaha njikọ a dị na genitive na-akọwa ndị a kpọtụrụ aha n'amaokwu ndị bu ụzọ; nhazi “ndị ... ha” bụ ụzọ Igbo nkịtị si egosipụta “whose” n'enweghị ịgbagọ njikọ ahụ.
- source_word: τὸ στόμα
  choice: ọnụ
  rationale: “Ọnụ” bụ ntụgharị kpọmkwem ma dịkwa mma n'Igbo maka akụkụ ahụ na, n'ụzọ ihe atụ, okwu mmadụ na-ekwu. E debere ya n'otu karịa ime ka ọ bụrụ ọtụtụ.
- source_word: ἀρᾶς
  choice: okwu ọbụbụ ọnụ
  rationale: Nke a na-egosi okwu e ji akpọku ihe ọjọọ ka ọ dakwasị mmadụ; “okwu ọbụbụ ọnụ” na-eme ka o doo anya na ihe dị n'ọnụ ha bụ okwu na-akpatara ndị ọzọ ihe ọjọọ.
- source_word: πικρίας
  choice: obi ilu
  rationale: “Obi ilu” na-eburu echiche nke πικρία n'ụzọ Igbo na-aghọta nke ọma, ma na-edobe ike omume nke okwu ahụ n'agbanyeghị na ọnọdụ a nwekwara ike ịpụta okwu ilu ma ọ bụ okwu ọjọọ.
- source_word: γέμει
  choice: jupụtara
  rationale: “Jupụtara” na-egosipụta ọnọdụ dị ugbu a nke ịbụ ihe juru eju, kwekọrọ na present tense nke ngwaa Grik.
theological_decisions:
- issue: Ma πικρίας ọ̀ na-ezo aka n'ọnọdụ obi ka ọ bụ n'okwu ilu
  choice: obi ilu
  alternative: okwu ilu / okwu ọjọọ
  rationale: 'A hapụrụ obosara ihe okwu Grik ahụ pụtara: “obi ilu” bụ okwu Igbo a maara nke ọma ma ọnọdụ ‘ọnụ’ na-eme ka onye na-agụ ya ghọta na obi ilu ahụ na-apụta n''okwu. A zere ime ka ọ bụrụ naanị ụdị okwu siri ike.'
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mkpirikpi ma dị ùgwù. A họọrọ “ndị ọnụ ha” dịka nhazi njikọ ebumpụta ụwa; “okwu ọbụbụ ọnụ” na-egbochi mgbagwoju anya nke “ọbụbụ ọnụ” naanị ya.
