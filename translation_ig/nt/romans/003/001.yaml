  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: ig
  text: Gịnịzi bụ uru onye Juu nwere? Ma ọ bụ, uru dị aṅaa ka ibi úgwù bara?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Ma ọ bụ, gịnị bụ uru ibi úgwù?”'
    reason: lexical_alternative
  - marker: b
    text: “Onye Juu” nọ n'ụdị otu onye, ma ọ na-anọchite anya onye Juu dịka otu ụdị mmadụ.
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: Gịnịzi
  rationale: Na-echekwa njikọ nkwubi okwu οὖν na ụdị ajụjụ Pọl ji arụ ụka, ma bụrụkwa Igbo dị mfe ma kwekọọ n'okwu gbara ya gburugburu.
- source_word: τὸ περισσὸν
  choice: uru ... nwere
  rationale: N'ebe a, okwu ahụ na-ajụ uru pụrụ iche onye Juu nwere; ntụgharị a anaghị ekwu na agbụrụ ya ka ndị ọzọ elu.
- source_word: τοῦ Ἰουδαίου
  choice: onye Juu
  rationale: Na-echekwa aha otu onye nke na-anọchite anya ndị Juu dịka otu ụdị mmadụ, n'Igbo nkịtị ma doo anya.
- source_word: ἢ τίς
  choice: Ma ọ bụ, ... dị aṅaa
  rationale: Na-echekwa myirịta dị n'etiti ajụjụ abụọ ahụ ma mee ka nke abụọ bụrụ ajụjụ Igbo sitere n'okike.
- source_word: ἡ ὠφέλεια
  choice: uru ... bara
  rationale: ‘Uru ... bara’ na-egosi ihe ibi úgwù na-ewetara mmadụ ma na-adaba n'okwu Igbo nkịtị.
- source_word: τῆς περιτομῆς
  choice: ibi úgwù
  rationale: Nke a bụ okwu Igbo a na-aghọta nke ọma maka emume ahụ; n'ebe a ọ bụ ihe ịrịba ama ọgbụgba ndụ e ji amata ndị Juu.
theological_decisions:
- issue: Ma a ga-asụgharị Ἰουδαίου dịka otu onye nnọchite anya otu ìgwè, ka a gbanwee ya bụrụ ọtụtụ mmadụ
  choice: onye Juu
  alternative: ndị Juu
  rationale: Pọl ji aha otu onye mee ihe dịka onye na-anọchite anya ụdị mmadụ ahụ dum. Ide ‘onye Juu’ na-echekwa usoro ajụjụ ya n'etinyeghị nkọwa sara mbara n'ime amaokwu ahụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘Gịnịzi’ chekwaa ntụgharị echiche Pọl, ebe ‘uru ... nwere’ na ‘uru ... bara’ na-eme ka obere ọdịiche dị n'etiti περισσόν na ὠφέλεια pụta n'Igbo.
