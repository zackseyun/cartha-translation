  text: ὀξεῖς οἱ πόδες αὐτῶν ἐκχέαι αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/015.yaml
  text: Their feet are swift to shed blood,[a]
translation:
  language: ig
  text: Ụkwụ ha dị ngwa ịwụfu ọbara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “Ụkwụ ha dị nkọ ịwụpụ ọbara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀξεῖς
  choice: dị ngwa
  rationale: Ọ bụ ezie na okwu Grik a pụtara n'ụzọ nkịtị ‘dị nkọ,’ n'okwu a banyere ụkwụ ndị dị njikere ime ihe ike, ‘dị ngwa’ na-enye echiche ebumpụta ụwa nke ime ngwa ngwa.
- source_word: πόδες
  choice: Ụkwụ
  rationale: Nsụgharị a kwụ ọtọ ma na-edowe ihe atụ nke akụkụ ahụ dị na isi mmalite.
- source_word: αὐτῶν
  choice: ha
  rationale: Ọ na-egosi na ụkwụ ahụ bụ nke ndị a na-ekwu maka ha, n'ụzọ Igbo si ekwu ‘ụkwụ ha.’
- source_word: ἐκχέαι
  choice: ịwụfu
  rationale: Okwu Grik ahụ pụtara ‘ịwụpụ’; mgbe ọbara bụ ihe a na-ekwu banyere ya, ‘ịwụfu ọbara’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-eji ekwu igbu mmadụ ma ọ bụ ime ihe ike.
- source_word: αἷμα
  choice: ọbara
  rationale: Nke a bụ nsụgharị Igbo a na-ahụkarị nke okwu ahụ, ọ na-edokwa ihe oyiyi nke ime ihe ike.
theological_decisions: []
translation_notes:
