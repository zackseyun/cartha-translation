review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the main contrasts in the Greek: Paul''s collective conclusion, a generic human referent, faith as the means, and exclusion of works of the law. However, the rendering of δικαιοῦσθαι needs a more idiomatic and semantically clear Igbo form. The Greek is a passive infinitive (''a person to be justified''), not an assertion that a person is made morally righteous.'
  naturalness: “A na-agụ mmadụ n’onye ezi omume” is understandable but is less natural and less clear in contemporary Standard Igbo than “a na-agụta mmadụ dịka onye ezi omume.” The revised word order also makes the faith/works contrast easier to follow.
  terminology: “Okwukwe,” “mmadụ,” and “ọrụ iwu” are suitable Standard Igbo equivalents and retain the Pauline expression without narrowing it. “A na-agụta mmadụ dịka onye ezi omume” conveys the declarative/accounting aspect without imposing a denominational interpretation. The footnote should offer ‘declared righteous,’ rather than ‘made righteous,’ which can imply a different nuance.
  issues:
  - severity: medium
    issue: The main rendering of δικαιοῦσθαι is awkward in modern Standard Igbo.
    rationale: Replace “a na-agụ mmadụ n’onye ezi omume” with “a na-agụta mmadụ dịka onye ezi omume” for a clear passive/declarative rendering.
  - severity: medium
    issue: The footnote’s alternative, “a na-eme ka mmadụ bụrụ onye ezi omume,” is not a suitably equivalent lexical alternative.
    rationale: It can suggest making a person righteous rather than declaring or accounting the person righteous. A declarative alternative better reflects the Greek passive and the English audit trail.
  revised_text: N’ihi na anyị kwubiri na ọ bụ site n’okwukwe ka a na-agụta mmadụ dịka onye ezi omume, e wezụga ọrụ iwu[a].
  revised_footnotes:
