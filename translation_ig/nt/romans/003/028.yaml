base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: ig
  text: N’ihi na anyị kwubiri na ọ bụ site n’okwukwe ka a na-agụta mmadụ dịka onye ezi omume, e wezụga ọrụ iwu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a na-ekwupụta na mmadụ bụ onye ezi omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: anyị kwubiri
  rationale: Ngwaa a na-egosi nkwubi okwu Pọl sitere n’echiche na arụmụka o mere; “anyị kwubiri” bụ Igbo doro anya ma kwekọọ n’usoro arụmụka ahụ.
- source_word: γάρ
  choice: N’ihi na
  rationale: Njikọ a na-enye ihe ndabere maka okwu gara aga; “N’ihi na” na-echekwa njikọ nkọwa ahụ n’Igbo nkịtị.
- source_word: δικαιοῦσθαι
  choice: a na-agụ ... n’onye ezi omume
  rationale: Nke a na-egosipụta infinitive passive ahụ dịka omume Chineke nke ịgụ ma ọ bụ ikwupụta mmadụ dị ka onye ezi omume, ma ghara imechi esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
- source_word: πίστει
  choice: site n’okwukwe
  rationale: “Site n’okwukwe” na-egosipụta ụzọ ma ọ bụ ihe e ji enweta ngụpụta ahụ, ma na-echekwa okwu Pọl banyere okwukwe.
- source_word: ἄνθρωπον
  choice: mmadụ
  rationale: ἄνθρωπος bụ masculine n’ụtọasụsụ Grik, ma ebe a ọ na-anọchi mmadụ n’ozuzu. “Mmadụ” na Igbo na-enye echiche ahụ nke ọma, ọ bụghị naanị nwoke.
- source_word: χωρὶς
  choice: e wezụga
  rationale: “E wezụga” na-echekwa echiche nke ikewapụ ma ọ bụ ịhapụ ọrụ iwu n’ihe Pọl na-ekwu.
- source_word: ἔργων νόμου
  choice: ọrụ iwu
  rationale: Nke a na-echekwa njikọ okwu Pọl n’etiti “ọrụ” na “iwu,” n’enweghị ime ka ọ bụrụ naanị ezi omume mmadụ n’ozuzu ma ọ bụ naanị otu ụdị iwu.
theological_decisions:
- issue: Ihe δικαιοῦσθαι pụtara n’akwụkwọ Pọl
  choice: a na-agụ mmadụ n’onye ezi omume
  alternative: a na-eme ka mmadụ bụrụ onye ezi omume
  rationale: Nhọrọ dị n’ahịrị bụ ụzọ Igbo siri gosipụta echiche ikpe ma ọ bụ nkwupụta nke ịkpọ mmadụ onye ezi omume, ma ndetu ala na-echekwa ntụgharị ọzọ nke pụrụ ịpụta mgbanwe ọnọdụ, ka a ghara idozi esemokwu ahụ n’ike.
- issue: Ụdị onye ἄνθρωπον na-ezo aka na ya
  choice: mmadụ
  alternative: nwoke
  rationale: Ọ bụ ezie na okwu Grik ahụ bụ masculine n’ụtọasụsụ, ebe a ọ na-ezo aka n’ebe mmadụ niile nọ. Okwu Igbo “mmadụ” na-enye ihe ahụ nke ọma n’enweghị ndetu ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrị ahụ na-agbaso usoro arụmụka Pọl ma na-echekwa okwu ndị bụ isi—okwukwe, ọrụ, na iwu—n’enweghị itinye nkọwa otu ụka pụrụ iche.
