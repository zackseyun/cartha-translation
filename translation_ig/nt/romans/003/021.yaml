id: ROM.3.21
reference: Romans 3:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: ig
  text: Ma ugbu a, e meela ka ezi omume nke Chineke[a][b] pụta ìhè na-enweghị Iwu ahụ; Iwu na Ndị Amụma[c] na-agbakwa ama banyere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi nke Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Ma eleghị anya, “ezi omume sitere n’aka Chineke.”
    reason: alternative_reading
  - marker: c
    text: Ya bụ, Akwụkwọ Nsọ; “Iwu na Ndị Amụma” bụ aha e ji akọwa àmà Akwụkwọ Nsọ Agba Ochie.
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Ma ugbu a
  rationale: Na-egosi ma mgbanwe siri ike n’arụmụka Pọl ma oge ọhụrụ ọ na-ekwu banyere ya.
- source_word: χωρὶς νόμου
  choice: n’agbanyeghị Iwu ahụ
  rationale: Na-egosi na mkpughe a abụghị site n’Iwu Mozis ma ọ bụ dabere n’idebe ya; ‘Iwu ahụ’ na-adaba n’ọnọdụ okwu a.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: Ọ bụ okwu Igbo a na-aghọta nke na-ejide echiche banyere ịdị ezi n’anya Chineke na ime ihe ziri ezi, ebe nkọwa ala peeji na-echekwa ụzọ ọzọ e nwere ike isi ghọta ya.
- source_word: θεοῦ
  choice: nke Chineke
  rationale: 'Na-echekwa mgbagwoju genitive Grik: ọ pụrụ izo aka n’ezi omume bụ nke Chineke, nke Chineke na-egosipụta, ma ọ bụ nke sitere n’aka ya.'
- source_word: πεφανέρωται
  choice: e meela ka … pụta ìhè
  rationale: 'Na-egosipụta perfect passive: ihe ahụ ekpugheela, ọ ka na-apụtakwa ìhè ugbu a.'
- source_word: μαρτυρουμένη
  choice: na-agbakwa ama banyere ya
  rationale: 'Na-enye participle passive ahụ n’ụzọ Igbo dị ndụ ma doo anya: Iwu na Ndị Amụma bụ ndị na-agba ama banyere ezi omume ahụ.'
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: Iwu na Ndị Amụma
  rationale: Ọ bụ aha nkewa Akwụkwọ Nsọ a maara nke na-anọchi anya àmà Akwụkwọ Nsọ mbụ, ọ bụghị naanị iwu dị iche iche na ndị amụma n’otu n’otu.
theological_decisions:
- issue: Ihe genitive pụtara na δικαιοσύνη θεοῦ
  choice: ezi omume nke Chineke
  alternative: ezi omume sitere n’aka Chineke
  rationale: Isi okwu ahụ na-echekwa ohere na ọ bụ ezi omume Chineke n’onwe ya na ọrụ ziri ezi ya, ma ghara imechi ohere na ọ bụ ezi omume ọ na-enye mmadụ.
- issue: Mmekọrịta χωρὶς νόμου na àmà Iwu ahụ
  choice: Ezi omume ahụ apụtala ìhè n’agbanyeghị Iwu ahụ, ma Iwu ahụ na-agba ama banyere ya
  alternative: Ezi omume ahụ pụtara n’enweghị iwu ọ bụla
  rationale: 'Nke a na-echekwa esemokwu Pọl kpachapụrụ anya tinye: ọ bụghị site n’Iwu ka ezi omume ahụ si pụta, ma Iwu na Ndị Amụma na-akwado ya.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ ‘e meela ka … pụta ìhè’ iji chekwaa ọnọdụ perfect, ebe ‘na-agbakwa ama banyere ya’ na-eme ka njikọ àmà ahụ doo anya n’Igbo. Ihe nrịbama ala peeji niile [a], [b], [c] dị n’ederede isi.
