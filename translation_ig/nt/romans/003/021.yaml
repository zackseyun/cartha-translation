  rationale: Only the rendering of χωρὶς νόμου has been changed, from the concessive “n’agbanyeghị Iwu ahụ” to “na-enweghị Iwu ahụ,” which faithfully expresses “apart from/without the Law.” The main text continues to preserve the source’s ambiguity in “ezi omume nke Chineke,” its perfect-result sense in “e meela ka … pụta ìhè,” and the present witness of the Law and Prophets.
