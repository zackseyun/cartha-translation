source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: ig
  text: Gịnịzi? Anyị ò ka ndị ọzọ mma? Mba, ọ bụghị otu a ma ọlị[a], n’ihi na anyị ebuolarị ndị Juu na ndị Grik ebubo na ha niile nọ n’okpuru mmehie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ànyị nwere uru pụrụ iche?”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ha niile nọ n’okpuru ike mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Gịnịkwa ka anyị ga-ekwu?
  rationale: Nke a na-egosi ntụgharị n’arụmụka Pọl n’ụzọ Igbo doro anya; mgbakwunye “ka anyị ga-ekwu” bụ ụzọ okwu Igbo si eme ka ajụjụ dị mkpirikpi nke Grik bụrụ nke eke.
- source_word: προεχόμεθα
  choice: Ànyị ka ha mma?
  rationale: Ngwaa a nwere nghọta a na-arụrịta ụka. Nhọrọ a na-egosi ajụjụ banyere ma ndị Juu hà nọ n’ọnọdụ ka mma, ma a hapụrụ nghọta nke ‘uru pụrụ iche’ n’ala ala peeji.
- source_word: οὐ πάντως
  choice: Mba, ọ bụghị ma ọlị
  rationale: Nke a bụ ịgọnahụ siri ike ma bụrụkwa okwu Igbo nkịtị nke na-edobe ike ahịrịokwu Grik.
- source_word: προῃτιασάμεθα
  choice: anyị ebuola ụzọ bo ... ebubo
  rationale: Nke a na-edobe echiche nke ibu ebubo e burula ụzọ kwuo n’arụmụka Pọl.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: ndị Juu na ndị Grik
  rationale: Nke a na-edobe ụzọ Grik si kpọọ ìgwè abụọ ahụ aha n’enweghị ịgbanwe ‘ndị Grik’ ka ọ bụrụ nkọwa sara mbara.
- source_word: πάντας
  choice: ha niile
  rationale: Nke a na-egosi na ebubo ahụ metụtara ndị Juu na ndị Grik niile.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: nọ n’okpuru mmehie
  rationale: Nsụgharị a dị nso n’oyiyi okwu Pọl banyere ịnọ n’okpuru mmehie, na-enweghị ịkọwapụta ya karịa ihe odide ahụ kwuru.
theological_decisions:
- issue: Ihe onye mbụ n’ọtụtụ na προεχόμεθα pụtara
  choice: Ànyị ka ha mma?
  alternative: Ànyị nwere uru pụrụ iche karịa ha?
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-atụle uru ndị Juu nwere nakwa ibu ọrụ ha. Nhọrọ bụ isi na-egosi na a naghị ekwu na ha ka ndị ọzọ mma n’omume, ebe ihe ọzọ a pụrụ ịghọta dị n’ala ala peeji iji chekwaa mgbagwoju anya nke ngwaa ahụ.
- issue: Ihe ịnọ ‘n’okpuru mmehie’ pụtara
  choice: nọ n’okpuru mmehie
  alternative: nọ n’okpuru ike mmehie
  rationale: A hapụrụ oyiyi okwu ahụ n’ụdị ya dị mkpirikpi ka a ghara ịmanye nkọwa banyere ọchịchị ma ọ bụ ike mmehie n’ime isi okwu, ebe e debere nkọwa ahụ dịka ihe ọzọ a pụrụ ịsụgharị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ okwu ndị na-ada ka arụmụka nkịtị, ma e debere ịdị arọ nke ‘n’okpuru mmehie’ na mgbagwoju anya nke προεχόμεθα site n’ala ala peeji.
