revisions:
- from: Gịnịkwa ka anyị ga-ekwu? Ànyị ka ha mma? Mba, ọ bụghị ma ọlị[a], n’ihi na anyị ebuola ụzọ bo ndị Juu na ndị Grik ebubo na ha niile nọ n’okpuru mmehie[b].
  to: Gịnịzi? Anyị ò ka ndị ọzọ mma? Mba, ọ bụghị otu a ma ọlị[a], n’ihi na anyị ebuolarị ndị Juu na ndị Grik ebubo na ha niile nọ n’okpuru mmehie[b].
  rationale: The revision removes an unnecessary expansion in the opening and avoids making the unnamed comparative target into an explicit “them.” “Ndị ọzọ” supplies the comparison required by natural Igbo without identifying a group, while footnote a preserves the viable “advantage” reading. The names, universal scope, prior-charge language, and the metaphor “under sin” are retained.
