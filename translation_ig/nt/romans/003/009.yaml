    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ha niile nọ n’okpuru ike mmehie.”
    reason: lexical_alternative
  revision_rationale: The revision removes an unnecessary expansion in the opening and avoids making the unnamed comparative target into an explicit “them.” “Ndị ọzọ” supplies the comparison required by natural Igbo without identifying a group, while footnote a preserves the viable “advantage” reading. The names, universal scope, prior-charge language, and the metaphor “under sin” are retained.
