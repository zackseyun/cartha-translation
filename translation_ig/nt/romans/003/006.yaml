  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: ig
  text: Mba, ma ọlị![a] Ma ọ bụghị ya, olee otú Chineke ga-esi kpee ụwa ikpe?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịtụgharị ya, “Ọ dịghị ma ọlị!” ma ọ bụ, n’ụzọ na-eso okwu Grik ahụ karị, “Ka ọ ghara ime!”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Mba, ma ọlị!
  rationale: Nke a bụ okwu siri ike Pọl ji jụ echiche e kwuru tupu ya. Nsụgharị a na-egosipụta ike okwu ahụ n'Igbo nkịtị ma ghara ịtụgharị ọdịdị okwu Grik ahụ n'ụzọ ga-ada ka okwu a na-adịghị ejikarị eme ihe.
- source_word: ἐπεὶ
  choice: Ma ọ bụghị ya
  rationale: N'ebe a, okwu ahụ na-egosi ihe ga-esochi ma ọ bụrụ na echiche Pọl jụrụ abụrụ eziokwu. “Ma ọ bụghị ya” na-eme ka usoro arụmụka ahụ doo anya n'Igbo.
- source_word: κρινεῖ
  choice: ga-esi kpee ... ikpe
  rationale: A na-edobe ọdịnihu nke ngwaa Grik ahụ site na “ga-,” ebe usoro “olee otú ... ga-esi” bụ ụzọ Igbo si ajụ ajụjụ a nke ọma.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: “Chineke” bụ aha Igbo a na-ejikarị akọwa otu Chineke n'ụzọ doro anya na nke kwụụrụ onwe ya.
- source_word: τὸν κόσμον
  choice: ụwa
  rationale: N'ebe a, “ụwa” na-ezo n'ụzọ sara mbara n'ebe ụwa na ndị bi na ya nọ dị ka ndị ikpe Chineke ga-eru; ọ bụkwa okwu Igbo dị mfe ma doo anya.
theological_decisions:
- issue: Ike okwu μὴ γένοιτο nke Pọl ji jụ echiche ahụ
  choice: A tụgharịrị ya dị ka nkwupụta siri ike, “Mba, ma ọlị!”
  alternative: A pụrụ ịtụgharị ya n'ụzọ na-eso ọdịdị okwu Grik ahụ karị, “Ka nke ahụ ghara ime!”
  rationale: Nhọrọ a na-echekwa nkwusiri ike nke Pọl n'ejighị okwu nwere ike ịpụta na ọ na-ekpe nanị ekpere ma ọ bụ na-ekwupụta ọchịchọ.
- issue: Mmekọrịta ἐπεὶ na ajụjụ gbasara ikpe Chineke
  choice: “Ma ọ bụghị ya” na-egosi nsonaazụ echiche ahụ Pọl jụrụ.
  alternative: “N'ihi na mgbe ahụ” ma ọ bụ “ebe ọ bụ na”
  rationale: Nke a na-eme ka arụmụka ahụ doo anya ma hapụ ajụjụ Pọl ka ọ bụrụ ajụjụ banyere otú Chineke ga-esi kpee ụwa ikpe ma ọ bụrụ na echiche ahụ abụrụ eziokwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma nwee ugwu, dee ya. “Olee otú ... ga-esi” na-enye ajụjụ ahụ usoro Igbo ebumpụta ụwa, ebe “kpee ... ikpe” na-edobe echiche ikpe ikpe nke κρίνω.
