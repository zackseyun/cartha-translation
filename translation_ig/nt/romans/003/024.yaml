- from: a na-agụkwa ha ná ndị ezi omume n’efu site n’amara ya, site ná mgbapụta dị n’ime Mesaịa Jizọs.[a][b]
  to: a na-agụ ha ná ndị ezi omume n’efu site n’amara ya, site ná mgbapụta dị n’ime Mesaịa Jizọs.[a][b]
  rationale: The sole revision removes “-kwa,” which introduced an additive meaning absent from the Greek. The remaining wording and both footnotes are retained because they accurately and naturally convey the source without imposing a doctrinal interpretation.
