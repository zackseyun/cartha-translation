  text: δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: ig
  text: a na-agụ ha ná ndị ezi omume n’efu site n’amara ya, site ná mgbapụta dị n’ime Mesaịa Jizọs.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a na-ekwupụta na ha bụ ndị ezi omume.”
    reason: lexical_alternative
  - marker: b
    text: 'Ụdị ọdịnala: “Kraịst Jizọs.”'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιούμενοι
  choice: a na-agụkwa ha ná ndị ezi omume
  rationale: Nkebi a na-egosi ihe a na-eme ha, ma “ịgụ mmadụ ná ndị ezi omume” na-eburu echiche ikpe nke δικαιόω. “-kwa” na-ejikọ nkebi participle a na ahịrịokwu bu ya ụzọ, dịka usoro Grik si dị.
- source_word: δωρεὰν
  choice: n’efu
  rationale: Nke a na-egosi na a na-enye ya dịka onyinye, ọ bụghị dịka ụgwọ ọrụ e ritere.
- source_word: τῇ αὐτοῦ χάριτι
  choice: site n’amara ya
  rationale: “Amara” bụ okwu Igbo a maara nke ọma maka χάρις n’akwụkwọ Pọl, ma ọ na-egosi obiọma na omume Chineke mmadụ na-erughị eru inweta.
- source_word: ἀπολυτρώσεως
  choice: mgbapụta
  rationale: “Mgbapụta” na-echekwa echiche nke ịtọhapụ mmadụ site n’ịkwụ ụgwọ, n’ebughị ụzọ kọwaa kpọmkwem usoro ya karịa ihe amaokwu ahụ kwuru.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dị n’ime Mesaịa Jizọs
  rationale: Nke a na-eme ka nkebi preposition ahụ kọwaa “mgbapụta,” ma na-asụgharị Χριστός dịka utu aha “Mesaịa.”
theological_decisions:
- issue: Asụsụ Pọl banyere ịgụ mmadụ n’onye ezi omume
  choice: a na-agụkwa ha ná ndị ezi omume
  alternative: a na-ekwupụta na ha bụ ndị ezi omume
  rationale: Nhọrọ bụ isi na-echekwa ike okwu ahụ n’ihe gbasara ikpe ma ghara ịkọwa ụzọ e si eme ya karịa Grik. A debere nkọwa ọzọ n’ala peeji.
- issue: Χριστός dịka utu aha
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: “Mesaịa” na-eme ka ihe utu aha Χριστός pụtara pụta ìhè; ụdị ọdịnala ka e debere n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ bụ nkebi na-aga n’ihu site n’amaokwu bu ya ụzọ; ya mere e ji “-kwa” chekwaa njikọ ahụ. E debere “amara,” “mgbapụta,” na “Mesaịa” dịka okwu nkà mmụta okpukpe ndị doro anya n’enweghị itinye nkọwa otu ụka.
