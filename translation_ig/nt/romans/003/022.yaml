  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: ig
  text: Ma ezi omume Chineke[a] site n’okwukwe n’ime Jizọs bụ́ Mesaya[b], nye ndị niile kwere ekwe; n’ihi na ọdịiche adịghị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi nke Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ikwesị ntụkwasị obi nke Jizọs bụ́ Mesaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa δικαιοσύνη n’echiche Pọl; ọ na-ahapụ ohere maka àgwà na ọrụ ziri ezi nke Chineke, tinyere ọnọdụ ziri ezi o nyere mmadụ. E debere “ikpe ziri ezi” n’ala peeji dịka nhọrọ ọzọ.
- source_word: θεοῦ
  choice: Chineke
  rationale: Njikọ “ezi omume Chineke” na-edobe genitive Grik θεοῦ n’enweghị ịkọwa ya naanị dịka ihe “sitere n’aka Chineke.”
- source_word: διὰ πίστεως
  choice: site n’okwukwe
  rationale: Nke a na-egosipụta ụzọ ma ọ bụ prostřed nke διὰ na πίστις, ma jiri okwu Igbo a na-aghọta nke ọma maka okwukwe.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ́ Mesaya
  rationale: A sụgharịrị Χριστός dịka aha-ọkwa “Mesaya,” ọ bụghị dịka aha ezinụlọ; “bụ́” na-eme ka aha-ọkwa ahụ daa nke ọma n’Igbo.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: maka ndị niile kwere ekwe
  rationale: Nke a bụ Igbo eke nke na-edobe oke zuru ụwa ọnụ nke πάντας na omume nkwere ekwe nke participle πιστεύοντας.
- source_word: διαστολή
  choice: ọdịiche
  rationale: “Ọdịiche” na-egosipụta na e nweghị nkewa ma ọ bụ ihe dị iche n’etiti ndị a na-ekwu maka ha, n’asụsụ Igbo dị mfe ma kpọmkwem.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: okwukwe na Jizọs bụ́ Mesaya
  alternative: ikwesị ntụkwasị obi nke Jizọs bụ́ Mesaya
  rationale: Genitive a nwere nghọta abụọ a na-arụrịta ụka banyere ha. Isi ederede jiri nghọta objective-genitive a na-ahụkarị, ma ala peeji debere subjective-genitive ka a ghara imechi esemokwu dị n’ederede Grik.
- issue: δικαιοσύνη θεοῦ
  choice: ezi omume Chineke
  alternative: ikpe ziri ezi nke Chineke
  rationale: Nkebiokwu a nwere ike ịgụnye ezi omume Chineke, ọrụ ya ziri ezi, na ọnọdụ ziri ezi ọ na-enye. Isi ederede na-edobe okwu a sara mbara, ebe ala peeji na-egosi nghọta nke ikpe ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ahịrịokwu ahụ ka ọ soro njikọ “Ma” nke δὲ na usoro arụmụka gbara ya gburugburu; e tinyeghị ngwaa na-adịghị na Grik. Akara ụda dị na “bụ́” na-enyere aka igosi ọrụ ya dịka copula na-ewebata aha-ọkwa Mesaya.
