revisions:
- from: Ma ezi omume Chineke[a] site n’okwukwe na Jizọs bụ́ Mesaya[b], maka ndị niile kwere ekwe; n’ihi na ọdịiche adịghị.
  to: Ma ezi omume Chineke[a] site n’okwukwe n’ime Jizọs bụ́ Mesaya[b], nye ndị niile kwere ekwe; n’ihi na ọdịiche adịghị.
  rationale: The revision clarifies the objective-genitive main-text reading of πίστεως Ἰησοῦ Χριστοῦ in idiomatic Standard Igbo and more closely represents the directional scope of εἰς πάντας. The alternative subjective-genitive reading and the δικαιοσύνη/justice alternative remain explicitly footnoted, preserving the source’s disputed ambiguities.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders δικαιοσύνη θεοῦ, preserves the debated πίστεως Ἰησοῦ Χριστοῦ construction through a main-text choice and footnote, includes the universal scope of πάντας τοὺς πιστεύοντας, and renders διαστολή accurately. However, “okwukwe na Jizọs” can naturally be read as “faith and Jesus” or “faith with Jesus” in Igbo, rather than clearly marking Jesus as the object of faith. “n’ime Jizọs” makes the intended objective-genitive reading clear. “nye” better reflects εἰς as the extension/recipient of the righteousness than “maka,” which can suggest purpose or benefit.
  naturalness: The revised wording uses clear, contemporary Standard Igbo. “site n’okwukwe n’ime Jizọs bụ́ Mesaya” is idiomatic Christian Igbo and removes the ambiguity created by “na.” “nye ndị niile kwere ekwe” also gives the clause a more natural and precise flow.
  terminology: “ezi omume Chineke” is an appropriate broad rendering of δικαιοσύνη θεοῦ, while the footnote responsibly retains “ikpe ziri ezi” as a lexical alternative. “Mesaya” properly treats Χριστός as a title. The alternative “ikwesị ntụkwasị obi” appropriately preserves the possible subjective-genitive reading without imposing it on the main text.
  issues:
  - severity: medium
    issue: The phrase “okwukwe na Jizọs” does not clearly express faith in Jesus.
    rationale: In Standard Igbo, na can coordinate nouns or mean “with,” so this phrasing is grammatically and semantically less precise than required for the chosen objective-genitive reading. “okwukwe n’ime Jizọs” clearly identifies Jesus as the object of faith.
  - severity: low
    issue: “maka ndị niile kwere ekwe” is less exact for εἰς πάντας.
    rationale: Although understandable, maka often conveys “for/on behalf of.” “nye ndị niile kwere ekwe” more directly conveys the righteousness extending to all believers.
  revised_text: Ma ezi omume Chineke[a] site n’okwukwe n’ime Jizọs bụ́ Mesaya[b], nye ndị niile kwere ekwe; n’ihi na ọdịiche adịghị.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi nke Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’ikwesị ntụkwasị obi nke Jizọs bụ́ Mesaya.”
    reason: alternative_reading
  revision_rationale: The revision clarifies the objective-genitive main-text reading of πίστεως Ἰησοῦ Χριστοῦ in idiomatic Standard Igbo and more closely represents the directional scope of εἰς πάντας. The alternative subjective-genitive reading and the δικαιοσύνη/justice alternative remain explicitly footnoted, preserving the source’s disputed ambiguities.
