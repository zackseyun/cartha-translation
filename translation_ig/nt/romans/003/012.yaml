  to: Mmadụ niile akpafuola; ha niile aghọọla ndị na-abaghị uru.[a] Ọ dịghị onye na-eme ihe ọma,[b] ọ dịghị ọbụna otu onye.
  rationale: The revision removes the unsupported qualifier “right” while replacing an awkward construction with idiomatic Standard Igbo. It maintains the Greek perfective/resultative force through “akpafuola” and “aghọọla,” retains the collective force of ἅμα in “ha niile,” and preserves the emphatic conclusion. Footnote markers remain attached to the terms they explain.
