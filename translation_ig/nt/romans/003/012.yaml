review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the universal scope, the collective result, the twofold negation, and the emphatic final exclusion. However, “n'ụzọ ziri ezi” (“from the right/correct way”) imports a qualification not expressed by ἐξέκλιναν. A direct idiomatic rendering as “akpafuola” conveys the moral turning aside without that addition.
  naturalness: “Esiwala n'ụzọ ziri ezi wezuga onwe ha” is cumbersome and not idiomatic Standard Igbo. “Mmadụ niile akpafuola” is natural, concise, and suitable for the sober register of Romans. The remaining clauses read naturally.
  terminology: “Ihe ọma” is an appropriate contextual rendering of χρηστότητα; the footnote preserves “ịdị mma” and “obiọma” as lexical possibilities. “Ndị na-abaghị uru” adequately represents the resultant sense of ἠχρεώθησαν without overinterpreting it as moral corruption.
  issues:
  - severity: medium
    issue: The phrase “n'ụzọ ziri ezi” adds “right/correct” to the Greek.
    rationale: ἐξέκλιναν means “turned aside/deviated,” but the source does not explicitly specify “from the right way.” The addition narrows and interprets the expression beyond the source wording.
  - severity: low
    issue: The opening verbal expression is unnatural in Standard Igbo.
    rationale: “Esiwala n'ụzọ ziri ezi wezuga onwe ha” is syntactically heavy. “Akpafuola” expresses the completed deviation idiomatically and preserves the intended sense.
  revised_text: Mmadụ niile akpafuola; ha niile aghọọla ndị na-abaghị uru.[a] Ọ dịghị onye na-eme ihe ọma,[b] ọ dịghị ọbụna otu onye.
