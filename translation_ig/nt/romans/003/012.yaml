  register: Asụsụ Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. E ji ahịrịokwu ndị sitere n’okike mee ka nkwusi ike na mmegharị dị n’akwụkwọ Grik pụta ìhè.
