  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: ig
  text: Mmadụ niile akpafuola; ha niile aghọọla ndị na-abaghị uru.[a] Ọ dịghị onye na-eme ihe ọma,[b] ọ dịghị ọbụna otu onye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “aghọọla ndị na-abaghịzi uru” ma ọ bụ “aghọọla ndị rụrụ arụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị χρηστότητα dịka “ịdị mma” ma ọ bụ “obiọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Mmadụ niile
  rationale: Ọ na-egosipụta na okwu a metụtara mmadụ niile; itinye “mmadụ” na-eme ka Igbo doo anya n’agbanyeghị na aha ahụ adịghị kpọmkwem na Grik.
- source_word: ἐξέκλιναν
  choice: esiwala n'ụzọ ziri ezi wezuga onwe ha
  rationale: Ọ na-egosipụta isi n'ụzọ ezi omume pụọ, ma na-echekwa echiche nke ihe merela nke nwere ọnọdụ na-adịgide.
- source_word: ἅμα
  choice: ha niile
  rationale: N’ebe a, ọ na-egosi ọnọdụ ha niile nwere ọnụ, ọ bụghị nanị na ihe ahụ mere n’otu oge.
- source_word: ἠχρεώθησαν
  choice: aghọọla ndị na-abaghị uru
  rationale: Ọ na-echekwa ike nke ntule ọjọọ dị na Grik na echiche nke ịghọ ihe na-abaghịzi uru.
- source_word: ποιῶν
  choice: na-eme
  rationale: Ọ bụ usoro Igbo sitere n’okike nke na-egosipụta omume mmadụ na-eme.
- source_word: χρηστότητα
  choice: ihe ọma
  rationale: Ọ na-enye echiche ezi omume n’ụzọ doro anya, ebe ihe odide ala peeji na-echekwa nkọwa ọzọ nke obiọma.
- source_word: οὐκ ἔστιν
  choice: Ọ dịghị onye
  rationale: Ọ bụ Igbo nke oge a, doro anya, nke na-echekwa nkwuwa okwu nke ngọnarị ahụ.
- source_word: ἕως ἑνός
  choice: ọ dịghịdị otu onye
  rationale: 'Ọ na-egosipụta nkwusi ike nke akpaalaokwu Grik ahụ: ọbụna otu onye adịghị.'
