id: ROM.3.30
reference: Romans 3:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: ig
  text: Ebe ọ bụ na Chineke bụ otu[a], ọ bụ ya ga-agụ ndị e biri úgwù ná ndị ezi omume n’ihi okwukwe, ga-agụkwa ndị a na-ebighị úgwù[b] ná ndị ezi omume site n’okwukwe.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụrụ n’ezie na Chineke bụ otu.”
    reason: alternative_reading
  - marker: b
    text: N’asụsụ Grik, e ji okwu ndị a na-asụgharị “ibi úgwù” na “anaghị ibi úgwù”; ha na-ezo aka n’ebe a na ndị e biri úgwù na ndị a na-ebighị úgwù.
    reason: cultural_note
  - marker: c
    text: 'Pọl ji ụzọ okwu abụọ dị iche: “n’ihi okwukwe” na “site n’okwukwe.” O nwere ike ịbụ na ha bụ naanị ụzọ okwu abụọ pụtara otu ihe, ọ bụghị ọdịiche siri ike.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: Ebe ọ bụ na
  rationale: N’arụmụka a, okwu ahụ na-adabere n’ihe Pọl na ndị ọ na-agwa kwenyere ọnụ—na Chineke bụ otu—ọ bụghị na ọ na-enwe obi abụọ. Ihe odide ala peeji ka na-egosi ntụgharị nke na-edobe ọdịdị nkwenye nwere ọnọdụ.
- source_word: εἷς ὁ θεός
  choice: Chineke bụ otu
  rationale: Nke a na-edobe nkwupụta siri ike banyere ịdị-otu nke Chineke ma na-ada nke ọma n’Igbo.
- source_word: δικαιώσει
  choice: ga-agụ ... ná ndị ezi omume
  rationale: Nke a na-egosi mkpebi Chineke banyere ọnọdụ mmadụ dị ka onye ezi omume, kama ịpụta nanị na ọ na-agbanwe àgwà ya. E dekwara ya n’ọdịnihu dịka okwu Grik ahụ dị.
- source_word: περιτομήν
  choice: ndị e biri úgwù
  rationale: Aha ihe omume ahụ na-anọchi anya ndị mmadụ e biri úgwù; ntụgharị a na-eme ka ihe ọ pụtara doo anya n’Igbo n’etinyeghị ‘ndị Juu’ n’ime isiokwu.
- source_word: ἐκ πίστεως
  choice: n’ihi okwukwe
  rationale: Nke a na-egosi okwukwe dịka ihe ndabere, ma na-edobekwa ọdịiche dị n’etiti ἐκ na διά.
- source_word: ἀκροβυστίαν
  choice: ndị a na-ebighị úgwù
  rationale: Aha nkịtị Grik ahụ na-anọchi anya ndị mmadụ a na-ebighị úgwù; a zere ịkọwa ya kpọmkwem dịka ‘ndị mba ọzọ.’
- source_word: διὰ τῆς πίστεως
  choice: site n’okwukwe
  rationale: ‘Site n’ọkwukwe’ na-egosi ụzọ ma na-edobe ọdịiche okwu Grik a nwere na ἐκ πίστεως, n’agbanyeghị na ha nwere ike ịbụ ụzọ okwu abụọ pụtara otu ihe ebe a.
- source_word: πίστεως
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa πίστις n’ọnọdụ a.
theological_decisions:
- issue: Ma Pọl ọ na-egosi ọdịiche nkà mmụta okpukpe n’etiti ἐκ πίστεως na διὰ τῆς πίστεως
  choice: E debere ọdịiche ahụ dịka ‘n’ihi okwukwe’ na ‘site n’okwukwe,’ ma a kọwaghị ya dịka ọdịiche ozizi siri ike.
  alternative: Ịsụgharị ha abụọ ‘site n’okwukwe,’ ma ọ bụ ịkọwa nke mbụ dịka ihe ndabere, nke abụọ dịka ụzọ, n’ụzọ siri ike.
  rationale: Asụsụ Grik ji mbuụzọ abụọ dị iche, ya mere o kwesịrị ka ntụgharị gosipụta nke ahụ. Ma ọnọdụ okwu ahụ anaghị amanye ka a kpebie na Pọl na-akụzi ọdịiche ozizi kpọmkwem n’etiti ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ibi úgwù’ bụ okwu omenala a maara nke ọma; ‘ga-agụ ... ná ndị ezi omume’ na-edobe echiche ikpe nke δικαιόω n’enweghị itinye ozizi otu ụka pụrụ iche.
