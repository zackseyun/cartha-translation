revisions:
- from: Ànyị na-esitezi n’okwukwe eme ka iwu ghara ịdị ire? Mba, ya adịla otú ahụ! Kama nke ahụ, anyị na-eme ka iwu guzosie ike.[a]
  to: Ọ̀ bụ site n’okwukwe ka anyị na-eme ka iwu ahụ ghara ịdị irè? Mba! Ọ gaghị adị otú ahụ! Kama nke ahụ, anyị na-akwado iwu ahụ.[a]
  rationale: 'The revision preserves the Greek argument and ambiguity: faith is the means mentioned in the question; μὴ γένοιτο remains an emphatic repudiation; and the final clause affirms rather than nullifies the law. It uses idiomatic modern Standard Igbo, marks the law as the definite referent in context, and keeps “make the law stand firm” as a legitimate lexical alternative to “uphold the law.”'
  reviewer_model: gpt-5.6-terra
