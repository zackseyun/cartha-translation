  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: ig
  text: Ọ̀ bụ site n’okwukwe ka anyị na-eme ka iwu ahụ ghara ịdị irè? Mba! Ọ gaghị adị otú ahụ! Kama nke ahụ, anyị na-akwado iwu ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “anyị na-eme ka iwu ahụ guzosie ike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: iwu
  rationale: N’ebe a, okwu a na-ezo aka n’iwu ahụ Pọl na-atụle, ya bụ Iwu/Torah; n’Igbo, ihe gbara ya gburugburu na-eme ka ihe a na-ezo aka doo anya n’enweghị mkpa itinye okwu ọzọ.
- source_word: οὖν
  choice: zi
  rationale: Mgbakwunye “-zi” n’ime “na-esitezi” na-egosi nkwubi okwu ajụjụ a sitere n’ihe Pọl kwuru tupu ya, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: καταργοῦμεν
  choice: eme ka … ghara ịdị ire
  rationale: Nkebiokwu a na-egosi ime ka ihe gharazie inwe ike ma ọ bụ uru iwu nwere, n’ebughị ụzọ kpebie na ihe ọ pụtara bụ ikpochapụ iwu kpamkpam.
- source_word: διὰ τῆς πίστεως
  choice: na-esite … n’okwukwe
  rationale: Nke a na-echekwa echiche nke διά na genitive, ya bụ na okwukwe bụ ụzọ ma ọ bụ ihe e ji eme ihe a na-ajụ maka ya.
- source_word: μὴ γένοιτο
  choice: Mba, ya adịla otú ahụ!
  rationale: Nke a bụ ịjụ echiche ahụ n’ike, ọ bụghị naanị ịza ajụjụ ahụ nwayọọ.
- source_word: ἀλλὰ
  choice: Kama nke ahụ
  rationale: Ọ na-egosi mgbanwe siri ike site n’ihe Pọl jụrụ gaa n’ihe ọ na-ekwusi ike.
- source_word: ἱστάνομεν
  choice: anyị na-eme ka iwu guzosie ike
  rationale: Nkebiokwu a na-echekwa ihe oyiyi nke ime ka ihe guzo ma na-egosi ịkwado ịdịgide na ịdị ire nke iwu ahụ, ọ bụghị imepụta iwu ọhụrụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti okwukwe na iwu
  choice: anyị na-eme ka iwu guzosie ike
  alternative: anyị na-akwado iwu
  rationale: Grik nwere ike ịpụta ‘ime ka o guzosie ike,’ ‘ịkwado,’ ma ọ bụ ‘ime ka o dịgide.’ Nsụgharị a na-echekwa obosara okwu ahụ na mmegide ya na ‘ime ka iwu ghara ịdị ire,’ n’etinyeghị nkọwa pụrụ iche nke otu ụka.
translation_notes:
  register: E ji asụsụ Igbo izugbe, nke dị ugbu a ma nwee ugwu, dee ya. Ajụjụ ahụ na azịza siri ike so ya na-echekwa ụdị arụmụka Pọl, ebe “mee ka iwu guzosie ike” na-anọgide nso n’ihe Grik na-ekwu ma bụrụkwa okwu ndị nkịtị ga-aghọta.
