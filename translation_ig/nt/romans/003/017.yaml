  text: καὶ ὁδὸν εἰρήνης οὐκ ἔγνωσαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/017.yaml
  text: and they have not known the way of peace[a].
translation:
  language: ig
  text: ha amaghịkwa ụzọ udo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “okporo ụzọ udo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: -kwa
  rationale: E ji mgbakwunye “-kwa” mee ka amaokwu a nọgide n’usoro ebubo ndị Pọl na-achịkọta, n’ụzọ na-ada nke ọma n’Igbo.
- source_word: ὁδὸν
  choice: ụzọ
  rationale: “Ụzọ” na-echekwa ma onyinyo nke okporo ụzọ ma nghọta ya dịka ụzọ ndụ ma ọ bụ omume mmadụ.
- source_word: εἰρήνης
  choice: udo
  rationale: “Udo” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa εἰρήνη; n’ebe a, ọ na-akọwa ụdị ụzọ ahụ ha na-amaghị.
- source_word: οὐκ ἔγνωσαν
  choice: ha amaghị
  rationale: “Ha amaghị” na-enye aorist Grik ahụ n’Igbo nkịtị ma na-echekwa echiche nke na ha amataghị ma ọ bụ ghara ịmata ụzọ udo ahụ.
theological_decisions: []
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mkpirikpi ma dị ùgwù. E tinyere “-kwa” n’ahịrịokwu ahụ iji gosipụta njikọ ya na ebubo ndị bu ya ụzọ.
