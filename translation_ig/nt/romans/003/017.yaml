  source_fidelity: The draft accurately renders καὶ ὁδὸν εἰρήνης οὐκ ἔγνωσαν. “Ha amaghịkwa” preserves both the negated aorist sense (“they did not know”) and the connective force of καὶ within Paul’s continuing indictment; “ụzọ udo” faithfully represents “way of peace.”
