id: ROM.3.25
reference: Romans 3:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: ig
  text: Onye ahụ ka Chineke mere ka ọ pụta ìhè dị ka àjà mkpuchi mmehie[a], site n'okwukwe n'ọbara ya[b], iji gosi ezi omume ya[c], n'ihi na ọ hapụrụ mmehie ndị e mere na mbụ n'enyeghị ha ntaramahụhụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ime ka iwe Chineke dajụọ,” ma ọ bụ “oche ebere”—ya bụ, mkpuchi ọlaedo nke igbe ọgbụgba ndụ, ebe a na-efesa ọbara mkpuchi mmehie.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịghọta ya, “site n'okwukwe, sitekwa n'ọbara ya.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “ikpe ziri ezi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: mere ka ọ pụta ìhè
  rationale: Nke a na-egosi na Chineke mere ka Kraịst pụta n'ihu ọha, n'ebughị ụzọ kpebie ma okwu Grik ahụ pụtara naanị ‘gosipụtara’ ma ọ bụ ‘zubere.’
- source_word: ἱλαστήριον
  choice: àjà mkpuchi mmehie
  rationale: Okwu a bụ nke mmadụ nkịtị ga-aghọta, ma ọ na-edobe echiche sara mbara nke àjà na-ekpuchi ma na-ewepụ mmehie n'ekpebighị naanị otu nkọwa esemokwu ahụ.
- source_word: διὰ πίστεως
  choice: site n'okwukwe
  rationale: Nke a bụ ntụgharị doro anya na nke a na-eji eme ihe maka πίστις n'ebe a.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: n'ọbara ya
  rationale: Ọ na-anọ nso n'ụdị okwu Grik ma na-ahapụ njikọ kpọmkwem nke nkebiokwu ahụ ka ọ ghara ịla n'iyi.
- source_word: εἰς ἔνδειξιν
  choice: iji gosi
  rationale: Ọ na-enye ebumnuche nkebiokwu Grik ahụ n'Igbo dị mfe ma dị ugbu a.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: Nke a bụ ụzọ Igbo a na-aghọta nke ọma isi kwuo δικαιοσύνη, ebe ndetu ala na-echekwa nghọta nke ikpe ziri ezi.
- source_word: πάρεσιν
  choice: hapụrụ ... n'enyeghị ha ntaramahụhụ
  rationale: Nke a na-egosi ịgafe ma ọ bụ ịghara ịta mmehie ahụhụ ruo oge ụfọdụ, kama ime ka okwu ahụ bụrụ mgbaghara zuru ezu.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: mmehie ndị e mere na mbụ
  rationale: Ọ na-egosipụta n'ụzọ doro anya na mmehie ndị a mere tupu oge a na-ekwu maka ya.
theological_decisions:
- issue: Ntụgharị okwu ἱλαστήριον nke nwere ọtụtụ nghọta
  choice: àjà mkpuchi mmehie
  alternative: ihe ime ka iwe Chineke dajụọ; ma ọ bụ ebe mkpuchi ebere
  rationale: Isi okwu a na-edobe ọrụ àjà ahụ n'asụsụ a na-aghọta, ebe ndetu ala na-echekwa nghọta ndị ọzọ dị mkpa n'akwụkwọ nsọ.
- issue: Njikọ διὰ πίστεως na ἐν τῷ αὐτοῦ αἵματι
  choice: site n'okwukwe n'ọbara ya
  alternative: site n'okwukwe, sitekwa n'ọbara ya
  rationale: Isi ederede na-ewere ọbara Kraịst dị ka ihe okwukwe ahụ na-elekwasị anya, ma ndetu ala na-echekwa ohere na ọbara ahụ bụ ụzọ Chineke si mee ka mkpuchi mmehie ahụ dị irè.
- issue: Otu e si ghọta δικαιοσύνη n'ebe a
  choice: ezi omume ya
  alternative: ikpe ziri ezi ya
  rationale: ‘Ezi omume’ na-edobe okwu Pọl sara mbara, ebe ‘ikpe ziri ezi’ na-egosi akụkụ metụtara ikpe nke okwu ahụ nwekwara ike ibu.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Àjà mkpuchi mmehie’ na-ezere okwu nkà mmụta okpukpe siri ike, ebe ndetu ala na-edobe nghọta ndị ọzọ. Ahịrịokwu ahụ na-agbaso usoro Grik nke ọma ma na-ada ka Igbo ebumpụta ụwa.
