  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: ig
  text: N’ihi na site n’ọrụ iwu, a gaghị agụ mmadụ ọ bụla dịka onye ezi omume n’ihu ya; n’ihi na ọ bụ site n’iwu ka a na-amata mmehie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: site n’ọrụ iwu
  rationale: Nke a na-edobe njikọ dị n’etiti ‘ọrụ’ na ‘iwu’ n’enweghị ịgbakwụnye nkọwa banyere ụdị iwu ma ọ bụ ọrụ a na-ekwu maka ya.
- source_word: οὐ δικαιωθήσεται
  choice: ọ dịghị onye a ga-agụ dị ka onye ezi omume
  rationale: Ụdị a na-egosi mkpebi ma ọ bụ nkwupụta na onye ahụ bụ onye ezi omume, kama iji okwu nwere ike ịpụta naanị ime ka mmadụ bụrụ ezigbo mmadụ.
- source_word: πᾶσα σὰρξ
  choice: ọ dịghị onye
  rationale: N’okwu a, akpaalaokwu Grik ahụ na-ezo aka n’ụmụ mmadụ niile; ‘ọ dịghị onye’ bụ Igbo doro anya ma kwekọọ n’ike nkwupụta na-adịghị ekwe ka onye ọ bụla pụọ na ya.
- source_word: ἐνώπιον αὐτοῦ
  choice: n’ihu ya
  rationale: E debere okwu isi mmalite ahụ n’ụzọ dị mkpirikpi ma ghara ịkọwa onye nnọchiaha ahụ karịa ihe amaokwu gbara ya gburugburu kwuru.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: mmadụ si amata mmehie
  rationale: Nke a na-enye echiche nke ịmata mmehie nke ọma n’asụsụ Igbo nkịtị, ma na-edobe mmehie dị ka ihe iwu na-eme ka a mata.
theological_decisions:
- issue: Ihe ‘ịgụ dị ka onye ezi omume’ pụtara
  choice: E ji asụsụ mkpebi ikpe sụgharịa δικαιόω.
  alternative: ‘ime ka ọ bụrụ onye ezi omume’
  rationale: N’ebe a, ihe a na-ekwu bụ na ọrụ iwu enweghị ike iweta nkwupụta na mmadụ bụ onye ezi omume n’ihu Chineke; nsụgharị a anaghị edozi arụmụka sara mbara banyere ụzọ izi ezi si arụ ọrụ.
- issue: Oke nke ‘iwu’
  choice: E dere naanị ‘iwu’.
  alternative: ‘Iwu Mosis’ ma ọ bụ ‘iwu Chineke’
  rationale: Isi mmalite kwuru νόμος n’enweghị nkọwa ọzọ; ịgbakwụnye ‘Mosis’ ma ọ bụ ‘Chineke’ ga-emechi nghọta nke amaokwu gbara ya gburugburu ga-ekpebi.
translation_notes:
  register: 'Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro arụmụka nke Grik: ọrụ iwu adịghị eme ka a gụọ mmadụ dị ka onye ezi omume; kama, iwu na-eme ka mmadụ mata mmehie.'
