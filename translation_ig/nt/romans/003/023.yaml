  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: ig
  text: N’ihi na mmadụ niile emehiewo, ha adịghịkwa eru n’ebube Chineke[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha enweghị ebube Chineke” ma ọ bụ “ha na-enwe ụkọ n’ebube Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Nkebiokwu a bụ “ebube Chineke” nwere ike ịpụta ebube Chineke n’onwe ya, ebube e bu n’obi ka mmadụ gosipụta, ma ọ bụ ebube Chineke na-enye mmadụ.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: mmadụ niile
  rationale: N’ọnọdụ okwu a, πάντες na-emetụta mmadụ niile. Ịsị “mmadụ niile” na-eme ka nke a doo anya n’Igbo n’etinyeghị echiche ọzọ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: “N’ihi na” na-egosi na amaokwu a na-akọwa ihe e kwuru tupu ya, dịka γάρ si arụ ọrụ ebe a.
- source_word: ἥμαρτον
  choice: emehiewo
  rationale: Ụdị ngwaa a na-achịkọta eziokwu ahụ bụ na mmadụ niile mehieworo; “emehiewo” bụ okwu Igbo dị ugbu a ma na-egosikwa na ihe ahụ ka metụtara ọnọdụ ha ugbu a.
- source_word: ὑστεροῦνται
  choice: ha adịghịkwa eru
  rationale: Oge ugbu a nke ngwaa Grik na-egosi ọnọdụ na-aga n’ihu nke erughị eru ma ọ bụ enweghị ihe ahụ. “Adịghị eru” bụ ụzọ eke e si ekwu nke a n’Igbo.
- source_word: δόξης
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo kwesịrị ekwesị maka δόξα n’ebe a, ma na-echekwa ịdị omimi nke okwu ahụ n’akọwaghị ya n’otu ụzọ naanị.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: Njikọ “ebube Chineke” na-edobe genitive Grik n’ụzọ dị nkenke ma kwekọọ n’usoro okwu Igbo, n’enweghị ikpebi ma ọ bụ ebube nke Chineke, nke mmadụ kwesịrị igosipụta, ma ọ bụ nke Chineke na-enye.
theological_decisions:
- issue: Ihe “ebube Chineke” pụtara
  choice: E debere ya dịka “ebube Chineke” n’enweghị nkọwa agbakwunyere n’ahịrị isi.
  alternative: “ebube nke si n’aka Chineke,” “ebube mmadụ kwesiri igosipụta,” ma ọ bụ “ịkekọrịta n’ebube Chineke”
  rationale: Nkebiokwu Grik ahụ dị nkenke ma nwee ihe karịrị otu nghọta nwere ike ịdị. Nsụgharị ahụ echekwala esemokwu nkọwa a kama imechi ya n’otu ozizi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “mmadụ niile” mee ka isiokwu zoro ezo nke ngwaa Grik pụta nke ọma; e chekwara ọdịiche dị n’etiti ihe e mere (“emehiewo”) na ọnọdụ na-aga n’ihu (“adịghịkwa eru”).
