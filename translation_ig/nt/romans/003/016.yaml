  rationale: “Ahụhụ” bụ okwu Igbo nkịtị ma dị ugwu nke na-egosi ọnọdụ nhụjuanya na oke ihe isi ike.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: dị n’ụzọ ha
  rationale: Nke a na-echekwa onyinyo nke ụzọ dị n’asụsụ Grik, ma nwekwara ike izo aka n’omume na ụzọ ndụ ha.
- source_word: καὶ
  choice: na
  rationale: Njikọ Igbo nkịtị nke jikọtara aha abụọ ahụ.
