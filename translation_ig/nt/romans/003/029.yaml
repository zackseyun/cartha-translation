  source_fidelity: 'The translation accurately preserves the Greek rhetorical sequence: the alternative introduced by ἢ, the exclusivity of μόνον, the affirmative-answer question marked by οὐχί, and the concluding ναὶ καὶ ἐθνῶν. “Ndị mba ọzọ” appropriately represents ἐθνῶν in the contextual Jew/non-Jew contrast.'
  naturalness: The wording is clear, idiomatic Standard Igbo, and maintains the dignified rhetorical register of the passage. The repeated “Chineke” in the second question and final affirmation is natural and clarifies the ellipsis of the Greek.
  terminology: “Ndị Juu” and “ndị mba ọzọ” are suitable established terms for Jews and Gentiles/non-Jewish peoples. The lexical footnote responsibly supplies the more literal alternative without treating it as the contextual main sense.
