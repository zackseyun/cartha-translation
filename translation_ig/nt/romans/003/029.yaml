id: ROM.3.29
reference: Romans 3:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: ig
  text: Ma ọ bụ na Chineke bụ naanị Chineke nke ndị Juu? Ọ̀ bụghịkwa Chineke nke ndị mba ọzọ? Ee, ọ bụkwa Chineke nke ndị mba ọzọ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya n’ụzọ dabara mkpụrụokwu Grik nso dịka, ‘mba dị iche iche.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ma ọ bụ na
  rationale: Ọ na-ewebata ajụjụ ọzọ Pọl ji aga n’ihu n’arụmụka ya; okwu a na-ada nke ọma n’Igbo ma na-echekwa njikọ ahụ.
- source_word: Ἰουδαίων
  choice: ndị Juu
  rationale: N’ebe a, mkpụrụokwu ahụ na-egosi ndị Juu dịka otu ndị; ‘Chineke nke ndị Juu’ na-egosipụta genitive Grik n’Igbo doro anya.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa θεός. E tinyekwara ya n’ajụjụ nke abụọ ka ahịrịokwu ahụ doo anya ma bụrụ Igbo dị mma.
- source_word: μόνον
  choice: naanị
  rationale: Ọ na-echekwa echiche nke ịbụ nke otu ndị naanị ya, nke bụ isi ike ajụjụ Pọl.
- source_word: οὐχὶ καὶ
  choice: Ọ̀ bụghịkwa
  rationale: οὐχί na-egosi ajụjụ na-atụ anya azịza nkwenye; ‘ọ̀ bụghịkwa’ na-echekwa ma ụdị ajụjụ ahụ ma echiche ‘kwa’.
- source_word: ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ọdịiche Pọl mere n’etiti ndị Juu na ἔθνη, okwu a pụtara ndị na-abụghị ndị Juu. ‘Ndị mba ọzọ’ bụ okwu Igbo doro anya n’ọnọdụ a, ebe ‘mba dị iche iche’ bụ ntụgharị nso n’usoro mkpụrụokwu.
- source_word: ναὶ
  choice: Ee
  rationale: Azịza nkwenye dị mkpụmkpụ a na-echekwa ntụgharị okwu Pọl na ike nkwenye ya.
- source_word: καὶ
  choice: kwa
  rationale: ‘Kwa’ na-agbakwunye ndị mba ọzọ n’akụkụ ndị Juu ma na-echekwa echiche nke ‘ọzọkwa/also’.
theological_decisions:
- issue: Ma a ga-asụgharị ἐθνῶν dịka ‘ndị mba ọzọ’ ka ọ bụ ‘mba dị iche iche’
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: Ebe amaokwu ahụ na-etinye ndị Juu na ἔθνη n’ọdịiche, ihe a na-ekwu bụ ndị na-abụghị ndị Juu, ọ bụghị mba dịka ọchịchị ma ọ bụ ala. ‘Ndị mba ọzọ’ na-echekwa arụmụka Pọl na otu Chineke bụ Chineke nke ndị Juu nakwa nke ndị na-abụghị ndị Juu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ajụjụ abụọ ahụ na-echekwa usoro arụmụka na azịza nkwenye nke ederede Grik; e zere okwu pụrụ iche nke otu ụka.
