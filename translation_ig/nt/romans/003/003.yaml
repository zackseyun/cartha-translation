id: ROM.3.3
reference: Romans 3:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: ig
  text: Gịnịzi? Ọ bụrụ na ụfọdụ egosịghị ntụkwasị obi, enweghị ntụkwasị obi ha ọ̀ ga-eme ka ikwesị ntụkwasị obi Chineke ghara ịdị irè?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “okwukwe Chineke.” N'ụzọ nkịtị, okwu Grik ahụ bụ “okwukwe nke Chineke,” ma n'ebe a o yikarịrị ka ọ pụtara ikwesị ntụkwasị obi Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: Gịnịzi?
  rationale: Ọ bụ ntụgharị okwu dị nkenke nke na-egosi na Pọl na-ebute ajụjụ ma ọ bụ nkwubi okwu ọzọ n'arụmụka ya.
- source_word: ἠπίστησάν
  choice: ekwesịghị ntụkwasị obi
  rationale: N'ebe a, okwu ahụ nwere ike ịpụta ekweghị ekwe, ma njikọ ya na ἀπιστία na ọdịiche ya na πίστις nke Chineke na-akwado echiche nke ekwesịghị ntụkwasị obi.
- source_word: τινες
  choice: ụfọdụ
  rationale: Ọ na-egosi mmadụ ole na ole a na-akọwaghị kpọmkwem.
- source_word: ἀπιστία
  choice: enweghị ntụkwasị obi
  rationale: Nhọrọ a na-echekwa myirịta ya na ngwaa ἠπίστησάν ma mee ka ọdịiche dị n'etiti omume mmadụ na ntụkwasị obi Chineke pụta ìhè.
- source_word: πίστιν τοῦ θεοῦ
  choice: ntụkwasị obi Chineke
  rationale: Ọ bụ ezie na nkebiokwu Grik ahụ pụtara n'ụzọ nkịtị ‘okwukwe nke Chineke,’ ihe gbara ya gburugburu na-akwado ntụkwasị obi ma ọ bụ ikwesị ntụkwasị obi Chineke; a na-edebe ihe ọzọ nwere ike ịpụta na nkọwa ala peeji.
- source_word: καταργήσει
  choice: ga-eme ka ... ghara ịdị ire
  rationale: Nke a na-egosi ime ka ihe ghara ịrụ ọrụ ma ọ bụ ghara inwe ike, n'Igbo doro anya ma dị ugbu a.
theological_decisions:
- issue: Otú e si sụgharịa πίστιν τοῦ θεοῦ n'okwu Pọl a a na-arụrịta ụka banyere ya
  choice: ntụkwasị obi Chineke
  alternative: okwukwe Chineke / okwukwe nke Chineke
  rationale: Ọdịiche dị n'etiti ἀπιστία mmadụ na πίστις Chineke na-akwado echiche nke ntụkwasị obi Chineke, ma ihe odide Grik ka nwere nghọta ọzọ; ya mere e gosiri ya na nkọwa ala peeji kama idozi esemokwu ahụ nwayọọ nwayọọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ekwesịghị ntụkwasị obi / enweghị ntụkwasị obi / ntụkwasị obi Chineke’ iji chekwaa njikọ okwu na ọdịiche dị n'ahịrịokwu Grik, ebe nkọwa ala peeji na-echekwa nghọta ọzọ nke πίστις.
