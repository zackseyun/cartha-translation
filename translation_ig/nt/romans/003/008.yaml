id: ROM.3.8
reference: Romans 3:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: ig
  text: Gịnịkwa mere anyị na-agaghị asị—dị ka a na-ekwutọ anyị, dịkwa ka ụfọdụ na-ekwu na anyị na-asị—“Ka anyị mee ihe ọjọọ ka ihe ọma wee pụta”? Ikpe a mara ha ziri ezi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N''ụzọ na-esochi usoro okwu Grik nso karị: “Ọ bụghịkwa—dị ka a na-ekwutọ anyị, dịkwa ka ụfọdụ na-ekwu na anyị na-asị—‘Ka anyị mee ihe ọjọọ ka ihe ọma wee pụta’?”'
    reason: lexical_alternative
  - marker: b
    text: “Ha” na-ezo aka n'ụfọdụ ndị na-ekwu ebubo a ma ọ bụ na-akwado ụdị echiche a.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: a na-ekwutọ anyị
  rationale: N'ebe a, okwu ahụ pụtara ịkatọ mmadụ site n'ịkọwahie ihe ọ na-ekwu, ọ bụghị ikwulu Chineke kpọmkwem; “ikwutọ” na-enye echiche ahụ n'Igbo nkịtị.
- source_word: φασίν τινες
  choice: ụfọdụ na-ekwu
  rationale: Nke a na-anọchi anya nkwupụta e kwuru na ụfọdụ na-eme, na-agbakwụghị ihe karịrị okwu Grik ahụ.
- source_word: λέγειν
  choice: na anyị na-asị
  rationale: “Ịsị” bụ nsụgharị kpọmkwem ma dị mfe; “anyị na-akụzi” ga-abụ nkọwa agbakwunyere.
- source_word: Ποιήσωμεν
  choice: Ka anyị mee
  rationale: Subjunctive onye mbụ ọtụtụ bụ okwu agbamume, ya mere “Ka anyị mee” dabara nke ọma.
- source_word: τὰ κακὰ
  choice: ihe ọjọọ
  rationale: Adjective e ji article mee noun na-ezo aka n'ihe ndị dị njọ; “ihe ọjọọ” bụ okwu Igbo doro anya ma bụrụkwa nke e ji eme ihe.
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: ka ihe ọma wee pụta
  rationale: Nke a na-edobe echiche ebumnuche ma ọ bụ ihe ga-esi na ya pụta nke ἵνα, n'Igbo na-aga were were.
- source_word: κρίμα
  choice: Ikpe a mara ha
  rationale: N'ebe a κρίμα bụ ikpe ikpeazụ na-adịghị mma; ahịrịokwu Igbo a na-egosi mkpebi ikpe megide ha.
- source_word: ἔνδικόν
  choice: ziri ezi
  rationale: “Ziri ezi” na-edobe ma echiche ikpe ziri ezi ma echiche omume ziri ezi dị n'okwu ahụ.
- source_word: καὶ μὴ
  choice: Gịnịkwa mere anyị na-agaghị asị
  rationale: Grik ahụ hapụrụ akụkụ okwu n'ihi na ọ na-aga n'ihu n'arụmụka amaokwu gara aga. Ime ya ajụjụ zuru ezu na-eme ka ọ doo anya n'Igbo n'etinyeghị echiche ọhụrụ.
theological_decisions:
- issue: Onye nnọchiaha ὧν na-ezo aka na ya
  choice: “ha” na-ezo aka n'ụfọdụ ndị na-ekwu ebubo a ma ọ bụ na-akwado echiche ahụ
  alternative: Ịghọta ya dị ka ikpe ọmụma nke ndị na-eme ihe ọjọọ ka ezi ihe wee pụta n'ozuzu
  rationale: Ihe kacha nso n'usoro okwu bụ “ụfọdụ” ndị na-ekwu na Pọl na ndị ya na ha nọ na-akụzi echiche ahụ. E tinyere nkọwa a na ndetu kama ime ka isi ederede kwuo karịa Grik.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ajụjụ arụmụka ahụ, okwu a na-ebo ha n'ọnụ, na ụda ikpe ziri ezi nke njedebe. Akara ndetu [a] na [b] dị n'isi ederede.
