id: ROM.3.10
reference: Romans 3:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Οὐκ ἔστιν δίκαιος οὐδὲ εἷς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: ig
  text: 'Dị ka e dere: “Ọ dịghị onye ezi omume, ọbụnadị otu onye.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Dị ka
  rationale: Ọ na-ewebata ihe e hotara n’Akwụkwọ Nsọ n’ụzọ Igbo si ekwu ya nke ọma, ma kwekọọ na γέγραπται.
- source_word: γέγραπται
  choice: e dere ya
  rationale: Nke a na-egosipụta usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ; ọ na-echekwa echiche nke ihe e dere nke ka dị irè.
- source_word: ὅτι
  choice: 'sị:'
  rationale: N’Igbo, “sị” na akara ntụpọ abụọ na-ewebata okwu a hotara n’ụzọ doro anya ma dị ụtọ karịa ịsụgharị ὅτι dịka njikọokwu nkịtị.
- source_word: Οὐκ ἔστιν
  choice: Ọ dịghị
  rationale: Nke a bụ ụzọ Igbo nkịtị si egosipụta ịdị adịghị ma ọ bụ na mmadụ ọ bụla adịghị n’ụdị a kwuru.
- source_word: δίκαιος
  choice: onye ezi omume
  rationale: “Onye ezi omume” na-echekwa echiche banyere mmadụ ziri ezi n’omume na n’ọnọdụ ya n’ihu Chineke, na-enweghị ịgbakwunye nkọwa ozizi pụrụ iche.
- source_word: οὐδὲ εἷς
  choice: ọ bụladị otu onye
  rationale: 'Nke a na-echekwa ike nkwusi okwu Grik ahụ: e nweghị ọbụna otu onye a ga-ewepụ n’okwu ahụ.'
theological_decisions:
- issue: Ma a ga-eme ka okwu ahụ bụrụ naanị banyere onye ọ bụla n’otu n’otu, ka a ga-echekwa nkwupụta ya zuru ụwa ọnụ ma sie ike.
  choice: Ọ dịghị onye ezi omume
  alternative: Ọ dịghị onye bụ onye ezi omume
  rationale: Nhọrọ ahụ dị nkenke, dị eke n’Igbo, ma na-echekwa ịdị zuru ụwa ọnụ na ike nke okwu Grik ahụ, n’ebughị ụzọ kọwaa ma ọ bụ belata esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: Standard Igbo nke oge a; asụsụ dị nsọ ma dị mfe nghọta nye ndị nkịtị. E ji usoro okwu sitere n’Igbo mee ka amaokwu ahụ daa nke ọma, ebe a na-echekwa ịdị nkenke na nkwusi ike nke Grik.
