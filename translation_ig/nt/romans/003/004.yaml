id: ROM.3.4
reference: Romans 3:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: ig
  text: 'Mba, ọ gaghị adị otú ahụ ma ọlị! Kama, ka Chineke bụrụ onye eziokwu, ka mmadụ ọ bụla bụrụkwa onye ụgha, dị ka e dere:


    “Ka e wee gosi na i ziri ezi n''okwu gị,[a]

    ka i wee merie mgbe a na-ekpe gị ikpe.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka e wee mee ka a mata na i ziri ezi,” ma ọ bụ “ka e wee gosi na ikpe ziri ezi dịrị gị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mgbe ị na-ekpe ikpe.” Nke a na-esochi okwu Hibru nke Abụ Ọma 51:4 kpọmkwem karịa, ebe a na-agụkarị okwu Grik dị na Ndị Rom dịka “mgbe a na-ekpe gị ikpe.”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Mba, ka ọ ghara ịdị otú ahụ ma ọlị!
  rationale: Nke a na-egosipụta nkwụsi ike Pọl ji jụ echiche ahụ, ma na-edobekwa ọdịdị arịrịọ siri ike nke okwu Grik ahụ.
- source_word: γινέσθω δὲ ὁ θεὸς ἀληθής
  choice: Kama, ka Chineke bụrụ onye eziokwu
  rationale: Ọ na-edobe ike iwu nke γινέσθω na ọdịiche doro anya dị n'etiti Chineke onye eziokwu na mmadụ onye ụgha.
- source_word: πᾶς δὲ ἄνθρωπος ψεύστης
  choice: ka mmadụ ọ bụla bụrụkwa onye ụgha
  rationale: ἄνθρωπος na-ezo aka n' mmadụ niile, ọ bụghị naanị nwoke; ‘mmadụ ọ bụla’ na-edobe nkesa nke πᾶς, ebe ‘onye ụgha’ bụ ntụgharị kpọmkwem nke ψεύστης.
- source_word: καθὼς γέγραπται
  choice: dị ka e dere ya
  rationale: Nke a bụ usoro e ji akpọpụta ihe e dere n'Akwụkwọ Nsọ, ma ọ bụkwa okwu Igbo dị mkpirikpi ma dị ebube.
- source_word: δικαιωθῇς ἐν τοῖς λόγοις σου
  choice: ka e wee gosi na i ziri ezi n'okwu gị
  rationale: N'ebe a, ngwaa ahụ pụtara igosi ma ọ bụ kpebie na Chineke ziri ezi, ọ bụghị ime ka ọ ghọọ onye ezi omume. Nhọrọ a na-eme ka nzube ikpe dị na Grik doo onye na-agụ Igbo anya.
- source_word: νικήσεις
  choice: ka i wee merie
  rationale: ‘I merie’ na-egosipụta mmeri n'ọnọdụ ikpe ahụ n'ụzọ doro anya ma dị mfe nghọta.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: mgbe a na-ekpe gị ikpe
  rationale: Ụdị Grik dị na Ndị Rom bụ nke a na-agụkarị dị ka nnara-eme, ya bụ na a na-ekpe onye a na-agwa okwu ikpe.
theological_decisions:
- issue: Ihe δικαιωθῇς pụtara mgbe a na-ekwu banyere Chineke
  choice: ka e wee gosi na i ziri ezi
  alternative: ka e wee gụọ gị n'onye ezi omume; ka e wee kpebie na i ziri ezi
  rationale: Amaokwu a anaghị ekwu na Chineke ghọrọ onye ezi omume; ọ na-ekwu na okwu ya na-egosi na ọ ziri ezi mgbe a na-ekpe ikpe.
- issue: Ma κρίνεσθαί σε pụtara ‘mgbe a na-ekpe gị ikpe’ ka ọ bụ ‘mgbe ị na-ekpe ikpe’
  choice: mgbe a na-ekpe gị ikpe
  alternative: mgbe ị na-ekpe ikpe
  rationale: Grik nke Ndị Rom na-akwado nnara-eme n'ụzọ kacha eke, ma Hibru nke Abụ Ọma 51:4 na-akwado echiche ‘mgbe ị na-ekpe ikpe’; e debere nke ahụ n'okpuru peeji kama idozi esemokwu ahụ n'ime ederede.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere nkwụsi ike nke mmalite amaokwu ahụ na ọdịdị ikpe dị n'okwu e hotara, ma zere okwu pụrụ iche nke otu ụka.
