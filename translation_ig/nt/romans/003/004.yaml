  to: 'Mba, ọ gaghị adị otú ahụ ma ọlị! Kama, ka Chineke bụrụ onye eziokwu, ka mmadụ ọ bụla bụrụkwa onye ụgha, dị ka e dere:


    “Ka e wee gosi na i ziri ezi n''okwu gị,[a]

    ka i wee merie mgbe a na-ekpe gị ikpe.”[b]'
  rationale: The revision preserves the Greek syntax and judicial sense while improving idiomatic Standard Igbo. It corrects the textual punctuation error and replaces an imprecise footnote alternative with natural formulations that express vindication rather than moral transformation. The disputed relationship to the Hebrew wording of Psalm 51:4 remains explicitly confined to the footnote.
