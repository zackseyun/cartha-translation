review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Paul's emphatic repudiation, the imperative contrast between God's truthfulness and universal human falseness, and the quotation's judicial imagery. The passive reading of ἐν τῷ κρίνεσθαί σε is retained, with the Psalm's alternative reflected in a footnote.
  naturalness: Most of the rendering is clear Standard Igbo. The opening is more idiomatic as “Mba, ọ gaghị adị otú ahụ ma ọlị!” The malformed doubled apostrophe in “n''okwu” must be corrected. The first footnote's phrase “ka e wee gụọ gị n'onye ezi omume” is not a natural or suitably precise alternative in this context.
  terminology: “onye eziokwu” and “onye ụgha” preserve the source contrast naturally. “Ka e wee gosi na i ziri ezi” appropriately communicates δικαιωθῇς as God's judicial vindication without suggesting that God becomes righteous. “Mgbe a na-ekpe gị ikpe” faithfully follows the most natural reading of the Greek passive.
  issues:
  - severity: medium
    issue: The first footnote includes an unnatural and potentially misleading alternative.
    rationale: “ka e wee gụọ gị n'onye ezi omume” is not idiomatic Standard Igbo for δικαιωθῇς here and can obscure the contextual sense of being shown to be in the right. It should be replaced with a natural vindication-oriented alternative.
  - severity: low
    issue: Malformed apostrophe in the quoted text.
    rationale: The form “n''okwu gị” contains a doubled apostrophe and should read “n'okwu gị.”
  - severity: low
    issue: Opening idiom is somewhat cumbersome.
    rationale: “Mba, ka ọ ghara ịdị otú ahụ ma ọlị!” is understandable, but “Mba, ọ gaghị adị otú ahụ ma ọlị!” is more natural contemporary Standard Igbo while retaining the emphatic repudiation.
