id: ROM.3.11
reference: Romans 3:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: ig
  text: Ọ dịghị onye nwere nghọta; ọ dịghị onye na-achọ[a] Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-achọ Chineke nke ukwuu,” ma ọ bụ “na-achọ ịchọta Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: na-aghọta ihe
  rationale: Okwu a na-egosi onye nwere nghọta ma ọ bụ onye ghọtara ihe. “Na-aghọta ihe” bụ ụzọ Igbo nkịtị si akọwa ya nke ọma, n’enweghị itinye nkọwa ọzọ na-adịghị n’isiokwu Grik.
- source_word: ἐκζητῶν
  choice: na-achọ
  rationale: Ngwaa a pụtara ịchọ, ọ pụkwara ibu echiche nke ịchọsi ike ma ọ bụ ịchọ ruo mgbe a chọtara. “Na-achọ Chineke” bụ asụsụ Igbo doro anya ma dịkwa mfe; e debere ike ọzọ nke ngwaa ahụ n’ala-okwu.
- source_word: οὐκ ἔστιν
  choice: Ọ dịghị onye
  rationale: Nke a na-egosipụta nkwupụta jụrụ ajụ zuru oke dị n’asụsụ Grik, ma bụrụkwa usoro okwu Igbo ebumpụta ụwa.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: onye na-aghọta ihe / onye na-achọ
  rationale: Participles ndị e ji dịka aha ka a sụgharịrị n’usoro Igbo nke “onye na-…,” nke na-echekwa ihe ha pụtara ma na-ada nke ọma n’Igbo.
- source_word: τὸν θεόν
  choice: Chineke
  rationale: “Chineke” bụ aha Igbo a na-ejikarị akọwa θεός n’ebe a, ọ na-echekwakwa onye okwu ahụ na-ezo aka na ya.
theological_decisions:
- issue: Oke nkwupụta jụrụ ajụ n’usoro amaokwu Pọl kpọpụtara
  choice: E debere “Ọ dịghị onye…” ugboro abụọ n’enweghị ime ka ike ya belata.
  alternative: Ọ dịghị onye na-aghọta nke ọma; ọ dịghị onye na-achọ Chineke n’ezie.
  rationale: Asụsụ Grik kwuru ya dịka nkwupụta zuru oke. Ịtinye “nke ọma” ma ọ bụ “n’ezie” ga-abụ ịkọwara ya karịa ihe ederede ahụ kwuru, ọ pụkwara ime ka ike nkwupụta ahụ gbanwee.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe ma dị nsọpụrụ. A họọrọ usoro okwu abụọ yiri ibe ha iji chekwaa nkwughachi na ike nke ederede Grik.
