translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ihe oyiyi atọ nke Grik—akpịrị dịka ili ghere oghe, ire dịka ngwa aghụghọ, na elò n'okpuru egbugbere ọnụ—n'enweghị ịkọwa ha karịa ihe ederede kwuru.
