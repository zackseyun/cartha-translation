revisions:
- from: Akpịrị ha bụ ili ghere oghe; ha ji ire ha aghọ aghụghọ[a]; elò ajụala dị n'okpuru egbugbere ọnụ ha.[b]
  to: Akpịrị ha bụ ili ghere oghe; ha na-eji ire ha aghọ aghụghọ[a]; elò ajụala dị n'okpuru egbugbere ọnụ ha.[b]
  rationale: A gbanwere naanị nkebi etiti ka ọ bụrụ Igbo eke ma gosipụta omume aghụghọ na-aga n’ihu nke imperfect Grik. E deziekwara nkọwa ala peeji banyere agwọ ka ọ ghara iji “ọjọọ” mee ka ihe pụtara ya ghara ido anya. Ihe oyiyi, usoro, na ihe amaokwu ahụ pụtara ka edobere.
