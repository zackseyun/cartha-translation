base_translation:
  language: en
  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: ig
  text: Akpịrị ha bụ ili ghere oghe; ha na-eji ire ha aghọ aghụghọ[a]; elò ajụala dị n'okpuru egbugbere ọnụ ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ha ji ire ha na-aghọ aghụghọ,” iji mee ka echiche nke omume na-aga n’ihu nke ngwaa Grik ahụ pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ na-ezo aka n’ụdị agwọ na-egbu egbu; a pụkwara ịsụgharị ya n’ụzọ izugbe dịka “agwọ na-egbu egbu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: ili
  rationale: “Ili” bụ okwu Igbo doro anya ma kwekọọ n’ihe oyiyi nke ọnwụ dị n’amaokwu ahụ.
- source_word: ἀνεῳγμένος
  choice: ghere oghe
  rationale: Nkebi a na-egosi ọnọdụ sitere n’ihe e meghere; “ghere oghe” na-enye Igbo sitere n’ọnụ ma na-echekwa echiche nke ili ka ghe oghe ugbu a.
- source_word: λάρυγξ
  choice: akpịrị
  rationale: “Akpịrị” bụ okwu Igbo nkịtị na nke ziri ezi maka akụkụ ahụ e kwuru n’ihe atụ a.
- source_word: ἐδολιοῦσαν
  choice: ha ji ire ha aghọ aghụghọ
  rationale: Okwu a na-egosi iji okwu aghụghọ eme ihe ugboro ugboro ma ọ bụ na-aga n’ihu; nsụgharị a bụ Igbo sitere n’ọnụ ma na-edobe echiche ahụ.
- source_word: ἰὸς
  choice: elò
  rationale: “Elò” na-egosi ihe na-egbu egbu nke agwọ, ya mere ọ dabara n’ebe a karịa okwu izugbe maka nsi.
- source_word: ἀσπίδων
  choice: ajụala
  rationale: Aha Grik ahụ na-ezo aka n’agwọ na-egbu egbu. “Ajụala” bụ okwu Standard Igbo a na-aghọta nke ọma, na-enweghị ịmanye njirimara ụdị agwọ nke na-ejighị n’aka.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: dị n'okpuru egbugbere ọnụ ha
  rationale: Nke a na-esochi ihe oyiyi anụ ahụ nke isi mmalite n’ụzọ doro anya ma bụrụkwa Igbo eke.
