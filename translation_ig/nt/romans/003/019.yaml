revisions:
- from: Anyị maara na ihe niile Iwu ahụ na-ekwu, ọ na-agwa ndị nọ n’okpuru Iwu ahụ[a], ka e wee mechie ọnụ mmadụ niile[b], ụwa dum abụrụkwa ndị ga-aza Chineke ajụjụ[c].
  to: anyị maara na ihe ọ bụla Iwu ahụ na-ekwu, ọ na-agwa ndị nọ n’okpuru Iwu ahụ[a], ka e wee mechie ọnụ ọ bụla[b], ka ụwa dum wee daa n’okpuru ikpe Chineke[c].
  rationale: The revision corrects the final clause’s singular/plural mismatch and replaces an ambiguous idiom with a natural legal expression for becoming liable to God’s judgment. It also uses parallel purpose clauses and adjusts the mouth footnote to match the revised wording. The meaning, scope, judicial metaphor, and source ambiguity concerning the precise degree of liability versus guilt are retained.
