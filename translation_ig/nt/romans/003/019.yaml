source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: ig
  text: anyị maara na ihe ọ bụla Iwu ahụ na-ekwu, ọ na-agwa ndị nọ n’okpuru Iwu ahụ[a], ka e wee mechie ọnụ ọ bụla[b], ka ụwa dum wee daa n’okpuru ikpe Chineke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ dabara nnọọ n’okwu Grik: “ndị nọ n’ime Iwu ahụ.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ka ọnụ ọ bụla mechie.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ka ụwa dum bụrụ ndị ga-aza Chineke ajụjụ,” “ka ụwa dum bụrụ ndị a mara ikpe n’ihu Chineke,” ma ọ bụ “ka ụwa dum bụrụ ndị kwesịrị ịza ajụjụ n’ihu Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Anyị maara
  rationale: A sụgharịrị Οἴδαμεν dị ka nkwupụta ihe ndị na-ekwu na ndị na-agụ maara ọnụ. A hapụrụ δέ ka usoro okwu Igbo na gburugburu amaokwu gosi njikọ ya, kama itinye okwu oge na-adịghị na Grik.
- source_word: ὁ νόμος
  choice: Iwu ahụ
  rationale: “Iwu ahụ” na-egosi iwu a maara nke ọma n’okwu Pọl, ma ọ naghị etinye nkọwa okpukpe karịrị ihe Grik kwuru.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: ndị nọ n’okpuru Iwu ahụ
  rationale: Nke a bụ okwu Igbo doro anya maka ndị nọ n’okpuru ikike Iwu ahụ; e debere ntụgharị nkịtị “ndị nọ n’ime Iwu ahụ” n’ala peeji.
- source_word: λέγει … λαλεῖ
  choice: na-ekwu … na-agwa
  rationale: Nhọrọ a na-echekwa ọdịiche dị n’etiti ngwaa Grik abụọ ahụ ma na-ada ka Igbo e ji eme ihe ugbu a.
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-egosi nzube ma ọ bụ ihe okwu Iwu ahụ na-eweta, n’ụzọ kwekọrọ n’usoro Grik.
- source_word: πᾶν στόμα φραγῇ
  choice: ka e wee mechie ọnụ mmadụ niile
  rationale: E chekwara ihe atụ nke imechi ọnụ, nke na-egosi na ọ dịghị onye nwere ihe ọ ga-ekwu iji zọpụta onwe ya n’ikpe.
- source_word: ὑπόδικος γένηται
  choice: abụrụkwa ndị ga-aza … ajụjụ
  rationale: Okwu a na-egosi ịbanye n’ọnọdụ ịbụ onye a ga-ajụ ajụjụ n’ihu onyeikpe, na-ekwughị hoo haa na a maworị onye ahụ ikpe.
- source_word: πᾶς ὁ κόσμος
  choice: ụwa dum
  rationale: Ọ na-echekwa obosara okwu ahụ, ya bụ mmadụ niile, dịka okwu Grik si dị.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: N’ahịrịokwu Igbo “ịza Chineke ajụjụ,” Chineke bụ onye mmadụ niile ga-aza ajụjụ nye, nke kwekọrọ na dative Grik.
theological_decisions:
- issue: Ike okwu ikpe dị na ὑπόδικος n’ihe gbasara ikpe Chineke
  choice: ụwa dum abụrụkwa ndị ga-aza Chineke ajụjụ
  alternative: ụwa dum abụrụ ndị ikpe mara n’ihu Chineke; ma ọ bụ ụwa dum adaba n’okpuru ikpe Chineke
  rationale: Nhọrọ a na-echekwa echiche ụlọikpe na ibu ọrụ n’ihu Chineke, ma ọ naghị eme ὑπόδικος ka ọ bụrụ nkwupụta siri ike karịa ya na a maworị ụwa ikpe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke “imechi ọnụ,” ma jiri “ịza Chineke ajụjụ” chekwaa ụda ụlọikpe nke amaokwu ahụ n’enweghị ịmanye otu nkọwa okpukpe.
