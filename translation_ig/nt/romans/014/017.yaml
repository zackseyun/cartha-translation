id: ROM.14.17
reference: Romans 14:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: ig
  text: N’ihi na alaeze Chineke abụghị iri ihe na ịṅụ ihe, kama ọ bụ ezi omume[a], udo na ọṅụ n’ime Mmụọ Nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ikpe ziri ezi.” Okwu Grik δικαιοσύνη nwere ike ịpụta ezi omume ma ọ bụ ikpe ziri ezi.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: alaeze
  rationale: “Alaeze” bụ okwu Igbo a na-ejikarị akọwa ọchịchị ma ọ bụ ógbè eze; n’ebe a, ọ na-echekwa obosara echiche nke ọchịchị Chineke n’enweghị ịkọwa ya n’ụzọ ga-eme ka otu akụkụ pụta naanị.
- source_word: βρῶσις καὶ πόσις
  choice: iri ihe na ịṅụ ihe
  rationale: A sụgharịrị aha omume abụọ ahụ n’ụzọ yiri ibe ha dịka omume, dịka usoro Grik si dị, ma mee ka esemokwu gbasara iri na ịṅụ ihe dị n’akụkụ amaokwu a doo anya.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” bụ ụzọ doro anya na nke a na-aghọta nke ọma isi kwuo ọnọdụ na omume ziri ezi n’ihu Chineke na n’etiti mmadụ; e debere “ikpe ziri ezi” n’okpuru peeji dịka ihe ọzọ okwu Grik ahụ nwekwara ike ịpụta.
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” na-egosi ma ịdị n’udo ma nkwekọrịta dị n’etiti ndị mmadụ, nke dabara n’arụmụka Pọl n’ebe a.
- source_word: χαρά
  choice: ọṅụ
  rationale: “Ọṅụ” bụ okwu Igbo nkịtị ma dịkwa nsọpụrụ nke na-ezipụta χαρά nke ọma.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: n’ime Mmụọ Nsọ
  rationale: Nke a na-echekwa preposition ἐν na nghọta ya dịka ọnọdụ ma ọ bụ ike e ji enweta ihe ndị a, ma na-ezo aka na Mmụọ Nsọ dịka ojiji Pọl si dị.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe kpatara ndụmọdụ e nyere n’amaokwu bu ya ụzọ, dịka γάρ si arụ ọrụ.
theological_decisions:
- issue: Otu e si sụgharị δικαιοσύνη n’akwụkwọ Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: Isi ederede jiri “ezi omume” mee ka echiche nke ịbụ na ime ihe ziri ezi pụta nke ọma, ma ihe e dere n’okpuru peeji chekwara “ikpe ziri ezi” n’ihi na δικαιοσύνη nwekwara ike ibu echiche ikpe na mmekọrịta mmadụ na ibe ya ziri ezi.
- issue: Ihe ἐν πνεύματι ἁγίῳ na-ezo aka na ya
  choice: n’ime Mmụọ Nsọ
  alternative: site na Mmụọ Nsọ
  rationale: “N’ime” na-echekwa mgbagwoju nghọta nke ἐν—ma ọnọdụ ihe ndị a dị ma ụzọ e si arụpụta ha—n’emeghị ka ọ bụrụ naanị ihe e ji mee ihe.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị nsọpụrụ. Usoro ahịrịokwu ahụ na-echekwa ntụnyere Grik dị n’etiti “iri ihe na ịṅụ ihe” na “ezi omume, udo na ọṅụ,” ebe “kama ọ bụ” na-eme ka ntụgharị ahụ bụrụ nke okike n’Igbo.
