  to: 'Ya mere, ka anyị gharakwa ikpe ibe anyị ikpe; kama, kpebienụ nke a: ka unu ghara itinye n’ụzọ nwanne nwoke[a] ihe ịsụ ngọngọ ma ọ bụ ọnyà[b].'
  rationale: The revision corrects an idiomatic and semantic problem in the rendering of τὸ μὴ τιθέναι τῷ ἀδελφῷ by explicitly locating the obstacle in the brother's path, and corrects the Igbo form for “stumbling.” It otherwise preserves the draft's source-faithful structure, register, terminology, and footnote anchors.
