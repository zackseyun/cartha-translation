id: ROM.14.13
reference: Romans 14:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: ig
  text: 'Ya mere, ka anyị gharakwa ikpe ibe anyị ikpe; kama, kpebienụ nke a: ka unu ghara itinye n’ụzọ nwanne nwoke[a] ihe ịsụ ngọngọ ma ọ bụ ọnyà[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwanne nwoke ma ọ bụ nwanne nwanyị”; okwu Grik kwuru “nwanne nwoke” n'ụdị otu, ma n'ebe a ọ na-ezo aka n'onye kwere ekwe ibe mmadụ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ihe na-eme ka mmadụ daa.” N'ebe a, “ọnyà” pụtara ihe na-eduba onye ọzọ n'ime mmehie, ọ bụghị nanị ihe na-ewute ya n'obi.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: Ya mere, ka anyị gharakwa
  rationale: “Ya mere” na-egosi nkwubi okwu sitere n'ihe e kwuru tupu ya; “ghar以kwa” na-egosi ịkwụsị omume a na-eme ugbu a.
- source_word: ἀλλήλους κρίνωμεν
  choice: ka anyị gharakwa ikpe ibe anyị ikpe
  rationale: Nke a na-egosipụta hortatory subjunctive dị ka ndụmọdụ nye mmadụ niile, ma na-edobe echiche nke ikpe ibe ha.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: kama, kpebienụ nke a
  rationale: “Kpebienụ” na-eme ka mgbanwe ihe κρίνατε pụtara n'ebe a doo anya—ime mkpebi banyere omume nke onwe—ma na-ejigide njikọ okwu ya na “ikpe” dị na mbụ.
- source_word: τὸ μὴ τιθέναι
  choice: ka unu ghara idobere
  rationale: Nke a na-egosi ọdịnaya nke mkpebi ahụ ma na-enye echiche nke itinye ihe n'ihu mmadụ ma ọ bụ n'ụzọ ya.
- source_word: πρόσκομμα
  choice: ihe ịsọ ngọngọ
  rationale: Ọ na-edobe ihe atụ nke ihe na-eme ka mmadụ sụọ ngọngọ n'ụzọ ime mmụọ ma ọ bụ n'omume.
- source_word: τῷ ἀδελφῷ
  choice: nwanne nwoke
  rationale: Ọ na-agbaso ụdị nwoke dị n'otu nke ἀδελφῷ; nkọwa ala peeji na-eme ka o doo anya na n'ebe a ọ na-anọchi anya onye kwere ekwe ibe mmadụ.
- source_word: σκάνδαλον
  choice: ọnyà
  rationale: “Ọnyà” na-edobe echiche nke ihe na-amanye ma ọ bụ na-eduba mmadụ n'ịda, kama ịkọwa ya dị ka nanị imejọ mmetụta mmadụ.
theological_decisions:
- issue: Ụdị nwoke dị n'otu nke ἀδελφῷ n'ọnọdụ ebe ọ na-anọchi anya onye kwere ekwe ibe mmadụ
  choice: nwanne nwoke
  alternative: nwanne nwoke ma ọ bụ nwanne nwanyị; onye kwere ekwe ibe mmadụ
  rationale: Isi ederede na-edobe ụdị nwoke dị n'otu nke Grik, ebe nkọwa ala peeji na-akọwa oke nrụtụ aka ya n'ime ọgbakọ ndị kwere ekwe.
- issue: Ihe σκάνδαλον pụtara n'ime ndụmọdụ gbasara omume
  choice: ọnyà
  alternative: ihe na-eme ka mmadụ daa; ihe ịsọ ngọngọ
  rationale: “Ọnyà” na-egosi ihe na-eduba onye ọzọ n'ime mmehie ma ọ bụ ọdịda ime mmụọ, ọ bụghị nanị okwu ma ọ bụ omume na-ewute ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke kwanyere ugwu ma dị mfe nghọta, dee amaokwu ahụ. A hapụrụ usoro ndụmọdụ nke mmadụ niile (“ka anyị”) na iwu nke mmadụ ọtụtụ (“kpebienụ,” “ka unu”) dịka mgbanwe dị na Grik si dị; e jikwa “ikpe… kpebie” chekwaa njikọ okwu κρίνω/κρίνατε n'ụzọ kwekọrọ n'Igbo.
