review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential οὖν, the hortatory prohibition against reciprocal judging, the shift to a plural imperative, and the twofold metaphor of πρόσκομμα/σκάνδαλον. However, "idobere nwanne nwoke" normally suggests reserving or setting something aside for a brother, rather than placing an impediment in his way. "ihe ịsọ ngọngọ" also requires correction to the idiomatic verbal noun "ihe ịsụ ngọngọ."
  naturalness: 'The proposed revision uses natural Standard Igbo: "itinye ... n’ụzọ ..." clearly conveys putting something in another''s path. The formal, exhortative register and the Greek singular/plural shift are retained.'
  terminology: '"ikpe ibe anyị ikpe" and "kpebienụ" appropriately represent the rhetorical relation of κρίνω/κρίνατε without forcing identical Igbo wording. "Ihe ịsụ ngọngọ" preserves the stumbling image, while "ọnyà" is a defensible concise equivalent for σκάνδαλον, clarified by the note.'
  issues:
  - severity: medium
    issue: '"idobere nwanne nwoke" is semantically unsuitable for τιθέναι τῷ ἀδελφῷ.'
    rationale: In contemporary Igbo, idobe commonly means keep, reserve, or put aside for someone. The Greek means placing an obstacle before/in the path of a fellow believer.
  - severity: medium
    issue: '"ihe ịsọ ngọngọ" has the wrong verbal form.'
    rationale: The idiomatic expression for stumbling is "ịsụ ngọngọ," not "ịsọ ngọngọ."
  revised_text: 'Ya mere, ka anyị gharakwa ikpe ibe anyị ikpe; kama, kpebienụ nke a: ka unu ghara itinye n’ụzọ nwanne nwoke[a] ihe ịsụ ngọngọ ma ọ bụ ọnyà[b].'
