  source_fidelity: 'The Igbo text accurately represents the SBLGNT: it retains the emphatic second-person address, both rhetorical questions, the contrast between judging and treating with contempt, the inclusive future "anyị niile," and the judicial image of standing before God''s judgment seat. "Oche ikpe Chineke" faithfully conveys τῷ βήματι τοῦ θεοῦ without importing an interpretation.'
  naturalness: The phrasing is natural, clear Standard Igbo with an appropriately sober exhortative register. "Gịnị mere i ji ekpe ... ikpe?" and "i ji eleda ... anya" are idiomatic and communicate the rhetorical rebuke well.
  terminology: '"Nwanne gị" is a natural Igbo rendering in this ecclesial context. Its broader grammatical gender is responsibly clarified in the lexical footnote without making the main text cumbersome. "Oche ikpe" preserves the legal/tribunal sense of βῆμα, and "Chineke" correctly follows the supplied SBLGNT reading.'
