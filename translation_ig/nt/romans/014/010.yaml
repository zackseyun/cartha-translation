id: ROM.14.10
reference: Romans 14:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: ig
  text: Ma gị onwe gị, gịnị mere i ji ekpe nwanne gị[a] ikpe? Ma ọ bụ gị onwe gị kwa, gịnị mere i ji eleda nwanne gị anya? N’ihi na anyị niile ga-eguzo n’ihu oche ikpe Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu e ji mee ihe bụ “nwanne nwoke”; n’ebe a ọ pụrụ izo aka n’onye otu okwukwe, ma nwoke ma nwaanyị.
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie na-agụ, “oche ikpe Kraịst.”
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Ma gị onwe gị
  rationale: “Ma” na-egosipụta ntụgharị echiche nke δέ, ebe “gị onwe gị” na-edobe nkwusi ike e tinyere na σύ.
- source_word: τί κρίνεις
  choice: gịnị mere i ji ekpe ... ikpe?
  rationale: N’ajụjụ ịdọ aka ná ntị a, τί pụtara “gịnị mere,” ebe “ikpe ... ikpe” na-edobe echiche κρίνω n’etinyeghị echiche siri ike karịa ya, dị ka ịma mmadụ ikpe na-enweghị mgbaghara.
- source_word: τὸν ἀδελφόν σου
  choice: nwanne gị
  rationale: “Nwanne” bụ okwu Igbo dị mma ma dị ndụ maka onye e jikọrọ mmadụ na ya dịka nwanne; n’ebe a ọ dabara n’echiche onye otu okwukwe. Ihe odide Grik ji okwu nwoke otu ọnụ, ya mere a kọwara nke ahụ n’okpuru peeji kama ime ka ahịrịokwu Igbo ghara ịdị mfe nghọta.
- source_word: ἢ καὶ σὺ
  choice: Ma ọ bụ gị onwe gị kwa
  rationale: Nke a na-edobe “ma ọ bụ” nke ἤ, nkwusi ike dị na σύ, na echiche mgbakwunye nke καί.
- source_word: τί ἐξουθενεῖς
  choice: gịnị mere i ji eleda ... anya?
  rationale: “Ileda mmadụ anya” na-egosi ile ya dịka onye na-abaghị uru ma ọ bụ onye a na-apụghị ịkwanyere ùgwù, nke kwekọrọ na ἐξουθενέω n’ụzọ Igbo na-asụkarị.
- source_word: πάντες γὰρ
  choice: N’ihi na anyị niile
  rationale: “N’ihi na” na-egosipụta nkọwa kpatara ajụjụ ndị ahụ, ebe “anyị niile” na-agụnye Pọl na ndị ọ na-agwa okwu.
- source_word: παραστησόμεθα
  choice: ga-eguzo n’ihu
  rationale: N’ọnọdụ ikpe a, ngwaa ahụ na-ekwu maka mmadụ ịbịa guzo n’ihu onyeikpe; nsụgharị a na-edobe ma ọdịnihu ya ma ihe oyiyi ụlọikpe ahụ.
- source_word: τῷ βήματι
  choice: oche ikpe
  rationale: βῆμα bụ oche ma ọ bụ ebe onyeikpe nọ enye ikpe. “Oche ikpe” bụ okwu doro anya nke na-edobe ihe oyiyi iwu na ikpe.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: Nke a na-asụgharị ọgụgụ SBLGNT, τοῦ θεοῦ, ozugbo dịka onye nwe oche ikpe ahụ.
theological_decisions:
- issue: Onye nwe oche ikpe ahụ
  choice: Chineke
  alternative: Kraịst
  rationale: Ihe odide Grik e nyere na-agụ τοῦ θεοῦ, “nke Chineke.” Ebe ụfọdụ akwụkwọ aka ochie na-agụ “nke Kraịst,” e debere ọdịiche ahụ n’okpuru peeji kama ijikọta ma ọ bụ dozie ọgụgụ abụọ ahụ n’ahịrịokwu bụ isi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ mbụ debere ọdịdị ajụjụ ịdọ aka ná ntị na nkwusi ike nke onye nke abụọ; “oche ikpe” na-edobe ihe oyiyi ụlọikpe nke βῆμα.
