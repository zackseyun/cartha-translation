source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: ig
  text: Otu onye na-ewere otu ụbọchị ka ọ dị mkpa karịa ụbọchị ọzọ[a], ma onye ọzọ na-ewere ụbọchị niile ka ha hà nhata[b]. Ka onye ọ bụla nwee nkwenye zuru ezu n’uche nke ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Otu onye na-ewere otu ụbọchị ka ọ dị mkpa karịa ụbọchị ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ụbọchị niile”; n’ọnọdụ okwu a, echiche ya bụ “ụbọchị niile dịka otu” ma ọ bụ “ụbọchị niile hà nhata.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka obi sie ya ike nke ọma” ma ọ bụ “ka o nwee nkwenye zuru ezu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: na-ewere … ka
  rationale: N’ebe a, κρίνω pụtara ịtụle ma ọ bụ ikpebi uru ihe bara, ọ bụghị ịma mmadụ ikpe. Okwu Igbo a na-egosipụta ntule ahụ nke ọma ma na-adabara ahịrịokwu abụọ ahụ.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: otu ụbọchị ka nke dị mkpa karịa ụbọchị ọzọ
  rationale: παρά na-egosi ntụnyere ma ọ bụ ọdịiche n’etiti ụbọchị. Nsụgharị a mere ntụnyere ahụ doo anya n’etinyeghị echiche banyere Ụbọchị Izu Ike, ụbọchị oriri, ma ọ bụ ụbọchị ibu ọnụ.
- source_word: πᾶσαν ἡμέραν
  choice: ụbọchị niile ka ha hà nhata
  rationale: N'ụzọ nkịtị, okwu Grik bụ ‘ụbọchị niile,’ ma ntụnyere dị n’ahịrịokwu ahụ na-egosi na onye nke abụọ anaghị eme ọdịiche n’etiti ụbọchị. ‘Ka ha hà nhata’ na-eme ka echiche ahụ doo anya n’Igbo.
- source_word: ἕκαστος
  choice: onye ọ bụla
  rationale: 'Ọ na-echekwa echiche nkesa nke okwu Grik: a na-agwa onye nke ọ bụla n’otu n’otu.'
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: n’uche nke aka ya
  rationale: Okwu a na-egosi uche ma ọ bụ nghọta nke onye ahụ n’onwe ya. Usoro Igbo a bụ nke doro anya ma na-emesi ‘nke aka ya’ ike.
- source_word: πληροφορείσθω
  choice: kwenye nke ọma
  rationale: Iwu a na-achọ nkwenye zuru ezu ma guzosie ike. ‘Kwenye nke ọma’ bụ okwu Igbo dị mfe nghọta nke na-ejide echiche ahụ.
theological_decisions:
- issue: Ụdị ụbọchị ndị Pọl na-ekwu banyere ha
  choice: Ịhapụ ya n’ozuzu dịka ‘ụbọchị,’ n’akọwaghị ụdị ụbọchị ha bụ.
  alternative: Ịkọwa ha dịka Ụbọchị Izu Ike, ụbọchị oriri ndị Juu, ụbọchị ibu ọnụ, ma ọ bụ ụbọchị ofufe pụrụ iche.
  rationale: Pọl ekwughị kpọmkwem ụdị ụbọchị ndị ahụ. Nsụgharị ahụ ekwesịghị idozi ajụjụ nkọwa nke amaokwu ahụ hapụrụ oghe.
- issue: Otu e si gosipụta onye nke ọ bụla na nnọchiaha onye
  choice: ‘onye ọ bụla … nke aka ya,’ nke na-arụ ọrụ n’Igbo dị ka okwu metụtara onye ọ bụla.
  alternative: Iji usoro ọtụtụ mmadụ ma ọ bụ ịgbalị itinye nwoke na nwanyị iche iche.
  rationale: Okwu Grik bụ otu onye ma nwee ọrụ nnọchianya. Usoro Igbo a na-echekwa otu onye ahụ ma ghara ime ka ọ bụrụ naanị nwoke.
translation_notes:
  register: E ji asụsụ Igbo izugbe, nke dị ùgwù ma dị mfe nghọta mee ihe. E jigidere ntụnyere dị n’etiti mmadụ abụọ ahụ, ma e tinyeghị aha ụbọchị okpukpe ọ bụla n’ihi na ihe odide Grik akọwaghị ha.
