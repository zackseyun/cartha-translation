- from: Ọ dị mma ịghara iri anụ, ịṅụ mmanya, ma ọ bụ ime ihe ọ bụla nke ga-eme ka nwanna gị[a] sụọ ngọngọ, daba n’ọnyà, ma ọ bụ daa mbà.
  to: Ọ dị mma ịghara iri anụ, ịghara ịṅụ mmanya, ma ọ bụ ime ihe ọ bụla nke ga-eme ka nwanna gị[a] sụọ ngọngọ, ka e mee ka ọ sụọ ngọngọ, ma ọ bụ daa mbà.
