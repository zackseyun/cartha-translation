source:
  edition: SBLGNT
  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: ig
  text: Ọ dị mma ịghara iri anụ, ịghara ịṅụ mmanya, ma ọ bụ ime ihe ọ bụla nke ga-eme ka nwanna gị[a] sụọ ngọngọ, ka e mee ka ọ sụọ ngọngọ, ma ọ bụ daa mbà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ọnọdụ a, “nwanna gị” nwere ike izo aka na nwanna nwoke ma ọ bụ nwanna nwanyị—ya bụ, onye gị na ya kwere ekwe.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: Ọ dị mma
  rationale: Nke a na-egosi na omume ahụ kwesịrị ekwesị ma bụrụ ihe a na-eto, n’asụsụ Igbo dị mfe ma kwụ ọtọ.
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: ịghara iri anụ
  rationale: Ọ na-edobe echiche nke izere iri anụ dị ka ihe mmadụ ji aka ya kpebie ime n’ihi ọdịmma onye ọzọ.
- source_word: μηδὲ πιεῖν οἶνον
  choice: ịṅụ mmanya
  rationale: N’usoro ahịrịokwu a, ‘ịghara’ na-achịkwa ma iri anụ ma ịṅụ mmanya; nke a na-eme ka Igbo ahụ dị ire n’enweghị ịgbagha ihe Grik pụtara.
- source_word: μηδὲ ἐν ᾧ
  choice: ma ọ bụ ime ihe ọ bụla nke ga-eme ka
  rationale: Okwu Grik a hapụrụ omume ahụ n’ụzọ e zoro ezo; Igbo chọrọ ka e tinye ‘ime ihe ọ bụla’ iji mee ka echiche ahụ doo anya n’enweghị ịgbakwunye ókè ọhụrụ.
- source_word: ὁ ἀδελφός σου
  choice: nwanna gị
  rationale: ‘Nwanna’ bụ okwu Igbo kwesịrị ekwesị n’etiti ndị kwere ekwe. O nwere ike ịgụnye nwoke ma ọ bụ nwanyị, ebe nkọwa ala peeji na-akọwa ike nnọchiteanya nke okwu Grik nwoke otu.
- source_word: προσκόπτει
  choice: sụọ ngọngọ
  rationale: Nke a na-edobe ihe atụ nke ịkụ ụkwụ n’ihe ma sụọ ngọngọ, nke Pọl ji ekwu maka ihe mgbochi n’omume ma ọ bụ n’okwukwe.
- source_word: σκανδαλίζεται
  choice: daba n’ọnyà
  rationale: Nhọrọ a na-ekewapụ okwu a na προσκόπτει ma na-egosipụta echiche nke ịbụ onye e mere ka ọ daba n’ihe na-emebi ya. Ọ naghị ebelata ya naanị ka ọ bụrụ iwe iwe n’obi.
- source_word: ἀσθενεῖ
  choice: daa mbà
  rationale: N’ebe a, okwu ahụ na-ekwu maka adịghị ike nke akọ na uche ma ọ bụ okwukwe, ọ bụghị naanị ọrịa anụ ahụ; ‘daa mbà’ na-ahapụ obosara ahụ ka ọ dị.
theological_decisions:
- issue: Ike nnọchiteanya nke ὁ ἀδελφός σου
  choice: nwanna gị, tinyere nkọwa ala peeji
  alternative: nwanne gị nwoke; onye gị na ya kwere ekwe
  rationale: Grik ahụ bụ nwoke otu, ma n’ọnọdụ a ọ na-arụ ọrụ dị ka okwu nnọchiteanya maka onye ọzọ kwere ekwe. ‘Nwanna gị’ bụ Igbo ebumpụta ụwa ma na-ezere ime ka a ghọta ya naanị dị ka nwanne nwoke nke otu ezinụlọ.
- issue: Mmekọrịta dị n’etiti προσκόπτει, σκανδαλίζεται, na ἀσθενεῖ
  choice: sụọ ngọngọ, daba n’ọnyà, ma ọ bụ daa mbà
  alternative: sụọ ngọngọ, were iwe, ma ọ bụ bụrụ onye e mere ka ọ ghara ịdị ike
  rationale: 'A hapụrụ okwu atọ ahụ iche iche dịka ha dị na Grik: ihe mgbochi na-eme ka mmadụ sụọ ngọngọ, ihe na-aghọ ọnyà, na ịda mbà. A tụgharịghị σκανδαλίζεται naanị dịka iwe n’ihi na nke ahụ nwere ike ime ka ihe metụtara mmebi okwukwe ghọọ naanị mmetụta obi.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A haziri njikọ ahịrịokwu ahụ ka ọ na-aga nke ọma n’Igbo, ma e debere ihe atụ atọ nke Grik iche iche na-enweghị ịkọwa esemokwu nkà mmụta okpukpe ahụ karịa ihe ederede kwuru.
