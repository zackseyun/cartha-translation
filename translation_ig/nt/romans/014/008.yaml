  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na anyị dị ndụ, anyị na-adị ndụ nye Onyenwe anyị[a]; ọ bụrụkwa na anyị anwụọ, anyị na-anwụ nye Onyenwe anyị. Ya mere, ma anyị dị ndụ ma anyị anwụọ, anyị bụ nke Onyenwe anyị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “maka Onyenwe anyị,” n’okwu ndị a e kwuru ugboro ugboro: “anyị na-adị ndụ nye Onyenwe anyị” na “anyị na-anwụ nye Onyenwe anyị.” Ụdị dative Grik nwere ike igosi mmekọrịta, ihe e lekwasịrị anya na ya, ma ọ bụ uru; “nye Onyenwe anyị” na-ahapụ echiche ndị ahụ ka ha dị obosara.'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyị bụ ndị Onyenwe anyị nwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: “N’ihi na” na-edobe ọrụ nkọwa nke γάρ, ebe “ọ bụrụ na” na-ebute ụzọ abụọ a na-atụle n’ụzọ Igbo na-asụ nke ọma.
- source_word: ζῶμεν / ζῶμεν
  choice: anyị dị ndụ / anyị na-adị ndụ
  rationale: E ji “dị ndụ” kwuo ọnọdụ a tụrụ aro, ma jiri “na-adị ndụ” kwuo omume ndụ n’ahịrị nke na-eso ya; nke a bụ Igbo nkịtị ma ka na-edobe otu ngwaa ahụ n’echiche.
- source_word: τῷ κυρίῳ
  choice: nye Onyenwe anyị
  rationale: “Nye” na-ahapụ obosara nke dative Grik—mmekọrịta, ntụgharị uche, ma ọ bụ uru—n’enweghị imechi ya naanị n’ọrụ a na-arụ maka Onyenwe anyị.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ Igbo a na-ejikarị eme ihe maka κύριος, ma ọ na-edobe ịdị arọ nke aha ahụ n’akụkụ Akwụkwọ Nsọ a.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: anyị anwụọ / anyị na-anwụ
  rationale: “Ịnwụ” na-enye ihe ngwaa Grik pụtara ozugbo; ọdịiche dị n’ụdị ahịrị abụọ ahụ na-eme ka Igbo bụrụ nke eke.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ahịrị abụọ bu ya ụzọ.
- source_word: τοῦ κυρίου ἐσμέν
  choice: anyị bụ nke Onyenwe anyị
  rationale: “Bụ nke” na-edobe genitive nke inwe ma na-egosi nkenke na anyị bụ ndị Onyenwe anyị nwe, n’enweghị itinye nkọwa ọzọ n’ime ederede.
theological_decisions:
- issue: Onye κύριος na-ezo aka na ya na ike aha ahụ nwere
  choice: E debere ya dịka “Onyenwe anyị” n’enweghị ịgbakwunye aha Jizọs n’amaokwu a.
  alternative: Ịsị “Onyenwe anyị Jizọs” ma ọ bụ iji okwu na-emesi ịbụ Nna Ukwu ike.
  rationale: Amaokwu na-esote na-akọwa ntụaka ahụ n’ebe Kraịst nọ, ma amaokwu a n’onwe ya kwuru naanị κύριος. Ya mere nsụgharị ahụ anaghị akọwapụta karịa ihe ederede kwuru.
- issue: Ihe “ịdị ndụ/ịnwụ nye Onyenwe anyị” pụtara
  choice: E jiri “nye Onyenwe anyị” chekwaa echiche nke mmekọrịta, ntụgharị ndụ, na ịbụ nke ya.
  alternative: “Maka Onyenwe anyị,” nke nwere ike ilekwasị anya karịa n’uru ma ọ bụ ọrụ a na-arụ maka ya.
  rationale: Dative Grik na nkwubi okwu “anyị bụ nke Onyenwe anyị” jikọrọ echiche nke ndụ na ọnwụ n’okpuru mmekọrịta na inwe; ekwesịghị imechi ya naanị n’echiche nke ije ozi.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọpụrụ ma doo ndị nkịtị anya. A haziri ahịrịokwu ahụ ka nkwughachi na nhata dị n’asụsụ Grik pụta ìhè, ma zere okwu ụka pụrụ iche nke otu òtù.
