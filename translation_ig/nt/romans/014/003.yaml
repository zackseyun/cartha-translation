id: ROM.14.3
reference: Romans 14:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: ig
  text: Onye na-eri ihe ekwesịghị ileda onye na-adịghị eri ihe anya[a]; ma onye na-adịghị eri ihe ekwesịghị ikpe onye na-eri ihe ikpe[b], n’ihi na Chineke anabatala ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ekwesịghị imeso ya nlelị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ekwesịghị ịtụ ya ikpe.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “Chineke nabatara ya.” Okwu Grik ahụ nwekwara echiche nke ịnabata mmadụ n’ime mmekọrịta.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: onye na-eri ihe
  rationale: Ọ na-egosi onye e ji omume iri ihe mara, ma na-ada nke ọma n’Igbo ma na-echekwa ọdịdị participle ahụ.
- source_word: τὸν μὴ ἐσθίοντα
  choice: onye na-adịghị eri ihe
  rationale: Nke a na-echekwa ọdịiche doro anya dị n’etiti onye na-eri ihe na onye na-adịghị eri ihe, n’ebughị nkọwa ndị ọzọ banyere ụdị nri.
- source_word: ἐξουθενείτω
  choice: ekwesịghị ileda ... anya
  rationale: ‘Ileda mmadụ anya’ bụ okwu Igbo a na-aghọta nke ọma maka iwere mmadụ dị ka onye na-abaghị uru ma ọ bụ imeso ya nlelị.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: onye na-adịghị eri ihe ekwesịghịkwa
  rationale: Mgbakwunye ‘-kwa’ na-egosipụta ntụgharị na mmekọrịta nke iwu abụọ ahụ n’ụzọ dị mma n’Igbo.
- source_word: κρινέτω
  choice: ekwesịghị ikpe ... ikpe
  rationale: Nke a na-echekwa obosara nke κρίνω dị ka ikpe mmadụ ma ọ bụ ikwu na ọ bụ onye mejọrọ, n’emeghị ka ọ bụrụ naanị ikpe ọmụma ikpeazụ.
- source_word: γὰρ
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara iwu abụọ ahụ n’ụzọ doro anya ma bụrụkwa okwu Igbo nke oge a.
- source_word: αὐτὸν
  choice: ya
  rationale: Nnọchiaha otu onye a na-echekwa enweghị nghọta zuru ezu banyere ma ọ na-arụtụ aka kpọmkwem n’onye na-eri ihe ma ọ bụ n’onye ọ bụla n’ime mmadụ abụọ ahụ.
- source_word: προσελάβετο
  choice: anabatala
  rationale: ‘Anabatala’ na-egosi na Chineke ewerela onye ahụ nabata, ma kwekọọ na echiche nke ịnabata mmadụ n’ime mmekọrịta.
theological_decisions:
- issue: Ókè ọdịiche dị n’etiti iri ihe na ịghara iri ihe
  choice: E depụtara ya nanị dị ka iri ihe na ịghara iri ihe.
  alternative: Ịkọwa ya kpọmkwem dị ka iri ụdị nri niile megide izere ụfọdụ nri ma ọ bụ ịbụ onye na-eri naanị akwụkwọ nri.
  rationale: Amaokwu ahụ n’onwe ya akọwaghị ụdị nri ma ọ bụ ihe kpatara ịghara iri ya; nsụgharị ahụ ekwesịghị ibubata nkọwa gbara ya gburugburu n’ime amaokwu a.
- issue: Onye ‘ya’ na-arụtụ aka na ya n’okwu ‘Chineke anabatala ya’
  choice: E debere nnọchiaha otu onye ‘ya’ n’enweghị idozi onye ọ bụ kpọmkwem.
  alternative: Ịsị ‘onye ahụ’ ma ọ bụ kọwaa na ọ bụ kpọmkwem onye na-eri ihe.
  rationale: Onye nọ nso dịka antecedent bụ onye na-eri ihe, ma arụmụka ahụ n’ozuzu ya metụtara onye kwere ekwe ibe ya Chineke nabatara. ‘Ya’ na-echekwa mkpirikpi na nghọta na-edochaghị anya nke Grik.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ahịrịokwu abụọ yiri ibe ha na-eme ka iwu a nyere akụkụ abụọ ahụ pụta ìhè. E debere ‘ihe’ mgbe e kwuru iri nri ka okwu ahụ daa nke ọma n’Igbo, n’agbanyeghị na e kọwaghị ụdị nri.
