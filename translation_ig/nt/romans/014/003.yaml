- from: Onye na-eri ihe ekwesịghị ileda onye na-adịghị eri ihe anya[a]; onye na-adịghị eri ihe ekwesịghịkwa ikpe onye na-eri ihe ikpe[b], n’ihi na Chineke anabatala ya[c].
  to: Onye na-eri ihe ekwesịghị ileda onye na-adịghị eri ihe anya[a]; ma onye na-adịghị eri ihe ekwesịghị ikpe onye na-eri ihe ikpe[b], n’ihi na Chineke anabatala ya[c].
