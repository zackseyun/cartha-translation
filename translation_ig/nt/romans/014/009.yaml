id: ROM.14.9
reference: Romans 14:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: ig
  text: N’ihi na ọ bụ maka nke a ka Mesaịa nwụrụ ma dịkwa ndụ ọzọ[a], ka ọ chịkwaa ma ndị nwụrụ anwụ ma ndị dị ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “dị ndụ”; ma ọ bụ n’ụzọ doro anya karị, “bilitere ọzọ na ndụ.” Okwu Grik ahụ kwuru “nwụrụ ma dị ndụ,” ebe ihe gbara ya gburugburu na-egosi ndụ mbilite n’ọnwụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: ọ bụ maka nke a
  rationale: Nkebiokwu a na-egosi nzube e mere ihe; usoro Igbo a doro anya ma bụrụkwa nke e ji ekwu okwu ugbu a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka nkọwa ma ọ bụ ihe na-akwado ya.
- source_word: Χριστὸς
  choice: Mesaịa
  rationale: A sụgharịrị aha-ọrụ Χριστός dịka ‘Mesaịa’ iji gosipụta ọrụ onye e tere mmanụ, kama iji ya dịka aha nkịtị.
- source_word: ἀπέθανεν
  choice: nwụrụ
  rationale: Nke a bụ ntụgharị kpọmkwem ma dị mfe nke ngwaa ahụ.
- source_word: ἔζησεν
  choice: dịkwa ndụ ọzọ
  rationale: Mgbe e jikọtara ya na ‘nwụrụ,’ okwu a na-atụ aka na ndụ mgbe ọnwụ gasịrị; ‘ọzọ’ na-eme ka nke ahụ doo anya n’Igbo, ebe ndetu na-echekwa ụdị ntụgharị ndị ọzọ.
- source_word: ἵνα
  choice: ka
  rationale: ‘Ka’ na-egosi nzube n'ụzọ ebumpụta ụwa n’Igbo.
- source_word: νεκρῶν
  choice: ndị nwụrụ anwụ
  rationale: Ọ bụ ụzọ Igbo a na-ahụkarị isi kpọọ ndị nwụrụ, ma na-echekwa ọdịiche ya na ndị dị ndụ.
- source_word: ζώντων
  choice: ndị dị ndụ
  rationale: Ọ bụ ntụgharị ebumpụta ụwa nke participle e ji mee aha, n’ọdịiche ya na ndị nwụrụ anwụ.
- source_word: κυριεύσῃ
  choice: ọ bụrụ onye na-achị
  rationale: Nke a na-egosipụta ngwaa nke pụtara inwe ọchịchị ma ọ bụ ịchị n’elu ndị ọzọ, n’etinyeghị aha-ọrụ na-adịghị n’ụdị ngwaa Grik ahụ.
theological_decisions:
- issue: Ihe ἔζησεν pụtara gbasara mbilite n’ọnwụ
  choice: dịkwa ndụ ọzọ
  alternative: dị ndụ; bilitere dị ndụ
  rationale: Njikọ ‘nwụrụ ma dịkwa ndụ’ na ọnọdụ amaokwu ahụ na-egosi ndụ mgbe ọnwụ gasịrị. A naghị eme ka ngwaa ahụ bụrụ naanị okwu ‘bilitere,’ ma a na-eme ka ihe ọnọdụ ahụ na-egosi pụta ìhè.
- issue: Igosipụta κυριεύσῃ dịka ọchịchị Mesaịa
  choice: ọ bụrụ onye na-achị
  alternative: ọ bụrụ Onyenwe ndị; chịwa
  rationale: Nhọrọ a na-echekwa ụdị ngwaa na echiche nke ịchị ndị nwụrụ anwụ na ndị dị ndụ, n’agbanyeghị na mgbọrọgwụ okwu ahụ nwere njikọ na κύριος.
translation_notes:
  register: Standard Igbo dị ùgwù ma dị mfe nghọta. E ji ‘Mesaịa’ mee aha-ọrụ Χριστός; e jikwara ‘onye na-achị’ chekwaa ụdị ngwaa κυριεύσῃ. Akara ndetu [a] dị n’ebe okwu metụtara ya nọ.
