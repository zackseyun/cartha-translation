review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the purpose relation, Messiah’s death and post-death life, and his dominion over the dead and the living. ‘Mesaịa’ appropriately renders the titular Χριστός, and ‘dị ndụ ọzọ’ is a defensible contextual rendering of ἔζησεν.
  naturalness: 'The final purpose clause is not idiomatic Standard Igbo: ‘ka ọ bụrụ onye na-achị ma ndị nwụrụ anwụ ma ndị dị ndụ’ leaves the relation of rulership to the two groups grammatically incomplete. A finite verbal expression with the groups as its objects is natural and direct.'
  terminology: ‘Mesaịa,’ ‘ndị nwụrụ anwụ,’ and ‘ndị dị ndụ’ are suitable. ‘Chịkwaa’ renders κυριεύσῃ as verbal dominion without importing the title ‘Onyenweanyị.’ The footnote is adjusted to use natural Igbo for the explicit resurrection-life alternative.
  issues:
  - severity: medium
    issue: The wording ‘ka ọ bụrụ onye na-achị ma ndị nwụrụ anwụ ma ndị dị ndụ’ is syntactically incomplete/unnatural.
    rationale: ‘Onye na-achị’ normally needs a complement such as ‘ndị mmadụ’ or ‘n'ebe ... nọ’; the present construction does not naturally express that Messiah rules over both groups. ‘Ka ọ chịkwaa ma ... ma ...’ clearly and idiomatically expresses the Greek κυριεύσῃ.
  - severity: low
    issue: The footnote alternative ‘bilitere dị ndụ’ is awkward Standard Igbo.
    rationale: For an explicit expression of resurrection to life, ‘bilitere ọzọ na ndụ’ is clearer and more natural, while the main text retains the lexical breadth of ἔζησεν.
