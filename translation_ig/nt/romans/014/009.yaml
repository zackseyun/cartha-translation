revisions:
- from: N’ihi na ọ bụ maka nke a ka Mesaịa nwụrụ ma dịkwa ndụ ọzọ[a], ka ọ bụrụ onye na-achị ma ndị nwụrụ anwụ ma ndị dị ndụ.
  to: N’ihi na ọ bụ maka nke a ka Mesaịa nwụrụ ma dịkwa ndụ ọzọ[a], ka ọ chịkwaa ma ndị nwụrụ anwụ ma ndị dị ndụ.
  rationale: The revision replaces the incomplete noun phrase ‘ọ bụrụ onye na-achị’ with the natural finite verb ‘ọ chịkwaa,’ preserving the purpose clause and the verbal force of κυριεύσῃ. It also makes the explanatory footnote’s explicit alternative idiomatic without changing the main translation’s restrained rendering.
  reviewer_model: gpt-5.6-terra
