- from: 'N’ihi na e dere ya, sị: “Dị ka m dị ndụ, ka Onyenwe anyị kwuru, ikpere ọ bụla ga-egbu n’ala nye m, ire ọ bụla ga-ekwupụtakwa nye Chineke[a].”'
  to: 'N’ihi na e dere ya, sị: “Dị ka m dị ndụ, Onyenwe anyị na-ekwu, ikpere ọ bụla ga-egbu n’ala nye m, ire ọ bụla ga-ekwupụtakwa nye Chineke[a].”'
  rationale: The revision is limited to correcting the rendering of λέγει κύριος as a present-tense divine citation formula and to making the lexical-alternative footnote grammatically parallel and more idiomatic. It retains the source’s ambiguity and its deliberate movement from ‘nye m’ to ‘nye Chineke.’
