id: ROM.14.11
reference: Romans 14:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: ig
  text: 'N’ihi na e dere ya, sị: “Dị ka m dị ndụ, Onyenwe anyị na-ekwu, ikpere ọ bụla ga-egbu n’ala nye m, ire ọ bụla ga-ekwupụtakwa nye Chineke[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ga-anakwere,” ma ọ bụ, “ga-enye Chineke otuto.” Okwu Grik a nwere ike ịpụta nkwupụta, ịnakwere, ma ọ bụ inye otuto, dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: e dere ya
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi usoro e ji webata ihe e dere n’Akwụkwọ Nsọ, ma na-echekwa ịdịgide nke ihe ahụ e dere.
- source_word: Ζῶ ἐγώ
  choice: Dị ka m dị ndụ
  rationale: Ọ na-echekwa ụdị nkwupụta siri ike, nke yiri iyi, dị n’okwu Grik n’etinyeghị nkọwa ọzọ n’ime amaokwu ahụ.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha Igbo a na-ejikarị asụgharị κύριος; e deghị ya dịka aha Chineke nke mkpụrụedemede anọ ebe ọ bụ na ihe odide Grik nwere κύριος.
- source_word: ἐμοὶ
  choice: nye m
  rationale: Ọ na-anọ nso n’ụdị dative Grik ma ghara ịgbanwe ya ka ọ bụrụ ‘n’ihu m,’ ọ bụ ezie na nke ahụ nwekwara ike ịdị mma n’Igbo.
- source_word: κάμψει πᾶν γόνυ
  choice: ikpere ọ bụla ga-egbu n’ala
  rationale: ‘Igbu ikpere n’ala’ bụ okwu Igbo dị ndụ ma doo anya maka ihulata n’irubere onye isi isi, ma na-echekwa ihe atụ nke ikpere.
- source_word: πᾶσα γλῶσσα
  choice: ire ọ bụla
  rationale: Ọ na-echekwa ihe atụ anụ ahụ na ụda Akwụkwọ Nsọ kama ịgbanwe ya ka ọ bụrụ ‘onye ọ bụla.’
- source_word: ἐξομολογήσεται
  choice: ga-ekwupụta
  rationale: ‘Ikwupụta’ na-echekwa echiche nke nkwupụta pụtara ìhè ma hapụkwa ohere maka nghọta nke ikweta ma ọ bụ inye otuto; a kọwara obosara ihe okwu ahụ pụtara n’ala ala peeji.
- source_word: τῷ θεῷ
  choice: nye Chineke
  rationale: Ọ na-egosipụta dative ahụ kpọmkwem ma na-echekwa mgbanwe dị n’okwu ahụ site na ‘nye m’ ruo ‘nye Chineke.’
theological_decisions:
- issue: Mmekọrịta dị n’etiti ‘Onyenwe anyị’ na ‘Chineke’ n’okwu e hotara
  choice: 'E chekwara usoro ahụ: ‘ka Onyenwe anyị kwuru ... nye m ... nye Chineke.’'
  alternative: Ịgbanwe ‘nye Chineke’ ka ọ bụrụ ‘nye m,’ ma ọ bụ itinye nkọwa ozizi n’ime amaokwu ahụ na-akọwapụta onye ‘Onyenwe anyị’ bụ.
  rationale: Ihe odide Grik n’onwe ya na-agbanwe site n’okwu onye mbụ ‘nye m’ gaa ‘nye Chineke.’ Nsụgharị ahụ kwesịrị ichekwa esemokwu na njikọ a n’ụdị ha dị, ọ bụghị ime ka ha kwekọọ site n’ịgbanwe okwu.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Igbu ikpere n’ala’ bụ akpaalaokwu nkịtị na nke doro anya; a hapụrụ ‘ire ọ bụla’ iji chekwaa ihe atụ na ụda Akwụkwọ Nsọ. Etinyere akara [a] n’ebe okwu ἐξομολογήσεται dị, ebe nkọwa ala ala peeji ahụ metụtara.
