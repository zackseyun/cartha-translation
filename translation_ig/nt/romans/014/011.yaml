review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately preserves the citation formula, the oath-like force of Ζῶ ἐγώ, the future verbs, the bodily imagery, and the significant shift from ‘nye m’ to ‘nye Chineke.’ However, ‘ka Onyenwe anyị kwuru’ is grammatically and semantically unsuitable for λέγει κύριος: it means ‘as our Lord said’ rather than the present citation formula ‘the Lord says.’'
  naturalness: Most wording is clear Standard Igbo. ‘Dị ka m dị ndụ’ and ‘ikpere ọ bụla ga-egbu n’ala nye m’ are natural and suitably solemn. Recasting the reporting clause as ‘Onyenwe anyị na-ekwu’ makes the quotation idiomatic and correctly represents the Greek present.
  terminology: ‘Onyenwe anyị’ appropriately renders κύριος here, without importing a doctrinal resolution. ‘Chineke’ correctly renders θεός. ‘Ire ọ bụla’ retains the source image. The footnote’s ‘nkweta’ is understandable but less precise as an alternative for ἐξομολογήσεται; ‘ịnakwere’ is clearer in this context.
  issues:
  - severity: medium
    issue: ‘ka Onyenwe anyị kwuru’ renders λέγει κύριος inaccurately.
    rationale: λέγει is present tense (‘says’). Further, the construction with ‘ka’ and the completed verb ‘kwuru’ can be read as ‘as our Lord said,’ rather than directly introducing the Lord’s speech. ‘Onyenwe anyị na-ekwu’ preserves the Greek formula and yields natural Igbo.
  - severity: low
    issue: The footnote uses the abstract noun ‘nkweta’ where a verbal alternative is preferable.
    rationale: The alternatives gloss a future verb. ‘Ga-anakwere’ parallels ‘ga-ekwupụta’ more directly and is more natural as a lexical alternative.
  revised_text: 'N’ihi na e dere ya, sị: “Dị ka m dị ndụ, Onyenwe anyị na-ekwu, ikpere ọ bụla ga-egbu n’ala nye m, ire ọ bụla ga-ekwupụtakwa nye Chineke[a].”'
