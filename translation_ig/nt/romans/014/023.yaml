source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: ig
  text: Ma onye nwere obi abụọ, ọ bụrụ na o rie, a mara ya ikpe, n’ihi na iri ahụ esighị n’okwukwe pụta.[a] Ihe ọ bụla na-adịghị esite n’okwukwe pụta bụ mmehie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi na iri ahụ esiteghị na nkwenye siri ike n’obi pụta.” Grik kwuru “site n’okwukwe,” nke pụrụ ịgụnye ime ihe site na nkwenye doro onye ahụ anya n’ihu Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: onye nwere obi abụọ
  rationale: N’ọnọdụ a gbasara iri ihe na akọnuche, okwu a na-egosi onye na-ala azụ n’ime obi ya, ọ bụghị onye ya na ndị ọzọ na-arụ ụka.
- source_word: ἐὰν φάγῃ
  choice: ọ bụrụ na o rie
  rationale: Nke a na-egosipụta ọnọdụ a na-atụ anya na ọ pụrụ ime, n’Igbo doro anya ma dịkwa eke.
- source_word: κατακέκριται
  choice: a mara ya ikpe
  rationale: Ọ na-echekwa olu nnara nke Grik ma ghara ịkọ kpọmkwem onye mara ya ikpe, ebe Grik ekwughị onye ahụ.
- source_word: ἐκ πίστεως
  choice: esighị n’okwukwe pụta
  rationale: ‘Okwukwe’ na-echekwa okwu Pọl ji na njikọ ya na echiche okwukwe n’akwụkwọ a; ‘pụta’ na-egosi echiche nke omume sitere n’okwukwe.
- source_word: πᾶν ... ὃ
  choice: ihe ọ bụla nke
  rationale: Nke a na-enye nghọta zuru oke nke okwu Grik ma bụrụkwa Igbo a na-aghọta ngwa ngwa.
- source_word: ἁμαρτία ἐστίν
  choice: bụ mmehie
  rationale: Ọ na-echekwa nkwupụta Pọl siri ike dịka aha ihe, kama ịsụgharị ya naanị dịka ‘dị njọ’ ma ọ bụ ‘bụ ihe mmehie.’
theological_decisions:
- issue: Ihe πίστις pụtara n’ọnọdụ omume a
  choice: okwukwe
  alternative: nkwenye siri ike n’obi
  rationale: ‘Okwukwe’ na-echekwa okwu sara mbara Pọl ji, ebe nkọwa ala peeji na-egosi na n’ebe a ọ gụnyere ime ihe site na nkwenye onye nwere n’ihu Chineke.
- issue: Onye na-ekpe ikpe na κατακέκριται
  choice: a mara ya ikpe
  alternative: ọ mara onwe ya ikpe; Chineke mara ya ikpe
  rationale: Grik ekwughị onye na-eme ikpe ahụ. Ya mere, nsụgharị ahụ anaghị edozi ma ọ bụ Chineke, akọnuche onye ahụ, ma ọ bụ ha abụọ ka e bu n’uche.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘onye nwere obi abụọ’ maka ịla azụ n’ime obi, ‘a mara ya ikpe’ iji hapụ onye na-ekpe ikpe n’amaghị ama dịka Grik si mee, na ‘okwukwe’ iji chekwaa okwu nkà mmụta okpukpe Pọl ji. E tinyere akara [a] kpọmkwem n’isiokwu ahụ.
