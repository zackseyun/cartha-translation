id: ROM.14.6
reference: Romans 14:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: ig
  text: Onye na-edebe ụbọchị ahụ[a] na-edebe ya maka Onyenwe anyị. Onye na-eri ihe na-eri maka Onyenwe anyị, n’ihi na ọ na-ekele Chineke; onye na-adịghị eri ihe anaghị eri maka Onyenwe anyị, ọ na-ekelekwa Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-elebara ụbọchị ahụ anya” ma ọ bụ “na-ewere ụbọchị ahụ dị mkpa.” Ngwaa Grik ahụ nwere ike ịpụta itinye uche n’ihe ma ọ bụ ilebara ya anya. N’ebe a, o yikarịrị ka ọ pụtara idebe ụbọchị.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: na-edebe / na-edebe ya
  rationale: N’ebe a, φρονέω pụtara ilebara ụbọchị ahụ anya n’omume, ya bụ idebe ya, ọ bụghị nanị iche banyere ya. “Na-edebe” bụ okwu Igbo doro anya ma kwekọọ n’ọnọdụ a.
- source_word: ἡμέραν
  choice: ụbọchị ahụ
  rationale: Mkpọaha Grik ahụ nwere article, na-ezo aka n’ụbọchị a na-ekwu maka ya n’amaokwu ndị gbara ya gburugburu. “Ụbọchị ahụ” na-edobe nkọwa a n’akọwaghị ụdị ụbọchị ọ bụ.
- source_word: κυρίῳ
  choice: maka Onyenwe anyị
  rationale: Dative a na-egosi na a na-eme omume ahụ n’ihi Onyenwe anyị ma ọ bụ na-elekwasị ya anya. “Maka Onyenwe anyị” bụ Igbo nkịtị ma na-edobe ebumnuche ahụ.
- source_word: ἐσθίων / ἐσθίει
  choice: onye na-eri ihe / na-eri ya
  rationale: Oge ngwaa dị ugbu a na-egosi omume a na-emekarị. “Iri ihe” na-eme ka ihe omume ahụ doo anya n’Igbo, ebe “na-eri ya” na-ezere nkwughachi gabigara ókè.
- source_word: εὐχαριστεῖ
  choice: na-ekele
  rationale: “Na-ekele” na-egosi omume inye ekele, ọ bụghị nanị ọnọdụ obi nke inwe ekele.
- source_word: θεῷ
  choice: Chineke
  rationale: N’usoro Igbo, “na-ekele Chineke” na-egosi onye a na-enye ekele nke ọma n’enweghị preposition ọzọ.
- source_word: ὁ μὴ ἐσθίων
  choice: onye na-adịghị eri ihe
  rationale: Nke a na-edobe usoro yiri “onye na-eri ihe” ma na-egosi n’ụzọ kpọmkwem na onye ahụ anaghị eri.
theological_decisions:
- issue: Ihe “idebe ụbọchị ahụ” pụtara
  choice: Ọ na-ezo n’ozuzu ya n’ilebara ma ọ bụ idebe otu ụbọchị anya n’arụmụka dị na Ndị Rom 14.
  alternative: Ịkọwa ya kpọmkwem dị ka ụbọchị izu ike, ụbọchị ememme ndị Juu, ma ọ bụ ụbọchị ibu ọnụ.
  rationale: Pọl akọwaghị ụdị ụbọchị ọ bụ. Nsụgharị ahụ na-edobe ohere okwu ya ma ghara itinye nkọwa otu ụka ma ọ bụ echiche akụkọ ihe mere eme n’ime amaokwu ahụ.
- issue: Onye κύριος na-ezo aka na ya
  choice: Onyenwe anyị
  alternative: Chineke
  rationale: N’ọnọdụ akwụkwọ Pọl a, κύριος nwere ike ịzo aka n’Onyenwe anyị Jizọs, ebe amaokwu ahụ kpọrọ Chineke aha kpọmkwem dị ka onye a na-ekele. Ya mere, e debere ọdịiche okwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị nsọ ma dị mfe nghọta. E debere nhazi ahịrịokwu yiri ibe ya n’etiti onye na-eri ihe na onye na-adịghị eri ihe, ma zere ịkọwa ụbọchị ahụ dị ka otu ụbọchị okpukpe kpọmkwem.
