  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: ig
  text: N’ihi na ọ dịghị onye n’ime anyị na-adị ndụ maka onwe ya[a], ọ dịghịkwa onye na-anwụ maka onwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya dịka, “nye onwe ya.” N’ụzọ nkịtị, okwu ntụgharị-onwe ahụ dị na dative n’asụsụ Grik nwere ike ịsụgharị otú a; ma n’ebe a, o yiri ka ọ pụtara ibi ndụ ma ọ bụ ịnwụ mgbe mmadụ na-eme onwe ya ebumnuche ikpeazụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: ọ dịghị onye ọ bụla
  rationale: Nke a na-egosipụta ngọnarị zuru ụwa ọnụ n’ụzọ doro anya ma bụrụkwa Igbo a na-asụ ugbu a; e jikwa ya mee ka ahịrịokwu abụọ ahụ kwekọọ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara okwu ahụ.
- source_word: ἡμῶν
  choice: n’ime anyị
  rationale: 'Nke a bụ ụzọ Igbo si egosipụta genitive nkewa ahụ: ‘ọ dịghị onye ọ bụla n’ime anyị.’'
- source_word: ἑαυτῷ
  choice: maka onwe ya
  rationale: Ọ na-egosi na mmadụ abụghị isi njedebe ma ọ bụ onye ndụ na ọnwụ ya lekwasịrị anya; ọ bụkwa okwu Igbo eke karịa ntụgharị nkịtị ‘nye onwe ya.’
- source_word: ζῇ
  choice: na-adị ndụ
  rationale: Ọ na-egosipụta eziokwu izugbe nke Pọl na-ekwu, ọ bụghị naanị ihe na-eme n’otu oge.
- source_word: καὶ
  choice: ọ dịghịkwa
  rationale: Mgbakwunye -kwa na-ejikọta akụkụ nke abụọ na nke mbụ ma na-echekwa usoro yiri ibe ya.
- source_word: ἀποθνῄσκει
  choice: na-anwụ
  rationale: Ụdị ugbu a na-egosipụta eziokwu izugbe ma kwekọọ na ‘na-adị ndụ.’
theological_decisions:
- issue: Ihe ἑαυτῷ pụtara n’ahịrịokwu abụọ ahụ
  choice: maka onwe ya
  alternative: nye onwe ya; n’ihi onwe ya
  rationale: Ọnọdụ okwu ahụ, karịsịa amaokwu nke 8, na-egosi ndụ na ọnwụ e lekwasịrị anya n’onwe mmadụ ma ọ bụ n’Onyenwe anyị. ‘Maka onwe ya’ na-echekwa echiche ahụ n’etinyeghị nkọwa ozizi ọzọ.
- issue: Reflexive nwoke otu nke Grik e ji mee ihe gbasara mmadụ n’ozuzu
  choice: onwe ya
  alternative: onwe ha; onwe mmadụ
  rationale: ‘Onwe ya’ na-echekwa ụdị otu onye nke Grik, ma n’Igbo ọ nwere ike ịrụ ọrụ n’ụzọ zuru ụwa ọnụ n’enweghị ịmanye nwoke naanị.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro yiri ibe ya nke ahịrịokwu Grik abụọ ahụ, ma jiri ‘maka onwe ya’ mee ka echiche ntụgharị uche/njikere nke dative doo anya n’enweghị idozi mgbagwoju anya ahụ kpamkpam.
