  rationale: The revision uses the more natural Igbo form “kweere” for the present conviction expressed by πιστεύει. It also broadens footnote b from food laws to food practices, avoiding an unnecessary interpretive narrowing. The main text continues to preserve the Greek’s lack of explicit “only” and its unqualified “weak.”
