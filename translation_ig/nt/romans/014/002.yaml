id: ROM.14.2
reference: Romans 14:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: ig
  text: Otu onye kweere na ya nwere ike iri ihe niile[a], ma onye na-adịghị ike[b] na-eri akwụkwọ nri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “obi siri ya ike na ya nwere ike iri ihe niile.”
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, “onye na-adịghị ike” na-ezo aka n’onye okwukwe ya ma ọ bụ akọ na uche ya na-adịghị ike n’ihe gbasara omume iri nri; lee Ndị Rom 14:1.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: Otu onye
  rationale: Nke a na-ewebata onye mbụ n’ime mmadụ abụọ a na-atụnyere. “Otu onye” na-egosi otu onye nnọchianya n’enweghị ime ka okwu ahụ bụrụ naanị maka nwoke.
- source_word: πιστεύει
  choice: kwenyere
  rationale: N’ebe a, okwu ahụ na-egosi nkwenye mmadụ nwere banyere ihe o nwere ike iri, ọ bụghị kpọmkwem okwukwe nzọpụta. “Kwenyere” na-edobe njikọ ya na echiche nke ikwere, ebe nkọwa ọzọ dị n’ala peeji na-egosi na a pụkwara ịghọta ya dị ka inwe obi siri ike.
- source_word: φαγεῖν πάντα
  choice: na o nwere ike iri ihe niile
  rationale: Nkebi a na-egosi ihe onye ahụ kwenyere banyere ya. “Nwere ike” na-eme ka echiche nke nnwere onwe iri nri doo anya n’Igbo, ebe “ihe niile” na-edobe oke sara mbara nke πάντα.
- source_word: ὁ δὲ
  choice: ma onye
  rationale: “Ma onye” na-egosi ọdịiche dị n’etiti onye nke mbụ na onye nke abụọ ma na-anọgidekwa bụrụ okwu Igbo dị mfe ma kwekọọ n’usoro ahịrịokwu ahụ.
- source_word: ἀσθενῶν
  choice: onye na-adịghị ike
  rationale: Partisipụl a na-arụ ọrụ dị ka aha mmadụ. Nsụgharị a na-edobe okwu Pọl n’enweghị itinye “n’okwukwe” n’ahịrịokwu a, ebe amaokwu bu ya ụzọ na-enye ihe gbara ya gburugburu.
- source_word: λάχανα
  choice: akwụkwọ nri
  rationale: Okwu Grik a na-ezo aka n’ihe ubi a na-eri, ya bụ akwụkwọ nri ma ọ bụ nri sitere n’ubi. “Akwụkwọ nri” bụ okwu a na-aghọta ngwa ngwa n’Igbo nke oge a.
- source_word: ἐσθίει
  choice: na-eri
  rationale: Ngwaa ahụ na-ekwu nanị ihe onye ahụ na-eri. A tinyeghị “naanị” n’ihi na, ọ bụ ezie na ọdịiche dị n’ahịrịokwu ahụ nwere ike ime ka a ghọta ya, okwu ahụ adịghị kpọmkwem na Grik.
theological_decisions:
- issue: Ihe “onye na-adịghị ike” (ἀσθενῶν) pụtara
  choice: E dere ya “onye na-adịghị ike” n’etinyeghị “n’okwukwe” n’ahịrịokwu bụ isi.
  alternative: onye okwukwe ya na-adịghị ike
  rationale: Ndị Rom 14:1 na-egosi na adịghị ike a metụtara okwukwe ma ọ bụ akọ na uche n’ihe gbasara nri. Ma amaokwu nke abụọ n’onwe ya kwuru naanị “onye na-adịghị ike”; ya mere, nsụgharị ahụ na-edobe okwu ahụ otú ahụ ma hapụ ihe gbara ya gburugburu ka ọ kọwaa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee ugwu dee ya. A họọrọ “akwụkwọ nri” kama okwu ochie ma ọ bụ nke nwere ike ịdị warara. E debere ọdịiche dị n’etiti mmadụ abụọ ahụ, ma a gbakwụnyeghị “naanị” ma ọ bụ “n’okwukwe” n’ahịrịokwu bụ isi n’ihi na ha adịghị kpọmkwem n’amaokwu Grik a.
