- from: Okwukwe ahụ i nwere[a], debe ya n’onwe gị n’ihu Chineke. Onye a gọziri agọzi bụ onye na-adịghị ekpe onwe ya ikpe[b] n’ihe ọ kwadoro.
  to: Okwukwe i nwere[a], debe ya n’onwe gị n’ihu Chineke. Ngọzi na-adịrị onye na-adịghị ekpe onwe ya ikpe[b] n’ihe ọ kwadoro.
  rationale: The revision is limited to idiomatic Standard Igbo. It replaces a repetitive beatitude construction with “Ngọzi na-adịrị onye,” while retaining the source’s sense and ambiguity. It also smooths the opening noun phrase. The original distinctions between holding the conviction privately and doing so before God, and between judging and condemning oneself, remain intact.
