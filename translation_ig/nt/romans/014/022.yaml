review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the two clauses of the Greek. It preserves πίστιν as “okwukwe,” distinguishes κατὰ σεαυτόν (“n’onwe gị”) from ἐνώπιον τοῦ θεοῦ (“n’ihu Chineke”), and appropriately renders ἐν ᾧ δοκιμάζει as “n’ihe ọ kwadoro.” The alternative “ịma onwe ya ikpe” suitably reflects the potentially condemnatory force of κρίνων ἑαυτόν without narrowing the main text beyond the Greek.
  naturalness: The wording is generally clear Standard Igbo. “Onye a gọziri agọzi bụ onye” is unnecessarily repetitive and less idiomatic than the common blessing formula “Ngọzi na-adịrị onye.” Removing the demonstrative from “Okwukwe ahụ i nwere” also yields a more natural direct rendering without any loss of meaning.
  terminology: “Okwukwe,” “nkwenye,” “n’ihu Chineke,” and “ịkpọ/ịma onwe ya ikpe” are appropriate, modern, and theologically non-sectarian. The footnotes correctly preserve the lexical alternatives and their anchors.
  issues:
  - severity: low
    issue: The expression “Onye a gọziri agọzi bụ onye” is stylistically redundant.
    rationale: The Greek μακάριος introduces a beatitude. “Ngọzi na-adịrị onye …” is a natural Standard Igbo beatitude formula and avoids repeating “onye.”
  - severity: low
    issue: “Okwukwe ahụ i nwere” is slightly more marked than needed.
    rationale: The Greek has “the faith which you have,” but Standard Igbo naturally expresses this as “Okwukwe i nwere”; the definite sense remains clear from the possessive relative construction and context.
  revised_text: Okwukwe i nwere[a], debe ya n’onwe gị n’ihu Chineke. Ngọzi na-adịrị onye na-adịghị ekpe onwe ya ikpe[b] n’ihe ọ kwadoro.
