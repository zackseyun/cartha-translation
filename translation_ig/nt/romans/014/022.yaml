  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: ig
  text: Okwukwe i nwere[a], debe ya n’onwe gị n’ihu Chineke. Ngọzi na-adịrị onye na-adịghị ekpe onwe ya ikpe[b] n’ihe ọ kwadoro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Nkwenye ahụ i nwere, debe ya n’onwe gị n’ihu Chineke.” Okwu Grik πίστις na-apụtakarị “okwukwe,” ma n’ebe a ọ pụkwara ịpụta nkwenye mmadụ nwere banyere ihe a na-arụrịta ụka.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-adịghị ama onwe ya ikpe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: okwukwe
  rationale: “Okwukwe” bụ nsụgharị nkịtị nke πίστις ma na-edobe ya dịka okwu bụ isi. N’ebe a, ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ nkwenye mmadụ nwere n’ihu Chineke banyere ihe a na-arụrịta ụka.
- source_word: κατὰ σεαυτὸν
  choice: n’onwe gị
  rationale: Nke a na-egosi na onye ahụ kwesịrị ijide okwukwe ma ọ bụ nkwenye ahụ n’onwe ya, kama ịmanye ya n’ahụ ndị ọzọ.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: n’ihu Chineke
  rationale: Nkebi a na-edobe echiche nke ịnọ n’ihu Chineke na ịza ya ajụjụ, ọ bụghị izochiri ya ihe.
- source_word: μακάριος
  choice: onye a gọziri agọzi
  rationale: Nke a na-eburu ịdị arọ nke ngọzi ime mmụọ na omume ọma karịa nanị ịsị na onye ahụ nwere obi ụtọ.
- source_word: κρίνων ἑαυτὸν
  choice: na-ekpe onwe ya ikpe
  rationale: Nkebi a na-anọ nso n’echiche nkịtị nke κρίνω, ma n’Igbo ọ pụkwara ibu echiche nke ịma onwe onye ikpe, dịka ihe gbara ya gburugburu chọrọ.
- source_word: ἐν ᾧ δοκιμάζει
  choice: n’ihe ọ kwadoro
  rationale: δοκιμάζω n’ebe a pụtara ihe mmadụ nyochara wee kwado; “n’ihe ọ kwadoro” na-edobe njikọ ahụ n’enweghị ịkọwa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe πίστις pụtara n’ihe gbasara omume a na-arụrịta ụka
  choice: okwukwe nke a ghọtara n’ebe a dịka nkwenye mmadụ nwere n’ihu Chineke banyere okwu ahụ
  alternative: ntụkwasị obi n’ebe Chineke nọ n’ozuzu ya, ma ọ bụ ikwesị ntụkwasị obi
  rationale: Ihe gbara amaokwu a gburugburu bụ omume a na-arụrịta ụka na akọ na uche. E debere “okwukwe” dịka okwu bụ isi, ebe nkọwa ala peeji na-egosi echiche “nkwenye” nke ọ nwere n’ebe a.
- issue: Ike okwu κρίνων ἑαυτὸν
  choice: ikpe onwe ya ikpe
  alternative: ịma onwe ya ikpe
  rationale: Grik nwere ike ịpụta ikpe ma ọ bụ ịma ikpe. Isiokwu ahụ na-edobe okwu sara mbara, ebe nkọwa ala peeji na-egosi echiche siri ike nke ịma ikpe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ọdịiche dị n’etiti “n’onwe gị” na “n’ihu Chineke,” ma hapụkwa obosara okwu Grik banyere ikpe ma ọ bụ ịma ikpe.
