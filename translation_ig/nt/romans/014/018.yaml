id: ROM.14.18
reference: Romans 14:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: ig
  text: N’ihi na onye na-ejere Kraịst ozi n’ụzọ dị otu a na-atọ Chineke ụtọ, ndị mmadụ na-anabatakwa ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na amaokwu a na-enye ihe kpatara okwu dị n’amaokwu bu ya ụzọ.
- source_word: ἐν τούτῳ
  choice: n’ụzọ dị otu a
  rationale: Na-edobe ntụaka ya n’ihe e kwuru tupu ya, n’ebughị ụzọ kpebie ma τούτῳ na-ezo aka n’otu àgwà kpọmkwem ma ọ bụ n’ụzọ ndụ ahụ dum.
- source_word: δουλεύων τῷ Χριστῷ
  choice: onye na-ejere Kraịst ozi
  rationale: ‘Ijere ... ozi’ bụ okwu Igbo doro anya ma dị ùgwù maka δουλεύω n’ọnọdụ a; ‘Kraịst’ na-edobe aha-ọkwa Χριστός.
- source_word: εὐάρεστος τῷ θεῷ
  choice: na-atọ Chineke ụtọ
  rationale: Nke a bụ ụzọ Igbo e si ekwu na onye ahụ bụ ihe Chineke na-enwe mmasị na ya.
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: ndị mmadụ na-anabatakwa ya
  rationale: δόκιμος pụtara onye a nwalere ma hụ na ọ dị mma, ya mere onye a nabatara ma ọ bụ kwadoro; ἄνθρωποι ebe a bụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
theological_decisions:
- issue: Ihe ἐν τούτῳ na-ezo aka na ya
  choice: n’ụzọ dị otu a
  alternative: n’ihe ndị a
  rationale: Nhọrọ a na-ejikọta amaokwu ahụ na ezi omume, udo, na ọṅụ e kwuru na Rom 14:17, ma ọ naghị emechi ohere nke nghọta sara mbara banyere ụzọ ije ozi Kraịst.
- issue: Nkọwa Χριστός
  choice: Kraịst
  alternative: Mesaya
  rationale: ‘Kraịst’ bụ aha-ọkwa a maara nke ọma n’Igbo ma na-anọchite anya okwu Grik ahụ ozugbo, n’etinyeghị nkọwa ọzọ n’ime amaokwu.
- issue: Ndị na-enye nkwado na δόκιμος τοῖς ἀνθρώποις
  choice: ndị mmadụ
  alternative: ụmụ nwoke
  rationale: Okwu Grik ἀνθρώποις na-ezo aka n’ebe ụmụ mmadụ nọ n’ozuzu; ya mere ‘ndị mmadụ’ ziri ezi karịa okwu nwere ike iyi ka ọ bụ naanị ndị nwoke.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị mfe nghọta ma dị ùgwù. Ahịrịokwu ahụ na-edobe njikọ ezi uche nke γάρ na nghọta sara mbara nke ἐν τούτῳ, ma na-ezere ịtụgharị ἀνθρώποις dịka naanị ụmụ nwoke.
