  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: ig
  text: Ya mere[a], ka anyị gbasie mbọ ike ịchụso ihe ndị na-eweta udo na ihe ndị na-ewuli ibe anyị elu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karịa, “ihe ndị metụtara udo na ihe ndị metụtara iwuli ibe anyị elu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ya mere
  rationale: Nkebi okwu a na-ewepụta nkwubi okwu sitere n’arụmụka bu ya ụzọ; “Ya mere” bụ okwu Igbo doro anya ma dịkwa ebumpụta ụwa.
- source_word: τὰ τῆς εἰρήνης
  choice: ihe ndị na-eweta udo
  rationale: Nke a na-egosi ihe ndị metụtara udo ma ọ bụ na-akwalite ya; nsụgharị a na-eme ka echiche ahụ doo onye na-agụ ya anya.
- source_word: διώκωμεν
  choice: ka anyị na-agbasi mbọ ike ime
  rationale: Subjunctive a bụ agbamume nye ọgbakọ dum ka ha nọgide na-agbaso ihe ndị a n’ike; “na-agbasi mbọ ike” na-echekwa ike dị na ngwaa Grik ahụ.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: ihe ndị na-ewulite
  rationale: οἰκοδομή bụ ihe atụ nke iwulite mmadụ ma mee ka okwukwe na ndụ ọgbakọ sie ike; “na-ewulite” na-echekwa ihe atụ ahụ n’Igbo dị mfe.
- source_word: τῆς εἰς ἀλλήλους
  choice: ibe anyị
  rationale: Okwu a na-egosi imekọ ihe ọnụ na iwulite onwe onye na ibe ya n’ime ọgbakọ; “ibe anyị” dabara nke ọma na agbamume onye mbụ n’ụbara.
theological_decisions:
- issue: Oke iwulite ọgbakọ
  choice: Amaokwu ahụ na-agba ndị kwere ekwe ume, dịka otu obodo, ka ha kwalite udo ma na-ewulite ibe ha.
  alternative: Ịgụ ya dịka agbamume gbasara naanị mmezi omume nke onye ọ bụla n’onwe ya.
  rationale: “Ka anyị” na okwu mmeghachi omume ἀλλήλους na-egosi ndụ na ọrụ a na-emekọ ọnụ, karịchaa n’ihe gbasara esemokwu akọ na uche dị na Ndị Rom 14.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ nke ‘iwulite’ ma zere okwu ụka siri ike ma ọ bụ nkọwa otu ụka pụrụ iche.
