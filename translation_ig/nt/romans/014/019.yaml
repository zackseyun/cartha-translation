  rationale: The revision preserves the Greek’s paired objects and its ongoing communal exhortation while rendering διώκωμεν with the more faithful Igbo pursuit metaphor. It also makes the mutual building-up sense explicit and retains the audit-trail alternative at the inferential opening.
