revisions:
- from: Nabatakwanụ onye okwukwe ya na-adịghị ike,[a] ma unu anabatakwala ya iji rụrịta ụka banyere echiche dị iche iche.[b]
  to: Nabatakwanụ onye na-adịghị ike n’okwukwe,[a] ọ bụghị iji rụrịta ụka banyere echiche.[b]
  rationale: A gbanwere naanị usoro nke akụkụ ikpeazụ ka ọ soro μὴ εἰς—ebumnuche a na-ekweghị ka nnabata ahụ nwee—n'ụzọ doro anya n’Igbo. A hapụrụ ‘okwukwe’ na ‘nabatakwanụ’ dịka okwu ndị ziri ezi, ma wepụrụ ‘dị iche iche’ n’isi ederede ka a ghara itinye nkọwa nke na-adịghị kpọmkwem n’okwu Grik.
