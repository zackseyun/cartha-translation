id: ROM.14.1
reference: Romans 14:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: ig
  text: Nabatakwanụ onye na-adịghị ike n’okwukwe,[a] ọ bụghị iji rụrịta ụka banyere echiche.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Nabatakwanụ onye okwukwe ya na-adịghị ike.”
    reason: Igbo nwere ike igosi njikọ dative ahụ site na “n’okwukwe” ma ọ bụ “okwukwe ya”; ụzọ abụọ ahụ anaghị etinye “akọnuche,” nke isi mmalite ahụ ekwughị.
  - marker: b
    text: Ma ọ bụ, “ọ bụghị iji kpee echiche ndị a na-arụrịta ụka ikpe,” ma ọ bụ, “ọ bụghị iji see okwu banyere ntụgharị uche.”
    reason: Okwu Grik ahụ nwere ike igosi ikpe dị iche iche, esemokwu, ma ọ bụ arụmụka gbasara echiche na ntụgharị uche.
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: onye ... na-adịghị ike
  rationale: A na-eji participle a nwere article eme ihe dị ka aha mmadụ; nsụgharị a na-echekwa echiche nke onye nọ n'adịghị ike n'etinyeghị ‘akọnuche,’ nke isi mmalite ahụ ekwughị.
- source_word: τῇ πίστει
  choice: okwukwe ya
  rationale: Dative a na-egosi akụkụ onye ahụ na-adịghị ike na ya. ‘Okwukwe ya’ bụ Igbo nkịtị ma ọ naghị eme ka okwu a bụrụ usoro ozizi a kapịrị ọnụ.
- source_word: προσλαμβάνεσθε
  choice: nabatakwanụ
  rationale: Imperative middle a pụtara ịkpọrọ mmadụ bịakwute onwe unu ma nabata ya n'etiti unu. ‘Nabatakwanụ’ na-ekwupụta nnabata n'ime mmekọrịta nke ọma.
- source_word: μὴ εἰς
  choice: ma unu anabatakwala ya iji
  rationale: 'Nrụgharị a na-eme ka ebumnuche a machibidoro iwu doo anya n''Igbo: e kwesịghị ịnabata onye ahụ n''ihi ịchọ esemokwu.'
- source_word: διακρίσεις
  choice: rụrịta ụka
  rationale: N'ọnọdụ a, okwu ahụ na-ezo aka na ịrụ ụka ma ọ bụ ikpebi okwu ndị a na-arụrịta ụka, ọ bụghị nanị ịmata ọdịiche.
- source_word: διαλογισμῶν
  choice: echiche dị iche iche
  rationale: Okwu a nwere ike ịpụta echiche, ntụgharị uche, ma ọ bụ arụmụka. ‘Echiche dị iche iche’ bụ okwu Igbo doro anya ma na-ahapụ obosara ihe a na-arụrịta ụka banyere ya.
- source_word: δὲ
  choice: -kwa-
  rationale: δέ na-egosi njikọ ma ọ bụ ngafe n'okwu. Enyere mmetụta njikọ ya site na mgbakwunye ‘-kwa-’ n'ime ngwaa, kama itinye okwu oge dịka ‘ugbu a.’
theological_decisions:
- issue: Nsụgharị πίστις
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N'ebe a, okwu gbara ya gburugburu na-ekwu maka adịghị ike onye kwere ekwe n'ihe gbasara nkwenye ya banyere omume ndị a na-arụrịta ụka. ‘Okwukwe’ na-echekwa okwu nkà mmụta okpukpe ahụ n'enweghị ịkọwa ya gabiga ihe ederede kwuru.
- issue: Ihe διακρίσεις διαλογισμῶν pụtara
  choice: ịrụrịta ụka banyere echiche dị iche iche
  alternative: ikpe echiche ndị a na-arụrịta ụka ikpe; esemokwu banyere ntụgharị uche
  rationale: Njikọ genitive a nwere ike izo aka n'ikpebi ma ọ bụ ịrụ ụka banyere echiche. Isi ederede na-eji nsụgharị dị mfe ma sara mbara, ebe ndetu na-echekwa ụzọ ọgụgụ ndị ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma nwee nsọpụrụ. A họọrọ ‘nabatakwanụ’ iji gosipụta nnabata n'ime otu, ebe ahịrịokwu nke abụọ na-eme ka ebumnuche a machibidoro iwu doo anya. E debere ihe mgbagwoju anya dị na njikọ ikpe/ụka/echiche na ndetu ala peeji.
