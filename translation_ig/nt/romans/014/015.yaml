id: ROM.14.15
reference: Romans 14:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: ig
  text: N’ihi na, ọ bụrụ na ihe oriri emee ka nwanne gị nwee mwute[a], ị naghịzi ebi ndụ n’ụzọ kwekọrọ n’ịhụnanya. Ejila ihe oriri gị mee ka onye ahụ laa n’iyi[b]—onye Mesaịa nwụrụ maka ya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nwanne” n’ebe a nwere ike ịpụta nwanne nwoke ma ọ bụ nwanne nwanyị—onye gị na ya kweere.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ebibila ya” ma ọ bụ “emela ka ọ laa n’iyi.” Okwu Grik ahụ siri ike ma nwere ike ịpụta nnukwu mbibi ime mmụọ; amaokwu a akọwaghị kpọmkwem ụdị mbibi ahụ.
    reason: alternative_reading
  - marker: c
    text: 'Grik: “Kraịst”; a sụgharịrị ya “Mesaịa” n’ebe a n’ihi na ọ bụ aha-ọkwa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: ihe oriri / ihe oriri gị
  rationale: Ọ pụtara nri n’ozuzu ya, ọ bụghị naanị anụ; Igbo a na-edobekwa obosara okwu ahụ na ụzọ nri onye nwere ike isi bụrụ ihe kpatara nsogbu.
- source_word: ἀδελφός
  choice: nwanne gị
  rationale: “Nwanne” bụ okwu Igbo sitere n’okike nke na-ekpuchi nwanne nwoke ma ọ bụ nwanyị nke otu okwukwe, n’enweghị mkpa ịmanye okike nwoke nke ụtọasụsụ Grik n’Igbo.
- source_word: λυπεῖται
  choice: emee ka ... nwee mwute
  rationale: Nke a na-egosipụta ịbụ onye e wetara mwute ma ọ bụ nchekasị, ma ọ naghị akọwakarị ụdị mmerụ ahụ karịa ihe isi mmalite kwuru.
- source_word: κατὰ ἀγάπην
  choice: dịka ịhụnanya si chọọ
  rationale: Ọ na-egosipụta ịhụnanya dị ka ụkpụrụ omume mmadụ kwesịrị iso, n’Igbo dị mfe ma kwesị ntụkwasị obi nye κατὰ.
- source_word: περιπατεῖς
  choice: ị ... ebi ndụ
  rationale: N’agbanyeghị na Grik ji ihe atụ ‘ije ije,’ ‘ibi ndụ’ bụ ụzọ Igbo nkịtị si akọwa omume mmadụ na ụzọ ndụ ya n’ebe a.
- source_word: ἀπόλλυε
  choice: Ejila ... laa ... n’iyi
  rationale: “Ịla n’iyi” na-echekwa ike nke ngwaa ahụ—mbibi ma ọ bụ ọdịda siri ike—n’ebughị ụzọ kpebie ma ọ bụ ọnwụ ebighị ebi ka a na-ekwu kpọmkwem.
- source_word: ὑπὲρ οὗ
  choice: onye ... nwụrụ n’ihi ya
  rationale: Nke a na-enye echiche nke ịnwụ maka ọdịmma ma ọ bụ n’aha onye ahụ n’ụzọ Igbo a na-aghọta nke ọma.
- source_word: Χριστός
  choice: Mesaịa
  rationale: A sụgharịrị aha-ọkwa ahụ dịka “Mesaịa” iji mee ka ihe Χριστός pụtara dị ìhè kama ile ya anya naanị dịka aha onwe.
- source_word: ἀπέθανεν
  choice: nwụrụ
  rationale: Nke a bụ ntụgharị Igbo kwụ ọtọ ma bụrụ nke ebumpụta ụwa maka ọnwụ mere eme.
- source_word: ἐκεῖνον
  choice: onye ahụ
  rationale: Ọ na-echekwa nkwusikwu nke demonstrative ahụ n’ebe otu onye a na-ekwu maka ya nọ.
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: Ọ na-echekwa ma njikọ nkọwa γάρ na amaokwu gara aga ma usoro ọnọdụ εἰ.
theological_decisions:
- issue: Ike ἀπόλλυε n’ihe gbasara onye okwukwe ya adịghị ike
  choice: “Laa ... n’iyi,” dịka ịdọ aka ná ntị siri ike na-akọwaghị kpọmkwem ụdị mbibi ahụ
  alternative: “Mebie” ma ọ bụ “mee ka ọ laa n’iyi ruo mgbe ebighị ebi”
  rationale: Amaokwu ahụ ji okwu siri ike, ma ọ naghị edozi n’onwe ya ma ihe a bụ mbibi ime mmụọ n’oge a ka ọ bụ ịla n’iyi ikpeazụ; ntụgharị ahụ na-ahapụ esemokwu ahụ ka ọ dị.
- issue: Onye ἀδελφός na-ezo aka na ya
  choice: “Nwanne gị”
  alternative: “Nwanne nwoke gị” ma ọ bụ “onye gị na ya kweere”
  rationale: Ọdịdị Grik bụ nwoke otu, ma “nwanne” n’Igbo anaghị ama okike ma na-arụ ọrụ nke ọma maka onye òtù okwukwe; nkọwa ala peeji na-eme ka ojiji nnọchite anya doo anya.
- issue: Nsụgharị Χριστός
  choice: “Mesaịa”
  alternative: “Kraịst”
  rationale: N’ebe a okwu ahụ na-arụ ọrụ dịka aha-ọkwa; “Mesaịa” na-eme ka ihe aha-ọkwa ahụ pụtara pụta ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ibi ndụ” karịa ntụgharị nkịtị “ije ije” ka echiche omume Pọl bụrụ nke ebumpụta ụwa n’Igbo; a hapụrụ ike na nghọtahie nwere ike ịdị na ἀπόλλυε n’enweghị mkpebi ozizi pụrụ iche.
