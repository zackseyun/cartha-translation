id: ROM.14.20
reference: Romans 14:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: ig
  text: N’ihi ihe oriri, akwatuwala ọrụ Chineke. Ihe niile dị ọcha n’ezie,[a] ma ọ dị njọ nye onye na-eri ihe n’ụzọ na-eme ka e sụọ ngọngọ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ihe oriri niile dị ọcha.” Okwu Grik kwuru “ihe niile,” ma ọnọdụ okwu a metụtara ihe oriri.
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik ahụ nwekwara ike ịpụta, “ma ọ dị njọ nye onye na-eri ihe site n’ihe ịsụ ngọngọ.” Ekwughị kpọmkwem onye a na-eme ka ọ sụọ ngọngọ.
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: N’ihi ihe oriri
  rationale: Nkebiokwu a na-egosi ihe kpatara omume ahụ ma ọ bụ ihe a na-achọ n’ime ya; nsụgharị a bụ Igbo nkịtị ma na-egosi na ihe oriri ekwesịghị ịbụ ihe ga-eme ka e mebie ọrụ Chineke.
- source_word: κατάλυε
  choice: akwatusịla
  rationale: Okwu a chekwara ihe atụ nke ịkwatu ihe e wuru; iwu dị n’ụdị a na-egosi ka a ghara ime omume ahụ.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: ọrụ Chineke
  rationale: Nsụgharị a na-edobe obosara okwu Grik ahụ, n’akọwaghị ya kpọmkwem dịka otu onye kwere ekwe ma ọ bụ dịka ọgbakọ niile.
- source_word: πάντα μὲν καθαρά
  choice: N’ezie, ihe niile dị ọcha
  rationale: “Ihe niile” na-edobe obosara πάντα, ebe ọnọdụ okwu ahụ na-eme ka a ghọta na ihe oriri ka a na-ekwu banyere ya; “dị ọcha” na-echekwa asụsụ gbasara ịdị ọcha.
- source_word: κακὸν
  choice: ihe ọjọọ
  rationale: Nke a na-echekwa ịdị arọ nke ikpe omume dị n’okwu Grik karịa naanị ịsị na ihe ahụ adịghị mma.
- source_word: τῷ ἀνθρώπῳ
  choice: onye ahụ
  rationale: ἄνθρωπος ebe a na-anọchi anya mmadụ ọ bụla; “onye ahụ” bụ Igbo ebumpụta ụwa nke na-edobe onye otu n’enweghị itinye nwoke naanị n’ebe okwu ahụ na-agụnye mmadụ niile.
- source_word: διὰ προσκόμματος
  choice: n’ụzọ ga-eme ka onye ọzọ sụọ ngọngọ
  rationale: Nke a na-eme ka echiche nke ịbụ ihe ịsụ ngọngọ doo anya, ma na-edobe ihe oyiyi nke ngọngọ dị na πρόσκομμα.
- source_word: ἐσθίοντι
  choice: ma ọ bụrụ na o rie
  rationale: Nke a na-akọwa onye a na-ekwu banyere ya dịka onye na-eri n’ụzọ ahụ, n’Igbo na-aga were were.
theological_decisions:
- issue: Ókè okwu “dị ọcha” gbasara iwu ihe oriri na nnwere onwe Onye Kraịst
  choice: E debere “ihe niile dị ọcha,” ebe ọnọdụ amaokwu ahụ na-ejikọta ya na ihe oriri.
  alternative: “Ihe oriri niile dị ọcha” ma ọ bụ “ihe niile kwere ekwe.”
  rationale: Grik kwuru πάντα, ọ bụghị “ihe oriri niile” kpọmkwem. Idebe “dị ọcha” na-echekwa asụsụ ịdị ọcha ma zere ịkọwa ya naanị dịka ihe e nyere ikike ime.
- issue: Ihe διὰ προσκόμματος pụtara
  choice: A sụgharịrị ya dịka iri ihe n’ụzọ na-eme ka onye ọzọ sụọ ngọngọ.
  alternative: Iri ihe n’agbanyeghị ihe na-eme onye ahụ n’onwe ya ka ọ sụọ ngọngọ, ma ọ bụ “site n’ihe ịsụ ngọngọ.”
  rationale: Nhazi okwu Grik nwere ike ịkpata nghọta dị iche ntakịrị banyere onye na-asụ ngọngọ. Isi ederede na-agbaso ọnọdụ nke isi 14, nke na-elekwasị anya n’imetụta onye ọzọ, ebe nkọwa ala peeji na-edobe ụzọ ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Akwatusịla” na-echekwa ihe atụ nke ịkwatu ọrụ Chineke; “onye ahụ” na-egosi mmadụ ọ bụla n’ụzọ Igbo ebumpụta ụwa. E tinyere akara nkọwa ala peeji [a] na [b] n’isi ederede.
