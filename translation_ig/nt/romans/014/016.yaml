  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: ig
  text: Ya mere, unu ekwela ka e kwuo okwu ọjọọ banyere ezi ihe unu nwere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka a ghara ikwulu ezi ihe unu nwere” ma ọ bụ “ka a ghara imebi aha ezi ihe unu nwere.” Okwu Grik a nwere ike ịpụta ikwu okwu mkparị ma ọ bụ okwu na-emebi aha.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... βλασφημείσθω
  choice: unu ekwela ka e kwuo okwu ọjọọ banyere
  rationale: Ngwakọta μή na iwu dị na passive na-enye mmachibido iwu. ‘Unu ekwela ka e kwuo okwu ọjọọ banyere’ na-egosipụta nke a n'Igbo dị ugbu a ma debe echiche nke okwu mkparị ma ọ bụ okwu na-emebi aha.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'ihe Pọl kwuru tupu nke a.
- source_word: ὑμῶν
  choice: unu nwere
  rationale: Ọ na-egosi ihe metụtara ndị a na-agwa okwu; usoro a na-ada nke ọma n'Igbo karịa ịsụgharị ya dịka genitive n'ụzọ siri ike.
- source_word: τὸ ἀγαθόν
  choice: ezi ihe
  rationale: Adjective neuter ahụ na-arụ ọrụ dịka aha, ‘ihe ọma/ezi ihe.’ ‘Ezi ihe’ na-ahapụ ihe ọ na-ezo aka na ya ka ọ saa mbara dịka Grik si mee, n'ebughị ụzọ kpebie na ọ bụ nnwere onwe ma ọ bụ ikike.
theological_decisions:
- issue: Ihe ‘ezi ihe unu nwere’ (τὸ ἀγαθόν ὑμῶν) na-ezo aka na ya
  choice: A hapụrụ ya dịka okwu sara mbara, ‘ezi ihe unu nwere.’
  alternative: nnwere onwe unu; ikike unu; ezi ozizi ma ọ bụ ezi akaebe unu
  rationale: Grik akọwaghị kpọmkwem ihe ahụ bụ. Nsụgharị sara mbara na-echekwa nghọta dị iche iche nwere ike ịdị na ya na esemokwu ndụmọdụ Pọl, kama idozi ya n'ụzọ otu nkọwa.
translation_notes:
  register: Igbo Izugbe dị ugbu a, kwụ ọtọ ma nwee ugwu. E ji ‘unu’ mee ka plural nke onye nke abụọ dị na Grik pụta ìhè; e zere okwu ụka pụrụ iche nke nwere ike ime ka βλασφημέω bụrụ naanị nkwulu megide Chineke.
