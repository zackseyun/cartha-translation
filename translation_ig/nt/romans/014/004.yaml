review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the household-slave analogy, the contrast of standing and falling, the future passive in σταθήσεται, and the Lord's ability to cause the person to stand. A minor revision is needed because the opening Igbo construction “Onye ka ị bụ, i ji ekpe ... ikpe?” is not the most natural way to express the Greek rhetorical question with its substantival participle.
  naturalness: “Ònye ka ị bụ, ka ị na-ekpe ... ikpe?” is clear, idiomatic Standard Igbo for a rebuking rhetorical question. The remaining wording is natural and maintains a dignified biblical register.
  terminology: “Ohu ụlọ” appropriately reflects οἰκέτης and preserves the bonded household setting. “Onye nwe ya” fits the human master in the analogy; “Onyenwe anyị” is the established theological title for ὁ κύριος in the final clause. The note properly retains the possible analogical reading without treating it as certain.
  issues:
  - severity: medium
    issue: The opening question is awkwardly formed in Standard Igbo.
    rationale: In “Onye ka ị bụ, i ji ekpe ohu ụlọ onye ọzọ ikpe?”, the sequence i ji ekpe can suggest an instrumental sense (“use to judge”) rather than naturally introducing the rhetorical challenge. “Ònye ka ị bụ, ka ị na-ekpe ... ikpe?” directly and idiomatically expresses “Who are you to judge ...?”
