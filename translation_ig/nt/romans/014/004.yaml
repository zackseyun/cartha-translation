id: ROM.14.4
reference: Romans 14:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: ig
  text: Ònye ka ị bụ, ka ị na-ekpe ohu ụlọ onye ọzọ ikpe[a]? Ọ bụ n’ihu onye nwe ya ka ọ na-eguzo ma ọ bụ daa. Ma a ga-eme ka o guzo, n’ihi na Onyenwe anyị[b] nwere ike ime ka o guzo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik bụ οἰκέτης, ya bụ ohu ma ọ bụ onye na-eje ozi nke so n’ụlọ mmadụ. “Ohu ụlọ” na-edobe ọnọdụ ịbụ onye e nwere n’ohu; a pụkwara ịsụgharị ya “onye na-eje ozi n’ụlọ onye ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Otu okwu Grik ahụ, κύριος, ka e ji mee ihe maka “onye nwe ya” na “Onyenwe anyị.” Ụfọdụ na-aghọta nke ikpeazụ dịka nna ukwu ohu ahụ n’ime ihe atụ ahụ; o yikarịrị ka ọ na-ezo aka n’Onyenwe anyị n’echiche okpukpe.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Onye ka ị bụ, i ji ekpe ... ikpe?
  rationale: Ụdị ajụjụ a bụ Igbo dị ndụ nke na-egosipụta nkwusi ike dị na σὺ na ịba mba dị n’ajụjụ Pọl, ma na-edobe κρίνων dịka “ikpe ... ikpe.”
- source_word: ἀλλότριον οἰκέτην
  choice: ohu ụlọ onye ọzọ
  rationale: “Ohu ụlọ” na-egosi onye nọ n’ohu nke na-eje ozi n’ezinụlọ, ọ bụghị naanị onye ọrụ a na-akwụ ụgwọ; “onye ọzọ” na-egosipụta ἀλλότριον nke ọma.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: n’ihu onye nwe ya
  rationale: “N’ihu” na-eme ka echiche nke ịza ajụjụ ma ọ bụ ịnata nkwado n’aka nna ukwu ya doo anya. “Onye nwe ya” dabara n’ọnọdụ ohu ahụ ma ghara ịmanye okwu Chineke n’akụkụ mbụ nke ihe atụ ahụ.
- source_word: στήκει ἢ πίπτει
  choice: ọ na-eguzo ma ọ bụ daa
  rationale: Nke a na-edobe ihe atụ abụọ ahụ—iguzo na ịda—na-enweghị ịkọwa ha dịka ịnakwere ma ọ bụ ịma ikpe.
- source_word: σταθήσεται
  choice: a ga-eme ka o guzo
  rationale: Ụdị a na-edobe olu nnara nke ọdịnihu dị na Grik ma na-egosi na ọ bụghị naanị n’ike nke ya ka ọ ga-eguzo.
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: n’ihi na Onyenwe anyị nwere ike ime ka o guzo
  rationale: “N’ihi na” na-enye ihe kpatara nkwa ahụ; “nwere ike” na-egosipụta δυνατεῖ, ebe “ime ka o guzo” na-edobe njikọ okwu ya na σταθήσεται.
theological_decisions:
- issue: Onye ὁ κύριος nke ikpeazụ na-ezo aka na ya
  choice: Onyenwe anyị, n’echiche nke Onye nwe ndị kwere ekwe
  alternative: onye nwe ohu ahụ n’ime ihe atụ ụlọ
  rationale: N’usoro okwu Pọl, ike ime ka onye kwere ekwe guzo na-egosi Onyenwe anyị n’echiche okpukpe. Otú ọ dị, ihe atụ nke nna ukwu na ohu ka na-eme ka ụzọ ọzọ kwe omume, ya mere e debere ya n’ihe odide ala peeji.
- issue: Ike na-eme ka onye ahụ guzo
  choice: 'E debere ya dịka omume a na-eme onye ahụ: “a ga-eme ka o guzo”'
  alternative: “ọ ga-eguzo”
  rationale: Nke a na-edobe olu nnara nke σταθήσεται na echiche na Onyenwe anyị bụ onye na-eme ka o guzo, na-enweghị ịkọwakwu ụdị nkwado ahụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Onye ka ị bụ, i ji...” bụ ajụjụ ịba mba dị ndụ n’Igbo. E zere okwu ụka pụrụ iche, ma debeghachi ihe atụ nke iguzo na ịda yana olu nnara nke “a ga-eme ka o guzo.”
