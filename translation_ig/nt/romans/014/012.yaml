  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: ig
  text: Ya mere[a], onye ọ bụla n’ime anyị ga-aza ajụjụ banyere onwe ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “N’ihi ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; “Ya mere” bụ Igbo doro anya ma na-edobe ike nkwubi okwu ahụ.
- source_word: ἕκαστος ἡμῶν
  choice: onye ọ bụla n’ime anyị
  rationale: Ọ na-egosipụta nkesa nke ἕκαστος na partitive genitive ἡμῶν n’Igbo nkịtị na nke doro anya.
- source_word: περὶ ἑαυτοῦ
  choice: banyere onwe ya
  rationale: περί tinyere genitive pụtara ihe gbasara ma ọ bụ banyere mmadụ; “banyere onwe ya” na-edobe prepositional sense ahụ nakwa singular reflexive nke Greek.
- source_word: λόγον
  choice: aza ajụjụ
  rationale: N’akpaalaokwu λόγον δώσει, ihe ọ pụtara bụ ịkọwa omume mmadụ ma ọ bụ ịza ajụjụ n’ọnọdụ ikpe ma ọ bụ nyocha; “aza ajụjụ” bụ akpaalaokwu Igbo sitere n’okike nke na-ebuga echiche ahụ.
- source_word: δώσει
  choice: ga-aza
  rationale: Ọ bụ future active indicative nke δίδωμι; ebe ọ bụ akụkụ nke akpaalaokwu λόγον δώσει, e jikọtara ya n’ụzọ sitere n’okike dị ka “ga-aza ajụjụ.”
theological_decisions:
- issue: Singular reflexive n’okwu na-emetụta mmadụ niile
  choice: banyere onwe ya
  alternative: banyere onwe ha; maka onwe ya
  rationale: 'A hapụrụ okwu ahụ n’otu onye dịka Greek si kee ya n’ụzọ nkesa: onye ọ bụla n’ime anyị n’otu n’otu. “Onwe ya” n’Igbo adịghị ekpebi nwoke ma ọ bụ nwanyị, ma ọ ka na-edobe singular ahụ.'
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma dị mfe nghọta. A họọrọ akpaalaokwu “ịza ajụjụ” maka λόγον διδόναι, ebe “banyere onwe ya” na-edobe ihe περί + genitive kwuru kpọmkwem. Akara ndetu [a] dị n’isiokwu ahụ.
