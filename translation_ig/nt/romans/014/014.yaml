  to: Amaara m, ekwenyesikwara m ike n'ime Onyenwe anyị Jizọs, na ọ dịghị ihe ọ bụla na-adịghị ọcha n'onwe ya; otú ọ dị, nye onye na-ewere ihe ọ bụla dị ka ihe na-adịghị ọcha[a], ọ bụ ihe na-adịghị ọcha nye onye ahụ.
