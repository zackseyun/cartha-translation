id: ROM.14.14
reference: Romans 14:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: ig
  text: Amaara m, ekwenyesikwara m ike n'ime Onyenwe anyị Jizọs, na ọ dịghị ihe ọ bụla na-adịghị ọcha n'onwe ya; otú ọ dị, nye onye na-ewere ihe ọ bụla dị ka ihe na-adịghị ọcha[a], ọ bụ ihe na-adịghị ọcha nye onye ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe nkịtị.” N'ebe a, okwu Grik a na-ezokarị aka n'ihe a na-ewere dị ka nke emerụrụ n'ihe gbasara emume okpukpe, ma ọ bụ nke na-adịghị nsọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: Amaara m
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dịkwa mma isi gosipụta ihe onye ahụ maara n'ezie.
- source_word: πέπεισμαι
  choice: ekwenyesikwara m ike
  rationale: Oge perfect nke Grik na-egosi nkwenye siri ike nke guzosiri ike; okwu Igbo a na-egosipụta nke ahụ nke ọma.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: n'ime Onyenwe anyị Jizọs
  rationale: E debere echiche preposition ἐν n'ụzọ na-anaghị akọwa mmekọrịta ahụ karịa ka ihe odide Grik si kwuo.
- source_word: κοινόν
  choice: ihe na-adịghị ọcha
  rationale: N'ọnọdụ a, κοινός na-ekwu banyere ihe a na-ewere dị ka nke na-adịghị ọcha ma ọ bụ nke emerụrụ n'ihe gbasara iwu ịdị ọcha, ọ bụghị nanị ihe nkịtị.
- source_word: δι’ ἑαυτοῦ
  choice: n'onwe ya
  rationale: Nke a na-egosi ọnọdụ ihe ahụ n'onwe ya, ya bụ, na adịghị ọcha abụghị ihe dị n'ime ya site n'ọdịdị ya.
- source_word: τῷ λογιζομένῳ
  choice: nye onye na-ewere
  rationale: N'ebe a λογίζομαι pụtara ile ihe anya ma ọ bụ ikpebi n'uche na ọ bụ otu ụdị.
- source_word: τι
  choice: ihe ọ bụla
  rationale: Ọ na-egosipụta ihe a na-akọwaghị kpọmkwem n'ime ụkpụrụ zuru ezu.
- source_word: ἐκείνῳ κοινόν
  choice: ihe ahụ adịghị ọcha nye ya
  rationale: 'Nke a na-echekwa ike nke dative ahụ: adịghị ọcha a metụtara onye ahụ n''ihi otú o si were ihe ahụ.'
theological_decisions:
- issue: Ihe κοινός pụtara n'ihe gbasara nri na ịdị ọcha
  choice: A sụgharịrị ya dịka “ihe na-adịghị ọcha,” ma kwuo nhọrọ “ihe nkịtị” n'okpuru peeji.
  alternative: ihe nkịtị
  rationale: Pọl na-ekwu na ọ dịghị ihe na-adịghị ọcha site n'ọdịdị ya, ma echiche akọ na uche mmadụ banyere ya ka nwere mmetụta nye onye ahụ. “Ihe na-adịghị ọcha” na-eme ka ọnọdụ iwu ịdị ọcha doo onye Igbo nke oge a anya, ebe nkọwa ala peeji na-echekwa ntụgharị nke rapara nso n'ụdị okwu Grik.
- issue: Mmekọrịta nke ἐν na Onyenwe anyị Jizọs
  choice: n'ime Onyenwe anyị Jizọs
  alternative: site n'aka Onyenwe anyị Jizọs
  rationale: A hapụrụ mmekọrịta ahụ n'ogo sara mbara nke Grik kama ikpebi na ọ bụ naanị isi iyi nke nkwenye ahụ ka a na-ekwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ekwenyesikwara m ike” iji gosi nkwenye guzosiri ike, ebe “n'onwe ya” na-eme ka o doo anya na ihe ahụ abụghị ihe na-adịghị ọcha site n'ọdịdị ya.
