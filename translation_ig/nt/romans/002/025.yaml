id: ROM.2.25
reference: Romans 2:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: ig
  text: N’ihi na ibi úgwù bara uru ma ọ bụrụ na ị na-eme ihe Iwu ahụ kwuru; ma ọ bụrụ na ị bụ onye na-emebi Iwu ahụ, ibi úgwù gị aghọọla ebighị úgwù.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ya bụ, mgbe mmadụ na-emebi Iwu ahụ, ibi úgwù ya anaghịzi abara ya uru dị ka ihe ịrịba ama nke ọgbụgba ndụ.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: ibi úgwù
  rationale: E ji okwu a na-ahụkarị n’Igbo maka circumcision mee ihe, ka e wee debe echiche Pọl banyere ihe ịrịba ama nke ọgbụgba ndụ nakwa njikọ ya na ebighị úgwù.
- source_word: μὲν γὰρ
  choice: N’ihi na …; ma
  rationale: “N’ihi na” na-egosi njikọ nkọwa nke γὰρ, ebe “ma” na-ebute ọdịiche siri ike nke δέ; a hapụrụ μὲν ka usoro ahịrịokwu ahụ gosi nkwenye mbụ nke ga-eduga n’ọdịiche.
- source_word: ὠφελεῖ
  choice: bara uru
  rationale: Nke a na-egosi uru dị adị ma bụrụ nke dabere n’ọnọdụ e kwuru, n’asụsụ Igbo doro anya ma dị ugbu a.
- source_word: ἐὰν νόμον πράσσῃς
  choice: ma ọ bụrụ na ị na-eme ihe Iwu ahụ kwuru
  rationale: Nsụgharị a na-echekwa echiche πράσσω nke ime ma ọ bụ itinye n’ọrụ, ma na-asụ ya n’ụzọ ndị na-agụ Igbo ga-aghọta nke ọma.
- source_word: παραβάτης νόμου
  choice: onye na-emebi Iwu ahụ
  rationale: Nke a na-echekwa ma echiche nke ịgafe oke Iwu ahụ ma njikọ doro anya nke okwu Grik ahụ na νόμος.
- source_word: ἀκροβυστία
  choice: ebighị úgwù
  rationale: N’ebe a, okwu ahụ bụ ihe megidere ibi úgwù n’ihe gbasara ọnọdụ ọgbụgba ndụ, ọ bụghị naanị akụkụ anụ ahụ.
- source_word: γέγονεν
  choice: aghọọla
  rationale: Ụdị ngwaa zuru oke nke Grik na-egosi mgbanwe nke rụpụtara ọnọdụ ka dị ugbu a; “aghọọla” na-echekwa ma mgbanwe ahụ ma nsonaazụ ya.
theological_decisions:
- issue: Ma a ga-akọwa nkebi ikpeazụ dịka naanị otu e si ele mmadụ anya n’ọnọdụ ọgbụgba ndụ, ka a ga-edebe okwu mgbanwe siri ike Pọl ji mee ihe
  choice: E debere ya dịka “ibi úgwù gị aghọọla ebighị úgwù.”
  alternative: A na-agụ ibi úgwù gị dịka ebighị úgwù.
  rationale: γέγονεν siri ike karịa naanị ikwu otu e si gụọ ihe. Okwu a Pọl ji mee ihe na-atụgharị uru nke ibi úgwù n’ụzọ siri ike mgbe mmadụ na-emebi Iwu ahụ; ihe e dere n’okpuru na-akọwa nzube ya n’enweghị ime ka isiokwu ahụ dị nro.
translation_notes:
  register: E ji Standard Igbo dị mfe, dị ugwu, ma bụrụ nke a na-asụ ugbu a mee ihe. A hapụrụ aha “Iwu” ka ọ na-ezo aka n’Iwu ahụ Pọl na-ekwu maka ya, ma debeghachi ntụgharị okwu siri ike dị n’etiti ibi úgwù na ebighị úgwù.
