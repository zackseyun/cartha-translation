  source_fidelity: 'The Igbo accurately conveys the conditional benefit of circumcision, the contrast with being a transgressor of the Law, and the emphatic resultant reversal expressed by γέγονεν: “ibi úgwù gị aghọọla ebighị úgwù.” “N’ihi na …; ma” suitably represents the explanatory and contrastive discourse flow of μὲν γὰρ … δέ.'
