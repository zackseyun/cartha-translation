  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πέποιθάς τε σεαυτὸν ὁδηγὸν εἶναι τυφλῶν, φῶς τῶν ἐν σκότει,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: ig
  text: Ị kwenyekwara na gị onwe gị bụ onye ndu ndị ìsì, bụrụkwa ìhè nye ndị nọ n’ọchịchịrị,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: ị kwenyere
  rationale: Perfect ahụ na-egosi nkwenye siri ike nke ghọrọ ọnọdụ onye ahụ nọ na ya; “ị kwenyere” na-enye echiche nke onye ji n’aka banyere onwe ya.
- source_word: τε
  choice: -kwara
  rationale: Mgbakwunye “-kwara” jikọtara okwu a na ihe ndị bu ya ụzọ n'ụzọ e si ekwu Igbo nke ọma.
- source_word: σεαυτὸν
  choice: gị onwe gị
  rationale: Nke a debere ike e nyere nnọchiaha ntụgharị ahụ ma mee ka ntụkwasị obi onye ahụ nwere n’onwe ya pụta ìhè.
- source_word: ὁδηγὸν
  choice: onye ndu
  rationale: “Onye ndu” bụ okwu Igbo doro anya maka onye na-edu ndị ọzọ n’ụzọ, ma n’ụzọ nkịtị ma n’ụzọ ihe atụ.
- source_word: τυφλῶν
  choice: ndị ìsì
  rationale: Nke a na-anọchi anya ndị mmadụ kpuru ìsì n'ụzọ dị nkenke ma bụrụkwa asụsụ Igbo nkịtị.
- source_word: φῶς
  choice: ìhè
  rationale: “Ìhè” na-echekwa ihe atụ ahụ nke onye na-enye nduzi na nghọta.
- source_word: τῶν ἐν σκότει
  choice: ndị nọ n’ọchịchịrị
  rationale: Nke a na-echekwa ma ndị a na-ekwu banyere ha ma ihe atụ nke ọchịchịrị, n’enweghị ịkọwa kpọmkwem ihe ọchịchịrị ahụ pụtara.
theological_decisions:
- issue: Ma okwu ahụ na-akwado na onye a bụ n’ezie onye ndu na ìhè, ka ọ̀ na-akọ naanị ihe o kweere banyere onwe ya
  choice: E jikọtara aha abụọ ahụ n’okpuru “ị kwenyere na,” ka ha bụrụ ihe onye ahụ kwenyesiri ike banyere onwe ya.
  alternative: Ịsụgharị ya dị ka nkwupụta Pọl kwadoro n’onwe ya.
  rationale: Nhazi Grik ahụ na-etinye ma “onye ndu” ma “ìhè” n’ihe onye a kwenyesiri ike na ya; amaokwu a n’onwe ya adịghị akwado ma ọ bụ gọnahụ izi ezi nke nkwenye ahụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ụda nke nkwenye siri ike banyere onwe onye na ihe atụ abụọ ahụ. “Bụrụkwa” na-egosi na ma “onye ndu” ma “ìhè” dabere n’okwu bụ isi “ị kwenyere na.”
