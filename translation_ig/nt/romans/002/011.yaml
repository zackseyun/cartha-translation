  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: ig
  text: N’ihi na Chineke anaghị ele mmadụ anya n’ihu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Chineke anaghị akpa oke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe mere okwu gara aga ji bụrụ eziokwu; “N’ihi na” na-eweta njikọ nkọwa ahụ nke ọma n’Igbo.
- source_word: προσωπολημψία
  choice: ile mmadụ anya n’ihu
  rationale: Akpaokwu Igbo a na-egosi mmadụ ime mmadụ ibe ya amara ma ọ bụ kpee ikpe n’ụzọ pụrụ iche n’ihi ọkwa ya ma ọ bụ ihe a na-ahụ anya; ọ dabara n’echiche omume na ikpe nke okwu Grik ahụ.
- source_word: παρὰ τῷ θεῷ
  choice: n’ebe Chineke nọ
  rationale: N’usoro okwu a, παρά na-egosi ihe dị n’ebe onye nọ ma ọ bụ otú ihe si metụta ya. Nhọrọ a bụ Igbo ebumpụta ụwa ma na-edobe ọdịdị ahịrịokwu Grik ahụ.
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: N’ihi na ile mmadụ anya n’ihu adịghị n’ebe Chineke nọ.
  rationale: E debere usoro na-ekwu na ihe adịghị, kama ịgbanwe ya ka ọ bụrụ ahịrịokwu omume dịka “Chineke adịghị ele mmadụ anya n’ihu.” Nke a na-anọ okwu Grik nso ma ka bụrụ Igbo doro anya.
theological_decisions:
- issue: Ngosipụta na Chineke adịghị akpa oke
  choice: 'E kwuo ya dịka nkwupụta zuru ụwa ọnụ banyere Chineke: “ile mmadụ anya n’ihu adịghị n’ebe Chineke nọ.”'
  alternative: “Chineke adịghị ele mmadụ anya n’ihu.”
  rationale: Ha abụọ na-ezipụta otu eziokwu ahụ, ma nhọrọ e mere na-edobe usoro ịdị-adịrị nke Grik ma ghara ịgbakwunye omume ngwaa nke adịghị kpọmkwem n’ederede ahụ.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E ji akpaokwu ama ama “ile mmadụ anya n’ihu” mee ka echiche ikpe na-enweghị ele mmadụ anya pụrụ iche pụta ìhè, ebe nkọwa ala peeji na-enye “ịkpa oke” dịka ụzọ ọzọ dị nkenke.
