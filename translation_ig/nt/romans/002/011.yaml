- from: N’ihi na ile mmadụ anya n’ihu adịghị n’ebe Chineke nọ.[a]
  to: N’ihi na Chineke anaghị ele mmadụ anya n’ihu.[a]
  rationale: The revision uses the established, natural Standard Igbo idiom for divine impartiality. It faithfully expresses the meaning of προσωπολημψία and the universal present assertion of the Greek, while avoiding an unnecessarily locative rendering of παρὰ τῷ θεῷ. The footnote preserves a concise alternative expression.
