  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: ig
  text: Ha na-egosi na e dere ọrụ iwu ahụ n’ime obi ha, ebe akọnuche ha na-agbakwa akaebe, echiche ha na-ebokwa ha ebubo ma ọ bụ ọbụna na-agbachitere ha n’etiti onwe ha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: N’ụzọ nkịtị, okwu Grik ahụ nwere echiche nke “n’etiti ibe ha.” A pụkwara ịghọta ya na echiche ha na-ebo ma ọ bụ na-agbachitere ibe ha ebubo.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: na-egosi
  rationale: “Na-egosi” bụ okwu Igbo doro anya nke na-ejigide echiche nke ime ka ihe pụta ìhè n’ebughị ya n’ókè nke ịbụ ihe akaebe na-enweghị mgbagha.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: ọrụ iwu ahụ
  rationale: Nke a na-edobe “ọrụ” dị n’otu dịka Grik si kwuo, kama ịkọwa ya ozugbo dịka “ihe iwu ahụ chọrọ.”
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: dị ka ihe e dere n’ime obi ha
  rationale: Nkebi a na-edobe ihe atụ nke ide ihe n’ime obi ma na-ada nke ọma n’Igbo oge a.
- source_word: συμμαρτυρούσης ... τῆς συνειδήσεως
  choice: Akọnuche ha na-agbakwa akaebe
  rationale: “Na-agbakwa akaebe” na-egosi na akọnuche ha na-enye akaebe na-akwado ihe a na-ekwu.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: echiche ha n’etiti onwe ha
  rationale: Nke a na-agbalị idobe echiche mmeghachi omume dị n’okwu ἀλλήλων, n’agbanyeghị na nhazi ahịrịokwu Grik ahụ dị mkpụmkpụ ma nwee ike ịghọta ya n’ụzọ karịrị otu.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: na-ebokwa ha ebubo ma ọ bụ ọbụna na-agbachitere ha
  rationale: “Na-agbachitere” dabara ἀπολογουμένων karịa “na-enye ngọpụ,” ebe “ọbụna” na-egosipụta ike nke καὶ mgbe ἢ gasịrị.
theological_decisions:
- issue: Ma “ọrụ iwu ahụ” ọ pụtara mmata omume ọma dị n’ime mmadụ n’ozuzu ya, ka ọ bụ kpọmkwem ihe iwu ahụ chọrọ.
  choice: E debere okwu ahụ dịka “ọrụ iwu ahụ” n’ahịrị bụ isi.
  alternative: “ihe iwu ahụ chọrọ”
  rationale: Okwu Grik ahụ dị mkpụmkpụ, ọ kọwaghịkwa ya kpọmkwem dịka ihe iwu chọrọ. Nsụgharị a na-edobe esemokwu na nghọta ime mmụọ dị n’okwu Pọl kama idozi ya n’ụzọ otu.
- issue: Ma echiche ndị ahụ hà na-ebo ma na-agbachitere ibe ha, ka hà na-ebo ma na-agbachitere ndị mmadụ ahụ.
  choice: E dere na echiche ha na-ebo “ha” ebubo ma na-agbachitere “ha.”
  alternative: echiche ha na-ebo ma na-agbachitere ibe ha
  rationale: Ngwaa ndị ahụ nwere ike ịkọwa ikpe echiche ha na-ekpe ndị mmadụ ahụ; ma e debere echiche mmeghachi omume nke ἀλλήλων n’okwu “n’etiti onwe ha” ma kọwaa mgbagwoju anya ya n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. A họọrọ “akọnuche” maka συνείδησις, “ọrụ iwu ahụ” iji chekwaa okwu Grik na-enweghị nkọwa ụka agbakwunyere, ma jiri “n’etiti onwe ha” debe mgbagwoju anya na echiche mmeghachi omume dị na Grik.
