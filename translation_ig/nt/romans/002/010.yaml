    reason: lexical_alternative
  - marker: b
    text: N'ebe a, “onye Gris” yiri ka ọ na-ezo aka n'ụzọ sara mbara n'onye na-abụghị onye Juu.
    reason: cultural_note
  revision_rationale: The revision preserves the Greek syntax and its intentionally literal “Greek” in the main text. It clarifies πρῶτον as sequence/order with “buru ụzọ” and narrows the footnote to the supported broader sense without replacing the source term or imposing a stronger ethnic gloss.
