revisions:
- from: Ma ebube, nsọpụrụ na udo ga-adịrị onye ọ bụla na-eme ihe ọma[a]—onye Juu na mbụ, nakwa onye Gris[b].
  to: Ma ebube, nsọpụrụ na udo ga-adịrị onye ọ bụla na-eme ihe ọma[a]—onye Juu buru ụzọ, nakwa onye Gris[b].
  rationale: The revision preserves the Greek syntax and its intentionally literal “Greek” in the main text. It clarifies πρῶτον as sequence/order with “buru ụzọ” and narrows the footnote to the supported broader sense without replacing the source term or imposing a stronger ethnic gloss.
