language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: ig
  text: Ma ebube, nsọpụrụ na udo ga-adịrị onye ọ bụla na-eme ihe ọma[a]—onye Juu buru ụzọ, nakwa onye Gris[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe dị mma.”
    reason: lexical_alternative
  - marker: b
    text: N'ebe a, “onye Gris” yiri ka ọ na-ezo aka n'ụzọ sara mbara n'onye na-abụghị onye Juu.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: ebube
  rationale: “Ebube” na-egosipụta ịdị ukwuu na otuto a ga-enye mmadụ, ma na-echekwa ịdị arọ nke okwu Grik ahụ n'okwu banyere ụgwọ ikpeazụ.
- source_word: τιμή
  choice: nsọpụrụ
  rationale: “Nsọpụrụ” bụ okwu Igbo doro anya maka ùgwù a na-enye mmadụ, ọ na-adịkwa iche n'ụzọ kwesịrị ekwesị na “ebube.”
- source_word: εἰρήνη
  choice: udo
  rationale: “Udo” na-echekwa nghọta sara mbara nke okwu ahụ n'Akwụkwọ Nsọ n'emeghị ka ọ bụrụ naanị mmetụta ime obi ma ọ bụ naanị mmekọrịta mmadụ na ibe ya.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: onye ọ bụla na-eme
  rationale: Nke a na-egosi onye a na-eji omume ime ihe mara mgbe niile; “onye ọ bụla na-eme” bụ Igbo nkịtị ma doo anya.
- source_word: τὸ ἀγαθόν
  choice: ihe ọma
  rationale: Adjective ahụ e ji article mee ihe pụtara “ihe dị mma” ma ọ bụ “ihe ọma”; “ihe ọma” bụ ụzọ Igbo kacha eke na mkpirikpi isi kwuo ya.
- source_word: Ἰουδαίῳ
  choice: onye Juu
  rationale: “Onye Juu” bụ ntụgharị kpọmkwem ma dị mfe nghọta nke aha agbụrụ na okpukpe a.
- source_word: πρῶτον
  choice: na mbụ
  rationale: “Na mbụ” na-echekwa usoro Pọl kwuru n'etinyeghị nkọwa banyere ihe mere onye Juu ji buru ụzọ.
- source_word: Ἕλληνι
  choice: onye Gris
  rationale: “Onye Gris” na-echekwa okwu e dere kpọmkwem na usoro Pọl ji atụnyere onye Juu na onye Gris; ndetu ala peeji na-akọwa nghọta ya sara mbara.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-egosipụta ntụgharị megidere iwe na ahụhụ e kwuru n'amaokwu bu ụzọ.
theological_decisions:
- issue: Ihe Ἕλληνι pụtara n'usoro okwu “onye Juu na onye Gris”
  choice: E tinyere “onye Gris” n'amaokwu ahụ, ma kọwaa n'ala peeji na ọ pụrụ ịgụnye ndị niile na-abụghị ndị Juu.
  alternative: onye mba ọzọ
  rationale: Nke a na-echekwa okwu Grik ahụ kpọmkwem ma na-ahapụkwa nghọta Pọl nke nwere ike ịdị sara mbara, n'emeghị ka otu nkọwa dochie nke ọzọ n'amaokwu ahụ.
- issue: Ngwaa a ghọtara ma a na-edeghị ya n'okwu Grik
  choice: E tinyere “ga-adịrị” iji mee ka ahịrịokwu ahụ zuo oke n'Igbo ma gosipụta ụgwọ a ga-enye n'ikpe Chineke.
  alternative: 'hapụ ngwaa ahụ: “Ma ebube, nsọpụrụ na udo nye...”'
  rationale: Okwu Grik ahụ enweghị ngwaa e dere ebe a n'ihi na a na-aghọta ya site n'ahịrịokwu gbara ya gburugburu. Igbo chọrọ ngwaa ka ahịrịokwu ahụ bụrụ nke eke; ọnọdụ okwu ahụ na-akwado nghọta ọdịnihu n'ikpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. Ahịrịokwu ahụ na-edobe ọdịiche dị n'etiti “ebube” na “nsọpụrụ,” ma na-eji akara ogologo kewaa akụkụ ikpeazụ n'ụzọ na-eme ka usoro onye Juu na onye Gris doo anya.
