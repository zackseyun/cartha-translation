revisions:
- from: Gị onye na-ekwu, “Akwala iko,” ì na-akwa iko? Gị onye arụsị na-asọ oyi, ì na-apụnara ụlọ arụsị ihe?[a]
  to: Gị onye na-ekwu, “Akwala iko,” ì na-akwa iko? Gị onye na-asọ arụsị oyi, ì na-apụnara ụlọ arụsị ihe?[a]
  rationale: The revision corrects the Igbo syntax of the second participial address so that it unequivocally means ‘you who detest idols.’ It also refines the lexical-alternative footnote into idiomatic Standard Igbo. The concrete temple-robbery rendering remains in the main text, consistent with the likely primary sense of ἱεροσυλεῖς and the immediate reference to idols.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the two parallel rhetorical questions, the adultery prohibition and accusation, and the concrete primary sense of ἱεροσυλεῖς as robbing/plundering a temple or its property. However, the second substantival participial phrase is misordered in Igbo: “Gị onye arụsị na-asọ oyi” does not clearly mean ‘you who detest idols’; it places arụsị as the apparent subject of na-asọ oyi.'
  naturalness: “Gị onye na-asọ arụsị oyi” is the natural, unambiguous Standard Igbo expression. The rest of the verse is clear and retains the compact, accusatory rhetorical register.
  terminology: “Arụsị” appropriately renders εἴδωλα. “Akwala iko” is an established and understandable rendering of the prohibition against adultery in this context. “Ị na-apụnara ụlọ arụsị ihe?” preserves the concrete temple-robbery sense. For the broader lexical alternative, “imebi ihe nsọ” is more idiomatic and semantically clear than “ime ihe nsọ arụ.”
  issues:
  - severity: high
    issue: The phrase “Gị onye arụsị na-asọ oyi” has faulty/ambiguous constituent order.
    rationale: It can read as though idols are doing the detesting, rather than the addressed person detesting idols. The Greek ὁ βδελυσσόμενος τὰ εἴδωλα requires the person as subject and idols as object.
  - severity: medium
    issue: The footnote expression “ì na-eme ihe nsọ arụ?” is not the clearest natural Standard Igbo equivalent for the broader sense ‘do you commit sacrilege?’
    rationale: “Ì na-emebi ihe nsọ?” more naturally conveys violation or desecration of sacred things without narrowing or altering the ambiguity of ἱεροσυλεῖς.
  revised_text: Gị onye na-ekwu, “Akwala iko,” ì na-akwa iko? Gị onye na-asọ arụsị oyi, ì na-apụnara ụlọ arụsị ihe?[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ sara mbara, “ì na-emebi ihe nsọ?”
    reason: lexical_alternative
  revision_rationale: The revision corrects the Igbo syntax of the second participial address so that it unequivocally means ‘you who detest idols.’ It also refines the lexical-alternative footnote into idiomatic Standard Igbo. The concrete temple-robbery rendering remains in the main text, consistent with the likely primary sense of ἱεροσυλεῖς and the immediate reference to idols.
