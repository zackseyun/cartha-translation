  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: ig
  text: Gị onye na-ekwu, “Akwala iko,” ì na-akwa iko? Gị onye na-asọ arụsị oyi, ì na-apụnara ụlọ arụsị ihe?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ sara mbara, “ì na-emebi ihe nsọ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Gị onye na-ekwu
  rationale: Akụkụokwu a ji article na present participle arụ ọrụ dị ka aha ma na-agwa onye a na-atụ anya ya okwu kpọmkwem. “Gị onye na-ekwu” na-edobe ụdị ajụjụ Pọl ji agba onye ahụ aka ná ntị n’Igbo nkịtị.
- source_word: μὴ μοιχεύειν
  choice: Akwala iko
  rationale: μή na infinitive na-egosi ihe e kwuru dị ka iwu machibidoro ịkwa iko. “Akwala iko” bụ ụzọ doro anya, dị mkpirikpi, nke a na-ejikarị ekwu iwu a n’Igbo.
- source_word: μοιχεύεις
  choice: ì na-akwa iko
  rationale: Present indicative dị n’ajụjụ nzaghachi. Ụdị “ì na-akwa iko?” na-ebute ebubo ahụ n’ụzọ nkịtị ma na-edobe njikọ okwu ya na “Akwala iko.”
- source_word: ὁ βδελυσσόμενος
  choice: Gị onye arụsị na-asọ oyi
  rationale: βδελύσσομαι na-egosi oke ịkpọasị na ịjụ ihe kpamkpam. Akpaalaokwu Igbo “ihe na-asọ mmadụ oyi” na-egosipụta mmetụta ahụ n’ụzọ siri ike ma bụrụkwa nke e ji eme ihe ugbu a.
- source_word: τὰ εἴδωλα
  choice: arụsị
  rationale: N’ebe a εἴδωλα bụ ihe oyiyi a na-efe ofufe. “Arụsị” bụ okwu Igbo doro anya maka idols, ma kwekọọ n’ọnọdụ ofufe e kwuru maka ya.
- source_word: ἱεροσυλεῖς
  choice: ì na-apụnara ụlọ arụsị ihe
  rationale: ἱεροσυλέω nwere ike ịpụta n’ụzọ kpọmkwem ịpụnara ụlọ arụsị ma ọ bụ ihe dị n’ime ya. Nsụgharị a na-edobe ihe atụ ahụ na akụkọ ihe mere eme ya, ebe ndetu na-egosi echiche sara mbara nke ime ihe nsọ arụ.
theological_decisions:
- issue: Ma ἱεροσυλεῖς ọ pụtara izu ohi n’ụlọ arụsị kpọmkwem ka ọ bụ ime ihe nsọ arụ n’ozuzu ya
  choice: E tinyere ihe ọ pụtara kpọmkwem—“ì na-apụnara ụlọ arụsị ihe?”—n’ahịrị isi.
  alternative: “ì na-eme ihe nsọ arụ?”
  rationale: Nkọwa kpọmkwem dabara na okwu “arụsị” dị ya nso ma na-edobe ike ajụjụ na ihe gbasara ụlọ ofufe. E debeghịkwa nkọwa sara mbara n’azụ; a kọwara ya na ndetu n’ihi na okwu Grik ahụ nwere ike ibu echiche ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ ajụjụ abụọ ahụ n’usoro yiri ibe ha iji chekwaa ụda okwu Pọl ji ajụ onye ọ na-agwa ajụjụ na-ebo ya ebubo. E tinyere akara ndetu [a] n’ebe okwu ἱεροσυλεῖς dị, ebe ọ bụ okwu ndetu ahụ na-akọwa.
