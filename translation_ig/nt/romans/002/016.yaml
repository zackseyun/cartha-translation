  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: ig
  text: N’ụbọchị Chineke ga-ekpe ihe nzuzo ndị mmadụ ikpe site n’aka Mesaịa Jizọs[a], dị ka ozi ọma m siri dị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Kraịst Jizọs.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: n’ụbọchị ahụ mgbe
  rationale: Nke a na-edobe ntụaka doro anya banyere ụbọchị ikpe ahụ ma na-asụkwa ya n’ụzọ Igbo nkịtị.
- source_word: κρίνει
  choice: ga-… kpee … ikpe
  rationale: Ọ bụ ezie na Grik ji ngwaa oge ugbu a, okwu a na-ele anya n’ụbọchị ikpe ga-abịa; ọdịdị ‘ga-… kpee … ikpe’ na-egosi nke ahụ nke ọma n’Igbo.
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: ihe nzuzo ndị mmadụ
  rationale: Nke a gụnyere ihe ndị mmadụ zoro ezo ma ọ bụ ihe zoro ezo banyere ha, n’ebughị ụzọ kpebie kpọmkwem ụdị ihe nzuzo ahụ.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: dị ka ozi ọma m si kwuo
  rationale: Nke a na-edobe okwu Pọl banyere ‘ozi ọma m’ ma na-eme ka njikọ κατὰ doo anya n’Igbo ugbu a.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: site n’aka Mesaịa Jizọs
  rationale: ‘Site n’aka’ na-egosi onye Chineke ga-eji mee ikpe ahụ; ‘Mesaịa’ na-edobe Χριστός dị ka utu aha n’ebe a.
theological_decisions:
- issue: Ma a ga-asụgharị Χριστοῦ dị ka utu aha ka ọ bụ dị ka aha a na-ejikarị eme ihe
  choice: Mesaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: N’ebe a, Χριστός ka nwere ike ibu echiche nke onye ahụ Chineke tere mmanụ, ya mere e tinyere ‘Mesaịa’ n’ahịrị isi; e debere ụdị ọdịnala ‘Kraịst’ n’okpuru ederede.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘kpee … ikpe’ mee ka okwu ikpe doo anya, e jikwara ‘site n’aka’ gosipụta ọrụ Mesaịa Jizọs dị ka onye Chineke ga-eji mee ikpe ahụ.
