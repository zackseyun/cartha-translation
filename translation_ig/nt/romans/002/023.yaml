  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: ig
  text: Gị onye na-eji iwu ahụ anya isi, ị̀ na-emechu Chineke ihu site n’imebi iwu ahụ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “site ná mmebi iwu ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: ji iwu ahụ
  rationale: N'Igbo, ‘iji ihe anya isi’ bụ ụzọ ebumpụta ụwa e si kwuo ịnya isi n’ihe; ọ na-echekwa iwu ahụ dị ka ihe onye ahụ ji etu ọnụ, n’agbanyeghị na a naghị atụgharị ἐν n’ụzọ nkịtị.
- source_word: καυχᾶσαι
  choice: anya isi
  rationale: ‘Iji ... anya isi’ na-egosipụta nke ọma ụda nkatọ dị na καυχᾶσαι ma bụrụkwa okwu Igbo dị ugbu a ma doo anya.
- source_word: διὰ τῆς παραβάσεως
  choice: site n’imebi
  rationale: ‘Site n’imebi’ na-egosipụta ụzọ ma ọ bụ ihe kpatara mmechu ahụ; ọ bụ nsụgharị ebumpụta ụwa nke διὰ tinyere aha παράβασις, ọ bụ ezie na Igbo ji ngwaa-aha mee ya.
- source_word: παραβάσεως τοῦ νόμου
  choice: imebi iwu ahụ
  rationale: Nhọrọ a na-enye echiche nke ịgafe ma ọ bụ ịda iwu n’Igbo doro anya, na-enweghị itinye nkọwa ụka ọzọ.
- source_word: τὸν θεὸν
  choice: Chineke
  rationale: ‘Chineke’ bụ aha Igbo nkịtị na nke kwesịrị nsọpụrụ maka Chineke; ọ dịghị mkpa ịtụgharị article Grik iche.
- source_word: ἀτιμάζεις
  choice: na-emechu ... ihu
  rationale: ‘Imechu mmadụ ihu’ bụ ụzọ Igbo ebumpụta ụwa si egosi iwepụ nsọpụrụ ma ọ bụ iweta ihere n’ahụ onye ahụ, kwekọrọ na ἀτιμάζω.
theological_decisions:
- issue: νόμος n’arụmụka Pọl
  choice: iwu ahụ
  alternative: Iwu Mosis
  rationale: ‘Iwu ahụ’ na-echekwa okwu Grik νόμος n’enweghị ịgbakwunye ‘Mosis,’ ebe ihe gbara ya gburugburu na-eme ka ihe iwu ahụ na-ezo aka na ya doo anya.
- issue: Ajụjụ nkatọ nke amaokwu ahụ
  choice: 'E debere ya dị ka ajụjụ: ‘ị̀ na-emechu Chineke ihu...?’'
  alternative: 'Nkwupụta: ‘ị na-emechu Chineke ihu...’'
  rationale: Akara ajụjụ nke mbipụta SBLGNT na usoro arụmụka ahụ na-akwado ajụjụ nkatọ, ma ọ naghị agbanwe ebubo siri ike dị n’okwu ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘iwu ahụ’ mee ka ntụaka ahụ bụrụ nke a maara ama n’okwu gbara ya gburugburu; e jighị okwu nkà mmụta ma ọ bụ okwu otu ụka kpọmkwem.
