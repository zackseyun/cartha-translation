  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: ig
  text: Ma ọ bụrụ na ị na-akpọ onwe gị onye Juu[a], na-adabere n’Iwu[b], na-anyakwa isi na Chineke,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ị na-ebu aha onye Juu,” ma ọ bụ, “a na-akpọ gị onye Juu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-ezu ike n’Iwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Na-echekwa ọnọdụ εἰ na ntakịrị ntụgharị ma ọ bụ ọdịiche nke δέ n’arụmụka Pọl.
- source_word: Ἰουδαῖος
  choice: onye Juu
  rationale: N’ebe a okwu ahụ na-ezo isi n’aha agbụrụ na okpukpe, ọ bụghị naanị n’onye si Judia.
- source_word: ἐπονομάζῃ
  choice: ị na-akpọ onwe gị
  rationale: Na-egosipụta nghọta reflexive nke middle voice ma na-echekwa ike okwu Pọl banyere onye ji aha ahụ na-akọwa onwe ya.
- source_word: ἐπαναπαύῃ
  choice: na-adabere
  rationale: Na-egosi ịtụkwasị obi n’Iwu karịa echiche izu ike nkịtị; ọ bụkwa okwu Igbo doro anya ma dị ugbu a.
- source_word: νόμῳ
  choice: n’Iwu
  rationale: Mkpụrụedemede ukwu na-egosi na ihe a na-ekwu bụ Iwu Mozis dị ka ụdị ọgbụgba ndụ a maara nke ọma.
- source_word: καυχᾶσαι
  choice: na-anyakwa isi
  rationale: Na-echekwa ụda okwu Pọl nke ịnya isi, nke ihe gbara ya gburugburu ga-ekpebi ma ọ̀ dị mma ma ọ̀ dị njọ.
- source_word: ἐν θεῷ
  choice: n’ihi Chineke
  rationale: N’Igbo, ‘ịnya isi n’ihi Chineke’ na-enye nghọta ebumpụta ụwa nke isi iyi ma ọ bụ ihe mgbakwasị ụkwụ nke ịnya isi; ndetu ekwesịghị imechi ohere nghọta ‘ịnya isi na Chineke.’
theological_decisions:
- issue: Ihe ‘ịnya isi’ na Chineke pụtara
  choice: na-anyakwa isi n’ihi Chineke
  alternative: na-anya isi na Chineke
  rationale: Nhọrọ bụ isi bụ Igbo dị mfe nghọta, ma a naghị akọwa ma ịnya isi ahụ ọ bụ otuto ziri ezi ma ọ bụ ntụkwasị obi na-ezighi ezi; ihe gbara amaokwu ahụ gburugburu ka na-ekpebi ụda ya.
translation_notes:
  register: Standard Igbo dị ugbu a, kwanyere ugwu ma dị mfe nghọta. E ji ‘Iwu’ nwere mkpụrụedemede ukwu gosi Iwu Mozis. E debere amaokwu ahụ dị ka nkebiokwu ọnọdụ na-aga n’ihu ruo n’amaokwu ndị sochirinụ, ya mere e tinyere rikoma n’ọgwụgwụ.
