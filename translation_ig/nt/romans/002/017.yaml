    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-ezu ike n’Iwu.”
    reason: lexical_alternative
  revision_rationale: 'The revision changes only the final prepositional expression so that it faithfully reflects καυχᾶσαι ἐν θεῷ: boasting in God, not boasting because of God. It also makes the lexical alternative in footnote a more natural while preserving both alternatives represented in the audit trail. The comma is retained because this is a conditional clause continued in the following verses.'
