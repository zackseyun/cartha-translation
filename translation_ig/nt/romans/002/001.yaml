id: ROM.2.1
reference: Romans 2:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: ig
  text: Ya mere, gị onwe gị, mmadụ[a] ọ bụla na-ekpe ikpe, ị nweghị ihe ngọpụ. N’ihi na site n’ikpe onye ọzọ ikpe, ị na-ama onwe gị ikpe, n’ihi na gị onye na-ekpe ikpe na-emekwa otu ihe ndị ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gị onye.” N’asụsụ Grik, okwu a dị n’otu onye na n’ụdị nwoke n’usoro ụtọasụsụ, ma ebe a ọ na-ezo aka n’ụmụ mmadụ niile na-ekpe ikpe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu Pọl wepụtara site n’ihe o kwuru tupu nke a, ma ọ bụkwa okwu Igbo doro anya ma dị mfe.
- source_word: ἀναπολόγητος
  choice: ị nweghị ihe ngọpụ
  rationale: Na-echekwa echiche ikpe nke onye na-enweghị ihe ziri ezi ọ ga-eji gọpụ onwe ya, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ὦ ἄνθρωπε
  choice: gị mmadụ[a]
  rationale: Na-echekwa ịkpọ otu onye okwu ihu na ihu dịka Grik si mee. ‘Mmadụ’ n’Igbo na-ezo aka n’ mmadụ n’agbanyeghị nwoke ma ọ bụ nwaanyị, ya mere ọ na-ebukwa ike nnọchiteanya nke okwu Grik ahụ.
- source_word: πᾶς ὁ κρίνων
  choice: onye ọ bụla na-ekpe ikpe
  rationale: Na-echekwa ike nke πᾶς, nke gụnyere onye ọ bụla na-eme omume ikpe ndị ọzọ, ma kọwaa onye a na-agwa okwu.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: mgbe ị na-ekpe onye ọzọ ikpe
  rationale: 'Na-enye n’Igbo nkịtị echiche nke oge na omume dị n’ahịrịokwu Grik ahụ: n’omume ikpe onye ọzọ, onye ahụ na-ekpe onwe ya ikpe. E kweghị ka ntụgharị ahụ bụrụ nke siri ike ma ọ bụ nke na-adịghị eke.'
- source_word: κατακρίνεις
  choice: ị na-ama onwe gị ikpe ọmụma
  rationale: ‘Ikpe ọmụma’ na-egosi ike ikpe na ịkpọ onye ikpe mara nke κατακρίνω, nke siri ike karịa naanị ‘ikpe ikpe.’
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: na-eme otu ihe ndị ahụ
  rationale: Na-egosi omume a na-eme, dịka ngwaa dị n’oge ugbu a si dị, ma ghara ịgbakwunye echiche na-adịghị na isi mmalite.
- source_word: ὁ κρίνων
  choice: gị onye na-ekpe ikpe
  rationale: Na-echekwa ntụgharị okwu ahụ laghachiri n’ebe onye a na-agwa okwu nọ, ma na-ada dịka ịdọ aka ná ntị kpọmkwem n’Igbo.
theological_decisions:
- issue: Okwu a kpọrọ otu ‘mmadụ’ ma na-emetụta onye ọ bụla na-ekpe ikpe
  choice: E ji ‘gị mmadụ[a]’ n’ahịrịokwu bụ isi, tinyekwa ‘onye ọ bụla na-ekpe ikpe’ iji mee ka ike nnọchiteanya ya doo anya.
  alternative: ‘Gị onye mmadụ’ ma ọ bụ naanị ‘gị onye na-ekpe ikpe.’
  rationale: Grik ji otu aha nwoke n’usoro ụtọasụsụ kpọọ onye ahụ okwu, ma ihe ọ na-ekwu gbasara mmadụ niile na-ekpe ikpe. ‘Mmadụ’ n’Igbo anaghị ekewa nwoke na nwaanyị, ya mere ọ na-echekwa ma ịkpọ otu onye okwu ma obosara ihe okwu ahụ na-ezo aka na ya, na-enweghị ibubata ozizi pụrụ iche.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ụda ịdọ aka ná ntị nke Pọl, ọdịiche dị n’etiti ‘ikpe ikpe’ na ‘ịma ikpe ọmụma,’ nakwa nkwughachi nke na-emesi onye na-ekpe ndị ọzọ ikpe ike.
