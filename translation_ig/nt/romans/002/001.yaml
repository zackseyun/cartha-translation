    text: A pụkwara ịsụgharị ya, “gị onye.” N’asụsụ Grik, okwu a dị n’otu onye na n’ụdị nwoke n’usoro ụtọasụsụ, ma ebe a ọ na-ezo aka n’ụmụ mmadụ niile na-ekpe ikpe.
    reason: lexical_alternative
