  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: ig
  text: Mkpagbu na oke nhụjuanya ga-adakwasị mkpụrụ obi mmadụ ọ bụla[a] nke na-eme ihe ọjọọ—onye Juu buru ụzọ, nakwa onye Grik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “onye ọ bụla” ma ọ bụ “mmadụ ọ bụla.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye mba ọzọ,” ya bụ, onye na-abụghị onye Juu na ntụnyere a nke onye Juu na onye Grik.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: mkpagbu
  rationale: Ọ na-egosi nnukwu nsogbu ma ọ bụ mmekpa ahụ, ma na-adị iche n'okwu ahụ so ya, στενοχωρία.
- source_word: στενοχωρία
  choice: ahụhụ
  rationale: Ọ bụ okwu Igbo doro anya maka nhụjuanya na oke mwute; ya na “mkpagbu” na-arụkọ ọrụ iji chekwaa ike nke okwu abụọ ahụ.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: ga-adakwasị mkpụrụ obi mmadụ ọ bụla
  rationale: “Mkpụrụ obi mmadụ ọ bụla” na-echekwa ihe oyiyi na ịdị nsọ nke ψυχή, ebe “ga-adakwasị” na-eme ka njikọ okwu ahụ zuo oke n'Igbo.
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: nke na-eme ihe ọjọọ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke okike isi kwuo onye na-arụ ihe ọjọọ, n'ebughị nkọwa ọzọ abata.
- source_word: Ἰουδαίου
  choice: onye Juu
  rationale: N'ebe a okwu ahụ na-ezo aka n'òtù ndị Juu, ọ bụghị naanị onye bi na Judia.
- source_word: Ἕλληνος
  choice: onye Gris
  rationale: Ọ na-echekwa okwu Pọl ji mee ntụnyere “onye Juu/onye Gris”; nkọwa ụkwụ na-akọwa na n'ebe a ọ pụtara onye na-abụghị onye Juu.
- source_word: πρῶτον
  choice: na mbụ
  rationale: Ọ na-echekwa usoro ibute onye Juu ụzọ n'okwu Grik n'etinyeghị nkọwa ozizi ọzọ.
theological_decisions:
- issue: Ma a ga-etinye ngwaa nke a na-ekwughị kpọmkwem n'ahịrịokwu Grik dị mkpirikpi
  choice: Mkpagbu na ahụhụ ga-adakwasị...
  alternative: Mkpagbu na ahụhụ n'ahụ...
  rationale: “Ga-adakwasị” na-eme ka ahịrịokwu ahụ bụrụ Igbo zuru oke ma kwekọọ n'ọnọdụ ikpe a na-ekwu maka ya, n'etinyeghị echiche ozizi ọhụrụ.
- issue: Ma ψυχή ọ̀ ga-abụ “mkpụrụ obi” ka ọ bụ naanị “onye”
  choice: mkpụrụ obi mmadụ ọ bụla
  alternative: onye ọ bụla / mmadụ ọ bụla
  rationale: A họọrọ “mkpụrụ obi” iji chekwaa okwu na ihe oyiyi dị na Grik, ma nkọwa ụkwụ na-egosi nsụgharị sara mbara ka a ghara ịmanye echiche na ọ bụ naanị akụkụ ime mmụọ mmadụ ka a na-ekwu maka ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ịdị arọ nke ọkwa ikpe ahụ na ntụnyere Pọl mere n'etiti onye Juu na onye Gris.
