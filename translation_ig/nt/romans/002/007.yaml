id: ROM.2.7
reference: Romans 2:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: ig
  text: ndụ ebighị ebi nye ndị ji ntachi obi na-eme ihe ọma, na-achọ ebube na nsọpụrụ na anwụghị anwụ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: ji ntachi obi na-eme ihe ọma
  rationale: Nke a na-egosipụta ịnọgide na-eme ezi ihe, kama ịsụgharị ya n'ụzọ siri ike dịka ‘ntachi obi nke ọrụ ọma.’
- source_word: δόξαν καὶ τιμὴν
  choice: ebube na nsọpụrụ
  rationale: Okwu Igbo ndị a na-ekwupụta echiche nke δόξα na τιμή n'ụzọ doro anya ma dị ugwu.
- source_word: ἀφθαρσίαν
  choice: anwụghị anwụ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ọnọdụ nke anaghị emebi emebi ma ọ bụ nwụọ; ‘anwụghị anwụ’ bụ okwu nkịtị ndị na-agụ akwụkwọ ga-aghọta.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ nsụgharị Igbo doro anya na nke a na-ejikarị eme ihe maka ndụ na-adịru mgbe ebighị ebi.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ntachi obi n’ime ihe ọma na ndụ ebighị ebi
  choice: 'E debere usoro ahịrịokwu Grik: Chineke na-enye ‘ndụ ebighị ebi’ nye ndị a kọwara dị ka ndị ji ntachi obi eme ihe ọma ma na-achọ ebube, nsọpụrụ, na anwụghị anwụ.'
  alternative: Ịgbakwunye nkọwa na omume ọma bụ naanị ihe akaebe nke okwukwe, ma ọ bụ na ha bụ ntọala nke nzọpụta.
  rationale: Amaokwu ahụ n’onwe ya akọwaghị mmekọrịta ahụ n’ụzọ zuru ezu; ịgbakwunye nkọwa ga-edozi esemokwu nkà mmụta okpukpe nke Pọl hapụrụ n’ebe a.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị mfe ma dị ugwu. E ji ‘na-eme ihe ọma’ mee ka omume na-aga n’ihu pụta ìhè; e zere okwu ụka pụrụ iche ma ọ bụ nkọwa otu ụka.
