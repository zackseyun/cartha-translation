id: ROM.2.4
reference: Romans 2:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: ig
  text: Ma ọ bụ na ị na-eleda akụ nke obiọma[a] ya, na ntachi obi ya, na ogologo ntachi obi ya anya, n’amaghị na obiọma Chineke na-eduga gị ná nchegharị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “obiọma” dịka “ịdị mma” n’ebe abụọ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: akụ̀
  rationale: “Akụ̀” na-echekwa ihe atụ Pọl ji akụ na ụba kọwaa ịdị ukwuu na ịba ụba nke àgwà Chineke.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: obiọma
  rationale: “Obiọma” dabara n’omume ọma Chineke n’ebe onye mmehie nọ ma na-echekwa otu okwu n’ebe abụọ ahụ.
- source_word: ἀνοχῆς
  choice: ntachi obi
  rationale: N’ebe a ọ pụtara Chineke ijide onwe ya ma ghara iweta ikpe ozugbo.
- source_word: μακροθυμίας
  choice: ogologo ntachi obi
  rationale: Nkebi a na-eme ka ọdịiche dị n’etiti ἀνοχή na μακροθυμία pụta, ma na-egosi ndidi na-adịte aka.
- source_word: καταφρονεῖς
  choice: na-eleda ... anya
  rationale: Akpaalaokwu Igbo a na-enye ike nke ilelị ma ọ bụ iwere ihe dị ka ihe na-abaghị uru.
- source_word: ἀγνοῶν
  choice: n’amaghị
  rationale: Ọ na-anọchi participle Grik ahụ n’ụzọ eke, na-agbakwụnyeghị echiche na onye ahụ kpachaara anya jụ ịma.
- source_word: εἰς μετάνοιάν
  choice: ná nchegharị
  rationale: “Nchegharị” gụnyere ịtụgharị uche na ụzọ ndụ n’ebe Chineke nọ, ma “ná” na-egosi ntụziaka nke εἰς.
- source_word: ἄγει
  choice: na-eduga
  rationale: Ọ na-echekwa present tense ahụ dịka omume Chineke na-aga n’ihu.
theological_decisions:
- issue: Ma a ga-asụgharị χρηστότης / χρηστόν dịka “obiọma” ma ọ bụ “ịdị mma.”
  choice: E ji “obiọma” mee ihe n’ebe abụọ ahụ.
  alternative: “Ịdị mma” n’otu ebe ma ọ bụ n’ebe abụọ ahụ.
  rationale: “Obiọma” na-egosipụta nke ọma omume amara Chineke na ndidi ya n’ebe onye mmehie nọ, ma ọ naghị ewepụ echiche sara mbara nke ịdị mma.
- issue: Ma ἄγει na-ekwu na obiọma Chineke na-akpọga mmadụ ná nchegharị ma ọ bụ na ọ na-eme ka nchegharị pụta n’enweghị nzaghachi mmadụ.
  choice: “na-eduga gị ná nchegharị”
  alternative: “na-eme ka i chegharịa”
  rationale: Nhọrọ a na-echekwa ihe atụ nke idu mmadụ gaa n’ebe a chọrọ nakwa esemokwu dị n’ederede ahụ, n’ebughị ụzọ kpebie kpọmkwem otú idu ahụ si metụta nzaghachi mmadụ.
translation_notes:
  register: 'Igbo Izugbe dị ugbu a, dị ùgwù ma doo anya. A họọrọ “Ka ì” iji chekwaa ajụjụ ọzọ nke ἤ nke jikọrọ amaokwu a na arụmụka bu ya ụzọ. E debere okwu atọ ahụ iche: obiọma, ntachi obi, na ogologo ntachi obi.'
