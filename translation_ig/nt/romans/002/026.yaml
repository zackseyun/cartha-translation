revisions:
- from: Ya mere, ọ bụrụ na onye a na-ebighị úgwù na-edebe ihe iwu ahụ chọrọ, ọ̀ bụ na a gaghị agụ ọnọdụ ya nke ịbụ onye a na-ebighị úgwù dị ka ibi úgwù?[a]
  to: Ya mere, ọ bụrụ na onye na-enweghị ibi úgwù edebe ihe Iwu ahụ chọrọ, ọ̀ bụ na a gaghị agụ enweghị ibi úgwù ya dịka ibi úgwù?[a]
  rationale: The revision retains the personal sense of the first use of ἀκροβυστία but restores the direct repeated nominal expression in the second use. It also improves idiomatic Standard Igbo and preserves the Greek’s rhetorical, passive-accounting sense without implying a physical change of circumcision status.
