id: ROM.2.26
reference: Romans 2:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: ig
  text: Ya mere, ọ bụrụ na onye na-enweghị ibi úgwù edebe ihe Iwu ahụ chọrọ, ọ̀ bụ na a gaghị agụ enweghị ibi úgwù ya dịka ibi úgwù?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “ọ bụrụ na enweghị ibi úgwù na-edebe ... ọ̀ bụ na a gaghị agụ enweghị ibi úgwù ya dịka ibi úgwù?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: onye a na-ebighị úgwù / ọnọdụ ya nke ịbụ onye a na-ebighị úgwù
  rationale: Aha Grik ahụ pụtara n'ụzọ nkịtị ‘enweghị ibi úgwù,’ ma n’ebe mbụ ọ na-anọchi anya onye ahụ; αὐτοῦ (‘ya’) na-egosi nke a. Nsụgharị a na-eme ka onye a na-ekwu maka ya doo anya, ma n’ebe nke abụọ na-echekwa echiche banyere ọnọdụ ya.
- source_word: δικαιώματα
  choice: ihe iwu ahụ chọrọ
  rationale: Nke a na-egosi ihe iwu ahụ na-achọ ka e mee n’asụsụ Igbo doro anya, na-etinyeghị nkwusi ike ọzọ nke okwu Grik ahụ na-achọghị n’ebe a.
- source_word: νόμου
  choice: iwu ahụ
  rationale: Akara ‘ahụ’ na-ezo aka n’iwu a maara n’arụmụka Pọl, ya bụ Iwu Mozis, n’enweghị ịgbakwunye aha ahụ n’amaokwu.
- source_word: φυλάσσῃ
  choice: na-edebe
  rationale: ‘Idebe’ bụ okwu Igbo a na-ejikarị ekwu irube isi n’iwu ma ọ bụ n’ihe enyere n’iwu.
- source_word: λογισθήσεται
  choice: a gaghị agụ ... dị ka
  rationale: ‘Ịgụ ... dị ka’ na-echekwa ihe atụ nke ịgbakọ ma ọ bụ ịkwanyere ihe ọnọdụ, nke dị n’okwu Pọl, ma bụrụkwa Igbo doro anya.
- source_word: εἰς περιτομήν
  choice: dị ka ibi úgwù
  rationale: N’usoro okwu a, εἰς na-egosi ọnọdụ ma ọ bụ otu a ga-esi were ya; ‘dị ka’ na-enye echiche ahụ nke ọma.
- source_word: οὐχ
  choice: ọ̀ bụ na a gaghị ...?
  rationale: Ajụjụ a na-atụ anya azịza nkwenye. Usoro Igbo a na-echekwa ụdị ajụjụ arụmụka ahụ.
theological_decisions:
- issue: Ma amaokwu ahụ ọ na-ekwu na onye a na-ebighị úgwù aghọọla onye e biri úgwù n’anụ ahụ
  choice: A sụgharịrị ya dịka ịgụ ọnọdụ ya ‘dị ka ibi úgwù,’ ya bụ ọnọdụ e nyere ya n’arụmụka ahụ.
  alternative: Ikwu na ọ ghọrọ onye e biri úgwù n’anụ ahụ.
  rationale: λογισθήσεται na εἰς περιτομήν na-ekwu maka otu a ga-esi gụọ ma ọ bụ were ọnọdụ ahụ, ọ bụghị mgbanwe anụ ahụ. Nsụgharị ahụ anaghị ekpebi karịa ihe ederede kwuru banyere nkọwa nkà mmụta okpukpe sara mbara.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Onye a na-ebighị úgwù’ na-eme ka ojiji aha nkịtị Grik dị ka onye doo anya; ihe odide ala ala peeji na-echekwa ọdịdị nkịtị na mgbagwoju anya nke okwu ἀκροβυστία.
