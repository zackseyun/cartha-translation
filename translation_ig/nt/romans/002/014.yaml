  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: ig
  text: N’ihi na mgbe ọ bụla ndị mba ọzọ[a], ndị na-enweghị iwu ahụ, n’ụzọ ebumpụta ụwa[b] na-eme ihe iwu ahụ chọrọ[c], ndị a, ọ bụ ezie na ha enweghị iwu ahụ, bụ iwu nye onwe ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site ná mkpali ebumpụta ụwa.”
    reason: lexical_alternative
  - marker: c
    text: N'ụzọ nkịtị, “na-eme ihe ndị dị n’iwu ahụ.”
    reason: source_form
lexical_decisions:
- source_word: ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ebe a, okwu ahụ na-egosi ndị na-abụghị ndị Juu, ọ bụghị naanị mba dị iche iche; “ndị mba ọzọ” na-eme ka ọdịiche Pọl na-egosi n’etiti ha na ndị nwere Iwu Mosis doo anya.
- source_word: νόμον / νόμου / νόμος
  choice: iwu ahụ / iwu
  rationale: '“Iwu ahụ” na-egosi Iwu Mosis n’akụkụ abụọ mbụ, ebe “iwu” na-enweghị ihe na-akọwapụta ya n’ahịrị ikpeazụ na-echekwa ntụgharị okwu Pọl: “bụ iwu nye onwe ha.”'
- source_word: φύσει
  choice: ji ọdịdị ebumpụta ụwa
  rationale: Nke a na-echekwa echiche sara mbara nke okwu Grik ahụ, na-akọwaghị ya ozugbo dị ka mkpali ebumpụta ụwa, akọ na uche, ma ọ bụ omenala.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: eme ihe ndị dị n’iwu ahụ
  rationale: Nhọrọ a na-esochi usoro okwu Grik nke ọma ma ka na-ada ka Igbo dị ugbu a; ọ naghị amanye nkọwa ahụ ka ọ bụrụ naanị “ihe iwu ahụ chọrọ.”
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: bụ iwu nye onwe ha
  rationale: Nke a na-echekwa ihe atụ na egwuregwu okwu Pọl n’iji otu okwu ahụ bụ “iwu,” n’etinyeghị echiche siri ike na ha ji aka ha kee iwu nke ha.
theological_decisions:
- issue: Ihe φύσει pụtara banyere ihe mmadụ maara gbasara ezi ihe na ihe ọjọọ
  choice: E debere ya dịka “ji ọdịdị ebumpụta ụwa” n’ahịrị bụ isi.
  alternative: “site ná mkpali ebumpụta ụwa” ma ọ bụ “dị ka mmụọ ha si du ha”
  rationale: Okwu Grik ahụ n’onwe ya ekpebighị ma Pọl ọ na-ekwu kpọmkwem banyere akọ na uche e bu pụta ụwa, omume omenala, ma ọ bụ ọnọdụ mmadụ. Nsụgharị ahụ na-echekwa obosara na esemokwu nkọwa a.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A hapụrụ usoro nkwughachi nke “iwu” ka ntụgharị okwu na njikọ echiche dị n’asụsụ Grik ghara ifu; e tinyekwara akara nkọwa ala peeji niile [a], [b], na [c] n’ahịrị bụ isi.
