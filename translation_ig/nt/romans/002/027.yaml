  to: Onye a na-ebighị úgwù site n'ọmụmụ[a], ọ bụrụ na ọ na-emezu iwu ahụ, ga-ekpe gị ikpe—gị onye nwere ihe e dere ede na ibi úgwù ma na-emebi iwu ahụ.[b]
  rationale: The revision removes the unsupported explicit concessive ‘n'agbanyeghị na’ while retaining the contextual contrast between possessing the written code and circumcision and being a lawbreaker. The conditional rendering of the participle remains acceptable in this argument, and all footnote anchors and notes are retained.
