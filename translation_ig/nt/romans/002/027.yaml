id: ROM.2.27
reference: Romans 2:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: ig
  text: Onye a na-ebighị úgwù site n'ọmụmụ[a], ọ bụrụ na ọ na-emezu iwu ahụ, ga-ekpe gị ikpe—gị onye nwere ihe e dere ede na ibi úgwù ma na-emebi iwu ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, ‘enweghị ibi úgwù’; ya bụ, onye a na-ebighị úgwù.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ‘ihe e dere ede’ dịka ‘iwu e dere ede.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: onye a na-ebighị úgwù
  rationale: Ọ bụ ezie na okwu Grik a pụtara n'ụzọ nkịtị ‘enweghị ibi úgwù,’ e ji ya nọchie anya mmadụ a na-ebighị úgwù. Nsụgharị a na-eme ka onye a na-ekwu maka ya doo anya n'etinyeghị okwu agbụrụ dịka ‘onye mba ọzọ.’
- source_word: ἐκ φύσεως
  choice: site n'ọmụmụ
  rationale: N'ọnọdụ a, okwu ahụ na-egosi na onye ahụ abụghị onye e biri úgwù n'ọnọdụ ebumpụta ụwa ya. ‘Site n'ọmụmụ’ bụ Igbo doro anya nke na-ezere echiche na a na-ekwu maka agwa mmadụ.
- source_word: τελοῦσα
  choice: ọ bụrụ na ọ na-emezu
  rationale: Participle ahụ na-egosi ime iwu ahụ n'ezie, ma n'usoro arụmụka a ọ nwere nghọta dabere n'ọnọdụ. ‘Ọ bụrụ na ọ na-emezu’ na-egosipụta nghọta a ma na-echekwa ike nke τελέω.
- source_word: νόμον
  choice: iwu ahụ
  rationale: Definite article na ọnọdụ okwu ahụ na-atụ aka n'iwu a maara ama, ya bụ Iwu Mozis; ‘iwu ahụ’ na-egosipụta kpọmkwemness ahụ n'Igbo.
- source_word: διὰ γράμματος
  choice: n'agbanyeghị na i nwere ihe e dere ede
  rationale: γράμμα na-ezo aka n'ụdị iwu e dere ede. N'usoro Igbo, ‘i nwere ihe e dere ede’ na-eme ka uru onye ahụ nwere pụta ìhè, ebe ‘n'agbanyeghị’ na-egosipụta ọdịiche dị n'etiti inwe ya na imebi iwu ahụ.
- source_word: περιτομῆς
  choice: ibi úgwù
  rationale: Nke a bụ okwu Igbo kwụ ọtọ maka akara ọgbụgba ndụ nke ibi úgwù.
- source_word: παραβάτην νόμου
  choice: na-emebi iwu ahụ
  rationale: Nsụgharị a na-edobe njikọ doro anya na νόμος ma na-ada ka Igbo nkịtị karịa aha siri ike nke pụtara ‘onye ngabiga iwu.’
theological_decisions:
- issue: Ma a ga-eme ka ọdịiche ahụ bụrụ nke agbụrụ kpọmkwem site n'ịsụgharị ἀκροβυστία dịka ‘onye mba ọzọ’
  choice: E debere okwu dị warara, ‘onye a na-ebighị úgwù,’ n'ahịrị isi.
  alternative: onye mba ọzọ
  rationale: Arụmụka Pọl metụtara ndị Juu na ndị mba ọzọ, ma okwu Grik dị n'amaokwu a kpọmkwem na-atụnyere ibi úgwù na enweghị ibi úgwù. Nsụgharị ahụ anaghị etinye aha agbụrụ nke okwu ahụ n'onwe ya ekwughị.
- issue: Mmekọrịta nke διὰ γράμματος καὶ περιτομῆς na ịbụ onye na-emebi iwu
  choice: 'A sụgharịrị ya dịka uru mmadụ nwere ma ọ ka na-emebi iwu: ‘n''agbanyeghị na i nwere ihe e dere ede na ibi úgwù.’'
  alternative: ‘site n'ihe e dere ede na ibi úgwù’
  rationale: 'διὰ nwere ike ịpụta ‘site na’ ma ọ bụ gosi ọnọdụ/ụzọ metụtara ihe ahụ. Nsụgharị isi na-enye Igbo eke ma na-echekwa isi ọdịiche Pọl: inwe iwu e dere ede na ibi úgwù egbochighị ngabiga iwu.'
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. Ahịrịokwu ahụ na-edobe onye a na-ebighị úgwù megide onye nwere iwu e dere ede na ibi úgwù, n'etinyeghị nkọwa otu ụka ọ bụla. Ihe nrịbama [a] na [b] dị n'ahịrị isi ma kwekọọ na nkọwa ala peeji.
