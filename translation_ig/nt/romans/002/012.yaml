  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: ig
  text: N’ihi na ndị niile mehiere n’enweghị iwu ahụ[a] ga-alakwa n’iyi n’enweghị iwu ahụ[a]; ndị niile mehiere n’okpuru iwu ahụ[b] ka a ga-eji iwu ahụ kpee ha ikpe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ἀνόμως n’ebe abụọ ahụ dịka “n’enweghị iwu ahụ” ma ọ bụ “n’ụzọ megidere iwu.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’ime iwu ahụ”; “n’okpuru iwu ahụ” na-egosi ịnọ n’ime ọchịchị na ikike ikpe nke iwu ahụ.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “iwu ahụ ga-abụ ihe e ji kpee ha ikpe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: n’enweghị iwu ahụ
  rationale: Nke a na-egosi na ha anọghị n’okpuru Iwu Mosis, kama ịsụgharị ya naanị dị ka ime ihe n’emebi iwu; ọ na-echekwa ọdịiche Pọl mere na ἐν νόμῳ.
- source_word: ἥμαρτον
  choice: mehiere / mere mmehie
  rationale: Okwu abụọ a bụ ụzọ Igbo doro anya isi kwuo otu echiche ahụ n’oge gara aga, n’etinyeghị nkọwa ọzọ n’ụdị aorist ahụ.
- source_word: ἀπολοῦνται
  choice: ga-alakwa n’iyi
  rationale: Ọ na-echekwa ihe ga-eme n’ọdịnihu na echiche nke ịla n’iyi, n’ekpebighị ma okwu ahụ na-akọ mkpochapụ kpamkpam ma ọ bụ ụdị ntaramahụhụ ikpeazụ ọzọ.
- source_word: ἐν νόμῳ
  choice: n’okpuru iwu ahụ
  rationale: Ọ na-egosi ịdị n’ime ọchịchị na ikike ikpe nke Iwu ahụ, nke kwekọrọ na ọdịiche dị n’etiti ndị Juu na ndị mba ọzọ n’arụmụka Pọl.
- source_word: διὰ νόμου
  choice: site n’iwu ahụ
  rationale: Ọ na-echekwa iwu ahụ dịka ụzọ ma ọ bụ ihe e ji ekpe ikpe, ma na-ekewapụ ya na ἐν νόμῳ.
- source_word: κριθήσονται
  choice: ka a ga-esite ... kpee ikpe
  rationale: A họọrọ okwu ikpe na-anọpụ iche kama ‘maa ha ikpe,’ ka ọnọdụ gbara ya gburugburu bụrụ ihe ga-egosi ma ikpe ahụ bụ ọmụma ikpe.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: ndị niile ...; ndị niile
  rationale: Nke a na-echekwa ike nkesa na nhazi ahịrịokwu abụọ yiri ibe ha.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe ndabere maka okwu bu ya ụzọ.
theological_decisions:
- issue: Ihe νόμος na-ezo aka na ya
  choice: Iwu Mosis karịsịa, nke a sụgharịrị dị ka ‘iwu ahụ’
  alternative: iwu omume n’ozuzu ya
  rationale: Ọdịiche ndị Juu na ndị mba ọzọ na Ndị Rom 2 na-elekwasị anya n’ebe ndị na-enweghị Iwu Mosis na ndị nọ n’okpuru ya nọ; ntụgharị ahụ adịghị agbakwụnye ‘Mosis’ n’ahịrịokwu isi.
- issue: Ihe ‘ịla n’iyi’ pụtara banyere ikpe ikpeazụ
  choice: ga-alakwa n’iyi, n’akọwaghị ụzọ mbibi ahụ ga-adị
  alternative: a ga-ama ha ikpe / a ga-ebibi ha
  rationale: ἀπολοῦνται na-ekwu ihe ga-esi n’ikpe pụta ma amaokwu a n’onwe ya akọwaghị ma ọ bụ mkpochapụ kpamkpam ma ọ bụ ntaramahụhụ ebighị ebi; a chekwara esemokwu nkà mmụta okpukpe ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E chekwara nhazi ahịrịokwu abụọ yiri ibe ha na ọdịiche dị n’etiti enweghị iwu, ịnọ n’okpuru iwu, na isite n’iwu kpee ikpe.
