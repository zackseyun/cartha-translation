id: ROM.2.21
reference: Romans 2:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: ig
  text: Ya mere, gị onye na-akụziri onye ọzọ ihe, ị naghị akụziri onwe gị ihe? Gị onye na-ekwusa, “Ezulana ohi,” ị na-ezu ohi?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n'ihe e kwuru tupu ya ma na-echekwa ike njikọ arụmụka ahụ.
- source_word: διδάσκων
  choice: onye na-akụziri ... ihe
  rationale: A tụgharịrị participle ahụ dịka nkebiokwu na-akọwa onye ahụ, nke bụ ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa.
- source_word: ἕτερον
  choice: onye ọzọ
  rationale: Na-echekwa ụdị otu onye dị na Grik, kama ịgbanwe ya ka ọ bụrụ ọtụtụ mmadụ.
- source_word: σεαυτὸν
  choice: onwe gị
  rationale: Na-echekwa ọdịiche siri ike dị n'etiti ịkụziri onye ọzọ na ịkụziri onwe onye.
- source_word: οὐ διδάσκεις;
  choice: ị naghị akụziri ... ihe?
  rationale: Na-echekwa ajụjụ ịba mba ahụ na-atụ anya na omume onye ahụ ekwesịghị ịdị otú a.
- source_word: κηρύσσων
  choice: onye na-ekwusa
  rationale: Na-egosi ikwupụta ozi n'ihu ọha n'etinyeghị echiche pụrụ iche nke otu ụka.
- source_word: μὴ κλέπτειν
  choice: Ezula ohi
  rationale: E nyere ọdịnaya nkwusa ahụ dịka iwu mgbochi kpọmkwem, n'ụzọ doro anya ma dịkwa mma n'Igbo.
- source_word: κλέπτεις;
  choice: ị̀ na-ezu ohi?
  rationale: Na-echekwa ajụjụ kpọmkwem nke Pọl ji agba onye ahụ akaebe ihu.
theological_decisions: []
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji “gị onye...” ugboro abụọ chekwaa nhazi yiri ibe ya na ike okwu Grik; akara ụda dị na “ị̀” na-eme ka a mata na ọ bụ ajụjụ.
