source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: ig
  text: 'Ma ndị agụụ ịchọ ọdịmma onwe ha na-akpali[a], ndị na-enupụrụ eziokwu isi ma na-erubere ajọ omume[b] isi: iwe na ọnụma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị na-achọ ọdịmma onwe ha,” ma ọ bụ “ndị na-eme ihe n’ihi ịsọ mpi.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ihe na-ezighị ezi,” ma ọ bụ “ikpe na-adịghị mma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: ndị na-achọ naanị ọdịmma onwe ha
  rationale: Nke a na-egosi na ọchịchọ nke uru onwe onye bụ ihe na-akpali ha; ọ bụkwa okwu Igbo doro anya nke na-adịghị eme ka echiche ahụ bụrụ naanị esemokwu n’etiti ndị mmadụ.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: ndị na-enupụrụ eziokwu isi
  rationale: ‘Inupụrụ … isi’ na-echekwa echiche nke ịjụ nrubeisi, ọ bụghị naanị ekweghị ekwe.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: ma na-erubere ajọ omume isi
  rationale: E debere myirịta dị n’etiti inupụrụ eziokwu isi na irubere ajọ omume isi, tinyere ntụgharị nke δέ.
- source_word: ἀδικίᾳ
  choice: ajọ omume
  rationale: N’Igbo nke oge a, ‘ajọ omume’ na-ekpuchi ihe na-ezighị ezi n’ụzọ omume ma na-adaba n’ọnọdụ ikpe Chineke; ‘ikpe na-ezighị ezi’ nwere ike ime ka okwu ahụ bụrụ naanị mmegbu n’ihe gbasara ikpe.
- source_word: ὀργὴ
  choice: iwe
  rationale: ‘Iwe’ bụ okwu Igbo dị ebube ma doo anya maka iwe nke na-abịa n’ikpe.
- source_word: θυμός
  choice: ọnụma
  rationale: ‘Ọnụma’ na-enye okwu nke abụọ ike ma na-edobe njikọ okwu abụọ ahụ, ὀργὴ καὶ θυμός.
- source_word: implicit verbal ellipsis
  choice: akara ntụpọ abụọ tupu ‘iwe na ọnụma’
  rationale: Asụsụ Grik etinyeghị ngwaa n’ebe a; akara ntụpọ abụọ na-edobe mkpụmkpụ na ike nke ahịrịokwu ahụ n’etinyeghị ‘ga-adị’ ma ọ bụ ‘ga-abịakwasị ha.’
theological_decisions:
- issue: Ịsụgharị ἀδικία n’ọnọdụ ikpe Chineke
  choice: ajọ omume
  alternative: ikpe na-ezighị ezi
  rationale: ‘Ajọ omume’ na-edobe obosara nke mmegide omume megide eziokwu, ebe ‘ikpe na-ezighị ezi’ nwere ike ịdị warara karịa ihe Pọl bu n’obi.
- issue: Onye iwe na ọnụma ahụ bụ nke ya n’ahịrịokwu na-enweghị ngwaa
  choice: E tinyeghị ‘Chineke’ ma ọ bụ ngwaa n’ahịrịokwu a
  alternative: iwe na ọnụma Chineke ga-abịakwasị ha
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi ikpe Chineke, ma ahịrịokwu Grik n’onwe ya hapụrụ nke a n’enweghị ngwaa; ntụgharị ahụ na-echekwa nkwụsị na ike ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. Nkebi ahịrịokwu ndị yiri ibe ha—‘na-enupụrụ … isi’ na ‘na-erubere … isi’—na-eme ka ọdịiche nke Grik pụta ìhè. E debere ahịrịokwu ikpeazụ n’enweghị ngwaa dịka ọ dị n’asụsụ isi.
