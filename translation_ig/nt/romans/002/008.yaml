- from: 'Ma ndị na-achọ naanị ọdịmma onwe ha[a], ndị na-enupụrụ eziokwu isi ma na-erubere ajọ omume[b] isi: iwe na ọnụma.'
  to: 'Ma ndị agụụ ịchọ ọdịmma onwe ha na-akpali[a], ndị na-enupụrụ eziokwu isi ma na-erubere ajọ omume[b] isi: iwe na ọnụma.'
  rationale: 'The revision preserves the Greek ellipsis and the strong parallel between refusing obedience to truth and giving obedience to unrighteousness. It improves the rendering of the motive expressed by ἐξ ἐριθείας and corrects both footnotes: the first is idiomatic Igbo, and the second avoids defining ἀδικία solely as an unjust legal verdict. No theological expansion has been added.'
