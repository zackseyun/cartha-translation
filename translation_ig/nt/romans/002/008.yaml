review_pass:
  verdict: revise
  source_fidelity: 'The main contrast is retained: selfishly motivated people disobey the truth and give obedience to ἀδικία, followed by the terse judgment pair “wrath and fury.” The proposed wording more explicitly conveys the motivational force of ἐξ ἐριθείας. The existing footnote’s “ikpe na-ezighị ezi” is too narrow, since ἀδικία is not limited to an unjust legal judgment.'
  naturalness: The draft is generally clear Standard Igbo, but footnote a contains an unidiomatic phrase (“ndị ọchịchọ ọdịmma onwe ha na-akpali”). “Ndị agụụ ịchọ ọdịmma onwe ha na-akpali” is natural and expresses the intended motivation. The parallel “na-enupụrụ ... isi / na-erubere ... isi” is effective and should remain.
  terminology: “Ajọ omume” is a suitable broad rendering for ἀδικία in this judgment context, while “ihe na-ezighị ezi” is a valid lexical alternative. “Iwe na ọnụma” appropriately preserves the paired ὀργὴ καὶ θυμός without forcing a distinction beyond the Greek context.
  issues:
  - severity: medium
    issue: Footnote a is grammatically and idiomatically defective.
    rationale: “ndị ọchịchọ ọdịmma onwe ha na-akpali” does not naturally express ‘those motivated by selfish ambition.’ It should use a noun phrase such as “agụụ ịchọ ọdịmma onwe ha.”
  - severity: medium
    issue: Footnote b gives an overly restricted alternative.
    rationale: “ikpe na-ezighị ezi” means an unjust judgment/verdict and restricts ἀδικία to judicial procedure. The Greek term here more broadly denotes unrighteousness, injustice, or wrongdoing.
  - severity: low
    issue: The main wording weakens the motivational nuance of ἐξ ἐριθείας.
    rationale: “ndị na-achọ naanị ọdịmma onwe ha” is understandable, but can sound like ordinary self-interest. “ndị agụụ ịchọ ọdịmma onwe ha na-akpali” better represents action arising from selfish ambition.
