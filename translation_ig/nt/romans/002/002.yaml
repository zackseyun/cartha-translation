  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: ig
  text: Ma anyị maara na ikpe Chineke megide ndị na-eme ụdị ihe ndị a dị ka eziokwu si dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ụzọ kwekọrọ n'eziokwu”; ya bụ, ikpe Chineke kwekọrọ n'ihe bụ eziokwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: Anyị makwaara
  rationale: Οἶδα nwere nghọta nke oge ugbu a n'ebe a. “Anyị makwaara” na-egosikwa njikọ okwu a na amaokwu bu ya ụzọ.
- source_word: δέ
  choice: -kwa-
  rationale: N'ebe a δέ na-aga n'ihu n'echiche karịa igosi nnukwu ọdịiche; mgbakwunye “-kwa-” na-eme ka njikọ ahụ daa nke ọma n'Igbo.
- source_word: κρίμα
  choice: na-ekpe ... ikpe
  rationale: A gbanwere aha okwu Grik ahụ ka ọ bụrụ usoro ngwaa Igbo a na-ejikarị ekwu ikpe ikpe, n'ebughị ụzọ belata ya ka ọ bụrụ naanị amamikpe.
- source_word: κατὰ ἀλήθειαν
  choice: dịka eziokwu si dị
  rationale: Nke a na-echekwa echiche na ikpe Chineke kwekọrọ n'eziokwu ma ọ bụ n'ihe dị adị, kama ịsụgharị ya naanị dịka “n'ụzọ ziri ezi.”
- source_word: ἐπὶ
  choice: na-ekpe ndị ... ikpe
  rationale: Usoro Igbo “ikpe mmadụ ikpe” na-egosi na ikpe ahụ metụtara ndị ahụ; ọ na-ezere ntụgharị siri ike nke “megide” ma na-echekwa ntụziaka ikpe ahụ.
- source_word: τὰ τοιαῦτα
  choice: ụdị ihe ndị a
  rationale: Nke a bụ okwu Igbo doro anya nke na-ezo aka n'ụdị omume ndị a kpọtụrụ aha n'amaokwu ndị bu ụzọ.
- source_word: πράσσοντας
  choice: ndị na-eme
  rationale: Ụdị okwu ugbu a na-egosi omume a na-eme ma ọ bụ nke e ji mmadụ mara; “ndị na-eme” na-enye nghọta ahụ n'ụzọ nkịtị n'Igbo.
theological_decisions:
- issue: Ma a ga-asụgharị κατὰ ἀλήθειαν n'ụzọ nkọwa dịka “n'ụzọ ziri ezi,” ka a ga-echekwa njikọ ya kpọmkwem na eziokwu.
  choice: dịka eziokwu si dị
  alternative: n'ụzọ ziri ezi
  rationale: Nhọrọ a na-echekwa okwu Pọl banyere eziokwu dị ka ụkpụrụ ikpe Chineke, n'emeghị ka nghọta ahụ bụrụ naanị na ikpe ahụ ziri ezi.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù. A họọrọ usoro ngwaa “ikpe mmadụ ikpe” ka ahịrịokwu ahụ bụrụ nke ndị na-agụ akwụkwọ taa ga-aghọta ngwa ngwa, ebe nkọwa ala peeji na-echekwa ụdị okwu κατὰ ἀλήθειαν n'ụzọ doro anya.
