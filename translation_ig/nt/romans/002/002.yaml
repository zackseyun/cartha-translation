    text: Ma ọ bụ, “n'ụzọ kwekọrọ n'eziokwu”; ya bụ, ikpe Chineke kwekọrọ n'ihe bụ eziokwu.
    reason: lexical_alternative
  revision_rationale: The revision gives οἴδαμεν its ordinary present sense, explicitly carries the mild connective force of δέ with “Ma,” retains κρίμα as “ikpe Chineke,” and places the rendering of κατὰ ἀλήθειαν with the judgment rather than with the offenders’ conduct. “Megide” naturally renders the adverse judicial direction of ἐπί in this sentence.
