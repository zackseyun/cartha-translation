  verdict: approve
  source_fidelity: “onye ga-akwụghachi” faithfully represents the relative clause ὃς ἀποδώσει and retains its future judicial-recompense force. “onye ọ bụla” preserves the distributive ἑκάστῳ, while “dịka ọrụ ya si dị” accurately conveys κατὰ τὰ ἔργα αὐτοῦ. Although ọrụ is morphologically unmarked for number here, it can naturally bear the collective sense “works/deeds” in Igbo.
  naturalness: The line is concise, idiomatic Standard Igbo, and appropriately continues the relative clause from the preceding context. The construction “dịka … si dị” is natural and clearly expresses the standard by which recompense is given.
  terminology: “ga-akwụghachi” suitably preserves recompense without reducing the statement to a general treatment or reward. “ọrụ” is a suitable broad equivalent for ἔργα; the lexical-alternative note supplies “omume.” The gender-neutral Igbo pronoun ya appropriately represents the Greek representative masculine singular without imposing a male-only reference.
