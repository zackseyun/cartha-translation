  text: ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/006.yaml
  text: who will repay each one according to his works[a][b].
translation:
  language: ig
  text: onye ga-akwụghachi onye ọ bụla dịka ọrụ ya si dị[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “omume.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, nnọchiaha a dị n’otu ma na-ezo n’ụzọ nkesa n’ọrụ onye ọ bụla; “ya” n’Igbo nwere ike izo aka ma nwoke ma nwaanyị.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: onye
  rationale: Nnọchiaha njikọ a na-ezo aka n’ebe Chineke nọ n’okwu bu ụzọ; “onye” bụ ụzọ Igbo dị mfe ma zie ezi isi jikọta ahịrịokwu ahụ.
- source_word: ἀποδώσει
  choice: ga-akwụghachi
  rationale: Okwu a pụtara inyeghachi mmadụ ihe ruuru ya, ọkachasị n’ọnọdụ ikpe; “ga-akwụghachi” na-edobe echiche nkwụghachi ahụ n’asụsụ doro anya.
- source_word: ἑκάστῳ
  choice: onye ọ bụla
  rationale: 'Nke a na-edobe echiche nkesa ahụ: a ga-emeso mmadụ n’otu n’otu, ọ bụghị naanị mmadụ niile dịka otu ìgwè.'
- source_word: κατὰ
  choice: dịka … si dị
  rationale: Akụkụ okwu Igbo a na-egosi ụkpụrụ ma ọ bụ ihe e ji atụ nkwụghachi ahụ, kwekọrọ n’ọrụ κατὰ n’ebe a.
- source_word: τὰ ἔργα
  choice: ọrụ
  rationale: “Ọrụ” bụ ezigbo nhata nke ἔργα ma na-edobe okwu ahụ n’ụzọ sara mbara; “omume” bụkwa ntụgharị kwesịrị ekwesị n’ọnọdụ a.
- source_word: αὐτοῦ
  choice: ya
  rationale: “Ya” na-edobe nnọchiaha onye nke atọ dị n’otu, na-ezo n’ụzọ nkesa n’ebe “onye ọ bụla” nọ; n’Igbo, okwu a anaghị egosi nwoke ma ọ bụ nwaanyị.
theological_decisions:
- issue: Ikpe dịka ọrụ mmadụ si dị
  choice: E debere okwu nkwụghachi nke ikpe n’enweghị ime ka ọ dị nro ma ọ bụ ime ka o kwekọọ n’ụzọ nkọwa na ozizi Pọl ndị ọzọ banyere ịgụ mmadụ n’onye ezi omume.
  alternative: Ịsụgharị ya n’ụzọ sara mbara dịka “ga-emeso” ma ọ bụ “ga-enye ụgwọ ọrụ.”
  rationale: Amaokwu ahụ kwuru kpọmkwem na Chineke ga-akwụghachi onye ọ bụla dịka ọrụ ya si dị; ntụgharị kwesịrị idobe esemokwu nkà mmụta okpukpe ahụ kama idozi ya site na nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “dịka … si dị” bụ akpaalaokwu Igbo sitere n’okike ma na-edobe echiche nke ụkpụrụ e ji atụ ikpe.
