  terminology: uche ya is acceptable because God is the contextual referent, provided that the absence of an explicit possessive in Greek is noted. Iwu is appropriate for νόμος. The alternative literal reading of τὰ διαφέροντα is retained in a footnote rather than made the sole translation.
