  text: καὶ γινώσκεις τὸ θέλημα καὶ δοκιμάζεις τὰ διαφέροντα κατηχούμενος ἐκ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: ig
  text: ma ị maara uche ya[a], na-akwado ihe ndị ka mma[b], ebe a na-akụziri gị ihe site n’Iwu ahụ[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “uche ahụ.” N’asụsụ Grik, e nweghị “ya” n’ebe a, ọ bụ ezie na Chineke bụ onye a na-ekwu maka ya n’akụkụ a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-enyocha ihe ndị dị iche.” N’ụzọ nkịtị, okwu Grik ahụ nwere ike ịpụta “ihe ndị dị iche,” ma n’ọnọdụ a ọ nwekwara ike ịpụta ihe ndị ka mma ma ọ bụ ndị ka mkpa.
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “n’ihi na a na-akụziri gị ihe site n’Iwu ahụ.” Nkebi okwu Grik a bụ participle passive, nke pụrụ igosi ọnọdụ, ụzọ, ma ọ bụ ihe kpatara ya.
    reason: grammatical_alternative
lexical_decisions:
- source_word: γινώσκεις
  choice: ị maara
  rationale: Okwu a dị n’ụdị ugbu a ma na-egosi ịma ihe n’ezie; “ị maara” bụ ntụgharị Igbo kwụ ọtọ ma dịkwa mfe nghọta.
- source_word: τὸ θέλημα
  choice: uche ya
  rationale: Grik kwuru naanị “uche ahụ” n’enweghị nnọchiaha nke nwe, ma n’ọnọdụ okwu a, ọ bụ uche Chineke ka a na-ekwu; “uche ya” na-eme ka nke ahụ doo anya n’Igbo.
- source_word: δοκιμάζεις
  choice: na-enyochakwa
  rationale: Ọ na-egosi ile ihe anya nke ọma iji mata ma kwado ihe kwesịrị ekwesị; “na-enyocha” na-echekwa echiche nke ịnwale na ịtụle, n’agbanyeghị na ihe a na-atụ anya ya bụ mkpebi nkwado.
- source_word: τὰ διαφέροντα
  choice: ihe ndị dị iche
  rationale: 'Nke a na-esochi okwu Grik n’ụzọ doro anya ma na-echekwa mgbagwoju nghọta ya: ọ pụrụ ịpụta ihe ndị dị iche ma ọ bụ ihe ndị ka mma.'
- source_word: κατηχούμενος
  choice: ebe a na-akụziri gị ihe
  rationale: Nke a na-echekwa ụdị passive participle ahụ ma na-egosi ọnọdụ ma ọ bụ ụzọ onye ahụ si nweta ihe ọmụma ahụ, n’enweghị ịmanye naanị nghọta nke ihe kpatara ya.
- source_word: ἐκ τοῦ νόμου
  choice: site n’iwu ahụ
  rationale: “Site n’” na-egosi isi mmalite nke nkuzi ahụ; “iwu ahụ” na-ezo aka n’Iwu Chineke a maara n’ọnọdụ a.
theological_decisions:
- issue: Onye nwe τὸ θέλημα
  choice: uche ya
  alternative: uche ahụ
  rationale: Ọ bụ ezie na Grik etinyeghị “ya,” okwu ndị gbara ya gburugburu na-egosi Chineke dị ka onye a na-ekwu maka uche ya. E tinyere nkọwa ala peeji iji mee ka ọdịdị Grik pụta ìhè.
- issue: Mpụtara τὰ διαφέροντα
  choice: ihe ndị dị iche
  alternative: ihe ndị kachasị mma
  rationale: A họọrọ ntụgharị nke na-echekwa mgbagwoju okwu Grik kama idozi ya ozugbo dị ka naanị ihe kachasị mma; nkọwa ala peeji na-enye nghọta ọzọ nwere ike ịdị.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A hapụrụ njikọ ahịrịokwu ahụ ka ọ gaa n’ihu n’ihi na amaokwu a bụ akụkụ nke ahịrịokwu malitere n’amaokwu bu ya ụzọ. E jiri “iwu ahụ” mee ihe maka νόμος n’ọnọdụ a, n’enweghị itinye nkọwa ụka pụrụ iche.
