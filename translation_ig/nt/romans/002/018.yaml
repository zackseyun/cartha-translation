    issue: na-enyochakwa ihe ndị dị iche under-translates the contextual force of δοκιμάζεις τὰ διαφέροντα.
    rationale: δοκιμάζεις can literally involve testing, but here it denotes discerning and approving what is excellent/superior. ‘Examining things that differ’ is possible as a literal rendering but is not the best unqualified Igbo sense in this context.
