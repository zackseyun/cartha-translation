  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: ig
  text: Kama, onye Juu bụ onye Juu n’ime; ibi úgwù bụ nke obi—n’ime mmụọ[a], ọ bụghị n’ihe e dere ede. Otuto ya adịghị esite n’aka mmadụ, kama ọ na-esite n’aka Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “site na Mmụọ.” Okwu Grik ahụ nwekwara ike ịpụta mmụọ mmadụ ma ọ bụ ezi ọnọdụ ime mmụọ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: n’ime obi
  rationale: Nke a na-egosi ihe dị n’ime mmadụ, nke zoro ezo n’anya mmadụ, ma na-emegide ihe a na-ahụ anya n’amaokwu bu ya ụzọ. Ọ bụkwa okwu Igbo nkịtị ma doo anya.
- source_word: Ἰουδαῖος
  choice: onye Juu
  rationale: N’arụmụka a, okwu ahụ gbasara njirimara okpukpe na ọgbụgba ndụ, ọ bụghị naanị onye si Judia.
- source_word: περιτομὴ καρδίας
  choice: ibi úgwù n’ezie bụkwa nke obi
  rationale: Nke a na-echekwa ihe atụ banyere ibi úgwù ma gosi na ebe ọ na-eme bụ n’obi. Etinyere “n’ezie” ka njikọ ya na ezigbo onye Juu dị n’ime doo anya n’Igbo.
- source_word: ἐν πνεύματι
  choice: site na Mmụọ
  rationale: N’ụzọ Pọl si emegide Mmụọ na ihe e dere ede, Mmụọ Nsọ yiri ka ọ bụ ihe ọ na-ekwu; “site na” na-egosi ụzọ ma ọ bụ onye na-arụ ọrụ ahụ. E debere nghọta ọzọ na nkọwa ala peeji.
- source_word: οὐ γράμματι
  choice: ọ bụghị site n’ihe e dere ede
  rationale: Nke a na-ewepụta γράμμα dị ka iwu e dere ede ma na-edobe ọdịiche ya na Mmụọ n’asụsụ Igbo doro anya.
- source_word: οὗ ὁ ἔπαινος
  choice: Otuto onye dị otú ahụ
  rationale: Nke a na-ejikọta otuto ahụ na onye bụ onye Juu n’ime, ma zere mgbagwoju anya nke nnọchiaha n’Igbo.
- source_word: ἐξ ἀνθρώπων
  choice: esite n’aka mmadụ
  rationale: “Mmadụ” ebe a bụ mkpokọta na-anọchi mmadụ niile, ọ bụghị naanị ụmụ nwoke.
- source_word: ἐκ τοῦ θεοῦ
  choice: na-esite n’aka Chineke
  rationale: Ọ bụ ntụgharị kpọmkwem ma bụrụkwa ụzọ Igbo si ekwu ebe nnabata ma ọ bụ otuto si bịa.
theological_decisions:
- issue: Ma πνεύματι ọ na-ekwu maka Mmụọ Nsọ ka ọ bụ mmụọ mmadụ ma ọ bụ ezi ọnọdụ ime mmụọ
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ ma ọ bụ ezi ọnọdụ ime mmụọ dị n’ime mmadụ
  rationale: Ọdịiche Pọl na-eme n’etiti πνεῦμα na γράμμα na-akwado nghọta nke ọrụ Mmụọ Nsọ, ma okwu Grik ahụ n’onwe ya anaghị ewepụ nghọta nke ime mmụọ kpamkpam; ya mere e debere ya na nkọwa ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ ibi úgwù na ọdịiche dị n’etiti ihe dị n’ime na ihe dị n’èzí; nkọwa ala peeji na-edobe mgbagwoju anya dị na πνεύματι.
