revisions:
- from: Kama, onye bụ onye Juu n’ezie bụ onye Juu n’ime obi[a]; ibi úgwù n’ezie bụkwa nke obi—site na Mmụọ, ọ bụghị site n’ihe e dere ede. Otuto onye dị otú ahụ adịghị esite n’aka mmadụ, kama ọ na-esite n’aka Chineke.
  to: Kama, onye Juu bụ onye Juu n’ime; ibi úgwù bụ nke obi—n’ime mmụọ[a], ọ bụghị n’ihe e dere ede. Otuto ya adịghị esite n’aka mmadụ, kama ọ na-esite n’aka Chineke.
  rationale: The revision removes unsupported emphasis, distinguishes the inward/hidden identity from the later reference to the heart, and preserves the ambiguity of ἐν πνεύματι rather than requiring a Holy-Spirit interpretation. It also relocates the alternative-reading footnote to the phrase it actually concerns.
  reviewer_model: gpt-5.6-terra
