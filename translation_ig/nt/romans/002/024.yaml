  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: ig
  text: N’ihi na ọ bụ n’ihi unu ka a na-ekwulu aha Chineke n’etiti ndị mba ọzọ,[a][b] dị nnọọ ka e dere ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “n’etiti mba dị iche iche.”'
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, Pọl na-ekwughachi echiche dị n’Akwụkwọ Nsọ, karịsịa Aịzaya 52:5, ya na isiokwu ndị a hụkwara n’Ezikiel 36:20–23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na okwu a bụ ihe na-akọwa ma na-akwado mba Pọl baara ha n’amaokwu ndị bu ya ụzọ.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: aha Chineke
  rationale: Nke a sụgharịrị okwu Grik ahụ kpọmkwem, ma hapụkwara ‘aha’ ka ọ buru echiche gbasara nsọpụrụ na aha ọma Chineke n’enweghị ịkọwafebiga ya ókè.
- source_word: δι’ ὑμᾶς
  choice: ọ bụ n’ihi unu ka
  rationale: διά tinyere accusative na-egosi ihe kpatara omume ahụ. Usoro a bụ Igbo dị ndụ ma na-eme ka ebubo Pọl doro anya.
- source_word: βλασφημεῖται
  choice: a na-ekwulu
  rationale: Ọ na-echekwa passive present nke Grik ma na-egosi okwu nkwulu megide Chineke, nke siri ike karịa nanị ikwu okwu ọjọọ.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: n’etiti ndị mba ọzọ
  rationale: N’ọnọdụ Pọl na-ekwu maka ndị Juu na ndị na-abụghị ndị Juu, okwu a na-ezo aka n’ụzọ kacha kwe omume n’ebe ndị mba ọzọ nọ; e tinyere ‘mba dị iche iche’ dịka nhọrọ ọzọ na nkọwa ala peeji.
- source_word: καθὼς γέγραπται
  choice: dị nnọọ ka e dere ya
  rationale: Nke a bụ ụzọ ebumpụta ụwa n’Igbo isi chekwaa usoro a na-eji ewebata ihe e dere n’Akwụkwọ Nsọ, tinyere ike nke καθώς.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. Usoro ‘ọ bụ n’ihi unu ka’ na-enye δι’ ὑμᾶς ike ebubo o nwere n’amaokwu a, ebe ‘a na-ekwulu’ na-echekwa olu nnara na ịdịgide nke ngwaa Grik.
