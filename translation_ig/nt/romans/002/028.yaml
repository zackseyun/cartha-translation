    text: A pụkwara ịsụgharị ya, “n’èzí” ma ọ bụ “n’ihe pụtara ìhè.”
    reason: lexical_alternative
  - marker: b
    text: “N’anụ ahụ” bụ ntụgharị nkịtị n’ebe a; ọ na-ezo aka n’ibi úgwù nke anụ ahụ.
    reason: lexical_alternative
  revision_rationale: 'The revision follows the Greek’s parallel, elliptical formulation more closely: an outwardly identifiable Jew is not thereby the Jew in view, and visible circumcision in the flesh is not thereby the circumcision in view. It removes the interpretively supplied ‘naanị’ while preserving the natural Igbo expression and the connection to the inward contrast in verse 29.'
