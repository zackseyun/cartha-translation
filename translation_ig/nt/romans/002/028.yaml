source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: ig
  text: N’ihi na onye Juu n’ihe a na-ahụ anya abụghị onye Juu[a]; ibi úgwù nke a na-ahụ anya n’anụ ahụ abụghịkwa ibi úgwù[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’èzí” ma ọ bụ “n’ihe pụtara ìhè.”
    reason: lexical_alternative
  - marker: b
    text: “N’anụ ahụ” bụ ntụgharị nkịtị n’ebe a; ọ na-ezo aka n’ibi úgwù nke anụ ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: onye Juu
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ịbụ onye Juu dịka njirimara nke ndị ọgbụgba ndụ, ọ bụghị nanị onye si Judia.
- source_word: ἐν τῷ φανερῷ
  choice: n’ihe a na-ahụ anya
  rationale: Nke a na-echekwa echiche nke ihe dị n’èzí, nke pụtara ìhè, ma na-akwadebe ọdịiche ya na ihe dị n’ime nke amaokwu na-esote.
- source_word: περιτομή
  choice: ibi úgwù
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka akara ọgbụgba ndụ ahụ nke a na-eme n’ahụ.
- source_word: ἐν σαρκί
  choice: n’anụ ahụ
  rationale: N’ebe a, σάρξ pụtara anụ ahụ n’ezie, ọ bụghị echiche ihe atụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-akọwa ma na-akwado ihe e kwuru tupu ya.
theological_decisions:
- issue: Ihe njirimara onye ọgbụgba ndụ pụtara n’okwu ‘onye Juu’ na ‘ibi úgwù’
  choice: E tinyere ‘naanị’ iji mee ka ọdịiche dị n’etiti ihe a na-ahụ anya na eziokwu dị n’ime doo anya, n’enweghị ikwu na njirimara onye Juu ma ọ bụ ibi úgwù enweghị isi.
  alternative: Ịsụgharị ya dịka ịgọnahụ njirimara ndị Juu kpamkpam, ma ọ bụ dịka iji ihe ime mmụọ dochie ya kpamkpam.
  rationale: Asụsụ Grik na amaokwu 29 na-eme ọdịiche n’etiti akụkụ dị n’èzí na nke dị n’ime; ọ naghị ekpochapụ njirimara ahụ n’onwe ya. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe ahụ ka ọ dị.
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ ‘n’ihe a na-ahụ anya’ karịa okwu a sụgharịrị n’ụzọ siri ike dịka ‘n’èzí,’ ka ọdịiche dị n’etiti ihe anya hụrụ na ihe dị n’ime pụta nke ọma. E tinyere akara nkọwa ụkwụ niile n’ederede isi.
