  to: N’ihi na ọ bụghị ndị na-anụ iwu bụ ndị ezi omume n’ihu Chineke, kama ọ bụ ndị na-eme ihe iwu kwuru ka a ga-agụ ha dịka ndị ezi omume.[a]
  rationale: The revision makes the future passive clause grammatically complete by adding “ha.” It retains the source’s ambiguity concerning the implicit agent and preserves the legal/declarative force of δικαιωθήσονται. The footnote is adjusted correspondingly so that each alternative also has its required object.
