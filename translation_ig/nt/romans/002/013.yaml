source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: ig
  text: N’ihi na ọ bụghị ndị na-anụ iwu bụ ndị ezi omume n’ihu Chineke, kama ọ bụ ndị na-eme ihe iwu kwuru ka a ga-agụ ha dịka ndị ezi omume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka a ga-akpọ ha ndị ezi omume”; ma ọ bụ, “ka a ga-egosi na ha bụ ndị ezi omume.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: ndị na-anụ
  rationale: Nke a na-egosipụta ndị na-anụ iwu ma na-echekwa ọdịiche doro anya dị n’etiti ịnụ na ime.
- source_word: νόμου
  choice: iwu
  rationale: N’agbanyeghị na mkpụrụokwu Grik enweghị article, ‘iwu’ bụ ntụgharị Igbo eke nke na-ezo aka n’iwu ahụ Pọl na-ekwu maka ya n’ebe a.
- source_word: δίκαιοι
  choice: ndị ezi omume
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị akọwa ọnọdụ ziri ezi n’ihu Chineke.
- source_word: παρὰ τῷ θεῷ
  choice: n’ihu Chineke
  rationale: Ọ na-egosi ọnọdụ mmadụ n’ule ma ọ bụ n’ikpe Chineke n’asụsụ Igbo dị nkenke ma dị eke.
- source_word: ποιηταὶ
  choice: ndị na-eme ihe iwu kwuru
  rationale: Nke a na-enye ihe substantival ahụ n’Igbo eke ma na-echekwa ọdịiche ya na ‘ndị na-anụ.’
- source_word: δικαιωθήσονται
  choice: a ga-agụ dị ka ndị ezi omume
  rationale: Nke a na-echekwa passive na echiche ikpe nke δικαιόω, ma zere ime ka ọ pụta nanị na ha ghọrọ ndị omume ọma.
theological_decisions:
- issue: Otu e si tụgharị δικαιωθήσονται n’enweghị imechi nghọta Pọl n’otu nkọwa naanị
  choice: a ga-agụ dị ka ndị ezi omume
  alternative: a ga-akpọ ndị ezi omume; a ga-egosi na ha bụ ndị ezi omume
  rationale: ‘A ga-agụ dị ka ndị ezi omume’ na-egosipụta mkpebi ma ọ bụ nkwenye nke ikpe, ma na-ahapụkwa esemokwu nkà mmụta okpukpe banyere kpọmkwem otú e si ghọta δικαιόω n’ebe a. E tinyere ụzọ ndị ọzọ n’okpuru amaokwu.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘ndị na-anụ’ na ‘ndị na-eme’ chekwaa ntụnyere Pọl, ebe nkebi ‘ihe iwu kwuru’ na-eme ka okwu ahụ bụrụ Igbo eke.
