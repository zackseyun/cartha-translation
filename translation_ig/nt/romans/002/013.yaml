review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the Greek contrast between hearers and doers of the law, the present standing “before God,” and the future passive of δικαιωθήσονται. However, “ka a ga-agụ dị ka ndị ezi omume” lacks the object required by the Igbo construction and is therefore incomplete. Adding “ha” supplies the intended passive sense without making God an explicit grammatical agent, as the Greek does not do so.
  naturalness: Most of the verse is natural Standard Igbo. “Ndị na-eme ihe iwu kwuru” idiomatically communicates doing what the law requires and maintains the hearer/doer contrast. “A ga-agụ ha dịka ndị ezi omume” is a complete, clear modern Igbo judicial/evaluative expression.
  terminology: “Ndị ezi omume,” “n’ihu Chineke,” and “iwu” are appropriate and consistent renderings. The revised wording for δικαιωθήσονται preserves a declarative/reckoning sense rather than reducing it to moral improvement. The alternatives in the note remain suitably non-dogmatic.
  issues:
  - severity: medium
    issue: The main clause omits the object of “a ga-agụ.”
    rationale: In “ka a ga-agụ dị ka ndị ezi omume,” it is not grammatically clear who is to be reckoned as righteous. The source’s subject, “the doers of the law,” must be resumed with “ha.”
  revised_text: N’ihi na ọ bụghị ndị na-anụ iwu bụ ndị ezi omume n’ihu Chineke, kama ọ bụ ndị na-eme ihe iwu kwuru ka a ga-agụ ha dịka ndị ezi omume.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka a ga-akpọ ha ndị ezi omume”; ma ọ bụ, “ka a ga-egosi na ha bụ ndị ezi omume.”
    reason: lexical_alternative
  revision_rationale: The revision makes the future passive clause grammatically complete by adding “ha.” It retains the source’s ambiguity concerning the implicit agent and preserves the legal/declarative force of δικαιωθήσονται. The footnote is adjusted correspondingly so that each alternative also has its required object.
