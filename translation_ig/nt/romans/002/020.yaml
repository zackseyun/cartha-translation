  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: ig
  text: onye na-azụ ndị nzuzu, onye nkuzi ụmụ ọhụrụ, onye nwere ụdị nke ihe ọmụma na eziokwu n’Iwu ahụ[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “ngosipụta nke ihe ọmụma na eziokwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδευτὴν
  choice: onye na-azụ
  rationale: Okwu a pụtara onye na-enye ọzụzụ na ntụziaka; “onye na-azụ” na-egosipụta ọrụ nkuzi ahụ n’enweghị ime ka ntaramahụhụ bụrụ isi ihe.
- source_word: ἀφρόνων
  choice: ndị nzuzu
  rationale: Nke a na-echekwa echiche nke ndị na-enweghị amamihe nakwa ụda nlelị dị n’otú onye ahụ si akọwa onwe ya.
- source_word: διδάσκαλον
  choice: onye nkuzi
  rationale: Nke a bụ ntụgharị doro anya na nke a na-ejikarị eme ihe maka onye na-akụzi.
- source_word: νηπίων
  choice: ụmụ ọhụrụ
  rationale: Nke a na-echekwa ihe atụ nkịtị nke ụmụaka ka dị nnọọ nta na ịdị nkọ nke okwu ahụ; n’ọnọdụ a, ọ pụkwara izo aka n’ebe ndị na-etozughị etozu nọ.
- source_word: ἔχοντα
  choice: onye nwere
  rationale: Nke a na-echekwa echiche participle ahụ ma jikọta ya na nkọwa ndị bu ya ụzọ n’ụzọ Igbo na-ada nke ọma.
- source_word: μόρφωσιν
  choice: ọdịdị
  rationale: μόρφωσις nwere ike ịpụta ọdịdị, nhazi, ma ọ bụ ngosipụta zuru oke. “Ọdịdị” na-echekwa obosara na ntakịrị mgbagwoju anya nke okwu Grik ahụ kama ikpebi na ọ bụ naanị “ihe na-anọchi anya ya n’uju.”
- source_word: γνώσεως
  choice: ihe ọmụma
  rationale: Nke a bụ okwu Igbo nkịtị na nke kwesịrị ekwesị maka γνῶσις, ma na-aga nke ọma ya na “eziokwu.”
- source_word: ἀληθείας
  choice: eziokwu
  rationale: Nke a na-enye echiche ἀλήθεια n’ụzọ doro anya ma na-echekwa njikọ ya na ihe ọmụma.
- source_word: ἐν τῷ νόμῳ
  choice: n'ime Iwu ahụ
  rationale: Nke a na-echekwa ike preposition ἐν ma mee ka o doo anya na ọ bụ Iwu ndị Juu a na-ekwu maka ya, n’enweghị itinye nkọwa ụka pụrụ iche.
theological_decisions:
- issue: Ihe μόρφωσις pụtara n’ihe metụtara Iwu ahụ
  choice: ọdịdị nke ihe ọmụma na eziokwu
  alternative: ngosipụta zuru oke nke ihe ọmụma na eziokwu
  rationale: “Ọdịdị” na-ahapụ ohere dị n’okwu Grik ahụ—ọ nwere ike ịbụ ụdị, nhazi, ma ọ bụ ngosipụta—kama idozi esemokwu ahụ n’ụzọ siri ike.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere ahịrịokwu ahụ dịka akụkụ ndepụta na-aga n’ihu site n’ama ogologo dị na ngwụcha. Akara ndetu [a] dị n’isiokwu ahụ ma na-akọwa nhọrọ ọzọ maka μόρφωσις.
