  rationale: The revision preserves the source’s rhetorical sequence, its participial connection, and the ambiguity of μόρφωσις. It improves idiomatic Igbo word order, uses “ụdị” for the source term’s form/formulation sense, and places the footnote anchor directly on that lexical choice.
