id: ROM.2.3
reference: Romans 2:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: ig
  text: Ma gị, mmadụ[a], onye na-ekpe ndị na-eme ụdị ihe ndị a ikpe ma gị onwe gị na-eme ha, ì chere na ị ga-agbanahụ ikpe Chineke?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ bụ okwu akpọ oku n’ọnụọgụ otu; ọ na-agwa mmadụ okwu n’ụzọ nnọchiteanya.
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: ì chere
  rationale: Ọ pụtara ịtụle ma ọ bụ iche ihe n’uche. N’ajụjụ nkwagide a, “ì chere” bụ okwu Igbo doro anya ma na-ekpughe echiche onye ahụ Pọl na-enyocha.
- source_word: ἄνθρωπε
  choice: gị mmadụ
  rationale: Ọ bụ okwu a kpọrọ otu onye nke na-anọchi anya mmadụ n’ozuzu. “Gị mmadụ” na-edobe okwu a a kpọrọ onye ahụ ihu ma ghara ime ka ọ bụrụ naanị nwoke.
- source_word: κρίνων
  choice: na-ekpe ... ikpe
  rationale: Nke a bụ ụzọ Igbo kacha doo anya isi kwuo na onye ahụ na-atụle omume ndị ọzọ ma na-ekpe ha ikpe; ọ naghị eme ka okwu ahụ sie ike ruo n’ịma ha ikpe ọnwụ.
- source_word: πράσσοντας
  choice: ndị na-eme ụdị ihe ndị a
  rationale: Ọ na-egosi omume ndị ahụ na-aga n’ihu ma ọ bụ nke a na-eme dịka omume mmadụ. Igbo anaghị achọ ka e jiri okwu pụrụ iche kewaa ya n’ike n’ebe ποιῶν nọ.
- source_word: ποιῶν αὐτά
  choice: na-emekwa ha n’onwe gị
  rationale: “Na-emekwa” na-egosi na onye na-ekpe ndị ọzọ ikpe na-eme otu ihe ahụ; “n’onwe gị” na-eme ka ebubo ahụ doo anya n’Igbo ma dabaa n’ike nke onye-nnochiaha σύ na-esote.
- source_word: ἐκφεύξῃ
  choice: ị ga-agbanahụ
  rationale: “Ị ga-agbanahụ” na-egosi izere ikpe na-abịa, ma na-edobe ọdịdị ajụjụ nkwagide nke Grik.
- source_word: κρίμα
  choice: ikpe
  rationale: N’ebe a ọ na-ezo aka n’ikpe Chineke n’ozuzu, ọ bụghị naanị n’okwu ikpe ma ọ bụ ntaramahụhụ e kwupụtara.
theological_decisions:
- issue: Ma ajụjụ ahụ ọ na-ekwu na mgbapụ agaghị ekwe omume ma ọ bụ naanị na-ajụ echiche onye ahụ
  choice: 'E debere ya dịka ajụjụ nkwagide: “ì chere na ị ga-agbanahụ...?”'
  alternative: “N’ezie, ị gaghị agbanahụ ikpe Chineke.”
  rationale: Ụdị Grik bụ ajụjụ nke na-atụ anya azịza mba, ma ọ naghị ekwu azịza ahụ kpọmkwem. Nsụgharị ahụ na-edobe ike na nghọta ahụ n’enweghị ịgbanwe ya ka ọ bụrụ nkwupụta.
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, nke dị ùgwù ma dị mfe nghọta. Nkebi okwu dị n’etiti akara ogologo na-edobe ụdị okwu Pọl ji kpọọ onye ahụ ihu ma kọwaa ya, ebe ajụjụ ikpeazụ na-anọgide bụrụ ajụjụ nkwagide.
