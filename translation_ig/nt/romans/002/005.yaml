id: ROM.2.5
reference: Romans 2:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: ig
  text: Ma n’ihi isi ike gị na obi gị nke na-adịghị echegharị, ị na-akwakọbara onwe gị iwe n’ụbọchị iwe na mkpughe nke ikpe ziri ezi nke Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ikpe Chineke nke ziri ezi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Ma n’ihi
  rationale: “Ma” na-eburu δέ dịka njikọ na-egosi mgbanwe dị nro, ebe “n’ihi” na-egosipụta ike ihe kpatara ya nke κατά nwere n’ebe a.
- source_word: σκληρότητά σου
  choice: isi ike gị
  rationale: Nke a na-echekwa ihe atụ nke obi ma ọ bụ omume siri ike, ọ bụkwa okwu Igbo nkịtị maka isi ekweghị ekwe.
- source_word: ἀμετανόητον καρδίαν
  choice: obi gị nke na-adịghị echegharị
  rationale: Ọ na-edebe okwu “obi” nke Grik ma jiri asụsụ doro anya nke na-egosi enweghị nchegharị.
- source_word: θησαυρίζεις σεαυτῷ
  choice: ị na-akwakọbara onwe gị
  rationale: “Na-akwakọbara” na-egosi ihe a na-anọgide na-achịkọta, ebe “onwe gị” na-edobe nsonaazụ nke reflexive dative.
- source_word: ὀργή
  choice: iwe
  rationale: “Iwe” bụ okwu Igbo doro anya ma dị arọ nke na-arụ ọrụ nke ọma n’ọnọdụ ikpe Chineke.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: n’ụbọchị iwe na mkpughe
  rationale: “N’ụbọchị” na-enye ἐν uru oge ya n’ụzọ Igbo kwesịrị ekwesị, ma a hapụrụ aha abụọ ahụ dịka aha jikọrọ ọnụ kama ịgbanwe nke abụọ ka ọ bụrụ ahịrịokwu nwere ngwaa.
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: ikpe ziri ezi nke Chineke
  rationale: Nke a na-egosipụta ma ịdị mma na izi ezi nke ikpe ahụ, ma na-edobe Chineke dịka onye nwe ma na-eme ikpe ahụ.
theological_decisions:
- issue: Ma a ga-agbanwe mkpụrụokwu aha “ụbọchị iwe na mkpughe” ka ọ bụrụ ahịrịokwu nkọwa dịka “ụbọchị iwe mgbe a ga-ekpughe ikpe Chineke.”
  choice: 'E debere usoro aha: “n’ụbọchị iwe na mkpughe nke ikpe ziri ezi nke Chineke.”'
  alternative: “n’ụbọchị iwe mgbe a ga-ekpughe ikpe ziri ezi nke Chineke.”
  rationale: Nhọrọ nke nwere “mgbe a ga-ekpughe” na-eme ka ihe a na-ekwu doo anya, ma ọ na-etinye ngwaa nke adịghị na Grik. Idebe usoro aha na-echekwa nhazi na ntakịrị mgbagwoju anya nke isi mmalite ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “isi ike” na “obi ... na-adịghị echegharị” debe ihe atụ Akwụkwọ Nsọ, ebe “ị na-akwakọbara onwe gị” na-egosi omume na-aga n’ihu na nsonaazụ ya.
