  source_fidelity: Isi okwu ahụ na-echekwa nke ọma echiche hypotetịkal nke ηὐχόμην site na “m gaara achọ,” nkwusi ike dị na αὐτὸς ἐγώ, ọbụbụ ọnụ na nkewapụ n’ebe Mesaịa nọ, na njikọ agbụrụ dị na κατὰ σάρκα. Otú ọ dị, ụzọ mbụ e nyere na nkọwa [a], “onye Mesaịa bụrụ ọnụ,” adịghị asụ Igbo nke ọma ma nwee ike ịpụta na Mesaịa bụ onye na-abụ ọnụ; ya mere ọ naghị anọchi anya ambiguity Grik ahụ n’enweghị mgbagwoju anya.
