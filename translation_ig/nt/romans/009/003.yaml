id: ROM.9.3
reference: Romans 9:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: ig
  text: N’ihi na m gaara achọ ka mụ onwe m bụrụ onye a bụrụ ọnụ ma bụrụkwa onye e kewapụrụ n’ebe Mesaịa ahụ nọ[a], n’ihi ọdịmma ụmụnne m[b], ndị ikwu m n’anụ ahụ[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘onye a bụrụ ọnụ site n’ebe Mesaịa nọ,’ ma ọ bụ ‘onye nọ n’okpuru ọbụbụ ọnụ, nke e kewapụrụ n’ebe Mesaịa nọ.’ Okwu Grik ahụ jikọtara echiche nke ịnọ n’okpuru ọbụbụ ọnụ na nke nkewapụ n’ebe Mesaịa nọ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ‘ụmụnne m.’ N’ebe a, Pọl na-ekwu banyere ndị Izrel ibe ya, ya bụ, ndị otu agbụrụ ya.
    reason: cultural_note
  - marker: c
    text: ‘N’anụ ahụ’ n’ebe a pụtara site n’ọmụmụ anụ ahụ ma ọ bụ n’usoro agbụrụ; ọ pụtaghị ‘ọdịdị mmehie.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: m gaara achọ
  rationale: Ụdị a na-egosi ọchịchọ siri ike nke a na-ekwu n’ọnọdụ a na-apụghị imezu n’ụzọ dị mfe; ọ naghị eme ka okwu ahụ bụrụ ekpere Pọl kpesiri ike n’ezie.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nkọwa Pọl nyere n’okwu bu ya ụzọ.
- source_word: ἀνάθεμα
  choice: onye a bụrụ ọnụ
  rationale: Nke a na-egosi ịbụ onye nọ n’okpuru ọbụbụ ọnụ siri ike, n’asụsụ Igbo doro ndị mmadụ anya.
- source_word: αὐτὸς ἐγώ
  choice: mụ onwe m
  rationale: Ọ na-echekwa nkwusi ike Pọl tinyere n’onwe ya.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: onye e kewapụrụ n’ebe Mesaịa ahụ nọ
  rationale: ἀπό na-egosi nkewapụ; okwu a na-eme ka echiche ahụ doo anya n’Igbo, ebe ‘Mesaịa’ na-echekwa Χριστός dịka utu aha.
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: N’ebe a ọ na-egosi na ọchịchọ ahụ bụ maka ọdịmma ndị Pọl na-ekwu banyere ha.
- source_word: τῶν ἀδελφῶν μου
  choice: ụmụnne m
  rationale: ‘Ụmụnne’ bụ okwu Igbo ebumpụta ụwa nke nwere ike ịgụnye ndị otu agbụrụ ma ọ bụ ndị otu obodo, dịka gburugburu okwu a si gosi.
- source_word: τῶν συγγενῶν μου
  choice: ndị ikwu m
  rationale: Ọ na-egosi njikọ agbụrụ na usoro ọmụmụ, ọ bụghị naanị ndị ezi-na-ụlọ ya kacha nso.
- source_word: κατὰ σάρκα
  choice: n’anụ ahụ
  rationale: A hapụrụ usoro okwu Pọl n’ụdị dị nkenke, ebe nkọwa ala peeji na-eme ka o doo anya na ọ bụ agbụrụ na ọmụmụ anụ ahụ ka ọ na-ekwu, ọ bụghị ọchịchọ mmehie.
theological_decisions:
- issue: Ma okwu Pọl ọ bụ ekpere o kpere n’ezie ka ọ bụ ọchịchọ a na-atụ anya n’ọnọdụ siri ike
  choice: E jiri ‘m gaara achọ’ gosi ọchịchọ nwere ọnọdụ ma ọ bụ nke a na-apụghị imezu.
  alternative: ‘m nọ na-achọ’ ma ọ bụ ‘m kpere ekpere’
  rationale: Nke a na-echekwa ike mmetụta Pọl n’ebughị ụzọ kpebie na ọ rịọrọ Chineke n’ezie ka e kewapụ ya n’ebe Mesaịa nọ.
- issue: Ma Χριστός bụ utu aha ka ọ bụ aha mmadụ n’ebe a
  choice: Mesaịa ahụ
  alternative: Kraịst
  rationale: N’ebe a, ‘Mesaịa’ na-eme ka ọrụ Χριστός dịka utu aha Onye E Tere Mmanụ pụta ìhè.
- issue: Ihe κατὰ σάρκα pụtara
  choice: Njikọ site n’ọmụmụ anụ ahụ na agbụrụ
  alternative: Ọdịdị mmehie
  rationale: Pọl na-akọwa ndị Izrel ibe ya dịka ndị otu agbụrụ ya; ọ naghị ekwu banyere ọdịdị mmehie n’ebe a.
- issue: Mmekọrịta dị n’etiti ἀνάθεμα na ἀπὸ τοῦ Χριστοῦ
  choice: Isi okwu na-egosi ọbụbụ ọnụ na nkewapụ n’ebe Mesaịa nọ dịka akụkụ abụọ jikọrọ ọnụ.
  alternative: ‘onye a bụrụ ọnụ site n’aka Mesaịa’ ma ọ bụ ‘onye nọ n’okpuru ọbụbụ ọnụ, nke e kewapụrụ n’ebe Mesaịa nọ’
  rationale: Usoro Grik dị nkenke ma nwee ike ibu ihe karịrị otu nkọwa. Isi okwu na-agụ nke ọma n’Igbo, ebe nkọwa [a] na-echekwa ụzọ ndị ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. A hapụrụ usoro okwu Pọl ‘n’anụ ahụ’ n’isi okwu iji chekwaa ụda na njikọ ya na okwu ndị ọzọ Pọl ji, ma tinye nkọwa ka ndị na-agụ ghara ịghọta ya dịka ọdịdị mmehie. Akara nkọwa [a], [b], na [c] dị n’akụkụ okwu ha na-akọwa.
