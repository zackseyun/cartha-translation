revisions:
- from: Ọ bụghịkwa na ha niile bụ ụmụ n’ihi na ha bụ ụmụ Abraham[a]. Kama[b], “Ọ bụ n’ime Aịzik ka a ga-akpọpụtara gị mkpụrụ[c].”
  to: Ọ bụghịkwa na n’ihi na ha bụ ndị sitere n’Abraham, ha niile bụ ụmụ[a]. Kama[c], “Ọ bụ site n’Aịzik ka a ga-akpọ mkpụrụ gị aha[b].”
  rationale: 'The revision follows the Greek argument’s order and preserves its deliberately limited contrast: physical descent from Abraham does not make all descendants ‘children.’ It renders the Genesis citation in idiomatic Standard Igbo without converting ‘called’ into the more interpretive ‘reckoned’ or imposing a theological explanation. Footnote anchors are retained and each note now corresponds to its anchored expression.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:26:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft captures the contrast between Abrahamic descent and being "children," but its first clause is less direct than the Greek and the quotation contains two avoidable inaccuracies: “n’ime Aịzik” is not idiomatic for lineal reference, and “a ga-akpọpụtara gị mkpụrụ” adds the sense of calling out/providing and obscures σοι as possessive.'
  naturalness: The proposed revision uses clear, modern Standard Igbo. “ndị sitere n’Abraham” naturally expresses Abraham’s collective offspring in the prose clause, while “mkpụrụ gị” retains the collective-singular, scriptural diction in the Genesis citation.
  terminology: “Ụmụ” appropriately renders τέκνα without restricting the referent to males. “Mkpụrụ” in the citation preserves the lexical and intertextual force of σπέρμα. “A ga-akpọ … aha” is the natural Igbo expression for the passive ‘will be called/named’; the context leaves its lineal-designation sense implicit rather than doctrinally paraphrased.
  issues:
  - severity: medium
    issue: The quoted clause uses “n’ime Aịzik” and “a ga-akpọpụtara gị mkpụrụ.”
    rationale: For Ἐν Ἰσαὰκ, Standard Igbo lineal idiom is “site n’Aịzik.” “Akpọpụtara” normally carries a sense such as call out or summon for someone, which is not expressed by κληθήσεται; “a ga-akpọ mkpụrụ gị aha” accurately renders ‘your offspring will be called/named.’
  - severity: medium
    issue: The opening syntax can imply that Abrahamic offspring are not children, rather than denying that all such offspring are children.
    rationale: “Ọ bụghịkwa na ha niile bụ ụmụ n’ihi na ha bụ ụmụ Abraham” is understandable but reverses the source’s clearer cause-to-predicate progression. “N’ihi na ha bụ ndị sitere n’Abraham, ọ pụtaghị na ha niile bụ ụmụ” preserves the logical force more plainly.
  - severity: low
    issue: Footnote b describes the conjunction as a Genesis cross-reference rather than documenting the quotation’s formal alternative.
    rationale: ἀλλ’ means ‘but/rather’; the Genesis quotation follows it but is not introduced by that conjunction. The revised anchors and notes distinguish the contrast marker from the quotation wording.
  revised_text: Ọ bụghịkwa na n’ihi na ha bụ ndị sitere n’Abraham, ha niile bụ ụmụ[a]. Kama[c], “Ọ bụ site n’Aịzik ka a ga-akpọ mkpụrụ gị aha[b].”
