source:
  edition: SBLGNT
  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: ig
  text: Ọ bụghịkwa na n’ihi na ha bụ ndị sitere n’Abraham, ha niile bụ ụmụ[a]. Kama[c], “Ọ bụ site n’Aịzik ka a ga-akpọ mkpụrụ gị aha[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mkpụrụ Abraham.” Okwu Grik ahụ dị n’otu mkpụrụokwu, ma n’ebe a ọ na-ekwu maka ụmụ ma ọ bụ ndị sitere n’ezinụlọ Abraham n’ozuzu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ọ bụ site n’Aịzik ka a ga-akpọ mkpụrụ gị.” Nke a na-edobe ụdị okwu Jenesis 21:12 n’ụzọ dị nso.
    reason: cross_reference
  - marker: c
    text: “Kama” nwekwara ike ịbụ “ma”; ọ na-egosi ntụgharị siri ike n’arụmụka ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: Ọ bụghịkwa na ... n’ihi na
  rationale: “Kwa” jikọtara nkwupụta a na arụmụka gara aga, ebe usoro “ọ bụghị na ... n’ihi na” na-egosipụta ngọnarị na ihe kpatara ya n’Igbo doro anya.
- source_word: σπέρμα Ἀβραάμ
  choice: ụmụ Abraham
  rationale: N’ebe a σπέρμα bụ aha otu nwere nghọta mkpokọta nke ụmụ ma ọ bụ ndị sitere n’ezinụlọ Abraham; “ụmụ Abraham” bụ okwu Igbo nkịtị ma dị ugwu.
- source_word: πάντες τέκνα
  choice: ha niile bụ ụmụ
  rationale: τέκνα pụtara ụmụ n’enweghị ịkpa ókè nwoke na nwanyị. E tinyere ngwaa “bụ” dịka ụtọasụsụ Igbo chọrọ.
- source_word: ἀλλ’
  choice: Kama
  rationale: Ọ na-egosi ntụgharị siri ike nke na-agbazi echiche bu ụzọ.
- source_word: Ἐν Ἰσαὰκ
  choice: n’ime Aịzik
  rationale: Nke a na-edobe ụdị okwu ἐν nke amaokwu e hotara, kama ịkọwa ya ozugbo dịka “site n’aka Aịzik.”
- source_word: κληθήσεταί σοι σπέρμα
  choice: ka a ga-akpọpụtara gị mkpụrụ
  rationale: “Akpọpụtara gị” na-edobe omume passive nke καλέω na dative σοι; “mkpụrụ” na-eme ka ụda Jenesis 21:12 na ihe atụ mkpokọta nke σπέρμα pụta ìhè.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịbụ ụmụ Abraham n’anụ ahụ na ịbụ ụmụ n’echiche nke nkwa
  choice: E mere ka amaokwu ahụ gosi na ịbụ onye sitere n’eriri Abraham apụtaghị n’onwe ya ịbụ otu n’ime ụmụ niile a na-ekwu maka ha.
  alternative: Ịkọwa “ụmụ” ozugbo dịka “ụmụ ọgbụgba ndụ” ma ọ bụ itinye ozizi zuru ezu banyere nhọpụta.
  rationale: Grik ahụ na-ekewa ọmụmụ anụ ahụ na ahịrị nke nkwa, ma ọ kọwaghị usoro ozizi ahụ n’uju n’amaokwu a.
- issue: Ike nke okwu e hotara na Jenesis
  choice: E debere “n’ime Aịzik” na “a ga-akpọpụtara” n’ụdị dị nso n’okwu Grik.
  alternative: “Ọ bụ site n’aka Aịzik ka a ga-agụ ndị ga-abụ ụmụ gị.”
  rationale: Nhọrọ ọzọ na-akọwa ihe Pọl bu n’obi nke ọma karịa, ma ọ nwere ike imechi nghọta “ịkpọ,” “ịkpọ aha,” ma ọ bụ “ịgụnye” nke καλέω nwere n’ebe a.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji “ụmụ Abraham” mee ka ahịrịokwu mbụ bụrụ nke mmadụ nkịtị ga-aghọta ngwa ngwa; e debere “mkpụrụ” n’okwu e hotara iji chekwaa ihe atụ na ụda Akwụkwọ Nsọ mbụ. Akara ndetu ala [a], [b], na [c] niile pụtara n’ederede.
