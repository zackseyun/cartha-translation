  yaml_path: translation/nt/romans/009/013.yaml
  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: ig
  text: 'Dị ka e dere ya: “Ahụrụ m Jekọb n’anya[b], ma kpọrọ m Ịsọ asị.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ajụrụ m Ịsọ,” ma ọ bụ, “ahụghị m Ịsọ n’anya otú m hụrụ Jekọb n’anya.” Ihe a hotara sitere na Malakaị 1:2–3; ụfọdụ na-aghọta “kpọrọ asị” n’ebe a dịka ịjụ ya n’ihe gbasara ọgbụgba ndụ, ma ọ bụ ịhọrọ onye nke ọzọ karịa ya, ọ bụghị dị ka ịkpọ asị sitere n’obi.
    reason: lexical_alternative
  - marker: b
    text: Ihe a hotara sitere na Malakaị 1:2–3.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: dị ka
  rationale: Ọ na-ewebata ihe e hotara n’Akwụkwọ Nsọ n’ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: γέγραπται
  choice: e dere ya
  rationale: Nke a na-egosipụta usoro e ji ewebata ihe e dere n’Akwụkwọ Nsọ; ọdịdị perfect nke Grik na-egosi na ihe ahụ ka dị n’akwụkwọ.
- source_word: Ἰακώβ
  choice: Jekọb
  rationale: Aha onye a sụgharịghị ya, kama e dere ya n’ụdị a na-amakarị n’Igbo.
- source_word: ἠγάπησα
  choice: Ahụrụ m ... n’anya
  rationale: Nke a bụ ụzọ Igbo si ekwu ‘I loved’ n’ụzọ eke, ma na-echekwa ike nke ngwaa Grik.
- source_word: δὲ
  choice: ma
  rationale: Ọ na-egosi ọdịiche doro anya n’etiti ihe e kwuru banyere Jekọb na Ịsọ.
- source_word: Ἠσαῦ
  choice: Ịsọ
  rationale: Ọ bụ ụdị aha ahụ a na-amakarị n’Igbo.
- source_word: ἐμίσησα
  choice: kpọọ ... asị
  rationale: Nke a na-echekwa isi ihe ngwaa μισέω pụtara, ‘ịkpọ asị,’ kama ime ka okwu ahụ dị nro site n’ịtụgharị nkọwa ụfọdụ n’ime isi ederede.
theological_decisions:
- issue: Ma a ga-eme ka ‘kpọọ asị’ dị nro n’ihi arụmụka banyere nhọpụta Chineke na ụzọ okwu Hibru si arụ ọrụ
  choice: E debere ‘kpọọ Ịsọ asị’ n’isi ederede.
  alternative: ‘ajụrụ m Ịsọ’ ma ọ bụ ‘ahụrụ m Ịsọ n’anya obere karịa’
  rationale: Ihe odide Grik ji ngwaa μισέω, nke isi ihe ọ pụtara bụ ‘ịkpọ asị.’ Ide okwu siri ike ahụ n’isi ederede na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ; ihe ndị ọzọ nwere ike ịpụta ka edobere n’ala peeji kama ịmanye otu nkọwa.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu nke na-ada nke ọma n’Igbo, ma chekwaa okwu siri ike nke isi mmalite na esemokwu nkà mmụta okpukpe ya. E tinyere akara ala peeji [b] ozugbo e kwuchara Jekọb dịka ntụaka ihe e hotara, ebe [a] sochiri okwu gbasara Ịsọ nke ọ na-akọwa.
