- from: 'dị ka e dere ya, sị: “Ahụrụ m Jekọb n’anya[b], ma kpọọ Ịsọ asị.[a]”'
  to: 'Dị ka e dere ya: “Ahụrụ m Jekọb n’anya[b], ma kpọrọ m Ịsọ asị.[a]”'
  rationale: The revision corrects the Igbo past-tense form for ‘hate,’ removes a redundant quotation introducer, and clarifies the footnote’s comparative and emotional-hostility language. It retains the direct main-text rendering of μισέω and preserves the original ambiguity in the note.
