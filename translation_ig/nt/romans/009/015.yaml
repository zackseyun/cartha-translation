  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: ig
  text: N’ihi na ọ na-agwa Mosis, sị, “Aga m emere ebere onye m na-emere ebere, m ga-enwekwa ọmịiko n’ahụ onye m na-enwe ọmịiko n’ahụ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu a bụ ihe e hotara n’Ọpụpụ 33:19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: Mosis
  rationale: Aha a gbasoro nsụgharị a na-ejikarị n’Igbo; dativ ahụ pụtara na ọ bụ Mosis ka a gwara okwu.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na arụmụka dị n’ihu ya dị ka nkọwa ma ọ bụ ihe kpatara ihe e kwuru.
- source_word: λέγει
  choice: ọ na-agwa ... sị
  rationale: Nke a na-edobe oge ugbu a nke usoro e ji akpọpụta okwu Akwụkwọ Nsọ, ma mee ka okwu ahụ bụrụ Igbo doro anya.
- source_word: Ἐλεήσω / ἐλεῶ
  choice: Aga m emere ... ebere / m na-emere ... ebere
  rationale: A họọrọ ‘imere ebere’ maka ἐλεέω, ma debe otu mgbọrọgwụ okwu ahụ na nkwughachi ya, yana ọdịiche dị n’etiti future na present.
- source_word: ὃν ἂν
  choice: onye
  rationale: N’usoro ahịrịokwu a, ‘onye’ na-enye echiche nke onye ọ bụla okwu ahụ metụtara n’enweghị ịgbakwunye ‘onye m họọrọ,’ nke na-adịghị na Grik.
- source_word: οἰκτιρήσω / οἰκτίρω
  choice: m ga-enwekwa ọmịiko n’ahụ / m na-enwe ọmịiko n’ahụ
  rationale: ‘Inwe ọmịiko n’ahụ’ bụ okwu Igbo sitere n’obi ma na-edobe ọdịiche dị n’etiti οἰκτίρω na ἐλεέω; a debekwara nkwughachi na ọdịiche oge ngwaa.
theological_decisions:
- issue: Onye na-ekwu okwu n’usoro e ji kpọpụta amaokwu ahụ
  choice: Jiri ‘ọ na-agwa Mosis’ mee ka onye na-ekwu okwu bụrụ onye dị ndụ, dịka Chineke na-ekwu na Ọpụpụ 33:19.
  alternative: ‘Akwụkwọ Nsọ na-agwa Mosis’ ma ọ bụ usoro na-eme ka ihe e dere bụrụ onye na-ekwu.
  rationale: λέγει enweghị subject e dere kpọmkwem, ma okwu a kpọpụtara bụ okwu Chineke gwara Mosis. Igbo ‘ọ’ anaghị agbakwunye aha ‘Chineke’ n’ebe Grik na-edeghị ya.
- issue: Nnwere onwe Chineke n’ime ebere na ọmịiko
  choice: 'Debe usoro okwu ahụ siri ike ma na-emegharị onwe ya: ‘onye m na-emere ebere’ na ‘onye m na-enwe ọmịiko n’ahụ.’'
  alternative: ‘onye m họọrọ imere ebere’ ma ọ bụ ‘onye ọ bụla masịrị m.’
  rationale: Nhọrọ ndị ọzọ ga-etinye echiche nke ‘ịhọrọ’ ma ọ bụ ‘ịmasị’ nke na-adịghị kpọmkwem na Grik, ma si otú ahụ kpebie esemokwu nkà mmụta okpukpe nke ederede ahụ n’onwe ya hapụrụ ka ọ kwụ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke isi mmalite n’agbanyeghị na ọ dị ntakịrị ike n’Igbo, n’ihi na nkwughachi ahụ bụ akụkụ dị mkpa nke ike na esemokwu dị n’okwu ahụ.
