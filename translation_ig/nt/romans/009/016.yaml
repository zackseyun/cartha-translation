  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: ig
  text: Ya mere[a], ọ dabereghị n’onye chọrọ ma ọ bụ n’onye na-agba ọsọ[b], kama ọ dabere na Chineke onye na-egosi ebere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya n’ụzọ na-eso usoro Grik nke ọma karịa: “N’ihi ya, ọ bụghị nke onye chọrọ, ọ bụghịkwa nke onye na-agba ọsọ, kama ọ bụ nke Chineke onye na-egosi ebere.” Ahịrịokwu Grik ahụ ekwughị ihe a na-ekwu banyere ya kpọmkwem; ihe gbara ya gburugburu, bụ́ nzube Chineke na ebere ya, na-enyere aka ịghọta ya.'
    reason: lexical_alternative
  - marker: b
    text: Okwu a bụ “na-agba ọsọ” n’ụzọ nkịtị, ma eleghị anya a na-eji ya atụnyere mbọ mmadụ na-agba ma ọ bụ ịgbasi mbọ ike.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ya mere
  rationale: Ngwakọta mkpụrụokwu abụọ a na-egosi nkwubi okwu Pọl siri ike. “Ya mere” na-enye echiche ahụ n’Igbo doro anya ma dịkwa nfe.
- source_word: οὐ ... οὐδὲ
  choice: ọ dabereghị ... ma ọ bụ
  rationale: Ebe Grik hapụrụ ihe a na-ekwu banyere ya n’ụzọ ezughị ezu, okwu a na-etinye ngwaa Igbo dị mkpa ma na-ejikọta ihe abụọ a jụrụ n’ụzọ sitere n’okike.
- source_word: τοῦ θέλοντος
  choice: onye chọrọ
  rationale: Nke a na-echekwa echiche θέλω banyere ọchịchọ ma ọ bụ mkpebi mmadụ n’enweghị itinye nkọwa okpukpe karịrị ihe ederede kwuru.
- source_word: τοῦ τρέχοντος
  choice: onye na-agba ọsọ
  rationale: τρέχω pụtara n’ụzọ nkịtị ‘ịgba ọsọ.’ Nsụgharị a na-echekwa ihe atụ Pọl ji mee ihe, ebe nkọwa ala peeji na-egosi na ọ pụrụ ịpụta mbọ mmadụ.
- source_word: ἀλλὰ
  choice: kama
  rationale: “Kama” na-egosi ngbanwe na-emegide ihe ndị bu ya ụzọ n’ụzọ siri ike ma bụrụkwa Igbo sitere n’okike.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: Chineke, onye na-emere ebere
  rationale: 'Nke a na-echekwa omume nọ n’ahịrị okwu Grik: ọ bụghị nanị ịkpọ Chineke onye ebere, kama igosi ya dị ka onye na-eme ebere.'
- source_word: implied predicate/expression
  choice: ọ dabereghị ... ọ dabere na
  rationale: Grik ekwughị aha ihe ma ọ bụ ngwaa na-achị ahịrịokwu ahụ. Usoro a na-eme ka Igbo doo anya, ma ọ naghị akpọ ihe ahụ kpọmkwem ‘nzọpụta’ ma ọ bụ ‘nhọpụta,’ nke ga-emechi nghọta okwu ahụ karịa ka Grik mere.
theological_decisions:
- issue: Ihe nnọchiaha “ọ” na oke ihe dabere na ya
  choice: E ji “ọ dabereghị” kwuo ya n’akpọghị ihe “ọ” na-anọchi anya ya kpọmkwem.
  alternative: Nzọpụta adabereghị n’ọchịchọ mmadụ ma ọ bụ ná mbọ ya; ma ọ bụ, nhọpụta Chineke adabereghị n’ọchịchọ mmadụ.
  rationale: Ahịrịokwu Grik ezughị ezu n’ụzọ a kpachapụrụ anya, ebe okwu gbara ya gburugburu metụtara nzube Chineke na ebere ya. Ịhapụ ihe “ọ” na-anọchi anya ya ka ọnọdụ okwu kọwaa ya na-echekwa esemokwu nkà mmụta okpukpe dị n’ederede ma zere ịkwado otu nkọwa ụka.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. E chekwara ihe atụ “ịgba ọsọ” na ahịrịokwu bụ isi, ma e zere ịkpọ ihe ahịrịokwu ahụ na-ekwu banyere ya ‘nzọpụta’ ma ọ bụ ‘nhọpụta,’ n’ihi na Grik n’onwe ya hapụrụ ya ka ọnọdụ okwu kọwaa ya.
