  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: ig
  text: Ọ bụghị naanị nke ahụ,[a] kama Rebeka tụkwara ime site n’aka otu nwoke, onye bụ Aịzik, nna anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’okwu nkịtị: “nwere ihe ndina site n’aka otu onye, Aịzik nna anyị.” Okwu Grik a banyere “ihe ndina” bụ akpaalaokwu nke na-ezo aka n’ịtụrụ ime site n’aka otu nwoke.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: Ọ bụghị naanị nke ahụ, kama ... kwa
  rationale: Nke a na-egosipụta usoro okwu Pọl ji agbakwụnye ihe akaebe ọzọ n’ụzọ Igbo dị mfe ma doo anya.
- source_word: Ῥεβέκκα
  choice: Ribeka
  rationale: Ọ bụ nsụgharị aha nwanyị ahụ n’ụdị a na-aghọta nke ọma n’Igbo.
- source_word: ἐξ ἑνός
  choice: site n’aka otu nwoke
  rationale: Ọ na-eme ka nwoke e zoro aka na ya pụta ìhè, ma na-echekwa isi okwu ahụ na ọ bụ otu nna ka ụmụ ahụ si n’aka ya.
- source_word: κοίτην ἔχουσα
  choice: tụkwara ime
  rationale: Ọ bụ ụzọ Igbo kwesịrị ekwesị ma dị ùgwù isi kọwaa akpaalaokwu Grik nke na-ezo aka n’ịtụrụ ime site na mmekọ nwoke na nwanyị.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: bụ Aịzik nna anyị
  rationale: Nke a na-eme ka o doo anya na otu nwoke ahụ bụ Aịzik, ma na-echekwa okwu nna nna/covenant nke Pọl ji kpọọ ya ‘nna anyị.’
theological_decisions:
- issue: Otú a ga-esi kọwaa akpaalaokwu banyere mmekọ nwoke na nwanyị na ịtụrụ ime n’arụmụka Pọl banyere nhọpụta
  choice: Kọwaa ya dị ka Ribeka ịtụrụ ime site n’aka otu nwoke, bụ Aịzik
  alternative: Ịsụgharị ya nso n’okwu nkịtị dị ka ‘o nwere ihe ndina site n’aka otu onye’
  rationale: Nsụgharị ahọpụtara na-enye echiche okwu Grik n’ụzọ doro anya ma dị ùgwù, na-enweghị ịgbakwunye na ọ tụụrụ ‘ụmụ’ ebe okwu ahụ apụtaghị kpọmkwem na amaokwu a. Ọ na-echekwa isi arụmụka ahụ na ụmụ ejima ahụ nwere otu nne na otu nna.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘tụrụ ime site n’aka’ zere okwu siri ike ma chekwaa echiche akpaalaokwu Grik. Akara ndetu [a] dị n’ederede isi.
