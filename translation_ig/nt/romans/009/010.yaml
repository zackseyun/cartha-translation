- from: Ọ bụghị naanị nke ahụ,[a] kama Ribeka tụkwara ime site n’aka otu nwoke, bụ Aịzik nna anyị.
  to: Ọ bụghị naanị nke ahụ,[a] kama Rebeka tụkwara ime site n’aka otu nwoke, onye bụ Aịzik, nna anyị.
