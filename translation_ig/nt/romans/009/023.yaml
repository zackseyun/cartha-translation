id: ROM.9.23
reference: Romans 9:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: ig
  text: nakwa ka o wee mee ka a mara ụba nke ebube ya n’ahụ ndị bụ arịa ebere, ndị o burula ụzọ kwadebe maka ebube,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα γνωρίσῃ
  choice: ka o wee mee ka a mara
  rationale: Na-egosipụta ebumnuche nke ἵνα na ụdị ime ka ihe pụta ìhè dị na γνωρίζω, n’Igbo nkịtị ma dị ùgwù.
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: ụba nke ebube ya
  rationale: “Ụba” na-eburu echiche nke πλοῦτος dị ka nnukwu akụ ma ọ bụ ịdị ukwuu, ebe a n’ihe gbasara ebube Chineke.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: n’ahụ ndị bú arịa ebere
  rationale: “N’ahụ” na-echekwa ike nke ἐπί karịa ịsụgharị ya dị ka naanị “maka”; “arịa ebere” na-echekwa ihe atụ nke σκεύη ἐλέους.
- source_word: ἃ προητοίμασεν
  choice: ndị o burula ụzọ kwadebe
  rationale: Na-echekwa echiche nke nkwadebe e mere tupu oge dị na προητοίμασεν; “ndị” kwekọrọ n’iji arịa atụ ndị mmadụ.
- source_word: εἰς δόξαν
  choice: maka ebube
  rationale: Na-egosipụta ntụziaka ma ọ bụ nzube nke εἰς n’enweghị ịkọwa karịa ihe Grik kwuru.
theological_decisions:
- issue: Onye bụ isiokwu nke “o ... kwadebe”
  choice: E debere nnọchiaha “o” dịka ihe odide Grik si dị n’usoro okwu gbara ya gburugburu.
  alternative: Ịkpọ aha “Chineke” kpọmkwem.
  rationale: Isiokwu ahụ sitere n’okwu gbara amaokwu a gburugburu, ma Grik n’onwe ya ekwughị aha ahụ n’amaokwu a; nnọchiaha na-ezere itinye ihe ọzọ n’ime ederede.
- issue: Njikọ nke ἵνα na ahịrịokwu gara aga
  choice: A malitere ya na “nakwa ka” ma hapụ ya dịka nkebiokwu na-aga n’ihu.
  alternative: Ime ya ahịrịokwu zuru ezu site n’itinye ngwaa ma ọ bụ isiokwu ndị ọzọ.
  rationale: Amaokwu a dabere n’usoro syntax nke amaokwu 22; idebe njikọ ahụ na-echekwa esemokwu na nhazi nke isi mmalite.
- issue: Ihe “arịa ebere” pụtara
  choice: E chekwara ihe atụ ahụ n’enweghị ịkọwa ndị ahụ dịka otu okpukpe ma ọ bụ usoro nkuzi pụrụ iche.
  alternative: Ịsụgharị ya dịka “ndị Chineke meere ebere.”
  rationale: Nsụgharị nkọwa ahụ ga-eme ka ihe atụ σκεύη ghara ịdị ma nwee ike idozi esemokwu nkà mmụta okpukpe karịa ihe ederede kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ahịrịokwu ahụ dịka nke na-aga n’ihu site n’amaokwu gara aga, tinyere ihe atụ “arịa ebere” na nghọta ebumnuche nke ἵνα.
