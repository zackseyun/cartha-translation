  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: ig
  text: N’ihi na Onyenweanyị ga-emezu okwu ya[a] n’elu ụwa[c], na-emecha ya ma na-eme ka ọ dị mkpụmkpụ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onyenweanyị ga-emezu okwu ahụ, ihe ahụ, ma ọ bụ ikpe ahụ n’elu ụwa.”
    reason: lexical_alternative
  - marker: b
    text: “Na-eme ka ọ dị mkpụmkpụ” pụkwara ịpụta “na-ebelata ya,” ma ọ bụ, n’echiche e si na ya apụta, “na-emezu ya ngwa ngwa.”
    reason: lexical_alternative
  - marker: c
    text: Ụfọdụ na-asụgharị ἐπὶ τῆς γῆς ka ọ bụrụ “n’ala ahụ,” n’ihi otú okwu Aịzaya si dị n’ọnọdụ mbụ ya; ma okwu Grik dị na Ndị Rom ebe a bụ “n’elu ụwa.”
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: okwu ya
  rationale: “Okwu” na-echekwa echiche nke ihe Onyenweanyị kwuru ma kwupụta nke ọ ga-emezu. E tinyere “ya” n’ụzọ Igbo si ekwu okwu nke ọma, dabere n’Onyenweanyị bụ onye na-eme ihe ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe ndabere ma ọ bụ nkọwa maka okwu bu ya ụzọ.
- source_word: συντελῶν
  choice: na-emecha ya
  rationale: Nke a na-egosi iweta ihe ahụ ruo ná mmezu ya, ma na-edobe njikọ ya na ngwaa bụ isi.
- source_word: καὶ συντέμνων
  choice: ma na-eme ka ọ dị mkpụmkpụ
  rationale: Nsụgharị a na-echekwa ihe oyiyi nke ime ka ihe dị mkpụmkpụ, n’etinyeghị nkọwa siri ike na ọ pụtara naanị ime ya ngwa ngwa.
- source_word: ποιήσει
  choice: ga-emezu
  rationale: Ya na “okwu ya,” “ga-emezu” na-egosi na Onyenweanyị ga-eme ihe o kwuru, ọ bụghị nanị ikwu ya.
- source_word: κύριος
  choice: Onyenweanyị
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe n’ụzọ dị ùgwù maka κύριος mgbe ọ na-ezo aka na Chineke.
- source_word: ἐπὶ τῆς γῆς
  choice: n’elu ụwa
  rationale: Nke a na-agbaso okwu Grik dị na Ndị Rom, nke pụtara “n’elu ụwa”; ọ naghị eme ka ọ bụrụ naanị otu ala.
theological_decisions:
- issue: Ụdị omume Chineke dị n’okwu Aịzaya a e hotara
  choice: Onyenweanyị ga-emezu okwu o kwuru n’ụwa, wetakwa ya ná njedebe ma mee ka ọ dị mkpụmkpụ.
  alternative: Onyenweanyị ga-emezu ikpe ya ngwa ngwa n’ala ahụ.
  rationale: Okwu Grik nwere ike ibu echiche ikpe na ime ihe ngwa ngwa, ma nsụgharị bụ isi anaghị etinye ozizi pụrụ iche ma ọ bụ kpebie n’ụzọ siri ike ihe ederede ahụ hapụrụ ka ọ nwee ọtụtụ nghọta.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma doo ndị nkịtị anya. Ahịrịokwu ahụ na-edobe usoro nkọwa nke γάρ na ike nke ngwaa abụọ ahụ, ma zere itinye ozizi otu ụka ma ọ bụ ime ka ihe nwere nghọta abụọ bụrụ naanị otu.
