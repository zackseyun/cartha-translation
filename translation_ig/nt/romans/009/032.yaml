  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: ig
  text: N’ihi gịnị? N’ihi na ha achụghị ya site n’okwukwe[a], kama dị ka a ga-asị na ọ bụ site n’ọrụ[b]. Ha sụrụ ngọngọ n’elu nkume na-eme ka mmadụ sụọ ngọngọ[c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ọ bụghị site n’ịtụkwasị obi” ma ọ bụ “ọ bụghị n’ndabere nke okwukwe.” Grik kwuru n’ụzọ nkịtị, “ọ bụghị site n’okwukwe.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “kama dị ka a ga-asị na ọ bụ site n’ọrụ.” Okwu Grik ahụ na-echekwa echiche ‘dị ka a ga-asị.’
    reason: lexical_alternative
  - marker: c
    text: Nke a na-ezo aka n’Aịzaya 8:14; tụleekwa Aịzaya 28:16 n’amaokwu na-esote.
    reason: cross_reference
  - marker: d
    text: A pụkwara ịsụ ya, “nkume na-eme ka mmadụ daa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: N’ihi gịnị?
  rationale: Ajụjụ dị nkenke a na-edobe ike ajụjụ Pọl ji ebute nkọwa ya.
- source_word: ὅτι
  choice: Ọ bụ n’ihi na
  rationale: Nke a na-egosi ihe kpatara ihe a jụrụ n’ụzọ Igbo doro anya ma dịkwa mma.
- source_word: οὐκ ἐκ πίστεως
  choice: ha emeghị ya site n’okwukwe
  rationale: E tinyere ‘ha emeghị ya’ ka ahịrịokwu ahụ bụrụ Igbo zuru oke, ebe ‘site n’okwukwe’ na-edobe echiche ἐκ nke isi mmalite ma ọ bụ ntọala.
- source_word: πίστεως
  choice: okwukwe
  rationale: ‘Okwukwe’ bụ okwu Igbo a na-ejikarị akọwa πίστις n’ebe a, ma ọ naghị amanye echiche ‘ikwesị ntụkwasị obi’ n’amaokwu ahụ.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: kama ha mere ya dị ka a ga-asị na ọ bụ site n’ọrụ
  rationale: ‘Dị ka a ga-asị’ na-echekwa ὡς, nke na-eme ka okwu ahụ ghara ịpụta nanị ‘site n’ọrụ’ n’enweghị mgbanwe ọ bụla.
- source_word: ἔργων
  choice: ọrụ
  rationale: ‘Ọrụ’ bụ okwu nkịtị ma kwekọọ n’ụzọ Pọl si atụnyere okwukwe na ọrụ n’akwụkwọ Ndị Rom.
- source_word: προσέκοψαν
  choice: Ha sụrụ ngọngọ n’elu
  rationale: Nke a na-echekwa ihe atụ nkịtị nke mmadụ ịsụ ngọngọ n’ihe mgbochi.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: nkume na-eme ka mmadụ sụọ ngọngọ
  rationale: Nsụgharị a doro ndị Igbo nke oge a anya ma na-echekwa njikọ okwu dị n’etiti προσέκοψαν na προσκόμματος.
theological_decisions:
- issue: Ihe πίστις pụtara n’ọdịiche dị n’etiti okwukwe na ọrụ
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’ebe a, Pọl na-atụnyere okwukwe na ọrụ dịka ntọala mmadụ si achụ ezi omume. ‘Okwukwe’ na-echekwa okwu nkà mmụta okpukpe ahụ n’enweghị ịkọwa ya karịa ihe amaokwu ahụ kwuru.
- issue: Uru ὡς bara n’okwu gbasara ọrụ
  choice: dị ka a ga-asị na ọ bụ site n’ọrụ
  alternative: kama site n’ọrụ
  rationale: A hapụghị ὡς, ka nsụgharị ahụ ghara ime ka okwu Pọl sie ike karịa Grik ma ọ bụ kpochapụ esemokwu dị n’ụzọ o si kwuo ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A zere okwu ụka pụrụ iche. E debere ihe atụ nke ịsụ ngọngọ, tinyekwa nkwughachi ya, n’ihi na ọ bụ akụkụ pụtara ìhè n’usoro okwu Grik.
