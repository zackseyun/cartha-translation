  to: 'N’ihi na Akwụkwọ Nsọ na-agwa Fero, sị, “Ọ bụ kpọmkwem maka nzube a ka m mere ka i bilie[a]: ka m wee gosi ike m n’ime gị, ka e wee kwusaa aha m[b] n’ụwa niile.”'
