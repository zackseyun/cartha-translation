id: ROM.9.17
reference: Romans 9:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: ig
  text: 'N’ihi na Akwụkwọ Nsọ na-agwa Fero, sị, “Ọ bụ kpọmkwem maka nzube a ka m mere ka i bilie[a]: ka m wee gosi ike m n’ime gị, ka e wee kwusaa aha m[b] n’ụwa niile.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ‘m mere ka i bilie’ dịka “m chebere gị” ma ọ bụ “m mere ka i guzoro.” Ngwaa Grik ahụ nwere echiche sara mbara n’ọnọdụ okwu ahụ e hotara n’Ọpụpụ.
    reason: lexical_alternative
  - marker: b
    text: “Aha m” pụtara otú e si mara Chineke—ebube na aha ọma ya e mere ka a mata—ọ bụghị naanị aha a na-akpọ ya.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ γραφή
  choice: Ihe e dere n’Akwụkwọ Nsọ
  rationale: Na-egosipụta otu ihe e dere nke a na-eme ka ọ dị ka onye na-ekwu okwu, ma bụrụkwa okwu Igbo doro anya ma dị nsọpụrụ.
- source_word: λέγει ... τῷ Φαραώ
  choice: na-agwa Fero, sị
  rationale: E debere oge ugbu a nke λέγει na ụzọ Igbo sitere n’okike, nke na-egosikwa na Akwụkwọ Nsọ ka na-ekwu okwu.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ejigide njikọ nkọwa amaokwu a na arụmụka dị n’ihu ya.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: Ọ bụ kpọmkwem maka nzube a
  rationale: Na-echekwa nkwusiri ike na nzube dị n’okwu Grik ahụ n’ụzọ Igbo doro anya.
- source_word: ἐξήγειρά σε
  choice: ka m mere ka i bilie
  rationale: Na-ahapụ obosara ihe ngwaa Grik pụtara—ime ka mmadụ bilie, guzoro, ma ọ bụ pụta n’ọnọdụ—n’enweghị ikwubi kpọmkwem otú Chineke si mee ya.
- source_word: ὅπως ἐνδείξωμαι
  choice: ka m wee gosi
  rationale: Na-egosipụta nzube na ime ka ike ahụ pụta ìhè n’ihu ọha.
- source_word: ἐν σοὶ
  choice: n’ime gị
  rationale: Na-edobe ἐν nso dịka ‘n’ime,’ kama ịgbanwe ya n’ụzọ nkọwa ka ọ bụrụ naanị ‘site n’aka gị.’
- source_word: τὴν δύναμίν μου
  choice: ike m
  rationale: Ọ bụ okwu Igbo nkịtị, doro anya, nke kwekọrọ na δύναμις.
- source_word: καὶ ὅπως διαγγελῇ
  choice: ka e wee kwusaa
  rationale: Usoro a na-egosipụta ihe a na-eme n’enweghị ịkpọ onye na-eme ya aha, ma na-echekwa echiche nke ịkpọsa ya n’ihu ọha.
- source_word: τὸ ὄνομά μου
  choice: aha m
  rationale: A sụgharịrị ya kpọmkwem, ebe ‘aha’ n’ebe a gụnyere otú e si mara Chineke na ebube ya.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: n’ụwa niile
  rationale: Na-egosipụta oke zuru ụwa ọnụ nke okwu ahụ karịa ịkpa ya n’otu ala naanị.
theological_decisions:
- issue: Ihe ἐξήγειρά σε pụtara n’ihe gbasara Fero na ọchịchị Chineke
  choice: mere ka i bilie
  alternative: chebere gị / mere ka i guzoro
  rationale: Nhọrọ a na-echekwa nkwupụta banyere ọrụ Chineke n’ime ka Fero pụta ma ọ bụ guzoro n’ọnọdụ a, ma ọ naghị ekpebi ma okwu ahụ na-ekwu naanị banyere ime ka ọ dịrị ndụ, iweta ya n’ọkwa ọchịchị, ma ọ bụ ihe ọzọ. Nke a na-echekwa esemokwu dị n’etiti ọchịchị Chineke na ibu ọrụ mmadụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E jiri ‘Ihe e dere n’Akwụkwọ Nsọ’ chekwaa ime ka Akwụkwọ Nsọ dị ka onye na-ekwu okwu. Ihe nrịbama nkọwa [a] na [b] dị n’ederede isi.
