base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: ig
  text: ọ bụghị site n’ọrụ, kama site n’Onye ahụ na-akpọ[a]—a gwara ya, sị, “Onye okenye ga-ejere onye nke nta ozi.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ọ bụghị n'ihi ọrụ, kama n'ihi Onye ahụ na-akpọ.”
    reason: lexical_alternative
  - marker: b
    text: Ihe a e hotara sitere na Jenesis 25:23.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụ ya, “Onye ka ukwuu ga-ejere onye ka nta ozi”; “okenye/nke nta” na-esote ọnọdụ akụkọ Jekọb na Isọ.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: ọ bụghị site n'ọrụ
  rationale: “Site n'ọrụ” na-echekwa nkọwa ἐκ nke na-egosi isi mmalite ma ọ bụ ihe e ji dabere, ma na-anọgidekwa n'ụdị okwu Pọl dị nkenke.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: kama site n'Onye ahụ na-akpọ
  rationale: Nkebi participle nwere article na-arụ ọrụ dị ka aha. “Onye ahụ na-akpọ” na-echekwa omume dị ugbu a nke participle ahụ ma na-ezo aka n'ụzọ nkwanye ùgwù nye Chineke n'enweghị itinye aha na-adịghị na Grik.
- source_word: ἐρρέθη αὐτῇ
  choice: a gwara ya, sị
  rationale: Nke a bụ ụzọ Igbo si ekwu passive citation formula n'ụzọ dị mma; ọ naghị etinye onye kwuru okwu ebe Grik na-ekwughị ya.
- source_word: ὅτι
  choice: sị, “…”
  rationale: ὅτι na-ewebata okwu e kwuru ozugbo; “sị” na akara nhota na-eme ka nke a doo anya n'Igbo.
- source_word: Ὁ μείζων
  choice: Nke okenye
  rationale: N'ihe gbasara Isọ na Jekọb, comparative a na-egosi onye bu ụzọ mụọ; “nke okenye” bụ okwu Igbo doro anya karịa “nke ka ukwuu.”
- source_word: δουλεύσει
  choice: ga-ejere … ozi
  rationale: N'ebe a δουλεύω na-egosi ịnọ n'okpuru na ije ozi. Okwu a anaghị amanye nkọwa siri ike nke ịbụ ohu karịa ihe ọnọdụ ahụ chọrọ.
- source_word: τῷ ἐλάσσονι
  choice: nke nta
  rationale: Ọ na-emegide “nke okenye” n'ihe gbasara ụmụnne abụọ; “nke nta” na-egosi onye e mesịrị mụọ n'Igbo nkịtị.
theological_decisions:
- issue: Ma a ga-agbasa ọdịiche dị n'etiti ọrụ na Onye na-akpọ ka ọ kọwaa ozizi nhọpụta na-enweghị ihe kpatara ya n'aka mmadụ
  choice: 'E debere okwu ahụ nkenke: “ọ bụghị site n''ọrụ, kama site n''Onye ahụ na-akpọ.”'
  alternative: “ọ bụghị n'ihi ọrụ, kama n'ihi Chineke onye na-akpọ.”
  rationale: Amaokwu ahụ na-emegide ọrụ mmadụ na ọkpụkpọ Chineke, ma ọ naghị akọwa n'onwe ya usoro ozizi niile metụtara nhọpụta. Nsụgharị ahụ anaghị etinye nkọwa otu ụka n'ime okwu Pọl.
- issue: Ma μείζων na ἐλάσσων pụtara ọkwa (“onye ka ukwuu/onye ka nta”) ka ha pụtara afọ ọmụmụ (“okenye/nwata”)
  choice: E jiri “nke okenye … nke nta” n'ahịrị isi.
  alternative: “onye ka ukwuu ga-ejere onye ka nta ozi.”
  rationale: Jenesis 25:23 na ọnọdụ Isọ na Jekọb na-akwado nghọta nke afọ ọmụmụ, ma footnote na-echekwa ohere okwu Grik nwere banyere ịdị ukwuu ma ọ bụ ịdị nta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrị ahụ malitere dị ka nkebi na-aga n'ihu n'arụmụka amaokwu ndị gbara ya gburugburu. “A gwara ya, sị” bụ citation formula nkịtị n'Igbo; “ga-ejere … ozi” na-echekwa echiche ido onwe n'okpuru n'enweghị ime ka okwu ahụ bụrụ kpọmkwem ịgba ohu.
