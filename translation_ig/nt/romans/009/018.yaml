  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: ig
  text: Ya mere, ọ na-emere onye ọ chọrọ ebere[a], ma ọ na-eme ka obi onye ọ chọrọ sie ike[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ọ na-enwe obi ebere n’ebe onye ọ chọrọ nọ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ọ na-eme ka onye ọ chọrọ bụrụ onye isi ike.” Ngwaa Grik ahụ nọ n’olu ọrụ, ya mere a gaghị eme ka ọ pụta nanị na ọ na-ekwe ka onye ahụ sie ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ya mere
  rationale: Nkebi okwu a na-egosi nkwubi okwu Pọl si n’ihe o kwuru tupu ya pụta. “Ya mere” bụ ụzọ Igbo nkịtị ma dịkwa ùgwù si egosipụta nke ahụ.
- source_word: ὃν θέλει
  choice: onye ọ chọrọ
  rationale: Nke a na-edobe echiche nke uche na mkpebi nke Chineke n’enweghị ịgbanwe ya ka ọ bụrụ nanị ikwe ka ihe mee. A na-ekwughachi ya n’ahịrịokwu abụọ iji chekwaa nhazi yiri ibe ya nke Grik.
- source_word: ἐλεεῖ
  choice: ọ na-emere ... ebere
  rationale: Nke a bụ okwu Igbo doro anya maka igosi mmadụ ebere ma ọ bụ imere ya obi ebere.
- source_word: ὃν δὲ θέλει
  choice: ma ... onye ọ chọrọ
  rationale: “Ma” na-egosipụta ọdịiche dị n’etiti imere ebere na ime ka mmadụ bụrụ onye isi ike, ebe ikwughachi “onye ọ chọrọ” na-echekwa nhazi nke isi mmalite ahụ.
- source_word: σκληρύνει
  choice: ọ na-emekwa ka ... bụrụ onye isi ike
  rationale: Ngwaa Grik a nọ n’olu ọrụ ma pụta ime ka mmadụ sie ike ma ọ bụ bụrụ onye isi ike. Nsụgharị a doro ndị na-agụ Igbo anya ma ghara ime ka ọrụ ahụ bụrụ naanị ikwe ka mmadụ sie ike.
theological_decisions:
- issue: Uche Chineke n’okwu θέλει
  choice: E debere ya dịka “onye ọ chọrọ,” nke na-ekwu kpọmkwem banyere uche Chineke.
  alternative: Ịkọwa ya dịka onye Chineke nanị kwere ka ihe mee ya.
  rationale: Ihe odide Grik kwuru banyere ihe ọ chọrọ n’ahịrịokwu abụọ ahụ; nsụgharị ekwesịghị idozi esemokwu dị n’etiti ọchịchọ Chineke na ibu ọrụ mmadụ.
- issue: Onye na-arụ ọrụ na σκληρύνει
  choice: 'E jiri usoro ọrụ kpọmkwem: “ọ na-emekwa ka ... bụrụ onye isi ike.”'
  alternative: “Ọ na-ekwe ka ... bụrụ onye isi ike.”
  rationale: Ngwaa Grik bụ nke onye nọ n’ọrụ na-eme kpọmkwem. Ịsụgharị ya dịka nanị ikike e nyere ihe ime ga-eme ka okwu ahụ dị nro karịa isi mmalite ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, doro anya ma dị ùgwù. A họọrọ “onye isi ike” ka a ghara iji okwu nwere ike ịpụta inwe obi ike ma ọ bụ ịbụ dike; n’ebe a, ihe a na-ekwu bụ isi ike nke obi. A chekwara ọdịiche dị n’etiti ahịrịokwu abụọ ahụ na ọrụ kpọmkwem nke onye isiokwu ahụ.
