id: ROM.9.29
reference: Romans 9:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: ig
  text: Dị ka Aịzaya kwuburu, “Ọ bụrụ na Onyenwe nke ụsụụ ndị agha[a] ahapụghị anyị ụmụ[b], anyị gaara aghọ ka Sọdọm, a gaara emekwa anyị ka anyị yie Gọmọra.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onyenwe Sabaọt.” Okwu Grik Σαβαώθ na-edegharị ụda utu aha Chineke n’asụsụ Hibru, nke a na-asụgharịkarị “nke ụsụụ ndị agha” ma ọ bụ “nke ndị agha.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “mkpụrụ.” N’ebe a ọ na-ezo aka n’ụmụ ma ọ bụ ụmụ ụmụ fọdụrụ ndụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ καθὼς
  choice: Dịkwa nnọọ ka
  rationale: Ọ na-egosi na okwu Aịzaya kwekọrọ n’ihe e kwuru tupu ya; ‘nnọọ ka’ na-edobe ike ntụnyere ahụ n’Igbo dị ndụ.
- source_word: προείρηκεν
  choice: kwuru na mbụ
  rationale: Oge perfect Grik na-arụtụ aka n’okwu e kwuru tupu mgbe ahụ nke ka dị mkpa; nsụgharị a na-edobe echiche oge ahụ n’enweghị ime ya amụma kpọmkwem.
- source_word: κύριος Σαβαὼθ
  choice: Onyenwe anyị nke ụsụụ ndị agha
  rationale: A sụgharịrị aha ọchịchị Chineke ahụ kama idegharị naanị ụda Hibru ya; ọ na-egosi Onyenwe anyị dịka onye na-achị ụsụụ niile.
- source_word: ἐγκατέλιπεν
  choice: ahapụghị
  rationale: N’ebe a ngwaa ahụ pụtara ịhapụ ụfọdụ ka ha dịrị ndụ ma ọ bụ ka ha fọdụ; ‘ahapụghị’ nọ nso n’okwu Grik ma doo anya n’ọnọdụ a.
- source_word: σπέρμα
  choice: ụmụ
  rationale: Ọ bụ ‘mkpụrụ’ n’ụzọ nkịtị, ma n’ebe a ọ na-ezo aka n’ụmụ ma ọ bụ ụmụ ụmụ fọdụrụ ndụ. ‘Ụmụ’ bụ okwu Igbo dị mfe ma ghara itinye okwu nkà mmụta okpukpe ‘ndị fọdụrụ’ n’ahịrị bụ isi.
- source_word: ἂν ἐγενήθημεν
  choice: anyị gaara aghọworị
  rationale: ‘Gaara’ na-egosi nsonaazụ megidere ihe mere n’eziokwu, ‘aghọworị’ na-edobekwa echiche γίνομαι nke ịghọ ihe.
- source_word: ἂν ὡμοιώθημεν
  choice: e meekwala anyị ka anyị yie
  rationale: Nke a na-edobe olu nnara nke ὁμοιόω ma mee ka ngwaa nke abụọ dị iche na ‘aghọworị,’ dịka ọ dị na Grik.
theological_decisions:
- issue: Nsụgharị aha Chineke κύριος Σαβαώθ n’okwu e hotara n’Aịzaya
  choice: Onyenwe anyị nke ụsụụ ndị agha
  alternative: Onyenwe anyị Sabaọt
  rationale: Grik dere Σαβαώθ dịka mbipụta ụda aha Hibru, ma ihe aha ahụ pụtara bụ ụsụụ ndị agha. Ịsụgharị ya na-eme ka onye Igbo ghọta aha ọchịchị ahụ, ebe nkọwa ala peeji na-echekwa ụdị ọzọ.
- issue: Ma a ga-asụgharị σπέρμα dịka ‘ndị fọdụrụ’
  choice: ụmụ
  alternative: ndị fọdụrụ
  rationale: Ọ bụ ezie na isiokwu ndị fọdụrụ dị n’akụkụ amaokwu a, okwu Grik n’onwe ya bụ ‘mkpụrụ,’ ya bụ ụmụ ma ọ bụ ụmụ ụmụ. ‘Ụmụ’ na-edobe okwu ahụ n’enweghị idozi ihe ọ pụtara n’ụzọ nkà mmụta okpukpe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ntụnyere na ọnọdụ megidere eziokwu nke Grik, tinyere ọdịiche dị n’etiti ‘ịghọ’ na ‘ime ka o yie.’
