revisions:
- from: Dịkwa nnọọ ka Aịzaya kwuru na mbụ, “Ọ bụrụ na Onyenwe anyị nke ụsụụ ndị agha[a] ahapụghị anyị ụmụ[b][c], anyị gaara aghọworị ka Sọdọm, e meekwala anyị ka anyị yie Gọmọra.”
  to: Dị ka Aịzaya kwuburu, “Ọ bụrụ na Onyenwe nke ụsụụ ndị agha[a] ahapụghị anyị ụmụ[b], anyị gaara aghọ ka Sọdọm, a gaara emekwa anyị ka anyị yie Gọmọra.”
  rationale: The revision removes the possessive meaning inadvertently attached to the divine title, restores both Greek contrary-to-fact results in natural Igbo, and removes an unexpressed ‘already’ nuance. Footnote anchors are placed in ascending order and each retained footnote is supplied.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:26:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the citation, the counterfactual structure, and the distinction between becoming like Sodom and being made like Gomorrah. However, “Onyenwe anyị” adds the possessive “our” to κύριος, while ἡμῖν belongs with “had not left us offspring.” “A gaara emekwa anyị ka anyị yie” more accurately expresses the δεύτερο passive counterfactual than the completed-sounding “e meekwala anyị.”
  naturalness: “Dị ka Aịzaya kwuburu” is idiomatic Standard Igbo and conveys the prior-scriptural-statement sense naturally. Removing “-worị” avoids adding ‘already,’ which is not expressed in the Greek. The revised paired conditional clauses are clear and natural.
  terminology: “Onyenwe nke ụsụụ ndị agha” renders κύριος Σαβαώθ without importing an unwarranted possessive. “Ụmụ” remains an acceptable contextual rendering of σπέρμα; its literal sense is retained in the footnote. The footnote should call Σαβαώθ a Hebrew divine title, rather than simply a divine name.
  issues:
  - severity: high
    issue: “Onyenwe anyị” means “our Lord.”
    rationale: The Greek reads κύριος Σαβαώθ, ‘the Lord of Hosts’; the pronoun ἡμῖν (‘us’) modifies ἐγκατέλιπεν, ‘had left us.’ The possessive must not be attached to the divine title.
  - severity: medium
    issue: “e meekwala anyị ka anyị yie” does not clearly express the counterfactual passive result.
    rationale: The form sounds completed/perfective. “A gaara emekwa anyị ka anyị yie” explicitly matches ἂν ὡμοιώθημεν, ‘we would have been made like.’
  - severity: low
    issue: “aghọworị” adds an ‘already’ nuance.
    rationale: The aorist ἐγενήθημεν denotes ‘would have become’ but does not itself express ‘already.’
  - severity: low
    issue: The Sabaoth footnote describes the term imprecisely as a Hebrew divine name.
    rationale: In context it is a transliterated Hebrew divine title, commonly translated ‘of Hosts’ or ‘of Armies.’
  revised_text: Dị ka Aịzaya kwuburu, “Ọ bụrụ na Onyenwe nke ụsụụ ndị agha[a] ahapụghị anyị ụmụ[b], anyị gaara aghọ ka Sọdọm, a gaara emekwa anyị ka anyị yie Gọmọra.”
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Onyenwe Sabaọt.” Okwu Grik Σαβαώθ na-edegharị ụda utu aha Chineke n’asụsụ Hibru, nke a na-asụgharịkarị “nke ụsụụ ndị agha” ma ọ bụ “nke ndị agha.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “mkpụrụ.” N’ebe a ọ na-ezo aka n’ụmụ ma ọ bụ ụmụ ụmụ fọdụrụ ndụ.
    reason: lexical_alternative
  - marker: c
    text: Okwu a sitere n’Aịzaya 1:9.
    reason: cross_reference
  revision_rationale: The revision removes the possessive meaning inadvertently attached to the divine title, restores both Greek contrary-to-fact results in natural Igbo, and removes an unexpressed ‘already’ nuance. Footnote anchors are placed in ascending order and each retained footnote is supplied.
