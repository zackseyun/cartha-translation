revisions:
- from: Ma gịnịkwanụ ma ọ bụrụ na Chineke[a], ebe ọ chọrọ igosi iwe ya na ime ka a mara ike ya[b], ji nnukwu ntachi obi nagide arịa nke iwe, ndị a kwadebere maka mbibi[c],
  to: Ma gịnị kwanụ ma ọ bụrụ na Chineke[a], n’ịchọ igosi iwe ya na ime ka a mara ike ya[b], ji nnukwu ntachi obi nagide arịa nke iwe a kwadebere maka mbibi[c],
  rationale: The revision makes only safe grammatical and stylistic adjustments. It retains the unfinished rhetorical conditional, the theological force of divine wrath and power, the vessel metaphor, and—most importantly—the passive ambiguity of κατηρτισμένα. The footnotes retain all original anchors and clarify alternatives without adopting a doctrinal interpretation.
