id: ROM.9.22
reference: Romans 9:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: ig
  text: Ma gịnị kwanụ ma ọ bụrụ na Chineke[a], n’ịchọ igosi iwe ya na ime ka a mara ike ya[b], ji nnukwu ntachi obi nagide arịa nke iwe a kwadebere maka mbibi[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ma ọ bụrụ na.” Grik ji usoro okwu ọnọdụ na-ajụ ajụjụ nkwupụta malite ahịrịokwu a, nke na-aga n’ihu n’amaokwu na-esote.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ịdị ike ya.” N’ebe a, okwu Grik ahụ na-ezo aka n’ike Chineke.
    reason: lexical_alternative
  - marker: c
    text: Okwu a bụ “a kwadebere maka mbibi” ekwughị onye kwadebere arịa ndị ahụ. Ndị na-akọwa Akwụkwọ Nsọ nwere echiche dị iche iche ma Pọl ọ̀ na-ekwu maka omume Chineke, ime ka obi ha sie ike n’onwe ha, ma ọ bụ naanị ọnọdụ ịdị njikere maka ikpe.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma gịnịkwanụ ma ọ bụrụ na
  rationale: Na-egosi ajụjụ nkwupụta e tinyere n’ọnọdụ nke na-aga n’ihu n’amaokwu na-esote, n’emeghị ka amaokwu a yie ahịrịokwu zuru ezu.
- source_word: θέλων
  choice: ebe ọ chọrọ
  rationale: Na-echekwa echiche participle nke ọchịchọ ma ọ bụ nzube Chineke jikọrọ ya na ngwaa bụ isi, n’Igbo dị mfe ma dịkwa mma.
- source_word: ἐνδείξασθαι τὴν ὀργὴν
  choice: igosi iwe ya
  rationale: Na-egosi ngosipụta e bu n’obi; ‘iwe’ bụ okwu Igbo doro anya nke nwere ike ibu echiche ikpe Chineke n’ọnọdụ a.
- source_word: γνωρίσαι
  choice: ime ka a mara
  rationale: Na-echekwa echiche causative nke ime ka ihe bụrụ ihe ndị ọzọ maara.
- source_word: τὸ δυνατὸν αὐτοῦ
  choice: ike ya
  rationale: Ọ bụ nsụgharị Igbo sitere n’okwu a nke ọma n’ọnọdụ a, ebe ọ na-ezo aka n’ike Chineke.
- source_word: ἤνεγκεν
  choice: nagide
  rationale: N’ihi njikọ ya na nnukwu ntachi obi, okwu a pụtara iburu ma ọ bụ ịnagide ihe ogologo oge.
- source_word: ἐν πολλῇ μακροθυμίᾳ
  choice: ji nnukwu ntachi obi
  rationale: Na-egosipụta ụzọ Chineke si nagide ha, n’asụsụ Igbo nke oge a ma dị mfe nghọta.
- source_word: σκεύη ὀργῆς
  choice: arịa nke iwe
  rationale: ‘Arịa’ na-echekwa ihe atụ ite na arịa dị n’akụkụ amaokwu a; genitive ahụ ka a hapụrụ n’ụdị kọmpat ka a ghara ịkọwa ya gabiga ókè.
- source_word: κατηρτισμένα
  choice: ndị a kwadebere
  rationale: Na-egosipụta ọnọdụ nke ịdị njikere nke perfect passive participle ahụ ma hapụ onye kwadebere ha n’amaghị ama dịka Grik si mee.
- source_word: εἰς ἀπώλειαν
  choice: maka mbibi
  rationale: Na-egosipụta njedebe ma ọ bụ ebe ọnọdụ nkwadebe ahụ na-eduga, n’enweghị ịgbakwunye nkọwa ọzọ.
theological_decisions:
- issue: Onye mere nkwadebe nke κατηρτισμένα (‘a kwadebere’)
  choice: A sụgharịrị ya n’ụdị passive, ‘ndị a kwadebere,’ n’akpọghị onye kwadebere ha aha.
  alternative: Chineke kwadebere ha maka mbibi; ha mere onwe ha ndị dị njikere maka mbibi; ma ọ bụ naanị na ha nọ n’ọnọdụ kwesịrị mbibi.
  rationale: Grik ekwughị onye mere ihe ahụ. Ịhapụ onye mere ya n’amaghị ama na-echekwa mgbagwoju anya na esemokwu nkà mmụta okpukpe dị n’ederede.
- issue: Ike nke conditional εἰ nke na-agwụchaghị n’amaokwu a
  choice: ‘Ma gịnịkwanụ ma ọ bụrụ na’ ka e ji malite ya, a hapụkwara ahịrịokwu ahụ ka ọ gaa n’ihu n’amaokwu 23.
  alternative: ‘Ma ọ bụrụ na’; ma ọ bụ ime ka amaokwu 22 bụrụ nkwupụta zuru ezu.
  rationale: Usoro okwu Pọl kwụsịtụrụ ruo n’amaokwu na-esote. Nsụgharị rhetorical a na-echekwa ya ma ghara ime ka okwu a sie ike karịa Grik.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ ‘arịa,’ usoro conditional nke na-aga n’ihu n’amaokwu 23, na enweghị onye a kpọrọ aha n’ụdị passive. Akara nkọwa ala peeji [a], [b], na [c] niile dị n’ederede bụ isi.
