review_pass:
  verdict: revise
  source_fidelity: A safe revision is needed. τὰ μὴ διώκοντα denotes pursuing/chasing after rather than merely wanting or seeking, so “na-adịghị achụso” more closely retains the participle’s active, ongoing sense. In the final clause, δέ with the repeated δικαιοσύνη functions naturally as a specification of the righteousness attained; an explicitly appositional rendering avoids making it sound like a strong contrast while preserving the repeated noun.
  naturalness: “Ndị na-adịghị achụso ezi omume” is clear, modern Standard Igbo. “ya bụ, ezi omume nke sitere n’okwukwe” is idiomatic and clearly identifies the kind of righteousness in view.
  terminology: “Ndị mba ọzọ,” “ezi omume,” and “okwukwe” remain suitable broad renderings. The footnotes appropriately retain “mba dị iche iche,” “ikpe ziri ezi,” and the less likely faithfulness-related alternative without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: “na-adịghị achọ” understates διώκοντα.
    rationale: The Greek verb διώκω here conveys pursuing or striving after. “Achụso” better preserves that active sense than the broader “achọ.”
  - severity: low
    issue: “ma” after the dash can suggest an unnecessary adversative contrast.
    rationale: The repeated noun and article specify the righteousness attained. “Ya bụ” expresses this appositional clarification naturally in Igbo.
  revised_text: Gịnịzi ka anyị ga-ekwu? Ọ bụ na ndị mba ọzọ[a], bụ́ ndị na-adịghị achụso ezi omume[b], nwetara ezi omume—ya bụ, ezi omume nke sitere n’okwukwe[c].
