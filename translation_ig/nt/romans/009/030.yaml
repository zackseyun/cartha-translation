source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: ig
  text: Gịnịzi ka anyị ga-ekwu? Ọ bụ na ndị mba ọzọ[a], bụ́ ndị na-adịghị achụso ezi omume[b], nwetara ezi omume—ya bụ, ezi omume nke sitere n’okwukwe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.” N’ebe a ọ na-ezo aka ná ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ezi omume” dịka “ikpe ziri ezi” n’ebe a na n’ebe ndị ọzọ okwu a pụtara n’amaokwu a; okwu Grik δικαιοσύνη nwere ike ịgụnye ịdị ziri ezi n’omume ma ọ bụ n’iwu, nakwa ikpe ziri ezi nke metụtara ọgbụgba ndụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ezi omume nke na-abịa site n’okwukwe”; nke na-esichaghị ike n’ebe a bụ, “ezi omume nke sitere n’ikwesị ntụkwasị obi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Gịnịzi ka anyị ga-ekwu?
  rationale: Ọ na-egosipụta ajụjụ ntụgharị uche Pọl ji aga n’ihu n’arụmụka ya, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ebe a ọ na-ekwu maka ndị na-abụghị ndị Juu, n’ụzọ dị iche na Izrel; ‘ndị mba ọzọ’ na-eme ka nke a doo anya n’Igbo.
- source_word: τὰ μὴ διώκοντα
  choice: bụ́ ndị na-adịghị achọ
  rationale: Ụdị participle nke ugbu a na-egosi omume ma ọ bụ ọnọdụ na-aga n’ihu; ‘na-adịghị achọ’ na-echekwa nghọta ahụ n’Igbo nkịtị.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: ‘Ezi omume’ bụ okwu Igbo a na-aghọta nke ọma maka δικαιοσύνη, ma ọ naghị akpọchi ihe Pọl pụtara naanị n’otu nkọwa iwu ma ọ bụ ozizi.
- source_word: κατέλαβεν
  choice: nwetara
  rationale: N’ebe a ngwaa ahụ pụtara iru ma ọ bụ inweta ihe ahụ a na-achọghị; ‘nwetara’ bụ Igbo doro anya ma dịkwa eke.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: ma ezi omume ahụ bụ nke sitere n’okwukwe
  rationale: Nkwughachi ahụ na-akọwapụta ụdị ezi omume a nwetara. ‘Sitere n’okwukwe’ na-echekwa ike ἐκ n’enweghị ịgbakwunye usoro ozizi na-adịghị n’ederede.
- source_word: πίστεως
  choice: okwukwe
  rationale: N’usoro okwu a, πίστις kacha dabara dị ka okwukwe ma ọ bụ ntụkwasị obi; ‘okwukwe’ bụ okwu Igbo a na-ejikarị eme ihe ma na-echekwa obosara ya.
theological_decisions:
- issue: Ihe δικαιοσύνη pụtara n’arụmụka Pọl
  choice: Ezi omume
  alternative: Ikpe ziri ezi; ọnọdụ ziri ezi n’ihu Chineke; ịbụ onye e tinyere n’ọgbụgba ndụ
  rationale: Amaokwu ahụ akọwaghị ụzọ ozizi niile okwu ahụ nwere ike isi rụọ ọrụ. ‘Ezi omume’ na-echekwa obosara echiche Pọl ma ghara ime ka ọ bụrụ naanị otu nkọwa okpukpe.
- issue: Ihe ἐκ πίστεως pụtara
  choice: Nke sitere n’okwukwe
  alternative: Nke na-abịa site n’okwukwe; nke sitere n’ikwesị ntụkwasị obi
  rationale: Nsụgharị a na-echekwa preposition ἐκ ma ghara ịgbakwunye ‘naanị’ ma ọ bụ nkọwa ozizi ọzọ na-adịghị n’asụsụ Grik.
- issue: Ọrụ δέ n’akụkụ ikpeazụ
  choice: ma ezi omume ahụ bụ nke sitere n’okwukwe
  alternative: ya bụ, ezi omume nke sitere n’okwukwe
  rationale: ‘Ma’ na-echekwa δέ dị ka ntụgharị nke na-akọwapụta ụdị ezi omume a nwetara, n’agbanyeghị na enwere ike ịghọta ya dị ka nkọwa appositional karịa esemokwu siri ike.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji ‘bụ́’ mee njikọ nkọwa n’enweghị usoro okwu siri ike; e debere okwu ozizi ndị bụ isi n’ụzọ sara mbara ma tinye nhọrọ ndị ọzọ n’ala peeji.
