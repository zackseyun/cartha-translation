  to: Gịnịzi ka anyị ga-ekwu? Ọ bụ na ndị mba ọzọ[a], bụ́ ndị na-adịghị achụso ezi omume[b], nwetara ezi omume—ya bụ, ezi omume nke sitere n’okwukwe[c].
