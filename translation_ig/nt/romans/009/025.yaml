  source_fidelity: 'Echiche bụ isi ka edobere nke ọma: Pọl na-ekwu maka Chineke dịka onye na-ekwu okwu n’akwụkwọ Hosea, a na-edobekwa ọdịiche dị n’etiti ìgwè mmadụ mbụ na onye nwanyị nke abụọ. Otú ọ dị, usoro “Aga m akpọ …, kpọọkwa …” adịghị edo anya nke ọma n’Igbo n’ihi na “kpọọkwa” nwere ike ịdị ka iwu ma ọ bụ ngwaa na-enweghị akara ọdịnihu; a ga-eji otu ngwaa ọdịnihu nke na-achị ihe abụọ ahụ mee ka nhazi Grik doo anya.'
