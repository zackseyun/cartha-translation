id: ROM.9.25
reference: Romans 9:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: ig
  text: Dị ka ọ na-ekwukwa n’akwụkwọ Hosea[b], “Aga m akpọ ndị na-abụghị ndị m ‘ndị m,’ ma kpọọ nwanyị ahụ a na-ahụghị n’anya ‘nwanyị a hụrụ n’anya.’[a][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụdị na-agbasochi Grik anya karịa, “Aga m akpọ onye na-abụghị ndị m ‘ndị m.’” Grik ji ụdị otu mee ihe, ma okwu ahụ na-arụ ọrụ dịka aha otu ìgwè mmadụ.
    reason: lexical_alternative
  - marker: b
    text: E hotara nke a n’akwụkwọ Hosea (lee Hosea 2:23; ọnụọgụ amaokwu nwere ike ịdị iche n’ụfọdụ usoro). Pọl na-etinye okwu Hosea banyere mweghachi n’ọrụ n’ịkọwa otú Chineke si akpọpụtara onwe ya otu ndị.
    reason: cross_reference
  - marker: c
    text: A pụkwara ịsụgharị okwu ikpeazụ ahụ “onye a hụrụ n’anya.” Okwu Grik sitere n’otu ezinụlọ okwu e ji ekwu maka ịhụnanya Chineke n’ebe ndị mmadụ nọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: Dị ka ọ na-ekwukwa
  rationale: Nke a na-ewebata amaokwu Akwụkwọ Nsọ ọzọ dịka ihe na-akwado okwu Pọl; “-kwu-” na-egosipụta ike nke καί (“ọzọkwa”).
- source_word: ἐν τῷ Ὡσηὲ
  choice: n’akwụkwọ Hosea
  rationale: Ọ bụ usoro e si ezo aka n’ihe e dere n’akwụkwọ Hosea. Ịtinye “akwụkwọ” na-eme ka ọ doo anya n’Igbo n’enweghị ịgbasa ihe Grik kwuru gabiga ókè.
- source_word: Καλέσω
  choice: Aga m akpọ
  rationale: Nke a na-edobe ọdịdị okwu ọdịnihu na echiche nke ịkpọ ma ọ bụ ịkọwa ndị ahụ dịka ndị nke Chineke.
- source_word: τὸν οὐ λαόν μου
  choice: ndị na-abụghị ndị m
  rationale: Ọ bụ ezie na ọdịdị Grik bụ otu, λαός na-arụ ọrụ dịka aha ìgwè mmadụ; ụdị ọtụtụ a bụ Igbo doro anya ma dịkwa ụtọ n’ọnụ.
- source_word: λαόν μου
  choice: ndị m
  rationale: Nke a bụ ụzọ Igbo dị nkenke ma bụrụkwa nke okike isi kwuo njikọ ọgbụgba ndụ dị n’okwu “my people.”
- source_word: τὴν οὐκ ἠγαπημένην
  choice: nwanyị ahụ a na-ahụghị n’anya
  rationale: “Nwanyị ahụ” na-eme ka ụdị nwanyị nke okwu Grik pụta ìhè, ebe “a na-ahụghị n’anya” na-edobe echiche nke onye na-anataghị ịhụnanya.
- source_word: ἠγαπημένην
  choice: nwanyị a hụrụ n’anya
  rationale: Nke a na-edobe ụdị nwanyị na echiche passive nke onye a hụrụ n’anya, ma na-eji okwu Igbo nkịtị na nke doro anya.
theological_decisions:
- issue: Ma okwu Hosea a na-ekwu maka otu onye ka ọ bụ otu ìgwè mmadụ
  choice: E jiri ụdị ọtụtụ, “ndị na-abụghị ndị m,” gosi ike ìgwè mmadụ nke λαός, ma debe ụdị nwanyị n’ahịrịokwu nke abụọ.
  alternative: 'A pụrụ ịsụgharị ha abụọ n’ụdị otu: “onye na-abụghị ndị m ... onye a na-ahụghị n’anya.”'
  rationale: Pọl na-eji Hosea akwado ọkpụkpọ Chineke na-akpọpụtara onwe ya otu ìgwè mmadụ. Otú ọ dị, ụdị nwanyị dị n’ahịrịokwu nke abụọ sitere n’okwu Hosea ma kwesị ka ọ ghara ifu.
- issue: Onye na-ekwu okwu n’amaokwu ahụ
  choice: E debere “ọ na-ekwu,” nke na-enye ohere ka onye na-ekwu bụrụ Chineke dịka usoro okwu gbara ya gburugburu si egosi.
  alternative: “Akwụkwọ ahụ na-ekwu” ma ọ bụ “Hosea na-ekwu.”
  rationale: Grik ji ngwaa otu onye mee ihe, ma ọdịnaya okwu ahụ bụ okwu Chineke. Nsụgharị a anaghị atụgharị ya ka ọ bụrụ naanị okwu onye amụma ma ọ bụ akwụkwọ na-enweghị onye kwuru ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee ihe. Ahịrịokwu ahụ na-edobe nhazi uri nke okwu Hosea, ike ìgwè mmadụ dị na “ndị m,” na ụdị nwanyị nke nkebi nke abụọ.
