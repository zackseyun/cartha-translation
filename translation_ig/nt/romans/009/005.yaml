revisions:
- from: Ndị nna ochie ahụ bụ nke ha, ọ bụkwa n’etiti ha ka Mesaya si pụta n’ụzọ anụ ahụ[a]. Ọ bụ onye nọ n’elu ihe niile, Chineke onye a na-eto ruo mgbe ebighị ebi[b]. Amen.
  to: Ha nwekwara ndị nna ochie; sitekwa n’agbụrụ ha ka Mesaya siri pụta n’ihe gbasara anụ ahụ[a]—onye nọ n’elu ihe niile, Chineke a gọziri agọzi ruo mgbe ebighị ebi[b]. Amen.
  rationale: The revision corrects the lineage relation expressed by ἐξ ὧν, renders εὐλογητός as ‘blessed’ rather than ‘praised,’ and uses more natural Standard Igbo while maintaining the source’s disputed punctuation. The footnote retains, without endorsing, the possible separate-doxology reading.
  reviewer_model: gpt-5.6-terra
