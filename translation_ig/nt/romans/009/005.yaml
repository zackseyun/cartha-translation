base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: ig
  text: Ha nwekwara ndị nna ochie; sitekwa n’agbụrụ ha ka Mesaya siri pụta n’ihe gbasara anụ ahụ[a]—onye nọ n’elu ihe niile, Chineke a gọziri agọzi ruo mgbe ebighị ebi[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe gbasara usoro ọmụmụ mmadụ.” N’ụzọ nkịtị, “dị ka anụ ahụ si dị.”
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ, a pụrụ ịgụ nkebi ikpeazụ ahụ dịka otuto dị iche nye Chineke: “Ka Chineke, onye nọ n’elu ihe niile, bụrụ onye a gọziri agọzi ruo mgbe ebighị ebi. Amen,” kama ịgụ ya dịka nkọwa banyere Mesaya.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: ndị nna ochie ahụ
  rationale: Nke a na-ezo aka n’ebe ndị nna nna Izrel ndị a na-asọpụrụ nọ. Ọ na-edobe asụsụ Pọl banyere akụkọ ọgbụgba ndụ ma doo ndị na-agụ Igbo anya.
- source_word: ἐξ ὧν
  choice: n’etiti ha ka ... si pụta
  rationale: Nkebi a laghachiri n’ebe ụmụ Izrel ibe Pọl nọ. Nhọrọ a bụ Igbo eke nke na-egosi na Mesaya sitere n’agbụrụ ha.
- source_word: ὁ χριστός
  choice: Mesaya
  rationale: N’ebe a Χριστός bụ utu aha e jikọtara ya na ihe ùgwù Izrel, ọ bụghị naanị aha mmadụ.
- source_word: τὸ κατὰ σάρκα
  choice: n’ụzọ anụ ahụ
  rationale: Ọ na-egosi agbụrụ mmadụ ma ọ bụ ọmụmụ Mesaya n’ụwa. Nsụgharị a na-edobe okwu Pọl n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
- source_word: σάρκα
  choice: anụ ahụ
  rationale: N’ebe a σάρξ na-ekwu maka usoro ọmụmụ mmadụ, ọ bụghị ọdịdị mmehie.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: onye nọ n’elu ihe niile
  rationale: Ọ na-edobe ike nke participle Grik ma na-aga n’ihu ịkọwa Mesaya n’ụzọ doro anya na Igbo.
- source_word: θεὸς εὐλογητὸς
  choice: Chineke onye a na-eto
  rationale: εὐλογητός n’okwu otuto a pụtara onye kwesịrị otuto. Nhọrọ a bụ Igbo eke ma na-edobe ‘Chineke’ dịka nkọwa na-esochi okwu banyere Mesaya.
- source_word: εἰς τοὺς αἰῶνας
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ ụzọ Igbo doro anya na nke a na-ejikarị egosipụta okwu otuto nke pụtara mgbe niile.
- source_word: ἀμήν
  choice: Amen
  rationale: E debere okwu nkwenye a n’ụdị a maara nke ọma n’ofufe na n’asụsụ Igbo.
theological_decisions:
- issue: Ma nkebi ‘ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας’ ọ na-aga n’ihu ịkọwa Mesaya, ka ọ bụ otuto ọhụrụ dị iche a na-enye Chineke.
  choice: 'A gụrụ ya dịka nkọwa na-aga n’ihu banyere Mesaya: ‘Ọ bụ onye nọ n’elu ihe niile, Chineke onye a na-eto ruo mgbe ebighị ebi.’'
  alternative: 'A pụrụ ịgụ ya dịka otuto dị iche: ‘Ka a na-eto Chineke, onye nọ n’elu ihe niile, ruo mgbe ebighị ebi.’'
  rationale: Usoro okwu Grik, karịchaa participle nwere article ὁ ὢν, na-ejikọta nkebi a n’ụzọ kacha eke na ὁ χριστός. Ma ebe ihe odide aka ochie enweghị akara edemede nke ga-ekpebi okwu a kpamkpam, e debere ọgụgụ nke otuto dị iche n’ala ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ndị nna ochie’ na ‘Mesaya’ na-edobe ọnọdụ akụkọ Izrel; ‘n’ụzọ anụ ahụ’ na-echekwa okwu Pọl ma ala ala peeji na-akọwa ihe ọ pụtara. E debere mgbagwoju anya nke nkebi ikpeazụ n’ala ala peeji kama idozi ya n’ụzọ otu ozizi.
