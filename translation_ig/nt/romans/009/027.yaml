id: ROM.9.27
reference: Romans 9:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: ig
  text: Ma Aịzaya na-eti mkpu banyere Izrel[a], sị, “Ọ bụ ezie na ọnụ ọgụgụ ụmụ Izrel dị ka ájá nke oke osimiri[b], ọ bụ naanị ndị fọdụrụ ka a ga-azọpụta[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụmụ Izrel” dịka “ụmụ” ma ọ bụ “ndị Izrel.” N'asụsụ Grik, ọ bụ “ụmụ Izrel,” aha ọgbụgba ndụ ọdịnala e ji akpọ ndị Izrel.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Ọ bụrụ na ọnụ ọgụgụ ụmụ Izrel dị ka ájá nke oke osimiri.” Okwu Grik ahụ bụ ahịrịokwu ọnọdụ n'ụzọ nkịtị, ma n'ebe a ọ na-egosikwa echiche nke “ọ bụ ezie na.”
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụgharị ya “a ga-anapụta.” Okwu a na-ekwughachi amụma Aịzaya banyere ndị fọdụrụ ndụ.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Ma
  rationale: Na-egosi ntakịrị ntụgharị ma ọ bụ ọdịiche n'arụmụka Pọl, n'ụzọ Igbo doro anya.
- source_word: κράζει
  choice: tiri mkpu
  rationale: Na-echekwa ike okwu κράζω na ọdịdị nkwupụta amụma ahụ, ma bụrụkwa okwu Igbo e ji eme ihe nke ọma.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: banyere Izrel
  rationale: N'ebe a ὑπέρ pụtara ihe gbasara Izrel, ọ bụghị ịrịọ arịrịọ n'aha Izrel.
- source_word: Ἐὰν ᾖ
  choice: Ọ bụ ezie na ... dị
  rationale: 'Na-egosipụta mmetụta nkwenye-na-emegide nke ahịrịokwu ahụ: ọbụna n''agbanyeghị nnukwu ọnụ ọgụgụ ahụ, ọ bụ ndị fọdụrụ ka a ga-azọpụta; ndetu na-echekwa ntụgharị ọnọdụ nkịtị.'
- source_word: ὁ ἀριθμὸς
  choice: ọnụ ọgụgụ
  rationale: Ọ bụ okwu Igbo nkịtị na nke ziri ezi maka αριθμός.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: ụmụ Izrel
  rationale: Ọ bụ aha ọgbụgba ndụ ọdịnala nke na-agụnye ụmụ ma ọ bụ ndị Izrel n'ozuzu ha; ọ na-ada nke ọma n'Igbo ma ghara ịmachi ya naanị n'ụmụ nwoke.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: dị ka ájá dị n'oké osimiri
  rationale: Na-echekwa ihe atụ Akwụkwọ Nsọ ma jiri usoro okwu Igbo dị mfe nghọta.
- source_word: τὸ ὑπόλειμμα
  choice: ndị fọdụrụ
  rationale: Na-egosipụta ìgwè nta nke hapụrụ ma dị ndụ, nke bụ echiche amụma ahụ, n'okwu ndị mmadụ na-aghọta ngwa ngwa.
- source_word: σωθήσεται
  choice: a ga-azọpụta
  rationale: Na-echekwa ibu okwu nzọpụta ahụ n'akwụkwọ Ndị Rom, ebe ndetu na-egosi na ọ pụkwara ibu echiche nke ịnapụta.
theological_decisions:
- issue: Mmetụta ahịrịokwu ọnọdụ Ἐὰν ᾖ n'okwu amụma ahụ
  choice: Ọ bụ ezie na ọnụ ọgụgụ ... dị ...
  alternative: Ọ bụrụ na ọnụ ọgụgụ ... dị ...
  rationale: Isi ihe e kwuru bụ ọdịiche dị n'etiti nnukwu ọnụ ọgụgụ Izrel na ndị fọdụrụ a ga-azọpụta. A hapụrụ ntụgharị nkịtị nke ọnọdụ ahụ na ndetu ka e ghara ikpochapụ nghọta ọzọ dị na Grik.
- issue: Ntụgharị σωθήσεται
  choice: a ga-azọpụta
  alternative: a ga-anapụta
  rationale: “Azọpụta” dabara n'okwu Pọl na Ndị Rom 9–11 ma ghara itinye nkọwa otu ụka pụrụ iche; ndetu na-echekwa ụda amụma nke ịnapụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Tiri mkpu” na-echekwa ike okwu amụma ahụ; “ndị fọdụrụ” bụ okwu doro ndị nkịtị anya karịa okwu nka, ma ka na-echekwa echiche remnant. E debere akara ndetu niile [a], [b], [c] n'ahịrịokwu bụ isi n'ebe ha metụtara.
