  to: 'N’ihi na nke a bụ okwu nkwa: “N’oge a ka m ga-abịa[a], Sera ga-enwe nwa nwoke.”'
  rationale: The revision removes the unsupported additive nuance in “-takwa” and uses the idiomatic Igbo possession/existence expression “Sera ga-enwe nwa nwoke” for ἔσται τῇ Σάρρᾳ υἱός. It retains the source-prioritized “m ga-abịa,” preserves the Genesis-background alternative in the footnote, and does not add interpretive or doctrinal content.
  reviewer_model: gpt-5.6-terra
