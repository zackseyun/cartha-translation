id: ROM.9.9
reference: Romans 9:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: ig
  text: 'N’ihi na nke a bụ okwu nkwa: “N’oge a ka m ga-abịa[a], Sera ga-enwe nwa nwoke.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “m ga-alọghachi.” Okwu Grik dị ebe a bụ “m ga-abịa,” ọ bụ ezie na ụfọdụ nsụgharị na-agbaso okwu Jenesis dị n’azụ ya ma sụgharịa ya “m ga-alọghachi.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: nkwa
  rationale: Njikọ aha a na λόγος pụtara okwu nke bụ nkwa; ‘okwu nkwa’ na-egosipụta nke a n’Igbo n’enweghị itinye nkọwa ọzọ.
- source_word: λόγος
  choice: okwu
  rationale: N’ebe a, ọ na-arụtụ aka n’okwu ahụ e hotara; ‘okwu’ bụ nsụgharị dị nkenke ma bụrụkwa nke e ji eme ihe n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka nkọwa ma ọ bụ ihe mere e ji kwuo ya.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: N’oge a
  rationale: Nke a na-egosi oge a kara aka e kwuru okwu ya, ma na-anọ nso n’usoro okwu Grik ahụ n’Igbo dị eke.
- source_word: ἐλεύσομαι
  choice: m ga-abịa
  rationale: Ngwaa Grik ahụ pụtara kpọmkwem ‘m ga-abịa’; a hapụrụ ‘m ga-alọghachi’ n’ala ala peeji dịka ụzọ ọzọ sitere n’okwu Jenesis dị n’azụ ya.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: Sera ga-amụtakwa nwa nwoke
  rationale: Usoro Grik pụtara na Sera ga-enwe nwa nwoke. N’ọnọdụ nkwa ọmụmụ a, ‘ga-amụta nwa nwoke’ bụ Igbo eke ma dokwaa na nwa ahụ bụ nwoke.
- source_word: Σάρρᾳ
  choice: Sera
  rationale: E dere aha ahụ n’ụdị a maara nke ọma n’Igbo.
- source_word: υἱός
  choice: nwa nwoke
  rationale: Aha Grik ahụ na-ekwu kpọmkwem nwa nwoke, ihe dị mkpa n’akụkọ nkwa e kwere Ebreham na Sera.
theological_decisions:
- issue: Nkwupụta nkwa e kwere Ebreham na onye na-emezu ya
  choice: E gosipụtara ya dịka okwu Chineke kpọmkwem, ‘m ga-abịa,’ n’enweghị mgbakwunye nkọwa.
  alternative: Ịsụgharị ya ‘m ga-alọghachi’ iji soro ụfọdụ nsụgharị nke Jenesis.
  rationale: Arụmụka Pọl dabeere na nkwa Chineke dịka ntọala ọmụmụ Aịzik. ‘M ga-abịa’ na-edebe okwu Grik dị na Ndị Rom, ebe ala ala peeji na-echekwa njikọ ya na ụzọ ọzọ e si asụgharị Jenesis.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ ‘okwu nkwa’ iji nọgide nso n’usoro Grik, ebe ‘Sera ga-amụtakwa nwa nwoke’ na-eme ka idiom Grik doo anya n’Igbo. Akara ala ala peeji [a] dị n’akụkụ okwu ọ na-akọwa.
