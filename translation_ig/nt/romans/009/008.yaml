id: ROM.9.8
reference: Romans 9:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: ig
  text: Ya bụ, ọ bụghị ụmụ nke anụ ahụ[a] bụ ụmụ Chineke, kama ọ bụ ụmụ nke nkwa ahụ ka a na-agụta dị ka mkpụrụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsị, “ụmụ sitere n’agbụrụ mmadụ.” N’asụsụ Grik: “ụmụ nke anụ ahụ.”'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “ka a na-agụta dịka mkpụrụ.” N’ebe a, “mkpụrụ” sụgharịrị okwu Grik sperma, nke pụtara ụmụ ma ọ bụ ndị sitere n’agbụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: Ya bụ
  rationale: Nkebi okwu a na-ewebata nkọwa Pọl banyere ihe o kwuru n’amaokwu bu ụzọ; “Ya bụ” dị nkenke ma bụrụkwa Igbo a na-asụ nke ọma.
- source_word: τέκνα
  choice: ụmụ
  rationale: “Ụmụ” gụnyere nwoke na nwaanyị ma kwekọọ n’echiche nke ụmụ ma ọ bụ ndị sitere n’agbụrụ; e jikwa ya mee ihe n’otu ụzọ n’amaokwu ahụ.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: ụmụ nke anụ ahụ
  rationale: Nsụgharị a na-edobe okwu ihe atụ Pọl na ọdịiche ọ na-eme n’etiti ọmụmụ anụ ahụ na nkwa Chineke, ebe nkọwa ala peeji na-eme ka echiche agbụrụ pụta ìhè.
- source_word: τέκνα τοῦ θεοῦ
  choice: ụmụ Chineke
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke doro anya si egosipụta njikọ ahụ n’enweghị ịgbakwụnye nkọwa ozizi ọzọ.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: ụmụ nke nkwa ahụ
  rationale: Ọ na-edobe njikọ dị n’etiti ụmụ ahụ na nkwa Chineke, ebe “ahụ” na-ezo aka ná nkwa a maara site n’okwu ndị gbara amaokwu ahụ gburugburu.
- source_word: λογίζεται
  choice: a na-ewere
  rationale: Ụdị a na-egosi na a na-ele ha anya ma ọ bụ na-agụ ha n’otu ọnọdụ, ma ọ naghị amanye onye na-agụ ya ịnabata otu nkọwa ozizi pụrụ iche.
- source_word: εἰς σπέρμα
  choice: dị ka mkpụrụ
  rationale: “Mkpụrụ” na-edobe ihe oyiyi na okwu metụtara Abraham, ma n’ebe a ọ pụtara ụmụ sitere n’agbụrụ; nkọwa ala peeji na-eme ka nke ahụ doo anya.
theological_decisions:
- issue: Ọdịiche Pọl mere n’etiti ụmụ sitere n’anụ ahụ na ụmụ nke nkwa
  choice: E debere ọdịiche ahụ dịka okwu Grik si kwuo ya, n’enweghị ịkọwapụta ya dịka naanị ozizi banyere otu ìgwè ma ọ bụ naanị ozizi banyere nhọpụta onye n’otu n’otu.
  alternative: Ịsụgharị ya n’ụzọ ga-eme ka otu nkọwa—ma nke metụtara akụkọ ihe mere eme nke otu ìgwè, ma nke metụtara akara aka nke onye n’otu n’otu—bụrụ ihe amaokwu ahụ kwuru hoo haa.
  rationale: Amaokwu Grik ahụ na-ekwupụta ọdịiche ahụ, ma ọ naghị edozi n’onwe ya arụmụka niile gbasara Rom 9; ya mere nsụgharị ahụ chekwara mgbagwoju anya na esemokwu nkà mmụta okpukpe dị na ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. “Ya bụ” na-eme ka nkọwa ahụ na-aga were were; e debere okwu ihe atụ “anụ ahụ” na “mkpụrụ,” ma nye nkọwa ala peeji iji gbochie nghọtahie.
