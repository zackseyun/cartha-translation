  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: ig
  text: Ma ọ bụghị na okwu Chineke adaghị n’ọrụ. N’ihi na ọ bụghị ndị niile sitere n’Izrel[a] bụ Izrel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị sitere n’agbụrụ Izrel.” Akpaokwu Grik ahụ na-egosi isi mmalite ma ọ bụ usoro ọmụmụ.
    reason: lexical_alternative
  - marker: b
    text: Pọl na-eji “Izrel” ugboro abụọ n’ụzọ na-adịghị otu. Amaokwu a na-egosi ọdịiche dị n’etiti ndị sitere n’Izrel na ndị a kpọrọ “Izrel,” ma ọ naghị akọwa n’onwe ya kpọmkwem ókè ihe “Izrel” nke ugboro abụọ ahụ pụtara.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Ma ọ bụghị dị ka a ga-asị na
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa iji gọnahụ nkwubi okwu mmadụ nwere ike isi n’ihe Pọl kwuru tupu nke a nweta.
- source_word: ἐκπέπτωκεν
  choice: emezughị
  rationale: N’ebe a, okwu ahụ pụtara na ihe Chineke kwuru adaghị ma ọ bụ ghara iru nzube ya. Oge perfect nke Grik na-egosi ọnọdụ dị ugbu a sitere n’ihe gara aga; ‘emezughị’ na-enye echiche ahụ n’Igbo n’enweghị ntụgharị nkịtị nke ‘ịda.’
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: okwu Chineke
  rationale: A hapụrụ λόγος dị ka ‘okwu’ kama ịsụgharị ya ‘nkwa,’ ka ihe ọ pụtara ghara ịdị warara karịa Grik, ọ bụ ezie na okwu nkwa Chineke dị n’azụ arụmụka a.
- source_word: οὐ γὰρ πάντες
  choice: N’ihi na ọ bụghị ndị niile
  rationale: ‘N’ihi na’ na-egosi na ahịrịokwu nke abụọ na-akọwa ihe mere okwu Chineke na-emezughị; ‘ndị niile’ na-anọchi ọtụtụ mmadụ nke ọma.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: ndị niile sitere n’Izrel
  rationale: ‘Sitere n’Izrel’ na-egosi isi mmalite ma ọ bụ agbụrụ, dịka ἐξ si eme, ma hapụkwa ọdịiche Pọl na-eme ka ọ pụta ìhè.
- source_word: οὗτοι Ἰσραήλ
  choice: bụ Izrel
  rationale: Nke a na-edobe nkwupụta Pọl dị mkpirikpi ma sie ike, n’etinyeghị nkọwa gbasara kpọmkwem ndị ọ na-akpọ Izrel n’oge nke abụọ.
theological_decisions:
- issue: Ihe ‘Izrel’ nke ugboro abụọ pụtara
  choice: E debere aha ‘Izrel’ n’onwe ya, ka o gosi na Pọl ji ya mee ihe n’echiche dị warara karịa nke mbụ.
  alternative: Ịkọwa ya kpọmkwem dịka ‘ndị a họpụtara n’etiti ụmụ Izrel’ ma ọ bụ ‘ezi ndị Chineke.’
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ịbụ onye sitere n’agbụrụ Izrel abụghị naanị ihe na-ekpebi onye bụ ‘Izrel’ n’ime nzube Chineke. Ma ebe amaokwu a n’onwe ya akọwaghị ókè echiche nke abụọ ahụ ruru, ntụgharị ahụ anaghị etinye nkọwa otu ụka ma ọ bụ otu onye n’ime ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị ùgwù. Ahịrịokwu ahụ na-edobe ọdịiche siri ike dị n’etiti ‘ndị sitere n’Izrel’ na ‘Izrel,’ ma ọ naghị edozi esemokwu nkà mmụta okpukpe nke amaokwu ahụ karịa ihe Grik kwuru.
