id: ROM.9.20
reference: Romans 9:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: ig
  text: Kama, mmadụ, ònye ka ị bụ, onye na-aza Chineke ọnụ? Ihe e kpụrụ ọ̀ ga-ekwu onye kpụrụ ya, “Gịnị mere i ji mee m otu a?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ajụjụ Grik a na-atụ anya azịza “mba”: ihe e kpụrụ agaghị ekwu otu a.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: Ma
  rationale: Ọ na-egosi ntụgharị siri ike nke na-agbazi ma na-emegide ihe e kwuru tupu ya; “Ma” bụ ụzọ dị nkenke ma dịkwa eke n'Igbo.
- source_word: ὦ ἄνθρωπε
  choice: mmadụ
  rationale: Ọ bụ okwu a na-akpọ otu onye nke na-anọchi anya mmadụ n'ozuzu; “mmadụ” na-edobe ike okwu ahụ n'enweghị ime ka ọ bụrụ naanị nwoke.
- source_word: σὺ τίς εἶ
  choice: gịnwa, ... ònye ka ị bụ
  rationale: “Gịnwa” na-emesi nnọchiaha ike, ebe ajụjụ ahụ na-ama onye ahụ aka, ọ bụghị naanị ịjụ onye ọ bụ.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: iji zaghachi Chineke okwu
  rationale: Akpaokwu a n'Igbo na-egosi nzaghachi nke mmegide ma ọ bụ nke enweghị nkwanye ùgwù, ọ bụghị naanị ịza ajụjụ.
- source_word: μὴ ἐρεῖ
  choice: ọ ga-asị ...?
  rationale: Ajụjụ n'Igbo na-edobe ọdịdị ajụjụ Grik; ihe gbara ya gburugburu na-egosi na azịza a tụrụ anya ya bụ mba.
- source_word: τὸ πλάσμα
  choice: ihe a kpụrụ akpụ̀
  rationale: Ọ na-egosi ihe onye ọzọ kpụrụ ma na-edobe ihe atụ nke onye na-akpụ ihe.
- source_word: τῷ πλάσαντι
  choice: onye kpụrụ ya
  rationale: Ọ na-edobe njikọ okwu doro anya dị n'etiti ihe e kpụrụ na onye kpụrụ ya.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Gịnị mere i ji kee m otu a?
  rationale: Nke a bụ nsụgharị Igbo dị eke nke “Gịnị mere i ji mee/kee m otu a?”; “kee” dabara n'okwu gbasara Onye Okike ma na-edobe ajụjụ banyere otú e siri mee onye ahụ.
theological_decisions:
- issue: Ike nnọchiteanya nke ἄνθρωπε
  choice: A sụgharịrị ya “mmadụ” dị ka otu onye na-anọchi anya ụmụ mmadụ.
  alternative: “nwoke”
  rationale: N'ebe a okwu ahụ bụ ịkpọ mmadụ ọ bụla nọ n'ihu Chineke, ọ bụghị ịkọwa nwoke kpọmkwem; “mmadụ” na-edobe otu onye na oke okwu ahụ.
- issue: Ike ịba mba dị na ajụjụ Pọl
  choice: E ji “zaghachi Chineke okwu” gosipụta nzaghachi mmegide.
  alternative: “ịza Chineke”
  rationale: Okwu Grik abụghị nzaghachi nkịtị; ọ na-egosi mmadụ na-agbagha Chineke. Nhọrọ ahụ na-edobe ọdịiche dị n'etiti Onye kere ihe na ihe o kere n'ebughị ụzọ dozie esemokwu nkà mmụta okpukpe ahụ.
- issue: Ajụjụ na-atụ anya azịza na-adịghị mma
  choice: E debere ya dịka “ọ ga-asị ...?”
  alternative: “ọ̀ bụ na ... agaghị asị ...?”
  rationale: μή na-egosi na a tụrụ anya azịza “mba.” Ajụjụ dị mfe n'Igbo na-eme ka nke a pụta ìhè site n'ọnọdụ okwu ahụ, na-enweghị ịgbanwe ọdịdị ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji ajụjụ ọnụ dị nkọ chekwaa ịba mba ahụ, ma zere okwu ụka pụrụ iche. Akara ụda dị na “akpụ̀” na-enyere aka ịmata ya dịka ihe e mere site n'ịkpụ.
