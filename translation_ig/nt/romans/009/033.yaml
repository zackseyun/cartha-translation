revisions:
- from: Dị ka e dere ya[a], “Lee, ana m atọgbọ na Zayọn nkume nke na-eme ka mmadụ sụọ ngọngọ na okwute nke na-eme ka mmadụ daa[b]; onye kweere na ya[c] agaghị emechu ihu[d].”
  to: Dị ka e dere n’Akwụkwọ Nsọ[a], “Lee, ana m edobe na Zayọn nkume nke na-eme ka mmadụ sụọ ngọngọ na okwute nke na-eme ka mmadụ daa[b]; onye kweere na ya[c] agaghị eme ka ihere mee ya[d].”
  rationale: The revision corrects the verb of placement and clarifies the final passive honor-shame expression. It keeps the original image, register, and the ambiguity of “ya,” and preserves all four existing footnote anchors and their functions.
