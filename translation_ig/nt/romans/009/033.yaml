review_pass:
  verdict: revise
  source_fidelity: The draft preserves the citation formula, present tense of τίθημι, the Zion setting, the paired stone/rock imagery, and the deliberately personal-or-impersonal ambiguity of αὐτῷ through Igbo “ya.” However, “ana m atọgbọ” does not naturally convey God’s placing/setting a foundation stone and can suggest throwing or casting down. The final clause also needs an unambiguous Igbo expression for the future passive sense of καταισχυνθήσεται.
  naturalness: Most of the draft is clear Standard Igbo. Replacing “atọgbọ” with “edobe” gives a natural construction for placing a stone. “Agaghị eme ka ihere mee ya” clearly communicates that the believer will not be disgraced, without requiring an explicit agent.
  terminology: “Zayọn,” “nkume,” “okwute,” “sụọ ngọngọ,” and “Mesaya” are suitable. The rendering “na ya” appropriately retains the source’s referential ambiguity while allowing Paul’s contextual application. “Okwute nke na-eme ka mmadụ daa” is a defensible contextual rendering of πέτραν σκανδάλου; its alternative is retained in the footnote.
  issues:
  - severity: medium
    issue: “ana m atọgbọ” for τίθημι
    rationale: In this context τίθημι means ‘place/set/lay,’ whereas atọgbọ can evoke throwing down or casting aside. “Ana m edobe” is both idiomatic and faithful to the present-tense placement imagery.
  - severity: medium
    issue: “agaghị emechu ihu” for καταισχυνθήσεται
    rationale: This wording can be unclear or read as an incomplete active idiom. “Agaghị eme ka ihere mee ya” naturally expresses the future passive result, ‘will not be put to shame/disgraced.’
  revised_text: Dị ka e dere n’Akwụkwọ Nsọ[a], “Lee, ana m edobe na Zayọn nkume nke na-eme ka mmadụ sụọ ngọngọ na okwute nke na-eme ka mmadụ daa[b]; onye kweere na ya[c] agaghị eme ka ihere mee ya[d].”
