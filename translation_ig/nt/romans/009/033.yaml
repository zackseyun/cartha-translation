id: ROM.9.33
reference: Romans 9:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: ig
  text: Dị ka e dere n’Akwụkwọ Nsọ[a], “Lee, ana m edobe na Zayọn nkume nke na-eme ka mmadụ sụọ ngọngọ na okwute nke na-eme ka mmadụ daa[b]; onye kweere na ya[c] agaghị eme ka ihere mee ya[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ebe a, Pọl jikọtara okwu ndị dị n’Aịzaya 8:14 na Aịzaya 28:16.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “okwute na-akpasu mmadụ iwe” ma ọ bụ “okwute ịsụ ngọngọ.”
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, ọ bụ “onye kweere n’elu ya.” Ụfọdụ nsụgharị na-ewere “ya” dịka nkume ahụ; ọnọdụ okwu Pọl na-etinye ihe onyonyo ahụ n’ọrụ n’ebe Mesaya nọ.
    reason: alternative_reading
  - marker: d
    text: A pụkwara ịsụgharị ya, “agaghị enwe mmechuihu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Dị ka e dere ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ewebata ihe e hotara n’Akwụkwọ Nsọ; ọ na-egosipụta na ihe ahụ ka dị n’ederede.
- source_word: Ἰδοὺ
  choice: Lee
  rationale: “Lee” na-edobe ike okwu ahụ nke na-akpọ onye na-agụ ya ka o lebara ihe na-esonụ anya, n’asụsụ Igbo nke oge a.
- source_word: τίθημι
  choice: ana m atọgbọ
  rationale: Ọ na-edobe oge ugbu a nke ngwaa Grik ma kwekọọ n’onyonyo nke ịtọgbọ nkume a ga-eji rụọ ihe.
- source_word: ἐν Σιὼν
  choice: na Zayọn
  rationale: “Na” na-egosipụta ebe ihe ahụ dị n’ụzọ ebumpụta ụwa n’Igbo, ebe “Zayọn” bụ aha a maara nke ọma.
- source_word: λίθον προσκόμματος
  choice: nkume nke na-eme ka mmadụ sụọ ngọngọ
  rationale: Ntụgharị a na-eme ka ihe onyonyo ahụ doo onye Igbo nke oge a anya ma na-edobe echiche nke nkume na-akpata ịsụ ngọngọ.
- source_word: πέτραν σκανδάλου
  choice: okwute nke na-eme ka mmadụ daa
  rationale: Ọ na-edobe ọdịiche dị n’etiti λίθος na πέτρα, ma na-egosipụta σκάνδαλον dị ka ihe na-akpata ọdịda n’ime ihe atụ ahụ, n’enweghị ịmanye otu nkọwa okpukpe.
- source_word: ὁ πιστεύων
  choice: onye kweere
  rationale: Ọ na-anọchi anya participle e ji mee aha n’ụzọ Igbo dị mfe ma na-emetụta onye ọ bụla n’agbanyeghị nwoke ma ọ bụ nwaanyị.
- source_word: ἐπ’ αὐτῷ
  choice: na ya
  rationale: N’okwu Igbo “ikwere na ya” bụ ụzọ ebumpụta ụwa isi kwuo ịtụkwasị mmadụ obi; ihe odide Grik n’onwe ya nwere echiche nkịtị nke “n’elu ya,” nke a kọwara n’ala peeji.
- source_word: καταισχυνθήσεται
  choice: agaghị emechu ihu
  rationale: Ọ na-edobe ọdịdị passive na echiche ihere n’ihu ọha nke ngwaa ahụ, kama ịkọwa ya naanị dị ka enweghị mmechuihu n’ihe a tụrụ anya ya.
theological_decisions:
- issue: Ihe αὐτῷ na-ezo aka na ya n’okwu amụma ahụ e jikọtara ọnụ
  choice: E jiri “ya” mee ihe n’ụzọ nwere ike izo aka n’onye ahụ e ji nkume nọchite anya ya, dịka ọnọdụ okwu Pọl si dị.
  alternative: A pụrụ ịghọta ya dịka ihe na-ezo naanị n’“nkume” ahụ dịka ihe na-abụghị mmadụ.
  rationale: N’agbanyeghị na ihe onyonyo ahụ bụ nkume, ọnọdụ Rom 9:32–33 na 10:11 na-etinye okwu ahụ n’ọrụ n’ebe Mesaya nọ. Igbo “ya” na-echekwa njikọ ahụ n’enweghị ịkọwapụta ihe karịrị ihe ọnọdụ okwu ahụ kwadoro.
- issue: Ihe σκάνδαλον pụtara n’ahịrịokwu πέτραν σκανδάλου
  choice: “okwute nke na-eme ka mmadụ daa”
  alternative: “okwute na-akpasu iwe” ma ọ bụ “okwute ịsụ ngọngọ”
  rationale: N’ime ihe atụ nke nkume na okwute, echiche nke ihe na-eme ka mmadụ daa bụ nke bụ isi. Ala peeji na-echekwa echiche ọzọ nke ịkpasu iwe ma ọ bụ ịbụ ihe ọjọọ n’anya mmadụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A họọrọ ahịrịokwu na-akọwa ihe onyonyo ahụ nke ọma n’enweghị okwu ochie ma ọ bụ okwu pụrụ iche nke otu ụka. E debere myiri nkume, ịsụ ngọngọ, ọdịda, okwukwe na ihere nke dị n’isi mmalite.
