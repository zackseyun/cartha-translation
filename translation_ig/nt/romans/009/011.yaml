  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: ig
  text: N’ihi na, mgbe a mụbeghị ha, mgbe ha emebeghịkwa ezi ihe ọ bụla ma ọ bụ ihe ọjọọ[a], ka nzube Chineke nke dị ka nhọpụta si dị wee nọgide[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ezi ihe ọ bụla ma ọ bụ ihe rụrụ arụ.” Okwu Grik bụ φαῦλον nwere ike ịpụta ihe ọjọọ, ihe na-abaghị uru, ma ọ bụ ihe rụrụ arụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nzube nhọpụta Chineke” / “nzube Chineke dịka nhọpụta si dị.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “wee guzosie ike.” Okwu Grik ahụ pụtara ịnọgide ma ọ bụ ịga n’ihu ịdị; n’ebe a, ọ pụkwara inwe echiche nke iguzosi ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω ... γεννηθέντων
  choice: tupu a mụọ ha
  rationale: Ọ na-egosipụta n’Igbo n’ụzọ doro anya na ihe a na-ekwu mere tupu a mụọ ha, ma na-edobe ike oge nke μήπω na participle ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nkọwa Pọl gara aga dịka ihe na-akọwa ihe kpatara ya.
- source_word: μηδὲ πραξάντων
  choice: tupu ha emekwa
  rationale: Nkwughachi ‘tupu’ na-eme ka njikọ oge na nkwụkọ negation doo anya n’Igbo, ebe ‘-kwa’ na-ejikọta ọnọdụ abụọ ahụ.
- source_word: τι ἀγαθὸν ἢ φαῦλον
  choice: ezi ihe ọ bụla ma ọ bụ ihe ọjọọ
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ na nke e ji eme ihe kwa ụbọchị isi gosipụta ihe ọma na ihe ọjọọ n’enweghị ime ka φαῦλον sie ike karịa ka okwu Grik chọrọ.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro ‘ka ... wee’ na-egosipụta nzube nke clause ahụ ma ghara ikpebi esemokwu nkà mmụta okpukpe karịrị ihe syntax ahụ kwuru.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις
  choice: nzube ... nke dị ka nhọpụta si dị
  rationale: Ọ na-edobe njikọ prepositional nke Grik kama ịgbanwe ya ka ọ bụrụ nkọwa nkà mmụta okpukpe siri ike karịa ederede ahụ.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: ‘Nzube Chineke’ bụ genitive idiomatic n’Igbo ma na-egosi na nzube ahụ bụ nke Chineke.
- source_word: μένῃ
  choice: nọgide
  rationale: Ọ na-egosipụta isi echiche nke μένω, ya bụ ịnọgide ma ọ bụ ịga n’ihu ịdị, n’enweghị itinye nkọwa ọzọ n’ime ya.
theological_decisions:
- issue: Ike nke ἵνα n’ebe a na-ekwu maka nhọpụta
  choice: E ji ‘ka ... wee’ gosi clause nke nzube.
  alternative: A pụrụ ịsụgharị ya dịka nsonaazụ, ‘nke mere na ...’
  rationale: Syntax ahụ na-akwado nzube, ma nsụgharị ahụ anaghị eji okwu ọzọ kpebie arụmụka gbasara predestination.
- issue: Nsụgharị ἐκλογή
  choice: nhọpụta
  alternative: nhọrọ
  rationale: ‘Nhọpụta’ na-eburu ibu okwu ahụ n’ebe Pọl ji ya mee ihe, ma ọ ka na-ahapụ ka onye na-agụ ya tụlee ihe ọ pụtara n’enweghị paraphrase nke otu ụka.
- issue: Ihe μένῃ pụtara n’ọnọdụ a
  choice: nọgide
  alternative: guzosie ike
  rationale: ‘Nọgide’ bụ ihe μένω pụtara ozugbo; ‘guzosie ike’ ga-ekwe omume n’ọnọdụ a, ma ọ na-eme ka echiche ịdịgide ike pụta ìhè karịa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Nkwughachi ‘tupu’ na-eme ka genitive absolute na njikọ negation doo anya n’Igbo. E debere amaokwu ahụ dịka akụkụ ahịrịokwu na-aga n’ihu, ya mere rikoma dị na njedebe.
