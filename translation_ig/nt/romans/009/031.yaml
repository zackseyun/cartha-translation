  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: ig
  text: Ma Izrel, nke na-achụso iwu nke ezi omume[a], eruteghị iwu ahụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “ikpe ziri ezi”: “iwu nke ikpe ziri ezi.”'
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “o rughị ya” ma ọ bụ “o rughị n’iwu ahụ.” Akpaokwu Grik a dị nkenke, ọ dịkwa ike ịkọwa kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραήλ
  choice: Izrel
  rationale: Ọ bụ nsụgharị aha a na-ejikarị n’Igbo; n’arụmụka Pọl ebe a, ọ na-ezo aka n’Izrel dịka otu mba.
- source_word: δέ
  choice: Ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti Izrel na ndị mba ọzọ a kpọtụrụ aha n’amaokwu bu ụzọ.
- source_word: διώκων
  choice: nke na-achụso
  rationale: Ọ na-egosi mbọ siri ike a na-aga n’ihu ime iji nweta ihe, ma ọ tinyeghị n’amaokwu ahụ echiche nkọwa karịrị ihe Grik kwuru.
- source_word: νόμον δικαιοσύνης
  choice: iwu nke ezi omume
  rationale: Nke a na-edobe njikọ okwu Grik ahụ n’enweghị ịkọwapụta kpọmkwem ma iwu ahụ ọ bụ nke e ji ezi omume mara, ka ọ bụ iwu metụtara ezi omume.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: N’ebe a, okwu a dabara n’arụmụka Pọl banyere ịbụ onye ziri ezi n’ihu Chineke; a debere ‘ikpe ziri ezi’ dịka nhọrọ ọzọ n’ala peeji.
- source_word: εἰς νόμον
  choice: iwu ahụ
  rationale: Ikwughachi ‘iwu ahụ’ na-ejikọta ya na iwu Izrel na-achụso, ma na-ezere itinye nkọwa dịka ‘ebumnobi iwu ahụ’ nke okwu Grik ekwughị hoo haa.
- source_word: οὐκ ἔφθασεν
  choice: eruteghị
  rationale: Ngwaa Igbo a na-egosi na Izrel enwetaghị ma ọ bụ erughị ihe ọ na-achụso, ma na-edobe ihe oyiyi nke iru ebe a na-aga.
theological_decisions:
- issue: Otú e si sụgharịa δικαιοσύνη n’arụmụka Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: ‘Ezi omume’ na-adaba nke ọma n’okwu Pọl banyere ọnọdụ ziri ezi n’ihu Chineke, ebe ‘ikpe ziri ezi’ ka bụ ohere okwu ahụ nwere, ya mere e tinyere ya n’ala peeji.
- issue: Ihe εἰς νόμον pụtara n’ahịrịokwu a siri ike
  choice: iwu ahụ
  alternative: iwu; ebumnobi iwu ahụ
  rationale: ‘Iwu ahụ’ na-edobe njikọ ya na νόμον nke mbụ ma ghara idozi esemokwu nkọwa ahụ site n’itinye ‘ebumnobi,’ nke na-agafe okwu Grik kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ njikọ dị n’etiti ‘iwu’ na ‘ezi omume,’ nakwa akpaokwu banyere iru iwu ahụ, ka ha nọgide nwee ntakịrị mgbagwoju anya dị n’odide Grik.
