  source_fidelity: The translation accurately represents the contrastive δέ (“Ma”), the present participle διώκων (“nke na-achụso”), the ambiguous expression νόμον δικαιοσύνης (“iwu nke ezi omume”), and the repeated νόμον with εἰς (“iwu ahụ”). “Eruteghị” appropriately conveys οὐκ ἔφθασεν without importing an interpretation such as attaining the law’s goal.
