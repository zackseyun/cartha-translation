  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: ig
  text: Ọ ga-erukwa na n’ebe a gwara ha sị, “Unu abụghị ndị m,” n’ebe ahụ ka a ga-akpọ ha ụmụ nwoke nke Chineke, onye dị ndụ.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ụmụ nke Chineke, onye dị ndụ.” Grik ahụ kwuru “ụmụ nwoke”; e debere ya n’ahịrịokwu isi iji chekwaa okwu isi mmalite na ndumodu ya banyere ịbụ nwa na ihe nketa.
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ nhota ma ọ bụ ntụaka sitere na Hosea 1:10 (2:1 na Septuagint), nke ji asụsụ mweghachi nke ọgbụgba ndụ.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ἔσται
  choice: Ọ ga-abụkwa
  rationale: Nke a na-edobe njikọ καὶ na ọdịnihu ἔσται n’Igbo dị mfe ma bụrụkwa nke e ji ekwu okwu ugbu a.
- source_word: ἐν τῷ τόπῳ οὗ
  choice: na kpọmkwem n’ebe ahụ
  rationale: “Ebe ahụ” na-egosi τόπος na οὗ, ebe “kpọmkwem” na-eme ka nkwughachi siri ike dị n’etiti ebe a jụrụ ha na ebe a ga-akpọ ha pụta ìhè.
- source_word: ἐρρέθη αὐτοῖς
  choice: a gwara ha
  rationale: Nke a bụ ụzọ Igbo si ekwu passive a n’enweghị ịkpọ onye kwuru ya aha, dịka Grik ahụ si hapụ onye mere ya n’ezoghị ọnụ.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Unu abụghị ndị m
  rationale: “Ndị m” bụ okwu Igbo sitere n’obi maka “my people,” ma na-edobe asụsụ njikọ ọgbụgba ndụ dị n’akwụkwọ Hosea.
- source_word: ἐκεῖ κληθήσονται
  choice: ọ bụ n’ebe ahụ ka a ga-akpọ ha
  rationale: Usoro “ọ bụ ... ka” na-eme ka ἐκεῖ pụta ìhè, ebe “a ga-akpọ ha” na-edobe ọdịnihu passive ahụ n’enweghị ịgbakwunye onye ga-akpọ ha.
- source_word: υἱοὶ
  choice: ụmụ nwoke
  rationale: Grik ahụ kwuru ụmụ nwoke kpọmkwem; nhọrọ a na-edobe ụdị okwu ahụ na ndumodu ọnọdụ ịbụ nwa na ihe nketa, ebe nkọwa ala peeji na-egosi na ọ pụkwara ịgụnye ụmụ Chineke niile.
- source_word: θεοῦ ζῶντος
  choice: nke Chineke dị ndụ
  rationale: Nke a bụ ntụgharị Igbo doro anya nke genitive ahụ ma na-edobe aha nsọpụrụ “Chineke dị ndụ.”
theological_decisions:
- issue: Otú e si sụgharịa υἱοὶ mgbe ọ na-anọchite anya ìgwè mmadụ
  choice: ụmụ nwoke
  alternative: ụmụ
  rationale: A họọrọ “ụmụ nwoke” n’ihi na isi mmalite kwuru υἱοὶ, ọ bụghị τέκνα. Nke a na-echekwa ndumodu ịbụ nwa nwoke na ihe nketa, ma nkọwa ala peeji na-eme ka o doo anya na ndị a na-ekwu maka ha abụghị naanị ndị nwoke.
- issue: Njirimara ọgbụgba ndụ dị na λαός μου
  choice: ndị m
  alternative: ndị nke m
  rationale: “Ndị m” bụ okwu dị mkpụmkpụ ma bụrụkwa nke mmadụ na-aghọta nke ọma maka ndị Chineke kpọrọ nke ya; ọ naghị agbanwe okwu ọgbụgba ndụ ahụ ka ọ bụrụ nkọwa ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro “ọ bụ n’ebe ahụ ka” na-enye nkwughachi ebe ahụ ike n’enweghị ịgbakwunye nkọwa na-adịghị na Grik. E debere akara ala peeji [b] na [a] n’ahịrịokwu isi.
