id: ROM.9.21
reference: Romans 9:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: ig
  text: Ka ọ bụ na onye ọkpụ ite enweghị ikike n’ahụ ụrọ ahụ,[a][d] ịkpụpụta site n’otu ikpo ụrọ ahụ[b] otu arịa maka nsọpụrụ na nke ọzọ maka enweghị nsọpụrụ?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ọ̀ bụ na onye ọkpụ ite enweghị ihe ruuru ya n’ahụ ụrọ ahụ?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “otu ngwakọta ahụ” ma ọ bụ “otu ụrọ ahụ a chịkọtara ọnụ.”'
    reason: lexical_alternative
  - marker: c
    text: 'Ma ọ bụ: “otu arịa maka ojiji a na-asọpụrụ, nke ọzọ maka ojiji nkịtị.”'
    reason: alternative_reading
  - marker: d
    text: Ihe atụ a na-echetara anyị ebe Agba Ochie kwuru banyere onye ọkpụ ite na ụrọ, dịka Aịzaya 29:16; 45:9; na Jeremaya 18:1–6.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ka ọ bụ na
  rationale: Na-ewebata ajụjụ ọzọ Pọl ji aga n’ihu n’arụmụka ya, n’enweghị mgbakwunye nkwusi ike na-adịghị na Grik.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: enweghị ikike
  rationale: “Ikike” na-egosi ikike ziri ezi onye ahụ nwere, ọ bụghị naanị ike ime ihe.
- source_word: ὁ κεραμεὺς
  choice: ọkpụ ite
  rationale: Ọ bụ okwu Igbo doro anya maka onye na-eji ụrọ akpụ ite na arịa ndị ọzọ, ma na-edobekwa ihe atụ onye ọkpụ ite na ụrọ.
- source_word: τοῦ πηλοῦ
  choice: n’ahụ ụrọ ahụ
  rationale: N’Igbo, “inwe ikike n’ahụ” na-egosi mmekọrịta nke ịchị ma ọ bụ inwe ikike n’ebe ihe dị.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: iji otu ikpo ụrọ ahụ
  rationale: “Ikpo ụrọ” na-egosi otu ngwakọta ma ọ bụ otu ụrọ a chịkọtara ọnụ, dịka φύραμα si pụta n’ebe a.
- source_word: ποιῆσαι
  choice: kpụọ
  rationale: N’ihe atụ onye ọkpụ ite, “ịkpụ” bụ okwu Igbo kacha kwekọọ n’omume iji ụrọ mee arịa.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: otu ... nke ọzọ
  rationale: Na-egosipụta arịa abụọ dị iche e si n’otu ikpo ahụ kpụọ, n’ụzọ Igbo na-asụ nke ọma.
- source_word: εἰς τιμὴν
  choice: maka nsọpụrụ
  rationale: Na-echekwa okwu nsọpụrụ dị na τιμή n’akọwaghị ya ozugbo dị ka naanị ụdị ojiji.
- source_word: σκεῦος
  choice: arịa
  rationale: “Arịa” bụ okwu sara mbara ma kwekọọ n’ihe onye ọkpụ ite na-akpụ.
- source_word: εἰς ἀτιμίαν
  choice: maka enweghị nsọpụrụ
  rationale: Na-echekwa ntụnyere megidere “nsọpụrụ” n’enweghị ime ka ọ bụrụ naanị “ojiji nkịtị” ma ọ bụ ịkọwa ihe Pọl hapụrụ ghe oghe.
theological_decisions:
- issue: Ma a ga-asụgharị ἐξουσία dị ka ikike, ikike iwu kwadoro, ma ọ bụ ike ime ihe
  choice: ikike
  alternative: ike; ihe ruuru ya
  rationale: “Ikike” na-echekwa echiche nke ikike ziri ezi n’enweghị ibubata ozizi pụrụ iche banyere ọchịchị Chineke na nnwere onwe mmadụ.
- issue: Ma εἰς τιμὴν / εἰς ἀτιμίαν ọ̀ bụ ụdị ojiji kpọmkwem ma ọ bụ asụsụ nsọpụrụ na enweghị nsọpụrụ
  choice: maka nsọpụrụ ... maka enweghị nsọpụrụ
  alternative: maka ojiji a na-asọpụrụ ... maka ojiji nkịtị
  rationale: Grik kwuru kpọmkwem banyere nsọpụrụ na enweghị nsọpụrụ. Nhọrọ a na-ahapụ ihe atụ ahụ ka ọ ghe oghe ma ghara imechi ya n’ọrụ ụlọ naanị.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị nsọpụrụ. E ji “ọkpụ ite,” “ụrọ,” na “arịa” mee ka ihe atụ ahụ doo onye nkịtị anya; e chekwara ụdị ajụjụ nkwupụta dị na Grik na esemokwu nsọpụrụ/enweghị nsọpụrụ.
