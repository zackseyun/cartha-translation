id: ROM.9.4
reference: Romans 9:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: ig
  text: ndị bụ ụmụ Izrel, nkuchi ịbụ ụmụ, ebube, ọgbụgba ndụ dị iche iche, inye iwu, ofufe, na nkwa dị iche iche bụ nke ha.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịhazi ya: “ndị bụ ụmụ Izrel; nkuchi ịbụ ụmụ, ebube, ọgbụgba ndụ dị iche iche, inye iwu, ofufe, na nkwa dị iche iche bụ nke ha.”'
    reason: lexical_alternative
  - marker: b
    text: “Nkuchi ịbụ ụmụ” nwekwara ike ịbụ “ọnọdụ ịbụ ụmụ” ma ọ bụ “ịbụ ndị e kuchiri dị ka ụmụ.” N’ebe a, ọ na-ezo aka n’ọnọdụ Izrel dịka ndị Chineke kpọrọ ụmụ ya.
    reason: lexical_alternative
  - marker: c
    text: “Ebube” nwere ike ịpụta ọnụnọ Chineke nke mere ka a mata ya n’etiti Izrel.
    reason: cross_reference
  - marker: d
    text: Ya bụ, ofufe ma ọ bụ ọrụ a na-ejere Chineke n’usoro ọgbụgba ndụ Izrel.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: ndị bụ ụmụ Izrel
  rationale: Ọ na-aga n’ihu ịkọwa ndị ikwu Pọl a kpọrọ aha n’amaokwu bu ụzọ. “Ụmụ Izrel” bụ okwu Igbo dị mfe ma guzosie ike maka njirimara agbụrụ na akụkọ ọgbụgba ndụ a.
- source_word: ὧν
  choice: bụ nke ha
  rationale: Genitive relative pronoun a na-egosi na ihe ndị a bụ ihe ndị Izrel nwere; nhazi a bụ Igbo ebumpụta ụwa ma na-edebe echiche nke ihe ruuru ha.
- source_word: υἱοθεσία
  choice: nkuchi ịbụ ụmụ
  rationale: Ọ na-echekwa ihe atụ nke ịnabata ma dobe mmadụ n’ọnọdụ nwa, ma n’ebe a ọ na-ekwu maka ọnọdụ Izrel dị ka ndị Chineke kpọrọ ụmụ ya, ọ bụghị ịkọwa n’ụzọ zuru ezu nzọpụta nke onye ọbụla.
- source_word: δόξα
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo sara mbara nke na-edebe ịdị omimi nke okwu Grik; a kọwaghị ya n’ahịrị isi dị ka ọnụnọ Chineke pụtara ìhè, ọ bụ ezie na nke ahụ nwere ike ịbụ ihe a na-ezo aka na ya.
- source_word: διαθῆκαι
  choice: ọgbụgba ndụ dị iche iche
  rationale: A na-edebe plural Grik nke ọma; “dị iche iche” na-eme ka ọnụọgụ ọtụtụ pụta ìhè n’Igbo.
- source_word: νομοθεσία
  choice: inye iwu
  rationale: Okwu ahụ na-ezo aka n’omume nke inye iwu, ọ bụghị naanị n’iwu ahụ n’onwe ya.
- source_word: λατρεία
  choice: ofufe
  rationale: “Ofufe” na-egosi ọrụ ofufe a na-enye Chineke n’usoro ndụ ọgbụgba ndụ Izrel, n’enweghị imechi ya nanị n’ọrụ ụlọ nsọ ma ọ bụ nke ndị nchụàjà.
- source_word: ἐπαγγελίαι
  choice: nkwa dị iche iche
  rationale: A na-edebe plural Grik, na-ezo aka na nkwa Chineke dị iche iche e nyere Izrel.
theological_decisions:
- issue: Ihe υἱοθεσία pụtara gbasara Izrel
  choice: nkuchi ịbụ ụmụ
  alternative: ọnọdụ ịbụ ụmụ; ịbụ ndị e kuchiri dị ka ụmụ
  rationale: Ndepụta a bụ uru akụkọ ihe mere eme na nke ọgbụgba ndụ nke Izrel dịka otu ndị. Nsụgharị ahụ na-edebe ihe atụ nke nkuchi n’enweghị itinye nkọwa gbasara nzọpụta onye n’otu n’otu.
- issue: Ihe ἡ δόξα na-ezo aka na ya
  choice: ebube
  alternative: ebube Chineke; ọnụnọ ebube Chineke
  rationale: O yikarịrị ka ọ na-ezo aka n’ọnụnọ Chineke nke gosipụtara n’etiti Izrel, ma Grik kwuru naanị “ebube”; ya mere ahịrị isi na-edebe ohere na ịdị omimi ahụ.
- issue: Ókè echiche nke λατρεία
  choice: ofufe
  alternative: ọrụ ofufe; ọrụ ụlọ nsọ
  rationale: Ihe gbara ya gburugburu na-egosi ofufe Izrel a haziri n’okpuru ọgbụgba ndụ, ma okwu Grik n’onwe ya achọghị ka e mechie ya naanị n’ụlọ nsọ ma ọ bụ n’ọrụ ndị nchụàjà.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro ndepụta nke Grik na ọnụọgụ ọtụtụ nke “ọgbụgba ndụ” na “nkwa.” E tinyere akara ntụaka ụkwụ niile [a]–[d] n’ahịrị isi.
