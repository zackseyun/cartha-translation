source:
  edition: SBLGNT
  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: ig
  text: Ya mere, ị ga-asị m, “Gịnịzi mere ọ ka na-ata ụta? N’ihi na ònye guzogiderela nzube ya[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “uche ya” ma ọ bụ “ebumnobi ya.” Okwu Grik βούλημα nwere ike ịpụta uche, ebumnobi, ma ọ bụ nzube.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: ị ga-asị
  rationale: Oge ọdịnihu dị na Grik na-ewebata arụmụka Pọl tụrụ anya na mmadụ ga-ekwu; ‘ị ga-asị’ na-edobe ụdị okwu ahụ kama ime ya ajụjụ ozugbo.
- source_word: μοι
  choice: m
  rationale: 'A tụgharịrị dative indirect object ahụ n’ụzọ Igbo si ekwu ya nke ọma: ‘ị ga-asị m.’'
- source_word: οὖν ... οὖν
  choice: Ya mere ... kwa
  rationale: ‘Ya mere’ na-egosi nkwubi okwu nke mbụ, ebe ‘kwa’ dị n’ajụjụ ahụ na-ebuga ike nke οὖν nke abụọ n’Igbo eke.
- source_word: Τί ... ἔτι μέμφεται
  choice: Gịnịkwa mere ọ ka ji ata mmadụ ụta?
  rationale: N’usoro okwu a, τί pụtara ‘gịnị mere,’ ἔτι pụtara ‘ka,’ μέμφεται bụkwa ịta ụta. E tinyere ‘mmadụ’ dị ka ihe a na-ata ụta nke a ghọtara n’ọrụ ngwaa ahụ, n’ihi na nke a bụ usoro Igbo doro anya ma dị eke.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: nzube ya
  rationale: ‘Nzube’ na-egosi ebumnobi ma ọ bụ ihe e kpebiri ime, na-enweghị ịmanye nkọwa ozizi pụrụ iche n’ebe okwu Grik ahụ nwere obosara pụtara.
- source_word: τίς ἀνθέστηκεν
  choice: ònye guzogiderela
  rationale: ‘Guzogidere’ na-edobe echiche nke iguzo megide ma ọ bụ ịlụso ihe ọgụ; ‘-la’ na-enyere aka igosi perfect ahụ na mkpa ihe ahụ ka nwere ugbu a.
theological_decisions:
- issue: Nkọwa βούλημα n’okwu gbasara ọchịchị Chineke na ibu ọrụ mmadụ
  choice: nzube ya
  alternative: uche ya; ebumnobi ya; ihe o kpebiri
  rationale: ‘Nzube ya’ na-egosi ebumnobi siri ike ma na-ahapụ esemokwu dị n’amaokwu ahụ n’etiti ọchịchị Chineke na ajụjụ banyere ihe mere o ji ata mmadụ ụta. Ihe odide ahụ anaghị edozi esemokwu ahụ, ya mere nsụgharị ahụ ekwesịghị idozi ya n’ụzọ otu ozizi.
- issue: Onye nnọchiaha αὐτοῦ na μέμφεται na-ezo aka na ya
  choice: ọ ... ya
  alternative: Chineke ... Chineke
  rationale: E debere nnọchiaha ndị dị na Grik. Ihe gbara amaokwu ahụ gburugburu na-eme ka onye a na-ekwu maka ya doo anya, ma ịkpọ aha Chineke n’amaokwu a ga-abụ ịgbakwunye ihe na-adịghị n’ahịrị Grik ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. A họọrọ ‘ata mmadụ ụta’ maka okwu Igbo eke, ‘guzogiderela’ maka ajụjụ nkwuwa okwu ahụ, ma debe nnọchiaha ndị ahụ ka nsụgharị ghara ịgbakwunye nkọwa ozizi.
