  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: ig
  text: Gịnịzi ka anyị ga-ekwu? Ọ̀ bụ na e nwere ikpe na-ezighị ezi n’ebe Chineke nọ?[a] Mba, ọ dịghị ma ọlị![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ajọ omume.”'
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik: “Ka ọ ghara ịdị!” Nke a bụ ngọnarị siri ike nke ukwuu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Gịnịzi ka anyị ga-ekwu?
  rationale: Nke a na-edobe usoro ajụjụ Pọl ji ebute nkwubi okwu ma ọ bụ mmegide a pụrụ ịjụ; ọ bụkwa Igbo nkịtị ma doo anya.
- source_word: μὴ
  choice: Ọ̀ bụ na e nwere
  rationale: μή na-egosi ajụjụ a na-atụ anya azịza na-adịghị mma; usoro ajụjụ a na Igbo na-echekwa ọdịdị arụmụka ahụ n’enweghị ntụgharị siri ike.
- source_word: ἀδικία
  choice: ikpe na-ezighị ezi
  rationale: N’ebe a okwu ahụ metụtara omume na-ekwesịghị ekwesị ma ọ bụ enweghị ikpe ziri ezi; nhọrọ a doro ndị na-agụ Igbo nke oge a anya. ‘Ajọ omume’ ma ọ bụ ‘emeghị ezi omume’ nwere ike ịbụ ụzọ ọzọ, ma ha anaghị egosipụta akụkụ ikpe ziri ezi nke ọma otú a.
- source_word: παρὰ τῷ θεῷ
  choice: n’ebe Chineke nọ
  rationale: Nke a bụ ụzọ Igbo si ekwu ihe dị ‘n’aka Chineke’ ma ọ bụ ‘n’akụkụ Chineke,’ n’enweghị ịgbakwụnye nkọwa na-adịghị na Grik.
- source_word: μὴ γένοιτο
  choice: Mba, ọ dịghị ma ọlị!
  rationale: Ọ na-egosipụta ngọnarị siri ike Pọl kwuru n’asụsụ Igbo dị ndụ ma dị ùgwù; ntụgharị nkịtị karịa ga-abụ ‘Ka ọ ghara ịdị!’
theological_decisions:
- issue: Ma a ga-akọwa ajụjụ ahụ dị ka nkwupụta banyere usoro ozizi ụfọdụ gbasara nhọpụta Chineke.
  choice: E debere ya dịka ajụjụ banyere ma ikpe na-ezighị ezi ọ̀ dị n’ebe Chineke nọ, soro ngọnarị siri ike.
  alternative: A pụrụ ịsụgharị ya n’ụzọ nkọwa karịa, ‘Chineke ọ̀ na-ekpe ikpe na-ezighị ezi?’
  rationale: Grik ahụ kwuru mmegide ahụ na ngọnarị ya nkenke. Nsụgharị a anaghị atụkwasị nkọwa gbasara nhọpụta, ịjụ mmadụ, ma ọ bụ usoro ozizi ọ bụla.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji ‘Gịnịzi’ chekwaa njikọ οὖν, jiri ajụjụ arụmụka gosipụta μή, ma zere ịgbakwụnye nkọwa ozizi na-adịghị n’amaokwu ahụ.
