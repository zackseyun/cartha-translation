id: ROM.9.2
reference: Romans 9:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι λύπη μοί ἐστιν μεγάλη καὶ ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/002.yaml
  text: that I have great sorrow and unceasing pain in my heart[a][b][c].
translation:
  language: ig
  text: na enwere m nnukwu mwute[a] na ihe mgbu[b] na-adịghị akwụsị akwụsị n’obi m.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘iru újú’ kama ‘mwute.’
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya ‘oke ahụhụ’ kama ‘ihe mgbu.’
    reason: lexical_alternative
  - marker: c
    text: N’asụsụ Grik, okwu ahụ bụ kpọmkwem ‘nye obi m,’ ma ‘n’obi m’ bụ ụzọ e si ekwu ya nke ọma n’Igbo.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ihe Pọl kwusiri ike n’amaokwu bu ụzọ; ‘na’ bụ ụzọ Igbo si ejikọta nkwupụta ahụ n'ụzọ nkịtị.
- source_word: λύπη
  choice: mwute
  rationale: ‘Mwute’ na-egosi nnukwu iru újú ma ọ bụ obi mgbawa n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: μοί ἐστιν
  choice: enwere m
  rationale: Ụdị dative ya na εἰμί na-egosi ihe mmadụ nwere ma ọ bụ na-enwe; ‘enwere m’ bụ nsụgharị Igbo ebumpụta ụwa.
- source_word: μεγάλη
  choice: nnukwu
  rationale: ‘Nnukwu’ na-echekwa ike okwu ahụ ma soro ‘mwute’ na-aga nke ọma.
- source_word: καὶ
  choice: na
  rationale: Ọ na-ejikọta nkọwa abụọ banyere ahụhụ ime mmụọ Pọl.
- source_word: ἀδιάλειπτος
  choice: na-adịghị akwụsị akwụsị
  rationale: Nkebiokwu a na-egosi ihe na-aga n’ihu mgbe niile, na-echekwakwa ike nke okwu Grik ahụ.
- source_word: ὀδύνη
  choice: ihe mgbu
  rationale: ‘Ihe mgbu’ na-egosi ahụhụ siri ike nke dị n’ime mmadụ n'ụzọ doro anya; ‘oke ihe mgbu n’obi’ bụkwa echiche ọzọ kwere omume.
- source_word: τῇ καρδίᾳ μου
  choice: n’obi m
  rationale: ‘N’obi m’ bụ akpaalaokwu Igbo ebumpụta ụwa maka ebe mmetụta ime mmadụ dị, ma ọ ka na-echekwa ihe oyiyi nke ‘obi.’
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ugwu. E debere amaokwu ahụ dịka nkebiokwu na-aga n’ihu site n’amaokwu bu ụzọ, n’ihi ọrụ ὅτι.
