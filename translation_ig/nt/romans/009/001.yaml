source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: ig
  text: Ana m ekwu eziokwu n'ime Mesaịa[a]; anaghị m agha ụgha, ebe akọnuche m sokwa m na-agba akaebe[b] n'ime Mmụọ Nsọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime Kraịst.” Okwu Grik bụ Χριστός; ọ pụrụ ịrụ ọrụ dị ka aha-ọkwa, “Mesaịa,” ma ọ bụ dị ka aha e ji akpọ ya, “Kraịst.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ebe akọnuche m na-esokwa m agba akaebe” ma ọ bụ “akọnuche m sokwa m na-agba akaebe.”
    reason: lexical_alternative
  - marker: c
    text: Ma eleghị anya, “n'ime mmụọ dị nsọ”; ma n'ojiji Pọl, o yikarịrị ka nke a na-ezo aka na Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Ana m ekwu eziokwu
  rationale: Nkebiokwu Grik a bụ ụzọ e si ekwu na mmadụ na-ekwu ihe bụ eziokwu. Nsụgharị a bụ Igbo dị ugbu a ma na-echekwa nkwupụta Pọl siri ike.
- source_word: ἐν Χριστῷ
  choice: n'ime Mesaịa
  rationale: Χριστός bụ aha-ọkwa nke pụtara Onye E Tere Mmanụ. “Mesaịa” na-echekwa ọrụ ya dị ka aha-ọkwa, ebe “n'ime” na-edebe ἐν n'enweghị ịkọwa ya gabiga ihe odide ahụ kwuru.
- source_word: οὐ ψεύδομαι
  choice: anaghị m agha ụgha
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ekwupụta nkwụsi ike na onye ahụ adịghị ekwu okwu ụgha.
- source_word: συμμαρτυρούσης μοι
  choice: na-esokwa m agba akaebe
  rationale: “Na-esokwa m” na-echekwa echiche dị na nganiihu συμ-, ya bụ ịgba akaebe ọnụ ma ọ bụ iso onye ọzọ gbaa akaebe, ebe usoro ahịrịokwu ahụ na-egosi ọnọdụ na-eso nkwupụta Pọl.
- source_word: τῆς συνειδήσεώς μου
  choice: Akọnuche m
  rationale: “Akọnuche” bụ okwu Igbo a na-ejikarị akọwa ikike ime mmadụ nke na-ama ya ikpe ma ọ bụ na-akwado ya; “m” na-egosipụta μου.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: n'ime Mmụọ Nsọ
  rationale: N'okwu Pọl, nkebiokwu a na-ezokarị aka na Mmụọ Nsọ. “N'ime” na-echekwa ἐν kama ime ka ọ bụrụ naanị ihe e ji mee omume ahụ.
theological_decisions:
- issue: Ihe πνεύματι ἁγίῳ na-ezo aka na ya
  choice: Mmụọ Nsọ, ya bụ Mmụọ Chineke
  alternative: mmụọ dị nsọ, ma ọ bụ mmụọ Pọl nke e doro nsọ
  rationale: Ojiji Pọl na ọnọdụ nkwupụta a na-eme ka “Mmụọ Nsọ” bụrụ nghọta kacha kwekọọ n'ederede; e debere “n'ime” ka a ghara imechi ụzọ niile e nwere isi ghọta ọrụ Mmụọ ahụ.
- issue: Ọrụ Χριστός n'ahịrịokwu a
  choice: Aha-ọkwa “Mesaịa”
  alternative: Aha a na-akpọkarị ya, “Kraịst”
  rationale: Χριστός nwere ike ịrụ ọrụ dị ka aha-ọkwa ma ọ bụ dị ka aha e ji amata Jizọs. “Mesaịa” na-eme ka echiche Onye E Tere Mmanụ pụta ìhè, ebe ndetu ala na-echekwa nsụgharị ọdịnala “Kraịst.”
translation_notes:
  register: Ejiri Standard Igbo nke dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu abụọ dị mkpirikpi na-eme ka nkwupụta Pọl siri ike doo anya. E debere okwu nkà mmụta okpukpe ndị a maara nke ọma—Mesaịa, akọnuche, na Mmụọ Nsọ—ma tinye ụzọ nsụgharị ndị ọzọ na ndetu ala iji chekwaa mgbagwoju anya dị n'asụsụ Grik.
