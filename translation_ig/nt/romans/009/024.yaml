  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: ig
  text: anyị[a], ndị ọ kpọkwara, ọ bụghị naanị site n’etiti ndị Juu, kamakwa site n’etiti ndị mba ọzọ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, a pụrụ ịsụ ya n’ụzọ ka ya nso: “ndị ọ kpọkwara, ya bụ anyị.” Pọl na-akọwa na ndị e mere ebere a kpọtụrụ aha na mbụ bụ “anyị.”'
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, ọ bụ “mba dị iche iche”; n’ebe a, Pọl na-atụnyere ndị Juu na ndị na-abụghị ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: ya bụ anyị, ndị
  rationale: Nkebi a na-akọwapụta na ndị e kwuru okwu ha n’amaokwu gara aga bụ “anyị.” Usoro a na-ejigide njikọ nke nnọchiaha οὓς na nkọwa ἡμᾶς ma na-ada nke ọma n’Igbo.
- source_word: καὶ ἐκάλεσεν
  choice: ọ kpọkwara
  rationale: “Kpọọ” bụ okwu Igbo doro anya maka καλέω, ebe mgbakwunye “-kwa” na-egosi ike mgbakwunye nke καί.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: ọ bụghị naanị ... kama ... kwa
  rationale: Nke a bụ usoro Igbo ebumpụta ụwa nke na-echekwa nhazi ntụnyere na mgbakwunye dị n’asụsụ Grik.
- source_word: ἐξ Ἰουδαίων
  choice: site n’etiti ndị Juu
  rationale: ἐξ na-egosi isi n’otu ìgwè pụta; “site n’etiti” na-eme ka nke ahụ doo anya ma ghara ịpụta na Chineke kpọrọ ìgwè ahụ dum.
- source_word: ἐξ ἐθνῶν
  choice: sitekwa n’etiti ndị mba ọzọ
  rationale: N’ebe a ἐθνῶν na-emegide ndị Juu, ya mere “ndị mba ọzọ” na-egosi ndị na-abụghị ndị Juu n’ụzọ ndị na-agụ Igbo ga-aghọta.
theological_decisions:
- issue: Ijigide njikọ ya na ‘ihe e ji eme ebere’ ndị a kpọtụrụ aha n’amaokwu gara aga
  choice: ya bụ anyị, ndị ọ kpọkwara
  alternative: anyị ndị ọ kpọkwara
  rationale: Nhọrọ a na-eme ka o doo anya na Pọl na-akọwa ndị ahụ dị ka “anyị,” ma ọ naghị akọwa karịa ihe ederede kwuru banyere nhọpụta na ọkpụkpọ.
- issue: Ntụnyere ndị Juu na ἐθνῶν
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: N’ọnọdụ a, okwu ahụ na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ, ọ bụghị naanị mba dị ka mpaghara ọchịchị. Nsụgharị a na-echekwa ntụnyere akụkọ nzọpụta ahụ n’etinyeghị ozizi otu ụka.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta. “Ndị Juu” na “ndị mba ọzọ” bụ aha ìgwè ndị mmadụ a na-aghọta nke ọma. A hapụrụ akara ogologo n’ọgwụgwụ iji gosi na ahịrịokwu na-aga n’ihu n’amaokwu na-esote.
