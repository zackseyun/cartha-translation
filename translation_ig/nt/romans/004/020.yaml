source:
  edition: SBLGNT
  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: ig
  text: Ma n’ihe banyere nkwa Chineke, o meghị obi abụọ n’ihi ekweghị ekwe,[a] kama e mere ka o sie ike n’okwukwe,[b] na-enye Chineke otuto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ekweghị ekwe emeghị ka ọ maa jijiji.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e mere ka o sie ike site n’okwukwe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Ma n’ihe banyere nkwa Chineke
  rationale: εἰς na accusative ebe a pụtara ‘n’ihe banyere,’ ọ bụghị ngagharị; δέ na-egosi ọdịiche dị nro, ebe ‘nkwa Chineke’ na-edobe onye nwe nkwa ahụ nke ọma.
- source_word: οὐ διεκρίθη
  choice: ọ malaghị azụ
  rationale: διακρίνω n’ebe a na-egosi ịma jijiji ma ọ bụ ịla azụ n’obi. ‘Ọ malaghị azụ’ bụ Igbo dị ndụ nke na-edobe echiche ahụ karịa ime ka ọ bụrụ naanị obi abụọ nke uche.
- source_word: τῇ ἀπιστίᾳ
  choice: n’ekweghị ekwe
  rationale: Dative ahụ nwere ike igosi ọnọdụ ma ọ bụ ụzọ. ‘N’ekweghị ekwe’ na-edobe myirịta na ọdịiche ya na ‘n’okwukwe.’
- source_word: ἀλλὰ ἐνεδυναμώθη
  choice: kama e mere ka o sie ike
  rationale: A na-edobe passive nke ἐνεδυναμώθη n’ụzọ doro anya, n’etinyeghị onye mere ka o sie ike ebe Grik akpọghị ya aha.
- source_word: τῇ πίστει
  choice: n’okwukwe
  rationale: Nke a na-edobe dative dị ka ọnọdụ ma na-emekwa ka ọdịiche ya na ‘n’ekweghị ekwe’ pụta ìhè; a naghị ewepụkwa ohere ịghọta ya dị ka ụzọ e si mee ka o sie ike.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: na-enye Chineke otuto
  rationale: Ụdị participle a na-egosi omume nke na-eso ma ọ bụ na-eso ọnọdụ ahụ ọnụ, ma na-edobe usoro okwu Grik n’Igbo eke.
theological_decisions:
- issue: Ma διεκρίθη ọ̀ bụ naanị inwe obi abụọ n’uche ka ọ bụ ịma jijiji ma laa azụ n’okwukwe
  choice: ọ malaghị azụ n’ekweghị ekwe
  alternative: o nweghị obi abụọ n’ihi ekweghị ekwe
  rationale: Nhọrọ mbụ sara mbara ma kwekọọ na ọdịiche dị n’etiti ịla azụ na ime ka o sie ike n’okwukwe; ọ naghị ebelata okwu ahụ ka ọ bụrụ naanị ajụjụ nke uche.
- issue: Ma τῇ πίστει ọ̀ pụtara ọnọdụ (‘n’okwukwe’) ka ọ bụ ụzọ (‘site n’okwukwe’)
  choice: n’okwukwe
  alternative: site n’okwukwe
  rationale: ‘N’okwukwe’ na-edobe myirịta ya na τῇ ἀπιστίᾳ ma hapụ esemokwu nkọwa ahụ ka ọ dị, ebe e nyere nhọrọ nke ọzọ n’akwụkwọ nkọwa.
- issue: Onye mere ka Abraham sie ike
  choice: e mere ka o sie ike
  alternative: Chineke mere ka o sie ike
  rationale: Grik jiri passive ma akpọghị onye mere ya aha. Nsụgharị ahụ anaghị etinye aha Chineke n’ọrụ ahụ n’agbanyeghị na gburugburu okwu nwere ike ime ka onye na-agụ ya ghọta ya otú ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, kwụ ọtọ ma nwee ugwu. E jiri ‘malaghị azụ’ gosipụta ịma jijiji n’obi n’ụzọ ndị nkịtị ga-aghọta; e chekwara passive na mgbagwoju anya nke dative abụọ ahụ site na ederede na nkọwa ala peeji.
