    text: Ma ọ bụ, “a gụpụtara nke a nye ya dị ka ezi omume,” ma ọ bụ, “a kwadoro nke a nye ya dị ka ezi omume.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị ka ikpe ziri ezi.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the interrogative opening, improves the passive construction for ἐλογίσθη, and retains “nke a” (“this”) rather than supplying a doctrinally expanded noun. It preserves the source’s connection between Abraham’s believing God and the reckoning to him as righteousness.
