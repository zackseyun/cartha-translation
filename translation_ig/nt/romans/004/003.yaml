review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders the principal terms: γραφή as “Akwụkwọ Nsọ,” πιστεύω with a dative as “kweere Chineke,” and δικαιοσύνη as “ezi omume.” However, “N’ihi na gịnị” does not accurately or naturally convey τί γὰρ (“For what/Why, then?”), and “e wee gụọrọ ya nke ahụ” has an awkward construction and less clearly preserves the passive reckoning of the Greek.'
  naturalness: '“N’ihi gịnị ka Akwụkwọ Nsọ na-ekwu?” is idiomatic Standard Igbo. “A gụrụ nke a nye ya dị ka ezi omume” is a clearer, natural passive expression: “this was counted to him as righteousness.”'
  terminology: “Akwụkwọ Nsọ,” “kweere Chineke,” and “ezi omume” are appropriate in a modern, elevated Standard Igbo biblical register. The alternative “ikpe ziri ezi” may be retained as a narrowly lexical footnote for “justice,” without making it the main Pauline rendering.
  issues:
  - severity: medium
    issue: Opening phrase “N’ihi na gịnị ka”
    rationale: The phrase is unidiomatic and introduces “na” (“that/because”) where the Greek τί γὰρ is better represented by “N’ihi gịnị ka” (“For what/Why, then?”).
  - severity: medium
    issue: “e wee gụọrọ ya nke ahụ”
    rationale: The word order is awkward, and “gụọrọ ya” can sound like an action done on Abraham’s behalf rather than the passive statement that Abraham’s belief was counted to him. Recasting it as “A gụrụ nke a nye ya...” preserves the passive and the referential ambiguity of the Greek pronoun.
  revised_text: N’ihi gịnị ka Akwụkwọ Nsọ na-ekwu? “Ebreham kweere Chineke, a gụrụ nke a nye ya dị ka ezi omume[a][b].”
  revised_footnotes:
