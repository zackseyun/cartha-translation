source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: ig
  text: N’ihi gịnị ka Akwụkwọ Nsọ na-ekwu? “Ebreham kweere Chineke, a gụrụ nke a nye ya dị ka ezi omume[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a gụpụtara nke a nye ya dị ka ezi omume,” ma ọ bụ, “a kwadoro nke a nye ya dị ka ezi omume.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “dị ka ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: Akwụkwọ Nsọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ihe e dere n’Akwụkwọ Nsọ, ọ bụghị naanị ihe odide nkịtị.
- source_word: Ἐπίστευσεν
  choice: kweere
  rationale: “Kweere” na-egosi na Ebreham nabatara okwu Chineke dị ka eziokwu, n’enweghị ịgbakwụnye nkọwa karịrị nke dị na Grik.
- source_word: τῷ θεῷ
  choice: Chineke
  rationale: E ji ihe nnata na-eso πιστεύω mee ihe, ya mere “kweere Chineke” na-egosi n’ụzọ ziri ezi na Ebreham kweere ihe Chineke kwuru; a zere ịtụgharị ya ka ọ bụrụ naanị “nwere okwukwe n’ime Chineke.”
- source_word: ἐλογίσθη
  choice: e wee gụọrọ ya
  rationale: Nke a na-echekwa olu nnabata nke ngwaa Grik ma na-egosi na e weere ihe ahụ nye Ebreham dịka ihe e kwuru banyere ya.
- source_word: εἰς δικαιοσύνην
  choice: dị ka ezi omume
  rationale: “Ezi omume” bụ ụzọ doro anya ma bụrụkwa nke ndị na-agụ Igbo maara nke ọma isi kwupụta δικαιοσύνη n’ebe a, ebe “ikpe ziri ezi” ka edobere n’ala ala peeji dịka nhọrọ okwu ọzọ.
theological_decisions:
- issue: Otú e si sụgharị δικαιοσύνη n’okwu Pọl banyere ịgụ mmadụ n’onye ezi omume
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: “Ezi omume” na-edobe obosara echiche okwu Pọl n’enweghị ịmachi ya naanị n’omume mmadụ ma ọ bụ naanị n’ikpe ụlọikpe; “ikpe ziri ezi” ka e nyere dịka nhọrọ okwu ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, mee ihe. “Nke ahụ” na-anọchi ihe a kpọtụrụ aha—Ebreham ikwere Chineke—ma na-eme ka njikọ ahịrịokwu ahụ doo anya n’Igbo n’enweghị idozi ihe omimi nkà mmụta okpukpe karịa isi mmalite ahụ.
