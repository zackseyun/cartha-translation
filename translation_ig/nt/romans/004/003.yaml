revisions:
- from: N’ihi na gịnị ka Akwụkwọ Nsọ na-ekwu? “Ebreham kweere Chineke, e wee gụọrọ ya nke ahụ dị ka ezi omume[a][b].”
  to: N’ihi gịnị ka Akwụkwọ Nsọ na-ekwu? “Ebreham kweere Chineke, a gụrụ nke a nye ya dị ka ezi omume[a][b].”
  rationale: The revision corrects the interrogative opening, improves the passive construction for ἐλογίσθη, and retains “nke a” (“this”) rather than supplying a doctrinally expanded noun. It preserves the source’s connection between Abraham’s believing God and the reckoning to him as righteousness.
  reviewer_model: gpt-5.6-terra
