  rationale: Removed the unsupported specification “n’aka ndị iro”; replaced “njehie” with “mmejọ” to represent moral trespasses more faithfully; retained passive verbal forms; and adjusted the justification expression and alternate footnote to be natural in Standard Igbo while preserving the grammatical ambiguity of διὰ τὴν δικαίωσιν ἡμῶν.
  reviewer_model: gpt-5.6-terra
