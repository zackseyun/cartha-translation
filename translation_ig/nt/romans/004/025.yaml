  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: ig
  text: onye e nyefere n’ihi mmejọ anyị, kpọlitekwa ya ka e wee gụọ anyị dị ka ndị ezi omume.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “n’ihi ịgụ anyị dị ka ndị ezi omume.”
    reason: alternative_reading
  - marker: b
    text: “Ịgụ anyị dị ka ndị ezi omume” pụkwara ịpụta ịkpọpụ anyị n’ikpe ma ọ bụ ikwupụta na anyị bụ ndị ezi omume.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: e nyefere n’aka ndị iro
  rationale: Ụdị a na-edobe olu nnara nke Grik ma na-egosi n’Igbo n’ụzọ doro anya na e tinyere ya n’aka ndị ga-egbu ya; onye mere ya ka na-anọghị n’aha, dịka o si dị na Grik.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: n’ihi njehie anyị
  rationale: διά ya na accusative ebe a na-egosi ihe kpatara ya. ‘Njehie’ na-egosi mmebi iwu na omume ọjọọ, ọ bụghị naanị mmejọ e mere n’amaghị ama.
- source_word: παραπτώματα
  choice: njehie
  rationale: Okwu a bụ Igbo dị mfe nghọta nke na-ezo aka n’ihe mmadụ mere megide ihe ziri ezi; a zere ịgbasa ya gaa n’ozuzu okwu ‘mmehie’ ebe okwu Grik nwere ndò nke ịda n’ụzọ ma ọ bụ imebi iwu.
- source_word: ἠγέρθη
  choice: kpọlitekwara ya n’ọnwụ
  rationale: Nke a na-egosipụta olu nnara na mbilite n’ọnwụ n’Igbo nkịtị, ma na-ahapụ onye kpọlitere ya n’enweghị aha dịka Grik si mee.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: ka e wee gụọ anyị ná ndị ezi omume
  rationale: A tụgharịrị διά n’echiche ebumnuche/ụta ga-esi na ya pụta, ebe δικαίωσις gosiri mkpebi ikpe nke ịgụ mmadụ n’onye ezi omume. A na-edobe nkọwa nke ihe kpatara ya n’ala peeji.
- source_word: δικαίωσιν
  choice: ịgụ anyị ná ndị ezi omume
  rationale: Nke a na-enye ndị na-agụ Igbo nghọta banyere ọnọdụ ikpe nke okwu ahụ—mkpebi na mmadụ bụ onye ezi omume—karịa iji naanị aha teknụzụ nke nwere ike ghara ido anya.
theological_decisions:
- issue: Ma διὰ τὴν δικαίωσιν ἡμῶν ọ pụtara ebumnuche/ụta (‘ka e wee gụọ anyị ná ndị ezi omume’) ka ọ bụ ihe kpatara ya (‘n’ihi na a gụọla anyị ná ndị ezi omume’).
  choice: ka e wee gụọ anyị ná ndị ezi omume
  alternative: n’ihi na a gụọla anyị ná ndị ezi omume
  rationale: Ọgụgụ bụ isi na-edobe nghọta a na-ahụkarị na mbilite Kraịst jikọrọ ya na ime ka a gụọ ndị kwere ekwe ná ndị ezi omume. Ma διά ya na accusative nwekwara ike ịpụta ihe kpatara ya, ya mere e debere nke ahụ n’ala peeji kama ikpochapụ mgbagwoju okwu Grik.
translation_notes:
  register: Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ahịrịokwu ọnụ kọwaa δικαίωσις iji chekwaa echiche ikpe ya n’enweghị okwu ụka teknụzụ na-agaghị edo ọtụtụ ndị anya.
