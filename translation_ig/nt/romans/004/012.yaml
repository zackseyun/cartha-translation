id: ROM.4.12
reference: Romans 4:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: ig
  text: ọ bụkwa nna ndị e biri úgwù[a]—ndị ọ bụghị naanị na e biri ha úgwù[b], kama bụkwa ndị na-agbaso nzọụkwụ[c] nke okwukwe nna anyị Ebreham nwere mgbe a na-ebibeghị ya úgwù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị karị: “nna nke ibi úgwù.”'
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị: “ndị na-esiteghị naanị n’ibi úgwù.”'
    reason: lexical_alternative
  - marker: c
    text: 'Ma ọ bụ: “na-esokwa akara ụkwụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: nna ndị e biri úgwù
  rationale: Nke a na-egosi n’Igbo nkịtị na Ebreham bụ nna nke ìgwè ndị e biri úgwù, ọ bụghị nna nke emume ahụ n’onwe ya. E tinyere nsụgharị nkịtị karị na nkọwa ala peeji.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: ndị ọ bụghị naanị na e biri ha úgwù
  rationale: Ọ na-egosipụta n'ụzọ doro anya na ibi úgwù n’anụ ahụ naanị ezughị; okwu na-esote na-akọwa ndị ahụ dịka ndị na-agbaso okwukwe Ebreham.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: na-agbasokwa nzọụkwụ
  rationale: Nke a na-echekwa ihe atụ Grik nke ịga n’ụzọ akara ụkwụ onye ọzọ ma bụrụkwa okwu Igbo dị mfe nghọta maka iṅomi ụzọ ndụ ya.
- source_word: πίστεως
  choice: okwukwe
  rationale: N’ebe a, okwu ahụ na-ekwu maka ntụkwasị obi Ebreham nwere n’ebe Chineke nọ; “okwukwe” dabara n’arụmụka Pọl ma ghara ịtụgharị ya ka ọ bụrụ nanị ikwesị ntụkwasị obi.
- source_word: ἐν ἀκροβυστίᾳ
  choice: mgbe a na-ebibeghị ya úgwù
  rationale: Nsụgharị a na-egosi ọnọdụ na oge Ebreham nwere okwukwe ahụ tupu e bie ya úgwù, n’Igbo dị ndụ ma doo anya.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: nna anyị Ebreham nwere
  rationale: A kọwara njikọ genitiv ahụ n’ụzọ Igbo nkịtị, ebe a ka chekwara aha nsọpụrụ dị mkpa, “nna anyị Ebreham.”
theological_decisions:
- issue: Ma Ebreham bụ nna ndị niile e biri úgwù n’enweghị ihe ọzọ a chọrọ, ka ọ bụ nna ndị e biri úgwù bụ́ ndị na-agbasokwa okwukwe ya
  choice: E mere ka nkebi ahịrịokwu ahụ kọwaa ndị e biri úgwù bụ́ ndị ọ bụghị naanị na e biri ha úgwù, kama ha na-agbasokwa nzọụkwụ okwukwe Ebreham.
  alternative: Ịsị na Ebreham bụ nna ndị niile e biri úgwù n’enweghị ihe ọzọ na-akọwa ha.
  rationale: Usoro Grik οὐκ ... μόνον ἀλλὰ καὶ na-ejikọta ibi úgwù na ịgbaso nzọụkwụ okwukwe Ebreham dịka ihe e ji amata ìgwè a. Nsụgharị ahụ na-echekwa mmachi a n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “nna ndị e biri úgwù” kama okwu nkịtị ma sie ike “nna nke ibi úgwù,” ma e debere ọdịiche ahụ na nkọwa ala peeji. Ahịrịokwu ahụ ka bụ akụkụ na-aga n’ihu site n’amaokwu bu ya ụzọ, dịka ọ dị na Grik.
