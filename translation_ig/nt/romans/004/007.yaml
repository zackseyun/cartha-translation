  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: ig
  text: Ngọzi na-adịrị ndị a gbagharala omume mmebi iwu ha, ndị a kpuchiri mmehie ha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μακάριοι
  choice: Ngọzi na-adịrị ndị
  rationale: Nke a na-egosipụta nkwupụta banyere ọnọdụ ngọzi sitere n’aka Chineke, kama ịbụ nanị mmetụta obi ụtọ.
- source_word: ἀφέθησαν
  choice: a gbagharala
  rationale: Ọ na-egosi na a gbagharala ha mmebi iwu, ma na nsonaazụ mgbaghara ahụ ka dị; usoro a bụkwa Igbo nkịtị.
- source_word: ἀνομίαι
  choice: omume mmebi iwu
  rationale: Ọ na-edobe echiche nke imegide ma ọ bụ imebi iwu, ma bụrụ okwu ndị mmadụ nke oge a ga-aghọta ngwa ngwa.
- source_word: ἐπεκαλύφθησαν
  choice: e kpuchikwara
  rationale: Ọ na-edobe ihe atụ nke ikpuchi dị n’akwụkwọ e hotara, kama ịkọwa ya dịka iwepụ ma ọ bụ izochi.
- source_word: ἁμαρτίαι
  choice: mmehie
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa okwu a na-ejikarị akọwa ἁμαρτία.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ἀνομίαι na ἁμαρτίαι
  choice: 'Ịsụgharị ha n’okwu abụọ metụtara ibe ha ma dị iche: “omume mmebi iwu” na “mmehie”'
  alternative: Ịsụgharị ha abụọ naanị dịka “mmehie”
  rationale: Nke a na-echekwa ndakọrịta uri ahụ na ọdịiche okwu dị n’ederede, n’etinyeghị ọdịiche nkà mmụta okpukpe siri ike karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma doo ndị nkịtị anya. E ji “Ngọzi na-adịrị” chekwaa ụda nkwupụta nke Μακάριοι; e dekwara nkebi abụọ ahụ n’usoro uri yiri ibe ha.
