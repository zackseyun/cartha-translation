    text: Ma ọ bụ, “e dekọrọ ya n’akaụntụ” ma ọ bụ “e weere ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikpe nkwụmọtọ.”
    reason: lexical_alternative
  revision_rationale: The revision restores a natural Igbo expression for the Greek passive accounting idiom while preserving its ambiguity and avoiding doctrinal expansion. The footnotes offer genuine lexical alternatives and retain correctly anchored markers.
