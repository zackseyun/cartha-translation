  yaml_path: translation/nt/romans/004/022.yaml
  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: ig
  text: N’ihi nke a, e gụtara ya dị ka ezi omume.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e dekọrọ ya n’akaụntụ” ma ọ bụ “e weere ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ikpe nkwụmọtọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a, ma na-eme ka njikọ echiche ahụ doo anya n’Igbo.
- source_word: ἐλογίσθη
  choice: a gụrụ ya
  rationale: Ọ na-edobe usoro nnara nke okwu Grik na ihe atụ nke ịgụ ihe n’akwụkwọ ma ọ bụ ịtụ ya n’aka mmadụ, nke dị mkpa n’arụmụka Ndị Rom 4.
- source_word: αὐτῷ
  choice: nye ya
  rationale: Nke a na-egosipụta dative Grik n’ụzọ Igbo nkịtị ma na-ezo aka n’Abraham n’enweghị mgbasawanye.
- source_word: εἰς
  choice: dị ka
  rationale: N’usoro okwu a, ọ na-egosi ihe e weere okwukwe ahụ ịbụ ma ọ bụ ọnọdụ e nyere ya; “dị ka” bụ Igbo doro anya nke na-adịghị agbakwunye nkọwa ọzọ.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: “Ezi omume” bụ ụzọ Igbo a na-aghọta nke ọma isi kwuo δικαιοσύνη n’ọnọdụ Pọl a, ebe ihe ọzọ okwu ahụ pụrụ ịpụta ka edobere n’okpuru peeji.
theological_decisions:
- issue: Ichekwa ihe atụ Pọl nke ịgụnye ma ọ bụ idebanye ihe n’aha mmadụ n’etinyeghị ozizi ọzọ n’amaokwu ahụ
  choice: a gụrụ ya nye ya dị ka ezi omume
  alternative: e tinyere ya n’akaụntụ ya dị ka ezi omume; e weere ya dị ka ezi omume
  rationale: Nhọrọ a na-edobe ụdị nnara na ihe atụ nke λογίζομαι, ma ọ naghị akọwa karịa ihe Grik kwuru ma ọ bụ kpebie esemokwu nkà mmụta okpukpe gbasara otú ngụkọta ahụ si arụ ọrụ.
translation_notes:
  register: Asụsụ Igbo Izugbe, dị ùgwù ma dị mfe nghọta. E ji “a gụrụ ya nye ya” chekwaa okwu ngụkọta Pọl; a hapụrụ ụzọ okwu ndị ọzọ n’okpuru peeji. Ihe nrịba ama [a] na [b] dị n’ederede isi.
