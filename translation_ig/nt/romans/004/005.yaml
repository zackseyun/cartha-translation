id: ROM.4.5
reference: Romans 4:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: ig
  text: Ma onye na-adịghị arụ ọrụ, kama na-ekwere n’Onye na-agụ onye na-adịghị asọpụrụ Chineke dịka onye ezi omume[b], a na-agụ[c] okwukwe ya dịka ezi omume[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “na-ekwupụta na ọ bụ onye ezi omume.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a na-etinye n’akaụntụ ya” ma ọ bụ “a na-ewere.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “ịdị n’ezi omume”; n’ebe ụfọdụ n’akwụkwọ Pọl, δικαιοσύνη pụkwara ịpụta “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: onye na-adịghị arụ ọrụ
  rationale: Nke a na-edobe ọdịdị participle ahụ na mmegide Pọl na-eme n’etiti ịrụ ọrụ na ikwere, n’agbanyeghị na ọ naghị ekwu na ọrụ niile dị njọ.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: kama ọ na-ekwere ... n’Onye ahụ
  rationale: “Ikwere na” bụ okwu Igbo nkịtị nke na-egosi okwukwe a tụkwasịrị n’Onye ahụ; “ịtụkwasị obi na” ka bụ ntụgharị ọzọ kwesịrị ekwesị.
- source_word: τὸν δικαιοῦντα
  choice: Onye ahụ na-eme ka ... bụrụ onye ezi omume
  rationale: Nke a na-ejigide njikọ ya na δικαιοσύνη ma hapụkwa ajụjụ ma okwu ahụ ọ pụtara ime ka mmadụ bụrụ onye ezi omume ka ọ bụ ikwupụta ya dị otú ahụ, kama idozi esemokwu nkà mmụta okpukpe n’ime ntụgharị.
- source_word: τὸν ἀσεβῆ
  choice: onye na-adịghị asọpụrụ Chineke
  rationale: Nke a na-egosipụta enweghị nsọpụrụ n’ebe Chineke nọ nke ἀσεβής pụtara, n’etinyeghị nanị echiche sara mbara nke “onye ajọ omume.”
- source_word: λογίζεται
  choice: a na-agụ
  rationale: “Ịgụ ... dị ka” na-egosipụta echiche nke ịgbakọ ma ọ bụ iwere ihe dị ka ihe ọzọ, ma bụrụkwa okwu doro anya nye ndị na-agụ Igbo taa.
- source_word: ἡ πίστις αὐτοῦ
  choice: okwukwe ya
  rationale: “Okwukwe” na-ejigide otu ìgwè okwu πιστεύω/πίστις; ọnọdụ amaokwu a na-akwado okwukwe karịa “ikwesị ntụkwasị obi.”
- source_word: εἰς δικαιοσύνην
  choice: dị ka ezi omume
  rationale: N’usoro λογίζεται ... εἰς, “dị ka” na-egosi ihe a na-agụ okwukwe ahụ ịbụ n’ụzọ Igbo doro anya.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: “Ezi omume” na-ejigide okwu bụ isi nke Pọl ebe “ikpe ziri ezi” bụkwa ihe δικαιοσύνη pụrụ ịpụta n’ọnọdụ ụfọdụ.
theological_decisions:
- issue: Ihe δικαιοῦντα pụtara n’arụmụka Pọl banyere ime ka mmadụ bụrụ onye ezi omume
  choice: Onye ahụ na-eme ka ... bụrụ onye ezi omume
  alternative: Onye ahụ na-ekwupụta ... na ọ bụ onye ezi omume
  rationale: Isi okwu ahụ na-ejigide ike okwu Grik na njikọ ya na “ezi omume,” ma ihe ọzọ dị na nkọwa ala peeji na-echekwa nghọta nke nkwupụta ikpe n’etinyeghị ozizi otu ụka kpọmkwem.
- issue: Ntụgharị πιστεύω/πίστις n’ebe nkà mmụta okpukpe na-arụrịta ụka
  choice: na-ekwere / okwukwe
  alternative: na-atụkwasị obi / ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Mmegide dị n’etiti onye na-adịghị arụ ọrụ na onye na-ekwere na-akwado “okwukwe” n’ebe a. N’agbanyeghị nke ahụ, “ịtụkwasị obi” na-egosipụta nke ọma ntụkwasị obi dị na πιστεύειν ἐπί, ya mere a debere ya na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A haziri ahịrịokwu ahụ ka o debe mmegide Grik dị n’etiti “na-adịghị arụ ọrụ” na “na-ekwere,” ma zere okwu ụka pụrụ iche nke ga-emechi nghọta ndị ọzọ nke ederede ahụ.
