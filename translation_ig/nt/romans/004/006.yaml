id: ROM.4.6
reference: Romans 4:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: ig
  text: 'Dị nnọọ ka Devid na-ekwukwa banyere ngọzi nke onye Chineke na-agụnye[a] ezi omume[b] n’enweghị ọrụ:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “na-ewere dị ka onye ezi omume,” ma ọ bụ “na-agụ n’akaụntụ.”
    reason: lexical_alternative
  - marker: b
    text: Okwu a sụgharịrị “ezi omume” nwekwara ike ịpụta “ikpe ziri ezi.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: Dị nnọọ ka
  rationale: Ọ na-ewebata ntụnyere ya na arụmụka bu ụzọ, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: καὶ
  choice: na-ekwukwa
  rationale: Mgbakwunye -kwa na-egosi na Devid bụkwa onye akaebe ọzọ n’arụmụka ahụ.
- source_word: λέγει
  choice: na-ekwu
  rationale: Oge ugbu a dabara n’usoro e si ewebata ihe e dere n’Akwụkwọ Nsọ.
- source_word: μακαρισμός
  choice: ngọzi dịịrị
  rationale: Nke a na-egosi ọnọdụ ma ọ bụ nkwupụta na onye ahụ bụ onye a gọziri agọzi, n’asụsụ Igbo doro anya.
- source_word: ἀνθρώπου
  choice: onye
  rationale: N’Igbo, ‘onye’ bụ okwu nkịtị maka mmadụ n’otu onye ma na-echekwa echiche nnọchianya nke okwu Grik ahụ n’enweghị ịkpa ókè nwoke na nwaanyị.
- source_word: λογίζεται
  choice: na-agụ ... nye ya
  rationale: Ọ na-echekwa ihe atụ nke ịgụ ihe n’akaụntụ—Chineke na-agụ ezi omume nye onye ahụ—ma bụrụ okwu Igbo a pụrụ ịghọta.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: Nke a bụ nsụgharị Igbo a na-aghọta nke ọma maka δικαιοσύνη n’ebe a, ma ọ na-echekwa echiche nke ọnọdụ ziri ezi Chineke na-agụnye onye ahụ.
- source_word: χωρὶς ἔργων
  choice: n’agbanyeghị ọrụ ya
  rationale: Ọ na-egosi na ọrụ abụghị ihe ndabere Chineke ji agụ ezi omume nye onye ahụ; ‘ya’ na-eme ka okwu Igbo ahụ doo anya n’enweghị ịgbanwe isi echiche.
theological_decisions:
- issue: Asụsụ nnọchianya dị na ἀνθρώπου
  choice: onye
  alternative: nwoke ahụ / mmadụ ahụ
  rationale: Ọ bụ ezie na ụdị okwu Grik ahụ bụ nke otu onye, ihe ọ pụtara ebe a na-anọchi anya mmadụ n’ozuzu. ‘Onye’ na-egosipụta nke a n’ụzọ ebumpụta ụwa n’Igbo.
- issue: Ihe δικαιοσύνη pụtara n’akwụkwọ Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: ‘Ezi omume’ na-arụ ọrụ nke ọma maka ọnọdụ ziri ezi Chineke na-agụnye mmadụ n’ebe a; e debere akụkụ echiche nke ‘ikpe ziri ezi’ na nkọwa ala peeji ka a ghara imechi oke ihe okwu Grik ahụ pụrụ ịpụta.
- issue: Mmekọrịta dị n’etiti λογίζεται na χωρὶς ἔργων
  choice: Chineke na-agụ ezi omume nye onye ahụ n’agbanyeghị ọrụ ya
  alternative: Chineke na-agụ ezi omume nye onye ahụ n’enweghị ọrụ
  rationale: 'Nhọrọ ahụ na-echekwa esemokwu Pọl: ihe Chineke na-agụnye onye ahụ adabereghị n’ọrụ. Ọ naghị akọwa karịa ihe amaokwu ahụ kwuru banyere ụdị ọrụ ndị ahụ.'
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘onye’ mee ihe n’ụzọ nnọchianya dịka Igbo si eme. A zere okwu nkà mmụta okpukpe siri ike, ma echekwara ihe atụ nke ịgụ ihe n’akaụntụ na esemokwu dị n’etiti ezi omume Chineke na-agụnye mmadụ na ọrụ.
