revisions:
- from: N’ihi na ọ bụrụ na ndị sitere n’iwu[a] bụ ndị nketa, okwukwe abụrụla ihe efu[b], e meekwa ka nkwa ahụ ghara ịdị irè[c].
  to: N’ihi na ọ bụrụ na ndị na-adabere n’iwu[a] bụ ndị nketa, okwukwe aghọwo ihe efu[b], e meela nkwa ahụ ka ọ ghara ịdị irè[c].
  rationale: The revision replaces an origin-like rendering of οἱ ἐκ νόμου with a natural Igbo expression for people whose position is based on the law, while retaining the compact literal alternative in a footnote. It also makes the final perfect passive clause more idiomatic and clearer as a completed nullification, without adding doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the conditional argument, ‘heirs,’ faith, and the promise. However, ‘ndị sitere n’iwu’ ordinarily suggests people originating or coming from the law, which is not the force of οἱ ἐκ νόμου in this Pauline contrast. ‘Ndị na-adabere n’iwu’ naturally conveys people whose claim or standing is based on the law without reducing them merely to law-keepers. The revised final clause also better reflects κατήργηται as a completed state of being rendered ineffective.
  naturalness: The revision is fluent, modern Standard Igbo and preserves the concise parallelism of the Greek perfect verbs.
  terminology: ‘Ndị nketa,’ ‘okwukwe,’ and ‘nkwa ahụ’ are suitable. ‘Ndị na-adabere n’iwu’ is preferable to ‘ndị sitere n’iwu’ here; the more literal compact alternative is retained in a footnote.
  issues:
  - severity: medium
    issue: ‘ndị sitere n’iwu’ for οἱ ἐκ νόμου
    rationale: In Standard Igbo this tends to mean ‘those from/originating in the law.’ The Greek expression identifies those whose inheritance claim is on the basis of law, not their origin.
  - severity: low
    issue: ‘e meekwa ka nkwa ahụ ghara ịdị irè’
    rationale: This wording is less direct and its connective can sound like a separate consequential action. A completed passive-result expression better matches κατήργηται and the Greek parallelism.
  revised_text: N’ihi na ọ bụrụ na ndị na-adabere n’iwu[a] bụ ndị nketa, okwukwe aghọwo ihe efu[b], e meela nkwa ahụ ka ọ ghara ịdị irè[c].
