  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ndị na-adabere n’iwu[a] bụ ndị nketa, okwukwe aghọwo ihe efu[b], e meela nkwa ahụ ka ọ ghara ịdị irè[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị nke iwu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e meela okwukwe ihe efu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “e meela ka nkwa ahụ ghara ịrụ ọrụ” ma ọ bụ “a kagbuola nkwa ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: ndị sitere n’iwu
  rationale: Nke a na-edobe ụzọ Pọl si kọwaa ndị a site ná mmekọrịta ha na iwu, n’akọwaghị ya karịa ka okwu Grik ahụ kwuru.
- source_word: κληρονόμοι
  choice: ndị nketa
  rationale: Ọ bụ okwu Igbo doro anya maka ndị nwere ihe nketa ma dabara n’ụdị okwu nketa e ji kwuo nkwa ahụ.
- source_word: κεκένωται
  choice: abụrụla ihe efu
  rationale: Ọ na-egosipụta na okwukwe adịkwaghị irè ma na-edobekwa echiche ihe e mere ka ọ bụrụ ihe efu, n’asụsụ Igbo dị mfe nghọta.
- source_word: πίστις
  choice: okwukwe
  rationale: Ọ bụ okwu Igbo a na-ejikarị sụgharị πίστις; ebe a, ọ na-edobe ọdịiche Pọl mere n’etiti okwukwe na iwu.
- source_word: κατήργηται
  choice: e meekwa ka … ghara ịdị irè
  rationale: Ọ na-egosi na nkwa ahụ enweghịzi mmetụta ma ọ bụ ike ịrụ ọrụ, n’ekwughị na e bibiri ya kpamkpam.
- source_word: ἐπαγγελία
  choice: nkwa ahụ
  rationale: Akara njirimara ahụ na-ezo aka ná nkwa ahụ a na-atụle kpọmkwem, ya mere e jiri ‘ahụ’ gosi nke ahụ n’Igbo.
theological_decisions:
- issue: Ịsụgharị πίστις mgbe Pọl na-egosi ọdịiche ya na νόμος
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: N’usoro arụmụka Ndị Rom 4, Pọl na-ekwu banyere inweta ihe nketa site n’okwukwe n’adịghị ka site n’iwu. ‘Okwukwe’ na-edobe ụzọ arụmụka ahụ nke ọma n’enweghị ịmanye nkọwa pụrụ iche.
- issue: Mmekọrịta ndị nketa na iwu n’okwu οἱ ἐκ νόμου
  choice: ndị sitere n’iwu
  alternative: ndị nke iwu; ndị na-ebi ndụ dị ka iwu si dị
  rationale: Nhọrọ bụ isi na-edobe okwu Pọl dị mkpụmkpụ na nghọta ya sara mbara. Ọ naghị ekpebi ma ọ bụ nanị ndị na-edebe iwu ka ọ na-ekwu maka ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro arụmụka Pọl na ụdị ngwaa zuru ezu nke Grik site n’iji ‘abụrụla’ na ‘e meekwa,’ ma zere ịkọwa ‘ndị sitere n’iwu’ dị ka naanị ndị na-edebe iwu.
