id: ROM.4.4
reference: Romans 4:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: ig
  text: Ma onye na-arụ ọrụ, a naghị agụta ụgwọ ọrụ ya dịka onyinye, kama dịka ihe e ji ya ụgwọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: onye na-arụ ọrụ
  rationale: Nkebi okwu a na-ezo aka n'ozuzu ya n'onye a maara dị ka onye na-arụ ọrụ; ntụgharị a bụ Igbo doro anya ma kwekọọ n'ụdị participle ahụ.
- source_word: μισθὸς
  choice: ụgwọ ọrụ
  rationale: N'ọnọdụ a gbasara ọrụ na ịkwụ ụgwọ, “ụgwọ ọrụ” na-egosi kpọmkwem ihe onye rụtara site n'ọrụ ya.
- source_word: λογίζεται
  choice: a naghị agụ ... dị ka
  rationale: Nke a na-edobe echiche nke ịgụ ma ọ bụ ile ihe anya n'otu ọnọdụ, ma na-ada nke ọma n'Igbo n'ime ihe atụ gbasara ụgwọ.
- source_word: κατὰ χάριν
  choice: dị ka onyinye amara
  rationale: “Onyinye amara” na-egosi ihe e nyere n'amara, nke a na-arụtaghị n'ọrụ, ma na-edobekwa njikọ okwu χάρις na echiche amara.
- source_word: ὀφείλημα
  choice: ihe e ji ya ụgwọ
  rationale: Nke a na-egosi ihe a ga-akwụrịrị onye ahụ n'ihi na o rụtara ya, ma na-edobe n'ụzọ doro anya echiche nke ụgwọ dị na okwu Grik.
- source_word: δὲ
  choice: Ma
  rationale: δὲ na-egosi mgbanwe ma ọ bụ ọdịiche n'echiche sitere n'amaokwu bu ụzọ; “Ma” na-egosipụta njikọ ahụ n'ụzọ dị nkenke.
theological_decisions:
- issue: Ntụgharị χάρις n'ọdịiche dị n'etiti ụgwọ ọrụ na ihe a na-enye n'amara
  choice: dị ka onyinye amara
  alternative: dị ka amara
  rationale: Nke a na-eme ka ọdịiche Pọl na-egosi n'etiti ihe a rụtara na ihe e nyere n'amara doo anya, n'ebughị ụzọ belata χάρις ka ọ bụrụ naanị onyinye nkịtị.
- issue: Ntụgharị ὀφείλημα
  choice: dị ka ihe e ji ya ụgwọ
  alternative: dị ka ụgwọ a ga-akwụrịrị
  rationale: Nhọrọ a na-edobe ihe atụ nke onye na-arụ ọrụ na onye e ji ụgwọ, ma ghara ịgbakwunye onye ji ụgwọ ma ọ bụ usoro ịkwụ ụgwọ nke ederede ekwughị kpọmkwem.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ nke ọrụ, ụgwọ ọrụ, amara, na ihe e ji mmadụ ụgwọ n'ụzọ nkịtị.
