id: ROM.4.24
reference: Romans 4:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: ig
  text: kama ọ bụkwa n’ihi anyị[a], ndị a ga-agụta ya dịka nke anyị—anyị ndị kweere n’Onye[b] kpọlitere Jizọs Onyenwe anyị site n’etiti ndị nwụrụ anwụ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka anyị.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “tụkwasịrị Onye ahụ obi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: kama ...kwara
  rationale: 'Na-ejigide njikọ nke mmegide na mgbakwunye: ọ bụghị naanị maka Ebraham, kama ọ bụkwa maka anyị.'
- source_word: δι’ ἡμᾶς
  choice: n’ihi anyị
  rationale: N’ebe a, διά na accusative na-egosi na e dere okwu ahụ maka anyị ma ọ bụ n’ihi anyị.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: ndị a ga-agụnyekwara ya
  rationale: Na-ejigide echiche ọdịnihu nke μέλλει na ihe atụ nke ịgụnyere mmadụ ihe dị na λογίζεσθαι; ‘ya’ na-anọchi ihe a hapụrụ n’ezoghị ọnụ na Grik.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: anyị ndị kweere na
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kọwaa okwukwe a tụkwasịrị n’otu onye.
- source_word: τὸν ἐγείραντα
  choice: onye ahụ mere ka ... bilie
  rationale: Na-edebe participle ahụ dịka nkọwa nke Chineke site n’omume o mere.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jizọs Onyenwe anyị
  rationale: Na-eji aha a na-asụkarị n’Igbo ma na-edebe κύριος dị ka ‘Onyenwe anyị.’
- source_word: ἐκ νεκρῶν
  choice: si n’etiti ndị nwụrụ anwụ
  rationale: Na-egosipụta kpọmkwem echiche isi n’etiti ndị nwụrụ anwụ pụta, dịka okwu mbilite n’ọnwụ si dị.
theological_decisions:
- issue: Ihe λογίζεσθαι na-ekwu na a ga-agụnyere mmadụ, nke Grik hapụrụ n’ezoghị ọnụ
  choice: Jiri nnọchiaha ‘ya’ mee ka ahịrịokwu Igbo zuo oke
  alternative: Kwuo hoo haa ‘ezi omume’ ma ọ bụ ‘ịbụ onye ezi omume’
  rationale: ‘Ya’ na-ejigide njikọ ya na okwu banyere ezi omume dị n’amaokwu ndị bu ụzọ ma ghara itinye aha nke amaokwu a ekwughị hoo haa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugwu ma dịkwa mfe nghọta. A họọrọ ‘agụnyekwara ya’ iji debe ihe atụ ndekọ ọnụahịa nke λογίζομαι; a hapụrụ ihe a na-agụnyere n’ụdị nnọchiaha ka mgbagwoju anya nke Grik ghara ịla n’iyi.
