id: ROM.4.11
reference: Romans 4:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: ig
  text: Ọ natara ihe ịrịba ama nke ibi úgwù, nke bụ akara nkwado nke ezi omume nke okwukwe ahụ o nwere mgbe a na-ebighị ya úgwù,[a] ka o wee bụrụ nna nke ndị niile kwere ekwe n’agbanyeghị na ebighị ha úgwù,[b] ka e wee gụọ ezi omume nye ha kwa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi” n’ọnọdụ “ezi omume” (δικαιοσύνη) ebe a nakwa n’azụ n’amaokwu a.
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “site n’enweghị ibi úgwù”; ya bụ, n’ọnọdụ ịbụ ndị a na-ebighị úgwù.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka e debara ha ezi omume n’akwụkwọ” ma ọ bụ “ka e were ezi omume dịrị ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: ihe ịrịba ama
  rationale: Nke a bụ okwu Igbo doro anya maka ihe na-egosi eziokwu ọzọ, ma na-edobe ọrụ ibi úgwù dị ka ihe ngosi.
- source_word: περιτομή
  choice: ibi úgwù
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka emume ahụ Pọl na-ekwu banyere ya.
- source_word: σφραγίς
  choice: akara nkwado
  rationale: Ọ na-edobe echiche σφραγίς dị ka akara na-akwado ma na-egosi na ihe ahụ bụ eziokwu, n'emeghị ka ibi úgwù bụrụ ụzọ e si enweta ezi omume.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: Ọ bụ ntụgharị Igbo a na-aghọta nke ọma maka ọnọdụ ịbụ onye ziri ezi n'ihu Chineke n'okwu Pọl; 'ikpe ziri ezi' ka edobere dị ka ụzọ ọzọ n'ala ala peeji.
- source_word: πίστις
  choice: okwukwe
  rationale: Ọ na-egosi ntụkwasị obi/ikwere n'okwu a n'ụzọ kwekọrọ n'usoro arụmụka Pọl.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: mgbe a na-ebighị ya úgwù
  rationale: Nke a na-egosi ọnọdụ Ebreham mgbe okwukwe ahụ dịrị ya, n'Igbo nkịtị ma doo anya.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: nna nke ndị niile kwere ekwe
  rationale: Ọ bụ Igbo dị mfe nke na-edobe asụsụ nnọchiteanya Pọl na-eji.
- source_word: δι’ ἀκροβυστίας
  choice: mgbe a na-ebighị ha úgwù
  rationale: N'okwu a, διά na genitive na-egosi ọnọdụ ndị ahụ nọ na ya mgbe ha kwere, ọ bụghị ụzọ e si mee ka ha kwere.
- source_word: λογισθῆναι
  choice: gụnye...ezi omume
  rationale: Ọ na-eburu echiche ịgụnye ma ọ bụ ịkọrọ mmadụ ezi omume n'usoro ndekọ, ma bụrụkwa okwu ndị nkịtị nwere ike ịghọta.
- source_word: καί
  choice: -kwara
  rationale: Mgbakwunye '-kwara' na 'gụnyekwara' na-egosi na ndị a kwa ka a na-agụnyere ezi omume.
theological_decisions:
- issue: Mmekọrịta ibi úgwù na ezi omume
  choice: A kọwara ibi úgwù dị ka ihe ịrịba ama na akara nkwado nke ezi omume sitere n'okwukwe Ebreham nwere mgbe a na-ebighị ya úgwù.
  alternative: A pụrụ ịsụgharị ya n'ụzọ ga-eme ka ọ dị ka a ga-asị na ibi úgwù n'onwe ya wetara ezi omume ahụ.
  rationale: Usoro Grik na-egosi na ezi omume jikọtara na okwukwe Ebreham mgbe a na-ebighị ya úgwù, ebe ibi úgwù bịara dịka akara na nkwado ya; nke a na-edobe usoro Pọl n'etinyeghị ozizi otu ụka.
- issue: Uru λογίζομαι n'okwu a
  choice: A sụgharịrị ya 'gụnyekwara ha ezi omume,' nke na-edobe echiche ịgụnyere ha ezi omume.
  alternative: A pụrụ ikwu 'ka e were ezi omume debara ha n'akwụkwọ' ma ọ bụ 'ka e were ha dị ka ndị ezi omume.'
  rationale: Nhọrọ bụ isi na-edobe ihe Pọl kwuru banyere ezi omume a na-agụnyere mmadụ, ma ọ naghị akọwapụta usoro nkà mmụta okpukpe karịa ka Grik si mee.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji 'akara nkwado' mee ka ihe atụ σφραγίς doo anya n'enweghị jargon; e debere usoro na ebumnuche abụọ nke εἰς τὸ... εἰς τὸ... site n'iji 'ka... ka...'.
