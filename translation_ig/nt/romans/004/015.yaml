id: ROM.4.15
reference: Romans 4:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: ig
  text: N’ihi na iwu[a] na-eweta iwe, ma ebe iwu na-adịghị, mmebi iwu adịghịkwa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Iwu.”
    reason: νόμος nwere ike ịpụta Iwu Mosis n’ebe a, ma isi ederede na-echekwa obosara okwu ahụ.
  - marker: b
    text: Ma ọ bụ, “ngafe iwu adịghịkwa.”
    reason: “Ngafe iwu” na-egosipụta echiche παράβασις nke ịgafe ókè ma ọ bụ iwu e nyere.
lexical_decisions:
- source_word: νόμος
  choice: iwu
  rationale: A họọrọ “iwu” n’enweghị ịkpọ ya kpọmkwem “Iwu Mosis,” ka obosara okwu Pọl dịrị, ma ka njikọ ya na Iwu Mosis n’isiokwu a ghara imechi emechi.
- source_word: ὀργή
  choice: iwe Chineke
  rationale: “Iwe Chineke” na-eme ka ịdị arọ nke ikpe Chineke pụta ìhè n’okwu Pọl; ịsị naanị “iwe” nwere ike ịdị ka iwe mmadụ nkịtị.
- source_word: κατεργάζεται
  choice: na-eweta
  rationale: “Na-eweta” bụ okwu Igbo doro anya ma dị ugbu a nke na-echekwa echiche nke ime ka ihe pụta ma ọ bụ ịkpata ya.
- source_word: οὗ δὲ
  choice: ma ebe
  rationale: “Ma ebe” na-egosipụta ma ọnọdụ ebe ihe ahụ dị, ma obere ọdịiche δέ na-eweta n’etiti ahịrịokwu abụọ ahụ.
- source_word: παράβασις
  choice: mmebi iwu
  rationale: “Mmebi iwu” na-egosi ịgafe ma ọ bụ imebi ókè iwu nyere, nke kwekọrọ n’echiche Pọl na enweghị iwu, a pụghị inwe mmebi iwu n’ụzọ a kpọmkwem.
theological_decisions:
- issue: Oke ihe νόμος na-ezo aka na ya n’arụmụka Pọl
  choice: iwu
  alternative: Iwu Mosis
  rationale: Isi ederede ji okwu sara mbara “iwu” ka a ghara ikpebi na mbụ na ọ bụ naanị Iwu Mosis ka Pọl na-ekwu maka ya, ọ bụ ezie na Iwu Mosis ka bụ akụkụ dị mkpa nke gburugburu arụmụka ahụ.
- issue: Onye iwe ahụ bụ na ὀργή
  choice: iwe Chineke
  alternative: iwe
  rationale: N’ọnọdụ arụmụka Ndị Rom, iwe ahụ nwere ibu nke ikpe Chineke. A kọwara onye nwe iwe ahụ maka nghọta Igbo doro anya, ebe ndetu na-echekwa nsụgharị dị mkpụmkpụ nke Grik.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. E ji “na-adịghị” na “adịghịkwa” mee ka njikọ na ọdịiche nke ahịrịokwu ahụ daa nke ọma n’Igbo. Akara ndetu [a] na [b] dị n’isi ederede ma kwekọọ na ndetu niile.
