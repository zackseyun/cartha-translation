    text: 'Ma ọ bụ: “e kwupụtara na Ebreham bụ onye ezi omume.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “o nwere ihe ndabere ọ ga-eji na-anya isi.”'
    reason: lexical_alternative
  revision_rationale: The revision corrects the conventional Igbo form of Abraham’s name, removes added specificity from “works,” and uses a more idiomatic expression for boasting. It retains the Greek conditional force, passive justification language, and the ambiguity of the theological argument without resolving it interpretively.
