  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: ig
  text: N’ihi na, ọ bụrụ na e gụrụ Ebreham dịka onye ezi omume[a] site n’ọrụ, o nwere ihe ọ ga-eji na-anya isi[b]—ma ọ bụghị n’ihu Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “e kwupụtara na Ebreham bụ onye ezi omume.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “o nwere ihe ndabere ọ ga-eji na-anya isi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: “N’ihi na” na-ejigide njikọ γάρ na arụmụka bu ụzọ, ebe “ọ bụrụ na” na-egosipụta ọnọdụ εἰ n’etinyeghị nkọwa na ọnọdụ ahụ mere n’ezie ma ọ bụ na o meghị.
- source_word: Ἀβραὰμ
  choice: Ebraham
  rationale: E ji ụdị aha a a na-ejikarị eme ihe n’Igbo maka Abraham.
- source_word: ἐξ ἔργων
  choice: n’ihi ọrụ ndị ọ rụrụ
  rationale: Nke a na-egosi na ọrụ ya bụ ihe ndabere e chere maka ịgụ ya dị ka onye ezi omume, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἐδικαιώθη
  choice: a gụrụ ... dị ka onye ezi omume
  rationale: Nke a na-egosipụta passive na echiche ikpe ma ọ bụ nkwupụta dị n’okwu Grik, n’emeghị ka ọ bụrụ naanị mgbanwe omume n’ime mmadụ.
- source_word: ἔχει καύχημα
  choice: o nwere ihe ọ ga-eji tuo ọnụ
  rationale: Nkebiokwu a bụ Igbo doro anya ma na-echekwa echiche καύχημα dị ka ihe ma ọ bụ ihe ndabere mmadụ nwere iji tuo ọnụ.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: ma ọ bụghị n’ihu Chineke
  rationale: “N’ihu Chineke” na-egosipụta nyocha ma ọ bụ ọnọdụ mmadụ n’ebe Chineke nọ ma na-echekwa ọdịiche Pọl tinyere.
theological_decisions:
- issue: Ma ọnọdụ a ọ bụ ihe mere n’ezie ka ọ bụ naanị ihe e kwuru iji wuo arụmụka
  choice: A sụgharịrị ya ozugbo, “ọ bụrụ na a gụrụ Ebraham ...,” n’etinyeghị okwu ga-egosi na ọ bụ eziokwu ma ọ bụ na ọ bụghị.
  alternative: “a sị na a gụrụ Ebraham ...”
  rationale: Ụdị ọnọdụ Grik kwesịrị ịdịgide. Ọ bụ ezie na arụmụka sara mbara nke Pọl na-ajụ na ọrụ bụ ihe ndabere nke ịbụ onye ezi omume, e kwesịghị ibubata nkwubi okwu ahụ n’amaokwu a.
- issue: Ma ἐδικαιώθη ọ pụtara ime mmadụ ka ọ bụrụ ezi omume n’ime ya ka ọ bụ ịgụ ma ọ bụ ikwupụta ya dị ka onye ezi omume
  choice: “a gụrụ ... dị ka onye ezi omume”
  alternative: “e mere ... onye ezi omume”
  rationale: Nhọrọ bụ isi na-echekwa ụda ikpe ma ọ bụ nkwupụta nke okwu ahụ n’ọnọdụ a; e debere ụzọ ọzọ n’ala peeji n’ihi na okwu Grik nwere oke nghọta sara mbara, a gaghịkwa edozi esemokwu nkà mmụta okpukpe n’ime ntụgharị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo izugbe nke oge a, dị ugwu ma dị mfe nghọta. E jiri “tuo ọnụ” mee ka okwu ahụ bụrụ nke mmadụ nkịtị ga-aghọta, ebe “n’ihu Chineke” na-echekwa ụda siri ike na nke okpukpe nke njedebe amaokwu ahụ.
