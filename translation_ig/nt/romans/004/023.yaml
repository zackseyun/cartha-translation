  text: Οὐκ ἐγράφη δὲ δι’ αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: ig
  text: Ma ọ bụghị naanị n’ihi ya ka e dere na e dekọrọ ya n’aka ya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “e weere ya dị ka nke ya” ma ọ bụ “e debere ya n’aka ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: e dere
  rationale: Nke a na-egosipụta ngwaa nnara ahụ n'ụzọ doro anya ma na-edobe njikọ ya na ihe e dere n’Akwụkwọ Nsọ.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a, δέ na-akpụgharị arụmụka Pọl gaa n’ihe ọzọ ma nwee ntakịrị ọdịiche na ihe bu ụzọ; “Ma” na-arụ ọrụ ahụ nke ọma n’Igbo.
- source_word: δι’ αὐτὸν μόνον
  choice: naanị maka ya
  rationale: Nke a na-edobe echiche na okwu ahụ abụghị naanị maka Ebreham, n’asụsụ Igbo dị mfe ma kwekọọ n’ụzọ e si ekwu okwu taa.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ọdịnaya nke ihe e dere n’ụzọ nkịtị n’Igbo.
- source_word: ἐλογίσθη
  choice: a gụrụ ya
  rationale: “A gụrụ ya” na-edobe echiche nke ịgụ ma ọ bụ idebanye ihe n’aha mmadụ, n’ebughị ụzọ kpebie kpọmkwem nkọwa nkà mmụta okpukpe nke okwu ahụ.
- source_word: αὐτῷ
  choice: nye ya
  rationale: Nke a na-egosipụta onye e nyere ma ọ bụ e debanyere ihe ahụ n’aha ya, dịka dative Grik si dị.
theological_decisions:
- issue: Nkọwa λογίζομαι n’arụmụka Pọl banyere ịbụ onye ezi omume
  choice: a gụrụ ya nye ya
  alternative: e weere ya nye ya; e debanyere ya n’aha ya
  rationale: Nhọrọ a na-edobe ihe atụ nke ịgụ ma ọ bụ ịtụ ihe n’aha mmadụ, ma ọ naghị atụkwasị nkọwa ozizi karịa ihe amaokwu ahụ kwuru. Ọ na-ahapụkwa ihe a na-ekwu na a gụrụ nye ya ka ihe gbara ya gburugburu kọwaa ya.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere njikọ “Ma,” nkwusi ike dị na “naanị,” na mgbagwoju anya nke ihe a “gụrụ nye ya” n’emeghị ka nkọwa ozizi dochie okwu Grik.
