source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: ig
  text: N’ihi nke a, ọ bụ site n’okwukwe[a] ka o wee bụrụ dịka amara si dị, ka nkwa ahụ wee guzosie ike nye ụmụ[b] Ebreham niile—ọ bụghị naanị ndị sitere n’iwu, kama ọ bụkwa ndị nwere okwukwe[c] dị ka Ebreham, onye bụ nna anyị niile,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “okwukwe” ebe a dịka “ntụkwasị obi”; “ikwesị ntụkwasị obi” adịchaghị ka ihe a na-ekwu n’ebe a.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu e ji mee ihe bụ “mkpụrụ”; n’ebe a ọ bụ aha nchịkọta nke pụtara ụmụ ma ọ bụ ụmụ ụmụ Ebreham.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ na-esochi Grik anya, “ọ bụghị naanị nye onye sitere n’iwu, kama ọ bụkwa nye onye sitere n’okwukwe Ebreham.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi na okwu a bụ nkwubi okwu sitere n’ihe Pọl kwuru tupu ya, ma bụrụkwa Igbo nkịtị ma doo anya.
- source_word: ἐκ πίστεως
  choice: site n’okwukwe
  rationale: Nke a na-egosi ntọala ma ọ bụ ụzọ e si enweta ya, na-enweghị itinye iwu dịka ntọala.
- source_word: ἵνα κατὰ χάριν
  choice: ka o wee bụrụ dị ka amara si dị
  rationale: Ọ na-edobe ahịrịokwu nzube ahụ ma na-egosi njikọ dị n’etiti okwukwe na amara n’enweghị nkọwa agbakwunyere.
- source_word: βεβαίαν
  choice: wee guzosie ike
  rationale: N’ebe nkwa dị, okwu a na-egosi na nkwa ahụ siri ike, bụrụ nke a pụrụ ịdabere na ya.
- source_word: ἐπαγγελίαν
  choice: nkwa
  rationale: Nke a bụ okwu Igbo doro anya ma kwekọọ n’iji okwu ahụ eme ihe n’okwu ọgbụgba ndụ.
- source_word: σπέρματι
  choice: ụmụ Ebreham niile
  rationale: σπέρμα bụ ‘mkpụrụ’ n’ụzọ nkịtị, ma n’ebe a ọ bụ aha nchịkọta maka ụmụ ma ọ bụ ụmụ ụmụ Ebreham. Ịkpọ Ebreham aha na-enyere Igbo aka ịmata onye ụmụ ahụ bụ.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: ọ bụghị naanị ndị sitere n’iwu
  rationale: Ọ bụ ezie na Grik ji otu onye mee ihe, ihe ọ pụtara bụ otu ìgwè mmadụ; ọtụtụ n’Igbo na-eme ka nke a doo anya.
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: ndị nwere okwukwe dị ka Ebreham
  rationale: Grik ahụ dị mkpụmkpụ. Nsụgharị a na-egosi ndị e ji otu ụdị okwukwe Ebreham mara, na-enweghị ime ka ọ bụrụ naanị Ebreham n’onwe ya.
- source_word: πατὴρ πάντων ἡμῶν
  choice: nna anyị niile
  rationale: Ọ na-edobe okwu ezinụlọ na nke ọgbụgba ndụ nke Pọl ji mee ihe, ma na-ada nke ọma n’Igbo.
theological_decisions:
- issue: Ihe τῷ ἐκ πίστεως Ἀβραάμ na-ekwu banyere njikọ ndị ahụ na Ebreham
  choice: ndị nwere okwukwe dị ka Ebreham
  alternative: ndị sitere n’okwukwe Ebreham
  rationale: Nhọrọ ahụ na-eme ka Igbo ghọta na a na-ekwu maka ndị e ji okwukwe dịka nke Ebreham mara. Nhọrọ nke ọzọ na-esochi usoro okwu Grik nso karị, ma ọ naghị ada nke ọma n’Igbo ma nwee ike ghara ido anya.
- issue: Otu esi akọwa otu onye dị na τῷ ... τῷ ma ebe ọ na-anọchi ìgwè mmadụ
  choice: ndị sitere n’iwu ... ndị nwere okwukwe dị ka Ebreham
  alternative: onye sitere n’iwu ... onye sitere n’okwukwe Ebreham
  rationale: Ọtụtụ na Igbo na-eme ka ntụaka nchịkọta ahụ pụta ìhè, ebe ihe odide ala peeji na-echekwa ụdị otu onye nke Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro echiche nke Grik na nkwụsị ya n’akara rikoma, n’ihi na amaokwu na-esote ka na-aga n’ihu n’otu ahịrịokwu ahụ.
