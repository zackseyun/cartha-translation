revisions:
- from: 'Onye ahụ, n''ụzọ megidere olileanya[a], kwere n''olileanya, ka o wee ghọọ nna ọtụtụ mba[c], dị ka ihe e kwuru si dị: “Otú ahụ ka ụmụ gị ga-adị[b].”'
  to: 'Onye ahụ, megide olileanya[a], kwere n’olileanya, ka o wee ghọọ nna nke ọtụtụ mba, dịka e kwuru: “Otu a ka mkpụrụ gị[b] ga-adị.”[c]'
  rationale: The revision makes a safe source-fidelity correction to the direct quotation by using “mkpụrụ gị” for τὸ σπέρμα σου, while retaining a footnote for the more idiomatic alternative “ụmụ gị.” It also streamlines the citation introducer and places the lexical and cross-reference anchors at their respective referents. No theological interpretation has been added.
