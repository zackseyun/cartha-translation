id: ROM.4.18
reference: Romans 4:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: ig
  text: 'Onye ahụ, megide olileanya[a], kwere n’olileanya, ka o wee ghọọ nna nke ọtụtụ mba, dịka e kwuru: “Otu a ka mkpụrụ gị[b] ga-adị.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “gafee olileanya” ma ọ bụ “n'ụzọ na-emegide olileanya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụmụ gị.” “Mkpụrụ” na-echekwa ihe oyiyi dị n’otu okwu Grik ahụ, nke na-ezo aka n’ọtụtụ ụmụ na ụmụ ụmụ.
    reason: lexical_alternative
  - marker: c
    text: E hotara nke a na Jenesis 15:5; tụlee Jenesis 17:5.
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: n'ụzọ megidere olileanya
  rationale: Nke a na-echekwa ike nke okwu ahụ nke pụtara imegide ma ọ bụ gafee ihe mmadụ nwere ike ịtụ anya ya, ma na-edobekwa egwuregwu okwu ya na ‘n'olileanya’ nke na-esochi.
- source_word: ἐπ’ ἐλπίδι
  choice: n'olileanya
  rationale: Ọ na-egosi ọnọdụ ma ọ bụ ntọala olileanya nke okwukwe ahụ dị n'ime ya, ma na-echekwa ọdịiche okwu dị n'etiti nkebi ahịrịokwu abụọ ahụ.
- source_word: ἐπίστευσεν
  choice: kwere
  rationale: ‘Kwere’ bụ okwu Igbo nkịtị ma dabara adaba maka πιστεύω n'ebe a, na-enweghị ịgbakwunye nkọwa nke adịghị n'okwu Grik.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: ka o wee ghọọ
  rationale: Nke a na-ahapụ ohere ebumnuche na ihe si na ya pụta, dịka usoro εἰς τό na infinitive nwere ike isi pụta.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: nna ọtụtụ mba
  rationale: ‘Mba’ na-egosipụta ἔθνη dị ka mba ma ọ bụ agbụrụ dị iche iche n'ime nkwa Ebreham, kama ịkọwa ya naanị dị ka ndị mba ọzọ.
- source_word: κατὰ τὸ εἰρημένον
  choice: dị ka ihe e kwuru si dị
  rationale: Nke a na-egosi na okwu ahụ e kwuru na mbụ ka bụ ihe na-achịkwa nkwa ahụ, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: Οὕτως ἔσται τὸ σπέρμα σου
  choice: Otú ahụ ka ụmụ gị ga-adị
  rationale: ‘Ụmụ gị’ na-enye echiche nke ụmụ na ụmụ ụmụ n'ụzọ ndị na-agụ Igbo ga-aghọta ngwa ngwa; ihe odide ala peeji na-echekwa onyinyo nkịtị nke ‘mkpụrụ’ na otu mkpụrụokwu ahụ nwere nghọta mkpokọta.
theological_decisions:
- issue: Ihe ‘ọtụtụ mba’ na-ezo aka na ya n'ime nkwa e kwere Ebreham
  choice: A sụgharịrị ἐθνῶν dịka ‘mba.’
  alternative: ‘ndị mba ọzọ’ ma ọ bụ ‘agbụrụ dị iche iche’
  rationale: N'ebe a Pọl na-akpọghachi nkwa dị na Jenesis. ‘Mba’ na-echekwa obosara nkwa ahụ ma ghara ibubata ọdịiche ndị Juu na ndị mba ọzọ n'ụzọ karịrị ihe nkebi ahịrịokwu a kwuru.
- issue: Mmekọrịta ebumnuche na ihe si na okwukwe ahụ pụta
  choice: E ji ‘ka o wee ghọọ’ hapụ ma ebumnuche ma ihe a tụrụ anya na ọ ga-esi na ya pụta.
  alternative: ‘nke mere ka ọ ghọọ’
  rationale: εἰς τὸ γενέσθαι nwere ike igosi ebumnuche ma ọ bụ nsonaazụ; nsụgharị a anaghị emechi nghọta ahụ n'otu akụkụ naanị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A chekwara mmegide okwu ‘megidere olileanya ... n'olileanya,’ yana ụdị ahịrịokwu njikọ nke ὃς site n'iji ‘Onye ahụ.’
