review_pass:
  verdict: revise
  source_fidelity: The central contrast is retained, but the draft's “ụmụ gị” (“your children”) is narrower than τὸ σπέρμα σου, a singular collective term encompassing Abraham’s offspring/descendants. Rendering it “mkpụrụ gị” preserves both the collective image and the wording of the scriptural citation. “Megide olileanya ... n’olileanya” accurately reflects παρ’ ἐλπίδα ... ἐπ’ ἐλπίδι.
  naturalness: “Dị ka ihe e kwuru si dị” is understandable but unnecessarily heavy. “Dịka e kwuru” is idiomatic Standard Igbo and adequately introduces the prior scriptural utterance. The revised line preserves a formal but current biblical register.
  terminology: “Olileanya,” “kwere,” “nna nke ọtụtụ mba,” and “mkpụrụ” are appropriate. “Mba” correctly renders ἐθνῶν in the Abrahamic-promise setting without importing the later Jew/Gentile contrast. The revised footnote explains the collective force without defining “mkpụrụ” merely as biological seed.
  issues:
  - severity: medium
    issue: The cited phrase τὸ σπέρμα σου is rendered “ụmụ gị.”
    rationale: “Ụmụ gị” normally denotes one’s children and can underrepresent the singular collective “seed/offspring,” which in this promise includes the continuing line of descendants. “Mkpụrụ gị” is both more source-faithful and suitable for the direct Genesis citation.
  - severity: low
    issue: “Dị ka ihe e kwuru si dị” is stylistically redundant.
    rationale: The phrase combines overlapping ways of expressing conformity to a previous statement. “Dịka e kwuru” is clearer and more natural while retaining the reference to what was spoken.
  revised_text: 'Onye ahụ, megide olileanya[a], kwere n’olileanya, ka o wee ghọọ nna nke ọtụtụ mba, dịka e kwuru: “Otu a ka mkpụrụ gị[b] ga-adị.”[c]'
