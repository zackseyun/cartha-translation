id: ROM.4.17
reference: Romans 4:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: ig
  text: dị ka e dere, “Emeela m gị ka ị bụrụ nna nke ọtụtụ mba[a]”—n’ihu Chineke ahụ Abraham kwere na ya, onye na-eme ka ndị nwụrụ anwụ dị ndụ, na-akpọkwa ihe ndị na-adịghị adị ka a ga-asị na ha dị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mba” n’ebe a nwekwara ike ịpụta “ndị mba ọzọ”; ma n’ihe e hotara na Jenesis, o yikarịrị ka ọ pụtara mba dị iche iche n’ozuzu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, n’ụzọ na-akọwa ihe ọ pụtara karịa, “na-akpọ ihe ndị na-adịghị adị ka ha malite ịdị adị.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: dị ka e dere
  rationale: Ọ bụ usoro a na-ejikarị webata ihe e dere n’Akwụkwọ Nsọ; ọ dị nkenke ma na-egosi na ihe ahụ e dere ka dị irè.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: nna nke ọtụtụ mba
  rationale: N’amaokwu e hotara na Jenesis, ἐθνῶν pụtara mba ma ọ bụ ìgwè ndị dị iche iche n’ozuzu, ọ bụghị naanị ndị mba ọzọ n’adịghị ka ndị Juu.
- source_word: τέθεικά σε
  choice: Emeela m gị ka ị bụrụ
  rationale: Ụdị ngwaa zuru ezu na-egosi ihe Chineke merela nke ka na-adịgide; nsụgharị a bụkwa Igbo nkịtị ma doo anya.
- source_word: κατέναντι
  choice: n’ihu
  rationale: Nke a na-edobe echiche nke ịnọ n’ihu ma ọ bụ n’ọdịdị onye ọzọ n’ụzọ dị nkenke ma kwekọọ n’Igbo.
- source_word: οὗ ἐπίστευσεν
  choice: onye ahụ o kweere na ya
  rationale: N’Igbo, ‘ikwere na’ mmadụ na-egosi ntụkwasị obi e tinyere n’ime ya, nke kwekọrọ n’okwukwe Abraham nwere n’ebe Chineke nọ.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: onye na-eme ka ndị nwụrụ anwụ dị ndụ
  rationale: Ọ na-egosi Chineke dịka onye na-enye ndị nwụrụ anwụ ndụ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: καλοῦντος
  choice: na-akpọkwa
  rationale: E debere isi echiche nke ‘ịkpọ’ kama itinye nkọwa gbasara imepụta ihe kpọmkwem n’ahịrị bụ isi.
- source_word: τὰ μὴ ὄντα ὡς ὄντα
  choice: ihe ndị na-adịghị adị ka a ga-asị na ha dị
  rationale: Nke a na-anọ nso n’okwu Grik ma na-ahapụ nkọwa ya sara mbara, kama ikpebi ozugbo na ọ na-ekwu naanị banyere ikepụta ihe site n’ihe na-adịghị.
theological_decisions:
- issue: Ma a ga-akọwa nkebi ikpeazụ ozugbo dịka ikepụta ihe site n’ihe na-adịghị, ka a ga-edobe okwu ahụ sara mbara dịka ọ dị na Grik.
  choice: na-akpọkwa ihe ndị na-adịghị adị ka a ga-asị na ha dị
  alternative: na-akpọ ihe ndị na-adịghị adị ka ha malite ịdị adị
  rationale: Okwu Grik nwere ike ịgụnye echiche banyere ike okike Chineke, ma o kwuru ya n’ụzọ dị mkpirikpi nke nwere ike ịpụta ihe karịrị otu. Ahịrị bụ isi na-edobe esemokwu nkọwa ahụ; nkọwa doro anya karị dị n’ihe odide ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro okwu ahụ nso na Grik ebe nke ahụ na-ada nke ọma n’Igbo, ma gbanwee ya ntakịrị ebe ọ dị mkpa ka ahịrịokwu ahụ bụrụ nke e ji ọnụ ekwu n’enweghị isi mgbagwoju anya. E tinyere akara ihe odide ala peeji [a] n’akụkụ ‘mba’ na [b] n’akụkụ nkebi ikpeazụ ka ha kwekọọ n’ihe ha na-akọwa.
