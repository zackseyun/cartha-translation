  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: ig
  text: Gịnịzi ka anyị ga-asị na Ebreham, nna nna anyị n’anụ ahụ[a][b][c], chọpụtara?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nna ochie anyị sitere n’agbụrụ mmadụ.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ na-ewere “n’anụ ahụ” ka ọ na-akọwa “chọpụtara”; mgbe ahụ, echiche ya ga-abụ ihe Ebreham chọpụtara site n’ike mmadụ ma ọ bụ n’echiche mmadụ nkịtị.
    reason: alternative_reading
  - marker: c
    text: A pụkwara ide nkebi a, “Ebreham, bụ́ nna nna anyị n’anụ ahụ, chọpụtara.”
    reason: previous_rendering
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Gịnịzi ka anyị ga-asị
  rationale: Ọ na-edobe ajụjụ ntụgharị uche Pọl ji aga n’ihu n’arụmụka ya; “-zi” na-egosi njikọ nke οὖν na ihe ndị bu ụzọ.
- source_word: εὑρηκέναι
  choice: chọpụtara
  rationale: Okwu a na-egosi ihe Ebreham rutere n’ịmata ma ọ bụ nwetara dịka nchọpụta; ọ dabara n’ụdị perfect infinitive nke Grik n’enweghị ịgbakwụnye nkọwa ọzọ.
- source_word: Ἀβραὰμ
  choice: Ebreham
  rationale: A họọrọ ụdị aha a maara nke ọma n’Igbo maka Abraham.
- source_word: προπάτορα
  choice: nna nna
  rationale: “Nna nna” na-egosi nwoke bụ nna ochie nke agbụrụ ma na-adị mfe nghọta n’Igbo; “nna ochie” bụkwa ụzọ ọzọ e nwere ike isi kwuo ya.
- source_word: ἡμῶν
  choice: anyị
  rationale: E debere nnọchiaha a kpọmkwem iji chekwaa otú Pọl si jikọta onwe ya na ndị ọ na-agwa n’ihe gbasara Ebreham.
- source_word: κατὰ σάρκα
  choice: n’ụzọ anụ ahụ
  rationale: Nke a na-echekwa okwu Pọl nke ọma ma na-ezo aka n’agbụrụ mmadụ na mmekọrịta anụ ahụ, ọ bụghị n’ọdịdị mmehie.
theological_decisions:
- issue: Ihe κατὰ σάρκα na-akọwa
  choice: E mere ka “n’ụzọ anụ ahụ” kọwaa Ebreham dịka nna nna ha site n’agbụrụ mmadụ.
  alternative: A pụrụ ijikọ ya na “chọpụtara,” ya bụ, ihe Ebreham chọpụtara site n’ike mmadụ ma ọ bụ n’echiche mmadụ nkịtị.
  rationale: Ọdịdị ahịrịokwu ahụ na-eme ka ọ dabara nke ọma dị ka nkọwa nke “nna nna anyị,” ma ihe odide Grik ka nwere ezigbo mgbagwoju anya; ya mere e debere nkọwa nke ọzọ n’ala peeji.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ajụjụ Pọl na njikọ okwu ndị ahụ n’ụzọ na-agaghị ekpebi kpamkpam mgbagwoju anya dị n’ebe κατὰ σάρκα nọ.
