- from: Ya mere, ngọzi a ọ̀ bụ naanị maka ndị e biri úgwù, ka ọ̀ bụkwa maka ndị a na-ebighị úgwù? N’ihi na anyị na-ekwu, “A gụrụ okwukwe Ebreham dị ka ezi omume.”[a]
  to: Ya mere, ngọzi a ọ̀ bụ naanị maka ndị e biri úgwù, ka ọ̀ bụkwa maka ndị a na-ebighị úgwù? N’ihi na anyị na-ekwu, “A gụụrụ Ebreham okwukwe ya dị ka ezi omume[a].”
  rationale: 'The revision explicitly represents the Greek dative τῷ Ἀβραὰμ by using the applicative passive “A gụụrụ Ebreham…,” while preserving the source’s restrained wording: Abraham’s faith is counted as righteousness, without doctrinal paraphrase. The footnote anchor has been attached directly to “ezi omume.”'
