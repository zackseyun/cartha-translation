id: ROM.4.9
reference: Romans 4:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: ig
  text: Ya mere, ngọzi a ọ̀ bụ naanị maka ndị e biri úgwù, ka ọ̀ bụkwa maka ndị a na-ebighị úgwù? N’ihi na anyị na-ekwu, “A gụụrụ Ebreham okwukwe ya dị ka ezi omume[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: ngọzi
  rationale: N'ebe a, okwu ahụ na-ezo aka n'ọnọdụ onye a kpọrọ onye a gọziri agọzi na Rom 4:6–8; “ngọzi” bụ okwu Igbo doro anya ma bụrụkwa nke ndị mmadụ na-eji ugbu a.
- source_word: περιτομή
  choice: ndị e biri úgwù
  rationale: Ọ bụ ezie na aha Grik ahụ pụtara ibi úgwù, n'ebe a ọ na-anọchi anya ndị e biri úgwù; nsụgharị a mere ka ndị a na-ekwu maka ha doo anya.
- source_word: ἀκροβυστία
  choice: ndị a na-ebighị úgwù
  rationale: Dị ka περιτομή, aha a na-anọchi anya otu ndị mmadụ; okwu a na-egosipụta ọdịiche Pọl na-eme n'ụzọ doro anya.
- source_word: πίστις
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo kwesịrị ekwesị maka πίστις n'okwu a gbasara Ebreham, ma ọ naghị etinye nkọwa ozizi ọzọ n'ime amaokwu ahụ.
- source_word: ἐλογίσθη
  choice: a gụrụ
  rationale: “A gụrụ” na-echekwa echiche nke ịgụ ma ọ bụ ide ihe n'akwụkwọ dịka ihe ruru mmadụ, ma na-ada n'ụzọ kwụ ọtọ n'Igbo.
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” na-egosipụta δικαιοσύνη n'ọnọdụ arụmụka Pọl banyere ọnọdụ Ebreham n'ihu Chineke; a na-edebe “ikpe ziri ezi” dịka ihe ọzọ n'ala ala peeji.
- source_word: εἰς δικαιοσύνην
  choice: dị ka ezi omume
  rationale: Nkebiokwu a na-echekwa mmekọrịta dị n'etiti okwukwe Ebreham na ezi omume n'enweghị ịkọwa kpọmkwem usoro ozizi e si ghọta ya.
theological_decisions:
- issue: Okwukwe Ebreham na ezi omume n'okwu Pọl
  choice: A gụrụ okwukwe Ebreham dị ka ezi omume.
  alternative: E nyere Ebreham ezi omume n'ihi okwukwe ya.
  rationale: Nhọrọ a na-agbasochi usoro okwu Grik, na-echekwa esemokwu nkà mmụta okpukpe dị na ya, ma zere itinye nkọwa ozizi sara mbara nke amaokwu ahụ n'onwe ya na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E mere περιτομή na ἀκροβυστία ka ha zoo aka n'òtù ndị mmadụ n'ụzọ doro anya. Ajụjụ abụọ ahụ na usoro “Ya mere … N'ihi na” na-echekwa njikọ arụmụka nke Grik.
