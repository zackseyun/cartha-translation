  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: ig
  text: Ya mere, olee otú e si gụọ ya nye ya[a]? Ọ̀ bụ mgbe ọ bụ onye e biri úgwù, ka ọ bụ mgbe ọ bụ onye a na-ebibeghị úgwù? Ọ bụghị mgbe ọ bụ onye e biri úgwù, kama ọ bụ mgbe ọ bụ onye a na-ebibeghị úgwù.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “e tinyere ya n’akaụntụ ya” ma ọ bụ “e weere ya dị ka nke ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: Ya mere, olee mgbe
  rationale: N’agbanyeghị na πῶς pụtara n'ụzọ nkịtị ‘olee otú,’ ihe ndị na-esochi ya na-ajụ ọnọdụ oge Abraham nọ mgbe e mere ngụkọ ahụ. ‘Ya mere, olee mgbe’ na-eme ka ajụjụ ahụ doo anya n'Igbo ma na-echekwa ike nkwubi okwu nke οὖν.
- source_word: ἐλογίσθη
  choice: a gụrụ ya nye ya
  rationale: Okwu a na-egosi na e weere ma ọ bụ gụọ ihe ahụ nye Abraham. Nhọrọ a na-ejikọta ya na arụmụka gbara ya gburugburu ma zere ime ka okwu ahụ bụrụ naanị okwu gbasara ego.
- source_word: ἐν περιτομῇ ὄντι
  choice: mgbe e bisịrị ya úgwù
  rationale: Asụsụ Grik ji aha ọnọdụ na participle mee ya; Igbo nkịtị na-egosipụta ọnọdụ oge ahụ nke ọma site n'ịsị ‘mgbe e bisịrị ya úgwù.’
- source_word: ἐν ἀκροβυστίᾳ
  choice: mgbe a na-ebibeghị ya úgwù
  rationale: N'ebe a, okwu ahụ pụtara ọnọdụ onye a na-ebibeghị úgwù. Usoro a na-eme ka ọdịiche ya na ịbụ onye e biri úgwù doo anya.
- source_word: οὐκ ... ἀλλ’
  choice: Ọ bụghị ... kama ...
  rationale: Nke a bụ ụzọ Igbo doro anya ma sie ike isi chekwaa mmegide na mgbazi dị n'okwu Grik.
theological_decisions: []
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘ibi úgwù’ mee ihe dịka okwu Igbo a na-ahụkarị maka circumcision; e debere usoro ajụjụ na azịza Pọl nke na-emesi ọnọdụ Abraham ike.
