  to: Ya mere, olee otú e si gụọ ya nye ya[a]? Ọ̀ bụ mgbe ọ bụ onye e biri úgwù, ka ọ bụ mgbe ọ bụ onye a na-ebibeghị úgwù? Ọ bụghị mgbe ọ bụ onye e biri úgwù, kama ọ bụ mgbe ọ bụ onye a na-ebibeghị úgwù.
