  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: ig
  text: Ọ kwenyesiri ike kpamkpam[b] na ihe o kwere ná nkwa[a], o nwekwara ike imezu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Onye e ji “o” mee ihe ebe a bụ Chineke, dịka amaokwu ndị gbara ya gburugburu si gosi.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịsụgharị ya, “Ọ kwenyesiri ike nke ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: o kwenyesikwara ike
  rationale: Nke a na-egosi na Ebreham kwenyesiri ike kpamkpam. Okwu Igbo a bụ nke doro anya ma bụrụkwa nke ndị mmadụ na-asụ taa.
- source_word: ὅτι
  choice: na
  rationale: Ọ na-ewebata ihe Ebreham kwenyesiri ike banyere ya n'ụzọ nkịtị n'Igbo.
- source_word: ὃ ἐπήγγελται
  choice: ihe o kwere ná nkwa
  rationale: Nke a na-edobe echiche nke nkwa ahụ e kwuburu ma ka dị irè, n'okwu Igbo dị mfe ma bụrụ ihe e ji eme ihe.
- source_word: δυνατός ἐστιν
  choice: o nwekwara ike
  rationale: A sụgharịrị present Grik ahụ dịka 'nwere ike' iji chekwaa nkwupụta banyere ike ya nke na-adịgide, kama ime ya naanị ihe gara aga.
- source_word: καὶ
  choice: kwa
  rationale: 'N''ebe a, καί na-emesi eziokwu ahụ ike: onye ahụ nyere nkwa nwekwara ike imezu ya.'
- source_word: ποιῆσαι
  choice: ime ya
  rationale: Nke a na-edobe ịdị mfe nke ποιέω, ebe 'ya' na-ezo aka n'ihe ahụ e kwere ná nkwa.
theological_decisions:
- issue: Onye zoro ezo nyere nkwa ma nwee ike ime ya
  choice: E ji nnọchiaha 'o' mee ihe, a kpọghịkwa 'Chineke' aha n'ahịrịokwu bụ isi.
  alternative: na Chineke nwekwara ike ime ihe o kwere ná nkwa
  rationale: Ọnọdụ amaokwu ndị gbara ya gburugburu na-egosi na onye ahụ bụ Chineke, ma amaokwu Grik a akpọghị aha ahụ kpọmkwem. Nnọchiaha na-echekwa ụdị isi mmalite ahụ ma ka doo anya n'ọnọdụ ya.
- issue: Oge nke δυνατός ἐστιν
  choice: o nwekwara ike
  alternative: o nwekwara ike mgbe ahụ / o nwere ike
  rationale: Grik ji present kwuo ya. Igbo nwere ike idebe present ahụ n'ụzọ nkịtị, nke na-echekwakwa echiche na ike Chineke adịghị agwụ agwụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu n'ụzọ na-ada ka Igbo nkịtị, ma chekwaa nnọchiaha zoro ezo na present nke Grik.
