    rationale: Move the marker to the conviction phrase and give a genuine lexical alternative.
  - severity: medium
    issue: “ime ya” leaves the object vague and is weaker than the promise-performance sense required by the context.
    rationale: “imezu” naturally means to fulfill/carry out what was promised and accurately represents ποιῆσαι in this construction.
