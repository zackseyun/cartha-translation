id: ROM.4.19
reference: Romans 4:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: ig
  text: N’adaghị mbà n’okwukwe, ọ tụlere[a] ahụ ya, nke dị ka nke nwụrụ anwụ—ebe ọ dị ihe dị ka otu narị afọ—nakwa ọnwụ[b] akpa nwa Sera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, dịka ọdịnala ederede ọzọ si kwuo: “Ọ tụleghị ahụ ya, nke dị ka nke nwụrụ anwụ.”'
    reason: textual_variant
  - marker: b
    text: 'Ma ọ bụ: “amụghị nwa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας τῇ πίστει
  choice: N’adaghị mbà n’okwukwe
  rationale: Nke a na-egosi na okwukwe Ebreham esighị ike daa ma ọ bụ kwụsị ịdabere ná nkwa Chineke; ọ na-edobekwa njikọ participle ahụ n’Igbo na-asụkarị.
- source_word: κατενόησεν
  choice: ọ tụlere
  rationale: “Ọ tụlere” na-egosi na o lebara ọnọdụ ahụ anya nke ọma, n’emeghị ka okwu ahụ pụta naanị dị ka ịhụ ihe anya.
- source_word: τὸ ἑαυτοῦ σῶμα νενεκρωμένον
  choice: ahụ nke ya dị ka nke nwụrụ anwụ
  rationale: Nke a na-echekwa ihe atụ ọnwụ dị na Grik, ma na-eme ka o doo anya na ahụ ya abụghị ozu n’ezie kama na ike ịmụ nwa adịkwaghị na ya.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: ebe ọ bụ na ọ dị ihe dị ka otu narị afọ
  rationale: “Ihe dị ka” na-anọchi πού, nke na-egosi na ọnụ ọgụgụ ahụ bụ nke e kwuru n’ụzọ na-adịghị ekwusi ike na ọ bụ kpọmkwem otu narị.
- source_word: τὴν νέκρωσιν
  choice: ọnọdụ ọnwụ
  rationale: Nhọrọ a na-echekwa okwu gbasara ọnwụ nke Pọl ji jikọta ọnọdụ ahụ Ebreham na nke akpa nwa Sera, kama ịgbanwe ya ozugbo ka ọ bụrụ naanị amụghị nwa.
- source_word: τῆς μήτρας Σάρρας
  choice: nke akpa nwa Sera
  rationale: “Akpa nwa Sera” bụ ụzọ Igbo doro anya ma bụrụkwa ihe a na-aghọta nke ọma maka ihe ahụ Grik kpọrọ μήτρα.
theological_decisions:
- issue: Ma a ga-eme ka ihe atụ ọnwụ banyere ike ịmụ nwa dị nro site n’iji okwu pụtara amụghị nwa naanị
  choice: 'E debere okwu ọnwụ n’ahịrịokwu abụọ ahụ: “dị ka nke nwụrụ anwụ” na “ọnọdụ ọnwụ.”'
  alternative: ahụ ya enweghịzi ike ịmụ nwa; akpa nwa Sera enweghị ike ịtụrụ ime
  rationale: Pọl ji okwu ndị sitere n’echiche ọnwụ kọwaa ma ahụ Ebreham ma akpa nwa Sera. Idebe njikọ a na-eme ka ike nkwa Chineke n’ọnọdụ yiri ihe na-agaghị ekwe omume pụta ìhè, n’agbanyeghị na nkọwa ọzọ nwere ike ịdị mfe karịa.
- issue: Ọdịiche ederede banyere ma Ebreham tụlere ahụ ya ma ọ bụ na ọ tụleghị ya
  choice: 'Isi ederede soro SBLGNT: “ọ tụlere ahụ nke ya.”'
  alternative: “ọ tụleghị ahụ nke ya”
  rationale: Isi iyi a họpụtara nwere κατενόησεν n’enweghị ihe na-ajụ omume ahụ; ma n’ihi na ọdịnala ederede ọzọ nwere nkwado, e debere ya n’okpuru peeji kama izochi ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ ọnwụ nke Grik ka ọ dị, ma jiri “dị ka nke nwụrụ anwụ” gbochie nghọta na Ebreham nwụrụ n’anụ ahụ n’ezie. E tinyere akara ụkwụ [a] na [b] kpọmkwem n’ebe okwu ndị ha na-akọwa dị.
