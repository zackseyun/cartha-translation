review_pass:
  verdict: revise
  source_fidelity: 'Draft follows the SBLGNT reading: Abraham did not weaken in faith, nevertheless considered his reproductively deadened body, being about one hundred, and Sarah''s womb''s deadness. The wording should retain the paired death imagery more directly in the final clause.'
  naturalness: “Ọnọdụ ọnwụ nke akpa nwa Sera” is understandable but is an abstract, somewhat awkward Igbo construction. “Ọnwụ akpa nwa Sera” is more direct and better preserves Paul's parallel death terminology. Moving the footnote markers to the words they qualify also improves readability and anchoring.
  terminology: “Okwukwe,” “ahụ ya,” “akpa nwa Sera,” and the name “Sera” are appropriate Standard Igbo choices. “N’adaghị mbà n’okwukwe” naturally conveys not weakening in faith. The lexical alternative should be expressed as sterility rather than a full paraphrase about inability to conceive.
  issues:
  - severity: medium
    issue: The phrase “ọnọdụ ọnwụ nke akpa nwa Sera” weakens and makes abstract the Greek νέκρωσις.
    rationale: νέκρωσις is deliberately cognate with the preceding deathened/dead body language. “Ọnwụ akpa nwa Sera” is more idiomatic and retains the concrete parallel without adding an interpretive layer.
  - severity: low
    issue: Footnote markers are not optimally placed at their respective terms.
    rationale: The textual-variant marker should follow “tụlere,” and the lexical-alternative marker should follow “ọnwụ,” so that each note has an unambiguous anchor.
  - severity: low
    issue: The lexical footnote paraphrases rather than gives the stated lexical alternative.
    rationale: “Amụghị nwa”/“ịmụghị nwa” is a more concise Igbo equivalent of “sterility” than “enweghị ike ịtụrụ ime,” while still remaining clearly a footnoted alternative.
  revised_text: N’adaghị mbà n’okwukwe, ọ tụlere[a] ahụ ya, nke dị ka nke nwụrụ anwụ—ebe ọ dị ihe dị ka otu narị afọ—nakwa ọnwụ[b] akpa nwa Sera.
