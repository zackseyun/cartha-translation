revisions:
- from: N’adaghị mbà n’okwukwe, ọ tụlere ahụ nke ya dị ka nke nwụrụ anwụ[a]—ebe ọ bụ na ọ dị ihe dị ka otu narị afọ—nakwa ọnọdụ ọnwụ nke akpa nwa Sera[b].
  to: N’adaghị mbà n’okwukwe, ọ tụlere[a] ahụ ya, nke dị ka nke nwụrụ anwụ—ebe ọ dị ihe dị ka otu narị afọ—nakwa ọnwụ[b] akpa nwa Sera.
  rationale: The revision preserves the SBLGNT's affirmative “he considered,” the approximate age, and the intentional paired death imagery concerning Abraham's body and Sarah's womb. It replaces an unnatural abstract phrase with direct Standard Igbo, and relocates both footnote anchors to the precise expressions they explain. The textual variant remains confined to a footnote and does not alter the main reading.
