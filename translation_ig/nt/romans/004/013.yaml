id: ROM.4.13
reference: Romans 4:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: ig
  text: N’ihi na ọ bụghị site n’iwu ka e nyere Ebreham ma ọ bụ mkpụrụ ya[a] nkwa ahụ—na ọ ga-abụ onye nketa nke ụwa—kama ọ bụ site n’ezi omume nke okwukwe[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “mkpụrụ ya.” Okwu Grik ahụ dị n’ụdị otu, ma ọ pụrụ ịrụ ọrụ dịka aha mkpokọta: “ụmụ ya” ma ọ bụ “ụmụ ụmụ ya.”'
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “site n’ezi omume nke na-abịa site n’okwukwe” ma ọ bụ “site n’ezi omume site n’okwukwe.”
    reason: alternative_reading
  - marker: c
    text: “Ezi omume” pụkwara ịbụ “ikpe ziri ezi” n’ọnọdụ ụfọdụ n’akwụkwọ Pọl.
    reason: lexical_alternative
  - marker: d
    text: “Okwukwe” pụkwara ịbụ “ntụkwasị obi” ma ọ bụ “ikwesị ntụkwasị obi,” dabere n’ọnọdụ okwu ahụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: nkwa
  rationale: “Nkwa” bụ okwu Igbo doro anya maka nkwa Chineke ma na-echekwa ike okwu ahụ n’arụmụka Pọl.
- source_word: σπέρματι
  choice: mkpụrụ ya
  rationale: “Mkpụrụ” na-echekwa ihe oyiyi na ọdịdị otu mkpụrụ okwu Grik, ma n’ọnọdụ a ọ pụkwara ịrụ ọrụ dịka aha mkpokọta maka ụmụ ma ọ bụ ụmụ ụmụ.
- source_word: κληρονόμον ... κόσμου
  choice: onye nketa nke ụwa
  rationale: Nke a na-eme ka asụsụ ihe nketa Pọl pụta ìhè ma ghara ibelata obosara κόσμος.
- source_word: διὰ νόμου
  choice: site n’iwu
  rationale: Ọ bụ nsụgharị Igbo dị mma nke ụzọ ma ọ bụ ihe e ji enweta ihe; “iwu” n’arụmụka a na-ezo n’iwu Chineke, karịsịa Iwu Mosis.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: “Ezi omume” bụ okwu Igbo a na-aghọta nke ọma maka ọnọdụ ịdị n’ezi ihe n’ihu Chineke; nkọwa ala peeji na-echekwa ohere nke “ikpe ziri ezi.”
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ nhọrọ nkịtị n’Igbo maka πίστις n’ebe a, ebe e ji ya tụnyere iwu; a na-echekwa “ntụkwasị obi” na “ikwesị ntụkwasị obi” dịka nhọrọ ndị ọzọ.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: site n’ezi omume nke okwukwe
  rationale: Nkebi okwu a na-echekwa njikọ genitive dị mkpụmkpụ nke Grik kama ịkọwa kpọmkwem ma ezi omume ahụ sitere n’okwukwe, dabere na ya, ma ọ bụ jikọrọ ya n’ụzọ ọzọ.
theological_decisions:
- issue: Njikọ dị n’etiti δικαιοσύνης na πίστεως
  choice: “ezi omume nke okwukwe”
  alternative: “ezi omume nke na-abịa site n’okwukwe” ma ọ bụ “ezi omume site n’okwukwe”
  rationale: Grik ahụ dị mkpụmkpụ ma nwee ike ịkọwa n’ụzọ karịrị otu. Nhọrọ bụ isi na-echekwa mgbagwoju na esemokwu nkà mmụta okpukpe dị na ya, kama idozi ya n’ụzọ otu ozizi.
- issue: Onye nketa nke ụwa
  choice: 'E debere okwu ahụ n’ụdị sara mbara: “onye nketa nke ụwa.”'
  alternative: Ịkọwa “ụwa” dịka ala Kenan naanị ma ọ bụ dịka ihe niile e kere eke.
  rationale: κόσμος pụtara “ụwa” n’obosara ya ebe a; amaokwu ahụ n’onwe ya akọwaghị oke ihe nketa ahụ nke ọma, ya mere a naghị emechi ya n’otu nkọwa.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ahịrịokwu nwere ntinye n’etiti akara ogologo iji mee ka “nkwa na ọ ga-abụ onye nketa nke ụwa” doo anya na ọ na-akọwa ọdịnaya nkwa ahụ. E debere usoro Pọl nke “ọ bụghị ... kama ...” na okwu nketa ya.
