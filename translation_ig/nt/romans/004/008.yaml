  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: ig
  text: Ngọzi na-adịrị nwoke ahụ,[a] bụ onye Onyenweanyị na-agaghị agụta mmehie n’ahụ ya ma ọlị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye ahụ.” “Nwoke” n’ebe a na-anọchi anya mmadụ n’ozuzu ya; ọ bụghị naanị ụmụ nwoke ka e kwuru maka ha.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Onyenweanyị agaghị edekọ mmehie n’ahụ ya ma ọlị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Ngọzi na-adịrị
  rationale: Nke a na-egosipụta ọnọdụ onye Chineke gọziri agọzi, ma na-ejigide ịdị arọ nke okwu ngọzi Akwụkwọ Nsọ karịa okwu na-egosi naanị obi ụtọ.
- source_word: ἀνήρ
  choice: nwoke ahụ
  rationale: A hapụrụ aha nwoke dị ka otu ihe nnọchianya nke mmadụ n’ozuzu ya, dịka ọdịdị otu nwoke nke Grik si dị; nkọwa ala peeji na-eme ka o doo anya na ọ bụghị naanị ụmụ nwoke ka a na-ekwu maka ha.
- source_word: οὗ
  choice: '... ga-agụnyere ya'
  rationale: Nnọchiaha genitive a dabara n’Igbo eke site n’itinye ‘ya’ n’ọrụ nke ịgụnyere mmadụ mmehie.
- source_word: οὐ μὴ
  choice: ọ dịghị mgbe ... ga-
  rationale: Usoro a na-egosipụta ngọnarị siri ike nke οὐ μή n’Igbo doro anya ma bụrụkwa nke eke.
- source_word: λογίσηται
  choice: agụnyere
  rationale: ‘Agụnyere’ na-echekwa echiche ndekọ ma ọ bụ ịgụ ihe n’aha mmadụ, nke dị mkpa n’arụmụka Ndị Rom 4, na-enweghị itinye okwu nkà mmụta okpukpe karịrị ihe ederede kwuru.
- source_word: κύριος
  choice: Onyenweanyị
  rationale: Nke a bụ aha Igbo a na-ejikarị asụ κύριος dịka aha nsọ n’ọnọdụ nke nhota Akwụkwọ Nsọ.
- source_word: ἁμαρτίαν
  choice: mmehie
  rationale: E ji otu aha ahụ mee ihe dịka ụdị ihe n’ozuzu ya, kwekọrọ na otu mkpụrụokwu Grik na-enweghị article.
theological_decisions:
- issue: Asụsụ nwoke nke na-anọchi anya mmadụ niile
  choice: E debere ‘nwoke ahụ’ n’ahịrịokwu bụ isi, ma kọwaa na ọ na-anọchi anya mmadụ n’ozuzu ya.
  alternative: ‘onye ahụ’
  rationale: ἀνήρ bụ aha nwoke n’otu mkpụrụokwu, ma n’ebe a ọ na-arụ ọrụ nnọchianya; nkọwa ala peeji na-egbochi nghọta na-ezighị ezi na amaokwu ahụ bụ naanị maka nwoke.
- issue: Ike nke ngọnarị οὐ μή
  choice: ‘ọ dịghị mgbe ... ga-agụnyere’
  alternative: ‘agaghị agụnyere ... ma ọlị’
  rationale: Nhọrọ bụ isi na-egosipụta ‘will never,’ ebe nhọrọ ala peeji na-egosipụta otu ike ahụ dịka ngọnarị a kwusiri ike; e kweghị ka ọdịiche n’ụzọ e si kwuo ya ghọọ ọdịiche n’ozizi.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee nsọpụrụ kwesịrị nhota Akwụkwọ Nsọ. ‘Ngọzi na-adịrị’ na ‘agụnyere ya’ bụ usoro eke nke na-echekwa ma olu ngọzi ahụ ma ihe atụ ndekọ ego dị n’okwu Grik.
