- from: N’ihi na ndị ọchịchị abụghị ihe iyi egwu nye omume ọma,[a] kama ọ bụ nye omume ọjọọ. Ma ì chọrọ ka ị ghara ịtụ onye ọchịchị ahụ egwu?[b] Na-eme ihe ọma, ị ga-enwetakwa otuto n’aka ya.[c]
  to: N’ihi na ndị ọchịchị abụghị ihe iyi egwu nye ezi omume,[a] kama ha bụ ihe iyi egwu nye omume ọjọọ. Ma, ì chọrọ ịghara ịtụ ikike ọchịchị egwu?[b] Mee ihe ọma, ị ga-enwetakwa otuto site n’aka ya.[c]
  rationale: E weghachiri ἐξουσία ka ọ bụrụ “ikike ọchịchị,” dịka ihe odide Grik na ntụgharị Bekee nyocha si kwado, kama “onye ọchịchị.” Nke a na-echekwa ọdịiche dị n’etiti ndị na-achị na ikike ọchịchị, ma na-eme ka isi mmalite otuto ahụ doo anya. A gbanwere “Na-eme” ka ọ bụrụ “Mee” iji nye iwu ahụ n’ụzọ Igbo eke n’etinyeghị aspektu ọzọ.
