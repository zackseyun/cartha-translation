id: ROM.13.3
reference: Romans 13:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: ig
  text: N’ihi na ndị ọchịchị abụghị ihe iyi egwu nye ezi omume,[a] kama ha bụ ihe iyi egwu nye omume ọjọọ. Ma, ì chọrọ ịghara ịtụ ikike ọchịchị egwu?[b] Mee ihe ọma, ị ga-enwetakwa otuto site n’aka ya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nye ezi ọrụ … nye ihe ọjọọ.” Okwu Grik ahụ na-atụnyere ihe ọma na ihe ọjọọ n’ozuzu ha gbasara omume.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ma ọ bụrụ na ị chọghị ịtụ ikike ọchịchị egwu.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, site n’aka ikike ọchịchị.
    reason: referent_clarification
lexical_decisions:
- source_word: ἄρχοντες
  choice: ndị ọchịchị
  rationale: Ọ na-ezo aka n’ebe ndị na-achị ma ọ bụ ndị ji ọkwa ọchịchị nọ; okwu a dabara n’ọnọdụ ọchịchị obodo a.
- source_word: φόβος
  choice: ihe iyi egwu
  rationale: N’ebe a, ọ pụtara ihe na-akpata ụjọ ma ọ bụ ihe a ga-atụ egwu, ọ bụghị naanị mmetụta ụjọ n’onwe ya.
- source_word: τῷ ἀγαθῷ ἔργῳ … τῷ κακῷ
  choice: nye omume ọma … nye omume ọjọọ
  rationale: Ọ bụ ọdịiche zuru ezu n’etiti ime ihe ọma na ime ihe ọjọọ; ‘omume’ na-enye Igbo doro anya ma dịkwa n’usoro okwu ahụ.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Ma ì chọrọ ka ị ghara ịtụ … egwu?
  rationale: E chekwara usoro ajụjụ nkwupụta nke Grik na ọchịchọ onye a na-agwa ka ọ ghara ịtụ egwu.
- source_word: τὴν ἐξουσίαν
  choice: onye ọchịchị ahụ
  rationale: ἐξουσία nwere ike ịpụta ikike ọchịchị ma ọ bụ onye ji ya; n’Igbo, ụdị onye a na-ahụ anya kwekọrọ na nnọchiaha nwanyị αὐτῆς ma mee ka okwu ahụ bụrụ nke eke.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Na-eme ihe ọma
  rationale: Nke a na-egosipụta iwu nke ugbu a ka mmadụ nọgide na-eme ihe bụ́ ezi omume.
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: ị ga-enwetakwa otuto n’aka ya
  rationale: Ọ na-echekwa echiche nke inweta otuto site n’aka ikike ọchịchị, n’asụsụ Igbo dị mfe nghọta.
theological_decisions:
- issue: Oke okwu Pọl banyere ndị ọchịchị na otuto
  choice: A sụgharịrị ya dịka nkọwa banyere ọrụ ndị ọchịchị kwesịrị ịrụ n’ozuzu, n’etinyeghị na ya na onye ọchịchị ọ bụla na-eme otu a mgbe niile.
  alternative: Ịkọwa ya dịka nkwupụta zuru ụwa ọnụ na ndị ọchịchị niile na-ata ihe ọjọọ ahụhụ ma na-eto ihe ọma mgbe niile, ma ọ bụ dịka okwu ịkwa emo.
  rationale: Ihe odide ahụ kwuru okwu ahụ kpọmkwem, ma o nweghị akara na-egosi ịkwa emo; nsụgharị ahụ ekwesịghịkwa ime ka nkwupụta ahụ sie ike karịa Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ajụjụ nkwupụta nke Grik, ọdịiche dị n’etiti omume ọma na omume ọjọọ, nakwa esemokwu dị n’okwu ahụ n’ebughị ozizi otu ụka bata.
