    rationale: Nkọwa a na-agbaso mgbanwe e mere n’amaghị ama site n’“ikike ọchịchị” gaa n’“onye ọchịchị”; a ga-eme ka o doo anya na ihe e zoro aka na ya bụ ikike ọchịchị.
