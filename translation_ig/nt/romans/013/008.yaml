    text: N’ụzọ nkịtị, okwu Grik bụ “onye nke ọzọ.”
    reason: lexical_alternative
  revision_rationale: Only the opening debt expression is adjusted for idiomatic Standard Igbo. The revision retains the direct prohibition on owing, the continuing obligation to love one another, the singular representative expression “onye hụrụ,” and the perfect-result force of “emezuola.”
