- from: Unu ejila onye ọ bụla ụgwọ ihe ọ bụla, ma e wezụga ịhụrịta ibe unu n’anya; n’ihi na onye hụrụ onye ọzọ[a] n’anya emezuola iwu ahụ.
  to: Unu ejila onye ọ bụla ụgwọ ọ bụla, ma e wezụga ịhụrịta ibe unu n’anya; n’ihi na onye hụrụ onye ọzọ[a] n’anya emezuola iwu ahụ.
  rationale: Only the opening debt expression is adjusted for idiomatic Standard Igbo. The revision retains the direct prohibition on owing, the continuing obligation to love one another, the singular representative expression “onye hụrụ,” and the perfect-result force of “emezuola.”
