source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: ig
  text: Unu ejila onye ọ bụla ụgwọ ọ bụla, ma e wezụga ịhụrịta ibe unu n’anya; n’ihi na onye hụrụ onye ọzọ[a] n’anya emezuola iwu ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, okwu Grik bụ “onye nke ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν
  choice: onye ọ bụla ... ihe ọ bụla
  rationale: 'Njikọ okwu abụọ a na-egosi mmachibido zuru ezu: a gaghị eji onye ọ bụla ụgwọ ihe ọ bụla. Usoro a bụ Igbo doro anya ma na-edobe obosara okwu Grik.'
- source_word: ὀφείλετε
  choice: ejila ... ụgwọ
  rationale: N'ebe a, ngwaa ahụ pụtara iji mmadụ ụgwọ ma ọ bụ ịnọ n'okpuru ibu ọrụ. Okwu a na-edobe ma echiche ụgwọ ego ma echiche ibu ọrụ n'ebughị ụzọ kpebie ụdị ụgwọ Pọl bu n'uche.
- source_word: εἰ μὴ
  choice: ma e wezụga
  rationale: Okwu a na-ewebata naanị ibu ọrụ a na-ahapụ ka ọ dịgide—ịhụrịta ibe ha n'anya.
- source_word: τὸ ἀλλήλους ἀγαπᾶν
  choice: ịhụrịta ibe unu n’anya
  rationale: Ụdị nzaghachi ‘ịhụrịta’ na-egosi na ndị a na-ekwu okwu banyere ha kwesịrị ịhụ ibe ha n'anya, ma na-asụkwa nke ọma n'Igbo.
- source_word: ἀγαπᾶν / ἀγαπῶν
  choice: ịhụ ... n’anya / hụrụ ... n’anya
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa ịhụnanya, ma ọ na-edobe njikọ dị n'etiti ụdị ngwaa Grik abụọ ahụ.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: n’ihi na onye hụrụ
  rationale: ‘Onye hụrụ’ na-edobe otu onye a na-eji anọchi anya onye ọ bụla, ebe ‘n’ihi na’ na-egosi ihe mere e ji kwuo okwu gara aga.
- source_word: τὸν ἕτερον
  choice: onye ọzọ
  rationale: ‘Onye ọzọ’ bụ Igbo e ji eme ihe ugbu a ma dị mfe nghọta. Ọ naghị etinye ‘onye agbata obi’ n'amaokwu a ebe okwu Grik n'onwe ya bụ ‘onye nke ọzọ.’
- source_word: νόμον
  choice: iwu ahụ
  rationale: Mgbakwunye ‘ahụ’ na-egosi iwu ahụ a maara nke ọma nke Pọl na-ekwu banyere ya, na-enweghị ịgbasa nkọwa n'ime amaokwu ahụ.
- source_word: πεπλήρωκεν
  choice: emezuola
  rationale: Ụdị a na-egosi ihe e mezuru nke nsonaazụ ya ka dị, kwekọọ na perfect tense nke Grik.
theological_decisions:
- issue: Oke mmachibido Pọl banyere iji ụgwọ
  choice: A sụgharịrị okwu ahụ kpọmkwem dị ka mmachibido iji onye ọ bụla ụgwọ, ma e debere ịhụrịta ibe ha n'anya dị ka ihe e wezụga.
  alternative: Ịkọwa ya dị ka mmachibido ịgbaziri ihe n'ụdị ọ bụla, ma ọ bụ dị ka naanị ihe atụ nke ibu ọrụ omume.
  rationale: Amaokwu ahụ na-ekwu okwu n'ụzọ sara mbara banyere ụgwọ ma wepụ ịhụnanya dị ka ibu ọrụ na-adịgide. Nsụgharị ahụ ekwesịghị idozi esemokwu gbasara ụdị ịgbaziri ego niile ma ọ bụ mee ka okwu ụgwọ bụrụ naanị ihe atụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E ji ‘unu’ gosi na iwu ahụ bụ nke ọtụtụ mmadụ, dị ka ngwaa Grik si dị. E zere okwu ụka pụrụ iche na nkọwa ga-ekpebi esemokwu gbasara ụgwọ ego.
