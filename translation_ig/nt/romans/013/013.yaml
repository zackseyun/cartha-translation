  source_fidelity: Nsụgharị ahụ na-anọchi anya usoro mkpali nke περιπατήσωμεν (“Ka anyị na-eje ije”), ihe atụ ὡς ἐν ἡμέρᾳ, na akụkụ atọ nke mgbochi μὴ… μὴ… μὴ… nke ọma. “Oriri aghara,” “ịṅụbiga mmanya ókè,” “omume mmekọahụ rụrụ arụ,” “omume enweghị ihere,” “esemokwu,” na “ekworo” na-ekpuchi ndepụta Grik ahụ n’enweghị ịgbakwunye nkọwa ozizi. “Omume mmekọahụ rụrụ arụ” bụ nsụgharị echiche kwesịrị ekwesị maka κοίταις, ebe “omume enweghị ihere” na-edobe obosara ἀσελγείαις.
  naturalness: Igbo Izugbe a dị mma, dị ugwu, ma doo anya. Usoro ugboro atọ “ọ bụghị… ọ bụghị… ọ bụghịkwa” na-arụ ọrụ nke ọma n’amaokwu a. “Dị ka n’ehihie” na-edobe ihe atụ nke ihe odide Grik ma bụrụ okwu a ghọtara nke ọma n’ọnọdụ a.
  terminology: A họpụtara okwu ndị dabara n’usoro omume ọjọọ ahụ. “Ekworo” dị mma maka ζήλῳ n’ọnọdụ a, ebe ihe odide ala peeji na-edobe “anyaụfụ” dị ka nhọrọ ọzọ. Ihe odide ala peeji a jikọtara n’“omume enweghị ihere,” na b jikọtara n’“ekworo,” ya mere akara ndị ahụ ziri ezi.
