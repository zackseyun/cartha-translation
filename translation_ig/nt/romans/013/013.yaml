id: ROM.13.13
reference: Romans 13:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: ig
  text: 'Ka anyị na-eje ije n''ụzọ kwesịrị ekwesị, dị ka n''ehihie: ọ bụghị n''oriri aghara na ịṅụbiga mmanya ókè, ọ bụghị n''omume mmekọahụ rụrụ arụ na omume enweghị ihere[a], ọ bụghịkwa n''esemokwu na ekworo[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “omume rụrụ arụ nke na-enweghị njide onwe onye.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “anyaụfụ.” Okwu Grik ahụ nwere ike ịpụta ekworo ma ọ bụ anyaụfụ; n'ebe a, ọ nwere echiche na-adịghị mma.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: dị ka n'ehihie
  rationale: Nke a na-edobe ihe atụ Pọl ji ehihie tụnyere ọchịchịrị n'okwu ndị gbara amaokwu a gburugburu, n'etinyeghị nkọwa okpukpe ọzọ na-adịghị n'okwu Grik.
- source_word: εὐσχημόνως
  choice: n'ụzọ kwesịrị ekwesị
  rationale: Ọ na-egosi ibi ndụ n'ụzọ dị mma, kwesị ekwesị, nke ndị ọzọ na-asọpụrụ; okwu Igbo a doro anya ma dịkwa ugwu.
- source_word: περιπατήσωμεν
  choice: Ka anyị na-eje ije
  rationale: A nọgidere n'ihe atụ Pọl ji ije kọwaa ụzọ ndụ, ma ‘Ka anyị’ na-egosipụta ndụmọdụ ma ọ bụ ịkpọ òkù nke ngwaa Grik ahụ.
- source_word: κώμοις
  choice: oriri aghara
  rationale: Ọ na-ezo aka n'oriri mkpọtụ na ndụ ịṅụrị ọṅụ gabigara ókè, nke ịṅụ mmanya na-esokarị; ọ bụghị naanị mmekọahụ rụrụ arụ.
- source_word: μέθαις
  choice: ịṅụbiga mmanya ókè
  rationale: Nke a na-enye echiche nke ịṅụ mmanya ruo n'ókè mmadụ ṅụrụma n'Igbo nkịtị ma doo anya.
- source_word: κοίταις
  choice: omume mmekọahụ rụrụ arụ
  rationale: Ọ bụ ezie na okwu ahụ pụtara ‘akwa’ n'ụzọ nkịtị, n'ebe a ọ bụ akpaalaokwu maka mmekọahụ na-ezighị ezi; ịsụgharị echiche ya na-eme ka isi okwu doo anya.
- source_word: ἀσελγείαις
  choice: omume enweghị ihere
  rationale: Okwu a na-egosi omume rụrụ arụ nke na-enweghị njide ma na-enweghị ihere, ọ na-abụkarịkwa nke metụtara mmekọahụ; nsụgharị a anaghị eme ka ihe ọ pụtara dị warara karịa Grik.
- source_word: ἔριδι
  choice: esemokwu
  rationale: Ọ na-egosi ọgụ okwu, mgbasa nkewa, na ịsọ mpi nke na-akpata ọgba aghara.
- source_word: ζήλῳ
  choice: ekworo
  rationale: N'ime ndepụta omume ọjọọ a, okwu ahụ nwere echiche na-adịghị mma. ‘Ekworo’ dabara n'akụkụ ‘esemokwu,’ ma ‘anyaụfụ’ ka bụkwa nsụgharị kwesịrị ekwesị.
theological_decisions:
- issue: Ihe atụ nke ehihie na ọchịchịrị n'ịkụziri mmadụ otú o kwesịrị isi bie ndụ
  choice: E debere ya dịka ‘dị ka n'ehihie’ n'enweghị ịkọwa ihe atụ ahụ karịa ihe amaokwu ahụ kwuru.
  alternative: dị ka ndị bi n'ìhè ehihie
  rationale: Amaokwu a so n'ihe atụ ehihie na abalị nke dị n'akụkụ ya, ma nsụgharị ekwesịghị itinye nkọwa ozizi ọzọ n'ime okwu ahụ.
- issue: Ihe κοίταις pụtara n'okwu gbasara mmekọahụ
  choice: A sụgharịrị echiche ya dịka ‘omume mmekọahụ rụrụ arụ,’ kama ịsụgharị ya n'ụzọ nkịtị dịka ‘akwa.’
  alternative: akwa
  rationale: ‘Akwa’ agaghị eme ka akpaalaokwu Grik ahụ doo onye na-agụ Igbo anya. Nsụgharị a na-ekwupụta ntụaka doro anya ya n'omume mmekọahụ n'emeghị ka ọ bụrụ otu ụdị mmehie kpọmkwem.
- issue: ζήλῳ nwere ike ịpụta ekworo ma ọ bụ anyaụfụ
  choice: A họọrọ ‘ekworo’ ma debe ‘anyaụfụ’ n'okpuru peeji.
  alternative: anyaụfụ
  rationale: Ọnọdụ ya n'akụkụ esemokwu na ndepụta omume ọjọọ na-achọ echiche na-adịghị mma, ma asụsụ Grik anaghị eme ka a họrọ naanị otu n'ime echiche abụọ ahụ n'ụzọ siri ike.
translation_notes:
  register: 'E ji Igbo Izugbe nke oge a, dị mfe nghọta ma dị ugwu. E debere ihe atụ ‘ije ije’ nke Pọl, ma e jiri okwu nkịtị kọwaa oriri aghara, ịṅụbiga mmanya ókè, na omume mmekọahụ na-ezighị ezi. Ndepụta ahụ ka nwere usoro ụzọ atọ nke Grik: ọ bụghị… ọ bụghị… ọ bụghịkwa.'
