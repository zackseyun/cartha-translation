source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: ig
  text: 'Kwụọnụ onye ọ bụla ihe unu ji ya: onye a ga-akwụ ụtụ isi, kwụọ ya ụtụ isi; onye a ga-akwụ ụgwọ ọchịchị, kwụọ ya ụgwọ ọchịchị; onye a ga-atụ egwu, tụọ ya egwu; onye a ga-asọpụrụ, sọpụrụ ya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Nye ... ihe i ji ya
  rationale: Ọ pụtara ịkwụghachi ma ọ bụ inye ihe mmadụ ji onye ọzọ; nkebiokwu a na-akọwa ụgwọ ahụ n'ụzọ Igbo nkịtị.
- source_word: φόρος
  choice: ụtụ isi
  rationale: Ọ bụ ụtụ ọchịchị na-anakọta kpọmkwem, dị iche na τέλος.
- source_word: τέλος
  choice: ụtụ ahịa
  rationale: N'ọnọdụ a ọ na-ezo aka n'ụtụ ma ọ bụ ụgwọ a na-anakọta n'ahịa, n'ókèala, ma ọ bụ n'ihe ndị a na-ebubata.
- source_word: φόβος
  choice: egwu
  rationale: E debere isi nghọta nke okwu Grik ahụ, 'egwu,' kama ime ka ọ bụrụ naanị nkwanye ùgwù.
- source_word: τιμή
  choice: nsọpụrụ
  rationale: Ọ na-egosi nsọpụrụ ma ọ bụ ùgwù e kwesịrị inye mmadụ.
theological_decisions:
- issue: Ma φόβος a ga-abụ 'egwu' ka ọ bụ 'nkwanye ùgwù'
  choice: egwu
  alternative: nkwanye ùgwù
  rationale: Okwu Grik ahụ bụ φόβος, nke pụtara egwu; ntụgharị ahụ na-edobe esemokwu dị n'okwu ahụ, ebe τιμή na-esochi ya ekwuola nsọpụrụ n'ụzọ doro anya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke dị mfe ma dị ùgwù. E ji usoro ahịrịokwu yiri nke Grik mee ka nkwughachi nke ụdị 'onye ... ruuru, nye ya ...' pụta ìhè n'ụzọ na-ada ka Igbo.
