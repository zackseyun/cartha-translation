  source_fidelity: The draft correctly retains the imperative force of Καὶ τοῦτο, the plural addressee in ὑμᾶς, the wake-from-sleep metaphor, and the open-ended eschatological sense of σωτηρία. However, “oge anyị nọ na ya” adds “that we are in,” which is not expressed by τὸν καιρόν. “Oge eruolarị” conveys ἤδη ὥρα naturally and accurately.
  naturalness: The revised wording is idiomatic Standard Igbo and maintains an appropriately serious exhortational register. “Oge eruolarị ka...” is smoother than the more literal but less natural “ọ bụ ... oge.”
  terminology: “Nzọpụta anyị” appropriately preserves σωτηρία without doctrinal narrowing. “Si n’ụra bilie” naturally preserves ἐξ ὕπνου ἐγερθῆναι. The variant and lexical-alternative footnotes are correctly anchored and accurately describe their respective matters.
