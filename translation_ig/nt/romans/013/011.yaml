id: ROM.13.11
reference: Romans 13:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: ig
  text: 'Meekwa nke a, ebe unu maara oge ahụ: oge eruolarị ka unu si n’ụra bilie[a], n’ihi na nzọpụta anyị dị anyị nso ugbu a karịa mgbe anyị kweere[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ụfọdụ akwụkwọ aka ochie nwere “anyị” kama “unu” n’okwu a: “oge eruolarị ka anyị si n’ụra bilie.”'
    reason: textual_variant
  - marker: b
    text: A pụkwara ịsụgharị ya, “karịa mgbe mbụ anyị kweere.” Grik ahụ kwuru naanị, “mgbe anyị kweere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: Meekwa nke a
  rationale: Ọ na-ezo aka n’ihe a gwara ndị na-agụ akwụkwọ ka ha mee n’amaokwu ndị bu ụzọ; ntụgharị a na-eme ka iwu ahụ doo anya n’Igbo n’etinyeghị echiche ọhụrụ.
- source_word: εἰδότες τὸν καιρόν
  choice: ebe unu maara oge anyị nọ na ya
  rationale: “Ebe unu maara” na-eburu echiche participle ahụ nke nwere ike igosi ihe kpatara ndụmọdụ ahụ; “oge anyị nọ na ya” na-egosi καιρός dịka oge pụrụ iche ma dị mkpa, ọ bụghị naanị oge elekere.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: oge eruola ugbu a ka unu
  rationale: Nke a na-egosipụta ịdị ngwa nke ὥρα na ἤδη n’Igbo nkịtị ma debe onye nke abụọ ọtụtụ nke ὑμᾶς.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: si n’ụra bilie
  rationale: Nke a bụ ụzọ Igbo si ekwu ịkpọte ma bilie n’ụra, ma na-edebe ihe atụ nke ụra n’enweghị ịkọwa ihe ọ pụtara karịa ederede.
- source_word: νῦν γὰρ
  choice: n’ihi na ... ugbu a
  rationale: “N’ihi na” na-egosi ihe kpatara ndụmọdụ ahụ, ebe “ugbu a” na-edebe νῦν.
- source_word: ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: nzọpụta anyị dị anyị nso
  rationale: Nke a na-edebe nzọpụta dịka nke ndị kwere ekwe, ma na-egosikwa na ọ ka na-abịaru nso; e meghị ka ọ bụrụ naanị otu akụkụ nke ozizi nzọpụta.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: karịa mgbe anyị kweere
  rationale: A hapụrụ okwu ahụ n’ụdị ya dị mfe dịka Grik si kwuo ya, n’agbakwụnyeghị “na mbụ” n’ahịrị bụ isi.
theological_decisions:
- issue: Nzọpụta nke a na-ekwu na ọ dị nso ugbu a karịa mgbe ha kweere
  choice: “nzọpụta anyị” n’enweghị ịkọwa ya dịka naanị nzọpụta ikpeazụ ma ọ bụ otu ihe omume kpọmkwem
  alternative: “nzọpụta ikpeazụ anyị” ma ọ bụ “nzọpụta anyị mgbe Onyenwe anyị ga-alọghachi”
  rationale: Ederede ahụ na-ekwu na nzọpụta bụ nke ndị kwere ekwe, ma na-ekwukwa na ọ ka na-abịaru nso. Ya mere, ntụgharị ahụ na-ahapụ mmekọrịta dị n’etiti ihe dị ugbu a na ihe a ka na-atụ anya ya ka ọ dị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma nwee ugwu. A họọrọ “si n’ụra bilie” dịka okwu doro ndị mmadụ anya ma na-edebe ihe atụ ahụ. Akara nkọwa [a] na [b] dị n’ahịrị bụ isi ma kwekọọ na nkọwa ala.
