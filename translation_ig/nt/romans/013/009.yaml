id: ROM.13.9
reference: Romans 13:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: ig
  text: 'N’ihi na: “Akwala iko; egbula mmadụ[a]; ezula ohi; enwela anya ukwu,” ọ bụrụkwa na e nwere iwu ọzọ ọ bụla, a chịkọtara ya n’okwu a[b]: “Hụ onye agbata obi gị n’anya dịka onwe gị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “egbula mmadụ n’ụzọ megidere iwu.” Ngwaa Grik a na-ezokarị aka n’igbu ọchụ, ọ bụghị n’igbu n’ozuzu ya.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na nkwupụta a.” Okwu Grik ahụ nwere ike ịpụta “okwu,” “nkwupụta,” ma ọ bụ “okwu e kwuru” n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: N’ihi na iwu ndị a
  rationale: Akụkụ okwu a na-ewebata iwu ndị Pọl na-achọ ịkpọ aha. Ntughari a na-eme ka njikọ nkọwa γάρ doo anya n’Igbo n’enweghị ntụgharị siri ike nke mkpụrụokwu n’onwe ya.
- source_word: μοιχεύσεις
  choice: Akwala iko
  rationale: Ọ bụ ụzọ Igbo doro anya ma dịkwa nsọpụrụ isi nye iwu megide ịkwa iko; ọ na-ebute ike iwu nke future indicative e ji mee iwu n’akwụkwọ nsọ.
- source_word: φονεύσεις
  choice: egbula ọchụ
  rationale: φονεύω na-ekwu maka igbu mmadụ n’ụzọ megidere iwu, ya bụ igbu ọchụ, ọ bụghị ụdị igbu niile. ‘Egbula ọchụ’ na-edobe nkọwa ahụ nke ọma.
- source_word: κλέψεις
  choice: ezula ohi
  rationale: Nke a bụ okwu Igbo a na-ejikarị enye iwu megide izu ohi, ma na-echekwa ụdị iwu nke ihe e hotara.
- source_word: ἐπιθυμήσεις
  choice: enwela anya ukwu
  rationale: N’ọnọdụ Iwu Iri a, okwu ahụ pụtara ịchọ ihe onye ọzọ nwere n’ụzọ na-ezighị ezi. ‘Inwe anya ukwu’ bụ ụzọ Igbo e si egosipụta echiche a.
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: nakwa iwu ọ bụla ọzọ e nwere
  rationale: Nke a na-echekwa ịdị obosara nke τις na echiche nke iwu ndị ọzọ a na-akpọghị aha.
- source_word: ἀνακεφαλαιοῦται
  choice: a chịkọtara ha niile
  rationale: Ngwaa ahụ pụtara ịchịkọta ihe n’okpuru otu isi ma ọ bụ ime nchịkọta ya. Ịtinye ‘ha niile’ na-eme ka o doo anya n’Igbo na iwu ndị ahụ niile so na nchịkọta ahụ.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: n’okwu a
  rationale: λόγος n’ebe a bụ okwu e kwuru ma ọ bụ nkwupụta zuru ezu, ọ bụghị naanị otu mkpụrụokwu. ‘Okwu a’ na-edobe mkpụmkpụ na ịdị arọ nke asụsụ isi mmalite.
- source_word: Ἀγαπήσεις
  choice: Hụ … n’anya
  rationale: Ụdị a bụ iwu doro anya n’Igbo ma na-echekwa ike iwu nke ihe e hotara n’Akwụkwọ Nsọ.
- source_word: πλησίον
  choice: onye agbata obi gị
  rationale: Nke a bụ ntụgharị a maara nke ọma maka ‘onye nọ mmadụ nso’ ma na-echekwa njikọ ya na Levitikọs.
- source_word: ὡς σεαυτόν
  choice: dịka onwe gị
  rationale: Nke a na-echekwa ntụnyere dị mkpụmkpụ nke Grik n’ebughị nkọwa ọzọ abata.
theological_decisions:
- issue: Ụdị iwu ndị e hotara n’Iwu Iri
  choice: 'Iwu kpọmkwem: ‘Akwala …; egbula …; ezula …; enwela …’'
  alternative: Ụdị amụma nkịtị nke ga-adị ka ‘Ị gaghị …’
  rationale: Ọ bụ ezie na Grik ji future indicative nke usoro ihe odide Iwu Iri, iwu kpọmkwem bụ ụzọ Igbo kacha eke na nke doro anya iji chekwaa ọrụ ya dị ka iwu.
- issue: Oke echiche λόγος n’ahịrịokwu a
  choice: ‘okwu’ dị ka nkwupụta na-achịkọta iwu
  alternative: ‘nkwupụta’ ma ọ bụ ‘okwu e kwuru’
  rationale: Pọl anaghị ekwu maka naanị otu mkpụrụokwu, kama ọ na-ekwu maka ahịrịokwu Akwụkwọ Nsọ nke na-achịkọta iwu. ‘Okwu’ na-echekwa obosara echiche Grik n’emeghị ka nkọwa ya sie oke.
- issue: Oke iwu φονεύσεις
  choice: ‘egbula ọchụ’
  alternative: ‘egbula mmadụ’
  rationale: Nhọrọ a na-egosi igbu mmadụ n’ụzọ megidere iwu, ma zere ime ka iwu ahụ yie ka ọ na-ekwu maka ụdị igbu niile n’enweghị ọdịiche.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma nwee nsọpụrụ, dee ya. E debere usoro iwu n’ụdị mkpụmkpụ siri ike nke dabara n’Igbo. A hazigharịrị akara nkọwa ala peeji ka [a] soro ‘egbula ọchụ,’ ebe [b] soro ‘okwu a,’ n’ihi na nke ahụ bụ ebe ọdịnaya nkọwa ndị ahụ metụtara n’ezie.
