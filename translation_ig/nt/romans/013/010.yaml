  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: ig
  text: Ịhụnanya anaghị eme onye agbata obi ihe ọjọọ[a]; ya mere, ịhụnanya bụ mmezu nke iwu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ịhụnanya anaghị emerụ onye agbata obi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịhụnanya bụ mmejupụta nke iwu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị asụgharị ἀγάπη; iji ya ugboro abụọ na-echekwa nkwughachi okwu Pọl.
- source_word: τῷ πλησίον
  choice: onye agbata obi
  rationale: Nke a na-egosi onye omume ahụ metụtara ma na-echekwa echiche πλησίον, ya bụ mmadụ ibe mmadụ e kwesịrị ịhụ n’anya.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: adịghị emere ... ihe ọjọọ
  rationale: Nkebiokwu a na-asụ Igbo nke ọma ma na-egosi ime ma ọ bụ ịkpata ihe ọjọọ nye onye ọzọ, n’ebughị ụzọ belata κακόν ka ọ bụrụ naanị mmerụ ahụ.
- source_word: πλήρωμα
  choice: mmezu
  rationale: “Mmezu” na-egosi ihe na-eme ka iwu ruo ebumnuche ya, ma na-echekwa ụdị ahịrịokwu aha nke Grik.
- source_word: οὖν
  choice: ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl wepụtara n’ihe o kwuru tupu ya.
- source_word: νόμου
  choice: nke iwu
  rationale: “Iwu” na-ezo aka n’iwu a maara ama n’ọnọdụ a, ọkachasị Iwu Mosis.
theological_decisions:
- issue: Mmekọrịta ịhụnanya na iwu
  choice: ịhụnanya bụ mmezu nke iwu
  alternative: ịhụnanya na-emezu iwu
  rationale: Nhọrọ a na-echekwa ahịrịokwu aha nke Grik ma ghara ịgbanwe ya ka ọ bụrụ naanị nkwupụta omume; ọ na-ahapụkwa ịdị arọ nke okwu Pọl otú ọ dị.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. E debere nkwughachi “ịhụnanya” na nhazi nkwubi okwu nke amaokwu ahụ.
