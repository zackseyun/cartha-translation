  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: ig
  text: N’ihi ya, ọ dị mkpa ido onwe onye n’okpuru ha[a], ọ bụghị nanị n’ihi iwe[b], kama n’ihi akọnuche kwa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịnọ n’okpuru ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ntaramahụhụ.” Okwu Grik ahụ pụtara “iwe”; ọ pụrụ izo aka n’omume onye ọchịchị ji enye ntaramahụhụ, ma ọ bụ n’ụzọ sara mbara karị, n’iwe Chineke nke na-arụ ọrụ site n’aka ndị ọchịchị.
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: N’ihi ya
  rationale: Njikọ a na-egosi nkwubi okwu sitere n’ihe e kwuru banyere ndị ọchịchị n’amaokwu ndị bu ụzọ.
- source_word: ἀνάγκη
  choice: ọ dị mkpa
  rationale: Nke a na-egosipụta mkpa dị n’ime okwu Grik ahụ n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ὑποτάσσεσθαι
  choice: ido onwe onye n’okpuru ha
  rationale: Nke a na-egosi mmadụ iji aka ya nabata ịnọ n’okpuru ndị ọchịchị a kpọtụrụ aha na gburugburu okwu ahụ, n’etinyeghị echiche na ọ pụtara irube isi n’ihe niile n’enweghị oke.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: ọ bụghị nanị … kama … kwa
  rationale: Usoro a na-egosipụta njikọ ntụnyere na mgbakwunye dị n’asụsụ Grik n’ụzọ e ji asụ Igbo ugbu a.
- source_word: διὰ τὴν ὀργὴν
  choice: n’ihi iwe
  rationale: “Iwe” na-echekwa isi okwu ὀργή ma hapụ ya ka ọ ghara ikpebi ma ọ bụ iwe Chineke ka ọ bụ ntaramahụhụ onye ọchịchị na-eweta.
- source_word: διὰ τὴν συνείδησιν
  choice: n’ihi akọnuche
  rationale: Nke a na-egosi na akọnuche mmadụ bụkwa ihe mere o ji kwesị ido onwe ya n’okpuru ndị ọchịchị.
theological_decisions:
- issue: Onye iwe ahụ (ὀργή) bụ nke ya
  choice: E dere ya naanị dịka “iwe.”
  alternative: iwe Chineke; ma ọ bụ ntaramahụhụ/ iwe onye ọchịchị
  rationale: Gịnị kpọmkwem iwe ahụ na-ezo aka na ya apụtaghị ìhè n’amaokwu a. G gburugburu okwu ahụ nwere ma nhazi Chineke ma onye ọchịchị nke na-ebu mma agha, ya mere nsụgharị ahụ echekwala nghọta abụọ ahụ.
- issue: Ike okwu ὑποτάσσεσθαι n’ihe gbasara ndị ọchịchị
  choice: ido onwe onye n’okpuru ha
  alternative: ịnọ n’okpuru ha
  rationale: Nhọrọ a na-egosi ọnọdụ onye kwesịrị iji obi ya were kweta ọchịchị, ma ọ naghị etinye ozizi nke irube isi n’ihe niile n’enweghị oke.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. A tinyere “ha” iji mee ka ntụaka nye ndị ọchịchị e kwuru okwu ha n’amaokwu ndị bu ụzọ doo anya n’Igbo, n’agbanyeghị na Grik hapụrụ ihe ὑποτάσσεσθαι na-achị n’ekwughị ya ọzọ.
