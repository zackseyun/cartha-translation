id: ROM.13.2
reference: Romans 13:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: ig
  text: N’ihi ya, onye na-emegide ikike ahụ na-emegide ndokwa Chineke[a]; ndị guzogidere ikike ahụ ga-ewetara onwe ha ikpe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “usoro Chineke” ma ọ bụ “ihe Chineke nyere n’iwu.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ikpe” ebe a dịka “ikpe ọmụma” ma ọ bụ “mkpebi ikpe,” ma okwu Grik ahụ n’onwe ya anaghị amanye nghọta siri ike nke ikpe ọmụma ikpeazụ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru n’amaokwu bu ụzọ; nkebi a na-egosipụta njikọ ahụ nke ọma n’Igbo ugbu a.
- source_word: ὁ ἀντιτασσόμενος
  choice: onye na-emegide
  rationale: Ọ na-egosi onye ọ bụla nke na-eguzogide ihe a na-ekwu maka ya, ma na-edobe omume ahụ dị ka ihe na-aga n’ihu.
- source_word: τῇ ἐξουσίᾳ
  choice: ikike ahụ
  rationale: Ọ na-edobe otu ọnụọgụ dị n’asụsụ Grik, ebe ihe ndị gbara amaokwu ahụ gburugburu na-eme ka o doo anya na ọ bụ ikike ọchịchị ka a na-ekwu maka ya.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: usoro Chineke guzobere
  rationale: “Usoro” na “guzobere” na-egosi ihe Chineke haziri ma ọ bụ kpebie ka ọ dị, n’enweghị ime ka okwu ahụ bụrụ iwu e dere ede kpọmkwem.
- source_word: ἀνθέστηκεν
  choice: na-emegide
  rationale: Igbo eke anaghị achọ ka a sụgharịa perfect Grik n’ụzọ ga-ada arọ; okwu a na-egosi ọnọdụ mmegide ahụ ma na-edobekwa njikọ ya na participle bu ụzọ.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: ndị na-emegidekwa ya
  rationale: Ọ na-ezo aka n’ìgwè ndị guzogidere usoro ahụ; “ya” na-eme ka ihe a na-emegide doo anya n’Igbo.
- source_word: ἑαυτοῖς
  choice: n’isi ha
  rationale: Akpaalaokwu Igbo a na-egosi na ihe ga-esi na omume ahụ pụta ga-adakwasị ndị mere ya onwe ha.
- source_word: κρίμα
  choice: ikpe
  rationale: “Ikpe” nwere obosara nke okwu Grik a ma ọ dịghị amanye nghọta nke ikpe ọmụma ebighị ebi.
- source_word: λήμψονται
  choice: ga-anata
  rationale: Ọ na-edobe ihe ga-eme n’ọdịnihu nakwa echiche nke ịnata ihe si n’omume ha pụta.
theological_decisions:
- issue: Oke ihe κρίμα pụtara
  choice: ikpe
  alternative: ikpe ọmụma
  rationale: Amaokwu ahụ dọrọ aka ná ntị banyere ikpe, ma o kwughị hoo haa na ọ bụ ikpe ọmụma ebighị ebi; ya mere, a hapụrụ obosara na esemokwu dị n’okwu Grik ahụ.
- issue: Ihe ἐξουσία na-ezo aka na ya
  choice: ikike ahụ, nke ihe ndị gbara ya gburugburu na-egosi na ọ bụ ikike ọchịchị
  alternative: ikike n’ozuzu ya
  rationale: Ndị Rom 13:1 na-ekwu banyere ikike ndị na-achị achị, ma ide “ikike ahụ” na-edobe ụdị okwu Grik ma ghara itinye nkọwa karịa ihe dị mkpa n’amaokwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “usoro Chineke guzobere” iji zere ụda iwu gọọmenti naanị nke “ordinance,” ebe “ikpe” na-edobe obosara nke κρίμα. Akpaalaokwu “n’isi ha” na-ekwupụta ἑαυτοῖς n’ụzọ eke.
