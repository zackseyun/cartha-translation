  verdict: revise
  source_fidelity: 'The temporal and ethical imagery is retained well: abalị/ụbọchị and ọchịchịrị/ìhè correspond directly to νύξ/ἡμέρα and σκότος/φῶς. The paired hortatory force of ἀποβαλώμεθα and ἐνδυσώμεθα is also conveyed. A small genitive clarification is advisable so that ‘works of darkness’ is not heard merely as ‘dark works.’'
  naturalness: The wording is clear Standard Igbo and its elevated but accessible register suits Paul’s exhortation. ‘Abalị agaala nke ukwuu’ and ‘ụbọchị abịala nso’ are natural. Revising ‘ọrụ ọchịchịrị’ to ‘ọrụ nke ọchịchịrị’ is more explicit and idiomatic for the Greek genitive relation.
  terminology: ‘Ekike agha nke ìhè’ appropriately represents ὅπλα τοῦ φωτός in view of the command to put it on, while the footnote properly preserves ‘ngwa agha’ as an alternative. ‘Yipụ’ and ‘yiri’ preserve the clothing metaphor.
  issues:
