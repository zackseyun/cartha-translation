    issue: The phrase ‘ọrụ ọchịchịrị’ can be read adjectivally as ‘dark works.’
    rationale: The Greek τὰ ἔργα τοῦ σκότους explicitly uses a genitive, ‘the works of darkness.’ ‘Ọrụ nke ọchịchịrị’ makes that relationship clear without adding interpretation.
