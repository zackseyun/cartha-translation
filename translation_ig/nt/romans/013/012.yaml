id: ROM.13.12
reference: Romans 13:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: ig
  text: Abalị agaala nke ukwuu[a]; ụbọchị abịala nso. Ya mere, ka anyị yipụ ọrụ nke ọchịchịrị, yirikwa ekike agha nke ìhè[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Abalị agawo n’ihu.” Ngwaa Grik ahụ na-egosi abalị dịka ihe gara n’ihu, ya bụ, nke fọrọ nke nta ka ọ gwụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ngwa agha nke ìhè.”
    reason: alternative_reading
lexical_decisions:
- source_word: νὺξ
  choice: abalị
  rationale: A sụgharịrị ya kpọmkwem ka e wee chekwaa ihe atụ nke oge nke na-emegide ‘ụbọchị’; okwu banyere ọchịchịrị n’ahịrị na-esote na-egosikwa akụkụ omume ya.
- source_word: προέκοψεν
  choice: agaala nke ukwuu
  rationale: Ngwaa Grik a na-egosi ịga n’ihu ma ọ bụ iru ebe dị anya. N’Igbo, ‘abalị agaala nke ukwuu’ na-egosi n’ụzọ ebumpụta ụwa na abalị agafeela nke ukwuu, ma ọ naghị akọwa ihe atụ ahụ karịa ihe odide si kwuo.
- source_word: ἡμέρα
  choice: ụbọchị
  rationale: A hapụrụ ihe atụ ahụ n’ụdị nkịtị ya iji chekwaa mmegide dị n’etiti abalị na ụbọchị.
- source_word: ἤγγικεν
  choice: abịala nso
  rationale: Nke a na-egosi ma ịbịaru nso nke mere eme ma ọnọdụ dị ugbu a nke si na ya pụta, dịka perfect tense Grik si eme.
- source_word: ἀποβαλώμεθα
  choice: ka anyị yipụ
  rationale: Ọ bụ hortatory subjunctive, ya bụ oku ka ndị niile na-ekwu okwu mee ihe. ‘Yipụ’ na-echekwa ihe atụ nke iwepụ uwe ma jikọọ nke ọma na ‘yiri’ nke na-esote.
- source_word: ἔργα
  choice: ọrụ
  rationale: ‘Ọrụ’ bụ okwu sara mbara ma bụrụkwa okwu Pọl na-ejikarị eme ihe maka ihe mmadụ na-eme; ọ naghị agbakwunye nkọwa na-adịghị n’isi mmalite.
- source_word: σκότους
  choice: ọchịchịrị
  rationale: Nke a bụ nsụgharị kpọmkwem nke genitive ahụ ma na-echekwa ihe atụ metụtara omume na oge ikpeazụ.
- source_word: ἐνδυσώμεθα
  choice: ka anyị … yirikwa
  rationale: Ọ bụ hortatory subjunctive nke abụọ, nke e jikọtara na nke mbụ. ‘Yiri’ bụ okwu Igbo ebumpụta ụwa maka itinye uwe ma na-akwado ihe atụ nke iyiri ihe agha.
- source_word: ὅπλα
  choice: ekike agha
  rationale: Ὅπλα nwere ike ịpụta ngwa agha ma ọ bụ ihe agha. N’ihi ngwaa ‘yiri,’ ‘ekike agha’ na-egosi ihe nchebe a na-eyi n’agha ma na-edobe ihe atụ agha ahụ; e tinyere ‘ngwa agha’ n’okpuru peeji dị ka nhọrọ ọzọ.
- source_word: φωτός
  choice: ìhè
  rationale: A sụgharịrị ya kpọmkwem iji chekwaa mmegide dị n’etiti ìhè na ọchịchịrị na-enweghị ịkọwa ihe nnọchianya ahụ gabiga ókè.
theological_decisions:
- issue: Ihe atụ banyere oge ikpeazụ nke abalị na ụbọchị
  choice: E debere ‘abalị’ na ‘ụbọchị’ dịka ihe atụ nke oge, ebe ihe ha pụtara banyere omume na akụkọ nzọpụta ka na-apụta n’enweghị nkọwa agbakwunyere.
  alternative: Ịsụgharị ya n’ụzọ nkọwa dịka ‘oge ọchịchịrị a na-agwụcha’ na ‘ụbọchị ọhụrụ ahụ dị nso.’
  rationale: Okwu Grik ahụ nwere ma echiche oge ma echiche omume. Ịkọwapụta ya nke ukwuu ga-eme ka otu nkọwa merie nghọta ndị ọzọ dị n’ihe atụ ahụ.
- issue: Ihe ὅπλα τοῦ φωτός pụtara
  choice: ekike agha nke ìhè
  alternative: ngwa agha nke ìhè
  rationale: Ngwaa ‘yiri’ na-akwado ihe agha a na-eyi, ma ὅπλα nwekwara ike izo aka n’ụdị ngwa agha dị iche iche. Ya mere, e debere nghọta sara mbara ahụ n’okpuru peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma doo ndị nkịtị anya. E debere usoro ihe atụ nke iyipụ na iyiri, tinyere mmegide abalị/ụbọchị na ọchịchịrị/ìhè. Akara ụda dị na ‘ìhè’ na-enyere aka izere mgbagwoju anya, ebe mkpụrụ okwu na akara edemede ndị ọzọ na-agbaso ide Igbo nke oge a.
