  rationale: 'Only a minor wording revision is made: adding ‘nke’ makes the genitive relation in ‘works of darkness’ explicit in natural Standard Igbo. The temporal metaphor, the balanced exhortations to cast off and put on, and the lexical ambiguity of ὅπλα are otherwise preserved.'
