revisions:
- from: N’ihi na ọ bụ onye na-ejere Chineke ozi maka ọdịmma gị. Ma ọ bụrụ na ị na-eme ihe ọjọọ, tụọ egwu, n’ihi na ọ bụghị n’efu ka ọ na-ebu mma agha[a]. N’ihi na ọ bụ onye na-ejere Chineke ozi, onye na-abọ ọbọ maka iwe megide onye na-eme ihe ọjọọ[b].
  to: N’ihi na ọ bụ onye na-ejere Chineke ozi maka ọdịmma gị. Ma ọ bụrụ na ị na-eme ihe ọjọọ, tụọ egwu, n’ihi na ọ bụghị n’efu ka ọ na-ebu mma agha[a]. N’ihi na ọ bụ onye na-ejere Chineke ozi, onye na-eweta iwe n’ahụ onye na-eme ihe ọjọọ[b].
  rationale: The revision changes only the final clause to an idiomatic Standard Igbo expression for the authority as God's punitive agent. It preserves “iwe” without identifying it explicitly as God's wrath, thereby retaining the Greek wording's theological restraint. The sword image and the lexical alternative for εἰκῇ remain intact.
