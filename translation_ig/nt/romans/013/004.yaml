id: ROM.13.4
reference: Romans 13:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: ig
  text: N’ihi na ọ bụ onye na-ejere Chineke ozi maka ọdịmma gị. Ma ọ bụrụ na ị na-eme ihe ọjọọ, tụọ egwu, n’ihi na ọ bụghị n’efu ka ọ na-ebu mma agha[a]. N’ihi na ọ bụ onye na-ejere Chineke ozi, onye na-eweta iwe n’ahụ onye na-eme ihe ọjọọ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’enweghị nzube.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye na-abọ ọbọ maka iwe megide onye na-eme ihe ọjọọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: onye na-ejere Chineke ozi
  rationale: Nkebiokwu a na-egosi onye na-arụ ọrụ e nyere ya n’okpuru Chineke. Ọ doro ndị Igbo nke oge a anya ma zere ime ka okwu ahụ bụrụ naanị ọkwa ọrụ ụka.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: maka ọdịmma gị
  rationale: Nke a na-egosipụta nzube bara onye a na-agwa uru, ọ bụghị naanị ntụziaka ‘n’ebe ị nọ.’
- source_word: τὸ κακὸν ποιῇς
  choice: ị na-eme ihe ọjọọ
  rationale: Ọ na-edobe echiche omume ọjọọ dị na κακόν n’asụsụ Igbo dị mfe ma bụrụ nke e ji eme ihe ugbu a.
- source_word: φοβοῦ
  choice: tụọ egwu
  rationale: Nke a bụ iwu doro anya ma kwekọọ n’egwu ntaramahụhụ nke ikike ahụ nwere ike iweta.
- source_word: εἰκῇ
  choice: ọ bụghị n’efu
  rationale: Ọ na-egosi na ibu mma agha ahụ abụghị ihe na-enweghị nzube ma ọ bụ ihe efu.
- source_word: μάχαιραν φορεῖ
  choice: ọ na-ebu mma agha
  rationale: ‘Mma agha’ na-edobe ihe oyiyi doro anya nke Grik, ebe ‘na-ebu’ na-egosi ibu ya dịka akara ikike na-adịgide adịgide.
- source_word: ἔκδικος
  choice: onye na-abọ ọbọ
  rationale: Ọ na-edobe ike nkwụghachi ikpe dị n’okwu Grik, n’agbanyeghị na ọ pụkwara ịpụta onye na-eme ka ikpe ziri ezi ruo onye mere ihe ọjọọ.
- source_word: εἰς ὀργὴν
  choice: maka iwe
  rationale: Nsụgharị dị mkpirikpi a na-edobe okwu Grik n’enweghị ịkọwapụta hoo haa ma iwe ahụ ọ bụ iwe Chineke, iwe onye ọchịchị, ma ọ bụ ntaramahụhụ a na-eweta.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: megide onye na-eme ihe ọjọọ
  rationale: Ọ na-egosipụta onye omume ya ji ime ihe ọjọọ mara, ma na-edobe mmekọrịta mmegide dị n’ahịrịokwu ahụ.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ọrụ ntaramahụhụ nke ikike ọchịchị na iwe Chineke
  choice: onye na-abọ ọbọ maka iwe megide onye na-eme ihe ọjọọ
  alternative: onye na-eweta iwe n’ahụ onye na-eme ihe ọjọọ
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi na ikike ọchịchị na-arụ ọrụ n’okpuru Chineke, ma εἰς ὀργὴν ekwughị hoo haa ‘iwe Chineke.’ Ya mere, e debere nkọwa ahụ n’enweghị itinye okwu Grik na-ekwughị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘onye na-ejere Chineke ozi’ kama okwu nwere ike ịdị ka aha ọkwa ụka. E debere ihe oyiyi ‘mma agha’ na mgbagwoju anya dị na ‘iwe’ n’enweghị ịgbakwunye nkọwa otu òtù okpukpe.
