review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the authority as God's servant, its beneficial role, fear in the case of wrongdoing, and the concrete image of bearing a sword. The final phrase is semantically recoverable, but its current Igbo construction is less clear and less idiomatic for ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
  naturalness: “Onye na-abọ ọbọ maka iwe megide ...” is syntactically heavy and can suggest personal retaliation rather than the authority's punitive function. “Onye na-eweta iwe n’ahụ ...” is natural Standard Igbo and clearly expresses the Greek phrase without specifying whose wrath it is.
  terminology: “Onye na-ejere Chineke ozi,” “ọdịmma gị,” “tụọ egwu,” and “mma agha” are appropriate, clear Standard Igbo renderings. “Iwe” properly preserves the Greek ambiguity and should not be expanded to “iwe Chineke” in the text.
  issues:
  - severity: medium
    issue: The final main-text clause is awkward and potentially misleading.
    rationale: The expression “onye na-abọ ọbọ maka iwe megide onye na-eme ihe ọjọọ” is not a natural way to express an agent who inflicts or brings wrath upon a wrongdoer. It may foreground retaliatory vengeance, whereas ἔκδικος in this civic context denotes a punitive/justice-executing agent. Recasting it as “onye na-eweta iwe n’ahụ onye na-eme ihe ọjọọ” retains the source's unqualified ὀργή while reading naturally.
  revised_text: N’ihi na ọ bụ onye na-ejere Chineke ozi maka ọdịmma gị. Ma ọ bụrụ na ị na-eme ihe ọjọọ, tụọ egwu, n’ihi na ọ bụghị n’efu ka ọ na-ebu mma agha[a]. N’ihi na ọ bụ onye na-ejere Chineke ozi, onye na-eweta iwe n’ahụ onye na-eme ihe ọjọọ[b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’enweghị nzube.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye na-abọ ọbọ maka iwe megide onye na-eme ihe ọjọọ.”
    reason: alternative_reading
  revision_rationale: The revision changes only the final clause to an idiomatic Standard Igbo expression for the authority as God's punitive agent. It preserves “iwe” without identifying it explicitly as God's wrath, thereby retaining the Greek wording's theological restraint. The sword image and the lexical alternative for εἰκῇ remain intact.
