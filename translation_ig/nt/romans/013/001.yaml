revisions:
- from: Ka onye ọ bụla doo onwe ya n'okpuru ndị ọchịchị nọ n'ọkwa dị elu[a], n'ihi na ọ dịghị ikike ọchịchị dị ma ọ bụghị nke sitere n'aka Chineke; ndị dị adị bụkwa ndị Chineke debere n'usoro[b].
  to: Ka onye ọ bụla doo onwe ya n’okpuru ndị ọchịchị ka elu[a], n’ihi na ọ dịghị ikike ọ bụla dị ma ọ bụghị nke sitere n’aka Chineke; ndị ọchịchị dị adị bụkwa ndị Chineke debere n’usoro[b].
  rationale: 'The revision removes the unsupported phrase in footnote a and adopts a more idiomatic primary expression for ἐξουσίαις ὑπερεχούσαις. It preserves the source’s scope: authority is from God, and existing governing authorities have been ordered by God, without expanding this into an assertion that all their actions are approved.'
