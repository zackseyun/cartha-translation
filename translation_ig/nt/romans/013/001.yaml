id: ROM.13.1
reference: Romans 13:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: ig
  text: Ka onye ọ bụla doo onwe ya n’okpuru ndị ọchịchị ka elu[a], n’ihi na ọ dịghị ikike ọ bụla dị ma ọ bụghị nke sitere n’aka Chineke; ndị ọchịchị dị adị bụkwa ndị Chineke debere n’usoro[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ọchịchị nọ n’ọkwa dị elu,” ma ọ bụ, “ndị ọchịchị nọ n’elu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị Chineke họpụtara,” ma ọ bụ, “ndị Chineke guzobere.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: onye ọ bụla
  rationale: Ọ bụ ezie na okwu Grik ahụ pụtara n'ụzọ nkịtị ‘mkpụrụobi ọ bụla,’ ọ bụ akpaalaokwu na-ezo aka n’onye ọ bụla; nsụgharị a bụ Igbo nkịtị ma na-edobe echiche nke onye n’otu n’otu.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: ndị ọchịchị nọ n'ọkwa dị elu
  rationale: ἐξουσίαις na-ezo aka n’ọchịchị ma ọ bụ ndị ji ikike ahụ, ebe ὑπερεχούσαις pụtara ndị nọ n’elu ma ọ bụ n’ọkwa ka elu. Nhọrọ a na-egosi ọrụ ọchịchị ha ma na-edobekwa ihe oyiyi nke ịdị n’ọkwa dị elu.
- source_word: ὑποτασσέσθω
  choice: doo onwe ya n'okpuru
  rationale: Nke a na-egosi ịnọ n’okpuru usoro ọchịchị, n’enweghị itinye echiche siri ike karịa ihe ngwaa Grik ahụ kwuru.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: ọ dịghị ikike ọchịchị dị ma ọ bụghị nke sitere n'aka Chineke
  rationale: ‘Sitere n’aka Chineke’ na-egosi Chineke dịka isi mmalite nke ikike ahụ, ebe ‘ikike ọchịchị’ na-eme ka ihe ἐξουσία na-ekwu n’ọnọdụ a doo anya.
- source_word: αἱ δὲ οὖσαι
  choice: ndị dị adị
  rationale: Nkebi a na-alaghachi n’ebe ndị ọchịchị a kpọtụrụ aha nọ; nsụgharị ahụ dị nkenke ma na-edobe ihe Grik kwuru.
- source_word: τεταγμέναι
  choice: ndị Chineke debere n'usoro
  rationale: Perfect passive nke τάσσω na-egosi ọnọdụ sitere n’ịhazi ma ọ bụ idobe n’usoro. ‘Debere n’usoro’ na-edobe obosara okwu ahụ karịa ịhọrọ naanị ‘họpụtara.’
theological_decisions:
- issue: Ókè na ike nke okwu Pọl banyere ndị ọchịchị na Chineke
  choice: E gosiri na ikike ọchịchị sitere n'aka Chineke, nakwa na ndị ọchịchị dị adị nọ n'usoro Chineke debere.
  alternative: Ịsụgharị ya dịka nkwado Chineke na-akwado ọchịchị ọ bụla na omume ya niile, ma ọ bụ dịka okwu gbasara echiche ikike naanị, ọ bụghị ndị ọchịchị dị adị.
  rationale: Grik ahụ na-ekwu banyere ndị ọchịchị n’ezie ma kwuo na Chineke edebela ndị dị adị n’usoro. Nsụgharị ahụ na-edobe nkwupụta a ma ọ naghị agbakwunye na Chineke kwadoro omume ọ bụla onye ọchịchị na-eme.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘doo onwe ya n’okpuru’ iji kwupụta nrube isi n’usoro n’enweghị ikwubiga ihe ókè; ‘debere n’usoro’ na-edobe obosara na esemokwu nke τεταγμέναι.
