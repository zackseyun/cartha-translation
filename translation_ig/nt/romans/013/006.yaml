  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: ig
  text: N’ihi nke a kwa ka unu na-akwụ ụtụ isi, n’ihi na ha bụ ndị na-ejere Chineke ozi, ndị na-arara onwe ha nye ọrụ a kpọmkwem mgbe niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: unu ji atụ ụtụ isi
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-eji ekwu ịkwụ ụtụ a na-anakọta maka ọchịchị.
- source_word: λειτουργοὶ ... θεοῦ
  choice: ndị na-ejere Chineke ozi
  rationale: λειτουργοί pụtara ndị na-arụ ọrụ ọha ma ọ bụ ndị na-eje ozi; nsụgharị a na-echekwa echiche nke ịbụ ndị na-ejere Chineke ozi n’enweghị itinye aha ụka pụrụ iche.
- source_word: προσκαρτεροῦντες
  choice: ndị na-etinye onwe ha mgbe niile
  rationale: Ọ na-egosi ịnọgide na-elekwasị anya na ọrụ ma na-arara onwe onye nye ya.
- source_word: εἰς αὐτὸ τοῦτο
  choice: n’ọrụ a kpọmkwem
  rationale: 'Na-egosipụta ike okwu ahụ: ọ bụ kpọmkwem ọrụ ịchị na ịnakọta ụtụ a ka a na-ekwu maka ya.'
theological_decisions:
- issue: Ma ‘ndị na-ejere Chineke ozi’ ọ na-egosi nkwado Chineke nye omume ọchịchị niile
  choice: E debere okwu ahụ n’ụdị njikọ ya na ọrụ a kpọmkwem.
  alternative: Ịsụgharị ya n’ụzọ ga-ekwu na ọchịchị niile na omume ya niile bụ nke Chineke kwadoro.
  rationale: Grik kpọrọ ha λειτουργοὶ θεοῦ ma jikọta ọrụ ha na εἰς αὐτὸ τοῦτο; nsụgharị ekwesịghị ịgbasa nkwupụta ahụ karịa ihe amaokwu ahụ kwuru.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, kwụ ọtọ, ma nwee ugwu. E ji ‘unu’ chekwaa onye nke abụọ n’ọnụọgụ ọtụtụ nke τελεῖτε.
