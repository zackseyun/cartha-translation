- from: Ọ bụkwa n’ihi nke a ka unu ji atụ ụtụ isi, n’ihi na ha bụ ndị na-ejere Chineke ozi, ndị na-etinye onwe ha mgbe niile n’ọrụ a kpọmkwem.
  to: N’ihi nke a kwa ka unu na-akwụ ụtụ isi, n’ihi na ha bụ ndị na-ejere Chineke ozi, ndị na-arara onwe ha nye ọrụ a kpọmkwem mgbe niile.
