source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: ig
  text: Kama, yikwasịnụ Onyenwe anyị Jizọs, bú Mesaya; unu emekwala ndokwa maka anụ ahụ iji meju ọchịchọ ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu emela ndokwa ọ bụla maka ọdịdị mmehie iji meju ọchịchọ ya.” Grik kwuru “anụ ahụ,” okwu Pọl na-ejikarị akọwa ọchịchọ mmadụ dara ada nke na-emegide ndụ Chineke na-edu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: yikwasịnụ ... dị ka uwe
  rationale: Okwu iwu a ji ihe oyiyi iyi uwe akọwa ịnabata ụzọ ndụ na njirimara nke Onyenwe anyị Jizọs; nsụgharị a na-edobe ihe oyiyi ahụ ma na-eme ka ọ doo anya n'Igbo.
- source_word: κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ e nyere Jizọs, nke na-edobe ịdị arọ nke κύριος n'ọnọdụ a.
- source_word: Χριστόν
  choice: Mesaya
  rationale: N'ebe a, Χριστός bụ aha ọkwa, ọ bụghị naanị akụkụ aha mmadụ; “Mesaya” na-egosipụta ihe aha ọkwa ahụ pụtara.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: unu echekwala otú unu ga-esi gboo
  rationale: πρόνοια ya na ποιεῖσθε na-ekwu maka iche echiche ma ọ bụ ime atụmatụ tupu oge eruo; okwu Igbo a na-egosipụta nke ahụ n'ụzọ nkịtị.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: A họọrọ okwu nkịtị nke na-edobe ihe atụ Pọl na esemokwu nkọwa ya, kama ịkọwa ya ozugbo dị ka “ọdịdị mmehie.”
- source_word: εἰς ἐπιθυμίας
  choice: gboo agụụ
  rationale: Nkebi a na-egosi ebe atụmatụ ahụ na-eduga—imeju ọchịchọ anụ ahụ—ma “agụụ” na-eburu echiche nke ọchịchọ siri ike n'ọnọdụ omume a.
theological_decisions:
- issue: Ihe σάρξ pụtara n'okwu ndụ omume nke Pọl
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: Ọ bụ ezie na ebe a okwu ahụ metụtara ọchịchọ mmadụ dara ada, ịsụgharị ya “ọdịdị mmehie” ga-eme ka otu nkọwa bụrụ nke a họpụtara kpamkpam. “Anụ ahụ” na-edobe okwu ihe atụ Pọl na mgbagwoju anya nkà mmụta okpukpe ya.
- issue: Χριστός dị ka aha ọkwa ma ọ bụ aha mmadụ
  choice: Mesaya
  alternative: Kraịst
  rationale: N'usoro “Onyenwe anyị Jizọs Χριστός,” okwu ahụ ka na-ebu ọrụ aha ọkwa; “Mesaya” na-eme ka ihe aha ahụ pụtara pụta ìhè n'enweghị itinye ozizi otu ụka.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ugwu ma dị mfe nghọta. “Yikwasịnụ ... dị ka uwe” na-edobe ihe oyiyi iyi uwe; “bú Mesaya” na-egosipụta aha ọkwa ahụ n'ụzọ Igbo nkịtị. Akara nkọwa ala peeji [a] dị n'ahịrị isi.
