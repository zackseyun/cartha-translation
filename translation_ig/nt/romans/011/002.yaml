id: ROM.11.2
reference: Romans 11:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: ig
  text: Chineke ajụbeghị ndị ya, ndị ọ maara tupu oge eruo.[a] Ma ọ bụ na unu amaghị ihe Akwụkwọ Nsọ kwuru n’ihe banyere Ịlaịja—otu o si arịọ Chineke megide Izrel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị ọ maara n’oge gara aga.” Ụfọdụ na-aghọta okwu Grik a n’ụzọ siri ike dịka nke na-egosi nhọpụta tupu oge eruo, ma okwu ahụ n’onwe ya pụtara “ịma tupu oge eruo.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “otu o si rịọsi Chineke ike megide Izrel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: ajụghị
  rationale: N’ebe a, okwu a pụtara ịjụ ma ọ bụ ịchụpụ. “Ajụghị” bụ okwu Igbo doro anya nke na-egosi na Chineke agbahapụbeghị ndị ya.
- source_word: τὸν λαὸν αὐτοῦ
  choice: ndị ya
  rationale: Nke a na-egosipụta ndị nke Chineke, karịsịa n’echiche nke ndị ya na ha gbara ndụ, n’etinyeghị “Izrel” n’ahịrịokwu mbụ ebe e kpọrọ aha ahụ n’ụzọ doro anya n’ikpeazụ.
- source_word: ὃν προέγνω
  choice: bú ndị ọ maara tupu oge eruo
  rationale: Nsụgharị a na-edebe isi echiche nke ịma tupu oge eruo, ma ọ naghị agbanwe ya ka ọ bụrụ “ndị ọ họọrọ tupu oge eruo,” nke ga-ekpebi esemokwu nkà mmụta okpukpe nke okwu Grik ahụ n’onwe ya na-ahapụghị kpamkpam.
- source_word: ἢ οὐκ οἴδατε
  choice: Ka ọ̀ bụ na unu amaghị
  rationale: Nke a bụ ajụjụ nkwuwa okwu Pọl ji ewebata ihe atụ sitere n’Akwụkwọ Nsọ; usoro Igbo a bụ nke eke ma doo anya.
- source_word: ἐν Ἠλίᾳ
  choice: n’akụkụ ahụ gbasara Ịlaịja
  rationale: Akpaalaokwu Grik a na-ezo aka n’akụkụ Akwụkwọ Nsọ nke na-ekwu banyere Ịlaịja, ọ bụghị ịnọ ‘n’ime Ịlaịja.’
- source_word: ἡ γραφή
  choice: Akwụkwọ Nsọ
  rationale: N’ojiji Pọl, okwu a na-ezo aka n’ihe odide dị nsọ; “Akwụkwọ Nsọ” bụ okwu Igbo a na-aghọta nke ọma.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: otu o si rịọ Chineke arịrịọ
  rationale: Okwu ahụ nwere ike ịpụta ịrịọ, ịrịọsi arịrịọ ike, ma ọ bụ ịrịọchitere; ebe arịrịọ a dị megide Izrel, “rịọ Chineke arịrịọ” na-ezere echiche na ọ na-arịọchitere Izrel ihe ọma.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: megide Izrel
  rationale: κατά ya na genitive ebe a pụtara mmegide; e debere aha Izrel dịka aha ndị ahụ.
theological_decisions:
- issue: Ihe προέγνω pụtara n’ihe gbasara nhọpụta Chineke
  choice: ndị ọ maara tupu oge eruo
  alternative: ndị ọ họọrọ tupu oge eruo; ndị ọ hụrụ n’anya tupu oge eruo
  rationale: Nsụgharị ahụ na-edebe ihe okwu Grik kwuru kpọmkwem n’enweghị itinye nkọwa otu ụka banyere nhọpụta Chineke. Ihe odide bụ isi na-ahapụ esemokwu dị n’etiti ịma tupu oge eruo na nghọta siri ike banyere nhọpụta ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Bú” na-eme ka njikọ dị n’etiti “ndị ya” na “ndị ọ maara tupu oge eruo” doo anya; “n’akụkụ ahụ gbasara Ịlaịja” na-akọwa akpaalaokwu Grik n’ụzọ eke. E tinyere akara ụkwụ [a] na [b] n’ebe ha metụtara n’ihe odide.
