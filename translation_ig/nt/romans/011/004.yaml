  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: ig
  text: Ma gịnị ka nzaghachi Chineke[a] gwara ya? “Edobere m[b] puku ndị ikom asaa maka onwe m, bụ ndị na-ekpubeghị ikpere nye Baal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “azịza sitere n’aka Chineke,” ma ọ bụ “okwu amụma ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “echekwabara m ha maka onwe m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: nzaghachi Chineke
  rationale: N’ebe a, okwu ahụ bụ nzaghachi sitere n’aka Chineke nye Ịlaịja. Nhọrọ a doro ndị na-agụ Igbo anya ma na-echekwa ikike Chineke dị na nzaghachi ahụ.
- source_word: Κατέλιπον
  choice: Edobere m
  rationale: Ọ na-egosi ihe Chineke mere nke rụpụtara na ndị fọdụrụ ka dị; ‘edobere m’ na-ekwupụta idobe ma ọ bụ ichekwa ha nke ọma.
- source_word: ἐμαυτῷ
  choice: nye onwe m
  rationale: 'Ọ na-echekwa dative reflexive ahụ: Chineke debere ndị a nye onwe ya.'
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: puku ndị ikom asaa
  rationale: A na-echekwa ọnụ ọgụgụ ahụ na aha nwoke doro anya ἄνδρας, kama ịgbanwe ya ka ọ bụrụ okwu izugbe maka mmadụ niile.
- source_word: οἵτινες
  choice: bụ́ ndị
  rationale: Ụdị a na-ewebata nkọwa na-akọwapụta ndị ikom puku asaa ahụ n’Igbo dị mma.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: na-egbubeghị ikpere n’ala
  rationale: Nke a na-echekwa onyinyo nke igbuda ikpere dị ka nrube isi n’ofufe, ma bụrụkwa okwu ndị Igbo na-aghọta nke ọma.
- source_word: τῇ Βάαλ
  choice: nye Bel
  rationale: A sụgharịghị aha chi ahụ kama e dere ya n’ụdị a na-ejikarị ede Baal n’Igbo; ‘nye’ na-egosi onye a na-efe site n’ịgbuda ikpere.
theological_decisions:
- issue: Ma a ga-eme ka o doo anya na nzaghachi ahụ sitere n’aka Chineke
  choice: nzaghachi Chineke
  alternative: nzaghachi ahụ; okwu amụma ahụ
  rationale: Ọnọdụ okwu a na isi mmalite ya n’Agba Ochie na-eme ka o doo anya na Chineke bụ onye zara Ịlaịja. Nke a anaghị atụkwasị ozizi ọzọ n’amaokwu ahụ.
- issue: Otú e si asụgharị ἄνδρας n’ihe gbasara okike nwoke
  choice: ndị ikom
  alternative: ndị mmadụ
  rationale: Okwu Grik ahụ bụ aha na-ekwu kpọmkwem banyere ndị nwoke; ya mere nsụgharị ahụ echekwala nkọwa ahụ kama ime ya okwu izugbe.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta mee ihe. ‘Gbuo ikpere n’ala’ na-echekwa ihe atụ nke Grik ma na-egosikwa ofufe na nrube isi. E debere akara nkọwa ụkwụ [a] na [b] n’ebe okwu ndị ha na-akọwa dị.
