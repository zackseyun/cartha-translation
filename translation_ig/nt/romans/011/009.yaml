  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: ig
  text: Devid na-ekwu, sị, “Ka tebụl ha ghọọ ọnyà na ọnyà e ji achụ nta[a], na ihe ịsụ ngọngọ, na nkwụghachi nye ha[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọnyà na ụgbụ ịchụ nta”; okwu abụọ a fọrọ nke nta ka ha nwee otu ihe ha pụtara—ihe e ji ama mmadụ ma ọ bụ anụ n'ọnyà.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ụgwọ mmegwara” ma ọ bụ “ụgwọ omume ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: Devid
  rationale: Ụdị a bụ mkpọpụta aha ahụ nke a na-ejikarị eme ihe n'Igbo.
- source_word: λέγει
  choice: na-ekwu
  rationale: E ji oge ugbu a chekwaa ụdị okwu akụkọ e ji kpọbata ihe e dere n'Akwụkwọ Nsọ.
- source_word: Γενηθήτω
  choice: Ka ... ghọọ
  rationale: Nke a na-egosipụta ike iwu ma ọ bụ arịrịọ dị n'ụdị imperative Grik, n'emeghị ka ọ ghọọ nanị amụma.
- source_word: τράπεζα
  choice: tebụl
  rationale: A hapụrụ ihe oyiyi ahụ dịka ihe a na-ahụ anya, kama ịkọwa ya ozugbo dịka nri ma ọ bụ oriri.
- source_word: παγίδα
  choice: ọnyà
  rationale: Ọ bụ okwu Igbo doro anya maka ihe e ji ama mmadụ ma ọ bụ anụmanụ n'ọnyà.
- source_word: θήραν
  choice: ọnyà e ji achụ nta
  rationale: Nke a na-egosipụta njikọ okwu ahụ na ịchụ nta ma na-echekwa ya dịka okwu nke abụọ yiri ‘ọnyà.’
- source_word: σκάνδαλον
  choice: ihe ga-eme ka ha sụọ ngọngọ
  rationale: Nkọwa a bụ Igbo ebumpụta ụwa ma na-echekwa ihe oyiyi nke ihe na-akpata ọdịda.
- source_word: ἀνταπόδομα
  choice: nkwụghachi
  rationale: ‘Nkwụghachi’ na-egosipụta ihe a na-enyeghachi mmadụ dịka ihe omume ya si dị, n'ebughị ụzọ mechie ma ọ bụ ụgwọ ọrụ ọma ka ọ bụ ntaramahụhụ, ọ bụ ezie na gburugburu okwu a na-egosi ikpe.
- source_word: αὐτοῖς
  choice: nye ha
  rationale: Nke a na-egosipụta onye nkwụghachi ahụ na-erute n'ụzọ doro anya n'Igbo.
theological_decisions:
- issue: Arịrịọ ikpe e hotara n'Abụ Ọma 69:22
  choice: Ka tebụl ha ghọọ...
  alternative: Tebụl ha ga-aghọ...
  rationale: A chekwara arịrịọ ma ọ bụ iwu dị n'okwu Grik, kama ime ka ọ bụrụ naanị amụma; nke a na-ahapụ ịdị arọ na esemokwu nkà mmụta okpukpe nke okwu ahụ ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ‘tebụl’ dịka ihe oyiyi kpọmkwem; e jikwa ahịrịokwu nkọwa mee σκάνδαλον ka echiche ịsụ ngọngọ doo anya n'Igbo.
