revisions:
- from: Ọ bụrụkwa na mkpụrụ mbụ e nyere Chineke dị nsọ, ntụ ọka ahụ niile a gwakọtara agwakọta dịkwa nsọ; ọ bụrụkwa na mgbọrọgwụ dị nsọ, alaka ya dịkwa nsọ.
  to: Ọ bụrụ na mkpụrụ mbụ dị nsọ, ngwakọta ntụ ọka ahụ dum dịkwa nsọ; ọ bụrụkwa na mgbọrọgwụ dị nsọ, alaka ndị ahụ dịkwa nsọ.
  rationale: The revision keeps Paul’s compact parallelism, the ambiguity concerning the nature of holiness, and the agricultural/dough metaphors. It removes two small additions not explicit in the Greek and uses more idiomatic wording for the dough mixture.
