  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: ig
  text: Ọ bụrụ na mkpụrụ mbụ dị nsọ, ngwakọta ntụ ọka ahụ dum dịkwa nsọ; ọ bụrụkwa na mgbọrọgwụ dị nsọ, alaka ndị ahụ dịkwa nsọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: mkpụrụ mbụ e nyere Chineke
  rationale: Nke a na-egosi òkè mbụ a na-enye Chineke, ma debe echiche ofufe na ọgbụgba ndụ dị n'okwu Grik ahụ; ọ bụkwa okwu ndị Igbo taa ga-aghọta nke ọma.
- source_word: ἁγία
  choice: dị nsọ
  rationale: “Dị nsọ” na-edebe otu okwu ahụ n'akụkụ abụọ ma ghara ịkọwa ma ịdị nsọ ahụ ọ bụ nke ọgbụgba ndụ, nke nnọchite anya, ma ọ bụ nke nzọpụta.
- source_word: φύραμα
  choice: ntụ ọka ahụ niile a gwakọtara agwakọta
  rationale: Ọ na-akọwa ntụ ọka e jikọtara mee otu ngwakọta, nke bụ ihe φύραμα na-ezo aka na ya, ma mee ka onyinyo ahụ doo onye na-agụ Igbo anya.
- source_word: ῥίζα
  choice: mgbọrọgwụ
  rationale: Nke a bụ okwu Igbo kwụ ọtọ ma zie ezi maka onyinyo osisi ahụ.
- source_word: κλάδοι
  choice: alaka
  rationale: “Alaka” bụ okwu Igbo a na-ejikarị eme ihe maka akụkụ osisi ndị si n'ogwe ma ọ bụ mgbọrọgwụ pụta, kwekọọkwa n'onyinyo osisi oliv gbara amaokwu a gburugburu.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: Ọ bụrụkwa na ... dị nsọ, ... dịkwa nsọ; ọ bụrụkwa na ... dị nsọ, ... dịkwa nsọ
  rationale: Nhazi a na-egosipụta njikọ δέ na καί n'ụzọ ebumpụta ụwa n'Igbo ma mejupụta ngwaa ndị Grik hapụrụ n'ahịrị nke abụọ, n'enweghị ịgbakwunye nkọwa ọzọ.
theological_decisions:
- issue: Ụdị ịdị nsọ dị n'onyinyo mkpụrụ mbụ/mgbọrọgwụ na ntụ ọka/alaka
  choice: E ji “dị nsọ” sụgharịa ya n'akọwaghị kpọmkwem ụdị ịdị nsọ ahụ.
  alternative: A pụrụ ịsị “e doro nsọ” iji mee ka echiche nke ido ihe iche nye Chineke pụta ìhè.
  rationale: Amaokwu ahụ na-egosi na ịdị nsọ nke òkè mbụ ma ọ bụ mgbọrọgwụ metụtara ihe fọdụrụ na alaka, ma ọ kọwaghị ma mmekọrịta ahụ ọ bụ nke ọgbụgba ndụ, nnọchite anya, agbụrụ, ma ọ bụ nzọpụta. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe a ka ọ dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọpụrụ ma dị mfe nghọta. A zere okwu ụka pụrụ iche na nkọwa nke ga-emechi ihe amaokwu ahụ hapụrụ ghe oghe.
