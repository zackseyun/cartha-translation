  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: ig
  text: N’ihi na ònye maara uche Onyenweanyị? Ma ọ bụ ònye ghọrọ onye ndụmọdụ ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pọl na-ekwughachi okwu dị n’Aịzaya 40:13, ebe ihe odide Grik na-ajụkwa onye maara uche Onyenweanyị ma ọ bụ onye ghọrọ onye ndụmọdụ ya.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: ònye
  rationale: Nnọchiaha ajụjụ a na-amalite ajụjụ nkwupụta; “ònye” bụ okwu Igbo doro anya ma na-edobe ike ajụjụ ahụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka ihe na-akwado ya; “N’ihi na” na-egosipụta njikọ nkọwa ahụ nke ọma.
- source_word: ἔγνω
  choice: maara
  rationale: Okwu a pụtara ịma; n’ajụjụ nkwupụta a, “maara” bụ Igbo ebumpụta ụwa nke na-adịghị agbakwunye nkọwa nke ‘ịghọta’ n’ime ihe odide ahụ.
- source_word: νοῦν
  choice: uche
  rationale: “Uche” na-egosi echiche, nzube, ma ọ bụ nghọta mmadụ, ya mere ọ na-edobe obosara ihe νοῦς pụrụ ịpụta n’ebe a.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ nsụgharị Igbo a na-ejikarị eme κύριος mgbe ọ na-ezo aka n’ebe Chineke nọ, ma ọ naghị etinye aha Chineke sitere n’azụ Aịzaya n’ime isi okwu.
- source_word: ἢ
  choice: Ma ọ bụ
  rationale: Ọ na-edobe njikọ nkewa na usoro ajụjụ abụọ dị na Grik.
- source_word: σύμβουλος
  choice: onye ndụmọdụ
  rationale: Ọ bụ onye na-enye ndụmọdụ; okwu a bụ Igbo nke oge a, doro anya, ma kwesịkwa ekwesị n’olu dị nsọ.
- source_word: αὐτοῦ
  choice: ya
  rationale: “Ya” bụ nnọchiaha onwunwe ebumpụta ụwa n’Igbo ma na-egosi njikọ ahụ nke ọma.
- source_word: ἐγένετο
  choice: ghọrọ
  rationale: Ọ na-edobe isi echiche γίνομαι nke ịbụ ma ọ bụ ịghọ ihe; n’ajụjụ nkwupụta a ọ pụtara na ọ dịghị onye bịara n’ọnọdụ ịbụ onye ndụmọdụ Chineke.
theological_decisions:
- issue: Onye “Onyenwe anyị” na-ezo aka na ya n’okwu sitere n’Aịzaya
  choice: E debere ya dịka “Onyenwe anyị,” na-enweghị ime ka ihe odide ahụ kwuo ihe karịrị Grik; n’ọnọdụ a ọ na-ezo aka n’ebe Chineke nọ.
  alternative: Iji nsụgharị ga-egosipụta aha ọgbụgba ndụ Chineke nke ọma karịa n’ihi ndabere Aịzaya 40:13.
  rationale: Ihe odide Grik nwere κυρίου. E kwesịrị idobe okwu Agba Ọhụrụ ahụ ma ghara ibubata ụdị aha dị n’azụ Hibru n’ime isi amaokwu.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro ajụjụ nkwupụta abụọ ahụ na olu nke okwu Akwụkwọ Nsọ.
