    text: Pọl na-ekwughachi okwu dị n’Aịzaya 40:13, ebe ihe odide Grik na-ajụkwa onye maara uche Onyenweanyị ma ọ bụ onye ghọrọ onye ndụmọdụ ya.
    reason: cross_reference
  revision_rationale: The revision preserves the Greek syntax and rhetorical force while correcting the potentially misleading separation of the conventional divine title. It also makes the cross-reference note more exact without adding interpretive claims.
