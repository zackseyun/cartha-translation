  source_fidelity: 'The principal sense is retained: the verse addresses the Lord, reports the killing of the prophets and destruction of the altars, states Elijah''s solitary survival, and says that his life is being sought. However, “kwatukwaa” does not appropriately express the completed plural action of κατέσκαψαν in this clause. “ha kwaturu” clearly renders the aorist action, ‘they tore down/demolished.’'
  naturalness: The revised wording is natural, dignified Standard Igbo. The retained “ọ bụkwa naanị m fọdụrụ” suitably conveys the emphatic ‘and I alone was left.’
  terminology: “Onyenwe anyị” is an established reverential Igbo form of address for God; “ndị amụma,” “ebe ịchụàjà,” and “ndụ m” are apt. The footnote correctly identifies mkpụrụobi as a more literal lexical alternative while explaining the idiomatic sense.
