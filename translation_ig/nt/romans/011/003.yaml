    issue: “kwatukwaa” is not the appropriate completed verbal form for the Greek aorist κατέσκαψαν.
    rationale: 'The source reports a past completed act: ‘they tore down your altars.’ Replacing it with “kwaturu” gives a clear, grammatical Standard Igbo past rendering without adding meaning.'
