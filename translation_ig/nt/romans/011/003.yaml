id: ROM.11.3
reference: Romans 11:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: ig
  text: “Onyenwe anyị, ha gburu ndị amụma gị, ha kwaturu ebe ịchụàjà gị; ọ bụkwa naanị m fọdụrụ, ha na-achọkwa ndụ m.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ nkịtị karị, “ha na-achọ mkpụrụobi m”; n'ebe a, akpaalaokwu Grik ahụ pụtara “ha na-achọ ndụ m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ okwu a na-eji akpọ Chineke kpọmkwem; “Onyenwe anyị” bụ ntụgharị Igbo a maara nke ọma ma kwesịkwa ekwesị n'okwu Agba Ọhụrụ.
- source_word: ἀπέκτειναν
  choice: ha gburu
  rationale: “Gburu” na-enye ihe ngwaa Grik ahụ pụtara n'ụzọ doro anya, n'etinyeghị echiche ọzọ dị ka nke okwu “gburu ọchụ” pụrụ ịgbakwunye.
- source_word: θυσιαστήριά
  choice: ebe ịchụàjà
  rationale: Okwu a na-ezo aka n'ebe a na-achụrụ Chineke àjà; okwu Igbo a bụ nke doro ndị na-agụ akwụkwọ anya.
- source_word: κατέσκαψαν
  choice: kwatukwaa
  rationale: “Kwatụrụ” na-egosi ịkwatu ihe ahụ ruo n'ala ma dabara nke ọma n'ihe e mere ebe ịchụàjà.
- source_word: κἀγὼ
  choice: ọ bụkwa ... m
  rationale: Usoro a na-edobe njikọ nke καί na nkwusi ike dị n'ἐγώ n'Igbo eke, n'agbakwụnyeghị “ọbụna” nke pụrụ ime ka nkwusi ike gabiga ókè.
- source_word: ὑπελείφθην μόνος
  choice: ọ bụkwa naanị m fọdụrụ
  rationale: Nke a na-edobe echiche na onye na-ekwu okwu hụrụ onwe ya dị ka naanị onye fọdụrụ, ọ bụghị naanị mmetụta nke ịnọ naanị ya.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: ha na-achọkwa ndụ m
  rationale: N'ahịrịokwu a, ψυχή pụtara ndụ mmadụ a na-achọ iwepụ, ọ bụghị mkpụrụobi dị iche n'ahụ; ntụgharị a na-edobekwa akpaalaokwu ahụ kama ịkọwa ya kpamkpam dịka “ha na-achọ igbu m.”
theological_decisions:
- issue: Ntụgharị ψυχή n'ahịrịokwu iyi ndụ egwu
  choice: ndụ m
  alternative: mkpụrụobi m
  rationale: N'ebe a, okwu Grik ahụ na-ezo aka ná ndụ Ịlaịja nke ndị mmadụ chọrọ iwepụ, ọ bụghị n'ozizi banyere mkpụrụobi mmadụ. “Ndụ m” na-ezere ibubata ajụjụ nkà mmụta okpukpe na-adịghị n'uche amaokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E debere usoro okwu ahụ n'ụdị okwu Ịlaịja gwara Chineke, ma jiri njikọ “-kwaa/-kwa” mee ka mmegharị nkebiokwu ndị ahụ bụrụ nke eke n'Igbo.
