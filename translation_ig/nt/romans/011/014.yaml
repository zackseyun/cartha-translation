reference: Romans 11:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴ πως παραζηλώσω μου τὴν σάρκα καὶ σώσω τινὰς ἐξ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: ig
  text: ma ọ bụrụ na m nwere ike n’ụzọ ọ bụla kpalite ndị nke m[a] ka ha nwee ekworo, wee zọpụta ụfọdụ n’ime ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị ikwu m,” ya bụ, ndị Juu ibe m; n’ụzọ nkịtị, “anụ ahụ m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: ma eleghị anya
  rationale: Nke a na-egosi olileanya ma ọ bụ ebumnuche Pọl nke na-ejighị n'aka, n'asụsụ Igbo dị mfe ma kwekọọ n'okwu Grik.
- source_word: παραζηλώσω
  choice: m ga-akpali ... ka ha nwee ekworo
  rationale: Ọ na-echekwa echiche nke ịkpali ekworo, nke jikọrọ amaokwu a na isiokwu gbasara ekworo Izrel n'akụkụ ya.
- source_word: μου τὴν σάρκα
  choice: ndị nke m[a]
  rationale: N'ọnọdụ a, okwu nkịtị bụ ‘anụ ahụ m,’ ma ọ bụ akpaalaokwu na-ezo aka n'agbụrụ na ndị ikwu Pọl, ya bụ ndị Juu ibe ya. ‘Ndị nke m’ na-enye echiche ahụ n'Igbo eke, ebe nkọwa ala peeji na-echekwa ihe okwu ahụ pụtara kpọmkwem.
- source_word: σώσω
  choice: zọpụta
  rationale: ‘Zọpụta’ na-echekwa ibu okwu nzọpụta nke ngwaa a na akwụkwọ Pọl.
- source_word: τινὰς ἐξ αὐτῶν
  choice: ụfọdụ n’ime ha
  rationale: Nke a na-egosi nke ọma na ọ bụ naanị ụfọdụ ndị si n'ìgwè ahụ ka a na-ekwu maka ha.
theological_decisions:
- issue: Ihe σάρξ pụtara mgbe Pọl ji ya na-ezo aka n’ìgwè agbụrụ ya
  choice: ndị nke m, ya bụ ndị Juu ibe Pọl
  alternative: anụ ahụ m
  rationale: N'ebe a, σάρξ abụghị ‘ọdịdị mmehie,’ kama ọ na-egosi njikọ sitere n'anụ ahụ, agbụrụ, na ikwu. Isi ederede na-eji okwu Igbo a ga-aghọta ozugbo, ebe nkọwa na-egosi akpaalaokwu Grik ahụ n'ụzọ ziri ezi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị nke m’ mee ka akpaalaokwu kinship nke Grik pụta n'ụzọ eke, ma debe nkọwa ya kpọmkwem n'ala peeji.
