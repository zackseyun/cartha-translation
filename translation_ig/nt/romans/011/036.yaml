  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: ig
  text: N’ihi na ihe niile sitere na ya, ọ bụkwa site na ya ka ha dị, ọ bụkwa maka ya ka ha dị.[a] Ka otuto dịrị ya ruo mgbe ebighị ebi.[b] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụkwa n’ebe ya ka ha dị.”
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “ruo n’ọgbọ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-egosi ihe kpatara otuto e kwuru n’amaokwu ndị bu ụzọ; okwu a na-edobe njikọ nke ihe kpatara ya.
- source_word: ἐξ αὐτοῦ
  choice: si n’aka ya
  rationale: Ọ na-egosi na ọ bụ ya bụ isi mmalite ihe niile; nke a bụkwa ụzọ Igbo si ekwu ya n’ụzọ doro anya ma dị mma.
- source_word: δι’ αὐτοῦ
  choice: dị site n’aka ya
  rationale: διά na genitive na-egosi onye ma ọ bụ ụzọ e si mee ihe. Nsụgharị a na-edobe echiche ahụ n’ejighị okwu ndị ọzọ akọwapụta ya gabiga ókè.
- source_word: εἰς αὐτὸν
  choice: na-agakwa n’ebe ọ nọ
  rationale: εἰς nwere ike igosi ebe ihe na-aga, njedebe ya, ma ọ bụ ebumnuche ya. Nhọrọ a na-edobe ntụgharị ahụ n’ebe ọ nọ n’akọwaghị ya naanị dị ka ‘maka ya.’
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Ọ na-egosi ihe niile n’ozuzu ya ma na-edobe obosara okwu Pọl.
- source_word: αὐτῷ ἡ δόξα
  choice: Ka otuto dịrị ya
  rationale: Nkebiokwu Grik ahụ enweghị ngwaa ma bụrụ okwu e ji enye Chineke otuto. ‘Ka otuto dịrị ya’ bụ ụzọ Igbo dị ndụ, dị ùgwù, nke na-edobe ike ofufe dị n’okwu ahụ.
- source_word: εἰς τοὺς αἰῶνας
  choice: ruo mgbe ebighị ebi
  rationale: Ọ bụ akpaalaokwu pụtara oge na-enweghị njedebe; nsụgharị a bụ nke ndị Igbo taa na-aghọta nke ọma.
- source_word: ἀμήν
  choice: Amen
  rationale: E debere okwu ofufe a dịka a na-ejikarị ya eme ihe n’Igbo.
theological_decisions:
- issue: Onye nnọchiaha αὐτοῦ/αὐτὸν/αὐτῷ na-ezo aka na ya
  choice: E debere ‘ya’ ugboro niile, ebe ihe gbara amaokwu ahụ gburugburu na-egosi na ọ bụ Chineke ka a na-ekwu maka ya.
  alternative: Iji ‘Chineke’ dochie nnọchiaha ndị ahụ.
  rationale: Idobe nnọchiaha ndị ahụ na-echekwa usoro okwu na ike nkwupụta nke Grik, n’etinyeghị nkọwa n’ime amaokwu ahụ n’onwe ya.
- issue: Ihe εἰς αὐτόν pụtara
  choice: na-agakwa n’ebe ọ nọ
  alternative: bụkwa maka ya
  rationale: Nhọrọ ahụ na-echekwa echiche nke ebe ihe na-aga ma ọ bụ njedebe ya, ebe ‘maka ya’ ga-akọwapụta ya kpọmkwem dị ka ebumnuche ma belata obosara okwu Grik.
- issue: Ụdị okwu otuto αὐτῷ ἡ δόξα
  choice: Ka otuto dịrị ya
  alternative: Otuto bụ nke ya
  rationale: Nke a na-egosipụta ya dị ka nkwupụta ofufe, n’etinyeghị ozizi ọzọ na-adịghị n’okwu Grik.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere usoro atọ—isi n’aka ya, ịdị site n’aka ya, na ịga n’ebe ọ nọ—iji gosipụta nhazi na obosara nke okwu Grik.
