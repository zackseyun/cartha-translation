    text: Ma ọ bụ, “ọ bụkwa n’ebe ya ka ha dị.”
    reason: lexical_alternative
  - marker: b
    text: N’okwu nkịtị, “ruo n’ọgbọ niile.”
    reason: lexical_alternative
  revision_rationale: 'The revision retains the causal force of ὅτι and the rhetorical threefold structure: all things have their source in him, exist through him, and are oriented toward him. It replaces non-idiomatic and overly spatial wording with natural Standard Igbo. The pronouns are retained, as in Greek, and no doctrinal interpretation is added.'
