id: ROM.11.12
reference: Romans 11:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: ig
  text: Ma ọ bụrụ na ndahie ha ewetara ụwa akụnụba, mfu ha[a] ewetarakwa ndị mba ọzọ akụnụba, ọ̀ bụkwaghị njupụta ha[b] ga-eweta akụnụba karị nke ukwuu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “ọdịda ha” ma ọ bụ “mbelata ha” n’ọnọdụ “mfu ha.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị “ọnụ ọgụgụ ha zuru ezu” ma ọ bụ “nnabata ha zuru ezu” n’ọnọdụ “njupụta ha.”
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: ndahie
  rationale: “Ndahie” na-egosi nzọụkwụ na-ezighị ezi ma ọ bụ mmebi iwu, ya mere ọ na-echekwa nghọta omume dị na okwu Grik ahụ n’enweghị ịkọwa ya gabiga ókè.
- source_word: πλοῦτος
  choice: akụnụba
  rationale: “Akụnụba” na-echekwa ihe atụ nke ụba ngọzi ma na-ada nke ọma n’Igbo ugbu a.
- source_word: κόσμου
  choice: ụwa
  rationale: “Ụwa” bụ nsụgharị sara mbara ma kwekọọ n’ebe a, ebe a na-ekwu banyere ndị nọ n’èzí Izrel.
- source_word: ἥττημα
  choice: mfu
  rationale: Okwu Grik a pụrụ ịpụta mfu, ọdịda, ma ọ bụ mbelata. “Mfu” na-ahapụ nghọta ahụ ka ọ saa mbara, ebe ndetu ala na-egosi nhọrọ ndị ọzọ.
- source_word: ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ebe a, okwu ahụ na-egosi ndị na-abụghị ndị Juu, n’ọdịiche dị n’etiti Izrel na mba ndị ọzọ.
- source_word: πόσῳ μᾶλλον
  choice: ọ̀ bụkwaghị … karị nke ukwuu
  rationale: Nke a na-egosipụta arụmụka sitere n’ihe nta ruo n’ihe ka ukwuu n’ụzọ Igbo na-aghọta nke ọma.
- source_word: πλήρωμα
  choice: njupụta
  rationale: “Njupụta” na-echekwa obosara okwu Grik ahụ, na-ekpebighị ma ihe a na-ekwu bụ ọnụ ọgụgụ ha zuru ezu, nnabata ha zuru ezu, ma ọ bụ mweghachi ha.
theological_decisions:
- issue: Ihe “njupụta ha” (τὸ πλήρωμα αὐτῶν) pụtara kpọmkwem
  choice: E jiri “njupụta ha” mee ka okwu ahụ nọgide saa mbara.
  alternative: ọnụ ọgụgụ ha zuru ezu; nnabata ha zuru ezu; mmezu ma ọ bụ mweghachi ha
  rationale: Okwu Pọl dị mkpụmkpụ ma nwee ọtụtụ nghọta o nwere ike ibu. Ịhọrọ otu n’ime ha n’ahịrị bụ isi ga-ekpebi ajụjụ nkà mmụta okpukpe nke amaokwu Grik ahụ n’onwe ya na-ekpebighị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nhazi arụmụka nke amaokwu ahụ, tinyere nkwughachi “akụnụba,” iji mee ka ntụnyere Pọl doo anya. E tinyere ihe a na-aghọta n’ahịrị ikpeazụ—na njupụta ha ga-eweta akụnụba karịa—n’ụzọ dị nta iji mee ka ahịrịokwu Grik ahụ na-enweghị ngwaa bụrụ Igbo zuru oke, n’enweghị idozi ihe “njupụta” pụtara.
