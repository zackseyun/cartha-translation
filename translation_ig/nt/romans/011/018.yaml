    issue: Footnote [a] is malformed and semantically unclear.
    rationale: “Eguzogidela alaka ndị ahụ megide ha na-anya isi” does not naturally mean “do not boast against the branches” and introduces an unclear reflexive/subject relationship. It must be replaced with a clear Igbo lexical alternative.
  - severity: low
    issue: “na-akwagide” is less natural here than “na-akwado.”
    rationale: Although it can suggest propping something up, “na-akwado” is the ordinary modern Igbo expression for providing sustaining support and better fits the contrast between root and branches.
