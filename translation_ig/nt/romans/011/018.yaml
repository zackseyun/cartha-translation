  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: ig
  text: Ejila alaka ndị ahụ anya isi[a]. Ma ọ bụrụ na ị na-eji ha anya isi, ọ bụghị gị na-akwado mgbọrọgwụ[b]; kama, ọ bụ mgbọrọgwụ na-akwado gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ekwula okwu ịnya isi megide alaka ndị ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ọ bụghị gị na-ebu mgbọrọgwụ; ọ bụ mgbọrọgwụ na-ebu gị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: jiri ... anya isi
  rationale: Nkebi okwu a na-egosi iji mmadụ ndị ọzọ anya isi n’ụzọ na-egosi na onye ahụ ka ha mma. O kwekọrọ n’usoro okwu Igbo nke oge a ma na-edobe mmekọrịta κατά na-egosi.
- source_word: κλάδων
  choice: alaka ndị ahụ
  rationale: “Ndị ahụ” na-egosi na Pọl na-ekwu banyere alaka ndị a kpọtụrụla aha n’ihe atụ osisi oliv ahụ.
- source_word: ῥίζαν / ῥίζα
  choice: mgbọrọgwụ
  rationale: E ji otu okwu ahụ mee ihe ugboro abụọ iji chekwaa ihe atụ osisi na echiche nke ebe ndụ na nkwado si abịa.
- source_word: βαστάζεις
  choice: na-akwagide
  rationale: N’ebe a, okwu ahụ pụtara ibu ma ọ bụ ịkwado ihe ka ọ dịgide. “Na-akwagide” na-eme ka echiche nkwado ahụ doo anya, ma ọ ka na-adabara ihe atụ osisi.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: ọ bụghị gị na-akwagide mgbọrọgwụ; ọ bụ mgbọrọgwụ na-akwagide gị
  rationale: Usoro a na-edobe nkwusi ike dị n’ịtụ “gị” na “mgbọrọgwụ” n’ihu ibe ha, tinyere ntụgharị nke onye na-adabere n’ebe onye ọzọ nọ.
- source_word: μὴ
  choice: Ejila
  rationale: Nke a bụ mmachibido iwu kwụ ọtọ ma dị ndụ n’Igbo, n’enweghị ịgbakwụnye nkọwa banyere ma omume ahụ amalitela ma ọ bụ na ọ na-aga n’ihu.
theological_decisions:
- issue: Ihe mgbọrọgwụ na alaka pụtara n’ihe atụ osisi oliv Pọl
  choice: E debere ihe atụ ahụ n’enweghị ịkọwa kpọmkwem ndị mgbọrọgwụ ma ọ bụ alaka nọchiri anya ha.
  alternative: Ịkọwa mgbọrọgwụ n’ime amaokwu ahụ dị ka ndị nna ochie, Ebreham, ma ọ bụ nkwa ọgbụgba ndụ.
  rationale: Grik na-enye ihe atụ ahụ n’enweghị nkọwa kpọmkwem. Ịkọwa ya n’ime ntụgharị ga-etinye nkọwa onye ntụgharị n’ebe ihe odide ahụ hapụrụ ka ihe ndị gbara ya gburugburu kọwaa ya.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ osisi ahụ na nkwusi ike nke ahịrịokwu Grik. Akara ndetu ala peeji [a] na [b] dị n’isi ederede.
