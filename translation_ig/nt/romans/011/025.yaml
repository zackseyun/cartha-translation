revisions:
- from: 'N’ihi na achọghị m ka unu ghara ịma[a], ụmụnna m, ihe omimi a, ka unu ghara ịbụ ndị maara ihe n’anya onwe unu: obi ịkpọ nkụ abịakwasịwo otu akụkụ nke Izrel ruo mgbe izu oke nke ndị mba ọzọ ga-abata[b],'
  to: 'N’ihi na achọghị m ka unu ghara ịma[a], ụmụnna m, ihe omimi a, ka unu ghara ịbụ ndị maara ihe n’anya onwe unu: nkụchi obi abịakwasịwo akụkụ ụfọdụ nke Izrel ruo mgbe izu oke nke ndị mba ọzọ ga-abanye[b],'
  rationale: The revision replaces an awkward rendering of πώρωσις with the idiomatic “nkụchi obi,” improves the expression of the partial scope, and renders εἰσέλθῃ as “ga-abanye.” It retains the draft's appropriately open rendering of πλήρωμα and does not resolve disputed theological implications.
