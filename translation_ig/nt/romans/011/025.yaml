id: ROM.11.25
reference: Romans 11:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: ig
  text: 'N’ihi na achọghị m ka unu ghara ịma[a], ụmụnna m, ihe omimi a, ka unu ghara ịbụ ndị maara ihe n’anya onwe unu: nkụchi obi abịakwasịwo akụkụ ụfọdụ nke Izrel ruo mgbe izu oke nke ndị mba ọzọ ga-abanye[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’ụzọ nkịtị: “ka unu ghara ịma.” Nke a bụ usoro okwu Pọl nke pụtara na ọ chọghị ka ha ghara inwe ozi banyere ihe a.'
    reason: lexical_clarification
  - marker: b
    text: A pụkwara ịsị, “ruo mgbe ọnụọgụ zuru ezu nke ndị mba ọzọ ga-abanye.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: ịghara ịma
  rationale: N’usoro okwu Pọl, οὐ θέλω ὑμᾶς ἀγνοεῖν pụtara na ọ chọghị ka ndị na-agụ ya ghara ịmata ozi dị mkpa. “Ka unu ghara ịma” bụ Igbo doro anya, nke a na-asụ n’oge a, na-enweghị ụda mkparị.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: “Ụmụnna m” bụ okwu ịkpọ ndị otu okwukwe nke sitere n’echiche nke ụmụnne; ọ dabara n’Igbo ma nwee ike ịgụnye ndị nwoke na ndị nwanyị, dị ka ndị Rom Pọl na-agwa okwu.
- source_word: μυστήριον
  choice: ihe omimi
  rationale: “Ihe omimi” na-egosi nzube Chineke nke mmadụ na-apụghị ịmata n’onwe ya ma Chineke kpughee ya; ọ na-edobe ụda nkà mmụta okpukpe nke okwu Grik karịa “ihe nzuzo” nkịtị.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: ka unu ghara ịbụ ndị maara ihe n’anya onwe unu
  rationale: Nsụgharị a na-edobe ihe okwu ahụ bu n’obi—ịdọ aka ná ntị megide ile onwe ha anya dị ka ndị maara ihe—ma na-anọgide nso n’usoro okwu Grik.
- source_word: πώρωσις
  choice: obi ịkpọ nkụ
  rationale: N’ebe a okwu ahụ na-ezo aka n’ọnọdụ ime mmụọ nke enweghị mmetụta ma ọ bụ nke ịjụ ịnabata; akpaalaokwu Igbo “obi ịkpọ nkụ” na-ebute echiche ahụ n’ụzọ mmadụ ga-aghọta.
- source_word: ἀπὸ μέρους
  choice: otu akụkụ
  rationale: “Otu akụkụ” na-egosi na ịkpọ nkụ ahụ emetụtaghị Izrel dum; ọ naghị ekpebi na okwu ahụ na-ekwu banyere oge ole ọnọdụ ahụ ga-adị.
- source_word: τῷ Ἰσραήλ ... γέγονεν
  choice: abịakwasịwo ... Izrel
  rationale: “Abịakwasịwo” na-egosi ma ihe mere n’oge gara aga ma ọnọdụ ya ka dị ugbu a, nke kwekọrọ n’ike perfect γέγονεν.
- source_word: πλήρωμα
  choice: izu oke
  rationale: “Izu oke” na-edobe nghọta sara mbara nke πλήρωμα—ịzu ezu, ọnụọgụ zuru ezu, ma ọ bụ mmezu—na-enweghị ikpebi otu nkọwa a na-arụrịta ụka banyere ya.
- source_word: τῶν ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ebe a ἔθνη bụ ndị na-abụghị ndị Juu, n’ụzọ dị iche na Izrel; “ndị mba ọzọ” na-egosipụta ọdịiche ahụ n’Igbo nkịtị.
- source_word: εἰσέλθῃ
  choice: ga-abata
  rationale: Mgbe ọ na-eso “ruo mgbe,” “ga-abata” na-egosi njedebe a na-atụ anya ya nke ọnọdụ ahụ ma kwekọọ na aorist subjunctive.
theological_decisions:
- issue: Ihe “izu oke nke ndị mba ọzọ” pụtara
  choice: E debere “izu oke nke ndị mba ọzọ” n’ahịrị bụ isi n’akọwaghị ma ọ bụ ọnụọgụ zuru ezu, nnabata zuru ezu, ma ọ bụ mmezu nke oge ikpeazụ.
  alternative: ọnụọgụ zuru ezu nke ndị mba ọzọ
  rationale: πλήρωμα nwere nghọta dị iche iche n’ebe a. “Izu oke” na-ahapụ nghọta ahụ ghe oghe, ebe nkọwa ala peeji na-enye otu nkọwa a na-ahụkarị.
- issue: Ndị ἀδελφοί na-agụnye
  choice: A sụgharịrị ya “ụmụnna m,” okwu Igbo sitere n’ezinụlọ nke nwere ike ịkpọ ndị otu okwukwe niile.
  alternative: ụmụnne nwoke m; ụmụnna nwoke na nwanyị m
  rationale: Ọ bụ ezie na ụdị Grik bụ masculine plural, ọ na-agwa ọgbakọ ndị Rom nke nwere ma ndị nwoke ma ndị nwanyị okwu. “Ụmụnna m” bụ okwu Igbo ebumpụta ụwa nke na-adịghị ehichapụ oyiyi ezinụlọ ma na-ezere itinye nkọwa na-adịghị mkpa n’ahịrị bụ isi.
- issue: Oke “obi ịkpọ nkụ” ahụ
  choice: A sụgharịrị ἀπὸ μέρους dị ka “otu akụkụ,” ya bụ, ọnọdụ ahụ abịakwasịwo akụkụ nke Izrel.
  alternative: obi Izrel akpọọla nkụ n’ụzọ na-ezughị ezu
  rationale: Usoro Grik na-emeghe ntakịrị ohere n’otú ἀπὸ μέρους si metụta okwu ahụ, ma n’ebe a nghọta kacha pụta ìhè bụ na ịkpọ nkụ ahụ abụghị nke Izrel dum. Nsụgharị ahụ anaghị eme ya ka ọ bụrụ naanị okwu gbasara ogologo oge.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe usoro arụmụka Pọl na njedebe rikoma nke amaokwu ahụ, ebe echiche ahụ na-aga n’ihu n’amaokwu na-esote. “Ụmụnna m,” “ihe omimi,” na “izu oke” na-edobe ụda ezinụlọ na nke nkà mmụta okpukpe nke isi mmalite ahụ.
