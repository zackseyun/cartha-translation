  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: ig
  text: Gịnịzi? Izrel enwetaghị ihe ọ na-achọ, ma ndị a họọrọ[a] nwetara ya; ndị fọdụrụ, e mere ka obi ha sie ike[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nhọpụta ahụ.” Okwu Grik ἐκλογή pụtara “nhọpụta” ma ọ bụ “ịhọrọ,” ma n'ebe a o yiri ka ọ na-anọchi anya ndị a họọrọ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “e mere ka ha ghara inwe mmetụta.” Ngwaa Grik ahụ nwere ike igosi ime ka mmadụ sie ike ma ọ bụ mee ka ọ ghara inwe mmetụta.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Gịnịzi?
  rationale: Ọ bụ ajụjụ nkwubi okwu Pọl ji ewebata ihe na-esite n'okwu ndị bu ụzọ; “Gịnịzi?” na-ada nke ọma n'Igbo ma na-echekwa ike ajụjụ ahụ.
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: ihe Izrel ... na-achọ
  rationale: A sụgharịrị aha Izrel dịka otu ndị mmadụ, ebe ngwaa dị ugbu a na-egosi ihe ha na-achụso.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: enwetaghị
  rationale: ἐπιτυγχάνω pụtara inweta ma ọ bụ iru ihe a na-achọ; “enwetaghị” dabara n'okwu a ma kwe ka e kwughachi otu ngwaa ahụ n'akụkụ nke ọzọ.
- source_word: ἡ δὲ ἐκλογὴ
  choice: ndị a họọrọ
  rationale: Ọ bụ ezie na ἐκλογή bụ “nhọpụta” n'ụzọ nkịtị, n'ebe a ọ na-anọchi anya ndị a họọrọ, ndị e ji tụnyere “ndị fọdụrụ.”
- source_word: ἐπέτυχεν
  choice: nwetara ya
  rationale: E kwughachiri echiche otu ngwaa ahụ dị na nkebi mbụ iji chekwaa ntụnyere Pọl mere; “ya” na-ezo aka n'ihe Izrel na-achọ.
- source_word: οἱ δὲ λοιποὶ
  choice: ndị fọdụrụ
  rationale: Nke a na-egosi ndị ọzọ niile e wezụga ndị a họọrọ.
- source_word: ἐπωρώθησαν
  choice: e mere ka obi ... kpọọ nkụ
  rationale: Nke a na-echekwa olu nnara na ihe atụ nke ime ka mmadụ sie ike ma ọ bụ ghara ịdị na-anabata ihe n'ime mmụọ, n'ebughị ụzọ kpọọ onye mere ya aha.
theological_decisions:
- issue: Ihe ἡ ἐκλογὴ pụtara n'ebe a
  choice: ndị a họọrọ
  alternative: nhọpụta ahụ
  rationale: Ntunyere ya na “ndị fọdụrụ” na-egosi na okwu ahụ na-anọchi anya ndị mmadụ. Nke a anaghị etinye usoro ozizi otu ụka n'ime amaokwu ahụ.
- issue: Onye mere ka ndị fọdụrụ kpọọ nkụ n'obi na ἐπωρώθησαν
  choice: E debere ya n'olu nnara n'ekwughị onye mere ya.
  alternative: Chineke mere ka obi ha kpọọ nkụ / ha mere ka obi ha kpọọ nkụ
  rationale: Grik ahụ ekwughị onye mere omume ahụ. Ya mere, nsụgharị ahụ echekwala esemokwu dị n'etiti omume ikpe Chineke na ibu ọrụ mmadụ n'ekpebighị ya n'amaokwu a.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Obi kpọọ nkụ” na-ezere nghọtahie nke “obi sie ike,” nke na-apụtakarị inwe obi ike n'Igbo, ma na-echekwa ihe atụ nke ịkpọ nkụ ma ọ bụ isi ike.
