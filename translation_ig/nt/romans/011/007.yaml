revisions:
- from: Gịnịzi? Izrel enwetaghị ihe ọ na-achọ, ma ndị a họọrọ[a] nwetara ya; e mere ka obi ndị fọdụrụ kpọọ nkụ[b].
  to: Gịnịzi? Izrel enwetaghị ihe ọ na-achọ, ma ndị a họọrọ[a] nwetara ya; ndị fọdụrụ, e mere ka obi ha sie ike[b].
  rationale: The revision preserves the Greek passive without naming an agent, keeps “the rest” as the discourse subject, and uses a clearer Igbo expression for the hardening metaphor. Footnote b is narrowed to a genuine lexical alternative rather than an interpretive paraphrase.
