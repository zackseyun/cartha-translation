revisions:
- from: Nke a ga-abụkwa ọgbụgba ndụ mụ na ha gbara[a], mgbe m ga-ewepụ mmehie ha.
  to: Nke a bụkwa ọgbụgba ndụ m maka ha, mgbe m ga-ewepụ mmehie ha.[a]
  rationale: The revision removes the added bilateral assertion while retaining the source’s covenant language, the divine source implied by “m,” the people as its beneficiaries, and the prophetic removal of their sins. The supplied Igbo future in the time clause is a natural way to express the prospective force of the citation without specifying a date or doctrinal scheme.
