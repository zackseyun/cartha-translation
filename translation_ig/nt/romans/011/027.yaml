  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: ig
  text: Nke a bụkwa ọgbụgba ndụ m maka ha, mgbe m ga-ewepụ mmehie ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n'ụzọ dị nso karị n'okwu Grik, “ọgbụgba ndụ ahụ sitere n'aka m maka ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: ọgbụgba ndụ
  rationale: N'ọnọdụ okwu Pọl na-ehota n'Akwụkwọ Nsọ, okwu a pụtara ọgbụgba ndụ sitere ná nkwa Chineke, ọ bụghị akwụkwọ ikike onye nwụrụ anwụ.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: ọgbụgba ndụ mụ na ha gbara
  rationale: Nke a bụ ụzọ Igbo si ekwu okwu nke ọma banyere ọgbụgba ndụ, ma ọ ka na-egosi na ọ bụ Chineke malitere ma nwekwaa ọgbụgba ndụ ahụ; nkọwa ala peeji na-echekwa ọdịdị okwu Grik, ‘ọgbụgba ndụ ahụ sitere n’aka m ruo ha.’
- source_word: αὐτοῖς
  choice: mụ na ha
  rationale: Ọ bụ ezie na dative Grik nwere ike ịbụ ‘nye ha’ ma ọ bụ ‘maka ha,’ Igbo na-ejikarị ‘mụ na ha gbara’ ekwu njikọ dị n'ọgbụgba ndụ n'ụzọ eke.
- source_word: ὅταν
  choice: mgbe
  rationale: N'ebe a, ọ na-egosi oge nkwa amụma ahụ ga-emezu, ọ bụghị ihe na-eme ugboro ugboro.
- source_word: ἀφέλωμαι
  choice: m ga-ewepụ
  rationale: ‘Iwepụ’ na-enye echiche kpọmkwem nke iwepụ mmehie, ma ọdịdị ọdịnihu ahụ na-eme ka ahịrịokwu amụma ahụ doo anya n'Igbo.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: mmehie ha
  rationale: Nke a na-edobe ọtụtụ mmehie ndị ahụ na nghọta omume na nke okpukpe nke okwu Grik.
- source_word: καὶ αὕτη
  choice: Nke a ga-abụkwa
  rationale: Ọ bụ ezie na Grik enweghị ngwaa ọdịnihu e dere ebe a, ahịrịokwu ahụ hapụrụ ya n’ihi ọnọdụ amụma; ịtinye ‘ga-abụ’ na-eme ka Igbo zuo oke ma chekwaa ntụgharị uche gaa n’ọdịnihu.
theological_decisions:
- issue: Ụdị διαθήκη n'okwu amụma Pọl hotara
  choice: ọgbụgba ndụ
  alternative: ọgbụgba ndụ e nyere ha / akwụkwọ ọgbụgba ikpeazụ
  rationale: ‘Ọgbụgba ndụ’ na-echekwa njikọ ya na nkwa mgbapụta Chineke n'Akwụkwọ Nsọ Agba Ochie, n'etinyeghị echiche testament nke oge e mesịrị.
- issue: Ike oge dị na ὅταν ἀφέλωμαι
  choice: mgbe m ga-ewepụ mmehie ha
  alternative: mgbe ọ bụla m na-ewepụ mmehie ha
  rationale: Ihe gbara ya gburugburu bụ otu nkwa amụma ga-emezu n'akụkọ nzọpụta, ọ bụghị ọnọdụ a na-eme ugboro ugboro; okwu a anaghị akọwapụta oge ahụ karịa ihe Grik kwuru.
translation_notes:
  register: Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E ji ‘ọgbụgba ndụ mụ na ha gbara’ mee ka okwu ahụ daa n'ụzọ eke n'Igbo, ebe nkọwa ala peeji chekwara nhazi pụrụ iche nke Grik.
