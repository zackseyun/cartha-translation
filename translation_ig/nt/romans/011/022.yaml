review_pass:
  verdict: revise
  source_fidelity: The draft conveys the principal contrast, condition, and future passive warning. However, it changes the source's balanced nominal construction ('severity toward ...; God's kindness toward ...') into active descriptions of how God treats each group. A closer formulation preserves the Greek parallelism and explicitly retains 'God's kindness' in the second member.
  naturalness: Most wording is understandable Standard Igbo. In the verse, 'ọ na-emeso ... ihe n’aka ike' is less direct and less idiomatic than a parallel locative construction. In footnote b, 'a ga-agbajikwa gị wepụ' is awkward Igbo word order and usage.
  terminology: '''obiọma'' suitably renders χρηστότης, and ''ịdị aka ike'' is an acceptable rendering of ἀποτομία. ''a ga-egbutukwa gị'' accurately retains the future passive and the ''you too'' force.'
  issues:
  - severity: medium
    issue: The two clauses for severity and kindness are recast as active treatment statements.
    rationale: 'Greek has a deliberately parallel contrast: ''toward those who fell, severity; but toward you, God''s kindness.'' The revision retains this structure and the explicit attribution of the second noun to God.'
  - severity: low
    issue: Footnote b's alternative wording is unnatural.
    rationale: '''a ga-agbajikwa gị wepụ'' does not naturally express breaking/removing a branch in Standard Igbo. A more idiomatic contextual alternative is supplied without displacing the main, literal rendering.'
  revised_text: 'Ya mere, tụlee obiọma[a] na ịdị aka ike nke Chineke: n''ebe ndị dara ada nọ, e nwere ịdị aka ike; ma n''ebe gị nọ, e nwere obiọma Chineke, ọ bụrụ na ị nọgide n''obiọma ahụ; ma ọ bụghị ya, a ga-egbutukwa gị[b].'
  revised_footnotes:
