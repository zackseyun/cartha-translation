id: ROM.11.22
reference: Romans 11:22
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: ig
  text: 'Ya mere, tụlee obiọma[a] na ịdị aka ike nke Chineke: n''ebe ndị dara ada nọ, e nwere ịdị aka ike; ma n''ebe gị nọ, e nwere obiọma Chineke, ọ bụrụ na ị nọgide n''obiọma ahụ; ma ọ bụghị ya, a ga-egbutukwa gị[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ịdị mma.” Okwu Grik χρηστότης nwere ike ịpụta obiọma, ịdị mma, ma ọ bụ ihuọma; a họọrọ “obiọma” iji mee ka ọdịiche ya na “ịdị aka ike” pụta ìhè.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “a ga-agbaji gị wepụ.” Ihe ngwaa Grik pụtara kpọmkwem bụ “a ga-egbutu gị”; “ịgbaji wepụ” kwekọkwara n'ihe atụ osisi oliv dị n'akụkụ amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: tụlee
  rationale: Ọ bụ iwu na-akpọ onye a na-agwa ka o lebara ihe a anya ma chebara ya echiche; “tụlee” na-egosipụta nke a n’Igbo dị ugbu a.
- source_word: χρηστότητα / χρηστότης
  choice: obiọma
  rationale: “Obiọma” na-egosipụta ịdị mma na ihuọma Chineke n’ebe mmadụ nọ, ma na-enye ọdịiche doro anya megide ịdị aka ike.
- source_word: ἀποτομίαν / ἀποτομία
  choice: ịdị aka ike / n’aka ike
  rationale: Okwu Grik a na-egosi ịdị nkọ na enweghị imegharị anya n’ikpe; “ịdị aka ike” na-eburu echiche ahụ n’enweghị ịgbakwụnye ihe karịrị ihe ederede kwuru.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: ọ na-emeso ndị dara ada ihe n’aka ike
  rationale: Nhazi a na-egosi ụzọ omume Chineke si ruo ndị dara; “ndị dara ada” na-echekwa ihe atụ nke osisi oliv na ọnọdụ sitere n’ịda ha.
- source_word: ἐπὶ δὲ σὲ
  choice: ma ọ na-emere gị obiọma
  rationale: Nke a na-echekwa ọdịiche dị n’etiti ndị dara ada na onye a na-agwa, ma bụrụkwa Igbo na-ada nke ọma.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: ma ọ bụrụ na ị nọgide n’obiọma ya
  rationale: “Nọgide” na-egosipụta ịga n’ihu ịnọ n’ime obiọma Chineke; “ya” na-eme ka onye nwe obiọma ahụ doo anya site n’ahịrịokwu gbara ya gburugburu.
- source_word: ἐπεὶ
  choice: ma ọ bụghị ya
  rationale: N’ebe a, okwu ahụ na-ewebata ihe ga-esi na emeghị ọnọdụ ahụ pụta; “ma ọ bụghị ya” na-egosipụta ịdọ aka ná ntị ahụ nke ọma.
- source_word: ἐκκοπήσῃ
  choice: a ga-egbutukwa gị
  rationale: Nke a na-echekwa ọdịdị n’ọdịnihu na nke nnara nke ngwaa ahụ, yana ihe oyiyi nke alaka osisi a na-egbutu.
theological_decisions:
- issue: Ịdọ aka ná ntị nwere ọnọdụ banyere obiọma na ikpe Chineke
  choice: 'E debere ọnọdụ na ịdọ aka ná ntị ahụ dịka ha dị: ọ bụrụ na onye a na-agwa anọgideghị n’obiọma Chineke, a ga-egbutukwa ya.'
  alternative: Ime ka ịdọ aka ná ntị ahụ bụrụ naanị ihe a na-eche n’echiche, ma ọ bụ ịkọwa ya dịka ozizi otu ụka kpọmkwem banyere ịnọgide n’okwukwe ma ọ bụ ịdapụ.
  rationale: Grik na-enye ọnọdụ na ịdọ aka ná ntị kpọmkwem, ma ọ naghị edozi esemokwu banyere ma ọ metụtara otu mmadụ, otu ìgwè, ịnọgide ruo ọgwụgwụ, ma ọ bụ ịdapụ; nsụgharị ahụ hapụrụ esemokwu ahụ ka ọ dị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dịkwa mfe nghọta. E chekwara okwu onye nke abụọ dị n’otu (“gị”), ọdịiche dị n’etiti obiọma na ịdị aka ike, na ihe atụ nke alaka osisi a na-egbutu.
