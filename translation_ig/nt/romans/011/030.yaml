  source_fidelity: 'The draft accurately represents the principal contrasts and syntax: former disobedience to God, present reception of mercy, and the causal/instrumental connection with the other group''s disobedience. “Nupụrụ Chineke isi” and “nnupụisi” preserve the verbal-nominal connection of ἀπειθέω/ἀπείθεια without narrowing it to intellectual unbelief.'
