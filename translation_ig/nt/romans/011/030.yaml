id: ROM.11.30
reference: Romans 11:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: ig
  text: N’ihi na dịka unu nupụrụ Chineke isi n’oge gara aga[a], ma ugbu a e meere unu ebere n’ihi nnupụisi ha,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “unu ekweghị na Chineke” nakwa “n’ihi ekweghị ekwe ha”; okwu Grik ndị a nwere ike ịpụta ma ekweghị ekwe ma nnupụisi n’ebe a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: N’ihi na, dị nnọọ ka
  rationale: “N’ihi na” na-egosi na ihe a bụ nkọwa nke arụmụka gbara ya gburugburu, ebe “dị nnọọ ka” na-echekwa ntụnyere nke ὥσπερ n’Igbo dị mma.
- source_word: ὑμεῖς
  choice: unu
  rationale: Nnọchiaha onye nke abụọ n’ọnụọgụgụ; “unu” na-egosi ọtụtụ mmadụ n’enweghị itinye “ndị mba ọzọ,” nke adịghị kpọmkwem n’amaokwu a.
- source_word: ποτε
  choice: n’oge gara aga
  rationale: Nke a na-egosi oge mbụ ma na-eme ka ọdịiche ya na νῦν, “ugbu a,” doo anya n’Igbo nkịtị.
- source_word: ἠπειθήσατε τῷ θεῷ
  choice: unu nupụrụ Chineke isi
  rationale: “Ịnupụrụ mmadụ isi” bụ ụzọ Igbo si egosi nnupụisi ma ọ bụ ịjụ irube isi; ọ na-echekwa mmekọrịta omume dị n’okwu Grik ahụ n’etinyeghị naanị echiche nke enweghị okwukwe.
- source_word: νῦν δὲ
  choice: ma ugbu a
  rationale: Ọ na-echekwa ọdịiche siri ike dị n’etiti ọnọdụ ha n’oge gara aga na ebere ha natara ugbu a.
- source_word: ἠλεήθητε
  choice: e meere unu ebere
  rationale: 'Nke a na-echekwa olu nnabata nke ngwaa Grik: e nyere ndị a na-agwa okwu ebere, ọ bụghị na ha mere ya n’onwe ha.'
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: n’ihi nnupụisi ha
  rationale: Dative ahụ nwere ike igosi ihe kpatara ya ma ọ bụ ụzọ o si mee; “n’ihi” na-akọwa njikọ ahụ nke ọma n’enweghị ikwubiga usoro ya ókè. “Ha” na-ezo aka n’ìgwè ndị a kpọtụrụ aha n’amaokwu ndị gbara ya gburugburu.
theological_decisions:
- issue: Ihe ἀπειθέω na ἀπείθεια pụtara n’arụmụka Pọl banyere nzọpụta
  choice: nnupụisi / nupụrụ isi
  alternative: enweghị okwukwe / ekweghị ekwe
  rationale: Okwu Grik ndị a nwere ike ịgụnye ma ekweghị ekwe ma ịjụ irube isi. “Nnupụisi” na “nupụrụ isi” na-echekwa njikọ dị n’etiti ngwaa na aha n’amaokwu ahụ ma ghara ime ka ihe Pọl kwuru bụrụ naanị okwu gbasara nghọta ma ọ bụ nkwenye.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke kwụ ọtọ ma dị ùgwù. A hapụrụ akara rikoma n’ọgwụgwụ n’ihi na ntụnyere a na-aga n’ihu n’amaokwu na-esote.
