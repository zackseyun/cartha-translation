  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: ig
  text: N’otu aka ahụ kwa, ndị a anaghị erube isi ugbu a, ka e wee site n’ebere e meere unu meere ha onwe ha kwa ebere ugbu a.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως καὶ
  choice: N’otu aka ahụkwa
  rationale: Na-egosi ntụnyere na njikọ ya na ihe e kwuru n’amaokwu bu ụzọ, n’ụzọ na-ada nke ọma n’Igbo.
- source_word: οὗτοι
  choice: ndị a
  rationale: Na-edobe ike okwu ngosi ahụ, nke na-arụtụ aka n’Izrel n’ọnọdụ okwu a.
- source_word: νῦν
  choice: ugbu a
  rationale: Na-egosi oge nke dị ugbu a n’usoro arụmụka Pọl; e debere ya n’ebe abụọ ahụ dị ka ọ dị n’asụsụ Grik.
- source_word: ἠπείθησαν
  choice: enupụkwala isi
  rationale: ἀπειθέω nwere ike ịpụta ekweghị ekwe ma ọ bụ nnupụisi. Nhọrọ a na-edobe echiche sara mbara nke ịjụ irubere Chineke isi, ghara ime ka ọ bụrụ naanị enweghị nkwenye n’uche.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: site n’ebere e meere unu
  rationale: Nkebi dative a dị mkpirikpi ma nwee obere nghọta abụọ. N’ọnọdụ Rom 11:30–32, ọ kachasị yie ka ọ na-ekwu maka ebere Chineke meere ndị na-abụghị ndị Juu, ọ bụghị ebere ha ji aka ha mee.
- source_word: ἵνα
  choice: ka e wee
  rationale: Na-egosipụta ebumnuche ma ọ bụ ihe si na ya pụta n’Igbo doro anya, ma na-edobe njikọ dị n’etiti nkebiokwu abụọ ahụ.
- source_word: καὶ αὐτοὶ
  choice: ha onwe ha
  rationale: Na-edobe nkwusi ike na ndị ahụ kwa so ná ndị a ga-emere ebere.
- source_word: ἐλεηθῶσιν
  choice: meere ha ... ebere
  rationale: Na-egosipụta passive ahụ n’ụzọ Igbo na-adịkarị, ebe Chineke bụ onye a ghọtara na ọ na-eme ebere ahụ.
theological_decisions:
- issue: Ma “τῷ ὑμετέρῳ ἐλέει” ọ̀ bụ ebere ndị kwere ekwe na-abụghị ndị Juu na-emere ndị ọzọ, ka ọ̀ bụ ebere Chineke meere ha
  choice: ebere e meere unu
  alternative: ebere unu
  rationale: Usoro echiche dị na Rom 11:30–32 na-atụnyere ndị nupụrụ isi ma mesịa nata ebere Chineke. Ya mere, isi okwu a na-akacha arụtụ aka n’ebere Chineke e meere ndị na-agụ akwụkwọ ahụ. Ihe odide ala peeji na-edobe nghọta ọzọ nke ụtọ asụsụ Grik nwere ike ikwe.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Enupụkwala isi” na-edobe ma akụkụ ekweghị ekwe ma akụkụ nnupụisi nke okwu Grik ahụ; usoro “ka e wee ... meere” na-eme ka passive na ebumnuche/result doo anya n’Igbo.
