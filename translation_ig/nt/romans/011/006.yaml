id: ROM.11.6
reference: Romans 11:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: ig
  text: Ma ọ bụrụ na ọ bụ site n'amara, ọ bụghịzi site n'ọrụ; ma ọ bụghị otú ahụ, amara anaghịzi aghọ amara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: site n'amara
  rationale: Ọ na-egosi na amara bụ ntọala ma ọ bụ ụzọ nhọrọ ahụ si bịa, ọ bụghị ụgwọ e ji ọrụ nweta.
- source_word: ἐξ ἔργων
  choice: site n'ọrụ
  rationale: E chekwara njikọ dị n'etiti ἐκ/ἐξ na isi mmalite ma ọ bụ ntọala, tinyere ọdịiche ya na amara.
- source_word: γίνεται
  choice: agaghị abụkwa
  rationale: 'N''okwu Igbo nkịtị, nke a na-ekwupụta ihe okwu Grik pụtara n''ọnọdụ a: ma e jikọta amara na ụgwọ ọrụ, ọ kwụsịrị ịbụ amara n''ezi ihe ọ bụ.'
theological_decisions:
- issue: Mmekọrịta amara na ọrụ
  choice: E debere ha dịka ntọala abụọ na-emegiderịta onwe ha n'okwu a.
  alternative: Ịkọwa “ọrụ” kpọmkwem dịka ọrụ iwu Mozis ma ọ bụ dịka ezi ọrụ niile.
  rationale: Amaokwu a n'onwe ya ekwughị ụdị ọrụ ahụ kpọmkwem; ya mere nsụgharị ahụ anaghị etinye nkọwa otu ụka ma ọ bụ onye nkọwa n'ime ederede.
- issue: Ike okwu γίνεται
  choice: “agaghị abụkwa amara”
  alternative: “amara anaghị aghọkwa amara”
  rationale: Nhọrọ nke mbụ bụ Igbo eke ma na-edobe nkwubi okwu ahụ n'ụzọ doro anya, ebe nke ọzọ ga-ada ka okwu na-adịghị eke n'Igbo.
translation_notes:
  register: Standard Igbo; asụsụ dị mfe, dị ùgwù, ma kwekọọ na usoro arụmụka Pọl. E jiri “ma ọ bụghị otú ahụ” mee ka ἐπεί doo anya n'ụzọ eke n'Igbo.
