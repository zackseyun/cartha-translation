  source_fidelity: Isi ederede na-atụgharị usoro κατὰ μὲν ... κατὰ δέ nke ọma site na “N’ihe gbasara ... ma n’ihe gbasara ...”; “ndị iro,” “ndị a hụrụ n’anya,” na “n’ihi” na-echekwa esemokwu na ihe kpatara ya dị na Grik. Otú ọ dị, ihe odide ala a akara a na-agbanwe κατά (“n’ihe gbasara/as regards”) ka ọ bụrụ “n’ihi” (“because of”), nke na-adịghị egosi nhọrọ ntụgharị kwesịrị ekwesị.
