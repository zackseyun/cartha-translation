  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: ig
  text: N’ihe gbasara ozi ọma[a], ha bụ ndị iro n’ihi unu; ma n’ihe gbasara nhọpụta, ha bụ ndị a hụrụ n’anya n’ihi ndị nna ochie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Banyere ozi ọma, ha bụ ndị iro n’ihi unu; ma banyere nhọpụta, ha bụ ndị a hụrụ n’anya n’ihi ndị nna ochie.”
    reason: lexical_alternative
  - marker: b
    text: “Ndị nna ochie” na-ezo aka ná ndị nna ochie Israel, karịchaa Ebraham, Aịzik, na Jekọb.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: N’ihe gbasara ozi ọma
  rationale: Κατά na accusative ebe a na-egosi akụkụ e si ele okwu anya; nkebi a na-echekwa ọdịiche μέν...δέ n’Igbo dị ugbu a.
- source_word: εὐαγγέλιον
  choice: ozi ọma
  rationale: Nke a bụ ntụgharị Igbo doro anya ma bụrụkwa okwu a na-ejikarị maka ozi a na-ekwusa banyere Kraịst.
- source_word: ἐχθροὶ
  choice: ndị iro
  rationale: Adjective a na-arụ ọrụ predicative; ‘ndị iro’ na-echekwa ike mmekọrịta dị n’okwu Grik, n’agbanweghị ya ka ọ bụrụ na Chineke kpọrọ ha asị.
- source_word: δι’ ὑμᾶς
  choice: n’ihi unu
  rationale: Διά na accusative nwere ike igosi ihe kpatara ya ma ọ bụ uru ọ bara. ‘N’ihi unu’ na-echekwa ohere abụọ ahụ nke ọma karịa nkọwa ga-eme ka otu naanị bụrụ ihe a pụtara.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: ma n’ihe gbasara nhọpụta
  rationale: Ọ na-emeghachi akụkụ e si ele okwu anya ma na-echekwa ntụnyere megidere akụkụ mbụ.
- source_word: ἐκλογὴν
  choice: nhọpụta
  rationale: ‘Nhọpụta’ bụ okwu Igbo dị nkenke nke na-anọgide nso n’echiche nke ἐκλογή, na-agbakwụghị ‘nke Chineke’ n’ebe ederede Grik ekwughị ya kpọmkwem.
- source_word: ἀγαπητοὶ
  choice: ndị a hụrụ n’anya
  rationale: Nke a na-egosi ọnọdụ ha dị ka ndị a hụrụ n’anya, ma na-echekwa esemokwu dị n’etiti nke a na ‘ndị iro.’
- source_word: διὰ τοὺς πατέρας
  choice: n’ihi ndị nna ochie
  rationale: ‘Ndị nna ochie’ bụ ụzọ Igbo sitere n’okike e si kpọọ ndị bụ nna nna Israel; ‘n’ihi’ na-egosi ntọala ma ọ bụ ihe kpatara ọnọdụ ịhụnanya ahụ.
theological_decisions:
- issue: Ndị okwu ‘ha’ na-ezo aka na ha
  choice: A hapụrụ ‘ha’ ka ọ na-ezo aka n’Israel dịka otu ndị n’arụmụka Pọl.
  alternative: Ịkọwa ya kpọmkwem dịka naanị ndị Juu na-ekweghị ekwe n’oge Pọl.
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-ekwu maka Israel n’ozuzu, ọ bụ ezie na ọtụtụ n’ime ha ekweghị ekwe n’oge ahụ. E kwesịghị ime ka ntụgharị ahụ dị warara karịa Grik.
- issue: Ihe ‘ndị iro’ pụtara
  choice: E debere okwu ahụ dịka ọnọdụ ha n’ihe gbasara ozi ọma, ebe ha ka bụ ndị a hụrụ n’anya n’ihe gbasara nhọpụta.
  alternative: Ịsị na Chineke kpọrọ ha asị kpamkpam, ma ọ bụ ime ka ọ bụrụ naanị esemokwu mmekọrịta mmadụ.
  rationale: Amaokwu ahụ n’onwe ya na-edobe ‘ndị iro’ na ‘ndị a hụrụ n’anya’ ọnụ. A ghaghị ichekwa mgbagwoju anya nkà mmụta okpukpe ahụ.
- issue: Ihe ‘ndị nna ochie’ na-ezo aka na ya
  choice: Ndị nna ochie nke Israel, karịchaa Ebraham, Aịzik, na Jekọb.
  alternative: Ndị nna nna n’ozuzu ha na-enweghị njikọ pụrụ iche na nkwa ọgbụgba ndụ.
  rationale: N’ime Ndị Rom 9–11, okwu a na-akpọghachi uche n’ebe ndị nna ochie na nkwa Chineke kwere ha nọ; isi ederede anaghị agbasa nkọwa ahụ karịa ihe dị na Grik.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E ji usoro ‘n’ihe gbasara ... ma n’ihe gbasara ...’ chekwaa nhazi na ọdịiche nke κατὰ μέν...κατὰ δέ. E debere ma ‘ndị iro’ ma ‘ndị a hụrụ n’anya’ n’enweghị imebi esemokwu Pọl zubere.
