  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ịjụ ha mere ka ụwa na Chineke dịghachi ná mma, gịnị ka ịnabata ha[a] ga-abụ ma ọ bụghị ndụ sitere n’ọnwụ[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ịnata ha.” Okwu Grik a na-emegide “ịjụ ha,” ọ pụkwara ịpụta ịnata ma ọ bụ ịnabata ha ọzọ.
    reason: lexical_alternative
  - marker: b
    text: “Ndụ sitere n’ọnwụ” nwere ike izo aka, n’ụzọ ihe atụ, n’oke mmelite ime mmụọ, ma ọ bụ kpọmkwem na mbilite n’ọnwụ. Pọl hapụrụ okwu ahụ nkenke ma juputara n’ihe ọ pụrụ ịpụta.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: ịjụ ha
  rationale: Nke a na-egosi na a jụrụ ha ma ọ bụ wezụga ha, ma na-emekwa ka ọdịiche ya na ‘ịnabata ha’ doo anya.
- source_word: καταλλαγὴ
  choice: mere ka ụwa na Chineke dịghachi ná mma
  rationale: Nke a bụ ụzọ Igbo doro anya si kwupụta mweghachi nke mmekọrịta dị mma; ịkpọ Chineke aha na-eme ka ihe okwu ahụ pụtara n’echiche Pọl doo anya n’Igbo, na-agbanweghị onye ụwa na ya dị ná mma.
- source_word: κόσμου
  choice: ụwa
  rationale: A hapụrụ okwu ahụ n’obosara ya, kama ime ka ọ bụrụ naanị ndị mba ọzọ ma ọ bụ otu akụkụ nke mmadụ.
- source_word: πρόσλημψις
  choice: ịnabata ha
  rationale: Ọ na-emegide ‘ịjụ ha’ n’ụzọ doro anya ma na-egosi na a nabatara ha ọzọ; nkọwa ala peeji na-edebe ‘ịnata ha’ dị ka nhọrọ ọzọ.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: ndụ site n’etiti ndị nwụrụ anwụ
  rationale: Nsụgharị a na-edebe ihe atụ okwu Grik ahụ na ike ya n’enweghị ịkọwa ma ọ bụ mbilite n’ọnwụ kpọmkwem ka ọ bụ mmeghachi ọhụrụ n’ụzọ ime mmụọ.
- source_word: εἰ μὴ
  choice: ma ọ bụghị
  rationale: Ọ dabara n’ajụjụ a na-atụ anya azịza siri ike ma bụrụkwa okwu Igbo nkịtị.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-edebe njikọ nke amaokwu a na arụmụka dị n’ihu ya.
theological_decisions:
- issue: Ihe ‘ndụ site n’etiti ndị nwụrụ anwụ’ pụtara
  choice: E debere ya dịka okwu gbasara ihe ga-eme n’ọdịnihu nke nwere ike ịpụta ihe karịrị otu, n’enweghị ikpebi kpọmkwem ihe Pọl bu n’obi.
  alternative: A pụrụ ịkọwa ya naanị dịka nnukwu mmeghachi ọhụrụ n’ụzọ ime mmụọ, ma ọ bụ naanị dịka mbilite n’ọnwụ ikpeazụ.
  rationale: Okwu Grik ahụ dị mkpirikpi ma nwee nnukwu nghọta dị iche iche. Nsụgharị ahụ kwesịrị idobe esemokwu nkọwa ahụ kama idozi ya n’aha Pọl.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edebe usoro arụmụka Pọl na ọdịiche dị n’etiti ịjụ ha na ịnabata ha.
