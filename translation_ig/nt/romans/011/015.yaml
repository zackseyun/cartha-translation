revisions:
- from: N’ihi na ọ bụrụ na ịjụ ha mere ka ụwa na Chineke dịghachi ná mma, gịnị ka ịnabata ha[a] ga-abụ ma ọ bụghị ndụ site n’etiti ndị nwụrụ anwụ[b]?
  to: N’ihi na ọ bụrụ na ịjụ ha mere ka ụwa na Chineke dịghachi ná mma, gịnị ka ịnabata ha[a] ga-abụ ma ọ bụghị ndụ sitere n’ọnwụ[b]?
  rationale: The revision corrects the rendering of ζωὴ ἐκ νεκρῶν to idiomatic Standard Igbo while retaining its interpretive ambiguity. It also smooths the corresponding footnote without imposing a particular eschatological reading. Footnote markers correctly follow the terms they explain.
