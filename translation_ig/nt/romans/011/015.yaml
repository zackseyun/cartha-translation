    text: Ma ọ bụ, “ịnata ha.” Okwu Grik a na-emegide “ịjụ ha,” ọ pụkwara ịpụta ịnata ma ọ bụ ịnabata ha ọzọ.
    reason: lexical_alternative
  - marker: b
    text: “Ndụ sitere n’ọnwụ” nwere ike izo aka, n’ụzọ ihe atụ, n’oke mmelite ime mmụọ, ma ọ bụ kpọmkwem na mbilite n’ọnwụ. Pọl hapụrụ okwu ahụ nkenke ma juputara n’ihe ọ pụrụ ịpụta.
    reason: alternative_reading
