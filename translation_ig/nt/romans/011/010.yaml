id: ROM.11.10
reference: Romans 11:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: ig
  text: Ka anya ha gbaa ọchịchịrị[a], ka ha ghara ịhụ ụzọ; meekwa ka azụ ha hulata mgbe niile[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ka e kpuo ha ìsì.” Okwu Grik ahụ pụtara n'ụzọ nkịtị “ka ... gbaa ọchịchịrị,” nke na-echekwa ihe atụ nke ọchịchịrị dị n'akwụkwọ e si hota okwu a.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-enweghị nkwụsị.” Okwu a nwere ike ịpụta oge na-aga n'ihu ma ọ bụ ọnọdụ na-adịgide mgbe niile.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: Ka ... gbaa ọchịchịrị
  rationale: Nke a na-egosipụta iwu/arịrịọ nke onye nke atọ n'ụdị nnara, ma na-echekwa ihe atụ nke ọchịchịrị dị n'okwu Grik kama ịkọwa ya ozugbo dị ka ikpu ìsì.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: anya ha
  rationale: Nke a bụ ntụgharị kpọmkwem nke ahịrịokwu njirimara ahụ, ma na-echekwa ihe atụ nke akụkụ ahụ.
- source_word: τοῦ μὴ βλέπειν
  choice: ka ha ghara ịhụ ụzọ
  rationale: Ọ na-egosipụta ebumnuche ma ọ bụ nsonaazụ n'ebughị ụzọ kpebie nke n'ime ha ka okwu Grik bu n'uche kpọmkwem.
- source_word: τὸν νῶτον
  choice: azụ ha
  rationale: νῶτος pụtara azụ; Igbo na-eji otu aha ahụ n'ụzọ nkesa mgbe onye nnọchiaha ọtụtụ so ya.
- source_word: διὰ παντός
  choice: mgbe niile
  rationale: Nke a na-egosi ịdịgide ma ọ bụ ime ihe mgbe niile, n'etinyeghị echiche siri ike nke 'ruo mgbe ebighị ebi.'
- source_word: σύγκαμψον
  choice: mee ka azụ ha hulata
  rationale: Nke a na-echekwa iwu a na-enye onye a na-akpọghị aha n'ahịrịokwu ahụ, nakwa ihe atụ anụ ahụ nke ime ka azụ hulata.
theological_decisions:
- issue: Arịrịọ ikpe na ọrụ Chineke n'okwu e hotara
  choice: 'E chekwara ike nke arịrịọ/iwu ahụ: “Ka anya ha ...; meekwa ka azụ ha ...”'
  alternative: Ịsụgharị ya dị ka amụma (“anya ha ga-agba ọchịchịrị”) ma ọ bụ dị ka nsonaazụ na-enweghị onye na-eme ya.
  rationale: Ụdị Grik na-echekwa okwu ikpe e kwuru dị ka arịrịọ ma ọ bụ iwu. Nsụgharị ahụ ekwesịghị ime ka ịdị arọ ya belata, ma o kwesịghịkwa itinye nkọwa nkà mmụta okpukpe na-adịghị n'ahịrịokwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Ka ...” na “meekwa ...” na-echekwa ụda arịrịọ/iwu ahụ; a hapụrụ ejighị n'aka dị n'etiti ebumnuche na nsonaazụ na “ka ha ghara ịhụ ụzọ.”
