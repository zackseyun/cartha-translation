id: ROM.11.23
reference: Romans 11:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: ig
  text: Ma ha kwa[a], ọ bụrụ na ha anọgideghị n’ekweghị ekwe, a ga-anyado ha[b]; n’ihi na Chineke nwere ike ịnyado ha ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “ọbụna ha.”'
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “a ga-anyadoghachi ha.” N’asụsụ Grik, okwu pụtara “ọzọ” pụtara kpọmkwem n’ahịrịokwu nke abụọ.'
    reason: alternative_reading
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: ha onwe ha kwa
  rationale: Na-egosipụta ike mgbakwunye nke καί na nrụtụ aka nke ἐκεῖνοι, ya bụ ndị e kwuru banyere ha dịka alaka ndị na-ekweghị ekwe; ọ na-edobekwa echiche ahụ na ọ ga-ekwe omume ka a nabata ọbụna ha.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: ọ bụrụ na ha anọgideghị
  rationale: Na-edobe ọnọdụ nke ἐάν na echiche ịdịgide n’otu ọnọdụ nke ἐπιμένω.
- source_word: τῇ ἀπιστίᾳ
  choice: n’ekweghị ekwe
  rationale: N’ebe a, ἀπιστία na-emegide okwukwe n’arụmụka Pọl, ya mere ‘ekweghị ekwe’ bụ okwu Igbo doro anya ma kwekọọ n’ihe gbara amaokwu ahụ gburugburu.
- source_word: ἐγκεντρισθήσονται
  choice: a ga-anyado ha n’ime ya
  rationale: Ụdị ọdịnihu nke nnara-omume a na-edobe ihe atụ nke ịnyado alaka n’osisi, ebe ‘n’ime ya’ na-eme ka okwu Igbo zuo oke n’ọnọdụ a.
- source_word: δυνατὸς
  choice: nwere ike
  rationale: Nke a bụ ụzọ Igbo nkịtị ma kpọmkwem isi kwuo na Chineke nwere ikike ime ihe ahụ.
- source_word: πάλιν
  choice: ọzọ
  rationale: Na-edobe n’ụzọ doro anya echiche nlọghachi ma ọ bụ imeghachi ihe nke πάλιν.
- source_word: ἐγκεντρίσαι αὐτούς
  choice: ịnyado ha n’ime ya
  rationale: Na-emegharị otu okwu ahụ e ji sụgharịa ngwaa mbụ, na-edobe ihe atụ osisi oliv na ịdị n’otu nke okwu.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosipụta mgbanwe nwere ntụnyere n’ihe Pọl kwuru tupu ya, n’enweghị ime ka esemokwu ahụ sie ike karịa ka ọ dị.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nsụgharị Igbo kwụ ọtọ nke isiokwu ahụ e kwuru kpọmkwem maka imesi ike.
theological_decisions:
- issue: Ihe ἀπιστία pụtara n’ebe a
  choice: ekweghị ekwe
  alternative: enweghị ntụkwasị obi / emeghị ihe kwesịrị ntụkwasị obi
  rationale: Ndị Rom 11 na-atụnyere okwukwe na ekweghị ekwe n’ihe gbasara ịnọgide ma ọ bụ ịbụ ndị e nyadoro n’etiti ndị Chineke. ‘Ekwụghị ekwe’ na-edobe esemokwu ahụ n’enweghị itinye nkọwa ụka ọzọ n’ime ederede.
- issue: Ma a ga-etinye echiche nlọghachi n’ime ngwaa ịnyado nke mbụ
  choice: a ga-anyado ha n’ime ya
  alternative: a ga-anyadoghachi ha n’ime ya
  rationale: πάλιν (‘ọzọ’) pụtara kpọmkwem naanị n’ahịrịokwu nke abụọ. Ya mere, a hapụrụ ngwaa nke mbụ n’enweghị ‘-ghachi,’ ma gosipụta echiche nlọghachi ebe Grik gosipụtara ya.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. ‘Ịnyado’ na-edobe ihe atụ ọrụ ugbo nke ịnyado alaka n’osisi; ‘n’ime ya’ na-ezo aka n’osisi oliv e kwuru banyere ya n’amaokwu ndị gbara ya gburugburu.
