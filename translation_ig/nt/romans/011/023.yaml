revisions:
- from: Ma ha onwe ha kwa[a], ọ bụrụ na ha anọgideghị n’ekweghị ekwe, a ga-anyado ha n’ime ya[b]; n’ihi na Chineke nwere ike ịnyado ha n’ime ya ọzọ.
  to: Ma ha kwa[a], ọ bụrụ na ha anọgideghị n’ekweghị ekwe, a ga-anyado ha[b]; n’ihi na Chineke nwere ike ịnyado ha ọzọ.
  rationale: E dochiela “ha onwe ha kwa” anya na “ha kwa” ka e wee ghara itinye imesi ike nke na-adịghị na κἀκεῖνοι. E wepụtakwara “n’ime ya” ugboro abụọ, n’ihi na ọ bụ ezie na ihe atụ osisi oliv dị n’amaokwu ndị gbara ya gburugburu na-enye onye a na-anyado ha n’ime ya, amaokwu Grik a ekwughị ya kpọmkwem. Ihe ndị ọzọ na-edobe ọnọdụ, echiche nke ịnọgide n’ekweghị ekwe, na πάλιν (“ọzọ”) n’ebe ọ dị na Grik.
