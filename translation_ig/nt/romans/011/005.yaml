- from: Ya mere, n’oge dị ugbu a kwa, e nweela ndị fọdụrụ dịka nhọpụta nke amara si dị.[a]
  to: Ya mere, n’oge dị ugbu a kwa, e nweela otu ìgwè ndị fọdụrụ dịka nhọpụta nke amara si dị.[a]
  rationale: The revision supplies otu ìgwè to express the singular collective λεῖμμα ('a remnant') rather than an unqualified plural. It retains e nweela for the perfect γέγονεν and leaves the grace–election relationship in the main text formally open. The note offers idiomatic alternatives while identifying them as alternatives rather than resolving the Greek genitive in the translation.
