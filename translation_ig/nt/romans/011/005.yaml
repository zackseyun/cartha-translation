  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: ig
  text: Ya mere, n’oge dị ugbu a kwa, e nweela otu ìgwè ndị fọdụrụ dịka nhọpụta nke amara si dị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dịka nhọpụta sitere n’amara si dị” ma ọ bụ “dịka nhọpụta e ji amara mee si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: Ya mere ... kwa
  rationale: “Ya mere” na-egosi nkwubi okwu Pọl wetara site n’ihe atụ Ịlaịja dị n’amaokwu ndị bu ụzọ, ebe “kwa” na-ejikọta oge ugbu a na oge ahụ.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: n’oge dị ugbu a
  rationale: Nke a na-egosi oge ma ọ bụ ọnọdụ nke oge a, ma na-edobe ọdịiche dị n’etiti oge Ịlaịja na oge Pọl.
- source_word: λεῖμμα
  choice: ndị fọdụrụ
  rationale: N’Igbo, “ndị fọdụrụ” na-egosi obere ìgwè mmadụ ka dị, ma dabara n’ụzọ e si eji okwu a n’Ọgbụgba Ochie na n’echiche Pọl.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: dịka nhọpụta nke amara si dị
  rationale: Nkebiokwu a na-edobe ma ἐκλογή (“nhọpụta”) ma χάρις (“amara”), ghara ikpebi n’ụzọ dị warara ma amara ahụ bụ isi mmalite, ntọala, ka ọ bụ àgwà nke nhọpụta ahụ.
- source_word: γέγονεν
  choice: e nweela
  rationale: Ụdị a na-egosi na ihe ahụ malitere ịdị ma ka dị ugbu a, nke kwekọrọ n’ike perfect nke γίνομαι, n’Igbo dị mfe ma bụrụkwa nke okike.
theological_decisions:
- issue: Ịsụgharị ἐκλογή n’ebe echiche okpukpe dị iche iche na-arụrịta ụka
  choice: nhọpụta
  alternative: nhọrọ; ịbụ ndị a họpụtara
  rationale: “Nhọpụta” na-edobe ibu okwu Pọl n’enweghị itinye ozizi pụrụ iche nke otu ụka ma ọ bụ nke onye nkọwa ọ bụla.
- issue: Mmekọrịta dị n’etiti amara na nhọpụta n’okwu κατ’ ἐκλογὴν χάριτος
  choice: dịka nhọpụta nke amara si dị
  alternative: dịka nhọpụta sitere n’amara si dị; dịka nhọpụta amara si dị
  rationale: Ụdị a na-edobe njikọ genitive nke Grik ma ghara ịkọwa ya naanị dịka isi mmalite, àgwà, ma ọ bụ ntọala; ya mere, ọ na-ahapụ obosara na esemokwu dị n’okwu mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke kwanyere ùgwù ma dị mfe nghọta. “Ndị fọdụrụ” bụ okwu mmadụ nkịtị ga-aghọta nke ọma, ebe “nhọpụta nke amara” na-edobe mkpụmkpụ okwu Grik na obosara nkà mmụta okpukpe ya.
