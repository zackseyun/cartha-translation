    reason: lexical_alternative
  revision_rationale: The revision supplies otu ìgwè to express the singular collective λεῖμμα ('a remnant') rather than an unqualified plural. It retains e nweela for the perfect γέγονεν and leaves the grace–election relationship in the main text formally open. The note offers idiomatic alternatives while identifying them as alternatives rather than resolving the Greek genitive in the translation.
