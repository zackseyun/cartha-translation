id: ROM.11.24
reference: Romans 11:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na e bipụrụ gị n’osisi oliv ọhịa nke sitere n’okike, ma e nyadokwara gị n’osisi oliv a na-akọ n’ụzọ megidere okike, olee ka ọ ga-aka bụrụ na a ga-anyadokwa ndị a, bụ́ alaka sitere n’okike[a], n’osisi oliv nke ha n’onwe ha[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị a, bụ́ ndị sitere n’okike.” Grik kwuru nanị “ndị a, ndị sitere n’okike”; e wetara “alaka” site n’ihe atụ osisi oliv dị n’akụkụ okwu a.
    reason: lexical_alternative
  - marker: b
    text: N’ihi ihe amaokwu ndị gbara ya gburugburu na-ekwu, a pụkwara ịghọta ya dịka “a ga-anyadokwa ha azụ n’osisi oliv nke ha n’onwe ha.” Echiche nlọghachi dị n’ọnọdụ okwu ahụ, ọ bụ ezie na ngwaa Grik ekwughị “azụ” kpọmkwem.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: e bipụrụ gị
  rationale: “Bipụ” na-egosi igbupụ ihe n’ebe ọ na-eto, ya mere o dabara n’ihe atụ banyere alaka osisi karịa okwu ga-egosi nanị ịkwụwa ya.
- source_word: ἀγριελαίου
  choice: osisi oliv ọhịa
  rationale: Nke a na-akọwa ụdị osisi oliv na-etoghị dịka nke a na-elekọta ma na-akọ, ma na-edobe ihe dị iche n’etiti ya na καλλιέλαιον.
- source_word: παρὰ φύσιν
  choice: n’ụzọ megidere okike
  rationale: Nhọrọ a na-edobe ọdịiche Pọl mere n’etiti παρὰ φύσιν na κατὰ φύσιν, n’asụsụ Igbo doro anya.
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: nyadokwaa gị / a gaghị anyadokwa
  rationale: “Ịnyadokwa” bụ okwu dabara n’ọrụ itinye alaka otu osisi n’osisi ọzọ ka ọ too; ụdị nnara-ọrụ ahụ na-edobekwa passive nke Grik.
- source_word: καλλιέλαιον
  choice: osisi oliv a na-akọ
  rationale: Nke a na-egosi osisi oliv a na-elekọta ma na-akọ, n’enweghị ịgbakwunye echiche na ọ bụ ‘ezigbo’ n’ụzọ omume.
- source_word: πόσῳ μᾶλλον
  choice: ọ̀ bụkwanụ na ... karịa nke ahụ?
  rationale: Ajụjụ nkwupụta a na-ebunye arụmụka ‘ọ bụrụ na nke mbụ mere, nke ọzọ ga-akadị’ n’Igbo nkịtị, n’agbanyeghị na usoro okwu ya adịghị ka nke Grik kpọmkwem.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: ndị a, bụ́ alaka ya site n’okike
  rationale: Grik ekwughị “alaka” n’amaokwu a, ma ihe atụ banyere osisi oliv na amaokwu ndị gbara ya gburugburu na-eme ka okwu ahụ doo anya; itinye ya na-enyere onye na-agụ Igbo aka ịghọta ihe a na-ekwu.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: n’osisi oliv nke ha onwe ha
  rationale: “Nke ha onwe ha” na-edobe ike ἰδίᾳ, ya bụ, osisi nke ha bụ nke ya n’ụzọ pụrụ iche.
theological_decisions:
- issue: Ma a ga-akpọ ‘ndị a’ ndị Juu ma ọ bụ Izrel kpọmkwem
  choice: E debere ya dịka “ndị a, bụ́ alaka ya site n’okike.”
  alternative: “Ndị Juu a” ma ọ bụ “ndị Izrel a.”
  rationale: Ọnọdụ okwu ahụ na-egosi na Pọl na-ekwu banyere Izrel, ma Grik n’amaokwu a ejighị aha agbụrụ kpọmkwem. Idebe ihe atụ alaka osisi na-ezere ịgbakwunye ihe ederede ahụ na-ekwughị n’amaokwu a.
- issue: Ma a ga-etinye okwu ‘alaka’ nke na-adịghị n’ahịrị Grik a
  choice: E tinyere “alaka” n’isi ederede.
  alternative: “ndị a, bụ́ ndị sitere na ya site n’okike.”
  rationale: Ihe atụ banyere alaka a gbupụrụ na nke a nyadokwara na-achị akụkụ a dum. Okwu “alaka” na-eme ka Igbo bụrụ nke a na-aghọta ngwa ngwa, ma a kọwara mgbakwunye ahụ n’ala peeji.
- issue: Ma a ga-asị na a ga-anyadokwa ha ‘azụ’
  choice: E tinyeghị “azụ” n’isi ederede.
  alternative: “a ga-anyadokwa ha azụ.”
  rationale: Nlọghachi pụtara ìhè n’ọnọdụ okwu ahụ, ma ngwaa Grik n’onwe ya ekwughị “azụ.” Ya mere, a hapụrụ ya maka nkọwa ala peeji ka e wee ghara imechi nghọta ederede karịa ka Grik mere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E jigidere okwu ihe atụ banyere osisi, igbupụ alaka, na ịnyadokwa ya; e zere ịkpọ ndị a ‘ndị Juu’ n’isi ederede n’ihi na Grik hapụrụ aha ahụ ka ọnọdụ okwu kọwaa ya.
