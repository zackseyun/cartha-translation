revisions:
- from: N’ihi na ọ bụrụ na e bipụrụ gị n’osisi oliv ọhịa nke i sitere na ya site n’okike, ma nyadokwaa gị n’osisi oliv a na-akọ, n’ụzọ megidere okike, ọ̀ bụkwanụ na a gaghị anyadokwa ndị a, bụ́ alaka ya site n’okike[a], n’osisi oliv nke ha onwe ha[b], karịa nke ahụ?
  to: N’ihi na ọ bụrụ na e bipụrụ gị n’osisi oliv ọhịa nke sitere n’okike, ma e nyadokwara gị n’osisi oliv a na-akọ n’ụzọ megidere okike, olee ka ọ ga-aka bụrụ na a ga-anyadokwa ndị a, bụ́ alaka sitere n’okike[a], n’osisi oliv nke ha n’onwe ha[b]?
  rationale: E megharịrị nhazi okwu mbụ ka ‘site n’okike’ kọwaa osisi oliv ọhịa, dịka Grik si dị. E dochiri ajụjụ na-adịghị mma anya na nkwupụta ọdịnihu na a fortiori (‘olee ka ọ ga-aka bụrụ na... a ga-anyadokwa’) iji ghara itinye negeshọn. E mekwara passive na okwu nwe ka ha bụrụ Standard Igbo doro anya, na-enweghị ịgbakwunye aha agbụrụ ma ọ bụ nkwenkwe nkọwa.
  reviewer_model: gpt-5.6-terra
