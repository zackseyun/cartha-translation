source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na Chineke emereghị alaka ebumpụta ụwa ebere[a], ọ gaghị emekwa gị ebere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “alaka ndị sitere n’okike”; n’ụzọ nkịtị, “alaka ndị dị ka okike si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: Na-egosipụta ma njikọ nkọwa γάρ (‘n’ihi na’) ma ọnọdụ εἰ (‘ọ bụrụ na’), n’ụzọ Igbo na-aga nke ọma n’arụmụka ahụ.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Ntụgharị Igbo nkịtị na nke kwesịrị ekwesị maka θεός dị ka isiokwu ahịrịokwu.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: alaka ndị sitere n’ọdịdị ha
  rationale: Na-edobe ihe atụ alaka ahụ ma na-egosipụta κατὰ φύσιν, ya bụ, alaka ndị bụ nke osisi ahụ site n’ọdịdị ma ọ bụ mmalite ha, n’enweghị ịkọwa ha kpọmkwem dị ka Izrel n’ahịrị bụ isi.
- source_word: οὐκ ἐφείσατο
  choice: emereghị … ebere
  rationale: N’ọnọdụ a φείδομαι pụtara ịhapụ onye ka ahụhụ ghara iru ya ma ọ bụ ime ya ebere. Nkebiokwu Igbo a bụ nke sitere n’okike ma na-edobe ịdị njọ nke ịdọ aka ná ntị ahụ.
- source_word: οὐδὲ σοῦ φείσεται
  choice: ọ gaghị emekwa gị ebere
  rationale: ‘-kwa’ na-egosipụta njikọ ọjọọ οὐδέ (‘ọ bụghịkwa’), ebe ‘gị’ na-edobe onye nke abụọ otu onye nke σοῦ.
theological_decisions:
- issue: Onye ‘alaka ndị sitere n’ọdịdị ha’ na-anọchi anya ya n’ihe atụ osisi oliv
  choice: E debere ihe atụ ahụ n’ahịrị bụ isi n’enweghị ịkpọ ndị ahụ Izrel kpọmkwem.
  alternative: Ịsụgharị ya hoo haa dị ka ‘ndị Izrel.’
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na-egosi Izrel, ma Pọl ji ‘alaka’ kwuo ya ebe a. Ịhapụ ihe atụ ahụ na-echekwa ihe ederede Grik kwuru n’enweghị ịgbakwunye nkọwa n’ime ntụgharị.
- issue: Ike ịdọ aka ná ntị e nyere ‘gị’
  choice: E gosipụtara ya dị ka ịdọ aka ná ntị kpọmkwem, ma e tinyeghị nkọwa banyere ịnọgide n’okwukwe, ịdapụ, ma ọ bụ nhọpụta otu na nke onwe.
  alternative: Ịkọwa ịdọ aka ná ntị ahụ site n’otu usoro ozizi nzọpụta pụrụ iche.
  rationale: Grik na-enye onye a na-agwa okwu ịdọ aka ná ntị n’ezie, ma ọ naghị edozi arụmụka ozizi ndị sara mbara n’amaokwu a naanị. E debere ‘gị’ dị ka otu onye.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a ma nwee ugwu. E ji ‘alaka’ debe ihe atụ osisi oliv ahụ; e jikwa otu ụdị okwu ‘emereghị … ebere / agaghị emekwa … ebere’ chekwaa myirịta dị n’etiti ụdị abụọ nke φείδομαι.
