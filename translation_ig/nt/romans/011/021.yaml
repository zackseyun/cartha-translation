revisions:
- from: N’ihi na ọ bụrụ na Chineke emereghị alaka ndị sitere n’ọdịdị ha ebere[a], ọ gaghị emekwa gị ebere.
  to: N’ihi na ọ bụrụ na Chineke emereghị alaka ebumpụta ụwa ebere[a], ọ gaghị emekwa gị ebere.
  rationale: The revision replaces only the rendering of κατὰ φύσιν κλάδων and adjusts its footnote. It preserves the source’s olive-tree metaphor, its ambiguity about the referent, the warning’s force, and the singular ‘you.’
  reviewer_model: gpt-5.6-terra
