id: ROM.11.8
reference: Romans 11:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: ig
  text: 'Dị ka e dere: “Chineke nyere ha mmụọ nke nkụnwụ[a], anya ka ha ghara ịhụ na ntị ka ha ghara ịnụ, ruo taa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “mmụọ nke ụra miri emi.” Okwu a na-eme ka Aịzaya 29:10 bata n’uche, ọ bụ ezie na okwu Grik e ji mee ihe n’ebe a na-ekwu maka nkụnwụ, ma ọ bụ ọnọdụ nke mmụọ na uche na-adịghị anabata ihe nke ọma.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Dị nnọọ ka e dere, sị
  rationale: Nke a bụ usoro e ji ewebata ihe e hotara n’Akwụkwọ Nsọ; “dị nnọọ ka” na-egosipụta ike dị na καθώς, ebe “sị” na-eme ka okwu ahụ bụrụ Igbo sitere n’ọnụ nke ọma.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Chineke nyere ha
  rationale: A tụgharịrị isiokwu na omume ahụ ozugbo, n’oge gara aga, n’emeghị ka ọrụ Chineke dị nro dịka nanị ikwe ka ihe mee.
- source_word: πνεῦμα κατανύξεως
  choice: mmụọ nke ịda ogbi n’uche
  rationale: κατάνυξις ebe a na-egosi uche dara ogbi, nke na-enweghị mmetụta ma ọ bụ nghọta kwesịrị ekwesị. Nhọrọ a bụ Igbo doro anya ma na-edobe echiche nke ọnọdụ ime mmụọ na nke uche, ebe a hapụrụ “ụra miri emi” n’ala peeji dịka ntụgharị ọzọ.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: anya ka ha ghara ịhụ ụzọ
  rationale: Usoro a na-edobe njikọ ebumnuche ma ọ bụ ihe si na ya pụta nke τοῦ μὴ na ngwaa infinitive, n’Igbo na-ada nke ọma.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: ntị ka ha ghara ịnụ ihe
  rationale: A na-edobe nhazi ya na nkebi banyere anya, tinyekwa nghọta bụ isi nke ịnụ ihe n’enweghị ịgbanwe ya ka ọ bụrụ irube isi.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: ruo taa kpọmkwem
  rationale: “Kpọmkwem” na-egosipụta nkwusi ike dị n’okwu Grik nke na-ezo aka n’ụbọchị a dị ugbu a.
theological_decisions:
- issue: Ọrụ Chineke n’ime ka uche ghara ịmata ihe dịka ikpe
  choice: Chineke nyere ha
  alternative: Chineke kwere ka ha nwee
  rationale: Asụsụ Grik kpọrọ Chineke aha ozugbo dịka onye mere omume ahụ. Ya mere, a hapụghị ya ka ọ bụrụ nanị na Chineke kwere ka ihe mee; n’otu oge ahụ, ntụgharị ahụ agbakwụnyeghị usoro ozizi ọ bụla karịa ihe Pọl kwuru.
- issue: Ma τοῦ μὴ + infinitive na-egosi ebumnuche ka ọ bụ ihe si na ya pụta
  choice: ka ha ghara ịhụ ụzọ ... ka ha ghara ịnụ ihe
  alternative: anya na-adịghị ahụ ụzọ ... ntị na-adịghị anụ ihe
  rationale: “Ka” na-echekwa ike nke usoro Grik ma hapụ ntakịrị ohere dị n’etiti ebumnuche na ihe si na ya pụta, kama idozi ya kpamkpam n’otu ụzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ụda siri ike nke okwu Akwụkwọ Nsọ ahụ, tinyere nhazi yiri ibe ya nke anya na ntị. Akara ala peeji [a] pụtara n’ederede isi.
