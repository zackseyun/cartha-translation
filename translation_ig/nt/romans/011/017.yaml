revisions:
- from: Ma ọ bụrụ na a gbajipụrụ ụfọdụ n’ime alaka ya, gị onwe gị, ọ bụ ezie na ị bụ osisi oliv ọhịa, ka a nyadoro n’etiti ha[a], i wee soro ha na-eketa òkè na mgbọrọgwụ ahụ, nakwa n’ụba nke osisi oliv ahụ[b],
  to: Ma ọ bụrụ na e gbajipụrụ ụfọdụ n’ime alaka ndị ahụ[a], gị onwe gị, ọ bụ ezie na ị bụ osisi oliv ọhịa, ka a nyadoro n’etiti ha, i wee ghọọ onye so ha na-eketa òkè na mgbọrọgwụ ahụ, nakwa n’ụba nke osisi oliv ahụ[b],
