id: ROM.11.17
reference: Romans 11:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: ig
  text: Ma ọ bụrụ na e gbajipụrụ ụfọdụ n’ime alaka ndị ahụ[a], gị onwe gị, ọ bụ ezie na ị bụ osisi oliv ọhịa, ka a nyadoro n’etiti ha, i wee ghọọ onye so ha na-eketa òkè na mgbọrọgwụ ahụ, nakwa n’ụba nke osisi oliv ahụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka a nyadoro n’etiti alaka ndị ahụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “i wee ghọọ onye so ha na-eketa òkè na mgbọrọgwụ na ụba nke osisi oliv ahụ”; n’ụzọ ọdịnala, “mgbọrọgwụ na abụba nke osisi oliv ahụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δέ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-egosipụta ma ọnọdụ εἰ na obere ntụgharị ma ọ bụ ọdịiche nke δέ n’Igbo dị mfe.
- source_word: τινες τῶν κλάδων
  choice: ụfọdụ n’ime alaka ya
  rationale: “Ụfọdụ n’ime” na-edobe echiche partitive genitive; “ya” na-eme ka njikọ alaka ndị ahụ na osisi oliv dị doo anya.
- source_word: ἐξεκλάσθησαν
  choice: a gbajipụrụ
  rationale: Okwu a na-edobe ihe atụ nke ịgbajipụ alaka n’osisi, kama iji okwu nkọwa okpukpe dochie ya.
- source_word: ἀγριέλαιος ὢν
  choice: ọ bụ ezie na ị bụ osisi oliv ọhịa
  rationale: A tụgharịrị participle ahụ n’ụzọ concessive ma debe ihe atụ nkịtị nke oliv ọhịa, n’agbanyeghị na “ome oliv ọhịa” ga-ekwe omume n’ọnọdụ a.
- source_word: ἐνεκεντρίσθης
  choice: ka a nyadoro
  rationale: “Ịnyado” bụ okwu ọrụ ubi maka itinye ome ma ọ bụ alaka n’osisi ọzọ, ọ na-edobekwa passive nke Grik.
- source_word: ἐν αὐτοῖς
  choice: n’etiti ha
  rationale: Nnọchiaha ahụ na-ezo aka n’alaka ndị fọdụrụ; ntụgharị a na-edobe nke ahụ n’enweghị nkọwa agbakwunyere.
- source_word: συγκοινωνὸς
  choice: soro ha na-eketa òkè
  rationale: Nke a na-egosipụta iketa ihe ọnụ na ndị ọzọ, ọ bụghị naanị inweta uru n’onwe onye.
- source_word: τῆς ῥίζης
  choice: na mgbọrọgwụ ahụ
  rationale: A hapụrụ mgbọrọgwụ dịka akụkụ pụrụ iche nke ihe atụ ahụ kama ime ka ọ bụrụ naanị nkọwa nke ụba.
- source_word: τῆς πιότητος τῆς ἐλαίας
  choice: n’ụba nke osisi oliv ahụ
  rationale: “Ụba” na-egosipụta richness/fatness nke πιότης n’Igbo nke oge a ma zere okwu ga-adị ka abụba nkịtị n’ebe a.
- source_word: ἐγένου
  choice: i wee soro ha na-eketa òkè
  rationale: “I wee” na-egosi na onye a banyere n’ọnọdụ ọhụrụ, dịka aorist nke γίνομαι si kwuo.
theological_decisions:
- issue: Onye ma ọ bụ ihe ἀγριέλαιος na-anọchi anya ya
  choice: osisi oliv ọhịa
  alternative: ome oliv ọhịa; onye mba ọzọ
  rationale: A debeere ihe atụ ọrụ ubi Pọl ji mee ihe; a kọwaghị ya ozugbo dịka “onye mba ọzọ,” ka ntụgharị ghara idozi ihe atụ ahụ n’ụzọ nkọwa okpukpe.
- issue: Njikọ dị n’etiti mgbọrọgwụ na ụba
  choice: iketa òkè na mgbọrọgwụ ahụ, nakwa n’ụba nke osisi oliv ahụ
  alternative: iketa òkè na mgbọrọgwụ bara ụba nke osisi oliv ahụ
  rationale: Usoro genitive ndị Grik dị mkpụmkpụ ma nwee nghọta karịrị otu. Nhọrọ a na-eme ka mgbọrọgwụ na ụba nọgide pụta iche, dịka akwụkwọ ntụle ahụ si mee, ma ihe odide ala peeji na-edobe nghọta ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ogologo ahịrịokwu na kọma ikpeazụ n’ihi na amaokwu a bụ akụkụ mbụ nke ọnọdụ na-aga n’ihu n’amaokwu na-esote. Okwu ọrụ ubi “ịnyado” na ihe atụ “osisi oliv ọhịa” ka edobere n’enweghị ịgbakwunye nkọwa ụka.
