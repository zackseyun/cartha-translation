source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: ig
  text: N’ihi na Chineke akpọchiela mmadụ niile n’ime nnupụisi[a][b][c], ka o wee meere mmadụ niile ebere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “akpọchiela” dị ka “emechiela n’ime” ma ọ bụ “enyefela n’ọnọdụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “nnupụisi” dị ka “ekweghị ekwe” n’ọnọdụ ụfọdụ; ma n’ebe a, echiche sara mbara nke ịjụ irubere isi yikarịrị ka ọ bụ ya Pọl bu n’uche.
    reason: lexical_alternative
  - marker: c
    text: E kwughachiri “mmadụ niile” iji chekwaa okwu Pọl. E kwesịghị ime ka ókè ya dị warara ngwa ngwa; n’ihe gbara amaokwu a gburugburu, ọ na-ekwu banyere ndị Juu na ndị mba ọzọ ọnụ.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: emechiela
  rationale: Okwu a na-egosi imechi ma ọ bụ ịgụnye ndị niile ọnụ n’ọnọdụ a. “Emechiela” na-edobe ihe atụ ahụ n’asụsụ Igbo dị mfe, ma ọ naghị akọwa ya kpọmkwem dị ka ịtụ mkpọrọ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa na-akwado arụmụka Pọl kwuru tupu nke a.
- source_word: τοὺς πάντας
  choice: mmadụ niile
  rationale: A na-edobe otu okwu a n’ebe abụọ ahụ iji chekwaa nhazi na obosara okwu Grik; n’ihe gbara amaokwu ahụ gburugburu, ọ na-ele ndị Juu na ndị mba ọzọ anya ọnụ.
- source_word: εἰς ἀπείθειαν
  choice: n’ime nnupụisi
  rationale: “Nnupụisi” na-egosi ịjụ irubere isi, ọ bụghị nanị enweghị nkwenye. “N’ime” na-edobe echiche εἰς nke ịbanye ma ọ bụ ịnọ n’ọnọdụ ahụ.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo a na-egosi ebumnuche ma ọ bụ ihe omume ahụ na-eduga na ya n'ụzọ doro anya.
- source_word: ἐλεήσῃ
  choice: meere ... ebere
  rationale: Nke a bụ ụzọ Igbo nkịtị ma dị ùgwù isi kwuo omume nke igosi ebere.
theological_decisions:
- issue: Ókè okwu “mmadụ niile” n’ahịrịokwu abụọ ahụ
  choice: E tinyere “mmadụ niile” n’ebe abụọ ahụ, n’emeghị ka ókè ya dị warara ma ọ bụ saa mbara karịa ihe odide Grik.
  alternative: “ndị Juu na ndị mba ọzọ niile” ma ọ bụ “onye ọ bụla”
  rationale: Ihe odide ahụ kwughachiri τοὺς πάντας n’ahịrịokwu abụọ ahụ. Nsụgharị ahụ na-edobe obosara na esemokwu nkà mmụta okpukpe dị n’okwu Pọl, kama ikpebi n’ime nsụgharị ma ọ na-ekwu maka nzọpụta mmadụ niile. Ihe gbara ya gburugburu na-ele ndị Juu na ndị mba ọzọ anya ọnụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe ma dị ùgwù. E ji “mmadụ niile” mee ka τοὺς πάντας doo onye na-agụ ya anya, ma e debere ya otu ihe n’ebe abụọ ahụ. E debere akara nkọwa ụkwụ n’usoro ha metụtara okwu ndị dị n’ahịrịokwu.
