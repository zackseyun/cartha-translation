  to: N’ihi na Chineke akpọchiela mmadụ niile n’ime nnupụisi[a][b][c], ka o wee meere mmadụ niile ebere.
  rationale: The revision changes only the first verb and its lexical note. “Akpọchiela ... n’ime” preserves συνέκλεισεν’s concrete enclosure metaphor and is more natural in contemporary Standard Igbo. The repeated “mmadụ niile,” the disobedience terminology, and the purposive “ka o wee” remain unchanged, retaining the source text’s theological breadth and ambiguity.
