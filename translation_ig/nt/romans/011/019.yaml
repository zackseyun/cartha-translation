- from: Ya mere, ị ga-asị, “E tijiri alaka ụfọdụ ka e wee nyado m n’ime ya.”
  to: Ị ga-asị, “E gbajiri alaka ka a nyado m.”
  rationale: 'The revision removes two unsupported additions while preserving the Greek sequence of an anticipated objection: ''You will say, Branches were broken off so that I might be grafted in.'' It retains passive voice and the agricultural metaphor without making the interlocutor’s claim more explicit than the verse does.'
