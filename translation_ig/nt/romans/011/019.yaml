id: ROM.11.19
reference: Romans 11:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: ig
  text: Ị ga-asị, “E gbajiri alaka ka a nyado m.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: ị ga-asị
  rationale: Ọ bụ ngwaa ọdịnihu, onye nke abụọ otu; ọ na-echekwa okwu Pọl gwara onye ọ na-atụ anya na ọ ga-aza n’arụmụka ahụ.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya ma na-ada nke ọma n’Igbo ugbu a.
- source_word: Ἐξεκλάσθησαν
  choice: E tijiri
  rationale: Ọ na-echekwa ọdịdị ngwaa nnara na ihe atụ nke ịtiji alaka n’osisi, kama ime ya ka ọ bụrụ naanị nchụpụ n’echiche nkịtị.
- source_word: κλάδοι
  choice: alaka ụfọdụ
  rationale: “Alaka” bụ aha kpọmkwem n’ihe atụ osisi oliv; “ụfọdụ” na-egosipụta aha Grik na-enweghị njirimara kpọmkwem ma na-eme ka Igbo doo anya.
- source_word: ἵνα
  choice: ka e wee
  rationale: Ọ na-ebute nkebiokwu nzube ma ọ bụ ihe si na ya pụta, na-ahapụghị esemokwu ahụ n’ụzọ e kpebiri otu akụkụ.
- source_word: ἐγὼ
  choice: m
  rationale: Nnọchiaha onye mbụ dị na nkebiokwu ahụ; nhazi Igbo na-eme ka onye na-ekwu okwu pụta ìhè n’enweghị mgbakwunye okwu.
- source_word: ἐγκεντρισθῶ
  choice: nyado m n’ime ya
  rationale: Ọ na-echekwa ngwaa nnara na ihe atụ ọrụ ịnyado alaka n’osisi; “n’ime ya” na-egosi ịbanye n’osisi ahụ n’enweghị ịgbakwunye “n’etiti ha,” nke na-adịghị n’amaokwu a.
theological_decisions:
- issue: Ma a ga-akọwa na onye na-ekwu okwu bụ onye Pọl chepụtara n’arụmụka ya
  choice: 'Idobe okwu onye nke abụọ kpọmkwem: “ị ga-asị”'
  alternative: “O nwere ike ịbụ na ị ga-asị” ma ọ bụ “otu onye ga-asị”
  rationale: Grik kwuru naanị “ị ga-asị”; ịgbakwunye “otu onye” ga-abụ nkọwa karịrị okwu amaokwu ahụ.
- issue: Ma a ga-eme ka nkebiokwu nzube ahụ bụrụ nkwupụta doro anya banyere nzube Chineke
  choice: “ka e wee nyado m n’ime ya” dị ka nkwupụta onye ahụ na-ekwu
  alternative: Ịgbakwunye na nke a bụ nzube Chineke kpọmkwem
  rationale: Amaokwu ahụ na-akọ echiche onye Jentaịl ahụ chere, ọ bụghị na ọ na-akwado echiche ahụ ozugbo; nsụgharị ahụ anaghị agbakwunye nkwado ma ọ bụ mmegide.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji okwu ọrụ ubi “nyado” chekwaa ihe atụ ịnyado alaka n’osisi oliv; e zere okwu ụka pụrụ iche na nkọwa agbakwunyere.
