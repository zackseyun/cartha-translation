  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: ig
  text: Ma ọ bụ, ònye buru ụzọ nye ya ihe[a][b], a ga-akwụghachikwa ya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, ‘ònye nyere ya ihe tupu onye ọzọ enye.’
    reason: lexical_alternative
  - marker: b
    text: Ihe ọ pụtara bụ na ọ dịghị onye nyere Chineke ihe n’ụzọ ga-eme ka Chineke ji ya ụgwọ ịkwụghachi ya.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ma ọ bụ
  rationale: Ọ na-ewebata ajụjụ ọzọ n’usoro ajụjụ ndị Pọl ji ekwu okwu; ‘Ma ọ bụ’ bụ njikọ doro anya ma bụrụkwa nke Igbo nkịtị.
- source_word: τίς
  choice: ònye
  rationale: Ọ bụ nnọchiaha ajụjụ na-ezo aka n’ mmadụ; ‘ònye’ na-edobe ọdịdị ajụjụ ahụ.
- source_word: προέδωκεν
  choice: buru ụzọ nye
  rationale: Ngwaa a nwere echiche nke inye tupu onye ọzọ enye, ma ọ bụ ibute ụzọ n’inye; nsụgharị a na-edobe echiche na ọ dịghị onye nyere Chineke ihe mbụ nke ga-eme ka Chineke jiri ụgwọ ya.
- source_word: αὐτῷ
  choice: ya
  rationale: A hapụrụ ya dịka nnọchiaha, dị ka ọ dị n’asụsụ Grik. N’ahịrịokwu nke mbụ, ihe gbara amaokwu ahụ gburugburu na-egosi na ọ na-ezo aka na Chineke.
- source_word: καὶ
  choice: -kwa
  rationale: Mgbakwunye ‘-kwa’ jikọtara akụkụ nke abụọ na nke mbụ n’ụzọ Igbo na-asụkarị, ma na-edobe ọrụ njikọ nke καὶ.
- source_word: ἀνταποδοθήσεται
  choice: a ga-akwụghachi
  rationale: 'Nke a na-egosipụta ọdịnihu na olu nnabata nke ngwaa Grik: a ga-akwụghachi ihe e nyere, n’ebughị ụzọ tinye onye ga-akwụ ya nke ederede akpọghị aha.'
- source_word: αὐτῷ
  choice: ya
  rationale: E jigidere nnọchiaha ahụ n’akụkụ nke abụọ. N’ebe a, ọ na-ezo aka n’onye a na-ekwu na o buru ụzọ nye, ya bụ onye a ga-akwụghachi.
theological_decisions:
- issue: Onye nnọchiaha αὐτῷ nke mbụ na-ezo aka na ya
  choice: E dere ya dịka ‘ya,’ ebe ihe gbara ya gburugburu na-egosi na ọ na-ezo aka na Chineke.
  alternative: Iji ‘Chineke’ dochie nnọchiaha ahụ ka ihe dokwuo anya.
  rationale: Asụsụ Grik ji nnọchiaha, ọ bụghị aha ‘Chineke.’ Ide ‘ya’ na-edobe ụdị ederede ahụ ma ghara ịtinye aha na-adịghị n’ahịrịokwu ahụ.
- issue: Mgbanwe onye αὐτῷ nke abụọ na-ezo aka na ya
  choice: E jigidere ‘ya,’ nke n’usoro ajụjụ ahụ na-ezo aka n’onye buru ụzọ nye.
  alternative: Ide ‘onye ahụ’ ka mgbanwe onye a na-ekwu banyere ya pụta ìhè karịa.
  rationale: N’agbanyeghị na nnọchiaha abụọ ahụ bụ otu ụdị n’asụsụ Grik, nke mbụ na-ezo aka na Chineke, nke abụọkwa n’onye e chere na o nyere ya ihe. Igbo ‘ya’ na-edobe ụdị na nkenke nke isi mmalite, ebe usoro ahịrịokwu ahụ na-enye nghọta.
- issue: Echiche nke προέδωκεν banyere ime ka Chineke bụrụ onye ji mmadụ ụgwọ
  choice: E tinyere echiche ibute ụzọ site n’okwu ‘buru ụzọ nye.’
  alternative: ‘nyere ya ihe’ n’enweghị ‘buru ụzọ.’
  rationale: '‘Buru ụzọ’ na-echekwa isi okwu ajụjụ ahụ: ọ dịghị onye nyere Chineke ihe tupu Chineke enye ya, nke ga-eme ka Chineke bụrụ onye ji ya ụgwọ. Nke a na-edobe esemokwu nkà mmụta okpukpe dị n’ederede n’enweghị nkọwa agbakwunyere n’ahịrịokwu bụ isi.'
translation_notes:
  register: E ji Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. Ọdịdị ajụjụ nzaghachi ahụ ka dị, e jikwa ‘ya’ chekwaa nnọchiaha nke Grik n’agbanyeghị mgbanwe onye ọ na-ezo aka na ya n’etiti akụkụ abụọ ahụ.
