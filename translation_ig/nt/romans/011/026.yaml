id: ROM.11.26
reference: Romans 11:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: ig
  text: 'N’ụzọ dị otu a kwa ka a ga-azọpụta Izrel niile[a], dịka e dere ya: “Onye Nzọpụta ga-esi na Zayọn bịa[c]; ọ ga-atụgharị enweghị nsọpụrụ Chineke pụọ n’ebe Jekọb nọ.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ọ bụkwa otu a ka a ga-azọpụta Izrel niile.” Okwu Grik οὕτως nwere ike ịpụta “otu a,” ma n'ebe a, o yikarịrị ka ọ na-egosi ụzọ ihe ahụ ga-esi mee, ya bụ, usoro a kọwara tupu ebe a. Okwu ahụ bụ “Izrel niile” nwere nkọwa dị iche iche; nsụgharị a ekpebighị ma ọ̀ bụ Izrel dịka agbụrụ, ndị fọdụrụ kwere ekwe n'Izrel, ma ọ bụ ndị Chineke niile ka Pọl bu n'uche.
    reason: lexical_alternative_and_interpretive_ambiguity
  - marker: b
    text: “Jekọb” bụ aha dị n'ihe e dere n'Akwụkwọ Nsọ; a gbanweghị ya ka ọ bụrụ “Izrel.”
    reason: source_wording
  - marker: c
    text: N'ụzọ nkịtị, “site na Zayọn.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: n'ụzọ dị otu a
  rationale: Nke a na-egosipụta ụzọ ihe ahụ ga-esi mee, ma na-ejikọta ya na usoro Pọl kọwara tupu ebe a; ọ naghị amanye nkọwa okpukpe ọ bụla.
- source_word: πᾶς Ἰσραήλ
  choice: Izrel niile
  rationale: A hapụrụ okwu Grik ahụ ka ọ guzo n'enweghị ịkọwa kpọmkwem ndị ọ na-ezo aka na ha.
- source_word: σωθήσεται
  choice: a ga-azọpụta
  rationale: Ụdị ọdịnihu nke ngwaa a nwere echiche nzọpụta siri ike n'akwụkwọ Pọl, nke okwu Igbo a na-echekwa.
- source_word: καθὼς γέγραπται
  choice: dịka e dere ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma kwanyere ugwu e si webata ihe e dere n'Akwụkwọ Nsọ.
- source_word: Ἥξει
  choice: ga-abịa
  rationale: Ọ bụ okwu Igbo ebumpụta ụwa nke dabara n'amụma a kpọrọ ihe.
- source_word: ἐκ Σιὼν
  choice: ga-esi na Zayọn bịa
  rationale: Nke a na-egosipụta na Zayọn bụ ebe Onye Nzọpụta ga-esi pụta, ma bụrụkwa okwu Igbo dị mma.
- source_word: ὁ ῥυόμενος
  choice: Onye Nzọpụta
  rationale: E ji aha ọrụ dị ùgwù sụgharịa participle ahụ, n'ụzọ dabara na ọrụ onye ahụ n'okwu amụma a.
- source_word: ἀποστρέψει
  choice: ọ ga-ewepụ
  rationale: N'ọnọdụ a, okwu a na-egosi ime ka ajọ omume pụọ n'ebe Jekọb nọ; 'ewepụ' na-enye echiche ahụ n'Igbo doro anya.
- source_word: ἀσεβείας
  choice: omume asọpụrụghị Chineke
  rationale: Nke a na-echekwa akụkụ omume na nke mmekọrịta mmadụ na Chineke dị n'okwu Grik ahụ.
- source_word: ἀπὸ Ἰακώβ
  choice: n'ebe Jekọb nọ
  rationale: A nọgidere na-eji aha Jekọb dị n'ihe e dere, kama ịgbanwe ya ka ọ bụrụ Izrel.
theological_decisions:
- issue: Ndị okwu ahụ bụ “Izrel niile” na-ezo aka na ha
  choice: E debere “Izrel niile” n'enweghị mgbasawanye nkọwa.
  alternative: Izrel niile dịka agbụrụ; ndị fọdụrụ kwere ekwe n'Izrel; ma ọ bụ ndị Chineke niile gụnyere ndị mba ọzọ
  rationale: Okwu Grik ahụ nwere arụmụka n'otú e si aghọta ya. Nsụgharị ahụ ekwesịghị ikpebi ihe ederede ahụ n'onwe ya na-ahapụghị kpọmkwem.
- issue: Njirimara Onye Nzọpụta
  choice: E ji “Onye Nzọpụta” dịka aha ọrụ dị ùgwù.
  alternative: onye na-anapụta
  rationale: Okwu a bụ aha e ji kọwaa onye na-anapụta ndị ọzọ n'amụma ahụ; ụdị a dị nkenke, dị ùgwù, ma ọ naghị atụkwasị ihe ọzọ n'ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ okwu ndị mmadụ na-asụ nke ọma, ma chekwaa ụda amụma ahụ na mgbagwoju anya gbasara “Izrel niile.”
