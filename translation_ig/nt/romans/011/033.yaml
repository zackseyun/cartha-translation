  to: Oo, lee omimi nke akụ na ụba, amamihe, na ihe ọmụma Chineke![a] Lee ka ikpe ya si bụrụ nke a na-apụghị inyocha, na ka ụzọ ya si bụrụ nke a na-apụghị iso chọpụta![b]
