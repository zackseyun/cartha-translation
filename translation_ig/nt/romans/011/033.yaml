id: ROM.11.33
reference: Romans 11:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: ig
  text: Oo, lee omimi nke akụ na ụba, amamihe, na ihe ọmụma Chineke![a] Lee ka ikpe ya si bụrụ nke a na-apụghị inyocha, na ka ụzọ ya si bụrụ nke a na-apụghị iso chọpụta![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Oo, lee omimi nke akụ na ụba nke amamihe na ihe ọmụma Chineke!” Usoro okwu Grik na-ekwe ka e jikọta “akụ na ụba” na “amamihe na ihe ọmụma” n’ụzọ chiri anya; ma isi ederede weere ha atọ dị ka ihe ndị Chineke nwere.'
    reason: alternative_reading
  - marker: b
    text: Okwu a sụgharịrị “nke a na-apụghị iso chọpụta” pụtara ihe mmadụ na-apụghị iso akara ya ma ọ bụ nzọụkwụ ya chọpụta. Nke a na-edobe ọdịiche ya na “nke a na-apụghị inyocha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Oo, lee
  rationale: Ọ bụ okwu mkpu nke na-egosi oke ịtụnanya na otuto. “Oo, lee” na-ebute mmetụta ahụ n’Igbo nke oge a n’ụzọ doro anya ma dịkwa ùgwù.
- source_word: βάθος
  choice: ịdị omimi
  rationale: N’ebe a okwu ahụ bụ ihe atụ na-egosi ịdị ukwuu nke mmadụ na-apụghị ịtụ oke ya; “ịdị omimi” na-edobe ihe atụ ahụ.
- source_word: πλούτου
  choice: akụ na ụba
  rationale: Ọ na-egosi ụba bara ukwuu, ọ bụghị naanị ego. “Akụ na ụba” bụ okwu Igbo a na-aghọta nke ọma ma na-edobe ịdị arọ nke okwu ahụ.
- source_word: σοφίας
  choice: amamihe
  rationale: Nke a bụ okwu Igbo kwụ ọtọ maka amamihe Chineke, a hapụkwara ya iche n’ihe ọmụma.
- source_word: γνώσεως
  choice: ihe ọmụma
  rationale: “Ihe ọmụma” na-egosi γνώσις nke ọma ma na-edobe ọdịiche ya na “amamihe.”
- source_word: θεοῦ
  choice: Chineke … ya … ya
  rationale: Ịkpọ “Chineke” n’aha ma jiri “ya” mee ihe ugboro abụọ na-eme ka o doo anya n’Igbo na akụ na ụba, amamihe, na ihe ọmụma atọ ahụ bụ nke Chineke.
- source_word: ὡς
  choice: Lee ka … si
  rationale: Nke a na-ebute mkpu nke akụkụ nke abụọ n’ụzọ Igbo si ada nke ọma ma na-edobe “How” nke Grik.
- source_word: ἀνεξεραύνητα
  choice: ihe a na-apụghị inyocha
  rationale: Okwu a pụtara ihe a na-apụghị nyochaa ma ọ bụ chọpụta ya nke ọma ruo n’isi njedebe. “Inyocha” na-edobe echiche nke ime nchọpụta miri emi.
- source_word: κρίματα
  choice: mkpebi ikpe
  rationale: Nke a nwere ike ịgụnye ikpe, mkpebi, na ihe Chineke kpebiri. “Mkpebi ikpe” na-edobe obosara ahụ n’enweghị ime ka ọ bụrụ naanị iwu e nyere.
- source_word: ἀνεξιχνίαστοι
  choice: ihe a na-apụghị iso chọpụta
  rationale: Okwu ahụ nwere echiche nke iso akara ma ọ bụ nzọụkwụ chọpụta ihe. Nsụgharị a na-eme ka ọ dị iche na “ihe a na-apụghị inyocha.”
- source_word: ὁδοὶ
  choice: ụzọ
  rationale: “Ụzọ” na-edobe ihe atụ nke na-ekwu banyere otú Chineke si eme ihe na usoro omume ya.
- source_word: αὐτοῦ
  choice: ya
  rationale: Nnọchiaha a na-ezo aka na Chineke, a tụgharịkwara ya n’ụzọ Igbo kwụ ọtọ.
theological_decisions:
- issue: Mmekọrịta “nke Chineke” na “akụ na ụba na amamihe na ihe ọmụma”
  choice: A kọwara akụ na ụba, amamihe, na ihe ọmụma atọ ahụ dị ka ihe nke Chineke.
  alternative: “Ịdị omimi nke akụ na ụba nke amamihe na ihe ọmụma Chineke.”
  rationale: Usoro okwu Grik nwere ike ikwe ka e jikọta “akụ na ụba” na okwu abụọ na-esote ya n’ụzọ chiri anya. Ma n’ebe a, ịgụ ha dị ka ihe atọ nke Chineke bụ nghọta kacha kwekọọ n’usoro otuto ahụ; e debere nghọta ọzọ n’ala peeji.
- issue: Idobe ọdịiche dị n’etiti ἀνεξεραύνητα na ἀνεξιχνίαστοι
  choice: “ihe a na-apụghị inyocha” na “ihe a na-apụghị iso chọpụta”
  alternative: Iji otu okwu ma ọ bụ okwu abụọ fọrọ nke nta ka ha bụrụ otu ihe nye ha abụọ.
  rationale: Grik ji okwu abụọ nwere njikọ ma dị iche. Nsụgharị ahụ na-edobe echiche nke nyocha n’otu ebe na nke iso akara chọpụta ihe n’ebe nke ọzọ, n’ebughị ọdịiche ahụ karịa ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe ụda mkpu na otuto nke Grik, ma zere okwu ochie ma ọ bụ okwu pụrụ iche nke otu ụka.
