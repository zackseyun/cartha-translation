  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: ig
  text: Ma ọ bụ unu ndị mba ọzọ[a] ka m na-ekwu okwu. Ebe ọ bụ na m bụ onyeozi nye ndị mba ọzọ, ana m eme ka ọrụ m dị ukwuu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị mba dị iche iche,” n’ebe abụọ ahụ ἔθνος/ἐθνῶν pụtara.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ana m enye ọrụ m otuto.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Ma ana m agwa unu bú ndị mba ọzọ okwu
  rationale: A jikọtara nnọchiaha na nkọwa ndị a na-agwa okwu dịka Grik si eme. “Ma” na-egosi mgbanwe dị nro nke δέ, ebe “ana m agwa ... okwu” na-egosipụta ngwaa dị ugbu a n’Igbo nkịtị.
- source_word: ἔθνεσιν / ἐθνῶν
  choice: ndị mba ọzọ
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ụmụ mmadụ na-abụghị ndị Juu, n’ime ọdịiche Pọl na-eme n’etiti Izrel na mba ndị ọzọ; “ndị mba ọzọ” bụ okwu Igbo doro anya ma bụrụkwa nke a na-aghọta nke ọma.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: Ebe ọ bụ na
  rationale: Nkebiokwu a na-egosi ihe ndabere nke okwu Pọl na-aga ikwu. Nsụgharị a bụ nke sitere n’okwu ahụ ma na-ada nke ọma n’Igbo, ebe a naghị amanye ntụgharị iche iche maka irighiriokwu μὲν οὖν.
- source_word: ἀπόστολος
  choice: onyeozi
  rationale: “Onyeozi” na-egosipụta ọrụ pụrụ iche e zigara Pọl ịrụ, ọ bụghị naanị onye na-ebuga ozi nkịtị.
- source_word: τὴν διακονίαν μου
  choice: ọrụ m
  rationale: N’ebe a διακονία bụ ọrụ e nyere Pọl ịrụ. “Ọrụ m” bụ okwu Igbo dị mfe ma gbochie ka a tụnye nkọwa ụka pụrụ iche n’ime ya.
- source_word: δοξάζω
  choice: ana m enye ... nsọpụrụ
  rationale: Okwu a pụtara inye otuto ma ọ bụ nsọpụrụ. N’ọnọdụ a, Pọl na-asọpụrụ ọrụ ya, ọ bụghị onwe ya; ntụgharị a na-echekwa isi echiche ahụ n’Igbo doro anya.
theological_decisions:
- issue: Ihe Pọl pụtara mgbe ọ na-ekwu banyere ọrụ ya
  choice: Ọ na-enye ọrụ ozi ya nsọpụrụ, ọ naghị enye onwe ya otuto.
  alternative: Ana m enye ọrụ m otuto; ana m eme ka ọrụ m dị ukwuu.
  rationale: Ihe δοξάζω na-emetụta kpọmkwem bụ “ọrụ m.” Nsụgharị a na-echekwa ike okwu ahụ ma ghara ịkọwa ya dịka Pọl na-ebuli onwe ya elu.
- issue: Ndị ἔθνη bụ ndị a na-ekwu maka ha
  choice: Ndị mba ọzọ, ya bụ ndị na-abụghị ndị Juu.
  alternative: Mba dị iche iche.
  rationale: N’ime Ndị Rom 9–11, a na-atụnyere Izrel na ndị na-abụghị ndị Juu. Ma n’ihi na okwu Grik ahụ nwekwara ike ịpụta “mba,” e debere nke ahụ n’ala ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. “Bú” na-akọwa ndị a na-agwa okwu; e zere okwu ụka nke nwere ike ibubata nkọwa otu okpukpe pụrụ iche.
