revisions:
- from: Ma ana m agwa unu bú ndị mba ọzọ[a] okwu. Ebe ọ bụ na abụ m onyeozi nke ndị mba ọzọ, ana m enye ọrụ m nsọpụrụ[b],
  to: Ma ọ bụ unu ndị mba ọzọ[a] ka m na-ekwu okwu. Ebe ọ bụ na m bụ onyeozi nye ndị mba ọzọ, ana m eme ka ọrụ m dị ukwuu[b],
  rationale: The revision makes the direct address idiomatic, clarifies that Paul is apostle to the Gentiles, and uses a natural rendering of δοξάζω that preserves its rhetorical force. Footnote a is corrected so its alternative refers to people rather than addressing the readers as countries. The source’s mild δέ transition is retained with “Ma,” and no doctrinal interpretation is added.
