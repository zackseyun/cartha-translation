  timestamp: '2026-07-17T10:26:41Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies ἔθνη/ἐθνῶν as non-Jewish peoples in this context and retains the ministry, rather than Paul himself, as the object of δοξάζω. However, “ana m agwa unu … okwu” is less exact for λέγω with a direct addressee than an explicit “I speak to you” construction. The genitive in ἀπόστολος ἐθνῶν is most naturally expressed as mission directed to the Gentiles in Igbo.
  naturalness: “Ma ọ bụ unu ndị mba ọzọ ka m na-ekwu okwu” is natural Standard Igbo and preserves the marked direct address. “Ana m eme ka ọrụ m dị ukwuu” is a natural way to convey ‘magnify/glorify my ministry’ without implying that Paul honors himself.
  terminology: “Ndị mba ọzọ” suitably communicates Gentiles in Romans 9–11. “Onyeozi” is appropriate for ἀπόστολος, while “onyeozi nye ndị mba ọzọ” avoids suggesting that the Gentiles commissioned Paul. “Ọrụ m” is acceptable for διακονία in this compact sentence.
  issues:
  - severity: medium
    issue: The opening verbal expression is awkward and slightly imprecise.
    rationale: “Ana m agwa unu … okwu” more readily means ‘I tell you words/a matter.’ Greek λέγω τοῖς ἔθνεσιν here is direct speech addressed to the Gentiles; “ọ bụ unu … ka m na-ekwu okwu” represents this idiomatically.
  - severity: low
    issue: The alternative in footnote a calls the addressees ‘unu bú mba dị iche iche.’
    rationale: The addressees are people, not countries. “Ndị mba dị iche iche” preserves the lexical alternative ‘nations’ while retaining an appropriate human referent.
  - severity: low
    issue: “Onyeozi nke ndị mba ọzọ” can be heard as an apostle belonging to or sent by Gentiles.
    rationale: The context and Greek genitive indicate Paul’s apostolic mission toward Gentiles. “Onyeozi nye ndị mba ọzọ” is clearer in Standard Igbo.
  revised_text: Ma ọ bụ unu ndị mba ọzọ[a] ka m na-ekwu okwu. Ebe ọ bụ na m bụ onyeozi nye ndị mba ọzọ, ana m eme ka ọrụ m dị ukwuu[b],
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị mba dị iche iche,” n’ebe abụọ ahụ ἔθνος/ἐθνῶν pụtara.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ana m enye ọrụ m otuto.”
    reason: lexical_alternative
  revision_rationale: The revision makes the direct address idiomatic, clarifies that Paul is apostle to the Gentiles, and uses a natural rendering of δοξάζω that preserves its rhetorical force. Footnote a is corrected so its alternative refers to people rather than addressing the readers as countries. The source’s mild δέ transition is retained with “Ma,” and no doctrinal interpretation is added.
