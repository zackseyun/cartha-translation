id: ROM.11.11
reference: Romans 11:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: ig
  text: 'Ya mere, ana m ajụ: Ha sụrụ ngọngọ ka ha wee daa[a]? Mba, ọ gaghị adị! Kama, site ná mmehie ha[b], nzọpụta erutela ndị mba ọzọ[c], iji mee ka ha nwee ekworo[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N'ụzọ nkịtị, ‘ka ha wee daa.’ Okwu Grik kewapụtara ‘ịsụ ngọngọ’ na ‘ịda,’ ajụjụ ahụ na-atụkwa anya azịza mba.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘site ná njehie ha’ ma ọ bụ ‘site ná nnupụisi ha.’
    reason: lexical_alternative
  - marker: c
    text: N'asụsụ Grik, ‘mba dị iche iche’; n'ebe a ọ pụtara ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, ‘ịkpasu ha ekworo’; nke a nwekwara ike ịgụnye ịkpali ha ịchọ otu nzọpụta ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Ya mere, ana m ajụ
  rationale: N'okwu arụmụka a, λέγω na-ewebata ajụjụ Pọl, ebe οὖν na-egosi njikọ ya na ihe e kwuru tupu ya.
- source_word: μὴ ἔπταισαν
  choice: Ha sụrụ ngọngọ ...?
  rationale: Ajụjụ e ji μή malite na-atụ anya azịza mba; ‘sụrụ ngọngọ’ bụ okwu Igbo doro anya ma na-echekwa ihe oyiyi nke πταίω.
- source_word: ἵνα πέσωσιν
  choice: ka ha wee daa kpamkpam
  rationale: ‘Daa’ na-anọgide iche na ‘sụrụ ngọngọ.’ ‘Kpamkpam’ na-eme ka ọdịiche ahụ doo anya n'Igbo, ma ihe odide ukwu anaghị agbakwụnye na ọdịda ahụ agaghị enwe mgbake; nkọwa ala na-echekwa ntụgharị nkịtị.
- source_word: μὴ γένοιτο
  choice: Ọ dịghị ma ọlị!
  rationale: Nke a bụ ajụjụ-azịza Igbo siri ike ma kwekọọ na nkwụsi ike nke okwu Pọl na-ajụ echiche ahụ kpamkpam.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: site ná mmehie ha
  rationale: παράπτωμα bụ mmejọ ma ọ bụ nnupụisi; ‘mmehie’ bụ okwu dị mfe, dị arọ n'omume, ma bụrụ nke ndị na-agụ Igbo taa ghọtara nke ọma.
- source_word: ἡ σωτηρία
  choice: nzọpụta
  rationale: ‘Nzọpụta’ bụ okwu Igbo a na-ejikarị akọwa σωτηρία ma na-echekwa ibu okwu ahụ nwere na Ndị Rom.
- source_word: τοῖς ἔθνεσιν
  choice: ndị mba ọzọ
  rationale: N'ebe a ἔθνη pụtara ndị na-abụghị ndị Juu; ‘ndị mba ọzọ’ na-egosipụta ọdịiche ahụ n'Igbo karịa nanị ‘mba dị iche iche.’
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: iji kpalie ha inwe ekworo
  rationale: Nke a na-echekwa nzube ma ọ bụ nsonaazụ nke εἰς τό na oke nghọta nke παραζηλόω, n'ebughị ụzọ kpebie ma ekworo ahụ bụ naanị nke ọjọọ ma ọ bụ nke ga-akpali iṅomi.
theological_decisions:
- issue: Ma ịsụ ngọngọ Izrel bụ ọdịda ikpeazụ nke na-enweghị mgbake
  choice: Ajụjụ ahụ na-ajụ na ịsụ ngọngọ ha bụ ka ha wee daa kpamkpam.
  alternative: A pụrụ ịsụgharị ya n'ụzọ nkịtị naanị dịka ‘ka ha wee daa,’ n'ekwughị ‘kpamkpam.’
  rationale: E debere ọdịiche dị n'etiti πταίω na πίπτω, ma e zere ikwu n'ụzọ doro anya na amaokwu a n'onwe ya na-ekwe nkwa mgbake onye ọ bụla.
- issue: Ihe okwu ekworo pụtara n'usoro nzọpụta
  choice: Nzọpụta rutere ndị mba ọzọ iji kpalie ha inwe ekworo.
  alternative: O nwere ike ịpụta ịkpasu ha ekworo nke ga-akpali ha ịchọ otu nzọpụta ahụ.
  rationale: παραζηλόω nwere ike igosi ekworo ma ọ bụ mkpali ịṅomi; isiokwu ukwu na nkọwa ala na-echekwa oke nghọta abụọ ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro ajụjụ ‘ana m ajụ’ iji mee ka arụmụka Pọl daa nke ọma n'Igbo; e zere okwu okpukpe nke otu ụka pụrụ iche.
