  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: ig
  text: N’ihi na a naghị eweghachi onyinye na ọkpụkpọ Chineke azụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Chineke anaghị akwa ụta banyere onyinye na ọkpụkpọ ya,” ma ọ bụ, “a naghị anapụ ha azụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: adịghị eweghachi ... ma ọ bụ kagbuo
  rationale: Okwu a pụtara ihe a na-adịghị akwa ụta banyere ya ma ọ bụ nke a na-adịghị eweghachi. N’ebe a, nkebiokwu abụọ a na-egosi n’Igbo dị ugbu a na Chineke anaghị anapụ onyinye ya ma ọ bụ kagbuo ọkpụkpọ ya, n’etinyeghị echiche siri ike karịa ihe Grik kwuru.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Nke a na-edobe ọrụ γάρ dị ka njikọ na-enye ihe kpatara ma ọ bụ nkọwa maka okwu bu ụzọ.
- source_word: τὰ χαρίσματα
  choice: onyinye ya
  rationale: “Onyinye” bụ okwu Igbo doro anya ma dị mfe maka χάρισμα; “ya” na-egosi na Chineke bụ isi iyi ma ọ bụ onye nwe onyinye ndị ahụ, dị ka genitive Grik si kwe omume.
- source_word: ἡ κλῆσις
  choice: ọkpụkpọ ya
  rationale: “Ọkpụkpọ” na-echekwa echiche nke Chineke ịkpọ mmadụ, ma ghara ịkọwa n’ime amaokwu ahụ ma ọ bụ ọkpụkpọ Izrel kpọmkwem ka a na-ekwu maka ya.
- source_word: τοῦ θεοῦ
  choice: Chineke ... ya
  rationale: A gbanwere nhazi genitive ahụ ka ọ bụrụ ahịrịokwu Igbo sitere n’okike, Chineke bụrụ onye na-eme ihe, ebe nnọchiaha “ya” na-ejikọta onyinye na ọkpụkpọ ahụ na ya.
theological_decisions:
- issue: Ihe “onyinye na ọkpụkpọ Chineke” na-ezo aka na ya
  choice: Ahapụrụ okwu ahụ n’enweghị ịkpọ Izrel aha ma ọ bụ ime ya ka ọ bụrụ ụkpụrụ gbasara ndị niile kwere ekwe.
  alternative: Ịkọwa ya kpọmkwem dị ka ihe ùgwù na ọkpụkpọ Izrel, ma ọ bụ dị ka ụkpụrụ izugbe banyere onyinye na ọkpụkpọ Chineke niile.
  rationale: Ọnọdụ Rom 9–11 na-elekwasị anya n’Izrel, ma amaokwu Grik a ekwughị onye ọkpụkpọ ahụ metụtara ọzọ. Ya mere, nsụgharị ahụ na-echekwa ohere na esemokwu nkọwa ahụ.
- issue: Ma ἀμεταμέλητα ọ na-emesi enweghị ịkwa ụta ike ka ọ bụ enweghị iweghachi azụ
  choice: Isi ederede na-eji echiche nke enweghị iweghachi ma ọ bụ ịkagbu; nkọwa ala peeji na-edobe ihe ọzọ nwere ike ịbụ “ọ naghị akwa ụta.”
  alternative: Ịsụgharị naanị dịka “Chineke anaghị akwa ụta banyere ha.”
  rationale: N’ọnọdụ a, enweghị iweghachi na-akọwa n’Igbo ihe okwu ahụ pụtara n’ụzọ doro anya, ma nkọwa ala peeji na-echekwa obosara okwu Grik ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ahịrịokwu Chineke bụ onye na-eme ihe n’ihi na ọ na-ada nke ọma karịa ime “onyinye na ọkpụkpọ” ka ha bụrụ isiokwu nke okwu “a na-apụghị ịkagbu.”
