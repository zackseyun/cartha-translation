  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: ig
  text: Ọ dị mma; e tiwapụrụ ha n’ihi ekweghị ekwe, ma gị onwe gị ji okwukwe guzo. Echela onwe gị elu[a], kama tụọ egwu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Adịla mpako,” ma ọ bụ, “Echela echiche mpako.”
    reason: lexical_alternative
  - marker: b
    text: Ya bụ, tụọ egwu n’ihu Chineke n’ịdị umeala n’obi, n’ịkwanyere ya ùgwù, na n’ịkpachara anya; atụkwasịla onwe gị obi n’ụzọ mpako.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: Ọ dị mma
  rationale: Nke a na-egosi nkwenye Pọl n’ihe e kwuru n’amaokwu gara aga; ọ bụkwa okwu Igbo dị mfe ma kwanyere ederede ùgwù.
- source_word: ἀπιστίᾳ
  choice: n’ihi ekweghị ekwe
  rationale: Dative a na-egosi ihe kpatara e ji tiwapụ alaka ndị ahụ, ma na-edobe ọdịiche ya na πίστις.
- source_word: ἐξεκλάσθησαν
  choice: e tiwapụrụ ha
  rationale: 'Ọ na-edobe ihe atụ osisi oliv: a gbajiri ma wepụ alaka n’osisi.'
- source_word: πίστει
  choice: ji okwukwe
  rationale: Ọ na-egosi ụzọ ma ọ bụ ntọala onye ahụ ji guzo, ma na-edobe okwu okwukwe dị iche n’ekweghị ekwe.
- source_word: ἕστηκας
  choice: guzo
  rationale: Perfect Greek na-egosi ọnọdụ dị ugbu a sitere n’ihe merela; ‘ji okwukwe guzo’ bụ Igbo eke ma na-eburu echiche ahụ.
- source_word: ὑψηλὰ φρόνει
  choice: Echela onwe gị elu
  rationale: Akpaalaokwu a pụtara iche echiche dị elu banyere onwe onye, ya bụ mpako; ntụgharị a na-edobe oyiyi echiche nke Greek ma doo ndị na-agụ ya anya.
- source_word: φοβοῦ
  choice: tụọ egwu
  rationale: A hapụrụ iwu ahụ n’ike ya n’emeghị ka ọ bụrụ naanị nsọpụrụ ma ọ bụ ụjọ jijiji.
theological_decisions:
- issue: Ihe πίστις pụtara mgbe e jiri ya tụnyere ἀπιστία
  choice: okwukwe
  alternative: ntụkwasị obi
  rationale: Ọdịiche ya na ‘ekweghị ekwe’ na-akwado nzaghachi mmadụ nke okwukwe; ‘ntụkwasị obi’ ka bụ ụzọ ọzọ nwere isi, ya mere e depụtara ya n’ala peeji.
- issue: Ike na nghọta nke φοβοῦ
  choice: tụọ egwu
  alternative: nwee egwu nkwanye ùgwù
  rationale: A na-edobe ịdọ aka ná ntị megide mpako na ntụkwasị onwe obi n’ike ya, n’emeghị ka ‘egwu’ ghọọ naanị nkwanye ùgwù ma ọ bụ ụjọ enweghị olileanya.
translation_notes:
  register: Standard Igbo dị ugbu a, dị mfe nghọta ma dị ùgwù. A họọrọ ‘e tiwapụrụ’ iji chekwaa ihe atụ alaka osisi, ‘ji okwukwe guzo’ maka ọdịiche okwukwe na ekweghị ekwe, na ‘tụọ egwu’ iji chekwaa esemokwu nkà mmụta okpukpe nke ederede.
