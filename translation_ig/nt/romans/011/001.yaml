  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: ig
  text: Ya mere, ana m ajụ, Chineke ọ̀ jụla ndị nke ya[a]? O kwesịghị ịdị otu a ma ọlị![b] N’ihi na mụ onwe m bụkwa onye Izrel, nke sitere n’agbụrụ Ebreham[c], nke sikwa n’ebo Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Chineke ọ̀ chụpụla ndị nke ya?”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “O kwesịghị ịdị otu a ma ọlị!” bụ nkwupụta siri ike e ji jụ ihe; a pụkwara ịsụgharị ya, “Mba, ọ gaghị adị otu a!”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “nke sitere ná mkpụrụ Ebreham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Ya mere, ana m ajụ
  rationale: “Ya mere” na-egosipụta njikọ nkwubi okwu nke οὖν, ebe “ana m ajụ” na-eme ka o doo anya na λέγω na-ebute ajụjụ nzaghachi.
- source_word: μὴ ἀπώσατο
  choice: ọ̀ jụla
  rationale: Ajụjụ e ji μή malite na-atụ anya azịza na-adịghị mma; “jụla” na-egosipụta ịjụ ma ọ bụ ịchụpụ n’enweghị ịgbakwụnye echiche nke ‘ruo mgbe ebighị ebi’ ma ọ bụ ‘kpamkpam.’
- source_word: τὸν λαὸν αὐτοῦ
  choice: ndị nke ya
  rationale: Nke a na-edobe echiche nke ndị bụ nke Chineke, ma na-eji okwu Igbo doro anya na nke e ji ekwu okwu ugbu a.
- source_word: μὴ γένοιτο
  choice: Ya adịla ma ọlị!
  rationale: Nke a bụ nkwupụta siri ike nke ịjụ echiche ahụ, ọ bụghị naanị ịsị ‘mba.’ Ọ na-edobekwa ọdịdị arịrịọ nke okwu Grik.
- source_word: καὶ γὰρ ἐγὼ
  choice: N’ihi na mụ onwe m bụkwa
  rationale: “N’ihi na” na-egosipụta ihe akaebe nke γάρ; “mụ onwe m” na-ebupụta nkwusi ike dị na ἐγώ, ebe “bụkwa” na-egosipụta καί.
- source_word: Ἰσραηλίτης
  choice: onye Izrel
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwụ ọtọ isi gosipụta njirimara agbụrụ na nke ndị ọgbụgba ndụ ahụ.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: onye sitere n’agbụrụ Ebreham
  rationale: N’ebe a σπέρμα na-ekwu maka usoro ọmụmụ. “Sitere n’agbụrụ Ebreham” bụ Igbo eke ma doo anya, ebe nkọwa ala peeji na-edobe ihe oyiyi nkịtị nke ‘mkpụrụ.’
- source_word: φυλῆς Βενιαμίν
  choice: onye si n’ebo Benjamin
  rationale: “Ebo” bụ okwu Igbo kwesịrị ekwesị maka φυλή, ma usoro a na-egosipụta njikọ ọmụmụ Pọl na Benjamin.
theological_decisions:
- issue: Ma ajụjụ Pọl ọ̀ na-ekwu na Chineke jụrụ Izrel kpamkpam ma ọ bụ ruo mgbe ebighị ebi
  choice: Chineke ọ̀ jụla ndị nke ya?
  alternative: Chineke ọ̀ jụla ndị nke ya kpamkpam? / Chineke ọ̀ chụpụla ndị nke ya ruo mgbe ebighị ebi?
  rationale: Ihe odide Grik enweghị okwu pụtara ‘kpamkpam’ ma ọ bụ ‘ruo mgbe ebighị ebi.’ Ya mere, nsụgharị ahụ na-edobe ajụjụ ahụ n’enweghị idozi esemokwu nkà mmụta okpukpe nke amaokwu ndị na-esochi ga-akọwakwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị nsọ ma dị mfe nghọta, dee ya. A họọrọ “ndị nke ya” iji dobe echiche nke ndị Chineke nwe, “Ya adịla ma ọlị!” iji chekwaa ike nkwupụta Pọl, na “agbụrụ Ebreham” iji mee ka usoro ọmụmụ doo onye na-agụ akwụkwọ anya.
