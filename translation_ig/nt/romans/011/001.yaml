  rationale: The revision replaces the unnatural repudiation formula with an idiomatic Standard Igbo equivalent that preserves μὴ γένοιτο’s emphatic rejection, and it smooths the appositional ancestry clauses. It retains all source-level ambiguity regarding the scope of God’s rejection and preserves every footnote anchor.
