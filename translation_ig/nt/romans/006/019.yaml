id: ROM.6.19
reference: Romans 6:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: ig
  text: Ana m ekwu okwu n'ụzọ mmadụ n'ihi adịghị ike nke anụ ahụ unu.[a] N'ihi na dị ka unu si nyefee akụkụ ahụ unu ka ha bụrụ ndị ohu nke adịghị ọcha na nke mmebi iwu, nke na-eduga ná mmebi iwu, otu ahụkwa ugbu a, nyefeenụ akụkụ ahụ unu ka ha bụrụ ndị ohu nke ezi omume,[b] nke na-eduga n'ịdị nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịghọta “anụ ahụ” n'ebe a dịka “ọdịdị mmehie,” ma okwu Grik ahụ sara mbara karịa nke ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Ana m ekwu okwu n'ụzọ mmadụ
  rationale: Nke a na-egosi na Pọl na-ekwu n'ụzọ ndị mmadụ pụrụ ịghọta; ọ na-edobe akpaalaokwu Grik n'enweghị ịkọwa ya kpọmkwem dịka naanị ihe atụ.
- source_word: ἀσθένειαν
  choice: adịghị ike
  rationale: Ọ bụ okwu sara mbara ma doo anya nke pụrụ ịgụnye adịghị ike mmadụ n'anụ ahụ na n'omume, dịka Grik si hapụ ya.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: Nhọrọ a na-edobe obosara nke okwu Grik karịa ịkọwa ya ozugbo dịka ‘ọdịdị mmehie.’
- source_word: παρεστήσατε / παραστήσατε
  choice: nyefee / nyefeenụ
  rationale: Iji otu mgbọrọgwụ okwu mee ihe ugboro abụọ na-echekwa ntụnyere dị n'etiti omume gara aga na iwu a na-enye ugbu a.
- source_word: μέλη
  choice: akụkụ ahụ
  rationale: Nke a bụ Igbo doro anya maka akụkụ anụ ahụ na ikike mmadụ ji eme omume.
- source_word: δοῦλα
  choice: ndị ohu
  rationale: Ọ na-echekwa ike nke ihe atụ gbasara ịbụ ohu, ikike onye nwe ohu, na nrubeisi nke dị n'arụmụka Ndị Rom 6.
- source_word: ἀκαθαρσίᾳ
  choice: adịghị ọcha
  rationale: Ọ bụ okwu Igbo nkịtị nke na-eburu echiche omume rụrụ arụ n'ebe a.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: mmebi iwu / mmebi iwu
  rationale: Ikwughachi otu okwu ahụ na-echekwa nkwughachi na ọganihu rhetorik nke Grik.
- source_word: εἰς τὴν ἀνομίαν
  choice: nke na-eduga ná mmebi iwu
  rationale: Nke a na-egosipụta ụzọ ma ọ bụ nsonaazụ nke εἰς n'Igbo dị mfe nghọta.
- source_word: δικαιοσύνῃ
  choice: ezi omume
  rationale: N'ebe a ọ dabara na ntụnyere omume megide adịghị ọcha na mmebi iwu, ma ihe ọzọ ọ pụrụ ịpụta ka edobere n'okpuru peeji.
- source_word: ἁγιασμόν
  choice: ịdị nsọ
  rationale: Ọ na-egosipụta ọnọdụ ma ọ bụ nsonaazụ nke ido mmadụ nsọ n'ụzọ Igbo nkịtị, ma na-echekwa echiche nke ije ruo n'ịdị nsọ.
theological_decisions:
- issue: Ihe σάρξ pụtara n'okwu ‘adịghị ike nke anụ ahụ unu’
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: Ọnọdụ a na-ekwu maka adịghị ike mmadụ n'ọnọdụ ndụ ya, ma Grik anaghị amanye nkọwa dị warara nke ‘ọdịdị mmehie’; ya mere e debere esemokwu ahụ.
- issue: Nsụgharị δικαιοσύνη n'ọnọdụ akwụkwọ Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: Ntụnyere ya na adịghị ọcha na mmebi iwu na-akwado ‘ezi omume’ n'ahịrịokwu bụ isi, ebe ‘ikpe ziri ezi’ ka bụ ihe okwu ahụ pụrụ ịpụta.
- issue: Ihe εἰς ἁγιασμόν na-egosi
  choice: nke na-eduga n'ịdị nsọ
  alternative: maka ido nsọ
  rationale: Nhọrọ a na-egosi ụzọ ma ọ bụ nsonaazụ n'enweghị ikpebi kpamkpam ma ἁγιασμός bụ usoro ido nsọ ma ọ bụ ọnọdụ ịdị nsọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ndị ohu’ chekwaa ike nke ihe atụ Pọl, ebe ‘akụkụ ahụ’ na ‘ịdị nsọ’ na-eme ka ahịrịokwu ahụ bụrụ nke ndị nkịtị ga-aghọta. Akara nkọwa [a] na [b] kwekọrọ n'okwu ha na-akọwa.
