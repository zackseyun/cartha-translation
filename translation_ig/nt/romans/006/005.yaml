  - severity: low
    issue: Enweghị ‘nke’ n’ime ‘oyiyi ọnwụ ya’ na ‘oyiyi mbilite n’ọnwụ ya.’
    rationale: Ọ bụ ezie na a pụrụ ịghọta ya, ‘oyiyi nke ...’ bụ nhazi genitive doro anya ma bụrụ nke eke karịa n’Igbo ọkọlọtọ.
