  to: N’ihi na ọ bụrụ na anyị na ya ejikọọla n’oyiyi nke ọnwụ ya,[a] anyị ga-esokwa ya jikọọ n’oyiyi nke mbilite n’ọnwụ ya.[b]
  rationale: 'E mere naanị mmezi ụtọasụsụ na nhazi okwu: ‘ejikọọla’ na-egosi njikọ ọnụ nke σύμφυτοι nke ọma, ‘nke’ na-eme mmekọrịta ‘oyiyi’ na ọnwụ/mbilite n’ọnwụ doo anya. A hapụrụ ellipsis na nrụgide nke akụkụ nke abụọ ka ọ dị, site n’ikwughachi echiche njikọ ahụ n’Igbo maka nghọta.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:19Z'
review_pass:
  verdict: revise
  source_fidelity: Ntugharị ahụ na-echekwa nke ọma perfect γεγόναμεν (‘-tala’), njikọ/ikere òkè nke σύμφυτοι, na ellipsis dị n’akụkụ ọdịnihu. Otú ọ dị, ‘ejikọtala’ nwere ike ịpụta ngwaa transitive (‘ejikọtala ihe’) karịa njikọ ndị mmadụ abụọ batara; ‘ejikọọla’ na-ekwu nke ọma na anyị na Kraịst ejikọwo ọnụ. Itinye ‘nke’ n’ọrụ ‘oyiyi nke ọnwụ/mbilite n’ọnwụ ya’ na-eme njikọ genitive Grik ahụ doo anya n’Igbo.
  naturalness: ‘Anyị na ya ejikọọla’ na ‘n’oyiyi nke ...’ bụ Standard Igbo dịkwuo eke ma doo anya karịa ‘anyị na ya ejikọtala n’oyiyi ...’. Nhazi ọdịnihu ‘anyị ga-esokwa ya jikọọ’ ka dị mfe nghọta ma na-edobe mmụba ike nke ἀλλὰ καί.
  terminology: E debere ‘oyiyi,’ ‘ọnwụ,’ na ‘mbilite n’ọnwụ,’ bụ okwu Baịbụl Igbo a na-ahụkarị. A naghị agbakwunye nkọwa sakrament ma ọ bụ nkọwa ozizi ọ bụla; ‘ya’ na akụkụ nke abụọ na-agbaso ihe e bu ụzọ kpọọ n’akụkụ mbụ, dịka ellipsis Grik si dị.
  issues:
