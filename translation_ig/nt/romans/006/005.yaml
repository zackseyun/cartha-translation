source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na anyị na ya ejikọọla n’oyiyi nke ọnwụ ya,[a] anyị ga-esokwa ya jikọọ n’oyiyi nke mbilite n’ọnwụ ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘anyị na ya etoola ọnụ n’oyiyi nke ọnwụ ya.’
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik: ‘anyị ga-abụkwa nke mbilite n’ọnwụ’; a na-aghọta ‘anyị na ya jikọrọ’ site n’ahịrị mbụ.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: anyị na ya ejikọtala
  rationale: Nke a na-egosi ịdị n’otu ma ọ bụ ikekọrịta ihe ọnụ na Kraịst, ma ọ naghị akọwapụta otú njikọ ahụ si arụ ọrụ. Ihe ọzọ a pụrụ ịsụ bụ ‘anyị na ya etoola ọnụ.’
- source_word: γεγόναμεν
  choice: ejikọtala
  rationale: Ụdị ngwaa perfect na-egosi ihe mere n’oge gara aga nke ọnọdụ ya ka dị ugbu a; ‘-tala’ na-ebupụta echiche ahụ n’Igbo n’ụzọ nkịtị.
- source_word: τῷ ὁμοιώματι
  choice: n’oyiyi
  rationale: ‘N’oyiyi’ na-echekwa okwu Pọl ji mee ka e nwee ọdịiche n’etiti ikere òkè na ihe ahụ n’onwe ya, na-akọwaghị dative ahụ karịa ka o kwesịrị.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: ọnwụ ya
  rationale: Nke a bụ ntụgharị genitive ahụ kpọmkwem ma doo anya.
- source_word: ἀλλὰ καὶ
  choice: anyị ga-esokwa
  rationale: ‘-sokwa’ na-egosi njikọ siri ike na mgbakwunye dị n’ahịrị nke abụọ, n’Igbo dị mfe ma dị nkwanye ùgwù.
- source_word: τῆς ἀναστάσεως
  choice: n’oyiyi mbilite n’ọnwụ ya
  rationale: E si n’ahịrị mbụ webata ‘n’oyiyi’ na ‘ya’ iji mee ka ellipsis Grik doo anya, ebe nhazi okwu abụọ ahụ na-egosi mbilite n’ọnwụ Kraịst.
- source_word: ἐσόμεθα
  choice: anyị ga-esokwa ya jikọọ
  rationale: Grik pụtara naanị ‘anyị ga-abụ,’ ma predicate σύμφυτοι sitere n’ahịrị mbụ ka a ghaghị ịghọta. Ikwughachi echiche njikọ ahụ na-eme ka Igbo zuo oke.
theological_decisions:
- issue: Ma a ga-akọwa njikọ a dị ka nke sakrament, nke ime mmụọ, ma ọ bụ naanị ihe atụ
  choice: E debere ‘anyị na ya ejikọtala n’oyiyi ọnwụ ya ... anyị ga-esokwa ya jikọọ n’oyiyi mbilite n’ọnwụ ya.’
  alternative: ‘anyị na ya etoola ọnụ’ ma ọ bụ ‘anyị esonyela n’usoro ọnwụ ya na mbilite n’ọnwụ ya’
  rationale: Okwu a na-egosi ikere òkè n’ezie n’ihe gbasara Kraịst, ma ọ ka jiri ‘oyiyi’ mee ka e nwee oke. Ntugharị a anaghị ekpebi otu njikọ ahụ si eme.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dịkwa nkwanye ùgwù. E ji ‘mbilite n’ọnwụ’ mee ihe dịka okwu Baịbụl a na-aghọta nke ọma. E tinyere akara ntụaka ụkwụ [a] na [b] n’ahịrịokwu ahụ.
