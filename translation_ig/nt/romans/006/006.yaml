id: ROM.6.6
reference: Romans 6:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: ig
  text: Ebe anyị maara na a kpọgidere mmadụ ochie anyị[a] na ya n’obe, ka ahụ nke mmehie wee ghara inwe ike[b], ka anyị ghara ịbụkwa ndị ohu nke mmehie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onwe anyị ochie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka e mebie ya” ma ọ bụ “ka e mee ka ọ ghara ịrụ ọrụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ka anyị ghara ijere mmehie ozi ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: Anyị maara nke a
  rationale: A sụgharịrị participle a n’ụzọ na-ejikọta amaokwu a na ihe e kwuru tupu ya, n’Igbo doro anya ma dịkwa mma.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: mmadụ ochie anyị
  rationale: Nke a na-edobe ihe atụ gbasara mmadụ dị n’asụsụ Grik, ma ọ pụtaghị naanị nwoke; ọ na-ekwu maka ụdị ndụ mmadụ anyị bụ na mbụ.
- source_word: συνεσταυρώθη
  choice: a kpọgidere ... na ya n’obe
  rationale: Okwu ‘na ya’ na-egosipụta συν-, ya bụ, na a kpọgidere mmadụ ochie anyị n’obe ya na Kraịst, n’agbanyeghị na aha Kraịst adịghị n’amaokwu Grik a.
- source_word: καταργηθῇ
  choice: mee ka ... ghara inwe ike
  rationale: Nhọrọ a na-egosi na a napụrụ ahụ nke mmehie ike ọ na-eji arụ ọrụ, n’ebughị ụzọ kpebie na e kpochapụrụ ya kpamkpam.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: ahụ nke mmehie
  rationale: A hapụrụ njikọ genitive ahụ ka ọ dị nkenke dịka n’asụsụ Grik, kama ịkọwa ya ozugbo dịka ‘ahụ mmehie na-achị’ ma ọ bụ ‘ahụ mmehie jupụtara.’
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: ka anyị gharakwa ịbụ ndị ohu mmehie
  rationale: Nke a na-edobe ihe atụ nke ịbụ ohu n’okpuru nna ukwu, nke δουλεύω na-egosi n’ebe a.
theological_decisions:
- issue: Ihe ὁ παλαιὸς ἡμῶν ἄνθρωπος pụtara
  choice: mmadụ ochie anyị
  alternative: ụdị mmadụ ochie anyị bụ
  rationale: Isi okwu ahụ na-edobe ihe atụ Pọl ji kọwaa ọnọdụ mmadụ mbụ, ebe ihe ọzọ a na-enye n’okpuru na-eme ka echiche ya doo anya n’Igbo.
- issue: Ike καταργηθῇ nwere n’ihe gbasara ahụ nke mmehie
  choice: ghara inwe ike
  alternative: ka e mebie ya ma ọ bụ mee ka ọ ghara ịdị ire
  rationale: Nke a na-egosi nkwụsị nke ike mmehie na-achị mmadụ, na-ekwughị hoo haa na ahụ ahụ adịghịzi ma ọlị.
- issue: δουλεύειν dị ka ịbụ ohu ma ọ bụ ije ozi
  choice: ịbụ ndị ohu mmehie
  alternative: ijere mmehie ozi
  rationale: Ihe atụ nke ịbụ ohu siri ike n’okwu Grik; a hapụrụ ‘ijere ozi’ dị ka ụzọ ọzọ n’okpuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A hapụrụ ‘mmadụ ochie anyị’ na ‘ahụ nke mmehie’ iji chekwaa ihe atụ na mgbagwoju echiche dị n’asụsụ Grik, ebe nkọwa ndị ọzọ dị n’okpuru.
