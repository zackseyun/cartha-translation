  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: ig
  text: N’ihi na ụgwọ ọrụ mmehie bụ ọnwụ, ma onyinye Chineke[a] bụ ndụ ebighị ebi n’ime Kraịst Jizọs Onyenwe anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ya, “onyinye e jiri amara nye.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịtụgharị akụkụ ikpeazụ a, “site na Kraịst Jizọs Onyenwe anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: ụgwọ ọrụ
  rationale: Ọ na-egosi ihe a kwụrụ mmadụ n’ihi ọrụ o mere; nke a na-echekwa ọdịiche Pọl mere n’etiti ihe mmadụ rụtara na onyinye e nyere ya.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: N’ahịrịokwu ‘ụgwọ ọrụ mmehie,’ ọ na-egosi ụgwọ nke mmehie na-akwụ ma na-echekwa mkpụmkpụ na ike okwu Grik ahụ.
- source_word: θάνατος
  choice: ọnwụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ nke na-echekwa ma ihe okwu ahụ pụtara nkịtị ma ibu echiche okpukpe ya, n’etinyeghị ụdị ọnwụ a na-ekwu n’ime ederede.
- source_word: χάρισμα
  choice: onyinye
  rationale: ‘Onyinye’ bụ okwu Igbo doro anya ma dị nfe; ọ na-echekwa ọdịiche dị n’etiti ụgwọ a rụtara na ihe Chineke nyere n’amara.
- source_word: ζωὴ αἰώνιος
  choice: ndụ ebighị ebi
  rationale: Nke a bụ ụzọ Igbo nkịtị na nke ziri ezi isi kwuo ndụ na-adịghị agwụ agwụ, ma na-echekwa ụda nkà mmụta okpukpe nke okwu ahụ.
- source_word: ἐν
  choice: n’ime
  rationale: A họọrọ ‘n’ime’ iji chekwaa echiche Pọl banyere ọnọdụ ma ọ bụ ịdị n’otu na Kraịst, kama ime ka ọ bụrụ naanị ụzọ e si nweta ihe ahụ.
- source_word: Χριστῷ
  choice: Kraịst
  rationale: ‘Kraịst’ bụ aha-ọrụ a maara nke ọma n’Igbo maka Χριστός, ya bụ Mezaịa ahụ, ma ọ dabara n’usoro okwu ‘Kraịst Jizọs.’
- source_word: κυρίῳ
  choice: Onyenwe
  rationale: ‘Onyenwe’ na-echekwa nkwupụta okwukwe na ịdị arọ nke κύριος n’ebe a.
theological_decisions:
- issue: Ike na nghọta nke ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Kraịst Jizọs
  alternative: site na Kraịst Jizọs
  rationale: Okwu Grik ahụ na-egosikarị ọnọdụ ma ọ bụ ịdị n’otu na Kraịst, ọ bụghị naanị na Kraịst bụ onye e ji mee ka ihe ahụ bịa. ‘N’ime’ na-ahapụ nghọta ahụ ka ọ dị, ebe nkọwa ala peeji na-egosi ụzọ ọzọ a pụrụ isi ghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta, dee ya. ‘Ụgwọ ọrụ’ na ‘onyinye’ na-eme ka ọdịiche dị n’etiti ihe a rụtara na ihe e nyere pụta ìhè. A hapụrụ ‘n’ime Kraịst Jizọs’ ka ọ chekwaa esemokwu na omimi nke okwu Pọl n’enweghị ịkọwa ya karịa ihe isi mmalite kwuru.
