- from: N’ihi na ụgwọ ọrụ mmehie bụ ọnwụ, ma onyinye Chineke[a] bụ ndụ ebighị ebi n’ime Kraịst Jizọs Onyenwe anyị.[b]
  to: N’ihi na ụgwọ ọrụ mmehie bụ ọnwụ, ma onyinye Chineke[a] bụ ndụ ebighị ebi n’ime Kraịst Jizọs Onyenwe anyị.[b]
  rationale: The verse itself needs no change. The revision makes both footnotes idiomatic Standard Igbo and ensures that the alternative for χάρισμα conveys ‘gracious gift’ without introducing an ambiguous genitive relation. The alternative for ἐν remains explicitly secondary, so the main text continues to preserve the source’s broader sphere/union sense.
