source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: ig
  text: Ma ugbu a, ebe a tọhapụrụ unu n'aka mmehie, ma e meela unu ndị ohu Chineke, unu nwere mkpụrụ unu nke na-eduga n'ido nsọ[a], ma njedebe bụ ndụ ebighị ebi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke na-eduga n'ịdị nsọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ihe ikpeazụ ọ na-arụpụta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Ma ugbu a
  rationale: Na-egosipụta mgbanwe na nnukwu ọdịiche dị n'etiti ọnọdụ mbụ ha na ọnọdụ ha nọ na ya ugbu a.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: ebe a tọhapụrụ unu n'aka mmehie
  rationale: Na-edobe olu nnara nke participle ahụ ma gosipụta na a napụtala ha n'okpuru ike mmehie, n'ebughị ụzọ kọwaa mmehie naanị dịka omume dị iche iche.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: e meekwa unu ndị ohu Chineke
  rationale: Na-edobe olu nnara na ihe atụ siri ike nke ịbụ ohu, bụ́ isi n'ọdịiche Pọl na-egosi n'isi nke a.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: unu nwere mkpụrụ nke unu na-amị
  rationale: Na-edobe ihe atụ nke mkpụrụ ma mee ka okwu ahụ doo anya ma bụrụ ihe a na-asụ n'Igbo ugbu a.
- source_word: εἰς ἁγιασμόν
  choice: nke na-eduga n'ịdị nsọ
  rationale: ‘Na-eduga’ na-egosipụta ntụziaka ma ọ bụ ihe si na ya pụta nke εἰς; ‘ịdị nsọ’ bụ okwu Igbo doro anya maka ἁγιασμός n'ebe a.
- source_word: τὸ δὲ τέλος
  choice: njedebe ya bụkwa
  rationale: Na-edobe okwu njedebe nke τέλος, ma nnọchiaha ‘ya’ na-eme ka njikọ ya na mkpụrụ ahụ doo anya n'Igbo.
- source_word: ζωὴν αἰώνιον
  choice: ndụ ebighị ebi
  rationale: Nke a bụ nsụgharị Igbo a maara nke ọma, nke na-eburu ihe okwu Grik ahụ pụtara n'ụzọ zuru oke.
theological_decisions:
- issue: Ihe atụ nke ịbụ ohu Chineke
  choice: e meekwa unu ndị ohu Chineke
  alternative: unu bụrụ ndị na-ejere Chineke ozi
  rationale: A hapụrụ ihe atụ siri ike nke ịbụ ohu n'ihi na Pọl ji ya tụnyere ịbụ ohu mmehie; ime ka ọ bụrụ naanị ‘ije ozi’ ga-eme ka ike okwu ahụ belata.
- issue: Ihe ἁγιασμός pụtara
  choice: ịdị nsọ
  alternative: ido nsọ
  rationale: ‘Ịdị nsọ’ na-egosi ọnọdụ ma ọ bụ àgwà nsọ nke mkpụrụ ahụ na-eduga na ya; ‘ido nsọ’ nwekwara ike igosi usoro ma ọ bụ omume nke ime ka ihe bụrụ nsọ, ya mere e debere ya n'okpuru peeji.
- issue: Ihe τέλος pụtara
  choice: njedebe
  alternative: ihe ikpeazụ ọ na-arụpụta
  rationale: ‘Njedebe’ nọ okwu Grik ahụ nso ma na-ahapụ ohere ma ọ na-ezo aka na ngwụcha ma ọ bụ nsonaazụ ikpeazụ; nkọwa ọzọ na-eme ka echiche nsonaazụ pụta ìhè.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ihe atụ nke mkpụrụ na nke ịbụ ohu, ebe e mere nhazi ahịrịokwu ahụ ka ọ daa nke ọma n'Igbo.
