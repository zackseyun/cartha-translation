revisions:
- from: Ma ugbu a, ebe a tọhapụrụ unu n'aka mmehie, e meekwa unu ndị ohu Chineke, unu nwere mkpụrụ nke unu na-amị, nke na-eduga n'ịdị nsọ[a]; njedebe ya[b] bụkwa ndụ ebighị ebi.
  to: Ma ugbu a, ebe a tọhapụrụ unu n'aka mmehie, ma e meela unu ndị ohu Chineke, unu nwere mkpụrụ unu nke na-eduga n'ido nsọ[a], ma njedebe bụ ndụ ebighị ebi.[b]
  rationale: The revision removes an unwarranted possessive from “the end,” strengthens the parallel passive construction, and repairs the sanctification footnote so that it offers a genuine lexical alternative while preserving the Greek metaphors and the result-oriented force of εἰς.
  reviewer_model: gpt-5.6-terra
