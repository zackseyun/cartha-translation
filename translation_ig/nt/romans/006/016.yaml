id: ROM.6.16
reference: Romans 6:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: ig
  text: 'Ọ̀ bụ na unu amaghị na ọ bụrụ na unu enyefe onwe unu n’aka onye dịka ndị ohu iji rubere ya isi, unu bụ ndị ohu nke onye unu na-erubere isi—ma ọ bụ ndị ohu mmehie, nke na-eduga n’ọnwụ, ma ọ bụ ndị ohu nrubeisi, nke na-eduga n’ezi omume[a]?


    [a] Ma ọ bụ, ikpe ziri ezi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ikpe ziri ezi.
    reason: Ọ bụ ntụgharị ọzọ nke δικαιοσύνη nke kwesịkwara ekwesị n’usoro okwu a.
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: unu nyefere onwe unu n’aka
  rationale: Nke a na-egosi mmadụ itinye onwe ya n’okpuru ikike onye ọzọ ma dịrị ya njikere, dịka ihe oyiyi ịgba ohu dị n’amaokwu ahụ si chọọ. Ọ bụkwa okwu Igbo dị mfe ma kwekọọ n’echiche nke ‘inye ma ọ bụ wepụta onwe unu.’
- source_word: δούλους / δοῦλοί
  choice: ndị ohu
  rationale: ‘Ndị ohu’ na-echekwa echiche nke ịbụ n’okpuru nwe na ikike onye ọzọ, nke bụ isi ihe n’ihe atụ Pọl ji ebe a.
- source_word: εἰς ὑπακοήν
  choice: ka unu na-erubere ya isi
  rationale: Nkebiokwu a na-egosi ebumnuche nke inyefe onwe ha ma mee ka Igbo bụrụ nke sitere n’ọnụ mmadụ pụta nke ọma.
- source_word: ᾧ ὑπακούετε
  choice: onye ahụ unu na-erubere isi
  rationale: Nke a na-echekwa ihe oyiyi nke nna ukwu a na-erubere isi n’etinyeghị aha ọzọ na-adịghị n’asụsụ Grik.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: A hapụrụ okwu ahụ dịka ‘mmehie,’ ebe ihe oyiyi ndị ohu gbara ya gburugburu na-egosi na Pọl na-ekwu maka mmehie dịka ike na-achị mmadụ.
- source_word: εἰς θάνατον
  choice: nke na-eduga n’ọnwụ
  rationale: Nke a na-egosi ụzọ na nsonaazụ nke εἰς n’Igbo doro anya.
- source_word: ὑπακοῆς
  choice: nrubeisi
  rationale: Iji aha nkịtị a na-echekwa nhazi na ọdịiche dị n’etiti ‘mmehie’ na ‘nrubeisi.’
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: ‘Ezi omume’ na-enye echiche omume na nke okpukpe nke δικαιοσύνη n’ebe a; a debere ‘ikpe ziri ezi’ n’okpuru peeji dịka ntụgharị ọzọ kwere omume.
theological_decisions:
- issue: Otú e si tụgharịa δικαιοσύνη n’ọdịiche Pọl mere
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: N’ebe a, Pọl na-atụ mmehie nke na-eduga n’ọnwụ megide nrubeisi nke na-eduga na δικαιοσύνη. ‘Ezi omume’ na-echekwa echiche sara mbara nke ọnọdụ na omume ziri ezi, ebe ‘ikpe ziri ezi’ ka bụ ụzọ ọzọ okwu ahụ pụrụ isi pụta, ya mere e tinyere ya n’okpuru peeji.
translation_notes:
  register: 'E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara ajụjụ nkwugharị nke amaokwu ahụ, ihe oyiyi nke ịgba ohu, na nhazi abụọ ahụ: mmehie gaa n’ọnwụ, nrubeisi gaa n’ezi omume.'
