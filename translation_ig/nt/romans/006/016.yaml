revisions:
- from: 'Ọ̀ bụ na unu amaghị na mgbe unu nyefere onwe unu n’aka onye ọ bụla dị ka ndị ohu ka unu na-erubere ya isi, unu bụ ndị ohu nke onye ahụ unu na-erubere isi—ma ọ bụ nke mmehie, nke na-eduga n’ọnwụ, ma ọ bụ nke nrubeisi, nke na-eduga n’ezi omume[a]?


