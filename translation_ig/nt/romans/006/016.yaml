  to: 'Ọ̀ bụ na unu amaghị na ọ bụrụ na unu enyefe onwe unu n’aka onye dịka ndị ohu iji rubere ya isi, unu bụ ndị ohu nke onye unu na-erubere isi—ma ọ bụ ndị ohu mmehie, nke na-eduga n’ọnwụ, ma ọ bụ ndị ohu nrubeisi, nke na-eduga n’ezi omume[a]?


