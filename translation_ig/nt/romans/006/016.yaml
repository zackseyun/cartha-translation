review_pass:
  verdict: revise
  source_fidelity: The draft preserves the central slave/master metaphor, the alternatives of sin and obedience, and the outcomes death and righteousness. However, “mgbe” (“when”) and “onye ọ bụla” (“any person”) introduce temporal/indefinite elements not expressed in Greek, while the first clause does not clearly retain the purpose “for obedience.” The repeated “nke” in the final alternatives also leaves the implicit “slaves” relationship less clear in Igbo.
  naturalness: The wording is generally understandable Standard Igbo, but “dị ka ndị ohu ka unu na-erubere ya isi” is syntactically heavy, and “ma ọ bụ nke mmehie ... ma ọ bụ nke nrubeisi” is ambiguous because “nke” can be heard as referring to a thing rather than to the slave relationship. A direct, parallel formulation is clearer and more natural.
  terminology: “Ndị ohu,” “mmehie,” “nrubeisi,” “ọnwụ,” and “ezi omume” are suitable. “Ezi omume” appropriately conveys δικαιοσύνη in this Pauline context; “ikpe ziri ezi” remains a viable lexical alternative in the footnote.
  issues:
  - severity: medium
    issue: The opening uses “mgbe” and “onye ọ bụla.”
    rationale: The Greek is not explicitly temporal (“when”) or indefinite (“anyone”). It says that the persons to whom the readers present themselves as slaves for obedience are those whose slaves they are. Removing these additions more closely follows the source.
  - severity: medium
    issue: The purpose phrase εἰς ὑπακοήν is not clearly represented.
    rationale: “Ka unu na-erubere ya isi” is attached awkwardly to “dị ka ndị ohu.” “iji rubere ya isi” clearly expresses presentation as slaves for the purpose of obedience.
  - severity: medium
    issue: The two alternatives use “nke mmehie” and “nke nrubeisi.”
    rationale: The Greek ellipsis depends on “slaves”; supplying “ndị ohu” in both alternatives creates clear Igbo parallelism and keeps sin and obedience in the master/slavery metaphor.
  revised_text: 'Ọ̀ bụ na unu amaghị na ọ bụrụ na unu enyefe onwe unu n’aka onye dịka ndị ohu iji rubere ya isi, unu bụ ndị ohu nke onye unu na-erubere isi—ma ọ bụ ndị ohu mmehie, nke na-eduga n’ọnwụ, ma ọ bụ ndị ohu nrubeisi, nke na-eduga n’ezi omume[a]?


    [a] Ma ọ bụ, ikpe ziri ezi.'
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, ikpe ziri ezi.
    reason: Ọ bụ ntụgharị ọzọ nke δικαιοσύνη nke kwesịkwara ekwesị n’usoro okwu a.
  revision_rationale: The revision removes unsupported temporal and indefinite nuances, makes the purpose of obedience explicit, and supplies “ndị ohu” in the paired alternatives so that the Greek slave/master contrast is clear in idiomatic Standard Igbo. The footnote is retained because “ikpe ziri ezi” remains a legitimate lexical alternative for δικαιοσύνη.
