base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: ig
  text: Gịnịzi? Ànyị ga-emehie n’ihi na anyị anọghị n’okpuru iwu, kama anyị nọ n’okpuru amara?[a] Mba, ọ gaghị adị![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Ànyị kwesịrị ime mmehie?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Mba, ma ọlị!”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Gịnịkwa?
  rationale: Nke a bụ ajụjụ dị nkenke nke na-ejikọta okwu a na arụmụka bu ya ụzọ, n’agbakwụnyeghị okwu ndị na-adịghị na Grik.
- source_word: ἁμαρτήσωμεν
  choice: Ànyị ga na-eme mmehie
  rationale: Ụdị subjunctive onye mbụ plural ebe a bụ ajụjụ ntụgharị uche. Igbo a na-egosi aro a Pọl jụrụ n'ụzọ doro anya; ‘na-eme mmehie’ na-ekwupụtakwa ime mmehie n’asụsụ Igbo nkịtị, n’agbanyeghị na aorist Grik n’onwe ya anaghị akọwapụta na ọ bụ omume na-aga n’ihu.
- source_word: ὅτι
  choice: n’ihi na
  rationale: 'Ọ na-egosi ihe e ji kwado aro ahụ: ime mmehie n’ihi na ndị kwere ekwe anọghị n’okpuru iwu kama n’okpuru amara.'
- source_word: ὑπὸ νόμον
  choice: n’okpuru iwu
  rationale: A hapụrụ ‘iwu’ ka ọ bụrụ okwu sara mbara, n’akọwaghị ya kpọmkwem dị ka Iwu Mosis, ka a ghara idozi ihe Grik hapụrụ ka nkọwa ya dabere n’ọnọdụ okwu.
- source_word: ὑπὸ χάριν
  choice: n’okpuru amara
  rationale: ‘Amara’ bụ okwu Igbo a nabatara nke ọma maka χάρις n’ebe a, ma na-echekwa ọdịiche Pọl mere n’etiti iwu na amara.
- source_word: μὴ γένοιτο
  choice: Ọ dịghị ma ọlị!
  rationale: Nke a na-enye ọjụjụ siri ike nke akpaalaokwu Grik ahụ n’Igbo doro anya ma dị ùgwù.
theological_decisions:
- issue: Oke νόμος pụtara n’ọdịiche Pọl mere
  choice: A sụgharịrị ya n’ụzọ sara mbara dịka ‘iwu.’
  alternative: ‘Iwu ahụ’ ma ọ bụ ‘Iwu Mosis.’
  rationale: N’ebe a Grik enweghị article, ya mere e zere ịkọwapụta ya dịka Iwu Mosis n’amaokwu ahụ. Nke a na-echekwa esemokwu nkà mmụta okpukpe ma hapụ ọnọdụ okwu ka o nyere aka kọwaa oke ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe nghọta ma dị ùgwù. E debere usoro ajụjụ na ọjụjụ siri ike nke Pọl, ma zere ịgbakwụnye nkọwa ụka pụrụ iche. Akara ụda dị na ‘Ànyị’ na-enyere aka igosi na ọ bụ ajụjụ.
