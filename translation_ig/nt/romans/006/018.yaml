id: ROM.6.18
reference: Romans 6:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: ig
  text: Ma ebe a tọhapụrụ unu n’aka mmehie, e mere unu ndị ohu nke ezi omume.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: ebe a tọhapụrụ unu
  rationale: Na-egosipụta aorist passive participle dị ka ihe e mere ndị a na-agwa okwu, ma na-asụ Igbo n'ụzọ eke.
- source_word: δὲ
  choice: Ma
  rationale: Na-egosipụta njikọ dị nro nke na-aga n’ihu n’arụmụka Pọl; “Ma” dabara n’iche dị n’etiti ọchịchị mmehie na ịbụ ndị ohu ezi omume.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: Na-echekwa ma echiche mmehie n’onwe ya ma otú e si kọwaa ya dịka ike na-achị mmadụ n’ebe a.
- source_word: ἐδουλώθητε
  choice: e mere unu ndị ohu
  rationale: Na-echekwa olu passive na ihe atụ siri ike nke ịbụ ohu, kama ime ka ọ dị nro dịka naanị ije ozi.
- source_word: δικαιοσύνῃ
  choice: ezi omume
  rationale: Ọ bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị akọwa δικαιοσύνη n’echiche ịdị ziri ezi; ihe ọzọ okwu ahụ nwere ike ịpụta ka edobere n’okpuru amaokwu.
theological_decisions:
- issue: Ịsụgharị ihe atụ δουλόω banyere ịbụ ohu
  choice: e mere unu ndị ohu nke ezi omume
  alternative: unu ghọrọ ndị na-ejere ezi omume ozi
  rationale: Nhọrọ a anaghị eme ka ihe atụ Pọl banyere mgbanwe nna ukwu dị nro, ma ọ naghịkwa etinye nkọwa ụka pụrụ iche na ya.
- issue: Uche δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: “Ezi omume” na-echekwa isi echiche banyere ịdị ziri ezi, ebe ihe ọzọ bụ “ikpe ziri ezi” na-egosi akụkụ nke ikpe ziri ezi nke okwu Grik ahụ nwekwara ike ibu.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro passive na ihe atụ siri ike nke ịgbanwe site n’okpuru mmehie gaa n’ịbụ ndị ohu ezi omume.
