  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: ig
  text: Gịnịzi ka anyị ga-ekwu? Ànyị ga-anọgide na mmehie ka amara wee bawanye?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ànyị ga-anọgidesi ike na mmehie ...?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ka amara wee baa ụba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Gịnịzi
  rationale: Ọ na-echekwa njikọ nkwubi okwu nke οὖν na ụda ajụjụ Pọl, ma bụrụkwa okwu Igbo e ji ekwu ihe n'ụzọ ebumpụta ụwa.
- source_word: ἐροῦμεν
  choice: ka anyị ga-ekwu
  rationale: Ọ na-egosipụta ajụjụ ntụgharị uche banyere ihe a ga-ekwu, dịka future deliberative nke Grik si dị.
- source_word: ἐπιμένωμεν
  choice: Ànyị kwesịrị ịnọgide
  rationale: Ọ na-egosipụta omume na-aga n'ihu nke present subjunctive, tinyere ọdịdị ajụjụ banyere ihe kwesịrị ime, n'enweghị ịtụgharị ya ka ọ bụrụ amụma nkịtị.
- source_word: τῇ ἁμαρτίᾳ
  choice: ná mmehie
  rationale: Ọ na-echekwa echiche nke ịnọgide n'ọnọdụ ma ọ bụ n'omume mmehie; ọ bụkwa ụzọ dị nkenke ma doo anya n'Igbo.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a na-egosipụta ebumnuche ma ọ bụ ihe a tụrụ anya na ọ ga-esi na ya pụta, na-ahapụghị esemokwu dị n'ajụjụ Pọl.
- source_word: ἡ χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a nabatara nke ọma maka χάρις ebe a, ya bụ ihu ọma Chineke nke a na-enye n'efu.
- source_word: πλεονάσῃ
  choice: bawanye
  rationale: Ọ na-egosipụta mmụba n'ogo ma ọ bụ n'ókè n'asụsụ Igbo nke oge a; “baa ụba” ka e debere dị ka ụzọ ọzọ.
theological_decisions:
- issue: Ma a ga-akọwa ajụjụ Pọl dịka ikike, iwu, ma ọ bụ amụma nkịtị
  choice: 'Ajụjụ ntụgharị uche banyere omume: “Ànyị kwesịrị ịnọgide ná mmehie”'
  alternative: “Ànyị ga-anọgide ná mmehie?”
  rationale: Subjunctive Grik na-ajụ banyere omume a na-atụ aro. “Kwesịrị” na-eme ka akụkụ omume nke ajụjụ ahụ doo anya, ma ọ naghị enye azịza tupu Pọl azaa ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ ajụjụ ahụ n'ụdị arụmụka Pọl, ma e webataghị nkọwa ụka ọ bụla pụrụ iche.
