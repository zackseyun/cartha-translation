  to: Gịnịzi ka anyị ga-ekwu? Ànyị ga-anọgide na mmehie ka amara wee bawanye?[a][b]
  rationale: The revision preserves the Greek deliberative ambiguity and rhetorical force without introducing an explicit obligation modal. It also supplies a closer Igbo lexical alternative for continued persistence in sin.
