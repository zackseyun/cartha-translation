id: ROM.6.8
reference: Romans 6:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: ig
  text: Ma ọ bụrụ na anyị na Mesaịa[a] nwụkọrọ, anyị kwenyere na anyị ga-adịkwa ndụ na ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ “Kraịst”: n’asụsụ Grik, “Χριστῷ” (Christō).'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ọ bụrụ na
  rationale: “Ọ bụrụ na” na-egosi ọnọdụ e kwuru n’ahịrịokwu a n’Igbo dị mfe ma doo anya. A hapụrụ δέ ka usoro okwu gbara amaokwu ahụ gburugburu gosi njikọ ma ọ bụ ntughari ya, kama ịgbakwunye okwu ga-eme ka ọdịiche ya sie ike karịa Grik.
- source_word: ἀπεθάνομεν
  choice: anyị ... nwụrụ
  rationale: Oge aorist indicative na-ezo aka n’ọnwụ ha na Mesaịa nke Pọl kwurula dịka ihe mere eme; “nwụrụ” bụ ụzọ Igbo kwesịrị ekwesị isi kwuo ya.
- source_word: σὺν Χριστῷ
  choice: anyị na Mesaịa
  rationale: σύν na-egosi iso onye ọzọ nwee ahụmahụ ma ọ bụ njikọ; usoro Igbo “anyị na Mesaịa nwụrụ” na-egosipụta ọnwụ ha na ya. A sụgharịrị Χριστός dịka aha ọkwá “Mesaịa,” ọ bụghị naanị dịka aha mmadụ.
- source_word: πιστεύομεν
  choice: anyị kwenyere
  rationale: “Anyị kwenyere” bụ okwu Igbo nkịtị na nke doro anya maka nkwenye nke πιστεύομεν na-egosi ebe a.
- source_word: ὅτι
  choice: na
  rationale: “Na” na-ewebata ihe ha kwenyere, dịka ὅτι si arụ ọrụ n’ahịrịokwu Grik.
- source_word: καὶ
  choice: kwa
  rationale: 'E tinyere “kwa” n’ime “ga-adịkwa” iji gosi njikọ kwekọrọ ekwekọ: dịka ha na ya nwụrụ, ha na ya ga-adịkwa ndụ.'
- source_word: συζήσομεν αὐτῷ
  choice: anyị na ya ga-adịkwa ndụ
  rationale: Nkebi a na-egosi ndụ ha na ya ga-enwe n’ọdịnihu. Usoro a bụ Igbo e ji asụ okwu nke ọma, ma ọ naghị akọwa kpọmkwem otú ndụ ahụ ga-adị karịa ihe Grik kwuru.
theological_decisions:
- issue: Nsụgharị Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός bụ aha ọkwá nke pụtara onye e tere mmanụ; “Mesaịa” na-eme ka ọrụ ya dịka aha ọkwá pụta ìhè. E debere “Kraịst” n’ala peeji dịka nsụgharị ọzọ ndị na-agụ Akwụkwọ Nsọ maara nke ọma.
- issue: Ụdị ndụ ọdịnihu dị na συζήσομεν αὐτῷ
  choice: anyị na ya ga-adịkwa ndụ
  alternative: anyị na ya ga-ebikwa ndụ mgbe anyị bilitere n’ọnwụ
  rationale: Nhọrọ a na-echekwa obosara nke okwu Pọl banyere iso Mesaịa dị ndụ n’ọdịnihu, n’etinyeghị nkọwa gbasara oge ma ọ bụ usoro ndụ ahụ nke okwu Grik n’onwe ya ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. Usoro “anyị na Mesaịa nwụrụ” na “anyị na ya ga-adịkwa ndụ” na-eme ka myirịta dị n’etiti iso ya nwụọ na iso ya dị ndụ pụta ìhè.
