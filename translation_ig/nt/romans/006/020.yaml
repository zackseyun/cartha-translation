  to: N’ihi na mgbe unu bụ ndị ohu nke mmehie, unu nwere onwe unu n’ihe gbasara ezi omume[a][b].
  rationale: Only the verb form has been revised for idiomatic Standard Igbo and to reflect the Greek imperfect’s description of a former state. The source ambiguity concerning the dative relation to righteousness and the supplied lexical alternatives are retained.
