  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: ig
  text: N’ihi na mgbe unu bụ ndị ohu nke mmehie, unu nwere onwe unu n’ihe gbasara ezi omume[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe metụtara ezi omume.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ezi omume” ebe a dị ka “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: ndị ohu
  rationale: Okwu a na-egosi ịbụ ndị nọ n’okpuru ọchịchị mmehie, ma na-edobe ihe Pọl ji atụnyere ịbụ ohu nke mmehie na ịbụ ohu nke ezi omume n’isiakwụkwọ a.
- source_word: ἁμαρτίας
  choice: nke mmehie
  rationale: Ụdị njikọ a na-egosi na mmehie bụ nna ukwu ma ọ bụ ike nke ha nọ n’okpuru ya.
- source_word: ἐλεύθεροι
  choice: nweere onwe unu
  rationale: Nke a na-edobe okwu ntụnyere siri ike Pọl ji kwuo na mgbe ha bụ ndị ohu mmehie, ezi omume achịghị ha.
- source_word: τῇ δικαιοσύνῃ
  choice: n’ihe gbasara ezi omume
  rationale: A ghọtara dative ahụ dị ka nke na-egosi ihe okwu ahụ metụtara; nsụgharị a anaghị eme ka ezi omume yie onye mmegbu.
- source_word: δικαιοσύνῃ
  choice: ezi omume
  rationale: Nke a bụ okwu Igbo a na-ejikarị akọwa δικαιοσύνη n’echiche Pọl, ma na-agụnye ibi ndụ n’ụzọ ziri ezi n’ihu Chineke.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-edobe njikọ nkọwa amaokwu a nwere na arụmụka gbara ya gburugburu.
theological_decisions:
- issue: Otu e si gosipụta njikọ ha na ezi omume mgbe ha bụ ndị ohu mmehie
  choice: unu nweere onwe unu n’ihe gbasara ezi omume
  alternative: unu nwere onwe unu pụọ n’ezi omume
  rationale: Nhọrọ bụ isi na-edobe mgbagwoju anya na esemokwu dị n’okwu Grik, n’emeghị ka ezi omume yie ike ọjọọ a ga-agbanahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ndị ohu” na-edobe ike ihe atụ Pọl; “n’ihe gbasara” na-enye dative nke ntụaka n’ụzọ ebumpụta ụwa. E tinyere akara ukwu ala [a] na [b] n’ederede bụ isi.
