review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the Greek contrast: the readers’ former enslavement to sin (δοῦλοι τῆς ἁμαρτίας) and their being ‘free’ with reference to righteousness (ἐλεύθεροι τῇ δικαιοσύνῃ). ‘N’ihe gbasara ezi omume’ appropriately preserves the dative of reference without unnecessarily choosing the more forceful ‘free from righteousness.’'
  naturalness: ‘Unu nweere onwe unu’ is not the best idiomatic past expression here and can suggest having gained freedom. ‘Unu nwere onwe unu’ is the natural Standard Igbo expression for the continuing past state meant by ἦτε.
  terminology: ‘Ndị ohu’ rightly retains the slave/enslavement imagery central to Romans 6. ‘Mmehie’ and ‘ezi omume’ are appropriate established terms for sin and righteousness. The alternative ‘ikpe ziri ezi’ adequately gives ‘justice’ as a lexical alternative, without displacing the Pauline main-text term.
  issues:
  - severity: medium
    issue: Aspect and idiom in ‘unu nweere onwe unu’
    rationale: The Greek imperfect ἦτε describes their former condition. In this context, Standard Igbo ‘unu nwere onwe unu’ expresses ‘you were free,’ whereas ‘nweere’ can imply an achieved or completed becoming-free sense.
  revised_text: N’ihi na mgbe unu bụ ndị ohu nke mmehie, unu nwere onwe unu n’ihe gbasara ezi omume[a][b].
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe metụtara ezi omume.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “ezi omume” ebe a dị ka “ikpe ziri ezi.”
    reason: lexical_alternative
  revision_rationale: Only the verb form has been revised for idiomatic Standard Igbo and to reflect the Greek imperfect’s description of a former state. The source ambiguity concerning the dative relation to righteousness and the supplied lexical alternatives are retained.
