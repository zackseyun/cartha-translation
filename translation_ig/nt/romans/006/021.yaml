  source_fidelity: 'A chọrọ mmezi: εἴχετε bụ oge gara aga (“unu nwere/mịrị”), ebe “unu na-amị” na-egosi omume na-aga n’ihu ugbu a. Nsụgharị a gbanwere na-echekwa ajụjụ nkwuwa okwu ahụ, ihe atụ “mkpụrụ,” na njikọ “site n’ihe ndị ahụ” dịka audit Bekee si ghọta ἐφ’ οἷς.'
  naturalness: “Olee mkpụrụ unu mịrị n’oge ahụ” bụ Igbo Izugbe dị mma ma bụrụ nke kwekọrọ n’oge gara aga. “Ihe ndị ahụ ihere na-eme unu ugbu a” na-ekwupụta nke ọma ihe ha na-eme ihere banyere ya ugbu a.
  terminology: A chekwala “mkpụrụ,” “njedebe,” na “ọnwụ.” “Njedebe” anaghị ekpebi ma τέλος bụ naanị nsonaazụ ma ọ bụ ebe ihe na-eru; akara ala peeji na-enye nhọrọ okwu ọzọ.
