  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: ig
  text: Ya mere, olee mkpụrụ unu mịrị n’oge ahụ site n’ihe ndị ahụ ihere na-eme unu ugbu a? N’ihi na njedebe ha bụ ọnwụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “njedebe” dị ka “ihe ọ rụpụtara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: olee
  rationale: Ọ na-ebute ajụjụ nkwuwa okwu banyere ụdị uru ma ọ bụ ihe omume ndụ ochie ha rụpụtara.
- source_word: καρπὸν
  choice: mkpụrụ
  rationale: Ọ na-echekwa ihe atụ Pọl ji kọwaa ihe omume ma ọ bụ ụzọ ndụ na-amịpụta.
- source_word: εἴχετε
  choice: unu na-amị
  rationale: N’Igbo, ijikọ ya na ‘mkpụrụ’ dị ka ‘ịmị mkpụrụ’ na-eme ka ihe atụ ahụ bụrụ nke e ji asụsụ nkịtị aghọta; okwu banyere oge ahụ na-egosi ọnọdụ ha gara aga.
- source_word: τότε
  choice: n’oge ahụ
  rationale: Ọ na-eme ka ọdịiche dị n’etiti ndụ ha mgbe ahụ na ọnọdụ ha ugbu a doo anya.
- source_word: ἐφ’ οἷς
  choice: site n’ihe ndị
  rationale: Ọ na-egosi na mkpụrụ ahụ sitere n’omume ndị a kpọtụrụ aha, ma na-enye ihe nnọchiaha ahụ ebe ntụaka doro anya n’Igbo.
- source_word: νῦν
  choice: ugbu a
  rationale: Ọ na-echekwa ọdịiche oge dị nkọ megide ‘n’oge ahụ.’
- source_word: ἐπαισχύνεσθε
  choice: ihere ha na-eme unu
  rationale: Nke a bụ ụzọ Igbo dị ndụ ma dị arọ isi kwuo na mmadụ na-eme ihere n’ihi omume ndị ahụ; ọ bụghị naanị obere mmechuihu.
- source_word: τέλος
  choice: njedebe
  rationale: Ọ na-echekwa ma echiche nke ebe ihe na-akwụsị ma nke ihe ọ na-emecha rụpụta, n’emeghị ka otu echiche kpochapụ nke ọzọ.
- source_word: ἐκείνων
  choice: ihe ndị ahụ
  rationale: Ọ na-ezo aka n’ụzọ doro anya n’omume ndị ahụ ha na-eme ihere ugbu a.
- source_word: θάνατος
  choice: ọnwụ
  rationale: Nke a bụ nsụgharị kpọmkwem, nke a na-ejikarị eme ihe, ma na-echekwa ịdị arọ nke ịdọ aka ná ntị Pọl.
theological_decisions:
- issue: Ma a ga-asụgharị τέλος dị ka ‘njedebe’ ka ọ bụ kọwaa ya naanị dị ka ‘ihe ọ rụpụtara’
  choice: njedebe
  alternative: ihe ọ rụpụtara
  rationale: ‘Njedebe’ na-echekwa mgbagwoju pụtara nke okwu Grik ahụ—ma ebe ụzọ ndụ ahụ na-eduga ma ihe ọ na-emecha pụta—ebe nkọwa ọzọ nwere ike ime ka ọ bụrụ naanị nsonaazụ.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ ‘mkpụrụ,’ ọdịiche ‘n’oge ahụ/ugbu a,’ na mgbagwoju pụtara nke τέλος. Akara nkọwa ala peeji [a] dị n’ederede isi.
