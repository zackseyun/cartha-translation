  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: ig
  text: N’otu aka ahụ kwa, unu, gụọnụ onwe unu dịka ndị nwụrụ anwụ nye mmehie, ma dịka ndị dị ndụ nye Chineke n’ime Mesaya Jizọs.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “were onwe unu dịka,” ma ọ bụ “gụta onwe unu dịka.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ndị na-adị ndụ nye Chineke.”
    reason: lexical_alternative
  - marker: c
    text: 'N’asụsụ Grik: “n’ime Kraịst Jizọs”; “Mesaya” na-asụgharị aha ọkwa ahụ, Χριστός.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Ya mere, ... kwa
  rationale: Na-egosi njikọ nkwubi okwu a na ihe Pọl kwuru tupu ya, ma na-ada ka Igbo nkịtị.
- source_word: λογίζεσθε
  choice: gụọnụ ... dị ka
  rationale: Na-echekwa echiche nke ịgụ ma ọ bụ ile ihe anya dị ka eziokwu, kama ịbụ nanị iche echiche banyere ya.
- source_word: ἑαυτοὺς
  choice: unu onwe unu
  rationale: E debere nnọchiaha ntụgharị ahụ n'ụzọ doro anya dịka ọ dị na Grik.
- source_word: εἶναι
  choice: dị ka ndị
  rationale: Ihe owuwu a na-egosipụta infinitive ‘ịbụ’ n’ụzọ Igbo kwesịrị ekwesị mgbe ọ na-eso ‘gụọnụ onwe unu.’
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: ndị nwụrụ anwụ n’ebe mmehie dị
  rationale: Na-egosipụta mmekọrịta dative ahụ n’ụzọ Igbo doro anya ma na-edobe ntụnyere ya na ịdị ndụ.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: dị ndụ n’ebe Chineke nọ
  rationale: ‘Dị ndụ’ kwekọrọ n’ụzọ antithesis na ‘ndị nwụrụ anwụ’; ‘n’ebe Chineke nọ’ na-egosi mmekọrịta dative n’enweghị ịkọwa ya karịa isi mmalite.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaya Jizọs
  rationale: E debere ἐν dịka ‘n’ime’ iji chekwaa asụsụ Pọl gbasara ịdị n’ime Mesaya; Χριστός ka a sụgharịrị dịka aha ọkwa ‘Mesaya.’
theological_decisions:
- issue: Ịsụgharị Χριστῷ dịka aha ọkwa ma ọ bụ dịka aha nkịtị
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka nwere ike aha ọkwa ya; ‘Mesaya’ na-eme ka nke ahụ pụta ìhè n’enweghị itinye nkọwa otu ụka.
- issue: Ike na nghọta nke ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaya Jizọs
  alternative: site na Mesaya Jizọs
  rationale: ‘N’ime’ na-edobe preposition ἐν na mgbagwoju anya nkà mmụta okpukpe ya, kama ịgbanwe ya ka ọ bụrụ ụzọ ma ọ bụ ihe kpatara ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘unu’ gosipụta plural nke ὑμεῖς. A haziri akara nkọwa ala peeji [a], [b], [c] n’ebe ha metụtara ngwụcha amaokwu ahụ.
