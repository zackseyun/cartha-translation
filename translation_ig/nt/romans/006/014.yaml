  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: ig
  text: N’ihi na mmehie agaghị achị unu[a], n’ihi na unu anọghị n’okpuru iwu[b], kama unu nọ n’okpuru amara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “agaghị enwe ọchịchị n’ahụ unu.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “n’okpuru iwu”; akpaalaokwu a pụtara ịnọ n’okpuru ikike ma ọ bụ usoro iwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: mmehie
  rationale: Okwu Igbo a na-akpọ mmehie n’ụzọ doro anya; ngwaa ‘ịchị’ na-edobekwa onyinyo nke mmehie dị ka ike na-achị, n’etinyeghị nkọwa ọzọ.
- source_word: κυριεύσει
  choice: agaghị achị unu
  rationale: ‘Ịchị’ na-egosi inwe ike ọchịchị n’ebe mmadụ nọ ma bụrụkwa okwu dị mfe nghọta n’Igbo nke oge a.
- source_word: ὑπὸ νόμον
  choice: n’okpuru iwu
  rationale: Nke a na-echekwa akpaalaokwu Grik nke na-egosi ịnọ n’okpuru ikike ma ọ bụ usoro iwu, na-ekpebighị ihe okwu ahụ niile pụtara n’ebe a.
- source_word: χάριν
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo a na-ejikarị akọwa χάρις n’akwụkwọ Pọl, ma na-echekwa ọdịiche dị n’etiti iwu na amara.
- source_word: γὰρ … γάρ
  choice: N’ihi na … n’ihi na
  rationale: Nke mbụ na-ejikọta amaokwu a na ihe e kwuru tupu ya; nke abụọ na-enye ihe kpatara nkwupụta mbụ.
theological_decisions:
- issue: Ma a ga-eme ka mmehie dị ka onye na-achị pụta ìhè karịa
  choice: Jiri ‘mmehie agaghị achị unu.’
  alternative: ‘Mmehie agaghị enwe ike ọchịchị n’ebe unu nọ.’
  rationale: Nhọrọ ahụ na-echekwa oyiyi mmehie dị ka ike na-achị, ma ọ naghị etinye echiche okpukpe ọzọ nke Grik ekwughị kpọmkwem.
- issue: Ihe ‘n’okpuru iwu’ pụtara
  choice: Debe akpaalaokwu ahụ n’ahịrị isi ma kọwaa ya na ndetu.
  alternative: Kọwaa ya ozugbo dị ka ‘n’okpuru ikike iwu.’
  rationale: Nke a na-echekwa nkenke na esemokwu nke okwu Pọl, ma na-enyere onye na-agụ aka site na ndetu na-enweghị ikpebi nkọwa niile.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro okwu Pọl na ọdịiche dị n’etiti iwu na amara, ma zere itinye nkọwa otu ụka pụrụ iche.
