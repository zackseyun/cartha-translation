id: ROM.6.17
reference: Romans 6:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: ig
  text: Ma ekele dịrị Chineke na, ọ bụ ezie na unu bụbu ndị ohu mmehie, unu sitere n’obi rubere isi n’ụkpụrụ nkuzi[a] ahụ e nyefere unu n’aka ya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụdị nkuzi” ma ọ bụ “usoro nkuzi.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ ka dịrị okwu Grik nso: “n’ime nke e nyefere unu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Ma ekele dịrị Chineke
  rationale: N’usoro okwu a, χάρις na-egosi inye Chineke ekele, ọ bụghị ‘amara’ dị ka àgwà nkịtị. Okwu a dịkwa ugwu ma kwekọọ n’olu otuto Pọl.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: ndị ohu mmehie
  rationale: ‘Ndị ohu’ na-echekwa echiche nke ịbụ ndị mmehie na-achị ma nwee ike n’ahụ́ ha, nke bụ isi ihe atụ Pọl ji arụ ọrụ na Ndị Rom 6.
- source_word: ὑπηκούσατε
  choice: rubere ... isi
  rationale: Nkebiokwu Igbo ‘irubere isi’ na-egosi nrubeisi n’ezie, ọ bụghị naanị ịnụ ihe.
- source_word: ἐκ καρδίας
  choice: sitere n’obi
  rationale: Nke a na-echekwa ihe atụ doro anya nke καρδία ma na-egosi nrubeisi sitere n’ime mmadụ n’ezi obi.
- source_word: τύπον διδαχῆς
  choice: ụkpụrụ nkuzi
  rationale: ‘Ụkpụrụ’ nwere ike igosi ihe nlereanya, ọdịdị, ma ọ bụ ọkọlọtọ a na-agbaso; ‘nkuzi’ na-anọchi διδαχή n’asụsụ Igbo dị mfe ma dị ugbu a.
- source_word: παρεδόθητε
  choice: e nyefere unu
  rationale: 'E debere olu nnara nke Grik: ọ bụ ndị kwere ekwe ka e nyefere nye ụkpụrụ nkuzi ahụ, kama ịgbanwe ya ka ọ bụrụ nkuzi e nyefere ha.'
- source_word: εἰς ὃν
  choice: n’aka ya
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si egosi na e nyefere ha nye ụkpụrụ ahụ ka ha nọrọ n’okpuru nduzi ya, ma na-echekwa ntụziaka εἰς. A kọwara nsụgharị nkịtị karị n’ala peeji.
theological_decisions:
- issue: Ma a ga-eme ka δοῦλοι dị nro dịka ndị na-eje ozi, ka ọ bụ chekwaa ihe atụ nke ịgba ohu
  choice: ndị ohu mmehie
  alternative: ndị na-ejere mmehie ozi
  rationale: Ndị Rom 6 na-emesi ọchịchị na njide mmehie ike ma na-atụnyere ya ịbụ ohu ezi omume. ‘Ndị ohu’ na-echekwa esemokwu nkà mmụta okpukpe ahụ n’enweghị ime ka okwu Pọl dị nro.
- issue: Ma a ga-agbanwe παρεδόθητε ka ọ bụrụ na e nyefere ndị kwere ekwe nkuzi ahụ
  choice: ụkpụrụ nkuzi ahụ e nyefere unu n’aka ya
  alternative: ụkpụrụ nkuzi ahụ e nyefere unu
  rationale: Grik na-egosi na ọ bụ ndị ahụ ka e nyefere nye ụkpụrụ nkuzi ahụ. E debere onyinyo a pụrụ iche kama ịgbanwe onye natara ihe.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. ‘Rubere ... isi’ bụ usoro okwu Igbo sitere n’okike; ‘e nyefere unu n’aka ya’ na-eme ka olu nnara na ọchịchị nke ụkpụrụ nkuzi ahụ pụta ìhè. E tinyere akara ala peeji [a] na [b] n’ebe okwu ha na-akọwa dị n’ahụ́ ederede.
