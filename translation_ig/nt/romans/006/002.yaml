    reason: lexical_alternative
  revision_rationale: The revision retains the direct, forceful repudiation of μὴ γένοιτο without adding God’s name; renders ἀπεθάνομεν τῇ ἁμαρτίᾳ in a more idiomatic Standard Igbo relational construction; and makes the continuing sense of πῶς ἔτι ... ζήσομεν explicit through “nọgide na-ebi.” No theological interpretation beyond the Greek metaphor has been introduced.
