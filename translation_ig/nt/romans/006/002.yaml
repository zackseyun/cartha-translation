  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: ig
  text: Mba! Anyị ndị nwụrụ anwụ n’ebe mmehie dị—olee otu anyị ga-esi nọgide na-ebi n’ime ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ka ọ ghara ịdị otu a!”; ọ bụ okwu siri ike e ji jụ echiche ahụ kpamkpam.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Mba, ọ dịghị ma ọlị!
  rationale: Nke a bụ ụzọ Igbo nke oge a si egosipụta ịjụ echiche ahụ kpamkpam, ma na-edebe ike okwu Pọl n’enweghị itinye aha Chineke nke na-adịghị na Grik.
- source_word: οἵτινες
  choice: Anyị ndị
  rationale: Ọ na-akọwa ndị kwere ekwe Pọl tinyere onwe ya n’etiti ha, ma na-edebe usoro onye mbụ ọtụtụ nke Grik.
- source_word: ἀπεθάνομεν
  choice: nwụrụ
  rationale: Oge gara aga dị mfe na-egosipụta ihe e lere anya dị ka ihe mere n’ụzọ doro anya, na-akọwaghị n’ụzọ ọzọ ihe atụ Pọl ji.
- source_word: τῇ ἁμαρτίᾳ
  choice: nye mmehie
  rationale: Dative a na-egosi mmekọrịta—ọnwụ n’ihe metụtara mmehie. ‘Nwụrụ nye mmehie’ na-edebe ihe atụ ahụ kpọmkwem kama ịkọwa ya dị ka naanị mgbanwe omume.
- source_word: πῶς ἔτι
  choice: olee otu anyị ga-esi ka
  rationale: Ajụjụ a na-egosi na Pọl jụrụ na a pụrụ ịnọgide n’ọnọdụ ahụ; ‘ka’ na-eburu echiche nke ἔτι, ya bụ ịnọgide ma ọ bụ imekwa otú ahụ.
- source_word: ζήσομεν
  choice: na-ebi
  rationale: Ọdịdị a dabara n’ajụjụ Igbo ‘ga-esi … na-ebi’ ma na-egosipụta ibi ndụ na-aga n’ihu.
- source_word: ἐν αὐτῇ
  choice: n’ime ya
  rationale: ‘Ya’ na-alaghachi na mmehie, ebe ‘n’ime’ na-edebe ihe oyiyi mmehie dị ka mpaghara ma ọ bụ ọchịchị mmadụ nwere ike ibi n’ime ya.
theological_decisions:
- issue: Ma okwu Pọl ọ̀ na-ekwu naanị banyere imezi omume ka ọ̀ bụ nkwụsị doro anya n’okpuru ọchịchị mmehie
  choice: E debere okwu ihe atụ ‘nwụrụ nye mmehie’ n’enweghị ịkọwa ya karịa ihe odide ahụ kwuru.
  alternative: Ịsị ‘anyị ndị hapụrụ mmehie’ ma ọ bụ ‘ndị ike mmehie belatara n’ime ha.’
  rationale: Grik na-ekwu banyere ọnwụ nye mmehie ozugbo. Idebe ihe atụ ahụ na-ahapụ nghọta na esemokwu nkà mmụta okpukpe Pọl n’ọnọdụ ya, kama ime ka ọ bụrụ naanị mgbanwe omume ma ọ bụ tinye otu nkọwa ụka.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji akara ogologo kewaa nkwupụta banyere ịnwụ nye mmehie na ajụjụ nkwupụta na-esote ya. A zere ‘Chineke ekwela’ n’ihi na aha Chineke adịghị n’okwu Grik, ọ bụ ezie na nke ahụ bụ akpaalaokwu Igbo a maara nke ọma.
