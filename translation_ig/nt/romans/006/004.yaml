id: ROM.6.4
reference: Romans 6:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: ig
  text: Ya mere, e liri anyị na ya site na baptizim banye n’ọnwụ, ka dị nnọọ ka a kpọlitere Mezaịa[a] site n’etiti ndị nwụrụ anwụ site n’ebube nke Nna, otu ahụkwa ka anyị jegharịa n’ụdị ndụ ọhụrụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, Kraịst.
    reason: Alternative conventional rendering of Χριστός. The marker is placed after “Mezaịa,” where the alternative applies.
lexical_decisions:
- source_word: συνετάφημεν
  choice: e liri anyị na ya
  rationale: The Igbo passive construction preserves the completed action, while “na ya” naturally conveys the συν- sense of being buried together with him.
- source_word: οὖν
  choice: Ya mere
  rationale: This is the natural Standard Igbo connective for an inference and preserves Paul’s logical progression.
- source_word: διὰ τοῦ βαπτίσματος
  choice: site na baptizim
  rationale: “Site na” preserves the instrumental force of διά with the genitive without specifying a denominational doctrine of baptism.
- source_word: εἰς τὸν θάνατον
  choice: banye n’ọnwụ
  rationale: The verb “banye” makes the directional force of εἰς explicit and avoids reducing the phrase to mere association with death.
- source_word: ἵνα
  choice: ka
  rationale: “Ka” naturally introduces the purpose/result clause in Standard Igbo while retaining the telic force.
- source_word: Χριστὸς
  choice: Mezaịa
  rationale: This renders Χριστός as the title “Messiah” rather than silently treating it only as a personal name.
- source_word: ἐκ νεκρῶν
  choice: site n’etiti ndị nwụrụ anwụ
  rationale: This preserves the image of being raised out from among the dead more explicitly than a shortened idiom would.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: site n’ebube nke Nna
  rationale: The wording retains both the instrumental διά and the full theological breadth of δόξα as “ebube,” rather than narrowing it to power alone.
- source_word: περιπατήσωμεν
  choice: ka anyị jegharịa
  rationale: “Jegharịa” preserves Paul’s walking metaphor and, under “ka,” expresses the intended purpose without flattening it to merely “live.”
- source_word: ἐν καινότητι ζωῆς
  choice: n’ịdị ọhụrụ nke ndụ
  rationale: This preserves the abstract expression “newness of life” rather than paraphrasing it simply as “a new life.”
theological_decisions:
- issue: Whether διὰ τοῦ βαπτίσματος should be rendered in a way that settles a particular sacramental doctrine
  choice: site na baptizim
  alternative: iji baptizim mee ya / n’ihi baptizim
  rationale: The chosen wording communicates grammatical instrumentality while leaving unresolved the precise theological mode by which baptism relates to participation in Messiah’s death.
- issue: Whether Χριστός should be represented as a title or merely as the familiar name “Kraịst”
  choice: Mezaịa
  alternative: Kraịst
  rationale: The title is retained as “Mezaịa”; the familiar equivalent “Kraịst” is supplied in a footnote so that no distinct doctrinal interpretation is added.
translation_notes:
  register: Natural, dignified Standard Igbo. The draft preserves Paul’s burial and walking metaphors, the directional force of entering death, and the repeated instrumental “site na.” The somewhat elevated phrase “n’ịdị ọhụrụ nke ndụ” is retained for source precision while remaining intelligible in context.
