revisions:
- from: N’ihi na ọnwụ ahụ ọ nwụrụ[a], ọ nwụrụ nye mmehie otu mgbe ruo mgbe ebighị ebi; ma ndụ ahụ ọ dị ndụ, ọ dịrị Chineke ndụ.
  to: N’ihi na ọnwụ ọ nwụrụ[a], ọ nwụrụ nye mmehie otu ugboro maka oge niile; ma ndụ ọ na-adị, ọ na-adịrị Chineke.
  rationale: The revision keeps the source’s paired construction (“the death he died … the life he lives”) in idiomatic Igbo, expresses ἐφάπαξ as a definitive one-time act, and preserves the disputed relational nuance of “nye mmehie” in both the text and the note. It introduces no doctrinal explanation beyond the source.
