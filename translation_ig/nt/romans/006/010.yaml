  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: ig
  text: N’ihi na ọnwụ ọ nwụrụ[a], ọ nwụrụ nye mmehie otu ugboro maka oge niile; ma ndụ ọ na-adị, ọ na-adịrị Chineke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihe banyere ọnwụ ya”; ma ọ bụ, “n’ihi na ọ nwụrụ.” A pụkwara ịghọta “nye mmehie” dị ka “n’ihi mmehie” ma ọ bụ “n’ihe metụtara mmehie.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ
  choice: ọnwụ ahụ ọ nwụrụ
  rationale: Nnọchiaha neuter a na-arụ ọrụ n’ụzọ akpaalaokwu, na-atụ aka n’ihe banyere ọnwụ ya; ntụgharị a na-echekwa nkwughachi na ike okwu Grik ma bụrụkwa Igbo doro anya.
- source_word: γάρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa nke ihe e kwuru n’amaokwu bu ụzọ, ya mere ‘N’ihi na’ na-egosi njikọ echiche ahụ nke ọma.
- source_word: ἀπέθανεν
  choice: ọ nwụrụ
  rationale: Aorist na-egosi ihe mere nke zuru ezu; oge gara aga dị mfe dabara n’ọnwụ Kraịst mere otu mgbe.
- source_word: τῇ ἁμαρτίᾳ
  choice: nye mmehie
  rationale: Dative a nwere ike igosi mmekọrịta ma ọ bụ ntụziaka. ‘Nye mmehie’ na-echekwa ihe yiri ibe ya n’etiti ‘nye mmehie’ na ‘nye Chineke’ n’usoro okwu Pọl, n’agbanyeghị na Igbo chọrọ ka e gbanwee nkebi nke abụọ ntakịrị ka ọ bụrụ nke ebumpụta ụwa.
- source_word: ἐφάπαξ
  choice: otu mgbe ruo mgbe ebighị ebi
  rationale: Nke a na-egosi na omume ahụ mere naanị otu ugboro, a gaghị emegharịkwa ya, ma uru ya na-adịgide.
- source_word: ὃ δὲ ζῇ
  choice: ma ndụ ahụ ọ dị ndụ
  rationale: Nke a na-echekwa usoro yiri nke ‘ọnwụ ahụ ọ nwụrụ’ ma na-eme ka ọdịiche dị n’etiti ọnwụ na ndụ pụta ìhè.
- source_word: δὲ
  choice: ma
  rationale: Ọ na-egosi ọdịiche dị n’etiti ọnwụ ya na ndụ ya.
- source_word: τῷ θεῷ
  choice: ọ dịrị Chineke ndụ
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si egosi na ndụ ya chere ihu n’ebe Chineke nọ ma bụrụ nke Chineke, ebe ọ ka na-echekwa echiche mmekọrịta dị na dative.
theological_decisions:
- issue: Ma a ga-atụgharị τῇ ἁμαρτίᾳ n’ụzọ nwere ike ime ka e chee na Kraịst nwere mmehie nke ya.
  choice: ọ nwụrụ nye mmehie
  alternative: ọ nwụrụ n’ihi mmehie; ọ nwụrụ n’ihe metụtara mmehie
  rationale: Nhọrọ a na-echekwa ọdịiche Pọl mere n’etiti ịnwụ nye mmehie na ịdịrị Chineke ndụ, n’akọwaghị n’ime isiokwu ahụ kpọmkwem otú ọnwụ Kraịst si metụta mmehie. Ihe ndị ọzọ okwu ahụ nwekwara ike ịpụta dị na nkọwa ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara nkwughachi na ọdịiche nke okwu Grik, ma zere nkọwa ga-ekpebi naanị otu ụzọ a ga-esi ghọta mmekọrịta ọnwụ Kraịst na mmehie.
