revisions:
- from: Unu enyefekwala akụkụ ahụ unu n’aka mmehie ka ha bụrụ ngwá agha[a] nke ajọ omume; kama nyefeenụ onwe unu nye Chineke dịka ndị si n’ọnwụ dị ndụ, nyefekwa akụkụ ahụ unu nye Chineke ka ha bụrụ ngwá agha nke ezi omume[b].
  to: Unu enyefela akụkụ ahụ unu nye mmehie ka ha bụrụ ngwá agha[a] nke ajọ omume; kama nyefeenụ onwe unu nye Chineke dịka ndị si n’ọnwụ dị ndụ, nyefekwa akụkụ ahụ unu nye Chineke ka ha bụrụ ngwá agha nke ezi omume[b].
  rationale: The revision removes an unsupported temporal nuance from the negative command and makes the relation to sin directly parallel to the relation to God. All other wording is retained because it faithfully and naturally conveys the Greek’s deliberate compression and moral-war imagery.
