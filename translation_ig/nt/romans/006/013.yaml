id: ROM.6.13
reference: Romans 6:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: ig
  text: Unu enyefela akụkụ ahụ unu nye mmehie ka ha bụrụ ngwá agha[a] nke ajọ omume; kama nyefeenụ onwe unu nye Chineke dịka ndị si n’ọnwụ dị ndụ, nyefekwa akụkụ ahụ unu nye Chineke ka ha bụrụ ngwá agha nke ezi omume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “ngwá ọrụ”; otu ihe ahụ metụtara “ngwá agha” nke ezi omume n’ọgwụgwụ amaokwu ahụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: enyefekwala / nyefeenụ
  rationale: “Inyefe” na-egosi itinye mmadụ ma ọ bụ akụkụ ahụ ya n’aka onye ọzọ ka o jiri ya mee ihe. Ọ na-echekwa otu mgbọrọgwụ okwu ahụ n’akụkụ abụọ ma mee ka ọdịiche dị n’etiti mmehie na Chineke pụta ìhè.
- source_word: μέλη
  choice: akụkụ ahụ
  rationale: Nke a bụ Igbo doro anya ma dịkwa eke maka akụkụ dị iche iche nke ahụ mmadụ nke a pụrụ iji mee omume.
- source_word: ὅπλα
  choice: ngwá agha
  rationale: Ọ na-echekwa ihe atụ nke ọgụ dị n’okwu Grik karịa “ngwá ọrụ,” ma a na-edebe ihe okwu ọzọ ahụ pụrụ ịpụta n’okpuru amaokwu.
- source_word: ἀδικίας
  choice: ajọ omume
  rationale: Ọ na-egosi omume na-adịghị ezi ma na-emegide “ezi omume” n’ọkara nke abụọ n’ụzọ ndị na-agụ Igbo ga-aghọta ngwa ngwa.
- source_word: ἁμαρτίᾳ
  choice: mmehie
  rationale: Nsụgharị a na-eso okwu Grik ozugbo ma na-ahapụ mmehie ka ọ nọgide nwee ọdịdị nke ike ma ọ bụ nna ukwu n’ime gburugburu okwu a.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: dịka ndị si n’ọnwụ dị ndụ
  rationale: Ọ na-echekwa “dịka,” mmegharị si n’ọnwụ pụta, na ọdịiche dị n’etiti ọnwụ na ndụ n’enweghị ịgbakwunye nkọwa na-anọghị n’ederede.
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: N’ebe a ọ na-egosi ọnọdụ na omume ziri ezi n’ihu Chineke, ma jikọta ya kpọmkwem megide “ajọ omume.” A na-edebe “ikpe ziri ezi” dịka ihe ọzọ okwu ahụ pụrụ ịpụta.
theological_decisions:
- issue: Mmehie na Chineke dị ka ndị na-achọ ka mmadụ nyefee onwe ya n’aka ha
  choice: E ji “n’aka mmehie” na “nye Chineke” kwuo njikọ ahụ n’enweghị ịkọwa ya karịa ka Grik si kwuo.
  alternative: Unu ejela ozi mmehie ... kama jeerenụ Chineke ozi.
  rationale: Nsụgharị ahụ na-eme ka echiche nke ọchịchị na nrubeisi doo anya, ma ọ naghị etinye okwu “ije ozi” nke na-anọghị kpọmkwem n’ederede.
- issue: “Si n’ọnwụ dị ndụ” nwere ike izo aka n’eziokwu ime mmụọ ma ọ bụ n’ihe atụ nke mbilite n’ọnwụ
  choice: E chekwara okwu ahụ dịka “ndị si n’ọnwụ dị ndụ.”
  alternative: Dịka ndị e mere ka ha si n’ọnwụ bilie.
  rationale: Nhọrọ a na-echekwa asụsụ na esemokwu nkà mmụta okpukpe nke ederede n’enweghị ikpebi kpọmkwem otú ndụ ọhụrụ ahụ si mee.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. “Akụkụ ahụ” ka doro ndị nkịtị anya karịa okwu nkịtị dịka “ndị otu,” ebe “ngwá agha” na-echekwa ihe atụ ọgụ Pọl ji mee ihe.
