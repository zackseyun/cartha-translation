id: ROM.6.12
reference: Romans 6:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: ig
  text: Ya mere, unu ekwela ka mmehie chịa n’ahụ unu nke na-anwụ anwụ, ka unu ghara irubere ọchịchọ ya isi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, a pụkwara ịsụgharị ya, “ka unu ghara irubere ọchịchọ mmehie isi.”
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Ya mere
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a, ma na-eme ka njikọ echiche ahụ doo anya n’Igbo.
- source_word: βασιλευέτω
  choice: unu ekwela ka ... chịa
  rationale: Na-echekwa iwu mgbochi dị n’ahịrịokwu Grik ahụ na ihe atụ nke mmehie dị ka eze na-achị, n’asụsụ Igbo na-ada nke ọma.
- source_word: ἁμαρτία
  choice: mmehie
  rationale: Okwu a bụ aha nkịtị maka mmehie, ebe ngwaa ‘chịa’ na-echekwa etu Pọl si mee ka mmehie pụta dịka ike na-achị mmadụ.
- source_word: θνητῷ
  choice: nke na-anwụ anwụ
  rationale: Na-egosi na ahụ mmadụ nọ n’ọnọdụ nke ọnwụ, na-agbakwunyeghị nkọwa ozizi ọzọ.
- source_word: σώματι
  choice: ahụ
  rationale: Nke a bụ nsụgharị doro anya na nke nkịtị maka σώμα n’ebe a.
- source_word: εἰς τὸ ὑπακούειν
  choice: nke ga-eme ka unu rubere ... isi
  rationale: Na-egosipụta ihe ga-esi n’ịchị mmehie pụta, ma na-ahapụkwa njikọ ahụ n’etiti ebumnuche na ihe si na ya pụta dịka Grik si kwe.
- source_word: ἐπιθυμίαις
  choice: ọchịchọ
  rationale: ‘Ọchịchọ’ sara mbara karịa okwu na-ezo naanị n’agụụ mmekọahụ, ya mere ọ na-echekwa obosara okwu Grik ahụ.
- source_word: αὐτοῦ
  choice: ya
  rationale: ‘Ya’ na-ejikọta nke ọma na ‘ahụ’ dịka usoro ụtọasụsụ Grik si dị; n’Igbo, ọ pụkwara ịnọgide na-enwe obere mgbagwoju anya nke ihe onye nnọchiaha ahụ na-ezo aka na ya.
theological_decisions:
- issue: Ma mmehie n’ebe a ọ bụ naanị omume ọjọọ ka ọ bụ ike na-achị mmadụ
  choice: E chekwara ihe atụ nke mmehie dịka ike na-achị site n’okwu ‘ka mmehie chịa.’
  alternative: Ịsụgharị ya dịka omume mmehie na-achịkwa ndụ mmadụ.
  rationale: Ngwaa βασιλεύω bụ okwu gbasara ịchị dịka eze. Ichekwa ihe atụ ahụ na-egosi ike okwu Pọl n’etinyeghị nkọwa ozizi pụrụ iche.
- issue: Ihe αὐτοῦ (‘ya’) na-ezo aka na ya
  choice: A ghọtara ya n’isi ederede dịka ọchịchọ nke ahụ na-anwụ anwụ.
  alternative: A pụrụ ịghọta ya dịka ọchịchọ nke mmehie.
  rationale: N’usoro ụtọasụsụ Grik, αὐτοῦ kwekọrọ n’ụdị otu nke etiti, σώματι, karịa ἁμαρτία nke bụ ụdị nwanyị. Ma ihe Pọl na-ekwu n’ebe a nwere ike ime ka ụfọdụ ghọta ya dịka ihe metụtara mmehie, ya mere e debere nke ahụ n’ala peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. E chekwara ihe atụ nke mmehie dịka eze na-achị, tinyere ọdịiche dị n’etiti ahụ na-anwụ anwụ na ndụ ọhụrụ a na-ekwu maka ya n’okwu ndị gbara amaokwu a gburugburu.
