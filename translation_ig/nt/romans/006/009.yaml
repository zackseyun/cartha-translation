id: ROM.6.9
reference: Romans 6:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: ig
  text: anyị maara na Mesaịa ahụ[a], ebe e mere ka o bilie site n’etiti ndị nwụrụ anwụ, anaghị anwụ ọzọ; ọnwụ anaghị achịkwa ya ọzọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Kraịst.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: ebe anyị maara
  rationale: Nkebi a na-egosi ihe ndị na-agụ akwụkwọ na onye dere ya maara, nke na-akwado okwu ahụ; “ebe anyị maara” na-edobe njikọ ahụ nʼebughị ụzọ kpebie na ọ pụtara kpọmkwem “nʼihi na.”
- source_word: Χριστὸς
  choice: Mezaya ahụ
  rationale: Nʼebe a, Χριστός bụ utu aha nke pụtara Onye E Tere Mmanụ; “Mezaya ahụ” na-eme ka ihe utu aha ahụ pụtara doo anya.
- source_word: ἐγερθεὶς
  choice: ebe e mere ka o ... bilie
  rationale: Nke a na-echekwa olu nnara nke participle ahụ na-egosikwa na mbilite ahụ mere tupu ihe e kwuru banyere ọnwụ ọzọ.
- source_word: ἐκ νεκρῶν
  choice: si nʼọnwụ
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke a na-aghọta nke ọma isi kwuo mbilite site nʼọnọdụ ndị nwụrụ anwụ.
- source_word: οὐκέτι
  choice: ọzọ
  rationale: “Ọzọ” mgbe e tinyere ya na mmegide “agaghị” na-egosipụta nke ọma na ọnọdụ ahụ akwụsịla kpamkpam; e ji otu echiche ahụ mee ihe nʼebe abụọ ahụ.
- source_word: ἀποθνῄσκει
  choice: agaghị anwụkwa
  rationale: NʼIgbo, ọdịnihu na-adịghị mma na “ọzọ” na-ekwupụta nke ọma eziokwu na ọ dịghịzi mgbe ọ ga-anwụ.
- source_word: θάνατος
  choice: ọnwụ
  rationale: A sụgharịrị aha ahụ ozugbo ma debe ọnwụ dị ka onye na-eme ihe nʼahịrịokwu ahụ, dịka okwu Pọl si dị.
- source_word: κυριεύει
  choice: agaghị achịkwa
  rationale: “Ịchịkwa” na-egosi ikike ma ọ bụ ọchịchị ọnwụ nwere, nʼasụsụ Igbo nke oge a ma dị mfe nghọta.
theological_decisions:
- issue: Nsụgharị Χριστός nʼokwu Pọl
  choice: Mezaya ahụ
  alternative: Kraịst
  rationale: Nʼebe a, okwu ahụ ka na-arụ ọrụ dị ka utu aha bara ihe ọ pụtara. “Mezaya ahụ” na-echekwa echiche nke Onye E Tere Mmanụ, ebe “Kraịst” bụkwa okwu a maara nke ọma nʼọgbakọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere nhazi ahịrịokwu abụọ nke Grik na ihe atụ nke ọnwụ dịka ike na-achị mmadụ.
