id: ROM.6.3
reference: Romans 6:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: ig
  text: Ka ọ̀ bụ na unu amaghị na anyị niile e mere baptizim n'ime Mesaya Jizọs, e mere anyị baptizim n'ime ọnwụ ya?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị “Mesaya Jizọs” dịka “Kraịst Jizọs.” N''asụsụ Grik: Christos Iēsous.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ka ọ̀ bụ na
  rationale: Na-ejigide njikọ arụmụka Pọl na ajụjụ ntụgharị uche ya, nke na-alaghachi n'ihe o kwuru tupu amaokwu a.
- source_word: ἀγνοεῖτε
  choice: unu amaghị
  rationale: Ọ bụ ụzọ Igbo dị mfe ma bụrụkwa nke ebumpụta ụwa isi kwuo ajụjụ na-akpọ ndị na-ege ntị ka ha cheta ihe ha kwesịrị ịma.
- source_word: ὅσοι
  choice: anyị niile
  rationale: Na-egosipụta oke okwu ahụ n'ụzọ doro anya ma debe onye mbụ n'ọtụtụ dịka ngwaa Grik si dị.
- source_word: ἐβαπτίσθημεν
  choice: e mere baptizim
  rationale: Na-egosipụta ọdịdị nnara nke ngwaa Grik ma ghara ịgbakwunye nkọwa otu ụka ọ bụla banyere baptizim.
- source_word: εἰς
  choice: n'ime
  rationale: Na-edebe echiche siri ike nke ịbanye ma ọ bụ ịbụ onye e tinyere n'ime, n'etinyeghị nkọwa okpukpe karịrị ihe Grik kwuru.
- source_word: Χριστὸν Ἰησοῦν
  choice: Mesaya Jizọs
  rationale: A sụgharịrị Χριστός dịka aha ọkwa ‘Mesaya’ ebe a; ‘Jizọs’ bụ ụdị aha ahụ ndị na-agụ Igbo maara nke ọma.
- source_word: θάνατον
  choice: ọnwụ
  rationale: Ọ bụ nsụgharị kpọmkwem ma zuru ezu nke θάνατος.
- source_word: αὐτοῦ
  choice: ya
  rationale: Na-egosipụta njikọ nwe ihe nke nnọchiaha Grik n'ụzọ Igbo ebumpụta ụwa.
theological_decisions:
- issue: Ma εἰς n'okwu banyere baptizim ga-akọwa ịdị irè nke sakrament, nnọchite ihe, ma ọ bụ ịdị n'otu na Kraịst.
  choice: A sụgharịrị εἰς ugboro abụọ dịka “n'ime.”
  alternative: “n'ihe metụtara” ma ọ bụ “ka e mee ka anyị dịrị n'otu na”
  rationale: “N'ime” na-edebe ike na nghọta sara mbara nke okwu Grik—ịbanye ma ọ bụ ịbụ onye e tinyere n'ime Mesaya Jizọs na ọnwụ ya—ma ghara ikpebi otu nkọwa ụka kpọmkwem.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, dị ugwu ma dị mfe nghọta. Ajụjụ ahụ na-edebe ụda ntụgharị uche na obere ịba mba dị n'okwu Pọl. E ji “Mesaya” gosipụta Χριστός dịka aha ọkwa, ebe e debere “Kraịst” dịka nhọrọ ọzọ n'ala ala peeji.
