revisions:
- from: N’ihi na onye nwụrụ anwụ, a gụọla ya dị ka onye ikpe na-amaghị n’ebe mmehie dị.[a]
  to: N’ihi na onye nwụrụ anwụ, a gụpụtala ya na mmehie.[a]
  rationale: The revision replaces an erroneous and unnatural legal expression with “a gụpụtala ya na mmehie,” an idiomatic Igbo expression that conveys acquittal while allowing the contextual implication of release from sin. The footnote preserves both the formal δικαιόω (“declared/reckoned righteous”) alternative and the contextually plausible “freed” sense without resolving the lexical tension.
  reviewer_model: gpt-5.6-terra
