  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: ig
  text: N’ihi na onye nwụrụ anwụ, a gụpụtala ya na mmehie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “a gụrụ ya n’onye ezi omume site na mmehie”; n’ọnọdụ okwu a, “a tọhapụla ya n’aka mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: onye nwụrụ anwụ
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha, na-egosi ‘onye ahụ nwụrụ’ n’ụzọ na-akọwaghị nwoke ma ọ bụ nwaanyị kpọmkwem.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-enye ihe kpatara okwu bu ya ụzọ ma ọ bụ na-akọwa ya; ‘N’ihi na’ bụ njikọ doro anya ma bụrụ Igbo nkịtị.
- source_word: δεδικαίωται
  choice: a gụọla ya dị ka onye ikpe na-amaghị
  rationale: 'Nhọrọ a na-edobe ọdịdị okwu ikpe dị na δικαιόω nakwa perfect passive ya: e meela mkpebi ahụ, ọnọdụ ya ka dịkwa. Ọ naghị eme ka okwu ahụ bụrụ naanị ntọhapụ n’ọchịchị mmehie.'
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: n’ebe mmehie dị
  rationale: Nke a na-eme ka okwu ikpe ahụ bụrụ Igbo a na-aghọta, ma ghara ịkọwa mmehie naanị dị ka ikpe ọmụma ma ọ bụ naanị dị ka ike na-achị mmadụ.
theological_decisions:
- issue: Ma δικαιόω ebe a ọ bụ naanị okwu ụlọikpe (‘gụọrọ onye ezi omume/ikpe amaghị’) ka ọ bụ okwu ntọhapụ (‘tọhapụ n’aka mmehie’).
  choice: a gụọla ya dị ka onye ikpe na-amaghị n’ebe mmehie dị
  alternative: a gụọla ya dị ka onye ezi omume n’ebe mmehie dị; ma ọ bụ, a tọhapụla ya n’aka mmehie
  rationale: Isi ederede na-edobe ụda ikpe nke ngwaa Grik, ebe ihe odide ala peeji na-egosi ma nsụgharị nkịtị ‘gụọrọ onye ezi omume’ ma ihe ọ pụtara n’ọnọdụ a, ‘tọhapụ n’aka mmehie.’ Ya mere, a naghị ehichapụ esemokwu dị n’etiti ikpe ziri ezi na ntọhapụ.
translation_notes:
  register: E ji Igbo ọkọlọtọ, nke oge a ma dị ùgwù dee ya. ‘Onye’ anaghị akọwa okike mmadụ. Nhazi ahịrịokwu ahụ na-edobe njikọ nkọwa γὰρ na nghọta iwu/ụlọikpe nke δεδικαίωται, ebe ihe odide ala peeji na-echekwa nghọta ntọhapụ nke ọnọdụ Ndị Rom 6 na-akwado.
