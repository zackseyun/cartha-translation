revisions:
- from: N’ụzọ dị otu a, ana m etinye obi m n’ikwusa ozi ọma, ọ bụghị n’ebe a kpọtụlarị Kraịst aha, ka m ghara iwukwasị n’elu ntọala onye ọzọ.[a]
  to: N’ụzọ dị otu a kwa, ana m agbalịsi ike ikwusa ozi ọma, ọ bụghị n’ebe a kpọtụlarị aha Mesaịa, ka m ghara iwuli n’elu ntọala onye ọzọ.[a]
  rationale: The revision makes the passive expression concerning Messiah’s name idiomatic and unambiguous in Standard Igbo, uses Mesaịa for the titular Greek Χριστός in accordance with the supplied translation policy, and retains the source’s restrained building metaphor. The footnote is corrected so that it does not claim more than the Greek states.
  reviewer_model: gpt-5.6-terra
