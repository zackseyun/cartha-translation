    text: Ma ọ bụ, “ka m ghara iwu n’elu ntọala onye ọzọ.” “Ntọala” bụ ihe atụ ụlọ nke na-ekwu maka ọrụ ozi ọma onye ọzọ rụrụla.
    reason: lexical_alternative
  revision_rationale: The revision makes the passive expression concerning Messiah’s name idiomatic and unambiguous in Standard Igbo, uses Mesaịa for the titular Greek Χριστός in accordance with the supplied translation policy, and retains the source’s restrained building metaphor. The footnote is corrected so that it does not claim more than the Greek states.
