  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: ig
  text: N’ụzọ dị otu a kwa, ana m agbalịsi ike ikwusa ozi ọma, ọ bụghị n’ebe a kpọtụlarị aha Mesaịa, ka m ghara iwuli n’elu ntọala onye ọzọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka m ghara iwu n’elu ntọala onye ọzọ.” “Ntọala” bụ ihe atụ ụlọ nke na-ekwu maka ọrụ ozi ọma onye ọzọ rụrụla.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως δὲ
  choice: N’ụzọ dị otu a
  rationale: Na-ejikọta okwu a na nkọwa Pọl kwuru tupu ya banyere ụzọ o si eje ozi; njikọ δὲ dị nro, ya mere e tinyebeghị okwu na-egosi nnukwu mgbagha.
- source_word: φιλοτιμούμενον
  choice: ana m etinye obi m
  rationale: Na-egosi ebumnobi siri ike na ọchịchọ Pọl ji aka ya họrọ, n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: εὐαγγελίζεσθαι
  choice: n’ikwusa ozi ọma
  rationale: Na-echekwa echiche nke ikwupụta ozi ọma n’ihu ọha, n’enweghị iji okwu ụka pụrụ iche nke nwere ike ghara ido mmadụ niile anya.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: ọ bụghị n’ebe a kpọtụlarị Kraịst aha
  rationale: Na-echekwa ọnọdụ ebe ahụ na olu nnara nke ngwaa Grik; “-larị” na-eme ka ihe mere tupu ọrụ Pọl pụta ìhè dịka ọnọdụ okwu ahụ si gosi.
- source_word: Χριστός
  choice: Kraịst
  rationale: “Kraịst” bụ nsụgharị Igbo a na-amakarị nke aha-ukwu Grik Χριστός, ma ọ ka na-eburu echiche nke Onye E Tere Mmanụ.
- source_word: ἵνα μὴ
  choice: ka m ghara
  rationale: Na-egosi nzube a jụrụ ajụ n’ụzọ Igbo dị nkenke ma kwekọọ na ihe odide ahụ.
- source_word: ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ
  choice: iwukwasị n’elu ntọala onye ọzọ
  rationale: Na-echekwa ihe atụ ụlọ na ntọala, ma ghara ịgbakwunye “nwoke,” nke na-adịghị n’ihe odide Grik.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Kraịst
  alternative: Mesaịa / Onye E Tere Mmanụ
  rationale: N’Igbo nke oge a, “Kraịst” bụ aha-ukwu a maara nke ọma ma na-anọchite anya Χριστός n’enweghị ịgbanwe ya ka ọ bụrụ naanị aha mmadụ. Nhọrọ “Mesaịa” nwere ike ime ka njikọ ya na aha-ukwu ahụ pụta ìhè karịa, ya mere e debere ya n’okpuru nkọwa ala peeji.
- issue: Ụkpụrụ ọrụ Pọl
  choice: E gosiri ya dịka ebumnobi Pọl n’onwe ya
  alternative: Iwu zuru ụwa ọnụ na-egbochi onye ọ bụla ije ozi n’ebe a maralarị Kraịst
  rationale: Ụdị onye mbụ na okwu φιλοτιμούμενον na-egosi atụmatụ na ọchịchọ Pọl, ọ bụghị iwu e nyere ndị ọrụ niile.
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ugwu ma dị mfe nghọta. E chekwara ihe atụ ụlọ dị n’ihe odide Grik, ma zere ịgbakwunye nkọwa okpukpe na-adịghị n’amaokwu ahụ.
