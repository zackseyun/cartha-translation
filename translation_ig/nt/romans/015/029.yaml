id: ROM.15.29
reference: Romans 15:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: ig
  text: Amakwa m na mgbe m ga-abịakwute unu, aga m eji uju ngọzi nke Mesaịa[a] bịa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ngọzi nke Kraịst.”
    reason: Ụzọ ọzọ e si asụgharị aha ọkwá Grik Χριστός.
lexical_decisions:
- source_word: οἶδα
  choice: ama m
  rationale: Nke a na-egosipụta ihe Pọl maara nke ọma na obi siri ya ike na ya, n’emeghị ka ọ bụrụ naanị echiche.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a, δέ bụ njikọ dị nro na-ebuga okwu n’ihu; “Ma” na-ejikọta amaokwu a na ihe bu ya ụzọ n’ụzọ doro anya.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: mgbe m ga-abịakwute unu
  rationale: Nkebi a nwere nghọta nke oge n’ihe metụtara ngwaa ọdịnihu; nsụgharị a bụ Igbo nkịtị ma na-echekwa njikọ ahụ.
- source_word: ἐλεύσομαι
  choice: aga m abịa
  rationale: Ọ bụ nkwupụta ọdịnihu doro anya banyere ọbịbịa Pọl.
- source_word: ἐν πληρώματι
  choice: n’uju
  rationale: “N’uju” na-echekwa echiche nke ihe zuru ezu ma ọ bụ juputara, n’enweghị nkọwa agbakwunyere.
- source_word: εὐλογίας
  choice: ngọzi
  rationale: Okwu a na-egosi ngọzi nke uju ahụ mejupụtara ma ọ bụ nke ji ya mara.
- source_word: Χριστοῦ
  choice: nke Mesaịa
  rationale: Χριστός na-arụ ọrụ dịka aha ọkwá nke Onye E Tere Mmanụ; “Mesaịa” na-echekwa ọrụ aha ọkwá ahụ.
theological_decisions:
- issue: Otú e si asụgharị Χριστοῦ
  choice: nke Mesaịa
  alternative: nke Kraịst
  rationale: “Mesaịa” na-egosipụta Χριστός dịka aha ọkwá, ọ bụghị dịka aha ezinụlọ. E tinyere ụdị “Kraịst” n’ala peeji n’ihi na ọ bụkwa okwu a maara nke ọma n’Igbo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa nkwenye siri ike Pọl nwere nakwa ihe atụ nke uju ngọzi, n’agbanyeghị na “n’uju” ka bụ okwu Igbo dị mfe.
