id: ROM.15.31
reference: Romans 15:31
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: ig
  text: ka a napụta m n’aka ndị na-enupụrụ isi nọ na Judia[a], ka ọrụ m maka Jerusalem bụrụkwa nke ndị nsọ ga-anabata nke ọma,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-ekweghị ekwe nọ na Judia.” Okwu Grik ahụ nwere ike ịpụta ndị jụrụ ikwere, si otú ahụ bụrụ ndị na-enupụrụ isi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ka ... ka ... kwa
  rationale: Ọ na-egosi ihe Pọl chọrọ ka ekpere ahụ mezuo. E ji nkebi abụọ e jikọrọ ọnụ gosipụta ahịrịokwu abụọ ahụ ἵνα na-achị.
- source_word: ῥυσθῶ
  choice: ka a napụta m
  rationale: Nke a na-egosipụta ịbụ onye a napụtara n’ihe ize ndụ, ma hapụkwa onye ga-anapụta ya n’aghaghị ikwu aha dịka olu nnara Grik si mee.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: n’aka ndị na-enupụrụ isi
  rationale: Ọ na-echekwa echiche nke ịjụ ikwere ma si otú ahụ ghara irube isi, n’ebughị ụzọ mechie nkọwa ya naanị n’otu akụkụ.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: nọ na Judia
  rationale: Nke a bụ ụzọ Igbo doro anya si egosi ebe ndị ahụ nọ.
- source_word: διακονία
  choice: ọrụ m
  rationale: Ọ na-egosi ọrụ ije ozi Pọl na-arụ, gụnyere inyefe onyinye ahụ, n’emeghị ka okwu ahụ bụrụ aha ọkwa ụka.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: maka Jerusalem
  rationale: Ọ na-egosi na ọrụ ahụ chere Jerusalem ihu ma bụrụ maka ndị nọ ebe ahụ.
- source_word: εὐπρόσδεκτος
  choice: nke ... ga-anabata nke ọma
  rationale: Ụdị a bụ Igbo e ji eme ihe nke ọma maka ihe mmadụ nabatara n’ụzọ dị mma ma ọ bụ nke dị ya mma.
- source_word: τοῖς ἁγίοις
  choice: ndị nsọ
  rationale: Ọ na-echekwa aha Pọl na-akpọ ndị kwere ekwe dịka ndị e doro nsọ nye Chineke.
- source_word: γένηται
  choice: bụrụ
  rationale: Ọ na-egosipụta olileanya na ọrụ ahụ ga-abịa bụrụ ihe a nabatara, kama ịbụ naanị nkwupụta ọnọdụ dị ugbu a.
theological_decisions:
- issue: Ihe ἀπειθούντων pụtara banyere ndị na-emegide Pọl na Judia
  choice: ndị na-enupụrụ isi
  alternative: ndị na-ekweghị ekwe
  rationale: Okwu Grik ahụ nwere ike ịpụta ịjụ ikwere, nke na-apụtakwa enweghị nrubeisi. Isi ederede na-echekwa obosara echiche ahụ; ihe odide ala peeji na-edebe nkọwa ọzọ a na-ahụkarị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ọrụ” kama okwu nwere ike ịdị ka aha ọkwa ụka, ma debe “ndị nsọ” iji chekwaa okwu Pọl ji eme ihe mgbe niile.
