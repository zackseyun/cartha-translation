id: ROM.15.12
reference: Romans 15:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: ig
  text: Ọzọkwa, Aịzaya kwuru, “Mgbọrọgwụ Jesi ga-adị, na onye na-ebili ịchị mba dị iche iche; mba dị iche iche ga-atụkwasị ya olileanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: Mgbọrọgwụ Jesi
  rationale: E debere ihe atụ ahụ kpọmkwem dịka ‘mgbọrọgwụ Jesi,’ n’ihi njikọ ya na Aịzaya 11 na usoro ọmụmụ sitere na Jesi.
- source_word: ὁ ἀνιστάμενος
  choice: onye ahụ nke na-ebili
  rationale: Nke a na-egosipụta participle dị ugbu a nke nwere nghọta banyere onye na-apụta ma ọ bụ na-ebili, n’ebughị ụzọ kpebie na ọ pụtara mbilite n’ọnwụ.
- source_word: ἄρχειν ἐθνῶν
  choice: ịchị mba niile
  rationale: ‘Mba niile’ bụ okwu Igbo doro anya maka ἔθνη n’ebe a, nke na-ekwu maka ndị na-abụghị Izrel dịka mba dị iche iche; ‘ịchị’ na-eburu echiche nke ịchị achị.
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: ọ bụkwa n’ime ya ka ... ga-atụkwasị olileanya ha
  rationale: Nkebi a na-enye Igbo eke maka ịtụkwasị olileanya n’otu onye, ma na-edobe ya dịka onye olileanya ahụ dabeere na ya.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ‘mgbọrọgwụ Jesi’ na ‘onye na-ebili’
  choice: Ejikọtara ha site na ‘ya bụ,’ dịka otu onye ahụ
  alternative: Iji ‘na’ mee ka ha yie ihe abụọ dị iche iche
  rationale: Ọdịdị amụma ahụ na nkọwa Pọl na-egosi na nkebi abụọ ahụ na-akọwa otu onye ahụ; ‘ya bụ’ na-eme ka nke a doo anya n’Igbo n’enweghị itinye ozizi otu ụka.
- issue: Ihe ‘na-ebili’ pụtara
  choice: E debere okwu sara mbara ‘na-ebili’
  alternative: ‘onye bilitere n’ọnwụ’ ma ọ bụ ‘onye na-apụta’
  rationale: ἀνιστάμενος nwere ike igosi ibili ma ọ bụ ịpụta maka ọrụ ọchịchị; ịsụgharị ya kpọmkwem dịka mbilite n’ọnwụ ga-emechi nghọta okwu ahụ karịa ka isi mmalite mere.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E chekwara ihe atụ amụma ahụ na usoro ahịrịokwu ahụ, ma hazie njikọ ya ka ọ daa nke ọma n’Igbo.
