id: ROM.15.33
reference: Romans 15:33
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: ig
  text: Ka Chineke nke udo nọnyeere unu niile. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: (a naghị atụgharị ya n'okwu pụrụ iche)
  rationale: N'ebe a, δέ bụ obere njikọ na-egosi ngafe gaa n'ekpere ngọzi mmechi; usoro ahịrịokwu Igbo na-egosipụta ngafe ahụ nke ọma n'enweghị itinye okwu dịka “ugbu a,” nke nwere ike ịpụta oge.
- source_word: θεὸς τῆς εἰρήνης
  choice: Chineke nke udo
  rationale: Nke a na-edobe aha nkọwa Pọl ji mee ihe na njikọ genitiv ya n'ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: εἰρήνης
  choice: udo
  rationale: “Udo” bụ okwu Igbo kwesịrị ekwesị maka εἰρήνη, ma nwee ike ibu echiche nke ịdị n'otu, ịdị mma, na mmezi mmekọrịta dị n'okwu a.
- source_word: μετὰ πάντων ὑμῶν
  choice: nọnyere unu niile
  rationale: “Nọnyere” na-egosipụta μετὰ nke ọma, ebe “unu niile” na-edobe πάντων ὑμῶν na oke ngọzi ahụ metụtara onye ọ bụla.
- source_word: ἀμήν
  choice: Amen
  rationale: E debere okwu litọji a dịka “Amen,” bụ́ ụdị ndị na-agụ Igbo maara nke ọma, iji chekwaa nkwenye na ịdị nsọ nke mmechi ahụ.
theological_decisions:
- issue: Ma a ga-ewere ahịrịokwu na-enweghị ngwaa a dị ka nkwupụta ma ọ bụ ekpere ngọzi
  choice: 'A sụgharịrị ya dịka ekpere ngọzi: “Ka Chineke nke udo nọnyere unu niile.”'
  alternative: “Chineke nke udo nọnyere unu niile.”
  rationale: Ọ bụ ezie na Grik enweghị ngwaa doro anya, ụdị okwu a na mmechi akwụkwọ ozi Pọl na-arụ ọrụ dịka ọchịchọ-ekpere ma ọ bụ ngọzi. “Ka ... nọnyere” na-egosipụta ọrụ ahụ n'Igbo n'ebughị ụzọ mee ka ọ bụrụ nkwupụta eziokwu nkịtị.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu kwesịrị ekpere ngọzi. E zere okwu ụka pụrụ iche na nkọwa gafere ihe odide Grik kwuru.
