  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: ig
  text: N’ihi na ihe niile e dere na mbụ ka e dere iji kuziere anyị ihe, ka anyị wee nwee olileanya[b] site ná ntachi obi na agbamume[a] nke Akwụkwọ Nsọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, ‘nkasi obi nke Akwụkwọ Nsọ’; παράκλησις nwere ike ịpụta agbamume, nkasi obi, ma ọ bụ ndụmọdụ siri ike.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, ‘ka anyị nwee olileanya.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: ihe niile
  rationale: Na-egosi ihe ndị ahụ niile n’ozuzu; nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche nnọchiaha neuter plural ahụ.
- source_word: προεγράφη
  choice: e dere na mbụ
  rationale: Na-echekwa echiche nke ide ihe tupu oge a, ọ bụghị ikwusa ya n’ihu ọha.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: iji kuziere anyị ihe
  rationale: Na-egosipụta nzube nke ihe e dere ma na-ada nke ọma n’Igbo nke oge a.
- source_word: ἐγράφη
  choice: ka e dere
  rationale: Na-ekwughachi okwu ‘dere’ dịka Grik si mee, wee debe ike nkwughachi ahụ.
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro Igbo a na-egosipụta nzube ma ọ bụ ihe a chọrọ ka o si na ya pụta.
- source_word: διὰ τῆς ὑπομονῆς
  choice: site ná ntachi obi
  rationale: ‘Ntachi obi’ na-egosi ịnọgide n’ike n’agbanyeghị ihe isi ike.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: na agbamume nke Akwụkwọ Nsọ
  rationale: ‘Agbamume’ na-egosi nkwado na iwusi obi ike, ma ahịrịokwu ahụ ka na-ahapụ njikọ genitive ahụ n’enweghị ịkọwa ya gabiga ókè.
- source_word: τῶν γραφῶν
  choice: nke Akwụkwọ Nsọ
  rationale: N’okwu Pọl, ọ na-ezo aka n’ihe odide dị nsọ; okwu Igbo a bụ nke ndị mmadụ maara nke ọma.
- source_word: τὴν ἐλπίδα
  choice: olileanya
  rationale: Na-enye echiche aha nkịtị ahụ n’ụzọ Igbo dị ndụ, n’enweghị mkpa itinye okwu na-akọwapụta ya.
- source_word: ἔχωμεν
  choice: anyị wee nwee
  rationale: Na-egosipụta subjunctive nke nzube mgbe ἵνα gasịrị n’ụzọ Igbo sitere n’okike.
theological_decisions:
- issue: Ọrụ Akwụkwọ Nsọ n’ime ka olileanya dị
  choice: E debere okwu ahụ ka ntachi obi na agbamume nke Akwụkwọ Nsọ bụrụ ụzọ e si enweta olileanya, n’enweghị ịkọwa njikọ ha n’ụzọ dị warara.
  alternative: A pụrụ ịkọwa ha kpọmkwem dịka ntachi obi na agbamume mmadụ na-enweta site n’ịgụ Akwụkwọ Nsọ, ma ọ bụ dịka àgwà ndị Akwụkwọ Nsọ na-egosi.
  rationale: Nhazi Grik nwere ohere maka nghọta abụọ ahụ; nsụgharị ahụ na-echekwa ohere ahụ kama idozi esemokwu nkọwa ya.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jiri ‘Akwụkwọ Nsọ’ mee ihe maka γραφαί, ma chekwaa nkwughachi ‘e dere ... e dere’ nke dị na Grik. Akara nkọwa ala peeji abụọ ahụ dị n’isiokwu bụ́ [a] na [b].
