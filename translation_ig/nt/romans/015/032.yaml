  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ἐν χαρᾷ ⸀ἐλθὼν πρὸς ὑμᾶς διὰ θελήματος ⸀θεοῦ συναναπαύσωμαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: ig
  text: ka m wee site n'uche Chineke jiri ọṅụ bịakwute unu, mụ na unu wee zuo ike ọnụ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka mụ na unu nweta ume ọnụ,” ma ọ bụ, “ka mụ na unu zuru ike ọnụ.” Okwu Grik ahụ na-egosi izu ike ma ọ bụ inweta ume nke a na-ekekọrịta ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ka m wee
  rationale: Ọ na-ewebata nzube nke arịrịọ Pọl kwuru n'amaokwu bu ụzọ, ma ọ bụkwa ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa.
- source_word: ἐν χαρᾷ
  choice: jiri ọṅụ
  rationale: Nke a na-egosi ọnọdụ na ụzọ ọ ga-esi bịa, ma na-edobe aha bụ ‘ọṅụ.’
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: bịakwute unu
  rationale: A tụgharịrị participle ahụ dị ka akụkụ nke ahịrịokwu nzube ka okwu ahụ bụrụ Igbo doro anya ma ghara ịgbanwe ihe ọ pụtara.
- source_word: διὰ θελήματος θεοῦ
  choice: site n'uche Chineke
  rationale: Nke a na-egosi na ọbịbịa Pọl dabere n'uche Chineke ma kwekọọ na ya, n'okwu Igbo dị mfe nghọta.
- source_word: θεοῦ
  choice: Chineke
  rationale: E ji usoro ‘uche Chineke’ mee genitive ahụ n'ụzọ dabara n'Igbo.
- source_word: συναναπαύσωμαι
  choice: mụ na unu ewee zukọọ ike ọnụ
  rationale: Okwu a na-edobe echiche nke izu ike ma ọ bụ inweta ume nke Pọl na ndị Rom ga-ekekọrịta ọnụ; ‘mụ na unu’ na ‘ọnụ’ na-eme ka mmekọrịta ahụ pụta ìhè.
theological_decisions:
- issue: Mmekọrịta dị n'izu ike Pọl tụrụ anya ya n'etiti ndị kwere ekwe nọ na Rom
  choice: mụ na unu ewee zukọọ ike ọnụ
  alternative: ka m wee nweta ume mgbe mụ na unu nọ
  rationale: Nhọrọ a na-egosi na Pọl na ha ga-ekekọrịta izu ike ahụ, kama ime ka ọ dị ka naanị Pọl ga-anata ihe n'aka ha. Ọ naghịkwa etinye nkọwa ozizi karịrị ihe okwu Grik kwuru.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọpụrụ ma dị mfe nghọta. E ji ‘zukọọ ike ọnụ’ kwupụta echiche nke izu ike ma ọ bụ ume a na-ekekọrịta, ebe nkọwa ala peeji na-edobe ụzọ ndị ọzọ okwu Grik ahụ nwere ike isi pụta.
