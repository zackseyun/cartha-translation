  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: ig
  text: N’ihi ya kwa, a gbochiri m ọtụtụ ugboro ịbịakwute unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ịsụgharị ya, “mgbe mgbe” ma ọ bụ “ugboro ugboro”; akpaalaokwu Grik bụ τὰ πολλὰ na-egosi na ihe ahụ mere ọtụtụ ugboro.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a, ma na-ejikọta amaokwu ahụ nke ọma na okwu ndị bu ya ụzọ.
- source_word: καὶ
  choice: kwa
  rationale: Na-echekwa echiche mgbakwunye dị na okwu Grik ahụ.
- source_word: ἐνεκοπτόμην
  choice: a gbochiri m
  rationale: Na-egosi na e nwere ihe gbochiri Pọl ugboro ugboro n’oge gara aga, n’akọwaghị onye ma ọ bụ ihe kpatara mgbochi ahụ.
- source_word: τὰ πολλὰ
  choice: ọtụtụ ugboro
  rationale: Akpaalaokwu Grik a na-egosi ugboro ugboro; nsụgharị a doro ndị na-agụ Igbo anya ma na-echekwa echiche ahụ.
- source_word: τοῦ ἐλθεῖν
  choice: ịbịakwute
  rationale: Na-egosipụta ihe a gbochiri Pọl ime, ya bụ, ịbịa n’ebe ha nọ.
- source_word: πρὸς ὑμᾶς
  choice: unu
  rationale: E jikọtara ya na ‘ịbịakwute’ iji gosi ngagharị n’ebe ndị kwere ekwe nọ na Rom n’ụzọ Igbo si ada nke ọma.
theological_decisions: []
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma dịkwa ugwu. Ahịrịokwu ahụ ahapụghị onye ma ọ bụ ihe kpatara mgbochi ahụ n’ihi na ederede Grik akọwaghị ya.
