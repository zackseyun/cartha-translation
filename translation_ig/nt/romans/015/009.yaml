id: ROM.15.9
reference: Romans 15:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: ig
  text: 'ka ndị mba ọzọ wee nye Chineke otuto n’ihi ebere ya,[a] dị ka e dere, sị: “N’ihi nke a, aga m eto gị n’etiti ndị mba ọzọ, agakwa m abụ abụ otuto nye aha gị.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’okwu Grik abụọ ahụ, ἔθνη/ἔθνεσι, a pụkwara ịsụgharị ya “mba dị iche iche” na “n’etiti mba dị iche iche.” Arụmụka Pọl metụtara ndị na-abụghị ndị Juu kpọmkwem, ma ihe ọ hotara nwekwara echiche sara mbara nke “mba dị iche iche.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: ndị mba ọzọ
  rationale: N’akwụkwọ Ndị Rom, okwu a na-ezokarị aka ná ndị na-abụghị ndị Juu. “Ndị mba ọzọ” na-egosi ọdịiche ahụ n’asụsụ Igbo dị mfe ma dị ùgwù.
- source_word: ὑπὲρ ἐλέους
  choice: n’ihi ebere ya
  rationale: ὑπέρ tinyere genitive na-egosi ihe kpatara otuto ahụ. “Ya” na-eme ka o doo anya na ọ bụ ebere Chineke, dị ka ihe okwu ahụ pụtara.
- source_word: δοξάσαι
  choice: wee nye Chineke otuto
  rationale: Infinitive a dabere n’ahịrịokwu amaokwu gara aga ma na-egosi ihe si n’ozi Kraịst pụta ma ọ bụ ebumnuche ya. “Wee” na-ejikọta ya nke ọma n’Igbo n’enweghị ịgbanwe ike okwu ahụ.
- source_word: καθὼς γέγραπται
  choice: dị ka e dere
  rationale: Nke a bụ usoro a na-ejikarị webata ihe e hotara n’Akwụkwọ Nsọ; nsụgharị a bụ nke nkịtị ma doo anya n’Igbo.
- source_word: ἐξομολογήσομαί
  choice: aga m eto
  rationale: N’ebe a, ngwaa ahụ pụtara ikwupụta otuto ma ọ bụ ekele nye Chineke n’ihu ọha, ọ bụghị ikwupụta mmehie. “Eto” kwekọrọ na ψαλῶ nke so ya.
- source_word: ἐν ἔθνεσι
  choice: n’etiti ndị mba ọzọ
  rationale: ἐν tinyere dative na-egosi ọnọdụ, ya bụ “n’etiti.” Nhọrọ a na-egosipụta otú Pọl si etinye ihe e hotara n’ọrụ gbasara ndị na-abụghị ndị Juu, ebe nkọwa ala peeji na-echekwa echiche sara mbara nke “mba dị iche iche.”
- source_word: ψαλῶ
  choice: bụọkwa abụ otuto
  rationale: ψάλλω n’ebe a bụ ịbụ abụ iji too Chineke. Okwu a bụ Igbo dị ndụ ma ghara ime ka a ghọta na ọ bụ naanị Abụ Ọma ka a ga-abụ.
- source_word: τῷ ὀνόματί σου
  choice: nye aha gị
  rationale: Dative a na-egosi onye ma ọ bụ ihe a na-abụ abụ otuto nye. “Nye aha gị” na-echekwa akpaalaokwu Akwụkwọ Nsọ banyere ito aha Chineke.
theological_decisions:
- issue: Ihe ahịrịokwu infinitive nke mbido na-ezo aka na ya na ọrụ ya
  choice: 'A sụgharịrị ya dị ka ihe na-aga n’ihu site n’amaokwu 8: ọrụ Kraịst na-eduga ná ndị mba ọzọ inye Chineke otuto n’ihi ebere ya.'
  alternative: 'Ịhapụ ya dị ka iberibe okwu siri ike: “na ndị mba ọzọ inye Chineke otuto n’ihi ebere.”'
  rationale: N’asụsụ Grik, akụkụ a dabere n’ihe e kwuru n’amaokwu 8. “Wee” na-eme ka njikọ ahụ doo anya n’Igbo, ma ọ naghị etinye ozizi ọzọ. Ebere ka e debere dị ka ihe kpatara otuto ndị mba ọzọ.
- issue: Uche ἔθνη n’okwu Pọl na n’ihe e hotara
  choice: E ji “ndị mba ọzọ” mee ihe n’ahịrịokwu abụọ ahụ iji gosipụta ndị na-abụghị ndị Juu n’arụmụka Pọl.
  alternative: “Mba dị iche iche” ma ọ bụ “n’etiti mba niile,” nke na-egosi echiche sara mbara nke ihe e hotara n’Abụ Ọma.
  rationale: Arụmụka Pọl na Rom 15 na-elekwasị anya ná nnabata ndị na-abụghị ndị Juu. Ma ebe okwu Grik na ihe e hotara nwekwara ike ịpụta “mba dị iche iche,” e chekwara nke ahụ na nkọwa ala peeji kama idozi esemokwu ahụ kpamkpam.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma dị ùgwù mee ihe. “Ndị mba ọzọ” bụ okwu ndị nkịtị ga-aghọta maka ndị na-abụghị ndị Juu; nkọwa ala peeji na-echekwa echiche ọzọ nke “mba dị iche iche.” Ahịrịokwu ahụ na-amalite n’obere mkpụrụedemede n’ihi na ọ bụ ihe na-aga n’ihu site n’amaokwu gara aga.
