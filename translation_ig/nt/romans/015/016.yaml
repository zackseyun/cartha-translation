revisions:
- from: ka m wee bụrụ onye na-ejere Kraịst Jizọs ozi n’etiti ndị mba ọzọ[a], na-arụ ọrụ nchụàjà n’ikwusa ozi ọma nke Chineke[b], ka onyinye bụ́ ndị mba ọzọ wee bụrụ nke Chineke na-anabata[c], nke Mmụọ Nsọ doro nsọ[d].
  to: ka m wee bụrụ onye na-ejere Kraịst Jizọs ozi nye ndị mba ọzọ[a], na-arụ ọrụ nchụàjà n’ozi ọma Chineke[b], ka onyinye ndị mba ọzọ wee bụrụ nke a nabatara[c], nke Mmụọ Nsọ doro nsọ[d].
  rationale: The revision more directly renders εἰς as mission directed “to/for the Gentiles,” preserves the Greek ambiguity in “the offering of the Gentiles,” and removes the added explicit action “proclaiming.” It retains Paul’s priestly metaphor and the alternative reading of ἐν πνεύματι ἁγίῳ in the notes.
