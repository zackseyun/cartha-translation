id: ROM.15.16
reference: Romans 15:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: ig
  text: ka m wee bụrụ onye na-ejere Kraịst Jizọs ozi nye ndị mba ọzọ[a], na-arụ ọrụ nchụàjà n’ozi ọma Chineke[b], ka onyinye ndị mba ọzọ wee bụrụ nke a nabatara[c], nke Mmụọ Nsọ doro nsọ[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nye mba dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “na-eji ozi ọma Chineke arụ ọrụ nchụàjà,” ma ọ bụ “na-arụ ọrụ nchụàjà n’ijere ozi ọma Chineke ozi.”
    reason: lexical_alternative
  - marker: c
    text: Ya bụ, o yiri ka ndị mba ọzọ n’onwe ha bụ onyinye a na-ewetara Chineke; ma ọ pụkwara ịbụ, “onyinye ndị mba ọzọ nyere.”
    reason: alternative_reading
  - marker: d
    text: Ma ọ bụ, “nke e doro nsọ n’ime Mmụọ Nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: onye na-ejere ... ozi
  rationale: Okwu a na-egosi onye na-arụ ọrụ ọha ma ọ bụ ọrụ dị nsọ; nsụgharị a bụ Igbo nkịtị ma na-edebekwa echiche nke ije ozi, ebe okwu na-esochi ya na-eme ka ihe atụ nchụàjà pụta ìhè.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Kraịst Jizọs
  rationale: “Kraịst” bụ aha-ọrụ a maara nke ọma n’Igbo maka Onye E Tere Mmanụ ahụ, ma n’ebe a ọ ka na-arụ ọrụ dị ka aha-ọrụ Jizọs.
- source_word: εἰς τὰ ἔθνη
  choice: n’etiti ndị mba ọzọ
  rationale: N’ọnọdụ ozi Pọl, okwu a na-ezo aka n’ebe ndị na-abụghị ndị Juu nọ; “n’etiti” na-egosi ókè ọrụ ya n’Igbo dị ndụ.
- source_word: ἱερουργοῦντα
  choice: na-arụ ọrụ nchụàjà
  rationale: Okwu Grik a bụ okwu kpọmkwem gbasara ọrụ nchụàjà. Nhọrọ a na-echekwa ihe atụ ahụ n’enweghị ikwu na Pọl na-achụ àjà mkpuchi mmehie.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: n’ikwusa ozi ọma nke Chineke
  rationale: N’ebe a, ọrụ nchụàjà Pọl bụ ijere ozi ọma Chineke ozi; “n’ikwusa” na-eme ka njikọ ahụ doo anya n’Igbo, n’agbanyeghị na Grik n’onwe ya kwuru nkenke “ozi ọma nke Chineke.”
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: onyinye bụ́ ndị mba ọzọ
  rationale: Ọnọdụ ihe atụ nchụàjà na ozi Pọl na-akwado na ndị mba ọzọ n’onwe ha bụ onyinye ahụ. A na-edebe nghọta ọzọ kwere omume na ndetu ala peeji.
- source_word: εὐπρόσδεκτος
  choice: nke Chineke na-anabata
  rationale: Nke a na-enye echiche onyinye Chineke nabatara n’Igbo doro anya; onye na-anabata ya bụ Chineke dịka ọnọdụ okwu ahụ si gosi.
- source_word: ἡγιασμένη
  choice: nke ... doro nsọ
  rationale: Ọ na-egosi ọnọdụ sitere n’omume ido nsọ; usoro a bụ okwu Igbo kwụ ọtọ ma dị ùgwù.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: nke Mmụọ Nsọ doro nsọ
  rationale: A ghọtara ἐν dị ka ụzọ ma ọ bụ onye sitere n’aka ya ido nsọ bịara. Nghọta “n’ime Mmụọ Nsọ” ka edere na ndetu n’ihi na Grik nwere ike ibu ya.
theological_decisions:
- issue: Pọl ji okwu nchụàjà kọwaa ọrụ ya
  choice: E chekwara ihe atụ nchụàjà site n’okwu “na-arụ ọrụ nchụàjà,” ma jikọta ya na nkwusa ozi ọma.
  alternative: Ịgụ ya dị ka Pọl nwere ọkwa nchụàjà n’ụzọ nkịtị, ma ọ bụ ihichapụ ihe atụ nchụàjà kpamkpam.
  rationale: λειτουργός, ἱερουργέω, na προσφορά jikọtara ọnụ na-emepụta ihe atụ nchụàjà. Ma ihe a na-ekwu bụ ozi Pọl nye ndị mba ọzọ, ọ bụghị àjà ọzọ maka mkpuchi mmehie.
- issue: Ihe “onyinye ndị mba ọzọ” na-ezo aka na ya
  choice: E mere ka ndị mba ọzọ n’onwe ha bụrụ onyinye a na-ewetara Chineke.
  alternative: Onyinye ndị mba ọzọ nyere.
  rationale: Ihe atụ nchụàjà na ọnọdụ ozi Pọl na-akwado nghọta mbụ, ma usoro genitive Grik ka nwere ohere maka nghọta nke abụọ, ya mere e tinyere ya na ndetu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara okwu ihe atụ nke nchụàjà, ma a zere asụsụ ga-amanye usoro ọchịchị ụka e mesịrị n’elu amaokwu ahụ. Akara ndetu [a] ruo [d] niile dị n’ederede isi.
