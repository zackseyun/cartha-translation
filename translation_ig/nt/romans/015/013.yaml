  to: Ka Chineke nke olileanya mejupụta unu n'ọṅụ niile na udo niile ka unu na-ekwere, ka unu wee baa ụba n'olileanya site n'ike nke Mmụọ Nsọ.
  rationale: The sole substantive revision replaces an explanatory paraphrase of “God of hope” with a direct Igbo genitive expression, preserving the Greek wording and its ambiguity. The phrasing for joy and peace is adjusted so that “all” is clearly understood with both coordinated nouns. No footnotes are needed.
