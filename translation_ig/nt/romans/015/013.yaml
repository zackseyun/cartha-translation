id: ROM.15.13
reference: Romans 15:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: ig
  text: Ka Chineke nke olileanya mejupụta unu n'ọṅụ niile na udo niile ka unu na-ekwere, ka unu wee baa ụba n'olileanya site n'ike nke Mmụọ Nsọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Ka Chineke, onye na-enye olileanya
  rationale: δὲ bụ njikọ dị nro, nke a na-ekwesịghị ime ka ọ bụrụ mmegide siri ike. Genitive τῆς ἐλπίδος na-egosi Chineke dịka isi iyi ma ọ bụ onye e ji nwee olileanya; ntụgharị a na-eme ka echiche ahụ doo onye Igbo anya.
- source_word: πληρώσαι
  choice: mejupụta
  rationale: Optative aorist dị n'ekpere ngọzi; “Ka ... mejupụta” na-egosipụta ọchịchọ ahụ ma na-echekwa ihe atụ nke imeju.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: n'ọṅụ na udo niile
  rationale: Genitive ndị a na-egosi ihe e ji emeju mmadụ. “Niile” na-echekwa mkpokọta πάσης ma na-emetụta ọṅụ na udo ọnụ.
- source_word: ἐν τῷ πιστεύειν
  choice: ka unu na-ekwere
  rationale: Articular infinitive ya na ἐν na-egosi ọnọdụ ma ọ bụ ihe na-eme n'otu oge; ntụgharị a na-echekwa omume nke ikwere karịa ịgbanwe ya ka ọ bụrụ naanị aha “okwukwe.”
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: ka unu wee baa ụba
  rationale: εἰς τὸ tinyere infinitive nwere ike igosi nzube ma ọ bụ nsonaazụ. “Ka ... wee” na-echekwa njikọ ahụ n'enweghị idozi kpamkpam ma ọ bụ naanị nzube ma ọ bụ naanị nsonaazụ.
- source_word: ἐν τῇ ἐλπίδι
  choice: n'olileanya
  rationale: Nke a na-echekwa ἐν ma jikọta okwu ahụ na olileanya e kwuru na mbụ.
- source_word: ἐν δυνάμει
  choice: site n'ike
  rationale: 'ἐν ebe a nwere nghọta ngwá ọrụ: ịba ụba n''olileanya na-abịa site n''ike Chineke.'
- source_word: πνεύματος ἁγίου
  choice: nke Mmụọ Nsọ
  rationale: N'okwu Pọl, nke a na-ezo aka na Mmụọ Nsọ; aha nsọpụrụ ahụ na mkpụrụedemede ukwu bụ usoro Igbo doro anya ma kwesị ekwesị.
theological_decisions:
- issue: Ihe πνεύματος ἁγίου na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ nsọ
  rationale: N'ọnọdụ okwu Pọl, ahịrịokwu a na-ezo aka na Mmụọ Nsọ nke Chineke, ọ bụghị naanị àgwà ime mmụọ ma ọ bụ ike na-enweghị onye nwe ya. Ntụgharị ahụ anaghị agbakwunye nkọwa karịrị ihe amaokwu ahụ kwuru.
- issue: Ma εἰς τὸ περισσεύειν ọ bụ nzube ka ọ bụ nsonaazụ
  choice: ka unu wee baa ụba
  alternative: nke ga-eme ka unu baa ụba
  rationale: Greek nwere ike ibu nghọta nzube ma ọ bụ nsonaazụ. Nhazi “ka ... wee” na Igbo na-ahapụ njikọ abụọ ahụ nso kama ikpebi otu n'ime ha n'ụzọ siri ike.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “unu” chekwaa plural nke ὑμᾶς. E nweghị akara nkọwa ụkwụ n'ihi na ọ dịghị nke dị mkpa n'amaokwu a.
