  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: ig
  text: Ka onye ọ bụla n’ime anyị mee ihe ga-atọ onye agbata obi ya ụtọ, maka ọdịmma ya, iji wulite ya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: onye ọ bụla n’ime anyị
  rationale: Nke a na-egosipụta onye ọ bụla n’otu n’otu, ma na-edobekwa ‘anyị’ nke na-agụnye Pọl na ndị ọ na-agwa okwu.
- source_word: τῷ πλησίον
  choice: onye agbata obi ya
  rationale: N’ebe a, okwu ahụ pụtara onye ibe mmadụ n’echiche omume, ọ bụghị naanị onye bi ya nso.
- source_word: ἀρεσκέτω
  choice: ka ... mee ihe ga-atọ ... ụtọ
  rationale: Ụdị ‘Ka ...’ na-ebute ike nke iwu ume dị na imperative ahụ; nkebiokwu ahụ bụkwa Igbo dị ndụ ma doo anya karịa iji naanị ‘tọ ... ụtọ’.
- source_word: εἰς τὸ ἀγαθὸν
  choice: maka ọdịmma ya
  rationale: Nke a na-egosi na ebumnuche ya bụ ihe ga-abara onye agbata obi uru, ọ bụghị naanị ime ihe masịrị ya.
- source_word: πρὸς οἰκοδομήν
  choice: iji wulite ya
  rationale: Nke a na-echekwa ihe atụ nke iwu ụlọ ma na-egosi ime ka onye ahụ sie ike ma too.
theological_decisions:
- issue: Ókè iwu banyere ime ihe ga-atọ onye agbata obi ụtọ
  choice: E ji ‘maka ọdịmma ya, iji wulite ya’ kọwaa na iwu ahụ bụ ime ihe ga-abara onye ahụ uru ma mee ka o sie ike.
  alternative: Ịsụgharị ya dị ka iwu ime ihe ọ bụla masịrị ndị ọzọ n’enweghị ókè.
  rationale: Nkebiokwu nzube abụọ dị n’asụsụ Grik na-egbochi nghọta nke ịna-achọ nnabata mmadụ n’agbanyeghị ihe ọma; a hapụrụ ha abụọ ka ha doo anya.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. A họọrọ ‘onye agbata obi’ dịka okwu amaara nke ọma maka onye ibe mmadụ; ‘wulite’ na-echekwa ihe atụ nke οἰκοδομή n’enweghị itinye nkọwa ụka karịrị ihe isi mmalite kwuru.
