revisions:
- from: Ana m arịọsi unu ike, ụmụnna m[c], site n’Onyenwe anyị Jizọs bụ Mezaịa[a], nakwa site n’ịhụnanya nke Mmụọ Nsọ[b], ka unu soro m gbaa mgba n’ekpere a na-ekpegara Chineke maka m.
  to: Ana m arịọsi unu ike, ụmụnna[c], site n’Onyenwe anyị Jizọs bụ Mezaịa[a], nakwa site n’ịhụnanya nke Mmụọ Nsọ[b], ka unu soro m gbaa mgba n’ekpere dị iche iche a na-ekpegara Chineke maka m.
  rationale: The revision removes the unsupported possessive “m” after “ụmụnna,” places footnote [c] at the word it explains, and makes the plural sense of προσευχαῖς explicit with “n’ekpere dị iche iche.” It otherwise preserves the draft’s accurate terminology, register, and grammatical ambiguity.
