id: ROM.15.30
reference: Romans 15:30
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: ig
  text: Ana m arịọsi unu ike, ụmụnna[c], site n’Onyenwe anyị Jizọs bụ Mezaịa[a], nakwa site n’ịhụnanya nke Mmụọ Nsọ[b], ka unu soro m gbaa mgba n’ekpere dị iche iche a na-ekpegara Chineke maka m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “Kraịst.” Okwu Grik bụ Christos, utu aha nke pụtara “Onye E Tere Mmanụ,” ya bụ, Mezaịa.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịghọta ya dị ka “ịhụnanya Mmụọ Nsọ nwere” ma ọ bụ “ịhụnanya Mmụọ Nsọ na-arụpụta.” Ụdị okwu Grik ahụ nwere ike ibu nghọta abụọ a.
    reason: alternative_reading
  - marker: c
    text: Okwu Grik a sụgharịrị “ụmụnna” dị n’ụdị ọtụtụ nwoke, ma o nwere ike ịkpọ ndị kwere ekwe niile—ụmụnna nwoke na ụmụnna nwanyị.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Ana m arịọsi unu ike
  rationale: Nke a na-egosi arịrịọ siri ike na nke e ji ịdị uchu kwuo, ọ bụghị naanị arịrịọ nkịtị.
- source_word: δὲ
  choice: (ekwughị ya iche)
  rationale: N’ebe a δέ bụ njikọ na-akwalite okwu gaa n’arịrịọ ọhụrụ, ọ bụghị okwu na-egosi nnukwu mmegide; itinye “ma” nwere ike ime ka mmegide pụta karịa ka Grik si kwuo.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: Nke a bụ ụzọ Igbo dị ùgwù na nke a na-aghọta nke ọma si akpọ ndị otu okwukwe; ihe gbasara ụdị okwu nwoke na oke ndị a na-akpọ ka akọwara na ndetu [c].
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: site n’Onyenwe anyị Jizọs bụ Mezaịa
  rationale: “Site na” na-edobe διὰ na genitive dị ka ihe arịrịọ ahụ dabeere na ya; “Onyenwe anyị” na-edobe κύριος, ebe “Mezaịa” na-egosi Χριστός dị ka utu aha.
- source_word: ἀγάπης τοῦ πνεύματος
  choice: ịhụnanya nke Mmụọ Nsọ
  rationale: “Nke” na-edobe njikọ genitive ahụ ka ọ ghara ikpebi ma ọ bụ ịhụnanya Mmụọ nwere ka ọ bụ nke Mmụọ na-arụpụta; “Mmụọ Nsọ” na-eme ka onye a na-ekwu banyere ya doo anya n’Igbo.
- source_word: συναγωνίσασθαί μοι
  choice: ka unu soro m gbaa mgba
  rationale: “Soro m” na-ebute συν- pụta, “gbaa mgba” na-echekwa echiche nke mgbalị siri ike dị n’okwu ahụ.
- source_word: ἐν ταῖς προσευχαῖς ... πρὸς τὸν θεόν
  choice: n’ekpere a na-ekpegara Chineke
  rationale: Nke a na-edobe ekpere dịka ebe ma ọ bụ ụzọ ha si esoro Pọl gbaa mgba, ma ọ naghị atụkwasị nnọchiaha “unu” nke na-adịghị na Grik.
- source_word: ὑπὲρ ἐμοῦ
  choice: maka m
  rationale: Nke a bụ ụzọ Igbo kwụ ọtọ ma dị mfe isi gosipụta ekpere a na-ekpe n’ihi Pọl na n’aha ya.
theological_decisions:
- issue: Onye “Mmụọ” na-ezo aka na ya
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ ma ọ bụ mmụọ n’echiche na-abụghị onye
  rationale: Ojiji Pọl na ọnọdụ okwu a na-akwado na ọ bụ Mmụọ Nsọ; ma ụdị genitive ahụ ka e debere n’enweghị ịkọwa kpọmkwem ụdị ịhụnanya ahụ.
- issue: Nsụgharị Χριστοῦ
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’ebe a Χριστός bụ utu aha nke Jizọs; “Mezaịa” na-egosipụta uru ya dịka Onye E Tere Mmanụ, ebe e nyere “Kraịst” na ndetu maka ndị maara ụdị ọdịnala ahụ.
- issue: Oke ndị ἀδελφοί na-akpọ
  choice: ụmụnna m
  alternative: ụmụnna nwoke na ụmụnna nwanyị
  rationale: Ụdị Grik ahụ bụ ọtụtụ nwoke, ma n’ọnọdụ a o nwere ike ịgụnye nzukọ ndị kwere ekwe niile; a kọwara nke ahụ na ndetu kama ịgbasa isi okwu ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-edobe nkwughachi “site na ... nakwa site na,” ike dị na “soro m gbaa mgba,” na mgbagwoju anya nke genitive n’okwu “ịhụnanya nke Mmụọ Nsọ.”
