revisions:
- from: Ya mere, mgbe m rụchara nke a, ma jiri akara kwado mkpụrụ a[b] nye ha[a], aga m esi n’ebe unu nọ[c] gaa Spen.
  to: Ya mere, mgbe m rụchara nke a ma jiri akara kwado mkpụrụ a[b] nye ha[a], aga m agafe n’ebe unu nọ[c] gaa Spen.
  rationale: The revision changes only the travel clause so that it conveys transit through/by way of the recipients rather than simple departure from their location. It also corrects and sharpens the explanatory footnotes while retaining the deliberate ambiguity of σφραγισάμενος through “jiri akara kwado.”
