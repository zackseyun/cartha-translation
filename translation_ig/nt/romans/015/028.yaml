id: ROM.15.28
reference: Romans 15:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: ig
  text: Ya mere, mgbe m rụchara nke a ma jiri akara kwado mkpụrụ a[b] nye ha[a], aga m agafe n’ebe unu nọ[c] gaa Spen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nyefee ha mkpụrụ a n’enweghị nsogbu.” Okwu a sụgharịrị “jiri akara kwado” nwere ike ịpụta ime ka o doo anya na onyinye ahụ rutere n’aka ndị e nyere ya n’ụzọ kwesịrị ekwesị.
    reason: lexical_alternative
  - marker: b
    text: “Mkpụrụ a” bụ onyinye ego ndị kwere ekwe na-abụghị ndị Juu chịkọtara maka ndị nsọ nọ na Jerusalem.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “site n’etiti unu gafee.” Ihe Pọl nwere ike ikwu bụ na ọ chọrọ isi Rom gafee mgbe ọ na-aga Spen.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: Ya mere, mgbe m rụchara nke a
  rationale: “Ya mere” na-egosi njikọ ya na ihe Pọl kwuru tupu nke a; “mgbe m rụchara” na-egosikwa na ọrụ ahụ ga-ebu ụzọ gwụ tupu ọ gawa.
- source_word: σφραγισάμενος
  choice: jiri akara kwado
  rationale: Nke a na-edobe ihe atụ dị n’okwu Grik banyere ịka ihe akara, ma n’Igbo ọ na-enyekwa echiche nke ime ka onyinye ahụ bụrụ ihe a kwadoro ma chekwaa maka ndị ga-anata ya.
- source_word: αὐτοῖς
  choice: nye ha
  rationale: Ọ na-ezo aka n’ebe ndị nsọ nọ na Jerusalem bụ ndị a chịkọtara onyinye ahụ maka ha.
- source_word: τὸν καρπὸν τοῦτον
  choice: mkpụrụ a
  rationale: 'A hapụrụ ihe atụ Pọl ji mee ihe: onyinye ego ahụ bụ “mkpụrụ,” ya bụ, ihe ọma sitere n’afọ ọma na mmesapụ aka nke ndị kwere ekwe sitere ná mba ọzọ.'
- source_word: ἀπελεύσομαι
  choice: aga m ... gaa
  rationale: Ọdịnihu nke ngwaa ahụ na-egosi njem Pọl ga-aga mgbe ọrụ ahụ gasịrị.
- source_word: δι’ ὑμῶν
  choice: esi n’ebe unu nọ
  rationale: N’ọnọdụ a, διά tinyere genitive na-egosi na Pọl ga-esi Rom, ebe ndị ọ na-edegara akwụkwọ nọ, gafee n’ụzọ ya na Spen, n’etinyeghị nkọwa ọzọ banyere ụdị enyemaka ha ga-enye ya.
- source_word: εἰς Σπανίαν
  choice: gaa Spen
  rationale: Nke a bụ ụzọ Igbo dị mfe ma bụrụkwa nke nkịtị isi gosi ebe njem ahụ na-aga.
theological_decisions:
- issue: Ihe “iji akara kwado mkpụrụ a” pụtara n’ihe gbasara onyinye e chikọtara maka ndị nsọ nọ na Jerusalem
  choice: 'E debere ihe atụ nke ịka akara n’ahịrịokwu bụ isi: “jiri akara kwado.”'
  alternative: “nyefee ha mkpụrụ a n’enweghị nsogbu” ma ọ bụ “mee ka ha nata onyinye a n’ezie.”
  rationale: Okwu Grik nwere ike ịpụta ịka akara n’ụzọ e ji akwado, echekwa, ma ọ bụ gosi na e nyefere ihe n’ụzọ kwesịrị ekwesị. Idebe ihe atụ ahụ na-egbochi ntụgharị ịkpebi naanị otu n’ime nghọta ndị ahụ.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta. A hapụrụ ihe atụ “mkpụrụ” na nke “ịka akara,” ebe nkọwa ala peeji na-eme ka ihe ha na-ezo aka na ya doo anya. A haziri akara nkọwa [a], [b], na [c] n’akụkụ okwu nke ọ bụla ha na-akọwa.
