  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: ig
  text: 'Kama, dị ka e dere ya:


    “ Ndị a na-agwabeghị banyere ya ga-ahụ,[a][b]

    ndị na-anụbeghịkwa ga-aghọta.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pọl na-ehota Aịzaya 52:15. N'okwu Aịzaya, nnọchiaha “ya” na-ezo aka n'ohu ahụ; n'ebe a, Pọl ji okwu ahụ mee ihe banyere nkwusa ozi ọma ya.
    reason: cross_reference
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “Ndị a na-agwaghị ihe ọ bụla banyere ya ga-ahụ, ndị na-anụbeghịkwa ga-aghọta.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Kama
  rationale: Ọ na-egosi ọdịiche dị n'etiti ihe Pọl kwuru tupu nke a banyere ebe ọ chọrọ ikwusa ozi ọma na ihe e dere n'Akwụkwọ Nsọ.
- source_word: καθὼς γέγραπται
  choice: dị ka e dere ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma bụrụkwa nke a na-ejikarị ewebata ihe e hotara n'Akwụkwọ Nsọ; ọ na-egosipụta perfect passive ahụ n'ụzọ ebumpụta ụwa.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: Ndị a na-agwabeghị banyere ya
  rationale: Nhazi a na-eme ka dative relative pronoun pụta n'Igbo dị mfe, ma na-echekwa passive na echiche nke na e nwebeghị onye gwara ha banyere ya.
- source_word: ὄψονται
  choice: ga-ahụ ya
  rationale: A hapụrụ ngwaa ahụ n'echiche nkịtị ya, ‘ga-ahụ’; e tinyere ‘ya’ dịka object a na-achọ n'Igbo, na-ezo aka n'onye a kpọtụrụ aha na ‘banyere ya.’
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: ndị na-anụbeghịkwa
  rationale: Ụdị ‘na-anụbeghị’ na-egosi ọnọdụ ha dị ugbu a n'ihi na ha anụbeghị, ebe ‘-kwa’ jikọtara ahịrịokwu nke abụọ na nke mbụ.
- source_word: συνήσουσιν
  choice: ga-aghọta
  rationale: Nke a bụ ntụgharị kpọmkwem, doro anya, nke na-echekwa nkwa amụma ahụ n'enweghị ịkọwa ihe karịa ihe odide ahụ kwuru.
theological_decisions:
- issue: Onye nnọchiaha αὐτοῦ (‘ya’) na-ezo aka na ya
  choice: E debere ‘ya’ n'ahịrị bụ isi n'akọwaghị ya dịka ‘Kraịst’ ma ọ bụ ‘Mezaịa.’
  alternative: Ịsụgharị ya dịka ‘banyere Kraịst’ ma ọ bụ ‘banyere Mezaịa.’
  rationale: Ihe odide Grik ji nnọchiaha mee ihe. N'ime Aịzaya ọ na-ezo aka n'ohu ahụ, ebe Pọl jiri amaokwu ahụ mee ihe gbasara nkwusa ozi ọma ya. Idebe nnọchiaha ahụ na-echekwa njikọ na mgbagwoju anya ziri ezi nke ihe odide ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E debere usoro uri nke ihe e hotara, jiri ‘Kama’ mee adversative contrast, ma zere ịgbasa ‘ya’ ka ọ bụrụ aha nkà mmụta okpukpe nke na-adịghị n'ihe odide Grik.
