  naturalness: “Ana m ekwu” is understandable but is less idiomatic in this Pauline assertion than the simple performative expression “asị m.” The revision uses natural, dignified Standard Igbo without altering the sense.
  terminology: “Mesaịa,” “onye na-ejere ... ozi,” “ndị e biri úgwù,” “eziokwu Chineke,” and “ndị nna nna” are suitable choices. The footnote properly preserves the contextual alternative of God’s truthfulness/faithfulness without forcing it into the main text.
