id: ROM.15.8
reference: Romans 15:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: ig
  text: N’ihi na asị m na Mesaịa aghọọla onye na-ejere ndị e biri úgwù ozi n’ihi eziokwu Chineke[a], ka o wee mee ka nkwa ndị e kwere ndị nna nna guzosie ike,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ihi ikwesị ntụkwasị obi nke Chineke,” nke na-eme ka ikwesị ntụkwasị obi ya n’imezu nkwa ọgbụgba ndụ ya pụta ìhè.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ
  choice: N’ihi na ana m ekwu
  rationale: “N’ihi na” na-egosi na okwu a na-akọwa ihe e kwuru tupu ya; “ana m ekwu” na-edobe ụzọ Pọl si webata nkwupụta ya.
- source_word: Χριστόν
  choice: Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka utu aha n’arụmụka gbasara Izrel, ibi úgwù, na nkwa e kwere ndị nna nna.
- source_word: διάκονον
  choice: onye na-ejere … ozi
  rationale: Nke a na-egosi onye na-eje ozi n’enweghị itinye echiche banyere ọkwa “dikọn” nke chọọchị n’amaokwu a.
- source_word: γεγενῆσθαι
  choice: aghọọla
  rationale: Ụdị perfect infinitive a na-egosi na Mesaịa ghọrọ onye na-eje ozi ma nọgide n’ọnọdụ ahụ.
- source_word: περιτομῆς
  choice: ndị e biri úgwù
  rationale: Genitive a na-ezo aka n’ebe ndị e biri úgwù nọ, ya bụ ndị Juu; nkebi ahịrịokwu Igbo a na-eme ka ndị a na-ekwu banyere ha doo anya.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: n’ihi eziokwu Chineke
  rationale: “N’ihi” na-egosi ihe kpatara ya ma ọ bụ ihe a na-eje ozi maka ya. “Eziokwu Chineke” na-edobe ohere nghọta nke eziokwu Chineke nakwa ikwesị ntụkwasị obi ya.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: ka o wee mee ka … guzosie ike
  rationale: Nke a na-egosi nzube ma na-enye echiche nke ime ka nkwa ndị ahụ sie ike ma bụrụ ndị a kwadoro.
- source_word: τὰς ἐπαγγελίας
  choice: nkwa ndị
  rationale: “Nkwa” bụ okwu Igbo doro anya ma bụrụkwa nke dabara n’ọnọdụ ọgbụgba ndụ a.
- source_word: τῶν πατέρων
  choice: ndị e kwere ndị nna nna
  rationale: “Ndị nna nna” na-edobe ntụaka pụrụ iche nye ndị nna ochie Izrel, ebe usoro passive na-egosi na ọ bụ ha ka e kwere nkwa ndị ahụ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ọnọdụ a, okwu ahụ bụ utu aha nke jikọrọ ọrụ Mesaịa na Izrel, ibi úgwù, na nkwa ndị nna nna.
- issue: Ihe ἀλήθεια θεοῦ pụtara
  choice: eziokwu Chineke
  alternative: ikwesị ntụkwasị obi nke Chineke
  rationale: Okwu Grik ahụ nwere ike ịpụta eziokwu Chineke n’ozuzu ya ma ọ bụ ịbụ onye eziokwu na ikwesị ntụkwasị obi ya n’imezu nkwa ọgbụgba ndụ. E debere nghọta nke abụọ n’okpuru peeji ka a ghara idozi ihe isi mmalite hapụrụ ka ọ nwee akụkụ abụọ.
- issue: Ndị ἡ περιτομή na-ezo aka na ha
  choice: ndị e biri úgwù
  alternative: ibi úgwù
  rationale: N’ebe a okwu ahụ na-anọchi anya ndị e biri úgwù, karịsịa ndị Juu, ọ bụghị naanị omume ibi úgwù.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Onye na-ejere ndị e biri úgwù ozi” bụ usoro nkịtị karịa ntụgharị aha-na-aha, ma ọ na-edobe njikọ διάκονον περιτομῆς. Akara ntụaka [a] dị n’ederede isi.
