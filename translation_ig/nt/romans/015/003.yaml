revisions:
- from: N’ihi na ọbụna Mesaịa[a] emeghị ihe ga-atọ onwe ya ụtọ; kama, dị ka e dere, “Nkọcha ndị na-akọcha gị dakwasịrị m.”
  to: N’ihi na ọbụna Mesaịa[a] emeghị ihe masịrị onwe ya; kama, dị ka e dere, “Mkparị ndị na-akparị gị dakwasịrị m.”
  rationale: The revision replaces a term that can mean ‘curse’ with “mkparị,” which accurately represents the source’s reproaches or insults, and adjusts the first clause to express directly that the Messiah did not please himself. The quotation’s unqualified “m” is retained, as is the title rendering “Mesaịa.”
  reviewer_model: gpt-5.6-terra
