  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: ig
  text: N’ihi na ọbụna Mesaịa[a] emeghị ihe masịrị onwe ya; kama, dị ka e dere, “Mkparị ndị na-akparị gị dakwasịrị m.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị “Kraịst” n’ọnọdụ “Mesaịa.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: N’ihi na ọbụna
  rationale: “N’ihi na” na-egosi na amaokwu a na-enye ihe mere e ji kwuo ndụmọdụ dị n’amaokwu bu ya ụzọ; “ọbụna” na-emesi Mesaịa ike dị ka ihe atụ kachasị elu.
- source_word: ὁ Χριστός
  choice: Mesaịa
  rationale: N’ebe a, Χριστός na-arụ ọrụ dị ka utu aha nke Onye E Tere Mmanụ, ọ bụghị naanị dị ka aha a na-akpọ mmadụ.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: emeghị ihe ga-atọ onwe ya ụtọ
  rationale: Nke a na-edobe echiche nke ‘ime ihe na-atọ onwe ya ụtọ’ ma na-ada ka Igbo nkịtị ma doo anya; ọ naghị agbakwụnye nkọwa karịrị okwu Grik.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: kama, dị ka e dere
  rationale: Nke a bụ usoro a na-eji ewebata ihe e dere n’Akwụkwọ Nsọ; “dị ka e dere” na-egosipụta ike nke perfect γέγραπται n’ụzọ Igbo na-anabata.
- source_word: ὀνειδισμοί
  choice: Nkọcha
  rationale: “Nkọcha” na-egosi okwu mkparị na iweta ihere, ma na-edobe ụda dị nsọ na nke siri ike nke ihe e hotara.
- source_word: τῶν ὀνειδιζόντων σε
  choice: ndị na-akọcha gị
  rationale: Nkebi a na-edobe njikọ okwu dị n’etiti ὀνειδισμοί na ὀνειδιζόντων site n’iji “nkọcha” na “na-akọcha.”
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: dakwasịrị m
  rationale: “Dakwasịrị m” bụ ụzọ Igbo doro anya ma dị nkenke isi gosipụta ihe ndị ahụ ‘dara n’elu m’ ma ọ bụ bịakwasị m.
theological_decisions:
- issue: Otu e si sụgharịa Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: Njirimara okwu ahụ na ọrụ Mesaịa dị ka ihe atụ nye ndị kwere ekwe na-akwado ịsụgharị ya dị ka utu aha. Ihe odide ala peeji na-echekwa “Kraịst” dị ka ụzọ ọzọ a maara nke ọma.
- issue: Onye na-ekwu okwu n’ihe e hotara n’Akwụkwọ Nsọ
  choice: E hotara okwu ahụ kpọmkwem n’ebughị ụzọ kọwaa onye “m” bụ.
  alternative: Ịkọwa “m” n’ime isi okwu ahụ dị ka Mesaịa/Kraịst
  rationale: Pọl metụtara okwu Abụ Ọma 69:9 na Mesaịa, ma ihe odide Grik akọwaghị onye “m” bụ n’ime ihe ahụ e hotara. Ya mere, nsụgharị ahụ na-echekwa mgbagwoju na njikọ nkà mmụta okpukpe ahụ kama idozi ya n’ime isi okwu.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. “Nkọcha” na “dakwasịrị m” na-echekwa ụda uri na ịdị arọ nke ihe e hotara, ebe “emeghị ihe ga-atọ onwe ya ụtọ” na-eme ka okwu Grik dị nkenke ghọta nke ọma n’Igbo.
