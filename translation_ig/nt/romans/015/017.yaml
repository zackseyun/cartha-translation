base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: ig
  text: N’ihi ya, enwere m ihe m ga-eji na-anya isi[a] n’ime Mesaịa Jizọs[b] n’ihe ndị metụtara Chineke[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “enwere m ihe mere m ga-eji na-anya isi” ma ọ bụ “enwere m ihe ndabere m ga-eji na-anya isi.”
    reason: lexical_alternative
  - marker: b
    text: 'N’asụsụ Grik: “n’ime Kraịst Jizọs.” A sụgharịrị Χριστός, nke bụ aha ọkwa, ka ọ bụrụ “Mesaịa.”'
    reason: alternative_reading
  - marker: c
    text: A pụkwara ịsụ ya, “n’ihe ndị gbasara Chineke” ma ọ bụ “n’okwu ndị metụtara Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: enwere m
  rationale: Ọ bụ ngwaa dị n’oge ugbu a, onye mbụ otu; “enwere m” na-egosipụta okwu Pọl n’ụzọ kwụ ọtọ ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: οὖν
  choice: N’ihi ya
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya; “N’ihi ya” na-edobe njikọ echiche ahụ nke ọma.
- source_word: καύχησιν
  choice: ihe mere m ga-eji nya isi
  rationale: Aha okwu ahụ nwere ike ịpụta ịnya isi n’onwe ya ma ọ bụ ihe ndabere e ji anya isi. Nkebiokwu a na-enye Igbo ebumpụta ụwa ma na-egosipụta echiche nke inwe ihe mere e ji anya isi, n’enweghị ikpochapụ isi echiche nke ịnya isi.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Jizọs Onye E Tere Mmanụ
  rationale: “N’ime” na-edobe ἐν dị ka ọnọdụ njikọ ma ọ bụ ịdị n’otu, kama ime ya naanị ihe e ji arụ ọrụ. Χριστός bụ aha ọkwa ebe a, ya mere a sụgharịrị ya “Onye E Tere Mmanụ,” ebe Jizọs bụ aha onye.
- source_word: τὰ πρὸς τὸν θεόν
  choice: n’ihe ndị metụtara Chineke
  rationale: Nkebiokwu Grik a sara mbara ma na-ekwu maka ihe gbasara Chineke. Nsụgharị a anaghị akpọchibido ya naanị n’ọrụ nchụàjà ma ọ bụ n’otu ụdị ije ozi.
- source_word: θεόν
  choice: Chineke
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị ma bụrụ nke a na-ejikarị asụgharị θεός n’ọnọdụ a.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Onye E Tere Mmanụ
  alternative: Kraịst; Mesaịa
  rationale: 'Χριστός ka bụ aha ọkwa nwere ihe ọ pụtara n’ebe a, ya mere a sụgharịrị ihe ọ pụtara kama ịhapụ naanị mkpụrụokwu e si n’asụsụ ọzọ webata. Usoro okwu ahụ gbanwere ntakịrị ka ọ bụrụ Igbo dị mma: “Jizọs Onye E Tere Mmanụ.”'
- issue: Ụdị ịnya isi Pọl kwuru maka ya
  choice: E debere ya dị ka ịnya isi nwere ihe ndabere n’ime Jizọs Onye E Tere Mmanụ nakwa n’ihe metụtara Chineke
  alternative: Obi ike Pọl nwere n’onwe ya; naanị ọṅụ dị ya n’obi
  rationale: Okwu ndị gbara καύχησιν gburugburu—“n’ime Jizọs Onye E Tere Mmanụ” na “n’ihe ndị metụtara Chineke”—na-akpa ókè nye ịnya isi ahụ. Nsụgharị ahụ anaghị agbanwe ya ka ọ bụrụ mpako Pọl nwere n’onwe ya, ma ọ naghịkwa ewepụ esemokwu dị n’okwu “ịnya isi.”
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Nya isi” na-edobe okwu Pọl siri ike banyere ịnya isi, ebe “ihe mere m ga-eji” na-eme ka aha okwu Grik ahụ bụrụ Igbo ebumpụta ụwa. E ji “n’ime” chekwaa echiche njikọ dị na ἐν, a sụgharịkwara Χριστός dị ka aha ọkwa.
