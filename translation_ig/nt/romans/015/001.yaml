id: ROM.15.1
reference: Romans 15:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: ig
  text: Ma anyị ndị siri ike kwesịrị iburu adịghị ike nke ndị na-adịghị ike,[a] ma ghara ịmasị onwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mmejọ nke ndị na-adịghị ike.” Okwu Grik a nwere ike ịpụta adịghị ike, oke mmadụ nwere, ma ọ bụ mmejọ; n’ebe a, o yikarịrị ka ọ na-ekwu banyere ihe akọ na uche ndị a na-ekweghị ha mee, ma ọ bụ oke ha nwere, dịka a tụlere n’isiakwụkwọ gara aga.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: anyị ... kwesịrị
  rationale: “Kwesịrị” na-egosi ibu ọrụ omume Pọl na-akụzi n’ụzọ ndụmọdụ siri ike, n’etinyeghị ya dịka iwu kpọmkwem karịrị ụdị okwu Grik ahụ.
- source_word: δὲ
  choice: Ma
  rationale: “Ma” na-ejikọta amaokwu a na mkparịta ụka gara aga ma na-egosi ntakịrị ntụgharị; ọ naghị etinye echiche oge dịka “ugbu a.”
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: anyị ndị siri ike
  rationale: Nke a na-edobe nkwusi ike dị na “anyị” na ọdịiche dị n’etiti ndị siri ike na ndị na-adịghị ike n’ihe gbasara akọ na uche na nnwere onwe nke okwukwe.
- source_word: τὰ ἀσθενήματα
  choice: adịghị ike
  rationale: Okwu a sara mbara ma nwee ike ịpụta adịghị ike, oke mmadụ nwere, ma ọ bụ mmejọ; “adịghị ike” anaghị ebubo mmehie n’ebe ihe gbara amaokwu a gburugburu na-ekwu maka akọ na uche.
- source_word: τῶν ἀδυνάτων
  choice: nke ndị na-adịghị ike
  rationale: Ọ na-edobe ọdịiche dị n’etiti “ndị siri ike” na “ndị na-adịghị ike” nke malitere na Ndị Rom 14.
- source_word: βαστάζειν
  choice: iburu
  rationale: “Ibu” na-edobe ihe atụ nke iburu ibu onye ọzọ, kama ime ka okwu ahụ pụta nanị ịnagide ya.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: ọ bụghịkwa ime naanị ihe na-atọ anyị onwe anyị ụtọ
  rationale: Nke a bụ Igbo eke nke na-egosi na mmadụ ekwesịghị ịchọ naanị afọ ojuju nke onwe ya; “naanị” na-eme ka ọdịiche omume ahụ doo anya n’enweghị mgbanwe isi echiche.
theological_decisions:
- issue: Ihe “ndị siri ike” na “ndị na-adịghị ike” pụtara
  choice: Ndị kwere ekwe nwere ogo nnwere onwe ma ọ bụ ike akọ na uche dị iche iche
  alternative: Ndị nwere ike n’obodo na ndị na-enweghị ike, ma ọ bụ ndị gbasiri ike n’ahụ na ndị na-adịghị ike n’ahụ
  rationale: Ihe dị nso n’akwụkwọ Ndị Rom 14 metụtara esemokwu banyere nri na ụbọchị; ya mere, ndụmọdụ a bụ ka ndị nwere nnwere onwe karịa kwado ndị akọ na uche ha nwere oke karịa.
- issue: Uru omume nke βαστάζειν
  choice: Iburu adịghị ike ha, ya bụ ịkwado ha ma were ibu ha n’isi
  alternative: Naanị ịnagide ha
  rationale: Ihe atụ nke “ibu” nwere echiche miri emi karịa nnagide nkịtị ma kwekọọ n’ịkpọ oku Pọl ka ndị siri ike ghara ime ihe ga-atọ naanị onwe ha ụtọ.
translation_notes:
  register: Ejiri Standard Igbo dị ugbu a, nke nwere ugwu ma dị mfe nghọta. Nsụgharị ahụ na-edobe ihe atụ nke “iburu,” ọdịiche siri ike/adịghị ike, na obosara nghọta nke τὰ ἀσθενήματα. Akara ndetu [a] dị n’ahịrị isi.
