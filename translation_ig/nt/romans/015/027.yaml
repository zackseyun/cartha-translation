id: ROM.15.27
reference: Romans 15:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: ig
  text: N’ihi na ha ji obi ụtọ mee ya, ha ji ha ụgwọkwa. N’ihi na ọ bụrụ na ndị mba ọzọ[a] nwetara oke n’ihe ime mmụọ ha[b], ha kwesịkwara iji ihe onwunwe jeere ha ozi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.” N’ebe a, ọ na-ezo aka na ndị na-abụghị ndị Juu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ngọzi ime mmụọ ha.” N’ụzọ nkịtị, asụsụ Grik kwuru “ihe ime mmụọ ha.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “n’ihe ndị metụtara anụ ahụ”; n’ebe a, ọ pụtara iji ihe onwunwe ma ọ bụ enyemaka anụ ahụ jeere ha ozi, n’ụzọ dị iche n’ihe ime mmụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: ha ji obi ụtọ mee ya
  rationale: Nke a na-egosi ma obi ụtọ ha nwere ime ya ma mkpebi afọ ofufo ha mere; “ya” na-ezo aka n’onyinye e kwuru okwu ya n’amaokwu bu ụzọ.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: ha bụkwa ndị ji ha ụgwọ
  rationale: Nke a na-edobe echiche nke ibu ọrụ ma ọ bụ ụgwọ omume Pọl na-ekwu maka ya, n’asụsụ Igbo doro anya.
- source_word: τὰ ἔθνη
  choice: ndị mba ọzọ
  rationale: N’ebe a, okwu ahụ na-ezo aka na ndị na-abụghị ndị Juu, ọ bụghị nanị mba ndọrọ ndọrọ ọchịchị.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: ihe ime mmụọ ha
  rationale: Nke a na-anọ nso n’ụdị okwu Grik ahụ ma ghara itinye “ngọzi” dị ka aha nke na-adịghị n’ederede.
- source_word: ἐκοινώνησαν
  choice: sonyere n’iketa
  rationale: Nkebiokwu a na-egosi iso ndị ọzọ nwee oke ma ọ bụ iketa ihe ha nwere.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: iji ihe onwunwe
  rationale: N’ọnọdụ onyinye ego a, okwu ahụ na-ezo aka n’ihe a na-eji egbo mkpa anụ ahụ ma ọ bụ ihe a na-ahụ anya, ọ bụghị n’omume mmehie.
- source_word: λειτουργῆσαι
  choice: jeere ha ozi
  rationale: Nke a na-egosi ọrụ enyemaka e ji nsọpụrụ na ibu ọrụ rụọ, n’enweghị echiche na ọ bụ naanị ọrụ ndị ụkọchukwu.
theological_decisions:
- issue: Ihe σαρκικοῖς pụtara mgbe e jiri ya tụnyere πνευματικοῖς
  choice: ihe onwunwe
  alternative: ihe nke anụ ahụ
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ onyinye maka ndị nsọ nọ na Jerusalem; ya mere okwu ahụ pụtara ihe e ji enyere mmadụ aka n’ụzọ anụ ahụ ma ọ bụ ihe onwunwe, ọ bụghị “anụ ahụ” dị ka ọchịchọ mmehie.
- issue: Ndị αὐτῶν / αὐτοῖς na-ezo aka na ha
  choice: ndị kwere ekwe bụ́ ndị Juu nọ na Jerusalem
  alternative: Izrel n’ozuzu ya
  rationale: N’amaokwu 25–26, ndị a ga-enyere bụ ndị nsọ nọ na Jerusalem. Echiche Pọl metụtara ụgwọ ndị mba ọzọ ji ndị Juu n’akụkọ nzọpụta, ma n’ebe a nnọchiaha ndị ahụ kacha nso na-ezo aka n’ebe ndị kwere ekwe nọ na Jerusalem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ndị mba ọzọ” bụ okwu a na-aghọta nke ọma maka ndị na-abụghị ndị Juu; “ihe onwunwe” na-ezere nghọtahie na okwu ahụ pụtara anụ ahụ mmehie, ebe nkọwa ala peeji na-edobe ụdị okwu Grik ahụ.
