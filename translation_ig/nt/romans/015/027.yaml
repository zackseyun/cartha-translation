    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “n’ihe ndị metụtara anụ ahụ”; n’ebe a, ọ pụtara iji ihe onwunwe ma ọ bụ enyemaka anụ ahụ jeere ha ozi, n’ụzọ dị iche n’ihe ime mmụọ.
