id: ROM.15.18
reference: Romans 15:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: ig
  text: N’ihi na agaghị m anwa ikwu ihe ọ bụla ma e wezụga ihe Mesaịa rụzuru site n’aka m, site n’okwu na n’omume, iji mee ka ndị mba ọzọ[a] rubere isi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “mba dị iche iche.”
    reason: lexical_alternative
  - marker: b
    text: 'A pụkwara ịsụgharị ya: “Agaghị m anwa ikwu ihe ọ bụla ma e wezụga ihe Mesaịa rụzuru site n’aka m.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: agaghị m anwa anwa
  rationale: Ọdịnihu ya na οὐ na-egosi njide Pọl tinyere onwe ya; okwu a na-echekwa echiche nke ‘ịkata obi’ ma na-ada nke ọma n’Igbo.
- source_word: τι λαλεῖν ... ὧν οὐ κατειργάσατο
  choice: ikwu ihe ọ bụla ma e wezụga ihe ... rụzuru
  rationale: Usoro Grik a na-amachi ihe Pọl ga-ekwu naanị n’ihe Mesaịa rụrụ; ‘ma e wezụga’ na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: Χριστὸς
  choice: Mesaịa
  rationale: N’ebe a, okwu ahụ na-arụ ọrụ dị ka utu aha nke onye Chineke tere mmanụ, ọ bụghị naanị aha nkịtị.
- source_word: δι’ ἐμοῦ
  choice: site n’aka m
  rationale: Ọ na-echekwa Mesaịa dị ka onye bụ isi na-arụ ọrụ, ebe Pọl bụ onye o ji rụọ ya.
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: iji mee ka ndị mba ọzọ rubere isi
  rationale: Ntụgharị ebumnuche a bụ nke e kere eke n’Igbo ma na-echekwa echiche nke irube isi sitere n’etiti ndị na-abụghị ndị Juu.
- source_word: λόγῳ καὶ ἔργῳ
  choice: site n’okwu na n’omume
  rationale: Ọ na-egosi ụzọ e si rụọ ọrụ ahụ—ma site n’ihe e kwuru ma site n’ihe e mere.
theological_decisions:
- issue: Ntụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: A họọrọ ‘Mesaịa’ iji mee ka ọrụ ya dị ka utu aha pụta ìhè, n’enweghị itinye nkọwa otu ụka pụrụ iche.
- issue: Ihe ἐθνῶν pụtara
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: N’arụmụka Pọl n’akwụkwọ Ndị Rom, ọ na-abụkarị ndị na-abụghị ndị Juu; e debere ụzọ ọzọ n’ala peeji n’ihi na ‘mba dị iche iche’ ka bụ ezi nghọta okwu ahụ.
- issue: Mmekọrịta λόγῳ καὶ ἔργῳ na ahịrịokwu ahụ
  choice: jikọta ya na ụzọ Mesaịa si rụọ ọrụ site n’aka Pọl
  alternative: ịgụ ya dịka akụkụ nke ihe Pọl na-agaghị anwa ikwu
  rationale: Nhazi ahịrịokwu na ihe ndị gbara ya gburugburu na-akwado njikọ ya na ọrụ e rụrụ, ma ederede Grik na-enye ohere maka nghọta ọzọ; e gosipụtara ya n’ala peeji.
translation_notes:
  register: Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. ‘Rubere isi’ kwekọrọ na isiokwu irube isi n’akwụkwọ Ndị Rom; ‘okwu na omume’ bụ ụzọ nkịtị ma doo anya isi kwuo λόγος na ἔργον.
