id: ROM.15.24
reference: Romans 15:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: ig
  text: mgbe ọ bụla m ga-aga Spen[a]—n’ihi na ana m atụ anya na, ka m na-agafe, m ga-ahụ unu, ka unu zigakwa m n’ụzọ m gaa ebe ahụ[b], ma ọ bụrụ na m buru ụzọ nweta afọ ojuju n’ebe unu nọ ruo n’ókè ụfọdụ[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “mgbe m ga-aga Spen.” Usoro okwu Grik ahụ na-egosi oge n’ọdịnihu nke a na-akọwaghị kpọmkwem.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụ ya, “ka unu nyere m aka n’ụzọ m na-aga ebe ahụ.” Okwu ahụ nwere ike ịpụta iziga ma ọ bụ inyere onye njem aka ịga n’ihu, ọbụnadị iso ya gaa n’ụzọ ụfọdụ.
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, Grik ahụ sịrị, “ma ọ bụrụ na m ejuwo n’ebe unu nọ n’otu akụkụ.” O yikarịrị ka ọ na-ekwu banyere afọ ojuju ma ọ bụ ọṅụ Pọl ga-enweta n’iso ha nọkọọ tupu ọ gaa n’ihu; “n’otu akụkụ” nwere ike igosi na nke a ga-adị nta ma ọ bụ na ọ gaghị ezu oke.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: mgbe ọ bụla m gara
  rationale: Nkebiokwu Grik a na-egosi oge dị n’ọdịnihu nke a na-akọwaghị kpọmkwem. “Mgbe ọ bụla m gara” na-edobe echiche ahụ nke ihe ka ga-eme, n’agbanyeghị na “mgbe m gara” nwekwara ike ịpụta ya.
- source_word: Σπανίαν
  choice: Spen
  rationale: Nke a bụ aha obodo ahụ n’ụdị a na-ejikarị ya eme ihe n’Igbo.
- source_word: ἐλπίζω γὰρ
  choice: n’ihi na enwere m olileanya
  rationale: “N’ihi na” na-egosi na Pọl na-akọwa ihe o kwuru na mbụ, ebe “enwere m olileanya” na-egosi atụmanya ya nke ọchịchọ so ya.
- source_word: διαπορευόμενος
  choice: ka m na-agafe
  rationale: Nke a na-egosi na ọ ga-agafe Rom n’ụzọ ọ na-aga ebe ọzọ, n’ebughị ụzọ kwuo ogologo oge ọ ga-anọ.
- source_word: θεάσασθαι ὑμᾶς
  choice: m ga-ahụ unu
  rationale: “Ịhụ unu” bụ Igbo doro anya nke na-egosi izute ha n’onwe ya n’oge njem ahụ.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: ka unu zipụkwa m gaa n’ihu ruo ebe ahụ
  rationale: Nhọrọ a na-edobe echiche nke ndị Rom inyere Pọl aka ịga n’ihu na njem ya, ma ọ naghị ekpebi ma enyemaka ahụ bụ ego, ihe ndị dị mkpa, ma ọ bụ iso ya gaa ụfọdụ ụzọ.
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: ma ọ bụrụ na ... nwee afọ ojuju
  rationale: “Ma ọ bụrụ na” na-edobe ọnọdụ nke ihe ahụ ka ga-eme. “Nwee afọ ojuju” bụ okwu Igbo dị mfe nghọta maka ihe oyiyi Grik nke ịbụ onye e mejupụtara.
- source_word: πρῶτον
  choice: eburula ụzọ
  rationale: Nke a na-egosi na Pọl chọrọ ibu ụzọ nọnyere ha tupu ha ezipụ ya gaa n’ihu.
- source_word: ἀπὸ μέρους
  choice: ruo n’ókè ụfọdụ
  rationale: Nhọrọ a na-edobe echiche nke “n’otu akụkụ” ma ghara ikpebi ma ọ na-ekwu banyere mkpụmkpụ oge nleta ahụ ma ọ bụ afọ ojuju na-ezughị ezu.
- source_word: ὑμῶν
  choice: site n’ịnọnyere unu
  rationale: Grik ahụ kwuru ya n’ụzọ dị mkpirikpi, ma n’ọnọdụ a ọ na-ezo aka n’ọṅụ nke iso ha nọkọọ. Nhọrọ a na-eme ka Igbo bụrụ ihe mmadụ na-aghọta n’enweghị ịgbakwunye ụdị mmekọrịta pụrụ iche.
theological_decisions:
- issue: Ụdị enyemaka ndị kwere ekwe nọ na Rom ga-enye Pọl n’ụzọ ya
  choice: ka unu zipụkwa m gaa n’ihu ruo ebe ahụ
  alternative: ka unu nyere m aka n’ụzọ m na-aga ebe ahụ; ka unu soro m gaa ụfọdụ ụzọ
  rationale: Okwu Grik ahụ nwere ike ịgụnye nkwado, inye ihe ndị dị mkpa, ma ọ bụ iso onye njem gaa. Ebe amaokwu ahụ na-ekwughị kpọmkwem ụdị enyemaka ahụ, nsụgharị a hapụrụ ya ghe oghe.
- issue: Ihe afọ ojuju Pọl tụrụ anya inweta n’aka ndị Rom pụtara
  choice: nwee afọ ojuju ruo n’ókè ụfọdụ site n’ịnọnyere unu
  alternative: ka unu mejupụta m n’otu akụkụ; ka m nwetụ ọṅụ site n’iso unu nọkọọ
  rationale: Nkebiokwu ahụ na-egosi afọ ojuju ma ọ bụ ọṅụ mmekọrịta, ma “ruo n’ókè ụfọdụ” nwere ike ịkọwa oke afọ ojuju ahụ ma ọ bụ obere oge ha ga-anọkọ. A hapụrụ nghọta abụọ ahụ ka ha dị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta, sụgharịa amaokwu a. A hapụrụ ahịrị ogologo na akara ngwụcha “—” n’ihi na amaokwu ahụ bụ akụkụ nke ahịrịokwu na-aga n’ihu. E debere ihe na-edoghị anya banyere oge njem ahụ, ụdị nkwado ndị Rom ga-enye, na ihe “ruo n’ókè ụfọdụ” na-akọwa.
