revisions:
- from: Ka Chineke nke ntachi obi na agbamume mee ka unu na ibe unu nwee otu echiche[a], n'ụzọ kwekọrọ na Mezaịa Jizọs[b],
  to: Ka Chineke nke ntachi obi na agbamume mee ka unu nwee otu echiche n’etiti onwe unu[a], n’ụzọ kwekọrọ na Mesaịa Jizọs[b],
  rationale: The text is revised only to improve Standard Igbo idiom and title orthography. Footnote b is corrected to represent κατά as accordance rather than a comparison (“as Messiah Jesus is”). The final comma is retained because the Greek sentence continues into verse 6.
