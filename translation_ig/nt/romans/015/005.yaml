id: ROM.15.5
reference: Romans 15:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: ig
  text: Ka Chineke nke ntachi obi na agbamume mee ka unu nwee otu echiche n’etiti onwe unu[a], n’ụzọ kwekọrọ na Mesaịa Jizọs[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ka unu nwee otu uche” ma ọ bụ “ka unu bụrụ ndị nwere otu echiche.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị n’asụsụ Grik: “dị ka Mesaịa Jizọs si kwekọọ” ma ọ bụ “n’usoro Mesaịa Jizọs.” “Mesaịa” bụ aha utu nke Χριστός, nke pụtara “onye e tere mmanụ.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: Ka Chineke
  rationale: δέ bụ njikọ dị nro n'ebe a; a hapụrụ ya n'ekwughị okwu njikọ pụrụ iche ka ahịrịokwu ọchịchọ-ekpere ahụ daa nke ọma n'Igbo. “Ka” na-egosipụta ike ọchịchọ nke optative δῴη.
- source_word: τῆς ὑπομονῆς
  choice: nke ntachi obi
  rationale: “Ntachi obi” na-egosi ịnọgide na-eguzosi ike n'okpuru nsogbu, ọ bụghị naanị ichere nwayọọ.
- source_word: τῆς παρακλήσεως
  choice: na agbamume
  rationale: “Agbamume” na-eburu echiche nke ịkwado na ime ka mmadụ sie ike, nke dabara n'ọnọdụ amaokwu a; παράκλησις nwekwara ike ịpụta nkasi obi ma ọ bụ ndụmọdụ siri ike.
- source_word: δῴη
  choice: mee ka unu
  rationale: Ụdị optative a bụ ọchịchọ ma ọ bụ ekpere. “Mee ka unu” na-enye echiche ahụ n'Igbo dị ugbu a ma na-ejikọta ya nke ọma na omume φρονεῖν.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: nwee otu echiche
  rationale: Nhọrọ a na-echekwa echiche nke inwe otu uche ma ọ bụ otu ụzọ e si ele ihe anya, n'ekwughị na ha ga-ekwenyerịrị n'ihe niile.
- source_word: ἐν ἀλλήλοις
  choice: na ibe unu
  rationale: Nke a na-egosi na otu echiche ahụ bụ ihe dị n'etiti ndị kwere ekwe, ma na-ada nke ọma n'usoro okwu Igbo.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: n'ụzọ kwekọrọ na Mezaịa Jizọs
  rationale: κατά na-egosi ikwekọ n'ụkpụrụ ma ọ bụ n'ihe atụ. “Mezaịa” na-echekwa Χριστός dị ka utu aha, ebe “Jizọs” bụ aha.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mezaịa Jizọs
  alternative: Kraịst Jizọs
  rationale: Χριστός bụ utu aha pụtara Onye E Tere Mmanụ, ya bụ Mezaịa; “Mezaịa” na-eme ka ihe utu aha ahụ pụtara pụta ìhè kama ime ka ọ dị ka aha ezinụlọ.
- issue: Ihe τὸ αὐτὸ φρονεῖν pụtara
  choice: inwe otu echiche ma ọ bụ otu ụzọ e si ele ihe anya
  alternative: ịdị n'otu n'echiche niile n'enweghị ọdịiche ọ bụla
  rationale: Okwu Pọl na-akpọ ndị kwere ekwe ka ha nwee nkwekọrịta nke uche n'etiti onwe ha, ma ọ naghị ekwu hoo haa na ha aghaghị inwe otu echiche n'okwu niile.
- issue: Mmekọrịta nke κατὰ na Mezaịa Jizọs
  choice: n'ụzọ kwekọrọ na Mezaịa Jizọs
  alternative: dị ka Mezaịa Jizọs chọrọ
  rationale: Nhọrọ a echekwala Mezaịa Jizọs dị ka ụkpụrụ ma ghara itinye ngwaa “chọrọ,” nke adịghị n'ihe odide Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ ka bụ ọchịchọ-ekpere, e chekwakwara akara rikoma ikpeazụ n'ihi na echiche ahụ na-aga n'ihu n'amaokwu na-esote.
