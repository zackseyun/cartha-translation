id: ROM.15.19
reference: Romans 15:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: ig
  text: site n’ike nke ihe ịrịba ama na ihe ebube[a], sitekwa n’ike nke Mmụọ, nke mere na site na Jerusalem na gburugburu ya ruo Ilirikọm, ekwusawo m ozi ọma nke Mesaịa n’ụzọ zuru ezu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “site n’ike nke Mmụọ Nsọ.”'
    reason: alternative_reading
  - marker: b
    text: 'Ma ọ bụ: “emezuwo m ozi ọma nke Mesaịa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: site n’ike nke
  rationale: Nkebiokwu a na-egosi ụzọ ma ọ bụ ike e ji rụọ ọrụ ahụ; “site n’ike nke” bụ Igbo doro anya nke na-echekwa nkwughachi Pọl.
- source_word: σημείων καὶ τεράτων
  choice: ihe ịrịba ama na ihe ebube
  rationale: Nke a bụ ụzọ Akwụkwọ Nsọ si ejikọta ọrụ pụrụ iche ndị na-egosi ọrụ Chineke.
- source_word: πνεύματος
  choice: Mmụọ
  rationale: N’ọnọdụ a ọ kacha yie ka ọ na-ezo aka na Mmụọ Nsọ, ma e tinyeghị “Nsọ” n’ahụ́ ederede n’ihi na okwu Grik ekwughị ya kpọmkwem.
- source_word: ὥστε
  choice: nke mere na
  rationale: Ọ na-ewebata ihe si n’ọrụ ahụ nwere ike pụta.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: malite na Jerusalem, gafee ógbè niile gbara ya gburugburu
  rationale: Nke a na-egosi njem ozi ahụ malitere na Jerusalem wee gbasaa n’ógbè ndị gbara ya gburugburu, n’ụzọ Igbo na-aghọta ngwa ngwa.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: ruo Ilirikọm
  rationale: “Ruo” na-egosi oke ebe ozi Pọl ruru.
- source_word: πεπληρωκέναι
  choice: ekwusawo m ... n’ụzọ zuru ezu
  rationale: N’ọnọdụ a, ngwaa ahụ na-egosi iweta ozi ọma n’ụzọ zuru oke n’ógbè ahụ; ntụgharị a bụ nke dị ndụ n’Igbo ma na-echekwa echiche nke izu ezu.
- source_word: τὸ εὐαγγέλιον
  choice: ozi ọma
  rationale: “Ozi ọma” bụ ntụgharị Igbo doro anya ma bụrụkwa nke ndị na-agụ Akwụkwọ Nsọ maara.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka aha ọkwa ahụ e tere mmanụ, ya mere “Mesaịa” na-egosipụta ihe ọ pụtara.
theological_decisions:
- issue: Ihe πνεύματος na-ezo aka na ya
  choice: Mmụọ, ya bụ Mmụọ Nsọ
  alternative: mmụọ n’echiche sara mbara, ma ọ bụ “Mmụọ Nsọ” kpọmkwem
  rationale: Ọnọdụ okwu banyere ọrụ ozi, ihe ịrịba ama, na ihe ebube na-akwado na ọ bụ Mmụọ Nsọ; ma “Mmụọ” anaghị agbakwụnye okwu na-adịghị na Grik.
- issue: Ihe πεπληρωκέναι τὸ εὐαγγέλιον pụtara
  choice: ekwusawo m ozi ọma n’ụzọ zuru ezu
  alternative: emezuwo m ozi ọma
  rationale: Ihe a na-ekwu ebe a bụ ime ka ozi ọma gbasaa ma ruo n’uju n’ógbè ahụ. “Emezuwo m ozi ọma” dị nso n’usoro mkpụrụokwu Grik, ma ọ nwere ike iduhie onye Igbo ka o chee na Pọl mezuru ọdịnaya ozi ọma ahụ n’onwe ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke nwere nsọpụrụ ma dị mfe nghọta. E chekwara nkwughachi “site n’ike” na oke ala nke ahịrịokwu ahụ, ma hazie usoro ya ka ọ daa nke ọma n’Igbo.
