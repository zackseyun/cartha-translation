- from: site n’ike nke ihe ịrịba ama na ihe ebube[a], sitekwa n’ike nke Mmụọ, nke mere na, malite na Jerusalem, gafee ógbè niile gbara ya gburugburu ruo Ilirikọm, ekwusawo m ozi ọma nke Mesaịa n’ụzọ zuru ezu[b],
  to: site n’ike nke ihe ịrịba ama na ihe ebube[a], sitekwa n’ike nke Mmụọ, nke mere na site na Jerusalem na gburugburu ya ruo Ilirikọm, ekwusawo m ozi ọma nke Mesaịa n’ụzọ zuru ezu[b],
