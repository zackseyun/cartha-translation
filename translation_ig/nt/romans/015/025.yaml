  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: ig
  text: Ma ugbu a, ana m aga Jerusalem ijere ndị nsọ ozi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị okwu Grik ahụ dịka “na-ejere ndị nsọ ozi” ma ọ bụ “na-eburu ndị nsọ enyemaka.” Ọ nwere ike ịpụta ije ozi bara uru; n’ebe a, o yikarịrị ka ọ na-ekwu maka ibuga enyemaka a chịkọtara maka ndị kwere ekwe nọ na Jerusalem (lee Ndị Rom 15:26).
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ma ugbu a
  rationale: “Ugbu a” na-egosi oge dị ugbu a nke ọma, ebe “ma” na-echekwa ntakịrị ntụgharị ma ọ bụ ọdịiche δέ na-eweta n’okwu ahụ.
- source_word: πορεύομαι
  choice: ana m aga
  rationale: Nke a bụ ụzọ Igbo dị mfe ma kwekọọ n’ụdị ngwaa ugbu a nke na-egosi njem Pọl na-aga ma ọ bụ nke ọ na-ezube ịga.
- source_word: εἰς Ἰερουσαλὴμ
  choice: Jerusalem
  rationale: N’usoro Igbo, ngwaa “ịga” nwere ike iso aha ebe ozugbo n’enweghị ịgbakwunye okwu ọzọ; ọ na-egosi Jerusalem dị ka ebe njem ahụ na-aga.
- source_word: διακονῶν
  choice: ijere … ozi
  rationale: Nkebiokwu a na-egosi ọrụ enyemaka ma ọ bụ ije ozi, ma na-ejikọkwa njem ahụ na ebumnuche ya n’Igbo eke. Ọ naghị eme ka okwu ahụ bụrụ ọkwa ọchịchị ụka.
- source_word: τοῖς ἁγίοις
  choice: ndị nsọ
  rationale: “Ndị nsọ” na-echekwa okwu Pọl ji akpọ ndị kwere ekwe dị ka ndị e doro nsọ, kama ịtụgharị ya n’ụzọ nkọwa sara mbara dị ka “ndị Chineke.”
theological_decisions:
- issue: Ndị okwu ahụ bụ “ndị nsọ” na-ezo aka na ha
  choice: E debere “ndị nsọ” n’ahịrị bụ isi; n’ọnọdụ gbara ya gburugburu, ha bụ ndị kwere ekwe nọ na Jerusalem, karịchaa ndị ogbenye n’etiti ha.
  alternative: Ịsụgharị ya ozugbo dịka “ndị kwere ekwe nọ na Jerusalem” ma ọ bụ “ndị Chineke.”
  rationale: Ihe odide Grik n’onwe ya kwuru naanị “ndị nsọ.” Ịhapụ ya otu a na-echekwa okwu ahụ na ihe ọ pụtara n’ụzọ okpukpe, ebe amaokwu na-esote na-eme ka ndị a na-ezo aka na ha doo anya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma nwee ugwu. “Ijere ndị nsọ ozi” bụ okwu ndị nkịtị ga-aghọta, ma ọ na-echekwa obosara pụtara nke διακονῶν; nkọwa ala peeji na-akọwa na o nwere ike ịbụ ibuga enyemaka.
