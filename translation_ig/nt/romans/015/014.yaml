id: ROM.15.14
reference: Romans 15:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: ig
  text: Ma mụ onwe m kwenyesiri ike banyere unu, ụmụnna m[a], na unu onwe unu jukwara n’ịdị mma, jupụtakwara n’ọmụma niile, nweekwa ike ịdụ ibe unu ọdụ.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a sụgharịrị “ụmụnna” nwere ike ịbụ aha e ji akpọ ndị otu okwukwe niile, ma ndị nwoke ma ndị nwanyị.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịkụziri ibe unu ihe,” “ịgbazi ibe unu,” ma ọ bụ “ịdọ ibe unu aka ná ntị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: kwenyesiri ike
  rationale: Oge perfect ahụ na-egosi nkwenye siri ike nke ka dị ugbu a; okwu Igbo a na-egosipụta ọnọdụ ahụ n'ụzọ doro anya.
- source_word: δέ
  choice: Ma
  rationale: N’ebe a, δέ na-egosi ntụgharị dị nro n’okwu Pọl, ọ bụghị nnukwu mmegide.
- source_word: ἀδελφοί μου
  choice: ụmụnna m
  rationale: Nke a bụ ụzọ nkwanye ùgwù na nke e ji akpọ ndị otu okwukwe n’Igbo; ihe odide ala peeji kọwara na okwu Grik ahụ nwere ike ịgụnye ma ndị nwoke ma ndị nwanyị.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: mụ onwe m
  rationale: Ọ na-echekwa nkwusi ike dị na καὶ αὐτὸς ἐγώ n’ụzọ Igbo dị ndụ.
- source_word: περὶ ὑμῶν
  choice: banyere unu
  rationale: Ntụgharị kwụ ọtọ ma bụrụkwa okwu Igbo a na-asụkarị maka περί na genitive.
- source_word: καὶ αὐτοὶ
  choice: unu onwe unu jukwara
  rationale: “Onwe unu” na-echekwa nkwusi ike nke αὐτοί, “-kwara” na-echekwakwa echiche mgbakwunye nke καί.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: jukwara n’ịdị mma
  rationale: Ọ na-egosipụta ịbụ ndị jupụtara n’omume ọma n’enweghị itinye nkọwa ụka ọzọ.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: juputa n’ihe ọmụma niile
  rationale: Ọ na-echekwa ọnọdụ zuru ezu nke perfect participle na obosara nke πάσης γνώσεως.
- source_word: δυνάμενοι
  choice: nweekwa ike
  rationale: Ọ na-egosipụta ikike sitere n’àgwà na ihe ọmụma ndị e kwuru tupu ya.
- source_word: ἀλλήλους
  choice: ibe unu
  rationale: Nke a bụ okwu nnọchianya Igbo kwesịrị ekwesị maka mmekọrịta mmadụ na ibe ya.
- source_word: νουθετεῖν
  choice: ịdụ ibe unu ọdụ
  rationale: “Ịdụ ọdụ” na-agụnye izi ihe, inye ndụmọdụ, na mgbazi; ya mere ọ na-echekwa ma akụkụ nkuzi ma akụkụ ịdọ aka ná ntị nke ngwaa Grik ahụ.
theological_decisions:
- issue: Okwu ἀδελφοί nke e ji akpọ ọgbakọ nwere ma ndị nwoke ma ndị nwanyị
  choice: ụmụnna m
  alternative: ụmụnne m ndị nwoke na ndị nwanyị
  rationale: A hapụrụ ụdị okwu mkpokọta nke dị n’asụsụ mmalite, ebe ihe odide ala peeji mere ka o doo anya na ndị inyom sokwa ná ndị a na-akpọ.
- issue: Oke echiche dị na νουθετεῖν
  choice: ịdụ ibe unu ọdụ
  alternative: ịkụziri ibe unu ihe; ịdọ ibe unu aka ná ntị
  rationale: Ngwaa ahụ nwere ike ịpụta nkuzi na-eweta mgbazi, ndụmọdụ siri ike, ma ọ bụ ịdọ aka ná ntị. “Ịdụ ọdụ” na-edobe obosara a, ebe ihe odide ala peeji na-egosi ụzọ ndị ọzọ e nwere ike isi ghọta ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. Ahịrịokwu ahụ debere nkwusi ike dị na “mụ onwe m” na “unu onwe unu,” ma zere okwu ụka pụrụ iche nke otu okpukpe.
