  to: Ma mụ onwe m kwenyesiri ike banyere unu, ụmụnna m[a], na unu onwe unu jukwara n’ịdị mma, jupụtakwara n’ọmụma niile, nweekwa ike ịdụ ibe unu ọdụ.[b]
  rationale: Only the second fullness expression has been corrected to the natural completed-state form “jupụtakwara,” matching πεπληρωμένοι. “Ọmụma niile” is a more direct and idiomatic rendering of πάσης γνώσεως. The source’s emphasis, reciprocal sense, and lexical ambiguity remain intact.
