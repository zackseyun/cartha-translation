  variant: Standard Igbo
source:
  edition: SBLGNT
  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: ig
  text: Ma ugbu a, enweghịzi m ohere n’ógbè ndị a[a], ma agụsiwo m agụụ ike ịbịakwute unu kemgbe ọtụtụ afọ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ebe” ma ọ bụ “ohere” n’ógbè ndị a. Okwu Grik a nwere ike izo aka n’enweghịzi ohere ma ọ bụ obosara maka ọrụ ozi n’ebe ndị a, ọ bụghị nanị n’enweghị ebe nkịtị.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Ma ugbu a
  rationale: Na-egosi mgbanwe Pọl mere gaa n’ọnọdụ ya ugbu a, ma na-edobe ike njikọ nke δέ n’Igbo dị mfe.
- source_word: μηκέτι τόπον ἔχων
  choice: ebe ọ bụ na ọ dịkwaghị ohere fọdụrụ m ịrụ ọrụ
  rationale: N’ọnọdụ a, τόπος abụghị nanị ebe nkịtị; ọ na-ezo aka n’ohere ma ọ bụ ọrụ ozi fọdụrụ. Nkọwa a na-eme ka ihe Pọl kwuru doo anya n’Igbo n’enweghị ikwu na ohere ọ bụla n’ụzọ zuru ezu adịghị.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: n’ógbè ndị a
  rationale: κλίμασι na-ezo aka n’ógbè ma ọ bụ mpaghara ala; “ógbè ndị a” bụ okwu Igbo a na-aghọta ngwa ngwa.
- source_word: ἐπιποθίαν δὲ ἔχων
  choice: ebe ọ dịkwala ... m na-agụsi agụụ ike
  rationale: Na-egosipụta ọchịchọ siri ike nke nọgidere ruo ogologo oge ma na-edobe njikọ dị n’etiti nkebiokwu abụọ ahụ.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: ịbịakwute unu
  rationale: Ọ bụ nsụgharị kwụ ọtọ ma bụrụkwa Igbo eke maka ọchịchọ ịga bịakwute ndị a na-agwa okwu.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: ọ dịkwala ọtụtụ afọ
  rationale: Na-enye echiche oge sitere n’oge gara aga ruo ugbu a n’Igbo a na-asụ ugbu a.
theological_decisions:
- issue: Ihe τόπον ἔχων pụtara n’ihe gbasara ọrụ Pọl
  choice: ohere fọdụrụ m ịrụ ọrụ
  alternative: ebe m ga-anọ
  rationale: Ihe gbara amaokwu a gburugburu na-akwado echiche nke ohere ma ọ bụ akparamaagwa ọrụ ozi, ọ bụghị na Pọl enweghị ebe nkịtị ọ ga-anọ. E debere ihe ọzọ ahụ na nkọwa ala peeji iji ghara izochi obosara okwu Grik ahụ.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “ohere fọdụrụ m ịrụ ọrụ” iji mee ka akpaalaokwu Grik doo anya, ebe nkọwa ala peeji na-echekwa nghọta sara mbara ya. Akara rikoma ikpeazụ na-egosi na ahịrịokwu ahụ gara n’ihu n’amaokwu na-esote.
