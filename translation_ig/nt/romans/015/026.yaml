  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: ig
  text: N’ihi na o mere ndị Masedonia na ndị Akaịa obi ụtọ inye onyinye ụfọdụ maka ndị ogbenye nọ n’etiti ndị nsọ nọ na Jeruselem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ime ụdị ikekọrịta ụfọdụ”; okwu Grik ahụ na-emesi ikekọrịta ma ọ bụ mmekọrịta e gosipụtara site n’inye nkwado ihe onwunwe ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: ji obi ụtọ kpebie
  rationale: Nke a na-egosipụta ma mkpebi afọ ofufo ma obi ụtọ dị n'ime εὐδοκέω, kama ịsụgharị ya dị ka naanị ‘kpebie.’
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ewebata nkọwa ma ọ bụ ihe kpatara okwu bu ya ụzọ.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: ndị Masedonia na ndị Akaịa
  rationale: Aha mpaghara ndị ahụ nọchiri anya ọgbakọ Ndị Kraịst bi n’ebe ahụ. Ịgbakwunye ‘ndị’ na-eme ka metonymy ahụ doo anya ma bụrụ Igbo eke, n’enweghị ịgbakwunye ‘ụka’ nke Grik ekwughị kpọmkwem.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: inye onyinye
  rationale: N’okwu gbasara nchịkọta ego a, akpaalaokwu ahụ pụtara isonye n’ịkekọrịta ihe onwunwe site n’onyinye. Igbo a bụ nke doro anya ma na-echekwa echiche nkwado ihe onwunwe; nkọwa ala peeji na-egosi nuance nke mmekọrịta na ịkekọrịta ihe.
- source_word: εἰς τοὺς πτωχοὺς
  choice: maka ndị ogbenye
  rationale: εἰς na-egosi ndị onyinye ahụ ga-abara uru; ‘maka’ bụ ụzọ Igbo dị mfe ma ziri ezi isi kwuo ya.
- source_word: τῶν ἁγίων
  choice: nọ n’etiti ndị nsọ
  rationale: Genitive ahụ na-akọwa ndị ogbenye dị ka akụkụ nke ndị nsọ, ọ bụghị na ndị nsọ niile bụ ndị ogbenye.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: bi na Jerusalem
  rationale: Ọ na-akọwa ndị nsọ ahụ dị na Jerusalem n’ụzọ Igbo eke.
theological_decisions:
- issue: Nsụgharị ἅγιοι n’akwụkwọ Pọl
  choice: ndị nsọ
  alternative: ndị Chineke; ndị e doro nsọ
  rationale: ‘Ndị nsọ’ na-echekwa okwu Pọl ji akpọ ndị kwere ekwe dịka otu ìgwè, n’enweghị ime ka ọ bụrụ naanị ndị e mesịrị kwupụtara dịka ndị nsọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ji obi ụtọ kpebie’ na-echekwa ma afọ ojuju ma mkpebi; ‘ndị Masedonia na ndị Akaịa’ na-eme ka iji aha mpaghara nọchite anya ndị bi na ha bụrụ ihe doro anya n’Igbo.
