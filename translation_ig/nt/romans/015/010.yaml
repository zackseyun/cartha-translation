- from: Ọzọkwa, ọ na-ekwu, “Ụmụ mba ọzọ, soronụ ndị ya ṅụrịa ọṅụ.”[a]
  to: Ọzọkwa, ọ na-ekwu, “Ndị mba ọzọ, soronụ ndị ya n’ịṅụrị ọṅụ.”[a]
  rationale: The revision replaces a potentially ambiguous construction with one that explicitly expresses rejoicing together with God's people, as required by μετά with the genitive. It also uses the more idiomatic Standard Igbo term for Gentiles. The alternative 'nations' remains available in the footnote, and the anchor is retained.
