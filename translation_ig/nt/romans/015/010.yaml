  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: ig
  text: Ọzọkwa, ọ na-ekwu, “Ndị mba ọzọ, soronụ ndị ya n’ịṅụrị ọṅụ.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mba dị iche iche, soronụ ndị ya n’ịṅụrị ọṅụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: Ọzọkwa
  rationale: N’usoro e si ewebata ihe e hotara n’Akwụkwọ Nsọ, okwu a na-egosi na a na-agbakwụnye ihe ọzọ e dere.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: E debere oge ugbu a nke ngwaa Grik ahụ, nke na-egosi na Akwụkwọ Nsọ ka na-ekwu okwu ugbu a; onye a na-ekwu maka ya ka a hapụrụ dịka onye nwoke, dị ka usoro okwu Grik si dị.
- source_word: Εὐφράνθητε
  choice: ṅụrịa ọṅụ
  rationale: Nke a bụ iwu a gwara ọtụtụ mmadụ ka ha nwee ọṅụ; ‘ṅụrịa ọṅụ’ bụ okwu Igbo doro anya, dịkwa ùgwù.
- source_word: ἔθνη
  choice: Ụmụ mba ọzọ
  rationale: N’ebe a, okwu ahụ na-ezo aka ná ndị na-abụghị ndị Juu n’arụmụka Pọl banyere ịdị n’otu ha na ndị Chineke; ‘mba dị iche iche’ ka bụkwa ihe okwu ahụ nwere ike ịpụta, ya mere e tinyere ya n’ala ala peeji.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: soronụ ndị ya
  rationale: ‘Soronụ’ na-egosipụta mkpakọrịta nke μετά tinyere iwu ahụ n’ụzọ Igbo dị eke; ‘ndị ya’ na-echekwa ihe λαός αὐτοῦ pụtara n’ebughị ụzọ kọwaa ha kpọmkwem dịka Izrel.
- source_word: λαοῦ
  choice: ndị
  rationale: N’Igbo, ‘ndị ya’ bụ ụzọ dị eke isi kwuo ‘his people’ n’ebe a; ọ naghị etinye nkọwa ‘ndị Izrel’ nke na-adịghị n’okwu Grik kpọmkwem.
theological_decisions:
- issue: Ntụgharị ἔθνη n’ihe Pọl hotara banyere ịdị n’otu ndị Juu na ndị na-abụghị ndị Juu
  choice: Ụmụ mba ọzọ
  alternative: mba dị iche iche
  rationale: Ihe gbara amaokwu a gburugburu na-ekwusi ike na ndị na-abụghị ndị Juu sonyere ndị Chineke n’ito Chineke. ‘Ụmụ mba ọzọ’ na-eme ka isi okwu ahụ doo anya, ebe nkọwa ala ala peeji na-echekwa nghọta sara mbara nke ‘mba dị iche iche.’
- issue: Onye bụ isiokwu nke λέγει
  choice: ọ na-ekwu
  alternative: Akwụkwọ Nsọ na-ekwu
  rationale: Grik hapụrụ isiokwu ahụ n’ime ngwaa; ‘ọ na-ekwu’ na-edobe usoro ahụ n’enweghị itinye ‘Akwụkwọ Nsọ’ n’ahịrịokwu, ọ bụ ezie na nke ahụ bụ nghọta ọzọ kwere omume.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Ụmụ mba ọzọ’ mee ka ọdịiche dị n’etiti ndị Juu na ndị na-abụghị ndị Juu pụta ìhè; a chekwara ‘mba dị iche iche’ n’ala ala peeji. E tinyere akara [a] n’isi ederede dịka achọrọ.
