id: ROM.15.7
reference: Romans 15:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: ig
  text: Ya mere, nabatanu ibe unu, dịka Kraịst nabatakwara unu, maka otuto Chineke.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n'arụmụka bu ụzọ; nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị egosi njikọ ahụ.
- source_word: προσλαμβάνεσθε
  choice: na-anabatakwanụ
  rationale: Iwu a na-akpọ ndị kwere ekwe ka onye ọ bụla jiri obi nabata ibe ya. ‘Nabata’ na-egosi nnabata mmadụ n'ime mmekọrịta, ma na-edobe ike okwu Grik ahụ.
- source_word: ἀλλήλους
  choice: ibe unu
  rationale: Nke a na-egosipụta omume onye na ibe ya n'ụzọ nkịtị n'Igbo.
- source_word: καθὼς καὶ
  choice: dịka ... kwara
  rationale: ‘Dịka’ na-edobe ntụnyere ahụ, ebe ‘-kwara’ na-egosipụta καί nke pụtara ‘ọzọkwa’.
- source_word: ὁ Χριστὸς
  choice: Kraịst
  rationale: ‘Kraịst’ bụ aha-ọkwá e ji mara Mesaya n'Igbo Ndị Kraịst, ma ọ naghị eme ka ọ bụrụ naanị aha onwe onye n'ahịrịokwu a.
- source_word: προσελάβετο
  choice: nabatakwara
  rationale: E ji otu mgbọrọgwụ okwu ahụ e ji sụgharịa προσλαμβάνεσθε mee ihe iji chekwaa ntụnyere Pọl mere n'etiti ihe Kraịst mere na ihe ndị kwere ekwe kwesịrị ime.
- source_word: ὑμᾶς
  choice: unu
  rationale: Ọ bụ nnọchiaha onye nke abụọ n'ụbara, nke ‘unu’ na-anọchi anya ya kpọmkwem.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: ka e wee nye Chineke otuto
  rationale: Nke a na-egosipụta ebumnuche ma ọ bụ ihe omume ahụ na-arụpụta, nke εἰς nwere ike ịpụta n'ebe a, n'Igbo dị mfe ma doo anya.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Kraịst
  alternative: Mesaya ahụ
  rationale: Standard Igbo na-eji ‘Kraịst’ dị ka aha-ọkwá a maara nke ọma. ‘Mesaya ahụ’ ga-ekwe omume, ma ọ nwere ike ịdị arọ karịa n'ahịrịokwu a; nhọrọ a anaghị ewepụ ihe aha-ọkwá ahụ pụtara.
- issue: Ihe προσλαμβάνομαι pụtara n'ime ọgbakọ
  choice: na-anabatakwanụ ibe unu
  alternative: na-anara ibe unu / na-ekwenyekwanụ ibe unu
  rationale: ‘Nabata’ na-egosi nnabata mmadụ n'ụzọ na-ekpo ọkụ na nke mmekọrịta, na-enweghị itinye nkọwa ozizi pụrụ iche.
- issue: Ọrụ εἰς δόξαν τοῦ θεοῦ
  choice: ka e wee nye Chineke otuto
  alternative: nke na-ewetara Chineke otuto
  rationale: εἰς nwere ike igosi ebumnuche ma ọ bụ nsonaazụ. Isi nsụgharị na-ekwupụta ebumnuche n'ụzọ nkịtị, ebe ihe odide ala ala na-echekwa ohere nke nsonaazụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, mee ihe. ‘Na-anabatakwanụ’ na ‘nabatakwara’ na-echekwa otu mgbọrọgwụ okwu dị na Grik. Akara [a] dị n'isi ederede ma kwekọọ na nkọwa ala ala.
