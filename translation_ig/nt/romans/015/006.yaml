revisions:
- from: ka unu wee jiri otu obi na otu ọnụ[a] na-enye Chineke na Nna nke Onyenwe anyị Jizọs bụ Mesaya[b] otuto.
  to: ka unu wee jiri otu obi na otu ọnụ[a] nye Chineke, bụ Nna nke Onyenwe anyị Jizọs bụ Mesaya,[b] otuto.
  rationale: The revision improves Standard Igbo syntax by using “nye ... otuto” after the purposive clause, clarifies the appositional relationship of God and Father, and refines both notes. It retains the Greek’s paired unity expressions, its doxological register, and the translated messianic title.
