  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: ig
  text: ka unu wee jiri otu obi na otu ọnụ[a] nye Chineke, bụ Nna nke Onyenwe anyị Jizọs bụ Mesaya,[b] otuto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ikwu ya n’akpaalaokwu, “jiri otu olu.” Grik kwuru “otu ọnụ,” iji mesie ịdị n’otu n’otuto ike.
    reason: lexical_alternative
  - marker: b
    text: 'N’ụdị ọdịnala: “Jizọs Kraịst.” Okwu Grik Χριστός pụtara “Mesaya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ka unu wee
  rationale: Ọ na-egosi nzube ma ọ bụ ihe ga-esi n’okwu gbara ya gburugburu pụta; usoro a bụ Igbo dị mfe ma na-edobe ike nke njikọ ahụ.
- source_word: ὁμοθυμαδόν
  choice: jiri otu obi
  rationale: Nke a na-egosi ịdị n’otu n’uche na n’ebumnobi. “Otu obi” bụ akpaalaokwu Igbo sitere n’okwu nkịtị ma dị iche na ihe oyiyi “otu ọnụ” nke na-esochi ya.
- source_word: ἐν ἑνὶ στόματι
  choice: na otu ọnụ
  rationale: A na-edobe ihe oyiyi kpọmkwem nke Grik, bụ́ ọtụtụ mmadụ iji “otu ọnụ” na-enye otuto; ihe ọ pụtara n’akpaalaokwu bụ iji otu olu.
- source_word: δοξάζητε
  choice: na-enye ... otuto
  rationale: Usoro ngwaa a na-egosi omume a na-aga n’ihu ma bụrụkwa okwu Igbo nkịtị na nke dị ùgwù maka inye Chineke ebube ma ọ bụ otuto.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: Chineke na Nna
  rationale: A na-edobe aha abụọ jikọrọ ọnụ dịka ha dị na Grik, n’enweghị ịtụgharị njikọ ahụ ka ọ bụrụ nkọwa okpukpe ọzọ.
- source_word: τοῦ κυρίου ἡμῶν
  choice: nke Onyenwe anyị
  rationale: “Onyenwe” na-ebunye aha nsọpụrụ κύριος, ebe “anyị” na-edobe nnọchiaha nke onye mbụ n’ọnụọgụ ọtụtụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  rationale: A sụgharịrị Χριστός dịka aha ọrụ “Mesaya,” ọ bụghị dịka aha mmadụ ọzọ; “bụ” na-eme ka njikọ aha na aha ọrụ ahụ bụrụ Igbo ebumpụta ụwa.
theological_decisions:
- issue: Otu e si ghọta “Chineke na Nna” (τὸν θεὸν καὶ πατέρα)
  choice: Chineke na Nna nke Onyenwe anyị
  alternative: Chineke, ya bụ Nna nke Onyenwe anyị
  rationale: Nhọrọ e mere na-edobe njikọ καί na ịdị n’otu nke okwu Grik ahụ, n’enweghị ịkọwa ya karịa ka isi mmalite mere.
- issue: Ntụgharị Χριστοῦ n’usoro aha Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  alternative: Jizọs Kraịst
  rationale: Χριστός bụ aha ọrụ pụtara “Mesaya.” Ịsụgharị ihe ọ pụtara na-eme ka ndị na-agụ ya ghọta ọrụ ahụ, ebe ihe odide ala peeji na-echekwa ụdị ọdịnala.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Otu obi” na “otu ọnụ” na-echekwa ma ịdị n’otu n’uche ma ihe oyiyi nke otuto ọnụ; ahịrịokwu ahụ na-ezere okwu ụka pụrụ iche.
