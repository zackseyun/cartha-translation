    reason: lexical_alternative
  - marker: b
    text: 'N’ụdị ọdịnala: “Jizọs Kraịst.” Okwu Grik Χριστός pụtara “Mesaya.”'
    reason: alternative_reading
  revision_rationale: The revision improves Standard Igbo syntax by using “nye ... otuto” after the purposive clause, clarifies the appositional relationship of God and Father, and refines both notes. It retains the Greek’s paired unity expressions, its doxological register, and the translated messianic title.
