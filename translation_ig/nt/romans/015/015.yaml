- from: Ma edewo m unu n'ụzọ dịtụ nkwuwa okwu banyere ihe ụfọdụ[a], dị ka onye na-echetara unu ihe ndị a ọzọ, n’ihi amara nke Chineke nyere m[b].
  to: Ma edegara m unu, n’akụkụ ụfọdụ, n’ụzọ nkwuwa okwu karịa, dịka onye na-echetara unu ihe ndị a ọzọ, n’ihi amara Chineke nyere m[a].
  rationale: A gbanwere “n’ụzọ dịtụ nkwuwa okwu” ka ọ bụrụ “n’ụzọ nkwuwa okwu karịa” iji chekwaa comparative τολμηρότερον. A debere “ọzọ” n’ihi na ἐπαναμιμνῄσκων nwere echiche ime ka mmadụ cheta ọzọ. A sụgharịrị ἀπὸ μέρους dịka “n’akụkụ ụfọdụ,” nke na-echekwa ambiguity ya, ma e tinyere nhọrọ ọzọ na nkọwa ala peeji. E jikọtara nkọwa abụọ ndị dị adị n’otu nkọwa ala peeji, n’ihi na amaokwu ahụ nwere otu akara ala peeji ugbu a.
