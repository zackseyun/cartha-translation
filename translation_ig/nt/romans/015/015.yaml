  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: ig
  text: Ma edegara m unu, n’akụkụ ụfọdụ, n’ụzọ nkwuwa okwu karịa, dịka onye na-echetara unu ihe ndị a ọzọ, n’ihi amara Chineke nyere m[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “edegara m unu n’ụzọ nkwuwa okwu karịa n’akụkụ ụfọdụ.” Nkebiokwu Grik ahụ nwere ike ịpụta na Pọl dere n’ụzọ nkwuwa okwu karịa, ma ọ bụ na o dere n’ụzọ dị otú ahụ banyere ihe ụfọdụ. N’ebe a, “amara Chineke nyere m” na-ezo aka karịchaa n’ozi ma ọ bụ ọrụ Chineke nyere Pọl, ọ bụghị naanị n’amara n’ozuzu ya.
    reason: lexical_alternative; cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: n'ụzọ dịtụ nkwuwa okwu
  rationale: Ọ na-egosi nkwuwa okwu e ji dee ihe, ma na-echekwa echiche ntụnyere dị n’okwu Grik ahụ n’ụzọ Igbo na-ada nke ọma.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi ntakịrị mgbanwe ma ọ bụ ntụgharị site n’otuto Pọl kwuru tupu nke a.
- source_word: ἔγραψα
  choice: edewo m
  rationale: Oge aorist e ji dee akwụkwọ ozi nwere ike ịpụta nke ọma n’Igbo dị ka ihe onye dere emechaala n’akwụkwọ ozi ahụ.
- source_word: ἀπὸ μέρους
  choice: banyere ihe ụfọdụ
  rationale: Nkebiokwu a nwere ike ịpụta ‘n’otu akụkụ’ ma ọ bụ ‘banyere isiokwu ụfọdụ’; nhọrọ a bụ Igbo doro anya ma na-adabara ihe Pọl na-ekwu.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: dị ka onye na-echetara unu ihe ndị a ọzọ
  rationale: Ọ na-egosi ụzọ ma ọ bụ ebumnuche Pọl ji dee, ma na-echekwa echiche nke ime ka ha cheta ọzọ.
- source_word: διὰ τὴν χάριν
  choice: n’ihi amara
  rationale: διά na accusative na-egosi ihe kpatara ya ma ọ bụ ihe ọ dabere na ya; ‘amara’ bụ okwu Igbo kwesịrị ekwesị maka χάρις.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: nke Chineke nyere m
  rationale: Ọ na-egosi n'ụzọ nkịtị na Chineke bụ onye nyere Pọl amara ahụ.
theological_decisions:
- issue: Ihe χάρις pụtara n’ebe a
  choice: E debere ‘amara,’ ma ihe gbara ya gburugburu na-egosi amara Chineke nyere Pọl maka ozi ya.
  alternative: Ịsụgharị ya kpọmkwem dị ka ‘ọrụ’ ma ọ bụ ‘ikike e nyere m.’
  rationale: Amaokwu 15–16 jikọtara amara ahụ na ọrụ Pọl n’etiti ndị mba ọzọ. Ma okwu Grik ahụ ka sara mbara karịa naanị ‘ọrụ,’ ya mere isi ederede ekwesịghị imechi ihe ọ pụtara.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. A họọrọ ‘banyere ihe ụfọdụ’ n’isi ederede maka ịdị mfe, ebe nkọwa ala peeji na-echekwa nghọta ọzọ nke ἀπὸ μέρους na njikọ ya na τολμηρότερον.
