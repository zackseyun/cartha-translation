  naturalness: “Edegara m unu” bụ ụzọ Standard Igbo a na-ahụkarị ma na-ada n’ụzọ nkịtị maka idegara mmadụ akwụkwọ. “N’akụkụ ụfọdụ” na-egosipụta ἀπὸ μέρους n’enweghị imechi ya naanị n’isiokwu ụfọdụ.
