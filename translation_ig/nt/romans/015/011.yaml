  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: ig
  text: 'Ọzọkwa:


    “Unu mba niile[b], toonụ Onyenwe anyị[a];

    ka ndị mmadụ niile tookwa ya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ihe odide Hibru nke abụ a, aha Chineke (YHWH, nke a na-asụkarị “Yahweh”) dị n’ebe okwu Grik κύριος (“Onyenwe anyị”) dị.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụ ya “ndị mba ọzọ niile.” Okwu Grik ἔθνη nwere ike ịpụta “mba” ma ọ bụ “ndị mba ọzọ”; n’abụ a, ọ na-akpọ mba niile oku, ma ọ dabakwara n’ihe Pọl na-ekwu banyere ndị na-abụghị ndị Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Ọzọkwa, e dere, sị
  rationale: “Ọzọkwa” na-egosi na Pọl na-agbakwụnye amaokwu ọzọ n’usoro ihe ndị o hotara. A gbakwụnyere “e dere, sị” iji mee ka mmalite okwu e hotara doo anya n’Igbo.
- source_word: Αἰνεῖτε
  choice: toonụ
  rationale: Nke a bụ iwu a na-enye ọtụtụ ndị. “Toonụ” bụ okwu Igbo doro anya maka inye Chineke otuto ma na-echekwa ike iwu ahụ.
- source_word: πάντα τὰ ἔθνη
  choice: unu mba niile
  rationale: “Mba niile” na-echekwa echiche sara mbara nke ἔθνη n’abụ a, ebe “unu” na-eme ka o doo anya na a na-agwa mba ndị ahụ okwu ozugbo.
- source_word: τὸν κύριον
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị asụ κύριος dị ka aha nsọpụrụ Chineke, n’enweghị ịgbanwe okwu Grik ahụ ozugbo gaa n’aha Chineke dị n’ihe odide Hibru e hotara.
- source_word: ἐπαινεσάτωσαν
  choice: ka ... tookwa
  rationale: Usoro “ka ... tookwa” na-enye iwu onye nke atọ n’Igbo n’ụzọ ebumpụta ụwa; “-kwa” na-egosikwa na ìgwè nke abụọ sonye n’otuto ahụ.
- source_word: αὐτόν
  choice: ya
  rationale: “Ya” na-alaghachi n’ebe Onyenwe anyị nọ n’ụzọ dị mfe ma ghara ikwughachi aha ahụ n’enweghị mkpa.
- source_word: πάντες οἱ λαοί
  choice: ndị niile dị iche iche
  rationale: Nhọrọ a na-egosi ọtụtụ ìgwè mmadụ ma na-edobe ọdịiche dị n’etiti λαοί na ἔθνη, nke a sụgharịrị “mba.”
theological_decisions:
- issue: Otu e si asụ κύριος n’okwu Agba Ochie e hotara, ebe ọ na-anọchi aha Chineke
  choice: Onyenwe anyị
  alternative: Yahweh
  rationale: Isi ihe odide Agba Ọhụrụ nwere κύριος, ya mere “Onyenwe anyị” bụ ntụgharị ya kpọmkwem. Ma ebe isi Hibru nke abụ a nwere aha Chineke, e debere “Yahweh” n’ala peeji ka onye na-agụ ya hụ njikọ ahụ.
- issue: Ma ἔθνη ọ pụtara mba niile ka ọ bụ ndị mba ọzọ n’ebe a
  choice: mba niile
  alternative: ndị mba ọzọ niile
  rationale: N’abụ e hotara, oku ahụ gbasara mba niile n’ụwa. N’otu oge ahụ, “ndị mba ọzọ” dabara na arụmụka Pọl banyere ndị na-abụghị ndị Juu, ya mere e debere ya dịka ntụgharị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. A haziri okwu iwu ahụ dịka okwu a na-agwa ọtụtụ ndị ozugbo, ma debe ọdịiche dị n’etiti “mba” na “ndị ... dị iche iche.” Akara ala peeji dị n’akụkụ okwu ha na-akọwa; e dozikwara njikọ akara ndị ahụ nke dịgharịrị n’akwụkwọ ntụle Bekee.
