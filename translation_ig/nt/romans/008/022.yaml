  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: ig
  text: N’ihi na anyị maara na ihe niile e kere eke[a] na-asụ ude ọnụ, na-enwekwa mgbu ịmụ nwa ọnụ ruo ugbu a.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “okike dum”; ma ọ bụ “ihe e kere eke nke ọ bụla,” ọ bụ ezie na n’ebe a, echiche sara mbara banyere okike dum yikarịrị ka ọ bụ ya.
    reason: lexical_alternative
  - marker: b
    text: Okwu ahụ bụ́ “mgbu ịmụ nwa” na-akpọpụta ihe oyiyi mgbu ọmụmụ nwa. Ọ na-egosi ọ bụghị naanị ahụhụ, kamakwa ahụhụ nke na-eduga n’ọmụmụ nke ndụ ọhụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: anyị maara
  rationale: Ọ bụ ezie na okwu Grik a dị n’ụdị perfect n’akụkọ ya, ọ na-arụkarị ọrụ dị ka okwu na-egosi ihe a maara ugbu a; “anyị maara” bụ Igbo doro anya ma bụrụkwa ihe otu ahụ niile kwenyere na ha maara.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Nke a na-egosi na amaokwu a na-akọwa ma na-akwado ihe Pọl kwuru n’amaokwu bu ya ụzọ.
- source_word: πᾶσα ἡ κτίσις
  choice: ihe niile e kere eke
  rationale: N’ihi article na πᾶσα, okwu a na-ezo aka n’ihe niile e kere eke dịka otu mkpokọta, ọ bụghị naanị otu ihe e kere eke n’otu n’otu. Nhọrọ a kwekọrọ n’echiche sara mbara nke Rom 8:19–23.
- source_word: συστενάζει
  choice: na-asụkọ ude
  rationale: “Na-asụ ude” na-egosi ịta ahụhụ, ebe “-kọ” na-echekwa echiche nke συν-, ya bụ, na ha niile na-eme ya ọnụ.
- source_word: συνωδίνει
  choice: na-enwekọkwa ihe mgbu nke ịmụ nwa
  rationale: Okwu a abụghị naanị ahụhụ n’ozuzu; ọ na-akpọpụta kpọmkwem ihe mgbu nke ịmụ nwa. “-kọ” na-echekwakwa echiche nke imekọ ihe ọnụ dị na συν-.
- source_word: ἄχρι τοῦ νῦν
  choice: ruo ugbu a
  rationale: Nke a bụ okwu Igbo dị mfe ma doo anya nke na-egosi na ọnọdụ ahụ gara n’ihu ruo n’oge a.
theological_decisions:
- issue: Ma κτίσις ọ̀ ga-abụ “ihe niile e kere eke” ka ọ bụ “ihe e kere eke nke ọ bụla.”
  choice: ihe niile e kere eke
  alternative: ihe e kere eke nke ọ bụla
  rationale: N’ime Rom 8:19–23, Pọl na-eme ka ụwa e kere eke bụrụ dịka onye na-atụ anya ntọhapụ. Ya mere, okwu mkpokọta a na-echekwa echiche sara mbara nke ebe ahụ n’emeghị ka ọ bụrụ naanị ndị mmadụ ma ọ bụ anụmanụ n’otu n’otu.
- issue: Ma ihe mgbu a ọ̀ bụ naanị ahụhụ, ka ọ bụ ihe mgbu nke ịmụ nwa.
  choice: ihe mgbu nke ịmụ nwa
  alternative: ịta ahụhụ
  rationale: συνωδίνει na-eji ihe oyiyi nke ime nwa kpọmkwem. Nsụgharị a na-echekwa ma ihe mgbu ahụ ma atụmanya nke ihe ọhụrụ ga-esi na ya pụta, n’ebughị ụzọ kọwaa kpọmkwem ihe ọhụrụ ahụ bụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Ngwakọta “na-asụkọ … na-enwekọkwa” na-echekwa ugboro abụọ nke συν- n’ọrụ Grik, ebe “ihe mgbu nke ịmụ nwa” na-eme ka ihe oyiyi ọmụmụ nwa doo anya n’enweghị okwu ochie ma ọ bụ nke otu ụka.
