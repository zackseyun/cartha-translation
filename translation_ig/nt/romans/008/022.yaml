revisions:
- from: N’ihi na anyị maara na ihe niile e kere eke[a] na-asụkọ ude, na-enwekọkwa ihe mgbu nke ịmụ nwa ruo ugbu a.[b]
  to: N’ihi na anyị maara na ihe niile e kere eke[a] na-asụ ude ọnụ, na-enwekwa mgbu ịmụ nwa ọnụ ruo ugbu a.[b]
  rationale: A gbanwere naanị okwu ndị na-adịghị ada nke ọma n’Igbo na nkọwa ala peeji nke nwere okwu na-ezighị ezi. Nsụgharị ahụ ka na-echekwa mkpokọta nke κτίσις, ugboro abụọ nke echiche “ọnụ/together,” na ihe oyiyi mgbu ọmụmụ nwa, n’enweghị itinye nkọwa ozizi karịrị ihe amaokwu ahụ kwuru.
