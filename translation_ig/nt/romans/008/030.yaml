language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: ig
  text: Ndị ahụ o kara aka, ọ kpọkwara ha; ndị ahụ ọ kpọrọ, o kwupụtakwara ha dị ka ndị ezi omume; ndị ahụ o kwupụtara dị ka ndị ezi omume, o nyekwara ha ebube[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Grik ji oge gara aga kwuo ya: “o nyekwara ha ebube.” Ụfọdụ na-aghọta na ebe a, e ji oge gara aga kọwaa ebube ga-abịa n’ọdịnihu, n’ihi na o ji nnọọ n’aka, dịka a ga-asị na o mezuolarị.'
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: o buuru ụzọ kpebie banyere ha
  rationale: Nke a na-egosipụta mkpebi e mere tupu oge eruo, ma ọ naghị etinye nkọwa otu ụka pụrụ iche banyere ụdị mkpebi ahụ ma ọ bụ otú e si mezuo ya.
- source_word: ἐκάλεσεν
  choice: ọ kpọkwara ha
  rationale: “Kpọrọ” bụ okwu Igbo doro anya nke na-echekwa njikọ Pọl mere n’etiti usoro ndị a, n’enweghị ịkọwa ụdị ọkpụkpọ ahụ karịa ihe Grik kwuru.
- source_word: ἐδικαίωσεν
  choice: o kwupụtakwara ha dị ka ndị ezi omume
  rationale: 'Nke a na-egosipụta echiche ikpe nke δικαιόω n’akwụkwọ Pọl: Chineke kwupụtara ọnọdụ ha dị ka nke ndị ezi omume. Ọ na-ezere ime ka okwu ahụ pụta nanị dị ka mgbanwe omume n’ime mmadụ.'
- source_word: ἐδόξασεν
  choice: o nyekwara ha ebube
  rationale: Okwu a nọ n’oge gara aga n’asụsụ Grik. Nsụgharị a na-echekwa oge ahụ na usoro okwu Pọl, kama ịgbanwe ya ozugbo ka ọ bụrụ ihe ga-eme n’ọdịnihu.
- source_word: οὓς ... τούτους
  choice: ndị ahụ ... ha
  rationale: Usoro a na-eme ka o doo anya na otu ndị ahụ ka a na-ekwu maka ha site na mbido ruo na njedebe, ma na-ada nke ọma n’Igbo.
- source_word: καὶ
  choice: -kwara
  rationale: 'Mgbakwunye “-kwara” na-egosipụta ike mgbakwunye nke καί n’usoro ọ bụla: o buuru ụzọ kpebie, kpọọkwa; kpọọ, kwupụtakwa; kwupụta, nyekwa ebube.'
- source_word: δὲ
  choice: njikọ e gosipụtara site n’usoro ahịrịokwu
  rationale: δέ bụ njikọ dị nro ebe a, ọ bụghị mmegide siri ike. Igbo anaghị achọ ka a tụgharịa ya n’okwu pụrụ iche n’ebe abụọ a iji mee ka ahịrịokwu ahụ bụrụ nke eke.
theological_decisions:
- issue: Ma a ga-eme ka προώρισεν dị nro iji zere esemokwu gbasara akara aka
  choice: o buuru ụzọ kpebie banyere ha
  alternative: o kara ha aka tupu oge eruo
  rationale: Asụsụ Grik na-ekwu n’ezie banyere mkpebi e mere tupu oge eruo. Isi nsụgharị na-echekwa nke ahụ ma hapụ ihe mkpebi ahụ gụnyere n’ụdị okwu Pọl hapụrụ ya, kama idozi esemokwu nkà mmụta okpukpe n’ime nsụgharị.
- issue: Ma ἐδόξασεν ga-abụ ihe gara aga ma ọ bụ ihe ga-eme n’ọdịnihu
  choice: o nyekwara ha ebube
  alternative: ọ ga-enyekwa ha ebube
  rationale: Ụdị ngwaa Grik bụ aorist indicative, ya mere isi nsụgharị na-egosipụta ya dị ka ihe gara aga. E debere nghọta nke na-ele ya anya dị ka ebube ọdịnihu n’ala ala peeji, ka e wee ghara iwepụ esemokwu dị n’ụdị okwu Pọl.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ugboro ugboro nke ahịrịokwu Grik site n’iji “ndị ahụ ... ha” na mgbakwunye “-kwara.” Okwu ndị a anaghị akwalite nkọwa otu ụka pụrụ iche.
