id: ROM.8.23
reference: Romans 8:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: ig
  text: Ọ bụghịkwa naanị nke ahụ, kama anyị onwe anyị kwa, bụ́ ndị nwere mkpụrụ mbụ nke Mmụọ[a], ọbụna anyị onwe anyị na-asụ ude n'ime onwe anyị, na-atụsi anya ike ka a nabata anyị dị ka ụmụ[b]—ya bụ, mgbapụta nke ahụ anyị[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma eleghị anya: “Mmụọ dị ka mkpụrụ mbụ.”'
    reason: alternative_reading
  - marker: b
    text: 'Ma ọ bụ naanị: “nnabata dị ka ụmụ.” Okwu Grik ahụ na-agụnyekwu kpọmkwem echiche nke ịbụ ụmụ ndị ikom, nke metụtara ọkwa iwu na oke nketa; ndị kwere ekwe niile, ma nwoke ma nwanyị, so na ya.'
    reason: lexical_alternative
  - marker: c
    text: 'N’ụzọ nkịtị na Grik: “nke ahụ anyị,” ebe e ji “ahụ” n’otu ọnụ ọgụgụ mee ihe n’ụzọ na-ezo aka n’ahụ nke onye ọ bụla n’ime anyị.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: Ọ bụghịkwa naanị nke ahụ, kama
  rationale: Nke a na-ejikọ echiche Pọl na amaokwu bu ụzọ ma na-edobe ntụgharị okwu siri ike nke ‘ọ bụghị naanị… kama.’
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: anyị onwe anyị kwa … ọbụna anyị onwe anyị
  rationale: Nkwughachi a na-edobe nkwusi ike nke αὐτοὶ na ἡμεῖς, bụ́ na ndị kwere ekwe onwe ha sokwa na ndị na-asụ ude.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: mkpụrụ mbụ nke Mmụọ
  rationale: ‘Mkpụrụ mbụ’ na-egosipụta ihe e bu ụzọ nweta nke na-ekwe nkwa ihe ka ga-abịa; nhazi ‘nke Mmụọ’ na-ahapụkwa njikọ genitive ahụ ka ọ ghara ịbụ nke a kọwara naanị otu ụzọ.
- source_word: ἔχοντες
  choice: bụ́ ndị nwere
  rationale: Nkebi okwu a na-asụ nke ọma n'Igbo ma na-edobe ọrụ participle ahụ nke na-akọwa ‘anyị.’
- source_word: ἐν ἑαυτοῖς
  choice: n'ime onwe anyị
  rationale: Ọ na-egosi n'ụzọ doro anya na ịsụ ude ahụ dị n'ime ha, n'enweghị ịgbasawanye ihe odide ahụ.
- source_word: στενάζομεν
  choice: na-asụ ude
  rationale: Nke a bụ okwu Igbo a na-ahụkarị maka ịsụ ude, ọ na-edobekwa njikọ ya na ịsụ ude nke ihe e kere eke n'amaokwu ndị gbara ya gburugburu.
- source_word: υἱοθεσίαν
  choice: ka a nabata anyị dị ka ụmụ
  rationale: Nke a na-egosipụta nnabata mmadụ n'ọkwa nwa n'ụzọ Igbo na-ada nke ọma. ‘Ụmụ’ n'Igbo gụnyere nwoke na nwanyị, ebe nkọwa ala peeji na-akọwa ihe oyiyi ịbụ nwa nwoke dị n'okwu Grik.
- source_word: ἀπεκδεχόμενοι
  choice: na-atụsi anya ike
  rationale: Ọ na-egosipụta ichere ihe n'olileanya siri ike, nke bụ ike mgbakwunye dị n'okwu Grik ahụ.
- source_word: τὴν ἀπολύτρωσιν
  choice: mgbapụta
  rationale: ‘Mgbapụta’ na-edobe okwu nkà mmụta okpukpe Pọl nakwa echiche nke ntọhapụ zuru ezu nke ga-abịa.
- source_word: τοῦ σώματος ἡμῶν
  choice: nke ahụ anyị
  rationale: Igbo na-eji ‘ahụ anyị’ eme ihe n'ụzọ eke maka ahụ nke onye ọ bụla n'ime anyị, ma ọ na-edobekwa ụdị otu ọnụ ọgụgụ dị na Grik.
theological_decisions:
- issue: Otu e si egosipụta υἱοθεσίαν ma debe ihe oyiyi ịbụ nwa nwoke na oke nketa n'enweghị ime ka ụmụ nwanyị yie ndị a na-ewepụ
  choice: ka a nabata anyị dị ka ụmụ
  alternative: nnabata anyị n'ọkwa ụmụ ndị ikom
  rationale: ‘Ụmụ’ bụ okwu Igbo eke nke na-agụnye ndị kwere ekwe niile. E tinyeghị ‘ndị ikom’ n'ahịrị bụ isi n'ihi na ọ ga-ada ka a na-ekwu naanị banyere ụmụ nwoke; nkọwa ala peeji na-echekwa kpọmkwem ihe okwu Grik na-atụ aka na ya.
- issue: Ma ‘mkpụrụ mbụ nke Mmụọ’ ọ bụ onyinye sitere n'aka Mmụọ ka ọ bụ Mmụọ ahụ n'onwe ya dị ka mkpụrụ mbụ
  choice: mkpụrụ mbụ nke Mmụọ
  alternative: Mmụọ dị ka mkpụrụ mbụ
  rationale: Nhazi nke Grik nwere ike ịnabata nghọta abụọ ahụ. Ahịrị bụ isi na-edobe usoro okwu ahụ n'ụzọ na-adịghị ekpebi ya kpamkpam, ebe nkọwa ala peeji na-egosi nghọta nke abụọ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘bụ́’ mee njikọ nkọwa n'ụzọ nkịtị, ‘na-asụ ude’ maka okwu Pọl na-emegharị n'akụkụ a, ma zere okwu ụka pụrụ iche nke otu ụka. Akara nkọwa ala peeji [a], [b], na [c] niile dị n'ebe okwu ha na-akọwa nọ n'ahịrị bụ isi.
