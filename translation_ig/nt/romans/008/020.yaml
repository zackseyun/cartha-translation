  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: ig
  text: N’ihi na e mere ka ihe e kere eke nọrọ n’okpuru ihe efu[a], ọ bụghị site n’uche nke ya, kama n’ihi onye ahụ mere ka ọ nọrọ n’okpuru[b], n’olileanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe-efu” ma ọ bụ “ndakpọ olileanya.”
    reason: lexical_alternative
  - marker: b
    text: Ederede Grik ekwughị kpọmkwem onye bụ “onye ahụ mere ka ọ nọrọ n’okpuru.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “site n’olileanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: ọnọdụ nke enweghị ike iru nzube ha
  rationale: N’ebe a, okwu ahụ na-egosi ọnọdụ nke ihe e kere eke na-enweghị ike iru ebumnobi kwesịrị ya, ọ bụghị ajọ omume. Nkebiokwu a na-eme ka echiche ahụ doo ndị na-agụ Igbo nke oge a anya ma ghara ime ka ọ bụrụ nanị ‘ihe efu.’
- source_word: κτίσις
  choice: ihe niile e kere eke
  rationale: N’akụkụ Rom 8:19–22, okwu ahụ na-ezo aka n’ụwa e kere eke n’ozuzu ya, karịchaa ihe ndị na-abụghị mmadụ, ọ bụghị otu ihe e kere eke naanị.
- source_word: ὑπετάγη
  choice: e mere ka ... nọrọ n’okpuru
  rationale: 'Nhọrọ a na-echekwa ọdịdị passive nke Grik: e tinyere ihe e kere eke n’ọnọdụ a site n’ike onye ọzọ.'
- source_word: οὐχ ἑκοῦσα
  choice: ọ bụghị n’ihi na ha ji aka ha họrọ ya
  rationale: Nke a na-egosi n’asụsụ Igbo doro anya na ihe e kere eke abataghị n’ọnọdụ ahụ site n’uche ma ọ bụ nhọrọ nke onwe ha.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: n’ihi onye ahụ mere ka ha nọrọ n’okpuru ya
  rationale: A sụgharịrị διά ya n’ụzọ na-egosi ihe kpatara ya, ma ahapụrụ onye ahụ n’enweghị aha dịka ederede Grik mere.
- source_word: ἐφ’ ἑλπίδι
  choice: n’olileanya
  rationale: Nkebiokwu dị mkpirikpi a na-echekwa echiche nke olileanya na-ele ihe ga-eme n’ọdịnihu anya, n’enweghị ịgbatị ihe ederede kwuru.
theological_decisions:
- issue: Onye bụ ‘onye ahụ mere ka’ ihe e kere eke nọrọ n’okpuru ọnọdụ a
  choice: Ahapụrụ ya dịka ‘onye ahụ’ n’ahịrị bụ isi, n’enweghị ịkpọ aha ya.
  alternative: A pụrụ ịghọta ya dịka Chineke; ụfọdụ na-ejikọkwa ọnọdụ a na mmehie Adam, ebe ụfọdụ ndị ọzọ tụrụ aro Setan.
  rationale: Grik akpọghị onye ahụ aha kpọmkwem. Ya mere, nsụgharị ahụ echekwala njide onwe nke ederede na esemokwu nkọwa ya kama ikpebi ya n’ahịrị bụ isi.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta. E jiri ọtụtụ ‘ha’ kwekọọ na ‘ihe niile e kere eke’ dịka mkpokọta. Akara ụkwụ niile [a], [b], na [c] dị n’ahịrị bụ isi.
