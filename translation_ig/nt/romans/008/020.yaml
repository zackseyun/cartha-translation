    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “site n’olileanya.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek syntax and ambiguity while avoiding added explanation. It renders κτίσις as a singular collective, maintains the passive action and unnamed subject, and retains the compact closing phrase “n’olileanya.” All footnote anchors remain present and correspond to the revised wording.
