id: ROM.8.2
reference: Romans 8:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: ig
  text: N’ihi na iwu nke Mmụọ nke ndụ n’ime Mesaya Jizọs atọhapụla gị n’iwu nke mmehie na ọnwụ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ “ụkpụrụ”: “ụkpụrụ nke Mmụọ nke ndụ.”'
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ akwụkwọ aka ochie nwere “m” kama “ị.”
    reason: textual_variant
  - marker: c
    text: 'Nsụgharị ọdịnala: “n’ime Kraịst Jizọs.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: iwu
  rationale: E ji “iwu” tụgharịa ya n’ebe abụọ ahụ iji chekwaa otu aha ahụ Pọl kwughachiri na mgbagwoju anya dị n’ihe atụ ya; “ụkpụrụ” nwekwara ike ịbụ nkọwa ya, ma ọ ga-eme ka ihe okwu ahụ pụtara dị warara ngwa ngwa.
- source_word: πνεύματος
  choice: Mmụọ
  rationale: E dere ya dị ka aha nke na-ezo aka na Mmụọ Nsọ, n’ihi na ihe gbara amaokwu a gburugburu na Ndị Rom 8 na-egosi Mmụọ Chineke onye na-enye ndụ.
- source_word: ζωῆς
  choice: ndụ
  rationale: Nke a bụ ntụgharị kpọmkwem nke na-echekwa ahịrịokwu ahụ “Mmụọ nke ndụ” n’etinyeghị nkọwa ọzọ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaya Jizọs
  rationale: E ji “Mesaya” sụgharịa Χριστός dị ka utu aha, ebe “n’ime” na-echekwa okwu Pọl banyere ịdị n’ime Mesaya kama ịkọwagharị ya.
- source_word: ἠλευθέρωσέν
  choice: emeela ka ... nwere onwe ... pụọ
  rationale: Nkebi okwu a na-egosi ihe e mere eme nke nsonaazụ ya ka dị ugbu a, ma na-ada nke ọma n’Igbo.
- source_word: σε
  choice: ị
  rationale: A gbasoro ọgụgụ onye nke abụọ otu, σε, nke dị n’edemede SBLGNT; e debere variant “m” n’ala peeji.
- source_word: ἁμαρτίας
  choice: mmehie
  rationale: Ọ bụ ntụgharị a na-ejikarị eme ihe, na-egosikwa mmehie dị ka ike na-achị mmadụ n’echiche Pọl.
- source_word: θανάτου
  choice: ọnwụ
  rationale: Ọ bụ ntụgharị kpọmkwem, a hapụkwara ya ka ya na “mmehie” bụrụ otu nkebi okwu dị mkpirikpi.
theological_decisions:
- issue: Ma πνεύματος ọ na-ezo aka na Mmụọ Nsọ ka ọ bụ mmụọ mmadụ ma ọ bụ ụkpụrụ ime mmụọ
  choice: Mmụọ Nsọ (“Mmụọ” jiri mkpụrụedemede ukwu)
  alternative: mmụọ mmadụ ma ọ bụ ụkpụrụ ime mmụọ
  rationale: Ndị Rom 8 na-egosi ọdịiche dị n’etiti anụ ahụ, mmehie, ọnwụ, na Mmụọ Chineke nke na-enye ndụ; ya mere, ihe gbara amaokwu ahụ gburugburu kacha akwado na ọ bụ Mmụọ Nsọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị nsọpụrụ ma dị mfe nghọta, mee ihe. A họọrọ “n’ime” iji chekwaa nkebi okwu Pọl ἐν Χριστῷ, ma jiri “Mesaya” gosi Χριστός dị ka utu aha. Akara ala peeji niile dị n’ahụ ederede.
