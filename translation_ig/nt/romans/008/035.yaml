id: ROM.8.35
reference: Romans 8:35
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: ig
  text: Ònye ga-ekewapụ anyị site n’ịhụnanya Mesaịa? Ọ bụ ahụhụ, ka ọ bụ oke nsogbu, ka ọ bụ mkpagbu, ka ọ bụ ụnwụ, ka ọ bụ ịgba ọtọ, ka ọ bụ ihe ize ndụ, ma ọ bụ mma agha?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ịhụnanya anyị nwere n’ebe Mesaịa nọ.” Njikọ aha Grik a nwere ike ịpụta otu a, ọ bụ ezie na ihe gbara amaokwu a gburugburu na-akwado “ịhụnanya Mesaịa nwere n’ebe anyị nọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Ònye
  rationale: Nnọchiaha ajụjụ a na-ezo aka n’onye ga-eme omume ahụ; “Ònye” na-edobekwa ike ajụjụ nkwuwa okwu Pọl.
- source_word: χωρίσει
  choice: ga-ekewapụ
  rationale: Ọ na-egosi ime ka ndị nọkọrọ kewaa ma ọ bụ nọpụ iche; ụdị ọdịnihu “ga-ekewapụ” dabara n’ụdị ngwaa Grik.
- source_word: ἀγάπης
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụkwa nke a na-ejikarị sụgharịa ἀγάπη.
- source_word: τοῦ Χριστοῦ
  choice: Onye Kraịst
  rationale: Χριστός bụ aha ọkwa nke pụtara Onye E Tere Mmanụ. “Onye Kraịst” bụ ụzọ a maara nke ọma n’Igbo isi kwuo aha ọkwa ahụ, ebe njikọ ya na “ịhụnanya” na-agbaso usoro okwu Grik.
- source_word: θλῖψις
  choice: ahụhụ
  rationale: “Ahụhụ” na-egosi nsogbu ma ọ bụ nrụgide siri ike, ma na-ahapụ “mkpagbu” maka διωγμός.
- source_word: στενοχωρία
  choice: mkpagide
  rationale: “Mkpagide” na-egosipụta echiche nke ịnọ n’ọnọdụ a kpachiri mmadụ aka ma ọ bụ nke na-enye oke nhụjuanya.
- source_word: διωγμός
  choice: mkpagbu
  rationale: Nke a bụ okwu Igbo ziri ezi maka imegide ma na-emekpa mmadụ ahụ, karịchaa n’ihi okwukwe ya.
- source_word: λιμός
  choice: ụnwụ
  rationale: “Ụnwụ” na-egosi oke ụkọ nri, ọ bụghị nanị agụụ mmadụ na-agụ.
- source_word: γυμνότης
  choice: enweghị uwe
  rationale: Nkebi okwu a na-enye echiche nke enweghị ihe e ji ekpuchi ahụ n’Igbo eke ma doo anya, gụnyekwa ọnọdụ ogbenye nke nwere ike ịdị n’okwu ahụ.
- source_word: κίνδυνος
  choice: ihe ize ndụ
  rationale: Nke a bụ okwu Igbo nke oge a, doro anya maka ọnọdụ nwere ike iweta mmerụ ma ọ bụ ọnwụ.
- source_word: μάχαιρα
  choice: mma agha
  rationale: Ọ na-echekwa ihe oyiyi ngwa ọgụ dị na Grik na egwu nke ọnwụ site n’ime ihe ike.
theological_decisions:
- issue: Ụdị njikọ nke τοῦ Χριστοῦ na ἀγάπης
  choice: ịhụnanya Onye Kraịst nwere n’ebe anyị nọ, nke e gosipụtara n’ụdị dị mkpirikpi “ịhụnanya Onye Kraịst”
  alternative: ịhụnanya anyị nwere n’ebe Onye Kraịst nọ
  rationale: Ọdịdị njikọ okwu Grik nwere ike ịpụta nke ọ bụla. Ihe gbara amaokwu a gburugburu na Ndị Rom 8:31–39 na-akwado ịhụnanya Onye Kraịst nwere n’ebe ndị kwere ekwe nọ; ma e debere nghọta nke ọzọ n’okpuru peeji ka a ghara ihichapụ mgbagwoju anya dị n’asụsụ mbụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta mee ihe. Usoro “Ọ bụ … ka ọ bụ …” na-eme ka ndepụta ajụjụ ahụ daa nke ọma n’Igbo ma na-echekwa nkwuwa okwu nke amaokwu ahụ. E zere okwu ụka nke otu nkwenkwe pụrụ iche.
