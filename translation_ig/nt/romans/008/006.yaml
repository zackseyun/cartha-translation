revisions:
- from: N’ihi na, echiche nke anụ ahụ bụ ọnwụ,[a] ma echiche nke Mmụọ[b] bụ ndụ na udo.
  to: N’ihi na, ụzọ iche echiche nke anụ ahụ bụ ọnwụ,[a] ma ụzọ iche echiche nke Mmụọ[b] bụ ndụ na udo.
  rationale: The revision renders φρόνημα as ‘ụzọ iche echiche,’ which communicates an enduring mindset or orientation without adding interpretation. The main contrast, syntax, and theological ambiguity of the Greek are retained. The first footnote is made more idiomatic in Standard Igbo; the second continues to document the lower-case/general-spirit alternative.
  reviewer_model: gpt-5.6-terra
