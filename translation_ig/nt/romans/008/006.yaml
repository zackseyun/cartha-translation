id: ROM.8.6
reference: Romans 8:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: ig
  text: N’ihi na, ụzọ iche echiche nke anụ ahụ bụ ọnwụ,[a] ma ụzọ iche echiche nke Mmụọ[b] bụ ndụ na udo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “agwa mmehie.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “mmụọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na okwu a na-akọwa ihe e kwuru n’amaokwu bu ya ụzọ, n’asụsụ Igbo doro anya.
- source_word: φρόνημα
  choice: echiche
  rationale: N’ebe a, ọ pụtara ụzọ mmadụ si eche echiche na ntụziaka obi ya, ọ bụghị naanị ikike iche echiche.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: Na-echekwa okwu Pọl ji mee ihe na esemokwu ya na Mmụọ, kama ịkọwa ya ozugbo dịka ‘ọdịdị mmehie.’
- source_word: θάνατος
  choice: ọnwụ
  rationale: Ọ bụ ntụgharị kpọmkwem nke na-echekwa ịdị arọ nke okwu ahụ n’ụzọ anụ ahụ na nke mmụọ.
- source_word: πνεῦμα
  choice: Mmụọ
  rationale: Ọnọdụ okwu Rom 8 na-egosi na ọ kacha yie ka ọ na-ezo aka na Mmụọ Nsọ, ma e debere nghọta ọzọ n’ala ala peeji.
- source_word: ζωή
  choice: ndụ
  rationale: Ọ bụ ntụgharị nkịtị nke na-echekwa ọdịiche dị nkenke n’etiti ndụ na ọnwụ.
- source_word: εἰρήνη
  choice: udo
  rationale: Ọ bụ okwu Igbo nkịtị na nke sara mbara nke dabara na ‘ndụ.’
theological_decisions:
- issue: Ma πνεῦμα ọ na-ezo aka na Mmụọ Nsọ ka ọ bụ mmụọ mmadụ
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ, ma ọ bụ mmụọ n’echiche sara mbara
  rationale: N’ime Rom 8, Pọl na-ekwukarị banyere Mmụọ dịka onye Chineke ji enye ndụ, ya mere ‘Mmụọ’ dabara n’ọnọdụ a; ma ihe odide Grik anaghị eji mkpụrụedemede ukwu kewaa nghọta ndị a.
- issue: Ihe σάρξ pụtara n’ebe a
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: ‘Anụ ahụ’ na-echekwa ihe atụ na esemokwu dị n’okwu Pọl, ebe ‘ọdịdị mmehie’ bụ nkọwa nwere ike imechi nghọta okwu ahụ karịa ka Grik mere.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘echiche’ mee ka ahịrịokwu ahụ bụrụ nke mmadụ nkịtị ga-aghọta, ebe nkọwa lexical na-egosi na ọ gụnyere ntụziaka obi na ụzọ e si eche echiche. A haziri akara ala ala peeji n’usoro [a], [b] dịka ha pụtara n’ahịrịokwu.
