review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Greek’s passive aorist ('a zọpụtara anyị'), its likely sphere/manner dative ('n’olileanya'), the contrast between hope and what is seen, and the generic rhetorical question. The main text does not over-resolve the debated force of τῇ ἐλπίδι.
  naturalness: The translation is generally clear Standard Igbo. In the final clause, however, 'ihe ọ na-ahụ anya' is needlessly repetitive after 'na-ahụ'; 'ihe ọ na-ahụ' is more idiomatic and retains the precise referent. Footnote b can also state the explanatory sense more naturally.
  terminology: ‘Olileanya’ consistently and suitably renders ἐλπίς. ‘A zọpụtara anyị’ preserves the passive without assigning an unstated agent. No doctrinally loaded wording has been introduced.
  issues:
  - severity: low
    issue: Redundant wording in the final rhetorical question
    rationale: In Standard Igbo, 'na-ahụ' already conveys seeing; adding 'anya' in 'ihe ọ na-ahụ anya' is stylistically heavy. 'Ihe ọ na-ahụ' naturally renders ὃ βλέπει without any loss of meaning.
  - severity: low
    issue: Footnote b is less idiomatic than it could be
    rationale: ‘Olileanya na-ele anya n’ihe…’ can suggest physically looking toward something. The note’s intended explanatory sense is better expressed as hope being concerned with what has not been seen.
