  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: ig
  text: N’ihi na a zọpụtara anyị n’olileanya[a]. Ma olileanya a na-ahụ anya abụghị olileanya[b], n’ihi na ònye na-atụ anya ihe ọ na-ahụ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụ site n’olileanya ka a zọpụtara anyị.”
    reason: alternative_reading
  - marker: b
    text: Ya bụ, olileanya gbasara ihe a na-ahụbeghị.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: n’olileanya
  rationale: 'Dative a kacha dabara n’ịkọ ọnọdụ ma ọ bụ ụzọ nzọpụta ahụ si bụrụ nke anyị ugbu a: ọ dị n’olileanya, ọ bụghị n’ihe a hụlarị anya. Nke a na-echekwa esemokwu dị n’etiti ihe e nwetara ugbu a na mmezu ya nke ka na-abịa.'
- source_word: ἐσώθημεν
  choice: a zọpụtara anyị
  rationale: Nke a na-echekwa olu nnara nke aorist ahụ ma na-egosi na ọ bụ onye ọzọ mere nzọpụta ahụ, n’ebughị ụzọ tinye nkọwa na-adịghị n’ụdị Grik.
- source_word: ἐλπὶς ... βλεπομένη
  choice: olileanya a na-ahụ anya
  rationale: Nkebiokwu a bụ ụzọ Igbo dị mfe ma kwekọọ n’echiche participle ahụ; ọ na-echekwa ọdịiche dị n’etiti olileanya na ịhụ anya.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: abụghị olileanya
  rationale: Nke a na-enye ike nkọwa nke predicate Grik n’ụzọ Igbo ebumpụta ụwa.
- source_word: ὃ ... βλέπει
  choice: ihe ọ na-ahụ anya
  rationale: Nnochiaha neuter ὃ na-ezo aka n’ihe a na-ahụ; ‘ihe’ bụ ntụgharị Igbo dabara adaba, ebe ‘ọ’ na-arụ ọrụ dịka onye ọ bụla n’ozuzu ya, ọ bụghị naanị nwoke.
- source_word: τίς ἐλπίζει
  choice: ònye na-atụ anya
  rationale: Ajụjụ a na-adị ka ilu ma bụrụ nke gbasara onye ọ bụla; simple present Igbo na-echekwa ụdị ahụ n’enweghị itinye echiche nke ịnọgide na-atụ anya.
theological_decisions:
- issue: Mmekọrịta nzọpụta na olileanya n’okwu τῇ ἐλπίδι ἐσώθημεν
  choice: A sụgharịrị ya ‘a zọpụtara anyị n’olileanya,’ nke na-echekwa na nzọpụta bụ eziokwu ugbu a ma mmezu ya a na-ahụ anya ka na-abịa.
  alternative: ‘Ọ bụ site n’olileanya ka a zọpụtara anyị,’ nke na-ewere dative ahụ dịka ihe e ji zọpụta.
  rationale: N’ọnọdụ amaokwu ndị gbara ya gburugburu, ‘n’olileanya’ na-echekwa esemokwu nke ihe dị ugbu a na ihe ka na-abịa, n’emeghị ka olileanya bụrụ isi ihe na-arụpụta nzọpụta.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, sụgharịa ya. A họọrọ ‘olileanya’ maka ἐλπίς na ‘ịhụ anya’ maka βλέπω iji mee ka ọdịiche Pọl na-eme n’etiti olileanya na ịhụ anya pụta ìhè. E tinyere akara ndetu ala ala [a] na [b] n’ederede isi.
