  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: ig
  text: N’ihi na ndị niile Mmụọ Chineke na-edu, ndị a bụ ụmụ Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, okwu a pụtara kpọmkwem “ụmụ nwoke” (ya bụ, “sons”). “Ụmụ Chineke” bụ okwu Igbo ebumpụta ụwa n’ebe a; okwu Grik ahụ na-echekwakwa echiche nkuchi na ihe nketa dị n’akụkụ a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: ndị niile
  rationale: Na-egosipụta ndị niile so n’òtù a n’enweghị ntụgharị okwu siri ike ma ọ bụ nke na-adịghị eke n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-echekwa ọrụ nkọwa okwu ahụ, nke jikọtara amaokwu a na arụmụka bu ya ụzọ.
- source_word: πνεύματι θεοῦ
  choice: Mmụọ Chineke
  rationale: E ji ya na ngwaa nnara ‘na-edu’ gosipụta na Mmụọ Chineke bụ onye na-eme nduzi ahụ; ọ na-echekwakwa njikọ okwu θεοῦ.
- source_word: ἄγονται
  choice: na-edu
  rationale: Usoro a na-egosi omume na-aga n’ihu ma na-ahapụ Mmụọ Chineke ka ọ bụrụ onye na-eme omume ahụ, dịka pasiv Grik si pụta.
- source_word: οὗτοι
  choice: ndị a
  rationale: Na-echekwa nkwusi ike nke okwu ngosi Grik ma bụrụkwa Igbo dị mfe ma kwekọọ n’usoro ahụ.
- source_word: υἱοί
  choice: ụmụ
  rationale: N’Igbo ọkọlọtọ, ‘ụmụ’ bụ okwu ebumpụta ụwa maka ụmụ mmadụ nke nne ma ọ bụ nna, ọ pụkwara ịgụnye nwoke na nwanyị; ebe ọ bụ na Igbo anaghị eji otu nkewa nwoke nke ‘sons’ n’ụzọ yiri Grik, ntụgharị a zere itinye nkewa na-adịghị eke n’asụsụ ahụ.
- source_word: θεοῦ
  choice: Chineke
  rationale: Na-asụgharị genitiv ahụ n’usoro njikọ aha nke Igbo, ma na-echekwa nkwughachi ‘Chineke’ n’amaokwu ahụ.
theological_decisions:
- issue: Otu e si asụgharị υἱοί θεοῦ n’Igbo ma chekwaa echiche nke ịbụ nwa na ihe nketa.
  choice: ụmụ Chineke
  alternative: ụmụ ndị ikom Chineke
  rationale: υἱοί bụ ụdị ọtụtụ nke nwoke na Grik, ma n’ebe a ọ na-akọwa ndị niile Mmụọ Chineke na-edu. ‘Ụmụ Chineke’ bụ okwu Igbo ebumpụta ụwa nke na-agụnye ha niile. ‘Ụmụ ndị ikom Chineke’ ga-adị ka ọ na-ekewapụ ụmụ nwanyị, ọ pụkwara ime ka ihe Pọl kwuru ghọọ ihe ọzọ. Ihe odide ala peeji na-akọwa na okwu Grik bụ ‘sons’ nakwa na ọnọdụ a metụtara nkuchi na ihe nketa.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ùgwù. Ahịrịokwu ahụ na-echekwa njikọ nkọwa ‘N’ihi na,’ ọrụ nduzi nke Mmụọ Chineke, na nkwusi ike ‘ndị a.’
