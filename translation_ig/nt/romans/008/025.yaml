id: ROM.8.25
reference: Romans 8:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: ig
  text: Ma ọ bụrụ na anyị na-atụ anya ihe anyị na-adịghị ahụ anya, anyị ji ntachi obi na-echere ya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “anyị ji nnọgidesi ike na-echere ya.”
    reason: lexical_alternative
  - marker: b
    text: Ngwaa Grik a pụkwara ịpụta “anyị ji nnukwu atụmanya na-echere ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Ma ọ bụrụ na
  rationale: Nke a na-edobe ọnọdụ εἰ na njikọ nwere obere ntụgharị nke δέ n’Igbo dị ugbu a ma dịkwa mfe nghọta.
- source_word: ὃ οὐ βλέπομεν
  choice: ihe anyị na-adịghị ahụ anya
  rationale: “Ihe” na-anọchi nnọchiaha neuter ὃ n’ụzọ Igbo si ekwu ya; “anyị na-adịghị ahụ anya” na-edobe ihe βλέπομεν pụtara n’oge ugbu a, n’etinyeghị echiche ọzọ na-adịghị na Grik.
- source_word: ἐλπίζομεν
  choice: anyị na-atụ anya
  rationale: “Ịtụ anya” bụ ụzọ Igbo nkịtị si egosipụta olileanya ma ọ bụ atụmanya e chere ihu n’ọdịnihu; usoro ahịrịokwu ahụ na-eme ka ihe a na-atụ anya ya doo anya.
- source_word: δι’ ὑπομονῆς
  choice: anyị ji ntachi obi
  rationale: “Ntachi obi” na-egosi ndidi na iguzosi ike n’okpuru oge ichere ma ọ bụ ihe isi ike, ya mere ọ na-eburu ịdị arọ nke ὑπομονή karịa ndidi efu.
- source_word: ἀπεκδεχόμεθα
  choice: na-echere ya
  rationale: Nke a bụ Igbo doro anya ma dị mma maka ichere ihe a na-atụ anya ya. A na-edebe echiche nke ichere ya nke ukwuu n’okpuru nkọwa [b], ka a ghara ime ka isi ahịrịokwu daa arọ.
theological_decisions:
- issue: Ihe olileanya Ndị Kraịst na-ele anya ya n’agbanyeghị na a naghị ahụ ya ugbu a
  choice: E debere ya dịka “ihe anyị na-adịghị ahụ anya,” n’akọwaghị kpọmkwem ihe ahụ.
  alternative: Ịkpọ ya nzọpụta, mgbapụta nke ahụ, ma ọ bụ mbilite n’ọnwụ site n’ihe gbara amaokwu ahụ gburugburu.
  rationale: Ọ bụ ezie na amaokwu ndị gbara ya gburugburu na-enyere aka ịmata ihe Pọl na-ekwu, amaokwu a n’onwe ya hapụrụ ya dịka nnọchiaha izugbe. Nsụgharị ahụ na-edobe oke na mgbagwoju anya nke ederede kama itinye nkọwa ozizi n’ime ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ntachi obi” na-egosi ma ndidi ma nnọgidesi ike; “na-echere ya” na-eme ka ahịrịokwu ahụ bụrụ nke nkịtị, ebe nkọwa ala peeji na-edobe ike atụmanya dị na ngwaa Grik.
