  terminology: '''Ịtụ anya'' is an acceptable natural rendering of ἐλπίζομεν in this construction, and ''ntachi obi'' suitably expresses ὑπομονή more fully than simple passive patience. The footnotes responsibly preserve the alternatives of perseverance and expectant awaiting.'
