  source_fidelity: The translation accurately preserves the conditional contrast (εἰ δέ), the unspecified object of hope ('ihe anyị na-adịghị ahụ anya'), the ongoing hope, and the means/manner of awaiting it through ὑπομονή. 'na-echere ya' appropriately renders ἀπεκδεχόμεθα without adding a doctrinally specific referent.
