id: ROM.8.29
reference: Romans 8:29
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: ig
  text: N’ihi na ndị o bu ụzọ mara[a], o bukwara ụzọ kpebie ka e mee ha ka ha yie oyiyi Ọkpara ya, ka ọ bụrụ ọkpara n’etiti ọtụtụ ụmụnna[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “ndị ọ maara na mbụ.” Ụfọdụ na-aghọta “o bu ụzọ mara” ebe a dịka okwu mmekọrịta, ya bụ, “ndị o burula ụzọ lekwasị anya n’ebe ha nọ.”
    reason: alternative_reading
  - marker: b
    text: Okwu Grik a sụgharịrị “ụmụnna” dị n’ụdị ọtụtụ nke nwoke; ma ndị a na-ekwu maka ha nwere ike ịgụnye ma ndị nwoke ma ndị nwanyị nọ n’ezinụlọ Chineke.
    reason: cultural_note
lexical_decisions:
- source_word: προέγνω
  choice: ọ maara tupu oge eruo
  rationale: Nke a na-egosipụta echiche bụ́ ‘ịma tupu oge eruo’ n’enweghị ịkọwa ya n’ụzọ ga-ekpebi ma ọ bụ naanị ihe ọmụma banyere ọdịnihu ka ọ bụ mmekọrịta pụrụ iche e nwere na mbụ.
- source_word: προώρισεν
  choice: o bukwara ụzọ kara aka
  rationale: ‘Buru ụzọ kara aka’ na-egosipụta ma ihe e mere tupu oge eruo ma mkpebi e mere maka nzube a kapịrị ọnụ.
- source_word: συμμόρφους
  choice: ka ha bụrụ ndị e mere ka ha yie
  rationale: Nkebiokwu a na-echekwa echiche nke ime ka mmadụ nwee ọdịdị yiri nke ọzọ, ọ bụghị naanị iyi ya n’elu.
- source_word: εἰκόνος
  choice: oyiyi
  rationale: ‘Oyiyi’ bụ okwu Igbo doro anya maka εἰκών ma na-echekwa njikọ ya na asụsụ Akwụkwọ Nsọ banyere oyiyi.
- source_word: υἱοῦ
  choice: Ọkpara
  rationale: A hapụrụ aha mmekọrịta a kpọmkwem n’ihi mkpa ọ dị n’okwu banyere Kraịst.
- source_word: εἰς τὸ εἶναι
  choice: ka ọ bụrụ
  rationale: Nke a na-egosi nzube ma ọ bụ nsonaazụ nke mkpebi ahụ n’Igbo dị mfe.
- source_word: πρωτότοκον
  choice: ọkpara
  rationale: ‘Ọkpara’ na-echekwa ihe atụ nke onye mbụ a mụrụ na echiche nke ọnọdụ mbụ, n’ebughị ụzọ dochie ya naanị na ‘onye kachasị elu.’
- source_word: ἀδελφοῖς
  choice: ụmụnna
  rationale: ‘Ụmụnna’ na-anọchi ụdị ọtụtụ nke nwoke dị na Grik; nkọwa ala peeji na-egosi na ndị a nwere ike ịgụnye ma ndị nwoke ma ndị nwanyị.
- source_word: ὅτι
  choice: N’ihi na
  rationale: Ọ na-ewebata ihe kpatara ma ọ bụ ihe na-akọwa okwu dị n’amaokwu bu ụzọ.
theological_decisions:
- issue: Ma a ga-akọwa προέγνω n’ụzọ ga-ekpebi esemokwu banyere ịma tupu oge eruo na ị họpụta mmadụ.
  choice: E dere ya ‘ọ maara tupu oge eruo,’ n’enweghị itinye otu nkọwa ozizi pụrụ iche n’ime amaokwu ahụ.
  alternative: ‘ọ hụrụ ha n’anya ma họrọ ha tupu oge eruo’ ma ọ bụ nghọta nke nanị ịma ihe ga-eme n’ọdịnihu.
  rationale: Okwu Grik n’onwe ya anaghị akọwa kpọmkwem otú ‘ịma’ ahụ si arụ ọrụ; ya mere nsụgharị ahụ na-echekwa oghere nkọwa na esemokwu ozizi dị n’amaokwu ahụ.
- issue: Ma a ga-eme ἀδελφοῖς ka ọ bụrụ okwu na-ekwupụta nwoke na nwanyị ọnụ n’ahịrị isi.
  choice: E ji ‘ụmụnna’ n’ahịrị isi, tinyekwa nkọwa na ọ pụrụ ịgụnye nwoke na nwanyị.
  alternative: ‘ụmụnne nwoke na ụmụnne nwanyị’ ma ọ bụ ‘ụmụ Chineke.’
  rationale: Ụdị okwu Grik bụ ọtụtụ nke nwoke. A naghị ehichapụ ụdị ahụ n’ahịrị isi, ma a na-eme ka onye na-agụ mara na ndị a na-ekwu maka ha nwere ike ịbụ ezinụlọ Chineke niile.
- issue: Ma πρωτότοκον ga-abụ naanị aha ọnọdụ ịdị elu.
  choice: E chekwara ihe atụ ahụ dịka ‘ọkpara.’
  alternative: ‘onye kachasị elu’ ma ọ bụ ‘onye mbụ n’ọkwa.’
  rationale: ‘Ọkpara’ na-eburu ma echiche nke onye mbụ a mụrụ ma echiche nke ịbụ onye mbụ n’ọnọdụ, n’enweghị iwepụ otu akụkụ nke ihe okwu Grik pụrụ ịpụta.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘buru ụzọ kara aka’ na ‘e mere ka ha yie oyiyi’ iji jikọta izizi nke Grik na asụsụ Igbo na-aga were were; a zere okwu ụka pụrụ iche nke ga-eme ka otu nkọwa ozizi bụrụ naanị nke ziri ezi.
