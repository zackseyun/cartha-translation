review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence and core meanings of προέγνω, προώρισεν, συμμόρφους τῆς εἰκόνος, υἱοῦ, πρωτότοκον, and ἀδελφοῖς. However, “o bukwara ụzọ kara aka” is not as idiomatic or precise as a direct expression of prior determination, and the passive/formative force of συμμόρφους is clearer when the clause explicitly says that they are to be made like the Son’s image.
  naturalness: The revision uses the more natural Standard Igbo verbal sequence “o bu ụzọ mara ... o bukwara ụzọ kpebie” and a smoother passive expression, “ka e mee ha ka ha yie.” The formal biblical register remains appropriate.
  terminology: “Oyiyi,” “Ọkpara,” “ọkpara,” and “ụmụnna” appropriately retain the image, Son, firstborn, and brothers terminology. “Ọkpara” is retained for the filial title and lowercase “ọkpara” for “firstborn.” The notes retain the Greek ambiguity of προέγνω and explain the likely inclusive referent of ἀδελφοῖς without imposing a doctrinal conclusion.
  issues:
  - severity: medium
    issue: The expression “o bukwara ụzọ kara aka” is awkward and may not clearly communicate prior determination.
    rationale: προώρισεν means that God determined beforehand. “O bukwara ụzọ kpebie” is clearer, idiomatic Standard Igbo, and does not introduce a more specific doctrinal interpretation.
  - severity: low
    issue: “ka ha bụrụ ndị e mere ka ha yie” is heavier than needed and slightly obscures the syntactic relationship between predestination and conformity.
    rationale: “ka e mee ha ka ha yie oyiyi Ọkpara ya” expresses the intended passive transformation naturally while retaining the sense of συμμόρφους.
  revised_text: N’ihi na ndị o bu ụzọ mara[a], o bukwara ụzọ kpebie ka e mee ha ka ha yie oyiyi Ọkpara ya, ka ọ bụrụ ọkpara n’etiti ọtụtụ ụmụnna[b].
