revisions:
- from: N’ihi na ndị ọ maara tupu oge eruo[a], o bukwara ụzọ kara aka ka ha bụrụ ndị e mere ka ha yie oyiyi Ọkpara ya, ka ọ bụrụ ọkpara n’etiti ọtụtụ ụmụnna[b].
  to: N’ihi na ndị o bu ụzọ mara[a], o bukwara ụzọ kpebie ka e mee ha ka ha yie oyiyi Ọkpara ya, ka ọ bụrụ ọkpara n’etiti ọtụtụ ụmụnna[b].
  rationale: 'The revisions improve idiomatic Standard Igbo and make the prior-determination and transformative-conformity senses more transparent. They preserve the source text’s theological openness: “o bu ụzọ mara” does not define the nature of foreknowledge, and “o bukwara ụzọ kpebie” does not specify a doctrinal mechanism of predestination. Footnote markers remain correctly anchored after “mara” and “ụmụnna.”'
  reviewer_model: gpt-5.6-terra
