id: ROM.8.34
reference: Romans 8:34
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: ig
  text: Ònye na-ama ikpe ọmụma? Mezaịa[a] bụ onye nwụrụ—karịa nke ahụ, onye e kpọlitere[b]—onye nọkwa n’aka nri Chineke[c], onye na-arịọchitere anyị[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ “Kraịst.”
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ “onye biliri.” Ngwaa Grik ahụ dị n’olu nnara: “onye e kpọlitere.”'
    reason: alternative_reading
  - marker: c
    text: “N’aka nri Chineke” bụ okwu Baịbụl ji egosi ọnọdụ nsọpụrụ na ikike kachasị elu.
    reason: cultural_note
  - marker: d
    text: Ma ọ bụ “onye na-arịọ arịrịọ n’ihi anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: onye na-ama ikpe
  rationale: E ji nkebiokwu aha na-egosi omume na-aga n’ihu sụgharịa participle a, ma debe ike ajụjụ Pọl jụrụ.
- source_word: Χριστός
  choice: Mezaịa
  rationale: N’ebe a, okwu ahụ na-arụ ọrụ dị ka utu aha nke Onye Chineke tere mmanụ; “Mezaịa” na-eme ka ihe utu aha ahụ pụtara doo anya. E tinyeghị “Jizọs” n’ihi na ọ dịghị n’ihe odide Grik a.
- source_word: ἀποθανών
  choice: onye nwụrụ anwụ
  rationale: Nke a na-egosipụta omume mere eme nke aorist participle n’Igbo dị mfe ma bụrụkwa eke.
- source_word: μᾶλλον δὲ
  choice: karịa nke ahụ
  rationale: Nkebiokwu a na-ebuli okwu ahụ site n’ọnwụ Mezaịa gaa n’mbilite ya, kama ịgbanwe ihe e kwuru tupu ya.
- source_word: ἐγερθείς
  choice: onye e mere ka o bilie
  rationale: E debere olu nnara nke Grik, n’ebughị ụzọ kpọọ onye mere ka o bilie aha.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: n’aka nri Chineke
  rationale: Nke a bụ ụzọ okwu Baịbụl a maara nke ọma si egosi ọnọdụ nsọpụrụ na ikike kachasị elu.
- source_word: ἐντυγχάνει ὑπὲρ ἡμῶν
  choice: na-arịọchitekwara anyị arịrịọ
  rationale: Okwu a na-egosi na ọ na-anọchite anya anyị n’arịrịọ; “-kwara” na-edebekwa καί nke ugboro abụọ.
theological_decisions:
- issue: Otu e si sụgharịa Χριστός dị ka utu aha
  choice: Mezaịa
  alternative: Kraịst
  rationale: “Mezaịa” na-eme ka echiche nke Onye e tere mmanụ pụta ìhè, ebe “Kraịst” bụ ụdị okwu ọdịnala a na-ejikarị eme ihe dị ka aha.
- issue: Olu nke ἐγερθείς
  choice: onye e mere ka o bilie
  alternative: onye biliri
  rationale: Nhọrọ bụ isi na-edebe olu nnara nke Grik ma ghara ime ka ya onwe ya bụrụ onye mere omume ahụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ùgwù ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka ọ debe usoro ajụjụ na nkebiokwu ndị na-akọwa Mezaịa, ma ghara ịtinye “Jizọs,” nke na-adịghị n’ihe odide SBLGNT e nyere.
