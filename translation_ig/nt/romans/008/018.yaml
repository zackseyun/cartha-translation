id: ROM.8.18
reference: Romans 8:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: ig
  text: N’ihi na echere m na ahụhụ ndị anyị na-ata n’oge a ekwesịghị iji ha tụnyere ebube ahụ na-abịa, nke a ga-ekpughere anyị[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nke a ga-ekpughe n’ime anyị.”
    reason: alternative_reading
lexical_decisions:
- source_word: Λογίζομαι
  choice: echere m
  rationale: Na-egosi mkpebi e ji echiche na ntụle mee, ọ bụghị naanị mmetụta obi.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na okwu a na-enye ihe ndabere ma ọ bụ nkọwa maka ihe e kwuru tupu ya.
- source_word: τὰ παθήματα
  choice: ahụhụ ndị anyị na-ata
  rationale: Ọ bụ ụzọ Igbo doro anya ma dị ndụ isi kwuo ahụhụ a na-enwe, ebe ụdị Grik ahụ na-ekwu maka ahụhụ ndị a na-ahụ n’ahụmahụ.
- source_word: τοῦ νῦν καιροῦ
  choice: n’oge a
  rationale: Na-echekwa echiche nke oge dị ugbu a n’enweghị itinye echiche ‘ọgbọ’ ma ọ bụ ‘ụwa’ nke okwu Grik ahụ ekwughị kpọmkwem.
- source_word: οὐκ ἄξια ... πρὸς
  choice: erughị ka e jiri ha tụnyere
  rationale: Na-egosipụta enweghị nhata dị ukwuu n’etiti ahụhụ ugbu a na ebube ahụ, n’Igbo nkịtị ma kwesị ntụkwasị obi.
- source_word: τὴν μέλλουσαν δόξαν
  choice: ebube ahụ na-abịa
  rationale: Na-edobe μέλλουσαν dịka ihe ga-abịa, ma na-eji okwu Igbo dị mfe ma dị ùgwù.
- source_word: ἀποκαλυφθῆναι
  choice: nke a ga-ekpughere
  rationale: Na-echekwa olu nnara na echiche nke ikpughe ihe e zoro ezo n’ọdịnihu.
- source_word: εἰς ἡμᾶς
  choice: anyị
  rationale: N’usoro ‘a ga-ekpughere anyị,’ ọ na-enye isi nghọta nke ebube a ga-eme ka ndị kwere ekwe hụ ma mara, ebe a na-edobe ‘n’ime anyị’ n’okpuru peeji.
theological_decisions:
- issue: Ihe εἰς ἡμᾶς pụtara n’ihe gbasara ikpughe ebube
  choice: a ga-ekpughere anyị
  alternative: a ga-ekpughe n’ime anyị
  rationale: εἰς ἡμᾶς nwere ike ịpụta na a ga-ekpughere anyị ebube ahụ, ma ọ pụkwara igosi na a ga-ekpughe ya n’ime anyị. Isi ederede na-eji nghọta mbụ nke na-aga nke ọma n’Igbo, ma ihe odide ala peeji na-echekwa nghọta nke abụọ n’ebughị ụzọ kpebie esemokwu nkọwa ahụ.
translation_notes:
  register: Standard Igbo nke oge a; asụsụ ahụ dị mfe, dị ùgwù, ma dị mma maka ịgụpụta n’ọha. E tinyere akara [a] n’isi ederede dịka achọrọ.
