id: ROM.8.17
reference: Romans 8:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: ig
  text: Ọ bụrụkwa na anyị bụ ụmụ Chineke, anyị bụkwa ndị nketa—ndị nketa nke Chineke na ndị ha na Mesaịa ga-eketa ọnụ—ọ bụrụ n’ezie na anyị na ya na-ata ahụhụ, ka e wee nyekwa anyị na ya otuto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: ụmụ Chineke
  rationale: τέκνα bụ aha na-adịghị akọwa nwoke ma ọ bụ nwaanyị. E tinyere “Chineke” site n’ihe okwu ndị gbara amaokwu a gburugburu na-ekwu, ka ahịrịokwu Igbo doo anya ma nọgide na-egosi ọnọdụ ụmụ n’ezinụlọ Chineke.
- source_word: κληρονόμοι
  choice: ndị nketa
  rationale: Nke a bụ okwu Igbo doro anya maka ndị nwere òkè iwu kwadoro n’ihe nketa, ma kwekọọ na arụmụka Pọl banyere ịbụ ụmụ.
- source_word: θεοῦ
  choice: nke Chineke
  rationale: A sụgharịrị genitive ahụ n’ụzọ kwụ ọtọ, na-ahapụghị ka nsụgharị ahụ kpebie kpọmkwem ma Chineke bụ onye na-enye ihe nketa ma ọ bụ akụkụ kasịnụ nke ihe a na-eketa.
- source_word: συγκληρονόμοι
  choice: ndị ha na Mesaịa ga-eketa ọnụ
  rationale: Okwu a na-egosi isoro onye ọzọ nwee otu ọnọdụ na otu òkè n’ihe nketa; nkebiokwu a bụ Igbo nkịtị ma mee ka συν- pụta ìhè.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: Χριστός bụ aha ọkwa nke Onye Chineke tere mmanụ; “Mesaịa” na-echekwa ihe aha ọkwa ahụ pụtara n’ebe a.
- source_word: εἴπερ
  choice: ọ bụrụ n’ezie
  rationale: Nke a na-echekwa ma ọnọdụ okwu ahụ na ike nkwenye dị n’εἴπερ, n’emeghị ka ọ ghọọ nanị “ebe ọ bụ na.”
- source_word: συμπάσχομεν
  choice: anyị na ya na-ata ahụhụ
  rationale: A kọwapụtara συν- dịka “na ya,” n’ihi na okwu gbara ya gburugburu na-ekwu banyere isoro Mesaịa kerịta ahụhụ.
- source_word: ἵνα
  choice: ka e wee
  rationale: Nkebiokwu a na-egosi ebumnuche ma ọ bụ ihe ga-esi na ya pụta n’Igbo dị mfe ma dị ebube.
- source_word: συνδοξασθῶμεν
  choice: ka e wee nyekwa anyị na ya otuto
  rationale: Ụdị passive ahụ ka dị n’“e wee nye,” ebe “anyị na ya” na-echekwa συν- nke na-egosi isoro Mesaịa kerịta otuto ahụ.
theological_decisions:
- issue: Ma εἴπερ συμπάσχομεν ọ na-ekwu na ahụhụ bụ ụgwọ mmadụ ji azụta otuto, ka ọ bụ usoro a na-atụ anya ya n’ịdị n’otu na Mesaịa
  choice: 'E debere ya dịka ọnọdụ n’ezie: “ọ bụrụ n’ezie na anyị na ya na-ata ahụhụ,” ma e tinyeghị echiche na ahụhụ na-erite otuto dịka ụgwọ ọrụ mmadụ ji aka ya nweta.'
  alternative: A pụrụ ime ka ọnọdụ ahụ dị nro site n’ịsị “ebe anyị na ya na-ata ahụhụ,” ma ọ bụ kọwaa ya dịka ahụhụ na-eweta otuto n’ụzọ ụgwọ ọrụ.
  rationale: εἴπερ nwere ike ọnọdụ n’ezie, ma ebe okwu a dị, Pọl na-ekwu banyere isoro Mesaịa kerịta ahụhụ na otuto. Nsụgharị ahụ na-ahapụ njikọ ahụ ka ọ dị n’enweghị ịkọwa karịa ihe Grik kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ụmụ Chineke” kama okwu na-egosi naanị ụmụ nwoke; e jikwa “ndị nketa” na “ga-eketa ọnụ” mee ka ihe atụ ezinụlọ na iwu nketa doo anya. Enweghị ihe odide ọzọ n’amaokwu Grik a nke chọrọ ihe odide ala peeji; ihe odide ala peeji Bekee e nyere adabaghị na ebe akara ya dị ma ọ naghị egosi ezigbo ọdịiche dị na isi mmalite, ya mere etinyeghị ya.
