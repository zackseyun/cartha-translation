  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: ig
  text: Ya mere[a], ụmụnna, anyị bụ ndị ji ụgwọ—ma ọ bụghị anụ ahụ[b] ka anyị ji ụgwọ, ka anyị bie ndụ dịka anụ ahụ si achị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N'ihi ya.” Okwu Grik abụọ a na-egosi nkwubi okwu sitere n'ihe e kwuru tupu ya.
    reason: lexical_alternative
  - marker: b
    text: “Anụ ahụ” n'ebe a abụghị naanị ahụ mmadụ; ọ na-ekwu banyere ndụ mmadụ nke mmehie na-achị, nke na-emegide Mmụọ Chineke. A pụkwara ịsụ ya, “ọdịdị mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Ya mere
  rationale: Nkebi a na-egosi nkwubi okwu sitere n'okwu ndị bu ya ụzọ; “Ya mere” na-enye echiche ahụ n'Igbo dị mfe ma bụrụkwa nke ugwu.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ ụzọ ebumpụta ụwa e si akpọkọta ndị otu okwukwe n'Igbo, ọ pụkwara ịgụnye ndị nwoke na ndị nwanyị; ihe odide Grik n'onwe ya ji aha nwoke ọtụtụ mee ihe.
- source_word: ὀφειλέται ἐσμέν
  choice: anyị ji ụgwọ
  rationale: Nke a na-edobe ihe atụ nke ndị ji ụgwọ dị n'okwu Grik, ma n'ebe a ọ na-egosi ibu ọrụ, ọ bụghị naanị ụgwọ ego.
- source_word: σάρξ / σαρκί
  choice: anụ ahụ
  rationale: “Anụ ahụ” na-edobe okwu Pọl ji mee ọdịiche dị n'etiti anụ ahụ na Mmụọ, kama ịkọwapụta ya ozugbo dịka “ọdịdị mmehie.”
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: ibi ndụ dị ka anụ ahụ si dị
  rationale: 'Nke a na-edobe usoro echiche Pọl: ibi ndụ n''ụzọ ma ọ bụ ụkpụrụ anụ ahụ na-achị.'
theological_decisions:
- issue: Ma a ga-akọwa σάρξ ozugbo dịka ọdịdị mmehie n'ọdịiche Pọl na-eme
  choice: anụ ahụ
  alternative: ọdịdị mmehie
  rationale: Isi ederede na-edobe okwu Pọl na esemokwu ya na Mmụọ, ka a ghara idozi ihe okwu ahụ pụtara n'ụzọ otu nkọwa naanị; nkọwa ọzọ dị n'okpuru.
- issue: Ma ἀδελφοί na-akpọ naanị ndị nwoke
  choice: ụmụnna
  alternative: ụmụ nwoke ibe m
  rationale: N'okwu Grik ọ bụ ụdị nwoke ọtụtụ, ma n'ọnọdụ a ọ bụ ịkpọ ọgbakọ ndị kwere ekwe niile; “ụmụnna” bụ okwu Igbo zuru oke nke na-anabata echiche obodo ahụ.
translation_notes:
  register: Standard Igbo nke oge a, dị mfe nghọta ma dị ugwu. E ji “anyị ji ụgwọ” debe ihe atụ dị n'asụsụ mmalite; e kwughachiri “ka anyị ji ụgwọ” iji mee ka njikọ ahịrịokwu ahụ doo anya n'Igbo. Akara nkọwa [a] na [b] pụtara n'isi ederede.
