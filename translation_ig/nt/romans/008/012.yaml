revisions:
- from: Ya mere[a], ụmụnna, anyị ji ụgwọ—ọ bụghị anụ ahụ[b] ka anyị ji ụgwọ, ibi ndụ dị ka anụ ahụ si dị.
  to: Ya mere[a], ụmụnna, anyị bụ ndị ji ụgwọ—ma ọ bụghị anụ ahụ[b] ka anyị ji ụgwọ, ka anyị bie ndụ dịka anụ ahụ si achị.
  rationale: The revision preserves the source’s conclusion, address, debt metaphor, and repeated σάρξ terminology, while correcting the Igbo clause linkage. “Ka anyị bie ndụ dịka anụ ahụ si achị” expresses the excluded τρόπο of life without replacing Paul’s term with an interpretive rendering in the main text.
