id: ROM.8.38
reference: Romans 8:38
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: ig
  text: N’ihi na ekwenyesiri m ike na ma ọnwụ ma ndụ, ma ndị mmụọ ozi ma ndị ọchịchị[a], ma ihe ndị dị ugbu a ma ihe ndị ga-abịa, ma ike,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ndị ọchịchị” ka ọ bụrụ “ndị isi ọchịchị”; o nwere ike izo aka n’ike ndị ọchịchị nke eluigwe na ụwa ma ọ bụ nke mmụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: ekwenyesiri m ike
  rationale: Oge perfect n’asụsụ Grik na-egosi nkwenye siri ike nke dịgide ruo ugbu a; okwu Igbo a na-egosipụta ọnọdụ ahụ n’asụsụ doro anya ma dị ugbu a.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe bu ya ụzọ dị ka nkọwa ma ọ bụ ihe na-akwado ya.
- source_word: οὔτε ... οὔτε
  choice: ọ bụghị ... ọ bụghịkwa
  rationale: Ikwughachi usoro a na-echekwa ike na ụda ndepụta Pọl, ma na-ada nke ọma n’Igbo.
- source_word: θάνατος
  choice: ọnwụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ ma bụrụ okwu Igbo a na-ejikarị eme ihe.
- source_word: ζωή
  choice: ndụ
  rationale: Nke a bụ ntụgharị kwụ ọtọ, ọ na-anọchikwa ọnwụ n’usoro ihe abụọ na-emegiderịta onwe ha.
- source_word: ἄγγελοι
  choice: ndị mmụọ ozi
  rationale: Ọ bụ ezie na okwu Grik ahụ nwekwara ike ịpụta ndị ozi, gburugburu okwu a nke na-edepụta ihe ndị karịrị mmadụ na-akwado ndị mmụọ ozi.
- source_word: ἀρχαὶ
  choice: ndị ọchịchị
  rationale: Okwu ahụ nwere ike izo aka n’aka ndị na-achị ma ọ bụ n’ikike eluigwe na ụwa. Nhọrọ a na-agụ mfe ma hapụkwa obosara ihe okwu Grik ahụ nwere ike ịpụta.
- source_word: ἐνεστῶτα
  choice: ihe ndị dị ugbu a
  rationale: Ọ na-ezo aka n’ihe ma ọ bụ ọnọdụ ndị dị ugbu a, ma na-echekwa ọdịdị okwu sara mbara nke Grik.
- source_word: μέλλοντα
  choice: ihe ndị ga-abịa
  rationale: Ọ na-ezo aka n’ihe ndị dị n’ọdịnihu ma na-adaba n’usoro ya na ihe ndị dị ugbu a.
- source_word: δυνάμεις
  choice: ike dị iche iche
  rationale: Nhọrọ a na-echekwa nghọta sara mbara nke nwere ike ịgụnye ndị nwere ike ime mmụọ ma ọ bụ ike ndị na-abụghị mmadụ, n’enweghị ịkọwa nke Pọl bu n’obi kpọmkwem.
theological_decisions:
- issue: Ma a ga-asụgharị ἀρχαὶ na δυνάμεις dị ka aha pụrụ iche nke ụdị ndị mmụọ ụfọdụ
  choice: E ji okwu sara mbara bụ “ndị ọchịchị” na “ike dị iche iche” mee ihe n’ahịrị bụ isi.
  alternative: “ndị isi ọchịchị” na “ndị nwere ike,” ma ọ bụ aha nkà mmụta okpukpe pụrụ iche maka ndị mmụọ
  rationale: O yikarịrị ka okwu ndị a hà na-agụnye ike eluigwe na ụwa ma ọ bụ nke mmụọ, ma okwu Grik ahụ anaghị amanye ka a kọwaa ha dị ka otu ụdị ndị mmụọ a kapịrị ọnụ. Ya mere, ntụgharị a na-echekwa esemokwu na obosara ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, doro anya ma dị ugwu mee ihe. E chekwara ndepụta na nkwughachi nke Grik. E tinyere akara nkọwa ala peeji [a] n’akụkụ “ndị ọchịchị,” bụ okwu nkọwa ahụ metụtara, kama itinye ya n’akụkụ “ndụ.” Akara rịkọm n’ọgwụgwụ na-egosi na ahịrịokwu ahụ na-aga n’ihu n’amaokwu na-esote.
