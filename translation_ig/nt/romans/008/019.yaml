  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: ig
  text: N’ihi na ihe e kere eke ji nnukwu atụmanya na-eche mkpughe nke ụmụ Chineke[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụ nwoke Chineke.” Okwu Grik ahụ ji ụdị nwoke, nke nwekwara ike imesi ọnọdụ ha dị ka ụmụ na ndị nketa ike.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi njikọ nkọwa amaokwu a na ihe e kwuru tupu ya, n’ụzọ Igbo na-ada nke ọma.
- source_word: ἀποκαραδοκία
  choice: ji oké atụmanya
  rationale: Na-egosipụta atụmanya siri ike na nke lekwasịrị anya n’ihe na-abịa; ijikọ ya na ngwaa ‘na-echere’ bụ ụzọ Igbo doro anya.
- source_word: κτίσεως
  choice: ihe niile e kere eke
  rationale: Na-enye echiche mkpokọta nke usoro okike dum n’ọnọdụ okwu a, ọ bụghị otu ihe e kere eke naanị.
- source_word: ἀποκάλυψιν
  choice: ka e kpughee
  rationale: Na-egosi ime ka ihe zoro ezo pụta ìhè n’ọdịnihu, dịka okwu Grik ahụ siri dị.
- source_word: υἱῶν
  choice: ụmụ ndị ikom
  rationale: Na-echekwa ụdị nwoke nke okwu Grik υἱῶν, ma na-ahapụ ihe ọ pụtara gbasara ọnọdụ ụmụ na ndị nketa ka ọ dị.
- source_word: θεοῦ
  choice: Chineke
  rationale: N’usoro ‘ụmụ ndị ikom Chineke,’ genitive a na-egosi mmekọrịta ha na Chineke n’Igbo ebumpụta ụwa.
- source_word: ἀπεκδέχεται
  choice: na-echere
  rationale: Na-egosi ichere ihe ga-abịa; ịdị ọkụ nke ichere ahụ dịlarị na ‘ji oké atụmanya,’ ya mere a zere ikwughachi otu echiche ugboro abụọ.
theological_decisions:
- issue: Ma a ga-asụgharị υἱῶν θεοῦ dịka ‘ụmụ ndị ikom Chineke’ ka ọ bụ ‘ụmụ Chineke.’
  choice: ụmụ ndị ikom Chineke
  alternative: ụmụ Chineke
  rationale: Okwu Grik ahụ bụ ụdị nwoke n’ọnụọgụ ọtụtụ, ma ‘ụmụ ndị ikom’ na-echekwakwa ụda gbasara ọnọdụ ịbụ nwa na onye nketa n’arụmụka Pọl. Ihe ọzọ a pụrụ ịsụgharị ya dị na nkọwa ala peeji ka a ghara izochi obosara ojiji ahụ.
translation_notes:
  register: Standard Igbo dị ugbu a, dị nsọ ma doo ndị nkịtị anya. A họọrọ ‘ihe niile e kere eke’ iji mee ka echiche mkpokọta nke κτίσις pụta ìhè; e debere akara nkọwa [a] ozugbo n’ebe okwu metụtara ya dị.
