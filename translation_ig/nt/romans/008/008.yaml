- from: Ma ndị nọ n’anụ ahụ enweghị ike ime ihe na-atọ Chineke ụtọ.[a]
  to: Ma ndị nọ n’anụ ahụ apụghị ịmasị Chineke.[a]
  rationale: The revision renders ἀρέσαι directly with “ịmasị Chineke,” preserving the source’s general assertion of inability rather than limiting it to particular acts. It retains “n’anụ ahụ” for σάρξ and improves the footnoted interpretive alternative for clarity and natural Standard Igbo.
  reviewer_model: gpt-5.6-terra
