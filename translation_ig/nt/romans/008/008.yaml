  text: Those who are in the flesh cannot please God[a].
translation:
  language: ig
  text: Ma ndị nọ n’anụ ahụ apụghị ịmasị Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “n’agwa mmehie.” Grik kwuru “n’anụ ahụ,” bụ́ okwu dị mkpa Pọl ji mee ihe n’ebe a.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: ndị nọ
  rationale: Nkebiokwu a na-arụ ọrụ dị ka aha, na-ezo aka n’otu ìgwè mmadụ nọ n’ọnọdụ a; “ndị nọ” bụ Igbo doro anya ma na-echekwa echiche nke ọnọdụ ha nọ ugbu a.
- source_word: δὲ
  choice: Ma
  rationale: N’ebe a, δέ na-egosi njikọ nwere ọdịiche n’ihe e kwuru tupu ya; “Ma” na-eme ka ọdịiche ahụ pụta ìhè n’Igbo.
- source_word: ἐν σαρκὶ
  choice: n’anụ ahụ
  rationale: A hapụrụ okwu Pọl n’ụdị ya nke pụtara “n’anụ ahụ,” ka njikọ echiche dị na Ndị Rom 8 ghara ifu ma ka a ghara idozi ihe okwu ahụ pụtara site n’ịkọwa ya naanị dị ka ọdịdị mmehie.
- source_word: ἀρέσαι
  choice: ime ihe na-atọ ... ụtọ
  rationale: Nke a bụ ụzọ Igbo nkịtị si ekwu echiche nke ịtọ mmadụ ụtọ, ma ọ na-adabara ngwaa a mgbe Chineke bụ onye a na-achọ ime ihe na-atọ ụtọ.
- source_word: θεῷ
  choice: Chineke
  rationale: E tinyere “Chineke” n’ime usoro okwu Igbo “ime ihe na-atọ Chineke ụtọ,” nke na-echekwa ọrụ dative Grik ahụ n'ụzọ ebumpụta ụwa.
- source_word: οὐ δύνανται
  choice: enweghị ike
  rationale: Nke a na-egosi n’ụzọ doro anya na ha enweghị ikike ime ya, dịka Grik negated ability si kwuo.
theological_decisions:
- issue: Otú e si asụgharị σάρξ n’ọnọdụ echiche Pọl a na-arụrịta ụka
  choice: n’anụ ahụ
  alternative: n’ọdịdị mmehie; n’okpuru ike anụ ahụ
  rationale: E debere okwu ahụ nso n’ụdị Grik iji chekwaa ịdị omimi na esemokwu echiche Pọl, kama ịtụnye otu nkọwa okpukpe kpọmkwem n’ime isi amaokwu. E nyere nkọwa ọzọ n’ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji “anụ ahụ” chekwaa isi okwu Pọl, ebe usoro “ime ihe na-atọ Chineke ụtọ” na-eme ka amaokwu ahụ bụrụ Igbo dị mfe nghọta.
