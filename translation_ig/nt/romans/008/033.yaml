  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: ig
  text: Ònye ga-ebo ndị Chineke họọrọ ebubo? Ọ bụ Chineke na-ekwupụta na ha bụ ndị ezi omume.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ndị Chineke họpụtara.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “Ònye ga-eweta ebubo megide ndị Chineke họọrọ?”'
    reason: lexical_alternative
  - marker: c
    text: 'Okwu ahụ bụ “na-ekwupụta na ha bụ ndị ezi omume” nwere echiche ikpe n''ụlọikpe: Chineke bụ onye na-ekwupụta na ha bụ ndị ezi omume.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: Ònye
  rationale: Okwu ajụjụ a na-amalite ajụjụ nkwuwa okwu; “Ònye” bụ ụzọ Igbo doro anya ma dịkwa mfe.
- source_word: ἐγκαλέσει
  choice: ga-ebo ... ebubo
  rationale: Ngwaa a nwere echiche ikpe n'ụlọikpe, ya bụ ibutere mmadụ ebubo; akpaalaokwu Igbo a na-echekwa echiche ahụ.
- source_word: κατὰ
  choice: ebo ndị ... ebubo
  rationale: N'usoro akpaalaokwu Igbo “ibo mmadụ ebubo,” echiche nke imegide ndị a na-ebo ebubo dị n'ime ihe owuwu ahụ, ya mere a chọghị ịsụgharị κατά iche.
- source_word: ἐκλεκτῶν θεοῦ
  choice: ndị Chineke họọrọ
  rationale: Adjective ahụ na-arụ ọrụ dị ka aha, genitive θεοῦ na-egosikwa onye họọrọ ha. Nsụgharị a bụ nke a na-aghọta ngwa ngwa ma ghara ime “elect” ka ọ bụrụ naanị aha nkà mmụta okpukpe.
- source_word: θεὸς
  choice: Ọ bụ Chineke
  rationale: Ihe owuwu a na-egosipụta Chineke ike dịka onye bụ isi n'ahịrịokwu a.
- source_word: ὁ δικαιῶν
  choice: na-agụ ha ná ndị ezi omume
  rationale: Participle a na-akọwa Chineke dị ka onye na-ekpebi n'ụzọ iwu na mmadụ bụ onye ezi omume. Ntinye “ha” na-eme ka Igbo na-aga nke ọma ma na-ezo aka n'ụzọ doro anya n'ebe ndị Chineke họọrọ nọ.
theological_decisions:
- issue: Ịsụgharị ἐκλεκτῶν n'ebughị usoro ozizi e mechara wulite n'ime okwu ahụ
  choice: ndị Chineke họọrọ
  alternative: ndị Chineke họpụtara
  rationale: “Ndị Chineke họọrọ” na-egosipụta ihe Grik kwuru n'ụzọ kpọmkwem ma na-ahapụ ịdị arọ na esemokwu nkà mmụta okpukpe ya ka ọ dị.
- issue: Echiche ikpe dị na ὁ δικαιῶν
  choice: Ọ bụ Chineke na-agụ ha ná ndị ezi omume
  alternative: Ọ bụ Chineke na-eme ka ha bụrụ ndị ezi omume
  rationale: 'N''ebe a, δικαιόω nwere ụda okwu ụlọikpe: Chineke na-ekwupụta ma ọ bụ na-ekpebi na ha bụ ndị ezi omume. Nhọrọ a anaghị agwakọta mkpebi ikpe ahụ na echiche nke ịgbanwe àgwà mmadụ.'
- issue: Ma a ga-agụ θεὸς ὁ δικαιῶν dịka nkwupụta ka ọ bụ ajụjụ ọzọ
  choice: 'nkwupụta: Ọ bụ Chineke na-agụ ha ná ndị ezi omume'
  alternative: 'ajụjụ: Chineke, onye na-agụ ha ná ndị ezi omume, ọ̀ ga-ebo ha ebubo?'
  rationale: Ederede Grik enweghị akara edemede mbụ nke ga-ekpebi nke a kpamkpam, mana ịgụ ya dịka nkwupụta dabara n'usoro ajụjụ nkwuwa okwu gbara ya gburugburu ma na-echekwa nkwusi ike dị na θεὸς.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji akpaalaokwu iwu “ibo mmadụ ebubo” chekwaa ụda ụlọikpe, ma zere okwu nkà mmụta okpukpe siri ike ebe okwu Igbo nkịtị nwere ike ikwu otu ihe ahụ.
