  rationale: The revision retains the source’s forensic and emphatic meaning in natural Standard Igbo. It corrects the malformed alternative in footnote b and uses an explicit declarative formulation for justification, with the accompanying note safeguarding the legal sense of the Greek rather than suggesting a denominationally specific account of the term.
