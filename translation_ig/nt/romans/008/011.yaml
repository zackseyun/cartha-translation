    issue: “nke” n’akụkụ “ahụ unu nke pụrụ ịnwụ anwụ”
    rationale: Ọ bụ ezie na a pụrụ ịghọta ya dịka ahụ n’ụdị mkpokọta, “ndị” na-eme ka ọtụtụ σώματα na “unu” pụta ìhè karịa, ma na-ewepụ ntakịrị mgbagwoju anya.
