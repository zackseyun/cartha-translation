  terminology: “Mmụọ,” “kpọlitere,” “bi n’ime,” na “Kraịst Jizọs” dabara adaba. Nkọwa ala peeji banyere “Kraịst” na-echekwa ike aha-ọkwá Χριστός n’enweghị itinye nkọwa okpukpe pụrụ iche.
  issues:
