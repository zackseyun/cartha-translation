id: ROM.8.11
reference: Romans 8:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: ig
  text: 'Ma ọ bụrụ na Mmụọ nke onye ahụ kpọlitere Jizọs n’ọnwụ bi n’ime unu, onye ahụ kpọlitere Kraịst Jizọs[b] n’ọnwụ ga-emekwa ka ahụ unu ndị pụrụ ịnwụ anwụ dị ndụ, n’ihi Mmụọ ya nke bi n’ime unu.[a]


    [a] A pụkwara ịsụgharị ya, “site na Mmụọ ya nke bi n’ime unu.”


    [b] “Kraịst” bụ aha-ọkwá pụtara “Mezaịa,” ya bụ, Onye E Tere Mmanụ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “site na Mmụọ ya nke bi n’ime unu.”
    reason: alternative_reading
  - marker: b
    text: “Kraịst” bụ aha-ọkwá pụtara “Mezaịa,” ya bụ, Onye E Tere Mmanụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: Mmụọ
  rationale: E ji mkpụrụedemede ukwu dee ya n’ihi na n’arụmụka Pọl ebe a, ọ na-ezo aka na Mmụọ Nsọ, ọ bụghị mmụọ mmadụ ma ọ bụ ike na-enweghị onye ọ bụ.
- source_word: ἐγείραντος / ἐγείρας
  choice: kpọlitere
  rationale: “Kpọlitere” bụ okwu Igbo doro anya maka ime ka onye nwụrụ anwụ bilie, ma na-echekwa echiche mbilite n’ọnwụ nke anụ ahụ.
- source_word: ἐκ νεκρῶν
  choice: n’ọnwụ
  rationale: Nke a bụ ụzọ Igbo dị mkpirikpi ma bụrụkwa nke e ji ekwu mbilite n’ọnwụ; ọ na-egosi na e si n’ọnọdụ ọnwụ kpọlite ya.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: bi / nke bi
  rationale: “Ibi n’ime” bụ asụsụ Igbo nkịtị nke na-echekwa echiche nke Mmụọ ịnọgide n’ime ndị kwere ekwe, ma na-ejikọ okwu abụọ ahụ n’amaokwu ahụ.
- source_word: Χριστὸν Ἰησοῦν
  choice: Kraịst Jizọs
  rationale: E debere usoro aha-ọkwá Grik. Ihe odide ala peeji kọwara na “Kraịst” ka bụ aha-ọkwá pụtara Mezaịa, ọ bụghị aha ezinụlọ.
- source_word: ζῳοποιήσει
  choice: ga-emekwa ka … dị ndụ
  rationale: Nke a na-echekwa oge ọdịnihu, okwu “ọzọkwa,” na omume Chineke nke inye ahụ mmadụ ndụ.
- source_word: θνητὰ σώματα
  choice: ahụ unu nke pụrụ ịnwụ anwụ
  rationale: Nke a na-edobe ahụ mmadụ n’ụzọ doro anya ma na-egosi na ahụ ndị a nọ n’okpuru ọnwụ.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: n’ihi Mmụọ ya nke bi n’ime unu
  rationale: 'διά sochiri accusative n’ihe odide SBLGNT, ya mere isi ederede na-enye ya nghọta nke ihe kpatara ya: “n’ihi.”'
theological_decisions:
- issue: Ma διὰ ya na accusative n’ahịrịokwu ikpeazụ ọ̀ na-egosi ihe kpatara ya ka ọ̀ bụ ụzọ e si mee ya
  choice: n’ihi Mmụọ ya nke bi n’ime unu
  alternative: site na Mmụọ ya nke bi n’ime unu
  rationale: Isi ederede gbasoro usoro okwu Grik e nyere, nke na-akwado nghọta causal. E tinyere nghọta instrumental a maara nke ọma n’ihe odide ala peeji ka a ghara izochi esemokwu ahụ.
- issue: Ike aha-ọkwá nke Χριστός
  choice: Kraịst Jizọs, tinyere nkọwa na “Kraịst” pụtara “Mezaịa”
  alternative: Mezaịa Jizọs
  rationale: “Kraịst” bụ okwu Ndị Kraịst na-asụ Igbo maara nke ọma; nkọwa ahụ na-egbochi ịghọta ya dị ka aha ezinụlọ ma na-echekwa ike aha-ọkwá ahụ.
translation_notes:
  register: Asụsụ ahụ bụ Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji “bi n’ime” mee ka njikọ dị n’etiti οἰκεῖ na ἐνοικοῦν pụta ìhè. E tinyere akara [b] ozugbo n’azụ “Kraịst Jizọs,” ebe [a] dị n’azụ ahịrịokwu ikpeazụ ọ na-akọwa.
