  source_fidelity: 'Isi ederede na-esochi SBLGNT nke ọma: ọ na-edobe ọnọdụ εἰ, Mmụọ nke onye kpọlitere Jizọs, mbilite n’ọnwụ, ọdịnihu ζῳοποιήσει, na nghọta causal nke διὰ + accusative n’ahịrịokwu ikpeazụ. “n’ọnwụ” bụ usoro Igbo a na-ahụkarị maka ἐκ νεκρῶν n’ọnọdụ a.'
