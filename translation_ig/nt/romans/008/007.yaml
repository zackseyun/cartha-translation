id: ROM.8.7
reference: Romans 8:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: ig
  text: n’ihi na echiche nke anụ ahụ[a] bụ iro megide Chineke; n’ihi na ọ naghị edo onwe ya n’okpuru iwu Chineke, ọ pụghịdị ime otú ahụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọdịdị mmehie.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu bu ya ụzọ; nke a bụ ụzọ Igbo nkịtị si egosipụta ihe kpatara ihe.
- source_word: φρόνημα
  choice: ụzọ ... si eche echiche
  rationale: Ọ bụghị naanị ikike iche echiche, kama ọ bụ ntụziaka na ọnọdụ nke uche; akpaokwu a na-eme ka echiche ahụ doo ndị na-agụ Igbo anya.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: A hapụrụ ihe oyiyi Pọl ji mee ihe kama ịkọwa ya ozugbo dị ka ‘ọdịdị mmehie’; e nyere nkọwa ọzọ n’ala peeji.
- source_word: ἔχθρα εἰς θεόν
  choice: iro megide Chineke
  rationale: Aha ‘iro’ na-echekwa ụdị aha nke ἔχθρα, ebe ‘megide Chineke’ na-egosi onye iro ahụ chere ihu.
- source_word: ὑποτάσσεται
  choice: na-edo onwe ya n’okpuru
  rationale: Nke a bụ okwu Igbo sitere n’okike nke na-egosi ido onwe n’okpuru ikike ma na-ekwe ka isiokwu ahụ bụrụ onye na-emeghị ya.
- source_word: νόμῳ τοῦ θεοῦ
  choice: iwu Chineke
  rationale: Ọ bụ nsụgharị doro anya na nke sitere n’okike maka njikọ aha Grik a.
- source_word: οὐδὲ γὰρ δύναται
  choice: ọ pụghịdị ime otú ahụ
  rationale: ‘Pụghịdị’ na-echekwa nkwusi ike nke οὐδέ na nkwupụta banyere enweghị ike, ọ bụghị naanị enweghị ọchịchọ.
theological_decisions:
- issue: Ma a ga-akọwa σάρξ ozugbo dị ka ‘ọdịdị mmehie’ ka a ga-edebe ihe oyiyi ‘anụ ahụ.’
  choice: E ji ‘anụ ahụ’ mee ihe n’ahịrịokwu, tinyekwa nkọwa ‘ọdịdị mmadụ nke mmehie na-achị’ n’ala peeji.
  alternative: ọdịdị mmehie
  rationale: N’ebe a, okwu ahụ abụghị naanị ahụ mmadụ nkịtị, ma idebe ‘anụ ahụ’ na-echekwa okwu ihe oyiyi Pọl na nnukwu njikọ ya na amaokwu ndị gbara ya gburugburu, n’enweghị ịmanye otu nkọwa naanị.
- issue: Ma a ga-eme ka okwu ikpeazụ pụta naanị dị ka enweghị ọchịchọ, ma ọ bụ dị ka enweghị ike.
  choice: 'A sụgharịrị ya dị ka nkwupụta doro anya banyere enweghị ike: ‘ọ pụghịdị ime otú ahụ.’'
  alternative: ọ chọghị ime otú ahụ
  rationale: δύναται na-ekwu kpọmkwem banyere ikike. Nsụgharị ahụ na-ahapụ esemokwu nkà mmụta okpukpe dị n’amaokwu ahụ ka ọ dị, n’etinyeghị usoro ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, mee ihe. ‘Ụzọ ... si eche echiche’ na-akọwa φρόνημα n’ụzọ sitere n’okike, ebe ‘anụ ahụ’ na-edebe okwu ihe oyiyi nke isi mmalite.
