id: ROM.8.26
reference: Romans 8:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: ig
  text: N’otu aka ahụ kwa, Mmụọ Nsọ na-enyere anyị aka n’adịghị ike anyị. N’ihi na anyị amaghị ihe anyị kwesịrị ikpe ekpere maka ya, dịka o kwesịrị, ma Mmụọ Nsọ n’onwe ya na-arịọchitere anyị site n’ịsụ ude ndị a na-apụghị iji okwu kwupụta[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “site n’ịsụ ude ndị na-enweghị okwu” ma ọ bụ “site n’ịsụ ude ndị a na-apụghị ikwu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: N’otu aka ahụ kwa
  rationale: Na-ejikọta okwu a na ihe Pọl kwuru tupu ya, ma bụrụkwa ụzọ Igbo dị mma isi kwuo ‘n’otu ụzọ ahụ kwa.’
- source_word: τὸ πνεῦμα
  choice: Mmụọ Nsọ
  rationale: N’ọnọdụ a, ‘Mmụọ’ na-ezo aka na Mmụọ Nsọ; ịkpọ ya aha otú a na-eme ka ihe a na-ekwu doo ndị na-agụ Igbo anya n’enweghị ịgbanwe onye e zoro aka na ya.
- source_word: συναντιλαμβάνεται
  choice: na-enyere anyị aka
  rationale: Ngwaa ahụ pụtara iso onye buru ibu arọ ma ọ bụ ịbịara ya enyemaka. Nke a bụ okwu Igbo doro anya nke na-egosi enyemaka n’adịghị ike.
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: n’adịghị ike anyị
  rationale: E chekwara otu ọnụọgụ dị na Grik, nke nwere ike ịgụnye adịghị ike mmadụ n’ozuzu ya n’enweghị ịkpa ókè n’etiti nke anụ ahụ na nke mmụọ.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: N’ihi na anyị amaghị ihe anyị kwesịrị ikpe n’ekpere dịka o kwesịrị
  rationale: Na-echekwa ma ihe a ga-arịọ n’ekpere ma ụkpụrụ nke ‘dịka o kwesịrị,’ kama ime ka nke ọ bụla n’ime ha funahụ.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Mmụọ Nsọ n’onwe ya
  rationale: ‘N’onwe ya’ na-egosipụta nkwusi ike dị na αὐτό ma na-egosi na Mmụọ Nsọ bụ onye na-eme ihe a.
- source_word: ὑπερεντυγχάνει
  choice: na-arịọchitere anyị arịrịọ
  rationale: Na-egosipụta omume ịrịọ arịrịọ n’aha ndị ọzọ, nke bụ isi echiche ngwaa a n’ebe a.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: ji ịsụ ude ndị a na-apụghị iji okwu kwupụta
  rationale: 'Na-echekwa ejighị n’aka nke ἀλαλήτοις: ọ pụrụ ịpụta ude a na-apụghị ikwu ma ọ bụ nke na-enweghị okwu, n’enweghị ikpebi nke ahụ gabiga ókè.'
theological_decisions:
- issue: Ma a ga-egosi Mmụọ Nsọ dịka onye na-eme ihe n’onwe ya, n’agbanyeghị na πνεῦμα bụ aha neuter na Grik
  choice: Mmụọ Nsọ n’onwe ya
  alternative: Mmụọ ahụ n’onwe ya / Mmụọ Nsọ
  rationale: Igbo enweghị mkpa ịgbaso grammatical gender nke Grik. Omume ndị e kwuru—inyere aka na ịrịọchitere arịrịọ—na nkwusi ike αὐτό kwadoro nsụgharị nke na-egosi onye na-eme ihe n’onwe ya, n’enweghị itinye ozizi ọzọ n’amaokwu ahụ.
- issue: Onye na-asụ ude ndị a
  choice: Ahịrịokwu ahụ jikọtara ude ndị ahụ na ịrịọchitere arịrịọ nke Mmụọ Nsọ, ma akọwaghị usoro ya karịa nke ahụ
  alternative: Ịkọwa ha kpọmkwem dịka ude nke ndị kwere ekwe ma ọ bụ dịka ụda Mmụọ Nsọ na-eme
  rationale: Grik na-ekwu na Mmụọ Nsọ na-arịọchitere arịrịọ ‘site na/na ude,’ ma ọ naghị akọwa n’ụzọ zuru ezu onye na-emepụta ude ndị ahụ. Nsụgharị ahụ anaghị edozi ihe edemede hapụrụ oghe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ikpe n’ekpere’ mee ihe maka προσεύχομαι, ‘adịghị ike’ maka ἀσθένεια, ma zere ịkọwa ude ndị ahụ n’ụzọ amaokwu ahụ n’onwe ya na-akọwaghị.
