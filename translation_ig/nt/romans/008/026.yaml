  naturalness: ‘Ihe anyị kwesịrị ikpe n’ekpere’ abụghị usoro Standard Igbo a na-ahụkarị. ‘Ihe anyị kwesịrị ikpe ekpere maka ya’ dị mma ma doo anya. ‘Na-arịọchitere anyị arịrịọ’ nwere ike ịghọta, ma ‘na-arịọchitere anyị’ dị mkpụmkpụ ma bụrụ ụzọ eke karịa isi sụgharị ὑπερεντυγχάνει.
