source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: ig
  text: Anyị makwa na ihe niile na-arụkọ ọrụ ọnụ iweta ezi ihe[a] nye ndị hụrụ Chineke n’anya—ndị a kpọrọ dịka nzube si dị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide na-agụ, “Chineke na-eme ka ihe niile rụkọọ ọrụ ọnụ iweta ezi ihe.”
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ, “dị ka nzube ya si dị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Anyị makwaara
  rationale: Oge ugbu a na-egosi ihe ha maara nke ọma; “makwaara” jikọkwara amaokwu a n’ụzọ dị nro na arụmụka gara aga.
- source_word: δὲ
  choice: -kwa- dị na “makwaara”
  rationale: E tinyere njikọ dị nro a n’ime ngwaa ka Igbo wee na-aga were were, n’enweghị ime ka ọ bụrụ nnukwu mmegide.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: nye ndị hụrụ Chineke n’anya
  rationale: “Nye” na-eburu ọrụ dative ahụ ma na-akọwa ndị ihe ọma ahụ metụtara.
- source_word: πάντα
  choice: ihe niile
  rationale: Nke a na-edobe obosara nke neuter plural ahụ n’enweghị ibelata ya ka ọ bụrụ naanị ọnọdụ ụfọdụ.
- source_word: συνεργεῖ
  choice: na-arụkọ ọrụ
  rationale: Nke a na-edobe echiche nke ihe niile ịrụkọ ọrụ, ma ghara itinye “Chineke” dịka isiokwu ebe ederede SBLGNT ekwughị ya kpọmkwem.
- source_word: εἰς ἀγαθόν
  choice: iweta ezi ihe
  rationale: Nke a bụ Igbo doro anya nke na-egosi nsonaazụ ma ọ bụ ebe ọrụ ahụ na-eduga.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: nye ndị a kpọrọ dị ka nzube si dị
  rationale: E debere nkọwa nke abụọ banyere otu ndị ahụ, tinyekwa usoro “dị ka … si dị” n’enweghị ịgbakwụnye onye nwe nzube ahụ.
- source_word: πρόθεσιν
  choice: nzube
  rationale: “Nzube” na-egosi ebumnuche e kpebiri ma dabara n’ọnọdụ okwu a.
- source_word: κλητοῖς
  choice: ndị a kpọrọ
  rationale: Nke a bụ okwu Igbo kwụ ọtọ nke na-edobe echiche Pọl banyere ndị a kpọrọ, n’enweghị ịkọwa usoro ọkpụkpọ ahụ karịa ihe ederede kwuru.
theological_decisions:
- issue: Isiokwu e kwuru n’ime συνεργεῖ
  choice: Ederede bụ “ihe niile na-arụkọ ọrụ iweta ezi ihe.”
  alternative: “Chineke na-eme ka ihe niile rụkọọ ọrụ iweta ezi ihe.”
  rationale: SBLGNT e nyere nwere πάντα συνεργεῖ ma o tinyeghị θεός dịka isiokwu kpọmkwem. Ya mere, isi ederede anaghị etinye “Chineke,” ma ihe odide ndị ọzọ kwuru ya n’ihe odide ala peeji.
- issue: Ma a ga-etinye onye nwe πρόθεσιν
  choice: “dị ka nzube si dị,” n’enweghị “ya.”
  alternative: “dị ka nzube ya si dị.”
  rationale: Ọnọdụ okwu ahụ na-egosi na ọ bụ nzube Chineke, ma Grik e nyere enweghị nnọchiaha onye nwe ihe. E debere nghọta ọzọ ahụ n’ihe odide ala peeji kama itinye ya n’isi ederede.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe dị ugbu a, kwụ ọtọ ma dị ùgwù. E jiri “nye ndị” ugboro abụọ mee ka njikọ otu ndị ahụ dị na Grik pụta ìhè, ebe akara ogologo kewara nkọwa nke abụọ n’enweghị ime ya otu ọhụrụ.
