id: ROM.8.5
reference: Romans 8:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: ig
  text: N’ihi na ndị na-ebi ndụ dị ka anụ ahụ si dị na-etinye uche ha n’ihe nke anụ ahụ, ma ndị na-ebi ndụ dị ka Mmụọ si dị na-etinye uche ha n’ihe nke Mmụọ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα
  choice: dị ka ọchịchọ anụ ahụ si dị
  rationale: N’ebe a, σάρξ abụghị nanị ahụ mmadụ; ọ na-egosi ndụ mmadụ nke ọchịchọ mmehie na-achị. Ịsị “ọchịchọ anụ ahụ” na-eme ka echiche ahụ doo onye Igbo nke oge a anya n’enweghị itinye nkọwa otu ụka.
- source_word: ὄντες
  choice: ndị na-ebi ndụ
  rationale: Ọ bụ ezie na okwu Grik pụtara n'ụzọ nkịtị “ndị nọ,” n’usoro κατὰ σάρκα ὄντες ọ na-akọwa ọnọdụ na ụzọ ndụ; “ndị na-ebi ndụ” bụ Igbo dị ndụ ma kwekọọ n’ihe Pọl na-ekwu.
- source_word: φρονοῦσιν
  choice: na-etinye uche ha
  rationale: Ngwaa a gụnyere ịtụkwasị uche, echiche, na ọchịchọ n’ihe; “na-etinye uche ha” na-egosipụta ntụziaka nke echiche mmadụ nke ọma.
- source_word: κατὰ πνεῦμα
  choice: dị ka Mmụọ si dị
  rationale: A na-ede “Mmụọ” na mkpụrụedemede ukwu iji gosipụta Mmụọ Nsọ, dịka ọdịiche dị n’etiti anụ ahụ na Mmụọ n’akụkụ akwụkwọ a si kwado, ma a naghị agbakwunye okwu “Nsọ” nke na-adịghị n’amaokwu Grik.
- source_word: τὰ τοῦ πνεύματος
  choice: ihe nke Mmụọ
  rationale: Nsụgharị a na-echekwa usoro na njikọ okwu Grik, ma na-ahapụ obosara nke ihe ndị metụtara ma ọ bụ sitere n’aka Mmụọ.
theological_decisions:
- issue: Ihe σάρξ pụtara n’amaokwu a
  choice: ọchịchọ anụ ahụ
  alternative: anụ ahụ
  rationale: “Anụ ahụ” naanị nwere ike ime ka a ghọta ya dịka ahụ mmadụ bụ ihe ọjọọ. “Ọchịchọ anụ ahụ” na-egosi ụzọ ndụ nke mmehie na-achị, n’agbanyeghị na ọ bụ ntakịrị nkọwa karịa okwu Grik.
- issue: Ma πνεῦμα ọ bụ mmụọ mmadụ ka ọ bụ Mmụọ Nsọ
  choice: Mmụọ
  alternative: mmụọ
  rationale: Ọnọdụ okwu ahụ na Rom 8 na ọdịiche Pọl na-eme na-akwado Mmụọ Nsọ. Ide ya “Mmụọ” na-egosipụta nke a, ma nsụgharị ahụ anaghị agbakwunye aha ọzọ.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji nhazi ahịrịokwu yiri ibe ya chekwaa ọdịiche Pọl mere n’etiti anụ ahụ na Mmụọ; e tinyeghị akara nkọwa ala peeji n’ihi na ọ dịghị nke dị mkpa.
