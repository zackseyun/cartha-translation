- from: N’ihi na ndị na-ebi ndụ dị ka ọchịchọ anụ ahụ si dị na-etinye uche ha n’ihe nke anụ ahụ, ma ndị na-ebi ndụ dị ka Mmụọ si dị na-etinye uche ha n’ihe nke Mmụọ.
  to: N’ihi na ndị na-ebi ndụ dị ka anụ ahụ si dị na-etinye uche ha n’ihe nke anụ ahụ, ma ndị na-ebi ndụ dị ka Mmụọ si dị na-etinye uche ha n’ihe nke Mmụọ.
  rationale: The revision removes the unsupported addition ‘ọchịchọ’ while preserving the source’s balanced contrast, the English POB’s ‘live according to,’ and the natural Standard Igbo phrasing of the draft. It does not add doctrinal explanation or alter the referent indicated by the English audit trail.
