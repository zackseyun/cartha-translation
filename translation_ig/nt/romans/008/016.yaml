  to: Mmụọ ahụ n’onwe ya na mmụọ anyị na-agba akaebe na anyị bụ ụmụ Chineke.[a]
  rationale: The revision replaces only the non-idiomatic verb phrase. “Mmụọ ahụ n’onwe ya na mmụọ anyị na-agba akaebe” retains the emphatic subject and the reciprocal/concurrent-witness sense of συμμαρτυρεῖ. The footnote preserves the plausible alternative in which the Spirit bears witness to or for our spirit, without presenting that disputed syntactic nuance as the sole meaning.
