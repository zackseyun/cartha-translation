  variant: Standard Igbo
source:
  edition: SBLGNT
  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: ig
  text: Mmụọ ahụ n’onwe ya na mmụọ anyị na-agba akaebe na anyị bụ ụmụ Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “Mmụọ ahụ n’onwe ya na-agbara mmụọ anyị akaebe na anyị bụ ụmụ Chineke.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: Mmụọ ahụ n’onwe ya
  rationale: ‘N’onwe ya’ na-echekwa nkwusi ike dị na αὐτό, ebe ‘Mmụọ ahụ’ na-ezo aka n’ụzọ doro anya na Mmụọ Nsọ e kwuru okwu ya n’akụkụ a.
- source_word: συμμαρτυρεῖ
  choice: na ... na-agbakọ akaebe
  rationale: Ngwaa a pụtara ịgba akaebe ọnụ ma ọ bụ iso onye ọzọ gbaa akaebe; ‘na-agbakọ akaebe’ na-echekwa echiche nke akaebe jikọrọ ọnụ.
- source_word: τῷ πνεύματι ἡμῶν
  choice: na mmụọ anyị
  rationale: 'Dativ a kacha dabaa dị ka mkpakọrịta: Mmụọ ahụ na mmụọ anyị na-agbakọ akaebe, ọ bụghị naanị na ọ na-agbara mmụọ anyị akaebe.'
- source_word: ὅτι ἐσμὲν
  choice: na anyị bụ
  rationale: Nke a na-asụgharị ahịrịokwu ọdịnaya nke ὅτι webatara n’ụzọ kwụ ọtọ ma bụrụkwa Igbo eke.
- source_word: τέκνα θεοῦ
  choice: ụmụ Chineke
  rationale: τέκνα pụtara ụmụ n’enweghị ịkpa ókè n’etiti nwoke na nwanyị; ‘ụmụ Chineke’ bụ okwu Igbo dị mfe ma na-echekwa mmekọrịta ezinụlọ ahụ.
theological_decisions:
- issue: Ma συμμαρτυρεῖ na τῷ πνεύματι ἡμῶν pụtara ịgba akaebe ‘na’ mmụọ anyị ka ọ bụ ‘nye’ mmụọ anyị
  choice: Mmụọ ahụ na mmụọ anyị na-agbakọ akaebe
  alternative: Mmụọ ahụ na-agbara mmụọ anyị akaebe
  rationale: Mkpụrụokwu σύν dị n’ime συμμαρτυρεῖ na-akwado echiche nke iso ma ọ bụ ịgbakọ akaebe. A naghị edozi esemokwu ahụ n’ụzọ zoro ezo; e debere nsụgharị ọzọ n’ala peeji.
- issue: Ụdị okwu e ji ezo aka na Mmụọ Nsọ
  choice: Mmụọ ahụ n’onwe ya
  alternative: Mmụọ ahụ n’onwe ya kpọmkwem
  rationale: Asụsụ Igbo anaghị achọ ịhọrọ nnọchiaha nwoke ma ọ bụ ihe dịka Bekee si achọ. ‘N’onwe ya’ na-egosi onye na-eme ihe ma na-echekwa nkwusi ike nke Grik n’enweghị itinye okike ụtọasụsụ na-adịghị na Igbo.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ịgbakọ akaebe’ na-egosipụta akaebe ọnụ nke συμμαρτυρεῖ; e tinyere nsụgharị ‘ịgbara ... akaebe’ n’ala peeji iji chekwaa nghọta ọzọ a pụrụ inwe.
