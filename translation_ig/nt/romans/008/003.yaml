id: ROM.8.3
reference: Romans 8:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: ig
  text: N’ihi na Chineke, site n’izite Ọkpara nke ya n’oyiyi anụ ahụ nke mmehie[d] nakwa maka mmehie[c], mara mmehie ikpe n’anụ ahụ—ihe iwu ahụ na-enweghị ike ime n’ihi na anụ ahụ mere ka iwu ahụ ghara ịdị ike[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ ka nso n’okwu Grik, “enweghị ike nke iwu ahụ.”
    reason: lexical_alternative
  - marker: b
    text: “Anụ ahụ” n’ebe a na-ezo aka n’ọnọdụ mmadụ nke adịghị ike mmehie metụtara. Ụfọdụ nsụgharị na-akọwa ya dịka “agwa mmehie,” ma nke ahụ dị nkọwa karịa okwu Grik n’onwe ya.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “dị ka àjà mmehie.” Okwu Grik a pụrụ inwe echiche àjà, dịka ojiji ya n’Akwụkwọ Nsọ Grik si dị.
    reason: alternative_reading
  - marker: d
    text: “N’oyiyi anụ ahụ nke mmehie” na-ekwusi ike na Ọkpara ghọrọ mmadụ n’ezie, ma okwu ahụ anaghị ekwu na mmehie dị n’ime ya.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: ihe iwu ahụ na-apụghị ime
  rationale: Nkebiokwu a na-egosi ihe iwu ahụ na-enweghị ike ịrụzu. Nsụgharị a bụ Igbo doro anya ma na-edobe echiche nke enweghị ike.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: ebe ọ bụ na anụ ahụ mere ka ọ ghara ịdị ike
  rationale: Nke a na-egosi na adịghị ike iwu ahụ sitere n’anụ ahụ, ọ bụghị na iwu ahụ n’onwe ya dị njọ. Ọ bụ ụzọ dị mfe nghọta isi kwuo njikọ ihe kpatara ya n’Igbo.
- source_word: πέμψας
  choice: site n’izite
  rationale: Aorist participle a na-egosi ụzọ Chineke si mee ihe iwu na-apụghị ime; ‘site n’izite’ na-edobe ọrụ instrumental ahụ.
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: Ọkpara nke ya
  rationale: ‘Nke ya’ na-edobe nkwusi ike dị na ἑαυτοῦ ma ghara ịgbakwụnye nkọwa ozizi na-adịghị na ederede.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: n’oyiyi anụ ahụ nke mmehie
  rationale: Nsụgharị a na-edobe ma ‘oyiyi’ ma njikọ ‘anụ ahụ’ na ‘mmehie,’ n’akọwaghị ihe karịrị ihe Grik kwuru.
- source_word: περὶ ἁμαρτίας
  choice: maka mmehie
  rationale: Nke a na-edobe obosara na mgbagwoju anya nke okwu Grik; echiche àjà mmehie dị mkpa, ma e debere ya n’okpuru peeji kama idozi ya kpamkpam n’ahịrị bụ isi.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: o mara mmehie ikpe
  rationale: Nke a na-edobe ike okwu ikpe dị na κατέκρινε ma bụrụkwa okwu Igbo ndị mmadụ na-aghọta.
- source_word: ἐν τῇ σαρκί
  choice: n’anụ ahụ
  rationale: Grik etinyeghị nnọchiaha dịka ‘n’anụ ahụ ya.’ Ya mere, a hapụrụ okwu ahụ n’ụdị ya dị mkpirikpi iji ghara ịkọwapụta onye nwe anụ ahụ karịa ka ederede si mee.
theological_decisions:
- issue: Ihe σάρξ pụtara n’amaokwu a
  choice: A sụgharịrị ya ‘anụ ahụ,’ ọ bụghị ‘agwa mmehie.’
  alternative: agwa mmehie; ọdịdị mmehie
  rationale: ‘Anụ ahụ’ na-edobe okwu ihe atụ Pọl ji rụọ ọrụ n’ebe abụọ a ma na-ahapụ njikọ dị n’etiti adịghị ike mmadụ na ọbịbịa Ọkpara n’anụ ahụ ka ọ dị.
- issue: Ihe περὶ ἁμαρτίας pụtara
  choice: maka mmehie
  alternative: dị ka àjà mmehie
  rationale: Okwu ahụ nwere ike ibu echiche àjà dịka ojiji Septuagint si dị, ma ‘maka mmehie’ na-edobe obosara asụsụ Grik. A kọwara echiche àjà ahụ n’okpuru peeji.
- issue: Ike okwu Kraịst dị na ‘n’oyiyi anụ ahụ nke mmehie’
  choice: E debere ‘oyiyi’ na ‘anụ ahụ nke mmehie’ ọnụ n’ahịrị bụ isi.
  alternative: n’anụ ahụ mmehie; n’anụ ahụ yiri nke ndị mmehie
  rationale: 'Nhọrọ a na-edobe esemokwu ederede n’onwe ya: Ọkpara bịara n’ezi ọnọdụ mmadụ, ma okwu ahụ anaghị akpọ ya onye mmehie.'
- issue: Onye anụ ahụ dị na ἐν τῇ σαρκί bụ nke ya
  choice: n’anụ ahụ
  alternative: n’anụ ahụ ya
  rationale: Ọ bụ ezie na ihe gbara amaokwu ahụ gburugburu nwere ike igosi anụ ahụ Ọkpara, Grik enweghị ‘ya’; ya mere, a hapụrụ obere mgbagwoju anya ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, nke dị nsọ ma dịkwa mfe nghọta. A họọrọ ‘Ọkpara’ maka υἱός n’ihi na ọ dabara na ndebanye Akwụkwọ Nsọ Igbo ma doo ndị na-agụ ya anya. E debere ‘anụ ahụ’ kama nkọwa ozizi dịka ‘agwa mmehie,’ ma jiri nkọwa ala peeji chekwaa ụzọ ndị ọzọ e nwere ike isi ghọta okwu ndị a.
