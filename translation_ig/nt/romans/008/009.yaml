id: ROM.8.9
reference: Romans 8:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: ig
  text: Ma unu anọghị n’anụ ahụ[a], kama unu nọ n’ime Mmụọ, ma ọ bụrụ na n’ezie Mmụọ Chineke bi n’ime unu. Ma ọ bụrụ na onye ọ bụla enweghị Mmụọ Mesaịa[b], onye ahụ abụghị nke ya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “n’ọdịdị mmehie.” N’asụsụ Grik, ọ bụ “n’anụ ahụ.”
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “Mmụọ Kraịst.”
    reason: lexical_alternative
  - marker: c
    text: N’ụzọ nkịtị, “onye ahụ abụghị nke ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: anụ ahụ
  rationale: E ji okwu nkịtị pụtara ‘flesh’ chekwaa okwu Pọl na esemokwu ọ na-etinye n’etiti ịnọ n’anụ ahụ na ịnọ n’ime Mmụọ, kama ịkọwa ya ozugbo dị ka ‘ọdịdị mmehie.’
- source_word: πνεῦμα
  choice: Mmụọ
  rationale: E ji mkpụrụedemede ukwu dee ya n’ihi na ihe gbara ya gburugburu kpọrọ ya Mmụọ Chineke na Mmụọ Mesaịa, ya bụ Mmụọ Nsọ.
- source_word: οἰκεῖ
  choice: bi
  rationale: ‘Bi’ bụ okwu Igbo dị mfe ma dị ebube nke na-egosi ịnọgide n’ime mmadụ dịka ebe obibi.
- source_word: Χριστοῦ
  choice: Mesaịa
  rationale: E sụgharịrị aha ọkwa Χριστός dị ka ‘Mesaịa,’ ọ bụghị dịka aha onwe onye, iji gosipụta echiche nke Onye E Tere Mmanụ.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: abụghị nke ya
  rationale: Nke a na-esochi usoro okwu Grik nke na-egosi ịbụ nke mmadụ, ma na-ahapụ onye nnọchiaha ‘ya’ ka ọ ghara ịkọwa ihe Grik akọwaghị kpọmkwem.
- source_word: εἴπερ
  choice: ma ọ bụrụ n’ezie na
  rationale: Nke a na-echekwa ọdịdị ọnọdụ dị n’okwu Grik, ma na-egosikwa na Pọl na-ekwu ya dịka ihe ọ na-atụ anya na ọ bụ eziokwu.
- source_word: Ὑμεῖς
  choice: unu
  rationale: Aha nnọchiaha ahụ pụtara ìhè ma nwee nkwusi ike na Grik; ‘Ma unu’ na-echekwa ọdịiche ahụ.
- source_word: οὗτος
  choice: onye ahụ
  rationale: Nke a na-anọchi otu onye n’ụzọ zuru mmadụ niile dịka Grik si eme, ma bụrụkwa okwu Igbo doro anya.
theological_decisions:
- issue: Ọdịiche Pọl mere n’etiti ‘n’anụ ahụ’ na ‘n’ime Mmụọ’
  choice: 'E chekwara okwu mpaghara ma ọ bụ ọnọdụ ndụ: ‘n’anụ ahụ’ na ‘n’ime Mmụọ.’'
  alternative: Ịkọwa ya dịka ‘n’okpuru ọchịchị ọdịdị mmehie’ na ‘ndụ Mmụọ na-achị.’
  rationale: Amaokwu ahụ na-ekwu maka ọnọdụ mmadụ n’ihe metụtara obibi Mmụọ Chineke. Idebe ‘anụ ahụ’ na ‘Mmụọ’ na-echekwa okwu nkà mmụta okpukpe Pọl n’ebughị ụzọ mechie ihe ọ pụtara n’otu nkọwa.
- issue: Onye ‘ya’ na-ezo aka na ya n’okwu ‘abụghị nke ya’
  choice: E debere onye nnọchiaha ‘ya’ n’enweghị ịkpọ onye ahụ aha ọzọ.
  alternative: Ịkọwa ya kpọmkwem dịka ‘abụghị nke Mesaịa’ ma ọ bụ ‘abụghị nke Chineke.’
  rationale: Mesaịa bụ onye kacha nso n’usoro ahịrịokwu ahụ, ma njikọ ya na ‘Mmụọ Chineke’ ka dịkwa n’ihe gbara amaokwu ahụ gburugburu. Ịhapụ ‘ya’ na-echekwa ihe Grik kwuru n’enweghị itinye nkọwa ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E ji ‘unu’ chekwaa onye nke abụọ n’ọnụọgụ ọtụtụ; e zere nkọwa ụka pụrụ iche. Akara [a], [b], na [c] niile dị n’ederede isi.
