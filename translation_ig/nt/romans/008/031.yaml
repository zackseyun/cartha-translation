  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: ig
  text: Gịnịzi ka anyị ga-ekwu banyere ihe ndị a?[a] Ọ bụrụ na Chineke na-akwado anyị,[b] ònye nọ megide anyị?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Gịnịzi ka anyị ga-ekwu dị ka nzaghachi nye ihe ndị a?”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Ebe ọ bụ na Chineke na-akwado anyị, ònye nọ megide anyị?”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν
  choice: Gịnịzi
  rationale: “Gịnị” na-egosipụta ajụjụ ahụ, ebe mgbakwunye “-zi” na-ebute nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a.
- source_word: ἐροῦμεν
  choice: ka anyị ga-ekwu
  rationale: Nke a na-egosipụta ọdịdị ajụjụ ntụgharị uche nke ngwaa ọdịnihu Grik ahụ n’Igbo a na-asụ ugbu a.
- source_word: πρὸς ταῦτα
  choice: maka ihe ndị a
  rationale: Ọ bụ ụzọ doro anya ma bụrụkwa nke e ji asụ Igbo maka ikwu okwu banyere ihe ndị a kọwara tupu amaokwu a; ihe odide ala peeji na-echekwa echiche nke ikwu ihe dị ka nzaghachi.
- source_word: εἰ
  choice: Ọ bụrụ na
  rationale: Nke a na-echekwa usoro ọnọdụ dị na Grik n’agbanyeghị na ihe gbara ya gburugburu na-egosi na Pọl anaghị enwe obi abụọ na Chineke dị n’akụkụ ndị nke ya.
- source_word: ὁ θεὸς
  choice: Chineke
  rationale: Nke a bụ ntụgharị kpọmkwem, nke a na-ejikarị eme ihe n’Igbo.
- source_word: ὑπὲρ ἡμῶν
  choice: dị n’akụkụ anyị
  rationale: N’ebe a, ὑπέρ na-egosi na Chineke na-akwado anyị ma na-eme ihe maka ọdịmma anyị; “dị n’akụkụ anyị” na-ezipụta nke a n’Igbo nkịtị.
- source_word: τίς καθ’ ἡμῶν
  choice: ònye ga-emegide anyị
  rationale: Nke a na-echekwa ajụjụ ịma aka nke Grik na echiche nke κατά dị ka mmegide, n’etinyeghị okwu ọzọ dịka “pụrụ” nke na-adịghị n’ihe odide ahụ.
theological_decisions:
- issue: Ike ọnọdụ dị na εἰ ὁ θεὸς ὑπὲρ ἡμῶν
  choice: Ọ bụrụ na Chineke dị n’akụkụ anyị
  alternative: Ebe ọ bụ na Chineke dị n’akụkụ anyị
  rationale: Isi ederede na-echekwa “ọ bụrụ na” nke Grik na usoro ajụjụ Pọl. Ihe gbara amaokwu ahụ gburugburu na-eme ka o doo anya na nke a abụghị obi abụọ banyere nkwado Chineke; ihe odide ala peeji na-egosi ntụgharị nke na-eme ka eziokwu a Pọl na-ewere dị ka nke e kwadoro pụta ìhè.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Gịnịzi” na-eme ka njikọ ya na arụmụka gara aga pụta ìhè; “dị n’akụkụ anyị” na-ezere nghọtahie nke nwere ike ime ma ọ bụrụ na a sụgharịa ya nanị dị ka ịnọ nso n’ebe mmadụ nọ.
