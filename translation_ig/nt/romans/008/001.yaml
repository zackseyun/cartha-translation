  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: ig
  text: Ya mere, ugbu a, ọ dịghị ikpe ọmụma ọ bụla dịịrị ndị nọ n’ime Mesaịa Jizọs.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka e dere n’oge e mesịrị gbakwụnyere, “ndị na-adịghị ebi ndụ dịka anụ ahụ si dị.” Ihe akaebe Grik ndị kacha ochie kwadoro agụmagụ dị mkpụmkpụ ahụ n’ebe a.
    reason: textual_variant
  - marker: b
    text: Ma ọ bụ “Kraịst Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: adịghị
  rationale: Ejikọtara ya na “ikpe ọmụma” iji kwuo n’ụzọ Igbo doro anya na ikpe ọmụma adịghị ma ọlị, na-enweghị ime ka ahịrịokwu ahụ sie ike nghọta.
- source_word: ἄρα
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl na-ewepụta site n’ihe ọ kọwara tupu nke a.
- source_word: νῦν
  choice: ugbu a
  rationale: E debere okwu oge a n’ụzọ pụtara ìhè, n’ihi na Pọl na-ekwu maka ọnọdụ dị ugbu a.
- source_word: κατάκριμα
  choice: ikpe ọmụma
  rationale: Ọ na-egosi mkpebi ikpe nke na-ama mmadụ ikpe, ọ bụghị nanị mmetụta mmadụ na-enwe na o mere ihe ọjọọ.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: ndị nọ n’ime Mesaịa Jizọs
  rationale: “Nọ n’ime” na-echekwa okwu Pọl banyere ịdị n’ime Mesaịa, kama ịkọwa ya naanị dị ka “n’ihi Mesaịa.”
- source_word: Χριστῷ
  choice: Mesaịa
  rationale: A sụgharịrị aha ọkwá Χριστός dịka “Mesaịa,” nke na-egosi Onye Chineke tere mmanụ, kama ime ya ka ọ bụrụ naanị aha mmadụ.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Nke a bụ nsụpe aha ahụ a na-aghọta nke ọma n’Igbo ọkọlọtọ.
theological_decisions:
- issue: Ihe okwu “n’ime Mesaịa Jizọs” pụtara
  choice: E debere ya dịka okwu na-akọwa ndị so na Mesaịa Jizọs ma dị n’otu na ya.
  alternative: “n’ihi Mesaịa Jizọs”
  rationale: ἐν n’ebe a nwere omimi nke isonye na ịdị n’otu na Mesaịa; ịsụgharị ya “n’ihi” ga-eme ka otu nkọwa mechie nkọwa ndị ọzọ okwu ahụ nwere ike ibu.
translation_notes:
  register: E ji Igbo ọkọlọtọ dị ugbu a, nke dị ùgwù ma dị mfe nghọta. A hapụrụ okwu “n’ime” ka ọ chekwaa omimi na esemokwu nkà mmụta okpukpe dị n’okwu Grik. E debere akara nkọwa ala peeji [b] na [a] n’ahịrịokwu ahụ.
