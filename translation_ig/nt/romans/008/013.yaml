  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na unu na-ebi ndụ n’ụzọ nke anụ ahụ[a], unu na-aga ịnwụ; ma ọ bụrụ na unu site na Mmụọ Nsọ na-egbu omume nke ahụ, unu ga-adị ndụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'N’asụsụ Grik, n’ụzọ nkịtị: “dị ka anụ ahụ si dị.” Okwu “anụ ahụ” dị iche na “ahụ” e ji mee ihe n’akụkụ nke abụọ nke amaokwu a.'
    reason: lexical_clarification
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-egosi na amaokwu a na-akọwa ma na-akwado ihe e kwuru tupu ya.
- source_word: κατὰ σάρκα
  choice: dị ka anụ ahụ si dị
  rationale: Na-edobe ihe atụ Pọl ji okwu σάρξ mee, na-enweghị ịgbanwe ya ozugbo ka ọ bụrụ nkọwa dịka ‘ọdịdị mmehie.’
- source_word: ζῆτε
  choice: unu na-ebi ndụ
  rationale: Na-egosipụta ngwaa nke oge ugbu a n’ọnọdụ nkwubi okwu a n’ụzọ Igbo na-ada nke ọma.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: unu na-aga ịnwụ
  rationale: Na-egosipụta μέλλω tinyere infinitive n’Igbo nke oge a, ma ghara ikwu na ọnwụ ahụ ga-abịa ozugbo.
- source_word: πνεύματι
  choice: site na Mmụọ ahụ
  rationale: A ghọtara dative a dị ka ihe e ji eme ihe; mkpụrụedemede ukwu na ‘ahụ’ na-egosi Mmụọ Nsọ dịka ọnọdụ Ndị Rom 8 si kwado.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: omume nke ahụ
  rationale: Na-edobe πράξεις dịka ‘omume’ na genitive τοῦ σώματος dịka ‘nke ahụ,’ n’enweghị itinye ‘ọjọọ’ nke na-adịghị n’ederede.
- source_word: θανατοῦτε
  choice: na-egbu
  rationale: Na-edobe ihe atụ siri ike nke ime ka omume ahụ nwụọ, n’asụsụ Igbo dị mfe ma doo anya.
- source_word: ζήσεσθε
  choice: unu ga-adị ndụ
  rationale: Na-anọchi anya future Greek n’ụzọ Igbo kwesịrị ekwesị.
theological_decisions:
- issue: Ma πνεύματι ọ na-ezo aka na Mmụọ Nsọ ka ọ bụ mmụọ mmadụ
  choice: Mmụọ Nsọ
  alternative: mmụọ mmadụ, ma ọ bụ okwu nwere ike ịpụta nke ọ bụla
  rationale: Okwu ndị gbara amaokwu a gburugburu na Ndị Rom 8 na-akwado nke ọma na Pọl na-ekwu banyere Mmụọ Nsọ dịka onye na-enyere ndị kwere ekwe aka igbu omume nke ahụ.
- issue: Ma σάρξ kwesịrị ịkọwa ozugbo dịka ‘ọdịdị mmehie’
  choice: E debere ihe atụ ahụ dịka ‘anụ ahụ’
  alternative: ọdịdị mmehie
  rationale: σάρξ nwere ọrụ sara mbara n’echiche Pọl; ịsụgharị ya ‘ọdịdị mmehie’ ga-emechi nkọwa ahụ karịa ka isi mmalite si eme. Ihe odide bụ isi na-edobe esemokwu dị n’etiti anụ ahụ, Mmụọ, na ahụ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E debere ‘anụ ahụ’ maka σάρξ na ‘ahụ’ maka σῶμα ka ọdịiche okwu Grik abụọ ahụ ghara ịla n’iyi; a zere okwu ụka ochie dịka ‘mortify.’
