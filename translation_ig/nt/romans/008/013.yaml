- from: N’ihi na ọ bụrụ na unu na-ebi ndụ dị ka anụ ahụ si dị[a], unu na-aga ịnwụ; ma ọ bụrụ na unu site na Mmụọ ahụ na-egbu omume nke ahụ, unu ga-adị ndụ.
  to: N’ihi na ọ bụrụ na unu na-ebi ndụ n’ụzọ nke anụ ahụ[a], unu na-aga ịnwụ; ma ọ bụrụ na unu site na Mmụọ Nsọ na-egbu omume nke ahụ, unu ga-adị ndụ.
