id: ROM.8.10
reference: Romans 8:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: ig
  text: Ma ọ bụrụ na Mesaịa ahụ nọ n’ime unu, ahụ́ nwụrụ anwụ[b] n’ihi mmehie, ma mmụọ bụ ndụ[a] n’ihi ezi omume.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmụọ bụ ndụ.” Okwu Grik ahụ nwere ike izo aka ma na mmụọ mmadụ nke Chineke mere ka ọ dị ndụ, ma na Mmụọ Nsọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ahụ́ nọ n’okpuru ọnwụ,” ma ọ bụ, “ahụ́ na-anwụ anwụ.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ihi ikpe ziri ezi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: Mezaịa ahụ
  rationale: A sụgharịrị aha-ọkwa ahụ dị ka “Mezaịa” kama iji ya naanị dị ka aha mmadụ; “ahụ” na-egosi na ọ bụ Mezaịa ahụ a maara.
- source_word: σῶμα
  choice: ahụ́
  rationale: Okwu a pụtara ahụ́ mmadụ, ọ bụghị anụ ahụ́ (σάρξ), ma na-edobe ọdịiche ya na mmụọ.
- source_word: νεκρὸν
  choice: nwụrụ anwụ
  rationale: Nke a na-edobe ike nkịtị nke okwu Grik ahụ, “nwụrụ anwụ,” kama ịkọwa ya ozugbo dị ka naanị ịnọ n’okpuru ọnwụ.
- source_word: διὰ ἁμαρτίαν
  choice: n’ihi mmehie
  rationale: διά tinyere accusative na-egosi ihe kpatara ya; okwu Igbo a bụ nke doro anya ma dịkwa nkenke.
- source_word: πνεῦμα
  choice: mmụọ
  rationale: E ji obere mkpụrụedemede malite ya iji ghara ikpebi ma ọ bụ mmụọ mmadụ nke Chineke mere ka ọ dị ndụ, ka ọ bụ Mmụọ Nsọ n’onwe ya.
- source_word: ζωὴ
  choice: bụ ndụ
  rationale: ζωή bụ aha pụtara “ndụ,” ọ bụghị adjective pụtara “dị ndụ”; ntụgharị a na-edobe usoro okwu Pọl dị mkpụmkpụ ma sie ike.
- source_word: διὰ δικαιοσύνην
  choice: n’ihi ezi omume
  rationale: N’ebe a δικαιοσύνη na-eburu echiche nke righteousness; “n’ihi” na-edobekwa ihe kpatara nke διά.
theological_decisions:
- issue: Ihe πνεῦμα na-ezo aka na ya
  choice: mmụọ
  alternative: Mmụọ
  rationale: Ọ nwere ike ịbụ mmụọ onye kwere ekwe nke Chineke mere ka ọ dị ndụ, ma ọ bụ Mmụọ Nsọ. Isi ederede na ihe odide ala peeji na-edobe nghọtahie a kama idozi ya n’otu ụzọ.
- issue: Ike νεκρὸν mgbe ọ na-akọwa σῶμα
  choice: ahụ́ nwụrụ anwụ
  alternative: ahụ́ nọ n’okpuru ọnwụ; ahụ́ ga-anwụ anwụ
  rationale: Ọ bụ ezie na Pọl nwere ike na-ekwu maka ahụ́ nke mmehie mere ka ọ bụrụ nke ga-anwụ, okwu Grik ahụ n’onwe ya bụ “nwụrụ anwụ.” A hapụrụ nkọwa ndị ọzọ n’ihe odide ala peeji.
translation_notes:
  register: E ji asụsụ Igbo ọkọlọtọ nke oge a, dị ugwu ma dị mfe nghọta. E debere ahịrịokwu Pọl dị mkpụmkpụ na ọdịiche dị n’etiti ahụ́ na mmụọ, ma e zere idozi n’ike ihe okwu Grik ahụ hapụrụ ka ọ nwee nghọta abụọ.
