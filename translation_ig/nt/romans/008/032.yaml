id: ROM.8.32
reference: Romans 8:32
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: ig
  text: N’ezie, onye na-emereghị Nwa ya nwoke ebere, kama o nyefere ya n’ihi anyị niile[a]—olee otú ọ na-agaghị enye anyị ihe niile ya na ya n’amara?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “maka anyị niile.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “jiri obi ọma nye anyị ihe niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: Onye ahụ nke
  rationale: Na-ezo aka n’ebe Chineke nọ n’okwu ndị bu ụzọ ma na-egosipụta nkwusi ike nke γε n’ụzọ Igbo na-aga nke ọma.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: Ọkpara nke ya
  rationale: “Nke ya” na-echekwa nkwusi ike nke ἰδίου, ebe “Ọkpara” na-egosi mmekọrịta pụrụ iche nke onye a na-ekwu banyere ya.
- source_word: οὐκ ἐφείσατο
  choice: na-ahapụghị ... ka ihe ghara ime ya
  rationale: Nke a na-enye nghọta sitere n’okwu φείδομαι—ịchebe ma ọ bụ ịhapụ onye ka ahụhụ ghara iru ya—n’Igbo doro anya, n’agbanyeghị na ọ bụ nkọwa karịa otu mkpụrụokwu.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: n’ihi anyị niile
  rationale: Na-echekwa echiche nke ime ihe maka uru ma ọ bụ n’aha mmadụ niile, n’enweghị ịmanye nkọwa teknụzụ gbasara nnọchi.
- source_word: παρέδωκεν αὐτόν
  choice: nyefere ya
  rationale: “Nyefere ya” na-egosipụta inyefe ya n’aka ndị ọzọ, ya bụ inyefe ya n’ahụhụ na ọnwụ, n’enweghị ime ka okwu ahụ dị nro.
- source_word: πῶς οὐχὶ καὶ
  choice: olee otú ọ na-agaghị ...
  rationale: Na-echekwa ajụjụ nkwupụta nke Pọl na nkwubi okwu sitere n’onyinye ka ukwuu ruo n’onyinye ndị ọzọ.
- source_word: σὺν αὐτῷ
  choice: esokwa ya
  rationale: Na-egosipụta n’ụzọ Igbo ebumpụta ụwa na onyinye ndị ọzọ na-abịa “ya na” Ọkpara ahụ.
- source_word: τὰ πάντα
  choice: ihe niile
  rationale: Ọ bụ ntụgharị sara mbara ma kpọmkwem, nke na-ahapụghị oke okwu Pọl n’ụzọ e mere nkọwa.
- source_word: ἡμῖν
  choice: nye anyị
  rationale: Na-etinye onye a na-enye ihe n’ọnọdụ Igbo kwesịrị ekwesị.
- source_word: χαρίσεται
  choice: jiri amara nye
  rationale: Na-echekwa echiche nke inye n’efu na n’amara dị na χαρίζομαι, kama ịsụgharị ya nanị dịka “nye.”
theological_decisions:
- issue: Ma a ga-eme ka ὑπὲρ ἡμῶν πάντων kwuo kpọmkwem na Kraịst nọchiri anya anyị n’ụzọ teknụzụ
  choice: n’ihi anyị niile
  alternative: n’aha anyị niile
  rationale: Okwu Grik na-egosi na ihe ahụ mere maka uru anyị ma nwee ike ịgụnye ime ihe n’aha anyị; ntụgharị isi na-ahapụ obosara ahụ kama ịkpọchi ya n’otu usoro nkà mmụta okpukpe.
- issue: Ihe “ihe niile” pụtara
  choice: ihe niile
  alternative: ihe ọma niile
  rationale: E tinyebeghị “ọma” n’akwụkwọ Grik. A hapụrụ okwu ahụ ka ọ dị sara mbara, ebe ọnọdụ gburugburu amaokwu ahụ na-achịkwa nghọta ya.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ùgwù ma bụrụ nke ndị mmadụ taa na-aghọta. E ji ajụjụ nkwupụta chekwaa usoro na ike okwu Grik. E tinyeghị ozizi otu ụka n’okwu ahụ.
