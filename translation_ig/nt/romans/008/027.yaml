  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: ig
  text: Onye na-enyocha obi mmadụ maara ihe Mmụọ ahụ bu n’uche, n’ihi na Mmụọ ahụ na-arịọchitere ndị nsọ dị ka Chineke si chọrọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ụzọ kwekọrọ na Chineke.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: na-enyocha
  rationale: “Na-enyocha” na-egosi omume ịchọpụtacha ihe dị n’ime, ma dịkwa mfe nghọta n’Igbo nke oge a.
- source_word: καρδίας
  choice: obi
  rationale: “Obi” na-edobe ihe atụ Akwụkwọ Nsọ nke na-ezo aka n’ime mmadụ, n’agbanyeghị na okwu Grik ahụ dị n’ụdị ọtụtụ.
- source_word: τί τὸ φρόνημα τοῦ πνεύματος
  choice: ihe Mmụọ bu n’uche
  rationale: Nkebi a bụ ụzọ Igbo dị ndụ si kwuo echiche ma ọ bụ ebumnuche dị n’uche Mmụọ; ọ na-ezere ntụgharị siri ike nke na-agaghị ada ka Igbo nkịtị.
- source_word: τοῦ πνεύματος
  choice: Mmụọ
  rationale: Ọnọdụ amaokwu a na Ndị Rom 8 na-egosi na ọ bụ Mmụọ Nsọ ka a na-ekwu maka ya.
- source_word: ἐντυγχάνει
  choice: na-arịọchitere ... arịrịọ
  rationale: Nke a na-egosi ịrịọ arịrịọ n’aha ndị ọzọ, kwekọọkwa n’ọrụ Mmụọ a kọwara n’amaokwu bu ụzọ.
- source_word: ὑπὲρ ἁγίων
  choice: ndị nsọ
  rationale: “Ndị nsọ” bụ okwu Akwụkwọ Nsọ a maara nke ọma maka ndị Chineke kewapụrụ onwe ya.
- source_word: κατὰ θεὸν
  choice: n’ụzọ kwekọrọ na Chineke
  rationale: Nke a na-edobe okwu ahụ n’ụzọ zuru ezu n’ebughị ụzọ tinye “uche Chineke,” nke na-adịghị kpọmkwem n’ihe odide Grik.
theological_decisions:
- issue: Ma a ga-akọwa κατὰ θεὸν ozugbo dị ka “dị ka uche Chineke si dị”
  choice: n’ụzọ kwekọrọ na Chineke
  alternative: dị ka uche Chineke si dị
  rationale: Ihe ọ pụtara nwere ike ịgụnye uche Chineke, ma okwu “uche” adịghị kpọmkwem n’ihe odide Grik. Isi amaokwu ahụ na-edobe mkpirikpi okwu ahụ na nghọta ime mmụọ ya n’emeghị ka otu nkọwa bụrụ naanị nke ga-ekwe omume.
translation_notes:
  register: E ji Igbo izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. “Ihe Mmụọ bu n’uche” bụ okwu Igbo dị ndụ; “n’ụzọ kwekọrọ na Chineke” na-edobe mgbagwoju anya dị na isi mmalite, ebe nkọwa ọzọ dị n’ala peeji.
