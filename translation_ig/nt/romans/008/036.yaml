  to: 'Dị ka e dere ya: “Ọ bụ n’ihi gị ka a na-egbu anyị ụbọchị dum; e weere anyị dịka atụrụ ndị a ga-egbu[a].”'
  rationale: The revision removes an unsupported nuance (‘ogologo’), improves the idiomatic flow of the quotation formula, and retains the Greek’s ongoing suffering, passive reckoning, plural voice, and slaughter imagery without interpretive expansion.
