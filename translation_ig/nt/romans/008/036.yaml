  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: ig
  text: 'Dị ka e dere ya: “Ọ bụ n’ihi gị ka a na-egbu anyị ụbọchị dum; e weere anyị dịka atụrụ ndị a ga-egbu[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “e lere anyị anya dịka atụrụ ndị a ga-egbu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Dị nnọọ ka
  rationale: Na-ewebata ihe e hotara n’Akwụkwọ Nsọ ma na-ejigide ike ntụnyere dị na Grik.
- source_word: γέγραπται
  choice: e dere ya
  rationale: Ọ bụ ụzọ Igbo doro anya na nke a na-ejikarị ewebata ihe e dere n’Akwụkwọ Nsọ; ọ na-egosikwa na ihe ahụ e dere ka dị ire.
- source_word: Ἕνεκεν σοῦ
  choice: Ọ bụ n’ihi gị
  rationale: Na-ejigide ihe kpatara ahụ na okwu a gwara Chineke ozugbo.
- source_word: θανατούμεθα
  choice: a na-egbu anyị
  rationale: Ụdị ‘a na-’ na-egosipụta omume a na-eme ha ugboro ugboro ma ọ bụ nke na-aga n’ihu, dịka present passive Grik si dị.
- source_word: ὅλην τὴν ἡμέραν
  choice: ogologo ụbọchị dum
  rationale: Na-egosipụta oge ahụ dum n’ụzọ Igbo dị ndụ, ma zere nghọta nke ‘ụbọchị niile’ dịka ‘kwa ụbọchị.’
- source_word: ἐλογίσθημεν
  choice: e weere anyị
  rationale: N’ebe a λογίζομαι pụtara ile mmadụ anya ma ọ bụ ịtụle ya dịka ihe; ‘e weere anyị’ bụ okwu Igbo eke ma doo anya.
- source_word: ὡς
  choice: dị ka
  rationale: Na-ewebata ntụnyere ahụ kpọmkwem.
- source_word: πρόβατα σφαγῆς
  choice: atụrụ ndị a ga-egbu
  rationale: Na-edobe onyinyo atụrụ e kpebiri maka igbu n’ụzọ ndị na-agụ Igbo ga-aghọta ozugbo.
theological_decisions:
- issue: Ihe e hotara na Abụ Ọma 44:22 gbasara ahụhụ ndị nke Chineke
  choice: E debere okwu ahụ n’ọnụ ọtụtụ mmadụ na echiche nke ịbụ ndị a na-etinye n’ihe ize ndụ ọnwụ mgbe niile.
  alternative: Ịkọwa ya kpọmkwem dịka igbu ndị nwụrụ n’ihi okwukwe ha.
  rationale: Ihe odide Grik akọwaghị ya naanị dịka ịnwụ n’ihi okwukwe. Ya mere, nsụgharị ahụ anaghị ebelata ma ọ bụ gbasaa ihe ọ pụtara site n’itinye nkọwa ozizi ọzọ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A nọgidere na-eji asụsụ ọtụtụ mmadụ (‘anyị’) na okwu a gwara Chineke (‘gị’), ma debeekwa ịdị arọ nke ihe e hotara n’Akwụkwọ Nsọ.
