    issue: ‘ogologo ụbọchị dum’ overstates the temporal expression.
    rationale: The Greek says ‘the whole day/all day long,’ not specifically ‘the entire long day.’ ‘Ụbọchị dum’ preserves the extent-of-time sense without added emphasis.
  - severity: low
    issue: The citation frame ‘Dị nnọọ ka e dere ya, sị:’ is somewhat cumbersome.
    rationale: ‘Dị ka e dere ya:’ naturally conveys καθὼς γέγραπται and introduces the quotation directly.
