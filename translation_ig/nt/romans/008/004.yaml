id: ROM.8.4
reference: Romans 8:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: ig
  text: ka ihe ziri ezi Iwu ahụ chọrọ wee mezuo n’ime anyị, bụ́ ndị na-adịghị ebi ndụ n’ụzọ anụ ahụ kama n’ụzọ Mmụọ.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe Iwu ahụ chọrọ.”
    reason: lexical_alternative
  - marker: b
    text: “Anụ ahụ” n’ebe a pụtara ọdịdị mmadụ dara ada ma ọ bụ ụzọ ndụ nke si n’ebe Chineke nọ wezuga; ụfọdụ na-asụgharị ya “ọdịdị mmehie.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “mmụọ”; ihe gbara amaokwu a gburugburu na Ndị Rom 8 na-egosi na o yikarịrị ka ọ na-ekwu banyere Mmụọ Nsọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ka ... wee
  rationale: Usoro a bụ ụzọ Igbo si egosipụta ebumnuche ma ọ bụ ihe si na ya pụta n'ụzọ doro anya.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: ihe ezi omume Iwu ahụ chọrọ
  rationale: Nke a na-echekwa ma echiche nke ihe Iwu chọrọ ma ezi omume dị n'ihe ahụ, n'Igbo nkịtị ma dị ùgwù.
- source_word: πληρωθῇ
  choice: mezuo
  rationale: Ọ na-egosipụta mmezu a na-ekwu maka ya n'olu nnara, n'enweghị ịgbakwunye onye mere ya.
- source_word: ἐν ἡμῖν
  choice: n'ime anyị
  rationale: Ọ na-agbasochi ἐν anya ma zere ịsụgharị ya dịka 'site n'aka anyị,' nke ga-ekwusi ike n'ọrụ mmadụ karịa ihe Grik kwuru.
- source_word: περιπατοῦσιν
  choice: ebi ndụ
  rationale: N'okwu a, περιπατέω bụ ihe atụ gbasara ụzọ mmadụ si ebi ndụ; 'ebi ndụ' na-enye ndị Igbo oge a nghọta ahụ ozugbo.
- source_word: σάρξ
  choice: anụ ahụ
  rationale: Ọ na-echekwa okwu atụ Pọl ji mee ihe kama ịkọwa ya ozugbo dịka 'ọdịdị mmehie'; nkọwa dị n'okpuru.
- source_word: πνεῦμα
  choice: Mmụọ Nsọ
  rationale: Ihe gbara amaokwu a gburugburu na Ndị Rom 8 na-atụ aka karịsịa na Mmụọ Nsọ, ma a na-edebe ohere nke 'mmụọ' na nkọwa.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: dịka anụ ahụ si chọọ ... dịka Mmụọ Nsọ si chọọ
  rationale: Nke a na-egosipụta ibi ndụ dabere n'ọchịchọ ma ọ bụ nduzi nke nke ọ bụla, ma na-edebe nhazi okwu abụọ ahụ hà nhata.
theological_decisions:
- issue: Ma πνεῦμα ọ bụ mmụọ mmadụ ka ọ bụ Mmụọ Nsọ
  choice: Mmụọ Nsọ
  alternative: mmụọ
  rationale: Ihe gbara ya gburugburu na Ndị Rom 8 na-ekwu ọtụtụ ihe banyere ọrụ na ọchịchị Mmụọ Nsọ; agbanyeghị, okwu Grik ahụ n'onwe ya enweghị mkpụrụedemede ukwu nke ga-ekpebi nke a, ya mere e debere ụzọ ọzọ na nkọwa.
- issue: Ma ἐν ἡμῖν ọ pụtara 'n'ime anyị' ka ọ bụ 'site n'aka anyị'
  choice: n'ime anyị
  alternative: site n'aka anyị; n'etiti anyị
  rationale: Nke a bụ ntụgharị kacha nso nke ἐν ma ọ naghị etinye n'amaokwu ahụ nkwupụta siri ike banyere ọrụ mmadụ nke okwu Grik ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri 'ebi ndụ' dochie ihe atụ 'ije ije' iji mee ka echiche gbasara omume ndụ doo anya. E debere 'Iwu' na mkpụrụedemede ukwu maka Iwu Chineke a na-ekwu maka ya n'okwu Pọl.
