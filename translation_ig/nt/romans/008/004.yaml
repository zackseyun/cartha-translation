  to: ka ihe ziri ezi Iwu ahụ chọrọ wee mezuo n’ime anyị, bụ́ ndị na-adịghị ebi ndụ n’ụzọ anụ ahụ kama n’ụzọ Mmụọ.[a][b][c]
  rationale: 'The revision replaces the added concept of desire with a direct and natural rendering of κατά: ''n’ụzọ ...'' (''according to/in the way of''). It also uses ''Mmụọ'' in the text rather than expanding the Greek term to ''Mmụọ Nsọ''; the capitalization and contextual footnote indicate the likely referent while preserving the lexical ambiguity. The footnotes remain anchored and retain the English audit trail''s alternatives.'
