  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: ig
  text: Ma n’ihe ndị a niile, anyị na-emeri karịrị akarị site n’aka onye hụrụ anyị n’anya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị na-enwe mmeri karịrị akarị.”
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka onye a bụ Kraịst, dịka ihe gbara amaokwu a gburugburu si egosi.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Ọ na-egosi ọdịiche siri ike n’etiti ahụhụ ndị e depụtara na mbụ na mmeri ndị kwere ekwe na-enwe; “Ma” bụ okwu Igbo doro anya ma kwekọọ n’ọrụ njikọ a.
- source_word: ἐν τούτοις πᾶσιν
  choice: n’ihe ndị a niile
  rationale: Nke a na-esochi usoro okwu Grik nke ọma ma jikọta amaokwu a na mkpagbu na ihe isi ike niile e depụtara n’amaokwu bu ya ụzọ.
- source_word: ὑπερνικῶμεν
  choice: anyị na-enwe mmeri karịrị akarị
  rationale: Ngwaa a na-eme ka echiche νικάω, ‘imeri,’ sie ike. Okwu Igbo a na-egosi mmeri pụrụ nnọọ iche ma dị ukwuu, ma ka na-eme ka okwu ahụ bụrụ ngwaa n’echiche ya.
- source_word: διὰ
  choice: site n’aka
  rationale: Mgbe διά sochiri genitive n’ebe a, ọ na-egosi onye e ji nweta mmeri ma ọ bụ onye mere ka o kwe omume; “site n’aka” bụ ụzọ Igbo ebumpụta ụwa isi kwuo nke a.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: onye ahụ hụrụ anyị n’anya
  rationale: Articular aorist participle ahụ na-arụ ọrụ dịka aha. Nsụgharị a bụ Igbo dị mfe ma na-edebe onye a na-ekwu maka ya n’enweghị ịkpọ aha ya kpọmkwem.
- source_word: ἀγαπήσαντος
  choice: hụrụ … n’anya
  rationale: A sụgharịrị aorist participle ahụ n’ụdị oge gara aga nke na-ada nke ọma n’Igbo, ma na-edebe echiche nke ịhụnanya.
theological_decisions:
- issue: Onye bụ “onye ahụ hụrụ anyị n’anya”
  choice: E debere ya dịka “onye ahụ hụrụ anyị n’anya” n’ahịrị bụ isi, n’enweghị ịkpọ Kraịst aha.
  alternative: A pụrụ ịghọta ya dịka Kraịst, ma ọ bụ dịka Chineke n’ime Kraịst.
  rationale: Ihe gbara amaokwu a gburugburu na-atụ aka n’ebe Kraịst nọ, karịsịa Ndị Rom 8:35, ma okwu Grik n’onwe ya akpọghị aha ahụ kpọmkwem. Ya mere, nsụgharị ahụ na-edebe ntakịrị mgbagwoju anya dị n’ederede.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Mmeri karịrị akarị” na-egosipụta ike dị na ὑπερνικῶμεν n’enweghị itinye nkọwa okwukwe na-adịghị n’ederede; nkọwa ọzọ dị n’okpuru ala na-edebe ụdị ngwaa kpọmkwem.
