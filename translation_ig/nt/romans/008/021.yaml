id: ROM.8.21
reference: Romans 8:21
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: ig
  text: n’ihi na ihe e kere eke n’onwe ya kwa ka a ga-atọhapụ site n’ịbụ ohu nke ire ure, ka o banye n’ nnwere onwe nke ebube ụmụ Chineke[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nnwere onwe dị ebube nke ụmụ Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara olileanya e kwuru n’amaokwu bu ụzọ, ọ bụghị naanị iwebata ihe e kwuru.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: ihe niile e kere eke n’onwe ha kwa
  rationale: “N’onwe ha kwa” na-echekwa nkwusi ike na ihe e kere eke sokwa na ndị a ga-eme ka ha nwere onwe ha; “ihe niile e kere eke” na-egosi usoro okike dum n’ụzọ Igbo doro anya.
- source_word: ἐλευθερωθήσεται
  choice: a ga-atọpụ
  rationale: Nke a na-echekwa ọdịdị passive nke ngwaa ahụ na echiche nke ịtọhapụ onye nọ n’agbụ.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: n’ịbụ ohu nke ire ure
  rationale: “Ịbụ ohu” na-echekwa ike nke ihe atụ δουλεία, ebe “ire ure” na-egosi mmebi na ịla n’iyi nke ihe e kere eke karịa nrụrụ omume.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: banye na nnwere onwe
  rationale: “Banye na” na-egosi isi n’ọnọdụ otu gaa n’ọnọdụ ọhụrụ, dịka εἰς si mee.
- source_word: τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: dị ebube nke ụmụ Chineke
  rationale: Nke a bụ Igbo e ji eme ihe nke ọma maka nnwere onwe nke ebube ji mara, ebe nkọwa ala peeji na-edebe usoro genitive Grik nke ọma.
theological_decisions:
- issue: Ụzọ e si asụgharị τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: nnwere onwe dị ebube nke ụmụ Chineke
  alternative: nnwere onwe nke ebube ụmụ Chineke
  rationale: Isi ederede na-agụ nke ọma n’Igbo ma ghara itinye nkọwa ozizi ọzọ; nkọwa ala peeji na-echekwa usoro okwu Grik na ohere nghọta ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. A hapụrụ ihe atụ nke ịbụ ohu na nnwere onwe ka ha guzosie ike, ma zere okwu pụrụ iche nke otu ụka.
