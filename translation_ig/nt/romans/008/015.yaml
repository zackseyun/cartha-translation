id: ROM.8.15
reference: Romans 8:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: ig
  text: N’ihi na unu anataghị mmụọ nke ịbụ ohu ka unu laghachi n’egwu, kama unu natara Mmụọ nke nnabatara dịka ụmụ[a]; n’ime ya[b] ka anyị na-eti mkpu, sị, “Abba! Nna!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Mmụọ nke nkuchi.” Okwu Grik ahụ na-ekwu maka nnabata mmadụ n’ọnọdụ iwu dịka nwa nwoke, nke metụtara iketa ihe.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “site n’aka ya.” N’ụzọ nkịtị, Grik ahụ sịrị, “n’ime ya”; nnọchiaha ahụ bụ nke etiti, kwekọrọ na “Mmụọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: mmụọ nke ịgba ohu
  rationale: Nke a na-edobe ihe atụ nke ịbụ ohu na ntụnyere ya na ọnọdụ ọhụrụ nke ịbụ ụmụ, ma okwu “mmụọ” ahapụrụ ya n’ụzọ na-adịghị ekpebi kpamkpam ma ọ bụ mmetụta/ọnọdụ ka ọ bụ onye.
- source_word: πάλιν εἰς φόβον
  choice: nke ga-edughachi unu n’egwu
  rationale: Ọ bụ Igbo dị mfe ma doo anya nke na-echekwa πάλιν (‘ọzọ/azụ’) na εἰς φόβον (‘banye n’egwu’), n’agbanyeghị na e tinyere ‘unu’ ka ahịrịokwu ahụ bụrụ nke okike n’Igbo.
- source_word: πνεῦμα υἱοθεσίας
  choice: Mmụọ nke e ji were unu dị ka ụmụ nwoke
  rationale: “Mmụọ” na nnukwu mkpụrụedemede na-egosi Mmụọ Nsọ dịka ihe gbara ya gburugburu siri kwado; “were unu dị ka ụmụ nwoke” na-echekwa echiche iwu na ihe nketa dị na υἱοθεσία karịa naanị ‘nkuchi.’
- source_word: υἱοθεσίας
  choice: e ji were unu dị ka ụmụ nwoke
  rationale: Nhọrọ a na-echekwa kpọmkwem ọnọdụ nke nwa nwoke na ikike ihe nketa nke okwu Grik ahụ, n’enweghị ime ka ọ bụrụ naanị nkuchi n’ezinụlọ.
- source_word: ἐν ᾧ
  choice: n’ime ya
  rationale: Nke a na-esochi ihe owuwu Grik n’ụzọ dị nso ma na-ahapụ ma echiche nke ịdị ‘n’ime’ Mmụọ ma nke ịbụ site n’ọrụ ya, kama ịkpebi ya nanị dịka ngwa ọrụ.
- source_word: κράζομεν
  choice: anyị ji eti mkpu
  rationale: “Eti mkpu” na-echekwa ike na mmetụta miri emi nke κράζομεν ma bụrụkwa okwu Igbo a na-aghọta nke ọma.
- source_word: Αββα ὁ πατήρ
  choice: Aba! Nna!
  rationale: A sụgharịghị Aba kama e dere ụda ya; “Nna” na-asụgharị nkọwa Grik na-esochi ya. Akara mkpu na-egosi oku siri ike nke ahịrịokwu ahụ.
theological_decisions:
- issue: Ma πνεῦμα υἱοθεσίας ọ̀ bụ ‘mmụọ’ dịka ọnọdụ mmadụ, ka ọ bụ Mmụọ Nsọ n’onwe ya
  choice: Isi ederede jiri “Mmụọ” mee ka njirimara Mmụọ Nsọ pụta ìhè, ma jiri nkọwa nke υἱοθεσία nke na-edobe ntụnyere ahụ.
  alternative: “mmụọ nke ịbụ ụmụ” ma ọ bụ “mmụọ nke nkuchi”
  rationale: Ọnọdụ gbara amaokwu ahụ gburugburu na Rom 8 na nkwupụta a na-akpọku Nna na-akwado na ọ bụ Mmụọ Nsọ; ma ụdị okwu ahụ ka nwere ntụnyere ya na ‘mmụọ nke ịgba ohu,’ ya mere akọwaghị ya n’ụzọ ga-ehichapụ mgbagwoju anya ahụ kpamkpam.
- issue: Otu a ga-esi gosipụta υἱοθεσία n’enweghị iwepụ nghọta nke ịbụ nwa nwoke na onye nketa
  choice: “e ji were unu dị ka ụmụ nwoke”
  alternative: “nkuchi” ma ọ bụ “ịbụ ụmụ”
  rationale: Okwu Grik ahụ metụtara ọnọdụ iwu nke ụmụ nwoke, karịsịa ikike ihe nketa; nsụgharị a na-echekwa nke ahụ ma ọ naghị ekwu na ụmụ nwanyị esoghị na nkwa ahụ.
- issue: Ma ἐν ᾧ ga-abụ ‘n’ime ya’ ka ọ bụ ‘site n’aka ya’
  choice: “n’ime ya”
  alternative: “site n’aka ya”
  rationale: “N’ime ya” dị nso n’ụdị Grik ma na-echekwa ohere nghọta instrumental na locative kama idozi esemokwu ahụ n’otu ụzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ịgba ohu,” “edughachi unu n’egwu,” na “eti mkpu” maka okwu ndị nkịtị ga-aghọta; a hapụrụ “Aba” dịka aha oku Aramaik ma sụgharịa ὁ πατήρ dịka “Nna.”
