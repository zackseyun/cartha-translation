    issue: Ambiguous/awkward main-text rendering of κτίσις ἑτέρα
    rationale: “ihe ọ bụla ọzọ e kere eke” is not the clearest way to say ‘any other created thing’ in Standard Igbo and may be parsed awkwardly because “e kere eke” itself functions as a noun expression. “ihe ọ bụla ọzọ e kere” directly and naturally expresses the Greek sense.
