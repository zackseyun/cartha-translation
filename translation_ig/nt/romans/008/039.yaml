id: ROM.8.39
reference: Romans 8:39
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: ig
  text: ma ịdị elu, ma ịdị omimi, ma ihe ọ bụla ọzọ e kere[a] agaghị enwe ike ikewapụ anyị n’ịhụnanya Chineke nke dị na Mezaịa Jizọs[b], Onyenwe anyị.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ihe ọ bụla ọzọ dị n’ihe niile e kere,” ma ọ bụ “ihe ọzọ ọ bụla Chineke kere.”
    reason: lexical_alternative
  - marker: b
    text: A na-asụgharịkarị “Mezaịa Jizọs” dịka “Kraịst Jizọs.”
    reason: lexical_alternative
  - marker: c
    text: “Ịhụnanya Chineke” n’ebe a yikarịrị ka ọ pụtara ịhụnanya Chineke nwere n’ebe anyị nọ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: ịdị elu
  rationale: N’ihi na e jikọtara ya na βάθος, okwu a na-egosi akụkụ kasị elu; “ịdị elu” bụ Igbo doro anya nke na-echekwa ọdịiche ahụ.
- source_word: βάθος
  choice: ịdị omimi
  rationale: Ọ na-emegide ὕψωμα n’ahịrịokwu a ma na-egosi akụkụ kasị ala ma ọ bụ omimi; “ịdị omimi” bụ okwu Igbo ebumpụta ụwa.
- source_word: κτίσις ἑτέρα
  choice: ihe ọ bụla ọzọ e kere eke
  rationale: κτίσις nwere ike ịpụta ihe e kere eke ma ọ bụ ihe niile e kere; ebe a, nkebi a na-ekwusi ike na ọ dịghị ihe ọzọ dị n’usoro ihe Chineke kere nwere ike ikewapụ anyị n’ịhụnanya ya.
- source_word: δυνήσεται
  choice: agaghị enwe ike
  rationale: Nke a na-echekwa oge ọdịnihu na echiche nke inwe ikike ime ihe.
- source_word: χωρίσαι
  choice: ikewapụ
  rationale: “Ikewapụ” na-egosi ime ka ndị nọkọrọ ghara ịdịkọ, nke dabara n’echiche Pọl n’ebe a.
- source_word: ἀγάπης
  choice: ịhụnanya
  rationale: Nke a bụ okwu Igbo nkịtị, doro anya maka ἀγάπη.
- source_word: τοῦ θεοῦ
  choice: Chineke
  rationale: “Ịhụnanya Chineke” na-echekwa ụdị njikọ genitive nke Grik n’ebughị ụzọ kpebie n’ahịrịokwu bụ́ onye hụrụ onye n’anya.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dị na Mezaịa Jizọs
  rationale: “na” na-asụgharị ἐν n’ụzọ ebumpụta ụwa, ebe “Mezaịa” na-egosi na Χριστός bụ utu aha, ọ bụghị aha onwe onye.
- source_word: κυρίῳ
  choice: Onyenwe
  rationale: “Onyenwe” bụ nsụgharị Igbo a maara nke ọma maka κύριος ma dabara n’iji ya akọwa Jizọs n’ebe a.
theological_decisions:
- issue: Ihe genitive dị na “ịhụnanya Chineke” pụtara
  choice: E debere “ịhụnanya Chineke” n’ahịrịokwu bụ isi; ihe gbara ya gburugburu na-akacha akwado ịhụnanya Chineke nwere n’ebe anyị nọ.
  alternative: Ịhụnanya ndị kwere ekwe nwere n’ebe Chineke nọ, ma ọ bụ okwu nke nwere ike ịgụnye echiche abụọ ahụ.
  rationale: Ndị Rom 8:31–39 na-elekwasị anya n’ihe Chineke mere na mmesi obi ike na ọ dịghị ihe ga-ekewapụ ndị ya n’ịhụnanya ahụ. Otú ọ dị, e chekwara ụdị okwu Grik n’ahịrịokwu bụ isi, kọwaakwa ihe a na footnote.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro “ma… ma… ma…” na-echekwa nkwughachi οὔτε nke Grik na usoro ndepụta amaokwu ndị bu ya ụzọ. E jiri “Mezaịa” mee ka utu aha Χριστός pụta ìhè, ebe footnote na-enye ụdị ọdịnala “Kraịst.”
