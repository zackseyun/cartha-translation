  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: ig
  text: Keleenụ Rufọs[a], onye a họọrọ n’ime Onyenwe anyị, na nne ya, onye bụkwa nne m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “onye ahọpụtara n’ime Onyenwe anyị.” Okwu Grik ahụ nwekwara ike ịpụta “onye pụrụ iche” ma ọ bụ “onye pụtara ìhè.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Okwu a bụ iwu e nyere ọtụtụ mmadụ ka ha kelee mmadụ; “Keleenụ” bụ ụzọ Igbo dị mkpirikpi ma bụrụ nke e ji asụ ekele n’akwụkwọ ozi.
- source_word: Ῥοῦφον
  choice: Rufọs
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị dabara n’usoro ụda na mkpopụta Igbo.
- source_word: ἐκλεκτὸν
  choice: onye a họọrọ
  rationale: Nke a na-egosipụta isi echiche nke “onye a họọrọ” n’asụsụ Igbo doro anya, ma ọ naghị ekpebi ma okwu ahụ bụ naanị nhọpụta Chineke ka ọ bụkwa otuto maka onye pụrụ iche.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-echekwa ụzọ okwu Grik si gosi ọnọdụ ma ọ bụ mmekọrịta Rufọs nwere n’ime Onyenwe anyị, kama ịgbanwe ya ka ọ bụrụ “Onyenwe anyị họọrọ.”
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: nne ya, onye bụkwa nne m
  rationale: Grik kwuru n’ụzọ mkpirikpi, “nne ya na nke m.” Ụdị Igbo a na-eme ka njikọ ahụ doo anya ma na-echekwa okwu ịhụnanya Pọl ji kpọọ ya nne nke ya, n’enweghị ikwu na ọ bụ nne mụrụ ya.
theological_decisions:
- issue: Ihe ἐκλεκτὸν ἐν κυρίῳ pụtara
  choice: “onye a họọrọ n’ime Onyenwe anyị”
  alternative: “onye pụrụ iche n’ime Onyenwe anyị” ma ọ bụ nhọpụta nzọpụta n’echiche nkà mmụta okpukpe kpọmkwem
  rationale: Ụdị a na-edobe ohere na ọ bụ onye Chineke họọrọ, ma ihe odide ahụ nwekwara ike ito Rufọs dịka onye pụrụ iche ma ọ bụ pụtara ìhè n’ime Onyenwe anyị; ya mere, nkọwa ala peeji na-echekwa nghọta ndị ahụ.
- issue: Ihe “nne ya, onye bụkwa nne m” pụtara
  choice: E chekwara nkwupụta Pọl na nne Rufọs bụkwa nne ya n’echiche mmekọrịta na ịhụnanya.
  alternative: Ịghọta ya dịka nne mụrụ Pọl n’anụ ahụ
  rationale: Ọnọdụ akwụkwọ ozi a na-akwado nghọta na nwanyị ahụ lekọtara Pọl dịka nne, ọ bụghị na ọ bụ nne mụrụ ma Rufọs ma Pọl; ntụgharị ahụ anaghị agbasa nkọwa a karịa ihe dị mkpa.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ugwu ma dị mfe nghọta. “Onyenwe anyị” na-anọchi κύριος n’ụzọ a na-ahụkarị n’Igbo; a zere okwu nkà mmụta okpukpe siri ike nke ga-emechi nghọta ἐκλεκτός n’otu ụzọ.
