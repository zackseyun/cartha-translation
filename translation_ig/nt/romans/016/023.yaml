id: ROM.16.23
reference: Romans 16:23
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: ig
  text: Gayọs, onye na-anabata m na ọgbakọ niile dịka ndị ọbịa, na-ekele unu. Erastọs, onye nlekọta akụ nke obodo[a], na Kwatọs, nwanna ahụ, na-ekele unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye nlekọta obodo.” Okwu Grik ahụ nwere ike ịpụta onye ọrụ ọchịchị obodo n’ụzọ sara mbara, ọ bụ ezie na ilekọta akụ obodo dabara n’ọrụ a a na-eche na Erastọs rụrụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: na-ekele unu
  rationale: N’ọgwụgwụ akwụkwọ ozi Pọl, okwu a pụtara iziga ma ọ bụ ikwu ekele; nsụgharị a bụ nke Igbo nkịtị ma na-edobe ike nke onye ahụ n’onwe ya na-ekele ha.
- source_word: ξένος
  choice: onye na-anabata m n’ụlọ ya
  rationale: N’ebe a, okwu ahụ na-egosi onye nyere Pọl ebe obibi ma lekọta ya dị ka ọbịa, ọ bụghị ‘onye ọbịa’ ma ọ bụ ‘onye mba ọzọ.’ Nkebiokwu a na-eme ka nghọta ahụ doo anya n’Igbo.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: ọgbakọ niile
  rationale: ἐκκλησία na-ezo aka n’obodo ndị kwere ekwe; ‘ọgbakọ’ bụ okwu Igbo doro anya nke na-adịghị ewebata echiche ụlọ ofufe. ‘Niile’ na-edobe ὅλης.
- source_word: οἰκονόμος τῆς πόλεως
  choice: onye na-elekọta akụ obodo
  rationale: οἰκονόμος bụ onye nlekọta ma ọ bụ onye ọchịchị; n’ọnọdụ ọrụ obodo a, ilekọta akụ obodo bụ nghọta kwesịrị ekwesị, ebe ihe ọ bụ kpọmkwem ka nwere ike ịdị obosara.
- source_word: ἀδελφός
  choice: nwanna ahụ
  rationale: Okwu Grik bụ nwoke otu onye ma nwee mkpụrụokwu njirimara; ‘nwanna ahụ’ na-edobe ụdị ahụ ma na-egosi onye otu okwukwe n’enweghị ịgbakwunye ‘anyị.’
theological_decisions:
- issue: Nsụgharị ἐκκλησία n’ekele a
  choice: ọgbakọ
  alternative: chọọchị
  rationale: ‘Ọgbakọ’ na-egosi ndị kwere ekwe dịka obodo zukọrọ ma ghara ime ka a chee na ihe a na-ekwu bụ ụlọ; ọ naghịkwa etinye usoro ụka pụrụ iche n’amaokwu ahụ.
- issue: Aha ezinụlọ ἀδελφός
  choice: nwanna ahụ
  alternative: nwanna anyị
  rationale: Isi mmalite kwuru nwoke otu onye ma o tinyeghị nnọchiaha ‘anyị’; ya mere, a hapụrụ mgbakwunye ahụ ma debe echiche onye otu okwukwe.
- issue: Ogologo ile ọbịa Gayọs
  choice: onye na-anabatakwa ọgbakọ niile n’ụlọ ya
  alternative: onye ọbịa nke ọgbakọ niile
  rationale: ξένος na genitive nwere ike iyi ihe siri ike ma a sụgharịa ya dịka aha nkịtị. Nsụgharị a na-egosi na Gayọs na-ele ndị ọgbakọ anya nke ọma, ma ọ naghị akọwapụta ụdị nnabata ahụ karịa ihe isi mmalite kwere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E dere aha ndị mmadụ dịka Gayọs, Erastọs, na Kwatọs ka ụda ha kwekọọ n’Igbo. E ji ‘ọgbakọ’ mee ka a mata obodo ndị kwere ekwe, ọ bụghị ụlọ. E tinyere akara nkọwa ala peeji [a] ozugbo n’ebe okwu metụtara ya dị.
