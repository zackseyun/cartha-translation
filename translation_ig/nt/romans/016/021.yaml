source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: ig
  text: Timoti, onye m na ya na-arụkọ ọrụ, na-ekele unu. Lukios, Jesọn na Sosipata, ndị ikwu m[a], na-ekelekwa unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya “ndị ezinụlọ m” ma ọ bụ “ndị Juu ibe m.” Okwu Grik ahụ nwere ike ịpụta ndị ezinụlọ mmadụ ma ọ bụ ndị ha na ya nwere njikọ agbụrụ sara mbara.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: na-ekele unu
  rationale: N’akwụkwọ ozi, ἀσπάζομαι pụtara ikele mmadụ ma ọ bụ izigara ya ekele. “Na-ekele unu” bụ okwu Igbo doro anya ma na-egosi na ὑμᾶς bụ ọtụtụ mmadụ.
- source_word: συνεργός μου
  choice: onye mụ na ya na-arụkọ ọrụ
  rationale: Nkebi a na-egosi onye ya na Pọl na-arụ otu ọrụ. Nsụgharị a bụ Igbo e ji eme ihe kwa ụbọchị, ma ọ naghị eme ka ọrụ ahụ yie naanị ọrụ ụlọ ọrụ.
- source_word: Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος
  choice: Lukios, Jesọn na Sosipata
  rationale: E degharịrị aha ndị ahụ n’ụdị dabara n’usoro mkpọpụta na odide Igbo, ebe a ka chekwara ụdị aha Σωσίπατρος dị n’amaokwu a.
- source_word: οἱ συγγενεῖς μου
  choice: ndị ikwu m
  rationale: συγγενεῖς nwere ike izo aka n’ezinụlọ mmadụ ma ọ bụ ná njikọ agbụrụ sara mbara. “Ndị ikwu m” na-echekwa obosara ihe okwu ahụ nwere karịa ịhọrọ naanị “ndị Juu ibe m.”
theological_decisions:
- issue: Ihe συγγενεῖς μου pụtara n’ebe a
  choice: ndị ikwu m
  alternative: ndị ikwu m n’anụ ahụ; ndị Juu ibe m
  rationale: Amaokwu ahụ akọwaghị ma Pọl ọ na-ekwu kpọmkwem banyere ndị ezinụlọ ya ka ọ̀ bụ ndị agbụrụ ya, ya bụ ndị Juu. Ya mere, isi nsụgharị ahụ ahapụghị nghọta a n’otu akụkụ naanị, ebe nkọwa ala peeji na-egosi ihe abụọ ahụ nwere ike ịbụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ugwu. E kewara ekele Timoti na nke ndị ọzọ n’ahịrịokwu abụọ iji mee ka ọ dị mfe nghọta, ebe “na-ekelekwa unu” na-eme ka ngwaa e kwuru na mbụ gbasaa ruo n’aha atọ ndị sochiri ya.
