  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: ig
  text: nye Chineke naanị ya maara ihe, site n’aka Jizọs bụ Mesaya, ka otuto dịrị ya ruo mgbe ebighị ebi. Amen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a mechiri okwu otuto dị na Ndị Rom 16:25–27. Dị ka e kwuru na nkọwa ala peeji na Ndị Rom 16:25, ọnọdụ okwu otuto a na ma a gụnyere ya n’ihe odide ahụ dịgasị nnọọ iche n’etiti ihe odide aka ochie; ma e debere ya ebe a n’ọdịnala Bizantịn nke ọtụtụ ihe odide.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: naanị
  rationale: Ọ na-egosi na Chineke bụ naanị onye nwere amamihe zuru oke; ọ na-akọwa ‘Chineke ahụ maara ihe.’
- source_word: σοφῷ
  choice: ahụ maara ihe
  rationale: Nke a bụ ụzọ Igbo nkịtị si akọwa Chineke dị ka onye nwere amamihe, n’enweghị asụsụ siri ike ma ọ bụ nke ochie.
- source_word: διὰ
  choice: site n’aka
  rationale: N’ebe a, ọ na-egosi na otuto a na-erute Chineke site n’aka Jizọs bụ Mesaya.
- source_word: Χριστοῦ
  choice: bụ Mesaya
  rationale: Χριστός bụ aha ọkwá pụtara ‘Onye E Tere Mmanụ’; ‘Mesaya’ na-edobe ihe aha ọkwá ahụ pụtara kama ime ya aha nkịtị.
- source_word: ᾧ
  choice: ya
  rationale: Nnọchiaha a anaghị ekwu kpọmkwem onye ọ na-arụtụ aka, ya mere ‘ya’ na-echekwa ntakịrị mgbagwoju anya dị n’asụsụ Grik banyere ma ọ bụ Chineke ka ọ bụ Jizọs bụ Mesaya.
- source_word: εἰς τοὺς αἰῶνας
  choice: ruo mgbe ebighị ebi
  rationale: Nke a bụ akpaalaokwu Igbo doro anya maka akpaalaokwu Grik nke pụtara mgbe niile na-enweghị ọgwụgwụ.
theological_decisions:
- issue: Onye nnọchiaha ᾧ (‘ya’) na-arụtụ aka
  choice: E ji ‘ya’ hapụ onye ọ na-arụtụ aka ka ọ ghara ịkọwapụta kpamkpam.
  alternative: Ịkọwa ya hoo haa dị ka ‘Chineke’ ma ọ bụ ‘Jizọs bụ Mesaya.’
  rationale: Usoro okwu Grik na-enye ohere ka onye na-agụ ya hụ ntakịrị mgbagwoju anya n’etiti Chineke na Jizọs Kraịst; ịkpọ otu n’ime ha aha n’ebe a ga-edozi ihe ederede ahụ n’onwe ya na-edozighị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ugwu ma dị mfe nghọta. E debere mmalite ‘nye’ ka ọ gaa n’ihu na ahịrịokwu otuto malitere n’amaokwu 25, dị ka usoro Grik si dị. ‘Jizọs bụ Mesaya’ na-eme ka Mesaya bụrụ aha ọkwá, ebe ‘ya’ na-echekwa mgbagwoju anya dị na ᾧ.
