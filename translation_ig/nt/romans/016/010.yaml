id: ROM.16.10
reference: Romans 16:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: ig
  text: Keleenụ Apeles, onye a nwalere ma kwado n'ime Mezaya[a]. Keleenụ ndị si n’ụlọ Aristobulus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka a na-asụkarị, “n'ime Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha zie onye ọzọ ekele; okwu a dị nkenke ma dịkwa mma n'Igbo, ma na-edobe nkwughachi dị n'amaokwu ahụ.
- source_word: Ἀπελλῆν
  choice: Apeles
  rationale: A sụgharịghị aha onye a; e dere ya ka ọ daba n'ụda na usoro nsụpe Igbo.
- source_word: τὸν δόκιμον
  choice: onye a nwapụtara na ọ bụ ezi onye
  rationale: δόκιμος na-egosi onye a nwalechara ma chọpụta na ọ bụ onye kwesịrị ntụkwasị obi ma ọ bụ onye a nabatara. Nsụgharị a na-egosipụta ma nnwale ahụ ma ezi nkwado ahụ n'ụzọ ndị na-agụ Igbo ga-aghọta.
- source_word: ἐν Χριστῷ
  choice: n'ime Mezaya
  rationale: A debere akpaala okwu Pọl nke na-egosi ọnọdụ ma ọ bụ ịdị n'otu n'ime Onye E Tere Mmanụ; a sụgharịrị Χριστός dị ka aha ọkwa, “Mezaya.”
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: ndị nọ n'ezinụlọ Aristobulus
  rationale: Akpaala okwu Grik ahụ na-ezo aka n'ụmụ ụlọ, ndị ohu, ma ọ bụ ndị ọzọ so n'ezinụlọ/ụlọ Aristobulus, ọ bụghị Aristobulus n'onwe ya n'ụzọ doro anya.
theological_decisions:
- issue: Nsụgharị Χριστῷ n'okwu Pọl ἐν Χριστῷ
  choice: n'ime Mezaya
  alternative: n'ime Kraịst
  rationale: Χριστός bụ aha ọkwa nke pụtara Onye E Tere Mmanụ; “Mezaya” na-eme ka nke a pụta ìhè, ebe “n'ime” na-echekwa mgbagwoju echiche Pọl banyere ọnọdụ ma ọ bụ ịdị n'otu kama ịkọwa ya nanị dị ka ịbụ onye kwere ekwe.
- issue: Ihe δόκιμος pụtara gbasara Apeles
  choice: onye a nwapụtara na ọ bụ ezi onye
  alternative: onye a nabatara
  rationale: A naghị ekwu onye mere nnwale ahụ ma ọ bụ ụdị ule ọ bụ. Nsụgharị ahụ na-echekwa ma echiche nke ịbụ onye a nwalere ma nke ịbụ onye a hụrụ dị ka ezigbo onye, n'enweghị ịgbakwụnye nkọwa okpukpe na-adịghị na ederede.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. “Keleenụ” na-egosi na a na-agwa ọtụtụ ndị okwu. A hapụrụ aha Aristobulus n'ụdị a maara nke ọma, ebe Apeles dabara n'usoro ụda Igbo. Enweghị akara nkọwa ala peeji n'ihi na ederede Igbo a enweghị nkọwa ala peeji.
