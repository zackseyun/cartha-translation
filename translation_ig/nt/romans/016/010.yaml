  to: Keleenụ Apeles, onye a nwalere ma kwado n'ime Mezaya[a]. Keleenụ ndị si n’ụlọ Aristobulus.
  rationale: The revision removes the unwarranted moral expansion of δόκιμος while preserving its tested-and-approved sense, retains the household-associated sense of the final phrase in idiomatic Igbo, and restores the audit-trail alternative for the customary rendering of Χριστῷ.
