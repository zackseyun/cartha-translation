  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: ig
  text: Keleenụ Filọlọgọs na Julia[a], Nereọs na nwanne ya nwanyị, Olimpás na ndị nsọ niile nọnyere ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma eleghị anya, a pụkwara ịgụ ya “Julias” ma ọ bụrụ na e were ya dịka aha nwoke; ma a na-aghọtakarị ụdị aha Grik a dịka aha nwanyị “Julia.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha zie ndị a ekele; “Keleenụ” bụ ụzọ dị nkenke ma dịkwa mma e si kwuo ya n'Igbo n'ọnọdụ akwụkwọ ozi.
- source_word: Φιλόλογον
  choice: Filọgọs
  rationale: A kpọgharịrị aha mmadụ a n'ụdị dabara n'usoro ụda na odide Igbo, na-ejigide ọdịdị aha Grik Φιλόλογος.
- source_word: Ἰουλίαν
  choice: Julia
  rationale: Ụdị a dị na Grik bụkarị aha nwanyị Julia. E debere ohere nke ịghọta ya dị ka aha nwoke na nkọwa ala peeji.
- source_word: Νηρέα
  choice: Nereọs
  rationale: A kpọgharịrị aha mmadụ ahụ site n'ụdị aha Grik Νηρεύς n'ụzọ ga-adị mfe ịgụ n'Igbo.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: nwanne ya nwanyị
  rationale: ἀδελφή pụtara nwanne nwanyị, αὐτοῦ egosikwa na ọ bụ nwanne Nereọs.
- source_word: Ὀλυμπᾶν
  choice: Olimpás
  rationale: A kpọgharịrị aha mmadụ ahụ n'ụzọ na-egosipụta aha Grik Ὀλυμπᾶς ma kwekọọ na ụda Igbo.
- source_word: τοὺς σὺν αὐτοῖς
  choice: ha na ha nọkọrọ
  rationale: σύν ya na dative na-egosi ịnọkọ ma ọ bụ iso ndị ọzọ; okwu a na-ejikọta ndị nsọ ahụ na ndị a kpọrọ aha.
- source_word: πάντας ἁγίους
  choice: ndị nsọ niile
  rationale: N'akwụkwọ Pọl, ἅγιοι bụ aha a na-akpọ ndị kwere ekwe dịka ndị e doro nsọ; “ndị nsọ” na-ejigide echiche ahụ, πάντας bụrụkwa “niile.”
theological_decisions:
- issue: Otu e si sụgharịa ἅγιοι n'ekele Pọl
  choice: ndị nsọ
  alternative: ndị Chineke doro nsọ; ndị nsọ nke Chineke
  rationale: “Ndị nsọ” na-ejigide aha Pọl na-akpọ ndị kwere ekwe n'enweghị ịgbasa okwu ahụ ma ọ bụ ime ka ọ bụrụ naanị aha ndị e mesịrị kwupụta na ha bụ ndị nsọ.
- issue: Ma Ἰουλίαν bụ aha nwanyị ka ọ bụ aha nwoke
  choice: Julia
  alternative: Julias
  rationale: Ihe a na-ahụkarị ma yie ka ọ kacha kwe omume bụ ịghọta ya dịka aha nwanyị Julia. E tinyere aha nwoke a tụrụ aro na nkọwa ala peeji ka a ghara izochi esemokwu ahụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E debere usoro ndepụta aha ndị ahụ, jiri “tinyere” mee ka njikọ ikpeazụ dịrị ụtọ n'Igbo. Akara nkọwa [a] dị ozugbo n'akụkụ “Julia.”
