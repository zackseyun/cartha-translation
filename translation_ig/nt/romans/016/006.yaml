id: ROM.16.6
reference: Romans 16:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάσασθε ⸀Μαριάμ, ἥτις πολλὰ ἐκοπίασεν εἰς ⸀ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: ig
  text: Keleenụ Meri[a], onye rụsiri ọrụ ike nke ukwuu maka unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ akwụkwọ aka ochie nwere “maka anyị” ma ọ bụ “n'etiti unu” kama “maka unu.”
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha kelee mmadụ; “Keleenụ” bụ ụzọ Igbo dị nkenke ma kwekọọ n'usoro ekele dị n'akwụkwọ ozi.
- source_word: Μαριάμ
  choice: Meri
  rationale: “Meri” bụ ụdị aha a a na-ejikarị eme ihe n'Igbo.
- source_word: ἥτις
  choice: onye
  rationale: “Onye” na-ewebata nkebiokwu na-akọwa Meri n'ụzọ ebumpụta ụwa n'Igbo, n'ebughị ibu nkọwa karịa ihe Grik kwuru.
- source_word: πολλὰ ἐκοπίασεν
  choice: rụsiri ọrụ ike nke ukwuu
  rationale: Nkebiokwu a na-egosi ọrụ siri ike na nnukwu mgbalị; ntụgharị a na-edobe ike nke κοπιάω na oke nke πολλὰ n'Igbo doro anya.
- source_word: εἰς ὑμᾶς
  choice: maka unu
  rationale: “Maka unu” na-egosi na ọrụ ahụ baara ndị a na-agwa uru, ma na-agbaso ọgụgụ SBLGNT bụ εἰς ὑμᾶς.
theological_decisions:
- issue: Ọdịiche ederede n'okwu ikpeazụ
  choice: maka unu
  alternative: maka anyị; n'etiti unu
  rationale: Isi ederede SBLGNT nwere εἰς ὑμᾶς, ya mere a sụgharịrị ya “maka unu.” A na-edobe ọgụgụ ndị ọzọ n'okpuru ala ka ọdịiche ederede ghara izochi.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji “rụsiri ọrụ ike nke ukwuu” gosipụta ọrụ tara akpụ na nnukwu mgbalị n'ụzọ mmadụ nkịtị ga-aghọta.
