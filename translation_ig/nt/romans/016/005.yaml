    rationale: Anchor [b] explains “Eshia,” while [c] explains the full “mkpụrụ mbụ ... nye Mezaịa” expression. Placing each anchor beside its referent improves clarity.
  - severity: low
    issue: The main text and alternative-reading footnote use “Kraịst” where the audit trail’s title policy calls for “Messiah.”
    rationale: “Mezaịa” more directly conveys Χριστός as a title here and keeps the Igbo text aligned with the stated lexical-theological decision.
