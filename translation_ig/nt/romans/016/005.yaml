  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: ig
  text: Keleekwa ọgbakọ dị n’ụlọ ha.[a] Keleenụ Epenetus, onye m hụrụ n’anya, onye bụ mkpụrụ mbụ nke Eshia[b] nye Mezaịa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọgbakọ nke na-ezukọ n’ụlọ ha.”
    reason: lexical_alternative
  - marker: b
    text: Nke a bụ ógbè Eshia nke Alaeze Rom, ọ bụghị kọntinent Eshia nke oge a.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “onye bụ onye mbụ n’Eshia kwere na Mezaịa.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: nzukọ Kraịst nke dị n’ụlọ ha
  rationale: Nkebiokwu Grik a na-ekwu maka ọgbakọ ndị kwere ekwe nke na-ezukọ n’ụlọ ha. A gbakwụnyere “Kraịst” iji mee ka “nzukọ” doo anya dị ka ọgbakọ ndị kwere ekwe, ebe ihe ọzọ e nwere ike ịsụ dị na nkọwa ala peeji.
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: N’usoro ekele dị n’akwụkwọ ozi, nke a bụ ụzọ Igbo nkịtị ma kwesị ekwesị isi sụgharịa iwu ahụ.
- source_word: Ἐπαίνετον
  choice: Epenetus
  rationale: E dere aha onye ahụ n’ụzọ kwekọrọ n’usoro ụda Igbo.
- source_word: ἀγαπητόν μου
  choice: onye m hụrụ n’anya
  rationale: Nke a na-egosipụta ịhụnanya Pọl nwere n’ebe onye ahụ nọ n’asụsụ Igbo dị ndụ ma dị ùgwù.
- source_word: ἀπαρχὴ
  choice: mkpụrụ mbụ
  rationale: Nke a na-echekwa ihe atụ Pọl ji banyere mkpụrụ mbụ, kama ịkọwa ya ozugbo dị ka onye mbụ kweere.
- source_word: τῆς Ἀσίας
  choice: nke Eshia
  rationale: Nke a na-ejigide njikọ genitive nke Grik; nkọwa ala peeji na-eme ka o doo anya na ọ bụ ógbè Rom a na-akpọ Eshia.
- source_word: εἰς Χριστόν
  choice: nye Kraịst
  rationale: “Nye Kraịst” na-echekwa echiche nke ntụziaka ma ọ bụ njikọ dị na εἰς, ma na-ada nke ọma n’akụkụ ihe atụ “mkpụrụ mbụ.”
theological_decisions:
- issue: Nsụgharị Χριστόν
  choice: Kraịst
  alternative: Mezaịa
  rationale: N’Igbo Standard, “Kraịst” bụ aha-ọkwa a maara nke ọma ma na-anọgide na-egosi Onye E Tere Mmanụ; ọ naghị atụkwasị nkọwa ụka pụrụ iche.
- issue: Ihe ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν pụtara
  choice: onye bụ mkpụrụ mbụ nke Eshia nye Kraịst
  alternative: onye bụ onye mbụ nọ n’Eshia kweere na Kraịst
  rationale: Isi okwu na-echekwa ihe atụ “mkpụrụ mbụ” na njikọ εἰς, ebe nkọwa ala peeji na-enye nghọta a na-ahụkarị na ọ bụ onye mbụ tọghatara ma ọ bụ kweere.
translation_notes:
  register: E ji Igbo Standard nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “nzukọ Kraịst” maka ἐκκλησία ka ọ ghara ịdị ka nzukọ nkịtị, ma e chekwara nkọwa kpọmkwem nke ụlọ na nke mkpụrụ mbụ.
