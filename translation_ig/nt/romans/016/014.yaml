  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: ig
  text: Keleenụ Asinkritọs, Flegọn, Hemes, Patrọbas, Hemas, na ụmụnna ndị so ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ụmụnna ndị ha na ha nọ.” O yikarịrị ka nkebiokwu a na-ekwu maka ndị kwere ekwe ibe ha ndị metụtara ndị ikom a.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha kelee ndị a; “Keleenụ” bụ ụzọ dị mkpirikpi ma bụrụkwa nke e ji asụ Igbo ugbu a n'okwu ekele dị n'akwụkwọ ozi.
- source_word: Ἀσύγκριτον, Φλέγοντα, Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν
  choice: Asinkritọs, Flegọn, Hemes, Patrọbas, Hemas
  rationale: A sụgharịghị aha ndị mmadụ; e depụtara ha ka ụda Grik ha kwekọọ n'usoro mkpụrụokwu na mkpọpụta Igbo. “Hemes” na “Hemas” ka e mere ka ha dị iche, dịka aha Grik abụọ ahụ dị iche.
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: ụmụnna ndị ha na ha nọ
  rationale: “Ụmụnna” na-eburu echiche nke ἀδελφούς n'okwu ndị Kraịst ibe ha, ebe “ndị ha na ha nọ” na-edobe mmekọrịta sara mbara nke σὺν αὐτοῖς n'ebughị ụzọ kọwaa kpọmkwem ụdị njikọ ahụ.
theological_decisions:
- issue: Ihe ἀδελφούς pụtara n'ekele a na-ekele ọgbakọ
  choice: ụmụnna
  alternative: ndị kwere ekwe ibe ha / ụmụnna nwoke na ụmụnna nwanyị
  rationale: Ụdị Grik ahụ bụ ọtụtụ nke nwoke, ma n'akwụkwọ Pọl ọ pụkwara ịkpọ ndị kwere ekwe ibe ya. “Ụmụnna” bụ okwu Igbo zuru oke n'ọnọdụ a ma ọ naghị amanye ederede ikwu kpọmkwem ma ìgwè ahụ bụ naanị ndị nwoke ka ọ bụ ìgwè agwakọtara.
translation_notes:
  register: E ji Igbo Izugbe dị mfe, dị ùgwù, ma bụrụ nke a na-asụ ugbu a. E debere iwu ahụ n'ụdị ọtụtụ mmadụ, depụtakwa aha ndị ahụ n'ụzọ onye na-agụ Igbo ga-enwe ike ịkpọpụta ha. A hapụrụ ụdị njikọ dị n'etiti ụmụnna ahụ na ndị a kpọrọ aha ka ọ saa mbara dịka Grik si dị.
