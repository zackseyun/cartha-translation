    reason: lexical_alternative
  revision_rationale: The text needs only a small revision to make the footnote a genuine lexical/rendering alternative and to avoid introducing a stronger sense of association than the Greek supplies. The revision maintains the source’s ambiguity concerning the precise composition and relationship of the brothers.
