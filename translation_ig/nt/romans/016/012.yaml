source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: ig
  text: Keleenụ Trifena na Trifosa, ndị rụsiri ọrụ ike n'ime Onyenweanyị.[a] Keleenụ Pesis, onye a hụrụ n'anya,[b] onye rụsiri ọrụ ike nke ukwuu n'ime Onyenweanyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị na-arụsi ọrụ ike n'ime Onyenweanyị” ma ọ bụ “ndị dọgburu onwe ha n'ọrụ n'ime Onyenweanyị.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ nsụgharị na-ekwu, “Pesis, onye m hụrụ n'anya”; ma Grik kwuru naanị “onye a hụrụ n'anya,” n'enweghị okwu pụtara “m.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Ụdị iwu a dị n'ọtụtụ ma dabara n'usoro ekele dị n'akwụkwọ ozi; “Keleenụ” bụ Igbo dị nkenke ma bụrụkwa nke ndị mmadụ na-aghọta nke ọma.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Trifena na Trifosa
  rationale: A sụgharịghị aha mmadụ; e dere ha ka ụda ha si kwekọọ n'usoro mkpọpụta na odide Igbo.
- source_word: τὰς κοπιώσας
  choice: ndị rụsiri ọrụ ike
  rationale: Nke a na-egosi ụmụanyị abụọ ahụ ma na-ebupụta echiche nke ịrụsi ọrụ ike. Ọ naghị amanye oge kpọmkwem n'ebe participle Grik ahụ na-ahapụrụ ya oghe.
- source_word: ἐν κυρίῳ
  choice: n'ime Onyenwe anyị
  rationale: Nke a na-edebe echiche Pọl banyere ọrụ a na-arụ n'ime mmekọrịta na ịdị n'otu nke Onyenwe anyị, kama ime ka ọ bụrụ naanị ọrụ a rụrụ “maka” ya.
- source_word: Περσίδα
  choice: Pesis
  rationale: Aha mmadụ ka e dere dịka ụda ya si kwekọọ n'usoro mkpọpụta Igbo.
- source_word: τὴν ἀγαπητήν
  choice: onye ahụ a hụrụ n'anya
  rationale: Nke a na-edebe article na adjective dị na Grik ma ghara ịgbakwunye “m” nke na-adịghị n'ihe odide ahụ.
- source_word: πολλὰ ἐκοπίασεν
  choice: rụsiri ọtụtụ ọrụ ike
  rationale: “Ọtụtụ” na-egosi oke mgbalị Pesis, ebe “rụsiri ọrụ ike” na-edebe otu mgbọrọgwụ echiche κοπιάω nke e ji kọwaa Trifena na Trifosa.
theological_decisions:
- issue: Ihe ἐν κυρίῳ pụtara n'okwu Pọl banyere ije ozi
  choice: n'ime Onyenwe anyị
  alternative: maka Onyenwe anyị; n'ijere Onyenwe anyị ozi
  rationale: Nhọrọ a na-echekwa ma echiche mmekọrịta mmadụ na Onyenwe anyị ma echiche ọnọdụ ime mmụọ nke ọrụ ahụ, n'emebighị ya ka ọ bụrụ naanị ebumnuche ọrụ.
- issue: Ịsụgharị ἀγαπητήν n'etinyeghị onye nwe ya
  choice: onye ahụ a hụrụ n'anya
  alternative: onye m hụrụ n'anya
  rationale: Grik ahụ enweghị μου (“m”); ya mere, a naghị agbakwunye echiche na ọ bụ Pọl kpọmkwem hụrụ ya n'anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke κοπιάω n'ahịrịokwu abụọ ahụ site n'iji “rụsiri ọrụ ike,” ma jiri “n'ime Onyenwe anyị” chekwaa nghọta sara mbara nke okwu Pọl.
