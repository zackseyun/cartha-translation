revisions:
- from: Keleenụ Trifena na Trifosa, ndị rụsiri ọrụ ike n'ime Onyenwe anyị.[a] Keleenụ Pesis, onye ahụ a hụrụ n'anya,[b] onye rụsiri ọtụtụ ọrụ ike n'ime Onyenwe anyị.
  to: Keleenụ Trifena na Trifosa, ndị rụsiri ọrụ ike n'ime Onyenweanyị.[a] Keleenụ Pesis, onye a hụrụ n'anya,[b] onye rụsiri ọrụ ike nke ukwuu n'ime Onyenweanyị.
  rationale: The revision corrects the adverbial force of πολλὰ by using “nke ukwuu,” preserving the Greek’s emphasis that Persis labored greatly. It also adopts the conventional Igbo title “Onyenweanyị” and removes the unintended demonstrative nuance from the rendering of τὴν ἀγαπητήν. The repeated “rụsiri ọrụ ike” continues to reflect the repeated κοπιάω terminology without imposing a disputed tense distinction.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:10:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two imperatives, the paired description of Tryphaena and Tryphosa, the repeated labor terminology, and the two instances of ἐν κυρίῳ. However, “rụsiri ọtụtụ ọrụ ike” changes πολλὰ (‘much/greatly’) into a reference to many tasks; it should express the intensity or extent of Persis’s labor.
  naturalness: “Onye ahụ a hụrụ n'anya” is understandable but sounds demonstrative (‘that beloved person’) in ordinary Standard Igbo. “Onye a hụrụ n'anya” is more idiomatic in this appositional greeting. “Onyenweanyị” is used as the established lexical form for ‘the Lord’; spacing it as “Onyenwe anyị” can be read compositionally as ‘our master/lord.’
  terminology: Use “Onyenweanyị” consistently for κύριος in this established Pauline phrase. Retain “rụsiri ọrụ ike” in both clauses to reflect the Greek repetition of κοπιάω, and render πολλὰ with “nke ukwuu.”
  issues:
  - severity: medium
    issue: The phrase “rụsiri ọtụtụ ọrụ ike” renders πολλὰ as ‘many work/tasks.’
    rationale: 'Πολλὰ is adverbial and modifies ἐκοπίασεν: Persis ‘labored much’ or ‘worked very hard.’ It does not state that she performed many separate jobs.'
  - severity: low
    issue: “Onyenwe anyị” is spaced rather than using the lexical title “Onyenweanyị.”
    rationale: The spaced wording can naturally be understood as possessive (‘our lord’), whereas the source has the definite title ‘the Lord.’ The conventional title avoids this avoidable ambiguity.
  - severity: low
    issue: “onye ahụ a hụrụ n'anya” adds a demonstrative flavor.
    rationale: Greek τὴν ἀγαπητήν is definite but not demonstrative. “onye a hụrụ n'anya” is a natural Igbo apposition without suggesting ‘that person.’
  revised_text: Keleenụ Trifena na Trifosa, ndị rụsiri ọrụ ike n'ime Onyenweanyị.[a] Keleenụ Pesis, onye a hụrụ n'anya,[b] onye rụsiri ọrụ ike nke ukwuu n'ime Onyenweanyị.
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị na-arụsi ọrụ ike n'ime Onyenweanyị” ma ọ bụ “ndị dọgburu onwe ha n'ọrụ n'ime Onyenweanyị.”
    reason: lexical_alternative
  - marker: b
    text: Ụfọdụ nsụgharị na-ekwu, “Pesis, onye m hụrụ n'anya”; ma Grik kwuru naanị “onye a hụrụ n'anya,” n'enweghị okwu pụtara “m.”
    reason: lexical_alternative
  revision_rationale: The revision corrects the adverbial force of πολλὰ by using “nke ukwuu,” preserving the Greek’s emphasis that Persis labored greatly. It also adopts the conventional Igbo title “Onyenweanyị” and removes the unintended demonstrative nuance from the rendering of τὴν ἀγαπητήν. The repeated “rụsiri ọrụ ike” continues to reflect the repeated κοπιάω terminology without imposing a disputed tense distinction.
