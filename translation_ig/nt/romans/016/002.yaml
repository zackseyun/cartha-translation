  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: ig
  text: ka unu wee nabata ya n’Onyenwe anyị dị ka o kwesịrị ndị nsọ, ma nyere ya aka n’ihe ọ bụla ọ ga-achọ enyemaka n’aka unu[a]. N’ihi na ya onwe ya abụrụla onye nkwado nke ọtụtụ mmadụ, nakwa m onwe m[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “guzo n’akụkụ ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “onye na-emere ọtụtụ mmadụ ihe ọma” ma ọ bụ “onye enyemaka nke ọtụtụ mmadụ.” Okwu Grik ahụ nwere ike igosi nwanyị na-akwado ọtụtụ ndị ọzọ ma ọ bụ na-enyere ha aka n’ụzọ bara uru.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: nabata ya
  rationale: Ọ na-egosi ịnabata Fibi nke ọma n’ime ọgbakọ, ya na echiche ile ọbịa.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-edobe okwu Pọl banyere mmekọrịta na ịdị n’otu nke ndị kwere ekwe n’Onyenwe anyị.
- source_word: ἀξίως τῶν ἁγίων
  choice: n’ụzọ kwesịrị ndị nsọ
  rationale: Ọ na-egosi ụdị nnabata dabara adaba nye ndị Chineke doro nsọ.
- source_word: παραστῆτε αὐτῇ
  choice: kwụnyere ya
  rationale: N’okwu a, ọ pụtara ịkwado ya ma nyere ya aka; ‘kwụnyere ya’ na-edobe onyinyo nke iguzo n’akụkụ mmadụ n’enweghị ịkọwa ụdị enyemaka ahụ karịa ihe Grik kwuru.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: n’okwu ọ bụla ọ ga-achọ enyemaka unu na ya
  rationale: ‘Okwu’ na-ekpuchi ihe omume, azụmahịa, ma ọ bụ mkpa bara uru; nkebi ahụ na-eme ka ihe ọ chọrọ n’aka ha doo anya n’Igbo.
- source_word: προστάτις
  choice: onye na-akwado
  rationale: Okwu ahụ na-egosi nwanyị nyere ọtụtụ mmadụ nkwado dị mkpa, ikekwe nkwado ego, mmekọrịta ọha, ma ọ bụ nchebe; nhọrọ a sara mbara ma ghara ime ka ọrụ ya dị ntakịrị.
- source_word: ἐμοῦ αὐτοῦ
  choice: tinyere mụ onwe m
  rationale: Ọ na-edobe nkwusi ike dị na αὐτοῦ nakwa echiche nke ‘m kwa.’
theological_decisions:
- issue: Ihe προστάτις kwuru banyere ọrụ Fibi
  choice: onye na-akwado
  alternative: onye enyemaka; nwanyị na-elekọta ma na-akwado ndị ọzọ
  rationale: Nsụgharị a na-egosipụta na Fibi nwere ọrụ nkwado pụtara ìhè nye ọtụtụ mmadụ, ma ọ naghị ebubata aha ọkwa ụka nke Grik ekwughị kpọmkwem.
translation_notes:
  register: Standard Igbo dị ugbu a, nke ugwu na nsọpụrụ dị na ya ma dị mfe nghọta. E ji “ndị nsọ” debe okwu Pọl a na-ahụkarị maka ndị Chineke, e jikwa “onye na-akwado” zere okwu mgbazinye na-adịghị mfe nghọta ma chekwaa ịdị arọ nke ọrụ Fibi.
