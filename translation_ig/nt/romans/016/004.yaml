  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: ig
  text: ndị tinyere olu ha n’ihe ize ndụ maka ndụ m[a]. Ọ bụghị naanị m na-ekele ha, kama ọgbakọ niile nke ndị mba ọzọ[b] na-ekelekwa ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ nwere “olu” n’otu mkpụrụ okwu; ọ bụ okwu ilu maka ikpughe onwe ha n’ihe ize ndụ nke ọnwụ.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọgbakọ niile nke mba dị iche iche.” N’ebe a, ọ na-ezo aka n’ọgbakọ ndị na-abụghị ndị Juu.
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: ndị
  rationale: Ọ na-ejikọta nkọwa a na Priska na Akwịla ndị a kpọtụrụ aha n’amaokwu bu ụzọ; “ndị” bụ ụzọ Igbo si eme njikọ a nke ọma.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: maka ndụ m
  rationale: N’ebe a ψυχή pụtara ndụ Pọl nke nọ n’ihe ize ndụ, ọ bụghị mkpụrụ obi dị ka akụkụ ime mmụọ.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: tinyere olu ha n’ihe ize ndụ
  rationale: 'Nke a na-edobe ihe atụ nke “olu” ma na-eme ka okwu ilu Grik ahụ doo onye Igbo nke oge a anya: ha kpughere onwe ha n’ihe ize ndụ nke ọnwụ.'
- source_word: οἷς ... εὐχαριστῶ
  choice: na-ekele ha
  rationale: Ngwaa Igbo “ikele” na-anabata onye a na-ekele ozugbo; ya mere “ha” na-egosipụta dative οἷς n’ụzọ ebumpụta ụwa.
- source_word: οὐκ ἐγὼ μόνος ... ἀλλὰ καὶ
  choice: Ọ bụghị naanị m ... kama ... na-ekelekwa ha
  rationale: Nhazi a na-echekwa nkwusi ike Pọl na ọ bụghị naanị ya nwere ekele.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: ọgbakọ niile
  rationale: “Ọgbakọ” na-egosipụta nzukọ ndị kwere ekwe, ebe “niile” na-echekwa πᾶσαι.
- source_word: τῶν ἐθνῶν
  choice: nke ndị mba ọzọ
  rationale: N’okwu Pọl, ἔθνη n’ebe a na-ezo aka n’ụmụ mmadụ na-abụghị ndị Juu; “ndị mba ọzọ” na-eme ka ọdịiche ahụ doo anya.
theological_decisions:
- issue: Ihe ψυχή pụtara n’okwu Pọl
  choice: ndụ
  alternative: mkpụrụ obi
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ihe ize ndụ anụ ahụ na nzọpụta Pọl, ya mere ọ na-ekwu maka ndụ ya, ọ bụghị naanị maka mkpụrụ obi ya.
- issue: Ihe ἐθνῶν pụtara
  choice: ndị mba ọzọ
  alternative: mba dị iche iche
  rationale: N’iji okwu Pọl eme ihe, ahịrịokwu a na-ezo aka n’ọgbakọ ndị na-abụghị ndị Juu; a naghị ekpochapụ ihe ọzọ pụtara n’ihi na e tinyere ya n’ala ala peeji.
- issue: Ma a ga-asụgharị okwu ilu banyere olu n’ụzọ nkịtị ma ọ bụ kọwaa ya
  choice: tinyere olu ha n’ihe ize ndụ
  alternative: tinyere ndụ ha n’ihe ize ndụ
  rationale: Nhọrọ a na-echekwa ihe atụ doro anya nke Grik ma na-enyekwa onye na-agụ Igbo ihe okwu ilu ahụ pụtara, n’enweghị ịgbakwunye ụzọ kpọmkwem e si chọọ igbu ha.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “ọgbakọ” maka ἐκκλησίαι, ma zere okwu nwere ike ịpụta naanị otu òtù ụka. E debere ihe atụ “olu” nke asụsụ Grik ma kọwaa nghọta ya n’ahịrịokwu na n’ala ala peeji.
