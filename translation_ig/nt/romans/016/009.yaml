id: ROM.16.9
reference: Romans 16:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: ig
  text: Keleenụ Ọbanọs, onye anyị na ya na-arụkọ ọrụ n'ime Mesaịa[a], na Stakịs, onye m hụrụ n'anya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ime Kraịst.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Ụdị iwu a bụ maka ọtụtụ ndị, ọ na-egosikwa iwu dị nkenke ka ha kelee onye ahụ; nke a dabara n’usoro ekele nke isiakwụkwọ a.
- source_word: Οὐρβανὸν
  choice: Ubanọs
  rationale: E degharịrị aha Grik a n’ụdị dabara n’olu na mkpopụta mkpụrụokwu Igbo.
- source_word: συνεργὸν ἡμῶν
  choice: onye anyị na ya na-arụkọ ọrụ
  rationale: Nke a na-egosipụta ma echiche nke ịrụkọ ọrụ ọnụ ma njikọ nke nnọchiaha ἡμῶν n’Igbo dị mfe nghọta.
- source_word: ἐν Χριστῷ
  choice: n'ime Mesaịa
  rationale: Nkebiokwu a na-egosi mmekọrịta ma ọ bụ ịdị n’otu ya na Χριστός; “Mesaịa” na-echekwa ọrụ okwu ahụ dị ka utu aha.
- source_word: Στάχυν
  choice: Stakịs
  rationale: E degharịrị aha onye ahụ site n’ụdị Grik ya ka ọ daba na mkpọpụta Igbo.
- source_word: τὸν ἀγαπητόν μου
  choice: onye m hụrụ n'anya
  rationale: Nsụgharị a bụ nke e ji eme ihe n’Igbo ugbu a, na-egosikwa ịhụnanya onwe onye dị n’okwu Grik ahụ n’enweghị ịgbakwụnye echiche ọzọ.
theological_decisions:
- issue: Nsụgharị Χριστῷ n’ime ἐν Χριστῷ
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ebe a, Χριστός ka na-arụ ọrụ dị ka utu aha nke Onye E Tere Mmanụ; “Mesaịa” na-eme ka nke ahụ pụta ìhè. E debere “Kraịst” n’ala peeji dịka nsụgharị omenala a na-ahụkarị.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Onye anyị na ya na-arụkọ ọrụ” bụ usoro nkịtị karịa ịmepụta otu aha ọrụ siri ike; aha ndị ahụ ka e degharịrị ka ha kwekọọ n’ụda Igbo.
