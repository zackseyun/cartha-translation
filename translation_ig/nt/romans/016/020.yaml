id: ROM.16.20
reference: Romans 16:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: ig
  text: Chineke nke udo ga-egwepịa Setan n’okpuru ụkwụ unu n’oge na-adịghị anya. Ka amara Onyenwe anyị Jizọs bụ Mesaya[a] dịnyere unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dịka a na-asụkarị, “Jizọs Kraịst.”
    reason: alternative_rendering
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: Chineke nke udo
  rationale: Ọ na-edobe aha nkọwa Pọl ji mara Chineke, na-enweghị ịgbasa ya ka ọ bụrụ nkọwa ọzọ dịka ‘Chineke na-enye udo.’
- source_word: συντρίψει
  choice: ga-egwepịa
  rationale: Okwu a na-egosi ihe Chineke ga-eme n’ọdịnihu n’ezie; ‘gwepịa’ dabara n’onyonyo nke imeri onye iro ma dọba ya n’okpuru ụkwụ.
- source_word: τὸν Σατανᾶν
  choice: Setan
  rationale: A na-ede ya dịka aha onye n’Agba Ọhụrụ, kama ịtụgharị ya dịka ‘Onye Mmegide.’
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: n’okpuru ụkwụ unu
  rationale: Nke a na-edobe akpaalaokwu mmeri na iweda onye iro n’ala. ‘Unu’ na-egosikwa na a na-agwa ọgbakọ ahụ niile okwu.
- source_word: ἐν τάχει
  choice: n’oge na-adịghị anya
  rationale: N’ebe a, ọ kacha pụta na ihe ahụ ga-eme n’oge dị nso, ọ bụghị nanị na a ga-eme ya ngwa ngwa mgbe ọ malitere.
- source_word: ἡ χάρις
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo a maara nke ọma maka isiokwu Pọl a, ma na-edobe ịdị arọ nke okwu ahụ karịa ịkọwa ya naanị dịka ihuọma.
- source_word: τοῦ κυρίου ἡμῶν
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo dị mma isi kwuo aha nsọpụrụ ahụ na njikọ ya na ndị kwere ekwe.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mesaya
  rationale: ‘Mesaya’ na-egosipụta Χριστός dịka aha ọrụ ma ọ bụ utu aha nke Jizọs; itinye ‘bụ’ na-eme ka okwu ahụ bụrụ Igbo doro anya ma dị ndụ.
- source_word: μεθ’ ὑμῶν
  choice: dịnyere unu
  rationale: Ọ bụ ngọzi e ji arịọ ka amara ahụ nọnyere ndị a na-agwa okwu; Igbo chọrọ ngwaa e kwuru hoo haa n’ebe a.
theological_decisions:
- issue: Otu e si asụgharị Χριστοῦ n’ime ngọzi mmechi a
  choice: Mesaya
  alternative: Kraịst
  rationale: N’ebe a, okwu ahụ ka nwere ike ịrụ ọrụ dịka utu aha pụtara Onye E Tere Mmanụ. A hapụrụ ụdị ọdịnala ‘Kraịst’ n’ala peeji ka a ghara izochi nhọrọ ntụgharị ọzọ a maara nke ọma.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Unu’ na-edobe na okwu a bụ maka ọtụtụ mmadụ. Akara ala peeji [a] dị ozugbo n’akụkụ ‘Mesaya,’ ebe nhọrọ ntụgharị ahụ metụtara.
