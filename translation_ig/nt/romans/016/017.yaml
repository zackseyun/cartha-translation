revisions:
- from: Ana m arịọ unu, ụmụnna[a], ka unu lezie anya maka ndị na-akpata nkewa na ihe ndị na-eme ka mmadụ sụọ ngọngọ, megidere ozizi ahụ unu mụtara; unu wezuga onwe unu n’ebe ha nọ.
  to: Ana m arịọ unu, ụmụnna[a], ka unu lezie anya n’ebe ndị na-akpata nkewa na ihe ndị na-eme ka mmadụ sụọ ngọngọ, megidere ozizi ahụ unu mụtara, nọ; zerenụ ha.
  rationale: The revision preserves the source syntax and sense while making the object of “lezie anya” explicit through “n’ebe ... nọ” and expressing the Greek plural imperative naturally and unambiguously as “zerenụ ha.” The footnote is revised for grammatical precision and avoids implying that the Greek address excludes women.
