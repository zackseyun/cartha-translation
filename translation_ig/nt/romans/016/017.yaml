  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: ig
  text: Ana m arịọ unu, ụmụnna[a], ka unu lezie anya n’ebe ndị na-akpata nkewa na ihe ndị na-eme ka mmadụ sụọ ngọngọ, megidere ozizi ahụ unu mụtara, nọ; zerenụ ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ụmụnna nwoke na ụmụnna nwanyị.” Okwu Grik ahụ dị n’ụdị ọtụtụ nke nwoke, ma o yikarịrị ka ọ na-agwa ọgbakọ dum okwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Ana m arịọ unu
  rationale: Nke a na-egosipụta arịrịọ siri ike nke onye na-azụ ọgbakọ, ma na-ada n’Igbo nke oge a nke ọma.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu nkwanye ugwu a na-ejikarị akpọ ndị otu okwukwe; ihe odide Grik ji aha ọtụtụ nke nwoke, ma o yikarịrị ka ọ na-agwa ọgbakọ niile okwu.
- source_word: σκοπεῖν
  choice: lezie anya maka
  rationale: Ọ na-ejikọta ileba ndị a anya nke ọma na ịkpachara anya banyere ha.
- source_word: διχοστασίας
  choice: nkewa
  rationale: Ọ na-egosi esemokwu na-ekewa ndị nọ n’otu ọgbakọ.
- source_word: σκάνδαλα
  choice: ihe ndị na-eme ka mmadụ sụọ ngọngọ
  rationale: Nke a na-echekwa ihe atụ nke ihe na-eme ka mmadụ sụọ ngọngọ kama ịtụgharị ya naanị dị ka iwe ma ọ bụ mmejọ.
- source_word: παρὰ τὴν διδαχήν
  choice: megidere ozizi ahụ
  rationale: παρά tinyere accusative ebe a na-egosi ihe na-apụ n’ụkpụrụ ma ọ bụ na-emegide ozizi e nyere.
- source_word: ἐμάθετε
  choice: unu mụtara
  rationale: Nke a na-egosi ozizi ndị kwere ekwe mụtarala.
- source_word: ποιοῦντας
  choice: ndị na-akpata
  rationale: N’ebe a participle ahụ pụtara ndị na-eweta ma ọ bụ na-eme ka nkewa na ihe ịsụ ngọngọ dịrị.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: unu wezuga onwe unu n’ebe ha nọ
  rationale: Nke a na-echekwa iwu ahụ na echiche nke isi n’ebe ndị ahụ nọ pụọ.
theological_decisions:
- issue: Ma ἀδελφοί ọ na-akpọ naanị ụmụ nwoke ka ọ bụ ọgbakọ niile
  choice: E ji “ụmụnna” mee ihe n’ahịrịokwu, tinyekwa nkọwa ala peeji banyere ọdịdị okwu Grik na ndị ọ na-agụnye.
  alternative: “Ụmụnna nwoke na ụmụnna nwanyị”
  rationale: Okwu Grik bụ aha ọtụtụ nke nwoke, ma n’akwụkwọ Pọl ọ na-ejikarị ya agwa ọgbakọ dum okwu. “Ụmụnna” bụ okwu Igbo eke nke nwere ike ịkpọ ndị otu okwukwe n’enweghị idozi esemokwu a n’ụzọ karịrị ihe isi mmalite kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma doo ndị nkịtị anya. A hapụrụ ihe atụ nke ịsụ ngọngọ ka ọ dị, ma zere okwu ụka pụrụ iche nke otu nzukọ.
