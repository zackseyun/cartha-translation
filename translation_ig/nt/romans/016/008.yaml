- from: Keenụ Ampliatus[a], onye m hụrụ n’anya n’ime Onyenwe anyị.
  to: Keleenụ Ampliatus[a], onye m hụrụ n’anya n’Onyenweanyị.
  rationale: 'The revision improves idiomatic Standard Igbo while preserving every element of the Greek: the second-person plural greeting command, Ampliatus’s name, Paul’s affectionate “my beloved,” and the Lord-centered qualification. It neither expands κύριος to “Jesus” nor resolves the name-form question beyond the SBLGNT reading.'
