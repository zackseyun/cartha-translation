  text: ἀσπάσασθε ⸀Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: ig
  text: Keleenụ Ampliatus[a], onye m hụrụ n’anya n’Onyenweanyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Enwere ike ide aha Grik a dịka “Amplias”; ma ọgụgụ SBLGNT, Ἀμπλιᾶτον, na-akwado ụdị “Ampliatus.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ ka ha zie mmadụ ekele; “Keenụ” bụ ụzọ Igbo dị nkenke ma bụrụkwa nke a na-eji eme ihe n’akwụkwọ ozi.
- source_word: Ἀμπλιᾶτον
  choice: Ampliatus
  rationale: A sụgharịghị aha mmadụ kama a hapụrụ ya n’ụdị kwekọrọ n’ọgụgụ SBLGNT, Ἀμπλιᾶτον; ngwụcha accusative Grik adịghị mkpa n’Igbo.
- source_word: τὸν ἀγαπητόν μου
  choice: onye m hụrụ n’anya
  rationale: Nke a na-egosipụta ịhụnanya Pọl nwere n’ebe Ampliatus nọ n’Igbo nkịtị, n’enweghị ime ka okwu ahụ bụrụ nanị aha nkwanye ùgwù.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-echekwa okwu Pọl banyere mmekọrịta na ndụ dị n’ime Onyenwe anyị; etinyeghị “Jizọs” n’ihi na ọ dịghị n’ihe odide Grik.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịhụnanya Pọl na ἐν κυρίῳ
  choice: “onye m hụrụ n’anya n’ime Onyenwe anyị” na-ejikọta ịhụnanya ahụ na mmekọrịta Ndị Kraịst ha nwere n’ime Onyenwe anyị.
  alternative: Ịghọta ya dịka nanị “ezi enyi m,” ma ọ bụ ijikọ “n’ime Onyenwe anyị” na iwu ikekele ya.
  rationale: Usoro okwu Grik na-egosi n’ụzọ kacha eke na ἐν κυρίῳ na-akọwakwu Ampliatus dịka onye Pọl hụrụ n’anya; nsụgharị ahụ na-edobe nghọta okpukpe dị n’okwu ahụ n’enweghị ịgbakwụnye ihe.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị mfe nghọta ma nwee ugwu. “Keenụ” na-egosipụta na iwu ahụ bụ maka ọtụtụ ndị, ebe “onye m hụrụ n’anya” na-eburu ịdị ọkụ nke okwu ahụ n’ụzọ eke.
