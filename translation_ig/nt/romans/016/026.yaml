id: ROM.16.26
reference: Romans 16:26
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: robinson-pierpont-2005-byzantine
  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: ig
  text: ma ugbu a e kpughere ya, sitekwa n’Akwụkwọ Nsọ ndị amụma, dịka iwu Chineke ebighị ebi si dị, e mekwara ka mba niile mata ya, iji weta nrubeisi nke okwukwe,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu a bụ ihe na-aga n’ihu n’okwu otuto mmechi dị na Ndị Rom 16:25–27. Lee nkọwa dị na Ndị Rom 16:25 banyere ebe okwu a dị na ọdịiche dị n’ihe odide aka ochie.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: nke e kpughere
  rationale: Na-ezo aka n’ihe omimi dị n’amaokwu 25 ma na-egosi na e mere ka ihe ahụ zoro ezo pụta ìhè.
- source_word: γραϕῶν προφητικῶν
  choice: Akwụkwọ Nsọ ndị amụma
  rationale: Na-akọwa ihe odide nsọ nwere ọdịdị amụma; okwu a doro ndị na-agụ Igbo anya ma ghara ime ka ọ bụrụ naanị ihe odide nkịtị.
- source_word: ἐπιταγήν
  choice: iwu
  rationale: Na-egosi ntụziaka nwere ikike nke sitere n’aka Chineke.
- source_word: ὑπακοὴν πίστεως
  choice: rubere okwukwe isi
  rationale: Na-edobe njikọ dị n’etiti nrubeisi na okwukwe, ma ghara ikpebi ma ọ bụ nrubeisi nke okwukwe na-amịpụta ka ọ bụ nrubeisi nke mejupụtara okwukwe.
- source_word: πάντα τὰ ἔθνη
  choice: mba niile
  rationale: Na-egosipụta oke zuru ụwa ọnụ nke ime ka ozi ahụ mara, n’enweghị ikewapụ ya naanị nye ndị na-abụghị ndị Juu.
- source_word: αἰωνίου θεοῦ
  choice: Chineke ebighị ebi
  rationale: Na-egosipụta ịdị adị ebighị ebi nke Chineke n’asụsụ Igbo dị mfe ma dị ùgwù.
theological_decisions:
- issue: Ihe ὑπακοὴ πίστεως pụtara kpọmkwem
  choice: ka ha wee rubere okwukwe isi
  alternative: iji weta nrubeisi nke sitere n’okwukwe
  rationale: 'Nhọrọ a na-echekwa mgbagwoju anya nke genitive πίστεως: okwukwe nwere ike ịbụ ihe a na-erubere isi ma ọ bụ isi iyi/ụdị nrubeisi ahụ.'
- issue: Onye ma ọ bụ ihe φανερωθέντος na-ezo aka na ya
  choice: nke e kpughere
  alternative: ma e kpughere ihe omimi ahụ
  rationale: E debere participle ahụ n’ụdị njikọ ya na amaokwu 25, kama itinye aha doro anya nke Grik ekwughachighị n’amaokwu a.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E ji ‘Akwụkwọ Nsọ ndị amụma’ mee ka okwu ahụ bụrụ nke ndị nkịtị ga-aghọta, ebe a na-echekwa njikọ ahịrịokwu ahụ na amaokwu bu ya ụzọ. E tinyere akara ndetu [a] n’isiokwu ahụ.
