id: ROM.16.11
reference: Romans 16:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: ig
  text: Keleenụ Herọdion, onye ikwu m.[a] Keleenụ ndị nke Narkisọs, bụ́ ndị nọ n’ime Onyenwe anyị.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Onye ikwu m” nwekwara ike ịpụta ‘onye mụ na ya bụ otu ọbara’ ma ọ bụ ‘onye Juu ibe m’; okwu Grik ahụ nwere ike izo aka n’onye ikwu n’ọbara ma ọ bụ n’onye so n’agbụrụ Pọl.
    reason: lexical_alternative
  - marker: b
    text: O yikarịrị ka “ndị nke Narkisọs” na-ekwu banyere ndị si n’ezinụlọ ya ma ọ bụ n’ala na ihe onwunwe ya, bụ́ ndị nọ n’ime Onyenwe anyị.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Ụdị iwu a e nyere ọtụtụ mmadụ pụtara ka ha kelee ndị a kpọrọ aha; “Keleenụ” bụ okwu Igbo doro anya ma kwekọọ n’usoro ekele dị n’akwụkwọ ozi.
- source_word: Ἡρῳδίωνα
  choice: Herọdion
  rationale: A sụgharịghị aha mmadụ; e dere ya n’ụdị dabara n’usoro mkpụrụokwu na mkpọpụta Igbo.
- source_word: συγγενῆ μου
  choice: onye ikwu m
  rationale: “Onye ikwu m” nwere ike izo aka n’onye ha na Pọl bụ otu ọbara ma ọ bụ, n’ụzọ sara mbara, onye ya na ya si n’otu agbụrụ; ya mere, ọ naghị akpakọwa ihe okwu Grik ahụ hapụrụ ghe oghe.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: ndị nke Nakisọs
  rationale: Nkebi a na-egosi ndị e jikọtara ha na Nakisọs, ma ọ kpọghị “ezinụlọ” aha kpọmkwem. “Ndị nke Nakisọs” na-echekwa mkpụmkpụ na nghọtahie nwere ike ịdị n’isiokwu ahụ.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: bụ́ ndị nọ n’ime Onyenwe anyị
  rationale: Nke a na-echekwa okwu Pọl, “n’ime Onyenwe anyị,” ma na-egosikwa na ọ bụ naanị ndị e jikọtara na Nakisọs bụ ndị nọ n’ime Onyenwe anyị ka a na-ekele.
- source_word: κυρίῳ
  choice: Onyenwe anyị
  rationale: N’usoro okwu Ndị Kraịst Pọl ji ebe a, κύριος bụ “Onyenwe anyị”; nkebi “n’ime Onyenwe anyị” na-echekwa isi mmụta okpukpe dị n’okwu mbụ.
theological_decisions:
- issue: Ihe συγγενής pụtara n’ekele Pọl
  choice: onye ikwu m
  alternative: onye mụ na ya bụ otu ọbara; onye Juu ibe m
  rationale: Okwu Grik ahụ nwere ike ịpụta onye ikwu n’ọbara ma ọ bụ onye Pọl na ya si n’otu agbụrụ. Amaokwu a ekpebighị nke ọ bụ, ya mere e chekwara oghere ahụ ma kọwaa ya n’ala peeji.
- issue: Ndị a kpọrọ “ndị nke Nakisọs” bụ ndị ole na ụdị ndị dị aṅaa
  choice: ndị nke Nakisọs
  alternative: ndị si n’ezinụlọ Nakisọs; ndị so n’ụlọ ma ọ bụ ala Nakisọs
  rationale: Okwu Grik na-egosi njikọ ha na Nakisọs, ma o tinyeghị okwu pụtara “ezinụlọ” n’onwe ya. N’ihi ya, isi amaokwu ahụ etinyeghị nkọwa karịrị ihe isi mmalite kwuru.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara akpaokwu Pọl “n’ime Onyenwe anyị,” ma zere itinye “ezinụlọ” n’isi amaokwu n’ihi na okwu ahụ adịghị kpọmkwem n’ihe odide Grik.
