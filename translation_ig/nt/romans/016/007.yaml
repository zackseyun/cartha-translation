    reason: lexical_alternative
  revision_rationale: The revision replaces one unnatural expression with idiomatic Standard Igbo while maintaining the source's debated relation to the apostles through the anchored footnote. It also regularizes Andronicus's transliteration. No theological conclusion beyond the Greek text is imposed.
