id: ROM.16.7
reference: Romans 16:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: ig
  text: Keleenụ Andronikọs na Junia[a], ndị ikwu m na ndị mụ na ha nọkọrọ n’ụlọ mkpọrọ. Ha bụ ndị a ma ama n’etiti ndị ozi[b], ha nọkwa n’ime Mezaya tupu mụ onwe m.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Junia: a pụkwara ịgụ ya dịka “Junias,” aha nwoke; ma ọdịdị okwu Grik ahụ na otú e si eji aha ahụ n’akụkọ ihe mere eme na-akwado aha nwanyị karịa.'
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “Ha bụ ndị pụrụ iche n’etiti ndị ozi”; a pụkwara ịghọta ahịrịokwu ahụ dịka, “Ndị ozi maara ha nke ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Keleenụ
  rationale: Ọ bụ iwu a na-eji n’akwụkwọ ozi agwa ndị a na-ede akwụkwọ ka ha kelee mmadụ; “Keleenụ” bụ Igbo doro anya ma na-edobe ike nke iwu ahụ.
- source_word: Ἀνδρόνικον
  choice: Andrọnaịkọs
  rationale: E depụtara aha onye ahụ n’ụzọ na-eme ka ụda Grik ya pụta nke ọma n’Igbo.
- source_word: Ἰουνίαν
  choice: Junia
  rationale: Ụdị Grik ahụ kwekọrọ nke ọma karịsịa n’aha nwanyị Junia, nke a makwaara n’akụkọ ihe mere eme; e tinyere ụdị nwoke a tụpụtarala n’ala ala peeji.
- source_word: συγγενεῖς μου
  choice: ndị ikwu m
  rationale: Okwu a nwere ike ịpụta ndị ikwu mmadụ ma ọ bụ ndị otu agbụrụ ya. “Ndị ikwu m” na-edobe obosara ihe ọ pụrụ ịpụta n’enweghị ịkọwa ya kpọmkwem dị ka ndị Juu ibe Pọl.
- source_word: συναιχμαλώτους μου
  choice: ndị mụ na ha nọkọrọ n’ụlọ mkpọrọ
  rationale: Nke a na-egosi ndị ha na Pọl kekọrọ ọnọdụ ịbụ ndị mkpọrọ; ntụgharị a bụ Igbo nkịtị ma doo anya.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: A maara ha ama n’etiti ndị ozi
  rationale: Nke a na-edobe echiche nke ịbụ ndị a ma ama n’etiti ndị ozi, ma ọ naghị emechi esemokwu banyere ma ha so n’òtù ndị ozi ahụ ma ọ bụ na naanị ndị ozi maara ha nke ọma.
- source_word: πρὸ ἐμοῦ
  choice: tupu mụ onwe m
  rationale: Ọ na-egosi na ha buru Pọl ụzọ n’oge; mgbakwunye “onwe m” na-eme ka ntụnyere ahụ doo anya n’Igbo.
- source_word: γέγοναν ἐν Χριστῷ
  choice: ha nọkwa n’ime Mezaya
  rationale: 'Nke a na-edobe akpaalaokwu “n’ime Mezaya” na ọnọdụ zuru ezu nke ngwaa Grik: ha batara n’ọnọdụ ahụ tupu Pọl, ha ka nọkwa na ya.'
theological_decisions:
- issue: Ma Ἰουνίαν bụ aha nwanyị ka ọ bụ aha nwoke
  choice: Junia, aha nwanyị
  alternative: Junias, aha nwoke
  rationale: Ụdị Grik na ihe àmà sitere n’iji aha ahụ n’akụkọ ihe mere eme na-akwado Junia nke ọma karị. N’ihi na ụdị nwoke ahụ metụtara arụmụka nkọwa kemgbe ogologo oge, e debere ya n’ala ala peeji.
- issue: Ihe ἐπίσημοι ἐν τοῖς ἀποστόλοις pụtara
  choice: A maara ha ama n’etiti ndị ozi
  alternative: Ha bụ ndị pụrụ iche n’etiti ndị ozi; ma ọ bụ, ndị ozi maara ha nke ọma
  rationale: Usoro okwu Grik ahụ nwere ike igosi na ha bụ ndị pụtara ìhè n’ime ndị ozi, ma ọ bụ na ndị ozi maara ha nke ọma. Isiokwu ahụ na ala ala peeji na-edobe nghọta abụọ a n’enweghị ịkpebi ihe Grik na-ekpebighị kpamkpam.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ndị ozi” na-anọchi ἀπόστολοι, “Mezaya” na-anọchi Χριστός dịka aha ọkwa, ebe ahịrịokwu na ala ala peeji na-edobe mgbagwoju anya dị n’asụsụ Grik.
