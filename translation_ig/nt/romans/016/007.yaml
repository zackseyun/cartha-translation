revisions:
- from: Keleenụ Andrọnaịkọs na Junia[a], ndị ikwu m na ndị mụ na ha nọkọrọ n’ụlọ mkpọrọ. A maara ha ama n’etiti ndị ozi[b], ha nọkwa n’ime Mezaya tupu mụ onwe m.
  to: Keleenụ Andronikọs na Junia[a], ndị ikwu m na ndị mụ na ha nọkọrọ n’ụlọ mkpọrọ. Ha bụ ndị a ma ama n’etiti ndị ozi[b], ha nọkwa n’ime Mezaya tupu mụ onwe m.
  rationale: The revision replaces one unnatural expression with idiomatic Standard Igbo while maintaining the source's debated relation to the apostles through the anchored footnote. It also regularizes Andronicus's transliteration. No theological conclusion beyond the Greek text is imposed.
