id: ROM.16.19
reference: Romans 16:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: ig
  text: N’ihi na nrubeisi unu eruola mmadụ niile.[a] Ya mere, ana m aṅụrị ọṅụ n’ihi unu,[b] ma achọrọ m ka unu bụrụ ndị maara ihe n’ihe dị mma, bụrụkwa ndị na-enweghị aghụghọ n’ihe ọjọọ.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Akụkọ nrubeisi unu eruola mmadụ niile,” ya bụ, ọ bụrụla ihe mmadụ niile maara.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, nke a nwekwara ike ịbụ, “ana m aṅụrị ọṅụ banyere unu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “ndị dị ọcha” ma ọ bụ “ndị na-enweghị ntụpọ” n’ihe ọjọọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: nrubeisi
  rationale: Okwu a na-egosi ịṅa ntị nke na-amịpụta ido onwe onye n’okpuru na ime ihe e kwuru, ọ bụghị naanị ịnụ ihe.
- source_word: εἰς πάντας ἀφίκετο
  choice: eruola mmadụ niile
  rationale: Nke a na-edobe ihe oyiyi Grik nke ihe ‘irute’ mmadụ niile; n’ọnọdụ a, ihe ọ pụtara bụ na akụkọ nrubeisi ha agbasaala ebe niile.
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: ana m aṅụrị ọṅụ n’ihi unu
  rationale: ἐπί ya na dative na-egosi ihe kpatara ma ọ bụ ihe mere e ji aṅụrị ọṅụ; ntụgharị a bụ nke Igbo kwụ ọtọ ma dịkwa eke.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: ndị maara ihe n’ihe dị mma
  rationale: Ọ na-egosi amamihe na nghọta bara uru nke a na-etinye n’ihe ọma.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: ndị na-enweghị ntụpọ n’ihe dị njọ
  rationale: ἀκέραιος nwere echiche nke ihe a na-agwakọtaghị, nke dị ọcha, ma ọ bụ nke na-enweghị aghụghọ; ‘na-enweghị ntụpọ’ na-egosi na ihe ọjọọ emerụghị ha ma na-edobe obosara okwu ahụ.
theological_decisions:
- issue: Ókè πάντας n’otuto a
  choice: mmadụ niile
  alternative: onye ọ bụla nọ n’ọgbakọ dị iche iche
  rationale: A hapụrụ okwu ahụ ka ọ bụrụ nkwupụta sara mbara nke otuto, n’ebughị ụzọ mechie ókè ya dịka ọnụọgụ zuru ụwa ọnụ ma ọ bụ kpachie ya naanị n’ọgbakọ ụfọdụ.
- issue: Ọdịiche dị n’etiti σοφούς na ἀκεραίους
  choice: ịma ihe n’ihe dị mma na enweghị ntụpọ n’ihe dị njọ
  alternative: ịbụ onye aghụghọ n’ihe ọma na onye na-amaghị ihe ọjọọ
  rationale: 'Nke a na-edobe esemokwu Pọl chọrọ: nghọta siri ike banyere ihe ọma, ma ọ bụghị itinye aka n’ihe ọjọọ; ọ naghị atụgharị ya ka ọ bụrụ iwu ka mmadụ ghara ịma na ihe ọjọọ dị.'
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ ‘nrubeisi’ maka omume nke ịnụ ma mee, ‘aṅụrị ọṅụ’ maka ụda dịtụ elu nke χαίρω, na ‘na-enweghị ntụpọ’ iji zere echiche na Pọl na-akwalite amaghị ihe, ebe a ka na-edobe obosara ἀκέραιος.
