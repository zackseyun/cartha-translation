  to: N’ihi na nrubeisi unu eruola mmadụ niile.[a] Ya mere, ana m aṅụrị ọṅụ n’ihi unu,[b] ma achọrọ m ka unu bụrụ ndị maara ihe n’ihe dị mma, bụrụkwa ndị na-enweghị aghụghọ n’ihe ọjọọ.[c]
