source:
  edition: SBLGNT
  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: ig
  text: Mụ, Tetiọs, onye dere akwụkwọ ozi ahụ, na-ekele unu n’ime Onyenwe anyị.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’agbanyeghị na nke a eyighị ka ọ bụ ya: “Mụ, Tetiọs, onye dere akwụkwọ ozi ahụ n’ime Onyenwe anyị, na-ekele unu.” N’asụsụ Grik, “n’ime Onyenwe anyị” nwere ike ịkọwa “dere,” ma o yiri ka ọ na-akọwa ekele ahụ karịa.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: na-ekele
  rationale: N’ọnọdụ mmechi akwụkwọ ozi, ngwaa a pụtara izigara mmadụ ekele; “na-ekele” bụ okwu Igbo dị mfe ma kwekọọ n’echiche ahụ.
- source_word: ὑμᾶς
  choice: unu
  rationale: Nnọchiaha a bụ onye nke abụọ n’ọnụọgụ ọtụtụ; “unu” na-egosipụta nke ahụ kpọmkwem n’Igbo.
- source_word: ἐγὼ Τέρτιος
  choice: Mụ onwe m, bụ́ Tetiọs
  rationale: Nnọchiaha doro anya tinyere aha onye na-emesi onye na-ekwu okwu ike; “mụ onwe m” na-echekwa nkwusi ike ahụ n’Igbo eke.
- source_word: ὁ γράψας
  choice: onye dere
  rationale: Nkebi a na-akọwa Tetiọs dị ka onye rụrụ ọrụ ide akwụkwọ ozi ahụ; “onye dere” na-egosipụta ya nke ọma n’Igbo.
- source_word: τὴν ἐπιστολήν
  choice: akwụkwọ ozi a
  rationale: “Akwụkwọ ozi” bụ okwu Igbo nke oge a maka ἐπιστολή; “a” na-eme ka ntụaka nye akwụkwọ ozi ha nọ n’ime ya doo anya, n’agbanyeghị na Grik ji naanị mkpụrụokwu njirimara.
- source_word: ἐν κυρίῳ
  choice: n’ime Onyenwe anyị
  rationale: Nke a na-echekwa akpaokwu Pọl ji egosi mmekọrịta ma ọ bụ ịdị n’otu nke ndị kwere ekwe na Onyenwe anyị, na-enweghị ịkọwa ya karịa ihe Grik kwuru.
theological_decisions:
- issue: Ihe ἐν κυρίῳ (“n’ime Onyenwe anyị”) na-akọwa
  choice: E debere ya ka ọ na-akọwa ekele Tetiọs na-ekele ha.
  alternative: 'Ọ pụrụ ịkọwa ide akwụkwọ ozi ahụ: “onye dere akwụkwọ ozi a n’ime Onyenwe anyị.”'
  rationale: N’usoro okwu na ọnọdụ mmechi akwụkwọ ozi a, o yikarịrị ka akpaokwu ahụ ọ na-akọwa ekele ahụ. Ma ebe Grik nwere ike ịkwado njikọ nke ọzọ, e gosipụtara ya n’ihe odide ala peeji kama ikpochapụ mgbagwoju anya ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Onyenwe anyị” na-echekwa aha κύριος n’ụdị a na-ejikarị eme ihe n’Igbo Ndị Kraịst; ahịrịokwu ahụ na-egosikwa na “unu” bụ ọtụtụ.
