    text: 'Ma ọ bụ, n’agbanyeghị na nke a eyighị ka ọ bụ ya: “Mụ, Tetiọs, onye dere akwụkwọ ozi ahụ n’ime Onyenwe anyị, na-ekele unu.” N’asụsụ Grik, “n’ime Onyenwe anyị” nwere ike ịkọwa “dere,” ma o yiri ka ọ na-akọwa ekele ahụ karịa.'
    reason: alternative_reading
