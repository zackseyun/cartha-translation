id: ROM.16.1
reference: Romans 16:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: ig
  text: Ana m atụ aro Fibi, nwanne anyị nwanyị, nye unu; ọ bụkwa onye na-eje ozi[a] nke ọgbakọ dị na Kenkrea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “diakọn nke ọgbakọ dị na Kenkrea.” Okwu Grik ahụ, diakonos, nwere ike ịpụta onye na-eje ozi n’ozuzu ya ma ọ bụ onye nwere ọrụ ozi a maara n’ọgbakọ.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνίστημι
  choice: Ana m akwado n’ihu unu
  rationale: N’akwụkwọ ozi, okwu a na-egosi ịkpọbata mmadụ n’ụzọ ọma ma rịọ ka ndị na-anata akwụkwọ nabata ya nke ọma. Nke a bụ okwu Igbo doro anya nke na-edobe echiche nkwado ahụ.
- source_word: δὲ
  choice: E gosịghị ya iche n’okwu Igbo
  rationale: N’ebe a δέ bụ naanị njikọ dị nro na-egosi mgbanwe n’isiokwu, ọ bụghị mmegide siri ike. Ịghara itinye okwu pụrụ iche na-eme ka Igbo bụrụ nke eke ma ghara itinye echiche oge nke na-adịghị na isi mmalite.
- source_word: Φοίβην
  choice: Fibi
  rationale: E degharịrị aha Grik ahụ n’ụdị dabara n’ụda na mkpopụta Igbo.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: nwanne anyị nwanyị
  rationale: Nke a na-edobe ihe atụ ezinụlọ Pọl ji akọwa nwanyị kwere ekwe, n’enweghị ịgbakwunye nkọwa na-adịghị na ederede.
- source_word: οὖσαν καὶ
  choice: onye bụkwa
  rationale: Nke a na-enye ozi ọzọ gbasara Fibi ma na-edobe ike mgbakwunye nke καί (‘kwa’).
- source_word: διάκονον
  choice: onye na-eje ozi
  rationale: διάκονος nwere ike ịpụta onye na-eje ozi n’ozuzu ya ma ọ bụ onye nwere ọrụ ozi a maara n’ọgbakọ. Nsụgharị a na-edobe obosara okwu ahụ ma ghara ịmanye aha ọkwa ụka e mesịrị; ihe ọzọ kwe omume dị n’ala peeji.
- source_word: τῆς ἐκκλησίας
  choice: n’ọgbakọ
  rationale: N’akwụkwọ Pọl, ἐκκλησία na-ezo aka n’ọgbakọ ndị kwere ekwe. ‘Ọgbakọ’ bụ okwu Igbo doro anya nke na-adịghị ebubata echiche ụlọ naanị.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: dị na Kenkrea
  rationale: A degharịrị aha ebe ahụ n’ụdị Igbo, ebe ‘dị na’ na-egosi ọnọdụ nke ἐν n’ụzọ eke.
theological_decisions:
- issue: Ma διάκονον ọ bụ okwu izugbe maka onye na-eje ozi ka ọ bụ aha ọrụ a maara n’ọgbakọ
  choice: onye na-eje ozi
  alternative: diakọn, ya bụ, onye nwere ọrụ ozi a maara n’ọgbakọ
  rationale: Okwu Grik ahụ n’onwe ya nwere ike ibu ma echiche izugbe ma echiche ọrụ a haziri ahazi. Njikọ ya na otu ọgbakọ pụrụ igosi ọrụ a maara, ma amaokwu ahụ akọwaghị usoro ma ọ bụ ọkwa ahụ. Ya mere, isi ederede na-edobe okwu sara mbara, ebe ala peeji na-echekwa ohere nke aha ọrụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ọgbakọ’ maka ἐκκλησία na ‘onye na-eje ozi’ maka διάκονος iji chekwaa nghọta abụọ dị na Grik ma zere ịmanye usoro ụka nke e mesịrị.
