id: ROM.16.16
reference: Romans 16:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: ig
  text: Jirinụ nsusu ọnụ dị nsọ kelee ibe unu.[a] Ụka niile nke Mesaịa na-ekele unu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nsusu ọnụ dị nsọ” bụ ụdị ekele omenala a maara n’oge ahụ, nke gosipụtara ịhụnanya dị ọcha na mmekọrịta dị n’etiti ndị kwere ekwe.
    reason: cultural_note
  - marker: b
    text: A pụkwara ịsụgharị ya, “Ụka niile nke Kraịst na-ekele unu.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: kelee ibe unu
  rationale: Ụdị iwu a na-agwa ọtụtụ mmadụ ka ha kelerịta ibe ha; “ibe unu” na-egosipụta mmekọrịta nke ἀλλήλους n’Igbo nkịtị.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: jirinụ nsusu ọnụ dị nsọ
  rationale: ἐν nwere ọrụ nke ụzọ e si eme ihe n’ebe a; φίλημα bụ nsusu ọnụ, ebe ἁγίῳ na-akọwa ya dị ka nke dị nsọ ma dị ọcha n’etiti ndị kwere ekwe.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: na-ekele unu
  rationale: Oge ugbu a nke ngwaa ahụ na-egosi na ha na-ezitere ndị a na-agwa ekele; “unu” na-edobe ọtụtụ mmadụ nke ὑμᾶς.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: Ụka niile
  rationale: Nke a bụ okwu Igbo doro anya ma bụrụ nke a na-amakarị maka ọgbakọ ndị kwere ekwe, ma “niile” na-edobe ike nke πᾶσαι.
- source_word: τοῦ Χριστοῦ
  choice: nke Mesaịa
  rationale: Χριστός bụ aha-ọkwa nke pụtara Onye E Tere Mmanụ, ya bụ Mesaịa; genitive ahụ na-egosi na ụka ndị ahụ bụ nke ya ma ọ bụ jikọrọ ya.
theological_decisions:
- issue: Nsụgharị Χριστοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: “Mesaịa” na-eme ka ihe aha-ọkwa Χριστός pụtara pụta ìhè, kama ime ka ọ dị naanị ka aha mmadụ. E debere “Kraịst” n’ala peeji dịka nsụgharị ọdịnala ziri ezi.
- issue: Ihe “nsusu ọnụ dị nsọ” pụtara
  choice: E debere omume ahụ n’ahịrịokwu ma kọwaa ọnọdụ omenala ya n’ala peeji
  alternative: Ịgbanwe ya ka ọ bụrụ naanị “ekele ịhụnanya”
  rationale: E kwesịghị ihichapụ ụdị ekele ahụ kpọmkwem nke ederede Grik kwuru; nkọwa ala peeji na-enyere onye na-agụ aka ịghọta ọrụ ya n’ọgbakọ ndị mbụ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, nke dị mfe ma nwee ugwu. Ụdị “jirinụ… kelee” na “unu” na-egosi nke ọma na a na-agwa ọtụtụ mmadụ okwu; ahịrịokwu ndị ahụ dị nkenke dịka nke Grik.
