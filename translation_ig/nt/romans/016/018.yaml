id: ROM.16.18
reference: Romans 16:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: ig
  text: N’ihi na ndị dị otu a anaghị ejere Onyenwe anyị bụ Mesaya[a] ozi, kama ha na-ejere afọ nke ha[b] ozi. Site n’okwu ire ụtọ na otuto e ji arata mmadụ, ha na-eduhie obi ndị na-atụghị anya aghụghọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Onyenwe anyị bụ Kraịst.”
    reason: alternative_reading
  - marker: b
    text: N’ụzọ nkịtị, “afọ nke ha”; nke a bụ ihe atụ doro anya maka ọchịchọ imeju onwe ha.
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “ndị aka ha dị ọcha” ma ọ bụ “ndị na-enweghị aghụghọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: ndị dị otu a
  rationale: Ọ na-ezo aka n’ụdị ndị ahụ a kpọrọ aha n’amaokwu bu ụzọ, ma na-ada nke ọma n’Igbo nke oge a.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: Onyenwe anyị, bụ Mesaya
  rationale: A sụgharịrị κύριος dị ka “Onyenwe anyị,” ma Χριστός dị ka utu aha “Mesaya”; etinyeghị “Jizọs” n’ihi na ọ dịghị n’ihe odide Grik.
- source_word: δουλεύουσιν
  choice: na-ejere ... ozi
  rationale: Nkebiokwu a na-egosipụta ijere onye nwe mmadụ ozi, ma na-echekwa ntụnyere dị n’etiti ijere Onyenwe anyị ozi na ijere afọ ha ozi.
- source_word: κοιλίᾳ
  choice: afọ
  rationale: “Afọ” na-echekwa ihe atụ Pọl ji mee ihe, kama ịkọwa ya ozugbo dị ka ọchịchọ imeju onwe onye.
- source_word: χρηστολογίας
  choice: okwu dị ụtọ
  rationale: Ọ na-egosi okwu na-atọ ụtọ ma na-adọrọ mmadụ nso, karịchaa n’ọnọdụ aghụghọ a.
- source_word: εὐλογίας
  choice: otuto aghụghọ
  rationale: N’ebe a, εὐλογία abụghị ngọzi n’ezie, kama ọ bụ okwu otuto e ji arata mmadụ.
- source_word: ἐξαπατῶσι
  choice: na-eduhie
  rationale: Ọ na-egosi ime ka mmadụ kwenye ihe na-abụghị eziokwu ma ọ bụ soro ụzọ na-ezighị ezi.
- source_word: καρδίας
  choice: obi
  rationale: “Obi” na-echekwa echiche Akwụkwọ Nsọ banyere ime mmadụ, ọ bụghị naanị uche ya.
- source_word: ἀκάκων
  choice: ndị na-atụghị anya aghụghọ
  rationale: Nhọrọ a na-egosipụta na ndị ahụ adịghị eche na a ga-aghọgbu ha, ma ọ naghị ekpebi ma okwu ahụ pụtara “ndị aka ha dị ọcha” ma ọ bụ “ndị na-enweghị aghụghọ.”
theological_decisions:
- issue: Nsụgharị Χριστός dị ka utu aha Pọl ji mee ihe
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός bụ utu aha nke pụtara onye e tere mmanụ; “Mesaya” na-eme ka ọrụ ya dị ka utu aha pụta ìhè, ebe e debere “Kraịst” n’ala peeji dị ka nsụgharị ọdịnala.
- issue: Ihe “afọ nke ha” na-anọchi anya ya
  choice: E debere ihe atụ ahụ n’ahịrịokwu bụ isi
  alternative: ọchịchọ nke onwe ha
  rationale: Ihe odide Grik ji ihe oyiyi afọ mee ihe. Ide ya otú ahụ na-ezere imechi ihe ọ pụrụ ịgụnye, dịka agụụ anụ ahụ, uru onwe onye, na imeju ọchịchọ onwe onye.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E debere usoro ntụnyere Pọl na ihe atụ ya bụ “afọ,” ma sụgharịa ụdị okwu aghụghọ abụọ ahụ n’ụzọ na-egosi ọdịiche dị n’etiti okwu na-atọ ụtọ na otuto e ji arata mmadụ.
