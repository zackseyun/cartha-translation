id: ROM.16.3
reference: Romans 16:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: ig
  text: Keleenụ Priska[a] na Akwịla, ndị mụ na ha na-arụkọ ọrụ n’ime Mesaịa Jizọs[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Priska bụ ụdị aha ahụ zuru ezu; Priskila bụ ụdị a maara nke ọma karị, nke e ji kpọọ otu onye a n’ebe ndị ọzọ.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’ime Kraịst Jizọs.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Keleenụ
  rationale: Ọ bụ iwu e nyere ọtụtụ mmadụ, nke pụtara ka ha zie mmadụ ekele; “Keleenụ” bụ ụzọ Igbo dị nkenke ma kwekọọ n’akwụkwọ ozi.
- source_word: Πρίσκαν
  choice: Priska
  rationale: E degharịrị aha Grik Πρίσκα n’ụdị dabara n’usoro mkpọpụta na odide Igbo, ma chekwaa ụdị aha ahụ kpọmkwem kama iji Priskila.
- source_word: Ἀκύλαν
  choice: Akwịla
  rationale: Nke a bụ nsụgharị-ụda aha Ἀκύλας n’ụdị a na-agụ nke ọma n’Igbo.
- source_word: τοὺς συνεργούς μου
  choice: ndị mụ na ha na-arụkọ ọrụ
  rationale: Nkebi a na-egosi ndị ha na Pọl na-arụkọ otu ọrụ; ntụgharị a bụ nke sitere n’okike n’Igbo ma chekwaa echiche imekọ ọrụ ọnụ.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  rationale: “N’ime” na-echekwa okwu ἐν na echiche mmekọrịta ma ọ bụ ọnọdụ ọrụ ha; “Mesaịa” na-egosipụta Χριστός dịka utu aha ebe a.
theological_decisions:
- issue: Otú e si sụgharị Χριστῷ n’ahịrịokwu ἐν Χριστῷ Ἰησοῦ
  choice: Mesaịa
  alternative: Kraịst
  rationale: Χριστός ka nwere ike ịbụ utu aha nke pụtara Onye E Tere Mmanụ; ya mere “Mesaịa” na-eme ka ihe ọ pụtara doo anya. E tinyere “Kraịst” n’ala peeji dịka ụdị ọdịnala ọzọ n’enweghị ikpochapụ nhọrọ ahụ.
- issue: Ihe ἐν na-egosi n’okwu συνεργούς μου ἐν Χριστῷ Ἰησοῦ
  choice: n’ime Mesaịa Jizọs
  alternative: n’ọrụ Mesaịa Jizọs
  rationale: A hapụrụ nkebi ahụ ka ọ nwee obosara echiche ya—njikọ, ọnọdụ, ma ọ bụ ngalaba ọrụ ha—kama ịkọwa ya naanị dị ka ọrụ ha na-arụ.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. “Keleenụ” na-egosi na a na-agwa ọtụtụ mmadụ okwu. A họọrọ “ndị mụ na ha na-arụkọ ọrụ” kama okwu nwere ụda ụlọ ọrụ, ka mmekọrịta ha n’ozi pụta ìhè.
