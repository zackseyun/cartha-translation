    rationale: “Ọtụtụ mbipụta Grik” nwere ike iyi ka ọ na-ekwu maka mbipụta nke asụsụ Grik n’onwe ha, ebe okwu a chọrọ bụ mbipụta oge a nke Agba Ọhụrụ Grik; “ọgụgụ ihe odide” adịghị akọwa textual variant n’ụzọ doro anya. “Mgbanwe ederede” na “edemede Grik nke oge a” doro anya karịa.
