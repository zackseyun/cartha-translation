    issue: Ndetu ala peeji ahụ jikọtara mgbanwe ihe odide na nkọwa aha “Kraịst” n’otu ndetu.
    rationale: 'Ihe abụọ a bụ ụdị ndetu dị iche: nke mbụ metụtara akaebe ihe odide, nke abụọ metụtara ihe aha-ọrụ pụtara. Ikewapụ ha na-eme ka akara ndetu na ebumnuche ha doo anya.'
  - severity: low
