review_pass:
  verdict: revise
  source_fidelity: 'Isi ederede Grik na-ekwu ngọzi Pọl a na-emebu: “Ka amara nke Onyenwe anyị Jizọs Kraịst dịnyere unu niile. Amen.” Nsụgharị a na-edobe χάρις (“amara”), κυρίου ἡμῶν (“Onyenwe anyị”), na μετὰ πάντων ὑμῶν (“dịnyere unu niile”) nke ọma. Ịtinye amaokwu a n’isi ederede ma kọwaa na akaebe ihe odide dị iche bụ ụzọ kwesịrị ekwesị, ebe SBLGNT kpọchiri ya n’akara dịka akụkụ a na-enwe arụmụka gbasara ederede.'
  naturalness: Isi ederede ahụ dị n’Igbo ọkọlọtọ, dị mkpirikpi ma dabara n’ụdị ngọzi. “Dịnyere unu niile” bụ asụsụ a na-ahụkarị ma bụrụ nke sitere n’okike n’ọnọdụ a. Otú ọ dị, ndetu ala peeji ahụ nwere ahịrịokwu ole na ole na-adịghị edo anya nke ọma, karịsịa “na-etinye ya n’akara” na “ọgụgụ ihe odide a na-ejighị n'aka.”
  terminology: “Onyenwe anyị,” “Jizọs Kraịst,” “amara,” na “Amen” dabara n’ọrụ ụka na Igbo ọkọlọtọ. “Kraịst” bụ aha-ọrụ e guzobere nke ọma n’Igbo; nkọwa na ọ pụtara “Mesaya” nwere ike ịdị, ma a ghaghị ikewapụ ya nke ọma na ndetu mgbanwe ihe odide ka ọrụ ndetu ọ bụla ghara ịdị mgbagwoju anya.
  issues:
