  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: ig
  text: Ka amara nke Onyenwe anyị Jizọs Kraịst dịnyere unu niile.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ụfọdụ ihe odide nwere amaokwu a, ma ụfọdụ ndị ọzọ anaghị enwe ya. Ọtụtụ mbipụta Agba Ọhụrụ Grik nke oge a na-etinye ya n’akara dị ka mgbanwe ederede n’ọgwụgwụ akwụkwọ ozi ndị Rom.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihuọma na onyinye ọma Chineke; ọ dabara n'okwu ngọzi Pọl ma chekwaa ịdị arọ nke okwu Grik ahụ.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: N'aha a e nyere Jizọs, “Onyenwe anyị” na-egosipụta κύριος dị ka onye nwere ọchịchị ma bụrụkwa ụzọ Igbo sitere n'okike e si ekwu “our Lord.”
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Kraịst
  rationale: “Jizọs” na “Kraịst” bụ ụdị aha ndị guzosiri ike n'Igbo; “Kraịst” na-anọchi anya aha-ọrụ Χριστός, ya bụ Mesaya.
- source_word: μετὰ πάντων ὑμῶν
  choice: dịnyere unu niile
  rationale: Nkebi a na-ekwupụta ọchịchọ ka amara ahụ nọnyere ndị niile a na-agwa okwu, na-ahapụghị onye ọ bụla.
- source_word: Ἀμήν
  choice: Amen
  rationale: Nke a bụ ụdị okwu nkwenye litọjik a maara nke ọma n'Igbo ma na-edobe ọdịdị okwu Semitik ahụ.
theological_decisions:
- issue: Ụzọ e si sụgharịta Χριστός n'aha Ἰησοῦ Χριστοῦ
  choice: Kraịst
  alternative: Mesaya
  rationale: “Kraịst” bụ ụdị ọdịnala Igbo nke a ghọtara nke ọma n'aha a; ihe ọ pụtara dị ka aha-ọrụ bụ “Mesaya,” nke a kọwara n'ala peeji ka ihe ahụ ghara ifunahụ.
- issue: Ọnọdụ amaokwu ahụ n'ihe odide
  choice: E tinyere amaokwu ahụ ma kaa ya akara [a]
  alternative: Ịhapụ amaokwu ahụ n'isi ederede
  rationale: 'Ihe akaebe ihe odide kewara ekewa: ụfọdụ ihe odide nwere ngọzi a, ebe ndị ọzọ enweghị ya. Ịgụnye ya dịka amaokwu a rịọrọ ma kọwaa mgbanwe ahụ na ndetu na-echekwa esemokwu ihe odide ahụ n''emeghị ka a ga-asị na e doziri ya kpamkpam.'
translation_notes:
  register: Standard Igbo; asụsụ dị mfe, dị nsọpụrụ, ma bụrụ nke ndị na-agụ Igbo taa ga-aghọta. A họọrọ “dịnyere” maka ụdị ngọzi dị n'amaokwu ahụ, a zerekwa ịgbakwunye ngwaa na nkọwa ndị na-adịghị n'isi mmalite.
