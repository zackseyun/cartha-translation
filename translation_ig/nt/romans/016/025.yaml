source:
  edition: robinson-pierpont-2005-byzantine
  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: ig
  text: '[a] Ma nye onye ahụ pụrụ ime ka unu guzosie ike dị ka oziọma m na nkwusa nke Jizọs bụ Mesaya si dị, dịkwa ka mkpughe nke ihe omimi ahụ e debere na nzuzo kemgbe ogologo oge gara aga si dị,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Amaokwu 25–27 bụ abụ otuto e ji mechie akwụkwọ ozi a, nke dị n'ebe dị iche iche n'ime ihe odide ochie. N'ọtụtụ ihe odide ndị so n'usoro Baizanta, ọ dị na ngwụcha isi nke 14; n'ime papaịrọs kacha ochie fọdụrụ ruo taa, ọ dị mgbe isi nke 15 gasịrị; ma n'ime ihe odide ndị a ma ama sitere na narị afọ nke anọ nakwa n'usoro ihe odide Latịn, ọ dị ebe a na ngwụcha isi nke 16. Ụfọdụ ihe odide nwere ya n'ọtụtụ ebe, ebe ole na ole enweghị ya ma ọlị. Ọtụtụ nsụgharị nke oge a na-edebe ya ebe a dị ka mmechi akwụkwọ ozi Pọl.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: ime ka unu guzosie ike
  rationale: Nkebi a na-egosi ime ka ndị kwere ekwe sie ike ma nọgide na-eguzosi ike n'okwukwe; ọ bụkwa okwu Igbo doro anya ma dị ebube.
- source_word: εὐαγγέλιόν μου
  choice: oziọma m
  rationale: “Oziọma” bụ okwu a maara nke ọma n'Igbo maka ozi ọma banyere nzọpụta; nnọchiaha “m” na-edobe ụzọ Pọl si kpọọ ozi ahụ nke ya.
- source_word: κήρυγμα Ἰησοῦ Χριστοῦ
  choice: nkwusa nke Jizọs bụ Mesaya
  rationale: “Nkwusa” na-enye echiche nke ozi a na-ekwusa n'ihu mmadụ. Nhazi “nke Jizọs bụ Mesaya” na-ahapụ ohere ụtọasụsụ Jenitiv nke Grik nwere—ma ọ bụ nkwusa banyere ya ma ọ bụ nke jikọrọ ya na ya—n'ebughị ụzọ kpebie ya n'ụzọ siri ike.
- source_word: ἀποκάλυψιν
  choice: mkpughe
  rationale: Ọ na-egosi iwepụ ihe kpuchiri eziokwu ka a mara ya, ọ bụghị nanị ịkọwa ihe.
- source_word: μυστηρίου
  choice: ihe omimi ahụ
  rationale: N'ebe a, ọ bụ atụmatụ ma ọ bụ eziokwu Chineke nke e zoro ezo ma mesịa kpughee, ọ bụghị ihe mmadụ na-apụghị ịghọta ma ọlị.
- source_word: σεσιγημένου
  choice: e debere na nzuzo
  rationale: Perfect passive a na-egosi na ihe omimi ahụ nọgidere bụrụ nke a na-ekwughị ma ọ bụ nke a na-ekpughebeghị ruo oge ahụ; okwu a na-asụ n'Igbo na-ebute echiche ahụ nke ọma.
- source_word: χρόνοις αἰωνίοις
  choice: kemgbe ogologo oge gara aga
  rationale: N'okwu a, nkebi ahụ na-ezo aka n'ogologo oge ndị gara aga, ọ bụghị ikwu na oge n'onwe ya enweghị njedebe.
theological_decisions:
- issue: Ihe Jenitiv pụtara n'okwu κήρυγμα Ἰησοῦ Χριστοῦ
  choice: Ejiri “nkwusa nke Jizọs bụ Mesaya” mee ka njikọ ahụ ghara ịbụ nke a kọwara karịa ihe Grik kwuru.
  alternative: “nkwusa banyere Jizọs bụ Mesaya” ma ọ bụ “nkwusa Jizọs bụ Mesaya kwusara”
  rationale: Grik nwere ike ịpụta nkwusa banyere Jizọs Mesaya, ma ọ bụ nkwusa sitere n'aka ya/nke ya. Nsụgharị ahụ echekwala ohere abụọ ahụ kama ikpebi otu n'ime ha n'enweghị mkpa.
- issue: Χριστός dị ka aha ọ bụ utu aha
  choice: Jizọs bụ Mesaya
  alternative: Jizọs Kraịst
  rationale: Χριστός bụ utu aha nke pụtara Onye E Tere Mmanụ, ya bụ Mesaya. Nsụgharị a na-eme ka ihe utu aha ahụ pụtara pụta ìhè n'Igbo.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, dee ya. A hapụrụ ahịrịokwu ahụ ka ọ gaa n'ihu n'amaokwu ndị na-esote, dịka usoro doxology Grik si dị; etinyeghị “otuto” n'amaokwu a n'ihi na okwu ahụ pụtara kpọmkwem n'amaokwu 27. Akara nkọwa ala [a] dị n'isi ederede ma kwekọọ na nkọwa ya.
