revisions:
- from: N’ihi na ọdịiche adịghị n’etiti onye Juu na onye Grik[a], n’ihi na otu Onyenwe anyị ahụ bụ Onyenwe mmadụ niile[b], ọ na-enyekwa ndị niile na-akpọku ya akụ ya n’ụba.
  to: N’ihi na ọdịiche adịghị n’etiti onye Juu na onye Grik[a], n’ihi na otu Onyenwe ahụ bụ Onyenwe mmadụ niile[b], na-enwe akụ n’ụba n’ebe ndị niile na-akpọku ya nọ.
  rationale: The revision removes the unexpressed possessive from the title “Lord” and restores the source’s participial image of abundance without converting it into an explicit bestowal of “his wealth.” It retains the source transparency of Jew/Greek, the universal scope of the Lord’s lordship, and the qualifying phrase “those who call on him.”
