id: ROM.10.12
reference: Romans 10:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: ig
  text: N’ihi na ọdịiche adịghị n’etiti onye Juu na onye Grik[a], n’ihi na otu Onyenwe ahụ bụ Onyenwe mmadụ niile[b], na-enwe akụ n’ụba n’ebe ndị niile na-akpọku ya nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’asụsụ Grik, “onye Grik.” N’ebe a, ijikọta “onye Juu” na “onye Grik” na-egosi ndị Juu na ndị na-abụghị ndị Juu. Ụfọdụ nsụgharị na-asụ ya “onye mba ọzọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “otu Onyenwe ahụ na-achị mmadụ niile.”
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: ọdịiche
  rationale: Okwu a na-egosi na e nweghị nkewa ma ọ bụ ịkpa ókè n’etiti ìgwè abụọ ahụ; “ọdịiche” bụ Igbo doro anya ma dịkwa nkenke.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: onye Juu ... onye Grik
  rationale: E debere “onye Grik” dịka ederede Grik si kwuo, kama iji “onye mba ọzọ” dochie ya; n’ebe a, njikọ ahụ na-anọchi anya ndị Juu na ndị na-abụghị ndị Juu.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: otu Onyenwe anyị ahụ bụ Onyenwe mmadụ niile
  rationale: Nke a na-eme ka nkwupụta ahịrịokwu Grik pụta ìhè n’Igbo, na-echekwakwa echiche na otu Onyenwe ahụ na-achị mmadụ niile.
- source_word: κύριος
  choice: Onyenwe anyị
  rationale: Nke a bụ aha nsọpụrụ kwekọrọ na κύριος n’ọnọdụ a ma na-echekwa ịdị arọ nke ihe Pọl na-ekwu banyere Kraịst.
- source_word: πλουτῶν εἰς πάντας
  choice: ọ na-enyekwa ... akụ ya n’ụba
  rationale: Nsụgharị okwu n’usoro nkịtị dịka “ịbụ ọgaranya n’ebe mmadụ niile nọ” agaghị ada nke ọma n’Igbo. Okwu a na-echekwa ihe atụ nke akụ na ụba ma mee ka echiche nke mmesapụ aka ya doo anya.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: ndị niile na-akpọku ya
  rationale: “Ịkpọku” na-egosi ịkpọku Onyenwe anyị n’okwukwe ma kwekọọ na ihe amaokwu na-esote na-ekwu.
theological_decisions:
- issue: Onye okwu “Onyenwe anyị” na-ezo aka na ya
  choice: E debere naanị aha “Onyenwe anyị,” ka ọnọdụ gbara amaokwu ahụ gburugburu gosi na ọ na-ezo aka na Jizọs.
  alternative: Ịkọwa ya n’ime amaokwu dịka “Jizọs Kraịst” ma ọ bụ were ya dịka okwu izugbe banyere Chineke.
  rationale: Ndị Rom 10:9–13 na-ekwu maka ikwupụta Jizọs dịka Onyenwe anyị ma na-ejikọkwa nke ahụ na ịkpọku Onyenwe anyị. Ịghara itinye aha ọzọ na-echekwa nkwughachi Akwụkwọ Nsọ na ịdị arọ nke nkwupụta Pọl.
- issue: Ókè okwu “mmadụ niile” ruru
  choice: “Mmadụ niile” na-egosi na Onyenwe anyị bụ Onyenwe mmadụ niile, ebe ndị na-enweta akụ ya n’ụba bụ “ndị niile na-akpọku ya.”
  alternative: Ịgụ ya dịka nkwupụta na onye ọ bụla na-enweta nzọpụta n’enweghị ihe ọzọ.
  rationale: Usoro okwu Grik na-echekwa ma ịdị n’otu nke ndị Juu na ndị Grik ma nkọwa nke ndị na-akpọku ya; nsụgharị ahụ anaghị ewepụ esemokwu nkà mmụta okpukpe a.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Onyenwe anyị” na-echekwa aha nsọpụrụ κύριος; “akụ ya n’ụba” na-eme ka ihe atụ πλουτῶν bụrụ okwu Igbo sitere n’okike, na-enweghị ịkọwapụta ya karịa ihe isi mmalite kwuru.
