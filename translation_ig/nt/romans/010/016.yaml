id: ROM.10.16
reference: Romans 10:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: ig
  text: Ma ọ bụghị mmadụ niile rubere ozi ọma[a] isi. N’ihi na Aịzaya na-ekwu, “Onyenwe anyị, ònye kweere ozi anyị[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oziọma.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “akụkọ anyị”; n’ụzọ nkịtị, “ịnụ anyị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Ma
  rationale: Na-egosi ntụgharị uche megide ihe e kwuru tupu ya n’ụzọ dị mkpirikpi ma bụrụkwa Igbo nkịtị.
- source_word: οὐ πάντες
  choice: ọ bụghị mmadụ niile
  rationale: Na-echekwa nkwụghachi nke metụtara ụfọdụ, n’ebughị echiche na mmadụ niile jụrụ ozi ahụ.
- source_word: ὑπήκουσαν
  choice: rubere ... isi
  rationale: ‘Irubere isi’ na-egosi nrubeisi, ọ bụghị naanị ịnụ ihe ma ọ bụ ige ntị.
- source_word: τῷ εὐαγγελίῳ
  choice: ozi ọma
  rationale: Nke a na-egosipụta ihe εὐαγγέλιον pụtara n’Igbo doro anya; ‘oziọma’ bụkwa ụzọ ọdịnala e si ede ya, ya mere e debere ya n’ala peeji.
- source_word: Ἠσαΐας
  choice: Aịzaya
  rationale: Ọ bụ nsụgharị aha onye amụma ahụ a na-ejikarị eme ihe n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Na-ewebata ihe Akwụkwọ Nsọ kwuru iji kwado okwu bu ya ụzọ.
- source_word: λέγει
  choice: na-ekwu
  rationale: Na-echekwa oge ugbu a nke Grik, nke na-egosi Akwụkwọ Nsọ dịka olu ka na-ekwu okwu.
- source_word: Κύριε
  choice: Onyenwe anyị
  rationale: Ọ bụ ụzọ nkwanye ùgwù na nke a maara nke ọma e si akpọ Onye-nwe n’Igbo.
- source_word: τίς
  choice: ònye
  rationale: Ajụjụ onye a kwekọrọ ozugbo na okwu Grik.
- source_word: ἐπίστευσεν
  choice: kweere
  rationale: Na-egosipụta ikwere ozi ahụ n’enweghị ịgbakwunye nkọwa ozizi ọzọ.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: ozi anyị
  rationale: ἀκοή nwere ike ịbụ ihe a nụrụ, akụkọ e wetara, ma ọ bụ ozi a kpọsara; ‘ozi anyị’ bụ Igbo doro anya n’ebe a ma na-ahapụ nkọwa ndị ọzọ n’ala peeji.
theological_decisions:
- issue: Ụdị nzaghachi ὑπήκουσαν na-achọ n’ebe ozi ọma dị
  choice: rubere ozi ọma isi
  alternative: gere ozi ọma ntị; nabatara ozi ọma
  rationale: Ngwaa Grik pụtara nrubeisi karịa nanị ịnụ ihe. Nsụgharị a na-echekwa njikọ Pọl na-eme n’etiti okwukwe na nzaghachi nrubeisi, n’etinyeghị usoro ozizi otu ụka.
- issue: Ihe ἀκοή pụtara n’okwu Aịzaya
  choice: ozi anyị
  alternative: akụkọ anyị; ihe anyị nụrụ
  rationale: Okwu ahụ nwere ike izo aka n’ihe a nụrụ ma ọ bụ n’ozi a kpọsara. ‘Ozi anyị’ kacha bụrụ Igbo eke n’ahịrịokwu a, ebe ala peeji na-echekwa nghọta ndị ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dịkwa mfe nghọta. ‘Irubere ... isi’ na-echekwa ike nke nrubeisi dị na Grik, ebe ‘ozi anyị’ na-eme ka okwu Aịzaya doo anya n’Igbo n’enweghị imechi nghọta ọzọ nke ἀκοή.
