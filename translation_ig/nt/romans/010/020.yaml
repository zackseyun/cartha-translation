  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: ig
  text: Ma Aịzaya jiri nnukwu obi ike sị, “Ndị na-achọghị m chọtara m[a]; apụtara m ìhè nye ndị na-adịghị ajụ m ase[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “A chọtara m n’etiti ndị na-achọghị m.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Egosiri m onwe m nye ndị na-adịghị ajụ m ase.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: ji nkwuwa okwu dị ukwuu kwuo
  rationale: Nke a na-egosipụta obi ike na nkwuwa okwu dị n'okwu Grik ahụ, ma na-ada nke ọma n'Igbo ugbu a.
- source_word: Εὑρέθην
  choice: Ndị ... chọtara m
  rationale: Ụdị a na-edobe olu nnara nke okwu Grik n'ụzọ Igbo si ekwu ya nke ọma, ma na-eme ka Chineke bụrụ onye a chọtara.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: Ndị na-achọghị m
  rationale: Ọ bụ ezie na ἐν nwere ike ịbụ ‘n’etiti,’ n’ebe a ọ na-egosi ndị chọtara onye na-ekwu okwu; ụdị a bụ nke doro anya ma bụrụ Igbo eke.
- source_word: ζητοῦσιν
  choice: na-achọ
  rationale: ‘Ịchọ’ na-echekwa echiche nke iji ọchịchọ na-achọ onye, ma kwekọọ na asụsụ Akwụkwọ Nsọ n'Igbo.
- source_word: ἐμφανὴς ἐγενόμην
  choice: emere m ka ... hụ m anya
  rationale: Nke a na-ekwupụta ngosipụta ma ọ bụ ịpụta ìhè nke okwu Grik n'Igbo nghọta, n'agbanyeghị na ọ dị ntakịrị nkọwa karịa nhazi Grik.
- source_word: ἐπερωτῶσιν
  choice: na-ajụghị ase banyere m
  rationale: ‘Ịjụ ase banyere’ na-egosi ịjụ ma ọ bụ ịchọ ịmata banyere mmadụ, na-enweghị ibubata echiche pụrụ iche nke ịkpọku.
- source_word: δὲ
  choice: Ma
  rationale: ‘Ma’ na-egosi njikọ nwere ọdịiche n'etiti amaokwu a na ihe bu ya ụzọ.
- source_word: Ἠσαΐας
  choice: Aịzaya
  rationale: A na-eji ụdị aha a maara nke ọma n'Igbo maka onye amụma ahụ.
theological_decisions:
- issue: Otu e si sụgharị ngosipụta Chineke n'okwu e hotara n'Aịzaya
  choice: emere m ka ndị na-ajụghị ase banyere m hụ m anya
  alternative: aghọrọ m onye pụtara ìhè nye ndị na-ajụghị ase banyere m
  rationale: Nhọrọ bụ isi na-enye ἐμφανὴς ἐγενόμην n'Igbo doro anya ma na-echekwa echiche ngosipụta ahụ. Nhọrọ ọzọ dị nso n'ụdị Grik, ma ọ naghị ada ka Igbo eke.
- issue: Onye na-eme ihe n'okwu ‘a chọtara m’
  choice: Ndị na-achọghị m chọtara m
  alternative: A chọtara m n’etiti ndị na-achọghị m
  rationale: Nhọrọ bụ isi na-eme ka mmekọrịta ahụ doo anya n'Igbo, ma ihe ọzọ na-echekwa ἐν n'ụzọ nkịtị ma hapụ ntakịrị nghọta abụọ dị n'okwu ahụ.
translation_notes:
  register: Igbo ọkọlọtọ, nke ugwu ma doo ndị nkịtị anya. E ji ‘nkwuwa okwu dị ukwuu’ gosipụta ike ἀποτολμᾷ; e zere okwu ụka pụrụ iche. Akara ntụaka [a] na [b] dị n'ederede bụ isi ma kwekọọ na nkọwa ala peeji.
