  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: ig
  text: N’ihi na Akwụkwọ Nsọ na-ekwu sị, “Onye ọ bụla nke kwere na ya, a gaghị eme ya ihere.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Onye ọ bụla nke kwere na ya, ihere agaghị eme ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: na-ekwu
  rationale: Oge ugbu a dabara n’usoro e si ewebata ihe e dere n’Akwụkwọ Nsọ, ma na-ada nke ọma n’Igbo.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe ndabere maka okwu bu ya ụzọ, ma si otú ahụ chekwaa usoro arụmụka Pọl.
- source_word: ἡ γραφή
  choice: Akwụkwọ Nsọ
  rationale: N’usoro okwu Pọl ji ewebata ihe o hotara, γραφή na-ezo aka n’ihe odide dị nsọ, ọ bụghị naanị ihe e dere n’ozuzu.
- source_word: Πᾶς ὁ πιστεύων
  choice: Onye ọ bụla nke kwere
  rationale: Nke a na-egosipụta oke zuru ụwa ọnụ nke okwu Grik ahụ n’Igbo dị mfe nghọta, na-enweghị ime ka ọ bụrụ naanị nwoke.
- source_word: πιστεύων
  choice: kwere
  rationale: ‘Kwere’ bụ ụzọ Igbo nkịtị si egosipụta okwukwe e tinyere n’ime mmadụ n’ebe a; njikọ ‘kwere na ya’ na-egosi ntụkwasị obi, ọ bụghị naanị ikweta na ihe bụ eziokwu.
- source_word: ἐπ’ αὐτῷ
  choice: na ya
  rationale: Mgbe e jikọtara ya na ‘kwere,’ ọ na-egosi na ọ bụ onye ahụ ka a tụkwasịrị obi. E debere nnọchiaha ahụ ka a ghara ịgbakwunye nkọwa na-adịghị na ahịrịokwu ahụ.
- source_word: καταισχυνθήσεται
  choice: a gaghị eme ya ihere
  rationale: Nke a na-echekwa ọdịdị nnara-eme nke ngwaa Grik na echiche nke ịbụ onye e mere ihere n’ihu ọha, kama ịbụ naanị mmetụta ihere n’obi.
theological_decisions:
- issue: Nkọwa nwoke nke ụtọasụsụ dị na Πᾶς ὁ πιστεύων
  choice: Onye ọ bụla nke kwere
  alternative: Nwoke ọ bụla nke kwere
  rationale: Ụdị nwoke otu n’asụsụ Grik nwere ọrụ izugbe ebe a, ọ naghị ezo aka naanị n’ụmụ nwoke. Nsụgharị ahụ na-egosipụta nzube a n’Igbo.
- issue: Onye αὐτῷ na-ezo aka na ya
  choice: ya
  alternative: Kraịst / Onyenwe anyị
  rationale: Ihe gbara amaokwu ahụ gburugburu na-egosi onye a na-ekwere na ya, ma ide naanị nnọchiaha ahụ na-echekwa ụdị okwu a hotara ma zere itinye nkọwa n’ime ederede.
- issue: Ihere dịka omume e mere mmadụ ma ọ bụ mmetụta dị n’ime ya
  choice: a gaghị eme ya ihere
  alternative: ihere agaghị eme ya
  rationale: Ọdịdị ọdịnihu nnara-eme nke καταισχυνθήσεται na ndabere Aịzaya kwadoro echiche nke na a gaghị eme ka onye ahụ bụrụ onye ihere ma ọ bụ onye ndakpọ olileanya n’ihu ọha; agbanyeghị, ụzọ nke mmetụta ihere ka bụ ihe ọzọ okwu ahụ pụrụ ịpụta.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Akwụkwọ Nsọ na-ekwu’ bụ usoro okwu sitere n’okike n’Igbo; ‘a gaghị eme ya ihere’ na-echekwa nnara-eme na echiche nke mmechuihu n’ihu ọha. Akara nkọwa ala ala [a] pụtara n’ederede isi.
