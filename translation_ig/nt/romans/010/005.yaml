id: ROM.10.5
reference: Romans 10:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: ig
  text: 'N’ihi na Mosis dere banyere ezi omume[a] nke sitere n’Iwu ahụ: “Onye[b] na-eme ya ga-adị ndụ n’ime ya.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ezi omume” dịka “ikpe ziri ezi” (δικαιοσύνη).
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu ahụ dị n’ụdị ụtọasụsụ masculine singular, ma ebe a ọ na-anọchi mmadụ ọ bụla na-eme ya.
    reason: cultural_note
  - marker: c
    text: A pụkwara ịsụgharị ya, “ga-adị ndụ site na ya.” Okwu “ya” bụ otu (singular) n’asụsụ Grik. Pọl na-atụgharị Levitikọs 18:5.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na ihe a bụ nkọwa na-akwado arụmụka bu ụzọ; “N’ihi na” bụ njikọ doro anya ma bụrụkwa nke e ji ekwu okwu n’Igbo taa.
- source_word: γράφει
  choice: dere
  rationale: Ọ bụ usoro e ji kpọtụrụ Akwụkwọ Nsọ. Ọ bụ ezie na Grik ji oge ugbu a, “Mosis dere” bụ ụzọ ebumpụta ụwa e si ekwu ya n’Igbo ma na-echekwa echiche nke ihe e dere nke ka na-agba akaebe.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: “Ezi omume” na-egosi ọnọdụ nke ịbụ onye ziri ezi n’ihu Chineke n’ụzọ ndị Igbo nkịtị ga-aghọta, ma na-ejikọkwa okwu a na ntụnyere Pọl na-eme n’etiti nke sitere n’Iwu na nke sitere n’okwukwe. A na-edebe “ikpe ziri ezi” dị ka nhọrọ ọzọ n’okpuru peeji.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: nke sitere n’Iwu ahụ
  rationale: “Sitere” na-echekwa echiche ἐκ nke isi mmalite, ebe “Iwu ahụ” na-egosi Iwu Mosis a maara nke ọma n’ọnọdụ a.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: Onye na-eme
  rationale: Aorist participle a na nkọwa Akwụkwọ Nsọ na-akọwa ụdị onye ji ime ihe ndị ahụ mara; oge ugbu a n’Igbo na-enye ụkpụrụ izugbe ahụ n’ụzọ dị mfe. “Onye” na-anọchi mmadụ ọ bụla n’enweghị ịgbakwunye nwoke ma ọ bụ nwanyị n’ebe Igbo na-adịghị eme nkewa ụtọasụsụ ahụ.
- source_word: ζήσεται
  choice: ga-adị ndụ
  rationale: Ọ na-echekwa ọdịnihu na ike nkwa dị n’okwu e hotara na Levitikọs 18:5.
- source_word: ἐν αὐτῇ
  choice: ga-esi na ha dị ndụ
  rationale: “Si na ha” na-egosi ndụ nke na-abịa site n’ime ihe ndị a, dịka echiche nke okwu e hotara si dị. E debere nsụgharị nkịtị karị nke singular Grik ahụ n’okpuru peeji n’ihi nghọtahie eziokwu dị n’etiti ụdị okwu a na nkwughachi Levitikọs.
theological_decisions:
- issue: Otu a ga-esi sụgharịa δικαιοσύνη na ntụnyere Pọl
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: “Ezi omume” na-echekwa isi echiche nke ọnọdụ ziri ezi na mmekọrịta ya na Chineke, ma “ikpe ziri ezi” nwere ike ime ka akụkụ ikpe na ikpe nkwụmọtọ pụta ìhè. A hapụrụ nhọrọ ahụ n’okpuru peeji kama idozi obosara okwu Grik ahụ n’otu ụzọ naanị.
- issue: Mmadụ onye ἄνθρωπος na-anọchi anya ya
  choice: Onye
  alternative: nwoke ahụ
  rationale: N’agbanyeghị na ụdị Grik ahụ bụ masculine singular n’ụtọasụsụ, ebe a ọ na-anọchi onye ọ bụla na-eme ihe ndị ahụ. Igbo “Onye” na-echekwa ike nnọchiteanya ahụ n’enweghị ịtụkwasị okike nwoke n’ihe okwu Grik ahụ apụtaghị kpọmkwem.
- issue: Mmekọrịta ἐν αὐτῇ na okwu Levitikọs 18:5 e hotara
  choice: ga-esi na ha dị ndụ
  alternative: ga-adị ndụ n’ime ya
  rationale: Isi ederede na-enye echiche okwu Levitikọs banyere ibi ndụ site n’ime ihe ndị ahụ; ihe ọzọ na-echekwa singular dị n’ederede Grik a. Nkọwa ala peeji na-eme ka esemokwu ederede na nkọwa ahụ ghara izochi.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. “Iwu” nwere mkpụrụedemede ukwu iji gosi Iwu Mosis n’ọnọdụ a. Usoro ahịrịokwu ahụ na-echekwa ọdịiche Pọl na-eme n’etiti ezi omume sitere n’Iwu na nke sitere n’okwukwe, ma ọ naghị akọwa esemokwu ahụ karịa ihe amaokwu ahụ kwuru.
