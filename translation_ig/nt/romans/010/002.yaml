revisions:
- from: N’ihi na ana m agba ama banyere ha na ha nwere ịnụ ọkụ n’obi maka Chineke[a], ma ọ bụghị dị ka ezi ihe ọmụma si dị[b].
  to: N’ihi na ana m agba ama banyere ha na ha nwere ịnụ ọkụ n’obi maka Chineke[a], ma ọ bụghị dị ka ihe ọmụma si dị[b].
  rationale: The revision removes the unsupported qualifier “ezi” so that the main line preserves the source phrase’s ambiguity while remaining idiomatic in Standard Igbo. It also corrects the idiom in footnote a. The objective reading of “zeal for God” remains clear, and both footnote anchors remain correctly placed and matched.
