base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: ig
  text: N’ihi na ana m agba ama banyere ha na ha nwere ịnụ ọkụ n’obi maka Chineke[a], ma ọ bụghị dị ka ihe ọmụma si dị[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ha nwere ịnụ ọkụ n’obi nke Chineke.” Okwu Grik ahụ nwekwara ike ịsụgharị ya otú a n’ụzọ nkịtị, ma n’ebe a o yikarịrị ka ọ pụtara ịnụ ọkụ n’obi e lekwasịrị anya na Chineke.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ bụghị site n’ihe ọmụma zuru ezu,” ma ọ bụ, “ọ bụghị nke dabere n’ihe ọmụma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: ana m agba ama
  rationale: Nke a na-egosipụta ngwaa dị n’oge ugbu a na ike nke Pọl ji kwupụta ihe ọ maara banyere ha.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejigide njikọ nkọwa amaokwu a na ihe e kwuru n’amaokwu gara aga.
- source_word: αὐτοῖς
  choice: banyere ha
  rationale: N’ebe a, dative ahụ na-arụtụ aka ná ndị a na-agba ama banyere ha, ọ bụghị ndị a na-agwa ama ahụ.
- source_word: ζῆλον
  choice: ịnụ ọkụ n’obi
  rationale: Akpaala okwu Igbo a na-egosi oke mmasị na ịnụ ọkụ n’obi n’ụzọ ndị mmadụ na-aghọta nke ọma.
- source_word: θεοῦ
  choice: maka Chineke
  rationale: A ghọtara genitive ahụ dịka ihe ịnụ ọkụ n’obi ha lekwasịrị anya na ya, ya bụ Chineke, ma e debere nkọwa ọzọ n’ala peeji.
- source_word: ἔχουσιν
  choice: ha nwere
  rationale: Ọ bụ nsụgharị kwụ ọtọ na nke sitere n’okike maka present indicative a.
- source_word: ἀλλ’
  choice: ma
  rationale: Ọ na-egosipụta ọdịiche doro anya n’etiti ịnụ ọkụ n’obi ha na enweghị ihe ọmụma kwesịrị ekwesị.
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: ọ bụghị dị ka ezi ihe ọmụma si dị
  rationale: Ọ na-edobe echiche κατά + accusative, ya bụ na ịnụ ọkụ n’obi ha adabaghị n’ihe ọmụma kwesịrị ekwesị; ‘ezi’ na-eme ka okwu ahụ doo anya n’Igbo n’enweghị ịkọwa ya karịa akarị.
theological_decisions:
- issue: Ụdị ịnụ ọkụ n’obi Izrel nwere
  choice: Ịnụ ọkụ n’obi ha lekwasịrị Chineke anya, ma ọ dabereghị n’ezi ihe ọmụma.
  alternative: Ha nwere ịnụ ọkụ n’obi nke Chineke n’onwe ya, ma ọ bụ ịnụ ọkụ n’obi n’okpukpe nke a na-ekwughị ihe ọ lekwasịrị anya na ya.
  rationale: 'N’ọnọdụ okwu a, ζῆλον θεοῦ yikarịrị ka ọ bụ objective genitive. Nke a na-edobe esemokwu dị n’amaokwu ahụ: Pọl kwetara na ha ji obi ha niile achọ Chineke, ma ọ gọnahụghị na nghọta ha ezughị oke.'
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. ‘Ana m agba ama’ na-edobe ụda okwu iwu na ihe akaebe; ‘ịnụ ọkụ n’obi’ bụ okwu a na-ejikarị eme ihe maka zeal. Akara ala peeji [a] na [b] pụtara n’ebe kwesịrị ekwesị n’ahịrị isi.
