id: ROM.10.18
reference: Romans 10:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: ig
  text: 'Ma ana m ajụ, sị: “Ọ̀ bụghị na ha nụrụ?” N’ezie, ha nụrụ: “Ụda ha agawala n’ụwa niile,[a][c] okwu ha agawala na nsọtụ ụwa mmadụ bi.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “Olu ha agawala n’ụwa niile.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ naanị, “ụwa”; okwu Grik pụtara ụwa ndị mmadụ bi.
    reason: lexical_alternative
  - marker: c
    text: Pọl na-ehota Abụ Ọma 19:4 ma na-eji okwu ya kọwaa mgbasa ozi ahụ.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: Ọ̀ bụ na ha anụghị?
  rationale: Ajụjụ a nwere nkwugharị njụ n’asụsụ Grik ma na-atụ anya azịza nke na-ekweta na ha nụrụ. Usoro a bụ ụzọ Igbo doro anya si chekwaa ajụjụ ahụ.
- source_word: μενοῦνγε
  choice: Ee, ha nụrụ n’ezie
  rationale: Nke a na-enye azịza nkwenye siri ike nye ajụjụ ahụ; itinye ngwaa ahụ ọzọ na-eme ka okwu ahụ doo anya ma bụrụ Igbo e ji eme ihe.
- source_word: φθόγγος
  choice: ụda
  rationale: ‘Ụda’ bụ ntụgharị kpọmkwem nke na-ahapụ ma ọ bụ ụda ma ọ bụ olu nkwusa ka ihe e hotara n’Abụ Ọma nwee ike iburu, n’enweghị ịkọwa onye okwu ahụ na-ekwu maka ya.
- source_word: γῆ
  choice: ụwa
  rationale: N’okwu uri a nke na-egosi mgbasa zuru ebe niile, ‘ụwa’ dabara karịa ‘ala,’ nke pụrụ ịpụta otu mpaghara.
- source_word: ἐξῆλθεν
  choice: eruola
  rationale: ‘Eruola’ na-egosi na ụda ahụ apụtala wee ruo ebe niile, ma na-enye Igbo dị mfe ma dị ndụ maka ihe omume gara aga nke mmetụta ya ka dị.
- source_word: πέρατα
  choice: nsọtụ
  rationale: ‘Nsọtụ’ bụ okwu Igbo nkịtị maka akụkụ ndị kacha anya ma na-echekwa oyiyi uri dị n’okwu Grik.
- source_word: οἰκουμένης
  choice: ụwa mmadụ bi
  rationale: Nke a na-echekwa nkọwa pụrụ iche nke okwu Grik dịka ụwa ndị mmadụ bi, kama ịsụgharị ya naanị dịka ‘ụwa.’
- source_word: ῥήματα
  choice: okwu
  rationale: ‘Okwu’ bụ ntụgharị kpọmkwem nke na-echekwa njikọ uri dị n’etiti ‘ụda’ na ‘okwu.’
theological_decisions:
- issue: Ndị nnọchiaha ‘ha’ na-ezo aka na ha n’okwu e hotara n’Abụ Ọma
  choice: Idowe ‘ha’ n’enweghị ịkpọ aha ndị ọ na-ezo aka na ha
  alternative: Ịkọwa ya dịka eluigwe nke Abụ Ọma 19 kwuru maka ya, ma ọ bụ dịka ndị nkwusa ozi ọma n’otú Pọl si jiri okwu ahụ mee ihe
  rationale: Pọl hotara Abụ Ọma 19 ma jiri asụsụ ya kwuo maka mgbasa ozi ahụ. Ịhapụ nnọchiaha ahụ dịka ọ dị na-echekwa esemokwu na nghọta dị iche iche nke akụkụ Akwụkwọ Nsọ abụọ ahụ, kama idozi ya n’ụzọ nkọwa otu echiche.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E chekwara usoro ajụjụ na azịza siri ike nke Grik, tinyere nhazi uri nke ‘ụda’ na ‘okwu.’
