  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: ig
  text: N’ihi na Mezaya bụ njedebe Iwu ahụ maka ezi omume nye onye ọ bụla kwere ekwe[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ebumnuche,” “ebe Iwu ahụ rutere n’uju,” ma ọ bụ “mmezu.” Okwu Grik a sụgharịrị “njedebe” nwere ike ịpụta ebe ihe kwụsịrị, ebumnuche, ma ọ bụ mmezu.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “ikpe ziri ezi” kama “ezi omume,” dịka e nwere ike isi ghọta okwu a n’akwụkwọ Pọl.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: njedebe
  rationale: '“Njedebe” na-edobe nghọta sara mbara nke τέλος: ọ pụrụ ịbụ ebe ihe kwụsịrị, ebumnuche ya, ma ọ bụ ebe o rutere n’uju. Ihe odide ala ala na-echekwa nghọta ndị ọzọ.'
- source_word: νόμου
  choice: Iwu ahụ
  rationale: N’ebe a, okwu ahụ na-arụtụ aka n’Iwu Mozis dịka ihe ndị na-agụ akwụkwọ maara, ọ bụghị iwu n’ozuzu ya.
- source_word: Χριστὸς
  choice: Mezaya
  rationale: Aha-ọkwa a na-egosipụta onye Chineke tere mmanụ ma dabara n’arụmụka Pọl banyere Izrel, Iwu ahụ, na nkwa ọgbụgba ndụ.
- source_word: εἰς δικαιοσύνην
  choice: ka … wee nweta ezi omume
  rationale: Usoro a na-egosipụta ntụziaka ma ọ bụ ihe si na ya pụta n’enweghị ikpebi nke ahụ kpamkpam; ọ bụkwa Igbo nkịtị karịa ntụgharị okwu n’usoro Grik kpọmkwem.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: “Ezi omume” bụ ụzọ doro anya e si kwuo δικαιοσύνη n’Igbo n’ebe a, ebe ihe odide ala ala na-echekwa “ikpe ziri ezi” dịka ụzọ ọzọ a pụrụ isi ghọta ya n’akwụkwọ Pọl.
- source_word: παντὶ τῷ πιστεύοντι
  choice: onye ọ bụla nke kwere
  rationale: Nke a na-echekwa ma echiche nke mmadụ niile n’otu n’otu ma omume nke ikwere, na-agbakwụghị nkọwa ụka ọ bụla.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-egosi na amaokwu a na-enye ihe kpatara ma ọ bụ nkọwa nke okwu bu ya ụzọ.
theological_decisions:
- issue: Ihe τέλος νόμου pụtara n’ihe metụtara Iwu Mozis
  choice: “njedebe” n’ahịrịokwu bụ isi
  alternative: “ebumnuche,” “ebe ọ rutere n’uju,” ma ọ bụ “mmezu”
  rationale: τέλος nwere ike ịpụta ma ebe ihe kwụsịrị ma ebumnuche/ọnụ ọgụgụ mmezu ya. Ịhọrọ “njedebe” ma tinye nkọwa ala ala na-echekwa esemokwu nkọwa ahụ kama idozi ya n’otu ụzọ.
- issue: Ntughari Χριστός
  choice: Mezaya
  alternative: Kraịst
  rationale: N’amaokwu a, aha-ọkwa ahụ jikọtara Jizọs na akụkọ Iwu na olileanya ọgbụgba ndụ Izrel, ya mere “Mezaya” na-eme ka ọrụ aha-ọkwa ahụ pụta ìhè.
- issue: Ntughari δικαιοσύνη
  choice: ezi omume
  alternative: ikpe ziri ezi
  rationale: “Ezi omume” dabara nke ọma n’okwu Pọl ebe a ma na-anọgide na-adị mfe nghọta; ihe ọzọ “ikpe ziri ezi” dị n’ala ala n’ihi na ọ pụrụ ime ka akụkụ ikpe nkwụmọtọ nke okwu ahụ pụta ìhè.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị ùgwù, ma dị mfe nghọta. E ji “Iwu ahụ” kpọọ Iwu Mozis, “Mezaya” wee chekwaa ọrụ Χριστός dịka aha-ọkwa. Usoro ahịrịokwu ahụ bụ nke Igbo ebumpụta ụwa ma na-echekwa ike nke εἰς dịka ebumnuche ma ọ bụ ihe si na ya pụta.
