id: ROM.10.6
reference: Romans 10:6
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: ig
  text: 'Ma ezi omume[a] nke sitere n’okwukwe na-ekwu otu a: “Asịla n’obi gị, ‘Ònye ga-arịgo n’eluigwe?’”[c] (ya bụ, iwetada Mesaịa[b]).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ikpe ziri ezi nke sitere n’okwukwe.” N’ebe a okwu Grik δικαιοσύνη nwere ike ịpụta ma “ezi omume” ma “ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Kraịst.” E dere ya “Mesaịa” n’ebe a n’ihi na Χριστός na-arụ ọrụ dịka aha ọkwá, ọ bụghị naanị dịka aha mmadụ.
    reason: lexical_alternative
  - marker: c
    text: Pọl na-ekwughachi echiche dị na Diuterọnọmi 30:12 ma na-etinye ya n’ọrụ banyere Mesaịa.
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” bụ ụzọ Igbo a na-aghọta nke ọma isi kwuo ịbụ onye ziri ezi n’ihu Chineke. Ọ na-edebekwa okwu ahụ dịka isiokwu nke “na-ekwu,” dịka Grik si mee ya.
- source_word: ἐκ πίστεως
  choice: nke sitere n’okwukwe
  rationale: Nke a na-egosipụta echiche ἐκ, “sitere na,” ma na-edobe ọdịiche Pọl na-eme n’etiti ezi omume sitere n’okwukwe na nke dabeere n’iwu.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ okwu Igbo doro anya ma bụrụkwa nke kwesịrị ekwesị n’ebe a; ahịrịokwu a abụghị ihe owuwu πίστις Χριστοῦ nke nwere arụmụka pụrụ iche.
- source_word: οὕτως λέγει
  choice: na-ekwu otu a
  rationale: 'Nke a bụ Igbo dị mfe ma dị ebube, na-edobekwa onyenọchianya okwu ahụ: ezi omume n’onwe ya “na-ekwu.”'
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Asịla n’obi gị
  rationale: Nke a na-agbasochi okwu Deuterọnọmi anya ma na-egosi echiche mmadụ na-ekwu n’ime onwe ya.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Ònye ga-arịgo n’eluigwe?
  rationale: “Arịgo n’eluigwe” bụ okwu Igbo e ji ekwu nrịgo ruo eluigwe n’ụzọ dị mma ma kwekọọ na ἀναβήσεται εἰς τὸν οὐρανόν.
- source_word: Χριστόν
  choice: Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka aha ọkwá nke Onye Chineke tere mmanụ, ya mere “Mesaịa” na-echekwa ọrụ ahụ karịa iji “Kraịst” dịka a ga-asị na ọ bụ naanị aha mmadụ.
- source_word: καταγαγεῖν
  choice: iwetada
  rationale: “Iwetada” na-egosipụta ime ka onye nọ n’elu bịa n’ala, nke kwekọrọ n’echiche καταγαγεῖν ma bụrụkwa Igbo nkịtị.
theological_decisions:
- issue: Ime “ezi omume nke sitere n’okwukwe” ka ọ na-ekwu dịka mmadụ
  choice: 'E debere ya dịka isiokwu na-ekwu: “ezi omume ... na-ekwu otu a.”'
  alternative: “Ihe ezi omume sitere n’okwukwe na-ekwu bụ nke a.”
  rationale: Grik mere δικαιοσύνη isiokwu nke λέγει. Idebe onyenọchianya a na-echekwa usoro arụmụka na nka okwu Pọl.
- issue: Nsụgharị Χριστός dịka aha ọkwá
  choice: Mesaịa
  alternative: Kraịst
  rationale: N’ime nkọwa Pọl banyere ihe Akwụkwọ Nsọ kwuru, Χριστός na-arụ ọrụ dịka aha ọkwá; “Mesaịa” na-eme ka nke a doo anya n’enweghị itinye ozizi otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị mfe ma dị ugwu, dee ya. E debere ahịrịokwu Pọl na onyenọchianya ya, ma zere ime ka nkọwa dị n’etiti mkpụrụokwu doo anya karịa ka Grik mere. Akara ụda dị mkpa, dị ka “Ònye,” ka e tinyere maka nghọta.
