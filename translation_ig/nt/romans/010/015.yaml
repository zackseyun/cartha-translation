id: ROM.10.15
reference: Romans 10:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: ig
  text: Olee kwa otú ha ga-esi kwusaa ma ọ bụrụ na e ziteghị ha? Dị ka e dere ya, “Lee ka ụkwụ ndị na-eweta ozi ọma[b] banyere ihe ọma si maa mma![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik a pụkwara ịpụta “nke a nabatara nke ọma” ma ọ bụ “nke dabara n’oge,” ọ bụghị naanị “maa mma.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ndị na-eweta ozi ọma nke ihe ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: kwusaa
  rationale: “Kwụsaa” na-egosi ime ka ozi ruo ọha mmadụ, ma ọ naghị eme ka okwu a bụrụ naanị ikwusa okwuchukwu n’ụlọ ụka.
- source_word: ἀποσταλῶσιν
  choice: e ziteghị ha
  rationale: Nke a na-edobe ụdị nnara-eme nke okwu Grik ahụ ma na-egosi na onye ọzọ bụ onye zitere ha.
- source_word: καθὼς γέγραπται
  choice: Dị ka e dere ya
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa nsọpụrụ e si webata ihe e hotara n’Akwụkwọ Nsọ.
- source_word: ὡραῖοι
  choice: si maa mma
  rationale: Nhọrọ a na-edobe ihe oyiyi nke ịma mma dị n’okwu ahụ, ebe nkọwa ala peeji na-egosi na okwu Grik ahụ nwekwara ike ịpụta ịdị nnọọ ụtọ nnabata ma ọ bụ ịbịa n’oge kwesịrị ekwesị.
- source_word: πόδες
  choice: ụkwụ
  rationale: 'A hapụrụ ihe oyiyi ahụ otú o si dị n’ihe e hotara: ụkwụ na-anọchi anya ọbịbịa ndị ozi.'
- source_word: εὐαγγελιζομένων
  choice: ndị na-eweta ozi ọma
  rationale: Nke a na-egosi ndị na-eweta ma na-ekwupụta ozi ọma, kwekọọkwa n’ihe oyiyi nke ndị ozi na-abịa.
- source_word: τὰ ἀγαθά
  choice: banyere ihe ọma
  rationale: Nke a na-edobe “ihe ọma” dị n’ụdị ọtụtụ n’asụsụ Grik, kama ime ka ọ bụrụ naanị nkwughachi nke “ozi ọma.”
theological_decisions:
- issue: Mmekọrịta dị n’etiti iziga ndị ozi na ikwusa ozi ọma
  choice: E debere echiche iziga mmadụ ka ọ gaa kwusaa, n’etinyeghị ya naanị n’ọrụ ndị e chiri echichi.
  alternative: Ịsụgharị ya n’okwu ndị ga-eme ka ọ bụrụ naanị ikwusa okwuchukwu n’ọgbakọ ma ọ bụ ọrụ pụrụ iche nke ndị ụkọchukwu.
  rationale: Usoro echiche Pọl na-egosi na onye na-ekwusa ga-abụ onye e zitere, ma ihe e hotara na-eme ememe ọbịbịa ndị niile na-eweta ozi ọma. Nsụgharị ahụ anaghị atụkwasị otu usoro ọchịchị ụka n’elu okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke doro anya ma dịkwa nsọpụrụ. “Kwụsaa” sara mbara karịa okwu ga-egosi naanị okwuchukwu ụka, ebe “ụkwụ” na ihe oyiyi nke onye ozi ka e debere dịka ha dị n’ihe e hotara.
