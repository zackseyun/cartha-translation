id: ROM.10.10
reference: Romans 10:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: ig
  text: N’ihi na mmadụ ji obi ekwere, nke na-eduga n’ezi omume; jirikwa ọnụ ekwupụta, nke na-eduga na nzọpụta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδίᾳ
  choice: n’obi
  rationale: Ọ na-egosi mmadụ ime, ebe okwukwe si apụta; ọ bụkwa okwu Igbo dị mfe ma na-edobe ọdịiche dị n’etiti obi na ọnụ.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na nke bu ya ụzọ dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: πιστεύεται
  choice: ka mmadụ ji kwere
  rationale: Ụdị Grik a na-ekwu okwu n’ozuzu banyere onye ọ bụla; iji “mmadụ” kwuo ya bụ ụzọ Igbo sitere n’okike karịa passive na-adịghị akọ onye mere ihe.
- source_word: εἰς δικαιοσύνην
  choice: ruo n’ezi omume
  rationale: “Ruo na” na-edobe echiche εἰς nke na-egosi ebe ihe na-eduga ma ọ bụ nsonaazụ, n’enweghị ịkọwa mmekọrịta ahụ karịa ka Grik si kwuo.
- source_word: δικαιοσύνην
  choice: ezi omume
  rationale: N’Igbo Akwụkwọ Nsọ na okwu okwukwe, “ezi omume” nwere ike ịgụnye ọnọdụ ịbụ onye ziri ezi n’ihu Chineke nakwa ime ihe ziri ezi; e tinyeela ụzọ ọzọ na nkọwa ala peeji ka a ghara imechi ọtụtụ nghọta okwu Grik a nwere.
- source_word: στόματι
  choice: n’ọnụ
  rationale: Ọ na-edobe ntụnyere doro anya nke dị n’etiti ihe e ji obi eme na ihe e ji ọnụ eme.
- source_word: δὲ
  choice: ọ bụkwa
  rationale: Ọ na-egosi njikọ na obere ọdịiche dị n’etiti okwukwe nke ime na nkwupụta nke ọnụ, ọ bụghị mmegide.
- source_word: ὁμολογεῖται
  choice: ka mmadụ ji ekwupụta
  rationale: “Ekwupụta” dabara n’ịkpọpụta n’ọnụ nkwenye banyere Jizọs dịka ihe gbara amaokwu a gburugburu si gosi, ma ọ naghị etinye nkọwa ọzọ n’ime ya.
- source_word: εἰς σωτηρίαν
  choice: ruo na nzọpụta
  rationale: Ọ na-edobe otu nhazi ahụ dị na “ruo n’ezi omume” ma hapụ mmekọrịta nke nzube ma ọ bụ nsonaazụ ka ọ dị nkenke dịka Grik.
- source_word: σωτηρίαν
  choice: nzọpụta
  rationale: Nke a bụ okwu Igbo kwesịrị ekwesị maka σωτηρία n’ebe a, ma na-edobe nghọta nke ịnapụta mmadụ n’ụzọ sara mbara.
theological_decisions:
- issue: Mmekọrịta okwukwe na nkwupụta ọnụ nwere na ezi omume na nzọpụta
  choice: 'E depụtara ahịrịokwu abụọ ahụ n’usoro yiri ibe ha: mmadụ ji obi kwere ruo n’ezi omume, jiri ọnụ kwupụta ruo na nzọpụta.'
  alternative: Ịsị na nkwupụta ọnụ bụ naanị ihe akaebe nke nzọpụta, ma ọ bụ na ọ bụ ọrụ ọzọ mmadụ ga-arụ iji rite nzọpụta.
  rationale: Grik ji ahịrịokwu abụọ yiri ibe ha na εἰς mee ka ihe ndị a jikọta. Nsụgharị ahụ anaghị ekpebi usoro kpọmkwem nke izi mmadụ ezi n’ihu Chineke, ọ naghịkwa eme nkwupụta ọnụ ka ọ bụrụ ọrụ na-eweta ụgwọ.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E jidere ntụnyere obi/ọnụ na nhazi abụọ nke “ruo na,” ma zere passive na-adịghị ada ka Igbo sitere n’okike.
