revisions:
- from: N’ihi na ọ bụ n’obi ka mmadụ ji kwere ruo n’ezi omume[a], ọ bụkwa n’ọnụ ka mmadụ ji ekwupụta ruo na nzọpụta.
  to: N’ihi na mmadụ ji obi ekwere, nke na-eduga n’ezi omume; jirikwa ọnụ ekwupụta, nke na-eduga na nzọpụta.
  rationale: The revision replaces the temporally colored «ruo» expressions with natural result/goal wording, «nke na-eduga na», for each εἰς phrase. It keeps the generic human subject, the inward/outward heart-and-mouth contrast, and the source’s balanced two-clause structure. It does not decide whether confession is merely evidence of salvation or a distinct condition, beyond the directional relation stated in the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:27:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the explanatory γάρ, the heart/mouth parallel, and the paired movement toward righteousness and salvation. However, «ruo n’/ruo na» normally expresses a temporal endpoint in modern Standard Igbo (‘until’), and is not a natural rendering here of εἰς as goal/result.
  naturalness: The repeated cleft construction is understandable, but the combination «ka mmadụ ji kwere ruo n’ezi omume» is awkward. Recasting the clauses as generic statements with «nke na-eduga na» gives idiomatic Standard Igbo while retaining the source’s parallelism.
  terminology: «ezi omume» and «nzọpụta» are suitable established biblical terms. «ekwupụta» adequately conveys public confession in this immediate context without adding an object not expressed in Greek. The footnote’s alternative «ikpe ziri ezi» is retained as a lexical possibility, while the main rendering does not reduce δικαιοσύνη to justice alone.
  issues:
  - severity: medium
    issue: «ruo n’ezi omume» / «ruo na nzọpụta» is idiomatically unsuitable for εἰς in this context.
    rationale: In contemporary Standard Igbo, «ruo» chiefly marks duration or an endpoint in time/place. It can make the clauses sound as if belief continues ‘until righteousness’ rather than indicating the goal or result expressed by εἰς.
  revised_text: N’ihi na mmadụ ji obi ekwere, nke na-eduga n’ezi omume; jirikwa ọnụ ekwupụta, nke na-eduga na nzọpụta.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi.” Okwu Grik δικαιοσύνη nwekwara ike ịpụta ikpe ziri ezi, ma n’akwụkwọ Pọl, “ezi omume” bụ nsụgharị a na-ejikarị eme ihe.
    reason: lexical_alternative
  revision_rationale: The revision replaces the temporally colored «ruo» expressions with natural result/goal wording, «nke na-eduga na», for each εἰς phrase. It keeps the generic human subject, the inward/outward heart-and-mouth contrast, and the source’s balanced two-clause structure. It does not decide whether confession is merely evidence of salvation or a distinct condition, beyond the directional relation stated in the Greek.
