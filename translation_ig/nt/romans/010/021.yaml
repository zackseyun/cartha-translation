  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: ig
  text: Ma banyere Izrel, ọ na-ekwu[a], “Ụbọchị dum ka m gbatịworo aka m abụọ n’ebe ndị na-adịghị erube isi[b] na ndị na-ekwu okwu megide[c] nọ.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “Ma ọ na-ekwu nye Izrel.” Usoro okwu Grik ahụ nwere ike ịpụta na ọ na-ekwu maka Izrel, ma ọ bụ na ọ na-agwa Izrel okwu kpọmkwem.
    reason: alternative_reading
  - marker: b
    text: “Na-adịghị erube isi” nwekwara ike ibu echiche nke “na-ekweghị ekwe” ma ọ bụ “na-ajụ ka e mee ka ha kwenye.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụ ya, “ndị na-emegide” ma ọ bụ “ndị na-ekwu okwu na-emegide.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: Ma banyere Izrel
  rationale: ‘Banyere Izrel’ na-ewere πρός dị ka ihe okwu ahụ na-ekwu maka ya. Ebe ọ pụkwara ịpụta na a na-agwa Izrel okwu kpọmkwem, e debere nke ahụ n’ala ala peeji.
- source_word: λέγει
  choice: ọ na-ekwu
  rationale: E jigidere oge ugbu a nke usoro Pọl ji ewebata ihe e dere n’Akwụkwọ Nsọ. Nnọchiaha ‘ọ’ anaghị akpọ onye na-ekwu okwu aha, dị ka Grik na-ahapụrụ ya n’ọnọdụ a.
- source_word: Ὅλην τὴν ἡμέραν
  choice: Ụbọchị dum
  rationale: Nke a bụ Igbo dị mfe ma na-egosi na ihe ahụ gara n’ihu ogologo ụbọchị ahụ niile.
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: ka m setịpụrụ aka m
  rationale: Nsụgharị a na-echekwa onyinyo aka Chineke setịpụrụ n’ebe ndị mmadụ nọ dị ka oku na arịrịọ, ma ghara ịkọwa ihe onyinyo ahụ karịa ihe ederede kwuru.
- source_word: πρὸς λαὸν
  choice: n’ebe ndị ... nọ
  rationale: Usoro a na-egosi ebe aka ahụ chere ihu ma na-asụkwa nke ọma n’Igbo. ‘Ndị’ na-anọchi anya λαός dị ka otu ìgwè mmadụ.
- source_word: ἀπειθοῦντα
  choice: ndị na-adịghị erube isi
  rationale: Ọ na-egosi nnupụisi na ịjụ ikwe ka e kwenye mmadụ; ihe ọ pụkwara ịpụta banyere ekweghị ekwe dị n’ala ala peeji.
- source_word: καὶ ἀντιλέγοντα
  choice: ndị na-emegidekwa m
  rationale: Nke a na-egosi mmegide na-arụ ọrụ. Aha onye mmegide ahụ, Chineke, doro anya n’okwu onye na-ekwu ‘aka m’; ala ala peeji na-edebe echiche Grik nke ikwu okwu megide mmadụ.
theological_decisions:
- issue: Otú e si kọwaa nzaghachi Izrel nye Chineke
  choice: ndị na-adịghị erube isi, ndị na-emegidekwa m
  alternative: ndị na-ekweghị ekwe, ndị na-ekwukwa okwu megide m
  rationale: A na-echekwa ma ọjụjụ mmadụ jụrụ irube isi ma mmegide ọ na-emegide Chineke, n’emeghị ka amaokwu a kpebie arụmụka sara mbara banyere ọnọdụ Izrel.
- issue: Onye na-ekwu okwu n’amaokwu e hotara
  choice: E jigidere ‘ọ na-ekwu’ n’ahịrị mbido, ebe onye e hotara na-ekwu ‘m’
  alternative: Chineke na-ekwu
  rationale: Ihe gbara amaokwu a gburugburu na-egosi na ọ bụ Chineke na-ekwu n’okwu Aịzaya, ma Grik nke amaokwu a akpọghị onye na-ekwu okwu aha kpọmkwem; ya mere, e tinyeghị aha ahụ n’ahịrị mbido.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. Usoro ‘ụbọchị dum ka...’ na-enye okwu ahụ ike n’Igbo; ‘setịpụrụ aka m’ na-echekwa onyinyo nke isi mmalite ahụ. E zere okwu ụka pụrụ iche na nkọwa okpukpe agbakwunyere.
