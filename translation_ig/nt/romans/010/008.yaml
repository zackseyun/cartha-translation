id: ROM.10.8
reference: Romans 10:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: ig
  text: Ma gịnị ka ọ na-ekwu? “Okwu ahụ dị gị nso, ọ dị n’ọnụ gị na n’obi gị.” Nke ahụ bụ okwu nke okwukwe[a] anyị na-ekwusa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịtụgharị ‘okwu’ n’ebe a dịka ‘ozi.’ N’ebe ụfọdụ, okwu Grik a sụgharịrị ‘okwukwe’ nwekwara ike ịpụta ‘ntụkwasị obi’ ma ọ bụ ‘ikwesị ntụkwasị obi.’
    reason: lexical_alternative
  - marker: b
    text: Pọl na-ekwughachi asụsụ Diuterọnọmi 30:14 ma na-eji ya akọwa ozi okwukwe anyị na-ekwusa.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi ntụgharị ma ọ bụ ọdịiche n’ihe Pọl kwuru tupu nke a; ‘Ma’ bụ njikọ Igbo dị mfe ma kwekọọ n’ebe a.
- source_word: τί λέγει
  choice: gịnị ka ọ na-ekwu?
  rationale: E debere nnọchiaha ‘ọ’ dịka Grik si dị, n’agbanyeghị na ihe gbara amaokwu ahụ gburugburu na-egosi na ihe e dere n’Akwụkwọ Nsọ ka a na-ekwu maka ya.
- source_word: Ἐγγύς σου
  choice: dị gị nso
  rationale: Nke a na-echekwa echiche nke ịdị nso ma na-ada nke ọma n’Igbo.
- source_word: τὸ ῥῆμά
  choice: Okwu ahụ
  rationale: ‘Okwu’ na-echekwa njikọ okwu ahụ dị n’etiti ihe e hotara na nkọwa Pọl nyere mgbe e mesịrị, n’ebughị ụzọ kọwaa ya dị ka ‘ozi.’
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: ọ dị n’ọnụ gị na n’obi gị
  rationale: Ntụgharị a na-echekwa ihe atụ ahụ gbasara ọnụ na obi, ma mmegharị ngwaa ‘ọ dị’ na-eme ka ahịrịokwu ahụ doo anya n’Igbo.
- source_word: τοῦτ’ ἔστιν
  choice: Nke ahụ bụ
  rationale: Ọ na-ewebata nkọwa Pọl banyere okwu ahụ e hotara n'ụzọ doro anya.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: okwu nke okwukwe
  rationale: A nọgidere jiri ‘okwu’ tụgharịa ῥῆμα, ma ‘nke okwukwe’ na-echekwa mkpirikpi njikọ genitive Grik n’ebughị ụzọ kpebie ma ọ pụtara ozi gbasara okwukwe, ozi na-akpọ mmadụ ka o kwere, ma ọ bụ ozi e ji okwukwe mara.
- source_word: ὃ κηρύσσομεν
  choice: anyị na-ekwusa
  rationale: ‘Na-ekwusa’ na-egosi ikwupụta ozi n’ihu ọha ma kwekọọ n’ọrụ κηρύσσω.
theological_decisions:
- issue: Ihe πίστις pụtara n’okwu τὸ ῥῆμα τῆς πίστεως
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: ‘Okwukwe’ bụ ntụgharị a na-ejikarị eme ihe n’ọnọdụ Pọl a, ma ọ naghị amanye otu nkọwa ụka pụrụ iche. Ihe ndị ọzọ okwu ahụ nwere ike ịpụta ka edepụtara n’ala peeji.
- issue: Njikọ nke okwu Pọl na Diuterọnọmi 30:14
  choice: E debere okwu e hotara n’ụdị isiokwu, ma kọwaa njikọ ya n’ala peeji
  alternative: Itinye ‘Akwụkwọ Nsọ’ ma ọ bụ ‘Diuterọnọmi’ kpọmkwem n’ahịrịokwu
  rationale: Grik kwuru naanị ‘gịnị ka ọ na-ekwu?’; itinye aha Akwụkwọ Nsọ n’ahịrịokwu ga-eme ka ihe gbara ya gburugburu kwuru pụta ìhè karịa ihe ederede ahụ kwuru kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘okwu’ iji chekwaa nkwughachi ῥῆμα ugboro abụọ, ebe ‘na-ekwusa’ na-enye ụda nkwupụta ozi n’ihu ọha. E tinyere akara ala peeji [a] na [b] n’ahịrịokwu, dịka nkọwa ha si dị.
