source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: ig
  text: Ụmụnna[a], ọchịchọ obi m na ekpere m na-ekpegara Chineke maka ha bụ maka nzọpụta ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ ji ụdị ọtụtụ nke nwoke, ma ọ pụrụ ịbụ ụzọ e si akpọ ndị nwoke na ndị nwanyị ọnụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Ụmụnna m
  rationale: Ọ bụ okwu a na-eji akpọkọta ndị otu okwukwe n'Igbo n'ụzọ sitere n'okike ma dị ùgwù. Ọ bụ ezie na ọdịdị okwu Grik bụ ọtụtụ nke nwoke, n'ọnọdụ a ọ pụrụ ịgụnye ma ndị nwoke ma ndị nwanyị; e debere nkọwa ahụ n'okpuru amaokwu.
- source_word: εὐδοκία τῆς ἐμῆς καρδίας
  choice: ọchịchọ nke obi m
  rationale: N'ebe a εὐδοκία na-egosi ihe Pọl chọrọ nke ukwuu, ọ bụghị nanị obi ụtọ ma ọ bụ ihu ọma. Nkebi a na-edobekwa njikọ genitiv nke okwu Grik.
- source_word: δέησις
  choice: ekpere m
  rationale: Okwu ahụ pụtara arịrịọ siri ike a na-arịọ Chineke; “ekpere” bụ okwu Igbo doro anya ma bụrụ nke a na-ejikarị eme ihe n'ọnọdụ a.
- source_word: πρὸς τὸν θεόν
  choice: na-ekpegara Chineke
  rationale: πρός na accusative na-egosi ebe ekpere ahụ na-aga. Usoro Igbo a na-egosipụta nke ahụ n'ụzọ sitere n'okike.
- source_word: ὑπὲρ αὐτῶν
  choice: maka ha
  rationale: ὑπέρ na-egosi na a na-ekpe ekpere ahụ maka ọdịmma ha. E debere nnọchiaha “ha” dị ka ọ dị n'asụsụ isi kama ịtinye “Izrel” n'amaokwu ahụ.
- source_word: εἰς σωτηρίαν
  choice: ka a zọpụta ha
  rationale: εἰς na-egosi ebumnuche ma ọ bụ ihe a na-atụ anya ya. Usoro a bụ Igbo doro anya nke na-egosi na nzọpụta ahụ metụtara “ha,” n'emeghị ka amaokwu ahụ kpebie karịa ihe Grik kwuru.
- source_word: μέν
  choice: asụgharịghị ya iche
  rationale: μέν na-arụ ọrụ dị nro n'usoro okwu a, ma e nweghị δέ doro anya na-esochi ya n'amaokwu ahụ. Ịtinye “n'ezie” ma ọ bụ okwu yiri ya ga-eme ka Igbo sie ike ma tinye nkwusi okwu na-adịghị mkpa.
theological_decisions:
- issue: 'Adreesị nwere ọdịdị nwoke: Ἀδελφοί'
  choice: Ụmụnna m
  alternative: Ụmụnna m ndị nwoke na ndị nwanyị
  rationale: “Ụmụnna m” bụ okwu nkịtị nke Igbo maka ndị otu okwukwe ma nwee ike ịgụnye ọgbakọ dum. Ihe odide Grik ji ụdị ọtụtụ nke nwoke; n'ihi ya, e kwuru ọdịdị ahụ na nkọwa ala peeji kama ịgbasa okwu n'amaokwu isi.
- issue: Mmekọrịta εἰς σωτηρίαν na ὑπὲρ αὐτῶν
  choice: ka a zọpụta ha
  alternative: bụ maka nzọpụta
  rationale: Usoro a na-eme ka ebumnuche ekpere ahụ doo anya n'Igbo ma na-ejigide na nzọpụta ahụ bụ nke ndị nnọchiaha “ha” na-ezo aka na ha. Ọ naghị ekpebi ma εἰς ga-abụ nanị ebumnuche ma ọ bụkwa nsonaazụ.
translation_notes:
  register: E ji Igbo Izugbe dị ugbu a, nke dị ùgwù ma dị mfe nghọta. “Na-ekpegara Chineke” na-eme ka ntụziaka ekpere pụta ìhè, ebe “ka a zọpụta ha” na-enye εἰς σωτηρίαν n'ụzọ Igbo sitere n'okike. Akara nkọwa [a] dị n'akụkụ okwu ọ na-akọwa.
