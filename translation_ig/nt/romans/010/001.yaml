  to: Ụmụnna[a], ọchịchọ obi m na ekpere m na-ekpegara Chineke maka ha bụ maka nzọpụta ha.
  rationale: The revision removes the unsupported possessive from the vocative address. It also uses “maka nzọpụta ha” to preserve the Greek noun phrase εἰς σωτηρίαν (“for salvation”) while naturally showing in Igbo that the salvation concerns “them.” The revised footnote retains the relevant information about the masculine plural and its possible mixed-group reference without overtranslating the address.
