revisions:
- from: N’ihi na, “onye ọ bụla nke na-akpọku aha Onyenwe anyị ka a ga-azọpụta.”[a][b]
  to: N’ihi na onye ọ bụla kpọkuo aha Onyenwe anyị ka a ga-azọpụta.[a][b]
  rationale: The revision preserves every source element while using the Igbo subjunctive “kpọkuo” for the Greek indefinite aorist-subjunctive construction. It also removes nonessential quotation punctuation and makes the lexical footnote both source-faithful and idiomatic. The main text continues to preserve the source’s “Lord” without deciding the referent beyond what Paul’s context indicates.
