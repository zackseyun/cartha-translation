    text: Pọl na-ehota Joel 2:32. N’akwụkwọ Joel, onye okwu ahụ na-ezo aka na ya bụ YHWH (“ONYENWE ANYỊ”); ma n’akụkụ a, Pọl na-etinye okwu ahụ n’ebe Jizọs nọ.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịtụgharị ya, “onye ọ bụla kpọkuo Onyenwe anyị.” Okwu Grik a pụtara ịkpọku ma ọ bụ ịrịọ Onyenwe anyị n’aha ya.
    reason: lexical_alternative
  revision_rationale: The revision preserves every source element while using the Igbo subjunctive “kpọkuo” for the Greek indefinite aorist-subjunctive construction. It also removes nonessential quotation punctuation and makes the lexical footnote both source-faithful and idiomatic. The main text continues to preserve the source’s “Lord” without deciding the referent beyond what Paul’s context indicates.
