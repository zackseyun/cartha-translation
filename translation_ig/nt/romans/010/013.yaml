review_pass:
  verdict: revise
  source_fidelity: The draft conveys the universal scope, the invocation idiom, κύριος as “Onyenwe anyị,” and the future passive promise of salvation. However, the continuous form “na-akpọku” is less suited to the Greek aorist subjunctive in this generalizing relative clause. “kpọkuo” more naturally represents the indefinite condition, “whoever calls upon.”
  naturalness: “N’ihi na, ‘…’” is unnecessarily punctuated and the enclosing quotation marks are not needed in the verse text. A direct, unquoted sentence is more natural Standard Igbo. The revised wording is concise and retains a reverent biblical register.
  terminology: “Onyenwe anyị” appropriately renders κυρίου without importing “Jizọs” into the main text. “A ga-azọpụta” suitably conveys σωθήσεται in its Pauline salvation context. The cross-reference footnote is retained but made more idiomatic; the lexical note is revised so that its alternative remains an actual alternative wording rather than an expanded paraphrase.
  issues:
  - severity: medium
    issue: The main verb is rendered with the continuous form “na-akpọku.”
    rationale: ἐπικαλέσηται is an aorist subjunctive governed by ὃς ἂν, expressing an indefinite/general condition. “Onye ọ bụla kpọkuo …” is the more natural Igbo equivalent here and avoids suggesting an ongoing action absent from the Greek.
  - severity: low
    issue: The main text has an unnecessary comma after “N’ihi na” and quotation marks around the whole verse.
    rationale: Neither feature is required by the Greek wording or by the English audit text. Removing them produces smoother modern Igbo without changing the citation’s meaning.
  - severity: low
    issue: Footnote b’s proposed alternative expands the wording into “ịrịọ ... enyemaka,” rather than giving the stated lexical alternative.
    rationale: The Greek can mean invoke or appeal to, but the alternative should remain close to the source expression. The explanatory sentence can state the broader sense without inserting “enyemaka” into the alternative translation.
  revised_text: N’ihi na onye ọ bụla kpọkuo aha Onyenwe anyị ka a ga-azọpụta.[a][b]
  revised_footnotes:
