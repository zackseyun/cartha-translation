  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: ig
  text: N’ihi na onye ọ bụla kpọkuo aha Onyenwe anyị ka a ga-azọpụta.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pọl na-ehota Joel 2:32. N’akwụkwọ Joel, onye okwu ahụ na-ezo aka na ya bụ YHWH (“ONYENWE ANYỊ”); ma n’akụkụ a, Pọl na-etinye okwu ahụ n’ebe Jizọs nọ.
    reason: cross_reference
  - marker: b
    text: A pụkwara ịtụgharị ya, “onye ọ bụla kpọkuo Onyenwe anyị.” Okwu Grik a pụtara ịkpọku ma ọ bụ ịrịọ Onyenwe anyị n’aha ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: onye ọ bụla nke
  rationale: Nkebiokwu a na-egosi onye ọ bụla n’enweghị ịkpa ókè. “Onye ọ bụla nke” bụ ụzọ Igbo doro anya ma kwekọọ n’usoro ahịrịokwu Grik.
- source_word: γὰρ
  choice: N’ihi na
  rationale: γάρ na-ejikọta amaokwu a na ihe bu ya ụzọ dịka ihe akaebe Akwụkwọ Nsọ ma ọ bụ nkọwa.
- source_word: ἐπικαλέσηται
  choice: na-akpọku
  rationale: “Ịkpọku” na-egosi ịrịọ Onyenwe anyị enyemaka ma ọ bụ ịkpọ aha ya n’ekpere na nkwupụta, kama ịbụ nanị ịkpọ mmadụ oku.
- source_word: τὸ ὄνομα
  choice: aha
  rationale: A hapụrụ okwu “aha” dịka ọ dị n’isi mmalite, ebe ọ na-anọchi anya onye a na-akpọku, njirimara ya, na ikike ya.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: Nke a bụ ntụgharị Igbo kwesịrị ekwesị nke κύριος n’ebe a; ọ naghị etinye “Jizọs” kpọmkwem n’ahịrịokwu n’agbanyeghị na ihe gbara amaokwu ahụ gburugburu na-egosi na Pọl na-etinye ya n’ebe Jizọs nọ.
- source_word: σωθήσεται
  choice: a ga-azọpụta
  rationale: Ọdịdị a na-edobe ngwaa ọdịnihu nke onye ọzọ na-eme (future passive) ma na-egosi nzọpụta n’ụzọ Pọl si eji okwu ahụ.
theological_decisions:
- issue: Onye okwu “Onyenwe anyị” na-ezo aka na ya n’okwu e hotara na Joel
  choice: Edobere “Onyenwe anyị” n’ahịrịokwu bụ isi, ebe nkọwa ala peeji na-egosi na Pọl na-etinye okwu ahụ n’ebe Jizọs nọ.
  alternative: “YHWH” ma ọ bụ “Onyenwe anyị Jizọs”
  rationale: Grik nwere κυρίου naanị. Ihe gbara amaokwu ahụ gburugburu na Ndị Rom 10 na-ejikọta ịkpọku Onyenwe anyị na Jizọs, ma ịgbakwunye aha “Jizọs” n’ahịrịokwu bụ isi ga-agafe ihe e dere; n’aka nke ọzọ, ide “YHWH” ga-ebufe kpọmkwem okwu Hibru nke Joel n’ime ederede Grik Pọl dere.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. “Ịkpọku” na-echekwa ụda Akwụkwọ Nsọ na echiche nke ịrịọ enyemaka; “Onyenwe anyị” bụ ụdị a na-amata nke ọma maka κύριος. E tinyere akara nkọwa [a][b] ozugbo n’ederede bụ isi.
