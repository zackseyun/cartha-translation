id: ROM.10.7
reference: Romans 10:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: ig
  text: ma ọ bụ, “Ònye ga-arịda n’ime abis[a]?” (ya bụ, ibuli Mesaịa[b] elu site n’etiti ndị nwụrụ anwụ).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “olulu miri emi.” Pọl na-ekwughachi echiche dị na Diuterọnọmi 30:13, ma n’ebe a o ji okwu “abis” mee ka ọ metụta ibuli Mesaịa elu site n’etiti ndị nwụrụ anwụ.
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, “Kraịst”; a sụgharịrị ya “Mesaịa” n’ebe a n’ihi na Χριστός bụ aha ọkwá.
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: ma ọ bụ
  rationale: Ọ na-ewebata akụkụ nke abụọ nke ntụnyere ahụ; ‘ma ọ bụ’ bụ ụzọ Igbo dị mfe ma kwekọọ na njikọ okwu Grik.
- source_word: Τίς καταβήσεται
  choice: Ònye ga-arịda
  rationale: Nke a na-edobe ajụjụ nkwupụta ahụ na ụdị ọdịnihu nke ngwaa ahụ n’Igbo doro anya.
- source_word: εἰς τὴν ἄβυσσον
  choice: n’ime abis
  rationale: ‘Abis’ na-edobe okwu pụrụ iche Pọl ji mee ihe na ihe oyiyi nke omimi dị egwu, kama ịkọwa ya kpọmkwem dị ka ili ma ọ bụ ala ndị nwụrụ anwụ.
- source_word: τοῦτ’ ἔστιν
  choice: ya bụ
  rationale: Nke a bụ usoro nkọwa dị mkpirikpi ma bụrụkwa nke a na-eji eme ihe n’Igbo ugbu a.
- source_word: Χριστόν
  choice: Mesaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka aha ọkwá nke Onye E Tere Mmanụ; ‘Mesaịa’ na-egosipụta ihe aha ọkwá ahụ pụtara.
- source_word: ἐκ νεκρῶν
  choice: site n’etiti ndị nwụrụ anwụ
  rationale: Nke a na-egosipụta nke ọma na okwu Grik na-ekwu maka isi n’etiti ndị nwụrụ anwụ pụta.
- source_word: ἀναγαγεῖν
  choice: ịkpọgote
  rationale: ‘Ịkpọgote’ na-edobe ihe oyiyi nke isi n’ala kpọgote n’elu, nke kwekọrọ na ‘ịrịda,’ n’ebughị ụzọ dochie ya anya n’okwu pụrụ iche maka mbilite n’ọnwụ.
theological_decisions:
- issue: Nsụgharị Χριστός
  choice: Mesaịa
  alternative: Kraịst
  rationale: Ebe ọ bụ na okwu ahụ bụ aha ọkwá n’ebe a, ‘Mesaịa’ na-eme ka echiche nke Onye E Tere Mmanụ pụta ìhè kama iji naanị mkpụrụokwu e si n’asụsụ ọzọ webata.
- issue: Ihe ‘abis’ pụtara n’ime nkọwa Pọl
  choice: Idobe ‘abis’ n’ahịrịokwu bụ isi
  alternative: olulu miri emi; ala ndị nwụrụ anwụ; Hedis
  rationale: Idobe okwu ihe oyiyi ahụ anaghị emechi nghọta ya n’otu nkọwa dịka ili ma ọ bụ ala ndị nwụrụ anwụ, ma na-echekwa njikọ ya na Diuterọnọmi 30 na esemokwu echiche dị na nkọwa Pọl.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Abis’ bụ okwu e si n’asụsụ ọzọ webata, ma nkọwa ala peeji na-enye ‘olulu miri emi’ dịka okwu Igbo ọzọ; ‘ịkpọgote’ na-echekwa ntụnyere ohere dị n’etiti ịrịda na ịkpọgote.
