    text: Ma ọ bụ, “kwupụta Jizọs dịka Onyenweanyị.” Enwere ike ịsụ okwu Grik κύριον Ἰησοῦν n’ụzọ dị mkpirikpi; isi nsụgharị ahụ mere ka ọdịnaya nkwupụta ahụ doo anya.
    reason: lexical_alternative
  revision_rationale: The revision makes the resurrection statement more direct and idiomatic while preserving the Greek wording’s agency, object, and ‘from among the dead’ sense. It also lightly polishes the footnote so that it reads naturally and accurately in Standard Igbo. No theological interpretation has been added.
