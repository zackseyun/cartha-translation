id: ROM.10.9
reference: Romans 10:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na i ji ọnụ gị kwupụta na Jizọs bụ Onyenweanyị[a], ma kwere n’obi gị na Chineke kpọlitere ya site n’etiti ndị nwụrụ anwụ, a ga-azọpụta gị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kwupụta Jizọs dịka Onyenweanyị.” Enwere ike ịsụ okwu Grik κύριον Ἰησοῦν n’ụzọ dị mkpirikpi; isi nsụgharị ahụ mere ka ọdịnaya nkwupụta ahụ doo anya.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu bu ya ụzọ; ‘n’ihi na’ na-egosipụta njikọ a nke ọma n’Igbo.
- source_word: ἐὰν
  choice: ọ bụrụ na
  rationale: Nke a bụ ụzọ Igbo si egosipụta ọnọdụ a na-atụ anya na o nwere ike ime.
- source_word: ὁμολογήσῃς
  choice: kwupụta
  rationale: ‘Kwupụta’ na-egosi ikwu ihe n’ọnụ n’ihu ọha ma ọ bụ ikweta ya n’ụzọ doro anya, dịka okwu Grik ahụ siri dị ebe a.
- source_word: ἐν τῷ στόματί σου
  choice: ji ọnụ gị
  rationale: Nke a bụ ụzọ Igbo ebumpụta ụwa si egosipụta ọnụ dịka ihe e ji ekwu nkwupụta ahụ.
- source_word: κύριον Ἰησοῦν
  choice: na Jizọs bụ Onyenwe anyị
  rationale: Ọ na-eme ka ihe a na-ekwupụta pụta ìhè, ma debe κύριος dịka aha nsọpụrụ na ikike, ‘Onyenwe anyị.’
- source_word: πιστεύσῃς
  choice: kwere
  rationale: ‘Kwere’ bụ okwu Igbo kwụ ọtọ maka inwe nkwenye n’eziokwu nke ahịrịokwu na-esochi ya.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: jiri obi gị
  rationale: Ọ na-echekwa echiche nke nkwenye sitere n’ime mmadụ, ma na-ada ka Igbo a na-asụ ugbu a.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: Chineke mere ka o ... bilie
  rationale: Nke a na-egosipụta na Chineke bụ onye mere ka Jizọs bilie, ma na-echekwa oge gara aga nke ngwaa Grik.
- source_word: ἐκ νεκρῶν
  choice: si n’etiti ndị nwụrụ anwụ
  rationale: Nsụgharị a na-egosipụta n’ụzọ doro anya echiche nke isi n’etiti ndị nwụrụ anwụ bilie.
- source_word: σωθήσῃ
  choice: a ga-azọpụta gị
  rationale: Ọ na-echekwa ọdịdị nnara na oge ọdịnihu nke ngwaa ahụ, nakwa ike ya n’okwu gbasara nzọpụta.
theological_decisions:
- issue: Nsụgharị κύριος n’okwu nkwupụta ahụ
  choice: Onyenwe anyị
  alternative: Nna ukwu
  rationale: ‘Onyenwe anyị’ na-echekwa aha nsọpụrụ, ọchịchị, na ụda Akwụkwọ Nsọ nke κύριος nwere n’ebe a, n’ebughị nkọwa otu ụka pụrụ iche bata.
- issue: Ọdịdị nke κύριον Ἰησοῦν
  choice: na Jizọs bụ Onyenwe anyị
  alternative: Jizọs dịka Onyenwe anyị
  rationale: Isi nsụgharị ahụ na-eme ka ọdịnaya nkwupụta ahụ doo anya, ebe ihe ọzọ ka bụ ụzọ ziri ezi isi ghọta usoro okwu Grik ahụ.
- issue: Ike nzọpụta nke σωθήσῃ
  choice: a ga-azọpụta gị
  alternative: a ga-anapụta gị
  rationale: ‘Azọpụta’ dabara n’ọnọdụ okwu Pọl banyere nzọpụta ma ghara ime ka ọ bụrụ naanị nnapụta n’ihe ize ndụ nkịtị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Jiri ọnụ gị’ na ‘jiri obi gị’ na-enye ahịrịokwu ahụ ụda ebumpụta ụwa, ebe ‘si n’etiti ndị nwụrụ anwụ bilie’ na-echekwa nkọwa nke isi mmalite Grik.
