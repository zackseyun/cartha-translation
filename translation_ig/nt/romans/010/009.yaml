  to: N’ihi na ọ bụrụ na i ji ọnụ gị kwupụta na Jizọs bụ Onyenweanyị[a], ma kwere n’obi gị na Chineke kpọlitere ya site n’etiti ndị nwụrụ anwụ, a ga-azọpụta gị.
  rationale: The revision makes the resurrection statement more direct and idiomatic while preserving the Greek wording’s agency, object, and ‘from among the dead’ sense. It also lightly polishes the footnote so that it reads naturally and accurately in Standard Igbo. No theological interpretation has been added.
