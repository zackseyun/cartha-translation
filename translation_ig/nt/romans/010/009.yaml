review_pass:
  verdict: revise
  source_fidelity: The conditional structure, public confession, inward belief, God as the one who raised Jesus, resurrection from among the dead, and future passive promise of salvation are all retained. Revising the resurrection clause to «Chineke kpọlitere ya site n’etiti ndị nwụrụ anwụ» renders ἤγειρεν and ἐκ νεκρῶν more directly and clearly than the causative construction «mere ka o ... bilie».
  naturalness: The revised wording is fluent Standard Igbo and maintains a dignified biblical register. «kwere n’obi gị» is a natural concise counterpart to the Greek locative phrase, and «kpọlitere ya» avoids a potentially unclear pronoun reference in «mere ka o ... bilie».
  terminology: «Onyenweanyị» is retained as the established Igbo biblical title for κύριος in this confession. «a ga-azọpụta gị» appropriately preserves the future passive and the salvation sense of σωθήσῃ.
  issues:
  - severity: medium
    issue: The phrase «Chineke mere ka o si n’etiti ndị nwụrụ anwụ bilie» is an indirect causative rendering of ὁ θεὸς αὐτὸν ἤγειρεν.
    rationale: Although its meaning is broadly correct, «kpọlitere ya» directly expresses that God raised him and makes the object («ya») unambiguous. Adding «site» also makes the source sense of ἐκ clearer in idiomatic Igbo.
  revised_text: N’ihi na ọ bụrụ na i ji ọnụ gị kwupụta na Jizọs bụ Onyenweanyị[a], ma kwere n’obi gị na Chineke kpọlitere ya site n’etiti ndị nwụrụ anwụ, a ga-azọpụta gị.
  revised_footnotes:
