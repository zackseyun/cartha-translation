- from: Ya mere, olee otú ha ga-esi kpọkuo onye ha na-ekweghị na ya? Olee otú ha ga-esi kwere na onye ha na-anụbeghị?[a] Olee otúkwa ha ga-esi nụ ma ọ bụrụ na ọ dịghị onye na-ekwusa?
  to: Ya mere, olee otú ha ga-esi kpọkuo onye ha na-ekweghị na ya? Olee otú ha ga-esi kwere na onye ha na-anụbeghị okwu banyere ya?[a] Olee otúkwa ha ga-esi nụ ma ọ bụrụ na ọ dịghị onye na-ekwusa?
  rationale: The revision supplies the idiomatic Igbo complement “okwu banyere ya” for the genitive-hearing construction, accurately conveying hearing the message concerning the person. The footnote preserves the more compressed, text-near wording and avoids resolving the expression beyond what the Greek requires. The remaining wording is retained because it is accurate and natural.
