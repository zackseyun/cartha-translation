id: ROM.10.14
reference: Romans 10:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: ig
  text: Ya mere, olee otú ha ga-esi kpọkuo onye ha na-ekweghị na ya? Olee otú ha ga-esi kwere na onye ha na-anụbeghị okwu banyere ya?[a] Olee otúkwa ha ga-esi nụ ma ọ bụrụ na ọ dịghị onye na-ekwusa?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Olee otú ha ga-esi kwere na onye ha na-anụbeghị?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Ya mere, olee otú
  rationale: “Ya mere” na-egosi nkwubi okwu nke οὖν, ebe “olee otú” na-edobe usoro ajụjụ nkwupụta Pọl n’Igbo dị ndụ.
- source_word: ἐπικαλέσωνται
  choice: ha ga-esi kpọkuo
  rationale: “Kpọkuo” na-enye echiche nke ịkpọku Onyenwe anyị maka enyemaka ma ọ bụ nzọpụta; “ga-esi” dabara n’ajụjụ banyere otú ihe ahụ ga-esi kwe omume.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: onye ha na-ekweghị na ya
  rationale: “Kwere na ya” bụ ụzọ Igbo si egosipụta ikwere n’otu onye, ma na-edobe onye ahụ dịka ebe okwukwe ha dị.
- source_word: πιστεύσωσιν
  choice: ha ga-esi kwere na
  rationale: “Kwere na” bụ okwu Igbo nkịtị maka πιστεύω mgbe onye bụ ihe okwukwe ahụ metụtara; ọ naghị etinye nkọwa okpukpe ọzọ n’ime okwu ahụ.
- source_word: οὗ οὐκ ἤκουσαν
  choice: onye ha na-anụbeghị
  rationale: Nhọrọ a na-anọ nso n’usoro Grik ma na-ahapụ nghọta abụọ ahụ—ịnụ onye ahụ n’onwe ya, ma ọ bụ ịnụ ozi banyere ya—ka nkọwa ala peeji gosipụta nke ọzọ n’ụzọ doro anya.
- source_word: ἀκούσωσιν
  choice: ha ga-esi nụ
  rationale: “Nụ” bụ ntụgharị kpọmkwem nke ἀκούω ma na-ejikọta ajụjụ a na nke bu ya ụzọ.
- source_word: χωρὶς κηρύσσοντος
  choice: ma ọ bụrụ na ọ dịghị onye na-ekwusa
  rationale: Nke a na-egosipụta na ihe a na-elekwasị anya bụ omume ikwusa, ọ bụghị ọkwa ma ọ bụ aha ọrụ pụrụ iche nke onye nkwusa.
theological_decisions:
- issue: Asụsụ okwukwe nke πιστεύω
  choice: kwere na / ekweghị na
  alternative: tụkwasị obi na
  rationale: “Kwere na” na-edobe njikọ okwu Pọl n’etinyeghị echiche ọzọ nke nwere ike ime ka okwu ahụ dị warara karịa Grik.
- issue: Ihe οὗ οὐκ ἤκουσαν na-ezo aka na ya
  choice: onye ha na-anụbeghị
  alternative: onye ha na-anụbeghị okwu banyere ya
  rationale: Genitive οὗ nwere ike ịpụta ịnụ onye ahụ ma ọ bụ ịnụ banyere ya. Isi ederede na-anọ nso n’usoro Grik, ebe nkọwa ala peeji na-echekwa nghọta nke ịnụ ozi banyere Kraịst.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta, dee ya. A hapụrụ usoro ajụjụ atọ nke Pọl ka ọ pụta ìhè, ma zere okwu nwere ike igosi na “onye na-ekwusa” bụ naanị onye ji otu ọkwa ụka pụrụ iche.
