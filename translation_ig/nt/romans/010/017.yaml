id: ROM.10.17
reference: Romans 10:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: ig
  text: Ya mere, okwukwe na-esite n’ịnụ ihe, ịnụ ihe ahụ na-esitekwa n’okwu Mezaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “okwu banyere Mezaya” ma ọ bụ “ozi gbasara Mezaya.” Njikọ okwu Grik a nwere ike ịpụta ihe karịrị otu ihe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu Pọl si n’ihe o kwuru tupu nke a nweta; “Ya mere” bụ okwu Igbo doro anya ma dịkwa mma n’usoro a.
- source_word: πίστις
  choice: okwukwe
  rationale: N’ebe a, ọ na-ekwu maka nzaghachi mmadụ nye ozi ọma ọ nụrụ, ya mere “okwukwe” dabara karịa “ikwesị ntụkwasị obi.”
- source_word: ἐξ ἀκοῆς
  choice: na-esite n’ịnụ ihe
  rationale: ἐξ na-egosi ebe ihe si malite. E tinyere “na-esite” iji mee ka ahịrịokwu Grik na-enweghị ngwaa zuo oke ma bụrụ Igbo a na-asụ nke ọma.
- source_word: ἀκοή
  choice: ịnụ ihe
  rationale: ἀκοή nwere ike ịpụta omume ịnụ ihe ma ọ bụ ozi a nụrụ. “Ịnụ ihe” na-edebe isi echiche ahụ ma kwekọọ n’ebe abụọ okwu ahụ pụtara n’amaokwu a.
- source_word: δὲ
  choice: -kwa
  rationale: N’ebe a, δέ na-ejikọta nkebiokwu nke abụọ na nke mbụ n’enweghị nnukwu mmegide; mgbakwunye “-kwa” na ngwaa bụ ụzọ Igbo si egosi njikọ ahụ nke ọma.
- source_word: διὰ
  choice: na-esite ... n’
  rationale: διά ya na genitive na-egosi ụzọ ma ọ bụ ihe e ji mee ka ihe pụta. Nhazi “na-esite n’” na-enye nghọta a n’Igbo n’ụzọ dị eke.
- source_word: ῥήματος
  choice: okwu
  rationale: ῥῆμα na-ezo aka n’okwu e kwuru ma ọ bụ nkwupụta. “Okwu” na-edebe ọdịdị okwu Grik ahụ na ụda amaokwu a maara nke ọma.
- source_word: Χριστοῦ
  choice: Mezaya
  rationale: Χριστός bụ aha ọkwá nke pụtara Onye E Tere Mmanụ; “Mezaya” na-egosipụta ọrụ ya dị ka aha ọkwá, ọ bụghị naanị aha mmadụ.
theological_decisions:
- issue: Ihe πίστις pụtara n’ebe a
  choice: okwukwe
  alternative: ntụkwasị obi; ikwesị ntụkwasị obi
  rationale: Ihe gbara amaokwu a gburugburu na-ekwu maka nzaghachi mmadụ nye ozi a kpọsara (Rom 10:14–16). “Okwukwe” na-egosipụta nke a n’etinyeghị nkọwa okwukwe otu chọọchị n’ime ya.
- issue: Njikọ Χριστοῦ na ῥήματος
  choice: okwu Mezaya
  alternative: okwu banyere Mezaya; ozi gbasara Mezaya
  rationale: Genitive Grik ahụ nwere ike ịpụta okwu si n’aka Mezaya ma ọ bụ okwu banyere Mezaya. Isi ederede na-edebe usoro okwu nke isi mmalite, ebe ihe odide ala peeji na-echekwa nghọta ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere nkwughachi nke ἀκοή n’ụdị “ịnụ ihe” n’ebe abụọ ahụ, ma e tinyere ihe odide ala peeji iji chekwaa nghọta dị iche iche nke genitive Χριστοῦ.
