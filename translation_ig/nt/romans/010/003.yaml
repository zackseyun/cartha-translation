  terminology: “Ezi omume” is a suitable consistent rendering for δικαιοσύνη in this Pauline context. The lexical footnote responsibly records “ikpe ziri ezi,” and footnote b preserves the possible senses of τοῦ θεοῦ without deciding a theological interpretation. The footnote markers are correctly placed and correspond to their notes.
