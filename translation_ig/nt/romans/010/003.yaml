id: ROM.10.3
reference: Romans 10:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: ig
  text: N’ihi na ha amaghị ezi omume nke Chineke[a], na-achọkwa ime ka ezi omume nke ha onwe ha guzosie ike, ha edoghị onwe ha n’okpuru ezi omume nke Chineke.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị “ezi omume” n’ebe abụọ a dị ka “ikpe ziri ezi.” N’akwụkwọ Pọl, δικαιοσύνη nwere ike ịpụta ezi omume, ikpe ziri ezi, ma ọ bụ ụzọ ezi omume Chineke si eme ka ndị mmadụ bụrụ ndị ziri ezi.
    reason: lexical_alternative
  - marker: b
    text: Usoro okwu Grik a sụgharịrị “ezi omume nke Chineke” nwekwara ike ịpụta “ezi omume si n’aka Chineke” ma ọ bụ “ezi omume Chineke n’onwe ya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: ha amaghị
  rationale: 'Ọ na-egosi ọnọdụ na-aga n’ihu nke mere ka ha daa: ha amataghị ma ọ bụ ghọtaghị ezi omume Chineke. Nhọrọ a anaghị ekwu karịa ihe Grik kwuru, dịka à ga-asị na ha kpachaara anya jụ ya.'
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na okwu bu ya ụzọ dịka nkọwa nke ihe kpatara ya.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: ezi omume
  rationale: N’ọnọdụ a n’akwụkwọ Pọl, okwu ahụ metụtara ịbụ onye ziri ezi n’ihu Chineke nakwa ụzọ ezi omume Chineke si eme ka mmadụ bụrụ onye ziri ezi; e debere “ikpe ziri ezi” dịka nhọrọ ọzọ n’okpuru peeji.
- source_word: τοῦ θεοῦ
  choice: nke Chineke
  rationale: 'Nkebi a na-ahapụ ohere nghọta dị n’asụsụ Grik: ezi omume bụ nke Chineke, na-esite n’aka Chineke, ma ọ bụ na-egosi ọrụ nzọpụta ya nke ziri ezi.'
- source_word: ἰδίαν
  choice: ezi omume nke ha onwe ha
  rationale: N’asụsụ Grik, a hapụrụ aha “ezi omume” n’ihi na a ghọtara ya site n’okwu bu ụzọ; ikwughachi ya n’Igbo na-eme ka ihe a na-ekwu doo anya ma na-echekwa ike dị na “nke ha onwe ha.”
- source_word: ζητοῦντες στῆσαι
  choice: na-achọkwa ime ka ... guzosie ike
  rationale: Nke a na-echekwa echiche nke ịgbalị ime ka ezi omume nke ha dịgide ma bụrụ ihe a kwadoro, n’enweghị ịkọwa ebumnuche ha karịa ihe ederede kwuru.
- source_word: ὑπετάγησαν
  choice: ha edoghị onwe ha n’okpuru
  rationale: Ọ bụ ụzọ Igbo doro anya isi kwuo na ha ekweghị ịbịa n’okpuru ezi omume Chineke, ma na-echekwa nghọta etiti nke ngwaa Grik n’ebe a.
theological_decisions:
- issue: Ihe “ezi omume nke Chineke” pụtara n’echiche Pọl
  choice: E ji “ezi omume nke Chineke” mee ihe n’ahịrị bụ isi, n’enweghị ikpebi ma ọ bụ ihe Chineke nwere ma na-egosipụta, ihe si n’aka Chineke abịa, ma ọ bụ ọrụ nzọpụta ya nke ziri ezi.
  alternative: ezi omume si n’aka Chineke; ezi omume Chineke n’onwe ya; ikpe ziri ezi nke ọgbụgba ndụ Chineke
  rationale: Usoro okwu Grik nwere ike ibu nghọta ndị a ọnụ. Nsụgharị ahụ na-edebe esemokwu na omimi nke okwu ahụ kama ịmanye otu nkọwa ozizi.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị mfe ma dị ùgwù mee ihe. “Ezi omume” bụ okwu ndị nkịtị ga-aghọta maka δικαιοσύνη, ebe ihe ndị ọzọ okwu ahụ nwere ike ịpụta dị n’okpuru peeji. A kọwara ἰδίαν n’uju dịka “ezi omume nke ha onwe ha” ka ahịrịokwu ahụ bụrụ ihe e ji ọnụ ekwu n’Igbo ma ghara ịdị mgbagwoju anya.
