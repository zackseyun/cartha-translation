revisions:
- from: Ma ana m ajụ, Izrel ọ̀ maghị? [a] Mosis bụ onye mbụ kwuru, sị, “Aga m eji ndị na-abụghị mba kpalie ekworo unu;[b] aga m eji mba na-enweghị nghọta kpasuo unu iwe.”
  to: Ma ana m ajụ, Izrel ọ̀ maghị?[a] Mosis bụ onye mbụ kwuru, sị, “Aga m eji ihe na-abụghị mba mee ka unu nwee ekworo;[b] aga m eji mba na-enweghị nghọta kpasuo unu iwe.”
  rationale: The revision restores the singular neutral force of οὐκ ἔθνει, while keeping the quotation’s ambiguity and avoiding an interpretive identification in the main text. It also uses a natural Igbo causative construction for “make you jealous” and corrects the footnote typo.
