  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: ig
  text: Ma ana m ajụ, Izrel ọ̀ maghị?[a] Mosis bụ onye mbụ kwuru, sị, “Aga m eji ihe na-abụghị mba mee ka unu nwee ekworo;[b] aga m eji mba na-enweghị nghọta kpasuo unu iwe.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Izrel ọ̀ aghọtaghị?” Ngwaa Grik ahụ nwere ike ịpụta ịma ma ọ bụ ịghọta; n’ebe a, ọ pụrụ ịpụta ịghọta ihe a nụrụ pụtara.
    reason: lexical_alternative
  - marker: b
    text: Ihe a bụ okwu e hotara na Diuterọnọmi 32:21. “Ihe na-abụghị mba” nwere ike ịpụta ndị mmadụ a na-ele anya dị ka ndị na-abụghị ezigbo mba, ya bụ, ndị mba ọzọ.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: Izrel ọ̀ maghị?
  rationale: ἔγνω bụ ‘ịma,’ ma n’ọnọdụ a ọ nwekwara ike ịpụta ịghọta ihe a nụrụ. ‘Ọ̀ maghị?’ na-edobe ajụjụ nkwughachi ahụ na ohere nghọta abụọ ahụ.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: Mosis bụ onye mbụ kwuru
  rationale: Na-egosi na Mosis bụ onye mbụ Pọl kpọrọ dịka onye akaebe n’Akwụkwọ Nsọ, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: παραζηλώσω
  choice: Aga m ... kpalie ekworo unu
  rationale: Na-echekwa echiche nke ime ka ndị ọzọ nwee ekworo, kama ịsị naanị na ha ga-enwe ya.
- source_word: ἐπ’ οὐκ ἔθνει
  choice: jiri ndị na-abụghị mba
  rationale: Na-edobe okwu ịma aka dị n’amaokwu ahụ banyere ndị a na-ele anya dị ka ndị na-abụghị ezigbo mba, n’enweghị ịkọwapụta ha kpọmkwem n’ahịrị isi.
- source_word: ἔθνει ἀσυνέτῳ
  choice: jiri mba na-enweghị nghọta
  rationale: Na-anọ nso na ἀσυνέτῳ, ‘na-enweghị nghọta,’ ma na-ezere itinye mkpebi omume siri ike karịa nke isi mmalite.
- source_word: παροργιῶ
  choice: kpasuo unu iwe
  rationale: Na-echekwa ụdị okwu nke ime ka mmadụ wee iwe na myirịta ya na ‘kpalie ekworo.’
theological_decisions:
- issue: Ndị okwu ‘ndị na-abụghị mba’ na ‘mba na-enweghị nghọta’ na-ezo aka na ha
  choice: E debere okwu Mosis n’enweghị ịkpọ ndị ọ na-ezo aka na ha aha n’ahịrị isi.
  alternative: Ịkọwa ha ozugbo dịka ndị mba ọzọ, ma ọ bụ dịka ndị Izrel lere anya na ha abụghị ezigbo mba.
  rationale: Pọl hotara Diuterọnọmi 32:21. Idebe asụsụ amaokwu ahụ na-ahapụ ike okwu ahụ na nghọta ya n’ọnọdụ Pọl, kama itinye nkọwa otu akụkụ n’ime ederede.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a ma dị ùgwù. E jiri ‘unu’ mee ka ọtụtụ mmadụ dị na ὑμᾶς pụta ìhè. A hapụrụ ajụjụ na okwu Mosis n’ụdị dị mkpirikpi ma sie ike dịka n’asụsụ Grik.
