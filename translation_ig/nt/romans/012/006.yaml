  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: ig
  text: 'Ma ebe anyị nwere onyinye dị iche iche dịka amara e nyere anyị si dị: ma ọ bụrụ amụma[a], dịka okwukwe si dị;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “dịka oke okwukwe onye ahụ si dị”; ma ọ bụ, “ka o kwekọọ n’okwukwe Ndị Kraịst.” Nkebiokwu Grik ahụ nwere ike izo aka n’oke okwukwe e nyere onye na-ebu amụma, ma ọ bụ na amụma ahụ ga-adaba n’ihe okwukwe Ndị Kraịst na-akụzi.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: Ma ebe anyị nwere
  rationale: Nke a na-edobe participle ahụ ma na-egosi njikọ na-aga n'ihu site n'amaokwu bu ụzọ; “Ma” na-egosi obere mgbanwe n'echiche.
- source_word: χαρίσματα ... διάφορα
  choice: onyinye dị iche iche
  rationale: “Onyinye” bụ okwu doro anya maka χάρισμα n'ọnọdụ a, ebe “dị iche iche” na-egosipụta ụdịdị ha.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: dịka amara e nyere anyị si dị
  rationale: Ọ na-egosi na onyinye ndị ahụ kwekọrọ n'amara Chineke nyere, ma na-ada nke ọma n'Igbo.
- source_word: εἴτε προφητείαν
  choice: ọ bụrụ ibu amụma
  rationale: Ọ na-ebute ihe mbụ n'usoro onyinye ndị a, na-enweghị ịgbakwunye nkọwa na-adịghị na Grik.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: ka o kwekọọ n'okwukwe
  rationale: “Kwekọọ” na-eburu echiche nke nha, mmekọrịta, ma ọ bụ ndakọrịta dị n'ἀναλογία, ebe “okwukwe” na-edobe ambiguity nke πίστις.
theological_decisions:
- issue: Ihe κατὰ τὴν ἀναλογίαν τῆς πίστεως pụtara
  choice: ka o kwekọọ n'okwukwe
  alternative: dịka oke okwukwe onye ahụ si dị; ma ọ bụ, ka o kwekọọ n'okwukwe Ndị Kraịst
  rationale: Nkebiokwu Grik ahụ nwere ike izo aka n'oke okwukwe e nyere onye na-ebu amụma, ma ọ bụ na ozi amụma ahụ ga-adaba n'ihe okwukwe Ndị Kraịst na-akụzi. Isi ederede anaghị ekpebi otu n'ime ha.
translation_notes:
  register: Standard Igbo dị ugbu a, nke dị ùgwù ma dị mfe nghọta. E ji “ibu amụma” mee ihe n'ụzọ nkịtị, ma e debere nkọwa abụọ nwere ike ịdị na nkebiokwu ikpeazụ n'ala ala peeji.
