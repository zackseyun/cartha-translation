    reason: alternative_reading
  revision_rationale: “Dịka okwukwe si dị” corresponds closely to the Greek wording while leaving open whether faith denotes the prophet’s measure of faith or the shared Christian faith. The footnote presents those alternatives explicitly. “Amụma” restores the source noun and improves idiomatic compactness.
