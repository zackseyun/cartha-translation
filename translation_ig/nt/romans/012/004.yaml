  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: ig
  text: N’ihi na, dị nnọọ ka anyị nwere ọtụtụ akụkụ ahụ[a] n’otu ahụ, ma akụkụ ahụ niile anaghị arụ otu ọrụ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọtụtụ akụkụ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “otu ihe ha na-eme.” Okwu Grik a nwere ike ịpụta ọrụ ma ọ bụ ihe a na-eme; “ọrụ” dabara nke ọma n’ihe atụ Pọl ji akụkụ ahụ mee na n’okwu gbara ya gburugburu banyere ọrụ dị iche iche.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: N’ihi na, dị nnọọ ka
  rationale: “N’ihi na” na-egosi njikọ nkọwa γὰρ na ihe bu ụzọ, ebe “dị nnọọ ka” na-ebute ntụnyere καθάπερ nke a ga-emezu n’amaokwu na-esote.
- source_word: ἐν ἑνὶ σώματι
  choice: n’otu ahụ
  rationale: Nke a na-edobe ma ọnọdụ nke ἐν ma ịdị n’otu nke ihe atụ ahụ, n’agbanyeghị na okwu Igbo “ahụ” nwekwara ike ịpụta ihe ọzọ; gburugburu okwu na-eme ka ihe a pụtara doo anya.
- source_word: πολλὰ μέλη
  choice: ọtụtụ akụkụ ahụ
  rationale: “Akụkụ ahụ” bụ okwu Igbo doro anya ma dị ndụ maka akụkụ dị iche iche nke otu ahụ; ọ na-edobe ihe atụ gbasara ahụ ma ghara ibu ụzọ kọwaa ya dị ka chọọchị.
- source_word: ἔχομεν
  choice: anyị nwere
  rationale: Ntụgharị kwụ ọtọ nke ngwaa ngosi oge ugbu a, onye mbụ ọtụtụ.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: ma akụkụ ahụ niile anaghị
  rationale: 'Usoro a na-egosi ọdịiche δέ ma na-edobe oke nkwụpụ ahụ: ọ bụghị na akụkụ ahụ ọ bụla enweghị ọrụ ahụ, kama na ha niile anaghị arụ otu ọrụ.'
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: arụ otu ọrụ
  rationale: N’ihe atụ banyere ahụ na gburugburu onyinye dị iche iche, “ọrụ” na-enye echiche nke πρᾶξις dị ka ọrụ ma ọ bụ ihe akụkụ ahụ na-eme, n’Igbo nkịtị.
theological_decisions:
- issue: Ike ihe atụ ahụ nwere n’ihe gbasara chọọchị
  choice: E debere naanị “otu ahụ” na “ọtụtụ akụkụ ahụ,” n’agbakwụnyeghị “chọọchị.”
  alternative: “otu ahụ, ya bụ chọọchị”
  rationale: Amaokwu a na-ekwu ihe atụ ahụ; amaokwu na-esote ga-egosi ihe ọ na-anọchi anya ya. Nke a na-edobe usoro echiche Pọl ma ghara itinye nkọwa ozizi n’ime amaokwu ahụ.
- issue: Ihe πρᾶξις pụtara
  choice: ọrụ
  alternative: omume ma ọ bụ ihe a na-eme
  rationale: “Ọrụ” dabara n’ihe atụ nke akụkụ ahụ dị iche iche, ma ndetu ala na-echekwa ohere okwu Grik ahụ nwere ịpụta “ihe a na-eme.”
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “akụkụ ahụ” karịa okwu e ji mmadụ so n’otu akpọ, ka ihe atụ gbasara ahụ pụta ìhè; e debere akara njedebe dị ka rikoma n’ihi na ntụnyere ahụ na-aga n’ihu n’amaokwu na-esote.
