  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: ig
  text: Ekwela ka ihe ọjọọ merie gị[a]; kama jiri ihe ọma merie ihe ọjọọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “Ekwela ka ihe bụ ọjọọ merie gị; kama jiri ihe bụ ọma merie ihe bụ ọjọọ.” N’asụsụ Grik, okwu nkọwa ndị a, nke edemede dị n’ihu ha, nwere ike ịrụ ọrụ dịka aha; a pụrụ ịtụgharị ha dịka “ihe ọjọọ” na “ihe ọma,” ma ọ bụ dịka “ihe bụ ọjọọ” na “ihe bụ ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Ekwela ka ... merie gị
  rationale: Ngwaa ahụ bụ iwu nke na-egbochi ihe, dịkwa n’ụdị nnabata, onye nke abụọ otu. N’Igbo, “Ekwela ka ... merie gị” na-egosipụta nke ọma na onye ahụ ekwesịghị ikwe ka ihe ọjọọ nweta mmeri n’ebe ọ nọ, ma na-ada nke ọma karịa ntụgharị siri ike dịka “Ka a ghara imeri gị.”
- source_word: ὑπὸ τοῦ κακοῦ
  choice: ihe ọjọọ
  rationale: ὑπό na genitive na-egosi onye ma ọ bụ ihe na-eme ihe n’ahịrịokwu nnabata. Articular neuter adjective a nwere ike ịbụ “ọjọọ” n’ozuzu ya ma ọ bụ “ihe ọjọọ.” Igbo chọrọ aha nkwado “ihe” n’ebe a ka okwu ahụ doo anya ma bụrụ nke e ji eme ihe kwa ụbọchị.
- source_word: ἀλλὰ νίκα
  choice: kama ... merie
  rationale: “Kama” na-egosipụta ngbanwe siri ike nke ἀλλά. “Merie” bụ iwu nye otu onye, ma na-edobe otu mgbọrọgwụ okwu mmeri dị n’akụkụ abụọ dịka Grik si eme.
- source_word: ἐν τῷ ἀγαθῷ
  choice: jiri ihe ọma
  rationale: ἐν na dative ebe a na-egosi ụzọ ma ọ bụ ihe e ji eme ihe. “Jiri ihe ọma” bụ Igbo eke nke na-akọwa na ihe ọma bụ ụzọ e si emeri ihe ọjọọ.
- source_word: τὸ κακόν
  choice: ihe ọjọọ
  rationale: Articular neuter singular a na-arụ ọrụ dịka aha na-anọchi ụdị omume ma ọ bụ ihe niile bụ ọjọọ. “Ihe ọjọọ” na-edobe ọdịiche dị n’etiti ihe ọma na ihe ọjọọ ma kwekọọ na nke mbụ.
theological_decisions:
- issue: Ma κακός/ἀγαθός ọ̀ bụ ụdị omume n’ozuzu ya ka ọ bụ ndị e mere mmadụ, dịka “onye ọjọọ ahụ”
  choice: 'Ụdị omume n’ozuzu ya: “ihe ọjọọ” na “ihe ọma”'
  alternative: Ịghọta τὸ κακόν dịka onye ọjọọ ahụ, dịka Setan
  rationale: Ụdị neuter nke okwu Grik ndị a na-akwado “ihe ọjọọ” na “ihe ọma,” ma ọnọdụ okwu gbara ya gburugburu na-ekwu maka otú mmadụ ga-esi zaghachi mmejọ. Ya mere, ntụgharị a anaghị etinye onye pụrụ iche n’ihe ederede ahụ na-ekwughị kpọmkwem.
translation_notes:
  register: E ji Standard Igbo nke dị ugbu a, dị ugwu ma dị mfe nghọta mee ihe. Nkebi abụọ ahụ na-edobe ụda mmeri nke νικάω na ọdịiche dị mkpirikpi n’etiti ihe ọjọọ na ihe ọma.
