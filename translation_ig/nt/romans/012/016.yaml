revisions:
- from: Nweenụ otu echiche n'ebe ibe unu nọ; unu atụkwasịla uche unu n'ihe ndị dị elu[a], kama soronụ ndị nọ n'ọnọdụ dị ala[b]. Unu aghọla ndị maara ihe n'anya onwe unu.
  to: Nweenụ otu uche n'ebe ibe unu nọ; unu etinyela uche unu n'ihe ndị dị elu[a], kama soronụ ndị nọ n'ọnọdụ dị ala[b]. Unu aghọla ndị maara ihe n'anya onwe unu.
  rationale: 'The revision makes two limited idiomatic improvements: «otu uche» better represents harmonious shared disposition, and «etinyela uche» naturally renders setting one’s mind on elevated things. The translation continues to preserve, rather than settle, the grammatical and contextual ambiguity of τοῖς ταπεινοῖς through the anchored footnote.'
