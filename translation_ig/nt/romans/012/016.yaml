id: ROM.12.16
reference: Romans 12:16
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: ig
  text: Nweenụ otu uche n'ebe ibe unu nọ; unu etinyela uche unu n'ihe ndị dị elu[a], kama soronụ ndị nọ n'ọnọdụ dị ala[b]. Unu aghọla ndị maara ihe n'anya onwe unu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “unu achọla ihe ndị dị elu,” ma ọ bụ, “unu adịla mpako.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “soronụ ndị dị umeala n’obi.” Okwu Grik ahụ nwere ike ịpụta ndị nọ n’ọnọdụ dị ala ma ọ bụ ihe ndị dị ala.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ ... φρονοῦντες
  choice: Nweenụ otu echiche
  rationale: Nke a na-egosi otu mmụọ na nkwekọrịta n'etiti ndị kwere ekwe, ọ bụghị na onye ọ bụla ga na-eche kpọmkwem otu ihe ahụ.
- source_word: εἰς ἀλλήλους
  choice: n'ebe ibe unu nọ
  rationale: Ọ na-egosi otú ha kwesịrị isi na-eche echiche ma na-akpa àgwà n'ebe ibe ha nọ.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: unu atụkwasịla uche unu n'ihe ndị dị elu
  rationale: Nsụgharị a na-edobe oyiyi Grik nke itinye uche n'ihe dị elu, nke nwere ike ịpụta mpako ma ọ bụ ịchọ ọkwa na ihe ndị a na-ewere dị elu.
- source_word: τοῖς ταπεινοῖς
  choice: ndị nọ n'ọnọdụ dị ala
  rationale: N'okwu gbara ya gburugburu, nke a na-akọwa nke ọma ndị mmadụ na-enweghị nnukwu ọkwa. Ihe odide Grik nwekwara ike izo aka n'ihe ndị dị ala, ya mere e debere nke ahụ n'okpuru ederede.
- source_word: συναπαγόμενοι
  choice: soronụ
  rationale: Okwu a pụtara iso ma ọ bụ ikwe ka a dọta mmadụ soro; ‘soronụ’ bụ okwu Igbo dị mfe ma kwekọọ n'ịkpọ oku ka ha na ndị nọ n'ọnọdụ dị ala na-emekọrịta ihe.
- source_word: μὴ γίνεσθε
  choice: Unu aghọla
  rationale: ‘Aghọla’ na-edobe echiche nke ịmalite ma ọ bụ ịbanye n'ụdị àgwà a, karịa nanị ịkọwa ọnọdụ mmadụ nọ na ya.
- source_word: φρόνιμοι παρ’ ἑαυτοῖς
  choice: ndị maara ihe n'anya onwe unu
  rationale: Nke a bụ ụzọ Igbo doro anya isi gosipụta mmadụ ile onwe ya anya dị ka onye maara ihe.
theological_decisions:
- issue: Ihe τὰ ὑψηλά na τοῖς ταπεινοῖς pụtara n'ịdọ aka ná ntị banyere ịdị umeala n'obi
  choice: E debere ‘ihe ndị dị elu’ ka ọ gụnye ma mpako ma ịchọ ihe ma ọ bụ ọkwa dị elu; a tụgharịrị τοῖς ταπεινοῖς n'isi ederede dị ka ndị nọ n'ọnọdụ dị ala.
  alternative: A pụrụ ịghọta ya dị ka ‘unu adịla mpako, kama soronụ ndị dị umeala n'obi,’ ma ọ bụ ‘unu achọla ihe ndị dị elu, kama nyefeenụ onwe unu n'ihe ndị dị ala.’
  rationale: Ụdị Grik ahụ na-enye ohere ma nghọta metụtara ọnọdụ ndị mmadụ ma nghọta metụtara ụdị echiche ma ọ bụ ihe mmadụ na-achọ. Ihe odide na nkọwa ala peeji na-edobe ohere abụọ ahụ kama ikpebi otu naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị nọ n'ọnọdụ dị ala’ kama okwu nwere ike iyi ka ọ na-akparị mmadụ, ebe nkọwa ala peeji na-echekwa nghọta ndị ọzọ nke Grik.
