  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: ig
  text: Ọ bụrụ na ọ ga-ekwe omume[a], ruo ókè o dị n'aka unu, birinụ n'udo na mmadụ niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Ọ bụrụ na o kwe omume, n'ihe dị unu n'aka, birinụ n'udo na mmadụ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Ọ bụrụ na ọ ga-ekwe omume
  rationale: Nkebi ahịrịokwu a na-egosi na iwu ahụ dabere n'ihe nwere ike ime n'ezie; ọ naghị eme ka inweta udo bụrụ iwu a na-aghaghị imezu n'ọnọdụ niile.
- source_word: τὸ ἐξ ὑμῶν
  choice: ruo ókè ihe ahụ dị n'aka unu
  rationale: Nke a bụ ụzọ Igbo si egosi ihe dị n'ike na n'ọrụ onye; ọ na-echekwa oke Pọl tinyere n'ihe ndị na-agụ akwụkwọ a ga-aza ajụjụ banyere ya.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: mmadụ niile
  rationale: ἄνθρωποι ebe a gụnyere mmadụ niile, ọ bụghị naanị ụmụ nwoke; ‘mmadụ niile’ bụ okwu doro anya ma bụrụkwa nke okike n'Igbo ugbu a.
- source_word: εἰρηνεύοντες
  choice: soronụ ... biri n'udo
  rationale: Partisịpụ a na-arụ ọrụ dị ka ndụmọdụ iwu n'okwu gbara ya gburugburu. ‘Biri n'udo’ na-egosi omume na-adịgide adịgide, ebe ‘soronụ’ na-ejikọta ya n'ụzọ okike na ndị mmadụ a kpọrọ aha.
theological_decisions:
- issue: Oke na ọnọdụ nke ndụmọdụ ka e biri n'udo
  choice: Ndị kwere ekwe ga-achọ ka ha na mmadụ niile biri n'udo, ma ibu ọrụ ha ruru naanị n'ihe dị ha n'aka.
  alternative: Iwu a enweghị ọnọdụ ọ bụla, ma ọ bụ na ọ na-ekwe nkwa na udo ga-adị mgbe niile ma ọ bụrụ na ndị kwere ekwe emee ihe ziri ezi.
  rationale: εἰ δυνατόν na τὸ ἐξ ὑμῶν jikọtara ọnụ na-echekwa esemokwu dị n'etiti iru mmadụ niile na oke ikike onye kwere ekwe. Nsụgharị ahụ anaghị ekwe nkwa na udo ga-adị mgbe ndị ọzọ jụrụ ya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E ji ụdị ọtụtụ mmadụ ‘unu/soronụ’ chekwaa ὑμῶν na ndụmọdụ e nyere ọgbakọ ahụ; e zere okwu na-egosi otu ozizi ụka pụrụ iche.
