  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: ig
  text: Ṅụrịanụ ọṅụ na ndị na-aṅụrị ọṅụ; kwanụ ákwá na ndị na-akwa ákwá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “Nweenụ ọṅụ na ndị nwere ọṅụ; kwanụ ákwá na ndị na-akwa ákwá.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρειν
  choice: ṅụrịa ọṅụ
  rationale: Infinitive a na-arụ ọrụ dị ka iwu n'usoro ndụmọdụ a. “Ṅụrịa ọṅụ” bụ okwu Igbo doro anya ma na-egosipụta ọṅụ nke ọma.
- source_word: μετὰ
  choice: soronụ
  rationale: μετά na genitive na-egosi iso mmadụ nwee otu ahụmahụ. N'Igbo, “soronụ” na-egosipụta mkpakọrịta ahụ n'ụzọ eke karịa ntụgharị mkpụrụokwu nkịtị.
- source_word: χαιρόντων
  choice: ndị na-aṅụrị ọṅụ
  rationale: Participle dị na present, plural, nke na-arụ ọrụ dị ka aha; ntụgharị a na-edobe echiche nke ndị nọ n'ọṅụ ma bụrụkwa Igbo a na-asụ ugbu a.
- source_word: κλαίειν
  choice: kwaa ákwá
  rationale: Dị ka χαίρειν, infinitive a nwere ike iwu. “Kwaa ákwá” na-egosipụta ịkwa ákwá n'ụzọ kpọmkwem ma na-edobe myirịta ahịrịokwu ahụ.
- source_word: κλαιόντων
  choice: ndị na-akwa ákwá
  rationale: Participle present plural a na-arụ ọrụ dị ka aha. “Ndị na-akwa ákwá” doro anya ma kwekọọ n'usoro “ndị na-aṅụrị ọṅụ.”
theological_decisions:
- issue: Ike iwu nke infinitive abụọ ahụ n'usoro ndụmọdụ
  choice: 'Tụgharịa ha dị ka iwu: “ṅụrịa ọṅụ ... kwaa ákwá.”'
  alternative: “Ịṅụrị ọṅụ ...; ịkwa ákwá ...”
  rationale: Ọ bụ ezie na Grik ji infinitive, n'okwu ndụmọdụ Rom 12:9–21 ha na-arụ ọrụ dị ka iwu. Iwu Igbo na-eme ka ọrụ okwu ahụ pụta ìhè n'etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị mfe nghọta ma nwee ugwu. E ji “soronụ” gosipụta μετά n'ụzọ eke, ma debe myirịta dị n'etiti ọṅụ na ịkwa ákwá.
