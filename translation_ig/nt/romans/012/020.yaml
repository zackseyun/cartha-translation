id: ROM.12.20
reference: Romans 12:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: ig
  text: Ma ọ bụrụ na agụụ na-agụ onye iro gị, nye ya nri; ọ bụrụ na akpịrị na-akpọ ya nkụ, nye ya ihe ọ ga-aṅụ; n’ihi na site n’ime nke a, ị ga-ekpokọba icheku na-ere ọkụ[a] n’isi ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: N’ụzọ nkịtị, “icheku nke ọkụ.” Onyinyo a nwere ike ịpụta ihere na-eduga ná nchegharị, mgbu na-ata akọ na uche, ma ọ bụ ikpe na-abịa; a hapụrụ okwu onyinyo Grik ahụ otú ọ dị n’amaokwu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Ma ọ bụrụ na
  rationale: “Ma” na-egosi ntụgharị megide ịbọ ọbọ a machibidoro n’amaokwu bu ụzọ, ebe “ọ bụrụ na” na-edobe ọnọdụ nke ἐάν.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: agụụ na-agụ onye iro gị
  rationale: Nke a bụ ụzọ Igbo nkịtị ma doo anya isi kwuo na onye iro ahụ nọ n’agụụ; a hapụrụ “onye iro” n’otu mmadụ dịka Grik si dị.
- source_word: ψώμιζε αὐτόν
  choice: nye ya nri
  rationale: ψωμίζω pụtara inye mmadụ ihe oriri; okwu a bụ iwu, ma nsụgharị a bụ nke sitere n’ọnụ ndị Igbo taa ma dịkwa kpọmkwem.
- source_word: ἐὰν διψᾷ
  choice: ọ bụrụ na akpịrị na-akpọ ya nkụ
  rationale: Akpaokwu a bụ ụzọ Igbo e si ekwu na mmadụ na-akpọ nkụ, ma ọ na-edobe ọnọdụ nke ahịrịokwu Grik.
- source_word: πότιζε αὐτόν
  choice: nye ya ihe ọ ga-aṅụ
  rationale: ποτίζω bụ inye mmadụ ihe ọṅụṅụ; “ihe ọ ga-aṅụ” anaghị emechi ihe ahụ n’ime mmiri naanị, ebe Grik ekwughị ụdị ihe ọṅụṅụ.
- source_word: τοῦτο γὰρ ποιῶν
  choice: n’ihi na site n’ime nke a
  rationale: Nke a na-egosi ma nkọwa nke γάρ ma ụzọ omume ndị ahụ si eweta ihe a na-ekwu n’ahịrịokwu na-esote.
- source_word: ἄνθρακας πυρὸς
  choice: icheku ọkụ na-enwu enwu
  rationale: Nke a na-edobe onyinyo doro anya nke icheku dị ọkụ ma na-ada nke ọma n’Igbo ugbu a.
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: ị ga-ekpokọba … n’isi ya
  rationale: “Ị ga-ekpokọba” na-egosipụta ngwaa ọdịnihu na echiche ịtụkọ ihe n’elu ihe ọzọ; “n’isi ya” na-edobe onyinyo Grik ahụ.
theological_decisions:
- issue: Ihe onyinyo “ị ga-ekpokọba icheku ọkụ na-enwu enwu n’isi ya” pụtara
  choice: Edobere onyinyo ahụ n’amaokwu n’enweghị ịkọwa otu ihe ọ pụtara kpọmkwem.
  alternative: Ịkọwa ya dị ka ihere na-eduga ná nchegharị, mgbu nke akọ na uche, ma ọ bụ ikpe Chineke na-abịa.
  rationale: Ihe onyinyo Grik a nwere ọtụtụ nkọwa a na-arụrịta ụka banyere ha. Ịhapụ ya otú ọ dị na-echekwa nghọta dịgasị iche na esemokwu nkà mmụta okpukpe dị n’ederede kama idozi ya n’aha onye na-agụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E jiri akpaokwu ndị a na-asụkarị—“agụụ na-agụ” na “akpịrị na-akpọ … nkụ”—ma debe usoro iwu, otu onye a na-agwa okwu, na onyinyo siri ike nke Grik.
