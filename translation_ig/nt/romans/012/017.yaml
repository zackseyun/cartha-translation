  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: ig
  text: Unu akwụghachila onye ọ bụla ihe ọjọọ maka ihe ọjọọ; kama, chebaanụ echiche tupu oge eruo banyere ihe dị mma[a] n’anya mmadụ niile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ihe kwesịrị nsọpụrụ” ma ọ bụ “ihe magburu onwe ya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: onye ọ bụla ... -la
  rationale: 'E ji usoro mmachibido ‘onye ọ bụla ... -la’ gosipụta dative ahụ dị ka onye a na-agaghị akwụghachi ihe ọjọọ, ma chekwaa mkpokọta ya: ọ dịghị onye ọbụla.'
- source_word: κακὸν ἀντὶ κακοῦ
  choice: ihe ọjọọ n’ọnọdụ ihe ọjọọ
  rationale: ‘Ihe ọjọọ’ na-echekwa ike omume nke κακόν; ‘n’ọnọdụ’ na-egosi mmegwara, ya bụ imeghachi ihe ọjọọ n’ihi ihe ọjọọ e mere.
- source_word: ἀποδιδόντες
  choice: akwụghachila
  rationale: Ngwaa a na-egosi inyeghachi ihe dịka nzaghachi. N’ọnọdụ a participle ahụ nwere ike nke iwu, ya mere a sụgharịrị ya dị ka mmachibido kpọmkwem.
- source_word: προνοούμενοι
  choice: burunụ ụzọ tụlee ime
  rationale: Nke a na-egosi iche echiche tupu oge eruo na ilezi anya ịhọrọ omume kwesịrị ekwesị, n’enweghị ịkọwa ya nanị dị ka inye ihe onwunwe.
- source_word: καλὰ
  choice: ihe dị mma
  rationale: Nhọrọ a sara mbara ma na-echekwa echiche nke ezi omume; nkọwa ala peeji na-edebekwa ndò pụtara ihe a na-asọpụrụ ma ọ bụ ihe kwesịrị nsọpụrụ.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: n’anya mmadụ niile
  rationale: Akpaalaokwu Igbo a na-egosi ihe a na-ahụ ma na-atụle n’ihu mmadụ niile, ma ἀνθρώπων ebe a gụnyere mmadụ nile.
theological_decisions:
- issue: Ndò pụtara καλά n’ọnọdụ omume a na-ahụ n’ihu ọha
  choice: ihe dị mma
  alternative: ihe kwesịrị nsọpụrụ; ihe magburu onwe ya
  rationale: ‘Ihe dị mma’ anaghị eme ka ndụmọdụ Pọl bụrụ naanị ịchọ ka ọha mmadụ kwado mmadụ; ọ ka nwere ike ịgụnye ezi omume na omume a na-asọpụrụ. E debere ndò ndị ọzọ na nkọwa ala peeji.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ugwu ma doo anya. E ji ‘unu’ mee ka ndị a na-agwa okwu n’ọnụọgụ ọtụtụ pụta ìhè, dịka ọnọdụ akwụkwọ ozi ahụ si dị; e jikwa iwu kpọmkwem mee ka ike ndụmọdụ nke participle abụọ ahụ doo anya.
