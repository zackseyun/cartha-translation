id: ROM.12.8
reference: Romans 12:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: ig
  text: Ọ bụrụ na mmadụ na-agba ndị ọzọ ume[a], ya gbaa ha ume; onye na-ekerịta ihe o nwere[b], ya jiri mmesapụ aka[c] mee ya; onye na-edu ndị ọzọ[d], ya jiri ịdị uchu[e] mee ya; onye na-emere ndị ọzọ ebere, ya jiri obi ụtọ mee ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-adụ ndị ọzọ ọdụ … n’ịdụ ha ọdụ.” Okwu Grik ndị a pụrụ ịpụta ma ịgba ume ma ịdụ mmadụ ọdụ ka o mee ihe kwesịrị ekwesị.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsị, “onye na-enye ihe” ma ọ bụ “onye na-atụnye ihe.”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsị, “jiri ezi obi” ma ọ bụ “n’enweghị aghụghọ.” Okwu Grik ahụ pụrụ ịpụta ịdị mfe ma ọ bụ ezi obi, nakwa mmesapụ aka, dịka ọnọdụ okwu si dị.
    reason: lexical_alternative
  - marker: d
    text: A pụkwara ịsị, “onye na-elekọta” ma ọ bụ “onye na-achịkọta ọrụ.”
    reason: lexical_alternative
  - marker: e
    text: A pụkwara ịsị, “jiri ịnụ ọkụ n’obi” ma ọ bụ “jiri obi ya niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: Ọ bụrụ na
  rationale: Ọ na-aga n’ihu n’usoro ahịrịokwu a hapụrụ ụfọdụ okwu ya n’amaokwu ndị bu ụzọ; ‘Ọ bụrụ na’ na-eme ka usoro ahụ doo anya n’Igbo n’etinyeghị nkọwa ozizi ọzọ.
- source_word: ὁ παρακαλῶν / ἐν τῇ παρακλήσει
  choice: onye na-agba ndị ọzọ ume … n’ịgba ha ume
  rationale: ‘Ịgba ume’ na-ekpuchi echiche nke ịkwado mmadụ na nke ịrịọ ya ike ka o mee ihe; ikwughachi ya na-echekwa njikọ dị n’etiti ngwaa na aha sitere n’otu mgbọrọgwụ Grik.
- source_word: ὁ μεταδιδοὺς
  choice: onye na-ekerịta ihe o nwere
  rationale: Nhọrọ a na-egosi inye ndị ọzọ òkè n’ihe mmadụ nwere, kama ịbụ naanị okwu izugbe maka inye ihe.
- source_word: ἐν ἁπλότητι
  choice: jiri mmesapụ aka
  rationale: N’ọnọdụ a nke ikerịta ihe mmadụ nwere, ‘mmesapụ aka’ kacha egosipụta echiche nke inye n’ụba, ọ bụ ezie na okwu Grik ahụ nwekwara ike ịpụta ezi obi ma ọ bụ enweghị aghụghọ.
- source_word: ὁ προϊστάμενος
  choice: onye na-edu ndị ọzọ
  rationale: Nke a bụ okwu sara mbara maka idu ndú ma ọ bụ ilekọta, na-emeghị ya aha ọrụ pụrụ iche n’ọgbakọ.
- source_word: ἐν σπουδῇ
  choice: jiri ịdị uchu
  rationale: ‘Ịdị uchu’ na-egosipụta nlezianya na itinye obi n’ọrụ, dabara n’ọrụ idu ndú.
- source_word: ὁ ἐλεῶν
  choice: onye na-emere ndị ọzọ ebere
  rationale: Ọ na-echekwa ụdị omume nke participle Grik ahụ ma bụrụkwa okwu Igbo doro anya.
- source_word: ἐν ἱλαρότητι
  choice: jiri obi ụtọ
  rationale: Ọ na-egosipụta ime ebere n’ọṅụ na n’enweghị iwe ma ọ bụ mkpesa.
theological_decisions:
- issue: Oke ihe ὁ προϊστάμενος pụtara
  choice: onye na-edu ndị ọzọ
  alternative: onye na-achị, onye na-elekọta, ma ọ bụ onyeisi ọrụ pụrụ iche n’ọgbakọ
  rationale: Okwu ahụ nwere ike ịpụta idu ndú ma ọ bụ ilekọta, ma amaokwu a akpọghị ọkwa ọchịchị ụka kpọmkwem; ntụgharị sara mbara na-ezere itinye usoro otu ụka n’ime ederede.
- issue: Ihe ἁπλότης pụtara n’ebe a
  choice: mmesapụ aka
  alternative: ezi obi, ịdị mfe, ma ọ bụ enweghị aghụghọ
  rationale: Ebe ọ na-akọwa ikerịta ihe mmadụ nwere, echiche nke mmesapụ aka yiri ka ọ kacha dabara, ma nkọwa ala peeji na-echekwa nghọta ndị ọzọ okwu ahụ nwere.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘ya … mee ya’ na-eme ka ahịrịokwu Grik ndị dị mkpirikpi guzo nke ọma n’Igbo, ebe nkwughachi ‘ịgba ume’ na-echekwa ụda na njikọ okwu dị na Grik.
