  terminology: “Mmesapụ aka,” “ịdị uchu,” and “obi ụtọ” appropriately render ἁπλότης, σπουδή, and ἱλαρότης in context. “Onye na-edu ndị ọzọ” remains suitably broad for προϊστάμενος and does not impose a specific church office. The lexical notes are appropriate.
