translation:
  language: ig
  text: ọ bụrụ na ọ bụ ije ozi[a], ka ọ nọgide n’ije ozi; ọ bụrụkwa na ọ bụ onye na-akụzi ihe, ka ọ nọgide n’ịkụzi ihe[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ọ bụrụ na ọ bụ ozi, ka ọ nọgide n’ozi.” Okwu Grik διακονία nwere ike ịpụta “ije ozi” ma ọ bụ “ozi,” dabere n’ihe gbara ya gburugburu.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ bụrụ na ọ bụ onye nkuzi, ka ọ nọgide n’ịkụzi ihe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: ọ bụrụ
  rationale: N’usoro ndepụta a nke ahịrịokwu ya ezughị ezu, “ọ bụrụ” na-egosipụta nke ọ bụla dị ka ọrụ ma ọ bụ onyinye mmadụ nwere, ma na-edobe nhazi dị mkpirikpi nke Grik.
- source_word: διακονίαν
  choice: ije ozi
  rationale: “Ije ozi” bụ okwu sara mbara ma dị mfe nghọta nke nwere ike ịpụta inyere ndị ọzọ aka ma ọ bụ ịrụ ọrụ n’ọgbakọ, n’etinyeghị echiche na ọ bụ ọkwa ọchịchị chọọchị kpọmkwem.
- source_word: ἐν τῇ διακονίᾳ
  choice: ya nọgide n’ije ozi ahụ
  rationale: Grik na-ekwughachi aha ahụ n’ụzọ dị mkpirikpi. N’Igbo, “ya nọgide n’...” na-eme ka ihe ahịrịokwu ahụ na-agba ume ka e mee doo anya, ma na-echekwa nkwughachi nke okwu ahụ.
- source_word: ὁ διδάσκων
  choice: onye na-akụzi ihe
  rationale: Nhọrọ a na-echekwa ike nke participle Grik, nke na-elekwasị anya n’onye na-arụ ọrụ ịkụzi ihe, kama ime ya aha ọkwa pụrụ iche.
- source_word: διδασκαλίᾳ
  choice: ịkụzi ihe
  rationale: “Ịkụzi ihe” na-egosi ọrụ nkuzi n’ụzọ doro anya ma bụrụ okwu ndị mmadụ na-eji kwa ụbọchị; ọ naghị eme ka okwu ahụ bụrụ naanị ozizi a haziri ahazi.
theological_decisions:
- issue: Ma a ga-eji okwu na-egosi ọkwa pụrụ iche n’ọgbakọ sụgharịa διακονία
  choice: ije ozi
  alternative: ozi n’ọgbakọ
  rationale: Ihe gbara amaokwu ahụ gburugburu bụ ndepụta onyinye na ọrụ amara. “Ije ozi” na-echekwa obosara okwu Grik ma ghara ikwu na ọ bụ ọkwa chọọchị e guzobere eguzobe.
- issue: Ma a ga-eme ὁ διδάσκων aha ọkwa n’ọgbakọ
  choice: onye na-akụzi ihe
  alternative: onye nkuzi
  rationale: Ụdị participle Grik na-emesi onye na-arụ ọrụ ịkụzi ihe ike, ọ naghị ekwu hoo haa na nke a bụ aha ọkwa. Nsụgharị a na-echekwa ọdịiche ahụ.
translation_notes:
  register: E ji Standard Igbo dị ugwu ma dị mfe nghọta mee ya. E tinyere “ya nọgide” iji mee ka ahịrịokwu Grik nke dị mkpirikpi ma hapụ ngwaa pụtara nke ọma n’Igbo, n’enweghị ime ka iwu ahụ sie ike karịa ihe okwu ahụ na-egosi. E jighị aha ọkwa chọọchị mee “ije ozi” ma ọ bụ “onye na-akụzi ihe.”
