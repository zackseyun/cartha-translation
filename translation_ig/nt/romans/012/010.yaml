  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: ig
  text: N'ịhụnanya ụmụnne, hụrụnụ ibe unu n'anya dị ka ndị otu ezinụlọ; n'ịsọpụrụ, burunu ụzọ sọpụrụ ibe unu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: ịhụnanya dị ka nke ụmụnne
  rationale: Ọ na-egosi ịhụnanya e ji ahụ ndị ha na mmadụ bụ ụmụnne n'okwukwe, n'ebughị ụzọ kwuo na ha bụ ụmụnne site n'ọbara.
- source_word: φιλόστοργοι
  choice: na-ahụrịtanụ ibe unu n'anya nke ukwuu
  rationale: Nhọrọ a na-egosipụta ịhụnanya miri emi na nke na-ekpo ọkụ dị ka nke ndị otu ezinụlọ, ma na-anọgidekwa n'Igbo dị mfe nghọta.
- source_word: τῇ τιμῇ
  choice: n'ịsọpụrụ ibe unu
  rationale: τιμή n'ebe a bụ nsọpụrụ ma ọ bụ ịkwanyere mmadụ ùgwù; 'ịsọpụrụ' bụ okwu Igbo doro anya ma kwekọọ n'ahịrịokwu a.
- source_word: προηγούμενοι
  choice: na-agbalịsịnụ ịka ibe unu
  rationale: Okwu Grik a nwere echiche nke ibute ụzọ ma ọ bụ ịkarị ndị ọzọ; nsụgharị a na-ejigide ume dị n'iwu ahụ nke na-akpọ ndị kwere ekwe ka ha gbalịsie ike ịka ibe ha n'inye nsọpụrụ.
theological_decisions:
- issue: Ma προηγούμενοι pụtara ịka ibe unu ka ọ bụ ibute ụzọ
  choice: na-agbalịsịnụ ịka ibe unu
  alternative: na-ebutere ibe unu ụzọ
  rationale: A họọrọ echiche nke 'ịka ibe unu' n'ihi na ọ na-egosipụta asọmpi ọma n'inye nsọpụrụ ma kwekọọ na otu nghọta siri ike nke okwu Grik ahụ. Nhọrọ ọzọ nwere ike igosi naanị ịbụ onye mbụ, ma ọ naghị egosipụta ike nile nke okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. E jighị okwu ụka pụrụ iche; iwu abụọ ahụ dị n'ụdị ndụmọdụ siri ike nke dabara na participle ndị Grik e ji mee iwu.
