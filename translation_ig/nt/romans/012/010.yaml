revisions:
- from: N'ịhụnanya dị ka nke ụmụnne, na-ahụrịtanụ ibe unu n'anya nke ukwuu; n'ịsọpụrụ ibe unu, na-agbalịsịnụ ịka ibe unu.
  to: N'ịhụnanya ụmụnne, hụrụnụ ibe unu n'anya dị ka ndị otu ezinụlọ; n'ịsọpụrụ, burunu ụzọ sọpụrụ ibe unu.
  rationale: 'The revision distinguishes the two related Greek concepts: brotherly love and tender family affection. It also renders προηγούμενοι as taking the lead in honoring others, avoiding an unspecified competitive sense while preserving the reciprocal force of ἀλλήλους.'
  reviewer_model: gpt-5.6-terra
