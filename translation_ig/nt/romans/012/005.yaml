  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: ig
  text: otu ahụkwa ka anyị[a], ọ bụ ezie na anyị dị ọtụtụ, bụ otu ahụ n’ime Mesaịa, ma n’otu n’otu, anyị bụ akụkụ nke ibe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime Kraịst.” A pụrụ ịsụgharị aha ọkwá Grik bụ Χριστός n’ụzọ abụọ a; n’ebe a, a sụgharịrị ya “Mesaịa” iji mee ka o doo anya na ọ bụ aha ọkwá.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: otu ahụkwa ka
  rationale: Ọ na-ejikọta amaokwu a na ihe atụ banyere otu ahụ nwere ọtụtụ akụkụ dị n’amaokwu bu ya ụzọ, ma na-egosipụta echiche ‘otu a ka ọ dịkwa.’
- source_word: οἱ πολλοὶ
  choice: anyị, ọ bụ ezie na anyị dị ọtụtụ
  rationale: N’ọnọdụ a, Pọl tinyere onwe ya na ndị kwere ekwe ndị ọzọ; ntụgharị a na-eme ka onye mbụ ọtụtụ zoro n’okwu Grik pụta ìhè ma na-echekwa ọdịiche dị n’etiti ịdị ọtụtụ na ịbụ otu.
- source_word: ἓν σῶμά
  choice: otu ahụ
  rationale: Ọ na-echekwa ihe atụ Pọl ji ahụ mmadụ mee, yana echiche ịdị n’otu.
- source_word: ἐν Χριστῷ
  choice: n’ime Onye Mesaịa
  rationale: Ọ na-echekwa okwu Pọl banyere ịdị n’ime Χριστός, ma na-egosikwa na Χριστός bụ aha ọkwá, ya bụ Mesaịa.
- source_word: τὸ δὲ καθ’ εἷς
  choice: ma n’otu n’otu
  rationale: 'Ọ na-egosipụta ike nkesa nke akpaalaokwu Grik ahụ: ile onye ọ bụla anya n’otu n’otu.'
- source_word: ἀλλήλων
  choice: nke ibe anyị
  rationale: Ọ na-egosipụta mmekọrịta na njikọ nke onye ọ bụla na ndị ọzọ n’ime ahụ ahụ.
- source_word: μέλη
  choice: akụkụ
  rationale: ‘Akụkụ’ bụ okwu Igbo doro anya ma dịrị ihe atụ ahụ mmadụ mma; ọ na-egosi na onye ọ bụla bụ akụkụ nke otu ahụ, ọ bụghị naanị onye so n’otu nzukọ.
theological_decisions:
- issue: Otu e si sụgharịa Χριστῷ n’okwu ἐν Χριστῷ
  choice: n’ime Onye Mesaịa
  alternative: n’ime Kraịst
  rationale: Χριστός ka bụ aha ọkwá n’asụsụ Grik. ‘Onye Mesaịa’ na-echekwa nghọta ahụ ma ghara iwepụ echiche Pọl banyere njikọ ndị kwere ekwe na ya. E debere ‘Kraịst’ n’ala peeji dị ka ntụgharị ọzọ a maara nke ọma.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ na-echekwa ihe atụ nke otu ahụ nwere ọtụtụ akụkụ, yana mmekọrịta mmadụ na ibe ya dị n’okwu Grik.
