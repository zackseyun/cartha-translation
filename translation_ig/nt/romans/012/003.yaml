id: ROM.12.3
reference: Romans 12:3
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: ig
  text: N’ihi na site n’amara e nyere m, ana m agwa onye ọ bụla nọ n’etiti unu ka ọ ghara iche banyere onwe ya karịa otú o kwesịrị iche; kama ka o chee echiche n’ụzọ ziri ezi[a], dịka Chineke kesara onye ọ bụla ọ̀tụ̀tụ̀ okwukwe[b] nye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “kama ka o chee echiche n’ụzọ ga-eme ka o nwee uche ziri ezi ma jide onwe ya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ọ̀tụ̀tụ̀ okwukwe ahụ”; ma eleghị anya, “ọ̀tụ̀tụ̀ nke ntụkwasị obi” ma ọ bụ “ọ̀tụ̀tụ̀ nke ikwesị ntụkwasị obi.” Nkebiokwu Grik ahụ nwere ike ịpụta ọ̀tụ̀tụ̀ Chineke nyere nke metụtara okwukwe, n’akọwaghị kpọmkwem ụdị njikọ ahụ.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: site n’amara e nyere m
  rationale: “Site na” na-egosi ụzọ ma ọ bụ ntọala Pọl ji ekwu okwu, ebe “amara e nyere m” na-edobe echiche nke ọrụ Chineke nyere ya n’ebughị nkọwa ọzọ bata.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: onye ọ bụla nọ n’etiti unu
  rationale: Nke a na-edobe ike nkesa nke παντί ma na-ekwu n’ụzọ Igbo doro anya banyere onye ọ bụla n’ime ọgbakọ ahụ.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: ka ọ ghara iche banyere onwe ya karịa otú o kwesịrị iche
  rationale: Nsụgharị a na-edobe echiche nke mmadụ ịtụ onwe ya elu gabiga ókè, tinyere mmegharị okwu φρονέω dị n’amaokwu ahụ.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: kama ka o jiri ezi uche chee echiche
  rationale: “Jiri ezi uche chee echiche” na-egosi uche ziri ezi, ịdị nwayọọ n’ịtụ onwe onye, na njide onwe onye nke σωφρονεῖν nwere, ma dịkwa mfe nghọta n’Igbo ugbu a.
- source_word: ἐμέρισεν
  choice: kenye
  rationale: “Kenye” na-egosi na Chineke nyere onye ọ bụla òkè ya n’ụzọ e kewara ekewa, dịka μερίζω si pụta n’ọnọdụ a.
- source_word: μέτρον πίστεως
  choice: otu ọ̀tụ̀tụ̀ okwukwe
  rationale: Nke a na-edobe okwu ahụ n’obosara ya, n’akọwaghị ya kpọmkwem dịka okwukwe nzọpụta, ikike ije ozi, ma ọ bụ ụkpụrụ okwukwe.
- source_word: πίστεως
  choice: okwukwe
  rationale: “Okwukwe” bụ nghọta bụ isi nke πίστις ebe a ma na-ahapụ ohere maka nghọta ndị ọzọ nke njikọ genitive ahụ.
theological_decisions:
- issue: Ihe μέτρον πίστεως pụtara
  choice: otu ọ̀tụ̀tụ̀ okwukwe
  alternative: ọ̀tụ̀tụ̀ okwukwe ahụ; otu ọ̀tụ̀tụ̀ ntụkwasị obi; otu ọ̀tụ̀tụ̀ ikwesị ntụkwasị obi
  rationale: Ọnọdụ na-esote na-ekwu banyere onyinye dị iche iche, ma Grik anaghị ekpebi ma nke a bụ ikike ije ozi, okwukwe nzọpụta, ma ọ bụ ụkpụrụ. Ya mere, a hapụrụ esemokwu nkọwa ahụ dịka ọ dị.
- issue: Ike okwu σωφρονεῖν
  choice: jiri ezi uche chee echiche
  alternative: chee echiche n’ụzọ ga-eme ka o nwee uche zuru oke ma jide onwe ya
  rationale: Nhọrọ bụ isi bụ Igbo dị nfe ma dị ugwu; ihe odide ala peeji na-edobe nkọwa sara mbara nke ịdị sober-minded na njide onwe onye.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. E debere mmegharị echiche “iche/chee echiche,” zere itinye ozizi otu ụka, ma tinye akara ihe odide ala peeji [a] na [b] n’ebe ha metụtara.
