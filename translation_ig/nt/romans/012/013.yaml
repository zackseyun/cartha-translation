review_pass:
  verdict: revise
  source_fidelity: 'The second clause accurately represents τὴν φιλοξενίαν διώκοντες: “na-agbasi mbọ ike” conveys the active force of διώκοντες, and “ile ndị ọbịa ọbịa” naturally expresses hospitality. In the first clause, however, “na-ekekọrịta mkpa” can naturally be understood as distributing or sharing the needs themselves, rather than participating in meeting the saints’ needs. The Greek κοινωνοῦντες with χρείαις calls for active sharing/contribution toward those needs.'
  naturalness: “Na-esonyere n’ịgbo mkpa ndị nsọ” is clear, modern Standard Igbo and explicitly supplies the intended practical sense without restricting it to money. The revised second clause remains idiomatic and suitably exhortative.
  terminology: “Ndị nsọ” appropriately retains Paul’s established designation for believers. “Ile ndị ọbịa ọbịa” is a good Standard Igbo equivalent for φιλοξενία; its explanatory footnote properly notes the welcome of strangers.
  issues:
