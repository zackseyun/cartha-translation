  text: ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/013.yaml
  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: ig
  text: Na-esonyere n’ịgbo mkpa ndị nsọ[a], na-agbasi mbọ ike ile ndị ọbịa ọbịa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “na-enye ihe iji gboo mkpa ndị nsọ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ile ndị ọbịa ọbịa”; okwu Grik ahụ nwekwara ike ịpụta ịnabata ndị a na-amaghị ama.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: mkpa
  rationale: “Mkpa” na-egosi ihe ndị dị ndị mmadụ mkpa n’ụzọ bara uru, ma bụrụ okwu Igbo nkịtị na nke doro anya.
- source_word: ἁγίων
  choice: ndị nsọ
  rationale: “Ndị nsọ” na-echekwa okwu Pọl ji akọwa ndị kwere ekwe dịka ndị e doro nsọ nye Chineke, ọ bụghị naanị mmadụ ole na ole e mesịrị kpọọ ndị nsọ.
- source_word: κοινωνοῦντες
  choice: na-ekekọrịta
  rationale: Nhọrọ a na-echekwa echiche nke iso ndị ọzọ kerịta ma sonye n’ịgbo mkpa ha; ọ naghị amachi ihe ahụ naanị n’inye ego.
- source_word: φιλοξενίαν
  choice: ile ndị ọbịa ọbịa
  rationale: Nkebiokwu Igbo a na-egosi omume ịnabata na ilekọta ndị ọbịa, gụnyere ndị a na-amaghị ama, dịka φιλοξενία si pụta.
- source_word: διώκοντες
  choice: na-agbasi mbọ ike
  rationale: Nke a na-egosi ịchụso ihe a n’ụzọ siri ike na nke ebumnuche, kama ịbụ naanị ime ya mgbe ohere dabara.
theological_decisions:
- issue: Ndị ἅγιοι okwu a na-ezo aka na ha
  choice: ndị niile kwere ekwe, ndị Chineke doro nsọ
  alternative: ndị nsọ pụrụ iche n’echiche ụka nke oge e mesịrị
  rationale: N’akwụkwọ Pọl, “ndị nsọ” bụ aha a na-akpọ ndị Kraịst n’ozuzu ha; nsụgharị ahụ na-echekwa aha ahụ n’enweghị itinye echiche nke oge e mesịrị.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugbu a ma dị ugwu. E ji usoro ndụmọdụ na-aga n’ihu kwekọọ na participle abụọ nke Grik; “na-agbasi mbọ ike” na-eme ka ike dị na διώκοντες pụta ìhè.
