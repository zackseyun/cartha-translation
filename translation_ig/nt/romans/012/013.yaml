    issue: “Na-ekekọrịta mkpa nke ndị nsọ” is semantically ambiguous and may suggest sharing/distributing the saints’ needs.
    rationale: κοινωνοῦντες ταῖς χρείαις means sharing in, contributing toward, or participating in meeting their needs. “Na-esonyere n’ịgbo mkpa” expresses this relation naturally in Igbo.
