  to: Na-esonyere n’ịgbo mkpa ndị nsọ[a], na-agbasi mbọ ike ile ndị ọbịa ọbịa[b].
  rationale: The first participial phrase is revised to remove an avoidable ambiguity and to represent κοινωνέω with the dative of needs as active participation in meeting those needs. The hospitality clause is retained, with a slightly sharpened footnote that preserves the literal and outward-facing sense of φιλοξενία.
