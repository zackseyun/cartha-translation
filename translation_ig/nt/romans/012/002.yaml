- from: Unu ekwela ka oge a[a] kpụzie unu n’ụdị ya; kama, ka e mee ka unu gbanwee site n’ime ka uche unu dị ọhụrụ, ka unu wee nwee ike ịmata[b] ihe bụ́ uche Chineke—ihe dị mma, ihe na-atọ ya ụtọ[c], na ihe zuru oke.
  to: Unu ekwela ka oge a[a] kpụzie unu n’ụdị ya; kama, ka a gbanwee unu site n’ime ka uche unu dị ọhụrụ, ka unu wee nwee ike ịchọpụta[b] ihe bụ uche Chineke—ihe dị mma, ihe na-atọ ya ụtọ[c], na ihe zuru oke.
