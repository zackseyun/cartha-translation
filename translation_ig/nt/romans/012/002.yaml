id: ROM.12.2
reference: Romans 12:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: ig
  text: Unu ekwela ka oge a[a] kpụzie unu n’ụdị ya; kama, ka a gbanwee unu site n’ime ka uche unu dị ọhụrụ, ka unu wee nwee ike ịchọpụta[b] ihe bụ uche Chineke—ihe dị mma, ihe na-atọ ya ụtọ[c], na ihe zuru oke.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ: “ụwa a.” Okwu Grik αἰών pụtara n’ụzọ ziri ezi karị “oge,” ya bụ, oge ma ọ bụ usoro dị ugbu a.'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “ịnwale ma kwado.” Okwu Grik ahụ nwere ike ịgụnye ma inyocha ihe ma ịmata na ọ bụ ihe a kwadoro.'
    reason: lexical_alternative
  - marker: c
    text: “Ihe na-atọ ya ụtọ” pụtara ihe na-atọ Chineke ụtọ; a pụkwara ịsụgharị ya “ihe a na-anabata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: ka oge a kpụzie unu n’ụdị ya
  rationale: Nke a na-egosipụta ịkpụ mmadụ ka o yie ụkpụrụ dị n’èzí, ma na-edobe ọdịiche ya na mgbanwe miri emi nke μεταμορφοῦσθε.
- source_word: αἰῶνι τούτῳ
  choice: oge a
  rationale: αἰών na-ezo aka n’oge ma ọ bụ usoro dị ugbu a, ọ bụghị ụwa e kere eke n’onwe ya; ndetu ala na-enye ‘ụwa a’ dịka ụzọ ọzọ.
- source_word: μεταμορφοῦσθε
  choice: ka e mee ka unu gbanwee
  rationale: Ụdị a na-egosipụta mgbanwe miri emi n’ọnọdụ mmadụ ma na-echekwa ike nke passive imperative Grik.
- source_word: ἀνακαινώσει τοῦ νοός
  choice: site n’ime ka uche unu dị ọhụrụ
  rationale: Akpaokwu a na-ewere dative dị ka ụzọ mgbanwe ahụ si eme, ma ‘uche unu’ na-egosipụta ikike iche echiche na ịmata ihe ziri ezi.
- source_word: δοκιμάζειν
  choice: ịmata
  rationale: N’ebe a, okwu ahụ gụnyere inyocha wee mata ihe a kwadoro; ‘ịmata’ bụ Igbo dị mfe, ebe ndetu ala na-echekwa echiche nke ịnwale na ịkwado.
- source_word: εὐάρεστον
  choice: ihe na-atọ ya ụtọ
  rationale: Nnọchiaha ‘ya’ na-eme ka Igbo doo anya na ihe a na-ekwu bụ ihe na-atọ Chineke ụtọ, dịka ihe gbara ya gburugburu na-egosi.
- source_word: τέλειον
  choice: ihe zuru oke
  rationale: Nke a na-edobe echiche nke izu oke ma ọ bụ ịbụ ihe na-enweghị ihe kọrọ ya n’ime usoro nkọwa atọ ahụ.
theological_decisions:
- issue: Ihe αἰών pụtara n’ọdịiche omume a
  choice: oge a
  alternative: ụwa a
  rationale: ‘Oge a’ na-echekwa usoro echiche Pọl banyere oge na usoro dị ugbu a n’enweghị ime ka ọ bụrụ ịjụ ụwa e kere eke.
- issue: Ike δοκιμάζειν banyere uche Chineke
  choice: ịmata
  alternative: ịnwale ma kwado
  rationale: Nke a anaghị egosi na mmadụ na-ekpe uche Chineke ikpe; kama, uche e mere ọhụrụ na-enyocha ma mata ihe uche Chineke bụ. Ndetu ala na-echekwa obosara okwu Grik ahụ.
- issue: Onye εὐάρεστον na-atọ ụtọ
  choice: ihe na-atọ ya ụtọ
  alternative: ihe a na-anabata
  rationale: Ihe gbara okwu ahụ gburugburu na-akwado na uche Chineke bụ ihe na-atọ Chineke ụtọ, ma a na-echekwa ụzọ ọzọ n’ala peeji n’ihi na adjective ahụ enweghị onye e kwuru kpọmkwem n’ahịrịokwu Grik.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘Unu ekwela ka…’ maka iwu mgbochi nye ọtụtụ mmadụ, ebe passive ‘ka e mee ka unu gbanwee’ na-echekwa ụdị Grik. E tinyere akara ndetu [a], [b], na [c] n’ebe okwu ha na-akọwa dị.
