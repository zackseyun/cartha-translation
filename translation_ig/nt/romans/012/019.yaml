id: ROM.12.19
reference: Romans 12:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: ig
  text: 'Unu abọkwala onwe unu ọbọ, ndị m hụrụ n’anya, kama nyenụ iwe ahụ ohere[a], n’ihi na e dere, sị: “Ịbọ ọbọ bụ nke m; m ga-akwụghachi,” ka Onyenwe anyị kwuru.


    [a] A pụkwara ịsụgharị ya, “hapụnụ ohere maka iwe ahụ.” Dị ka okwu e hotara n’azụ ya si gosi, o yikarịrị ka “iwe ahụ” ọ bụ iwe Chineke.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “hapụnụ ohere maka iwe ahụ.” Dị ka okwu e hotara n’azụ ya si gosi, o yikarịrị ka “iwe ahụ” ọ bụ iwe Chineke.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: Unu abọla onwe unu ọbọ
  rationale: 'Nke a na-egosipụta iwu ahụ na-adịghị mma, ma na-echekwa echiche reflexive nke ἑαυτούς: ha agaghị eji aka ha bọọ onwe ha ọbọ.'
- source_word: ἀγαπητοί
  choice: ndị m hụrụ n’anya
  rationale: Ọ bụ okwu ịkpọ ndị a na-agwa okwu n’ụzọ ịhụnanya; nsụgharị a bụ Igbo nkịtị, na-ekpo ọkụ, ma dịkwa ùgwù.
- source_word: ἀλλὰ δότε τόπον
  choice: kama nyenụ ... ohere
  rationale: Ọ na-echekwa ihe atụ dị n’okwu Grik ahụ, nke pụtara inye ma ọ bụ hapụ ohere.
- source_word: τῇ ὀργῇ
  choice: iwe ahụ
  rationale: Edemede ahụ ekwughị kpọmkwem ‘iwe Chineke.’ ‘Iwe ahụ’ na-echekwa mkpụmkpụ na ntakịrị mgbagwoju anya dị na Grik, ebe nkọwa ala peeji na-egosi ihe gbara ya gburugburu.
- source_word: γέγραπται γάρ
  choice: n’ihi na e dere, sị
  rationale: Nke a bụ ụzọ Igbo doro anya na nke a na-ejikarị ewebata ihe e dere n’Akwụkwọ Nsọ.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: Ịbọ ọbọ bụ nke m
  rationale: Ọ na-egosipụta na ikike ịbọ ọbọ bụ nke Onyenwe anyị, ma na-anọgide nso n’usoro na ike okwu Grik.
- source_word: ἐγὼ ἀνταποδώσω
  choice: m ga-akwụghachi
  rationale: ‘Ịkwụghachi’ na-egosipụta inyeghachi ihe kwesịrị ekwesị n’ọnọdụ ikpe, ma bụrụ okwu Igbo dị mkpụmkpụ ma doo anya.
- source_word: λέγει κύριος
  choice: ka Onyenwe anyị kwuru
  rationale: Nke a bụ usoro Igbo sitere n’okike maka okwu onye kwuru ya; ‘Onyenwe anyị’ bụ nsụgharị kwesịrị ekwesị nke κύριος n’ebe a.
theological_decisions:
- issue: Onye iwe dị na τῇ ὀργῇ bụ nke ya
  choice: E debere ya dịka ‘iwe ahụ,’ ebe nkọwa ala peeji na-ekwu na o yikarịrị ka ọ bụ iwe Chineke.
  alternative: Ikwupụta ya ozugbo dịka ‘iwe Chineke,’ ma ọ bụ ịghọta ya dịka iwe mmadụ n’ozuzu.
  rationale: Ihe e hotara site na Diuterọnọmi 32:35 na-egosi na Chineke bụ onye nwere ikike ikpe na ịbọ ọbọ. Ma ebe Grik na-ekwu naanị ‘iwe ahụ,’ itinye ‘Chineke’ n’ahịrị isi ga-ewepụ mgbagwoju anya nke isi mmalite ahụ hapụrụ.
- issue: Ihe ἐγὼ ἀνταποδώσω pụtara n’ọnọdụ ikpe Chineke
  choice: m ga-akwụghachi
  alternative: m ga-enye onye ọ bụla ihe ruuru ya
  rationale: Nhọrọ bụ isi na-echekwa okwu ikpe ahụ n’enweghị ịkọwa kpọmkwem ụdị ụgwọ a ga-akwụ; nkọwa ala peeji na-eme ka echiche ya doo anya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. ‘Ndị m hụrụ n’anya’ na-eburu mmetụta ịhụnanya nke vocative ahụ; ‘nyenụ iwe ahụ ohere’ na-echekwa ihe atụ nke Grik; a zere ịgbakwunye ‘Chineke’ n’ahịrị isi ka e wee ghara idozi ihe isi mmalite ahụ hapụrụ ntakịrị mgbagwoju anya.
