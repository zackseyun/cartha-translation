  to: 'Unu abọkwala onwe unu ọbọ, ndị m hụrụ n’anya, kama nyenụ iwe ahụ ohere[a], n’ihi na e dere, sị: “Ịbọ ọbọ bụ nke m; m ga-akwụghachi,” ka Onyenwe anyị kwuru.


    [a] A pụkwara ịsụgharị ya, “hapụnụ ohere maka iwe ahụ.” Dị ka okwu e hotara n’azụ ya si gosi, o yikarịrị ka “iwe ahụ” ọ bụ iwe Chineke.'
  rationale: The revision retains the source-faithful main rendering and its deliberate ambiguity concerning wrath. It uses the more natural prohibitive “abọkwala” and removes footnote b because it introduces details not present in ἐγὼ ἀνταποδώσω. Footnote a remains, since it supplies a legitimate lexical alternative and marks the contextual likelihood of divine wrath without making it explicit in the verse.
