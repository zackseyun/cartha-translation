- from: 'Unu abọla onwe unu ọbọ, ndị m hụrụ n’anya, kama nyenụ iwe ahụ ohere[a], n’ihi na e dere, sị: “Ịbọ ọbọ bụ nke m; m ga-akwụghachi[b],” ka Onyenwe anyị kwuru.


