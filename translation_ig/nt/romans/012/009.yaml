  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: ig
  text: Ka ịhụnanya ghara ịbụ nke ihu abụọ.[a] Kpọọnụ ihe ọjọọ asị nke ukwuu; raparakwanụ n’ihe ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, “Ka ịhụnanya bụrụ nke ezi obi.” N’asụsụ Grik, n’ụzọ nkịtị: “Ịhụnanya na-enweghị ihu abụọ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: ịhụnanya
  rationale: “Ịhụnanya” bụ okwu Igbo nkịtị ma doo anya maka ἀγάπη, ma na-eburu ike omume nke okwu ahụ n’enweghị ịgbakwụnye echiche pụrụ iche.
- source_word: ἀνυπόκριτος
  choice: ghara ịbụ nke ihu abụọ
  rationale: Nke a na-echekwa echiche doro anya nke ihe na-abụghị omume ihu abụọ ma ọ bụ ihe e mere ka ọ dị ka eziokwu. E tinyere “Ka ... ghara ịbụ” iji mee ka nkebi ahịrịokwu Grik na-enweghị ngwaa bụrụ ndụmọdụ sitere n’iwu n’Igbo.
- source_word: ἀποστυγοῦντες
  choice: kpọọnụ ... asị nke ukwuu
  rationale: Ngwaa a na-egosi ịkpọ ihe asị n’ụzọ siri ike. Nkebiokwu a bụ Igbo doro anya ma na-echekwa ịdị ike nke okwu Grik; a sụgharịrị participle ahụ dị ka iwu n’ihi ọnọdụ ndụmọdụ nke akụkụ a.
- source_word: τὸ πονηρόν
  choice: ihe ọjọọ
  rationale: Adjective neuter nke nwere article na-arụ ọrụ dị ka aha, na-ezo aka n’ihe ọ bụla dị njọ n’omume. “Ihe ọjọọ” bụ ụzọ Igbo dị mfe ma sara mbara.
- source_word: κολλώμενοι
  choice: raparakwanụ n’
  rationale: “Ịrapara n’ihe” na-egosi ijidesi ya ike na ịnọgide na ya. “-kwanụ” na-egosi njikọ ya na ndụmọdụ gara aga, ebe plural imperative na-adabara ndị a na-agwa okwu.
- source_word: τῷ ἀγαθῷ
  choice: ihe ọma
  rationale: Nke a na-echekwa usoro ntụnyere ya na “ihe ọjọọ” ma na-egosi ihe dị mma n’ụzọ sara mbara.
theological_decisions:
- issue: Ike nke nkebi ahịrịokwu na-enweghị ngwaa na participles n’usoro ndụmọdụ
  choice: 'Sụgharịa amaokwu ahụ dị ka usoro ndụmọdụ sitere n’iwu: “Ka ịhụnanya ... Kpọọnụ ... raparakwanụ ...”'
  alternative: 'Nsụgharị nke na-agbasochi ọdịdị okwu anya karịa: “Ịhụnanya na-enweghị ihu abụọ, na-akpọ ihe ọjọọ asị, na-arapara n’ihe ọma.”'
  rationale: Ọ bụ ezie na Grik malitere na nkebi ahịrịokwu aha ma jiri participles gaa n’ihu, Rom 12 nọ n’usoro ndụmọdụ. Iji ụdị iwu n’Igbo na-eme ka ebumnuche okwu ahụ doo anya n’agbanweghị ihe ọ pụtara.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. E ji ụdị iwu ọtụtụ mmadụ (“Kpọọnụ,” “raparakwanụ”) n’ihi na Pọl na-agwa ọgbakọ niile okwu. Akara ntụaka [a] pụtara ozugbo n’isiokwu.
