  terminology: “Ịhụnanya,” “ihu abụọ,” “ihe ọjọọ,” and “ihe ọma” are suitable and established Standard Igbo renderings. The alternative “nke ezi obi” is an acceptable smoother rendering of sincerity, while the main text rightly retains the more concrete imagery of hypocrisy.
