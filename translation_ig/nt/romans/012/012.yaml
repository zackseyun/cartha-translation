translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe ma dị ùgwù. A tụgharịrị participles atọ ahụ dị ka ndụmọdụ kpọmkwem iji mee ka usoro ahụ bụrụ nke okike n’Igbo, ma debe usoro nke akụkụ atọ. E debere akara ala peeji abụọ n’isiokwu ahụ dịka [a] na [b].
