translation:
  language: ig
  text: Na-aṅụrịnụ ọṅụ n’olileanya; na-enwe ndidi na mkpagbu[b]; na-anọgidesinụ n’ekpere[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “na-arara onwe unu nye ekpere,” iji mesie ịdị uchu na ntinye onwe n’ekpere ike, ọ bụghị naanị ịnọgide na ya.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị “mkpagbu” dị ka “ahụhụ siri ike”; okwu Grik ahụ na-egosi nrụgide, nsogbu, ma ọ bụ ahụhụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: n’ihi olileanya unu
  rationale: Dative ahụ na-egosi ihe ọṅụ ahụ dabere na ya ma ọ bụ ihe kpatara ya. ‘N’ihi olileanya unu’ bụ Igbo dị mfe ma na-edebe echiche nke ịṅụrị ọṅụ n’olileanya; ‘unu’ na-eme ka okwu ahụ bụrụ ihe a na-agwa ndị na-ege ntị n'ụzọ nkịtị.
- source_word: χαίροντες
  choice: na-aṅụrịtanụ ọṅụ
  rationale: Ọ bụ participle nke na-arụ ọrụ dị ka ndụmọdụ n’usoro a. Imperative Igbo a na-egosipụta omume na-aga n’ihu ma na-ada nke ọma n’asụsụ Igbo.
- source_word: θλίψει
  choice: na mkpagbu
  rationale: ‘Mkpagbu’ na-ekpuchi nrụgide, ahụhụ, na nsogbu siri ike nke θλῖψις na-egosi, na-enweghị ime ka ọ bụrụ naanị mwute ime obi.
- source_word: ὑπομένοντες
  choice: nọgidesienụ ike
  rationale: Nkebi a na-egosi ịnọgide guzosie ike n’okpuru ahụhụ, ọ bụghị naanị ichere nwayọọ. Ọ bụ okwu Igbo doro anya ma dị ebube.
- source_word: προσευχῇ
  choice: n’ekpere
  rationale: ‘Ekpere’ bụ okwu Igbo nkịtị maka προσευχή; article Grik adịghị mkpa ka a sụgharịa ya iche ebe a.
- source_word: προσκαρτεροῦντες
  choice: nọgidesienụ ike
  rationale: N’ebe ekpere dị, προσκαρτερέω pụtara ịnọgide na-eme ya n’atụghị azụ ma ọ bụ itinye onwe mmadụ na ya mgbe niile. Okwu a na-edebe isi echiche nke nkwụsi ike.
