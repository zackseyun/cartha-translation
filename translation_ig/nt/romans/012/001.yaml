id: ROM.12.1
reference: Romans 12:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: ig
  text: Ya mere, ụmụnna m[a], ana m arịọ unu nke ukwuu, n’ihi ebere Chineke, ka unu nyefee ahụ unu dịka àjà dị ndụ, dị nsọ, nke na-atọ Chineke ụtọ—ya bụ, ofufe unu nke ezi uche.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Okwu Grik ahụ pụtara n’ụzọ nkịtị “ụmụnne nwoke,” ma a na-ejikarị ụdị nwoke a akpọ ìgwè nwere ma ndị nwoke ma ndị nwanyị.
    reason: alternative_reading
  - marker: b
    text: A pụkwara ịsụgharị ya “ofufe ime mmụọ unu” ma ọ bụ “ọrụ ofufe unu nke ezi uche.” Okwu Grik ahụ nwere ike ịpụta ihe e ji ezi uche mee, ihe dabara adaba, ma ọ bụ ihe ime mmụọ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: ana m arịọ unu nke ukwuu
  rationale: Nke a na-egosi arịrịọ siri ike na agbamume Pọl na-enye, n’asụsụ Igbo nke oge a, n’enweghị ụda okwu ochie.
- source_word: οὖν
  choice: Ya mere
  rationale: Ọ na-ejikọta agbamume a dịka ihe si n’arụmụka dị na Ndị Rom 1–11 pụta.
- source_word: ἀδελφοί
  choice: ụmụnna m
  rationale: ‘Ụmụnna’ bụ okwu Igbo sitere n’echiche nwanne nke pụrụ ịkpọkọta ndị nwoke na ndị nwanyị; ‘m’ na-eme ka oku ahụ bụrụ nke e ji ịhụnanya kwuo.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: n’ihi obi ebere dị iche iche nke Chineke
  rationale: ‘N’ihi’ na-egosi na ebere Chineke bụ ntọala arịrịọ ahụ; ‘dị iche iche’ na-echekwa ụdị ọtụtụ nke οἰκτιρμῶν n’ụzọ Igbo doro anya.
- source_word: παραστῆσαι
  choice: ka unu chee ... n’ihu ya
  rationale: ‘Chee n’ihu’ na-egosi iweta ma nyefee ihe n’ihu Chineke, ma kwekọọ n’onyonyo àjà; ‘ya’ na-eme ka onye a na-eche ya n’ihu doo anya site n’okwu gbara ya gburugburu.
- source_word: τὰ σώματα ὑμῶν
  choice: ahụ unu
  rationale: A nọgidere n’okwu doro anya bụ ‘ahụ,’ kama ịgbanwe ya ka ọ bụrụ naanị ‘onwe unu.’
- source_word: θυσίαν ζῶσαν
  choice: dịka àjà dị ndụ
  rationale: Nke a na-echekwa ihe atụ àjà na ihe yiri mgbagwoju anya dị n’àjà nke dị ndụ.
- source_word: ἁγίαν
  choice: dị nsọ
  rationale: Ọ na-egosi àjà e kewapụrụ nye Chineke, ma bụrụkwa okwu nkịtị siri ike n’Igbo Akwụkwọ Nsọ.
- source_word: εὐάρεστον τῷ θεῷ
  choice: nke na-atọ Chineke ụtọ
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si kwuo ihe Chineke na-anabata ma nwee mmasị na ya, n’enweghị ime ka ọ daa ka nnabata pere mpe.
- source_word: λογικὴν
  choice: kwesịrị ekwesị
  rationale: N’ebe a ọ na-enye echiche nke ofufe dabara adaba ma bụrụ nke ezi uche kwadoro; a na-edebe nghọta ndị ọzọ na nkọwa ala peeji.
- source_word: λατρείαν
  choice: ofufe
  rationale: ‘Ofufe’ na-egosi ọrụ a na-enye Chineke, ma onyonyo àjà dị n’ahịrịokwu ahụ na-edebekwa mmetụta nke ọrụ nsọ.
theological_decisions:
- issue: Otu e si sụgharịa ἀδελφοί mgbe o yiri ka ọ na-agwa ọgbakọ ndị nwoke na ndị nwanyị
  choice: ụmụnna m
  alternative: ụmụnne m ndị nwoke; ụmụnna nwoke na nwanyị
  rationale: N’Igbo, ‘ụmụnna’ pụrụ ịbụ oku gụnyere obodo ndị kwere ekwe dum, ọ bụ ezie na okwu Grik ahụ bụ ụdị nwoke ọtụtụ. Nkọwa ala peeji na-eme ka ọdịdị Grik ahụ doo anya n’enweghị iwepụ ndị nwanyị n’echiche ndị a na-agwa.
- issue: Otu e si sụgharịa λογικὴν λατρείαν
  choice: ofufe unu kwesịrị ekwesị
  alternative: ofufe ime mmụọ unu; ọrụ ofufe unu nke ezi uche
  rationale: Okwu Grik ahụ nwere ike ịpụta nke ezi uche, nke dabara adaba, ma ọ bụ nke ime mmụọ. Isiokwu ahụ na-eji okwu Igbo sitere n’okike nke na-adịghị ekpebi esemokwu ahụ kpamkpam, ebe nkọwa ala peeji na-edebe nhọrọ ndị ọzọ.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A zere okwu ụka pụrụ iche. E debere onyonyo àjà, ahụ, ịdị nsọ, na ihe na-atọ Chineke ụtọ, ma nyefee mgbagwoju anya nke λογικός na nkọwa ala peeji.
