revisions:
- from: Ya mere, ụmụnna m[a], ana m arịọ unu nke ukwuu, n’ihi obi ebere dị iche iche nke Chineke, ka unu chee ahụ unu n’ihu ya dịka àjà dị ndụ, dị nsọ, nke na-atọ Chineke ụtọ—nke a bụ ofufe unu kwesịrị ekwesị.[b]
  to: Ya mere, ụmụnna m[a], ana m arịọ unu nke ukwuu, n’ihi ebere Chineke, ka unu nyefee ahụ unu dịka àjà dị ndụ, dị nsọ, nke na-atọ Chineke ụtọ—ya bụ, ofufe unu nke ezi uche.[b]
  rationale: The revision corrects the central action of the verse by using “nyefee” for presenting the bodies as an offering. It removes the unwarranted “different kinds” implication from the rendering of God’s mercies and gives λογική a more source-near expression in the main text. The existing footnotes remain accurate, properly anchored, and preserve the stated lexical ambiguity.
  reviewer_model: gpt-5.6-terra
