revisions:
- from: Unu adịla umengwụ n’ịgba mbọ; ka unu na-anụ ọkụ n’ime mmụọ[a]; na-ejere Onyenwe anyị ozi.
  to: Unu adịla umengwụ n’ịgba mbọ; ka mmụọ unu dị ọkụ[a]; na-ejerenụ Onyenwe anyị ozi.
  rationale: The revision keeps the source’s compact three-part exhortation, improves the idiomatic Igbo expression of fervency, and makes the final clause explicitly exhortatory. The footnote now presents the Holy-Spirit reading as an alternative construal rather than adding a causative theological interpretation absent from the Greek.
  reviewer_model: gpt-5.6-terra
