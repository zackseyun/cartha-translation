  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: ig
  text: Unu adịla umengwụ n’ịgba mbọ; ka mmụọ unu dị ọkụ[a]; na-ejerenụ Onyenwe anyị ozi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu na-adị ọkụ n’ime Mmụọ Nsọ,” ma ọ bụrụ na “mmụọ” n’ebe a na-ezo aka na Mmụọ Nsọ kama mmụọ onye kwere ekwe.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: n’ịgba mbọ
  rationale: Nkebi a na-egosi ịdị uchu na itinye obi n’ihe a na-eme. “Ịgba mbọ” bụ okwu Igbo doro anya nke na-adaba nke ọma n’ihe megidere “umengwụ,” ma na-ezere okwu ga-apụta nanị dịka mmetụta ịnụ ọkụ n’obi.
- source_word: ὀκνηροί
  choice: umengwụ
  rationale: “Umengwụ” na-egosi ịdị arọ ma ọ bụ ịla azụ n’ọrụ, nke bụ ihe okwu Grik a pụtara n’ebe a.
- source_word: πνεύματι
  choice: n’ime mmụọ
  rationale: Nsụgharị a na-edobe okwu “mmụọ” n’enweghị ịkọwa ya kpamkpam dịka mmụọ mmadụ ma ọ bụ Mmụọ Nsọ. N’ahịrị a, mmụọ mmadụ ma ọ bụ ọnọdụ ime obi ya yiri ka ọ bụ nghọta kacha nso, ma ihe ọzọ ka nwere ike ịdị.
- source_word: ζέοντες
  choice: na-anụ ọkụ
  rationale: Okwu Grik ahụ pụtara n'ụzọ nkịtị “ịna-esi ọkụ.” “Ịnụ ọkụ” na-edobe ihe atụ ahụ ma na-egosi ịnụ ọkụ n’obi na ịdị uchu n’asụsụ Igbo dị ndụ.
- source_word: κυρίῳ
  choice: Onyenwe anyị
  rationale: Nke a bụ ụzọ Igbo a na-ejikarị asụgharị κύριος dịka aha nsọpụrụ. N’akwụkwọ Pọl, ọ ga-abụ na ọ na-ezo aka n’Onyenwe anyị Jizọs, ma nsụgharị ahụ adịghị etinye nkọwa ahụ n’amaokwu.
- source_word: δουλεύοντες
  choice: na-ejere … ozi
  rationale: Ọ bụ ezie na okwu a sitere n’echiche ịbụ ohu, “ijere ozi” na-egosipụta nrubeisi na nraranye a na-akpọ ndị kwere ekwe ka ha nwee n’ebe Onyenwe anyị nọ, n’Igbo dị mfe ma kwụ ọtọ.
theological_decisions:
- issue: Ihe πνεύματι na-ezo aka na τῷ πνεύματι ζέοντες
  choice: mmụọ mmadụ ma ọ bụ ọnọdụ ime obi ya
  alternative: Mmụọ Nsọ
  rationale: Usoro ndụmọdụ ndị dị n’amaokwu a na-akwado nghọta nke mmụọ mmadụ na-anụ ọkụ n’obi. Ma n’ihi na okwu Grik ahụ enweghị ihe na-ekpebi nke a kpamkpam, e debere nghọta nke Mmụọ Nsọ n’okpuru ala kama idozi esemokwu ahụ n’ime amaokwu.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta mee ihe. E debere usoro ndụmọdụ atọ dị n’amaokwu Grik ahụ, tinyere ihe atụ nke ọkụ n’okwu ζέοντες. E tinyere akara [a] ozugbo n’akụkụ “mmụọ,” bụ ebe ihe mgbagwoju anya dị.
