review_pass:
  verdict: revise
  source_fidelity: The draft rightly renders the three coordinated exhortations and represents σπουδῇ as effort/diligence, ὀκνηροί as laziness, and δουλεύοντες as serving. However, “na-ejere Onyenwe anyị ozi” is formally indicative without a clear imperative subject, whereas the Greek participle is exhortatory. The footnote’s wording adds the idea that the Holy Spirit causes the fervor, which is not stated by the Greek alternative.
  naturalness: “Unu adịla umengwụ n’ịgba mbọ” is clear Standard Igbo. “Ka mmụọ unu dị ọkụ” is a more idiomatic and concise way to convey fervency than “ka unu na-anụ ọkụ n’ime mmụọ.” “Na-ejerenụ Onyenwe anyị ozi” supplies a natural plural exhortation parallel to the preceding clauses.
  terminology: “Onyenwe anyị” and “ijere … ozi” are appropriate established Christian-register terms. The revised footnote preserves the possible reference to the Holy Spirit without making a doctrinally stronger, causative claim.
  issues:
  - severity: medium
    issue: The final clause is not clearly exhortatory in Igbo.
    rationale: “na-ejere Onyenwe anyị ozi” can read as an indicative statement (“[they/you] are serving”). The Greek δουλεύοντες functions with the preceding participles as an exhortation; “Na-ejerenụ” makes this clear.
  - severity: medium
    issue: The footnote introduces an unstated causative meaning.
    rationale: “ka Mmụọ Nsọ mee ka unu na-anụ ọkụ n’obi” means that the Holy Spirit makes the readers fervent. The Greek simply permits reading τῷ πνεύματι as “in/by the Holy Spirit”; it does not explicitly express that causation.
  - severity: low
    issue: The main rendering of πνεύματι is somewhat less idiomatic than necessary.
    rationale: “n’ime mmụọ” is understandable but can suggest a spiritual sphere. “Ka mmụọ unu dị ọkụ” is idiomatic Igbo and faithfully expresses the likely human-spirit reading, while the footnote records the Holy-Spirit alternative.
  revised_text: Unu adịla umengwụ n’ịgba mbọ; ka mmụọ unu dị ọkụ[a]; na-ejerenụ Onyenwe anyị ozi.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ka unu na-adị ọkụ n’ime Mmụọ Nsọ,” ma ọ bụrụ na “mmụọ” n’ebe a na-ezo aka na Mmụọ Nsọ kama mmụọ onye kwere ekwe.
    reason: alternative_reading
  revision_rationale: The revision keeps the source’s compact three-part exhortation, improves the idiomatic Igbo expression of fervency, and makes the final clause explicitly exhortatory. The footnote now presents the Holy-Spirit reading as an alternative construal rather than adding a causative theological interpretation absent from the Greek.
