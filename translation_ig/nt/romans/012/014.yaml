review_pass:
  verdict: revise
  source_fidelity: The draft correctly understands τοὺς διώκοντας as hostile persecutors in this context and retains the emphatic repetition of εὐλογεῖτε. However, “akọchala ha ọnụ” is not the most secure Standard Igbo rendering of the present prohibition μὴ καταρᾶσθε; the established, natural idiom for ‘curse’ is “ịbụ mmadụ ọnụ,” and the negative imperative should not imply a completed or prior action.
  naturalness: “Gọzienụ” explicitly and naturally marks the plural imperative. “Unu abụkwala ọnụ” is idiomatic Standard Igbo and preserves the concise contrast between blessing and cursing. The supplied object “ha” in the second clause is unnecessary, since Greek does not repeat an object and Igbo idiom is smoother without it.
  terminology: Use “gọzie”/“gọzienụ” for εὐλογέω and “ịbụ ọnụ” for καταράομαι. “Ndị na-akpagbu unu” appropriately conveys persecutors without forcing a doctrinal interpretation. The footnote continues to preserve the broader lexical alternative, ‘those pursuing you.’
  issues:
  - severity: medium
    issue: The phrase “unu akọchala ha ọnụ” is an insecure and potentially aspectually misleading rendering of μὴ καταρᾶσθε.
    rationale: The Greek is a present-tense negative imperative, ‘do not curse.’ In Standard Igbo, “abụkwala ọnụ” is the natural prohibitive form of the idiom ‘curse,’ whereas “akọchala” can suggest completion or cessation and is less idiomatic here.
  - severity: low
    issue: “Gọzie” does not overtly mark the plural addressees.
    rationale: Greek εὐλογεῖτε is plural. Although context and “unu” later indicate plurality, “Gọzienụ” is a natural Standard Igbo plural imperative and better preserves the source form.
  - severity: low
    issue: The footnote calls διώκοντας simply a Greek verb.
    rationale: It is specifically a substantival participle. Recasting this as “okwu Grik a” avoids an unnecessary grammatical imprecision while retaining the lexical note.
  revised_text: Gọzienụ ndị na-akpagbu unu[a]; gọzienụ, unu abụkwala ọnụ.
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-achụso unu.” Okwu Grik a nwere ike ịpụta “ịchụso,” ma n’ebe a o yikarịrị ka ọ na-ekwu maka mkpagbu sitere n’aka ndị iro.
    reason: lexical_alternative
