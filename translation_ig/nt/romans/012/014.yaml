revisions:
- from: Gọzie ndị na-akpagbu unu[a]; gọzie ha, unu akọchala ha ọnụ.
  to: Gọzienụ ndị na-akpagbu unu[a]; gọzienụ, unu abụkwala ọnụ.
  rationale: The revision preserves the source’s two repeated plural commands, its concise coordination, and its prohibition against cursing. It replaces a less secure expression with the standard Igbo idiom “ịbụ ọnụ,” using the natural negative imperative “abụkwala.” The lexical-alternative footnote is retained and slightly refined without overstating the contextual judgment.
  reviewer_model: gpt-5.6-terra
