  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: ig
  text: Gọzienụ ndị na-akpagbu unu[a]; gọzienụ, unu abụkwala ọnụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị na-achụso unu.” Okwu Grik a nwere ike ịpụta “ịchụso,” ma n’ebe a o yikarịrị ka ọ na-ekwu maka mkpagbu sitere n’aka ndị iro.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Gọzie
  rationale: Ngwaa iwu a dị n’ụdị ọtụtụ. “Gọzie” bụ okwu Igbo dị mkpirikpi ma doo anya, na-egosikwa ime ma ọ bụ ikwu ihe ọma nye mmadụ. E debere nkwughachi ya iji chekwaa nkwusi okwu Pọl.
- source_word: τοὺς διώκοντας
  choice: ndị na-akpagbu unu
  rationale: Nkebi a pụtara n'ụzọ nkịtị “ndị na-achụso,” ma n’ọnọdụ a ọ na-ezo aka n’imegide mmadụ n’ụzọ ọjọọ. “Ndị na-akpagbu unu” na-enye nghọta ahụ n’Igbo eke; e tinyere “unu” n’ihi na ihe a na-eme ndị a na-agwa okwu pụtara ìhè n’ọnọdụ ahụ.
- source_word: καὶ
  choice: —
  rationale: N’Igbo, ịtụgharị njikọ a kpọmkwem dịka “na” n’etiti iwu abụọ a agaghị ada nke ọma. Semikolon na usoro okwu ndị na-esochi ya na-echekwa njikọ dị mfe na nkwusi okwu nke Grik.
- source_word: μὴ καταρᾶσθε
  choice: unu akọchala ha ọnụ
  rationale: “Ịkọ mmadụ ọnụ” bụ ụzọ Igbo doro anya ma dị eke isi kwuo ịkpọ mmadụ ihe ọjọọ ma ọ bụ ịrịọ ka ihe ọjọọ dakwasị ya. Ụdị “akọchala” na-enye iwu mgbochi nke ọma, ebe “ha” na-eme ka onye iwu ahụ metụtara doo anya.
theological_decisions:
- issue: Oke ihe διώκω pụtara n’ọnọdụ a
  choice: A sụgharịrị ya dịka mkpagbu sitere n’aka ndị iro
  alternative: ndị na-achụso unu
  rationale: Ọ bụ ezie na διώκω nwekwara ike ịpụta “ịchụso,” ojiji ya n’ọnọdụ ụkpụrụ omume Ndị Kraịst oge mbụ na ọdịiche dị n’etiti ịgọzi na ịkọ ọnụ na-akwado echiche nke mkpagbu. Ihe odide ala peeji na-echekwa ihe ọzọ okwu Grik ahụ pụrụ ịpụta.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị nsọ ma dị mfe nghọta. E ji “unu” chekwaa ụdị ọtụtụ nke iwu ahụ, ma e debere nkwughachi “Gọzie” maka nkwusi okwu.
