id: ROM.1.11
reference: Romans 1:11
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: ig
  text: N’ihi na agụụ ịhụ unu na-agụsi m ike, ka m wee nye unu[a] ụfọdụ onyinye ime mmụọ iji mee ka unu guzosie ike[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “soro unu kerịta ụfọdụ onyinye ime mmụọ.”
    reason: lexical_alternative
  - marker: b
    text: N’ụzọ nkịtị, “ka e wee mee ka unu guzosie ike.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: ọ na-agụsi m agụụ ike
  rationale: Nke a na-egosipụta ọchịchọ Pọl siri ike n’asụsụ Igbo dị ndụ ma na-agaghị ada ka okwu mgbe ochie.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka nkọwa ma ọ bụ ihe kpatara ya.
- source_word: ἰδεῖν
  choice: ịhụ
  rationale: Ọ na-agbasochi ihe ngwaa Grik pụtara anya; ọ bụ ezie na ịga leta ha dị n’uche, e tinyebeghị nkọwa ahụ n’ime okwu ahụ.
- source_word: ἵνα
  choice: ka m wee
  rationale: Ọ na-egosipụta nzube nke ọchịchọ Pọl ịhụ ha n’Igbo nkịtị.
- source_word: τι
  choice: ụfọdụ
  rationale: Ọ na-echekwa enweghị nkọwa kpọmkwem dị n’okwu Grik, n’enweghị ikwu na ọ bụ otu onyinye a kapịrị ọnụ.
- source_word: μεταδῶ
  choice: nye unu
  rationale: Ọ bụ okwu doro anya nye ndị na-agụ Igbo; ihe ọ pụtara nke ịkekọrịta ma ọ bụ inye akụkụ nke ihe ka edebere n’okpuru peeji.
- source_word: χάρισμα
  choice: onyinye
  rationale: Ọ bụ ntụgharị dị nkenke ma bụrụkwa nke a na-aghọta nke ọma, n’etinyeghị nkọwa ụka pụrụ iche.
- source_word: πνευματικὸν
  choice: ime mmụọ
  rationale: Ọ na-echekwa ohere okwu Grik nwere, ma ọ̀ bụ onyinye sitere kpọmkwem n’aka Mmụọ Nsọ ma ọ bụ uru metụtara ndụ ime mmụọ, n’akọwaghị ya karịa isi mmalite.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: iji mee ka unu guzosie ike
  rationale: Ọ na-egosipụta nzube ma na-ada nke ọma n’Igbo. E debere usoro mmeju nke Grik, ‘ka e mee ka unu guzosie ike,’ n’okpuru peeji.
theological_decisions:
- issue: Ma ‘onyinye ime mmụọ’ ọ̀ na-ekwu kpọmkwem banyere onyinye ọrụ ebube, ka ọ bụ uru ime mmụọ n’ozuzu ya
  choice: ụfọdụ onyinye ime mmụọ
  alternative: ụfọdụ onyinye nke Mmụọ Nsọ
  rationale: πνευματικὸν akọwaghị n’onwe ya na nke a ga-abụrịrị otu charisma ọrụ ebube a kapịrị ọnụ. Ya mere, e chekwara obosara na mgbagwoju anya nke okwu Grik n’etinyeghị ozizi otu ụka.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Akara [a] na [b] dị n’ederede isi n’ebe ha metụtara. A haziri [a] n’akụkụ ngwaa μεταδῶ, ebe nhọrọ okwu ahụ metụtara, kama itinye ya n’akụkụ ‘ịhụ unu.’
