id: ROM.1.19
reference: Romans 1:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: ig
  text: n’ihi na ihe a pụrụ ịmata banyere Chineke pụtara ìhè n’etiti ha[a], n’ihi na Chineke mere ka ọ pụta ìhè nye ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’ime ha.”
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: n’ihi na
  rationale: Ọ na-egosi ihe kpatara okwu bu ya ụzọ; “n’ihi na” na-enye njikọ doro anya n’Igbo.
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: ihe a pụrụ ịmata banyere Chineke
  rationale: Adjective neuter nwere article na-arụ ọrụ dị ka noun; ntụgharị a na-egosi ihe mmadụ nwere ike ịmata banyere Chineke, ma zere ime ka ọ bụrụ naanị ihe amaralarị.
- source_word: φανερόν ἐστιν
  choice: pụtara ìhè
  rationale: “Pụtara ìhè” bụ okwu Igbo dị ndụ ma doo anya, nke na-egosi na ihe ahụ apụtala n’ihu ọha ma bụrụ ihe a pụrụ ịhụ ma ọ bụ ghọta.
- source_word: ἐν αὐτοῖς
  choice: n’etiti ha
  rationale: Nke a na-egosipụta nghọta nke ọnọdụ n’etiti otu mmadụ ma ọ bụ n’ihu ha; ebe okwu Grik ahụ nwekwara ike ịpụta “n’ime ha,” e debere nke ahụ n’ala peeji.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: n’ihi na Chineke mere ka ọ pụta ìhè nye ha
  rationale: Nke a na-edobe njikọ okwu dị n’etiti φανερόν na ἐφανέρωσεν, ma na-asụkwa Igbo n’ụzọ kwesịrị ekwesị.
theological_decisions:
- issue: Ihe ἐν αὐτοῖς pụtara
  choice: n’etiti ha
  alternative: n’ime ha
  rationale: 'Nkebiokwu Grik ahụ nwere ezi nghọta abụọ: ihe ahụ nwere ike ịdị n’etiti ha ma ọ bụ n’ime ha. Isi ederede họọrọ nghọta nke ọha mmadụ, ebe ala peeji chekwara nghọta nke ime mmadụ ka a ghara idozi esemokwu ahụ n’enweghị ihe akaebe zuru ezu.'
translation_notes:
  register: Asụsụ Igbo izugbe, nke oge a, dị ùgwù ma dị mfe nghọta. E ji “pụtara ìhè” mee ka njikọ dị n’etiti adjective na verb Grik pụta nke ọma.
