  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: ig
  text: 'N’ihi na ihere ozi ọma ahụ anaghị eme m[a], n’ihi na ọ bụ ike Chineke maka nzọpụta nye onye ọ bụla kwere ekwe—nye onye Juu na mbụ, nakwa nye onye Gris.[b]


    [a] Ma ọ bụ, “oziọma.”


    [b] N’ebe a, “onye Gris” nwekwara ike ịpụta n’ụzọ sara mbara onye mba ọzọ, ya bụ, onye na-abụghị onye Juu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “oziọma.”
    reason: lexical_alternative
  - marker: b
    text: N’ebe a, “onye Gris” nwekwara ike ịpụta n’ụzọ sara mbara onye mba ọzọ, ya bụ, onye na-abụghị onye Juu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: ihere ... adịghị eme m
  rationale: This is a natural Standard Igbo idiom for not being ashamed and preserves Paul’s public lack of shame.
- source_word: εὐαγγέλιον
  choice: ozi ọma
  rationale: This transparently conveys the ordinary lexical sense ‘good news’; the familiar compact ecclesiastical form ‘oziọma’ is retained as a footnote alternative.
- source_word: δύναμις
  choice: ike
  rationale: ‘Ike’ is the direct, natural Igbo equivalent for effective power.
- source_word: εἰς σωτηρίαν
  choice: nke na-eweta nzọpụta
  rationale: 'The verbal expression is idiomatic in Igbo and preserves the result or goal expressed by εἰς: God’s power is effective toward salvation.'
- source_word: παντὶ τῷ πιστεύοντι
  choice: nye onye ọ bụla kwere ekwe
  rationale: This preserves both the distributive ‘everyone’ and the participial idea ‘who believes’ without turning it into a denominational label.
- source_word: Ἰουδαίῳ
  choice: onye Juu
  rationale: The ethnic-religious sense fits Paul’s contrast here better than a geographical rendering such as ‘onye Judia.’
- source_word: πρῶτον
  choice: na mbụ
  rationale: This preserves the concise ordering expressed by the Greek without explaining or weakening it.
- source_word: Ἕλληνι
  choice: onye Gris
  rationale: The main text retains the source text’s specific lexical form, while a footnote explains its possible broader Pauline reference to non-Jews.
- source_word: τε ... καί
  choice: nakwa
  rationale: ‘Nakwa’ naturally expresses the additive force following the stated priority of the Jew.
theological_decisions:
- issue: The scope of Ἕλληνι in ‘to the Jew first and also to the Greek’
  choice: Use ‘onye Gris’ in the main text and note its broader possible non-Jewish sense.
  alternative: Use ‘onye mba ọzọ’ (Gentile/non-Jew) directly in the main text.
  rationale: The chosen wording preserves the actual Greek lexical designation and its historical-cultural tension, while the footnote alerts readers that Pauline usage may represent Gentiles more broadly.
- issue: The force of πρῶτον
  choice: Retain ‘na mbụ’ without explanation in the verse.
  alternative: Paraphrase it as merely historical sequence or as privilege.
  rationale: The source states priority concisely but does not specify all its theological dimensions here, so the translation should not resolve that ambiguity.
translation_notes:
  register: Natural, current, dignified Standard Igbo. The clause ‘nke na-eweta nzọpụta’ avoids an awkward literal calque while retaining the goal/result force of εἰς σωτηρίαν. Repetition of ‘nye’ makes the recipients and the Jew–Greek pairing clear to ordinary readers.
