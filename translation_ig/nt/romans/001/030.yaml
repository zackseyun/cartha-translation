  variant: Standard Igbo
source:
  edition: SBLGNT
  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: ig
  text: ndị na-ekwutọ ndị ọzọ, ndị kpọrọ Chineke asị[a], ndị na-akparị mmadụ, ndị mpako, ndị na-etu ọnụ, ndị na-echepụta ihe ọjọọ, ndị na-anaghị erubere nne na nna ha isi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị Chineke kpọrọ asị.”
    reason: alternative_reading
lexical_decisions:
- source_word: καταλάλους
  choice: ndị na-ekwutọ ndị ọzọ
  rationale: Nke a na-egosi ndị na-ekwu okwu na-emebi aha ndị ọzọ; ọ bụ okwu Igbo doro anya ma na-eburu ibu omume ọjọọ dị na okwu Grik ahụ.
- source_word: θεοστυγεῖς
  choice: ndị kpọrọ Chineke asị
  rationale: A họọrọ nghọta na-arụ ọrụ, ya bụ, ndị na-akpọ Chineke asị, n’ihi na ọ dabara n’usoro omume na àgwà mmadụ ndị e depụtara ebe a. E debere nghọta nke ọzọ n’ala peeji.
- source_word: ὑβριστάς
  choice: ndị na-akparị mmadụ
  rationale: Okwu a na-egosi mpako na-enweghị ihere nke na-apụta n’ịkparị ma ọ bụ imeso ndị ọzọ ihe n’ụzọ mkparị; nsụgharị a doro ndị na-agụ Igbo anya n’etinyeghị naanị ime ihe ike n’ahụ.
- source_word: ὑπερηφάνους
  choice: ndị mpako
  rationale: “Ndị mpako” bụ okwu Igbo dị mkpirikpi ma bụrụkwa nke a na-aghọta nke ọma maka ndị na-ebuli onwe ha elu.
- source_word: ἀλαζόνας
  choice: ndị na-etu ọnụ
  rationale: Nke a na-egosipụta omume ịnya isi na ịkọwa onwe onye dịka onye karịrị ihe ọ bụ, ma na-ekewapụkwa ya n’okwu dị ya nso bụ́ “ndị mpako.”
- source_word: ἐφευρετὰς κακῶν
  choice: ndị na-echepụta ihe ọjọọ
  rationale: Nsụgharị a nọ okwu Grik nso ma na-egosi ndị na-eji uche ha echepụta ihe ọjọọ ha ga-eme.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: ndị na-anaghị erubere nne na nna ha isi
  rationale: Nke a bụ ụzọ Igbo sitere n’okike si ekwu enweghị nrubeisi nye nne na nna, ma na-edobe mmekọrịta ahụ okwu Grik kpọrọ aha.
theological_decisions:
- issue: Nghọta nke θεοστυγεῖς
  choice: 'Nghọta na-arụ ọrụ: “ndị kpọrọ Chineke asị”'
  alternative: 'Nghọta nnara: “ndị Chineke kpọrọ asị”'
  rationale: Nghọta na-arụ ọrụ dabara nke ọma n’usoro a nke na-akọ àgwà na omume ọjọọ mmadụ. Ma ebe ọ bụ na e nweela ezi esemokwu banyere ụdị okwu ahụ, e debere nghọta nnara n’ala peeji kama ikpochapụ ya.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta, mee ndepụta ahụ. E tinyere “ndị” n’ihu akụkụ nke ọ bụla iji mee ka usoro ahụ doo anya n’Igbo, ma e zere okwu ụka pụrụ iche.
