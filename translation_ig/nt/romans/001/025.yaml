revisions:
- from: Ndị a gbanwere eziokwu Chineke were ụgha dochie ya; ha sọpụrụ ma fee ihe e kere eke kama Onye kere ha, onye a na-eto ruo mgbe ebighị ebi. Amen.
  to: Ndị a gbanwere eziokwu Chineke were ụgha dochie ya; ha sọpụrụ ma fee ihe e kere eke kama Onye kere ha, onye a gọziri agọzi ruo mgbe ebighị ebi. Amen.
  rationale: Only the final doxological expression is revised, from “onye a na-eto” (“who is praised”) to “onye a gọziri agọzi” (“who is blessed”), to reflect εὐλογητός directly. The remaining wording is retained because it is faithful and natural.
