id: ROM.1.25
reference: Romans 1:25
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: ig
  text: Ndị a gbanwere eziokwu Chineke were ụgha dochie ya; ha sọpụrụ ma fee ihe e kere eke kama Onye kere ha, onye a gọziri agọzi ruo mgbe ebighị ebi. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν ... ἐν
  choice: gbanwere ... were ... dochie ya
  rationale: Na-egosipụta echiche nke ịhapụ otu ihe were ihe ọzọ n'ọnọdụ ya n'Igbo dị mfe ma doo anya.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: eziokwu Chineke
  rationale: Genitive ahụ nwere ike ịpụta eziokwu banyere Chineke ma ọ bụ eziokwu nke sitere n'aka Chineke; nsụgharị a na-edobe nghọta sara mbara ahụ.
- source_word: τῷ ψεύδει
  choice: ụgha
  rationale: Artikụl Grik ahụ nwere ike ime ka okwu ahụ bụrụ 'ụgha ahụ,' ma n'Igbo 'ụgha' bụ ụzọ ebumpụta ụwa nke na-adịghị amanye otu nkọwa kpọmkwem.
- source_word: ἐσεβάσθησαν
  choice: sọpụrụ
  rationale: Na-egosipụta nsọpụrụ okpukpe ma na-ekewa ya na λατρεύω, nke e sụgharịrị 'fee.'
- source_word: ἐλάτρευσαν
  choice: fee
  rationale: N'ọnọdụ a, okwu ahụ na-egosi ijere ihe ozi n'ụzọ ofufe; 'fee' bụ okwu Igbo doro anya maka nke ahụ.
- source_word: τῇ κτίσει
  choice: ihe e kere eke
  rationale: Na-anọchi anya ihe niile Chineke kere, ọ bụghị naanị otu ihe dị ndụ.
- source_word: παρὰ τὸν κτίσαντα
  choice: kama Onye kere ha
  rationale: παρά n'ọnọdụ a na-egosi ntụnyere na nhọpụta nke ihe e kere eke n'ọnọdụ Onye Okike; 'ha' na-ezo aka n'ihe ndị e kere eke.
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: onye a na-eto ruo mgbe ebighị ebi
  rationale: Na-enye doxology ahụ n'Igbo dị ugbu a ma na-edobe oge na-enweghị njedebe.
theological_decisions:
- issue: Ọdịiche dị n'etiti ἐσεβάσθησαν na ἐλάτρευσαν
  choice: sọpụrụ ma fee
  alternative: kpọrọ isiala ma jeere ozi
  rationale: 'Nhọrọ ahụ na-edobe ngwaa abụọ dị iche iche: nkwanye ùgwù nke okpukpe na ofufe, n''enweghị ịtinye nkọwa otu ụka.'
- issue: Ihe τὸ ψεῦδος na-ezo aka na ya
  choice: ụgha
  alternative: ụgha ahụ
  rationale: Edeghị ihe ụgha ahụ bụ kpọmkwem n'amaokwu a; 'ụgha' na-edobe oghere nkọwa ahụ kama ịkọwa ya dị ka otu ozizi kpọmkwem.
- issue: Onye antecedent nke ὅς bụ
  choice: Onye kere ha, onye a na-eto
  alternative: ihe e kere eke, nke a na-eto
  rationale: Ụdị nwoke nke ὅς kwekọrọ na τὸν κτίσαντα ma na-eme ka doxology ahụ laghachikwuru Onye Okike.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, dị ugwu ma dị mfe nghọta. E ji 'Onye' na mkpụrụedemede ukwu gosi Onye Okike; ahịrịokwu ahụ na-edobe ọdịiche dị n'etiti ịsọpụrụ na ife ofufe.
