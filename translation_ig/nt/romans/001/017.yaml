review_pass:
  verdict: revise
  source_fidelity: 'Isi nsụgharị ahụ na-anọchi anya Greek nke ọma: ἐν αὐτῷ na-arụtụ aka n’ozi ọma, δικαιοσύνη θεοῦ ka edobere n’ụdị genitive na-adịghị ekpebi nkọwa, ἀποκαλύπτεται bụ ugbu a passive, na “site n’okwukwe ruo n’okwukwe” na-echekwa ugboro abụọ nke πίστις na ntụgharị ἐκ...εἰς. Okwu e hotara na-echekwa ọdịnihu ζήσεται, ebe “site n’okwukwe” ka na-adaba n’ọrụ abụọ Greek ahụ pụrụ inwe.'
  naturalness: Ọ dị mma n’ozuzu ya n’Igbo Standard. Ịtinye “ọ bụ” n’usoro “N’ihi na ọ bụ n’ime ya ka...” na-eme ka nhazi cleft ahụ bụrụ nke a na-asụkarị ma doo anya karịa, n’enweghị mgbanwe n’ihe e kwuru.
  terminology: “Ezi omume nke Chineke,” “okwukwe,” na “onye ezi omume” bụ okwu dabara adaba n’usoro Pọl na n’Igbo nke oge a. “Ikpe ziri ezi” bụ nhọrọ ọzọ ziri ezi maka footnote, ọ bụghị mgbanwe a ga-eme n’isi ederede. A degharịrị footnote b ka nhọrọ ndị ọzọ ghara iyi naanị otu okwu a kwughachiri ugboro abụọ n’enweghị ọdịiche a pụrụ ịghọta.
  issues:
  - severity: low
    issue: Enweghị “ọ bụ” n’usoro cleft nke mmalite.
    rationale: “N’ihi na n’ime ya ka...” a ghọtara, ma “N’ihi na ọ bụ n’ime ya ka...” bụ nhazi Standard Igbo ka eke ma doro anya.
  - severity: medium
    issue: Footnote b anaghị akọwa nke ọma ọdịiche dị n’etiti nhọrọ ntụgharị atọ e nyere.
    rationale: Ụdị abụọ ikpeazụ yiri otu ihe n’Igbo (“site n’okwukwe ... maka okwukwe”), ya mere ọ naghị enyere onye na-agụ ya aka ịhụ na Greek ahụ ka na-enwe mgbagwoju anya. A pụrụ ịkọwa na ụfọdụ na-aghọta ya dịka okwukwe na-amalite wee na-aga n’ihu, n’emeghị nke ahụ isi nsụgharị.
  - severity: low
    issue: Footnote c ji “onye bụ onye ezi omume” mee ihe.
    rationale: Nke a dị ntakịrị arọ ma na-emegharị “onye.” “Onye ezi omume site n’okwukwe ga-adị ndụ” na-egosi nke ọma na “site n’okwukwe” nwere ike ịjikọta na “onye ezi omume.”
