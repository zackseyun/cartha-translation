source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: ig
  text: 'N’ihi na ọ bụ n’ime ya ka a na-ekpughe ezi omume nke Chineke[a], site n’okwukwe ruo n’okwukwe[b], dị ka e dere, sị: “Onye ezi omume ga-adị ndụ site n’okwukwe.”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikpe ziri ezi nke Chineke.”
    reason: lexical_alternative
  - marker: b
    text: Nkebiokwu Grik ἐκ πίστεως εἰς πίστιν siri ike ịkọwa n’otu ụzọ. “Site n’okwukwe ruo n’okwukwe” na-echekwa mkpụrụokwu njikọ abụọ ahụ na nkwughachi okwu ahụ. A pụkwara ịghọta ya dịka “site n’okwukwe maka okwukwe,” “site n’okwukwe, malite na mbụ ruo n’ọgwụgwụ,” ma ọ bụ “site n’okwukwe nke otu akụkụ ruo n’okwukwe nke ọzọ.”
    reason: alternative_reading
  - marker: c
    text: Ma ọ bụ, “Onye ezi omume site n’okwukwe ga-adị ndụ.”
    reason: alternative_reading
  - marker: d
    text: Ma ọ bụ, “Ma onye ezi omume ga-adị ndụ site n’okwukwe.” Grik nwere okwu δὲ, nke pụrụ ịbụ “ma,” ọ bụ ezie na n’ebe a ọ gaghị abụrịrị ihe na-egosi mmegide siri ike.
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: ezi omume
  rationale: “Ezi omume” bụ okwu Igbo a na-ejikarị akọwa ọnọdụ ịbụ onye ziri ezi n’ihu Chineke; ihe ọzọ ọ pụrụ ịpụta, bụ́ ikpe ziri ezi, dị n’ala peeji.
- source_word: θεοῦ
  choice: nke Chineke
  rationale: E debere njikọ genitive ahụ n’ụzọ doro anya ka a ghara ikpebi ma ọ bụ ezi omume nke Chineke n’onwe ya ka ọ bụ nke sitere n’aka Chineke.
- source_word: ἐν αὐτῷ
  choice: n’ime ya
  rationale: Nnọchiaha Grik ahụ bụ neuter ma na-arụtụ aka n’ozi ọma e kwuru na Rom 1:16.
- source_word: ἀποκαλύπτεται
  choice: a na-ekpughe
  rationale: Nke a na-egosipụta present passive n’Igbo dị mfe ma dị ugbu a.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: site n’okwukwe ruo n’okwukwe
  rationale: Nke a na-echekwa preposition abụọ ahụ na nkwughachi πίστις, n’emeghị ka otu nkọwa n’ime ọtụtụ nkọwa kwe omume bụrụ naanị ya.
- source_word: δίκαιος
  choice: onye ezi omume
  rationale: Ọ na-enye substantival adjective ahụ n’Igbo nkịtị, na-enweghị itinye nwoke ebe ihe a na-ekwu bụ onye nnọchiteanya.
- source_word: ἐκ πίστεως
  choice: site n’okwukwe
  rationale: N’ime okwu Habakọk e hotara, nke a na-enye modal/source sense ahụ ma ka na-ahapụ ohere njikọ syntax ya.
- source_word: ζήσεται
  choice: ga-adị ndụ
  rationale: Ọ na-echekwa future force ahụ n’Igbo dị ebube ma dị mfe nghọta.
theological_decisions:
- issue: Ihe δικαιοσύνη θεοῦ pụtara
  choice: ezi omume nke Chineke
  alternative: ezi omume sitere n’aka Chineke; ikpe ziri ezi nke Chineke
  rationale: A hapụrụ genitive Grik ahụ ghe oghe ka a ghara idozi esemokwu banyere ma ọ na-ekwu àgwà Chineke, ikpe ziri ezi ya, ma ọ bụ ezi omume nke ya na Chineke nwere njikọ ma ọ bụ nke o nyere.
- issue: Uche dị na ἐκ πίστεως εἰς πίστιν
  choice: site n’okwukwe ruo n’okwukwe
  alternative: site n’okwukwe maka okwukwe; site n’okwukwe, malite na mbụ ruo n’ọgwụgwụ
  rationale: Nkebiokwu a siri ike ma nwee ọtụtụ nkọwa kwesiri ekwesi; nsụgharị a na-echekwa ntụziaka na nkwughachi nke Grik.
- issue: Ebe ἐκ πίστεως jikọtara n’okwu Habakọk
  choice: onye ezi omume ga-adị ndụ site n’okwukwe
  alternative: onye a na-agụ n’onye ezi omume site n’okwukwe ga-adị ndụ
  rationale: Grik nwere ike ijikọ nkebiokwu ahụ na “onye ezi omume” ma ọ bụ “ga-adị ndụ”; isi ederede na-eji usoro Igbo kacha ghọta, ebe ala peeji na-echekwa nke ọzọ.
- issue: Ọrụ δὲ ná mmalite okwu e hotara
  choice: a hapụrụ ya n’enweghị “ma” n’isi ederede
  alternative: Ma onye ezi omume ga-adị ndụ site n’okwukwe
  rationale: δὲ dị na Grik, ma n’ebe a ọ pụrụ ịbụ particle na-aga n’ihu okwu karịa ihe na-egosi mmegide siri ike; ịtinye “ma” pụrụ ime ka onye na-agụ ya hụ mmegide na-adịghị mkpa.
translation_notes:
  register: Standard Igbo; asụsụ dị ugbu a, dị nsọ ma dị mfe nghọta. E ji “ezi omume” mee ka okwu Pọl dị arọ n’usoro nkà mmụta okpukpe, ma e zere ịkọwa ambiguity nke genitive na nkebiokwu okwukwe ahụ n’otu ụzọ naanị.
