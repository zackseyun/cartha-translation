id: ROM.1.5
reference: Romans 1:5
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: ig
  text: Ọ bụ site na ya ka anyị natara amara na ọrụ onyeozi, ka e wee nwee nrubeisi nke okwukwe n’etiti mba niile[b], n’ihi aha ya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nrubeisi nke sitere n’okwukwe,” ma ọ bụ “nrubeisi nke bụ okwukwe.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’etiti ndị mba ọzọ niile.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Ọ bụ site n’aka ya
  rationale: Nke a na-egosi na Kraịst bụ onye e si n’aka ya nweta ihe ndị a, ma na-ejikọkwa amaokwu ahụ na onye a kpọtụrụ aha tupu ya.
- source_word: ἐλάβομεν
  choice: anyị natara
  rationale: E chekwara onye mbụ n’ụbara dị na Grik, n’ebughị ụzọ kpebie ma Pọl ji ‘anyị’ na-ekwu naanị banyere onwe ya ka ọ bụ banyere ndị ọzọ tinyere ya.
- source_word: χάριν καὶ ἀποστολήν
  choice: amara na ịbụ ndịozi
  rationale: E debere aha abụọ ahụ dị ka ihe abụọ jikọrọ ọnụ; ‘ịbụ ndịozi’ bụ Igbo nkịtị nke na-egosi ọkwá na ọrụ onyeozi.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: ka okwukwe wee mụta nrubeisi
  rationale: Nke a bụ ụzọ Igbo doro anya isi gosipụta njikọ dị n’etiti okwukwe na nrubeisi, ma ihe owuwu Grik ka nwere nkọwa ndị ọzọ a na-edebe na nkọwa ala peeji.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: n’etiti mba niile
  rationale: ‘Mba niile’ na-echekwa obosara ἔθνη; a na-enye ‘ndị mba ọzọ’ dị ka ụzọ ọzọ n’ala peeji.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: n’ihi aha ya
  rationale: Nke a na-egosi na ebumnuche ọrụ ahụ bụ nsọpụrụ na otuto nke aha ya.
theological_decisions:
- issue: Nkọwa nke ὑπακοὴν πίστεως
  choice: ka okwukwe wee mụta nrubeisi
  alternative: ka e nwee nrubeisi nke sitere n’okwukwe; ka e nwee nrubeisi nke bụ okwukwe
  rationale: Nkebiokwu Grik a dị mkpirikpi ma nwee ike ịpụta nrubeisi sitere n’okwukwe, ma ọ bụ nrubeisi nke okwukwe n’onwe ya mejupụtara. Isiokwu ahụ ji okwu Igbo jikọta ha n’enweghị ịkwụsị esemokwu ahụ kpamkpam, ebe nkọwa ala peeji na-edepụta ụzọ ndị ọzọ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke ugbu a ma dị ùgwù. E ji ‘amara,’ ‘okwukwe,’ ‘nrubeisi,’ na ‘ndịozi’ mee ka okwu okpukpe ndị a bụrụ ndị a maara nke ọma, ma zere okwu nke otu ụka pụrụ iche.
