revisions:
- from: Ọ bụ site n’aka ya ka anyị natara amara na ịbụ ndịozi, ka okwukwe wee mụta nrubeisi n’etiti mba niile[b], n’ihi aha ya.[a]
  to: Ọ bụ site na ya ka anyị natara amara na ọrụ onyeozi, ka e wee nwee nrubeisi nke okwukwe n’etiti mba niile[b], n’ihi aha ya.[a]
  rationale: 'The revised wording corrects the altered sense of the disputed phrase ὑπακοὴν πίστεως by translating it as the noun phrase “nrubeisi nke okwukwe.” The footnote retains the two principal interpretive expansions without selecting either. “Ọrụ onyeozi” more accurately represents ἀποστολήν as an apostolic office or commission. The original footnote anchors remain correctly placed: [b] follows “mba niile,” and [a] follows the sentence’s rendering of the disputed phrase.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the mediating sense of δι’ οὗ, the first-person plural of ἐλάβομεν, the scope of ἐν πᾶσιν τοῖς ἔθνεσιν, and the purpose expressed by ὑπὲρ τοῦ ὀνόματος αὐτοῦ. However, “ka okwukwe wee mụta nrubeisi” changes ὑπακοὴν πίστεως into a statement that faith itself learns obedience, a meaning not present in the Greek. “Ịbụ ndịozi” also risks meaning ‘being apostles’ (plural persons) rather than the singular abstract office/commission, ἀποστολήν.
  naturalness: The revision uses clear Standard Igbo and a dignified biblical register. “Ka e wee nwee nrubeisi nke okwukwe” is suitably natural while retaining the compact, deliberately unresolved relationship between obedience and faith.
  terminology: “Amara,” “okwukwe,” and “nrubeisi” are appropriate established theological vocabulary. “Ọrụ onyeozi” conveys apostleship/apostolic commission without incorrectly pluralizing the office. “Mba niile,” with a footnote for “ndị mba ọzọ,” appropriately preserves the breadth of ἔθνη.
  issues:
  - severity: high
    issue: The main text renders ὑπακοὴν πίστεως as “ka okwukwe wee mụta nrubeisi.”
    rationale: This makes okwukwe the agent that learns obedience. The Greek is a noun phrase, ‘obedience of faith,’ whose genitive relationship must remain open rather than being recast into a different proposition.
  - severity: medium
    issue: “Ịbụ ndịozi” is imprecise for ἀποστολήν.
    rationale: It can be understood as the state of being apostles (plural), whereas the Greek refers to apostleship or an apostolic commission as an abstract office/task. “Ọrụ onyeozi” better conveys this.
  revised_text: Ọ bụ site na ya ka anyị natara amara na ọrụ onyeozi, ka e wee nwee nrubeisi nke okwukwe n’etiti mba niile[b], n’ihi aha ya.[a]
  revised_footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “nrubeisi nke sitere n’okwukwe,” ma ọ bụ “nrubeisi nke bụ okwukwe.”
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ, “n’etiti ndị mba ọzọ niile.”
    reason: lexical_alternative
  revision_rationale: 'The revised wording corrects the altered sense of the disputed phrase ὑπακοὴν πίστεως by translating it as the noun phrase “nrubeisi nke okwukwe.” The footnote retains the two principal interpretive expansions without selecting either. “Ọrụ onyeozi” more accurately represents ἀποστολήν as an apostolic office or commission. The original footnote anchors remain correctly placed: [b] follows “mba niile,” and [a] follows the sentence’s rendering of the disputed phrase.'
