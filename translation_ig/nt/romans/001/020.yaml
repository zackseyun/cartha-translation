    reason: lexical_alternative
  revision_rationale: The revision renders καθορᾶται with “a na-ahụ ... nke ọma” and retains νοούμενα with “mgbe e ji uche aghọta ha,” making clear that the unseen realities are mentally perceived through created things. It replaces the potentially misleading “ọdịdị ya dị ka Chineke” with “ọdịdị Chineke ya,” a natural Standard Igbo expression for divinity/divine nature. The result clause is retained without imposing a doctrinal interpretation of εἰς τό.
