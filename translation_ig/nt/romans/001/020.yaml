id: ROM.1.20
reference: Romans 1:20
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: ig
  text: N’ihi na, kemgbe e kere ụwa, a na-ahụ ihe ndị a na-adịghị ahụ anya banyere ya[a]—ya bụ, ike ya nke na-adịru mgbe ebighị ebi na ọdịdị Chineke ya[b]—nke ọma site n’ihe ndị e kere eke, mgbe e ji uche aghọta ha. Ya mere, ha enweghị ihe ngọpụ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “àgwà ya ndị a na-adịghị ahụ anya.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “ịdị Chineke ya.” Okwu Grik e ji mee ihe n’ebe a bụ θειότης, ọ bụghị okwu siri ike karị bụ́ θεότης.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: ihe ndị a na-adịghị ahụ anya banyere ya
  rationale: 'Nke a na-edobe obosara nke okwu Grik ahụ: ihe ndị mmadụ na-apụghị ịhụ anya banyere Chineke, n’enweghị ime ka ọ bụrụ naanị ihe a na-akpọ àgwà.'
- source_word: ἀπὸ κτίσεως κόσμου
  choice: kemgbe e kere ụwa
  rationale: “Kemgbe” na-egosi oge malitere mgbe e kere ụwa ma na-aga n’ihu ruo ugbu a.
- source_word: τοῖς ποιήμασιν
  choice: site n’ihe ndị e kere eke
  rationale: “Site n’” na-egosi na ihe ndị e kere eke bụ ụzọ mmadụ si aghọta ihe a na-adịghị ahụ anya banyere Chineke.
- source_word: νοούμενα
  choice: A na-aghọta ha
  rationale: Nke a na-egosi nghọta nke uche, ọ bụghị naanị ịhụ ihe n’anya nkịtị.
- source_word: καθορᾶται
  choice: apụtawo ìhè
  rationale: Nkebi okwu a na-egosi na a pụrụ ịghọta ihe ndị ahụ nke ọma, ma na-adabara asụsụ Igbo karịa ikwu na a na-eji anya ahụ ihe a na-adịghị ahụ anya.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: ike ya nke na-adịru mgbe ebighị ebi
  rationale: Nke a na-edobe echiche nke ike Chineke na-enweghị ọgwụgwụ ma na-eji okwu ndị ndị Igbo nke oge a na-aghọta ngwa ngwa.
- source_word: θειότης
  choice: ọdịdị ya dị ka Chineke
  rationale: Nke a na-egosi àgwà ma ọ bụ ọdịdị nke ịbụ nke Chineke, n’emeghị ka θειότης bụrụ otu ihe kpọmkwem na okwu Grik siri ike karị, θεότης.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: N’ihi ya, ha enweghị ihe ngọpụ
  rationale: 'Nke a na-egosipụta ihe si na mkpughe ahụ pụta: ndị mmadụ enweghị azịza ha ga-eji gọpụ onwe ha.'
theological_decisions:
- issue: Otu e si sụgharịa θειότης n’enweghị ime ka ọ pụta ihe karịrị okwu Pọl
  choice: ọdịdị ya dị ka Chineke
  alternative: ịbụ Chineke ya; chi ya
  rationale: Nhọrọ a na-ekwupụta na ihe e kere eke na-eme ka eziokwu banyere ọdịdị Chineke pụta ìhè, ma ọ naghị ekpochapụ ọdịiche dị n’etiti θειότης na θεότης.
- issue: Mmekọrịta dị n’etiti mkpughe e nyere site n’ihe e kere eke na enweghị ihe ngọpụ
  choice: N’ihi ya, ha enweghị ihe ngọpụ
  alternative: ka ha wee ghara inwe ihe ngọpụ
  rationale: εἰς τό nwere ike igosi ihe si na ya pụta ma ọ bụ nzube. Isi ederede na-egosipụta nsonaazụ ahụ n’asụsụ Igbo dị mfe, n’enweghị ịkọwa kpọmkwem na Chineke kere ụwa nanị maka ikpe ha ikpe.
translation_notes:
  register: Asụsụ ahụ bụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E kewara ahịrịokwu Grik ogologo ahụ ụzọ atọ iji mee ka ọ na-agụ were were, ma e debere njikọ echiche ya. E tinyere akara nkọwa [b] n’akụkụ θειότης, ebe nkọwa ahụ metụtara, kama itinye ya n’akụkụ “ihe ndị e kere eke.”
