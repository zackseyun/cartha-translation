  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: ig
  text: ma ha gbanwere ebube nke Chineke na-adịghị emebi emebi ka ọ bụrụ myirịta nke ihe oyiyi nke mmadụ na-emebi emebi, nke nnụnụ, nke anụmanụ nwere ụkwụ anọ, na nke ihe ndị na-akpụ akpụ.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ebube nke Chineke na-apụghị ire ure.”
    reason: lexical_alternative
  - marker: b
    text: N'ụzọ nkịtị, “n'ime myirịta nke ihe oyiyi nke mmadụ na-emebi emebi...”
    reason: lexical_alternative
  - marker: c
    text: A pụkwara ịsụgharị ya, “mmadụ na-anwụ anwụ.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “ihe ndị na-arị arị.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: gbanwere ... were ... dochie ya
  rationale: 'Nkebiokwu a na-egosi mgbanwe a kpachara anya mee: ha weere ihe oyiyi dochie ebube Chineke.'
- source_word: δόξαν
  choice: ebube
  rationale: “Ebube” bụ okwu Igbo doro anya maka ịdị ukwuu na nsọpụrụ Chineke n'ọnọdụ a.
- source_word: ἀφθάρτου
  choice: na-apụghị ire ure
  rationale: Ọ na-egosipụta ihe na-adịghị emebi emebi ma na-emekwa ka ọdịiche ya na φθαρτοῦ pụta ìhè.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: ihe oyiyi yiri
  rationale: Nke a na-edobe ma echiche nke oyiyi ma nke myirịta, n'Igbo na-aga were were.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: mmadụ na-ere ure
  rationale: Ọ na-edobe ọdịiche okwu ahụ na ἀφθάρτου nke Chineke, ma na-egosi mmadụ nke na-emebi emebi.
- source_word: πετεινῶν
  choice: nnụnụ
  rationale: Nke a bụ okwu Igbo nkịtị ma doo anya maka anụmanụ ndị na-efe efe e zoro aka na ha.
- source_word: τετραπόδων
  choice: anụmanụ nwere ụkwụ anọ
  rationale: Ọ na-enye nkọwa kpọmkwem nke okwu Grik ahụ n'Igbo a na-aghọta ngwa ngwa.
- source_word: ἑρπετῶν
  choice: ihe ndị na-akpụ akpụ
  rationale: Okwu Grik ahụ sara mbara karịa naanị ụdị anụmanụ ndị sayensị oge a na-akpọ reptiles; nsụgharị a na-echekwa obosara ya.
theological_decisions:
- issue: Ọdịiche dị n'etiti Chineke na ihe e kere eke na-emebi emebi
  choice: E debere “na-apụghị ire ure” megide “na-ere ure.”
  alternative: “Chineke na-adịghị anwụ anwụ” megide “mmadụ na-anwụ anwụ.”
  rationale: Nhọrọ a na-edobe njikọ okwu ἀφθάρτου/φθαρτοῦ na echiche nke enweghị mmebi megide mmebi, n'ebughị nkọwa ahụ gaa naanị n'ọnwụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “ihe ndị na-akpụ akpụ” kama okwu zoolọjị dị warara, ebe “gbanwere ... were ... dochie ya” na-eme ka echiche nke deliberate substitution doo anya.
