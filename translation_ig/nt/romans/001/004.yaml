id: ROM.1.4
reference: Romans 1:4
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: ig
  text: onye e mere ka a mara na ọ bụ Ọkpara Chineke n’ike[a], dị ka Mmụọ nke ịdị nsọ siri dị[b], site na mbilite n’ọnwụ n’etiti ndị nwụrụ anwụ—Jizọs bụ Mesaya, Onyenwe anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pụkwara ịsụgharị ya: “onye a họpụtara” ma ọ bụ “onye a kara aka” ịbụ Ọkpara Chineke n’ike.'
    reason: lexical_alternative
  - marker: b
    text: 'Ma ọ bụ: “dị ka Mmụọ Nsọ siri dị.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: onye e mere ka a mara na ọ bụ
  rationale: Nke a na-enye echiche nke ịbụ onye a kọwapụtara ma ọ bụ onye e mere ka a mata n’ihu ọha, n’enweghị ikwu na Jizọs malitere ịbụ Ọkpara Chineke naanị mgbe o bilitere n’ọnwụ. E debere nhọrọ ndị ọzọ n’ala peeji.
- source_word: υἱοῦ θεοῦ
  choice: Ọkpara Chineke
  rationale: Nke a bụ aha nsọ kpọmkwem ma bụrụkwa ụzọ Igbo doro anya si ebufe okwu Grik ahụ.
- source_word: ἐν δυνάμει
  choice: n’ike
  rationale: Nsụgharị a dị nkenke ma na-edebe njikọ okwu ahụ na ‘Ọkpara Chineke’ n’enweghị ịkọwa ya karịa ihe Grik kwuru.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: dị ka Mmụọ nke ịdị nsọ si dị
  rationale: Nke a na-edebe ọdịdị pụrụ iche nke ahịrịokwu Grik ma hapụkwa ka a ghara ikpebi kpamkpam ma ọ na-ekwu kpọmkwem banyere Mmụọ Nsọ ma ọ bụ banyere ọnọdụ ime mmụọ nke ịdị nsọ.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: site ná mbilite n’ọnwụ ya n’etiti ndị nwụrụ anwụ
  rationale: Nke a bụ Igbo dị mfe nghọta maka ụzọ mbilite Jizọs n’ọnwụ si bụrụ ihe e ji mee ka ọ pụta ìhè. ‘Ya’ bụ nkọwa njikọ okwu nke ihe gbara amaokwu ahụ gburugburu chọrọ, ọ bụghị mgbakwunye ozizi.
- source_word: Χριστοῦ
  choice: Mesaya
  rationale: N’ebe a Χριστός na-arụ ọrụ dị ka utu aha; ‘Mesaya’ na-edebe ihe utu aha ahụ pụtara karịa iji ya dịka naanị aha mmadụ.
- source_word: κυρίου
  choice: Onyenwe
  rationale: ‘Onyenwe’ bụ okwu Igbo kwesịrị ekwesị nke na-edebe ịdị arọ nke κύριος dịka utu aha Jizọs.
theological_decisions:
- issue: Ma ὁρισθέντος ọ pụtara na Jizọs ghọrọ Ọkpara Chineke naanị mgbe o bilitere n’ọnwụ
  choice: E ji ‘e mere ka a mara na ọ bụ Ọkpara Chineke n’ike’ gosipụta nkwupụta ma ọ bụ ime ka ọnọdụ ya pụta ìhè, n’enweghị ikwu na ịbụ Ọkpara ya malitere mgbe ahụ.
  alternative: ‘a họpụtara ịbụ Ọkpara Chineke n’ike’ ma ọ bụ ‘a kara aka ịbụ Ọkpara Chineke n’ike’
  rationale: Okwu Grik nwere ike ịpụta ikpebi, ịhọpụta, ịkara aka, ma ọ bụ ime ka amata. Nsụgharị bụ isi na-edebe esemokwu dị n’okwu ahụ ma na-ezere itinye echiche na Jizọs abụghị Ọkpara tupu mbilite n’ọnwụ.
- issue: Ma πνεῦμα ἁγιωσύνης ọ na-ekwu kpọmkwem banyere Mmụọ Nsọ
  choice: E debere okwu pụrụ iche ahụ dịka ‘Mmụọ nke ịdị nsọ.’
  alternative: ‘Mmụọ Nsọ’ ma ọ bụ ‘mmụọ nsọ ya’
  rationale: Ahịrịokwu Grik abụghị ụzọ a na-ahụkarị e si akpọ Mmụọ Nsọ, o nwekwara ike ịbụ ihe e tinyere n’akụkụ ‘dị ka anụ ahụ si dị’ nke amaokwu nke 3. Ya mere, e kwesịghị imechi ihe ọ pụtara n’otu ụzọ naanị.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ugwu ma dịkwa mfe nghọta. ‘Ọkpara Chineke,’ ‘Mesaya,’ na ‘Onyenwe anyị’ na-edebe utu aha ndị bụ isi; ahịrịokwu ahụ ka bụ akụkụ na-aga n’ihu site n’amaokwu nke 3.
