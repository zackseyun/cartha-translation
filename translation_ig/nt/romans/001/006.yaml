  text: ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/006.yaml
  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: ig
  text: N’etiti ndị ahụ ka unu onwe unu nọkwa, unu bụ ndị Jizọs, bú Mezaya, kpọrọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsị, “ndị a kpọrọ nke Jizọs, bú Mezaya”; ya bụ, “ndị a kpọrọ ka ha bụrụ ndị nke Jizọs, bú Mezaya.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν οἷς
  choice: n’etiti ha
  rationale: Ọ na-ezo aka ná ndị mba ọzọ e kwuru okwu ha n’amaokwu bu ụzọ ma gosipụta na ndị kwere ekwe nọ na Rom so n’ìgwè ahụ.
- source_word: ἐστε καὶ ὑμεῖς
  choice: unu onwe unu sokwa
  rationale: “Sokwa” na-egosipụta echiche nke καί, ebe “unu onwe unu” na-echekwa nkwusi ike dị na nnọchiaha ὑμεῖς.
- source_word: κλητοὶ
  choice: ndị a kpọrọ
  rationale: Nke a na-echekwa echiche bụ isi nke κλητοί n’enweghị ịgbakwunye onye kpọrọ ha n’ahịrịokwu a.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs bụ Mezaya
  rationale: A sụgharịrị Χριστός dị ka utu aha “Mezaya,” ebe “bụ” mere ka njikọ utu aha ahụ na aha Jizọs daa nke ọma n’Igbo.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: ndị a kpọrọ ka ha bụrụ ndị Jizọs bụ Mezaya
  rationale: Nke a na-egosipụta n’Igbo dị ugbu a mmekọrịta nke ịbụ ndị nke Jizọs, nke genitive Grik ahụ pụrụ ịpụta, ma e debere nghọta ndị ọzọ n’okpuru peeji.
theological_decisions:
- issue: Mmekọrịta genitive dị na κλητοὶ Ἰησοῦ Χριστοῦ
  choice: ndị a kpọrọ ka ha bụrụ ndị Jizọs bụ Mezaya
  alternative: ndị Jizọs bụ Mezaya kpọrọ; ma ọ bụ, n’ụzọ kpọmkwem karị, ndị a kpọrọ nke Jizọs bụ Mezaya
  rationale: Nhọrọ bụ isi na-egosipụta ịbụ ndị nke Mezaya site ná ọkpụkpọ, ma ọ naghị ekpebi na Jizọs n’onwe ya bụ onye kpọrọ ha. Ihe odide ala peeji na-echekwa mkpakọ na nghọta dị iche iche nke okwu Grik.
translation_notes:
  register: E ji Igbo Izugbe dị mfe ma dị ùgwù. “Unu onwe unu sokwa” na-eme ka nkwusi ike na ntinye ndị na-agụ akwụkwọ n’ìgwè ahụ pụta ìhè; e jikwa “Mezaya” dị ka utu aha kama iji “Kraịst.”
