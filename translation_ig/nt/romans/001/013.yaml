id: ROM.1.13
reference: Romans 1:13
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: ig
  text: Achọghị m ka unu ghara ịma[a], ụmụnna, na ezubela m ọtụtụ mgbe ịbịakwute unu—ma e gbochiela m ruo ugbu a—ka m wee nweta mkpụrụ ụfọdụ n’etiti unu kwa[b], dịka kwa n’etiti ndị mba ọzọ ndị ọzọ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “Achọrọ m ka unu mara.”
    reason: lexical_alternative
  - marker: b
    text: “Mkpụrụ” n’ebe a na-ezo aka n’ihe ga-esi n’ozi Pọl n’etiti ha pụta.
    reason: cultural_note
  - marker: c
    text: Ma ọ bụ, “mba ndị ọzọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: Achọghị m ka unu ghara ịma
  rationale: Nke a na-edobe usoro nkwupụta a jụrụ ajụ nke Grik, ma na-ada nke ọma n’Igbo ugbu a.
- source_word: ἀδελφοί
  choice: ụmụnna
  rationale: “Ụmụnna” bụ okwu nkwanye ugwu a na-eji akpọ ndị otu okwukwe; ọ pụkwara ịgụnye nwoke na nwanyị dịka ọnọdụ a si dị.
- source_word: πολλάκις προεθέμην
  choice: ọtụtụ mgbe ezubela m
  rationale: Ọ na-egosi ebumnuche Pọl mere ugboro ugboro tupu oge a.
- source_word: ἐκωλύθην
  choice: e gbochiela m
  rationale: Ụdị nkwusioru a na-egosi na ihe ndị ọzọ nọgidere na-egbochi njem ahụ ruo ugbu a.
- source_word: ἄχρι τοῦ δεῦρο
  choice: ruo ugbu a
  rationale: Nke a bụ ụzọ Igbo doro anya na nke ebumpụta ụwa si kwuo oke oge ahụ.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: ka m wee nweta ụfọdụ mkpụrụ
  rationale: E debere ihe atụ nke mkpụrụ dị na Grik, n’ihi na ọ na-egosi ihe ga-esi n’ozi Pọl pụta.
- source_word: ἐν ὑμῖν
  choice: n’etiti unu
  rationale: N’ọnọdụ a, ọ na-ezo aka n’ihe ga-eme n’etiti ndị kwere ekwe nọ na Rom dịka otu ìgwè.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: ndị mba ọzọ fọdụrụ
  rationale: N’ebe a ἔθνη yikarịrị ka ọ na-ezo aka ná ndị na-abụghị ndị Juu, ebe λοιποί na-egosi ndị ọzọ fọdụrụ n’ubi ozi Pọl.
theological_decisions:
- issue: Ihe “mkpụrụ” pụtara
  choice: E debere “mkpụrụ” dịka ihe atụ n’ahịrịokwu bụ isi.
  alternative: Ịsụgharị ya ozugbo dịka “ihe ọma si n’ozi m pụta.”
  rationale: Grik ji ihe atụ ọrụ ubi mee ihe; idebe ya na-echekwa obosara ihe ọ pụrụ ịpụta, ebe nkọwa ụkwụ na-eme ka o doo anya.
- issue: Ihe ἔθνη pụtara
  choice: ndị mba ọzọ
  alternative: mba ndị ọzọ
  rationale: N’akwụkwọ Pọl na n’ọnọdụ ozi ya, okwu ahụ yikarịrị ka ọ na-ezo aka ná ndị na-abụghị ndị Juu; nkọwa ụkwụ na-echekwa nhọrọ nke “mba ndị ọzọ.”
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. E debere ihe atụ “mkpụrụ” na usoro nkwupụta a jụrụ ajụ nke mmalite; akara nkọwa ụkwụ niile pụtara n’ahịrịokwu bụ isi.
