revisions:
- from: Achọghị m ka unu ghara ịma[a], ụmụnna, na ọtụtụ mgbe ezubela m ịbịakwute unu—ma e gbochiela m ruo ugbu a—ka m wee nweta ụfọdụ mkpụrụ n’etiti unu kwa[b], dịka m nwetara n’etiti ndị mba ọzọ fọdụrụ[c].
  to: Achọghị m ka unu ghara ịma[a], ụmụnna, na ezubela m ọtụtụ mgbe ịbịakwute unu—ma e gbochiela m ruo ugbu a—ka m wee nweta mkpụrụ ụfọdụ n’etiti unu kwa[b], dịka kwa n’etiti ndị mba ọzọ ndị ọzọ[c].
  rationale: The revision removes the unsupported explicit past verb from the final comparison, preserving the Greek’s understood relation to the purpose clause. It also improves the placement of the frequency expression and clarifies “the rest of the Gentiles” in idiomatic Standard Igbo. Footnote anchors and their intended functions are retained.
