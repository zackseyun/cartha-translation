id: ROM.1.8
reference: Romans 1:8
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: ig
  text: Nke mbụ, ana m ekele Chineke m site n'aka Jizọs, Onye e tere mmanụ[a], n'ihi unu niile, n'ihi na a na-ekwusa okwukwe unu[b] n'ụwa dum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ Kraịst.
    reason: alternative_reading
  - marker: b
    text: Ma ọ bụ ikwesị ntụkwasị obi unu; o nwekwara ike ịbụ ntụkwasị obi unu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Nke mbụ
  rationale: Ọ na-egosi mmalite nke ihe Pọl chọrọ ikwu; a hapụrụ μὲν ka ọ banye n'ụzọ Igbo si ekwu okwu n'enweghị ịtụgharị ya iche.
- source_word: εὐχαριστῶ
  choice: ana m ekele
  rationale: Nke a na-egosipụta ekele Pọl na-enye ugbu a n'ụzọ doro anya ma bụrụkwa Igbo a na-asụkarị.
- source_word: τῷ θεῷ μου
  choice: Chineke m
  rationale: Ọ na-echekwa ụdị nwe-onwe nke okwu Grik ahụ na ụda ofufe onwe onye nke Pọl.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: site n'aka Jizọs, Onye E Tere Mmanụ
  rationale: διά tinyere genitive na-egosi onye e si n'aka ya mee ihe; “site n'aka” bụ ụzọ Igbo dị ndụ si egosipụta nke a. “Onye E Tere Mmanụ” na-atụgharị ihe Χριστός pụtara dịka aha-ọkwa.
- source_word: περὶ πάντων ὑμῶν
  choice: n'ihi unu niile
  rationale: N'okwu ekele a, περί na-egosi ndị ekele ahụ gbasara; “n'ihi unu niile” na-enye nghọta ahụ n'Igbo nkịtị.
- source_word: ἡ πίστις ὑμῶν
  choice: okwukwe unu
  rationale: “Okwukwe” bụ ntụgharị Igbo a na-ahụkarị maka πίστις, ma ihe okwu ahụ nwekwara ike ịpụta ka edebere n'okpuru amaokwu.
- source_word: καταγγέλλεται
  choice: a na-ekwusa
  rationale: Ọ na-echekwa olu nnabata na omume na-aga n'ihu nke present passive Grik ahụ.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: n'ụwa dum
  rationale: Ọ na-egosipụta oke sara mbara nke okwu Pọl n'ụzọ Igbo dị mkpirikpi ma doo anya.
theological_decisions:
- issue: Ịtụgharị Χριστοῦ n'okwu διὰ Ἰησοῦ Χριστοῦ
  choice: Jizọs, Onye E Tere Mmanụ
  alternative: Jizọs Kraịst
  rationale: Χριστός bụ aha-ọkwa pụtara onye e tere mmanụ. Isi ederede na-enye ihe aha-ọkwa ahụ pụtara, ebe nkọwa ala na-edebe ụdị a na-asụkarị “Kraịst.”
- issue: Ịtụgharị πίστις n'okwu ἡ πίστις ὑμῶν
  choice: okwukwe unu
  alternative: ikwesị ntụkwasị obi unu; ntụkwasị obi unu
  rationale: N'ebe a, “okwukwe” kacha dabara n'okwu banyere nkwenye ndị Rom a maara ebe niile, ma πίστις nwekwara ike imesi ikwesị ntụkwasị obi ma ọ bụ ntụkwasị obi ike; e debere ha n'okpuru amaokwu ka a ghara idozi esemokwu ahụ n'amaghị ama.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. “Ana m ekele” na “a na-ekwusa” na-eme ka ahịrịokwu ahụ bụrụ nke mmadụ nkịtị ga-aghọta, ebe “Onye E Tere Mmanụ” na-echekwa ihe aha-ọkwa Χριστός pụtara.
