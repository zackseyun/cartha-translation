id: ROM.1.7
reference: Romans 1:7
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: ig
  text: 'Nye ndị niile nọ na Rom, ndị Chineke hụrụ n’anya, ndị nsọ a kpọrọ òkù[a]: Ka amara na udo sitere n’aka Chineke Nna anyị na Onyenwe anyị Jizọs Mesaya[b] dịrị unu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị a kpọrọ ịbụ ndị nsọ.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Kraịst.”
    reason: lexical_alternative
  - marker: c
    text: 'A pụkwara ịhazi akụkụ mbụ ya otu a: “Nye ndị niile nọ na Rom, ndị Chineke hụrụ n’anya, ndị nsọ a kpọrọ òkù.”'
    reason: previous_rendering
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: Nye ndị niile nọ na Rom
  rationale: Nke a na-egosipụta onye niile akwụkwọ ozi ahụ na-agwa okwu na ebe ha nọ, n’ụzọ Igbo dị mfe ma doo anya.
- source_word: ἀγαπητοῖς θεοῦ
  choice: ndị Chineke hụrụ n’anya
  rationale: Nkebiokwu a bụ ụzọ Igbo ebumpụta ụwa si egosipụta na Chineke hụrụ ha n’anya, ma na-edobe ịdị arọ nke mmekọrịta dị n’okwu Grik ahụ.
- source_word: κλητοῖς ἁγίοις
  choice: ndị a kpọrọ ịbụ ndị nsọ
  rationale: Ọ bụ ezie na okwu Grik abụọ ahụ bụ nkọwaaha na enweghị okwu pụtara kpọmkwem ‘ịbụ,’ nsụgharị a na-eme ka njikọ ha doo onye Igbo anya n’enweghị ịkọwa ụdị ịdị nsọ ahụ karịa ihe ederede kwuru; a na-edebe ụdị okwu dị nso karị n’akụkụ ala peeji.
- source_word: χάρις
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo a na-ejikarị akọwa χάρις n’akwụkwọ Pọl, ma na-eburu echiche nke ihuọma Chineke.
- source_word: εἰρήνη
  choice: udo
  rationale: ‘Udo’ bụ ezigbo nnọchi anya εἰρήνη, ma dị ka ekele ma dị ka ezi ọnọdụ sitere n’aka Chineke.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: Chineke Nna anyị
  rationale: Nke a bụ usoro Igbo doro anya nke na-edobe Chineke dị ka Nna anyị.
- source_word: κυρίου
  choice: Onyenwe anyị
  rationale: ‘Onyenwe anyị’ bụ okwu Igbo kwesịrị ekwesị maka κύριος n’ebe a ma na-edobe ịdị elu nke aha ahụ.
- source_word: Χριστοῦ
  choice: Mesaya
  rationale: A sụgharịrị aha ọkwa Χριστός dị ka ‘Mesaya’ kama idegharị ya naanị dịka ‘Kraịst,’ ka ihe ọ pụtara dịrị onye na-agụ ya anya.
theological_decisions:
- issue: Otu e si sụgharịa κλητοῖς ἁγίοις
  choice: ndị a kpọrọ ịbụ ndị nsọ
  alternative: ndị nsọ a kpọrọ òkù
  rationale: Nhọrọ bụ isi na-agụ nke ọma n’Igbo ma na-ezere nkebiokwu nwere ike iyi na a kpọrọ ha òkù gaa otu ebe. Ebe ọ bụ na Grik enweghị okwu ‘ịbụ,’ e depụtara ụdị okwu dị nso na usoro Grik n’akụkụ ala peeji iji chekwaa esemokwu ahụ.
- issue: Otu e si sụgharịa Χριστοῦ
  choice: Mesaya
  alternative: Kraịst
  rationale: Χριστός ka na-arụ ọrụ dị ka aha ọkwa n’ebe a; ‘Mesaya’ na-eme ka ihe aha ọkwa ahụ pụtara pụta ìhè, ebe e nyere ụdị ọdịnala ‘Kraịst’ n’akụkụ ala peeji.
- issue: Mmekọrịta dị n’etiti Chineke Nna na Onyenwe anyị Jizọs Mesaya n’isi iyi nke amara na udo
  choice: si n’aka Chineke Nna anyị na Onyenwe anyị Jizọs, bụ Mesaya
  alternative: si n’aka Chineke, Nna anyị, nakwa n’aka Onyenwe anyị Jizọs, bụ Mesaya
  rationale: A hapụrụ njikọ ‘na’ dịka ọ dị na Grik, n’emeghị nkọwa ozizi ọzọ banyere mmekọrịta ha, ma okwu Igbo ahụ ka na-egosi na amara na udo sitere n’aka ha.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ ‘ndị a kpọrọ ịbụ ndị nsọ’ maka nghọta nkịtị, ma e chekwara ọdịdị nkọwaaha nke Grik na footnote. Akara [a], [b], na [c] niile dị n’ederede bụ isi.
