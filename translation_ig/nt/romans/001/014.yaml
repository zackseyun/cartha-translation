id: ROM.1.14
reference: Romans 1:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: ig
  text: Enwere m ibu ọrụ n'ebe ndị Gris na ndị na-abụghị ndị Gris nọ, n'ebe ndị maara ihe na ndị na-enweghị uche nọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ndị barbarian” ma ọ bụ “ndị mba ọzọ.” N'ebe a, okwu Grik ahụ bụ aha omenala e ji atụnyere ndị na-abụghị ndị Gris na ndị Gris; ọ pụtaghị na ha bụ ndị obi ọjọọ ma ọ bụ ndị na-enweghị mmepeanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: ndị Gris
  rationale: Ọ bụ aha dative plural na-ezo aka ná ndị Gris dị ka otu agbụrụ na omenala, ma na-edobe akụkụ mbụ nke ntụnyere Pọl.
- source_word: βαρβάροις
  choice: ndị na-abụghị ndị Gris
  rationale: N'okwu a, ọ bụ aha ndị Gris ji ekewa ndị na-abụghị ndị Gris n'ebe ndị Gris nọ; nsụgharị a na-ezere nghọta Igbo nke nwere ike ịpụta ndị obi ọjọọ ma ọ bụ ndị na-enweghị mmepeanya.
- source_word: σοφοῖς
  choice: ndị maara ihe
  rationale: Nke a bụ ụzọ Igbo doro anya ma dịkwa eke isi gosipụta ihe megidere ἀνοήτοις.
- source_word: ἀνοήτοις
  choice: ndị na-enweghị uche
  rationale: Ọ na-edobe ọdịiche ya na 'ndị maara ihe' n'ebughị ụzọ mee ka okwu ahụ bụrụ nanị enweghị agụmakwụkwọ.
- source_word: ὀφειλέτης
  choice: Enwere m ụgwọ iwetara ... ozi ọma
  rationale: Aha ahụ pụtara onye ji ụgwọ, ma n'ebe a ụgwọ ahụ bụ ibu ọrụ Pọl nwere n'ihi ozi e nyere ya, ọ bụghị ụgwọ ego. Itinye 'ozi ọma' na-eme ka ihe ọrụ ahụ bụ doo anya site n'ọnọdụ gbara amaokwu ahụ gburugburu.
- source_word: τε ... καὶ / τε ... καὶ
  choice: ma ... ma ... / ma ... ma ...
  rationale: Usoro a na-edobe ụzọ abụọ a haziri nhata na ụda okwu Grik.
theological_decisions:
- issue: Ihe ụgwọ Pọl metụtara
  choice: iwetara ha ozi ọma
  alternative: Abụ m onye ji ... ụgwọ
  rationale: Grik ekwughị kpọmkwem ihe a ga-enye ha n'amaokwu a, ma gburugburu okwu ahụ na-egosi ozi ọma. A họọrọ okwu doro anya nke na-egosi ibu ọrụ ozi ahụ, n'emeghị ya ụgwọ ego.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ 'ndị na-abụghị ndị Gris' n'ahịrị isi iji zere echiche ọjọọ nke okwu a sụgharịrị ozugbo nwere ike ibute. Ahịrịokwu ahụ na-edobe ụzọ abụọ e ji hazie okwu Grik.
