  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: ig
  text: N’ihi na, ọ bụ ezie na ha maara Chineke, ha enyeghị ya otuto dị ka Chineke, ha ekeleghịkwa ya; kama ha ghọrọ ndị efu n’echiche ha[a], obi ha[b] nke na-enweghị nghọta gbakwara ọchịchịrị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ntụgharị uche ha,” “echiche dị iche iche ha,” ma ọ bụ “ntule ha.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, okwu a bụ “obi” n’ọnụọgụ otu.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: N’ihi na
  rationale: Na-egosi na ihe e kwuru n’amaokwu a bụ ihe na-akọwa ihe e kwuru tupu ya.
- source_word: γνόντες τὸν θεὸν
  choice: ọ bụ ezie na ha maara Chineke
  rationale: 'Na-egosipụta ike nkwenye megidere ihe sochirinụ: ha maara Chineke, ma ha azaghị ya n’ụzọ kwesịrị ekwesị.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: ha enyeghị ya otuto dị ka Chineke
  rationale: Na-echekwa echiche nke inye Chineke nsọpụrụ na otuto kwesịrị ọnọdụ ya dị ka Chineke.
- source_word: ἢ ηὐχαρίστησαν
  choice: ha ekeleghịkwa ya
  rationale: Ọ bụ ụzọ Igbo doro anya na nke dị n’okike isi kwuo na ha enyeghị Chineke ekele.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: echiche ha ghọrọ ihe efu
  rationale: Na-ekwupụta na echiche na ntụgharị uche ha enweghịzi isi ma ọ bụ uru, n’enweghị itinye nkọwa banyere onye kpatara ya.
- source_word: ἐσκοτίσθη
  choice: e mekwara ka ... gbaa ọchịchịrị
  rationale: Na-echekwa olu nnara nke Grik na ihe atụ nke ọchịchịrị ime mmụọ na nke nghọta, ma ọ naghị akpọ onye mere ya aha.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: obi ha nke na-enweghị nghọta
  rationale: ‘Obi’ na-anọchi anya ime mmadụ—uche, nghọta, na mkpebi—ebe ‘nke na-enweghị nghọta’ na-ezere ime ka okwu ahụ bụrụ naanị okwu banyere enweghị ọgụgụ isi.
theological_decisions:
- issue: Ike nkwenye megidere ihe sochirinụ dị na γνόντες
  choice: ọ bụ ezie na ha maara Chineke
  alternative: ebe ha maara Chineke / ha maara Chineke
  rationale: Ọnọdụ okwu ahụ na-egosi na Pọl na-emesi mmejọ ha ike n’agbanyeghị na ha maara Chineke; nsụgharị a na-echekwa esemokwu ahụ n’enweghị ịkọwa ụdị ma ọ bụ oke ihe ọmụma ahụ.
- issue: Onye kpatara ime ka obi gbaa ọchịchịrị
  choice: Ahapụrụ onye mere ya n’ekwughị aha
  alternative: Chineke mere ka obi ha gbaa ọchịchịrị
  rationale: Okwu Grik dị n’olu nnara ma ọ kpọghị onye mere ihe ahụ aha; ya mere, nsụgharị ahụ anaghị etinye onye okwu mmalite ahụ na-ekwughị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị ùgwù ma dị mfe nghọta, mee nsụgharị ahụ. E debere ihe atụ nke ‘obi’ na ‘ọchịchịrị,’ ma tinye akara nkọwa ụkwụ n’ebe okwu ha na-akọwa dị kpọmkwem.
