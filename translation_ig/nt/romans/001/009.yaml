id: ROM.1.9
reference: Romans 1:9
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: ig
  text: N’ihi na Chineke, onye m na-ejere ozi n’ime mmụọ m n’ozi ọma nke Ọkpara ya, bụ àmà m na ana m akpọ unu aha mgbe niile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: onye àmà
  rationale: N’ebe a okwu ahụ na-egosi onye na-agba akaebe na ihe Pọl kwuru bụ eziokwu; “onye àmà” bụ ụzọ Igbo doro anya si kwuo ya.
- source_word: λατρεύω
  choice: na-ejere ozi
  rationale: Okwu Grik a nwere ike ịpụta ijere Chineke ozi ma ọ bụ ife ya ofufe. “Ijere ozi” na-echekwa echiche nke ọrụ okpukpe Pọl ji obi ya niile na-arụ.
- source_word: ἐν τῷ πνεύματί μου
  choice: n’ime mmụọ m
  rationale: Nsụgharị a na-edobe ọdịdị okwu Grik ma na-egosi na ozi Pọl sitere n’ime ime ya; a pụkwara ịghọta ἐν dịka ụzọ o si eje ozi.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: site n’ozi ọma banyere Ọkpara ya
  rationale: ἐν nwere ike igosi mpaghara ma ọ bụ ụzọ ọrụ ahụ si aga. N’Igbo, “site n’ozi ọma” na-egosi na Pọl na-eje ozi site n’ikwusa ozi ahụ; genitive ahụ ka a sụgharịrị “banyere Ọkpara ya” iji mee ka isiokwu ozi ọma ahụ doo anya.
- source_word: ἀδιαλείπτως
  choice: mgbe niile
  rationale: Ọ na-egosi omume a na-eme n’akwụsịghị akwụsị ma ọ bụ mgbe nile, n’ụzọ Igbo dị mfe ma bụrụkwa nke okike.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: na-ekwupụta unu
  rationale: Akpaala okwu ahụ pụtara n’ụzọ nkịtị ‘ime nkwupụta banyere unu.’ “Na-ekwupụta unu” na-ezere ịgbasa ya ka ọ bụrụ naanị icheta unu, ma na-anọgide bụrụ Igbo a pụrụ ịghọta.
theological_decisions:
- issue: Ma εὐαγγέλιον τοῦ υἱοῦ αὐτοῦ ọ bụ ‘ozi ọma nke Ọkpara ya’ ka ọ bụ ‘ozi ọma banyere Ọkpara ya’
  choice: ozi ọma banyere Ọkpara ya
  alternative: ozi ọma nke Ọkpara ya
  rationale: Genitive Grik ahụ nwere ike igosi isiokwu ma ọ bụ njikọ/onwunwe. “Banyere Ọkpara ya” na-egosi Ọkpara ahụ dịka isiokwu ozi ọma, ma ekwesịghị ileghara nsụgharị nke na-edobe genitive anya.
- issue: Ma ἐν τῷ πνεύματί μου ọ na-egosi ọnọdụ ime mmụọ ka ọ bụ ụzọ e si eje ozi
  choice: n’ime mmụọ m
  alternative: jiri mmụọ m
  rationale: '“N’ime mmụọ m” na-edobe mgbagwoju anya nke ἐν: ọ nwere ike ịpụta ebe ime ime ọrụ ahụ si abịa ma ọ bụ ụzọ e si arụ ya, n’enweghị imechi ya n’otu nkọwa.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A họọrọ “Ọkpara” maka υἱός n’ihi na ọ bụ okwu Baịbụl Igbo a maara nke ọma ma na-egosi nwa nwoke pụrụ iche; a zere okwu ụka siri ike ebe okwu nkịtị zuru ezu.
