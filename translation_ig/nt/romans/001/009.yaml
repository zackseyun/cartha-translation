revisions:
- from: N’ihi na Chineke, onye m na-ejere ozi n’ime mmụọ m site n’ozi ọma banyere Ọkpara ya, bụ onye àmà m na m na-ekwupụta unu mgbe niile.
  to: N’ihi na Chineke, onye m na-ejere ozi n’ime mmụọ m n’ozi ọma nke Ọkpara ya, bụ àmà m na ana m akpọ unu aha mgbe niile.
  rationale: The revision corrects the idiomatic rendering of Paul’s continual mention of the Roman believers, removes unnecessary interpretive specification of the gospel’s relation to God’s Son, and uses a more natural predicate for God as Paul’s witness. It otherwise preserves the source order and its compact, formal register.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains God as witness, Paul's service, continuality, and the personal/spiritual dimension of his service. However, “site n’ozi ọma banyere Ọkpara ya” narrows both ἐν (“in,” not specifically “through”) and the genitive τοῦ υἱοῦ αὐτοῦ (“of his Son,” whose precise relation should not be made explicit here).
  naturalness: “Na-ekwupụta unu” is not a natural rendering of μνείαν ὑμῶν ποιοῦμαι and can suggest proclaiming or declaring the readers. “Ana m akpọ unu aha” is idiomatic Standard Igbo for regularly mentioning people, especially in a devotional/prayer-related context, without adding an explicit reference to prayer.
  terminology: “Chineke,” “na-ejere ozi,” “mmụọ m,” and “Ọkpara ya” are suitable and appropriately reverent Standard Igbo choices. “Bụ àmà m” is more idiomatic than “bụ onye àmà m” in this oath-like appeal.
  issues:
  - severity: medium
    issue: The phrase “site n’ozi ọma banyere Ọkpara ya” is interpretively narrowed.
    rationale: The Greek has ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ. “Site na” makes the gospel a means, while “banyere” selects a subjective/objective explanatory sense for the genitive. “N’ozi ọma nke Ọkpara ya” stays closer and preserves the source ambiguity.
  - severity: high
    issue: “M na-ekwupụta unu” does not naturally convey “I make mention of you.”
    rationale: In Standard Igbo it can imply declaring or proclaiming the people themselves rather than mentioning them. “Ana m akpọ unu aha” clearly and idiomatically expresses repeated mention.
  - severity: low
    issue: “Onye àmà m” is less natural than “àmà m” for God as witness.
    rationale: The Greek predicate noun μάρτυς is adequately and more idiomatically represented by “àmà m” in this construction.
  revised_text: N’ihi na Chineke, onye m na-ejere ozi n’ime mmụọ m n’ozi ọma nke Ọkpara ya, bụ àmà m na ana m akpọ unu aha mgbe niile.
  revised_footnotes: []
  revision_rationale: The revision corrects the idiomatic rendering of Paul’s continual mention of the Roman believers, removes unnecessary interpretive specification of the gospel’s relation to God’s Son, and uses a more natural predicate for God as Paul’s witness. It otherwise preserves the source order and its compact, formal register.
