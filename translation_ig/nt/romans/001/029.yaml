  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: ig
  text: ndị juputara n’ụdị ajọ omume niile[a], ihe ọjọọ, anyaukwu na obi ọjọọ; ndị jupụtara n’anyaụfụ, igbu mmadụ, esemokwu, aghụghọ na ajọ obi; ndị na-agba asịrị na nzuzo[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ajọ omume niile”; akpaokwu Grik ahụ na-egosi oke zuru ezu.
    reason: lexical_alternative
  - marker: b
    text: A pụkwara ịsụgharị ya, “ndị na-agba asịrị” ma ọ bụ “ndị na-ekwutọ mmadụ na nzuzo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: ndị juputara
  rationale: Na-egosi ọnọdụ ha nọ na ya n’ihi na ha ejupụtala n’ihe ndị a; okwu Igbo a dị mfe ma na-echekwa echiche perfect passive participle ahụ.
- source_word: πάσῃ ἀδικίᾳ
  choice: n’ụdị ajọ omume niile
  rationale: Na-egosipụta oke zuru ezu nke πάσῃ tinyere aha nkịtị ἀδικίᾳ, n’Igbo a na-asụ nke ọma.
- source_word: πονηρίᾳ
  choice: ihe ọjọọ
  rationale: Ọ bụ okwu sara mbara maka omume ọjọọ, ma ọ dị iche ntakịrị na obi ọjọọ e ji sụgharịa κακίᾳ.
- source_word: πλεονεξίᾳ
  choice: anyaukwu
  rationale: Okwu Igbo a na-egosi ọchịchọ ijide ma ọ bụ nweta ihe karịrị akarị.
- source_word: κακίᾳ
  choice: obi ọjọọ
  rationale: Na-egosi ajọ ọchịchọ mmadụ nwere n’ebe ndị ọzọ nọ ma na-enyere aka ịmata ọdịiche ya na πονηρίᾳ.
- source_word: μεστοὺς
  choice: ndị jupụtara
  rationale: Na-echekwa mgbanwe okwu Grik site n’iji ụdị okwu dịtụ iche na 'ndị juputara,' ma ka bụrụ Igbo dị mma.
- source_word: φθόνου
  choice: anyaụfụ
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa mwute ma ọ bụ iwe n’ihi ihe ọma onye ọzọ nwere.
- source_word: φόνου
  choice: igbu mmadụ
  rationale: Na-enye ịdị arọ nke omume igbu mmadụ n’usoro ajọ omume a.
- source_word: ἔριδος
  choice: esemokwu
  rationale: Na-egosi ọgụ okwu, ndọrọ ndọrọ na adịghị n’otu.
- source_word: δόλου
  choice: aghụghọ
  rationale: Okwu doro anya maka iji ụzọ nduhie mmadụ.
- source_word: κακοηθείας
  choice: echiche ọjọọ
  rationale: Na-egosi àgwà ma ọ bụ uche nke na-atụgharị ihe n’ụzọ ọjọọ, ma na-ezere ijikọ ya kpamkpam na κακίᾳ.
- source_word: ψιθυριστάς
  choice: ndị na-agba asịrị na nzuzo
  rationale: Na-echekwa echiche nke ikwu okwu ọjọọ banyere ndị ọzọ n’olu nta ma ọ bụ na nzuzo.
