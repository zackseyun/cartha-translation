id: ROM.1.15
reference: Romans 1:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: ig
  text: Ya mere, n’aka nke m, ọ na-agụsi m agụụ ike ịkpọsara[a] unu kwa, ndị nọ na Rom, ozi ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “ikwusara unu kwa, ndị nọ na Rom, ozi ọma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Ya mere
  rationale: N’ebe a, okwu a na-ejikọta ihe Pọl kwuru tupu ya na nkwupụta ọchịchọ ya; “Ya mere” na-egosi nkwubi okwu ahụ n’Igbo doro anya.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: n’aka nke m, ọ na-agụsi m agụụ ike
  rationale: Akpaokwu Grik a dị mkpụmkpụ ma bụrụ akpaalaokwu. Nsụgharị a na-egosi ma ọchịchọ siri ike ma ịdị njikere Pọl, n’enweghị ịsụgharị ya n’ụzọ siri ike nghọta.
- source_word: καὶ ὑμῖν
  choice: unu
  rationale: A na-etinye ndị nọ na Rom n’etiti ndị ọzọ Pọl chọrọ izi ozi ọma. N’usoro ahịrịokwu Igbo a, echiche mgbakwunye dị n’okwu gbara ya gburugburu; itinye “kwa” nwere ike ime ka ihe ọ na-akọwa ghara ido anya.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: ndị nọ na Rom
  rationale: Nke a na-akọwapụta ndị a na-agwa okwu dị ka ndị bi ma ọ bụ nọ na Rom, n’ụzọ Igbo na-asụkarị.
- source_word: εὐαγγελίσασθαι
  choice: ịkpọsara ... ozi ọma
  rationale: Ngwaa a pụtara ikwupụta ma ọ bụ ịkpọsa ozi ọma. Nhọrọ a bụ Igbo dị ugbu a ma ghara ime ka ọrụ ahụ bụrụ naanị ikwusa okwu n’ọgbakọ.
theological_decisions:
- issue: Ma εὐαγγελίσασθαι ga-abụ okwu ụka pụrụ iche ma ọ bụ okwu nkịtị maka ịkpọsa ozi ọma
  choice: ịkpọsara ... ozi ọma
  alternative: ikwusara ... oziọma
  rationale: Isi nsụgharị na-eme ka ihe ngwaa Grik pụtara doo ndị nkịtị anya, ebe ihe e dere n’ala peeji na-edebe ụzọ e si asụ okwu ahụ dịka okwu a maara nke ọma n’ọgbakọ Kraịst.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. “Ọ na-agụsi m agụụ ike” na-egosi ịnụ ọkụ n’obi na ọchịchọ siri ike, ọ bụghị naanị na Pọl dị njikere.
