  text: τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: ig
  text: Ya bụ, ka mụ na unu gbaa ibe anyị ume n’etiti unu, site n’okwukwe unu na nke m.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: Ya bụ
  rationale: Ọ na-ewebata nkọwa nke ihe Pọl kwuru tupu ya; “Ya bụ” bụ Igbo nkịtị ma na-echekwa ọrụ nkọwa ahụ.
- source_word: συμπαρακληθῆναι
  choice: ka mụ na unu gbaa ibe anyị ume
  rationale: Ngwaa a na-egosi ịgba ume ọnụ na n'ụzọ na-erute akụkụ abụọ. Ntughari a na-eme ka mmekọrịta ahụ doo anya n’Igbo, n’agbanyeghị na infinitive Grik enweghị isiokwu e dere kpọmkwem.
- source_word: ἐν ὑμῖν
  choice: mụ na unu
  rationale: N’ebe a, okwu ahụ na-ezo aka n’ịgba ume nke ga-eme n’etiti Pọl na ndị kwere ekwe nọ na Rom; etinyere ya n’usoro ahịrịokwu Igbo ka okwu ahụ bụrụ nke e ji ọnụ ekwu nke ọma.
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: site n’okwukwe anyị nwere n’ebe ibe anyị nọ
  rationale: “Site” na-egosi ụzọ e si enweta agbamume ahụ, ebe “n’ebe ibe anyị nọ” na-echekwa echiche mmekọrịta dị na ἐν ἀλλήλοις.
- source_word: πίστεως
  choice: okwukwe
  rationale: N’ebe a πίστις pụtara okwukwe ha, ọ bụghị isi nraranye ma ọ bụ ntụkwasị obi mmadụ n’ozuzu.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: ma nke unu ma nke m
  rationale: Nke a na-echekwa nha anya dị n’etiti okwukwe ndị Rom na nke Pọl.
theological_decisions:
- issue: Ma agbamume a bụ naanị nke Pọl na-enye ha, ka ọ bụ nke ha na-enye ibe ha
  choice: Agbamume na-erute Pọl na ndị kwere ekwe nọ na Rom n’ụzọ abụọ
  alternative: Pọl bụ isi onye na-agba ha ume
  rationale: Ngwaa συμπαρακληθῆναι na nkebi “ma nke unu ma nke m” na-egosi mmekọrịta na agbamume sitere n’akụkụ abụọ; ya mere, a zere ime ka ozi ahụ bụrụ naanị nke Pọl na-enye ha.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị mfe nghọta ma nwee ugwu. “Gbaa ibe anyị ume” na-ada nke ọma karịa ntụgharị nkịtị nke nwere ike ime ka ahịrịokwu sie ike, ma ọ na-echekwa echiche nke agbamume ọnụ.
