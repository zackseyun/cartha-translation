revisions:
- from: Ya bụ, ka mụ na unu gbaa ibe anyị ume site n’okwukwe anyị nwere n’ebe ibe anyị nọ—ma nke unu ma nke m.[a]
  to: Ya bụ, ka mụ na unu gbaa ibe anyị ume n’etiti unu, site n’okwukwe unu na nke m.
  rationale: The revision preserves the explanatory “Ya bụ,” the reciprocal encouragement, the setting “n’etiti unu” for ἐν ὑμῖν, and the balanced reference to the Romans’ faith and Paul’s faith. The active reciprocal Igbo expression is natural while conveying the sense of being encouraged together. The unsupported and potentially misleading footnote is removed.
  reviewer_model: gpt-5.6-terra
