id: ROM.1.18
reference: Romans 1:18
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: ig
  text: N’ihi na a na-ekpughe[a] iwe Chineke site n’eluigwe megide enweghị nsọpụrụ Chineke niile na ajọ omume niile nke ndị mmadụ[b] bụ́ ndị ji ajọ omume[c] na-egbochi[d] eziokwu[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụ ya, “a na-eme ka ọ pụta ìhè.”
    reason: lexical_alternative
  - marker: b
    text: Okwu Grik a pụtara ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ime ajọ omume ha.”
    reason: lexical_alternative
  - marker: d
    text: N’ebe a, “na-egbochi” nwekwara ike ịbụ “na-ejide n’okpuru” ma ọ bụ “na-egbochi ka ọ ghara ịpụta ìhè.”
    reason: lexical_alternative
  - marker: e
    text: A pụkwara ịsụ akụkụ a, “ajọ omume nke ndị mmadụ bụ́ ndị na-egbochi eziokwu site n’ajọ omume.”
    reason: previous_rendering
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: a na-ekpughe
  rationale: Okwu Grik a bụ ngwaa dị na present passive; “a na-ekpughe” na-egosi na Chineke na-eme ka iwe ya pụta ìhè, ma ọ naghị eme ka onye na-eme ihe ahụ bụrụ ihe e kwuru kpọmkwem.
- source_word: γὰρ
  choice: N’ihi na
  rationale: Ọ na-ejikọta amaokwu a na ihe e kwuru tupu ya dịka nkọwa ma ọ bụ ihe ndabere.
- source_word: ὀργὴ θεοῦ
  choice: iwe Chineke
  rationale: Nke a na-edobe iwe ahụ dịka iwe nke Chineke n’onwe ya, ọ bụghị naanị nsonaazụ ajọ omume na-apụta n’onwe ya.
- source_word: ἀπ’ οὐρανοῦ
  choice: site n’eluigwe
  rationale: Ọ na-egosi ebe mkpughe ahụ si bịa n’ụzọ doro anya ma dịkwa eke n’Igbo.
- source_word: πᾶσαν ἀσέβειαν
  choice: ụdị enweghị nsọpụrụ Chineke niile
  rationale: “Enweghị nsọpụrụ Chineke” na-egosi omume na ọnọdụ mmadụ megide Chineke; “ụdị ... niile” na-enye πᾶσαν ike zuru ezu n’Igbo.
- source_word: ἀδικίαν
  choice: ajọ omume
  rationale: “Ajọ omume” bụ okwu Igbo sara mbara nke nwere ike ịgụnye omume na-ezighị ezi, ajọ ndụ, na mmebi ihe ziri ezi, dịka ἀδικία si arụ ọrụ ebe a.
- source_word: ἀνθρώπων
  choice: ndị mmadụ
  rationale: Okwu a na-ezo aka n’ụmụ mmadụ n’ozuzu, ọ bụghị naanị ụmụ nwoke.
- source_word: τῶν ... κατεχόντων
  choice: bụ́ ndị ... egbochi
  rationale: Nkebi a na-akọwa ndị mmadụ ahụ; “egbochi” na-egosi na ha na-eme ka eziokwu ghara ịrụ ọrụ ma ọ bụ pụta ìhè.
- source_word: τὴν ἀλήθειαν
  choice: eziokwu
  rationale: Ọ bụ ntụgharị kpọmkwem, nke na-adịghị eme ka ihe ἀλήθεια pụtara dị warara.
- source_word: ἐν ἀδικίᾳ
  choice: ji ajọ omume
  rationale: “Ji” na-egosi ajọ omume dịka ụzọ ma ọ bụ ihe e ji egbochi eziokwu; a ka na-edebe nghọta nke “n’ime ajọ omume” na nkọwa ala peeji.
theological_decisions:
- issue: Ma ὀργὴ θεοῦ ọ̀ bụ iwe ikpe nke Chineke n’onwe ya ka ọ̀ bụ naanị nsonaazụ mmehie na-abịa n’onwe ya
  choice: iwe Chineke
  alternative: nsonaazụ ajọ omume na-eweta n’onwe ya
  rationale: Nhazi okwu Grik na arụmụka Pọl na-egosi nzaghachi ikpe nke Chineke n’onwe ya. Nsụgharị ahụ anaghị eme ka okwu ahụ dị nro ma ọ bụ tinye nkọwa ọzọ na-adịghị na ya.
- issue: Mmekọrịta ἐν ἀδικίᾳ na ngwaa κατεχόντων
  choice: ji ajọ omume egbochi eziokwu
  alternative: n’ime ajọ omume ha ka ha na-egbochi eziokwu
  rationale: “Ji” na-ewere nkebi ahụ dịka ụzọ ha si egbochi eziokwu, ma ihe Grik kwuru nwekwara ike ịbụ ọnọdụ ma ọ bụ gburugburu ajọ omume ha; e debere nke ahụ n’ala peeji.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dị mfe nghọta. A họọrọ “enweghị nsọpụrụ Chineke” kama okwu ụka pụrụ iche, ma e jiri “ajọ omume” ugboro abụọ iji chekwaa nkwughachi ἀδικία ... ἀδικίᾳ dị n’asụsụ Grik. Akara ala peeji [a] ruo [e] niile dị n’ederede isi.
