  - severity: low
    issue: “n’ụzọ anụ ahụ” for κατὰ σάρκα
    rationale: The phrase can be heard as “in a physical way.” “N’anụ ahụ” more directly preserves the source expression and its contextual reference to human/Davidic descent.
