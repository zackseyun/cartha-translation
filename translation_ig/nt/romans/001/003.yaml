source:
  edition: SBLGNT
  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: ig
  text: banyere Nwa ya nwoke, onye sitere ná mkpụrụ Devid n’anụ ahụ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “N’anụ ahụ” n’ebe a na-ezo aka n’agbụrụ mmadụ ya, ya bụ, n’ịsite n’agbụrụ Devid; ọ bụghị n’ọdịdị mmehie.
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: banyere
  rationale: Ọ na-ewebata onye ozi ọma ahụ metụtara, ma na-edobe usoro okwu Pọl n'ụzọ dị nkenke ma doo anya.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: Ọkpara ya
  rationale: “Ọkpara” bụ okwu Igbo e ji akọwa nwa nwoke n’ụzọ kwesịrị nsọpụrụ; mkpụrụedemede ukwu na-eme ka o doo anya na onye a na-ekwu banyere ya bụ Ọkpara Chineke.
- source_word: τοῦ γενομένου ἐκ
  choice: onye sitere ná
  rationale: Nke a na-egosi mmalite ma ọ bụ agbụrụ onye ahụ n’enweghị ime ka ọ bụrụ nanị nkọwa usoro ọmụmụ, ma ọ bụ kọwaa ihe omimi banyere ịbụ Ọkpara Chineke.
- source_word: σπέρματος Δαυὶδ
  choice: mkpụrụ Devid
  rationale: “Mkpụrụ” na-edobe ihe oyiyi na ụda Akwụkwọ Nsọ nke σπέρμα, ma n’ebe a ọ pụtara ụmụ ụmụ ma ọ bụ agbụrụ Devid.
- source_word: κατὰ σάρκα
  choice: n’ụzọ anụ ahụ
  rationale: Nke a na-edobe okwu dị arọ bụ σάρξ, ma na-ezo aka n’agbụrụ mmadụ na ndụ elu ụwa, ọ bụghị n’ọdịdị mmehie.
theological_decisions:
- issue: Mmekọrịta dị n’etiti ịbụ Ọkpara Chineke na isite n’agbụrụ Devid
  choice: 'E debere ha abụọ n’ụzọ kwụ ọtọ: “Ọkpara ya” na “onye sitere ná mkpụrụ Devid n’ụzọ anụ ahụ.”'
  alternative: “Ọkpara ya, onye n’ọdịdị mmadụ bụ nwa nwa Devid.”
  rationale: Isi mmalite ahụ jikọtara ịbụ Ọkpara Chineke na ezi agbụrụ mmadụ sitere na Devid n’enweghị ịkọwa otú ha si dịrịkọ; nsụgharị ahụ echekwala esemokwu nkà mmụta okpukpe a kama idozi ya n’okwu ozizi e mepụtara mgbe e mesịrị.
translation_notes:
  register: Asụsụ Igbo Izugbe dị ugbu a, dị ùgwù ma dị mfe nghọta. A họọrọ “mkpụrụ Devid” iji chekwaa ihe oyiyi nke okwu Grik na ụda Akwụkwọ Nsọ; nkọwa ala peeji na-egbochi nghọtahie banyere “anụ ahụ.”
