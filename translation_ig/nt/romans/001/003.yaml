  verdict: revise
  source_fidelity: A safe correction is needed. “Ọkpara” normally denotes a firstborn/eldest son and therefore introduces a specification not present in υἱός. Also, “n’ụzọ anụ ahụ” can suggest a bodily manner; the Greek κατὰ σάρκα here qualifies Davidic origin in terms of flesh/human descent.
  naturalness: The revised wording is clear, idiomatic Standard Igbo, and retains the compact elevated register appropriate to Paul’s sentence.
  terminology: “Nwa ya nwoke” renders “his Son” without the unsupported firstborn sense. “Mkpụrụ Devid” preserves the biblical seed/offspring expression, while “n’anụ ahụ” retains the key σάρξ language without converting it into a later doctrinal formulation.
