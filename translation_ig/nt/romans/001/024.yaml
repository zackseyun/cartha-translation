id: ROM.1.24
reference: Romans 1:24
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: ig
  text: Ya mere, Chineke nyefere ha, n’ime ọchịchọ dị iche iche nke obi ha, n’adịghị ọcha, maka iweda ahụ ha n’ala n’etiti onwe ha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti ha”; ikekwe, “n’ime onwe ha.”
    reason: Akụkụ Grik ἐν αὐτοῖς dị mkpụmkpụ, a pụkwara ịghọta ya dịka mmekọrịta dị n’etiti ha ma ọ bụ ihe na-eme n’ime ha onwe ha.
lexical_decisions:
- source_word: Διὸ
  choice: Ya mere
  rationale: Ọ na-egosi nkwubi okwu sitere n’ihe e kwuru tupu ya, ma bụrụkwa okwu Igbo doro anya nke na-echekwa njikọ echiche ahụ.
- source_word: παρέδωκεν
  choice: nyefere ha
  rationale: Ọ na-echekwa echiche nke inyefe mmadụ n’aka ike ma ọ bụ ọnọdụ na-achị ya, n’etinyeghị nkọwa okpukpe karịrị ihe ederede kwuru.
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: n’ime ọchịchọ nke obi ha
  rationale: ‘N’ime’ na-egosi ọnọdụ ma ọ bụ mpaghara ọchịchọ ndị ahụ nọ na ya; ‘obi’ na-echekwa ụzọ Akwụkwọ Nsọ si ekwu maka ndụ ime mmadụ.
- source_word: ἐπιθυμίαις
  choice: ọchịchọ
  rationale: Okwu a sara mbara ma ghara ime ka ihe Grik kwuru bụrụ naanị agụụ mmekọahụ tupu ihe gbara amaokwu ahụ gburugburu kọwaa ya.
- source_word: ἀκαθαρσίαν
  choice: adịghị ọcha
  rationale: Nke a bụ okwu Igbo nkịtị nke na-egosi adịghị ọcha n’omume na n’ụzọ ime mmụọ n’enweghị asụsụ ochie ma ọ bụ nkọwa agbakwunyere.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: maka iweda ... n’ala
  rationale: Nhazi a na-anọgide nso n’ụdị infinitive nke Grik ma na-egosi ihe inyefe ahụ rụpụtara ma ọ bụ zubere, na-enweghị ịgbanwe ya ka ọ bụrụ ngwaa zuru ezu.
- source_word: τὰ σώματα αὐτῶν
  choice: ahụ ha
  rationale: Ọ na-echekwa okwu kpọmkwem banyere ahụ mmadụ na nkwusi ike Pọl tinyere n’ahụ.
- source_word: ἐν αὐτοῖς
  choice: n’etiti onwe ha
  rationale: Nke a na-egosi mmekọrịta dị n’etiti ha ma bụrụ Igbo a na-aghọta nke ọma; a hapụrụ ụzọ nghọta ndị ọzọ n’ihe odide ala peeji.
theological_decisions:
- issue: Ma a ga-akọwa παρέδωκεν n’ụzọ siri ike dịka ‘Chineke gbahapụrụ ha n’ikpe.’
  choice: nyefere ha
  alternative: gbahapụrụ ha; jiri inyefe ha kpee ha ikpe
  rationale: Ederede ahụ kwuru na Chineke nyefere ha, ma ọ kọwaghị usoro ahụ n’okwu nkà mmụta okpukpe sara mbara. Nhọrọ a na-echekwa ịdị arọ na esemokwu dị n’ederede n’etinyeghị ozizi ọzọ.
- issue: Mmekọrịta nke τοῦ ἀτιμάζεσθαι na inyefe ahụ—ebumnobi ka ọ bụ nsonaazụ.
  choice: maka iweda ahụ ha n’ala
  alternative: nke mere ka e wedaa ahụ ha n’ala
  rationale: ‘Maka’ na-anọ nso n’ụdị Grik ma na-ahapụ ntakịrị nghọta abụọ ahụ kama ikpebi kpamkpam na ọ bụ naanị nsonaazụ.
translation_notes:
  register: Asụsụ Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘nyefere’ zere ‘gbahapụrụ,’ nke ga-etinye nkọwa karịrị okwu Grik; e jikwa ‘ọchịchọ’ kama okwu na-egosi naanị agụụ mmekọahụ.
