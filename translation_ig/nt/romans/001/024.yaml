revisions:
- from: Ya mere, Chineke nyefere ha n’adịghị ọcha n’ime ọchịchọ nke obi ha, maka iweda ahụ ha n’ala n’etiti onwe ha.[a]
  to: Ya mere, Chineke nyefere ha, n’ime ọchịchọ dị iche iche nke obi ha, n’adịghị ọcha, maka iweda ahụ ha n’ala n’etiti onwe ha.[a]
  rationale: The revision moves the phrase “n’ime ọchịchọ dị iche iche nke obi ha” next to “nyefere ha” and keeps “n’adịghị ọcha” as the destination of that handing-over. It also represents the plural desires more explicitly. The footnote is retained because the ambiguity of ἐν αὐτοῖς should not be resolved in the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the main elements of the verse, including the inference, divine handing-over, impurity, bodies, and the ambiguity of ἐν αὐτοῖς. However, its word order makes n’adịghị ọcha appear to be the immediate sphere of nyefere ha, while n’ime ọchịchọ nke obi ha is subordinated to it. The Greek more clearly places the handing-over within their heart-desires and directs it toward impurity.
  naturalness: The proposed revision uses a clearer Igbo sequence and more naturally expresses the plural force of ἐπιθυμίαις as ọchịchọ dị iche iche. “N’etiti onwe ha” remains understandable and idiomatic enough in this context.
  terminology: “Chineke nyefere ha” appropriately renders παρέδωκεν without importing an expanded doctrinal interpretation. “Adịghị ọcha” is a suitable broad rendering of ἀκαθαρσία. “Iweda ahụ ha n’ala” retains the dishonoring sense, though Igbo does not readily mark the Greek passive infinitive in this compact construction.
  issues:
  - severity: medium
    issue: The order of the phrases governing παρέδωκεν is potentially misleading.
    rationale: “Chineke nyefere ha n’adịghị ọcha n’ime ọchịchọ nke obi ha” can be read as handing them over in impurity, rather than handing them over, in the desires of their hearts, to impurity. Reordering the phrases better reflects ἐν ... εἰς.
  - severity: low
    issue: The plural nuance of ἐπιθυμίαις is not explicit.
    rationale: Igbo can use a singular abstract noun collectively, but “ọchịchọ dị iche iche” more clearly represents the Greek plural without narrowing the desires to one kind.
  revised_text: Ya mere, Chineke nyefere ha, n’ime ọchịchọ dị iche iche nke obi ha, n’adịghị ọcha, maka iweda ahụ ha n’ala n’etiti onwe ha.[a]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “n’etiti ha”; ikekwe, “n’ime onwe ha.”
    reason: Akụkụ Grik ἐν αὐτοῖς dị mkpụmkpụ, a pụkwara ịghọta ya dịka mmekọrịta dị n’etiti ha ma ọ bụ ihe na-eme n’ime ha onwe ha.
  revision_rationale: The revision moves the phrase “n’ime ọchịchọ dị iche iche nke obi ha” next to “nyefere ha” and keeps “n’adịghị ọcha” as the destination of that handing-over. It also represents the plural desires more explicitly. The footnote is retained because the ambiguity of ἐν αὐτοῖς should not be resolved in the main text.
