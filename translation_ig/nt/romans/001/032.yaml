source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: ig
  text: Ndị ahụ, ọ bụ ezie na ha maara ikpe ziri ezi nke Chineke[a]—na ndị na-eme ụdị ihe ndị a kwesịrị ọnwụ—ọ bụghị nanị na ha na-eme ihe ndị a, kamakwa ha na-akwadokwa ndị na-eme ha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘iwu,’ ‘ihe a chọrọ,’ ma ọ bụ ‘mkpebi ikpe.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: Ndị a
  rationale: Ọ na-ezo aka n’ụdị ndị ahụ a kọwara n’okwu bu ụzọ; ‘Ndị a’ na-eme ka njikọ ahụ doo anya n’Igbo.
- source_word: δικαίωμα
  choice: ikpe ziri ezi
  rationale: N’ebe a, okwu ahụ na-egosi mkpebi ikpe Chineke nke ziri ezi gbasara omume ndị a; ntụgharị a na-edobe ma echiche ikpe ma ịdị ezi ya.
- source_word: ἐπιγνόντες
  choice: ọ bụ ezie na ha maara
  rationale: 'A sụgharịrị participle ahụ dị ka nkwenye na-emegide omume ha: ha maara ikpe Chineke, ma ha ka na-eme ihe ndị ahụ.'
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ndị na-eme ihe ndị dị otu a
  rationale: Nkebi okwu a na-egosi omume a na-eme ugboro ugboro ma ọ bụ ụzọ ndụ, ọ bụghị naanị otu ihe mere otu mgbe.
- source_word: ἄξιοι θανάτου
  choice: kwesịrị ọnwụ
  rationale: Nke a na-ebute ike nke nkwupụta ikpe dị na Grik n’ụzọ doro anya ma bụrụkwa Igbo nkịtị.
- source_word: ποιοῦσιν
  choice: na-eme ha
  rationale: Ọ na-asụgharị ngwaa ahụ ozugbo ma na-edobe ihe ndị ahụ dị ka ihe okwu nnọchi ‘ha’ na-ezo aka na ya.
- source_word: συνευδοκοῦσιν
  choice: na-akwadokwa
  rationale: Ọ pụtara na ha na-ekwenye ma na-enye omume ndị ọzọ nkwado, ọ bụghị nanị na ha na-anọnyere ha.
- source_word: τοῖς πράσσουσιν
  choice: ndị na-eme ha
  rationale: Ọ na-edobe ntụnyere na nkebi okwu mbụ ma na-egosi ndị na-anọgide n’omume ndị ahụ.
theological_decisions:
- issue: Ihe ‘kwesịrị ọnwụ’ pụtara
  choice: E debere ya dị ka ikpe Chineke, n’akọwaghị ụdị ọnwụ ahụ karịa ihe amaokwu ahụ kwuru.
  alternative: Ịkọwa ya kpọmkwem dị ka ntaramahụhụ ọnwụ nke ọchịchị obodo, ma ọ bụ kpọmkwem dị ka ọnwụ ikpeazụ.
  rationale: Amaokwu ahụ ekwughị kpọmkwem ókè ma ọ bụ ụdị ọnwụ ahụ; ntụgharị ahụ na-edobe ibu okwu ikpe ahụ n’enweghị ịmanye otu nkọwa.
translation_notes:
  register: Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E ji ‘ọ bụ ezie na’ gosipụta esemokwu dị n’etiti ihe ha maara na ihe ha na-eme; e debere ahịrịokwu ahụ dịka ihe na-aga n’ihu site n’okwu gbara ya gburugburu.
