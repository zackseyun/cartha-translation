  verdict: revise
  source_fidelity: 'The draft accurately represents the three appositional descriptions in the Greek: Paul as δοῦλος of Messiah Jesus, κλητὸς ἀπόστολος, and one set apart for God’s gospel. “Ohu,” “Mezaya Jizọs,” “onye e doro iche,” and “ozi ọma Chineke” are sound choices. The phrase “onye a kpọrọ ịbụ onyeozi,” however, is not idiomatic Standard Igbo and obscures the compact adjectival force of κλητὸς ἀπόστολος.'
  naturalness: A small revision to “onyeozi a kpọrọ” gives a natural, concise Igbo appositional phrase matching the Greek structure. The rest is clear, formal, and appropriately modern.
  terminology: “Ohu” rightly retains the force of δοῦλος; “Mezaya” properly renders Χριστός as a title; “ozi ọma Chineke” is established and natural theological terminology. Footnote b appropriately supplies the conventional alternative “Kraịst Jizọs.”
  issues:
  - severity: medium
    issue: Unidiomatic rendering of κλητὸς ἀπόστολος
