id: ROM.1.1
reference: Romans 1:1
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: ig
  text: Pọl, ohu[a] Mezaya Jizọs[b], onyeozi a kpọrọ[c], onye e doro iche maka ozi ọma Chineke,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onye na-eje ozi”; okwu Grik ahụ nwekwara ike ịpụta ohu nke nna ya ukwu nwere.
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Kraịst Jizọs.” “Mezaya” na “Kraịst” na-ezo aka n’Onye E Tere Mmanụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “onye a kpọrọ ka ọ bụrụ onyeozi.”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Pọl
  rationale: Ọ bụ nsụgharị aha Παῦλος nke a na-eji n’Igbo ọkọlọtọ.
- source_word: δοῦλος
  choice: ohu
  rationale: “Ohu” na-egosipụta onye nọ n’okpuru nna ya ukwu ma bụrụ nke ya; nke a na-echekwa ike okwu Grik karịa naanị “onye na-eje ozi.”
- source_word: Χριστοῦ
  choice: Mezaya
  rationale: N’ebe a Χριστός bụ aha-ọkwa nke Onye E Tere Mmanụ; “Mezaya” na-eme ka ihe aha-ọkwa ahụ pụtara doo anya kama ide ya naanị dịka aha mmadụ.
- source_word: Ἰησοῦ
  choice: Jizọs
  rationale: Nke a bụ ụdị aha Ἰησοῦ a na-eji n’Igbo ọkọlọtọ.
- source_word: κλητὸς ἀπόστολος
  choice: onye a kpọrọ ịbụ onyeozi
  rationale: Ọ na-enye echiche na Chineke kpọrọ Pọl n’ọrụ onyeozi n’Igbo dị mfe ma doo anya, ebe ndetu ala na-echekwa ụdị okwu Grik dị mkpụmkpụ.
- source_word: ἀφωρισμένος
  choice: onye e doro iche
  rationale: Ọ na-echekwa olu nnara na echiche nke ikewapụ mmadụ maka otu ọrụ pụrụ iche.
- source_word: εἰς
  choice: maka
  rationale: N’ebe a ọ na-egosi ebumnuche ma ọ bụ ọrụ e kewapụrụ Pọl ịrụ.
- source_word: εὐαγγέλιον
  choice: ozi ọma
  rationale: Ọ bụ okwu Igbo doro anya ma guzosie ike maka ozi ọma nke Chineke.
- source_word: θεοῦ
  choice: Chineke
  rationale: “Ozi ọma Chineke” na-egosipụta njikọ genitivu ahụ n’Igbo eke, ma na-ahapụ ohere na ọ bụ ozi sitere n’aka Chineke nakwa ozi nke ya.
theological_decisions:
- issue: Otu e si sụgharịa Χριστός n’aha njirimara Pọl
  choice: Mezaya Jizọs
  alternative: Kraịst Jizọs
  rationale: E ji Χριστός mee aha-ọkwa n’ebe a, ya mere “Mezaya” na-echekwa echiche nke Onye E Tere Mmanụ; ndetu ala na-enye ụdị omenala “Kraịst.”
- issue: Ike okwu δοῦλος
  choice: ohu
  alternative: onye na-eje ozi
  rationale: “Ohu” na-echekwa echiche nke ịbụ onye nwe ya nwere ikike n’ebe ọ nọ, bụ́ ihe dị n’okwu Grik; “onye na-eje ozi” nwere ike ime ka ike ahụ daa mba.
- issue: Mmekọrịta κλητός na ἀπόστολος
  choice: onye a kpọrọ ịbụ onyeozi
  alternative: onyeozi a kpọrọ
  rationale: Nhọrọ bụ isi bụ Igbo eke nke na-egosi òkù e nyere Pọl, ma a naghị akọwa onye kpọrọ ya n’amaokwu a. Nhọrọ ọzọ dị nso n’usoro Grik ma ọ naghị ada nke ọma otú ahụ n’Igbo.
translation_notes:
  register: 'Asụsụ ahụ bụ Igbo ọkọlọtọ nke oge a, dị ùgwù ma dị mfe nghọta. E ji usoro nkebi atọ chekwaa nkọwa Pọl: ohu, onye a kpọrọ ịbụ onyeozi, na onye e doro iche. Akara ndetu ala niile dị n’ahịrị amaokwu ahụ.'
