    issue: “Ụmụ nwanyị ha” is ambiguous.
    rationale: Although it can denote women in some usage, it can also mean “their daughters.” Greek θήλειαι αὐτῶν refers to the females/women among them, not daughters. “Ndị inyom ha” removes this avoidable ambiguity.
  - severity: low
    issue: Footnote a gives an unnatural and insufficiently distinct lexical alternative.
    rationale: “Ndị nwanyị ha” is not idiomatic Standard Igbo for the intended human referent. A note explaining that θήλειαι is more literally “their females” better preserves the lexical observation.
