  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: ig
  text: N’ihi nke a, Chineke nyefere ha n’aka agụụ ndị na-eweta ihere. N’ihi na ọbụna ndị inyom ha[a] gbanwere mmekọrịta sitere n’okike[b], were ihe megidere okike[c] dochie ya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, n’ụzọ nkịtị karị, “ndị nke nwanyị ha” (ya bụ, “ndị inyom ha”).
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ “ojiji sitere n’okike.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ “ihe na-emegide okike.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi nke a
  rationale: Ọ na-egosi ihe kpatara ihe a soro mee ma jikọta amaokwu a na okwu ndị bu ya ụzọ.
- source_word: παρέδωκεν αὐτοὺς
  choice: nyefere ha n’aka
  rationale: Nke a bụ ụzọ Igbo doro anya si egosipụta inyefe mmadụ ka ihe ọzọ chịa ya, ma na-edobe ụda ikpe dị n’ebe a.
- source_word: πάθη ἀτιμίας
  choice: agụụ ndị na-eweta ihere
  rationale: “Agụụ” na-ebunye echiche πάθη n’asụsụ Igbo a na-asụ ugbu a, ebe “ndị na-eweta ihere” na-edobe ike nke ἀτιμίας n’etinyeghị nkọwa karịrị ihe odide ahụ.
- source_word: θήλειαι αὐτῶν
  choice: ụmụ nwanyị ha
  rationale: Ọ bụ okwu Igbo sitere n’okike ma kwekọọ n’ebe a mgbe a na-ekwu banyere mmadụ; a debere ntụgharị nkịtị karị, “ndị nwanyị ha,” n’okpuru ala.
- source_word: μετήλλαξαν
  choice: gbanwere … were … dochie ya
  rationale: Usoro a na-egosi mgbanwe ma ọ bụ iji otu ihe dochie ihe ọzọ, dịka ngwaa Grik ahụ si kwuo.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: mmekọrịta sitere n’okike
  rationale: “Mmekọrịta” na-eme ka ihe okwu a pụtara n’ọnọdụ a doo onye Igbo anya n’enweghị mkpụgharị okwu na-eduhie eduhie; ntụgharị nkịtị “ojiji sitere n’okike” dị n’okpuru ala.
- source_word: τὴν παρὰ φύσιν
  choice: ihe megidere okike
  rationale: Nke a na-edobe akpaalaokwu Grik ahụ na nkwupụta ikpe ya n’ụzọ doro anya ma ghara ịgbakwụnye ụdị omume ndị a kpọghị aha.
theological_decisions:
- issue: Ma a ga-eme ka ike okwu ikpe Pọl dị nro ma ọ bụ sie ike karịa ihe odide ahụ
  choice: E debere okwu ndị na-egosi “ihere” na “ihe megidere okike” n’enweghị nkọwa agbakwunyere.
  alternative: Iji okwu dị nro dịka “agụụ na-ekwesịghị ekwesị,” ma ọ bụ ịkọwapụta ụdị mmekọahụ nke oge a nke ihe odide ahụ akpọghị aha.
  rationale: Amaokwu ahụ n’onwe ya na-ekpe omume ahụ ikpe, ya mere ntụgharị ahụ kwesịrị idebe ike ahụ. Ma o kwesịghị itinye ozizi, aha, ma ọ bụ nkọwa omenala nke karịrị okwu Pọl.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ usoro dabara n’etiti ịdị nso n’okwu Grik na ịdị n’ụzọ Igbo sitere n’okike; e zere okwu ụka pụrụ iche na nkọwa banyere ụdị mmekọahụ nke ihe odide ahụ ekwughị kpọmkwem.
