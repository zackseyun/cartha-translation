  to: N’ihi nke a, Chineke nyefere ha n’aka agụụ ndị na-eweta ihere. N’ihi na ọbụna ndị inyom ha[a] gbanwere mmekọrịta sitere n’okike[b], were ihe megidere okike[c] dochie ya.
  rationale: The revision changes only the potentially daughter-specific expression “ụmụ nwanyị ha” to the unambiguous Standard Igbo “ndị inyom ha,” and repairs its corresponding lexical note. The rest of the draft faithfully and naturally communicates the Greek without adding interpretive categories.
