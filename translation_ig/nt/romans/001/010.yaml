id: ROM.1.10
reference: Romans 1:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: ig
  text: Mgbe niile n'ekpere m, ana m arịọ sị, ma eleghị anya, ugbu a n'ikpeazụ, m ga-enwe ihe ịga nke ọma, dịka uche Chineke si dị, n'ịbịakwute unu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ka e mee ka ụzọ m gaa nke ọma,” ma ọ bụ, “ka m nwee njem gara nke ọma n'ịbịakwute unu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: mgbe niile
  rationale: Ọ na-egosi na Pọl na-eme nke a mgbe nile, n'okwu Igbo doro anya ma dịkwa mfe.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: n'ekpere m
  rationale: Nke a bụ ụzọ Igbo si ekwu ya n'ụzọ ebumpụta ụwa, na-egosikwa ọnọdụ o ji arịọ arịrịọ ahụ.
- source_word: δεόμενος
  choice: ana m arịọ
  rationale: Ọ na-egosi arịrịọ siri ike n'ime ekpere, n'enweghị ịgbakwunye echiche na-adịghị na okwu Grik.
- source_word: εἴ πως
  choice: ma eleghị anya
  rationale: Ọ na-echekwa echiche nke olileanya na ejighị n'aka banyere otú ohere ahụ ga-esi bịa.
- source_word: ἤδη ποτὲ
  choice: ugbu a n'ikpeazụ
  rationale: Ọ na-egosipụta olileanya Pọl nwere kemgbe ogologo oge na oge ga-emecha ruo.
- source_word: εὐοδωθήσομαι
  choice: ka m nwee ihe ịga nke ọma
  rationale: N'ọnọdụ a, ọ pụtara imezu ebumnuche ịbịakwute ha; ọ na-ezere nghọta nke akụnụba naanị.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: Chineke ekwe
  rationale: Nke a na-egosi na ọbịbịa ahụ dabere n'uche na nkwenye Chineke, n'asụsụ Igbo dị mfe ma dị ugbu a.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: n'ịbịakwute unu
  rationale: Ọ na-anọgide nso n'echiche nke ịbịa n'ebe ndị nnata nọ, na-agbakwunyeghị echiche ọzọ nke nleta.
theological_decisions:
- issue: Mmekọrịta uche Chineke na ihe ịga nke ọma Pọl
  choice: Chineke ekwe ka m nwee ihe ịga nke ọma
  alternative: n'ime uche Chineke, ka ụzọ m gaa nke ọma
  rationale: Nhọrọ a na-eme ka o doo anya na ihe Pọl tụrụ anya ya dabere n'uche Chineke, ma ọ naghị ekwu kpọmkwem otú ọchịchị Chineke na omume mmadụ si arụkọ ọrụ.
translation_notes:
  register: Asụsụ Igbo ọkọlọtọ, nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro ahịrịokwu ahụ ka ọ daba n'Igbo nkịtị, ebe ihe odide ala ala peeji na-echekwa nghọta njem dị n'okwu εὐοδωθήσομαι.
