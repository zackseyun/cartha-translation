revisions:
- from: Dịkwa nnọọ ka ha ewereghị ya dị ka ihe kwesịrị ekwesị ịnọgide na-amata Chineke[a], otu ahụ ka Chineke nyefere ha n'aka uche na-erughị eru[b], ka ha mee ihe ndị na-ekwesịghị ekwesị.
  to: Dịkwa ka ha ewereghị idobe Chineke n’ihe ọmụma ha dịka ihe kwesịrị ekwesị, otu ahụ ka Chineke nyefere ha n’aka uche na-erughị eru[b], ka ha mee ihe ndị na-ekwesịghị ekwesị.
  rationale: The main correction replaces “ịnọgide na-amata Chineke” with “idobe Chineke n’ihe ọmụma ha,” which better represents the source phrase’s sense of retaining God in knowledge. The sentence is also recast to avoid an unclear pronoun. Footnote a preserves the closer lexical alternative “inwe Chineke n’ihe ọmụma ha.”
