id: ROM.1.28
reference: Romans 1:28
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: ig
  text: Dịkwa ka ha ewereghị idobe Chineke n’ihe ọmụma ha dịka ihe kwesịrị ekwesị, otu ahụ ka Chineke nyefere ha n’aka uche na-erughị eru[b], ka ha mee ihe ndị na-ekwesịghị ekwesị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “uche rụrụ arụ.” Okwu Grik a nwere njikọ na okwu a sụgharịrị “ewereghị … dịka ihe kwesịrị ekwesị” na mbụ n’amaokwu a.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Dịkwa nnọọ ka ... otu ahụ ka
  rationale: Usoro a na-egosipụta ntụnyere dị na καθὼς n'Igbo dị ire, ma na-ahapụkwa njikọ ya na ikpe Chineke ka ọ pụta ìhè n'enweghị ime ka ọ bụrụ naanị ihe kpatara ya.
- source_word: οὐκ ἐδοκίμασαν
  choice: ha ewereghị ya dị ka ihe kwesịrị ekwesị
  rationale: Nke a na-egosipụta echiche nke ịtụle ihe ma jụ ịnabata ya dị ka ihe kwesịrị ekwesị; ọ naghị eme ka okwu ahụ bụrụ naanị enweghị ihe ọmụma.
- source_word: τὸν θεὸν ἔχειν ἐν ἐπιγνώσει
  choice: ịnọgide na-amata Chineke
  rationale: Nke a bụ Igbo dị mfe ma dị ire nke na-eburu echiche nke ijide ma ọ bụ idebe Chineke n'ihe ọmụma ha; e debere nsụgharị nke na-esochi oyiyi Grik nso karị n'ala ala peeji.
- source_word: παρέδωκεν
  choice: nyefere ha n'aka
  rationale: Ọ na-egosipụta omume nke inyefe mmadụ n'okpuru ike ma ọ bụ nsonaazụ ihe, ma kwekọọ n'echiche ikpe dị n'akụkụ amaokwu a.
- source_word: ἀδόκιμον νοῦν
  choice: uche na-erughị eru
  rationale: ἀδόκιμος na-ekwu maka ihe a nwalere ma a nabataghị, ma ọ bụ ihe na-ekwesịghị ekwesị. Nhọrọ a dị mfe n'Igbo ma na-echekwa obere njikọ okwu ya na ‘ihe kwesịrị ekwesị’ dị na mbụ.
- source_word: ποιεῖν τὰ μὴ καθήκοντα
  choice: ka ha mee ihe ndị na-ekwesịghị ekwesị
  rationale: Ọ na-edebe infinitive nke ebumnuche ma ọ bụ nsonaazụ, ma na-asụgharị καθήκοντα dịka ihe kwesịrị ekwesị n'ụzọ doro anya.
theological_decisions:
- issue: Ma a ga-eme ka ἀδόκιμον νοῦν bụrụ okwu nkà mmụta okpukpe siri ike dịka ‘uche rụrụ arụ kpamkpam.’
  choice: uche na-erughị eru
  alternative: uche rụrụ arụ
  rationale: Nhọrọ a na-egosipụta ikpe Chineke na ọnọdụ uche ahụ n'enweghị itinye okwu ozizi siri ike karịa ihe adjective Grik n'onwe ya kwuru; ọ na-echekwakwa njikọ okwu ya na ἐδοκίμασαν.
- issue: Ma τὸν θεὸν ἔχειν ἐν ἐπιγνώσει pụtara naanị ịmata eziokwu banyere Chineke ka ọ bụ ịnabata ya n'ụzọ uche na ndụ.
  choice: ịnọgide na-amata Chineke
  alternative: ka Chineke dịrị n'ihe ọmụma ha
  rationale: 'A hapụrụ esemokwu ahụ ka ọ dị: isiokwu bụ ịjụ ijide Chineke n''ihe ọmụma ha, ọ bụghị naanị amaghị ihe n''amaghị ama. Ala ala peeji na-echekwa usoro okwu Grik nso karị.'
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ùgwù ma dị mfe nghọta. Usoro ‘Dịkwa nnọọ ka ... otu ahụ ka’ na-eme ka ahịrịokwu ahụ na-aga nke ọma n'Igbo, ebe ‘uche na-erughị eru’ na-ezere okwu ochie ma ọ bụ okwu otu ụka pụrụ iche.
