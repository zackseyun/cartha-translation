    text: Ma ọ bụ, “inwe Chineke n’ihe ọmụma ha.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “uche rụrụ arụ.” Okwu Grik a nwere njikọ na okwu a sụgharịrị “ewereghị … dịka ihe kwesịrị ekwesị” na mbụ n’amaokwu a.
    reason: lexical_alternative
