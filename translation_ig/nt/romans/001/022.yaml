  text: Claiming to be wise[a], they became fools[b],
translation:
  language: ig
  text: N'ịkpọ onwe ha ndị maara ihe[a], ha ghọrọ ndị nzuzu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “N'ekwupụta na ha bụ ndị maara ihe.”
