lexical_decisions:
- source_word: φάσκοντες
  choice: Ka ha na-ekwu
  rationale: Ọ na-egosipụta nkwupụta ha na-ekwu banyere onwe ha; okwu a bụ nke dị mfe ma bụrụkwa Igbo a na-asụ ugbu a, ma na-echekwa ihe njakịrị dị n'okwu Pọl.
- source_word: εἶναι
  choice: na ha bụ
  rationale: Ọ na-eburu ọdịnaya nke ihe ha na-ekwu, ya bụ, na ha bụ ndị maara ihe.
- source_word: σοφοὶ
  choice: ndị maara ihe
  rationale: Nke a bụ ụzọ doro anya ma bụrụ nke mmadụ niile na-aghọta iji kwuo ndị nwere amamihe, na-enweghị itinye echiche ọzọ.
- source_word: ἐμωράνθησαν
  choice: ha ghọrọ ndị nzuzu
  rationale: 'Ọ na-echekwa mgbanwe nke ọnọdụ na mgbagha siri ike dị n''okwu Grik: ha na-ekwu na ha maara ihe, ma ha ghọrọ ndị nzuzu.'
theological_decisions:
- issue: Ma a ga-asụgharị ἐμωράνθησαν dị ka àgwà, ‘ha ghọrọ ndị na-enweghị uche,’ ka ọ bụ aha siri ike, ‘ha ghọrọ ndị nzuzu.’
  choice: ha ghọrọ ndị nzuzu
  alternative: ha ghọrọ ndị na-enweghị uche
  rationale: Nhọrọ a na-echekwa mgbagha Pọl ji okwu ‘ndị maara ihe’ na ‘ndị nzuzu’ mee ka ọ pụta ìhè, n'etinyeghị ozizi ọzọ na-adịghị n'okwu Grik.
translation_notes:
  register: Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere nhazi mgbagha nke amaokwu ahụ na ike okwu ikpeazụ ya.
