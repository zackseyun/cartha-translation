translation:
  language: ig
  text: ndị na-enweghị nghọta, ndị na-adịghị edebe nkwa ha[a], ndị na-enweghị ịhụnanya ebumpụta ụwa[b], na ndị na-enweghị obi ebere.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, “ndị a na-apụghị ịtụkwasị obi” ma ọ bụ “ndị na-emebi ọgbụgba ndụ.”
    reason: lexical_alternative
  - marker: b
    text: Nke a na-ezo karịsịa n’enweghị ịhụnanya mmadụ kwesịrị inwe n’ebe ndị ezinụlọ ya nọ.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: ndị na-enweghị nghọta
  rationale: Nke a na-egosi enweghị nghọta ma ọ bụ ikike ịmata ihe ziri ezi; ọ naghị ekwu nanị na mmadụ amaghị ihe.
- source_word: ἀσυνθέτους
  choice: ndị na-adịghị edebe nkwa ha
  rationale: Okwu Grik a na-ezo aka n’ebe ndị na-adịghị emezu nkwekọrịta ma ọ bụ nkwa ha nọ. Nsụgharị a doro anya ma dịkwa mfe nghọta n’Igbo nke oge a.
- source_word: ἀστόργους
  choice: ndị obi kpọrọ nkụ
  rationale: Nke a bụ okwu Igbo dị nkenke nke na-egosi enweghị ịhụnanya sitere n’obi. E debere echiche pụrụ iche banyere ịhụnanya ezinụlọ n’ala ala peeji.
- source_word: ἀνελεήμονας
  choice: ndị na-enweghị obi ebere
  rationale: Nke a na-egosi kpọmkwem ndị na-adịghị emere ndị ọzọ ebere ma ọ bụ nwee ọmịiko.
theological_decisions: []
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị mfe ma dị ùgwù, sụgharịa ndepụta a. E debere usoro okwu anọ nke Grik na ike omume ha, ma jiri ala ala peeji chekwaa nkọwa ezinụlọ dị n’okwu ἀστόργους na ụzọ ndị ọzọ e nwere isi ghọta ἀσυνθέτους.
