id: ROM.1.27
reference: Romans 1:27
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: ig
  text: N’otu aka ahụkwa, ndị nwoke, ebe ha hapụsịrị ịmekọ nwanyị n’ụzọ kwekọrọ n’okike[a], ọchịchọ ha nwere n’ebe ibe ha nọ wee gbaa ha ọkụ[b]. Ndị nwoke na ndị nwoke na-eme ihe ihere[c], na-anatakwa n’ime onwe ha ụgwọ kwesịrị ekwesị maka njehie ha[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “hapụrụ mmekọahụ ha na nwanyị nke kwekọrọ n’okike.”
    reason: lexical_alternative
  - marker: b
    text: 'N’ụzọ nkịtị karị: “ọchịchọ ha nwere n’ebe ibe ha nọ reere ha ọkụ.”'
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “na-eme ihe na-eweta ihere.”
    reason: lexical_alternative
  - marker: d
    text: Ma ọ bụ, “nkwụghachi kwekọrọ ekwekọ maka njehie ha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: ndị nwoke / nwanyị
  rationale: A họọrọ okwu ndị na-egosi nwoke na nwanyị n’ụzọ doro anya, ka ọdịiche nwoke/nwanyị nke Grik na nkwughachi ya ghara ịla n’iyi.
- source_word: ἀφέντες
  choice: hapụrụ
  rationale: Ọ na-egosi na ha buru ụzọ hapụ ihe ahụ tupu ọchịchọ ahụ agbaa ha ọkụ; ‘hapụrụ’ bụ okwu Igbo dị mfe ma zie ezi.
- source_word: φυσικὴν χρῆσιν τῆς θηλείας
  choice: iji nwanyị eme ihe dị ka o si kwekọọ n’okike
  rationale: Nke a na-edobe echiche χρῆσις, ‘iji eme ihe,’ na njikọ ya na ihe kwekọrọ n’okike, n’agbanyeghị na okwu ahụ siri ike karịa ikwu naanị ‘mmekọahụ.’
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους
  choice: ọchịchọ ha nwere n’ebe ibe ha nọ wee gbaa ha ọkụ
  rationale: ‘Gbaa ha ọkụ’ na-echekwa ihe atụ nke ọkụ dị na ngwaa Grik, ebe ‘ọchịchọ’ anaghị ebubata nkọwa karịrị ὄρεξις.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: ndị nwoke na ndị nwoke
  rationale: A nọgidere na nkwughachi okwu nwoke nke dị na Grik iji chekwaa ike nkwupụta ahụ.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: na-eme ihe ihere
  rationale: Nke a na-egosipụta ikpe omume dị n’okwu Grik ma ghara ịgbakwunye aha omume pụrụ iche nke ederede ahụ ekwughị.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: ụgwọ kwesịrị ekwesị
  rationale: Ọ na-ejikọta echiche nke nkwụghachi na nke ihe kwesịrị ma ọ bụ dị mkpa, n’ụzọ Igbo na-aga nke ọma.
- source_word: τῆς πλάνης αὐτῶν
  choice: maka njehie ha
  rationale: ‘Njehie’ bụ okwu doro anya maka πλάνη ebe a, ma ọ naghị ekpebi ma ihe ahụ bụ ịkpafu, aghụghọ, ma ọ bụ nghọta na-ezighị ezi karịa ka ihe gbara ya gburugburu si kwuo.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: na-anatakwa n’ime onwe ha
  rationale: Nke a na-echekwa ike nnọchiaha nlaghachi ἑαυτοῖς ma ghara ịkọwa kpọmkwem otú nkwụghachi ahụ si abịa.
theological_decisions:
- issue: Ma a ga-eme ka okwu nwoke na nwanyị bụrụ naanị okwu mmekọrịta
  choice: ndị nwoke ... nwanyị ... ndị nwoke na ndị nwoke
  alternative: ụmụ nwoke ... ụmụ nwanyị; ma ọ bụ ndị di na ndị nwunye
  rationale: Grik ji okwu e ji akọwa nwoke na nwanyị, ọ bụghị okwu di na nwunye. Ya mere, a zere itinye echiche mmekọrịta nke isi mmalite ahụ ekwughị.
- issue: Ma a ga-akọwapụta omume ahụ karịa ka ederede si kwuo
  choice: na-eme ihe ihere
  alternative: na-eme omume mmekọahụ nwoke na nwoke
  rationale: ἀσχημοσύνη nwere ikpe omume doro anya, ma ọ kpọghị omume ahụ aha n’ụdị nkọwa ahụ. Nsụgharị ahụ na-edobe ikpe ahụ n’etinyeghị nkọwa ọzọ.
- issue: Ihe ‘ụgwọ kwesịrị ekwesị’ ahụ bụ kpọmkwem
  choice: anaghị akọwa ụdị ụgwọ ahụ; ‘na-anatakwa n’ime onwe ha’ ka e debere
  alternative: ịkọwa ya dị ka ọrịa, ikpe ikpeazụ, ma ọ bụ mmetụta uche
  rationale: Amaokwu ahụ ekwughị kpọmkwem ụdị nkwụghachi ahụ. A hapụrụ mgbagwoju anya ahụ kama itinye nkọwa ozizi nke ederede na-enyeghị.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, nke dị nsọ ma dịkwa mfe nghọta. A hapụrụ okwu gbasara ‘iji nwanyị eme ihe’ ka ọ dị ntakịrị siri ike n’ihi na χρῆσις n’onwe ya bụ okwu ‘iji eme ihe’; ihe odide ala peeji na-enye ụzọ dị nro nke na-egosikwa ọnọdụ mmekọahụ. A kewara ahịrịokwu ahụ ụzọ abụọ iji mee ka ogologo usoro nkebiokwu Grik doo anya n’Igbo, n’agbanweghị njikọ echiche ya.
