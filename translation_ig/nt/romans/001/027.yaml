revisions:
- from: N’otu aka ahụkwa, ndị nwoke hapụrụ iji nwanyị eme ihe dị ka o si kwekọọ n’okike[a]; ọchịchọ ha nwere n’ebe ibe ha nọ wee gbaa ha ọkụ[b]. Ndị nwoke na ndị nwoke na-eme ihe ihere[c], na-anatakwa n’ime onwe ha ụgwọ kwesịrị ekwesị maka njehie ha[d].
  to: N’otu aka ahụkwa, ndị nwoke, ebe ha hapụsịrị ịmekọ nwanyị n’ụzọ kwekọrọ n’okike[a], ọchịchọ ha nwere n’ebe ibe ha nọ wee gbaa ha ọkụ[b]. Ndị nwoke na ndị nwoke na-eme ihe ihere[c], na-anatakwa n’ime onwe ha ụgwọ kwesịrị ekwesị maka njehie ha[d].
  rationale: The sole substantive revision replaces the potentially nonsexual and objectifying-sounding “iji nwanyị eme ihe” with “ịmekọ nwanyị,” an idiomatic Igbo expression that makes the sexual reference of χρῆσις clear. It retains the source’s male/female contrast, prior participial action, naturalness qualifier, and avoids overdefining either the indecency or the recompense. Footnote markers remain attached to their corresponding source expressions.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:24:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the verse’s sequence and its deliberately sex-marked male/female language, the reciprocal desire, the morally evaluative but nonspecific ἀσχημοσύνη, and the unspecified corresponding recompense. However, “iji nwanyị eme ihe” can naturally mean using or exploiting a woman in a nonsexual sense in contemporary Igbo. In this context χρῆσις is specifically sexual, so a minimally clearer idiom is needed.
  naturalness: The two-sentence structure is clear and the register is generally suitable for Standard Igbo. “Ịmekọ nwanyị n’ụzọ kwekọrọ n’okike” expresses the sexual sense naturally without adding a particular act. “Ọchịchọ ha ... wee gbaa ha ọkụ” adequately carries the Greek fire imagery.
  terminology: “Ndị nwoke,” “nwanyị,” “ihe ihere,” “ụgwọ kwesịrị ekwesị,” “njehie,” and “n’ime onwe ha” are appropriate. The revision does not turn the source’s moral language into a more specific modern label, nor does it specify the nature of the recompense.
  issues:
  - severity: medium
    issue: The expression “iji nwanyị eme ihe” is ambiguous in Standard Igbo.
    rationale: Outside an explicitly sexual construction, it commonly suggests making use of or exploiting a woman. Since χρῆσις here denotes sexual use/relations, the translation should make that contextual sense clear while preserving the source’s restrained wording.
