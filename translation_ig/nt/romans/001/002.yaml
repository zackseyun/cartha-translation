  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: ig
  text: nke o buru ụzọ kwe nkwa site n'aka ndị amụma ya n'ime akwụkwọ nsọ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n'ihe odide nsọ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: nke
  rationale: Nnọchiaha njikọ a na-ezo aka n’oziọma e kwuru okwu ya na Ndị Rom 1:1, ma na-ejigide njikọ ahịrịokwu ahụ.
- source_word: προεπηγγείλατο
  choice: kwere na nkwa tupu oge eruo
  rationale: Nke a na-egosipụta ma echiche nke ikwe nkwa ma nke ime ya tupu oge ahụ eruo.
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: site n’ọnụ ndị amụma ya
  rationale: Akpaokwu Igbo a na-egosi nke ọma na Chineke ji ndị amụma ya bụrụ ndị o si n’aka ha kwuo okwu, dịka διά na genitive si egosi.
- source_word: ἐν γραφαῖς ἁγίαις
  choice: n’Akwụkwọ Nsọ dị nsọ
  rationale: N’ebe a γραφαί na-ezo aka n’ihe odide Akwụkwọ Nsọ, ọ bụghị naanị ihe odide nkịtị; ‘dị nsọ’ na-edowe nkọwa ἁγίαις pụta ìhè.
theological_decisions:
- issue: Ma a ga-asụgharị γραφαῖς ἁγίαις dịka ‘Akwụkwọ Nsọ dị nsọ’ ma ọ bụ ‘ihe odide dị nsọ’
  choice: Akwụkwọ Nsọ dị nsọ
  alternative: ihe odide dị nsọ
  rationale: N’iji okwu Pọl eme ihe, γραφαί na-egosikarị ihe odide ndị a nabatara dịka Akwụkwọ Nsọ. Agbanyeghị, ihe okwu Grik ahụ pụtara n’ụzọ sara mbara ka e debere na nkọwa ala peeji.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke dị ugwu ma dị mfe nghọta. ‘Site n’ọnụ’ bụ ụzọ ebumpụta ụwa e si egosi na Chineke kwuru okwu site n’aka ndị amụma; akara [a] dị n’ederede bụ isi ma kwekọọ na nkọwa ala peeji.
