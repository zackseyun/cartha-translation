- from: nke o kwere na nkwa tupu oge eruo site n’ọnụ ndị amụma ya n’Akwụkwọ Nsọ dị nsọ.[a]
  to: nke o buru ụzọ kwe nkwa site n'aka ndị amụma ya n'ime akwụkwọ nsọ.[a]
