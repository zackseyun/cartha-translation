  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: ig
  text: Ya mere, dịka ọ bụ site n’otu mmejọ ka ikpe ọmụma rutere mmadụ niile, otu ahụ kwa ka ọ bụ site n’otu omume ezi omume ka ịgụ mmadụ niile n’onye ezi omume nke na-eduga ná ndụ rutere mmadụ niile.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ma ọ bụ, n’ụzọ dị nso karị n’okwu Grik: “site n’otu omume ezi omume ... ruo n’ịgụ mmadụ niile n’onye ezi omume nke ndụ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Ya mere
  rationale: Nke a na-egosipụta nkwubi okwu Pọl na-ewepụta site n’ihe o kwuru tupu amaokwu a, n’ụzọ Igbo dị mfe ma dị ugwu.
- source_word: παραπτώματος
  choice: njehie
  rationale: “Njehie” na-egosi omume mmebi iwu a kapịrị ọnụ, kama iji okwu sara mbara maka mmehie n’ozuzu ya.
- source_word: κατάκριμα
  choice: ikpe ọmụma
  rationale: 'Nhọrọ a na-echekwa echiche ụlọikpe dị na okwu Grik ahụ: ikpe e kpebiri megide onye a hụrụ ikpe.'
- source_word: δικαιώματος
  choice: omume ezi omume
  rationale: Ọ na-ezo aka n’otu omume ziri ezi dị mkpa ma na-edobe ọdịiche dị n’etiti njehie otu onye na omume ezi omume otu onye.
- source_word: δικαίωσιν ζωῆς
  choice: ịbụ ndị a gụrụ n’onye ezi omume, nke na-eweta ndụ
  rationale: Nkebi a na-eme ka echiche ikpe ziri ezi na nke inye ndụ pụta ìhè n’Igbo nkịtị, n’ebughị ụzọ kpebie kpọmkwem ụdị njikọ genitive ζωῆς nwere.
- source_word: πάντας ἀνθρώπους
  choice: mmadụ niile
  rationale: Nke a na-egosipụta oke mmadụ niile nke okwu Grik ahụ ma na-ejigide otu nkebi okwu ahụ n’akụkụ abụọ nke ntụnyere ahụ.
theological_decisions:
- issue: Ma a ga-eme ka “mmadụ niile” nke ugboro abụọ dị warara iji zere nghọta nke gbasara mmadụ niile
  choice: E debere “mmadụ niile” n’akụkụ abụọ ahụ n’enweghị mgbakwunye na-akọwa ya.
  alternative: “ndị niile kwere ekwe” ma ọ bụ “ndị niile a gụrụ n’onye ezi omume”
  rationale: Grik ji πάντας ἀνθρώπους mee ihe n’akụkụ abụọ nke ntụnyere ahụ. Ime ka nke abụọ dị warara ga-abụ ịkọwa esemokwu nkà mmụta okpukpe nke amaokwu ahụ n’onwe ya na-ahapụ ka ọnọdụ sara mbara kọwaa.
- issue: Mmekọrịta dị n’etiti δικαίωσιν na ζωῆς
  choice: “ịbụ ndị a gụrụ n’onye ezi omume, nke na-eweta ndụ”
  alternative: “ịgụ n’onye ezi omume nke ndụ”
  rationale: Isi ederede na-enye Igbo doro anya nke na-egosi nsonaazụ na-enye ndụ, ebe ndetu ala na-echekwa usoro okwu nke dị nso na Grik na nghọta ọzọ ọ pụrụ ibu.
translation_notes:
  register: E jiri Standard Igbo nke oge a, dị mfe ma dị ugwu. A chekwara nhazi ntụnyere nke Adam na Kraịst, asụsụ ụlọikpe nke κατάκριμα na δικαίωσις, nakwa oke “mmadụ niile” n’akụkụ abụọ ahụ. Akara ndetu ala [a] dị n’isi ederede.
