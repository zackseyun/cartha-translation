  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: ig
  text: Ntachi obi na-arụpụta àgwà a nwapụtara[a], àgwà a nwapụtara na-arụpụtakwa olileanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “àgwà a nwalere,” ma ọ bụ “nnabata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονή
  choice: ntachi obi
  rationale: Nke a bụ okwu Igbo doro anya nke na-egosi ịnọgide na-eguzosi ike ma na-edi nsogbu, kwekọrọ n’usoro echiche nke amaokwu ndị gbara ya gburugburu.
- source_word: δοκιμή
  choice: àgwà a nwapụtara ịdị mma
  rationale: Nhọrọ a na-egosi àgwà nke ule egosila na ọ bụ ezi àgwà, ọ bụghị naanị àgwà n’ozuzu ya ma ọ bụ usoro nnwale ahụ.
- source_word: ἐλπίς
  choice: olileanya
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka atụmanya nwere ntụkwasị obi; ọ dịghị mkpa ịgbakwunye nkọwa ozizi n’ime amaokwu ahụ.
- source_word: δὲ
  choice: na … kwa
  rationale: N’ebe a, δέ na-ejikọta nzọụkwụ ndị so ibe ha n’usoro, ọ naghị egosi nnukwu mmegide. Usoro ‘na … kwa’ na-eme ka njikọ ahụ pụta nke ọma n’Igbo.
- source_word: ellipsis of κατεργάζεται
  choice: na-arụpụta
  rationale: E si n’amaokwu gara aga weta ngwaa a na-adịghị edeghachi n’ahịrị Grik a. ‘Na-arụpụta’ na-egosi na otu ihe na-eweta nke ọzọ n’ụzọ dị mfe ma kwekọọ n’usoro ahịrịokwu ahụ.
theological_decisions:
- issue: Ihe δοκιμή pụtara n’usoro mgbanwe nke mkpagbu na-eweta
  choice: Àgwà ule nwapụtara na ọ dị mma
  alternative: Usoro nnwale n’onwe ya, ma ọ bụ ịbụ onye a nabatara/kwadoro
  rationale: N’usoro a, δοκιμή bụ ihe ntachi obi rụpụtara. Ya mere, ntụgharị a na-echekwa echiche nke àgwà e gosiri na ọ bụ eziokwu site n’ule, n’etinyeghị nkọwa ozizi ọzọ.
translation_notes:
  register: Ejiri Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. E debere usoro nkwughachi nke Grik iji mee ka njikọ dị n’etiti ntachi obi, àgwà a nwapụtara, na olileanya doo anya.
