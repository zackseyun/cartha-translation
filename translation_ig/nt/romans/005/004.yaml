- from: Ntachi obi na-arụpụta àgwà a nwapụtara ịdị mma[a], àgwà a nwapụtara ịdị mma na-arụpụtakwa olileanya.
  to: Ntachi obi na-arụpụta àgwà a nwapụtara[a], àgwà a nwapụtara na-arụpụtakwa olileanya.
  rationale: The revision removes the unnatural addition “ịdị mma” and uses “àgwà a nwapụtara,” which naturally conveys character tested and shown genuine. It retains the source’s compact chain, the repeated noun, and the supplied causal verb. The footnote preserves viable lexical alternatives without overinterpreting the term.
  reviewer_model: gpt-5.6-terra
