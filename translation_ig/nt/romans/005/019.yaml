  - marker: b
    text: N’asụsụ Grik, “site n’irube isi nke otu ahụ”; a ghọtara “onye” site n’okwu dị n’akụkụ mbụ.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “a ga-etinye ọtụtụ mmadụ n’ọnọdụ ịbụ ndị ezi omume.”
    reason: lexical_alternative
  revision_rationale: The revision makes the obedience/disobedience antithesis explicit in idiomatic Standard Igbo, removes unnatural demonstrative and periphrastic wording, and retains the source’s passive verbal contrast, temporal distinction, and ambiguity concerning “the many.” Footnotes are retained as lexical alternatives, with wording adjusted for natural Igbo. To maintain usable anchors, attach [a] after “ndị mmehie” and [c] after “ndị ezi omume” in production, while [b] remains after “otu onye.”
