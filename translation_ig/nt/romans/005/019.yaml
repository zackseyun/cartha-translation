id: ROM.5.19
reference: Romans 5:19
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: ig
  text: N’ihi na, dịka e mere ọtụtụ mmadụ ndị mmehie site n’inupụ isi nke otu nwoke, otu a kwa ka a ga-eme ọtụtụ mmadụ ndị ezi omume site n’irube isi nke otu onye.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: N’asụsụ Grik, “site n’irube isi nke otu ahụ”; a ghọtara “onye” site n’okwu dị n’akụkụ mbụ.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: nnupụisi
  rationale: “Nnupụisi” na-egosi ịjụ irube isi, ma na-emekwa ka ọdịiche ya na ὑπακοή (“nrubeisi”) doo anya.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: nke otu nwoke ahụ
  rationale: “Otu nwoke ahụ” na-egosipụta onye a kapịrị ọnụ n’ime okwu a, ya bụ Adam, ma chekwaa ntụnyere dị n’etiti ya na Kraịst.
- source_word: ἁμαρτωλοὶ
  choice: ndị mmehie
  rationale: Adjective a na-arụ ọrụ dị ka aha ndị mmadụ; “ndị mmehie” bụ Igbo doro anya ma bụrụkwa nke a na-ejikarị eme ihe.
- source_word: κατεστάθησαν
  choice: e si mee
  rationale: Nhọrọ a na-egosi na e tinyere ha n’ọnọdụ ma ọ bụ n’usoro nke ịbụ ndị mmehie, n’enweghị itinye nkọwa ozizi karịrị ihe okwu Grik kwuru.
- source_word: οἱ πολλοί
  choice: ọtụtụ mmadụ ahụ
  rationale: “Ahụ” na-anọchi article Grik ma chekwaa okwu Pọl banyere ìgwè ahụ, kama ịgbanwe ya ka ọ bụrụ “mmadụ niile.”
- source_word: ὑπακοῆς
  choice: nrubeisi
  rationale: Nke a bụ okwu Igbo kwụ ọtọ maka irube isi, ọ na-echekwa ntụnyere ya na “nnupụisi.”
- source_word: τοῦ ἑνὸς
  choice: nke otu onye ahụ
  rationale: Grik kwuru naanị “nke otu ahụ” n’akụkụ nke abụọ; “onye” na-eme ka Igbo bụrụ ihe a na-aghọta nke ọma n’ebughị ụzọ tinye “nwoke” ọzọ n’ahịrị bụ́ nke Grik hapụrụ.
- source_word: δίκαιοι
  choice: ndị ezi omume
  rationale: “Ndị ezi omume” bụ nsụgharị Igbo kwesịrị ekwesị maka δίκαιοι n’ebe a ma na-echekwa njikọ ya na okwu ndị ọzọ sitere na mgbọrọgwụ δικ-.
- source_word: κατασταθήσονται
  choice: a ga-esi mee
  rationale: Ọdịnihu na passive ka e chekwara, tinyere myirịta ya na κατεστάθησαν; e zere “a ga-akpọ ha ndị ezi omume,” nke ga-eme ka ihe ahụ bụrụ naanị nkwupụta ikpe.
theological_decisions:
- issue: Ma a ga-asụgharị οἱ πολλοί dịka “ọtụtụ mmadụ ahụ” ka ọ bụ kọwaa ya dịka “mmadụ niile.”
  choice: ọtụtụ mmadụ ahụ
  alternative: mmadụ niile
  rationale: Okwu Grik bụ οἱ πολλοί, ọ bụghị πάντες. Nhọrọ a na-echekwa okwu Pọl na esemokwu banyere oke ndị ọ na-ekwu maka ha, kama idozi ya site na nkọwa.
- issue: Ma κατασταθήσονται δίκαιοι bụ “a ga-eme ha ndị ezi omume” ka ọ bụ “a ga-ekwupụta na ha bụ ndị ezi omume.”
  choice: a ga-esi mee ọtụtụ mmadụ ahụ ndị ezi omume
  alternative: a ga-ekwupụta na ọtụtụ mmadụ ahụ bụ ndị ezi omume
  rationale: Pọl ji καθίστημι mee ihe, ọ bụghị δικαιόω. Ya mere, nsụgharị ahụ na-echekwa asụsụ nke ịbụ ma ọ bụ itinye n’ọnọdụ, n’emeghị ka ọ bụrụ naanị okwu ikpe.
translation_notes:
  register: E ji Standard Igbo nke oge a, nke dị ùgwù ma dịkwa mfe nghọta. E chekwara myirịta dị n’etiti “nnupụisi/nrubeisi,” “otu nwoke ahụ/otu onye ahụ,” na “ndị mmehie/ndị ezi omume.”
