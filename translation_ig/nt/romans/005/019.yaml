revisions:
- from: N’ihi na dị nnọọ ka e si mee ọtụtụ mmadụ ahụ ndị mmehie[a] site ná nnupụisi nke otu nwoke ahụ, otu ahụkwa ka a ga-esi mee ọtụtụ mmadụ ahụ ndị ezi omume[c] site ná nrubeisi nke otu onye ahụ[b].
  to: N’ihi na, dịka e mere ọtụtụ mmadụ ndị mmehie site n’inupụ isi nke otu nwoke, otu a kwa ka a ga-eme ọtụtụ mmadụ ndị ezi omume site n’irube isi nke otu onye.[b]
  rationale: The revision makes the obedience/disobedience antithesis explicit in idiomatic Standard Igbo, removes unnatural demonstrative and periphrastic wording, and retains the source’s passive verbal contrast, temporal distinction, and ambiguity concerning “the many.” Footnotes are retained as lexical alternatives, with wording adjusted for natural Igbo. To maintain usable anchors, attach [a] after “ndị mmehie” and [c] after “ndị ezi omume” in production, while [b] remains after “otu onye.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the βασικός parallelism, the passive contrast (κατεστάθησαν / κατασταθήσονται), the future in the second clause, and Paul’s deliberately non-expansive phrase οἱ πολλοί. However, “nnupụisi” can more readily suggest rebellion, while παρακοή specifically denotes failure or refusal to obey. “Inupụ isi” provides a closer, natural counterpart to “irube isi.”
  naturalness: “E si mee” and “a ga-esi mee” are less idiomatic here than the direct passive-style Igbo formulations “e mere” and “a ga-eme.” “Ọtụtụ mmadụ ahụ” is understandable but sounds marked and unnecessarily demonstrative in this context; “ọtụtụ mmadụ” naturally renders “the many” without turning it into “all.”
  terminology: Use the established paired expressions “inupụ isi / irube isi.” Retain “ndị mmehie” and “ndị ezi omume,” which are clear and suitable for this Pauline context. “Otu nwoke” is appropriate in the first clause; “otu onye” in the second reflects the Greek ellipsis without introducing an interpretive identification.
  issues:
  - severity: medium
    issue: “Nnupụisi” is not the closest contextual rendering of παρακοή.
    rationale: Although it can denote disobedience, it commonly carries the stronger sense of rebellion or revolt. “Inupụ isi” directly expresses disobeying and forms a transparent contrast with “irube isi.”
  - severity: low
    issue: The periphrastic forms “e si mee” and “a ga-esi mee” are awkward in the verse.
    rationale: They add an instrumental nuance not present in the Greek construction. “E mere” and “a ga-eme” preserve the passive sense and read more naturally.
  - severity: low
    issue: “Ọtụtụ mmadụ ahụ” is overly marked in Standard Igbo.
    rationale: The Greek article in οἱ πολλοί need not be represented with the demonstrative “ahụ.” “Ọtụtụ mmadụ” remains definite enough in the tightly parallel context and avoids an unnatural demonstrative.
  revised_text: N’ihi na, dịka e mere ọtụtụ mmadụ ndị mmehie site n’inupụ isi nke otu nwoke, otu a kwa ka a ga-eme ọtụtụ mmadụ ndị ezi omume site n’irube isi nke otu onye.[b]
  revised_footnotes:
  - marker: a
    text: Ma ọ bụ, “e tinyere ọtụtụ mmadụ n’ọnọdụ ịbụ ndị mmehie.”
