id: ROM.5.12
reference: Romans 5:12
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: ig
  text: N’ihi ya, dị ka mmehie si n’aka otu nwoke bata n’ụwa, ọnwụ sikwa na mmehie bata, otu a kwa ka ọnwụ sikwa rute mmadụ niile, n’ihi na mmadụ niile mere mmehie[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, dị ka ntụgharị ọdịnala si kwuo, “n’ime ya ka mmadụ niile mere mmehie.”
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: N’ihi ya
  rationale: Na-egosi nkwubi okwu sitere n’ihe Pọl kwuru tupu nke a; ọ bụkwa okwu Igbo doro anya ma dị nkenke.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: n’aka otu nwoke
  rationale: διά na genitive na-egosi onye e si n’aka ya mee ihe; “otu nwoke” na-echekwa ntụaka kpọmkwem banyere Adam na njikọ ya na ntụnyere ga-esochi.
- source_word: ἡ ἁμαρτία
  choice: mmehie
  rationale: Nke a bụ okwu Igbo a na-ejikarị eme ihe maka echiche Pọl banyere mmehie, n’etinyeghị nkọwa ọzọ na-adịghị na Grik.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: bata n’ụwa
  rationale: Na-echekwa echiche nke ịbanye n’ime ụwa ma na-ada nke ọma n’Igbo.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: ọnwụ esikwara ná mmehie bata
  rationale: 'Na-eme ka ngwaa e kwuru na nkebi mbụ doo anya n’Igbo, ma na-echekwa usoro yiri ibe ya: mmehie si n’aka nwoke bata, ọnwụ esikwa ná mmehie bata.'
- source_word: οὕτως
  choice: otu a kwa
  rationale: Na-egosi ihe si na nke ahụ pụta na ntụnyere Pọl, n’ụzọ dị mma n’Igbo.
- source_word: εἰς πάντας ἀνθρώπους
  choice: ruo mmadụ niile
  rationale: Na-egosi mmadụ niile n’enweghị ime ka okwu ahụ bụrụ naanị ụmụ nwoke.
- source_word: ὁ θάνατος διῆλθεν
  choice: ọnwụ si gbasaa
  rationale: “Gbasaa” na-egosi na ọnwụ ruru agbụrụ mmadụ dum, nke dabara n’ọrụ διέρχομαι n’ebe a.
- source_word: ἐφ’ ᾧ
  choice: n’ihi na
  rationale: N’ọnọdụ a, a ghọtara nkebi ahụ dịka ihe na-egosi ihe kpatara ya; ntụgharị ọzọ a ma ama ka e debere n’okpuru amaokwu.
- source_word: πάντες ἥμαρτον
  choice: mmadụ niile mere mmehie
  rationale: Na-asụgharị aorist ahụ dịka ihe mere n’oge gara aga, n’agbanweghị ya ka ọ bụrụ perfect.
theological_decisions:
- issue: Ihe ἐφ’ ᾧ πάντες ἥμαρτον pụtara
  choice: 'Ihe kpatara ya: “n’ihi na mmadụ niile mere mmehie”'
  alternative: 'Njikọ nnọchite anya: “n’ime onye ahụ ka mmadụ niile mere mmehie”'
  rationale: Nkọwa nke na-egosi ihe kpatara ya dabara nke ọma n’usoro okwu Grik na gburugburu okwu a. Ma ebe nkebi a nwere nnukwu mkpa n’okwu gbasara Adam na mmadụ niile, e chekwara ntụgharị ọdịnala ọzọ n’okpuru amaokwu kama iwepụ esemokwu dị na nkọwa ya.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. Ahịrịokwu ahụ ka na-aga n’ihu, ya mere e chekwara akara ogologo (—) dị na isi mmalite. E tinyere akara [a] ozugbo n’ebe nkọwa ọzọ metụtara.
