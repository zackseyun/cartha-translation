  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: ig
  text: Olileanya anaghị eme ka ihere mee anyị[a], n’ihi na a wụpụla ịhụnanya Chineke[b] n’ime obi anyị site na Mmụọ Nsọ, onye e nyere anyị.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “adịghị emechu anyị ihu.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, n’ụzọ na-adịchaghị ka ọ ga-abụ, “ịhụnanya anyị nwere n’ebe Chineke nọ.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: olileanya
  rationale: Ọ bụ okwu Igbo a na-ejikarị akọwa atụmanya nwere ntụkwasị obi; nkebi okwu a na-ekwu maka olileanya n’ozuzu ya.
- source_word: δέ
  choice: -kwa
  rationale: Mgbakwunye “-kwa” na-egosi njikọ dị nro na ihe e kwuru tupu ya, n’etinyeghị nnukwu mmegide nke adịghị n’amaokwu Grik.
- source_word: καταισχύνει
  choice: adịghị eme ka ihere mee anyị
  rationale: Nke a na-edobe isi echiche ihere na nsọpụrụ dị n’okwu Grik ma na-ada nke ọma n’Igbo; ihe a na-emechu ihu pụtara ìhè dịka “anyị.”
- source_word: ἀγάπη τοῦ θεοῦ
  choice: ịhụnanya Chineke
  rationale: Nke a bụ usoro Igbo dị mkpirikpi ma dị ùgwù nke na-anọgide nso n’ụdị njikọ aha dị na Grik; ihe gbara ya gburugburu na-akwado na ọ bụ ịhụnanya Chineke nwere n’ebe anyị nọ.
- source_word: ἐκκέχυται
  choice: a wụpụla
  rationale: “Wụpụ” na-edobe ihe oyiyi nke ịwụsa ihe, ebe “-la” na-egosi ihe emere nke nsonaazụ ya ka dị ugbu a.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: n’ime obi anyị
  rationale: Ọ bụ ntụgharị doro anya ma bụrụkwa ụzọ nkịtị e si ekwu ya n’Igbo.
- source_word: διὰ πνεύματος ἁγίου
  choice: site na Mmụọ Nsọ
  rationale: “Site na” na-egosi na Mmụọ Nsọ bụ onye e ji mee ka nke a ruo anyị, dịka διά ya na genitive si dị ebe a.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: ahụ e nyere anyị
  rationale: Nkebi a na-akọwapụta Mmụọ Nsọ ma na-edobe echiche na e nyere ya anyị, n’enweghị itinye nkọwa ọzọ na-adịghị na Grik.
theological_decisions:
- issue: Ihe τοῦ θεοῦ pụtara n’okwu ἡ ἀγάπη τοῦ θεοῦ
  choice: ịhụnanya Chineke nwere n’ebe anyị nọ
  alternative: ịhụnanya anyị nwere n’ebe Chineke nọ
  rationale: Ihe kpatara olileanya anaghị eme anyị ihere bụ na e wụpụla ịhụnanya a n’obi anyị site na Mmụọ Nsọ; nke a na-akwado ịhụnanya sitere n’aka Chineke. N’agbanyeghị nke ahụ, njikọ aha Grik nwere ike ibu nghọta nke ọzọ, ya mere e debere ya n’okpuru peeji.
translation_notes:
  register: E ji Igbo Izugbe nke oge a, dị ùgwù ma dị mfe nghọta. A họọrọ “eme ka ihere mee anyị” iji chekwaa echiche ihere dị na καταισχύνει, ebe “a wụpụla” na-echekwa ma ihe oyiyi ịwụsa ma nsonaazụ ka dị ugbu a. E debere akara nkọwa ụkwụ ozugbo n’ebe okwu nke ọ bụla metụtara dị.
