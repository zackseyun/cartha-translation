revisions:
- from: Olileanya adịghịkwa eme ka ihere mee anyị[a], n’ihi na a wụpụla ịhụnanya Chineke[b] n’ime obi anyị site na Mmụọ Nsọ ahụ e nyere anyị.
  to: Olileanya anaghị eme ka ihere mee anyị[a], n’ihi na a wụpụla ịhụnanya Chineke[b] n’ime obi anyị site na Mmụọ Nsọ, onye e nyere anyị.
  rationale: The revision preserves the source meaning and the intended ambiguity of “ịhụnanya Chineke,” while smoothing the connective, using a natural personal relative clause for the Holy Spirit, and removing an unsupported explanatory expansion from the lexical footnote. Footnote anchors remain attached to the terms they explain.
  reviewer_model: gpt-5.6-terra
