  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: ig
  text: N’ihi na mgbe anyị ka na-adịghị ike, Mesaịa nwụrụ n’oge kwesịrị ekwesị n’ihi ndị na-adịghị asọpụrụ Chineke.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “n’aha ndị na-adịghị asọpụrụ Chineke.”
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Mezaịa
  rationale: A sụgharịrị aha-ọkwa Χριστός dị ka “Mezaịa,” iji gosipụta Onye E Tere Mmanụ kama ime ya naanị aha mmadụ.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: mgbe anyị ka na-adịghị ike
  rationale: Nkebi genitive absolute a na-arụ ọrụ dị ka nkebi oge. “Na-adịghị ike” na-edobe echiche sara mbara nke enweghị ike mmadụ n’ebughị ụzọ kọwaa ya dị ka naanị adịghị ike anụ ahụ.
- source_word: ἔτι
  choice: ka
  rationale: “Ka” na-egosi na ọnọdụ enweghị ike ahụ ka na-aga n’ihu, ma ọ na-eme ka ahịrịokwu ahụ daa nke ọma n’Igbo n’enweghị ikwughachi okwu na-adịghị mkpa.
- source_word: κατὰ καιρὸν
  choice: n’oge kwesịrị ekwesị
  rationale: Nke a na-egosi oge dabara adaba ma ọ bụ oge a kara aka, na-enweghị ịgbakwunye nkọwa banyere otú e si kaa ya.
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: N’ebe a, “n’ihi” na-egosi na ọnwụ Mezaịa bụ maka abamuru ndị ahụ, ma na-ahapụ nghọta nke nnọchite anya ma ọ bụ ịnọchi onye ọzọ ka ọ ghara ịbụ nke e mechiri emechi.
- source_word: ἀσεβῶν
  choice: ndị na-adịghị asọpụrụ Chineke
  rationale: Nkebi a na-egosipụta ndị na-enweghị nsọpụrụ na nrube isi kwesịrị ekwesị n’ebe Chineke nọ n’asụsụ Igbo doro anya ma dị ugbu a.
- source_word: ἀπέθανεν
  choice: nwụrụ
  rationale: Aorist a na-akọ ihe mere n’ụzọ kwụ ọtọ; “nwụrụ” zuru oke n’enweghị mgbasawanye.
theological_decisions:
- issue: Ihe ὑπὲρ ἀσεβῶν pụtara banyere ọnwụ Mezaịa
  choice: n’ihi ndị na-adịghị asọpụrụ Chineke
  alternative: n’aha ndị na-adịghị asọpụrụ Chineke
  rationale: Isiokwu Grik ahụ kwuru n’ụzọ doro anya na ọnwụ Mezaịa bụ maka abamuru ndị na-adịghị asọpụrụ Chineke. “N’ihi” na-edobe ibu nkà mmụta okpukpe dị na ya ma ghara ikpebi kpọmkwem ma ọ bụ naanị nnọchite anya, ịnọchi, ma ọ bụ echiche ndị ọzọ dị n’okwu ὑπέρ.
translation_notes:
  register: E ji Standard Igbo dị ugbu a, dị ùgwù, ma dị mfe nghọta. A haziri ọnọdụ “n’oge kwesịrị ekwesị” ka ahịrịokwu ahụ daa nke ọma n’Igbo, ebe a na-edobe njikọ niile dị n’isiokwu Grik.
