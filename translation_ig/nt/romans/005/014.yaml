id: ROM.5.14
reference: Romans 5:14
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: ig
  text: Ma ọnwụ chịrị dị ka eze site n’oge Adam ruo n’oge Mosis, ọbụna n’ahụ ndị na-emeghị mmehie n’ụdị nke mmebi iwu Adam, onye bụ ihe atụ[a] nke Onye ahụ ga-abịa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya ‘ụkpụrụ’ ma ọ bụ ‘onyinyo na-atụ aka n’ihe ga-abịa.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘Onye ahụ nke ga-abịa.’ N’ọnọdụ okwu a, onye ahụ bụ Kraịst.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Ma
  rationale: Ọ na-egosi mgbanwe siri ike site n’ihe e kwuru tupu ya, ma bụrụkwa okwu njikọ doro anya n’Igbo.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: ọnwụ chịrị dị ka eze
  rationale: Nke a na-echekwa onyinyo ọchịchị eze dị na βασιλεύω nakwa otú Pọl si mee ọnwụ ka ọ dị ka onye na-achị.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: site n’oge Adam ruo n’oge Mosis
  rationale: Ịtinye ‘n’oge’ na-eme ka oge a na-ekwu maka ya doo anya ma bụrụ Igbo nkịtị.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: ọbụna n’ebe ndị na-emeghị mmehie ... nọ
  rationale: ‘Ọbụna’ na-egosi ihe ijuanya na ọchịchị ọnwụ ruru ndị a kwa; usoro ‘n’ebe ... nọ’ na-egosi ndị ọchịchị ahụ metụtara.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: yiri mmebi iwu Adam
  rationale: Nke a na-echekwa ntụnyere ahụ n’enweghị ịkọwa kpọmkwem ihe mere mmehie ha ji dị iche na nke Adam.
- source_word: παράβασις
  choice: mmebi iwu
  rationale: Ọ na-egosi ịgabiga ma ọ bụ imebi oke iwu e nyere, nke bụ isi echiche okwu Grik a.
- source_word: τύπος
  choice: ihe atụ
  rationale: N’ebe a, τύπος bụ onye ma ọ bụ ihe na-anọchi anya ma na-atụ aka n’ebe onye ọzọ nọ; ‘ihe atụ’ bụ okwu Igbo doro anya nke na-anaghị etinye nkọwa okpukpe karịrị ihe ederede kwuru.
- source_word: τοῦ μέλλοντος
  choice: Onye ahụ gaje ịbịa
  rationale: Nke a na-echekwa ọdịdị okwu ahụ dịka onye a na-atụ anya ya, n’etinyeghị ‘Kraịst’ ozugbo n’ahịrịokwu ahụ.
theological_decisions:
- issue: Onye okwu ‘Onye ahụ gaje ịbịa’ na-ezo aka na ya
  choice: E debere okwu ahụ n’ahịrịokwu dịka ‘Onye ahụ gaje ịbịa,’ ma kọwaa n’ala peeji na n’ọnọdụ a ọ na-ezo aka na Kraịst.
  alternative: Ịsụgharị ya ozugbo dịka ‘Kraịst.’
  rationale: Ndị Rom 5:12–21 na-egosi na Pọl na-atụnyere Adam na Kraịst, ma ederede Grik n’onwe ya ekwughị aha ‘Kraịst’ n’ebe a; ya mere nsụgharị ahụ na-echekwa ma okwu ahụ ma njikọ ya.
- issue: Ụdị myirịta dị n’etiti mmehie ndị ọzọ na mmebi iwu Adam
  choice: E debere ya dịka ‘na-emeghị mmehie yiri mmebi iwu Adam.’
  alternative: Ịkọwa ya dịka ndị na-enweghị iwu e nyere kpọmkwem dịka Adam nwere, ma ọ bụ dịka ndị na-emeghị mmehie n’onwe ha.
  rationale: Nkebi okwu Grik ahụ nwere ike iweta ajụjụ gbasara kpọmkwem ụzọ mmehie ha si dị iche; nsụgharị ahụ anaghị edozi esemokwu ahụ n’enweghị ihe ederede kwuru.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. ‘Chịrị dị ka eze’ na-echekwa okwu atụ nke ọnwụ dịka onye ọchịchị. E tinyere akara ala peeji [a] na [b] n’ebe okwu nke ọ bụla metụtara dị, kama iso ọnọdụ akara ndị ahụ na English consultation layer nke yiri ka ha gbanwere ebe.
