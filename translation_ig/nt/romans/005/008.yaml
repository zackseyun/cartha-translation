  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: ig
  text: Ma Chineke na-egosi ịhụnanya nke ya n’ebe anyị nọ[a], n’ihi na mgbe anyị ka bụ ndị mmehie, Mezaịa[b] nwụrụ maka anyị[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “maka anyị,” n’okwu ahụ bụ “ịhụnanya nke ya n’ebe anyị nọ.”
    reason: lexical_alternative
  - marker: b
    text: N’asụsụ Grik, Christos; a na-asụgharịkarị ya “Kraịst.” N’ebe a, a sụgharịrị ya “Mezaịa” dịka utu aha.
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “n’ihi ọdịmma anyị” ma ọ bụ “n’aha anyị.” Okwu Grik ahụ nwere ike igosi ime ihe maka ọdịmma mmadụ ma ọ bụ ịnọchite anya ya.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: na-egosi
  rationale: Okwu a dị n’oge ugbu a ma na-egosi ime ka ihe pụta ìhè. “Na-egosi” bụ Igbo nkịtị, doo anya, ma na-edobe ike nke ihe akaebe dị n’okwu Grik ahụ.
- source_word: δὲ
  choice: Ma
  rationale: Ọ na-egosi obere ntụgharị ma ọ bụ ọdịiche n’echiche e kwuru tupu ya; “Ma” na-arụ ọrụ ahụ nke ọma n’Igbo.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: ịhụnanya nke ya
  rationale: “Nke ya” na-edobe nkwusi ike dị na ἑαυτοῦ, ya bụ, ịhụnanya Chineke n’onwe ya.
- source_word: εἰς ἡμᾶς
  choice: maka anyị
  rationale: N’ebe a, okwu ahụ na-egosi ịhụnanya Chineke chere ihu n’ebe anyị nọ. “Maka anyị” bụ okwu Igbo dị mfe ma kwekọọ na usoro ahịrịokwu ahụ; e tinyere “n’ebe anyị nọ” n’ala peeji dịka ụzọ ọzọ.
- source_word: ὅτι
  choice: n’ụzọ dị otu a
  rationale: Ọ na-ebute nkọwa nke ụzọ Chineke si egosi ịhụnanya ya. Nhazi a na-eme ka njikọ ahụ doo anya n’Igbo n’enweghị ịgbanwe ya ka ọ bụrụ naanị ihe kpatara ihe.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: mgbe anyị ka bụ ndị mmehie
  rationale: Nke a na-edobe ma oge nke genitive absolute ahụ ma ike nke ἔτι (“ka”), n’Igbo dị mfe ma kwụ ọtọ.
- source_word: Χριστὸς
  choice: Mezaịa
  rationale: N’ebe a Χριστός na-arụ ọrụ dịka utu aha nke Onye E Tere Mmanụ, ya mere “Mezaịa” na-edobe ihe utu aha ahụ pụtara kama ime ya naanị aha mmadụ.
- source_word: ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  rationale: N’ebe a ὑπέρ na-egosi na ọnwụ ahụ bụ maka ọdịmma anyị ma ọ bụ n’ọnọdụ metụtara anyị. “N’ihi anyị” na-edobe obosara okwu Grik ahụ n’agbanyeghị na o nwere ike ịgụnye echiche nke ịnọchite anya.
- source_word: ἀπέθανεν
  choice: nwụrụ
  rationale: Nke a bụ ntụgharị Igbo kpọmkwem ma zuru ezu maka ngwaa aorist ahụ.
theological_decisions:
- issue: Ụzọ e si asụgharị Χριστός n’okwu Pọl
  choice: Mezaịa
  alternative: Kraịst
  rationale: N’ahịrịokwu a, okwu ahụ ka na-arụ ọrụ dịka utu aha nke onye e tere mmanụ. “Mezaịa” na-eme ka ihe ọ pụtara pụta ìhè, ebe ala peeji na-edobe “Kraịst,” ụdị a na-ejikarị eme ihe.
- issue: Ike okwu ὑπὲρ ἡμῶν
  choice: n’ihi anyị
  alternative: n’ọnọdụ anyị / n’aha anyị
  rationale: Amaokwu a kwuru n’ụzọ doro anya na ọnwụ Mezaịa metụtara anyị ma bụrụ maka ọdịmma anyị, ma preposition Grik ahụ n’onwe ya ekwesịghị ime ka a họrọ naanị otu nkọwa gbasara mgbapụta. Ya mere, isi ederede na-edobe okwu sara mbara, ebe ala peeji na-egosi nuance nke ịnọchite anya.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị mfe ma nwee nsọpụrụ. Ahịrịokwu ahụ na-agụ nke ọma n’olu, na-enweghị okwu ụka pụrụ iche nke otu ngalaba. “N’ụzọ dị otu a” na-eme ka akụkụ nke abụọ bụrụ nkọwa nke otú Chineke si egosi ịhụnanya ya; “ka bụ ndị mmehie” na-edobe esemokwu dị mkpa na isi mmalite ahụ.
