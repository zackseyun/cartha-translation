id: ROM.5.15
reference: Romans 5:15
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: ig
  text: Ma onyinye amara ahụ adịghị ka njehie ahụ.[a] N’ihi na ọ bụrụ na ọtụtụ mmadụ nwụrụ site na njehie nke otu nwoke ahụ, amara Chineke na onyinye ahụ nke sitere n’amara nke otu nwoke ahụ, bụ Jizọs Mezaya ahụ,[b] karịrị nnọọ jubiga ókè n’ebe ọtụtụ mmadụ nọ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A pụkwara ịsụgharị ya, ‘mmehie ahụ’ ma ọ bụ ‘nnupụisi ahụ.’
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, ‘Jizọs Kraịst.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: njehie
  rationale: ‘Njehie’ na-egosi omume ọjọọ ma ọ bụ ndapụ n’ihe ziri ezi, ma na-ada nke ọma n’Igbo ugbu a n’ọdịiche dị n’etiti Adam na Kraịst.
- source_word: χάρισμα
  choice: onyinye
  rationale: ‘Onyinye’ na-echekwa ọdịiche doro anya dị n’etiti njehie Adam na ihe Chineke nyere n’amara.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: ọtụtụ mmadụ
  rationale: Nke a na-echekwa okwu Pọl banyere otu onye na ọtụtụ mmadụ, na-agbanweghị ya ka ọ bụrụ ‘mmadụ niile.’
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: amara Chineke
  rationale: Nke a bụ ụzọ ebumpụta ụwa, dịkwa ùgwù, e si ekwu okwu ahụ n’Igbo.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: onyinye ahụ nke sitere n’amara
  rationale: Ọ na-egosi njikọ onyinye ahụ na amara n’Igbo doro anya, ma ghara ikpebi n’ụzọ siri ike ma ἐν ọ̀ bụ ụzọ e si nye ya ka ọ bụ ọnọdụ ya.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: otu nwoke ahụ
  rationale: Ọ na-echekwa ntụnyere siri ike nke Pọl mere n’etiti otu nwoke ahụ na ọtụtụ mmadụ.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Mezaya
  rationale: ‘Mezaya’ na-eme ka Χριστός nọgide bụrụ aha ọkwá ahụ e tere mmanụ, kama ime ya ka ọ bụrụ naanị aha ọzọ.
- source_word: ἐπερίσσευσεν
  choice: jubiga ókè
  rationale: Nkebiokwu a na-egosi ụba karịrị akarị nke ngwaa Grik ahụ ma kwekọọ n’okwu ‘lee ka ... si’.
theological_decisions:
- issue: Ókè ndị okwu ‘ọtụtụ mmadụ’ na-ezo aka na ha n’atụnyere Adam na Mezaya
  choice: E debere ‘ọtụtụ mmadụ’ n’ebe abụọ ahụ.
  alternative: Ịsụgharị ya ‘mmadụ niile.’
  rationale: Okwu Grik ahụ ji usoro ‘otu onye/ọtụtụ mmadụ’ mee arụmụka ya. Ịhapụ ya otú ahụ na-echekwa esemokwu na ohere nkọwa dị n’amaokwu ahụ n’etinyeghị nkwubi okwu nkà mmụta okpukpe ọzọ.
- issue: Ụdị njikọ ἐν χάριτι
  choice: ‘nke sitere n’amara’
  alternative: ‘nke dị n’amara’ ma ọ bụ ‘nke e nyere site n’amara’
  rationale: Nhọrọ a bụ Igbo a na-aghọta ngwa ngwa ma na-echekwa njikọ onyinye ahụ na amara n’enweghị imechi nghọta Grik ahụ naanị n’ụzọ instrumental.
translation_notes:
  register: Standard Igbo dị ugbu a, dị ùgwù ma dị mfe nghọta. E jiri ‘Jizọs Mezaya’ mee ka aha ọkwá Χριστός pụta ìhè; e tinyere akara nkọwa ụkwụ [a] na [b] kpọmkwem n’ebe okwu ha metụtara dị.
