revisions:
- from: Ma onyinye ahụ adịghị ka njehie ahụ.[a] N’ihi na ọ bụrụ na ọtụtụ mmadụ nwụrụ n’ihi njehie nke otu nwoke ahụ, lee ka amara Chineke na onyinye ahụ nke sitere n’amara otu nwoke ahụ, bụ Jizọs Mezaya,[b] si jubiga ókè ruo ọtụtụ mmadụ!
  to: Ma onyinye amara ahụ adịghị ka njehie ahụ.[a] N’ihi na ọ bụrụ na ọtụtụ mmadụ nwụrụ site na njehie nke otu nwoke ahụ, amara Chineke na onyinye ahụ nke sitere n’amara nke otu nwoke ahụ, bụ Jizọs Mezaya ahụ,[b] karịrị nnọọ jubiga ókè n’ebe ọtụtụ mmadụ nọ.
  rationale: The revision explicitly translates πολλῷ μᾶλλον with “karịrị nnọọ,” preserves the source’s one/many wording without resolving its scope, and makes the translated messianic title more idiomatic. The existing footnote markers remain attached to their relevant terms and require no structural changes.
  reviewer_model: gpt-5.6-terra
