id: ROM.5.17
reference: Romans 5:17
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: ig
  text: N’ihi na ọ bụrụ na ọnwụ chịrị site n’aka otu onye ahụ n’ihi mmehie otu onye ahụ, ọ ga-aka nnọọ ka ndị na-anata ụba amara na onyinye nke ezi omume[a] ga-achị na ndụ site n’aka otu onye ahụ, Jizọs Kraịst[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onyinye nke ikpe ziri ezi.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “Jizọs Mesaịa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: mmehie
  rationale: “Mmehie” bụ okwu Igbo doro anya maka mmebi ma ọ bụ nkwahie mmadụ; n’ebe a, ọ na-ezo aka ná mmehie Adam nke e ji atụnyere ọrụ Kraịst, ọ bụghị nanị njehie a na-eme n’amaghị ama.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: chịrị / chịa
  rationale: E jigidere ihe atụ gbasara ọchịchị eze dị na ngwaa Grik abụọ ahụ, nakwa myirịta dị n’etiti ọchịchị ọnwụ na ọchịchị ndị natara onyinye ahụ.
- source_word: περισσείαν
  choice: ụba
  rationale: “Ụba” na-egosi ịdị ukwuu na ịba ụba nke amara n’asụsụ Igbo dị mfe ma dị ugwu.
- source_word: χάριτος
  choice: amara
  rationale: “Amara” bụ okwu Igbo a na-ejikarị akọwa ihu ọma Chineke nke a na-enye n’efu, ọ dabakwara n’echiche Pọl n’ebe a.
- source_word: δωρεᾶς
  choice: onyinye
  rationale: “Onyinye” na-anọchi δωρεά nke ọma; okwu gbara ya gburugburu egosilarị na ọ bụ ihe e nyere, ya mere ọ dịghị mkpa ịgbakwunye okwu ọzọ pụtara ‘n’efu.’
- source_word: δικαιοσύνης
  choice: ezi omume
  rationale: “Ezi omume” na-anọchi echiche δικαιοσύνη nke ịbụ onye ziri ezi n’ihu Chineke n’okwu Pọl, ma e debere echiche ọzọ nke ikpe ziri ezi n’ala ala peeji.
- source_word: λαμβάνοντες
  choice: ndị na-anata
  rationale: Ụdị a na-egosi ndị a maara site n’ịnara ụba amara na onyinye ahụ, dịka participle Grik si eme.
- source_word: ἐν ζωῇ
  choice: n’ime ndụ
  rationale: Nsụgharị a na-edobe okwu Grik dị mkpirikpi ma na-echekwa ọdịiche ya na ọnwụ nke chịrị.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jizọs Kraịst
  rationale: N’usoro aha a, Χριστός na-arụ ọrụ dịka aha-utu aha e jikọtara na Jizọs; “Jizọs Kraịst” bụkwa ụdị Igbo ebumpụta ụwa, ebe a na-edobe “Mesaịa” dịka ụzọ ọzọ.
theological_decisions:
- issue: Ihe δικαιοσύνης pụtara n’okwu Pọl a
  choice: onyinye nke ezi omume
  alternative: onyinye nke ikpe ziri ezi
  rationale: “Ezi omume” dabara n’ọnọdụ ozizi ime ka mmadụ bụrụ onye ezi omume nke gbara amaokwu a gburugburu, ma “ikpe ziri ezi” ka bụ akụkụ okwu Grik ahụ nwere ike ịpụta; ya mere e debere ya n’ala ala peeji kama ikpochapụ ya.
- issue: Otú e si akọwa Χριστοῦ n’usoro Ἰησοῦ Χριστοῦ
  choice: Jizọs Kraịst
  alternative: Jizọs Mesaịa
  rationale: N’ebe a, aha-utu aha ahụ sochiri aha Jizọs n’ụdị na-arụ ọrụ dịka aha a maara ya, nke “Jizọs Kraịst” na-egosipụta n’Igbo. “Mesaịa” na-eme ka ọrụ utu aha ahụ pụta ìhè, ya mere e nyere ya dịka ụzọ ọzọ.
- issue: Ndị ga-achị na ndụ
  choice: ndị na-anata ụba amara na onyinye ahụ ga-achị
  alternative: ọnwụ agaghịzi achị ha naanị
  rationale: E jigidere nkwupụta siri ike nke Grik na ndị ahụ n’onwe ha ‘ga-achị,’ kama ime ka ọ bụrụ naanị okwu na ọnwụ agaghị achị ha; nke a na-echekwa ihe atụ eze na esemokwu nkà mmụta okpukpe dị n’okwu ahụ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma dị mfe nghọta. A haziri ahịrịokwu ahụ ka mmekọrịta ihe kpatara ya na nsonaazụ ya doo anya, ebe e chekwara ugboro ugboro nke “otu onye ahụ,” ihe atụ nke ọchịchị, na ọdịiche dị n’etiti ọnwụ na ndụ.
