revisions:
- from: N’ihi na ọ bụrụ na[a], mgbe anyị bụ ndị iro, e mere ka anyị na Chineke dịghachi ná mma site n’ọnwụ Ọkpara ya, ọ ga-akacha doo anya na, ebe e mere ka anyị na ya dịghachi ná mma, a ga-azọpụta anyị site ná ndụ ya.
  to: N’ihi na, ọ bụrụ na e mere ka anyị na Chineke dịghachi ná mma mgbe anyị bụ ndị iro site n’ọnwụ Ọkpara ya, ọtụtụ karịa, ugbu a e mere ka anyị dịghachi ná mma, a ga-azọpụta anyị site ná ndụ ya[b].
  rationale: The revision restores the comparative, a-fortiori force of πολλῷ μᾶλλον without adding the idea of evidential certainty. It retains the passive wording for reconciliation and salvation, retains the instrumental rendering of the final phrase as the main text, and adds an anchored alternative that preserves the ambiguity of ἐν.
