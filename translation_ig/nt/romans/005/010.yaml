id: ROM.5.10
reference: Romans 5:10
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: ig
  text: N’ihi na, ọ bụrụ na e mere ka anyị na Chineke dịghachi ná mma mgbe anyị bụ ndị iro site n’ọnwụ Ọkpara ya, ọtụtụ karịa, ugbu a e mere ka anyị dịghachi ná mma, a ga-azọpụta anyị site ná ndụ ya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ma ọ bụ, “n’ime ndụ ya.”
    reason: ἐν τῇ ζωῇ αὐτοῦ nwere ike igosi ọnọdụ ma ọ bụ njikọ (“n’ime ndụ ya”), ọ bụghị naanị ụzọ ma ọ bụ ihe e ji eme ihe (“site ná ndụ ya”).
lexical_decisions:
- source_word: εἰ γὰρ
  choice: N’ihi na ọ bụrụ na
  rationale: “N’ihi na” na-ejigide njikọ arụmụka γάρ, ebe “ọ bụrụ na” na-egosipụta εἰ n’enweghị ịgbanwe ya ka ọ bụrụ nkwupụta doro anya.
- source_word: ἐχθροὶ ὄντες
  choice: mgbe anyị bụ ndị iro
  rationale: Nke a na-egosipụta ọnọdụ ha nọ na ya tupu e mee ka ha na Chineke dịghachi ná mma; “ndị iro” na-echekwa ike okwu ἐχθροί.
- source_word: κατηλλάγημεν
  choice: e mere ka anyị na Chineke dịghachi ná mma
  rationale: Ụdị a na-echekwa passive ahụ ma na-ekwupụta mweghachi nke mmekọrịta n’Igbo dị mfe ma doo anya.
- source_word: τῷ θεῷ
  choice: na Chineke
  rationale: N’usoro okwu Igbo “ime ka mmadụ na onye ọzọ dịghachi ná mma,” “na Chineke” na-egosipụta onye e mere ka mmekọrịta anyị na ya dịghachi mma.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: site n’ọnwụ Ọkpara ya
  rationale: “Site na” na-egosipụta ụzọ ma ọ bụ ihe e ji mee ya dịka διά na genitive si dị; “Ọkpara ya” na-echekwa aha mmekọrịta nke Ọkpara Chineke.
- source_word: πολλῷ μᾶλλον
  choice: ọ ga-akacha doo anya na
  rationale: 'Nke a na-enye ike arụmụka a-fortiori nke Pọl n’Igbo nkịtị: ma nke mbụ mere, nke na-esote kwesịkwara ịdị nnọọ ka o doo anya.'
- source_word: καταλλαγέντες
  choice: ebe e mere ka anyị na ya dịghachi ná mma
  rationale: “Ebe” na-egosi na ime ka ha dịghachi ná mma eburu nzọpụta ọdịnihu ụzọ, ma passive ahụ ka dị.
- source_word: σωθησόμεθα
  choice: a ga-azọpụta anyị
  rationale: Nke a na-echekwa future passive na echiche nzọpụta nke σῴζω.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: site ná ndụ ya
  rationale: “Site ná” na-enye instrumental sense nke dabara na ntụnyere ọnwụ/ndụ, ma e debere locative/associative sense n’okpuru ala.
theological_decisions:
- issue: Ike okwu ἐν τῇ ζωῇ αὐτοῦ
  choice: 'instrumental: “site ná ndụ ya”'
  alternative: 'locative/associative: “n’ime ndụ ya”'
  rationale: Ntunyere ya na “site n’ọnwụ Ọkpara ya” na-akwado echiche na ndụ Ọkpara ahụ bụ ụzọ e si azọpụta; ma ebe ἐν nwekwara ike ịpụta ọnọdụ ma ọ bụ njikọ, e chekwara nke ahụ n’okpuru ala n’etinyeghị mbilite n’ọnwụ n’ahịrịokwu ahụ.
- issue: Ọnọdụ ndị mmadụ dịka ἐχθροί
  choice: “ndị iro”
  alternative: “ndị na-emegide Chineke”
  rationale: “Ndị iro” na-echekwa mkpirikpi na esemokwu mmekọrịta nke okwu Grik ahụ, n’ebughị ụzọ kpebie ma ọ na-elekwasị anya n’iro mmadụ megide Chineke ma ọ bụ ọnọdụ iro n’etiti ha.
translation_notes:
  register: Standard Igbo, n’asụsụ ugwu ma dị ùgwù, ma bụrụkwa nke ndị nkịtị ga-aghọta. E ji “Ọkpara” mee ihe maka υἱός n’aha Kraịst. Akara [a] dị n’ahịrị isi; akara [b] na-akọwa okwu ikpeazụ ma kwesị ịpụta n’ahịrị isi ka o kwekọọ n’iwu akara ala.
