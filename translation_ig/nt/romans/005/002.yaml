id: ROM.5.2
reference: Romans 5:2
language:
  code: ig
  name: Igbo
  native_name: Igbo
  variant: Standard Igbo
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: ig
  text: 'Site n’aka ya ka anyị ji okwukwe enwetawo ohere ịbata n’amara a nke anyị guzo n’ime ya, anyị na-anya isi kwa n’olileanya nke ebube Chineke.[a]


    [a] Ma ọ bụ, “anyị na-aṅụrị ọṅụ” ma ọ bụ “anyị na-enwe ọṅụ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “anyị na-aṅụrị ọṅụ” ma ọ bụ “anyị na-enwe ọṅụ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: site n’aka ya
  rationale: Nke a bụ ụzọ Igbo dị ndụ si egosi na ọ bụ Kraịst ka e si n’aka ya nata ihe a, na-enweghị ịgbakwụnye aha na-adịghị n’amaokwu a.
- source_word: προσαγωγή
  choice: ohere ịbata
  rationale: Ọ na-egosi ohere e nyere mmadụ ịbata n’ọnọdụ amara Chineke; ọ dị mfe nghọta karịa okwu nkịtị nke pụrụ ịdị ka nanị ‘mbata.’
- source_word: τῇ πίστει
  choice: anyị ji okwukwe
  rationale: Dative a na-egosi ụzọ e si nweta ohere ahụ. ‘Ji okwukwe’ bụ usoro Igbo nkịtị maka echiche a.
- source_word: χάριν
  choice: amara
  rationale: ‘Amara’ bụ okwu Igbo a nabatara nke ọma maka χάρις n’ọnọdụ Pọl a, ma na-echekwa echiche banyere ihu ọma Chineke nke a na-enye n’efu.
- source_word: ἑστήκαμεν
  choice: anyị guzo n’ime ya
  rationale: Perfect ahụ na-egosi ọnọdụ dị ugbu a nke sitere n’ihe mere na mbụ. Nsụgharị a na-echekwa ihe atụ nke iguzo na ọnọdụ ahụ.
- source_word: καυχώμεθα
  choice: anyị na-anyakwa isi
  rationale: ‘Ịnya isi’ na-echekwa ike na ntakịrị mgbagwoju anya nke okwu Grik ahụ karịa ‘ịṅụrị ọṅụ,’ ma ihe njikọ ‘-kwa’ na-egosipụta καί.
- source_word: ἐπ’ ἐλπίδι
  choice: n’olileanya
  rationale: Ọ bụ okwu Igbo doro anya nke na-ahapụ olileanya ka ọ bụrụ ihe ma ọ bụ ọnọdụ nke ịnya isi ahụ dabeere na ya.
- source_word: δόξης τοῦ θεοῦ
  choice: nke ebube Chineke
  rationale: Nke a na-echekwa usoro genitive Grik ahụ n’ụzọ dị ebube ma doo anya n’Igbo.
theological_decisions:
- issue: Ichekwa esemokwu dị n’iji καυχώμεθα mee ihe n’ụzọ ọma
  choice: anyị na-anyakwa isi
  alternative: anyị na-aṅụrị ọṅụ
  rationale: Ọ bụ ezie na ‘ịnya isi’ nwere ike ịdị ka ihe ọjọọ n’ọnụ onye Igbo, ọ na-echekwa ike okwu Pọl na njikọ ya na ojiji okwu a n’ebe ndị ọzọ. Ihe odide ala ala peeji nyere ụzọ dị nro karị n’emeghị ka ọ bụrụ isi ihe e dere.
- issue: Ihe δόξα τοῦ θεοῦ pụtara kpọmkwem
  choice: ebube Chineke
  alternative: ebube sitere n’aka Chineke ma ọ bụ ebube Chineke ga-ekekọrịta ndị kwere ekwe
  rationale: Genitive Grik ahụ nwere ike ibu ihe karịrị otu nghọta. Nsụgharị a anaghị ekpebi ma ọ bụ ebube nke Chineke n’onwe ya, ebube o nyere, ma ọ bụ ikere òkè n’ebube ya.
translation_notes:
  register: Ejiri Standard Igbo nke oge a, dị nsọ ma dị mfe nghọta. E debere ihe atụ ‘iguzo n’amara’ na ike okwu ‘ịnya isi.’ A tinyere akara [a] ozugbo n’akụkụ okwu ọ na-akọwa, bụ καυχώμεθα, kama itinye ya n’akụkụ ‘anyị guzo’.
