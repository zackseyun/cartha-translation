  variant: Standard Igbo
source:
  edition: SBLGNT
  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: ig
  text: N’ihi na ọ fọrọ nke nta ka mmadụ ọ bụla ghara ịnwụ n’ihi onye ezi omume[b][a]; ma eleghị anya, mmadụ pụrụ ọbụna inwe obi ike ịnwụ n’ihi onye ọma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “nwoke ezi omume.” Okwu Grik ahụ dị n’ụdị ụtọasụsụ nke nwoke, ma o yiri ka ọ na-anọchi anya mmadụ n’ozuzu ebe a.
    reason: lexical_alternative
  - marker: b
    text: O nwere ike ịbụ na e kpachapụrụ anya mee ọdịiche dị n’etiti “onye ezi omume” na “onye ọma,” ọ bụghị naanị iji okwu abụọ dị iche chọọ ahịrịokwu ahụ mma.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: o siri ike
  rationale: Na-egosi na ihe ahụ fọrọ nke nta ka ọ ghara ime; nke a bụ ụzọ Igbo dị ndụ si kwupụta echiche nke ‘hardly’ n’ọnọdụ a.
- source_word: ὑπὲρ
  choice: n’ihi
  rationale: N’ebe a ọ na-egosi ịnwụ maka ọdịmma onye ọzọ ma ọ bụ n’ọnọdụ ya; ‘n’ihi’ bụ okwu Igbo dị mfe nke na-eburu echiche ahụ n’ahịrịokwu a.
- source_word: δικαίου
  choice: onye ezi omume
  rationale: Ọ bụ adjective e ji dị ka aha mmadụ, na-akọwa onye omume ya ziri ezi. Nhọrọ a na-echekwa echiche omume ziri ezi ma ghara ịkpọ naanị nwoke.
- source_word: ἀποθανεῖται
  choice: ịnwụ
  rationale: Infinitive Igbo a na-arụ ọrụ nke ọma mgbe e jikọtara ya na ‘o siri ike mmadụ ...’, ma na-eburu nkwupụta izugbe nke ọdịnihu Grik.
- source_word: τοῦ ἀγαθοῦ
  choice: onye ọma
  rationale: Na-echekwa ọdịiche okwu dị n’etiti δικαίου, ‘onye ezi omume,’ na ἀγαθοῦ, ‘onye ọma,’ n’agbanyeghị na ihe dị iche kpọmkwem n’etiti ha ka nwere ike ịdị mgbagwoju anya.
- source_word: τάχα
  choice: ma eleghị anya
  rationale: Na-egosi ihe pụrụ ime n’enweghị ikwusi ya ike dị ka ihe doro anya.
- source_word: καὶ
  choice: ọbụna
  rationale: 'E ji ya bulie ike okwu ahụ: mmadụ pụrụ ruo n’ókè nke ịnwa anwa ịnwụ.'
- source_word: τολμᾷ
  choice: pụrụ ọbụna ịnwa anwa
  rationale: Na-egosipụta ohere na obi ike dị mkpa ime ihe ahụ, n’ụzọ kwekọrọ na τάχα na καί.
- source_word: ἀποθανεῖν
  choice: ịnwụ
  rationale: Nsụgharị kwụ ọtọ nke infinitive ahụ, nke na-echekwa nkwughachi isiokwu ọnwụ n’akụkụ abụọ ahụ.
theological_decisions:
- issue: Ma a ga-echekwa ọdịiche dị n’etiti δικαίου na ἀγαθοῦ
  choice: A sụgharịrị ha iche dịka ‘onye ezi omume’ na ‘onye ọma.’
  alternative: Ịsụgharị ha dịka okwu abụọ pụtara otu ihe, ma ọ bụ iji otu okwu Igbo mee ha abụọ.
  rationale: O nwere ike ịbụ na Pọl kpachapụrụ anya mee ọdịiche a. Ichekwa okwu abụọ ahụ na-ahapụ esemokwu na nghọta dị na Grik ka ọ dị, kama idozi ya n’enweghị ihe akaebe zuru ezu.
- issue: Ike nwoke dị na ụdị ụtọasụsụ δικαίου na τοῦ ἀγαθοῦ
  choice: E ji ‘onye’ nke nwere ike ịgụnye mmadụ ọ bụla.
  alternative: ‘Nwoke ezi omume’ na ‘nwoke ọma.’
  rationale: Ọ bụ ezie na Grik ahụ dị n'ụdị masculine, ihe a na-ekwu bụ eziokwu izugbe banyere mmadụ; Igbo ‘onye’ na-egosipụta nke ahụ nke ọma n’enweghị iwepụ nhọrọ nkịtị ọzọ.
translation_notes:
  register: E ji Standard Igbo nke oge a, dị ugwu ma doo ndị nkịtị anya. Ahịrịokwu ahụ na-echekwa nkwughachi ‘ịnwụ,’ ọdịiche dị n’etiti ‘onye ezi omume’ na ‘onye ọma,’ na ụda nke ihe siri ike ime ma ka pụrụ ime.
