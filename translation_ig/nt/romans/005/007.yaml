revisions:
- from: N’ihi na o siri ike mmadụ ọ bụla ịnwụ n’ihi onye ezi omume[b][a]; ma eleghị anya, mmadụ pụrụ ọbụna ịnwa anwa ịnwụ n’ihi onye ọma.
  to: N’ihi na ọ fọrọ nke nta ka mmadụ ọ bụla ghara ịnwụ n’ihi onye ezi omume[b][a]; ma eleghị anya, mmadụ pụrụ ọbụna inwe obi ike ịnwụ n’ihi onye ọma.
  rationale: The first clause is revised to express the rarity intended by μόλις rather than the inherent difficulty of dying. The second replaces an ‘attempt’ expression with a natural expression for daring. No doctrinal interpretation is added, and the Greek distinction between the righteous person and the good person remains visible.
