  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: ig
  text: Onyinye ahụ adịghịkwa ka ihe sitere n’aka otu onye ahụ mehieworo.[a] N’ihi na ikpe ahụ, nke sitere n’otu mmehie,[b] dugara ná ikpe ọmụma; ma onyinye amara ahụ, nke sitere n’ọtụtụ mmehie, dugara n’ịgụ mmadụ dịka onye ezi omume.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ma ọ bụ, “onyinye ahụ adịghị ka ihe sitere n’aka otu nwoke mehieworo.”
    reason: lexical_alternative
  - marker: b
    text: Ma ọ bụ, “nke sitere n’otu mmebi iwu.”
    reason: lexical_alternative
  - marker: c
    text: Ma ọ bụ, “dugara ná mkpebi ikpe ziri ezi,” ma ọ bụ “dugara n’ịtọhapụ mmadụ n’ikpe.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: onyinye ahụ
  rationale: “Onyinye” bụ okwu Igbo doro anya maka ihe e nyere; ọ dịghị mkpa ịgbakwunye “n’efu,” ebe echiche nke inye ihe dịlarị n’okwu ahụ.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: ihe si n’aka otu onye ahụ mere mmehie bịa
  rationale: Nke a na-echekwa ntụaka nke onye ahụ—Adam—nakwa mkpirisi na-edochaghị ihe niile anya dị n’asụsụ Grik, n’etinyeghị nkọwa karịrị ihe e dere.
- source_word: κρίμα
  choice: ikpe ahụ
  rationale: N’ebe a κρίμα bụ mkpebi ikpe; “ikpe” bụ okwu nkịtị, doro anya, nke dabara na ntụnyere ya na ikpe ọmụma na ịgụ mmadụ n’onye ezi omume.
- source_word: ἐξ ἑνὸς
  choice: nke sitere n’otu mmehie
  rationale: ἑνός nwere ike ịtụ aka n’otu mmehie, karịchaa n’ihi na e jiri ya tụnyere “ọtụtụ mmehie” n’ọkara nke abụọ. E tinyere “mmehie” ka Igbo wee doo anya.
- source_word: κατάκριμα
  choice: ikpe ọmụma
  rationale: Okwu a na-egosi mkpebi ikpe nke na-ama mmadụ ikpe; “ikpe ọmụma” na-echekwa ụda okwu ụlọikpe na ọdịiche ya na δικαίωμα.
- source_word: χάρισμα
  choice: onyinye amara ahụ
  rationale: χάρισμα bụ onyinye sitere n’amara. “Onyinye amara” na-egosipụta njikọ ahụ ma na-ekewapụ ya ntakịrị na δώρημα nke mbụ.
- source_word: παραπτωμάτων
  choice: mmehie
  rationale: N’ebe a παράπτωμα na-ezo aka n’omume mmebi iwu ma ọ bụ nzọụkwụ na-ezighị ezi. “Mmehie” bụ okwu Igbo eke na nke ndị mmadụ na-aghọta ngwa ngwa; nkọwa ọzọ dị na ndetu ala peeji.
- source_word: δικαίωμα
  choice: ịgụ mmadụ n’onye ezi omume
  rationale: N’ụdị okwu ụlọikpe a, okwu ahụ na-egosi nsonaazụ megidere ikpe ọmụma. Nkebi a na-egosipụta omume/mkpebi nke ikwu na mmadụ bụ onye ezi omume, kama iji okwu nkà mmụta okpukpe siri ike.
theological_decisions:
- issue: Ike okwu ụlọikpe nke δικαίωμα mgbe e tinyere ya megide κατάκριμα
  choice: ịgụ mmadụ n’onye ezi omume dị ka nsonaazụ ikpe nke megidere ikpe ọmụma
  alternative: ikpe ziri ezi; ịtọhapụ mmadụ n’ikpe
  rationale: 'Nhazi amaokwu ahụ bụ ntụnyere okwu ikpe: ikpe na ikpe ọmụma megide onyinye amara na δικαίωμα. Nsụgharị a na-echekwa ọdịiche ahụ ma ghara imechi ụzọ nye nghọta ya dịka “ikpe ziri ezi” ma ọ bụ “ịtọhapụ n’ikpe.”'
translation_notes:
  register: Ejiri Standard Igbo nke oge a, nke nwere ugwu ma dị mfe nghọta. E chekwara ụda okwu ụlọikpe nke amaokwu ahụ site n’iji “ikpe,” “ikpe ọmụma,” na “ịgụ mmadụ n’onye ezi omume.” Akara ndetu [a], [b], na [c] niile pụtara n’ederede isi.
