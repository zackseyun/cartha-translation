revisions:
- from: Onyinye ahụ adịghịkwa ka ihe si n’aka otu onye ahụ mere mmehie bịa.[a] N’ihi na ikpe ahụ, nke sitere n’otu mmehie,[b] dugara ná ikpe ọmụma; ma onyinye amara ahụ, nke sitere n’ọtụtụ mmehie, dugara n’ịgụ mmadụ n’onye ezi omume.[c]
  to: Onyinye ahụ adịghịkwa ka ihe sitere n’aka otu onye ahụ mehieworo.[a] N’ihi na ikpe ahụ, nke sitere n’otu mmehie,[b] dugara ná ikpe ọmụma; ma onyinye amara ahụ, nke sitere n’ọtụtụ mmehie, dugara n’ịgụ mmadụ dịka onye ezi omume.[c]
  rationale: The revision makes two limited idiomatic corrections only. It retains the Greek ellipsis and judicial contrasts, does not identify the unnamed sinner beyond the source text, and retains all three footnote anchors and their alternatives.
  reviewer_model: gpt-5.6-terra
