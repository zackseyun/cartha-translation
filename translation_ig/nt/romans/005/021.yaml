revisions:
- from: ka mmehie[a] wee chịa n’ọnwụ, dịka o chịrị, ka amara sikwa n’ezi omume[b] chịa, ruo ná ndụ ebighị ebi site n’aka Jizọs bụ Mesaya, Onyenwe anyị.
  to: ka[a], dịka mmehie siri chịa n’ọnwụ, otú ahụkwa amara wee chịa site n’ezi omume[b] ruo ná ndụ ebighị ebi site n’aka Jizọs, bụ Mesaya na Onyenwe anyị.
  rationale: 'The revised text follows the Greek syntax and sequence: the past reign of sin in death is introduced by “dịka ... siri chịa,” while the intended/resulting reign of grace is expressed by “ka ... wee chịa.” It retains the source’s ambiguity in the royal metaphor and in δικαιοσύνη, while using idiomatic modern Standard Igbo.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:25:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft reverses the Greek comparison: it first says that sin may reign and then refers back to its past reign. The source instead states, “just as sin reigned in death,” followed by the purpose/result that grace may reign. The revision restores the indicative past reference for sin (ἐβασίλευσεν) and the ἵνα + subjunctive clause for grace (βασιλεύσῃ).'
  naturalness: The revised comparison, “dịka ... siri chịa ... otú ahụkwa ... wee chịa,” is natural Standard Igbo and clearly preserves Paul’s personified royal metaphor. Moving the contextual-syntax footnote marker to “ka” also makes its attachment clear.
  terminology: “Amara,” “ezi omume,” “ndụ ebighị ebi,” “Mesaya,” and “Onyenwe anyị” are suitable. “Ezi omume” retains δικαιοσύνη without narrowing it to legal justice; the alternative “ikpe ziri ezi” remains properly footnoted. “Jizọs, bụ Mesaya na Onyenwe anyị” renders Jesus Christ our Lord with Christ as a meaningful title rather than imposing a denominational formulation.
  issues:
  - severity: high
    issue: The comparative clauses are in the wrong order and assign the prospective form to sin.
    rationale: “ka mmehie ... wee chịa n’ọnwụ, dịka o chịrị” does not correspond to ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ... οὕτως ... ἡ χάρις βασιλεύσῃ. The past reign of sin must precede and ground the prospective reign of grace.
  - severity: low
    issue: Footnote a is anchored to “mmehie” rather than to the governing particle “ka.”
    rationale: The note concerns the continuation and force of the ἵνα clause, not the lexical sense of “mmehie.”
  revised_text: ka[a], dịka mmehie siri chịa n’ọnwụ, otú ahụkwa amara wee chịa site n’ezi omume[b] ruo ná ndụ ebighị ebi site n’aka Jizọs, bụ Mesaya na Onyenwe anyị.
  revised_footnotes:
